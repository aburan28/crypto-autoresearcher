    script: "\"\"\"Whitelist value grep v4 for TASK-20261002-1d1f48 (plan REVIEW-NISTBIN-20261002-bc5bd5 blind_rederivation.forward_precondition\
      \ steps (1) and (4)). Mechanical; adapted from whitelist-grep-v3's script (TASK-20261002-2a3049).\"\"\"\nimport json,\
      \ re, sys, math, yaml, decimal\nREPO='/home/user/crypto-autoresearcher'\nC4='/tmp/claude-0/-home-user/f42055f8-3588-569d-b7d9-926d696d2468/scratchpad/BATCH-bc5bd5/TASK-20261002-e11714/c4.out'\n\
      plan=yaml.safe_load(open(REPO+'/coordination/review/nistbin-20261002-bc5bd5/review-plan.yaml'))\nplan=plan.get('review_plan',plan)\n\
      files=[re.sub(r'\\s*\\(.*\\)\\s*$','',w).strip() for w in plan['blind_rederivation']['whitelist']]\nextra=sys.argv[1:]\
      \  # step (4): only grep these files\nINT_KEYS={'m_star','runner_up_m','smallest_at_m','nvar_C8','nvar','N5','N5_rounded','N5_ceiled','n_times_t_minus_1','block_n4w_m_star',\n\
      \          'D_ps','D_cum','DELTA7_argmax','no_later_for_crossings_in','no_earlier_for_crossings_from','undetermined_at_crossing',\n\
      \          'scored_cells_D_star','D_star','D_star_lo','D_star_hi'}\nfloats=set(); ints=set()\ndef walk(o,k=None):\n\
      \    if isinstance(o,dict): [walk(v,kk) for kk,v in o.items()]\n    elif isinstance(o,list): [walk(v,k) for v in o]\n\
      \    elif isinstance(o,bool): pass\n    elif isinstance(o,float): floats.add(repr(o))\n    elif isinstance(o,int) and\
      \ k in INT_KEYS: ints.add(o)\nd=json.load(open(C4)); walk(d)\n# carried Q1 and Q2 values (DEC-20260925-41f6dc R-J9),\
      \ their argmins and Q1 k values (as in v3)\nfor v in ['279.7471','284.8257','136.2534','140.8257','38.8257','43.8257','174.5818','176.2018','186.307','147.649','159.5451']:\
      \ floats.add(v)\nints |= {12,9,10,15,11,359,1}\nints |= {15,9}  # NF-01, NF-02 integer constants carried in CB-1 (as\
      \ in v3)\nD=decimal.Decimal\ndef forms(s):\n    x=D(s).copy_abs(); out=set()\n    for p in (1,2,3,4):\n        q=D(1).scaleb(-p)\n\
      \        for r in (x.quantize(q,rounding=decimal.ROUND_HALF_EVEN), x.quantize(q,rounding=decimal.ROUND_HALF_UP), x.quantize(q,rounding=decimal.ROUND_DOWN)):\n\
      \            if r!=0: out.add(format(r,'f'))\n    return out\ndec_terms=set()\nfor s in floats: dec_terms |= forms(s)\n\
      sci=[]\nfor s in floats:\n    x=abs(float(s))\n    if x==0 or not math.isfinite(x): continue\n    e=int(math.floor(math.log10(x)));\
      \ m=x/10**e\n    for p in (1,2,3,4):\n        for mm in {f'{m:.{p}f}', format(D(repr(m)).quantize(D(1).scaleb(-p),rounding=decimal.ROUND_DOWN),'f')}:\n\
      \            sci.append((mm,e))\npats=[]\nfor t in sorted(dec_terms,key=lambda z:(len(z),z)):\n    pats.append(('decimal\
      \ (bare; also covers 2^x, 2^{x}, 2**x)',t,re.compile(r'(?<![0-9.])'+re.escape(t)+r'(?![0-9])')))\nfor mm,e in sorted(set(sci)):\n\
      \    pats.append(('scientific',f'{mm}e{e}',re.compile(r'(?<![0-9.])'+re.escape(mm)+r'\\s*(?:[eE][+]?0*'+str(e)+r'|[x×*]\\\
      s*10\\s*\\^\\s*\\{?\\s*'+str(e)+r'\\s*\\}?)(?![0-9])')))\nPREF=[r'm\\s*=\\s*',r'm\\*\\s*=\\s*',r'D\\s*=\\s*',r'D\\*\\\
      s*=\\s*',r'D\\*\\(m\\)\\s*=\\s*',r'D_ps\\s*=\\s*',r'D_cum\\s*=\\s*',r'N\\s*=\\s*']\nfor i in sorted(ints):\n    for\
      \ p in PREF: pats.append(('integer prefixed',p.replace(r'\\s*',' ').replace('\\\\','')+str(i),re.compile(r'(?<![A-Za-z_])'+p+str(i)+r'(?![0-9.])')))\n\
      \    pats.append(('integer list form',f'list:{i}',re.compile(r'[\\[(,]\\s*'+str(i)+r'\\s*(?=[,\\])])')))\nhits=[]\n\
      targets=extra or files\nfor f in targets:\n    try: lines=open(REPO+'/'+f,encoding='utf-8',errors='replace').read().split('\\\
      n')\n    except FileNotFoundError: hits.append({'file':f,'line':None,'note':'file does not exist at grep time'}); continue\n\
      \    for n,l in enumerate(lines,1):\n        for kind,term,rx in pats:\n            if rx.search(l): hits.append({'file':f,'line':n,'form':kind,'term':term})\n\
      summary={'values_decimal':len(floats),'values_integer':len(ints),'search_patterns':len(pats),'files':targets,'hit_count':len(hits)}\n\
      print(json.dumps({'summary':summary,'hits':hits}))\n"
