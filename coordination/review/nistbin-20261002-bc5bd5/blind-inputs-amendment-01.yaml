              fixture and MI-2 degree lists; the k readings, P forms and in-force
              pair; F2's and F1's tolerances and the F1 targets of
              frozen_c2_fixture; the extent of the source's measurements as the
              contract cites the red team; the joint-convention point and its two
              carried time figures as the contract cites RUN-SEMBIN-aa5161; the
              omega-3 column of routing.rt4_expectation_table; the carried 571
              rho entries; the two 571 base-point orders, Frobenius class orders
              and cofactors from FIPS 186-4 Appendix D.1.3; the FIPS text path;
              the degree-step and illustrative points of the carried design
              figures; the "none in 5..64" token.
      - id: NF-23
        source_field: newly_frozen_values.items[NF-23].definition
        references_outside_whitelist: [CB-4 and the contract fields it transcribes]
        parts:
          - text: >-
              The constants of CB-4, each a transcription of a named contract
              field - the gate names G1 to G4; the synthetic run directory under
              the contract's runs directory; IR-1's whitelist files (W-b, W-c,
              W-e) and directory (W-d); the required artifacts; the diagnostic
              columns C-CEIL-A, C-CEIL-T, C-CEIL-D and C-PF1-T; the protected
              targets of V-11; the F1 targets.
      - id: NF-24
        source_field: newly_frozen_values.items[NF-24].definition
        references_outside_whitelist: [inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md]
        parts:
          - text: >-
              The expected number of distinguished points and the storage it
              occupies in the authors' compressed representation, as Bailey et
              al. 2009/541 state them for the ECC2K-130 attack
              (inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md lines 190-207),
              quoted, not computed.
      - id: NF-25
        source_field: newly_frozen_values.items[NF-25].definition
        references_outside_whitelist: [inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md (in your blind_from)]
        parts:
          - text: >-
              For each of ECC2-353 and ECC2K-358, the first and last line
              numbers in inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md of
              that curve's printed Appendix A block, the last being the line that
              ends its last printed field (the second half of Q_y for ECC2-353;
              the last digits of the printed order n for ECC2K-358).
    not_separable: []
    not_separable_basis: >-
      Every NF definition above is stated in words and closed forms without its
      value, as the producer's not_separable field also records. An item whose
      definition depends on a reference outside your whitelist is not thereby
      inseparable; AM-3 governs it.

  # ---------------------------------------------------------------------------
  changed_definitions:
    read_after: AM-2
    rule: >-
      The version-4 text of each object below states it differently from
      blind-inputs definitions_as_the_contract_names_them or PIN-P-FORM, or
      adds a column or reading to it. Transcribed in the same part format as
      transcriptions. Under blind-inputs, this text governs and you report
      under both.
    source_file: experiments/EXP-NISTBIN-451dfa/specification.yaml
    items:
      - id: CHG-A
        object: A, the first-stage cost
        source_field: definitions.A
        what_changed: >-
          Version 4 writes A with its relation-count term and the PF-2 form in
          force under the numbered choice MI-2, and names PF-1 for the column
          C-PF1-T; blind-inputs A_of_n_m leaves the relation-count term to you.
        parts:
          - text: >-
              A(n, m) = k - log2 P(n, m, m, k) with P = 1 - exp(-2^(mk-n)/m!), eq.
              (
          - slot: S-EQ
            pad: none
          - text: >-
              ) (PF-2, in force under MI-2; VERSION 4). Computed by the
              instrument as jb.stage_costs(n, m, m, jb.Model(solve="block_n4w",
              charge_cofactor=False))[
          - slot: S-IDX
            pad: none
          - text: >-
              ], i.e. stage 1 with the per-solve cost set to zero. Under PF-1
              (column C-PF1-T only) P = 2^(mk-n)/m!.
      - id: CHG-P
        object: the P form
        source_field: definitions.model_identification_choices[MI-2].forms
        what_changed: >-
          Version 4 declares the P form as the numbered model-identification
          choice MI-2 with PF-2 in force; the two forms it writes out are the
          forms PIN-P-FORM labels PF-1 and PF-2.
        parts:
          - text: >-
              The decomposition probability P(n, m, t, k) at t = m enters A(n, m)
              = k - log2 P in one of two forms, both of which are the paper's
              expression |V|^t/(q t!) with |V| = 2^k and q = 2^n: PF-1, the
              first-order form, P = 2^(mk - n)/m!; PF-2, the eq. (
          - slot: S-EQ
            pad: none
          - text: >-
              ) form, P = 1 - exp(-2^(mk - n)/m!). With x = 2^(mk - n)/m!, PF-1
              is P = x and PF-2 is P = 1 - exp(-x).
      - id: CHG-THR
        object: the threshold
        source_field: definitions.d_star_of_m.definition
        what_changed: >-
          Version 4 states the threshold's first-stage term under MI-1 and MI-2
          with PF-2 in force; the threshold, its tokens and D*real_B are
          otherwise those of blind-inputs threshold.
        parts:
          - text: >-
              For c in {K-571, B-571}, R in {R-B, R-M}, omega =
          - slot: S-OMEGA
            pad: both
          - text: >-
              and each m in the M-SET: C_R(
          - slot: S-FIELD
            pad: none
          - text: >-
              , D, omega; m) = A(
          - slot: S-FIELD
            pad: none
          - text: >-
              , m) + S_R(
          - slot: S-FIELD
            pad: none
          - text: >-
              , D, omega), with A(
          - slot: S-FIELD
            pad: none
          - text: >-
              , m) under MI-1 (k = 571/m unceiled) and MI-2 (PF-2) and no
              minimisation over m. D*_R(c, omega, m) = the least integer D in
              2..64 with C_R(
          - slot: S-FIELD
            pad: none
          - text: >-
              , D, omega; m) - rho(c) > 0, with the same tokens as d_star. Under
              R-B the margin is linear in D, and D*real_B(c, omega, m) = (rho(c)
              - A(
          - slot: S-FIELD
            pad: none
          - text: >-
              , m)) / (omega log2 571) is reported to
          - slot: S-HUNDREDTH
            pad: both
          - text: >-
              beside the integer value; R-M is defined at integer D only and has
              no real form. At m = m* the value is D*_R(c, omega).
      - id: CHG-THR-PF1
        object: the threshold, first-order column
        source_field: definitions.d_star_of_m.first_order_column
        what_changed: >-
          A column version 4 adds beside the threshold table, under PF-1.
        parts:
          - text: >-
              VERSION 4 (RV3-6, DI-MI2). Column C-PF1-T: beside each m, the same
              D*_R(c, omega, m) and D*real_B with A(
          - slot: S-FIELD
            pad: none
          - text: >-
              , m) under MI-1 and the first-order form PF-1, with its relation
              store 571/m beside it. Non-gating and never scored. It IS handed on
              beside the in-force table, with the sentence of
              MI-2.bias_of_the_handed_table.
      - id: CHG-MEM-BESIDE
        object: the memory columns beside the threshold
        source_field: definitions.d_star_of_m.memory_beside
        what_changed: >-
          Version 4 states the store, row and dense-entry columns beside every
          threshold entry; blind-inputs states the relation store only.
        parts:
          - text: >-
              Beside every D*_R(c, omega, m): relation store 571/m (log2 count),
              Macaulay rows MR_B = D log2 571 and MR_M = W(
          - slot: S-FIELD
            pad: none
          - text: >-
              , D) at D* - 1 and D*, and dense entries twice those. Modelled, not
              measured.
      - id: CHG-MEM-STORE
        object: the relation store
        source_field: definitions.memory_columns (one clause)
        what_changed: >-
          Version 4's memory_columns states the relation store as the log2
          count of relations; blind-inputs relation_store and the worksheet
          conventions write it as log2 k under the k reading in force. Report
          the store under every reading the texts admit, as blind-inputs
          relation_store says.
        parts:
          - text: >-
              relation store k* = n/m* (log2 count of relations, D- and
              omega-independent)
      - id: CHG-M7
        object: the M7 reading
        source_field: definitions.restricted_model.m7_direction.m7_bin_lemma_form (its first three sentences)
        what_changed: >-
          Version 4 states M7-BIN with its cost relation to R-B and names the
          per-step and cumulative crossovers; NF-17 states the cost form of the
          same reading.
        parts:
          - text: >-
              VERSION 4 (RV3-3). The binomial reading M7-BIN counts rows as
              Boolean monomials of degree at most D in the Boolean variable count
              N5 of system (
          - slot: S-SYS
            pad: none
          - text: >-
              ) at chain length t = m, anchored to R-B at D =
          - slot: S-ANCHOR
            pad: before
          - text: >-
              , with cumulative difference DELTA7(D; 571, m) = [W(N5, D) - W(N5,
          - slot: S-ANCHOR
            pad: before
          - text: >-
              )] - (D - 4) log2 571 (S_7 - S_B = omega DELTA7). TWO DIFFERENT
              DEGREES, named separately per m and never one for the other: the
              PER-STEP CROSSOVER D_ps(m), the least D in 5..64 at which the
              per-step growth W(N5, D) - W(N5, D - 1) falls below log2 571; and
              the CUMULATIVE CROSSOVER D_cum(m), the least D in 5..64 at which
              DELTA7 < 0.
    compared_and_not_transcribed:
      - object: R-B
        basis: >-
          Version 4's reading_R_B writes the per-solve exponent of blind-inputs
          R-B, with a minimum over m that the threshold definition removes.
      - object: R-M
        basis: >-
          Version 4's reading_R_M writes the per-solve exponent of blind-inputs
          R-M, with the same minimum over m.
      - object: W
        basis: >-
          Version 4's definitions.W writes the expression of blind-inputs W.
      - object: rho
        basis: >-
          Version 4's definitions.rho states the Frobenius class order rule of
          blind-inputs rho, with an upper-bound clause for an unestablished
          class order.

  # ---------------------------------------------------------------------------
  observations_for_the_composer:
    - id: OB-1
      observation: >-
        The conventions, NF-16, NF-18 and CHG-A state the relation-count term
        of A and the closed form of N5, which blind-inputs asks the re-deriver
        to derive from the paper. AM-2 orders that derivation first; the
        independence of the re-deriver's A and N5 rests on its AM-2
        attestation.
    - id: OB-2
      observation: >-
        NF-07, NF-10, NF-11 and NF-19 to NF-25, and the comparison clause of
        NF-01, rest on contract fields, code blocks or paths outside the
        re-deriver's whitelist; expect them reported not computed under AM-3,
        which is a disclosed gap and never agreement.
    - id: OB-3
      observation: >-
        The relation-store wording differs between blind-inputs and the
        worksheet conventions on one side and the specification's
        memory_columns and memory_beside on the other (CHG-MEM-STORE and
        CHG-MEM-BESIDE); match the re-deriver's store column by the reading it
        labels.
    - id: OB-4
      observation: >-
        Every D4b basis outside blind-inputs.yaml is inferred without opening
        the source line (GD-2); the groups G-FIPS-NUM, G-SEM-EQ and G-SEM-SEC
        carry most of the weight and are the natural place for the at-source
        sample.

  procedure_deviations:
    - id: GD-1
      severity: disclosed
      what: >-
        The gate read the review plan in full, not only its blind_rederivation
        section as SG-GATE names it. The plan carries no value by its outcome
        discipline.
    - id: GD-2
      severity: disclosed
      what: >-
        The gate opened no whitelisted source line other than those of
        blind-inputs.yaml (SG-GATE read set). Every D4b basis for the FIPS
        text, the paper, the sister specification, AGENTS.md and the template
        is inferred from the grep record, document provenance and the
        contract's quotations of paper lines; hits that evidence did not show
        took D1. The composer's sample at source is the check.
    - id: GD-3
      severity: disclosed
      what: >-
        The plan asks for byte-exact transcription and for an amendment the
        session's grep finds clean; where a definition carries a parameter
        numeral that coincides with a searched form the two conflict. The gate
        transcribes as byte-exact text parts with named slots for the elided
        parameter tokens, so every text part is checkable as a byte-exact
        substring and the full definition is recoverable from the source by
        slot.
    - id: GD-4
      severity: disclosed
      what: >-
        AM-2 adds an attested ordering rule, a redaction in time, that is not
        attached to a grep hit; it protects the independence of the
        re-deriver's derivations of A and N5 (OB-1).
    - id: GD-5
      severity: disclosed
      what: >-
        The gate is not blind. It read version-4 figures in the specification
        and the worksheet while locating definitions, and wrote none of them.
  runs_launched: 0
