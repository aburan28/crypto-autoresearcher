  printed_forms_outside_the_search: >-
    Recorded for the composer under the plan's false-PASS clause; no
    disposition attaches. While locating definitions the gate saw version-4
    values printed in forms the grep does not search - bare integers in
    running prose (counts of cells, entries and degrees; crossover degrees and
    their ranges written as from-to or at-phrases; argmins written after the
    argmin symbol or the decomposition symbol without an equals sign);
    integer exponents written after a caret; and integer approximations
    introduced by the word about. The grep's own limitations disclose that
    bare integers are not searched. No whitelisted file is a record of this
    lane except the re-deriver's card and blind-inputs.yaml, which the plan
    records as written before the object existed, so a bare-integer
    coincidence elsewhere cannot carry a version-4 value except by chance.
    This amendment prints no version-4 value in any form.

  # ---------------------------------------------------------------------------
  slot_legend:
    note: >-
      A slot stands for exactly one elided token of the source text. Every
      elided token is a parameter of the definition, never a value of any
      quantity; it is elided only because its numeral coincides with a form
      the whitelist grep searches. pad states which single spaces belong to
      the elided bytes - none, before, after or both.
    S-FIELD: >-
      The field degree of the K-571 and B-571 rows, written as a decimal
      integer (the field degree of Q1-571).
    S-OMEGA: >-
      The omega of PIN-OMEGA, written with one decimal place.
    S-OMEGALOW: >-
      The lower end of the domain of the linear-algebra constant omega as
      Semaev 2015 states it (the contract's H1 calls it Semaev's domain),
      written to three decimals.
    S-ANCHOR: >-
      The anchor degree at which blind-inputs R-M and M7-BIN are normalised
      to R-B (the degree bound of the published model), written as an
      integer.
    S-MTOP: >-
      The upper end of PIN-M-GRID, written as an integer.
    S-QXLOW: >-
      The lower end of the degree range in which QX seeks D_ps and D_cum,
      written as an integer.
    S-HUNDREDTH: >-
      One hundredth, written with two decimal places; the numeral
      blind-inputs uses for the default QNF log2 tolerance and for the
      reporting precision of D*real_B.
    S-DEGFIX: >-
      The field degree listed second under extra_parameter_points EP-4 (the
      contract's second fixture degree), written as an integer.
    S-FIXTOL: >-
      The absolute tolerance of the contract's frozen C2 fixture, written in
      scientific notation. A contract field outside your whitelist; not
      pinned here (AM-3).
    S-EQ: >-
      The paper's equation number that PIN-P-FORM names for the PF-2 form,
      written as an integer.
    S-SYS: >-
      The paper's system number that blind-inputs N5 names, written as an
      integer.
    S-IDX: >-
      The integer index zero, selecting the first element of the
      instrument's returned tuple.

  # ---------------------------------------------------------------------------
  extra_parameter_points:
    rule: >-
      The points at which version 4 states a newly frozen figure outside the
      QA, Q3 and QX grids, as parameters only. Field degrees are listed as
      integers; every other coordinate is given by pointer. t equals m at
      every point.
    points:
      - id: EP-1
        serves: [NF-02]
        degree_n: the field degree of the K-571 and B-571 rows
        chain_m: >-
          m*, the first argmin over PIN-M-GRID, ascending, of C_I at PIN-OMEGA
          under KR-A and PF-2; t equals m
        degree_D: >-
          S-ANCHOR for items (b), (d) and (e); one degree step for item (a)
        k_reading: KR-A
        p_form: PF-2
        omega: >-
          PIN-OMEGA, and in item (b) also the omega of slot S-OMEGALOW
      - id: EP-2
        serves: [NF-03, NF-08]
        degrees_n:
