    which is not the producer's, a reviewer's or the composer's session. It
    holds no shell, read only the files listed under sources_read_by_the_gate,
    and wrote only this file.
  value_free: true
  additive: >-
    This file edits nothing in blind-inputs.yaml. It adds one attested
    redaction rule, disposes every hit of the whitelist grep, transcribes the
    producer's newly frozen definitions and the definitions version 4 states
    differently from blind-inputs, and pins the parameter points outside the
    QA, Q3 and QX grids. Where it transcribes a changed definition, its text
    governs and you report under both, as blind-inputs
    definitions_as_the_contract_names_them says.
  grep_record: >-
    coordination/review/nistbin-20261002-bc5bd5/whitelist-grep-v4.yaml, which
    prints search terms and is in your blind_from. Hit identifiers below are
    that record's; you never open it.
