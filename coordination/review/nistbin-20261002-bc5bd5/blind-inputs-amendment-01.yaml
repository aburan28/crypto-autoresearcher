  # ---------------------------------------------------------------------------
  rules_for_the_re_deriver:
    - id: AM-1
      rule: >-
        Obey redaction rule RD-SEM-A01 below exactly as you obey RD-SEM, and
        attest it in redactions_respected beside RD-SEM and RD-SPEC (BL-8).
    - id: AM-2
      rule: >-
        ORDERING, attested. Before you read the sections transcriptions and
        changed_definitions of this file, derive from the paper and save in
        computations.json the relation-count term of A (blind-inputs
        A_of_n_m) and the formula for N5 (blind-inputs N5) with the paper's
        line numbers. Only then read those sections. Where your derivation and
        a transcribed definition differ, report under both and record the
        difference under Q0. If you read those sections before saving your
        own derivations, say so in procedure_deviations.
    - id: AM-3
      rule: >-
        A transcribed definition that names a contract field, a code block, a
        record or a path outside your whitelist is a reference you do not
        open (blind-inputs source_note). Record it under Q0 and report the NF
        item, or the part of it that depends on that reference, as not
        computed with that reason. Never infer it.
    - id: AM-4
      rule: >-
        QNF tolerance. Every NF item takes the blind-inputs QNF default for
        log2 quantities; counts, flags, tokens, degrees, argmins and list
        memberships are exact.
    - id: AM-5
      rule: >-
        Compute every NF item under every k reading and P form its definition
        leaves open, as blind-inputs QNF says, and at the parameter points of
        extra_parameter_points where its definition names a point outside
        the QA, Q3 and QX grids.

