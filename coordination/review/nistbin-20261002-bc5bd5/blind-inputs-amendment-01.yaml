        degrees_note: >-
          The fifteen distinct claim-(A) degrees of the contract's
          preregistered_prediction P-A (FIPS, Certicom and Oakley lists, one
          degree common to two lists counted once).
        chain_m: >-
          Every m of PIN-M-GRID at each degree; every listed degree exceeds
