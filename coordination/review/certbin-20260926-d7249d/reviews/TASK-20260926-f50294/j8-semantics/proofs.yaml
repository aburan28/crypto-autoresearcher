# TASK-20260926-f50294 -- J8 (CP-5 item 1): soundness (and completeness) of the
# frozen certificate formats, written by the comparator from the FORMAT TEXT of
# experiments/EXP-CERTBIN-060020/specification.yaml object.certificate_format
# and EXP-CERTBIN-e94b27 object.mutant_closure_W_D. Statuses of the plan's
# derivations D-1 and D-6: verified | refuted | unchecked.
j8_proofs:
  task_id: TASK-20260926-f50294
  review_plan_id: REVIEW-CERTBIN-20260926-d7249d
  setting: >-
    B = F_2[v_0..v_19]/(v_i^2 + v_i); every element has a unique multilinear
    normal form, and deg g is the maximum monomial degree of that form (so
    "degree" of an element of B is always the degree AFTER multilinear
    reduction and after cancellation). f_0..f_18 in B_{<=2}. M_4 rows: mu*f_k,
    mu a multilinear monomial with |mu| <= 2, k in 0..18. W_4: the least
    F_2-subspace of B_{<=4} that (i) contains every M_4 row and (ii) contains
    v_j*g for every g in it with deg g <= 3 and every j in 0..19. I = the ideal
    of B generated by f_0..f_18.
  lemma_0_W4_is_well_defined_and_the_iteration_computes_it:
    statement: >-
      The least subspace exists, equals the stable value W^(i*) of the frozen
      iteration, and is contained in I cap B_{<=4}.
    proof: >-
      B_{<=4} itself satisfies (i) and (ii) (v_j*g has degree <= 4 when
      deg g <= 3), and an intersection of subspaces satisfying (i), (ii)
      satisfies them, so the least one, W_4, is the intersection of all of
      them. For any subspace S satisfying (i), (ii): W^(0) = rowspace(M_4) is
      inside S by (i); if W^(i) is inside S then every basis element b of
      W^(i) cap B_{<=3} is in S with deg b <= 3, so v_j*b is in S by (ii) and
      W^(i+1) is inside S. At the frozen stop, dim W^(i*+1) = dim W^(i*) and
      W^(i*) is inside W^(i*+1), so they are equal; for g in W^(i*) with
      deg g <= 3, g is a sum of basis elements b and v_j*g = sum v_j*b is in
      W^(i*+1) = W^(i*) (multiplication by v_j followed by multilinear
      reduction is F_2-linear). So W^(i*) satisfies (i), (ii) and lies in every
      such S: W^(i*) = W_4. I cap B_{<=4} satisfies (i) (each mu*f_k is in I)
      and (ii) (I is an ideal), so W_4 is inside I. If 1 is in W_4 then 1 is in
      I and evaluation at any common Boolean zero (a ring map B -> F_2 killing
      I) would send 1 to 0: the system is unsatisfiable.
    status: verified
  D-6:
    plan_statement: >-
      wdag-v1 soundness and completeness. Soundness: by induction on node id,
      rules (a)-(d) put every node in W_4, so (e) certifies 1 in W_4.
      Completeness: every element of W_4 has a valid wdag-v1 (unroll the
      iteration), so a missing wdag-v1 is never evidence of non-membership.
    soundness_proof: >-
      Process nodes in increasing id. Claim: every node satisfies poly(i) in W_4.
      poly(i) = sum_{(mu,k) in rows} mu*f_k + sum_{(j,c) in prods} v_j*poly(c),
      computed in B. Each rows term has |mu| <= 2 and k in 0..18 by (b), so it
      is an M_4 row and lies in W^(0), inside W_4 (by (i)). For each prods
      entry, c < i by (a), so poly(c) is in W_4 by the induction hypothesis,
      and deg poly(c) <= 3 by (c); by (ii) v_j*poly(c) is in W_4. W_4 is a
      subspace, so poly(i) is in W_4. By (e) poly(output) = 1, so 1 is in W_4,
      and by lemma 0 the system is unsatisfiable. The well-founded order of (a)
      is what makes poly(i) well defined; without (a) a cycle has no value.
    degree_discipline: >-
      Rule (b) is exactly the M_4 generator set (|mu| <= D - 2 = 2) and rule (c)
      is exactly the premise of (ii) (deg g <= D - 1 = 3). Every summand of
      every node lies in B_{<=4} (deg mu*f_k <= 2 + 2; deg v_j*poly(c) <= 1 + 3),
      so every partial sum and every node lies in B_{<=4}: NO degree-5 monomial
      is ever formed, and rule (d) can never bind for a certificate meeting (b)
      and (c) (it is redundant, not load-bearing). The degree in (c) is the
      degree of poly(c) as an element of B -- after reduction AND after
      cancellation, which is the only degree an element of B has. This reading
      is sound (the proof above uses nothing else) and it is LOAD-BEARING in
      this run: every child node of all 1200 run wdag-v1 and all 65 blind
      wdag-v1 is built from rows with |mu| = 2 (formal degree up to 4) and has
      degree 3 in B (run: J1 max_node_degree 3 with max_mu 2, structure read
      from certificates.jsonl.gz; blind: checks/cp3_blind_certs.json
      deg_by_node). A checker reading rule (c) on the unreduced expression
      would reject all 1265 of them; J1, the re-deriver and the comparator all
      read it after reduction (see readings_compared).
    completeness_proof: >-
      Induction on the iteration index: every g in W^(i) is poly(N) of the top
      node N of some DAG meeting (a)-(d). i = 0: g = sum of M_4 rows, a one-node
      DAG with those rows (deg g <= 4). i -> i+1: g = h + sum_{j,b} a_{j,b}
      v_j*b with h in W^(i) and b in a basis of W^(i) cap B_{<=3}. Take the DAGs
      of h and of every b (induction), renumber their disjoint union keeping
      the order, and add a new last node N whose rows are the rows of h's top
      node and whose prods are the prods of h's top node plus (j, top(b)) for
      every a_{j,b} = 1. Then poly(N) = g; (a) holds (all children earlier);
      (b) is inherited; (c) holds for h's old prods and for top(b), whose poly
      b has degree <= 3; (d) holds because g is in B_{<=4}. Hence every
      element of W_4 = W^(i*), in particular 1 when 1 is in W_4, has a valid
      wdag-v1 with output N. A missing wdag-v1 is therefore never evidence of
      non-membership (it is at most an extraction failure).
    status: verified
    caveats:
      - The format text does not say whether node ids must equal list positions; the proof needs only unique ids and (a). J1 (its AMB-6) and the re-deriver (its AMB-6) require ids = positions; the comparator's checker requires unique ids. No archived or blind certificate distinguishes the readings.
      - An index outside 0..19 in mu or j is not a variable of B; all three checkers reject it (J8 attempts S1, S2). Even a checker that silently computed in a larger ring would stay sound (setting the extra variables to 0 maps a valid larger-ring identity to a valid identity in B without raising degrees).
  D-1:
    plan_statement: >-
      ann-v1 soundness. If L satisfies (A1)-(A3), S = {g in B_{<=4} :
      lambda(g) = 0 for all lambda in L} contains every M_4 row and is closed
      under g -> v_j g for deg g <= 3 (by linearity it suffices to check a
      basis of S cap B_{<=3}), so the least fixpoint W_4 lies in S, and 1 is
      not in S; hence 1 is not in W_4.
    soundness_proof: >-
      S is an F_2-subspace of B_{<=4} (an intersection of kernels of linear
      functionals, each lambda(g) = parity of <lambda, g> in the fixed
      coordinates). (A1): every M_4 row is in S, so S satisfies (i). (A2): let
      K be a basis of S cap B_{<=3} computed by the verifier's own elimination.
      For g in S with deg g <= 3, g is in S cap B_{<=3} = span K, say
      g = sum_{k in K'} k; then v_j*g = sum_{k in K'} v_j*k (linearity of
      multiplication by v_j with multilinear reduction), and
      lambda(v_j*g) = sum lambda(v_j*k) = 0 for every lambda by (A2); also
      deg v_j*g <= 4. So v_j*g is in S: S satisfies (ii). By lemma 0, W_4 lies
      in S. (A3): some lambda has lambda(1) = 1, so 1 is not in S, hence not in
      W_4.
    the_one_subtle_step: >-
      "It suffices to check a basis" is valid only for a basis of the WHOLE of
      S cap B_{<=3}. That is what the frozen text requires ("a basis K of
      S cap B_{<=3} computed by the verifier's own elimination"): the null space
      of L restricted to the 1351 coordinates of degree <= 3 (an element of
      B_{<=3} has zero degree-4 coordinates, so that null space IS
      S cap B_{<=3}). A plausible misreading -- keep the members of a basis of
      S that happen to have no degree-4 coordinate -- spans in general a
      PROPER subspace (it can be empty) and is UNSOUND: attempt B2(i) of
      crafted_attempts.out.json has it accept L = ann(rowspace(M_4)) on a
      system whose W_4 contains 1 (K empty, (A2) vacuous), while the literal
      rule rejects the same L at (A2). J1 (code/certs.py basis_S_deg3 and
      gf2k.c k_closure_check), the re-deriver (code/checkers.py check_ann,
      nullspace(L[:, deg <= 3])) and the comparator (checks/mini.py check_ann)
      all apply the literal reading and form every product v_j*k explicitly.
    coordinate_order: >-
      Soundness does not depend on which bijection "(-degree, bitmask
      ascending)" denotes, provided the verifier uses ONE fixed bijection for L,
      the M_4 rows and the products; the order matters only for completeness
      (whether an honest certificate is readable). All three readers took
      bitmask bit i = v_i; the run's 15 ann-v1 satisfy (A1) under it (J1) and
      the 25 blind ann-v1 under it (CP-3), so the engine's
      closure.column_order(4, 20) is the same bijection.
    completeness: >-
      If 1 is not in W_4, L = a basis of the annihilator of W_4 (size
      codim W_4 = 6196 - final_dim) satisfies (A1) (M_4 rows are in W_4), (A2)
      (S = W_4, closed by lemma 0) and (A3) (some annihilator functional is 1
      at 1 because 1 is not in W_4, and a basis of the annihilator cannot
      consist only of functionals vanishing at 1). On a satisfiable system one
      evaluation functional at a solution already suffices (J8 note
      S_evaluation_functional_ann_v1), which is why the blind S3-SAT100 ann-v1
      carry 2 to 6 functionals.
    status: verified
  flat_v1:
    statement: >-
      A verified flat-v1 with max |mu| = d - 2 certifies 1 in rowspace(M_d) and
      unsatisfiability. It certifies 1 in W_4 only when max |mu| <= 2 (then
      1 is in M_4, inside W_4). With max |mu| = 3 it certifies 1 in M_5, which
      contains degree-5 content and is NOT inside W_4 in general.
    demonstration: >-
      D = 3 image on the comparator's own system X3 (6 variables, 3 equations):
      a valid flat identity with max |mu| = D - 1 = 2 exists (1 in M_4) while
      1 is not in the literal W_3; rewriting it under the degree discipline
      fails at (b) as a one-node DAG and at (c) under every one of 3000
      groupings (crafted_attempts.out.json A1-A3). So the frozen counting rule
      "NEVER toward W_4 unless max |mu| <= 2" is necessary, not merely
      conservative. Every one of the run's 1200 flat-v1 has max |mu| = 3; both
      J1 and the run's verifier count none of them (comparison.json).
    status: verified
  M4_witness_J1_VC6:
    statement: A single functional lambda vanishing on all 4009 M_4 rows with lambda(1) = 1 certifies 1 not in rowspace(M_4), hence not in rowspace(M_3).
    proof: If 1 = sum of M_4 rows then lambda(1) = sum lambda(row) = 0, contradicting lambda(1) = 1. M_3 rows are M_4 rows (mu with |mu| <= 1).
    status: verified
    re_checked_by_comparator: 20 of 400 (S3-U400:0..19), all valid (checks/third_check_m4_witnesses.json; the declared CP-7 third-check budget)
  readings_compared:
    deg_poly_c_le_3:
      text: '"(c) every child c used in prods has deg poly(c) <= 3", poly(c) defined "in B"'
      J1: after reduction and cancellation (dense parity array over 2^20 masks; degree = max popcount of the support; deg(0) = -1; code/certs.py degree, check_wdag)
      rederiver: after reduction and cancellation (parity by bincount over masks; _deg = max popcount; code/checkers.py check_wdag)
      comparator: after reduction and cancellation (checks/mini.py check_wdag)
      matches_text: all three
    A2_basis:
      text: '"(A2) for a basis K of S cap B_{<=3} computed by the verifier''s own elimination, lambda(v_j k) = 0 for every k in K, j in 0..19, lambda in L"'
      J1: null space of L restricted to the 1351 degree <= 3 coordinates (own RREF, unit vector per free column), checked to lie in S; every v_j*k formed and every lambda evaluated (code/certs.py basis_S_deg3, gf2k.c k_closure_check)
      rederiver: nullspace(L[:, deg <= 3]) with an own-elimination sanity check (L3 K^T = 0, dimension count); every v_j*k formed; every lambda evaluated (code/checkers.py check_ann)
      comparator: same, checks/mini.py check_ann
      matches_text: all three
      run_verifier: not inspected (its stated rule "(A1)-(A3) with own M_4, own elimination for S cap B_{<=3}"); every run ann-v1 is independently verified by J1, so no count rests on it alone
