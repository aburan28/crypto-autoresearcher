# TASK-20260926-f50294 -- J8 (CP-5 item 4): count by count, what is
# CERTIFICATE-BACKED (a finite object that a checker other than the engine
# verified), what is DERIVED (a checked derivation applied to a profile computed
# by code independent of the engine), and what is ENGINE-REPORTED only.
# Sources: comparison.json (CP-2 / CP-3), the archived J1 verification.json, the
# comparator's own checks, and certificates.jsonl.gz structure. States no
# verdict on the claim.
certification_table:
  task_id: TASK-20260926-f50294
  run_id: RUN-CERTBIN-a3fc60
  legend:
    certified_twice: run certificate verified author-independently by J1 AND a valid blind certificate from the J6 re-deriver (checked by the comparator's own checker)
    certified: at least one verified certificate of the right format from a checker independent of the engine (J1 author-independent; blind certificates by the comparator)
    derived: a derivation (D-3, T5) whose premises are an independent profile plus certificates
    engine_reported: the engine's record only (possibly cross-checked by the run's own verifier or by C-* controls, which are engine-plus-executor code)
  counts:
    - count: MR19-1 w = 400 of N = 400 (S3-U400, 1 in W_4)
      closure: W_4
      backing: certified (wdag-v1) on 400/400 -- run verifier 400, J1 400 (author-independent); certified_twice on the 40 pool keys (40/40 valid blind wdag-v1)
      format_certifies_what_the_metric_names: yes -- wdag-v1 certifies 1 in W_4 (D-6 soundness, verified); MR19-1 counts wdag-v1 only (J1 and run count 0 of the 1200 flat-v1)
    - count: MR19-3 W_4 refutations N-CONV19 200/200 and F-RANDX19 600/600 (200 per stratum)
      closure: W_4
      backing: certified (wdag-v1, J1) on 800/800; certified_twice on 10 N-CONV19 + 15 F-RANDX19 pool keys
    - count: flat-v1 certificates (1200, all max |mu| = 3)
      closure: M_5 (not W_4)
      backing: identities verified by J1 and the run (unsatisfiability certificates); certify 1 in M_5 only; counted toward nothing, correctly (flat_v1 in proofs.yaml; the D = 3 demonstration shows the rule is necessary)
    - count: M_4 refutations 0/400 on S3-U400 (N19-DR-2 m = 0) and M_3 0/400
      closure: M_4 (M_3 implied)
      backing: certified -- 400 single-functional M_4 witnesses (J1 VC-6), re-checked by the comparator on 20 (all valid); J1's own M_4 agrees with the run's M_4 record (one, rank, dims_by_deg) on 400/400
    - count: M_4 refutations 0 on every other arm (1700 systems)
      closure: M_4
      backing: certified by J1's SUPPLEMENTARY witnesses (J1 work/m4-supp-witnesses-*.jsonl.gz, checked by J1; not re-checked here); J1's own M_4 agrees with the run on 1700/1700
    - count: conditional W_4 rate on S3-U400 systems M_4 does not refute (400/400)
      backing: certified (M_4 witnesses and wdag-v1 as above)
    - count: C-PS -- no M_3 / M_4 / W_4 refutation on the 300 satisfiable controls
      backing: certified by satisfiability -- every listed solution of every satisfiable control checked by J1 (VC-3; 776 solutions; lists equal the full solution sets); a satisfiable system cannot have 1 in any sound closure (lemma 0). 5 S3-SAT100 pool keys additionally carry a valid blind ann-v1
    - count: C-PS codim(W_4) >= s on satisfiable controls (and equality where s <= 31)
      backing: engine_reported (final_dim is not certified by any format; an ann-v1 of size codim W_4 would bound it). Blind literal W_4 reproduces final_dim on the 5 pool S3-SAT100 keys (comparison.json)
    - count: W_4 non-refutation of the 200 unsatisfiable N-ELL19 systems (X rate 0/200 in N19-DR-4 and N19-DR-5)
      backing: certified on 10 (the pool keys; valid blind ann-v1; 5 of them also carry a J1-verified run ann-v1); engine_reported on 190 (T5 would derive them from an independent R'_4 profile plus a checked T5 -- J11 and J10 own those; the only R'_4 profiles this comparator holds for them are the engine's)
      sensitivity: even if all 190 engine-reported non-refutations were wrong, k <= 190 of 200 gives a CP95 upper bound of 0.97577 < 0.99082 (S3-U400's lower bound), so the W_4 row "S_3 ABOVE N-ELL19" of N19-DR-4 and "N-CONV19 ABOVE N-ELL19" of N19-DR-5 do not depend on them (exact CP, checks/cp2_compare.py cp95)
    - count: W_4 non-refutation of the 200 unsatisfiable N-F219 systems
      backing: certified on 5 (pool keys = the run's 5 ann-v1 keys; certified_twice); derived on 195 (J1's own-code profile [0, 0, 19, 399, 3819] with W^(1) = W^(0) on all 250 N-F219 systems -- the D-3 situation -- plus J1's M_4 witness for 1 not in M_4; D-3's proof is J11's, and the comparator's reading of it is in notes)
      sensitivity: if all 195 were wrong, k = 195 gives an upper bound 0.99183 > 0.99082 and the W_4 row "S_3 ABOVE N-F219" would become NOT DISTINGUISHED; this row therefore rests on the D-3 derivation, not on certificates
    - count: W_4 non-refutation of the 200 unsatisfiable N-AFF19 systems
      backing: certified on 9 (5 pool keys with a valid blind ann-v1, of which N-AFF19:1 also has a J1-verified run ann-v1, plus the run ann-v1 on N-AFF19:5, 7, 13, 14); derived on 191 (as N-F219, from J1's own profiles on all 250 N-AFF19)
      sensitivity: k <= 191 gives an upper bound 0.97922 < 0.99082; the W_4 row does not depend on them
    - count: ann-v1 submitted 15, verified 15 (MR19-3)
      backing: certified (J1 15/15, (A1)-(A3) with the literal (A2) basis)
    - count: MR19-2 / N19-DR-3 sigma counts (sigma > 0 on 400) and the FULL (1160) count 0; N19-DR-7 profile fractions
      backing: engine_reported -- no certificate format covers a rank or a dims_by_deg profile; blind-reproduced (independent code) on 40 S3-U400 pool keys and on every pool key of the other arms (comparison.json, 0 disagreements)
    - count: ell_route false on every S_3 and N-CONV19 system
      backing: engine_reported; blind-reproduced by a direct computation on 70 pool keys (and on 10 N-ELL19 re-deriver only); by D-2 it is the same observable as "1 in R'_4" (verified on independent numbers in the space form, 80/80)
  C-NONREF_vacuity:
    ruling: DEC-20260926-f6a749 R-9 (ACCEPTED AS DECLARED)
    what_it_leaves_uncertified: >-
      No count. Every S3-U400 system is W_4-refuted with a verified wdag-v1, so
      there is no primary-arm non-refutation for an ann-v1 to certify, and the
      adverse-direction artifact of DEC-20260924-f5c3f9 R-8 has no instance.
    what_it_leaves_untested: >-
      (1) The ann-v1 path (extraction and verification) was exercised on
      control systems only: 15 run ann-v1 (N-ELL19 T5-type, N-F219 / N-AFF19
      W_4 = M_4) and 25 blind ann-v1 (the same arms plus 5 satisfiable S3-SAT100
      systems, where small evaluation-type L suffice). It was never exercised on
      an unsatisfiable S_3-algebra system, so it says nothing about how an
      S3-U400 non-refutation would have been certified. (2) C-NONREF's
      instrument role (an ann-v1 failure exposing an engine W_4 that is not
      closed or not a superspace of M_4) has no primary instance; on the
      primary arm, over-computation of W_4 is excluded instead by the verified
      wdag-v1 (a false "1 in W_4" cannot be certified, D-6) and the engine's
      W_4 records are reproduced by the blind literal W_4 on 40 primary keys
      (per-iteration dims, fixpoint, first iteration, final dim, dims_by_deg).
      Under-computation on the primary arm is moot (nothing is non-refuted).
  notes:
    D-3_comparator_reading: >-
      Owned by J11. For the record: if dims_by_deg(M_4)[3] = rank M_3, the
      degree-<=3 part of rowspace(M_4) equals rowspace(M_3) (inclusion and
      equal dimension); every b in it is a sum of mu*f_k with |mu| <= 1, so
      v_j*b is a sum of M_4 rows and W^(1) = W^(0). The step is immediate; the
      comparator marks it neither verified nor refuted because the joint is not
      its own.
    scope: >-
      "Certified" means certified for the statement the format names (1 in W_4;
      1 not in W_4; 1 not in rowspace(M_4)), for the system its key names, at
      this toy scope. It says nothing about any claim built on the counts.
