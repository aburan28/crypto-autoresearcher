    CP-3_blind_certificates:
      checker: checks/mini.py (own; stdlib + numpy; no crypto_autoresearcher import), written and hashed (checks/checker-seal.txt, 04:19:38Z) before any re-deriver code was opened
      f_k: own S_3 descent from blind-inputs.json x_R (curve kind; Frobenius route-2 self-check on every descent) or the blind explicit equations; both equal the run's E_hex under the comparator's own E_layout codec on 90/90
      result: >-
