    run_in: the main checkout (HEAD a524be32e; the plan and the checker are byte-identical to f88fc6119)
    reading: >-
      13 problems, every one naming a joint of ANOTHER task (J1 401771, J2-J5
      42be88, J6 and blind_rederivation f0736e, J9-J14 fee7a9) whose attestation
      is not under the single directory passed. No problem names
      TASK-20260926-f50294: J7 and J8 are attested, and read_sibling_reports
