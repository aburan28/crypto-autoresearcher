    - positive controls -- 65 blind wdag-v1 and 25 blind ann-v1 accepted; the Y4 wdag-v1 (built from the comparator's own tags) accepted in the frozen format; a one-functional evaluation ann-v1 on the satisfiable S accepted
  heuristic_validation_checks:
    - Not applicable to J7 / J8 -- the specification tests no numbered heuristic (heuristic_under_test null) and these joints report no statistic of their own. The null-object and decay questions of the pattern (M_4 and W_4 counts at opposite ends; ell_route never true) belong to J9, J11 and J13; J7 only records that ell_route and "1 in R'_4" are one observable at a floor here.
  cost_model_checks:
    - Not applicable -- claim tier toy, no cost claim, no speedup claimed, so the docs/inventor-protocol.md section 6 ladder is not triggered.
  proof_architecture_checks:
    - observation_collision -- flat-v1 at max |mu| = 3 fits a W_4 and an M_5-only refutation alike; counted toward nothing (run and J1), and the D = 3 construction shows the collision is real, not hypothetical
    - observation_collision -- ell_route and "1 in R'_4" are one observable (D-2); agreement between them is one piece of evidence, and here it sits at a floor
    - quantifier_fidelity -- every certificate is per system and keyed; transplants to another system of the same arm reject (CP-3 negative controls, J8 B7)
    - interface_preservation -- E_layout codec, x_2 offset (v_10..v_19) and ann-v1 coordinate order are read identically by the comparator, J1 and the re-deriver, and the run's certificates satisfy them; soundness does not depend on the ann-v1 bijection

  limitations:
    - J7 and J8 only; no whole-claim statement. The Coordinator composes admissibility from J1, J2, J3, J5, J7 and J8.
    - PD-R3 -- the comparator, the re-deriver, J1, the executor and the engine's author share one model family (claude-opus-5-5); independence is of code and authorship, not of model reading. The three independent readings of the ann-v1 order and of (A2) coincide; a common misreading is excluded for soundness (proofs.yaml) but not for completeness.
    - The worktree is sparse (disk allowance); every path read is committed at f88fc6119.
    - The pool is fixed by arm and index (PD-R4) and every run-refuted pool system is refuted at iteration 1 with W^(1) = B_<=4; per-iteration agreement on refuted systems is therefore tested only at the ceiling (floor_ceiling_caveat).
    - checks/mini.py check_ann raises (IndexError) on an EMPTY L instead of returning "(A3) fails"; a raise is never an acceptance, and no blind certificate has an empty L (recorded in crafted_attempts.out.json).
    - The run's verifier code (verifier/verify_n19.py) and impl/ were not opened; no disagreement required it. The run's own verdicts are compared, and every run certificate is also verified by J1.
    - J1's supplementary M_4 witnesses on the 1700 non-primary systems were compared as records (1700/1700 agree with the run) but not re-checked; 20 primary witnesses were re-checked.
    - N-ELL19 W_4 non-refutations beyond the 10 pool keys rest on the engine here; J10 / J11 own the T5 route to deriving them.

