  # ------------------------------------------------------------------- J8
  J8:
    D-1: verified (j8-semantics/proofs.yaml D-1 -- sound; the step "check a basis" is valid only for a basis of the WHOLE of S cap B_<=3, which is the frozen text)
    D-6: verified (soundness by induction on node id; completeness by unrolling the iteration with the top node inheriting the previous level's rows and prods)
    degree_discipline: >-
      Rules (b) and (c) are exactly the M_4 generators and the premise of the
      W_4 rule (ii); every summand of every node lies in B_<=4, so no degree-5
      monomial is ever formed and rule (d) never binds. Nothing outside W_4 is
      admitted. The degree in (c) is the degree of an element of B (after
      reduction and cancellation); this reading is literal, sound, and
      load-bearing here: every child node of the 1200 run and 65 blind wdag-v1
      is built from |mu| = 2 rows (formal degree up to 4) and has degree 3.
    flat_v1: >-
      Certifies unsatisfiability and 1 in rowspace(M_{2 + max|mu|}); all 1200
      run flat-v1 have max |mu| = 3 (1 in M_5) and are counted toward nothing by
      the run and by J1. The rule is necessary: on the comparator's own
      6-variable system X3 a valid flat identity with max |mu| = D - 1 exists
      while 1 is not in W_D (D = 3), and no degree-disciplined rewriting passes.
    crafted_certificate_attempts: >-
      15 attempts (j8-semantics/crafted_attempts.py, .out.json) on the
      comparator's own systems: X3 (6 variables, unsatisfiable, 1 not in W_3,
      1 in M_4), S (7 variables, satisfiable) and Y4 (7 variables, 1 in W_4 at
      iteration 1, 1 not in M_4), the last two embedded into the frozen
      (4, 20, 19) format and checked by the UNCHANGED CP-3 checker. No attempt
      passes a frozen rule for a false statement: flat rewritten as one node
      fails (b); factor-out regroupings (3000) fail (c); a cancelling pair on
      a degree-3 child fails (c); 2442 random DAGs meeting (a)-(d) have every
      node inside the literal W_3 and none outputs 1; out-of-range indices and
      self-reference fail (a)/(b); a poly merely containing 1 fails (e); on Y4,
      ann(rowspace(M_4)), a single functional, 30 random sub-families, an
      evaluation functional and a transplanted valid ann-v1 all fail (A1) or
      (A2). The ONE attempt that passes is deliberately not the frozen rule:
      a LENIENT (A2) that keeps only the members of a basis of S lying in
      B_<=3 accepts ann(rowspace(M_4)) on Y4 (K empty, (A2) vacuous) -- the
      documented failure point of D-1 if (A2) is misread.
    readings_compared: >-
      "deg poly(c) <= 3": J1, the re-deriver and the comparator all take the
      degree in B after reduction and cancellation (= the text). (A2)'s basis:
      all three take the null space of L restricted to the 1351 degree <= 3
      coordinates from their own elimination and form every v_j*k explicitly
      (= the text). The run's verifier code was not inspected (its rule text
      states the same; every run ann-v1 is verified by J1).
    certificate_backed_vs_engine_reported: >-
      j8-semantics/certification_table.yaml, count by count. Certificate-backed:
      MR19-1 400/400 and every W_4 refutation count of the run (1200 wdag-v1,
      J1; 65 twice-certified in the pool); M_4 (and M_3) non-refutation on
      S3-U400 400/400 (J1 VC-6 witnesses; 20 re-checked here) and on the other
      1700 systems (J1 supplementary witnesses); every satisfiable-control
      non-refutation (listed solutions, J1 VC-3); ann-v1 15/15. Derived:
      W_4 non-refutation of 195 N-F219 and 191 N-AFF19 unsatisfiable systems
      (J1's own-code profile [0, 0, 19, 399, 3819] with W^(1) = W^(0), plus
      J1's M_4 witnesses; D-3 is J11's). Certified on 5 N-F219 and 9 N-AFF19.
      Engine-reported only: W_4 non-refutation of 190 of the 200 unsatisfiable
      N-ELL19 systems (10 certified), final-dimension / codim values, every rank
      and profile (sigma, FULL count, N19-DR-7 fractions -- blind-reproduced
      on the pool, not certifiable by any frozen format) and ell_route.
      Sensitivity (exact CP95): the W_4 rows of N19-DR-4 against N-ELL19 and
      N-AFF19 hold even if every non-certified control non-refutation were
      wrong (upper bounds 0.97577 and 0.97922 < 0.99082); the row against
      N-F219 would not (0.99183), so it rests on the D-3 derivation.
    C-NONREF_vacuity: >-
      (DEC-20260926-f6a749 R-9) leaves NO count uncertified: every primary
      system is a certified W_4 refutation. It leaves UNTESTED the ann-v1 path
      on an unsatisfiable S_3-algebra system (exercised only on N-ELL19,
      N-F219, N-AFF19 and satisfiable S3-SAT100 systems) and C-NONREF's
      instrument role on the primary arm, where over-computation of W_4 is
      excluded instead by the verified wdag-v1 and the blind literal W_4.
    verdict: holds
    verdict_basis: D-1 verified, D-6 verified, no crafted false certificate passes a frozen rule, and every count cites certificates that certify what it names (MR19-1 and the MR19-3 counting column use wdag-v1 only; ann-v1 counts use (A1)-(A3) as frozen)

