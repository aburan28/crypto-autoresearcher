# J9 (c) -- DECLARED ARTEFACT SIGNATURES, written BEFORE any own-code
# computation of (c) and before comparing anything with closures.jsonl.gz
# beyond (b). Red team TASK-20260926-fee7a9, session-1.
#
# Disclosure of what I had already seen when writing this (so the declaration
# can be weighed): run-report.md (the mechanical verdicts, including the S3-U400
# R'_4 profile distribution), implementation.md, the review plan's J9 pattern
# statement, the ONE full closures record of S3-U400:0 (printed while learning
# the record schema), and the (b) table (ell_route false and
# dims_by_deg(R'_4)[0] = 0 on all 1350 systems of the four arms).
#
# THE PATTERN UNDER ATTACK (plan J9): on S3-U400, M_4 refutes at the floor and
# W_4 at the ceiling of their ranges, and the ell route (1 in rowspace(M_4) +
# ell * B_{<=3}, equivalently 1 in R'_4 by D-2) never succeeds on the arms where
# it is computed.
#
# SYSTEMS: the 20 lowest-index S3-U400 systems (S3-U400:0..19) and the 10
# lowest-index UNSATISFIABLE N-CONV19 systems (by instance index, role unsat).
#
# OWN-CODE QUANTITIES (no crypto_autoresearcher import; written before I read
# the engine, impl/closures.py or impl/rcb.py):
#   Q1  own S_3 descent from x_R (own F_{2^19}, own expansion) against the
#       archived E_hex (S3-U400: all 211 columns; N-CONV19: the quadratic
#       columns 21..210 against the S_3 system at the slot's x_R).
#   Q2  own M_3 and M_4: rank, 1 in rowspace, dims_by_deg d = 0..4.
#   Q3  own left kernel of the 19 x 190 quadratic-column submatrix; c against
#       Tr(t^k / x_R^2) (own trace); ell = sum c_k f_k (support, constant).
#   Q4  ell_route computed DIRECTLY: 1 in rowspace(M_4) + ell * B_{<=3}.
#   Q5  own R'_3 rank and R'_4 rank, one, dims_by_deg after v_{j*} := ell + v_{j*}.
#   Q6  own LITERAL W'_4 on the substituted system: every basis element of
#       W^(i) cap B'_{<=3} multiplied by every v_j at every iteration, fully
#       re-eliminated; dims per iteration, fixpoint, first iteration with 1,
#       dims_by_deg; plus the fill decomposition (which products fill
#       B'_{<=3} and reach 1: products of the degree-<=2 part of the fallen
#       space alone, of the degree-3 part alone, and of R'_3's span alone).
#   Q7  (first 10 S3-U400 of the 20, for J10 (1)) own literal W_4 at nv = 20.
#
# SIGNATURES. The pattern is an ARTEFACT of cause X iff the stated own-code
# outcome occurs on at least one system; otherwise that cause is excluded on
# these systems (for this instrument pair only: my code and the engine could
# still share a misreading of the specification text, which J1 / J6 / J7 test).
signatures:
  A1_construction:
    meaning: The systems are not the frozen object (wrong descent, layout, curve constant, variable offset or N-CONV19 kept part), e.g. easier than S_3 at x_R.
    artefact_iff:
      - Q1 own E differs from the archived E_hex in any bit (S3-U400), or the archived N-CONV19 quadratic columns differ from own S_3 quadratic columns at the slot's x_R.
      - Q3 kernel dimension != 1, or c != Tr(t^k / x_R^2), or ell != v_0 + v_10 + Tr(B / x_R^2) on an S3-U400 system.
    excluded_iff: Q1 equal on all systems and Q3 as stated on all systems.
  A2_closure_implementation:
    meaning: The engine over-computes W_4 (ceiling) or under-computes M_4 (floor), or computes R'_4 / ell_route wrongly (never-succeeding ell route).
    artefact_iff:
      - Q2 own M_4 contains 1 on a system the run records as M_4-unrefuted (floor is under-computation), or own M_4 rank / dims_by_deg differ from the record.
      - Q6 own literal W'_4 does NOT contain 1 (or Q7 own W_4 does not) on a system the run records as W_4-refuted (ceiling is over-computation), or its per-iteration dims / fixpoint / first-1 iteration / dims_by_deg differ from the record (archived W_4 via T4, or the archived W'_4 where recorded).
      - Q4 own ell_route true, or Q5 own R'_4 contains 1, on any system (ell-route failure is a computation artefact), or own R'_3 / R'_4 profile differs from rc_b.
    excluded_iff: every Q2, Q4, Q5, Q6, Q7 value equals the record.
  A3_certificate_checker:
    meaning: The W_4 ceiling is produced by a lenient checker accepting certificates for false memberships; or the M_4 floor by a checker rejecting true ones.
    artefact_iff:
      - Q6 / Q7 own closure shows 1 NOT in W_4 on a system counted as W_4-refuted with a verified wdag-v1 (the count then rests on a false certificate).
      - Q2 own M_4 contains 1 on a system with no counted M_4 refutation AND the run's certificate tables show a submitted-but-rejected M_4 certificate for it.
    excluded_iff: own closures agree with the counted memberships on every system (the pattern then does not depend on the checker at all; certificate soundness itself is J1 / J8).
  A4_degree_cutoff:
    meaning: The contrast depends on the D = 4 cutoff being breached (degree-5 content entering W_4) or is a boundary effect of where D = 4 sits.
    artefact_iff:
      - Q6 / Q7 own STRICT-degree literal closure (multiplicands of degree <= 3 only; every product multilinearly reduced; nothing of degree 5 formed) does not reach 1 where the record does.
      - An own M_4 non-refutation that is forced by a pure size count (rank bound against 4009 rows / 190 trivial syzygies) with no algebraic content, so that the floor is an artefact of D rather than of the system; tested in (d).
    reading_not_artefact: >-
      If own W_3 (J9 (e), 5 systems) already contains 1, the refutation degree
      is 3 and the M_4 floor is a plain-Macaulay limitation (no fall reuse), a
      closure property, not an artefact of the D = 4 cutoff. If W_3 does not
      contain 1 and W_4 does, the refutation first occurs at D = 4.
declared_expectation_not_a_signature: >-
  My expectation (not used to read anything): A1-A4 excluded; the ceiling
  forced at iteration 1 by v_j-products of M_4's fallen space; the floor
  implied by 1 not in R'_4 via D-2 (1 in M_4 implies 1 in rowspace(M_4) + ell
  * B_{<=3}); whether 1 not in R'_4 is forced I do not know.
