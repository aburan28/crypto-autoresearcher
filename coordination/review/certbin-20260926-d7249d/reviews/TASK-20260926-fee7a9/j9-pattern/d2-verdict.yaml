# J9 (a) -- D-2 checked as a proof, BEFORE any computation of this task
# (ORDER.log). Red team TASK-20260926-fee7a9, session-1.
# Sources: review-plan.yaml derivations_to_check D-2 (internal);
# EXP-CERTBIN-060020 specification.yaml object.ell_and_rc_b steps (1)-(5),
# object.derived_per_instance (ell_route), object.by_reference (internal);
# EXP-CERTBIN-e94b27 specification.yaml object.macaulay_M_D / mutant_closure_W_D
# (internal). Nothing computed before this file was written.
d2_verdict:
  derivation: D-2
  owner_joint: J9
  rt6_status: verified
  scope_of_verification: >-
    Every system on which rc_b step (4) was executed: the left kernel of the
    19 x 190 quadratic-column submatrix has dimension 1 (or, for N-ELL19, c =
    e_18 is used), ell = sum_k c_k f_k has NONZERO linear part, and pi is the
    substitution v_{j*} := ell + v_{j*}. D-2 says nothing about systems where
    step (3) fires (ell constant: REFUTED-AT-DEGREE-2 or ELL-TRIVIAL, no R'_4
    exists) or where RC-B is not applicable (kernel dim != 1); on those the
    record-level check of J9 (b) cannot be made and is reported as n/a.
  proof: >-
    Notation. B = F_2[v_0..v_19]/(v_i^2 + v_i); f_0..f_18 of degree <= 2;
    rowspace(M_4) = span{mu f_k : mu multilinear monomial, |mu| <= 2}; ell =
    sum_k c_k f_k with c in the left kernel of the quadratic columns, so ell
    is affine of degree 1. Let j* be the least index in ell's linear support
    and put L := ell + v_{j*}, an affine form free of v_{j*}. Let B' be the
    Boolean ring on the other 19 variables, identified with the subring of B
    of polynomials free of v_{j*} (relabelling is a bijection of variable
    names and changes no membership or dimension).
    (1) pi is a well-defined ring map B -> B'. Define pi by v_{j*} -> L and
    v_i -> v_i otherwise. It respects v_{j*}^2 + v_{j*} because L^2 = L in B'
    (squaring is additive over F_2 and fixes each v_i and each constant). It
    is the identity on B', and pi(ell) = pi(v_{j*}) + L = L + L = 0.
    (2) pi(B_{<=d}) is contained in B'_{<=d}: substituting an affine form for
    one variable does not raise degree, and multilinear reduction does not
    raise it.
    (3) pi(rowspace M_4) = rowspace R'_4. For mu with |mu| <= 2, pi(mu f_k)
    = pi(mu) pi(f_k) and pi(mu) is a sum of monomials mu'' of degree <= 2 in
    B'; so pi(mu f_k) = sum mu'' f'_k lies in rowspace R'_4 (f'_k := pi(f_k),
    exactly the 19 substituted equations of step (4)). Conversely every row
    mu' f'_k of R'_4 (mu' a monomial of degree <= 2 in B') equals pi(mu' f_k)
    because pi fixes mu'. Hence equality of the two spans.
    (4) ker(pi) intersected with B_{<=4} equals ell * B_{<=3}. Write g in
    B_{<=4} uniquely as g = v_{j*} g1 + g0 with g0, g1 free of v_{j*}; deg g1
    <= deg g - 1 <= 3. pi(g) = L g1 + g0, so pi(g) = 0 iff g0 = L g1 in B',
    and then g = (v_{j*} + L) g1 = ell g1 with g1 in B_{<=3}. Conversely ell
    * h (deg h <= 3) has degree <= 4 after reduction and pi(ell h) = 0 * pi(h)
    = 0.
    (5) Therefore, for g in B_{<=4}: pi(g) in rowspace R'_4 iff g in
    rowspace(M_4) + ell * B_{<=3} (if pi(g) = pi(r) with r in rowspace M_4,
    then g - r is in ker(pi) cap B_{<=4}). Take g = 1 (pi(1) = 1): ell_route
    holds iff 1 is in rowspace R'_4. Finally dims_by_deg(X)[0] =
    dim(X cap B'_{<=0}) and B'_{<=0} = span{1}, so 1 in R'_4 iff
    dims_by_deg(R'_4)[0] = 1 (equivalently R'_4's `one` field). QED.
  consequences_recorded_before_computing:
    - >-
      ell_route and "1 in R'_4" are ONE observable (the plan's
      observation_collision (2)); a disagreement on any system where step (4)
      ran is an implementation defect in ell_route, rc_b or the engine, and
      agreement is not two pieces of evidence.
    - >-
      The same argument gives the containment rowspace(M_4) + ell * B_{<=3}
      = pi^{-1}(R'_4) cap B_{<=4}, and this space is contained in W_4: ell is
      in rowspace M_4 (mu = 1), deg ell = 1 <= 3, so v_a ell, v_a v_b ell and
      v_a v_b v_c ell enter W_4 by rule (ii) within three iterations. So a
      POSITIVE ell_route forces a W_4 refutation; a NEGATIVE ell_route leaves
      W_4 open, and any W_4 refutation on such a system must use mutants
      beyond pi^{-1}(R'_4). This does not depend on T4 or T5.
    - >-
      D-2 is a statement about R'_4 (the Macaulay space of the substituted
      system at degree 4), not about W'_4. It does not by itself say whether
      1 in W_4 iff 1 in W'_4 (that is T4, owned by J10 as D-4).
  hidden_assumptions_named:
    - The ell used by ell_route is the same ell (same kernel vector c) as the one defining pi. If an implementation used different vectors (e.g. the C-ELL trace vector for one and the elimination kernel for the other) the identity can fail only if those vectors differ, which C-ELL is meant to exclude.
    - dims_by_deg is dim(X cap B_{<=d}), read from RREF rows by leading-monomial degree under a degree-compatible column order (the frozen convention); under a non-degree-compatible order the count would be a different quantity.
  counterexample: null
