d3_verdict:
  derivation: D-3
  owner_joint: J11
  rt6_status: verified
  statement_checked: >-
    If dims_by_deg(M_4)[3] = rank M_3, then rowspace(M_4) cap B_{<=3} =
    rowspace(M_3), W^(1) = W^(0), W_4 = M_4 with fixpoint at iteration 0; if
    also dims_by_deg(M_4)[0] = 0, 1 is not in W_4.
  proof: >-
    (1) rowspace(M_3) is contained in rowspace(M_4) cap B_{<=3}: every M_3 row
    mu f_k (|mu| <= 1) is an M_4 row (|mu| <= 2) of degree <= 3.
    (2) dims_by_deg(M_4)[3] is dim(rowspace(M_4) cap B_{<=3}) (leading
    monomial degree under a degree-compatible order), so equal dimensions
    give equality of the two spaces.
    (3) Rule (ii) at iteration 0 multiplies a basis b of W^(0) cap B_{<=3} =
    rowspace(M_3) by v_j. Each b is a sum of rows mu f_k with |mu| <= 1, so
    v_j b = sum (v_j mu) f_k, and v_j mu is a multilinear monomial of degree
    <= 2 (v_j mu = mu if j is in mu); each term is a row of M_4. Hence
    W^(1) = W^(0) and the iteration stops at i = 0 with W_4 = rowspace(M_4).
    (4) dims_by_deg(M_4)[0] = dim(rowspace(M_4) cap span{1}) = 0 says 1 is
    not in rowspace(M_4) = W_4. QED.
  scope_note: >-
    The hypothesis concerns the per-system profile; the exactly semi-regular
    profile [0, 0, 19, 399, 3819] is one instance (399 = rank M_3 there). The
    derivation needs an ACCURATE profile: here it is my own-code profile
    (J11 (2)), not the engine's, so a control's non-refutation rests on
    independent elimination plus this derivation, not on the engine.
  counterexample: null
