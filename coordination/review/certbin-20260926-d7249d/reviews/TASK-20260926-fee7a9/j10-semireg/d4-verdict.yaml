# J10 (1) -- D-4 (T4 at n = 19 with 1160, and T5) checked as proofs; D-5
# checked numerically. Red team TASK-20260926-fee7a9, session-1.
# Sources (internal): H-CERTBIN-e3ac93 mechanism (SUBSTITUTION T4/T5);
# coordination/review/certbin-20260924-3d7e1a/reviews/TASK-20260924-d95e70/j9-ptm/o2-declaration.yaml
# (prediction_derivation T4, T5 at n = 17); EXP-CERTBIN-060020 specification
# object.ell_and_rc_b (5)-(6); review-plan derivations_to_check D-4, D-5.
d4_verdict:
  derivation: D-4
  owner_joint: J10
  rt6_status: verified
  hypotheses_used: >-
    ell = sum_k c_k f_k is affine with NONZERO linear part (so rc_b step (4)
    runs), j* its least linear index, L = ell + v_{j*} (free of v_{j*}), pi:
    B -> B' the ring map v_{j*} -> L (well defined because L^2 = L in B').
    ell lies in rowspace(M_4) (mu = 1 rows). Nothing else about S_3 is used;
    in particular nothing about v_0 := v_10, x(2E) or n.
  T4_proof: >-
    Claim: W_4 = pi^{-1}(W'_4) cap B_{<=4}; dim W_4 = dim W'_4 + 1160; 1 in
    W_4 iff 1 in W'_4.
    (a) ker(pi) cap B_{<=4} = ell * B'_{<=3} (proof in j9-pattern/d2-verdict.yaml
    step (4)); the map g1 -> ell g1 on B'_{<=3} is injective (the
    v_{j*}-coefficient of ell g1 is g1), so this kernel has dimension
    dim B'_{<=3} = 1 + 19 + 171 + 969 = 1160 in 19 variables.
    (b) ell * B'_{<=3} is contained in W^(1) already: for |mu| <= 2, mu ell =
    sum c_k mu f_k is in rowspace(M_4) and has degree <= 3, so v_a (mu ell)
    is in W^(1); these products and the rows mu ell span ell * B_{<=3}.
    (c) S := pi^{-1}(W'_4) cap B_{<=4} contains rowspace(M_4) (pi maps it onto
    R'_4, j9-pattern/d2-verdict.yaml step (3)) and is closed under g -> v_j g
    for deg g <= 3: pi(v_j g) = pi(v_j) pi(g), pi(g) is in W'_4 of degree <=
    3, and pi(v_j) is v_j (j != j*) or the affine form L (j = j*), and W'_4
    is closed under each variable and under addition. So W_4 <= S.
    (d) pi(W_4) contains R'_4 and is closed under the W'_4 rule: if h' in
    pi(W_4) has degree <= 3, pick g in W_4 with pi(g) = h'; then h' - g is in
    ker(pi) cap B_{<=4} <= W_4 by (b), so h' (as an element of B free of
    v_{j*}) is in W_4, hence v_j h' is in W_4 and pi(v_j h') = v_j h' is in
    pi(W_4) for every j != j*. So W'_4 <= pi(W_4).
    (e) From (c), pi(W_4) <= W'_4, so pi(W_4) = W'_4; with (b) and (d), for g
    in S, pi(g) = pi(w) for some w in W_4 and g - w in ker <= W_4, so S <=
    W_4. Hence W_4 = S, dim W_4 = dim W'_4 + 1160 (pi maps B_{<=4} onto
    B'_{<=4} because it fixes B'_{<=4}), and 1 in W_4 iff pi(1) = 1 in W'_4.
    QED.
  T5_proof: >-
    Claim: if R'_4 cap B'_{<=3} = rowspace(R'_3) then W'_4 = R'_4; then W_4 =
    rowspace(M_4) + ell * B_{<=3}, final_dim = rank R'_4 + 1160, 1 in W_4 iff
    1 in R'_4, dim(W_4 cap B_{<=d}) = dims_by_deg(R'_4)[d] + dim B'_{<=d-1},
    and W^(1) = W_4.
    Proof: a basis element b of R'_4 cap B'_{<=3} = rowspace(R'_3) is a sum of
    rows mu' f'_k with |mu'| <= 1, so v_j b is a sum of R'_4 rows: W'_4 = R'_4
    (fixpoint at 0 for the substituted system). By T4 and D-2 step (5), W_4
    = pi^{-1}(R'_4) cap B_{<=4} = rowspace(M_4) + ell * B_{<=3}. pi restricted
    to B_{<=d} is onto B'_{<=d} with kernel ell * B'_{<=d-1} (same argument as
    D-2 step (4) with degree d), giving the dims_by_deg formula. By T4 (b),
    ell * B_{<=3} <= W^(1), so W^(1) = W_4; iterations_to_fixpoint = 1 iff
    rank M_4 < final_dim, else 0. QED.
  numerical_check_T4: >-
    Own literal W_4 (nv = 20) and own literal W'_4 (nv = 19) on 30 systems
    (S3-U400:0..19 and 10 N-CONV19), j9-pattern/c-own.jsonl: final_dim(W_4) =
    final_dim(W'_4) + 1160 and one(W_4) = one(W'_4) on 30/30
    (j9-pattern/c-comparison.json own_T4_holds_all true); the archived T4
    records agree field by field where recorded.
  D5:
    derivation: D-5
    rt6_status: verified
    how: >-
      Exact integer series (1+z)^n / (1+z^2)^m with math.comb
      (code/j10_series.py -> j10-semireg/series-and-references.json); every
      number of D-5 is reproduced: n20_m19 1, 20, 171, 760, 1425, -2356;
      n19_m18 1, 19, 153, 627, 969, -2565; rank M_3 399; rank M_4 3819;
      profile [0, 0, 19, 399, 3819]; rank R'_3 360; profile [0, 0, 18, 360,
      3267]; T5 record final_dim 4427 and dims_by_deg [0, 1, 38, 551, 4427];
      fixtures M_3 399 x 1351, M_4 4009 x 6196, R'_3 380 x 1160, R'_4 3629 x
      5036; 4009 - (C(19,2) + 19) = 3819.
    what_is_arithmetic_and_what_is_model: >-
      The numbers are checked arithmetic. That a semi-regular Boolean system
      has Hilbert series (1+z)^n / (1+z^2)^m truncated before its first
      non-positive coefficient, and that the degree-d profile of M_4 equals
      dim B_{<=d} minus the partial sums, is the Bardet-Faugere-Salvy
      semi-regular model for Boolean systems: provenance `recalled` (I did
      not open the source in this task); RT-20260924-d95e70 J8 is cited by
      the specification as having verified it. The reference is a
      DEFINITION of the comparison point, not a heuristic this contract
      tests (heuristic_under_test null). The model is confirmed exactly on
      this run's same-support controls by my own elimination (J11 (2):
      400/400 N-F219 and N-AFF19 unsatisfiable systems at [0, 0, 19, 399,
      3819]; 200/200 N-ELL19 at [0, 0, 18, 360, 3267]).
