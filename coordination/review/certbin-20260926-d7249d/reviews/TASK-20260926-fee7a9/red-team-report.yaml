      text: >-
        THE ROUTE TO 1 CHANGED, AND "PERSISTS" HIDES IT. At n = 17, 1 was in
        R'_4 (ell route) and in M_4 for 84%. At n = 19 it is in neither, and
        is reached only by iteration-1 mutant products of degree-<=2 falls.
        The flat W_4 rate coexists with a collapsed plain-Macaulay rate. Any
        quoting of "386/386 then 400/400" must say so.
    - id: OBJ-R3
      text: >-
        GATE DRIFT FROM R_4 TO W_4 (J12). NA-5's pricing gate and object are
        the plain D = 4 Macaulay rate and filter. That rate is 0/400 here.
        NA-3 re-based the gate to W_4 while calling NA-5 "unchanged", and the
        spec's positive_next_decision inherits NA-5's object. Ratifying the
        flag without restating this waives a failed premise.
    - id: OBJ-R4
      text: >-
        C-M'S STATISTIC IS COARSE. sigma > 0 is generated entirely by
        degree-<=2 falls and holds on N-CONV19. The 18-in-19 reference is the
        wrong baseline for the 216/400 systems whose substituted span contains
        an affine form; the verdict survives the corrected baseline. The
