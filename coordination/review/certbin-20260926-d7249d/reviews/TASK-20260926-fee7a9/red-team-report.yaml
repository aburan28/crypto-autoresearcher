    - id: OBJ-R5
      text: >-
        EXECUTOR-ATTESTED ORDERING. That predictions were written before phase
        4 rests on manifest timings only. No archived byte timestamps it
        independently.
  required_controls:
    - id: RC-R1
      text: >-
        W_3 ACROSS ARMS (cheapest discriminator found). Run W_3 on S3-U400,
        N-CONV19, N-PERT19 and the nulls. S_3 3/3 against N-CONV19 0/2 at D =
        3 is the only S_3-versus-tensor separation observed. As a rate it
        would locate S_3-specific (lower-part) content that W_4 cannot see.
        It needs a successor contract or a Coordinator-authorized
        verification computation.
    - id: RC-R2
      text: >-
        PERTURBATION LADDER BEYOND ONE COEFFICIENT. Flip t random bilinear
        coefficients (t = 2, 4, 8, ..., up to fully random on the support),
        or replace r rows by same-support random rows (r = 1..19). Measure
        the W_4 rate and the M_4 degree-2 fall. This locates the threshold
        between the refuting tensor neighbourhood and the semi-regular nulls,
        which is what "which algebra" needs next.
    - id: RC-R3
      text: >-
        SEPARATE n FROM CURVE / h / MODULUS for the M_4 collapse and the loss
        of FULL. Use EXP-CERTBIN-3f06d1's h = 2 cell at n = 17 (named in
        H-CERTBIN-e3ac93) and the attention contract's second n = 19 curve
        (h = 4). Without them nothing about the 0.84 -> 0 drop is
        attributable to n.
  counterexample_or_mutation: >-
    N-PERT19 (O4) is the mutation. A single flipped tensor coefficient,
    breaking ell on 23/40, leaves W_4 refutation at 40/40. That is the
    counterexample to "S_3's exact tensor (or ell) is load-bearing at W_4".
    No counterexample to D-2, D-3, D-4 or D-5, and no proves-too-much failure
    (O1-O3).
  baseline_comparison: >-
    This cell makes no cost claim, and nothing here changes that. Per m = 2
    attempt, oracle A (2^10 = 1024 quadratic root-findings over V) decides
    satisfiability outright and dominates M_4 (4009 x 6196) and W_4 (one
    extra elimination of a 28631 x 6196 stack at iteration 1). For the DLP
    at q = 261823, parallel Pollard rho needs about sqrt(pi q / 4), about
    453 group operations, and BSGS about 2 sqrt(q), about 1023. Index
    calculus at m = 2 needs about as many relations as factor-base points
    (hundreds), each costing at least one oracle-A call (2^10 root-findings),
    so relation collection alone is orders of magnitude above rho (my
    arithmetic, not measured).
    dominated_by as written (oracle A; rho) is correct. Its frontier is
    incomplete on the per-attempt axis (FES and WDSat "not compared"), but
    that cannot change the dominated status, only the margin. sota_delta
    zero.
  heuristic_challenges:
    - No numbered heuristic is tested (heuristic_under_test null). The semi-regular model (recalled) is used as a reference only. It transfers exactly to same-support random systems and not at all to S_3 or N-CONV19. The structured object is not random, as the cheapest experiment (N19-DR-7 itself) already shows.
  cost_model_challenges:
    - Any m >= 3 reading must price a W-type filter, not M_4. That means the iteration-1 product stack (about 20 x fallen + basis rows, 28631 at n = 19), masking cost if branch-free, and total expected cost = per-attempt cost x inverse relation probability at m = 3, which is unmeasured. Nothing here supports M_4 as a filter at n = 19.
  reduction_and_scope_challenges:
    - KN-OPEN-3c8f51 item (B) and resolution criterion 2 name the plain D = 4 rate. Answering them from the W_4 rate must say so (J14).
    - The N19-DR-1 n = 17 comparison line should add modulus shape and l to its confound list, and note that the two 100% W_4 figures are reached by different routes.
  proof_architecture_challenges:
    - Nearby-object attack (section 8 item 4) - run (O4). The method does not distinguish S_3 from its one-coefficient neighbours, so it has not identified an S_3-specific load-bearing structure at W_4.
    - Observation-fiber attack - ell_route and R'_4.one are one observable (D-2). A POSITIVE ell_route would force refutation (D-2 containment in W^(1)), but its failure is uninformative about W_4.
    - Method ceiling - W_4 refutes the whole S_3 arm and equals the full degree-4 ideal on satisfiable S_3 systems. At this cell it is saturated and cannot rank systems. A rate at a ceiling cannot show S_3-specificity; only a lower closure (W_3) or a harder object can.
  narrowest_supported_statement: >-
    At n = 19 (t^19 + t^5 + t^2 + t + 1), m = 2, l = 10, one curve (h = 2),
    x(2E) targets, subject to the admissibility joints: plain degree-4
    Macaulay refutes none of the unsatisfiable S_3 attempts; the degree-4
    mutant closure refutes all of them at its first iteration; and on
    satisfiable S_3 systems it equals the whole degree-4 part of the ideal.
    This is forced by the algebra, not by the instrument (own-code agreement
