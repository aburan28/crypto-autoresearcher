        semantically independent route (truth tables over all 2^20 points;
        degrees from the Moebius transform) agrees on 2400/2400. No verified
        certificate on a system with own s >= 1.
    - id: VC-5 ann-v1
      result: >-
        15 submitted, 15 verified, 0 rejected. N-ELL19 (5): |L| = 1769, rank
        1769, dim S = 4427, dim S cap B_<=3 = 551. N-F219 (5) and N-AFF19 (5):
        |L| = 2377, rank 2377, dim S = 3819, dim S cap B_<=3 = 399. (A1), (A2)
        (no degree overflow) and (A3) pass on every one; exactly one
        functional per certificate has lambda(1) = 1.
    - id: VC-6 primary-arm M_4 witnesses
      result: >-
        1 is NOT in rowspace(M_4) for 400/400 S3-U400 systems (own
        elimination); 400 functionals written to m4-witnesses.jsonl.gz, each
        checked to vanish on all 4009 unreduced M_4 rows with lambda(1) = 1;
