  metric_recomputations:
    - id: VC-1 self-tests
      result: >-
        ALL PASS (work/selftest.json). Modulus t^19+t^5+t^2+t+1 irreducible
        (gcd test i = 1..9 and t^(2^19) = t); the four smaller pentanomials
        reducible; field axioms on 10^4 triples; C and Python multiplications
        agree on 10^5 pairs. Curve: P, Q on E, [q]P = [q]Q = O, Q = [5170]P, q
        prime, Tr(A) = 1, tau = Tr(t^j) is 1 exactly at j = 0, 17; group law
        on 30 random triples. S_3 from KN-TECH-b18366 vanishes on all 400
        evaluations over 200 point pairs (100 pairs from the literal P, Q; 100
        from lifted random points; x(P1 + P2) and x(P1 - P2)) and on 0 of 200
        random third abscissae. Both descent routes agree on 20 x_R, and
        against direct evaluation on 1000 random points. Exhaustive s equals
        fully naive evaluation on 4 systems and 12,800 point checks. Ring
        product and multiplication by v_j equal truth-table semantics over all
        2^20 points. Rank equals an independent big-integer elimination on 60
        random matrices. Planted flat-v1 and wdag-v1 positive and negative
        checks behave, including rule (c) and rule (b) violations.
    - id: VC-2 rebuild and structure
