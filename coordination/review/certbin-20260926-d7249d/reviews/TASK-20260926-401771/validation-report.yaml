        (interpolation) = archived E_hex on 1100/1100 (no first differing
        (row, column) exists); affine decomposition E^0 + sum r_j E^j exact on
        1100/1100. N-CONV19: quadratic columns 21..210 equal E_S3 at the
        slot's x_R 250/250; slot/s3_key/x_R consistent 250/250; linear and
        constant part inside S_L 250/250. N-ELL19: rows 0..17 inside U
        250/250; row 18 = ell_lin + c (ell_lin = v_0 + v_10) 250/250. N-F219
        inside U 250/250. N-AFF19 inside U and inside the affine support at
        its x_R 250/250. Stream replays of the synthetic arms: NOT done
        (optional under VC-2; J2 owns them).
