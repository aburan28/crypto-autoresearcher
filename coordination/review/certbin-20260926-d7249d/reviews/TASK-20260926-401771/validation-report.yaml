        PASS on all 2100 systems. Own codec round trip 2100/2100; E_hex in
        canonical form 2100/2100; E_sha256 2100/2100 (preimage reading
        AMB-1). Curve-algebra (S3-U400 400, S3-SAT100 100, F-RANDX19 600):
