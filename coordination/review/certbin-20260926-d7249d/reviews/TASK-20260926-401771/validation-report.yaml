        witness also certifies 1 not in M_3. Supplementary (not required):
        the same decision on the other 1700 systems finds 1 in M_4 on none,
        witnesses checked (work/m4-supp-witnesses-*.jsonl.gz); in particular
        no satisfiable control is refuted by my M_4.
    - id: post-seal comparison with the run (post-seal-comparison.json)
      result: >-
        No issue. Every system the run records as W_4-refuted (S3-U400 400,
        N-CONV19 unsat 200, F-RANDX19 600) carries a J1-verified wdag-v1, and
