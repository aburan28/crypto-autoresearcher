  # ---------------------------------------------------------------------------
  method:
    source_of_definitions: >-
      EXP-CERTBIN-060020 object (field, curve, factor base, S_3, descended
      system, E_layout, parts, ell_and_rc_b, certificate_format),
      EXP-CERTBIN-e94b27 object (macaulay_M_D, mutant_closure_W_D) at nv = 20,
      neq = 19, EXP-CERTBIN-4e92d7 object.macaulay_matrix (row convention),
      KN-TECH-b18366 (S_3), this card (BR-1..BR-12, Q1..Q7). No other source.
    code: >-
      code/ -- field.py (F_{2^19}, trace, half-trace, curve arithmetic),
      algebra.py (monomial orders, generic S_3 descent, Macaulay matrices,
      semi-echelon basis over the C kernel, literal W_D, exhaustive s,
      quadratic route to s, rc_b, ell_route), gf2kern.c (own bit-packed GF(2)
      kernels), certs.py (wdag-v1 and ann-v1 construction), checkers.py
      (self-contained numpy checkers with their own field arithmetic,
      closed-form descent, monomial arithmetic, coordinate order and
      elimination; shares no code with the other modules), selftest.py
      (BR-2), driver.py (pass driver, checkpoints, seal), ambiguities.json
      (read into rederivation.json), post_seal_verify.py (ADDED AFTER THE
      SEAL; reads, never writes, the sealed files). No file imports
      crypto_autoresearcher; the only third-party import is numpy.
    construction_of_systems: >-
      Curve kind: S_3(x_1, x_2, x_R) expanded by generic multilinear
      polynomial arithmetic over F_{2^19} (x_1 = sum v_j t^j, x_2 = sum
      v_{10+j} t^j, j < 10), equation k = coefficient of t^k. Cross-checked on
      every system against two hand closed forms (algebra.py and the
      checker's own). Explicit kind: the monomial lists of blind-inputs.json,
      parsed twice (driver and checker) and compared.
    elimination_method: >-
      Own C kernel: incremental bit-packed semi-echelon basis. Each row has a
      distinct leading column (its first set coordinate); a vector is reduced
      by XOR-ing the row of its lowest set pivot coordinate until no pivot
      coordinate is set, and a nonzero remainder is appended. Column order
      (-degree, bitmask ascending) is degree-graded, so dims_by_deg = number
      of rows with leading degree <= d, and "1 in X" iff the constant column
      (last) is a pivot. Cross-checked against an independent numpy
      Gauss-Jordan on random matrices (self-test). The checkers use their own
      numpy elimination and exact float32 BLAS parity products.
    W_4: >-
      Literal rule of EXP-CERTBIN-e94b27 mutant_closure_W_D at D = 4, j =
      0..19: W^(0) = rowspace(M_4); at every iteration the FULL basis of
      W^(i) cap B_{<=3} (all echelon rows of leading degree <= 3 at the start
      of the iteration) is multiplied by every v_j (multilinear reduction)
      and inserted; stop at the first i with dim W^(i+1) = dim W^(i); every
      dim W^(i) recorded (BR-4).
    s_routes: >-
      Route 1: packed truth tables of all 2^20 assignments, every equation
      evaluated exhaustively. Route 2 (curve kind; does not use the descended
      equations): for each x_1 in V, S_3 as a quadratic in x_2 over F_{2^19},
      roots by half-trace / square root / linear solve (exact case analysis,
      AMB-4), each root re-checked by direct S_3 evaluation, roots < 1024
      counted. Degenerate flag: x_R < 1024.
    rc_b: >-
      Steps (1)-(5) with the BR-5 blind reading of (1); left kernel of the
      19 x 190 quadratic block by own row reduction with identity tags
      (asserted to annihilate the block); for curve kind c_k compared with
      Tr(t^k / x_R^2); substitution v_{j*} := ell + v_{j*} with ascending
      relabelling; R'_3 and R'_4 as Macaulay closures in 19 variables.
      ell_route computed DIRECTLY from rowspace(M_4) + ell * B_{<=3} in 20
      variables (one extra elimination), not from R'_4. Q7 (optional):
      literal W'_4 on the substituted system wherever the substitution
      applied.
    certificates: >-
      wdag-v1: collapse-per-variable construction (AMB-16) from tagged
      rebuilt levels whose dimensions are asserted equal to the literal
      iteration's. ann-v1: L = the RREF-derived basis of the annihilator of
      the final W_4 (size codim W_4), in the frozen coordinate order. Every
      certificate is checked by checkers.py against a system rebuilt by the
      checker itself, rules (a)-(e) / (A1)-(A3) verbatim; (A2) uses a basis K
      of S cap B_{<=3} from the checker's own elimination.

