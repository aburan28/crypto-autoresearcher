        item: own literal, slow W_4 beside the archived records (attack (1))
        artifacts:
          - j3-closures/literal_w4.py (own code; Python-int rows over my own degree-compatible order, fresh pivot dict per iteration, EVERY basis element of W^(i) cap B_{<=3} times EVERY v_j at EVERY iteration, whole stack re-eliminated)
