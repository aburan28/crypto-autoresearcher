        passed: true
      - id: J3-2
        item: the semi-naive argument (DEC-20260924-5b1c8e R-1) at nv = 20 (attack (2))
        reading: >-
          closure.py _w_closure (lines 207-265) is generic in nv and neq; at nv = 20 nothing in
          the iteration differs from the RC-1 path. The only nv-dependent structures are
          mask2col (2^20 int64), colmap (int32, nv x C) and mu_order(D-2, nv). At iteration i it
          multiplies only basis rows whose low-degree lead is NEW (not a low lead of iteration
          i-1), then column-passes basis + products. It stops when the rank does not grow, and
          records 1 when the constant column becomes a pivot.
          Proof checked. Let L_k be the set of low leads of the echelon basis of W^(k). This set
          is intrinsic to the space (its size is dim(W^(k) cap B_{<=3})), so W^(k) subset
          W^(k+1) gives L_k subset L_{k+1}. Collect the rows r_{k',c} (c in L_{k'} minus
          L_{k'-1}, as they stood at k') for all k' <= k. They lie in W^(k) cap B_{<=3}, have
          distinct leads covering L_k, and so form a basis of W^(k) cap B_{<=3}. For k' < k, the
          products v_j r_{k',c} entered at iteration k'+1 <= k. Hence the literal W^(k+1) equals
          W^(k) + span{v_j r_{k,c}}, which is the semi-naive update. The two schedules therefore
          produce the same W^(k) for every k, the same fixpoint index (the check iteration
          included) and the same first iteration containing 1. The argument holds unchanged at
          nv = 20. At iteration 0, prev_low is empty, so all low rows are new (the first
          iteration is identical under both rules).
          Empirical checks. (i) No archived W_4 or W'_4 record reaches fixpoint index >= 2
          (closures.jsonl.gz: every W_4 has fixpoint 0 or 1). On run data the schedules therefore
          differ only in the fixpoint-check iteration, which my literal confirms on 9 archived
          systems (J3-1). (ii) j3-closures/deep_constructed.py -> deep-constructed.json: 24
          CONSTRUCTED nv = 20 systems (own seed 20260926+42) with fixpoint index 2..7 (17 have
          >= 3). The engine equals my literal on every field and every per-iteration dimension.
        passed: true
      - id: J3-3
        item: C-LIT, C-BACKEND, C-WDAG and C-T4 -- literal? genuinely compared? can each fail? (attack (3))
        C-LIT:
          is_literal: >-
            Yes. impl/literal.py multiplies ALL low basis rows at every iteration and re-echelons
            the whole stack. It imports only numpy and itertools.
          genuinely_compared: >-
            Yes. driver.phase5_lit compares final_dim, one, iterations_to_fixpoint, dims_by_deg,
            dims and one_first_iteration with the records read back from closures.jsonl.gz. 40
            systems (5 unsatisfiable per arm and per F-RANDX19 stratum); 0 differences recorded.
          can_detect: an engine W_4 whose iteration, fixpoint, per-iteration dimensions or final profile differ from the literal rule on the 40 systems.
          cannot_detect: >-
            A defect in the E_hex -> equations conversion (common.E_to_eqs is shared with the
            engine path), a misreading of the W_D definition shared by its author (the same
            executor), anything on satisfiable systems or outside the 40, M_3 / M_4 / R'_4
            profiles, and certificates. My own literal (own codec, own reading of the frozen
            text) agrees on 9 further systems, which closes the first two gaps on those 9.
        C-BACKEND:
          what_it_is: >-
            A separate process with CRYPTO_AR_GF2_BACKEND=reference. It runs the numpy reference
            KERNELS (column_pass, products via Closure.maps, xor_bits via np.bitwise_xor.at,
            backtrace) under the SAME closure.py orchestration and the same impl code (E_to_eqs,
            CL.macaulay, CL.w_closure). It compares M_4 and W_4 records on 80 systems.
          can_detect: >-
            A divergence between the native C kernels and the numpy reference kernels that
            changes an M_4 or W_4 record on those 80 systems.
          cannot_detect: >-
            Anything shared by both backends: closure.py's Macaulay indexing (mu order, row index
            mu_index*neq+k, column order), Closure.__init__'s colmap / maps construction, the
            semi-naive iteration, the fixpoint and one_first rules, the lead-degree
            classification, impl's E_to_eqs and extractors. It also cannot detect a defect in the
            reference kernels mirrored by the native ones, or anything in rc_b (R'_3 and R'_4 at
            nv = 19 are not compared), in certificates, or on satisfiable systems. The "S3-U400
            systems W_4 does not refute" part of its selection is empty in this run. It is a
            kernel-level differential test, narrower than its name, as the plan expected. It is
            not an orchestration-independent check of W_4; J3-1 and J3-2 are.
          can_fail: yes, for kernel divergence only
        C-WDAG:
          what_it_is: >-
            driver.process_system sets C-WDAG_dims_ok iff the extractor's depth equals
            one_first_iteration and extractor_nb_per_level[L] == dims[L-1]. It also counts a W_4
            refutation without a produced wdag-v1 as UNCERTIFIED.
          can_fail: >-
            NARROWLY, and only on bookkeeping (finding J3-F1). The extractor is a subclass whose
            _extract receives the same `itl` list built by the same _w_closure call. depth =
            len(itl) - 1 = one_first_iteration by construction, and org['nb'] = len(prow) is the
            previous level's pivot count, which is the value that call appended to dims. The
            dimension clause therefore compares the engine's iteration with ITSELF and cannot
            detect an iteration error. It can still fire on an extraction-record mix-up, for
            example a _last_extract left over from another call or thread (reset to None before
            each call in closures.w_closure) belonging to a system with different dimensions.
            Because the clause can fire, I do not count it as the plan's breaking artifact "a
            control that cannot fail as implemented". I report that it gives no evidence about
            W_4. The frozen text permits the subclass design (engine_provenance.import_rule), and
            under that design this is expected. The UNCERTIFIED branch is live. The soundness of
            the counted W_4 refutations rests on certificate verification (C-CERT in-run; J1
            author-independent) and, for the extraction, on my replay (J3-6), not on C-WDAG.
        C-T4:
          what_it_is: >-
            On the C-T4 set it compares the engine's W_4 (nv = 20) with the engine's W'_4
            (nv = 19) on impl's substituted system: final_dim(W_4) = final_dim(W'_4) + 1160 and
            one(W_4) = one(W'_4).
          can_fail: >-
            Yes. The two runs are on different systems in different variable counts, linked by
            the impl substitution. A substitution defect, or engine behaviour that differs
            between nv = 20 and nv = 19, would break it. An engine that skipped the iteration
            (W_4 = M_4) would also break it on non-refuted systems.
          cannot_detect: >-
            On refuted systems the relation reduces to "both refute" (6196 = 5036 + 1160
            trivially). An engine that over-computes both closures to the full space would
            therefore pass on the primary and N-CONV19 members of its set. It is informative on
            N-ELL19, where the exact final dimensions are compared.
          own_numbers: >-
            j3-closures/rcb_recompute.py: my literal W'_4 on my own substitution gives T4 exactly
            on all 7 substituted J3 systems (difference 1160, one equal), including the
            non-refuted S3-SAT100:99 (6194 = 5034 + 1160) and N-ELL19:249 (4427 = 3267 + 1160,
            equal to its archived W'_4 record).
        passed: true
      - id: J3-4
        item: multilinear reduction edge cases (attack (4))
        artifact: j3-closures/edge_multilinear.py -> edge-multilinear.json
        result: >-
          12 constructed products v_j * b with v_j dividing monomials of b, with hand-written
          expected values. Examples: v3*(v3v5 + v5) = 0; v3*v3 = v3; v3*(v3v5v7) = v3v5v7;
          v3*(1 + v3) = 0; v19*(v0v19 + v19 + v0 + 1) = 0; v4*(v1v2v3 + v1v2v4 + v1v2) =
          v1v2v3v4; v18*(v17v18v19 + v17v19 + v18v19 + v19) = 0. The engine's native products
          kernel, the numpy reference products and my own map all return the expected value in
