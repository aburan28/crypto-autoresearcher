        of each of N-CONV19, N-ELL19, N-F219, N-AFF19), for which "1 in X" is
        known false for every sound closure X. Every element of a sound closure
        vanishes on every Boolean solution, and the evaluation map from
        B_{<=d} onto F_2^S is surjective for any set S of at most 2^{d+1} - 1
        points (the dual of RM(d, 20) has minimum distance 2^{d+1}; recalled, a
        pointer -- verify it or mark it recalled). Hence codim(W_4 in
        B_{<=4}) = 6196 - final_dim >= s, with equality for s <= 31 iff
        W_4 = I cap B_{<=4}.
      - >-
        O2 -- SAME-SUPPORT NULLS WITH AN EXACTLY SEMI-REGULAR M_4 PROFILE
        (N-F219, N-AFF19 systems whose own-code profile, J11 (2), is
        [0, 0, 19, 399, 3819]): "1 in W_4" is derived false (D-3).
      - >-
        O3 -- N-ELL19 SYSTEMS WITH THE SUBSTITUTED REFERENCE PROFILE AND T5
        APPLICABLE: "1 in W_4" is derived false, with final_dim 4427 and
        dims_by_deg [0, 1, 38, 551, 4427] (T5; D-4, D-5).
    nearby_object_control:
      id: O4
      name: N-PERT19
      purpose: >-
        docs/inventor-protocol.md section 8 item 4 (method ceiling and
        nearby-object control): the closest object to the primary systems on
        which "S_3's own tensor is what refutes at W_4" can fail. Not a
        proves-too-much object (its outcome is not derived); a locating
        control whose every outcome is informative.
      construction: >-
        Base systems: the 20 lowest-index S3-U400 systems. One generator,
        numpy.random.Generator(numpy.random.PCG64(2026092670901)), numpy 2.4.6
        (record the version; if it differs, record the fact and proceed).
        Family P-BIL, slots i = 0..19 in index order, attempts a = 0..63: k =
        int(g.integers(0, 19)); c = int(g.integers(0, 100)); flip E[k, col]
        where col is the E_layout column of the pair (c // 10, 10 + c % 10) (a
        bilinear column, inside S_3's quadratic support); compute s by
        exhaustive 2^20 search; keep the first attempt with s = 0; record every
        rejected attempt. Then, continuing the SAME generator, family P-QUAD,
        same slots and attempt cap: k = int(g.integers(0, 19)); c =
        int(g.integers(0, 90)); flip E[k, col] where col is the c-th column,
        in E_layout order, among the 90 pairs (i, j) with i < j < 10 or
        10 <= i < j (non-bilinear quadratic columns). A slot unfilled after 64
        attempts is EXHAUSTED(cap), recorded, never redrawn.
      measurement: >-
        Per kept system: the left-kernel dimension of the quadratic-column
        submatrix and whether c = (Tr(t^k / x_R^2))_k is still in it (the flip
        preserves ell iff c_k = 0 for the flipped row k); M_4 and W_4 by the
        pinned engine, unchanged; rc_b where the kernel is 1-dimensional.
      reading_table_before_running: >-
        Before the engine runs, the red team writes and hashes a table stating
        what each outcome would mean, at least: refuted at the primary rate in
        both families (the refutation is robust to a one-coefficient change of
        the tensor: the load-bearing structure is coarser than S_3's exact
        tensor); refuted only where ell survives (the cokernel functional is
        load-bearing); refuted in P-BIL but not P-QUAD (the bilinear support is
        load-bearing); refuted in neither (the exact tensor is load-bearing).
    failure_signature: >-
      O1: on every satisfiable control, no M_3, M_4 or W_4 refutation and
      codim(W_4) >= archived s (closures.jsonl.gz final dims, instances.jsonl.gz
      s); report equality system by system for s <= 31; any codim < s means
      the engine's W_4 contains a polynomial outside the ideal, and the
      instrument is unsound although C-PS passed. O2 and O3: the pinned engine
      reports no W_4 refutation and exactly the derived final dimension (O3)
      or W_4 = M_4 (O2) on every such system (compute and DECLARE each derived
      value before running the engine). If the engine refutes one, run your own
      W_4: if yours refutes too, the derivation is wrong for that system (a
      finding about D-3 or T5, not the engine); if yours does not, the engine
      proves too much. O4 carries no failure signature (it is not a
      proves-too-much object); its reading table is the declared input.
    assigned_to: TASK-20260926-fee7a9
    authorization_note: >-
      Running the pinned engine on O1-O4, and the red team's own closures of
      J9-J11, are VERIFICATION computations authorized by DEC-20260926-f6a749
      R-10. They are not trials of EXP-CERTBIN-060020, not arms, and not
      evidence about H-CERTBIN-e3ac93; they get no RUN id, and their outputs go
      only under the red team's write scope. The N-PERT19 seed is fixed here,
      before any draw; the red team first greps experiments/*/specification.yaml,
      experiments/*/trial-plan*.json and coordination/review/ for it and
      stops if it occurs anywhere but in this round's records.

  blind_rederivation:
    required: true
    quantity: >-
      Every quantity computed from the specification text and the extracted
      instance inputs alone, for each of the 90 blind systems BI-001..BI-090 of
      coordination/review/certbin-20260926-d7249d/blind/blind-inputs.json, as
      TASK-20260926-f0736e Q1-Q7 define them: (Q1) s (two routes for curve
      kind) and the degenerate flag; (Q2) rank and "1 in" of M_3 and M_4 and
      dims_by_deg(M_4) for d = 0..4; (Q3) W_4 by the LITERAL rule, every
      iteration's dimension, the fixpoint index, the first iteration
      containing 1, the final dimension and dims_by_deg for d = 0..4; (Q4)
      rc_b by object.ell_and_rc_b steps (1)-(5) and ell_route computed
      DIRECTLY as 1 in rowspace(M_4) + ell * B_{<=3}; (Q5) a wdag-v1 for every
      W_4 refutation; (Q6) an ann-v1 for every W_4 non-refutation; (Q7,
      optional) W'_4 on curve-kind systems (T4 check).
    parameters: >-
      n = 19, f = t^19 + t^5 + t^2 + t + 1, m = 2, l = 10, V = {deg < 10},
      nv = 20, neq = 19, D in {3, 4}. Curve (A, B) and, per system, either x_R
      (curve kind) or 19 explicit Boolean polynomials (explicit kind) come
      from blind-inputs.json and nowhere else. The POOL is fixed here, before
      extraction, by arm, role, family / stratum and keep-order index only, and
      reads no closure field: the 40 lowest-index S3-U400; the 5 lowest-index
      S3-SAT100; the 5 lowest-index unsatisfiable systems of each F-RANDX19
      stratum (TWIST, X2E, XE-NOT-2E); the 10 lowest-index unsatisfiable
      N-CONV19; the 10 lowest-index unsatisfiable N-ELL19; the 5 lowest-index
