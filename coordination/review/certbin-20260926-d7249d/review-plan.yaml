    Claim tier: toy. Scope, verbatim from the specification: n = 19,
    f = t^19 + t^5 + t^2 + t + 1, m = 2, l = 10, polynomial V = {deg < 10},
    one curve A = 46693, B = 306147 (#E = 2 * 261823, h = 2), subgroup
