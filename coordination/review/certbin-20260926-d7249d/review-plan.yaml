  composition:
    rule: >-
      The Coordinator composes the verdicts in /review-evidence. No reviewer
      votes on the whole claim.
      - The run is ADMISSIBLE for interpretation iff J1, J2, J3, J5, J7 and J8
        hold (J7 on J6's and J1's archived outputs).
      - The mechanical verdicts stand as recorded iff J4 also holds.
      - MR19-1 is read as an author-independently certified count of W_4
        refutations exactly on the keys whose wdag-v1 J1 verifies; a key J1
        rejects applies INV-6 as frozen (MR19-1, MR19-3 and every refutation
        count void), whatever the run's own verifier said.
      - M_4 non-refutations of the primary arm are read as certified only on
        the keys J1 VC-6 witnesses; control W_4 non-refutations only where
        J1 verified an ann-v1 or J11 recomputed a profile to which a checked
        D-3 or T5 applies. Elsewhere they are engine-reported, and the
        evidence record says so.
      - J9, J10, J11 and J14 decide how the verdicts are READ in the evidence
        record; J13 decides whether the S_3-specificity reading at W_4 can be
        trusted at all; J12 decides what the N19-DR-9 flag may license. The
        flag itself is decided in DEC-20260926-901ea1.
      - A break of J2, J3 or J7 attributable to the producer, or of J5 on a
        data file, returns the run to the executor as an implementation
        failure (INV-8, INV-10). A break attributable to the engine is an
        engine defect reported to the dispatching session (the engine is not
        edited in review). Neither is evidence about H-CERTBIN-e3ac93.
      - `inconclusive` on an admissibility joint (J1, J2, J3, J5, J7, J8)
        holds the decision at `inconclusive`. The decision is not composed
        around the gap.
      - Tripwires T1 and T2 of tier_ruling apply before any closure-class or
        `supported` decision.
    checker: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/certbin-20260926-d7249d/review-plan.yaml --reports
      coordination/review/certbin-20260926-d7249d/reviews
      must PASS before composition. Then
      python3 tools/check_review_independence.py --blind-history
      fe1080a84f640b3503c6cf5da140ff0c29686e89..HEAD --protected-from
      coordination/review/certbin-20260926-d7249d/blind-phase-hygiene.yaml
      --max-commits 5000 must PASS. Record both outputs verbatim in the
      TASK-20260926-c95c60 receipt, with the Coordinator's manual check that
      TASK-20260926-401771's sources_read does not intersect
      author_independent_verification.must_not_read (prefix rule), and that
      neither TASK-20260926-401771 nor TASK-20260926-f0736e imported any
      crypto_autoresearcher module (grep of their code/ directories).

  proof_search_map_for_this_review:
    note: >-
      The hypothesis carries the experiment's proof_search_map
      (H-CERTBIN-e3ac93) and the specification its audit. This block audits
      the REVIEW's own load-bearing arguments (docs/inventor-protocol.md
      section 8; KN-TECH-080).
    bottleneck: >-
      Whether the primary counts are facts about the frozen object (J1, J2,
      J6/J7) and, if so, what carries them (J9-J11, J13).
    baseline_reproduction: >-
      C-SLICE17 (the run's own builder reproduces 144 archived n = 17 E_hex and
      two red-team substituted profiles) and C-ENGINE's full RC-1 replay, both
      audited by J3 and J5; J1's and J6's constructions are checked against
      direct F_{2^19} evaluation of S_3 and, for J1, against the literal
      curve's point arithmetic.
    observation_collision: >-
      (1) Flat certificates of max |mu| = 3 fit a W_4 and an M_5-only
      refutation alike (RT-20260924-d95e70 J7 (a)); only wdag-v1 counts (J8).
      (2) ell_route and "1 in R'_4" are the same observable (D-2): a record
      pair that disagrees is an implementation defect, and agreement between
      them is not two pieces of evidence. (3) An engine that under-computes
      M_4 or W_4 produces the same record as a true non-refutation; separated
      by J1 VC-6 (M_4), ann-v1 (the control systems that carry one), D-3 / T5 with J11's own
      profiles, and J6.
    quantifier_order: >-
      The primary arm is fixed by seed and draw order (J2 checks it reads no
      closure field). The blind pool is fixed here by arm and index before
      extraction and reads no outcome.
    method_ceiling: >-
      W_4 is a degree-bounded closure. A refutation certifies unsatisfiability
      of one system and 1 in W_4; it says nothing about F4's step degree, cost,
      m = 3, other n, other curves, or Semaev's Assumption 1. A non-refutation
      is a degree-4 statement only.
    nearby_object_control: >-
      O4 N-PERT19 (proves_too_much.nearby_object_control), beside N-ELL19 and
      N-CONV19.

  procedure_deviations:
    - id: PD-R1
      text: >-
        POST-DATA REVIEW PRIOR, AND ONE DESCRIBED PATTERN. coordinator_prior
        was written after this Coordinator read run-report.md and
        implementation.md and after the dispatching session described, when
        opening the round, the pattern that J9 attacks. The pre-data prior is
        the specification's coordinator_prior (a)-(g). J9 describes that
        pattern qualitatively and without a value because the joint cannot be
        stated otherwise; this is the only outcome description in the plan.
        Disclosed to every non-blind reviewer; the blind re-deriver reads
        neither.
    - id: PD-R2
      text: >-
        EXTRACTED INPUTS, TWO INPUT KINDS. Curve-algebra systems reach the
        re-deriver as x_R and are rebuilt by it; synthetic systems reach it as
        explicit polynomials decoded by TASK-20260926-5d1557 from E_hex with
        its OWN codec written from the frozen E_layout (no producer code is
        imported, unlike RC-1's extraction), validated by a round trip, the
        archived E_sha256, and, on every curve-kind pool system, the equality
        of the codec's decoding with an independent S_3 descent. The input kind
        reveals curve-algebra versus synthetic, not arm, role or outcome.
    - id: PD-R3
      text: >-
        SAME MODEL FAMILY. Unless the dispatcher can serve reviewers from a
        different model family, every reviewer shares the executor's and the
        engine author's claude-opus-5-5. J6 and J1 are then independent of the
        implementations and their authors' sessions, not of one model's
        reading of the specification. Both must list every ambiguity resolved.
    - id: PD-R4
      text: >-
        RE-DERIVATION POOL READS NO OUTCOME. The specification asks for at
        least 10 refuted and 10 non-refuted primary systems "if that many
        exist". A pool that guaranteed that split would have to read outcomes.
        This pool is fixed by arm and index; the non-refuted side is exercised
        through whichever pool systems are not refuted, including the control
        arms. The Coordinator knew the J9 pattern when choosing the arm mix and
        sizes (PD-R1); the rule itself reads no outcome field.
    - id: PD-R5
      text: >-
        COMPARISON AS A SEPARATE TASK, as in REVIEW-CERTBIN-20260924-3d7e1a. J6
        and J1 are sealed and archived (TASK-20260926-e8779d) before the
        comparator reads them. The comparator also owns J8 (certificate
        semantics), which reads no sibling output.
    - id: PD-R6
      text: >-
        A SPECIFICATION DESIGN GAP IS REVIEWED, NOT AMENDED. By D-2 the
        specification's secondary field ell_route is equivalent to
        dims_by_deg(R'_4)[0] = 1 and adds no independent information; this
        Coordinator's contract presented it as "one extra elimination". No
        protocol_amendment is written after data. The review uses the
        equivalence as a consistency check (J7, J9).
    - id: PD-R7
      text: >-
        MECHANICAL PROTECTED SET. RC-1 supplied protected literals out of band.
        Here the Coordinator's reply may carry no measured value, so the set is
        computed by rule (DEC-20260926-f6a749 R-7) from the archived outcome
        files by the opening archive, and every history check runs over the
        post-launch range. Cost, stated plainly in blind-phase-hygiene.yaml: an
        outcome value equal to a design constant is not protected.
    - id: PD-R8
      text: >-
        NEW VERIFICATION FAMILY IN REVIEW. N-PERT19 (O4) is drawn by the red
        team from a seed fixed in this plan, as N-ELL was in RC-1. It is a
        verification computation, not an arm, and changes no threshold.
    - id: PD-R9
      text: >-
        C-NONREF VACUOUS AS DECLARED. The frozen rule declares C-NONREF vacuous
        if W_4 refutes the whole primary arm, and the executor so declared it;
        ann-v1 then exists only for control systems (by the frozen rule, the
        first five non-refuted unsatisfiable systems of each control arm that
        has them; count in annihilators.jsonl.gz). DEC-20260924-f5c3f9 R-8's
        adverse-direction artifact therefore has no primary-arm instance. J1
        verifies every ann-v1; J8 states what remains uncertified.
