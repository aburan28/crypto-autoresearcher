  preregistered_claims:
    source: ledger/hypotheses/H-CERTBIN-e3ac93.yaml statement, and experiments/EXP-CERTBIN-060020/specification.yaml (frozen v1, sha256 7da73ae8d55f5997bee0ccead0e77514b32c5c2e93941e147c58e0f8c69a83e0)
    C-P: >-
      E-PERSIST, the claim under test. W_4 refutes at least 90% of the primary
      arm (w >= 360 of 400), each with a verified degree-disciplined
      certificate, while the same-support nulls (N-F219, N-AFF19) and the
      one-linear-fall control N-ELL19 stay at or below 10%.
    E-DECAY: >-
      Competing reading. The degree-4 refutation observed at n = 17 is a
      small-n effect: W_4 refutes at most 10% of the primary arm (w <= 40),
      like the nulls.
    C-M: >-
      Mechanism persistence, co-primary. On at least 90% of the primary arm the
      ell-substituted degree-4 Macaulay space R'_4 has
      dim(R'_4 cap B'_{<=3}) > 360, the semi-regular value for 18 quadratics in
      19 Boolean variables. Competing: = 360 on at least 90%.
    falsification_as_frozen: >-
      E-PERSIST is falsified iff w <= floor(N / 2) (200 at N = 400); E-DECAY
      iff w > floor(N / 2); C-M iff N19-DR-3 returns SEMI-REGULAR AT n = 19, its
      competitor iff NON-SEMI-REGULAR PERSISTS. NOT falsification: a void run
      (INV-1..INV-10), a watchdog expiry, an UNCERTIFIED refutation, an
      UNDETERMINED(budget) system, a shortfall.
    decision_rules_as_frozen:
      - id: N19-DR-1
        rule: >-
          PRIMARY, KN-OPEN-3c8f51 item (B) at W_4. Compute w twice: L1 with
          every UNCERTIFIED or UNDETERMINED(budget) system counted as not
          refuted, and L2 with those systems excluded from N. For each:
          "PERSISTS" iff w >= ceil(0.9 N); "DECAYS" iff w <= floor(0.1 N);
          "PARTIAL" otherwise. Report w, N and CP95. E-PERSIST is FALSIFIED iff
          w <= floor(N / 2); E-DECAY is FALSIFIED iff w > floor(N / 2). If L1
          and L2 differ, the verdict is "UNDETERMINED (budget or
          certification)", with both shown. If N < 300, "NOT EVALUABLE
          (sample)". Also reported: "NO DETECTABLE DROP FROM n = 17" iff the
          CP95 upper bound of w / N is >= the exact CP95 lower bound of 386/386,
          else "BELOW THE n = 17 FIGURE", always with the reading that the
          n = 17 figure imports 304 Stage-1 flags and that the cells differ in
          curve and cofactor.
      - id: N19-DR-2
        rule: >-
          M_4 against n = 17. m = verified M_4 refutations of S3-U400 with
          CP95. "CONSISTENT" iff the CP95 interval overlaps [0.799, 0.875];
          "LOWER" iff its upper bound < 0.799; "HIGHER" iff its lower bound >
          0.875. Also reported: the conditional W_4 rate on the S3-U400 systems
          M_4 does not refute, and the M_3 count (n = 17: 0/386). Secondary.
      - id: N19-DR-3
        rule: >-
          PRIMARY-MECHANISM (C-M; RC-B). Over the N_b S3-U400 systems where
          rc_b applies: "NON-SEMI-REGULAR PERSISTS" iff sigma > 0 on
          >= ceil(0.9 N_b); "SEMI-REGULAR AT n = 19" iff sigma = 0 on
          >= ceil(0.9 N_b); "MIXED" otherwise. Report the FULL fraction
          (dims_by_deg(R'_4)[3] = 1160) and the sigma < 0 count. If N_b < 300,
          "NOT EVALUABLE (sample)".
      - id: N19-DR-4
        rule: >-
          S_3-specificity at W_4 and at M_4, against each control arm X in
          {N-F219, N-AFF19 (pooled; per-family table beside it), N-ELL19}:
          "S_3 ABOVE X" iff the CP95 lower bound of S3-U400's rate exceeds the
          CP95 upper bound of X's rate; "NOT DISTINGUISHED" otherwise. The
          N-ELL19 comparison at W_4 is the RC-C control. D <= 5 cleanliness is
          not computed and is not a statistic of this contract.
      - id: N19-DR-5
        rule: >-
          N-CONV19 (tensor arm), W_4, out of n_c: "TENSOR-LEVEL" iff
          w_c >= ceil(0.9 n_c); "BELOW" iff w_c <= floor(0.1 n_c); "MIXED"
          otherwise. "AT S_3's RATE" iff its CP95 interval overlaps S3-U400's;
          "N-CONV19 ABOVE N-ELL19" and "ABOVE N-F219" as in N19-DR-4. The
          paired 2 x 2 table on the 200 shared x_R is reported. Secondary; it is
          read beside, not instead of, EXP-CERTBIN-ddfe75 at n = 17.
      - id: N19-DR-6
        rule: >-
          x(2E) split on F-RANDX19, at M_4 and at W_4 separately: one-sided
          Fisher exact test, X2E higher than the pooled XE-NOT-2E and TWIST
          strata. "MODULATED" iff p < 0.01; "WEAK" iff 0.01 <= p < 0.2;
          "ABSENT" iff p >= 0.2; "SATURATED (not evaluable)" iff every system
          in both groups is refuted, or none is. Also "RANDX X2E REPLICATES
          PRIMARY" iff the X2E stratum's CP95 interval overlaps S3-U400's at
          the same closure. The n = 17 M_4 rates 0.845 / 0.60 / 0.66 are quoted
          descriptively. Secondary.
      - id: N19-DR-7
        rule: >-
          Random-model transfer per arm (RC-B read on controls). "SEMI-REGULAR
          TRANSFER HOLDS" iff >= 90% of the arm's systems have the reference
          profile (substituted [0, 0, 18, 360, 3267] for arms with ell;
          unsubstituted [0, 0, 19, 399, 3819] for arms without); "FAILS" iff
          <= 10%; "MIXED" otherwise. Also the T5_applicable fraction.
          Descriptive; no verdict on any heuristic.
      - id: N19-DR-8
        rule: >-
          Instrument. C-ENGINE, C-SRC, C-SEED, C-SELF, C-FIX, C-CURVE, C-TR19,
          C-SLICE17, C-ELL0, C-ELL, C-AFF19, C-SUPPORT, C-ORACLE, C-ORACLE2,
          C-DRAW, C-TOP19, C-T4, C-PRED, C-WDAG, C-MONO, C-PS, C-CERT,
          C-NONREF, C-VERIFIER, C-BACKEND, C-LIT, C-DET and C-NULLS must pass or
          be declared vacuous. Any failure applies its invalidation rule, and no
          N19-DR-1..7 verdict is issued for what it voids.
      - id: N19-DR-9
        rule: >-
          m = 3 pricing flag (DEC-20260924-e61f3b NA-3; DEC-20260923-f25b97
          NA-5), recorded by the executor, decided by the Coordinator after
          review: "ELIGIBLE" iff N19-DR-1 returns PERSISTS under both labels;
          "NOT ELIGIBLE" otherwise. Nothing is priced in this contract.
      - id: N19-DR-10
        rule: Primary verdicts are N19-DR-1 and N19-DR-3. Everything else is secondary.

  pre_data_prior:
    source: experiments/EXP-CERTBIN-060020/specification.yaml coordinator_prior (a)-(g)
    status: >-
      Written before any l = 10 system existed. It is the only prior of this
      round that is pre-data. The executor's run-report marks, part by part,
      which parts the observations overturn; J14 re-reads that table against
      the recomputed values. The Coordinator adopts no revision of it.
    text: >-
      (a) N19-DR-1: PERSISTS about 55%, PARTIAL about 30%, DECAYS about 15%.
      (b) N19-DR-2: LOWER about 50%, CONSISTENT about 40%, HIGHER about 10%.
      (c) N19-DR-3: NON-SEMI-REGULAR PERSISTS about 80%; FULL (1160) on most
      systems about 40%. (d) N19-DR-4: nulls and N-ELL19 at 0 W_4 refutations
      (about 90%), and their reference profiles hold (N19-DR-7 HOLDS, about
      85%). (e) N19-DR-5: TENSOR-LEVEL about 50%. (f) N19-DR-6: at M_4
      MODULATED or WEAK about 60%; at W_4 SATURATED if (a) is PERSISTS. (g)
      Certificates: every W_4 refutation gets a verified wdag-v1 (about 80%);
      C-NONREF non-vacuous about 45%. Most likely to be overturned: (a) and
      (b), in either direction.

  coordinator_prior: >-
    READ PD-R1 FIRST. THIS PRIOR IS POST-DATA. It was written AFTER this
    Coordinator read run-report.md and implementation.md of RUN-CERTBIN-a3fc60
    and after the dispatching session described the outcome pattern of J9 when
    opening the round. It is a commitment made before any REVIEW report exists,
    not before the data, and concurrence with it is weaker evidence than
    concurrence with the pre-data prior above. That is disclosed so that you can
    weigh it, not so that you compensate.

    Per joint:
    J1 (author-independent verification): holds, about 85%. Certificates are
    finite identities in B and the run's verifier is already code-independent.
    The likeliest failures are conventions, not false certificates: the E_hex
    column order, the offset of x_2's variables (v_10..v_19), and above all the
    ann-v1 coordinate order "(-degree, bitmask ascending)", which a verifier
    must rebuild from the text alone.
    J2 (instance generation): holds, about 85%. Weakest points: the executor's
    readings of the duplicate and keep rules of the synthetic arms, the
    N-AFF19 reuse of classified primary attempts, and the F-RANDX19 rejection
    order.
    J3 (closure computation): holds, about 80%. The engine's W_D at nv = 20 is
    checked in-run only by C-LIT (the executor's literal W_4 on a few systems
    per arm) and C-BACKEND (reference kernels under the same orchestration);
    neither is independent of the engine-plus-executor pair. J6 and J1 are.
    J4 (recomputation): holds, about 90%. Primary counts sit at a floor or a
    ceiling of their ranges, so agreement is weak evidence about the
    implementation, and J4 must say so item by item.
    J5 (package and supersession): holds WITH FINDINGS, about 80%: the file-hash
    block of the executor's manifest disagrees with the archived bytes for at
    least command.txt and stdout.log (R-5 of the opening decision; I expect an
    append by the aggregate stage after the manifest was written); the launch
    tree was dirty and impl/ and verifier/ were untracked, so their bytes are
    bound by the d0f80c receipt only.
    J6 (blind re-derivation): holds (derivability), about 85%. Risk: the cost of
    a literal W_4 at nv = 20 in the re-deriver's own code, and the rc_b reading
    on explicit inputs whose arm the re-deriver cannot see.
    J7 (comparison): agreement on every compared quantity, about 80%. Least
    confident: W_4 per-iteration dimensions on primary systems, and rc_b
    dims_by_deg on explicit inputs.
    J8 (certificate semantics): holds, about 90%. wdag-v1 soundness is a short
    induction. ann-v1 soundness (D-1) I believe; its one subtle step is that
    (A2) is checked on a basis of S cap B_{<=3} and extends by linearity.
    J9 (the contrast pattern): algebra, not artefact, about 70%. By D-2 below,
    a negative ell_route on a system is the same fact as "1 not in R'_4" on it,
    so wherever ell_route is negative a W_4 refutation cannot come from the
    ell substitution plus degree-4 Macaulay alone and must use mutants of the
    substituted system (T4). That would be a different route from the one
    that sufficed at n = 17 (EV-CERTBIN-4a9d2f O-7). The remaining 30% I put
    on: the engine over-computing W_4 (10%; caught by J1, J6 and O1), M_4
    under-computed by the engine (10%; caught by J1 VC-6 and J6), a
    construction error that makes the systems easier than the object (5%;
    caught by J1 and C-SLICE17), and a lenient checker (5%; J1, J8).
    J10 (semi-regular model; N19-DR-3): holds, about 75%. I expect sigma to be
    real non-semi-regularity relative to the 18-in-19 reference, and I expect
    the red team to attribute it to the quadratic tensor phi_{x_R}(Q), which
    S_3 shares with N-CONV19, rather than to the linear and constant parts.
    J11 (null controls): holds WITH NARROWING, about 80%. N-F219 and N-AFF19
    are like-for-like in shape and support, but where their M_4 profile is
    exactly semi-regular their W_4 non-refutation is derived (D-3), so the
    W_4 rows of N19-DR-4 against them can show that S_3 is not semi-regular,
    not that its specific algebra is what refutes. N-ELL19 isolates ell.
    N-CONV19 locates the tensor. None of them separates "the exact S_3 tensor"
    from "any tensor near it"; that is what the nearby-object control O4 is
    for.
    J12 (N19-DR-9): the recorded flag follows the rule as frozen, about 85%;
    the rule is necessary, not sufficient, for any m = 3 pricing design, and I
    expect the red team to list conditions the rule omits (J1 holding; the
    curve / cofactor / target-class confound; one curve).
    J13 (proves-too-much): O1 codim(W_4) >= s on every satisfiable control,
    about 95%; O2 and O3 no W_4 refutation where the derivation applies,
    about 95%; O4 (N-PERT19): no prior worth recording beyond "either outcome
    is informative", which the red team's reading table must make precise
    before the engine runs.
    J14 (scope): I expect narrowing of the n = 17 comparison line of N19-DR-1
    (curve, cofactor and target-class confounds; 304 imported Stage-1 flags),
    of the run-report's prior table, and of any sentence that reads the cell
    as an effect of n.
    Overall: admissible; the mechanical verdicts stand; the READING narrows.
    Most likely to be overturned: J9's mechanism reading and J11's
    specificity reading. A break of J1, J2, J3, J5, J7 or J8 would overturn
    "admissible".

  derivations_to_check:
    note: >-
      Coordinator derivations used by this plan, UNREVIEWED. Each is assigned to
      a joint and carries a status there: verified, refuted (with the
      counterexample) or unchecked. None is relied on before it is checked.
    items:
      - id: D-1
        owner: J8
        statement: >-
          ann-v1 soundness (specification certificate_format FORMAT ann-v1).
          If L satisfies (A1)-(A3), S = {g in B_{<=4} : lambda(g) = 0 for all
          lambda in L} contains every M_4 row and is closed under g -> v_j g
          for deg g <= 3 (by linearity it suffices to check a basis of
          S cap B_{<=3}), so the least fixpoint W_4 lies in S, and 1 is not in
          S; hence 1 is not in W_4.
      - id: D-2
        owner: J9
        statement: >-
          Let pi be the ring map B -> B' of rc_b step (4) (v_{j*} := ell +
          v_{j*}, reduced multilinearly), with R'_4 the degree-4 Macaulay space
          of the 19 substituted equations. Then pi(rowspace M_4) = rowspace
          R'_4 (pi(mu f_k) = pi(mu) pi(f_k) with deg pi(mu) <= 2; conversely
          mu' f'_k = pi(mu' f_k) for mu' free of v_{j*}), and
          ker(pi) cap B_{<=4} = ell * B_{<=3} (write g = v_{j*} g1 + g0; pi(g)
          = 0 forces g0 = a g1, so g = ell g1 with deg g1 <= 3). Hence
          ell_route (1 in rowspace(M_4) + ell * B_{<=3}) holds iff 1 is in
          R'_4, i.e. iff dims_by_deg(R'_4)[0] = 1. ell_route is therefore not
          an independent statistic of the contract.
      - id: D-3
        owner: J11
        statement: >-
          If dims_by_deg(M_4)[3] = rank M_3 (for example the exactly
          semi-regular profile [0, 0, 19, 399, 3819]), then rowspace(M_4) cap
          B_{<=3} = rowspace(M_3), every v_j * b with b in it is a sum of M_4
          rows, W^(1) = W^(0), and W_4 = M_4 with fixpoint at iteration 0; if
          also dims_by_deg(M_4)[0] = 0, 1 is not in W_4.
      - id: D-4
        owner: J10
        statement: >-
          T4 at n = 19 with the constant 1160 = dim B'_{<=3} in 19 variables,
          and T5 (H-CERTBIN-e3ac93 mechanism; proved at n = 17 in
          coordination/review/certbin-20260924-3d7e1a/reviews/TASK-20260924-d95e70/j9-ptm/o2-declaration.yaml).
      - id: D-5
        owner: J10
        statement: >-
          The reference numbers: (1+z)^20 / (1+z^2)^19 = 1, 20, 171, 760, 1425,
          -2356 and (1+z)^19 / (1+z^2)^18 = 1, 19, 153, 627, 969, -2565; rank
          M_3 = 399, rank M_4 = 3819, profile [0, 0, 19, 399, 3819]; rank R'_3 =
          360, profile [0, 0, 18, 360, 3267]; under T5 the N-ELL19 record
          final_dim 4427, dims_by_deg [0, 1, 38, 551, 4427]; fixture
          dimensions M_3 399 x 1351, M_4 4009 x 6196, R'_3 380 x 1160, R'_4
          3629 x 5036.
      - id: D-6
        owner: J8
        statement: >-
          wdag-v1 soundness and completeness. Soundness: by induction on node
          id, rules (a)-(d) put every node in W_4, so (e) certifies 1 in W_4.
          Completeness: every element of W_4 has a valid wdag-v1 (unroll the
          iteration), so a missing wdag-v1 is never evidence of non-membership.

  joints:
