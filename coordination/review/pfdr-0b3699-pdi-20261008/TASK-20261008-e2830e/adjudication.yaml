        derivation_check: >-
          Judged on the derivation; the EXP-PFDR-011cd0 design.json cross-check
          value the PDI cites is not relied on. (1) At arity h = 2 the engine
          stores e_a + e_b and e_a - e_b for a < b, and 2 e_a, since i_1 <= i_2
          and F_a - F_a is the identity and is dropped. So T = |V| = s(s - 1) +
          s = s^2. The alternative T = s(s - 1), which the PDI lists, would
          count only distinct-index tails. It contradicts L1's V = "the stored
          tails" and the engine's stored set. L2's assumption ("h distinct base
          indices") fixes the multiplicity of GENERIC relations; it does not
          define the stored set. (2) L1 maps each signed pair (u, w, sigma) to
          a class. With T stored elements there are 2 C(T, 2) signed pairs, and
          no pair is dependent mod N at h = 2. (3) The specification prescribes
          "generic multiplicity 3". Dividing the signed pairs by 3 gives |RR| =
          2 C(T, 2) / 3, and E[R] = |RR| / N = T (T - 1) / (3 N). That is the
          PDI-1 formula, and analyze_a.py mu_model (lines 297-300) implements
          it exactly. (4) How accurate is the generic approximation the text
          mandates? A hand derivation by class type gives the exact L1 count
          for this stored set as |RR| = T (T + 2) / 3:
            generic, 8 C(s,4) classes with M = 3;
            2e_a +- e_b +- e_c, 4 s C(s-1,2) classes with M = 2;
            e_a +- e_b, s(s-1) classes with M = 2s - 1;
            e_a, s classes with M = s - 1;
            3e_a +- e_b, 2 s(s-1) classes with M = 1.
          That is T (T - 1)/3 + T. The excess s^2 = T is exactly the classes
          [e_a] and [e_a +- e_b]. Those cannot occur on a real base: F_a is
          never the identity, and the base x-coordinates are distinct, so F_a
          is never -+F_b. Without them, the realizable |RR| is exactly T (T -
          1) / 3. So PDI-1's numerator equals L1's first moment over the
          realizable classes. Against the unrestricted uniform-model count its
          relative error is 3 / (T + 2), about 7e-5 at s near 200. The
          symbolic enumeration in attacks/pdi1_rr_count.py confirms both
          identities exactly for s = 4, 6, 8, 10, 12, 16, 20, 24, 32, 40
          (pdi1_numbers). Separately, rho1_hat_b = sum mj / sum mu_model
          rescales the model to the observed rung totals, so only the relative
          per-curve shape of mu_model enters any threshold.
        pdi1_numbers:
          script: attacks/pdi1_rr_count.py (symbolic; reads no data file)
          output: attacks/pdi1_rr_count.out.json (log attacks/pdi1_rr_count.log.txt)
          s_values: [4, 6, 8, 10, 12, 16, 20, 24, 32, 40]
          T_equals_s_squared: true for every s
