        bears_on: "RA-03 P0 sizing and design (mu_model, rho1_hat_b, t_A_plan, powers); RA-05 calibration (G-NB-R means: t_A, PC-NULL-R joint law, X_rel, U-coverage); RA-06 U_A; the secondary tail check (PDI-9)"
