          affected runs invalid, and stopping_rules [1] would have required a
          stop before RA-03 and RA-07 (attribution). The frozen text has no
          rule that separates a failure on a host-memory measurement (B0 c:
          not guaranteed equal by the code) from a failure to reproduce the
          computation. A failure on that key alone would therefore invalidate
          under gate_rule, while RA-07's engine-bytes attribution could not
          explain it.
        no_judgment_on_scope:
          applied: "yes"
          reason: >-
            Before seeing PDI-2, B0 found that the G-REPRO phrase leaves
            harvest.worker_maxrss_bytes undecided. The literal words compare
            it, the cited model G1' never met it, and the committed T-DET
            convention strips it. The two readings give different comparison
            sets for an invalidating gate and can give different gate verdicts.
            That is an ambiguous point in the contract of the kind constraint
            [15] names (a committed tool convention that differs from the gate
            text). Under [15] the step was to stop, record the ambiguity with
            options in execution-report.yaml, and return, rather than record a
            reading in implementation-notes.yaml and proceed. Mitigations,
            recorded and not weighed here: the reading was recorded pre-data
            (20:03:05Z) and in public, and reproduce_check.py keeps the
            excluded key's agreement counts, so the strict reading stays
            evaluable.

      - id: PDI-3
        reading: "CC-1 recount for TB: TB pairs are the (base, tail) star pairs (1, j) only; two tails of one x-group form a TT pair (CC-4)"
        verdict: admissible_reading_of_open_detail
        clauses_relied_on:
          - {path: "EXP-PFDR-011cd0 counting_conventions CC-1_relation_unit", phrase: "Within one (instance, class, scope), x-groups are reconstructed from the star rows ... the pair (1, j) carries relation row_j and the pair (i, j), 2 <= i < j, carries row_j - row_i"}
          - {path: "EXP-PFDR-011cd0 counting_conventions CC-4_classes", phrase: "No cross-class deduplication; a relation is counted in each class whose pairs carry it."}
          - {path: "harvest.py docstring 8-11 and _RelCounter 361-363, 413", phrase: "TB -- a stored tail whose x-key is a base element's x ... TB: the class's pairs are (base, tail) pairs only -- the star pairs (1, j)"}
          - {path: "tests/test_index_calculus_relcensus.py _brute_table_relations 236-239 (T-REL)", phrase: "pairs += [(\"TB\", {b: 1}, w) for w in oriented]"}
          - {path: "EXP-PFDR-0b3699 gates G-REL", phrase: "the harvester's relations_distinct, relations_distinct_sign, relations_nonformal, R_star and multiplicity histogram equal analyze_a.py's recount"}
        analysis: >-
          Read alone and applied to the TB class, CC-1's "(i, j)" clause would
          also count tail-minus-tail relations in TB. Read with CC-4 ("counted
          in each class whose pairs carry it") and with the class definition
          (a TB pair is tail-with-base), the (i, j) pair of two tails is a TT
          pair, and its relation is counted in TT. The committed engine (EC-2,
          _RelCounter star_pairs_only) and the committed T-REL brute-force test
          use exactly this convention. G-REL requires the recount to equal
          that harvester. The class definition is in engine docstrings and
          tests, not in a CC clause this task could read. So the reading
          resolves an open detail rather than following from a CC sentence.
          analyze_a.py recount_class (242-283: "if cls != \"TB\": rels +=
          [_difference(rj, ri, N) for ri in rows[:j]]") implements it.
        bears_on: "RA-04 checks (G-REL for TB); TB counts (reported, never decision-bearing: specification controlled_variables)"
        consequence_if_departed: >-
          The other reading makes G-REL fail on every instance whose TB x-group
          holds a base element and two or more tails, because the committed
          harvester counts otherwise. That is an invalidation that comes from
          the convention, not from the data. TT, P0X-A (TT4) and every
          decision-bearing quantity are unaffected.
        no_judgment_on_scope:
          applied: "no (borderline in letter)"
          reason: >-
            Constraint [15]'s letter reaches any ambiguity. Here, though, the
            contract's own instrument (the committed harvester that G-REL
            compares against) fixes the convention, and the other reading
            could only make G-REL contradict that instrument. Recording the
            reading was proportionate. The point is noted, not weighed.

      - id: PDI-4
        reading: "RC-3: a uniform permutation per curve is drawn as a uniform choice of the position-0 arm (identical distribution of z)"
        verdict: follows_from_text
        clauses_relied_on:
          - {path: "EXP-PFDR-0b3699 analysis.permutation_null_RC-3", phrase: "Per replicate and per curve, the counts of (r0, r1, r2, known_null_sub) are permuted uniformly; position 0 is scored against positions 1-3 by CC-8"}
          - {path: "EXP-PFDR-0b3699 analysis.statistic", phrase: "C_R = (1/3) sum over r0..r2; s_j^2 the ddof-1 variance of the three random counts on curve j; V = max(sum_j s_j^2, C_R)"}
        analysis: >-
          Per curve, CC-8 with X = position 0 uses x_{pi(0),j}, the sum of the
          other three, and the ddof-1 variance of the other three. Both of
          those are symmetric in positions 1-3. So the pooled z is a function of
          the position-0 arm on each curve alone. The position-0 arm of a
          uniform permutation of four is uniform on four. The two procedures
          give the same law of z exactly. analyze_a.py calib_core (1156-1177)
          draws e uniform in {0..3} per curve and uses precomputed
          per-exclusion sums. This is a mathematical identity, not a reading.
        bears_on: "RA-05 calibration (t_perm and therefore t_dec)"
        consequence_if_departed: "none in law (the identity is exact)"
        no_judgment_on_scope: {applied: "no", reason: "no ambiguity; an exact identity"}

      - id: PDI-5
        reading: "structured-arm rung TOTALS drawn from the exact sum laws (NB with common p; Poisson; Binomial thinning); random arms drawn per curve; D = 1 as Poisson"
        verdict: follows_from_text
        clauses_relied_on:
          - {path: "EXP-PFDR-0b3699 analysis.calibration_G-NB-R", phrase: "per curve, each arm's count is negative binomial with mean m_j = rho1_hat_b x mu_model(j) and variance D m_j ... The three randoms are drawn once per replicate and shared by every pseudo-structured arm"}
          - {path: "EXP-PFDR-0b3699 analysis.upper_bound_U_A (simulation rule)", phrase: "for kappa < 1 the null draw is binomially thinned -- ... the count is Binomial(null draw, kappa)"}
          - {path: "EXP-PFDR-0b3699 analysis.statistic", phrase: "C_X = sum_j n_{X,j}"}
        analysis: >-
          NB(r_j, p) with r_j = m_j / (D - 1) and common p = 1 / D sums to
          NB(sum r_j, p). Poisson sums to Poisson. Binomial thinning of
          independent counts with a common kappa sums to Binomial(sum of the
          counts, kappa). Every simulated statistic uses a structured arm only
          through its total over a rung or part (C_X; z_Delta's C_A - C_M).
          So drawing totals gives the per-curve law of every such statistic
          exactly. Arms whose per-curve values enter V or s_j^2 must be drawn
          per curve. analyze_a.py does this for r0..r2 and, in the PC-NULL-R
          joint law, for known_null_sub too (make_bank 342-364 with n_arms 4;
          make_banks 1144-1145). D <= 1 is drawn as Poisson (nb_draw 303-307),
          the D -> 1 limit of the G-NB-R law.
        bears_on: "RA-03 P0 (t_A_plan, powers); RA-05 (t_A, t_Delta, X_rel, U-coverage); RA-06 (U_A)"
        consequence_if_departed: none in law
        no_judgment_on_scope: {applied: "no", reason: "an exact distributional identity; no reading of a clause"}

      - id: PDI-6
        reading: "U-coverage and P0's predicted U_A: each synthetic design's own bound by the U_A rule (>= 20000 x 5); inner random-arm bank reused across designs (common random numbers); structured total fresh per design; predicted U_A at kappa = 1 reported as median and 5%/95% quantiles of >= 4000 null designs"
        verdict: admissible_reading_of_open_detail
        clauses_relied_on:
          - {path: "EXP-PFDR-0b3699 analysis.upper_bound_U_A", phrase: "One-sided coverage of U_A is simulated at kappa = 1.00, 1.10 and 1.15 (>= 4000 synthetic designs each) ... every synthetic design of the coverage simulation below (including the kappa = 1.00 point, whose synthetic designs are null draws and whose own bounds are computed by this rule)"}
          - {path: "EXP-PFDR-0b3699 power_analysis.P0_rule (5)", phrase: "the predicted U_A at kappa = 1 (simulated by the analysis.upper_bound_U_A rule ...)"}
          - {path: "EXP-PFDR-0b3699 replication.seeds", phrase: "simulation: numpy SeedSequence([0x0b3699, family_index]) for 5 seed families (G-NB-R, X_rel, coverage, contrast)"}
        analysis: >-
          The text fixes the rule, the replicate counts and the seed families.
          It does not say whether a design's inner replicates are drawn afresh
          or shared across designs. Sharing the inner random-arm bank changes
          no design's marginal law. It correlates the Monte Carlo error of the
          bounds across designs, so the coverage estimate is unbiased but has a
          bank-level variance component. With 5 x 20000 inner replicates the
          shift in each bound's quantile from the bank is small. As a hand
          estimate (not simulated), it is of order 0.005 in dev units, so of
          order 0.0005 in coverage near the 0.945 floor. The
          synthetic designs' own randoms come from a separate child seed
          (fam_seq(f)[3], analyze_a.py 451-462 and 473), so no design reuses
          its own draws in its bound. "Predicted U_A" (singular) is reported
          as a median with quantiles. That summary is not specified, and it is
          an informational design figure that no outcome condition uses.
        bears_on: "RA-03 predicted U_A (design.json, informational); RA-05 U-coverage, which decides the governing bound (AR-3) and so enters O-A3 / O-A4"
        consequence_if_departed: >-
          With fresh inner draws per design, the coverage estimates would carry
          independent rather than shared Monte Carlo error. The governing-bound
          switch at 0.945 could differ only if a simulated coverage sat within
          a few thousandths of 0.945.
        no_judgment_on_scope: {applied: "no", reason: "a Monte Carlo implementation detail that leaves every law unchanged; the predicted-U_A summary is a report format"}

      - id: PDI-7
        reading: "compound planting: the structured arm's per-curve count NB with mean kappa m_j and index of dispersion 1.307 x D; rung total NB(sum kappa m_j / (1.307 D - 1), 1 / (1.307 D))"
        verdict: admissible_reading_of_open_detail
        clauses_relied_on:
          - {path: "EXP-PFDR-0b3699 power_analysis.P0_rule (3)", phrase: "with a compound-planted excess whose A-arm dispersion is 1.307 x D_plan (red team J4 d upper CI), the smaller governing"}
          - {path: "EXP-PFDR-0b3699 analysis.X_rel", phrase: "Poisson-planted and compound-planted (A-arm dispersion 1.307 x D) beside each other; the larger is reported"}
          - {path: "EXP-PFDR-0b3699 analysis.upper_bound_U_A (simulation rule)", phrase: "for kappa > 1 a Poisson-planted excess (compound-planted where a clause names it) is added to that draw; for kappa = 1 the null draw is used as drawn"}
          - {path: "EXP-PFDR-0b3699 analysis.dispersion_robustness", phrase: "rho_A = D_A_hat / D_R_hat with D_A_hat = [sum_j (d_j - (kappa_hat - 1) nbar_j)^2 - sum_j s_j^2/3] / sum_j nbar_j (red team J4 d)"}
        analysis: >-
          The text fixes the A-arm dispersion (1.307 x D). It does not fix the
          law of the compound excess. It describes the excess as "added to"
          the null draw. A whole-arm NB with mean kappa m_j and variance 1.307
          D kappa m_j has the same first two moments as any null-plus-excess
          construction with that A-arm dispersion. At rung totals of hundreds
          to thousands of relations, the law of z is set by those moments to
          high accuracy. The NB parameters are correct: numpy
          negative_binomial(n, p) has mean n(1 - p)/p and variance n(1 -
          p)/p^2, giving kappa m and 1.307 D kappa m. Two nuances:
          (1) The PDI text states no kappa > 1 restriction. The frozen rule
          uses the null draw as drawn at kappa = 1.00 (the first X_rel grid
          point). analyze_a.py struct_totals (415: "if mode == \"compound\"
          and kappa > 1") follows the frozen rule at 1.00. So the
          implementation conforms, and the PDI wording is broader than the
          code.
          (2) J4 d's estimator normalises the A-arm variance by the null mean
          (sum_j nbar_j). Read in J4 d's units, "dispersion 1.307 x D" means
          variance 1.307 D m_j. PDI-7 uses variance 1.307 D kappa m_j, which
          is larger by the factor kappa (1.10 at the power point). That is the
          conservative direction: it lowers the compound power (the smaller
          power governs; it may raise n by one ladder step, and n is never
          lowered). As a hand argument (not simulated), it should move the
          compound X_rel by no more than about one grid step, because X_rel is
          the power-0.5 point and the median of z is nearly unaffected by its
          spread.
        bears_on: "RA-03 P0 sizing (governing power, P0 RULE); RA-05 predicted X_rel; X_rel enters O-A3 / O-A4"
        consequence_if_departed: >-
          Under the J4 d normalisation the compound power would be slightly
          higher, and the P0 RULE could select the same or a lower ladder
          step. Under a null-plus-excess construction with the same A-arm
          dispersion, the powers would agree to the order of the skewness
          difference. No observed statistic is affected.
        no_judgment_on_scope: {applied: "no", reason: "the frozen moments are met; the remaining choice is a distributional shape inside a planning simulation, and the choice made is the conservative one"}

      - id: PDI-8
        reading: "design_a.py builds candidate curves c = 2010 .. 8809 per rung; analyze_a.py p0 takes the first final n_b; declared-n design = prefix c = 2010 .. 5409"
        verdict: follows_from_text
        clauses_relied_on:
          - {path: "EXP-PFDR-0b3699 replication.seeds", phrase: "curve seeds: c = 2010 .. 2010 + n_b - 1 at each of bits 30 and 32 (n_b from P0; at most 6800, so c <= 8809)"}
          - {path: "EXP-PFDR-0b3699 power_analysis.P0_rule (1), (4), (5)", phrase: "design_a.py builds every design curve at the declared n ... n_b at both rungs is raised to the smallest of {1.25, 1.5, 2} x declared that meets both ... it records in design.json the final n, the curves, s_sub, mu_model, x0 and the height-screen list"}
        analysis: >-
          The seed clause makes the design curves for any n_b the prefix c =
          2010 .. 2010 + n_b - 1. Building the 2x superset before any data
          adds no choice, and the curves of a raised n are exactly the ones a
          later build would make. analyze_a.py cmd_p0 writes only the final
          prefix to design.json (651 final = by_rung[b][:n_b]; 698-704
          curves_out over final; 682-687 jobs from c0 to c0 + n_b), and applies
          G-FRESH and the height-screen stop to the final design (653-674).
        bears_on: RA-03 P0 design (G-FRESH, height screen, jobs of RA-04)
        consequence_if_departed: none on any statistic; only the order in which design quantities are computed
        no_judgment_on_scope: {applied: "no", reason: "the seed clause fixes the curve set"}

      - id: PDI-9
        reading: "A-TAIL style per-curve tail P(Poisson(mbar_j) >= n_A,j) < 1e-4 uses mbar_j = m_j = rho1_hat_b x mu_model(j) of RA-05"
        verdict: cannot_decide
        clauses_relied_on:
          - {path: "EXP-PFDR-0b3699 tail_checks [2]", phrase: "per-curve Poisson tail P(Poisson(mbar_j) >= n_A,j) < 1e-4 listed (A-TAIL style)"}
          - {path: "EXP-PFDR-011cd0 analysis.A-CAL_calibration", phrase: "mean m_j ... D_hat = sum_j s_j^2 / sum_j nbar_j"}
        analysis: >-
          The 0b3699 text does not define mbar_j. It points to EXP-PFDR-011cd0
          A-TAIL, which is not among this task's permitted inputs. In the
          permitted 011cd0 clauses, m_j is the calibrated model mean and nbar_j
          is the empirical mean of the three randoms on a curve. "mbar_j"
          matches neither symbol. The PDI's choice of the calibrated model mean
          is well defined, and it avoids P(Poisson(0) >= n) = 0, which the
          empirical mean would give on curves where all three randoms are 0.
          Whether it is A-TAIL's definition cannot be decided from the
          permitted texts. analyze_a.py implements the PDI as stated (1573-1585:
          mcal = model.m; poisson_sf(int(xs[i]), float(mcal[i])) < 1e-4).
        bears_on: "RA-06 analysis: a secondary tail list (tail_checks; never gating, no outcome condition)"
        consequence_if_departed: >-
          A different list of curves under "poisson_tail_lt_1e-4" for small_x
          and small_x_offset. No gate, outcome or routing qualifier changes.
        what_would_decide_it: experiments/EXP-PFDR-011cd0/specification.yaml analysis.A-TAIL (the definition of mbar_j)
        no_judgment_on_scope:
          applied: "cannot decide"
          reason: >-
            If A-TAIL defines mbar_j otherwise, the reading filled a definition
            the contract supplies by reference. If A-TAIL leaves it undefined,
            the stakes are a secondary listed check only.

      - id: PDI-10
        reading: "RA-05 never JSON-parses a structured-arm line: fixed-pattern arm scan first, null-arm lines only parsed; CC-6 exclusions from merge-report.json non_valid_keys (keys only); arm-read-log.json records parsed counts per null arm and only a boolean for skipped structured lines"
        verdict: admissible_reading_of_open_detail
        clauses_relied_on:
          - {path: "EXP-PFDR-0b3699 analysis.two_step_blinding", phrase: "reads, from every census row and harvest-row file, ONLY records whose arm is random_sub_r0, r1, r2 or known_null_sub; analyze_a.py filters by arm name before parsing any count and writes arm-read-log.json"}
          - {path: "EXP-PFDR-011cd0 counting_conventions CC-6_exclusions", phrase: "failed_infrastructure of any arm of a family on a curve: that curve dropped from every cell of the family"}
          - {path: "EXP-PFDR-0b3699 stopping_rules [5] and invalidation_rules I-A7", phrase: "(instance counts by status are not such counts)"}
          - {path: "EXP-PFDR-0b3699 approval_rulings AR-1 (3)", phrase: "merge-report.json carries only keys, per-key sources, instance counts (expected keys, canonical rows, counts by status, missing keys)"}
        analysis: >-
          "Filters by arm name before parsing any count" is met in a stricter
          form: no structured line is parsed at all (analyze_a.py 1029-1034
          ARM_RE '"arm": "..."' and line_arm; 1083-1090 and 1102-1109 skip
          before json.loads; 1272-1273 an I-A7 self-check). CC-6 needs the
          statuses of structured instances on each curve. The text does not
          say how RA-05 learns them without parsing structured rows. Reading
          keys from merge-report.json (curve_sets 1037-1054) uses status
          information only, which stopping_rules [5] does not count as a
          blinded quantity. Recording a boolean, not a count, of skipped
          structured lines avoids writing a per-file structured line count
          (harvest-row line counts would be relation-row counts). A format
          mismatch in the scan pattern would skip null lines too, so it fails
          loudly rather than leaking.
        bears_on: "RA-05 calibration (blinding, I-A7; CC-6 curve sets for t_A and PC-NULL-R)"
        consequence_if_departed: >-
          If CC-6 statuses had to come from parsing structured rows, RA-05
          would risk I-A7. If structured skipped-line counts were required,
          the arm-read-log would carry row counts of blinded arms.
        no_judgment_on_scope: {applied: "no", reason: "implements the blinding text in its stricter form; the CC-6 source is the one the contract's own merge-report definition provides"}

    instrument_observation_pre_data_note: >-
      implementation_notes.instrument_observation_pre_data (recorded
      2026-10-02T20:21:52Z) says the four null numerators sum to zero, that
      criterion (ii)'s interval is "very narrow", and that it was "Implemented
      exactly as frozen; recorded for review, no change". The algebra is
      confirmed in Q2 (a). Recording it without changing the protocol is
      consistent with constraint [15]'s first sentence. Q2 (b) measures what
      the narrowness implies.

  q2_pc_null_r_criterion_ii:
    frozen_definitions_used:
      - "analysis.PC-NULL-R_rule: Passes iff (i) K, the number of the four null pseudo-cells with z > t_dec, has P(K_null >= K) >= 0.01 under the simulated joint law, and (ii) the mean of the four pooled null z lies inside the simulated 99% interval of that mean."
      - "controls RANDOM-AS-STRUCTURED NULL PSEUDO-CELLS: each of r0, r1, r2 scored as structured against the triple formed by the other two randoms and known_null_sub; with the known-null arm, four null pseudo-cells"
      - "analysis.statistic (CC-8 pooled over 30 and 32 bits): C_X = sum_j n_{X,j}; C_R = (1/3) sum over the triple; s_j^2 the ddof-1 variance of the triple; V = max(sum_j s_j^2, C_R); SD_null = sqrt(4V/3); z = (C_X - C_R)/SD_null. The null pseudo-cells use the same formula with their own triple."
      - "analysis.calibration_G-NB-R: per curve, each arm NB with mean m_j = rho1_hat_b x mu_model(j) and variance D m_j; the joint law of the four null pseudo-cells is simulated alongside"
    a_algebra:
      numerators_sum_to_zero: >-
        Let x_{e,j} be the count of null arm e in {r0, r1, r2, kn} on curve j,
        and t_j = sum_e x_{e,j}. Pseudo-cell e has C_X^e = sum_j x_{e,j} and
        C_R^e = (1/3) sum_j (t_j - x_{e,j}). Its numerator is N_e = C_X^e -
        C_R^e = sum_j (4 x_{e,j} - t_j) / 3. On each curve, sum_e (4 x_{e,j} -
        t_j) / 3 = (4 t_j - 4 t_j) / 3 = 0. So the four numerators sum to zero
        on every curve, and therefore in the pooled cell, for any data
        whatever. Numerically, the largest |sum_e N_e| over every simulated
        replicate is at most 9.1e-13 (floating-point zero), in every scenario.
      what_the_mean_depends_on: >-
        The mean is zbar = (1/4) sum_e N_e / SD_e with SD_e = sqrt(4 V_e / 3).
        Because sum_e N_e = 0, zbar = (1/4) sum_e N_e (1/SD_e - c) for every
        constant c. So zbar depends on the data only through how the four
        denominators differ, weighted by the numerators, and zbar = 0 exactly
        whenever V_r0 = V_r1 = V_r2 = V_kn. To first order, with SD_e = S (1 +
        delta_e), zbar = -(1/4) sum_e (N_e / S) delta_e. The V_e differ through
        C_R^e = (C - C_X^e)/3, where C is the four-arm total (a larger own
        count gives a smaller C_R^e), and through the triple's within-curve
        variance sum_j s^2. Under exchangeable null arms the first term makes
        zbar slightly positive. The simulated null mean of zbar is +0.0035 at
        n_b 3400 and +0.0025 at n_b 6800, and its null SD is about the same
        size. Both decay as n^(-1/2), as a finite-sample coupling between mean
        and variance should, so this is not an artefact that grows with n.
        zbar is therefore a second-order statistic. It moves when one arm's
        mean or dispersion differs from the others', because that makes the V_e
        unequal in a way correlated with the N_e. It cannot see a departure
        common to all four arms.
    b_simulation:
      scripts:
        main: attacks/q2_pcnullr_sim.py
        add_on: attacks/q2_addon.py
      outputs:
        - attacks/q2_out_nb3400_6800.json (log attacks/q2_log_nb3400_6800.txt)
        - attacks/q2_out_nb4250_5100.json (log attacks/q2_log_nb4250_5100.txt)
        - attacks/q2_addon_out_nb3400.json (log attacks/q2_addon_log_nb3400.txt)
        - attacks/q2_addon_out_nb6800.json (log attacks/q2_addon_log_nb6800.txt)
      reads_no_data_file: true
      seeds: >-
        Main: calibration SeedSequence([0xE2830E, n_b, 0, family]) for family
        0, 1; evaluation SeedSequence([0xE2830E, n_b, scenario_index, 1000]);
        curve means SeedSequence([0xE2830E, n_b, 999]). Add-on: calibration
        SeedSequence([0xE2830E, n_b, 50 + law_index, family]); evaluation
        SeedSequence([0xE2830E, n_b, 60 + scenario_index, 2000]). 0xE2830E is
        this task's token. None of these seeds is a seed of the experiment.
      replicates: >-
        Main: calibration 2 families x 20000, evaluation 10000 per scenario
        and n (Monte Carlo SE about 0.001 at a 1% rate). Add-on: calibration 2
        x 10000 per law, evaluation 5000 per scenario.
      n_ladder: >-
        Declared n_b 3400 per rung and the P0 RULE multipliers {1.25, 1.5, 2}
        (power_analysis.P0_rule (4)): n_b = 3400, 4250, 5100, 6800 per rung,
        pooled n = 6800, 8500, 10200, 13600 curves.
      count_law_and_justification: >-
        Per curve, four independent null arms. The arm count is NB with
        variance D_b times its mean, or Poisson if D_b <= 1. Per-curve null
        mean m_j = mu_b x w_j, with mu_30 = 521.3333333333334/2000 = 0.2607
        and mu_32 = 513.6666666666666/2000 = 0.2568 (the random-arm means the
        specification quotes from smallx-tt4-localise.json in
        p0_inputs_by_path_and_field). These agree with C_R 1035 / 4000 curves =
        0.259 for the known_null_sub|TT4|band cell, and with "about 0.26
        relations per random instance" (budget.expected_disk). D_30 =
        1.0044757033248082 and D_32 = 1.0233614536015576 are the specification's
        quoted G-NB-R D values. w_j = u_j^4 / mean(u^4) with u_j ~ U(0.85,
        1.15): mu_model is proportional to s_sub^4 / N (PDI-1), default_fb_size
        makes s^4 proportional to N, and subgroup_prime_filter's tolerance 0.15
        keeps |F_sub| within about +-15% of it. The joint law is calibrated
        once per n at these null parameters. Synthetic t_dec = t_A, the
        family-averaged 0.99 quantile of the known-null single-cell z.
      departures:
        D1: one null arm (kn) with mean kappa m_j on every curve, kappa 1.10 and 1.15; add-on r0-placed variant with the calibration RA-05 would compute (means x (1 + (kappa - 1)/3))
        D2: one null arm (kn) with index of dispersion 1.3 (mean unchanged); add-on r0-placed variant with D recalibrated to (1.3 + 2 D_b)/3
        D3: all four null arms with mean kappa m_j, kappa 1.10 and 1.15 (calibrated at the unscaled means; RA-05 would absorb a common mode into rho1_hat_b exactly)
        N1_add_on: exchangeable arms with a curve-level random effect, all four arms on curve j with mean m_j g_j, g_j ~ Gamma(mean 1, CV 0.2 or 0.4); H4 holds; a check on false failures from mean misspecification
      calibrated_law_by_n:
        - {n_b: 3400, multiplier: 1.0, t_dec: 2.3425, mean_z_interval_99: [-0.00157, 0.01734], null_mean_of_zbar: 0.00347, null_sd_of_zbar: 0.00345, P_K_null_ge_1: 0.0396, P_K_null_ge_2: 0.00013}
        - {n_b: 4250, multiplier: 1.25, t_dec: 2.3599, mean_z_interval_99: [-0.00132, 0.01558], null_mean_of_zbar: 0.00316, null_sd_of_zbar: 0.00312, P_K_null_ge_1: 0.0400, P_K_null_ge_2: 0.0}
        - {n_b: 5100, multiplier: 1.5, t_dec: 2.3472, mean_z_interval_99: [-0.00134, 0.01434], null_mean_of_zbar: 0.00287, null_sd_of_zbar: 0.00286, P_K_null_ge_1: 0.0400, P_K_null_ge_2: 0.00003}
        - {n_b: 6800, multiplier: 2.0, t_dec: 2.3204, mean_z_interval_99: [-0.00123, 0.01221], null_mean_of_zbar: 0.00247, null_sd_of_zbar: 0.00247, P_K_null_ge_1: 0.0420, P_K_null_ge_2: 0.0}
      failure_probabilities:
        columns: "P(criterion fails) as [criterion (i), criterion (ii)]"
        n_b_3400_x1.0:
          null: [0.0000, 0.0110]
          D1_kappa1.10: [0.0001, 0.4813]
          D1_kappa1.15: [0.0000, 0.9225]
          D2_dispersion1.3: [0.0000, 0.5075]
          D3_kappa1.10: [0.0001, 0.0101]
          D3_kappa1.15: [0.0000, 0.0106]
        n_b_4250_x1.25:
          null: [0.0000, 0.0117]
          D1_kappa1.10: [0.0003, 0.6230]
          D1_kappa1.15: [0.0000, 0.9728]
          D2_dispersion1.3: [0.0000, 0.5452]
          D3_kappa1.10: [0.0002, 0.0109]
          D3_kappa1.15: [0.0000, 0.0130]
        n_b_5100_x1.5:
          null: [0.0000, 0.0095]
          D1_kappa1.10: [0.0002, 0.7202]
          D1_kappa1.15: [0.0001, 0.9911]
          D2_dispersion1.3: [0.0000, 0.5714]
          D3_kappa1.10: [0.0000, 0.0098]
          D3_kappa1.15: [0.0001, 0.0118]
        n_b_6800_x2.0:
          null: [0.0001, 0.0101]
          D1_kappa1.10: [0.0002, 0.8841]
          D1_kappa1.15: [0.0000, 0.9996]
          D2_dispersion1.3: [0.0000, 0.6081]
          D3_kappa1.10: [0.0000, 0.0104]
          D3_kappa1.15: [0.0001, 0.0097]
      mechanism_observed:
        - >-
          D1 moves zbar's location. At kappa 1.10 the mean of zbar is 0.0183
          (n_b 3400) up to 0.0237 (6800), against null means of 0.0035 to
          0.0025. It grows with n, as a real departure should.
        - >-
          D2 leaves zbar's location at the null value (shift 0.12 to 0.17 null
          SD) but inflates its spread about 3.6 to 5 times (SD 0.0125 against
          0.0025 to 0.0035), so (ii) fails on both sides.
        - >-
          Under D1 the known-null cell itself exceeds t_dec in 0.89 (n_b 3400)
          to 0.996 (6800) of draws at kappa 1.10. Even so, K >= 2 occurs at
          most 0.0003. One arm's excess pushes the other three cells negative,
          because their numerators sum to zero.
      add_on_results:
        columns: "P(fails) as [criterion (i), criterion (ii)]; add-on calibration 2 x 10000, evaluation 5000 (MC SE about 0.0014 at 1%)"
        r0_placed_with_recalibration:
          n_b_3400: {D1_kappa1.10: [0.0004, 0.5092], D1_kappa1.15: [0.0000, 0.9398], D2_dispersion1.3: [0.0000, 0.4740]}
          n_b_6800: {D1_kappa1.10: [0.0000, 0.8796], D1_kappa1.15: [0.0000, 0.9990], D2_dispersion1.3: [0.0000, 0.5822]}
          kn_placed_same_add_on_run:
            n_b_3400: {D1_kappa1.10: [0.0002, 0.5224], D1_kappa1.15: [0.0000, 0.9320], D2_dispersion1.3: [0.0000, 0.5248]}
            n_b_6800: {D1_kappa1.10: [0.0000, 0.8812], D1_kappa1.15: [0.0000, 0.9996], D2_dispersion1.3: [0.0000, 0.6052]}
          reading: >-
            Placing the departure in a random arm and recalibrating as RA-05
            would changes (ii)'s power by no more than Monte Carlo error. The
            kn-placed main results stand for either placement.
        N1_exchangeable_curve_effect_false_failures:
          n_b_3400: {cv0.2: [0.0000, 0.0098], cv0.4: [0.0000, 0.0094], null_same_calibration: [0.0000, 0.0128]}
          n_b_6800: {cv0.2: [0.0000, 0.0108], cv0.4: [0.0000, 0.0148], null_same_calibration: [0.0000, 0.0080]}
          reading: >-
            No inflation at CV 0.2. At CV 0.4 and n_b 6800, (ii) fails at
            0.0148, against 0.0080 for the null under the same calibration (MC
            SE about 0.0015). That is a possible mild sensitivity to strong
            misspecification of the per-curve means while the arms stay
            exchangeable. It is not seen at n_b 3400. Criterion (i) is
            unaffected.
        replacement_ii_prime_max_abs_z:
          definition: "fails iff max_e |z_e| > the joint law's 0.99 quantile of max_e |z_e| (3.0047 at n_b 3400, 3.0134 at n_b 6800, standard law)"
          n_b_3400: {null: 0.0136, D1_kn_kappa1.10: 0.7228, D1_kn_kappa1.15: 0.9882, D2_kn_dispersion1.3: 0.0120, D3_kappa1.15: 0.0096, D1_r0_kappa1.10_recal: 0.7136, D1_r0_kappa1.15_recal: 0.9880, D2_r0_dispersion1.3_recal: 0.0098, N1_cv0.2: 0.0116, N1_cv0.4: 0.0096}
          n_b_6800: {null: 0.0104, D1_kn_kappa1.10: 0.9796, D1_kn_kappa1.15: 1.0000, D2_kn_dispersion1.3: 0.0092, D3_kappa1.15: 0.0106, D1_r0_kappa1.10_recal: 0.9734, D1_r0_kappa1.15_recal: 1.0000, D2_r0_dispersion1.3_recal: 0.0112, N1_cv0.2: 0.0106, N1_cv0.4: 0.0114}
          reading: >-
            (ii') detects a single-arm mean excess more often than (ii) does
            (0.71-0.72 against 0.51-0.52 at kappa 1.10 and the declared n). It
            does not detect a single-arm over-dispersion (null rate), which
            (ii) detects at 0.47-0.61.
    c_verdict:
      criterion_ii: informative
      criterion_ii_numbers: >-
        False-failure rate under the calibrated null is 0.0095-0.0117 at every
        ladder n (nominal 0.01). Power against a single null arm with kappa
        1.10 is 0.48 at the declared n, rising to 0.88 at 2x. Against kappa
        1.15 it is 0.92 to 1.00. Against a single arm with dispersion 1.3 it is
        0.51 to 0.61. Against a common-mode excess on all four arms it is at
        the null rate, 0.0097-0.0130. Its interval is narrow ([-0.0016,
        0.0173] at the declared n), but so is zbar's null spread; the
        departures above move or spread zbar by several null SDs. The add-on
        gives the same powers when the departure sits in r0 and RA-05's
        recalibration is applied. False failures under an exchangeable
        curve-level mean misspecification stay at the null rate at CV 0.2,
        with a possible mild inflation (0.0148) at CV 0.4 and n_b 6800. What a
        (ii) failure indicates: the four null arms are not exchangeable in
        mean or in dispersion, or the calibrated law misstates the
        mean-variance coupling. It does not say which arm.
      criterion_i: degenerate against D1-D3
      criterion_i_numbers: >-
        P(K_null >= 1) is about 0.04 and P(K_null >= 2) is at most 0.00013, so
        (i) fails only when two or more null cells exceed t_dec. Its failure
        rate is at most 0.0003 under the null and under every one of D1, D2
        and D3, at every n. A known-null arm reading above t_dec (K = 1) passes
        (i). (i) can respond only to departures that lift two or more null
        arms above the others, which none of D1-D3 does.
      scope: >-
        These are synthetic results under the stated count law. They describe
        the frozen criteria's discriminating power, not any reading of this
        experiment. RA-05's t_dec = max(t_A, t_perm) >= t_A can only lower
        (i)'s rates further; (ii) does not use t_dec.
    d_options:
      note: >-
        Minimal pre-data options in the specification's own terms. Changing
        the frozen rule requires an additive protocol amendment, approved
        before any PC-NULL-R reading is made (preregistered_prediction.source:
        "any change is an additive protocol_amendment and never re-scores a
        run"). No option is recommended. The consequences follow from (a) to
        (c) only.
      options:
        - id: OPT-1
          name: keep as is
          rule: analysis.PC-NULL-R_rule unchanged ((i) and (ii))
          consequence_for_O-A-UNCAL: >-
            With every invalidating gate passing, PC-NULL-R routes to O-A-UNCAL
            essentially through (ii) alone. Synthetic rates: about 0.01 under
            the calibrated null at every n; 0.48-0.88 for one null arm at
            kappa 1.10; 0.92-1.00 at kappa 1.15; 0.51-0.61 for one null arm
            over-dispersed to 1.3; the null rate for a common-mode excess.
            Under misspecified per-curve means with exchangeable arms (N1,
            add-on), (ii) fails at 0.0094-0.0108, except at CV 0.4 and n_b
            6800, where it fails at 0.0148 (null under the same calibration:
            0.0080). A single-arm excess or over-dispersion in a null arm
            therefore makes the structural reading INCONCLUSIVE, with the
            probabilities above.
        - id: OPT-2
          name: (ii) report-only
          rule: "PC-NULL-R passes iff (i); the mean of the four pooled null z and its simulated 99% interval are reported, never gating"
          consequence_for_O-A-UNCAL: >-
            PC-NULL-R would route to O-A-UNCAL only when two or more null cells
            exceed t_dec. The synthetic rate is at most 0.0003 under the null
            and under every D1-D3 scenario at every n. A known-null arm that
            reads above t_dec (K = 1) would pass PC-NULL-R. O-A-UNCAL would
            then arise, in practice, only from PC-R-T, PC-R-D or the 80% rule.
            The falsification_criterion route "HEUR-2765d2-H4 is refuted at
            this cell by a PC-NULL-R failure" would rest on (i) alone; the
            route "t_perm exceeding t_A's simulated 0.999 quantile" is
            unchanged.
        - id: OPT-3
          name: replacement criterion (ii')
          rule: >-
            "(ii') passes iff max over the four null pseudo-cells of |z_e| is
            at most the 0.99 quantile of the same maximum under the simulated
            joint law (the joint law of analysis.calibration_G-NB-R, same
            replicates and seed families, quantile averaged over families as
            for t_A)." PC-NULL-R passes iff (i) and (ii').
          consequence_for_O-A-UNCAL: >-
            With every invalidating gate passing, PC-NULL-R routes to
            O-A-UNCAL through (ii'), since (i) is at most 0.0004 throughout.
            Synthetic rates (add-on, n_b 3400 / 6800): null 0.0136 / 0.0104;
            one null arm at kappa 1.10, 0.71-0.72 / 0.97-0.98; at kappa 1.15,
            0.99 / 1.00; one null arm over-dispersed to 1.3, 0.010-0.012 /
            0.009-0.011, i.e. the null rate, where OPT-1 gives 0.47-0.52 /
            0.58-0.61; common mode, the null rate; exchangeable curve effect
            (N1), 0.0096-0.0116. Relative to OPT-1, (ii') is more sensitive
            to a single-arm mean excess and insensitive to single-arm
            over-dispersion. The H4 falsification route "a PC-NULL-R failure"
            would then cover a known-null or random arm whose |z| is extreme
            in either direction.

  q3_fixture_tooling:
    question: >-
      Is a fixture-tooling script placed and pinned under
      experiments/EXP-PFDR-0b3699/fixtures/ consistent with
      inputs.experiment_scripts_new, required_artifacts.per_experiment and
      8a6b8a ORDER STEP (c) ("Write exactly four scripts")? Judged from the
      text only. fixtures/fixture_exercise.py was hashed (it equals its pin)
      and was not opened.
    verdict: consistent
    verdict_confidence: >-
      Medium. A strict containment reading, in which fixtures/ lies inside
      experiments/EXP-PFDR-0b3699/ and so "exactly four scripts" counts every
      script beneath it, would make it inconsistent. The text supports the
      purposive reading more, for the reasons below.
    clauses_relied_on:
      - {path: "EXP-PFDR-0b3699 inputs.experiment_scripts_new", phrase: "run_jobs.py (launcher ...); design_a.py (P0 ...); analyze_a.py (subcommands p0, calibrate, unmask ...); reproduce_check.py (G-REPRO comparator; standard library only)"}
      - {path: "EXP-PFDR-0b3699 required_artifacts.per_experiment", phrase: "experiments/EXP-PFDR-0b3699/run_jobs.py, design_a.py, analyze_a.py, reproduce_check.py"}
      - {path: "EXP-PFDR-0b3699 required_artifacts.per_experiment", phrase: "experiments/EXP-PFDR-0b3699/fixtures/ (synthetic fixtures and the fixture exercise log run before first use on real data -- a known-null arm, a planted excess of known size, a planted vector absent on one curve, duplicated keys)"}
      - {path: "TASK-20261002-8a6b8a constraints[5] ORDER STEP (c)", phrase: "Write exactly four scripts in experiments/EXP-PFDR-0b3699/: run_jobs.py ...; design_a.py ...; analyze_a.py ...; reproduce_check.py ... Write the synthetic fixtures of required_artifacts.per_experiment under experiments/EXP-PFDR-0b3699/fixtures/ and run the fixture exercise before any use on real data, logging it there. Then record pins.scripts (sha256 of each of the four scripts and of the three EC-A1 files ...)"}
      - {path: "EXP-PFDR-0b3699 inputs.permitted_means_CD-12 and AR-2 (3)", phrase: "every file of required_artifacts.per_run_data has exactly the writer named here ... Any other data file or rule application remains a stop under the local_ambiguity_rule"}
      - {path: "EXP-PFDR-0b3699 invalidation_rules I-A6", phrase: "a run directory outside experiments/EXP-PFDR-0b3699/runs/"}
    reasoning: >-
      (1) "Exactly four scripts" enumerates the experiment scripts of
      inputs.experiment_scripts_new: the programs the RA commands invoke and
      that AR-2's writer table names as writers of per_run_data. The same
      ORDER STEP then gives a separate instruction ("Write the synthetic
      fixtures ... under .../fixtures/ and run the fixture exercise ...,
      logging it there") and names no tool for it. required_artifacts lists
      fixtures/ as an artifact of its own. A tool confined to fixtures/ that
      writes and exercises synthetic fixtures carries out that second
      instruction. It does not add a fifth experiment script. (2) Fixtures
      are per_experiment artifacts, not per_run_data, so AR-2 (3)'s
      named-writer rule and CD-12's "other data file" stop concern run data,
      not synthetic fixtures. (3) Pinning the tool beside the seven files
      ORDER STEP (c) requires is additive: it is stricter, not looser. (4)
      The run_jobs.py runs-root override that the fixture_tooling_note
      describes is code inside one of the four scripts. It is consistent with
      the text only while inert by default.
    not_consistent_if:
      - any RA command (RA-01 .. RA-07) invokes fixtures/fixture_exercise.py, or any of the four scripts imports it or reads a file it wrote
      - the run_jobs.py runs-root override (EXP0B3699_RUNS_ROOT) or the fixture override (FIXTURE_DIR) is set in any RA run, or run_jobs.py's default runs root is not experiments/EXP-PFDR-0b3699/runs (I-A6)
      - the tool writes outside experiments/EXP-PFDR-0b3699/fixtures/ and the task scratch directory, in particular into runs/
      - the tool, or any pinned file, was edited after pins.scripts.pinned_at (ORDER STEP (c) "A pinned file is never edited afterwards")
      - any gate, statistic or outcome on real data is computed by code in the tool rather than in the four scripts
      - the fixture exercise ran after any use of the four scripts on real data
    note: >-
      Whether any of these conditions occurred is checked mechanically
      elsewhere, as the card states. This task did not open the tool, the
      exercise log or any run record.

  limitations:
    - >-
      Text and code readings only. No output of EXP-PFDR-0b3699 was read, so
      no reading here says whether any condition occurred in the runs. That
      includes the Q3 conditions and the strict-reading G-REPRO verdict on
      harvest.worker_maxrss_bytes, which is recoverable from
      g-repro-report.json.
    - >-
      B0 reads G1' from its text. G1''s comparator,
      experiments/EXP-PFDR-1b78f7/compare_regression.py, is not an input and
      was not read. If it defines "timing key" operationally, that definition
      was not weighed.
    - >-
      PDI-9 cannot be decided without EXP-PFDR-011cd0 analysis.A-TAIL, which
      is outside the permitted inputs.
    - >-
      The Q2 numbers are synthetic and conditional on the stated parameters
      (per-rung means and D from the specification's planning figures;
      heterogeneity u^4 with u ~ U(0.85, 1.15)). The joint law is calibrated
      once per n at the null parameters. That is exact for departures placed
      in the known-null arm and for the N1 check. For departures placed in a
      random arm, RA-05's recalibration is approximated by its expected value
      (add-on), not re-estimated per synthetic dataset. Synthetic t_dec =
      t_A: RA-05's t_dec = max(t_A, t_perm) >= t_A, which can only lower (i)'s
      failure rate, and (ii) does not use t_dec. Quantiles are averaged over
      2 seed families (the specification uses 5 for its own calibration).
      Monte Carlo SE at a 1% rate is about 0.001 with 10000 evaluation
      replicates, and about 0.0014 with 5000 (add-on).
    - >-
      Estimates labelled "hand estimate" or "hand argument" (PDI-6, PDI-7)
      were not simulated.
    - >-
      The resolved model identifier is the runtime's statement and is not
      probe-verified. Same-model sessions attest session independence only.
    - >-
      The pins were checked by sha256 equality at the time of this task. That
      a file was not edited between pinned_at and its use is a fact about run
      records, which this task did not read.

