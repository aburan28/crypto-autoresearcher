          - {path: "H-PFDR-2765d2 lemma L1 claim", phrase: "E[R] = |RR|/N"}
          - {path: "H-PFDR-2765d2 lemma L2 claim", phrase: "TT at arity h: a relation with exactly 2h nonzero coefficients, all +-1, on distinct indices, has M_r = C(2h, h)/2 (3 at h = 2 ...)"}
