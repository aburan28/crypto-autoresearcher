          - "harvest.py 487/523, 644/713, 784/840, 906/965 (Harvester.seconds += time.perf_counter() - t0) and 188, 219/228 (SearchRecorder.seconds)"
        present_in_archived_first_row: true
      - key: harvest.worker_maxrss_bytes
        class: H
        engine_lines:
          - "harvest.py 968: block[\"worker_maxrss_bytes\"] = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss * 1024"
        measures: the high-water mark of resident memory of the whole worker process up to the moment finish() runs; not a function of the instance's computation
        present_in_archived_first_row: true
      - key: ru_maxrss_bytes
        class: H
        engine_lines:
          - "__main__.py 747-757: on MemoryError, \"ru_maxrss_bytes\": resource.getrusage(resource.RUSAGE_SELF).ru_maxrss * 1024"
        present_in_archived_first_row: false
        note: >-
          Conditional. Present only on a row with status failed_infrastructure
