  b_exclusion_by_the_frozen_phrase:
    - key: seconds
      excluded: true
      confidence: high
      reason: >-
        It is a timing key. G1' names it ("seconds excluded"), and T-DET strips
        it (_strip_census line 591).
    - key: harvest.harvest_seconds
      excluded: true
      confidence: high
      reason: >-
        Read on the plain words, it is a timing key: elapsed perf_counter time
        (harvest.py 966). G-REPRO says "timing keys", a plural class, not the
        single key "seconds". G1' defines the compared set as "every
        non-timing key", so the excluded class is timing keys. G1''s
        parenthetical "(seconds excluded)" names the only timing key its
        harvest-off rows have, so it does not narrow the class. The committed
        T-DET convention strips it too (_strip_census 595-596). The only
        reading that keeps it compared takes "(seconds excluded)" to mean
        exactly the key named "seconds". That reading contradicts G-REPRO's
        plural "timing keys", and it makes the gate unsatisfiable in practice.
    - key: harvest.worker_maxrss_bytes
      excluded: false
      confidence: medium
      reason: >-
        On the plain words it is not a timing key. It is a host memory
        measurement. The frozen phrase excludes "timing keys", and G1' compares
        "every non-timing key". So the literal text keeps it in the comparison.
        Against that: the committed T-DET convention, the program's own
        determinism comparison of exactly these three row files, strips it
        together with the two timing keys (_strip_census 595-596). And G1' had
        no occasion to address it, because harvest-off sweep rows have no
        harvest block. So one reading is admissible but not compelled: "timing
        keys excluded, as G1'" was meant to drop the process measurements
        that are not outputs of the computation, which is what T-DET drops.
        But "as EXP-PFDR-011cd0 G1'" points to G1', not to T-DET, and G1''s
        words reach only timing keys. The text therefore does not exclude the
        key; whether its drafters meant to is undecided (d).
    - key: ru_maxrss_bytes
      excluded: false
      confidence: medium-high
      reason: >-
        Not a timing key on the plain words, and T-DET does not strip it either
        (_strip_census pops only seconds, harvest.harvest_seconds and
        harvest.worker_maxrss_bytes). Its presence implies an
        address-space-cap failure row. Equality then needs both the archived
        and the re-run row to stop on the same instance with equal peak RSS.
        In practice it bears on G-REPRO only when such a row exists in either
        file, and then status and the key set already differ unless both runs
        stopped there.

  c_expected_to_differ_between_identical_runs_on_one_host:
    - key: harvest.worker_maxrss_bytes
      answer: yes, it can differ; equality is not guaranteed by the code
      from_code: >-
        ru_maxrss (RUSAGE_SELF) is the high-water mark of resident pages of the
        whole process, read at the end of each instance (harvest.py 968). With
        --workers 1 every instance of a job runs in the one CLI process
        (__main__.py 1072-1081). Each row's value is therefore the peak over
        the process's whole history before it: imports, every earlier curve and
        arm, and this instance's table. Nothing in the code ties it to the
        instance's inputs. It depends on allocator and garbage-collector
        behaviour, numpy temporary buffers, interpreter and library builds,
        and the kernel's resident-page accounting (pages reclaimed or swapped
        under memory pressure do not count). For two byte-identical commands
        on one idle host with one environment, equal values are plausible but
        are not guaranteed by the code. Two conditions make a difference
        expected. (1) A changed environment: the G-REPRO first comparison is
        against rows archived by another session, possibly with another
        interpreter or numpy build. (2) A changed process history: the
        G-REPRO second comparison adds planted_sub and small_x_offset, which
        run inside the same process, in MAIN_ARMS_ALL order (__main__.py
        563-566, 882), before every arm of the next curve (jobs sorted by
        curve, 1036). That can raise the high-water mark seen by later
        pre-existing-arm rows. The T-DET test compares w1, w2 and split runs,
        whose process histories differ, and passes only because it strips
        this key.
    - key: ru_maxrss_bytes
      answer: yes, by the same mechanism; the row exists only when RLIMIT_AS fires, which itself depends on host memory behaviour
    - key: seconds, harvest.harvest_seconds
      answer: yes (wall-clock perf_counter differences); T keys, excluded
    - related_non_measurement_keys: >-
        Not T or H keys, but host-dependent on failure paths only: status,
        status_reason, ok and the row's key set change if the per-instance
        watchdog (SIGALRM, __main__.py 620-627, 742-746) or the address-space
        cap (747-757) fires. The frozen phrase excludes none of these. A
        watchdog or cap stop in RA-02 would therefore make G-REPRO fail on an
        infrastructure event. That follows from the text; it is not a gap in
        it. Separately, "accelerated" and the TT/TB stored order depend on
        numpy being importable (tails.py iter_keys docstring: stored order
        differs between the numpy and dict paths). That is an environment
        dependence, not a difference between identical runs.

  d_keys_the_text_leaves_undecided:
    keys:
    - key: harvest.worker_maxrss_bytes
      why: >-
        The literal words compare it, because it is not a timing key. The
        cited model G1' never met it. The committed determinism convention for
        exactly these row files strips it. No frozen clause says which governs.
    - key: "seconds, harvest.harvest_seconds, harvest.worker_maxrss_bytes in the SECOND G-REPRO comparison"
      why: >-
        "give identical rows for every pre-existing arm" states no exclusion.
        Read literally, T keys must be identical, which no run can meet. The
        only executable reading carries the first sentence's exclusion over.
        Whether that carried exclusion is "timing keys" only, or the T-DET set
        that adds worker_maxrss_bytes, is undecided. That clause also leaves
        open whether "rows" covers harvest and staircase rows as well as census
        rows, and whether the comparand is the archived rows or the first
        re-run.
    related_points_not_keys:
      - >-
        G-REPRO does not say whether rows are matched by order of file or by
        key, or whether G1''s "exact row count, no duplicate key" is imported
        with "as G1'". On the words, "as G1'" attaches to the timing exclusion
        only. "every census row ... equals the archived rows" implies a
        one-to-one correspondence but does not name the matching key.
      - >-
        ru_maxrss_bytes is decided (compared) by both the words and T-DET, but
        it can matter only on an address-space-cap row.
  summary: >-
    Blind reading: the frozen phrase excludes seconds and
    harvest.harvest_seconds (high confidence). Read on its plain words, it
    does not exclude harvest.worker_maxrss_bytes or ru_maxrss_bytes (medium;
    medium-high). harvest.worker_maxrss_bytes is the one census-row key the
    text leaves undecided. Its exclusion is an admissible reading, supported
    by the committed T-DET convention, but the words do not compel it, and
    the engine code gives no guarantee that it is equal across runs (c).
    Harvest and staircase rows contain no T or H key. No data value of either
    experiment was read for this reading.
