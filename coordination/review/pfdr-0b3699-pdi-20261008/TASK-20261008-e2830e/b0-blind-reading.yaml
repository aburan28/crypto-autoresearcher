    resource_named_or_cost_keys_classified_C:
      - key: harvest.ss_store.peak_bytes
        class: C
        engine_lines: ["harvest.py 81: BYTES_PER_ENCODING = 12", "harvest.py 955-960: peak = self.store_entries; \"peak_bytes\": peak * BYTES_PER_ENCODING"]
        reason: >-
