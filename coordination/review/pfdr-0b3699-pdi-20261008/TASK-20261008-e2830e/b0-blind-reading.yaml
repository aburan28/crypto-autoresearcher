      Harvest rows (key fields bits, curve, m, arm, mode + class, attempt,
      elements, coeffs, kcoef, rhs, formal, cert_ok, census_rank_after;
      __main__.py 703-706, harvest.py 628-631) and staircase rows (key fields +
