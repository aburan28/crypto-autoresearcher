          - "solver.py 132, 241, 273: t0 = time.perf_counter(); t2 = time.perf_counter(); seconds_total=t2 - t0 (wall-clock elapsed time of the whole instance)"
          - "__main__.py 729, 741, 746, 757: \"seconds\": time.perf_counter() - t0 on the certificate-failure, watchdog and address-space-cap rows"
        present_in_archived_first_row: true
