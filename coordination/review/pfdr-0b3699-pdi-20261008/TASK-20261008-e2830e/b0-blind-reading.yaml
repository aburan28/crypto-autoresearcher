  a_key_inventory:
    scope_note: >-
      Census rows of `census --panel main --modes table --relcount --retain
      all` (the R12 / RA-04 shape). The key set below is the one the engine
      code emits (__main__.py 713-717, 772-784, 804; harvest.py 916-968), and
