  composition:
    who: >-
      The Coordinator, in TASK-20261002-b61002, in a fresh session that did
      not run TASK-20261002-b75ae9, did not compose DEC-20260929-54dcd8 or any
      earlier lane-A decision, did not author DEC-20261002-f61a75,
      DEC-20261002-5e691c or this plan, and is not a reviewer of this round.
      No reviewer votes on the whole contract.
    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/binstd-a-20261002-f6b7c5/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-f6b7c5/reviews/TASK-20261002-aba8f9/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-f6b7c5/reviews/TASK-20261002-ab21d1/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-f6b7c5/reviews/TASK-20261002-6084fa/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-361e02/reviews/TASK-20260929-739a0c/,
      run by the top-level session and recorded in DEC-20261002-a75609
      whatever it reports. If the tool refuses the carried report, its output
      is recorded and the composer applies K-carry-broken; the tool is never
      edited to pass. The --blind-history check is uncheckable (no
      protected-digest file) and is recorded as such (PD-R4).
    custody_without_seal: >-
      No seal card. Before TASK-20261002-b61002 is launched, the top-level
      session computes sha256 of the six declared report files of this round
      and of the two carried J5 files, and pastes them into the launch prompt.
      The composer records them verbatim as its first act, before reading any
      report, and checks that the two carried digests equal
      carried_from.files_sha256. TASK-20261002-d98069 must reproduce all
      eight; a mismatch voids the composition.
    icperf_objection_check: >-
      DEC-20260929-54dcd8 NA-2 and DEC-20260928-63addc PTR-ICPERF. Before the
      composer is launched the session runs tools/agent_bus.py inbox --as
      coordinator and pastes any message from the GOAL-ICPERF-e6b6a4 owner
      referencing IDEA-20260926-20ba8f, PTR-ICPERF, EXP-BINSTD-532d7f,
      EXP-BINSTD-517186, EXP-BINSTD-8cb697 or EXP-BINSTD-a222b4, or states
      there is none. K-approve requires that statement or a ruling on the
      objection inside the composing decision.
    discharge_check: >-
      The composer reads the audit sheet's revision discharge table and checks
      that each item of DEC-20260929-54dcd8 (R3-J3-1; R3-J4-1; R3-J3-2,
      R3-J3-3, R3-J3-4, R3-J3-5, R3-J1-1) maps to a named clause that the
      owning joint's report (discharge_map) does not contradict, and that
      each recommended_not_required item (RC-3, O-J2-1, O-J2-2, J3-O7, OI-5,
      OI-2) is adopted or answered with a reason. A required item with no
      clause is a missing approval field for K-revise-defect. If R3-J3-1's
      permitted alternative was taken, the composer checks that the reason is
      recorded and that every removal it requires was made.
    keys:
      K-approve: >-
        J1 to J4 hold; J1's D-CARRY finds no uncovered difference; the carried
        J5 agrees with version 4's frozen figures within the agreement
        tolerance (after any stated constants_delta adjustment); every PTM
        meets its failure signature; the false-pass sweep is present and no
        flagged deviation of a declared-tested consequence or certifies_only
        item reads POSITIVE (or the consequence is honestly demoted); no
        tripwire fired; every required revision item is discharged
        (discharge_check); the ICPERF objection check is recorded with no
        unruled objection. DEC-20261002-a75609 then approves
        EXP-BINSTD-a222b4 under the AGENTS.md standing user authorization and
        names as its first next action the opening of an execution batch
        whose first card advances the approval and status fields of the
        version-4 records and records versions 1 to 3 as superseded. Approval
        asserts nothing about any curve's security, any oracle's cost, or
        index calculus against rho.
      K-revise-defect: >-
        Any of J1 to J4 breaks, a field approval requires is missing, a
        required revision item is undischarged, or TA-3 fired. Decision
        revise, each defect listed with its joint and breaking artifact, and a
        revision design card in a new batch as the first next action.
      K-indeterminate: >-
        The carried J5 disagrees with version 4 beyond the tolerance on any
        quantity. Decision revise on C2, naming the quantity; neither
        implementation is preferred.
      K-carry-broken: >-
        J1's D-CARRY reports an uncovered difference, or the independence
        tool refuses the carried report. The carried J5 is not applicable to
        version 4. No approval in this round; decision revise, naming the
        difference, with a fresh blind card on the changed quantities as part
        of the first next action. Not a defect of the mathematics.
      K-impediment: >-
        A primary source the contract cites is unreachable and the contract
        records the impediment, keeps the dependent statement marked, and
        forbids substitution. Not a defect by itself; approval is permitted if
        every other key of K-approve holds.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        approval while any joint is inconclusive. An infrastructure failure is
        never negative evidence about the contract's mathematics or any curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    selection_point_duties: >-
      The composing decision is a selection point of GOAL-ECDLP2M-001. It
      reads DEC-20261002-f61a75 R-ORDER and DEC-20261002-5e691c R-QSP-SUCC and,
      if on origin/main at its launch, DEC-20261002-353743 and
      DEC-20260929-585602, and records only changes to the standing order,
      each with its reason, cost and revisit. It performs the HOLD-X1 revisit
      (DEC-20260929-54dcd8 CH-C), the HOLD-X8 revisit (CH-D), and the HOLD-X2
      revisit (CH-E) if it is the later of this decision and the S2
      lineage's latest composing decision on main. The slot this lane frees
      goes to U-HOLDH unless an earlier freed slot has taken it, then to
      QSP-SUCC (R-ORDER); any other assignment records a new reason and the
      cost of deferring.

