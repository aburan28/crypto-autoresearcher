  coordinator_prior:
    per_joint: >-
      J1 (Stage 0 recomputation, R3-J1-1, and the D-CARRY diff that makes the
      carried blind joint applicable) holds with probability about 0.85. No
      revision item touches the Stage 0 arithmetic; the risk, about 0.1, is
