      TASK-20261002-ab21d1: <session scratchpad>/BATCH-f6b7c5/TASK-20261002-ab21d1/
      TASK-20261002-6084fa: <session scratchpad>/BATCH-f6b7c5/TASK-20261002-6084fa/

  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20261002-aba8f9 (PTM-C, PTM-D, PTM-E); TASK-20261002-6084fa (PTM-A, PTM-B)
    assigned_to_note: >-
      Split by where each object bites: PTM-A and PTM-B on the cost rules
      (J4's owner), PTM-C, PTM-D and PTM-E on the decision table (J3's
      owner).
    objects:
      - id: PTM-A
        owner: TASK-20261002-6084fa
        object: >-
          An oracle with per-attempt cost exactly C = T_gen(m) at matched
          advice S = B_cap, at each m in 4, 5, 6, 8, 16, fed to the contract's
          cost rules.
        known_truth: >-
          Its precomputation equals P_gen exactly and its online cost sits at
          or above T_gen; it is on the generic frontier, not below it. A rule
          that reports it below the frontier or reports a relaxation for it
          has proved too much.
      - id: PTM-B
        owner: TASK-20261002-6084fa
        object: >-
          The L = 1 slice of the contract's multi-target cost at m = 4 at the
          sub-cap base and at m = 5 at B_cap(5), with T_shared evaluated from
          the model terms.
        known_truth: >-
          L = 1 reproduces a single-target product law with no amortisation;
          at m = 4 in the D3 convention the tie budget is the unrounded pinned
          value 11.010251 up to the stated attempt-constant difference, and
          the tie rule decides the frozen m = 4 input. A rule that reports an
          advantage at L = 1, or a tie budget that differs from the
          single-target law it names without the stated difference, has
          proved too much.
      - id: PTM-C
        owner: TASK-20261002-aba8f9
        object: >-
          The m = 5 window at g = 14, and the relabelled Z/NZ control against
          the ordinary and Koblitz n = 19 cells for every gated observable,
          the two new tests included, at matched mu, B and coset factor.
        known_truth: >-
          At g = 14 the window is empty in both conventions. The laws under
          test are group-generic; a rule that predicts a different value of
          any gated observable on the Koblitz cell than on the ordinary cell
          or on Z/NZ at matched mu, B and f has proved too much. (Restated
          from version 3 for R3-J3-2: once f is charged, predictions may
          depend on the measured f, never on the cell's identity.)
      - id: PTM-D
        owner: TASK-20261002-aba8f9
        object: >-
          The no-reuse null: a fixed setup spent in full, then an independent
          per-target solve that reuses no relation, with the contract's
          accounting, on CTRL-ZN and on one binary cell.
        known_truth: >-
          There is no amortisation. A rule that reads it as amortisation on
          any gated observable, or assigns it to the POSITIVE outcome, has
          proved too much.
      - id: PTM-E
        owner: TASK-20261002-aba8f9
        object: >-
          A matched-mean target-coverage deficit of 5, 10 and 15 percent in
          KN-FIND-007's direction on both binary cells (attempts per target
          at the model's mean; target coverage below 1 - exp(-mu_c) by that
          fraction), in a low-dispersion and a high-dispersion variant, with
          every other observable at its model value; plus the seam point, a
          deficit sized to sit between the contract's flag threshold and its
          gate threshold if those differ.
        known_truth: >-
          H1 (e), the Poisson coverage law behind the attempts constant A(mu),
          is false on this object. A table that reads it POSITIVE while the
          contract's own deficit flag is raised on both cells has proved too
          much (DEC-20260929-54dcd8 NA-1).
    failure_signature: >-
      A correct protocol keeps each known-false conclusion out of reach in its
      rules. PTM-A reads on the frontier with zero relaxation. PTM-B reads the
      single-target law with no advantage and a tie budget that can differ
      from it. PTM-C reads an empty window at g = 14 and identical predictions
      on all cells at matched mu, B and f. PTM-D fails an amortisation gate
      and lands in a declared non-POSITIVE outcome. PTM-E never reads
      POSITIVE at any size the contract's own statistic flags: under gating,
      both cells non-PASS (LOW-RETRY, or SPLIT as the table states) and the
      contract label NEGATIVE (H1-NEGATIVE-YIELD) or NOT-VALIDATED as the
      restated table assigns; under the permitted demotion, target coverage
      absent from certifies_only and the PASS-routed deficit range stated and
      including the object.
    how_to_run_it: >-
      Review computations in your own script at zero compute (arithmetic on
      the contract's rules and synthetic cost tables, and Monte Carlo of the
      abstract model). They mint no RUN-*, write no evidence record and never
      execute any EXP-BINSTD-a222b4 driver as an experiment. Feeding
      synthetic test results through the committed classify_cell and
      stage2_outcome is a review computation. Put every script and output in
      computations.json. If a PTM would amount to a new experiment, record it
      not performed with the reason.

