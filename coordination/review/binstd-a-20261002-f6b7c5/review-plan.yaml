        percent at any declared regime with f as the contract admits it, or a
        band that confines its observable, breaks the joint. (iii) Coset
        factor: check that f enters every prediction it affects (a_pred,
        kappa_pred, the band widths) the same way, or that an admission rule
        bounds it. (iv) Rule sweep, carried: apply every invalidation,
        stopping and admission rule as frozen to the declared metrics, to P1,
        and to a Monte Carlo sample under H1 and H2. (v) Reachability per
        declared outcome from generative quantities, and per declared arm as
        coded (the arm reaches the outcome the table assigns it). (vi) The
        no-reuse null through the rules on CTRL-ZN and BIN-ORD-19. (vii) Check
        R3-J3-3, R3-J3-4, R3-J3-5, RC-3 and J3-O7 against text and code.
        Where I think it breaks: (i) at the seam, then (iii).
      breaking_artifact: >-
        A flagged deviation of a declared-tested consequence or certifies_only
        item that reads POSITIVE without an honest demotion; a sweep that
        omits such an item; a declared outcome no data can reach, or an arm
        that does not reach its outcome as coded; a rule that voids or
        reroutes the modal pattern; a gate with a false-fail rate above 5
        percent under the true model at a declared regime, or a band confining
        its observable; f charged in one prediction and not another with no
        admission bound; the no-reuse null passing an amortisation gate; an
        undischarged R3-J3 item.
    - joint: >-
        J4 -- Scope wording, conventions and provenance (C3, C7, C8; R3-J4-1;
        OI-2; R-SRC carried). The TW-01 containment clause keeps its c-range
        and adds, beside it, the matched-advice range: the first-below-the-line
        restatement holds for c below about 1.67 on the committed m = 4 range,
        about 1.54 with the online attempt constant charged, and 1.54 to 1.60
        at B = B_cap(m) on that basis; the failure description at the
        Bernstein-Lange constants already applies from c of about 1.67 for
        bases above B_cap(4); the c-independent routing rule unchanged. Every
        convention travels with the column; the per-orbit pointer stays
        conditional under CORR-20260925-649e25; the R-SRC citations keep URL,
        sha256 and verified_by (vendoring under inputs/ answered); no
        prime-field cell or deployed run designed; the first clause of claim
        (C) in no outcome; no sentence in the new tests' or sweep's text
        states an outcome about any curve.
      assigned_to: TASK-20261002-6084fa
      attack_plan: >-
        (i) Quote every sentence mentioning the generic frontier, the S T^2
        line, first, below T_gen, beats, validated or every m >= 4, including
        in any new text; classify each as conditional statement, design
        figure or outcome; an outcome fires TA-1. (ii) Compute, under the
        contract's model, the c-range for the column-value containment and
        the matched-advice range (with and without the online attempt
        constant, on the committed m = 4 range and at B = B_cap(m)) and
        compare with the stated figures. (iii) Perform PTM-A and PTM-B. (iv)
        Check every convention and the per-orbit framing. (v) Check the R-SRC
        citations and any newly cited source; attempt retrieval if you doubt
        one; check OI-2's answer. Where I think it breaks: (ii).
      breaking_artifact: >-
        A frontier or first-below-the-line sentence as an outcome; a TW-01 or
        matched-advice clause stated for a range of c it does not hold on;
        R3-J4-1 undischarged; an unlabelled per-orbit movement; a source
        presented as read without provenance; a prime-field or deployed cell
        designed in; PTM-A or PTM-B on which the rules reach the known-false
        conclusion.
    - joint: >-
        J5 -- Blind re-derivation of the deployed arithmetic, CARRIED BY
        DIGEST from BATCH-361e02: TASK-20260929-739a0c's rederivation report
        (Q0 to Q7 of its card), bound by TASK-20260929-e85cfa at
        fc6cd4ecf131 (content_at_commit), carried to version 3 by
        DEC-20260929-54dcd8. Applicable to version 4 only if J1's D-CARRY
