  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        J1 -- Stage 0, the pinned comparator, R3-J1-1 and the carried-blind
        diff-check (C1, C2, C6 for the LA term). The contract commits in
        stage0_code the column, the identity, the LA term, the m = 5 window at
        B_cap(5) in both conventions, the m = 4 envelope on the committed
        range and the L = 1 slices, unchanged from version 3 or changed only
        as a constants_delta block states; it corrects the LA-iteration-constant
        restatements in H statement (B), H asymptotic_claim.hidden_cofactor
        and E definitions.cap_locus_and_constants (the m = 4 cap slice lower
        edges rise by up to 2.00 and 3.17 bits at k = 2, 3; the critical and
        closing values move by at most 0.02), optionally printing the cap
        slice in la_sensitivity (R3-J1-1). D3, never D1. DIFF-CHECK D-CARRY:
        the constants block, the committed m = 4 range and every design figure
        the carried J5 compared (Q1 to Q7 of TASK-20260929-739a0c's card) are
        value-identical to the version-3 audit sheet bound by
        TASK-20260929-76139a, or each difference is listed in a
        constants_delta block with its arithmetic.
      assigned_to: TASK-20261002-ab21d1
      attack_plan: >-
        (i) Recompute every column with your own code at high precision and
        compare with the committed values to 0.05 bit. (ii) Recompute the
        m = 5 window at B = B_cap(5) with A(mu) = 1/(1 - exp(-mu)) and
        retry_5 = 1/(1 - 5 exp(-5)) exactly, at g in 0, 2, 6, 10, 12, 13,
        13.2, 14 in both conventions, and the critical g. (iii) Recompute the
        m = 4 envelope and the cap slice on the committed range on a 0.01-bit
        grid at k = 1, 2, 3 for the LA constant and check every restatement
        R3-J1-1 names against your values. (iv) Read stage0_code statically:
        a __main__ guard, importing executes nothing, and the L = 1 print is
        evaluated from the model terms. (v) Grep the three files for 4.41, D1
        and gap; any D1-as-budget use breaks C2. (vi) D-CARRY: extract the
        constants block, the m = 4 range and every Q1 to Q7 design figure from
        both the version-3 and version-4 audit sheets by the same script, diff
        them value by value, and report every difference with whether a
        constants_delta entry covers it. Do not read the carried J5 report;
        the composer compares it. Where I think it breaks: (vi) if the
        producer touched stage0_code beyond prints, otherwise (iii).
      breaking_artifact: >-
        A recomputed column differing by more than 0.05 bit; a window bound
        off by more than 1 bit or a critical g off by more than 0.2; an
        envelope or cap-slice figure not recomputed on the committed range; an
        L = 1 print that cannot fail; D1 used as a budget; R3-J1-1 left
        undischarged (a restatement still understating the cap slice); a
        D-CARRY difference not covered by constants_delta.
    - joint: >-
        J2 -- Code, re-pinning, wiring, completeness and custody (C4, C5 for
        the numbered heuristics, C6, C8; the code side of R3-J3-1; O-J2-1,
        O-J2-2, OI-5; the supersession form). Every code block (fixture_code,
        stage0_code, and any calibration, sweep or outcome-pattern code) is a
        block scalar of the audit sheet with its extraction method and
        reference sha256 pinned and re-pinned where edited, import-safe; IR-6
