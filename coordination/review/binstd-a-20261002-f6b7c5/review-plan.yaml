    - joint: >-
        J3 -- The decision table itself (C5 for the validation pairing;
        R3-J3-1 routing and restatements, R3-J3-2, R3-J3-3, R3-J3-4, R3-J3-5;
        RC-3; J3-O7). Every consequence the contract declares tested and
        every certifies_only item (relation-phase yield, attempts law,
        determined-column law, target coverage, null separation, and the H2
        law) is routed out of POSITIVE when the contract's own statistic flags
        it at its own threshold, or is honestly demoted as R3-J3-1's permitted
        alternative states, with the PASS-routed range stated. The audit sheet
        carries that false-pass sweep. Every invalidation, stopping and
        admission rule applied to the contract's own declared metrics and to
        its modal pattern P1 still leaves P1 POSITIVE. Every gate's per-cell
        false-fail rate under the true model, with the version-4 gate set, is
        small and stated per cell regime and per coset factor. The coset
        factor is charged consistently (R3-J3-2). IR-5 (a) text, RB-IR5 and
        ir5_check assign the same consequence (R3-J3-3). The null arm's extra
        target attempt cadence is stated or made independent (R3-J3-4). The
        "equal per-test false-fail rates" wording is corrected (R3-J3-5).
        Every declared outcome is reachable and every declared arm reaches its
        outcome as coded. The no-reuse null fails every amortisation gate.
      assigned_to: TASK-20261002-aba8f9
      attack_plan: >-
        (i) FALSE-PASS SWEEP, NEW AND FIRST. Before opening the producer's
        sweep table or its C-4 and C-5 outputs, write your own: for each
        declared-tested consequence and each certifies_only item, construct
        from the contract's own statistic definitions the smallest deviation
        flagged at the contract's own threshold, in both directions where the
        statistic is two-sided, at matched mean where a mean is matched, with
        low and high dispersion; feed each through the committed classify_cell
        and stage2_outcome on synthetic inputs; record the class per cell and
        the contract label. Then compare with the producer's table. Any
        flagged deviation that reads POSITIVE breaks the joint, unless the
        contract demotes that consequence as R3-J3-1's permitted alternative
        allows and states the PASS-routed range. Look first at the threshold
        seam: T_kappa at |z| at most 3.3 against yield_audit's deficit at z at
        or below -3 (a deficit between them is flagged and passes). (ii)
        Per-cell false-fail with the version-4 gate set: for every gate
        compute the false-fail rate under the true model at each cell regime
