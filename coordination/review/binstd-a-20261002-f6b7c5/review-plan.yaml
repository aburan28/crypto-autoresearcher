      rather than TASK-20260929-76139a's, and the new tests must sit in
      gate_tests and outside COVERAGE_TESTS exactly as the text says. J3
      (the decision table) holds with probability about 0.5 and is again
      where I expect any break, in one of three places, most likely first:
      (a) THE THRESHOLD SEAM. R3-J3-1's preferred T_kappa band is |z| at most
      3.3, while the contract's own deficit flag (yield_audit) is z at or
      below -3; a deficit with z in (-3.3, -3] is flagged by the contract and
      passes the gate, so a matched-mean deficit at that size reads PASS on
      both cells while the flag is raised. Unless the producer aligns the two
      thresholds or declares the seam, the false-pass sweep should find it.
      (b) THE COSET FACTOR. If T_kappa and T_a are predicted at mu_c while the
      cell's effective mean is f mu_c (R3-J3-2), T_kappa fails high under the
      true model at f of about 1.1 (a coverage excess of about 0.035 at
      mu = 1 against a standard error of about 0.009), and a charged f
      enters the predictions in one test but not another. (c) An incomplete
      sweep: a certifies_only item (relation-phase yield, attempts law,
      determined-column law, target coverage, null separation, the H2 law)
      whose smallest flagged deviation is not recorded, or is recorded and
      routes to POSITIVE. J4 holds with probability about 0.85; the risk is
      the matched-advice c-range figures of R3-J4-1 stated inconsistently
      with the committed m = 4 range.
    overall: >-
      Probability about 0.5 that the round composes to approve. Most likely
      alternative: revise on J3 at the threshold seam or the coset factor.
      Least likely: K-carry-broken.
    where_i_think_it_breaks_if_it_breaks: J3 at the 3-versus-3.3 threshold seam, then J3 on the coset factor's entry into the predictions, then J2 on IR-6 re-pinning, then J1 on D-CARRY.
    estimator_prior: >-
      Under the contract's random model at m = 2, with T_kappa and T_rho added
      at 3.3 standard deviations, the per-cell false-fail rate rises by well
      under 1 percentage point on every cell regime (two more two-sided tests
      at a nominal 0.1 percent each, correlated with T_a and AM1), so G1 stays
      below about 1.5 percent and each binary cell below about 2 percent at
      f = 1; at f = 1.05 a binary cell's non-PASS rate rises to several
      percent unless f is charged. A matched-mean 10 percent coverage deficit
      sits about 7 standard errors low (54dcd8). A prior, not a result.
    what_would_overturn_this_prior_most: >-
      (1) The false-pass sweep finding a declared-tested consequence other
      than target coverage that the committed table routes to POSITIVE at a
      deviation its own statistic flags (a fourth mechanism of the kind the
      last three rounds found). (2) D-CARRY reporting an uncovered difference
      in a Stage 0 figure, which would void the carried blind joint. (3) A
      reviewer producing a published ECDLP algorithm below the S T^2 = N line
      on some curve, which withdraws claim (C)'s first clause while the column
      stands.
    informed_prior_disclosure: >-
      The prior is informed, not blind (PD-R1). The session that wrote this
      plan read DEC-20260929-54dcd8 in full, including the reviewer figures it
      quotes, and the observables, tests, controls, rules and outcome table of
