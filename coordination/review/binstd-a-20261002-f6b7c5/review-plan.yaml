        EXP-BINSTD-8cb697; no version-1, -2 or -3 file edited; zero runs.
      assigned_to: TASK-20261002-ab21d1
      attack_plan: >-
        (i) Extract every code block by the pinned method, hash against the
        pinned reference sha256, import each in a fresh interpreter and
        confirm nothing executes (a review computation, recorded). (ii) Diff
        binstd_core between the version-3 and version-4 extractions; every
