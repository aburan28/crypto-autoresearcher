  why_this_round_exists: >-
    RUN-SEMBIN-3ae91c returned completed_valid with every arm terminal: ARM R passed to
    4.8e-5 bits; ARM S reports the store-versus-metric ranges that decide H-SEMBIN-97ea23
    C2 and they come out DIFFERENTLY by storage reading (sparse: store 96 > parent
    metric set 72; dense: store 93 < parent metric set 132); ARM B reports the coherent
    baseline at 520 / 460 with a 29.0-bit excess at every label, exactly the predicted
    values; ARM F reports the hard band 65.33-80.07 exactly as predicted and a SOFT band
    at 28.6-48.0 that the hypothesis never mentions; ARM N is UNREACHED; ARM I agrees to
    2.8e-14 bits but with its blindness broken (PD-I); C10 finds that NO dense
    accounting upper-bounds the only measurements that exist under either reading of the
    MB column. Composing this moves H-SEMBIN-97ea23 (three claims, each with a numeric
    falsification criterion) and decides whether COST-SEMBIN-e9960c supersedes
    COST-SEMBIN-8d123b's crossover table. That is claim-changing under AGENTS.md
    "Review architecture" and runs under this plan. It is NOT a breakthrough claim: no
    exponent moves, no curve is spoken about, no published result is contradicted;
    review-adversarial at xhigh is the tier, and the contract's own claim tier
    (`crypto`, derivation) is a property the reviewer is asked to check rather than a
    reason to escalate.

  claim_under_review: >-
    As the producer stated it (manifest validity_note and implementation.md):
    "completed_valid as a MEASUREMENT of two heuristic cost models: every arm terminal,
    ARM R gate passed, ARM N UNREACHED with a recorded impediment. No statement about
    any curve's security." Specifically, against H-SEMBIN-97ea23: (C1) charging vOW at
    the minimum of its own T x Mem curve moves the memory-charged crossover from 435 /
    375 (dense / sparse, record point M = 1, w = 2^30) to 520 / 460, a shift of +85 in
    n and -29.0 bits at n = 409, and neither coherent crossover is at or below 409;
    (C2) over the parent's declared store values {30, 40, 48, 60} the crossover ranges
    96 in n for the sparse reading against 72 over the parent's metric set, so the
    store is the larger undeclared parameter -- while for the dense reading the same
    pair is 93 against 132; (C3) under a HARD memory budget the dense and sparse
    readings agree at n = 409 for every budget below 2^65.33 and above 2^80.07 bits and
    disagree only inside that band; under the SOFT budget reading the band is
    2^28.59-2^47.95, inside physically realisable budgets. Plus: C3 informative null
    decomposes the 132-in-n shift as 219 (Semaev's memory) - 87 (baseline's 2^30 store)
    with the zero-memory comparator DEGENERATE; C4 free-yield passes with a refined
    criterion introduced between attempts 2 and 3; C10 sparse accountings upper-bound
    the 33 measured rows under MB reading B only, dense accountings under neither; the
    surface is 254,016 cells with 1,556,684 collision pairs; determinism holds.

  coordinator_prior:
    quoted_from_contract_before_run: >-
      EXP-SEMBIN-2c40bb preregistered_prediction.coordinator_prior, written before
      execution: "The Coordinator EXPECTS all three of H-SEMBIN-97ea23's claims to hold,
      because each is already computed once by the red team from an independent
      reimplementation, and expects the interesting failure to be elsewhere: in ARM N,
      the prime-field control ... the honest outcome may be a documented impediment
      rather than a passing control. Second expectation, weaker: that ARM I will AGREE
      ... a second implementation of the same formula raises confidence in the
      arithmetic and not in the model. If a reviewer says ARM I is theatre for that
      reason, the Coordinator will agree. Third: the Coordinator expects ARM F's
      disagreement band to come out NARROWER than the red team's 2^65 to 2^89."
    scored_against_the_run_by_the_coordinator_before_review: >-
      ARM N came back UNREACHED with a documented impediment (first expectation
      confirmed by the producer's own account; the reviewer checks whether the
      impediment is real, joint M5). ARM I agreed to 2.8e-14 bits with blindness broken
      (second expectation confirmed and its "theatre" caveat now applies with more
      force). ARM F's hard band is 65.33-80.07, narrower than 65-89 at the top (third
      expectation confirmed). All three of H-SEMBIN-97ea23's claims are reported as
      holding UNDER THE SPARSE READING AND THE HARD BUDGET; the contract's own
      falsification wording scopes C2 to the sparse reading and C3 to the hard budget,
      so the producer is entitled to score them held -- and that scoping is exactly
      what this round must attack.
    on_M1_gate_and_surface_arithmetic:
      expectation: >-
        I EXPECT M1 TO HOLD. Four implementations (parent, red team, validator da3982,
        this run) now agree at the (30, 1, 1) slice to 4.8e-5 bits, which is the
        printing precision of the compared records and not a residual to explain. I
        expect the coherent-baseline crossovers 520 / 460 and the 29.0-bit excess to
        re-derive from T = W(1/M + 1/w), Mem = 3n max(w, M) exactly as REVIEW-251fd3
        found (6nW on the ray w = M; 2^30 / 2 = 2^29 at the record point) and the
        Semaev side to re-derive from Table 3's stage-1 formula with the parent's
        truncation convention. I expect the collision-pair count (1,556,684) to be
        reproducible but UNINFORMATIVE: two of the three baseline modes ignore
        store_log2 by construction, so most collisions are labelled axes that do not
        act, not two mechanisms reaching one number.
      what_would_change_my_mind: >-
        A recomputed cell off by more than 1e-3 bits; a coherent crossover that does
        not re-derive; a collision pair whose two cells differ in an axis that DOES act
        and still agree, which would be the interesting kind.
    on_M2_the_store_versus_metric_claim:
      expectation: >-
        I EXPECT M2 TO HOLD FOR THE SPARSE READING AND TO SHOW THAT C2 AS WORDED IS
        READING-DEPENDENT AND METRIC-SET-DEPENDENT. The dense reading gives store 93
        against metric 132, the opposite ordering; and against the FULL metric set the
        sparse reading gives 96 against 103, again the opposite ordering. The
        hypothesis's C2 says "the store is the larger parameter"; the run says it is
        larger for one of two storage readings against one of two metric sets. I expect
        the reviewer to find that the contract's falsification criterion was written
        for the sparse reading only and therefore does not fire, and to say plainly
        that a claim which survives by the choice of reading and metric set is weaker
        than its wording. WHERE I THINK IT BREAKS: "range over the store grid" is a
        range of PERSISTENT crossovers, and the persistent crossover is pinned by the
        ceil(n/m) saw-tooth at the last sign change (implementation.md); the range may
        be moved by several units of n by the choice of persistent versus first
        crossing. I expect this to move ranges by < 10 and not to flip either ordering.
      what_would_change_my_mind: >-
        A first-crossing range that flips the sparse ordering; or an argument that the
        parent metric set is the wrong comparator and the full set is the right one, in
        which case C2 fails for both readings.
    on_M3_controls_and_the_moved_criterion:
      expectation: >-
        I EXPECT C3 AND C4 TO HOLD AND C10 TO BE THE FINDING. C3: the 219 / -87 / 132
        decomposition is arithmetic and the DEGENERATE labelling is the correction
        EV-SEMBIN-71e5cd O-10 demanded; I expect it to reproduce. C4: the criterion was
        REFINED BETWEEN ATTEMPTS 2 AND 3 to exclude cells pinned at the domain floor
        n = 3 and to classify hard-budget stage1_argmin cells as "m_selection
        interactions". That is a control criterion moved after the control was run
        once, which is the pattern that turns a control into a confirmation; I expect
        the reviewer to check whether attempt 2's eight "failures" are genuinely
        floor-pinned (crossover already at n = 3 cannot move down) and whether the
        m_selection interactions are genuinely infeasibility, not sign inversions. I
        expect both to be legitimate and the refinement to be disclosed correctly, and
        I want that checked rather than trusted. C10: under MB reading A (per-system
        peak) no accounting upper-bounds every row and under reading B (total over 100
        systems) only the two sparse accountings do. The contract's failure_meaning
        says "if NO accounting upper-bounds under EITHER reading, the memory model is
        wrong on the only data that exists"; that did not fire, but the dense readings
        -- which carry the parent's n = 409 verdict -- are below the measurements under
        both readings of the column, and the dense-minus-sparse gap widens from 6.5-9.7
        bits at N ~ 50 to 20-21 bits at the labels. I expect the reviewer to report
        what C10 says about the DENSE reading specifically.
      what_would_change_my_mind: >-
        An attempt-2 C4 failure that is not floor-pinned; a decomposition that does not
        sum; a C10 residual table that does not match measurement-comparison.json.
    on_M4_the_budget_bands_and_alpha:
      expectation: >-
        I EXPECT THE HARD BAND TO HOLD AND THE SOFT BAND TO BE THE CAVEAT C3 NEEDS. The
        hard band 65.33-80.07 re-derives (I expect) from Semaev's cheapest memory over
        m (62.31 bits at m = 4 sparse) and the dense/sparse crossings of the budget
        line; C3 as worded ("hard memory budget below 2^65") holds with 0.33 bits to
        spare, which is a knife-edge and should be reported as one. The SOFT band
        28.59-47.95 is inside physically realisable budgets and the hypothesis is silent
        on it; I expect the reviewer to say whether "soft" (a penalty rather than a
        wall) is a defensible budget semantics and, if it is, that C3's "confined to a
        band above four exabytes" is true of one budget semantics and false of the
        other. Alpha flips: dense at 0.811 exactly as predicted; sparse at 1.44 -- i.e.
        outside [0, 1], matching the prediction "none in 0 to 1".
      what_would_change_my_mind: >-
        A hard-band boundary that moves by > 1 bit under the reviewer's own
        recomputation; a soft-budget definition the reviewer shows is not a budget at
        all.
    on_M5_unreached_arm_n_and_arm_i_independence:
      expectation: >-
        I EXPECT THE UNREACHED TO BE LEGITIMATE AND ARM I TO BE DISCOUNTED. ARM N:
        EXP-ICEX-c32447 defines its counters as measured quantities with no closed form
        and has no runs; charging a model that does not exist would be a fabricated
        comparator, and the stopping rule forbade substituting the red team's
        same-family PFDR object. I expect the reviewer to confirm the four missing
        pieces are real and that the producer did NOT substitute -- and to say what
        would make C6 reachable (a closed-form prime-field IC model with a memory term,
        which is a design task, not a run). C6 UNREACHED means EVERY row of this run and
        of RUN-SEMBIN-121b59 carries the parent's unrun control forward; the evidence
        record must say so. ARM I: PD-I discloses the producer read the parent's
        implementation before writing the "independent" one; agreement to 2.8e-14 bits
        is then float-versus-exact-integer agreement of one formula, not a second
        derivation. I expect the reviewer to re-derive the sparse working set from
        KN-LIT-e77232's statement at n = 571 (2^46.38 columns, 2^23.89 nonzeros, 2^70.3
        total) with its own arithmetic, which would supply the independence the run
        could not.
      what_would_change_my_mind: >-
        A closed form in EXP-ICEX-c32447 the producer missed; or a re-derivation of the
        sparse term that disagrees with both implementations.
    what_i_expect_the_composition_to_be: >-
      H-SEMBIN-97ea23 SUPPORTED IN SCOPE for C1 (the coherent baseline moves the
      crossover +85 with 29.0 bits, both coherent crossovers above 409); C2 and C3
      SUPPORTED AS WORDED and WEAKENED AS MEANT (reading- and metric-set-dependent;
      hard-budget-only); COST-SEMBIN-e9960c superseding COST-SEMBIN-8d123b's table as
      a surface with the same arithmetic. I expect the honest headline to be C10's:
      the dense reading, on which the parent's n = 409 verdict and the whole
      "indeterminacy" rest, upper-bounds none of the only 33 measurements that exist.
      This prior is written down so that a reviewer who confirms it is recorded as
      confirming it, and one who overturns it is recorded as such.

  joints:
    - joint: >-
        M1 -- REPRODUCTION GATE AND SURFACE ARITHMETIC. That ARM R returns the parent's
        four crossovers and three margins; that the coherent-baseline crossovers and
        the 29.0-bit excess re-derive from HEUR-VOW-CURVE's statement; that a sample of
        surface cells recomputes from the column definitions; that the collision-pair
        count is reproducible and its composition is stated.
      assigned_to: TASK-20260913-67ab4f
      attack_plan: >-
        (1) From H-SEMBIN-97ea23's HEUR-VOW-CURVE statement (T = W(1/M + 1/w), Mem = 3n
        max(w, M), W = 0.886 x 2^{n/2}) and Semaev's stage-1 formula as Table 3 states
        it (inputs/SEMAEV-2015-310/tables.yaml, with the parent's truncation
        convention), code the two sides yourself BEFORE opening code/surface_cost.py;
        evaluate the time-only and product crossovers at the record point (M = 1,
        w = 2^30) and at the own-curve minimum (w = M) under dense_row_echelon and
        semaev_sparse; compare to 303 / 303 / 435 / 375 and 520 / 460; compute the
        excess of the record charge over 6nW at the five labels. (2) Recompute 12
        surface cells you choose across metrics, store values, kappa and cofactor from
        raw-result.json's per-cell record and the column definitions; report the worst
        disagreement in bits. (3) Reproduce the 1,556,684 collision-pair count from
        surface.json and classify a sample of 20 pairs: how many are two cells that
        differ only in an axis the baseline mode ignores (store_log2 under
        own_curve_product_minimum / sect113r2_calibrated_ratio), how many are the
        ceil(n/m) saw-tooth, how many are genuinely two mechanisms. (4) Check the
        determinism claim by hashing the two executions' JSON yourself.
      breaking_artifact: >-
        A gate figure that does not reproduce to 1e-3 bits; a coherent crossover or
        excess that does not re-derive; a surface cell off by > 1e-3 bits; a collision
        count that does not reproduce.
      holding_artifact: >-
        Your own two-sided code, the gate and coherent figures side by side, the 12-cell
        table, the collision classification, and the two execution hashes.
    - joint: >-
        M2 -- THE STORE-VERSUS-METRIC RANGE CLAIM (H-SEMBIN-97ea23 C2). That the ranges
        (sparse: store 96 vs parent metric set 72 vs full set 103; dense: 93 vs 132 vs
        162) are what the surface says; that "range" is stated with its crossover
        definition; and that C2's truth value is reported per (storage reading, metric
        set) rather than as one word.
      assigned_to: TASK-20260913-67ab4f
      attack_plan: >-
        (1) From surface.json, recompute the crossover range over store_log2 in {30,
        40, 48, 60} at (processors = 1, kappa = 1, h = 1, record_point_M1_w30,
        unceiled k, stage1_argmin) under time_memory_product, and the range over the
        parent's metric set at store 30, for all four storage readings; do it for BOTH
        persistent_crossover_n and first_crossing_n and report both. (2) State which
        metric set the hypothesis's C2 names ("its range over the metric set") and
        whether the parent contract's metric set or this contract's full set is the
        comparator the wording implies; report C2's truth value under each of the four
        (reading, set) combinations. (3) Report whether the contract's falsification
        criterion ("for the sparse reading") is satisfied, and separately whether the
        hypothesis's statement ("the store is the larger parameter") is true without
        the qualifier. Do not adjudicate which reading is right; that is C10's data
        (M3).
      breaking_artifact: >-
        A range that does not reproduce; a first-crossing range that flips the sparse
        ordering; a reading of the wording under which C2 fails for the sparse reading
        too.
      holding_artifact: >-
        A 4 x 2 x 2 table (reading x crossover definition x metric set) of ranges with
        C2's truth value in each cell and one sentence on the wording.
    - joint: >-
        M3 -- CONTROLS C3, C4, C10 AND THE CRITERION MOVED BETWEEN ATTEMPTS. That the
        informative-null decomposition sums and its degeneracy is labelled; that C4's
        refined criterion is a legitimate correction of a mis-scored control and not a
        criterion moved to pass; that C10's residuals are what measurement-comparison.json
        says and that what they say about the DENSE reading is stated.
      assigned_to: TASK-20260913-67ab4f
      attack_plan: >-
        (1) C3: recompute the three-step decomposition (time_only -> informative null
        3n-bit baseline -> record 2^30 store) at n = 409 and in crossover n for dense
        and sparse; confirm 219 / -87 / 132 and -76.58 / +30.0 bits; confirm the
        zero-memory comparator is reported DEGENERATE under the multiplicative metrics
        and numerically under the budget metrics with that note. (2) C4: from
        stdout.log (attempt 2's C4 block is retained) list the eight cells attempt 2
        scored as failures; for each, recompute the with-factor and free-yield
        crossovers yourself and say whether the crossover was already at the domain
        floor n = 3 (cannot move down) or genuinely failed to move down; for the
        m_selection interactions, verify that deleting log2(m!) moves the stage-1
        argmin to m = 30 and that m = 30 is infeasible under the hard budget at 2^70
        (working set exceeds budget) rather than more expensive. State whether the
        refinement is a correction or a criterion moved. (3) C10: recompute the
        per-row residuals for at least 8 of the 33 rows from tables.yaml under both MB
        readings and all four accountings; confirm the upper-bound verdicts; report the
        dense-minus-sparse gap at N ~ 50 and at n = 409 / 571; state in one sentence
        what the data says about the dense reading and whether the contract's
        failure_meaning fired.
      breaking_artifact: >-
        A decomposition that does not sum; an attempt-2 C4 failure that was not
        floor-pinned and is now hidden by the refinement; a C10 residual that does not
        match; a dense accounting that does upper-bound the rows after all.
      holding_artifact: >-
        The decomposition table, the eight-cell C4 table with your verdict per cell, the
        residual sample and the dense-reading sentence.
    - joint: >-
        M4 -- BUDGET BANDS AND ALPHA FLIPS (H-SEMBIN-97ea23 C3). That the hard band
        65.33-80.07 and the soft band 28.59-47.95 at n = 409 re-derive from Semaev's
        cheapest memory over m and the two readings' budget crossings; that C3 holds
        under the hard semantics by 0.33 bits and does not hold under the soft; that
        the alpha flips 0.811 (dense) and 1.44 (sparse) re-derive.
      assigned_to: TASK-20260913-67ab4f
      attack_plan: >-
        (1) From the memory formulas (dense: relation store + Macaulay width^2 at
        degree 4; sparse: relation store + (nm)^4/24 columns at n^3/m nonzeros) compute
        Semaev's cheapest memory over m in [2, 30] at n = 409 under both readings and
        the m attaining it; compare to 62.31 bits at m = 4 (sparse). (2) Under the hard
        budget (the baseline shrinks w = M to fit; Semaev infeasible where every m
        exceeds the budget) find the budget at which each reading's verdict at n = 409
        flips; compare to 65.33 and 80.07 and state which reading turns first. (3)
        State what the soft budget semantics is (from the code or the arm JSON), whether
        it is a budget in any operational sense, and recompute its band. (4) Recompute
        the alpha at which T x M^alpha flips at n = 409 under each reading. (5) Report
        C3's truth value under hard and under soft semantics separately, with the
        0.33-bit margin named.
      breaking_artifact: >-
        A band boundary off by > 1 bit; a cheapest-m that differs; an alpha flip off by
        > 0.01; a soft semantics that is not a budget.
      holding_artifact: >-
        Your recomputed bands and flips beside the run's, and the two C3 verdicts.
    - joint: >-
        M5 -- THE UNREACHED PRIME-FIELD CONTROL AND ARM I'S INDEPENDENCE. That ARM N's
        four missing pieces are real and no same-family object was substituted; that
        the consequence (C6 unrun for this run AND its parent) is stated; that the
        sparse working set re-derives from KN-LIT-e77232's statement independently of
        both existing implementations.
      assigned_to: TASK-20260913-67ab4f
      attack_plan: >-
        (1) Read experiments/EXP-ICEX-c32447/specification.yaml yourself and say, for
        each of the four pieces arm-n-prime-field-control.json names as missing,
        whether the specification states a closed form the producer missed; report any
        closed-form term it DOES state and whether it carries a memory term. (2)
        Confirm from controls.json and the surface that no PFDR or other prime-field
        object was charged and labelled as C6. (3) State in one sentence what a
        reachable C6 would need (a designed closed-form prime-field IC cost model with a
        memory term and a multi-target rho baseline) and that it is a design task. (4)
        BEFORE opening code/sparse_independent.py or the parent's memory_charged_cost.py,
        re-derive from knowledge/literature/KN-LIT-e77232.md's statement the sparse
        working set at n = 571, m = 12: columns (nm)^4/24, nonzeros per row n^3/m, and
        the total; compare to 2^46.38 / 2^23.89 / 2^70.3 and to the run's
        samples_at_fips_n; report the disagreement in bits. Then read both
        implementations and say whether PD-I's disclosure is accurate.
      breaking_artifact: >-
        A closed form in ICEX the producer missed; a substituted object; a sparse term
        that disagrees with both implementations.
      holding_artifact: >-
        The four-piece table with your verdict per piece, the one-sentence reachability
        statement, and your sparse re-derivation beside both implementations.

  every_joint_has_exactly_one_owner: true
  owners:
    TASK-20260913-67ab4f: [M1, M2, M3, M4, M5, proves_too_much]

  blindness:
    within_round: true
    mutual: true
    statement: >-
      One reviewer session. There is no sibling reviewer in this round to be blind to;
      the blindness that binds is (a) the reviewer does not read this round's bus
      traffic or any Coordinator note written after this plan, (b) it performs the
      re-derivations in M1(1), M4(1) and M5(4) BEFORE opening the named code files and
      attests to the order, and (c) it does not read REVIEW-SEMBIN-20260913-251fd3's
      reviewer directories, whose own_vow.py derivations would pre-empt M1(1). The
      Coordinator that wrote this plan will compose the round and is not blind.
    lifted_for: []
    lifted_for_rationale: Nothing lifted.
    what_reviewers_may_read: >-
      experiments/EXP-SEMBIN-2c40bb/ (all), experiments/EXP-SEMBIN-f4a17b/ (the parent
      record and code, AFTER M1(1) is done), experiments/EXP-ICEX-c32447/specification.yaml,
      ledger/, knowledge/, inputs/SEMAEV-2015-310/, coordination/review/sembin-20260913-9d649f/
      (the parent round's reports, which this run consumed as inputs), this plan, the
      snapshot receipt. NOT coordination/review/sembin-20260913-251fd3/TASK-*/.
    a_disclosure_this_plan_makes_deliberately: >-
      This plan says where the Coordinator thinks the claims are weakest (C2's reading-
      and metric-set-dependence; C3's soft band; C10's dense reading). The reviewer will
      read it and may anchor. The cost is accepted for the reason the architecture
      gives: an unworked attack plan returns an opinion. Each joint asks for a
      recomputation whose result does not depend on the reviewer's opinion of the
      prior, and a reviewer who finds C2 robust across readings or the soft semantics
      not a budget overturns the prior, which is recorded above as a live possibility.

  proves_too_much:
    required: true
    objects:
      - owner: TASK-20260913-67ab4f
        object: >-
          The surface machinery under the TIME-ONLY metric across every
          baseline_charging_mode and every store_log2, at kappa = 1, h = 1, processors
          = 1, both storage readings. Under time_only the baseline's cost is W(1/M + 1/w)
          with M = 1, so the crossover must be INDEPENDENT of store_log2 and of the
          storage reading, and must move by exactly the one bit implementation.md
          discloses (w = M = 1 instead of w = 2^30) between record_point and own_curve
          modes, i.e. the time-only crossover 303 must be the same at every store value
          and reading and at most one or two units of n different across modes.
        why_this_object: >-
          The hypothesis's claim is that the memory-charged verdict moves with the
          baseline's operating point and with the store. An argument that finds the
          verdict moving with the store or the storage reading where memory is NOT
          CHARGED has found an artifact of the machinery, not a property of the
          comparison -- the same machinery then cannot be trusted where memory is
          charged.
      - owner: TASK-20260913-67ab4f
        object: >-
          The known-false object C4 (free yield) re-run by the reviewer at the coherent
          baseline mode (own_curve_product_minimum) rather than at the record point,
          under both storage readings and both m_selection conventions: deleting
          log2(m!) + (n - mk) must move every crossover DOWN or pin it at the floor.
        why_this_object: >-
          The producer ran C4 at the record point and refined its criterion after one
          execution. Running the same known-false object at the coherent point, where
          the producer did not tune, tests whether the sign convention holds where the
          criterion was never adjusted.
    failure_signature: >-
      A time-only crossover that differs across store_log2 or storage reading at fixed
      mode by more than the ceil(n/m) saw-tooth can explain (> 2 units of n); or a
      free-yield cell at the coherent mode whose crossover moves UP or whose n = 409
      margin moves against Semaev.
