  id: REVIEW-SEMBIN-20260913-2c40bb
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-9d649f
  reviews: RUN-SEMBIN-3ae91c (EXP-SEMBIN-2c40bb, H-SEMBIN-97ea23), snapshot TASK-20260913-a10005 at be240e540
  written_by: coordinator
  written_at: '2026-09-14'
  written_before_any_reviewer_ran: true
  written_before_any_reviewer_ran_evidence: >-
    TASK-20260913-67ab4f is `queued` with no lane claim at the moment this file is
    written (dispatch plan rendered 2026-09-14 after TASK-20260913-c81e44 completed;
    67ab4f is the sole Ready Task). The run package is snapshot-archived in be240e540
    (TASK-20260913-a10005, content-first, 8 path hashes). WHAT THE COORDINATOR HAS READ,
