  # (c) ------------------------------------------------------------------------
  pinned_parameters:
    Q3_m_set:
      statement: every integer m in 2..30 (the frozen instrument's m grid)
      v2_location: specification.yaml definitions.d_star_of_m.m_set, line 402; restated at independent_variables, line 905
      note: >-
        The same set blind-inputs.yaml Q3 uses when none is pinned. Each m is evaluated on its own, with no
        minimisation over m (definitions.d_star_of_m.definition, line 408).
    Q3_omega_set:
      statement: >-
        omega = 3 only. The contract writes it as a one-element set, calls it "the only scored omega", and says
        no other omega enters the definition.
      v2_location: definitions.d_star_of_m.omega_set, line 403; independent_variables, lines 898-902; worksheet D-6, lines 224-228
      not_pinned: >-
        The contract also reports two further in-domain exponents and one out-of-domain exponent in flagged
        UNSCORED blocks that enter no prediction, class or threshold (lines 899-902, 931). They are not pinned.
      with_PIN-OMEGA: Q3 is evaluated at PIN-OMEGA's exponent read from the paper and at omega = 3; report each value with its omega.
    Q2_k_readings:
      statement: No change. KR-A and KR-B stand exactly as blind-inputs.yaml PIN-K-READING defines them.
      basis: >-
        The contract's numbered model-identification choice MI-1 (definitions.model_identification_choices,
        lines 277-302) selects one of these two labelled readings, and the contract reports the other beside
        every per-m threshold as a non-gating column (lines 419-422). Neither is a third reading, so no rule
        needs restating. Which label the contract gates on is deliberately not stated here (PIN-K-READING).

  # (d) ------------------------------------------------------------------------
  degree_extension_statement:
    finding: >-
      The version-2 contract
      freezes no D*(m) value.
    how_verified: >-
      From the contract, not from the producer's report. definitions.d_star_of_m.frozen_values (lines 429-433)
      states that no threshold value of either kind is frozen and that every threshold is computed only in
      Stage 6, after the gates. A regex for numerals attached to a threshold token over the contract, the
      hypothesis and the design directory found only: a lower-edge reporting token (line 367); the convention of
      reporting the margin one degree below the threshold (lines 365, 417, 761, 918, 1005); the pre-registered
      prediction band and the proposal band it quotes (lines 959, 974; hypothesis lines 56, 384, 552, 800);
      outcome-class boundaries and the no-crossing token (lines 1068-1074; hypothesis lines 386, 802); the scored
      exponent written as a threshold argument (for example lines 761, 906, 920); and a defect label beside a
      threshold token (audit sheet line 543). None is a computed or frozen threshold.
    consequence: Q3 is a record, not a comparison (blind-inputs.yaml Q3, if_no_threshold_is_frozen).
    model: >-
      Every threshold in the contract lives in its restricted model (definitions.restricted_model, lines 371-379):
      stage 1 = A(n, m) + S_R(n, D, omega), S_R one of R-B and R-M, dense linear algebra at one fixed omega at
      every D, and Semaev's block size n at every D.
    A_symbol: >-
      A(n, m) is the contract's name for stage 1 with the per-solve cost set to zero (definitions.A, lines
      322-326). Its formula and call path are not transcribed; the blind card derives stage 1 from the paper under
      PIN-K-READING, PIN-STAGE and PIN-COFACTOR-AND-CHARGE. rho(c) below is the Q1 quantity of row c.
    R-B:
      location: definitions.reading_R_B, lines 336-339
      statement: >-
        C_B(n, D, omega) = min over m of A(n, m) + D omega log2 n. Semaev's block-structured per-solve cost
        n^(4 omega) with the degree bound 4 of Assumption 1 replaced by D. PRIMARY reading.
      note: The contract identifies R-B with Semaev's block-size-n estimate with 4 replaced by D (line 427), the reading PIN-SOLVE-COST calls BS-n.
    R-M:
      location: definitions.reading_R_M, lines 340-343; W at definitions.W, lines 327-329; C_I at line 335
      statement: >-
        C_M(n, D, omega) = min over m of A(n, m) + omega (W(n, D) - W(n, 4) + 4 log2 n). The degree-D Macaulay
        width of an n-variable block, normalised so that C_M(n, 4, omega) = C_I(n, omega) exactly. SECONDARY
        reading. W(n, D) = log2 of the sum over d = 0..D of binom(n, d) [call name omitted]. C_I(n, omega) =
        min over m of A(n, m) + 4 omega log2 n [the instrument call path of lines 330-334 omitted].
      note: Specific to this contract (line 428); it is the reading Q3 calls "any reading the forward amendment transcribes".
    threshold_at_each_m:
      location: definitions.d_star_of_m.definition, lines 405-414
      substitutions: >-
        Four, each marked [..]: the scored exponent; the contract's k-reading choice; the degree range, in words;
        and the reporting tokens, by description.
      statement: >-
        For c in {K-571, B-571}, R in {R-B, R-M}, omega [in the pinned omega-set] and each m in the M-SET:
        C_R(571, D, omega; m) = A(571, m) + S_R(571, D, omega), with A(571, m) [under the contract's numbered
        k-reading choice] and no minimisation over m. The threshold of R at m is the least integer D
        [from two to sixty-four inclusive] with C_R(571, D, omega; m) - rho(c) > 0, with [the contract's tokens
        for no crossing in that range and for a crossing at its lower edge]. Under R-B the margin is linear in D
        and a real-valued threshold (rho(c) - A(571, m)) / (omega log2 571) is reported beside the integer one;
        R-M is defined at integer D only and has no real form.
      correspondence_paraphrase: >-
        Lines 423-428, in words: where the margin at degree four is negative and no margin is exactly zero, this
        threshold equals the least integer D of at least four with C_R at least rho(c) (blind Q3's integer
        definition); where the margin at degree four is already positive, blind Q3 gives four while the contract
        gives the least qualifying D counted from two. No quantity is added to Q3.

  # (e) ------------------------------------------------------------------------
  attestation:
    definitions_are_value_free: true
    values_restated: none; no matched text quoted; no frozen value, argmin, threshold or rho figure written
    search_term_self_check:
      method: >-
        After the file was complete, this session ran Grep over this file with (i) a literal alternation of all
        367 entries of whitelist-grep-v2.yaml search_terms, points and carets escaped; (ii) superset patterns that
        every one of those terms matches: a digit, a point and two digits; a two followed by a caret; a digit, an
        e, an optional sign and a digit; (iii) the minimising-m forms (m, equals, digit; an m-star token; the
        optimising-m phrase) and any physical line holding both a threshold token and a digit.
      result: >-
        Zero matches for each of (i), (ii) and (iii). The literal alternation ran as three Grep calls over 167,
        155 and 45 terms, together all 367 in list order, with no digit-boundary guards, which is stricter than
        the dispatcher's guarded search. All checks were re-run on the final text of this file, including this
        entry, with zero matches again.
      contains_none_of_the_search_terms: true
