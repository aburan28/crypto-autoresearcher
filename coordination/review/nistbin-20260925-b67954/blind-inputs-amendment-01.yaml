  # (a) ------------------------------------------------------------------------
  hit_classification:
    counts: {IDENTIFIER-FALSE-POSITIVE: 11, COINCIDENTAL: 2, PRIMARY-DATUM: 0, ANSWER: 0}
    identifier_hits_note: >-
      Eleven hits are one scientific-notation search term that is in fact the six-hex id token of the SEMBIN
