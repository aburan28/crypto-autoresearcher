      the same six digests in its path_sha256; a mismatch is a custody failure
      and voids the composition.
    keys:
      K-approve: >-
        J1 to J8 hold; J3 reports the fixture passing as frozen; J8 reports no
        breaking UNOWNED item; J9 agrees with v2 on every Q1, Q2 and Q3 value
        within tolerance under v2's numbered readings, and every undetermined
        choice J9 reports that changes a value is one v2 declares as a numbered
        model-identification choice with its consequence disclosed (the
        DEC-20260924-124667 R-J5 lesson); every PTM meets its failure signature;
        no tripwire fired. DEC-20260925-41f6dc then approves "EXP-NISTBIN-451dfa
        version 2" under the AGENTS.md standing user authorization and names as
        its first next action the opening of an execution batch whose executor
        card is minted then. Approval asserts nothing about the 571 cell, the
        true solving degree, or any curve.
      K-revise-defect: >-
        Any of J1 to J8 breaks (including a J7 regression or a breaking J8
        UNOWNED item), or v2 omits a field approval requires. Decision revise,
        listing each defect with its joint and breaking artifact, and naming a
        revision design card in a new batch as the first next action. No run.
      K-fixture: >-
        J3 reports the fixture failing as frozen, or J9's Q2 under v2's numbered
        reading disagrees with the frozen target beyond tolerance. Revise on C2.
        Per DEC-20260924-99ce20 S1, the illustrative D* is withdrawn and only the
        exact model is used in the revision.
      K-indeterminate: >-
        J9 reports an undetermined choice that changes Q1, Q2 or Q3 beyond
        tolerance and that v2 does NOT declare as a numbered choice with its
        consequence; or J1/J3 and J9 disagree on a value under the same reading.
        Revise on C1 or C2 (or C3 for Q3), naming both implementations; the
        composer prefers neither. As in R-J5, a divergence J9 reports only
        between readings that v2 has declared and disclosed does NOT fire this
        key.
      K-leak: >-
        J9 reports a BL-4 leak or an exposure, or whitelist-grep-v2.yaml shows a
        retained hit. The affected J9 values are admitted only as attested-blind
        or set aside (DEC-20260924-124667 R-LEAK precedent), and the keys are
        applied with them set aside; if approval would depend on them, no
        approval: replicate J9 under a corrected whitelist.
      K-duplicate: >-
        The producer or a reviewer reports under C4 that a D_solve sensitivity
        surface exists or is in flight on GOAL-SEMBIN-fcb7a2. Revise; lane A is
        withdrawn with a bus pointer to that lane, and HOLD-A takes the slot at
        the next selection point.
      K-impediment: >-
        A card could not be served at review-breakthrough at max (TA-4). It is
        not dispatched; the impediment is recorded on the active goal; the claim
        stays un-promoted; no composition until every card is served. Never a
        downgrade and never evidence.
      K-infra: >-
        A reviewer could not run a joint (tool absent, environment failure,
        watchdog). That joint reads inconclusive. No approval while any joint is
        inconclusive; the decision is revise or replicate the review. An
        infrastructure failure is never negative evidence about the contract's
        mathematics or any curve.
