  proves_too_much:
    assigned_to: TASK-20260925-8e9c3e
    objects:
      - id: PTM-A
        object: K-283 and B-283 at D_solve = 4 under v2's reconciled surface, its numbered k reading and the corrected rho column.
        known_truth: In the exact model EXP-SEMBIN-992e73 evaluates, 283 loses to rho at D = 4; confirm at source (RESULTS.md) before relying on it.
      - id: PTM-B
        object: FIPS 163 and 233 and one Certicom degree declared before evaluation in a hashed file, at D_solve = 4.
        known_truth: Each loses to rho in the exact model at D = 4 (confirm at source).
      - id: PTM-C
        object: The 409 row read against the naive 2^(n/2) column.
        known_truth: Under H-SEMBIN-97ea23's coherent baseline 409 is not a live cell; a rule that admits the naive column resurrects it.
      - id: PTM-C-SLICE
        object: >-
          Three mis-sliced imports of the coherent row fed to BR-1: cofactor-charged
          instead of cofactor-1; label-separated instead of label-unseparated; and
          time-only (no storage reading).
        known_truth: None is the row H-SEMBIN-97ea23 records; importing any of them misstates the baseline (D-2).
      - id: PTM-D
        object: A D_solve input taken from a fake first-fall degree reading (witness A, as substituted in the prior round, PD-C3), fed as if true.
        known_truth: The fake degree may not be cited as bounding the true one (KN-FIND-936151).
      - id: PTM-E
        object: >-
          G4 at the least convenient known-truth Certicom degree, chosen by the
          red team by a rule declared in a hashed file before evaluation (the
          Certicom binary degree with the smallest recorded rho-wins margin at
          D = 4 in the exact model, confirmed at source), evaluated at every omega
          at which v2 scores D*.
        known_truth: rho wins at that degree at D = 4 in the exact model.
      - id: PTM-F
        object: >-
          A Certicom binary degree that D-1 adds and for which no exact-model
          result is recorded (359 is the candidate, since the upstream degree list
          omitted it; confirm at source), presented to G4 or to claim (A) as a
          known-truth control.
        known_truth: Its class is NOT known from any recorded result; treating it as known certifies a control with no truth behind it.
    failure_signature: >-
      A correct contract keeps each known-false conclusion out of reach IN ITS
      RULES, not only in prose. PTM-A, PTM-B and PTM-E come out rho-wins at
      D = 4 (PTM-E at every scored omega). PTM-C is excluded by the baseline rule
      before any cell is counted. PTM-C-SLICE is refused by C-BR1 before any
      comparison. PTM-D is rejected as an inadmissible input before any D* is
      read. PTM-F is refused as a control and read only through the
      pre-registered UNRESOLVED-row rule. A rule that places 283, 163, 233 or
      the declared Certicom degree below rho at D = 4, counts 409, admits a
      mis-sliced import or a fake degree, or uses an unrecorded degree as a
      known-truth control has proved too much.
    how_to_run_it: >-
      REVIEW COMPUTATIONS: closed-form evaluation of the contract's formulas in
      your own script. They mint no RUN-*, write no evidence record, run no
      Groebner, XL, SAT or F4 solver, instantiate no curve, and never execute an
      EXP-NISTBIN-451dfa or EXP-SEMBIN driver as an experiment. Everything goes
      in computations.json. A PTM that would amount to a new experiment is
      recorded NOT PERFORMED with the reason; a missing object is recorded
      missing, and any substitute is declared before evaluation.

