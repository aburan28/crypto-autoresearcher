      sources.
    files_searched:
      - inputs/SEMAEV-2015-310/ (every file: paper_fulltext.md, paper_fulltext.md.sha256, source_record.yaml, tables.yaml, provenance.json, extract_text.py, eprint-2015-310.pdf.sha256)
      - inputs/FIPS186-4-BINARY-CURVES/ (every file)
      - inputs/CERTICOM-CHALLENGE-2009/ (every file)
      - experiments/EXP-SEMBIN-992e73/specification.yaml
      - AGENTS.md
      - agents/validator.md
      - templates/research-records.md
    not_searched:
