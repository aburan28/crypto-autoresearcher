    Fourteen paths. Everything else in the repository is out of scope,
    including every other file in the three inputs/ directories.

  # ---------------------------------------------------------------------------
  whitelist_value_search:
    performed_by: Coordinator sub-session S2 of TASK-20260925-8ebbf7, 2026-09-25, with the runtime's text-search tool (ripgrep); no shell
    purpose: >-
      The previous round's whitelist contained a primary source that prints the
      paper's own value of the Q2 model at n = 571 and a source record that
      states the optimising m (DEC-20260924-124667 PD-C1). Every file proposed
      for this whitelist, and every other file in the same inputs/ directories,
      was searched before it was listed.
    search_terms_by_reference: >-
      Literal patterns are recorded only in the review plan, which you may not
      read. By reference: ST-1, each Q1 value the previous contract froze, as
      quoted in the previous composing decision, at two to four decimals and in
      2^x form; ST-2, the previous contract's Q2 target and its optimising m;
      ST-3, the co-admissible reading's Q2 value and its m, and the two further
      values the previous round recorded at another omega; ST-4, the n = 571
      entry of the paper's Table 3 in the paper's own scientific notation;
      ST-5, strings such as "m = <integer>", list forms "m = <a>, <b>", "m*",
      "m_star", "optimal m", "optimising m", "optimal value", and any "571"
      within 60 characters of the previous optimising m; ST-6, rho-work
