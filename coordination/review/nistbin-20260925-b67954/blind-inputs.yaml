      Two retained files (the paper and the Certicom text) are protected by
      attested redaction, not by exclusion. The values the version-2 contract
      will freeze are not known yet, so this search cannot cover them; the
      forward precondition does.

  forward_precondition:
    binds: the dispatcher (top-level session), not you
    text: >-
      Before TASK-20260925-a43591 is dispatched, the top-level session greps
      every whitelisted file for each value the version-2 contract freezes for
      Q1, Q2 and Q3 (every decimal it prints at two to four places, 2^x and
      scientific-notation forms, each frozen optimising m in "m = " and list
      forms, and each frozen D*(m) value), and records the command and hits
      (file:line only) in coordination/review/nistbin-20260925-b67954/whitelist-grep-v2.yaml,
      which is blind_from for you. Each hit is removed by the value-free
      additive amendment blind-inputs-amendment-01.yaml (a new redaction or an
      exclusion), or is recorded there as a disclosed leak. The amendment also
      pins the m-set and omega-set of Q3 and transcribes the statement of any
      contract-specific Q3 reading. Both files are committed and pushed before
      dispatch. You may not be dispatched until the grep is recorded.

  # ---------------------------------------------------------------------------
  rules:
    - BL-1 Read ONLY the whitelisted paths, under the redaction rules. Every other path in the repository is out of scope.
    - BL-2 Run no git command that shows history or content of other revisions (log, show, blame, diff, grep over history) and read no pull-request text or commit message.
    - >-
      BL-3 Choose your own libraries and algorithms and name them with versions.
      Do not transcribe a computed cost, rho figure, optimising parameter or
      threshold from any source; compute it. Curve parameters are read from the
      primary text, not recalled.
    - >-
      BL-4 If you find, in a file you were permitted to read, a value that looks
      like an already-computed answer to Q1, Q2 or Q3, stop reading that file and
      report a LEAK with file and line, never the value. Say which quantities you
      had computed and saved before.
    - BL-5 Report on J9 only. Give no verdict on the contract or the hypothesis, which you have not read.
    - >-
      BL-6 ZERO experiment runs. Instantiate no curve, run no rho walk, run no
      Groebner, XL, SAT or F4 solver. This is closed-form arithmetic, including
      order computations on the Frobenius action where you need them.
    - BL-7 Write nothing outside your write directory. Put every script, command and raw output inside computations.json.
    - BL-8 Obey RD-SEM, RD-CERT, RD-SPEC and the exposure_rule; attest each in your report.

  output_schema:
    directory: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/reviews/TASK-20260925-a43591/
    files:
      rederivation-report.yaml: >-
        review_attestation (joint J9, verdict inconclusive by design,
