# =============================================================================
# Blind inputs for TASK-20260925-a43591 (joint J9 of REVIEW-NISTBIN-20260925-b67954).
#
# This file is one of your whitelisted files. It tells you WHAT to compute and
# nothing about how anyone else computed it, or what they found. It contains no
# computed value of any kind: no rho figure, no cost figure, no optimising
# parameter, no threshold. The search record below names files and LINE
# NUMBERS only; the terms it searched for are described by reference, never
# printed. If you ever find a value here, that is a leak: report it (BL-4).
#
# Written 2026-09-25 by Coordinator sub-session S2 of TASK-20260925-8ebbf7,
# before the object under review existed and before any reviewer ran.
# =============================================================================
blind_inputs:
  task_id: TASK-20260925-a43591
  review_plan_id: REVIEW-NISTBIN-20260925-b67954
  joint: J9
  write_directory: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/reviews/TASK-20260925-a43591/

  sources:
    curve_parameters_fips: inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md (custody - fips186-4_text.md.sha256; provenance - source_record.yaml)
    curve_parameters_certicom: inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md (custody - challenge-2009_text.md.sha256), UNDER REDACTION RULE RD-CERT
    index_calculus_model: inputs/SEMAEV-2015-310/paper_fulltext.md (custody - paper_fulltext.md.sha256), UNDER REDACTION RULE RD-SEM
    model_conventions: experiments/EXP-SEMBIN-992e73/specification.yaml, for its stated model conventions only (RD-SPEC)
    forward_amendment: >-
      coordination/review/nistbin-20260925-b67954/blind-inputs-amendment-01.yaml,
      if and only if it exists and is committed when you are launched. It is
      value-free by construction and may add redactions, pin the m-set and
      omega-set, and transcribe the STATEMENT (never a value) of any
      contract-specific degree-extension reading for Q3. If it does not exist,
      you were dispatched against this plan's forward precondition: stop and
      report that as an impediment, not a result.
  source_note: >-
    These files and your own handoff card are your ONLY repository sources. If
    one of them refers to another repository file for a formula, convention or
    parameter, do NOT open that file; record the reference under Q0 and continue
    with what the permitted files state. Published mathematics from outside this
    repository may be used and is cited with provenance (recalled | retrieved).

  what_you_are_testing: >-
    Whether a set of matched-rho figures, one family of index-calculus cost
    figures and their optimising parameter, and a family of degree thresholds
    are determined by primary parameters, a stated convention and a published
    cost model under readings pinned below. You are not asked whether the
    convention or the model is a good one. A second implementation, written by
    someone who shares nothing with you, is compared with yours afterwards by
    the composing Coordinator.

  # ---------------------------------------------------------------------------
  pinned_choices:
    note: >-
      The previous round left some choices open (its composer's PD-C2). They are
      pinned here BY RULE or BY LABEL, never by printing a value you must derive.
      Where a pin below still leaves you a choice, record it under Q0.
    PIN-OMEGA: >-
      For Q2, omega is the linear-algebra exponent at which Semaev 2015 itself
      states its first-stage estimate in closed form: the sentence immediately
      after its equation (15) in Section 4.5.2 (paper_fulltext.md lines
      1086-1091, outside the redacted range). Read the value there. For Q3,
      evaluate at that omega and additionally at every omega the forward
      amendment lists (it lists exponents the contract scores; they are
      parameters, not results). Report every value with the omega used.
    PIN-K-READING: >-
      Evaluate every Q2 and Q3 value under BOTH of these labelled readings of
      the number k of relations collected, and report both. KR-A: k = n/m taken
      as a real number wherever it appears in the first-stage formula. KR-B:
      k = ceil(n/m), the integer the paper defines at the start of Section
      4.5.2. If you find a further admissible reading that changes a value,
      evaluate it too and record it under Q0. You are not told which reading any
      other document uses; the composer matches readings by label.
    PIN-STAGE: >-
      Stage 1 (relation collection, the paper's equation (15)) only, with t = m
      (the probability term P(n, m, m, k) of Section 4.3 as the paper uses it in
      Section 4.5.2). Report the stage-2 figure (equation (16)) separately only
      as a check that stage 1 dominates; it is not a Q value.
    PIN-SOLVE-COST: >-
      For Q2 the per-system solving cost is the paper's block-size-n estimate
      with degree 4 in the exponent (Section 4.5.2, lines 1068-1076). For Q3 two
      degree-generalised readings are pinned, both taken from the paper's text
      with the degree 4 replaced by a solving degree D: BS-n (block size n, as in
      lines 1070-1076) and F4-dense (the default F4 estimate, lines 1067-1068,
      and its degree-dependent form in Section 4.6, lines 1236-1280). Any
      further, contract-specific reading is evaluated only if the forward
      amendment transcribes its statement.
    PIN-M-RANGE: >-
      Minimise over every integer m from 2 to 60 inclusive and report the
      argmin and whether it is interior. Separately report the argmin restricted
      to the m grid that EXP-SEMBIN-992e73's specification declares. Do NOT use
      the paper's asymptotic formula for the optimal m (its equation (17),
      around line 1123) as the optimiser; you may report what it gives as a
      comparison, labelled.
    PIN-COFACTOR-AND-CHARGE: >-
      The cofactor charge, the solving-cost reading, the stage split and the
      unit of cost are as EXP-SEMBIN-992e73's specification declares for the
      paper's own convention. Where that specification does not determine a
      reading, take it from Semaev 2015 as published and record the choice
      under Q0 with the value under each admissible reading.

  # ---------------------------------------------------------------------------
  quantities:
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which your sources, after the pins above, left you a
        choice: a reading of the convention, the value of k, a cost-model
        reading, a unit, a rounding rule, an optimisation range, a reference to
        another file. For each: quote the text (file and line), list the readings
        you consider admissible, and say which quantities below depend on it and
        whether the value changes by more than the tolerance.
      report: A list. An empty list is a result and must be stated as such.
    Q1:
      name: log2 matched rho per row
      rows:
        fips: [K-571, B-571, K-283, B-283]
        certicom: [ECC2-79, ECC2-89, ECC2K-358, ECC2-353]
      definition: >-
        For each row, let r be the prime order of the base point's subgroup and
        h the cofactor, read from the primary text (FIPS 186-4 for the FIPS rows;
        the Certicom challenge document's curve-definition lines for the Certicom
        rows, under RD-CERT). Let k be the order of the Frobenius class map on
        that subgroup: for a curve defined over F_2 and used over F_(2^n), k is
        the order of the 2-power Frobenius endomorphism acting on the subgroup;
        for a curve not defined over a proper subfield, k = 1. Compute log2 of
        sqrt(pi r / (4 k)), the expected number of group operations of Pollard
        rho with the negation map and, where k > 1, the Frobenius class map.
        Derive k yourself and say how you did.
      report: >-
        Per row: the field degree n, r in decimal, its bit length, h, k, how k
        was established, and log2 sqrt(pi r / (4 k)) to at least four decimal
        places.
      tolerance: 0.01 bit; exact on bit length and on k
    Q2:
      name: first-stage index-calculus cost and optimising m at the fixture degree and two further degrees
      degrees: [571, 283, 359]
      definition: >-
        log2 of the stage-1 index-calculus cost for the ECDLP in the prime-order
        subgroup of a curve over F_(2^n), under Semaev 2015's cost model with the
        pins above (PIN-OMEGA, PIN-STAGE, PIN-SOLVE-COST at degree 4,
        PIN-M-RANGE, PIN-COFACTOR-AND-CHARGE), minimised over m, under EACH of
        KR-A and KR-B. At n = 571 say whether the value differs between K-571 and
        B-571 and why; likewise at n = 283 for K-283 and B-283; at n = 359 for
        ECC2K-358 and ECC2-353.
      report: >-
        Per degree and per reading: log2 cost to at least three decimal places;
        the optimising m (both argmins of PIN-M-RANGE); the unit of cost; and the
        formula as you evaluated it, written out. Where Q0 lists a further choice
        that changes a value, the value under each admissible reading.
      tolerance: see the plan's agreement_tolerance, applied by the composer; report your values, not a comparison
    Q3:
      name: degree thresholds D*(m) at n = 571
      definition: >-
        For each 571 row (K-571 and B-571), each m in the m-set, each solving-cost
        reading (BS-n, F4-dense, and any reading the forward amendment
        transcribes), each k reading (KR-A, KR-B) and each omega of PIN-OMEGA,
        let C(D) be log2 of the stage-1 cost at (n = 571, m) with degree D in
        place of 4. D*_int(m) is the least integer D >= 4 with C(D) >= Q1(row);
        D*_real(m) is the real D >= 4 at which C(D) = Q1(row), where the reading
        is continuous in D. If no such D exists up to D = 64, say so. The m-set
        is the one the forward amendment pins; if it pins none, use every
        integer m from 2 to 30.
      report: >-
        A table with one line per (row, m, solving-cost reading, k reading,
        omega): D*_int(m), D*_real(m) to two decimal places, and the Q1 value
        used. Also the minimum over m of D*_int for each (row, reading, omega).
      tolerance: see the plan's agreement_tolerance
      if_no_threshold_is_frozen: >-
        If the forward amendment states that the contract freezes no D*(m)
        value, compute Q3 anyway under BS-n and F4-dense; it is then reported as
        a record, not a comparison.

  # ---------------------------------------------------------------------------
  redaction_rules:
    RD-SEM: >-
      inputs/SEMAEV-2015-310/paper_fulltext.md: do NOT read lines 1131 to 1235
      inclusive (the paragraph that introduces Table 3, its verdict sentences,
      and Table 3 itself, which ends before "4.6 Another assumption" at line
      1236). Read the file only by line ranges, never by a text search whose
      output could display a line in that range. Everything else in the paper
      may be read. This is ATTESTED blindness, not structural: the lines are in
      a file you can open, and your report attests that you did not read them.
    RD-CERT: >-
      inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md: read only the
      curve-definition lines of the four named challenges (field degree,
      reduction polynomial, curve coefficients, seeds, base point, order and
      cofactor). Do NOT read Section 3.4 (lines 1281 to 1407), Section 6.2
      (from line 2022 to the end of that section), or any line or table, in any
      section, that reports an expected, estimated or actual number of
      iterations, operations, steps, machine days or a running time; known
      anchors are the lines ending "of machine days" at 1452, 1490, 1533, 1584,
      1615 and 1645 with the lines immediately before each, and lines 1823-1824.
      Do not search this file for numbers. ATTESTED blindness, as for RD-SEM.
    RD-SPEC: >-
      experiments/EXP-SEMBIN-992e73/specification.yaml: read for its stated
      model conventions (cost reading, cofactor charge, stage split, t range, m
      grid) only. A search of it for the previous round's printed values
      returned no hit; if you nevertheless find a computed rho, cost, optimising
      parameter or threshold value there, BL-4 applies.
    exposure_rule: >-
      If a tool displays to you any line inside a redacted range, stop reading
      that file, record an EXPOSURE with file and line (never the value), say
      which Q values you had already computed and saved before the exposure,
      and continue with the other quantities.

  # ---------------------------------------------------------------------------
  whitelist:
    - coordination/review/nistbin-20260925-b67954/blind-inputs.yaml
    - coordination/review/nistbin-20260925-b67954/blind-inputs-amendment-01.yaml
    - ledger/handoffs/TASK-20260925-a43591.yaml
    - inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md
    - inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md.sha256
    - inputs/FIPS186-4-BINARY-CURVES/source_record.yaml
    - inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md
    - inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md.sha256
    - inputs/SEMAEV-2015-310/paper_fulltext.md
    - inputs/SEMAEV-2015-310/paper_fulltext.md.sha256
    - experiments/EXP-SEMBIN-992e73/specification.yaml
    - AGENTS.md
    - agents/validator.md
    - templates/research-records.md
