      - path: coordination/review/nistbin-20260925-b67954/blind-inputs-amendment-01.yaml
        reason: Does not exist yet. Covered by the forward precondition.
      - path: coordination/review/nistbin-20260925-b67954/blind-inputs.yaml (this file)
        reason: Written value-free by construction; covered by the forward precondition, which greps it too.
    hits:
      - file: inputs/SEMAEV-2015-310/paper_fulltext.md
        lines: '1221 (the n = 571 entry of the first-stage column of Table 3; ST-4); the n = 571 entry of the m column of Table 3, inside lines 1157-1235 (ST-5)'
        other_lines_noted: '1123 (the asymptotic optimal-m formula, equation (17): a formula, not a printed value; retained, and PIN-M-RANGE forbids using it as the optimiser)'
        action: RETAINED WITH REDACTION RD-SEM (lines 1131-1235 unread). The paper is the only primary statement of the model, so it cannot be excluded. Blindness for these lines is attested, not structural.
      - file: inputs/SEMAEV-2015-310/source_record.yaml
