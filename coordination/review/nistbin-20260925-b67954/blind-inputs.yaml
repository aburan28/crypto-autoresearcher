        action: EXCLUDED
      - file: inputs/SEMAEV-2015-310/tables.yaml
        lines: '133 (the full n = 571 row of Table 3, including the first-stage value and the m entry; ST-4, ST-5); 178 and 186 (the optimal m; ST-5)'
        action: EXCLUDED
      - file: inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md
        lines: 'no ST-1 to ST-5 hit. ST-6 hits: Section 3.4 (1281-1407, time estimates), the "of machine days" lines 1452, 1490, 1533, 1584, 1615, 1645, lines 1823-1824, Section 6.2 from 2022; plus rho-formula prose in Section 2.2 (about lines 353-384 and 458-471)'
        action: RETAINED WITH REDACTION RD-CERT. It is the only primary source of the Certicom rows' r and h. Its work estimates use a different convention from Q1 but are rho-derived figures that could anchor a Q1 value, so they are redacted. Attested blindness. The Section 2.2 formula prose is not a value and may be read.
      - file: inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md
        lines: 'no value hit. Pattern fragments matched only inside curve-parameter digit strings (6773, 7066) and generic "bit length" prose of other schemes'
        action: RETAINED, CLEAN
      - file: inputs/FIPS186-4-BINARY-CURVES/source_record.yaml
        lines: no hit
        action: RETAINED, CLEAN. Its prose labels the PDF's sha256 with the text file's prefix, a provenance recording defect already routed (DEC-20260924-124667 NA-4(b)); it does not affect Q1.
      - file: experiments/EXP-SEMBIN-992e73/specification.yaml
        lines: 'no value hit. ST-5 vocabulary only: 58, 76, 114, 129, 135 (prose about the optimising m, the m grid cap and an interior-optimum flag, with no value)'
