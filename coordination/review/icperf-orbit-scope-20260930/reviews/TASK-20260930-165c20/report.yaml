  findings:
  - id: source-contradiction
    verdict: holds
    detail: The immutable J1(c) script defines (B/131)*4r/binom(B,m) + m*(B/131)^2. Its stdout prints
      the m=3 floor 2^58.0348 and the rho reference 2^60.809037, then repeats a hard-coded sentence saying
      m=3 stays above rho and attributing about 3.5 bits to collapse. That concluding sentence contradicts
      the numerical output.
    sources:
    - coordination/review/icperf-aa2efc-20260926/reviews/TASK-20260926-44629c/checks/j1_j2_product_law_floors.py
    - coordination/review/icperf-aa2efc-20260926/reviews/TASK-20260926-44629c/checks/j1_j2_product_law_floors.out
  - id: arithmetic-scope
    verdict: holds
    detail: For m=3 the approximate objective is 6N/(k B^2)+3B^2/k^2. AM-GM gives min C=6*sqrt(2N)/k^(3/2),
      achieved at B^4=2Nk. The discount at fixed N is (3/2)*log2(131), about 10.55013 bits. The numerical
      falling-factorial objective agrees at the quoted precision. The ordinary k=1 model retains its own
      costs and does not inherit this discount.
    measured_arithmetic:
      rho_bits: 60.80903656396743
      no_collapse_N4r_bits: 68.58496250097308
      no_collapse_Nr_bits: 67.58496250107746
      idealized_orbit_N4r_k131_bits: 58.03482799848945
    comparison:
    - above
    - above
    - below
  - id: no-algorithmic-advance
    verdict: holds
    detail: The proposed correction explicitly limits the result to conditional continuous model arithmetic.
      A value below rho removes that particular exclusion; it establishes neither a practical speedup
      nor an unconditional complexity bound. These sources do not establish a suitable realized factor
      base and subgroup accounting, decomposition yield and affordable oracle, independent relation rank,
      the assumed collapsed linear algebra, memory or verification costs, or a full solve. A non-invariant
      F_2-subspace cannot simply be charged as an orbit union.
  - id: later-correction-coverage
    verdict: holds-with-recommendation
    detail: CORR-20260928-4cb669's full-curve and subgroup no-collapse m=3 values remain numerically valid
      after the scope correction. CORR-20260928-5d81df's preliminary cost labels and unbound-number disclosures
      remain untouched. CORR-20260928-2b8f4e also repeats broad 'free oracle at m=3 still loses' and 'm=4
      first in principle' conclusions; add it to also_affects or explicitly scope those sentences to no
      collapse. Preserve its separate published-derivation reproducibility-gap claim. The coordinator
      reported it will adopt this limited coverage delta in the final additive record; the committed proposal
      was not changed during this review.
  code_review:
    verdict: holds for the intended fixed parameters
    detail: cost_bits implements the falling-factorial m=3 objective. On B>=3 its decreasing reciprocal
      term plus quadratic term has a unique minimum for the supplied parameters, and the search interval
      includes that minimum. The tests pin the three distinct comparisons, compare the numerical minimum
      with the analytic approximation and k scaling, retain the k=1 known-false crossover control, and
      keep demonstrated_algorithmic_speedup false. That flag is scope metadata, not evidence that a solver
      exists or a proof that none can exist.
    tests: 4 passed in 0.05s on the provided Python 3.12.14 runtime.
    limitations: This is arithmetic/software review only. No cryptographic experiment, relation generation,
      benchmark, matrix/rank computation, key recovery, or external-artifact revalidation was performed.
      J1's blinded independent report was not read.
