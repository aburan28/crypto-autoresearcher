derivation: |
  With D=(B-1)(B-2), the exact falling-factorial objective simplifies to
  C=6N/(kD)+3B^2/k^2. Its stationary equation is
  B*D^2=Nk*(2B-3). Moreover,
  C''=12N*(3B^2-9B+7)/(kD^3)+6/k^2>0 for B>=3.
  All three cases have Nk>4, hence C'(3)<0, while C tends to infinity.
  Each has one interior global minimum. Each case was solved independently
  by derivative-sign bisection, without consulting producer artifacts.

  Replacing binom(B,3) by B^3/6 gives C_approx=6N/(kB^2)+3B^2/k^2.
  AM-GM gives C_approx>=2*sqrt(18N/k^3)=6*sqrt(2N)*k^(-3/2),
  with equality when B^4=2Nk. Thus B_approx=(2Nk)^(1/4) and
  B_approx/k=(2N)^(1/4)*k^(-3/4). These are conditional model scalings.

  Pi was calculated independently using 16*atan(1/5)-4*atan(1/239),
  with alternating power series. The identity follows because
  tan(4*atan(1/5))=120/119 and tan(4*atan(1/5)-atan(1/239))=1,
  with the angle in (0,pi/2). No external mathematical reference was needed.
