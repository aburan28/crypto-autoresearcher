        /usr/local/bin/python3 (CPython 3.11.15).
      assigned_to: TASK-20261002-9c44a4
      attack_plan: >-
        (i) REFERENCE FIRST. Before reading any r1 file, write your own
        brute-force counter from the statement N = #{x in F_(2^n) :
        x^(2^n') = lambda(x)} by full enumeration of F_(2^n), on synthetic
        cells with n outside {4, 7, 11, 12, 13, 31, 131} and n at most 18
        (for example (9, 4), (10, 3), (14, 5), (15, 4), (16, 6)), with stated
        irreducible moduli and every lambda of degree 2 to 5; record the
        order. (ii) Then run the r1 I_direct and I_indep, through the r1
        driver's synthetic-cell entry if the design provides one, on the same
        synthetic cells and compare row by row. (iii) PTM-R1, PTM-R2, PTM-R3
        and PTM-R6 below. (iv) Read the plan against the specification:
        cells, candidate counts, seeds, order, run ids (compare with every
        run id in the six earlier plans and the sixteen bound directory
        names), Linux, source_sha256 against the bytes at the snapshot,
        specification_sha256; load it with tools/experiment_execution.py in
        its read-only status mode only. (v) Hash every r1 file against
        TASK-20261002-da15a4 and the inputs as listed. Where I think it
        breaks: (iii) at PTM-R1, then (iv).
      breaking_artifact: >-
        A synthetic manifest check_run rejects; a certificate not written or
        not re-verified root by root; certificate_bearing not equal to files
        on disk; an under-listed row counted; a checker fallback; census code
        reachable from Stage 0; a constant attestation; an undeclared seed; a
        failed attempt invisible to validate_ledger; a plan trial, count,
        order, id or hash differing from what the specification and the
        accepted design require; an r1 instrument disagreeing with your
        brute-force reference on a synthetic cell; a PTM reaching its
        known-false conclusion.
    - joint: >-
        JR2 -- I_indep conformance and independence (D-4, the I_indep half
        of D-3, CI-1, CI-3, CI-4; the blind_from carried condition; the JD2
        acceptance checks of the accepted design). Under r1/indep/, I_indep
        implements derivation (A) as H-QSP-cd0c90 and IDEA-20260916-3f7a1c
        state it on every cell the approved route table assigns to it, and
        the approved substitute route (if any) only where amendment-v2.yaml
        allows; the route is selected by the cell's name from the approved
        table, never by a threshold computed from the cell; r1/indep imports
        nothing from experiments/EXP-QSP-70b731/implementation/*.py or from
        r1/runner and shares no polynomial or gcd primitive with I_direct;
        the I_indep author's declared read set excludes the bound closure and
        every blind_from path; a failed root search raises or flags; the
        Stage-1 calibration exercises every route the census uses.
      assigned_to: TASK-20261002-044e12
      attack_plan: >-
        (i) Read derivation (A) and the I_indep definition in the
        specification (and amendment A1 if approved) and write down, before
        reading r1/indep, what a conformant implementation must compute at
        each step. (ii) Read r1/indep statically: list every import, every
        function reachable from the entry point, and every branch that
        selects a route; any branch keyed on a computed degree, size or
        threshold instead of the cell name breaks CI-3. (iii) Search r1/indep
        for any repeated-squaring construction of X^(2^n) mod L followed by a
        gcd, under any name (PTM-R5). (iv) PTM-R4 below on synthetic cells.
        (v) Read the I_indep author's implementation report and its read
        attestation against CI-1 and blind_from. (vi) Check, from the plan,
        that the Stage-1 calibration cells exercise each census route. Where
        I think it breaks: (iii), then (ii).
      breaking_artifact: >-
        A step of derivation (A) missing or replaced on a cell the table
        assigns to it; a route chosen by a computed threshold; an import from
        the bound closure or the runner; a shared primitive with I_direct; a
        disguised I_direct path; a silent root-search failure; a read
        attestation naming a forbidden path or omitting the read set; a
        census route the calibration does not exercise; PTM-R4 or PTM-R5
        reaching its known-false conclusion.

