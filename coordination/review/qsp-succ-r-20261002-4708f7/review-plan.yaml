  coordinator_prior:
    per_joint: >-
      JR1 (runner, writers, accounting, checker, Stage 0, plan, custody)
      holds with probability about 0.55. Where I expect a break: the manifest
      passing a hand-written schema check but not tools/validate_ledger.py
      check_run itself; a certificate writer whose wrapper re-verifies a
      sample rather than every listed root; certificate_bearing computed from
