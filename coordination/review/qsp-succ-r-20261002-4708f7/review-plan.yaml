  joints:
    - joint: >-
        JR1 -- Runner, writers, accounting, checker, Stage 0 mechanics, plan
        and custody (D-1, D-2, the accounting half of D-3, D-5, D-6, D-7,
        D-8, CI-2, CI-5, CI-6; the carried conditions on run ids, re-runs and
        Linux; the JD1 acceptance checks of the accepted design). The run
        manifest a synthetic run writes passes tools/validate_ledger.py
        check_run and carries every AGENTS.md artifact-policy field; every
        N > 0 row writes a root-list certificate file and the wrapper
        re-verifies every listed root; certificate_bearing equals the
        re-verified files on disk; M5 is checked per stage before any
        headline; under-listing raises or is flagged and is never counted
        certificate-bearing; the checker has no fallback pass; Stage 0 runs
        no census code and M9 records a declared, checkable read set per run;
        internal RNG seeds are declared; a failed or expired attempt leaves a
        record validate_ledger.py can see; trial-plan-r1.json lists all 20
        trials with the specification's cells and candidate rule, fresh run
        ids (the twenty minted for it, none equal to an earlier plan's or a
        bound directory's), the stage and control order the accepted design
        or amendment fixes, a Linux requirement, and a source_sha256 closure
