      TASK-20261002-044e12: <session scratchpad>/BATCH-4708f7/TASK-20261002-044e12/

  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20261002-9c44a4 (PTM-R1, PTM-R2, PTM-R3, PTM-R6); TASK-20261002-044e12 (PTM-R4, PTM-R5)
    objects:
      - id: PTM-R1
        owner: TASK-20261002-9c44a4
        object: >-
          A synthetic stage result (synthetic cell, n outside the declared
          set) containing one row with N > 0 whose certificate file is
          deleted or never written, fed through the r1 accounting and checker.
        known_truth: >-
          Under certificate_semantics that row is not certificate-bearing, so
          M5 fails and F_acct fires. A run that reports it certificate-bearing
          or passes M5 has proved too much (DEC-20261002-e0aa2b NA-4).
      - id: PTM-R2
        owner: TASK-20261002-9c44a4
        object: >-
          A synthetic row with root_count_listed below N and
          root_list_deferred false.
        known_truth: Under D-3 it must raise or be flagged and is never certificate-bearing.
      - id: PTM-R3
        owner: TASK-20261002-9c44a4
        object: >-
          A flat manifest without a top-level run key, written beside a
          synthetic run, fed to tools/validate_ledger.py check_run and to the
          r1 checker.
        known_truth: >-
          check_run rejects it ("expected top-level key 'run'"); an r1 path
          that accepts it as a valid manifest has proved too much (F-01).
      - id: PTM-R4
        owner: TASK-20261002-044e12
        object: >-
          r1 I_indep on a synthetic cell with its root search forced to fail
          for one factor (a test hook, monkeypatch or injected exception in
          your scratch copy).
        known_truth: >-
          A root is then missing. An I_indep that returns a count without
          raising or flagging has proved too much (F-11, CI-4).
      - id: PTM-R5
        owner: TASK-20261002-044e12
        object: >-
          A copy of r1/indep in your scratch into which you insert, on one
          Band-L cell name, a call that computes deg gcd(X^(2^131) - X, L) by
          repeated squaring; fed to the closure's own static independence
          audit (if the design provides one) and to your own.
        known_truth: >-
          That is I_direct's algorithm (F-04). An audit that passes it, or a
          route table that would accept it, has proved too much.
      - id: PTM-R6
        owner: TASK-20261002-9c44a4
        object: >-
          The r1 Stage-0 trial payload with an inserted import of the census
          code (in your scratch copy).
        known_truth: >-
          stages.stage_0 says no census code runs. A Stage-0 mechanism that
          does not detect and fail it has proved too much (F-06).
    failure_signature: >-
      A conformant closure keeps each known-false conclusion out of reach:
      PTM-R1 fails M5 with F_acct; PTM-R2 raises or flags; PTM-R3 is rejected
      by check_run and by the r1 checker; PTM-R4 raises or flags; PTM-R5 is
