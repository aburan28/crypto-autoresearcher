      TASK-20261002-1b8018 must reproduce all four; a mismatch voids the
      composition.
    discharge_check: >-
      The composer checks that each of D-1 to D-8, the carried conditions,
      CI-1 to CI-6 and every acceptance check of the accepted design maps to
      a named part of the closure or plan that the owning joint's report
      does not contradict, and compares trial-plan-r1.json's cells, q, r and
      candidate counts with JD3's values.
    keys:
      K-accept: >-
        JR1 and JR2 hold; every PTM meets its failure signature; no tripwire
        fired; the discharge check passes; the plan agrees with JD3.
        DEC-20261002-0d2451 then ACCEPTS the r1 closure and trial-plan-r1.json
        as conformant to the specification (as amended, if amended). It does
        not approve execution and binds the plan to no run card: its first
        next action names an execution batch whose own opening decision
        issues the execution approval and binds the twenty trials to that
        batch's run card on a Linux host. Acceptance asserts nothing about
        N_K(L), H-QSP-cd0c90, EV-QSP-a6aa4b or any curve.
      K-revise-defect: >-
        JR1 or JR2 breaks, a discharge item is unmet, or TR-1, TR-2, TR-3 or
        TR-4 fired. Decision revise, each defect listed with its joint and
        breaking artifact; a repair-revision card in a new batch as the first
        next action, subject to the selection-point duties.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        acceptance while any joint is inconclusive.
      any_tripwire: See tier.tripwires.
    owner_reply_duty: >-
      The composer rules on any reply of coordinator-qsp-run-20260921 that
      DEC-20261002-a63f13 R-QSP-RETURN routed to it, as a pointer.
    re_carried_duties: >-
      The composer performs, or re-carries with a reason, DEC-20261002-e0aa2b
      NA-5 (closing BATCH-ed05f2, -9dbda3, -ee209c and -2c4a9c by a
      superseding decision and tools/goal_lanes.py, and the disposition of
      the reserved ids EV-QSP-d206e6 and DEC-20260921-c97a41) and NA-6 (the 14
      validate_ledger error lines of the flat manifests), with C-EQ of
      DEC-20261002-a63f13 as a fact (DEC-20261002-a63f13 R-NA5-NA6).
    selection_point_duties: >-
      DEC-20261002-0d2451 is a selection point. The slot this lane frees goes
      to the head item of DEC-20261002-a63f13 R-ORDER-3 or any later
      standing order on origin/main at its launch; an execution batch for the
      accepted closure takes it only with a recorded new reason and the cost
      of deferring the head item. It names exactly one first next action.

