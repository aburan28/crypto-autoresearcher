review_plan:
  id: REVIEW-ICPERF-PRIME63-M2-OUTPUT-CONTRACT-V2-20261025
  goal_id: GOAL-ICPERF-e6b6a4
  source_task_id: TASK-20261020-f237a2
  snapshot_task_id: TASK-20261020-fa096d
  validator_task_id: TASK-20261025-b2e2cd
  review_snapshot_task_id: TASK-20261025-6d007d
  written_by: coordinator
  written_at: '2026-10-25'
  written_before_any_reviewer_ran: true
  claim_under_review: >-
    The hash-bound v2 source and canned fixtures satisfy the prospective
    run-root output contract and make the standard supervisor distinguish
    output_validated from invalid_output without invoking a scientific solver.
    This is an engineering source/fixture claim, not a scientific result.
  coordinator_prior: >-
    The producer release reports two output_validated canned fixtures and
    four invalid_output controls. I expect independent inspection to confirm
    the required-path mapping, but a hidden self-consistency error between
    emitter and checker remains possible; the report is not yet accepted.
  joints:
  - id: O1
    joint: Every declared required run-root artifact is emitted with schema-valid content and digest links to the exact diagnostic bytes for both canned terminal classes.
    assigned_to: TASK-20261025-b2e2cd
    attack_plan: >-
      Before reading candidate source or fixture report, derive required
      top-level paths and manifest/raw-result fields from the frozen trial
      plan and standard experiment_execution supervisor. Then inspect the
      snapshot and independently trace emit-to-check mappings for censor
      and canned-positive cases; compare recorded raw member hashes.
    breaking_artifact: A named absent, empty, malformed or mismatched required output, or a digest not tracing to the declared raw bytes.
  - id: O2
    joint: The standard supervisor accepts complete canned output and rejects missing, empty, changed-digest and unlisted-member outputs with the stated classes, without repairing the historical run.
    assigned_to: TASK-20261025-b2e2cd
    attack_plan: >-
      Recreate the positive and negative cases in disposable roots via the
      real experiment_execution.execute_trial validation path, varying one
      declared field at a time. Inspect fixture-custody members directly
      rather than trusting fixture-report.json or producer tests.
    breaking_artifact: A known-false mutation marked output_validated, a complete canned terminal rejected for a hidden producer-only assumption, or a side effect on the historical run.
  - id: O3
    joint: Source, input manifest, fixture report and archive receipt preserve exact identities, source reachability and no-science limits without claiming solver success or prospective approval.
    assigned_to: TASK-20261025-b2e2cd
    attack_plan: >-
      Independently recompute all ten snapshot hashes and source/input
      references; check manifest code.commit reachability and command
      against canned execution, compare prior bridge read-only hashes, and
      search for solver calls or unapproved production admission bypasses.
    breaking_artifact: A mismatch in source/input identity, an undeclared write or solver call, or a claimed certificate or approval unsupported by the canned fixtures.
  blindness:
    mutual: true
    lifted_for: [TASK-20261025-b2e2cd]
    rule: >-
      This single independent Validator does not read another reviewer's
      report. It first writes and seals blind-derivation.yaml from the
      frozen plan, handoff and standard supervisor alone. Only after that
      file is committed and pushed under the review task may it read the
      producer source, tests or fixture report for O1-O3. The lift is
      deliberate and limited to comparison after the blind derivation.
  proves_too_much:
    objects:
    - id: historical_invalid_output
      known_false_conclusion: The historical RUN-ICPERF-eb0d88 satisfied its frozen top-level output contract.
      object: Original frozen run root lacks its required manifest.yaml and raw-result.json.
      expected_failure_signature: Historical run remains invalid_output and is never repaired by v2 fixture outputs.
    - id: missing_or_empty_output
      known_false_conclusion: A required output may be absent or empty while still output_validated.
      object: Remove or empty exactly one required top-level file in a disposable canned fixture.
      expected_failure_signature: Standard supervisor returns invalid_output.
    - id: changed_digest_or_extra_member
      known_false_conclusion: A changed digest or undeclared raw member satisfies complete output custody.
      object: Mutate one digest or add one raw archive member in a disposable fixture.
      expected_failure_signature: Independent checker or standard supervisor rejects the case.
    - id: canned_certificate
      known_false_conclusion: A canned positive response proves a solver certificate or authorizes a scientific run.
      object: Inspect result.certificate.kind and admission behavior in a canned fixture.
      expected_failure_signature: Certificate remains none and production admission remains separately gated.
    assigned_to: TASK-20261025-b2e2cd
    failure_signature: Acceptance of any known-false object blocks engineering source acceptance.
  blind_rederivation:
    required: true
    assigned_to: TASK-20261025-b2e2cd
    sealed_artifact: coordination/review/icperf-prime63-m2-output-contract-v2-20261025/TASK-20261025-b2e2cd/blind-derivation.yaml
    quantity: Frozen required output path set, mandatory manifest/raw-result fields, digest-link obligations and expected negative-control classes.
    parameters: experiments/EXP-ICPERF-515ae3/trial-plan.json and tools/experiment_execution.py, interpreted with the frozen TASK-20261020-f237a2 handoff.
    blind_from:
    - research/icperf_prime63_m2_output_contract_v2_20261020/execute.py
    - research/icperf_prime63_m2_output_contract_v2_20261020/check.py
    - research/icperf_prime63_m2_output_contract_v2_20261020/output_contract.py
    - research/icperf_prime63_m2_output_contract_v2_20261020/fixture_supervisor.py
    - research/icperf_prime63_m2_output_contract_v2_20261020/test_output_contract.py
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-ac3c38/fixtures/TASK-20261020-f237a2/fixture-report.json
  seal_then_compare: >-
    Validator first seals its blind derivation, then publishes report and
    attestation with a matching completed release; Coordinator snapshots exact bytes under TASK-20261025-6d007d
    before any acceptance decision. Do not read the report substantively
    before the snapshot receipt is verified.
  procedure_deviations: []
  inference_boundary: >-
    Passing O1-O3 establishes only prospective no-science output-contract
    engineering behavior. It does not validate historical output, approve a
    fresh scientific experiment, establish a certificate, or measure IC
    cost or speedup.
