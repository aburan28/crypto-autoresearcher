    original_checker: research/icperf_prime63_m2_diagnostic_integration_20261018/check.py
    note: >-
      These are frozen request identities, not evidence that a production run
      is admitted and not a requirement to invoke either original program in
      this no-science fixture review.

  run_root:
    derivation:
      specification: experiments/EXP-ICPERF-515ae3/specification.yaml
      specification_parent: experiments/EXP-ICPERF-515ae3
      supervisor_rule: '<specification_parent>/runs/<run_id>'
    path: experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88
    declared_driver_outputs:
    - path: manifest.yaml
      absolute_within_run_root: experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/manifest.yaml
      required: true
      must_be_regular_file: true
      may_be_empty: false
    - path: raw-result.json
      absolute_within_run_root: experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/raw-result.json
      required: true
      must_be_regular_file: true
      may_be_empty: false
    allow_empty_artifacts: []
    supervisor_generated_top_level_custody:
    - launch.json
    - execution-receipt.json
    - command.txt
    - environment.json
    - stdout.log
    - stderr.log
    - check.stdout.log
    - check.stderr.log
    nested_diagnostic_bytes_required_by_handoff:
    - diagnostic/receipt.json
    - diagnostic/raw.tar.gz
    classification_note: >-
      Only manifest.yaml and raw-result.json are declared trial artifacts.
      The eight custody files are created by the standard supervisor. The two
      diagnostic paths are handoff-required bytes referenced by the declared
      outputs, but are not separately listed in trial.artifacts.

  manifest_contract:
    file: manifest.yaml
    pre_completion_shape:
    - A YAML mapping is required.
    - A nested form may have only the top-level key run whose value is a mapping.
    - A flat legacy mapping may be wrapped by the supervisor during completion.
    - A nested run envelope mixed with other top-level keys is refused.
    agreement_checks_before_completion:
    - field: run.id
      if_present_must_equal: RUN-ICPERF-eb0d88
    - field: run.run_id
      if_present_must_equal: RUN-ICPERF-eb0d88
    - field: run.experiment_id
      if_present_must_equal: EXP-ICPERF-515ae3
    mapping_if_present:
    - run.code
    - run.result
    - run.inputs
    - run.environment
    - run.timing
    - run.result.certificate
    attack_claim_checks:
    - manifest or raw-result attack_claimed, when present, must be Boolean
    - attack_claimed true is refused when the manifest certificate is absent or has kind none
    - the no-science handoff requires result.certificate.kind to be none, so the canned fixtures must not claim an attack
    supervisor_completion_fields:
      run.id: RUN-ICPERF-eb0d88
      run.experiment_id: EXP-ICPERF-515ae3
      run.hypothesis_id: H-ICPERF-05021b
      run.task_id: TASK-20261019-904fbf
      run.trial_id: prime63-m2-three-arm-diagnostic
      run.approved_by: DEC-20261019-133820
      run.status: completed
      run.status_semantics: driver exited zero; not a validity or scientific ruling
      run.code.commit: authority commit used for the launch
      run.code.commit_meaning: launch authority commit from launch.json and environment.json
      run.code.command_file: command.txt
      run.code.command: JSON encoding of the actual driver argv
      run.code.check_command: JSON encoding of the actual checker argv
      run.environment.file: environment.json
      run.inputs.trial_plan: experiments/EXP-ICPERF-515ae3/trial-plan.json
      run.inputs.plan_sha256: 08f32f02a191dfd16f5342540716a327da73f5091528bac07cf5ee77cdb7cbc9
      run.inputs.trial_id: prime63-m2-three-arm-diagnostic
      run.timing.required_members:
      - started_at
      - finished_at
      - wall_seconds
      - source
      run.result.raw_result: raw-result.json
      run.result.executor_receipt: execution-receipt.json
      run.result.certificate.expected_kind_for_canned_no_science: none
      run.artifacts:
        stdout: stdout.log
        stderr: stderr.log
        check_stdout: check.stdout.log
        check_stderr: check.stderr.log
      run.envelope_completion.required_members_when_completed:
      - schema
      - action
      - driver_shape
      - driver_manifest_sha256
      - completed_by
      - added
    conditional_fields:
    - run.inputs.parameters, run.inputs.seed and run.inputs.curve_id are added only when the trial declares them; this trial declares none
    - run.result.metrics is copied only when a driver-level metrics mapping exists
    - a fully schema-valid driver manifest may remain unchanged, but identity and attack-claim checks still apply
    final_gate:
    - manifest.yaml must pass the run schema used by tools/validate_ledger.py
    - the candidate checker must exit zero before supervisor status can become output_validated
    - after checker success, manifest.yaml must still be a nonempty regular file and must again pass the run schema
    handoff_additions:
    - run.code.commit must name a reachable commit containing the exact fixture source
    - run.code.command must record the actual canned command, not imply a scientific solver invocation
    - manifest.yaml must bind fixed request identities and SHA-256 links to diagnostic/receipt.json and diagnostic/raw.tar.gz
    - production admission remains separately gated and cannot be inferred from the manifest

  raw_result_contract:
    file: raw-result.json
    certain_from_plan_and_supervisor:
    - It is a declared required nonempty regular file.
    - The supervisor attempts JSON decoding when enforcing attack-claim consistency.
    - If decoded as a mapping and attack_claimed is present, its value must be Boolean.
    - A true attack_claimed value requires the driver's own non-none certificate in manifest.yaml; the supervisor cannot supply one.
    - The standard supervisor delegates all other raw-result content validation to the frozen checker.
    handoff_required_semantics:
    - It must carry the fixed plan, experiment, trial, run, claim and source binding needed by the independent checker.
    - It must map SHA-256 links to the exact bytes at diagnostic/receipt.json and diagnostic/raw.tar.gz.
    - It must distinguish the bounded-censor and canned-positive terminal classes without representing either canned case as a scientific solver execution.
    - It must not encode a false successful scientific response or certificate.
    exact_candidate_key_names_known_at_phase_1: false
    uncertainty: >-
      The authorized sources specify the semantic bindings and target paths but
      do not specify the candidate raw-result key names or nesting. Those must
      be compared only after this blind record is sealed.

  digest_link_obligations:
    frozen_plan:
    - launch.json plan_sha256 must equal the SHA-256 of the frozen trial plan.
    - execution-receipt.json plan_sha256 must equal the SHA-256 of the frozen trial plan.
    - manifest run.inputs.plan_sha256 must equal the SHA-256 of the frozen trial plan when the supervisor completes the envelope.
    source_and_specification:
    - environment.json source_sha256 must reproduce the frozen plan source_sha256 mapping.
    - environment.json specification_sha256 must equal the frozen plan specification_sha256.
    - the handoff additionally requires code.commit reachability to the exact fixture source and input identities.
    diagnostics:
    - Both declared outputs must map diagnostic/receipt.json and diagnostic/raw.tar.gz by path and SHA-256 to the exact emitted bytes.
    - The receipt bytes and tar bytes must exist and be nonempty before their links can be accepted.
    - A changed declared digest must be rejected.
    - Every raw archive member must be declared by the contract and every declared member must be covered; an unlisted member must be rejected.
    - Manifest and raw-result identities and diagnostic hashes must agree rather than form two merely self-consistent but different views.
    supervisor_receipt:
      schema: crypto.autoresearch.trial_receipt.v1
      required_artifact_sha256_key_set:
      - manifest.yaml
      - raw-result.json
      - launch.json
      - command.txt
      - environment.json
      - stdout.log
      - stderr.log
      - check.stdout.log
      - check.stderr.log
      excluded_self_reference: execution-receipt.json
      rules:
      - The key set must be exact for later trial_state output_validated coverage; missing or extra keys require reconciliation.
      - Each digest binds the corresponding content bytes.
      - artifact_storage keys, when present, must be a subset of artifact_sha256 and stored content must match its content digest.
      - diagnostic/receipt.json and diagnostic/raw.tar.gz are not supervisor-receipt keys because the frozen plan does not declare them as separate artifacts; their custody is through the declared-output links and checker.

  expected_terminal_classes:
    positive_no_science_controls:
    - id: bounded_censor
      expected_supervisor_status: output_validated
      conditions:
      - driver exits zero
      - checker exits zero
      - both declared outputs are nonempty regular files
      - manifest passes the run schema
      - certificate kind remains none and no attack is claimed
    - id: canned_positive
      expected_supervisor_status: output_validated
      conditions:
      - driver exits zero
      - checker exits zero
      - all identities, diagnostic bytes and digests agree
      - canned response is labeled and does not become scientific evidence or admission
    mandatory_invalid_output_controls:
    - id: missing_mandatory_output
      mutation: remove exactly one declared required output in a disposable fixture root
      expected_supervisor_status: invalid_output
      enforcement: checker rejection or the supervisor post-check required-artifact gate
    - id: empty_mandatory_output
      mutation: empty exactly one declared required output in a disposable fixture root
      expected_supervisor_status: invalid_output
      enforcement: checker rejection or the supervisor post-check nonempty gate
    - id: changed_diagnostic_digest
      mutation: change one declared diagnostic SHA-256 without changing the referenced bytes consistently
      expected_supervisor_status: invalid_output
      enforcement: checker rejection
    - id: unlisted_raw_archive_member
      mutation: add one undeclared member to diagnostic/raw.tar.gz
      expected_supervisor_status: invalid_output
      enforcement: checker rejection of incomplete declared coverage
    required_checker_rejections:
    - id: mismatched_plan_binding
      expected: reject
    - id: mismatched_claim_binding
      expected: reject
    - id: mismatched_source_binding
      expected: reject
    - id: false_successful_response
      expected: reject
    supervisor_native_rejections:
    - id: malformed_or_uncompletable_manifest
      expected_supervisor_status: invalid_output
    - id: contradictory_run_or_experiment_identity
      expected_supervisor_status: invalid_output
    - id: non_boolean_attack_claimed
      expected_supervisor_status: invalid_output
    - id: claimed_attack_with_absent_or_none_certificate
      expected_supervisor_status: invalid_output
    infrastructure_not_scientific_controls:
    - id: driver_or_fixture_crash
      expected_supervisor_status: infrastructure_error
      implication: no evidence against any mathematical hypothesis
    proves_too_much_controls:
    - id: historical_invalid_output
      known_false_conclusion: RUN-ICPERF-eb0d88 already satisfied the frozen output contract
      expected: historical run remains invalid_output and no candidate fixture repairs it
    - id: canned_certificate
      known_false_conclusion: a canned positive proves a certificate or authorizes a scientific run
      expected: certificate kind remains none and production admission remains separate

  uncertainties_to_resolve_only_after_seal:
  - id: U1
    question: What exact key names and nesting do the candidate manifest and raw-result use for diagnostic path and SHA-256 links?
    consequence: No candidate conformance verdict is possible from this derivation alone.
  - id: U2
    question: What is the exact declared member allowlist and canonicalization rule for diagnostic/raw.tar.gz?
    consequence: The unlisted-member control is required, but its concrete member set is not derived here.
  - id: U3
    question: What canned terminal response values distinguish bounded-censor from canned-positive while preserving attack_claimed false?
    consequence: Terminal labels and payload consistency remain comparison work.
  - id: U4
    question: How does the disposable fixture authority exercise execute_trial while preserving actual command and source-commit identity without production admission?
    consequence: The mechanism must be inspected later; this record grants no admission.
  - id: U5
    question: Does every candidate emitter/checker path enforce the same obligations instead of relying on producer-only self-consistency?
    consequence: This is the central comparison attack after the blind artifact is committed and pushed.
  - id: U6
    question: Which additional run-schema fields are required by tools/validate_ledger.py beyond the supervisor completion fields listed above?
    consequence: The supervisor requires schema success, but validate_ledger.py was not an authorized Phase 1 derivation source and was not opened.

  inference_boundary: >-
    Even complete satisfaction of this derived contract would establish only
    prospective no-science output-contract engineering behavior for canned
    fixtures. It would not repair or validate the historical run, approve a
    new scientific experiment, establish a solver certificate, measure index
    calculus cost or speedup, or change research status.
  next_step_after_operator_seal: >-
    Stop Phase 1. Do not inspect candidate artifacts until the operator commits
    and pushes this exact blind derivation and explicitly authorizes Phase 2.
