    - path: experiments/EXP-SEMBIN-81dc96/code/independent_arith.py
      when: after_figures
      extent: >-
        lines 133-202 in full plus a structural survey of its function list and
        its declared independence_kind
    - path: experiments/EXP-SEMBIN-81dc96/code/joint_balance.py
      when: after_figures
      extent: >-
        function list and a grep for the sparse formula only; not read in full,
        and no figure of mine depends on it
    - path: knowledge/literature/KN-LIT-e77232.md
      when: after_figures
      extent: >-
        lines 96-140, to verify the attribution of the (nm)^4/24 and n^3/m
