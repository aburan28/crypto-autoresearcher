review_attestation:
  task_id: TASK-20260913-ec11c4
  round_id: REVIEW-SEMBIN-20260913-9d649f
  role: validator
  requested_policy: review-adversarial
  reasoning_effort: xhigh
  independent_session: true
  joints_owned:
    - >-
      J6-BLIND: blind re-derivation of the batch's single load-bearing
      quantity -- the memory-charged crossover n under (time * memory) with the
      sparse storage reading, and the signed margin in bits at n = 409 under the
      same measure.

  sources_read:
    # read BEFORE the figures were written (permitted set only)
    - path: ledger/handoffs/TASK-20260913-ec11c4.yaml
      when: before_figures
    - path: coordination/review/sembin-20260913-9d649f/review-plan.yaml
      when: before_figures
      extent: >-
        ONLY lines 303-343, the `blind_rederivation` block, extracted with
        `sed -n '303,343p'` after locating the block's bounds with a grep for
        second-level keys. The `claim_under_review` (lines 11-36) and
        `coordinator_prior` (lines 37-89) blocks were NOT read, and neither were
        `joints`, `blindness`, `proves_too_much` or the trailing sections. The
        block I did read itself quotes the record's 375 and +11.52 in its
        `quantity` field; see figures_disclosed_in_the_brief below.
    - path: inputs/SEMAEV-2015-310/paper_fulltext.md
      when: before_figures
      extent: read in full
    - path: inputs/SEMAEV-2015-310/tables.yaml
      when: before_figures
      extent: >-
        read in full, including derived_checks. Used as controls: Table 3's 36
        cells, the P_theoretical columns of Tables 1-2, the f4_working_set
        monomial exponents, the relation counts, and the stated time-only
        crossover of 302.
    # read AFTER the figures were written and hashed
    - path: experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/COST-SEMBIN-8d123b.yaml
      when: after_figures
    - path: experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/raw-result.json
      when: after_figures
      extent: >-
        crossovers_per_metric, verdict_map/time_memory_product/semaev_sparse/409,
