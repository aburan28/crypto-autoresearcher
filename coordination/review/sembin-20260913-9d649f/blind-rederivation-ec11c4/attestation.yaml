    - path: templates/research-records.md
      when: after_figures
      extent: the review_attestation block only
  not_read:
    - experiments/EXP-SEMBIN-f4a17b/code/verify_record_transcription.py
    - experiments/EXP-SEMBIN-81dc96/runs/RUN-SEMBIN-aa5161/
    - >-
      the sibling reviewers' directories under
      coordination/review/sembin-20260913-9d649f/
    - >-
      the review plan's claim_under_review and coordinator_prior blocks, at any
      point, before or after the figures

  read_sibling_reports: false

  blind_from_respected: true
  blind_from_first_read_at: '2026-09-13T15:11:22Z'
  blind_from_first_read_point: >-
    Step 3 of the assigned procedure, after both figures were computed, written
    to figures-before-reading.json, verified deterministic by re-running the
    script to a second path and diffing, and sha256-hashed. The first path in
    blind_from that I opened was
    experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/COST-SEMBIN-8d123b.yaml.
    No path in blind_from -- no code, no manifest, no run directory, no raw
    result -- was opened, grepped, listed or otherwise inspected before that
    moment.
  ordering_evidence:
    figures_file: figures-before-reading.json
    sha256: 301cbd861809dd3f2bb997621541c59be487743d1e320bc2280f61dfe8e67596
    mtime_utc: '2026-09-13T15:10:42Z'
    blind_from_first_read_utc: '2026-09-13T15:11:22Z'
    note: >-
      The hash and mtime were taken in the same command that timestamped the
      start of reading, one command before the first blind_from read. This is
      offered as an ordering receipt, not as proof: nothing prevents a
      working-tree file from being rewritten, and only a Coordinator snapshot
      commit would bind it. The attestation rests on the statement above.
  figures_disclosed_in_the_brief:
    disclosed: true
    what: the target values 375 and +11.52
    where: >-
      both the task brief that launched this session and the review plan's own
      `blind_rederivation.quantity` field state them, the latter while
      instructing me not to read them elsewhere first.
    why_it_matters: >-
      Disclosed so the round is not composed as though this were stronger than
      it is. My blindness was to the IMPLEMENTATIONS and the run record, which is
      the failure mode the joint exists to catch -- a re-derivation that reads
      the producer's code reproduces a wrong-but-self-consistent model
      faithfully. It was NOT blindness to the target numbers. Knowing the targets
      creates a pull toward finding a route to them; I record that I did not take
      one, and the evidence for that is the disagreement itself: had I been
      tuning toward 375 and +11.52 I would have reported them rather than 306 and
      +29.77, and my sensitivity grid contains a variant (exact yield / dense /
      plan N) landing at 373 and +14.62 that I could have presented as agreement
      and did not.

  figures_recorded_before_reading:
    crossover_n: 306
    margin_bits_at_n_409: 29.77
    optimal_m_at_409: 11
    k_at_409: 38
    relation_store_bits_log2_at_409: 48.27
    macaulay_width_monomials_log2_at_409: 36.50
    attack_time_log2_at_409: 166.54
    attack_cost_log2_at_409: 214.82
    baseline_cost_log2_at_409: 244.59

  record_figures:
    crossover_n: 375
    margin_bits_at_n_409: 11.5175

  agreement: false
  agreement_detail: >-
    Sign agrees -- the attack is ahead at n = 409 under both -- and every term
    of the comparison except one agrees to four decimal places at all five of
    the record's parameter sets: optimal m, attack time (166.5438), baseline
    time (204.3254), baseline memory (40.2609) and the DENSE working set
    (86.8371). My implementation reproduces the record's entire dense branch,
    including its crossover of 435 and its -8.7946 margin, with no substitution.
    Magnitude disagrees on the sparse branch alone, by 18.25 bits at n = 409 and
    69 in n on the crossover.

  localisation:
    differing_step: >-
      the sparse Macaulay working set, and nothing else
    accounted_for_by: the review plan's `parameters` statement
    not_accounted_for_by: >-
      neither implementation. No arithmetic error was found in
      memory_charged_cost.py, in independent_arith.py, or in my own code.
    detail: >-
      The plan states the sparse working set as the degree-<=4 monomial count in
      N = m*ceil(n/m) + 2n variables, charged as "the width itself". The
      producer instead charges Semaev's own sparsity estimate from the
      ellipticnews thread recorded at KN-LIT-e77232: (n*m)^4/24 columns times
      n^3/m nonzeros per row, with row count taken of the order of the column
      count (memory_charged_cost.py, semaev_memory_log2, storage
      "semaev_sparse"). That is 23.1 bits above the monomial width at n = 409.
      Substituting that one formula into my otherwise unchanged implementation
      reproduces the record exactly: crossover 375 and margin +11.5175.
    secondary_misstatements_in_the_plan:
      - >-
        N is given as m*ceil(n/m) + 2n, which is the producer's relation ROW
        WIDTH (row_bits = 1236 at n = 409), not its Macaulay variable count
        ((m-2)n + m*ceil(n/m) = 4099, per Section 4.5.1 of the frozen text and
        per the permitted tables.yaml). Immaterial to my figures, because the
        relation store binds under either reading, but wrong.
      - >-
        the plan says the attack's memory is the MAXIMUM of the two terms; the
        implementation sums them in log2 space. Agrees to ~2e-6 bits here
        because the terms differ by >=13 bits everywhere; would matter by up to
        1 bit where they were comparable.
      - >-
        the plan does not say whether the minimand over m is time or the
        time * memory product, and does not state a scan domain for n. Neither
        changes the figures; the missing n domain is what admits the small-n
        artefact reported in the report's finding 5.
    direction: >-
      The plan's stated model is MORE favourable to the attack than the
      producer's (+29.77 against +11.52 at n = 409). A reviewer working from the
      plan's parameters alone would over-credit the attack, not under-credit it.
      The plan as written cannot produce the figure it asked me to confirm.

  verdict: breaks
  verdict_scope: >-
    ON MY JOINT ONLY, and on the joint as SPECIFIED rather than on the record's
    arithmetic. I found no arithmetic error in COST-SEMBIN-8d123b, and its
    headline framing -- a 46.6-bit swing between two defensible storage readings
    straddling zero at n = 409, with the paper stating no memory model --
    survives my re-derivation intact. `breaks` records that the plan misstates
    the quantity, so this joint did NOT independently confirm the number it was
    commissioned to confirm, and the round must not be composed as though it
    did. I own one joint of six and cannot see the others; this is not a verdict
    on the claim.

  findings_for_the_coordinator:
    - id: F1
      severity: high
      finding: >-
        The load-bearing sparse figure has no independent recomputation anywhere
        in the repository. COST-SEMBIN-8d123b names independent_arith.py as its
        independent_arithmetic_ref; that file re-derives all 36 Table 3 cells,
        n^12, stage 2, the relation-store exponents, the variable counts, the
        degree-4 widths and the DENSE square, but never evaluates
        (nm)^4/24 * n^3/m. So semaev_memory_log2_sparse = 66.5250 -- the number
        that flips the n = 409 verdict from -8.8 to +11.5 -- is computed in
        exactly one place, and my blind pass could not check it either because
        the plan did not state it. After this round it remains
        singly-implemented and never re-derived.
    - id: F2
      severity: high
      finding: >-
        The record's sharpest quantitative claim,
        crossover_shift_attributable_to_memory.semaev_sparse "+72 in n
        (303 -> 375)", is carried entirely by that one blog-sourced formula. I
        reproduce the 303 endpoint exactly. Under the memory model the plan
        describes, the shift is 303 -> 306: +3 in n, not +72. A crossover is
        fixed by how memory SCALES in n, and KN-LIT-e77232 records the sparsity
        formulas as Semaev's own and explicitly "not re-derived", with a single
        numerical anchor near 2^70 bits at (n = 571, m = 12). The formula does
        reproduce that anchor -- my retyping gives 70.2714 -- which is evidence
        about the anchor and not about the slope the crossover depends on.
    - id: F3
      severity: medium
      finding: >-
        Dense and sparse are not two storage readings of one matrix model. The
        dense branch uses the true degree-<=4 monomial count at
        N = (m-2)n + km (2^43.42 at n = 409); the sparse branch uses (nm)^4/24
        (2^43.96), a coarsened stand-in for the same column count, 0.54 bits
        high because nm = 4499 > N = 4099. The two branches assume different
        column counts for the same matrix. Quantitatively negligible against a
        20-bit headline, but the record presents them as one matrix charged two
        ways. Relatedly, the two readings disagree about which resource is the
        bottleneck: under the plan's reading the relation store binds at every n,
        under the producer's the working set does, so which physical resource
        dominates is itself model-dependent and the record does not say so.
    - id: F4
      severity: low
      finding: >-
        The margin is not monotone in n -- ceil(n/m) steps at each multiple of m
        and doubles the relation store, so the comparison saws -- and there is a
        spurious cheaper point at n = 3 caused by charging the baseline a fixed
        2^30-point distinguished-point store even in a group of 2^3 elements. The
        producer's crossover_curve scans only n in [250, 650] and never sees it.
        I verified the window hides nothing real: under the producer's own
        formula, widening to n in [100, 900] still gives 375 as a single
        contiguous winning run. The restriction is sound but undeclared.

  method:
    implementation: >-
      coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/rederivation.py
    dependencies: Python standard library only
    determinism: >-
      verified by re-running to a second output path and diffing; identical
      apart from the timestamp
    arithmetic: >-
      exact rational interval arithmetic. Each cost is a closed interval of
      Fractions built from exact integer m-th roots at a declared 2^-256
      relative precision; no float appears in any comparison, so every reported
      inequality is rigorous, and a log2 figure is printed only when its lower
      and upper bounds round identically. Eq. (11) is evaluated as rational
      bounds from the alternating series for 1-exp(-x). Deliberately a different
      representation from a float implementation, so that agreement could not be
      agreement about a shared numerical idiom.
    controls_all_passing:
      - >-
        all 36 Table 3 cells reproduce within 0.70% (the paper's
        3-significant-figure rounding), and my argmin over m matches the paper's
        printed m at every row -- this is what establishes that my time model IS
        the producer's and the paper's, and hence why the disagreement could be
        localised to one memory term
      - >-
        the frozen record's degree-<=4 monomial exponents 41.2 / 43.4 / 45.9
        reproduce at the paper's variable count
      - the relation counts 2^31 / 2^38 / 2^48 reproduce
      - >-
        eq. (11) reproduces seven P_theoretical cells of Tables 1-2; the paper
        truncates rather than rounds, so agreement is tested at one unit in the
        last printed place
      - >-
        the frozen record's independently stated time-only crossover of 302
        reproduces exactly

  procedure_deviations:
    - deviation: >-
        I wrote two files beyond the four declared artifact_paths: localise.py
        and localisation.json.
      reason: >-
        the handoff makes the localisation the deliverable on disagreement, and
        a single-term substitution test is the only way to demonstrate it rather
        than assert it. localise.py imports my own module and retypes the
        producer's two defining lines; it imports nothing from the producer.
      scope: >-
        both are inside the assigned write_scope
        coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/
    - deviation: >-
        I read knowledge/literature/KN-LIT-e77232.md, which is not in the
        handoff's `inputs` list.
      reason: >-
        after the figures were written, to verify the producer's attribution of
        the sparsity formulas to Semaev's thread comment. It is not in
        blind_from, and no figure of mine depends on it.

  foreign_artifacts_in_my_write_scope:
    observed: true
    paths:
      - >-
        coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/verification/
        (verify.py, verification.json, rerun-figures.json, rerun-stdout.txt,
        rerun-stderr.txt, rerun-time.txt)
    i_authored_them: false
    statement: >-
      A `verification/` subdirectory appeared inside my assigned write_scope
      during this task, with mtimes 15:15-15:19 UTC, overlapping my own work. I
      DID NOT AUTHOR IT IN THIS SESSION. It is addressed to this task id, is
      written in the first person about my joint, and refers to my n = 3
      artefact finding, so it appears to be another session or another instance
      working the same handoff in the same worktree -- a write-scope collision
      of the kind `tools/goal_lanes.py` claims exist to prevent. I am recording
      it rather than absorbing it, because an undisclosed artifact sitting in my
      deliverable directory would otherwise read as mine.
    integrity_of_my_own_artifacts: >-
      unaffected. rederivation.py still hashes to
      8f2f7bd6ce78e7060da1b0257e2579f53292f9eef1b077b28a908c6e9f534a9c and
      figures-before-reading.json to
      301cbd861809dd3f2bb997621541c59be487743d1e320bc2280f61dfe8e67596, both
      identical to the values taken before my first blind_from read. Nothing of
      mine was modified.
    did_i_rely_on_it: >-
      No. Every figure and every finding in report.md was derived before I
      noticed that directory, and none cites it. I read it only to determine
      whether it conflicted with my report.
    relation_to_my_findings: >-
      Where it overlaps my work it is consistent: its section A independently
      reports that the producer's model also has the n = 3 artefact and that 375
      is still the final crossover when scanned from n = 3, which matches my own
      finding F4 (I verified the same by scanning [100, 900]). Its section B
      reports that COST-SEMBIN-8d123b transcribes its own raw-result.json
      faithfully, which I also confirmed programmatically. Its section C asks my
      F1 question but answers it with keyword greps over independent_arith.py,
      and its single `matching_lines` hit is a false positive -- a Table 3 data
      row, not the sparse formula. My F1 does not rest on that: I read
      `load_bearing_quantities()` in full and enumerated what it does and does
      not recompute. I neither endorse nor adopt that file's conclusions.
    left_in_place: >-
      I did not delete or edit it. Removing another writer's artifact would be a
      worse failure than reporting it, and it is not mine to correct.

  claims_asserted: none
  scope_note: >-
    This attestation supports no claim about the security of B-409, K-409,
    B-571 or K-571. Both cost models compared here are heuristic estimates
    conditional on Semaev's Assumption 1, with non-identical operation units on
    the two sides and no unit-conversion factor. No solve, relation or
    certificate is computed anywhere in this task. The record's own
    degree_bound_sensitivity notes that a degree bound of 5 adds 19.4 bits at
    n = 409, which exceeds every effect discussed above and is untouched by this
    re-derivation.
  wrote_outside_write_scope: false
  committed_anything: false
  edited_any_ledger_record_contract_manifest_or_cost_record: false
