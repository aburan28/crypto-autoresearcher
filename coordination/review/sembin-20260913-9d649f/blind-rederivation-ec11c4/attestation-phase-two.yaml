review_attestation:
  task_id: TASK-20260913-ec11c4
  round_id: REVIEW-SEMBIN-20260913-9d649f
  role: validator
  requested_policy: review-adversarial
  reasoning_effort: xhigh
  independent_session: true
  phase: >-
    PHASE TWO of a two-session task. This attestation covers the verification
    and comparison half only. It is a SEPARATE file from attestation.yaml,
    which was written by the other instance; I did not edit or replace that
    file, because replacing another agent's attestation would be recording an
    attestation I did not obtain.
  supersedes: null
  companion_attestation: >-
    coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/attestation.yaml
    -- written by a different session/instance of this same task. Snapshotted by
    me at verification/attestation.yaml.phase-one-snapshot
    (sha256 1e181af6c8ae932abe5dcc7f78eb799c5fa955c5560daae0abf6754084d98c2d).

  joints_owned:
    - >-
      J6-BLIND: blind re-derivation of the batch's single load-bearing quantity
      -- the memory-charged crossover n under (time * memory) with the sparse
      storage reading, and the signed margin in bits at n = 409 under the same
      measure.

  # ------------------------------------------------------------------
  # The blindness claim, stated exactly as narrowly as it is true.
  # ------------------------------------------------------------------
  blindness:
    i_was_blind: false
    who_was_blind: >-
      The session that WROTE figures-before-reading.json. Not me. The frozen
      figures were produced at 2026-09-13T15:10:42Z and that session records its
      first blind_from read at 15:11:22Z, after hashing them.
    my_own_first_blind_from_exposure_utc: '2026-09-13T15:17:26Z'
    my_own_first_blind_from_read_point: >-
      Step 4 of my assigned procedure, deliberately and for the purpose of
      comparison. The first blind_from-derived content I read was localise.py in
      my own write scope (which transcribes COST-SEMBIN-8d123b.yaml), and
      immediately thereafter the run directory
      experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/ itself. Before that
      moment I had read, in order: agents/validator.md, the handoff,
      figures-before-reading.json, rederivation.py, and the review plan's
      blind_rederivation block.
    blind_from_respected_by_me: >-
      NOT APPLICABLE AS A CLAIM OF BLINDNESS. My task card assigned me phase two
      and instructed me to read blind_from in order to compare. I respected the
      ORDERING it imposed -- the frozen figures were read and reproduced before
      any blind_from read -- but I make no claim to have been blind, and this
      round must not be composed as though two blind derivations exist. There is
      one, and I am not it.
    what_the_blindness_actually_covered: >-
      The producer's IMPLEMENTATIONS and RUN RECORD, which is the failure mode
      the joint exists to catch. It did NOT cover the target values: the review
      plan's own blind_rederivation.quantity field states "The record asserts
      375 and +11.52 respectively", and the task brief repeats them. A blind
      brief that names its answer is a defect in the protocol and is reported as
      such in report-phase-two.md section 7.
    evidence_for_the_ordering:
      figures_file: figures-before-reading.json
      sha256: 301cbd861809dd3f2bb997621541c59be487743d1e320bc2280f61dfe8e67596
      mtime_utc: '2026-09-13T15:10:42Z'
      script_sha256: 8f2f7bd6ce78e7060da1b0257e2579f53292f9eef1b077b28a908c6e9f534a9c
      both_unchanged_at_end_of_my_session: true
      caveat: >-
        An mtime and a hash in a working tree are an ordering receipt, not
        proof. Nothing binds them until a Coordinator snapshot commit. The
        ordering claim for phase one rests on that session's statement; the
        ordering claim for MY reads rests on mine.

  # ------------------------------------------------------------------
  # What I actually did, in order.
  # ------------------------------------------------------------------
  sources_read:
    - path: AGENTS.md
      when: before_any_blind_from_read
    - path: agents/validator.md
      when: before_any_blind_from_read
    - path: ledger/handoffs/TASK-20260913-ec11c4.yaml
      when: before_any_blind_from_read
    - path: >-
        coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/figures-before-reading.json
      when: before_any_blind_from_read
      extent: read in full
    - path: >-
        coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/rederivation.py
      when: before_any_blind_from_read
      extent: read in full
    - path: coordination/review/sembin-20260913-9d649f/review-plan.yaml
      when: before_any_blind_from_read
      extent: >-
        ONLY the `blind_rederivation` block, extracted programmatically by a
        recursive key walk that printed that key alone and otherwise emitted
        only the top-level key list. I did not read `claim_under_review`,
        `coordinator_prior`, `joints`, `blindness`, `proves_too_much`, or any
        other section, at any point.
    # ---- first blind_from exposure at 15:17:26Z ----
    - path: >-
        coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/localise.py
      when: after
      extent: >-
        read in full. In my write scope, but it transcribes blind_from content,
        so I count it as my first blind_from exposure rather than claiming
        otherwise.
    - path: >-
        coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/localisation.json
      when: after
      extent: read in full
    - path: experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/COST-SEMBIN-8d123b.yaml
      when: after
      extent: read in full
    - path: experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/raw-result.json
      when: after
      extent: >-
        crossovers_per_metric.time_memory_product.semaev_sparse and
        verdict_map.time_memory_product.semaev_sparse.409, read programmatically
    - path: experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/independent-arithmetic.json
      when: after
      extent: key structure only, to determine coverage
    - path: experiments/EXP-SEMBIN-f4a17b/code/memory_charged_cost.py
      when: after
      extent: read in full
    - path: experiments/EXP-SEMBIN-81dc96/code/independent_arith.py
      when: after
      extent: >-
        docstring and declared coverage list in full (lines 1-62), plus a
        function/identifier survey. Enough to establish what it does and does
        not recompute.
    - path: knowledge/literature/KN-LIT-e77232.md
      when: after
      extent: >-
        grep for the sparsity formulas and their citation_provenance, to check
        the attribution of (nm)^4/24 and n^3/m. Not in blind_from.
    - path: >-
        coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/report.md
      when: after
      extent: >-
        read in full, AFTER my own comparison and localisation were complete.
        This is the other instance of my own task, not a sibling reviewer.
    - path: >-
        coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/attestation.yaml
      when: after
      extent: read in full, same basis
  not_read:
    - experiments/EXP-SEMBIN-f4a17b/code/verify_record_transcription.py
    - experiments/EXP-SEMBIN-81dc96/code/joint_balance.py
    - experiments/EXP-SEMBIN-81dc96/runs/RUN-SEMBIN-aa5161/
    - coordination/review/sembin-20260913-9d649f/validator-da3982/
    - coordination/review/sembin-20260913-9d649f/red-team-cf9d98/
    - >-
      the review plan's claim_under_review and coordinator_prior blocks, at any
      point
  read_sibling_reports: false
  read_sibling_reports_detail: >-
    I did not read, list, grep or open anything under validator-da3982/ or
    red-team-cf9d98/. I did read report.md and attestation.yaml inside my OWN
    write scope; those are the other instance of THIS task, not another joint's
    reviewer, and I disclose the read rather than leaving it implicit.

  # ------------------------------------------------------------------
  # Findings.
  # ------------------------------------------------------------------
  figures_frozen_before_reading:
    crossover_n: 306
    margin_bits_at_n_409: 29.77
    primary_model: closed/time/sparse/plan
  record_figures:
    crossover_n: 375
    margin_bits_at_n_409: 11.5175
  agreement: false

  reproduction_check:
    question: does rederivation.py reproduce figures-before-reading.json?
    answer: yes, exactly
    method: >-
      reran the frozen script standalone to verification/rerun-figures.json and
      compared the full JSON field by field, not just the headline pair.
    result: >-
      identical in every field except `produced_at`, including the sensitivity
      grid, the margin curve, the crossover region detail and all five controls.
      8.3 s wall clock, 15.2 MB peak RSS. Both frozen files' sha256 unchanged
      afterwards.
    significance: >-
      a re-derivation whose own script disagreed with its own recorded figures
      would be worthless. It does not disagree.

  plan_question_check:
    question: did the frozen script compute the quantity the plan specified?
    answer: yes
    parameters_verified_line_by_line:
      - stage 1 m! * 2^{n/m} * n^{4*omega} with omega = 3 -- matches
      - stage 2 2^{2n/m} with exponent 2 -- matches
      - argmin over integer m in [2,20] -- matches
      - relation store 2^{ceil(n/m)} rows of (m*ceil(n/m) + 2n) bits -- matches
      - working set = degree-<=4 monomials in N = m*ceil(n/m) + 2n -- matches
      - baseline time 0.886 * 2^{n/2} -- matches
      - baseline memory 2^30 points at 3n bits -- matches
    ambiguities_the_script_handled_rather_than_hid:
      - >-
        Eq. (11) is REDUNDANT with the plan's own stage-1 formula: m! * 2^{n/m}
        is eq. (15) with the yield already folded in at k = n/m, so stating
        eq. (11) separately specifies a second computation. The script takes the
        plan-literal formula as primary and reports the eq. (11) reading in the
        sensitivity grid (307 / +42.37) rather than silently choosing.
      - >-
        The monomial count is squarefree (Boolean), sum_{i<=4} C(N,i), not
        C(N+4,4). The two differ by about 0.02 bits at N = 1236 and the Boolean
        reading is correct for a Weil-descended system.

  localisation:
    differing_step: the sparse Macaulay working set, and nothing else
    accounted_for_by: the review plan's `parameters` statement
    not_accounted_for_by: >-
      no implementation. I found no arithmetic error in memory_charged_cost.py,
      in independent_arith.py, or in rederivation.py.
    exact_decomposition_at_n_409_m_11:
      producer_column_count_log2: 43.9566
      degree4_monomials_paper_N_4099_log2: 43.4186
      degree4_monomials_plan_N_1236_log2: 36.4986
      nonzeros_per_row_log2: 22.5684
      relation_store_log2: 48.2715
      attack_memory_plan_as_written_log2: 48.2715
      attack_memory_producer_log2: 66.5250
      memory_gap_bits: 18.2535
      margin_gap_bits: 18.2535
      verified: >-
        the memory gap EQUALS the margin gap to 4 dp, so the localisation is
        exact and single-term.
    what_the_plan_dropped: >-
      the n^3/m nonzeros-per-row factor (2^22.57 at n = 409). The plan's "one
      field element per nonzero" charges the column count alone, which
      implicitly assumes one nonzero per row.
    narrowing_of_the_companion_report_F3: >-
      The companion report reads the 0.54-bit gap between (nm)^4/24 and the
      paper-N monomial count as the dense and sparse branches assuming DIFFERENT
      column counts. The arithmetic supports a milder reading: 43.9566 against
      43.4186 is the same object to within a coarsening, so dense and sparse are
      genuinely two storage conventions on one matrix. The material difference
      is the row factor, not the column count. I record the disagreement rather
      than absorbing it.
    substitution_test: >-
      substituting only the producer's sparse formula into the otherwise
      unchanged independent implementation reproduces the record exactly:
      crossover 375 and margin +11.5175. I reran localise.py in a scratch
      directory and confirmed it reproduces localisation.json byte for byte.
    producer_not_in_error: >-
      the formula is Semaev's own, from the ellipticnews thread recorded at
      KN-LIT-e77232, whose citation_provenance is `retrieved` with a receipt at
      inputs/ELLIPTICNEWS-CHAR2-2015/provenance.json, and which re-checks it:
      (nm)^4/24 = 2^46.38 columns and n^3/m = 2^23.89 nonzeros at n = 571 gives
      2^70.3, matching the record's 70.2718.

  independent_checks_i_added:
    - id: V1
      check: >-
        the RECORD transcription block inside localise.py, verified cell by cell
        against COST-SEMBIN-8d123b.yaml at all five parameter sets.
      result: correct
      why_it_mattered: >-
        the session that wrote that transcription could not check it
        independently, and every localisation claim rests on it.
    - id: V2
      check: >-
        COST-SEMBIN-8d123b.yaml against its own run's raw-result.json.
      result: >-
        matches: crossover 375, margin_at_409 11.5175, memory 66.525,
        monotone_after_crossover true. The record transcribes its own run
        faithfully.
    - id: V3
      check: >-
        whether the record's 375 is an artefact of the hardcoded scan window
        n_lo = 250 in crossover_curve().
      result: >-
        it is not. Substituting the producer's formula and scanning from n = 3
        gives cheaper runs [3,3] and [375,700]: 375 is the persistent crossover,
        and the producer additionally records monotone_after_crossover: true.
        The window is undeclared but sound.
    - id: V4
      check: >-
        whether independent_arith.py covers the load-bearing sparse term.
      result: >-
        it does not. It recomputes Table 3, n^12, stage 2, the relation-store
        exponents, the variable counts, the degree-4 widths and the DENSE
        square, and never evaluates (nm)^4/24 * n^3/m.

  findings_for_the_coordinator:
    - id: P1
      severity: high
      finding: >-
        THE BLIND CHECK OF THE LOAD-BEARING QUANTITY DID NOT HAPPEN. The review
        plan's `parameters` field promises that "every one of them is stated
        here so that you never need the producer's code to obtain them", and it
        does not state the producer's sparse memory model. The re-derivation
        therefore answered a different question correctly. This is a defect in
        the plan, not in the derivation and not in the record.
    - id: P2
      severity: high
      finding: >-
        After this round, semaev_memory_log2_sparse -- the term that moves the
        n = 409 verdict from -8.8 to +11.5 -- is computed in exactly ONE
        implementation in the repository, corroborated at exactly ONE parameter
        point (n = 571) by the knowledge record it came from. The record's
        declared independent_arithmetic_ref does not cover it and this blind
        joint could not. It should not be composed as validated.
    - id: P3
      severity: medium
      finding: >-
        The plan's target figures are stated IN THE BLIND BRIEF ITSELF
        (blind_rederivation.quantity: "The record asserts 375 and +11.52"). A
        blind brief that names its answer spends most of what blindness buys.
        The remaining blindness -- to the implementations -- is the part that
        matters and was preserved, but the round should record which kind it
        had.
    - id: P4
      severity: medium
      finding: >-
        "The smallest integer n at which the attack is cheaper" is AMBIGUOUS as
        the plan states it, because the margin is not monotone: ceil(n/m) steps
        at each multiple of m and doubles the relation store. Under the plan's
        own parameters the cheaper set is {3} union [306, 1200], the n = 3 point
        being an artefact of charging the baseline a fixed 2^30-point store in a
        group of 2^3 elements. The plan states no scan domain and does not say
        whether it wants the first crossing or the last sign change. Both
        candidate answers here are persistent crossovers, so nothing turns on it
        numerically -- but the ambiguity is a plan defect on its own merits.
    - id: P5
      severity: medium
      finding: >-
        TWO INSTANCES OF THIS TASK RAN CONCURRENTLY in this worktree and both
        wrote to the same write_scope. report.md and attestation.yaml were
        written by the other instance at 15:21:13 and 15:21:24 UTC while I was
        running verification; its attestation in turn discloses my
        verification/ directory as foreign. Both disclosures are honest and both
        are correct. The Coordinator should read this directory as the product
        of two sessions, not one, and should not count the two reports as
        independent corroboration -- they share the same frozen figures and the
        same localisation.
    - id: P6
      severity: low
      finding: >-
        The plan says the attack's memory is the MAXIMUM of the relation store
        and the working set; memory_charged_cost.py sums them in log2 space
        (log2_add). The terms differ by >= 13 bits everywhere here so the two
        agree to about 2e-6 bits, but it is a statement/implementation mismatch
        that would matter by up to 1 bit where the terms were comparable.

  verdict: incomplete
  verdict_scope: >-
    ON MY JOINT ONLY (J6-BLIND), and it is a verdict about what the joint
    established, not about the record. I own one joint and cannot see the
    others; this is not a verdict on the claim.
  verdict_rationale: >-
    The companion attestation records `breaks`, scoped to "the joint as
    specified rather than the record's arithmetic". I agree with every fact
    behind that and choose a different word. `breaks` reads downstream as "the
    load-bearing step does not hold", and that is not what happened: the
    quantity was not refuted, it was NOT TESTED, because the statement handed to
    the re-derivation specified a different memory model. Everything checkable
    about the record checked out -- attack time, baseline time, baseline memory,
    argmin m, and the entire dense branch reproduce exactly from an independent
    implementation, and the sparse term is faithfully implemented from a
    `retrieved` source that re-checks it at n = 571. `incomplete` tells the
    Coordinator the record is unimpeached and the verification it commissioned
    still needs doing; `breaks` would invite it to discount the record. The
    second reading is not supported by the evidence.
  disagreement_with_companion_attestation:
    - >-
      verdict word: `incomplete` here against `breaks` there, on identical
      facts. Both are scoped to the joint; the difference is what a Coordinator
      should do next.
    - >-
      finding F3: I narrow "dense and sparse assume different column counts" to
      "the same column count coarsened by 0.54 bits; the material omission is
      the n^3/m row factor".

  method:
    reproduction: >-
      reran the frozen rederivation.py and localise.py standalone; both
      reproduce their recorded outputs exactly (localisation.json byte for
      byte, figures-before-reading.json modulo the timestamp).
    my_own_verification_code: >-
      coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/verification/verify.py
      -- checks A (scan-window sensitivity), B (record vs its own raw result),
      C (second-implementation coverage), D (crossover-definition ambiguity),
      E (term decomposition of the gap). Output at verification/verification.json.
    limitation_of_check_C: >-
      check C uses keyword greps over independent_arith.py and its single
      matching line is a FALSE POSITIVE (a Table 3 data row). The conclusion in
      V4 does not rest on it: I read the file's declared coverage list and its
      output keys directly. Recorded because the companion report correctly
      identified this weakness and it would be dishonest to leave it implicit.
    runs_used: 8 of a permitted 20
    peak_memory: about 15 MB of a permitted 2 GB

  procedure_deviations:
    - deviation: >-
        I wrote report-phase-two.md and attestation-phase-two.yaml rather than
        report.md and attestation.yaml, which my task card named.
      reason: >-
        those two paths were already occupied by the other concurrent instance
        of this task, with honest and substantively correct content. Overwriting
        another agent's attestation would be recording an attestation I did not
        obtain, which AGENTS.md forbids outright. I snapshotted both and wrote
        alongside them instead.
      scope: >-
        both new files are inside the assigned write_scope
        coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/
    - deviation: >-
        I added a verification/ subdirectory (verify.py, verification.json,
        rerun-*, and the two phase-one snapshots).
      reason: >-
        my task card permits a separate verification log, and the rerun outputs
        had to go somewhere other than the frozen figures file.
      scope: inside the assigned write_scope
    - deviation: >-
        I read knowledge/literature/KN-LIT-e77232.md, not listed in the
        handoff's inputs.
      reason: >-
        to check the provenance of the producer's sparse formula, after the
        comparison. Not in blind_from.

  frozen_artifacts_untouched:
    figures_before_reading_json: >-
      sha256 301cbd861809dd3f2bb997621541c59be487743d1e320bc2280f61dfe8e67596,
      unchanged
    rederivation_py: >-
      sha256 8f2f7bd6ce78e7060da1b0257e2579f53292f9eef1b077b28a908c6e9f534a9c,
      unchanged
    i_edited_neither: true

  claims_asserted: none
  scope_note: >-
    This attestation supports no claim about the security of B-409, K-409,
    B-571 or K-571. Both cost models compared are heuristic estimates
    conditional on Semaev's Assumption 1, with non-identical operation units on
    the two sides and no conversion factor. No solve, relation or certificate is
    computed anywhere in this task. The record's own degree_bound_sensitivity
    notes that a degree bound of 5 adds 19.4 bits at n = 409, exceeding every
    effect discussed here.
  wrote_outside_write_scope: false
  committed_anything: false
  edited_any_ledger_record_contract_manifest_or_cost_record: false
  edited_another_agents_report_or_attestation: false
