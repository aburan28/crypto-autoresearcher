    - source: knowledge/literature/KN-LIT-e77232.md
      provenance: internal
      verified_by: validator TASK-20260913-da3982
      load_bearing: true
      caveat: >-
        The ellipticnews comment thread of April-May 2015 exists in this program
        ONLY through this record; the blog thread itself was not retrieved by
        this session. Galbraith's C(N+3,4)^2 memory formula and Semaev's
        n^3/m-monomials sparsity reply are both relayed through it, and that
        record states of the latter "The sparsity formulas are his, not
        re-derived." The report's finding that the record's dense reading is
        Galbraith's own published formula rests on this relay, as does the
        record's entire sparse reading.
    - source: knowledge/open-problems/KN-OPEN-86e7e1.md
      provenance: internal
      verified_by: validator TASK-20260913-da3982
    - source: van Oorschot-Wiener parallel collision search (KN-TECH-006, KN-LIT-012)
      provenance: recalled
      load_bearing: false
      note: >-
        NOT opened by this session. Named only to record that every baseline
        figure, and therefore every margin and crossover in CLAIM A, rests on
        sources this task did not read. Nothing in the J1 or J4 verdicts depends
        on them; auditing them is J2's.
    - source: >-
        Faugere F4 / XL / Macaulay-matrix complexity conventions used in the
        report's argument that width^omega time implies width^2 memory
      provenance: recalled
      load_bearing: partially
      note: >-
        The step from "Semaev's [n(m-1)]^{4omega} equals W^omega" to "the object
        being costed is a W x W matrix whose dense storage is W^2" uses standard
        Groebner/XL complexity conventions held from the model's own knowledge;
        no textbook or paper was retrieved for it. The arithmetic identity
        W^omega = [n(m-1)]^{4omega} up to the 4!^omega constant IS derived here
        from the frozen text and is checkable in
        work/j1_memory_from_text.json. The XL solvability condition that
        motivates rank ~ W is recalled and a reviewer should treat it as a
        pointer; Semaev's own proposal of "XL with Coppersmith's block
        Wiedemann" is relayed through KN-LIT-e77232 rather than recalled.

