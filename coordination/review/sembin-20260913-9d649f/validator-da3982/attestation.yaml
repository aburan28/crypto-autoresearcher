  verdicts:
    J1: holds
    J4: holds
    proves_too_much: all four objects met their declared failure signature; none failed

  verdict: holds

  verdict_scope: >
    This verdict covers J1 and J4 ONLY. It is not a verdict on CLAIM A or CLAIM B.
    Four of the six joints are owned by other tasks and are invisible to this one
    by construction, so a whole-claim verdict here would be an opinion formed from
    a third of the evidence. The Coordinator composes.

  recorded_limitations_not_affecting_the_verdict:
    - >
      F2 -- CLAIM A's "two defensible storage readings" is narrower than the
      defensible family (crossovers span 344 to 435, not 375 to 435) and the
      selection is unfavourable to Semaev, since 3 of 4 accountings put him ahead
      at n = 409.
    - >
      F3 -- the record's memory model is never compared against the 34 memory
      measurements of this same object in its own frozen source (Tables 1-2).
    - >
      F4 -- the gap between the record's two readings widens with N (about 7 bits
      at N ~ 50, where the measurements are; 19-21 bits at N = 2790-6286, where
      the claims are) and this widening is not disclosed.
    - >
      F6 -- the published yield-loss range "25 to 28 bits per unit of t at the
      FIPS labels" is wrong; re-derivation gives 27.7 to 44.0 at the manifest's
      own m*. Cause, a hardcoded m = 10 plus a range taken over a subset of
      rows. The error runs against the record's own conclusion.
    - >
      F7 -- raw-result.json's mechanism.per_n[*].best_t_by_net reports the WORST
      t as best (3, 3, 2, 2 where the answer is 10), from an argmax/argmin sign
      error; the sibling field name and the manifest's "the net is negative"
      prose are inverted relative to the values. Substance unaffected.
    - >
      F8 -- "2-3 bits per unit of t" is the derivative at t = m, not a bound over
      t; the maximum is 31-32 bits (macaulay4) or 12 (f4_std).
    - >
      F9 -- under block_n4w the solving cost is t-independent, so t* = m* is
      vacuous under that one reading of the three.

  declared_breaking_artifacts_status:
    J1_accounting_differs_by_more_than_5_bits: >
      TRIGGERED ON ITS FACE and reported rather than argued away: a rows x cols
      dense accounting differs from the record's dense reading by 19.4 bits at
      n = 409. My reading, for the Coordinator to weigh, is that this is a THIRD
      accounting alongside a disclosed upper bound and a disclosed lower one
      rather than a correction of a mis-stated quantity, and that the Tables 1-2
      measurements refute it as an upper bound under the peak reading while
      sustaining width^2. Hence `holds` rather than `breaks`.
    J1_dense_reading_has_no_textual_basis: >
      DOES NOT FIRE. Neither reading has a basis in the paper, which states no
      memory model at all; both have one in the recorded ePrint dispute
      (KN-LIT-e77232), one from each disputant. Retiring width^2 would leave only
      the defendant's own estimate. This CONTRADICTS the Coordinator's recorded
      prior, stated plainly as the plan directs.
    J4_regime_where_yield_loss_is_not_exponential: >
      DOES NOT FIRE. Zero saturated cells over n in [250,600], m in [2,20],
      2 <= t <= m; maximum log2 A = -1.0 exactly, at the m = 2 corner, which is
      never optimal.
    J4_solving_reading_exponential_in_m_minus_t: >
      DOES NOT FIRE. Per-unit increments DECREASE as t falls (42.4, 11.3, 6.8,
      4.9, ... at n = 409, m = 20); cumulative saving grows like log(m - t), so
      the cost ratio is polynomial. block_n4w has no t-dependence at all.
    J4_optimizer_does_not_sweep_t: >
      DOES NOT FIRE. Established four ways: an independent optimizer agreeing on
      m* and t*; a no-yield null moving t* from m to 2 at every n; a targeted
      probe recovering each of t = 2, 3, 5, 7 exactly; and object 4 moving t* by
      28 links at a threshold matching the yield law 5/5.

  deliverables:
    - coordination/review/sembin-20260913-9d649f/validator-da3982/report.md
    - coordination/review/sembin-20260913-9d649f/validator-da3982/attestation.yaml
    - coordination/review/sembin-20260913-9d649f/validator-da3982/proves-too-much.json
    - coordination/review/sembin-20260913-9d649f/validator-da3982/scratch/ (working
        scripts and their JSON output; every number in report.md is reproducible
        by running them)

  write_scope_respected: true
  write_scope_detail: >
    Every file written by this task is under
    coordination/review/sembin-20260913-9d649f/validator-da3982/. No ledger
    record, experiment contract, run manifest, COST record, or knowledge entry
    was modified. Nothing was committed; the Coordinator commits.

  what_this_attestation_does_not_assert: >
    That the accounting is correct is not evidence that the chained-S_3 algorithm
    works, and no verdict here bears on the security of any curve in either
    direction. Both sides of the comparison are heuristic cost models. Semaev's
    Assumption 1 is taken as an input at degree bound 4 throughout, Assumption 2
    is untouched, and the asymptotic bound (17) is untouched. The baseline
    charging and the metric set are other tasks' joints and every crossover
    quoted in my report inherits whatever is true of them.
