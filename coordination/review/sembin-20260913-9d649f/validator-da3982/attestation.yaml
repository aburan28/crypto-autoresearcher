      provenance: recalled
      note: >
        NOT opened by me. The record relays it from KN-TECH-006 and KN-LIT-012,
        and the run's own deviation D2 records that KN-LIT-012's full text was
        not re-read. I read neither. It is J2's joint, not mine, and no
