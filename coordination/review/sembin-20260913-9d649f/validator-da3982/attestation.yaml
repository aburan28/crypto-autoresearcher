    (memory_charged_cost.py, joint_balance.py).

  independence_caveats:
    - >
      Objects 1, 2 and 4 were executed against the producer's own machinery, by
      design: the question a proves-too-much object asks is whether THAT
      machinery goes through where its conclusion is false. Object 2's width
      re-derivation and object 3's crossover shifts were additionally reproduced
      in my own implementation.
    - >
      My independent optimizer and memory accountings were written from the
      frozen text and the published formulas. They are independent of the
      producer's implementation but NOT of the frozen source's own presentation,
      so a misreading shared with the producer would not be caught by my
      agreement with it. That is the failure mode the separate blind
      re-derivation exists to address, and this attestation does not claim to
      cover it.
    - >
      A first pass of proves_too_much.py implemented object 4 with the sign
      inverted (penalising rather than rewarding a shortened chain), which
      produced a spurious failure. Corrected, and both signs are reported. The
      error was the validator's, not the producer's.

