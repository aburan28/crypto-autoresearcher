review_plan:
  id: REVIEW-SEMBIN-20260913-9d649f
  written_at: '2026-09-13'
  written_by: coordinator
  opened_by_handoff: TASK-20260913-da3982
  goal_ids: [GOAL-SEMBIN-5078bc, GOAL-SEMBIN-cbf422]
  batch_id: BATCH-9d649f
  runs_under_review: [RUN-SEMBIN-121b59, RUN-SEMBIN-aa5161]
  written_before_any_reviewer_ran: true

  claim_under_review: >
    TWO claims, stated as their producer stated them in the run manifests, not
    as the Coordinator would restate them.

    CLAIM A (RUN-SEMBIN-121b59, COST-SEMBIN-8d123b, H-SEMBIN-83999d):
    "Charging memory on both sides of Semaev 2015's Table 3 comparison against
    van Oorschot-Wiener parallel rho moves the crossover in n from 303 to 375
    under Semaev's own sparse storage reading and to 435 under a dense reading.
    The whole shift is attributable to Semaev's relation store rather than to
    charging the baseline's distinguished-point store (matched-null share = 0).
    At the FIPS parameter label n = 409 the chained algorithm is ahead by 37.78
    bits under time alone, behind by 8.79 bits under the dense time-memory
    product, and ahead by 11.52 bits under the sparse one -- a 46.6-bit swing
    straddling zero between two defensible storage readings of the same
    algorithm."

    CLAIM B (RUN-SEMBIN-aa5161, H-SEMBIN-b1708c): "Re-solving Semaev's
    two-stage cost balance jointly over (m, t) rather than over m with t = m
    returns t* = m* at every n in [250, 600] under all three solving-cost
    readings; the optimum is never interior; and the crossover does not move.
    The mechanism is that yield loss from t < m is exponential in n (25-28 bits
    per unit of t at the FIPS labels under eq. (11)) while every available
    solving-cost saving is polynomial in n (2-3 bits per unit of t). Semaev's
    choice of t = m is therefore optimal under his own cost model at concrete
    n, not merely asymptotically indifferent."

  coordinator_prior: >
    Recorded before any reviewer runs, so that concurrence can be told apart
    from agreement with what the Coordinator already believed. The Coordinator
    is on record as having been WRONG once in this batch already: the
    EXP-SEMBIN-81dc96 contract preregistered t* < m* strictly, and the
    computation refuted it. That is the calibration context for what follows.

    ON CLAIM A the Coordinator expects the arithmetic to hold and the
    MODELLING to be the weak point, in this order of expected severity:
      1. The dense working-set reading (width^2 bits for a degree-4 Macaulay
         matrix) is expected to be the least defensible number in the record.
         The Coordinator's prior is that a reviewer will argue it is not a
         reading Semaev's own text supports at all, and that the honest dense
         figure should be a sparse-times-fill-factor estimate rather than a
         square. If that argument lands, the 435 crossover goes with it and
         only the 375 survives -- which would REMOVE the n = 409 flip and
         substantially weaken the record's headline.
      2. The baseline is charged at its memory endpoint with NO time penalty
         for a small distinguished-point store. The Coordinator's prior is that
         this is a real asymmetry favouring the baseline, that it is disclosed,
         and that it is nonetheless large enough that a reviewer may call the
         comparison unfair in the baseline's favour -- i.e. the record may be
         UNDERSTATING Semaev's advantage, not overstating it.
      3. time_memory_product and area_time_AT coincide by construction. The
         Coordinator expects a reviewer to say the record reports four metrics
         but supplies only three independent ones, and that the "four metrics"
         framing overstates the corroboration.
    The Coordinator does NOT expect a reviewer to overturn the 302 baseline
    reproduction, the matched-null attribution, or the ceiling-discrepancy
    table.

    ON CLAIM B the Coordinator expects the result to HOLD and expects the
    interesting objection to be about SCOPE rather than correctness. Prior: the
    exponential-versus-polynomial argument is robust to every parameter the run
    sweeps, because it is a statement about the shape of eq. (11) rather than
    about any particular constant. The Coordinator's prior is that the genuine
    limitation is the one the run itself names -- if eq. (11) overstates
    realized yield MORE at t = m than at t < m, the comparison inverts -- and
    that a reviewer will and should insist the closure be scoped to "under the
    published yield law" rather than stated flatly. The Coordinator expects
    this claim to survive review in that narrowed form.

    ON THE DECLINED STOPPING RULE the Coordinator's prior is uncomfortable and
    is recorded as such. The run declined a stopping rule that said to halt on
    a fitted c materially different from 1.6986, on the argument that c
    approaches 1.6986 from below along the direction the o(1) cofactor
    predicts. The Coordinator believes that argument is correct AND believes it
    is exactly the shape of reasoning that hides a real defect. Prior: a
    reviewer who re-derives the fit independently will confirm the convergence.
    If instead the fitted c is found to be stable rather than converging, the
    implementation is defective and BOTH claims fall, because both consume the
    same cost formulas.

  joints:
    - joint: >
        J1 -- SEMAEV'S MEMORY MODEL. That the peak memory of the chained-S_3
        algorithm at (n, m) is max(relation store, Groebner working set), with
        the store at 2^{ceil(n/m)} rows of (m*k + 2n) bits and the working set
        derived from the degree-4 Macaulay width of the chained system in
        N = m*k + 2n... variables -- dense reading width^2 bits, sparse reading
        width bits. If this accounting is wrong, every crossover in CLAIM A is
        wrong.
      assigned_to: TASK-20260913-da3982
      attack_plan: >
        Do not check the arithmetic; independent_arith.py already recomputes the
        widths and store sizes in exact integers and the transcription checker
        confirms the record quotes them faithfully. Attack the MODEL. (a) Read
        Sections 3, 4.3 and 4.5.2 of inputs/SEMAEV-2015-310/paper_fulltext.md
        and establish what the paper itself says is stored, and whether the
        Galbraith memory objection in the ePrint thread (recorded in
        KN-OPEN-86e7e1) was answered with a count this record should be using
        instead. (b) Decide whether the DENSE width^2 reading is defensible at
        all, or whether it is a straw reading the record should not have
        offered even as an upper bound. The Coordinator's prior is that it is
        NOT defensible; if you agree, say so, because the 435 crossover and the
        n = 409 flip both rest on it. (c) Check the variable count N: the record
        uses 2790, 4099 and 6286 at (310,10), (409,11) and (571,12). Re-derive
        N from the chain structure in Section 3 and say whether those are the
        right counts for a t = m chain. (d) Check whether the working set and
        the relation store can in fact be charged as a MAX rather than a SUM --
        i.e. whether stage 1's solving and the accumulating store overlap in
        time. A sum rather than a max moves every dense figure up.
      breaking_artifact: >
        A memory accounting derived from the frozen text that differs from the
        record's by more than 5 bits at any FIPS label, with the section it
        comes from; OR a demonstration that the dense reading has no textual
        basis, which retires the 435 crossover.
    - joint: >
        J2 -- THE BASELINE IS CHARGED SYMMETRICALLY. That van Oorschot-Wiener
        parallel rho is charged at 0.886*2^{n/2} time and (store_log2 + log2 3n)
        memory bits with store_log2 = 30, with no time penalty for the small
        store, and that this is a fair comparator rather than one chosen to make
        the memory charge look decisive.
      assigned_to: TASK-20260913-cf9d98
      attack_plan: >
        Attack the comparison, not Semaev. (a) The store_log2 = 30 choice is
        arbitrary and unswept. Recompute the crossovers with store_log2 at 20,
        40 and 60 and report how far the 375 and 435 figures move; if they are
        sensitive to it, the record has quoted a crossover that depends on an
        unstated parameter. (b) The vOW time-memory TRADEOFF is not modelled: a
        coarser distinguished-point criterion shrinks the store at a time cost,
        and the record charges the baseline at its cheap-memory endpoint with no
        time penalty. Work out roughly what that penalty is and say whether
        charging it would move the crossover DOWN -- i.e. whether the record is
        understating Semaev. This is the direction the Coordinator expects and
        it is the direction that would make the record too kind to the baseline,
        so it is the one a red team should most want to find. (c) The 0.886
        constant is RELAYED from KN-TECH-006 and KN-LIT-012, and KN-LIT-012
        records that its own full text was not re-read. Say whether a wrong
        constant could matter: it is a 0.17-bit effect, so the answer is
        probably no, and saying so plainly closes it. (d) q is taken as 2^n,
        neglecting the FIPS cofactor of 2 or 4, which flatters the baseline.
        Quantify it.
      breaking_artifact: >
        A crossover figure that moves by more than 10 in n under a defensible
        change to the baseline's charging, with the recomputation; OR a
        demonstration that the comparison is asymmetric in a direction the
        record does not disclose.
    - joint: >
        J3 -- THE METRIC SET, AND THE n = 409 FLIP. That the four declared
        metrics are an honest spanning set rather than a set chosen so that one
        of them flips n = 409, and that reporting time_memory_product and
        area_time_AT separately -- when they coincide by construction here --
        does not overstate corroboration.
      assigned_to: TASK-20260913-cf9d98
      attack_plan: >
        (a) The record admits AT and the product coincide. Say whether the
        record's own framing ("four metrics") is therefore misleading and should
        be three. (b) Construct at least one metric the Coordinator did NOT
        choose -- a memory-weighted time such as time * memory^alpha for alpha
        in (0,1), or a fixed-memory-budget model in which the attack is charged
        the time it needs when memory is capped at 2^40 bits -- and report
        whether the n = 409 verdict flips under it. The Coordinator's prior is
        that a fixed-budget metric is the MOST realistic of all of them and is
        missing from the record. (c) State plainly whether "the verdict at
        n = 409 is decided by the memory model" survives your own metric, or
        whether it is an artifact of the two the record happens to report.
      breaking_artifact: >
        A defensible metric under which the n = 409 swing does not straddle
        zero, which would make the headline an artifact of metric choice; OR a
        fixed-memory-budget computation the record owes and does not have.
    - joint: >
        J4 -- THE EXPONENTIAL-VERSUS-POLYNOMIAL MECHANISM OF CLAIM B. That
        under eq. (11), P = 1 - exp(-2^{tk-n}/t!), shortening the chain from
        t = m to t < m costs yield exponentially in n while every available
        solving-cost saving is polynomial in n, so no t < m can pay.
      assigned_to: TASK-20260913-da3982
      attack_plan: >
        (a) Re-derive the yield-loss scaling from eq. (11) as stated in Section
        4.3 of the frozen text, independently of the implementation. The claim
        needs 2^{tk-n} to be the operative term and t! to be dominated; check
        the regime boundary where that stops being true, because near
        tk = n the exponential collapses to a linear term and the argument's
        premise fails there. Say whether any (n, m, t) in the swept range sits
        in that regime. (b) The record charges solving savings at 2-3 bits per
        unit of t. Verify that against the Macaulay-width model AND against the
        f4_std model: if any solving-cost reading is exponential in (m - t)
        rather than polynomial, t < m can pay and CLAIM B is false for that
        reading. Semaev's own Section 3 step 3 says the solving time "drops
        dramatically" for t < m and Tables 1-2 measure it; reconcile
        "dramatically" with "2-3 bits" or report that you cannot. (c) Check
        that the run's known_false control has teeth: it asserts that a
        t-independent solving cost returns t = m. Confirm that the optimizer
        actually varies t -- a bug that ignores t would produce t* = m*
        everywhere for a trivial reason and pass that control.
      breaking_artifact: >
        A regime in the swept range where eq. (11)'s yield loss is not
        exponential; OR a solving-cost reading, drawn from the frozen text,
        under which the saving is exponential in (m - t); OR a demonstration
        that the optimizer does not genuinely sweep t.
    - joint: >
        J5 -- THE DECLINED STOPPING RULE. That the fitted exponent constant c
        rising toward 1.6986 from below is the o(1) cofactor of the published
        bound rather than an implementation defect, and that declining the
        contract's stopping rule was therefore correct.
      assigned_to: TASK-20260913-cf9d98
      attack_plan: >
        This is the joint the Coordinator most wants attacked and is on record
        as uncomfortable about. Declining a stopping rule because the
        disagreement has been explained is precisely the move that ships a
        defect. (a) Independently fit c from the recomputed cost surface -- you
        may read raw-result.json but treat joint_balance.py's own fitting code
        as suspect -- and report whether c is CONVERGING to 1.6986 or merely
        SITTING below it. Monotone approach with ln m / ln n approaching 1/2 is
        the innocent signature; a stable offset is the guilty one. (b) Derive
        independently what eq. (17)'s m* ~ sqrt(2 ln 2 n / ln n) predicts for
        the argmin at n = 10^3, 10^5, 10^7 and compare against the recomputed
        argmin. The record says the published law understates the true argmin by
        4-15%; confirm or refute that range. (c) If you conclude the
        implementation is defective, say so unambiguously: both claims consume
        the same cost formulas and both fall.
      breaking_artifact: >
        An independent fit showing c stable rather than converging, which
        condemns the implementation; OR confirmation of monotone convergence
        with the ladder, which discharges the deviation.
    - joint: >
        J6 -- THE SUBSTITUTED CONTROL. That replacing the contract's prime-field
        index-calculus nearby-object control with eq. (4), Semaev's single
        high-degree summation polynomial, preserves enough of the control's
        function to admit CLAIM A at all -- and that the stopping rule naming
        the prime-field control is honestly recorded as unevaluable rather than
        as satisfied.
      assigned_to: TASK-20260913-cf9d98
      attack_plan: >
        (a) eq. (4) is a member of the SAME family as the object under test, so
        it cannot detect a bias shared by the family -- which is the whole
        function the prime-field control was to serve. Say whether that makes
        the substitution adequate, inadequate-but-admissible-with-disclosure, or
        inadequate. (b) Search this repository's corpus for any prime-field
        index-calculus cost model the run missed (`search_knowledge`, and
        knowledge/techniques/, knowledge/literature/). The run asserts none
        exists. If one does, the substitution was unnecessary and the record
        should be corrected. (c) Verify the eq. (4) control has teeth: it
        reports the chain cheaper by 1957-5977 bits, which is such a large
        margin that it may pass trivially and detect nothing. Say what a
        FAILING eq. (4) control would even have looked like.
      breaking_artifact: >
        A prime-field cost model located in the corpus, which retires the
        substitution; OR an argument that the eq. (4) control is vacuous, which
        leaves CLAIM A with five controls rather than six.

  blindness:
    mutual: true
    mutual_note: >
      TASK-20260913-da3982 (validator) and TASK-20260913-cf9d98 (red team) may
      not read each other's reports, and neither may read
      TASK-20260913-ec11c4's. Each attests to what it read. They own disjoint
      joints, so neither needs the other's work: J1 and J4 are accounting and
      derivation joints, J2, J3, J5 and J6 are comparison-fairness and
      control-adequacy joints.
    lifted_for: []
    rationale: null

  proves_too_much:
    objects:
      - >
        OBJECT 1, n = 163. Semaev's own Table 3 puts stage 1 far above rho for
        every n it prints below 300, so the conclusion "the chained algorithm
        beats rho" is KNOWN FALSE at n = 163. The costing machinery must report
        Semaev LOSING there under every metric and both storage readings.
      - >
        OBJECT 2, eq. (4), the unchained single summation polynomial S_{m+1} of
        degree 2^{m-2} per variable. The paper's entire contribution is that the
        chain beats it, so "this object is competitive" is KNOWN FALSE. The same
        cost machinery must report it catastrophically worse.
      - >
        OBJECT 3, a free-yield null. Set eq. (11)'s probability to 1, so
        decomposition never fails. The conclusion "charging a free lunch makes
        the attack worse" is KNOWN FALSE, so the crossover must move DOWN in n,
        never up. This detects an inverted sign convention, which no amount of
        agreement between the two implementations would catch since both share
        the convention.
      - >
        OBJECT 4, for CLAIM B, a solving cost made exponential in (m - t) -- a
        model in which shortening the chain MUST pay. "t* = m*" is known false
        under it. If the optimizer still returns t* = m*, it is not optimizing
        over t and CLAIM B is vacuous rather than true.
    failure_signature: >
      On objects 1, 2 and 4 the machinery must return the KNOWN-FALSE-refuting
      answer (Semaev loses at 163; eq. (4) is far worse; t* < m* under an
      exponential-in-(m-t) solving cost). On object 3 the crossover must
      DECREASE. An argument or a cost model that goes through where its
      conclusion is false is wrong somewhere nobody has read closely enough,
      and objects 3 and 4 are the two the run did not already run in this form.
    assigned_to: TASK-20260913-da3982

  blind_rederivation:
    required: true
    quantity: >
      THE SINGLE LOAD-BEARING QUANTITY OF THIS BATCH: the smallest integer n at
      which the chained-S_3 index-calculus attack on E(F_{2^n}) is cheaper than
      van Oorschot-Wiener parallel rho under the cost measure (time * memory),
      with the attack's memory taken as the maximum of its relation store and
      its degree-4 Macaulay working set under a SPARSE storage reading (one
      field element per nonzero), and the baseline's memory taken as a
      distinguished-point store of 2^30 points at 3n bits each. Report that
      integer, and separately report the signed margin in bits at n = 409 under
      the same measure. The record asserts 375 and +11.52 respectively; do not
      read those figures before you have your own.
    parameters: >
      Attack time m! * 2^{n/m} * n^{4*omega} for stage 1 and 2^{2n/m} for stage
      2, minimized over integer m in [2, 20], with omega = 3 and the stage-2
      linear-algebra exponent 2. Relation store 2^{ceil(n/m)} rows of
      (m*ceil(n/m) + 2n) bits. Working set from the number of degree-<=4
      monomials in N = m*ceil(n/m) + 2n variables. Baseline time
      0.886 * 2^{n/2} group operations. Yield eq. (11),
      P = 1 - exp(-2^{t*k-n}/t!), with t = m and k = ceil(n/m). These are the
      inputs exactly as the producer used them; every one of them is stated
      here so that you never need the producer's code to obtain them.
    blind_from:
      - experiments/EXP-SEMBIN-f4a17b/code/memory_charged_cost.py
      - experiments/EXP-SEMBIN-81dc96/code/joint_balance.py
      - experiments/EXP-SEMBIN-81dc96/code/independent_arith.py
      - experiments/EXP-SEMBIN-f4a17b/code/verify_record_transcription.py
      - experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/
      - experiments/EXP-SEMBIN-81dc96/runs/RUN-SEMBIN-aa5161/
    blind_from_rationale: >
      NOT replication. Recomputing this crossover from the producer's own
      implementation would reproduce a wrong-but-self-consistent cost model
      faithfully, which is exactly the failure mode the two existing
      implementations cannot detect: independent_arith.py is method-independent
      but was written by the same session from the same reading of the source,
      and its own record says so. Agreement from a re-derivation that never saw
      the code is evidence about the crossover; disagreement localises to one of
      two named implementations.
    assigned_to: TASK-20260913-ec11c4

  what_this_round_can_change: >
    It can move H-SEMBIN-83999d and H-SEMBIN-b1708c past `approved`, and it can
    support or refuse the closure of KN-OPEN-94f456 as an optimization
    question. It CANNOT promote anything to a claim about curve security, and no
    verdict here bears on Semaev's Assumption 2 or on the asymptotic bound (17).
  review_tier_rationale: >
    review-adversarial at xhigh, not review-breakthrough at max. Neither claim
    is a breakthrough, a closure of a goal, or a contradiction of a validated
    evidence record: CLAIM A adds a disclosed axis to a published comparison and
    CLAIM B confirms a published choice was optimal. If a reviewer concludes
    that CLAIM A should be presented as contradicting Semaev's Section 4.5.2
    four-curve conclusion, THAT would require review-breakthrough at max in a
    further independent round, and this plan does not authorize it.

  procedure_deviations:
    - >
      The executor handoff TASK-20260913-51a7ef was written AFTER the two runs
      executed, not before. The runs were executed against the frozen
      contracts approved in DEC-20260913-ebd639, which is the authority that
      matters, but the handoff envelope that should have carried the write
      scope and budget was reconstructed retrospectively from what the runs
      actually did. Disclosed rather than backdated: the handoff's
      `recorded_at` says so on its face.
