  citation_provenance:
    - source: inputs/SEMAEV-2015-310/paper_fulltext.md
      provenance: internal
      note: the frozen source, read in the repository
    - source: experiments/EXP-PFDR-c04716/runs/STATIC-001/concrete-cost.yaml
      provenance: internal
      note: >
        committed record, opened and parsed. Every cell is conditional on
        HEUR-001 of H-PFDR-06fd60, which that record itself prices at a 0.05
        prior, is a zero-run static derivation, and is stated in field
        operations against a group-operation baseline (kappa = 1). Nothing in
        report.md asserts prime-field index calculus is fast; J2(f) turns on
        the difference between two baseline conventions applied to the same
        cells.
    - source: van Oorschot and Wiener, parallel collision search, J. Cryptology 1999
      provenance: recalled
      note: >
        NOT opened by me. The tradeoff model T = W(1/M + 1/w),
        Mem = 3n max(w, M) is my own restatement of the distinguished-point
        method as KN-TECH-006 and KN-LIT-012 (both read) describe it. The
        load-bearing consequence -- that T*Mem is invariant along the curve and
        the record's operating point is dominated -- follows from the structure,
        not from any constant, and is confirmed by a numeric grid over (w, M).
    - source: "|Aut| = 2n for a Koblitz curve"
      provenance: recalled
      note: >
        my own step, applying KN-TECH-018's sqrt(|Aut|) rule (corpus, read).
        Not load-bearing: dropping it leaves the S5 sparse crossover at 441.
    - source: crypto-autoresearcher search_knowledge MCP
      provenance: internal
      note: >
        NOT AVAILABLE in this session -- GetDynamicTools returns no matching
        namespace and the derived index is empty in this checkout. The J6
        corpus search was therefore a filesystem search of knowledge/, ledger/
        and experiments/. Per AGENTS.md, absence of a result there is not
        evidence of absence; what was found is present regardless.

  # --- things a composing Coordinator should know -------------------------
  procedure_notes:
    - >
      report.md flags a defect in the review plan's own
      blind_rederivation.parameters block: read literally it specifies a memory
      model that is neither the record's dense nor its sparse reading and
      returns crossover 306 against the 375 the plan tells the re-deriver to
      expect. This is raised as a procedure_deviations item for the
      Coordinator, not as a finding, and this task takes no position on which
      reading of the memory model is correct.
    - >
      The Coordinator's recorded prior on J2 -- that the absent baseline
      time-memory tradeoff makes the record too KIND to the baseline -- is
      refuted in report.md, in the direction opposite to the prior. This is
      flagged explicitly because a pre-recorded prior that the review overturns
      is the informative case the review architecture exists to capture.
    - >
      Two corrections are owed to documents other than the run: the FIPS
      cofactor direction is inverted in the review plan as well as in the
      record, and the contract's D3 stopping rule fires on a faithful
      instantiation of the control it mandates.
  claim_tier: >
    Everything in report.md is bound_kind heuristic_estimate under
    docs/claims-and-verification.md. No curve was instantiated, no relation
