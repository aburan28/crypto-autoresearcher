blind_inputs:
  task_id: TASK-20260927-7d51ae
  review_plan_id: REVIEW-AUXIN-20260927-7b6678
  sources_of_recipes:
    corrective: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
    incorporated_by_hash: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
  source_note: >-
    The corrective file declares which fields it supersedes and incorporates
    the rest of the second file by sha256. Before anything else, hash the
    second file and compare with the digest the corrective file states;
    report a mismatch under Q0 and stop. Use the corrective file's
    governing-text table to decide which file governs each field you use. If
    that table sends a field you need to any third file, do NOT open it:
    record the reference under Q0 and continue with what the two files state.

  what_you_are_testing: >-
    Whether the corrected fields, read together with the incorporated text,
    are fully determined. You are not asked whether they are good choices.
    Your results will be compared with a second implementation written by
    someone who shares nothing with you.

  quantities:
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which the text left you a choice, including: which file
        governs a field; a search start, step order, primality test, acceptance
        rule, tie-break, rounding rule, tolerance type, counting convention,
        gate evaluation mode, unit; or a reference to another file. Quote the
        text, list admissible readings, and name the quantities below that
        depend on the choice. If the text declares a choice immaterial, quote
        that and say whether any value you computed depends on it.
      report: A list. An empty list is a result and is stated as such.
    Q1:
      name: control integers
      definition: >-
        For every control the governing text declares, including field-prime,
        bound-evaluator and planted controls, the integer or integers its
        recipe produces, following the recipe literally with the declared seeds
        and windows.
      report: >-
        Each integer in decimal with its bit length; candidates examined under
        the text's counting convention (or each admissible one); a primality
        certificate for every integer the recipe requires to be prime.
      tolerance: exact
    Q2:
      name: field-prime set and confounder outcomes
      definition: >-
        (a) The members of the field-prime set FP exactly as the governing text
        defines it, and for each member the rule that put it there.
        (b) For each C-FIELD case, the confounder outcome when its field prime
        is presented as r, and the stage at which the outcome is reached.
        (c) The mutation M-FP: rebuild FP from the two C-FIELD values only,
        re-run every control the text declares, and report which, if any,
        fails.
      report: Membership list with rule per member; per-case outcome and stage; per-control pass or fail under M-FP.
      tolerance: exact
    Q3:
      name: bound-evaluator outputs and bin_at_least
      definition: >-
        (a) For the declared-state bound evaluator control: status, witness
        minimiser, lower and upper bound, bin and bin_at_least the rules return;
        and separately the values the text states in advance, if any.
        (b) Construct one declared state of your own in which a branch is a
        BOUND whose value bins NEAR_FLOOR, state it fully, and report the same
        fields for it.
      report: Status, witness, both bounds as log2 to four decimal places, bin, bin_at_least; the text's stated values.
      tolerance: exact status, witness, bin and bin_at_least; bounds 0.01 bit
    Q4:
      name: bin at the boundary
      definition: >-
        The bin and every flag the rules assign to a value exactly at
        3/4 + tau (with tau as the text defines it), and to the nearest
        representable value on each side under the text's arithmetic.
      report: Value, bin, flags, and the clause that decided each.
      tolerance: exact
    Q5:
      name: gate outcomes on the controls
      definition: >-
        For every gate or acceptance test the governing text applies to its
        controls, pass or fail under the declared evaluation mode, with the
        margin.
      report: Gate name, value, threshold, margin, pass or fail.
      tolerance: exact pass or fail

  rules:
    - BL-1 Read ONLY the seven whitelisted paths on your card. Every other path is out of scope, including the producer's execution transcripts.
    - BL-2 Run no git command that shows history (log, show, blame, diff) and read no pull-request text.
    - >-
      BL-3 Choose your own libraries and algorithms and name them with
      versions. Published mathematics from outside the repository is allowed
      and cited with provenance. Transcribe no integer from any source.
    - BL-4 If a permitted file contains a value that looks like an already-computed answer to Q1 to Q5, STOP and report a leak.
    - BL-5 Report on NJ6 only. No verdict on the file as a whole.
    - BL-6 ZERO experiment runs. No Cheon algorithm, no [x^i]P. This is an independent computation.
    - BL-7 Write nothing outside your write scope. Every script, command and raw output goes in computations.json.

  verdict_rule_for_your_attestation: >-
    Put your verdict under `verdicts` as {NJ6: inconclusive}. It is
    inconclusive by design, because you are forbidden to compare. Report Q0 to
    Q5 in full; the composing Coordinator compares them under the plan's keys.
