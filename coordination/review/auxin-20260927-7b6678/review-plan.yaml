  composition:
    who: >-
      The Coordinator, in TASK-20260927-c9bf23, in a session that did NOT run
      TASK-20260927-64ba3f and did not run TASK-20260927-491609. No reviewer
      votes on the whole draft.
    independence_check: >-
      Run python3 tools/check_review_independence.py --plan
      coordination/review/auxin-20260927-7b6678/review-plan.yaml --reports
      coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-7b6678/reviews/ and
      record the result in DEC-20260927-f680f7 whatever it is. Confirm the
      pre-dispatch blind-phase record exists in TASK-20260927-f24bb2's receipt.
    keys:
      K-approve: >-
        All of: every joint holds; NJ5/NJ1 and NJ6 agree on every Q1 to Q5
        value within tolerance; no open material choice; every PTM meets its
        failure signature; every coverage item has a discharging or declaring
        clause its owning joint reports as holding; no regression; no tripwire;
        the independence check passes. DEC-20260927-f680f7 then approves
        AMD-EXP-AUXIN-7e2e3d-20260927-narrow, together with the fields of
        AMD-EXP-AUXIN-7e2e3d-20260926-typed it incorporates by hash, under the
        AGENTS.md standing user authorization, and may move H-AUXIN-6db354 from
        proposed to approved as its status_note provides. Its first next action
        opens an execution batch whose first card provisions and admits the
        declared tools per K-provision. Approval asserts nothing about any curve.
      K-revise-defect: >-
        Any joint breaks on any coverage item, or the draft omits a field
        approval requires. Decision revise; each defect listed with its joint
        and breaking artifact. The next selection point re-reads the ranking's
        switch conditions before choosing a scope.
      K-regression: >-
        Anything in the regression groups breaks. Decision revise, named
        separately from new defects. Per the ranking, a K-regression reopens the
        whole ranking rather than selecting a full third revision.
      K-indeterminate: >-
        NJ5/NJ1 and NJ6 disagree on any value beyond tolerance, or either
        reports a choice the text leaves open that affects a reported quantity
        or a run-time decision. Decision revise. A choice the text explicitly
        declares immaterial with a reason does not fire this key unless an
        implementation found that it changes a value.
      K-layer: >-
        NJ4 breaks on GT-2 (a field with no single governing text) or GT-1
        (incorporation by hash ruled not approvable). Decision revise, and the
        decision records that the ranking's switch condition to option 2 has
        fired.
      K-executed-layer: >-
        NJ1 or NJ2 breaks on an executed-layer defect (pin, tool interface or
        timeout) while NJ3, NJ4 and NJ5 hold. Decision revise, and the decision
        records that the ranking's switch condition to option 1 has fired
        (third refusal from the same layer).
      K-provision: >-
        A declared tool is absent from the base environment. The reviewer
        installs the declared version under scratch and runs the gate as
        written. If the gate then determines admission, NJ2 reads on the text
        and the absence is a dispatch precondition of any future executor card.
        If provisioning fails even under scratch, K-infra applies to NJ2 and the
        decision records that the ranking's K-provision switch condition to
        option 1 has fired.
      K-hypothesis: >-
        The design report, NJ3 or NJ4 finds that H-AUXIN-6db354 cannot carry
        the protocol without change. Composition files a correction or a
        successor hypothesis whose id is minted by the top-level session and
        added to TASK-20260927-c9bf23 and TASK-20260927-f77bfc by a recorded
        queue revision BEFORE the record is written.
      K-route-switch: >-
        RI-1 shows the amendment retires or demotes enough falsification
        conditions that it no longer tests the same hypothesis. Decision
        revise; the ranking's switch condition to option 2 has fired.
      K-infra: >-
        A reviewer could not run a joint (tool not installable, environment
        failure, budget exhausted). That joint reads inconclusive; no approval
        while NJ1, NJ2, NJ5 or NJ6 is inconclusive. Never negative evidence
        about the draft's mathematics or any curve.
      any_tripwire: See tier.tripwires. Composition stops and routes to review-breakthrough.
    h_correction_note: >-
      The H-AUXIN-6db354 interpretation_limits correction (DEC-20260926-96f970
      next_actions item 2) is NOT folded into this batch. DF-5 is discharged in
      the amendment only. The correction remains a later card.

