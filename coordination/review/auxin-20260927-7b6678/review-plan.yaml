      assigned_to: TASK-20260927-7d51ae
      attack_plan: >-
        See blind_rederivation and
        coordination/review/auxin-20260927-7b6678/blind-inputs.yaml. The
        re-deriver is told what to compute and not how.
      breaking_artifact: >-
        Any value that differs from NJ5 or NJ1 beyond tolerance, or any open
