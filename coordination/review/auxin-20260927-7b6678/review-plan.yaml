      whether it is caught differ between cypari2 builds, so a transcript on one
      build may not determine behaviour on the declared minimum. Second most
      likely: provisioning fails under scratch and K-provision/K-infra engages
      (that is a switch condition to option 1, not a break).
      NJ3 (scope and hypothesis mapping) HOLDS with probability about 0.6. If
      it breaks, I expect RI-1 to show a demoted falsification condition that
      the draft does not justify, or DF-5 rescoped into a sentence that still
      predicts a category.
      NJ4 (governing text) HOLDS with probability about 0.55. If it breaks, I
      expect a field whose governing text is ambiguous because a corrective
      clause changes a definition that a held clause uses (FP is the obvious
      candidate: C-FIELD is held, FP is corrected).
      NJ5 (reporting field, bins, inventory, R-D4) HOLDS with probability
      about 0.75.
      NJ6 (blind determinacy on the corrected fields) AGREES with NJ5 on every
      value with probability about 0.7; probability about 0.5 that neither
      side reports an open material choice, because the governing-text layer
      is new.
    overall: >-
      Probability about 0.3 that the round composes to approve. Most likely
      outcome: revise on NJ2 (timeout interface) or NJ4 (governing text).
    where_i_think_it_breaks_if_it_breaks: NJ2, then NJ4, then NJ3.
    what_would_overturn_this_prior_most: >-
      (1) NJ2 holding with transcripts on the declared minimum cypari2 and gp
      builds: that would show the executed-layer discipline is sufficient. (2)
      NJ4 breaking on a field unrelated to FP, which would mean the three-layer
      construction is itself fragile and points toward option 2. (3) Any
      K-regression on the held layer, which I do not expect because held text is
      bound by hash rather than retyped.
    informed_prior_disclosure: >-
      Informed, not blind (PD-N1). This session read DEC-20260926-96f970 and
      the committed rescope-ranking.yaml in full. It opened no BATCH-2fc87b
