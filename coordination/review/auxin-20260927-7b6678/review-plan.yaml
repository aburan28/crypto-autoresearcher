  joints:
    - joint: >-
        NJ1 -- PINS AND THE FIELD-PRIME SET (DF-1, DF-2, RI-6). Every pin
        locator reaches exactly one integer on its pinned revision; BN254-r in
        particular. The null-arm bit-class consequence of an unpinned BN254-r is
        stated. FP is defined from extracted field primes, not seeded with the
        values its control tests, and a declared control FAILS under M-FP.
        Expected sha256 of each pinned source is stated where one exists; the
        PDF check is positional or its weakness declared; the 'strictly before'
        rule matches the commits-API filter.
      assigned_to: TASK-20260927-10c752
      attack_plan: >-
        (i) Retrieve every pinned source at its pinned revision yourself. Run
        each locator exactly as written. Compare with the producer transcripts
        in execution-transcripts.json; a transcript that does not reproduce is
        a finding even if your own run succeeds.
        (ii) For BN254-r, show the locator reaches one integer on the pinned
        eip-197.md revision without tolerating any character the text does not
        name.
        (iii) Build FP exactly as the corrected text defines it. Apply M-FP (FP
        built from the two C-FIELD values only) and report which declared
        control fails; if none fails, NJ1 breaks. Then substitute each C-FIELD
        prime for r and show the confounder rejects before any factoring.
        (iv) Hash each retrieved source and compare with the stated sha256.
        (v) Check the 'strictly before' rule against the commits-API query the
        text names.
        WHERE I THINK IT BREAKS: (iii) on one of the two C-FIELD cases, or (iv).
      breaking_artifact: >-
        A locator that fails, or needs a reader's choice, on its pinned
        revision; a producer transcript that does not reproduce; an FP
        definition under which M-FP passes every declared control; a field
        prime admitted; a stated sha256 that does not match the pinned bytes.
    - joint: >-
        NJ2 -- TOOL INTERFACE, TIMEOUT AND CUSTODY (DF-3, DF-4, RI-7, GT-3,
        regression R-D7D10). The PARI version command executes on the declared
        cypari2 builds and reports the version the gate compares. The
        in-process timeout is named by the signal the prescribed interface
        actually raises or returns, and admission item 3 and F2 timeout
        recognition are determinate. RI-7 items are corrected or declared.
        Regression: certificate route with a library-free verifier; the draft
        is one new file; frozen files are byte-identical.
      assigned_to: TASK-20260927-10c752
      attack_plan: >-
        (i) Provision the declared tools under scratch outside the repository
        (TMPDIR), at the declared minimum and at the latest release, and record
        base-environment absence. Run the admission gate exactly as written on
        both builds (K-provision).
        (ii) Trigger the in-process timeout on a deliberately slow PARI call on
        both builds through the prescribed interface, and separately in gp.
        Report the exception class or return object, whether the text's
        recognition rule catches it, and whether admission item 3 passes.
        (iii) Compare every tool transcript in execution-transcripts.json with
        your own; report builds the producer did not run.
        (iv) Check the RI-7 clauses: README attribution, PARI stack allocation,
        sys.path under run.py, the exec() prohibition, environment location.
        (v) Regression: produce and verify one certificate for a prime of at
        least 250 bits with a verifier that does not import the producing
        library; check with git that specification.yaml, AMD-20260916-bands.yaml,
        AMD-20260923-d1d10.yaml and AMD-20260926-typed.yaml are byte-identical
        across the producer snapshot and that its diff adds only the declared
        files.
        WHERE I THINK IT BREAKS: (ii), on the declared minimum build.
      breaking_artifact: >-
        A gate that cannot be executed as written, or does not determine
        admission on a declared build; a timeout signal the recognition rule
        does not catch on a declared build; a missing or non-reproducing
        transcript for a claim the draft makes; any byte change to a frozen
        file; a certificate route that fails. Tool absence alone is K-provision,
        not a break.
    - joint: >-
        NJ3 -- SCOPE AND HYPOTHESIS MAPPING (DF-5, RI-1, RI-3, RI-4, RI-8,
        regression R-D2D3). The DF-5 sentence is removed or rescoped so that it
