        WHERE I THINK IT BREAKS: (ii).
      breaking_artifact: >-
        An over-scoped sentence; a falsification condition missing from the
        RI-1 table or demoted without reason; an RI item neither addressed nor
        declared; a D2/D3 field changed.
    - joint: >-
        NJ4 -- GOVERNING TEXT (GT-1, GT-2). The amendment supersedes only the
        DF/RI fields. Every other field is incorporated from
        AMD-EXP-AUXIN-7e2e3d-20260926-typed by the sha256 above and not
        retyped. The governing-text table names, for every field that the
        protocol reads at run time, exactly one of v1, refused-typed-by-hash,
        or corrective, and no corrective clause silently changes the meaning of
        a held clause that reads it.
      assigned_to: TASK-20260927-1c6d6e
      attack_plan: >-
        (i) Hash AMD-20260926-typed.yaml and compare with the digest the draft
        states and with this plan's.
        (ii) Enumerate every field the protocol reads (controls, rows, pins,
        FP, bins, costs, gates, tools, budget, stopping, invalidation,
        artifacts, success and falsification criteria, interpretation limits,
        proof_search_map) and name its governing text from the table alone.
