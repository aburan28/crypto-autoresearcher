        family-caused. RI-1's mapping table covers every falsification
        condition of H-AUXIN-6db354 and justifies any retirement or demotion.
        RI-3, RI-4 and RI-8 are addressed or declared. Regression: typed costs,
        input models and the D3 predicate are unchanged.
      assigned_to: TASK-20260927-1c6d6e
      attack_plan: >-
        (i) Read the corrective fields and the design report line by line;
        quote every sentence that states more than its measurement supports,
        against CORR-20260923-187ea3, CORR-20260923-5c5a23 and
        CORR-20260923-f5f060.
        (ii) Take H-AUXIN-6db354 falsification_conditions one by one and check
        RI-1's row for each: outcome named, retirement or demotion justified.
        Count retired or demoted conditions; if the count means the amendment
        no longer tests the same hypothesis, report it under K-route-switch.
        (iii) Check RI-3 (tolerance relative to s; label split), RI-4 and RI-8.
        (iv) Regression: confirm the D2 and D3 fields are governed by the hash-
        incorporated text and untouched by any corrective clause; re-evaluate
        the D3 rules on one constructed unfactored row and one constructed
