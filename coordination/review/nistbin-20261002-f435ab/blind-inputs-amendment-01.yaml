  # ---------------------------------------------------------------------------
  # (c) CHANGED DEFINITIONS OF R-B, R-M, W, A MEMORY COLUMN OR THE THRESHOLD
  # ---------------------------------------------------------------------------
  changed_definitions:
    how_checked: >-
      By the worksheet change_map (changed_fields and unchanged_fields), by
      the VERSION 3 markers in each field of experiments/EXP-NISTBIN-451dfa/specification.yaml,
      and by reading the hypothesis version_3 block. The frozen version-2 copy
      was not opened: it is outside this gate's read scope (GD-10).
    R-B:
      result: none
      field_checked: specification.yaml experiment.definitions.reading_R_B (listed unchanged in change_map; no VERSION 3 marker); hypothesis version_3 heuristic_assumptions H1.formal_statement restates S_B without changing it
    R-M:
      result: none
      field_checked: specification.yaml experiment.definitions.reading_R_M (unchanged; no VERSION 3 marker); hypothesis version_3 H1.formal_statement and lower_edge restate S_M without changing it
    W:
      result: none
      field_checked: specification.yaml experiment.definitions.W (unchanged; no VERSION 3 marker); hypothesis version_3 H1.formal_statement restates W without changing it
    threshold:
      result: >-
        No change to the threshold definition
        (specification.yaml experiment.definitions.d_star_of_m.definition, which
        is unchanged and is the text blind-inputs.yaml definitions threshold
        already carries). Two additive version-3 texts bear on it and are
        transcribed below.
      additions:
        - field: specification.yaml experiment.definitions.d_star_of_m.ceiled_column
          change: new in version 3
          text: >-
            VERSION 3 (N-J3-3, O-J4-1, RD-8). Column C-CEIL-T: beside each m, the
            same D*_R(c, omega, m) and D*real_B with A(571, m) under the ceiled
            reading k = ceil(571/m), with its relation store ceil(571/m) beside
            it. Non-gating and never scored. It IS handed on beside the MI-1
            table, with the sentence of MI-1.bias_of_the_handed_table, so that
            the MI-1 choice and its direction are visible at every m and a later
            reader can compare a measured degree at one k reading (IR-2).
          gate_note: >-
            C-CEIL-T is the contract's name for the Q3 table under the reading
            blind-inputs.yaml labels KR-B. The field
            MI-1.bias_of_the_handed_table is not transcribed: it states a
            result, not a definition.
        - field: specification.yaml experiment.definitions.d_star
          change: sentence appended in version 3 (the rest of the field is carried and not transcribed, because it states the model's optimising m)
          text_fragment: >-
            VERSION 3 (O-J4-2): the
            value at m* is the SCORED CELL of prediction P-C, never the threshold
            handed on, which is the table of d_star_of_m.
    memory_columns:
      field: specification.yaml experiment.definitions.memory_columns
      result: changed in version 3 (RD-2 block appended). The whole field is transcribed in fragments.
      reading_order: RO-1 applies to this field.
      fragment_1: >-
        Beside every time figure: MR_B = D log2 n (Macaulay rows, R-B form);
        MR_M = W(n, D) (Macaulay rows, R-M form); MR_C8 = log2 binom(nvar, D)
        with nvar as in reading_R_I (the formula of DEC-20260924-99ce20 C8);
        dense entries 2 MR_B and 2 MR_M; relation store k* = n/m* (log2 count of
        relations, D- and omega-independent). Memory is modelled, not measured.
        VERSION 3 (RD-2). Beside a time figure of the instrument's macaulay4
        reading: MR_MAC = W(N5, D), with N5 = int(round(t k + max(t - 2, 0) n))
        the Boolean variable count of system
      gap_1: G-SYS
      fragment_2: >-
        at chain length t as the
        frozen instrument computes it (joint_balance.py log2_solve_cost, read as
        text, never executed); beside a time figure of its f4_std reading:
        MR_F4 = D log2(n (t - 1)), the power form of that reading's per-solve
        cost, with the monomial form W(n (t - 1), D) beside it; dense entries
        twice each. Every memory figure is evaluated at its own time figure's
        (n, m, t, D, k reading, convention); a joint-convention figure sits at
        its own argmin, not at the block_n4w argmin.
      note_reading_R_I: >-
        reading_R_I is not transcribed: it states figures. Its sizing of nvar
        is the one blind-inputs.yaml memory_columns gives for MR_C8, taken at
        the model's own argmin.
      note_relation_store: >-
        The relation-store clause above (the log2 count of relations, which is
        the k reading's k itself) is worded differently from the
        relation-store clause of blind-inputs.yaml memory_columns. Under
        blind-inputs.yaml, the amendment's text governs and you report under
        both. This clause is carried from version 2 and was not changed by
        version 3.

  # ---------------------------------------------------------------------------
  # (d) M7 READINGS VERSION 3 ADOPTS OR RESTRICTS
  # ---------------------------------------------------------------------------
  m7_readings:
    adopts: >-
      none. Version 3 adopts no numbered M7 reading. Its decision_mapping K4
      revisit sub-condition (ii) leaves a numbered M7 reading to a successor
      contract. Fields checked: specification.yaml experiment.definitions.restricted_model
      (outside_the_model, m7_direction), interpretation_limits,
      success_criterion.decision_mapping; hypothesis version_3
      interpretation_limits; audit audits A5 L-INT M7.
    restricts:
      - field: specification.yaml experiment.definitions.restricted_model.m7_direction.statement
        what: >-
          Version 3 restricts every M7 statement to this conditional lemma,
          over the class of readings it defines. Transcribed in fragments.
          The sentence about the Boolean-monomial reading is transcribed only
          as far as the reading's description. Its predicate, and the next
          sentence, report a computed result about that reading attributed to
          an earlier reviewer; they are not a definition and are not conveyed.
        fragment_1: >-
          CONDITIONAL. Let S_7(n, D, omega) be any M7 reading of the
          per-solve cost that is non-decreasing in D and equals S_B(n, D,
          omega) = D omega log2 n for D <= 4, and let D*_7(c, omega, m) be the
          least D in 2..64 with A(571, m) + S_7(571, D, omega) - rho(c) > 0.
          At each (c, m) at which D*_B = D*_B(c, omega, m) is an integer of at
          least 5: (a) IF S_7(571, D*_B, omega) >= S_B(571, D*_B, omega), THEN
          D*_7 <= D*_B (that crossing moves earlier or stays); (b) IF
          S_7(571, D*_B - 1, omega) <= S_B(571, D*_B - 1, omega), THEN
          D*_7 >= D*_B (it moves later or stays). Neither antecedent holds for
          every reading at every degree, so M7's direction is NOT determined
          by this contract. A reading that counts rows as Boolean monomials of
          degree at most D in the Boolean variable count of system
        gap_1: G-SYS, followed by a comma
        fragment_2: >-
          anchored to R-B at D = 4,
        gap_2: not_conveyed (the predicate of this sentence and the whole next sentence; a reported result, not a definition)
        fragment_3: >-
          No
          sentence of this contract states a one-way direction for M7, and no
          M7 range endpoint is frozen.
        gate_note_for_QB: >-
          The reading this sentence describes is, by its description, the
          M7-BIN reading of blind-inputs.yaml, so QB needs no further reading.
          The contract's variable count for it is the N5 of the memory_columns
          transcription above (RO-1 applies). Version 3 states no M7 range and
          freezes no M7 range endpoint.
    restatements_not_transcribed: >-
      These conditional restatements point to the field above and are not
      transcribed. Two of them also restate the reported result:
      specification.yaml experiment.definitions.restricted_model.outside_the_model;
      experiment.interpretation_limits (restricted-model entry);
      experiment.success_criterion.decision_mapping (K4 revisit sub-condition
      (ii)); hypothesis version_3 interpretation_limits (first entry); audit
      audits A5 L-INT M7 and restricted_model_consequence.

