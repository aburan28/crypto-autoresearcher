  # ---------------------------------------------------------------------------
  grep_form_observations:
    plan_clause: review-plan.yaml blind_rederivation forward_precondition false_pass_and_false_fail_of_the_grep (the gate records any printed form it found outside the searched forms)
    observations:
      - >-
        Version 3 prints integers in forms the grep does not search: after
        a variable-count label with no equals sign or with a suffixed name,
        after the word nvar, inside a parenthesised k note, and after an
        argmin label without an equals sign. The grep record discloses that
        bare integers are not searched. For the larger integer values the gate
        scanned every whitelisted file with the text-search tool for any
        standalone occurrence. It found only page numbers, publication and law
        numbers, prime-field curve reduction exponents and bit lengths in the
        FIPS text, integer parts of the paper's own table cells and
        bibliography pages, lines inside the RD-SEM range, an HTTP status in
        source_record.yaml, a day count in AGENTS.md and the template, and the
        QM degree grid in blind-inputs.yaml. None is a version-3 value printed
        in an unsearched form. No such scan is meaningful for the small
        integers; that limitation stands as the grep record states it.
      - >-
        No decimal form outside the searched precisions was found in the
        whitelisted files during classification.

  # ---------------------------------------------------------------------------
  gate_disclosures:
    - id: GD-01
      what: >-
        D4b reading. The plan defines D4b as a standalone numeral whose own
        sentence states a quantity of a different kind, and gives a list in
        parentheses. This gate reads that list as illustrative. Hits whose
        D4b basis falls outside the listed kinds: GH-02 (a pinned model
        parameter), GH-04 (a formula coefficient), GH-06 (a grid degree
        parameter), GH-07 (a tolerance), GH-16, GH-18, GH-20, GH-22, GH-24,
        GH-26, GH-28, GH-30, GH-32 and GH-41 (interval bounds), GH-36 and
        GH-38 (algorithm constants), GH-39 (a worked example), GH-43 and GH-46
        (indices), GH-53 (tool settings), GH-54 (a licence version), GH-57,
        GH-69 and GH-71 (Landau notation) and GH-59 (a clock rate). The
        composer re-checks every D4 hit; under the plan, a misclassified hit is
        treated as D3.
    - id: GD-02
      what: >-
        D1 for H-395 to H-397 uses the existing RD-SEM range (RD-SEM-A1). No
        new line is redacted. A line-range rule identical to RD-SEM is the
        narrowest D1 that covers these Table 3 cells.
    - id: GD-03
      what: >-
        Six NF definitions (NF-05, NF-06, NF-07, NF-08, NF-10, NF-13), the
        shared notation, the memory_columns field and the m7_direction
        statement contain printed forms this file may not carry: the omega
        pin, one element of the QM degree grid, the paper's system number,
        and one integer degree. They are transcribed as byte-exact fragments
        with described gaps. In NF-13 one degree parameter is not conveyed,
        so one sub-point of NF-13 item (a) cannot be computed by J10.
    - id: GD-04
      what: >-
        The shared-notation transcription omits the worksheet rule's clause
        that writes out A(n, m). It also omits the rule's other sentences,
        which state process, not definitions. J10 derives A from the paper,
        as blind-inputs.yaml asks.
    - id: GD-05
      what: >-
        RO-1, a reading-order request, goes beyond the list of what an
        amendment may contain in blind-inputs.yaml forward_amendment. It
        protects the plan's test of the Boolean variable count, which
        transcribing NF-08 and memory_columns would otherwise make circular.
        The composer may weigh or disregard it. It moves no key.
    - id: GD-06
      what: >-
        Transcribing NF definitions that name MI-1 tells J10 which labelled
        k reading the contract scores (shared_notation label_mapping). The
        blind card says it is not told this. The NF items cannot be computed
        without it.
    - id: GD-07
      what: >-
        Residual risk. A listed hit lets a reader see which printed numerals
        coincided with some searched form. No basis names the quantity it
        coincided with. The plan's D4 design accepts this.
    - id: GD-08
      what: >-
        NF-08's transcription names its parameter point. That point includes
        an integer chain length in a form the grep does not search. It is
        the joint-convention argmin a SEMBIN run records, not a quantity J10
        is asked to compute. It is transcribed byte-exact because the
        definition requires it.
    - id: GD-09
      what: >-
        Item (c) was checked through the change_map and the VERSION 3
        markers. The frozen version-2 copy was not opened.
    - id: GD-10
      what: >-
        This gate is not blind. To keep this file free of every search term,
        it read the session output embedded verbatim in the audit sheet,
        which is the grep's value source. It also opened hit lines inside the
        RD-SEM range to classify them.
    - id: GD-11
      what: >-
        There was no shell. No sha256 was computed, no YAML parse was run,
        and the grep script was not re-run on this file. The gate checked this
        file's text against the search-term set by hand and with the
        text-search tool. The top-level session's step 4 grep is the binding
        check.
