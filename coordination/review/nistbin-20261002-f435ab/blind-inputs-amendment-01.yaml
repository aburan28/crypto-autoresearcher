  # ---------------------------------------------------------------------------
  # (b) NF-nn DEFINITIONS, TRANSCRIBED FROM THE WORKSHEET
  # ---------------------------------------------------------------------------
  nf_definitions:
    source: coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-f435ab/design/TASK-20261002-23efd5/revision-worksheet.yaml revision_worksheet.newly_frozen_values
    comparison_basis: >-
      Every definition and fragment below is the YAML-parsed value of a folded
      block, and that value is a byte-exact substring of the YAML-parsed
      definition string of the same item in the worksheet. Whole definitions
      also keep the worksheet's line breaks at the worksheet's indentation, so
      their raw lines match the worksheet's raw lines too.
    transcription_forms:
      whole: The definition string is transcribed entire, under the key definition.
      fragments: >-
        The worksheet string contains a printed form that this file may not
        carry, so it is transcribed as ordered byte-exact fragments with
        described gaps. The full definition is fragment_1, then gap_1, then
        fragment_2, and so on, joined with single spaces. A gap of kind token
        is described exactly, without its characters. A gap of kind
        not_conveyed is not described, and the definition is incomplete
        there.
      not_separable: The worksheet marks the item not separable; recorded exactly as instructed.
    gap_kinds:
      G-OMEGA: >-
        token. The omega of blind-inputs.yaml pinned_choices PIN-OMEGA, written
        exactly as PIN-OMEGA writes it, immediately followed by a closing
        parenthesis (and by a comma where the gap says so).
      G-DEG: >-
        token. One list element and its trailing comma: the one degree of
        blind-inputs.yaml quantities QM grids degrees_n that does not appear
        in this item's fragments.
      G-SYS: >-
        token. The number the paper gives its Boolean descent system, in
        parentheses, exactly as blind-inputs.yaml definitions
        macaulay4_and_f4_std writes it after the word system (followed by a
        comma where the gap says so).
    shared_notation:
      source_field: revision_worksheet.newly_frozen_values.rule
      why: >-
        The NF definitions use the names MI-1, the ceiled reading, W and C_I,
        which this part of the worksheet rule defines. Transcribed in fragments.
        The clause of the rule that writes out A(n, m) is not transcribed: A is
        not an NF item, version 3 does not change it, and blind-inputs.yaml
        definitions A_of_n_m asks you to derive it from the paper.
      fragment_1: >-
        Default tolerance 0.01 bit on log2
        quantities and exact on integers. In every definition: log2 is the
        binary logarithm; W(N, D) = log2 of the sum over d = 0..D of
        binom(N, d); MI-1 is the reading k = n/m taken as a real number and
        "the ceiled reading" is k = ceil(n/m);
      gap_1: not_conveyed (the A(n, m) clause; use blind-inputs.yaml definitions A_of_n_m)
      fragment_2: >-
        omega = 3;
        C_I(n,
      gap_2: G-OMEGA
      fragment_3: >-
        = the first minimum over m in 2..min(30, n), taken in
        ascending m with strict less-than, of A(n, m) + 4 omega log2 n, and its
        argmin m* (t = m).
      label_mapping: >-
        Gate note, not a transcription. MI-1 above is the reading
        blind-inputs.yaml labels KR-A, and the ceiled reading is the one it
        labels KR-B.
    items:
      - id: NF-01
        transcription: whole
        definition: >-
          The number of distinct curve labels of the form ECC2-<digits> or
          ECC2K-<digits> (binary curves; labels of the form ECCp-<digits> are
          prime-field curves and are not counted) that head a curve block in
          Appendix A "Curve Details" of
          inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md, Appendix A
          being every line after the last line whose text is exactly "A Curve
          Details".
        tolerance: exact
        computable_by_J10: >-
          No. The path it names is not on the whitelist; do not open it (BL-1).
          Report it as not computed, for that reason. The worksheet assigns its
          re-derivation to joint J1.
      - id: NF-02
        transcription: whole
        definition: >-
          The number of distinct field degrees m among the curves counted in
          NF-01, each curve's m being the integer printed on the line of the
          form "m = <integer>" in its own Appendix A block.
        tolerance: exact
        computable_by_J10: No, for the reason given at NF-01. Joint J1 re-derives it.
      - id: NF-03
        transcription: whole
        definition: >-
          The reading rule of the coverage check, not a number: Appendix A
          begins after the last line equal to "A Curve Details"; a label line
          is a line whose whole stripped text is ECC2-, ECC2K- or ECCp-
          followed by digits; a curve block runs from its label line to the
          next label line of any family; a binary block must contain exactly
          one line of the form "m = <integer>" and its first line of the form
          "f = x^<integer>..." must carry that same integer; the input paths
          are the Certicom text named in NF-01 and the contract's own
          specification file (read only by the design-time self-test).
        tolerance: exact (rule identity)
        computable_by_J10: No; a rule reviewed against a text that is not whitelisted. Joint J1 reviews it.
      - id: NF-04
        transcription: not_separable
        definition: definition not separable
        tolerance: not applicable
      - id: NF-05
        transcription: fragments
        definition_fragment_1: >-
          For each n in {79, 89, 97, 109, 131, 155, 163, 185, 191, 233, 239,
          283,
        gap_1: G-DEG
        definition_fragment_2: >-
          409, 571} (the claim-(A) degrees) and for each k reading in
          {MI-1, the ceiled reading}: (a) C_I(n,
        gap_2: G-OMEGA
        definition_fragment_3: >-
          and its argmin m*; (b)
          the runner-up m (the m with the second-smallest value of
          A(n, m) + 4 omega log2 n, ties to the lower m) and the gap between
          the two values; (c) at the argmin m*, with t = m* and D = 4, the
          Macaulay rows MR_B = 4 log2 n, MR_M = W(n, 4) and MR_C8 =
          log2 binom(nvar, 4) with nvar = m* ceil(n/m*) (report nvar too), the
          dense entries 2 MR_B, 2 MR_M and 2 MR_C8, and the relation store
          log2 of 2^k, that is k at m* under that k reading; (d) the relation
          store k at the runner-up m under that k reading; (e) the move, C_I
          under the ceiled reading minus C_I under MI-1, and its sign.
        tolerance: 0.01 bit on every log2 figure and move; exact on m*, runner-up m and nvar
      - id: NF-06
        transcription: fragments
        definition_fragment_1: >-
          The items (a), (c) and (e) of NF-05 at n = 571, n = 283 and n = 359
          only, under both k readings: C_I(n,
        gap_1: G-OMEGA
        definition_fragment_2: >-
          and its argmin m* under MI-1
          and under the ceiled reading, the move ceiled minus MI-1, MR_B and
