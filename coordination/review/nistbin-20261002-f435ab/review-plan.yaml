    forward_precondition:
      binds: the top-level session (dispatcher) and the gate sub-session of TASK-20261002-2a3049, before TASK-20261002-84c5d6 is dispatched
      text: >-
        (1) Grep every whitelisted file (including the card, blind-inputs.yaml
        and, once written, the amendment itself) for every value version 3
        freezes or carries that J10 or J9 computes: every Q1 value, every Q2
        value and argmin, every memory figure, every threshold or D*(m) value,
        every M7 range endpoint, every MI-1 move and every NF-nn value. Forms:
        decimals rounded AND truncated to one, two, three and four places;
        2^x, 2^{x} and 2**x; scientific notation; integers in "m = ",
        "m* = ", "D = ", "D* = ", "D*(m) = ", "N = " and list forms. (2)
        Record the command and every hit as file:line in
        coordination/review/nistbin-20261002-f435ab/whitelist-grep-v3.yaml
        (blind_from; it may print search terms). (3) The gate sub-session
        writes the value-free additive amendment
        coordination/review/nistbin-20261002-f435ab/blind-inputs-amendment-01.yaml.
        Every hit takes exactly one of the FOUR DISPOSITIONS below, never any
        other label (PF-2). It transcribes, never as a value: the definition
        of every NF-nn item of the producer's newly_frozen_values section,
        copied byte-exact, with "definition not separable" recorded where it
        cannot be separated from its answer; any changed definition of R-B,
        R-M, W, a memory column or the threshold; the statement of any M7
        reading version 3 adopts or restricts; and the (n, m, t, D, k reading)
        points at which version 3 states a memory figure outside the QM grid,
        as parameters. (4) The top-level session greps the amendment for every
        search term and checks every transcribed definition is a byte-exact
        substring of the producer's worksheet; any hit or mismatch is a stop
        and the gate sub-session rewrites. Both files are committed and pushed
        in TASK-20261002-2a3049's snapshot commit before dispatch.
      dispositions:
        D1-REDACTION: A new line-range redaction rule, attested by the re-deriver.
        D2-EXCLUSION: The file is removed from the whitelist.
        D3-DISCLOSED-LEAK: >-
          Recorded with file:line, never the value. The affected J10 values are
          admitted only as attested-blind or set aside under K-leak.
        D4-NON-VALUE-MATCH: >-
          DEFINED HERE BEFORE DISPATCH (DEC-20260925-41f6dc PF-2). Retained
          with no change, and allowed only in one of two closed subclasses.
          D4a IDENTIFIER, the match lies wholly inside an identifier, a path,
          a hash, a hex string or a curve-parameter digit string, never in a
          standalone numeral. D4b FOREIGN-QUANTITY, the match is a standalone
          numeral whose own sentence, cited by file:line without quoting the
          value, states a quantity of a different kind (a line, page,
          equation, table or reference number, a year, a toy parameter at a
          degree outside every Q parameter set). The gate states the subclass
          and a one-line value-free basis per hit. A hit that is not shown to
          be D4a or D4b takes D1, D2 or D3. The composer re-checks every D4
          classification against the grep record; a misclassified hit is
          treated as D3.
      false_pass_and_false_fail_of_the_grep: >-
        False PASS: a value printed at another precision or in another form
        than searched. The forms in (1) include rounding and truncation at
        every precision version 3 prints, and the gate records any printed
        form it found outside them. False FAIL: identifier and parameter-digit
        matches. D4a absorbs them without weakening the search.
    agreement_tolerance: >-
      Q1-571: within 0.01 bit; exact on bit length and k. QM: exact on every
      integer variable count under the matching k reading and rounding rule;
      within 0.01 bit on every log2 row, entry or store figure. Q3: exact on
      every integer D*_R(c, 3.0, m) token; within 0.01 on D*real_B; within
      0.01 bit on A(571, m). QB: exact on the degree; within 0.05 bit on the
      cumulative difference. QNF: the tolerance the amendment states per item,
      by default 0.01 bit on log2 quantities and exact on integers. Carried
      J9: as frozen in REVIEW-NISTBIN-20260925-b67954 (Q1 0.01 bit, exact on
      bit length and k; Q2 5.0e-4 bit, exact on m, under MI-1 = KR-A).
    what_disagreement_means: >-
      NOT that a reviewer, J9 or J10 is wrong. It localises the difference to
      an undetermined model, an undetermined convention, or one of two named
      implementations. The composer reads both and applies K-indeterminate or
      K-fixture; it never prefers either side. A version-3 value under a
      reading J10 did not evaluate is recorded NOT BLIND-RE-DERIVED (a
      disclosed gap), never as agreement. J9 and J10 disagreeing with each
      other on a value version 3 does not freeze is a finding for the composer
      to record, not a key.

  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20261002-b2b9f1, a fresh session that did not
      run TASK-20261002-23efd5 or the gate sub-session of TASK-20261002-2a3049,
      did not compose DEC-20260924-124667, DEC-20260925-89573b or
      DEC-20260925-41f6dc, did not write this plan or DEC-20261002-0983f2, and
      is not a reviewer of this round. It writes DEC-20261002-353743 and one
      composition worksheet, and edits neither the hypothesis nor the
      specification. No reviewer votes on the whole contract.
    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/nistbin-20261002-f435ab/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-f435ab/reviews/TASK-20261002-3cd1f8/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-f435ab/reviews/TASK-20261002-3de9d2/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-f435ab/reviews/TASK-20261002-496923/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-f435ab/reviews/TASK-20261002-4cb903/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-f435ab/reviews/TASK-20261002-84c5d6/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/reviews/TASK-20260925-a43591/,
      run by the top-level session immediately before the composer's launch
      and pasted verbatim into its prompt; recorded in DEC-20261002-353743
      whatever it reports. If the tool refuses the carried report, the
      composer applies K-carry-broken to J9; the tool is never edited to pass.
      --blind-history is UNCHECKABLE (no protected-digest file), recorded as
      such, never as passed.
    custody_without_seal: >-
      No seal card. Before TASK-20261002-b2b9f1 is launched, the top-level
      session computes sha256 of the ten report files of this round (the five
      reports and the computations.json beside each) and of the two carried J9
      files, and pastes them into the launch prompt. The composer records them
      verbatim as its first act, before reading any report, and checks the two
      carried digests against TASK-20260925-a9c531's path_sha256
      (rederivation-report.yaml 070f64da2632d715ea0d00478a1619c30d6c1a15c8365b7232935c499a287ce8;
      computations.json fb5bffe2ff11e55a5fc6c0467c91faff7771702b36c7972c76ca7e9ff75f058c4).
      TASK-20261002-b68b72 must reproduce all twelve; a mismatch voids the
      composition.
    gate_check: >-
      The composer is not blind. It checks the pre-review gate: both gate
      files present and bound by TASK-20261002-2a3049; every hit disposed of
      under exactly one of D1 to D4; every D4 classification re-checked; every
      NF-nn definition transcribed or flagged not separable. A gate defect is
      a procedure finding of the composing decision, disclosed there and never
      repaired by re-running a review.
    discharge_check: >-
      The composer reads the worksheet's discharge table and checks that each
      of RD-1 to RD-9 maps to a named clause that its owning joint's report
      does not contradict, that every non-breaking item and CO-1 is answered,
      and that every "What holds" change is in constants_delta with its forcing
      item. An RD item with no clause is a missing approval field for
      K-revise-defect.
    keys:
      K-approve: >-
        J1 to J8 and J11 hold; J3 reports the fixture passing as frozen; J11
        reports no breaking UNOWNED item; J1's D-CARRY finds no uncovered
        difference and J9 agrees with version 3 on every Q1 and Q2 value
        within its frozen tolerance; J10 agrees with version 3 on every newly
        frozen value (QM, any Q3 value version 3 freezes, QB where version 3
        states an M7 range, every QNF item) within tolerance; every
        undetermined choice J10 reports that changes a value is a numbered
        model-identification choice version 3 declares with its consequence
        disclosed; every PTM meets its failure signature; no tripwire fired;
        the discharge check passes; the gate check finds no misclassified hit
        that bears on a compared value. DEC-20261002-353743 then approves
        "EXP-NISTBIN-451dfa version 3" under the AGENTS.md standing user
        authorization and names as its first next action the opening of an
        execution batch whose first card advances the approval and status
        fields (DEC-20260924-f0a9c7 R4) and whose executor card is minted then.
        Approval asserts nothing about the 571 cell, the true solving degree
        or any curve.
      K-revise-defect: >-
        Any of J1 to J8 or J11 breaks (including a J7 regression or a breaking
        UNOWNED item), a field approval requires is missing, an RD item is
        undischarged, or TA-3 fired on Part 3, re-measurement, instrument
        execution or module-level execution. Decision revise, listing each
        defect with its joint and breaking artifact, and naming a revision
        design card in a new batch as the first next action. No run.
      K-fixture: >-
        J3 reports the fixture failing as frozen, or J9's Q2 under MI-1
        disagrees with the frozen target beyond tolerance. Revise on C2.
      K-indeterminate: >-
        J9 or J10 reports an undetermined choice that changes a compared value
        beyond tolerance and that version 3 does not declare as a numbered
        choice with its consequence; or a reviewer and J9 or J10 disagree on a
        value under the same reading. Revise on C1, C2, C3 or C8 as the
        quantity requires, naming both implementations; the composer prefers
        neither. A divergence only between readings version 3 declares and
        discloses does not fire this key.
      K-carry-broken: >-
        J1's D-CARRY reports an uncovered difference in a Q1 or Q2 value, the
        independence tool refuses the carried report, or TA-3's J9-read
        clause fired. J9 is not applicable to the affected values. No approval
        resting on them; decision revise, with a fresh blind card on those
        values as part of the first next action. Not a defect of the
        mathematics.
      K-leak: >-
        J10 reports a BL-4 leak or an exposure, or the gate shows a D3 hit or a
        misclassified D4 hit bearing on a J10 value. The affected J10 values
        are admitted only as attested-blind or set aside, and the keys are
        applied with them set aside; if approval would depend on them, no
        approval: replicate J10 under a corrected whitelist.
      K-duplicate: >-
        The producer or a reviewer reports under C4 that a D_solve sensitivity
        surface exists or is in flight on GOAL-SEMBIN-fcb7a2. Revise; the
        lane is withdrawn with a bus pointer to that lane.
      K-impediment: >-
        A card could not be served at review-breakthrough at max (TA-4). It is
        not dispatched; the impediment is recorded on the active goal; the
        claim stays un-promoted; no composition until every card is served.
        Never a downgrade and never evidence.
      K-infra: >-
        A reviewer could not run a joint (tool absent, environment failure,
        watchdog, a killed session not continued). That joint reads
        inconclusive. No approval while any joint other than J9 and J10 (which
        are inconclusive by design) is inconclusive; the decision is revise or
        replicate the review. An infrastructure failure is never negative
        evidence about the contract's mathematics or any curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    selection_point_duties: >-
      The composing decision is a selection point of GOAL-ECDLP2M-001. It reads
      DEC-20261002-0983f2 (R-SLOT, R-NEXT-SLOT, R-HOLDS), DEC-20260929-7257b2
      and DEC-20260929-54dcd8, and, if on origin/main at its launch,
      DEC-20260929-585602 and any later decision on this goal, and records only
      changes to the standing order, each with its reason and revisit. It
      carries the HOLD-F and HOLD-G row-set condition (DEC-20260925-41f6dc
      R-HOLDS), re-applies X-CERTBIN if any CERTBIN contract has been versioned
      since DEC-20261002-0983f2, rules the slot this batch frees, and keeps the
      custody successor on slot 1 unless a reason is recorded.

