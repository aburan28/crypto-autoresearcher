      K-571 and B-571 (an input to Q3). QM: the memory columns (Macaulay rows
      under R-B, R-M, macaulay4, f4_std and the C8 formula; dense entries;
      relation store) at n = 571, 283, 359 and 409 over the stated m and D
      grids, under both labelled k readings, including the Boolean variable
      count of system (5). Q3: the contract's threshold D*_R(c, 3.0, m) and
      D*real_B at 571 for each m in 2..30, both readings, both k readings,
      with A(571, m). QB: the degree above which the M7-BIN reading grows
      more slowly than R-B, per m. QNF: every newly frozen value whose
      value-free definition the forward amendment transcribes.
