        leaf of yours, and say for each whether the difference is only
        granularity (your leaf rule splits or merges where the table does
        not) or a leaf one side lacks.
      report: Your leaf rule; the correspondence as a table; the two unmatched lists with a reason per item.
    BQ2:
      name: effective governing text per table row
      definition: >-
        For each row of the governing_text_table of AMD-20260928-gated.yaml,
        in table order: the row's field name exactly as the table writes it;
        the file whose text governs it, determined by applying the held
        texts' own supersession, span and precedence rules (you may compare
        with the table's layer column, and must report where your
        determination differs from it); the effective text of the leaf after
        every supersession, span replacement and addition that applies; and
        the sha256 of that text in the canonical form. For a row the held
        texts supersede entirely, give the replacing text and name where it
        lives. For a span row and its outside row, give each separately and
        also the assembled whole.
      report: One record per table row with field, governing file, effective text (verbatim), sha256, and the clauses that decided each.
    BQ3:
      name: protocol content or machinery
      definition: >-
        For each row in BQ2, classify its effective text as either (a)
        protocol content, meaning a gate, stop, validity rule, outcome,
        control, definition, custody check, pin, parameter or any rule a run
        must obey, or (b) machinery only, meaning identity, approval status,
        provenance, citation, or how the held files govern one another. State
        your classifying rule first. Where a row mixes both, classify it as
        (a) and quote the clause that makes it so.
      report: One record per row with the class and, for class (a) rows that also carry machinery, the quoted clause.

