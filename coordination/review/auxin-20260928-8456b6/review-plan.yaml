  # ---------------------------------------------------------------------------
  # PRIOR, recorded before any reviewer exists.
  # ---------------------------------------------------------------------------
  coordinator_prior:
    recorded_before_any_report: true
    overall: >-
      I expect the round to return revise more often than hold: roughly 55
      percent K-revise, 35 percent K-hold, 10 percent K-indeterminate. The
      mechanical claims (span fidelity, one row per held leaf, not-a-layer)
      are the claims the producer built its tooling to guarantee, and I expect
      them to hold. The semantic claims (that each reference inside a span
      means the same thing in one file as it meant across four layers, and
      that nothing normative sat in the machinery the draft drops) are where
      I expect a break.
    per_joint:
      EJ1: >-
        Holds, with high confidence. The builder re-verifies every span on
        reload and the design reports zero T5 failures. If anything breaks, I
        expect it at the non-string (source_bytes) anchors, where the anchor
        convention differs from the loaded_value convention the held span
        rules use.
      EJ2: >-
        Holds on row count and on composed text for ordinary leaves.
        I expect at least one disputed row among split leaves (order or
        character range of outside segments versus replacement span) or among
        the superseded rows whose replaced_by_entries list is empty. Even odds
        that a dispute rises to a break.
      EJ3: >-
        The most likely joint to break. I expect at least one reference
        inside a transcluded span whose referent under F-READ R1 to R3 differs
        from its referent in the held stack, most likely "this file" or "this
        amendment" in a narrow or gated span that meant the combined
        governing text, or a reference that R3 turns into provenance only
        although the held text read it normatively. Whether such a shift
        changes a run-time decision I put at even odds.
      EJ4: >-
        Holds for F-N4 on the three declared C-BOUND states. For
        F-BOUND-CONSTRUCTED I expect holds or inconclusive, the risk being a
        constructed state whose expected witness set the BOUND rules leave
        open without further declared parts.
      EJ5: >-
        Holds more likely than not. The risk is a rule that lived only in
        envelope or layering machinery (an approval tie, a governs_nothing or
        does_not_rewrite clause, a v1 write_scope entry, a precedence
        tie-break) and is not restated anywhere, or a read-together group
        where the held text meant one addition to override another.
      EJ6: >-
        Holds on the CD-6 form (no incorporation, no supersession). I expect
        reviewers to flag, as disclosed surfaces rather than breaks, that the
        leaf_map was chosen using gated's governing table (PD-F3) and that
        F-WRITE writes new files under the predecessor's implementation
        directory. I expect no hidden reader of the threshold index.
      EJ7: >-
        Agreement on the effective text of most leaves. I expect any
        disagreement to localise to split leaves and non-string values, and
        leaf-set differences to come from leaf-granularity choices (reported
        under Q0) rather than from a missing rule.
    what_would_overturn_it: >-
      A span hash failure (EJ1 break) or a leaf with no row (EJ2 break) would
      overturn the high-confidence part of the prior. A clean EJ3 would
      overturn the part I hold most strongly.

