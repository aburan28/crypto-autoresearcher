  reviewers:
    TASK-20260928-e2cfcf: {role: validator, policy: review-adversarial, joints: [EJ1, EJ2, EJ4]}
    TASK-20260928-2f300c: {role: red-team, policy: review-adversarial, joints: [EJ3, EJ5, EJ6], also_owns: proves_too_much}
    TASK-20260928-36ebc2: {role: validator (blind re-deriver), policy: review-adversarial, joints: [EJ7]}

  joints:
    - joint: EJ1 -- SPAN FIDELITY AND BUILD REPRODUCIBILITY. Every item of transcluded.entries is a byte-exact copy of the span its anchor names in the blob at source_commit, under the anchor convention it declares (loaded_value or source_bytes); every span_sha256 and source_blob_sha256 recomputes; no two entries overlap in one source; build_draft.py rebuilds draft-contract.yaml byte for byte.
      assigned_to: TASK-20260928-e2cfcf
      attack_plan: >-
        Write your own verifier; do not call build_draft.py's verify path for
        this. For each entry: read the blob with git show at source_commit,
        check source_blob_sha256, resolve the anchor under the declared
        convention (YAML safe-load and walk field_path for loaded_value, then
        cut the character range if one is given; exact line and column slice
        of the blob text for source_bytes), compare with entry.text, hash
        UTF-8 bytes, compare with span_sha256. Check pairwise non-overlap per
        source (same field path, or one path a prefix of another, or
        intersecting ranges). Separately, run build_draft.py twice from the
        repository root with the source commit as argument into your own
        write scope and compare sha256 with the snapshot digest.
        Negative control (required): on a scratch copy in your write scope,
        flip one byte in one entry's text and, separately, one character of
        one anchor range; your verifier must report both. A verifier that
        passes the corrupted copy proves nothing.
        Where I think it breaks: source_bytes anchors (line and column
        convention, trailing newline, YAML block scalars).
      breaking_artifact: An entry id with the recomputed hash or resolved text that differs, an unresolvable anchor, an overlapping pair, or a rebuild whose sha256 differs from the snapshot.
    - joint: EJ2 -- LEAF_MAP COMPLETENESS AND COMPOSITION. Every row of the held governing_text_table of AMD-20260928-gated has exactly one leaf_map row and no leaf_map row lacks a held row; each `stated` row's entries, joined in the order its composition gives at the character ranges it names, equal the held effective text of that leaf; each `not_stated_superseded_in_held_table` row's replaced_by_entries resolve from the supersedes_fields item it cites, and each empty list is justified by held text.
      assigned_to: TASK-20260928-e2cfcf
      attack_plan: >-
        Build the held effective text of every leaf yourself from the four
        held texts (apply supersessions and span rules as the held texts
        state them), then compose each stated row from its entries and
        compare by sha256. Bijection check between held table rows (including
        duplicate field names and span and outside rows) and leaf_map rows.
        For every superseded row, open the cited supersedes_fields item and
        resolve its amendment.<path> names independently; compare with
        replaced_by_entries as sets and in order. For each row with an empty
        list, quote the held text that removes or retires the leaf, or
        replaces it without naming a field; if none, it is a break.
        Negative control: drop one entry id from one stated row in a scratch
        copy and confirm your check fails.
        Where I think it breaks: split leaves (outside segment boundaries at
        the held from/through texts) and the empty replaced_by rows.
      breaking_artifact: A held leaf with zero or two rows, a stated row whose composed text hash differs from the held effective text, or a superseded row whose replacement set differs from the cited item with no held justification.
    - joint: EJ3 -- REFERENCE RESOLUTION UNDER F-READ. Every reference written inside a transcluded span resolves under F-READ R1 to R6 to exactly one referent in EXP-AUXIN-edd104, and that referent decides every run-time question the same way the held referent decided it for EXP-AUXIN-7e2e3d.
      assigned_to: TASK-20260928-2f300c
      attack_plan: >-
        Enumerate every reference in every entry text by token classes:
        "this file", "this amendment", "this text", "this protocol", "the
        combined text", amendment.<path>, file names, record ids, layer names
        (v1, typed-by-hash, narrow-by-hash, gated), bare field paths, and
        "above"/"below"/"the following". For each: its held referent (in the
        four-layer stack) and its F-READ referent (which rule fires, which
        leaf_map row, which entries). Tabulate, and mark every row where the
        two differ. For each marked row, decide whether any gate, stop,
        validity rule, outcome or custody check reads through it; construct
        the concrete run-time situation in which the two readings decide
        differently. Specifically test: R1 versus R2 when a narrow or gated
        span says "this file" or "this amendment" and held text meant the
        combined governing text; R3 provenance-only on a reference the held
        text used normatively; R4 inside typed spans (Q0-11 exceptions); R5
        paths under experiments/EXP-AUXIN-7e2e3d/ that now name another
        experiment's tree; a reference that resolves to two rows or none.
      breaking_artifact: A reference with no referent, two referents, or one whose F-READ referent decides a named run-time question differently from its held referent, with the situation constructed.
    - joint: EJ4 -- THE FRESH DECISION CLAUSES F-N4 AND F-BOUND-CONSTRUCTED. F-N4's biconditional holds against the transcluded texts it reads with (the N4 condition is met on a state iff C-BOUND gate 1, 2 or 3 fails on that state on path A or path B, which is exactly when stopping rule 10 fires with outcome N4), and F-BOUND-CONSTRUCTED yields exactly one expected block for any BOUND state a reviewer declares.
      assigned_to: TASK-20260928-e2cfcf
      attack_plan: >-
        Build the truth table: for each returned field F-N4 names (status,
        witness set, witness, bin, bin_at_least, boundary_flag, upper bound,
        lower bound) crossed with (differs or not on path A, path B), read
        which gate compares it in the transcluded C-BOUND gates, including
        gate evaluation mode. Look for a field that can differ from the
        expected block while no gate fails (a field gate 1 does not compare,
        a lower bound gate 2 does not test, a CONSISTENCY case outside
        BND-1), or a gate failure with no field "other than the fixed
        value". Evaluate on BND-1, BND-2 and BND-3 as stated in the draft,
        building each state from its recipe with your own code. Then declare
        one BOUND state of your own that bins NEAR_FLOOR, record its parts
        and derive its expected status, witness set and witness from the
        D3 BOUND rules and its bin fields from bin_by_status BEFORE
        evaluating; report whether any field admits two values.
        Where I think it breaks: bin_at_least absent from an evaluator report,
        and constructed states whose witness set depends on a part the rules
        do not force the reviewer to declare.
      breaking_artifact: A concrete state and field on which N4 and stopping rule 10 disagree, or a declared constructed state with two admissible expected values for one field.
    - joint: EJ5 -- NOTHING NORMATIVE DROPPED, NOTHING OVERRIDDEN. No `not_stated_envelope_or_layering` row carries a run-time rule that the successor does not state elsewhere; every additions_read_together group reproduces the held path_additions it derives from, and F-PREC's "read together, none overrides another" decides every such path the way held precedence did.
      assigned_to: TASK-20260928-2f300c
      attack_plan: >-
        For every envelope_or_layering row, read the held text of the leaf
        and extract every normative clause (must, shall, only, refuse, stop,
        invalid, fail, before, unless, conditioned on). For each, name the
        successor entry or fresh field that states it, or record it as
        dropped and say what a run could now do that it could not before.
        Pay particular attention to approval ties inside incorporation
        blocks, governs_nothing, does_not_rewrite, cites, authorization,
        non_claims and the v1 write_scope. For every read-together group,
        compare with the held path_additions entry (path, held layer,
        additions, read_as); then look for two grouped texts that conflict and
        that held precedence resolved by layer order. Construct the run-time
        question on which "none overrides" and the held order answer
        differently.
      breaking_artifact: A dropped normative clause with the run-time behaviour it permitted, or a read-together path with conflicting texts that held precedence resolved and the successor leaves open or resolves differently.
    - joint: EJ6 -- A NEW EXPERIMENT, NOT A FIFTH LAYER; THE SURFACE AROUND IT. EXP-AUXIN-edd104 incorporates nothing by hash or reference, supersedes no held field, and no part of its meaning at run time depends on the content of any EXP-AUXIN-7e2e3d file (the CD-6 form); F-PREC, F-APPROVAL, F-CUSTODY, F-WRITE, F-REV, F-PRE and F-H are consistent with the transcluded rules they sit beside; and no normative clause reads the threshold index (F-INDEX), whether or not it names it.
      assigned_to: TASK-20260928-2f300c
      attack_plan: >-
        Dependence test: identify every path by which a run-time decision of
        the successor could consult an EXP-AUXIN-7e2e3d file (a reference
        resolved outside leaf_map, a hash the run must check against a held
        file, F-WRITE's new files under the predecessor's implementation
        directory, R5 paths, F-PRE). For each, state whether a change to that
        held file, holding the successor's bytes fixed, could change the
        successor's outcome. Apply the design's own residual-risk question
        (PD-F3): is leaf_map a copy of gated's decisions or a dependency on
        them? Custody: check F-CUSTODY's added hash and pre-A0 span check
        against the transcluded stopping rule 12 and launch checks. F-H:
        check that the binding to H-AUXIN-6db354 reads only through the
        transcluded falsification-condition mapping and that the
        DEC-20260926-96f970 correction condition is stated. F-INDEX: search
        every normative entry for a clause that reads the index content
        without naming it (a clause that says "every threshold", "the listed
        cut-offs", "each constant above", or iterates over a list).
      breaking_artifact: A run-time decision of the successor that changes when a held file changes and the successor does not; a fresh field that contradicts a transcluded rule; or a normative clause that reads the threshold index.
    - joint: EJ7 -- BLIND RE-DERIVATION OF THE HELD EFFECTIVE TEXT PER LEAF. See blind_rederivation. Owned by the re-deriver; its verdict is inconclusive by design and the composer compares.
      assigned_to: TASK-20260928-36ebc2
      attack_plan: >-
        The re-deriver computes BQ0 to BQ3 in coordination/review/auxin-20260928-8456b6/blind-inputs.yaml
        from the held texts alone. The composer compares BQ2 per leaf against
        the effective text the draft composes for that leaf (from leaf_map
        and the entries it names), BQ1 against the leaf_map rows, and BQ3
        against the leaf_map dispositions.
      breaking_artifact: A leaf whose re-derived effective-text sha256 differs from the draft's composed text, traced by the composer to the draft rather than to the re-deriver; or a leaf present in BQ1 and absent from leaf_map.

  joints_note: >-
    These joints are named for this draft's surfaces (the design report's
    new_surfaces_this_design_introduces), not copied from any earlier round.
