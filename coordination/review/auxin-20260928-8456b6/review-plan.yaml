  # ---------------------------------------------------------------------------
  # PROOF_SEARCH_MAP. Recorded, not omitted.
  # ---------------------------------------------------------------------------
  proof_search_map:
    applies: false
    reason: >-
      As the design report records (design-report.yaml proof_search_map):
      this deliverable claims no theorem, asymptotic bound, certificate
      family, reduction or closure; it restates a frozen protocol in one
      file. The four audits have nothing to act on: there is no baseline
      bottleneck to reproduce, no observation whose collisions could fake a
      result, no quantified statement whose order could be swapped, and no
      method ceiling to measure. The held proof_search_map of
      AMD-20260926-typed.yaml is transcluded unchanged as protocol content
      and is reviewed as text under EJ1 and EJ2, not re-run.
    what_stands_in_for_it: >-
      The proves-too-much objects above (a known layer, a known
      multi-statement file, a known-false N4 variant, a known-incomplete
      copy) are the falsification controls this kind of claim admits.

  # ---------------------------------------------------------------------------
  # REPORTS, SEAL AND COMPOSITION.
  # ---------------------------------------------------------------------------
  attestation_schema_note: >-
    Every report carries review_attestation as templates/research-records.md
    defines it (task_id, joints_owned, sources_read, read_sibling_reports,
    blind_from_respected for the re-deriver) and a `verdicts` mapping keyed by
    joint label (EJ1 ... EJ7) with holds, breaks or inconclusive. The red team
    also reports each PTM object with the observed behaviour against its
    failure_signature. No whole-claim verdict.
  seal: >-
    TASK-20260928-bbc985 hashes every file under each reviewer's reviews/
    directory after all three return, before composition. The composer
    verifies every report against the seal; a mismatch voids composition.
  independence_check: >-
    python3 tools/check_review_independence.py --plan coordination/review/auxin-20260928-8456b6/review-plan.yaml
    --reports coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-8456b6/reviews/
    run by the composer; its result is recorded in the composing decision
    whatever it is.

  composition:
    who: >-
      The Coordinator, in TASK-20260928-1dd5cc, in a session that did not run
      TASK-20260928-fa9275, TASK-20260928-b371f2, TASK-20260928-3e700b or any
      reviewer task of this round. It stages DEC-20260928-004532 in its
      composition directory; TASK-20260928-2fee7d places it.
    reads: the sealed reports, the seal, this plan, the draft and the held sources. Nothing of any earlier round's reports.
    keys_in_precedence_order:
      - key: K-escalate
        when: A reviewer reports, with a quoted clause, that the draft claims a breakthrough, a closure result or a contradiction of validated evidence.
        then: Composition stops. A review-breakthrough round is carded under a new plan; the claim is not promoted. That tier is never downgraded.
      - key: K-infra
        when: A reviewer task failed, timed out or crashed, or returned no report.
        then: No evidence either way. The joint is re-carded in a new task; never a negative result.
      - key: K-leak
        when: The re-deriver's attestation lists a blind_from path, blind_from_respected is false, or a pre-dispatch hygiene check failed on its ref.
        then: EJ7 is void (not evidence). A new blind task under a new id; the other joints compose normally.
      - key: K-revise
        when: >-
          Any of EJ1 to EJ6 breaks with its breaking_artifact; or a BQ2 leaf
          (outside the threshold index) disagrees with the draft's composed
          text and the composer traces the difference to the draft; or a BQ1
          leaf that carries a run-time rule (BQ3) has no leaf_map row.
        then: >-
          EXP-AUXIN-edd104 is not approved. Under F-REV, any fix is a new
          successor contract under a new EXP id that states every rule once;
          no amendment layers this draft. RS-B stays the selected scope; no
          re-ranking unless a rerank_trigger fires.
      - key: K-reviewer-error
        when: A BQ2 or BQ1 disagreement the composer traces to the re-deriver (the draft matches the held text and the re-derived text does not).
        then: Recorded as a re-deriver error on that leaf, not a draft defect. If it leaves any leaf uncompared, a new blind task covers only those leaves before K-hold can be read.
      - key: K-indeterminate
        when: Any joint is inconclusive with no break; or a PTM object fails its failure_signature (the method proved too much), which voids the verdict of the joint that relied on it.
        then: Inconclusive. A successor review task on the affected joints only, under an addendum to this plan. No approval.
      - key: K-hold
        when: >-
          EJ1 to EJ6 hold; every PTM object behaves per its failure_signature;
          EJ7 agrees on every compared leaf after Q0 granularity
          reconciliation that changes no text; the independence check passes.
        then: >-
          The round holds. The composing decision may approve
          EXP-AUXIN-edd104 by name at sha256
          a85aa7630ecca8f11385a5ff6c52d9fa9197028a96366852565d0804603c4a69
          under F-APPROVAL. It still does not set
          scientific_execution_authorized; placement under
          experiments/EXP-AUXIN-edd104/ is a later archived act; any executor
          card carries F-PRE unweakened. H-AUXIN-6db354 stays proposed.
    no_key_after_the_fact: No key is added, removed or reworded after any report returns, except by an addendum written before the composer reads a report, disclosed in procedure_deviations.

