  # PROVES-TOO-MUCH CONTROLS. Objects for which the governing claim is KNOWN
  # FALSE. Owned by the red team; built as scratch objects in its own write
  # scope, never committed over any held or producer file.
  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20260928-2f300c
    governing_claim_tested: >-
      "This file states the held protocol once, equivalently, and is not a
      governing layer on any held text."
    failure_signature: >-
      On every object below, the test or argument the red team uses for the
      governing claim must come out FALSE (gated classified as a layer; the
      four-file concatenation rejected as not stated once; the exact-equality
      N4 variant shown to let the condition and stop disagree; the copy with
      a removed entry shown incomplete). An argument that returns TRUE on any
      of them has proved too much, and the joint that relied on it is
      K-indeterminate. Each object also carries its own signature below.
    objects:
      - id: PTM-1
        object: AMD-20260928-gated.yaml itself, read as a candidate "successor".
        known_false_because: It incorporates narrow by hash, states precedence over the four-layer set and supersedes held fields. It is a layer by construction.
        failure_signature: The not-a-layer criterion the red team applies under EJ6 must classify it as a layer. If the criterion passes gated, it proves too much and EJ6's verdict is void.
      - id: PTM-2
        object: A scratch concatenation of specification.yaml and the three amendments typed, narrow and gated into one YAML file under distinct top-level keys, with no leaf_map and no fresh block.
        known_false_because: It states superseded text beside its replacement and carries four precedence and incorporation blocks. It does not state every rule once.
        failure_signature: The "stated once and equivalently" test the red team applies under EJ3 and EJ5 must reject it (a rule stated twice with conflicting text, or precedence needed to decide). If the test accepts it, the test proves too much.
      - id: PTM-3
        object: A scratch copy of draft-contract.yaml in which F-N4's clause fixing the bound comparison at the gate-2 tolerance is replaced by exact equality of each real-valued bound, all else unchanged.
        known_false_because: Under exact equality, a bound within tolerance but unequal meets the N4 condition while gate 2 passes, so the N4 condition and stopping rule 10 can disagree.
        failure_signature: The argument that the unmodified F-N4 makes the condition and the stop coincide must FAIL on this variant. If it still goes through, it did not use the tolerance clause and has proved too much. (EJ4 is the validator's; the red team runs this control on the argument as the draft and design report state it, not on the validator's report.)
      - id: PTM-4
        object: A scratch copy of draft-contract.yaml in which one transcluded entry is removed and its leaf_map row left pointing at the removed entry id.
        known_false_because: A leaf's rule is no longer stated.
        failure_signature: Any completeness argument the red team relies on under EJ5 must detect the missing entry.
    note: >-
      The validator's EJ1 and EJ2 negative controls (corrupted span, dropped
      entry id) are joint-internal controls on its own verifier; they are not
      substitutes for these.

