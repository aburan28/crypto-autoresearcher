      The blind card and blind-inputs.yaml state the quantities and the
      files the re-deriver may open. They quote no census value, control
      integer, witness integer, depth, curve name, count or result computed
      by the producer or any reviewer.
    excluded_from_blind_comparison: >-
      The threshold index (F-INDEX says it is excluded from blind comparison
      in any review plan of this contract). The re-deriver still reports it
      under BQ2 as held text; the composer does not use those rows to decide
      K-hold or K-revise.
    why_this_quantity: >-
      It is the load-bearing quantity of the governing claim: if the
      successor states the held protocol once and equivalently, then for
      every held leaf the text the successor composes equals the held
      effective text. The producer derived both sides with one tool
      (build_draft.py); a re-deriver who never sees that tool, the draft or
      the report computes one side independently, and the composer compares.
      The control-integer re-derivation of earlier rounds is not repeated:
      once BQ2 agrees on the leaves that define the controls, the successor's
      controls equal the held controls byte for byte, and the fresh clauses
      that change how they are read are EJ4's.

