      Only the producer's four design files carry the producer's reading.
      The rest are listed because they quote or will quote it: archives
      (receipts), the queue and plan renders (card notes), sibling reports,
      the seal and composition, earlier rounds, decisions and the goal head.
      Two whitelisted paths also appear in no blind_from entry, and no
      whitelisted path lies under a blind_from directory.
