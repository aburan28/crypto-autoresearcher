blind_inputs:
  task_id: TASK-20260926-bd9417
  review_plan_id: REVIEW-AUXIN-20260926-2fc87b
  source_of_recipes: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
  source_note: >-
    The file named above is the ONLY source of control recipes, classification
    rules, cost formulas, gates and conventions. If a recorded queue revision
    has retargeted your card to a successor experiment specification, the path
    on your card's read_scope governs instead. If the file refers to another
    file for a recipe, a rule, a formula, an integer or a convention, do NOT
    open that other file. Record the reference as a finding under Q0 and
    continue with whatever the file itself states.

  what_you_are_testing: >-
    Whether the file's recipes, rules, formulas, gates and conventions are
    fully determined by its text. You are not asked whether they are good
    choices. Afterwards, your results will be compared with a second
    implementation written by someone who shares nothing with you.

  quantities:
    Q0:
      name: undetermined choices
      definition: >-
        Record every point at which the text left you a choice: a search start,
        step order, primality test, acceptance rule, tie-break, rounding rule,
        tolerance type (absolute or relative, and in which quantity),
        candidate-counting convention, gate evaluation mode, unit, or a
        reference to another file. For each, quote the text, list the readings
        you consider admissible, and say which quantities below depend on the
        choice. If the text itself declares a choice immaterial, quote that
        declaration and say whether any value you computed depends on it.
      report: A list. An empty list is a result, and must be stated as such.
    Q1:
      name: control integers
      definition: >-
        For every control the file declares, including any field-prime,
        bound-evaluator or planted control, the integer or integers its recipe
        produces. Follow the recipe literally, with the declared seeds and
        windows.
      report: >-
        For each integer, report all of the following:
        - the integer in decimal and its bit length;
        - the number of candidates examined, under the file's own counting
          convention (or under each admissible convention, if Q0 lists one);
        - a primality certificate, for every integer the recipe requires to be
          prime.
        Where Q0 lists a choice that changes the integer, report the integer
        under each admissible reading.
      tolerance: exact
    Q2:
      name: per-branch classification of each control
      definition: >-
        For each Q1 integer, what the file's own rules assign on the r - 1
        branch and on the r + 1 branch: status, category or bin, any boundary
        flag, and the minimising divisor with its full tie set. Also report the
        divisors those rules rely on.
      report: >-
        Report per branch: status, category, flags, minimiser and tie set, with
        bit lengths.
      tolerance: exact
    Q3:
      name: per-branch typed cost of each control
      definition: >-
        For each Q1 integer, the cost the file's formula gives on each branch at
        the divisor its rules select, and the input model the file attaches to
        that branch.
      report: log2 of each cost, to at least four decimal places, and the input model.
      tolerance: 0.01 bit
    Q4:
      name: declared-state bound evaluator control
      definition: >-
        If the file declares a control whose factorisation state is fixed in
        advance so that a branch is a BOUND, apply the rules to that declared
        state. Report the status, witness minimiser, lower and upper bound, and
        bin they return. Report separately the values the file states in
        advance, if it states any. If no such control is declared, say so.
      report: Status, witness, both bounds as log2 to four decimal places, bin; and the file's stated values.
      tolerance: exact status and witness; bounds 0.01 bit
    Q5:
      name: gate outcomes on the controls
      definition: >-
        For every gate or acceptance test the file applies to its controls,
        report pass or fail under the evaluation mode the file declares, with
        the margin.
      report: Gate name, value, threshold, margin, pass or fail.
      tolerance: exact pass or fail

  rules:
    - BL-1 Read ONLY the six whitelisted paths on your card. Every other path in the repository is out of scope.
    - BL-2 Run no git command that shows history (log, show, blame, diff) and read no pull-request text.
    - >-
      BL-3 Choose your own libraries and algorithms and name them with
      versions. Published mathematics from outside this repository is allowed
      and is cited with provenance. Do not transcribe any integer from any
      source.
    - >-
      BL-4 If a file you were permitted to read contains a value that looks
      like an already-computed answer to Q1 to Q5, STOP and report a leak.
    - BL-5 Report on J4 only. Give no verdict on the file as a whole.
    - BL-6 ZERO experiment runs. Run no Cheon algorithm and generate no [x^i]P. This is an independent computation.
    - BL-7 Write nothing outside your write scope. Put every script, command and raw output inside computations.json.

  verdict_rule_for_your_attestation: >-
    Your review_attestation verdict on J4 is inconclusive by design, because
    you are forbidden to compare. Report Q0 to Q5 in full. The composing
    Coordinator compares them with the other implementation under the plan's
    keys.
