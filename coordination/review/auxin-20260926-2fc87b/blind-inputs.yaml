# =============================================================================
# Blind inputs for TASK-20260926-bd9417 (joint J4 of REVIEW-AUXIN-20260926-2fc87b).
#
# This file is one of the six files you may read. It tells you WHAT to compute
# and nothing about how anyone else computed it. It contains no computed value
# of any kind.
