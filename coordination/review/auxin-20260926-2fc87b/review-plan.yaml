  # ---------------------------------------------------------------------------
  # COMPOSITION KEYS, frozen before the draft or any report exists.
  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20260926-f29a5d, in a session that did NOT run
      TASK-20260926-9b3d5e. No reviewer votes on the whole draft.
    independence_check: >-
      Two checks are run, and both results are recorded in DEC-20260926-96f970
      whatever they are.
      - Run `python3 tools/check_review_independence.py --plan
        coordination/review/auxin-20260926-2fc87b/review-plan.yaml --reports
        coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-2fc87b/reviews/`.
      - Before J4 is dispatched, run the --blind-history checks against both
        BATCH-2fc87b/batch.yaml and BATCH-ba0b0d/batch.yaml, and scan the
        tokens of both producer files against both digest sets.
    keys:
      K-approve: >-
        All of the following must hold:
        - every joint holds;
        - J3 and J4 agree on every Q1 to Q5 value within tolerance;
        - neither reports an open material choice;
        - every PTM meets its failure signature;
        - every coverage entry has a discharging clause that its owning joint
          reports as holding;
        - no regression;
        - no tripwire fired.
        DEC-20260926-96f970 then approves AMD-EXP-AUXIN-7e2e3d-20260926-typed
        under the AGENTS.md standing user authorization. On that basis it may
        move H-AUXIN-6db354 from proposed to approved, as that record's
        status_note provides. Its first next action is the opening of an
        execution batch. That batch's first card, minted then, provisions and
        admits the declared tools per K-provision before any census run.
        Approval asserts nothing about any curve.
      K-revise-defect: >-
        Decision revise in either case below:
        - any joint breaks on any coverage entry;
        - the draft omits a field that approval requires.
        The decision lists each defect with the joint and breaking artifact
        that found it, and names a revision design card in a new batch as its
        first next action. No run.
      K-regression: >-
        Anything that held in d1d10 (regression_coverage) breaks in the draft.
        Decision revise, with the regression named separately from new defects.
      K-indeterminate: >-
        Decision revise on D5 if either condition below holds, whichever
        implementation looks right:
        - J3 and J4 disagree on any Q1, Q2, Q4 or Q5 value, or on any Q3 value
          beyond tolerance;
        - either reports a choice that the text leaves open and that affects
          any reported quantity or any run-time decision.
        Exception: a choice point the text explicitly declares immaterial, with
        a reason, does not fire this key, provided neither implementation found
        that it changes a value. DEC-20260923-a4c3d5 undischarged_defects entry
        6 names that route.
      K-hypothesis: >-
        The design report, J2 or J5 finds that H-AUXIN-6db354 cannot carry the
        protocol without a change. Composition then files a correction or a
        successor hypothesis. Its id is minted by the top-level session and
        added to TASK-20260926-f29a5d's write_scope and artifact_paths, and to
        TASK-20260926-fee2f3's archive.record_ids, by a recorded queue
        revision BEFORE the record is written.
      K-provision: >-
        A declared tool is absent from the base review environment. The
        reviewer installs the declared version under scratch and runs the
        admission gate as written, and the gate determines admission. Then J6
        reads on the text. The absence is recorded as a dispatch precondition
        of any future executor card, and it is not a text break
        (DEC-20260926-0eed78 R7). A gate that cannot be executed as written is
        a text break under K-revise-defect.
      K-infra: >-
        A reviewer could not run a joint: a tool could not be installed, the
        environment failed, or the budget was exhausted. That joint reads
        inconclusive. No approval while any of J1, J3, J4 or J6 is
        inconclusive; the decision is revise or replicate the review. An
        infrastructure failure is never negative evidence about the draft's
        mathematics or any curve.
      K-route: >-
        If the producer took the successor-experiment route, every key above
        applies to the successor specification. K-approve then approves that
        experiment instead of an amendment.
      any_tripwire: See tier.tripwires. Composition stops and the matter routes to review-breakthrough.

