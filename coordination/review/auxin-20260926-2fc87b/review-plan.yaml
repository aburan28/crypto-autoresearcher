  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Not lifted. No reviewer of this round reads another reviewer's report
      from this round. Reading the BATCH-09aadd reports by the validator and
      the red team is not a sibling read. Those reports are the previous
      round's findings the draft must discharge, and the cards permit them
      (DEC-20260926-0eed78 R8). J4 reads none of them.
    excluded_from_every_reviewer: >-
      experiments/EXP-FROB-30006a/, the ref origin/cursor/semaev-2015-audit-program-5b8b,
      and PR #1377.

  # ---------------------------------------------------------------------------
  # PROVES TOO MUCH.
  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20260926-bc2a62
    objects:
      - id: PTM-A
        object: >-
          The inert-on-both-branches prime of the TASK-20260922-0e10d1 PTM-2
          construction, rebuilt from the construction, not copied.
        known_truth: Neither r - 1 nor r + 1 carries a useful divisor.
      - id: PTM-B
        object: The brainpoolP384r1 field prime (RFC 5639 p) presented as r.
        known_truth: It is not the order of the curve's prime subgroup.
      - id: PTM-C
        object: >-
          Uniformly random primes at two bit sizes: 256, and at least one
          frozen-row size other than 256. Sampler and seed are declared in
          computations.json before any prime is evaluated.
        known_truth: They carry no curve-specific structure.
      - id: PTM-D
        object: A toy prime r for which r + 1 has a divisor d strictly greater than sqrt(r).
        known_truth: The r + 1 cost at that d is at least d, which exceeds sqrt(r).
      - id: PTM-E
        object: >-
          A prime r you construct so that you know the full factorisation of
          r + 1 (or of r - 1). Present it under a declared state in which two
          or more composite parts remain unfactored.
        known_truth: >-
          The branch value is not known to the pipeline in that state. The
          true minimum lies inside any correct bound pair.
    failure_signature: >-
      A correct draft keeps each known-false conclusion out of reach in its
      RULES:
      - PTM-A is reported inert, or not flagged, on both branches.
      - PTM-B is rejected by the confounder check before any factoring or cost.
      - PTM-C gets the same categories as a deployed row, and no category is
        read as curve-specific, at either size.
      - PTM-D receives an r + 1 cost of at least sqrt(r).
      - PTM-E is reported BOUND, never EXACT, with the witness the text fixes
        and a bound pair that brackets the true minimum.
      Any other outcome has proved too much.
    how_to_run_it: >-
      REVIEW COMPUTATIONS. They mint no RUN-*, write no evidence record, run no
      Cheon algorithm, generate no [x^i]P, and never execute
      experiments/EXP-AUXIN-7e2e3d/implementation/driver.py as an experiment.
      Every script, seed and output goes in computations.json. A PTM that would
      amount to a new experiment is recorded NOT PERFORMED with the reason.

