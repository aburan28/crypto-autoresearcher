  # ---------------------------------------------------------------------------
  # JOINTS. Each has exactly ONE owner.
  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        J1 -- PINS AND THE FIELD-PRIME CONFOUNDER (D1; coverage entries 1 to
        4). Every r is pinned at run time from a named primary source. The
        parse rule determines exactly one integer from each source span, with
        no reader's choice: printed representation, continuations, lost
        superscripts or signs, page furniture, line-terminator convention for
        line numbers, and the archived text form of an HTML source are all
        fixed. A time-dependent source is pinned to a revision that cannot
        drift, and its retrieved bytes are archived with their sha256. Rows
        taken from derived text files are digit-verified against the
        authoritative document named by the repository's source record. The
        confounder check is not self-referential. Its clause order and
        multi-reason recording are declared, and a mutation check with the
        equality clause disabled is required.
      assigned_to: TASK-20260926-b99738
      attack_plan: >-
        (i) For each of the ten frozen rows, follow the pin procedure literally
        to its source, re-derive r yourself, and list every point where the
        text left you a choice. Re-run VAL-20260923-c3c90c's choices C1, C2,
        C3, C5 and C6 against the new text: each must now be closed by a
        quoted clause.
        (ii) For the BLS12-381 row, retrieve the pinned revision and the latest
        revision of the named source. Show that the new locator reaches the same
        integer on the pinned revision, and that the procedure says what
        happens if the pinned revision is unreachable (an infrastructure stop,
        never a substitution).
        (iii) Follow the PDF digit cross-check on one .txt-derived row and say
        whether its comparison rule is determinate.
        (iv) Substitute the brainpoolP384r1 field prime for r, and separately a
        cofactor-1 row's field prime. Show that the check fires before any
        factoring. Then run the mutation the text requires, with the equality
        clause disabled, and report what the text says must happen.
        (v) Give a row two rejection reasons at once and say whether the text
        fixes the recorded reasons and their order.
        WHERE I THINK IT BREAKS: (ii), then (iii).
      breaking_artifact: >-
        Any of the following breaks J1:
        - a pin that needs a reader's choice;
        - a locator that fails on its pinned revision, or that can drift;
        - a cross-check without a determinate comparison rule;
        - a field prime admitted;
        - a confounder check that still refers to the row it tests;
        - an undeclared clause order or multi-reason rule;
        - a missing mutation check.
    - joint: >-
        J2 -- TYPED COSTS, PREDICATE, BOUND EVALUATOR AND HYPOTHESIS BINDING
        (D2, D3 regression; coverage entries 14 and 16). The two branch
        expressions and input models match Cheon 2006 Theorems 1 and 2 and
        H-AUXIN-6db354. A declared-state BOUND evaluator control exists whose
        expected status, witness minimiser, bound pair and bin are fixed by the
        text in advance. A witness rule covers several composite parts. Bin
        precedence at 3/4 is stated. ERH and generator conditions are carried
        as labels. A memory column is present or its omission is stated. The
        citation is to Theorem 2. A planted positive sits above the F2/F3
        routing size. The D2 provenance records that the 2010 manuscript has
        been read. The draft is stated against H-AUXIN-6db354 and contradicts
        none of its falsification_conditions.
      assigned_to: TASK-20260926-bc2a62
      attack_plan: >-
        (i) Compare both expressions and input models term by term with the
        retrieved primary sources. You may cite the retrievals of
        RT-20260923-38bbbf, but re-read at least Theorem 2 yourself and say
        which version you read.
        (ii) Take the declared-state BOUND evaluator control. Compute what the
        text's rules return and compare it with the value the text fixes in
        advance.
        (iii) Construct a row with two composite parts left unfactored under a
        declared state, and say what the witness rule returns and whether the
        text determines it (PTM-E).
        (iv) Evaluate the bin rule at exactly 3/4.
        (v) Check that the RC2 planted positive's declared size lies above the
        routing size the text declares.
        (vi) Read H-AUXIN-6db354's statement, assumptions and
        falsification_conditions against the draft, and quote any
        contradiction.
        (vii) Regression: re-evaluate the D3 rules on one constructed
        unfactored row and one constructed r + 1 witness row.
        WHERE I THINK IT BREAKS: (ii) or (iii).
      breaking_artifact: >-
        Any of the following breaks J2:
        - a formula or input model that disagrees with the source or with
          H-AUXIN-6db354;
        - a BOUND evaluator result that differs from its pre-fixed value;
        - an undetermined witness or bin rule;
        - a missing carried item;
        - a contradiction with the hypothesis;
        - an arithmetic-only value in a cost column.
    - joint: >-
        J3 -- CONVENTIONS, CONTROL CONSTRUCTIBILITY AND CALIBRATION (D4, D5,
        construction-recipe regression; coverage entries 5, 6 and 15). Every
        control, including C-FIELD and any new control (the BOUND evaluator
        control and the RC2 positive), is built from the draft's text alone,
        inside its window. Each Q0 item of the BATCH-09aadd re-derivation
        report is closed by a declared convention or declared immaterial with a
        reason. Every threshold is a function only of the frozen null arm or of
        declared constants. The evaluation mode of any gate whose lower margin
        lies below the path tolerance is declared.
      assigned_to: TASK-20260926-b99738
      attack_plan: >-
        (i) Build every control integer from the draft text with your own code,
        transcribing nothing from any report. Report each integer, the
        candidates examined under the declared counting convention, and every
        point where the text left a choice.
        (ii) For each of Q0-1 to Q0-12 of
        coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/reviews/TASK-20260923-edaa75/rederivation-report.yaml,
        quote the closing clause or the immateriality declaration. Say
        whether that clause itself leaves a reading open.
        (iii) List every threshold and gate with the quantities it reads (the
        F-J3-2 inventory), and evaluate each gate on the controls under the
        declared mode.
        (iv) Check that the N3 conflicts named in F-J3-1 are gone.
        (v) AFTER (i) is complete and recorded, compare your integers for the
        three carried recipes with the BATCH-09aadd values. Report agreement
        or difference as a cross-round regression item (PD-R1b).
        WHERE I THINK IT BREAKS: (ii), at a new convention.
      breaking_artifact: >-
        Any of the following breaks J3:
        - a control not buildable from the text, or outside its window, or
          failing its own acceptance rule;
        - an open choice;
        - a Q0 item neither closed nor declared immaterial;
        - a threshold reading a deployed-row value;
        - a carried recipe whose output changed without the draft saying so.
    - joint: >-
        J4 -- BLIND DETERMINACY. Given only the draft text, two implementations
        that share nothing produce the same Q1 to Q5 values of blind-inputs.yaml,
        and neither reports an open material choice.
      assigned_to: TASK-20260926-bd9417
      attack_plan: >-
        See blind_rederivation and
        coordination/review/auxin-20260926-2fc87b/blind-inputs.yaml. The
        re-deriver is told what to compute and not how.
      breaking_artifact: >-
        Any value that differs from J3's beyond tolerance, or any open material
        choice reported. This localises a fault to an undetermined text or to
        one of two named implementations. It does not say which.
    - joint: >-
        J5 -- LABELLING, UNIT, SCOPE AND PROVES-TOO-MUCH (D9; coverage entries
        11 to 13). The rho column carries the CORR-20260923-f5f060 unit
        statement, and no sentence equates the units. The plus-branch
        secondary metric is labelled or dropped. None of S2 and S4 to S8
        survives unnarrowed, and no NEW sentence in the draft or design report
        exceeds a typed, labelled arithmetic table at the frozen orders. The
        rules, not the prose, keep PTM-A to PTM-E out of reach.
      assigned_to: TASK-20260926-bc2a62
      attack_plan: >-
        (i) Read the draft and the design report line by line. Quote every
        sentence that states or implies more than its measurement supports.
        Check each against CORR-20260923-187ea3, CORR-20260923-5c5a23 and
        CORR-20260923-f5f060.
        (ii) Re-check S1 to S8 of RT-20260923-38bbbf one by one against the
        new text.
        (iii) Perform PTM-A to PTM-E against the failure signature with your
        own script.
        WHERE I THINK IT BREAKS: (i), on a new sentence.
      breaking_artifact: >-
        An unlabelled unit or metric, an over-scoped sentence, or a PTM object
        on which the rules reach the known-false conclusion.
    - joint: >-
        J6 -- TOOLS, ADMISSION, BUDGET MEASUREMENT AND CUSTODY (D6, D8; D7 and
        D10 regression; coverage entries 7 to 10). The admission gate names
        tools and versions, uses commands that actually report those versions,
        and determines admission. The ECM schedule per B1 level is fixed to one
        column. Seconds are recorded per cofactor when an integer has several
        composite parts. The budget and timeout mechanism is determinate when
        PARI runs in-process. Imports outside the implementation directory are
        forbidden or bound. Snapshot-bound implementation bytes are compared
        with the launch commit. Regression: certificates are exported and
        checked by a library-free verifier, and the draft is a new file that
        rewrites nothing.
      assigned_to: TASK-20260926-b99738
      attack_plan: >-
        (i) Install the declared tool versions under scratch if absent, and
        record absence from the base environment. Run the admission gate
        exactly as written and say whether it admits, refuses or cannot be
        executed (K-provision).
        (ii) Read the F3 schedule and derive the curves per level from the
        named column. Say whether a second reader could choose another.
        (iii) Construct an integer with two composite cofactors and say what
        seconds the text requires to be recorded, and when the timeout fires
        in-process.
        (iv) Read the snapshot and launch clauses and say whether an executor
        could import an unbound module or launch on bytes that differ from the
        snapshot without breaking a written rule.
        (v) Produce one certificate of the declared kind for a prime of at least
        250 bits of your choosing, and verify it with a verifier that does not
        import the producing library.
        (vi) Check with git that specification.yaml, AMD-20260916-bands.yaml and
        AMD-20260923-d1d10.yaml are byte-identical before and after the
        producer's snapshot commit.
        WHERE I THINK IT BREAKS: (iii).
      breaking_artifact: >-
        Any of the following breaks J6:
        - a gate that cannot be executed as written, or does not determine
          admission;
        - an undetermined schedule, seconds rule or timeout;
        - an unbound import or launch path;
        - a certificate route that fails;
        - any byte change to a frozen file.

