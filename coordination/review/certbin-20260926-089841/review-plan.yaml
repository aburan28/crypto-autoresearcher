    compensate.

    Per joint:
    J1 (author-independent certificates and instance binding): holds, about
    90%. The likeliest failure is infrastructural: the fresh-key format
    "<ARM>:<slot>:<role>" (implementation.md deviation 1), the E_layout
    decoding, or the wdag-v1 body parsing (prods [[j, c]]), not a false
    certificate.
    J2 (construction and draw fidelity): holds, about 85%. If it breaks, I
    expect it in the row-major placement of the drawn bits on S_L, in the
    identity-rejection comparison, or in the stream consumption order (one
    call per attempt, slot order then attempt order).
    J3 (closure fidelity, M_D against W_D): holds, about 85%. The engine
    replays RC-1 exactly (C-ENGINE), so a break would be in the run's own glue:
    which record is labelled an M_4 refutation, the wdag extractor on
    iteration-0 refutations, or the rc_b substitution for a dense ell.
    J4 (instrument, package, procedure, D-1 completeness): holds WITH FINDINGS
    I am fairly sure of: C-VERIFIER type (c) is declared vacuous for two M_4
    kinds (deviation 9), so the run never showed that its verifier rejects a
    degree violation there; the development dry run (deviation 7) is
    unauditable beyond file mtimes but cannot move a seed, a threshold or a
    rule; CRYPTO_AR_GF2_THREADS was 2, not the default 3, which the
    specification permits; manifest_v2 is additive as registered.
    J5 and J6 (statistics, decision rules): hold. Most primary counts sit at a
    floor or ceiling, so recomputation agreement is weak evidence about the
    implementation, and both joints must say so per item.
    J7 (blind re-derivation): holds (derivability), about 80%. The stream
    replay is the likeliest place for an honest ambiguity (numpy call shape,
    duplicate rejection, what "first satisfiable draw" means when it precedes
    the first unsatisfiable one).
    J8 (comparison): agreement on every compared quantity, about 80%; the
    stream replay is where I least trust agreement, then the rc_b fields.
    J9 (is N-CONV the right null): I expect the red team to find that it is a
    VALID null for the question as frozen (is S_3's lower part NEEDED for
    refutation by W_4) and a WEAK null for the phenomenon that motivated it
    (S_3 at U62 needs W_4 because M_4 fails). About 75%, for three reasons I
    expect to be confirmed: (a) U62 was SELECTED in RC-1 as the unsatisfiable
    S_3 targets that M_4 does NOT refute (EXP-CERTBIN-e94b27 instance_sets
    U62), while each N-CONV draw is unconditional, so a contrast between
    N-CONV and S3-U62 at M_4 is partly a selection effect; (b) by L-TOP the
    quadratic part fixes a supply of top-degree cancellations whose count may
    exceed dim B_{<=3}, so a generic lower part may be expected to fill almost
    all of B_{<=3} at degree 4 and so to refute an unsatisfiable system at
    M_4 already (a "saturation" reading, derived in J9, not assumed); (c) the
    frozen comparison at W_4 then sits at a ceiling for both arms and cannot
    see the M_4/W_4 difference. If (b) holds, S_3's own lower part is the
    SPECIAL one (it lifts more top syzygies to true syzygies), and the
    reading "the lower-degree part is not needed" must be narrowed to "not
    needed for refutation at degree <= 4; S_3's own lower part is what keeps
    M_4 from refuting on U62". That narrows a reading; it changes no frozen
    verdict.
    J10 (proves-too-much and the nearby object): O1-O3 behave as declared,
    about 85%. O4 (random-basis V') is the one I cannot call: about 50% that
    it is refuted at the same level as N-CONV. If it is, the phenomenon is a
    property of F_{2^17} multiplication restricted to 9-dimensional subspaces;
    if not, of the polynomial-basis convolution tensor (x_1 x_2 has degree
    <= 16 < 17, so no reduction modulo f occurs), which is a SCOPE fact for
    J12.
    J11 (L-TOP, generalized T4, ladder): L-TOP verified, about 90%;
    generalized T4 verified, about 85%. The ladder reading narrows from
    "S_3's quadratic part phi_{x_R}(Q)" toward "the convolution forms Q",
    given the N-CONV17 rung; the N-CONVL rung carries the disclosed confound
    that its targets are not x(2E) targets of the drawn curves.
    J12 (scope and transfer): nothing transfers beyond n = 17, this V, this
    curve, the x(2E) targets and D <= 4 without measurement. About 60% that
    the red team finds NC-DR-7's recommended n = 19 control (an N-CONV-type
    arm) likely to reproduce a ceiling there and so NOT to discriminate the
    S_3-specific W_4 behaviour, and proposes a conditioned or N-CONVL-type
    arm instead.
    Overall: admissible, mechanical verdicts stand, and the READING narrows.
    Most likely to be overturned: J10 O4 in either direction, and J9 (b) if
    the saturation count does not force M_4 refutation. A break of J1, J2, J3,
    J4 or J8 would overturn "admissible".

  joints:
    - joint: >-
        J1 -- CERTIFICATE SOUNDNESS AND INSTANCE BINDING, AUTHOR-INDEPENDENT.
        Every certificate in certificates.jsonl.gz verifies as an exact
        identity in B = F_2[v_0..v_17]/(v_i^2 + v_i) for the f_0..f_16 of the
        system its key names: flat-v1 by sum_{(mu,k) in C} mu*f_k = 1; wdag-v1
        by rules (a)-(e) of object.certificate_format. Every certificate is
        classified by the frozen counting rule (flat-v1 counts toward M_4 only
        with max |mu| <= 2 and never toward W_4 unless max |mu| <= 2; only
        wdag-v1 counts toward w). Every system a certificate names is decoded
        from its archived E_hex under object.E_layout, has the frozen kept part
        (verified against the verifier's OWN construction) and has s = 0 by
        the verifier's own exhaustive evaluation; every satisfiable control has
        s >= 1 with its listed solutions checking. Written without any code or
        text of impl/, verifier/ or src/crypto_autoresearcher/.
      assigned_to: TASK-20260926-f0e5a4
      attack_plan: >-
        Build, do not read. (1) Your own F_{2^17} (t^17 + t^3 + 1), your own
        S_3 from KN-TECH-b18366 self-tested against point addition on the
        archived curve, your own descent E_S3(x_R) by two routes (symbolic
        expansion, and interpolation from direct F_{2^17} evaluation), your
        own Boolean-ring product and XOR, your own exhaustive 2^18 evaluator.
        (2) Decode every system of instances.jsonl.gz under object.E_layout
        (your own decoder) and check the kept part per arm against your
        construction: N-CONV quadratic columns = those of your E_S3(x_R), low
        columns zero outside your S_L; N-CONVL quadratic and linear columns =
        your E_S3(x_R), constant bits on S_L cap column 0, not B's own bits and
        not all zero; N-CONV17 quadratic columns = your Q_k; N-ELL144 rows
        0..15 inside your U, row 16 = v_0 + v_9 + c; archived S3-* systems =
        your E_S3(x_R). (3) Verify EVERY line of certificates.jsonl.gz, all
        formats. (4) Your own negative controls for every (closure, arm,
        format) kind present, at least 5 each: one row removed; one k changed;
        one mu changed within its degree; a transplant onto another system of
        the same arm; and for wdag-v1 a degree violation of each of rules (b),
        (c), (d) and a topological violation (a). All must reject. (5) s on
        every system named by a certificate and on every satisfiable control.
        (6) Tabulate per (closure, arm, format): submitted, verified, rejected,
        counted under the frozen rule, max |mu| and node-count distributions.
        Where I think it breaks: the key format and decoding, not the algebra.
      breaking_artifact: >-
        A certificate that fails under an independent construction whose
        self-tests pass, with the failing residual shown; a wdag-v1 accepted by
        the run but violating a rule (a)-(e) under your checker; a counted
        certificate on a system whose kept part differs from the frozen
        construction; or a counted system with s >= 1.
    - joint: >-
        J2 -- CONSTRUCTION AND DRAW FIDELITY. The archived impl/ builds exactly
        the frozen families: N-CONV keeps S_3's quadratic part phi_{x_R}(Q)
        EXACTLY and redraws the linear and constant bits uniformly on S_L by
        one g.integers(0, 2, size=|S_L|) call per attempt placed row-major;
        N-CONVL redraws only the constant positions; N-CONV17 keeps Q_k; N-ELL144
        follows the o2 draw rule; U and S_L follow object.union_support; the
        generator, slot order, attempt order, keep rule, identity, b' = 0 and
        duplicate rejections, EXHAUSTED handling and the slot-to-x_R binding
        are as frozen; the archived arms are the archived systems.
      assigned_to: TASK-20260926-0f8aec
      attack_plan: >-
        Read construct.py, draws.py, common.py and the phase-2 code of
        driver.py against object.parts, object.union_support,
        instance_sets.fresh_arms, generator_rule and keep_rule, clause by
        clause, citing file and line. Then BUILD: rerun the N-CONV stream for
