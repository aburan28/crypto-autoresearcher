        "first satisfiable draw" handling when it precedes the first
        unsatisfiable one. Where I think it breaks: placement order on S_L,
        and the keep rule's handling of roles.
      breaking_artifact: >-
        A kept system whose quadratic part is not S_3's (or Q's) at its slot,
        a drawn bit outside S_L, a stream step your code places differently,
        or a spec clause the code does not implement, cited by file and line.
    - joint: >-
        J3 -- CLOSURE COMPUTATION FIDELITY: M_D AGAINST W_D. M_4 is recorded
        from Closure(18, 4, 17).macaulay_closure and W_4 from .w_closure on
