  proves_too_much:
    objects:
      - >-
        O1 -- SATISFIABLE CONTROLS of every arm (S3-S62 and the 144
        satisfiable controls of each of N-CONV, N-CONVL, N-CONV17, N-ELL144),
        for which "1 in X" is known false for every sound closure X. Every
        element of a sound closure vanishes on every Boolean solution, and the
        evaluation map from B_{<=d} onto F_2^S is surjective for |S| <=
        2^{d+1} - 1 (verified in RC-1 as RT-20260924-d95e70 J9 O1; re-check
        or mark recalled). Hence codim(W_4 in B_{<=4}) >= s for s <= 31, with
        equality iff W_4 = I cap B_{<=4}.
      - >-
        O2 -- THE SAME-SUPPORT NULLS AND N-ELL144 (NULL-F262, NULL-AFF62,
        N-ELL144, NELL-A20), for which refutation at W_4 is DERIVED false
        where the semi-regular profile holds and T5 applies (o2-declaration T4,
        T5; object.rc_b (6) reference profiles).
      - >-
        O3 -- S_3 ITSELF ON U62 AT M_4, for which "1 in rowspace(M_4)" is
        known false by the DEFINITION of U62 (EXP-CERTBIN-e94b27
        instance_sets). Any saturation or counting argument (J9 (b)) that
        predicts M_4 refutation for "S_3's quadratic part plus a lower part"
        must NOT predict it for S_3's own lower part on U62, or it proves too
        much; it must say what property of S_3's lower part escapes it.
      - >-
        O4 -- NEARBY OBJECT N-CONV-VR (random basis), an object with the same
        field, curve, targets, l, keep rule and lower-part law as N-CONV, but
        whose quadratic part is the S_3 descent over a RANDOM 9-dimensional
        V' instead of the polynomial basis. The "convolution tensor" reading
        of J11/J12 predicts nothing for it a priori; the red team DECLARES a
        prediction (from its J9 (b) counting, using P' computed from the
        quadratic part alone by L-TOP) before any engine call. Construction,
        fixed here before any draw: seed 2026092689101,
        numpy.random.Generator(numpy.random.PCG64(seed)), numpy 2.4.6. First
        draw a basis: b = g.integers(0, 2**17, size=9); reject and redraw
        while the nine are F_2-dependent or all have degree < 9 (log every
        rejection). x_1 = sum_{j<9} v_j b_j, x_2 = sum_{j<9} v_{9+j} b_j.
        E'_S3(x_R) is the multilinearized coordinate expansion of
        S_3(x_1, x_2, x_R) over V'. U' and S'_L follow object.union_support
        with E'_S3 in place of E_S3. For slots 0..19 (the 20 lowest-idx U62
        x_R, slot order of instance_sets.xr144), the same generator continues:
        per attempt bits = g.integers(0, 2, size=|S'_L|) placed row-major on
        S'_L over E'_S3(x_R)'s quadratic columns; identity draw rejected; keep
        the first draw with s = 0 and the first with s >= 1 (exhaustive 2^18),
        at most 256 attempts per slot. Run the pinned engine unchanged:
        Closure(18, 4, 17).macaulay_closure and .w_closure with certificates;
        verify every returned certificate with your own code; record P',
        fallen, rank, one, dims_by_deg, the W_4 record and rc_b's kernel
        dimension. Also run the unchanged engine on E'_S3(x_R) itself for
        those 20 slots (the S_3 descent over V').
    failure_signature: >-
      O1: on every satisfiable control of every arm, no M_4 or W_4 refutation
      and codim(W_4) >= s (read from closures.jsonl.gz and instances.jsonl.gz
      s); report equality arm by arm; any codim < s, or any refutation, means
      the engine's closure contains a polynomial outside the ideal and the
      instrument is unsound (INV-5) even though C-PS passed. O2: 0 W_4
      refutations wherever T5 applies with the reference profile, and the
      recorded profiles match object.rc_b (6); a refutation there is an
      instrument defect. O3: the J9 (b) argument, applied to S_3's own lower
      part at every U62 x_R, predicts NON-refutation at M_4 or names the
      property that exempts it; an argument that predicts M_4 refutation on
      U62 proves too much and cannot be used to read N-CONV. O4: the declared
      prediction is compared with the engine output; the result is REPORTED
      either way. It is a nearby-object control, not a known-false object: if
      the O4 systems are refuted at N-CONV's level, the "convolution tensor"
      reading must widen to "F_{2^17} multiplication restricted to
      9-dimensional subspaces" (or narrow its claim of specificity); if they
      are not, the reading is tied to the polynomial basis, which J12 records
      as scope.
    assigned_to: TASK-20260926-c58e87
    authorization_note: >-
      Building and running O4, and any own-code cross-checks on O1-O4, are
      VERIFICATION computations authorized by DEC-20260926-1adf4e R-6. They are
      not trials of EXP-CERTBIN-ddfe75, not an arm, and not evidence about
      H-CERTBIN-be6cbd on their own. They get no RUN-id. Outputs go only under
      the red team's write scope. The O4 seed and draw rule are fixed here,
      before any draw.

  proof_search_map:
    note: >-
      For the READING under review, not the contract (the contract's map is
      in EXP-CERTBIN-ddfe75 proof_search_map_audit and H-CERTBIN-be6cbd).
    bottleneck: >-
      Whether the frozen N-CONV contrast can identify WHICH part of S_3
      carries the W_4-needed refutation of U62, or only whether S_3's quadratic
      part suffices for refutation at degree <= 4 under a generic lower part.
    baseline_reproduction: >-
      C-ENGINE's full RC-1 replay and C-REG (a)-(d) (J3, J4); J7 reproduces
      S_3 at the pool's U62, S62 and C20 slots from the statement.
    observation_collision: >-
      Observable "1 in W_4 with a verified wdag-v1". Collision searched: the
      same observable arises for systems refuted at W^(0) = M_4 and for
      systems refuted only at W^(1); the frozen primary cannot tell them
      apart. The separating invariant is one_first_iteration (and "1 in M_4"),
      a secondary record. J9 owns it.
    quantifier_order: >-
      S_3: for each fixed x_R there is ONE system, and U62/C20 were selected
      on its M_4 outcome. N-CONV: for each x_R, one draw from a distribution,
      unconditional. A per-slot contrast mixes a conditioned and an
      unconditioned population (J9 (a)).
    method_ceiling: >-
      W_4 at D = 4 only; a non-refutation is not hardness, a refutation rate
      is sufficiency relative to the lower-part law, not an exact mechanism
      (KN-OPEN-3c8f51 resolution criterion 3). With both arms at the W_4
      ceiling, the primary cannot rank them.
    nearby_object_control: >-
      O4 (random-basis V') for the polynomial-basis dependence; O3 for any
      counting argument; O1/O2 as known-false objects.

