  coordinator_prior: >-
    READ PD-R1 FIRST. THIS PRIOR IS POST-DATA. It was written AFTER this
    Coordinator read run-report.md and implementation.md of RUN-CERTBIN-6ebb0e,
    and after the dispatching session's brief named the qualitative
