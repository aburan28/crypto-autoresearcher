  author_independent_verification:
    required: true
    note: >-
      Required by the specification's claim_tier_and_review joint (1) ("the
      validator writes its own verifier without reading impl/, verifier/ or
      src/crypto_autoresearcher/gf2/"), by DEC-20260924-833c70 R-4, and by
      DEC-20260926-1adf4e R-4. Owned by TASK-20260926-f0e5a4 as joint J1. The
      AUTHORSHIP facts: the executor wrote impl/ and verifier/ in one session;
      the engine src/crypto_autoresearcher/gf2/ was written by the top-level
      (dispatching) session. The verifier must be written from the
      certificate-format and E_layout text of the specification only; it may
      not import, copy or read impl/, verifier/, or any module of
      crypto_autoresearcher (not only gf2), and it must evaluate over GF(2)
      with its own code (numpy arrays are permitted as containers; no GF(2)
      routine from any repository module). It is not a blind re-derivation:
      the verifier necessarily reads the claimed certificates. Its
      independence is from AUTHORSHIP, checked from its attestation by the
      prefix rule against must_not_read (tools/check_review_independence.py
      checks only blind_rederivation) and by an import scan of its code/
      directory (TASK-20260926-9c0134 SC-1).
