  composition:
    rule: >-
      The Coordinator composes the verdicts in /review-evidence. No reviewer
      votes on the whole claim.
      - The run is ADMISSIBLE for interpretation iff J1, J2, J3, J4 and J8
        hold (J8 on J7's and J1's archived outputs).
      - The mechanical verdicts stand as recorded iff J5 and J6 also hold.
      - A count of W_4 refutations is read as author-independently certified
        only where J1 verified its wdag-v1; an M_4 refutation only where J1
        verified a flat-v1 with max |mu| <= 2 (or a one-node wdag-v1).
      - J9, J10, J11 and J12 decide how the verdicts are READ in the evidence
        record. J10 decides whether any counting argument used in that reading
        can be trusted (O3), and O4 decides whether the reading names the
        polynomial basis in its scope.
      - A break of J1 applies INV-6 (MN1-MN3 and every refutation count
        void). A break of J2, J3, J4 or J8 attributable to the producer
        returns the run to the executor as an implementation failure (INV-10).
        Neither is evidence about H-CERTBIN-be6cbd.
      - `inconclusive` on an admissibility joint (J1, J2, J3, J4, J8) holds
        the decision at `inconclusive`. The decision is not composed around
        the gap.
    checker: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/certbin-20260926-089841/review-plan.yaml --reports
      coordination/review/certbin-20260926-089841/reviews
      must PASS before composition. Then run
      python3 tools/check_review_independence.py --blind-history HEAD
      --protected-from coordination/review/certbin-20260926-089841/blind-phase-hygiene.yaml.
      Record both outputs in the TASK-20260926-7a06ad receipt. Also record the
      Coordinator's manual prefix check that TASK-20260926-f0e5a4's
      sources_read does not intersect author_independent_verification.must_not_read,
      and the TASK-20260926-9c0134 import scan of its code/ directory.

  procedure_deviations:
    - id: PD-R1
      text: >-
        POST-DATA REVIEW PRIOR. coordinator_prior above was written after this
        Coordinator read run-report.md and implementation.md, and after the
        dispatching session's brief named the qualitative M_4/W_4 observation.
        The pre-data prior is the specification's coordinator_prior (a)-(g).
        Disclosed to every non-blind reviewer; the blind re-deriver reads
        neither.
    - id: PD-R2
      text: >-
        BLIND POOL WIDER THAN, AND DIFFERENT FROM, THE SPECIFICATION'S "10
        N-CONV systems (5 refuted, 5 not, selected by the plan)". Selecting on a
        closure outcome before review would condition the re-derivation on the
        producer's result. The plan instead fixes an outcome-independent pool
        (P-A..P-G), adds the full N-CONV stream replay (Q0) and M_4 on all 144
        replayed unsatisfiable N-CONV systems (Q1), and reads "not refuted" as
        the satisfiable controls P-B. The intent (the N-CONV construction and
        W_4 re-derived from the statement alone) is kept and widened.
    - id: PD-R3
      text: >-
        SAME MODEL FAMILY, AND THE ENGINE'S AUTHOR DISPATCHES THE REVIEWERS.
        Unless the dispatcher can serve reviewers from a different model
        family, every reviewer shares the executor's and the engine author's
        claude-opus-5-5. J7 and J1 are then independent of the implementations
        and of their authors' sessions, not of one model's reading of the
        specification. Each reviewer is a FRESH subagent whose dispatch prompt
        is exactly the card path, so the engine author's session context never
        reaches it. Both J7 and J1 must list every ambiguity they resolved.
    - id: PD-R4
      text: >-
        PROTECTED LITERALS ARE DERIVED MECHANICALLY at archive time by
        archives/TASK-20260926-58d32c/extract_and_validate.py from the run's
        decision-rules.json, cell-summary.json and closures.jsonl.gz, minus
        every token of the frozen pre-data texts (specification, hypothesis,
        approval decision, idea, trial plan), and only their sha256 is written.
        No literal was supplied out of band and none is printed. Limits,
        stated plainly: a value that coincides with a frozen constant cannot
        be protected by token hashing, and a qualitative outcome statement in
        words cannot be protected at all; TASK-20260926-58d32c SC-8 therefore
        reads every commit message since 2b58093c36cac3277af23ca8fe8b1f2a1d4e57e2
        on the branch, and the PR text, for outcome statements by hand.
    - id: PD-R5
      text: >-
        COMPARISON AS A SEPARATE TASK, as in REVIEW-CERTBIN-20260924-3d7e1a. J7
        and J1 are sealed and archived (TASK-20260926-9c0134) before the
        comparator reads them.
    - id: PD-R6
      text: >-
        THE EXTRACTION DECODES WITH THE SPECIFICATION'S E_layout, in the
        extraction script's own code (it imports nothing from impl/, verifier/
        or src/), and cross-checks the convention by direct F_{2^17}
        evaluation of S_3 on the pool's S_3 systems (V4). RC-1's extraction
        imported the producer's decoder; this one does not.
    - id: PD-R7
      text: >-
        A NEARBY OBJECT IS BUILT DURING REVIEW (O4). It is a verification
        computation with a seed and rule fixed in this plan, not a trial and
        not a protocol amendment; no frozen threshold, arm or rule of
        EXP-CERTBIN-ddfe75 changes.
