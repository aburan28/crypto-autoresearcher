  claim_under_review: >-
    AS PREREGISTERED (H-CERTBIN-be6cbd statement and predictions;
    EXP-CERTBIN-ddfe75 preregistered_prediction, decision_rules and
    falsification_criterion), verbatim in substance:
    Claim C-T (E-TENSOR; the claim under test). Over one unsatisfiable N-CONV
    draw at each of the 144 archived RC-1 targets x_R (U62, S62, C20), W_4
    refutes at least 90% (>= 130 of 144), each with a verified
    degree-disciplined certificate (wdag-v1). The same-support systems without
    the tensor (N-ELL144, and the archived nulls N-F262 and N-AFF62) stay at or
    below 10%.
    Competing reading E-LINEAR. S_3's specific lower-degree part (the Semaev
    linear part x_R^2 (x_1 + x_2)^2 and/or the curve constant B) is
    load-bearing; W_4 then refutes at most 10% of N-CONV draws (<= 14 of 144).
    Frozen falsification: E-TENSOR is falsified iff w <= floor(n_C / 2) (72 at
    n_C = 144); E-LINEAR is falsified iff w > floor(n_C / 2). Thresholds
    scale as ceil(0.9 n_C), floor(0.1 n_C), floor(n_C / 2) if EXHAUSTED slots
    reduce n_C; n_C < 120 is NOT EVALUABLE. Primary verdicts NC-DR-1 (with L1
    and L2 certification labels) and NC-DR-4 (composite, with the N-CONVL
    sub-label and the appended N-CONV17 reading); secondary NC-DR-2, -3, -5,
    -6, -7; instrument NC-DR-8. Derived, exact per-system predictions: PN-2
    (L-TOP, equal P), PN-3 (T4 on every substituted system, T5 where
    applicable), PN-4 (0 refuted satisfiable controls), PN-5 (N-ELL144 not
    refuted where T5 applies with the semi-regular profile).
    AS THE PRODUCER STATES ITS RESULT, in RUN-CERTBIN-6ebb0e run-report.md,
    decision-rules.json, cell-summary.json and implementation.md. We do not
    restate the values:
    (i) the run is `completed_valid`; every control of NC-DR-8 passes
        (instrument-checks.json);
    (ii) the mechanical verdicts of NC-DR-1..NC-DR-9 as recorded in
         decision-rules.json, including both NC-DR-1 labels, the NC-DR-4
         composite with its sub-label and appended reading, the NC-DR-3
         ladder relations, the NC-DR-5 per-arm labels, the NC-DR-6 reading and
         the NC-DR-7 recommendation;
    (iii) MN1-MN3 and the secondary metrics of cell-summary.json, the PN-1..PN-5
          readings, and the run-report table "Coordinator prior (a)-(g)";
    (iv) the twelve deviations/readings and the "Unexpected observations" of
         implementation.md, and the independence disclosure (engine by the
         dispatching session; impl/ and verifier/ by the executor in one
         session).
    Claim tier: toy. Scope: n = 17, f = t^17 + t^3 + 1, m = 2, l = 9, V =
    {deg < 9} (polynomial basis), curve A = 97044, B = 126251, the 144
    archived x_R of RUN-CERTBIN-c417e0 (x(2E) subgroup targets), synthetic
    families N-CONV, N-CONVL, N-CONV17, N-ELL144 on the frozen seeds, archived
    arms S3-U62, S3-C20, S3-S62, NULL-AFF62, NULL-F262, NELL-A20, closures M_4,
    W_4 and the ell-substituted R'_3, R'_4, W'_4 (D <= 4 only), engine
    crypto_autoresearcher.gf2 pinned at 934bee5.

