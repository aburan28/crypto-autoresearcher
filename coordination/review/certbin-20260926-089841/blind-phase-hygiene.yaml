# =============================================================================
# Blind-phase hygiene for REVIEW-CERTBIN-20260926-089841 (RUN-CERTBIN-6ebb0e,
# EXP-CERTBIN-ddfe75, N-CONV). Written by the Coordinator under
# DEC-20260926-1adf4e; the protected_sha256 block is FILLED MECHANICALLY by
# coordination/review/certbin-20260926-089841/archives/TASK-20260926-58d32c/extract_and_validate.py
# at archive time (TASK-20260926-58d32c SC-5), which replaces the single marker
# line below and nothing else. Never edited by hand afterwards; a correction is
# a removal recorded under `removed` by the rule quoted in `false_positive_rule`.
#
# This file is in the blind re-deriver's blind_from (a removal's commit list
# could let a reader infer a value).
# =============================================================================
blind_phase_hygiene:
  review_id: REVIEW-CERTBIN-20260926-089841
  run_id: RUN-CERTBIN-6ebb0e
  decided_by: DEC-20260926-1adf4e
  note: >-
    sha256 of each protected literal's UTF-8 bytes, tokenized exactly as
    tools/check_review_independence.py tokenizes commit messages. Literals are
    DERIVED by the archive script from the run's decision-rules.json,
    cell-summary.json and closures.jsonl.gz (rule in derivation_rule), minus
    every token of the frozen pre-data texts; they are never written in
    plaintext, never printed, and never supplied out of band. Labels are
    opaque and ordered by digest.
  derivation_rule: >-
    Candidates: (1) every numeric leaf of decision-rules.json and
    cell-summary.json (booleans excluded): an integer with absolute value >= 10
    as str(v); a non-integral float as repr(v) and as the fixed-point forms
    with 6, 4 and 3 decimals, and, for 0 < v < 1, as the percentage forms with
    1 and 2 decimals; (2) from closures.jsonl.gz, for each fresh arm (N-CONV,
    N-CONVL, N-CONV17, N-ELL144) and role, the minimum and maximum of the M_4
    rank, of P, of fallen and of the W_4 final_dim, as str(v). Keep a candidate
    only if it is a single full token under the tool's regex and is not a token
    of any frozen pre-data text (experiments/EXP-CERTBIN-ddfe75/specification.yaml,
    experiments/EXP-CERTBIN-ddfe75/trial-plan-v1.json,
    ledger/hypotheses/H-CERTBIN-be6cbd.yaml,
    ledger/decisions/DEC-20260924-833c70.yaml,
    ledger/proposals/IDEA-20260924-8b28ea.yaml). Limits: a value equal to a
    frozen constant cannot be protected by token hashing, and a qualitative
    statement in words cannot be protected at all; both are covered by the
    manual reading of TASK-20260926-58d32c SC-8 (review plan PD-R4).
  false_positive_rule: >-
    PRE-AUTHORIZED by DEC-20260926-1adf4e R-5, mechanical. A --blind-history
    match of a protected digest is a FALSE POSITIVE, and cannot carry an
    outcome of RUN-CERTBIN-6ebb0e, iff EVERY matching commit either (a) is an
    ancestor of 2b58093c36cac3277af23ca8fe8b1f2a1d4e57e2 (git merge-base
    --is-ancestor), the HEAD at every executor invocation
    (checkpoint/invocations.jsonl), so it predates every output of the run; or
    (b) touches no path whose name contains "CERTBIN" or "certbin" (git show
    --name-only). The archive then removes that item from protected_sha256,
    records it under `removed` as {label, commits, by: "DEC-20260926-1adf4e
    R-5"} (never the value or its digest), re-runs the check, and proceeds. Any
    other match is a STOP: TASK-20260926-83cebf does not run on that history
    until the Coordinator decides.
  author_independence:
    note: >-
      Declared here because this file travels with every archive of the round
      and is read by the archive tasks that check attestations. It restates
      review-plan author_independent_verification and DEC-20260926-1adf4e R-4.
    authors:
      engine: >-
        src/crypto_autoresearcher/gf2/ (pinned at 934bee5, _kernels.c sha256
        c8f79d5961fffaf80428cdd29d0a53bfcc1e6d32ab07022931e3aacd926ca745) was
        written by the top-level dispatching session.
      impl_and_verifier: >-
        experiments/EXP-CERTBIN-ddfe75/impl/ and verifier/ were both written by
        the executor of TASK-20260924-7c1fb2, in one session.
    certificate_verifier_rule: >-
      TASK-20260926-f0e5a4 writes its verifier from the specification's
      object.certificate_format and object.E_layout text only. It does not
      read, import or copy experiments/EXP-CERTBIN-ddfe75/impl/,
      experiments/EXP-CERTBIN-ddfe75/verifier/, any module of
      src/crypto_autoresearcher/ (not only gf2), tools/gf2_replay_rc1.py or
      tests/test_gf2_kernels.py, and it evaluates over GF(2) with its own code.
      TASK-20260926-9c0134 SC-1 scans its code/ directory for imports of
      crypto_autoresearcher, of any module under an impl/ or verifier/
      directory, and for sys.path insertions pointing at src/ or impl/; any hit
      blocks the comparator until the Coordinator decides.
    blind_rederiver_rule: >-
      TASK-20260926-83cebf reads the specifications and blind/ only; its
      blind_from includes impl/, verifier/ and src/crypto_autoresearcher/, and
      the same import scan applies to its code/ directory.
