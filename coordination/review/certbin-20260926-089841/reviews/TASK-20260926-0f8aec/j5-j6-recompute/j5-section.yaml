# J5 section of TASK-20260926-0f8aec validation-report.yaml (written after the
# J2, J3 and J4 sections; the aggregation started only after J2 and J3 were
# sealed -- see ../ORDER.log).
J5:
  joint: J5 -- STATISTICS AND CP95
  verdict: holds
  verdict_basis: >-
    I aggregated from the raw records myself (instances, closures,
    certificates, certificate-verification; analysis.py, stats.py and
    report.py were not run). Every Clopper-Pearson 95% interval in
    decision-rules.json and cell-summary.json, and every cell of the
    trial-plan power table, reproduces exactly: 216 comparison rows, 0
    mismatches. That holds at the recorded 6 decimals, at 20 significant
    digits where recorded, and for log10 at all printed digits. Numerators
    and denominators are the frozen ones: verified wdag-v1 for W_4; verified
    flat-v1 with max |mu| <= 2 for M_4; n_C = 144 with no EXHAUSTED slot
    (J2); in-run S_3 = S3-U62 + S3-C20 = 82. No rule consumes an undefined
    interval. Two conditional rates have zero denominators (N-CONV and S3-C20,
    W_4 given not M_4). They are recorded as cp95 [0.0, 1.0] (stats.py maps
    n = 0 to (0, 1)), not as "undefined", and are read by no NC-DR label
    (finding J5-F1). No breaking artifact of the plan was found.
  method: >-
    j5_recompute.py. Clopper-Pearson bounds by bisection over dyadic rationals
    a/2^96, with EXACT integer binomial tails (math.comb; the comparison
    40 * sum C(n,i) a^i (2^96 - a)^(n-i) against 2^(96 n)); bracket width
    2^-96. Closed forms at x = 0 and x = n come out of the same bisection.
    Power table: exact Fractions, with mpmath at 60 digits for decimal and
    log10 of the exact rational. Run time 25 s.
  counts_recomputed_from_raw:
    MN1: {w: 144, n_C: 144, uncertified: 0, exhausted: 0, L1_label: TENSOR, L2_label: TENSOR}
    counting_rule_check: >-
      For every unsatisfiable arm, the count "verified wdag-v1" equals
      "verified wdag-v1 or verified W_4 flat-v1 with max|mu| <= 2", and equals
      the engine's W_4 count. Uncertified = 0 in every arm. The deviation-3
      counting rule therefore changes no number here.
    MN2_W4_verified_by_arm: {S3-U62: 62/62, S3-C20: 20/20, "S_3 (82)": 82/82, NULL-AFF62: 0/62, NULL-F262: 0/62, NELL-A20: 0/20, N-CONV: 144/144, N-CONVL: 144/144, N-CONV17: 144/144, N-ELL144: 0/144}
    M4_verified_by_arm: {S3-U62: 0/62, S3-C20: 20/20, "S_3 (82)": 20/82, NULL-AFF62: 0/62, NULL-F262: 0/62, NELL-A20: 0/20, N-CONV: 144/144, N-CONVL: 105/144, N-CONV17: 143/144, N-ELL144: 0/144}
    W4_given_not_M4: {S3-U62: 62/62, S3-C20: "0/0 UNDEFINED", "S_3 (82)": 62/62, NULL-AFF62: 0/62, NULL-F262: 0/62, NELL-A20: 0/20, N-CONV: "0/0 UNDEFINED", N-CONVL: 39/39, N-CONV17: 1/1, N-ELL144: 0/144}
    N-CONV_by_source: {U62: 62/62, S62: 62/62, C20: 20/20}
    paired_2x2_S3_vs_N-CONV_on_82: {both_refuted: 82, S3_only: 0, N-CONV_only: 0, neither: 0}
    MN3_certificates: 14 (closure, arm, format) kinds, 1440 submitted, 1440 verified, 0 failed (equal to cell-summary)
    MN3_satisfiable_controls: {S3-S62: "62; 0 refuted; codim = s 62/62", N-CONV: "144; 0; 144/144", N-CONVL: "144; 0; 144/144", N-CONV17: "144; 0; 144/144", N-ELL144: "144; 0; codim >= s 144/144, = s 0/144"}
    draw_statistics: "equal to cell-summary (attempts 1181/482/1134/1190; no rejection; no EXHAUSTED)"
  interval_table_file: j5-j6-recompute/j5-interval-table.yaml (37 rows, recomputed beside recorded, with position and informativeness)
  interval_table_summary:
    - {items: "NC-DR-1 L1/L2, MN1, MN2 N-CONV/N-CONVL/N-CONV17 (144/144)", recomputed: "[0.974708, 1.0] (lower 0.97470811851248336626)", recorded: equal, position: ceiling}
    - {items: "MN2 S3-U62 62/62; N-CONV by source U62/S62", recomputed: "[0.942237, 1.0]", recorded: equal, position: ceiling}
    - {items: "MN2 S3-C20 20/20; S3-C20 M4; N-CONV by source C20", recomputed: "[0.831567, 1.0]", recorded: equal, position: ceiling}
    - {items: "MN2 S_3 (82) 82/82", recomputed: "[0.956011, 1.0]", recorded: equal, position: ceiling}
    - {items: "NC-DR-2 386/386", recomputed: "[0.990489, 1.0]", recorded: equal, position: ceiling}
    - {items: "N-ELL144 0/144 (W_4, M_4)", recomputed: "[0.0, 0.025292]", recorded: equal, position: floor}
    - {items: "NULL-F262, NULL-AFF62, S3-U62 M_4 0/62", recomputed: "[0.0, 0.057763]", recorded: equal, position: floor}
    - {items: "NELL-A20 0/20", recomputed: "[0.0, 0.168433]", recorded: equal, position: floor}
    - {items: "N-CONVL M_4 105/144", recomputed: "[0.648862, 0.799791] (20 sig: 0.64886209849032345901, 0.79979074074887445082)", recorded: equal at 20 sig, position: interior}
    - {items: "N-CONV17 M_4 143/144", recomputed: "[0.961917, 0.999824] (20 sig: 0.96191666717021722027, 0.9998241973440962898)", recorded: equal at 20 sig, position: interior}
    - {items: "S_3 (82) M_4 20/82", recomputed: "[0.155791, 0.351249] (20 sig: 0.15579071279561825536, 0.35124877509753779346)", recorded: equal at 20 sig, position: interior}
    - {items: "N-CONVL W_4|not M_4 39/39", recomputed: "[0.909749, 1.0]", recorded: equal, position: ceiling}
    - {items: "N-CONV17 W_4|not M_4 1/1", recomputed: "[0.025, 1.0]", recorded: equal, position: ceiling (n = 1)}
    - {items: "N-CONV and S3-C20 W_4|not M_4 0/0", recomputed: UNDEFINED, recorded: "[0.0, 1.0]", position: zero denominator, consumed_by_rule: none}
    - {items: "frozen Stage-1 constant 324/386", recomputed: "[0.798874, 0.874580]", recorded: "[0.799, 0.875] (specification, 3 dp)", position: interior, note: equal after rounding to 3 dp}
  power_table:
    computed_from_thresholds_alone: >-
      Yes. From n = 144, thresholds ceil(0.9 n) = 130, floor(0.1 n) = 14 and
      floor(n/2) = 72, and p in {3/100, 1/10, 1/2, 9/10, 97/100}, my exact
      rationals reproduce all 15 cells at 20 significant digits and all 15
      log10 values at every printed digit (relative error 0 at printed
      precision). The plan was written at 14:56:38, before engine provenance,
      phase 0 and any draw (J4), and contains no closure value or draw.
    examples: "p = 1/10: P(w <= 14) = 0.52593598185470231476; P(w <= 72) = 1 - 9.211760391608235737e-35 (log10 -4.00061670669039e-35). p = 1/2: P(w <= 72) = 0.53318752322559867074. p = 97/100: P(w <= 72) = 3.8376185338561273926e-69 (log10 -68.4159381971031)"
    tail_checks_RC-3: >-
      Complied with in substance. The power table uses exact rationals, with
      log10 via mpmath at 60 digits for every value, including those below
      1e-12. stats.py brackets CP bounds with mpmath tails at 60 significant
      digits: linear space, not log space. That is adequate at the 1/40 level
      the CP equations need, and my integer-exact bisection agrees at 20
      significant digits everywhere. No IEEE float survival function is used.
  zero_denominator_check: >-
    Two rates have zero denominators: N-CONV W_4 given M_4 unrefuted (0/0,
    NC-DR-6 "also the conditional W_4 rate", descriptive) and S3-C20 W_4 given
    not M_4 (0/0, cell-summary secondary). No NC-DR label reads either. The
    NC-DR-6 label reads only N-CONV's M_4 interval. run-report.md prints the
    N-CONV one honestly as "0/0". decision-rules.json and cell-summary.json
    carry cp95 [0.0, 1.0] for both, which a later consumer could mistake for
    an informative interval (J5-F1).
  RV-10_floor_ceiling_caveat: >-
    Every PRIMARY count sits at a floor or a ceiling: w = 144/144; every W_4
    count per arm is n/n or 0/n; the paired 2x2 is 82/0/0/0. At a floor or
    ceiling the CP interval is a closed form (0.025^(1/n), or
    1 - 0.025^(1/n)), so agreement checks only the count and the denominator,
    not the producer's bisection code. It also cannot tell an implementation
    that counts verified refutations from one that counts systems: both give
    n/n here. My count comes from per-certificate verified flags, and
    uncertified = 0, so the NUMBER is right, but agreement says little about
    the producer's counting code. Agreement IS informative about the
    implementation for the interior items: N-CONVL M_4 105/144, N-CONV17 M_4
    143/144, S_3 (82) M_4 20/82, the interior power-table cells (p = 1/10,
    1/2, 9/10 near the thresholds) and the Stage-1 constant. All of them
    agree at 20 significant digits.
  findings:
    - id: J5-F1
      text: >-
        Two undefined 0/0 conditional rates are serialized as cp95 [0.0, 1.0]
        (stats.py cp95 returns (0, 1) for n = 0), not as undefined. No rule
        consumes them, so nothing is wrong mechanically. A consumer of
        decision-rules.json or cell-summary.json should read x = n = 0 as
        undefined, not as a "0 rate with a full interval". Not breaking.
    - id: J5-F2
      text: >-
        The counts are certified by the executor's same-author verifier
        flags. Author-independent certification of the counts is J1's; the
        composition rule reads a count as author-independently certified only
        where J1 verified it. I verified all 412 M_4 flat certificates (J3) and
        2 wdag-v1 certificates by hand. The other 512 wdag-v1 rest on the
        run's verifier until J1. Not breaking for J5, which is about
        arithmetic on the recorded verification.
  artifacts_read:
    - experiments/EXP-CERTBIN-ddfe75/runs/RUN-CERTBIN-6ebb0e/decision-rules.json, cell-summary.json (first opened for J5), instances.jsonl.gz, closures.jsonl.gz, certificates.jsonl.gz, certificate-verification.json, draws-*.jsonl.gz
    - experiments/EXP-CERTBIN-ddfe75/trial-plan-v1.json (power_table)
    - experiments/EXP-CERTBIN-ddfe75/impl/stats.py (READ ONLY, after my recomputation, to explain the n = 0 serialization; not run, not imported)
  commands_run:
    - (ulimit -v 3000000) PYTHONDONTWRITEBYTECODE=1 python3 j5-j6-recompute/j5_recompute.py $WT  -> j5-recompute.json (25.0 s)
    - PYTHONDONTWRITEBYTECODE=1 python3 j5-j6-recompute/j5_compare.py $WT  -> j5-compare.json (216 rows, 0 mismatches)
    - inline python (relative log10 check; interior listing) -> j5-power-and-interior.txt; inline generator -> j5-interval-table.yaml
