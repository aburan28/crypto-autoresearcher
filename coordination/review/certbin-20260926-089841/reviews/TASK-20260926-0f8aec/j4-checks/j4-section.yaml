  findings:
    - id: F-1
      text: >-
        C-VERIFIER type (c) is VACUOUS for M_4|N-CONV and M_4|S3-C20. This
        follows the specification's own constructibility clause (a flat
        certificate with max|mu| = 3 must exist in the arm). The M_4
        degree-rejection code path in verify_nconv.py (check_flat, line 249)
        is arm-independent. It is exercised by 6 rejected controls: M_4|N-CONVL
        from 3 source systems, and M_4|N-CONV17 from 1 source plus 2 padded
        variants. So the run never showed rejection on the N-CONV arm itself,
        but the gap is formal, not a missing code path. The executor's own
        padding technique (dev 9) would have made (c) constructible for these
        kinds too, e.g. a valid M_4 certificate plus a cancelling pair of
        |mu| = 3 rows. That was not required by the letter. The M_4 counts are
        secondary (NC-DR-6); the primary MN1 kind W_4|N-CONV has all four
        types built and rejected. No rule-(a) topological violation was built
        in any kind. J1 builds its own controls per kind, including (a)-(d).
        Not breaking.
    - id: F-2
      text: >-
        C-PS is maximally sensitive where codim(W_4) = s (494 controls), and
        nearly blind to non-refuting unsoundness on N-ELL144, where the slack
        is about 880. The pre-hashed T5 clause of C-T4 guards the N-ELL144
        controls. Not breaking.
    - id: F-3
      text: >-
        C-TOP and C-T4 are theorem checks. On this data both CAN fail: P takes
        three distinct values across arms, and T4 is an exact offset on 1028
        systems. The T5 clause is predictive for fresh systems only (dev 4,
        confirmed by the phase-log order). Not breaking.
    - id: F-4
      text: >-
        C-DRAW, C-CERT, C-VERIFIER and C-ORACLE2 are same-author (executor)
        checks. My J2 replay and s recomputation are a second, non-blind
        implementation; J1 and J7 are the independent ones. Not breaking.
    - id: F-5
      text: >-
        The dev-7 dry run is partly unauditable (statement above). This is
        the Coordinator's expected finding and matches DEC-20260926-1adf4e R-2.
        Not breaking.
    - id: F-6
      text: Threads = 2 (not the default 3), permitted and recorded; C-DET (c) ran at threads = 1 on 20 systems.
    - id: F-7
      text: >-
        manifest_v2 run.timing spans phase 0 start (14:58:34.60) to phase 7
        "aggregated" (15:03:35.41). It excludes engine_provenance.py and
        selftest.py, which started 14:57:07.79, and phase 7 "end"
        (15:03:35.95). This is disclosed in its `source` field, and no value
        of manifest.yaml changed. Not a D-1 defect.
    - id: F-8
      text: >-
        Minor observations, no deviation of substance. (a) N-CONVL draw logs
        record b' as an integer rather than as "the drawn b' bits". This is
        bijective given S_L's constant positions, which are exactly B's
        support. (b) The N-ELL144 logs and records additionally carry c. (c)
        C-SRC hashed the inputs in driver phase 0, AFTER engine_provenance.py
        (whose RC-1 replay reads two of the bound inputs) and selftest.py had
        run. That conflicts with inputs.hash_binding's "before any
        computation" but follows the specification's own command order, and
        the hashes are equal. (d) The inference block records a fallback
        (adapter binding claude-sonnet-5, served by claude-opus-5-5; allowed,
        disclosed in the manifest, not listed among the twelve deviations
        because it is not a specification deviation). (e) impl/ is hash-bound
        at report time, not at phase 0.
    - id: F-9
      text: >-
        Scope of my binding check: 6 of the 58d32c receipt's 15 paths (sibling
        handoff cards) were outside my inputs and were not hashed. The
        dispatch precondition "58d32c receipt VERIFIED" is the dispatcher's.
        I did not run the full validate_ledger sweep.
