# and J3; before any J5/J6 aggregation; see ../ORDER.log).
J4:
  joint: J4 -- INSTRUMENT, PACKAGE AND PROCEDURE INTEGRITY, INCLUDING THE manifest_v2 SUPERSESSION (D-1) COMPLETENESS
  verdict: holds
  verdict_qualifier: with findings, none breaking (F-1..F-9 below)
  verdict_basis: >-
    Every NC-DR-8 control is implemented as the specification states, or
    declared vacuous up front with its reason. Each control that guards a
    primary metric (C-CERT, C-VERIFIER on W_4|N-CONV, C-WDAG, C-PS, C-ORACLE2,
    C-DRAW, C-DET) can fail on this run's data: its negative instances are
    real under my own arithmetic, or its comparison is non-trivial. The
    package is complete and hash-bound (40b2ca receipt 95/95). The impl/ and
    verifier/ bytes equal the manifest's recorded hashes, and the trial plan,
    predictions-t5, draw logs and instances equal the hashes logged in-run in
    the right order. I found no deviation of substance beyond the twelve
    (F-8 lists minor observations). manifest_v2.yaml repairs all five D-1
    items and is purely additive: 15 leaf keys added, 0 removed, 0 changed.
    tools/validate_ledger.py at the archive head reports the five D-1 errors
    on manifest.yaml alone and 0 errors through the supersession.
  controls_table:
    - {control: C-ENGINE, status_on_data: pass, recheck: "J3: git tree rule and ancestry, _kernels.c and 7 package hashes, replay record (1062/0/268), pytest record, build_info, ordering before phase 2", can_detect: "a package that is not the pinned tree; a kernel change; an engine that no longer reproduces the 1062 RC-1 records and 268 certificates; a non-native backend; engine provenance after the first draw", cannot_detect: "an engine defect present in RC-1 too, or on system shapes that RC-1 never exercised (the replay is regression, not correctness)"}
    - {control: C-SRC, status_on_data: pass, recheck: "own re-hash of the 7 inputs, 7/7 equal to the specification's values", can_detect: "any change of an input file", cannot_detect: "an input that was wrong when bound. Ordering note F-8(c)"}
    - {control: C-SELF, status_on_data: pass, recheck: "read selftest.json: irreducibility; 10^4 field triples; E_S3 vs direct on 1000; exhaustive s vs naive on 200 (s from 0 to 484); substitution vs direct on 1000; engine W_D vs literal on 30 small systems with 5 at fixpoint index >= 2 (>= 3 required) and 4 wdags checked at depth 0/1; plus 5 depth-2 wdags (dev 5)", can_detect: "defects in own field, descent, evaluator, substitution, W_D iteration and extractor on small random inputs", cannot_detect: "defects that appear only at n = 17 sizes; same-author misreadings shared by test and code"}
    - {control: C-FIX, status_on_data: pass, recheck: "arithmetic: M_3 19*17 = 323 x (1+18+153+816 = 988); M_4 172*17 = 2924 x 4048; R'_3 18*17 = 306 x 834; R'_4 154*17 = 2618 x 3214. My literal rings have the same sizes", can_detect: "wrong degree bound or variable count", cannot_detect: "anything inside the matrices"}
    - {control: C-CONSTRUCT, status_on_data: pass, recheck: "J2 S1: own interpolated E_S3 equals archived E_hex 144/144", can_detect: "a wrong Qpart/Lpart/constant construction", cannot_detect: "an error shared with RC-1's archived construction (RC-1 was cross-checked by earlier rounds; J1 re-derives it)"}
    - {control: C-SUPPORT, status_on_data: pass, recheck: "J2 S2: own U equals support.json; sizes equal p1 archive; 62/62 NULL-F262 inside U; reading true", can_detect: "a wrong union support, hence a wrong S_L", cannot_detect: "a union-support RULE misread identically by all implementations"}
    - {control: C-REG, status_on_data: pass, recheck: "own field-by-field recheck from archived bytes (j4-controls.json): (a) M_3/M_4 rank/one against instance-sets flags on 268 systems; (b) 8 W_4 fields against RC-1 closures.jsonl.gz on 268; (c) R'_4 profiles on 82 S3-U62/C20 (idx 893 special) + the 10 lowest S3-S62, and ell support {v_0, v_9}; (d) NELL-A20 W_4 against the o2 engine rows on 20 and R'_4 [0,0,16,288,2328]. 0 violations", can_detect: "any drift of the engine or glue against the archived RC-1 and red-team values", cannot_detect: "errors present in both the archive and the run"}
    - {control: C-ELL, status_on_data: pass, recheck: "J3 hand check: c = Tr(t^k/x_R^2) by own field arithmetic on 7 S_3/N-CONV/N-CONVL systems; archived C-ELL covers 144 + 576", can_detect: "a kept quadratic part that is not phi_{x_R}(Q) (the kernel would change)", cannot_detect: "lower-part errors (by design)"}
    - {control: C-TOP, status_on_data: pass, recheck: "recomputed from closures: 864 N-CONV/N-CONVL/N-CONV17 systems, 0 violations. P is 1695 for S_3/N-CONV/N-CONVL/N-CONV17, 2312 for N-ELL144/NELL-A20 and 2448 for the nulls, so P is not a constant that a wrong system would match by default", can_detect: "a quadratic part not kept exactly, or an engine rank defect that moves the degree-4 projection", cannot_detect: "any error confined to the lower-degree part (L-TOP makes P blind to it by theorem)", note: "a theorem check that CAN fail on this data"}
    - {control: C-T4, status_on_data: pass, recheck: "J3 glue over all 1028 substituted systems: final_dim(W_4) = final_dim(W'_4) + 834 and one equal; T5 clause on the 308 T5-applicable systems (all N-ELL144 and NELL-A20); my literal T4 on 10 systems including 4 dense ells", can_detect: "a defect in the substitution code or in either closure that breaks the exact 834 offset; a W_4 deviation from the pre-hashed T5 prediction on N-ELL144", cannot_detect: "a defect common to W_4 and W'_4 that preserves the offset. The T5 clause is predictive for fresh systems only (dev 4)", note: "a theorem check that CAN fail on this data"}
    - {control: C-WDAG, status_on_data: pass, recheck: "J3: extractor dims and depth equal the engine's on all 514; depth equals one_first_iteration; 926 engine refutations with 926 flat certificates", can_detect: "an extractor that diverges from the engine's iteration; an unsubmitted refutation", cannot_detect: "a shared defect of extractor and engine (they share kernels); algebraic validity (C-CERT and J1)"}
    - {control: C-ORACLE2, status_on_data: pass, recheck: "own exhaustive s and solution lists: every attempt of the four fresh streams (J2) and 288/288 archived-arm systems (j4-controls.json), 0 mismatches", can_detect: "a wrong s or role; a wrong solution list", cannot_detect: "nothing material at 2^18 exhaustive evaluation, beyond the fact that the verifier is same-author"}
    - {control: C-DRAW, status_on_data: pass, recheck: "J2: my own full replay of all four streams reproduces every attempt record", can_detect: "stream, placement or keep-rule divergence between the driver and the verifier", cannot_detect: "a misreading of the draw text shared by the executor's driver and verifier (same author). Mine is non-blind too; J7 is the blind replay"}
    - {control: C-PS, status_on_data: pass, recheck: "per arm from records: 0 refuted satisfiable controls (638); codim = s on 62/62 S3-S62 and 144/144 each of N-CONV, N-CONVL, N-CONV17; N-ELL144 codim 886 > s (1..6) on 144/144", can_detect: "where codim = s (494 controls), ANY single polynomial outside the ideal (codim would drop below s); anywhere, a refutation of a satisfiable system", cannot_detect: "on N-ELL144, an unsound W_4 unless it adds more than 880 dimensions or refutes. There the inequality has slack about 880, and the effective soundness guard is the pre-hashed T5 prediction of C-T4 (T5 applies on all 288 N-ELL144 systems). It also cannot detect incompleteness (W_4 smaller than I cap B_{<=4})", note: "implementation.md unexpected observation bullet 5 (J10 O1 reads it)"}
    - {control: C-CERT, status_on_data: pass, recheck: "certificate-verification.json 1440 submitted, 1440 verified, 0 failed; equal to the 1440 lines of certificates.jsonl.gz (412 M_4 flat + 514 W_4 flat + 514 wdag-v1)", can_detect: "an invalid certificate under the executor's verifier", cannot_detect: "a flaw shared by executor verifier and extractor (same author); J1 is author-independent"}
    - {control: C-VERIFIER, status_on_data: "pass (102/102 rejected; 34 (kind, type) groups; 2 declared vacuous)", recheck: "own arithmetic on all 102 negative controls: 102/102 genuinely invalid; each type-(c) wdag keeps output 1 (a pure degree violation); table below", can_detect: "a verifier that accepts dropped rows, a wrong k, rule-(b)/(c) degree violations or transplanted certificates", cannot_detect: "a verifier that accepts rule-(a) topological violations or node-degree (d) violations (never built as a type; (d) is present only incidentally in 4 re-keyed controls); M_4 degree violations on N-CONV and S3-C20 (vacuous, F-1); flaws shared by negctl and verifier (same author)"}
    - {control: C-DET, status_on_data: pass, recheck: "determinism.json: pid 2358 against 2227 in phase 4 (separate process); (a) all four draw-log hashes regenerated and equal to the archived files; (b) 20 systems (N-CONV:0..9 unsat, N-CONV:0..4 sat, N-ELL144:0..4 unsat) at threads 2; (c) the same 20 at threads 1; 0 mismatches", can_detect: "nondeterminism of the streams; thread-count dependence on those 20 systems", cannot_detect: "deterministic defects (same code twice); nondeterminism confined to the other systems"}
