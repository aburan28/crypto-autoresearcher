# J3 section of TASK-20260926-0f8aec validation-report.yaml, written AFTER J2
# and BEFORE any J5/J6 aggregation (RV-4; see ../ORDER.log).
J3:
  joint: J3 -- CLOSURE COMPUTATION FIDELITY, M_D AGAINST W_D
  verdict: holds
  verdict_basis: >-
    The engine is the pinned one, and its provenance items ran before the
    first draw. On 13 archived systems, a literal and slow pure-Python
    transcription of M_3, M_4, W_4, and of rc_b with R'_3, R'_4 and W'_4,
    agrees with every archived field, including per-iteration dims,
    new_fallen_per_iteration and stack_rows_per_iteration. The 13 are the
    card's three plus ten extension systems, chosen by a rule fixed before any
    closure record was read. Over all 1440 systems, the glue between records
    shows no violation. Every M_4 label comes from macaulay_closure and is
    backed by a flat-v1 certificate with max |mu| <= 2 that sums to 1 under my
    own arithmetic. M_4 refutation holds iff W_4's one_first_iteration is 0.
    P, fallen and linear_forms are derived as frozen. The rc_b labels,
    T5_applicable, T5_prediction and the T4 relation follow the text. The
    extractor's dims and depth equal the engine's. The rc_b hand substitution
    on N-CONV:0:unsat, and the hand replay of an iteration-1 wdag on
    U62:F-S3:27, both agree. No breaking artifact of the plan was found.
  written_at: '2026-09-26 (UTC, see ../ORDER.log)'
  engine_provenance:
    tree_rule_checked_by_me_with_git: >-
      git rev-parse <c>:src/crypto_autoresearcher/gf2 =
      c612830fddff591083a504ff9484ab1d87088f11 for c = 934bee5 (the pin,
      934bee5704e305f17c85fcbd26257d304c424861), 2b58093c (the HEAD of every
      driver invocation) and c7f5e3dfa (this review's archive commit).
      934bee5 is an ancestor of 2b58093c, and 2b58093c of c7f5e3dfa.
    kernels_c_sha256: c8f79d5961fffaf80428cdd29d0a53bfcc1e6d32ab07022931e3aacd926ca745 (git blob at c7f5e3dfa and the worktree file; equals the pin)
    package_file_hashes: all 7 files at c7f5e3dfa equal engine-provenance/summary.json b_hashes
    replay_rc1_record: >-
      replay-rc1.json holds 1062 results with 0 non-empty field_diffs and
      268/268 cert_ok true; backend native. summary.json: exit 0, 66.6 s, 2
      threads. I did not re-run it (RV-7).
    pytest_record: pytest.stdout.txt "9 passed in 5.18s"; nothing skipped or failed in the record. I did not re-run it (RV-7).
    build_info: >-
      backend native, source_sha256 equal to the pin. With
      CRYPTO_AR_GF2_BACKEND=native, a failed native build raises
      (src/crypto_autoresearcher/gf2/_native.py 100-111) and does not fall
      back. checkpoint/invocations.jsonl records the variable as native for
      all three driver invocations.
    ordering: >-
      engine-provenance started at 14:57:07.79 and finished at 14:58:19.99
      (2026-09-25 UTC). phase-log.jsonl: phase 0 starts at 14:58:34.60 and
      phase 2 (first draw) at 14:58:49.64. C-ENGINE preceded the first draw.
    verdict_item: holds
  literal_vs_archived:
    code: j3-closures/j3_literal.py (pure Python ints over F_2; graded monomial positions; own echelon; imports nothing from impl/, verifier/, src/)
    literal_rule: >-
      M_D = span{mu f_k : |mu| <= D-2}. W^(0) = rowspace(M_4). W^(i+1) =
      W^(i) + span{v_j g : g in a basis of W^(i) cap B_{<=3}, all j}: EVERY
      low basis element is multiplied at EVERY iteration. Stop at no growth.
      The engine multiplies only rows with newly low leads
      (closure.py 221-231). That gives the same W^(i+1), because
      L_i = L_{i-1} + span(new rows) (distinct leads, equal dimension), and the
      13/13 per-iteration agreement confirms it on data.
    selection_rule: >-
      Fixed in j3_literal.py before any closure record was read. Required:
      N-CONV:0:unsat, the S3-U62 system at slot 0 (U62:F-S3:27) and
      N-CONV:0:sat. Extension (13 <= 20, RV-7): slot 0 of N-CONVL, N-CONV17,
      N-ELL144, NULL-F262, NULL-AFF62 and NELL-A20; S3-S62 at slot 62; S3-C20
      at slot 124; N-CONV unsat at slots 62 and 124.
    fields_compared: [M_3 rank/one/dims_by_deg (archived arms), M_4 rank/one/dims_by_deg/P/fallen/linear_forms, W_4 iterations_to_fixpoint/dims/final_dim/one/one_first_iteration/dims_by_deg/new_fallen_per_iteration/stack_rows_per_iteration, rc_b kernel_dim/label/c/ell_linear_support/ell_const/j_star/T5_applicable, R'_3 and R'_4 rank/one/dims_by_deg, W'_4 record]
    result: 13/13 systems, 0 differences in any field (j3-compare.json A_literal_vs_archived)
    required_three:
      - {key: 'N-CONV:0:unsat', M_4: {rank: 2683, one: true, dims_by_deg: [1, 19, 172, 988, 2683], P: 1695}, W_4: {dims: [2683, 4048], one_first_iteration: 0, final_dim: 4048, dims_by_deg: [1, 19, 172, 988, 4048]}, archived_equal: true}
      - {key: 'U62:F-S3:27 (S3-U62, slot 0)', M_4: {rank: 2660, one: false, dims_by_deg: [0, 5, 150, 965, 2660], P: 1695}, W_4: {dims: [2660, 4048], one_first_iteration: 1, final_dim: 4048}, archived_equal: true}
      - {key: 'N-CONV:0:sat (s = 4)', M_4: {rank: 2679, one: false, dims_by_deg: [0, 15, 168, 984, 2679], P: 1695}, W_4: {dims: [2679, 4044], one: false, final_dim: 4044, codim: 4}, archived_equal: true}
    note: >-
      These three are the card's comparison and are per-system instrument
      facts, not aggregated metrics. The satisfiable control has
      codim(W_4) = 4 = s (C-PS equality) in the literal computation too.
    runtime: 45.5 s for all 13 (j3-literal-ext-stdout.txt); 14.9 s for the required three
  m4_label_provenance:
    code_reading: >-
      Fresh arms: driver.py 459 calls closures.run_m(closures.C4), which is
      closure.Closure(18, 4, 17).macaulay_closure (closures.py 17, 28-35).
      Archived arms: driver.py 172 does the same in phase 1, reused at
      driver.py 462. The label is set from that record's `one` at
      driver.py 510, and `one` is the constant column being a pivot of M_4
      (closure.py 181-188). It is NOT inferred from W_4 iteration 0.
    all_systems_checks: >-
      Over all 1440 systems (j3_compare.py B), 0 violations of: record
      presence (M_4, W_4, rc_b everywhere; M_3 on S3-*/NULL-*); dims_by_deg[4]
      = rank; P/fallen/linear_forms = rank - d[3], d[3], d[1] - d[0];
      one iff d[0] = 1; label iff one; M_4 one iff W_4 one_first_iteration = 0;
      M_4 one implies W_4 one; W_4 dims[0] = rank M_4; final_dim = dims[-1];
      iterations = len(dims) - 1; codim = 4048 - final_dim. Every
      M_4-refuted system (412 across all arms) has exactly one M_4 flat-v1
      certificate with max |mu| <= 2 that sums to 1 under my own multilinear
      arithmetic, and no M_4 certificate sits on a system not labelled
      refuted. The closures file holds only M_3, M_4, W_4, rc_b, R'_3, R'_4
      and W'_4, so nothing at D >= 5 (SR-4).
  rc_b:
    code_reading_against_object_rc_b:
      step_1: rcb.py 17-33 is the left kernel of the rows restricted to QUAD_MASK (columns 19..171), by echelon reduction with combination tracking; zero rows give the kernel basis. Correct.
      step_2: rcb.py 36-41, 53-58 (ell = sum c_k f_k; asserts no quadratic term). C-ELL compares c with Tr(t^k / x_R^2) at driver.py 312-321 and 414-426.
      step_3: rcb.py 59-61 (REFUTED-AT-DEGREE-2 / ELL-TRIVIAL, not substituted)
      step_4: >-
        rcb.py 62-113. j* is the least linear index. v_{j*} is replaced by
        (ell + v_{j*}) = ell's other terms. Products are reduced multilinearly
        by OR. The remaining 17 variables are relabelled in ascending order,
        and degree <= 2 is asserted.
      step_5: >-
        closures.py 60-72 (R'_3, R'_4 by Closure(17, D, 17).macaulay_closure;
        T5_applicable iff dims_by_deg(R'_4)[3] == rank R'_3; T5_prediction
        {W4_refuted = one(R'_4), W4_final_dim = rank R'_4 + 834})
      step_6: closures.py 24-25 (reference profiles [0,0,16,288,2328] and [0,0,17,323,2771]); driver.py 511, closures.py 70
      W_prime_4: closures.py 76-80 (Closure(17, 4, 17).w_closure on the substituted system)
      status: implemented as the text states
    hand_substitution:
      system: N-CONV:0:unsat (x_R = 4418, slot 0)
      own_left_kernel_dim: 1
      c: 118760
      c_equals_Tr_t_k_over_xR2_own_field: true
      ell: v_2 + v_12 + v_15 (dense random linear part, constant 0)
      j_star: 2
      substituted_system: 17 equations over 17 variables, max degree 2; sizes [33, 42, 26, 58, 45, 39, 56, 35, 51, 40, 41, 41, 26, 30, 44, 38, 23] (stored in j3-literal-ext.json)
      R'_3_literal: {rank: 288, one: false, dims_by_deg: [0, 0, 49, 288]}
      R'_4_literal: {rank: 2290, one: true, dims_by_deg: [1, 18, 154, 834, 2290]}
      W'_4_literal: {dims: [2290, 3214], final_dim: 3214, one: true}
      T4_literal: final_dim(W_4) - final_dim(W'_4) = 4048 - 3214 = 834; one equal
      T5_applicable_literal: false (dims_by_deg(R'_4)[3] 834 != rank R'_3 288)
      archived_equal: true (every compared rc_b, R'_3, R'_4 and W'_4 field)
    other_substituted_systems_literal: >-
      All 10 substituted systems of the 13 (3 S_3, 4 N-CONV, 1 N-CONVL,
      1 N-ELL144, 1 NELL-A20) satisfy T4 literally (difference 834, one
      equal), including the N-CONV ells with random linear parts:
      N-CONV:0:unsat (support 3 variables), N-CONV:0:sat (8),
      N-CONV:62:unsat (9), N-CONV:124:unsat (8). N-CONV17 and both nulls have kernel dim 0, as
      rc_b (1) expects. All records equal the archive.
  wdag_extractor:
    code_reading: >-
      wdag.py 28-72 re-runs the engine's W_D iteration with the same
      kernels.column_pass/products (same new-lead rule) and keeps op logs up
      to the first refuting iteration. wdag.py 74-143: the final-state row
      with lead at the constant column is backtraced level by level. Rows of
      M_4 become (mu, k) with parity cancellation (108-116). Basis rows of
      level l-1 are expanded inline into the same node (121-122, 126-127).
      Product rows v_j * fallen_{l-1} become one child node per j (123-125,
      128-132). A child's polynomial is a sum of final-state rows whose lead
      has degree <= 3, which has degree <= 3 because the column order is
      degree-descending. Ids are assigned children first (135-143). For an
      iteration-0 refutation the only level is 0, so the output is a single
      flat node with no prods (the spec's "one-node wdag").
    hand_replay_iteration_1:
      system: U62:F-S3:27 (S3-U62 slot 0; chosen by rule; my literal W_4 has one_first_iteration 1)
      result: >-
        2 nodes. Output (level 1) = 1353 M_4 rows (max |mu| 2) + v_0 *
        child. The child (level 0) is a flat block of 337 M_4 rows whose
        polynomial has degree 3. Own full-B arithmetic, no degree cap: rules
        (a)-(e) hold, poly(output) = 1, and (M_4 rows) + v_0 * (child)
        recomposes to 1. Depth 1 equals the archived and my literal
        one_first_iteration. The archived extractor dims [2660, 4048] equal
        the engine's and mine.
      engine_flat_W4_certificate_same_system: 1504 rows, max |mu| = 3, sums to 1. By the frozen counting rule it does NOT count toward W_4 (max |mu| > 2); only the wdag-v1 counts.
    iteration_0_check: N-CONV:0:unsat's wdag-v1 is one node, no prods, 1331 rows, max |mu| 2, sums to 1 (own arithmetic); archived one_first_iteration 0.
    all_wdag_structural: >-
      All 514 wdag-v1 lines: DAG depth = the archived W_4
      one_first_iteration; depth-0 wdags are single flat nodes; node_count
      fields are correct; each W_4-refuted system has exactly one wdag-v1 (no
      UNCERTIFIED), and there is none on a non-refuted system. 0 violations
      (j3-wdag-depth.json). Algebraic validity of all of them is J1's.
  artifacts_read:
    - experiments/EXP-CERTBIN-ddfe75/impl/closures.py, rcb.py, wdag.py, driver.py (phases 1, 3, 4, 5)
    - src/crypto_autoresearcher/gf2/closure.py; kernels.py (backend, default_threads, map_threads); _native.py (load)
    - experiments/EXP-CERTBIN-ddfe75/runs/RUN-CERTBIN-6ebb0e/engine-provenance/summary.json, replay-rc1.json, replay-rc1.stdout.txt, replay-rc1.stderr.txt, pytest.stdout.txt, pytest.stderr.txt
    - experiments/EXP-CERTBIN-ddfe75/runs/RUN-CERTBIN-6ebb0e/phase-log.jsonl (phase, event, time and hash fields only at this stage), checkpoint/invocations.jsonl
    - experiments/EXP-CERTBIN-ddfe75/runs/RUN-CERTBIN-6ebb0e/closures.jsonl.gz, certificates.jsonl.gz, instances.jsonl.gz
  commands_run:
    - git rev-parse {934bee5,2b58093c,c7f5e3dfa}:src/crypto_autoresearcher/gf2; git merge-base --is-ancestor (x2); git show c7f5e3dfa:src/crypto_autoresearcher/gf2/_kernels.c | sha256sum; sha256sum of the worktree package files
    - (ulimit -v 3000000) PYTHONDONTWRITEBYTECODE=1 python3 j3-closures/j3_literal.py $WT          -> j3-literal.json (14.9 s)
    - (ulimit -v 3000000) PYTHONDONTWRITEBYTECODE=1 python3 j3-closures/j3_literal.py $WT --ext    -> j3-literal-ext.json (45.5 s)
    - (ulimit -v 3000000) PYTHONDONTWRITEBYTECODE=1 python3 j3-closures/j3_compare.py $WT          -> j3-compare.json (5.6 s)
    - (ulimit -v 3000000) PYTHONDONTWRITEBYTECODE=1 python3 j3-closures/j3_wdag_replay.py $WT      -> j3-wdag-replay.json
    - PYTHONDONTWRITEBYTECODE=1 python3 j3-closures/j3_wdag_depth.py $WT                            -> j3-wdag-depth.json
  where_the_coordinator_expected_a_break:
    which_record_is_labelled_M4: no break (macaulay_closure record; certificate-backed on all M_4-refuted systems)
    wdag_extractor_on_iteration_0: no break (single flat node; depth rule on all 514)
    rc_b_substitution_for_dense_ell: no break (hand substitution and 3 more dense-ell systems match; T4 literal)
  limitations:
    - >-
      The literal comparison covers 13 of 1440 systems (RV-7 caps it at 20).
      The other 1427 rest on the glue checks, on C-ENGINE's full RC-1 replay
      (the producer's record, not re-run by me) and on C-DET (J4). A defect
      that is consistent across records, and absent on all 13 literal
      systems, would not show.
    - >-
      Not blind and not author-independent: I read the engine and the glue
      before writing the literal code. The independence joints are J1 and J7.
    - The replay-rc1 and pytest outcomes are read from archived records; RV-7 forbids re-running C-ENGINE.
  instrument_note_RV-6: >-
    J3 is a statement about the measurement, not about H-CERTBIN-be6cbd,
    E-TENSOR or E-LINEAR (INV-10).
