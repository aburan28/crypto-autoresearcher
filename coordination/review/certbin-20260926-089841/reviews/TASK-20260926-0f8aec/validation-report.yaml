        [0.0, 1.0] (stats.py maps n = 0 to (0, 1)), not as "undefined", and are read by no NC-DR label
        (finding J5-F1). No breaking artifact of the plan was found.'
      method: 'j5_recompute.py. Clopper-Pearson bounds by bisection over dyadic rationals a/2^96, with
        EXACT integer binomial tails (math.comb; the comparison 40 * sum C(n,i) a^i (2^96 - a)^(n-i) against
        2^(96 n)); bracket width 2^-96. Closed forms at x = 0 and x = n come out of the same bisection.
        Power table: exact Fractions, with mpmath at 60 digits for decimal and log10 of the exact rational.
