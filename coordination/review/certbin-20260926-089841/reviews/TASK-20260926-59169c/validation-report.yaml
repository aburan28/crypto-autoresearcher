  # ---------------------------------------------------------------------------
  disagreements:
    - id: D-1
      item: >-
        Per-line counting flags. J1's counts_toward_M4 / counts_toward_w
        against the run's certificate-verification.json counts_for_M4 /
        counts_for_W4.
      extent: >-
        824 of 1440 lines, which is every flat-v1 line with max|mu| <= 2 (412
        labelled M_4, 412 labelled W_4). That is 1236 field comparisons: 412
        on counts_M4 and 824 on counts_W4. No other field and no verdict
        disagrees.
      a_implementations_at_the_clause: >-
        Clause: object.certificate_format flat-v1 ("It counts toward M_4 only
        when max |mu| <= 2. It NEVER counts toward W_4 unless max |mu| <= 2")
        together with metrics MN1 ("w = #{... VERIFIED wdag-v1 ...}") and the
        M_4 secondary metric. On the run side, verifier/verify_nconv.py:253-254
        writes counts_for_M4 = counts_for_W4 = (sum is 1 and max|mu| <= 2) on
        every flat line, regardless of closure label, and :328 writes
        counts_for_W4 = verified on wdag lines. These are ELIGIBILITY flags,
        which the run declared before data as trial-plan-v1.json R3 ("W_4
        flat-v1 ... counts toward W_4 only if max |mu| <= 2, never used for
        w") and as implementation.md deviation 3. The run's tallies, in
        impl/analysis.py:95-100, count M_4 only from M_4-labelled flat-v1
        with max|mu| <= 2 and w only from verified W_4 wdag-v1. The flat
        counts_for_W4 flag is never consumed. On the J1 side, code/run_j1.py
        :487-489 writes counts_toward_M4 and counts_toward_w as TALLY
        INCLUSION under the same rule, and flat_W4_eligible_maxmu_le2 as
        eligibility (J1 AMB-8, AMB-9).
      b_third_check: >-
        checks/cp4_third_counting.py, declared on 6 systems (N-CONV:0:unsat,
        N-CONVL:0:unsat, N-CONVL:2:unsat, N-CONV17:83:unsat, C20:F-S3:5,
        U62:F-S3:27; 15 certificate lines). My own verification accepts all 15
        lines. On every line, the run's flags equal the certificate_format
        eligibility exactly. The per-system counted outcome for M_4 and for
        W_4 is identical under the eligibility reading and under the MN1
        reading. Over the whole population, recounted from J1's verdicts, the
        two readings give identical system sets for M_4 and for W_4 on every
        arm.
      c_localisation: >-
        ENCODING DIFFERENCE (field semantics), not a departure from the
        specification text by either side. The run's per-line flags record
        certificate_format eligibility. J1's flags record inclusion in the
        MN1/M_4 tallies. Paired by meaning, the run's flat-line flags against
        J1's "verified and max|mu| <= 2" and the wdag-line flag against J1's
        counts_toward_w, all 1440 lines agree. Both implementations apply the
        same tally rule, and every MN count and NC-DR verdict is unchanged.
      observation_non_blocking: >-
        Read without trial-plan R3 or deviation 3, the run field name
        counts_for_W4 on flat-v1 lines suggests that flat certificates count
        toward w, which they do not in the run's own aggregation. This is a
        documentation hazard for later readers of
        certificate-verification.json, not an error in any count.
    - id: none-other
      note: >-
        No other compared item disagrees. Encoding differences that were
        mapped before comparison, and are not counted as disagreements, are
        the W_4 dims list and the fallen-per-iteration encoding. The run lists
        W^(0)..W^(fixpoint) with increments, and J7 lists
        W^(0)..W^(fixpoint+1) with cumulative sizes (J7 AMB-13). The
        fixpoint index is the same i on both sides, and one_first_iteration,
        "1 in W_4" and the final dimension agree on all 55 pool systems. The
        other mapped encoding is rc_b c, an int on the run side and a
        17-bit list on the J7 side.

  ambiguities_against_the_run: >-
    Each J7 (AMB-01..23) and J1 (AMB-1..16) ambiguity was set against the
    run's resolution (trial-plan-v1.json pre_data_readings, impl/README.md,
