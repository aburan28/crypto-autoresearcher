    slot 0: sat at attempt 0, unsat at attempt 3) is handled identically.

  floor_ceiling: >-
    The values below are the agreed values from checks/floor_ceiling.out.json.
    An item that takes one value on every system of a group cannot tell a
    right implementation from a wrong one that saturates, so its agreement is
    WEAK evidence about the implementation.
    (1) N-CONV unsat pool (16 systems) and the Q1 replay (144): s = 0 (by
    role), "1 in M_4" = true, P = 1695 (fixed by L-TOP), W_4 one_first_iteration
    0, fixpoint 1, final_dim 4048 = dim B_{<=4} and dims_by_deg
    [1, 19, 172, 988, 4048] are CONSTANT. That is a ceiling. rank M_4 and
    dims_by_deg(M_4) take only 2 values over 144: 142 at [1, 19, 172, 988]
    (all of B_{<=3}, rank 2683) and 2 at [1, 18, 171, 987]. R'_3 rank and the
    R'_4 profile are also constant over the 16 pool systems. Only the rc_b c,
    ell support/constant and j* VARY, and the label-swap mutation confirms
    that these fields and the rows are the only system-specific closure-side
    evidence in this group.
    (2) N-CONV17 unsat (5), NULL-F262 (3) and N-ELL144 unsat (5): every
    compared closure item is constant in the group. N-CONV17 is at the
    refuted ceiling. NULL-F262 sits at the semi-regular non-refuted profile
    [0, 0, 17, 323, 2771] (a floor). N-ELL144 sits at T5's [0, 0, 16, 288,
    2328] and final_dim 3162; only ell's constant varies.
    (3) S3-U62 (10), S3-C20 (3), N-CONVL unsat (5), N-CONV sat (5) and
    S3-S62 (3): rank M_4, dims_by_deg(M_4) and W_4 dims VARY. For S3-U62 the
    W_4 final dimension and one_first_iteration = 1 are constant. For the sat
    groups, codim and the M_4/R'_4 profiles vary. These are the groups in
    which closure agreement is informative about the implementation.
    (4) The stream is not a floor/ceiling item. 1181 distinct attempt hashes
    agree, s takes 10 distinct values, and the kept-unsat attempt index takes
    25 distinct values in 0..41. This is strong evidence about construction
    and draw fidelity.
    (5) Every MN count and NC-DR label compared sits at a floor or ceiling:
    144/144, 82/82, 0/144, 0/62 and 0/20. The exceptions are the M_4 counts
    of N-CONVL (105/144) and N-CONV17 (143/144) and S_3 (82) M_4 at 20/82.
    Agreement there says the recount is right, not that the implementation
    computing the flags is.

