o4_declaration:
  construction:
    seed: 2026092689101
    generator: numpy.random.Generator(numpy.random.PCG64(2026092689101)), one generator, basis draw then slots 0..19 in order, attempts in order
    numpy_version_required: 2.4.6
    numpy_version_used: 2.4.6
    basis_draws: 1                       # accepted at the first draw; 0 rejections (o4-basis-and-support.json)
    basis_V_prime: [3596, 4067, 107649, 115250, 93615, 102241, 64268, 98978, 22197]
    basis_degrees: [11, 11, 16, 16, 16, 16, 15, 16, 14]
    union_support: >-
      U' = all 81 bilinear and all 18 linear columns in every row, plus the constant
      exactly where bit k of B = 126251 is 1 (same class as the polynomial basis);
      no non-bilinear quadratic column. |S'_L| = 317 (row sizes 19 or 18).
    slots: 0..19 = U62 idx 27, 41, 44, 98, 103, 104, 136, 160, 175, 187, 191, 192, 205, 234, 235, 252, 281, 295, 297, 304
    draw_rule: per attempt bits = g.integers(0, 2, size=317) placed row-major on S'_L over E'_S3(x_R)'s quadratic columns; other columns 0..18 zero
    rejections: identity (== E'_S3(x_R)) and duplicate of a kept system (exact E), each logged
    keep_rule: first s = 0 and first s >= 1 by exhaustive 2^18 evaluation; stop when both filled; <= 256 attempts
    outcome: >-
      150 attempts, 0 identity and 0 duplicate rejections, 40 kept (20 unsat + 20 sat),
      0 EXHAUSTED; 21 of 150 evaluated draws unsatisfiable (o4-build-summary.json;
      every attempt in o4-generation-log.jsonl.gz).
    V_prime_S3_descents: >-
      E'_S3(x_R) at the 20 slots: s = 0 at slots 3, 7, 11, 13, 19 (5 unsatisfiable), s >= 1
      at the other 15 (s in {2, 3, 4, 6, 8}). These x_R are U62 targets of the POLYNOMIAL
      basis; over V' the descent is a different Boolean system and its satisfiability
      changes (the factor base changes).
    E_sha256_convention: sha256 of json.dumps(list of lowercase hex rows), own convention

  pre_engine_quantities:   # own code, o4-prepredict.json and o4-subst-counting.json
    multiplication_tensor: >-
      The 81 products b_i b_j take 45 distinct values over V' (span 17) against 17 for the
      polynomial basis (b_i b_j = t^{i+j} depends only on i + j: the Hankel coincidence).
    P_prime: 1904 at every slot (polynomial basis 1695; exactly semi-regular nulls 2448)
    dim_Z_top: 1020
    Z_top_minus_153: 867                  # < 988 by 121: counting forces NO non-trivial syzygy
    rc_b_kernel_dim: 1 on all 60 systems (40 kept + 20 descents); c_k = Tr(t^k / x_R^2) on all 20 descents
    ell: >-
      Descents: linear support {1, 2, 4, 5, 8, 10, 11, 13, 14, 17} (= {v_j, v_{9+j} : Tr(b_j) = 1}),
      constant 0 at all 20 slots. N-CONV-VR: dense random ell, linear support size 6-14.
    structural_syzygies: >-
      153 trivial (Koszul + field) plus 17 'ell-syzygies' sum_k c_k (ell + 1) v_i f_k = 0,
      independent of the trivial ones, verified as syzygies on all 60 systems (and on
      polynomial-basis S_3 at U62 idx 27). So dim K >= 170 for every lower part.
    rigorous_bound: >-
      fallen = dim Z_top - dim K <= 1020 - 170 = 850 < 988 for EVERY O4 system and every
      lower part with this quadratic part: codim(M_4 cap B_{<=3} in B_{<=3}) >= 138.
      Saturation is impossible over V'.
    substituted: >-
      After v_{j*} := ell + v_{j*}: P_sub = 1649 on all 60 (polynomial-basis S_3 1379,
      checked against RC-1's R'_4 = 2213 with 834 fallen at idx 27; semi-regular 16-in-17
      2040). Z_sub = 969; Z_sub - 290 = 679 <= 834: the substituted degree-4 space can hold
      at most 679 dimensions of B'_{<=3} (codim >= 155), against 288 = rank R'_3 for the
      semi-regular reference. So T5 is predicted NOT applicable and the substituted system
      is predicted to carry about 391 falls beyond R'_3.

  predictions:
    basis_of_prediction: >-
      J9 (b) counting with P' (L-TOP) and the scoped random-model rule R-ED of
      j9-null/j9b-saturation-derivation.yaml, extended to W^(1) by the same
      expected-dimension reasoning, plus the rigorous bound above. The rigorous part
      is only "fallen <= 850, rank M_4 <= 2754"; everything else is the heuristic.
    M4:
      N-CONV-VR_unsat_20: >-
        NOT refuted by M_4 on 20/20 (rigorous non-saturation, codim >= 138; R-ED puts
        1 in F at probability <= 2^-138). R-ED point prediction: fallen = 850, rank M_4 =
        1904 + 850 = 2754, P = 1904 (exactly the N-ELL rank 2754) on >= 18 of 20.
      N-CONV-VR_sat_20: not refuted (soundness); R-ED point prediction fallen = 850, rank 2754 on >= 18 of 20
      S3-VR_descents_20: >-
        NOT refuted by M_4 on the 5 unsatisfiable descents (rigorous non-saturation).
        fallen <= 850 on 20/20 (rigorous); under H-EX (S_3's structured lower part lifts
        extra top cancellations to syzygies) fallen may be BELOW 850; no point value
        declared.
    W4:
      N-CONV-VR_unsat_20: >-
        REFUTED by W_4 at one_first_iteration = 1 (not 0) on >= 18 of 20, final_dim 4048.
        Reason (heuristic): the about 391 non-trivial falls (substituted 679 - 288) times
        17 variables supply far more than the about 886 dimensions missing from
        M_4 + ell B'_{<=3} (T4/T5 arithmetic: 2328 + 834 = 3162), so W^(1) is expected to
