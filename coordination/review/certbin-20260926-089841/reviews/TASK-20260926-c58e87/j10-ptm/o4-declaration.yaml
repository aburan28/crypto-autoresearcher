        about 65%; the alternative is a closure that stalls below 4048.
      S3-VR_descents_unsat_5: >-
        REFUTED by W_4 at iteration >= 1 on >= 4 of 5 (confidence about 55%; H-EX may
        lower the falls).
      satisfiable_all_35: >-
        never refuted (soundness; a refutation is an instrument defect); codim(W_4 in
        B_{<=4}) >= s on 35/35 (theorem, O1), with EQUALITY codim = s predicted on
        >= 90% (W_4 = I cap B_{<=4}), where s <= 31.
    what_each_outcome_means_for_the_reading:
      - "M_4 not refuted on O4 (predicted): N-CONV's M_4 refutation (the qualitative observation) is tied to the polynomial basis's P = 1695 (Hankel coincidence b_i b_j = t^{i+j}), not to F_{2^17} multiplication restricted to a 9-dimensional subspace."
      - "M_4 refuted on O4 at N-CONV's level: the reading widens to 'F_{2^17} multiplication restricted to 9-dimensional subspaces' and the J9 (b) counting is not the mechanism (it forbids saturation here)."
      - "W_4 refuted at iteration 1 on O4 (predicted): the W_4-level refutation is NOT tied to the polynomial basis; only the M_4 level is."
      - "W_4 not refuted on O4: the W_4 refutation is tied to the polynomial basis too (for random lower parts)."

