  O3:
    object: S_3 itself on U62 at M_4 (1 not in rowspace(M_4) by the definition of U62)
    argument_tested: the J9 (b) counting argument (j9-null/j9b-saturation-derivation.yaml), unchanged
    result: >-
      As a derivation ("for every lower part"): PROVES TOO MUCH. With P = 1695 it
      predicts fallen = 988 and M_4 refutation for S_3's own lower part on 62/62 U62,
      all false; it also mispredicts fallen on the 20 C20 (973-979, refuted anyway) and
      on the 62 S62 controls (965-978 against 988 - s). The survival point is the step
      "a generic lower part fills B_{<=3}" (the random-fall-map transfer): applied to a
      structured lower part it is simply false.
      As the scoped heuristic R-ED (uniform lower parts only) plus the NAMED exemption
      H-EX, it does not predict M_4 refutation on U62. The named property of S_3's
      lower part: sigma-symmetric (v_j <-> v_{9+j}), linear part in the 9-dimensional
      span of v_j + v_{9+j}, and the descent of a low-degree F_{2^17}-polynomial
      (x_R^2 (x_1 + x_2)^2 + B). Supported, not derived: N-CONVL (S_3's linear part kept,
      constant random) is unsaturated on 288/288 (fallen 950-982) and its M_4 rates by
      target type (x(2E) of the drawn curve 66/80, CP95 [0.724, 0.901]; twist 39/64,
      CP95 [0.479, 0.729]) match S_3's Stage-1 rates (x(2E) 324/386 and 87/103; twist
      111/168 = 0.661). So the exemption lives in S_3's (quadratic, linear) pair, not in
      the constant B. Which of sigma-symmetry and Frobenius-compatibility carries it is
      NOT separated (N-CONVL has both).
    limits_of_the_exemption: >-
      H-EX's "extra syzygies" are basis-dependent: over V' the S_3 descents and the
      uniform-lower-part draws have the SAME M_4 profile [0, 1, 51, 833, 2737] on 60/60,
      so there is no S_3-specific excess at V'.
    unexplained_by_any_count: >-
      Which non-saturated S_3 systems contain 1 in the fallen space (C20 and 324/386)
      and which do not (U62). The counting is silent on that split.
    verdict: >-
      O3 signature met only for the scoped heuristic with the named exemption. The
      argument may be used to READ N-CONV (its per-record signature held there) but not
      to EXPLAIN U62.

