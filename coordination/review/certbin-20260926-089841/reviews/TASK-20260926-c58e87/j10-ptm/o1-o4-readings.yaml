      b = [3596, 4067, 107649, 115250, 93615, 102241, 64268, 98978, 22197], degrees
      11-16. U' has the same support class as U; |S'_L| = 317. 150 attempts over 20
      slots, 0 identity and 0 duplicate rejections, 40 kept, 0 EXHAUSTED; 21/150
      evaluated draws unsatisfiable. Every attempt is in o4-generation-log.jsonl.gz.
      The V' S_3 descents E'_S3(x_R) are unsatisfiable at 5 of 20 slots (3, 7, 11, 13, 19).
    pre_engine: >-
      P' = 1904 at every slot (polynomial basis 1695; nulls 2448); the 81 products b_i b_j
      take 45 distinct values against 17 for the polynomial basis (Hankel coincidence);
      rc_b kernel dimension 1 on 60/60 (c_k = Tr(t^k / x_R^2) on the 20 descents); 153
      trivial plus 17 ell-syzygies independent on 60/60, so fallen <= 850 < 988 for every
      lower part (rigorous; saturation impossible). Substituted P_sub = 1649 (poly-basis
      S_3 1379 checked against RC-1; semi-regular 2040).
    engine: >-
      Pinned engine at c7f5e3dfa, tree equal to 934bee5's, _kernels.c sha256 c8f79d59...ca745,
      backend native (build_info source_sha256 equal to the pin), CRYPTO_AR_GF2_THREADS=1,
      Closure(18, 4, 17).macaulay_closure and .w_closure unchanged, 60 systems, 8.2 s.
    declared_vs_observed:
      - declared: "M_4 does not refute the 20 unsat N-CONV-VR and the 5 unsat descents"
        observed: 0/20 and 0/5 refuted
        held: true
      - declared: "fallen <= 850, rank M_4 <= 2754 on every O4 system (rigorous)"
        observed: fallen 833, rank 2737, P 1904, dims_by_deg [0, 1, 51, 833, 2737] on 60/60
        held: true
      - declared: "R-ED point prediction: fallen = 850 and rank = 2754 on >= 18/20 N-CONV-VR per role"
        observed: 833 / 2737 on 60/60 (17 fewer)
        held: false
        note: A further 17-dimensional syzygy family, identical on all 60 systems (descents and uniform draws alike), is not in my trivial + ell-syzygy count. Structural, not random. Reported as a miss of the point prediction.
      - declared: "W_4 refutes the 20 unsat N-CONV-VR at one_first_iteration = 1 on >= 18/20, final_dim 4048 (confidence about 65%)"
        observed: 20/20 at iteration 1, final_dim 4048, W_4 dims_by_deg [1, 19, 172, 988, 4048]
        held: true
      - declared: "W_4 refutes the 5 unsat descents at iteration >= 1 on >= 4/5 (about 55%)"
        observed: 5/5 at iteration 1
        held: true
      - declared: "satisfiable O4 systems: no refutation; codim(W_4) = s on >= 90%"
        observed: 0/35 refuted; codim = s on 35/35
        held: true
    certificates: >-
      The engine returned 25 flat certificates (all W_4, iteration-1 refutations), with
      max |mu| = 3 and 3291-3416 pairs; all 25 verify by my own sum (rtlib.flat_cert_ok).
      With max |mu| = 3 a flat certificate certifies unsatisfiability and 1 in M_5, NOT
      1 in W_4 (RC-1 J7 (a)). W_4 membership at iteration 1 is backed by my own literal
      W_4 (every low-degree basis vector times every v_j at every iteration), which
      agrees with the engine field for field (dims, final_dim, one,
      one_first_iteration, dims_by_deg, iterations) on N-CONV-VR:0:unsat, S3-VR:3 and
      N-CONV-VR:0:sat (own-crosscheck.json). For the other 22 refutations W_4 membership
      rests on the engine record plus those 3 cross-checks. No wdag-v1 was built (the
      plan asks for the engine's certificates only).
    reading: >-
      At M_4, the refutation of N-CONV is tied to the polynomial basis: over V' the
      same field, curve, targets, l, keep rule and lower-part law give 0/20 at M_4, because
      the Hankel coincidence (b_i b_j = t^{i+j}) is what makes P = 1695 and forces
