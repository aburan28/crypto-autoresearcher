      polynomial basis: the V' draws and the V' S_3 descents are refuted 25/25, exactly as
      S3-U62 is (iteration 1, W^(1) = B_{<=4}). Per the plan's failure signature, the W_4
      reading must widen from "convolution tensor" to "F_{2^17} multiplication restricted
      to a 9-dimensional subspace" (tested on the polynomial basis and ONE random V'),
      and the M_4 reading stays polynomial-basis-specific, which J12 records as scope.
    scope_of_O4: >-
      One random basis, 20 slots (the 20 lowest-idx U62 x_R), one draw per role per slot.
      The O4 descents are different Boolean systems from the U62 ones (different factor
      base V'), so "S_3 over V'" is not "S_3 at U62". No N-CONV17-type (cokernel-free)
      arm over V' was built.

