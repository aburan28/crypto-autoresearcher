j10_readings:
  verdict: breaks
  verdict_scope: >-
    O1 and O2 show their signatures: the ENGINE proves nothing too much. The break is
    at the level of ARGUMENTS and READINGS. (i) O3: the J9 (b) counting argument, as a
    derivation, proves too much (it predicts M_4 refutation on 62/62 U62), and survives
    only as a heuristic scoped to uniform lower parts with a named, partly supported
    exemption. (ii) O4: the nearby object REMOVES the polynomial-basis dependence of the
    W_4-level refutation (20/20 and 5/5 at W_4, iteration 1, over a random V') while
    confirming it for the M_4 level (0/20 and 0/5). The label "convolution tensor"
    is therefore too specific at W_4 and correct in its polynomial-basis form only at M_4.

  O1:
    object: satisfiable controls of every arm (S3-S62, and the 144 of each of N-CONV, N-CONVL, N-CONV17, N-ELL144); plus the 35 O4 satisfiable systems
    signature: no M_4 or W_4 refutation; codim(W_4 in B_{<=4}) >= s with s <= 31
    result:
      refutations: 0 on 638/638 archived satisfiable controls and 0 on 35/35 O4 satisfiable systems
      codim_eq_s: "S3-S62 62/62; N-CONV 144/144; N-CONVL 144/144; N-CONV17 144/144; O4 35/35 (W_4 = I cap B_{<=4} exactly)"
      codim_gt_s: "N-ELL144 144/144: codim 886 on every control, s = 1..6, so codim - s = 880..885"
      codim_lt_s: 0 anywhere (no unsoundness signature)
      M4_on_controls: "N-CONV and N-CONV17 controls: M_4 cap B_{<=3} = I cap B_{<=3} (fallen = 988 - s, 288/288); S3-S62 and N-CONVL: fallen < 988 - s by 3-32"
    RM_bound:
      statement: For S a set of Boolean points in F_2^m, evaluation B_{<=d} -> F_2^S is onto if |S| <= 2^{d+1} - 1; hence codim(I cap B_{<=d}) = s for s <= 2^{d+1} - 1.
      status: verified (re-derived here, not recalled)
      proof: >-
        Onto iff no nonzero y in F_2^S annihilates B_{<=d}, i.e. iff no nonzero word of
        RM(d, m)^perp has support inside S. The monomial inner product
        sum_x x_A x_B = 2^{m - |A u B|} mod 2 is 0 when |A| + |B| < m, so
        RM(m-d-1, m) <= RM(d, m)^perp, and the dimensions sum to 2^m, so they are equal.
        A nonzero Boolean function of degree <= r has at least 2^{m-r} nonzeros
        (induction on m: f = g + x_m h; if g, g + h are not both zero, count on each half
        of the cube). With r = m - d - 1 every nonzero dual word has weight >= 2^{d+1}.
        B is F_2^{2^m} as a ring, so the ideal of a system is the vanishing ideal of its
        solutions, and codim(I cap B_{<=d}) = |S| for |S| <= 2^{d+1} - 1.
      machine_check: m = 5..8, d = 0..4, 100/100 random sets of size 2^{d+1} - 1 onto per case; a (d+1)-dimensional subspace (2^{d+1} points) is not onto (tight) -- o1-o2.json RM_check
      what_O1_signature_rests_on: the bound above (verified), soundness of W_4 (every element in the ideal), and the recorded s (re-decided by J1, not here)
    RT-4_C-PS_on_N-ELL144: >-
      What C-PS as an INEQUALITY can still detect there: a refutation of a satisfiable
      control, or an engine that adds more than about 880 spurious dimensions outside
      the ideal (so that codim falls below s). What it cannot detect there: an engine
      that adds FEWER than about 880 spurious dimensions, or one that drops dimensions
      (an under-complete closure); the slack is 880-885. On N-ELL144 the check that binds
      is T5 exactness, which pins W_4 to the dimension: final_dim = rank R'_4 + 834 =
      3162 and dims_by_deg [0, 1, 34, 442, 3162] on 288/288 N-ELL144 and 20/20 NELL-A20
      (o1-o2.json O2_T5_exactness), plus C-T4 and the per-degree T4 identity (below).
      On N-CONV, N-CONVL, N-CONV17 and S3-S62 C-PS is at EQUALITY, so there it would
      also catch a single spurious dimension.
    verdict: holds (the engine proves nothing too much on known-false objects)

