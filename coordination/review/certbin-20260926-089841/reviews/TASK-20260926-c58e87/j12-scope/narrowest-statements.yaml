# J12 -- SCOPE AND TRANSFER (TASK-20260926-c58e87). Narrowest supported statement for every
# NC-DR verdict, PN-1..PN-5 and each pre-data prior part (a)-(g); the n = 19 counting
# (n19-counting.json, n-trend.json: DERIVATION, unchecked by measurement); an n = 19 control
# PROPOSAL (not a design); transfer language; the resource_check reading.
# Every statement is conditional on the admissibility joints J1-J4 and J8 (not owned here).
common_scope: >-
  n = 17, f = t^17 + t^3 + 1, m = 2, l = 9, V = {deg < 9} (polynomial basis), curve
  A = 97044, B = 126251 (#E = 4 * 32603), the 144 archived x(2E) targets of
  RUN-CERTBIN-c417e0 (U62, S62, C20), one draw per slot and role per fresh arm on the frozen
  seeds, closures M_4 and W_4 (and R'_3, R'_4, W'_4), engine at 934bee5. Not F4, not D >= 5,
  not Semaev's Assumption 1, no cost (oracle A per attempt and parallel Pollard rho dominate;
  sota_delta zero).
j12_scope:
  verdict: breaks
  verdict_scope: >-
    Two readings exceed their support. (1) NC-DR-7's recommendation carries an implicit
    transfer: the counting that put N-CONV at the M_4 ceiling at n = 17 (margin +71 with
    the ell-syzygies) does NOT carry to n = 19 (margin -16), and O4 shows non-saturated
    uniform-lower-part systems are still refuted at W^(1). So an N-CONV-type arm at
    n = 19 is predicted to leave the M_4 ceiling and to stay at the W_4 ceiling, where
    its W_4 rate alone cannot discriminate S_3-specific behaviour. (2) Any reading of
    the result as specific to the polynomial-basis convolution tensor at W_4 exceeds O4.
    No frozen verdict changes. Nothing transfers beyond n = 17, this V, this curve,
    x(2E) targets and D <= 4 without measurement.

  NC-DR:
    NC-DR-1:
      recorded: "TENSOR (L1 = L2: w = 144, n_C = 144, CP95 [0.9747, 1]; 0 uncertified); E-LINEAR falsified, E-TENSOR not"
      narrowest: >-
        At this cell, one unsatisfiable draw per archived target with S_3's quadratic part
        and linear/constant bits uniform on S_L is refuted by W_4 in 144/144 cases; every
        one is already refuted by M_4 (iteration 0). S_3's specific linear part and curve
        constant are therefore NOT NECESSARY for degree-4 refutation relative to that
        lower-part law. It says nothing about why S_3 needs W_4 on U62 (N-CONV never
        does), and nothing at M_4 about S_3.
    NC-DR-2:
      recorded: "AT S_3's RATE (vs 386/386 and vs in-run 82/82)"
      narrowest: >-
        Both arms at the W_4 ceiling; overlap of x/x CP95 intervals is automatic for
        w >= about 140. No information beyond NC-DR-1. At M_4 the rates DIFFER
        (NC-DR-6). The 386/386 reference contains 304 imported Stage-1 flags (RC-1 OBJ-7).
    NC-DR-3:
      recorded: "ABOVE only between {N-CONV, N-CONVL, N-CONV17, S_3 (82)} and {N-ELL144, NULL-F262, NULL-AFF62 [one draw]}; every within-group pair NOT DISTINGUISHED"
      narrowest: >-
        At W_4 the ladder separates "convolution-form quadratic part present" from
        "absent", and nothing else. NULL-AFF62 comparisons hold for one affine draw.
        Within the upper group, the M_4 level separates N-CONV / N-CONV17 from N-CONVL /
        S_3 (disjoint CP95), which NC-DR-3 does not look at.
    NC-DR-4:
      recorded: "CONVOLUTION TENSOR; sub_label none; appended N-CONV17 reading CONVOLUTION FORMS SUFFICE WITHOUT THE COKERNEL FALL"
      narrowest: >-
        At this cell and under uniform lower parts on S_L, a quadratic part in the span of
        the 17 convolution forms is sufficient for W_4 refutation (N-CONV, N-CONV17
        144/144; also N-CONVL 144/144 with S_3's linear part), same-support systems
        without it are not (0/268); the cokernel fall ell is not needed. Sufficiency
        relative to a lower-part law, not a mechanism. Not specific to the polynomial
        basis at W_4: over one random V' the S_3-type quadratic part is also refuted 20/20
        at W_4 (J10 O4). Specific to the polynomial basis at M_4 (O4 0/20 at M_4).
    NC-DR-5:
      recorded: "FAILS on S3-U62, S3-C20, S3-S62, N-CONV, N-CONVL, N-CONV17 (0 reference profiles); HOLDS on NULL-AFF62, NULL-F262 (62/62), NELL-A20 (20/20), N-ELL144 (144/144)"
      narrowest: >-
        The semi-regular reference profiles of object.rc_b (6) hold exactly on every
        tested system without the convolution quadratic part and on none with it
        (descriptive; no verdict on any heuristic). Pre-data prior (c) is confirmed.
    NC-DR-6:
      recorded: "N-CONV M_4 NOT AT STAGE-1 RATE (144/144, CP95 [0.9747, 1], above [0.799, 0.875]); conditional W_4 rate 0/0"
      narrowest: >-
        At M_4, uniform lower parts on the polynomial basis are refuted more often than
        S_3's own lower part (144/144 against 324/386 unconditional on x(2E) targets),
        because they saturate the degree-<=3 fallen space (142/144) while S_3 never does
        (386/386 Stage-1 unsat, fallen <= 979). The reference interval is the right one
        (recounted). The conditional W_4 rate is undefined (0/0): the W_4-needing
        phenomenon is absent from N-CONV. The in-run S_3 (82) M_4 rate 20/82 is a
        selection artifact and is not a comparison point.
    NC-DR-7:
      recorded: "the n = 19 cell quotes S_3-specificity against an N-CONV-type arm (same-support nulls insufficient)"
      narrowest: >-
        Follows mechanically from NC-DR-4 = CONVOLUTION TENSOR and is correct in its
        negative half: same-support nulls are insufficient as the only contrast. Its
        positive half assumes an N-CONV-type arm at n = 19 will discriminate. Read
        through the n = 19 counting below, it will probably not do so on the W_4 rate
        alone. The arm must be read on one_first_iteration and the M_4 fall profile
        (control proposal below). The Coordinator decides after review; this is a reading.

  PN:
    PN-1: {recorded: "w = 144 >= 130", narrowest: "E-TENSOR threshold met as sufficiency (NC-DR-1 narrowest); E-LINEAR falsified"}
    PN-2: {recorded: "held on 864 systems", narrowest: "P = 1695 on every N-CONV, N-CONVL, N-CONV17 system and at every S_3 x_R (own count, 144/144). A theorem check: it can fail only through an implementation or engine defect, so 'held' is instrument evidence, not evidence about H-CERTBIN-be6cbd"}
    PN-3: {recorded: "T4 held on 1028, T5 on 308", narrowest: "the generalized T4 is a theorem (J11 verified), and the per-degree identity holds on 1028/1028 too; instrument consistency only"}
    PN-4: {recorded: "0 refuted satisfiable controls", narrowest: "0 of 638 archived controls (and 0 of 35 O4); codim(W_4) = s exactly on 534/638, and 886 > s on the 144 N-ELL144 controls, where C-PS has 880-885 dimensions of slack and T5 exactness is the binding check"}
    PN-5: {recorded: "N-ELL144 0/144 with T5 applicable 144/144 and the semi-regular profile", narrowest: "the derived prediction held exactly (W_4 = T5 value on 288/288 N-ELL144 systems and 20/20 NELL-A20): one linear fall without the tensor does not give degree-4 refutation at this cell"}

  prior_parts:
    a: {prior: "N-CONV TENSOR about 65%; reason: a random lower part should not lift more top syzygies to true syzygies than S_3's does", narrowest: "TENSOR observed. The reason's direction is confirmed (N-CONV dim K 241-242 against in-run S_3 250-265), but the route is M_4 saturation, not W_4 fill: N-CONV never needs W^(1)"}
    b: {prior: "N-CONV M_4 rate at least S_3's Stage-1 rate (about 55%)", narrowest: "held and exceeded: 144/144 vs 324/386, disjoint CP95"}
    c: {prior: "N-CONV substituted profiles non-semi-regular on >= 90% (about 65%)", narrowest: "held: 0/144 semi-regular"}
    d: {prior: "N-CONVL TENSOR-level (about 75%): it is S_3 with another constant", narrowest: "held at W_4 (144/144). The reason is confirmed at M_4 as well: N-CONVL is S_3-like, never saturated, with per-target-type M_4 rates matching S_3's Stage-1 rates"}
    e: {prior: "N-CONV17 no confident prior (about 50% TENSOR-level)", narrowest: "TENSOR-level at W_4 (144/144) and 143/144 at M_4; the cokernel fall is not needed"}
    f: {prior: "N-ELL144 refuted 0 times (about 95%)", narrowest: "held: 0/144, with W_4 exactly the T5 value"}
    g: {prior: "every W_4 refutation gets a verified wdag-v1 (about 80%)", narrowest: "0 uncertified, 0 failed as recorded; author-independent confirmation is J1's and J8's, not this joint's"}

  n19_counting:
    status: "DERIVATION, unchecked by measurement. The n = 19 modulus is my own choice (pentanomial 524327 = t^19 + t^5 + t^2 + t + 1, irreducibility checked), because the cell's own modulus is in excluded files. P for the convolution forms is modulus-free."
    rt5_status_of_plan_framing: >-
      review-plan J12 (ii) counts (M_4 rows 19 * (1 + 20 + C(20,2)) = 4009, dim B_{<=3}
      = 1 + 20 + 190 + 1140 = 1351): verified. The ASSUMPTION implicit in NC-DR-7 and
      coordinator_prior J12 ("the saturation reading predicts the same ceiling for an
      N-CONV19-type arm") is refuted as a counting consequence, see margins.
    values:
      P_convolution_forms_n19: 2465
      P_S3_poly_basis_n19: "2465 at 5/5 random x_R (own modulus)"
      P_S3_random_V_n19: "2736 at 3/3 random bases"
      dim_Z_top_n19: 1544
      trivial_n19: 190
      ell_syzygies_n19: "19 assumed (nv - 1, by analogy with the 17 = nv - 1 measured independent at n = 17)"
    margins: >-
      Saturation margin (dim Z_top - trivial [- ell-syzygies] - dim B_{<=3}) on the
      diagonal polynomial basis, convolution forms (n-trend.json): n = 13: +146 (+133);
      15: +133 (+118); 17: +88 (+71); 19: +3 (-16); 21: -130 (-151); 23: -319 (-342).
      Random V' at n = 19: -268 (-287).
    reading: >-
      The polynomial-basis fact of J12 (i) (x_1 x_2 never reduces modulo f, 2l - 1 = n)
      IS shared at n = 19, l = 10, and a random V does not share it (P 2465 vs 2736).
      Its CONSEQUENCE, forced saturation, is NOT shared. For arms with the cokernel ell
      (N-CONV19-type) the margin is -16: if the 19 ell-syzygies are independent, as at
      n = 17, then fallen <= 1335 < 1351 for every lower part and M_4 saturation is
      impossible. For the cokernel-free N-CONV17-type arm the margin is +3, so
      saturation is barely forced (under the random-map model about 88% of draws
      saturate). By the O4 analogy (non-saturated uniform-lower-part draws refuted at
      W^(1), 25/25), an N-CONV19-type arm is predicted to be refuted at W_4 iteration 1
      rather than at M_4. It would sit at the W_4 ceiling beside S_3 if S_3 is also
      refuted there, and so would not discriminate on the frozen W_4 rate.
    persistence_in_n: >-
      The M_4-saturation mechanism of generic lower parts on the diagonal polynomial
      basis ends between n = 17 and n = 21. It bears on KN-OPEN-3c8f51 item (B) only for
      synthetic generic-lower-part systems. S_3 itself is never saturated at n = 17, so
      the margin does not predict S_3's own M_4 rate at n = 19.

  n19_control_proposal:   # PROPOSED ONLY (RT-6); not a design, not an approval
    - id: P-1
      text: >-
        Before approving the n = 19 design (DEC-20260924-e61f3b NA-3): compute, for its
        actual modulus and V, P from the quadratic part, the independent ell-syzygy count
        and the saturation margin (seconds; no trial), and pre-register R-ED's per-record
        predictions (fallen, rank, one) for every uniform-lower-part arm.
    - id: P-2
      text: >-
        Read every arm on one_first_iteration and on the M_4 fall profile (fallen, codim
        in B_{<=3}), not only on the W_4 rate: that is the separator the frozen primary
        lacks (review-plan observation_collision).
    - id: P-3
      text: >-
        Carry an N-CONVL-type arm (S_3's own quadratic and linear parts; constant drawn
        on S_L cap column 0), typed by target class (x(2E) of the drawn curve iff
        Tr(b'/x_R^2) = Tr(B/x_R^2) when Tr(x_R) = Tr(A)). At n = 17 it reproduced S_3's M_4
        behaviour per type. It keeps the structured lower part that the U62 phenomenon
        needs.
    - id: P-4
      text: >-
        Carry a sigma-symmetric uniform-lower-part arm (linear part uniform on
        span{v_j + v_{10+j}}, constant uniform on S_L cap column 0). It is the cheapest
        separator of the two named exemption properties: sigma-symmetry against the
        Frobenius-compatible linear part.
    - id: P-5
      text: >-
        If the NA-3 N-CONV-type arm is kept, keep it UNCONDITIONED (so its rate stays
        comparable) and report its conditional iteration-1 W_4 rate among M_4-unrefuted
        draws with the denominator. A draw rule conditioned on M_4 non-refutation is
        informative only if the unconditional M_4 rate is well below 1. The n = 19
        counting predicts that it will be, but that is unchecked.
    - id: P-6
      text: >-
        One random-V' arm (O4-type), to separate polynomial-basis effects (the Hankel
        coincidence persists at l = 10) from field multiplication on a subspace.

  transfer_language:
    run-report.md: "Scope paragraph: 'Nothing here transfers to n = 19, other curves or V, or off-x(2E) targets without measurement.' No transfer claim found."
    implementation.md: >-
      No transfer language. One imprecision: "N-CONV rank M_4 is 2677-2683 and fallen is
      982-988" pools the unsatisfiable and satisfiable roles; unsatisfiable alone is
      2682-2683 / 987-988, and satisfiable is 2677-2682 / 982-987 (= 988 - s). A reading
      note, not an error of record.
    decision-rules.json_NC-DR-7: the recommendation text is the one implicit transfer (see NC-DR-7 and n19_counting)

  resource_check:
    examined: true
    reading: >-
      Three theories take these measurements as their HYPOTHESIS.
      (R-A) Degree-4 polynomial calculus: every tested unsatisfiable system with the
      convolution-form quadratic part (and, by O4, with one random-V' S_3-type part)
      has a degree-4 PC refutation over F_2 with Boolean axioms (the W_D <-> degree-D PC
      reading is RC-1's, confirmed at source there; not re-confirmed here). This is the
      hypothesis of degree-d PC search (Clegg-Edmonds-Impagliazzo; recalled pointer
      only). Relevant only where enumeration does not dominate (m >= 3 or chained).
      (R-B) A saturation count as an exact, pre-data predictor. dim Z_top - trivial -
      ell-syzygies - dim B_{<=3} is computable from the quadratic part alone (L-TOP), in
      seconds. It predicted the per-record M_4 signature of three families before any
      closure (N-CONV, N-CONV17 saturated; O4 impossible). Its margin across n (+146 ->
      -319) predicts that generic M_4 saturation on the diagonal polynomial basis is a
      small-n phenomenon. This reads the obstruction "N-CONV sits at the M_4 ceiling" as
      the hypothesis of a persistence-in-n statement for synthetic systems
      (KN-OPEN-3c8f51 item (B)); not for S_3 itself.
      (R-C) The plan's candidate, restated to fit the data: "the degree-4 refutation of
      S_3-type descents is a property of F_{2^n}-multiplication on a subspace (W_4), with
      a polynomial-basis-specific M_4 saturation for generic lower parts, and S_3's
      quadratic-plus-linear pair is a special NON-SATURATING one." That is the hypothesis
      of a structured degree-fall theory for low F_{2^n}-degree (Frobenius-compatible)
      Weil descents, in the HFE / first-fall-degree tradition (Granboulan-Joux-Stern;
      Petit-Quisquater; Hodges-Petit-Schlather: recalled pointers only, not read).
      Additional resource: the EXCESS fallen codimension, codim(M_4 cap B_{<=3} in
      B_{<=3}) minus s (s = 0 for unsatisfiable systems), is an exact per-instance
      invariant that separates two populations. It is >= 3 on all 736 distinct measured
      systems carrying S_3's quadratic-plus-linear pair (386 Stage-1 unsatisfiable S_3
      targets with P = 1695 recomputed per x_R, 9-24; 62 S3-S62, 6-21; 288 N-CONVL, 3-32).
      It is <= 1 on all 576 uniform-lower-part polynomial-basis systems (N-CONV,
      N-CONV17: 0 on 570, 1 on 6). No ECDLP use at m = 2 (oracle A dominates).
    spawned_ids: []
    spawned_ids_note: None minted; the red team writes no ledger record. P-1..P-6, R-B and R-C are candidates for the Coordinator's ranking, not evidence.
