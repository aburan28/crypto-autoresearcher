# J11 (1)-(2) -- PROOF VERDICTS on L-TOP (i)-(iii) and on the generalized T4,
# written BEFORE ANY COMPUTATION (RT-2 step 1; ORDER.log). TASK-20260926-c58e87.
# Sources read before writing (internal, committed at c7f5e3dfa):
#   ledger/hypotheses/H-CERTBIN-be6cbd.yaml (mechanism: L-TOP, SUBSTITUTION)
#   experiments/EXP-CERTBIN-ddfe75/specification.yaml (object, rc_b, E_layout)
#   experiments/EXP-CERTBIN-e94b27/specification.yaml (object.ring, macaulay_M_D, mutant_closure_W_D)
#   experiments/EXP-CERTBIN-4e92d7/specification.yaml (object: field, unknowns, S_3, descent, M_D conventions)
#   coordination/review/certbin-20260924-3d7e1a/reviews/TASK-20260924-d95e70/j9-ptm/o2-declaration.yaml (T4, T5 as proved there)
# No number of RUN-CERTBIN-6ebb0e was read before this file was written.
j11_proof_verdicts:
  setting: >-
    B = F_2[v_0..v_17]/(v_i^2 + v_i). f_k = q_k + l_k + b_k (q_k homogeneous
    bilinear in (v_0..v_8) x (v_9..v_17); l_k linear; b_k constant). M_4 rows
    mu*f_k, |mu| <= 2 (172 monomials x 17 = 2924 rows), columns B_{<=4}
    (1 + 18 + 153 + 816 + 3060 = 4048). pi_4 = projection onto the 3060
    degree-4 monomials. W_4 = least subspace of B_{<=4} containing
    rowspace(M_4) and closed under g -> v_j g for deg g <= 3 (e94b27
    mutant_closure_W_D; the iteration computes this least fixpoint).

  L-TOP:
    status: verified
    rt5_status: verified
    line_by_line:
      - step: "pi_4(mu*f_k) depends on q_k alone"
        check: >-
          deg(mu*b_k) <= |mu| <= 2 and deg(mu*l_k) <= |mu| + 1 <= 3, so neither
          reaches degree 4. For a bilinear monomial m, the multilinear reduction
          of mu*m is the monomial mu cup m, of degree |mu cup m| <= 4 with
          equality iff |mu| = 2 and mu cap m is empty. Hence pi_4(mu*f_k) =
          [|mu| = 2] * sum_{m in supp q_k, m cap mu empty} (mu cup m).
          Depends on (mu, q_k) only.
        verdict: verified
      - step: "(i) P = rank pi_4(M_4) is a function of (q_0..q_16) alone"
        check: The 2924 x 3060 matrix pi_4(M_4) is determined row by row by the previous step.
        verdict: verified
      - step: "(ii) dim(M_4 cap B_{<=3}) = rank M_4 - P"
        check: >-
          rowspace(M_4) cap B_{<=3} = ker(pi_4 restricted to rowspace(M_4)), and
          pi_4(rowspace M_4) = rowspace(pi_4(M_4)) has dimension P. Rank-nullity
          on rowspace(M_4). This is the quantity the engine reports as
          dims_by_deg(M_4)[3] (with a degree-compatible column order the RREF
          rows whose leading monomial has degree <= 3 span exactly the
          elements of degree <= 3), so derived_per_instance P = rank M_4 -
          dims_by_deg[3] is the same P.
        verdict: verified
      - step: "(iii) Z_top has dimension 2924 - P, depends on q alone, K <= Z_top, fallen = dim Z_top - dim K"
        check: >-
          Z_top := left kernel of pi_4(M_4) in F_2^2924; dimension 2924 - P;
          depends on q alone by (i). If z M_4 = 0 then z pi_4(M_4) =
          pi_4(z M_4) = 0, so K <= Z_top. The map Z_top -> B_{<=3}, z -> z M_4,
          lands in B_{<=3} (degree-4 part cancels), is onto rowspace(M_4) cap
          B_{<=3} (any element of degree <= 3 of the row space is z M_4 for
          some z, and that z lies in Z_top), and has kernel K. So fallen =
          (2924 - P) - dim K, which agrees with (ii) since dim K = 2924 -
          rank M_4.
        verdict: verified
    consequence_checked: >-
      S_3, N-CONV and N-CONVL at the same x_R share q, hence share P and
      Z_top; they differ in fallen only through dim K. Verified. N-CONV17
      systems all share Q (T = identity), hence one P. Verified.
    what_L_TOP_does_not_say: >-
      L-TOP fixes the SUPPLY (Z_top) and says nothing about the IMAGE of the
      fall map z -> z M_4 on Z_top, which is where "1 in rowspace(M_4)" is
      decided; that map depends on (l, b). The hypothesis sentence "a generic
      lower part should lift no more [top syzygies] to true syzygies than
      S_3's does" is NOT part of L-TOP. It is a semicontinuity heuristic: over
      the algebraic closure the rank of M_4, whose entries are affine in the
      lower-part bits, is maximal on a non-empty Zariski-open set, so the
      generic rank is >= S_3's rank; over F_2 a uniform draw is not a
      Zariski-generic point, and the argument gives no probability. Marked
      `unchecked` (heuristic), and it is not needed for (i)-(iii).
    counterexample_search: >-
      None needed for a verified proof. C-TOP in the run is the per-instance
      check; J11 treats it as a consistency check of the implementation, not
      as evidence for the lemma (it cannot fail unless q differs or the engine
      is wrong).

  generalized_T4:
    status: verified
    rt5_status: verified
    statement_checked: >-
      Let ell = sum_k c_k f_k be affine with nonzero linear part (c in the
      left kernel of the quadratic-column submatrix), write ell = v_{j*} + a
      with a an affine form in the other 17 variables, and let
      pi: B -> B' = F_2[v_i : i != j*]/(v_i^2 + v_i) send v_{j*} -> a (i.e.
      "v_{j*} := ell + v_{j*}") and fix every other variable. W'_4 := the
      degree-4 mutant closure of pi(f_0..f_16) in B'. Claims: (T4a)
      W_4 = pi^{-1}(W'_4) cap B_{<=4}; (T4b) dim W_4 = dim W'_4 + 834;
      (T4c) 1 in W_4 iff 1 in W'_4.
    proof_as_checked:
      - lemma: pi is a well-defined ring homomorphism with kernel (ell) = ell*B
        check: >-
          a^2 = a in B' for ANY affine form a (Frobenius is additive and
          v_i^2 = v_i, 1^2 = 1), so the relation v_{j*}^2 = v_{j*} is
          respected. B = B'[v_{j*}]/(v_{j*}^2 + v_{j*}) and pi is evaluation at
          v_{j*} = a, so ker pi = (v_{j*} + a) = (ell); in a Boolean ring a
          principal ideal is ell*B.
        verdict: verified (holds for dense a)
      - lemma: pi does not raise degree, and is the identity on B'
        check: >-
          pi(mu) for a monomial mu containing v_{j*} is a * (mu minus v_{j*}),
          multilinearly reduced: degree <= |mu|. Monomials without v_{j*}
          are fixed.
        verdict: verified. For a DENSE a, pi(mu) is a sum of up to |supp a| + 1 monomials instead of one; nothing below needs it to be a monomial.
      - lemma: ker(pi) cap B_{<=4} = ell * B'_{<=3}, of dimension dim B'_{<=3} = 1 + 17 + 136 + 680 = 834
        check: >-
          ell*g for g in B'_{<=3} has degree <= 4 and pi(ell g) = 0. The map
          g -> ell*g is injective on B' (the v_{j*}-part of ell*g is v_{j*}*g,
          since neither a nor g involves v_{j*}). Dimension count: pi maps
          B_{<=4} ONTO B'_{<=4} (identity on B'_{<=4}), so dim(ker pi cap
          B_{<=4}) = 4048 - 3214 = 834. Equal spaces.
        verdict: verified
      - lemma: ell * B'_{<=3} <= W^(1) <= W_4
        check: >-
          ell is in span{f_k}, so mu*ell is in rowspace(M_4) for every |mu| <= 2
          (a sum of rows mu*f_k). For |mu| = 2, deg(mu*ell) <= 3 whatever the
          density of ell, so v_j*(mu*ell) is in W^(1). Every ell*g with g a
          monomial of degree <= 3 not involving v_{j*} is reached. Uses: ell in
          the span of the f_k. The density of ell does not enter.
        verdict: verified
      - lemma: pi(W_4) <= W'_4
        check: >-
          Base: pi(mu*f_k) = pi(mu)*pi(f_k) and pi(mu) is a combination of
          monomials mu' of B' with |mu'| <= 2, so pi(mu f_k) is a combination
          of rows of M'_4 (R'_4 fixture 2618 x 3214). Step: for g in W_4 with
          deg g <= 3 and pi(g) in W'_4 (deg pi(g) <= 3): if j != j*,
          pi(v_j g) = v_j pi(g) is in W'_4; if j = j*, pi(v_{j*} g) =
          a*pi(g) = sum_{i in supp a} v_i pi(g) + a_0 pi(g), each term in
          W'_4. By induction over the least-fixpoint construction.
        verdict: verified (the j = j* case is exactly where density enters; it is absorbed by linearity)
      - lemma: W'_4 <= pi(W_4)
        check: >-
          Base: a row mu'*pi(f_k) of M'_4 equals pi(mu'*f_k) (mu' does not
          involve v_{j*}). Step: let h' in W'_4 with deg h' <= 3 and h' in
          pi(W_4), say h' = pi(g), g in W_4. Viewed in B, h' is its own pi-image,
          so h' - g is in ker pi cap B_{<=4} <= W_4, hence h' in W_4 with
          deg h' <= 3, hence v_i h' in W_4 and pi(v_i h') = v_i h'.
        verdict: verified
      - conclusion: (T4a), (T4b), (T4c)
        check: >-
          pi(W_4) = W'_4 and ker(pi|W_4) = ker pi cap B_{<=4} (contained in
          W_4). (T4a): x in B_{<=4} with pi(x) = pi(g), g in W_4, gives
          x - g in W_4. (T4b): rank-nullity, 834. (T4c): pi(1) = 1 and 1 is
          in B_{<=4}.
        verdict: verified
    additional_consequence: >-
      The same argument gives, for every d = 0..4, dims_by_deg(W_4)[d] =
      dims_by_deg(W'_4)[d] + dim B'_{<=d-1} (with dim B'_{<=-1} = 0,
      B'_{<=0} = 1, B'_{<=1} = 18, B'_{<=2} = 154, B'_{<=3} = 834): pi maps
      W_4 cap B_{<=d} onto W'_4 cap B'_{<=d} with kernel ell*B'_{<=d-1}. The
      red team stated this under T5 only; it holds under T4 alone. It is a
      per-degree check C-T4 did not use.
    T5_checked: >-
      If dim(R'_4 cap B'_{<=3}) = rank R'_3 then, since rowspace(R'_3) <=
      R'_4 cap B'_{<=3} (rows mu' pi(f_k), |mu'| <= 1, have degree <= 3), the
      two are equal, v_i times any element of it is a combination of rows
      v_i mu' pi(f_k) of R'_4, so R'_4 is closed and W'_4 = R'_4. Then
      final_dim(W_4) = rank R'_4 + 834 and 1 in W_4 iff 1 in R'_4. Verified.
    coordinator_wording_check: >-
      H-CERTBIN-be6cbd says the proof "uses only that pi is a ring
      homomorphism B -> B' with kernel ell*B". That clause is INCOMPLETE. The
      proof also uses (1) that pi does not raise degree and fixes B'
      pointwise, and (2) that ell lies in span{f_k}, so that ell*B'_{<=3}
      <= W^(1). Both hold for every affine one-variable substitution arising
      from a linear ell in the span, dense or not, so the conclusion stands.
      The wording is a documentation defect, not a proof defect.
    cokernel_functional:
      claim: For S_3, N-CONV and N-CONVL the left kernel of the quadratic-column submatrix is spanned by c_k = Tr(t^k / x_R^2)
      check: >-
        q_k = sum_s [phi(t^s)]_k Q_s with the 17 Q_s (s = 0..16) on disjoint
        non-empty monomial supports, hence independent; so the left kernel is
        that of the 17 x 17 matrix of phi(y) = y^2 + x_R y, which has kernel
        {0, x_R} (x_R != 0), rank 16. Writing c_k = Tr(theta t^k):
        Tr(theta phi(y)) = Tr((theta^{1/2} + theta x_R) y) vanishes for all y
        iff theta = theta^2 x_R^2, i.e. theta = x_R^{-2}.
      verdict: verified
    dense_ell_verdict: >-
      The dense-ell case (N-CONV's ell has a uniformly random linear part on
      its support) breaks nothing: density enters only through pi(mu) and
      pi(v_{j*}) being sums of monomials rather than monomials, and every use
      is linear. The plan's expected break point ("the dense-ell case of T4,
      if anywhere") does not break.
    what_T4_does_not_say: >-
      T4 is about W_4 only. For M_4, pi(rowspace M_4) = R'_4 holds, but
      ker pi cap B_{<=4} is NOT contained in rowspace(M_4) in general (ell*g
      with deg g = 3 need not be a row combination), so "1 in R_4 iff 1 in
      R'_4" is NOT implied, and no one claims it. Only "1 in R_4 implies 1 in
      R'_4" holds.

  ladder_reading: deferred to j11-ladder/ladder-reading.yaml (J11 (3) needs J9 and J10; RT-2 step 4)
