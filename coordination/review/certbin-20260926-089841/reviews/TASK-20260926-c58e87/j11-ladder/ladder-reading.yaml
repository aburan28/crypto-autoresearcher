# J11 (3) -- THE LADDER READING (TASK-20260926-c58e87). Written after J9 and J10 (RT-2 step 4).
# The proof verdicts (J11 (1)-(2)) are in proof-verdicts.yaml, written before any computation.
# Counts: ../j9-null/j9-analysis.json, ../j9-null/stage1-reference.json,
# ../j10-ptm/o4-engine-records.json, ../j10-ptm/o1-o2.json.
j11_ladder:
  verdict: holds
  verdict_scope: >-
    L-TOP (i)-(iii) and the generalized T4 are verified as proofs (proof-verdicts.yaml);
    the per-degree T4 consequence derived there holds on 1028/1028 archived substituted
    systems. NC-DR-4's label and appended reading are correct as SUFFICIENCY statements
    at W_4, and the narrowest reading below is what the rungs separate. The joint does
    not break; the reading narrows in specificity (and J10 O4 widens its W_4 object).

  rungs_at_W4_frozen:   # verified wdag-v1 counts as recorded; admissibility is J1/J8's
    N-CONV: "144/144 (all at iteration 0)"
    N-CONVL: "144/144 (105 at iteration 0, 39 at iteration 1)"
    N-CONV17: "144/144 (143 at iteration 0, 1 at iteration 1)"
    S_3_in_run: "82/82 (U62 62 at iteration 1, C20 20 at iteration 0)"
    N-ELL144: 0/144
    NULL-F262: 0/62
    NULL-AFF62: "0/62 (one affine draw)"
    O4_nearby: "N-CONV-VR 20/20 and V' S_3 descents 5/5, all at iteration 1 (not a frozen rung; J10)"

  rungs_at_M4_descriptive:   # NC-DR-6 per_arm_M4 and own CP95 (not a frozen rule)
    N-CONV: "144/144, CP95 [0.9747, 1]; fallen 988 on 142, 987 on 2"
    N-CONV17: "143/144, CP95 [0.9619, 0.9998]; fallen 988 on 140, 987 on 4"
    N-CONVL: "105/144, CP95 [0.6489, 0.7998]; fallen 965-982 (never 988)"
    S_3_unconditional_Stage1: "324/386, CP95 [0.7989, 0.8746]; fallen 964-979 (never 988)"
    O4: "0/25 unsat; fallen 833"
    N-ELL144: "0/144; fallen 442"
    nulls: "0/124; fallen 323"
    separations_by_CP95: >-
      N-CONV and N-CONV17 lie ABOVE N-CONVL and above S_3's Stage-1 rate (disjoint CP95).
      N-CONVL is NOT distinguished from S_3 overall, and per target type it matches
      S_3's Stage-1 per-type rates (x(2E): N-CONVL 66/80, CP95 [0.724, 0.901], against S_3
      87/103 and 324/386; twist: N-CONVL 39/64, CP95 [0.479, 0.729], against S_3 111/168).

  what_each_rung_varies:
    N-CONV: S_3's quadratic part phi_{x_R}(Q) kept; linear AND constant bits uniform on S_L
    N-CONVL: S_3's quadratic AND linear part kept; constant uniform on S_L cap column 0 (b' with support in B's bits). It IS the S_3 descent at x_R for curve (A, b').
    N-CONV17: the 17 convolution forms Q_k (rank 17, no x_R, no phi, no cokernel fall ell); linear and constant uniform on S_L
    O4: phi_{x_R}(x_1 x_2) over a random 9-dimensional V' (no Hankel coincidence); linear and constant uniform on S'_L

  NC-DR-4_label_reading:
    label: CONVOLUTION TENSOR
    narrowest_supported: >-
      At n = 17, l = 9, V = {deg < 9}, curve (97044, 126251), and the 144 archived x(2E)
      targets, a quadratic part in the span of the 17 convolution forms Q_s (S_3's rank-16
      image phi_{x_R}(Q), or all 17 Q_k) is SUFFICIENT for W_4 refutation of every tested
      unsatisfiable draw whose linear and constant bits are uniform on S_L (144/144 each),
      while same-support systems without it are refuted 0/144 (N-ELL144) and 0/62
      (nulls). Relative to that lower-part law, neither the Semaev linear part nor the
      curve constant is needed at W_4. This is sufficiency relative to a lower-part law,
      not a mechanism (KN-OPEN-3c8f51 resolution criterion 3).
    should_it_read_convolution_forms_Q: >-
      Yes for the frozen rungs: "the convolution forms Q_s = sum_{i+j=s} v_i v_{9+j}
      (products of two degree-< 9 polynomials, which never reduce modulo f)" is exactly
      what N-CONV and N-CONV17 share, and N-CONV17 shows the rank-16 phi-image and the
      cokernel fall are not needed. But the SPECIFICITY the word "convolution" suggests
      is not supported at W_4: over one random V' (no convolution structure, no Hankel
      coincidence) the same lower-part law is refuted 20/20 at W_4 (J10 O4). At W_4 the
      supported object is "F_{2^17} multiplication restricted to a 9-dimensional
      subspace, x_1 x_2 through phi" (polynomial basis; one random V'). At M_4 the
      polynomial-basis convolution IS the operative object (P = 1695 forces saturation;
      over V', P' = 1904 forbids it).
    sub_label: null (issued only in case (2); correctly absent)
    appended_reading: CONVOLUTION FORMS SUFFICE WITHOUT THE COKERNEL FALL
    appended_reading_narrowest: >-
      At this cell and lower-part law, the 17 convolution forms without phi and without
      the linear consequence ell = sum Tr(t^k / x_R^2) f_k suffice for W_4 refutation
      (144/144) and nearly always for M_4 refutation (143/144). The cokernel fall is not
      needed. Not tested over a random V' (no N-CONV17-type O4 arm).

  what_the_rungs_separate_that_the_primary_cannot:
    - >-
      The Semaev linear part carries the M_4 DELAY. N-CONV (linear part random) 144/144
      at M_4 against N-CONVL (S_3's linear part) 105/144, disjoint CP95. With S_3's linear
      part kept, the system is never saturated (288/288) and reproduces S_3's M_4 behaviour
      per target type. At W_4 both are at the ceiling, so NC-DR-3/NC-DR-4 cannot see this.
    - >-
      The curve constant acts at M_4 only through the TARGET TYPE of x_R on the drawn
      curve (A, b'). With Tr(x_R) = Tr(A) on all 144 x_R, x_R is an x(2E) target of
      E_{A,b'} iff Tr(b'/x_R^2) = Tr(B/x_R^2) (on the curve), else a twist target; never
      x(E) minus x(2E). This rests on the halving criterion, verified exhaustively on the
      archived curve and on 2 N-CONVL curves. N-CONVL's unsatisfiable draws split
      80 x(2E) / 64 twist, with M_4 rates matching S_3's Stage-1 rates per type.
    - >-
      The N-CONVL confound ("its targets are not x(2E) targets of the drawn curves") is
      therefore quantified, not only disclosed: 80/144 of its unsatisfiable draws ARE
      x(2E) targets of their curve, and the rest are twist targets, not arbitrary points.

  narrowest_ladder_statement: >-
    At n = 17, l = 9, polynomial-basis V, curve (97044, 126251), 144 archived x(2E) targets,
    D <= 4: (1) at W_4, a convolution-form quadratic part suffices for refutation under
    uniform lower parts (N-CONV, N-CONV17 144/144) and under S_3's own linear part with a
    drawn constant (N-CONVL 144/144); same-support systems without it are refuted 0/268.
    Over one random 9-dimensional V' the S_3-type quadratic part suffices too (20/20), so
    the W_4 property is not specific to the polynomial basis. (2) At M_4, uniform lower
    parts on the polynomial basis saturate the degree-<=3 fallen space and are refuted
    (144/144, 143/144). S_3's quadratic-plus-linear pair (S_3 itself, N-CONVL) is never
    saturated and is refuted at M_4 only on part of its targets, with the same per-type
    rates for S_3 and N-CONVL. Over V' uniform lower parts are not refuted at M_4 (0/20).
    (3) The ladder does not identify WHY the S_3 pair is never saturated. The candidates
    named in J9/J10 (sigma-symmetry; the Frobenius-compatible, low F_{2^17}-degree linear
    part) are not separated by any rung.

  rt5_status:
    - {item: "L-TOP (i)-(iii) (H-CERTBIN-be6cbd mechanism)", status: verified}
    - {item: "generalized T4 for an arbitrary one-variable affine substitution, incl. dense ell", status: verified}
    - {item: "H-CERTBIN-be6cbd: the T4 proof 'uses only that pi is a ring homomorphism with kernel ell*B'", status: "refuted as a description (also uses degree non-increase, identity on B', ell in span{f_k}); the conclusion stands"}
    - {item: "c_k = Tr(t^k / x_R^2) spans the left kernel (S_3, N-CONV, N-CONVL)", status: verified (proof); checked on 20/20 V' descents by own code}
    - {item: "per-degree T4 identity dims_by_deg(W_4)[d] = dims_by_deg(W'_4)[d] + dim B'_{<=d-1} (mine)", status: "verified (proof) and holds on 1028/1028 archived substituted systems"}
    - {item: "coordinator_prior J11: ladder narrows from phi_{x_R}(Q) toward the convolution forms Q", status: "verified for the frozen rungs (N-CONV17); at W_4 the O4 result widens the object beyond the polynomial basis"}
    - {item: "coordinator_prior J11: N-CONVL rung carries the confound that its targets are not x(2E) targets", status: "narrowed: 80/144 unsat N-CONVL draws are x(2E) targets of the drawn curve, 64 are twist targets; per-type M_4 rates match S_3's"}
