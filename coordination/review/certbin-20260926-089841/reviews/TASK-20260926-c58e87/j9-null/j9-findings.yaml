# J9 -- THE NULL CONTROLS: IS N-CONV THE RIGHT NULL? Findings (TASK-20260926-c58e87).
# Written AFTER the declared rule (j9b-saturation-derivation.yaml, sha256 1415fd77...52e1 in
# ORDER.log) and after the archived records were opened (ORDER.log STEP-4).
# Every count below is read from: j9-analysis.json (RUN-CERTBIN-6ebb0e closures/instances,
# own aggregation), stage1-reference.json (RUN-CERTBIN-3b7e05 targets, own recount),
# halving-check.json (own exhaustive check), j9b-counting.json (own counting),
# ../j10-ptm/o4-engine-records.json (O4), ../j10-ptm/own-crosscheck.json (own M_4/W_4).
j9_findings:
  verdict: breaks
  verdict_scope: >-
    Breaks the READING "N-CONV tests the S_3-specific W_4 behaviour (refutation that
    NEEDS W_4, as on U62)". Holds for the frozen question: N-CONV is a valid null for
    "is S_3's lower-degree part NEEDED for refutation by W_4 at this cell, relative to
    uniform bits on S_L" (answer: no, 144/144).
  breaking_artifact_produced: >-
    The first of the plan's three: a counting derivation, declared before the records
    were read, that makes M_4 refutation of generic-lower-part unsatisfiable draws
    EXPECTED at this cell (rigorous part: >= 88 non-trivial syzygies forced for every
    lower part; heuristic part: the random-fall-map rule R-ED), whose per-record
    signature then held on N-CONV and N-CONV17. N-CONV therefore sits at the M_4 ceiling
    and never exhibits the W_4-needing phenomenon (NC-DR-6 conditional rate 0/0). The
    second artifact (a selection effect that ALONE explains the contrast) is NOT
    produced; the third (a null that is not like-for-like) is not produced for the
    comparisons the nulls enter.

  b_rule_check_post_data:
    declared_rule: j9b-saturation-derivation.yaml declared_prediction_rule (R-ED for uniform lower parts; H-EX for N-CONVL)
    N-CONV:
      label: HOLDS
      unsat: "144/144 refuted by M_4; 142/144 with fallen = 988 exactly (dims_by_deg [1, 19, 172, 988, 2683]); 2/144 with fallen = 987, still refuted"
      sat: "144/144 with fallen = 988 - s exactly (s = 1..6), i.e. M_4 cap B_{<=3} = I cap B_{<=3}"
      rank: "2682-2683 unsat (predicted 2683); P = 1695 on 288/288"
      stratification: "M_4 refutation 62/62 (U62 slots), 62/62 (S62), 20/20 (C20): no stratum effect, as declared"
    N-CONV17:
      label: HOLDS
      unsat: "143/144 refuted by M_4; 140/144 with fallen = 988; 4 with 987, of which slot 83 is the one not refuted (W_4 iteration 1)"
      sat: "144/144 with fallen = 988 - s"
    N-CONVL_H-EX:
      label: HOLDS (not refuted)
      result: >-
        fallen < 988 on 288/288 N-CONVL systems (unsat 965-982, codim 6-23; sat
        950-979); fallen = 988 on 0/144 unsat (refutation condition was >= 72).
        M_4 rate 105/144 = 0.729, CP95 [0.6489, 0.7998]: strictly between 0.5 and
        0.9 and below N-CONV (CP95 [0.9747, 1]), as declared.
    calibration_of_the_random_model: >-
      The random-map model's own figure (a non-surjective image with probability
      <= 2^-88) is NOT the object's: 2/144 N-CONV and 4/144 N-CONV17 unsatisfiable
      draws miss saturation by exactly one dimension (fallen 987), i.e. about 2-3% of
      uniform draws, and one of them (N-CONV17:83) is not refuted by M_4. The model's
      transfer is qualitative (saturation is the rule), not quantitative.
    what_O4_adds: >-
      Over a random basis V' the counting forbids saturation (P' = 1904, fallen <=
      1020 - 170 = 850 < 988 for every lower part); the uniform-lower-part draws are
      then NOT refuted by M_4 (0/20) and ARE refuted by W_4 at iteration 1 (20/20),
      as declared before any engine call (j10-ptm/o4-declaration.yaml). So the
      M_4 ceiling of N-CONV is the saturation mechanism specific to P = 1695, not a
      property of uniform lower parts as such.

  problem_class:
    question: Does randomizing the linear and constant parts on S_L preserve the problem class of the S_3 descent?
    answer: >-
      No, in two measurable ways. (1) SYMMETRY. S_3 and N-CONVL are invariant under
      x_1 <-> x_2 (v_j <-> v_{9+j}), so solutions pair up: satisfiable s is even on
      143/144 N-CONVL controls (s in {1: 1, 2: 88, 4: 39, 6: 12, 8: 3, 10: 1}) and
      mostly even on S3-S62 ({2: 41, 4: 17, 5: 1, 6: 2, 8: 1}), and the unsatisfiable
      fraction of draws is 0.37 (N-CONVL) against 386/993 = 0.39 for S_3 at Stage-1 --
      about e^-1, one expected solution PAIR. A uniform lower part breaks the symmetry:
      s is odd on 78/144 N-CONV controls ({1: 44, 2: 50, 3: 28, 4: 15, 5: 6, 6: 1}), and
      the unsatisfiable fraction is 0.12 (N-CONV), 0.13 (N-CONV17) and 21/150 = 0.14
      (O4 draws) -- about e^-2, two expected solutions. So the kept unsatisfiable N-CONV
      systems are a rarer tail of a differently shaped population. (2) SATURATION. The
      uniform lower part saturates M_4 (142/144); the symmetric S_3 pair never does
      (386/386 Stage-1 unsat, 288/288 N-CONVL). Both facts support the named property
      H-EX (i); neither proves that symmetry, rather than the Frobenius-compatible
      linear part, causes the non-saturation.
    at_W4: "The class change is invisible at W_4 at this cell; both classes are refuted 144/144."

  a_selection:
    definition: >-
      U62 = EVERY F-S3 unsatisfiable test target of RUN-CERTBIN-3b7e05 that M_4 does
      not refute (62 of 386; recounted from the Stage-1 archive, stage1-reference.json:
      386 unsat, 324 with 1 in R_4, all x(2E)). C20 = the 20 lowest-idx of the 324.
      N-CONV draws at the same slots are unconditional.
    what_the_U62_slot_contrast_can_show: >-
      N-CONV 62/62 vs S3-U62 0/62 at M_4 mixes a population selected on S_3's M_4
      failure with an unselected draw. Relative to the unselected S_3 rate 324/386 =
      0.839 (own CP95 [0.7989, 0.8746]), the selection accounts for the drop
      0.839 -> 0 at U62 slots (about 84 of the 100 percentage points of that contrast).
      The selection cannot transfer to N-CONV through the quadratic part: P = 1695 at
      all 144 x_R (own count) and L-TOP, so Z_top does not distinguish U62 from C20
      slots; and N-CONV's M_4 rate is 100% in every stratum.
    residual_not_explained_by_selection: >-
      N-CONV 144/144 (CP95 [0.9747, 1]) lies ABOVE S_3's unconditional 324/386 (CP95
      [0.7989, 0.8746]): non-overlapping. This residual (about 16 points) is evidence
      about the LOWER PART, not about selection: a uniform lower part saturates the
      degree-<=3 fallen space (142/144 fallen 988), S_3's own lower part never does
      (fallen <= 979 on 386/386 Stage-1 unsatisfiable targets including the 324
      refuted ones, and on all 144 in-run S_3 systems).
    reference_check: >-
      NC-DR-6's reference [0.799, 0.875] is the right one: S_3's unconditional M_4 rate
      on x(2E) subgroup targets of the same curve (all 144 slots are x(2E) targets;
      checked Tr(x_R) = Tr(A) and x_R on the curve, 144/144, with the halving
      criterion verified exhaustively for this curve). The uniform-x_R F-RANDX rates
      (x(2E) 87/103, x(E) minus x(2E) 54/90, twist 111/168; own recount) are the
      references for off-x(2E) targets and are used for N-CONVL below.
    do_not_use: >-
      The in-run "S_3 (82)" M_4 rate 20/82 (CP95 [0.156, 0.351], cell-summary /
      NC-DR-6 per_arm_M4) is a composition of a set selected for M_4 failure (62) and
      20 chosen M_4 successes. It is not a rate of anything and must not be compared
      with N-CONV. NC-DR-6's label does not use it.
    verdict_on_selection: selection explains most of the U62-slot contrast but NOT all of the N-CONV-vs-S_3 difference at M_4; the residual is a lower-part effect.

  c_ceiling:
    at_W4: >-
      N-CONV 144/144, N-CONVL 144/144, N-CONV17 144/144, S_3 82/82 in-run (386/386
      combined, 304 of them Stage-1 flags imported by monotonicity). All at the ceiling.
    NC-DR-1: >-
      Discriminates "lower part needed" (E-LINEAR, <= 14) from "not needed" (>= 130):
      yes. Discriminates S_3-specific W_4 behaviour: no.
    NC-DR-2: >-
      "AT S_3's RATE" is guaranteed whenever both arms are at x/x: the CP95 intervals
      [0.9747, 1] and [0.9905, 1] overlap for any w >= about 140. The label adds nothing
      to NC-DR-1 at the ceiling.
    NC-DR-4: >-
      Discriminates "convolution quadratic part present" (N-CONV, N-CONVL, N-CONV17,
      S_3 at the ceiling) from "absent" (N-ELL144 0/144, NULL-F262 0/62, NULL-AFF62
      0/62 one draw at the floor). Nothing inside either group is distinguished at
      W_4 (NC-DR-3: every within-group pair NOT DISTINGUISHED).
    NC-DR-6_conditional: >-
      N-CONV W_4 among M_4-unrefuted: 0/0 (recorded CP95 [0, 1] is a convention for an
      empty denominator and must not be read as a rate; no rule consumes it). The
      phenomenon that motivated item (A) -- refutation that NEEDS W_4 -- is ABSENT from
      N-CONV. It is present in S3-U62 (62/62 at iteration 1), N-CONVL (39/39 of its
      M_4-unrefuted, all at iteration 1), N-CONV17 (1/1, slot 83), and in O4 (20/20
      N-CONV-VR and 5/5 V' S_3 descents, all at iteration 1).
    separating_observable: >-
      one_first_iteration (0 vs 1) and the M_4 fall profile (fallen, codim in B_{<=3}):
      N-CONV codim 0-1, S_3 codim 9-24, N-CONVL 6-23, O4 155 (fallen 833). The frozen
      primary cannot see them (review-plan observation_collision).

  d_direction:
    frozen_competitor: >-
      E-LINEAR: S_3's lower part is LOAD-BEARING for W_4 refutation (N-CONV <= 14/144).
      It posits the lower part as an ENABLER.
    what_the_data_say: >-
      At M_4 the lower part acts the other way. A uniform lower part makes refutation
      EASIER (144/144 at M_4 by saturation). S_3's structured lower part is associated
      with non-saturation (386/386) and a 16% share of targets that need W_4. N-CONVL
      (S_3's linear part, random constant) reproduces the delay (105/144 at M_4).
      At W_4 the direction question has no content at this cell: everything with the
      quadratic part is refuted.
    was_E-LINEAR_the_right_competitor: >-
      For the frozen question (is the lower part NEEDED for W_4 refutation) it was a
      legitimate competitor and it is falsified (w = 144 > 72). For the phenomenon that
      motivated item (A) it was the wrong-direction competitor. A competitor that could
      have been falsified in the observed direction is "E-DELAY: S_3's lower part DELAYS
      refutation relative to uniform lower parts (N-CONV's M_4 rate above S_3's Stage-1
      rate)". NC-DR-6 measured exactly that, descriptively.
    what_falsifying_E-LINEAR_licenses: >-
      Only: at this cell, relative to uniform bits on S_L, S_3's specific linear part and
      curve constant are not necessary for refutation by W_4 (or by M_4). It does NOT
      license "the lower part is irrelevant", any statement about why U62 needs W_4, or
      any statement at another n or basis.

  e_nulls:
    profiles: >-
      NULL-F262 and NULL-AFF62: M_4 profile [0, 0, 17, 323, 2771] on 62/62 each (the
      object.rc_b (6) unsubstituted reference); no ell (quadratic rank 17 on 62/62).
      N-ELL144: M_4 [0, 1, 34, 442, 2754] and substituted [0, 0, 16, 288, 2328] on
      144/144 unsat (the rc_b (6) substituted reference), T5 applicable 144/144, W_4
      dims_by_deg [0, 1, 34, 442, 3162] = the T5 value on 288/288 (unsat and sat).
      NELL-A20: the same on 20/20.
    support_class: >-
      Own decode of every archived E_hex against own U (union_support rule): NULL-F262
      62/62 and NULL-AFF62 62/62 inside U; N-ELL144 288/288 and NELL-A20 20/20 with rows
      0..15 inside U and row 16 = v_0 + v_9 + c. Same support class as N-CONV (all 81
      bilinear, all 18 linear, constant on B's bits).
    like_for_like: >-
      Like-for-like for the comparison they enter in NC-DR-4 (1): "same support,
      uniform lower part, no convolution quadratic part". The cleanest pair is
      N-CONV17 (rank-17 convolution forms, uniform lower part on S_L) against NULL-F262
      (rank-17 random bilinear, uniform on U): 144/144 vs 0/62. N-ELL144's row 16 is a
      FIXED sparse ell (v_0 + v_9 + c), not a dense random ell as in N-CONV; this does
      not affect the W_4 contrast (T4 holds for dense ell, j11-ladder). NULL-AFF62 is
      ONE affine draw evaluated at 62 x_R (effective family count 1).
      NOT like-for-like, and not used by any frozen rule, for an M_4 contrast with S_3
      or N-CONVL: the nulls sit at W_4 = M_4 by derivation (no fall), so they carry no
      M_4-vs-W_4 information.

  rt5_status:
    - item: "review-plan J9 (b): (2924 - P) - 153 > 988"
      status: verified (1076 > 988; with the 17 ell-syzygies, measured independent of the trivial ones on 61 systems -- the 60 O4 systems and polynomial-basis S_3 at U62 idx 27 -- 1059 > 988)
    - item: "review-plan J9 (b): non-trivial syzygies forced for every lower part"
      status: verified (>= 88; >= 71 beyond trivial + ell-syzygies)
    - item: "review-plan J9 (b) / coordinator_prior J9 (b): a generic lower part may be expected to fill almost all of B_{<=3} and refute at M_4"
      status: >-
        verified as a random-model heuristic scoped to uniform lower parts (declared
        before data; N-CONV 142/144 saturated and 144/144 refuted, N-CONV17 140/144 and
        143/144, sat controls 288/288 at 988 - s); refuted as a statement about every
        lower part (S_3 386/386 unsaturated; O4 0/20 where counting forbids it)
    - item: "coordinator_prior J9: S_3's own lower part is the SPECIAL one (lifts more top syzygies to true syzygies)"
      status: verified (in-run S3-U62 and S3-C20 dim K 250-265 vs N-CONV unsat 241-242; S_3 never saturated on 386/386 Stage-1 unsat)
    - item: "coordinator_prior J9: S_3's own lower part is what keeps M_4 from refuting on U62"
      status: >-
        refuted as an explanation of the U62 / C20 split (the 324 refuted Stage-1
        targets are equally unsaturated, fallen 972-979); verified only in the narrow
        form "relative to a uniform lower part on the polynomial basis, S_3's lower part
        prevents saturation, which is the precondition for needing W_4"
    - item: "coordinator_prior J9 (a): the N-CONV vs S3-U62 M_4 contrast is partly a selection effect"
      status: verified (about 84 of 100 points at U62 slots); the residual against the unconditional reference is not selection
    - item: "coordinator_prior J9 (c): the frozen W_4 comparison sits at a ceiling for both arms and cannot see the M_4/W_4 difference"
      status: verified
    - item: "NC-DR-6 reference [0.799, 0.875] is S_3's unconditional Stage-1 M_4 rate"
      status: verified (324/386 recounted from RUN-CERTBIN-3b7e05; own CP95 [0.7989, 0.8746])
    - item: "halving criterion P in 2E iff Tr(x(P)) = Tr(a) (recalled lemma used to type N-CONVL targets)"
      status: verified exhaustively for the archived curve and for 2 of the N-CONVL curves (halving-check.json); for the other N-CONVL curves the typing rests on the lemma
