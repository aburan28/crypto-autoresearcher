# J9 (b) -- SATURATION DERIVATION AND DECLARED PREDICTION RULE (TASK-20260926-c58e87).
# Written and hashed (ORDER.log) BEFORE any per-arm M_4 record of N-CONV, N-CONVL or
# N-CONV17 in RUN-CERTBIN-6ebb0e was opened (RT-2 step 2). No file of
# experiments/EXP-CERTBIN-ddfe75/runs/ has been opened at this point.
#
# DISCLOSED PRIOR KNOWLEDGE (RT-9, PD-R1): the task card's objective and the review plan
# state the QUALITATIVE observation that "the N-CONV control is refuted already at M_4 where
# S_3 itself needs W_4 at the same targets" (implementation.md bullet 1, not opened). So
# this rule is NOT blind to the direction of the N-CONV outcome; it is blind to every count,
# every fall profile, every N-CONVL and N-CONV17 outcome and every satisfiable-control
# profile. The per-record parts of the rule (fallen = 988, rank = 2683, fallen = 988 - s on
# controls, the N-CONVL and N-CONV17 predictions) are the parts that can fail.
#
# Inputs used (internal): H-CERTBIN-be6cbd mechanism (L-TOP), the RC-1 red-team
# j7-mechanism/fill.json (M_4 fall profiles of 92 S_3 systems: U62 62, C20 20, S10 10;
# RC-1 archive, not this run), j8-nulls/syzygy.json (153 trivial syzygies built and
# independent), and my own counting j9-null/j9b-counting.json (P from the quadratic part
# alone, own code, for all 144 RC-1 x_R and for N-CONV17's Q).
j9b_derivation:
  quantities:
    rows_M4: 2924            # 17 * (1 + 18 + 153)
    dim_B_le3: 988           # 1 + 18 + 153 + 816
    trivial_syzygies: 153    # C(17,2) Koszul + 17 field (f_k (f_k + 1) = 0); built and independent in RC-1 J8
    P_S3: 1695               # own count, 144/144 RC-1 x_R (U62, S62, C20); equals the RC-1 value 92/92
    P_NCONV17: 1695          # own count, Q_k with T = identity
    dim_Z_top: 1229          # 2924 - 1695 (L-TOP (iii))
    Z_top_minus_trivial: 1076

  step_1_forced_syzygies:
    claim: For EVERY lower part (l, b) with S_3's quadratic part (and for every N-CONV17 system), dim K >= 1229 - 988 = 241, i.e. at least 241 - 153 = 88 non-trivial syzygies.
    proof: >-
      fallen = dim Z_top - dim K (L-TOP (iii), verified in j11-ladder/proof-verdicts.yaml)
      and fallen = dim(rowspace M_4 cap B_{<=3}) <= 988. So dim K >= 241. The trivial
      syzygies span at most 153 dimensions of K, so at least 88 dimensions of K are
      non-trivial. This does not need the 153 to be independent.
    rt5_status: verified
    plan_framing_item: "(2924 - P) - 153 > 988 (review-plan J9 (b))"
    plan_framing_status: verified (1076 > 988, excess 88)

  step_2_what_counting_cannot_force:
    claim: Counting does NOT force saturation (fallen = 988) or M_4 refutation for any lower part.
    argument: >-
      The fall map Phi_{l,b}: Z_top -> B_{<=3}, z -> z M_4, is a linear map from a
      1229-dimensional space (1076 modulo the trivial syzygies) into a 988-dimensional
      one. Dimension counting bounds its KERNEL from below (step 1) and says nothing about
      its IMAGE beyond <= 988. "1 in rowspace(M_4)" is a statement about the image.
    counterexample_from_archive: >-
      S_3's own lower part, which shares Z_top: on all 92 RC-1 S_3 systems in
      fill.json the fallen dimension is 964-979, codim 9-24 in B_{<=3}; i.e. 9-24
      non-trivial syzygies BEYOND the forced 88 (non-trivial = 88 + codim, exact
      identity). This includes the 20 C20 systems that M_4 DOES refute (codim 9-15)
      and the 10 satisfiable S10 systems (codim 10-13 > s in {2, 4}).
      Observed by-degree fact, 92/92: codim in B_{<=3} = codim in B_{<=2} + 1.
    rt5_status: >-
      "Counting forces M_4 refutation for every lower part": refuted (S_3 itself, 92/92).
    consequence_for_S3: >-
      S_3's M_4 refutations (C20 and, by Stage-1, 324/386 of x(2E) targets) do NOT go
      through saturation. The saturation mechanism is not how S_3 is refuted at M_4.

  step_3_random_fall_map_heuristic:
    name: R-ED (expected-dimension rule; a random-model heuristic, NOT a derivation)
    statement: >-
      For a lower part drawn UNIFORMLY on S_L, model Phi_{l,b} modulo the trivial
      syzygies as a uniformly random F_2-linear map F_2^1076 -> F_2^988 restricted only
      by soundness. Then fallen = min(dim Z_top - 153, 988 - s*) with s* = s for
      satisfiable systems with 1 <= s <= 15 (the evaluation map B_{<=3} -> F_2^S is onto
      for |S| <= 15, Reed-Muller bound verified in RC-1 J9 O1, so I cap B_{<=3} has
      codimension exactly s) and s* = 0 for unsatisfiable systems.
      For a uniform map the probability of a non-surjective image is <= 2^{988-1076} =
      2^-88 (union bound over the 2^988 functionals).
    transfer_status: >-
      UNCHECKED and NOT justified by counting: Phi_{l,b} is affine in the |S_L| = 317
      drawn bits with a fixed q-part, so it ranges over at most 2^317 maps and is not
      uniform. The 2^-88 figure is the model's, not the object's. Declared here as a
      heuristic so that the N-CONV records can test its transfer.
    null_consistency: >-
      For the same-support nulls (P = 2448: dim Z_top - 153 = 323 < 988) R-ED gives
      fallen = 323, no non-trivial syzygy and no M_4 refutation. Archived: exactly
      [0, 0, 17, 323, 2771] on 124/124 (RC-1 J8). Consistent. (This is consistency with
      data read before the rule, not a test of it.)

  O3_application:
    object: S_3 itself at every U62 x_R at M_4 (known false by the definition of U62)
    R-ED_applied_unchanged: >-
      R-ED applied to S_3's own lower part as if it were a uniform draw predicts
      fallen = 988 and 1 in rowspace(M_4) on 62/62 U62. That is FALSE on 62/62 (by the
      definition of U62) and the fallen prediction is also false on the C20 and S10
      systems (92/92). R-ED therefore PROVES TOO MUCH if stated for every lower part.
    exemption: >-
      R-ED is declared ONLY for lower parts drawn uniformly on S_L. The property that
      exempts S_3 is NAMED, not derived (hypothesis H-EX): S_3's lower part is
      STRUCTURED. (i) It is invariant under the swap sigma: v_j <-> v_{9+j}
      (x_1 <-> x_2), as is the kept quadratic part. (ii) Its linear part
      x_R^2 (x_1 + x_2)^2 lies in the 9-dimensional span of the sigma-invariant forms
      v_j + v_{9+j}, not in the 18-dimensional space a uniform draw fills. (iii) It is the
      descent of a polynomial of degree 2 over F_{2^17} in (x_1, x_2), so the whole
      S_3 is a K-polynomial of low degree (4) in (x_1, x_2), whereas a uniform linear
      part is a random linearized polynomial of high 2-degree. H-EX: this structure
      lifts 9-24 top-degree cancellations beyond the forced 88 to exact syzygies
      (measured 92/92), so S_3 is never saturated at M_4. A uniform draw has property
      (i)/(ii) with probability about 2^-150 or less.
    what_the_argument_does_not_explain: >-
      Why, among non-saturated S_3 systems, 1 is in the fallen space for C20 (and 84% of
      Stage-1 x(2E) targets) and not for U62. The counting is silent on that split.
    O3_verdict: >-
      The J9 (b) argument, AS A DERIVATION, fails O3 (proves too much). As the scoped
      heuristic R-ED plus the named exemption H-EX it does not predict M_4 refutation on
      U62, but the exemption is a named hypothesis, not a consequence of the counting.
      So the argument may be used to READ N-CONV only if N-CONV's own fall profiles show
      R-ED's per-record signature (below). It cannot be used to explain S_3's U62 set.

  declared_prediction_rule:
    for_arms_with_uniform_lower_part:
      arms: [N-CONV (P = 1695 at every slot, by L-TOP), N-CONV17 (P = 1695)]
      unsatisfiable_system: >-
        M_4 record: one = true; fallen = dims_by_deg[3] = 988; dims_by_deg =
        [1, 19, 172, 988, 2683]; rank M_4 = 1695 + 988 = 2683; P = 1695; non-trivial
        syzygies exactly 88. W_4 then refutes at iteration 0 (one_first_iteration = 0).
      satisfiable_control_with_s_le_15: >-
        fallen = 988 - s; rank M_4 = 2683 - s; no refutation.
      arm_level_reading_threshold: >-
        R-ED HOLDS on an arm iff >= 90% of its unsatisfiable systems have one = true
        with fallen = 988 AND >= 90% of its satisfiable controls with s <= 15 have
        fallen = 988 - s. R-ED FAILS on an arm iff <= 50% of its unsatisfiable systems
        are refuted by M_4. PARTIAL otherwise.
      stratification_prediction: >-
        Under R-ED the N-CONV M_4 outcome does not depend on the slot's source set
        (U62, S62, C20): P is 1695 at every slot and the lower part is drawn afresh.
        Declared: no stratum differs from another by more than CP95 overlap.
    for_NCONVL:
      R-ED: NOT APPLICABLE (the linear part is S_3's own; only the constant is drawn on S_L cap column 0)
      H-EX_prediction: >-
        N-CONVL keeps properties (i)-(iii). If H-EX locates the exemption in (q, l),
        N-CONVL is S_3-like: fallen < 988 (codim >= 1, expected about 9-24) on >= 90%
        of its systems, and its M_4 refutation rate lies strictly between 0.5 and 0.9
        (the Stage-1 S_3 rates are 0.845 on x(2E), 0.60 on x(E) minus x(2E) and 0.66 on
        the twist, KN-OPEN-3c8f51; N-CONVL's x_R are generally not x(2E) targets of the
        drawn curve), and strictly below N-CONV's rate.
      H-EX_refuted_if: >-
        fallen = 988 on >= 50% of the N-CONVL unsatisfiable systems. The exemption then
        needs S_3's own constant B (or the x(2E) relation between x_R and the curve), not
        the structured linear part.
    for_S3_arms_in_the_run: >-
      S3-U62, S3-C20, S3-S62 M_4 records must reproduce the RC-1 values (P = 1695,
      fallen 964-979, one false on U62, true on C20). This is regression (C-REG), not a
      prediction.

  plan_framing_rt5:
    - item: "(b) the supply of top-degree cancellations may exceed dim B_{<=3}"
      status: verified (1076 > 988 after the trivial syzygies)
    - item: "(b) non-trivial syzygies forced by dimension for every lower part"
      status: verified (>= 88)
    - item: "(b) a generic lower part may be expected to fill almost all of B_{<=3} at degree 4 and so to refute an unsatisfiable system at M_4 already"
      status: >-
        unchecked as a derivation (it is the random-model heuristic R-ED, not a
        consequence of the count); refuted as a statement about every lower part
        (S_3, 92/92). Its transfer to uniform draws is tested below, after this rule.
    - item: "If (b) holds, S_3's own lower part is the SPECIAL one (it lifts more top syzygies to true syzygies)"
      status: verified as a measured fact on 92/92 archived S_3 systems (9-24 beyond the forced 88), independently of N-CONV
    - item: "S_3's own lower part is what keeps M_4 from refuting on U62"
      status: >-
        refuted as an explanation of the U62 / C20 split: the C20 systems are refuted
        at M_4 WITH the same non-saturation (codim 9-15). Non-saturation is necessary
        for M_4 non-refutation, not sufficient. The narrow form that survives: S_3's
        lower part is associated with non-saturation on every archived S_3 system, and
        U62 is where 1 falls outside the non-saturated fallen space.
