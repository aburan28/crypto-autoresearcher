  # ---------------------------------------------------------------------------
  objections:
    - id: OBJ-1
      joint: J9
      text: >-
        N-CONV cannot discriminate the S_3-specific W_4 behaviour. The forced-syzygy
        count (+88; +71 with the ell-syzygies) plus the random-fall-map transfer,
        declared before the records were read and confirmed per record, puts
        uniform-lower-part draws at the M_4 ceiling (144/144; fallen 988 on 142/144).
        NC-DR-6's conditional W_4 rate is 0/0. Any reading of NC-DR-1/NC-DR-2 as
        "N-CONV reproduces S_3's W_4 behaviour" is unsupported: N-CONV never needs W^(1),
        whereas S_3 does on U62.
    - id: OBJ-2
      joint: J9
      text: >-
        E-LINEAR was the wrong-direction competitor for the motivating phenomenon. At
        M_4 the S_3 lower part DELAYS refutation (324/386 against 144/144; N-CONVL
        105/144). The frozen falsification of E-LINEAR licenses only "S_3's lower part
        is not necessary for degree-4 refutation relative to uniform bits on S_L".
    - id: OBJ-3
      joint: J9, J10 (O3)
      text: >-
        The review-plan prior "S_3's own lower part is what keeps M_4 from refuting on
        U62" is refuted as an explanation of the U62/C20 split. S_3 is unsaturated on
        386/386 Stage-1 unsatisfiable targets, fallen 972-979 on the 324 that ARE
        refuted, and no count separates U62 from C20. Surviving narrow form: relative to
        a uniform lower part on the polynomial basis, S_3's pair prevents saturation, and
        saturation's absence is the precondition for needing W_4.
    - id: OBJ-4
      joint: J10 (O4), J12
      text: >-
        "Convolution tensor" is too specific at W_4. Over one random V' (same field,
        curve, targets, l, keep rule and lower-part law), W_4 refutes 20/20 draws and
        5/5 unsatisfiable S_3 descents at iteration 1, exactly as S3-U62. Only the M_4
        refutation is polynomial-basis-specific: P 1695 against 1904, i.e. saturation
        forced against saturation impossible (fallen <= 850 rigorously).
    - id: OBJ-5
      joint: J11
      text: >-
        H-CERTBIN-be6cbd's description of the T4 proof ("uses only ... ring homomorphism
        with kernel ell*B") omits degree non-increase, the identity on B' and ell in
        span{f_k}. The conclusion stands for every affine one-variable substitution from
        a linear ell in the span. Documentation defect.
    - id: OBJ-6
      joint: J12
      text: >-
        NC-DR-7's positive half ("quote S_3-specificity against an N-CONV-type arm" at
        n = 19) carries an implicit transfer. At n = 19 the counting margin is -16 with
        the ell-syzygies (+3 without), so an N-CONV19-type arm is NOT predicted to hit the
        M_4 ceiling. By the O4 analogy it is predicted to hit the W_4 ceiling at
        iteration 1. Its W_4 rate alone would not discriminate.
    - id: OBJ-7
      joint: J10 (O1)
      text: >-
        On N-ELL144's satisfiable controls C-PS, an inequality, has 880-885 dimensions of
        slack (codim 886, s <= 6). It detects only a refutation, or more than about 880
        spurious dimensions; it cannot detect a small unsoundness or an under-complete
        closure there. T5 exactness (W_4 = [0, 1, 34, 442, 3162] on 308/308) is the
        check that binds, and it held. Instrument observation, not a defect.
    - id: OBJ-8
      joint: J9 (a)
      text: >-
        The in-run "S_3 (82)" M_4 rate 20/82 (cell-summary; NC-DR-6 per_arm_M4) is a
        composition of 62 systems selected for M_4 failure and 20 chosen successes. It is
        not a rate and must never be set against N-CONV. The frozen NC-DR-6 label
        correctly uses the Stage-1 interval instead.
    - id: OBJ-9
      joint: J12 (iv)
      text: >-
        implementation.md "Unexpected observations" bullet 2 pools the two roles in
        "rank M_4 is 2677-2683 and fallen is 982-988". Unsatisfiable draws alone are
        2682-2683 / 987-988; satisfiable ones are 988 - s. Reading imprecision only.

  required_controls:
    - id: RC-1
      text: >-
        Before approving the n = 19 design (DEC-20260924-e61f3b NA-3), compute for ITS
        modulus and V: P from the quadratic part, the independent ell-syzygy count, and
        the saturation margin (seconds, no trial). Pre-register R-ED's per-record
        predictions (fallen, rank, one) for every uniform-lower-part arm.
    - id: RC-2
      text: >-
        Read every arm on one_first_iteration and on the M_4 fall profile (fallen and
        excess codimension codim - s), not only on the W_4 rate. This is the separator
        the frozen primary lacks (review-plan observation_collision).
    - id: RC-3
      text: >-
        A sigma-symmetric uniform-lower-part control (linear part uniform on
        span{v_j + v_{9+j}}, constant uniform on S_L cap column 0), at n = 17 on the
        archived x_R and at n = 19. It is the cheapest separator of the two named
        exemption properties (symmetry against the Frobenius-compatible linear part).
    - id: RC-4
      text: >-
        Before "convolution tensor" is quoted at W_4 as basis-specific: an
        N-CONV17-type (cokernel-free) arm over random V', and at least two further random
        V'. O4 is one basis and 20 slots.
    - id: RC-5
      text: >-
        Keep an N-CONVL-type arm at n = 19, typed by target class (x(2E) of the drawn
        curve iff Tr(b'/x_R^2) = Tr(B/x_R^2) when Tr(x_R) = Tr(A)). At n = 17 it is the
        arm that reproduces S_3's M_4 behaviour per type.

  counterexample_or_mutation: >-
    Basis mutation (O4): polynomial basis -> one random 9-dimensional V', with everything
    else fixed. It removes M_4 refutation (0/25; P' = 1904, fallen <= 850 rigorously)
    and keeps W_4 refutation (25/25 at iteration 1). This separates the two phenomena the
    frozen primary conflates. Counterexample to "counting forces saturation for every
    lower part": S_3's own lower part (386/386 unsaturated Stage-1 unsatisfiable systems).
    Lower-part mutation: uniform -> S_3's linear part with a drawn constant (N-CONVL). It
    restores non-saturation (288/288) and S_3's per-type M_4 rates.

  baseline_comparison: >-
    No cost claim is made and none is supported. Per attempt at m = 2, oracle A (2^9 = 512
    quadratic root-findings over V) decides satisfiability and returns the solutions. It
    dominates M_4 (2924 x 4048) and W_4 (about 0.14 s per O4 system for M_4 + W_4 on the
    native engine). For the DLP at q = 32603: parallel Pollard rho takes about
    sqrt(pi q / 4), roughly 160 group operations; BSGS about 2 sqrt(q), roughly 361
    operations with memory about 181. sota_delta is zero on time, memory and data.
    dominated_by as stated in the specification was checked on time and memory against
    oracle A, Pollard rho and BSGS. There is no data/queries axis. FES and WDSat were not
    compared (as disclosed there).

  heuristic_challenges:
    - >-
      R-ED (random fall map) is a heuristic and its transfer is qualitative only. Its own
      figure, a non-surjective image with probability <= 2^-88, is not the object's:
      2/144 N-CONV and 4/144 N-CONV17 unsatisfiable draws miss saturation by one
      dimension (about 2-3%), and one (N-CONV17:83) is not refuted at M_4. On O4 its
      point prediction (fallen 850) missed by a further 17-dimensional syzygy family,
      identical on 60/60. The cheapest exposing computation: the ell-syzygy / extra
      syzygy count of the quadratic part, by explicit vectors, before any closure.
    - >-
      H-EX, the exemption of S_3's structured lower part, is NAMED and not derived.
      N-CONVL supports its locus: it lives in the quadratic-plus-linear pair, not in B.
      It does not separate sigma-symmetry from Frobenius-compatibility (RC-3). Over V'
      there is no S_3-specific excess: S_3 descents and uniform draws have identical M_4
      profiles on 60/60.
    - >-
      The random-model transfer to structured objects fails in the direction RC-1 found
      for the semi-regular model, now at M_4: structured S_3 pairs are LESS saturated than
      the generic model predicts (excess codim 3-32 on 736/736), generic draws more.
    - >-
      H-CERTBIN-be6cbd heuristic_assumptions is empty. That is correct for C-T. The
      semicontinuity sentence under WHY C-T ("a generic lower part should lift no more
      [top syzygies] to true syzygies than S_3's does") is an unnumbered heuristic. Its
      direction held (dim K 241-242 against 250-265).

  cost_model_challenges:
    - None claimed. The measured closures are seconds-cheap here, and per attempt they are dominated by oracle A. m >= 3 and the chained regime are unmeasured.

  reduction_and_scope_challenges:
    - "Scope: n = 17, V = polynomial basis (plus ONE random V' in O4, 20 slots), one curve, x(2E) targets (N-CONVL: x(2E) or twist targets of the drawn curves), D <= 4, M_4 and W_4 only. Not F4, not Semaev's Assumption 1."
    - "The lower-part law is uniform on S_L, whose constant positions are the 11 set bits of B. The 'curve constant' axis therefore covers only b' with support in supp(B) (2^11 - 2 values), not all curves with this A."
    - "Nothing transfers to n = 19 without measurement. The counting margin predicts that the n = 17 M_4 ceiling does NOT transfer (J12)."
    - "No reduction or corollary is claimed, and none is instantiated."

  proof_architecture_challenges:
    - {attack: observation-fiber, result: "'1 in W_4' collides for W^(0) and W^(1) refutations. The separator (one_first_iteration, M_4 fall profile) shows N-CONV entirely at W^(0) and S3-U62, N-CONVL-39 and O4-25 at W^(1)"}
    - {attack: quantifier-order, result: "U62/C20 are conditioned on S_3's M_4 outcome, N-CONV draws are unconditional; the selection accounts for about 84 of the 100 points at U62 slots, and the rest is a lower-part effect"}
    - {attack: boundary-and-strictness, result: "S_3's own lower part is excluded from the N-CONV draw (identity rejection). No draw was identity; S_3 sits outside the saturated class (386/386)"}
    - {attack: method-ceiling, result: "W_4 at D = 4 is at the ceiling for every arm with the quadratic part (and for O4), so the frozen primary cannot rank them; M_4 can"}
    - {attack: nearby-object, result: "O4 random V': M_4 0/25, W_4 25/25 (iteration 1), sat codim = s 35/35"}
    - {attack: compositional-invariant, result: "L-TOP's Z_top is fixed by q; deleting S_3's structured linear part (N-CONV) saturates M_4, and restoring it (N-CONVL) removes saturation. The invariant 'excess codim >= 3' tracks the (q, l) pair"}

