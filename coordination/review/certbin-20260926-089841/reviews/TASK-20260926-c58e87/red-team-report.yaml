        - "Declared rule R-ED and exemption H-EX, before data (j9-null/j9b-saturation-derivation.yaml; sha256 1415fd77...52e1 in ORDER.log)"
        - "Post-data rule check, selection, ceiling, strata, nulls, support class (j9-null/j9-analysis.json, j9-findings.yaml)"
