    J11:
      verdict: holds
      summary: >-
        Written BEFORE any computation (ORDER.log STEP-1). L-TOP (i)-(iii) is
        verified line by line. The generalized T4 is verified, dense ell included:
        density enters only through pi(mu) and pi(v_{j*}) being sums of monomials, which
