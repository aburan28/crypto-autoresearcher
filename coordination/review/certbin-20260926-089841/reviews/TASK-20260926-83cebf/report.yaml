      wdag-v1 for each one refuted), and Q2, Q3, Q4 and Q5 on all 55 pool systems
      BS-001..BS-055. The optional items were also computed: Q1 on the 144 kept
      satisfiable systems, and Q0-opt (the first 10 slots of N-CONVL, N-CONV17 and
      N-ELL144). rederivation.json missing_items is empty.
