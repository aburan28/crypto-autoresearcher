      self_tests), before any draw was made.
    - >-
      Every reading I had to choose is recorded: 23 entries, AMB-01..AMB-23,
      in rederivation.json ambiguities and code/br_ambiguities.py. They were written
      before the real pass, and the file's sha256 is in rederivation.json code_sha256.
      None of them is unresolvable. The load-bearing one is AMB-01 (numpy default
      dtype for the draw call), which I took literally. Every other reading
      either gives the same result under each alternative (AMB-04, AMB-05, AMB-06)
      or affects only presentation or optional items.
    - >-
      I found no load-bearing clause that is self-contradictory. Facts the
      specifications assert about the construction came out as stated in my own
      build: the Coordinator reading of U_k, the parts of E_S3, and the fixture
