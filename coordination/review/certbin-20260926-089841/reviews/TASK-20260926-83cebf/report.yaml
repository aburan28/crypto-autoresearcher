      accepts, and none is "refuted, unwitnessed". rederivation.json certificates
      and Q4 have the details.

  # ---------------------------------------------------------------------------
  method:
    implementation: >-
      Written from the statement alone, in Python 3.11.15 with numpy 2.4.6. It
      imports no repository module (code/ imports only its own br_* modules, the
      standard library and numpy; checked by grep). Modules:
      br_field (F_2^17, scalar and vectorized arithmetic, trace, half-trace);
      br_curve (affine group law of Y^2 + XY = X^3 + AX^2 + B, and S_3);
      br_system (E_layout, E_S3 by algebraic expansion, a second E_S3 route by
      direct evaluation plus Moebius transform, the union support U, S_L, hex
      encodings); br_macaulay (M_D rows and columns in the stated orders, and
      multiplication by v_j); br_linalg (bit-packed F_2 Gauss-Jordan and
      reduction against an RREF); br_closure (M_D statistics, the literal W_D
      iteration, witness extraction); br_sat (exhaustive s over 2^18, oracle A
      root-finding, direct S_3 over V x V); br_draws (the arm replays);
      br_rcb (rc_b steps 1-5); br_wdag_check (an independent wdag-v1 checker:
      sets of monomial bitmasks, no shared arithmetic with the engine);
      br_selftest (BR-2); br_ambiguities; driver.py.
    elimination: >-
      Bit-packed dense Gauss-Jordan over F_2 (my own code). Columns are taken in
      increasing index of the Macaulay column order (descending degrevlex,
      constant last). The pivot is the unused row of smallest index with a 1 in
      the column; rows never move. dims_by_deg(X)[d] is the number of echelon rows
      whose leading monomial has degree <= d; this is valid for a
      degree-descending order. "1 in X" holds iff the constant (last) column is a
      pivot. P is computed two ways: rank M_4 - dims_by_deg(M_4)[3], and the rank
      of the degree-4 column block alone. The two agree on every system (asserted).
      Full statement: rederivation.json elimination_method.
    W_4: >-
      The literal rule (BR-5): W^(0) = rowspace(M_4), and W^(i+1) = W^(i) +
      span{v_j * b}, where b runs over ALL RREF rows of W^(i) whose leading
      monomial has degree <= 3, at every iteration, for j = 0..17. The iteration
      stops at the first i with dim W^(i+1) = dim W^(i). Every dim W^(i) is
      recorded, and so is the fallen-basis size multiplied at each iteration.
    witnesses: >-
      A refutation first reached at iteration i is decomposed by the level at
      which each target first lies, as y = w + sum_j v_j g_j, with w in W^(L-1)
      and g_j in W^(L-1) cap B_{<=3}. Each g_j becomes a child node (degree
      <= 3). The rows and prods of w are inlined into the parent (AMB-20).
      Level 0 is expressed as M_4 rows through a tracked RREF. An M_4 refutation
      is a one-node wdag with rows only. Every record in wcerts.jsonl.gz was
      re-read from the file and checked against rules (a)-(e), with f_k rebuilt
      from the pool's own monomial lists or from the replay log's row hex.
    satisfiability: >-
      s comes from exhaustive evaluation at all 2^18 assignments with bit-sliced
      monomial tables, for every drawn system of Q0 and Q0-opt and every pool
      system. For pool systems that equal my E_S3(x_R) at a slot, s is also
      counted by oracle A (for each x_1 in V, the quadratic in x_2 solved by the
      half-trace, degenerate cases included) and by direct S_3 evaluation over
      V x V. Neither of those routes touches the descended equations.
      Supplementary and labelled: oracle A with the system's own constant b'
      wherever the quadratic and linear parts equal E_S3 at a slot but the
      constant differs.
    soundness_instruments: >-
      These are extra and not required. On every satisfiable system computed
      here (the Q1 optional systems and the satisfiable pool systems), every M_4
      row, and for the pool every final W_4 basis row, was evaluated at every
      solution, and codim(W_4) >= s was checked. rederivation.json
      soundness_summary lists no refutation of a satisfiable system and no
      vanishing failure.
    derived_extras_not_required: >-
      Q5 carries T5_applicable, final_dim(W_4) - rank R'_4 and
      one(W_4) == one(R'_4) where substituted. All three are computed from my own
      values only.

  # ---------------------------------------------------------------------------
  self_tests:
    seeds: 'own seeds 8638143101..8638143108 and 8638144104 (code/br_selftest.py SEEDS); no specification seed used'
    ran_before_any_draw: true
    all_pass: true
    results:
      irreducibility: >-
        pass. t^{2^17} = t mod f; gcd(t^{2^i} - t, f) = 1 for i = 1..8; and
        trial division finds no factor of degree 1..8.
      field_axioms_and_root_finding: >-
        pass. 2000 random triples (associativity, distributivity, commutativity,
        inverses). Vectorized multiplication agrees with scalar on 500 pairs.
        Half-trace root finding was checked on 2000 quadratics.
      S3_against_point_addition: >-
        pass. On 300 random point pairs of E(A = 97044, B = 126251),
        S_3(x(P1), x(P2), x(P1 + P2)) = 0 and S_3(x(P1), x(P2), x(P1 - P2)) = 0.
        All points are on the curve, and 50 doublings land on the curve. A random
        third x gives S_3 != 0 in 300 of 300 cases, so the test is not vacuous.
      descended_equations_against_direct_evaluation: >-
        pass. On 300 random (v, x_R), the descended equations equal the bits of
        S_3 evaluated directly in F_2^17. On 3 further x_R, the full ANF from
        direct evaluation of all 2^18 points (Moebius transform) equals E_S3
        exactly, has degree <= 2, and uses only bilinear, linear and constant
        columns.
      macaulay_rows_against_naive_multiply: 'pass. 40 random rows (S_3 and dense random systems) against a naive set-based multiplication.'
      fixture_dimensions: 'pass. From my own construction: M_3 323 x 988, M_4 2924 x 4048, R''_3 306 x 834, R''_4 2618 x 3214.'
      literal_W_against_brute_force_fixpoint: >-
        pass. 11 random small Boolean systems (6 variables, D = 3, seed
        8638143104), 3 of which reach the fixpoint at iteration index >= 2. The
        literal W_D equals a brute-force naive closure on every system (same
        dimension and containment). The brute force uses separate Python-int
        arithmetic and spans W cap B_{<=2} by a kernel computation instead of RREF
        leading degrees. Every W_D element vanishes on the common zeros.
      literal_W_deep_refutations_and_witnesses_nv8_D3: >-
        pass. 228 random systems (8 variables, D = 3, seed 8638144104). All equal
        the brute-force fixpoint. 13 are refuted, 2 of them first at iteration 2,
        and all 13 witnesses (up to 14 nodes) pass the checker. This test was
        added to exercise multi-level witnesses; BR-2 does not require it.
      substitution_against_direct_evaluation: 'pass. 150 cases on 15 systems: pi(f_k)(u'') = f_k(u) for u extending u'' through ell = 0, and ell(u) = 0.'
      exhaustive_s_routes: >-
        pass. On 6 S_3 systems at random x_R, the bit-sliced exhaustive count, a
        second unpacked exhaustive implementation, oracle A and direct V x V
        evaluation all agree, and every listed solution satisfies every equation
        pointwise. Bit-sliced and unpacked also agree on 3 random systems.
      wdag_checker_positive_and_negative: >-
        pass. The checker accepts a valid multi-node W_4 witness and a valid
        one-node M_4 witness on 18-variable systems. It rejects corrupted
        witnesses for each rule: (a) ids reversed; (b) a |mu| = 3 row added twice
        (sum unchanged) and k = 17; (c) a degree-4 child used twice in prods (sum
        unchanged); (d) a degree-5 node, via a |mu| = 3 row and via v_17 times a
        degree-4 child; (e) one row removed, the output pointing at a child, one k
        changed, and a witness checked against another system. Rule (d) cannot be
        violated alone at D = 4 for quadratic f_k, because (b) and (c) imply (d);
        the checker reports (d) among the failed rules in both (d) cases.

