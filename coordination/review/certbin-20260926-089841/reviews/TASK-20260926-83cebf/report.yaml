  # ---------------------------------------------------------------------------
  j7_verdict: holds
  j7_basis:
    - >-
      Every required quantity was computed from the statement: Q0 (the U and S_L
      construction and the N-CONV stream replay over all 144 slots of the blind
      "slots" table: every attempt, both kept systems per slot, and s of each), Q1
