  composition:
    rule: >-
      The Coordinator composes the verdicts in /review-evidence. No reviewer
      votes on the whole claim.
      - The run is ADMISSIBLE for interpretation iff J1, J2 and J7 hold (J7 on
        J6's output).
      - The mechanical verdicts stand as recorded iff J3 also holds.
      - J4 and J8 decide how the verdicts are READ in the evidence record, and
        J5 decides whether the instability readings can be trusted at all.
      - A break of J1, J2, J5 or J7 attributable to the producer returns the run
        to the executor as an implementation failure (INV-8). It is never
        evidence about H-CERTBIN-a73f1c.
      - `inconclusive` on an admissibility joint (J1, J2, J7) holds the
        decision at `inconclusive`. The decision is not composed around the
        gap.
    checker: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/certbin-20260923-c51f07/review-plan.yaml --reports
      coordination/review/certbin-20260923-c51f07/reviews
      must PASS before composition. Then run
      python3 tools/check_review_independence.py --blind-history HEAD
      --protected-from coordination/review/certbin-20260923-c51f07/blind-phase-hygiene.yaml.
      Record both outputs in the TASK-20260923-918a6d receipt.

  procedure_deviations:
    - id: PD-R1
      text: >-
        POST-DATA REVIEW PRIOR. The coordinator_prior above was written after
        this Coordinator read the run's results (manifest result block,
        run-report.md, implementation.md). The pre-data prior is the
        specification's coordinator_prior (a)-(g). This is disclosed to every
        non-blind reviewer. The blind re-deriver reads neither.
    - id: PD-R2
      text: >-
        EXTRACTED INSTANCE INPUTS, NOT SEED REGENERATION. The specification's
        claim_tier_and_review asks for a re-derivation "without reading impl/
        or any run output". The re-deriver instead receives the instance
        INPUTS (curve A, B and x_R values) extracted from the run package by
        TASK-20260923-e3b590. It receives no outcome of any kind: no s, arm,
        rank, trace, flag or metric. The reason is that seed regeneration
        depends on numpy's Generator stream behaviour (numpy 2.4.6) and on the
        executor's sampling interpretations I-1..I-5, so instance-level
        agreement could fail for non-mathematical reasons. The cost is that J6
        does not test the sampling layer (curve acceptance, reference scan,
        target draw). That layer is audited, not re-derived, under J2, and
        optional Q7 partly probes it. This departs from the letter of the
        spec's review clause, not from its intent.
    - id: PD-R3
      text: >-
        SAME MODEL FAMILY. The executor ran on claude-opus-5-5, and unless the
        dispatcher can serve TASK-20260923-7a2cd4 from a different model
        family, so will the re-deriver. J6 is then independent of the
        IMPLEMENTATION but not of one model's reading of the specification. A
        shared misreading of an ambiguous clause would agree. The re-deriver is
        therefore required to list every spec ambiguity it resolved.
    - id: PD-R4
      text: >-
        RE-DERIVATION SCOPE. The re-derivation covers 5 references and 100 F-S3
        targets, at D = 4 only. D = 3, F-S3-REV, F-PLANT, F-RANDX and the
        null families are not blind re-derived. They are covered by J1 (same
        code path), J2 and J3.
    - id: PD-R5
      text: >-
        COMPARISON AS A SEPARATE TASK. J6 and J7 are split so that no path in
        blind_from is ever read by the re-deriver. Blindness is lifted for
        TASK-20260923-5f9b82 only, as stated under blindness.
