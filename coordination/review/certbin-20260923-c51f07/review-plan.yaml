  tier_ruling:
    policy: review-adversarial
    basis: >-
      No record claims a break, moves an exponent or touches a deployed curve.
      The claim tier is toy. The specification's claim_tier_and_review expects no
      escalation. This round decides whether the run is admissible and what its
      mechanical verdicts license.
    tripwire: >-
      THIS ROUND IS NOT SUFFICIENT FOR A CLOSURE. Suppose the evidence decision
      would record `reject_scoped`, or close any lane with an obstruction block.
      For example, strict replay or T_set replay might be recorded as closed
      for P-GPU. Then that closure first needs a `review-breakthrough` round at
      `max` (AGENTS.md rule 12) and replication. A single unreplicated run
      supports at most `weaken` (coordinator contract;
      docs/claims-and-verification.md). The tripwire is recorded here so that
      nobody discovers it after composition.

  claim_under_review: >-
    As the PRODUCER states it, in RUN-CERTBIN-3b7e05's run-report.md and
    manifest.yaml. We do not restate it:
    (i) the run is `completed_valid`, no invalidation rule fired and no metric
        was voided, and every instrument check C-FIX, C-SELF, C-ORACLE, C-WIT,
        C-AFF, C-DET, C-PASS, C-PROPS, C-UNIF, plus NESTING, HASH_CONTENT,
        REF_SELF_REPLAY, C-REV and C-NULLS, passes;
    (ii) the mechanical decision-rule verdicts at F-S3, D = 4, in the
         granularities the report names:
         - DR-1 "STRICT P-GPU FALSIFIED at this cell";
         - DR-2 "between";
         - DR-3 "E2 FALSIFIED";
         - DR-4 "not supported, not falsified";
         - DR-5 "not applicable";
         - DR-6 "one system per SM FAILS; thousands per warp FAILS";
         - DR-7 "strict replay not closed; T_set replay not closed";
    (iii) the P1-P9 outcomes, the PS2 vacuity table, and the "Coordinator
          prior (a)-(g) against the data" table of run-report.md, which marks
          parts (d), (e) and (f) OVERTURNED;
    (iv) the unexpected observations in implementation.md.
    Claim tier: toy. The scope is one curve, n = 17, m = 2, l = 9 and
    D in {3, 4}, with the declared solver.

  coordinator_prior: >-
    READ PD-R1 FIRST. This prior was written AFTER this Coordinator had read the
    run's manifest result block, run-report.md and implementation.md. It is a
    commitment made before any REVIEW report exists, but not before the DATA.
    The pre-data prior is the specification's coordinator_prior (a)-(g). A
    reviewer's concurrence with what follows is therefore weaker evidence than
    concurrence with a pre-data prior. That is disclosed so that you can
    weigh it, not so that you compensate.

    Per joint:
    J1 (object fidelity): I expect it to hold. If it breaks, I expect the break
    in one of two places. The first is the degrevlex tie-break direction ("at
    the largest variable index where they differ, a does NOT contain v_i"). The
    second is the pivot rule's "1 in column c of the CURRENT matrix" being read
    against the original matrix. Both errors are self-consistent. C-PASS and
    C-DET cannot see them. They would change T_strict, T_set and Z_D, but not
    rank_D or "1 in R_D", which are invariant under column permutation.
    J2 (instrument integrity): I expect it to hold, with one finding I am fairly
    sure of. PS0 is vacuous on unsatisfiable instances, which have no
    solutions, so no C-PROPS item guards the ROW CONTENT on the unsatisfiable
    arm. That arm carries the prior-overturning "1 in R_4" observation, and
    only C-SELF's 50-row construction check and the blind re-derivation guard
    it.
    J3 (recomputation and interpretation sensitivity): I expect it to hold. No
    reasonable alternative reading of I-4, I-5, I-11, I-12, I-14, I-15 or I-24
    flips DR-1 or DR-3, because their primary counts sit at the floor. DR-2 and
    DR-4 hinge on the M2 construction, and if anything flips, it is there.
    J4 (hazard structure): the joint I expect to change how H-CERTBIN-a73f1c is
    READ, though not whether the run is valid. Each replayed pivot form lives in
    F_2^17. So a pivot whose linear part lies in the span of earlier ones is
    constant on the survivors, and its conditional hazard is exactly 0 or 1.
    Spec prior (c) anticipated this. I expect the red team to show that the
    exact-zero hazards and the repeated hazard sequences disclosed in
    implementation.md are forced this way. DR-4's verdict would then be a
    property of how the P2 set was defined. TS1's independence clause would
    fail by construction at this cell, while its balance clause holds on the
    independent pivots. I also expect the implementation.md Binomial tail
    probability to be judged a misapplied null. This is a design-level finding,
    not an implementation defect.
    J5 (proves-too-much): I expect it to hold. Identical instances match at every
    granularity, and the constant-column-only synthetic family shows the
    predicted identical prefix.
    J6/J7 (blind re-derivation and comparison): I expect agreement on s, arm,
    rank_4, "1 in R_4", the per-reference match flags and the reference
    ops_strict. My least confident item is "1 in R_4" on the unsatisfiable arm,
    at about 80% agreement. If any disagreement appears, I expect it there or
    in ops_strict, whose unit convention (sum of |X_k|) is easy to misread.
    J8 (scope and reading): I expect the red team to find three things. DR-7's
    "T_set replay not closed" does NOT mean that T_set replay survives, because
    DEC-20260923-b85c30 NA-5 has a second, retention conjunct. M4 is saturated
    at log2 N, so the E1 entropy clause tests only "all traces distinct". And
    the "1 in R_4" observation is the most decision-relevant finding of the
    run, scoped to one curve at n = 17 and D = 4.
    Overall: I expect DR-1 and DR-3 to stand and the run to be admissible, with
    the substantive changes in how TS1/DR-4 is read and in the scope of the
    "1 in R_4" observation. A break of J1, J6/J7 or J5 would overturn this.

  joints:
    - joint: >-
        J1 -- OBJECT FIDELITY. The archived impl/ builds exactly the frozen
        object of specification.yaml "object". That covers the modulus and field
        encoding; S_3 of KN-TECH-b18366; the descended system E(r) with
        multilinearization; the affine decomposition; the Macaulay rows (mu
        range deg <= D-2, row index = idx(mu)*17 + k, the mu order, zero rows
        retained); the DESCENDING degrevlex column order with the constant
        LAST; the pivot rule (the smallest ORIGINAL row index among unused rows
        with a 1 in column c of the CURRENT matrix); the X_k sets; the separate
        row-sequential Z_D pass; the four trace encodings; the fixed-schedule
        replay and the exact affine e_k computation; the strata; and oracles
        A and B.
      assigned_to: TASK-20260923-b8f163
      attack_plan: >-
        Build, do not just read. (1) Regenerate the D = 3 and D = 4 column
        orders from the spec's comparison rule with your own few-line code.
        Diff them against column-order-D{3,4}.json, and do the same for
        row-order-D{3,4}.json from the row formula. (2) For three archived
        F-S3 instances (one reference and two test targets), build M_4 by a
        literal, naive transcription of the spec: expand S_3 in F_{2^17},
        descend, multilinearize, then multiply rows. Compare bit for bit with
        the matrix the impl builds, by invoking its constructor on the same
        x_R. (3) Run a literal, slow transcription of the pivot rule on one
        D = 3 instance. Compare T_strict and T_ops with the impl's elimination
        and with references.json. (4) Confirm that the Z_D pass shares no
        elimination code with the column pass. (5) Confirm that the
        fixed-schedule replay applies the reference's X_k exactly and makes no
        data-dependent choice. Where I think it breaks: the degrevlex
        tie-break direction, the current-vs-original matrix in the pivot rule,
        and the multilinear reduction of mu*f_k when mu shares variables with a
        monomial of f_k. I lean toward the tie-break.
      breaking_artifact: >-
        A bit-level diff between the impl's matrix, order or trace and a
        spec-literal construction on an archived instance. Or a spec clause the
        code does not implement, cited by file and line.
    - joint: >-
        J2 -- INSTRUMENT AND PACKAGE INTEGRITY. Every control C-* is implemented
        as the spec defines it and can fail. The package is complete and
        hash-bound. Seeds, counts and the trial-plan timing are as frozen. The
        disclosed defects D-1..D-5 and deviations are as stated, and no
        further one exists.
      assigned_to: TASK-20260923-b8f163
      attack_plan: >-
        For each control, read the code that computes it and write one line on
        the failure it could detect and the failure it cannot.
        - Hunt for a control that is VACUOUS as implemented. Start with PS0 on
          unsatisfiable instances. Then check C-DET: confirm that phase 7 truly
          re-eliminates in a separate process (pid 3277 vs 1910 in the
          manifest) and recomputes T_ops hashes rather than re-reading
          checkpoints. Then C-ORACLE: confirm that oracle A does not call the
          descent code that feeds M_D. Then C-UNIF: recompute it from
          targets-F-RANDX.jsonl.gz.
        - Verify the bindings:
          - the manifest impl_sha256 against the TASK-20260923-c2e57b receipt;
          - that code.commit 4ebf8c0 is an ancestor of 64cba9f and carries the
            TASK-20260923-91d4a8 design snapshot;
          - that the trial-plan mtime precedes first_elimination_at;
          - that the 13 seeds match;
          - the per-family target and reference counts, and the package size
            (under 50 MiB);
          - that manifest_v2.yaml differs from manifest.yaml ONLY by
            run.code.command, supersedes and supersession_note (a YAML-level
            diff);
          - the implementation.md hash;
          - that environment.json records numpy 2.4.6.
        Where I think it breaks: PS0 vacuity on the unsatisfiable arm (I expect
        this as a FINDING, not as a break of the run), and C-DET reading
        checkpoints.
      breaking_artifact: >-
        A control that cannot fail as implemented and that guards a primary
        metric. A binding or hash mismatch. Or an undisclosed deviation.
    - joint: >-
        J3 -- METRIC AND DECISION-RULE RECOMPUTATION, WITH INTERPRETATION
        SENSITIVITY. M1-M4 and DR-1..DR-8 at F-S3, D = 4 recompute from the
        per-target and per-pivot records, and no verdict depends on a
        discretionary interpretation among I-1..I-25.
      assigned_to: TASK-20260923-b8f163
      attack_plan: >-
        (1) Recompute retention_family (M1, per reference and modal, with the
        Clopper-Pearson intervals), the M2 P2-set membership and statistics, the
        M3 ratio-rule branch, M4 and h(P_sat). Use targets-*.jsonl.gz,
        pivot-hazards.json and references.json with your OWN aggregation code.
        Do not run analysis.py or report.py. (2) Re-apply DR-1..DR-8 to your
        numbers. (3) Recompute the saving-ratio identity and the pruned sizes
        (DR-6, DR-7) from the definitions in the spec's secondary metrics.
        (4) Interpretation sensitivity. For each of I-4, I-5, I-11, I-12, I-14,
        I-15 and I-24, write the most plausible alternative reading of the spec
        text, recompute what it touches, and report whether any DR verdict
        flips. Also re-derive the modal reference from targets 1..100 by the
        modal rule. Where I think it breaks: DR-2's "between" under I-24, and
        M2 membership (pooled arms, sampled r-dependence over which targets,
        the S_k >= 200 cut).
      breaking_artifact: >-
        A recomputed metric or verdict that differs from decision-rules.json or
        cell-summary.json. Or a DR verdict that flips under a reasonable
        alternative interpretation, stated with both readings.
    - joint: >-
        J4 -- REPLAY-HAZARD STRUCTURE AND THE HEUR-CERTBIN-TS1 READING. The
        question is whether the hazard statistics that decide DR-4, and DR-2's
        hazard clauses, measure TS1 or instead measure the linear-dependence
        structure of the replayed pivot forms e_k(r) = a_{k,0} + <a_k, r>,
        with a_k in F_2^17.
      assigned_to: TASK-20260923-29e7af
      attack_plan: >-
        For every (reference, pivot) pair in the P2 set, compute a_k exactly
        from the archived op logs and the affine decomposition. You may use the
        impl's replay functions or your own. Decide whether a_k lies in
        span{a_j : j < k, a_j != 0}, and PREDICT each conditional hazard
        exactly: 0 or 1 if dependent (constant on survivors), and a Binomial
        band around 1/2 if independent. Compare with pivot-hazards.json. Use
        the same computation to explain three things:
        - the exact-zero hazards (implementation.md, "Unexpected observations",
          bullet 1);
        - the repeated early hazard sequences across different references
          (bullet 2);
        - the identical T_rank retention across references in run-report.md
          (test whether it is explained by those references having equal
          rank_4).
        Then state what DR-4's verdict is a property of. Say whether a
        P2 set restricted to rank-increasing pivots would give a different
        verdict. Report that as a READING, and do not propose it as a
        replacement rule: changing a frozen rule after data needs a
        protocol_amendment. Where I think it breaks: the P2 set mixes dependent
        and independent pivots, so its in-band fraction tests the set's
        definition; and the Binomial tail figure in implementation.md assumes an
        independence the construction rules out.
      breaking_artifact: >-
        A P2 pivot whose observed hazard contradicts its exact prediction, which
        would indicate a replay defect. Or a demonstration that DR-4's verdict is
        fixed by the P2-set definition whatever TS1's truth.
    - joint: J5 -- PROVES-TOO-MUCH; see proves_too_much.
      assigned_to: TASK-20260923-29e7af
      attack_plan: See proves_too_much.objects and failure_signature. Run the ARCHIVED pipeline, unchanged, on each object.
      breaking_artifact: >-
        The instrument reporting divergence, non-match or zero retention on an
        object whose trace is known to be stable.
    - joint: >-
        J6 -- BLIND RE-DERIVATION. The load-bearing quantities, computed from
        the specification and the extracted instance inputs alone. See
        blind_rederivation.
      assigned_to: TASK-20260923-7a2cd4
      attack_plan: Deliberately not supplied; the point is to start from the statement.
      breaking_artifact: >-
        A re-derived value that disagrees with the run. That is detected by J7,
        not by the re-deriver, which never sees the run's values.
    - joint: >-
        J7 -- RE-DERIVATION COMPARISON AND LOCALISATION. Does the archived
        output of J6 agree with RUN-CERTBIN-3b7e05 on every compared quantity?
        Where it does not, which implementation deviates from the
        specification text?
      assigned_to: TASK-20260923-5f9b82
      attack_plan: >-
        Map the blind labels to run records with blind-inputs-key.json. Compare
        on every item listed in TASK-20260923-5f9b82 CP-2. For each
        disagreement:
        (a) read both implementations at the relevant spec clause;
        (b) run a third, minimal spec-literal check on that one instance;
        (c) name which side departs from the spec text.
        A disagreement you cannot localise is `inconclusive`, never `holds`.
        Where I think a disagreement, if any, appears: "1 in R_4" on the
        unsatisfiable arm, or ops_strict's unit.
      breaking_artifact: >-
        A localised disagreement attributable to the producer's implementation.
    - joint: >-
        J8 -- SCOPE AND READING OF THE VERDICTS. What each mechanical verdict
        licenses and what it does not, at this cell and beyond it.
      assigned_to: TASK-20260923-29e7af
      attack_plan: >-
        Write the narrowest supported statement for each DR verdict and for
        each OVERTURNED prior part. Test these readings specifically:
        (i) DR-7's "T_set replay not closed" against DEC-20260923-b85c30 NA-5,
            whose T_set-replay condition has a saving conjunct AND a retention
            conjunct.
        (ii) The "1 in R_4" observation on the F-S3 unsatisfiable arm. Is it
             S_3-structural at this cell, or could it arise from the
             multilinearized construction or the field-equation handling?
             Compare its rate across F-S3, F-S3-REV, F-RANDX and the nulls.
             Confirm PS1 (none on any satisfiable instance) from the per-target
             records. Check whether the degenerate stratum or x_R structure
             drives it. Answer the resource_check question: which theory takes
             this measurement as its HYPOTHESIS? Consider Proposition S, and
             E3-style localisation with low-degree unsatisfiability
             certificates for RQ-CERTBIN-836ce2.
        (iii) M4 saturation: H(T_strict) is bounded by log2 N.
        (iv) The shared x_R between F-RANDX and F-S3 (implementation.md,
             bullet 3). Confirm that no primary metric touches it.
        (v) Any transfer language (n = 131, "P-GPU") in the run report.
        (vi) What the overturned prior part (f) changes, given DR-1.
        Where I think it breaks: a reading of DR-7 as "T_set replay survives",
        or of the D = 4 unsatisfiability detection as general beyond this cell.
      breaking_artifact: >-
        A verdict reading that exceeds its rule or its scope. Or a "1 in R_4"
        pattern explained by a construction artifact rather than by the S_3
        system.

  blindness:
    mutual: true
    lifted_for:
      - TASK-20260923-5f9b82
    rationale: >-
      J7 is a comparison, so it must read J6's archived output. Only
      TASK-20260923-5f9b82 has blindness lifted, and only for
      coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-7a2cd4/
      after the TASK-20260923-d04c5e archive. It does NOT lift for the reports
      of TASK-20260923-b8f163 or TASK-20260923-29e7af, and nobody may read
      TASK-20260923-5f9b82's report within this round. Lifting it this way
      costs nothing in independence: the comparator is not a re-deriver, and
      J6's output was sealed and archived before the comparator could read
      anything.

  proves_too_much:
    objects:
      - >-
        O1 -- IDENTICAL INSTANCES, where "the trace is unstable" is known false.
        (a) Each of the five F-S3 references scored against itself, which
        REF_SELF_REPLAY claims to cover. (b) The archived pair of an F-RANDX
        test target and an F-S3 instance that share x_R (implementation.md,
        "Unexpected observations", bullet 3).
      - >-
        O2 -- A SYNTHETIC CONSTANT-COLUMN FAMILY, where "instability is
        generic from the first step" is known false. Take E^0 = E(x_R = 0),
        which every F-S3 instance shares. Replace the r-dependence by
        E(r) = E^0 + sum_j r_j (c_j ⊗ e_const). Here e_const is the
        constant-monomial column of the 17 x 172 coefficient matrix, and the
        c_j in F_2^17 are drawn with a seed you declare. Run it through the
        archived pipeline at D = 4 for 200 random r. Each Macaulay row
        mu*f_k then depends on r only in column mu, which has degree <= 2 and
        sits in the degrevlex TAIL. Every XOR of r-independent high-degree
        entries stays r-independent. So every step on a column of degree 3 or 4
        coincides with the reference, including its X_k, and a_k = 0 there.
      - >-
        O3 -- THE NULL FAMILIES AND THE SATISFIABLE ARM, as run.
        - F-AFF-1..3 and F-NULLF2 are objects for which "the instability is
          caused by S_3 structure" is known false.
        - Every satisfiable instance of every family is an object for which
          "1 in R_4" is known false, by Proposition S / PS1.
    failure_signature: >-
      The failure signature for each object:
      - O1: the pipeline must report a match at all four granularities and
        survival of the whole replay with every e_k = 1.
      - O2: it must report identical T_strict and T_ops prefixes through the
        last degree-3 column step, with a_k = 0 on that block. The implied
        f_div lower bound must be computed from column-order-D4.json and met
        by every target.
      - O3: an argument that credits S_3 structure with the instability must
        show a difference from the nulls. Zero against zero is "not
        S_3-specific". Any "1 in R_4" on a satisfiable instance voids the
        instrument (INV-4).
      If the pipeline reports divergence, non-match or zero retention on O1, or
      divergence inside the r-independent block on O2, then its instability
      verdicts are manufactured by the instrument and not measured.
    assigned_to: TASK-20260923-29e7af
    authorization_note: >-
      Running the archived impl on O2 is a VERIFICATION computation authorized
      by DEC-20260923-4d7a19. It is not a trial of EXP-CERTBIN-4e92d7, not an
      arm, and not evidence about H-CERTBIN-a73f1c. It gets no RUN-id. Its
      outputs go only under the red team's write scope.

  blind_rederivation:
    required: true
    quantity: >-
      Every quantity is computed from the specification text and the
      extracted instance inputs alone. For each of the 5 unlabelled F-S3
      reference inputs and each of the 100 subsample target inputs:
      (Q1) the degenerate flag (x_R in V), and s, the number of assignments
      v in F_2^18 satisfying all 17 descended equations, computed by an oracle
      the re-deriver designs; and the arm;
      (Q2) at D = 4: rank_4, |Z_4|, and "1 in R_4";
      (Q3) at D = 4: T_strict, T_set, T_ops and T_rank for every instance, and
      per-target match flags against each reference at the four granularities.
      For the references only:
      (Q4) ops_strict = sum_k |X_k|, saving_strict and saving_set by the spec's
      formulas, and the D = 4 fixture dimensions;
      (Q5) T_rank, T_set and T_strict retention, with Clopper-Pearson 95%
      intervals, of the non-degenerate unsatisfiable subsample targets against
      each reference the re-deriver itself classifies unsatisfiable;
      (Q6) for those unsatisfiable references, K_exact and K_rank of the
      fixed-schedule replay via the affine decomposition, and for the first 64
      steps with a_k != 0, whether a_k increases the rank of the span of the
      earlier nonzero a_j.
      Optional (Q7): regenerate (A, B) from S_curve under the re-deriver's own
      reading of the spec's curve rule, and report whether it equals the
      extracted curve.
    parameters: >-
      n = 17, f = t^17 + t^3 + 1, m = 2, l = 9, V = {deg < 9}, D = 4
      (Q2-Q6). The curve (A, B), the five reference x_R values (sorted
      ascending, labelled REF-a..REF-e, arm NOT given) and the 100 target x_R
      values (F-S3 test-target draw positions 10, 20, ..., 1000, 1-based)
      come from coordination/review/certbin-20260923-c51f07/blind/blind-inputs.json
      and nowhere else. The subsample rule was fixed in this plan before
      extraction and does not depend on any outcome.
    blind_from:
      - experiments/EXP-CERTBIN-4e92d7/impl/
      - experiments/EXP-CERTBIN-4e92d7/trial-plan-v1.json
      - experiments/EXP-CERTBIN-4e92d7/runs/
      - coordination/design/certbin-trace-20260923-5d0b8e/archives/
      - coordination/review/certbin-20260923-c51f07/review-plan.yaml
