        certificate: manifest result.certificate.kind none
        logs: stderr.log is empty; stdout.log shows no warning, error, retry or unexpected invocation
      sampling_layer_regeneration:
        note: >-
          PD-R2 says the sampling layer is audited, not blind-re-derived, under
          J2. The validator regenerated every instance INPUT from the 13 seeds.
          It used its own field and curve code and numpy
          Generator(PCG64(seed)), following I-1..I-10 as written. No matrix was
