        - python3 -B coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-b8f163/j1-constructions/j1_power_controls.py
      artifacts_read: see j1-section.yaml artifacts_read
      limitations:
        - Bit-level construction covers F-S3 (15 instances) and a 2-instance F-S3-REV spot check. The other families share the build and eliminate paths and differ only in how E is produced (audited under J2).
        - Same model family as the executor. An unnamed shared misreading of the spec text is not excluded by J1.

    J2:
      verdict: holds
      summary: >-
        Every binding verifies. The package is complete and under 50 MiB. Seeds,
