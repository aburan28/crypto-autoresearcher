          instances.
        D-3: as stated (environment.json)
        D-4: as stated (manifest inference block fallback_used true, reason recorded, model_verified false)
        D-5: as stated; manifest_v2 changes exactly the three R-5 fields
        executor_deviations_1_2: as stated in implementation.md "Protocol deviations"
        further_undisclosed: >-
          No deviation from the spec TEXT was found. Two undisclosed
          RESOLUTIONS were found: the M3 bullet precedence (F-J3-1) and the
          reporting of C-REV and C-NULLS as passed controls (F-J2-3). Neither
          changes a number or a verdict.
      commands:
        - python3 -B coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-b8f163/j2-checks/j2_sampling_and_oracles.py  => exit 0, 8m52s
        - python3 -B coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-b8f163/j2-checks/j2_controls.py  => exit 0
        - python3 -B coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-b8f163/j2-checks/j2_small_checks.py  => exit 0
        - inline python3 (recorded in this session; read-only) for the receipt path_sha256 checks, the manifest-artifact hashes, package size, seed equality, the manifest_v2 recursive diff, the invocations.jsonl read and the impl_sha256 three-way check
        - git log/merge-base --is-ancestor/show --stat/diff for 4ebf8c0, 64cba9f, 5016669 and HEAD (read-only)
        - sha256sum on manifest.yaml, manifest_v2.yaml, implementation.md and tools/run_supersession_registry.yaml
        - python3 tools/allocate_id.py --check VAL-20260923-a679de

    J3:
      verdict: holds
      summary: >-
        M1-M4 and DR-1..DR-8 at F-S3, D = 4 recompute exactly from the
        per-target records. The validator's own aggregation code shares nothing
        with analysis.py or report.py. Its M2 hazards come from its own affine
        forms (its own M_4(E^0), M_4(E^j) and the archived op logs) evaluated on
        all 1000 F-S3 targets. Every DR verdict and every DR input equals
        decision-rules.json, with 0 mismatches against cell-summary.json,
        pivot-hazards.json and sizing.json over every compared cell. No DR
        verdict flips under any alternative reading of I-4, I-5, I-11, I-12,
        I-14, I-15 or I-24 that is consistent with the spec text. The two
        sensitivities that exist (F-J3-2) require P2-set definitions that
        contradict explicit spec text. One secondary tail statistic in
        cell-summary.json is numerically wrong (F-J3-3); it feeds no decision
        rule.
      metric_recomputations:
        M1:
          value: >-
            F-S3, D = 4, T_strict, unsat arm: U1 0/386, U2 0/386, U3 0/386,
            modal 0/347 (targets 101..1000). CP95 upper bounds 0.009511 and
            0.010574, equal to cell-summary to 1e-7. retention_family = 0; the
            tie goes to U1 by I-11.
          also: >-
            Every family x D x granularity x reference x arm: 688 cells, all
            equal to cell-summary. For example, D4 T_rank retention_family is
            0.34197 (132/386, U1) and D4 T_set is 0 (U1).
        M2:
          value: >-
            P2 set of 26 (reference, pivot) pairs, the same members with the
            same S_k and zeros as cell-summary. Pooled median h 0.481661; 15/26
            = 0.576923 in [0.4, 0.6]; 11 pairs at h = 0; max 0.513725. Per
            reference: U1 3 (median 0.49704), U2 6 (0.232), U3 11 (0.0), S1 3,
            S2 3.
          cross_checks: >-
            The validator's forms give a replay_first_zero equal to the archive
            for 5,900 (target, reference) pairs at D = 4, i.e. 1000 targets x 5 references plus targets 101..1000 for the modal (0 mismatches).
            pivot-hazards S_k and zeros_k rebuilt from the per-target first
            zeros: 110/110 tables equal. K_sampled and K_exact equal.
        M3:
          value: numerator 0/386 (U1); denominators F-AFF-1 0/115, F-AFF-2 0/126, F-AFF-3 0/127; per-draw ratios undefined
          reading: >-
            Both bullet 1 ("numerator count 0: ratio 0") and bullet 3 ("both 0:
            not estimable") of the ratio rule literally apply. The producer used
            bullet 3 (analysis.py:274-278). See F-J3-1.
        M4:
          value: >-
            F-S3 D = 4, N = 993. H(T_strict) = H(T_set) = H(T_ops) = 9.95565
            bits = log2 993 (993 distinct). H(T_rank) = 2.61264 (15 distinct;
            largest class 292). P_sat = 0.611279; h(P_sat) = 0.963969. All 16
            (family, D) x 4 granularities equal cell-summary.
        modal_rederivation: >-
          The modal rule (most frequent T_set among non-degenerate targets
          1..100; ties to the lowest first index) reproduces the archived modal
          index in 16/16 (family, D) cells: F-S3 1/1; F-PLANT 46/1; F-AFF-1
          43/1; F-AFF-2 55/1; F-AFF-3 8/1; F-NULLF2 29/1; F-RANDX and F-S3-REV
          1/1. The alternative reading "first 100 non-degenerate targets" gives
          the same indices.
        sizes_and_savings_DR6_DR7: >-
