        results:
          curve: "A, B, #E = 130412, h = 4, q = 32603, 0 rejections; equal to curve.json"
          points: P, Q and k_Q = 19247 equal to curve.json; qP = O
          F-S3_reference_scan: 9 draws, all fields equal (draw, a, b, x_R, status, s, selection)
          F-S3_targets: 1000 targets in 1037 draws (36 duplicates, 1 reference collision, 0 R = O); the sequence (idx, draw, a, b, x_R, degenerate) is equal, and the targets file carries the same x_R per idx
          F-PLANT: "|F_V| = 483; 200 targets in 205 draws; sequence (idx, draw, i1, i2, z) and rejections equal"
          F-RANDX: scan of 7 equal; 1000 targets in 1002 draws equal; x_R shared with F-S3 targets at idx [16, 73, 567, 679, 786, 943, 961], exactly as implementation.md states
          F-AFF-1..3: A0 and all 17 Aj equal the p1 checkpoint hex; reference rescans (40, 17 and 18 draws) equal; targets reuse the F-S3 x_R
