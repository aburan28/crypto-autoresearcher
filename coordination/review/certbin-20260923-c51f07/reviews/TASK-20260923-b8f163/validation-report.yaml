  # ===========================================================================
  findings:
    - id: F-J2-1
      joint: J2
      severity: design-level finding; anticipated by the plan prior; not a break
      text: >-
        PS0 is vacuous on every unsatisfiable instance (oracles.py:126-138
        loops over sols only). On the unsat arm the other C-PROPS items add
        nothing: PS1 applies only to satisfiable instances, PS2 is implied by
        PS1 (F-J2-4), and PS3 is trivially true. No C-PROPS item therefore
        guards the ROW CONTENT on the arm that carries the "1 in R_4"
        observation (324/386 non-degenerate unsat F-S3 targets at D = 4). The
        guards that do exist are: (a) the construction code is arm-agnostic and
        PS0 exercises it on 612 satisfiable F-S3 instances per D (1,821
        solutions) and 5,551 satisfiable target instances per D across all families;
        (b) C-SELF's row checks; (c) J1's spec-literal construction, bit-
        identical on 6 unsat instances (U1, U2, U3 and targets 5, 8, 10), with
        1 in R_4 on all 6 and in R_3 on none; (d) J6/J7, pending. The validator
        offers no reading of the observation (J8).
    - id: F-J2-2
      joint: J2
      severity: design-level finding (specification), not attributable to the producer; not a break
      text: >-
        C-UNIF is structurally vacuous at this cell. K_rank = 17 equals the
        number of r bits, and targets exclude the reference x_R, so the full-
        replay survivor count is 0 by construction (tested: 98/98 pairs). The
        control cannot detect any sampler defect. It detects a rank error only
        if the true rank is at most about 9 while 17 was reported. INV-7's
        protection of M2 is therefore nominal. What C-UNIF was meant to check is
        covered elsewhere: the sampler by the J2 regeneration (every stream
        reproduced exactly); K_rank by J1 (17 recomputed for 6 references x
        2 D); the forms by C-AFF (1,960 pairs), J1 (100 pairs) and J3 (5,900
        first-zero comparisons). Recommendation: the evidence record should not
        cite C-UNIF's pass as evidence about the sampler or the rank
        computation.
    - id: F-J2-3
      joint: J2
      severity: presentation; no number affected
      text: >-
        C-REV is hard-coded "pass": True (analysis.py:530), and C-NULLS passes
        whenever the families exist (analysis.py:531). The spec defines neither
        with a failure condition. M5 and run-report.md list them among 14 passed
        instrument checks, and claim (i) "every instrument check ... passes"
        counts two completion records as passed controls.
    - id: F-J2-4
      joint: J2
      severity: design-level; no effect
      text: >-
        PS2 is logically implied by PS1, and PS3 by PS0. C-PROPS therefore has
        two independent failure modes, not four.
    - id: F-J3-1
      joint: J3 (also J2's "no further deviation")
      severity: disclosure gap; no verdict effect at the as-run P2 set
      text: >-
        The spec's M3 ratio rule is internally overlapping at the observed
        counts (numerator 0; all denominators 0). Bullet 1 gives ratio 0, and
        bullet 3 gives "not estimable" with E1's clause "not evaluable". The
        producer gave bullet 3 precedence (analysis.py:274-278). No I-1..I-25
        entry declares this; I-24 says only that the consistency clause accepts
        "not estimable". Under either precedence, DR-2 = between, DR-3 = E2
        FALSIFIED and DR-5 = not applicable. The precedence becomes decisive for
        DR-2 only together with a text-incompatible P2 definition (F-J3-2).
    - id: F-J3-2
      joint: J3 (READING belongs to J4/J8)
      severity: sensitivity disclosure; no flip under any reading consistent with the text
      text: >-
        DR-4 depends on the P2-set definition. The literal definition, which is
        run and reproduced exactly, gives "not supported, not falsified" (26
        pairs; 11 at h = 0). Under three definitions the text does not support
        (dependence over replay survivors; S_k over the unsat arm only;
        rank-increasing pivots only), DR-4 gives "H1 SUPPORTED at this cell".
        Combined with bullet-3 M3, DR-2 gives "E1 CONSISTENT". Changing the
        frozen rule after data would need a protocol amendment. Whether the
        literal P2 set measures TS1 is J4's question.
    - id: F-J3-3
      joint: J3
      severity: numerical defect in a secondary statistic; outside M1-M4 and DR-1..DR-8; no verdict effect
      text: >-
        cell-summary.json M2.tail_extremes.P_null_min_le_observed = 2.238e-13,
        also quoted as "2.2e-13" in implementation.md "Unexpected observations"
        bullet 1, is a floating-point floor. analysis.py:121-128 computes
        1 - prod binom_sf(1, S_k, 1/2), and stats.binom_sf (stats.py:24-30)
        sums float pmfs, whose rounding dominates. The exact value under the
        producer's own stated null is 8.34e-75 (150-digit mpmath; equal to
        sum 2^-S_k over the 11 zero-hazard pairs with S_k in 249-507).
        P_null_max_ge_observed is correct (0.99987733887). The error is in the
        conservative direction and no decision rule reads it. Under the literal
        J3 breaking_artifact text ("a recomputed metric ... that differs from
        cell-summary.json"), this is the one cell-summary value that does not
        reproduce. The validator records J3 as holds because the joint's claim
        is M1-M4 and DR-1..DR-8, and the tail check is a spec tail_checks item
        that feeds neither. If the Coordinator reads the breaking_artifact as
        covering every cell-summary value, this item alone would break J3. The
        mechanical verdicts would still stand, because none depends on it.
        Whether that null is the right comparison at all is J4's question.

