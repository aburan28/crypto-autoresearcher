          Null families: an exhaustive mod-2 matrix product of E against all
          2^18 monomial evaluations, not oracle B's bit-sliced XOR.
        results: >-
          Solution SETS equal on F-S3 1009/1009, F-PLANT 200/200, F-RANDX
          1007/1007, F-AFF-1 1040/1040, F-AFF-2 1017/1017, F-AFF-3 1018/1018 and
          F-NULLF2 1015/1015. Total 6,306/6,306, the same instance count as
