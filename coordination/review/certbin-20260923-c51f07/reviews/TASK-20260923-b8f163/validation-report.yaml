      control_table:
        - control: C-FIX
          code: selftest.py:302-306; driver.py:227-231
          can_detect: a wrong shape at D = 3 or 4
          cannot_detect: wrong content in the right shape
          status: real; passes (323 x 988, 2924 x 4048; the validator reproduced both)
        - control: C-SELF
          code: selftest.py (9 items on seed S_selftest)
          can_detect: a reducible modulus, table/schoolbook field disagreement, a wrong point count on small fields, S_3 not vanishing on sums and differences, descent/direct disagreement, Macaulay-row errors (50 S_3 + 25 dense rows per D), half-trace errors
          cannot_detect: >-
            An error specific to the run's curve or to rows outside the sample.
            Its column-order "literal" check calls degrevlex_greater from the
            same module as column_order (macaulay.py:44-53); the validator's J1
            order check is independent.
          status: real; passes
        - control: C-ORACLE
          code: analysis.py:358-367; oracles.py:40-89
          can_detect: disagreement between the root-finding and exhaustive solution SETS (not only counts) on 2,216 curve-algebra instances
          cannot_detect: >-
            A common-mode error in the shared TableField arithmetic. Oracle A
            calls no descent or elimination code (oracles.py:54-89) but uses the
            same field tables as the descent. This gap is closed by the
            validator's third oracle (own field; 6,306/6,306 sets equal) and by
            C-WIT's schoolbook evaluation.
          status: real; passes
        - control: C-WIT
          code: analysis.py:368-381; oracles.py:92-106
          can_detect: a reported solution that does not satisfy S_3 (schoolbook) or the 17 Boolean equations; an F-PLANT target missing its planted witness
          cannot_detect: MISSED solutions (false unsat); for null families (oracle B only) that gap is closed by the validator's third oracle
          status: real; passes (6,306 instances; 12,755 solutions)
        - control: C-AFF
          code: families.py:100-111, 404-409; engine.py:263-306; analysis.py:382-400
          can_detect: "a non-affine descent; a disagreement between the affine forms and direct replay (1,960 pairs: 980 per D across 7 affine-route families)"
          cannot_detect: "an error common to both replay paths; the validator's own replay (J1, 100 pairs) and own forms (J3, 5,900 (target, reference) pairs at D = 4: 1000 targets x 5 references plus 900 for the modal; 0 first-zero mismatches) close it"
          status: real; passes
        - control: C-DET
          code: driver.py:364-415; checkpoint/invocations.jsonl
          can_detect: >-
            Nondeterminism. Phase 7 is a separate process: pid 3277, ppid 3276,
            against main pid 1910 (ppid 1904) and resume pid 3322 (ppid 3321).
            It REBUILDS every matrix from the stored x_R via descended_E and
            S.build and re-eliminates, then compares T_ops hashes. It reads the
            checkpoint only for the inputs (x_R) and the expected hashes.
          cannot_detect: a deterministic defect (same code, same environment); J1 addresses that
          status: real; passes (2000/2000 targets, 12/12 references)
        - control: C-PASS
          code: elim.py:61-122; analysis.py:411-423
          can_detect: disagreement between the column pass and the separate row pass (leading-column set; |Z| = R - rank)
          cannot_detect: an error in the shared input matrix; J1 addresses that
          status: real; passes (14,486 checks; 0 false cpass flags in the records)
        - control: C-PROPS PS0
          code: oracles.py:126-138; engine.py:24-36
          can_detect: a Macaulay row that does not vanish at a solution of a satisfiable instance (612 F-S3 instances per D with 1,821 solutions; 5,551 satisfiable target instances per D across all families)
          cannot_detect: >-
            ANY row-content error on an unsatisfiable instance. The loop runs
            over sols only, so PS0 is vacuous on 388 F-S3 instances per D and on
            every unsat instance of every family. FINDING F-J2-1.
          status: real on the sat arm; vacuous on the unsat arm
        - control: C-PROPS PS1
          code: engine.py:31; analysis.py:432-442
          can_detect: 1 in R_D on a satisfiable instance (the soundness failure of "1 in R_D")
          cannot_detect: a spurious 1 in R_D on an unsatisfiable instance (by definition)
          status: real; passes (0 satisfiable instances with 1 in R_D in any family at either D)
        - control: C-PROPS PS2
          code: analysis.py:445-476
          can_detect: only what PS1 detects. T_set contains the pivot-column set, so an unsat reference with the constant column as pivot cannot share T_set with a satisfiable instance unless PS1 fails
          cannot_detect: anything PS1 cannot. FINDING F-J2-4
          status: logically implied by PS1; passes; not vacuous at D = 4 for F-S3, F-S3-REV and F-RANDX
        - control: C-PROPS PS3
          code: engine.py:32-35
          can_detect: only what PS0 detects (if every row vanishes at the solutions, the row space is orthogonal to their evaluation vectors)
          cannot_detect: anything on unsat instances (evaluation rank 0). FINDING F-J2-4
          status: implied by PS0; passes
        - control: C-UNIF
          code: analysis.py:486-504; engine.py:327-338
          can_detect: >-
            Only a gross rank error. With K_rank = 17 = dim(r), the system
            {e_k(r) = 1 for all k} has at most one solution, and the reference's
            own r is one (self replay). Full-replay survival therefore holds iff
            x_R(target) = x_R(reference), and targets exclude the reference x_R,
            so the count is structurally 0. It could reach the rejection region
            (>= 2 survivors) only if the true rank were at most about 9 while 17
            was reported. Its rejection probability under its own null is 2.9e-5.
          cannot_detect: any sampler defect. FINDING F-J2-2
          status: >-
            Recomputed from targets-F-RANDX.jsonl.gz: 12/12 identical (0
            survivors; n = 995 or 895; acceptance region [0, 1]). The structural
            claim was tested on 98 (family, D, reference) pairs across 7
            affine-route families: survival equals x_R equality in 98/98. The
            only survivors in the package are F-RANDX idx 786 against F-S3:modal
            at both D, and that target shares the modal's x_R 88878.
        - control: NESTING
          code: analysis.py:505-522
          can_detect: a violation of T_ops => T_strict => T_set => T_rank in hash classes or per-pair flags
          cannot_detect: nothing material at this granularity
          status: real; recomputed with 0 violations over 97,200 (target, reference) pairs and all hash classes
        - control: HASH_CONTENT
          code: engine.py:114-140
          can_detect: a sha256 collision (hash equal, content different) at set, strict and ops, and content-equal/hash-unequal at strict
          cannot_detect: nothing material
          status: real; passes; the validator's hash-based and flag-based retention counts agree on 688/688 cells
        - control: REF_SELF_REPLAY
          code: engine.py:52-53
          can_detect: an inconsistency between the replay code and the column pass
          cannot_detect: an error shared by both
          status: real but weak; passes
        - control: C-REV
          code: analysis.py:530 (hard-coded pass True)
          can_detect: nothing; it records that the replicate ran
          cannot_detect: everything. FINDING F-J2-3
          status: a completion record reported as a passed control
        - control: C-NULLS
          code: analysis.py:531-532 (passes iff the families exist)
          can_detect: a missing null family
          cannot_detect: whether the nulls are the declared objects; the validator's regeneration closes that
          status: a completion record reported as a passed control
      disclosed_defects_and_deviations:
        D-1: as stated (implementation.md bound by the receipt, not in the manifest artifacts)
        D-2: >-
          Stated. The development directory is excluded by this card and was not
          read, so it cannot be verified from archived bytes. The regeneration
