  joints:
    J1:
      verdict: holds
      sealed_section: coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-b8f163/j1-section.yaml
      summary: >-
        The archived impl/ builds the frozen object. On 15 distinct archived
        F-S3 instances (the 5 references, the modal instance and targets 1..10),
        the validator's own spec-literal construction equals the impl's
        MacaulayShape.build(descended_E) with 0 differing bits at D = 3 and
        D = 4. Its column and row orders equal column-order-D{3,4}.json and
        row-order-D{3,4}.json with 0 differences. A literal current-matrix
        transcription of the pivot rule gives op logs (p, c, X) identical to the
        impl's eliminate and to the archived reference op logs (6 references x 2
        D). All four trace hashes reproduce for 16 instance slots x 2 D (15
        distinct instances; the modal is target 1). An own Z_D pass equals the
        impl's row pass. An own full-row replay gives replay_first_zero and
        match flags equal to the archive on 100/100 (target, reference, D)
        pairs. Own exact affine forms give K_exact and K_rank equal to
        references.json and predict every direct-replay entry. An own
        brute-force oracle gives s equal to the archive on 15/15. On U1, each
        misreading the plan named (tie-break reversed; pivot rule read against
        the original matrix; no multilinear reduction; ascending order) was
        built and produces a different object. The comparison can therefore
        fail.
      coordinator_suspected_breaks: >-
        None materialised. The tie-break direction, current-vs-original matrix
        and multilinear reduction of mu*f_k all reproduce, and the W1-W3
        controls show each check discriminates.
      built: see j1-section.yaml "built" (field and modulus, S_3, descent by two methods, affine decomposition, rows, columns, pivot rule, Z_D, encodings, replay, strata and oracles, F-S3-REV spot check)
      commands:
