# =============================================================================
validation_report:
  id: VAL-20260923-5f9b82
  task_id: TASK-20260923-5f9b82
  joint: J7
  review_plan_id: REVIEW-CERTBIN-20260923-c51f07
  experiment_id: EXP-CERTBIN-4e92d7
  hypothesis_id: H-CERTBIN-a73f1c
  run_ids: [RUN-CERTBIN-3b7e05]
  compared_with: TASK-20260923-7a2cd4 (J6 blind re-derivation), rederivation.json sha256 c3332ec4583f7fba65f7ed54a2731966d49c7c078b38ad73173e23276a8f8bdb
  snapshot_read: >-
    HEAD e385b99135c7bf16d738c7219deb021724b349d0 (the TASK-20260923-d04c5e
    archive commit). Every input was read from committed bytes. compare_j7.py
    checks each hashed input against its receipt AND against `git show
    HEAD:<path>` before any comparison, and refuses to run on a mismatch. No
    working-tree-only file was used as evidence.
  comparison_command: >-
    python3 -B coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-5f9b82/checks/compare_j7.py
    (from the repository root; exit 0; 4.4 s wall; child peak RSS about 229 MB;
    Python 3.11.15, numpy 2.4.6, Linux x86_64, 4 CPUs). Then the comparator
    negative control, checks/comparator_negative_control.py (exit 0).

  # ---------------------------------------------------------------------------
  # CP-1 -- verify before comparing
  # ---------------------------------------------------------------------------
  artifact_checks:
    - id: CP-1(1)
      check: The re-deriver's directory against the TASK-20260923-d04c5e receipt path_sha256
      result: >-
        PASS. For all 14 files, the receipt sha256, the HEAD blob sha256 and the
        working-tree sha256 are equal, and so are the sizes. The committed file
        set under reviews/TASK-20260923-7a2cd4/ equals the receipt's file set
        exactly.
    - id: CP-1(2)
      check: seal.txt against rederivation.json
      result: >-
        PASS. seal.txt reads "sha256 c3332ec4...8bdb rederivation.json, sealed_utc
        2026-09-23T20:57:16+00:00, task TASK-20260923-7a2cd4 pass 1", and
        sha256(rederivation.json) = c3332ec4583f7fba65f7ed54a2731966d49c7c078b38ad73173e23276a8f8bdb.
        Every re-derived value compared here comes from the SEALED
        rederivation.json. report.md, which the dispatching session placed after
        the seal (d04c5e defect A-1), was read for method context only. No
        compared value was taken from it.
    - id: CP-1(3)
      check: blind-inputs.json against the TASK-20260923-e3b590 receipt
      result: >-
        PASS. The sha256 is 71c50924b56b58e347587bbb3a0b1eba91940f4fa79275134a0fcd10cf1e9ce9.
        It equals the receipt's path_sha256, its extraction.blind_inputs_sha256,
        the HEAD blob and the working tree. It also equals the blob the
        re-deriver recorded reading from becae03 (rederivation.json
        provenance.input). blind-inputs-key.json is also bound: e09a3fed...375e.
        The blind inputs hold only whitelisted fields: schema, review_id, field,
        m, l, D, curve {A, B}, references [{label, x_R}] and targets [{position,
        x_R}]. No outcome reached J6 through them.
    - id: CP-1(key)
      check: Label and position mapping (blind-inputs-key.json)
      result: >-
        Applied. REF-a -> U2, REF-b -> U3, REF-c -> U1, REF-d -> S1, REF-e -> S2.
        Target position p -> run idx p (identity, positions 10..1000 step 10).
        As a sanity check, x_R agrees under the key for all 5 references and all
        100 targets.
    - id: BIND-run
      check: The run package and impl/ against the TASK-20260923-c2e57b receipt
      result: >-
        PASS on all 66 files (receipt = HEAD blob = working tree), including the
        14 impl/ files and checkpoint/p2-F-S3-D4.json.gz. manifest_v2.yaml equals
        the TASK-20260923-e3b590 prior_commit_binding (b801901e...162c).
    - id: BIND-spec
      check: Both sides were built from the same frozen specification bytes
      result: >-
        specification.yaml sha256 ddf540a72dc460abb7fb48488ca0a6b3f38b8f56c49eca457ce52d72d9f169f2
        equals: the working tree; HEAD (blob aaf2815e); the
        TASK-20260923-91d4a8 design receipt; manifest inputs.specification_sha256;
        trial-plan spec_sha256; and the re-deriver's provenance (same blob
        aaf2815e at its HEAD and at its input commit). No amendment exists
        (amendments/ holds only .gitkeep).
    - id: DISPATCH-OBS
      check: The card's dispatch_preconditions (these bind the dispatcher; recorded as observed)
      result: >-
        The d04c5e receipt shows no SC-1 blocking defect ("comparator_block:
        None"). archived_by TASK-20260923-918a6d is bound on the card. The
        declared inputs are committed at HEAD. UNVERIFIED BY ME: no goal_lanes
        claim for TASK-20260923-5f9b82 appears in local git refs or history. The
        d04c5e receipt (A-2) notes that no queue exists for this lane. Whether
