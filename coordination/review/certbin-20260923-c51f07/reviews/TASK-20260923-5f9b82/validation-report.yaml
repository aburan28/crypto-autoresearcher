        cannot verify from inside it. I did not read the re-deriver's or any
        sibling's session.

  # ---------------------------------------------------------------------------
  # CP-2 -- item-by-item comparison (machine-readable table: comparison.json)
  # ---------------------------------------------------------------------------
  metric_recomputations:
    summary: >-
      3944 items were checked. 3944 agree and 0 disagree. By category:
      3603 CP-2 comparisons of re-derivation against run (0 disagree); 116
      supplementary comparisons (0 disagree); 120 run-internal
      self-consistency checks (0 fail); 105 x_R mapping-sanity checks
      (0 fail). comparison.json summary.by_category and
      summary.per_item_type (81 item types) carry the per-item breakdown, and
      summary.disagreements is an empty list.
    per_reference_5:
      items: >-
        29 items per reference (145 in total): degenerate; s against each of
        the re-deriver's three routes (A root-finding, B exhaustive descended,
        C direct field enumeration); arm; rank_4 (references.json, sizing.json
        and cell-summary.json); |Z_4| (references.json and sizing.json);
        one_in_R4; T_strict CONTENT (against references.json D4.T_strict and
        against the D = 4 op log's (p, c)); T_set CONTENT; the T_rank, T_set,
        T_strict and T_ops hashes; ops_strict (sizing.json, the sum of |X_k| over
        the archived op log, and the re-deriver's own sum_X); ops_masked_full;
        ops_set; saving_strict and saving_set, both as exact rationals and as
        archived floats; (R_4, C_4); and (pivot_cols, R - |Z|).
      result: All agree for REF-a..REF-e (U2, U3, U1, S1, S2).
      values_for_orientation: >-
        U2 and U1 have rank 2672, |Z| 252 and 1 in R_4. U3 has rank 2671, |Z|
        253 and 1 in R_4. S1 has rank 2672, |Z| 252 and not 1 in R_4. S2 has
        rank 2671, |Z| 253 and not 1 in R_4. ops_strict is 331893 (U2), 337369
        (U3), 332731 (U1), 352418 (S1) and 334746 (S2). The table holds the
        exact saving ratios.
      t_set_content_basis: >-
        The run archives T_set as a hash plus |Z| in references.json. Its
        content was compared in two independent ways, and both agree. (i)
        Reconstruction: pivot columns = sorted c_k of the run's own T_strict,
        and Z = the complement of its pivot rows. Under the declared pivot rule
        every XOR adds a smaller-index pivot row into a larger-index row, so a
        zeroed row lies in the span of earlier rows; with |Z| = R - rank this
        forces equality. The run's own h_set confirmed the reconstruction for
        all 5 references. (ii) SUPPLEMENTARY and declared: the run's run-time
        T_set content, i.e. its actual row-pass Z, in the archived
        checkpoint/p2-F-S3-D4.json.gz. It equals the re-derived T_set content
        for all 5 references.
      t_ops_content_basis: >-
        The run's archived op log hashes to the run's h_ops (a self-check) and
        also equals the re-deriver's T_ops hash, for all 5 references. The
        encodings coincide, so T_ops CONTENT agrees; this is not merely hash
        agreement.
    unsat_reference_affine_replay_3:
      items: >-
        Per unsatisfiable reference (REF-a/U2, REF-b/U3, REF-c/U1): the op-log
        length; K_exact and K_rank against references.json, pivot-hazards.json
        and cell-summary.json; a_k0 at EVERY step against the run's archived
        pivot-hazards a0; (a_k != 0) at every step against the run's archived
        a_nonzero; a_k at every step; steps_with_a_k_zero; and the first-64
        nonzero-a_k list, entry by entry (k, a_k0, a_k and increases_rank).
      run_side_source: >-
        The run archived a0 and a_nonzero, not a_k. As CP-2 instructs, a_k was
        recomputed with the archived, receipt-verified impl/. That means
        impl/elim.py affine_forms on impl/macaulay.py MacaulayShape(4) planes
        [M(E^0), M(E^0'), ..., M(E^16)], run on the run's OWN archived D = 4 op
        log. The recompute matches the run's archived a0, a_nonzero, K_exact and
        K_rank at every step. SUPPLEMENTARY and declared: the run's run-time
        forms_a and forms_a0 in checkpoint/p2-F-S3-D4.json.gz were compared
        too.
      result: >-
        All agree. K_exact is 2671, 2670 and 2671, and K_rank is 17 for each.
        a_k agrees at every step (2672, 2671 and 2672 steps) against both the
        impl/ recompute and the run-time forms. All 192 first-64 entries agree.
        Rank increments in the first 64 are 9, 8 and 9 on both sides.
    per_target_100:
      items: >-
        32 items per target (3200 in total): degenerate; s against each of the
        3 routes; arm; rank_4; one_in_R4; |Z_4|; the four trace hashes (the
        encodings coincide: canonical JSON with separators (',', ':'), T_set =
        [[pivot cols], [Z]], T_strict = [[p, c], ...] and T_ops =
        [[p, c, [X]], ...] on both sides); and 20 match flags (5 references x
        {T_rank, T_set, T_strict, T_ops}).
      result: All 3200 agree.
    subsample_retention_identity:
      items: >-
        The unsatisfiable subsample position list and n. Then, for each
        unsatisfiable reference and granularity, the count implied by the run's
        own per-target match flags against the re-deriver's Q5 count. The set of
        references classified unsatisfiable. 15 items.
      result: >-
        All agree. n = 35 on both sides, with identical position lists. T_rank
        counts are 8/35 (U2), 6/35 (U3) and 8/35 (U1). T_set, T_strict and T_ops
        counts are 0/35 for all three. This is an identity check on the same
        100 targets. It is NOT a comparison with the full-arm M1.
    q7_curve:
      items: A, B, #E, h, q and the number of rejected draws, for each of the re-deriver's pre-declared readings R1, R2 and R3 (18 items).
      result: >-
        All three readings reproduce curve.json exactly: A 97044, B 126251,
        #E 130412, h 4, q 32603, 0 rejected draws.
    supplementary_beyond_cp2:
      - >-
        Reference-vs-reference flags (5 x 5 x 4 = 100), derived on the run side
        from equality of the references.json D4 hashes. All agree.
      - >-
        Run-time checkpoint content for the references: T_set (5), T_strict (5),
        forms_a (3) and forms_a0 (3). All agree.
    ambiguities_vs_run_resolution: >-
      All 9 of the re-deriver's registered ambiguities (AMB-1..AMB-9) were set
      against trial-plan I-1..I-25 and impl/. comparison.json
      ambiguities_vs_run_resolution cites file and line for each. The run
      resolved every one the SAME way:
      - AMB-1: the a_k bit order is bit j = r_j (elim.py:150-158); a_k agrees
        at every step.
      - AMB-2: the leading column is the smallest index (elim.py:84-88).
      - AMB-3: zero rows go into Z (elim.py:74-75). This is moot at this
        cell: zero_rows_in_M4 = 0 on all 105 instances.
      - AMB-4: the curve call pattern R1 is I-1 (families.py:27-50). All three
        readings reproduce curve.json, and the rejection branch was not
        exercised.
      - AMB-5: M_D(E^j) is built from the rows of E^j (macaulay.py:118-122,
        driver.py:244-257).
      - AMB-6: not load-bearing.
      - AMB-7: T_ops matching uses the hash, then content (engine.py:133-140;
        I-17). With coinciding encodings, hash inequality implies content
        inequality.
      - AMB-8: Clopper-Pearson is two-sided and equal-tailed (stats.py:43-48).
        impl clopper_pearson reproduces every Q5 interval to within 3.1e-16.
      - AMB-9: scope only (D = 4).
      No ambiguity was read differently by the two sides.

  # ---------------------------------------------------------------------------
  # CP-3 -- localisation
  # ---------------------------------------------------------------------------
  disagreements: []
  localisations: >-
    None required: no compared quantity disagrees, and there is no hash-only
    (encoding) difference either. CP-3's third spec-literal check is triggered
    only by a disagreement, so none was run. checks/ holds the comparison code
    and the comparator's own negative control instead.

  control_checks:
    - id: NC-COMPARATOR
      what: >-
        A negative control on the comparator. Agreement from a comparator that
        cannot disagree is not evidence. checks/comparator_negative_control.py
        re-applies the per-instance item logic under wrong inputs.
      result: >-
        PASS (comparator_negative_control.json, control_passed: true).
        - P0, the true mapping: 0 disagreements.
        - N1, reference labels permuted within each arm: 233.
        - N2, target map off by one draw: 1033.
        - N3, target map off by ten draws: 1024.
        - N4, one run match flag flipped in memory: exactly 1.
        - N5, one run target hash altered: exactly 1.
        - N6, one re-derived rank-increment flag flipped: exactly 1.
        N1 also shows the floor caveat below directly. Permuting reference
        labels within an arm changes NO T_set, T_strict or T_ops match flag,
        because every one of them is false. Only the T_rank flags and the
        reference-level hashes, ranks and contents detect the permutation.
    - id: RUN-SELF
      what: The run's archived content against its own archived hashes, i.e. whether the run side is internally consistent before it is compared.
      result: >-
        PASS on 120 of 120:
        - sha256(op log) = h_ops, sha256(T_strict) = h_strict and
          sha256(rank) = h_rank for the 5 references;
        - sha256(rank) = h_rank for the 100 targets;
        - the checkpoint's reference hashes equal the references.json hashes.
    - id: IMPL-REUSE-BOUND
      what: impl/ was used only to recompute unarchived a_k, and that use is itself checked
      result: >-
        The impl/ recompute reproduces the run's archived a0, a_nonzero, K_exact
        and K_rank at every step for U1, U2 and U3. The run-time forms_a in the
        checkpoint equal the recompute. impl/ was imported with bytecode writing
        disabled, and it holds no __pycache__ afterwards.

  heuristic_validation_checks:
    - >-
      Not applicable as a heuristic-validation experiment for J7. The quantities
      relevant to HEUR-CERTBIN-TS1 that J7 touches (K_exact, K_rank and the
      rank-increment structure of a_k) agree exactly. How they are READ is J4's
      question.

  cost_model_checks:
    - >-
      The ops_strict unit convention, which the Coordinator's prior named as
      easy to misread: both sides use ops_strict = sum_k |X_k|, in units of one
      full-row XOR (C_4 bits). Both sides agree exactly on all 5 references,
      and so does the sum over the archived op log.
    - >-
      saving_set = C_4 R_4 / rank_4^2 holds as an exact rational on both sides.
      saving_strict and saving_set agree as exact rationals.
    - >-
      Word-level counts, memory, pruned sizes and the DR-6/DR-7 readings are
      not J7 items and were not compared.

  proof_architecture_checks: []

  # ---------------------------------------------------------------------------
  # CP-4 -- verdict on J7, with the floor/ceiling caveat
  # ---------------------------------------------------------------------------
  floor_or_ceiling_items:
    statement: >-
      Agreement on a quantity that sits at a floor or ceiling for every instance
      is weak evidence about the implementation. These compared items are of
      that kind:
    items:
      - >-
        The target match flags at T_set, T_strict and T_ops are FALSE for all
        500 (target, reference) pairs each. On their own they are weak. They are
        backed, however, by exact agreement of the underlying 256-bit T_set,
        T_strict and T_ops hashes on all 100 targets and all 5 references, and
        of T_strict, T_set and T_ops content on the references. NC-COMPARATOR
        N1 shows that these flags alone cannot even tell reference labels apart.
      - >-
        The Q5 retention counts at T_set, T_strict and T_ops are 0/35 for every
        unsatisfiable reference. The same caveat and the same backing apply.
      - >-
        The degenerate flag is false on all 100 subsample targets and all 5
        references, which are non-degenerate by rule. J7 therefore does not
        exercise degenerate-stratum handling.
      - >-
        one_in_R4 on the satisfiable side is false on all 65 satisfiable targets
        and on both satisfiable references. This is a floor forced by
        Proposition S / PS1. It is also true on all 3 unsatisfiable references.
        The INFORMATIVE part is the unsatisfiable target arm, which is mixed:
        31 true and 4 false among 35. Both sides agree on each of the 35. That
        is the item the Coordinator's prior held with the least confidence.
      - >-
        K_rank = 17 for all 3 unsatisfiable references, which is the ceiling
        for vectors in F_2^17. The non-ceiling structure agrees exactly: a_k at
        every step, and the rank-increment positions in the first 64.
      - >-
        a_k0 = 0 at all first-64 nonzero-a_k steps of all 3 references, a floor
        within that window. Across all steps a_k0 takes both values, and it
        agrees at every step.
      - >-
        (R_4, C_4) = (2924, 4048) and ops_masked_full = C_4 R_4 are constants
        fixed by the specification (C-FIX), so they agree trivially.
      - >-
        Q7: the first draw was accepted with no rejection. Agreement tests the
        call pattern and the order and cofactor rule. It does not test the
        rejection branch, and it does not separate readings R1 and R3.
      - >-
        AMB-3 (zero rows in Z_D) is moot, because no compared instance has a
        zero row.
      - >-
        T_rank hashes are redundant with rank_4 once the encoding is known to
        coincide.
    informative_items_for_contrast: >-
      These items carry real signal because both sides match on values that
      vary:
      - s takes values 0, 1, 2, 4, 6 and 8, across three independent routes;
      - rank_4 and |Z_4| take 9 distinct values each on the targets;
      - T_rank match flags are mixed (24-25 true per reference);
      - one_in_R4 is mixed on the unsatisfiable arm;
      - the full-trace T_strict, T_set and T_ops hashes are equal on 105
        instances;
      - ops_strict takes 5 distinct values;
      - a_k agrees at 8015 steps across 3 references.

  j7_verdict:
    J7: holds
    rule_applied: >-
      CP-4 "holds if every compared quantity agrees". Every CP-2 item agrees for
      all 5 references and all 100 targets. There is no disagreement, so none
      needs localising. There is no encoding-only difference. No ambiguity was
      read differently by the two sides.
    what_it_does_not_mean: >-
      Agreement is evidence that the run's load-bearing quantities do not come
      from a producer-specific implementation defect at these 105 instances. It
      is NOT evidence against a misreading of the specification SHARED by both
      implementations. PD-R3 applies: the executor and the re-deriver ran on
      the same model (d04c5e A-3), so such a shared misreading would agree. The
      spec-literal object-fidelity check against the text is J1's, and this
      report does not substitute for it. J7 says nothing about D = 3, F-S3-REV,
      the null families, F-PLANT, F-RANDX, or the full-arm M1-M4 (PD-R4). It
      also says nothing about the sampling layer beyond the curve (PD-R2).

  verdict: passed
  verdict_scope: >-
    "passed" means that the J7 comparison receipt is admissible: CP-1 verified,
    every CP-2 item compared, and the comparator shown able to disagree. On
    J7, the re-derivation agrees with RUN-CERTBIN-3b7e05 on every compared
    quantity. It does not support an ECDLP claim, demonstrate a speedup,
    validate any DR verdict, or authorize promotion. Composition belongs to the
    Coordinator.

  limitations:
    - >-
      Shared-reading blind spot (PD-R3): both implementations come from the same
      model family and the same spec text. J7 detects implementation
      divergence, not shared misreadings.
    - >-
      Coverage: D = 4 only; 5 references and a 100-target subsample (positions
      10..1000 step 10) of F-S3; one curve (PD-R4).
    - >-
      The first-64 a_k list on the run side is a post-hoc impl/ recompute on the
      run's own op log, because the run archived only a0 and a_nonzero. It is
      bound to the run in two ways: the recompute matches every archived a0,
      a_nonzero, K_exact and K_rank, and it equals the run-time forms_a in the
      archived checkpoint.
    - >-
      The run-time checkpoint (checkpoint/p2-F-S3-D4.json.gz) was read as a
      SUPPLEMENTARY source. It lies inside the receipt-verified run package,
      but the card's file list does not name it. It is declared here and in
      attestation.yaml, and no conclusion rests on it alone.
    - >-
      Many items agree at a floor or ceiling (see floor_or_ceiling_items). Their
      agreement is weak evidence alone, and it is backed here by the non-floor
      hash and content agreement.
    - >-
      Dispatch: no goal_lanes claim for this task is visible in local refs.
      Fresh-context status cannot be verified from inside the session.
    - >-
      Hygiene disclosure: at session start, one `ls -R` of the review directory
      listed the FILE NAMES under reviews/TASK-20260923-29e7af/ and the
      directory name reviews/TASK-20260923-b8f163/. No file content under
      either was opened. See attestation.yaml.

  verification_computations_declared:
    trials: 0
    archived_instances_recomputed: >-
      3: the F-S3 references U1, U2 and U3. impl/ affine_forms was run on the
      run's own D = 4 op log. The card allows at most 20.
    other: >-
      sha256 of canonical JSON of archived run content: T_strict, op log, rank
      and the reconstructed T_set for the 5 references, and rank for the 100
      targets. impl/stats.py clopper_pearson was run on the 9 Q5 (x, n) pairs.
      None of this is an elimination or a new instance computation.
    budget: 4.4 s wall and about 229 MB peak for compare_j7.py, within the card's 10800 s and 4 GB.

  artifact_paths:
    - coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-5f9b82/comparison.json
    - coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-5f9b82/validation-report.yaml
    - coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-5f9b82/attestation.yaml
    - coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-5f9b82/checks/compare_j7.py
    - coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-5f9b82/checks/compare_j7.stdout.log
    - coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-5f9b82/checks/comparator_negative_control.py
    - coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-5f9b82/checks/comparator_negative_control.json
    - coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-5f9b82/checks/comparator_negative_control.stdout.log
  archived_by: TASK-20260923-918a6d
  attestation: coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-5f9b82/attestation.yaml
