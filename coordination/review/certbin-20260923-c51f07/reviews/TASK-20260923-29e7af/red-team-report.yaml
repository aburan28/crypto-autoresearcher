        under NA-5.
      DR-8: >-
        Bookkeeping. Primary cell F-S3, D = 4, T_strict. The D = 3 readings
        and the T_set, T_rank and T_ops readings are secondary.
    overturned_prior_parts:
      d: >-
        OVERTURNED at D = 4 only. The rank itself varies across targets
        (unsat 2659 to 2674; sat 2641 to 2674), so T_rank retention is at
        most 0.342 (unsat) for any reference. It is exactly the frequency of
        the reference's rank value (J4). The ordering T_strict <= T_set <=
        T_rank holds (0 <= 0 <= 0.342). At D = 3, T_rank retention is 0.991
        (modal, secondary), consistent with (d). The rank spread is
