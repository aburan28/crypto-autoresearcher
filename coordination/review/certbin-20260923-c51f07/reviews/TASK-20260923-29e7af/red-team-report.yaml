    structural_facts:
      - id: J4-F1
        fact: >-
          In F_2[t]/(t^17 + t^3 + 1), Tr(t^j) = 0 for j = 1..16, so Tr(x) =
          r_0. All 1000 F-S3 test targets and all 5 references have r_0 =
