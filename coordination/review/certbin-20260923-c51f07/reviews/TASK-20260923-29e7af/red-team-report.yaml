      e: >-
        OVERTURNED. See the "1 in R_4" block. At this cell, 324 of 386 (0.839,
        CP95 [0.799, 0.875]) non-degenerate unsat subgroup targets have 1 in
        R_4 under the declared multilinear Macaulay construction. 0 of 386 do
        at D = 3. PS2 is non-vacuous at D = 4 with 0 violations. The
