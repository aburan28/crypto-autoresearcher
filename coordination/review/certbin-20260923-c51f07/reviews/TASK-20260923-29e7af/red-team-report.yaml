      DR-5: >-
        "not applicable": retention_family = 0 lies outside (0.01, 0.5). No
        reading.
      DR-6: >-
        [T_set pruning, D = 4] At this cell the T_set-pruned D = 4 matrix
        (U1: 2672 rows x 3796 columns) takes 1,267,864 B dense, which is 5.43x
        the 233,472 B SM budget. Its CSR form takes 415,368 B, still 1.78x
        the SM budget. The 32 B per-system warp budget is exceeded by about
        4x10^4 (dense) or 1.3x10^4 (CSR). All references fall within
        1,266,915 to 1,267,864 B dense. Scope: this pruning (rows not in Z_4;
        nonzero columns of those rows) and these two storage formats at
        D = 4. Bit-sliced multi-system layouts and D = 3 are out of scope. At
