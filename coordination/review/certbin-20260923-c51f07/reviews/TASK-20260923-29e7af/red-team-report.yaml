        is a scope limit, not D* > 4 in any solver's sense.
      f: >-
        OVERTURNED on saving_strict (about 35, against the predicted [2, 10]).
        saving_set is 1.658 to 1.660, as the prior expected. GIVEN DR-1, this
        changes nothing for P-GPU. saving_strict prices a schedule whose
        fixed-schedule survival set is {x_R(ref)} alone (J4-F3), so no other
        attempt can realise it. The hybrid "replay the r-independent pivots"
        realises about 1x, because K_exact = rank or rank - 1. Resource
        reading: 35x is the row-XOR PENALTY that branch-free masked full
        elimination (C_4 R_4 = 11,836,352 full-row XORs) pays over the
        declared data-dependent elimination (331,893 to 352,418) at this
        cell. That is the constant a SIMD/GPU masked design must win back in
        throughput before it gains anything.
    one_in_R4:
      rates: >-
        Unsat arm, D = 4: F-S3 324/386 = 0.839 [0.799, 0.875]; F-S3-REV the
        same (row-permutation invariant, as required); F-RANDX 252/361 = 0.698
        [0.648, 0.745]; F-AFF-1/2/3 0/115, 0/126, 0/127; F-NULLF2 0/138 (CP95
        upper bounds 0.026 to 0.032). At D = 3: 0 everywhere except F-RANDX
        (1/361). Degenerate stratum (F-S3): 2/7, excluded from every arm
        statistic, so it cannot drive the rate. PS1 holds, with 0 sat
        instances in every family at both D.
      x_R_structure: >-
        Split by the position of x_R (own GF(2^17) code; j8-2e-split.json).
        F-RANDX unsat with x_R in x(2E): 87/103 = 0.845, indistinguishable
        from F-S3's 0.839 (z = -0.13). x(E) \ x(2E): 54/90 = 0.60. Twist:
        111/168 = 0.66. So 2E-membership of x_R MODULATES the rate but does
        not create it: off 2E it is still 0.60 to 0.66, against 0 in the
        nulls. Every subgroup target lies in x(2E), so 0.84 is the relevant
        rate for relation search at this cell.
      construction_artifact_excluded_by:
        - The nulls use the identical constructor, multilinearisation and field-equation handling on the same supports, and reach 0/115 to 0/138.
        - >-
          INDEPENDENT CERTIFICATES (j8_certificates.py, no impl import: own
          GF(2^17), own S_3 expansion, own multilinear products, own tracked
          GF(2) elimination). 17 of 17 sampled instances agree with the
          pipeline on both "1 in R_4" and rank_4. The sample: U1..S2, the
          first 6 flagged unsat targets by index, the first 3 unflagged unsat
          targets and the first 3 sat targets. All 9 flagged unsat instances
          yield an explicit lambda (1297 to 1378 rows mu*f_k with deg mu <=
          2), and sum lambda_i mu_i f_{k_i} = 1 is re-verified by XOR of the
          explicit row polynomials. Each is a machine-checkable proof of
          unsatisfiability. The 8 unflagged instances yield none. This
          partially discharges the PS0-vacuity gap on the unsat arm
          (sampled, not exhaustive).
        - >-
          EXACT S_3-SPECIFIC DEGREE FALL (derived here). With theta =
          x_R^-2, the bilinear parts of Tr(theta * S_3) cancel, so sum_k
          Tr(t^k / x_R^2) f_k = v_0 + v_9 + Tr(B / x_R^2) is LINEAR. This
          was verified on all 2210 curve-algebra instances (F-S3, F-RANDX and
          F-PLANT, targets and references) and fails on 600 of 600 F-AFF
          instances (j8-linear-consequence.json). This is consistent with the
          group-morphism mechanism that KN-LIT-7604 reports (provenance kb;
          that record is itself abstract-level, "reported"). This one linear
          equation does NOT by itself explain degree 4: the semi-regular
          series (1+z)^17/(1+z^2)^16 = 1, 17, 120, 408, 340, -2380 still gives
          D_reg 5 (derived arithmetic). The full mechanism is open.
      resource_check:
        examined: true
        reading: >-
          Three theories take this measurement as their HYPOTHESIS rather
          than their refutation.
          (1) PROPOSITION S / E3-STYLE LOCALISATION WITHOUT REPLAY. "1 in R_4"
          is a sound one-sided unsatisfiability certificate: 0 false rejects
          in every family, and 9 of 9 sampled instances yield an explicit
          verified certificate. A fixed-shape, branch-free masked D = 4
          elimination that reads ONLY the constant-column pivot bit would
          therefore reject 84% of unsat subgroup-target attempts at this cell
          and never reject a satisfiable one. It needs no trace, so DR-1 does
          not touch it. This is P-GPU's "divergence as signal" (E3) reduced to
          one bit. Its readout entropy, h(324/993) = 0.91 bit, is within P7's
          bound h(P_sat) + 0.1 = 1.06 by construction. COST, CHARGED: at m = 2 it is dominated by the
          run's own oracle A. Oracle A decides satisfiability and returns the
          solutions with 2^9 = 512 quadratic root-findings. The filter costs
          331,893 to 352,418 data-dependent full-row XORs of 4048 bits, or
          11,836,352 masked. Its value is therefore conditional on m >= 3 or
          the chained regime, where direct enumeration costs 2^{(m-1)l} and
          where the 1-in-R_4 rate is unmeasured.
          (2) SEMAEV'S ASSUMPTION 1 (KN-LIT-fa346d via KN-OPEN-d218ec,
          provenance kb): d_F4 <= 4 for k = ceil(n/m). THIS CELL LIES ON ITS
          DIAGONAL: m = t = 2, n = 17, k = 9 = ceil(17/2). A degree-4
          refutation for 84% of the unsat arm is the assumption's content
          working at this cell. It is not a test of the assumption. Macaulay
          D = 4 without reuse of degree-fallen polynomials is a weaker closure
          than F4 at step degree 4, so the 16% "not reached" is not a
          counterexample (KN-OPEN-d218ec gap (B)). One n is not a boundary;
          the unreproduced counter-data there is at n = 45.
          (3) KOSTERS-YEO STRUCTURAL LOW FIRST FALL DEGREE (KN-LIT-7604,
          reported). The linear consequence above is its degree-2 fall on
          these exact instances, and the 2E-modulation is consistent with a
          group-morphism mechanism. Consistent is not verified.
          Recommendation R-1 below is the cheapest test that reads the
          measurement as a resource rather than a verdict.
    other_readings:
      M4_saturation: >-
        H(T_strict) = log2 N EXACTLY in all 8 families at D = 4 (distinct =
