      HEUR-CERTBIN-TS1 as formally stated covers every pivot that is
      nonconstant over the sampled targets, and asserts hazard in [0.4, 0.6]
      for each. It is EXACTLY false at this cell on every repeated-form pivot
      that has survivors: 11 of 26 in P2, and 76 to 78 of 86 to 90 live
      r-dependent pivots per reference. This is not statistical. Its
      independence clause ("K_rank close to K") fails by construction: K_rank
      = 17 against K = 2668 to 2672. Its balance clause is consistent on
      every rank-increasing pivot measured: 15 of 15 in P2 inside [0.4, 0.6],
      and all 10 to 13 per reference inside their 99.9% bands. The frozen
      DR-4 label "not supported, not falsified" stands mechanically. It must
      not be read as "TS1 statistically inconclusive".
    restricted_P2_reading: >-
      A READING, NOT A RULE (RT-5). If P2 kept only rank-increasing pivots
      (modulo the curve targets' affine hull), the set would have 15 pairs,
      15 of 15 in band, median 0.4894. The DR-4 thresholds would then read
      SUPPORTED, and DR-2's consistency hazard clause would hold, so DR-2
      would read "E1 CONSISTENT", because its other two consistency clauses
      already hold (decision-rules.json). The same set results if r-dependence
      is taken over replay SURVIVORS. The impl already uses that basis for
      F-NULLF2 (engine.hazard_table over_survivors=True), per the spec's K
      note. The frozen M2 text uses all targets for the affine-route
      families. So one frozen word, "r-dependent (sampled)", is
      operationalised on two bases in the same run, and the basis alone
      decides DR-4 and DR-2. Changing it requires a versioned
      protocol_amendment, which is the Coordinator's call.
    binomial_tail_figure: >-
      implementation.md quotes 2.2e-13, from cell-summary M2 tail_extremes
      P_null_min_le_observed = 2.2382e-13. It is WRONG TWICE.
      (a) NUMERICALLY. It is floating-point roundoff: stats.binom_sf(1, 255,
