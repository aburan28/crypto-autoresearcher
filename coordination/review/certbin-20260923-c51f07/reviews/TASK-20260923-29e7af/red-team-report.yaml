        survives. Strict replay is falsified by DR-1. Under DEC-20260923-b85c30
        NA-5, T_set-level replay needs saving_set >= 1.5 AND T_set retention
        >= 0.5. The second conjunct fails by a wide margin: unsat T_set
        retention is 0 for every reference at D = 4, and at most 0.0052 at
