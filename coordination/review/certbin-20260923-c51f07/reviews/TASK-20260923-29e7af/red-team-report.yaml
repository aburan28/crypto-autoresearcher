          F-S3 target r vectors therefore has dimension 16. F-RANDX and
          F-PLANT have dimension 17. Source: j4-exact/curve-constraint.json.
      - id: J4-F2
        fact: >-
          EXACT HAZARD LAW. Let pivot k have a_k in span{a_j : j < k}, or in
          that span plus span{tau} on curve targets, with tau = e_0. Then e_k is
          constant on the survivors, and the constant is e_k(r_ref) = 1,
          because r_ref satisfies every earlier condition (self-replay). So
          h_k = 0 EXACTLY. The prior's "0 or 1" sharpens to 0: a hazard of 1
          cannot occur. A rank-increasing pivot is an exactly balanced affine
          form on the survivor subspace. On a finite curve sample,
          h_k is about 1/2 with sd 1/(2 sqrt S_k).
      - id: J4-F3
        fact: >-
