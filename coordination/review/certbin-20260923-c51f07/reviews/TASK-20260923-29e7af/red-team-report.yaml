          k=30. Every reference also has a pivot with a_k = tau exactly (k =
          2546; the modal also has k = 1821). That pivot is constant on all
          curve targets and nonconstant on uniform x. It accounts EXACTLY for
          K_exact - K_sampled = 1 (2 for the modal) on F-S3 and 0 on F-RANDX,
          as archived.
