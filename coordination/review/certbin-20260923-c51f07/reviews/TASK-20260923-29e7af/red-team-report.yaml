      instrument cannot resolve tails below about 1e-13.
      (b) CONCEPTUALLY. The null is misapplied. The zeros are forced
      (J4-F2), with probability 1 under the exact affine model, and 7 of the
      26 P2 entries duplicate others. No tail probability of any kind should
      be quoted for them.
