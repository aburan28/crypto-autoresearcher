        F-S3:modal replay is an identity.
      transfer_language: >-
        run-report.md states "No transfer beyond this cell is claimed. Any
        statement about n = 131 would be extrapolation resting on the
        untested HEUR-CERTBIN-TS3". "P-GPU" appears only as "STRICT P-GPU
        FALSIFIED at this cell" and in P7's criterion. No inflation was
        found. The evidence record must keep "at this cell" attached to every
        P-GPU sentence.

  objections:
    - id: OBJ-1
      joint: J4
      text: >-
        The evidence record must not read DR-4 or DR-2's hazard clause as a
        statistical result about TS1. Record instead: TS1's independence
        clause fails exactly (11 repeated forms in P2; K_rank = 17 against K
        about 2670), and its balance clause holds on 8 distinct low-weight
        forms. Keep the frozen labels. Give both readings.
    - id: OBJ-2
      joint: J4
      text: >-
        The "tail probability 2.2e-13" in implementation.md and cell-summary
        M2 tail_extremes is floating-point roundoff. The exact value under the
        stated null is 8.34e-75, and that null is misapplied anyway. Cite
        neither. Record that stats.binom_sf cannot resolve tails below about
        1e-13, so the spec's tail check "extreme hazards against binomial
        extremes" was numerically incapable of reporting the true figure.
    - id: OBJ-3
      joint: J4
      text: >-
        TS1's random-model transfer fails exactly in one direction. Subgroup
        x-coordinates satisfy Tr(x_R) = r_0 = Tr(A), a hyperplane, not
        uniform r. Consequences: K_sampled undercounts K_exact by the pivot
        with a_k = tau; one DEP_TAU pivot per reference is forced to 0 on
        curve targets only; and the "predicted retention 2^-K_rank" is not
        the curve-target figure. The survival set is a single point in either
        case. The cheapest experiment exposing it is to compute Tr(x_R) on
        the target file; it shows 1000 of 1000.
    - id: OBJ-4
      joint: J4
      text: >-
        The P2 statistics pool identical measurements. U1, S1 and S2 share
        their first 20 forms, and U2 shares a_0. The 15 in-band pairs are 8
        distinct measurements. Any pooled fraction or null must count
        distinct (form, survivor-set) pairs.
    - id: OBJ-5
      joint: J8
      text: >-
        DR-7's "T_set replay not closed" must be recorded with NA-5's failed
        retention conjunct (T_set unsat retention 0 at D = 4): T_set-level
        replay does NOT survive at this cell. This bears directly on
        NA-5/NA-6's Stage 2 versus Stage 3 rerank. By NA-5's own text,
        Stage 2 (regime B) is then the only remaining route for P-GPU.
    - id: OBJ-6
      joint: J5/J8
      text: >-
        DR-1's evidence sentence must cite f_div (first divergence at step 0
        or 1), not retention alone. Whole-trace retention is also 0 on O2,
        which has a 93.1% invariant prefix.
    - id: OBJ-7
      joint: J8
      text: >-
        The "1 in R_4" observation must be scoped to: this cell; the
        Macaulay D = 4 closure (not F4 step degree); subgroup (x(2E)) targets,
        where the rate is 0.839; 0.60 to 0.66 off 2E; 0 in the nulls. It must
        not be written as "S_3 systems are refuted at degree 4" or as
        evidence for or against Semaev's Assumption 1.
    - id: OBJ-8
      joint: J8
      text: >-
        Overturned (f) must be read as the branch-free penalty (about 35x in
        row XORs), not as a replay gain. No replay design can realise it at
        this cell (J4-F3).
    - id: OBJ-9
      joint: J8 (baseline)
      text: >-
        dominated_by names rho and the uncompared FES and WDSat. It omits the
        closest specialised per-attempt baseline, which the run itself
        implemented: oracle A, O(2^l) = 512 quadratic root-findings per
        attempt. At m = 2 it dominates the D = 4 Macaulay solve for both
        deciding satisfiability and extracting solutions. The producer's
        claim "no per-attempt Pareto claim is made" is honest. Any resource
        reading of "1 in R_4" must add this row.
    - id: OBJ-10
      joint: pointer for J2's owner (not ruled on here)
      text: >-
        By J4-F3, C-UNIF cannot fail at this cell. The survivor count is 0
        by construction for every F-RANDX own reference, and the 99.9%
        interval is [0, 1]. The spec's purpose for it ("checks the sampler
        and the rank computation") is not served at K_rank = n = 17 with N
        about 1000. The same holds for the independence tail check (measured
        retention, product of survivals, 2^-K_rank): all three are
        determined.

  required_controls:
    - id: RC-1
      what: >-
        Before the "1 in R_4" rate enters any closure or ranking, run a D = 5
        (or iterated-D4 / mutant-XL) closure on the 62 ARCHIVED F-S3 unsat
        instances marked "not reached at D <= 4", and on 62 sat instances as
        the PS1 control. This needs no new sampling. It decides whether the
        16% is an artifact of the Macaulay-definition closure or a genuine
        D* > 4, which is exactly KN-OPEN-d218ec's definitional gap (B) at a
        shared cell.
    - id: RC-2
      what: >-
        Any successor hazard test should define its evaluation set over
        rank-increasing pivots, modulo the target family's affine hull, and
        count distinct forms. That goes in a new contract or a versioned
        protocol_amendment, never retroactively.
    - id: RC-3
      what: >-
        Any successor use of a binomial tail must be computed in exact or
        log-space arithmetic (stats.binom_sf saturates at about 1e-13).

  counterexample_or_mutation: >-
    O2, the constant-column mutation of E^0 (seed 0x29e7af). It has a provably
    invariant 2323-step prefix (93.1% of the trace), which the instrument
    reproduces exactly, and whole-trace T_strict retention 0. It is a
    counterexample to reading M1 = 0 as "unstable from the first step". It is
    not a counterexample to DR-1, which concerns whole-trace strict replay.

  baseline_comparison: >-
    Toy tier; sota_delta 0 stands. Group-order arithmetic at this cell (q =
    32603, derived, not measured): parallel rho needs about sqrt(pi q / 4) =
    160 group operations, and BSGS about 2 * ceil(sqrt q) = 362. The WHOLE
    discrete logarithm therefore costs less than one D = 4 Macaulay relation
    attempt, which takes about 3.3 x 10^5 data-dependent full-row XORs of
    4048 bits. Index calculus would also need on the order of |F_V| / 2,
    about 242 relations (|F_V| = 483 counts both signs). Closest specialised per-attempt baseline: oracle A (2^9 quadratic
    root-findings), which dominates the Macaulay solve at m = 2 (OBJ-9). The
    van Oorschot-Wiener interpolation is not applicable, because no exponent
    or memory trade-off is claimed. dominated_by was checked against rho
    (time and memory), BSGS (time) and oracle A (per attempt). The
    producer's statement holds, with the OBJ-9 row added.

  heuristic_challenges:
    - heuristic: HEUR-CERTBIN-TS1
      challenge: >-
        Numbered and formally stated. Its random-model justification ("a
        nonconstant affine form is balanced on F_2^17") is correct for
        uniform r, but the object is not uniform. Subgroup x_R lie on r_0 =
        Tr(A) (OBJ-3), and the forms repeat (OBJ-1). The formal statement
        quantifies over pivots whose conditional hazard is determined by
        linear algebra, so it is exactly false on them. Tested scale: n = 17
        only. Validation evidence: 8 distinct forms, all supported on bits
        r12..r16.
    - heuristic: HEUR-CERTBIN-TS4 (read partially)
      challenge: >-
        The observed D* is {4: 324, "not reached": 62} over 386. The
        falsification condition (two values in {3, 4} each above 5%) cannot
        fire, and the >= 95% concentration is not reached at D <= 4. TS4 is
        neither supported nor falsified at this cell, and the run report does
        not claim otherwise.
    - heuristic: HEUR-CERTBIN-TS3
      challenge: Untested, as disclosed. Every sentence beyond n = 17 rests on it.

  cost_model_challenges:
    - >-
      saving_strict (about 35) is the saving of an unrealizable replay
      (J4-F3). The realizable constant at this cell is at most 1 for any
      replay (T_set retention 0, and hybrid K_exact = rank). The branch-free
      masked design pays about 35x the row XORs of data-dependent
      elimination.
    - >-
      Any "1 in R_4" filter must charge the full D = 4 elimination per attempt
      against oracle A's 512 root-findings (OBJ-9). The precomputation of the
      linear consequence (theta = x_R^-2) is cheap, one inversion, but
      removes only one variable.
    - >-
      Per-attempt cost times inverse success probability: not applicable. No
      relation-cost claim is made, and none should be derived from this cell.

  reduction_and_scope_challenges:
    - No reduction or corollary is claimed. None is instantiated.
    - >-
      Scope inflation risk sits in the evidence text, not in the run package:
      "P-GPU falsified" without "strict" and "at this cell"; "T_set replay
      not closed" read as survival; "1 in R_4" generalised beyond the
      Macaulay D = 4 closure, subgroup targets or n = 17. No deployed or
      Certicom curve is affected, and none is claimed to be.

  proof_architecture_challenges:
    - >-
      Proposition S (C1). Quantifier order: for all unsat references with 1
      in R_{D*}, and all sat instances, T_set differs at D*. It is exact, and
      it held operationally: PS1 had 0 violations in 8 families x 2 D, PS2
      had 0 violations where non-vacuous, and 9 explicit certificates were
      independently verified.
    - >-
      Observation-fiber attack on the trace statistic M1. One fiber (M1 = 0)
      contains both F-S3 (diverging at step 0) and O2 (93% invariant). The
      missing separator is f_div, which the instrument already reports.
    - >-
      Nearby-object attack on "1 in R_4". The same-support nulls give 0 at
      D = 4, and the S_3-specific ingredient is exhibited: the exact degree
      fall at 2 plus the 2E-modulation. The full mechanism is still open,
      because one linear equation leaves D_reg at 5 in the semi-regular
      model.

  narrowest_supported_statement: >-
    At n = 17, m = 2, l = 9, one curve (A = 97044, B = 126251, h = 4, q =
    32603), with the declared D = 4 multilinear Macaulay elimination, the
    following holds.
    (a) No unsat subgroup target shares the whole-trace T_strict, T_set or
        T_ops of any unsat or modal reference; divergence begins at step 0
        or 1. The fixed-schedule replay of each reference survives on
        exactly one x_R, its own.
    (b) The replay-hazard statistics behind DR-4 and DR-2 are exact linear
        algebra: 11 of 26 P2 hazards are forced to 0 by repeated pivot
        forms, and the 15 rank-increasing ones (8 distinct forms on bits
        r12..r16) are balanced.
