    what_DR4_is_a_property_of: >-
      Under balance, the S_k >= 200 cut at N = 993 admits exactly 3
      rank-increasing pivots per reference: 993 -> ~497 -> ~248 -> ~124. That
      gives n_IND = 15 over the 5 declared references. The in-band fraction
      is therefore 15 / (15 + n_rep), where n_rep is the number of repeated
      forms before each reference's fourth rank-increasing pivot. DR-4
      returns SUPPORTED iff n_rep <= 1, FALSIFIED (median < 0.2) iff n_rep >=
      16, and "not supported, not falsified" for 2 <= n_rep <= 15. Observed
      n_rep = 11. So DR-4 is a three-way threshold on an exact
      linear-algebraic count, the independence structure of the references'
      early op logs. Its only statistical content is the balance of the 15
      IND pairs. Those are 8 DISTINCT (form, survivor-set) measurements,
      because U1, S1 and S2 contribute identical triples and U2 shares a_0.
      All are single bits or low-weight sums of r12..r16. This is not "fixed
      whatever TS1's truth". It measures TS1's independence clause exactly,
      and TS1's balance clause only on those 8 forms.
