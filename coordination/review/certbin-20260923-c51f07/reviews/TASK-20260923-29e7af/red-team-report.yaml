          D, so the fixed-schedule replay's survival set is EXACTLY the one
          point r = x_R(ref). This was solved explicitly for all 6 D = 4
          references; each solution equals r_ref (predictions-D4.json).
          Fixed-schedule (and hence T_ops) retention is therefore 0 by identity
          on any target set that excludes the reference's x_R. F-RANDX target
          786 surviving the F-S3 modal replay is this identity, since x_R =
          88878 in both. The C-UNIF comparison with 2^-17 * N (N = 995,
          expected 0.008, 99.9% interval [0, 1]) cannot fail at this cell,
          because F-RANDX's own reference x_R are excluded from its targets by
          construction. This is noted for J2's owner, not ruled on here.
      - id: J4-F4
        fact: >-
          PER-REFERENCE STRUCTURE, over all pivots with S_k >= 1 (86 to 90 per
          reference; allpivots-D4.json). 76 to 78 are forced zeros (DEP or
          DEP_TAU), all with h_k = 0 exactly. 10 to 13 are rank-increasing,
