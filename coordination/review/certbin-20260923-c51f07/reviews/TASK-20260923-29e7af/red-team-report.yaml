          S_3 with it (DR-3 E2 FALSIFIED; M3 not estimable). "1 in R_D" on a
          satisfiable instance: 0 in all 8 families at both D (at D = 4:
          F-S3 0/607, F-S3-REV 0/607, F-PLANT 0/200, F-RANDX 0/634, F-AFF
          0/878, 0/867, 0/866, F-NULLF2 0/862). INV-4 is not triggered.
        signature_met: true
    J5_verdict_basis: >-
      No object reproduces the failure signature. The instability verdicts are
      measured by the instrument, not manufactured by it.

  # ---------------------------------------------------------------------------
  # J8 -- SCOPE AND READING OF THE VERDICTS
  # ---------------------------------------------------------------------------
  J8:
    cell: >-
      n = 17, f = t^17 + t^3 + 1; m = 2; l = 9, V = {deg < 9} in the
      polynomial basis; one random ordinary curve Y^2 + XY = X^3 + AX^2 + B
      with A = 97044, B = 126251, #E = 130412 = 4 * 32603. D = 4 is primary;
      D = 3 is secondary (DR-8). Solver: the declared fixed-shape multilinear
      Macaulay matrix (2924 x 4048 at D = 4), with the declared row order,
      descending degrevlex column order (constant last) and column-major
      smallest-original-row pivot rule. Targets: 1000 subgroup x_R (993
      non-degenerate; 386 unsat, 607 sat), sampled without replacement, about
      6% of the roughly 16.3k subgroup x-values. References: 3 unsat, 2 sat
      and the modal.
    transfer_assumptions_named:
      - TA-1: nothing transfers to other n without HEUR-CERTBIN-TS3, which is untested (no n-ladder).
      - TA-2: one curve. The cross-curve behaviour is untested, and h = 4 here.
      - TA-3: one V (the polynomial-basis coordinate subspace). The random-V replicate is Stage 3.
      - TA-4: one row order plus its reversal (F-S3-REV), one column order and one pivot rule. Other elimination rules are untested.
      - TA-5: the Macaulay/XL trace only. Nothing transfers to F4 critical-pair traces (Joux-Vitse replay).
      - TA-6: regime A only (descent to F_2 with field equations). Regime B is Stage 2.
      - TA-7: subgroup targets have r_0 = Tr(A) (x(2E)). Any statement about uniform x_R needs F-RANDX, not F-S3.
    narrowest_statements:
      DR-1: >-
        [T_strict, D = 4, primary] At this cell, 0 of 386 non-degenerate unsat
        subgroup targets share the T_strict of U1, U2 or U3, and 0 of 347 share
        the modal's (CP95 upper bounds of about 0.95% and 1.06%). So STRICT
        whole-trace replay of one learned reference trace is falsified for
        the unsat arm AT THIS CELL. First divergence is at step 0 or 1
        (median f_div 0.00037). At the T_ops/fixed-schedule level, retention
        0 is an identity (J4-F3: the survival set is {x_R(ref)}), not a
        sample statistic. Says nothing about masked trace-free elimination,
        T_set-tolerant designs, other n, other curves, m = 3 or regime B.
      DR-2: >-
        [T_strict + P2, D = 4] "between". Retention 0 <= 0.01 holds; the M3
        clause is "not evaluable" and so holds; the P2 hazard clause (57.7% <
        90%) fails. The failing clause is decided by 11 exact repeated-form
        zeros (J4), not by any departure from balance. No falsifying clause
        fires. Narrowest reading: at this cell E1's retention prediction is
        met, E1's M3 clause is untestable (0 vs 0), and E1's hazard clause
        fails only through its independence content. Under a rank-increasing
        P2 (a reading) E1 would read CONSISTENT.
      DR-3: >-
        [T_strict, D = 4] "E2 FALSIFIED", through the retention disjunct:
        retention_family 0 < 0.5. The M3 >= 10 clause is untestable (0 vs 0).
        E2's mechanism fails directly as well. There is no r-independent
        block: every reference's first r-dependent pivot is step 0, and
        K_exact is 2670 to 2672 of rank 2670 to 2672 (a_k = 0 on at most one
        pivot). The O2 control shows what such a block would look like (a
        93% invariant prefix). F-S3 has none. Scope: this cell.
      DR-4: >-
        [fixed-schedule replay, P2, D = 4] "not supported, not falsified" is
        the mechanical output of a three-way threshold on n_rep, the number
        of repeated pivot forms (J4): 2 <= n_rep = 11 <= 15. Narrowest
        reading: TS1 as formally stated is exactly false at this cell on
        every repeated-form pivot with survivors. Its independence clause
        fails by construction (K_rank = 17 against K about 2670). Its balance
        clause is consistent on the 8 distinct rank-increasing forms in P2,
        and on all rank-increasing pivots with survivors (99.9% bands). Those
