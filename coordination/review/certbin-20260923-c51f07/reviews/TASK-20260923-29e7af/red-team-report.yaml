      shared_x_R: >-
        7 F-RANDX targets share an x_R with an F-S3 target (idx 16, 73, 567,
        679, 786, 943, 961; o3-j8-tallies.json). Only the SECONDARY
        F-RANDX-versus-F-S3 cross-scores are touched. M1..M4, M3's
        denominators (F-AFF, paired F-S3 r) and C-UNIF (analysis.py lines
