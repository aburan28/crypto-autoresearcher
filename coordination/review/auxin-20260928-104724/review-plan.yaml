      Run python3 tools/check_review_independence.py --plan
      coordination/review/auxin-20260928-104724/review-plan.yaml --reports
      coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-104724/reviews/ and
      record the result in DEC-20260928-c4f3dc whatever it is. Confirm the
      pre-dispatch blind-phase record exists in TASK-20260928-e46f76's receipt.
    keys:
      K-approve: >-
        All of: every joint holds; RJ1/RJ2 and RJ5 agree on every QB1 to QB4
        value within tolerance; no open material choice; every PTM meets its
        failure signature; every coverage item has a discharging or declaring
        span its owning joint reports as holding; no regression; no tripwire;
        the independence check passes. DEC-20260928-c4f3dc then approves
        AMD-EXP-AUXIN-7e2e3d-20260928-gated, together with the fields of
        AMD-20260927-narrow and AMD-20260926-typed it incorporates by hash,
        under the AGENTS.md standing user authorization, and may move
        H-AUXIN-6db354 from proposed to approved as its status_note provides.
        Its first next action opens an execution batch whose first card
        provisions and admits the declared tools per
        dispatch_preconditions_carried. Approval asserts nothing about any curve.
      K-revise-defect: >-
        Any joint breaks on any coverage item, or the draft omits a field
        approval requires. Decision revise; each defect listed with its joint
        and breaking artifact. Unless K-layer-outcome also fires, the next
        selection point re-reads the switch conditions of the BATCH-104724
        ranking before choosing a scope.
      K-regression: >-
        Anything in R-NJ1, R-NJ2, R-NJ3, R-D2D3, R-D4 or R-D7D10 breaks.
        Decision revise, named separately from new defects. A K-regression
        reopens the whole ranking.
      K-indeterminate: >-
        RJ1/RJ2 and RJ5 disagree on any value beyond tolerance, or either
        reports a choice the text leaves open that affects a reported quantity
        or a run-time decision. Decision revise. A choice the text explicitly
        declares immaterial with a reason does not fire this key unless an
        implementation found that it changes a value.
      K-layer: >-
        Literal reading, carried: RJ3 breaks on GT-2 in the sense "a field with
        no single governing text", or on GT-1 (incorporation by hash ruled not
        approvable). Decision revise; the switch condition to option 2 has
        fired.
      K-layer-outcome: >-
        ADDED. The alternative reading DEC-20260927-f680f7 disclosed, adopted
        prospectively. Fires when ANY of: (a) RJ3 finds an older-layer clause
        whose tested outcome changes under a new span without being superseded
        (the DF-N1 class, anywhere); (b) RJ1 or RJ5 finds two admissible
        outcomes for gate 1 and N4 on any C-BOUND or constructed NEAR_FLOOR
        BOUND state; (c) DF-N1 or DF-N2 is not discharged. Decision revise, and
        the decision records that the narrow lineage has ended: the next
        selection point takes option 2 (RS-B) without re-ranking S-narrow.
        Option 1 stays subject only to its own switch conditions.
      K-executed-layer: >-
        RJ2 finds an executed-layer defect (pin, locator, FP, tool interface or
        timeout), whether or not the draft touched the field, while RJ1, RJ3
        and RJ4 hold. Decision revise; the switch condition to option 1 has
        fired.
      K-provision: >-
        Engages only if RJ2 (iii) must re-execute a touched executed field and a
        declared tool is absent from the base environment. The reviewer installs
        the declared version under scratch and runs the gate as written. If the
        gate then determines admission, RJ2 reads on the text and the absence
        stays a dispatch precondition. If provisioning fails even under
        scratch, K-infra applies to RJ2 and the switch condition to option 1
        has fired.
      K-hypothesis: >-
        The design report, RJ3 or RJ4 finds that H-AUXIN-6db354 cannot carry
        the protocol without change. Composition files a correction or a
        successor hypothesis whose id is minted by the top-level session and
        added to TASK-20260928-920191 and TASK-20260928-a479b2 by a recorded
        queue revision BEFORE the record is written.
      K-route-switch: >-
        RI-1 as governed after the draft shows enough falsification conditions
        retired or demoted that the amendment no longer tests the same
        hypothesis. Decision revise; the switch condition to option 2 has fired.
      K-infra: >-
        A reviewer could not run a joint (tool not installable, environment
        failure, budget exhausted). That joint reads inconclusive; no approval
        while RJ1, RJ2 or RJ5 is inconclusive. Never negative evidence about the
        draft's mathematics or any curve.
      any_tripwire: See tier.tripwires. Composition stops and routes to review-breakthrough.
    h_correction_note: >-
      The H-AUXIN-6db354 interpretation_limits correction (DEC-20260926-96f970
      next_actions item 2) is NOT folded into this batch by this plan. It may
      be folded in only by a declared queue revision with a session-minted id
      before any writing; this plan does not edit H-AUXIN-6db354.

