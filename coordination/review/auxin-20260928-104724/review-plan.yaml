      Every other field is incorporated from AMD-20260927-narrow by the sha256
      above (and through it from AMD-20260926-typed), and is not retyped,
      paraphrased or restated.
      (5) It carries a governing-text table over four layers (frozen v1,
      typed-by-hash, narrow-by-hash, new corrective) under which a reader names
      the single governing text for every field without choosing, and a READER
      MAP: for every span it supersedes or adds, every clause in every older
      layer that reads the field, with that clause's outcome under the new text.
      (6) It touches no executed-layer field (pins, locators, FP, tool
      admission, timeout); or, if it does, it re-executes each touched item
      against the pinned sources and declared builds before submission and
      archives the transcripts with the draft.
      (7) Nothing that held in REVIEW-AUXIN-20260927-7b6678 regresses (NJ1, NJ2,
      NJ3; R-D2D3, R-D4, R-D7D10), the amendment is one new additive file, and
      DEC-20260927-f680f7 dispatch_preconditions_carried stays a precondition
      of any future executor card.
