  proves_too_much:
    assigned_to: TASK-20260928-fa61f4
    objects:
      - {id: PTM-A, object: "The inert-on-both-branches prime of the TASK-20260922-0e10d1 PTM-2 construction, rebuilt from the construction", known_truth: "Neither r - 1 nor r + 1 carries a useful divisor."}
      - {id: PTM-B, object: "The brainpoolP384r1 field prime presented as r, under the governing FP definition", known_truth: "It is not the order of the curve's prime subgroup."}
      - {id: PTM-C, object: "Uniformly random primes at 256 bits and at one other frozen-row size; sampler and seed declared in computations.json before evaluation", known_truth: "They carry no curve-specific structure."}
      - {id: PTM-D, object: "A toy prime r with r + 1 having a divisor d strictly greater than sqrt(r)", known_truth: "The r + 1 cost at that d is at least d."}
      - {id: PTM-E, object: "A constructed prime with known factorisation of r + 1 presented under a declared state with two or more composite parts unfactored", known_truth: "The branch value is unknown to the pipeline; the true minimum lies inside any correct bound pair."}
      - {id: PTM-F, object: "An evaluator that reports a wrong bin_at_least on a NEAR_FLOOR BOUND C-BOUND state and is otherwise correct", known_truth: "The evaluator is incorrect."}
      - {id: PTM-G, object: "Evaluator E0 of RT-20260927-730157 (correct under the typed text, silent on bin_at_least at NEAR_FLOOR BOUND), run on BND-1 and BND-3", known_truth: "Under the corrected text it is not a correct evaluator, so it cannot both pass the valid-table condition and be read as meeting N4."}
    failure_signature: >-
      A correct draft keeps each known-false conclusion out of reach in its
      RULES and in its corrected prose: PTM-A not flagged on either branch;
      PTM-B rejected by the confounder before any factoring; PTM-C given the
      same categories as a deployed row, with no category read as
      curve-specific or family-caused; PTM-D cost at least sqrt(r); PTM-E
      reported BOUND, never EXACT, with the fixed witness, a bracketing bound
      pair and a defined bin_at_least; PTM-F FAILS C-BOUND gate 1 (an evaluator
      the rules cannot tell from a correct one is the DF-N1 gap); PTM-G gets
      exactly one outcome and is not certified as valid.
    how_to_run_it: >-
      REVIEW COMPUTATIONS. They mint no RUN-*, write no evidence record, run no
      Cheon algorithm, generate no [x^i]P, and never execute
      experiments/EXP-AUXIN-7e2e3d/implementation/driver.py as an experiment.
      Every script, seed and output goes in computations.json.

