blind_inputs:
  task_id: TASK-20260928-7cb2a6
  review_plan_id: REVIEW-AUXIN-20260928-104724
  written_by: TASK-20260928-338938, before the draft existed
  sources_of_recipes:
    new_corrective: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260928-gated.yaml
    incorporated_by_hash_layer_2: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260927-narrow.yaml
    incorporated_by_hash_layer_1: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
  source_note: >-
    The new corrective declares which spans it supersedes and incorporates the
    second file by sha256; the second file incorporates the third by sha256.
    Before anything else, hash the second and third files and compare each
    with the digest the file above it states; report a mismatch under Q0 and
    stop. Use the new corrective's governing-text table to decide which file
    governs each field you use. If that table sends a field you need to any
    fourth file, do NOT open it: record the reference under Q0 and continue
    with what the three files state.

  what_you_are_testing: >-
    Whether the corrected C-BOUND rules and the threshold inventory, read
    together with the incorporated text, are fully determined. You are not
    asked whether they are good choices. Your results will be compared with a
    second implementation written by someone who shares nothing with you.

  quantities:
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which the text left you a choice, including: which of
        the three files governs a field or span; a search start, step order,
        primality test, acceptance rule, tie-break, rounding rule, tolerance
        type, counting convention, gate evaluation mode, unit; or a reference
        to another file. Quote the text, list admissible readings, and name the
        quantities below that depend on the choice. If the text declares a
        choice immaterial, quote that and say whether any value you computed
        depends on it.
      report: A list. An empty list is a result and is stated as such.
    QB1:
      name: C-BOUND states, gate 1 and N4
      definition: >-
        For each C-BOUND construction-control state the governing text declares
        (BND-1, BND-2 and BND-3, including every state that is a BOUND value
        binning NEAR_FLOOR): build the state from its recipe, then report
        status, witness, witness set, bin, bin_at_least and boundary_flag under
        the governing text. Then evaluate C-BOUND gate 1 and falsification
        condition N4 on that state. Finally say whether the governing text
        yields exactly one outcome for gate 1 and N4 TOGETHER on that state;
        if it admits two, give both and the clause that allows each.
      report: >-
        Per state: the fields above, both bounds as log2 to four decimal
        places, gate 1 outcome, N4 outcome, determinacy (one outcome or two),
        and the clauses that decided each. Any integer the recipe requires to
        be prime carries a primality certificate.
      tolerance: exact on every categorical field and outcome; bounds 0.01 bit
    QB2:
      name: a NEAR_FLOOR BOUND state of your own
      definition: >-
        Construct one declared state of your own in which a branch is a BOUND
        whose value bins NEAR_FLOOR, state it fully, and report everything QB1
        asks for on it.
      report: As QB1, plus the full statement of your state.
      tolerance: as QB1
    QB3:
      name: gating check
      definition: >-
        For every state in QB1 and QB2, evaluate C-BOUND gate 1 twice more:
        once with bin_at_least absent from the evaluator's report, and once
        with bin_at_least set to a bin other than the one the rules return.
        Report pass or fail for each.
      report: Per state, two pass or fail results and the clause that decided each.
      tolerance: exact pass or fail
    QB4:
      name: threshold inventory as you find it
      definition: >-
        List every numeric cut-off, threshold and gate stated in the three
        files, with the quantity it reads, the file it is stated in and a span
        anchor (the key path, or a verbatim quotation of at most one line).
        Then say whether the new corrective's inventory claims completeness,
        and list every cut-off you found that its inventory omits. Where the
        governing-text table sends a cut-off to a file you may not open,
        record the reference under Q0 instead.
      report: A table of (cut-off, quantity read, file, anchor); the completeness claim quoted or "none"; the omitted list.
      tolerance: exact set equality on (cut-off, quantity read, file)

  rules:
    - BL-1 Read ONLY the eight whitelisted paths on your card. Every other path is out of scope, including the producer's design report and any transcript.
    - BL-2 Run no git command that shows history (log, show, blame, diff) and read no pull-request text.
    - >-
      BL-3 Choose your own libraries and algorithms and name them with
      versions. Published mathematics from outside the repository is allowed
      and cited with provenance. Transcribe no integer from any source other
      than the recipes' own declared constants.
    - BL-4 If a permitted file contains a value that looks like an already-computed answer to QB1 to QB4, STOP and report a leak.
    - BL-5 Report on RJ5 only. No verdict on the file as a whole.
    - BL-6 ZERO experiment runs. No Cheon algorithm, no [x^i]P. This is an independent computation.
    - BL-7 Write nothing outside your write scope. Every script, command and raw output goes in computations.json.
    - BL-8 List every path you opened under review_attestation.sources_read and set blind_from_respected true only if it is true.

  verdict_rule_for_your_attestation: >-
    Put your verdict under `verdicts` as {RJ5: inconclusive}. It is
    inconclusive by design, because you are forbidden to compare. Report Q0 and
    QB1 to QB4 in full; the composing Coordinator compares them under the
    plan's keys.
