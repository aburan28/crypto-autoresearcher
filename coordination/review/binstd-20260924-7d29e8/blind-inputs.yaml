blind_inputs:
  task_id: TASK-20260924-624abf
  review_plan_id: REVIEW-BINSTD-20260924-7d29e8
  sources:
    fips_binary_curves: inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md (with its source_record.yaml)
    ecc2k_130: inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md and ecc-challenge-info-index.html (with source_record.yaml)
    ansi_x962_c2pnb: >-
      Not in your whitelist. Retrieve the primary ANSI X9.62 curve parameters
      (or a primary standard that reproduces them verbatim and says so) from
      outside the repository and record provenance retrieved with the exact
      document and section. If you cannot reach a primary source, record the row
      as not computed with the reason. Never use a secondary dump or recall.
  source_note: >-
    These sources and your own handoff card are your ONLY sources. If one of them
    refers to a repository file, do NOT open it; record the reference under Q0.

  what_you_are_testing: >-
    Whether a six-value multiplicative-order census and eleven divisibility
    verdicts are determined by elementary arithmetic and primary curve
    parameters. A second implementation, written by someone who shares nothing
    with you, will be compared with yours afterwards.

  quantities:
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which your sources left you a choice: which printed
        parameter is the subgroup order, a curve naming mismatch between a
        standard and the row label below, the smallest field of definition of a
        curve, the value of k, a reference to another file. For each: quote the
        text, list the admissible readings, and say which quantities depend on it.
      report: A list. An empty list is a result and must be stated as such.
    Q1:
      name: multiplicative order of 2 modulo n
      n_values: [131, 163, 233, 283, 409, 571]
      definition: >-
        For each n, the least positive integer e with 2^e = 1 mod n. Also state
        whether n is prime.
      report: >-
        Per n: e, the factorisation of n - 1 you used, and a one-line check a
        reader can repeat (the powers of 2 you evaluated at each maximal proper
        divisor of e's candidate).
      tolerance: exact
    Q2:
      name: k divides r - 1, at eleven standardized rows
      rows:
        - c2pnb176v1
        - c2pnb208w1
        - c2pnb272w1
        - c2pnb304w1
        - c2pnb368w1
        - ECC2K-130
        - K-163
        - K-233
        - K-283
        - K-409
        - K-571
      row_label_note: >-
        The row labels are the program's. If the primary standard names a curve
        differently (a v1 versus w1 suffix, for example), record the mismatch
        under Q0 and say which curve you used.
      definition: >-
        For each row, let r be the prime order of the subgroup the standard's
        base point generates, read from the primary source. Let F_q be the
        smallest field over which the curve's equation is defined (verify it
        from the coefficients yourself, do not assume it) and F_(q^k) the field
        the curve is used over, so that k is the order of the q-power Frobenius
        endomorphism. State whether k divides r - 1.
      report: >-
        Per row: the source (document, section, provenance), r in decimal and
        its bit length, the extension degree m, the smallest field of definition
        and how you established it, k, and the verdict TRUE, FALSE or NOT
        COMPUTED with the reason.
      tolerance: exact

  rules:
    - BL-1 Read ONLY the ten whitelisted repository paths on your card. Every other repository path is out of scope.
    - BL-2 Run no git command that shows history (log, show, blame, diff) and read no pull-request text.
    - >-
      BL-3 Choose your own libraries and algorithms and name them with versions.
      Do not transcribe an order, a k or a verdict from any source; compute it.
      Curve parameters are read from a primary source, never recalled.
    - >-
      BL-4 If you find, in a source you were permitted to read, a value that looks
      like an already-computed answer to Q1 or Q2, STOP and report a leak.
    - BL-5 Report on J5 only. Give no verdict on the contract or the hypothesis, which you have not read.
    - BL-6 ZERO experiment runs. Instantiate no curve beyond reading its parameters; this is arithmetic.
    - BL-7 Write nothing outside your write scope. Put every script, command and raw output inside computations.json.

  verdict_rule_for_your_attestation: >-
    Your review_attestation verdict on J5 is inconclusive by design: you are
    forbidden to compare. Report Q0 to Q2 in full; the composing Coordinator
    compares them with the contract's frozen table under the plan's keys.
