  reviewer_tasks: [TASK-20260924-a2c79b, TASK-20260924-eaf78a, TASK-20260924-624abf]
  composer_task: TASK-20260924-1df6b6
  ledger_archive: TASK-20260924-a84cee
  written_at: '2026-09-24'
  written_before_any_reviewer_ran: true
  written_before_the_object_existed: true
  written_before_the_object_existed_note: >-
    TRUE. The producer TASK-20260924-34ada8 has not run. The joints are fixed now
    by DEC-20260924-99ce20 S2 scope and design_conditions C1-C5. The object is
    bound by content only after it exists, by the producer snapshot
    TASK-20260924-77d46f. Every reviewer hashes the three producer files against
    that receipt's path_sha256 before relying on them.

  # ---------------------------------------------------------------------------
  tier:
    policy: review-adversarial
    reasoning_effort: xhigh (policy default)
    ruling: >-
      review-adversarial, NOT review-breakthrough. The scoped claims are
      unconditional finite arithmetic and linear algebra (the record's
      H-261004-0), the record lowers a claimed gain rather than raising one, and
      no pool tripwire names it (DEC-20260924-99ce20 tripwire_routing). The
      tripwires below say exactly when the round becomes a rule-12 matter.
    tripwires:
      - id: TB-1
        fires_when: >-
          The contract, the audit sheet, the hypothesis or any review report
          states or implies an ECDLP speedup, an exponent move, a weak-curve or
          safe-curve verdict, a statement about a deployed system, or a closure
          of a lane (for example that Frobenius-orbit accounting is dead on a
          row).
        effect: >-
          The reviewer finishes its joint, flags TB-1 at the top of its report and
          stops. The composer does not compose. The statement routes to a
          review-breakthrough round (validator-breakthrough /
          red-team-breakthrough at max) in independent sessions, and the contract
          is not approved while that round is open.
      - id: TB-2
        fires_when: >-
          Any record in the round contradicts a validated evidence record or a
          promoted finding.
        effect: Stop and route to review-breakthrough, as for TB-1.
      - id: TB-3
        fires_when: >-
          Any party (producer, J2 or J5) finds k not dividing r - 1 at a
          standardized row, from primary parameters.
        effect: >-
          Per DEC-20260924-99ce20 S2, that row's parameters or the structural
          claim are wrong and everything downstream stops until it is resolved.
          The composer applies K-row-failure. If the finding contradicts a
          published standard's own statement of r, it also routes to
          review-breakthrough, as for TB-2.
    tripwire_note: >-
      Pre-declared, so escalation is a rule applied and not a judgement made
      after reading the reports.

  # ---------------------------------------------------------------------------
  claim_under_review:
    statement: >-
      H-BINSTD-ce4f38 and EXP-BINSTD-178742, as frozen by TASK-20260924-77d46f,
      together with the proof_search_map audit sheet, are a complete protocol for
      IDEA-20260922-261004 Part 1 (the ord_n(2) census and stable-dimension sets
      at n = 131, 163, 233, 283, 409, 571, and the k | r - 1 verdict at the
      eleven standardized subfield and Koblitz rows from primary parameters) and
      the per-conjugate-family rank readout of Part 2 (raw, orbit-quotient and
      ker-g-module ranks with orbit-length histograms, planted-rank controls, the
      null object and the non-stable-subspace proves-too-much control, the n = 17
      reproduction cell first), with IDEA-20260922-b19793 and
      IDEA-20260922-dacfc2 carried as sections, that discharges
      DEC-20260924-99ce20 design_conditions C1-C5 and every KN-TECH-080 audit and
      is complete enough for Coordinator approval under standing authorization.
    conditions_to_discharge: >-
      Read verbatim from DEC-20260924-99ce20 selected S2 scope, absorbs and
      design_conditions C1-C5. They are not paraphrased further here.
    object_under_review:
      paths:
        - ledger/hypotheses/H-BINSTD-ce4f38.yaml
        - experiments/EXP-BINSTD-178742/specification.yaml
        - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-7d29e8/design/TASK-20260924-34ada8/proof-search-map-audit.yaml
      binding: >-
        path_sha256 in TASK-20260924-77d46f's snapshot receipt (content_at_commit;
        DEC-20260924-f0a9c7 R3). Every reviewer hashes the three files before
        relying on them.

  # ---------------------------------------------------------------------------
  coordinator_prior:
    per_joint: >-
      J1 (rank derivation, interface and reproduction fixture) HOLDS with
      probability about 0.75; if it breaks, I expect it on the ker-g-module
      basis, the one column the record predicts nothing for, being defined too
      loosely to compute. J2 (controls, toy-degree screen, row sourcing,
      completeness) HOLDS with probability about 0.55; this is where I expect the
      round to break, on C5: re-deriving r for the five c2pnb rows from the
      primary ANSI X9.62 text, which I have not confirmed is in the repository.
      J3 (observation collision, nearby-object controls, GGMP provenance) HOLDS
      with probability about 0.7. J4 (R2 boundaries, rho convention, scope)
      HOLDS with probability about 0.7; if it breaks, I expect a residual
      sqrt(2k) figure or a net-gap sentence not restated to sqrt(n). J5 (blind)
      agrees on the six ord_n(2) values with probability about 0.95 and on the
      eleven divisibility verdicts with probability about 0.75, the gap being
      row sourcing rather than arithmetic.
    overall: >-
      Probability about 0.35 that the round composes to approve on this first
      design. The most likely outcome is revise on C5, or approve with a recorded
      source impediment under K-impediment.
    where_i_think_it_breaks_if_it_breaks: J2, then J1 on the ker-g basis, then J4.
    what_would_overturn_this_prior_most: >-
      (1) Any k not dividing r - 1 at a row (TB-3), which would say the
      structural claim or a parameter set is wrong. (2) J1 finding the quotient
      rank derivation wrong, which I do not expect. (3) J5 disagreeing on an
      ord_n(2) value, which would say one of two implementations of elementary
      arithmetic is wrong.
    informed_prior_disclosure: >-
      The prior is informed, not blind (PD-R1). This session read
      IDEA-20260922-261004 in full, including its hand-derived ord_n(2) values,
      and DEC-20260924-99ce20, which records a check of ord_n(2) at the toy
      degrees.

  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        J1 -- RANK DERIVATION, INTERFACE AND REPRODUCTION FIXTURE. The contract
        states the raw-basis rank k and the orbit-quotient rank 1 of a conjugate
        family with their derivations, the raw-to-quotient change of coordinates
        as its own interface obligation, the ker-g-module basis precisely enough
        to compute, the b19793 section (collapse to the single lambda-eigenblock
        of size about |V|/n is the same saving as the orbit quotient, not a
        second one), planted-rank controls that can return each of 1, n' and k,
        and the n = 17 reproduction cell of KN-OPEN-095df5 run first.
      assigned_to: TASK-20260924-a2c79b
      attack_plan: >-
        (i) Re-derive both ranks from the contract's text. Construct a relation
        with one leg in a short orbit and say whether the contract's admission
        rule excludes it before any rank is read. (ii) As a review computation,
        check the n = 17 fixture values KN-OPEN-095df5 records (r = 65587,
        lambda = 17184): the order of lambda mod r, Phi_17(lambda), and both
        degree-8 divisors of Phi_17 at lambda; check the contract freezes them as
        a gate that runs before any new cell. (iii) Write down the ker-g-module
        basis exactly as the contract defines it and try to compute its rank on a
        planted matrix; an undefined or ambiguous basis breaks. (iv) Check the
        b19793 section states one saving, not two. WHERE I THINK IT BREAKS: (iii).
      breaking_artifact: >-
        A rank statement the text does not derive; a short-orbit leg the rules
        admit; a fixture value that does not reproduce or is not gated first; a
        basis a reviewer cannot compute from the text; a second saving claimed
        for the eigenblock collapse.
    - joint: >-
        J2 -- CONTROLS, TOY-DEGREE SCREEN, ROW SOURCING AND COMPLETENESS (C1, C5).
        Positive arm n in {17, 23, 31, 41}; forced-negative arm n in {19, 29, 37}
        where Part 2 must find nothing to measure; cells with |V| < 4n excluded
        from the disjointness reading; two curves with different r at each n.
        r for the five c2pnb rows, ECC2K-130 and K-163 to K-571 is re-derived
        from primary standards with provenance, the analysis/binstd-curve-audit
        dump used only as a cross-check, and an unreachable source recorded as an
        impediment. Every field approval requires is present; approved_by is
        null with an approval block naming DEC-20260924-286589; zero runs; the
        three files hash to the snapshot.
      assigned_to: TASK-20260924-a2c79b
      attack_plan: >-
        (i) Recompute ord_n(2) at the seven toy degrees and check each arm's
        membership. (ii) Check the |V| < 4n rule and the two-curves-per-n rule
        are in the procedure, not only in prose. (iii) For each of the eleven
        rows, follow the contract's sourcing clause to its named source; say
        which sources exist in inputs/ and which must be retrieved, and whether
        the clause forbids silent substitution of the dump. (iv) List every field
        approval requires and mark each present or absent; hash the three files.
        WHERE I THINK IT BREAKS: (iii).
      breaking_artifact: >-
        A toy degree in the wrong arm; a missing exclusion or repetition rule; a
        row sourced from the dump or from recall; a missing approval field; a
        non-null approved_by; a hash mismatch.
    - joint: >-
        J3 -- OBSERVATION COLLISION, NEARBY-OBJECT CONTROLS AND GGMP PROVENANCE
        (C4). The orbit-length histogram separates a module collapse from
        short-orbit artefacts; the k = 1 null curve and the non-stable-subspace
        control are BLOCKING in the rules; eprint 2020/1315 Lemma 3.3 is read at
        source with provenance retrieved, or its unreachability is recorded and
        claim (C) stays scoped to KN-OPEN-095df5's relay; nothing is attributed to
        GGMP without a read.
      assigned_to: TASK-20260924-eaf78a
      attack_plan: >-
        (i) Construct the collision: a measured rank n' that arises from short
        orbits rather than a submodule, and say whether the contract's reporting
        rule, fed that case, reads it correctly from the histogram. (ii) Read the
        stopping and invalidation rules and say whether a null-object or
        non-stable-subspace failure invalidates the run or is merely reported.
        (iii) Attempt eprint 2020/1315 yourself, record what you reached and its
        provenance, and compare it with the contract's wording of Lemma 3.3.
        WHERE I THINK IT BREAKS: (ii).
      breaking_artifact: >-
        A collision the reporting rule misreads; a control that does not block;
        a GGMP statement attributed without a read, or provenance mislabelled.
    - joint: >-
        J4 -- R2 BOUNDARIES, RHO CONVENTION AND SCOPE (C2, C3, and the absorbed
        dacfc2 section). H-261004-1 (assembled-matrix rank growth) and Part 3
        (pipeline cost) are excluded; the ord_n(2) census is authored once as a
        structural certificate under RQ-BINSTD-b6f698 for IDEA-20260922-c48e7d to
        cite; the dacfc2 quotient-memory column |V|/k is derived and its measured
        K/B comparison is not designed; the rho convention is sqrt(pi r/(4k)) per
        CORR-20260922-0d365e and the net-gap claim says rho falls by sqrt(n), not
        sqrt(2n); no sentence claims an attack gets faster.
      assigned_to: TASK-20260924-eaf78a
      attack_plan: >-
        (i) Perform PTM-A to PTM-D below against their failure signature, with
        the contract's rules in your own script. (ii) Search the contract for any
        clause that measures assembled-matrix rank growth, pipeline cost or K/B
        memory. (iii) Check every rho figure and the net-gap sentence against
        the corrected convention; recompute one row. (iv) Quote every sentence
        that states or implies more than an accounting unit and a structural
        census. WHERE I THINK IT BREAKS: (iii).
      breaking_artifact: >-
        A PTM object on which the rules reach the known-false conclusion; an
        excluded quantity designed in; a residual sqrt(2k) or sqrt(2n) figure; an
        over-scoped sentence.
    - joint: >-
        J5 -- BLIND RE-DERIVATION OF THE DEPLOYED ARITHMETIC. Two implementations
        that share nothing produce the same ord_n(2) at n = 131, 163, 233, 283,
        409, 571 and the same k | r - 1 verdicts at the eleven rows. See
        blind_rederivation below.
      assigned_to: TASK-20260924-624abf
      attack_plan: >-
        See blind_rederivation and blind-inputs.yaml. The re-deriver is told what
        to compute and not how.
      breaking_artifact: >-
        Any value or verdict that differs from the contract's frozen table. That
        localises the fault to a source, a definition of k, or one of two named
        implementations.

  joint_ownership_note: >-
    FIVE JOINTS, THREE OWNERS, NONE UNOWNED, NONE SHARED. TASK-20260924-a2c79b
    (validator) owns J1 and J2; TASK-20260924-eaf78a (red team) owns J3 and J4;
    TASK-20260924-624abf (validator, a separate session) owns only J5 and reads a
    whitelist that excludes every producer artifact and every record that states
    the values it re-derives.

  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Not lifted. No reviewer reads another reviewer's report, in this lane or
      lane A. J2's toy-degree screen must not reach J5 before J5 returns.
    excluded_from_every_reviewer: >-
      experiments/EXP-FROB-30006a/, experiments/EXP-QSP-70b731/runs/, the ref
      origin/cursor/semaev-2015-audit-program-5b8b and PR #1377.

  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20260924-eaf78a
    objects:
      - id: PTM-A
        object: >-
          A toy ordinary binary curve at one positive-arm n, defined over no
          proper subfield (the null object), with the contract's rank readout.
        known_truth: No Frobenius endomorphism acts, k = 1, and the raw and quotient bases coincide.
      - id: PTM-B
        object: >-
          A size-matched NON-stable F_2-subspace factor base on a positive-arm
          toy Koblitz curve.
        known_truth: >-
          Conjugate legs leave the base, so the conjugates of a relation are not a
          family of relations over that base.
      - id: PTM-C
        object: The forced-negative toy degrees n in {19, 29, 37}.
        known_truth: >-
          ord_n(2) = n - 1, so no nontrivial Frobenius-stable subspace exists and
          there is nothing to measure.
      - id: PTM-D
        object: >-
          A toy subfield curve constructed so that its prime-order subgroup lies
          in E(F_q), declared before evaluation.
        known_truth: >-
          Frobenius acts trivially on the subgroup, lambda = 1, so ord(lambda) = k
          fails and the rank-k raw statement does not apply.
    failure_signature: >-
      A correct protocol keeps each known-false conclusion out of reach in its
      rules. PTM-A reports identical raw and quotient ranks and no Frobenius
      effect. PTM-B produces no conjugate family counted as relations. PTM-C
      yields no stable base and nothing to measure; a stable base there is an
      instrument defect. PTM-D is rejected by an admission rule before any rank
      is read. A rule that reports a basis difference on PTM-A, counts rank k on
      PTM-B, measures anything on PTM-C, or admits PTM-D has proved too much.
    how_to_run_it: >-
      REVIEW COMPUTATIONS in your own script at toy size. They mint no RUN-*,
      write no evidence record, never execute any EXP-BINSTD-178742 driver as an
      experiment, and touch no deployed-size curve beyond reading its
      parameters. Put every script, seed and output in computations.json. If a
      PTM would amount to a new experiment, record it NOT PERFORMED with the
      reason.

  # ---------------------------------------------------------------------------
  blind_rederivation:
    required: true
    assigned_to: TASK-20260924-624abf
    quantity: >-
      Q0, Q1 and Q2 exactly as coordination/review/binstd-20260924-7d29e8/blind-inputs.yaml
      states them. Q0 is every undetermined choice; Q1 is ord_n(2) at the six
      deployed n; Q2 is, for each of the eleven rows, r and k from primary
      parameters and the verdict k | r - 1.
    parameters: See blind-inputs.yaml.
    blind_from:
      - coordination/review/binstd-20260924-7d29e8/review-plan.yaml
      - coordination/review/nistbin-20260924-7d29e8/
      - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-7d29e8/
      - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-81fda1/
      - ledger/hypotheses/
      - experiments/EXP-BINSTD-178742/
      - ledger/proposals/
