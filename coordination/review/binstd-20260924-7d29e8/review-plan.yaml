      - ledger/handoffs/TASK-20260924-34ada8.yaml
      - ledger/handoffs/TASK-20260924-77d46f.yaml
      - ledger/handoffs/TASK-20260924-a2c79b.yaml
      - ledger/handoffs/TASK-20260924-eaf78a.yaml
      - ledger/handoffs/TASK-20260924-1df6b6.yaml
      - ledger/handoffs/TASK-20260924-a84cee.yaml
      - knowledge/
      - analysis/
      - coordination/bus/
      - coordination/events/
      - every commit message and pull-request text (no git log, show, blame or diff of any kind)
    blind_from_note: >-
      Lists where the answers are known to sit: the producer's contract,
      hypothesis and audit sheet; the proposal and its siblings, which state the
      ord values; the question record, which states k per row; the selection
      decision; the knowledge corpus (KN-OPEN-095df5 states one ord value); and
      the curve-audit dump. The round is enforced by WHITELIST.
    whitelist:
      - coordination/review/binstd-20260924-7d29e8/blind-inputs.yaml
      - inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md
      - inputs/FIPS186-4-BINARY-CURVES/source_record.yaml
      - inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md
      - inputs/BAILEY-2009-541-ECC2K130/ecc-challenge-info-index.html
      - inputs/BAILEY-2009-541-ECC2K130/source_record.yaml
      - AGENTS.md
      - agents/validator.md
      - templates/research-records.md
      - ledger/handoffs/TASK-20260924-624abf.yaml
    whitelist_note: >-
      Primary standards outside the repository (ANSI X9.62 for the c2pnb rows, the
      Certicom challenge publication for ECC2K-130) may be retrieved and are cited
