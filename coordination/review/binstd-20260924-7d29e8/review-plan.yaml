    agreement_tolerance: >-
      Q1 exact. Q2 exact on r, on k and on each verdict.
    what_disagreement_means: >-
      NOT that J2 or J5 is wrong. It localises the difference to a source, the
      definition of k on a row, or one of two named implementations. The composer
      applies K-indeterminate or K-row-failure and never prefers either side.

  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20260924-1df6b6, in a fresh session that did NOT
      run TASK-20260924-34ada8 and did not compose DEC-20260924-99ce20. No
      reviewer votes on the whole contract.
    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/binstd-20260924-7d29e8/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-7d29e8/reviews/TASK-20260924-a2c79b/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-7d29e8/reviews/TASK-20260924-eaf78a/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-7d29e8/reviews/TASK-20260924-624abf/,
      run by the top-level session and recorded in DEC-20260924-286589 whatever
      it reports.
    custody_without_seal: >-
      No seal card (DEC-20260924-f0a9c7 R2). Before TASK-20260924-1df6b6 is
      launched, the top-level session computes sha256 of the six declared report
      files of this lane and pastes them into the launch prompt. The composer
      records them verbatim in its composition worksheet as its first act,
      before it reads any report. TASK-20260924-a84cee must reproduce the same
      six digests; a mismatch voids the composition.
    keys:
      K-approve: >-
        J1 to J4 hold; J5 agrees with the contract's frozen table on every Q1 and
        Q2 value; every PTM meets its failure signature; no tripwire fired.
        DEC-20260924-286589 then approves EXP-BINSTD-178742 under the AGENTS.md
        standing user authorization and names as its first next action the
        opening of an execution batch whose executor card is minted then.
        Approval asserts nothing about any deployed curve's security.
      K-revise-defect: >-
        Any of J1 to J4 breaks, or a field approval requires is missing. Decision
        revise, each defect listed with its joint and breaking artifact, and a
        revision design card in a new batch as the first next action.
      K-indeterminate: >-
        J5 disagrees with the contract on any Q1 value or on any row's r, k or
        verdict, or reports a choice that changes one. Decision revise on C5 or
        C3, whichever implementation looks right.
      K-row-failure: >-
        Any party finds k not dividing r - 1 at a row (TB-3). Decision revise;
        the row is resolved in its own task before anything downstream of it is
        read, per DEC-20260924-99ce20 S2.
      K-impediment: >-
        A primary source (a c2pnb row's standard, or eprint 2020/1315 under C4)
        is unreachable, and the contract records the impediment, keeps every
        claim that would rest on it out of scope, and forbids substitution. Not
        a defect by itself; approval is permitted if every other key of K-approve
        holds. A contract that substitutes the dump or recall for the source is
        K-revise-defect.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        approval while any joint is inconclusive. An infrastructure failure is
        never negative evidence about the contract's mathematics or any curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.

  procedure_deviations:
    - id: PD-R1
      severity: material
      what: >-
        THE PRIOR IS INFORMED, NOT BLIND. The session that wrote this plan read
        IDEA-20260922-261004 in full, including its hand-derived ord_n(2) values
        and k values per row.
      consequence: >-
        Concurrence of TASK-20260924-a2c79b with those values is weak
        corroboration; J5 is the structurally blind check.
    - id: PD-R2
      severity: disclosed
      what: The object did not exist when this plan was written; it is bound by the producer snapshot.
    - id: PD-R3
      severity: disclosed
      what: >-
        No seal card. Composition custody is kept by session-computed digests
        fixed in the composer's launch prompt and worksheet before any report is
        read, and reproduced by TASK-20260924-a84cee.
    - id: PD-R4
      severity: disclosed
      what: >-
        No protected-digest file is written for this batch, so
        tools/check_review_independence.py --blind-history is UNCHECKABLE for J5,
        never passed. Blindness from commit messages and PR text rests on the
        card's ban on every git history command and all PR text.
  procedure_deviations_note: >-
    Four at writing. Later departures are recorded in DEC-20260924-286589 or in
    an addendum, never absorbed.
