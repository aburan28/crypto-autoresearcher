  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-7d29e8
  lane: B
  question_id: RQ-BINSTD-b6f698
  idea_id: IDEA-20260922-261004
  absorbed_idea_ids: [IDEA-20260922-b19793, IDEA-20260922-dacfc2]
