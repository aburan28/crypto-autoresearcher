    blind_from_note: >-
      Lists where the answers are known to sit: the version-1, version-2 and
      version-3 contracts and audit sheets, the earlier reviews (which state
      the parity-purity mechanism and the sample sizes), the composing
      decisions, the proposals, the knowledge corpus. The round is enforced
      by whitelist.
    whitelist:
      - ledger/handoffs/TASK-20260929-9030f8.yaml
      - AGENTS.md
      - agents/validator.md
      - templates/research-records.md
    whitelist_note: >-
      Four repository files and nothing else. No external retrieval is
      needed; every parameter is on the card.
    agreement_tolerance: >-
      Q1 exact (orders, prime divisors, M and S), given the contract's stated
      rules. Q2 exact (to 1e-9) on every row computed exhaustively by both
      sides; within three combined standard errors on a sampled row; after
      matching the contract's reading of F1's quantile rule and of the
      normal-basis coordinate order (Q0). Q3 within 0.01 bit on each g*_k and
      0.0001 on each c_k, exact on the binding row and on which rows are
      unconstrained.
    what_disagreement_means: >-
      Not that J1 or J5 is wrong. It localises the difference to a model
      choice (a rule reading, a coordinate order, a quantile rule) or one of
      two named implementations. The composer applies K-indeterminate and
      never prefers either side. A contract row outside the card's set is
      recorded as not compared.

  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20260929-a1413f, in a fresh session that did
      not run TASK-20260929-749b50, did not compose DEC-20260929-8c3cb2,
      DEC-20260928-9d9c47 or DEC-20260928-63addc, did not author
      DEC-20260929-1eded2, DEC-20260929-4c7ffc or either plan of this batch,
      and is neither a reviewer of this round nor the lane-A composer
      (DEC-20260929-8c3cb2 NA-1: a fresh composer). No reviewer votes on the
      whole contract.
    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/binstd-b-20261001-35bdda/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-35bdda/reviews/TASK-20260929-8218e0/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-35bdda/reviews/TASK-20260929-8f2efa/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-35bdda/reviews/TASK-20260929-9030f8/,
      run by the top-level session and recorded in DEC-20260929-585602
      whatever it reports. The --blind-history check is uncheckable (no
      protected-digest file) and is recorded as such (PD-R4).
    custody_without_seal: >-
      No seal card. Before TASK-20260929-a1413f is launched, the top-level
      session computes sha256 of the six declared report files of this lane
      and pastes them into the launch prompt. The composer records them
      verbatim as its first act, before reading any report.
      TASK-20260929-afdc95 must reproduce the same six digests; a mismatch
      voids the composition.
    discharge_check: >-
      The composer reads the audit sheet's revision discharge table and checks
      that each of RR-1 to RR-12 of DEC-20260929-8c3cb2, and each design
      condition C1 to C8 of DEC-20260928-63addc S2, maps to a named clause
      that the owning joint's report does not contradict. An item with no
      clause is a missing approval field for K-revise-defect.
    keys:
      K-approve: >-
        J1 to J4 hold; J1's D-CARRY-B finds no uncovered difference; J5 agrees
        with the contract's frozen figures within the agreement tolerance;
        every PTM, PTM-E included, meets its failure signature; no tripwire
        fired; every revision requirement is discharged (discharge_check).
        DEC-20260929-585602 then approves EXP-BINSTD-c9c8a2 under the AGENTS.md
        standing user authorization and names as its first next action the
        opening of an execution batch whose first card advances the approval
        and status fields of the version-3 records and records versions 1 and
        2 as superseded. Approval asserts nothing about any curve's security,
        any filter's existence, or any k-list cost against rho.
      K-revise-defect: >-
        Any of J1 to J4 breaks, a field approval requires is missing, a
        revision requirement is undischarged, J1's D-CARRY-B finds an
        uncovered difference, or TB-4 fired. Decision revise, each defect
        listed with its joint and breaking artifact, and a revision design
        card in a new batch as the first next action.
      K-indeterminate: >-
        J5 disagrees with the contract beyond the tolerance on any compared
        quantity, or reports a choice that changes one. Decision revise on C2,
        C6 or C7 as the quantity requires, naming it; neither implementation is
        preferred.
      K-impediment: >-
        Wagner 2002 or Fong-Hankerson-Lopez-Menezes is unreachable and the
        contract records the impediment, keeps every dependent statement
        marked, and forbids substitution; the group-law re-derivation of the
        halving criterion remains the accepted alternative. Not a defect by
        itself; approval is permitted if every other key of K-approve holds.
        Relaying the criterion through IDEA-20260922-1b16d7 or its successor
        IDEA-20261001-39014f is K-revise-defect.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        approval while any joint is inconclusive. An infrastructure failure
        is never negative evidence about the contract's mathematics or any
        curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    selection_point_duties: >-
      The composing decision is a selection point of GOAL-ECDLP2M-001. It
      reads DEC-20260929-1eded2 (R-ORDER, R-SLOT, R-NISTBIN, R-HOLDS) and, if
      on origin/main at its launch, DEC-20260929-54dcd8 and
      DEC-20260929-7257b2, and records only changes, each with its reason and
      revisit. It performs the HOLD-X2 revisit (DEC-20260929-1eded2 R-HOLDS
      H-5) if it is the later of DEC-20260929-54dcd8 and DEC-20260929-585602
      on main. It ranks the NISTBIN revision for the slot this lane frees
      unless another session has opened it, and keeps the custody successor
      on slot 1 unless a reason is recorded. It considers the three technique
      lessons of DEC-20260929-8c3cb2 knowledge_promotion only once the revised
      instrument has run, not before.

  procedure_deviations:
    - id: PD-R1
      severity: material
      what: The prior is informed, not blind (see informed_prior_disclosure).
      consequence: Concurrence of TASK-20260929-8218e0 with carried figures is weak corroboration; J5 is the structurally blind check.
    - id: PD-R2
      severity: disclosed
      what: The object did not exist when this plan was written; it is bound by the producer snapshot.
    - id: PD-R3
      severity: disclosed
      what: >-
        No seal card and no blind-inputs file. The blind quantities and
        parameters are carried in the blind card itself
        (ledger/handoffs/TASK-20260929-9030f8.yaml).
    - id: PD-R4
      severity: disclosed
      what: >-
        No protected-digest file is written for this batch, so
        tools/check_review_independence.py --blind-history is uncheckable for
        J5, never passed.
    - id: PD-R5
      severity: disclosed
      what: >-
        The reviewers differ in what they read: the two non-blind reviewers
        read DEC-20260929-8c3cb2, which quotes earlier
        findings and values (for example the F1 parity mechanism, the 0 of 14
        and 7 of 7 counts and the 18.2978-bit threshold), so their
        concurrence on those items is informed; the blind re-deriver reads
        none of it.
    - id: PD-R6
      severity: disclosed
      what: >-
        J5 is scoped to what version 3 changes or adds and to one quantity
        never blind-checked (the HEUR-B2 thresholds), with the sample table
        re-derived under the contract's own constant 128 (PD-B6). The orders
        and the ideal-tree and gap tables blind-confirmed in version 2 are
        carried by J1's D-CARRY-B, as DEC-20260929-8c3cb2 NA-1 permits; the
        ladder orders are re-derived in Q1 only because the sample table
        rests on them.
  procedure_deviations_note: >-
    Six at writing. Later departures are recorded in DEC-20260929-585602 or
    in an addendum, never absorbed.
