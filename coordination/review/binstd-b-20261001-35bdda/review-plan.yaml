    reason: DEC-20260929-8c3cb2 PD-B7 (d) (the scratch subdirectories did not exist at launch in BATCH-361e02).

  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20260929-8f2efa
    objects:
      - id: PTM-A
        object: >-
          The composite-order n = 17 Koblitz cell (a = 0; order recomputed),
          fed to the contract's certificate function and to its Stage 1 gate
          at the declared S for its alphabet-548 and -956 homomorphisms.
        known_truth: >-
          The capacity is not 2 bits there. The certificate function must
          return the full divisor set of the group order (including 548 and
          956; the largest divisor strictly below 239 is 137), and the gate
          must read G = M on both homomorphisms at the declared S.
      - id: PTM-B
        object: Z/2^n with h the low log2(M) bits, fed to the contract's certificate function and gate.
        known_truth: >-
          Every subgroup 2^k Z/2^n is an exact filter and h reads G = M
          exactly. A certificate finding no alphabet between 4 and the order,
          or a rule reporting the random-label null there, has proved too
          much.
      - id: PTM-C
        object: >-
          The relabelled Z/lZ control with the log-interval key, fed to the
          contract's Stage 2 rules and the PC-7 code across the declared M
          grid.
        known_truth: >-
          The key is an approximate filter with G about M/2 up to one carry.
          The rules must read it as the far-end positive control on every
          declared M, net of the stated maximum bias.
      - id: PTM-D
        object: >-
          The repaired comparison (stratified shuffle or subgroup sampling)
          fed (a) an exact filter onto a group of order M and (b) a planted
          marginal-only filter, on synthetic data of a declared cell's shape
          at the declared S.
        known_truth: >-
          A null must destroy arithmetic beyond the exact components and keep
          marginals: (a) collapses to within the null width and (b) is
          preserved within its own width.
      - id: PTM-E
        object: >-
          Exact-content-only labels, fed to the rules as applied to family
          arms (DEC-20260929-8c3cb2 RR-2): (i) a weight-class label whose
          every class is parity-pure on the declared Koblitz cell, so that it
          determines the E/2E class and carries nothing else of the point's
          arithmetic; (ii) 4 r + h4 with r drawn from a skewed distribution
          independent of the point.
        known_truth: >-
          Each carries only an exact component the certificate already
          counts (one bit and two bits respectively). A rule that reads either
          as LEAD, or as anything but NEG, has proved too much (in version 2
          the F1 analogue read LEAD 7 of 7).
    failure_signature: >-
      A correct protocol keeps each known-false conclusion out of reach.
      PTM-A returns the full divisor set and reads G = M on both
      homomorphisms at the declared S. PTM-B returns the subgroup filters and
      reads G = M. PTM-C reads about M/2 on every declared M and is labelled a
      positive control. PTM-D collapses (a) and preserves (b). PTM-E reads NEG
      on both labels.
    how_to_run_it: >-
      Review computations in your own script on toy or synthetic inputs. They
      mint no RUN-*, write no evidence record and never execute any
      EXP-BINSTD-c9c8a2 driver as an experiment on a declared cell. A PTM-E
      label of a declared cell's shape is built on synthetic data or on a
      non-declared toy curve, as the version-2 red team did. Put every script,
      seed and output in computations.json. If a PTM would amount to a new
      experiment, record it not performed with the reason.

  # ---------------------------------------------------------------------------
  blind_rederivation:
    required: true
    assigned_to: TASK-20260929-9030f8
    quantity: >-
      Q0 to Q3 exactly as the quantities block of
      ledger/handoffs/TASK-20260929-9030f8.yaml states them. Q0 undetermined
      choices; Q1 the group orders, largest prime divisors, alphabets by rule
      R-M and sample sizes by rule R-S (the contract's own constant 128) for
      the declared cells and fixed alphabets; Q2 the exact-quotient purities
      (2E-coset and 4E-coset) of the declared arm families F1 to F4 on the
      Koblitz cells n in 13, 19, 23 and of F2 and F3 on the ordinary n = 19
      cell; Q3 the HEUR-B2 threshold table g*_k and c_k under the ceiling
      model, with and without orbit unknowns.
    constants_carried: >-
      The card carries the contract's own rules as written in the version-2
      specification: R-M (M = 2^r with r = floor(log2(N) / p + 1/2), p = 3 or
      4, N the largest prime divisor of the group order) and R-S (S = 2 to the
      power ceil(log2(128 M^2))), the PD-B6 lesson of DEC-20260929-8c3cb2;
      the arm definitions F1 to F4, the field-polynomial rule DF-8 and the
      normal-element rule verbatim; and the ceiling model and threshold rule
      of the version-2 audit sheet verbatim, with the deployed prime l and
      rho given by its formula, not its value. It carries no computed answer.
      If version 3 changes a rule or a definition, the composer compares only
      where the definitions coincide and records the rest as not compared.
    parameters: See the quantities block of that card.
    blind_from:
      - coordination/review/binstd-b-20261001-35bdda/review-plan.yaml
      - coordination/review/binstd-a-20261001-35bdda/
      - coordination/review/binstd-a-20260929-361e02/
      - coordination/review/binstd-b-20260929-361e02/
      - coordination/review/binstd-a-20260928-d34db1/
      - coordination/review/binstd-b-20260928-d34db1/
