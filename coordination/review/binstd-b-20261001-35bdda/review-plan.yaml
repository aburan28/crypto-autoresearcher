  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Not lifted. No reviewer reads another reviewer's report, in this lane or
      lane A, and no reviewer reads an earlier lane-B report
      (prior_reports_rule). J1's audit recomputation must not reach J5 before
