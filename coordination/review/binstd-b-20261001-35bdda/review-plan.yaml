  coordinator_prior:
    exact_component_prior: >-
      Written first, as DEC-20260929-8c3cb2 what_this_says_about_the_prior
      asks: which declared arms carry an exact component. F1 (normal-basis
      weight in M quantile classes): I expect it to carry the E/2E class on
      most of its mass, because each weight value has one parity and a
      quantile class mixes parities only where it spans several weights; I
      expect its 2E-purity near 1 wherever M exceeds n + 1 and well above one
      half elsewhere, and its 4E-purity no higher than its 2E-purity allows.
      F2 (a window of r < n normal-basis coordinates): no exact content; its
      classes split both cosets, 2E-purity near 0. F3 (a window of r
      polynomial-basis coordinates): exact content only where the
      polynomial-basis expression of the E/2E class depends on coordinates
      inside the window alone; DEC-20260929-8c3cb2 records the version-2 red
      team found the declared Koblitz windows clean, and I put the
      probability that all declared F3 windows are clean at about 0.8. F4
      (least-rotation prefix): no exact content, probability about 0.85. F5:
      carries h4 by construction (2 bits), known. Ordinary F2 and F3:
      parity-free, probability about 0.8. Producer's RR-1 choice: I expect the
      target-subgroup sampling route (b) with probability about 0.55, since
      it makes every exact component constant at the price of a cofactor
      multiplication per point, and the stratified route (a) otherwise.
    per_joint: >-
      J1 (Stage 0 carry, RR-7, RR-11, RR-12, the exact-quotient audit
      figures) holds with probability about 0.75; if it breaks, on an
      uncovered change to a carried block, or on an audit figure that the
      validator's own enumeration contradicts. J2 (the code: RR-1 in code,
      the RR-2 control, RR-6, RR-8 to RR-10, pins, completeness, custody)
      holds with probability about 0.55, the stratified or subgroup-sampling
      branch being the newly load-bearing code. J3 (the decision rules: RR-1
      null beyond exact components, RR-3 L2, RR-4 HEUR-B2, RR-5 floors; every
      invalidation and stopping rule applied to the contract's own controls)
      holds with probability about 0.5 and is where I expect any break: L2 or
      the LEAD floor still unreachable by a planted filter at two to four
      times the floor, or an RR-4 consequent that is again untestable or
      satisfiable by marginal skew. J4 (boundaries, exclusions, PTM-A to
      PTM-E, over-scope) holds with probability about 0.75; if it breaks, on
      PTM-E. J5 (blind: sample table under the contract's own constant 128,
      exact-quotient purities, HEUR-B2 thresholds) agrees exactly on the
      sample table with probability about 0.95, on the purities with
      probability about 0.75 (the gap being the reading of F1's quantile rule
      and the normal-basis coordinate order), and on the thresholds within
      0.01 bit with probability about 0.9.
    overall: >-
      Probability about 0.35 that the round composes to approve. The most
      likely alternative is revise on J3 (L2 or HEUR-B2), each still a local
      remedy.
    where_i_think_it_breaks_if_it_breaks: J3 on the L2 or LEAD-floor definition or on the restated HEUR-B2 consequent, then J2 on the stratified or subgroup-sampling branch, then J4 on PTM-E.
    estimator_prior: >-
      Under the repaired comparison I expect an exact-content-only label (the
      RR-2 control and PTM-E) to read NEG, the random label to read NEG on
      every cell, and a planted filter with flat standardised excess at four
      times the stated floor to reach LEAD on all three ladder cells only if
      L2 is pre-registered as non-decay. A prior, not a result.
    what_would_overturn_this_prior_most: >-
      (1) F3 carrying the E/2E class on a declared window, which would say the
      version-2 audit missed an arm and RR-1's audit is load-bearing beyond
      F1. (2) The stratified shuffle or the subgroup sampling still letting an
      exact-content-only label reach LEAD, which would say exact quotients
      leak through another channel. (3) Any party exhibiting an exact filter
      with alphabet strictly between 4 and l (TB-3).
    informed_prior_disclosure: >-
      The prior is informed, not blind (PD-R1). The session that wrote this
      plan read DEC-20260929-8c3cb2 in full, including the findings it quotes,
      and the version-2 specification's definitions, cells and ceiling-model
      blocks and the version-2 audit sheet's HEUR-B2 threshold block.

