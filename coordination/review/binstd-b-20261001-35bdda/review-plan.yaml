    excluded_from_every_reviewer: See excluded_reads_for_every_party and prior_reports_rule above.

  scratch:
    rule: >-
      Each reviewer and the blind re-deriver uses a private scratch
      subdirectory, <session scratchpad>/BATCH-35bdda/<its TASK id>/,
      pre-created by the Coordinator of DEC-20260929-4c7ffc in its session's
      scratchpad (and re-created by any later session before launch) and named
