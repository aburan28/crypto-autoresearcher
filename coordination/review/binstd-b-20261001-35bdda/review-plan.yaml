        ledger/handoffs/TASK-20260929-9030f8.yaml. The re-deriver is told what
        to compute and not how, and reads no producer artifact.
      breaking_artifact: >-
        Any value that differs from the contract's frozen figures beyond the
        agreement tolerance, after matching the contract's stated rules. That
        localises the fault to a model choice or one of two named
        implementations.

  joint_ownership_note: >-
    Five joints, three owners, none unowned, none shared. TASK-20260929-8218e0
    (validator-breakthrough) owns J1 and J2; TASK-20260929-8f2efa
    (red-team-breakthrough) owns J3 and J4 and the five proves-too-much
    objects; TASK-20260929-9030f8 (validator-breakthrough, a separate session)
