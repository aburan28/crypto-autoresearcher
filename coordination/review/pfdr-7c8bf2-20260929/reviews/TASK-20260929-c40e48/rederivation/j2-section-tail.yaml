    RV3_agreement:
      frozen_slope_vs_hand_OLS: all 16 fits agree to <= 4.2e-17 (floating-point identity)
      frozen_interval_vs_own_bootstrap: >-
        All 32 endpoints (8 series x 2 ranges x lo/hi) lie within 3 Monte Carlo
        standard deviations of the mean of 50 independent own 2000-replicate
        runs (largest |z| = 2.47, S3-smallx-filtered 12..32 lower end; next
        2.31, S5-smallx 12..32 lower end), and every own 200000-replicate
        interval sits within the MC spread of the corresponding frozen one.
        stats.bootstrap_slope does what its docstring says: OLS slope, and a
        percentile interval from a bootstrap that resamples instances with
        replacement within each size level (groups = bits). Its order-statistic
        convention (index floor(0.025*(B-1)) and ceil(0.975*(B-1)), i.e. the
        50th and 1951st of 2000) is marginally conservative and immaterial.
    finding_M1_monte_carlo_resolution_of_the_outcome:
      statement: >-
        The one exclusion that makes the outcome id is a Monte Carlo event of a
        2000-replicate percentile endpoint, not a property the data resolve.
      S6-smallx_12_32:
        frozen_seed0_file_order_interval: [0.084138, 0.124158]
        model_1_over_12: 0.083333
        exclusion_margin: 0.000805 (lower end above 1/12)
        mc_sd_of_2000rep_lower_end: 0.00069 (own, 50 runs); seed-0 lower end is +1.39 sd above the own mean 0.083178
        limit_2e6_replicates: {lo: 0.083314, lo_plus_minus_2sd_band: [0.083276, 0.083350], hi: 0.123997, bootstrap_mass_below_1_12: 0.025119}
        reading: 1/12 lies inside the Monte Carlo band of the limiting lower endpoint; the limiting 95% percentile interval does not resolve 1/12 from its lower edge (2.51% of bootstrap mass lies below it, against the 2.5% cut)
        frozen_function_seeds_0_199_excluding: 88/200 (0.44)
        sorted_bits_curve_order_seed0: {lo: 0.081681, hi: 0.124179, note: includes 1/12}
      S7-smallx_12_32:
        frozen_seed0_file_order_interval: {lo: -0.000187, hi: 0.035113, note: includes 0}
        sorted_bits_curve_order_seed0: {lo: 0.000738, hi: 0.034968, note: EXCLUDES 0 (F-2)}
        limit_2e6_replicates: {lo: -0.000154, lo_plus_minus_2sd_band: [-0.000189, -0.000121], bootstrap_mass_below_0: 0.026010}
        frozen_function_seeds_0_199_excluding: 69/200 (0.345)
      joint_outcome_over_frozen_seeds_0_199:
        file_order: {OUT-CONSISTENT: 71, OUT-SLOPE-INTERVAL via S6 alone: 60, via S7 alone: 41, via S6 and S7: 28}
        sorted_bits_curve_order: {OUT-CONSISTENT: 72, OUT-SLOPE-INTERVAL via S6 alone: 61, via S7 alone: 33, via S6 and S7: 34}
        other_series: the six other primary series (12..32) and all eight 20..32 fits excluded their model value on none of the 200 seeds; min ratio and P6 overlap are far from their thresholds, so for every seed the id is set by S6 and S7 alone
      scope_of_this_finding: >-
        A statement about the resolution of the frozen computation on the
        committed rows (bootstrap Monte Carlo error, conditional on the data).
        It is not a coverage or sampling-error statement (that is joint J4,
        not owned here) and it offers no reading of H-PFDR-0cc7e8.
    specification_gaps_found:
      - id: G-1
        text: >-
          P4 fixes seed = 0 but not the ORDER of the rows passed to
          stats.bootstrap_slope. With the seed fixed, the interval depends on
          that order (strata insertion order and within-stratum member order
          drive rng.choice). Ordinarily a Monte-Carlo-level effect; here it is
          outcome-bearing: file order gives OUT-SLOPE-INTERVAL met by S6-smallx
          alone (F-3), sorted (bits, curve) order gives OUT-SLOPE-INTERVAL met
          by S7-smallx alone (F-2). The id is the same; the series that meets
          it is not determined by the specification.
      - id: G-2
        text: >-
          analysis_outcomes gives no precedence rule when several conditions
          hold, nor says whether OUT-INVALID pre-empts. Not binding on these
          rows: exactly one condition holds under either order at seed 0.
      - id: G-3
        text: >-
          P6 names no function and no RNG beyond "2000 reps, seed 0", so its
          intervals are reproducible across implementations only to Monte
          Carlo error. Not outcome-bearing: the narrowest pairwise overlap
          (random hi 2.8467 vs subgroup lo 2.7288) is about 0.12 wide.
    derived_outcome:
      F-1_rows_below_0_9: 0
      F-2_odd_m_intervals_excluding_0_12_32: none (file order, seed 0)
      F-3_even_m_intervals_excluding_1_over_2m_12_32: S6-smallx only (file order, seed 0)
      point_estimates_in_window: all eight (S4 0.1321 in [0.095, 0.155]; S6 0.1036 in [0.053, 0.113]; odd-m series in [-0.03, 0.03], largest |slope| 0.0176 at S7)
      min_ratio_ge_1: true (1.483466)
      m3_base_intervals_pairwise_overlap: true (all three pairs, both implementations)
      conditions: {OUT-CONSISTENT: false, OUT-FLOOR-VIOLATION: false, OUT-SLOPE-INTERVAL: true, OUT-PREDICTION-MISS: false, OUT-INVALID: established in J1/J3}
      outcome_id: OUT-SLOPE-INTERVAL
      met_by: S6-smallx alone (F-3), under file order and seed 0; S7-smallx alone (F-2) under sorted (bits, curve) order and seed 0 (G-1)
      sensitivity_beside_it: S6-smallx 20..32 slope 0.084343 [0.065097, 0.102854] contains 1/12 (0/200 seeds exclude)
    provisional_verdict_before_comparison: >-
      holds, if the archived fits equal the file-order frozen values above.
      The outcome id follows mechanically from the frozen method at seed 0;
