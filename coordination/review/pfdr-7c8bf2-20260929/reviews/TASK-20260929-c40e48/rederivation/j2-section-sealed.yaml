    specification_gaps_found:
      - id: G-1
        text: >-
          P4 fixes seed = 0 but not the ORDER of the rows passed to
          stats.bootstrap_slope. With the seed fixed, the interval depends on
          that order (strata insertion order and within-stratum member order
          drive rng.choice). Ordinarily a Monte-Carlo-level effect; here it is
          outcome-bearing: file order gives OUT-SLOPE-INTERVAL met by S6-smallx
          alone (F-3), sorted (bits, curve) order gives OUT-SLOPE-INTERVAL met
          by S7-smallx alone (F-2). The id is the same; the series that meets
          it is not determined by the specification.
      - id: G-2
        text: >-
          analysis_outcomes gives no precedence rule when several conditions
          hold, nor says whether OUT-INVALID pre-empts. Not binding on these
          rows: exactly one condition holds under either order at seed 0.
      - id: G-3
        text: >-
          P6 names no function and no RNG beyond "2000 reps, seed 0", so its
          intervals are reproducible across implementations only to Monte
          Carlo error. Not outcome-bearing: the narrowest pairwise overlap
          (random hi 2.8467 vs subgroup lo 2.7288) is about 0.12 wide.
