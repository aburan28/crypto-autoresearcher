    RV3_agreement:
      frozen_slope_vs_hand_OLS: all 16 fits agree to <= 4.2e-17 (floating-point identity)
      frozen_interval_vs_own_bootstrap: >-
        All 32 endpoints (8 series x 2 ranges x lo/hi) lie within 3 Monte Carlo
        standard deviations of the mean of 50 independent own 2000-replicate
        runs (largest |z| = 2.47, S3-smallx-filtered 12..32 lower end; next
        2.31, S5-smallx 12..32 lower end), and every own 200000-replicate
        interval sits within the MC spread of the corresponding frozen one.
        stats.bootstrap_slope does what its docstring says: OLS slope, and a
        percentile interval from a bootstrap that resamples instances with
        replacement within each size level (groups = bits). Its order-statistic
        convention (index floor(0.025*(B-1)) and ceil(0.975*(B-1)), i.e. the
        50th and 1951st of 2000) is marginally conservative and immaterial.
    finding_M1_monte_carlo_resolution_of_the_outcome:
      statement: >-
        The one exclusion that makes the outcome id is a Monte Carlo event of a
        2000-replicate percentile endpoint, not a property the data resolve.
