  joints:
    F3:
      verdict: breaks
      where_it_breaks: >-
        Not at the constants or the charging. It breaks at three places, each a breaking
        artifact the plan names. (1) A7's r is the lemma's step-(ii) count, not its step-(iii)
        count. (2) Step (v) is read per row. (3) A7 is applied to known_log and j0_coset, where
