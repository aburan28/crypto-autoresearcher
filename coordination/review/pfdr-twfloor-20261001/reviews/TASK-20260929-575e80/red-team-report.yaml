        3.0%. Aggregate T on-mode r_frozen is 1.55, 1.63 and 2.41. The replica's SS pair first
        moment is 1.007, 1.005 and 1.051 of C(X',2)*2/N.
      computation: attacks/05_ptm2_rho.py, 06_ptm134.py, ptm5_engine.py with run_ptm5.sh, 07_ptm5_analysis.py, 10_rank_min.py
      outputs: [attacks/out/05_ptm2_rho.json, attacks/out/06_ptm134.json, attacks/out/ptm5_results.jsonl, attacks/out/07_ptm5_analysis.json, attacks/out/10_rank_min.json]
      narrowest_supported_statement: >-
        On objects where "beats the generic floor" is known false, the per-instance A7 predicate
        under A7's r fires at rates comparable to or above its observed generic rate. Those
        objects are rho at 26%, an exactly generic replica of this engine at 2.0-2.3% (m = 4, 5),
        and random arms at 1.41%. Of the corrections tested, r_rank never fires but loses the
        known_log positive control (all 35 above the floor), and c = 1 fires on the plain engine
        on generic bases. X_total and the aggregate T keep known_log below the floor and fire on
        no harvest-off row.

  # ===========================================================================================
  objections:
    - id: OBJ-1
      joint: F3/F6
      text: >-
        A per-row reading of an expectation bound. Prediction (i), falsification condition 1 and
        TW-FLOOR apply L5's "i.e." to single runs. The lemma bounds E[r] (fixed S) or the
        aggregate T (stopping time), and with A7's r it implies no per-instance bound (DN D5).
    - id: OBJ-2
      joint: F3
      text: >-
        A7's r is the step-(ii) pair count, not the step-(iii) relation count. It is 4.0-15.5
        times the solver rank on the generic firing rows, because one relation appears as a
        bundle of many dependent pair rows (multiplicity laws: SS m4 mean 5.4, maximum 1338;
        TT m5 mean 9.5, maximum 234).
    - id: OBJ-3
      joint: F3
      text: >-
        A7 is evaluated on known_log and j0_coset, where the premise is false by construction,
        and counts their formal rows in r. 52 of the 73 firings are on those arms.
    - id: OBJ-4
      joint: proves_too_much
      text: >-
        The plan's rho prediction (1 - exp(-0.81) = 0.555) assumes negation folding. rho.py
        keys on full points, and the design-evaluated rate is 0.26, which is what is observed.
        The conclusion (the predicate fires on rho at a material rate) stands at 0.26, not 0.55.
    - id: OBJ-5
      joint: proves_too_much
      text: >-
        r_rank alone is not an acceptable corrected convention: it lifts all 35 known_log
        instances to 1.18-2.85, so it cannot see a known non-generic relation source. Any
        corrected reading must keep the premise audit (formal rank, formal rows) beside the
        floor ratio.

  required_controls:
    - Any corrected A7 convention is run against PTM-1..PTM-5 before adoption, as here.
    - A per-instance threshold, if one is kept, is calibrated per (m, mode, rung) on an exactly generic engine and the instance's own count structure, not pooled.
    - The premise audit (formal_basis_rank and formal rows fed) is a precondition of any floor reading, per arm.
    - An exactly generic null at 26..32 bits. PTM-5 covers 12..24 bits; the 4 generic firings at 26..32 bits are covered by NULL-P only.

  counterexample_or_mutation: >-
    The cheapest falsification of "a sub-0.9 row is a claimed contradiction of the generic
    floor" uses rows already committed: apply the predicate to the rho rows (R13 + j0 rho).
    38 of 145 rho runs read as "beating the generic floor" under the faithful A7 analogue, and
    the design-evaluated generic rate predicts 38.2. That needs zero new compute. The mutation
    that isolates the mechanism is r_frozen -> r_rank on the same rows: 21 -> 0 generic firings
    and 73 -> 0 overall.

  baseline_comparison: >-
    Against the generic baselines measured here, for the per-row predicate only. Rho's
    walk/sqrt(N) median is 1.20 with 26% of runs below 0.9. The exactly generic replica of this
    engine fires 2.0-2.3% at m = 4, 5 (12..24 bits). The census's generic (random + structured)
    on-mode rate is 1.41% overall; by band it is 2.5% (m = 4) and 2.9% (m = 5) at 12..24 bits,
    1.1% at 26..32 bits for both, and 0 at m = 3. This report makes no time or cost comparison
    with rho: S_3 is an encoding count, not a total cost (CC-1).

  heuristic_challenges:
    - id: HC-1
      text: >-
        HEUR-0cc7e8-H1's Poisson form for pair counts is not what governs the floor predicate.
        The first moment holds (replica 1.005-1.051), but the count is compound. A Poisson-scale
        per-row threshold is miscalibrated by the bundle dispersion (index of dispersion of the
        jump law: 2.2 SS m3, 14.7 SS m4, 12.8 SS m5, 18.6 TT m5).

  cost_model_challenges:
    - id: CC-1
      text: >-
        Uncharged terms, none an uncharged encoding: head points and target generation;
        vectorised-scan roots beyond the early return; depth-3 intermediates (charged, unused);
        row-certificate group operations; SS store memory; harvest time; la_ops; base
        construction. They belong to F-COST-1. A7's S_3 is a faithful encoding count and not a
        total cost.

  reduction_and_scope_challenges:
    - id: SC-1
      text: >-
        H-PFDR-0cc7e8's test boundary is the committed harvest-off sweep rows. Every harvest-off
        row read here (census-mode random, R05/R06, Stage 0 floor rows) is >= 1.48 under A7's
        own convention. The firing rows are harvest-on rows, reached only through the lemma's
        mechanism (plan note).

  proof_architecture_challenges:
    - id: PA-1
      text: >-
        Quantifier order. "FOR ALL generic engines ... E[#independent relations after S units]
        <= 4S^2/N(1+o(1))" is asserted for adaptive engines without an argument for continuation
        after the first collision (DN D3). Conditioning on X^2/2 >> N non-collision outcomes
        makes the naive per-pair bound vacuous. The obligation is open and not derived. It is
        numerically supported here on this engine only: census r_frozen aggregate T >= 1.45 on
        every pooled premise-holding on-mode cell and >= 1.11 at every rung (m = 4, 30 bits);
        PTM-5 on-mode T >= 1.55 pooled at the primary stop, >= 1.42 pooled at the full-rank stop,
        and >= 1.30 at every rung (12..24 bits).
    - id: PA-2
      text: >-
        Nearby object. The exactly generic replica reproduces the census's on-mode firing rates
        (matched 15.0 vs 17) and its per-rung aggregate path (m = 4: 2.23 to 1.30 against
        2.51 to 1.28 over 12..24 bits). The per-row firings do not separate this engine from a
        generic one.

  extrapolation: >-
    The inference spans 12..32 bits, about six orders of magnitude in N, and is not extended
    beyond (TW-SCOPE). Within it, increasing N does not remove the per-row firings. The
    census's generic on-mode firing rate at m = 4, 5 is 2.5-2.9% at 12..24 bits and 1.1% at
    26..32 bits (4 of 360), so firings persist at the top rungs at a lower observed rate.
    PTM-5's on-mode r_frozen rate rises with N over 12..24 bits, though not monotonically
    (m = 4: 0.5% at 12 bits, 4.0% at 24; m = 5: 1.0% and 3.0%). Meanwhile the census's m = 4
    on-mode median ratio falls from 1.58 (12 bits) to 1.07 (32 bits). What breaks first at
    larger N is the per-row predicate's calibration, not the aggregate. The aggregate's
    r_frozen margin at m = 4 narrows toward 1 from above (1.11-1.13 at 30-32 bits). That is
    consistent with the harvested share of X^2/N rising toward 1, measured only in PTM-5 (0.45
    to 0.77 over 12..24 bits). The lemma caps the aggregate at T >= 1 only if D3's expectation
    form holds, which this report does not prove. The exactly generic null stops at 24 bits,
    so the 26..32-bit firings and margins are calibrated against NULL-P alone.

  null_and_nearby_object_controls:
    checked:
      - NULL-P (measured H1 means and bundle laws; pooled and rung laws)
      - NULL-B (floor attained exactly)
      - NULL-G (stopping-count null for r_rank and census r)
      - PTM-5 exactly generic replica, primary and full-rank stops
      - PTM-2 rho, observed against negation-folded, full-point and design-evaluated predictions
      - PTM-3 harvest-off rows (census random, R05/R06, Stage 0)
      - PTM-4 random arms as known-null for the structured arms
      - PTM-1 known_log and j0_coset as known non-generic positive controls
      - Stage R (R16) 0 of 160 below 0.9 (recomputed)
    missing:
      - An exactly generic null at 26..32 bits (PTM-5 stops at 24 bits per the plan)
      - PTM-5 uses the default base size and one prime per rung; the census uses subgroup-matched sizes and one curve per (rung, c)
      - PTM-5 fidelity to the engine is argued (code mirroring, census-matching medians, internal certificates) and was not tested by executing the engine (RF-4)

  survival_statement: >-
    On my joints the filing did not survive as a contradiction of the generic floor. 52 of 73
    firings are on arms whose premise is false by construction. The 21 generic firings are at
    or below the null rate of a per-row predicate applied to a compound count (NULL-P 30.3;
    PTM-5 matched 15.0 vs 17). No uncharged encoding enters the count: c = 2, S_3, N and the
    free inputs are faithful. The "accounting error" half of the filing is located in A7's
    conventions (r is the step-(ii) pair count, read per row, on premise-violating arms), not
    in the engine's charging. The aggregate the lemma bounds is >= 1 on every premise-holding
    cell. What would still distinguish a real floor violation from an artifact: an aggregate T
    below 1 beyond its calibrated interval on premise-holding arms (r_frozen or r_rank); an
    r_rank firing rate above NULL-G/PTM-5; or structured arms firing above the random-arm rate.
    None was observed.
  remaining_uncertainty:
    - D3, the expectation form for adaptive engines, is open and supported only numerically on this engine at 12..32 bits.
    - NULL-P holds S fixed at its observed value. PTM-5 removes that approximation only at 12..24 bits.
    - Random m = 5 on-mode, 9 observed. P = 0.018 under the pre-registered pooled bundle law; 0.118 with rung laws (post hoc); 0.13 against PTM-5 at 12..24 bits. Resolved as law pooling, with moderate power.
    - The structured arms' premise rests on lead 2's null within EV-PFDR-1faf10's detection limits.
    - Solve reality of the firing instances (F1) is the validator's joint. Every statement here takes the archived rows as the solves they record.
    - "One model served the producer, the Coordinator and both reviewers: session independence is attested, model independence is not claimed."

  prior_comparison: >-
    Against the Coordinator's prior on the plan (coordinator_prior, both parts).
    CONFIRMED: F3 (S_3, N, c = 2 engine-faithful; r an admissible collision count in
    expectation but not an independent-relation count; break at the per-instance reading;
    c = 1 proves too much on census random rows). F4 holds. F6 breaks, and the null expects
    several generic firings under r_frozen and few under r_rank, with the aggregate not
    violated. The synthetic engine fires at m = 4, 5. Known_log and j0_coset are premise
    violations, and the decomposition is 52 premise + 21 calibration.
    REFINED: c = 2 needs no free-input term at all (X_cmp <= 2*S_3 exactly). E2's free-input
    concern does not arise here.
    OVERTURNED: the rho rate is 0.26, not 0.55 (rho.py does not fold negation). The prior's
    expectation that known_log on-mode "found k cheaply" holds for the formal part only: the
    search after the formal rank costs about sqrt(2BN)/2.
    UNANTICIPATED: r_rank proves too little on known_log; the m = 4 r_frozen aggregate margin
    narrows with N, matched by the generic replica.
    Concurrence is weighed per plan PD-1.

  narrowest_supported_statement: >-
    On the EXP-PFDR-1b78f7 R10-R14 rows at 66d6eab71, the 73 sub-0.9 A7 instances decompose
    into 52 on arms whose premise is false by construction (known_log formal rank B - 1;
    j0_coset formal rank 2B/3) and 21 on premise-holding arms. The 21 match the calibrated null
    rate of a per-row predicate applied to A7's compound pair count (NULL-P 30.3 expected;
    exactly generic replica 15.0 expected vs 17 observed at 12..24 bits). A7's S_3, N, c = 2 and
    constant are engine-faithful, and no uncharged encoding enters the count. The aggregate
    statistic the lemma bounds is >= 1 on every premise-holding cell (calibrated lower end
    >= 1.373 pooled). Under the independent-relation count no instance falls below 1.0.
    Scoped to m = 3, 4, 5, 12..32 bits, this engine and these curves.

  next_concrete_action: >-
    For the Coordinator's composition, not a status recommendation. If the round adopts a
    corrected A7 reading, carry three things together: the premise audit per arm, the aggregate
    T with calibrated intervals, and r_rank beside r_frozen. Test it against PTM-1..PTM-5 as
    done here, because r_rank alone loses known_log and c = 1 fires on the plain engine. The
    open derivation obligation D3 (the expectation form for adaptive, truncating engines) is
    the step a derivation note would have to discharge before the floor is read as more than
    a numerically supported aggregate on this engine.

