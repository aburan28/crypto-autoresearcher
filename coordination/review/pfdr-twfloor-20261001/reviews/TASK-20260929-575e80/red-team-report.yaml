        X_cmp = table_entries + B + encodings_recorded. This equals 2*S_3 - degenerate_roots on
        2450/2450 h = 2 rows. It equals 2*S_3 - B^2 - degenerate on 1020/1030 h = 3 rows; the
        other 10 are one lower, from a level-3 sum at infinity. X_cmp <= 2*S_3 on every row.
        N = group order: FAITHFUL; there are (N-1)/2 x-classes. The constant 1/2: FAITHFUL.
        r = relations (+ rows fed) to the lemma's r: NOT FAITHFUL. Every fed row is one
        colliding compared pair (a TS decomposition pair, or a TT/TB/SS star pair), so r_frozen
        is L2's count. The step-(iii) count is the solver rank (rank == sum of
        solver_rank_increments on 1660/1660 on-mode rows). On the 21 generic firing rows
        r_frozen/rank runs 4.0 to 15.5, and S_3/((1/2)*sqrt(rank*N)) runs 1.72 to 2.97.
      where_the_expectation_becomes_per_row: >-
