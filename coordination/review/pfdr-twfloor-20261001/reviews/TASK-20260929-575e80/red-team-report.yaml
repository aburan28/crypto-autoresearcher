    proves_too_much:
      verdict: breaks
      failure_signature_met: >-
        Yes, for the per-instance predicate under A7's r. It fires on rho (26%), on the
        synthetic generic engine (2.0-2.3% at m = 4, 5) and on random arms (1.41%). These rates
        are comparable to or above the observed generic rate (1.41%), where the conclusion
