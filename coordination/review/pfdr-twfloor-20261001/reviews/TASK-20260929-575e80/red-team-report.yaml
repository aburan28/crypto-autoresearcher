        from the table alone, and the rest needs two non-formal relations. Known_log SS
        collisions come clumped (a target pair collides in a bundle of about B rows or not at
        all), so the search costs about sqrt(2BN)/2. The location of the survival is the
        relation count: rank counts formal relations as relations obtained, and only the
        premise audit (formal rank) sees them. Census mode: 35/35 capped without k (31 with zero
        relations), not evaluable.
      PTM2_rho: >-
        R13 (110) and j0 rho (35), all completed_valid, setup_ops excluded. The faithful A7
        analogue is q1 = walk_ops/sqrt(N), i.e. S = walk_ops/2 in two-encodings units. It fires
