    F6:
      verdict: breaks
      where_it_breaks: >-
        The joint's claim fails. It was that under the null (the floor holds in expectation and
        the engine is generic) the per-instance predicate fires on a negligible number of
        instances, so the generic firings are surprising. In fact the calibrated nulls expect
        the observed generic count or more. The converse breaking artifact, an aggregate
        violated beyond calibrated error on premise-holding arms, was not found.
      derivation_note: attacks/f6-derivation-note.yaml
      per_instance_tail_the_lemma_allows: >-
        (D2) With S FIXED, Markov gives P(ratio <= t) <= t^2, which is 0.81 at t = 0.9; the
        Coordinator's sketch is correct as stated. (D4) With S a stopping time, the t^2 bound
        survives only for the count that IS the stopping criterion; for this engine that is the
        rank, the frame for r_rank. Its realistic tail at the floor is
        P(Gamma(q,1) <= 0.81q): 0.38, 0.30, 0.17, 0.082, 0.023 and 2.3e-4 at q = 5, 10, 25, 50,
        100 and 300. (D5) For r_frozen, which is not the stopping count, NO per-instance bound
        follows. Inside the compound-Poisson model, at the floor exactly, bundles of 40 at u = 120
        fire with probability P(Poisson(3) >= 4) = 0.353. (D6) What the lemma bounds is the
        aggregate T = sum w S^2 / sum w r N/4 >= 1, not a mean of ratios. (D3) The lemma's
        expectation form for an engine that truncates adaptively is NOT derived by the source
        record. Shoup's technique (as relayed) bounds the first collision. This is an open
        obligation, checked here numerically only.
      plug_in_null_expected_counts: >-
        attacks/out/03_f6_nulls.json (cells per (panel, m, mode, class, rung) and families).
        Per-instance probabilities are exact (FFT/incomplete gamma; deviation DV-2). On-mode
        generic family (random + structured + j0_random, n = 1589), 21 observed:
        NULL-P (measured H1 means, pooled bundle laws): E 30.27, P(>= 21) = 0.971.
        NULL-P with rung bundle laws (post hoc): E 35.76, P = 0.998.
        NULL-B (floor attained exactly): E 161.7.
        Random arms: 14 observed, E 19.67, P = 0.93. Structured: 7 observed, E 9.75, P = 0.859.
        By m (NULL-P): random m3 0 vs 1.94; m4 5 vs 13.79; m5 9 vs 3.94 (P = 0.018; 5.68 and
        P = 0.118 with rung laws). Structured m3 0 vs 0.85; m4 5 vs 7.01; m5 2 vs 1.89.
        Census mode: 0 observed. NULL-P cannot fire there (no harvested rows are fed).
        NULL-B Poisson gives E 3.84; NULL-G at measured kappa gives E <= 0.001.
        r_rank: 0 observed on every class and mode. NULL-G at the boundary expects 153.1
        (on-mode generic); at the measured kappa it expects 0.179, P(>= 0) = 1.
        The premise-violating arms sit far outside every null: known_log 35 observed vs E 0.017;
        j0_coset 17 vs E 0.33.
      ptm5_matched_null: >-
        The exactly generic engine, i.e. PTM-5, fires at 2.29% (m = 4) and 2.00% (m = 5) on-mode
        under r_frozen. On the census's 1049 generic on-mode instances at 12..24 bits it predicts
