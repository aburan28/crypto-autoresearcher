        analogue q2 = walk_ops/(0.5*sqrt(N)) fires on 6/110, 4/35 and 10/145 (6.9%).
        Against the plan's negation-folded prediction 1 - exp(-t^2): 0.555 and 0.183, E 80.5,
        P(<= 38) = 7.7e-13. That prediction does not apply, because rho.py keys its table on
        the full point (rho.py 86, 92).
        Against the full-point birthday 1 - exp(-t^2/2): 0.333 and 0.096, E 48.3, P(<= 38) = 0.040.
        Against the design-evaluated prediction (MC-6; my own simulation of rho.py's algorithm
        over Z_N, with overshoot and restarts; 1000 or 200 runs per rung): E 38.2 (q1) and 9.45
