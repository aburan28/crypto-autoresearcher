      objection: >-
        The lemma bounds an expectation, E[#colliding pairs] <= X^2/N with X = 2S. Its inversion
        "E[r] <= 4S^2/N, i.e. S >= (1/2)*sqrt(r*N)" (H-PFDR-0cc7e8 mechanism) is valid only in
