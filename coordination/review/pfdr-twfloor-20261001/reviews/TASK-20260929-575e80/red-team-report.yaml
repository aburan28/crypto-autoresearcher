        Under r_rank every cell is 2.36-9.20; census cells are 7.4-837.
        MC s.d. of the 99% lower ends is <= 0.0011 on-mode, against margins >= 0.37 above 1.
        Coverage at five curves per rung (MC-5, 1000 synthetic designs): 0.877-0.949 at nominal
