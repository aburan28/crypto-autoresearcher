    - id: F4-4
      choice: 'Census twin of a firing key = same (panel, bits, curve, m, arm) with mode census.'

  F6:
    - id: F6-1
      choice: >-
        Derivation note attacks/f6-derivation-note.yaml: (D1) fixed-budget Markov tail; (D2) the
        stopping version, with the event identity {S_tau <= s} = {count(s) >= r*} when the count
        is the stopping criterion; (D3) why no per-instance bound holds for a count that is not
        the stopping criterion (r_frozen); (D4) the aggregate the lemma bounds:
        T := sum_i w_i S_i^2 / sum_i w_i r_i N_i/4, w_i = 1/(N_i*B_i) deterministic, with
        E[numerator] >= E[denominator] under the lemma (optional stopping under a
        compound-Poisson count); (D5) free-input and premise terms. The Coordinator's sketch is
        checked against D1-D4.
    - id: F6-2
      choice: >-
        Nulls, all computed, none selected after seeing results.
        NULL-P (plug-in, measured first moments): per evaluable instance, with its observed S
        and encoding counts held fixed, r* = relations_obs + CP(mu_TT, J_TT) + CP(mu_TB, J_TB) +
        CP(mu_SS, J_SS), mu_c = the row's own harvest poisson_mean at_stop (C(E',2)*2/N etc.,
        H1 first moments) for the classes the mode feeds (on: TT, TB, SS; census: none, r* =
        relations_obs, i.e. no randomness and no firing beyond the observed), J_c = the pooled
        pairs-per-distinct-relation law (mult_hist) of 02_bundles over COMPLETE random-arm
        records of the same (m, class), scope stop, both modes pooled.
        NULL-B (boundary, least favourable): as NULL-P but every mu_c scaled by one factor so
        that E[r*] = X^2/N with X = 2*S_3, i.e. the floor holds in expectation with equality.
        NULL-EMP: the observed random-arm firing rate per (m, mode) as the null rate of the
        structured arms (this is PTM-4's comparison, reported there).
        NULL-G (for r_rank): independent relations arrive as a Poisson process in u = X^2/N
        with rate kappa; the r-th arrives at u ~ Gamma(r, 1/kappa); firing iff u < 0.81*r.
        kappa = 1 (boundary) and kappa = kappa_hat (the cell's measured r_rank*N/(4*S^2) ratio of
        sums over random arms, per (m, mode)) are both reported.
        PTM-5 (synthetic generic engine) is the fourth, process-level null.
      why: >-
        The plan asks for a plug-in null from measured distributions with compound structure from
        bundle sizes; NULL-P is that null, NULL-B bounds it from the side least favourable to my
        attack, NULL-G covers r_rank, and PTM-5 removes the "S held fixed" approximation.
    - id: F6-3
      choice: >-
        Per-instance null firing probabilities by Monte Carlo, 4000 draws per instance per
        seed; seed sweep over 200 seeds (MC-2) reporting the MC s.e. of each expected count and
        of each tail probability. Expected count E = sum p_i per (panel, m, mode, arm class,
        rung) and pooled; P(at least observed) by exact Poisson-binomial DP over the instances
        (no seed). Family-wise rate (MC-4) = 1 - prod(1 - p_i) over every evaluable instance of
        the family.
    - id: F6-4
      choice: >-
        Aggregate lemma test per (m, mode, arm class) for r_frozen and r_rank, with X = 2*S_3
        (and X_total as a variant): point T; 95% percentile interval from a curve bootstrap
        stratified by rung (resample curve indices within rung; all arms of the class on a curve
        move together), 20000 replicates (MC-1); 200 bootstrap seeds (MC-2) giving the MC s.d.
        of both endpoints; the interval's coverage at five curves per rung measured by my own
        simulation of the design under NULL-P with a known true T (MC-5, 1000 synthetic designs,
        2000 replicates each). "Violated beyond calibrated error" means the calibrated upper end
        lies below 1.

  proves_too_much:
    - id: PTM-1
      choice: >-
        known_log on-mode: every evaluable instance under r_frozen, r_rank, r_rank1, X_total,
        c = 1 and its aggregate T; classification by formal_basis_kind == known_log and
        formal_basis_rank == fb_size - 1. "Lifted above the floor" = ratio >= 0.9 under a
        convention.
    - id: PTM-2
      choice: >-
        rho rows R13 (110) and j0 rho (35): q1 = walk_ops/sqrt(N) (one encoding per step) and
        q2 = walk_ops/(0.5*sqrt(N)) (two-encodings analogue), setup_ops excluded; fraction < 0.9
        under each. Predictions: (a) the plan's negation-folded birthday 1 - exp(-t^2) (t = 0.9
        for q1, t = 0.45 for q2); (b) design-evaluated (MC-6): rho.py keys its table on the full
        point, so the non-folded 1 - exp(-t^2/2), plus distinguished-point overshoot and
        restarts, by my own simulation of the rho.py algorithm over Z_N with a hash in place of
        x mod 20 and of the distinguishing test, at the census N, >= 200 runs per rung at 12-24
        bits and >= 100 at 26-32 bits.
    - id: PTM-3
      choice: >-
        Harvest-off objects: (i) census-mode rows of R10-R12 on random arms; (ii) every
        mitm IC row of R05 and R06. Firing counted under frozen, r_rank, r_rank1, X_total, c = 1,
        the aggregate T per (m, base) and a calibrated quantile threshold q (ratio below the
        0.001 quantile of the PTM-5 census-mode null of the same m). Stage 0 floor-rows: count of
        ratio < 0.9 as archived, cross-check only.
    - id: PTM-4
      choice: >-
        Fisher exact test (two-sided and one-sided greater) of structured vs random on-mode
        firing rates at each m and pooled, under r_frozen, r_rank and X_total; denominators =
        evaluable on-mode instances of each class.
    - id: PTM-5
      choice: >-
        Own engine over Z_N (numpy, no curve, no engine import): primes N of 12..24 bits (one
        seeded prime per rung, 7 rungs), m = 3, 4, 5, B = default_fb_size(N, m) (the engine's
        formula), base logs uniform distinct nonzero +-classes, k uniform in [1, N), x-key =
        a seeded random permutation of the (N-1)/2 +-classes, y-bit = [v > N//2]. Table arity
        (m+1)//2 built in tails.py's order and charging (level k = (a, +1) + (+-T) for tails T
        with first index >= a, one S_3 per (a, T), zero sums dropped, numpy-path within-key
        order). Search as decompose.py: heads (i, s) in order for m = 4, 5; last-level scan
        j >= i, both roots, table lookup with first index >= j, early return at the first hit,
        _search_order tie-break; charged range recorded as IC-4. Harvest as IC-5: TB, TT and SS
        star rows with formal duplicates dropped (full SS group, not the OBJ-5 first-run
        rebuild). Modes census and on fed as solver.py; elimination mod N; PRIMARY stop = first
        row that determines k (solver.py); VARIANT stop = full rank (the plan's text), recorded
        in the same simulation after the primary stop. 200 instances per (m, rung), seeded
        instance by instance (seed = instance index), one process. A7 computed under r_frozen,
        r_rank, r_rank1 and X_total; firing rates with MC s.e.; aggregate T.
      why: >-
        Bundles (one relation as many pairs) are a property of the encoding design, so only an
        engine-faithful replica reproduces the compound structure; independent uniform keys
        would not.
