    - id: F4-2
      choice: >-
        X_total := 2*S_3 + B + attempts + 2, B = fb_size, attempts = the row's attempts.
        ratio_Xtotal := X_total / sqrt(r_frozen*N), i.e. S' = X_total/2 in place of S_3.
        Variant X_cmp := table_entries + B + encodings_recorded (the encodings actually compared;
