  F3:
    - id: F3-1
      choice: >-
        The lemma is written as numbered steps from the H-PFDR-0cc7e8 mechanism, quantifier_order
        and proof_obligations and IDEA-20260928-ce3ab0 claim (A): (0) premise; (i) pairwise
        x-key collision of two distinct linear forms <= 2/N; (ii) E[colliding pairs among X
        compared encodings] <= X(X-1)/N <= X^2/N; (iii) independent relations <= colliding
        pairs; (iv) X = c*S plus free inputs, c = 2; (v) inversion to S >= (1/2)*sqrt(r*N);
        plus (vi) the per-row reading in prediction (i) and falsification condition 1.
    - id: F3-2
      choice: >-
        Symbol map. S_3 := s3_solves (table included). N := row N. r_frozen := relations (census)
        or relations + sum(on.rows_fed) (on). r_rank := the row's `rank` (solver pivots at the
        stop; linalg.py excludes the k-determining row); I check rank == sum of
        on.solver_rank_increments on every on-mode row. r_rank1 := rank + 1 (the k-determining
        row counted) is reported as a sensitivity variant only. X := 2*S_3 (c = 2).
    - id: F3-3
      choice: >-
        c = 2 is called engine-faithful iff, on every firing row and every census twin, (a)
        ss_store.encodings_recorded == 2*(s3_solves - table_s3_solves) - degenerate_roots
        (identity G5, recomputed from fields, not read from identity_ok) and identity_ok is true,
        and (b) table_entries <= 2*table_s3_solves. c = 1 (floor sqrt(r*N), ratio_c1 = ratio/2)
        is applied to every evaluable census-mode random-arm row (m = 3, 4, 5, all rungs) and the
        firing rows are counted; any firing there is "c = 1 proves too much".
    - id: F3-4
      choice: >-
        The x-key and 2/N are derived in the note (no index was available, RF-7): number of
        x-classes (N-1)/2 for odd prime N, and the exact pair probability for two affine forms.
    - id: F3-5
      choice: >-
        Premise audit from row fields: formal_basis_kind, formal_basis_rank, fb_size, U, and the
        TT/TB/SS rows_formal counts; omega-closed orbits on j0_coset = formal_basis_rank / 2
        (each orbit of three base points carries two formal rows); j0_random accidental formal
        rows counted the same way.

  F4:
    - id: F4-1
      choice: >-
        Code traces are static reading of decompose.py, _accel.py, tails.py and harvest.py at
