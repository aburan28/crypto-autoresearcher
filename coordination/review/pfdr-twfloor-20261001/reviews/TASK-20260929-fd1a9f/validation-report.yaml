          j0_random 8, m = 3 random 6, m = 3 structured 3, m = 5 random 5 and m = 5 structured 4; in S16,
          census m = 5 random 2.
        c_1: >-
          1566 (73). This includes census-mode rows: in S15, j0_random 3 of 105, m = 3 random 5 of 330
          and m = 3 structured 2 of 165.
        generic_firings_under_the_alternatives: >-
          For the 21 generic firing instances the ratio is 1.72-2.97 under r_rank, 1.59-2.93 under
          r_rank1, 1.49-2.93 under r_distinct and 1.59-2.89 under r_census. Their frozen r is dominated
          by fed SS rows that repeat a small number of distinct relations. For example, main 30 4 4
          small_x on has r_frozen 1228 = 5 relations + 1223 fed SS rows, which hold 132 distinct
          normalised relations (r_distinct 137, rank 135).
        j0_coset_and_known_log_under_the_alternatives: >-
          j0_coset (17 firing): at least 1.11 under r_rank, 1.06 under raw r_distinct and 1.27 under
          formal r_distinct. known_log (35 firing): 1.18-2.85 under r_rank (all above 0.9), 0.105-0.728
          under raw r_distinct (all below 0.9), and 5.2-32.6 under formal r_distinct.
        reported_not_adjudicated: >-
          S_search and c = 1 fire on census-mode rows of generic arms, where the plain engine runs.
          These are data for the round's proves-too-much control (PTM-3), which the red team owns. Which
          r, S or c the floor should use is joint F3, which I do not own.
      breaking_artifact_check: >-
        No frozen ratio or firing key differs from the producer's. No alternative table shows a firing
        that the frozen convention leaves unexplained in the sense the plan names. Every alternative
        that changes only r fires on a SUBSET of the frozen set, except r_census at one 12-bit instance.
        That firing comes from pairing an on-mode S_3 with a census-mode relation count.

    F5:
      statement: >-
        The OBJ-5 / F-J3-1 SS pair-counter defect changes no quantity that A7, or an F2 alternative,
        uses on any firing instance.
      verdict: holds
      a_code_trace: >-
        Traced: harvest.py end_attempt (lines 582-632), _group_from and _ss_add (536-580), _merge_run
        (634-651), and solver.py lines 139-192. (i) For each x of the new batch, the loop over self.runs
        keeps the descriptors of the FIRST run holding x (`if x not in coll`). Runs are appended in
        batch order, only the last two are ever merged, and a merge places newer equal-x entries after
        older ones (searchsorted "right"). So that run holds the x-group's OLDEST member and lists it
        first, and _group_from makes it g.first. (ii) Every new encoding whose x is hot (present in any
        run, or repeated within the batch) is processed in recording order. Unless it is a formal
        duplicate, it emits exactly one star row against g.first. Formal duplicates share the attempt
        index t, so both copies are in the same batch and the duplicate check sees them. (iii) What the
        defect loses is len(g.keys) for members held only by later runs. So pairs_raw and pairs_formal
        undercount, and with them pairs_nonformal and the at_A_fix pair snapshot. Everything else is
        computed from the emitted rows (solver.py 182-191) and is untouched: the star rows,
        rows_emitted.SS, the rows' coefficients, the emission order, the census elimination
        (informative rank, staircases) and, in on mode, rows_fed.SS, solver_rank_increments.SS,
        k_determined_by and the stop. The defect cannot drop or duplicate a star row. It can only
        undercount a pair count.
      b_data: >-
        Checked on all 256 F1 instances: the 73 RS-1 on instances, their 73 census twins and the
        controls. The data are the ARCHIVED retained rows, and the x-keys are computed by my own
        arithmetic (checks/f5_groups.py). P, Q and the base points come from the F1 captures. The target
        stream is recomputed by the rule stated in solver.py: random.Random(f"ic|p|a|b|m|census|c"), with
        a = randrange(N) and b = randrange(1, N) per attempt. Rows checked: 220,637 SS, 463,818 TT and
        349,982 TB, with 0 failures. Both elements of every row share one x-key and the recorded y-bits.
        Every row recomputed from its element descriptors equals the archived coefficients, kcoef and
        rhs mod N. Every row certifies with my own arithmetic (sum c_i F_i + kcoef Q = rhs P). Every SS
        x-group has ONE centre, and it carries the group's oldest attempt. There is no duplicated star
        row and no element that is both a centre and an other. Each SS row's emission attempt equals its
        later element's attempt, and attempts never decrease in file order. rows_emitted (TT, TB, SS)
        equals the retained count wherever retention is complete, and rows_fed.SS <= retained on every
        on instance. The IC-5 pair count C(k', 2) from the rebuilt groups exceeds the recorded pairs_raw
        on 74 of the 256 instances and is never below it. This reproduces F-J3-1; the largest gap is main
        24 0 3 known_log census, at 117 pairs.
      above_24_bits: >-
        The four on-mode RS-1 instances above 24 bits (26 1 5, 28 1 5, 30 0 4 and 30 4 4) have complete
        SS retention (census never saturated), so every check above holds for them too. Six census
        instances above 24 bits (the twins of those four and the C-b m = 4, 5 census rows) have SS rows
        retained only up to census saturation. The retained prefix passes every check. Their pair
        undercount cannot be recomputed, and A7 does not use it.
      c_alternatives: >-
        No F2 alternative reads a pair count. r_frozen uses rows_fed; r_rank and r_rank1 use the solver
        rank; r_rel and r_census use the decomposition relations; r_distinct uses the retained star rows,
        deduplicated by normalised relation; S_search and c = 1 change only S or the constant. r_distinct
        is therefore not exposed to the undercount: it is built from rows, and the rows are complete.
      artifacts: checks/f5_groups.py, checks/out/f5-groups.jsonl, checks/out/f5-groups-summary.json

    F7:
      statement: >-
        The prediction (2) exponent against the floor model. The m = 4 small_x harvest-on S_3 exponent
        (0.6076 as composed) lies below the floor model's (m+1)/(2m) = 0.625 and below its
        design-evaluated value. The joint asserts that this gap is finite-range lower-order terms plus r
        and |F| accounting, not a sub-floor trend.
      verdict: breaks
      verdict_note: >-
        By the plan's breaking artifact: "a ratio slope under r_rank that is negative beyond its
        calibrated interval". On the 55 m = 4 small_x harvest-on instances (12..32 bits), log2 of
        S_3/((1/2)*sqrt(r_rank*N)) has slope -0.0149 in log2 N. Its 95% interval, calibrated by
        simulation at this design, is [-0.0242, -0.0053]. That interval excludes 0 by a margin 26 Monte
        Carlo s.d. wide, and 0 of 200 seeds flip the decision. The gap does not track r/|F| under r_rank,
        and it does not shrink over the upper half of the tested range. What breaks is the joint's
        statement "not a sub-floor trend", read as the plan operationalises it. The ratio itself stays
        between 2.10 and 3.63 on every instance of this series (minimum over every m = 4 on-mode instance
        of every arm 1.54), so no instance falls below the floor under r_rank. Nothing is extrapolated
        beyond 32 bits.
      a_design_evaluated_comparator_MC6:
        sealed_first: Q4 of the sealed file (values below at 2000 replicates there, recomputed here at 20000)
        observed_S3_exponent: >-
          0.60763 by frozen stats.fit_exponent over 12..32 bits (55 instances). Nominal 95% interval
          [0.60107, 0.61425] at 20000 replicates ([0.60101, 0.61445] at the frozen 2000, as composed).
          Calibrated interval [0.5987, 0.6166] (kappa 1.359). It equals the composed 0.6076
          [0.601, 0.614].
        floor_exponents_on_the_same_rows: >-
          Fit of (1/2)*sqrt(r*N): r_frozen 0.64147 [0.63269, 0.65062]; r_rank 0.62253 [0.61865, 0.62679];
          r_rank1 0.61824 [0.61473, 0.62203] (20000 replicates).
        model_exponents: >-
          (1+beta)/2 with beta = ln|F|/ln N per instance, averaged per rung: 0.6197-0.6311; mean 0.62347
          over 12..32 and 0.62215 over 20..32. Fit of sqrt(|F|*N): 0.62105 [0.61769, 0.62464].
          Asymptotic (m+1)/(2m) = 0.625.
        prior_figures: >-
          The prior red team's MC-6 figures 0.621/0.629 (quoted in DEC-20260929-bbb3a9, read before the
          seal): my sqrt(|F|N) fit 0.62105 agrees with 0.621. None of my comparators gives 0.629, and that
          record does not define it.
      b_ratio_slopes_MC1_MC2:
        m4_small_x_on: >-
          At 20000 replicates, seed 0: r_frozen -0.03384 [-0.04169, -0.02558]; r_rank -0.01491
          [-0.02182, -0.00781]; r_rank1 -0.01061 [-0.01736, -0.00368]. Seed sweep at 200 seeds x 2000
          replicates: Monte Carlo s.d. of every endpoint <= 0.00026, and the "interval excludes 0"
          decision flips in 0 of 200 seeds for all three.
        m4_other_bases_on_r_rank: >-
          subgroup -0.0085 [-0.0168, +0.0014]; dickson -0.0109 [-0.0210, +0.0002]; random_sub -0.0137
          [-0.0191, -0.0080]; random_dick -0.0149 [-0.0212, -0.0086] (nominal, 20000 replicates).
        other_m_and_modes_r_rank: >-
          m = 4 census, all bases: +0.113 to +0.151, the plain engine's even-m excess. m = 3 on: -0.0016
          to -0.0079. m = 5 on: -0.014 to -0.026. m = 3 census: -0.003 to +0.003. m = 5 census: -0.030 to
          +0.020. Every (m, base, mode) series under r_frozen, r_rank, r_rank1 and S_3 is in
          calibration/out/f7.json (ratio_slopes_20000).
      c_calibration_MC5: >-
        Calibrated at this design: 55 points (11 rungs x 5) at the actual log2 N values, the frozen
        bootstrap_slope (reps 2000, seed 0) on each synthetic series, and 1000 series per configuration.
        There are 34 configurations: the quantities S_3, ratio_rank, ratio_rank1 and ratio_frozen; noise
        laws Gaussian, t3, pooled empirical residuals, within-rung empirical residuals and per-rung
        Gaussian; true slope 0 and the observed slope. The nominal 95% interval covers 0.872-0.918. The
        two-sided false exclusion of a true slope 0 is 0.082-0.128, against 0.05 nominal. The half-width
        multiplier that restores 95% coverage is kappa = 1.131-1.457; the worst case per quantity is S_3
        1.359, ratio_rank 1.349, ratio_rank1 1.290 and ratio_frozen 1.457. This re-measures the prior
        J5 (0.913-0.916 for fit_exponent) and is consistent with its sqrt((n-1)/n) deflation at n = 5.
        Seeds: random.Random('F7-cal|...') and ('F7-supp|...') per configuration (calibration/f7.py,
        calibration/f7_supp.py).
      d_decision: >-
        Each calibrated interval below uses the worst-case kappa over every configuration. ratio_rank:
        -0.01491, calibrated [-0.0242, -0.0053]: negative beyond calibrated error; margin of the upper
        end 0.0053 against an MC s.d. of 0.0002. ratio_rank1: calibrated [-0.0193, -0.0017]: also
        negative beyond calibrated error, by less. ratio_frozen: calibrated [-0.0453, -0.0218]. So under
        r_frozen, r_rank and r_rank1 alike, the observed S_3 exponent lies below the design-evaluated
        floor-model exponent beyond the calibrated error. Against (1+beta)/2, the slope of S_3/sqrt(|F|N)
        is -0.0134 [-0.0209, -0.0058] (nominal; not separately calibrated).
      does_the_gap_track_r_over_F: >-
        Under r_frozen, partly. r_frozen/|F| rises as N^0.0408 [0.0245, 0.0586] (fed-row multiplicity
        grows with N), which accounts for about half of the r_frozen gap (-0.034 against -0.015). Under
        r_rank, no. r_rank/|F| has slope +0.0030 [+0.0001, +0.0061], so HEUR-0cc7e8-H2 holds for r_rank
        to within about 0.003; the "excludes 0" call on that slope flips in 15% of 200 seeds. The gap
        does not vanish in the r_rank ratio slope.
      lower_order_terms: >-
        Within the tested range, the r_rank slope does not flatten. Nominal values (the sub-range
        intervals are not calibrated): 12..22 -0.0127 [-0.0325, +0.0075]; 20..32 -0.0134 [-0.0205,
        -0.0046]; 22..32 -0.0130 [-0.0207, -0.0041]. Under r_frozen the slope does flatten (12..22
        -0.0515; 22..32 -0.0124 [-0.0269, +0.0043]). Data at 12..32 bits cannot exclude a lower-order
        cause. For example, a cofactor of order (ln N)^(-1/4) has local log-log slope -0.25/ln N, about
        -0.014 at 26 bits; that is my own arithmetic, not a citation. Nothing in these data shows such a
        cause either.
      level: >-
        Under r_rank the ratio has per-rung medians 2.98 (14 bits) down to 2.38 (32 bits), and every
        instance of the series lies between 2.10 and 3.63. The minimum over every m = 4 on-mode instance
        of every arm is 1.54 (main 12 2 4 random_sub_r2). Under r_frozen the per-rung medians fall from
        1.86 to 1.07-1.10 at 28-32 bits.
      post_hoc_sensitivity: >-
        LABELLED POST HOC; not decision-bearing; written after f7.json was read
        (calibration/f7_posthoc.py, calibration/out/f7-posthoc.json). Ratio slope under raw r_distinct:
        small_x -0.0067 [-0.0141, +0.0005] (nominal interval includes 0), subgroup -0.0003, dickson
        -0.0027, random_sub -0.0059 [-0.0111, -0.0005], random_dick -0.0063 [-0.0121, -0.0003]. Under
        r_census: small_x -0.0106 [-0.0175, -0.0034]. The F7 decision depends on which r the floor is
        read with. The plan names r_rank, and joint F3 (not mine) owns that choice.
      where_the_plan_thought_it_breaks: >-
        "The ratio slope under r_rank is within calibrated error of 0, so the exponent gap is lower-order
        terms." It is not within calibrated error of 0: [-0.0242, -0.0053].
      artifacts: calibration/f7.py, calibration/f7_supp.py, calibration/f7_posthoc.py, calibration/declared-sha256.txt, calibration/out/f7.json, calibration/out/f7-supp.json, calibration/out/f7-posthoc.json, and Q4 of the sealed file

