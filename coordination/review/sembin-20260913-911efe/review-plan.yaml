review_plan:
  id: REVIEW-SEMBIN-20260913-911efe
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-9d649f
  written_by: coordinator
  written_at: '2026-09-13'
  written_before_any_reviewer_ran: true
  written_before_any_reviewer_ran_evidence: >-
    TASK-20260913-0d6586 is `queued` with no lane claim at the time this file is written;
    the run package it reviews was snapshot-archived by TASK-20260913-e39bfe in commit
    e7a7f6ddb before this plan. The Coordinator has read the executor's summary
    (N1 = 16, all sixteen at n12 m6 t6 k2 twist-side single-x-multiset with usable = 0;
    N1 = 0 at every t = 2 even-n low-degree cell; Tr = 0 class variance/mean 0.967-1.042;
    odd-n f_dispersion 0.985-1.015) and has NOT read parity-split.json, raw-result.json
    or the code. The prior below is formed from that summary and the contract.

  why_this_round_exists: >-
    EXP-SEMBIN-911efe tests H-SEMBIN-83a856 (trace-parity confinement) against committed
    per-target data by one deterministic integer plus a shape test. Its outcome can move
    H-SEMBIN-83a856 to supported or weakened, close the open attribution in
    EV-SEMBIN-d40877 (O-5 "property of the x-coordinate window"), and add a parity
    condition to how this program reads Nagao 2015/984 Section 7. That is claim-changing,
    so it runs under a plan with the Coordinator's prior recorded first.

  claim_under_review: >-
    (a) On every low_degree_polynomial configuration of RUN-SEMBIN-1b9afe at even n, no
    target with pi(R) = Tr(x_R) + Tr(a) != m Tr(a) has any USABLE decomposition
    (points of E(F_q)); (b) inside the reachable class the per-target count has
    eq. (11)'s Poisson shape at mean 2 lambda, so the pooled variance/mean is 1 + lambda;
    (c) at odd n, where 1 in V has trace 1, there is no deficit; (d) the known-false
    splits show no empty class.

  coordinator_prior:
    on_K1_the_sixteen:
      expectation: >-
        I EXPECT K1 TO HOLD, WITH THE SIXTEEN BEING A CONTRACT-WORDING DEFECT AND NOT A
        FALSIFICATION. The hypothesis is a theorem about points of E(F_q). The contract's
        N1 says "nonzero count in either presentation", and the run's
        `single_x_multiset` column counts x-multisets returned by the algebraic system
        INCLUDING those whose y_i lie in F_{q^2} \ F_q, which are not points of E(F_q)
        and to which the parity theorem does not speak. The executor reports usable = 0
        on exactly those classes. So I expect: N1 restricted to usable (or to
        `usable_point_multiset`) is 0 everywhere, and the sixteen are all in the
        non-usable remainder, at a cell (n = 12, t = 6, k = 2, |V| = 4) so degenerate
        that L = 3 or so and the x-multiset count is dominated by non-rational solutions.
        The twist side is where I said in the contract's coordinator_prior a wrong a
        would look like a falsification; the executor says a = 512 with Tr(a) = 1 was
        used -- verify that a is the TWIST's a and that the twist's confined class is
        pi = m Tr(a) = 0 (m = 6 even), so pi = 1 is indeed the class predicted empty.
      what_would_change_my_mind: >-
        A single (configuration, target) pair with pi(R) != m Tr(a) whose
        `usable_point_multiset` (or any column counting F_q-rational decompositions) is
        nonzero, with the side's a, the modulus and x_R verified. That falsifies the
        confinement as applied and the finding is the error, wherever it is.
      confidence: high on the arithmetic; moderate on the twist-side bookkeeping
    on_K2_shape_and_controls:
      expectation: >-
        I EXPECT K2 TO HOLD. Tr = 0 class variance/mean 0.967-1.042 against 1.46-1.52
        pooled is the Poisson shape restored; pooled variance/mean 1.438-1.545 against
        1 + lambda = 1.451-1.516 is agreement at the level 5 seeds x 1000 targets can
        resolve; odd-n f_dispersion 0.985-1.015 is the nearby-object control passing.
        Where I think it is most likely to be wrong: the pooled-vs-(1 + lambda) comparison
        has no stated interval in the summary. A 0.04 disagreement (n22, B=1: 1.5445 vs
        1.5055) is either inside the sampling error of a variance estimate over ~5000
        targets or it is not, and someone has to compute which. I also want the Tr = 0
        class MEAN checked against 2 x pooled mean, which the summary does not print.
      what_would_change_my_mind: >-
        Pooled variance/mean systematically above 1 + lambda beyond its interval at all
        three cells (something else over-disperses), or the Tr = 0 class variance/mean
        interval excluding 1 at any cell.
      confidence: moderate
    on_the_known_false_controls:
      expectation: >-
        I expect both known-false splits (LSB of x_R; Tr under a second irreducible) to
        produce two populated classes with equal means. If the second-irreducible split
        produced an empty class the analysis would be reading the modulus wrong, and the
        executor reports it did not.

  joints:
    - joint: >-
        K1 -- THE INTEGER. That N1, restricted to USABLE decompositions (points of
        E(F_q)), is exactly 0 over all low_degree_polynomial even-n configurations on
        both sides, with each side's own a; and that the sixteen reported pairs are
        all non-usable x-multisets at n12 m6 t6 k2 on the twist side.
      assigned_to: TASK-20260913-0d6586
      attack_plan: >-
        BEFORE opening parity-split.json or the producer's code, write your own trace
        function against experiments/EXP-SEMBIN-354a75/code/binary_field.py's
        modulus_for(n) (read that file; it is the SOURCE run's code, not the producer's),
        read per-R-counts.json's columns, and compute N1 yourself for two definitions:
        (i) the contract's literal "nonzero in either presentation" using
        single_x_multiset and chained_x_multiset, and (ii) usable_point_multiset only.
        Record both integers and the offending pairs BEFORE comparing. Then open the
        producer's parity-split.json and compare pair-for-pair. Then verify the twist
        side: from the source code, what is the twist curve's a', is Tr(a') = 1 as
        claimed, and is the class predicted empty pi = m Tr(a') (mod 2)? Then say, in
        one sentence, whether the sixteen are a wording defect of the contract, a defect
        of the theorem, or a defect of the run.
      breaking_artifact: >-
        Any pair with pi(R) != m Tr(a) and a nonzero USABLE count, verified; or a
        twist-side a that is not the twist's; or your (ii) integer differing from 0.
      holding_artifact: >-
        Two independently computed integers, (i) = 16 with the same sixteen pairs and
        (ii) = 0, plus the twist-side bookkeeping verified.
    - joint: >-
        K2 -- THE SHAPE AND THE CONTROLS. That inside the pi = m Tr(a) class the
        per-target count is Poisson at mean 2 lambda (variance/mean interval containing
        1; mean within error of twice the pooled mean); that the pooled variance/mean
        agrees with 1 + lambda within a STATED interval; that the random-V null shows
        no stratification; that both known-false splits populate both classes with
        equal means; and that the odd-n cells show f_dispersion within error of 1.
      assigned_to: TASK-20260913-0d6586
      attack_plan: >-
        Recompute per-class mean and variance/mean per CONFIGURATION (not pooled over
        seeds) and give each a bootstrap or delta-method interval; the producer's pooled
        figures hide configuration-level scatter, which is exactly what understated the
        interval 4-5x in RUN-SEMBIN-1b9afe (EV-SEMBIN-d40877 O-4). Test pooled
        variance/mean against 1 + lambda with that interval. Check the Tr = 0 mean
        against 2 x pooled mean. Rerun the LSB and second-irreducible splits yourself.
        For the odd-n cells, confirm the run enumerated V^2 exhaustively (|V| = 2^11,
        2^12) rather than sampling, from its own logs and counts.
      breaking_artifact: >-
        A Tr = 0 class variance/mean interval excluding 1 at any t = 2 even-n cell; a
        pooled variance/mean outside its interval around 1 + lambda at all three cells in
        the same direction; a known-false split with an empty class; an odd-n cell that
        was sampled.
      holding_artifact: >-
        Per-configuration table with intervals; the four comparisons stated with their
        intervals; the controls rerun.

  every_joint_has_exactly_one_owner: true
  owners:
    TASK-20260913-0d6586: [K1, K2]

  blindness:
    within_round: true
    statement: >-
      One reviewer, two joints; nothing to be blind to within the round except the
      producer's outputs for K1's first pass, which the attack plan sequences
      explicitly. The reviewer may not read EV-SEMBIN-d40877's successor records if any
      exist by then (none do at writing).
    lifted_for: []
    lifted_for_rationale: Nothing lifted.
    what_reviewers_may_read: >-
      experiments/EXP-SEMBIN-911efe/ (after K1's first pass), experiments/EXP-SEMBIN-354a75/
      (source data and code), ledger/hypotheses/H-SEMBIN-83a856.yaml,
      ledger/proposals/IDEA-20260913-cedd2f.yaml, inputs/SEMAEV-2015-310, this plan.
    a_disclosure_this_plan_makes_deliberately: >-
      This plan says where I think the sixteen come from. The reviewer will read it. The
      anchoring cost is real and is answered by K1's sequencing: the two integers are
      computed before the producer's file is opened, so the reviewer's N1 is its own.

  proves_too_much:
    required: true
    objects:
      - owner: TASK-20260913-0d6586
        object: >-
          The random_k_dimensional configurations at the same three cells. The
          confinement argument, applied to a V NOT in ker(Tr), predicts NOTHING (both
          classes populated, equal means). If the same split machinery produces an
          empty or depleted class there, the machinery is producing the effect. The
          executor reports it does not; verify, do not take on report.
        why_this_object: >-
          It is the object of the same shape for which the conclusion is known false,
          and it is already in the data.
    failure_signature: An empty or depleted pi class on a random-V configuration.
    what_a_failure_means: The split code, not the curve, is producing the effect; the run is invalid.

  blind_rederivation:
    required: false
    reason: >-
      The load-bearing quantity is an exact integer over committed data, and K1's attack
      plan has the single reviewer compute it with independent trace code BEFORE opening
      the producer's outputs, then compare. That is a re-derivation with a declared
      sequencing rather than a separate blind session. A separate blind session is not
      dispatched because the bound review backend is at its usage limit
      (IMP-SEMBIN-REVIEW-MAX) and the fallback tier is being spent on the review itself;
      recorded here as the deviation it is, not hidden. If K1 breaks, a separate blind
      re-derivation becomes required before any composition.

  what_this_round_may_and_may_not_do:
    may:
      - report K1 and K2 as holds, breaks or inconclusive, with artifacts
      - find the contract's N1 wording defective and say so
      - overturn any part of the prior
    may_not:
      - move a hypothesis status; only a committed Coordinator decision does that
      - write an evidence record; that is TASK-20260913-de1707
      - measure or assert any degree
      - state anything about any curve's security, in either direction
      - offer a whole-claim verdict from a fraction of the evidence

  escalation:
    condition: >-
      None expected. A confirmed mechanism here is a constant-factor correction to a
      yield model and a parity condition on a published construction's parameters; it
      contradicts no published complexity claim and is not a breakthrough. If the
      reviewer believes otherwise, record why and stop.

  procedure_deviations: []

  # Additive composition block, written by the Coordinator AFTER the reviewer
  # returned and BEFORE this file is bound by the ledger archive TASK-20260913-de1707.
  # Nothing above this line was changed after TASK-20260913-0d6586 was dispatched.
  joint_outcomes:
    - joint: K1
      owner: TASK-20260913-0d6586
      owner_verdict: holds
      coordinator_composition: holds
      deciding_artifact: coordination/review/sembin-20260913-911efe/TASK-20260913-0d6586/scratch/k1_n1_pass1.json
      note: N1 (i) = 16 same sixteen pairs as the producer; N1 (ii) = 0; a_T = 512, Tr = 1 verified from the source construction.
    - joint: K2
      owner: TASK-20260913-0d6586
      owner_verdict: holds
      coordinator_composition: holds
      deciding_artifact: coordination/review/sembin-20260913-911efe/TASK-20260913-0d6586/independent-figures.json
      note: >-
        Holds at cell grain; the (n = 22, B = 1) box excludes 1 at 2.1 sigma and is
        carried as EV-SEMBIN-0c8bf4 O-4, not absorbed.
    - joint: proves_too_much
      owner: TASK-20260913-0d6586
      owner_verdict: passed
      coordinator_composition: passed
  prior_outcome:
    on_K1_the_sixteen: confirmed (DEC-20260913-92aa48 confirmed_priors)
    on_K2_shape_and_controls: confirmed, with one box-grain exclusion the prior did not anticipate
    on_the_known_false_controls: confirmed (both splits rerun; no empty class)
  composed_at: '2026-09-13T23:10Z'
  composed_into: [EV-SEMBIN-0c8bf4, DEC-20260913-92aa48]
  independence_checker_result: PASS (run 2026-09-13T23:00Z on the attestation as filed)
