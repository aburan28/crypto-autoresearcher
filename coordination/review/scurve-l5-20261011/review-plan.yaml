  written_at: '2026-10-11'
  written_before_any_reviewer_ran: true
  source_custody_archive: TASK-20261011-071e47
  claim_under_review: >-
    The documented precondition #E = p holds for the stated tuple,
    certified. (Claim ceiling of the lane; no transfer was mounted.)
    This is the producer's C4_sentence in
    coordination/goals/GOAL-SCURVE-48e06c/batches/BATCH-aa389e/tasks/TASK-20261001-762c5f/transfer-lane-L5.yaml.
    Its source-binding record labels the tuple primary_host_direct; that
    provenance is separately under review and is not presumed from custody.
  claim_ceiling: >-
    A certificate of the precondition for the exact stated tuple, with its
    verified source label. No transfer, unknown-scalar recovery, attack cost,
    SafeCurves criterion cell, or curve safety verdict follows from this round.
  coordinator_prior: >-
    Before any independent report, the Coordinator expects the arithmetic C4
    implication to reproduce for the stated integer tuple, but does not assume
    the direct-host provenance label or the control implementation is correct.
    A source mismatch, a failed certificate, or a control that accepts a known
    false object would overturn that expectation. The prior is a forecast,
    not evidence or a status transition.
  review_tier:
    policy: review-adversarial
    reasoning_effort: xhigh
    rationale: >-
      This is bounded validation of a known diagnostic precondition. A claimed
      breakthrough, closure result, or contradiction of validated evidence
      must stop composition and receive a separate independent
      review-breakthrough round at max effort.
  joints:
    - joint: 'J1 -- source provenance and exact tuple binding'
      assigned_to: TASK-20261011-ae5aa8
      attack_plan: >-
        Independently attempt the four raw SafeCurves source URLs and record
        transport route, exact returned bytes and SHA-256, response status,
        retrieval time, and cited line or byte offset for p,a,b,x1,y1,l.
        Compare each digit string to the frozen producer files and source-
        binding labels. Search for a proxy or archived capture being called
        primary-host-direct, a value copied from a different page, or a
        source/tuple mismatch. Record C-1 unresolved if direct confirmation
        cannot be reproduced; do not turn access failure into math evidence.
      breaking_artifact: >-
        A raw-source excerpt with bytes, URL, offset and hash contradicting a
        bound parameter or provenance label, or a documented inability to
        verify a claimed direct route.
    - joint: 'J2 -- blind C1 C2 C3 HD3 derivation of C4'
      assigned_to: TASK-20261011-c126c2
      attack_plan: >-
        In a clean input bundle containing only the J2 handoff's blind_inputs,
        without this review plan, repository history or producer output,
        independently certify primality of p (export and verify a real
        certificate), check the curve and base point over F_p, compute pG
        with independently written arithmetic plus a second implementation,
        and prove the exact Hasse interval excludes 2p. Use only the six
        integers in blind_rederivation.parameters. Retain code, commands and
        raw output. Try invalid discriminant or point handling and a mistaken
        probabilistic-prime label as cheap ways to break C1-C3.
      breaking_artifact: >-
        A checkable failed prime certificate, point identity, scalar
        multiplication or interval inequality, or an independently
        reproducible contradiction between implementations.
    - joint: 'J3 -- control discrimination and scope boundary'
      assigned_to: TASK-20261011-fcf078
      attack_plan: >-
        Implement an independent verifier for the same C4 predicate. Exercise
        the target, the parameter-matched quadratic twist, at least 20 fresh
        same-prime random nonsingular curves with an independently chosen
        recorded seed, a one-digit certificate fault, and an independently
        exact-counted small curve with order different from its field prime.
        Check that all use the same acceptance path, and that CTRL-DECAY was
        deferred as declared. Search the report and code for any transfer,
        attack, safety claim or SafeCurves True/False cell.
      breaking_artifact: >-
        Raw code and output showing acceptance of a known false object,
        failure to accept the positive object, an unrecorded control path
        difference, or an out-of-scope claim.
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
      - >-
        A separately exact-counted small nonsingular curve over F_q with
        #E(F_q) != q, chosen before running the independent C4 verifier.
        The review report must state q, coefficients, exact point count and
        why the C4 conclusion is false there.
      - >-
        The parameter-matched quadratic twist once its order is independently
        established as p+2 from the validated trace relation. Do not use the
        producer's asserted twist order as its own proof.
    failure_signature: >-
      The unchanged C4 acceptance predicate must refuse each known false
      object; a mutated certificate must be rejected. A method that accepts
      one of them proves more than its premises allow.
    assigned_to: TASK-20261011-fcf078
  blind_rederivation:
