# J9 O2 (N-ELL) -- DECLARATION, written BEFORE the first draw (RT-3). Order in
# j9-ptm/ORDER.log. TASK-20260924-d95e70.
o2_declaration:
  seed: 2026092431001
  generator: numpy.random.Generator(numpy.random.PCG64(2026092431001)), ONE generator for the whole stream
  numpy_version_required: 2.4.6
  numpy_version_used: 2.4.6 (checked with python3 -c "import numpy; print(numpy.__version__)")
  union_support: >-
    U_k = supp(E^0_k) union (union over j = 0..16 of supp(E^j_k)), with
    E^0 = E(x_R = 0) and E^j = E(t^j) - E^0 on the Stage-1 curve (B from
    RUN-CERTBIN-3b7e05 curve.json), in the 17 x 172 layout of the frozen
    convention (columns = multilinear monomials of degree <= 2 by degree
    ascending, then ascending sorted index tuple). Computed with MY descent
    (rtlib.descent); per-equation sizes checked equal to the archived
    union_support_size_per_eq of p1-instances.json.gz, and U checked equal to
    the one built from the archived EXP-CERTBIN-4e92d7 macaulay.affine_basis
    (imported, read-only use).
  draw: >-
    Per draw, exactly the F-NULLF2 construction of EXP-CERTBIN-4e92d7
    (families.draw_nullF2_instance): M = zeros(17*172); M[Upos] =
    g.integers(0, 2, size=Upos.size); reshape to 17 x 172, where Upos =
    flatnonzero(U) in row-major order. THEN c = int(g.integers(0, 2)). Rows
    0..15 of M are kept; row 16 is REPLACED by the linear form v_0 + v_9 + c
    (row 16's drawn bits are discarded but were consumed from the stream).
  keep_rule: >-
    Exhaustive evaluation of all 17 equations over all 2^18 assignments (own
    bit-sliced truth tables). Keep the draw iff s = 0. Stop at the 20th kept
    draw. Every draw is recorded (draw index, c, s, sha256 of its E_hex,
    kept/rejected); duplicates of an earlier draw would be recorded and
    rejected (none expected).
  prediction_derivation:
    T4: >-
      For a system whose generator set contains ell = v_0 + v_9 + c exactly
      (so ell is in M_2 <= M_4), let pi: B -> B' substitute v_0 := v_9 + c and
      let W'_4 be the degree-4 mutant closure of the substituted system in the
      17 variables v_1..v_17. Then W_4 = pi^{-1}(W'_4) cap B_{<=4}. Proof: the
      right side contains M_4 and is closed under g -> v_j g for deg g <= 3
      (pi(v_j g) = pi(v_j) pi(g) with pi(v_0) = v_9 + c), so it contains W_4.
      Conversely W_4 contains ker(pi) cap B_{<=4} = ell * B'_{<=3} (products
      v_j (mu ell) with mu ell in M_4, deg <= 3), and pi(W_4) contains R'_4
      and is closed (a degree-<=3 element h' of pi(W_4) is, as an element of
      B not involving v_0, in W_4 modulo ker, hence in W_4, and v_j h' is in
      W_4), so pi(W_4) contains W'_4. So dim W_4 = dim W'_4 + 834 and
      1 in W_4 iff 1 in W'_4.
    T5: >-
      If R'_4 cap B'_{<=3} = rowspace(R'_3) (no non-trivial fall in the
      substituted system at degree 4), then W'_4 = R'_4 (v_j times a row
      mu' f'_k with deg mu' <= 1 is a row of R'_4). Then W_4 = rowspace(M_4)
      + ell * B_{<=3}, final dim = rank R'_4 + 834, 1 in W_4 iff 1 in R'_4,
      dim(W_4 cap B_{<=d}) = dim(R'_4 cap B'_{<=d}) + dim B'_{<=d-1}, and the
      iteration reaches W_4 at iteration 1 (W^(1) contains M_4 + ell B_{<=3}),
      so iterations_to_fixpoint = 1 whenever rank M_4 < final dim.
    semi_regular_values: >-
      16 quadratics in 17 variables, semi-regular: rank R'_4 = 2328, fall
      profile d = 0..4 [0, 0, 16, 288, 2328], rank R'_3 = 288, 1 not in R'_4.
      Hence the generic prediction: NOT refuted, final dim 2328 + 834 = 3162,
      dims_by_deg [0, 1, 34, 442, 3162], iterations_to_fixpoint 1.
  per_instance_prediction_rule: >-
    For each kept draw, BEFORE the engine runs, compute with my own code
    rank R'_4, its fall profile, rank R'_3 and rank M_4 of the original
    system. If R'_4 cap B'_{<=3} = R'_3: declare one = False iff 1 not in
    R'_4, final_dim = rank R'_4 + 834, dims_by_deg from T5, dims =
    [rank M_4, final_dim], iterations_to_fixpoint = 1. If the condition fails
    on a draw, declare "T5 not applicable" and the semi-regular derivation is
    then already refuted for that draw (reported as a finding about the
    prediction, not the engine).
  signature_check: >-
    The archived engine (experiments/EXP-CERTBIN-e94b27/impl/closure.py,
    Closure(18, 4, 17).w_closure, unchanged) is run on each kept draw after
    the predictions file is written and hashed. PASS iff no refutation and
    final_dim equal to the declared value on every draw. If the engine
    refutes a draw: my own literal W_4 (rtlib.literal_W) is run on it; mine
    refutes too -> finding about the prediction; mine does not -> the engine
    proves too much. My own literal W_4 is ALSO run on every draw as a
    cross-check, after the engine.
