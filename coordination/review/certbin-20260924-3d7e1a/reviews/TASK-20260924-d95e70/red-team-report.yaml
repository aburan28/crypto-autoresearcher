      O1:
        source: archived closures.jsonl.gz and instance-sets.json only (RT-4); j9-ptm/o1-table.json
        result: >-
          S62 s distribution is {2: 41, 4: 17, 5: 1, 6: 2, 8: 1}, all s <= 31.
          codim(W_4 in B_{<=4}) = s on 62/62 (EQUALITY, so W_4 = I cap
          B_{<=4}). codim(M_5 cap B_{<=4}) = s on 62/62. codim(W_5 in B_{<=5})
          = s on 10/10. No codim < s anywhere, and no refutation.
        rm_bound:
          rt5_status: verified
          proof: >-
            ev_S restricted to B_{<=d} is onto F_2^S iff no nonzero word of
            RM(d, m)^perp is supported inside S. RM(d, m)^perp = RM(m-d-1, m):
            the inner product of monomials A and B is 2^{m-|A u B|} mod 2,
            which is 0 when |A| + |B| < m, and the dimensions add to 2^m.
            A nonzero Boolean function of degree <= r has weight >= 2^{m-r}.
            With r = m-d-1, every nonzero dual word has weight >= 2^{d+1}, so
            surjectivity holds for |S| <= 2^{d+1} - 1. B is F_2^{2^m} as a
            ring, so I is the vanishing ideal of the solution set, and hence
            codim(I cap B_{<=d}) = s; soundness gives equality iff the closure
            equals I cap B_{<=d}.
          machine_check: >-
            m = 5, 6, 7 and d = 0..3: 200/200 random sets of size 2^{d+1} - 1
            are surjective, and a (d+1)-dimensional subspace is not (the
            bound is tight).
