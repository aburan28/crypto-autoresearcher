  baseline_comparison: >-
    No cost claim is made and none is supported. Per attempt at m = 2,
    oracle A (2^9 = 512 quadratic root-findings over V) decides
    satisfiability and returns the solutions. It dominates W_4 (a 2924-row
    M_4 plus about 17,000 product rows over 4048 columns; about 2.2 s per
    instance in the run), M_5 (16796 x 12616; about 4.7 s) and the R'_4
    route (2618 x 3214). For the DLP at q = 32603: parallel Pollard rho takes
    about sqrt(pi q / 4), roughly 160 group operations; BSGS takes about
    2 sqrt(q), roughly 361 operations with memory about 181. sota_delta is
    zero on time, memory and data. dominated_by as stated in the
    specification was checked on time and memory against oracle A,
    Pollard rho and BSGS; FES/WDSat were not compared (as disclosed there).

  heuristic_challenges:
    - >-
      Random-model transfer (the central finding). The semi-regular model
      transfers to the same-support nulls: exact at D = 4 on 124/124, and on
      N-ELL 20/20. It does NOT transfer to S_3, whose substituted fall
      profile is [1, 18, 154, 834] against [0, 0, 16, 288]. Minimality and
      structure bias the probability of low-degree refutation UP, not down.
      The cheapest exposing computation is RC-B.
    - >-
      The M_5-null reading uses an unnumbered heuristic (OBJ-8). Any evidence
      record should label it a reading, not a derivation.
    - >-
      HEUR-CERTBIN-RD1 (rate transfer) is not tested here, and nothing in
      J7-J10 bears on it.

  cost_model_challenges:
