          [0, 0, 16, 288]. It is true for a generic one-linear-fall system
          (N-ELL 20/20 exact). What was overturned is the random-model
          transfer to a structured system, not the semi-regular arithmetic.
        combined_rates: >-
          386/386 at W_4 and at D <= 5. The 324 are imported through
          M_4 <= W_4, which holds by definition, so the import is sound. The
          empirical dependence is on Stage-1's per-instance "1 in R_4" flags.
          Only the 20 C20 were recomputed and certified in RC-1 (C-BASE; W_4
          certificates max deg 2); the other 304 rest on reviewed Stage-1
          flags with sample-level independent checks (EV-CERTBIN-6c3e0a
          O-11). "Checked on C20" checks the flags, not monotonicity. Quote
          it as 82 RC-1-certified (62 W_4 by J7 witnesses, 20 by M_4
          certificates) plus 304 Stage-1 flags.
        W5: >-
          W_5 never ran on an unsatisfiable instance, and no statement about
          W_5 refutation is made anywhere in run-report.md or
          implementation.md. MR4's W_5 null "0/0 [None, None]" must not be
          read as a rate.
        transfer_language: >-
          None found. run-report.md's scope paragraph disclaims other n,
          other curves, F4 and Semaev's Assumption 1, and implementation.md
          contains no transfer language.
      resource_check:
        examined: true
        reading: >-
          Three theories take these measurements as their HYPOTHESIS.
          (R1) Degree-4 polynomial calculus. 1 in W_D iff a degree-D PC
          refutation over F_2 with Boolean axioms exists: every W_D step is a
          PC step of degree <= D, including multilinearization through
          x^2 - x, and conversely the multilinearization of every PC line of
          degree <= D lies in W_D. So all 62 U62 attempts, plus C20, have
          degree-4 PC refutations, and on satisfiable controls degree-4 PC
          derives all of I cap B_{<=4}. These are the hypotheses of PC-degree
          automatizability (degree-d refutations found in n^{O(d)}; the CEI96
          algorithm is recalled, not read). Relevant only where enumeration
          does not dominate (m >= 3 or chained), where nothing is measured.
          (R2) Linearization-first solving. After substituting ell, the
          degree-4 Macaulay space contains the whole linear part of the
          vanishing ideal (S10: codim s at d = 1). A degree-4 solve therefore
          returns the affine hull of the solutions. Dominated by oracle A at
          m = 2.
          (R3) A theory of degree falls for structured bilinear systems. The
          m = 2 descent is exactly S_3 = phi(x_1 x_2) + x_R^2 (x_1 + x_2)^2 +
          B, with phi(y) = y^2 + x_R y of rank 16. Its quadratic part lies in
          the span of the 17 convolution forms Q_s = sum_{i+j=s} v_i v_{9+j}
          through phi's matrix, and ell is the cokernel functional
          Tr(. / x_R^2) (92/92; the nulls have 0/124 convolution form and
          quadratic rank 17; j7-mechanism/structure.json). This matches
          KN-LIT-7604's first fall degree 2 via a group morphism to F_2
          (abstract retrieved). The large D = 4 falls are the hypothesis of a
          structured-tensor degree-fall theory. The cheapest discriminating
          next measurement is the N-CONV control (required_controls RC-A).
        spawned_ids: []
        spawned_ids_note: >-
          None minted; the red team writes no ledger record. R1-R3 and RC-A
          are candidates for the Coordinator's ranking, not evidence.

  # ---------------------------------------------------------------------------
  objections:
    - id: OBJ-1
      joint: J7
      text: >-
        The Coordinator's stated reason for the forced first-iteration fill
        is false. rank R'_4 = 2213/2212 < 3214 on 62/62, so
        M_4 + ell * B_{<=3} has dimension 3047/3046, not 4048. The fill is
        forced by the whole fallen space F of M_4 (964-978 dimensions), and
        an independent literal W^(1) reproduces it on 62/62.
    - id: OBJ-2
      joint: J7, J9, J10
      text: >-
        "ell explains the W_4 refutation" holds only as SUFFICIENCY on S_3.
        ell is not necessary: the non-ell falls alone give W^(1) = B_{<=4}
        with 1 in it on 62/62. It is not generically sufficient: N-ELL is
        0/20. The load-bearing ingredient is S_3's non-semi-regularity: 4-12
        linear forms already in M_4, 98-112 non-trivial syzygies, and
        R'_4 containing B'_{<=3}. H-CERTBIN-5e71c9's mechanism paragraph,
        KN-OPEN-3c8f51's "It does not explain degree 4" (as applied to S_3)
        and pre-data prior (a)'s reason should be read in this narrower
        sense.
    - id: OBJ-3
      joint: J7, J10
      text: >-
        MR1's frozen wording "VERIFIED certificate for 1 in W_4" and the
        run-report's "(verified certificates only)" say more than the flat
        format certifies. The 62 run certificates certify 1 in rowspace(M_5),
        and the observation fiber is exhibited. The W_4 qualifier is backed
        by review artifacts: 62 structured witnesses, verified against two
        constructions, and an independent literal W^(1) on 62/62. It is
        also backed by J5/J6 per the plan. It is not backed by the run's
        certificates.
    - id: OBJ-4
      joint: J8, J10
      text: >-
        CLEAN is not S_3 evidence. The nulls would also be CLEAN through M_5,
        and D_reg = 5 holds at n = 17 and at n = 19. NA-5's premise is met
        but uninformative, so the n = 19 cell must rest on the D = 4 signal.
    - id: OBJ-5
      joint: J8
      text: >-
        The W_4 row is not an independent measurement for the nulls. They are
        exactly semi-regular at D = 4, so W_4 = M_4 and their W_4 rate is
        their M_4 rate, necessarily 0. The row restates, at W_4, the M_4
        fall-profile difference plus the fact that S_3's falls suffice.
    - id: OBJ-6
      joint: J8
      text: >-
        The nulls do not share S_3's quadratic structure: phi composed with
        the convolution forms, rank 16, against rank 17 and no convolution
        form. "S_3-specific" means specific relative to same-support random
        bilinear systems. N-AFF62 is a single random affine draw (effective
        family count 1).
    - id: OBJ-7
      joint: J10
      text: >-
        The combined rate 386/386 is certified in RC-1 for 82 instances. The
        other 304 rest on Stage-1 archived M_4 flags; the monotonicity step
        itself is definitional and sound.
    - id: OBJ-8
      joint: J8
      text: >-
        The M_5-null reading rests on an unnumbered heuristic: plain Macaulay
        refutes generic unsatisfiable systems at D_reg. Also, the generic
        quadratic series is not the exact reference at degree 5 for
        bilinear-support systems (ceiling 12364). It held on 124/124. State
        it as a heuristic reading, not a derivation.

  required_controls:
    - id: RC-A
      text: >-
        N-CONV, the cheapest discriminator for KN-OPEN-3c8f51 item (A).
        Unsatisfiable systems keep S_3's exact quadratic part phi(Q) (the
        rank-16 convolution image) and replace ONLY the linear and constant
        part by random bits on S_3's support, then go through M_4 and W_4
        beside the same-support nulls and N-ELL. If N-CONV is refuted at
        S_3's rate, the degree-4 mechanism is the convolution tensor and not
        the curve. The x(2E) modulation would then have to live in the linear
        part.
    - id: RC-B
      text: >-
        Before any semi-regular prediction is applied to an S_3 system (e.g.
        in the n = 19 design), compute the substituted R'_4 fall profile. It
        costs about 0.2 s per instance at n = 17 and is the random-model
        transfer check that would have caught prior (a).
    - id: RC-C
      text: >-
        An n = 19 cell must carry an N-ELL-type control at W_4 and must not
        use D <= 5 cleanliness as a discriminating statistic.
    - id: RC-D
      text: >-
        Successor contracts that count W_D refutations need degree-disciplined
        certificates (R-8). For ell-route refutations, the two-part (C_4, a)
        witness can be checked in seconds with no engine
        (j7-mechanism/j7_verify_witnesses.py is 66 lines).

  counterexample_or_mutation: >-
    Compositional mutation of W^(1)'s generating set (fill.json). Delete the
    ell multiples and it still refutes 62/62. Keep only the ell multiples
    (M_4 + ell * B_{<=3}) and it still refutes 62/62 but is not full
