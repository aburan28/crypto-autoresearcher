      None claimed. The measured closures are wall-clock-cheap here (W_4
      about 2 s) but are dominated per attempt by oracle A. The R2
      linearization reading does not change that at m = 2, and m >= 3 is
      unmeasured.

  reduction_and_scope_challenges:
