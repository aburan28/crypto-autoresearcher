    - N-AFF62 is one affine draw, so its CP95 bound is conditional on that draw (OBJ-6).
    - The label "S_3-specific" is relative to same-support random bilinear systems only (OBJ-6).
    - No reduction or corollary is claimed, and none is instantiated.

