# J7 (a) -- verdict on the W^(1) containment derivation (DEC-20260924-5b1c8e R-8;
# review-plan coordinator_prior J7 (a)). Written by TASK-20260924-d95e70 BEFORE any
# J7 computation (RT-2 (a)). The order is recorded in ORDER.log.
#
# Read before writing this file (disclosed): review-plan.yaml, DEC-20260924-5b1c8e,
# specification.yaml (macaulay_M_D, mutant_closure_W_D, certificate_format),
# H-CERTBIN-5e71c9, run-report.md, implementation.md. The last two state the
# aggregate outcome (U62: 1 in W_4 at iteration 1 on 62/62; W_4 certificate
# max deg mu distribution {2: 20, 3: 62}). No per-instance record
# (closures.jsonl.gz, certificates.jsonl.gz) had been opened.
j7a_derivation_check:
  derivation: >-
    D = 4: W^(1) is contained in rowspace(M_5), because v_j * (mu f_k) =
    (v_j mu) f_k in B with deg(v_j mu) <= 3. Hence a W_4 refutation reached at
    iteration 1 is an M_5 refutation, its flattened certificate is an M_5
    certificate, and the frozen flat format certifies unsatisfiability and
    membership in rowspace(M_5) but not membership in W_4.
  rt5_status: verified
  proof_as_checked:
    - step: 1
      text: >-
        W^(0) = rowspace(M_4) is contained in rowspace(M_5): the row index set of
        M_D is {(mu, k) : mu multilinear, deg mu <= D - 2, k = 0..16}
        (specification macaulay_M_D), so every M_4 row is an M_5 row.
    - step: 2
      text: >-
        Let b be in W^(0) intersected with B_{<=3}. By definition of a row space
        there is a finite set S of (mu, k) with deg mu <= 2 and b = sum_S mu f_k
        in B. (The representation may use degree-4 rows whose top parts cancel;
        that does not matter.)
    - step: 3
      text: >-
        The multilinear reduction pi : F_2[v_0..v_17] -> B = F_2[v]/(v_i^2 + v_i)
        is the quotient map, hence a ring homomorphism, and B is commutative.
        So v_j * b = sum_S pi(v_j mu) f_k in B, where pi(v_j mu) = mu if j is in
        mu and the monomial mu with j adjoined otherwise; in both cases
        deg pi(v_j mu) <= 3.
    - step: 4
      text: >-
        The M_5 row indexed (pi(v_j mu), k) is by definition pi(pi(v_j mu) f_k).
        So v_j * b is a sum of M_5 rows, i.e. lies in rowspace(M_5).
    - step: 5
      text: >-
        W^(1) = W^(0) + span{v_j b} (literal rule) is therefore contained in
        rowspace(M_5). Since deg b <= 3, also W^(1) is in B_{<=4}; so
        W^(1) <= rowspace(M_5) cap B_{<=4}.
  consequences_checked:
    - >-
      INDUCTION (stronger than stated, same proof): W^(i) <= rowspace(M_{4+i})
      cap B_{<=4} for every i >= 0. A W_4 refutation first reached at
      iteration i therefore has a flat certificate with max deg mu <= 2 + i.
      At i = 1 that is max deg mu <= 3, i.e. an M_5 certificate.
    - >-
      The inclusion is NOT an equality in general. Nothing in the derivation
      says rowspace(M_5) cap B_{<=4} <= W_4. Any instance with 1 in M_5 and 1
      not in W_4 is a witness of strictness (the run reports that both null
      sets are such instances; that is engine-reported and checked under J8/J9,
      not assumed here).
  what_the_flat_format_certifies:
    certifies:
      - unsatisfiability of the Boolean system (1 is in the ideal generated by f_0..f_16 in B)
      - 1 in rowspace(M_{2 + delta}), where delta = max deg mu over C
      - 1 in W_4 ONLY when delta <= 2 (then 1 is in M_4, and M_4 <= W_4). This is the C20 case, a plain M_4 refutation.
    does_not_certify:
      - 1 in W_4 when delta = 3. A delta = 3 flat certificate has exactly the shape of an M_5 certificate, and an M_5 refutation need not be a W_4 refutation.
      - the iteration at which 1 first appears in W_4, or any per-iteration or per-degree dimension
      - that the derivation's intermediates stay in B_{<=4}; the flat set records no intermediates
    observation_fiber_note: >-
      Same observation (a verified flat certificate with delta = 3), two
      preimages that differ on W_4 membership: an iteration-1 W_4 refutation,
      and an M_5 refutation of an instance not refuted by W_4. The separator
      the format lacks is a per-node degree bound on a derivation, i.e. the
      straight-line (DAG) certificate with degree discipline that R-8 names for
      successor contracts, or a structured witness such as the one below.
  consistency_with_reported_degrees: >-
    PREDICTED BY THE DERIVATION, to be CHECKED against the archived
    certificate-verification.json after this file is written: every W_4
    certificate of an iteration-1 U62 refutation has max deg mu <= 3, and every
    C20 W_4 certificate (iteration 0) has max deg mu <= 2. A U62 W_4
    certificate with max deg mu >= 4 would contradict "reached at iteration 1".
  a_structured_witness_the_plan_did_not_name: >-
    PROPOSED HERE, before computing. If ell = sum_k c_k f_k is linear (c_k in
    F_2) and 1 = m + ell * a in B with m in rowspace(M_4) and deg a <= 3, then
    1 is in W^(1), by the definition of W_4 alone: for deg mu <= 2, mu*ell =
    sum_k c_k mu f_k is in M_4 and has degree <= 3, so v_j*(mu*ell) is in W^(1);
    every monomial of degree <= 3 is mu or v_j*mu with deg mu <= 2. The pair
    (C_4, a) -- a flat certificate for m with every deg mu <= 2, plus the
    multiplier a -- is therefore a DEGREE-DISCIPLINED W^(1) witness that a
    verifier can check with no engine: check sum_{C_4} mu f_k + (sum_k c_k f_k)
    * a = 1, deg mu <= 2 on C_4, deg a <= 3, and sum_k c_k f_k linear. It
    exists iff 1 is in the degree-4 Macaulay space R'_4 of the system after
    the substitution v_0 := v_9 + Tr(B / x_R^2) (because the kernel of the
    substitution on B_{<=4} is ell * B_{<=3}). J7 (b) computes it.
  verdict: >-
    VERIFIED. The containment W^(1) <= rowspace(M_5) holds as a theorem of the
    definitions, with no dependence on the engine. The plan's reading of what
    the frozen flat certificate certifies is correct, with one refinement: it
    does certify W_4 membership when every multiplier has degree <= 2 (plain
    M_4 refutations). For iteration-1 refutations the W_4 qualifier of MR1 is
    engine-reported unless an independent degree-disciplined witness exists.
