# J7 (b)/(c) -- DECLARED PREDICTION RULE (RT-2 (b)). Written by TASK-20260924-d95e70
# BEFORE any substitution or Macaulay computation, and BEFORE opening
# closures.jsonl.gz, certificates.jsonl.gz, certificate-verification.json or
# instance-sets.json. Order recorded in ORDER.log.
#
# Already known when this was written (disclosed): the AGGREGATE outcome in
# run-report.md / implementation.md (U62: 1 in W_4 at iteration 1 on 62/62,
# W^(1) = B_{<=4}; C20: 1 in W^(0); U62 W_4 certificates have max deg mu = 3).
# Per-instance outcomes are not known. The rule below does not use them.
prediction_rule:
  objects:
    instance_sets_used: >-
      Selected by ME from the Stage-1 archive (experiments/EXP-CERTBIN-4e92d7/
      runs/RUN-CERTBIN-3b7e05/targets-F-S3.jsonl.gz, D = 4 records) by the
      specification's frozen rules, not read from instance-sets.json:
      U62 = every F-S3 test target with stratum "unsat" and one_in_R false (62);
      C20 = the 20 lowest-idx with stratum "unsat" and one_in_R true;
      S10 = the 10 lowest-idx with stratum "sat" (the first 10 of S62, the
      specification's W_5 PS1 set). Membership is cross-checked against
      instance-sets.json only AFTER the computation.
    construction: >-
      f_0..f_16 built by MY OWN code from (B, x_R): own F_2[t]/(t^17 + t^3 + 1)
      arithmetic and own symbolic descent S_3 = (x_1x_2)^2 + x_R^2 x_1^2 +
      x_R^2 x_2^2 + x_R x_1 x_2 + B (char 2; the square of a sum is the sum of
      squares, and v^2 = v), with x_1 = sum_{j<9} v_j t^j, x_2 = sum_{j<9}
      v_{9+j} t^j. Self-tests: direct F_{2^17} evaluation of S_3 at random v;
      cross-check against the archived engine's descended_E (imported
      unchanged) on every instance used.
    ell: >-
      c_k = Tr(t^k / x_R^2); ell = sum_k c_k f_k. Checked to equal
      v_0 + v_9 + Tr(B / x_R^2) on every instance (a mismatch is reported and
      the instance is not predicted).
    substitution: >-
      pi : B -> B' = F_2[v_1..v_17]/(v_i^2 + v_i), v_0 -> v_9 + Tr(B / x_R^2).
      f'_k = pi(f_k), k = 0..16 (17 polynomials; sum_k c_k f'_k = 0).
    R4prime: >-
      The plain degree-4 multilinear Macaulay space of f'_0..f'_16 in the 17
      variables v_1..v_17: rows mu' f'_k, deg mu' <= 2 (154 x 17 = 2618 rows),
      columns the 3214 multilinear monomials of degree <= 4. Recorded: rank,
      "1 in R'_4", fall profile dim(R'_4 cap B'_{<=d}) for d = 0..4.
  theorems_the_rule_rests_on:
    - id: T1
      statement: >-
        pi restricted to B_{<=4} maps onto B'_{<=4} with kernel ell * B'_{<=3}
        (dimension 834), and pi(rowspace M_4) = R'_4. Hence 1 is in
        rowspace(M_4) + ell * B_{<=3} iff 1 is in R'_4, and
        dim(rowspace M_4 + ell * B_{<=3}) = rank R'_4 + 834.
    - id: T2
      statement: >-
        rowspace(M_4) + ell * B_{<=3} <= W^(1) (for deg mu <= 2, mu*ell is in
        M_4 with degree <= 3, so v_j * mu * ell is in W^(1)). So 1 in R'_4
        implies 1 in W^(1); the converse is NOT a theorem (W^(1) also contains
        products of any other fallen polynomial of M_4).
    - id: T3
      statement: >-
        Soundness: ell is in the ideal, so the substituted system has the same
        s solutions; for s >= 1, 1 is not in R'_4.
  rule:
    - id: PR-1
      applies_to: U62, C20, S10
      predict: 1 in W^(1) (engine one_first_iteration in {0, 1}) IFF 1 in R'_4.
      disagreement_meaning: >-
        TYPE A (1 in R'_4, engine says 1 not in W^(1)): contradicts T1+T2;
        an engine or construction defect, reported, never resolved by
        reading the re-deriver. TYPE B (1 not in R'_4, engine says 1 in
        W^(1)): not a contradiction; W^(1) used a fallen polynomial other
        than multiples of ell -- this is the plan's "(b) breaks" outcome, and
        the residual is then computed.
    - id: PR-2
      applies_to: U62
      predict: >-
        If rank R'_4 = 3214 then W^(1) = B_{<=4}, dim 4048, forced by T1+T2
        (the first-iteration fill is algebraically forced). If rank R'_4 <
        3214, only the lower bound dim W^(1) >= rank R'_4 + 834 is predicted,
        and the fill (if the engine reports one) needs further products,
        which J7 (c) must then identify.
    - id: PR-3
      applies_to: C20
      predict: 1 in R'_4 (forced: 1 in M_4 implies 1 in pi(M_4) = R'_4). A "no" means my construction is wrong.
    - id: PR-4
      applies_to: S10
      predict: >-
        1 not in R'_4 (forced by T3), and codim(R'_4 in B'_{<=4}) >= s
        (evaluation at <= 31 points is surjective from B'_{<=4}; checked, not
        assumed, under J9 O1). A "yes" means my construction is wrong.
    - id: PR-5
      applies_to: reference values only (no instance)
      predict: >-
        If the substituted system were semi-regular (16 independent quadratics
        in 17 Boolean variables): rank R'_4 = 3214 - (1+17+120+408+340) =
        2328, fall profile d = 0..3 equal to [0, 0, 16, 288], 1 not in R'_4.
        Any U62 instance with 1 in R'_4 is therefore NOT semi-regular after
        the substitution: its degree-4 refutation needs S_3 structure beyond
        the single linear fall, even though it needs no fallen polynomial
        other than ell to be USED by the closure.
  comparison_protocol: >-
    Only after all predictions are written to predictions.json (sha256 in
    ORDER.log) is closures.jsonl.gz opened. Compared per instance: "1 in
    W_4", one_first_iteration, W^(1) dimension and final dimension, against
    PR-1/PR-2. Set membership is then cross-checked against instance-sets.json.
