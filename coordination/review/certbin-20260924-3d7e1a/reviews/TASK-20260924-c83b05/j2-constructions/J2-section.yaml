    - item: (6) certificate back-trace replayed by hand across the iteration boundary
      artifacts: [j2-constructions/j2_backtrace_replay.py, j2-constructions/backtrace_replay_results.json, j2-constructions/backtrace_replay.log]
      construction: >-
        U62:F-S3:27 (iteration-1 refutation). Op logs are not archived, so
        they were regenerated with the engine's own impl/closure.echelon on
        the archived bytes, level by level as _w_closure builds them (level-1
        stack 20030 rows, equal to the archived stack_rows_per_iteration).
        Replay by own code: backward membership walk over the level-1 log;
        boundary mapping (basis row -> multiplier 1, product row ->
        multiplier v_j); backward walk over the level-0 log per multiplier;
        pushed multiplier (m | mu, k) with XOR parity.
      result: >-
        The 616 traced level-1 rows (581 level-0 basis rows, 35 v_j-products;
        2 distinct multipliers, degrees 0 and 1) XOR to exactly 1 in own
        representation; each of the 616 level-0 targets equals the XOR of its
