    - item: (5) oracles against the Stage-1 definitions; C-ORACLE against archived values
      artifacts: [experiments/EXP-CERTBIN-e94b27/impl/oracles_rc1.py, experiments/EXP-CERTBIN-4e92d7/specification.yaml (controls C-ORACLE), experiments/EXP-CERTBIN-4e92d7/impl/oracles.py, experiments/EXP-CERTBIN-e94b27/impl/driver.py (phase1 lines 88-139), experiments/EXP-CERTBIN-e94b27/impl/instances.py (_arch, select_sets)]
      result: >-
        Oracle A: a = x_1^2 + x_R^2, b = x_1 x_R, c = x_1^2 x_R^2 + B,
        degenerate cases a = 0 and/or b = 0, Tr(ac/b^2) test, half-trace
