j2_object_and_closure_fidelity:
  written_at: '2026-09-24T07:03Z'
  written_before_any_J4_aggregation: true
  verdict: holds
  verdict_scope: >-
    The archived impl/ computes the frozen objects M_4, M_5 and W_D of
    EXP-CERTBIN-e94b27 object.* on every archived instance I rebuilt, the
    semi-naive W_D iteration is exact, the certificate back-trace is exact
    across the iteration boundary, the multilinear reduction is correct when
    v_j divides monomials of b, the copied modules are byte-identical to the
    Stage-1 sources bound in the TASK-20260923-c2e57b receipt, and oracles A
    and B implement the Stage-1 definitions with C-ORACLE reading archived s
    and stratum. This is a statement about the instrument only; it is not
    evidence for or against H-CERTBIN-5e71c9, E-A or E-G (INV-8 / RV-6).
  attack_items:
    - item: (1a) semi-naive proof, checked line by line
      artifacts: [experiments/EXP-CERTBIN-e94b27/impl/closure.py (docstring lines 17-27; _w_closure lines 202-259), experiments/EXP-CERTBIN-e94b27/impl/README.md ("W_D, exactly")]
      result: correct
      reading: >-
        Let the columns be in descending degrevlex (degree first), so the
        leading column of an echelon row has the row's maximal degree.
        (i) Low-lead echelon rows lie in B_{<=D-1} (README's argument) AND
        span W^(i) cap B_{<=D-1}: every w in W^(i) is a unique combination of
        echelon rows with distinct leads, and LM(w) is the largest lead used,
        so w in B_{<=D-1} uses low-lead rows only. The README states only the
        first direction; the second is the standard leading-monomial argument
        and holds. (ii) Nesting: W^(i-1) cap B_{<=D-1} is contained in
        W^(i) cap B_{<=D-1}, so its leading-monomial set (= the low leads at
        i-1) is contained in the low leads at i; the docstring uses this
        implicitly for the dimension count. (iii) The rows whose low lead is
        new at i are independent modulo W^(i-1) cap B_{<=D-1} (any nonzero
        combination has a new lead as its LM, which is not an LM of the old
        space) and number dim(W^(i) cap B_{<=D-1}) - dim(W^(i-1) cap
        B_{<=D-1}); so they are a complement. (iv) v_j * (W^(i-1) cap
        B_{<=D-1}) is contained in W^(i) by the literal definition of W^(i)
        (multiplication by v_j is F_2-linear on B), so the products of the
        complement suffice: W^(i+1) is the literal iterate. (v) Iteration 1
        is identical by construction (prev_low is empty, every low row is
        new). (vi) Echelon, not reduced, rows suffice: any basis of
        W^(i) cap B_{<=D-1} gives the same span of products. (vii) "1 in W"
        iff the constant column (last) is a pivot, because LM(1) is the
        constant and an echelon row with that lead is exactly 1. The
        fixpoint test (rank of the stack equals dim W^(i)) is the spec's stop
        rule and iterations_to_fixpoint = i is the spec's index.
      findings:
        - >-
          F-J2-2 (exposition, no effect): the proof text omits the spanning
          direction of (i) and the nesting (ii); both hold.
        - >-
          F-J2-3 (undisclosed interpretation, no effect on the object): the
          spec names "the set of RREF rows" as the basis of W^(i) cap
          B_{<=D-1}; the engine uses non-reduced echelon rows. By (vi) the
          iterates are identical. Not among implementation.md's deviations
          1-9; listed again under J3.
    - item: (1b) LITERAL, slow W_4 of my own beside the archived closure
      artifacts: [j2-constructions/own_algebra.py, j2-constructions/j2_literal_w4.py, j2-constructions/literal_w4_results.json, j2-constructions/literal_w4.log]
      construction: >-
        Own representation (bit position = (degree asc, mask asc), top-bit
        echelon in plain Python integers, pivot order unlike the engine's);
        every low basis element of W^(i) multiplied by every v_j at every
        iteration, whole generating set re-eliminated from scratch. Systems
        decoded by own code from instance-sets.json E_hex; own decoding equal
        to the engine's on every instance. Instances by a declared rule: the
        lowest-idx U62 (U62:F-S3:27), the lowest-idx S62 (S62:F-S3:1), the
        S62 instance with the smallest archived W_4 final dim
        (S62:F-S3:64), the lowest-idx C20 (C20:F-S3:5), N-AFF62
        (N-AFF62:F-AFF-1:8) and N-F262 (N-F262:F-NULLF2:4). Six instances,
        three required.
      result: >-
        6/6 equal to the archived W_4 record of closures.jsonl.gz on dims per
        iteration, iterations_to_fixpoint, final_dim, "1 in W_4",
        one_first_iteration and dims_by_deg: U62:27 [2660, 4048], fixpoint 1,
        1 first at 1; S62:1 [2670, 4044], fixpoint 1, no 1, dims_by_deg
        [0,15,168,984,4044]; S62:64 [2669, 4040], fixpoint 1, no 1,
        [0,11,164,980,4040]; C20:5 [2668, 4048], 1 at iteration 0; both nulls
        [2771], fixpoint 0, no 1, [0,0,17,323,2771]. Bit-level: the archived
        engine re-run on the same bytes reproduces the archived record on
        every field, and its final basis spans exactly the literal final
        space (mutual containment, equal dimension) on 6/6.
      caveat: >-
        On these instances (and on every archived W_4 and W_5 record: W_4
        fixpoint index 0 or 1 on all 268 instances, W_5 1 on all 10) the
        semi-naive shortcut can only affect the fixpoint test at W^(2); the
        literal comparison confirms it there. The discriminating test of the
        shortcut is (2b).
    - item: (2a) selftest.py's literal reference, genuinely literal and genuinely compared?
      artifacts: [experiments/EXP-CERTBIN-e94b27/impl/selftest.py (bf_W lines 34-104; comparison lines 239-273), experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/selftest.json]
      result: genuinely literal and genuinely compared, but NON-DISCRIMINATING for deviation 1
      reading: >-
        bf_W is a separate plain-Python implementation (own coordinate
        permutation, top-bit basis dict, multiplies EVERY element of the low
        part of W^(i) at every iteration, fully re-reduces) and is compared
        field by field with Closure.w_closure (dims, fixpoint index, "1 in
        W", first iteration of 1). Not the same function twice. BUT all 23
        compared systems in selftest.json have iterations_to_fixpoint <= 1
        (13 at 0, 10 at 1; one refutation at iteration 0, one at 1). The
        semi-naive rule can only differ from the literal rule when W^(i+1)
        strictly grows for some i >= 1, i.e. at fixpoint index >= 2. The
        archived self-test therefore never exercised the one step deviation 1
        changes.
      findings:
        - >-
          F-J2-1 (coverage gap in C-SELF, not a break): the archived evidence
          that the semi-naive iterates equal the literal ones at iteration
          >= 2 was the proof alone. Remedied by (2b).
    - item: (2b) semi-naive versus literal where they can differ
      artifacts: [j2-constructions/j2_seminaive_stress.py, j2-constructions/seminaive_stress_results.json, j2-constructions/seminaive_stress.log]
      construction: >-
        Constructed systems (not archived instances; no RUN-id). Batch A:
        seed 2026092483050, 3000 sparse systems, nv 5-8, D 3-5. Batch B:
        seed 2026092483053, 12000 systems, nv 6-10, D = 3. Batch C: 90
        implication-chain systems (v_0 = 1, v_{i-1}(v_i + 1) = 0, v_L = 0),
        L = 3..11, D in {2, 3}, random relabelling and invertible mixing
        (seed 2026092483054). Archived engine (unchanged) versus own literal
        rule on every system; every engine certificate evaluated with own
        multilinear arithmetic.
      result: >-
        0 mismatches on 15090 systems. Fixpoint index >= 2 on 545 (A), 8359
        (B) and 65 (C) systems, up to 8 iterations; refutations first reached
        at iteration 2 or 3 on 42 (B) systems and at iterations 2..6 on 45
        chain systems (C). 0 engine certificates fail own evaluation.
        POSITIVE CONTROL of the comparison's power: a validator-written
        truncated rule (W^(1) only, what a semi-naive step that lost every
        later product would compute) differs from the literal rule on 545 of
        545 batch-A systems with fixpoint >= 2.
    - item: (3) multilinear reduction when v_j divides monomials of b
      artifacts: [j2-constructions/j2_edge_case.py, j2-constructions/edge_case_results.json, j2-constructions/edge_case.log]
      result: >-
        Closure.products at (18, 4) and (18, 5): 10 hand-built cases each
        (v0*v0 = v0; v0*(v1 + v0v1) = 0; v0*(1 + v0) = 0; v0*(v0v1v2 + v1v2 +
        v3) = v0v3; v17*(v15v16v17 + v15v16) = 0; ...) all equal the expected
        and own products; 3600 random dense b x every j equal own products.
        Closure.build_M on a system whose f_k share variables with mu: all
        2924 (D = 4) and 16796 (D = 5) rows equal own rows, including 90 and
        769 rows where mu * f_k cancels monomials. A refutation first reached
        at iteration 2 (nv 8, D 3; 55 pairs, 76 pairs whose mu shares a
        variable with a monomial of f_k) evaluates to exactly 1 under own
        arithmetic and matches the literal rule. Reduced, not dropped or
        doubled.
    - item: (4) impl-provenance.json empty diffs versus the Stage-1 receipt
      artifacts: [experiments/EXP-CERTBIN-e94b27/impl/impl-provenance.json, coordination/design/certbin-trace-20260923-5d0b8e/archives/TASK-20260923-c2e57b/snapshot-receipt.json]
      result: >-
        gf2n.py b7340e42..., curve.py 7c97d5d9..., macaulay.py b094fac5...,
        elim.py d1767086...: the e94b27 copy, the Stage-1 source at HEAD and
