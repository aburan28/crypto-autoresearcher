        system.
    - item: object fidelity of M_4 and M_5 (fixtures, rows, columns, zero rows)
      artifacts: [j2-constructions/j2_m5_fidelity.py, j2-constructions/m5_fidelity_results.json, j2-constructions/m5_fidelity.log, j2-constructions/literal_w4_results.json]
