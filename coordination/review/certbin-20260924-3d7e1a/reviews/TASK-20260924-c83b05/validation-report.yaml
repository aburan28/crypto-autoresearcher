                F-J2-2 (exposition, no effect): the proof text omits the spanning
                direction of (i) and the nesting (ii); both hold.
              - >-
                F-J2-3 (undisclosed interpretation, no effect on the object): the
                spec names "the set of RREF rows" as the basis of W^(i) cap
                B_{<=D-1}; the engine uses non-reduced echelon rows. By (vi) the
                iterates are identical. Not among implementation.md's deviations
