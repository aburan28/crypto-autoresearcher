            artifacts: [experiments/EXP-CERTBIN-e94b27/impl/closure.py (docstring lines 17-27; _w_closure lines 202-259), experiments/EXP-CERTBIN-e94b27/impl/README.md ("W_D, exactly")]
            result: correct
            reading: >-
              Let the columns be in descending degrevlex (degree first), so the
              leading column of an echelon row has the row's maximal degree.
              (i) Low-lead echelon rows lie in B_{<=D-1} (README's argument) AND
              span W^(i) cap B_{<=D-1}: every w in W^(i) is a unique combination of
              echelon rows with distinct leads, and LM(w) is the largest lead used,
              so w in B_{<=D-1} uses low-lead rows only. The README states only the
              first direction; the second is the standard leading-monomial argument
              and holds. (ii) Nesting: W^(i-1) cap B_{<=D-1} is contained in
              W^(i) cap B_{<=D-1}, so its leading-monomial set (= the low leads at
              i-1) is contained in the low leads at i; the docstring uses this
              implicitly for the dimension count. (iii) The rows whose low lead is
              new at i are independent modulo W^(i-1) cap B_{<=D-1} (any nonzero
              combination has a new lead as its LM, which is not an LM of the old
              space) and number dim(W^(i) cap B_{<=D-1}) - dim(W^(i-1) cap
              B_{<=D-1}); so they are a complement. (iv) v_j * (W^(i-1) cap
              B_{<=D-1}) is contained in W^(i) by the literal definition of W^(i)
              (multiplication by v_j is F_2-linear on B), so the products of the
              complement suffice: W^(i+1) is the literal iterate. (v) Iteration 1
              is identical by construction (prev_low is empty, every low row is
              new). (vi) Echelon, not reduced, rows suffice: any basis of
              W^(i) cap B_{<=D-1} gives the same span of products. (vii) "1 in W"
              iff the constant column (last) is a pivot, because LM(1) is the
              constant and an echelon row with that lead is exactly 1. The
              fixpoint test (rank of the stack equals dim W^(i)) is the spec's stop
              rule and iterations_to_fixpoint = i is the spec's index.
            findings:
