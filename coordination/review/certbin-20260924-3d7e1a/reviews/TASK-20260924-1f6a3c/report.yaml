  method:
    summary: >-
      Implemented from the statement only (code/, sha256 per file in
      rederivation.json code_sha256; the files are unchanged since the pass).
      Field F_2[t]/(t^17+t^3+1) (gf2n.py); curve arithmetic on E_{A,B} for the
      self-test (ec.py); descended system by generic polynomial expansion of
      S_3(x_1, x_2, x_R) over F_{2^17}[v]/(v^2+v) and extraction of the t^k
      coefficients (boolsys.py); M_3, M_4, M_5 with the specified row and column
      conventions (boolsys.Macaulay); ranks, intersections with B_{<=d}, and
      membership of 1 by an echelon basis keyed by the leading monomial (gf2lin.py);
      W_4 by the literal rule of BR-4 (closure.literal_closure); W-certificates by
      tracked elimination over generators = M_4 rows plus products of certificate
      elements, pruned to the elements reachable from the output
      (closure.extract_certificate); an independent checker with its own field
      arithmetic, hand-expanded equations and set-based Boolean arithmetic
      (wcert_check.py); s by exhaustive 2^18 search (route 1) and by per-x_1
      quadratic root finding with half-trace (route 2, sroutes.py).
    elimination_method: >-
      Declared per BR-1: incremental echelon (non-reduced) basis over F_2 with
      Python-int bit vectors keyed by the leading bit. Bit index is the rank in
      ascending degrevlex over all multilinear monomials, so column c of M_D in the
      spec's descending-degrevlex order is bit C_D-1-c. rank = basis size;
      dim(X cap B_{<=d}) = number of basis vectors whose leading monomial has
      degree <= d; 1 in X iff a basis vector has leading monomial 1. Full text in
      rederivation.json elimination_method.
    per_instance_cross_checks:
      - "xcheck.py: a second implementation with no shared code (packed uint64 numpy Gauss-Jordan to full RREF, its own column order, rows from the checker's hand-expanded equations). It recomputes rank_3, rank_4, 1 in R_3/R_4, dim(R_4 cap B_{<=d}), every W_4 iterate dimension, the fixpoint index, the first-one iteration and dim(W_4 cap B_{<=d}). It must equal the primary engine on every instance."
      - "closure.complement_closure: the same engine with a different generating set (it multiplies only vectors independent modulo rowspace(M_3) plus previously multiplied vectors). It must reproduce every literal iterate dimension."
      - "Certificate extraction level dimensions must equal the literal prefix, and the level at which 1 appears must equal the literal first-one iteration."
      - "engine equations == checker hand-formula equations (curve) / checker parse (explicit)"
      - "M_3 rows == the first 323 rows of M_4"
      - "soundness: every basis vector of R_3, R_4, W_4 (and R_5) vanishes at every Boolean solution; satisfiable implies not refuted; monotonicity R_3 <= R_4 <= W_4; dims[0] == rank_4"
      - "both routes to s return the same solution SET, and every route-2 root is re-checked by direct S_3 evaluation"
      - "every certificate is checked in-process and again by wcert_check.py in a separate process over the written wcerts.jsonl.gz"
    q5: >-
      Done (optional) for BI-001..BI-008, every label in that range whatever its
      kind (AMB-11), primary engine only (no independent cross-check), plus the
      vanishing-at-solutions soundness check.

