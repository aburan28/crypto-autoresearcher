  verdict: passed
  verdict_scope: >-
    J6 only. The archived blind re-derivation (J5) agrees with
    RUN-CERTBIN-c417e0 on every compared quantity for all 97 pool instances.
    The archived author-independent verification (J1) agrees with the run's
