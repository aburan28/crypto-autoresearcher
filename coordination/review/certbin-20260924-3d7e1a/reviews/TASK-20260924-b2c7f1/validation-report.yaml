  floor_ceiling:
    statement: >-
      Most compared items are fixed by set definition or sit at a structural
      extreme on EVERY instance of their set. Their agreement is weak evidence
      about either implementation:
      (i) s = 0 and arm unsat on U62, C20 and both null sets; one_in_R3
      (false on all 97) and one_in_R4, both fixed by the set rules;
      degenerate (false on all 77 curve instances).
      (ii) W_4 on U62 and C20 is at the CEILING B_{<=4}: final_dim 4048,
      dims_by_deg [1, 19, 172, 988, 4048] and one_in_W4 true on every
      instance. The fixpoint index (1) and the first-one iteration (U62 1,
      C20 0) are the same on every instance.
      (iii) W_4 on both null sets is at the FLOOR W_4 = R_4 (fixpoint index
      0, dim 2771, rank_3 323, fall profile 0, 0, 17, 323), the same on every
      instance.
      (iv) one_in_R5 true on all 8.
      The items that VARY and so discriminate are: rank_3 on U62; rank_4, W_4
      dims[0], the R_4 fall profile d = 1..3 and the per-iteration
      W^(i) cap B_{<=3} sizes on U62, S62 and C20; s on S62 (2 or 4, both
      routes); the S62 W_4 final dimension and dims_by_deg (codim(W_4) = s on
      all 10 pool S62, with dim(W_4 cap B_{<=1}) = 19 - s); rank_5 on U62
      against N-F262. All of these agree too.
    semi_naive_exercise: >-
      Every pool instance reaches its fixpoint at index <= 1. The run's
      semi-naive rule and J5's literal rule (confirmed literal by reading
      closure.literal_closure after the checker was written) are identical at
      iteration 1 by construction. So the only place the pool can separate
      them is the stopping step on the 10 S62 instances: J5 multiplies all
      976-986 low basis rows, the run only the new ones, and both find
      W^(2) = W^(1). U62 and C20 are already at B_{<=4}, and the nulls stop at
      index 0. The per-iteration agreement therefore says little about the
      semi-naive exactness argument beyond that step. It is J2's to test.
    coordinator_prior_note: >-
      The post-data prior (PD-R1) named the U62 W_4 per-iteration profile and
      the satisfiable-control W_4 final dimensions as its least confident
      items. Both agree. Every compared item was examined regardless of the
      prior (CP-7).

