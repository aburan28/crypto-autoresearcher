  # ------------------------------------------------------------------ CP-3
  w_certificate_checks:
    checker: >-
      checks/wcert_check_b2c7f1.py, sha256 77757d51...85bf6. Written and run
      (2026-09-24T07:15Z) BEFORE any file under
      reviews/TASK-20260924-1f6a3c/code/ was opened. The format comes from the
      J5 card BR-5 and the data file. Boolean ring as sets of 18-bit monomial
      masks. Curve-kind f_k come from the archived impl/macaulay.py
      descended_E(TableField(), B, x_R), decoded with EQ_MONS. Explicit-kind
      f_k come from blind-inputs.json. Bytecode writing disabled, so impl/ is
      untouched.
    conditions: >-
      C1 every mu in rows has degree <= 2 (well-formed, k in 0..16); C2 every
      product parent is an earlier element (list position and p < id) with
      degree <= 3, j in 0..17; C3 every element has degree <= 4; C4 the output
      element is exactly the constant 1. Also: schema, D = 4, unique ids.
      Soundness of the witness: by induction on element order, each g_id lies
      in W_4 (M_4 rows, and v_j * g_p with g_p in W_4 of degree <= 3), so C4
      gives 1 in W_4. C3 is implied by C1 and C2 when deg f_k <= 2. It is
      checked anyway.
    checker_controls: >-
      checks/wcert-check-controls-output.json: 75 controls, all pass. 12
      positives (2 hand-derived synthetic identities, one with a product, and
      10 real certificates unmodified). 63 negatives, all rejected: synthetic
      parent of degree 4 (C2), element of degree 5 (C3), missing product (C4);
      and on real certificates (5 per certified set): one output row dropped,
      one k changed, one mu raised to degree 3, one product j changed, one
      product dropped, output moved before its parents, output_id pointed at
      the parent, and a transplant onto another instance of the same set.
    fk_binding: >-
      For all 77 curve-kind pool instances, the checker's f_k (archived
      descended_E) equal the decoding of the run's instance-sets.json E_hex,
      the system the run's closures used. J1 post-seal PS-2 found its
      independently built f_k equal to that E_hex on 144/144, so the
      checker's f_k are also J1's.
    per_instance_status: >-
      67 valid, 0 invalid, 30 absent (checks/wcert-check-output.json). By set:
      U62 62/62 valid; C20 5/5 valid (single element, M_4 rows only); S62,
      N-AFF62 and N-F262 absent on all 30 (J5 finds 1 not in W_4 there, and
      so does the run).
    per_run_key_W_certification: >-
      U62: 62 of 62 "1 in W_4" are W-certified. C20 (pool): 5 of 5
      W-certified. S62, N-AFF62, N-F262 (pool): 30 of 30 carry no W_4
      refutation claim, and J5 agrees (none refuted). Engine-reported only: 0.
      Contradicted: 0. So every one of the 67 run-claimed W_4 refutations in
      the pool is W-certified. Out of pool, the 15 other C20 run W_4
      refutations have flat certificates with max deg mu = 2 (J1), i.e. M_4
      rows only. Those are degree-disciplined W_4 witnesses as they stand;
      this task's checker did not run on them. MR1 counts U62 only, and all of
      U62 is in the pool.
    structure_recorded_not_interpreted: >-
      checks/wcert-structure.json. Every U62 W-certificate has 2 elements (one
      has 3). The parent elements have degree exactly 1, with 1 to 9 terms
      (for example v9, 1 + v9), and the output is M_4 rows plus v_j times the
      parent(s). Recorded for the Coordinator; no mechanism reading is offered
      (that is J7).

