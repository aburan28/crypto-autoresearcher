  ambiguities:
    note: AMB-1..AMB-10 are recorded with my reading in verification.json `ambiguities` (sealed). One more arose after the seal.
    post_seal:
      - id: AMB-11
        question: E_hex bit layout for the optional VC-2 comparison
        reading: >-
          The a4f217 receipt states no bit-level convention, and null-systems.json
          names impl functions (must_not_read). I read E_hex as a list of 17 row
          integers, bit j (LSB first) = column j of mu_order(2). The layout was
          identified by trying two readings on ONE instance (U62:F-S3:27; LSB
          first matched, MSB first within 172 bits did not) and then applied
          unchanged to 144 curve and 124 null instances. It agrees on all 268,
          which a wrong layout would not. It was not read from producer code.

