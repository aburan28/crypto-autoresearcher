  metric_recomputations:
    - quantity: per-certificate identity sum_{(mu,k) in C} mu*f_k = 1 in B (VC-3)
      method: >-
        Three checkers that must agree: A, literal pure-Python monomial
        toggling; B, numpy parity of monomial counts over the 2^18 masks; C,
        pointwise evaluation at all 2^18 Boolean points on bit-packed truth
        tables (B is isomorphic to the functions F_2^18 -> F_2). For curve
        instances checker C uses bit k of S_3(x_1(v), x_2(v), x_R) evaluated
        directly in F_2^17, so it does not depend on the monomial expansion.
      result: 268 submitted, 268 verified, 0 rejected, 0 infrastructure gaps; the three checkers agree on every certificate.
