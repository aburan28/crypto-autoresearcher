      result: >-
        Not broken. (i) All 124 null certificates verify against
        null-systems.json. (ii) Every null equation's support lies inside the
        union support U_k of the curve's affine basis E^0, E^j computed by MY
        descent (|U_k| = 99 or 100 of 172 monomials), which the F-AFF-1 and
        F-NULLF2 definitions imply. (iii) POST-SEAL: re-decoding the 124 null
        E_hex with the layout identified in PS-2 reproduces null-systems.json
        exactly (124/124).
    - check: VC-2 optional construction-agreement comparison (POST-SEAL, reported separately)
