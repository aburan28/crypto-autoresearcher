        closure) equals mine. File: post-seal-checks.json PS-1.

  control_checks:
    - control: VC-4 negative controls (my own)
      rule: >-
        seed = first 8 bytes of sha256("TASK-20260924-7e2d94|VC-4 negative
        controls"), big-endian = 4596609323698829350, PCG64. Every
        verified certificate, in file order, gets one control of each type:
        (a) one pair removed (uniform among nonzero rows); (b) one k changed
        (uniform k' != k, (mu,k') not in C, change nonzero in B); (c) one mu
        changed to a uniform other monomial of the same degree ((mu',k) not in
        C, change nonzero in B); (d) transplant onto a uniform other instance of
        the same set; (e, extra) transplant onto a uniform S62 (satisfiable)
        instance. Vacuity is decided by truth-table evaluation, not by the
        checkers under test; vacuous draws are redrawn and counted.
      result: >-
        1340 controls, 5 types x 268 certificates; per (closure, set) kind and
        type 62 (W_4|U62, M_5|U62, M_5|N-AFF62, M_5|N-F262) or 20 (W_4|C20),
        all >= 5. Every one rejected by all three checkers. Redraws for (b):
        68, 17, 57, 68, 75 and for (c): 59, 17, 61, 27, 30 (W_4|U62, W_4|C20,
        M_5|U62, M_5|N-AFF62, M_5|N-F262). Every (d) target system differs
        from the source system; every (e) target has s >= 1.
    - control: VC-5 exhaustive satisfiability sanity
      result: >-
        All 206 certified instances (82 curve, 124 null; the card requires 20)
        have s = 0 under my f_k by evaluation over all 2^18 points; the 82 curve
        instances also s = 0 by direct F_2^17 evaluation of S_3. No verified
        certificate sits on an instance with s >= 1. Positive control of the
        counter: all 62 S62 instances have s >= 1 by both routes (s values per
        instance in verification.json vc5_sanity.per_instance).
    - control: VC-1 self-tests (all pass)
      result: >-
        ST-1 t^17 + t^3 + 1 irreducible (gcd(t^(2^i) - t, f) = 1 for i = 1..8;
        t^(2^17) = t). ST-2 field axioms on 10^4 seeded triples and vectorised
        vs scalar product on 10^4 pairs, 0 failures. ST-3 trace in F_2 and
        half-trace identity on 10^4 elements, 0 failures. ST-4 archived curve:
        P, Q on curve, [q]P = [q]Q = O, [k_Q]P = Q, q prime, #E by enumeration
        = 130412 = 4 * 32603 = archived order. ST-5 group law (derived here):
        200 associativity triples, 20 Lagrange checks [#E]R = O, 0 failures.
        ST-6 S_3(x(P1), x(P2), x(P1 +- P2)) = 0 on 1000 random pairs and 200
        pairs in <P>, 0 failures; S_3 vanished at 0 of 1200 unrelated x_3
        (non-vacuity). ST-7 symbolic vs interpolation descent on 20 random x_R,
        scalar pointwise check on 1000 (v, x_R), affine decomposition, 0
        failures. ST-8 Boolean-ring axioms and evaluation homomorphism on 200
        triples, 0 failures. ST-9 all three checkers accept 20 synthetic
        identities plus a hand identity and reject their corruptions.
    - control: two-route descent on every constructed curve instance
      result: >-
        144/144 (U62, S62, C20): symbolic expansion in F_2^17[v_0..v_17] with
        v^2 = v equals Moebius interpolation of the 2^18 direct evaluations;
        degree <= 2; affine decomposition E^0 + sum_j r_j E^j holds; monomial
        truth tables equal the direct-evaluation bits.

