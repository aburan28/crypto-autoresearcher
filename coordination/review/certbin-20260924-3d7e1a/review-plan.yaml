    can weigh it, not so that you compensate.

    Per joint:
    J1 (author-independent certificate soundness): holds, about 90%. The
    certificates are finite identities in B; the likeliest failure is
    infrastructural (instance-key mapping, or the null-system decoding done by
    the opening archive), not a false certificate.
    J2 (object and closure fidelity): holds, about 85%. I checked the argument
    for the semi-naive W_D iteration (deviation 1) myself and believe it: the
    rows whose low-degree lead is new at iteration k, taken as they stood at k,
    have pairwise distinct leading monomials across all k, so they form a
    basis of W^(i) cap B_{<=D-1}, and products of the older ones were added at
    earlier iterations. Echelon (not reduced) rows suffice because the columns
    descend by degree. Iteration 1 is identical under both rules by
    construction. If J2 breaks, I expect it in the multilinear reduction of
    v_j * b when v_j already divides monomials of b, or in the certificate
    back-trace across iterations.
    J3 (instrument, package, procedure): holds, WITH FINDINGS I am fairly sure
    of: the C-VERIFIER negative controls exercise only one closure/set kind
    (implementation.md deviation 6), so they do not show the verifier rejects a
    corrupted M_5 or null certificate; C-MONO's W_5 clauses are near-vacuous
    because W_5 ran on satisfiable controls only; the development runs are
    unauditable but cannot move a threshold, a set or a rule; the 265ae64
    supersession changes schema keys only.
    J4 (recomputation): holds. Every primary count sits at a floor or ceiling,
    so recomputation agreement is weak evidence about the implementation and
    J4 must say so.
    J5 (blind re-derivation): holds (derivability).
    J6 (comparison): agreement on s, arm, rank_4, "1 in R_4" and the W_4
    outcome on every compared instance, about 85%. My least confident items:
    the W_4 per-iteration dimension profile on U62 (the first-iteration
    pattern of implementation.md, "Unexpected or noteworthy observations",
    bullet 1), about 75%, and the W_4 final dimensions on the satisfiable
    controls (bullet 5), about 80%. The W-certificates (degree-disciplined W_4
    witnesses) exist for every instance the re-deriver finds refuted.
    J7 (W_4 mechanism and what a W_4 certificate certifies): I expect the red
    team to establish three things.
    (a) THEOREM (derived here, to be checked): W^(1) is contained in
    rowspace(M_5) for D = 4, because v_j * (mu f_k) = (v_j mu) f_k in B with
    deg(v_j mu) <= 3. So every W_4 refutation reached at iteration 1 is also an
    M_5 refutation, its flattened certificate is an M_5 certificate, and the
    frozen certificate format (a flat set of (mu, k)) certifies
    unsatisfiability and membership in rowspace(M_5), but NOT membership in
    W_4. MR1's "W_4" qualifier therefore rests on the engine, not on the
    certificate. This is a design gap in a contract this Coordinator wrote; it
    is disclosed in DEC-20260924-5b1c8e R-8, and J5/J6's W-certificates are
    the remedy.
    (b) The W_4 refutations are explained by the linear consequence ell of
    H-CERTBIN-5e71c9 "mechanism" used as a substitution, followed by
    degree-4 Macaulay of the substituted 17-variable system: about 60%. The
    remaining 40% is that further S_3 degree falls are needed.
    (c) The first-iteration pattern is algebraically forced (substituted
    system's degree-4 Macaulay space already spans its whole B'_{<=4}), not an
    engine artifact: about 70%.
    J8 (null comparability; the M_5 null refutations): holds. I expect the
    nulls' M_4 rank to equal the semi-regular value R_4 - (C(17,2) + 17)
    (only the trivial Koszul and field syzygies at degree 4), and their M_5
    refutation to be what semi-regular D_reg = 5 for 17 quadratics in 18
    Boolean variables predicts. The M_5 row of RC1-DR-4 is then a statement
    about system SIZE, not S_3, and RC1-DR-2's D <= 5 label carries no
    S_3-specific content. The W_4 row of RC1-DR-4 is carried by ell.
    J9 (proves-too-much): holds, about 70%: the archived engine does NOT
    refute the synthetic one-linear-fall family N-ELL at W_4, and on every
    satisfiable control codim(W_4) >= s.
    J10 (scope and reading): I expect the red team to narrow three readings:
    what RC1-DR-1's verdict label means given (a); that RC1-DR-2's label
    meets DEC-20260923-f25b97 NA-5's premise without S_3-specific content;
    and that nothing here speaks to W_5 on an unsatisfiable instance, since
    W_5 never ran on one.
    Overall: admissible, mechanical verdicts stand, and the READING narrows.
    Most likely to be overturned: J7 (b) and (c). A break of J1, J2, J3 or J6
    would overturn "admissible".

