        whose author never read impl/ or verifier/. Every certificate's
        closure label is consistent with its multiplier degrees (M_5: every
        deg mu <= 3). The set of certified (instance, closure) pairs is the
        one MR1-MR4 count.
      assigned_to: TASK-20260924-7e2d94
      attack_plan: >-
        Build, do not read. (1) Your own F_{2^17} (t^17 + t^3 + 1), your own
        S_3 from KN-TECH-b18366 self-tested against point addition on the
        archived curve, your own descent to f_0..f_16 by two routes (symbolic
        expansion, and interpolation from direct F_{2^17} evaluation), your own
