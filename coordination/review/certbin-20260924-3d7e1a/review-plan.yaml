  coordinator_prior: >-
    READ PD-R1 FIRST. THIS PRIOR IS POST-DATA. It was written AFTER this
    Coordinator read run-report.md, decision-rules.json and implementation.md
    of RUN-CERTBIN-c417e0. It is a commitment made before any REVIEW report
