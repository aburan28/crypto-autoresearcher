        instance: curve instances by idx to x_R in the Stage-1 archived
        targets-F-S3.jsonl.gz, cross-checked against instance-sets.json
        "archived.x_R" (never its E_hex); null instances to
        coordination/review/certbin-20260924-3d7e1a/systems/null-systems.json.
        (3) Verify all certificates. (4) Build your OWN negative controls
        covering every (closure, set) kind present, at least 5 per kind:
        one pair removed, one k changed, one mu changed, and a certificate
        transplanted onto a different instance of the same set. All must
        reject. (5) Exhaustive 2^18 satisfiability on at least 20 certified
        instances as a sanity check of your construction (a verified
        certificate on an instance with s >= 1 means YOUR construction is
        wrong). (6) Tabulate per closure and set: submitted, verified,
        rejected, max deg mu distribution, |C| distribution. Where I think it
        breaks: key-to-instance mapping for the null sets, and the null-system
        decoding convention of the opening archive (a decoding error makes
        every null certificate fail, which is a finding about the extraction,
        not the run).
      breaking_artifact: >-
        A certificate that fails under an independent construction whose
        self-tests pass, with the failing (mu, k) residual shown. Or a
        certificate labelled M_5 with a multiplier of degree > 3. Or a counted
        (instance, closure) pair with no certificate.
