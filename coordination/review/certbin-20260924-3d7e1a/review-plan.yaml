  proves_too_much:
    objects:
      - >-
        O1 -- SATISFIABLE CONTROLS (S62; 10 of them also at W_5), for which
        "1 in X" is known false for every sound closure X. SHARPENED here:
        every element of a sound closure vanishes on every Boolean solution,
        and the evaluation map from B_{<=d} onto F_2^S is surjective for any
        set S of at most 2^{d+1} - 1 points (the dual of RM(d, 18) has minimum
        distance 2^{d+1}; recalled, a pointer -- verify it). Hence, for s =
        |S| <= 31, codim(W_4 in B_{<=4}) >= s and codim(rowspace(M_5) in
        B_{<=5}) >= s, with equality for W_4 iff W_4 = I cap B_{<=4}.
      - >-
        O2 -- N-ELL, a SYNTHETIC ONE-LINEAR-FALL FAMILY, for which "W_4
        refutes" is predicted false. Seed 2026092431001,
        numpy.random.Generator(numpy.random.PCG64(seed)), numpy 2.4.6. Each
        draw: equations k = 0..15 with coefficients uniform on the union
        support U_k of the curve's affine basis (the F-NULLF2 construction of
        EXP-CERTBIN-4e92d7), and equation 16 replaced by the linear form
        v_0 + v_9 + c with c uniform in F_2. Keep a draw iff exhaustive search
        over 2^18 finds s = 0. Collect the first 20 kept draws, recording
        every rejected draw. Derivation of the prediction: after the
        substitution the system is 16 quadratics in 17 variables; if
        semi-regular, the series (1+z)^17 / (1+z^2)^16 has positive degree-4
        coefficient, so no degree fall occurs below degree 5 and 1 is not in
        W_4.
      - >-
        O3 -- THE NULL SETS AS RUN (N-AFF62, N-F262): "the W_4 refutation is
        caused by S_3 structure" is known false for them, so an argument that
        credits S_3 must show a difference from them at W_4, and must NOT
        claim one at M_5 where the semi-regular prediction already refutes.
    failure_signature: >-
      O1: on every S62 instance, codim(W_4) >= archived s (read final dims from
      closures.jsonl.gz, s from instance-sets.json "archived.s"); report
      equality instance by instance; any codim < s means the engine's W_4
      contains a polynomial outside the ideal, and the instrument is unsound
      even though C-PS1 passed. O2: the archived closure engine, unchanged,
      reports no W_4 refutation on any N-ELL instance, and a W_4 final
      dimension consistent with the single fall (compute that dimension
      yourself before running the engine, and declare it). If the engine
      refutes an N-ELL instance, run your own W_4 on it: if yours refutes too,
      the semi-regular derivation is wrong for that instance (report the
      instance; it is a finding about the prediction, not the engine); if
      yours does not, the engine proves too much. O3: a W_4 difference from
      both null sets, and no S_3 claim at M_5.
    assigned_to: TASK-20260924-d95e70
    authorization_note: >-
      Running the archived engine on O2 and on the substituted systems of J7
      is a VERIFICATION computation authorized by DEC-20260924-5b1c8e. It is
      not a trial of EXP-CERTBIN-e94b27, not an arm, and not evidence about
      H-CERTBIN-5e71c9. It gets no RUN-id. Its outputs go only under the red
      team's write scope. The N-ELL seed is fixed here, before any draw.

  blind_rederivation:
    required: true
    quantity: >-
      Every quantity is computed from the specification text and the
      extracted instance inputs alone, for each of the 97 blind instances
      BI-001..BI-097 of coordination/review/certbin-20260924-3d7e1a/blind/blind-inputs.json:
      (Q1) for curve-kind inputs: the degenerate flag (x_R in V), and s, the
      number of v in F_2^18 satisfying all 17 descended equations, by two
      routes (exhaustive over 2^18, and root-finding in F_{2^17} over x_1 in
      V); for explicit-kind inputs: s by exhaustive search;
      (Q2) rank_3 and rank_4 (dimension of rowspace(M_3), rowspace(M_4)),
      "1 in R_3", "1 in R_4", and the fall profile dim(rowspace(M_4) cap
      B_{<=d}) for d = 0..3;
      (Q3) W_4 by the LITERAL rule of the specification (every low-degree
      basis element multiplied at every iteration): dim W^(i) for every
      iteration, the fixpoint index, the first iteration containing 1 (or
      none), the final dimension, and dim(W_4 cap B_{<=d}) for d = 0..4;
      (Q4) for every instance with 1 in W_4, a W-certificate in the format
      "certbin.wcert.v1" of TASK-20260924-1f6a3c, which witnesses W_4
      membership with every intermediate of degree <= 4;
      (Q5, optional) "1 in rowspace(M_5)" and rank_5 on BI-001..BI-008.
    parameters: >-
