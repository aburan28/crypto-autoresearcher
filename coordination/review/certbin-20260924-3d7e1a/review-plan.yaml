  composition:
    rule: >-
      The Coordinator composes the verdicts in /review-evidence. No reviewer
      votes on the whole claim.
      - The run is ADMISSIBLE for interpretation iff J1, J2, J3 and J6 hold
        (J6 on J5's and J1's archived outputs).
      - The mechanical verdicts stand as recorded iff J4 also holds.
      - MR1 may be read as a count of W_4 refutations (not merely of
        rowspace(M_5) refutations) only on the instances where J6 accepts a
        J5 W-certificate. Elsewhere it is read as recorded, with the J7 (a)
        caveat stated in the evidence record.
      - J7, J8 and J10 decide how the verdicts are READ in the evidence
        record; J9 decides whether the S_3-specificity reading at W_4 can be
        trusted at all.
      - A break of J1 applies INV-6 (MR1-MR4 void). A break of J2, J3 or J6
        attributable to the producer returns the run to the executor as an
        implementation failure (INV-8). Neither is evidence about
        H-CERTBIN-5e71c9.
      - `inconclusive` on an admissibility joint (J1, J2, J3, J6) holds the
        decision at `inconclusive`. The decision is not composed around the
        gap.
    checker: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/certbin-20260924-3d7e1a/review-plan.yaml --reports
      coordination/review/certbin-20260924-3d7e1a/reviews
      must PASS before composition. Then run
      python3 tools/check_review_independence.py --blind-history HEAD
      --protected-from coordination/review/certbin-20260924-3d7e1a/blind-phase-hygiene.yaml.
      Record both outputs in the TASK-20260924-8f03d6 receipt. Also record the
      Coordinator's manual check that TASK-20260924-7e2d94's sources_read does
      not intersect author_independent_verification.must_not_read.

  procedure_deviations:
    - id: PD-R1
      text: >-
        POST-DATA REVIEW PRIOR. coordinator_prior above was written after this
        Coordinator read run-report.md, decision-rules.json and
        implementation.md. The pre-data prior is the specification's
        coordinator_prior (a)-(d). Disclosed to every non-blind reviewer; the
        blind re-deriver reads neither.
    - id: PD-R2
      text: >-
        EXTRACTED INPUTS, AND TWO INPUT KINDS. The re-deriver receives curve
        instances as (A, B, x_R) and builds f_0..f_16 itself; it receives null
        instances as explicit polynomials decoded by TASK-20260924-a4f217 from
        instance-sets.json E_hex with the archived convention (macaulay.EQ_MONS
        and instances.E_from_hex), because the null families have no
        object-level definition the re-deriver could rebuild without the
        Stage-1 seeds and sampling layer. Consequences: the input KIND reveals
        curve versus null (not set, arm or outcome); the null decoding is a
        producer-convention step, validated by the opening archive (round
        trip, and a curve-instance cross-check against direct S_3 evaluation)
        and re-exercised by J1.
    - id: PD-R3
      text: >-
        SAME MODEL FAMILY. Unless the dispatcher can serve reviewers from a
        different model family, the re-deriver and the verifier share the
        executor's claude-opus-5-5. J5 and J1 are then independent of the
        IMPLEMENTATION and its author's session, not of one model's reading of
        the specification. Both must list every ambiguity they resolved.
    - id: PD-R4
      text: >-
        RE-DERIVATION SCOPE WIDER THAN THE SPEC'S MINIMUM, NARROWER THAN THE
        RUN. All 62 U62 (spec minimum 10), 10 S62, 5 C20, 10 per null set, at
        D in {3, 4}; M_5 only optionally on 8. M_5 refutations are fully
        certificate-backed (J1); W_4 outcomes are not (J7 (a)), which is why
        the re-derivation concentrates there. W_5 is not re-derived: it ran on
        satisfiable controls only.
    - id: PD-R5
      text: >-
        COMPARISON AS A SEPARATE TASK, as in REVIEW-CERTBIN-20260923-c51f07.
        J5 and J1 are sealed and archived (TASK-20260924-60b4ea) before the
        comparator reads them.
    - id: PD-R6
      text: >-
        A SPECIFICATION DESIGN GAP IS REVIEWED, NOT AMENDED. The frozen
        certificate format cannot certify W_4 membership (J7 (a); DEC-20260924-5b1c8e
        R-8). No protocol_amendment is written after data; MR1 and RC1-DR-1
        are recomputed exactly as frozen. The W-certificates are review
        verification artifacts, not a new metric, and they change no
        threshold.
