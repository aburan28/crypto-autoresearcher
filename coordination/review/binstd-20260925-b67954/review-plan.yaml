  proves_too_much:
    assigned_to: TASK-20260925-2333ea
    objects:
      - id: PTM-A
        carried_from: REVIEW-BINSTD-20260924-7d29e8, now aimed at RC-4 (D5)
        object: >-
          A toy ordinary binary curve at one positive-arm n, defined over no
          proper subfield (the null object), with v2's rank readout on the raw,
          orbit-quotient and ker-g columns.
        known_truth: No Frobenius endomorphism acts, k = 1, and the raw and quotient bases coincide; the ker-g column takes v2's stated k = 1 expectation.
      - id: PTM-B
        carried_from: REVIEW-BINSTD-20260924-7d29e8 (met there; still apt with the new certificates)
        object: A size-matched NON-stable F_2-subspace factor base on a positive-arm toy Koblitz curve.
        known_truth: Conjugate legs leave the base, so the conjugates of a relation are not a family of relations over that base.
      - id: PTM-C
        carried_from: REVIEW-BINSTD-20260924-7d29e8 (met there; still apt under E1')
        object: The forced-negative toy degrees n in {19, 29, 37}, run through the amended admission rule as well as the readout.
        known_truth: ord_n(2) = n - 1, so no nontrivial Frobenius-stable subspace exists and there is nothing to measure.
      - id: PTM-D
        carried_from: REVIEW-BINSTD-20260924-7d29e8, re-specified per D6 (RC-5)
        object: >-
          A toy subfield curve with b not in F_2, consistent with
          definitions.k_and_q, constructed so that its prime-order subgroup lies
          in E(F_q), declared before evaluation.
        known_truth: Frobenius acts trivially on the subgroup, lambda = 1, so ord(lambda) = k fails and the rank-k raw statement does not apply.
      - id: PTM-E
        new: aimed at the amended E1 admission rule (D1)
        object: >-
          The E1' admission rule applied to two planted cells on a positive-arm
          (n, a): (E-i) a COMPOSITE r' = p1 p2 whose prime factors are each below
          the E1' threshold while r' is above it; (E-ii) a prime above the E1'
          threshold taken from the OTHER Koblitz curve at the same n (a swapped),
          verified by the red team before evaluation not to divide #E_a(F_(2^n)).
        known_truth: >-
          Neither is the order of a prime-order subgroup of E_a(F_(2^n)); no cell
          built on either exists.
      - id: PTM-F
        new: aimed at the quotient-row rule (D2, D3)
        object: >-
          Rank-consistent FALSE quotient rows planted directly, not through a
          mutated instrument: (F-i) a valid relation's quotient row with one
          orbit's coefficient f_O(lambda) changed by +1 mod r; (F-ii) the same
          relation with one orbit's coefficient replaced by f_O(lambda^{-1}).
          Paired with the unmutated valid row as the true-positive control.
        known_truth: >-
          Neither planted row is a linear relation among the discrete logarithms
          of the orbit representatives: the on-curve quotient identity fails on
          it, while the quotient rank is still 1.
    failure_signature: >-
      A correct protocol keeps each known-false conclusion out of reach in its
      rules. PTM-A reports identical raw and quotient ranks, the stated ker-g
      expectation and no Frobenius effect. PTM-B produces no conjugate family
      counted as relations. PTM-C yields no stable base and nothing to measure,
      and E1' admits no measurable cell there. PTM-D is rejected by AR-2 run in
      isolation, with its reason, before any rank is read, and is admitted when
      the ord(lambda) = k clause is deleted. PTM-E is rejected by a primality
      check and an r | #E_a (and [r]P = O) check before any rank is read, never
      admitted on size alone. PTM-F is INVALIDATED by the quotient-row
      certificate before any rank readout or outcome routing, while the
      unmutated row passes. A rule set that reports a basis difference on
      PTM-A, counts rank k on PTM-B, measures anything on PTM-C, admits PTM-D
      with the clause present, admits either PTM-E cell, or accepts either
      PTM-F row (or rejects the valid control) has proved too much.
    how_to_run_it: >-
      REVIEW COMPUTATIONS in your own script at toy size. They mint no RUN-*,
      write no evidence record, never execute any EXP-BINSTD-178742 driver as an
      experiment, and touch no deployed-size curve beyond reading its
      parameters. Put every script, seed and output in computations.json. If a
      PTM would amount to a new experiment, record it NOT PERFORMED with the
      reason.

