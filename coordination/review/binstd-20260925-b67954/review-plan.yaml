      - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/reviews/TASK-20260925-2e6b10/computations.json
    custody_without_seal: >-
      No seal card (DEC-20260925-89573b R-CARRIED, carrying DEC-20260924-f0a9c7
      R2). Before TASK-20260925-3c9c56 is launched, the top-level session
      computes sha256 of the six report files above and pastes them into the
      launch prompt. The composer records them verbatim in its composition
      worksheet as its FIRST act, before it reads any report.
      TASK-20260925-b25565 must reproduce the same six digests; a mismatch voids
      the composition.
    keys:
      K-approve: >-
        J2, J3, J4, J6 and J7 hold; J5 agrees with v2's frozen values on every
        Q1, Q2, Q3 and Q4 item (NOT COMPUTED compared as above); every PTM meets
        its failure signature; ESC-B's result is recorded in the
        TASK-20260925-6e5a63 receipt before the first lane-B dispatch and the
        reviews ran at the tier it required; no in-round tripwire fired; the
        unowned-defect sweep reports no breaking defect; the independence check
        passes. DEC-20260925-a84b16 then approves "EXP-BINSTD-178742 version 2"
        under the AGENTS.md standing user authorization and names as its first
        next action the opening of an execution batch whose executor card is
        minted then. Status fields advance only in that later batch (R-CARRIED
        R4). Approval asserts nothing about any deployed curve's security.
      K-revise-defect: >-
        Any of J2, J3, J4, J6 or J7 breaks, the sweep reports a breaking
        unowned defect, or a field approval requires is missing. Decision revise,
        each defect listed with its joint and breaking artifact, and a revision
        design card in a new batch as the first next action.
      K-indeterminate: >-
        J5 disagrees with v2 on any Q1 to Q4 value or verdict, or reports a Q0
        choice that changes one. Decision revise on the owning condition (C3 for
        the census, C5 for a row, C1 for the admissibility table, the named NF
        item otherwise), neither side preferred.
      K-row-failure: >-
        Any party finds k not dividing r - 1 at a standardized row (TB-3).
        Decision revise; the row is resolved in its own task before anything
        downstream of it is read, per DEC-20260924-99ce20 S2.
      K-impediment: >-
        A primary source (a c2pnb row's standard, or a tier v2's D8 rule needs)
        is unreachable, and v2 records the impediment, keeps every claim that
        would rest on it out of scope, and forbids substitution. Not a defect by
        itself; approval is permitted if every other clause of K-approve holds.
        A contract that substitutes a dump, recall or the TASK-20260924-624abf
        report for the source is K-revise-defect.
      K-escalation-breach: >-
        ESC-B was not recorded before the first lane-B dispatch, or fired and
        any lane-B report was produced at review-adversarial. The composition
        does not approve; the round is re-run at the required tier. Not a
        mathematical result.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        approval while any joint is inconclusive. An infrastructure failure is
        never negative evidence about the contract's mathematics or any curve.
        J5's inconclusive attestation is by design and is not K-infra.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.

