  joints:
    - joint: >-
        J2 -- E1 REMEDY AGAINST AN INTEGER ADMISSIBILITY TABLE (C1; D1). v2
        chooses an E1 remedy (changed bound, second prime on the same curve, or
        changed positive-arm degree) as a versioned amendment, freezes an integer
        admissibility table for every positive-arm (n, a), corrects the C1 audit
        status, and every positive arm is admissible or the halt rule is
        reachable BY DESIGN with O-SUPPORT condition (4) reachable.
      assigned_to: TASK-20260925-104f6d
      attack_plan: >-
        (i) From v2's text alone, write down the amended admission rule (E1')
        exactly as stated, the prime-selection rule, and the set of
        positive-arm cells (n, a) v2 declares (C1: n in {17, 23, 31, 41}; Koblitz
        a in {0, 1}; plus any cell a remedy adds). (ii) In your own script, for
        every declared cell compute #E_a(F_(2^n)) = 2^n + 1 - t_n (t_n the trace
        of the n-th power of Frobenius, by the Lucas recurrence), its complete
        factorisation with multiplicities, every prime factor's bit length, the
        E1' threshold, and the admission verdict of each prime under E1'. Build
        the integer table: rows (n, a); columns #E, factorisation, selected r,
        threshold, admissible Y/N, first rule that fires. (iii) Compare with v2's
        frozen table cell by cell, exact. (iv) For every non-admissible cell,
        trace the procedure in order (SR-5 or its successor, P2-E1 or its
        successor): which rule halts, at what point relative to any rank readout,
        and whether the halt is REACHABLE BY DESIGN, meaning the table predicts
        it, the procedure routes around it without halting every execution, and
        a concrete execution path exists from the start of the run to
        O-SUPPORT condition (4) through admissible cells only. Write that path
        down rule by rule. (v) Check that the two-curves-with-different-r-per-n
        rule of C1 is satisfiable at every positive-arm n under E1', or that its
        change is declared as a departure from C1 (as DC-B1 was), fixed before
        any outcome and justified; if a degree changes, check ord_n(2) < n - 1
        for it and that it is not a forced-negative degree. An undeclared C1
        departure breaks J2. (vi) Check that the |V| < 4n exclusion and the
        forced-negative arm are unaffected by E1'. (vii) Sensitivity: move the
        E1' threshold one bit down and one bit up in your script and list which
        cells flip; a cell admissible by less than one bit is flagged fragile,
        which is material, not breaking. WHERE I THINK IT BREAKS: (iv), at the
        n = 17, a = 0 cell named in B-J2-1.
      breaking_artifact: >-
        A frozen table entry that differs from your computation; a positive-arm
        cell marked admissible that is not (or the reverse); a halt that fires on
        every execution, or before any rank readout, at some positive-arm n;
        O-SUPPORT condition (4) unreachable on every execution path; an
        undeclared departure from C1; a remedy that is not a versioned amendment;
        a C1 audit status of "met" without the table.
    - joint: >-
        J3 -- M1 AND M2 RE-RUN AGAINST THE AMENDED RULES; IS THERE NOW A RULE
        THAT CHECKS A QUOTIENT ROW IS THE TRUE EQUATION ON THE LOGARITHMS (D2,
        D3, D4; C4 observation collision).
      assigned_to: TASK-20260925-2333ea
      attack_plan: >-
        (i) Rebuild the two attacks exactly as TASK-20260924-eaf78a defined them
        (you may read its red-team-report.yaml M1/M2 sections and its
        computations.json for their definitions and code, and must re-implement
        them in your own script): M1, a COPY-ROW CONJUGATE BUILDER that never
        applies tau, so all k conjugate rows equal row 0 (the instrument named
        in the contract's own collision (3)); M2, an ORIENTATION-FLIPPED
        LABELLER that finds each leg's shift e by searching tau^{-e}(Q_O) instead
        of tau^{e}(Q_O), so e becomes -e mod k while the quotient still evaluates
        at lambda, which replaces f_O(X) by f_O(X^{-1}). Run both at two
        E1'-admissible positive-arm cells, one of them the n = 17 fixture cell
        and one at n = 23 if admissible under E1', with the unmutated instrument
        as a control that must pass. (ii) Feed each instrument's output through
        v2's amended rules IN ORDER: gates, admission rules, the new D2/D3
