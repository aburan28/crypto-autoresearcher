blind_inputs_amendment:
  id: A1
  plan: REVIEW-BINSTD-20260925-b67954
  card: TASK-20260925-2e6b10
  amends: coordination/review/binstd-20260925-b67954/blind-inputs.yaml
  written_by: >-
    Coordinator gate sub-session G3 of snapshot card TASK-20260925-6e5a63
    (lane B), under DEC-20260925-89573b R-PREREVIEW-GATE. Requested policy
    coordinator-orchestration-code, served by runtime inheritance
    (claude-opus-5-5-max; fallback used; model identifier not probe-verified).
    Not the lane-B producer, not a reviewer of either lane, not a composer.
  written_at: '2026-09-25'
  basis: >-
    Plan key blind_rederivation.newly_frozen_value_class.transfer_to_the_blind_card.
    Every definition text in q4_definitions is copied verbatim from the
    producer's revision worksheet, section newly_frozen_values, and each
    c2pnb excerpt verbatim from the version-2 contract. Where the worksheet
    writes a text as an unquoted YAML scalar, this file quotes the full text as
    written, so each copy matches the worksheet's raw bytes. Each ruling on
    separability is this gate sub-session's own and is Coordinator procedure,
    not a review verdict. A1 adds no Q3 cell and removes none, so it carries no
    q3_cell_refinement.
  q4_definitions:
    how_to_read: >-
      Each entry is one Q4 item. A definition is copied verbatim; the integers
      inside it are cell, field and rule parameters. An entry whose definition
      reads "definition not separable" carries none: compute nothing for it
      beyond Q3 and say so. An entry copied in part says which clauses were
      left out; compute nothing for those and say so. The common definitions
      are copied because the entries name them. The two listed under
      common_definitions_withheld are not given to you: report any field
      defined only through one of them as not computed, and say so. A name of a
      version-2 contract field or rule inside a definition (for example
      definitions.k_and_q) refers to a repository file: as your source_note
      says, do not open it and record it under Q0. Where you cannot list the
      readings it admits, report each field that depends on it as not computed,
      with the reason.
    common_definitions:
      CD-R: 'r is the largest prime factor of #E_a(F_{2^n}) in its complete prime factorisation.'
      CD-LAMBDA: >-
        lambda is the root mod r of X^2 - t X + 2 (t as in CD-ORDER) that
        satisfies lambda^n = 1 mod r; the entry also records whether exactly one
        root has that property.
    common_definitions_withheld:
      - id: CD-ORDER
        ruling: >-
          Not separable: besides a rule, its text states a value of t for each
          a, and it fixes the equation form and the meaning of a, which Q3 and
          Q0 ask you to read from FIPS 186-4 yourself. Where an entry takes
          group_order from CD-ORDER, report your Q3 N; the t that CD-LAMBDA
          takes from CD-ORDER is a choice to record under Q0.
      - id: CD-E1
        ruling: >-
          Not separable: its text states a design threshold and small computed
          values. Compute nothing for the clause booleans, admitted, complete,
          v1_size_clause_met or any other field defined through it, and say so.
    entries:
      - id: NF-01
        definition: 'At n = 17, a = 0: group_order by CD-ORDER; factorisation its complete prime factorisation with multiplicities; r by CD-R; lambda by CD-LAMBDA; the clause booleans and admitted by CD-E1; AR-2_by_design states the multiplicative order of lambda mod r.'
      - id: NF-02
        definition: 'As NF-01 at n = 17, a = 1. Its group_order, r and lambda must also equal the carried fixture_n17 frozen_values; the equality is the check, not a new value.'
      - id: NF-03
        definition: 'As NF-01 at n = 23, a = 0.'
      - id: NF-04
        definition: 'As NF-01 at n = 23, a = 1.'
      - id: NF-05
        definition: 'As NF-01 at n = 31, a = 0.'
      - id: NF-06
        definition: 'As NF-01 at n = 31, a = 1.'
      - id: NF-07
        definition: 'As NF-01 at n = 41, a = 0.'
      - id: NF-08
        definition: 'As NF-01 at n = 41, a = 1.'
      - id: NF-09
        definition: 'For each positive n, r_0 and r_1 are r (CD-R) for a = 0 and a = 1; complete is true iff both (n, 0) and (n, 1) are admitted under CD-E1 and r_0 != r_1.'
      - id: NF-10
        definition: definition not separable
        why: A design threshold, not a computed quantity; its only definition names the multiple it uses, so it cannot be written without its value.
      - id: NF-11
        definition: definition not separable
        why: Design choices, not a computed quantity; its text states the design it freezes, and the outcomes it names rest on version-2 instrument definitions outside your sources and beyond the arithmetic BL-6 permits.
      - id: NF-12
        definition: >-
          The complete set of irreducible factors over F_2 of Phi_n(X) = (X^n -
          1)/(X - 1) at n = 23, each written as a bit pattern with bit i the
          coefficient of X^i, listed in definitions.canonical_order_of_divisors;
          count is the number of factors and degree their common degree
          ord_n(2).
      - id: NF-13
        definition: As NF-12 at n = 31.
      - id: NF-14
        definition: As NF-12 at n = 41.
        copied_in_part: >-
          Only the first sentence is copied. The rest of the worksheet entry is
          a check against a carried fixture outside your sources and adds no
          quantity; compute nothing for it and say so.
      - id: NF-15
        definition: >-
          divisors: the four designed stable divisors g of that n, chosen by the
          carried rule cells.positive_arm.stable_subspaces_per_curve from the
          canonical factors of Phi_n (the carried fixture bits at n = 17, NF-12
          to NF-14 otherwise), each written as the bit pattern of the F_2
          product. deg_h_g, per divisor: the number of zeta in mu_n(F_r) with
          g-hat(zeta) = 0 mod r, where g-hat is the 0/1 integer lift of g
          (definitions.ker_g_basis) and r is CD-R at (n, a); equivalently the
          degree of gcd(g-hat mod r, X^n - 1) over F_r.
      - id: NF-16
        definition: As NF-15 at n = 17, a = 1 (the divisors are those of n = 17; only r changes with a).
      - id: NF-17
        definition: As NF-15 at n = 23, a = 0.
      - id: NF-18
        definition: As NF-16 at n = 23.
      - id: NF-19
        definition: As NF-15 at n = 31, a = 0.
      - id: NF-20
        definition: As NF-16 at n = 31.
      - id: NF-21
        definition: As NF-15 at n = 41, a = 0.
      - id: NF-22
        definition: >-
          As NF-16 at n = 41. The table's consequence sentence follows from
          NF-15 to NF-22 by definitions.ker_g_null_expectation and is not a
          separate value.
      - id: NF-23
        definition: >-
          Under the enumeration rule of CTL-ADMISSION-SELFTEST what_v2 (field
          F_2[z]/(z^3 + z + 1), a and b as 3-bit integers in the basis 1, z,
          z^2, b not in F_2, ascending in 8 a + b, the first curve y^2 + x y =
          x^3 + a x^2 + b whose #E(F_8) has a prime factor at least 5): that
          (a, b) and its key; #E(F_8) by exhaustive count with the point at
          infinity; its prime factorisation; r0 its largest prime factor; the
          trace 9 - #E(F_8); the roots mod r0 of X^2 - trace X + 8; d_min, q and
          k by definitions.k_and_q from the coefficients over F_{2^15}; and the
          scalar by which the q-power Frobenius acts on the order-r0 subgroup of
          E(F_8).
      - id: NF-24
        definition: >-
          expected_AR-2: the verdict and recorded
          reason of definitions.AR-2_v2 applied in isolation to the NF-23
          object. expected_deleted_clause_mutant: the verdict of AR-2 with its
          order clause deleted (only lambda^k = 1 checked) on the same object.
        copied_in_part: >-
          Its clauses for expected_AR-2 and expected_deleted_clause_mutant are
          copied. Its clause for skipped_before_it is not, because its wording
          may not be carried in this file and a verbatim clause cannot be
          reworded: compute nothing for skipped_before_it beyond your NF-23
          enumeration, and say so.
  c2pnb_source_tier:
    source: >-
      Verbatim excerpts of the version-2 contract's source rule SR-SRC-6,
      omitting its clauses on how that contract treats a tiered value. Your
      sources entry ansi_x962_c2pnb already names the primary tier, TIER-P
      here; TIER-D is the separately labelled tier that entry lets A1 define.
      Compute and label each c2pnb row per tier as that entry requires.
    excerpts:
    - >-
      TIER-P (primary): the
      published ANSI X9.62 edition and annex that publishes the curve, or a
      primary standard that reproduces it verbatim and says so (SR-SRC-1).
    - >-
      TIER-D (draft): an ANSI X9.62 committee working draft. TIER-D IS ADMITTED
      ONLY AS A SEPARATELY LABELLED, INFORMATION-ONLY TIER. A TIER-D value is
      computed and reported in its own column with its tier label, document,
      date, retrieval provenance and digest;
    - >-
      A third-party archive copy of a draft carries that
      qualifier in its label.
