# =============================================================================
# Blind inputs for TASK-20260925-2e6b10 (joint J5 of REVIEW-BINSTD-20260925-b67954).
#
# This file is one of the files you may read. It tells you WHAT to compute and
# nothing about how anyone else computed it, or what they found. It contains no
# computed value of any kind: the integers below are input moduli, field
# degrees and parameter ranges, never answers.
# =============================================================================
blind_inputs:
  task_id: TASK-20260925-2e6b10
  review_plan_id: REVIEW-BINSTD-20260925-b67954
  joint: J5
  amendment:
    path: coordination/review/binstd-20260925-b67954/blind-inputs.amendment-A1.yaml
    rule: >-
      If this file exists when you start, read it: it is part of your inputs. It
      may add quantity definitions under Q4 (ids NF-nn), refine the cell set of
      Q3, define a separately labelled source tier for the c2pnb rows, and remove
      entries from your whitelist. It never states a value. If it does not exist,
      Q4 is empty; state that as a result.
  sources:
    fips_binary_curves: >-
      inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md, with its
      source_record.yaml, for K-163, K-233, K-283, K-409 and K-571, and for the
      form of the Koblitz curve equation used in Q3.
    ecc2k_130_primary: >-
      inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md, with its
      source_record.yaml. The Certicom challenge publication is this row's
      primary source.
    ecc2k_130_cross_check: >-
      inputs/BAILEY-2009-541-ECC2K130/ecc-challenge-info-index.html and
      source_record.yaml, and inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md
      only if it is present in the tree. If it is absent you may retrieve the
      Bailey et al. eprint 2009/541 from outside the repository and cite it with
      provenance retrieved. A cross-check never replaces the primary.
    ansi_x962_c2pnb: >-
      Not in your whitelist. Retrieve the published ANSI X9.62 curve parameters,
      or a primary standard that reproduces them verbatim and says so, from
      outside the repository, and record provenance retrieved with the exact
      document, edition, section and a digest of what you retrieved. If you
      cannot reach such a source, record the row NOT COMPUTED with the reason.
      If amendment A1 defines a separately labelled source tier (for example a
      committee working draft), compute the row under that tier SEPARATELY and
      label every value with its tier; never merge tiers and never let one tier
      stand in for another. Never use a secondary dump or recall.
  source_note: >-
    These sources, your own handoff card and amendment A1 (if present) are your
    ONLY sources. If one of them refers to a repository file, do NOT open it;
    record the reference under Q0.

  what_you_are_testing: >-
    Whether a six-value multiplicative-order census, eleven divisibility
    verdicts, a small table of toy Koblitz group orders and their
    factorisations, and any further quantity defined in amendment A1 are
    determined by elementary arithmetic and primary curve parameters. A second
    implementation, written by someone who shares nothing with you, will be
    compared with yours afterwards.

  quantities:
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which your sources or definitions left you a choice: which
        printed parameter is the subgroup order; a curve naming mismatch between
        a standard and the row label below; the smallest field of definition of
        a curve; the value of k; the form of the Koblitz equation or the meaning
        of the parameter a; which prime factor a Q4 rule selects; a reference to
        another file. For each: quote the text, list the admissible readings, and
        say which quantities depend on it.
      report: A list. An empty list is a result and must be stated as such.
    Q1:
      name: multiplicative order of 2 modulo n
      n_values: [131, 163, 233, 283, 409, 571]
      definition: >-
        For each n, the least positive integer e with 2^e = 1 mod n. Also state
        whether n is prime.
      report: >-
        Per n: e, the factorisation of n - 1 you used, and a one-line check a
        reader can repeat (the powers of 2 you evaluated at each maximal proper
        divisor of e's candidate).
      tolerance: exact
    Q2:
      name: k divides r - 1, at eleven standardized rows
      rows:
        - c2pnb176v1
        - c2pnb208w1
        - c2pnb272w1
        - c2pnb304w1
        - c2pnb368w1
        - ECC2K-130
        - K-163
        - K-233
        - K-283
        - K-409
        - K-571
      row_label_note: >-
        The row labels are the program's. If the primary standard names a curve
        differently (a v1 versus w1 suffix, for example), record the mismatch
        under Q0 and say which curve you used and why.
      definition: >-
        For each row, let r be the prime order of the subgroup the standard's
        base point generates, read from the primary source. Let F_q be the
        smallest field over which the curve's equation is defined (verify it
        from the coefficients yourself, do not assume it) and F_(q^k) the field
        the curve is used over, so that k is the order of the q-power Frobenius
        endomorphism. State whether k divides r - 1.
      report: >-
        Per row: the source (document, section, provenance, tier if A1 defines
        tiers), r in decimal and its bit length, the extension degree m, the
        smallest field of definition and how you established it, k, and the
        verdict TRUE, FALSE or NOT COMPUTED with the reason.
      tolerance: exact
    Q3:
      name: toy Koblitz group orders at the positive-arm cells
      cells: >-
        n in [17, 23, 31, 41] and a in [0, 1], eight cells, plus any cell that
        amendment A1 adds.
      definition: >-
        For each cell, E_a is the Koblitz curve with parameter a in the form
        FIPS 186-4 gives for Koblitz curves (read the equation there; record
        any alternative reading under Q0), taken over F_(2^n). Compute
        N = #E_a(F_(2^n)) exactly, the complete prime factorisation of N with
        multiplicities, and for each prime factor its bit length. Also state
        whether n is prime and the multiplicative order of 2 modulo n.
      report: >-
        Per cell: the method (name the algorithm and library, with versions) and
        an independent check of N (a second method, or a stated identity you
        verified numerically), N in decimal, the factorisation, and each prime
        factor's bit length. Give no admissibility verdict unless A1 states the
        rule as a definition; if it does, apply it and report the verdict per
        prime factor under Q4.
      tolerance: exact
    Q4:
      name: further newly frozen quantities
      definition: >-
        Each item NF-nn exactly as amendment A1 defines it, and nothing else. If
        a definition leaves a choice, record it under Q0 and compute every
        admissible reading. If A1 records an item as "definition not
        separable", compute nothing for it beyond Q3 and say so.
      report: Per NF id, the value or verdict, the method and a repeatable check.
      tolerance: exact unless the A1 definition states a tolerance

  whitelist:
    - ledger/handoffs/TASK-20260925-2e6b10.yaml
    - coordination/review/binstd-20260925-b67954/blind-inputs.yaml
    - coordination/review/binstd-20260925-b67954/blind-inputs.amendment-A1.yaml (only if present)
    - inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md
    - inputs/FIPS186-4-BINARY-CURVES/source_record.yaml
    - inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md
    - inputs/CERTICOM-CHALLENGE-2009/source_record.yaml
    - inputs/BAILEY-2009-541-ECC2K130/ecc-challenge-info-index.html
    - inputs/BAILEY-2009-541-ECC2K130/source_record.yaml
    - inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md (only if present)
    - AGENTS.md (operating rules only, never a source of any value)
    - agents/validator.md (operating rules only)
    - templates/research-records.md (report shape only)
  whitelist_note: >-
    Amendment A1 may remove entries from this list; it never adds a source that
    states an answer. Every other repository path is out of scope.

  rules:
    - BL-1 Read ONLY the whitelisted repository paths above, as reduced by A1 if present. Every other repository path is out of scope.
    - BL-2 Run no git command that shows history (log, show, blame, diff) and read no pull-request text.
    - >-
      BL-3 Choose your own libraries and algorithms and name them with versions.
      Do not transcribe an order, a group order, a factorisation, a k or a
      verdict from any source; compute it. Curve parameters are read from a
      primary source, never recalled.
    - >-
      BL-4 If you find, in a source you were permitted to read, a value that looks
      like an already-computed answer to Q1, Q2, Q3 or Q4, STOP and report a
      leak with file and line.
    - BL-5 Report on J5 only. Give no verdict on the contract or the hypothesis, which you have not read.
    - BL-6 ZERO experiment runs. Instantiate no curve beyond reading its parameters and the toy arithmetic above; this is arithmetic.
    - BL-7 Write nothing outside your write scope. Put every script, command and raw output inside computations.json.

  verdict_rule_for_your_attestation: >-
    Your review_attestation verdict on J5 is inconclusive by design: you are
    forbidden to compare. Report Q0 to Q4 in full; the composing Coordinator
    compares them with the contract's frozen values under the plan's keys.
