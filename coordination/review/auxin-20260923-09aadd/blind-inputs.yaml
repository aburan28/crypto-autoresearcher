blind_inputs:
  task_id: TASK-20260923-edaa75
  review_plan_id: REVIEW-AUXIN-20260923-09aadd
  source_of_recipes: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
  source_note: >-
    The amendment file named above is the ONLY source of control recipes,
    classification rules and cost formulas. If it refers to another file for a
    recipe, a rule or a formula, do NOT open that file. Record the reference as
    a finding under Q0 and continue with whatever the amendment itself states.

  what_you_are_testing: >-
    Whether the amendment's control recipes, classification rules and cost
    formulas are fully determined by its text. You are not asked whether they
    are good choices. A second implementation, written by someone who shares
    nothing with you, will be compared with yours afterwards.

  quantities:
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which the amendment text left you a choice (a search
        start, a step order, a primality test, an acceptance rule, a tie-break,
        a rounding rule, a unit, a reference to another file). For each: quote
        the text, list the readings you consider admissible, and say which
        quantities below depend on the choice.
      report: A list. An empty list is a result, and must be stated as such.
    Q1:
      name: control integers
      definition: >-
        For every control the amendment declares, the integer or integers its
        recipe produces, following the recipe literally with the declared seeds
        and windows.
      report: >-
        Each integer in decimal, its bit length, the number of candidates your
        search examined before accepting it, and a primality certificate for
        every integer the recipe requires to be prime. Where Q0 lists a choice
        that changes the integer, report the integer under each admissible
        reading.
      tolerance: exact
    Q2:
      name: per-branch classification of each control
      definition: >-
        For each Q1 integer, the category the amendment's own rules assign it on
        the r - 1 branch and on the r + 1 branch, together with the divisor or
        divisors those rules rely on.
      report: The category per branch, and the witness divisors with their bit lengths.
      tolerance: exact
    Q3:
      name: per-branch typed cost of each control
      definition: >-
        For each Q1 integer, the cost the amendment's formula gives on each
        branch at the divisor its rules select, and the input model the
        amendment attaches to that branch.
      report: log2 of each cost, to at least four decimal places, and the input model.
      tolerance: 0.01 bit

  rules:
    - BL-1 Read ONLY the six whitelisted paths on your card. Every other path in the repository is out of scope.
    - BL-2 Run no git command that shows history (log, show, blame, diff) and read no pull-request text.
    - >-
      BL-3 Choose your own libraries and algorithms and name them with versions.
      Published mathematics from outside this repository is allowed and is
      cited with provenance. Do not transcribe any integer from any source.
    - >-
      BL-4 If you find in a file you were permitted to read a value that looks
      like an already-computed answer to Q1, Q2 or Q3, STOP and report a leak.
    - BL-5 Report on J4 only. Give no verdict on the amendment as a whole.
    - BL-6 ZERO experiment runs. Run no Cheon algorithm and generate no [x^i]P. This is an independent computation.
    - BL-7 Write nothing outside your write scope. Put every script, command and raw output inside computations.json.

  verdict_rule_for_your_attestation: >-
    Your review_attestation verdict on J4 is inconclusive by design: you are
    forbidden to compare. Report Q0 to Q3 in full; the composing Coordinator
    compares them with the other implementation under the plan's keys.
