# =============================================================================
# REVIEW-AUXIN-20260923-09aadd -- review plan for the design of
# AMD-EXP-AUXIN-7e2e3d-20260923-d1d10, the versioned additive protocol amendment
# to EXP-AUXIN-7e2e3d that DEC-20260923-ce06a6 next_actions item 1 requires.
# Written BEFORE the amendment exists and BEFORE ANY REVIEWER RUNS.
#
# WHY THIS ROUND EXISTS. DEC-20260923-ce06a6 ruled RUN-AUXIN-fd1edc invalid as
# evidence and returned the lane to protocol design, not to the Executor,
# because three of its defects sit IN the contract. It required the amendment
# to be reviewed under a plan written first, before any Coordinator approval.
# This is that plan. The composing decision DEC-20260923-a4c3d5 approves or
# refuses the amendment. Nothing in this round is a measurement of any curve.
#
# OUTCOME DISCIPLINE. This plan states no census value, no minimising divisor,
# no escalated-curve list and no value from any BATCH-ba0b0d review. Those are
# cited only by record id (DEC-20260923-ce06a6, CORR-20260923-64ee17,
# CORR-20260923-187ea3, CORR-20260923-5c5a23). No control integer exists yet;
# the reviewers compute them.
# =============================================================================
review_plan:
  id: REVIEW-AUXIN-20260923-09aadd
  goal_id: GOAL-AUXIN-a93442
  batch_id: BATCH-09aadd
  experiment_id: EXP-AUXIN-7e2e3d
  amendment_id: AMD-EXP-AUXIN-7e2e3d-20260923-d1d10
  amendment_path: experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
  hypothesis_id: H-AUXIN-66e6fd
  question_id: RQ-AUXIN-f8d8c0
  opened_by_decision: DEC-20260923-bd46e6
  composing_decision: DEC-20260923-a4c3d5
  opening_task: TASK-20260923-9a9d8b
  archived_by: TASK-20260923-fa1faf
  producer_task: TASK-20260923-5a2cbc
  producer_snapshot: TASK-20260923-5ff07e
  written_at: '2026-09-23'
  written_before_any_reviewer_ran: true
  written_before_the_object_existed: true
  written_before_the_object_existed_note: >-
    TRUE. The object under review is a protocol amendment that the producer
    TASK-20260923-5a2cbc has not yet written. The joints are fixed now by the
    ten defects DEC-20260923-ce06a6 lists, which are known before the design.
    The object is bound by content only after it exists, by the producer
    snapshot TASK-20260923-5ff07e (content_first). Reviewers hash the two
    producer files against that receipt's path_sha256 before relying on them.

  # ---------------------------------------------------------------------------
  # REVIEW TIER.
  # ---------------------------------------------------------------------------
  tier:
    policy: review-adversarial
    reasoning_effort: xhigh (policy default)
    ruling: >-
      review-adversarial, NOT review-breakthrough. The object is a protocol
      amendment, not a claim. It asserts no result, closes no lane, and
      contradicts no validated evidence record (AGENTS.md rule 12). The lane's
      method ceiling is Cheon's known exponent realised at specific integers
      under supplied input (DEC-20260923-ce06a6 rationale). The tripwires below
      say exactly when the round would become a rule-12 matter.
    tripwires:
      - id: T1
        fires_when: >-
          The amendment, the design report or any review report states or
          implies an ordinary-ECDLP improvement, a vulnerability, a weak-curve or
          safe-curve verdict, or any statement about a deployed system. This is
          GOAL-AUXIN-a93442 pause condition 2 and the DEC-20260802-204
          acquisition gate.
        effect: >-
          The reviewer finishes its joint, flags T1 at the top of its report and
          stops. The Coordinator does not compose. The statement routes to a
          review-breakthrough round (validator-breakthrough /
          red-team-breakthrough at max) in independent sessions, and the
          amendment is not approved while that round is open.
      - id: T2
        fires_when: >-
          Any record in the round asserts, as an attainable cost, a value below
          the published floor for its branch. This is the standing clause of
          CORR-20260923-187ea3.
        effect: Stop and route to review-breakthrough, as for T1.
      - id: T3
        fires_when: >-
          The round would state a closure (for example that the attack class is
          inert at deployed parameters) or would contradict a validated evidence
          record.
        effect: Stop and route to review-breakthrough, as for T1.
    tripwire_note: >-
      Pre-declared, so escalation is a rule applied and not a judgement made
      after reading the reports. validator-breakthrough and
      red-team-breakthrough exist on this runtime as sibling bindings at max
      effort. Served by inheritance they are a backend substitution, recorded
      as fallback_used, and never a tier downgrade.

  # ---------------------------------------------------------------------------
  # THE CLAIM UNDER REVIEW.
  # ---------------------------------------------------------------------------
  claim_under_review:
    statement: >-
      AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 discharges every one of the defects
      D1 to D10 listed in DEC-20260923-ce06a6 next_actions item 1, and is
      complete enough for Coordinator approval: every control, metric, budget,
      stopping rule, invalidation rule, required artifact, success criterion
      and falsification criterion is present, and the success criterion is
      decidable from predefined metrics with at least one outcome that counts
      as negative.
    defects_to_discharge: >-
      The ten defects are read verbatim from DEC-20260923-ce06a6 next_actions
      item 1 (D1 pins and field-prime check; D2 typed two-branch costs; D3 the
      predicate over explicit witnesses, if kept; D4 calibration against the
      random-prime null or removal of escalate semantics; D5 fully declared
      control recipes including a planted r + 1 positive control and an
      inert-on-both-branches control; D6 factoring to the frozen budget with a
      declared ECM-capable backend; D7 exported, independently verified
      primality certificates from a library other than sympy; D8 a
      verifier-bound snapshot; D9 labelling per CORR-20260923-187ea3; D10
      additive new files only). They are not paraphrased further here.
    object_under_review:
      paths:
        - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
        - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/design/TASK-20260923-5a2cbc/design-report.yaml
      binding: >-
        Bound by path_sha256 in TASK-20260923-5ff07e's snapshot receipt
        (content_first). Every reviewer hashes both files before relying on
        them and reports any mismatch as a custody finding.
      context_not_under_review: >-
        experiments/EXP-AUXIN-7e2e3d/specification.yaml (frozen v1) and
        experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260916-bands.yaml are
        context. Neither may be edited by anyone in this round.

  # ---------------------------------------------------------------------------
  # THE PRIOR. Recorded first, before the object or any report exists.
  # ---------------------------------------------------------------------------
  coordinator_prior:
    per_joint: >-
      J1 (pins, factoring budget, certificates, snapshot binding, additivity)
      HOLDS with probability about 0.6. If it breaks, I expect the break in
      backend or toolchain availability: a declared ECM-capable backend or
      certificate library that the pinned environment does not provide, or a
      certificate format no library-free verifier can check. J2 (typed costs
      and predicate) HOLDS with probability about 0.7, because
      CORR-20260923-187ea3 already fixes the typing; if it breaks, I expect it
      on how a predicate treats rows whose cofactor is left unfactored. J3
      (calibration and control constructibility) HOLDS with probability about
      0.45; this is where I expect the round to break, either because the
      planted r + 1 positive control is not constructible in its declared
      window at deployed size, or because a threshold is calibrated in a way
      that depends on the run's own deployed rows. J4 (blind determinacy)
      AGREES with J3's control integers with probability about 0.6; a
      disagreement would most likely come from an undeclared search order,
      primality test or tie-break. J5 (labelling, scope, proves-too-much) HOLDS
      with probability about 0.75.
    overall: >-
      Probability about 0.3 that the round composes to approve on this first
      design. The most likely outcome is revise on D5 or D4.
    where_i_think_it_breaks_if_it_breaks: J3, then J4, then J1.
    what_would_overturn_this_prior_most: >-
      (1) J3 and J4 agreeing exactly on every control integer from the
      amendment text alone, first time, which would show the recipe discipline
      D5 asks for is easier than the last run suggested. (2) J2 finding the
      typed-cost column itself wrong against the primary source, which I do
      not expect because the typing was fixed by a correction that read it.
      (3) A T1 or T3 firing, which I consider unlikely because the design card
      forbids every such sentence.
    informed_prior_disclosure: >-
      The prior is informed, not blind (PD-R1). A prior the review overturns is
      among the most valuable results this round can produce, and it is
      recorded here so that it can be.

  # ---------------------------------------------------------------------------
  # JOINTS. Each has exactly ONE owner.
  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        J1 -- PINS, FACTORING, CERTIFICATES, CUSTODY AND ADDITIVITY (D1, D6, D7,
        D8, D10). Every r is pinned at run time from a named primary-source file
        with line numbers, and a field-prime confounder check runs on every row.
        Factoring runs to the frozen per-integer budget on a declared
        ECM-capable backend, with seconds spent reported per cofactor and no
        undeclared bit cap. Primality is proved with exported certificates that
        a library other than sympy produces and an independent verifier checks.
        The snapshot declares every run file and implementation module in
        path_sha256. The amendment is a new file and rewrites nothing.
      assigned_to: TASK-20260923-c78ddf
      attack_plan: >-
        (i) For each of the ten curves, follow the amendment's pin procedure
        literally to the primary-source file and line it names, re-derive r
        yourself from that source, and check that the procedure would reject
        the field prime of every row: substitute the field prime for r on one
        row (the brainpoolP384r1 case DEC-20260923-ce06a6 J1 names) and show the
        check fires before any factoring. (ii) Read the factoring clause and say
        whether an executor could violate the frozen per-integer budget or apply
        a bit cap without breaking a written rule. Name the backend it
        declares, and check in this environment whether that backend exists and
        which version; report absence as an infrastructure finding. (iii) Read
        the certificate clause. Produce one certificate of the declared kind for
        a prime of at least 250 bits you choose yourself, and verify it with a
        verifier that does not import the producing library. (iv) Check that
        the required_artifacts and snapshot clauses force path_sha256 over every
        run file and implementation module, a dirty_summary in the manifest,
        and any self-hash computed over committed bytes. (v) Check with git that
        specification.yaml and AMD-20260916-bands.yaml are byte-identical before
        and after the producer's snapshot commit. WHERE I THINK IT BREAKS: (ii)
        or (iii), on availability.
      breaking_artifact: >-
        A pin procedure that admits a field prime or a non-primary source; a
        factoring or certificate clause an executor could satisfy while doing
        what DEC-20260923-ce06a6 D6 or D7 forbids; a declared tool that does not
        exist here; a run file or module the snapshot clause leaves unbound; or
        any byte change to a frozen file.
    - joint: >-
        J2 -- TYPED COSTS AND THE PREDICATE (D2, D3). The r - 1 and r + 1
        branches are costed by separate formulas in separate columns, each row
        carrying its input model and the bits of d, and the r + 1 formula is the
        one Cheon 2006 Theorem 2 states. If an escalate or flag predicate is
        kept, it is stated over explicit divisor witnesses, includes rows whose
        cofactor is unfactored, is evaluated per typed reading, and is
        stratified by expected_structure_flag.
      assigned_to: TASK-20260923-635c5c
      attack_plan: >-
        (i) Retrieve and read Cheon 2006 Theorems 1 and 2 (or the journal
        version, if you can reach it, and say which you read) and compare each
        formula in the amendment term by term, including the input model each
        theorem requires. Record provenance; a recalled statement is a pointer
        only. (ii) Evaluate the amendment's two formulas at three toy integers
        you construct, where you can also compute the correct value by hand, and
        report any disagreement. (iii) If a predicate is kept, construct a row
        whose cofactor is unfactored and a row where the witness divisor sits on
        the r + 1 branch, and say what the amendment's text makes the predicate
        return on each, and whether the text determines it. (iv) Check that
        frozen-expression r + 1 values, if they appear at all, are labelled
        arithmetic and never enter a cost column. WHERE I THINK IT BREAKS: (iii),
        on unfactored rows.
      breaking_artifact: >-
        A formula that disagrees with the primary source; an input model
        missing from a row type; a predicate whose value on a constructed row
        the text does not determine; or an arithmetic-only value placed in a
        cost column.
    - joint: >-
        J3 -- CALIBRATION AND CONTROL CONSTRUCTIBILITY (D4, D5). Every threshold
        is fixed before the run and is a function only of a declared null arm
        or of declared constants, never of deployed-row outcomes; or escalate
        semantics are removed and the table is descriptive. Every control is
        fully declared (search start, step order, primality test, acceptance
        rule, tie-breaks) and is constructible in its declared window,
        including a planted r + 1 positive control at deployed size and an
        inert-on-both-branches control.
      assigned_to: TASK-20260923-c78ddf
      attack_plan: >-
        (i) Build every control integer from the amendment text with your own
        code, following the recipe literally. Report each integer, the number
        of candidates examined, and every point where the text left you a
        choice. A choice you had to make is a finding, not a detail. (ii) For
        each control, check that it satisfies its own acceptance rule and that
        it lies inside its declared window; for the planted r + 1 positive
        control, check at deployed size that the planted divisor is present and
        of the declared size. (iii) For every threshold or decision rule, write
        down the quantities it depends on. If any depends on a deployed-row
        value, or on anything the run itself produces other than a declared null
        arm, J3 breaks. If a null arm is declared, check that its sampler, sample
        size and seed are frozen and that the rule reads it before any deployed
        row is scored. (iv) Say whether the stage order in the amendment makes
        the controls and calibration run BEFORE any deployed row is examined.
        WHERE I THINK IT BREAKS: (ii) on the r + 1 planted control, or (iii).
      breaking_artifact: >-
        A control that cannot be built from the text alone, lies outside its
        window, or fails its own acceptance rule; a recipe with an undeclared
        choice; or a threshold that depends on deployed-row outcomes.
    - joint: >-
        J4 -- BLIND DETERMINACY OF THE CONTROL RECIPES. Two implementations that
        share nothing, given only the amendment text, produce the same control
        integers and the same per-branch classifications. See
        blind_rederivation below.
      assigned_to: TASK-20260923-edaa75
      attack_plan: >-
        See blind_rederivation and blind-inputs.yaml. The re-deriver is told what
        to compute and not how. Its value is that it has read nothing but the
        amendment text and its own instructions.
      breaking_artifact: >-
        Any control integer or classification that differs from J3's. That
        localises the fault to an undetermined recipe or to one of two named
        implementations; it does not by itself say which.
    - joint: >-
        J5 -- LABELLING, SCOPE AND PROVES-TOO-MUCH (D9, and the required
        control). Every rho column, supply condition and comparison is labelled
        per CORR-20260923-187ea3, with no unqualified identical-accounting
        claim. No sentence in the amendment or design report exceeds the
        lane's scope. The amended pipeline, as written, does not deliver its
        conclusions on objects where they are known false.
      assigned_to: TASK-20260923-635c5c
      attack_plan: >-
        (i) Read the amendment and design report line by line and quote every
        sentence that states or implies more than a typed, labelled arithmetic
        table at the frozen curve orders. Check each against
        CORR-20260923-187ea3 and CORR-20260923-5c5a23. (ii) Perform PTM-A to
        PTM-D below against their failure signature, using the amendment's
        formulas and rules applied in your own script. WHERE I THINK IT BREAKS:
        PTM-C, if a flag category survives without its null rate beside it.
      breaking_artifact: >-
        An unlabelled or over-scoped sentence, or a proves-too-much object on
        which the amendment's rules yield the conclusion that is known false.

  joint_ownership_note: >-
    FIVE JOINTS, THREE OWNERS, NONE UNOWNED, NONE SHARED. The split is by
    ACCESS. TASK-20260923-c78ddf (validator) owns J1 and J3: custody, tools and
    constructibility, which need the environment and git. TASK-20260923-635c5c
    (red team) owns J2 and J5: the primary-source comparison, scope and the
    proves-too-much control. TASK-20260923-edaa75 (validator, a separate
    session) owns only J4, and reads a whitelist that excludes every other
    reviewer's work and every record carrying census values.

  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Not lifted. No reviewer reads another reviewer's report in this round. In
      particular J3's control integers must not reach J4 before J4 returns; the
      comparison is made only at composition. A later hardening round may lift
      blindness by addendum with its own rationale, never by drift.
    excluded_from_every_reviewer: >-
      experiments/EXP-FROB-30006a/, the ref origin/cursor/semaev-2015-audit-program-5b8b
      and PR #1377. None of it bears on this round.

  # ---------------------------------------------------------------------------
  # PROVES TOO MUCH.
  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20260923-635c5c
    objects:
      - id: PTM-A
        object: >-
          The inert-on-both-branches prime constructed by TASK-20260922-0e10d1
          (its PTM-2 construction, as that report describes the construction).
          Rebuild it from the construction, not by copying an integer.
        known_truth: It is built so that neither r - 1 nor r + 1 carries a useful divisor.
      - id: PTM-B
        object: >-
          The field prime of the brainpoolP384r1 row (RFC 5639 p) presented as
          if it were the group order r.
        known_truth: It is not the order of the curve's prime subgroup.
      - id: PTM-C
        object: >-
          A sample of uniformly random primes of the same bit size as a deployed
          row, drawn by a sampler and seed you declare in computations.json
          before evaluating any of them.
        known_truth: They carry no curve-specific structure of any kind.
      - id: PTM-D
        object: >-
          A toy prime r for which r + 1 has a divisor d strictly greater than
          sqrt(r).
        known_truth: >-
          On the r + 1 branch the cost sqrt((r + 1)/d) + d is at least d, which
          exceeds sqrt(r). No correct r + 1 cost at that d is below sqrt(r).
    failure_signature: >-
      A correct amendment keeps each known-false conclusion out of reach, and
      does so in its rules, not only in prose. PTM-A is reported inert (or not
      flagged) on both branches. PTM-B is rejected by the D1 confounder check
      as an invalid measurement before any factoring or cost is computed. PTM-C
      is reported with the same categories as a deployed row, and no category
      is read as curve-specific unless the amendment's own pre-registered rule
      separates the deployed rate from this null rate. PTM-D receives an r + 1
      cost of at least sqrt(r). A rule that returns flagged on PTM-A, admits
      PTM-B, reads a category as curve-specific on PTM-C, or prices PTM-D below
      sqrt(r) has proved too much.
    how_to_run_it: >-
      REVIEW COMPUTATIONS. They mint no RUN-*, write no evidence record, run no
      Cheon algorithm, generate no [x^i]P, touch no deployed system, and never
      execute experiments/EXP-AUXIN-7e2e3d/implementation/driver.py as an
      experiment. Evaluate the amendment's formulas and rules in your own
      script. Put every script, seed and output in computations.json. If a PTM
      would amount to a new experiment, record it NOT PERFORMED with the
      reason.

  # ---------------------------------------------------------------------------
  # BLIND RE-DERIVATION.
  # ---------------------------------------------------------------------------
  blind_rederivation:
    required: true
    assigned_to: TASK-20260923-edaa75
    quantity: >-
      Q1, Q2 and Q3 exactly as coordination/review/auxin-20260923-09aadd/blind-inputs.yaml
      states them. In summary: Q1 is every control integer the amendment's
      recipes produce; Q2 is each control's classification on the r - 1 and
      r + 1 branches under the amendment's own rules; Q3 is each control's
      typed cost on each branch under the amendment's own formulas. All three
      are computed from the amendment text alone.
    parameters: See blind-inputs.yaml. The amendment file is the only source of recipes.
    blind_from:
      - coordination/review/auxin-20260923-09aadd/review-plan.yaml
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-ba0b0d/
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/dispatch_queue.json
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/design/
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/reviews/TASK-20260923-c78ddf/
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/reviews/TASK-20260923-635c5c/
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/seal/
      - coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/archives/
      - coordination/review/auxin-20260922-fd1edc/
      - coordination/design/BATCH-cae584/
      - coordination/design/BATCH-5149d8/
      - experiments/EXP-AUXIN-7e2e3d/runs/
      - experiments/EXP-AUXIN-7e2e3d/implementation/
      - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260916-bands.yaml
      - experiments/EXP-AUXIN-7e2e3d/specification.yaml
      - ledger/decisions/DEC-20260923-ce06a6.yaml
      - ledger/decisions/DEC-20260922-19b645.yaml
      - ledger/decisions/DEC-20260916-c81d20.yaml
      - ledger/decisions/DEC-20260916-bc3375.yaml
      - ledger/decisions/DEC-20260923-bd46e6.yaml
      - ledger/corrections/CORR-20260923-64ee17.yaml
      - ledger/corrections/CORR-20260923-187ea3.yaml
      - ledger/corrections/CORR-20260923-5c5a23.yaml
      - ledger/goals/GOAL-AUXIN-a93442.yaml
      - ledger/hypotheses/H-AUXIN-66e6fd.yaml
      - ledger/handoffs/TASK-20260923-5a2cbc.yaml
      - ledger/handoffs/TASK-20260923-c78ddf.yaml
      - ledger/handoffs/TASK-20260923-635c5c.yaml
      - knowledge/
      - coordination/bus/
      - coordination/events/
      - every commit message and pull-request text (no git log, show, blame or diff of any kind)
    blind_from_note: >-
      The batch entries cover the producer's design report, both sibling review
      directories, the seal and every archive receipt of this batch, and the
      BATCH-ba0b0d reviews and batch.yaml. The re-deriver's own write directory
      is deliberately NOT listed; sources_read lists files read, never files
      written. The round is enforced
      by WHITELIST, not by this list: the re-deriver's card permits exactly
      blind-inputs.yaml, the amendment file, AGENTS.md, agents/validator.md,
      templates/research-records.md and its own handoff record. This list names
      where answers or census values are known to sit, so that the attestation
      can be checked (tools/check_review_independence.py).
    whitelist:
      - coordination/review/auxin-20260923-09aadd/blind-inputs.yaml
      - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260923-d1d10.yaml
      - AGENTS.md
      - agents/validator.md
      - templates/research-records.md
      - ledger/handoffs/TASK-20260923-edaa75.yaml
    agreement_tolerance: >-
      Q1 exact integers. Q2 exact categorical values. Q3 within 0.01 bit on
      log2 of each cost.
    what_disagreement_means: >-
      NOT that J3 or J4 is wrong. It localises the difference to an
      undetermined recipe or to one of two named implementations. The
      composing Coordinator reads both and applies K-indeterminate; it never
      prefers either side.

  # ---------------------------------------------------------------------------
  # COMPOSITION KEYS, frozen before the object or any report exists.
  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20260923-d80a73, in a session that did NOT run
      TASK-20260923-5a2cbc. No reviewer votes on the whole amendment.
    independence_check: >-
      `python3 tools/check_review_independence.py --plan
      coordination/review/auxin-20260923-09aadd/review-plan.yaml --reports
      coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-09aadd/reviews/`, and
      the --blind-history check against BATCH-ba0b0d's batch.yaml run before
      J4 was dispatched. Both results are recorded in DEC-20260923-a4c3d5
      whatever they are.
    keys:
      K-approve: >-
        Every joint holds; J3 and J4 agree on every Q1, Q2 and Q3 value within
        tolerance; every PTM meets its failure signature; no tripwire fired.
        DEC-20260923-a4c3d5 then approves AMD-EXP-AUXIN-7e2e3d-20260923-d1d10
        under the AGENTS.md standing user authorization, and names as its first
        next action the opening of an execution batch whose executor card is
        minted then. Approval asserts nothing about any curve.
      K-revise-defect: >-
        Any joint breaks on any of D1 to D10, or the amendment omits a field
        approval requires. Decision revise. The decision lists each defect with
        the joint and breaking artifact that found it, and names a revision
        design card in a new batch as its first next action. No run.
      K-indeterminate: >-
        J3 and J4 disagree on any Q1 or Q2 value, or on any Q3 value beyond
        tolerance, or either reports a choice the text left open. Decision
        revise on D5, whichever implementation looks right. The recipe is not
        determinate from the text, which is exactly the defect that voided the
        previous run.
      K-hypothesis: >-
        The design report or J2 or J5 finds that the H-AUXIN-66e6fd statement
        cannot be typed without changing it. Composition then files a
