    V2: >-
      HOLDS. Neither of the plan's breaking artifacts occurred. (a) All four
      named WDSat default rows reproduce exactly -- status, conflict count and
      the full assignment bit string -- from binaries rebuilt in this session
      that are byte-identical to the producer's (sha256 match on all three
      builds used), with the vendored sources verified against the committed
      manifest (15/15). (b) The Macaulay2 std::bad_alloc is an RLIMIT_AS
      artifact: under the harness's 6 GiB address-space cap the process died
      with VmPeak 5.996 GiB against VmHWM 2.575 GiB, and with the cap removed
      the identical committed script ran the identical F4 computation to
      completion (gb_size 43, maxdeg 2, not the unit ideal) with VmPeak
      145.4 GiB against VmHWM 6.82 GiB. The plan's breaking artifact for this
      clause -- "Macaulay2 failing identically without RLIMIT_AS at < 6 GB RSS"
      -- did not occur. (c) Singular's 900 s stop is a real censored
      observation about std: single-threaded, cpu/wall 1.00, 0.85 GiB peak, and
      still unfinished at 300 s with option(redSB) removed.
    proves_too_much_object_2: >-
      BREAKS (the control FAILS, by the plan's own failure signature "a
      relabelled n15l5-11-U at null-order conflicts (> 10x its structured
      count)"). Ten uniformly random relabellings of Xn15l5-11-U.anf, all UNSAT
      and all passing the required shape pre-checks, cost a median 4,224,251
      conflicts against the shipped order's 31,257 -- 135x, and 0.55x the
      matched null object's 7,697,173. Nine of ten seeds exceed both thresholds
      (>= 3e5 and > 10x); the tenth is 3.84x. The same relabelling applied to
      the null object moves it by only 2.14x, so the order sensitivity is a
      property of the structured instance, not of the measurement.
