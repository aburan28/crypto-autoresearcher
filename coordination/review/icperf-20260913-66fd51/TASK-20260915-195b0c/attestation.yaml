  unexpected_observations_recorded_in_report:
    - All 32 committed .m2 scripts carry a parse error at line 49 (`gens_`), from convert.py lines 51-54; it alone would have zeroed the Macaulay2 column even with unlimited memory.
    - Unconstrained Macaulay2 peak RSS (6.71-6.82 GiB) exceeds the contract's 6 GB per-child budget, so replacing RLIMIT_AS with an equivalent RSS watchdog would also stop the row.
    - Singular slimgb computes the same basis in 167 s where std exceeds 900 s, agreeing with Macaulay2 F4 on gb_size 43 and maxdeg 2.
    - bench.py's version probe hangs whenever the child's stdin never reaches EOF, which is why the run cannot name its Singular version (reproduced under a pty).
    - WDSat's default branching order is the ANF index order, statically (wdsat.c set[j-1]=j under __XG_ENHANCED__).
    - A single structured instance's conflict count spans 361x across variable orders; its matched null spans 2.14x.
    - The dispatch entry's top-level joints_assigned still lists [V1..V5, proves_too_much] from before the split, while handoff.joints_assigned is [V2]; the handoff and the split addendum were followed.

