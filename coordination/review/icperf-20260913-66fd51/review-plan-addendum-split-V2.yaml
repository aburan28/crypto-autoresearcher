review_plan_addendum:
  id: REVIEW-ICPERF-20260913-66fd51-ADD-SPLITV2
  extends: coordination/review/icperf-20260913-66fd51/review-plan.yaml
  also_extends: coordination/review/icperf-20260913-66fd51/review-plan-addendum-V6.yaml
  round_id: REVIEW-ICPERF-20260913-66fd51
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-51e2aa
  written_by: coordinator
  written_at: '2026-09-15T12:40Z'
  additive_only: true
  additive_only_note: >-
    Reassignment only. No joint's content, attack plan, breaking artifact or
    prior changes; no joint is added or dropped; the plan and the V6 addendum are
    not edited. What changes is WHICH task owns V2. A reader takes the three
    files in order: plan, V6 addendum, this file.

  written_before_any_reviewer_ran: true
  written_before_any_reviewer_ran_evidence: >-
    Still no report.md and no attestation.yaml anywhere under
    coordination/review/icperf-20260913-66fd51/. Both owners are `queued` with no
    live claim. This is therefore an assignment made before the round runs, not a
    mid-round reassignment -- which the contract calls a procedure_deviation and
    which this is deliberately not.

  what_changes:
    before: >-
      TASK-20260913-6c5729 owned all six joints V1-V6.
    after: >-
      TASK-20260913-6c5729 owns V1, V3, V4, V5, V6 -- every joint that is
      arithmetic over committed artifacts. TASK-20260915-195b0c owns V2 alone --
      the only joint that must execute solvers.
    one_owner_per_joint_preserved: true
    owners:
      V1: TASK-20260913-6c5729
      V2: TASK-20260915-195b0c
      V3: TASK-20260913-6c5729
      V4: TASK-20260913-6c5729
      V5: TASK-20260913-6c5729
      V6: TASK-20260913-6c5729

  why:
    the_constraint: >-
      A clean rerun of the same experiment, RUN-ICPERF-4ec9b9, is executing on
      this 4-CPU machine now. V2 rebuilds WDSat and re-runs four solver rows plus
      two Macaulay2 executions. Running it beside the rerun raises loadavg and
      pollutes the rerun's per-row timings, which is precisely the defect the
      rerun exists to remove: 125 of 504 rows in RUN-ICPERF-305ca3 started at
      loadavg > 2, and V5 exists because of it. So V2 cannot start yet.
    what_that_cost_before_this_split: >-
      With one owner for all six joints, V2's wait was the whole round's wait, and
      the ledger record for EXP-ICPERF-66fd51 waited behind a CPU contention that
      has nothing to do with five of its six joints. The five remaining joints
      need seconds of one core between them: verifying 30 certificates in
      Python, recomputing medians over 504 rows, parsing 18 ANF files, reading
      recorded_at gaps, and an integer point-count recursion at n <= 19.
    what_this_split_costs: >-
      Two reviewers where the plan had one, so the round now carries a blindness
      obligation it did not: V2's owner and the five-joint owner may not read each
      other's reports, and each attests to what it read. It also means no single
      reviewer forms a view of the whole claim -- which the plan already required
      ("reviewers report on their own joints, not on the whole claim") and which
      the Coordinator composes. And it adds a second attestation the composition
      must wait for: the ledger archive now depends on both.
    why_not_simply_wait: >-
      Waiting is the honest alternative and was the recorded plan an hour ago. It
      is rejected because the wait is on a machine resource, not on evidence: the
      five joints' inputs are committed and frozen, nothing about them changes
      when the rerun finishes, and a review that could have run is not made more
      independent by having been postponed.

  binding_constraints_on_the_five_joint_owner:
    - >-
      LAUNCH NO SOLVER AND NO COMPILER. Not WDSat, not Macaulay2, not Singular,
      not a rebuild, not "just to check one row". If a joint of yours appears to
      need one, that joint is V2 and it is not yours: write down what you would
      have run and why, and the Coordinator routes it.
    - >-
      Your total compute is seconds of one core. Python arithmetic over the
      committed artifacts is expected and fine; anything that would move loadavg
      for minutes is not.
    - >-
      Do not read TASK-20260915-195b0c's report or attestation if one exists by
      the time you run, and say in your attestation that you did not.
  binding_constraints_on_the_V2_owner:
    - >-
      Do not start until the RUN-ICPERF-4ec9b9 bench.py process has exited. The
      recheck is `pgrep -f 'bench.py --run-dir .*RUN-ICPERF-4ec9b9'` plus the tail
      of that run's phase_log.txt. If it is still running, report that you did not
      start rather than starting: a V2 measurement taken beside the rerun is
      unusable for the same reason the rerun exists.
    - >-
      Re-run exactly the four WDSat rows and the two Macaulay2 rows the plan
      names. Record loadavg at the start of each, so the next reader can see your
      own measurement condition.
    - >-
      Do not read TASK-20260913-6c5729's report or attestation, and say in your
      attestation that you did not.

  coordinator_prior_on_V2_unchanged: >-
    The prior for V2 is the one already in the plan and is not restated or
    revised here. Nothing about the machine's CPU load bears on whether the rows
    reproduce or on whether Macaulay2's bad_alloc is an RLIMIT_AS artifact.

  composition_note: >-
    The round is composed only when both attestations exist. If V2 has still not
    run when the five joints return, the Coordinator may compose an evidence
    record over the five and must then state, in that record, that V2 is
    outstanding and that reproducibility of the rows and the Groebner failure
    mode are therefore unchecked. Composing over a subset is permitted; calling
    such a composition complete is not.

  asserts_nothing_about: >-
    the science. This is a scheduling and ownership change made for machine
    headroom under the AGENTS.md dispatch rule that max_concurrent is machine
    headroom rather than a research budget. No review tier is lowered, no joint is
    weakened, and no claim moves.
