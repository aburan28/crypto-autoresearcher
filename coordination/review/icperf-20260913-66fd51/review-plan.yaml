  independence_checker_result: >-
    'COULD NOT SERVE THE ROUND AS COMPOSED, WHICH IS ITSELF RECORDED AS A FINDING.
    tools/check_review_independence.py took exactly one --plan and had no notion of an
    addendum, so it held each task to the BASE plan''s owners map, which predates
    review-plan-addendum-split-V2. Against the base plan it reported TASK-20260913-6c5729
    as failing to claim joint V2 -- a joint the governing addendum had removed from it --
    and would have reported the mirror-image failures against TASK-20260915-195b0c. The
    first reviewer refused to clear this by adding V2 to its joints_owned and inventing a
    V2 verdict, correctly naming that as a core-rule-9 fabrication, and escalated it as a
    Coordinator call. The Coordinator''s answer was to teach the checker to compose addenda
    before checking, with tests in tools/test_review_independence_addenda.py pinning that
    an addendum may add a joint, reassign an owner and add a proves-too-much object, and
    may NOT remove a joint or weaken a control. The second reviewer reports the repaired
    checker composes both addenda, confirms V2 is reassigned to it, and raises no problem
    with its ownership, verdict shape or blindness; its six residual complaints are all
    "joint X is assigned to TASK-20260913-6c5729, which filed no attestation", an artifact
    of a blinded reviewer being able to pass only its own file. NO COORDINATOR-SIDE RUN
    OVER BOTH ATTESTATIONS AGAINST THE COMPOSED PLAN IS CLAIMED HERE.'
