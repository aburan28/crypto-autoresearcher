        source; state whether it is the median over the 5 noncore_first instances of
        the cell (legitimate) or something else. (4) State the aggregation rule
        summary.py used for P6 with a null cell and whether it matches "on every cell".
      breaking_artifact: >-
        Any median off by more than the last printed digit; a corrected P3c ratio
        under 10 on any l = 6 cell; a P3b comparator that is not the matched subset.
      holding_artifact: >-
        Your reduction script, the diff table, the corrected P3c ratios, one sentence
        each on P3b and P6 aggregation.
    - joint: >-
        V4 -- NULL-OBJECT SHAPE AND P6 CENSORING. That each null object has the
        template's variable count, equation count and degree profile; that the P6
        ratios reproduce; that the n19l6 censored reading is stated.
      assigned_to: TASK-20260913-6c5729
      attack_plan: >-
        (1) For each of the 18 files in null_objects/, parse the ANF and compute
        variable count, equation count, monomial count per degree; do the same for
        the template Xn..anf named on the row (`null_object` / `null_sizing` fields);
