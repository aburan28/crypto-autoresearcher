        report 180 s / median structured-U wall as the censored lower bound and say
        whether the contract permits reading it as support (it words P6 in conflicts,
        not wall).
      breaking_artifact: >-
        A shape mismatch the row marks true; a finishing null with fewer conflicts than
        the structured U median of its cell.
      holding_artifact: >-
        The 18-row shape table, the three ratios, the n19l6 censored bound.
    - joint: >-
        V5 -- TIMING INTEGRITY. That no measured row spans a VM suspension; that
        rows launched at loadavg > 2 do not move any P3c or P4 median by more than the
        prediction's margin; that no row exceeds its timeout.
      assigned_to: TASK-20260913-6c5729
      attack_plan: >-
        (1) Recompute the recorded_at gaps and the wall_s vs cpu_s check across all
        504 rows. (2) Recompute the P3c and P4 medians excluding rows with
        loadavg1_at_start > 2 and report the per-cell change in percent and whether
        any P3c (>= 10x) or P4 (no > 10% speedup) verdict flips. (3) List any row with
        wall_s > timeout_s + 1.
      breaking_artifact: >-
        A row with wall_s far above cpu_s; a verdict flip under exclusion.
      holding_artifact: >-
        The gap list, the exclusion-sensitivity table, the timeout check.

