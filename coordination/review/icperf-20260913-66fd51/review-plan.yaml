  claim_under_review: >-
    As the producer stated it (manifest.yaml status_note and task-report.md): every
    planned row is present as finished, budget-stopped or infrastructure-exited; 30/30
    shipped certificates verify; 200 of 205 SAT answers verify as decompositions on the
    curve and 5 do not, all five on n19l6-19-U with one x-set {0x0A, 0x11, 0x25}
