    censored-slower by >= 50x on every (cell,label); gauss_elim is 4-7x SLOWER than
    default everywhere; U/S conflict ratios 3.6-11.4; null objects 20-114x more
    conflicts than structured U where they finish, all six n19l6 nulls censored at 180 s.
    Nothing is claimed about any curve. The producer made no interpretation.

  coordinator_prior:
    quoted_from_contract_before_run: >-
      EXP-ICPERF-66fd51 coordinator_prior, written before execution: "P1 holds ... P2
      holds against Macaulay2 on n15l5 by two to four orders of magnitude ... Singular
      likely times out everywhere ... P3a holds by construction ... P3b holds by orders
      of magnitude ... P4 holds where resolvable (smoke: -x slowed every instance 3-7x)
      ... P5's SAT clause ... may FAIL on n17 ... P6 holds by a wide margin ... The
      Coordinator expects symmetry breaking (-b) to cut conflicts 5-6x."
    scored_against_the_run_by_the_coordinator_before_review: >-
      P1 FAILED where the Coordinator expected it to hold -- the one prediction it was
      most confident of. P2 asserts nothing anywhere, not because Macaulay2 timed out
      as predicted but because it aborted in 1-16 s with bad_alloc, which the prior did
      not anticipate. P3a, P3b, P4 held as predicted; P5 held on n17 (ratio 6.69, not
      the feared 2.4); P6 held where it could be evaluated and is null on n19l6. The
      -b expectation: symmetry cut wall time about 2x and conflicts about 2.5x (n15l5 S:
      3350 vs 8542), NOT 5-6x. Two of the Coordinator's confident expectations were
      wrong (P1, -b factor) and one mechanism was wrong (M2 failure mode). This is
      written down so the reviewer's findings are scored against it.
    on_V1_the_P1_failure:
      expectation: >-
        I EXPECT THE FIVE SAT ANSWERS TO BE GENUINE ROOTS OF THE SHIPPED SYSTEM AND
        NOT DECOMPOSITIONS ON E, i.e. neither an encoding defect nor a decoder defect
        but a TWIST decomposition made possible by how the upstream generator labels
        instances. Reasoning, from find_points.sage read after the run: an S instance
        is built from three points ON E with x in the l-dimensional subspace V and
        x_R = x(P1+P2+P3); a "U" instance takes x_R UNIFORMLY AT RANDOM in F_{2^n}
        and is labelled U with no check -- the README says only that "at least nb
        instances have at least one solution". The Weil-descended system encodes
        S_4(x1,x2,x3,x_R) = 0 with x_i in V and nothing else; S_4 vanishes on
        x-coordinates of points over the algebraic closure, so a root with all three
        x_i twist x-coordinates (Tr(x_i + a + 1/x_i^2) = 1 on y^2 + xy = x^3 + x^2 + 1)
        and x_R a twist x-coordinate is a solution the solver is entitled to find and
        the curve-membership decoder is entitled to reject. Under this reading a random
        x_R is decomposable with probability roughly 2^{3l-3}/(6 * 2^{n-1}), i.e. about
        4% (n15l5), 8% (n17l6), 2% (n19l6): ~1.4 satisfiable "U" instances expected in
        30; one observed. Two independent engines returning the same x-set on the
        upstream .anf makes an encoding defect in the local CNF-XOR conversion
        unlikely (WDSat read the upstream file); a decoder defect is possible but the
        same decoder passed 200 answers and 30 certificates.
      what_would_change_my_mind: >-
        S_4 evaluated at (0x0A, 0x11, 0x25, x_R) over F_{2^19} with the shipped modulus
        NOT zero (then the ANF or its reading is wrong, and V3 must find where); or
        x_R of n19l6-19-U having trace 0 (an x-coordinate ON E), in which case the
        twist reading is wrong and the decoder is the suspect; or the bit-order
        convention between assignment string, x_bits and the 0x14/0x22 readout being
        inconsistent, in which case the decoder rejected the wrong element.
    on_V2_the_groebner_column:
      expectation: >-
        I EXPECT THE MACAULAY2 ABORT TO BE AN ADDRESS-SPACE-LIMIT ARTIFACT, NOT MEMORY
        EXHAUSTION. RLIMIT_AS 6 GB caps virtual address space; Macaulay2's GC reserves
        far more address space than it touches, and every row died within 0.9-15.7 s
        at 2.6 GB RSS -- the smoke run (no rlimit) finished n15l5 instances in ~50 s. If
        so, P2 is unmeasured for a fixable infrastructure reason (AGENTS.md rule 3:
        never negative evidence) and the successor run must replace RLIMIT_AS with an
        RSS watchdog. I expect Singular std to be genuinely uncompetitive at 900 s on
        n15l5 (it is the wrong algorithm for Boolean systems) and that to be a real
        observation, not an artifact.
      what_would_change_my_mind: >-
        Macaulay2 on n15l5-1-S without RLIMIT_AS, under a wall timeout and an RSS
        monitor, exceeding 6 GB RSS or failing the same way -- then the memory model
        is the problem, not the limit.
    on_V3_summary_arithmetic:
      expectation: >-
        I EXPECT THE MEDIANS TO REPRODUCE AND TWO DEFECTS IN summary.py TO BE
        CONFIRMED. (1) The four P3 `cms_pure_cnf_over_wdsat` entries carry the
        identical value 83.50030889840438 across n17l6/S, n17l6/U, n19l6/S, n19l6/U --
        one number cannot be four independent ratios; I expect a cell-indexing bug in
        the P3c reduction and that the corrected per-cell ratios are STILL all >= 10
        (from the table: 3.02/0.29 = 10.4 at n17l6/S is the tight one). (2) The P3b
        `default_wall_s` comparators (n19l6/S 0.0651, n17l6/S 0.116) differ from the
        all-10-instance defaults (0.3162, 0.2909); I expect they are medians over the
        same 5-instance subset noncore_first ran on -- legitimate if so, a bug if not
        -- and I want the reviewer to say which.
      what_would_change_my_mind: >-
        A corrected P3c ratio under 10 on any cell; a P3b comparator that is not the
        matched subset; any median off by more than the last printed digit.
    on_V4_null_objects_and_censoring:
      expectation: >-
        I EXPECT THE NULL OBJECTS TO BE SHAPE-MATCHED AND P6 TO BE OVERSTATED BY ITS
        AGGREGATION. All six n19l6 nulls timed out at 180 s, so the n19l6 ratio is
        null; summary.json still reports P6 `holds: true`. A prediction "on every cell"
        that is unevaluable on one cell holds on two cells and is null on the third; I
        expect the reviewer to say the aggregation rule (any-null-ignored) is wrong for
        an "every cell" claim. I also expect the reviewer to check that a timeout at
        180 s is at least 180/2.35 = 77x the structured U median wall on n19l6, so the
        censored reading supports the direction even where the conflict ratio is null.
      what_would_change_my_mind: >-
        A null object whose monomial-degree profile or variable count differs from its
        template; a finishing null with fewer conflicts than its structured U.
    on_V5_timing_integrity:
      expectation: >-
        I EXPECT THE MEASURED ROWS TO BE CLEAN AND THE HOST-WALL FIGURES TO BE
        CONTAMINATED. Two VM suspensions (44046 s, 59101 s) fall between rows; every
        row's wall_s is within 2 s of 2 x cpu_s. 125 rows launched at loadavg > 2,
        82 of them in phase D (the pure-CNF phase P3c depends on) and 31 of 32 in
        phase C. I expect medians recomputed EXCLUDING high-load rows to move P3c and
        P4 by less than 20% and to flip nothing, because the engines are single-threaded
        and the machine had 4 cores at load ~2-4.5; but this is exactly the kind of
        thing that is assumed rather than checked, so check it.
      what_would_change_my_mind: >-
        A P3c or P4 cell whose median changes by more than 2x when high-load rows are
        excluded; a row whose wall_s exceeds its timeout by more than 1 s.
    what_i_expect_the_composition_to_be: >-
      H-ICPERF-cc4847 WEAKENED ON P1 AS WORDED and the instrument REPAIRED rather than
      discarded: P1's "every SAT answer is a valid decomposition" is false as stated
      because the upstream U label is a random target, not a certified-unsatisfiable
      system, and because the descended system admits twist roots; the correct
      instrument statement is "every SAT answer is a root of the shipped system and
      is classified E-decomposition / twist-decomposition / spurious", with the twist
      fraction itself a measured quantity that belongs in the relation-yield column of
      the boundary table. P2 INCONCLUSIVE (infrastructure). P3-P6 SUPPORTED at toy
      scale on this host with P6 scoped to n15l5 and n17l6. Successor: an ICPERF row
      with the RLIMIT_AS replaced by an RSS watchdog, a Boolean Groebner engine
      (BRiAl) added, and twist classification in the verifier. I expect the honest
      headline to be that the benchmark's own labelling procedure, read at source,
      makes "U" mean "random", and one of thirty random targets was decomposable.

  joints:
    - joint: >-
        V1 -- CERTIFICATES AND THE P1 FAILURE, BLIND. That the 30 shipped certificates
        verify under the reviewer's OWN GF(2^n) and curve arithmetic written without
        reading binec.py; that the five unverified SAT answers are classified as one
        of (a) not a root of the shipped ANF (encoding/reading defect), (b) a root
        whose x_i are all on E (decoder defect), (c) a root whose x_i are twist
        x-coordinates with x_R a twist x-coordinate (twist decomposition; label is
        "random", not "unsatisfiable"), (d) something else, with the arithmetic shown.
      assigned_to: TASK-20260913-6c5729
      attack_plan: >-
        (1) BEFORE opening code/binec.py or code/convert.py: implement GF(2^19) with
        the shipped modulus (INFOn19l6-19-U.dimacs line 2; F_2 coefficient string) and
        GF(2^15), GF(2^17) likewise from the INFO files; implement the curve test "x
        is an x-coordinate of E: y^2 + xy = x^3 + x^2 + 1" by solving the quadratic or
        by the trace criterion Tr(x + 1 + 1/x^2) = 0; implement point addition on E
        and verify all 30 shipped certificates (x1,x2,x3 from the INFO file; check
        x(P1+P2+P3) = x_R for SOME choice of the two y's per x -- state how many sign
        choices you tried). (2) Parse Xn19l6-19-U.anf yourself (WDSat ANF format;
        inputs/TRIMOSKA-WDSAT-2024 documents it) and EVALUATE every equation at the
        WDSat assignment string from results.jsonl (row wdsat/default/n19l6-19-U,
        field `assignment`); report the number of unsatisfied equations. Do the same
        for the CryptoMiniSat row's model if recorded. (3) Decode the first 3*l bits
        under BOTH bit-order conventions (little-endian per the generator's
        `coefficients(sparse=False)` and big-endian) and evaluate the summation
        polynomial f3 from find_points.sage lines 36-38 at (x1,x2,x3,x_R) over
        GF(2^19); report which convention gives f3 = 0. (4) Compute Tr(x + 1 + 1/x^2)
        for x in the decoded set and for x_R of n19l6-19-U; report the four values.
        (5) Only then open binec.py and state whether its decoder convention matches
        the one under which f3 = 0. (6) Classify (a)-(d).
      breaking_artifact: >-
        A shipped certificate that fails your arithmetic; f3 nonzero under both
        conventions (then the ANF is not S_4 restricted to V, or the reading is
        wrong); a decoded x with trace 0 rejected by the decoder.
      holding_artifact: >-
        Your GF(2^n) code, the 30-row certificate table, the per-equation
        satisfaction count for the assignment, the two-convention f3 table, the four
        traces, and the (a)-(d) classification with one sentence of argument.
    - joint: >-
        V2 -- ROW RE-RUNS AND THE GROEBNER COLUMN. That WDSat default reproduces its
        status and conflict count on one S and one U row per cell from the committed
        build sources; that the Macaulay2 bad_alloc is classified as
        address-space-limit artifact or genuine memory exhaustion; that Singular's
        timeout is a real observation.
      assigned_to: TASK-20260913-6c5729
      attack_plan: >-
        (1) Rebuild WDSat from builds/wdsat_<hash>/src with config_used.json for two
        instances (the build hash is on each row) and re-run default on n15l5-1-S,
        n15l5-11-U, n19l6-1-S, n19l6-11-U; compare status and `conflicts` exactly
        (WDSat is deterministic). (2) Run Macaulay2 on scripts/n15l5-1-S.m2 (a) under
        RLIMIT_AS 6 GB as bench.py did and (b) with NO RLIMIT_AS but a 600 s wall
        timeout and /usr/bin/time -v or a polling RSS monitor; report exit status,
        wall, peak RSS in both. If (b) finishes, report the M2 wall and whether the
        result is the unit ideal or a zero-dimensional basis, and the WDSat/M2 wall
        ratio for that instance -- ONE instance, labelled as a re-run, never a
        replacement of P2's cell medians. (3) Confirm Singular's version (the probe
        timed out) and that scripts/n15l5-1-S.sing uses std over GF(2) with field
        equations as the contract says; do not re-run for 900 s unless (2b) suggests
        the limit was the cause.
      breaking_artifact: >-
        A WDSat re-run with a different status or conflict count; Macaulay2 failing
        identically without RLIMIT_AS at < 6 GB RSS (then bad_alloc is not the limit).
      holding_artifact: >-
        The four re-run rows side by side with the originals; the two Macaulay2
        executions with exit status, wall and peak RSS; the classification.
    - joint: >-
        V3 -- SUMMARY ARITHMETIC. That every per-cell median and every P1-P6 value in
        summary.json recomputes from results.jsonl under the reviewer's own reduction
        written before reading summary.py; that the two anomalies the task report
        lists (identical 83.5003 across four P3c cells; P3b comparator values) are
        explained as bug or as matched-subset.
      assigned_to: TASK-20260913-6c5729
      attack_plan: >-
        (1) From results.jsonl and the contract's metric definitions ONLY, compute
        per (cell, label, engine, config) the median wall_s and median conflicts over
        rows with status in {SAT, UNSAT}, and evaluate P1-P6 as the hypothesis words
