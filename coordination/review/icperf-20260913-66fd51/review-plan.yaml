  proves_too_much:
    required: true
    objects:
      - owner: TASK-20260913-6c5729
        object: >-
          The reviewer's own certificate checker (V1) applied to KNOWN-FALSE inputs:
          each of the 30 shipped certificates with one bit of x1 flipped (30 objects),
          and the five n19l6-19-U x-sets with x_R replaced by the x_R of n19l6-1-S. The
          checker must REJECT all 35. Additionally the summation polynomial f3
          evaluated at each shipped certificate (must be 0, 30/30) and at each
          bit-flipped certificate (must be nonzero in at least 29/30 -- report the
          exact count and any zero).
        why_this_object: >-
          V1's conclusion rests on a checker that accepts 200 answers and rejects 5.
          A checker that also accepts perturbed certificates has found nothing; a
          polynomial evaluator that returns 0 on perturbed inputs is reading the wrong
          bits. Controls-before-belief applied to the instrument that produced the
          P1 verdict.
      - owner: TASK-20260913-6c5729
        object: >-
          The P6 argument ("solver speed is a property of descended structure")
          applied to a RELABELLED structured instance: take Xn15l5-11-U.anf, apply a
          random permutation to its variable indices (a bijection; preserves the
          system exactly), run WDSat default. If P6's structure reading is right, the
          conflict count must be of the structured order (~3e4), NOT the null order
          (~3.5e6). If it comes out at null order, WDSat's speed is a property of the
          VARIABLE ORDER the generator emits and P6's null comparison measured that
          order, not structure.
        why_this_object: >-
          P3b already shows the variable order carries a >= 50x effect. A null object
          differs from a structured one in BOTH content and (implicitly) order. The
          relabelled instance separates the two. This is the known-false object for
          P6's mechanism claim: an argument that calls it "structure" must survive an
          object with identical structure and scrambled labels -- and if it does not,
          the honest statement is that P3b and P6 measure one mechanism, not two.
    failure_signature: >-
      Any perturbed certificate accepted; f3 = 0 on more than one perturbed input; a
      relabelled n15l5-11-U at null-order conflicts (> 10x its structured count).
    what_a_failure_means: >-
      Object 1: the P1 verdict is uninterpretable until the checker is fixed; V1 is
      INCONCLUSIVE. Object 2: P6 as a structure claim is not supported by this
      design; the evidence record records P6 as "null objects are slower" without the
      mechanism reading, and P3b/P6 are merged into one finding about variable order.
    assigned_to: TASK-20260913-6c5729

