review_plan_addendum:
  id: REVIEW-ICPERF-20260913-66fd51-ADD-V6
  extends: coordination/review/icperf-20260913-66fd51/review-plan.yaml
  round_id: REVIEW-ICPERF-20260913-66fd51
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-51e2aa
  written_by: coordinator
  written_at: '2026-09-15T12:30Z'
  additive_only: true
  additive_only_note: >-
    This file ADDS one joint and two disclosures to the round. It changes no
    existing joint, no existing prior, and no assignment. The plan it extends is
    committed and is not edited; a reader takes the union of the two files, in
    the order plan then addendum.

  written_before_any_reviewer_ran: true
  written_before_any_reviewer_ran_evidence: >-
    No report.md and no attestation.yaml exists under
    coordination/review/icperf-20260913-66fd51/ at the time of writing (the
    directory holds only the plan and the stale scratch described in
    disclosure D-1). The task that owns every joint, TASK-20260913-6c5729, is
    `queued` in the dispatch queue with no live claim: its first claim expired
    unreleased when the session holding it terminated. So the prior below is
    still a prior in the sense the contract means -- it is recorded before any
    verdict on it exists.

  why_this_addendum_exists: >-
    The ideation task TASK-20260915-5ba08b, run after the plan was written,
    reported as a proposal-level observation (IDEA-20260915-8fe0ef) that the
    benchmark curve is defined over F_2 and is therefore a KOBLITZ curve, so the
    negation-only Pollard rho baseline that RUN-ICPERF-305ca3 compares its SAT
    column against is too generous to index calculus by a factor sqrt(2n). The
    plan as written has no joint that reads the baseline column at all: V1-V5
    check the certificates, the row re-runs, the summary arithmetic, the null
    shapes and the timing, i.e. everything about the MEASURED side and nothing
    about the thing measured against. A round that passed all five would certify
    a boundary table whose comparator may be wrong by more than half an order of
    magnitude, and it would do so with every joint held. That gap is the reason
    this joint exists, and it is cheap: the check is arithmetic plus one line of
    the generator.

  coordinator_prior_on_V6:
    recorded_before_the_joint_ran: true
    expectation: >-
      I EXPECT V6 TO HOLD AGAINST THE RUN, i.e. I expect the reviewer to find
      that the shipped curve IS Koblitz and that the run's generic baseline does
      NOT account for it. I am not neutral here and say so: I read
      inputs/TRIMOSKA-ECICB-2024/upstream/find_points.sage line 8 myself before
      writing this,
      `E = EllipticCurve(K,[1,1,0,0,1])`, whose five coefficients are all 0 or 1
      and hence lie in the prime field F_2 for every n, so E is the base change
      of a curve over F_2 and the 2-power Frobenius tau is an endomorphism of
      E(F_{2^n}). That is the definition of a Koblitz (anomalous binary) curve.
      What I have NOT checked, and what the joint must decide, is the size of
      the correction and whether it changes any comparison the run reports.
    what_would_change_my_mind: >-
      A reason the tau-classes are unusable at these parameters (e.g. the
      relevant subgroup order r makes the <tau,-1> orbit size smaller than 2n,
      or the shipped instances do not live in the large prime-order subgroup at
      all), or a demonstration that the run's baseline already carries the
      factor under a different name.
    what_I_do_NOT_claim: >-
      That the ideation record is right about the number. IDEA-20260915-8fe0ef
      says the correction is sqrt(2n) = 5.5x, 5.8x, 6.2x at n = 15, 17, 19,
      obtained as 0.886*sqrt(r) divided by sqrt(pi*r/(4n)). That is a proposal,
      unreviewed, written by a session with no compute budget; it is a POINTER to
      the check, never the result of it. The reviewer derives the factor itself.
    scope_warning: >-
      Whatever V6 finds says nothing about any curve's security and nothing about
      whether index calculus beats rho anywhere. A baseline that is 6x too
      generous to index calculus makes the run's SAT column look BETTER than it
      is, and the SAT column is exponentially dominated by rho at every shipped n
      either way. V6 is an instrument-integrity joint, not a claim.

  joints_added:
    - joint: >-
        V6 -- THE GENERIC BASELINE COLUMN. That the comparator RUN-ICPERF-305ca3
        measures its solver columns against is the right comparator for the curve
        the instances actually live on: (a) whether the shipped curve is defined
        over F_2 and hence Koblitz; (b) what generic-attack cost that implies at
        n = 15, 17, 19 for the subgroup the instances live in; (c) whether the
        run's reported baseline equals that cost, and if not, by what factor and
        in which direction; (d) whether any comparison, ratio, or verdict the run
        or its summary reports changes when the corrected baseline is
        substituted.
      assigned_to: TASK-20260913-6c5729
      owner_is_new: false
      owner_note: >-
        Assigned to the validator that already owns V1-V5. This keeps one owner
        per joint as the plan requires. It is a deliberate concentration and
        costs coverage: a single reviewer's blind spot now spans six joints
        rather than five. It is accepted because V6 shares V1's object (the
        curve and its arithmetic) and V3's method (recomputing a reported number
        from primary inputs), so splitting it out would duplicate that reader's
        setup for a joint whose whole cost is a page of arithmetic.
      attack_plan: >-
        (1) Read inputs/TRIMOSKA-ECICB-2024/upstream/find_points.sage and
        whatever the run's own inputs record as the curve. State the Weierstrass
        coefficients and say, with the reason, whether every coefficient lies in
        F_2. Do this from the generator and the shipped INFO*.dimacs headers, NOT
        from any ledger record, and NOT from IDEA-20260915-8fe0ef, which you
        should treat as an unverified pointer if you read it at all.
        (2) Compute #E(F_{2^n}) for n = 15, 17, 19 for this curve from the trace
        of Frobenius over F_2 (determine t by counting E(F_2) by hand: the five
        candidate points over F_2, then t = 2 + 1 - #E(F_2)), and iterate the
        recursion for #E(F_{2^n}). Report the factorisation, the largest prime
        factor r, and the cofactor h. Show the counts; a number without the
        recursion is not a check.
        (3) Derive, from the van Oorschot-Wiener statement in
        knowledge/literature/KN-LIT-73f7e1.md and inputs/VOW-1996-PCS/, the
        expected group operations for parallel collision search on this subgroup
        under three equivalence relations: none, negation only, and <tau,-1>.
        State each constant and where it comes from -- the sqrt(pi/2) in the
        VOW record is for the plain walk, and the reduction for a group of
        automorphisms of order k is a factor sqrt(k) in the expected number of
        steps under the standard heuristic that the walk on classes is random.
        Name that heuristic and say it is a heuristic.
        (4) Read what RUN-ICPERF-305ca3 actually reports as its baseline (the
        manifest, summary.json and task-report.md) and compare. Give the ratio,
        the direction, and say plainly which of the run's statements move and
        which do not. If none moves -- because every solver column is
        exponentially above every baseline variant at these n -- SAY SO; that is
        the most likely outcome and it is a holding verdict, not a failure to
        find something.
        (5) Nearby-object control: repeat (1)-(2) for a curve that is NOT over
        F_2 (any b with a coefficient outside F_2 at the same n). The tau
        argument must FAIL for it. An argument that also gives a Frobenius
        speedup on a non-Koblitz curve proves too much and is wrong somewhere.
      breaking_artifact: >-
        A coefficient outside F_2 (then the premise is false and V6 is settled
        against this addendum); a subgroup structure making the <tau,-1> orbit
        smaller than 2n; a demonstration that the run's baseline already carries
        the Frobenius factor; or, in the other direction, any reported comparison
        or verdict in the run that FLIPS under the corrected baseline -- which
        would make this an instrument defect in the run rather than a bookkeeping
        note.
      holding_artifact: >-
        The coefficient statement with its reason; the three #E(F_{2^n}) values
        with factorisations and the E(F_2) hand count they come from; the
        three-row baseline table (none / negation / <tau,-1>) with constants and
        the named heuristic; the ratio against what the run reports, with
        direction; the list of run statements that move and those that do not;
        the nearby-object control showing the argument fails off Koblitz.
      cost_note: >-
        Zero solver time. Point counting at n <= 19 is a recursion on integers.
        This joint must not launch a solver: a benchmark rerun of
        EXP-ICPERF-66fd51 is using this machine's CPUs, and a re-run that raises
        loadavg pollutes ITS timings, which is the defect the rerun exists to
        avoid.

  disclosures:
    - id: D-1
      subject: a first validator attempt terminated mid-round and left scratch on disk
      what_happened: >-
        A session holding TASK-20260913-6c5729 ran between about 09:16Z and
        09:33Z on 2026-09-15 and terminated with the VM before writing report.md
        or attestation.yaml. It left
        coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/scratch/
        containing its own GF(2^n) code (gf2n.py), a V1 checker (v1_check.py), a
        V3 differ (v3_diff.py), a measurement helper (runmeasure.py), captured
        solver output, and two WDSat build trees. Its claim expired unreleased.
      why_it_is_recorded_here: >-
        Because it bears on the round's independence and nobody would otherwise
        know. An unattested partial reviewer is not a reviewer: nothing in that
        directory has a verdict, a signature, or a statement of what it read, so
        none of it is a finding and none of it may be cited as one.
      coordinator_did_not_read_it: >-
        The Coordinator listed the file NAMES in that directory (to write this
        disclosure) and did not open any of their contents. This matters because
        the prior above would be worthless if it were written after reading a
        reviewer's working notes -- so it is stated plainly rather than left to
        be assumed.
      instruction_to_the_successor: >-
        You may reuse that scratch as your own working material -- it is your
        task's own directory and rebuilding two WDSat trees costs CPU this
        machine currently does not have spare. But you MUST declare in
        attestation.yaml.what_was_read exactly which of those files you read or
        reused, you must re-derive any number you report rather than copying it,
        and you may not treat any of it as an independent check. If reusing it
        would compromise a blind joint -- V1 requires your own GF(2^n)
        arithmetic written WITHOUT reading code/binec.py, and scratch/gf2n.py may
        already be exactly that or may be contaminated in a way you cannot see --
        prefer writing fresh and say that you did.
      what_this_asserts_about_the_science: nothing
    - id: D-2
      subject: >-
        the Coordinator has now read the U-label generator at source, which
        CONFIRMS the reading in V1's prior and settles none of V1's verdict
      what_was_read: >-
        inputs/TRIMOSKA-ECICB-2024/upstream/find_points.sage, lines 61-67 (the
        second loop): for each of nb_inst instances it draws n uniform random
        bits, joins them into strXr, and emits
        `./script_benchmarks.sh n l R strXr UNSAT U`. There is no root test, no
        decomposition test, and no unsatisfiability test anywhere in that loop --
        the string "UNSAT" is a literal argument, not a computed verdict.
      what_it_confirms: >-
        The plan's V1 prior read the "U" label as meaning "target drawn uniformly
        at random", not "certified to have no decomposition". That reading is now
        confirmed from the primary source rather than inferred: the label is a
        naming convention of the generator.
      what_it_does_NOT_settle: >-
        Everything V1 is actually for. The five SAT answers on n19l6-19-U still
        failed the run's E-membership decoder, so they are still either (a) twist
        decompositions the solver was entitled to find, (b) an encoding defect,
        (c) a decoder defect, or (d) genuinely spurious. A random target being
        allowed to be satisfiable explains why a "U" instance CAN be SAT; it does
        not explain why THIS answer does not decode onto E. The reviewer decides
        that, blind, and the Coordinator's having read the generator does not
        relieve it of the classification.
      provenance: >-
        internal, read at source by the coordinator session on 2026-09-15;
        verified_by coordinator (this addendum). Not a recalled citation.

  proves_too_much_control_for_V6: >-
    Covered inside V6 step (5) as the nearby-object control rather than as a
    separate block: the Frobenius argument is run against a curve for which its
    conclusion is known false (a curve with a coefficient outside F_2, where tau
    is not an endomorphism), and it must fail there. If the reviewer's derivation
    produces a sqrt(2n) speedup for such a curve too, the derivation is wrong and
    the joint fails regardless of what it found on the Koblitz side.

  blind_rederivation_unchanged: >-
    V6 adds no blind re-derivation and does not touch the one the plan declares.
    It is not blind: the reviewer is told the premise (coefficients in F_2) and
    asked to check it, which is the opposite of blind, and that is deliberate --
    a blind joint on a fact stated in one line of a generator would measure
    whether the reviewer found the line, not whether the line is true. The
    quantity that must NOT be taken from anyone else is the baseline number
    itself, and step (3) requires it be derived from the VOW source record.

  inference:
    policy_for_the_owner: review-adversarial
    reasoning_effort: null
    independent_session_required: true
    runtime_note: >-
      Under user instruction 2026-09-15 ("Use Claude") the owner is dispatched on
      a Claude model at the effort review-adversarial binds (xhigh). The runtime
      slug is a launching-session selection, not an orchestration/adapter
      resolution: model_verified stays false and the attestation records the slug
      the session self-reports.
    escalation: >-
      V6 does not raise the round's tier. If V6 broke in the direction that flips
      a reported verdict, the composition -- not this addendum -- decides whether
      the result needs review-breakthrough, and that would be a new round with
      its own plan.
