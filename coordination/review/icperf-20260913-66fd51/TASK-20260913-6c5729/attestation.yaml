    are infrastructure and budget outcomes. Under core rule 5 none of them is
    negative mathematical evidence and none is reported here as one.
  citation_provenance:
    - reference: van Oorschot and Wiener, Parallel Collision Search, eq. (5)
      via: knowledge/literature/KN-LIT-73f7e1.md
      provenance: kb
      note: >-
        That record is itself provenance: retrieved -- a coordinator session
        read inputs/VOW-1996-PCS at source on 2026-09-15. I read the record,
        not the paper, and took only the eq. (5) constant sqrt(pi/2) from it.
    - reference: Wiener-Zuccherato 1998 / Gallant-Lambert-Vanstone 2000 (the 0.886 negation constant)
      provenance: recalled
      note: >-
        Named by KN-LIT-73f7e1 as the origin of 0.886 = sqrt(pi/4); neither is
        opened by that record or by me. Under core rule 9 this is a pointer,
        never support. My negation-only and <tau,-1> rows are therefore the
        sqrt(k) heuristic applied to VOW's own constant, and I say so rather
        than citing a constant nobody here has read.
  heuristics_named:
    - id: HEUR-V6-RANDOM-CLASS-WALK
      statement: >-
        The walk induced on the orbit space of an automorphism group of order
        k is itself a random walk on a set of size r/k, so the birthday
        constant is unchanged and the expected step count scales as
        sqrt(r/k).
      status: heuristic, stated as such, not validated here
      known_imperfection: >-
        For the negation map the induced walk has short fruitless cycles that
        must be detected and escaped, at a cost this heuristic does not model.
      why_it_matters: >-
        Every reduced-baseline number in V6 rests on it. At n = 15 it is
        additionally meaningless in practice: r/(2n) = 211/30 is about seven
        equivalence classes, and a birthday constant on a seven-element set is
        arithmetic rather than a cost model.

  attested_at: '2026-09-15'
  attested_by: validator session, TASK-20260913-6c5729
