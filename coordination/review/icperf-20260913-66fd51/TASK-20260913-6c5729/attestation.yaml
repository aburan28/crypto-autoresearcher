  # ---- bounds ----------------------------------------------------------
  authority_note: >-
    This attestation changes no record's status, writes no evidence or
    decision record, promotes nothing, and commits nothing to git. It reports
    on five joints only. A whole-claim verdict is not offered and would not be
    mine to give: I cannot see V2 by construction, and the Coordinator
