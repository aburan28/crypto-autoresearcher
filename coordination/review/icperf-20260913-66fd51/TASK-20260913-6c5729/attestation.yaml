  verdict_notes:
    V1: >-
      30/30 shipped certificates verify under my own GF(2^n) and curve
      arithmetic, LSB-first, each matching on exactly 2 of the sign choices
      tried; 0/30 under MSB-first. The five unverified SAT answers on
      n19l6-19-U are (c) TWIST DECOMPOSITIONS, high confidence: f3 = 0,
      52/52 ANF equations satisfied, 2416/2416 CNF-XOR clauses satisfied,
      Tr(x+1+1/x^2) = 1 for all three x_i AND for x_R, and the decomposition
      closes on the twist for 2 of 8 sign choices. Exhaustive enumeration of
      V^3 on all 60 instances agrees with the run's SAT/UNSAT verdict 60/60
      and finds exactly one root for n19l6-19-U, the twist one -- so no
      E-decomposition of that target exists in V^3 and the solver could not
      have returned one. None of the Coordinator's three overturning
      conditions fired.
    V3: >-
      156/156 numeric per-cell values reproduce exactly. All three declared
      breaking artifacts are ABSENT: no median off by even the last digit,
      no corrected P3c ratio under 10 (10.396 / 34.472 / 67.460 / 83.500,
      tight cell n17l6/S), and the P3b comparator IS the matched 5-instance
      subset. What fails is the joint's "every P1-P6 value recomputes"
      clause: the four P3c entries are one value copied by a leaked loop
      variable at summary.py:131; P6.holds drops the unevaluable n19l6 cell
      from its conjunction; and P5.holds is computed over the SAT clause
      only, because the Groebner clause reads `engine_cpu_s`, a key present
      on 0 of 504 rows, and nothing records that it was skipped. NO P1-P6
      VERDICT CHANGES under any correction.
    V4: >-
      18/18 nulls match their template on variable count, equation count,
      total degree histogram excluding the constant, per-equation degree
      multiset excluding the constant, and variable support. 0/18 match on
      the number of constant terms, and all 18 differ in the same direction
      (mean constant fraction 0.510 for nulls against 0.823 for templates).
      The plan's breaking artifact is worded as "monomial-degree profile",
      which covers degree 0, so it fires -- weakly, and the run's own
      narrower `shape_matches_template` flag is correct by its own
      definition. The second breaking artifact does NOT fire: the minimum
      conflict count over all nine finished nulls is 34.6x (n15l5) and 16.0x
      (n17l6) its cell's structured-U median. P6 ratios reproduce (114.30,
      20.06, null) and also hold under pooled aggregation (117.21, 21.75).
      n19l6 censored wall bound 180/2.34705 = 76.69x, which supports P6's
      direction but does not evaluate P6, which is worded in conflicts; no
      timed-out null reports a conflict count.
    V5: >-
      Decisive number: across all 442 non-Macaulay2 rows, wall_s - cpu_s lies
      in [0.0003, 0.1695] seconds, and in [0.001, 0.1378] on the 94 high-load
      ones. No row lost measurable wall time to anything. Both unexplained
      idle periods (43866 s, 59032 s) fall BETWEEN rows and no row spans
      either. 0 of 21745 ordered row pairs are provably concurrent, so the
      schedule is sequential. 0 rows exceed timeout_s + 1 (largest overshoot
      0.0445 s). P4 moves at most 0.3% under high-load exclusion and no
      verdict flips. The P3c exclusion test is NOT EVALUABLE for want of a
      control group -- phase D is 82/90 high-load -- and the direct wall/cpu
      measurement answers the same question more tightly. The 32 Macaulay2
      rows ran at 1.27-2.74 CPU-seconds per wall-second, which is what raised
      the load average the exclusion test was built to control for.
    V6: >-
      All five Weierstrass coefficients of EllipticCurve(K,[1,1,0,0,1]) are 0
      or 1, so E is a base change from F_2 and tau is an endomorphism: the
      curve IS Koblitz. #E(F_2) = 2 by hand, t = 1; orders 32494 = 2*7*11*211,
      131174 = 2*65587, 525086 = 2*262543, each confirmed against an
      independent brute-force count over all 2^n x-values. tau acts with
      multiplicative order exactly n on each prime subgroup and -1 is not a
      power of it, so the <tau,-1> orbit is the full 2n; that breaking
      artifact does not fire. AND THE DECIDING FACT: RUN-ICPERF-305ca3
      reports NO generic baseline of any kind -- the frozen contract excludes
      a rho column at specification.yaml:151 -- so no comparison, ratio or
      verdict in the run moves. The addendum named this as a holding verdict
      and it is one. Two corrections for the composition: (i) against a
      NEGATION-ONLY baseline the factor is sqrt(n) = 3.87/4.12/4.36, not
      sqrt(2n) = 5.48/5.83/6.16, which is the factor against no equivalence
      at all; (ii) the addendum's premise that this run compares its SAT
      column against a rho baseline is false -- the correction applies to the
      future RQ-ICPERF-94c86e boundary table, not to this run. Nearby-object
      control passes: with a6 = a outside F_2, tau is not an endomorphism,
      the F_2 recursion gives the wrong count at all three n, and no speedup
      follows.

