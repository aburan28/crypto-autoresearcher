read_plan:
  id: REVIEW-SEMBIN-20260916-e0a0c1
  goal_id: GOAL-SEMBIN-fcb7a2
  batch_id: BATCH-e0a0c1
  opened_by: DEC-20260916-441cd5
  written_at: '2026-09-16T11:10:00Z'
  written_by: coordinator-sembin-e0a0c1

  what_kind_of_round_this_is: >-
    A SOURCE READ, not a review of a run: there is no run, no measurement and no
    artifact of this program under examination. Two frozen external papers are
    read against two questions the campaign has recorded as open dependencies.
    It is written as a review plan anyway, and BEFORE either reader is
    dispatched, for one reason: the last read this campaign ran on this same
    paper family OVERTURNED the Coordinator's reading of a proposition
    (CORR-20260916-96f47d), and it did so because the Coordinator's expectation
    was recorded first and the reader was blind from it. Recording the prior
    afterwards would have made that the cheaper finding "the reader agreed with
    what we thought", which is a different and much weaker result.

  why_this_round_can_change_a_claim: >-
    Neither answer can change DC-1 of DEC-20260916-88ac73 -- a Boolean-ring
    instrument still cannot refute Proposition 5 -- so this round cannot move
    EXP-SEMBIN-4fa22c's reachable target. What it CAN change is how conditional
    a confirmation from that experiment is. The experiment's central inference
    runs through Nagao 2015/984's Lemma 4 (d_F <= d'_F), which that paper
    ASSERTS WITHOUT PROOF, deriving it from its Lemma 3, which it attributes to
    [11] = Nagao 2013/549 and explicitly declines to reproduce ("Proof of this
    Lemma is complicated and not constructive", paper_fulltext.md :507). The
    program has separately verified by exhaustive two-polynomial search over F_2
    that the LITERAL form of Lemma 4 with the field equations OUTSIDE the system
    is FALSE. So the campaign's own instrument rests on a lemma whose only proof
    is in a paper this program had never opened until 2026-09-13, in a form
    nobody has checked against the statement that consumes it. That is what this
    round reads.

  # ---------------------------------------------------------------- the prior
  coordinator_prior:
    recorded_before_any_reader_ran: true
    how_it_was_formed: >-
      By the Coordinator opening inputs/NAGAO-2013-549/paper_fulltext.md and
      inputs/NAGAO-2015-984/paper_fulltext.md directly for roughly twenty
      minutes: enumerating the numbered statements of the 2013 paper with one
      regex, reading the quoted form of 2015/984's Lemma 3 at :467-476 and
      Lemma 4 at :510-515, reading 2013/549's Lemma 2 at :685-708 and the
      opening lines of its proof, and reading the definition of `local
      polynomial` at :180-190. NOT formed by reading either paper's Section 3
      or 4, and NOT formed by reading Semaev 2015/310 at all beyond confirming
      the file is frozen and its hash verifies. The Coordinator's reading of
      the mangled extraction is itself unreliable and is one of the things a
      reader may overturn.
    predictions:
      - id: P-1
        claim: >-
          2015/984's "Lemma 3 ([11])" corresponds to 2013/549's **LEMMA 2**
          (:685), NOT to that paper's own Lemma 3 (:1081), which is an unrelated
          weight-degree statement about monomials (deg(wd(m)) = sum wt(e_i)).
          A reader who greps for "Lemma 3" in the upstream paper and reports on
          what it finds there will report on the wrong statement.
        confidence: high
        falsified_if: >-
          the upstream statement corresponding to 2015/984's Lemma 3 is found
          elsewhere, is absent, or 2013/549's Lemma 3 does after all carry the
          field-equation degree-drop content.
      - id: P-2
        claim: >-
          The numbering mismatch in P-1 has a mundane explanation rather than
          being a miscitation: the served 2013/549 PDF is the LAST OF TWO
          REVISIONS, and its own abstract note (:87) records that Lemma 9 of the
          first version is false and that the content of Section 4 was deleted.
          Deleting content plausibly renumbered the lemmas, so "Lemma 3" may be
          correct for the version Nagao cited and unavailable to us.
        confidence: moderate
        falsified_if: >-
          the served text shows the numbering could not have shifted this way,
          or the first revision turns out to be retrievable and numbers it
          differently than this predicts. The Coordinator expects the reader to
          be UNABLE to check the first revision, since only the last is served,
          and expects that limit to be reported rather than papered over.
      - id: P-3
        claim: >-
          2015/984 dropped NO hypothesis when restating the lemma. `local
          polynomial` in 2013/549 (:180) names the ring F_p[{X_i,j}] as opposed
          to the global ring F_{p^n}[X_1..X_d]; it is not an extra restriction,
          so the restatement over F_p[X_1..X_N] is faithful in setting.
        confidence: moderate
        recorded_because_it_was_first_wrong: >-
          The Coordinator's FIRST reading was the opposite -- that Lemma 2's
          "local polynomials" was a hypothesis 2015/984 silently dropped, which
          would have been a serious finding. Reading the definition at :180
          refuted that within minutes. It is recorded because a prior that only
          lists the beliefs which survived the Coordinator's own checking
          overstates how well-calibrated the Coordinator was.
        falsified_if: >-
          locality carries any content beyond the ambient ring that the
          degree-drop bookkeeping uses.
      - id: P-4
        claim: >-
          THE LOAD-BEARING ONE. 2013/549's Lemma 2, as actually stated and
          proved there, licenses the degree-drop bookkeeping needed for
          d_F <= d'_F in the INSIDE form (d'_F taken of {f_1..f_M} UNION S_fe,
          which is how 2015/984's Lemma 4 is written), and does NOT license the
          outside form the program's counterexample already falsifies.
        confidence: low-to-moderate
        the_coordinator_would_rather_be_overturned_here: >-
          A reader who finds the upstream lemma insufficient for the inside form
          too -- or finds a gap in its induction -- produces the most valuable
          outcome available in this batch, because the campaign's contract
          records Lemma 4 as a DEPENDENCY and would have to record it as a
          weaker one. Confirmation leaves the campaign exactly where it is.
        falsified_if: >-
          the proof is incomplete, the statement is weaker than the consumer
          needs, or the inside/outside distinction turns out not to be the
          operative gap.
      - id: P-5
        claim: >-
          Semaev 2015/310's statement is stronger than his argument delivers,
          in the specific sense that the argument bounds the quantity at a
          fixed or typical instance while the statement quantifies over all
          instances.
        confidence: low
        note: >-
          The Coordinator has not read this paper and this prediction is close
          to a guess about a genre of gap. It is recorded at its real strength
          rather than omitted, because an unrecorded prior cannot be overturned.
      - id: P-6
        claim: >-
          At least one of the two reads will report "could not determine" on a
          formula that matters, because the 2013/549 extraction is materially
          worse than the 2015/984 one -- the draft typesets vectors as overset
          arrows and pdfminer emits them as separate lines, interleaving the
          Section 2-3 displays. The paper's own frozen note says so.
        confidence: high
        what_it_licenses: >-
          Nothing. It is not permission to stop at an unreadable formula: the
          extraction script is in the input directory and may be re-run with
          different LAParams into the reader's OWN task directory. What it
          licenses is reporting an honest failure instead of a confident
          misreading of mangled text.

  # ---------------------------------------------------------------- the joints
  joints:
    - id: J-1
      question: >-
        Does 2013/549 contain the statement 2015/984 quotes as its Lemma 3, and
        where exactly? Give the upstream number, its exact statement, and every
        hypothesis it carries.
      owner: TASK-20260916-9da6e0
      attack_plan: >-
        Enumerate every numbered statement in the served text and match on
        CONTENT rather than number. The Coordinator believes the match is
        Lemma 2 at :685-708. Check the definitions the statement depends on
        (`local polynomial` :180, S_fe :184-190) and state whether the
        restatement in 2015/984 :467-476 is faithful, weaker, or stronger.
    - id: J-2
      question: >-
        Is that statement PROVED in 2013/549, and is the proof complete on its
        own terms?
      owner: TASK-20260916-9da6e0
      attack_plan: >-
        Read the proof, which appears to run by induction on a measure psi
        under a fixed monomial order. Ask the questions an induction can fail:
        is the measure well-founded, is the base case present, does the
        inductive step preserve the degree bound it needs, and does it use any
        hypothesis the statement does not carry? "Cannot determine because the
        extraction destroys the displayed formulas" is an acceptable verdict if
        re-extraction also fails, and is preferable to a guess.
    - id: J-3
      question: >-
        Does the upstream statement support 2015/984's Lemma 4 in the INSIDE
        form (S_fe inside the fake system), which is the form the campaign's
        contract depends on?
      owner: TASK-20260916-9da6e0
      attack_plan: >-
        Write out what Lemma 4 needs, step by step, from the upstream lemma.
        The program's counterexample kills the OUTSIDE form; the question is
        whether the inside form goes through and what it costs. If it does,
        say exactly which upstream hypotheses it consumes, because the campaign
        must record them as its own dependencies. If it does not, that is the
        batch's headline.
    - id: J-4
      question: >-
        What does Semaev 2015/310's argument actually deliver, as against what
        his statement claims?
      owner: TASK-20260916-64a93b
      attack_plan: >-
        Identify the statement the campaign consumes, then read the argument
        for it and state the strongest claim the argument supports. Attend to
        quantifier order (all instances versus a typical one), to whether any
        step is asserted heuristically, and to whether the paper's own
        experiments are offered as support for a general claim.
    - id: J-5
      question: >-
        PROVES-TOO-MUCH CONTROL. Run whichever inference you have just endorsed
        against an object where its conclusion is KNOWN FALSE.
      owner: both readers, each on its own joints
      attack_plan: >-
        For J-3: the program's exhaustive counterexample says the OUTSIDE form
        is false over F_2. If your reconstruction of Lemma 4 from the upstream
        lemma also goes through with S_fe outside, your reconstruction is wrong
        somewhere, and finding where is more valuable than the reconstruction.
        For J-4: apply Semaev's argument to a parameter regime where the
        conclusion is known or believed false and report whether it still runs.
        An argument that survives its own known-false object has an unlocated
        error.

  blindness:
    within_this_round: >-
      TASK-20260916-9da6e0 and TASK-20260916-64a93b may not read each other's
      reports or task directories. They are dispatched in parallel and their
      joints are disjoint.
    blind_from_this_plan: true
    blind_from_note: >-
      NEITHER READER MAY READ THIS FILE. It states the Coordinator's expected
      answer to four of the five joints, including the exact upstream lemma
      number the Coordinator believes is the match. A reader who reads it is
      no longer testing anything. The readers' briefs restate the QUESTIONS
      without the predictions, and each reader attests to what it read.
    blind_from:
      - coordination/review/sembin-20260916-e0a0c1/read-plan.yaml
      - ledger/decisions/DEC-20260916-441cd5.yaml
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/opening-report.md
      - the sibling reader's task directory
    lifted_for: []
    known_leak_risk: >-
      DECLARED RATHER THAN DENIED, because this campaign has already paid once
      for a protective document that leaked the value it protected
      (CORR-20260916-292e53). The J-1 answer the Coordinator predicts is a
      LEMMA NUMBER in a public paper, not a measurement, and it is derivable in
      minutes by any reader who greps the source. So blindness here buys
      genuine independence on J-2, J-3 and J-4 and buys much less on J-1. That
      is stated up front rather than claimed as a clean blind.

  what_this_round_cannot_do:
    - It cannot refute Nagao's Proposition 5, or support any claim that it does.
    - >-
      It cannot promote or weaken H-SEMBIN-a7e721. No measurement exists and
      the hypothesis is about a measurable quantity.
    - >-
      It cannot discharge a completion criterion by itself. All four of this
      goal's criteria need a committed decision on the evidence of run records
      or a read record; a report is not a decision, and the ruling that
      composes these two reports is a separate task.
    - >-
      It cannot decide anything about the first revision of 2013/549, which is
      not served and is not in inputs/.

  composition:
    who: the Coordinator, in TASK-20260916-a8e5b5
    how: >-
      Each reader reports on ITS OWN joints. A blinded reader cannot see the
      other joints by construction, so a whole-round verdict from one of them
      would be an opinion formed from half the evidence. The Coordinator names
      every joint with its verdict, scores every prediction P-1..P-6 as
      confirmed, refuted or untested, and records DEC-20260916-441cd5's
      successor ruling. A refuted prior is recorded as prominently as a
      confirmed one.
    evidence_record: EV-SEMBIN-1ca3c8
    evidence_record_note: >-
      Reserved, not written. Whether this round produces an evidence record at
      all is the ruling's decision: these are reads of external sources rather
      than observations of an experiment, and the honest alternative is a
      decision citing the two reports directly. The identifier is reserved so
      the ruling does not have to mint one under time pressure, and it is
      recorded here as RESERVED so a later reader does not read its absence as
      a lost record.
