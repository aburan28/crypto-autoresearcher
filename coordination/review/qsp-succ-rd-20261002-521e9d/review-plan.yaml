      Every timing measurement of this round (producer relays, JRD2, JRD3)
      runs one measurement process at a time per card, under RLIMIT_AS = 8 GiB
      set inside the measured process, with a 3600-second watchdog per process
      (machine protection; expiry is an instrument condition, never a
      result), and records nproc and /proc/loadavg before and after each
      item. Contention from other lanes is recorded, never removed by
      discarding a measurement.

  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20261002-865f15 (PTM-RD1, PTM-RD2); TASK-20261002-820856 (PTM-RD3, PTM-RD4, PTM-RD5)
    objects:
      - id: PTM-RD1
        owner: TASK-20261002-865f15
        object: >-
          The round-1 constructed inputs of the JD1 report of
          TASK-20261002-3b6a02 (A8; B5, B7, B8 and the payload-skip case; path
          cases f to k; C6d; C8; C12c), fed to the revision's acceptance
          checks as worded.
        known_truth: >-
          Each input defeats the refused design (DEC-20261002-6e68d8 R-JD1). A
          revision whose checks still pass any of them has proved too much:
          the repair would be cosmetic.
      - id: PTM-RD2
        owner: TASK-20261002-865f15
        object: >-
          The bound closure (the eight files of
          experiments/EXP-QSP-70b731/implementation/ at the plan digests),
          read statically, never executed, fed through every acceptance check
          the revision states.
        known_truth: >-
          That closure is non-conformant: F-01, F-02, F-03, F-04 and F-06 of
          the archived validator report. A revision whose checks pass it on
          any of these has proved too much.
      - id: PTM-RD3
        owner: TASK-20261002-820856
        object: >-
          R-ROUTE-RULE as the revision applies it, on the bridge cell n' = 22
          at d = 3 (q = 5, r = 21; B = 729) and Band H n' = 66 at d = 7 (q = 1,
          r = 65; B = 49).
        known_truth: >-
          Derivation (A)'s polynomial has degree at most 729 and 49 there,
          trivially feasible. A table or amendment that routes either cell to
          anything but derivation (A) has proved too much.
      - id: PTM-RD4
        owner: TASK-20261002-820856
        object: >-
          Six I_direct-in-disguise routes on synthetic cells, fed through the
          revision's independence check (AC-7 or its successor) on WO-I-10's
          trace schema exactly as worded. D3a, repeated squaring modulo L with
          a squaring-named primitive. D3b, the product of a residue with
          itself followed by a reduction modulo L, under generic names. D3c,
          powers of S-BERL's own Frobenius matrix Q applied to X, then a gcd
          with L. D3d, D3b after copying the residue into a new object (or a
          slice, view, list or re-wrapped integer) so that the two operands
          are distinct objects of equal value. D3e, a route labelled
          derivation (A) that builds H and reduces it modulo L before its gcd
          (the refused design's F-1 collapse). D3f, X^(2^n) modulo L built by a
          windowed or table-driven exponentiation that never squares a single
          named residue (for example a precomputed table of X^(2^j) modulo L
          multiplied together).
        known_truth: >-
          Each computes I_direct's quantity with I_direct's modulus and final
          gcd (the specification's definition of I_direct; F-04; the refused
          design's own F-1 identity). An independence check that admits any of
          them has proved too much.
      - id: PTM-RD5
        owner: TASK-20261002-820856
        object: >-
          The legitimate routes, built from the revision's own definitions:
          S-BERL (including its Q - I construction and kernel elimination) and
          A-DENSE (including the n squarings modulo H and the gcd with
          Y^(2^n) - Y), on the same synthetic cells as PTM-RD4.
        known_truth: >-
          Round 1's red team found S-BERL algorithmically independent of
          I_direct (DEC-20261002-6e68d8 R-JD2, what holds), and A-DENSE is
          derivation (A) itself. A check that rejects either has proved too
          much in the other direction: it would make the instrument
          uncertifiable rather than independent.
    failure_signature: >-
      A correct revision keeps each known-false conclusion out of reach IN ITS
      CHECKS, not only in prose. PTM-RD1: every round-1 input fails its named
      check. PTM-RD2: the bound closure fails on at least F-01, F-02, F-04 and
      F-06. PTM-RD3: both cells route to derivation (A). PTM-RD4: all six
      disguises rejected on every synthetic row. PTM-RD5: both legitimate
      routes pass on every synthetic row, with no false flag.
    how_to_run_it: >-
      Static reading, rule traces and mock routes in your own scripts, on
      synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131} and n at most
      19. No instrument is run on any declared cell; nothing of the bound
      closure is executed or imported; no RUN id is minted. Everything goes
      in computations.json. A PTM that would need a run is recorded NOT
      PERFORMED with the reason.

