    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/qsp-succ-rd-20261002-521e9d/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-521e9d/reviews/TASK-20261002-865f15/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-521e9d/reviews/TASK-20261002-820856/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-521e9d/reviews/TASK-20261002-efd590/,
      run by the top-level session immediately before the composer's launch
      and pasted verbatim after its prompt; recorded in DEC-20261002-ff2bd5
      whatever it reports; the tool is never edited to pass. --blind-history
      is UNCHECKABLE (no protected-digest file), recorded as such, never as
      passed.
    custody_without_seal: >-
      No seal card. Before TASK-20261002-eced26 is launched, the top-level
      session computes sha256 of the six declared report files of this round
      and pastes them after the composer's prompt. The composer records them
      verbatim as its first act, before reading any report.
      TASK-20261002-ea2ed7 must reproduce all six; a mismatch voids the
      composition.
    discharge_check: >-
      The composer reads the revision's discharge table and checks that each
      of DR-1 to DR-14, D-1 to D-8, CC-1 to CC-5, CI-1 to CI-6, R-AMEND-SCOPE
      and R-ROUTE-RULE maps to a named clause that its owning joint's report
      (discharge_map) does not contradict. An item with no clause is a defect
      for K-design-revise.
    keys:
      K-design-accept: >-
        JRD1 and JRD2 hold; JRD3 agrees with the design within the tolerance
        (QR1 exact; the declared engine's rates within the factor; routes
        equal off the marginal band); every PTM meets its failure signature;
        no tripwire fired; the discharge check passes; and, if
        AMD-20261002-09957b.yaml exists, it lies inside R-AMEND-SCOPE at
        R-AMD-PATH-2's path and id and JRD2 holds on its necessity and its
        consequence statement. The composer rules DR-9. DEC-20261002-ff2bd5
        then accepts the design and, if the amendment exists, approves it as
        protocol version 2 under the AGENTS.md standing user authorization
        (approval asserts nothing about N_K(L), H-QSP-cd0c90 or any curve),
        and names as its first next action the dispatch of
        TASK-20261002-38ffea after TASK-20261002-ea2ed7 verifies. If no
        amendment was written, it returns AMD-20261002-09957b unused by name.
      K-design-revise: >-
        JRD1 or JRD2 breaks, a discharge item has no clause, or TQR-1
        (producer), TQR-2, TQR-3, TQR-4 or TQR-6 (producer) fired. Decision
        revise, each defect listed with its joint and breaking artifact; cards
        TASK-20261002-38ffea to TASK-20261002-fa1d96 are not dispatched;
        TASK-20261002-ea2ed7 closes the lane. STRUCTURAL DUTY: if a DR item
        breaks again in the class it was raised in, the composer states
        whether the remedy is local or structural and, if structural, names
        the structural remedy (for example a separate executor card for the
        rate table, or a new-record design) in its first next action rather
        than a same-form revision. The decision is a selection point
        (DEC-20261002-c01bb7 R-ORDER-6 (5)).
      K-indeterminate: >-
        JRD3 disagrees with the design beyond the tolerance on any QR1
        quantity, on a declared engine family's rate, or on a route verdict
        off the marginal band. Decision revise, naming the quantity and both
        implementations; neither side is preferred; as K-design-revise for
        the cards and the slot, with a replicated rate measurement in the
        first next action.
      K-new-record: >-
        A holding JRD2, or the design itself, shows that the replication
        cannot be performed under the frozen specification plus an amendment
        inside R-AMEND-SCOPE: (a) derivation (A) not implementable on the
        bridge or Band H as stated, or (b) by construction on synthetic
        cells, no acceptance check can both reject every disguise of PTM-RD4
        and pass PTM-RD5. Decision revise with that finding; cards 10 to 16
        not dispatched; the lane closes at TASK-20261002-ea2ed7; a new-record
        design batch with freshly minted ids is ranked at this selection point
        with its reason and cost.
      K-leak: >-
        The blind card reports a leak or a read outside its whitelist (TQR-1).
        The affected QR values are set aside; the keys are applied with them
        set aside; no acceptance resting on them; a replicated blind card in
        the first next action.
      K-infra: >-
        A reviewer could not run a joint (tool absent, environment failure,
        watchdog, a killed session not continued, TQR-6 on a reviewer). That
        joint reads inconclusive. No acceptance while any joint is
        inconclusive; the composer names the re-dispatch. An infrastructure
        failure is never negative evidence.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    owner_reply_duty: >-
      The composer rules on any reply of coordinator-qsp-run-20260921 that
      DEC-20261002-c01bb7 R-QSP-RETURN routed to it (MSG ids in the queue's
      tasks_state_revisions), as a pointer.
    selection_point_duties: >-
      DEC-20261002-ff2bd5 frees no slot under K-design-accept (the lane
      continues into round 2). Under any other key it closes the lane and is a
      selection point: the slot goes to the head item of DEC-20261002-c01bb7
      R-ORDER-6 or any later standing order on origin/main at its launch,
      unless it records a new reason and the cost of deferring the head item.
      It re-carries DEC-20261002-e0aa2b NA-5 and NA-6 if it closes the lane
      (DEC-20261002-c01bb7 R-NA5-NA6). It names exactly one first next action.

  procedure_deviations:
    - id: PD-RD1
      severity: material
      what: The prior is informed, not blind (informed_prior_disclosure).
      consequence: >-
        Concurrence of JRD1 or JRD2 with the prior is weak corroboration; JRD3
        is the structurally blind check on the route quantities and rates.
    - id: PD-RD2
      severity: disclosed
      what: >-
        The object did not exist when this plan was written; it is bound by
        the producer snapshot. The amendment is conditional, so its path is
        added to the producer card's artifact_paths only if written (the
        queue's R-AMD-PATH note).
    - id: PD-RD3
      severity: disclosed
      what: >-
        No protected-digest file is written for this batch, so
        tools/check_review_independence.py --blind-history is uncheckable,
        never passed. Blindness from history and PR text rests on the blind
        card's constraints and a launch prompt that names only the card and
        the scratch path.
    - id: PD-RD4
      severity: disclosed
      what: >-
        Blindness is lifted for two reviewers for earlier-round verdicts of
        their inherited joints only (blindness.rationale). Their concurrence
        that a round-1 artifact is caught is informed by that artifact by
        design.
    - id: PD-RD5
      severity: disclosed
      what: >-
        This plan names likely break sites (operand provenance through copies,
        false flags on legitimate S-BERL, FFT exactness, new path forms,
        pre-payload failures) and the producer reads the plan. A producer that
        closes them before review makes the round less likely to break at the
        predicted sites; that is the purpose of a worked attack.
    - id: PD-RD6
      severity: disclosed
      what: >-
        Timing measurements of the producer (relayed by the session), JRD2 and
        JRD3 share one host with the other lanes of this goal. Contention is
        recorded per measurement (scratch.timing_rule) and can only lengthen a
        time; it is an instrument condition, never a mathematical result.
    - id: PD-RD7
      severity: disclosed
      what: >-
        This plan was written by a Coordinator subagent with no shell; no YAML
        parse or tools/check_review_independence.py run was made on it. The
        top-level session parses it before TASK-20261002-aa2b91.
  procedure_deviations_note: >-
    Seven at writing. Later departures are recorded in DEC-20261002-ff2bd5 or
    in an addendum, never absorbed.
