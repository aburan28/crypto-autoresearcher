  composition:
    who: >-
      The Coordinator, in TASK-20261002-eced26, a fresh session that did not
      run TASK-20261002-01d26d, did not author DEC-20261002-c01bb7 or this
      plan, is not a reviewer of this round, held no card of BATCH-4708f7, and
