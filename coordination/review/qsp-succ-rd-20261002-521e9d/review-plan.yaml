        the joint, and so does any threshold, horizon or cost formula other
        than the rule's. (ii) RE-MEASURE THE BOUNDARY. On the hardware you
        are given, time modular squarings and gcds on random operands at the
        degrees of the marginal and near-marginal rows, for every engine in
        the declared set and for any engine inside CI-5 the design excluded
        without a reason from the specification (numpy with its version
        recorded; standard-library decimal); verify products exactly; check
        FFT exactness at the largest degrees the design relies on (float64
        convolution rounding grows with length and coefficient size). A
        substituted row whose exhibited T_A on an engine of the declared set is
        at most 30 days, a derivation-(A) row whose T_A exceeds 270 days on
        every engine of the declared set, or a memory verdict contradicted by a
        measurement under RLIMIT_AS = 8 GiB breaks the joint; a difference
        inside the band is recorded, not a break. (iii) PTM-RD4 and PTM-RD5
        below, on the trace schema exactly as WO-I-10 words it, with mock
        routes on synthetic cells you choose (n outside {4, 7, 11, 12, 13, 31,
        131}, n at most 19). (iv) Diff AMD-20261002-09957b.yaml against the
        specification field by field; classify each change A1, A2, A3, a
        tightening, A1-consequential, or out of scope (TQR-2); read the
        consequence statement per composition depth (q + 1 in {2, 3, 4}) and
        say which depth has no exact declared reference; check the A1
        qualifier against the headline success-criterion sentence; check
        refused_predecessor and that amendment-v2.yaml is untouched. (v)
        DR-9: state which of the two readings (A1 change on a control cell, or
        a reading of C5's own text) the text supports and why; this is your
        recommendation, the composer rules. (vi) R-C6-DIAG, DR-11, CI-1, CI-3,
        CI-4, D-5 and Stage-1 route coverage as the plan's claim states them.
        WHERE I THINK IT BREAKS: (iii) at a copy that drops provenance, then
        (iii) at false flags on legitimate S-BERL, then (ii) at FFT exactness.
      breaking_artifact: >-
        A route differing from R-ROUTE-RULE applied to the design's own
        rates; a rate relay that does not reproduce or is not exact-verified;
        an engine excluded without a specification reason whose exhibited
        rates move a row outside the band; a disguise of PTM-RD4 admitted or a
        legitimate route of PTM-RD5 rejected; an independence text rule that
        legitimate S-BERL violates; an amendment change outside R-AMEND-SCOPE
        or at another path or id; a consequence statement that omits a depth
        or the headline-sentence binding; C6's diagnostic acting as a
        criterion; an I_indep read set that admits the bound closure or a
        blind_from path; a Stage-1 calibration that skips a census route; a
        D-5 order the stopping rules forbid; PTM-RD3 reaching its known-false
        conclusion.
    - joint: >-
        JRD3 -- BLIND RE-DERIVATION OF THE ROUTE QUANTITIES AND THE ENGINE
        RATES on the card of TASK-20261002-efd590 (QR0 to QR4), from their
        definitions alone.
      rd_items: []
      assigned_to: TASK-20261002-efd590
      attack_plan: >-
        Fixed on the card; the re-deriver reads no producer artifact, no
        round-1 file and no plan. The composer compares QR1 exactly with the
        design's quantities, QR2 and QR4 with the design's relayed rates for
        the engine families the design declares under the tolerance below, and
        QR3 with the design's route table.
      breaking_artifact: >-
        Any QR1 value differing from the design's; a rate of a declared engine
        family differing by more than the tolerance; a route assignment that
        differs on a row whose design T_A lies outside the marginal band
        (K-indeterminate).

