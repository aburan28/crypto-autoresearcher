      Q2 is l*, l' and a margin in bits.
      Q3 is |F_V|, f, the number of pi-orbits, and |F_V| divided by that number,
      on one explicit curve with V the trace-zero hyperplane.
    parameters: See blind-inputs.yaml.
    blind_from:
