  # ---------------------------------------------------------------------------
  # THE PRIOR. Recorded first, before any report returns.
  # ---------------------------------------------------------------------------
  coordinator_prior:
    what_i_expect_on_the_VALUES: >-
      J1, J2 and J6 HOLD on values. This is high confidence (at least 0.9 for
      each). Clauses (i) and (ii) are the normal basis theorem plus the
      factorisation of T^n - 1 over F_q. Clause (iii), for n prime, follows from
      pi^n = id and Lagrange's theorem. I expect the blind re-derivation to agree
      exactly on every Q1 spectrum and count, on every Q2 l* and l' and to 0.01
      bit on every margin, and exactly on every Q3 count.
    what_i_expect_the_REVIEW_to_find: >-
      Findings on FRAMING and CUSTODY, not on values.
      (a) J5, custody. The design, approval, execution and acceptance happened
      in one act. The producer card TASK-20260922-451b0e carries no archived_by
      and no review chain. Its reported phase times do not match the execution
      receipt's. So I expect J5 to find at least one of three things: that
      preregistration ordering cannot be shown from git; that more than one
      execution occurred; or that some EV number cannot be traced to an
      artifact. That is a process break, not a value break.
      (b) J2(ii). P4, "exact on every curve cell", is close to unfalsifiable for
      n prime. If f is read off the orbit partition, rather than computed
      independently as E(F_q) points inside F_V, the "exact prediction" is a
      consistency check on the implementation, not a test of a hypothesis that
      could have failed. That would weaken the strength_basis wording, not the
      values.
      (c) J3, scope. I expect DEC-20260922-5796b8's proposed KN-FIND sentence to
      break on scope, because it does not say "linear F_V". I expect the "if and
      only if" in clause (iv) to hold for net-LOSS verdicts, whose margins are
      tens of bits, and at zero-penalty win cells. It may be model-dependent at
      winning cells with a positive dimension penalty.
      (d) J4. The argument will NOT prove too much on the listed objects. The
      producer's own scoping (n odd prime, the F_V family) already excludes each
      of them, and the red team will be checking that the scoping is actually in
      the code and the records, not just in prose.
    where_i_think_it_breaks_if_it_breaks: >-
      J5(i) and J5(iii), then J3(iii). Not in the algebra.
    what_would_overturn_this_prior_most: >-
      (1) A J6 disagreement on any Q1 spectrum, which would localise to one of
      two implementations of an elementary computation. (2) A recomputed
      curve-cell orbit count that differs from the recorded one. (3) Evidence
      that the specification or trial plan changed after RUN-FROB-627924
      started. (4) A net win at n in {131, 163} under any cost model that
      charges a larger l' at least as much as a smaller one (that is T1).
      (1), (2) and (4) would be value breaks. (3) is a custody break severe
      enough to void "preregistered".
    a_prior_this_review_overturns_is_among_the_most_valuable_results_available: >-
      Stated so it is not a formality. The prior is informed (PD-R1). So
      concurrence from t3 and t4 is weak corroboration, and only J6, which is
      structurally blind, can confirm or overturn the values independently.

  # ---------------------------------------------------------------------------
  # JOINTS. Each has exactly ONE owner.
  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        J1 -- CLAUSES (i) AND (ii), AND P1. The stable-subspace spectrum and count
        per (q, n) are right. The four lattice methods A, B, C and O are
        independent in the sense EV-FROB-d336b0 claims ("share no step"). The
        non-semisimple cells (p | n) are handled correctly. The "faithful"
        predicate used for l' means what clause (ii) says.
      assigned_to: TASK-20260923-69e71b
      attack_plan: >-
        (i) Read impl/lattice.py, impl/orbits.py and impl/verify_field.py. Draw
        the call graph of methods A, B, C and O down to the field arithmetic.
        Name every helper two methods share: the Frobenius map, the stability
        test, row-echelon canonicalisation, field construction. For each pair,
        say whether its agreement is independent evidence or shared-code
        consistency. (ii) Method A is described as q-cyclotomic cosets, which
        presuppose gcd(q, n) = 1. Find what A does on (2,4), (2,6) and (3,3),
        where T^n - 1 is not squarefree. Recompute those three subspace counts
        with your own code. The count of monic divisors of prod f_i^{e_i} is
        prod (e_i + 1). (iii) Clause (ii): find the code's predicate for a
        faithful or useful V, and check that it is "sigma is not the identity on
        V". Wrong readings would be "V is not F_q", "1 not in V" or "dim V > 1".
        When q = 1 mod n, stable lines on which sigma acts by a non-trivial n-th
        root of unity exist. Name one such (q, n) the panel covers, and check
        how the predicate treats it. (iv) Recompute the spectrum and count
        yourself for at least three lattice cells, including one non-semisimple
        cell. WHERE I THINK IT BREAKS: (i), on the independence WORDING. I do
        not expect a value break.
      breaking_artifact: >-
        A recomputed count or spectrum that differs from the run; or a shared
        step that makes "four independent methods ... share no step" false; or a
        faithful predicate that differs from sigma acting non-trivially.
    - joint: >-
        J2 -- CLAUSE (iii), P3 AND P4: THE CURVE PANEL. F_V is pi-stable for
        sigma-stable V. Both controls genuinely fail. The measured orbit count
        equals f + (|F_V| - f)/n on every curve row. And that equality is a test
        that could have failed.
      assigned_to: TASK-20260923-69e71b
      attack_plan: >-
        (i) Cell count. H-FROB-6774fb test_boundary says "10 curve cells";
        EV-FROB-d336b0 says 14. The Coordinator's reading of trial-plan-v1.json
        and curve_panel.json: 10 (q, n, dim) cells, and 14 (cell, curve) rows,
        because some cells with q != 2 carry two curves and an ordinary curve
        over F_2 has only one j. Confirm or break that reading from the bytes.
        (ii) FALSIFIABILITY OF P4. For n prime, pi^n = id forces every orbit
        length to be 1 or n, so P4 reduces to "f equals the number of
        length-1 orbits". Find in impl/curve_panel.py and impl/orbits.py how f
        (`fixed_points`) is computed. It might be computed INDEPENDENTLY, by
        enumerating x in F_q inside V and solving the curve equation over F_q.
        Or it might be read off the orbit partition, or computed from anything
        downstream of it. If the latter, P4 is an identity of the
        implementation, and "exact on every cell" is consistency, not
        confirmation. Say which it is. (iii) Controls. The null curve must lie
        over no proper subfield: for n prime, j not in F_q is enough. Check the
        test actually used. The random V' must be of equal dimension and must
        fail sigma-stability by a membership test. On rows where the control
        factor base has the same size as the stable one, check that the control
        fails pi-stability by membership, not by size. (iv) Recompute the row
        with the largest factor base end to end with your own code: field from
        its own modulus, curve from the recorded a-invariants, V, factor base,
        pi-orbits, f. Do the same for one row with q in {3, 4, 5}. (v) Rows whose
        factor base is tiny, or consists only of fixed points, carry no orbit
        content. Confirm the EV caveat covers them. Say whether any aggregate
        EV quotes silently counts them as support. WHERE I THINK IT BREAKS:
        (ii), as a finding on strength wording, not on values.
      breaking_artifact: >-
        A recomputed row that differs from curve_panel.json; a control that
        passes; or an f that is derived from the orbit partition, which makes
        P4 non-falsifiable as implemented.
    - joint: >-
        J5 -- PROVENANCE, PREREGISTRATION AND CUSTODY. The protocol preceded the
        run. Exactly one execution produced the committed package. Every number
        EV-FROB-d336b0 states traces to a committed artifact. The committed
        bytes are the ones this plan binds.
      assigned_to: TASK-20260923-69e71b
      attack_plan: >-
        (i) Use `git log --follow --format='%H %aI %cI %s'` on
        specification.yaml, trial-plan-v1.json, impl/, runs/RUN-FROB-627924/,
        EV-FROB-d336b0, H-FROB-6774fb and DEC-20260922-5796b8. Report the first
        commit adding each, and whether the protocol files were committed
        STRICTLY BEFORE execution-receipt.json `started_at`. If all were added
        in one commit, preregistration ordering CANNOT BE SHOWN from git; say so
        in those words, and do not infer the order from file content. (ii) Hash
        all 28 paths in object_under_review and compare them with this plan. Then
        compare with execution-receipt.json `source_sha256`, `trial_plan_sha256`
        and `raw_result_sha256`. impl/launch.py and impl/report.py are NOT in
        source_sha256: say whether either could change a reported number.
        (iii) EXPECTED RUN COUNT IS ONE. TASK-20260922-451b0e reports per-phase
        wall seconds and a total that differ from execution-receipt.json, and a
        third wall time in its budget_note. From the committed bytes (stdout.log,
        receipt, manifest, card), decide whether these describe one execution or
        more than one. If more than one, say whether any other execution's
        outputs exist anywhere in the tree, or were discarded. Discarding would
        be a core-rule-8 matter, not a formatting one. (iv) RAW/SUMMARY
        AGREEMENT. Trace every number in EV-FROB-d336b0 `observations` and
        `measurements` to raw-result.json, a checkpoint file or metrics.json.
        List any that cannot be traced, and any that are rounded differently in
        different places. (v) command.txt, environment.json and the receipt's
        interpreter against the specification's `interpreter: sage -python`,
        given that `sage` is not on PATH here. WHERE I THINK IT BREAKS: (i) and
        (iii).
      breaking_artifact: >-
        A protocol file first committed after, or in the same commit as, the run
        outputs, with no other ordering evidence; more than one execution with
        undisclosed outputs; a hash mismatch; or an EV number with no source
        artifact.
    - joint: >-
        J3 -- CLAUSE (iv) AND THE SCOPE OF WHAT MAY BE PROMOTED. The net-win
        inequality q^(l' - l*) < n correctly decides net win versus net loss,
        under the cost model H-FROB-6774fb declares. "Exactly n and never more"
        is true as scoped. No record, and no proposed KN-FIND wording, asserts
        more than the linear F_V family supports.
      assigned_to: TASK-20260923-33a48b
      attack_plan: >-
        (i) THE "IFF". Clause (iv) compares the orbit quotient with the
        factor-base inflation, "the SAME pipeline with and without the orbit
        quotient". But when l' > l*, the pipeline is not the same: each
        decomposition solves a Semaev system in m*l' descended unknowns rather
        than m*l*, with a different expected solution count and a different
        per-trial decomposition probability. Write the relation stage with the
        per-decomposition solving cost as an explicit symbol C(m, l). Decide for
        which (q, n, m) cells the verdict is independent of C. My expectation:
        every net-LOSS verdict survives any C that is non-decreasing in l,
        because the inequality then only understates the loss. Every
        zero-penalty win (l' = l*) survives trivially. Win cells with
        l* < l' and q^(l' - l*) < n depend on C. List those cells from
        target_table.json. (ii) "NEVER MORE". The class of a point under the
        group generated by pi and negation generically has size 2n, and further
        automorphisms exist at special j. Decide whether "the orbit gain is
        exactly n and never more" is true of the Frobenius factor alone, and
        whether any record or proposed wording lets it read as a bound on all
        symmetry gains. (iii) SCOPE ESCAPE.
        analysis/frobenius-orbit-ecc2k130/README.md Part C builds a NON-LINEAR,
        pi-stable orbit-union factor base at n = 131. Check whether
        EV-FROB-d336b0, H-FROB-6774fb, DEC-20260922-5796b8 or the KN-FIND
        sentence proposed in DEC-20260922-5796b8 next_actions asserts
        unavailability at n = 131 or 163 without the linear-F_V qualifier.
        Quote each offending sentence. Propose a scoped wording that the
        evidence supports. (iv) STRENGTH AND PROFILE HONESTY. Is the
        `strength_basis` of EV-FROB-d336b0 supported, given that the decisive
        clause is argued rather than measured at cryptographic n? Is
        `claim_kind: constant_factor` carried into every sentence that might be
        promoted? Do NOT re-run J2's falsifiability check; that joint is not
        yours. WHERE I THINK IT BREAKS: (iii), then (i) on the positive-penalty
        win cells.
      breaking_artifact: >-
        A cell whose verdict flips under a cost model the hypothesis's own
        assumptions admit; a sentence in a record or proposed wording that
        asserts unavailability or a gain bound outside the scoped family; or a
        strength_basis claim the artifacts do not support.
    - joint: >-
        J4 -- PROVES TOO MUCH. The argument and the pipeline must not deliver the
        claim's conclusions on objects for which those conclusions are KNOWN
        FALSE. This is a required control; see proves_too_much below.
      assigned_to: TASK-20260923-33a48b
      attack_plan: See proves_too_much.objects and failure_signature; they are stated there in full.
      breaking_artifact: >-
        A known-false object on which the code, a record, or the stated argument
        yields the claim's conclusion. Examples: exact equality in P4 at an even
        n; a coarse lattice where the full interval must appear; unavailability
        asserted for a pi-stable factor base that exists.
    - joint: >-
        J6 -- BLIND RE-DERIVATION of the load-bearing quantities. See
        blind_rederivation below.
      assigned_to: TASK-20260923-21ae7f
      attack_plan: See blind_rederivation. The whole point is that it is not told how.
      breaking_artifact: >-
        Any Q1, Q2 or Q3 value that differs from RUN-FROB-627924 beyond the
        stated tolerance. That localises the error to one of two named
        implementations.

  joint_ownership_note: >-
