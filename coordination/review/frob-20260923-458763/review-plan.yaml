      J3_or_J4_break_on_scope_or_wording: >-
        No status change. The KN-FIND is written with the scoped wording only,
        and an unscoped sentence in an existing record is superseded by
        correction before any citation.
      J4_proves_too_much_in_the_code: >-
        The clause whose implementation reaches a known-false conclusion is
