  # ---------------------------------------------------------------------------
  # REVIEW TIER.
  # ---------------------------------------------------------------------------
  tier:
    policy: review-adversarial
    reasoning_effort: xhigh (policy default)
    ruling: >-
      review-adversarial, NOT review-breakthrough, for four reasons. The claim is
      scoped to one factor-base family, the linear Gaudry/Diem F_V. It is labelled
      constant_factor rather than an exponent move (H-FROB-6774fb
      asymptotic_claim.claim_kind). Its mathematical core is classical module
      theory: the normal basis theorem turns stable subspaces into divisors of
      T^n - 1. And it contradicts no validated evidence record. AGENTS.md rule 12
      applies to a breakthrough, a closure result, or a contradiction of
      established evidence. This round does not start as any of the three, and
      the tripwires below say exactly when it would become one.
    tripwires:
      - id: T1
        fires_when: >-
          Any reviewer computes or finds, inside the linear F_V family, a pi-orbit
          gain greater than n for n an odd prime, or a net win at q = 2 with n in
          {131, 163} for some m in {2,3,4,5}. That contradicts accepted evidence
          EV-FROB-d336b0.
        effect: >-
          The reviewer finishes its report on the joint and flags T1. The
          composing Coordinator does NOT compose. The claim goes to a
          review-breakthrough round (validator-breakthrough /
          red-team-breakthrough at max) in independent sessions. Nothing is
          downgraded to keep the round moving.
      - id: T2
        fires_when: >-
          The composing decision would assert a closure wider than this evidence
          covers. That means any statement that Frobenius-orbit factor bases are
          unavailable, or never worth it, beyond the linear F_V family or beyond
          the (q, n, m) actually enumerated. It includes the unscoped KN-FIND
          wording DEC-20260922-5796b8 proposed, if adopted as written.
        effect: >-
          That wider statement needs review-breakthrough before any promotion.
          The scoped statement may still be composed here.
      - id: T3
        fires_when: Anything in the round is read as an exponent move on any ECDLP instance.
        effect: Stop, and route to review-breakthrough.
    tripwire_note: >-
      Pre-declared so that escalation is a rule applied, not a judgement made
      after reading the reports. validator-breakthrough and
      red-team-breakthrough exist on this runtime as sibling bindings at max
      effort (CLAUDE.md, model policy note). Served by inheritance, they are a
      backend substitution, recorded as fallback_used, and never a tier
      downgrade.

