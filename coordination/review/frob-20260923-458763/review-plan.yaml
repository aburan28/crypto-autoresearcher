        scope: the linear F_V family, the enumerated (q, n, m), and constant
        factor. That discharges FINDING-1. A KN-FIND is then REQUIRED
        (knowledge_promotion: support on strong evidence), with wording scoped
        as J3 establishes.
      J5_breaks_on_custody_or_ordering_only_values_hold_and_J6_agrees: >-
