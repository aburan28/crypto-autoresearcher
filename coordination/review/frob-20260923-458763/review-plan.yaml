  # ---------------------------------------------------------------------------
  # PROVES TOO MUCH.
  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20260923-33a48b
    objects:
      - id: PTM-1
        object: >-
          q = 1 mod n with n prime, for example (q, n) = (4, 3) or (8, 7). Here
          T^n - 1 splits into linear factors over F_q.
        known_truth: >-
          EVERY dimension 0..n is attainable, so l' = l* for every m, and the
          "coarse lattice" description must reduce to the full interval.
      - id: PTM-2
        object: >-
          EVEN n, for example q = 2 or 3 with n = 4 or 6, on an ordinary curve
          over F_q.
        known_truth: >-
          F_{q^2} lies inside F_{q^n}, so a point with x in F_q can have y in
          F_{q^2} \ F_q and a pi-orbit of length 2. The formula
          f + (|F_V| - f)/n is FALSE in general.
      - id: PTM-3
        object: >-
          COMPOSITE ODD n with V meeting a proper intermediate subfield, for
          example n = 9 or 15 with V containing F_{q^3}.
        known_truth: >-
          Orbits of intermediate length (3, or 5) exist, so "the gain is exactly
          n" is FALSE there.
      - id: PTM-4
        object: >-
          The null object. A curve over F_{q^n} lying over no proper subfield.
        known_truth: >-
          The q-power Frobenius is not an endomorphism, so there is no pi-action
          and no orbit gain at all.
      - id: PTM-5
        object: >-
          The non-linear orbit-union factor base at q = 2, n = 131, as
          constructed in analysis/frobenius-orbit-ecc2k130/README.md Part C.
        known_truth: >-
          A pi-stable factor base of index-calculus size EXISTS at n = 131.
          "Unavailable at n = 131" is therefore FALSE for it.
      - id: PTM-6
        object: >-
          The group generated by pi and negation acting on a generic factor base.
        known_truth: >-
          Classes of size 2n exist, so "never more than n" is FALSE as a
          statement about all symmetry gains.
    failure_signature: >-
      A correct argument restricts itself so that each object falls outside it,
      and the code enforces the restriction rather than only stating it:
      PTM-1: the pipeline reports the full interval and zero penalty for every m.
      PTM-2 and PTM-3: the code refuses or skips the P4 formula at even and
      composite n, rather than reporting exact equality. If the red team
      instantiates such a cell with the producer's functions and they return
      "prediction_exact: true", the implementation has proved too much.
      PTM-4: no orbit gain is reported.
      PTM-5 and PTM-6: no record or proposed wording asserts unavailability or
      a gain bound without the linear-F_V and pi-alone qualifiers.
    how_to_run_it: >-
      These are REVIEW COMPUTATIONS. They mint no RUN-*, write no evidence
      record, touch no deployed curve as an attack instance, and never re-run
      the EXP-FROB-ec08b5 driver as an experiment. Calling the producer's
      library functions on a known-false object, inside the reviewer's own
      script, is permitted and is the point. Put every script and output in
      computations.json. If a PTM needs something that would amount to a new
      experiment, record it NOT PERFORMED, with the reason.

