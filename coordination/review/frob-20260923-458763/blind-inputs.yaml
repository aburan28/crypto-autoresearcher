#
# This file gives DEFINITIONS AND PARAMETERS ONLY. It contains no computed
# value, no expected answer and no method. If you find a computed value of any
# quantity below in anything you were permitted to read, STOP and report a leak
# (BL-4 on your card).
# =============================================================================
blind_inputs:
  review_plan_id: REVIEW-FROB-20260923-458763
  task_id: TASK-20260923-21ae7f
  joint: J6

  read_scope_whitelist:
    - coordination/review/frob-20260923-458763/blind-inputs.yaml
    - AGENTS.md
    - agents/validator.md
    - templates/research-records.md
    - ledger/handoffs/TASK-20260923-21ae7f.yaml
  read_scope_note: >-
    Everything else in the repository is out of scope. In particular: any file
    under experiments/, analysis/, knowledge/, ledger/ (apart from your own
    handoff) or coordination/ (apart from this file); every commit message, so
    no git log, git show, git blame or git diff of any kind; and every pull
    request text. You may use any published mathematics you know or can
    retrieve from outside this repository. Cite it with provenance
    (recalled | retrieved), and never cite anything from this repository
    except the whitelist.

  conventions:
    field: >-
      F_{q^n} is the finite field with q^n elements. You choose its model, and
      you record the model you chose. No quantity below depends on that choice.
    sigma: >-
      sigma is the q-power Frobenius x -> x^q on F_{q^n}. It is F_q-linear.
    stable_subspace: >-
      An F_q-subspace V of F_{q^n} (viewed as an n-dimensional F_q-vector space)
      with sigma(V) contained in V. {0} and F_{q^n} itself count.
    faithful: >-
      A sigma-stable V is FAITHFUL if sigma restricted to V is NOT the identity
      map of V.

  # ---------------------------------------------------------------------------
  # Q1 -- the stable-subspace census.
  # ---------------------------------------------------------------------------
  Q1:
    for_each: "(q, n) in [(2,41), (2,43), (2,113), (2,127), (2,131), (2,163), (3,41), (4,41), (8,41)]"
    report:
      - count: the number of sigma-stable F_q-subspaces of F_{q^n}
      - dimensions: the sorted set of distinct F_q-dimensions that occur among them
      - d_min: the least dimension of a FAITHFUL sigma-stable subspace
    precision: exact integers

  # ---------------------------------------------------------------------------
  # Q2 -- the dimension penalty and margin.
  # ---------------------------------------------------------------------------
  Q2:
    for_each: "q = 2, n in [113, 127, 131, 163], m in [2, 3, 4, 5]"
    definitions:
      l_star: "l* = ceil(n / m)"
      l_prime: >-
        l' = the least dimension, among FAITHFUL sigma-stable subspaces, that is
        at least l*. Report `none` if no such subspace exists.
      penalty: "penalty = l' - l*"
      margin_bits: "margin = log2(n) - penalty * log2(q)"
      verdict: "`win` if margin > 0, otherwise `loss`"
    report_per_cell: [n, m, l_star, l_prime, penalty, margin_bits, verdict]
    precision: >-
      l*, l' and penalty exact. margin to at least 10 significant digits, with
      the library and precision you used named.

  # ---------------------------------------------------------------------------
  # Q3 -- an orbit count on one explicit curve.
  # ---------------------------------------------------------------------------
  Q3:
    curve: >-
      E : y^2 + x*y = x^3 + 1 over F_2, that is a-invariants
      [a1, a2, a3, a4, a6] = [1, 0, 0, 0, 1], taken over F_{2^n} in exactly
      this model. Do not change coordinates: the quantities depend on the
      x-coordinate of this model.
    for_each: "n in [7, 11, 13]"
    V: >-
      V = { x in F_{2^n} : Tr_{F_{2^n}/F_2}(x) = 0 }, the trace-zero hyperplane.
    factor_base: >-
      F_V = the set of AFFINE points P = (x, y) in E(F_{2^n}) with x in V. The
      point at infinity is not included.
    pi: "pi(x, y) = (x^2, y^2), acting on F_V"
    report_per_n:
      - F_V_size: "|F_V|"
      - f: the number of points of F_V whose coordinates both lie in F_2
      - orbits: the number of pi-orbits on F_V
      - orbit_length_histogram: "{length: number of orbits of that length}"
      - ratio: "|F_V| / orbits, as a decimal to at least 12 significant digits"
      - group_order: "#E(F_{2^n}) including the point at infinity, as a self-check you may report"
    precision: exact integers; ratio as stated

  # ---------------------------------------------------------------------------
  # What to hand back.
  # ---------------------------------------------------------------------------
  deliverables:
    - >-
      rederivation-report.yaml with one section each for Q1, Q2 and Q3: every
      value requested, the method you chose, and the libraries and versions you
      used. End it with the review_attestation block from
      templates/research-records.md, setting joints_owned [J6],
      read_sibling_reports false, and blind_from_respected explicitly.
    - >-
      computations.json with every script, command, library version and raw
      output you relied on, embedded as text.
  constraints_restated:
    - Report on J6 only. Do not guess what anyone else found, and do not compare with any other result.
    - ZERO experiment runs. This is an independent computation.
    - Write nothing outside coordination/goals/GOAL-FROB-6333a9/batches/BATCH-458763/reviews/TASK-20260923-21ae7f/.
