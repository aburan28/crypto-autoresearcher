blind_inputs:
  task_id: TASK-20260930-62364f
  review_plan_id: REVIEW-BINSTD-20260930-2ee1e1
  joint: J-BLIND
  batch_id: BATCH-2ee1e1
  object_version: 3
  amendment:
    path: coordination/review/binstd-20260930-2ee1e1/blind-inputs.amendment-A1.yaml
    rule: >-
      If this file exists when you start, read it: it is part of your inputs. It
      may add quantity definitions under Q4, refine Q3 cells, or remove whitelist
      entries. It never states a value. If it does not exist, Q4 is empty; state
      that as a result.
  sources:
    fips_binary_curves: >-
      inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md, with its
      source_record.yaml, for K-163, K-233, K-283, K-409 and K-571, and for the
      form of the Koblitz curve equation used in Q3.
    ecc2k_130_primary: >-
      inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md, with its
      source_record.yaml. The Certicom challenge publication is this row's
      primary source.
    ecc2k_130_cross_check: >-
      inputs/BAILEY-2009-541-ECC2K130/ecc-challenge-info-index.html and
      source_record.yaml, and inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md
      only if present. If absent you may retrieve Bailey et al. eprint 2009/541
      and cite provenance retrieved. A cross-check never replaces the primary.
    ansi_x962_c2pnb: >-
      Not in your whitelist. Retrieve published ANSI X9.62 curve parameters, or
      a primary standard that reproduces them verbatim, from outside the
      repository, with provenance retrieved. If unreachable, record NOT
      COMPUTED. Never use a secondary dump or recall.
  source_note: >-
    These sources, your own handoff card and amendment A1 (if present) are your
    ONLY sources. If one of them refers to a repository file outside this list,
    do NOT open it; record the reference under Q0.

  what_you_are_testing: >-
    Whether a six-value multiplicative-order census, eleven divisibility
    verdicts, a small table of toy Koblitz group orders and their
    factorisations, and any further quantity defined in amendment A1 are
    determined by elementary arithmetic and primary curve parameters. A second
    implementation, written by someone who shares nothing with you, will be
    compared with yours afterwards. This round carries the same Q1-Q3 as
    REVIEW-BINSTD-20260925-b67954 so the composer can check agreement on
    separable carried values from the "What holds" list.

  quantities:
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which your sources or definitions left you a choice.
        For each: quote the text, list the admissible readings, and say which
        quantities depend on it.
      report: A list. An empty list is a result and must be stated as such.
    Q1:
      name: multiplicative order of 2 modulo n
      n_values: [131, 163, 233, 283, 409, 571]
      definition: >-
        For each n, the least positive integer e with 2^e = 1 mod n. Also state
        whether n is prime.
      report: >-
        Per n: e, the factorisation of n - 1 you used, and a one-line check a
        reader can repeat.
      tolerance: exact
    Q2:
      name: k divides r - 1, at eleven standardized rows
      rows:
        - c2pnb176v1
        - c2pnb208w1
        - c2pnb272w1
        - c2pnb304w1
        - c2pnb368w1
        - ECC2K-130
        - K-163
        - K-233
        - K-283
        - K-409
        - K-571
      definition: >-
        For each row, let r be the prime order of the subgroup the standard's
        base point generates, read from the primary source. Let F_q be the
        smallest field over which the curve's equation is defined and F_(q^k)
        the field the curve is used over, so k is the order of the q-power
        Frobenius endomorphism. State whether k divides r - 1.
      report: >-
        Per row: source, r in decimal and bit length, extension degree m,
        smallest field of definition, k, and verdict TRUE, FALSE or NOT
        COMPUTED with reason.
      tolerance: exact
      primary_sourced_subset_note: >-
        The six FIPS/Certicom rows (ECC2K-130, K-163, K-233, K-283, K-409,
        K-571) are the primary-sourced rows the "What holds" list and RD-4
        refer to. c2pnb rows may be NOT COMPUTED if the primary is unreachable.
    Q3:
      name: toy Koblitz group orders at the positive-arm cells
      cells: >-
        n in [17, 23, 31, 41] and a in [0, 1], eight cells, plus any cell
        amendment A1 adds.
      definition: >-
        For each cell, E_a is the Koblitz curve with parameter a in the form
        FIPS 186-4 gives for Koblitz curves. Compute #E_a(F_(2^n)) and its
        complete factorisation.
      report: Per cell: group_order, factorisation, method.
      tolerance: exact
    Q4:
      name: newly frozen values (amendment-defined only)
      definition: >-
        Empty unless amendment A1 adds value-free quantity definitions. Do not
        invent quantities from producer text (you must not read producer text).
      report: >-
        If A1 is absent: state Q4 empty. If present: compute each defined
        quantity and label NOT SEPARABLE any quantity whose definition is
        incomplete.

  whitelist:
    - ledger/handoffs/TASK-20260930-62364f.yaml
    - coordination/review/binstd-20260930-2ee1e1/blind-inputs.yaml
    - coordination/review/binstd-20260930-2ee1e1/blind-inputs.amendment-A1.yaml
    - inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md
    - inputs/FIPS186-4-BINARY-CURVES/source_record.yaml
    - inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md
    - inputs/CERTICOM-CHALLENGE-2009/source_record.yaml
    - inputs/BAILEY-2009-541-ECC2K130/ecc-challenge-info-index.html
    - inputs/BAILEY-2009-541-ECC2K130/source_record.yaml
    - inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md

  must_not_read_note: >-
    Do not read any path under experiments/EXP-BINSTD-178742/,
    ledger/hypotheses/H-BINSTD-ce4f38.yaml, any BATCH-2ee1e1 design/reviews/
    composition path, any BATCH-b67954 design/reviews path, or any composing
    decision. Attest blind_from_respected: true.

  report_paths:
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-2ee1e1/reviews/TASK-20260930-62364f/rederivation-report.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-2ee1e1/reviews/TASK-20260930-62364f/computations.json

  zero_runs: true
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT CONTACTED.
