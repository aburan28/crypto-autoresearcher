        effect: >-
          Stop and report. Composition is suspended until a dedicated
          review-breakthrough contradiction round is opened by a new
          Coordinator decision.
      - id: TA-3
        fires_when: >-
          The producer designed the prime-field engine cells (PTR-ICPERF), any
          run at deployed parameters, priced any m >= 4 budget against D1
          (CORR-20260928-4cb669), wrote the fixture or Stage 0 code as prose
