    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/binstd-a-20261001-35bdda/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-35bdda/reviews/TASK-20260929-7fb81e/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-35bdda/reviews/TASK-20260929-810095/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-361e02/reviews/TASK-20260929-739a0c/,
      run by the top-level session and recorded in DEC-20260929-54dcd8
      whatever it reports. If the tool refuses the carried report, its output
      is recorded and the composer applies K-carry-broken; the tool is never
      edited to pass. The --blind-history check is uncheckable (no
      protected-digest file) and is recorded as such (PD-R4).
    custody_without_seal: >-
      No seal card. Before TASK-20260929-99f171 is launched, the top-level
      session computes sha256 of the four declared report files of this round
      and of the two carried J5 files, and pastes them into the launch
      prompt. The composer records them verbatim as its first act, before
      reading any report, and checks that the two carried digests equal
      carried_from.files_sha256. TASK-20260929-a80339 must reproduce all six;
      a mismatch voids the composition.
    icperf_objection_check: >-
      DEC-20260929-1f5fcb NA-2 and DEC-20260928-63addc PTR-ICPERF. Before the
      composer is launched the session runs tools/agent_bus.py inbox --as
      coordinator and pastes any message from the GOAL-ICPERF-e6b6a4 owner
      referencing IDEA-20260926-20ba8f, PTR-ICPERF, EXP-BINSTD-532d7f,
      EXP-BINSTD-517186 or EXP-BINSTD-8cb697, or states there is none.
      K-approve requires that statement or a ruling on the objection inside
      the composing decision.
    discharge_check: >-
      The composer reads the audit sheet's revision discharge table and checks
      that each revision requirement of DEC-20260929-1f5fcb (R2-J3-1;
      R2-J3-2, R2-J3-3, R2-J3-4, R2-J2-1, R2-J4-1; R2-J3-5, R2-J3-6, R2-J3-7,
      R2-J4-2, R2-J4-3, R2-J1-1, R2-J1-2, R2-J1-3, R2-J2-2, R2-J2-3, R2-J2-4,
      R2-PROC-1) maps to a named clause that the owning joint's report does
      not contradict. An item with no clause is a missing approval field for
      K-revise-defect.
    keys:
      K-approve: >-
        J1 to J4 hold; J1's D-CARRY finds no uncovered difference; the
        carried J5 agrees with version 3's frozen figures within the agreement
        tolerance (after any stated constants_delta adjustment); every PTM
        meets its failure signature; no tripwire fired; every revision
        requirement is discharged (discharge_check); the ICPERF objection
        check is recorded with no unruled objection. DEC-20260929-54dcd8 then
        approves EXP-BINSTD-8cb697 under the AGENTS.md standing user
        authorization and names as its first next action the opening of an
        execution batch whose first card advances the approval and status
        fields of the version-3 records and records versions 1 and 2 as
        superseded. Approval asserts nothing about any curve's security, any
        oracle's cost, or index calculus against rho.
      K-revise-defect: >-
        Any of J1 to J4 breaks, a field approval requires is missing, a
        revision requirement is undischarged, or TA-3 fired. Decision revise,
        each defect listed with its joint and breaking artifact, and a
        revision design card in a new batch as the first next action.
      K-indeterminate: >-
        The carried J5 disagrees with version 3 beyond the tolerance on any
        quantity. Decision revise on C2, naming the quantity; neither
        implementation is preferred.
      K-carry-broken: >-
        J1's D-CARRY reports an uncovered difference, or the independence
        tool refuses the carried report. The carried J5 is not applicable to
        version 3. No approval in this round; decision revise, naming the
        difference, with a fresh blind card on the changed quantities as part
        of the first next action. Not a defect of the mathematics.
      K-impediment: >-
        A primary source the contract cites is unreachable and the contract
        records the impediment, keeps the dependent statement marked, and
        forbids substitution. Not a defect by itself; approval is permitted if
        every other key of K-approve holds.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        approval while any joint is inconclusive. An infrastructure failure
        is never negative evidence about the contract's mathematics or any
        curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    selection_point_duties: >-
      The composing decision is a selection point of GOAL-ECDLP2M-001. It
      reads DEC-20260929-1eded2 (R-ORDER, R-SLOT, R-NISTBIN, R-HOLDS) and,
      if on origin/main at its launch, DEC-20260929-585602 and
      DEC-20260929-7257b2, and records only changes to the standing order,
      each with its reason and revisit. It performs the HOLD-X1 and HOLD-X8
      revisits DEC-20260929-1eded2 R-HOLDS H-6 and H-7 assign to it, and the
      HOLD-X2 revisit (H-5) if it is the later of DEC-20260929-54dcd8 and
      DEC-20260929-585602 on main. It ranks the NISTBIN revision for the slot
      this lane frees unless another session has opened it, and keeps the
      custody successor on slot 1 unless a reason is recorded.

