  composition:
    who: >-
      The Coordinator, in TASK-20260929-99f171, in a fresh session that did
      not run TASK-20260929-6f5e6d, did not compose DEC-20260929-1f5fcb,
      DEC-20260928-cec92e or DEC-20260928-63addc, did not author
      DEC-20260929-1eded2, DEC-20260929-4c7ffc or either plan of this batch,
      and is neither a reviewer of this round nor the lane-B composer. No
