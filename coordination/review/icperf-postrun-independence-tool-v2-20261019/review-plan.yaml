review_plan:
  id: REVIEW-ICPERF-INDEPENDENCE-CHECKER-V2-20261019
  goal_id: GOAL-ICPERF-e6b6a4
  source_task_id: TASK-20261019-387c8c
  snapshot_task_id: TASK-20261019-b541a8
  reviewer_task_id: TASK-20261019-52baee
  ledger_archive_task_id: TASK-20261019-a0ad65
  written_by: coordinator
  written_at: '2026-10-19'
  written_before_any_reviewer_ran: true
  claim_under_review: >-
    The corrected checker plus exact-plan admission rejects the three false cases accepted by the first checker snapshot while retaining ownership, attestation, verdict, sibling-read and blind_from refusals. This is a tool gate for the frozen P1-P4 plan, not review of scientific P1-P4 findings.
  coordinator_prior: >-
    DEC-20261019-da1c84 records T1/T2 BREAKS on the first snapshot. I expect a narrow repair can reject empty statements and multi-joint scalar verdicts, with exact frozen-plan digest admission rejecting swapped statement bytes; independent fixtures must test this expectation.
  joints:
  - id: V1
    joint: Exact frozen plan IDs are paired with nonempty full statements at a digest-bound admission boundary.
    assigned_to: TASK-20261019-52baee
    attack_plan: >-
      Derive P1-P4 labels and the frozen plan digest 1242a62527951bd0f2bb7f908fd2be50e85dcd79cf7a0db0dd09d69de64a29db before reading the patch. Mutate an explicit P3 statement to empty and whitespace; swap P3/P4 statements in a plan file; alter its digest, ID and owner. Verify the combined CLI admission rejects changed plan bytes rather than asking the generic parser to infer semantics from an untrusted plan.
    breaking_artifact: A changed or empty statement admitted under an explicit ID, or a swapped plan accepted against the frozen digest.
  - id: V2
    joint: Each owned joint needs its own enum verdict, with existing ownership, attestation and blindness refusals preserved.
    assigned_to: TASK-20261019-52baee
    attack_plan: >-
      Replace a two-joint reviewer's verdict map with one scalar; remove one joint verdict or reviewer attestation; inject wrong owner, duplicate or wrong ID, invalid verdict, sibling report read and blind_from source read, one mutation per passing fixture. Check the original sealed top-level Validator schema is not silently inferred.
    breaking_artifact: Any known-false mutation accepted by the combined checker gate.
  blindness:
    mutual: true
    lifted_for: []
    rule: The independent reviewer uses a fresh exact session, does not accept the code author's tests as its oracle, and reads no original scientific reviewer report before sealing its tool verdict.
  proves_too_much:
    objects:
    - id: empty_statement
      known_false_conclusion: An explicit joint ID with no substantive statement identifies the reviewed obligation.
      object: A passing fixture with the P3 full statement replaced by empty or whitespace text.
      expected_failure_signature: Rejected at statement validation.
    - id: swapped_statements
      known_false_conclusion: P3/P4 statements may be exchanged while still claiming the exact frozen plan.
      object: A plan file whose P3 and P4 statement values are exchanged against the pinned frozen-plan SHA-256.
      expected_failure_signature: Rejected at exact-plan digest admission.
    - id: scalar_multi_joint
      known_false_conclusion: One scalar verdict attests two separately owned P3/P4 joints.
      object: A passing two-joint Red Team fixture with its verdict map replaced by the scalar holds.
      expected_failure_signature: Rejected for missing per-joint verdict map.
    - id: wrong_owner
      known_false_conclusion: A P3 verdict from a different owner satisfies P3.
      object: Synthetic wrong-owner P3 assignment or attestation.
      expected_failure_signature: Wrong owner rejected.
    - id: blind_leak
      known_false_conclusion: A P1/P2 reviewer that read a blind_from path remains independent.
      object: Synthetic Validator read list containing a frozen blind_from path.
      expected_failure_signature: blind_from violation rejected.
    - id: missing_attestation
      known_false_conclusion: An unfiled original Validator review satisfies P1/P2.
      object: Frozen plan with only the Red Team nested review_attestation.
      expected_failure_signature: Missing Validator attestation rejected.
    assigned_to: TASK-20261019-52baee
    failure_signature: Acceptance of any named false fixture blocks tool-gate approval.
  blind_rederivation:
    required: true
    assigned_to: TASK-20261019-52baee
    quantity: Independently derive SHA-256 of the exact frozen P1-P4 review plan, each P1-P4 ID, owner, full statement association, and expected known-false fixture labels from the frozen plan and review contract before inspecting corrected checker or producer tests.
    parameters: Frozen plan coordination/review/icperf-prime63-m2-postrun-20261019/review-plan.yaml; pinned SHA-256 1242a62527951bd0f2bb7f908fd2be50e85dcd79cf7a0db0dd09d69de64a29db.
    blind_from:
    - coordination/review/icperf-postrun-independence-tool-20261019/TASK-20261019-fcedbb/report.md
    - coordination/review/icperf-prime63-m2-postrun-20261019/TASK-20261019-bb87e3/report.md
    - coordination/review/icperf-prime63-m2-postrun-20261019/TASK-20261019-02a5c2/report.md
  seal_then_compare: >-
    Publish the tool-review report and attestation with a matching completed release, snapshot their exact bytes, then issue DEC-20261019-3bf0cd. A later positive decision only permits a separately published queue to unblock final scientific composition.
  procedure_deviations: []
  inference_boundary: >-
    Passing V1/V2 establishes only parser and exact-plan admission behavior in this scope. It does not authenticate actual sources_read, validate P1-P4, change invalid_output, or support an ECDLP cost or speedup claim.
