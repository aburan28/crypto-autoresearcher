  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20261002-b28b83, in a fresh session that did
      not run TASK-20261002-f48089, did not author DEC-20261002-8cabf8 or this
      plan, did not compose DEC-20260929-585602, DEC-20260929-8c3cb2 or
      DEC-20260928-9d9c47, and is not a reviewer of this round. No reviewer
