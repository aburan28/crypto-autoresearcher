      computation on a group isomorphic to a declared cell (the ISO cells
      are Z/(4 l) on the declared primes, and a producer reusing them for a
      dry call fires TV-4 again), then a role map that leaves
      heur_b2_held_out or one L2 interval undefined for a declared arm. J3
