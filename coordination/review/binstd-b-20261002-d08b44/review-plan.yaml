      alternative: revise on J3 (a false-fire rate or the PC-16c remedy),
      then on J2 (RV-6 or role naming). Each would again be a local remedy.
    where_i_think_it_breaks_if_it_breaks: J3 on the false-fire table, then J3 on the PC-16c remedy, then J2 on RV-6, then J4 on a floor sentence.
    estimator_prior: >-
      Under the repaired rules I expect a correctly functioning null run to
      end cleanly classified with probability at least 0.8 only if every
      rule's false-fire rate is computed and SR-6's degenerate-row exemption
      is by name; version 3's figure was about 0.22 (DEC-20260929-585602
