      expect any break: first, a stopping or invalidation rule other than
      SR-6 and IR-23 whose null false-fire rate was not computed or exceeds
      5 percent (IR-17, IR-22 and SR-1 are the version-3 rules whose voiding
      RV-12 moves into code); second, an RV-2 remedy that separates PC-16c
      from clearance and leaves L2 without a blocking control; third, a
      NEG-path floor so high that NEG is vacuous on the composite arms
      (version-3 D-8). J4 (sentences, boundaries, PTM-A to PTM-C) holds with
      probability about 0.7; the risk is a rewritten NEG or method-ceiling
      sentence quoting a floor measured at one (cell, M) as if it held at
      all. J5 agrees with the contract exactly on image sizes, class counts
      and c_4 on every exhaustive row with probability about 0.8, the gap
      being a definitional mismatch in the producer's near-exact measure
      (then those rows are not compared, never forced), and on the n = 23
