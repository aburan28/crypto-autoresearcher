  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20261002-ed5777 (PTM-D, PTM-E, PTM-F); TASK-20261002-bce101 (PTM-A, PTM-B, PTM-C)
    assigned_to_note: >-
      Split by where each object bites: the decision rules (J3's owner) and
      the certificate, gate and positive control (J4's owner). PTM-A to PTM-E
      are carried in substance from REVIEW-BINSTD-B-20261001-35bdda, where all
      met their signatures; every object is now built on permitted groups
      under declared_groups_rule.
    objects:
      - id: PTM-A
        owner: TASK-20261002-bce101
        object: >-
          The composite-order n = 17 Koblitz cell (a = 0; order recomputed),
          fed to the contract's certificate function and to its Stage 1 gate
          at the declared S for its alphabet-548 and -956 homomorphisms. This
          is a certificate-function input, not a dry call of the decision
          rules; the order and divisor arithmetic is a carve-out under
          declared_groups_rule.
        known_truth: >-
          The capacity is not 2 bits there. The certificate function must
          return the full divisor set of the group order (including 548 and
          956), and the gate must read G = M on both homomorphisms at the
          declared S.
      - id: PTM-B
        owner: TASK-20261002-bce101
        object: Z/2^n with n other than 17 and h the low log2(M) bits, fed to the contract's certificate function and gate.
        known_truth: >-
          Every subgroup 2^k Z/2^n is an exact filter and h reads G = M
          exactly. A certificate finding no alphabet between 4 and the order,
          or a rule reporting the random-label null there, has proved too
          much.
      - id: PTM-C
        owner: TASK-20261002-bce101
        object: >-
          The relabelled Z/l'Z control with the log-interval key, l' a
          permitted prime near each ladder l, fed to the contract's Stage 2
          rules and the PC-7 code across the declared M grid.
        known_truth: >-
          The key is an approximate filter with G about M/2 up to one carry.
          The rules must read it as the far-end positive control on every
          declared M, net of the stated maximum bias.
      - id: PTM-D
        owner: TASK-20261002-ed5777
        object: >-
          The stratified comparison fed (a) an exact filter onto a group of
          order M and (b) a planted marginal-only filter, on permitted groups
          of each declared cell's shape at the declared S.
        known_truth: >-
          A null must destroy arithmetic beyond the exact components and keep
          marginals: (a) collapses to within the null width and (b) is
          preserved within its own width.
      - id: PTM-E
        owner: TASK-20261002-ed5777
        object: >-
          Exact-content-only labels, fed to the rules as applied to family
          arms: (i) a weight-class label whose every class is parity-pure, so
          that it determines the E/2E class and carries nothing else; (ii)
          4 r + h4 with r drawn from a skewed distribution independent of the
          point; both on permitted groups of a Koblitz ladder shape.
        known_truth: >-
          Each carries only an exact component the certificate already counts.
          A rule that reads either as LEAD, or as anything but NEG, has proved
          too much.
      - id: PTM-F
        owner: TASK-20261002-ed5777
        object: >-
          NEW (RV-1). Near-exact degenerate labels on permitted groups of a
          Koblitz ladder shape: h4 refined on k exceptional points, k in 1, 2
          and 3 (the F5xF4-at-M = 8 pattern of DEC-20260929-585602 D-1: image
          size outside 1, 2 and 4, smallest class of one or two points), fed
          to SR-6 as revised, to the stratified comparison, to stage3 and to
          the degeneracy rule.
        known_truth: >-
          Each carries only the certificate's exact component up to k points
          and nothing else of the point's arithmetic. SR-6 stopping the run as
          a certificate refutation, any LEAD reading, any reading but NEG, or
          the degeneracy rule failing to mark it degenerate, has proved too
          much.
    failure_signature: >-
      A correct protocol keeps each known-false conclusion out of reach.
      PTM-A returns the full divisor set and reads G = M on both
      homomorphisms at the declared S. PTM-B returns the subgroup filters and
      reads G = M. PTM-C reads about M/2 on every declared M and is labelled a
      positive control. PTM-D collapses (a) and preserves (b). PTM-E reads NEG
      on both labels. PTM-F reads NEG at every k, is marked degenerate, and
      SR-6 does not fire.
    how_to_run_it: >-
      Review computations in your own script on toy or synthetic inputs and
      permitted groups only (declared_groups_rule). They mint no RUN-*, write
      no evidence record and never execute any EXP-BINSTD-811a2e driver as an
      experiment. Put every script, seed and output in computations.json. If
      a PTM would amount to a new experiment, record it not performed with
      the reason.

