      the mass roughly in half). I expect no non-composite arm to be
      degenerate. The producer most likely exempts degenerate rows from SR-6
      by name with the reason, and keeps them as declared rows that read NEG.
    per_joint: >-
      J1 (D-CARRY-B against version 3, the degeneracy and exact-quotient
      audit figures, RV-10, RV-11, RV-14) holds with probability about 0.8;
      if it breaks, on a degeneracy row the validator's own enumeration
