    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/binstd-b-20261002-d08b44/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-d08b44/reviews/TASK-20261002-ed5777/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-d08b44/reviews/TASK-20261002-1e7a71/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-d08b44/reviews/TASK-20261002-bce101/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-d08b44/reviews/TASK-20261002-997dbb/,
      run by the top-level session and recorded in DEC-20261002-962278
      whatever it reports; the tool is never edited to pass. The
      --blind-history check is uncheckable (no protected-digest file) and is
      recorded as such (PD-R4).
    custody_without_seal: >-
      No seal card. Before TASK-20261002-b28b83 is launched, the top-level
      session computes sha256 of the eight declared report files of this
      round and pastes them into the launch prompt. The composer records them
      verbatim as its first act, before reading any report.
      TASK-20261002-9dbae9 must reproduce all eight; a mismatch voids the
      composition.
    launch_prompt_check: >-
      The composer records whether the session states it used each reviewer
      prompt of launch_prompts verbatim with only <SCRATCH> replaced (RV-15);
      a departure is a procedure deviation, weighed as DEC-20260929-585602
      SD-1 was.
    discharge_check: >-
      The composer reads the audit sheet's revision discharge table and checks
      that each of RV-1 to RV-15 of DEC-20260929-585602, and each design
      condition C1 to C8 of DEC-20260928-63addc S2, maps to a named clause
      that the owning joint's report (discharge_map) does not contradict. An
      item with no clause is a missing approval field for K-revise-defect.
    keys:
      K-approve: >-
        J1 to J4 hold; J1's D-CARRY-B finds no uncovered difference; J5 agrees
        with the contract's frozen figures within the agreement tolerance on
        every compared quantity; every PTM, PTM-F included, meets its failure
        signature; the false-fire table is complete with every rule at or
        below 5 percent and an aggregate clean-classification probability at
        or above 0.8, and J3's own table does not contradict it; no tripwire
        fired; every revision requirement and design condition is discharged
        (discharge_check). DEC-20261002-962278 then approves
        EXP-BINSTD-811a2e under the AGENTS.md standing user authorization and
        names as its first next action the opening of an execution batch
        whose first card advances the approval and status fields of the
        version-4 records and records versions 1 to 3 as superseded, at the
        slot the standing order then in force gives it. Approval asserts
        nothing about any curve's security, any filter's existence, or any
        k-list cost against rho.
      K-revise-defect: >-
        Any of J1 to J4 breaks, a field approval requires is missing, a
        revision requirement or design condition is undischarged, J1's
        D-CARRY-B finds an uncovered difference, the false-fire table is
        incomplete or over its thresholds, or TV-4 fired. Decision revise,
        each defect listed with its joint and breaking artifact, and a
        revision design card in a new batch as the first next action, placed
        in the standing order with its reason and cost. A design defect is
        never a closure ground for the lane (rule 9); a composer that
        considers the lane's cumulative revision cost records it as a rule-9
        ranking note, not as an obstruction.
      K-indeterminate: >-
        J5 disagrees with the contract beyond the tolerance on any compared
        quantity, or reports a choice that changes one. Decision revise on
        C2, C6 or C7 as the quantity requires, naming it; neither
        implementation is preferred.
      K-impediment: >-
        Wagner 2002 or Fong-Hankerson-Lopez-Menezes is unreachable and the
        contract records the impediment, keeps every dependent statement
        marked, and forbids substitution; the group-law re-derivation of the
        halving criterion remains the accepted alternative. Not a defect by
        itself; approval is permitted if every other key of K-approve holds.
        Relaying the criterion through IDEA-20260922-1b16d7 or
        IDEA-20261001-39014f is K-revise-defect.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        approval while any joint is inconclusive. An infrastructure failure
        is never negative evidence about the contract's mathematics or any
        curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    selection_point_duties: >-
      The composing decision is a selection point of GOAL-ECDLP2M-001. It
      reads DEC-20261002-8cabf8 R-ORDER-4 and any later standing order on
      origin/main at its launch, and records only changes, each with its
      reason, cost and revisit. The slot this lane frees goes to the head
      item of the standing order then in force (NISTBIN-V4 as of
      DEC-20261002-8cabf8, then S1-V5), unless an earlier freed slot has
      taken it or another session has opened it; any other assignment (an
      execution batch for a contract this decision approves included)
      records a new reason and the cost of deferring the head item. It
      performs the lane-B half of the HOLD-X2 revisit (DEC-20261002-a75609
      CH-5) and, if DEC-20261002-08c3f8 is then on origin/main, the
      reconciliation DEC-20261002-8cabf8 R-08C3F8 (3) assigns to this goal's
      next selection point, unless an earlier selection point has performed
      it. It considers the technique lessons of DEC-20260929-8c3cb2 and
      DEC-20260929-585602 knowledge_promotion only if the revised instrument
      has run, which it will not have. It names exactly one first next action.

