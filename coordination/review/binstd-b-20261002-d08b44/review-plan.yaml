        on import or needs a 3.12+ API; a relayed computation that does not
        reproduce; a design computation on an excluded group outside the
        carve-outs (also TV-4); a declared arm that cannot reach an outcome
        its table assigns, or an arm still selected by an offset that varies
        with the cell; an RV-7, RV-8 or RV-12 repair absent from code; a
        missing approval field; a non-null approved_by; a missing supersedes
        field; an earlier-version file changed.
    - joint: >-
        J3 -- Decision rules, controls and rates (C1, C5, C7 in the rules;
        RV-1 rule and control, RV-2, RV-4 floor, RV-5 control and floor,
        RV-13; reachability from generative quantities; the false-fire
        table). SR-6's image-size clause cannot fire on an arm carrying only
        the certificate's exact component up to a few points; every
        degenerate (arm, cell, M) is dropped or exempted with its reason; a
        near-exact degenerate-label control is declared that SR-6 must not
        fire on (RV-1). PC-16c's false-fail rate is computed in code on
        non-declared primes, and either a stronger planted decay brings it
        below 0.01 or IR-23's PC-16c branch is confined to LEAD and separated
        from the clearance NEG needs, with L2 still guarded (RV-2). The
        resolving floor is measured on the NEG path for an exact-free and an
        exact-carrying planted mixture per declared (cell, M) shape (RV-4).
        A curve-path LEAD-reach control (planted exact-free and
        exact-carrying filters on groups of the lead shapes) stands beside
        PC-16, PC-16b and PC-16c, and the effective LEAD floor for exact-free
        arms is stated (RV-5). Every stopping, invalidation and admission rule
        has its false-fire rate under the contract's own null computed in
        committed code, the aggregate probability that a correctly
        functioning null run ends cleanly classified (no stop, no voiding, no
        ART-DEF) is computed, and RV-13 prices the expected attempts per
        clean run and the contingent review cost of any stop rule.
      assigned_to: TASK-20261002-ed5777
      attack_plan: >-
        (i) FALSE-FIRE TABLE, FIRST. Before opening the producer's C-5 table
        or its C-7 output, write your own: for each stopping, invalidation
        and admission rule as frozen, compute its firing rate under the
        contract's own null by Monte Carlo on permitted groups of the
        declared shapes, seeds recorded, and the aggregate clean-classification
        probability; then compare. Record the order in your report. (ii)
        Structural premises before calibration: for each declared cell,
        check from parameter arithmetic only that the strata the stratified
        comparison uses are the cosets the rules assume (E/4E on Koblitz
        cells, E/2E on CELL-O19) and that every declared M is compatible with
        them. (iii) PTM-D, PTM-E and PTM-F (below). (iv) Plant exact-free
        filters with flat standardised excess at one, two and four times the
        stated NEG-path floor, and with growing and decaying excess, on
        permitted groups of each lead shape; read L1 to L3 and stage3: LEAD
        reachable exactly as L2 is pre-registered, a PC-16c-like decay never
        LEAD, and the false-NEG rate at each multiple stated. (v) Reachability
        per declared outcome from generative quantities (not from the code
        path, which J2 owns). (vi) Check RV-13's pricing against your table.
        Where I think it breaks: (i), then RV-2's remedy under (iv), then (v)
        on the composite arms.
      breaking_artifact: >-
        A stopping, invalidation or admission rule with a null false-fire
        rate above 5 percent, or not computed; an aggregate
        clean-classification probability below 0.8, or not computed; SR-6
        firing on a near-exact degenerate label or on a declared degenerate
        row; a degenerate (arm, cell, M) not recorded as such; PC-16c's
        false-fail above 0.01 while it can still void NEG readings; L2 left
        without a blocking control; a NEG floor quoted that was not measured
        on the NEG path; a LEAD branch unreachable as L2 is pre-registered;
        a declared outcome no data can reach; PTM-D, PTM-E or PTM-F reaching
        its known-false conclusion; a per-orbit line unlabelled; RV-13
        unpriced.
    - joint: >-
        J4 -- Boundaries, exclusions, sentences and the certificate-side
        proves-too-much controls (C8 boundaries; RV-4 and RV-5 sentences,
        RV-9). No k-tree run at deployed parameters; target-dependent filters
        out of family; levels above 1 excluded; d3c5a5's engine not used;
        d06324's four-arm table not designed; absorbed and cited records cited
        by id and not edited; the filter-gain measurement stays a control on a
        BINSTD certificate; the NEG row, the mechanism and the
        method-ceiling sentences rewritten to the floor actually measured,
        with its (cell, M) scope; the LEAD-reach sentence scoped to what the
        controls show, with their rates; the pre-written "exponent-relevant
        only in the counterfactual sense of the ceiling" interpretation
        deleted (RV-9); PTM-A, PTM-B and PTM-C meet their failure signatures;
        no over-scoped sentence.
      assigned_to: TASK-20261002-bce101
      attack_plan: >-
        (i) Quote every sentence of the three files containing NEG, floor,
        LEAD, reach, ceiling, stake, below, rho, exponent, capacity or 13-bit;
        classify each as rule, design figure, scoped statement or outcome; an
        outcome fires TV-1; a floor or rate quoted beyond the (cell, M) it was
        measured at is an over-scope. (ii) Perform PTM-A, PTM-B and PTM-C
        against their failure signatures with the contract's own code on toy
        or synthetic inputs and permitted groups. (iii) Search for every
        excluded object. (iv) Check absorbed and cited records are cited, not
        edited, and that every citation carries provenance. Where I think it
        breaks: (i) on the rewritten NEG and method-ceiling sentences.
      breaking_artifact: >-
        An over-scoped sentence (a floor, rate or reach statement wider than
        its measurement); an outcome sentence (also TV-1); the RV-9 sentence
        still present; an excluded object designed in; an edited absorbed or
        cited record; a recalled citation supporting a design figure; PTM-A,
        PTM-B or PTM-C reaching its known-false conclusion.
    - joint: >-
        J5 -- Blind re-derivation of the declared rows' orders and alphabets,
        and of the degeneracy and exact-quotient quantities version 4 adds or
        changes (image sizes, class sizes, c_2, c_4, and exhaustive purities at
        n = 23). See blind_rederivation below.
      assigned_to: TASK-20261002-997dbb
      attack_plan: >-
        See blind_rederivation and the quantities block of
        ledger/handoffs/TASK-20261002-997dbb.yaml. The re-deriver is told what
        to compute and not how, and reads no producer artifact.
      breaking_artifact: >-
        Any value that differs from the contract's frozen figures beyond the
        agreement tolerance, after matching the contract's stated rules and
        definitions. That localises the fault to a model choice or one of two
        named implementations.

