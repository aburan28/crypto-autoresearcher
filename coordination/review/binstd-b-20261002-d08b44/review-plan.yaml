  declared_groups_rule:
    source: DEC-20261002-8cabf8 R-DECLARED-GROUPS (RV-6)
    binds: the producer's session computations and every reviewer's dry calls, nulls, planted filters, PTMs and Monte Carlo
    excluded_groups: >-
      Every group isomorphic to the group of a declared cell of
      EXP-BINSTD-c9c8a2 or EXP-BINSTD-811a2e. Operationally: no such
      computation on a group whose order is divisible by any of the primes
      2003, 130873, 2095853, 549756390943, 261823, 32603, 137 or 239; none on
      Z/2^17; none on any elliptic curve over F_(2^n) with n in 13, 17, 19,
      23 or 41; and none on any further cell version 4 declares (the
      producer lists them, and the list extends this rule automatically).
    permitted_groups: >-
      Groups of a declared cell's SHAPE built on primes outside that list
      (for example Z/(4 l') or Z/(2 l') with l' an adjacent non-declared
      prime of similar size, Z/2^k with k other than 17), synthetic labels,
      and non-declared toy curves over F_(2^n) with n outside 13, 17, 19, 23
      and 41.
    carve_outs: >-
      Label-class ENUMERATION on the declared curve cells is permitted where
      the plan or a card asks for it: the exact-quotient audit (purity_2,
      purity_4), the degeneracy audit (image size, class sizes, c_2, c_4),
      the Stage 0 arithmetic, and orders and factorisations. None of these
      computes a bucket gain, a shuffle, a null draw, an estimator, a rule
      rate or a decision clause. The end-to-end stage3 dry call over the
      declared NAME grid feeds synthetic per-arm statistics keyed by
      declared names into the committed decision code and constructs no
      element of any excluded group.

