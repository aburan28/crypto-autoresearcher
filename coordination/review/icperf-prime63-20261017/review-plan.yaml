review_plan:
  id: REVIEW-ICPERF-PRIME63-20261017
  goal_id: GOAL-ICPERF-e6b6a4
  experiment_id: EXP-ICPERF-f839ca
  source_task_id: TASK-20261017-a83dcd
  snapshot_task_id: TASK-20261017-778665
  validator_task_id: TASK-20261017-8bbba1
  ledger_archive_task_id: TASK-20261017-407698
  written_by: coordinator
  written_at: '2026-10-17'
  written_before_any_reviewer_ran: true
  claim_under_review: >-
    The bounded 63-bit prime-field panel has complete raw custody and
    independently valid full-point certificates for every cell called ok;
    planted positive, capped, failed and unattempted cells are distinguished
    under the frozen 27-cell schedule. This is not a total-cost or base-ranking
    claim.
  coordinator_prior: >-
    I expect the additive checker to reject a contradictory planted unit-ideal
    response and to preserve model-cap censoring. I expect m=8 calls to be
    frequently capped; that expectation is speculative and carries no
    inference until the exact run exists. I will change the interpretation if
    any raw member is missing, any accepted root fails independent point
    arithmetic, or any positive unit-ideal response is treated as censored.
  joints:
    - id: R1
      joint: All scheduled cells and their raw request, response when emitted, stdout and stderr bytes are accounted for by the tar and receipt.
      assigned_to: TASK-20261017-8bbba1
      attack_plan: Independently list tar members and hash each against the receipt, then derive attempted/unattempted counts and check every absent response has a permitted bounded reason.
      breaking_artifact: A concrete missing, duplicate or mismatched cell member with its expected and observed hashes.
    - id: R2
      joint: Every planted positive witness satisfies its exact polynomial system and full curve-point target, and a contradictory certified_no_solution response invalidates the instrument.
      assigned_to: TASK-20261017-8bbba1
      attack_plan: From the public system and private witness coordinates alone, independently evaluate every polynomial mod p and signed sum; then compare all six raw statuses with those identities.
      breaking_artifact: A nonzero polynomial, wrong point sum or contradictory accepted status with cell ID and full arithmetic trace.
    - id: R3
      joint: Every natural ok root is a valid base-member lift whose signed sum equals the complete target point.
      assigned_to: TASK-20261017-8bbba1
      attack_plan: Reimplement the field/curve checks without importing producer arithmetic, sample all ok roots if feasible, and preserve each false-root class separately.
      breaking_artifact: An accepted root and independently computed failing polynomial, lift, base or target-point check.
    - id: R4
      joint: Censor, CPU, wall, memory, scratch and scope claims are reported at the exact per-cell boundary with no complete index-calculus cost inference.
      assigned_to: TASK-20261017-8bbba1
      attack_plan: Recompute counts and aggregate ranges from raw receipts, compare process log times where available, and mark every unmeasured E2E term null; inspect watchdog stop causes rather than relabeling them as solver negatives.
      breaking_artifact: A cell whose raw stop state, resource reading or cost claim conflicts with the reported classification.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - id: proves_too_much_1
        known_false_conclusion: A planted positive's exact satisfying witness and a certified unit ideal can both be valid for the same ideal.
        object: The synthetic self-consistent certified_no_solution archive from test_guard.py over the 101-element prime-field control.
        expected_failure_signature: The validator must reject the contradiction as invalid, while a model_cap_censored version stays censored.
    failure_signature: Any acceptance of the contradictory unit-ideal response as a harmless cap breaks the review procedure.
    assigned_to: TASK-20261017-8bbba1
  blind_rederivation:
    required: true
    quantity: The six planted polynomial evaluations, complete point sums, and the 27-cell schedule count and arm-arity mapping.
    parameters: Frozen prime curve p=9223372021248595841, subgroup r=9223372018953067627, the six archived planted requests and witness coordinates, three B=475 bases, and seven shared natural targets.
    blind_from:
      - research/icperf_prime63_inflight_admission_20261017/check.py
      - research/icperf_prime63_checker_guard_20261017/guard.py
      - experiments/EXP-ICPERF-f839ca/runs/RUN-ICPERF-3a849c/raw-result.json
      - research/icperf_prime63_inflight_admission_20261017/report.md
    assigned_to: TASK-20261017-8bbba1
  inference_boundary: >-
    A passing validation may support only bounded solver-to-certificate
    observations at this curve, base size, arity and cap. It cannot establish
    useful rank, linear algebra cost, held-out target solve, matched rho gap,
    degree of regularity if not instrumented, or a complete E2E improvement.
