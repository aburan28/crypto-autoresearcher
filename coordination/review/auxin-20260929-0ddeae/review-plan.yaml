    Every report carries review_attestation as templates/research-records.md
    defines it (task_id, joints_owned, sources_read, read_sibling_reports,
    blind_from_respected for the re-deriver) and a verdicts mapping keyed by
    joint label with holds, breaks or inconclusive. No whole-claim verdict.
  seal: >-
    TASK-20260929-a7a159 hashes every file under each reviewer's reviews/ directory after
    all three return, before composition. The composer verifies every report
    against the seal; a mismatch voids composition.
  independence_check: >-
    python3 tools/check_review_independence.py --plan coordination/review/auxin-20260929-0ddeae/review-plan.yaml
    --reports coordination/goals/GOAL-AUXIN-a93442/batches/BATCH-1907cf/reviews/
    run by the composer; its result is recorded in the composing decision.

  composition:
    who: >-
      The Coordinator, in TASK-20260929-bbda97, in a session that did not run TASK-20260929-ef0945,
      TASK-20260929-5a566a, TASK-20260929-3f57fb, TASK-20260929-03c096 or any reviewer task of this round. It stages
      DEC-20260929-cfb294 in its composition directory; TASK-20260929-aa32cd places it.
    reads: the sealed reports, the seal, this plan, the draft, the controls outputs, the held sources.
    keys_in_precedence_order:
      - key: K-escalate
        when: A reviewer reports, with a quoted clause, that the draft claims a breakthrough, a closure result or a contradiction of validated evidence.
        then: Composition stops. A review-breakthrough round is carded under a new plan; the claim is not promoted.
      - key: K-infra
        when: A reviewer task failed, timed out or crashed, or returned no report.
        then: No evidence either way. The joint is re-carded; never a negative result.
      - key: K-leak
        when: The re-deriver's attestation lists a path outside its card's allowed files, blind_from_respected is false, or a pre-dispatch hygiene check failed.
        then: EJ7 is void. A new blind task under a new id; other joints compose normally.
      - key: K-revise
        when: >-
          Any of EJ1 to EJ6 or EJ8 breaks with its breaking_artifact; or any
          named break is reported not fixed with its artifact; or the composer
          traces an EJ7 comparison difference to the draft.
        then: >-
          EXP-AUXIN-92dccc is not approved. Under F-REV, any fix is a new successor
          contract under a new EXP id; no amendment layers this draft. RS-B
          stays the selected scope.
      - key: K-reviewer-error
        when: An EJ7 difference the composer traces to the re-deriver, or a control finding every owning reviewer shows to be a control error.
        then: Recorded as re-deriver or control error, not a draft defect.
      - key: K-indeterminate
        when: Any joint or named break is inconclusive with no break; or a PTM object fails its failure_signature.
        then: Inconclusive. A successor review task on the affected joints only. No approval.
      - key: K-hold
        when: >-
          EJ1 to EJ6 and EJ8 hold; every named break is reported fixed; every
          PTM object behaves per its failure_signature; EJ7 agrees on every
          compared row after granularity reconciliation that changes no text;
          every control finding is either confirmed harmless or shown to be a
          control error; the independence check passes.
        then: >-
          The round holds. The composing decision may approve EXP-AUXIN-92dccc by name at
          sha256 894c4855b64fdd2ec63915f88d6c668dcb95f40a108eba4f07a701b12bf6ccb6 under F-APPROVAL. It still does not set
          scientific_execution_authorized. H-AUXIN-6db354 stays proposed.
    no_key_after_the_fact: No key is added, removed or reworded after any report returns, except by an addendum written before the composer reads a report.

