      findings:
        - id: F-J3-1
          title: harvest.py SS pair counts fall short of IC-5's C(k', 2) (instrument level; analysis unaffected)
          text: >-
            Reconstructed from the retained star rows, the IC-5 definition (SS pairs = C(k', 2)
            over the k' formally distinct encodings of an x-key group) exceeds the recorded
            SS.pairs_raw in 1052 of 3056 complete SS blocks at the stop and in 328 at A_fix. The
            recorded value is never larger. Mechanism, read after the seal: Harvester.end_attempt()
            (harvest.py lines 597-603) rebuilds an x-key's group from the FIRST LSM run holding the
            key only (`if x not in coll`). Members in later, unmerged runs are skipped when a new
            encoding's pairs are counted, so groups of three or more that straddle runs lose
            pairs. Star rows are unaffected because they are emitted against the oldest member.
            Census rank and staircases are therefore correct: 1360 of 1360 blocks reproduce
            exactly. The at-A_fix undercount is small and arm-symmetric in mean relative terms:
            structured against random 0.11% vs 0.19% (m3), 0.68% vs 0.75% (m4), 0.02% vs 0.13%
            (m5). Recomputing A1 SS with the IC-5 count in the 63 cells whose instances are all
            fully retained moves z by at most 0.053. The (small_x, SS, m4, 20) excursion persists
            (z 3.39 -> recount), and its Stage R z moves from -1.989 to -1.976. The 36 SS cells
            above 24 bits cannot be recomputed from the retained rows. They include the (dickson,
            SS, m4, 26) excursion cell and its Stage R cell. The undercount pulls excess
            coincidence groups toward the null very slightly, so any null-direction reading of SS
            cells above 24 bits rests on a counter whose effect there is bounded only by
            extrapolation from bits <= 24.
