        kP = Q for the 3590 census-side solved instances (R10 1025, R11 990, R12 990, R13 110,
        R14 315, R16 160) and the 2495 R02-R09 regression solves (F-J1-1). The recovered logarithms k are not in
        the rows (only k_found and k_verified flags), so the solve certificate cannot be
        re-verified from the archive. Partly corroborated: the J4(c) re-executions reproduced
        k_found/k_verified for 26 instances with the same code lineage, and the SS rows are
        consistent with Q = kP for the C-5 k on all 110 curves.
      - G6 and G7 check flags as recorded, beyond what the base reconstructions imply. The Dickson bases rebuilt from the recorded (g, c, d) certify every row, but D_d(x, c) = lambda was not evaluated.
      - SS rows beyond the 60-per-instance sample
      - timing, RSS and CPU figures (internally consistent across jobs-index, execution.json and manifests, but not re-measured)
      - the executor's attestations (no scratch reads; analyze_census.py not run on panel data before R15), and tools/validate_ledger.py's output

  falsification_targets_checked:
    - "The canonical sets are not what M-5 gives: blind J2a equals the archive exactly."
    - "The analysis does not implement the frozen text: the blind J3 agrees, and differences localise to open conventions."
    - "The outputs are not reproducible: byte-identical analysis and merge re-executions, and exact job re-executions."
    - "The harvested rows are not true relations: independent certificate checks on 976,336 rows (all 828,282 known_log rows; all 142,542 TT and 5,512 TB rows of the other arms), plus a consistency check on 174,756 sampled SS rows, show none failing."
    - "The j0 curves were mis-generated or mis-skipped: exhaustive twist counts confirm them."
    - "The regression gates were misjudged: my own comparator confirms G1 and G2."
    - "The seeds differ from the declaration: random bases rebuilt from the declared seeds certify every row, and the jobs re-execute exactly."
    - "The interval readings carry their nominal confidence: FALSE (J5 breaks)."
    - "Not tested by me: whether any excess is real, and the family-wise calibration of the excursions (J6-J8 and the proves-too-much control, owned by the red team)."

  findings_summary:
    - "F-J1-1: the frozen design archives no recovered k, so the 3590 census-side solve claims and the 2495 regression solves (kP = Q) cannot be re-verified from the archive with disjoint code. They rest on the in-process flag, with same-lineage corroboration for 26 instances. G4, A4 and any solve-cost reading, the TW-FLOOR round included, rest on them; the A1-A3 census counts do not (J1)."
    - "F-J2-1: view-map-stage-r.json does not bind R16's root rows, which the --stage-r step reads through --out. They are bound by the merge-report, checksums, manifest and receipt (J2)."
    - "F-J3-1: harvest.py undercounts SS pairs relative to IC-5 (LSM-run lookup). The effect is small and arm-symmetric, max |dz| 0.053 where recomputable, and cannot be recomputed above 24 bits (J3)."
    - "J1 documentation defects: resolved_model_id null in all 23 manifests; canonical-location start and finish timestamps null; R02-R09 certificates omit instances_claimed; seeds not recorded in rows by design."
    - "J3 conventions (A2 undefined replicates, A5 unit drops, A6 SS censoring, x_b, known_log H3) each explained and reproduced; none moves a decision."
    - "J5 breaks: coverage 0.86-0.92 against 0.95 for every frozen interval procedure at five units per rung."
    - "TW-FLOOR fired (73 on-mode instances), in both my blind predicate and the producer's flag, with equal key sets; routed per the plan."
    - "F-COST-1: A4's S_3 ratio leaves SS-store memory, harvest wall time and census-mode row-certificate work uncharged (IC-6 reports them separately by design); no speedup statement may be read off A4 without them."

  verdict: passed
  verdict_scope: >-
    passed means only this. On the joints I own, the EXP-PFDR-1b78f7 run set at a32e70808 is an
    admissible receipt: complete, correctly bound, reproducible, and computed as the frozen text
    says (J1-J4 hold). Its relation certificates were re-verified with disjoint code. Its solve
    certificates could not be, because no recovered k is archived; they stand on the in-process
    flag (F-J1-1). J5 breaks: the interval procedures undercover. That bounds how
    interval-based readings may be worded; it does not make the receipt inadmissible. This is not
    a whole-claim verdict (RV-5). It is not evidence for any ECDLP claim and authorises no status
    change or promotion. The Coordinator composes J1-J8 and the proves-too-much control.
  per_joint_verdicts: {J1: holds, J2: holds, J3: holds, J4: holds, J5: breaks}

  limitations:
    - "Recovered logarithms are not archived, so kP = Q rests on run-time flags (F-J1-1; see taken_on_the_producers_word). A round that must know a solve is real, the TW-FLOOR round included, cannot get that from this archive."
    - "SS certificate re-verification is a sampled consistency check with P derived from the data, not from the curve generator."
    - "F-J3-1's effect above 24 bits is not measurable from the retained rows."
    - "My J5 designs are synthetic. The coverage deficit follows from n = 5 per stratum and is robust to the residual law, but the absolute P(hi < truth + 0.03) figures depend on the residual scale."
    - "Knowledge index (RV-10): no search_knowledge tool was available in this session, so the index did not answer. I did not substitute a grep of knowledge/, because a corpus entry could carry the excluded Stage 0 material (EV-PFDR-cf6ee5, the pfdr-7c8bf2 review) into J5. The Marsaglia-Tsang-Wang Kolmogorov algorithm, Cipolla's square root and the regularized incomplete beta/gamma identities are recalled standard results. They were implemented by me and self-checked (the Poisson CDF against a hand value; the Kolmogorov CDF against a recalled published value, P(D_10 < 0.274) = 0.62848)."
    - "J1-J5 only. Nothing here reads any hypothesis status or any A7 value."

  procedure_deviations:
    - id: PDV-1
      text: >-
        RV-8 "one computation process at a time": the J5 simulations were the only long
        computation. While they ran, short read, hash and compare processes ran alongside for J1
        (receipt hashing, artifacts, manifests, G1/G2, AST) and the J3 comparison, each under a
        second of CPU to a few seconds. No two long computations overlapped. Peak polled RSS of
        any guarded process was 442 MB (the H3 recomputation), under the 1.0e9-byte stop, which
        never fired.
    - id: PDV-2
      text: >-
        J4(b): the archived merge scripts hard-code REPO to the shared working tree. To read only
        the committed package (RV-1), the unedited scripts ran with the module constant REPO
        redirected to the detached worktree (checks/j4_merge_runner.py). R16's merge omitted
        --post-command so that the analysis ran exactly once (RV-7).
    - id: PDV-3
      text: >-
        Beyond RV-7's enumerated computations I ran own-code certificate and consistency checks
        on committed files (cert_known_log.py, cert_bases.py, cert_ss.py, a2_mechanics_check.py,
        j3_q6_impact.py) and the A2 interval calibration (j5_a2_calibration.py). In the final
        review I added read, parse and hash scripts: j1_manifest_fields_followup.py,
        j4ab_hash_record.py, j4b_r16_rawresult_keydiff.py and make_attestation.py. None imports a
        solver module or runs the experiment. They were run because the breakthrough tier
        requires disjoint re-verification of every certificate.
    - id: PDV-4
      text: >-
        Some post-seal source reads were made with grep and sed outside rl.py. They were appended
        to checks/read-log.txt retrospectively, marked as such and in order. A pre-seal `du` and
        the directory listings are disclosed there too.

