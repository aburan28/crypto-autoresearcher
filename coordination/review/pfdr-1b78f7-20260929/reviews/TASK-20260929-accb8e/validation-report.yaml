    J5:
      statement: interval calibration at five curves per rung (MC-5; the check DEC-20260929-1b779a NA-5 asks for)
      verdict: breaks
      verdict_note: >-
        Every frozen interval procedure this experiment's interval readings rest on covers
        materially below its nominal 95% at five units per rung: measured 0.864-0.916, which is
        3.9 to 7.9 binomial standard errors of the measured rate below 0.95 (4.9 to 12.5 under the
        s.e. at the nominal rate). This independently reproduces the Stage 0 finding as the card
        describes it (own code; no Stage 0 review material, figure or calibration code read). Within this run set no decision flips: (2) has lo 0.601, far below 0.66;
        the O-ALIVE slope condition is false with every lo < 0; and (1b) is decided on the point
        delta. But every "interval excludes" statement from A2, A4 or stats.bootstrap_slope is
        weaker than its nominal level.
      coverage_tables: "calibration/coverage-tables.yaml (raw: calibration/out/j5-a.json, j5-b.json, j5-c.json, j5-a2.json)"
      a_stats_bootstrap_slope: >-
        Frozen settings (reps 2000, level 0.95, seed 0), 1500 synthetic series per configuration:
        11x5 Gaussian 0.909 (se 0.007); 11x5 t3 0.895 (0.008); 7x5 (20..32) Gaussian 0.899
        (0.008); 7x5 (20..32) t3 0.899 (0.008); 7x5 (12..24) Gaussian 0.896 (0.008); 7x5 (12..24)
        t3 0.887 (0.008). One-sided misses are symmetric, about 0.04-0.06 each.
      b_A4: >-
        stats.fit_exponent over 12..32, 11 rungs x 5, 1000 series: coverage 0.913 (0.009)
        Gaussian, 0.916 (0.009) t3. Paired bootstrap of delta (my CV-11 implementation, the one
        used in J3) with delta = 0: 0.909 (0.009) and 0.903 (0.009). P(hi < truth) 0.045-0.048
        for the exponent and 0.043 for delta, against a calibrated 0.025. The
        "P(hi < truth + 0.03)" entries depend on the residual scale I chose (sd 0.25 shared,
        0.15 per mode). At that scale they are 0.985-1.0, and they are not transferable without
        the design's actual residual scale.
      a_prime_A2: >-
        Extra: A2's curve-index bootstrap, the O-ALIVE slope-interval procedure, on a planted
        design with a known slope of log2(kappa - 1), 1000 series. Coverage 0.864 (0.011) at
        delta = 0.10 and 0.875 (0.010) at delta = 0. At delta = 0 the "interval entirely above
        0" condition fires 0.070 (0.008) of the time, against 0.025 for a calibrated interval.
      c_derivation: >-
        Resampling n units with replacement inside a stratum gives each stratum mean a bootstrap
        variance of (1/n) * (1/n) sum_j (y_j - ybar)^2 = ((n-1)/n) * s^2/n. So the bootstrap SE
        is sqrt((n-1)/n) times the usual estimate: 0.894 at n = 5. The OLS slope is a linear
        combination of the rung-level scatter, so the percentile interval behaves like
        +-1.96 * 0.894 = +-1.753 estimated standard errors. With known variance that covers
        2 Phi(1.753) - 1 = 0.920. With a variance estimated on 44 (11x5) or 28 (7x5) degrees of
        freedom it covers P(|T| <= 1.753) = 0.913 and 0.909. Measured: 0.909 and 0.896-0.899
        (Gaussian), with heavy tails 0.887-0.899. The deflation explains most of the shortfall;
        the remainder (up to about 0.015) is the percentile method's small-sample and heavy-tail
        behaviour. A2 undercovers more (0.864-0.875), consistent with its non-linear
        (ratio-and-log) statistic on 5 curves. Provenance: own derivation, and the numbers are
        computed in calibration/j5_calibration.py part c. The Student-t CDF was implemented from
        the recalled regularized-incomplete-beta identity.
      seeds_and_replicates: master seeds random.Random('J5a|<design>|<law>'), random.Random('J5b|11x5|<law>'), random.Random('J5a2|delta=<d>'); bootstrap replicates 2000 in every interval; series counts 1500 (a), 1000 (b), 1000 (a')

