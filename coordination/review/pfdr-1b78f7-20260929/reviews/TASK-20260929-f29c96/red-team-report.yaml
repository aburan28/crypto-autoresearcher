          merge-report.json differs only in 'attempts' (job-name strings) and
          'canonical_location'. The fixtures carry per-job m, as the real
          jobs-index files do. The stop fixtures F1d, F1o and F2n still stop.
        R16_outcome_bearing_path: >-
          R16's canonical rows.jsonl.gz holds exactly the multiset of the 20 job
          files' 160 lines, verbatim, sorted by (bits, curve, m, arm, mode), with
          160 unique keys. Every job command is the M-1 template with per-job m,
