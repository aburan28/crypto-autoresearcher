  # ---------------------------------------------------------------------------
    J7:
      joint: >-
        Hidden conventions. The census outcome rests only on conventions the protocol
        declares, and those conventions neither manufacture nor hide an excess.
      verdict: breaks
      what_breaks: >-
        The excursion list depends on two declared conventions whose consequence the
        protocol does not declare. The first is the counting unit (pairs per x-key
        group, which counts one relation several times). The second is the variance
        floor in pair units (Poisson). Under relation-level counting, the plan's
        named alternative, zero of the 133 computable resolved cells excurse (16
        cells blocked by retention). Under the dispersion-floored variance, one
        excurses. Under SS at stop, seven do, a different set. The conventions were
        fixed before data and nothing selects on the outcome. But the pair unit
        with a Poisson floor manufactures |z| > 3 cells from multiplicity. The
        plan's own anticipated mechanism, a structured-arm dispersion above the
        random arms', is not what happens (see e).
      alternatives_chosen_before_computing: attacks/choices.yaml (sha256 efcf88c6..., 07:52:52Z; the J7(a) inventory and the per-arm exposure table had been looked at before it and are disclosed in its header)
      conventions:
        a_formal_duplicates_and_counting_unit:
          facts_checked: >-
            (i) Every dropped duplicate is an oriented zero difference by construction
