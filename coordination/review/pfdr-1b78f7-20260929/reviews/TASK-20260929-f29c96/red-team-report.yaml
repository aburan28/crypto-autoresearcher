        the archived files only at checksums.sha256 of census-m4/merged, census-m5
        and j0, and there by the recorded "before" hashes. The regeneration hides no
        other change (11_j8_checks.json).
      DEV_C: >-
        The extra files are environment.json and run_wrapper.py in all 144 job
        directories (143 jobs plus the IE-1 job), wrapper-stderr.log in four attempt
        directories, and resume-set.json, ie-1-compare.json and invocation-check/ in
