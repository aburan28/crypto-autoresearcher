    J8:
      joint: >-
        The executor's deviations DEV-A to DEV-D. None of them touches an
        outcome-bearing path in a way that could depend on a measured value, and each
        is what the report says it is.
      verdict: holds
      DEV_A:
        pre_DEV_A_texts_survive: >-
          No. merge_census.py and run_jobs.py exist in the archive only in their
          post-DEV-A form (sha256 143ea699..., 7d5c4c0a...). git history holds a
          single commit, a32e70808. The pre-DEV-A versions (6c6ec49b..., 25ee0f60...)
          survive only as sha256 pins: implementation-notes-amd430f44 script_pins,
          launcher_sha256 in the jobs-index.json of R11 attempt-2, its
          invocation-check, R12 and R14, the manifests' code blocks, and the
          fixture-check exercise logs. The pre-DEV-A fixture OUTPUTS survive, in
          fixture-check/out/.
        timeline_from_archived_artifacts_UTC: >-
          06:03:01 BI-1. 06:15:11 first pin (25ee0f60 / 6c6ec49b).
          06:15:35-06:17:10 IE-1 job. 06:18:09-06:22:35 R11 attempt-2, 33 jobs,
          launcher 25ee0f60. 06:23:29 R11 merged/ (merge 6c6ec49b).
          06:23:46-06:30:59 R12 attempt-1. 06:31:53 R12 merge (6c6ec49b).
          06:32:58-06:33:44 R14 attempt-1. 06:34:09 R14 merge (6c6ec49b). 06:34 BI-1
          re-check. 06:34:35-06:35:05 R15, whose manifest pins merge_census 6c6ec49b.
          06:35-06:39 DEV-A edit. 06:39:12-06:39:22 exercise-r16 on the edited
          scripts (dummy and fixtures). 06:39:37 re-pin. 06:40:26-06:42:17 R16
          attempt-1, 20 jobs, launcher 7d5c4c0a. 06:42:52 R16 merge (143ea699,
          --post-command analyze_census.py --stage-r). DEV-A therefore post-dates
          R15's naming of the cells and pre-dates every R16 row. R11, R12, R14 and R15
          were produced by the pre-edit scripts and cannot have been touched by it.
        function_by_function_post_DEV_A: >-
          merge_census.py. row_key, stair_key and sort_key read key fields only
          (panel, m or method, bits, curve, arm, mode). universe (R11/R12/R14) and
          universe_cells (new, R16 from --cells) are key sets. attempt_sources is
          changed: jobs are keyed (m, bits, curve, arm list), and jobs-index.json
          carries per-job m for R11 attempt-2, R12, R14 and every fixture. _merge
          applies rules (1)-(8). covers() and covering_job() read keys only. Rule (2)
          placeholders use exit codes from jobs-index. Rule (4) is a duplicate stop.
          Rule (5) is a full-row EQUALITY test after the M-3 exclusions and can only
          stop. Rule (6) takes staircases from the same file. Rule (7) sorts by
          sort_key. Canonical row lines are copied verbatim. summarize_rows (shared,
          DEV-A) reads status, status_reason, k_found and harvest presence, plus the
          G4/G5/G6/G7 fields through summarize_run.gate_checks (certificate counts,
          identity_ok, k_verified, checks). _finish, with --post-command (new),
          runs the pinned analyze_census.py --stage-r before the manifest and
          checksums. cmd_view writes paths and hashes. run_jobs.py reads only key,
          status and status_reason from job rows (read_status_fields). The rest is
          job commands, the watchdog and memory gate, and manifests; no excursion
          cell is hard-coded, and R16's jobs come from the --jobs argument. No line in
          either script reads a pair count, kappa, z, rank, s3 or any other measured
          value to choose, order or drop a row. Every field read is enumerated in
          the grep recorded in read-log.txt (08:14).
        behaviour_on_R11_R12_R14_inputs: >-
          These were produced by the pre-edit merge and cannot differ from
          themselves. Re-running the edited merge on them is J4's cross-version test.
          The executor's fixture regression, which ran the edited merge on the three
          original fixtures, was checked independently here from the archived
          outputs. rows.jsonl.gz, staircase.jsonl.gz, execution.json and
          raw-result.json are byte-identical between fixture-check/out/ (pre-edit)
