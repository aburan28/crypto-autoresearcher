        The family-wise strength of the excursion rule and of the Stage R
        replication rule. The table reads |z| > 3 as a 3-SD event (Gaussian per-cell
        rate 0.0027) and a same-sign Stage R |z| > 3 as a replication. On this
        design, under nulls that reproduce the random arms' own dispersion, the
        per-cell rate is 4-12 times the Gaussian one at the four excursion cells
