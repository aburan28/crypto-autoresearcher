          baseline_consistency: >-
            Census-mode (harvest-off-equivalent) s3 exponents against the committed
            min_fill sweeps at the same m (stats.fit_exponent, seed 0) differ as
            follows. m = 3: small_x -0.002 (sweep-arity-minfill) and -0.011
