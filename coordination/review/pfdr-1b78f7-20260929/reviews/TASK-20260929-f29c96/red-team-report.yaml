        10-51 (TT m = 5), 2-5 (SS m = 3), 44-444 (SS m = 4) and 9-32 (SS m = 5)
        (03_j7_conventions.json dispersion_index_D_rung), against 1 for Poisson.
        With 10 df and rare large bundles, the statistic has heavy tails, and they
        are mostly right tails: a bundle that lands on the structured arm raises C_A
        and leaves the SD, which comes from the random arms only, unchanged.
