        exists, and none exists in any run directory. merge_census.py reads
        attempt-level jobs-index.json and the .gz files it names. No extra file
        shadows a name either script reads.
      DEV_D: >-
        All 167 environment.json files record Python 3.11.15, numpy 2.4.6 and the
        same venv interpreter. They cover R01, R01a, R02-R09, R10-R16, every attempt
        and every job. All 167 command.txt files start with that interpreter.
      caveat: >-
        Because the pre-DEV-A texts are lost, "no merge, sort, exclusion or status
        rule changed" rests on three things: the byte-identical fixture regression
        (independently confirmed), the timeline, and the post-edit code read in
        full. It cannot rest on a textual diff.
      narrowest_supported_statement: >-
        DEV-A was made after R15 and before R16 existed. It touched only R16's
        harness path (job specs, U from --cells, raw-result by summarize_rows, the
        post-step), and nothing in it reads a measured value. R16's canonical set
