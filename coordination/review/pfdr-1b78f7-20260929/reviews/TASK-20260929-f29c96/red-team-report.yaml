        None of the four deviations can have moved an outcome id.

  # ---------------------------------------------------------------------------
    proves_too_much:
      verdict: breaks
      verdict_meaning: >-
        The failure signature is MET. The excursion procedure goes through on
        objects where its conclusion is known false. The argument "|z| > 3 at a
        resolved cell, hence a non-generic excess worth Stage R" therefore proves
        too much, and the observed excursions are not by themselves evidence of
        structure.
      PTM1_random_arms_read_as_structured:
        choice: own triple (the other two randoms, C_R = mean of two, SD = sqrt(1.5 V), 5 df), chosen before computing. The other-family option exists on only 16 of 165 curves.
        result: >-
          19 excursions of 329 resolved pseudo-cells (5.8%), 16 of them positive.
          By class: SS3 3/66, SS4 4/66, SS5 4/66, TT3 1/63, TT4 0/4, TT5 7/64. The
          most extreme are random_dick_r2 TT m 5 16b at z 10.77 and random_dick_r0
          SS m 5 18b at z 9.90, both from arms whose kappa is 1 by definition.
        nominal_for_the_same_statistic: 'G-POIS predicts 0.72 excursions (0.22%); G-NB 13.8 (4.2%); G-CP 15.4 (4.7%)'
        structured_arms_under_the_identical_statistic: '18 of 497 resolved pseudo-cells (3.6%): the known-null objects excurse MORE often than the structured arms'
        stage_R_on_R16_random_arms: '3 of 12 random-as-structured pseudo-cells have |z| > 3 (small_x-cell random_sub_r1 +5.15; dickson-cell random_dick_r0 +3.19; subgroup-m5-cell random_sub_r1 -4.67)'
      PTM2_synthetic_null_counts_through_the_pipeline:
        G-CP: {E_excursions: 4.50, P_ge_4: 0.656, E_selected: 3.40, per_cell_same_sign_replication_mean: 0.019, P_replicated_anomaly_per_pipeline: 0.117}
        G-NB: {E_excursions: 3.90, P_ge_4: 0.543, E_selected: 3.16, per_cell_same_sign_replication_mean: 0.017, P_replicated_anomaly_per_pipeline: 0.084}
        G-POIS: {E_excursions: 0.35, P_ge_4: 0.0004, P_replicated_anomaly_per_pipeline: 0.0005}
        nominal: per-cell |z| > 3 rate 0.0027; one-sided replication 0.00135
      where_the_argument_survives_on_known_false_objects: >-
        At A1's z, where three things meet. The count is in pair units, one
        relation contributing 2 to about 4|F| pairs. The variance comes from two or
        three random draws per curve, floored at the Poisson variance in those pair
        units. The 3-SD threshold is Gaussian. The same step is reused unchanged
        at Stage R, so Stage R inherits the miscalibration rather than correcting
        it.
      PTM3_planted_excess:
        method: >-
          The committed structured counts plus Poisson((kappa - 1) rbar_j), with the
          random arms unchanged. Stage R on synthetic fresh curves uses the G-CP null
          plus the same planted Poisson excess. Detection means the procedure leaves
          O-NULL: discovery z > 3 and Stage R z > 3. X is the smallest kappa in
          {1.1, 1.25, 1.5, 2, 3, 5} with P(detect) >= 0.5. The Stage R leg uses the
          cell's discovery-design random means as the fresh-curve proxy. A compound
          (bundle-shaped) planted excess gives the same X in 38 of 40 cells and a
          larger X in 2 (small_x SS m 5 and small_x TT m 5, both at 30 bits: 1.5 to
          2.0).
        X_per_class_m_at_30_and_32_bits_weakest_arm: {TT3: 1.5, TT4: 'not detectable at any kappa <= 5 (every TT m 4 cell at 30-32b is unresolved, C_R < 10)', TT5: 2.0, SS3: 1.25, SS4: 1.25, SS5: 2.0}
        X_per_arm_and_rung: {subgroup: {TT3: [1.25, 1.5], TT5: [2.0, 2.0], SS3: [1.25, 1.1], SS4: [1.25, 1.25], SS5: [1.5, 2.0]}, small_x: {TT3: [1.25, 1.5], TT5: [1.5, 2.0], SS3: [1.25, 1.1], SS4: [1.25, 1.25], SS5: [1.5, 1.5]}, dickson: {TT3: [1.25, 1.25], TT5: [2.0, 2.0], SS3: [1.25, 1.1], SS4: [1.25, 1.25], SS5: [2.0, 1.5]}, format: '[30 bits, 32 bits]'}
        X_at_the_excursion_rungs: {subgroup_TT_3_28: 1.25, small_x_SS_4_20: 1.5, dickson_SS_4_26: 1.25, subgroup_TT_5_16: 'not reached by 5 on the discovery-design proxy (C_R = 11.3; resolved in about a third of G-CP replicates). On the actual R16 design (C_R about 187), 05_j6_stageR.json gives kappa detectable with P 0.5 of 1.80-2.56.'}
        closure_scope: >-
          A closure statement can exclude, per (class, m), at most excesses kappa >=
          X on the tested arms at 30-32 bits. It cannot exclude smaller excesses.
          It covers nothing for TT at m = 4 or for TB (outside the family). X is
          measured in pair units: for SS m = 4 and 5 and TT m = 5, pair-level kappa
          mixes relation excess with multiplicity. Of the two excess forms tested,
          Poisson augmentation is the more detectable (the compound form raised X
          in 2 of 40 cells and lowered it in none), so X is optimistic for the
          procedure: it misses, with probability above one half, at least every
          excess below X.

  # ===========================================================================
  # red_team_report template fields (agents/red-team.md)
  objections:
    - id: OBJ-1 (J6)
      text: >-
        The excursion rule's per-cell false-positive rate on this design is
        0.010-0.034 at the four excursion cells (family mean 0.018-0.023) under
        nulls calibrated on the random arms, against the 0.0027 the 3-SD reading
        implies. E[#excursions | kappa = 1] = 3.5-4.5 and P(>= 4) = 0.47-0.66.
        O-EXCURSION carries no evidence of structure.
    - id: OBJ-2 (J6)
      text: >-
        Stage R reuses the same statistic, so its false-replication rate is
        0.6-5.6% per cell and 7-8% over the four cells (8-12% per full pipeline,
        PTM-2). The frozen REPLICATED-ANOMALY rule would have fired on noise at
        about this rate.
    - id: OBJ-3 (J7)
      text: >-
        Pairs, not relations, are counted. One relation is 3 pairs (TT at arity 2),
        up to 10 or more (TT at arity 3), and 4|F| - 2 (2-target SS relations at
        m = 4, 5). The C_R >= 10 resolution rule and the Poisson variance floor are
        both in pair units. Recounted in distinct relations: 0 excursions of 133
        computable cells.
    - id: OBJ-4 (J7)
      text: >-
        A_fix matches attempts, not exposure. Encodings at A_fix differ by base by
        up to about 10%, and the H1 mean scales as C(X, 2). Exposure accounts for
        about half of the dickson SS m 4, 26b excess.
    - id: OBJ-5 (J7, implementation)
      text: >-
        harvest.py end_attempt rebuilds an SS x-group only from the first sorted
        run that contains the x-key (`if x not in coll`). Members that sit in a
        later unmerged run are omitted, so pairs_raw undercounts C(k, 2). Census
        SS at A_fix is affected by 0.03-0.6% by m; SS at stop by up to 2.7%;
        never over. No excursion depends on it where it is computable. It belongs
        on the validity side of the round (not repaired here).
    - id: OBJ-6 (J6, O-GENERIC)
      text: >-
        "(1b) not met" is a point-estimate reading on one base (subgroup, m = 5,
        |delta| 0.0375 against 0.03). Its paired-bootstrap interval [-0.058, -0.016]
        straddles the threshold, and small_x m = 5 is inside it by 0.0025.
    - id: OBJ-7 (J6, O-GENERIC)
      text: >-
        The HEUR-4765e4-H1 rejections refute the Poisson law for PAIR counts, a
        law that fails for a uniformly random base by construction because the
        splittings of one relation are dependent coincidences. The H1 mean matches
        within 0-2% for TT|3, TT|5, SS|3, SS|4 and SS|5. Read as a refutation of
        the collision model's first moment, they are overread.
  required_controls:
    - A known-null arm scored by the identical statistic and df (a fourth random base per family, read as structured), so that the excursion rate has an in-design null. The frozen design has none; PTM-1 had to use 5 df.
    - A variance model calibrated on the random arms' measured pair dispersion, or the count moved to distinct relations, before any |z| threshold is read as a number of SDs.
    - An exposure-matched SS comparison (per encoding, or at a fixed number of encodings rather than attempts).
    - Retention of the rows needed to recount relations wherever a cell can enter the family (SS m 4 at 26-32 bits and SS m 5 at 26 and 30 bits are not recountable from the archive).
  counterexample_or_mutation: >-
    The random arms themselves, read as structured (PTM-1), are the counterexample.
    They are objects with kappa = 1 by definition, and on the committed rows they
    produce 19 excursions, including z = 10.77 and z = 9.90, where G-POIS predicts
    0.7. The mutation that removes the effect is the unit change to distinct
    relations: 0 excursions.
  cheapest_falsification:
    of_the_reading_that_the_excursions_are_evidence: >-
      Zero runs. Re-score the committed harvest rows in distinct relations per
      instance and re-apply A1 (02_bundles.py, then 03_j7_conventions.py ALT-a1;
      minutes of CPU). Done: no computable cell exceeds |z| 3. Also zero runs:
      PTM-1 on the committed random arms (09_ptm.py; seconds). Done: 5.8% of
      known-null pseudo-cells excurse.
    of_the_closure_reading_O_NULL_with_list: >-
      Planted excess (PTM-3, zero runs; done). Any closure asserting no excess
      below X per (class, m) is false by construction. The cheapest NEW-DATA
      experiment that could still overturn the non-detection is described here
      only as a design; it approves nothing. Take the one cell that survives any
      alternative (subgroup, TT, m 3, 28 bits: relation z 2.60; ALT-e2 z 3.12)
      and run it on ten fresh curves c = 10..19 as ten per-job census invocations
      (census --panel main --m 3 --bits 28 --curve-offset <c> --curves 1
      --known-log-max-bits 0 --arms subgroup random_sub_r0 random_sub_r1
      random_sub_r2 --workers 1 --out <job>/rows.jsonl --rows-out
      <job>/harvest-rows.jsonl --staircase-out <job>/staircase.jsonl). Score it
      in distinct TT relations per instance; at m = 3 TT rows are fully retained
      and relations equal informative rank. Use V = max(sum s_j^2, C_R) in
      relation units, with the |z| threshold fixed by PTM-1 on the same rows
      before reading. That design has about 0.5 power at relation-level
      kappa 1.12-1.15 (PTM-3 gives 1.25 at five curves).
  baseline_comparison: >-
    Outside these joints (no cost claim is under review in J6-J8). The only
    exponent read here is prediction (2)'s m = 4 harvest-on s3 exponent, 0.6076
    (interval 0.601-0.614). It stays above rho's 1/2. Nothing here implies an
    exponent below rho's.
  heuristic_challenges:
    - HEUR-4765e4-H1 as formally stated ("per-class coincidence counts are Poisson") is false for pair counts under the uniform model itself, because the splittings of one relation are separate, dependent coincidences. The testable version is a relation-level count, whose random-arm dispersion is 0.9-1.9, except SS m 4 at 13.2 (exposure variation is a candidate cause, not established). See OBJ-7.
    - HEUR-4765e4-H2 (kappa = 1 + O(N^(-1/2+eps))) is not testable for rate with this design. A2's null slope is -0.04 to -0.26, and the observed slopes are at the null.
  cost_model_challenges:
    uncharged_terms_found:
      - The multiplicity of the counting unit. One relation is charged as several pairs in kappa, in the resolution rule and in V, while the informative rank that A3 reports beside kappa counts it once. This is the uncharged term that manufactures the excursions.
      - Exposure. A_fix equalises attempts, not encodings. Per-attempt encodings vary with each base's early returns (a solve-speed variable), and pairs scale as X^2.
      - Variance degrees of freedom. Ten df from three randoms, floored at the Poisson variance in pair units. The null width of z is charged as 1 when it is 2-4 at the excursion cells.
      - The SS pair counter's run-split undercount (OBJ-5).
      - For the O-GENERIC readings (declared by the specification, restated for scope). S_3 excludes harvest wall time, certificate verification group operations and SS-store memory, which A9 reports; (1a) and (2) are S_3-count statements only.
  reduction_and_scope_challenges:
    - TW-SCOPE is binding. Every statement is scoped to the tested arms, TT and SS (TB where named), m = 3, 4, 5, 12..32 bits, one engine and generated prime-order curves. The inference from 30-32-bit cells to any larger N is none. Growth of kappa - 1 with N is untested beyond 32 bits, and A2 cannot see it on this design.
    - Any closure is limited per (class, m) to kappa >= X (PTM-3). TT at m = 4 is uncovered (unresolved at 30-32 bits), TB is outside the family, and X is in pair units.
  proof_architecture_challenges:
    - observation_fiber: >-
        The pair-level kappa does not separate more relations from more
        multiplicity per relation. small_x SS m 4, 20b has pair kappa 1.25 and
        relation kappa 1.08; subgroup TT m 5, 16b has 50 pairs from 8 relations.
        The missing separator is the distinct-relation count, or the informative
        rank before saturation.
    - quantifier_order: >-
        O-NULL quantifies over every resolved cell, but "resolved" (C_R >= 10) is
        decided after the random counts are seen. The family is data-dependent:
        166 cells are resolved in pair units, 133 of the computable cells in
        relation units, and in the null simulations resolution is re-drawn per
        replicate. A closure must name its cell family before reading.
    - nearby_object: PTM-1 (random arms read as structured) is the nearby object, and it excurses more often than the structured arms under the identical statistic.
  null_and_nearby_object_controls:
    checked:
      - G-POIS, G-NB, G-CP and G-RES nulls on the actual design, with dispersion-sensitivity variants (04, 13)
      - PTM-1, the random arms read as structured, at discovery (329 pseudo-cells) and on R16's random arms (12 pseudo-cells) (09)
      - PTM-2, the synthetic pipeline (09)
      - PTM-3, planted excess, Poisson and compound (09)
      - The unit control, relation recount of every computable cell (02, 03)
      - The randomized-PIT uniformity check under H1 (14)
    missing_in_the_frozen_design:
      - An in-design known-null arm scored with the frozen df
      - A dispersion-calibrated or relation-level variance model
      - Exposure matching for SS
      - Retention sufficient to recount SS m 4 at 26-32 bits and SS m 5 at 26 and 30 bits
  survival_statement: >-
    The producer's outcome is exactly what the frozen procedure outputs; I
    reproduce every number I used. As evidence, it does not survive in the
    strength the table gives it. The four excursions are what the null produces,
    and they vanish when the unit is changed to relations, so they are not
    structural. The Stage R non-replication does survive as a scoped
    non-detection, bounded by the Stage R upper bounds and by PTM-3's X per
    (class, m). No robust excess survived calibration in the other direction
    either: no cell shows an excess that the outcome table understates. Remaining
    uncertainty, named and not rounded away. (1) The subgroup TT m 3, 28b cell
    has a relation-level kappa of 1.196 (z 2.60) at discovery and 1.017 at
    Stage R. Pooled over ten curves it is 1.10 (z about 1.95), consistent with
    noise but not excluded above 1.10-1.14. (2) The dickson SS m 4, 26b cell cannot
    be recounted in relations from the archive. (3) The null generators are
    plug-in, with means and dispersion from the same random arms. G-CP
    extrapolates SS m 4 multiplicities from 24 bits to 26-32 bits. On real
    known-null data the generators under-predict the excursion count (13.8-15.4
    predicted against 19 observed), so the calibrated null rates above are, if
    anything, conservative. (4) TT and SS are simulated independently; the
    observed within-triple residual correlation is -0.02 to 0.11.
  prior_comparison: >-
    Against the Coordinator's pre-recorded prior (TASK-20260929-accb8e
    coordinator_prior). J6 is confirmed in direction and stronger in size:
    E[#excursions] is 3.5-4.5 (prior 1-4) and P(>= 4) is 0.47-0.66 (prior
    0.05-0.5). No replication at Stage R and weak Stage R power, as expected. A2
    is not decision-bearing, as expected. The A4 readings are seed-robust, as
    expected, and "(1b) not met" is point-only. J7 is overturned in mechanism.
    The structured arms are not more dispersed than the random arms (pooled
    ratio 0.31-1.28). The consequential convention is the counting unit and the
    pair-unit Poisson floor, not a structured-specific variance. Exposure is a
    second, smaller confound. J8 is confirmed. For proves-too-much, the first
    part is confirmed and stronger: random arms excurse more often than
    structured arms under the identical statistic. "Stage R's false-replication
    rate is near nominal" is overturned (per cell 0.6-5.6% against 0.135%;
    four-cell family 7-8%). Detectable excess is about kappa - 1 = 0.25-0.5 for
    TT at m 3 and 0.5-1.0 for TT at m 5, with TT at m 4 undetectable. For SS it
    is 0.1-0.25 at m 3, 0.25 at m 4 and 0.5-1.0 at m 5, so SS at m 5 is not
    smaller than TT, against the prior.
  narrowest_supported_statement: >-
    Per joint, as above. J6 breaks: the four R15 excursions are the null's
    expected count on this design (P(>= 4) 0.47-0.66), and a Stage R replication
    would have carried a 7-8% false-alarm rate. The non-replication bounds kappa
    below about 1.10-1.14 (subgroup TT m 3, 28b), 1.4-1.9 (subgroup TT m 5, 16b)
    and 1.0 (both SS m 4 cells). Every decision element is seed- and
    order-robust, and "(1b) not met" is point-only. J7 breaks: the excursion list
    is produced by the pair-counting unit and the Poisson floor, and in distinct
    relations no computable cell excurses. J8 holds. Proves-too-much breaks: the
    procedure excurses on known-null random arms more often than on the
    structured arms. Any closure is limited to kappa >= X per (class, m) at 30-32
    bits (TT3 1.5, TT5 2.0, SS3 1.25, SS4 1.25, SS5 2.0), with TT at m 4 not
    covered. All of this holds only for the tested arms, m = 3, 4, 5, 12..32 bits,
    this engine and these curves.
  next_concrete_action: >-
    For the Coordinator's composition. This is not a status recommendation.
    (1) Read the relation-level recount (03 ALT-a1) and the calibrated null tables
    (04, 05) beside R15 and R16. (2) Route OBJ-5, the SS pair-counter undercount,
    to the validity side of the round, where a correction record would belong.
    (3) If the residual uncertainty about subgroup TT m 3, 28b matters for any
    closure wording, the cheapest discriminating new-data design is the ten-curve
    relation-level check under cheapest_falsification. It would need its own
    protocol and approval.
