        design_evaluated_comparators_MC6_07_mc6_comparators:
          A2_null_slope: >-
            Under kappa = 1 on the actual design, the A2 slope centres at
            -0.10 to -0.27 (G-POIS), -0.12 to -0.21 (G-NB) and -0.04 to -0.21 (G-CP,
