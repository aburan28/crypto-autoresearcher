# =============================================================================
# REVIEW-ICPERF-20260915-a33cda -- JOINT R6, ADDENDUM 1
#
# ADDITIVE. review-plan-r6.yaml stands unchanged and remains the governing
# assignment. This file adds three leak sites its `blind_from` does not name,
# supplies a mitigation that survives them, and states plainly what R6 can and
# cannot be worth once they are known.
#
# Written 2026-09-16 by the coordinator, BEFORE TASK-20260915-abf147 was
# dispatched and therefore before its reviewer ran. It was written because the
# Coordinator checked, before dispatching, whether the quantity R6 is asked to
# derive blind is discoverable elsewhere in the repository. It is.
# =============================================================================

review_plan_joint_addendum:
  id: REVIEW-ICPERF-20260915-a33cda-R6-ADD1
  round_id: REVIEW-ICPERF-20260915-a33cda
  joint: R6
  extends: review-plan-r6.yaml
  assigned_to: TASK-20260915-abf147
  written_by: coordinator
  written_at: '2026-09-16'
  written_before_the_reviewer_ran: true
  modifies_the_original: false

  why_this_exists: >-
    review-plan-r6.yaml's `blind_from` lists the converter, the emitted engine scripts, the sibling
    reviewer's directory, the earlier review, review-plan.yaml, and the acceptance run's own results. That
    list was written on 2026-09-15 and was correct about every file it names. It is INCOMPLETE, and the
    Coordinator found this by grepping the repository for the value before dispatching rather than after
    the reviewer returned.

  leak_sites_found:
    - path: inputs/TRIMOSKA-ECICB-2024/source_record.yaml
      severity: HIGHEST
      what_it_carries: >-
        A block `macaulay2_1_22_F4_over_ZZ2_with_field_equations` reporting, for n15l5-1-S,
        `{cpu_s: 51.4, gb_size: 43, result: proper ideal}` and for n15l5-11-U `{gb_size: 1, result: unit
        ideal}` -- three of the four values R6 is asked to derive, for the exact instance it is asked to
        derive them for.
      why_it_is_the_worst_of_the_three: >-
        review-plan-r6.yaml SENDS THE REVIEWER TO THIS DIRECTORY. `where_to_read_the_instance` names
        inputs/TRIMOSKA-ECICB-2024/upstream/benchmarks/ and inputs/TRIMOSKA-ECICB-2024/upstream/, and
        source_record.yaml sits at the top of that tree, one `ls` above both. The assignment therefore
        directed the reviewer to within one directory listing of the answer while instructing it to
        derive that answer independently. No reviewer could be blamed for reading it.
    - path: experiments/EXP-ICPERF-e21835/specification.yaml
      severity: HIGH
      what_it_carries: >-
        The acceptance criteria state the expected values literally, including `gb_size == 43` and a
        summary line `gb_size = 43 / maxdeg = 2 / ...`. This is correct and necessary for a contract --
        an acceptance criterion has to say what it accepts.
      why_it_matters: >-
        `blind_from` excludes experiments/EXP-ICPERF-e21835/runs/ but not the specification above it, and
        the contract is among the first files any reviewer opens.
    - path: coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/dispatch_queue.json
      severity: STRUCTURAL AND UNFIXABLE
      what_it_carries: >-
        Prose in the batch's cards referring to `gb_size = 43`.
      why_it_cannot_be_blinded: >-
        TASK-20260915-abf147's own task card lives in this file. The reviewer must read its card to know
        its assignment, its write scope and its budget. A reviewer cannot be blinded from the document
        that assigns it. This is a property of putting numbers in coordination prose, not a mistake in
        this plan.
    - path: other records
      severity: MODERATE
      what_it_carries: >-
        EV-ICPERF-390707, DEC-20260915-428a17, MSG-20260915-4a9e9e, BATCH-a33cda/opening-report.md, and
        the TASK-20260915-7da7f1 snapshot receipt all quote the value. Named for completeness; none of
        them is a file R6 has any reason to open.

  blind_from_extended_by_this_addendum:
    - inputs/TRIMOSKA-ECICB-2024/source_record.yaml
    - experiments/EXP-ICPERF-e21835/specification.yaml
    - ledger/evidence/EV-ICPERF-390707.yaml
    - ledger/decisions/DEC-20260915-428a17.yaml
    - coordination/bus/messages/MSG-20260915-4a9e9e.yaml
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/opening-report.md
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/archives/TASK-20260915-7da7f1/
    - ledger/corrections/CORR-20260916-33068f.yaml
    - ledger/decisions/DEC-20260916-7b2235.yaml
    - coordination/goals/GOAL-ICPERF-e6b6a4/goal.yaml
  note_on_the_last_three: >-
    The two 2026-09-16 records and the goal head do not carry the Groebner values, and are listed because
    they summarise the sibling reviewer's findings, which R6 may not read. Excluding them costs R6 nothing
    it needs.
  the_one_that_cannot_be_extended: >-
    The dispatch queue. Instead of blinding the reviewer from its own assignment, the Coordinator supplies
    the assignment separately -- see `mitigation` -- and asks the reviewer NOT to open the queue file. If
    it opens it anyway to check a budget or a write scope, that is reasonable and is disclosed rather
    than treated as a failure.

  mitigation:
    name: PRE-REGISTER THE DERIVED VALUE BEFORE READING ANYTHING THAT COULD CARRY IT
    why_this_and_not_a_stricter_blind: >-
      In a repository where the answer appears in the contract, in an input source record, and in the
      assignment itself, a blind that depends on the reviewer never encountering the number is not a
      blind -- it is a hope. What CAN be protected is the ORDER: a value written down before any exposure
      is evidence regardless of what the reviewer reads afterwards, and it stays evidence even if the
      exposure turns out to have happened earlier than anyone realised.
    procedure:
      - >-
        Derive the four values by your own route, from the instance files alone, before opening any
        ledger record, contract, evidence record, or coordination document.
      - >-
        The moment your engine returns, write the four values to
        coordination/review/icperf-20260915-a33cda/TASK-20260915-abf147/PREREGISTERED-VALUES.json,
        together with a UTC timestamp, the engine and version, the monomial order, the exact command, and
        the sha256 of the engine input you emitted. WRITE-ONCE: do not edit it afterwards for any reason,
        including to fix a typo -- append a second file if you must correct something.
      - >-
        Only after that file exists may you read anything else you need, including the extended
        blind_from list if you wish to check what you were meant to avoid.
      - >-
        Then run the perturbed control from review-plan-r6.yaml. Its value is UNAFFECTED by every leak
        above: no file in this repository records the Groebner basis of a deliberately perturbed
        n15l5-1-S, so it cannot be looked up, and it remains a genuine test of whether your pipeline
        reads what it claims to read.
    what_this_buys: >-
      The perturbed control stays fully blind. The unperturbed derivation becomes a pre-registered
      independent computation rather than a blind one, which is weaker but still discriminating: a
      wrong-but-self-consistent converter in this program's implementation would still disagree with an
      independent parse, and the pre-registration timestamp is what makes the agreement or disagreement
      readable.

  how_the_coordinator_will_weigh_R6_NOW:
    if_agreement: >-
      Recorded as agreement between two independent implementations, with the caveat that the value was
      discoverable in the repository and the strength of the agreement rests on the pre-registration and
      on the perturbed control -- not on an unbreached blind. This is a REDUCTION in evidential strength
      from what review-plan-r6.yaml anticipated, and the composition will say so in those words rather
      than reporting a blind re-derivation it did not get.
    if_disagreement: >-
      Then the leak has cost nothing at all and the joint has done its whole job: disagreement localises
      to one of two named implementations and is the most valuable outcome available here.
    if_the_perturbed_control_returns_an_identical_basis: >-
      Unchanged from the original plan: the reviewer's own pipeline is suspect and its unperturbed number
      may not be cited. The leak does not soften this.
    if_the_reviewer_discloses_reading_a_leak_site: >-
      Weighed against WHEN, using PREREGISTERED-VALUES.json. Exposure after pre-registration costs the
      joint nothing. Exposure before it means the unperturbed number is reported as informed rather than
      independent, and the perturbed control carries the joint alone.

  coordinator_prior_on_this_addendum:
    recorded_before_the_reviewer_ran: true
    prior: >-
      The Coordinator expects the reviewer to reach agreement on cardinality and maximal degree, and
      expects the perturbed control to discriminate. It expects the quotient dimension (value 4 of the
      four requested) to be the one an engine most often declines to report, and considers
      `not_reported` a complete answer there rather than a gap.
    prior_on_the_leak_itself: >-
      The Coordinator expects the reviewer to encounter at least one leak site despite this addendum,
      most likely inputs/TRIMOSKA-ECICB-2024/source_record.yaml, because the assignment sends it into
      that tree. A disclosure of exactly that is the expected outcome and is not a failure of the
      reviewer.
    what_would_overturn_this_prior_and_be_more_informative: >-
      A disagreement on cardinality. The Coordinator's stated expectation of agreement is exactly the
      kind of prior that makes an agreeing review uninformative, which is why it is written here before
      the reviewer runs.

  forward_guidance_for_the_program:
    - >-
      A BLIND ASSIGNMENT MUST BE GREPPED BEFORE IT IS DISPATCHED. `blind_from` was authored from knowledge
      of which files were RELEVANT, not from a search for which files CONTAIN THE VALUE. Those differ, and
      the difference is mechanical to check: search the repository for the quantity, then write the list.
    - >-
      DO NOT PUT MEASURED VALUES IN COORDINATION PROSE. A number in a task card, a batch opening report or
      a bus message cannot be un-read by the agent the card assigns. Cite the record that holds the value
      instead; a pointer costs nothing and does not leak.
    - >-
      A SOURCE RECORD FOR AN UPSTREAM INPUT IS NOT A NEUTRAL FILE. This program's own measurements were
      recorded into inputs/TRIMOSKA-ECICB-2024/source_record.yaml alongside upstream's, which is
      reasonable bookkeeping and makes the input tree unsafe to send a blind reviewer into. Internal
      measurements about an input belong in an evidence record that points at the input.
    - >-
      PRE-REGISTRATION IS THE FALLBACK WHEN A BLIND CANNOT BE GUARANTEED, and it is cheap enough to be
      the default for every blind re-derivation from now on -- worth doing even when the blind looks
      airtight, because that is exactly when a leak goes unnoticed.
