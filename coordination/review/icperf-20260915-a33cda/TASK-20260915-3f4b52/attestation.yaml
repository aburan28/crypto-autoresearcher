  verdict_basis:
    R1: >-
      Regenerated n15l5-1-S.m2 with the repaired converter from a /tmp copy;
      sha256 b8c85403… equals the committed run script. Direct Macaulay2 run:
      exit 0, stderr empty, `RESULT gb_size=43 cpu_s=47.974 maxdeg_gb=2
      is_unit=false`; the regex at bench.py:579 (accepted bytes d835b1ea…)
      matches it. Harness row read from results_engine.jsonl: gb_size 43,
      engine_cpu_s 46.5714, maxdeg_gb 2, unit_ideal false. The Coordinator's
      exponent-format suspicion was tested (M2 prints reals without an
      exponent across 4e-6 … 1.2e6) and not borne out. Open: R6's independent
      basis, which I may not see (report §2, §8).
    R2: >-
      Live child under the repaired harness shows `Max address space
      unlimited` in /proc/<pid>/limits; my own 12 GiB resident hog was killed
      at 8.044 GiB (SIGTERM, rss_limit_breached true) at the DECLARED 8 GiB,
      not the run's scaled 2 GiB; my 64 GiB PROT_NONE reserver survived at 394
      MiB; M2 peak_rss_kb 6.58 GiB vs external VmHWM 6.59 GiB (0.16 %). Two
      findings the plan's wording does not survive: (a) pgid_rss_kb DOES sum
      COW-shared anonymous pages twice after fork (demonstrated,
      artifacts/r2/fork_share_out.txt) — threads are not double counted; (b)
      ADD1-a: worst measured inter-poll growth 1.40 GiB per 0.25 s, so the
      kill decision can occur at up to ~9.4 GiB and a SIGTERM-ignoring child
      at ~10.4 GiB (arithmetic, not measured). Both in the conservative
      direction for the limit; neither is what the joint literally states
      (report §3).
    R3: >-
      Frozen summary.py reproduces the archived RUN-ICPERF-305ca3 summary.json
      byte-for-byte; repaired summary.py over the same results.jsonl gives a
      cells block identical at 186/186 leaves; 156/156 under the recovered
      definition, 180/180, 158/158; the four l=6 pure-CNF ratios are four
      distinct values matching my own all-10/matched-5 recomputation; deletion
      controls P3–P6 each report `holds: null` with an explicit `unevaluable`
      record. Overturns two priors: 156 IS reconstructible
      (work/v3_celldiff.py over work/v3_reduce.json — not the
      artifacts/v3_reduce.json the contract cites); P3 aggregates None→null,
      not false. ADD1-c: the 12 ABSENT-vs-null diffs are P2 ratio keys, a
      reporting-surface consequence of D3b/c with no production key-iterating
      consumer; benign (report §4).
    R4: >-
      Frozen probe under an unwritten-pipe stdin: Singular blocks in
      pipe_read, single process, no children (/usr/bin/Singular is a direct
      ELF, not a forking wrapper); returns at 60.06 s with `unavailable: …
      timed out`. Repaired probe under the identical launch returns
      `Singular 4.3.2` in 0.008 s. ADD1-d overturned: c9590f was SIGINT'd 12.9
      s after launch (launch_time.txt 10:22:40.07Z; bench_stderr.log last write
      10:22:52.96Z, KeyboardInterrupt traceback) — the 60 s timeout never had
      the chance to fire, and the contract's "~4 minutes" has no artifact
      behind it. The D4 pipe-drain rationale does not describe Python 3.12's
      subprocess.run (read /usr/lib/python3.12/subprocess.py:551–564)
      (report §5).
    R5: >-
      HOLDS on the measurement package: frozen tree hashes equal
      TASK-20260913-f8bdec's path_sha256; `git status --porcelain
      experiments/EXP-ICPERF-66fd51` empty; repaired hashes equal
      CODE_SHA256.json; code hashes invariant across ecdd3bffd → 6ad48e04c →
      2bfdc65b → 5fa8ffed8; both archived summary.json unchanged; manifest
      checklist complete except for what epoch 2 itself discloses. BREAKS on
      two clauses of the joint as stated: (a) C-BYTE "exactly one declared
      defect per hunk" is not met at hunk granularity — 5 of 13 bench.py hunks
      draw lines from 2–3 defects (line-level attribution to D1–D5 is
      complete; 0 unattributable lines); (b) custody: the committed run
      manifest.yaml was edited in place by a concurrent session (3dc30bfcf)
      and restored by merge during this review window; bench.py in the
      repaired tree changed (e1728d8a8, "D6") after the run and during review;
      epoch 1's recorded commit does not contain the bytes that ran. ADD1-e:
      Coordinator authorship of manifest.yaml is objected to as a custody
      compromise; its contents were checked and are accurate;
      `PASS_WITH_DECLARED_DEVIATION` is outside the contract vocabulary
      (report §7).

  proves_too_much_object_1:
    object: acceptance procedure applied to the UNREPAIRED experiments/EXP-ICPERF-66fd51/code/ tree
    result: discriminates
    detail: >-
      Every criterion that should fail on the frozen tree fails. A1: direct M2
      exits 1 with `syntax error at '='` after the computation (164 CPU-s);
      through the frozen harness exit -6 / std::bad_alloc at 2.70 GiB under
      RLIMIT_AS 6 GiB (D2 masks D1, as the contract says). A4(ii): reserver
      mmap fails at chunk 0, errno 12, `Max address space 6442450944`. A4(i):
      hog dies with OSError errno 12 at 5.9 GiB, no rss_limit_breached field.
      A6: all four l=6 ratios equal 83.50030889840438; P5.cells has no
      Groebner entry and holds:true; P6 top-level holds:true with n19l6 null.
      A5 FAILS BUT NOT AS DECLARED: the frozen probe is bounded at 60 s per
      engine and returns `unavailable`; the criterion fails on the Singular
      string and (barely) on the 60 s bound, not on "not returning". A6's
      numeric-agreement clause passes on the frozen tree BY DESIGN (it is
      C-SUMREG's control) and is not a discriminator; it must not be counted
      as evidence for the repair (report §6).

