  proves_too_much:
    required: true
    objects:
      - owner: TASK-20260915-3f4b52
        object: >-
          THE ACCEPTANCE PROCEDURE APPLIED TO THE UNREPAIRED INSTRUMENT. Run the
          same acceptance criteria against the FROZEN
          experiments/EXP-ICPERF-66fd51/code/ tree: A1 (M2 RESULT line), A4 (the
          two watchdog directions), A5 (the probe), A6 (the reduction over the
          frozen results.jsonl). Every one must FAIL, and fail in the specific
          way its defect predicts: A1 with a parse error after the computation;
          A4's address-space direction killed by RLIMIT_AS; A5 not returning;
          A6 emitting the single repeated 83.50030889840438, no record of P5's
          skipped Groebner clause, and P6 `holds: true` with n19l6 dropped.
        why_this_object: >-
          An acceptance procedure that passes the instrument it is supposed to
          reject has measured nothing, and it is the cheapest way for a repair
          to look verified: check something that was never broken. This is
          controls-before-belief applied to the ACCEPTANCE ARGUMENT rather than
          to a measurement -- the known-false object is the unrepaired tree,
          whose conclusion ("the instrument is fit") is known false.
      - owner: TASK-20260915-abf147
        object: >-
          THE BLIND RE-DERIVATION APPLIED TO A PERTURBED SYSTEM. Take the same
          upstream instance, alter it minimally and deliberately (add one
          monomial to one equation, or drop one equation), and re-derive the
          basis by the identical route. The result must DIFFER from the
          unperturbed one -- in size, in maximal degree, or by becoming the unit
          ideal. Report both derivations side by side and the exact perturbation.
        why_this_object: >-
          R6's whole value is that it reads the upstream system rather than the
          converter's output. A pipeline that returns the same basis for a
          perturbed system is not reading the system it claims to read -- it is
          reading a cached file, a wrong file, or a default. Without this
          control an agreeing R6 is indistinguishable from an R6 that computed
          nothing.
    failure_signature: >-
      Any acceptance criterion PASSING against the frozen tree; the perturbed
      system yielding an identical basis size and maximal degree.
    what_a_failure_means: >-
      Object 1: the acceptance is uninterpretable and the instrument is NOT
      accepted until the criterion that passed wrongly is replaced -- a criterion
      that cannot distinguish repaired from unrepaired is not evidence about the
      repair. Object 2: R6 is INCONCLUSIVE and its agreement may not be cited in
      the composition; the converter question stays open and a successor task
      owns it.
    assigned_to: [TASK-20260915-3f4b52, TASK-20260915-abf147]
  blind_rederivation:
    required: true
    quantity: >-
      The reduced Groebner basis of the n15l5-1-S Weil-descent system over GF(2)
      with the field equations appended: its cardinality, its maximal element
      degree, whether it is the unit ideal, and the quotient dimension where the
      engine reports it.
    assigned_to: TASK-20260915-abf147
    blind_from:
      - experiments/EXP-ICPERF-e21835/code/convert.py
      - experiments/EXP-ICPERF-66fd51/code/convert.py
      - every emitted .m2 and .sing script under either contract
      - coordination/review/icperf-20260913-66fd51/TASK-20260915-195b0c/
      - coordination/review/icperf-20260915-a33cda/review-plan.yaml
      - coordination/review/icperf-20260915-a33cda/TASK-20260915-3f4b52/
    reason: >-
      The quantity is load-bearing: the whole claim that the Groebner column is
      now measurable rests on the repaired converter emitting the RIGHT ideal,
      and the existing corroboration (Macaulay2 F4 and Singular slimgb agreeing
      on gb_size = 43) reproduces a converter defect faithfully because both
      engines read that converter's output. Recomputing from the producer's
      artifacts is replication and cannot see this; re-deriving from the upstream
      instance can. Agreement is then evidence about the ideal; disagreement
      localises to the converter.
