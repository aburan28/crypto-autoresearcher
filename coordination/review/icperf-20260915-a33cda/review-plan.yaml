review_plan:
  id: REVIEW-ICPERF-20260915-a33cda
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-a33cda
  reviews: >-
    RUN-ICPERF-a4a24b, the instrument acceptance run of EXP-ICPERF-e21835, and
    the repaired code tree experiments/EXP-ICPERF-e21835/code/, snapshot-archived
    by TASK-20260915-7da7f1 before either reviewer runs.
  written_by: coordinator
  written_at: '2026-09-15'
  written_before_any_reviewer_ran: true
  written_before_any_reviewer_ran_evidence: >-
    Written when BATCH-a33cda was OPENED, before the executor task
    TASK-20260915-4f4027 was dispatched and therefore necessarily before either
    reviewer ran: at the moment of writing, RUN-ICPERF-a4a24b does not exist and
    experiments/EXP-ICPERF-e21835/code/ is empty. TASK-20260915-3f4b52 and
    TASK-20260915-abf147 are `queued` with no lane claim and both depend on
    TASK-20260915-7da7f1, which depends on the executor.

    WHAT THE COORDINATOR HAS READ, honestly. The four frozen code files
    (convert.py, bench.py, summary.py in full at the defect sites; binec.py
    not re-read for this batch); both validator reports of
    REVIEW-ICPERF-20260913-66fd51 and the composed EV-ICPERF-390707 and
    DEC-20260915-87360d; RUN-ICPERF-c9590f/ABORTED.md; the frozen contract and
    the weakened hypothesis. It has NOT run the repaired converter (it does not
    exist), has NOT re-run Macaulay2 or Singular in this batch, has NOT executed
    v3_reduce.py, and has NOT written any part of the repair -- the executor
    writes it. The Coordinator WROTE the frozen tree's four files and therefore
    wrote three of the four defects under repair; that concentration is
    disclosed under `blindness` as this round's principal weakness and is the
    reason joint R6 exists.
  why_this_round_exists: >-
    The acceptance of a repaired INSTRUMENT gates two things: whether
    EXP-ICPERF-13f001 is approved (its precondition AP-1) and whether the
    Groebner column of the RQ-ICPERF-94c86e boundary table is declared
    measurable on this host. Both are claim-changing under AGENTS.md "Review
    architecture", so the round runs under a plan written first.

    It is NOT a breakthrough claim: no exponent, no curve, no published result
    contradicted, nothing promoted. `review-adversarial` at xhigh; AGENTS.md
    rule 12 does not apply and `review-breakthrough` is not requested.

    The specific reason care is warranted: RUN-ICPERF-305ca3 spent an
    eight-hour executor budget and returned a zero Groebner column for TWO
    independent instrument reasons, one of which no memory limit could have
    rescued, and its own summary reported three predictions as holding that
    were partly unevaluated. A producer's self-check did not catch either. A
    repaired instrument accepted on the repairer's own self-check would be the
    same failure a second time, at 60 instances instead of one.
  claim_under_review: >-
    As EXP-ICPERF-e21835's success_criterion words it, and as the executor will
    state it in acceptance-report.md: a code tree exists whose every diff from
    the frozen tree is attributable to a declared defect D1-D5; the repaired
    Macaulay2 path emits a RESULT line that bench.py parses into a row carrying
    a basis size, engine CPU seconds and a maximal degree; the memory limit is a
    resident-set watchdog that kills a resident hog and does not kill an
    address-space reserver; the repaired reduction reproduces 156 of 156
    independently computed per-cell values while reporting what it cannot
    evaluate; and the environment probe returns under an inherited-stdin launch.
    The executor claims no acceptance and forms no conclusion; the Coordinator
    composes.
  coordinator_prior:
    stated_before_any_report: true
    general: >-
      I EXPECT THE INSTRUMENT TO BE ACCEPTED WITH ONE OR TWO REPORTING-UNIFORMITY
      DEFECTS OUTSTANDING, and I expect the two most likely failures to be in
      places the defect list does not name: the RESULT line's byte format (R1)
      and the fourth aggregation site the review named only implicitly (R3). I
      am recording specific, checkable suspicions rather than a general
      expectation of success, so that a reviewer who finds none of them has told
      me something.
    on_R1_the_macaulay2_report_line:
      expectation: >-
        I EXPECT THE IDENTIFIER RENAME TO BE SUFFICIENT FOR MACAULAY2 AND THE
        RESIDUAL RISK TO BE IN THE REGEX, NOT IN THE PARSER. The validator
        already performed this exact repair and got
        `RESULT gb_size=43 cpu_s=47.7616 maxdeg_gb=2 is_unit=false` at exit 0
        (EV-ICPERF-390707 joint V2, run C5), so M2 accepts `gensG`. What has not
        been demonstrated END TO END is that bench.py's regex
        `RESULT gb_size=(\d+) cpu_s=([\d.]+) maxdeg_gb=(\d+) is_unit=(true|false)`
        matches the line the REPAIRED converter emits from the REPAIRED harness.
        My named suspicion: a `cpu_s` value that M2 prints in a form `[\d.]+`
        does not match (scientific notation, or an integer-typed zero-width
        case), or a reordered/reworded RESULT line, producing a row that ran F4
        successfully and still records null gb_size. That failure looks exactly
        like the defect being repaired and would be easy to miss by reading the
        M2 stdout instead of the harness row.
      what_would_change_my_mind: >-
        The reviewer showing the harness ROW (not the M2 stdout) carrying
        non-null gb_size, engine_cpu_s and maxdeg_gb, with the raw line quoted
        and matched against the regex it must satisfy.
    on_R2_the_resident_set_watchdog:
      expectation: >-
        I EXPECT DIRECTION (i) TO PASS EASILY AND THE REAL RISK TO BE DOUBLE
        COUNTING. Macaulay2's F4 is multi-threaded on this host (170.56 CPU-s
        against 49.97 wall). A watchdog that sums RSS over /proc entries can
        double count in two ways: threads of one process each report the
        process's VmRSS, and a parent and child sharing pages after fork each
        report the shared pages. Either would make a legitimate 6.7 GiB row look
        like 13 GiB and kill it at an 8 GiB limit -- which reproduces the
        original defect's SYMPTOM (a Groebner row dying young) under a new
        cause, and would be recorded as a repair. I also expect the polling
        interval to matter less than it looks: the 12 GiB control allocates in
        increments, so any interval under a second catches it.
      what_would_change_my_mind: >-
        A watchdog that enumerates only real processes (not threads) and
        accounts for shared pages, demonstrated by the reviewer's own reading of
        the implementation AND by the measured peak on the M2 row landing in
        [5.5, 7.5] GiB rather than near double it.
      second_check_i_want: >-
        That RLIMIT_AS is set NOWHERE in the repaired tree, checked at RUNTIME on
        a live child (/proc/<pid>/limits) and not only by grep.
    on_R3_the_reduction:
      expectation: >-
        I EXPECT THE THREE DECLARED SITES TO BE FIXED AND THE UNIFORM RULE NOT
        TO BE UNIFORM. The declared defects are P3c's leaked loop variable,
        P5's never-evaluated Groebner clause and P6's dropped cell. There is a
        FOURTH site of the same family that the review named only implicitly:
        P3's top-level `holds` is `all(v["holds"] for v in p3.values())`, which
        treats a `None` as FALSY and would report P3 FALSE where it should
        report null -- the mirror image of P6's bug and arguably worse, because
        it manufactures a falsification. P4 uses P6's dropping rule. My
        prediction is that the executor fixes exactly the three named sites and
        leaves P3's aggregation reporting false-for-null.
      what_would_change_my_mind: >-
        A reviewer-constructed input in which one clause of each of P3, P4, P5
        and P6 is unevaluable, showing all four report `holds: null` and an
        explicit `unevaluable` list. This is cheap to build from the frozen
        results.jsonl by deletion and is the check I most want run.
      also: >-
        That no median, ratio or threshold moved: 156 of 156 against
        v3_reduce.json, and every remaining diff from the frozen summary.json
        attributable to a declared site or a new field.
    on_R4_the_version_probe:
      expectation: >-
        I EXPECT THE HANG TO REPRODUCE, THE DEVNULL FIX TO BE NECESSARY, AND
        DEVNULL ALONE TO BE POSSIBLY INSUFFICIENT. The frozen `ver` already
        passes `timeout=60`, and RUN-ICPERF-c9590f still hung for roughly four
        minutes before an external interrupt. So the timeout either did not fire
        or did not help. My reading: `subprocess.run(capture_output=True,
        timeout=...)` kills only the DIRECT child and then re-enters
        communicate() to drain the pipes; if `Singular` on this host is a
        wrapper script that execs the real binary, the surviving grandchild
        holds the write end of stdout and the drain blocks forever AFTER the
        timeout has fired. If that is right, the honest fix needs
        `start_new_session=True` and a process-group kill, and a repair that
        only adds DEVNULL passes A5 today and hangs the first time an engine
        forks.
      what_would_change_my_mind: >-
        The reviewer showing that `Singular` on this host is a single execve (no
        wrapper, no fork) and that the frozen probe's timeout does fire cleanly
        when stdin is a pipe nobody writes to -- in which case inherited stdin
        alone is the whole story and DEVNULL alone is the whole fix.
      what_i_want_measured: >-
        The frozen probe reproduced under a CONTROLLED inherited-stdin launch
        with a wall bound, so the defect is a measurement and not an inference
        from one aborted run; then the repaired probe under the identical
        launch.
    on_R5_scope_and_custody:
      expectation: >-
        I EXPECT THIS JOINT TO PASS AND TO BE THE LEAST INFORMATIVE, and I am
        saying so in advance so that a finding here counts for more, not less.
        The frozen tree's four hashes are recorded in TASK-20260913-f8bdec and
        the repaired tree is a copy plus small diffs. The one thing I genuinely
        do not know is whether the executor confined its writes: the acceptance
        run regenerates a summary over RUN-ICPERF-305ca3's frozen results.jsonl,
        and the frozen summary.py's own `main` WRITES summary.json INTO THE RUN
        DIRECTORY it is given. A repaired summary.py that keeps that behaviour
        and is pointed at the archived run would overwrite an archived
        artifact. That is my one real suspicion here and it is exactly what
        C-NOWRITE exists to catch.
      what_would_change_my_mind: >-
        Nothing needs to change my mind for a pass; a `git status --porcelain
        experiments/EXP-ICPERF-66fd51` that is empty AND four sha256 values
        matching the archive settles it.
    on_R6_the_blind_rederivation:
      expectation: >-
        I EXPECT gb_size 43, maxdeg 2, NOT the unit ideal, vdim 3 -- and I want
        this joint anyway, because the existing agreement is weaker than it
        looks. Macaulay2 F4 and Singular slimgb agreed on gb_size = 43, and both
        read files produced by THE SAME CONVERTER (convert.py's magma_to_m2 and
        magma_to_singular, from the same parse_magma). A converter that dropped
        or duplicated an equation would produce two files describing the same
        WRONG ideal, and two engines would agree on its basis. The only check
        that separates a converter defect from a correct one is a re-derivation
        from the UPSTREAM source by an agent that has not read the converter.
      what_would_change_my_mind: >-
        A different basis size or maximal degree, or the unit ideal, from an
        independent conversion -- which would mean the agreeing engines agreed
        about the wrong ideal and that BOTH the frozen and repaired converters
        are suspect. That outcome would block the acceptance outright and is a
        live possibility, not a formality.
      note_on_blindness: >-
        The expected numeric value is stated HERE, in the plan
        TASK-20260915-abf147 does not read. Its assignment is the separate file
        review-plan-r6.yaml, which carries no expected value.
    what_i_expect_the_composition_to_be: >-
      INSTRUMENT ACCEPTED, with one or two reporting-uniformity defects recorded
      as owed and carried into EXP-ICPERF-13f001 rather than blocking it; the
      Groebner column declared MEASURABLE AT (15,5) ONLY, with l = 6 explicitly
      unknown and expected censored; EXP-ICPERF-13f001 approved subject to AP-2,
      AP-3 and AP-4 remaining open; and an evidence record (EV-ICPERF-433fa5)
      whose direction is `neutral` with respect to every hypothesis, because an
      instrument acceptance supports no prediction. If R6 disagrees on the
      basis, none of that happens and the composition is a block with a
      converter investigation as its successor.
  joints:
    - joint: >-
        R1 -- THE MACAULAY2 REPORT LINE, END TO END. That the repaired converter
        emits a script Macaulay2 parses without error, that its RESULT line
        matches the regex bench.py actually uses, and that the resulting HARNESS
        ROW carries a non-null basis size, engine CPU time and maximal degree
        agreeing with two independent prior measurements (gb_size 43, maxdeg 2,
        non-unit).
      assigned_to: TASK-20260915-3f4b52
      attack_plan: >-
        (1) Generate the .m2 script for n15l5-1-S with the REPAIRED converter
        yourself and diff it against the committed
        experiments/EXP-ICPERF-66fd51/scripts/ form (or regenerate the frozen
        one) so the change is exactly the identifier. (2) Run `M2 --script` on
        it directly, capture stdout and stderr verbatim, and confirm no parse
        error at any line -- including after the computation, which is where the
        frozen defect fired. (3) QUOTE the RESULT line and test it against the
        regex in the repaired bench.py, character by character; report the regex
        as it appears in the repaired file, not as this plan quotes it. (4) Then
        run the acceptance path through the harness and read the ROW out of
        results.jsonl: gb_size, engine_cpu_s, maxdeg_gb, status. A row with null
        gb_size after a successful M2 exit is the failure I predicted. (5)
        Compare the three values against EV-ICPERF-390707 joint V2's C5 run and
        against joint R6's independent result if the composition has it.
      breaking_artifact: >-
        A parse error anywhere in M2's stderr; a RESULT line the repaired
        harness's own regex does not match; a harness row with null gb_size,
        engine_cpu_s or maxdeg_gb after M2 exit 0; a gb_size other than 43 or a
        maxdeg other than 2 on n15l5-1-S.
      holding_artifact: >-
        The generated script and its diff, M2's verbatim stdout/stderr, the
        quoted RESULT line beside the quoted regex, and the parsed harness row.
    - joint: >-
        R2 -- THE MEMORY LIMIT IS A RESIDENT-SET LIMIT, AND IT IS NOT DOUBLE
        COUNTING. That RLIMIT_AS is set nowhere at runtime; that the watchdog
        kills a resident hog and does NOT kill an address-space reserver; that
        its RSS accounting does not double count threads or shared pages; and
        that peak RSS is a high-water mark.
      assigned_to: TASK-20260915-3f4b52
      attack_plan: >-
        (1) Write your OWN two null objects rather than reusing the executor's:
        (i) a process that touches 12 GiB resident in <= 256 MiB increments,
        (ii) a process that mmaps >= 64 GiB PROT_NONE (or reserves equivalently)
        and touches < 512 MiB, each printing its own /proc self status at
        intervals. Run both under the repaired harness's limit path at the
        declared 8 GiB and report kill/no-kill, recorded peak, and
        rss_limit_breached. (2) On a live child of the harness, read
        /proc/<pid>/limits and report the Max address space line -- a grep of
        the source is not the check. (3) Read the watchdog's RSS accounting and
        state whether it enumerates threads (task/) or processes, and how it
        treats pages shared between a parent and a forked child; then
        DEMONSTRATE the answer by comparing its reported peak for the M2 row
        against /usr/bin/time -v (or your own poller) for the same invocation.
        (4) Confirm the recorded value is a maximum over samples, not the last
        sample, by checking a row whose RSS falls before exit.
      breaking_artifact: >-
        RLIMIT_AS set on a live child; the address-space reserver killed; the
        resident hog surviving; a reported peak more than 25% above an
        independent measurement of the same invocation (the double-counting
        signature); a recorded peak equal to a late sample rather than the
        maximum.
      holding_artifact: >-
        Your two control programs and their outcomes, the /proc limits readout,
        the accounting analysis with its demonstration, and the two peak-RSS
        measurements side by side.
    - joint: >-
        R3 -- THE REDUCTION REPORTS WHAT IT CANNOT EVALUATE, UNIFORMLY, AND
        MOVES NO NUMBER. That the repaired reduction reproduces 156 of 156
        independently computed per-cell values; that the four l = 6 pure-CNF
        ratios are four distinct correct values; that an unevaluable clause is
        reported as such; and that the uniform rule holds for EVERY prediction,
        not only the three named sites.
      assigned_to: TASK-20260915-3f4b52
      attack_plan: >-
        (1) Run the repaired reduction over
        experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/results.jsonl IN
        YOUR OWN SCRATCH DIRECTORY and confirm it writes nothing into the
        archived run (this is also R5's concern; report what you observe). (2)
        Diff its per-cell numeric values against
        coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/artifacts/v3_reduce.json
        and report the count agreeing to the last printed digit out of 156. (3)
        Diff it against the frozen summary.json and attribute EVERY difference
        to a declared defect site or a new reporting field; an unattributable
        difference is a moved number and breaks the joint. (4) THE CONTROL I
        MOST WANT: construct four derived input tables from the frozen
        results.jsonl by DELETING rows, one per prediction, so that exactly one
        clause of P3, of P4, of P5 and of P6 becomes unevaluable; run the
        repaired reduction on each and report, per prediction, whether it
        emits `evaluated: false` with a reason, an explicit `unevaluable` list,
        and top-level `holds: null`. Report P3's aggregation specifically: does a
        None make it null, or false? (5) Report the four l = 6 pure-CNF ratios
        and check them against 10.396 / 34.472 / 67.460 / 83.500 (all-10) and
        26.071 / 34.468 / 327.664 / 82.629 (matched subset).
      breaking_artifact: >-
        Fewer than 156 of 156 agreeing; any unattributable difference from the
        frozen summary.json; any prediction that reports `holds: true` or
        `false` while one of its clauses is unevaluable; four ratios that are not
        four distinct values matching the reference; anything written into the
        archived run directory.
      holding_artifact: >-
        The 156-value diff table, the attributed diff against the frozen
        summary, the four deletion-derived inputs with their outputs, and the
        ratio table.
    - joint: >-
        R4 -- THE ENVIRONMENT PROBE, DEFECT AND REPAIR, BOTH MEASURED. That the
        frozen probe hangs under a controlled inherited-stdin launch; that the
        repaired probe returns bounded under the identical launch with a nonempty
        Singular version; and that the mechanism is understood well enough to
        say why the frozen code's own 60 s timeout did not save
        RUN-ICPERF-c9590f.
      assigned_to: TASK-20260915-3f4b52
      attack_plan: >-
        (1) Read RUN-ICPERF-c9590f/ABORTED.md and bench_stderr.log, then
        REPRODUCE the defect deliberately: launch the FROZEN environment() (or a
        minimal equivalent that calls the frozen `ver`) from a process whose
        stdin is inherited from a terminal or an open pipe nobody writes to,
        under your own wall bound, and report what happens and when. Do not
        infer the defect from the aborted run alone. (2) Determine whether
        `Singular` on this host is a wrapper that forks/execs another binary
        (`file $(command -v Singular)`, `readlink -f`, `strace -f` or a process
        tree during the hang) and report the process tree you observe while it
        is hung. (3) State why `timeout=60` did not bound it -- the direct-child
        kill followed by a pipe drain held open by a surviving grandchild is my
        hypothesis and you should confirm or refute it. (4) Run the REPAIRED
        probe under the identical launch; report wall time per engine and the
        Singular version string. (5) Say whether the repair is sufficient for a
        forking engine or only for a non-forking one.
      breaking_artifact: >-
        The frozen probe NOT hanging under a controlled inherited-stdin launch
        (the defect would then be misattributed); the repaired probe exceeding
        60 s or returning `unavailable` for Singular; a repair that bounds the
        direct child but not a forking one, demonstrated.
      holding_artifact: >-
        The controlled reproduction with timings, the process tree during the
        hang, the wrapper determination, the mechanism statement, and the
        repaired probe's per-engine timings and Singular string.
    - joint: >-
        R5 -- SCOPE, CUSTODY AND MANIFEST COMPLETENESS. That the frozen tree and
        the two archived run packages are byte-unchanged; that every diff hunk in
        the repaired tree is attributable to exactly one declared defect D1-D5;
        and that the acceptance run's manifest carries what the artifact policy
        requires.
      assigned_to: TASK-20260915-3f4b52
      attack_plan: >-
        (1) Compute sha256 for the four frozen code files and compare against
        TASK-20260913-f8bdec's recorded path_sha256 in
        coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-51e2aa/dispatch_queue.json.
        (2) Run `git status --porcelain experiments/EXP-ICPERF-66fd51` and report
        it verbatim; anything nonempty is a custody failure. Check the two run
        directories' summary.json files specifically -- the frozen summary.py
        writes into the run directory it is given, so a repaired reduction
        pointed at an archived run would overwrite an archived artifact. (3)
        Produce your own unified diff of the two code trees and attribute each
        hunk to D1, D2, D3, D4, D5 or NONE. Report every NONE. (4) Check
        experiments/EXP-ICPERF-e21835/code/CODE_SHA256.json against the files it
        describes, and that binec.py is byte-identical to the frozen one (no
        defect was found in it). (5) Read the run manifest against AGENTS.md
        "Artifact policy": exact command, git commit and dirty state,
        environment, seeds, requested policy and resolved model, effort,
        fallback, stdout/stderr, raw results, validity status, timestamps,
        resource measurements -- plus this contract's rss_limit_gb and
        rss_poll_interval_s. List what is missing.
      breaking_artifact: >-
        Any frozen hash mismatch; nonempty git status under
        experiments/EXP-ICPERF-66fd51; a diff hunk attributable to no declared
        defect; a CODE_SHA256.json entry that does not match its file; a missing
        manifest field.
      holding_artifact: >-
        The hash comparison table, the verbatim git status, your own attributed
        diff, and the manifest field checklist.
    - joint: >-
        R6 -- BLIND RE-DERIVATION OF THE GROEBNER QUANTITY. Independently
        determine, from the UPSTREAM instance alone and the reviewer's own
        conversion, the reduced Groebner basis of the n15l5-1-S system over
        GF(2) with field equations: its size, its maximal degree, whether it is
        the unit ideal, and the dimension of the quotient if the engine reports
        it.
      assigned_to: TASK-20260915-abf147
      attack_plan: >-
        See review-plan-r6.yaml, which is this joint's governing assignment and
        the ONLY plan file its owner reads. It carries no expected value; the
        Coordinator's numeric prior for this joint is recorded above, in the file
        its owner does not read.
      breaking_artifact: >-
        A basis size, maximal degree, or unit/non-unit verdict differing from
        what the repaired instrument reports for the same instance -- which
        would mean the two agreeing engines agreed about an ideal the shared
        converter got wrong, and would block the acceptance.
      holding_artifact: >-
        The reviewer's own conversion code, the engine invocation, the verbatim
        engine output, and the four values.
  every_joint_has_exactly_one_owner: true
  owners:
    TASK-20260915-3f4b52: [R1, R2, R3, R4, R5, proves_too_much_object_1]
    TASK-20260915-abf147: [R6, proves_too_much_object_2]
  blindness:
    within_round: true
    mutual: true
    statement: >-
      Two reviewer sessions, independently launched. Neither reads the other's
      task directory, report, or attestation, and each attests to that. The
      binding blindness is R6's and it is stronger than mutual non-reading:
      TASK-20260915-abf147 does not read EITHER convert.py (frozen or
      repaired), any emitted .m2 or .sing script, the TASK-20260915-195b0c
      report, THIS plan, or anything under TASK-20260915-3f4b52's directory. Its
      assignment is review-plan-r6.yaml, which states the quantity and the
      parameters and no expected value. The point is precise: the existing
      gb_size = 43 agreement comes from two engines reading two files produced by
      ONE converter, so it cannot detect a converter defect, and a re-deriver who
      has read the converter or the expected number cannot either.

      The Coordinator that wrote the frozen tree's four files, that wrote three
      of the four defects under repair, that wrote this plan, and that will
      compose the round is NOT blind. That concentration is this round's
      principal weakness. It is mitigated only partly -- by the executor rather
      than the Coordinator writing the repair, and by R6's independence on the
      one load-bearing quantity -- and it is disclosed rather than claimed away.
    lifted_for: []
    lifted_for_rationale: Nothing lifted.
    what_reviewers_may_read:
      TASK-20260915-3f4b52: >-
        experiments/EXP-ICPERF-e21835/ (all), experiments/EXP-ICPERF-66fd51/
        (all, read-only), experiments/EXP-ICPERF-13f001/specification.yaml,
        ledger/hypotheses/H-ICPERF-2c57cc.yaml and H-ICPERF-cc4847.yaml,
        ledger/evidence/EV-ICPERF-390707.yaml,
        ledger/decisions/DEC-20260915-87360d.yaml and DEC-20260915-428a17.yaml,
        both reports and all artifacts under
        coordination/review/icperf-20260913-66fd51/, this plan, and the
        TASK-20260915-7da7f1 snapshot receipt. NOT
        coordination/review/icperf-20260915-a33cda/TASK-20260915-abf147/.
      TASK-20260915-abf147: >-
        coordination/review/icperf-20260915-a33cda/review-plan-r6.yaml,
        inputs/TRIMOSKA-ECICB-2024/ (the upstream instance files and their
        format documentation), inputs/TRIMOSKA-WDSAT-2024/ for the ANF format,
        and nothing else in this round. Explicitly NOT: review-plan.yaml,
        experiments/EXP-ICPERF-e21835/code/convert.py,
        experiments/EXP-ICPERF-66fd51/code/convert.py, any .m2 or .sing script,
        coordination/review/icperf-20260913-66fd51/TASK-20260915-195b0c/, or
        coordination/review/icperf-20260915-a33cda/TASK-20260915-3f4b52/.
    a_disclosure_this_plan_makes_deliberately: >-
      This plan states the Coordinator's suspected failure modes in detail --
      the RESULT-line regex, RSS double counting, P3's aggregation, the pipe
      drain behind the probe timeout. TASK-20260915-3f4b52 will read them and
