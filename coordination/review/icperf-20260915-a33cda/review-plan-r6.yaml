# =============================================================================
# REVIEW-ICPERF-20260915-a33cda -- JOINT R6 ASSIGNMENT, ISOLATED ON PURPOSE
#
# This file is the GOVERNING assignment for TASK-20260915-abf147 and the only
# plan file that task reads. It is separated from review-plan.yaml because that
# file records the Coordinator's numeric expectation for this joint, and a
# blind re-derivation that has been told the answer is not a re-derivation.
#
# Written 2026-09-15 when BATCH-a33cda opened -- before the executor was
# dispatched and therefore before any reviewer ran.
# =============================================================================

review_plan_joint:
  round_id: REVIEW-ICPERF-20260915-a33cda
  joint: R6
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-a33cda
  assigned_to: TASK-20260915-abf147
  role: validator
  written_by: coordinator
  written_at: '2026-09-15'
  written_before_any_reviewer_ran: true

  what_this_joint_is: >-
    A BLIND RE-DERIVATION, not a replication. You are not checking anybody's
    computation; you are computing one quantity independently, from the upstream
    problem instance, with your own conversion, so that agreement is evidence
    about the mathematics and disagreement localises to one of two named
    implementations. Recomputing from another agent's artifacts would reproduce a
    wrong-but-self-consistent implementation faithfully, which is exactly the
    failure this joint exists to detect.

  quantity_to_derive: >-
    For the Weil-descent point-decomposition instance `n15l5-1-S` shipped by
    SRC-ICPERF-TRIMOSKA-ECICB-2024 (n = 15, l = 5, m-1 = 3, the generator's fixed
    Koblitz curve, F_2 modulus given in the instance's INFO file): the REDUCED
    GROEBNER BASIS of the ideal generated by the instance's polynomial system
    TOGETHER WITH the field equations x^2 - x for every variable, over GF(2).
    Report four values:
      (1) the cardinality of the reduced basis;
      (2) the maximal total degree occurring among its elements;
      (3) whether it is the unit ideal (i.e. whether 1 is in the ideal);
      (4) the dimension of the quotient as a GF(2)-vector space, or the number of
          solutions, if your engine reports one -- and `not_reported` if not.
    Report the monomial order you used and whether you checked order sensitivity;
    (1) and (2) are order-dependent in general and this must be stated rather
    than assumed away.

  where_to_read_the_instance:
    - inputs/TRIMOSKA-ECICB-2024/upstream/benchmarks/ -- the shipped instance
      files for n15l5-1-S. Several encodings of the same system ship together
      (an INFO file with the parameters and modulus, an ANF form, a CNF-XOR
      form, and a Magma-syntax polynomial system). Choose your own; state which
      you read and why.
    - inputs/TRIMOSKA-WDSAT-2024/ -- documents the ANF format, if you use it.
    - inputs/TRIMOSKA-ECICB-2024/upstream/ -- the generator, if you want to
      confirm what the system means. Reading the GENERATOR is permitted;
      reading this program's CONVERTER is not (see `blind_from`).

  how_to_derive_it: >-
    Your own route, entirely. Parse the instance yourself and emit input for
    whichever computer-algebra engine you prefer among those installed
    (Macaulay2 1.22, Singular 4.3.2), or compute it with your own code if you
    would rather. What matters is that the parse and the emission are YOURS.
    Record the exact command, the verbatim engine output, and your conversion
    code as artifacts. If your first engine choice does not finish inside your
    budget, say so and try another; a censored attempt is an infrastructure
    outcome and is reported as one, never as a value.

  blind_from:
    - experiments/EXP-ICPERF-e21835/code/convert.py
    - experiments/EXP-ICPERF-66fd51/code/convert.py
    - any .m2 or .sing script emitted by either (including under scripts/ and under any run directory)
    - coordination/review/icperf-20260913-66fd51/TASK-20260915-195b0c/ (report, attestation and artifacts)
    - coordination/review/icperf-20260915-a33cda/review-plan.yaml
    - coordination/review/icperf-20260915-a33cda/TASK-20260915-3f4b52/ (the sibling reviewer's directory)
    - experiments/EXP-ICPERF-e21835/runs/ (the acceptance run's own results and report)
  blind_from_reason: >-
    Each of these either IS the implementation under test or QUOTES the value
    you are deriving. review-plan.yaml records the Coordinator's numeric
    expectation for this joint; TASK-20260915-195b0c measured the quantity; the
    acceptance run reports it. You are asked to produce an independent number,
    and you cannot if you have read one.
  what_to_do_if_you_encounter_the_value_anyway: >-
    Say so, in your attestation, naming the file and the moment. An honest
    disclosure keeps the joint interpretable as partially blind; a silent read
    destroys it. Do not delete or rewrite anything to conceal it, and do not
    abandon the derivation -- finish it and let the Coordinator weigh it.

  proves_too_much_object_you_own: >-
    THE PERTURBED SYSTEM. Take the same instance, alter it minimally and
    deliberately -- add one monomial to one equation, or delete one equation --
    and re-derive by the identical route. The result must DIFFER from the
    unperturbed one in cardinality, in maximal degree, or by becoming the unit
    ideal. Report both derivations side by side and state the exact perturbation.
    Why: this joint's value is that it reads the upstream system rather than a
    converter's output, and a pipeline that returns the same basis for a
    perturbed system is not reading what it claims to read. Without this control
    an agreeing R6 is indistinguishable from an R6 that computed nothing.

  what_would_make_this_joint_inconclusive:
    - No engine finishes inside your budget. Report the attempts, their limits
      and their peak memory; that is a real observation about the engines on
      this host and it is not a value.
    - The perturbed control returns an identical basis. Then your own pipeline is
      suspect and your unperturbed number may not be cited.
    - You read something in `blind_from`. Disclose it; the Coordinator decides
      what the derivation is still worth.

  budget:
    wall_clock_seconds: 7200
    memory_gb: 10
    maximum_runs: 6
    guidance: >-
      A Groebner basis of this system has been computed on this host inside a few
      minutes by at least one engine, so a run of tens of minutes is expected
      and hours are not. Bound each engine invocation yourself (600 s is a
      reasonable first bound; raise it once with a recorded reason if an engine
      is clearly progressing). Use a RESIDENT-SET bound, not RLIMIT_AS: this
      host's algebra engines reserve far more address space than they touch and
      an RLIMIT_AS cap aborts them while they are well inside their real memory
      use. That is the very defect this batch repairs, so do not reintroduce it
      in your own harness.
    machine_note: >-
      4 CPUs, 15 GB RAM. Record the 1-minute load average at the start of each
      invocation. Macaulay2's F4 is multi-threaded on this host and will use
      more CPU than wall time; that is expected and is not contention.

  deliverables:
    - report.md -- the four values, your route, the order you used, the perturbed
      control side by side, and anything you found that this assignment did not
      ask for.
    - attestation.yaml -- what you read (`what_was_read`), an explicit statement
      that you read nothing in `blind_from` or a disclosure of what you did,
      your requested policy, resolved model id, whether fallback was used and
      why, and your verdict on R6 and on your proves-too-much object.
    - artifacts/ -- your conversion code, engine inputs, verbatim engine output,
      and the perturbed instance.

  completion_gate:
    - attestation.yaml carries the R6 verdict, the perturbed-control verdict, and
      the blindness statement.
    - The four values appear in report.md with the monomial order stated, or a
      recorded reason why the derivation is inconclusive.
    - You report on R6 ONLY. The other five joints belong to another session you
      may not read, and the Coordinator composes. A whole-claim verdict from you
      would be an opinion formed from a fraction of the evidence.
