review_plan_addendum:
  id: REVIEW-ICPERF-20260915-a33cda-ADD1
  addendum_to: REVIEW-ICPERF-20260915-a33cda
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-a33cda
  written_by: coordinator
  written_at: '2026-09-16T06:20:00Z'
  written_before_any_reviewer_ran: true
  written_before_any_reviewer_ran_evidence: >-
    TASK-20260915-3f4b52 (R1-R5) and TASK-20260915-abf147 (R6) are both still
    `dependency_not_completed` in the dispatch plan and neither has been claimed at any
    epoch: `coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/claims/` contains
    claims for TASK-20260915-4f4027 only. No reviewer report exists anywhere under
    coordination/review/icperf-20260915-a33cda/.
  why_this_addendum_exists: >-
    The parent plan was written on 2026-09-15 BEFORE the acceptance run existed. Epoch 1 of
    TASK-20260915-4f4027 then ran, produced four facts the plan could not have known, and
    stopped on a model billing quota before completing. One of those facts UNDERMINES A
    REFERENCE VALUE THE PARENT PLAN ITSELF CITES, which is not something a reviewer should
    discover while holding a joint whose statement is wrong.

    This is an ADDITIVE amendment. It reassigns no joint, changes no owner, alters no
    blindness declaration, and removes nothing. It attaches four new questions to joints
    that already exist and records the Coordinator's prior on each of them BEFORE any
    reviewer runs -- which is the only moment at which such a prior is worth anything. The
    parent plan is not edited.
  what_is_unchanged:
    joints: R1, R2, R3, R4, R5, R6 -- same statements, same owners.
    owners:
      TASK-20260915-3f4b52: [R1, R2, R3, R4, R5, proves_too_much_object_1]
      TASK-20260915-abf147: [R6, proves_too_much_object_2]
    blindness: >-
      Unchanged and NOT lifted. The two reviewers still may not read each other's reports.
      Both may read this addendum: it is the Coordinator's instruction to them, not a
      sibling's finding.
    proves_too_much: Both objects stand as declared.
    blind_rederivation: >-
      R6's blind_from set is unchanged. Note explicitly that R6's re-deriver STILL MUST NOT
      read the epoch 1 artifacts named below, because RUN-ICPERF-a4a24b produced no
      Groebner row at all -- so there is nothing in it R6 needs, and reading it would only
      contaminate the independence that makes R6 worth running.
  new_facts_and_where_they_attach:
    - id: ADD1-a
      attaches_to: R2
      fact: >-
        The watchdog null-object control ran BOTH directions, but direction (i) ran at a
        SCALED limit: a 2 GiB watchdog against a 4 GiB allocator target, not the contract's
        declared 8 GiB watchdog against a 12 GiB target. Direction (ii) ran at the full
        declared 8 GiB (a 64 GiB PROT_NONE|MAP_NORESERVE reservation touching 256 MiB
        survived to exit 0 with rss_limit_breached false).
        Reason recorded before the run, not after: MemAvailable was 6.45 GiB with
        SwapTotal 0, so neither 12 GiB nor 8 GiB resident is reachable on this host and the
        kernel OOM killer would have fired before the watchdog -- measuring the OOM killer
        instead of the watchdog, and risking unrelated host processes.
      artifact: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/watchdog_control/outcomes.json
      what_R2_must_now_also_answer: >-
        Whether "the watchdog fires at the declared 8 GiB threshold" is established by this
        run. The Coordinator's reading is that it is NOT: the polling mechanism, the 0.25 s
        interval, the process-group RSS summation and the SIGTERM kill path were all
        exercised, but the THRESHOLD MAGNITUDE was not, and a limit that works at 2 GiB is
        not thereby shown to work at 8 GiB. R2 owns whether that gap matters -- in
        particular whether anything in the RSS accounting is magnitude-dependent (integer
        width, kB-to-GiB conversion, a comparison that could invert, or a poll interval that
        is too coarse relative to an engine's allocation rate at the larger figure).
      coordinator_prior: >-
        I EXPECT THE SCALED DIRECTION (i) TO BE SOUND AS A MECHANISM TEST AND I EXPECT THE
        REAL RESIDUAL RISK TO BE THE POLL INTERVAL RATHER THAN THE THRESHOLD. My named
        suspicion: at 0.25 s a fast allocator can overshoot the limit substantially between
        polls, and the overshoot scales with allocation rate, so a real algebra engine near
        8 GiB on a 15 GiB host could OOM the host between two polls even though the
        watchdog is "working". The null object allocates 128 MiB per step with a 0.05 s
        hold, which is gentle by comparison and would not surface this. A reviewer who
        computes the worst-case overshoot from the observed step rate and finds it small has
        told me something; a reviewer who reports only "direction (i) was scaled, therefore
        weaker" has told me what I already wrote here.
      what_would_change_my_mind: >-
        A demonstration that peak RSS is read from a source that is not monotone under
        process-group summation, or an arithmetic path that behaves differently above 4 GiB
        (a 32-bit kB counter overflows at ~4 TiB, so I do not expect this, and I would want
        to see the specific expression).
    - id: ADD1-b
      attaches_to: R3
      fact: >-
        THE PARENT PLAN'S OWN R3 REFERENCE IS NOT RECONSTRUCTIBLE. R3 as written asks the
        reviewer to confirm that the repaired reduction "reproduces 156 of 156 independently
        computed per-cell values", and the frozen contract's A6 states the same figure. That
        count cannot be reproduced from v3_reduce.json. The counts that CAN be defined from
        it are: 180 shared keys of any type (180 agree); 158 shared keys whose validator
        value is numeric (158 agree); 236 numeric values in v3_reduce's own cells block (of
        which 158 agree, the remainder having no counterpart). `grep -rn 156` over the review
        directory and EV-ICPERF-390707 finds no provenance for 156.
      handled_how: >-
        Epoch 1 reported EVERY reconstructible count with its explicit definition beside the
        reference and did NOT adjust the frozen reference. There are zero disagreements under
        every definition.
      artifact: >-
        experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/summary_regression.json,
        key `comparison_1_repaired_vs_validator_v3_reduce`
      what_R3_must_now_also_answer: >-
        Where 156 came from, and whether the substantive claim survives its loss. R3 owns
        this and must NOT resolve it by adopting whichever count is convenient. The three
        candidate definitions are all defensible and all agree completely, so the claim "the
        repaired reduction agrees with the independent reduction wherever both compute a
        value" appears robust to the choice -- but a reference number that nobody can
        reconstruct is a defect in the CONTRACT, and R3 should say so plainly if that is what
        it finds.
      coordinator_prior: >-
        I EXPECT 156 TO BE AN AUTHORING SLIP RATHER THAN A THIRD DEFINITION, and I expect the
        substantive agreement to survive. My best guess at its origin is a count taken over a
        subset that excluded a small number of keys (158 minus two, or a hand count of a
        printed table), and I am recording that guess so that a reviewer who finds an actual
        reproducible definition yielding exactly 156 has overturned it. I also record the
        uncomfortable possibility: if 156 came from a DIFFERENT reduction than the one
        v3_reduce.json holds, then the pre-registered reference is not the artifact we think
        it is, and that would matter much more than the count.
      what_this_does_not_authorise: >-
        Amending A6's reference value. The frozen contract stands; a reference that turns out
        to be unreconstructible is recorded as such and superseded by a decision, never
        quietly edited to match a measurement.
    - id: ADD1-c
      attaches_to: R3
      fact: >-
        Of 125 leaf differences between the repaired and frozen summary.json, 113 fall in the
        contract's declared classes and 12 are classed UNEXPLAINED by the executor's own
        driver. All 12 have one shape: a P2 `ratio` key that is ABSENT from the frozen output
        and present-as-null in the repaired output, at the same 12 cells whose `holds` the
        repair makes explicitly unevaluated.
      artifact: >-
        experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/summary_regression.json,
        key `comparison_4_repaired_vs_frozen_summary_json.unexplained_differences`
      what_R3_must_now_also_answer: >-
        Whether those 12 are a reporting-surface consequence of the D3 repair or a second,
        undeclared change. This is squarely inside R3's existing remit ("moves no number"),
        and it is the single place in this run where a number could have moved without
        anyone noticing, because ABSENT-versus-null is exactly the comparison a diff tool
        reports least legibly.
      coordinator_prior: >-
        I EXPECT THESE TO BE BENIGN AND I EXPECT THAT TO BE UNVERIFIABLE FROM THE JSON ALONE.
        The shape is consistent with the repaired code emitting a `ratio` key alongside its
        new `evaluated: false` marker where the frozen code emitted no key at all, which
        changes the reporting surface and no value. What makes me want a reviewer on it
        rather than my own reading: `null` and ABSENT are the same thing to a consumer that
        uses `.get()`, and different to one that iterates keys -- so a downstream reader of
        this summary could change behaviour without any number changing. R3 should check
        whether anything consumes these summaries by key iteration.
        The Coordinator explicitly did NOT reclassify these as explained when writing the
        run manifest, and recorded its reading there as the Coordinator's rather than part of
        the measurement. That labelling is deliberate and R3 is free to overturn it.
    - id: ADD1-d
      attaches_to: R4
      fact: >-
        The frozen probe body, run verbatim under the identical inherited-stdin launch, DID
        hang -- and its 60 s per-engine timeout DID fire, returning at 60.062 s with
        "Command '['Singular', '--version']' timed out after 60 seconds". In
        RUN-ICPERF-c9590f the same 60 s timeout did NOT return and the run died inside the
        probe after roughly four minutes. Epoch 1 recorded the discrepancy as unexplained,
        which A5 permits.
      artifact: >-
        experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/logs/probe_check.json and
        logs/probe_frozen_control.{out,err}
      what_R4_must_now_also_answer: >-
        R4 as written asks for the mechanism to be "understood well enough to say why the
        frozen one hung". It now has a sharper and harder question: the hang reproduces but
        the FAILURE TO TIME OUT does not, so the c9590f failure mode is reproduced only in
        part and something differs between the two launches that nobody has named. R4 owns
        naming it or stating clearly that it remains unnamed.
      coordinator_prior: >-
        I EXPECT THE DIFFERENCE TO BE IN WHAT WAS WAITING ON THE PIPE, NOT IN THE TIMEOUT
        CODE. My named suspicion: subprocess timeout handling can fail to fire when the child
        has spawned its own children that hold the inherited descriptor, so the wait is on a
        process group rather than the timed process -- and whether that happens depends on
        what else the c9590f session had open on that pipe, which the epoch 1 control could
        not reproduce because it constructed a clean pipe of its own. If that is right, the
        c9590f mode is a property of the SESSION's descriptor table and is not reproducible
        by any control the contract could specify, which is a legitimate and useful negative
        answer. A reviewer who instead finds a code path in the frozen probe that can skip
        the timeout has overturned me, and that would be the more serious finding.
      what_would_change_my_mind: >-
        Any demonstration that the frozen probe can hang past its declared timeout with a
        clean descriptor table, which would make the defect intrinsic rather than
        environmental.
    - id: ADD1-e
      attaches_to: R5
      fact: >-
        THE ACCEPTANCE RUN IS INCOMPLETE AND HAS TWO MANIFESTS. Epoch 1 stopped on the
        launching account's monthly Opus usage limit after writing every measurement artifact
        but before its manifest or acceptance report. The Coordinator wrote
        manifest.yaml from the on-disk artifacts at status `incomplete_interrupted` with
        `result.valid: null`, performing exactly one new check (the C-NOWRITE end
        verification) and recomputing the code hashes. Epoch 2 is dispatched on a non-Opus
        binding under an additive `inference_amendment` moving fallback_allowed false -> true,
        and will write a manifest that SUPERSEDES manifest.yaml by reference.
        A1, A2, A3 and A7 were NOT_EVALUABLE at epoch 1 for one reason: the single Macaulay2
        F4 acceptance invocation never launched.
      artifact: >-
        experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/manifest.yaml and the
        `resumption` block of TASK-20260915-4f4027 in the batch dispatch queue
      what_R5_must_now_also_answer: >-
        Four things beyond its original remit. (1) That the Coordinator-authored manifest
        asserts nothing the artifacts do not carry -- it was written by the party that also
        dispatched the work, which is exactly the custody weakness R5 exists to catch, and it
        should be read with that in mind. (2) That epoch 2 modified NO artifact committed at
        ecdd3bffd, including the four code files whose bytes the A6 evidence is banked
        against. (3) That the superseding manifest supersedes by reference rather than
        replacing, so both remain readable. (4) That the recorded interruption cause is the
        real one: the run's own artifacts are equally consistent with a host timeout, and this
        session's first inference WAS a host timeout before the quota notification arrived.
        That wrong inference is recorded in the manifest deliberately; R5 should confirm the
        correction is honest rather than tidy.
      coordinator_prior: >-
        I EXPECT R5 TO FIND THE MANIFEST FACTUALLY ACCURATE AND TO OBJECT TO ITS AUTHORSHIP,
        AND I THINK THAT OBJECTION WOULD BE CORRECT. A Coordinator writing a producer's
        manifest is a custody compromise even when every field is read off an artifact; I did
        it because the alternative was leaving substantial measurements uncommitted and
        therefore non-durable, and I declined to write the acceptance REPORT for the same
        reason inverted -- a report is interpretation, and inventing an executor's judgement
        is worse than leaving a gap. I record here that I consider the manifest defensible
        and the boundary I drew arguable, so that a reviewer disagreeing with the boundary is
        disagreeing with a stated position rather than an unstated one.
        My specific suspicion about my own work: the manifest's per-criterion verdicts are
        mine, read from artifacts, and `PASS_WITH_DECLARED_DEVIATION` for A4 is a label I
        invented rather than one the contract defines. R5 should check whether the contract's
        vocabulary (PASS / FAIL / NOT_EVALUABLE) admits it, and if not, whether A4's honest
        verdict under the contract's own vocabulary is NOT_EVALUABLE rather than a qualified
        pass. I lean towards my label being the more informative and the contract's being the
        more disciplined, and I would defer to R5.
  what_this_addendum_does_not_do:
    - >-
      Does not lower any bar. Every joint keeps its statement; four gain additional questions
      and none loses one.
    - >-
      Does not lift blindness between the two reviewers, and does not authorise either to read
      the other's report.
    - >-
      Does not amend the frozen contract EXP-ICPERF-e21835, its acceptance criteria, or any
      reference value in it -- including the unreconstructible 156. A reference found
      unreconstructible is superseded by a decision after review, never edited to match a
      measurement.
    - >-
      Does not assert that the instrument is accepted. Three criteria passed at epoch 1, one
      of them with a declared deviation, and four were not evaluable. An acceptance verdict is
      the composition the Coordinator writes AFTER both reports return.
    - >-
      Does not treat the quota interruption as evidence of anything. It is a billing fact about
      the runtime and bears on no research question in either direction.
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
  composition_owner: coordinator
