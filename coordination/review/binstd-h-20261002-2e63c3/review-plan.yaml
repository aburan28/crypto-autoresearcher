          j = 2 figures as a cost (TW-7257-1); or edited any proposal,
          reading note, decision or correction.
        effect: The composer applies K-revise-defect. No approval.
      - id: TH-4
        fires_when: A review card of this round cannot be served at review-breakthrough at max.
        effect: See unservable_rule. The card is not dispatched and the contract stays unapproved.
    tripwire_note: >-
      Pre-declared, so escalation is a rule applied and not a judgement made
      after reading the reports. TH-3 carries the DEC-20260929-585602 TB-4
