  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20261002-b8360c (PTM-B, PTM-E); TASK-20261002-17bf2f (PTM-A, PTM-C, PTM-D)
    assigned_to_note: >-
      Split by where each object bites: the argument and the decision rules
      (J3's owner), the census and cost rules (J4's owner).
    objects:
      - id: PTM-A
        owner: TASK-20261002-17bf2f
        object: >-
          The prime-degree ANSI rows c2tnb191v1 and c2tnb239v1 (and any other
          prime-degree control row the contract declares), fed through the
          contract's census and cost rules.
        known_truth: >-
          N is prime, so F_(2^N) has no proper subfield other than F_2 and the
          divisor lattice is {1, N}; the only descent is to F_2 with n = N.
          A rule that reports a live lane with small genus, or any cost row
          at or below matched rho, has proved too much.
      - id: PTM-B
        owner: TASK-20261002-b8360c
        object: >-
          The contract's (C1) collapse argument applied verbatim to an open
          cell c = jk (n in 2, 4, 8, 16), where F_q(a, b) = F_(q^n) (MMT Remark
          22's criterion lcm(n*, l) = N, quoted in the reading note).
        known_truth: >-
          On these cells the curve is not defined over a proper subfield of
          F_(q^n) containing F_q, and the source states the large subgroup is
          expected to avoid the kernel there. An argument that still
          concludes a zero image of the l-part on such a cell has proved too
          much.
      - id: PTM-C
        owner: TASK-20261002-17bf2f
        object: >-
          The Koblitz-shaped curve y^2 + xy = x^3 + 1 over F_(2^176), fed
          through the contract's census and cost rules (a fixture, not a
          declared toy cell).
        known_truth: >-
          b is in F_2, so m = 1 in every lane (reading note CHECK-4, from the
          source's Theorem 5); g = 1 and the cover is the curve itself. A rule
          that reports a descent lane, a genus above 1, or a cost row below
          matched rho for it has proved too much.
      - id: PTM-D
        owner: TASK-20261002-17bf2f
        object: >-
          Two synthetic rows fed through the contract's comparison rule at
          each deployed row: (a) matched rho itself entered as an
          index-calculus row (time equal to matched rho, memory equal to
          rho's distinguished-point table under the contract's machine
          model); (b) a row with time equal to matched rho and 2^40 entries
          of shared random-access memory.
        known_truth: >-
          (a) is a tie at 0 bits; (b) is no advantage under any accounting
          that charges memory, and a disadvantage under the van
          Oorschot-Wiener accounting. A rule that reports an advantage for
          either has proved too much.
      - id: PTM-E
        owner: TASK-20261002-b8360c
        object: >-
          The source's counterfactual cells E176 and E272 at c = 2,
          (n, m, g) = (88, 8, 128), fed through the contract's decision rules
          with whatever cost data they would carry.
        known_truth: >-
          MMT Remark 23 reports a computed descent in which the order-r
          subgroup lies in the kernel of phi for both; the source calls the
          attack "doomed to fail". Rules that route either cell anywhere but
          STRUCTURALLY EMPTY (or the contract's equivalent class) have proved
          too much.
    failure_signature: >-
      A correct protocol keeps each known-false conclusion out of reach.
      PTM-A reads the lattice {1, N}, one hopeless cell and no row at or below
      matched rho. PTM-B shows the (C1) argument failing its hypothesis on
      the open cell (it cannot be applied), not concluding a zero image.
      PTM-C reads m = 1 in every lane, no descent and no cost row. PTM-D reads
      (a) a tie at 0 bits and (b) no advantage, with a disadvantage under
      VOW. PTM-E routes both cells STRUCTURALLY EMPTY independent of their
      counterfactual cost data.
    how_to_run_it: >-
      Review computations in your own script at zero compute: arithmetic on
      the contract's rules and on published coefficients, and synthetic inputs
      through the committed decision and cost code. They mint no RUN-*, write
      no evidence record, construct nothing on a declared toy cell, and never
      execute an EXP-BINSTD-f442a9 driver as an experiment. Put every script
      and output in computations.json. If a PTM would amount to a new
      experiment, record it not performed with the reason.

