  blind_rederivation:
    required: true
    mode: fresh_card
    assigned_to: TASK-20261002-8d288b
    quantity: >-
      Q0 to Q4 exactly as the quantities block of
      ledger/handoffs/TASK-20261002-8d288b.yaml states them: Q0 undetermined
      choices; Q1 the parameters, orders, cofactors, smallest coefficient
      subfield and Weil-recursion check of the five composite-degree rows and
      the two prime-degree control rows from openssl ecparam; Q2 per (row,
      divisor c of N, c < N) the orbit length of (A, B) under the 2^c-power
      Frobenius, the magic number m from the quoted definition, Tr(A), and
      whether the quoted condition (7) holds; Q3 log2 of sqrt(pi l / (4k)) per
      composite row; Q4 the reference lines R-1 to R-4 per composite row and
      per open cell with n in 2, 4, 8.
    parameters: As frozen on TASK-20261002-8d288b's card.
    blind_from:
      - coordination/review/binstd-h-20261002-2e63c3/review-plan.yaml
      - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-2e63c3/
      - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-04a6be/
      - ledger/hypotheses/
      - ledger/proposals/
      - ledger/decisions/
      - ledger/corrections/
      - experiments/
      - analysis/binstd-curve-audit/
      - knowledge/
      - inputs/
      - src/
      - https://eprint.iacr.org/2001/084
    blind_from_note: >-
      The re-deriver's whitelist is its card, AGENTS.md, agents/validator.md
      and templates/research-records.md, none of which lies under these
      paths. The census answers sit in the reading note (BATCH-04a6be), the
      proposals, the audit directory and the MMT source; the contract's
      figures sit under BATCH-2e63c3 and experiments/. The producer may not
      read the blind card's report directory.
    agreement_tolerance: >-
      Q1 exact (integers and field elements). Q2 exact (orbit lengths, m,
      Tr(A), condition flags). Q3 within 0.01 bit. Q4 within 0.01 bit on each
      line.
    what_disagreement_means: >-
      Not that J1 or J5 is wrong. It localises the difference to a model
      choice or one of two named implementations. The composer applies
      K-indeterminate and never prefers either side. A J5-contract agreement
      that disagrees with MMT Table 3 is a source discrepancy, reconciled by
      J1's finding.

  # ---------------------------------------------------------------------------
  composition:
    who: >-
      The Coordinator, in TASK-20261002-97a1ea, in a fresh session that did
      not run TASK-20261002-9f9ce5, did not author DEC-20261002-21a63d or this
      plan, and is not a reviewer of this round. No reviewer votes on the
      whole contract.
    independence_check: >-
      python3 tools/check_review_independence.py --plan
      coordination/review/binstd-h-20261002-2e63c3/review-plan.yaml --reports
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-2e63c3/reviews/TASK-20261002-b8360c/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-2e63c3/reviews/TASK-20261002-2214e9/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-2e63c3/reviews/TASK-20261002-17bf2f/
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-2e63c3/reviews/TASK-20261002-8d288b/,
      run by the top-level session and recorded in DEC-20261002-c9ec6b
      whatever it reports; the tool is never edited to pass. The
      --blind-history check is uncheckable (no protected-digest file) and is
      recorded as such (PD-R4).
    custody_without_seal: >-
      No seal card. Before TASK-20261002-97a1ea is launched, the top-level
      session computes sha256 of the eight declared report files of this
      round and pastes them into the launch prompt. The composer records them
      verbatim as its first act, before reading any report.
      TASK-20261002-49bbba must reproduce all eight; a mismatch voids the
      composition.
    discharge_check: >-
      The composer reads the audit sheet's discharge table and checks that
      each of DC-H1 to DC-H6 and DH-1 to DH-13 maps to a named clause that
      the owning joint's report (discharge_map) does not contradict. A
      condition with no clause is a missing approval field for
      K-revise-defect.
    keys:
      K-approve: >-
        J1 to J4 hold; J5 agrees with the contract within the agreement
        tolerance; the census agrees with MMT Table 3 on every open cell (or
        each disagreement is reconciled in J1's report with both
        implementations agreeing and the source shown mis-transcribed or
        wrong at a stated point); every PTM meets its failure signature; no
        tripwire fired; every DC-H and DH item is discharged
        (discharge_check). DEC-20261002-c9ec6b then approves
        EXP-BINSTD-f442a9 under the AGENTS.md standing user authorization
        and names as its first next action the opening of an execution batch
        whose first card advances the approval and status fields of the two
        records. Approval asserts nothing about any curve's security, any
        attack's cost, or GHS descent against rho.
      K-revise-defect: >-
        Any of J1 to J4 breaks, a field approval requires is missing, a
        DC-H or DH item is undischarged, or TH-3 fired. Decision revise, each
        defect listed with its joint and breaking artifact, and a revision
        design card in a new batch as the first next action.
      K-indeterminate: >-
        J5 disagrees with the contract beyond the tolerance on any quantity.
        Decision revise, naming the quantity; neither implementation is
        preferred.
      K-impediment: >-
        A primary source the contract cites is unreachable (Hess, IMP-3; the
        journal version, IMP-2; MMT pages 20-21 or 25-42), and the contract
        records the impediment, keeps every dependent statement marked and
        numbered, and forbids substitution. Not a defect by itself; approval
        is permitted if every other key of K-approve holds.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        approval while any joint is inconclusive. An infrastructure failure is
        never negative evidence about the contract's mathematics or any curve.
      any_tripwire: See tier.tripwires. The composer applies the tripwire's stated effect.
    selection_point_duties: >-
      The composing decision is a selection point of GOAL-ECDLP2M-001. It
      reads DEC-20261002-21a63d R-ORDER-2 and any later standing order on
      origin/main at its launch, and records only changes, each with its
      reason, cost and revisit. The slot this lane frees goes to the head
      item of the standing order then in force, unless an earlier freed slot
      has taken it; any other assignment (an execution batch for a contract
      this decision approves included) records a new reason and the cost of
      deferring the head item. It names exactly one first next action.

  procedure_deviations:
    - id: PD-R1
      severity: material
      what: The prior is informed, not blind (see informed_prior_disclosure).
      consequence: Concurrence of the validator with MMT Table 3 is weak corroboration; J5 is the structurally blind check.
    - id: PD-R2
      severity: disclosed
      what: The object did not exist when this plan was written; it is bound by the producer snapshot.
    - id: PD-R3
      severity: disclosed
      what: >-
        The new decision quantities of this round (null false-fire rates; the
        degeneracy verdicts; the end-to-end reachability) get no blind card.
        J3's owner re-derives the false-fire table with its own code before
        opening the producer's (J3 attack (i)). That is independence of
        implementation and of order, not blindness.
    - id: PD-R4
      severity: disclosed
      what: >-
        No protected-digest file is written for this batch, so
        tools/check_review_independence.py --blind-history is uncheckable,
        never passed.
    - id: PD-R5
      severity: disclosed
      what: >-
        The validator, both red teams and the producer read the reading
        note, which transcribes the source's Table 3 and the source's own
        cost columns. This is necessary for the baseline fixture and the
        discharge check, and it means their concurrence with the source is
        informed. The blind re-deriver does not read it.
    - id: PD-R6
      severity: disclosed
      what: >-
        This plan names the (C1) positive control, the false-fire table, L2,
        the LA/VOW accounting and E368's Tr(a) as likely break sites, and the
        producer reads the plan. A producer that closes them before review
        makes the round less likely to break at the predicted sites; that is
        the purpose of a worked attack.
  procedure_deviations_note: >-
    Six at writing. Later departures are recorded in DEC-20261002-c9ec6b or
    in an addendum, never absorbed.
