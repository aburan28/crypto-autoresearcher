  coordinator_prior:
    per_joint: >-
      J1 (Stage 0 and the baseline fixture) holds with probability about
      0.8. The census is a few integer computations in F_(2^16), and the
      reading note's CHECK-4 shows the two m conventions coincide for n a
      power of 2. If it breaks I expect it on the Theorem-1 condition
      ((7), or Lemma 6's weaker (9)) on the m-different-from-n cells: E208 has
      A = 0, but E368's Tr(a) is only an inference from Remark 25's list
      (reading note remains_open), and a contract that asserts the genus
      formula applies there without computing the condition has a gap. J2
      (code, wiring, custody) holds with probability about 0.65; the risk is
      a dry call on a toy group that coincides with a declared cell (the
      DEC-20260929-585602 TB-4 pattern) or a lane selected by a numeric
      offset of c rather than by role. J3 (proof architecture, heuristics,
      decision rules) holds with probability about 0.45 and is where I expect
      the break, most likely first: (a) THE POSITIVE CONTROL. The proposal's
      positive control for (C1) ("k' even") does not obviously make the
      trace non-trivial on the l'-part; if the contract carries it unexamined,
      the (C1) verification is a test with no possible negative. (b) A
      stopping or invalidation rule whose null false-fire rate is not
      computed, or is computed and large. (c) Lemma L2 (the grouping of the
      Galois sum by residue mod 16/c) assumed rather than proved, which is
      also where the Hess dependence lives. J4 (cost model, scope, wording,
      provenance) holds with probability about 0.5; the risk is asymmetric
      accounting: rho charged under VOW with a distinguished-point table while
      the index-calculus arm's linear algebra is charged in time only, or the
      GTTD double-large-prime law quoted at a provenance below what supports
      it (KN-LIT-164 carries citation_verified read on two pages only, and is
      superseded by KN-LIT-92caf4).
    overall: >-
      Probability about 0.3 that the round composes to approve. Most likely
      alternative: revise on J3 (positive control or a false-fire rate), then
      on J4 (asymmetric accounting). K-impediment on Hess (DC-H1) is likely
      engaged and is not a defect if the obligation is numbered and the
      dependent statements are marked.
    where_i_think_it_breaks_if_it_breaks: J3 at the (C1) positive control, then J3 on an uncomputed false-fire rate, then J4 on the LA/VOW accounting, then J1 on the Theorem-1 condition for E368.
    estimator_prior: >-
      J5 agrees with the contract and with MMT Table 3 on every Q2 integer
      with probability about 0.9 (the reading note transcribes m = n on 16 of
      the 20 open cells and m = 7, 14, 7, 13 on the other four). Q3 within
      0.01 bit with probability about 0.95 (the reading note's CHECK-3 lands
      on the source's rounding). A prior, not a result.
    what_would_overturn_this_prior_most: >-
      (1) The census disagreeing with MMT Table 3 on any open cell in both
      the producer's and the blind implementation (the source would then be
      wrong or mis-transcribed, and MMT is the senior source until
      reconciled). (2) PTM-B going through: the elementary trace-eigenvalue
      argument concluding a zero image on a non-collapsed lane, which would
      mean (C1) proves too much. (3) A reviewer producing, from a source read
      at retrieved provenance, a statement of Hess's theorem without a
      subfield hypothesis (TH-2 territory).
    informed_prior_disclosure: >-
      The prior is informed, not blind (PD-R1). The session that wrote this
      plan read both proposals and the full reading note, including its
      Table 3 transcription and checks.

  # ---------------------------------------------------------------------------
  joints:
    - joint: >-
        J1 -- Stage 0 and the baseline fixture (DC-H2, DC-H4; DH-4; Phase 0).
        The contract's stage0_code parses the parameters of the five
        composite-degree rows and the declared prime-degree control rows,
        records their source and provenance, and computes for every
        (row, divisor c of N, c < N) the conjugate period of (A, B) under the
        2^c-power Frobenius, the magic number m (both conventions, shown
        equal), the genus candidates, and the Theorem-1 condition ((7), or
        Lemma 6's (9) where the contract relies on it) by direct computation
        of Tr(a); it reproduces MMT Table 3 on all twenty open cells (m
        exact; g exact on the fifteen cells with m < 13; the n = 16 branch
        left open as the source leaves it) and states Remark 24's bounds on
        the collapsed cells; its controls can fail (a Koblitz-shaped curve
        over a composite N returning m = 1 in every lane; a B in F_(2^8)
        fixture returning m at most n/2; the prime-degree rows giving the
        lattice {1, N}; a uniform-B null returning m = n in every lane with
        a stated probability; the c = 16 baseline cell returning m = 1); it
        computes matched rho as sqrt(pi l / (4k)) per row; and it prints the
        plan's reference lines R-1 to R-4 (blind_rederivation Q4) beside the
        contract's own model.
      assigned_to: TASK-20261002-2214e9
      attack_plan: >-
        (i) With your own code, obtain the parameters of the five rows and
        the control rows from openssl ecparam and from any primary source the
        contract cites, and recompute every census quantity on all fifty
        (row, divisor) cells and every control. (ii) Compare with the
        contract's frozen figures and with MMT Table 3 as transcribed in the
        reading note (table_3_transcription), cell by cell; the four
        m-different-from-n cells (E208 and E368 at n = 8 and 16) first. (iii)
        Test the level routine on elements constructed by design to lie in
        ker (sigma + 1)^j but not ker (sigma + 1)^(j-1), on fields that are
        not declared cells. (iv) Compute Tr(a) for every row and the
        Theorem-1 condition per open cell; check the contract does not apply
        the genus formula where neither (7) nor (9) is shown to hold. (v)
        Recompute matched rho to 0.01 bit and R-1 to R-4 to 0.01 bit. (vi)
        Read stage0_code statically: a __main__ guard, importing executes
        nothing. Where I think it breaks: (iv) on E368, then (iii).
      breaking_artifact: >-
        A census value differing from MMT Table 3 with no reconciliation; a
        census value differing from your recomputation; a control that
        cannot fail; parameters that do not match the cited source; the
        genus formula applied on a cell where the contract has not shown its
        condition; matched rho or a reference line off by more than 0.01 bit;
        DC-H2 or DC-H4 undischarged.
    - joint: >-
        J2 -- Code, wiring, completeness and custody (DH-1, DH-8, DH-9,
        DH-12; the code side of DH-7). Every code block (stage0_code, the
        cost-table generator, the calibration, dry-call and decision code,
        and any fixture code) is a block scalar of the audit sheet with its
        extraction method and reference sha256 pinned, import-safe; every
        declared cell, arm and lane is selected in code by role or name,
        never by an offset that varies with a parameter; C-1 to C-8 reproduce
        from the committed code; the end-to-end dry call (C-6) covers the
        full declared name grid; no design computation touched a declared toy
        cell beyond C-7 or a group coinciding with one; memory beside every
        time figure; every approval field present; status review_required;
        approved_by null with an approval block naming DEC-20261002-c9ec6b;
        no proposal, reading note or decision edited; the 0e3641 section and
        any optional arm declared as such; zero runs.
      assigned_to: TASK-20261002-2214e9
      attack_plan: >-
        (i) Extract every code block by the pinned method, hash against the
        pinned reference sha256, import each in a fresh interpreter and
        confirm nothing executes. (ii) Re-run C-3 to C-8 from the committed
        code in your scratch with the recorded seeds and compare with the
        audit sheet's relayed outputs byte for byte where deterministic. (iii)
        List every declared toy cell with its (d, k') and coefficients, and
        every group or curve used by any design computation or dry call;
        check none coincides with a declared cell's group at any field size.
        (iv) Read the selection of cells, arms and lanes in code; any offset
        that varies with c, k or d is a break. (v) List every approval field
        present or absent; check memory beside every time figure; hash the
        three producer files against TASK-20261002-ffb7bb and the inputs as
        object_under_review.inputs_binding states. Where I think it breaks:
        (iii), then (iv).
      breaking_artifact: >-
        A code block whose extraction or reference sha256 does not reproduce;
        module-level execution on import; a relayed computation that does not
        reproduce; a design computation on a declared toy cell beyond C-7 or
        on a coinciding group (also TH-3); a cell, arm or lane selected by an
        offset; a missing approval field; a non-null approved_by; an input
        file changed; a time figure without memory.
    - joint: >-
        J3 -- Proof architecture, numbered heuristics and decision rules
        (DC-H1; DH-2, DH-3, DH-7). (C1) is decomposed into
        single-responsibility lemmas (at least: the conjugate period; the
        grouping of the Galois sum by residue mod 16/c; the eigenvalue of
        the F_(2^16)-Frobenius on the l-part with lambda^k = 1 and lambda not
        1 from gcd(l, h) = 1; the annihilation by the subfield trace; the
        link to the conorm-norm image of the GHS map), each with its
        responsibility named, and the main statement is a pure assembly; the
        Hess obligation is read at source with provenance or carried as an
        explicit numbered open obligation with every dependent statement
        marked; MMT Remarks 21 and 23 are cited as the source's statements,
        not as the contract's proof. H-DL-1 and H-DL-2 (and H-0e3641-1 if
        declared) are numbered, formally stated, with rigorous support,
        falsification condition and a pre-registered toy-scale validation
        arm (distribution-level comparison against the predicted law, tail
        check, sample size with stated power, transfer distance as a numbered
        assumption). The toy-cell verification of (C1) carries a negative and
        a positive control, and the positive control's predicted non-trivial
        image is argued, not assumed. Every stopping, invalidation and
        admission rule has its false-fire rate under the contract's own null
        computed in committed code (C-5) and stated; every declared (cell,
        arm, lane) carries a degeneracy verdict from parameter arithmetic;
        every declared outcome is reachable and every declared arm reaches
        its outcomes as coded.
      assigned_to: TASK-20261002-b8360c
      attack_plan: >-
        (i) FALSE-FIRE TABLE, FIRST. Before opening the producer's C-5 table
        or its C-6 output, write your own: for each stopping, invalidation
        and admission rule as frozen, compute its firing rate under the
        contract's own null by Monte Carlo of the abstract model on synthetic
        inputs, seeds recorded; then compare. Any rule firing on more than 5
        percent of null runs, or whose firing voids a cell the null should
        clear, breaks the joint. (ii) Lemma audit of (C1): for each lemma,
        state what it assumes and what it proves; check L2 is proved and not
        assumed; check the eigenvalue step uses gcd(l, h) = 1 and k prime
        exactly where needed; check the Hess obligation's handling (DC-H1).
        (iii) PTM-B and PTM-E (below). (iv) Positive control: construct, on
        toy groups that are not declared cells at any field size, a case
        where the contract predicts a non-trivial image, and check that the
        committed decision code reports it as such (the control can fail).
        (v) Degeneracy audit: for every declared (cell, arm, lane), recompute
        its degeneracy verdict from its declared parameters only (no point,
        trace, cover or sample on a declared cell). (vi) Reachability per
        declared outcome from generative quantities, and per declared arm as
        coded, by feeding planted synthetic inputs through the committed
        decision code. (vii) Heuristic arms: for H-DL-1, check the predicted
        law, the statistic, the threshold, the sample size and the tail
        check are fixed before any data and that the arm can fail at a
        deviation the contract states; for H-DL-2, check the fit's form and
        its extrapolation statement; for H-0e3641-1, check it is declared
        optional or reasoned out. Where I think it breaks: (iv), then (i),
        then (ii) at L2.
      breaking_artifact: >-
        A positive control that cannot fail; a lemma that assumes what it
        proves or a main statement that is not a pure assembly; the Hess
        obligation neither read nor numbered, or a dependent statement left
        unmarked; a heuristic without a validation arm or with an arm that
        cannot fail; a rule with a null false-fire rate above 5 percent or
        not computed; a declared outcome no data can reach or an arm that
        does not reach its outcome as coded; a degenerate declared cell, arm
        or lane not recorded as such; PTM-B or PTM-E on which the argument or
        the rules reach the known-false conclusion.
    - joint: >-
        J4 -- The charged cost model, the comparison, scope, wording and
        provenance (DC-H3, DC-H5, DC-H6 wording; DH-5, DH-6, DH-10, DH-11,
        DH-13). The cost table at the five deployed rows charges relation
        collection (the small-genus law at the provenance actually read),
        sparse linear algebra (dimension, row weight, memory and parallel
        scaling), the descent map and factor-base memory; the van
        Oorschot-Wiener comparison against parallel rho is priced under one
        stated machine model for both arms, never quoted; every row is
        conditional on the numbered heuristics and carries its o(1)/polylog
        disclosure, its regime ratio g / log2 q, its time-memory tradeoff and
        its optimistic assumptions flagged; matched rho is used only under
        CORR-20260922-81aeab; an affected-versus-safe scope statement is
        present and asserts no verdict; any statement depending on MMT pages
        20-21 or 25-42 or the journal version reads them first or is marked
        dependent; every citation carries provenance (recalled, retrieved,
        kb, internal) and no recalled reference supports a cost; no sentence
        is a deployed-row verdict (TH-1).
      assigned_to: TASK-20261002-17bf2f
      attack_plan: >-
        (i) Quote every sentence of the three files containing rho,
        matched, below, beats, faster, weakens, wash, resist, safe, broken,
        advantage or verdict; classify each as conditional statement, design
        figure or outcome; an outcome fires TH-1. (ii) Recompute the cost
        table under the contract's own model with your own code, row by row,
        and check that linear algebra, descent and memory are charged in
        every row and that rho and the index-calculus arm are charged under
        one accounting (the d11575 confounder on entries versus
        distinguished points). (iii) PTM-A, PTM-C and PTM-D (below). (iv)
        Check the provenance of the small-genus law (KN-LIT-164,
        KN-LIT-92caf4 or a source the contract retrieves) and of every other
        cost input; a recalled reference supporting a cost figure breaks the
        joint. (v) Check DC-H5 and TW-7257-1, the D-column exclusion, the
        scope statement and the interpretation limits (isogeny-extended GHS
        and other covers out of scope). Where I think it breaks: (ii) on the
        accounting, then (iv).
      breaking_artifact: >-
        A deployed-row verdict as an outcome (also TH-1); linear algebra,
        descent or memory uncharged in any row; the two arms charged under
        different accountings; the VOW comparison quoted rather than priced;
        a cost resting on a recalled reference; a DC-H5-dependent statement
        not marked; a missing scope statement or one that asserts a verdict;
        PTM-A, PTM-C or PTM-D on which the rules reach the known-false
        conclusion.
    - joint: >-
        J5 -- Blind re-derivation of the deployed-row arithmetic: the
        quantities Q0 to Q4 on the card of TASK-20261002-8d288b, from their
        definitions and a named public parameter tool alone.
      assigned_to: TASK-20261002-8d288b
      attack_plan: >-
        Fixed on the card; the re-deriver reads no producer artifact and no
        source that holds the answers. The composer compares its Q1 to Q4
        values with the contract's frozen figures quantity by quantity, and
        its Q2 values with MMT Table 3 as transcribed by
        TASK-20260929-0be49c, under the agreement tolerance below.
      breaking_artifact: >-
        Any value differing from the contract's frozen figures beyond the
        agreement tolerance (K-indeterminate). A Q2 value agreeing with the
        contract and disagreeing with MMT Table 3 is recorded as a source
        discrepancy for J1's owner's finding to be read against, not as a
        J5 break.

