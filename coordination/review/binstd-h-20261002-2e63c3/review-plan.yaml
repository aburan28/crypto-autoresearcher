          figures as a finding (T2).
        effect: >-
          The reviewer finishes its joint, flags TH-1 at the top of its report
          and stops. The composer records revise and does not approve while
          the sentence stands.
      - id: TH-2
        fires_when: >-
          Any record of the round contradicts a validated evidence record or a
          promoted finding, or states that Hess's non-kernel theorem is false
          or that MMT Remark 23's reported computation is wrong.
        effect: >-
          Stop and report. Composition is suspended until a dedicated
          review-breakthrough contradiction round is opened by a new
          Coordinator decision.
      - id: TH-3
        fires_when: >-
          The producer designed an attack or run at deployed parameters beyond
          arithmetic on published coefficients; computed anything on a toy
          cell the contract declares beyond the C-7 admissibility arithmetic
          (constructing the curve's points of order l', a trace sum, a cover,
