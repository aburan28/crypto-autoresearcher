      with DEC-20261002-a63f13 C-EQ as a fact (DEC-20261002-c01bb7 R-NA5-NA6).
      Under any other key it re-carries them with a reason.
    knowledge_duty: >-
      Under K-accept, the composer routes the three method lessons
