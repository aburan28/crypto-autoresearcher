    discharge_check: >-
      The composer checks that each of D-1 to D-8, the carried conditions,
      CI-1 to CI-6, DR-1 to DR-14 and every acceptance check of the accepted
      design maps to a named part of the closure or plan that the owning
      joint's report does not contradict, and compares trial-plan-r1.json's
      cells, q, r, candidate counts and the r1 route table with the values
      DEC-20261002-ff2bd5 accepted.
    keys:
      K-accept: >-
        JRI1 and JRI2 hold; every PTM meets its failure signature; no tripwire
        fired; the discharge check passes; the plan and route table agree with
        the accepted values. DEC-20261002-e23776 then ACCEPTS the r1 closure
        and trial-plan-r1.json as conformant to the specification (as amended,
        if amended). It does not approve execution and binds the plan to no
        run card: its first next action names an execution batch whose own
        opening decision issues the execution approval and binds the twenty
        trials to that batch's run card on a Linux host, subject to the
        selection-point duties. Acceptance asserts nothing about N_K(L),
        H-QSP-cd0c90, EV-QSP-a6aa4b or any curve.
      K-revise-defect: >-
        JRI1 or JRI2 breaks, a discharge item is unmet, or TRI-1, TRI-2, TRI-3,
        TRI-4 or TRI-6 (executor) fired. Decision revise, each defect listed
        with its joint and breaking artifact; a repair-revision card in a new
        batch as the first next action, subject to the selection-point duties.
      K-infra: >-
        A reviewer could not run a joint. That joint reads inconclusive. No
        acceptance while any joint is inconclusive.
      any_tripwire: See tier.tripwires.
    owner_reply_duty: >-
      The composer rules on any reply of coordinator-qsp-run-20260921 that
      DEC-20261002-c01bb7 R-QSP-RETURN routed to it, as a pointer.
    re_carried_duties: >-
