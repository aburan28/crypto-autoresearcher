      Each executor and reviewer uses a private scratch subdirectory,
      <session scratchpad>/BATCH-521e9d/<its TASK id>/, created by the session
      before launch and named in the launch prompt; temporaries only there;
      never list the scratchpad root or a sibling; never export or copy a
      whole git tree (check out only the declared paths at the snapshot
      commit; the disk is shared); every script and output relied on
      embedded in computations.json (reviewers) or the implementation report
      (executors). Scratch is not an artifact and is not archived.
    paths:
      TASK-20261002-38ffea: <session scratchpad>/BATCH-521e9d/TASK-20261002-38ffea/
      TASK-20261002-909f2c: <session scratchpad>/BATCH-521e9d/TASK-20261002-909f2c/
      TASK-20261002-60ec76: <session scratchpad>/BATCH-521e9d/TASK-20261002-60ec76/
      TASK-20261002-4c19d4: <session scratchpad>/BATCH-521e9d/TASK-20261002-4c19d4/

  # ---------------------------------------------------------------------------
  proves_too_much:
    assigned_to: TASK-20261002-60ec76 (PTM-RI1, PTM-RI2, PTM-RI3, PTM-RI6, PTM-RI7); TASK-20261002-4c19d4 (PTM-RI4, PTM-RI5, PTM-RI8)
    objects:
      - id: PTM-RI1
        owner: TASK-20261002-60ec76
        object: >-
          A synthetic stage result (synthetic cell, n outside the declared set)
          containing one row with N > 0 whose certificate file is deleted or
          never written, and separately one where two rows share a lambda and
          only one file exists, fed through the r1 accounting and checker.
        known_truth: >-
          Under certificate_semantics and the per-row binding of DR-2 neither
          missing row is certificate-bearing, so M5 fails and F_acct fires. A
          run that reports either as certificate-bearing or passes M5 has
          proved too much.
      - id: PTM-RI2
        owner: TASK-20261002-60ec76
        object: A synthetic row with root_count_listed below N and root_list_deferred false.
        known_truth: Under D-3 it must raise or be flagged and is never certificate-bearing.
      - id: PTM-RI3
        owner: TASK-20261002-60ec76
        object: >-
          A flat manifest without a top-level run key, and a terminal failed
          record without raw-result.json, written beside a synthetic run and
          fed to tools/validate_ledger.py check_run and to the r1 checker.
        known_truth: >-
          check_run rejects both (F-01; DEC-20261002-6e68d8 DR-1). An r1 path
          that writes or accepts either as valid has proved too much.
      - id: PTM-RI4
        owner: TASK-20261002-4c19d4
        object: >-
          r1 I_indep on a synthetic cell with its root search forced to fail
          for one factor (a test hook, monkeypatch or injected exception in
          your scratch copy).
        known_truth: >-
          A root is then missing. An I_indep that returns a count without
          raising or flagging has proved too much (F-11, CI-4).
      - id: PTM-RI5
        owner: TASK-20261002-4c19d4
        object: >-
          A copy of r1/indep in your scratch into which you insert, on one
          Band-L cell name, a call that computes deg gcd(X^(2^131) - X, L) by
          repeated squaring; fed to the closure's own independence audit and
          to your own.
        known_truth: >-
          That is I_direct's algorithm (F-04). An audit that passes it, or a
          route table that would accept it, has proved too much.
      - id: PTM-RI6
        owner: TASK-20261002-60ec76
        object: >-
          The r1 Stage-0 trial payload, entered through the plan's argv form,
          with an inserted module-level import of census code in main.py (in
          your scratch copy).
        known_truth: >-
          stages.stage_0 says no census code runs. A Stage-0 mechanism that
          does not detect and fail it has proved too much (F-06; round-1 C6d).
      - id: PTM-RI7
        owner: TASK-20261002-60ec76
        object: >-
          The r1 M9 matcher fed every path form the accepted design lists
          (round 1's cases f to k and the revision's additions) for each
          blind_from entry, and one non-canonical declaration.
        known_truth: >-
          Each form names a blind_from path or its parent, and a non-canonical
          entry cannot be audited (DEC-20261002-6e68d8 DR-3). A matcher that
          returns blind_from_respected true on any of them has proved too
          much.
      - id: PTM-RI8
        owner: TASK-20261002-4c19d4
        object: >-
          The six disguises D3a to D3f of REVIEW-QSP-RD-20261002-521e9d
          PTM-RD4 inserted into scratch copies of r1/indep on synthetic cells,
          and the unmodified legitimate routes on the same cells, fed to the
          closure's own trace audit.
        known_truth: >-
          Every disguise computes I_direct's quantity with I_direct's modulus
          and final gcd; the legitimate routes are independent. An audit that
          admits a disguise, or rejects a legitimate route, has proved too
          much.
    failure_signature: >-
      A conformant closure keeps each known-false conclusion out of reach:
      PTM-RI1 fails M5 with F_acct on both cases; PTM-RI2 raises or flags;
      PTM-RI3 is rejected by check_run and never written by r1; PTM-RI4 raises
      or flags; PTM-RI5 is rejected as not independent; PTM-RI6 fails the
      Stage-0 gate; PTM-RI7 returns a hit or false on every form; PTM-RI8
      rejects all six disguises and passes both legitimate routes.
    how_to_run_it: >-
      Review computations in your scratch on synthetic cells with n outside
      {4, 7, 11, 12, 13, 31, 131} and on copies of r1 files; never on a
      declared cell and never by editing a committed file. They mint no RUN,
      write no evidence record and never execute trial-plan-r1.json. Put every
      script and output in computations.json.

