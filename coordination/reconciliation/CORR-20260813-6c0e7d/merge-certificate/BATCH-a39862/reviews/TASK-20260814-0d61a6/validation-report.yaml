limitations:
  - >-
    REVISE is a verdict on the snapshotted control-plane verifier only. The real
    frozen source package itself recomputed cleanly with exactly seven conflicts,
    and snapshot custody is byte-exact; neither fact repairs the two generic
    false-accept paths.
  - >-
    No postmerge certificate exists for the designated repository, and this
    review did not create one. All merges and index mutations used for controls
    occurred only in disposable temporary repositories.
  - >-
    The api_direct shell doctor had no usable API-key backend. This review used
    the separately authenticated native Codex session recorded in the runtime
    receipt; the doctor condition has no scientific effect.

claim_boundary:
  validated: >-
    The committed queue, four-path snapshot, frozen manifest/candidate, exact
    seven canonical resolution bytes, first-parent drift protection for the two
    required counterexamples, ordered-parent checks, candidate equality, and
    dirty/unmerged/standard-marker rejection recompute as stated. The real frozen
    53e9fa30/f07b6741 package and the current b83520d7 projection each have
    exactly six add/add plus one content conflict.
  not_validated: >-
    The verifier is not yet a fail-closed exact merge certificate: it accepts a
    forged caller-supplied ledger-success assertion and can miss a Git
    directory/file conflict. Therefore this review does not authorize later
    merge execution, a merge, live-goal edit, BATCH-0bfcc8 activation, B180
    ratification, implementation or execution authority, an experiment, a run,
    or any scientific status or ECDLP claim.
  evidence_direction: neutral
  experiment_runs: 0

