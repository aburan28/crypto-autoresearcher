blocking_findings:
  - finding: caller_supplied_ledger_success_is_not_authenticatable
    severity: blocking
    disposition: REVISE
    affected_code:
      - tools/verify_exact_merge_certificate.py:582
      - tools/verify_exact_merge_certificate.py:686
    observation: >-
      Post mode accepts any readable JSON object with the expected schema,
      merge_commit, one allow-listed command vector, exit_code 0, and
      new_violations 0. It does not require the file to be inside the repository,
      bind the producing validator bytes or stdout/stderr, prove that the command
      ran, or bind an immutable archive receipt.
    minimal_reproduction: >-
      In a clean exact two-parent toy merge whose repository contained no
      tools/validate_ledger.py at all, an external five-field JSON merely claiming
      [python3, tools/validate_ledger.py], exit_code 0, and new_violations 0 was
      supplied. The verifier returned PASS with ledger source
      caller_supplied_result even though that command could not have run in the
      inspected repository.
    false_accept_observed: true
    impact: >-
      The required baseline-aware no-new-violation ledger gate is a self-asserted
      caller claim rather than mechanically verified evidence. A later merge can
      receive a PASS certificate without any ledger validation.
    required_repair: >-
      Prefer removing caller-supplied success and always run the exact allow-listed
      validator in the clean inspected merge checkout. If an external result must
      remain supported, define and verify non-forgeable immutable provenance that
      binds the merge commit, validator blob, command, baseline, exit code,
      stdout/stderr digests, and an archive commit; a bare local JSON assertion is
      insufficient.
    required_regression: >-
      The exact reproduction above must reject, while a genuinely executed and
      byte-bound no-new-violation validation must pass.

  - finding: flattened_tree_comparison_misses_directory_file_conflicts
    severity: blocking
    disposition: REVISE
    affected_code:
      - tools/verify_exact_merge_certificate.py:418
      - tools/verify_exact_merge_certificate.py:525
    observation: >-
      _structural_conflicts compares only equal leaf-path keys in three flattened
      ls-tree maps. It does not model Git path-prefix conflicts, so a first-parent
      file at path shape and a second-parent file at shape/leaf.txt are each
      misclassified as one-sided changes rather than a file/directory conflict.
    minimal_reproduction: >-
      A temporary exact-contract repository retained the seven declared canonical
      conflicts and unchanged canonical OIDs, added first-parent file shape and
      second-parent shape/leaf.txt, and supplied the exact observed first-parent
      allowlist. Pre mode returned PASS and reported seven conflicts. Git
      merge-tree returned conflict exit 1 with an eighth path
      shape~6bcb71d4e06f1eabdb0d5c0912aa248f89682831 and a
      CONFLICT (file/directory) diagnostic.
    false_accept_observed: true
    impact: >-
      The premerge certificate does not enforce the declared exact Git conflict
      set for all repository trees. An undeclared conflict class can survive the
      gate and invalidate the later deterministic-resolution assumptions.
    required_repair: >-
      Derive the conflict set from Git's actual merge semantics in an isolated
      temporary object/index context that cannot write the designated repository,
      including directory/file and rename-related classes, then compare the exact
      paths and classes to the frozen contract. At minimum, explicitly reject all
      cross-tree file/path-prefix collisions before PASS.
    required_regression: >-
      The directory/file reproduction above must reject as an undeclared eighth
      conflict. Keep the ordinary extra-conflict, exact-seven real frozen, and
      seven-OID-only controls.

