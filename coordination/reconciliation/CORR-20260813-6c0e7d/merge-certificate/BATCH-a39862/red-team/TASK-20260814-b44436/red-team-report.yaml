      verifier_status: PASS
      reported_ledger_source: caller_supplied_result
      synthetic_merge_ordered_parents:
        - "17cbc6230bbdaebff7112b8c335a4fa2764e3bc5"
        - "d6c0a55b865cd29d4c99dff8174ef499bf4ba38d"
      candidate_bytes_equal: true
    code_path:
      accepted_by: tools/verify_exact_merge_certificate.py:_check_ledger_result
      accepted_fields_only: true
      validator_process_or_attested_receipt_verified: false
