      candidate_substitution_test_rejected: true
      dirty_worktree_test_rejected: true
      standard_marker_test_rejected: true
      frozen_candidate_standard_marker_lines: 0
    concerns:
      - >-
        Inherited GIT_INDEX_FILE, GIT_WORK_TREE, GIT_DIR, object alternates, or
        replacement refs can redirect the state that read-only Git commands
        inspect while the default repository state is different.
      - >-
        MARKER_PATTERNS omits the standard separator line =======, requires a
        literal space after the begin/end marker, and git grep -I ignores
