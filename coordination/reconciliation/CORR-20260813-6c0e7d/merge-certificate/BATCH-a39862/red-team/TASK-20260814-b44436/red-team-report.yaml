objections:
  - id: RT-OBJ-B44436-01
    severity: blocking
    category: false_ledger_validation_attestation
    statement: >-
      Caller-supplied result mode accepts an unauthenticated assertion of
      validator success. Schema, merge OID text, allow-listed command text,
      exit_code zero, and new_violations zero can all be written by the caller;
      none proves the validator ran against the merge.
    violated_contract_boundary: >-
      DEC-20260813-f3b4e6 and CORR-20260813-6c0e7d require baseline-aware
      ledger validation with no new violations, not a self-authored statement
      that such validation succeeded.
    disposition: verifier_not_ready_to_guard_merge
  - id: RT-OBJ-B44436-02
    severity: required_hardening
    category: inherited_git_view
    statement: >-
      Read-only Git commands inherit replacement, graft, shallow, alternate
      index, worktree, object, and configuration state. The verifier must bind
      raw committed objects and the repository's intended default index/view.
  - id: RT-OBJ-B44436-03
    severity: required_coverage
    category: conflict_and_marker_semantics
    statement: >-
      Structural conflict classification and marker scanning do not cover the
      full Git conflict/marker semantics claimed by the interface.

required_controls:
  - id: RC-B44436-LEDGER-EXECUTION
    mandatory: true
    statement: >-
      Remove the unauthenticated caller-supplied ledger-result acceptance path.
      The verifier should execute the reviewed, hash-bound validator itself on
      the clean exact merge checkout and capture the actual command, merge
      binding, exit status, baseline identity, violation delta, and output
      hashes. If external execution must remain, require a separately trusted
      immutable execution receipt whose provenance cannot be authored by the
      merge caller; plain JSON field equality is insufficient.
  - id: RC-B44436-LEDGER-NEGATIVE-TEST
    mandatory: true
    statement: >-
      Add a regression that supplies exactly the 210-byte forged-success shape
      used here and requires post mode to reject it without trusted execution
      provenance.
  - id: RC-B44436-GIT-RAW-VIEW
    mandatory: true
    statement: >-
      Invoke Git with a minimal environment, set GIT_NO_REPLACE_OBJECTS=1,
      reject refs/replace, info/grafts, shallow repositories, and alternate
      index/worktree/object variables, and add negative controls for each
      retained mechanism.
  - id: RC-B44436-ACTUAL-CONFLICT-SEMANTICS
    mandatory: true
    statement: >-
      Bind the precheck to Git's actual exact unmerged path/class result in a
      disposable repository and cover content auto-merge, rename, and
      file-directory cases.
  - id: RC-B44436-MARKERS
    mandatory: true
    statement: >-
      Cover begin, separator, ancestor, and end markers independent of a
      literal following space and do not silently skip binary-classified tree
      entries when the claim is zero markers in the complete merge tree.
  - id: RC-B44436-REVIEW
    mandatory: true
    statement: >-
      Snapshot the successor bytes and obtain fresh independent
      review-breakthrough/max Validator and Red Team verdicts before any merge
      execution task is eligible.

counterexample_or_mutation: >-
  The cheapest confirmed bypass is a 210-byte caller-authored JSON object that
  copies the accepted schema and success fields. Complete post verification
  returned PASS even though no validator process executed. No Git-object,
  candidate, parent, tree, or index mutation was needed.

baseline_comparison: >-
  No Pollard-rho, BSGS, specialized ECDLP, runtime-cost, or experimental
  baseline applies. This is a zero-run repository control-plane review. The
  applicable baseline is fail-closed certificate integrity: a required check
  must be observed or attested by a trusted runner, not asserted by its caller.
