      content and does not model textual auto-merges, rename detection, or
      file-directory conflicts. The frozen positive result matches the
      manifest, but the implementation does not generally prove the contract's
      claimed exact pre-resolution unmerged set and Git conflict classes.
    cheapest_required_control: >-
      Add disposable-repository controls for a disjoint textual auto-merge, a
      rename conflict, and a file-directory conflict, and bind pre-mode output
      to Git's actual deterministic merge conflict result rather than only a
      tree-entry approximation.

