      strict_yaml_duplicate_keys_rejected: true
      strict_json_duplicate_keys_rejected: true
      verification_and_os_errors_return_nonzero: true
      unexpected_exceptions_do_not_return_pass: true
    concern: >-
      Exact object and topology checks remain dependent on Git's inherited
      local environment and replacement mechanisms. Sanitize Git state before
      treating exact OIDs as a certificate. No shell/path injection was found
      for the frozen reviewed paths.

  - id: RT-B44436-FORGED-LEDGER-SUCCESS
    target: false_ledger_validation_evidence
