    - The directory/file eighth-conflict reproduction is rejected or reported exactly.
    - Inherited Git index/object/replacement state cannot redirect certificate checks.
    - The real frozen premerge input still passes.
    - A new snapshot receives fresh independent review-breakthrough/max Validator and Red Team PASS verdicts.

