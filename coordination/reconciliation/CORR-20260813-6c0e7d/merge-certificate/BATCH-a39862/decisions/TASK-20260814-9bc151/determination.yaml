blocking_findings:
  - id: MCERT-FORGE-LEDGER-RESULT
    severity: blocking
    reproduced_by:
      - TASK-20260814-0d61a6
      - TASK-20260814-b44436
    finding: >-
      Complete post mode accepts a caller-authored five-field JSON that claims
      the allow-listed ledger command, exit_code 0, and new_violations 0 even
      when tools/validate_ledger.py does not exist and no validator ran. The
      returned PASS reports caller_supplied_result, so baseline-aware ledger
      validity is self-asserted rather than evidenced.
    cheapest_repair: >-
      Remove the unauthenticated caller-supplied-success path. Execute the
      hash-bound allow-listed validator inside the exact inspected clean merge
      checkout and bind validator bytes, baseline identity, command, exit code,
      stdout/stderr hashes, and violation delta in verifier output.
  - id: MCERT-MISS-DIRECTORY-FILE-CONFLICT
    severity: blocking
    reproduced_by:
      - TASK-20260814-0d61a6
    finding: >-
      A first-parent file shape and second-parent path shape/leaf.txt create an
      eighth Git directory/file conflict, but flattened identical-leaf-path
      comparison reports only the expected seven and returns PASS.
    cheapest_repair: >-
      Derive conflict identities/classes from Git merge semantics in an
      isolated object/index/worktree context, or fail closed on every cross-tree
      file/path-prefix collision and add exact directory/file regression tests.
  - id: MCERT-GIT-ENV-HARDENING
    severity: required_successor_control
    reproduced_by:
      - TASK-20260814-b44436
    finding: >-
      Git subprocesses inherit caller GIT_* state and replacement-ref behavior,
      so the successor must sanitize the object/index/worktree view and reject
      unsupported replacement or alternate-object configuration before PASS.

