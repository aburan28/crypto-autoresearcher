    implementation: >-
      The common _ProbeFailure receipt-persistence path sets
      verification.timestamp_order_valid to false immediately after it assigns
      a missing recorded_at or preserves the completed success-path recorded_at.
      Therefore no preliminary metadata cross-check can leave an affirmative
      timestamp assertion in a persisted failed receipt; the only code path
      that persists true remains the fully completed successful path.
    fixtures:
      - >-
        A pre-binding model mismatch with a backward failure-handler clock
        persists recorded_at 2026-08-02T12:00:01Z, has
        timestamp_order_valid false, and invokes no bindings runner.
      - >-
        A nonzero runtime-bindings result with a backward failure-handler clock
        persists recorded_at 2026-08-02T12:00:01Z and has
        timestamp_order_valid false.
      - >-
        Existing backward-final-success and reversed-binding fixtures remain
        failed with timestamp_order_valid false; the happy path continues to
        be verified with its exact final recorded_at.

