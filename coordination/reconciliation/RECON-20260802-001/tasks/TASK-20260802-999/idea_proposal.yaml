idea:
  schema: crypto.autoresearch.idea.v1
  id: IDEA-20260802-003
  task_id: TASK-20260802-999
  title: Root-bound occurrence ledger and capability-gated historical indexes
  class: tooling
  novelty_status: unverified
  authority:
    proposal_only: true
    candidate_authorized: false
    merge_authorized: false
    research_state_change_authorized: false
  claim: >-
    A deterministic reconciliation compiler can preserve and classify both
    BATCH-020 through BATCH-024 parent histories without making either parent
    dispatchable if an immutable trust lock outside the candidate binds every
    source object, every source occurrence receives one disposition, the
    outputs are historical indexes rather than runnable queues, and the
    dispatcher rejects both preservation namespaces before dependency checks.
  mechanism:
    name: root_bound_occurrence_and_authority_contract
    components:
      - external immutable parent/root/blob trust lock
      - 100-row source-occurrence ledger and 91-ID classification
      - 128-row preservation verification
      - occurrence-complete historical-reference manifest
      - non-authorizing historical index compiler
      - dispatcher preflight denial for preserved and historical inputs
    non_renaming_rule: >-
      Immutable tasks, reviews, and receipts retain their exact historical
      identities and states. A fresh successor ID never inherits status or a
      receipt merely because it cites an old occurrence.
  predictions:
    - metric: source_occurrence_rows
      expected: 100
    - metric: original_task_ids
      expected: 91
    - metric: source_state_totals
      expected: {completed: 78, cancelled: 10, blocked: 5, queued: 7}
    - metric: identity_classes
      expected: {unique: 82, shared_identical: 1, shared_conflicting: 8}
    - metric: preservation_mappings
      expected: {blob_copies: 126, absence_attestations: 2, total: 128}
    - metric: local_generated_reference_occurrences
      expected: {all_fifteen_artifacts: 340, five_queues: 311}
    - metric: preserved_variant_dispatches
      expected: 0
  minimal_test:
    positive:
      - compile twice from the same immutable parents and require byte-identical outputs
      - independently recompute all census, occurrence, and preservation counts
    negative_controls:
      - coordinated mutation of roots, targets, and in-tree metadata
      - omission or duplication of one source row or preservation mapping
      - replacement of either absence attestation by an empty file
      - rewrite of an immutable receipt or completed archive hash map
      - one unclassified DEC-20260731-009 or DEC-20260731-010 occurrence
      - direct, symlinked, or aliased dispatch from either preservation root
      - dependency evaluation of preserved TASK-20260801-040
      - copied completion state or receipt on a fresh successor identity
  falsification_conditions:
    - any compliant compilation is nondeterministic
    - any coordinated trust-anchor mutation passes
    - any source occurrence or reference occurrence lacks exactly one disposition
    - any preserved or historical index reaches task readiness evaluation
    - any fresh successor inherits completion or an archive receipt
  interpretation_limits:
    - static repository-integrity tooling only; no ECDLP evidence
    - no candidate, merge, experiment, or research-state transition is authorized
    - exact byte-level tables must be imported from the named Git objects and never guessed
  target_complexity:
    status: not_applicable
    reason: no ECDLP time or memory exponent is claimed
    tool_runtime: O(total input bytes plus occurrence and mapping rows)
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  pareto_assessment:
    dominated_by: unresolved
    rationale: >-
      The Idea Generator was not given the complete repository frontier and
      therefore did not fabricate a null. The earlier 15-path checker is
      cheaper but fails the expanded authority and coverage requirements.
    sota_delta:
      deterministic_authoring: 0_to_1
      source_entries_adjudicated: incomplete_to_100_of_100
      identity_classes_checked: incomplete_to_91_of_91
      preservation_mappings_checked: 30_to_128
      preserved_roots_rejected: 0_of_2_to_2_of_2
      uncovered_DEC_009_010_occurrences: 16_to_0_required
      ecdlp_exponent_delta: 0_not_applicable
  coordinator_review_required:
    accepted_candidates:
      - external trust lock
      - historical indexes instead of runnable inherited queues
      - exact occurrence and preservation ledgers
      - dispatcher denial before readiness
    identified_defects_to_correct:
      - proposed TASK-20260802-956 through TASK-20260802-958 aliases collide with reserved R6 through R9 tasks
      - TASK-20260802-996 and TASK-20260802-998 reviewed the prior repair and cannot attest to a superseding contract
      - supplied extracts permit exact 340 and 311 occurrence totals rather than an unresolved overlap
  provenance:
    role: idea-generator
    independent_session: true
    artifact_capture: coordinator_transcribed_structured_return
    repository_commands_run_by_idea_generator: false
    requested_policy: research-deep
    fallback_allowed: false
    degraded_allowed: false
