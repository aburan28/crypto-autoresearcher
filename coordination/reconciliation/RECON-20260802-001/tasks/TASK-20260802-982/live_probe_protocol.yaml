    - --independent-session
    - --timeout-seconds
    - '300'
  shell: false
  maximum_invocations: 1
  expected_probe_output: PROBE_OK
  expected_scope: exact_codex_session_only

execution_rules:
  - Create the TASK-984 directory before invocation; the receipt target itself must not exist.
  - Execute the frozen argv once, without a shell and without modifying environment or configuration.
  - Never enumerate Codex threads or inspect unrelated state. The adapter alone queries the exact emitted thread ID.
  - Preserve either the verified or failed immutable receipt; never retry into the same path.
  - Record command, exit code, stdout/stderr hashes and byte counts only; do not retain raw CLI events, prompts, credentials, environment, or unrelated IDs.
  - Do not mutate model-bindings.yaml or claim backend-wide verification.
  - A failed receipt is a tooling compatibility result, not ECDLP evidence; it blocks downstream review.
  - A verified receipt authorizes only independent validation of that receipt and possible later resume of that exact session after a new Coordinator decision.

acceptance_gates:
  - Adapter exits zero and writes a schema-valid immutable receipt.
  - Receipt status is verified, runtime_resolution_verified true, verification_scope exact_codex_session_only, global_backend_verified false, and model_bindings_mutated false.
  - Requested and observed model, xhigh effort, provider, CLI version, workdir, source, sandbox, session ID, and timestamps agree.
  - Runtime bindings check passes and receipt privacy invariant holds.
  - Receipt and Executor report are snapshot-committed before an independent Validator reviews live compatibility.

prohibited:
  - More than one live invocation.
  - Retrying after any failure.
  - Any ECDLP experiment, reconciliation merge, R3/R4 review, research-state change, or global binding mutation.
