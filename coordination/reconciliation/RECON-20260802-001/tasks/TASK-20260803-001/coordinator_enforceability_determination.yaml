  reference, archive, and preservation adjudication. The safest successor does
  not attempt to make either historical parent queue runnable. It compiles a
  complete non-authorizing historical index at each inherited generated path,
  preserves both parents exactly, and makes research_dispatch reject every
  affected inherited or preserved queue before dependency readiness is read.

