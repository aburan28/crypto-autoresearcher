role: executor
objective: >-
  Implement and run the frozen deterministic static checker for the exact
  15-row generated-artifact repair without materializing a merge candidate.

input_binding:
  verified_snapshot: 781e888a89e15e6668d49435b920f95d44f56aee
  dispatch_bind: e52059ef2
  phase_table: coordination/reconciliation/RECON-20260802-001/tasks/TASK-20260802-991/generated_artifact_phase_table.yaml
  inventory: coordination/reconciliation/RECON-20260802-001/reported_conflict_inventory.draft.yaml
  successor_map: coordination/reconciliation/RECON-20260802-001/tasks/TASK-20260802-950/successor_map.yaml
  validator_input: coordination/reconciliation/RECON-20260802-001/tasks/TASK-20260802-952/validation_report.yaml

implementation_observations:
  - >-
    The checker loads the frozen phase table, reported inventory, and successor
    map; it issues read-only git rev-parse parent:path commands for every named
    local and reanchor object and fails closed on an unavailable object.
  - >-
    It checks exact generated-path membership, 30 parent blobs, preservation
    target construction, exact unique non-authorizing markers, intermediate
    phase semantics, one unique in-scope regenerate action per row, and the
    five queue/JSON-plan/Markdown-plan batch trios.
  - >-
    The repair also checks all six ordered phase names and frozen contract
    values, exact TASK-955 scope additions with no overlap in TASK-951..958,
    exact BATCH-020..024 IDs and kind/path correspondence, distinct final and
    preservation targets, and 30 named parent object types (all blobs).
  - >-
    The final hardening binds phase roots to the successor preservation
    namespaces, validates the frozen phase-table envelope and final-validation
    sequence, and treats both exact and /** write scopes as overlap candidates.
  - >-
    The static report was produced only from the immutable snapshot inputs;
    no candidate tree, reconciliation merge, or regenerated batch artifact was
    materialized.

mutation_coverage:
  - generated_path_set_mismatch
  - parent_blob_or_preservation_mismatch
  - marker_mismatch_or_duplicate
  - final_action_cardinality
  - final_output_outside_task_955_scope
  - non_intermediate_reanchor_equality
  - incomplete_batch_trio
  - phase_contract_mismatch
  - task_955_scope_additions_mismatch
  - task_955_scope_additions_overlap
  - preservation_root_mismatch
  - phase_envelope_mismatch
  - parent_object_type_invalid

commands:
  - argv: [python3, -m, pytest, -q, tests/test_check_reconciliation_generated_artifacts.py]
    environment: {PYTHONDONTWRITEBYTECODE: '1'}
    exit_code: 0
    stdout: '13 passed in 11.52s'
    stderr: ''
  - argv: [python3, tools/check_reconciliation_generated_artifacts.py, --report, coordination/reconciliation/RECON-20260802-001/tasks/TASK-20260802-993/static_check_report.json]
    exit_code: 0
    stdout: ''
    stderr: ''
    result: {pass: true, row_count: 15, blob_check_count: 30, object_type_check_count: 30, batch_trio_count: 5, findings: []}
  - argv: [python3, tools/check_runtime_bindings.py]
    exit_code: 0
    stdout: 'OK: 5 roles consistent with every runtime binding'
    stderr: ''
  - argv: [python3, tools/validate_ledger.py]
    exit_code: 0
    stdout: 'OK: validated 2465 records, no new violations'
    stderr: '2248 grandfathered legacy errors suppressed; 289 legacy schema issues remain read-only.'
  - argv: [python3, tools/check_merge_hygiene.py]
    exit_code: 0
    stdout: 'PASS: no conflict markers, no unparseable records'
    stderr: 'Six baseline-maintenance notes only; no failure.'
  - argv: [git, diff, --check]
    exit_code: 0
    stdout: ''
    stderr: ''

protocol_deviations: []
anomalies: []
limitations:
  - >-
    This checker validates the frozen prescription and named parent objects;
    it does not validate a candidate final tree and does not authorize one.
  - >-
    Passing checks are implementation observations only, not validation,
    merge authorization, research evidence, or a research-state decision.

