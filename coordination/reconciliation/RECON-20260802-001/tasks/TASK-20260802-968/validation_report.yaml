  findings:
    - id: F-968-001
      severity: blocking
      class: event_cardinality_fail_open
      protocol_requirement: >-
        Parse stdout as JSONL and require exactly one thread.started event with
        exactly one valid thread ID.
      source_refs:
        - orchestration/adapter/codex_runtime.py:265
        - orchestration/adapter/codex_runtime.py:278
        - orchestration/adapter/codex_runtime.py:288
      observation: >-
        The parser appends only valid IDs and tests len(ids), so an invalid
        thread.started event is omitted from the event count. The adversarial
        input had two thread.started events but returned count 1, a valid ID,
        and probe_output_matches true.
      required_disposition: >-
        Blocks acceptance. A successor implementation must count all
        thread.started events separately from valid-ID cardinality and add a
        frozen regression fixture; this Validator does not repair it.
    - id: F-968-002
      severity: blocking
      class: receipt_timestamp_fail_open
      protocol_requirement: >-
        Launch, thread, row, rollout, and receipt timestamps must have a
        consistent order, and no unknown or inconsistent value may produce a
        verified receipt.
      source_refs:
        - orchestration/adapter/codex_runtime.py:663
        - orchestration/adapter/codex_runtime.py:665
        - orchestration/adapter/codex_runtime.py:686
        - orchestration/adapter/codex_runtime.py:687
      observation: >-
        The verified path overwrites identity.recorded_at after the only
        timestamp cross-check and never revalidates it. The adversarial fixture
        returned verified with timestamp_order_valid true while final
        recorded_at was 100 seconds before launch start.
      required_disposition: >-
        Blocks acceptance. A successor must validate the exact final persisted
        recorded_at and binding-check interval before setting verified and add
        a regression fixture; this Validator does not repair it.
    - id: F-968-003
      severity: blocking
      class: failed_receipt_omitted
      protocol_requirement: >-
        Any invalid argument must fail nonzero and, when the receipt can be
        safely created, write an immutable failed receipt containing only safe
        facts.
      source_refs:
        - orchestration/adapter/codex_runtime.py:573
        - orchestration/adapter/codex_runtime.py:578
        - orchestration/adapter/codex_runtime.py:697
        - orchestration/adapter/config.py:53
        - orchestration/adapter/config.py:67
      observation: >-
        cfg.canonical_policy raises ConfigError for an unknown policy, but
        probe_codex_session catches only _ProbeFailure. The adversarial fixture
        observed ConfigError, no subprocess launch, and no receipt file even
        though its new target was safely creatable.
      required_disposition: >-
        Blocks acceptance. A successor must map configuration rejection to a
        frozen failure code and immutable failed receipt and add a regression
        fixture; this Validator does not repair it.

