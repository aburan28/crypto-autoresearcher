        the committed trace fixture observes one ID-bound SELECT and no state
        mutation or enumeration.
    - gate: rollout_path_containment
      status: ACCEPT
      evidence: >-
        The rollout path comes only from the matched row, rejects parent
        traversal, resolves strictly beneath the canonical state-database
        parent, requires a regular file, and rejects symlink escape and missing
        paths without globbing or directory enumeration.
    - gate: subprocess_safety
      status: ACCEPT
      evidence: >-
        Version, probe, and binding checks use argv lists, shell=false,
        stdin=DEVNULL, explicit timeouts, captured output, and no --ephemeral.
        The metacharacter fixture confirms no shell execution.
    - gate: launch_event_cardinality
      status: REJECT
      evidence: >-
        _parse_launch_stdout counts only valid IDs rather than all
        thread.started events. A stream containing two thread.started events,
        one malformed and one valid, is returned as one valid event and can
        continue toward a verified receipt.
      finding: F-968-001
    - gate: exact_runtime_cross_checks
      status: ACCEPT
      evidence: >-
        Model, effort, non-empty row provider, CLI version, canonical cwd,
        source, sandbox, session ID, and ordinary timestamp mismatches are
        compared across the requested values, state row, session_meta, and
        turn_context and are covered by static inspection plus fixtures.
      qualification: >-
        Final receipt timestamp validation is assessed separately and fails.
    - gate: timestamp_logic
      status: REJECT
      evidence: >-
        timestamp_order_valid is computed before the runtime-binding check;
        identity.recorded_at is then overwritten with a later unvalidated
        clock reading. A synthetic backward final reading yields status
        verified and timestamp_order_valid true even though final recorded_at
        precedes launch_started_at.
      finding: F-968-002
    - gate: receipt_privacy_and_hashing
      status: ACCEPT
      evidence: >-
        Constructed receipts retain the allowlisted state facts, relative
        rollout path, fixed public prompt in safe argv, byte counts, and
        required SHA-256 digests. Tests and inspection find no raw stdout,
        stderr, rollout events, unrelated ID, private instructions, token,
        environment dump, absolute state path, absolute receipt path, or
        absolute rollout path.
    - gate: receipt_immutability
      status: ACCEPT
      evidence: >-
        Receipt existence is checked before subprocess launch and persistence
        uses O_CREAT|O_EXCL with mode 0600, flush, and fsync. Existing and
        failed receipts are not overwritten.
    - gate: fail_closed_failure_semantics
      status: REJECT
      evidence: >-
        Ambiguous thread output and invalid final receipt time can reach a
        verified result, and ConfigError from an unknown policy escapes the
        probe's _ProbeFailure handler without creating the safely creatable
        immutable failed receipt required by TASK-964.
      findings:
        - F-968-001
        - F-968-002
        - F-968-003
    - gate: session_only_no_global_verification
