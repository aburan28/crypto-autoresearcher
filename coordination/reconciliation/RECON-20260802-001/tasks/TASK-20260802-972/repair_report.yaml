requirement_traceability:
  - id: R-970-001
    finding: F-968-001
    implementation: >-
      _parse_launch_stdout now counts every thread.started JSON object in
      thread_events while independently collecting valid UUID IDs. The caller
      persists the event count before rejecting zero events or a sole malformed
      ID as thread_id_missing, and rejects every count other than one as
      thread_id_ambiguous before state lookup.
    fixtures:
      - invalid-plus-valid thread.started events fail thread_id_ambiguous, retain count two, and do not call _query_state_row.
      - one malformed thread.started ID fails thread_id_missing, retains count one, and does not call _query_state_row.
      - two valid thread.started events fail thread_id_ambiguous and retain count two.
  - id: R-970-002
    finding: F-968-002
    implementation: >-
      A preliminary _cross_checks pass evaluates all request/state/rollout and
      launch/row/session/turn/thread-window checks before the runtime-binding
      subprocess, using launch_end placeholders without consuming or persisting
      recorded_at. After the subprocess, _cross_checks validates launch_start
      <= launch_end <= binding_start <= binding_end <= the single persisted
      recorded_at. Verification status is set only after this final check and
      recorded_at is not overwritten.
    fixtures:
      - a final clock value preceding launch fails timestamp_invalid.
      - a reversed binding interval fails timestamp_invalid.
      - the happy path asserts the single final timestamp 2026-08-02T12:00:06Z.
      - a metadata model mismatch fails before bindings_runner is called.
  - id: R-970-003
    finding: F-968-003
    implementation: >-
      ConfigError raised by canonical policy resolution is converted to the
      existing invalid_argument _ProbeFailure, so the established failure path
      exclusively creates a failed receipt when the target is safely creatable.
    fixtures:
      - an unknown policy raises CodexRuntimeProbeError with invalid_argument, writes a failed receipt, and invokes no process runner.
      - retrying that unknown-policy request returns receipt_exists and preserves the receipt bytes.

implementation_observations:
