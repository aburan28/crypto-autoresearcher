    - path: verified_receipt_timestamp_order
      status: ACCEPT
      evidence: >-
        The exact final timestamp is captured after a successful bindings
        check, passed into the final _cross_checks call, and is not overwritten
        before exclusive persistence. Backward final time and reversed binding
        interval fixtures fail timestamp_invalid.
    - path: failed_receipt_timestamp_order
      status: REJECT
      evidence: >-
        Preliminary _cross_checks writes timestamp_order_valid using launch_end
        placeholders. A later pre-final failure skips final _cross_checks; the
        exception handler then assigns recorded_at without recomputing the bit.
        Independent synthetic-clock fixtures produced two inconsistent failed
        receipts, detailed in F-974-001.
    - path: failed_receipt_creation_and_immutability
      status: ACCEPT_WITH_BLOCKING_QUALIFICATION
      evidence: >-
        Unknown policy now writes one immutable invalid_argument receipt before
        any subprocess, and retry is refused. Existing failed receipts are not
        overwritten. The qualification is semantic rather than persistence:
        F-974-001 shows that a persisted failed receipt can contain a false
        timestamp_order_valid assertion.
    - path: pre_binding_metadata_gate
      status: ACCEPT_WITH_BLOCKING_QUALIFICATION
      evidence: >-
        A model mismatch prevents the bindings runner from being invoked, as
        required. Yet that same path can preserve the preliminary true
        timestamp bit while the exception handler records an earlier final
        time; therefore the invocation gate passes but final receipt semantics
        do not.

