  adjacent_regression_audit:
    - path: launch_event_cardinality
      status: ACCEPT
      evidence: >-
        Invalid-plus-valid, sole malformed, and two-valid thread.started event
        streams all fail before state lookup with truthful event counts. Zero
        events remains thread_id_missing. No reviewed event-cardinality path
