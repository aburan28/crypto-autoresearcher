  findings:
    - id: F-974-001
      severity: blocking
      class: failed_receipt_timestamp_attestation_stale
      protocol_requirement: >-
        R-970-002 requires timestamp_order_valid to describe the exact
        recorded_at value persisted in the final receipt; no unknown or
        inconsistent timestamp may survive as an affirmative assertion.
      source_refs:
        - orchestration/adapter/codex_runtime.py:679
        - orchestration/adapter/codex_runtime.py:685
        - orchestration/adapter/codex_runtime.py:686
        - orchestration/adapter/codex_runtime.py:698
        - orchestration/adapter/codex_runtime.py:699
        - orchestration/adapter/codex_runtime.py:724
        - orchestration/adapter/codex_runtime.py:729
      observation: >-
        The preliminary _cross_checks call evaluates timestamp order with
        binding_start=binding_end=recorded_at=launch_end and writes
        timestamp_order_valid true. If a metadata mismatch raises at line 687,
        or if the bindings subprocess returns nonzero at line 699, the final
        _cross_checks call is skipped. The exception handler assigns the exact
        persisted recorded_at only when it was still null and does not
        recompute timestamp_order_valid.
      independent_fixture_evidence:
        - case: binding_failure_backward_final_clock
          failure_codes: [runtime_bindings_check_failed]
          status: failed
          runtime_resolution_verified: false
          launch_started_at: '2026-08-02T12:00:02Z'
          binding_started_at: '2026-08-02T12:00:04Z'
          binding_ended_at: '2026-08-02T12:00:05Z'
          recorded_at: '2026-08-02T12:00:01Z'
          timestamp_order_valid: true
          receipt_written: true
        - case: pre_binding_model_mismatch_backward_final_clock
          failure_codes: [model_mismatch]
          status: failed
          runtime_resolution_verified: false
          launch_started_at: '2026-08-02T12:00:02Z'
          binding_runner_calls: 0
          recorded_at: '2026-08-02T12:00:01Z'
          timestamp_order_valid: true
          receipt_written: true
      impact: >-
        These receipts remain failed and cannot prove runtime resolution, but
        their affirmative timestamp bit is false for the immutable recorded
        value. That violates R-970-002 and receipt-integrity rules; TASK-974's
        completion gate makes any such defect acceptance-blocking.
      required_disposition: >-
        Reject this snapshot. A successor repair must ensure every safely
        persisted receipt computes timestamp_order_valid against its exact
        recorded_at, including failures before or during the bindings gate,
        without weakening the pre-binding invocation gate. This Validator does
        not repair the implementation.

