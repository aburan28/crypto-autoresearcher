      disposition: CLOSED
      status: ACCEPT
      evidence: >-
        _parse_launch_stdout now increments thread_events for every JSON object
        of type thread.started independently from valid UUID collection. The
        caller persists the count and rejects count zero, a sole malformed ID,
        and every count other than one before state lookup. The committed
        regression fixtures pass, and an independent mixed invalid-plus-valid
        fixture returned thread_id_ambiguous with count two, zero state lookups,
        failed status, and runtime_resolution_verified false.
    - finding: F-968-002
      disposition: CLOSED_AS_ORIGINALLY_REPORTED
      status: ACCEPT_WITH_BLOCKING_ADJACENT_DEFECT
      evidence: >-
        On the successful runtime-bindings path, the implementation captures
        one final recorded_at, validates launch_start <= launch_end <=
        binding_start <= binding_end <= recorded_at, and never overwrites it.
        The original adversarial verified-receipt path therefore closes and
        the two committed final-order regression fixtures pass. R-970-002 is
        nevertheless rejected because new F-974-001 shows that failed paths
        can persist a different unchecked recorded_at while retaining the
        preliminary timestamp_order_valid value.
    - finding: F-968-003
      disposition: CLOSED
      status: ACCEPT
      evidence: >-
