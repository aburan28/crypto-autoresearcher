  findings:
    - id: RT997-F01
      severity: blocking
      title: Coordinated drift is accepted
      objection: >-
        Cross-file equality is not an authority anchor. The checker derives
        targets and markers from mutable phase roots and compares those roots
        only with mutable successor-map roots. Coordinated mutation of every
        linked value passes.
      impact: >-
        The checker cannot establish that the candidate uses the reviewed
        roots or marker namespace.
      disposition: OBJECT

    - id: RT997-F02
      severity: blocking
      title: Non-authorizing markers have no enforcing consumer
      objection: >-
        Markers are out-of-band metadata and intentionally do not mutate the
        preserved queue blobs. research_dispatch accepts an arbitrary queue
        path and bases readiness on task state and dependencies without
        consulting marker metadata.
      impact: >-
        A preserved canonical-looking queue remains executable if supplied to
        the dispatcher. Non-authority is a convention, not an enforced
        boundary.
      disposition: OBJECT

    - id: RT997-F03
      severity: blocking
      title: Coordinator-authored queues are semantically underdetermined
      objection: >-
        The ten plans are mechanically derivable, but the five queues are not.
        Their parents contain 100 task entries and 91 original task IDs, with
        78 completed, 10 cancelled, 5 blocked, and 7 queued entries. The
        prescription does not state which lineage wins, whether both appear,
        or how queued and blocked work becomes inert.
      impact: >-
        A plausible regeneration can silently reactivate work. In particular,
        preserved reanchor BATCH-024 makes TASK-20260801-040 immediately ready.
      disposition: OBJECT

    - id: RT997-F04
      severity: blocking
      title: Same-ID task descriptors remain unresolved
      objection: >-
        All nine BATCH-020 task IDs occur in both parents. TASK-20260731-043 is
        identical; TASK-20260731-040 through 042 and 044 through 048 differ.
        The prescription remaps only 044 through 048. The three differing
        040-through-042 descriptors have no source-choice or successor rule.
      evidence: >-
        Differences include DEC-20260731-009 versus DEC-20260731-018,
        DEC-20260731-010 versus DEC-20260731-019, a remap note, and differing
        review inputs.
      disposition: OBJECT

    - id: RT997-F05
      severity: blocking
      title: Reference and receipt closure is incomplete
      objection: >-
        The successor map declares 29 remap pairs in seven categories. Twenty-one
        old IDs appear 324 times across the 15 local generated artifacts,
        including 295 occurrences in the five queues. The queues also contain
        16 DEC-20260731-009/010 occurrences not covered by that map.
      receipt_boundary: >-
        The two parents contain 44 archive-task entries, 35 of them completed
        and hash-bound. Immutable receipts cannot be renamed in place. New task
        IDs therefore require new handoffs, outputs, reviews, and archive
        receipts rather than textual substitution.
      disposition: OBJECT

    - id: RT997-F06
      severity: blocking
      title: Effective scope and R5 lineage are not executable yet
      objection: >-
        The two repair additions are absent from the frozen TASK-955 scope and
        no TASK-955 handoff exists. The repaired review queue ends with report
        archives TASK-996 and TASK-998 and contains no R5 successor. The
        original TASK-954 depends on TASK-952 and TASK-953, not the new
        TASK-995/TASK-997 archives.
      impact: >-
        A Coordinator must author a superseding R5 envelope and an effective
        candidate-task scope before execution can be bounded.
      disposition: OBJECT

    - id: RT997-F07
      severity: blocking_pending_candidate
      title: Historical package preservation is not covered by the checker
      objection: >-
        Complete preservation requires 128 parent/path mappings: 126 actual
        blob copies and two explicit local-absence attestations. The generated
        artifact checker examines only the 30 parent blobs for the 15 generated
        paths and does not validate the preservation manifest or EXP-DS-001
        package closure.
      disposition: INCONCLUSIVE_PENDING_CANDIDATE

