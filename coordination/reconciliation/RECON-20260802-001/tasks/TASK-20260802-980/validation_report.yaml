        independently of UUID validity. The caller rejects zero, a sole
        malformed ID, and every event count other than one before state lookup;
        the invalid-plus-valid, sole-malformed, and two-valid fixtures pass.
    - finding: F-968-002
      disposition: REAFFIRMED_CLOSED_FULL_SCOPE
      status: ACCEPT
      evidence: >-
        The successful path still captures the final recorded_at once after the
        binding interval, validates the exact launch/binding/final order, and
        never overwrites it. Backward-success and reversed-binding paths persist
        failed receipts with a false bit. F-974-001's adjacent failed-path gap
        is now closed by the common handler.
    - finding: F-968-003
      disposition: REAFFIRMED_CLOSED
      status: ACCEPT
      evidence: >-
        ConfigError from canonical policy resolution remains inside the
        receipt-writing try block and maps to invalid_argument. The committed
        fixture confirms one immutable failed receipt, no subprocess launch,
        and receipt_exists on retry.

