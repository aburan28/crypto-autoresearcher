scope_disjointness:
  pairwise_non_overlapping: true
  qualification: >-
    TASK-951 stage_only_scope grants no write authority over completed TASK-950
    artifacts. TASK-954 and TASK-958 only archive predecessor review outputs;
    their stage-only scopes grant no edit authority. TASK-955 is the sole merge
    producer and runs alone. TASK-956 is the sole merge snapshot task. The
    Validator and Red Team scopes are disjoint. SSI and ECTD source semantics
    are deferred to later goal-owned campaigns; TASK-955 only preserves their
    exact parent blobs in the reconciliation variant namespaces.

