  unchanged_between_snapshot_and_execution_base: true
  execution_base_commit: c4f4f74ac8aca37f9a93bab6de5ad31744cdbd8d
  handoff: ledger/handoffs/TASK-20260802-966.yaml

implementation_observations:
  - >-
    Added orchestration.adapter.codex_runtime using subprocess argument lists
    with shell=false, no stdin, explicit timeouts, executable hashing, exact
    JSONL event cardinality, and no --ephemeral flag.
  - >-
    The state database is opened with SQLite URI mode=ro and
    PRAGMA query_only=ON. The only SELECT is the frozen parameterized query
    with WHERE id = ? LIMIT 2, using only the parsed thread.started ID.
  - >-
    The rollout path is resolved from the matching row only. Traversal,
    symlink escape, missing files, paths outside the state database's Codex
    home, and unsupported event schemas fail closed; no directory enumeration
    or globbing is performed.
  - >-
    Receipt persistence uses exclusive creation at mode 0600. Existing targets
    are refused before any subprocess, and both failed and verified receipts
    are immutable.
  - >-
    Receipts retain allowlisted state facts, safe argv, timestamps, byte
    counts, and SHA-256 digests. They do not retain raw subprocess output,
    raw rollout events, private prompts/instructions, environment values,
    credentials, tokens, absolute state/receipt/rollout paths, or unrelated
    thread identifiers.
  - >-
    A fixture receipt becomes verified only after exact model, effort,
    provider, CLI version, cwd, source, sandbox, session ID, and timestamp
    cross-checks plus a zero-exit runtime-binding check.
  - >-
    Adapter version changed from 1.0.0 to 1.1.0. No manifest edit was needed:
    orchestration/adapter/manifest.py already imports ADAPTER_VERSION from
    config.py, and the task write scope did not include manifest.py.
  - >-
    Documentation now distinguishes exact-session verification from backend
    catalog verification and states that a session receipt cannot mutate or
    upgrade model-bindings.yaml.

fixture_coverage:
  fake_runtime_only: true
  live_codex_probe_run: false
  real_codex_state_inspected: false
  network_used: false
  research_runs_executed: 0
  cases:
    - verified exact-session happy path
    - missing and ambiguous thread.started events
    - nonzero launch, timeout, and missing or extra assistant output
    - unparseable CLI version
    - missing and duplicate state rows
    - missing, duplicate, malformed, and mismatched session_meta and turn_context
    - model, effort, provider, CLI version, cwd, source, sandbox, session ID, and timestamp mismatches
    - rollout traversal, symlink escape, missing file, and unsupported metadata
    - existing-receipt refusal and failed-receipt immutability
    - runtime-binding checker failure
    - receipt privacy and unrelated-thread exclusion
    - SQLite URI read-only mode, query_only, and exact-ID SELECT trace
    - spaces and shell metacharacters with argv lists and shell=false
    - no mutation or verification implication for model-bindings.yaml

