limitations:
  - >-
    No live Codex session was launched and no real Codex database or rollout
    was read, as prohibited by the handoff. Production behavior therefore
    remains subject to independent validation against an authorized fresh
    session before downstream review dispatch.
  - >-
    A verified receipt has verification_scope exact_codex_session_only. It is
    not backend-wide model verification and cannot be reused for another
    thread.
  - >-
    The Executor records implementation and fixture-test observations only;
    no acceptance verdict, inference amendment, merge authorization, or
    research-state decision is made here.

