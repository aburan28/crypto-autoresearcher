protocol_deviations: []
anomalies:
  - >-
    An initial implementation treated archive reachability from a source
    parent as a required predicate. The frozen contract did not make that
    claim. The final implementation instead records the 17 unreachable
    archive commits as an observation and verifies their exact Git objects,
    paths, and hashes without inventing ancestry.
limitations:
  - >-
    No reconciliation candidate, repository preservation tree, or inherited
    history output was materialized. Positive materialization controls used
    framework temporary directories only.
  - >-
    Passing implementation and static checks are Executor observations only.
    They do not authorize a candidate, merge, BATCH-031, ECDLP experiment,
    hypothesis transition, or goal transition, and remain pending an immutable
    snapshot plus fresh independent Validator and Red Team review.

