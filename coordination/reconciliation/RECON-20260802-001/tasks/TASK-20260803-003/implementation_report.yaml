implementation_observations:
  - >-
    The compiler hard-codes and verifies the exact contract snapshot commit,
    its parent, contract digest, source parents, preservation roots, and
    control-document digests before compiling any output.
  - >-
    Semantic inputs are read from immutable Git objects. Candidate-side or
    dirty-worktree replacements cannot redefine the trust anchor.
  - >-
    The exact source census contains 100 occurrences over 91 original IDs:
    78 completed, 10 cancelled, five blocked, and seven queued. Identity
    classification is 82 unique, one shared-identical, and eight
    shared-conflicting IDs.
  - >-
    The exact archive census contains 44 entries: 35 hash-bound and nine
    legacy unbound entries. Seventeen hash-bound archive commits are not
    reachable from their respective source parent; the compiler records this
    as an explicit observation while independently verifying the named Git
    object, path, and digest.
  - >-
    The monitored-reference table contains 623 exact occurrences, including
    575 occurrences in the ten inherited BATCH-020 through BATCH-024 queues.
    No monitored occurrence is omitted or unclassified.
  - >-
    The preservation model contains 128 exact mappings: 126 verbatim blob
    copies and two absence attestations. Candidate materialization preflights
    every target, rejects overwrite and symlink escapes, and was exercised
    only under pytest temporary directories.
  - >-
    Fifteen deterministic inherited-history outputs are generated with the
    NONAUT authority marker and schemas that cannot be consumed as runnable
    dispatch queues. Two compilations were byte-identical in the deterministic
    fixture.
  - >-
    research_dispatch rejects both protected preservation roots and all five
    inherited queue paths, including descendant and symlink aliases, with
    POLICY_NONAUTHORITATIVE before readiness evaluation. Ordinary queue
    behavior remains covered by the existing regression suite.
  - >-
    The static report byte-binds both occurrence tables, the frozen contract,
    and the exact compiler, checker, and dispatcher implementations.

mutation_coverage:
  - contract and control-document binding drift
  - row omission, duplicated occurrence, and state-count drift
  - copied completion receipt and TASK-20260731-043 ordering/equivalence drift
  - missing, duplicated, and unclassified monitored references
  - preservation corruption, materialized absence, overwrite, and symlink escape
  - protected root, descendant, exact queue, relative alias, absolute alias, and symlink alias
  - history schema and NONAUT envelope supplied directly to research_dispatch
  - ordinary BATCH-031-shaped dispatch queue regression

