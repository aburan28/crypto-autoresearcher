treatments:
  dispatch_artifact_collision: >-
    Preserve both parent blobs and hashes; declare both old generated plans or
    queues non-authorizing after reconciliation; regenerate a fresh plan from
    reconciled receipts. Never hand-merge generated JSON or Markdown.
  immutable_receipt_or_review_collision: >-
    Preserve both exact parent blobs. Treat reused TASK/RUN identity as an
    integrity collision. A new correction and reconciliation receipt must cite
    both; neither parent is silently authoritative.
  immutable_run_collision: >-
    Preserve both source/run packages as versioned snapshots tied to their
    originating commits. Never edit either blob or claim one retroactively
    produced the other's result.
  ledger_record_collision: >-
    Preserve both exact blobs and hashes and create a new correction or
    superseding record under a free ID. Never splice the YAML or pick a semantic
    winner implicitly.
  goal_state_collision: >-
    Preserve the local BATCH-030 chronology provisionally because absence from
    upstream is not contrary evidence. A new Coordinator decision must
    reconstruct the combined chronology after receipts validate.
  other_goal_collision: >-
    Route to a separate non-overlapping reconciliation scope owned by that goal;
    do not resolve it inside GOAL-ECDLP-001.

