  # ------------------------------------------------- why both, and why head ---
  why_both_live: >-
    The lanes are disjoint in every respect a contradiction could live in:
    different predecessor and successor experiments (EXP-ECDLP-ffa5c3 ->
    EXP-ECDLP-d7b3c3 versus EXP-SYC-268d6f -> EXP-SYC-a59d02), different
    hypothesis attachment, different blocking-finding sets, different budgets,
    different review gates, and two distinct committed Coordinator decisions each
    of which authorized exactly one successor design-repair batch and got exactly
    one. Neither opening record mentions the other's experiment, findings,
    hypothesis or budget; AE8019 explicitly excludes editing any BATCH-c3c474
    artifact and EA56C5 explicitly excludes any increase above its inherited
    caps. Two authorized design repairs of two different experiments cannot
    contradict each other, and closing either would silently discard a lane a
    committed decision required. Both are zero-run pre-implementation design work
    with no active experiment and no compute in flight, so holding both does not
    breach focus discipline, which bounds active EXPERIMENTS (here, zero).
  why_head_takes_ea56c5:
    decisive_ground: >-
      Expected information gain toward this goal's own stated objective, which
      requires every candidate to carry complete accounting "against Pollard rho
      and BSGS". EA56C5's blocker list IS that accounting - "no exact
      class-to-candidate/control/rho/BSGS cost assembly" and "an incomplete
      finite baseline frontier", with admitted scope naming byte-exact finite
      Pollard-rho and BSGS baseline protocols and nondominated-frontier decisions
      - and it carries an unspent, already-costed prospective experiment budget
      behind it. AE8019's five blockers are representation and packaging hygiene,
      and its own committed checkpoint states the resulting ceiling: "A future
      passing apparatus run would still be deterministic fixture evidence, not
      cryptographic-scale ECDLP evidence", and "No theorem or observation
      supports positive gamma_s on prime curves". Closing EA56C5's blockers
      unlocks a comparison against the baselines the goal names; closing
      AE8019's unlocks, by that lane's own words, fixture evidence that is not
      ECDLP evidence.
    secondary_supporting: >-
      EA56C5 is gated on TWO independent adversarial reviews rather than one, and
      it front-loads two cheap falsifiers that can kill the design before any
      freeze - the falsification-first ordering docs/inventor-protocol.md
      requires, and the cheapest place for this goal to lose an hour. Cited as
      secondary, not load-bearing.
    strongest_counterargument_considered:
      argument: >-
        LINEAL CONTINUITY, for AE8019. The head's prior value was BATCH-c3c474
        and AE8019 declares parent_batch: BATCH-c3c474, so main's repoint follows
        a parent edge from the outgoing head while this branch's repoint jumps
        lanes. Content-based, not date-based, and the strongest case for AE8019.
      why_not_decisive: >-
        Adopting "the head follows its own lineage" makes the winner whichever
        concurrent session's parent happened to hold the pointer last - and that
        value is itself an artifact of an earlier merge reconciliation, not a
        research judgement. merge_reconciliation_20260809_batchc3c474_cursor
        retained BATCH-c3c474 only AS AGAINST BATCH-25dd46 / BATCH-fc86ca and
        does not mention the BATCH-ece945 / BATCH-ea56c5 lane at all, so it does
        not adjudicate this conflict; and the goal's own
        historical_parallel_main_current_batch_id_20260809: BATCH-25dd46 shows
        the head has repeatedly moved BETWEEN parallel source lineages with a
        note. The head has never been a strict lineage cursor. Deciding on lineal
        descent would be deciding on who held the pointer first, which this
        adjudication is forbidden to use and which is not a research reason.

  # ------------------------------------------------------- the false premise ---
  refuted_premise:
    asserted_by: TASK-20260810-55845c
    asserted_in: >-
      ledger/goals/GOAL-ECDLP-001/goal.yaml, key
      current_batch_id_note_head_reconciliation_20260810
    text: >-
      "No committed record names any successor to BATCH-c3c474: no batch.yaml in
      this goal declares parent_batch BATCH-c3c474, and that lane therefore
      terminates closed."
    verdict: FALSE
    refuting_record: coordination/goals/GOAL-ECDLP-001/batches/BATCH-ae8019/batch.yaml
    refuting_content: >-
      It declares parent_batch: BATCH-c3c474, parent_decision:
      DEC-20260809-d5ff80, parent_evidence: EV-ECDLP-f32446, parent_checkpoint:
      ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-c3c474.yaml, and
      authorization.authorized_by: DEC-20260809-d5ff80 with
      fresh_versioned_design_repair_batch_authorized: true. It is exactly the
      fresh non-overlapping design-repair batch that DEC-20260809-d5ff80's second
      next action and BATCH-c3c474's checkpoint next_action required. That
      restart condition WAS executed.
    why_the_audit_could_not_have_known: >-
      TASK-20260810-55845c ran with no shell, at one fixed checkout of one
      branch, and searched THAT WORKING TREE for a batch.yaml declaring
      parent_batch: BATCH-c3c474. There was none in that tree and there could not
      have been: BATCH-ae8019 was authored by a different concurrent session,
      lives on origin/main, and had never been merged into this branch. Its scan
      was correct; its QUANTIFIER was wrong. It reported "no committed record
      names any successor" - a claim over the whole repository - on evidence that
      could only support "no record in this checkout names a successor".
    rule_for_the_next_concurrent_session: >-
      At N concurrent worktrees, ABSENCE OF A RECORD IN YOUR TREE IS NEVER
      EVIDENCE OF ABSENCE IN THE PROGRAM. Any inference of the form "no successor
      exists", "no batch declares this parent", "this lane terminates", or "this
      obligation is unexecuted" is unsound from a single-branch read and must be
      either scoped explicitly to the checkout and commit examined, or supported
      by a fetch of origin/main and every open branch. This is the same failure
      mode as TASK-20260810-08130e's textual co-occurrence finding and
      TASK-20260810-55845c's own direction-of-citation finding on GOAL-ECTD-001 -
      three instances of one error, made by three tasks each careful about the
      others.
    effect_on_this_ruling: >-
      The fact that this branch already reads BATCH-ea56c5 carried ZERO
      evidential weight. Its stated ground is refuted. The value survives on the
      why_head_takes_ea56c5 basis alone, and the coincidence is recorded so it is
      not mistaken for confirmation: had the substantive comparison come out the
      other way, this ruling would have moved the head off this branch's own
      value.
  consequential_correction:
    field: research_goal.next_action (this branch)
    clause: >-
      "Each of those immutable checkpoints carries its own restart condition ...
      and BOTH REMAIN UNEXECUTED"
    correction: >-
