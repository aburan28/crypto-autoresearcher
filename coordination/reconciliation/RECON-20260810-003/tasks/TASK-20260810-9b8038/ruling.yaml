      - key parallel_live_lane_batchae8019_20260810 - declares BATCH-ae8019 OPEN, unclosed, authorized by DEC-20260809-d5ff80, opened by DEC-20260809-57b240, targeting EXP-ECDLP-d7b3c3 against the five REV findings; states it is not the head, is not closed/paused/superseded, that its own batch.yaml and DEC-20260809-d5ff80 are its authority, and that repointing the head to it needs a superseding Coordinator decision
      - key next_action_correction_batchc3c474_restart_executed_20260810 - corrects the BOTH REMAIN UNEXECUTED clause for BATCH-c3c474 only, and records the BATCH-fc86ca clause UNRESOLVED
    M5_do_not:
      - edit, delete, renumber or overwrite any batch.yaml, checkpoint, decision, evidence record, dispatch queue, task card, producer artifact or archive receipt of either lane
      - advance latest_verified_commit - no commit is verified by this ruling
      - change active_hypothesis_ids, any hypothesis status, any experiment status, goal_status, any claim tier or any budget
      - resolve any conflict by choosing a side INSIDE an immutable record; if one appears, stop and mint a superseding record
    M6_updated_at: >-
      Already '2026-08-10' on this branch; leave it, and do not treat it as a
      claim about any commit.
    M7_optional_separate_act: >-
      If this ruling is to carry official standing beyond the reconciliation
      campaign, the orchestrating session may mint a DEC-20260810-* record citing
