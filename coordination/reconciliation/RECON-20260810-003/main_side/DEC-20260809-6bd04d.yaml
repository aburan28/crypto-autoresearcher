  decision: revise_and_pause_pre_implementation
  context: >-
    BATCH-ece945 froze one zero-run successor intended to clear the six
    BATCH-3468a0 blockers within unchanged caps. Both mandatory independent
    reviews returned REVISE. Reachable confidence, literal SHAKE/AEAD/null
    vectors as supplied, class population/owner arithmetic, directed CPU/wall
    semantics, caps, and toy boundaries pass, but eight production framing,
    allocation, baseline, cost, coverage, and noninterference defects prevent
    implementation.
  decision_scope: >-
    This decides only admission of EXP-SYC-268d6f to implementation. It
    authorizes no implementation or execution, changes no hypothesis status,
    and makes no ECDLP security, asymptotic, or performance claim.
