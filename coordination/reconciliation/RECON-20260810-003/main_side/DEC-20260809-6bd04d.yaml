  rationale:
    passing_design: >-
      Snapshot integrity, strict parsing, every reachable confidence branch,
      twenty-four literal XOF vectors, supplied authenticated replay and null
      bytes, twenty-eight class populations and owners, rho additions,
      aggregate CPU versus wall separation, resource caps, and the toy/no-run
      boundary independently pass.
    blocking_design: >-
      Approval is blocked by the eight findings in checkpoint BATCH-ece945:
      production envelope/custody underdefinition; no deterministic event-to-
      shard mapping; no exact class-to-candidate/control/rho/BSGS cost
      assembly; an incomplete finite baseline frontier; a constructor-
      unreachable null point KAT; two complete uncharged verification passes;
      incomplete executable/coverage closure; and a producer lifecycle
      rationale that misstates the immutable handoff rather than resolving the
      static defects.
    authorization:
      implementation_granted: false
      execution_granted: false
      budget_increase_granted: false
      reason: Both mandatory independent pre-implementation reviews returned REVISE.
  experiment_disposition:
    status: review_required
    action: preserve_pending_versioned_static_repair
    experiment_runs: 0
    implementation_exists: false
  next_actions:
    - >-
      Open one fresh bounded static successor and first require the exact
      three-mount verification-count identity plus canonical-decoder reachability
      for every literal null point as cheap falsifiers.
    - >-
      Freeze production envelope/custody bytes, deterministic event-to-shard
      allocation, the complete per-size class-to-candidate/control/rho/BSGS
      compiler, byte-exact finite baselines, and canonical actual-stream
      executable/noninterference coverage without increasing existing caps.
    - >-
      Snapshot that successor and require fresh independent Validator and Red
      Team PASS verdicts before any implementation batch is considered.
  restart_condition: >-
    Standing direction to continue permits a later bounded static successor,
    but not a budget increase, implementation, or experiment execution.
