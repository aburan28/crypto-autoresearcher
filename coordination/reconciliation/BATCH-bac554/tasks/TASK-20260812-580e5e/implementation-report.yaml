implementation_observations:
  - >-
    Added deterministic staging for typed hypotheses, typed questions,
    proposals, flat goals, sharded goal heads, goal checkpoint shards, and
    subgoals. Goal checkpoint identities use the goal directory and immutable
    physical shard stem, so all 103 checkpoint records remain distinct even
    when body batch IDs repeat.
  - >-
    Redirect lineage is attached to the canonical target rather than emitted
    as a duplicate document. The actual H-XOR-YIELD redirect reaches the final
    corrected H-XOR-d1a480 bytes exactly once, carries H-XOR-YIELD as its
    legacy alias, and carries the three pinned source, target, and correction
    path hashes.
  - >-
    SourceMetadata payloads, SearchResult, SourceDocument, human formatting,
    get_context, get_source, and MCP model dumps now retain supersedes and
    verification_artifacts. No index schema change is required because these
    two list fields are provenance output rather than new filter fields.
  - >-
    Exact identity tokens now include lowercase bare and namespaced forms for
    every metadata.supersedes legacy identifier. superseded_by is not treated
    as an alias.
  - >-
    Exact-ID retrieval now fetches every row selected by the closed identity
    filter before ordering and pruning. Canonical source and legacy
    supersedes identities outrank experiment/run cross-references, preventing
    a cited experiment from hiding its own specification outside a fixed
    point-ID scroll window. A zero-match filter returns before scroll.
  - >-
    Staging diagnostics expose registry coverage, unregistered parse skips,
    different-byte duplicate source IDs, and intentional redirect suppression
    separately. Existing deterministic typed-decision-first behavior is
    preserved; debt is reported and was not silently repaired.
  - >-
    Operator documentation requires a fresh collection name after independent
    validation. A payload projection code change alone need not alter an
    existing document fingerprint, so reusing an old collection could retain
    stale payloads through a correct idempotent skip.

