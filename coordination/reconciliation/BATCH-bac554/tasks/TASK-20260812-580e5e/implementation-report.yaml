protocol_deviations: []
anomalies:
  - >-
    The first isolated dependency install failed because the default uv cache
    path was outside the sandbox. Retrying with UV_CACHE_DIR under the task's
    temporary directory reached the network boundary; the approved retry
    installed dependencies into that isolated temporary environment. No
    repository env or config file changed.
  - >-
    The first focused test run found canonical exact-ID ordering ambiguity.
    The failure was retained above, the implementation was repaired within the
    assigned hybrid.py scope, and the complete suite then passed.
  - >-
    Exact lookup originally scrolled a fixed top_k*4 window. A read-only audit
    showed more matching cross-reference chunks can precede the canonical
    document in point-ID order. The final bounded algorithm counts the closed
    identity-filter match set, fetches that set, sorts canonical and legacy
    primary identities first, and then applies the existing result limits.

limitations:
  - >-
    No persistent shared corpus or Qdrant collection was populated, rebuilt,
    deleted, or mutated. Passing ephemeral tests do not establish that any
    existing persistent collection contains the new payload fields.
  - >-
    Legacy aliases are exact search identities. get_source remains
    canonical-ID-only; tests call it with canonical IDs and do not claim alias
    resolution on that surface.
  - >-
    The 24 unregistered parse defects and five different-byte decision
    collisions remain source-corpus debt. This task reports and test-binds
    them but does not repair immutable records or choose a new authoritative
    interpretation.
  - >-
    Implementation and passing tests are administrative software observations
    pending the declared Coordinator snapshot and independent Validator task.
    They are not evidence about DREG, ECDLP, security, novelty, or a
    cryptanalytic improvement.

