  # ------------------------------------------------------------------
  # 1. RULING VOCABULARY AND EVIDENCE STANDARD
  # ------------------------------------------------------------------
  ruling_vocabulary:
    DISCHARGED: The entry's OWN completion_gate is met as written, AND a committed decision,
      evidence record or review verdict that THIS TASK OPENED AND READ says so, and that record
      is about that goal, that batch, and that task.
    PENDING: Real work is still outstanding.
    DEFECTIVE_DECLARATION: The entry's declaration is broken -- a declared record id that was
      never minted or that belongs to another goal, or a declared artifact that was never a
      product and cannot honestly be produced now.
    UNRESOLVED: Not settled. Two kinds are distinguished explicitly and never conflated:
      EXAMINED_AND_UNSETTLED (records were opened and do not settle it) and
      NOT_EXAMINED_WITHIN_BUDGET (this task did not reach it; no finding is asserted).

  evidence_standard_applied:
  - ARTIFACTS_PRESENT IS NOT A COMPLETION CLAIM. No entry is ruled DISCHARGED because a file
    exists. Every DISCHARGED ruling below names a record that was opened and read in this task
    and quotes the field in it that binds the ruling to that goal, batch and task.
  - A DECLARED DECISION ID IS NOT EVIDENCE UNTIL OPENED. RECON-20260810-001's audit matched
    decisions to batches by textual co-occurrence (its own limitation 5). Four such matches
    have already been shown false by sibling tasks. This task found a FIFTH, recorded below
    (DEC-20260721-001 / GOAL-DREG-001 BATCH-002). Every decision cited below was opened.
  - COMMIT ORDERING WAS NEVER USED. No sha, parent, reachability or ordering was verified;
    where a sha appears it is quoted verbatim from a committed record and relayed at that
    record's own level of assurance, never asserted as verified here.
  - NO DECLARED artifact_path WAS REWRITTEN anywhere in this sweep. Where the produced filename
    differs from the declared one, the mismatch is recorded as a live defect against the
    contract as written.

  # ------------------------------------------------------------------
  # 2. THE M3 RULING REQUESTED BY THE HANDOFF
  # ------------------------------------------------------------------
  m3_ruling:
    question: The sibling split left 4 declared paths M3-UNCLASSIFIED because their parents sit
      under experiments/. Does an experiment RUN directory or an experiment AMENDMENT directory
      count as task-scoped for discharge purposes?
    ruling_run_directories: TASK-SCOPED -- treat as M1-EQUIVALENT.
    ruling_run_directories_rationale: An experiments/<EXP-ID>/runs/<RUN-ID>/ directory is created
      and written by exactly ONE executor task under a declared write_scope, and its <RUN-ID> is
      minted for that one run. Everything committed at its top level is that task's product. That
      is precisely the property the M1 rule was drawn to capture (a committed file in the same
      directory is the same task's output under a different filename), so a committed top-level
      sibling there is real declared-vs-produced evidence.
    ruling_amendment_directories: NOT TASK-SCOPED -- treat as M2-EQUIVALENT, i.e. NO EVIDENCE.
    ruling_amendment_directories_rationale: An experiments/<EXP-ID>/amendments/ directory is a
      SHARED record directory. It accumulates PA-* protocol amendments authored by many different
      tasks across many batches over the life of an experiment. The observed siblings span v2, v3,
      and repairs 1, 3, 4 and 5 -- manifestly distinct authoring acts. A committed file there tells
      you nothing about the declared file, exactly the M2 semantics.
    scope_limit_on_the_run_directory_limb: The M1-equivalence extends ONLY to TOP-LEVEL siblings of
      the declared path. A committed file in a CHILD directory of the run root is not a sibling and
      supports no filename-mismatch inference. This limit is not decorative; it changes the answer
      for one of the four paths (see M3-1).
    applied_to_the_four_paths:
    - id: M3-1
      goal_id: GOAL-DREG-001
      batch: BATCH-002
      owning_task_id: TASK-20260721-DREG-N12D6-P1
      declared_path: experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/manifest.yaml
      parent_class: run directory -> M1-equivalent by the ruling above
      correction_to_the_sibling_classification: The sibling_classification.yaml M3 block lists this
        path's committed siblings as bare basenames -- "command.txt", "manifest.yaml", "state.json",
        "stdout.log", "stderr.log", "environment.json", "h012c_d6n12_null_result_n12_t0.json",
        "command.txt" (twice). Read that way it appears to say a manifest.yaml IS committed beside a
        manifest.yaml that is not, which is impossible. The source audit
        (queue_state_audit.yaml lines 2729-2737) shows the real paths - they are
        .../RUN-DREG-001-MEASURE-N12-D6/d6-null/... and .../d6-sem-cont-1/... The committed files sit
        in CHILD directories, not beside the declared path. The basename-stripping lost that.
      consequence: This is therefore NOT a filename mismatch. It is a LAYOUT difference -- the run was
        executed as per-condition sub-runs, each carrying its own manifest.yaml, so no run-root
        manifest.yaml was ever produced. The declared run-root raw-result.json IS committed.
      effect_on_ruling: Does not by itself discharge or block. The entry is discharged below on a
        committed decision, not on this.
    - id: M3-2
      goal_id: GOAL-ECDLP-001
      batch: BATCH-036
      owning_task_id: TASK-20260802-242
      declared_path: experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc36-repair-2.yaml
      parent_class: amendments directory -> M2-equivalent, NO EVIDENCE
      consequence: The seven committed PA-IT-001-* files carry no information about this declared
        amendment. Treated as no evidence at all; the declared amendment is simply not committed.
      effect_on_ruling: Entry falls to GOAL-ECDLP-001, which this sweep did not reach. Ruled
        UNRESOLVED / NOT_EXAMINED_WITHIN_BUDGET with the M3 classification now fixed for the successor.
    - id: M3-3
      goal_id: GOAL-ECTD-001
      batch: BATCH-33b207
      owning_task_id: TASK-20260806-986054
      declared_path: experiments/EXP-ECTD-9e4248/runs/RUN-ECTD-9e4248-impl/run.yaml
      parent_class: run directory -> M1-equivalent
      consequence: REAL declared-vs-produced filename mismatch. The declared filename run.yaml was
        never produced; the run receipt exists at the harness's standard top-level names in the same
        run directory (command.txt, environment.json, manifest.yaml, raw-result.json, stdout.log,
        stderr.log). These ARE top-level siblings, so the M1 inference holds.
      effect_on_ruling: Entry falls to GOAL-ECTD-001, which this sweep did not reach at record depth.
        Ruled UNRESOLVED / NOT_EXAMINED_WITHIN_BUDGET, with the mismatch now classified for the
        successor. artifact_paths must NOT be rewritten to run.yaml -> manifest.yaml.
    - id: M3-4
      goal_id: GOAL-ECTD-001
      batch: BATCH-33b207
      owning_task_id: TASK-20260806-986054
      declared_path: experiments/EXP-ECTD-9e4248/runs/RUN-ECTD-9e4248-screen/run.yaml
      parent_class: run directory -> M1-equivalent
      consequence: Same as M3-3; top-level siblings committed (command.txt, environment.json,
        manifest.yaml, plus coordinate_null_receipts.json, end_ring_certificates.json,
        glv_instrument_receipt.json, per_edge_meter_tables.json, permutation_stability_table.json).
      effect_on_ruling: as M3-3.

