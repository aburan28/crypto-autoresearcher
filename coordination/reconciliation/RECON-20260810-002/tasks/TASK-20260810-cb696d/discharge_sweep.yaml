  # ------------------------------------------------------------------
  # 6. CROSS-CUTTING FINDINGS
  # ------------------------------------------------------------------
  cross_cutting_findings:
  - id: F-1
    title: The receipt-less archive is a systemic pattern, not four isolated accidents.
    detail: Five of the seven DEFECTIVE_DECLARATION rulings are the same shape -- a snapshot or ledger
      archive card whose CONTENT reached committed history while its declared receipt was never
      written (GOAL-MLDSA-001 d47e12 and c60b84, GOAL-P13-001 7cb2d2 and 1a8858, GOAL-DREG-001
      SNAP-C1). In every case the card is unperformable now, because the only artifact it could
      produce is a receipt for a commit the performing session did not make.
    consequence: These entries must be TERMINATED in the queue, never re-dispatched and never marked
      completed with a reconstructed commit_sha or path_sha256. The archive-chain gap each one leaves
      is real and should stay visible.
  - id: F-2
    title: A fifth cross-goal identifier collision, found the same way as the first four.
    detail: See CORR-CB696D-2. GOAL-DREG-001 BATCH-002's ledger card declares
      ledger/decisions/DEC-20260721-001.yaml, which is a GOAL-ECDLP-001 BATCH-001 launch decision.
    consequence: The audit's per-path "committed / exact file" column must never be read as evidence
      of authorship. It is a filesystem fact about a name. Five for five, every declared-decision
      claim that has been opened in this campaign and found suspect has been a collision or a
      co-occurrence artifact; none has yet survived as a genuine reference except where the record's
      own head fields carried the goal and batch.
  - id: F-3
    title: The frozen M1/M2 sibling rule has at least two blind spots, both found here.
    detail: 'BLIND SPOT 1 -- the CHILD-DIRECTORY case: a declared path whose parent directory contains
      committed files only in SUBdirectories is reported as having siblings when it does not (M3-1,
      GOAL-DREG-001). BLIND SPOT 2 -- the DIRECTORY-VS-FILE case: where a contract declares
      reviews/X/report.yaml and the producer wrote reviews/X.md, the rule looks inside reviews/X/,
      finds nothing, and reports "nothing committed at or under the declared parent" -- missing a
      committed file that differs from the declared directory only by an extension
      (GOAL-DREG-001 VAL-R1 and RT-R1, both of which are in fact discharged).'
    consequence: ARTIFACTS_ABSENT is a WEAKER signal than it looks. Two of this sweep's five
      DISCHARGED rulings were on entries the audit had marked ARTIFACTS_ABSENT. A successor must not
      treat ABSENT as a proxy for PENDING.
  - id: F-4
    title: What the discharge rate actually says.
    detail: Of 13 entries ruled at record depth, 5 discharged, 1 pending, 7 defective declarations.
      Zero were discharged on artifact presence. The dominant finding is not that work is missing --
      most of it was done -- but that the BOOKKEEPING CONTRACT was routinely not honoured: declared
      filenames, declared record ids and declared receipts diverged from what was produced, and no
      mechanism caught it at the time.

  # ------------------------------------------------------------------
  # 7. UNRESOLVED CARRIED FORWARD
  # ------------------------------------------------------------------
  unresolved_carried_forward:
  - id: U-1
    item: Whether ledger/evidence/EV-DREG-004.yaml is GOAL-DREG-001 BATCH-002's evidence record.
    why: It exists and is committed, but it was not opened, and its declared sibling
      DEC-20260721-001 turned out to be another goal's record. No assumption is made.
    what_would_settle_it: Open ledger/evidence/EV-DREG-004.yaml and check its goal_id/batch_id head
      fields against GOAL-DREG-001 / BATCH-002 and its content against the D6-at-n=12 measurement.
  - id: U-2
    item: Whether a TASK-20260804-7cb2d2 snapshot commit and a TASK-20260807-1a8858 snapshot commit
      were ever made for GOAL-P13-001.
    why: No committed record names either. The DEFECTIVE_DECLARATION rulings do not depend on the
      answer, but the archive chain's true state does.
    what_would_settle_it: A session with a shell, or a committed record naming those commits. Neither
      exists here.
  - id: U-3
    item: GOAL-DREG-001 BATCH-003 (4 entries) and BATCH-004 (5 entries).
    why: Examined at directory-listing depth only. The C1/C2 pairing in BATCH-003 and the possible
      BATCH-005 supersession of BATCH-004's CTRL-B cards are both plausible and both unproven.
    what_would_settle_it: The record lists given inline under each batch block above.
  - id: U-4
    item: 260 held entries across GOAL-AES-001, GOAL-AES-003, GOAL-ECDLP-001, GOAL-ECTD-001,
      GOAL-HQC-001, GOAL-MCE-001, GOAL-MLKEM-005 and GOAL-SSI-001.
    why: Not examined at record depth within the 3000 s budget. Each is enumerated individually above
      and carries UNRESOLVED / NOT_EXAMINED_WITHIN_BUDGET, which asserts nothing about it.
    what_would_settle_it: A successor sweep, taking the goals in the order given in
      successor_acts SUCC-SWEEP-2 below.
  - id: U-5
    item: 'The largest unexamined surface in this whole campaign, inherited from the audit and
      restated here so it is not lost: EVERY QUEUE ENTRY NOT AT STATE "queued". The audit listed
      queued entries only, so an entry marked completed whose artifacts are absent -- the mirror
      image of what this sweep looked for -- would not have been caught anywhere.'
    what_would_settle_it: A second audit pass over non-queued entries. Given F-4, the prior for
      finding defects there is high, not low.

