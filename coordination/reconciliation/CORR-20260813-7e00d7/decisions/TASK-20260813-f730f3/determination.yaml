shared_findings:
  - >-
    The frozen three-tree projection has exactly seven canonical conflicts:
    six immutable add/add collisions and one mutable goal-projection conflict.
    No generated-file conflict exists.
  - >-
    The custody capsule preserves fourteen distinct, content-addressed,
    byte-exact mirrors. Snapshot commit
    112cab0155cf9164e0d296f5fe4cb03876c5906c has exact first parent
    370460dbf33978e2b71f9292bca324bc5ff29ea7 and changes exactly the
    declared fifteen producer artifacts plus its self-neutral receipt.
  - >-
    Both completed BATCH-080a9c histories remain reachable and immutable.
    Their only safe unqualified semantic intersection is REVISE, no
    EXP-SYC-b11b38 implementation or execution authority, zero experiment
    runs, and no scientific status change.
  - >-
    BATCH-1800b3 is historically descended from branch B080 binding commit
    b15f799454d4ed8a0982cee79a29f09d63a0c740. Its unqualified references
    to DEC-20260811-f1fcd1, EV-ECDLP-c055e7, and the B080 checkpoint therefore
    resolve to the branch bodies archived at
    1723490b39621da5c60115ce41c31770712c369a, never to a later canonical
    filename occupant.
  - >-
    The capsule itself is neutral custody only. It performs no merge, record
    remap, implementation, experiment, run, status transition, ECDLP claim,
    or knowledge promotion.

review_disagreement:
  validator_position: >-
    PASS at the declared byte-custody boundary: the seven-conflict,
    fourteen-mirror basis is complete and lossless for the exact frozen Git
    projection. The Validator explicitly states that its PASS neither
    authorizes the merge nor adjudicates post-merge B180 authority.
  red_team_position: >-
    REVISE at the canonical-authority boundary: a two-parent merge must resolve
    ledger/goals/GOAL-ECDLP-001/goal.yaml, but neither pre-merge body is a
    truthful neutral integrated projection. Choosing the branch body silently
    adopts B180 with stale pointers; choosing the origin/main body silently
    suppresses B180 with stale pointers; synthesizing a third body inside the
    merge without prior hash binding and review is also unauthorized.
  coordinator_resolution: >-
    The positions are compatible at different boundaries. Custody integrity
    passes, while merge authorization fails. The frozen handoff requires both
    independent reviews to PASS before merge authorization, so the official
    determination is REVISE and the merge remains prohibited.

