findings:
  - id: RT-97C505-F1
    severity: MAJOR
    blocking: true
    title: seventh_conflict_has_no_safe_or_hash_bound_merge_resolution
    statement: >-
      The capsule correctly defers scientific adjudication and allows
      origin/main serialization at the six immutable canonical paths, but it
      does not specify the mandatory resolution of the mutable goal.yaml
      conflict. Both available bodies contain stale, already-discharged control
      pointers. Any unreviewed side selection either canonically adopts B180 or
      suppresses it before the promised postmerge adjudication.
    affected_claims:
      - capsule_ready_for_two_parent_merge
      - canonical_selection_deferred_without_authority_effect
      - postmerge_goal_adjudication_can_safely_follow_the_merge
    preserved_valid_scope: >-
      The seven-conflict inventory, fourteen-mirror custody, content-first
      snapshot, B080 common REVISE intersection, and B180 branch ancestry all
      remain valid.
    required_disposition: >-
      Block the merge until a neutral third-body goal projection and its exact
      SHA-256 are frozen, independently reviewed, and authorized by the
      premerge neutral ledger decision.

  - id: RT-97C505-F2
    severity: MINOR
    blocking: false
    title: dispatcher_human_report_mislabels_explicit_content_first_verification
    statement: >-
      The structured dispatcher result correctly records
      reason=declared_content_first_binding_mode and verifies sixteen paths,
      but the generated human report places it under wording that says commit
      bindings could not be reached. The snapshot commit was in fact reachable.
      This wording can be read as a degradation or squash fallback when none
      occurred.
    cheapest_repair: >-
      Label explicit reachable content_first archives separately from
      unreachable-commit content-only fallbacks. Do not alter the capsule,
      snapshot, or archive history.

