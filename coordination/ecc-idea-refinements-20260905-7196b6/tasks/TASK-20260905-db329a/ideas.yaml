      "mechanism": "Start from the divisor of a rational function and sum its translations by a finite torsion subgroup. The resulting divisor descends through a separable quotient; this explains why some elaborate public torsion observables merely encode a known multiplication map. A partial orbit lacks full translation invariance, leaving a smaller stabilizer and potentially higher descent complexity. The non-generic resource is that residual rational function, not division-polynomial splitting that depends only on the curve. Pairing-type constructions are compared at the level of their divisor and Galois invariance, without giving an extraction procedure.",
