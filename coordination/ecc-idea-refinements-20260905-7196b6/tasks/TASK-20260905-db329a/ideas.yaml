      "title": "Saturation witnesses for complete addition domains",
      "class": "mechanism",
      "claim": "A bounded polynomial certificate can prove that a declared set of addition formulas covers every valid pair in an explicit projective input domain, and can expose exactly which domain assumptions are needed.",
      "mechanism": "Fix the admitted geometric domain D=(E x E)(algebraic closure of F_p) with projective coordinate validity, retaining identity, diagonal and inverse-point pairs. A formula chart is defined precisely where its denominator conditions hold and its projective output is not simultaneously zero; let B_i be its full failure locus, with denominators included where required. Joint coverage is D intersect intersection_i B_i = empty, equivalently every pair in D is defined in at least one chart. It is not the union of base loci. On polynomial homogeneous charts, common vanishing is encoded by the sum of their base-locus ideals together with curve equations; projective invalid representatives are removed by the explicitly stated saturation, never by deleting valid group pairs. More general rational failure loci require their exact constructible-domain encoding. Group-law correctness wherever each chart is defined is a separate certificate: empty common failure does not prove the outputs equal the group sum. Geometric-domain coverage implies rational-domain coverage; a rational-only claim would require an explicitly weaker F_p-point contract and is not silently substituted here. Low-degree witness existence remains conjectural.",
