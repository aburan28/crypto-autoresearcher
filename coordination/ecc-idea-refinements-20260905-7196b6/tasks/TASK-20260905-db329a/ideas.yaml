      "id": "IDEA-20260905-b1f9f0",
      "title": "Approximate public quotients through a defect of lumpability",
      "class": "mechanism",
      "claim": "For a fixed public feature v on a finite prime-order group and a declared memoryless labeled transition law, the worst same-fiber total-variation defect bounds feature-simulation error through a fixed finite horizon. Conjecture: some restricted privately randomized kernels have smaller defect for coordinate-style partitions than matched partitions. Adding translations has different effects when the translation is public versus hidden; no universal monotone destruction claim is made.",
      "mechanism": "Freeze X=G, horizon t, finite public labels l with state-independent law nu(l), and private independent translations a with law mu_l(a). The public transcript reveals l and v(x+a), but not a. Define K_l(x,b)=sum_a mu_l(a) 1[v(x+a)=b], delta_l=max_{v(x)=v(xprime)} TV(K_l(x,.),K_l(xprime,.)), and delta=max_{v(x)=v(xprime)} sum_l nu(l) TV(K_l(x,.),K_l(xprime,.)). A representative per feature cell supplies a simulator kernel; convexity bounds every history-conditioned mixture over that cell by delta, and iterative coupling has the prospective bound min(1,t*delta). Fresh memoryless transitions and observation history consisting only of declared labels and features are essential: adaptive hidden advice or additional observations require a new sufficient-state specification. For a publicly fixed deterministic translation, each K is Dirac, so delta_l is 0 or 1. For uniformly hidden a over all G, K(x,b)=|v^-1(b)|/|G|, hence delta=0 for every partition. When each translation itself is public, per-operation maximum defect is 1 for a nontrivial genuinely lossy partition of a prime-order group: exact invariance under all translations would make the fiber equivalence a coset relation. Under public uniform labels the joint averaged defect is instead a fraction of separating translations and may vary with the partition. Matched partitions can vary restricted-mixture TV or this public-label averaged statistic, not the binary maximum or hidden-uniform boundary.",
      "question_id": "RQ-CRYPTO-001",
