      "id": "IDEA-20260905-03f570",
      "title": "Joint Hasse-window certificates from complementary order witnesses",
      "class": "composition",
      "claim": "Given independently checked point-order divisors on a curve and its twist, their congruence intersection with the Hasse interval can certify the exact trace even when neither arm alone isolates it. The claimed improvement is a shorter verification witness under an explicit input contract.",
      "mechanism": "Track an integer interval with congruences, rather than a transcribed order. A certified divisor D of #E gives t = p+1 modulo D; a divisor Dt of the twist order gives t = -(p+1) modulo Dt. Generalized CRT intersects these constraints, including noncoprime consistency checks. If exactly one integer survives |t|<=2sqrt(p), that integer determines both orders. Multiple point witnesses contribute their lcm, never their product unless coprimality is proved. This strengthens the consistency checksum into a one-sided mathematical certificate: a producer cannot compensate an erroneous curve order with an erroneous twist order while retaining independently verified torsion witnesses. Certificate generation remains charged and can fail to find useful divisors. Each claimed composite point order m_i comes with a complete certified prime factorization and the exact supplied conditions [m_i]P_i=O and [m_i/q]P_i!=O for every distinct prime q dividing m_i. The latter rule prevents accepting a proper order divisor as the claimed order. All identities belong to prospective supplied-witness verification only; no arithmetic verifier is provided. Define s as raw point count and f=sum_i omega(m_i) as the total distinct-prime-factor checks across claims. Charge k=s+f group scalar checks, each scalar of O(log p) bits under the valid finite-field point-order bound; malformed larger integers are charged by their actual bit length and refused if outside the input contract. Factorization certification, primality witnesses and encoded point bytes are additional input costs.",
