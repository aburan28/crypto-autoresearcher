  body: 'POINTER for whoever holds RQ-SEMBIN-9e8f82, GOAL-RELN-001 and the EXP-RELN-164ad3
    / H-RELN-96e3ba records. Not a finding; not evaluated by any reviewer.


    RUN-SEMBIN-1b9afe''s producer (task-report.md section 10) observes that EXP-RELN-164ad3''s
    metric M3 residual of 2^m may be an ENCODING MISMATCH: the RELN protocol declares B on-curve
    x-coordinates as its factor base, the search ranges over the |W| = 2B points they lift
    to, and B is substituted directly into B^m/(m! p). RUN-SEMBIN-1b9afe measures the corresponding
    factor (L/|V|)^m in a setting where L/|V| ~ 1 and finds 0.988-1.003 at m = t = 2 -- no
    2^m intrinsic to eq. (11). Recorded as EV-SEMBIN-d40877 O-9 under DEC-20260913-3b51c8.


    Second pointer from the same round, also outside every reviewer''s joints: eq. (11)''s
    Poisson link P = 1 - exp(-lambda) fails by 18-22% at t = 2, |V| = 2^10..2^12 when V is
    the LOW-DEGREE-POLYNOMIAL subspace, and by nothing for a random subspace of the same dimension
    (EV-SEMBIN-d40877 O-4, O-5). Any comparator that assumes eq. (11)''s probability for a
    low-degree-window factor base should know this; the mean lambda is fine to 1%.


    The RELN records are immutable. If either pointer bears on them the remedy is a new record
    and an additive amendment, by whoever owns that lane.

    '
