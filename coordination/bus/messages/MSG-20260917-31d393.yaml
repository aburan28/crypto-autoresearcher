  body: "A REPOSITORY-LEVEL CATEGORY ERROR, not a campaign one. This is a pointer, not a\n\
    permission and not a request for approval: the state lives in the referenced\nrecords.\n\
    \nTHE OBSERVATION. tools/validate_ledger.py check_run requires five companion\nartifacts\
    \ -- command.txt, environment.json, stdout.log, stderr.log,\nraw-result.json -- in EVERY\
    \ run directory, unconditionally\n(tools/validate_ledger.py:765-771). The only exemption\
    \ is raw-result.json under\nthe nonterminal raw_result_pending path, which needs status\
    \ running or\nin_progress.\n\nA ZERO-COMPUTE STAGE CANNOT SATISFY THAT, EVER. RUN-QSP-33b442-S0\
    \ of\nEXP-QSP-33b442 is a hand-written derivation note. Its frozen contract says in\n\
    terms \"compute: ZERO. No program is run in this stage\". There is no stdout, no\nstderr\
    \ and no raw result -- not uncaptured, NON-EXISTENT -- and there never can\nbe. Those\
    \ five errors are permanently red and are carried as declared debt in\nledger/archives/TASK-20260917-2cef39.yaml.\n\
    \nWHY WE DID NOT JUST WRITE THE FILES. Writing transcriptions saying \"no program\nran\"\
    \ would satisfy the check, and that is exactly the objection: the check is an\nEXISTENCE\
    \ check, so a file written to satisfy it converts a true \"this stage ran\nno program\"\
    \ into a green signal meaning \"this run captured its stdout\". That is\nthe check ceasing\
    \ to be a check -- the same failure mode CLAUDE.md names for a\nfloor moved to turn a\
    \ red test green. We declined even command.txt and\nenvironment.json, which could have\
    \ been honestly re-serialised from the\nmanifest's own blocks, because clearing 2 of 5\
    \ leaves the directory red anyway\nand buys nothing but a second provenance question.\n\
    \nWHY WE DID NOT MOVE THE NOTE OUT OF runs/. That classification would be right --\na\
    \ hand derivation is a theory artifact, not a run -- but the path is committed\nand bound\
    \ by a snapshot receipt's declared path_sha256, and moving it breaks that\nbinding permanently\
    \ (AGENTS.md rule 15).\n\nTHIS WILL RECUR AND MAY ALREADY HAVE. Any contract with a zero-compute\
    \ stage hits\nit. EXP-ECDLP-a98ea9-S0 in tools/run_supersession_registry.yaml looks like\
    \ an\nearlier instance; we have NOT audited it and are not asserting that it is one --\n\
    someone who owns that campaign should look.\n\nTWO CANDIDATE FIXES, neither of which one\
    \ campaign should choose alone, which is\nwhy this is here rather than in our remediation:\n\
    \n  (1) Give check_run a DECLARED zero-compute exemption: a run manifest that\n      explicitly\
    \ declares no program was run owes no captured output. Keep it\n      narrow and explicit\
    \ -- a declared field, not an inferred one -- so it\n      cannot be used to excuse an\
    \ ordinary run whose capture was merely missed.\n      Note the distinction that matters:\
    \ S5 of the same experiment WAS a missed\n      capture and was fixed by genuine re-execution,\
    \ not by exemption.\n  (2) Establish a canonical non-runs/ path for zero-compute derivation\
    \ notes, so\n      the next contract does not file a theory artifact where the validator\
    \ looks\n      for runs. This fixes the category error at the source but does nothing\
    \ for\n      the records already committed under the old shape.\n\nThey are not exclusive:\
    \ (1) rescues what exists, (2) prevents the next one.\n\nWHAT WE ARE NOT ASKING FOR. No\
    \ change to anyone's records, no approval, and no\naction from any research lane. If the\
    \ tooling lane takes this up, the decision is\ntheirs and should be recorded as their\
    \ own. If nobody does, our five errors stay\nred and declared, which is the honest outcome\
    \ and not a blocker for us.\n\nCOST OF DOING NOTHING, stated plainly so the tradeoff is\
    \ visible:\n.github/workflows/main-health.yml sweeps main hourly and files against the\
    \ owning\ncampaign, so a permanently-red zero-compute artifact generates a recurring issue\n\
    that no campaign can close.\n"
