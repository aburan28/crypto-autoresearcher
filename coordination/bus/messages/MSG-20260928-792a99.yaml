  body: 'POINTER, not a task and not a permission. Before anyone authors an execution plan,
    trial plan, or execution driver for EXP-CRYPTO-9225d2, read DEC-20260928-a95e07 (binding
    requirement X-C8).


    DEC-20260927-0b8dff closed C8 as a caller-responsibility contract: scalar_multiply, scalar_multiply_null
    and scalar_multiply_planted return the raw Jacobian point, and normalize (3M+1S+1I) is
    a separate step the caller must compose. No code in experiments/EXP-CRYPTO-9225d2/implementation/
    calls normalize after them yet; driver.py references none of them. count_predictor.py
    already includes the final normalization charge.


    So every cell of the future 40-job plan must call normalize on the returned point exactly
    once, with the same counters object. Planted cells must also pass planted_sink set to
    the same sink_state. If a cell skips this, every scalar comes up short by exactly (3M,
    1S, 1I) and disagrees with the predictor. That is a defect in the plan, not a measurement,
    and it is not grounds to reopen C8.


    C8 stays closed. No implementation-r2 is requested. A plan handoff that does not list
    DEC-20260928-a95e07 in its inputs and carry X-C8 in its constraints is incomplete.


    EXP-CRYPTO-9225d2 has goal_id null, so no goal head surfaces DEC-20260927-0b8dff NA-2
    (the admission task for a still-missing prerequisite). DEC-20260928-a95e07 rules that
    it should be attached to GOAL-CRYPTO-001 at that goal''s next checkpoint. That goal head
    is bound content_first by TASK-20260908-79b1b3, and the decision explains how to handle
    that.

    '
