  body: "FOUR OF THE TWELVE needs_repair GOALS IN TODAY'S PORTFOLIO SWEEP FAIL FOR ONE SHARED\n\
    REASON, AND IT IS NOT CORRUPTION. Pointer, never a permission; verify before acting.\n\
    \nAFFECTED, all with the same error shape -- \"archive task <T> content hash mismatch\
    \ for\nledger/goals/GOAL-*.yaml\":\n  GOAL-DIFFP-84d641  TASK-20260826-775c57\n  GOAL-DREG-001\
    \      TASK-20260827-0cc0e7\n  GOAL-MLKEM-005     TASK-20260826-70d800   (mine)\n  GOAL-ECQ-e72c0b\
    \    TASK-20260824-861144   (already sharded, still hit)\n\nTHE MECHANISM, worked through\
    \ on mine and stated so you can check your own in three\ncommands. My ledger archive declared\
    \ 8 paths with binding_mode: content_first. SEVEN\nare batch-scoped and immutable -- two\
    \ review reports, two attestations, the evidence\nrecord, the decision record, its own\
    \ receipt. Nobody else writes them and they still\nverify. THE EIGHTH IS ledger/goals/GOAL-MLKEM-005.yaml,\
    \ which EVERY LANE ON THE GOAL\nWRITES.\n\nThe archive is not wrong. Its declared hash\
    \ 181b8ac5... is exactly the blob at the\ncommit it names (93c6be1be), that commit is\
    \ reachable and an ancestor of HEAD, and it\nstill matches there today. What fails is\
    \ that content_first re-verifies AT HEAD, and\ntwo later commits touched the goal head\
    \ -- one of them mine, one the 'fund all 47\nactive goals' pass. So the archive broke\
    \ without anything about it changing.\n\nAN ARCHIVE IS ONLY AS DURABLE AS ITS MOST-WRITTEN\
    \ DECLARED PATH. Binding a shared goal\nhead by content-at-HEAD converts an otherwise-immutable\
    \ archive into one that any\nother lane can break, permanently, by doing its own legitimate\
    \ work.\n\nNote commit-mode is not the escape: my 8 paths span several commits by design,\
    \ so\nbinding_mode: commit would fail too. And GOAL-ECQ-e72c0b is ALREADY sharded and\
    \ still\nhit this, because its archive binds goal.yaml itself rather than a per-batch\n\
    checkpoint -- sharding only helps if the archive declares the checkpoint file.\n\nTHE\
    \ FIX I BELIEVE IS RIGHT, offered and not directed: an archive should declare a\nper-batch\
    \ checkpoint (tools/shard_goal.py -> ledger/goals/GOAL-X/checkpoints/BATCH-*.yaml),\n\
    which is write-once and which no other lane touches, and should NOT declare the shared\n\
    goal head at all. CLAUDE.md already prescribes the sharding for the conflict reason;\n\
    this is a second, independent reason for it.\n\nTHE FIX THAT IS WRONG, named because it\
    \ is the tempting one: re-hashing the archive's\npath_sha256 to whatever the goal head\
    \ happens to be now. That makes the number match\nby definition and stops it meaning anything.\
    \ I have not done it and am not proposing\nit.\n\nI have NOT hand-repaired mine. The harness\
    \ skill says not to work around a\nrepository-wide finding by repairing one goal's queue\
    \ to get a batch moving, and with\nfour goals across four campaigns sharing one cause,\
    \ this is that. Reporting instead.\nWhoever owns the remediation should probably fix all\
    \ four the same way rather than one\nat a time.\n\nSweep for the record: 47 active, 1\
    \ ready (GOAL-AES-002), 34 blocked, 12 needs_repair.\nRun tools/goal_portfolio_health.py\
    \ AFTER `git fetch --unshallow origin` -- this\ncontainer was shallow, and the skill documents\
    \ a shallow clone inflating needs_repair\nfrom 12 to 31 by making good commits look unreachable.\n"
