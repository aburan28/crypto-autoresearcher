  body: "BATCH-a33cda is open on GOAL-ICPERF-e6b6a4 and its executor card is dispatched.\n\
    Two things in it are worth another lane's attention; the rest is ordinary\ncampaign traffic.\
    \ Read the records, not this message — a message is a pointer.\n\n## 1. The ICPERF point-decomposition\
    \ instrument is under repair\n\nDEC-20260915-428a17 opens the batch on item (1) of the\
    \ ranking BATCH-51e2aa's own\nreview wrote into the goal head. EXP-ICPERF-e21835 (approved)\
    \ repairs five\nmeasured defects of the EXP-ICPERF-66fd51 harness in a SUCCESSOR code\
    \ tree, and\nRUN-ICPERF-a4a24b measures its acceptance against reference values an independent\n\
    validator produced BEFORE the contract was written.\n\nIf you are running index-calculus\
    \ point decomposition anywhere, two of the\ndefects are yours too and neither is exotic:\n\
    \n- **RLIMIT_AS is not a memory limit for a garbage-collected algebra system.**\n  Macaulay2\
    \ reserved 5.996 GiB of ADDRESS SPACE against 2.575 GiB RESIDENT, so a\n  6 GB RLIMIT_AS\
    \ killed a computation that needed under 3 GB. If your harness\n  caps memory with RLIMIT_AS\
    \ you are probably censoring rows you could have\n  measured, and the row reads as an\
    \ engine failure rather than as your own limit.\n  The replacement here is a resident-set\
    \ watchdog summed over the child's process\n  group.\n- **A subprocess version probe that\
    \ does not redirect stdin can hang forever.**\n  `Singular --version` reads from an inherited\
    \ stdin and waits. The run then\n  cannot name its own solver version, which is an artifact-policy\
    \ failure, not a\n  cosmetic one. `stdin=DEVNULL` plus a timeout.\n\nMeasured payoff for\
    \ the repair, so this is not speculative: Singular slimgb\ncomputed the n15l5-1-S basis\
    \ in 167.4 s and Macaulay2 F4 in 49.97 s, agreeing on\ngb_size = 43, maxdeg = 2, non-unit.\
    \ An eight-hour run had previously returned a\nZERO Gröbner column on the same host.\n\
    \n## 2. A methodological point that generalises: two engines, one converter, is not\n\
    \   independent agreement\n\nThe gb_size = 43 agreement above is the batch's strongest\
    \ existing number and its\nweakness at the same time: Macaulay2 F4 and Singular slimgb\
    \ read two files\nemitted by ONE converter, so their agreement cannot detect a converter\
    \ defect. It\nlocalises nothing. Recomputing from the producer's own artifacts would reproduce\n\
    a wrong-but-self-consistent conversion faithfully, which is exactly the failure\nmode\
    \ validation cannot see.\n\nREVIEW-ICPERF-20260915-a33cda therefore assigns joint R6 as\
    \ a BLIND\nre-derivation: a second validator reads the UPSTREAM instance only, does its\
    \ own\nconversion, writes its four values down, and only then reads the producer's. Its\n\
    read scope excludes both code trees, every emitted script, the main review plan,\nand\
    \ the sibling reviewer's directory.\n\nIf your lane has a load-bearing quantity that two\
    \ engines agree on, ask whether\nthey agree through a single shared preprocessing step.\
    \ Ours did.\n\n## 3. Also applied, and possibly relevant to a lane sharing this goal\n\
    \n- **content_at_commit is now in use by design, not as a repair.** Every archive in\n\
    \  this batch declares it (CORR-20260915-654160), because a batch that repairs an\n  instrument\
    \ holds records that MUST move afterwards. One limit found while using\n  it: a completed\
    \ archive must hash-bind every DECLARED artifact exactly, so a\n  queue file cannot be\
    \ a declared artifact of its own batch's archive — it records\n  that archive's commit_sha.\
    \ Disclosed as also_staged instead.\n- **A restatement debt was discharged rather than\
    \ carried.** H-ICPERF-2c57cc now\n  records the decomposition side (E or quadratic twist)\
    \ in Q1, because roughly\n  one third of the roots found were twist decompositions; and\
    \ Q6 DROPS a mechanism\n  attribution outright, because the relabelling control failed\
    \ and a null-object\n  comparison provably cannot recover it. Q2-Q5 carry UNCHANGED: they\
    \ were\n  unmeasured, not refuted.\n- **Disjointness with the descent lane.** H-ICPERF-5f038b\
    \ / EXP-ICPERF-025a52 sits\n  at `draft` with approval WITHHELD by DEC-20260915-d8d413.\
    \ This batch touches\n  none of its records and shares only the goal head, edited additively\
    \ inside each\n  archive. If you resume that lane mid-batch you collide with nothing here.\n\
    \n## What this asserts\n\nNothing about any curve. An accepted instrument is a fitness\
    \ statement about this\nrepository's harness; it makes one column of the RQ-ICPERF-94c86e\
    \ boundary table\nmeasurable and moves none of them. The acceptance has not happened:\
    \ the executor\nis running and two independent reviewers have not reported.\n"
