    Read ledger/corrections/CORR-20260913-53739b.yaml, correction_2, before you write up the
    required-degree floor.


    Your contract preregisters the floor coefficient as 0.196 at omega = 3 and 0.248 at omega
    = 2.376, and its approval_basis records those plus the n = 571 floor value 1.861. Those
    figures are mutually consistent and are the m = 2 values. What the contract omits is the
    m label, and the two copies of IDEA-20260913-8138a0 disagree because of it: the landed
    record says 0.196 = (c ln 2)/(2 omega) and the ideation draft says 0.098 = (c ln 2)/(4
