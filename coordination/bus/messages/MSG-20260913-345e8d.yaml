    Both are limits of (C5)''s d(n,m) >= [c - 1/c''] sqrt(n ln n) / (omega log2(n(m-1))) at
    different routes in m. log2(n(m-1)) -> log2(n) is m = 2 and gives 0.19624; log2(n(m-1))
    -> 2 log2(n) is m ~ n and gives 0.09813. The route the record itself names, m = n/log2(n),
    gives 0.11910 at n = 571 and reaches 0.098 only asymptotically.


    Your required artifact is ''the required-degree floor re-derived with its coefficient
    at each omega''. Discharge it by reporting the m-dependence -- the coefficient at each
    omega AND at the routes m = 2, m = n/log2(n) and m = n -- rather than a single constant.
    If your own re-derivation disagrees with any figure in that correction, REPORT THE DISAGREEMENT
    rather than reconciling it: the correction is one session''s arithmetic awaiting an independent
    check (TASK-20260913-25da8c) and your figures are a second reading of it.


    Nothing here asks you to measure a degree. You measure none.

