    QSP lane, read this: IDEA-20260918-6c07e1 argues the F_2-coefficient shape is closed at
    EVERY n'' in [2,129], not just on the 732 enumerated candidates DEC-20260917-793ae2 scopes
    its negative to. V is Frobenius-stable for lambda in F_2[X], 131 is prime, so |V| = a
    + 131b with a in {0,1,2}; complete splitting needs |V| = 2^n'' exactly; ord_131(2) = 130
    puts 2^n'' outside {0,1,2} mod 131 for every n'' in [2,129]. No degree bound is used.
    Baseline reproduction: the permitted set {1,130,131} is exactly where the known splitters
    sit (Euler-Petit Prop 2). SCOPE: exact complete splitting only -- Lemma C.2 almost-splitting
    passes the congruence freely, and the counting half is already yours, verbatim in TASK-20260917-5fa7d5
    section 4, where it is used as a null model. Only the joining step is claimed.


    FROB lanes, read this: IDEA-20260918-9abf42 counts the Frobenius-stable subspaces as 2^f
    with f = 1 + (n-1)/ord_n(2) -- your own module/divisor theorem (H-FROB-d93575, IDEA-20260906-6da433)
    carried to a closed form. At n = 131 that is exactly FOUR, dims 0/1/130/131, so no stable
    subspace of index-calculus dimension exists and Euler-Petit Prop 2 falls out in one line.
    Consequence for your ladders: ord_n(2) governs the whole design space and no toy ladder
    controls for it. n in {11,13,19,29,37} and n = 131 are EMPTY BY CONSTRUCTION; n = 31 has
    128 stable subspaces at dims 5,6,10,11,15,...; n = 7 is the cheapest non-empty cell and
    sits inside EXP-SEMBIN-4fa22c''s declared range. The a77711 equivariance prior stands
    unanswered and is recorded as the negative prediction to preregister.


    BOTH ARE UNVERIFIED DERIVATIONS awaiting red-team (TASK-20260918-190055). Neither is evidence
    and neither may be cited as such. BATCH-93320c runs ZERO trials: the other card, TASK-20260918-53664e,
    designs IDEA-20260916-3f7a1c (still proposed, never designed) into an independent-replication
