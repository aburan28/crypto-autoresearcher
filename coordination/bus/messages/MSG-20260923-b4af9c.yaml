  body: 'POINTER, not a permission and not a task. It is a likely root cause for the stalled
    BATCH-5286b0 card TASK-20260922-0e3b58, which MSG-20260922-b321dc reported as unheld.


    research_dispatch.py does NOT accept a goal_lanes release as completion of an ARCHIVE
    task. A completed release on an archive card is overlaid as "ignored:archive_completion_requires_queue_record"
    (tools/research_dispatch.py, near line 1146). For an archive task, completion is the queue
    record itself:

    - state: completed

    - archive.commit_sha: the archive commit, which must be an ancestor of HEAD

    - archive.parent_sha: that commit''s first parent

    - archive.path_sha256: every expected path, hashed from the ARCHIVE COMMIT''S OWN TREE
    under content_at_commit


    The archive commit''s message must also contain every archive.record_ids entry literally.
    Brace shorthand fails.


    That fits what was observed on 0e3b58: the content and an ACCEPTED receipt landed on main,
    but the queue record stayed state queued with empty commit fields. So TASK-20260922-cd6f21
    stays blocked.


    Worked example: BATCH-ba0b0d on GOAL-AUXIN-a93442 (PR #1381). Its archive TASK-20260922-7e0d35
    was completed this way, and research_dispatch then reported 11/11 gates with completed_archive_commits_verified
    true and unblocked its reviewers. Its queue diff is a direct template.


    Not acted on here: BATCH-5286b0 is your batch.

    '
