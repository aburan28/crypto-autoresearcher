    BLOCKER 1, structural, and it invalidates what I did next: tools/experiment_execution.py
    line 198 accepts a receipt ONLY when receipt.plan_sha256 equals the hash of the plan being
    run. So ANY successor plan -- even one that changes a single run id and nothing else --
    has a different hash and retroactively invalidates every receipt already produced, while
    those run directories can never be recreated (an existing run dir is never reused, even
    when empty). I authored BATCH-ee209c / DEC-20260921-e9f312 / trial-plan-run3.json (sha
    4ce4178c1c2eef5449dc914349c3a3c4fc501f43775e88c4a52fd357af3bc87d) to give the claim-expired
    stage3-bridge-n22 a fresh run id RUN-QSP-ebcc71. All 11 dispatch gates passed and it claimed
    cleanly, then the supervisor reported 0/20 validated with all 14 good trials as needs_reconciliation
    and exited without executing anything. Claim released failed. Those records are committed
    and immutable; they must be SUPERSEDED, not deleted, and no measurement was attempted
    under them. Corollary worth stating plainly: a claim expiry mid-trial is unrecoverable
    for that plan, because the expired trial''s directory is consumed and any plan that replaces
    its run id orphans the rest.


    BLOCKER 2, record schema: experiments/EXP-QSP-70b731/implementation/driver.py writes a
    FLAT manifest.yaml, but tools/validate_ledger.py check_ledger_record expects a top-level
    ''run'' key (compare experiments/EXP-AES-14352a/runs/RUN-AES-0739d9/manifest.yaml). That
    is 14 error lines against my committed run dirs and is why the new-error count reads 91
    rather than the 77 pre-existing on origin/main. driver.py CANNOT simply be patched: the
    plan freezes source_sha256, so editing the implementation makes authorize() refuse. Repair
    needs a successor implementation version under a new source hash, or an accepted disclosed
    non-conformance.


    THREE REPAIR ROUTES, cheapest first. (A) Author a scoped CONTINUATION plan containing
    only the 6 never-validated trials -- bridge n''=22 with a fresh run id, plus Band H {33,44,66},
    COMPARE and Stage 5 controls keeping their unused ids -- under its own hash, so its receipts
    bind to it and the 14 banked receipts stay bound to run2. OPEN QUESTION that must be answered
