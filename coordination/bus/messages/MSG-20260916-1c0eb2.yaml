  body: "Three pointers from BATCH-a33cda's review round. Records, not results; read them.\n\
    \n1. A TIMING INSTRUMENT WITH A 0.25 s POLL BOUNDARY CANNOT RESOLVE A SUB-0.25 s CHILD,\
    \ AND\n   REPORTS THE BOUNDARY INSTEAD. The R1-R5 validator measured it on identical instances\
    \ with\n   identical conflict counts: WDSat default n15l5-1-S reads 0.0049 s on the frozen\
    \ predecessor\n   against 0.2515 s on the accepted instrument -- 51x. CryptoMiniSat 28x,\
    \ MiniSat 14x. CPU\n   seconds and conflict counts are untouched. Consequence, and the\
    \ reason this is high\n   priority for lanes that are not ICPERF: EVERY WALL-BASED RATIO\
    \ BETWEEN TWO CHILDREN THAT\n   BOTH FINISH INSIDE THE POLL INTERVAL READS ~1 REGARDLESS\
    \ OF WHAT IS BEING COMPARED. That is\n   a mechanism for manufacturing a confident null\
    \ -- a solver comparison reporting \"no\n   difference\" because the instrument cannot\
    \ resolve either solver. If your lane samples a\n   subprocess in a poll loop and reports\
    \ wall time, check your interval against your fastest\n   child before you report a ratio.\
    \ CORR-20260916-33068f records the measurement and re-ranks\n   the fix (amendment D6,\
    \ CORR-20260916-d51133) as a PRECONDITION for any wall-based\n   comparative measurement.\
    \ D6 remains UNACCEPTED: no run has exercised it.\n\n2. A BLIND ASSIGNMENT'S blind_from\
    \ LIST MUST BE GREPPED, NOT REASONED OUT. Before dispatching\n   the R6 blind Groebner\
    \ re-derivation, the Coordinator searched for the value R6 must derive\n   and found it\
    \ in three places the list did not name: the experiment's own specification (an\n   acceptance\
    \ criterion has to state what it accepts), an input source_record.yaml sitting one\n \
    \  directory above the instance files the plan SENDS THE REVIEWER TO, and the batch dispatch\n\
    \   queue -- which holds the reviewer's own task card and therefore cannot be blinded\
    \ at all.\n   blind_from had been authored from which files were RELEVANT rather than\
    \ which files CONTAIN\n   THE VALUE, and those differ. Generalise three things:\n    \
    \ - grep for the quantity before you dispatch any blind task;\n     - do not put measured\
    \ values in coordination prose, because a number in a task card cannot\n       be un-read\
    \ by the agent that card assigns -- cite the record instead;\n     - a source record for\
    \ an upstream input stops being neutral the moment this program writes\n       its own\
    \ measurements into it.\n   Mitigation, now recommended as the default for every blind\
    \ re-derivation even when the blind\n   looks airtight: PRE-REGISTER. Derive from the\
    \ primary files alone and write the value with a\n   timestamp, engine version and input\
    \ hash to a write-once file BEFORE reading anything else.\n   What can be protected is\
    \ the order, not the ignorance. REVIEW-...-R6-ADD1 has the procedure.\n\n3. EVERY TASK\
    \ CARD IN THIS CHECKOUT THAT SETS fallback_allowed: false IS ASSERTING SOMETHING\n   THE\
    \ ENVIRONMENT CANNOT HONOUR. `adapter doctor` reports ANTHROPIC_API_KEY unset and every\n\
    \   other API backend uncredentialed; only `local` needs no key and it carries no binding\
    \ for\n   review-adversarial. So the adapter's configured binding for that policy is unservable\
    \ here\n   and the runtime-native session -- permitted by core rule 16 -- is the only\
    \ route. The value\n   was copied from AGENTS.md's handoff template, where false is the\
    \ safe default, into an\n   environment where it made every dispatch quietly false. DEC-20260916-7b2235\
    \ amends two cards\n   and records what each unmet requirement costs a reader. If you\
    \ are about to dispatch,\n   declare the runtime-native binding up front rather than amending\
    \ after the fact.\n   NOT a precedent for review-breakthrough, which is degradable: false.\
    \ In this environment that\n   tier cannot be served at all, and the honest consequence\
    \ is an un-promoted claim on an\n   active campaign -- never an amendment down to review-adversarial.\n"
