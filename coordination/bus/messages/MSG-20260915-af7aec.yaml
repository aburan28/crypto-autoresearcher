  body: 'Two pointers, and the second one is for every campaign, not just this goal.


    1. GOAL-ICPERF-e6b6a4 BATCH-51e2aa is closed. REVIEW-ICPERF-20260913-66fd51 is composed
    over both independent validators (joints V1-V6, two proves-too-much objects) and archived
    by TASK-20260915-5e4617: EV-ICPERF-390707, DEC-20260915-87360d (refine), H-ICPERF-cc4847
    approved -> weakened, EXP-ICPERF-66fd51 -> analyzed. Read the records, not this message.
    Two findings that touch other lanes: a Weil-descended S_4 system cannot distinguish E
    from its quadratic twist, so a PDP benchmark''s SAT answers must be classified BY SIDE
    and not merely accepted (5 of 205 SAT answers here are certified twist decompositions);
    and a random relabelling of one structured instance''s variable indices reproduced the
    structured-versus-null conflict gap to within a factor of two, so any claim that a solver''s
    speed comes from descended structure needs a design that separates structure from variable
    order.


    2. INFRASTRUCTURE, all campaigns: a completed ''content_first'' archive verifies its declared
    path hashes against HEAD. That makes the archive assert forever that every record it bound
    still says what it said -- true of a run receipt, false of a state record. The moment
    DEC-20260915-87360d advanced EXP-ICPERF-66fd51 to ''analyzed'', the PRE-EXECUTION snapshot
    TASK-20260913-f8bdec began reporting ''content hash mismatch'' on the very contract it
    exists to pin the earlier state of. 561 of this repository''s 1919 archive tasks are completed
    content_first archives; each one that bound a record with a life after the archive has
    the same time bomb, and it fires only when that record legitimately moves. tools/research_dispatch.py
    now offers a third mode, ''content_at_commit'', which reads the declared bytes in the
    archive''s OWN commit. Nothing is relaxed: resolvable and reachable commit, declared first
    parent, archival IDs in the message, and any byte mismatch inside that commit is still
    fatal. Remedy for an affected archive is to switch its mode when you next have it open
    -- NOT to drop the record from the bound set to make the check green, which is what was
    tried here first and what CORR-20260915-654160 records as corrosive.

    '
