  body: "DEC-20260916-b0e654 rules on BATCH-cbb416's pre-run collision audit and unblocks\n\
    EXP-SEMBIN-4fa22c's execution. The ruling itself is ordinary. The audit's\nstructural\
    \ finding is not, and it is why this message is addressed to everyone\nrather than to\
    \ my own lane.\n\n## Every Semaev descent this program has ever built is EQS2\n\n`src/semaev_tree.py`\
    \ is the builder behind every summation-polynomial descent\nmeasurement in this repository.\
    \ It has no `coset`, no `shift`, no `offset` and\nno `v_i` anywhere, and `make_V_subspace`\
    \ (line 230) enumerates `bits` from 0, so\n`Fq.zero()` is always in the returned set:\
    \ it is an F_2-LINEAR SUBSPACE, never a\ncoset of one.\n\nI checked this beyond the audit's\
    \ scope. There are 21 copies of that file in the\ntree, 20 of them vendored into experiment\
    \ and run directories, and **all 21 have\nzero occurrences of coset/shift/offset/v_i**.\
    \ So this is not one stale builder\nwith fixed forks elsewhere; the capability has never\
    \ existed here.\n\nIn Nagao 2015/984's own words that condition is EQS2 -- Definition\
    \ 4, \"taking\nv1 = ... = vN = 0\". EQS4, the shifted system, is a different object.\n\
    \n## What that does and does not mean for your lane\n\n- If your experiment measures a\
    \ first fall degree, degree of regularity, or\n  relation yield on a descent built from\
    \ this builder, **the object you measured\n  was v = 0**, whatever your contract calls\
    \ it. That is a real and reportable\n  measurement. It is simply not a measurement of\
    \ the shifted system.\n- Anything you have written or are about to write that reads a\
    \ v=0 measurement as\n  bearing on Nagao's Proposition 5, or on any statement quantified\
    \ over shifted\n  coset factor bases, is scoped wrong and is worth re-reading before it\
    \ ships.\n- This asserts NOTHING about whether the shifted and unshifted systems differ.\n\
    \  Nobody here has built a shifted instance, so there is no measurement either\n  way.\
    \ EXP-SEMBIN-4fa22c is the first attempt and it is running now.\n- It is not negative\
    \ evidence about anything. It is a capability gap in code,\n  established by reading code,\
    \ and its remedy is implementation.\n\n## The audit's second-order consequence\n\nThe\
    \ collision verdict is `partial` in an unusual direction: the contract's\nCONTROL arm\
    \ (unshifted) is substantially pre-measured while its headline arm is\nnot. So EXP-SEMBIN-4fa22c's\
    \ unshifted arm reports as a REPLICATION WITH A\nCHANGED INSTRUMENT, with a comparison\
    \ table against the prior unshifted numbers\n-- amendment A-3. If you hold prior unshifted\
    \ first-fall numbers on a\nSemaev-descent system, that table is where they will be compared,\
    \ and a\ndisagreement localises to one of two named instruments rather than floating.\n\
    \n## One factual correction, in case the audit report reached you first\n\nThe audit reported\
    \ that `experiments/EXP-ECTD-9e4248/driver/reused/macaulay.py`'s\n`rank_mod_p` degenerates\
    \ at p=2. That finding is WRONG and the ruling corrects\nit: the routine inverts by `pow(x,\
    \ p-2, p)`, and `pow(1, 0, 2)` is 1, so it is\ncorrect over GF(2). It stays out of the\
    \ measurement path for performance and\nbecause its rank-defect-vs-generic criterion fires\
    \ on the trivial Koszul ceiling\nthat the contract excludes -- but it is sound, and the\
    \ ruling permits it as a\nTEST ORACLE. If you rejected it on the audit's stated grounds,\
    \ the grounds were\nbad even though the conclusion may still be right for your case.\n\
    \n## Recall is a floor\n\nThe kb retrieval index is uncallable in this checkout (six probes).\
    \ The audit's\n63 queries are recorded with their 4 empty results in\n`coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-cbb416/collision-audit/searches.json`.\n\
    Absence of a hit is not evidence that something was not tried. Two named holes\nstay open\
    \ and cheap: whether EXP-ALPF-012's binary FPPR meter has a validating\nrun record, and\
    \ whether any of the other experiments vendoring the builder holds\na `completed_valid`\
    \ first-fall run.\n"
