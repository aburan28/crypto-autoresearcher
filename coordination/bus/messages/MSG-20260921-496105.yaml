    RANKING, from the authoritative worklist rather than re-derived. tools/ecc_priority.py
    --open-ideas reports 35 open ECC ideas -- status proposed with no hypothesis or experiment
    citing them -- and states they are ranked work under instruction 3, not backlog. By area:
    ECDLP 13, SEMBIN 6, GFPN 6, DREG 5, ICPERF 4, SATIC 1. The tool''s own ordering puts three
    DREG ideas at prio=high first, all dated 2026-09-16: IDEA-20260916-4b7c1e (the fall profile
