    and IDEA-20260916-9d2fa6 (the descended chained Semaev system is block-multiaffine --
    degree at most one in each of the t+(t-2) variable blocks and supported on exactly three
    blocks). DREG is inside the declared ECC area set as Semaev and index-calculus machinery,
    so ECC-first ordering applies to it. The highest-ranked ECDLP rows follow, including IDEA-20260913-11d3cb,
    IDEA-20260918-5a9a51, IDEA-20260918-7a11c2, IDEA-20260920-a5757d and IDEA-20260920-a58be0,
    all prio=high.


    SELECTED CANDIDATE for the next design session: IDEA-20260916-4b7c1e, first row of the
    ranked worklist. Selection basis is the worklist order itself -- ECC-first, then prio,
    then designed_at -- and not a fresh judgement about its merit; I did not read the proposal
    body this session and I am not asserting that its mechanism is sound. Ranking orders the
    queue and never manufactures confidence in a mechanism.


    WHAT WAS DELIBERATELY NOT DONE, AND WHY. No hypothesis record, no experiment specification,
    no approval decision and no executor handoff was authored, and no experiment directory
    was created. Steps 2 through 7 were not started. This is a deliberate stop, not an oversight:
    a frozen contract is the strongest kind of record in this program, and the skill requires
    a complete specification -- inputs, controls, independent variables, primary and secondary
    metrics, seeds, replication plan, budget, stopping and invalidation rules, success and
    falsification criteria, and required artifacts -- with approval refused while any field
    is null. Beginning that at the tail of an exhausted session would have produced either
    a half-authored frozen contract or a rushed one whose success criterion might not be decidable
    from its own metrics, and the skill explicitly rejects contracts where no possible outcome
    would count as negative. An incomplete design is worse than a queued one, because it reads
    as approved.


    ALSO CARRIED: two constraints bind whoever designs IDEA-20260916-4b7c1e. First, if the
    deliverable is a concrete-cost table it is a cost-model measurement experiment and needs
    the measured-versus-modeled separation, optimistic-assumption disclosure with bias direction,
    peak memory as a first-class metric reconciled against an analytic sizing, hidden-overhead
    honesty about any superpolynomial factor inside an o(1) term, and standardized named parameter
    sets. If instead it conditions a theorem on a stated heuristic it is a heuristic-validation
    experiment and needs the heuristic numbered and formally stated with its quantifiers,
    a pre-registered prediction cited to its publication and written before any run, an explicit
    scale-access route with transfer assumptions stated, a sample count derived from the smallest
    predicted probability it must resolve, a predefined distribution-comparison metric with
    tail checks, and at minimum a synthetic matched-size uniform control plus a second parameter
    set at a different scale. Second, an experiment is still in flight in this worktree --
    EXP-QSP-70b731 under BATCH-2c4a9c, 14 of 20 trials banked, stage3-bridge-n22 last observed
    executing under TASK-20260921-9f84a3 with the claim expiring 2026-09-23T14:00:00Z -- and
    a detached container writes under experiments/EXP-QSP-70b731/runs/. A new experiment directory
    must not collide with it, and whoever continues that run should first read commit 43253fcd12,
    which changes what validator TASK-20260921-f55696 binds against.


    NEXT ACTION, concrete: design IDEA-20260916-4b7c1e through steps 2 to 7 -- hypothesis
    H-DREG-*, frozen experiments/EXP-DREG-*/specification.yaml with empty amendments/ and
