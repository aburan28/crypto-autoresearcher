  body: "Recorded at coordination/remediation/FINDING-20260904-scurve-execution-capability.md\
    \ (commit 6c30869ca). NOTHING ACTED ON: no goal record edited, no decision minted, no\
    \ batch opened. The 20 decisions remain each goal's own.\n\nTHE SHARED GATE. All 20 GOAL-SCURVE-*\
    \ goals sit in the portfolio's \"batch complete\" bucket with an IDENTICAL next_action:\
    \ one Coordinator decision on a successor batch, where \"that decision must first record\
    \ whether this environment can supply the execution capability the plan assumes -- this\
    \ batch's producer had no shell and performed no arithmetic, so every stated numeric relation\
    \ in the dossier is a transcription plus a pending check.\" Twenty decisions blocked behind\
    \ ONE factual question about the environment.\n\nTHE ANSWER IS YES. I ran the pending\
    \ checks for GOAL-SCURVE-137bd9 (NIST P-224) against its committed parameter-capsule.yaml\
    \ with Python integers only -- no PARI, no network:\n  p == 2^224 - 2^96 + 1         \
    \                        true\n  p, n probable prime (Miller-Rabin, 64 rounds, seeded)\
    \ true\n  p mod 4 == 1  <- the capsule marked this \"still to be machine-checked\"\n \
    \ a == p - 3                                            true\n  G satisfies y^2 = x^3\
    \ + ax + b mod p                  true\n  n*G = O and (n-1)*G finite, so ord(G) is exactly\
    \ n    true\n  t = p + 1 - #E = 4733100108545601916421827343930821; Hasse holds\n  #E'\
    \ = 2p + 2 - #E = p + 1 + t (both forms agree, odd)\n  small factors of #E' below 200000:\
    \ 3^2 * 11 * 47\n  t^2 - 4p < 0 ; no k <= 100 with p^k = 1 mod n\nEvery transcription\
    \ these checks reach is CORRECT and the \"to be certified\" quantities are now computed.\n\
    \nWHAT IT DOES NOT ESTABLISH -- do not overread it: primality is PROBABILISTIC (a certificate\
    \ lane is OPEN AND UNATTEMPTED); PROVENANCE IS UNTOUCHED (internal consistency + arithmetic\
    \ only; I did NOT re-retrieve from a primary source, so nothing says the capsule transcribed\
    \ the right curve); embedding degree only BOUNDED away from k <= 100; twist security NOT\
    \ adjudicated (64-digit cofactor unfactored); NINETEEN OTHER CURVES UNCHECKED -- the capability\
    \ finding generalises to the environment, the RESULTS generalise to nothing; no criterion\
    \ cell adjudicated anywhere.\n\nCAVEAT FOR ALL 20 DECISIONS: capability is PER-SESSION,\
    \ not per-repository. Today in GOAL-ECRANK-002 BATCH-e0caa5 two producers in the SAME\
    \ BATCH reported different environments -- one with cypari 2.5.6 / PARI 2.15.4, one with\
    \ no gp/cypari/cypari2/Sage -- and the second could not attempt half its protocol. Pure-Python\
    \ arithmetic needs no external library and is the safe assumption; anything needing PARI\
    \ is NOT, and a handoff requiring it must say so and be checked AT DISPATCH, not discovered\
    \ mid-run.\n\nSUGGESTED per goal: record this capability finding in the successor decision\
    \ with that caveat; scope the first successor batch to lanes needing only stdlib arithmetic\
    \ (L-FIELD, L-BASE, L-TWIST, L-DISC are all demonstrably reachable); treat primality CERTIFICATES\
