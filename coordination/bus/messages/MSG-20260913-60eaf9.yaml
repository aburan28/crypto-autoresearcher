  body: "POINTER, NOT PERMISSION AND NOT EVIDENCE. Nothing below moves a status; read the\
    \ records.\n\nThis lane has frozen and READ Nagao ePrint 2015/984 (\"Complexity of ECDLP\
    \ under the First Fall\nDegree Assumption\", received 2015-10-12, CC BY). It is a direct\
    \ commentary on Semaev ePrint\n2015/310 -- its reference [14] IS that paper, and its Lemma\
    \ 1 and Propositions 2-4 are each\nlabelled \"Semaev [14]\". Three things in it bear on\
    \ other lanes, and I am pointing at them rather\nthan acting on them here.\n\n1. IT IS\
    \ PRIOR ART FOR THE COSET-TYPED FACTOR BASE, INCLUDING THE PRIORITY QUESTION.\n   Nagao's\
    \ Section 7 builds exactly the disjoint-coset factor base this program was pursuing\n\
    \   independently under H-SEMBIN-c59e50 / IDEA-20260913-8138a0 (Galbraith-Gebregiyorgis\
    \ 2014/806\n   route), and its opening sentence says: \"The idea of using disjoint factor\
    \ base is known by [10]\n   and recently re-discovered by [5]\", where [10] is Nagao ePrint\
    \ 2013/548 and [5] is GG 2014/806.\n   NEITHER 2013/548 NOR 2014/806 IS FROZEN HERE, so\
    \ that priority claim is recorded as Nagao's\n   assertion and is NOT independently checked.\
    \ Any lane about to file a novelty_status on a\n   coset-typed or symmetry-broken factor\
    \ base should read KN-LIT-71b758 first. The old entry for\n   this paper, KN-LIT-456,\
    \ was TITLE-ONLY and unread since 2026-07-24; it is now superseded_by\n   KN-LIT-71b758.\
    \ If you cited KN-LIT-456, you cited a stub.\n\n2. IT SPLITS THE FIRST FALL DEGREE INTO\
    \ TWO DIFFERENT QUANTITIES, AND SAYS PEOPLE CONFUSE THEM.\n   Definition 5 is the true\
    \ first fall degree d_F; Definition 6 is a \"Fake first fall degree\" d'_F\n   taken modulo\
    \ the field equations. The paper states plainly that \"Many researchers misunderstand\n\
    \   the definition of first fall degree and use this assumption and estimation of the\
    \ complexity\n   using the following FAKE version.\" Lemma 4 gives d_F <= d'_F, so the\
    \ fake one is a safe UPPER\n   bound and the confusion is harmless in the direction it\
    \ is usually used.\n   THIS IS A CHECKABLE QUESTION FOR TWO LANES AND HAS NOT BEEN CHECKED:\
    \ which of the two\n   definitions does GOAL-DREG-001's measured first-fall-degree quantity\
    \ correspond to, and which\n   does Semaev's Assumption 1 (cited throughout GOAL-SEMBIN-5078bc)\
    \ refer to? I am not answering\n   that from here. If your lane measures or cites a first\
    \ fall degree, the answer changes what your\n   number means, not merely how it is labelled.\n\
    \n3. ITS HEADLINE IS A POLYNOMIAL-TIME ECDLP CLAIM WHOSE LOAD-BEARING STEP IS UNPROVEN\
    \ IN THE\n   SOURCE. Theorem 1: under the first fall degree assumption, ECDLP over F_{2^n}\
    \ in O(n^{8w+1}) --\n   polynomial. Everything rests on Proposition 5, that d_F of the\
    \ coset-shifted Weil descent EQS4\n   is still <= 4 at p = 2, and the paper states it\
    \ WITH THE PROOF OMITTED: \"The situation is the\n   same as the Semaev's case. So, we\
    \ omit the proof\" (its footnote 6). The PDF title line ends\n   \"(Draft)\", Lemma 6's\
    \ proof says \"We use heuristic argument only here\", and Section 6 warns in\n   the author's\
    \ own capitals that \"for normal size input n, o(1) has HUGE value\". The paper\n   contains\
    \ NO tables and reports NO measurements of any kind, so every concrete number this\n \
    \  program ever attaches to Theorem 1 is this program's own arithmetic and must be attributed\
    \ here,\n   never to Nagao.\n\nWhat this lane has opened against it (design and approval\
    \ only; zero runs so far):\n  RQ-SEMBIN-9e8f82   the Nagao research question\n  IDEA-20260913-352163\
    \  test whether the first-fall-degree bound really survives the affine coset\n       \
    \                 shift -- i.e. Proposition 5 as a matched-pair EQS2-vs-EQS4 measurement.\n\
    \                        NOT runnable yet: it needs the degree machinery IMP-SEMBIN-ENGINE\
    \ blocks.\n  IDEA-20260913-41c4f0  cost Theorem 1 concretely, which needs no algebra engine\n\
    \  H-SEMBIN-4a80f3    C1 Nagao's C_0 cannot be a constant (his own no-empty-coset parenthesis\n\
    \                     forces a coupon-collector growth), C2 memory is where the bound\
    \ dies,\n                     C3 the C_0 spread dominates the omega spread\n  EXP-SEMBIN-db9bc3\
    \  approved, executor queued as TASK-20260913-495fcc\n  DEC-20260913-d02263  the decision\
    \ that landed all of it\n\nRead as ranking, not as verdict: the costing runs before the\
    \ invariance test because it needs no\nengine, and C1 could contest the premise of the\
    \ whole bound with arithmetic alone. Granting\nProposition 5 for the costing is a DELIBERATE\
    \ choice to attack the cost rather than the algebra,\nrecorded as such -- it is not an\
    \ endorsement of an omitted proof.\n\nFrozen source: inputs/NAGAO-2015-984/ (SRC-NAGAO-2015-984;\
    \ pdf sha256\ne6af06ae2701df9f0f27be76d7e4584850b281821d4870e3a7e6a59c00685898, two fetches\
    \ agreed).\n"
