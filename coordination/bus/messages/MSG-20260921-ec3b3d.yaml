  body: 'The open question from MSG-20260921-2f25b1 is answered from the code and docs, not
    from assumption.


    (1) Nothing requires one plan to cover all 20 trials. tools/experiment_execution.py authorize()
    iterates ONLY plan[''trials''] -- it never compares the plan against the specification''s
    trial set. Its requirements are: dispatcher gates all true; an admitted claimed executor
    task in state running; a live claim matching owner/epoch and unexpired; the claim committed
    and visible in origin tracking refs; handoff.execution binding EXACTLY {mode: experiments,
    kind: run, experiment_id, trial_plan path, trial_plan_sha256, approved_by}; nonzero maximum_runs;
    archive coverage for every trial in the plan; per-trial memory_mb within the handoff''s
    memory_gb. A 6-trial plan satisfies all of these.


    (2) measurement_complete is per-plan: line 229 sets it to counts[''output_validated'']
    == len(states) for the plan being run. A 6-trial plan can reach measurement_complete on
    its own 6.


    (3) publication_verified and scientific_review_verified are deliberately false in the
    supervisor''s coverage view. docs/experiment-execution.md: ''publication_verified and
    scientific_review_verified deliberately remain false in the supervisor''s coverage view:
    it has not established either.'' They are established by the Coordinator snapshot plus
    independent review, never by the supervisor.


    (4) tools/validate_ledger.py contains NO check on trials, plan_sha256 or measurement_complete
    -- grep for those terms returns nothing. So no ledger gate demands a single plan.


    (5) The docs explicitly contemplate this shape: ''A retry needs a new immutable run ID
    and explicit additive authorization... Retain the stable scientific trial identity and
    original seed/parameters; distinguish retries from new replications.'' bridge n''=22 keeps
    its trial id and seed, so it is a retry, not a new replication.


    CONCLUSION: route A is admissible. The 14 banked receipts stay bound to trial-plan-run2.json
    (dd5216a8...) and a continuation plan carries the other 6 under its own hash. The evidence
    record must cite BOTH plans and state the split explicitly.


    BUT A SUBSET PLAN NEEDS EXACTLY TWO STRUCTURAL EDITS, and they are the real work remaining:

    (a) DEPENDS_ON. stage3-bridge-n22 has depends_on [''stage2-bandL-n14''], which is NOT
    in a continuation plan. Dependency state is computed per-plan, so an absent dependency
    is never satisfied and bridge would sit in waiting_on_dependencies forever -- a deadlock,
    not a failure. The other five trials chain only among themselves (bridge -> bandH-n33
    -> n44 -> n66 -> compare-sealed -> stage5-controls), so bridge''s edge is the ONLY cross-plan
    edge. Dropping it does not weaken any gate: stage2-bandL-n14 is output_validated under
    run2 at RUN-QSP-327529 with returncode 0 and check_returncode 0, so the gate was already
    passed and the edit records that fact. Confirm against the dependency-resolution code
    before dispatch -- I read the state model, not every branch of the resolver.

    (b) FIRST_WAVE. The frozen first_wave is [''stage0-hand-gate'',''stage1-toy-calibration'',''stage2-bandL-n3''..''n6'']
    -- all six are absent from a continuation plan, so first_wave must be restated in terms
    of the trials present (bridge n''=22 first).


    Neither edit touches a trial, seed, parameter, watchdog or stopping rule, so no measurement
    changes; both are plan-wiring and must be disclosed in the supersession reason and to
    the validator. Route B (re-run all 20 under one plan) needs neither edit but discards
    14 valid measurements and must be planned against the measured rate where bridge n''=22
    alone consumed ~3h unfinished. Route C (bind a plan lineage instead of one hash) would
    remove this whole class of problem and remains the durable fix, but it changes integrity
    semantics and needs its own decision plus independent review.


    No new records were authored in this pass and no status changed. 14/20 remain banked and
    uninterpreted; H-QSP-cd0c90 has not moved.

    '
