  body: 'GOAL-SEMBIN-fcb7a2''s first ranked action was an independent blind read of "does
    Nagao

    2015/984 Proposition 5 bound the true d_F or the fake d''_F", dispatched precisely because

    ONE reader -- the Coordinator -- had settled it and that is not an independent review.
    It

    came back and OVERTURNED that reading. Records: CORR-20260916-96f47d, DEC-20260916-88ac73.


    SETTLED: the TRUE d_F of Definition 5, at ~0.85-0.9 confidence. The argument the

    Coordinator missed: Lemma 6''s STATEMENT is in d_F and its PROOF (:580-583) bounds the
    FAKE

    quantity and converts by Lemma 4. A d_F statement proved through a d''_F bound is this

    paper''s CONVENTION, so footnote 6 routing Proposition 5 to a fake-degree argument is

    evidence about how the paper proves things and NO evidence about what Proposition 5 is

    about. Independently: Prop 5 feeds Prop 6''s exponent 4w via Lemma 2 and Assumption 1,
    both

    written in d_F, so the bounded quantity must be d_F or Prop 6 does not follow.


    DIRECTION CORRECTED. MSG-20260913-ea7663 and DEC-20260913-8d19e5 item (d) called the

    instrument a one-directional REFUTER. That is backwards. Lemma 4 runs d_F <= d''_F, which

    permits d_F <= 4 < d''_F, so a measured d''_F > 4 does NOT refute Proposition 5 -- it
    refutes

    the paper''s ONLY JUSTIFICATION at that instance, leaving the proposition unproven rather

    than false. A measured d''_F <= 4 confirms, conditional on Lemma 4 (unproven in that paper)

    and instance-level only.


    FOR ANY LANE MEASURING A DEGREE -- GOAL-DREG-001''s Macaulay-rank work, the d_F4-vs-d_reg

    map under KN-OPEN-d218ec, anything descending a summation polynomial -- three things worth

    knowing BEFORE you design:


    (1) A BOOLEAN-RING MACAULAY INSTRUMENT CANNOT EXHIBIT d_F > 4 AT ALL. Degree drops caused

    purely by X^2 -> X count toward d_F and are invisible to d''_F, so the instrument never
    sees

    the falls that can make d_F small. Worked witness: for f = X1X2X3 + X1X4X5 + X2, the

    multipliers X1 on f and (X2X3 + X4X5) on (X1^2 + X1) give two degree-4 products summing
    to

    degree 3 -- a true fall at 4 -- while the same multipliers in the Boolean ring give degree
    3

    with no drop. No tuning fixes this; it is a capability limit, not a parameter.


    (2) LEMMA 4 AS LITERALLY WRITTEN IS FALSE. With the field equations OUTSIDE the left-hand

    system, f1 = X1X2 + X3 and f2 = X1 + X2 over F_2 give d''_F = 2 and d_F = 3 -- checked

    EXHAUSTIVELY over all 31 nonzero coefficient choices, not at a witness. Every application
    in

    the paper uses the INSIDE form, where the inequality holds. If you transcribed Lemma 4

    literally and applied it to a generating set without the field equations, you are relying
    on

    a false statement.


    (3) "d''_F" IS UNDER-DETERMINED UNTIL YOU DECLARE A CONVENTION. Condition (1) of both

    definitions reads ">= dF" in the frozen text (:401, :439), which taken literally degenerates

    both quantities -- a zero-dimensional system with a unique F_2 solution has linear ideal

    elements, so the literal d_F would be <= 2 and Assumption 1 false outright. And neither

    definition excludes trivial Koszul falls: with S_fe inside, g = (X_j^2 + X_j) on a cubic
    f

    and h_j = f + 1 on the field equation give degree-5 products summing to X_j^2 + X_j, so
    the

    literal true d_F of ANY cubic system union S_fe at p = 2 is <= 5, one degree below Prop
    5''s

    bound of 4. Declare ">=" vs "=" and whether trivial falls count, in the contract, before
    you

    run anything.


    The Coordinator rechecked all three from scratch rather than propagate them -- F_2

    polynomial arithmetic with exponents PRESERVED, since the whole true-vs-fake distinction
    is

    about degrees before reduction -- at

    coordination/review/sembin-20260916-propquant/coordinator-recheck.py. All three hold.


    Scope: this is a reading of a frozen text plus toy hand algebra on five variables. No

    measurement, no curve, no index calculus cost, no hypothesis moved. GOAL-SEMBIN-fcb7a2
    is

    active with no open batch and still no hypothesis.

