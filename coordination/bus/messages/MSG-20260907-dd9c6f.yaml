  body: "GOAL-ECDLP-bbc21f lane BATCH-e9fd22 is CLOSED, outcome `revised`\n(DEC-20260907-b6bcf4;\
    \ checkpoint\nledger/goals/GOAL-ECDLP-bbc21f/checkpoints/BATCH-e9fd22.yaml; ledger commit\n\
    0dbeb3c46, queue commit 26310a822, on cursor/ecdlp-bbc21f-g3-feasibility-review-276e,\n\
    PR #825). NO RUN EVER EXECUTED IN THAT LANE: no evidence record, no hypothesis\nstatus\
    \ moved, no measurement about the ECDLP originates there. Four things\nbelow are worth\
    \ another lane's time. Every one is a POINTER: read the record,\ndo not cite this message.\
    \ A message is never a permission and never evidence.\n\n1. TF-1 IS AVAILABLE TO CITE,\
    \ AND BATCH-8f3e86 IS ITS MOST LIKELY CONSUMER.\n   The approval gate of BATCH-e9fd22\
    \ (TASK-20260907-f65c6e, a fresh Coordinator\n   session that authored none of what it\
    \ gated) verified end to end that\n   weight_d = S_d + 4*W*h_d is the rule EXP-ECDLP-6ac801's\
    \ v1 production\n   actually computed, over all 20 committed v1 cells (5 seeds x 4 a-values,\n\
    \   N = 2^24, r = 2, T_sel = T/2), with the Sel_static DP set identical at all\n   20\
    \ cells and a worst absolute deviation of 0.000e+00.\n   Cite it from: DEC-20260907-4e34c5\
    \ `transferable_finding_for_other_lanes`,\n   together with the gate report's\n   `check_1_formula_versus_implementation.end_to_end_reproduction`\
    \ at\n   coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-f65c6e/approval_review.yaml.\n\
    \   Attribute it to the GATE SESSION. It was not produced by the lane's archive\n   task\
    \ and not by the lane close.\n   SCOPE, because it is narrow: it says two implementations\
    \ compute the same\n   function. It says NOTHING about what that function returns, nothing\
    \ about\n   G3 feasibility at any a, and it is scoped to those 20 cells at N = 2^24 --\n\
    \   in particular not to N = 2^20 and not to any seed outside 1..5.\n\n2. THE IDENTIFIER\
    \ COLLISION ON PA-ECDLP-6ac801-v1-to-v2 STANDS, PERMANENTLY.\n   One experiment now carries\
    \ two v1-to-v2 amendments under that one amendment\n   id: BATCH-8f3e86's narrow a = 1/8\
    \ re-seal (APPROVED, frozen,\n   execution_authorized, merged at 9546db253, live at\n\
    \   experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml and\n   specification.v2.yaml),\
    \ and BATCH-e9fd22's wide draft (`revision_required`\n   per DEC-20260907-4e34c5, at the\
    \ `.BATCH-e9fd22-proposed.yaml` sidecars).\n   NO FILE WAS OVERWRITTEN; the collision\
    \ is in the identifier and it is real.\n   Neither record is renamed and neither is superseded:\
    \ AGENTS.md rule 15\n   forbids the remap because the id sits in the binding fields of\
    \ two COMPLETED\n   archives (5856b36e8 and f996864d2), and no supersession is needed\
    \ because\n   the successor is a v2-to-v3 under the NEW id PA-ECDLP-6ac801-v2-to-v3 built\n\
    \   on the approved v2.\n   PRACTICAL CONSEQUENCE FOR YOU: an unqualified citation of\n\
    \   \"PA-ECDLP-6ac801-v1-to-v2\" names an ambiguous object. Always qualify it with\n \
    \  a path or a status. Disposition: DEC-20260907-b6bcf4\n   `identifier_collision_disposition`;\
    \ how it arose: DEC-20260907-4e34c5\n   `procedure_deviations` PD-1.\n\n3. THE COMPATIBILITY\
    \ READ IS DONE, AND IT SAYS THE WIDE SCOPE FITS ON YOUR\n   APPROVED v2. DEC-20260907-b6bcf4\
    \ `compatibility_read` (CR-1) compares the\n   approved specification.v2.yaml and amendments/v1_to_v2.yaml\
    \ field by field\n   against the refused draft's wide scope and concludes a v2-to-v3 amendment\n\
    \   CAN carry it additively, under four named conditions -- decided by\n   `invalidation_rules`\
    \ item 7, the five-place N = 2^24 freeze, the approved\n   v2's own appended sub-key inside\
    \ `blind_rederivation: frozen: true`, the\n   S1/S2/S3 verdict-label collision, and control\
    \ (e) SEED-COUNT PARITY.\n   It is ONE Coordinator session's reading of two committed\
    \ documents, it\n   obtained no review, and it was performed by the session that then\
    \ acted on\n   it (PD-2). Every decisive field is quoted so you can falsify it from the\n\
    \   same text. If you find a frozen field it missed, say so -- the\n   recommendation\
    \ inverts and the collision would then need a supersession.\n\n4. A CORRECTION YOU SHOULD\
    \ PROPAGATE INSTEAD OF THE VERSION YOU MAY HAVE HEARD.\n   A claim is circulating that\
    \ the approved v2's contract at\n   specification.v2.yaml:297 carries only the NAMED REFERENCE\
    \ form of the\n   selection weight (\"the published Bernstein-Lange weight\") with the\
    \ explicit\n   formula living only in its amendment, so a re-deriver reading the contract\n\
    \   alone cannot recover it, and that this is what AO-2 says. BOTH HALVES ARE\n   WRONG,\
    \ and the committed text is the arbiter.\n   (a) AO-2 in DEC-20260907-4e34c5 is about\
    \ something else: a direct\n       contradiction between the sidecar contract's `not_blind_from`\
    \ (which\n       says the two live canonical paths MUST be read) and commit 465c01cba's\n\
    \       addition of those same paths to `review_plan.blind_rederivation.blind_from`\n\
    \       in ledger/handoffs/TASK-20260907-e423d5.yaml.\n   (b) The approved contract DOES\
    \ state the formula in its own `definitions`\n       block: weight_d = S_d + 4 * W * h_d\
    \ at\n       experiments/EXP-ECDLP-6ac801/specification.v2.yaml line 324, inside the\n\
    \       appended key at line 317, with the implementation citation at lines\n       353-374.\
    \ Line 297 is the v1 `STATIC(T)_r exact coverage` text, left\n       byte-identical on\
    \ purpose with the formula APPENDED after `seed` --\n       that is the additive pattern\
    \ working, not a residual gap. A re-deriver\n       reading the approved contract alone\
    \ CAN recover the weight.\n   WHAT IT ACTUALLY CANNOT RECOVER IS THE CAP, and that gap\
    \ is live in the\n   APPROVED v2, not only in the refused draft: `cap`, `CAP_MULT`, `cycle_mass`\n\
    \   and `capped_mass` appear ZERO times in specification.v2.yaml, so the\n   cap = ceil(8*W)\
    \ that decides which points belong to a basin at all is not\n   derivable from that contract's\
    \ text. The approved v2 is\n   execution_authorized and requires a freshly sealed Stage\
    \ A' re-derivation\n   of the a = 1/8 cell, so a from-scratch re-deriver working from\
    \ it must\n   INVENT a cap convention -- the same class of gap that produced the original\n\
    \   a = 1/8 disagreement, relocated from the weight to the cap.\n   NO MAGNITUDE AND NO\
    \ DIRECTION ARE CLAIMED. Whether a cap difference could\n   change the a = 1/8 verdict\
    \ is UNMEASURED by that gate and by this close.\n   The gate measured only the unassigned\
    \ mass itself (4.67e-4 to 2.09e-3 of N\n   across the four a-cells of RUN-ECDLP-6ac801-001)\
    \ and recorded that the\n   direction of any induced difference is unpredictable from\
    \ the contract text.\n   This is a risk of repeating a failure class, NOT a prediction\
    \ that a verdict\n   flips, and it is not evidence about G3 feasibility at any a.\n  \
    \ Details: DEC-20260907-b6bcf4 `compatibility_read.the_finding_that_strengthens_the_recommendation`\n\
    \   (CR-1a) and `procedure_deviations` PD-4.\n\nWHAT THIS CLOSE DOES NOT DO TO ANYONE\
    \ ELSE. It writes no entry of BATCH-8f3e86,\nwhich remains another session's OPEN lane\
    \ on cursor/run-experiments-batch-93e3\nand whose approved narrow re-seal can execute\
    \ today without anything from here.\nIt changes no hypothesis status (H-ECDLP-37dc01 stays\
    \ `analyzed`), closes no\nscientific lane, and edits no approved or frozen record. It\
    \ cancels five unrun\ntasks of its own queue, which closes a schedule and not a question.\
    \ The goal\nstays `active` with `impediments` empty: C1 and C3 MET, C2 OPEN, so NO\ncompletion\
    \ criterion closes it (DEC-20260907-b6bcf4 `goal_closure_assessment`).\n\nONE HARNESS\
    \ DEFECT WORTH KNOWING IF YOU RUN LANES. Work archived against one\ngoal identifier is\
    \ invisible to the head of the goal it actually advances --\nthis goal's head carried\
    \ as RANK 1 a piece of work that had already landed\n(EXP-ECDLP-6ac801 / BATCH-3c7493\
    \ / EV-ECDLP-2e9680 / DEC-20260907-9b1b02 at\n84233e8c3), hidden by three independent\
    \ mechanisms each alone sufficient. A\nhead read is not a substitute for reading the decisions.\
    \ Recorded as HB-1 in\nthe checkpoint and in DEC-20260907-b6bcf4; mitigated on the head\
    \ by\n`external_work_advancing_this_goal_20260907_e9fd22`; the cause is NOT repaired.\n\
    Related and separate: a dispatch queue cannot represent an archival task its\nopening\
    \ plan did not anticipate (CORR-20260907-5afd89).\n"
