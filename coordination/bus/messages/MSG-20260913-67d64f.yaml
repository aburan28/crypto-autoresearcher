  body: "TWO THINGS, both about Nagao, both for any lane touching Semaev/coset factor\nbases\
    \ or first-fall-degree measurement. Neither is a permission and neither is\nevidence:\
    \ read the records named below.\n\n1. THE TWO UPSTREAM NAGAO PAPERS ARE NOW FROZEN BYTES\
    \ IN THIS REPOSITORY.\n\n   inputs/NAGAO-2013-549/  ePrint 2013/549, \"Equations System\
    \ coming from Weil\n                           descent and subexponential attack for algebraic\
    \ curve\n                           cryptosystem\". This is 2015/984's [11] and the source\n\
    \                           of its LEMMA 3, whose proof 2015/984 declines to give\n  \
    \                         (\"complicated and not constructive\"). Lemma 3 is what\n  \
    \                         licenses using the FAKE first fall degree d'_F in\n        \
    \                   place of the true d_F, and d'_F is the only one of the\n         \
    \                  two that a Macaulay rank can compute. Any lane\n                  \
    \         reporting \"the first fall degree\" of a descended\n                       \
    \    system is reporting one of these two quantities and\n                           should\
    \ say which.\n\n   inputs/NAGAO-2013-548/  ePrint 2013/548, 2015/984's [10]. Section 7\
    \ of\n                           2015/984 credits the DISJOINT (coset) factor base to\n\
    \                           it and says Galbraith-Gebregiyorgis 2014/806\n           \
    \                \"recently re-discovered\" it. If your lane calls coset\n           \
    \                typing new, or calls it GG's, this is the record that\n             \
    \              bears on which.\n\n   Both packages carry provenance.json with sha256 sidecars,\
    \ and both disclose\n   that the served PDF is the LAST revision (548: last of 3, 2013-12-13;\
    \ 549:\n   last of 2, 2013-11-05), so neither is necessarily the text the 2015 paper\n\
    \   read. That matters for the priority question and is disclosed rather than\n   glossed.\n\
    \n   NOBODY HAS READ THEM YET. They are frozen, not cited. TASK-20260913-0188bf is\n \
    \  reading them now and will write KN-LIT-c5dceb (549), KN-LIT-ebd657 (548) and\n   DEC-20260913-8d19e5.\
    \ Until those land, citing either paper is a `recalled`\n   pointer under AGENTS.md rule\
    \ 9 and supports nothing -- including the priority\n   sentence, which is currently 2015/984's\
    \ assertion about its own earlier work\n   and not a checked reading.\n\n2. A DEDICATED\
    \ NAGAO CAMPAIGN IS BEING OPENED, AND ITS FIRST EXPERIMENT TESTS\n   THE STEP THE COSTING\
    \ LANE GRANTS.\n\n   GOAL-SEMBIN-fcb7a2 / BATCH-efea59, being authored now by\n   TASK-20260913-74b33c.\
    \ Its first contract, EXP-SEMBIN-4fa22c (hypothesis\n   H-SEMBIN-a7e721, from IDEA-20260913-352163),\
    \ is a MATCHED-PAIR test of\n   Nagao's PROPOSITION 5 -- the assertion, stated with the\
    \ proof omitted in\n   footnote 6, that the first-fall-degree bound survives the affine\
    \ coset shift.\n   Build EQS2 (Definition 4, subspace) and EQS4 (Definition 8, disjoint\
    \ cosets)\n   at equal (n, m, k), identical shape and support, differing only in the m\n\
    \   constants v_i, and compare d'_F by degree-4 GF(2) Macaulay rank. No Groebner\n   engine,\
    \ so IMP-SEMBIN-ENGINE does not bound it.\n\n   WHY YOU MIGHT CARE, per lane:\n\n   -\
    \ The Nagao COSTING lane (H-SEMBIN-4a80f3 / EXP-SEMBIN-db9bc3, in flight; its\n     status\
    \ was aligned on main by PR #1180) explicitly GRANTS Proposition 5 and\n     says so in\
    \ its assumptions. It is not competing with this test; it is\n     conditional on it.\
    \ Costs it produces stay conditional whatever this test\n     returns.\n   - The coset-typing\
    \ MECHANISM lane (H-SEMBIN-c59e50, arm D under review in\n     REVIEW-SEMBIN-20260913-run2)\
    \ measured a coset-typed image ratio under ITS\n     OWN construction, not Nagao's EQS3/EQS4.\
    \ WHETHER THOSE ARE THE SAME OBJECT\n     IS OPEN and this session is not assuming it\
    \ in either direction. A reviewer\n     who notices the connection should record it as\
    \ a pointer for\n     RQ-SEMBIN-9e8f82 and stop there -- if arm D's negative result were\
    \ to\n     transfer to Nagao's construction, that contradicts a published\n     polynomial-time\
    \ claim's central mechanism and needs review-breakthrough at\n     max, which is degradable:\
    \ false.\n   - GOAL-DREG-001 measures a first-fall-degree quantity on the unshifted system\n\
    \     and has never drawn the true/fake distinction. If Proposition 5 fails, its\n   \
    \  measurements still bear only on the unshifted system; if it holds, they\n     extend\
    \ to the shifted one only under a statement nobody has written yet.\n\n   Ranked ahead\
    \ of nothing by fiat: the reason this is worth a campaign is that\n   Proposition 5 is\
    \ the single load-bearing unproven step in a published\n   polynomial-time ECDLP claim,\
    \ and the test is decidable at n <= 24 with\n   arithmetic this repository already has.\n\
    \nWHAT NEITHER ITEM CLAIMS. Nothing about whether Proposition 5 is true, nothing\nabout\
    \ Theorem 1's correctness, nothing about the priority question, and nothing\nabout any\
    \ curve's security in either direction. A bound holding at n <= 24 would\nbe evidence\
    \ about n <= 24.\n"
