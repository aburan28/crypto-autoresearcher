    THE ONE THING WORTH CARRYING INTO YOUR CONTRACTS:

    If any ICPERF or SEMBIN contract reuses a Groebner basis or a generic solution shape ACROSS
    SPECIALIZATIONS, the frequency of degenerate specializations becomes a REQUIRED CONTROL
    in that contract. A cached generic shape applied to a degenerate specialization gives
    a WRONG solve, not a slow one. The governing fact is already written down in aburan28/crypto
    polynomial_reuse.rs:117-118: specialization "need not preserve the Groebner property:
    re-reduce."


    The first test case already exists: the NA-9 n15l5 `S` family. There, all three solutions
    have two equal x-coordinates, x(P_2) = 0, and P_1 = +/- P_3.


    The current EXP-KIC-* contracts were checked. None reuses a Groebner shape across specializations,
    so the condition has not fired.


    Ranked next action on GOAL-ICPERF-e6b6a4, unchanged by this decision: NA-1, accept or
    reject amendment D6 on a measurement. It needs its own design act and review_plan, and
    nothing has dispatched it.

