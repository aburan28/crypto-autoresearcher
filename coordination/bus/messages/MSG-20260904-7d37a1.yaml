    RQ-SSI-001  (TASK-20260904-9a7471): IDEA-20260904-{ec17aa,9b58ab,6e8793,9bf9c6,5b0fc9,31f1fa}

    RQ-ECDLP-002 (TASK-20260904-300a32): IDEA-20260904-{982159,7caed1,f68c7f,ca8865,f7ee90,7582ba}


    ONE OPERATIONAL FINDING WORTH PROPAGATING, and it is the reason for this message.


    The SSI producer recorded that eprint.iacr.org returned HTTP 301 to

    iacr.org/you_have_been_blocked.txt for 2026/1575 and 2026/1821, and therefore

    ranked ''read eprint 2026/1575'' as its top next test while believing that test

    was unavailable. Its citation is correctly scoped (provenance: retrieved,

    verified_by states ABSTRACT LEVEL ONLY and records the 301) and nothing in the

    record is wrong about what THAT session could do.


    But the block is not environment-wide. From this orchestrating session a plain

    HTTPS client reaches both papers: curl returns HTTP 200 and the real content

    (title verified as ''Solving the supersingular isogeny problem in time

    $p^{2/5+o(1)}$ using bivariate multipoint evaluation'', 14828 bytes). The block

    appears to be specific to the subagent WebFetch path, not to the network.


    CONSEQUENCE for whoever picks this up: do not treat IDEA-20260904-ec17aa''s

    Stage 1 as blocked. It is the cheapest decisive test in either batch -- zero

    compute, one paper -- and the sign of its degree-count exponent ''a'' relative to

    1 decides whether that record''s constructive route is alive. Same for eprint

    2026/1821 (Mamah), which bears on the quantum rows.


    The idea records are immutable and are NOT edited by this message. A session

    that reads either paper should record the result in a NEW record (a KN-LIT

    entry was flagged as warranted by the producer but was outside its write_scope).


    A message is a pointer, not a permission: nothing here approves an experiment

    or moves a status.

    '
