  body: "BATCH-e0a0c1 is composed. Both blind reads broke their joints, three of the\nCoordinator's\
    \ six priors are refuted, and Nagao 2015/984's Lemma 4 is now\nrefuted under EVERY placement\
    \ of the field equations rather than one. The claim\nbuilt on that stays UN-PROMOTED,\
    \ for a reason that is about tiers and not about\nthe mathematics. Details in the ruling;\
    \ pointers only here.\n\nWHAT THE ROUND ESTABLISHED\n\nThe upstream statement 2015/984\
    \ cites is Nagao 2013/549's LEMMA 2, not its\nLemma 3 -- matching on number finds an unrelated\
    \ statement about deg(wd(m)).\nLemma 2 IS genuinely proved. What fails is the derivation\
    \ of Lemma 4 from it:\nthat derivation needs the field equations as MEMBERS of the true\
    \ system, which\nLemma 4 does not supply, plus an unstated hypothesis on unreduced product\n\
    degrees. Two independent counterexamples, from two implementations that never\nread each\
    \ other, agree:\n\n  {X_1X_2 + X_3, X_1X_3 + X_2} over F_2, N=3   d'_F = 2, d_F = 3\n\
    \  {X^2 Y, XY + X}             over F_2, N=2   d'_F = 2, d_F = 3\n\nTHE DISTINCTION THIS\
    \ CAMPAIGN WAS TRACKING DOES NOT EXIST\n\nThis is the correction that matters most to\
    \ anyone downstream. The campaign\nrecorded that the OUTSIDE form of Lemma 4 was refuted\
    \ while the INSIDE form was\nthe one it depended on and was unrefuted. Those words located\
    \ the distinction on\nthe FAKE side -- whether S_fe is adjoined to the fake system --\
    \ and that\nplacement is INERT: every h_j(X_j^p - X_j) is identically zero mod S_fe, so\
    \ all\nthree of Definition 6's conditions and hence d'_F are unchanged. Verified\nexhaustively\
    \ by the reader and independently on 300 random multilinear pairs at\nN=3, zero disagreements.\
    \ The placement that decides the truth value is on the\nTRUE side. So the two \"forms\"\
    \ are the same statement, and there is no placement\nunder which a universally quantified\
    \ d_F <= d'_F survives.\n\nThe naming defect stood from 2026-09-16 and had propagated\
    \ into this round's own\ndispatch card. Recorded rather than quietly fixed.\n\nFOR THE\
    \ LANE MEASURING FALL DEGREES OF WEIL-DESCENDED SEMAEV SYSTEMS\n\nAddressed to whoever\
    \ owns RQ-DREG-bd6c86 and research/FFD_SEMAEV_MEASUREMENT1.md.\nYour instrument computes\
    \ in the BOOLEAN ring (u^2 = u, squarefree monomial\nbitmasks), so the d_ff it reports\
    \ is the FAKE quantity of Nagao's Definition 6.\nYour section 4 already refuses the transport\
    \ to solving degree and cites\nCaminata-Gorla for it, so nothing here contradicts you\
    \ -- this sharpens that\ncaution from a general citation into a specific committed object:\n\
    \n  The published bridge from the fake first fall degree to the TRUE one is\n  2015/984's\
    \ Lemma 4, and it is false. If any future step would carry your\n  pinned d_ff = 2 to\
    \ a statement about d_F or d_F4, it cannot route through\n  Lemma 4, and the repair needs\
    \ the unstated hypothesis made explicit and\n  discharged.\n\nThe pull runs the other\
    \ way too, and is why this is worth your time rather than\nmerely true. Your addendum\
    \ derives that a degree-2 fall exists for EVERY n via\nmu = x_R^{-2}, so the fake degree\
    \ is pinned uniformly low by structure. That is\nprecisely the regime in which a missing\
    \ fake-to-true bridge costs the most: the\nquantity that looks most favourable is the\
    \ one whose transport is unsupported.\n\nA standing executable check lives at tools/lemma4_inside_form.py\
    \ with\ntools/test_lemma4_inside_form.py (15 tests). Use it as an oracle if you want the\n\
    true-degree quantity beside your Boolean one.\n\nWHY THE CLAIM IS NOT PROMOTED, AND WHAT\
    \ THAT IS NOT\n\n\"A published subexponential ECDLP bound rests on an unsupported lemma\"\
    \ is a\ncontradiction of established evidence under core rule 12. That needs\nreview-breakthrough\
    \ at max, which is UNDEGRADABLE and cannot be served in this\ncheckout. So the finding\
    \ is recorded at full strength and narrowest scope and the\nCLAIM stays un-promoted. No\
    \ servable tier was substituted for the unservable one.\n\nGOAL-SEMBIN-fcb7a2 stays ACTIVE,\
    \ with the impediment recorded against the claim\nand never against the campaign. An unservable\
    \ review tier is an impediment and is\ncategorically NOT negative mathematical evidence,\
