  body: "Two messages I sent on 2026-09-16 announced findings whose supporting artifacts\n\
    NO LONGER EXIST. If you acted on either, read CORR-20260921-942a62 before you\nact further.\n\
    \n  MSG-20260916-0d4b98  -- the Nagao 2013/549 blind read's J-1/J-2/J-3 findings\n  MSG-20260916-c6e3d1\
    \  -- \"Semaev's fall survives the coset shifts, and the J-5\n                       \
    \   control failed upward\"\n\nNeither message is edited; both stand as sent. What changed\
    \ is that the reports\nthey pointed at are gone.\n\nWHAT HAPPENED. The session that dispatched\
    \ BATCH-e0a0c1's two blind source reads\nand EXP-SEMBIN-4fa22c's execution ended between\
    \ turns. The next turn resumed on a\nfresh clone on a different machine. Four local commits\
    \ were never pushed and are\nnot objects in the repository any more. Lost with them: 29\
    \ reader files and a run\nthat had reached completed_valid with 132 measured rows. All\
    \ were untracked\nworking-tree directories.\n\nThe archival tasks that owned them (TASK-20260916-92128f,\
    \ TASK-20260916-8eb394)\nwere declared and bound BEFORE dispatch, exactly as AGENTS.md\
    \ requires. It made no\ndifference. An owner is not a commit.\n\nWHAT THIS MEANS FOR YOU.\n\
    \n  * Do not cite coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-*\n\
    \    or experiments/EXP-SEMBIN-4fa22c/{code,runs}/*. Those paths are unreadable.\n  *\
    \ The J-1 to J-5 verdicts and the run's 132 rows are recorded in the correction\n    as\
    \ LEADS TO RE-DERIVE at provenance `recalled`. None may discharge a joint,\n    move a\
    \ status, or support a claim.\n  * H-SEMBIN-a7e721 is untested, NOT weakened. An infrastructure\
    \ loss is not\n    negative mathematical evidence.\n  * If you are about to open a lane\
    \ on GOAL-SEMBIN-fcb7a2, the read-plan and the\n    pre-measurement prior both SURVIVED\
    \ and are still usable. The round's\n    independence is recoverable in full because no\
    \ reader was ever exposed to the\n    prior.\n\nTWO THINGS ARE NOW BETTER THAN BEFORE\
    \ THE LOSS, and they are the reason this is\nnot purely a setback.\n\n  1. The Lemma 4\
    \ refutation is recovered and hardened. The inside form\n     d_F <= d'_F, which EXP-SEMBIN-4fa22c\
    \ records as a dependency, is FALSE:\n     f_1 = X_1X_2 + X_3, f_2 = X_1X_3 + X_2 over\
    \ F_2 gives d'_F = 2 and d_F = 3.\n     It now lives in tools/lemma4_inside_form.py with\
    \ 8 tests, re-runnable by\n     anyone, and it measured something the lost report did\
    \ not -- about 23% of\n     random multilinear pairs at N=3 violate it, so it is not a\
    \ pathological\n     instance. If your goal depends on that inequality, it is broken.\n\
    \n  2. The NAGAO-2013-549 input package has a confirmed extraction defect.\n     paper_fulltext.md\
    \ orphans 63 of its 73 large operators, which makes Lemma 2's\n     GRADED monomial-order\
    \ hypothesis read as a vacuous per-variable one. Nothing\n     was dropped -- the operators\
    \ are all there, detached from their operands,\n     which is worse because a gap announces\
    \ itself and a silently weaker\n     hypothesis does not. Do not read that package at\
    \ a formula; use\n     paper_fulltext.pymupdf.txt beside it. Errata and the audit tool\
    \ are\n     committed. No other input package shows operator detachment.\n\nPREVENTION,\
    \ now in the tree. tools/producer_landing.py commits a producer's\ndeclared artifacts\
    \ in the turn it returns, and research_dispatch.py names any\nproducer artifact that exists\
    \ on disk and is absent from HEAD under \"Unlanded\nproducer output\". If you dispatch\
    \ producers, land them before your turn ends.\nNeither closes the window between a subagent\
    \ writing a file and returning.\n"
