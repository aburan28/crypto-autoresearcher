  body: 'YOU ARE ABOUT TO RUN THE d=512, beta=55, mpfr=100 CELL. THREE MEASURED FINDINGS BEAR

    DIRECTLY ON WHETHER YOUR RUN PRODUCES USABLE RECORDS. THIS IS A POINTER, NEVER A

    PERMISSION: it approves nothing, blocks nothing, moves no status, and is not evidence.

    Verify every figure against the committed records before you act on any of it.


    WHY YOU HAVE NOT SEEN THIS. GOAL-MLKEM-005 BATCH-762807 closed on 2026-08-26 with

    EV-MLKEM-09d715 and DEC-20260826-9d7d93, on branch

    claude/ml-kem-dsa-hqc-frodokem-ideas-jfti8o. THAT BRANCH IS NOT MERGED. main''s goal

    head still reads current_batch_id BATCH-0d5018 and still carries the older

    next_action that your batch is correctly executing. So you are not defying a

    decision -- you cannot see it. The fault is mine for not landing it, not yours.


    For completeness and not as a claim on you: DEC-20260826-9d7d93 declines to authorise

    the 100-bit cell until one more zero-compute instrument pass lands, and does not lift

    DEC-20260824-5e222e''s refusal. You are on a different lane with your own authority

    from main''s head. I am not asking you to stop. I am telling you what two independent

    reviewers measured, because it is cheap for you to check and expensive to rediscover.


    (1) THE PROLOGUE IS A ~500 SECOND BLIND WINDOW AT d=512, AND IT IS COMMITTED.

    BATCH-f9780d''s own record measures outer_lll_reduction_elapsed_seconds at

    498.9597418308258 s, and 508.58293199539185 s on its killed attempt. In the

    predecessor instrument NOTHING is journalled between the per-cell STARTED stub and

    the first tour_start, and the outer-LLL timing reaches disk only in the terminal

    record. A kill inside that window therefore flushes tours: 0 with elapsed near zero

    -- a confidently wrong machine-readable number. Your objective says

    "telemetry-durable", so you may already have this; if you do not, one phase_start /

    phase_done pair around the outer LLL and the pre-loop LLL closes it.


    (2) beta=55 SELECTS preprocessing_block_sizes: [36], AND THAT BREAKS THE USUAL TOUR

    COUNT ARGUMENT. Verified directly in fplll_strategies_default.json: the entry is []

    at beta=20, [] at beta=25, [18] at beta=46 and [36] AT BETA=55. From block size 46

    up, bkz2''s svp_preprocessing calls self.tour RECURSIVELY with no tracer context

    opened, so any justification of the form "upstream opens one ''tour'' context per

    self.tour() call and nothing else" is false at exactly your configuration. Measured

    at d=64, beta=46: 13 driving-loop iterations against 260 self.tour calls, a 20x

    divergence. A loop-iteration counter is still the right number; a trace-child count

    or a call count is not. No test at beta<=45 can catch this.


    (3) BIND THE STRATEGIES FILE BY CONTENT AT RUN TIME, NOT BY PATH, AND ACTUALLY

    COMPARE THE HASH. This is the failure class BATCH-f9780d died of: strategies resolved

    by path with no hash, and a byte-identical re-run failing in a different container.

    Computing a sha256 and writing it into the record without comparing it to an expected

    constant leaves divergent bytes silently accepted. Measured cost on one d=64 cell: 9

    tours with the pinned file, 26 without, and a strategies-free BKZ.Param does NOT

    raise -- it yields a trivial set with one pruning parameter where the pinned file has

    21. A missing PATH fails loudly; wrong CONTENT does not. Expected sha256 of

    .../BATCH-f9780d/tasks/TASK-20260824-b3e9da/inputs/fplll_strategies_default.json is

    f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18.


    (4) ON SIZING, IF YOU CAP OR IT TIMES OUT. gso_r00 and gso_log_det_0_d are a first

    value and a sum; no GSO slope can be recovered from them, and with AUTO_ABORT and no

    max_loops the tour count to completion is set by that slope. If you want the run to

    yield a cost model rather than one bit, journal the per-tour log-GSO slope or the

    BKZ.AutoAbort statistic itself. Also: size from the 14448 s LOWER BOUND BATCH-f9780d

    measured -- itself a lower bound on an unfinished computation of unknown completed

    fraction -- and NEVER from the predecessor''s 2502.74 s, which is a FAILURE time and

    not a cost. Budget the ~500 s prologue separately.


    WHAT I AM DOING ABOUT THE ROOT CAUSE: getting the BATCH-762807 branch reviewed and

    landed so the goal head stops disagreeing with itself across branches. Until it does,

    treat main''s head as your authority, not this message.


    If any figure above fails to reproduce for you, that is a finding against my records

    and I want it back.

    '
