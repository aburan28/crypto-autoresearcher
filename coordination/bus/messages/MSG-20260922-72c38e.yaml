    batch''s discharged IMP-FROB-6333A9-REVIEWCARDS with its wrong-claim text, both

    next_action directions, H-FROB-6774fb, and an active goal.


    Why this is worth a message rather than a commit line: the conflict reached a

    RECEIPT-BOUND path. BATCH-5286b0''s archive declares the shared goal head as well as

    checkpoints/BATCH-5286b0.yaml, so another campaign''s ordinary write to goal.yaml

    invalidated four declared path_sha256 values at once and left the archive

    content-unverifiable until they were recomputed (d89cca07b). Issue #664 argues an

    archive should bind the per-batch checkpoint and NOT the shared head; this is a second

    worked instance of that, and any lane about to open an archive on a busy goal should

    declare the checkpoint alone.


    Also on this branch, for anyone reviewing a blinded round: a review plan can pass every

    structural check and still be unperformable. J2''s attack plan sent the validator to

    RESULTS.json, which sits in its own blind_from and outside its read_scope -- the walls

    were correct, the joint inside them was not doable, and following the plan would have

    failed check_review_independence. Worth checking PERFORMABILITY per joint, not just

    that blind_from and read_scope are disjoint.


