  body: "# Addendum 01 to the NA-5 preflight note\n\n**Written:** 2026-09-18, immediately\
    \ after the note, on the same task.\n**Supersedes nothing.** The note's findings stand.\
    \ This corrects one statement in\nit and records what the correction revealed.\n\n## The\
    \ note's NA-5 status line is WRONG, and here is the correction\n\n`preflight-note.md`\
    \ closes with \"**NA-5 IS NOT DISCHARGED**\". That was true when\nwritten and is false\
    \ now. Merging `origin/main` immediately afterwards brought in\na CONCURRENT LANE'S WORK\
    \ that discharges it:\n\n- `experiments/EXP-QSP-82a906/specification.yaml` — v1, `status:\
    \ approved`,\n  `source_proposal: IDEA-20260916-b84e2d` (**the same idea NA-5 names**)\n\
    - `ledger/hypotheses/H-QSP-411d8f.yaml` — `status: specified`, H1 of\n  `H-QSP-645a07`\
    \ restated as a falsifiable claim at `m = 2` cells\n- `ledger/decisions/DEC-20260917-f37ca4.yaml`\
    \ — the approval\n- `ledger/handoffs/TASK-20260917-66ec2b.yaml` — execution handoff to\
    \ the executor\n\nSo NA-5 is discharged **by that lane, not by this one**. This session's\
    \ own design\ndispatch died on an API weekly rate limit before reading any record, which\
    \ in\nhindsight prevented a duplicate contract against the same idea. `H-QSP-e15e15` and\n\
    `EXP-QSP-bb346d` remain minted, verified free and **unused**.\n\nThis session stopped\
    \ rather than continuing, per the concurrency rule that another\nsession on the same goal\
    \ is not a stop but duplicated work is waste.\n\n## What the collision revealed: THE TWO\
    \ CONTAINERS DO NOT HAVE THE SAME ENVIRONMENT\n\n`EXP-QSP-82a906`'s `environment.present/absent`\
    \ block records, measured in ITS\nsession: `numpy 2.4.4` **present**; `sympy` **absent**\
    \ (\"python import\nModuleNotFoundError\"). Measured in THIS session's container the same\
    \ day\n(`out/engines.txt`):\n\n| module | their container | this container |\n|---|---|---|\n\
    | `numpy` | **2.4.4 present** | **ABSENT** (ModuleNotFoundError) |\n| `sympy` | **absent**\
    \ | **1.14.0 present** |\n\nBoth measurements are honest; the containers differ. Two consequences\
    \ for a\ncontract that has been approved but **whose `runs/` is still empty**, so both\
    \ are\namendable before execution rather than after:\n\n### (a) Instrument I2 permits\
    \ a dependency that may not be there\n\n`I2_python_sylvester` reads \"numpy 2.4.4 may\
    \ be used for arrays\". An executor\nlanding in a container like this one has no numpy,\
    \ and a permitted-but-absent\ndependency is the kind of thing that surfaces as a stage\
    \ failure rather than as a\nclean refusal. Bit-packed integer arithmetic needs no numpy\
    \ at all — this note's\nown `code/preflight_resultant.py` does 32x32 Sylvester determinants\
    \ over\n`F_{2^n}` in pure Python with no imports beyond `time` and `random`.\n\n### (b)\
    \ The sympy prohibition is RIGHT, but recorded for a container-specific reason\n\nI2 says\
    \ the implementation \"MUST NOT import sympy, sage, galois, flint, or ntl\n(all absent\
    \ or forbidden as a hidden dependency)\". The prohibition is correct.\nThe stated reason\
    \ — absence — does not travel: in a container where sympy IS\npresent, \"absent\" reads\
    \ as no longer applicable, and the prohibition looks like\nportability hygiene rather\
    \ than a correctness rule.\n\n**The durable reason is that sympy is WRONG for this, not\
    \ that it is missing.**\n`sympy.GF(2**k)` is the ring of integers modulo `2**k`, NOT the\
    \ field extension\n`F_{2^k}` — demonstrated in `code/sympy_domain_trap.py` /\n`out/sympy_domain_trap.txt`:\n\
    \n    GF(2**4).characteristic()  ->  16     (a field of order 16 has characteristic 2)\n\
    \    2 * 8 mod 16               ->  0      (2 is a zero divisor; F_16 has none)\n    2\
    \ ** -1                    ->  NotInvertible: zero divisor\n\nand sympy is simultaneously\
    \ CORRECT over the prime field `F_2`, which is what\nmakes it dangerous: it half-works,\
    \ so a Sylvester resultant built on\n`GF(2**n)` would compute in `Z/2^n` and emit plausible\
    \ numbers with no error\nraised. That is a wrong eliminant degree, which is the experiment's\
    \ primary\nmeasurement.\n\nSuggested amendment, for that lane to accept or refuse — it\
    \ is their contract and\nthis session has no authority over it: restate the prohibition\
    \ as a correctness\nrule with the demonstration cited, and drop or make-optional the numpy\
    \ permission.\n\n## Scope\n\nUnchanged from the note. Nothing here measures a chain system,\
    \ an eliminant\ndegree or `kappa`; nothing licenses any claim about `H-QSP-645a07`, H1,\
    \ (E) or\n`kappa`; `DEC-20260917-793ae2` stands at `weaken`. Routed to the bus as\n`MSG-20260918-*`\
    \ because a contract whose runs have not started can still be\namended cheaply, and after\
    \ execution it cannot.\n"
