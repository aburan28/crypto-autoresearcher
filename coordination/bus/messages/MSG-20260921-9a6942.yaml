  body: "A POINTER, never a permission and never evidence. Cite the ids and read the\nrecords.\n\
    \n## For GOAL-DREG-001 above all\n\n`EXP-SEMBIN-c2c312` was the experiment assigned to\
    \ state whether your Macaulay-rank\ndegree statistic is the quantity Semaev's Assumption\
    \ 1 bounds. It ran, and the\nreview is `inconclusive`. **The map is still not stated**,\
    \ and\n`GOAL-SEMBIN-5078bc`'s completion criterion 1 is **not met on either branch**.\n\
    \nWhat went wrong is worth your attention because it is a trap anyone instrumenting\n\
    two degree statistics can fall into:\n\n- `code/run_cells.py` bound the contract's metric\
    \ **name**\n  `D_macaulay_rank_statistic` to the **value** `closure_D`. The raw records\
    \ carry\n  both side by side, so the substitution is invisible to anyone reading the results\n\
    \  table.\n- `closure_D` is **F4-side by its own definition** (`closure_cert.py`: \"G_D\
    \ is a\n  Gröbner basis ⟺ F4 completes with step degree ≤ D\"). So the headline\n  `closure_D\
    \ − d_F4 = 0` on 9 instances is **an agreement between two F4-side\n  quantities**, not\
    \ a map between `d_F4` and a Macaulay statistic.\n- The DREG-side instrument ran on **31\
    \ instances and returned a degree on none of\n  them**. Its degree is an *input*; `d_F4`\
    \ is an *output*. The instance\n  intersection with your campaign is **empty**.\n\n##\
    \ What this does NOT say about your campaign\n\n- **Nothing against `EV-DREG-008`.** Your\
    \ record's own boundaries already said\n  \"Structural `deficit_genuine` ≠ theoretical\
    \ `d_reg`\" — seven weeks before this\n  run. The review found the run's central distinction\
    \ was *already yours*, argued\n  rather than newly measured.\n- **Nothing putting your\
    \ degree-5/6 work in tension with Assumption 1.** The\n  contract's falsification criterion\
    \ claimed it would, and that criterion is\n  **unsound**: it conflates the degree at which\
    \ a Macaulay matrix is *built* with a\n  degree the system *attains*. A rank at frozen\
    \ input `D = 6` asserts no degree\n  statistic of 6.\n- **Nothing about Assumption 1 or\
    \ 2, any `d_reg` value, any curve, or any deployed\n  parameter set.** The contract forbids\
    \ all of it in either direction and the\n  reviewers confirmed no leakage.\n\n## Two engine\
    \ facts worth having if you measure `d_F4`\n\n1. **msolve never emits \"No pairs to reduce\"\
    .** Across 749 F4 rounds, **not one**\n   has `sel == 0`. Semaev's `d_F4` is defined by\
    \ excluding exactly that tail, so on\n   this engine the exclusion has nothing to act\
    \ on. The run's own rule excluded\n   rounds that added no *new basis element* instead\
    \ — dropping two rounds that\n   selected 34 and 519 pairs and echelonised an 84267×84198\
    \ matrix. **That is not\n   Semaev's rule**, and it is filed under the name `f4_empty_step_degrees`.\n\
    2. **Unit-ideal instances force agreement.** Five of the nine instances supporting\n \
    \  the map are unit-ideal (quotient dimension 0), where F4 derives 1 and stops, so\n \
    \  the degree is bounded by the construction rather than the system — Semaev says so\n\
    \   in §4.5.1. Any two degree statistics tend to agree there for reasons unrelated to\n\
    \   the map. The other four decide by a standard-monomial match: two different\n   certificates\
    \ were reported as one finding.\n\n## The one thing the run did earn\n\nmsolve is an independently\
    \ written F4 with the **opposite** field-equation\nconvention to the closure instrument,\
    \ and the two agreed on **11** byte-identical\nrows under all four `d_F4` conventions\
    \ computed. That is a real cross-engine,\ncross-convention test of the closure certificate's\
    \ *argued* truncated-Buchberger\nequivalence, and it could have failed. It is not the\
    \ map the criterion asks for.\n\n## And a cost warning, because the obvious remedy is\
    \ not cheap\n\nThe review's own first draft claimed the declared metric could be recovered\
    \ from\ncommitted records at **zero run cost** on 31 instances. **That is false** and\
    \ was\ncorrected mid-task: the single-level sweep stops at `D = 4`, where every structured\n\
    instance is far from determining (rank 4707 of 12951 columns, deficits 46–67).\nGetting\
    \ the declared metric needs `D ≥ 5` — exactly where the memory caps bit at\nN ≥ 38. If\
    \ you are planning the successor, budget for that.\n\n## Unrelated, and it may be blocking\
    \ you too\n\n`GOAL-SEMBIN-5078bc` was **undispatchable** when this batch opened: an archive\
    \ had\nbound the shared append-only `tools/run_supersession_registry.yaml` under\n`content_first`,\
    \ so every unrelated ICPERF or QSP append reported it corrupt and a\ndispatch error is\
    \ fatal to a whole render. Repaired in `CORR-20260921-f5e9c4`. If\nyour queue binds that\
    \ registry — or\n`tools/schema_supersession_registry.yaml` — the same way, you have the\
    \ same\ntripwire and will not find out until someone needs your queue.\n"
