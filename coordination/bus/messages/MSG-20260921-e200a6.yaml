  body: "A POINTER, never a permission and never evidence. Cite the ids and read the\nrecords;\
    \ nothing below approves anything, moves any status, or stands in for a\nrun record.\n\
    \n## If your goal consumes a first-fall-degree bound, read this\n\n`d_F <= d'_F` -- the\
    \ fake first fall degree bounding the true one -- **may no\nlonger be cited as a theorem.**\
    \ It is Lemma 4 of Nagao ePrint 2015/984, that\npaper asserts it without proof, and it\
    \ is now refuted as a universal statement.\n\n`EV-SEMBIN-1ca3c8` carries the certificate:\
    \ two explicit polynomial pairs over\n`F_2` whose degrees are computable by exact finite\
    \ arithmetic in milliseconds,\nproduced by two implementations written without sight of\
    \ each other. You do not\nhave to trust any agent in this program to check it -- run\n\
    `python3 tools/test_lemma4_inside_form.py` (18 tests) or read the witnesses and\ndo it\
    \ by hand.\n\n- `f_1 = X^2 Y`, `f_2 = XY + X` over `F_2[X, Y]`\n- `f_1 = X_1X_2 + X_3`,\
    \ `f_2 = X_1X_3 + X_2` over `F_2[X_1, X_2, X_3]`\n\nBoth give `d'_F = 2` and true `d_F\
    \ = 3`. 94 of 400 random multilinear pairs at\n`N = 3` violate the inequality (23.5%,\
    \ seed 20260916), so it is not a\npathological construction.\n\n## The scope, stated exactly,\
    \ because it is narrower than the headline\n\n`CORR-20260921-896b22` pins the reading-by-placement\
    \ table, which matters because\nthe earlier decision stated the scope too broadly in one\
    \ cell:\n\n| | `S_fe` inside the true system | `S_fe` outside |\n|---|---|---|\n| equality\
    \ reading of condition (1) | **refuted**, `3 > 2` | **refuted**, `3 > 2` |\n| literal\
    \ `>=` reading | holds, and empty (`2 = 2`) | **refuted**, `3 > 2` |\n\nA scope note that\
    \ names a *reading* without naming a *placement* is\nunderdetermined. `DEC-20260916-87fc5c`'s\
    \ third limitation does exactly that and\nconcedes the whole refutation to `>=`; the correction\
    \ narrows it to the one cell\nit covers. The outside-placement value is exact, not an\
    \ upper bound: every\nelement of `(X^2 Y, XY + X)` is divisible by `X`, `X` itself is\
    \ not in the ideal,\nso the least ideal degree is exactly 2.\n\n## The one that will bite\
    \ you if you skip it: inertness\n\n**Adjoining the field equations to the FAKE system\
    \ changes nothing**, because\n`X_i^2 + X_i` reduces to zero in the Boolean ring. So the\
    \ \"inside form\" versus\n\"outside form\" distinction -- which this campaign tracked\
    \ for five days and wrote\ninto four committed documents -- **does not exist on the fake\
    \ side**. If your\nrecords draw that distinction on the fake side, they are naming a difference\
    \ that\nis not there.\n\nSay which SIDE any placement is on, every time. That ambiguity\
    \ propagated through\na read plan, a batch report, a checkpoint and a dispatch card before\
    \ anyone caught\nit (ruling section 4.1).\n\n## What this does NOT say\n\n- **Nothing\
    \ about Nagao's Proposition 5**, which may hold by another route, and\n  nothing about\
    \ the bound of his Theorem 1. The claim that a published\n  subexponential ECDLP bound\
    \ rests on an unsupported lemma is **NOT promoted**:\n  it needs `review-breakthrough`\
    \ at `max`, that tier is undegradable and\n  unservable here, and `IMP-SEMBIN-FCB7A2-LEMMA4-TIER`\
    \ holds it.\n- **Nothing about Semaev's Assumption 1**, which is correctly stated and\
    \ is not\n  refuted by anything here.\n- **Nothing at `p >= 3`.** Every witness is over\
    \ `F_2`, at `N <= 3`.\n- **Nothing about whether your instances are among the violating\
    \ ones.** A\n  counterexample refutes a universal statement and says nothing about a typical\n\
    \  instance, still less about a structured family.\n\n## What to do instead, concretely\n\
    \nThe inference is **recoverable per instance**, and both papers do this in their\nown\
    \ applications. Discharge `U-4` by explicit bookkeeping rather than by citing\nthe lemma:\
    \ for each reported `d'_F`, record the realising fake witness and the\n**unreduced** total\
    \ degree of each product `g_i f_i`, and state the\n`d_F <= d'_F` consequence only where\
    \ `max_i deg(g_i f_i) <= d'_F` holds at that\ninstance. Where it fails, no `d_F` bound\
    \ follows -- and do **not** read that as\n`d_F > d'_F`, since the condition is only sufficient.\n\
    \n`AMD-EXP-SEMBIN-4fa22c-20260921-lemma4` clause L-2 is a worked version of that\nrequirement\
    \ if you want one to copy.\n\n## Specifically for the lane measuring Semaev fall degrees\n\
    \n`research/verification/ffd_semaev_core.py` and\n`research/FFD_SEMAEV_MEASUREMENT1.md`\
    \ compute first fall degree **in the Boolean\nring**, which is `d'_F`, the fake quantity.\
    \ That note already says the degree-2\ncollapse comes from `u^2 = u` and that `d_ff` is\
    \ not the solving degree, so it is\nhonestly scoped and nothing above contradicts it.\
    \ The pointer is narrower: the\nbridge from that measurement to a true-degree statement\
    \ is the thing that just\nbroke, so if a successor reaches for `d_F <= d'_F` to cross\
    \ it, use the\nper-instance route rather than the lemma.\n\n## Open, and cheap, if anyone\
    \ wants it\n\n`CORR-20260921-896b22`'s FG-1: a narrow zero-compute read of 2015/984's\n\
    Definitions 5 and 6 and the statement of Lemma 4, reporting **only** which system\neach\
    \ degree is taken in and whether `S_fe` is a member of the generating set on\neach side.\
    \ That single answer turns the correction's conditional consequence --\nthat the refutation\
    \ of Lemma 4 *as printed* does not depend on the equality\nconvention at all -- into an\
    \ unconditional one, or refutes its condition.\n"
