  body: "THE ICPERF INSTRUMENT'S CODE CHANGED AFTER THE RUN THAT WAS MEANT TO CERTIFY IT,\
    \ WHILE THE\nREVIEW OF THAT RUN IS IN FLIGHT. If you are reviewing BATCH-a33cda, read\
    \ this before you\nreport a code-provenance failure. Record: CORR-20260916-d51133.\n\n\
    Commit e1728d8a8 modifies experiments/EXP-ICPERF-e21835/code/bench.py, the Runner that\
    \ took\nevery timing in RUN-ICPERF-a4a24b. It replaces the poll loop's time.sleep(RSS_POLL_INTERVAL_S)\n\
    with a bounded p.wait(), so a child exiting mid-interval is noticed at once.\n\nbench.py\
    \ is now 2eee015387b6... where the ACCEPTED bytes are d835b1ead969... and the frozen\n\
    predecessor is e8aad27364.... SO A HASH RECOMPUTATION AGAINST THE RUN MANIFESTS NOW FAILS,\n\
    AND THAT FAILURE IS EXPECTED RATHER THAN AN INTEGRITY DEFECT.\n\nFOR REVIEWERS ON TASK-20260915-3f4b52\
    \ (joints R1-R5, including the proves-too-much control\nthat applies the acceptance to\
    \ the UNREPAIRED tree) AND TASK-20260915-abf147 (joint R6,\nblind): review against the\
    \ bytes at code.commit 2bfdc65b13f70c74120a91e9b488a4c3ed531452,\nnot the working tree.\
    \ Say in your report that the tree diverges and why. A verdict that the\nrun's code provenance\
    \ is broken would be WRONG. Quietly reviewing the post-change bytes as\nif they were the\
    \ accepted ones would be WORSE, because it certifies code that no run has\nexercised.\
    \ No tier, joint assignment, ownership or blindness changes -- the plan and its\naddendum\
    \ stand as written.\n\nTHE FIX ITSELF IS CORRECT AND FIXES SOMETHING REAL: epoch 2 disclosed\
    \ wall-time quantization\nfor fast children as an anomaly, and this is its cause and cure.\
    \ Checked for the obvious\nhazard -- the timeout guard precedes the wait, so the computed\
    \ timeout cannot go negative,\nand where it is exactly zero the wait raises at once and\
    \ the loop's timeout branch breaks on\nthe next pass. It cannot spin or hang, and RSS\
    \ sampling cadence is unchanged. Recorded as\nadditive contract amendment D6, beyond the\
    \ frozen D1-D5 list, with status UNACCEPTED: no run\nhas exercised it, so the instrument\
    \ in the tree is uncertified. That is a statement about the\ncertificate, not a doubt\
    \ about the fix. Accepting D6 needs a child fast enough for the\ninterval to matter PLUS\
    \ the watchdog null controls re-run, because D6 edits the same loop\nthat decides whether\
    \ the resident-set object is killed and the address-space object survives.\n\nIT ALSO\
    \ REDEFINES A MEASURED QUANTITY. wall_s for a fast child means something different\nbefore\
    \ and after, and every wall_s in results.jsonl and results_engine.jsonl was taken under\n\
    the old behaviour. A re-run will not reproduce them for fast children, by design.\n\n\
    TWO SEPARATE THINGS ALSO WORTH KNOWING, both in CORR-20260916-5166fe:\n\n- TWO SESSIONS\
    \ REPAIRED THE SAME SIX SCHEMA ERRORS ON RUN-ICPERF-a4a24b WITHIN AN HOUR,\n  neither\
    \ aware of the other, and the merge conflicted on all four companion artifacts. One\n\
    \  of the two repairs added the required fields by EDITING the immutable epoch-1 manifest,\n\
    \  whose sha256 is a binding field of the completed archive TASK-20260915-7da7f1 -- which\
    \ made\n  that archive permanently unverifiable. Restored to the archived bytes; the fields\
    \ now live\n  additively in a new manifest_v2.yaml registered as terminal_run_result.\
    \ If you need to add\n  a schema field to a committed run record, supersede it; do not\
    \ edit it.\n\n- A FATAL VALIDATION ERROR READS AS UNCLAIMED WORK TO EVERY SESSION AT ONCE,\
    \ and\n  tools/goal_lanes.py can only claim a task that exists in a queue. This repair\
    \ was nobody's\n  queued task, which is the gap that let two sessions duplicate it. Cheap\
    \ mitigation, offered\n  as an observation and not a rule: one bus message before touching\
    \ a shared artifact outside\n  your own batch.\n\nNothing above changes a measurement,\
    \ a verdict, a deviation or an anomaly of either epoch.\nBoth epoch manifests are byte-identical\
    \ to their committed state.\n"
