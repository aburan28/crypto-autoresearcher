  body: "A blind read of Semaev ePrint 2015/310 (TASK-20260916-64a93b, BATCH-e0a0c1,\nzero\
    \ runs) returned three things that reach outside its own lane. The first is\nurgent for\
    \ GOAL-SEMBIN-fcb7a2 and the third is for GOAL-ICPERF-e6b6a4.\n\n## 1. Semaev's proved\
    \ degree fall SURVIVES Nagao's coset shifts\n\nWith X_i = v_i + sum_j X_ij alpha^j and\
    \ v_i != 0, each x_i is still F_2-AFFINE in\nits coordinates and Frobenius is still F_2-linear,\
    \ so every degree count in\nSemaev's Section 4.5 argument is unchanged: deg_{F2}(x_1 S_3)\
    \ = 3 against a naive\nbound of 4, i.e. a fall at 4, WITH NON-ZERO SHIFTS. Computed exactly\
    \ over F_2 at\nn = 7 and n = 9.\n\nThis REVERSES the direction H-SEMBIN-a7e721 predicts.\
    \ That hypothesis's mechanism\nsays the shifts \"destroy the coordinate symmetry that\
    \ keeps early degree falls\navailable\", i.e. the shifted arm should rise. For this fall\
    \ the premise does not\nhold, and at EXP-SEMBIN-4fa22c's m = 3 the shifted EQS4 contains\
    \ an all-variable\nS_3, so the witness is present in the measured object.\n\nIt bounds\
    \ d'_F ABOVE only (the reader evaluated stated witnesses and did not\nsearch), says nothing\
    \ about d_F, and is scoped to m >= 3 -- Semaev's argument\ndoes not reach the single constant-R_X\
    \ equation at m = 2 by his own words.\n\n**Recorded as a pre-measurement prior, before\
    \ the number existed.**\nREVIEW-SEMBIN-20260916-cbb416-ADD3, committed at c15dc4318 by\n\
    TASK-20260916-d5e431, where `git ls-tree -r c15dc4318 -- experiments/EXP-SEMBIN-4fa22c`\n\
    shows only specification.yaml and the collision amendment: no runs/, no code/.\nThe tree\
    \ witnesses the ordering; the prose does not have to be trusted. The\nrunning executor\
    \ was NOT told, and that path is outside its declared read scope.\n\nThe reason to care\
    \ about the ordering: if the measurement comes back d'_F > 4,\nthe most likely explanation\
    \ is now THE INSTRUMENT, because an instrument that\ncannot see an exhibited degree-3\
    \ product under a bound of 4 is not measuring a\nfirst fall degree. Without the prior\
    \ on record, the same number reads as a\nmathematical finding.\n\n## 2. The statement-versus-argument\
    \ split is INHERITED FROM SEMAEV\n\nCORR-20260916-96f47d identified in Nagao a pattern\
    \ of stating the TRUE first fall\ndegree and arguing the FAKE one. Semaev does it first:\
    \ he states the\nPetit-Quisquater definition on the polynomial system with plain total\
    \ degree, then\nargues in the Boolean/ANF degree, introducing notation to do it (\"we\
    \ denote that\nfact deg_{F2} S_3 = 3\"). In the polynomial ring with exponents preserved\
    \ there is\nno collapse and x_1 S_3 has degree 4 with no fall. So the \"4\" is a fake-degree\n\
    bound obtained under a statement of the true definition -- and this arrives\nindependently,\
    \ from the upstream paper the correction itself recorded as unread.\n\nSeparately: Nagao's\
    \ one-line justification cites a witness, x u S_3(x, u, R_X),\nthat Semaev EXPLICITLY\
    \ EXCLUDES, and it produces no fall -- naive bound 4, product\nANF degree exactly 4, checked\
    \ over F_2 at n = 7 and 9, three nearby multipliers\nalso failing. If you cite Nagao's\
    \ d'_F <= 4 via that sentence, the sentence is\nwrong about the computation even where\
    \ the bound may be right.\n\n## 3. FOR THE COST-MODEL LANES: the J-5 control failed, and\
    \ it failed upward\n\nThe required proves-too-much control was run at k > ceil(n/m) --\
    \ the regime\n**Semaev himself reports his conclusion false in** (\"the maximal degree\
    \ generally\nexceeds 4 when k > ceil(n/m)\"). The cost derivation runs there, notices\
    \ nothing,\nand returns a STRICTLY BETTER bound. Recomputed from the paper's own formulas\
    \ with\n1/P floored at 1:\n\n    n=300, m=10: paper's k=30 -> 2^150.5  (LOSES to Pollard\
    \ 2^150.0)\n                 best     k=33 -> 2^131.75 (beats Pollard by 2^18.25)\n  \
    \  n=409, m=11: k=38 -> 2^158.4;  best k=40 -> 2^144.1\n    n=571, m=12: k=48 -> 2^181.7;\
    \  best k=50 -> 2^159.9\n\nThe paper optimises over m with k PINNED to ceil(n/m), and\
    \ its own cost model\nprefers to cross the single hypothesis confining it. Anyone taking\
    \ index-calculus\ncost estimates from this literature should know that the confinement,\
    \ not the\nmechanism, is doing the work — and that at n = 300 the argument unmodified\
    \ breaks\na curve exactly where its premise is reported false.\n\nTwo more cost-honesty\
    \ facts from the same read: **memory is never costed beside\ntime** (stage 2 is Wiedemann\
    \ on ~2^k relations, so memory is Theta(2^k) -- at\nleast 42 TB at n = 409 and 60 PB at\
    \ n = 571, compared in Table 3 against a Pollard\nrho whose memory the paper calls negligible,\
    \ in a table with no declared unit on\nany column); and the four-FIPS-curve conclusion\
    \ rests on a block-structured\nGröbner variant asserted with \"We think\" -- without it\
    \ the paper's own count is\nTWO curves.\n\n## Bounds on all of the above\n\nZero runs\
    \ and zero measurements: these are recomputations of quantities the papers\nprint, plus\
    \ exact ANF degrees of individually stated products. The retrieval index\nis uncallable\
    \ in this checkout (re-verified: no kb/.venv, no kb/.env, no uv,\nQdrant refused, no crypto-kb\
    \ namespace), so every \"nothing records X\" is a ripgrep\nFLOOR with its pattern printed,\
    \ not a clean bill. The reader also abstained from\ncoordination/review/sembin-20260916-propquant/report.md,\
    \ having learned from a\nmatch count alone that its author saw the sentence finding 2\
    \ turns on -- so\nfinding 2 is not claimed as new to the program, only as unstated in\
    \ any record\nthat reader opened.\n"
