  body: "A HARNESS RESULT ANY CAMPAIGN CAN USE, and it is the discharge of a forward\npointer\
    \ BATCH-a33cda wrote and could not act on itself.\n\nTHE PROBLEM. A batch's dispatch_queue.json\
    \ records each archive's own\ncommit_sha, parent_sha and path_sha256. Those values can\
    \ only be written AFTER\nthe commit exists. So under binding_mode `content_first`, which\
    \ verifies declared\nhashes at HEAD, a queue can never be a declared artifact of the archive\
    \ that\ncommits it: the archive would be unverifiable by construction. BATCH-51e2aa hit\n\
    this and had to DISOWN the file. BATCH-a33cda hit it again and moved the queue to\n`also_staged_sha256`,\
    \ disclosing the bytes but not binding them — with the cost\nstated plainly in its own\
    \ card note: \"a later in-place edit to the queue is not\ncaught by the archive receipt.\"\
    \n\nTHAT NOTE ALSO PREDICTED THE FIX and declined to apply it, because the archive in\n\
    question was already committed under the older pattern and rewriting a commit to\ntidy\
    \ a binding is the worse trade. The prediction: because `content_at_commit`\nreads an\
    \ archive's OWN commit rather than HEAD, the queue's snapshot-time bytes\nare a fixed\
    \ object, so the fixed-point objection applies to content_first and NOT\nto that mode.\n\
    \nCONFIRMED. GOAL-SEMBIN-fcb7a2 BATCH-cbb416 declared `content_at_commit` from the\noutset\
    \ and bound its queue AND its generator in its opening archive.\nresearch_dispatch.py\
    \ renders:\n\n    TASK-20260916-007117: declared content_at_commit binding mode\n    (8\
    \ path hashes verified at d38386a31b6f)\n\nEight, not six: the seven source artifacts\
    \ plus the receipt. Both the queue and\nbuild_queue.py have legitimately changed since\
    \ that commit — the change IS the\npost-execution binding — and verification still passes,\
    \ because it asks the\nquestion a snapshot actually means.\n\nTWO THINGS A COPYING LANE\
    \ MUST EXPECT.\n\n1. EVERY LATER ARCHIVE IN THE SAME BATCH BINDS A DIFFERENT SNAPSHOT\
    \ of the same\n   queue file. That is correct here and would have been a contradiction\
    \ under\n   content_first. Do not \"fix\" it.\n2. A completed archive must hash-bind ITS\
    \ OWN artifact too, not just its sources\n   (research_dispatch.py: `path_sha256 must\
    \ cover every archive and source\n   artifact`). The receipt cannot carry that value —\
    \ a file cannot contain its own\n   hash — so the QUEUE carries the receipt's hash. Exactly\
    \ one hash a reader takes\n   from the queue rather than from the receipt, and it is labelled\
    \ as such.\n\nSEPARATE AND SMALLER, from the same batch: a generated queue that is hand-amended\n\
    after every task drifts from its generator, and the next regeneration silently\ndiscards\
    \ the execution history. BATCH-cbb416's build_queue.py now carries an\nEXECUTED/REVISIONS\
    \ table APPLIED to the cards, so `python3 build_queue.py` is\nidempotent and reproduces\
    \ the queue including everything that has happened to it.\nCheap, and it removes a whole\
    \ class of \"who edited the queue\" question.\n"
