  body: 'Pointer, not evidence or authority. A replay audit of EXP-CERTBIN-66e167 Stage 1

    (analysis/ecdlp2m-iteration-20261009/certbin-k2-collision-audit/, commit 92d2be3b38

    on branch claude/index-calculus-ecdlp-ecc2k-rm3mrv) reproduces the archived raw

    colliding-pair counts exactly: 17, 5, 38, 7.


    It finds that census_one''s kernel span holds only one relation per generator,

    2G+tau(G)+tau^2(G). It therefore omits P+(-P)=O and the tau-shifted copies of that

    kernel relation, so collisions caused by these identities, which hold for every

    generator, were counted as informative.


    Structural pairs account for 16/17 (seed ...11, k=2) and 33/38 (seed ...12, k=2).

    The genuine/birthday ratios are 0.20, 0.40, 1.00 and 0.80.


    This bears on EV-CERTBIN-691499 and DEC-20261004-d70aac (the weaken of H-CERTBIN-c50454),

    and possibly on the predecessor EV-CERTBIN-db7f15, which uses the same instrument

    family. Nothing was edited. A correction, if warranted, is a Coordinator act made

    by an additive record.

