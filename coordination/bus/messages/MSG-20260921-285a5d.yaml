    ROUTE 2, the repository''s own api_direct runtime: REFUSES the role outright. ''python3
    -m orchestration.agent plan --task ledger/handoffs/TASK-20260921-008f2d.yaml'' returns
    ''REFUSED: this runtime cannot provide web_search'', identically on --backend fireworks
    and --backend zai, so the refusal is runtime-level and not backend-level. orchestration/roles.yaml
    lists web_search under idea-generator''s REQUIRED capabilities, with only send_messages
    in optional_capabilities. This is the documented behaviour working as designed -- a role
    whose capabilities the runtime cannot provide is refused outright rather than run with
    a reduced tool surface.


    WHAT I DELIBERATELY DID NOT DO, and why it matters. Three shortcuts were available and
    all three are forbidden. (1) I did not author the ideas myself as Coordinator: an idea
    written by the agent that later approves it destroys the independence the review architecture
    rests on. (2) I did not remove or relax web_search in orchestration/roles.yaml to make
    api_direct accept the role -- that is degrading a role contract to get work moving, the
    same silent-downgrade pattern the model policy forbids, and it would leave every future
    idea record looking properly generated while having been produced without a capability
    the program decided the role needs. (3) I did not run the role on a reduced tool surface.
    This is a terminal infrastructure stop for the ideation stage. Per AGENTS.md core rule
    5 it asserts nothing about any hypothesis and is not negative evidence of any kind.


    WHAT IS NOW DURABLE AND READY. The ideation handoff is authored, validated and committed,
    so the moment subagent provisioning returns it can be dispatched with no redesign. ledger/handoffs/TASK-20260921-008f2d.yaml:
