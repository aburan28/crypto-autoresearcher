review_plan:
  claim_under_review: Narrow runbook orchestration repair preserves native remote claim proof and fail-closed launch
    admission under a main-only remote fetchspec; no research result is under review.
  coordinator_prior: The missing tracking synchronization is a sufficient mechanism for this refusal class; the
    exact historical fetchspec is unknown, and no implementation or validation has yet occurred.
  joints:
  - joint: remote proof, not local fabrication
    assigned_to: TASK-20261021-36e54c
    attack_plan: Read the exact post-push own-branch refspec and containment code. Try unpublished, wrong/tampered
      claim and failed-fetch synthetic controls; require zero supervisor invocations.
  - joint: both ownership paths and failure accounting
    assigned_to: TASK-20261021-36e54c
    attack_plan: Check newly published and reused-live-claim paths, actual local bare-remote/main-only-fetchspec
      regression, failure cleanup, logs, and preservation of original attempt bytes.
  - joint: scope and provenance
    assigned_to: TASK-20261021-36e54c
    attack_plan: Compare frozen source/input hashes and exact changed paths, verify tests use only disposable fixtures,
      identify residual limits and independently rerun focused software tests if lawful.
  required_outputs:
  - coordination/tasks/TASK-20261021-36e54c/review.md
  - coordination/tasks/TASK-20261021-36e54c/findings.json
  scientific_claim_tier: not_applicable_software_only
  maximum_runs: 0
  independent_session_required: true
  proves_too_much:
    objects:
    - id: unpublished-claim
      fixture: Disposable local Git claim commit exists only locally; it is not reachable from the remote own branch.
      known_false_conclusion: The exact task claim has published origin proof.
      required_behavior: Refuse before supervisor invocation; record actual remote fetch and containment outcomes
        without fabricating a tracking ref.
    - id: wrong-or-tampered-claim
      fixture: Disposable published own branch contains a different claim, or the claimed task/owner/epoch/commit
        does not match the exact live claim record.
      known_false_conclusion: The supplied identity is the exact published live claim for this task.
      required_behavior: Refuse before supervisor invocation; HEAD or a different reachable claim must not substitute
        for exact claim identity.
    - id: failed-own-branch-fetch
      fixture: The exact own-branch fetch fails or its source branch is absent, despite prior publication or stale
        local tracking data.
      known_false_conclusion: The required remote synchronization completed successfully.
      required_behavior: Fail closed, retain fetch argv/status/stderr and do not invoke supervisor or fall back
        to local HEAD.
    - id: failed-claim-push
      fixture: Native publication push fails in the disposable fixture.
      known_false_conclusion: The new task claim was successfully published.
      required_behavior: Retain failed publication evidence and refuse before supervisor invocation, including when
        stale tracking information exists.
    failure_signature: Any supervisor invocation, successful admission report, locally fabricated tracking proof,
      or silent continuation on one of these known-false control fixtures is a review failure. Each object must
      have actual synthetic command/status evidence and zero supervisor calls; a missing or inconclusive control
      cannot support holds.
    scope: Prospective software controls only in disposable local repositories; these objects are not executed scientific
      experiments.
