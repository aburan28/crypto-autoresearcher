terminal_verdict:
  classification: "scoped_negative_named_represented_algebra_routes"
  exact_target_label_factor_defined: true
  constructor_inside_frozen_rectangle: false
  standard_routes_restore_b3: true
  surviving_representation_sensitive_exception: true
  statement: >-
    The complete signed component semantics of r_R and
    z_R(T)=gcd(g_I(T),r_R(T)) are exact, and z_R lists exactly the fifth
    occurrence labels extendible to a selected pair-pair relation. Fast gcd and
    label extraction cost B^(1+o(1)) only after r_R modulo g_I is represented.
    Every audited standard represented route constructs or traverses B^3
    target-dependent coordinates, performs B degree-B^2 tests, or assumes the
    residue/common factor. No constructor inside the B^(5/4) total online cap
    is supplied. A gauge-invariant nonlinear or variable-coefficient
    orbit-product locator remains an explicit unproved exception.
  breakthrough_claim: false
  shoup_bound_claim: false
  p1554_allocated: false
  contract_created: false
  experiment_created: false
  run_created: false
  shared_state_edited: false

claim_boundary:
  scoped_to_named_represented_routes: true
  no_unrestricted_lower_bound: true
  not_claimed:
    - "an arithmetic-circuit lower bound"
    - "a Boolean-circuit lower bound"
    - "a data-structure, word-RAM, or cell-probe lower bound"
    - "a coordinate or generic-group lower bound"
    - "a Shoup lower bound"
    - "an ECDLP lower bound"
    - "failure of every special or structured fifth deck"
  preserved_exceptions:
    - "a compact complete-chart arithmetic or Boolean circuit"
    - "a target-local exact data structure"
    - "a randomized exact method with detected and charged failure"
    - "a special pair-deck representation"
    - "a genuinely output-sensitive product-circuit gcd"
    - "the gauge-invariant nonlinear or variable-coefficient orbit-product locator"

frozen_interface:
  group: "G=<P>, a cyclic prime-order subgroup of E(F_p), p>3"
  order_scaling: "N=p^(1+o(1))"
  factor_base_scale: "B=N^(1/5)"
  pair_degree: "n=Theta(B^2)"
  fifth_label_count: "m=Theta(B)"
  pair_setup:
    work: "B^(2+o(1))"
    retained_state: "B^(2+o(1)) words"
    provenance: "ordered signed source labels, branch data, dyadic ancestors, and backpointers"
  fifth_algebra:
    labels: "distinct public occurrence labels t_a in F_p"
    polynomial: "g_I(T)=product_(a in I_5)(T-t_a)"
    algebra: "A_I=K[T]/g_I(T)=Map(I_5,K)"
  target_freshness: "R occurs in no preprocessing coefficient, table, seed, or pointer."
  setup_cap: "B^(9/4+o(1)) time and retained words"
  total_online_cap: "B^(5/4+o(1)) time and workspace, including all replay calls"

complete_chart:
  curve: "Y^2 Z=X^3+a_E X Z^2+b_E Z^3 with O=[0:1:0]"
  charts: ["finite", "infinity"]
  exact_selectors:
    zero_test: "eq(d)=1-d^(p-1) on component values in F_p"
    inverse: "inv0(d)=d^(p-2), used only under a nonzero-denominator mask"
    branches: ["left identity", "right identity", "vertical", "tangent", "secant"]
    order_two_rule: "P=Q with y=0 belongs to the vertical branch and returns O"
  signed_key:
    field: "K=F_p[theta]/h(theta), with h irreducible cubic"
    finite: "kappa([x:y:1])=x+theta*y"
    infinity: "kappa(O)=theta^2"
    property: "injective on E(F_p) by the basis 1,theta,theta^2"
  multiplicity: >-
    Pair endpoint multiplicity is retained in the effective divisor, while
    every ordered source occurrence remains in a separate labelled sidecar.
  coefficient_completeness: >-
    Branch masks and interpolation define every component coefficient in the
    split algebra, including tangent, vertical, identity, infinity, repeated,
    and nonreduced cases. This semantic fact does not provide a low-cost dense
    target-dependent coefficient constructor.

exact_object:
  pair_polynomials:
    H12: "product_(u occurrence in D12)(U-kappa(u)) in K[U]"
    H34: >-
      product_(v occurrence in D34)(U-kappa(R-A_I(T)-v)) in A_I[U], with
      every subtraction evaluated by the complete chart
  residue: "r_R(T)=Res_U(H12,H34) mod g_I(T)"
  target_factor: "z_R(T)=monic gcd_K[T](g_I(T),representative(r_R(T)))"
  component_identity: >-
    r_R(t_a) is, up to the fixed resultant sign, the product over labelled
    u,v of kappa(u)-kappa(R-a-v).
  exact_biconditional: "r_R(t_a)=0 iff some labelled u,v satisfy u+v+a=R"
  output_identity: "z_R(T)=product_(extendible a)(T-t_a)"
  no_relation_certificate: "z_R=1"
  all_labels_extendible: "z_R=g_I"
  multiplicity_boundary: >-
    z_R is squarefree in fifth occurrence labels and does not encode the number
    of pair-pair rows; labelled replay recovers one row.

coordinate_free_cross_check:
  module: >-
    M_R=pi_* O_(D12 intersection D34^R), the finite scheme-theoretic
    intersection module over Spec(A_I).
  support: >-
    The component (M_R)_a is nonzero exactly when the two effective divisors
    intersect for fifth label a.
  fitting_ideal: >-
    Fitt_0(M_R) has zero component on extendible labels and unit component on
    nonextendible labels, so in the split algebra it is generated by z_R mod g_I.
  consequence: >-
    Tangency and nonreduced intersection length cannot create a false label;
    they change module length but not support.
  cost_boundary: >-
    A standard finite or Sylvester presentation has row or degree scale n over
    the width-m algebra, exposing n*m=B^3 base-field coordinates. The support
    theorem is not a compact presentation algorithm or lower bound.

represented_route_ledger:
  notation: "P,S,Q,W are preprocessing, retained state, online work, and online workspace exponents in B."
  routes:
    - route: "componentwise resultants"
      p_s_q_w: "2/2/3/2"
      obstruction: "m degree-n tests; all m are nonzero on the no-relation control"
    - route: "quotient-ring resultant"
      p_s_q_w: "2/2/3/3 explicit"
      obstruction: "degree n over width-m A_I has n*m represented slots"
    - route: "multipoint and remainder trees"
      p_s_q_w: "2/2/3/2 before residue; 2/2/1/1 after residue"
      obstruction: "fast reduction consumes supplied coefficients and does not construct r_R"
    - route: "transposed or truncated resultants"
      p_s_q_w: "2/2/3/2"
      obstruction: "favorable soft-O(kd) with k=m and d=n is B^3"
    - route: "structured Sylvester or Cauchy displacement"
      p_s_q_w: "2/2/3/2..3"
      obstruction: "the split blocks or generators retain n*m scalar coordinates"
    - route: "modular composition or power projection"
      p_s_q_w: "2/2/3/3"
      obstruction: "represented algebra dimension or coefficient-ring bit width retains n*m"
    - route: "half-gcd, regular subresultants, or dynamic splitting"
      p_s_q_w: "2/2/3/2 before residue; 2/2/1/1 after residue"
      obstruction: "a no-relation query is a unit in every split component and supplies no early split"
    - route: "subresultant or provenance forest"
      p_s_q_w: "root Q=3; propagation output-sensitive only after root factor"
      obstruction: "replay does not construct the root residue/common factor"
    - route: "generic compact-circuit factor extraction"
      p_s_q_w: "unproved"
      obstruction: "preserved outside the scoped negative"
  bit_cost: "Multiply word exponents by B^o(1) for log(p) and log(B) bits."

favorable_orbit_mutation:
  fifth_deck: "A_j=A_0+[j]T for 0<=j<B; the other four decks remain generic"
  status: "heuristic_model_bound_novelty_unverified"
  expected_coverage: >-
    Under the random-endpoint heuristic, B^4 generic four-deck tuples and B
    orbit shifts give constant expected target coverage; correlation and row
    rank are unproved.
  explicit_route: "B translated endpoints for each of n pair occurrences cost n*B=B^3"
  optimistic_factorial_control: >-
    Even granting a supplied polynomial- or rational-recurrence
    baby-step/giant-step batching into B^(1/2+o(1)) represented blocks, the
    degree-n payload costs n*B^(1/2+o(1))=B^(5/2+o(1)), before reporting and
    replay. The cited recurrence theorem does not construct the needed elliptic recurrence.
  rejected_subroutes:
    - "explicit translated endpoints"
    - "one dense degree-n divisor per shift"
    - "constant-coefficient short translated-x recurrence"
    - "supplied elliptic-net terms without zero localization"
    - "a scalar whole-interval product without charged label/source replay"
  surviving_exception: >-
    An oracle-free, gauge-invariant nonlinear or variable-coefficient
    elliptic-net or division-polynomial operation that returns z_R or exact
    dyadic subinterval unit products from compact pair trees within the total cap.

source_replay:
  requirement: "the constructor is subset-stable for every admitted dyadic child restriction"
  calls: "at most 2*sum_i ceil(log_2 |I_i|)+O(1)=O(log B)"
  accounting: "every positive and negative call is charged inside the online cap"
  final_check: "add the five singleton signed points with the complete law and verify the sum equals R"

conditional_complete_path:
  status: "conditional_only"
  assumptions:
    - "one subset-stable constructor with total replay cost B^(5/4+o(1))"
    - "constant verified relation and target success density"
    - "Theta(B) independently ranked five-sparse relation rows"
    - "factor-log solve and scalar-multiplication verification"
    - "identical scalar-blind masked-target descent"
  setup: "B^(2+o(1)) work and state"
  relation_campaign: "B targets times B^(5/4+o(1)) = B^(9/4+o(1))"
  sparse_linear_algebra: "B^(2+o(1)) work and B^(1+o(1)) live vector state"
  descent_query: "B^(5/4+o(1)) including failures and replay"
  exponents:
    time_lambda: "0.45"
    memory_mu: "0.40"
  missing:
    - "the constructor"
    - "relation density"
    - "independent rank"
    - "factor-log completion"
    - "blind descent"

operation_level_dedup:
  owner: "P1513/ECDLP-IDEA-121 compact common-factor and source-jet locator"
  mechanism: "compact B^2 pair products -> nonlinear common-factor locator -> exact restricted source replay"
  controls:
    - "IDEA-063: remainder/subresultant propagation after a root factor exists"
    - "IDEA-071: supplied Cauchy/displacement determinant reporting"
    - "IDEA-199: endpoint coefficient access followed by source unranking"
    - "IDEA-266: dynamic splitting after a represented source algebra exists"
    - "IDEA-322: supplied target-shift resolvent and backsolve"
    - "P1540: elliptic-net constant-recurrence and translated-pole control"
  new_idea_owner_allocated: false

exactly_one_next_action: >-
  Obtain an independent theorem-only red-team audit of the compact fifth-orbit
  exception. Require an oracle-free, gauge-invariant construction of r_R modulo
  g_I or exact dyadic subinterval unit products inside the total
  B^(5/4+o(1)) online cap, with no degree-B^2 target vector, B^3 translated
  endpoints, supplied orbit-resultant terms, or unpaid source replay; otherwise
  preserve the exception without a run.

