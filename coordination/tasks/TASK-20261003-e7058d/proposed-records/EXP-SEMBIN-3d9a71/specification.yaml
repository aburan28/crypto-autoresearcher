  heuristic_as_stated:
    source: ledger/hypotheses/H-SEMBIN-c7e1d4.yaml
    source_locator: "hypothesis.heuristic_assumptions[id=HEUR-HARVEST-FV-1, restatement_version 2]; formal_statement lines 371-403; falsification_condition lines 438-444"
    source_sha256: null
    source_sha256_note: >-
