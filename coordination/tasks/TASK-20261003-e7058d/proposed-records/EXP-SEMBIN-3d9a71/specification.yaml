      binding is an approval precondition (R6 X1).
    quoting_note: >-
      The lines are copied verbatim without the file's YAML indentation. In
      the record they are folded scalars, so the field value is these lines
      joined by single spaces. "t" in the polynomials is the Frobenius trace,
      written mu = (-1)^(1-a) elsewhere in this contract.
    preamble_verbatim_lines_371_378: |
      Fix (n, E, <P>, V): E/F_{2^n} a binary curve with n prime, <P> of prime
      order l with cofactor h in {2, 4}, V an F_2-subspace of F_{2^n} of
      dimension D, and F = F_V = {Q in <P> : x(Q) in V}, which is
      negation-closed. Let Gamma = <-1>, or Gamma = <-1, pi> on a Koblitz
      curve with sigma-stable V (then F is also pi-closed and pi acts on <P>
      as [lambda]). Let F* be a uniform union of the same number of distinct
      Gamma-orbits of <P> \ {O} as F (size matched to the REALISED |F_V| per
      V, never to 2^D/h). Targets R are uniform in <P>.
    clause_a_verbatim_lines_379_392: |
      (a) TWO-SUM CONFIGURATIONS. Let Z4(L) be the number of Gamma-classes of
      4-element subsets {u1, u2, u3, u4} of L with u1 + u2 + u3 + u4 = O and
      no inverse pair, and Z3(L) the number of Gamma-classes of zero-sum
      multisets {t, t, u, v} (t, u, v distinct, no inverse pair). On Koblitz
      lists with sigma-stable V, exclude from Z3 the two structural families
      inside each orbit, from X^2 - tX + 2 and from
      (X + t)(X^2 - tX + 2) = X^3 + X + 2t, and report their count
      separately. CLAUSE: (Z4(F), Z3(F)) and (Z4(F*), Z3(F*)) have the same
      distribution. The raw count N_2 = sum_{g != O} C(r(g), 2) over
      2-element subsets satisfies N_2 = 6 Z4 + 2 Z3 on negation-closed lists
      (Gamma = <-1>), with clumps of 6n on pi-closed lists, so N_2 is
      compound Poisson and is reported, not tested against a Poisson law.
      Poisson(mu) with mu ~ |F|^4/(48 l) (Z4, ordinary) is a REFERENCE only;
      every constant comes from the null sample.
    scope_verbatim_lines_397_403: |
      SCOPE. "Fix V" is read as V uniform among D-dimensional subspaces
      (a-rand). Structured V (polynomial-basis windows; sigma-stable V; V
      inside ker Tr) are separate cells, each its own claim. The
      sigma-stable Koblitz sub-clause applies only where a testable cell
      exists. On the n-grid {31, 37, 41, 43, 47} none is expected
      (VAL-20261003-17b1e4 JR3-B7, toy scratch), so that sub-clause is
      UNTESTED until a design supplies one.
    falsification_condition_verbatim_lines_439_444: |
      At a tested cell, with every gate passing, the positive controls
      flagged, and the null passing a split-half null-versus-null
      calibration (not a Poisson fit): a two-sample departure of Z4 or Z3 of
      F_V from the closure-matched null at Bonferroni-corrected p < 10^-3
      over a multiplicity count frozen before any run. Any tail check uses
      the null-calibrated compound law.
    quantifiers:
      curves: >-
        FOR ALL binary E/F_{2^n}, n prime, <P> of prime order l, h in {2, 4}.
        Tested at n in {31, 37, 41, 43, 47}: ordinary roles O4a and O4b
        (A = 0, h = 4) and O2 (A = 1, h = 2) per n, plus the Koblitz curve
        (n = 41, a = 0) if admitted at S0-3.
      V: >-
        a-rand: V uniform among D-dimensional subspaces, CONDITIONED ON
        |F_V| > 0 (R6 X7; ambiguity B7). Structured class tested: polynomial
        windows (arm W, a separate claim). Structured classes UNTESTED:
        sigma-stable V, and V inside ker Tr (B8).
      D: an integer per (n, h), per the cell table.
      closure_group: >-
        Gamma = <-1> in every cell of this contract. That covers ordinary
        curves and Koblitz curves with non-sigma-stable V. Gamma = <-1, pi>
        arises only for sigma-stable V, which is not tested.
      null_list: >-
        A union of |F_(V_i)|/2 distinct +-orbits of uniform r in [1, l-1],
        matched per V_i to the REALISED size.
      reading_of_same_distribution: >-
        Size-conditional, per marginal (B6, B9). Given the realised size s, Z4
        (and separately Z3) under V uniform with |F_V| = s has the same law as
        under F* of size s. This is exactly stratum exchangeability.
      direction: two-sided (B5)
      tolerance: none stated (v1 A7, carried); the operative tolerance is this contract's reported rho_90
    statement_issues:
      location: DESIGN.md section 2.2 (B1 to B9) and section 2.3 (A1 to A11)
      v1_issues_disposition:
        A1: resolved by version 2 (Z4 and Z3 decide; N_2 reported only)
        A2: "resolved by version 2 (2-subsets; the old {a, a} identity is the family-1 Z3 multiset)"
        A3: resolved by version 2 (Gamma-classes plus the explicit family exclusion); moot here
        A4: resolved by version 2 SCOPE (a-rand; structured V are separate claims)
        A5: resolved by version 2 (realised size)
        A6: resolved by version 2 (Z3 explicit; constants from the null)
        A7: carried forward (tolerance = reported rho_90)
        A8: resolved by version 2 (null-calibrated tail law)
        A9: carried forward as B5 (two-sided)
        A10: carried forward as TA-1 (by assumption)
        A11: resolved by version 2 SCOPE (sigma-stable sub-clause UNTESTED)
      new_issues_in_version_2:
        B1: "R_2 is not defined in version 2 although R6 X2 cites it. Here R_2 := Z4 + Z3, reported only. Minor."
        B2: >-
          The exclusion is silent on pi-related triples in lists that are not
          pi-closed (KR). As filed, they count in Z3. The decision on KR uses
          raw Z3; structural and excluded counts are reported; a falsification
          carried only by structural configurations is labelled
          FALSIFIED-STRUCTURAL. Proposed restatement: classify on every Koblitz
          list, exclude only when Gamma contains pi, and report.
        B3: >-
          Curve-specific accidental intra-orbit relations (f(lambda) = 0 mod l,
          f(pi) != 0) are not addressed. They matter for the sigma-stable case
          only. Proposed: exclude all intra-orbit configurations and report
          which are structural.
        B4: >-
          The N_2 identity on pi-closed lists, in Gamma = <-1, pi> classes, is
          N_2 = 6n Z4 + 2n Z3_raw, equivalently 6n Z4 + 2n Z3_excl + 2|F|.
          Version 2 states the <-1> form only. Sigma-stable case only.
        B5: Direction not stated; read as two-sided.
        B6: >-
          The CLAUSE states the joint law; the falsification condition is
          marginal. The marginals are tested; a departure in dependence only
          is not resolved.
        B7: The case |F_V| = 0 is not covered; the tested law is conditioned on |F_V| > 0.
        B8: >-
          "V inside ker Tr" is a separate claim, yet it occurs within a-rand
          with probability about 2^-D. Such draws stay in the a-rand sample
          and are flagged. The ker-Tr class is UNTESTED as its own cell. W
          may be largely inside ker Tr (DESIGN.md section 3.4).
        B9: '"Same distribution" read size-conditionally (stratum exchangeability).'
      blocking: none of B1 to B9 blocks this test

