  # ---------------------------------------------------------------------------
  definitions:
    field: >-
      F_(2^n) = F_2[z]/(f_n), where f_n is the least irreducible trinomial
      z^n + z^k + 1, else the lexicographically least irreducible pentanomial.
      Irreducibility: z^(2^n) = z mod f_n and f_n(0) = f_n(1) = 1, which is
      sufficient for prime n. f_n is recorded per n.
    ordinary_curve: >-
      y^2 + x y = x^3 + A x^2 + B. A = 0 for the h = 4 roles and A = 1 for
      h = 2. B is drawn by a SHA-256 counter DRBG under the label
      EXP-SEMBIN-3d9a71|curve|<n>|<role>|<attempt>, with B not in F_2. #E is
      computed by BSGS, required unique and confirmed on 20 points. ACCEPT
      iff #E = h l with l proved prime by complete trial division. O4a and
      O4b are the first two acceptances with A = 0; O2 is the first with
      A = 1. CAL-13 (A = 0) and CAL-19 (A = 1) are selected the same way under
      role CAL.
    koblitz_curve: >-
      E_a: y^2 + x y = x^3 + a x^2 + 1, mu = (-1)^(1-a). #E is computed by the
      Lucas sequence (V_0 = 2, V_1 = mu, V_k = mu V_(k-1) - 2 V_(k-2),
      #E = 2^n + 1 - V_n) and cross-checked by BSGS on 10 points. ADMISSIBLE
      iff #E/h is proved prime. Every (n, a), n in {31, 37, 41, 43, 47}, a in
      {0, 1}, is tested at S0-3.
      Scratch (VAL-20261003-17b1e4 JR3-B7, not verified here): only (41, 0) is
      admissible, with l = 549756390943.
      KR family frozen: (41, 0). Any other admitted (n, a) runs REPORTED-ONLY
      (outside the family; it can neither falsify nor pass; a raw
      p <= 3.70e-6 routes to the Coordinator as a signal outside the frozen
      family). If (41, 0) is not admitted, KR is empty and m_max is unchanged.
      Koblitz calibration curves: KCAL-13 (a = 0, h = 4), KCAL-17 (a = 1,
      h = 2), KCAL-23 (a = 0, h = 4); scratch l = 2003, 65587 and 2095853
      respectively, recomputed by G8.
    generator_and_subgroup: >-
      P = [h]R != O with [l]P = O. Membership in <P> is DEFINED by [l]Q = O.
      Halving-trace filters may be used only if they agree with [l]Q = O on
      every element at calibration curves and on a 1% sample elsewhere (G6).
    frobenius_eigenvalue: >-
      Koblitz only. lambda is the root of lambda^2 - mu lambda + 2 = 0 mod l
      with pi(P) = [lambda]P, where pi(x, y) = (x^2, y^2). lambda^n = 1 mod l.
    V_distributions:
      random: >-
        A D x n bit matrix from the DRBG (label EXP-SEMBIN-3d9a71|<cell>|V|<i>),
        accepted iff of rank D. Duplicates within a cell are rejected and
        logged. On KR, a sigma-stable V is rejected and logged (it has
        probability about 0 at these D).
      window: "W_s = span{z^s, ..., z^(s+D-1)} in the polynomial basis of f_n, every s = 0..n-D with |F_V| > 0"
      tested_law: "uniform among D-dimensional subspaces, CONDITIONED ON |F_V| > 0 (W: all windows with |F_V| > 0)"
    factor_base: >-
      F_V = {Q in <P> : x(Q) in V}. Built by enumerating x in V \ {0}, testing
      curve membership by the trace condition, solving y by the half-trace,
      keeping both y, and testing [l]Q = O. A V with |F_V| = 0 is SKIPPED,
      logged with its label, and replaced by the next index. The skip rate per
      cell is reported (R6 X7).
    trace_geometry_record: >-
      Per V (secondary, RT-20261003-24c995 O9): class T1 if V is inside
      ker Tr, else T0; Tr(A); h; |F_V|; |F_V|/(2^D/h); the count of x in V
      that are x-coordinates of points of E; and the count of those lying in
      2E. Scratch expectations: T0 ratio about 1; T1 with h = 2 gives an empty
      factor base (skipped); T1 with h = 4 gives a ratio about 2. Reported,
      never decided.
    statistic:
      r: "r_L(g) = #{ {a, b} : a, b in L, a != b, a + b = g }"
      N_2: "N_2(L) = sum over g != O of r_L(g) (r_L(g) - 1) / 2; computed by sorting all 2-subset sums as 64-bit keys"
      Z3: >-
        +-classes of zero-sum multisets {s, s, u, v}, s, u, v distinct, no
        inverse pair. It has two routes that must agree (G9). Closed form:
        (1/2) sum over s in L of [ r_L(-2s) - 1{-3s in L} ]. Enumeration: for
        each s and u, test -2s - u in L. On ALL arms the DECISION Z3 is this
        raw count (on KR by B2).
      Z4: "(N_2 - 2 Z3) / 6, a non-negative integer (G9); +-classes of zero-sum 4-sets with no inverse pair"
      R_2: "Z4 + Z3; reported only (B1)"
      Z3_struct: >-
        Koblitz curves only. The number of Z3 configurations matching family
        F1 {w, w, [lambda^2]w, -mu[lambda]w} or family F2
        {w, w, mu[lambda^3]w, mu[lambda]w}, where w is the doubled element.
        Zero on ordinary curves.
      Z3_excl: "Z3 - Z3_struct; reported"
      identity_note: >-
        N_2 = 6 Z4 + 2 Z3 exactly on negation-closed lists without O (DESIGN.md
        section 3.1; inherited from v1 A1; checked by G1 and G9).
      structural_identities_every_list: "sum over g of r(g) = C(|L|, 2); r(O) = |L|/2; r(g) = r(-g)"
      point_path_key: >-
        (x(g) << 1) | b(g), where b(g) is bit j of y(g) and j is the index of
        the lowest set bit of x(g). This separates g from -g = (x, x + y).
    koblitz_structural_families:
      derivation: DESIGN.md section 4.2 (scratch, single session; checked by G16)
      statement: >-
        For an intra-orbit configuration with polynomial f (minimum exponent
        normalised to 0), f(pi) = 0 in Z[pi] iff (X^2 - mu X + 2) divides f in
        Z[X]. There is no Z4 solution: f(0) = +-1 is odd, while X(X+1) divides
        f mod 2. The Z3 solutions are exactly f = +-(X^2 - mu X + 2) (F1) and
        f = +-(X^3 + X + 2 mu) = +-(X + mu)(X^2 - mu X + 2) (F2).
      count_per_full_orbit: "Z3_struct = 2n +-classes (n per family); structural N_2 = 4n; Z4_struct = 0"
      accidental: >-
        f(lambda) = 0 mod l with f(pi) != 0, curve-specific, identical in every
        orbit. Enumerated exhaustively by G16 and recorded. Scratch
        expectation about n^3/l (about 6e-5 at n = 41).
      application_here: >-
        Version 2 excludes the families only on sigma-stable lists, and none is
        tested. On KR the decision Z3 is raw; Z3_struct and Z3_excl are
        reported; T3 on Z3_excl is computed and reported. The exclusion is
        exercised on gate lists (G3, G16, C-PLANT).
    null_list: >-
      Stratum i holds lists j = 0..M, where j = 0 is the PLACEBO and j = 1..M
      are REFERENCES. M = 6 (arm W: M = 20). Split-half halves: A = {1..M/2},
      B = {M/2+1..M}. Each list is a union of |F_(V_i)|/2 distinct orbits
      {r, -r}, r uniform in [1, l-1] (label
      EXP-SEMBIN-3d9a71|<cell>|null|<i>|<j>), with repeated orbits rejected.
      Lists are counted in Z/l (integer path). At least 5 reference lists per
      cell also go through the point path (G4).
    reference_formulas_sanity_only: >-
      |F|^4/(48 l) for Z4 and |F|^3/(4 l) for Z3 enter ONLY the N-SCALE band
      [0.5, 2], never a prediction or decision.

  # ---------------------------------------------------------------------------
  cells:
    rule: >-
      lambda-grid cells: h = 4 curves take D with e = 4D - n - 9 in
      {-2, 0, 2, 4, 6}; h = 2 curves take D with e = 4D - n - 6 in
      {-1, 1, 3, 5}; lambda_nom = 2^e (scratch). W uses the (n, D) of O4a and
      O2. KR uses the O4 D-set at n = 41. D3 takes D with mu3 = |F|^3/(4 l) in
      [1, 4] (h = 4: 2^(3D-n-6); h = 2: 2^(3D-n-4)) on O4a and O2 at
      n in {31, 37, 41}.
    table: |
      O4 (O4a and O4b; 12 cells each = 24)   n  D  e   |F|    N_V   E4    E3
                                             31 10  0  2^8    300   50   2.3
                                             31 11  4  2^9     30   80   1.9
                                             37 11 -2  2^9   1200   50   1.2
