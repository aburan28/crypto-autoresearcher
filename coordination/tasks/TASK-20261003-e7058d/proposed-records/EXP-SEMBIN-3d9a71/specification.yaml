                    O2   41 15 2^14  2^13      1365   1    60   81920   60
      C = 24 + 10 + 22 + 3 + 6 = 65 in-family cells
    grid_coverage: >-
      Every lambda-grid value occurs at two or three n in the ordinary arms.
      KR is single-n; its reading is scoped to n = 41. D3 stops at n = 41
      because n >= 43 needs |F| of about 2^15 (2^29 keys), beyond the 4 GB
      envelope. D3 is severable: if declined at approval, re-draft with
      m_max = 244.
    v3_weak_arm: >-
      OPTIONAL. ECC2K-130: y^2 + xy = x^3 + 1 over F_2[z]/(z^131 + z^13 + z^2
      + z + 1), #E = 4 l, l = 680564733841876926932320129493409985129, read by
      the executor from inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md
      lines 1093-1098, HALTING the arm on any disagreement. D = 16, 3 random V
      (not sigma-stable, since ord_131(2) = 130). Not in the Bonferroni family.

  independent_variables:
    - arm (O4, O2, W, KR, D3; V3 optional)
    - curve (role per n; Koblitz a)
    - n and D (hence nominal lambda_2 and mu3)
    - V index within the cell (and its trace class)
    - list role (F_V, reference j, placebo, AP, GAP, SID4, SID3, planted, SENS pseudo-V)

  # ---------------------------------------------------------------------------
  sample_sizes:
    rule: >-
      lambda-grid random-V cells (O4, O2, KR): N_V = max(30, ceil(300/lambda_nom)),
      M = 6. D3: N_V = max(30, ceil(60/mu3)), M = 6. W: N_V = the number of
      windows with |F_V| > 0, M = 20. Plus one placebo list per stratum.
      Controls: AP and GAP use 30 strata per lambda-grid cell and 10 per D3
      cell, each with 6 matched nulls. SID4 uses N_V lists, capped at 300, at
      cells with lambda_nom >= 2^2 and at D3. SID3 uses 30 lists per D3 cell.
    power_formula: >-
      Scratch, normal approximation, for sizing only (decisions are exact).
      delta_90 = (z_(alpha'/2) + z_0.9) (M+1)/(M sqrt(E)) with
      alpha' = 10^-3/270 = 3.70e-6 two-sided, z = 4.63, z_0.9 = 1.28. That is
      6.89/sqrt(E) at M = 6 and 6.20/sqrt(E) at M = 20. Excess rho_90 =
      1 + delta_90; deficit resolvable to rho <= 1 - delta_90 when that is
      positive.
    table_Z4: |
      lambda_nom  N_V   E4      rho_90 excess  rho_90 deficit           P(Z4=0) per null list
      2^-2        1200  50      1.98           near-total absence only  0.959
      2^-1        600   50      1.98           near-total absence only  0.920
      2^0         300   50      1.98           near-total absence only  0.846
      2^1         150   50      1.98           near-total absence only  0.717
      2^2         75    50      1.98           near-total absence only  0.513
      2^3         38    51      1.97           near-total absence only  0.264
      2^4         30    80      1.77           <= 0.23                  0.069
      2^5         30    160     1.55           <= 0.45                  0.005
      2^6         30    320     1.39           <= 0.61                  ~2e-5
      D3          30-60 1e4-8e4 1.024-1.068    0.93-0.98                0
    table_Z3: |
      lambda-grid cells (all arms): E3 <= 2.3 per cell; gross only
        (exact Poisson tail: E3 ~ 2 gives rho_90 ~ 8; E3 ~ 0.3 gives rho_90 ~ 30)
      D3 cells: E3 = 120 gives rho_90 1.63 (deficit <= 0.37); E3 = 60 gives rho_90 1.89 (deficit <= 0.11)
    pooled: >-
      Arm-pooled rho_90 (excess, scratch). Z4: O4 1.14 (E4 2460); O2 1.26
      (722); W 1.17 (1279 nominal, trace-unadjusted; recomputed from the null
      at S0-3); KR 1.34 (420); D3 1.012 (317440). Z3: D3 1.31 (E3 480); O4
      about 2.5 (E3 21); O2 about 3.7 (6.5); W and KR gross only.
    at_lambda_2_minus_2: >-
      CAN detect: a uniform Z4 excess of at least 2x per cell (about 1.14
      pooled over O4); a near-total absence of Z4; a V-subpopulation at
      density of at least about 1% with a large excess (MX4, KS4). CANNOT
      detect: any deficit short of near-total; V-classes rarer than about
      1/1200 (including V inside ker Tr at 2^-11 to 2^-12); any Z3 effect
      short of about 10x (E3 0.6 to 1.2); anything about the dense-regime
      constant beyond what D3 measures at n <= 41.
    why_M_6: "M must be even for the split-half; the variance factor 7/6 is close to v1's 6/5; the null is cheap in Z/l"
    v1_comparison: >-
      v1: M = 5, m_max = 345, delta_90 = 7.15/sqrt(E); KS arm and up to 22 KR
      cells; Z3 had no resolving cells. v2: M = 6, m_max = 270,
      delta_90 = 6.89/sqrt(E); KS dropped; 3 KR cells; D3 added for Z3.

  # ---------------------------------------------------------------------------
  controls:
    - id: C-NULL
      card_item: (i)
      what: >-
        The matched null (section definitions.null_list). N-SCALE: mean null
        Z4 over mean |F|^4/(48 l) in [0.5, 2] at every cell, and mean null Z3
        over mean |F|^3/(4 l) in [0.5, 2] at D3 cells (counter sanity only).
        SPLIT-HALF (SH): per cell, halves A and B compared by T4, T3 and KS4
        within strata. GU: global uniformity of the randomised SH-T4 and
        placebo-T4 p-values. PLACEBO: list j = 0 run as "V" through T4, T3,
        KS4, MX4 and the pooled tests.
      required: >-
        N-SCALE in band at every cell. SH: every SH p >= theta_SH = 5.13e-6
        (frozen); a single failing cell is INCONCLUSIVE for that cell, and two
        or more make the run INCONCLUSIVE. GU: both one-sample KS p >= 5e-4
        (frozen). PLACEBO: no test at raw p <= 3.70e-6.
      blocking: true
    - id: C-AP
      card_item: (ii)
      what: >-
        F_AP = {+-jP : 1 <= j <= k}, k = (median |F_V| of the cell)/2, plus
        random dilates {+-jsP}, run as a pseudo-cell (30 strata at
        lambda-grid cells, 10 at D3 cells), each stratum with 6 matched
        nulls. One AP list per cell goes through the point path.
      required: >-
        T4 AND T3 at Bonferroni-corrected p < 10^-6 (raw p <= 3.70e-9) at
        every admitted random-V cell. All dilates give identical (Z4, Z3),
        equal to an independent integer count (G5).
      blocking: true
    - id: C-GAP
      card_item: (vi)
      what: >-
        Rank-2 GAP {+-(i g1 + j g2)P : 1 <= i <= L1, 1 <= j <= L2},
        L1 L2 = k, with g1 and g2 random. On KR, g2 = lambda g1 (the Frobenius
        GAP). 30 or 10 strata as for AP.
      required: T4 AND T3 at corrected p < 10^-6 at every admitted random-V cell
      blocking: true
    - id: C-SID
      card_item: (vi)
      what: >-
        SID4: alteration-built lists (remove an orbit from each configuration;
        refill by rejection, accepting a fresh orbit only if it creates no new
        configuration; at most 10^4 iterations), with Z4 = 0 at lambda-grid
        cells with lambda_nom >= 2^2, and Z4 <= floor(mu_hat4/2) at D3 cells.
        SID3: lists with Z3 = 0 at D3 cells, built the same way. If a list
        cannot be built within the iteration cap, the control is recorded NOT
        BUILT at that cell.
      required: >-
        SID4: T4 lower tail at corrected p < 10^-6 at each required cell.
        SID3: T3 lower tail at corrected p < 10^-6 at each D3 cell. NOT BUILT
        makes PASS unavailable at that cell; it is not INVALID.
      blocking: true
    - id: C-PLANT
      card_item: (iii)
      what: >-
        Null lists with k_inj in {1, 2, 5, 20} injected parallelograms
        {u, u+v, u+w, u+v+w} with negations (Z4 += 1, N_2 += 6), and Z3
        triples {s, u, -2s-u} with negations (Z3 += 1, N_2 += 2). On the KR
        curve and the KCAL curves also: (i) one planted F1 triple
        {w, [lambda^2]w, -mu[lambda]w} with negations in a <-1> list
        (Z3_raw += 1, Z3_struct += 1, Z3_excl += 0, decision-Z3 += 1); (ii)
        one full <+-lambda>-orbit (expectation as in G3). Integer and point
        paths everywhere; brute force where |L| <= 48.
      required: >-
        Counters equal the exact independent recount (and brute force where
        available). Increments equal the injected numbers, except for
        accidental extras that the recount identifies and records.
      blocking: true
    - id: C-SENS
      card_item: (vi)
      what: >-
        200 resampled pseudo-cells per random-V cell. In each stratum one of
        the M+1 null values is the pseudo-V, with Poisson((rho - 1) mu_hat4)
        injected Z4 configurations (N_2 += 6 each), or separately
        Poisson((rho - 1) mu_hat3) injected Z3 (N_2 += 2 each), at
        rho in {1.5, 2, 3}. Additivity is gated by C-PLANT.
      required: >-
        T4: power(rho = 2) >= 0.9 per arm-pooled T4 and >= 0.5 at >= 80% of
        random-V cells. T3: power(rho = 2) >= 0.9 pooled over D3 and >= 0.5 at
        every D3 cell. Otherwise PASS is unavailable at that scope.
      blocking: true
    - id: C-SCALE
      card_item: (iv)
      what: "Each lambda-grid value at >= 2 n in the ordinary arms; S-TREND (slope of log rho_hat4 on log2 l per arm, with CI)"
      required: "A lambda band with fewer than 2 admitted n is INCONCLUSIVE for that band. S-TREND is reported and does not decide."
      blocking: false
    - id: C-SEEDS
      card_item: (v)
      what: >-
        Every random draw is keyed by a unique label
        EXP-SEMBIN-3d9a71|<cell>|<role>|<i>|<j>, with roles {curve, V, null,
        placebo, plant, ap, gap, sid, sens, rep1, v3}. Halves A and B are
        disjoint by j.
      required: G11 passes
      blocking: true
  reason_no_coordinate_object: >-
    KN-FIND-ffe1df Theorem C, transferred to <P> per VAL-20261003-17b1e4,
    excludes an exact sum-compatible coordinate projection on a prime-order
    group. So objects with known additive structure are built by scalar
    multiplication. The Frobenius GAP on KR is the curve-natural one.

  # ---------------------------------------------------------------------------
  gates:
    principle: >-
      Written from the statement and the definitions above, with no code shared
      with the counters (DEC-20261002-7a3f19 R3, by analogy). Module A holds
      the counters and tests; module B holds the gates; the integer and point
      paths share no counting code. Each JV-2 defect class has designed power:
      off-grid and mislabel by G6 and G7; the domain predicate by G1, G3 and
      G16; the enumerator by G2; shared input by G8; the baseline column by
      G7, C-NULL and G14. All gates are STOPPING.
    list:
      - id: G0-ARITH
        check: Modules A and B agree on 10^4 random additions per curve; [l]P = O; [#E]R = O
      - id: G1-BRUTE
        check: >-
          A literal O(|L|^4) enumeration from the definitions, using module B,
          on: 50 lists at each |L| in {16, 24, 32, 48} in Z/101, Z/1009 and
          Z/10007; F_V at CAL-13 and CAL-19 with |F| <= 48; KCAL full-orbit
          lists of 1, 2 and 3 orbits; and every planted list with |L| <= 48.
          Fast counters must equal it exactly on N_2, Z4, Z3, Z3_struct and
          Z3_excl.
      - id: G2-ENUM
        check: >-
          sum r(g) = C(|L|, 2), r(O) = |L|/2, r(g) = r(-g); a caller-side
          partner tally of |L| - 1 per element. The emitted cell set equals the
          frozen 65-cell table read from an independent copy.
      - id: G3-EXCL
        check: >-
          Hand-built cases with expected values written before code:
          {+-a, +-b} gives N_2 = 0. One parallelogram gives N_2 = 6, Z4 = 1.
          {+-s, +-u, +-(2s+u)} gives N_2 = 2, Z3 = 1. {+-s, +-3s} gives
          N_2 = 0, Z3 = 0. CORRECTED (R6 X4; v1 expected N_2 = 0): one full
          <+-lambda>-orbit at KCAL-13, KCAL-17, KCAL-23 and the KR curve gives
          N_2 = 4n + 6 Z4_acc + 2 Z3_acc, Z3_raw = 2n + Z3_acc,
          Z3_struct = 2n, Z3_excl = Z3_acc, Z4 = Z4_acc, where
          (Z4_acc, Z3_acc) is G16's accidental count for that curve (expected
          0 at n >= 31). A planted F1 triple in a <-1> KR list gives
          Z3_raw = Z3_struct = 1, Z3_excl = 0 and a decision-Z3 increment of 1.
      - id: G4-PATH
        check: >-
          The integer path equals the point path exactly (N_2, Z4, Z3,
          Z3_struct) on >= 5 reference lists per cell, every planted list, and
          one AP and one GAP list per cell.
      - id: G5-DILATION
        check: All AP dilates of a cell give identical (Z4, Z3), equal to an independent integer count
      - id: G6-MEMBERSHIP
        check: >-
          Every element of F_V has x in V, lies on E and satisfies [l]Q = O
          (all elements at calibration curves and n = 31; a 1% sample
          elsewhere). F_V is negation-closed. |F_V| is recounted independently
          for 3 V per cell. SKIP: consumed V indices = tested indices plus the
          skip log, recounted independently. KR: every V is checked
          non-sigma-stable.
      - id: G7-NULL
        check: >-
          |F*| = |F_(V_i)| per stratum; orbits distinct;
          lambda^2 - mu lambda + 2 = 0 mod l and pi(P) = [lambda]P on KR and
          KCAL; a weak top-8-bit histogram chi-square with p > 10^-6.
      - id: G8-INPUT
        check: >-
          l and #E recomputed by module B (Lucas and BSGS from two independent
          points); l proved prime; f_n re-tested for irreducibility; the
          ECC2K-130 l compared with the vendored string; KCAL l values
          recomputed.
      - id: G9-IDENTITIES
        check: >-
          N_2 = 6 Z4 + 2 Z3 with Z4 a non-negative integer, on every list. The
          Z3 closed form equals the Z3 enumeration count.
          0 <= Z3_struct <= Z3. Z3_struct = 0 on ordinary curves.
      - id: G10-STATS
        check: >-
          The exact convolution equals brute force on toy strata (N_V = 3,
          M = 2; plus an M = 6 split-half case). 1000 synthetic placebo
          p-values are not rejected as U(0, 1) at 10^-3. Synthetic shifts
          reject. Frozen constants read from an independent copy: m_max = 270,
          theta_SH = 5.13e-6, GU threshold 5e-4, raw threshold 3.70e-6.
      - id: G11-SEEDS
        check: No label collision; no repeated V within or across cells; no repeated null orbit set; halves A and B disjoint; replication labels disjoint
      - id: G12-MUTATION
        check: >-
          Each mutant M1 to M30 makes at least one gate fail, and the unmutated
          code passes every gate. An uncaught mutant makes the run INVALID.
      - id: G13-NULLEQ
        check: >-
          (R6 X3.) 200 synthetic cells in which "V" and the references are
          i.i.d. from an over-dispersed law (negative binomial, mean 20,
          VMR 3; N_V = 100, M = 6). The full decision machinery must reject
          nothing at raw 3.70e-6.
      - id: G14-NULLCAL
        check: >-
          (R6 X3.) 200 synthetic correct-null cells (Z4 Poisson; N_2 built as
          6 Z4 + 2 Z3). SH and GU must pass in >= 199.
      - id: G15-STATMAP
        check: >-
          (R6 X2, X4.) Module B recomputes every per-cell and pooled decision
          vector from the per-list records under the frozen map (decision
          statistics Z4 and raw Z3 on every arm, KR included). It must equal
          module A's.
      - id: G16-INTRAORBIT
        check: >-
          (R6 X4.) (i) Curve-free: enumerate every Z4 pattern (four +-1 terms)
          and Z3 pattern (one +-2 term and two +-1 terms) with exponents in
          [0, 7], mu = +-1, and test divisibility by X^2 - mu X + 2 in Z[X]
          (module B). The structural set must equal {+-F1, +-F2} up to shift,
          and the Z4 structural set must be empty. (ii) Per Koblitz curve
          (KCAL-13, KCAL-17, KCAL-23, KR): enumerate every intra-orbit pattern
          with exponents mod n, evaluate f(lambda) mod l, and classify the
          zeros. The structural count must be 2n Z3 +-classes per orbit.
          Accidentals are recorded. (iii) Brute-force N_2 on one full orbit
          must equal 4n + 6 Z4_acc + 2 Z3_acc.
    mutation_self_test:
      - id: M1
        class: exclusion logic
        mutant: include the g = O class
      - id: M2
        class: exclusion logic
        mutant: "count {a, a} 2-sums"
      - id: M3
        class: pair enumerator
        mutant: skip pairs (i, i+1), or drop the last element
      - id: M4
        class: hash key
        mutant: key on x(g) only
      - id: M5
        class: field arithmetic
        mutant: module A uses a different reduction polynomial than f_n
      - id: M6
        class: curve special case
        mutant: a + (-a) returns a non-O point
      - id: M7
        class: null size
        mutant: null lists of size |F_V| - 2
      - id: M8
        class: null closure
        mutant: null of independent elements, not negation-closed
      - id: M9
        class: null distribution
        mutant: r drawn from [1, 2^20] instead of [1, l-1]
      - id: M10
        class: Z3 closed form
        mutant: "omit the -1{-3s in L} correction"
      - id: M11
        class: shared input (order)
        mutant: membership tested by [#E]Q = O instead of [l]Q = O
      - id: M12
        class: shared input (eigenvalue)
        mutant: the other root of lambda^2 - mu lambda + 2
      - id: M13
        class: stratification
        mutant: V_i paired with stratum i+1's references
      - id: M14
        class: p-value
        mutant: p = G/B without the +1, or one-sided where two-sided is required
      - id: M15
        class: statistic (X2)
        mutant: Z4 = round(N_2 / 6), ignoring Z3
      - id: M16
        class: cell enumerator
        mutant: drop the largest D of each curve
      - id: M17
        class: multiplicity (X6)
        mutant: m_max from admitted cells, or the stale v1 value 345
      - id: M18
        class: seed reuse
        mutant: the same null lists reused across strata
      - id: M19
        class: V sampling
        mutant: rank-deficient V accepted
      - id: M20
        class: window basis
        mutant: W_s built in a basis other than the polynomial basis of f_n
      - id: M21
        class: decision test (X3)
        mutant: decide by a Pearson goodness-of-fit of Z4 to Poisson(lambda_hat) instead of the two-sample tests
      - id: M22
        class: null calibration (X3)
        mutant: validity uses the v1 N-POI Poisson-heterogeneity check on N_2 instead of the split-half
      - id: M23
        class: statistic (X2)
        mutant: T4 computed on N_2 instead of Z4
      - id: M24
        class: structural exclusion omitted (X4)
        mutant: structural classifier disabled (Z3_struct always 0)
      - id: M25
        class: structural families counted twice (X4)
        mutant: each structural configuration counted once per family orientation (4n per orbit)
      - id: M26
        class: exclusion in wrong scope (X4)
        mutant: KR decision Z3 taken as Z3_excl
      - id: M27
        class: unfrozen threshold (X3)
        mutant: theta_SH taken from a quantile of the run's own SH p-values
      - id: M28
        class: skip handling (X7)
        mutant: a V with |F_V| = 0 dropped without a log entry, or an earlier V index reused
      - id: M29
        class: split-half overlap (X3)
        mutant: halves A and B share list j = M/2
      - id: M30
        class: class count (X2)
        mutant: Z4 counts T and -T separately
    expected_catching_gates: >-
      M21 by G13; M22 by G14; M23 and M26 by G15; M24 and M25 by G3 and G16
      (M25 also by G9 non-negativity); M27 by G10; M28 by G6-SKIP; M29 by
      G11; M30 by G1 and G9; M10 by G3 {+-s, +-3s} and G1; M1 to M9 and M11
      to M20 as in v1. These are expectations; G12 measures them.

  # ---------------------------------------------------------------------------
  metrics:
    primary:
      - name: Z4
        unit: count
        definition: definitions.statistic.Z4, per list
      - name: Z3
        unit: count
        definition: definitions.statistic.Z3 (raw), per list
      - name: T4_p
        unit: probability
        definition: two-sided exact stratified-permutation p of the cell total of Z4, per cell and per arm
      - name: T3_p
        unit: probability
        definition: two-sided exact stratified-permutation p of the cell total of Z3, per cell and per arm
      - name: KS4_p
        unit: probability
        definition: stratified Monte Carlo permutation p of the two-sample KS distance on Z4
      - name: MX4_p
        unit: probability
        definition: stratified Monte Carlo permutation p of max over V_i of Z4 (upper tail)
      - name: rho_hat4
        unit: ratio
        definition: "sum Z4(F_V) / sum over strata of mean reference Z4, per cell and per arm, with exact 99% CI"
      - name: rho_hat3
        unit: ratio
        definition: as rho_hat4, on Z3
    secondary:
      - name: N_2
        unit: count
        definition: "per list; gated by N_2 = 6 Z4 + 2 Z3; reported, never tested against Poisson"
      - name: R_2
        unit: count
        definition: Z4 + Z3 (B1)
      - name: Z3_struct_and_Z3_excl
        unit: count
        definition: per Koblitz list; T3 on Z3_excl reported on KR
      - name: null_VMR
        unit: ratio
        definition: within-stratum pooled variance/mean of null N_2 and of null Z4, per cell
      - name: poisson_fit_Z4
        unit: probability
        definition: Pearson X^2 of Z4 against Poisson(mean null Z4), per cell (reported only)
      - name: SH_p_and_GU_p
        unit: probability
        definition: split-half p-values per cell and test; GU KS p-values
      - name: skip_rate
        unit: ratio
        definition: skipped V over consumed V, per cell (R6 X7)
      - name: trace_geometry
        unit: various
        definition: "definitions.trace_geometry_record per V; |F_V|/(2^D/h) by class (RT-20261003-24c995 O9)"
      - name: S_TREND
        unit: per bit of log2 l
        definition: OLS slope of log rho_hat4 on log2 l per arm, with 95% CI
      - name: SENS_power
        unit: probability
        definition: C-SENS power at rho in {1.5, 2, 3}, per cell and per arm, for T4 and T3
      - name: G16_record
        unit: list
        definition: per Koblitz curve, structural and accidental intra-orbit configurations
      - name: control_readings
        unit: various
        definition: AP, GAP, SID4, SID3, PLANT, placebo and N-SCALE per cell
      - name: cost
        unit: "point additions, integer pair-sums, seconds, peak RSS"
        definition: per run and per cell, with the measured S0-4 throughput
      - name: termination_reason
        unit: categorical
        definition: completed, checkpointed, timeout, crash or memory stop, per run

  statistical_plan:
    alpha: "10^-3 family-wise, Bonferroni"
    multiplicity: >-
      m_max = 4 tests (T4, T3, KS4, MX4) x 65 cells + 2 pooled tests (T4, T3)
      x 5 arms (O4, O2, W, KR, D3) = 270, FROZEN before any run (R6 X6). It
      is not reduced when cells fail admission, and reported-only cells do not
      enter it. The raw per-test threshold is p <= 10^-3/270 = 3.70e-6. The
      positive-control threshold is 10^-6/270 = 3.70e-9 raw.
    stratification: >-
      Stratum i = {F_(V_i), references j = 1..M}. Under H0, F_(V_i)'s value is
      exchangeable with its references at the realised size. Every decision
      p-value is computed under that exact stratified permutation law. No
      normal approximation and no Poisson fit decides anything.
    T4: >-
      S = sum_i Z4(F_(V_i)). The reference law is the exact convolution of one
      uniform pick per stratum from its M+1 values.
      p = min(1, 2 min(P(S' >= S), P(S' <= S))).
    T3: as T4, on raw Z3 (on KR, also computed on Z3_excl and reported)
    KS4: >-
      KS distance between {Z4(F_(V_i))} and the pooled references. Stratified
      Monte Carlo permutation with Besag-Clifford stopping at h = 20
      exceedances and B_max = 4e6. p = h/b if stopped at b, else
      (1 + G)/(B_max + 1).
    MX4: max_i Z4(F_(V_i)), upper tail, permutation-calibrated as KS4; the null-calibrated tail check
    pooled: T4 and T3 over all strata of all admitted in-family cells of an arm
    placebo: the j = 0 list run as "V" through T4, T3, KS4, MX4 and the pooled tests, at the same raw threshold
    split_half: >-
      Per cell and per X in {T4, T3, KS4}: half A against half B within
      strata. T-type tests use the exact law of the sum of a uniformly random
      M/2-subset of the stratum's M values, convolved over strata. KS4 uses
      Monte Carlo with B_max = 1e6. PASS iff every SH p >= theta_SH =
      10^-3/(3 x 65) = 5.13e-6, FROZEN.
    global_uniformity: >-
      Randomised (labelled DRBG tie-breaking) one-sided upper SH-T4 p-values,
      one per cell, and the same for placebo T4. Each set of 65 gets a
      one-sample KS test against U(0, 1). PASS iff both p >= 5e-4, FROZEN.
    replication_of_a_falsification: >-
      Pre-registered. A falsifying cell is rerun once with fresh labels (role
      rep1) at the same N_V and M, on the single test that fired, at
      alpha = 10^-3 with no multiplicity. REPLICATED if it rejects in the same
      direction; UNREPLICATED otherwise.

  preregistered_prediction:
    quantity: >-
      Per cell, the stratified-permutation law of Z4(F_V) and of Z3(F_V)
      against the matched closure null.
    formula: >-
      H0, as filed: Z4(F_(V_i)) and Z3(F_(V_i)) are each exchangeable with
      their M size-matched references. PREDICTED READING: no decision or
      pooled test at raw p <= 3.70e-6, and rho_hat4 and rho_hat3 about 1. This
      is true of a null, and it is the reading the placebo must give.
    secondary_predictions:
      - "null VMR(N_2), pooled within strata over ordinary lambda-grid cells with lambda_nom >= 2^2, in [4.5, 7.5]; exact form (36 mu4 + 4 mu3)/(6 mu4 + 2 mu3), about 6"
      - "null VMR(Z4) at the same cells in [0.8, 1.25] (Poisson reference; secondary)"
      - "G16 finds exactly the two structural families, both Z3-type, at every Koblitz curve (DESIGN.md section 4.2)"
      - "Z3_struct(F_V) = 0 on every KR list (scratch expectation about 2^(3D - 2n))"
      - "AP dilation invariance of (Z4, Z3)"
      - "S-TREND slope 0 (reported with its CI; not a decision)"
    source: >-
      HEUR-HARVEST-FV-1(a) version 2 (filed in H-SEMBIN-c7e1d4; internal). Its
      random-model justification, "sparse sums of weakly dependent indicators
      of probability about 1/l", is recalled and backs nothing. Every constant
      comes from the null sample. Written before any run and never adjusted; a
      change is a new record through the amendment path after approval, or a
      re-draft before it.

  scale_relevance:
    tier: toy
    tier_note: >-
      Under the mechanical rule in docs/claims-and-verification.md, n = 31 is
      toy and n = 37 to 47 is medium (32 < field bits <= 96). The label "toy"
      follows the card. All are far below the n >= 97 labels where the
      heuristic is used. V3 at n = 131 is a disclosed-weak arm at a
      cryptographic label.
    justification: >-
      n in {31, 37, 41, 43, 47}, with l from about 2^29 to 2^46. Five n,
      three ordinary curves per n plus the admissible Koblitz curve, and every
      lambda-grid value at >= 2 n. D3 covers the m = 3 factor-base density at
      n in {31, 37, 41}.
      TA-1, BY ASSUMPTION: the rate ratios rho4(lambda) and rho3(mu3) at
      matched density are the same at n >= 97 as measured here.
      TA-2: random-V results say nothing about structured V.
      TA-3: D3 transfers to the m = 3 density at n >= 97 by assumption only.
    correspondence: null
    correspondence_note: >-
      Direct sampling. No shortcut comparable to the Deuring correspondence is
      known for these statistics at n >= 97.

  tail_checks:
    - MX4 per cell, the largest single-V Z4 against its permutation tail (decision test)
    - The largest single-V Z3 per cell against the reference pool maximum (reported)
    - The largest placebo statistic per test family against its threshold (reported; any crossing is INCONCLUSIVE)
    - "V3: any Z4 >= 1 or Z3 >= 1 against the scratch lambda_2 of about 2^-76"

  replication:
    seeds: []
    seeds_note: >-
      No integer seed list. Every random draw is keyed by a SHA-256 counter
      DRBG on a unique label EXP-SEMBIN-3d9a71|<cell>|<role>|<i>|<j>. Labels
      are recorded per draw, and G11 checks uniqueness.
    independent_instances: null
    independent_instances_note: >-
      15 ordinary curves plus 0 or 1 in-family Koblitz curve (plus any
      reported-only Koblitz curves), with V and null lists per cell as in
      sample_sizes. The realised count is recorded at S0-3.
    sampled_parameters_recorded: >-
      Per curve: n, f_n, A, B (or a), #E, h, l with its trial-division
      transcript summary, P, lambda and mu (Koblitz), and the G16 record. Per
      V: D, a basis as a hex bit matrix, the trace-geometry record, |F_V|,
      N_2, Z4, Z3, Z3_struct, Z3_excl and max r(g). Per null and control list:
      label, role, size and the same counts. The skip log. Every op-counter
      definition and the S0-4 throughput.

  # ---------------------------------------------------------------------------
  procedure:
    - "S0-1. Read this frozen contract and write the code. Modules A (counters and tests) and B (gates) share no code; the integer and point paths share no counting code."
    - "S0-2. Calibration curves CAL-13, CAL-19, KCAL-13, KCAL-17 and KCAL-23; then G0, G1, G3, G9, G10, G13, G14, G16 on toy inputs; then G12 (mutation self-test). Any failure stops the run: INVALID."
    - "S0-3. Curve selection (fields, ordinary roles, Koblitz admissibility for every (n, a), P, lambda); G8. Record the admitted in-family and reported-only cell sets, W's realised N_V with trace classes, and each W cell's null-estimated E4; m_max stays 270."
    - "S0-4. Measure throughput (point additions/s, integer sums/s, peak RSS at |L| = 2^14) and project each run; split a run projected above its watchdog into blocks of cells (checkpoints, never evidence)."
    - "S1-1. Per cell: build F_V for every V (G6, skip log), the references, placebo and halves (G7), and the controls (AP, GAP, SID4, SID3, PLANT); count; G2, G4, G5, G9 on every list as specified."
    - "S1-2. Per cell: N-SCALE; SH; then T4, T3, KS4, MX4; placebo; AP, GAP and SID readings; SENS pseudo-cells."
    - "S2-1. Arm-pooled T4 and T3, placebo-pooled; GU; G15; S-TREND; the secondary predictions."
    - "S2-2. Apply the outcome rules in order (INVALID, then INCONCLUSIVE, then FALSIFIED or PASS); if FALSIFIED, run the pre-registered replication of each falsifying cell."
    - "S2-3. Optional V3 arm: stop on the first configuration and emit a certificate."
    - "S2-4. Write the outcome table: one row per arm and per cell, with rho_hat4, rho_hat3, CIs, p-values, SH, control readings, power and the trace-geometry summary."
  runs_plan:
    - run: RUN-A
      content: "S0-1 to S0-4: gates on toy inputs, G16, mutation self-test, curve selection, throughput"
    - run: RUN-B
      content: "n = 31 and 37, all arms, including D3"
    - run: RUN-C
      content: "n = 41, all arms, including KR and D3 (split into blocks if S0-4 projects above the watchdog)"
    - run: RUN-D
      content: n = 43, all arms
    - run: RUN-E
      content: n = 47, all arms
    - run: RUN-F
      content: "analysis: pooled tests, SH, GU, G15, outcome rules, any pre-registered replication"
    - run: RUN-G
      content: optional V3 arm

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 8
    maximum_memory_gb: 4
    maximum_runs: 14
    maximum_workers: 1
    estimate: >-
      Scratch, unmeasured. Point additions about 2.5e10 in total (O4 5.7e9; O2
      4.3e9; KR 0.5e9; W 2.1e9 nominal, up to 5.2e9 if O4a windows have
      doubled |F_V|; D3 7.1e9; G4 subsets and controls about 2e9). Integer
      pair-sums up to about 6.4e11 (O4 8.0e10; O2 6.0e10; KR 7.3e9; W up to
      2.2e11; D3 1.0e11; controls about 1.7e11). At about 5e6 additions/s
      (portable C kernel with Montgomery batch inversion, KR-RHO-cb1c58) and
      1e8 integer sums/s, that is about 3 to 4 CPU-hours. The largest cell
      (D3, O2, n = 41, D = 15, N_V = 60) takes about 25 minutes. Memory: at
      most 2^27 64-bit keys (1 GiB) plus the sort, so peak <= 1.5 GiB. Pure
      Python is not viable. A missing compiled kernel is an infrastructure
      stop, or an amendment with rho_90 recomputed, never a silent cut.
    note: >-
      maximum_runs 14 = 7 scientific runs plus up to 7 infrastructure reruns.
      A watchdog expiry checkpoints a run and is never evidence. N_V, M,
      m_max, theta_SH and the cell table are scientific and frozen; they are
      not budget knobs.

  stopping_rules:
    - "SR-1. Any gate (G0 to G16) fails, or a mutant is uncaught: STOP the run; INVALID; nothing is read."
    - "SR-2. N-SCALE out of band at any cell: STOP; INVALID pending a defect explanation."
    - "SR-3. A cell whose curve fails admission is dropped and logged; m_max is unchanged. A Koblitz curve admitted outside the frozen KR family runs reported-only."
    - "SR-4. V3: the first configuration found stops the arm; a certificate is emitted and independently re-verified; route to the Coordinator."
    - "SR-5. Watchdog or memory stop: checkpoint; infrastructure, never evidence; resume from the last completed cell."
    - "SR-6. Any FALSIFIED reading: write no interpretation; run the pre-registered replication; route to the Coordinator."

  invalidation_rules:
    - A path mismatch (G4), or an identity failure (G9), on any list
    - A list size mismatch between F_V and its null (G7)
    - Use of a reference formula anywhere in a decision
    - Any reuse of experiments/EXP-SEMBIN-04ec3c/code/v2/
    - "Any change to N_V, M, m_max, theta_SH, the GU threshold, the cell table, the KR family or the arm-to-statistic map after S0-1 without a versioned protocol_amendment"

  outcomes:
    INVALID: >-
      Any gate fails, a mutant is uncaught, N-SCALE is out of band, a path
      mismatch occurs, or an invalidation rule fires. A defect, not evidence.
    INCONCLUSIVE: >-
      Valid, but any of: a placebo test at raw p <= 3.70e-6; AP or GAP not
      flagged on T4 or T3 at corrected p < 10^-6 at some admitted random-V
      cell; SID4 or SID3 not flagged where required; SH failing at two or more
      cells (a single failure makes only that cell INCONCLUSIVE); GU failing.
    FALSIFIED: >-
      Valid; controls OK; the cell's SH passed; GU passed; and any in-family
      decision test (T4, T3, KS4, MX4 at an admitted cell, or a pooled T4 or
      T3) at raw p <= 3.70e-6, i.e. Bonferroni-corrected p < 10^-3 over the
      frozen m_max = 270. The direction (excess, deficit, shape, tail), the
      statistic, the arm and the cell are recorded. On KR, if T3 on Z3_excl
      does not reject, the label is FALSIFIED-STRUCTURAL (B2). Labelled
      REPLICATED or UNREPLICATED by the pre-registered replication. Scope: the
      cell's (curve class, D, V-distribution).
    PASS: >-
      Valid, controls OK, no in-family test rejects, and the C-SENS floors are
      met. Reported with rho_hat4, rho_hat3 and their 99% CIs per cell and per
      arm. Scope of a PASS: Z4 at the resolution table per cell; Z3 at
      resolution only in D3 cells, and gross-only elsewhere.
    PASS_UNDERPOWERED: Valid, no rejection, a sensitivity floor unmet. Reported as INCONCLUSIVE at that scope.
    UNTESTED: >-
      The sigma-stable Koblitz sub-clause (always, in this contract); the
      ker-Tr structured class (B8); a W cell with null-estimated E4 < 1.
    V3: >-
      Any Z4 >= 1 or Z3 >= 1: FALSIFIED at that cell (scratch lambda_2 about
      2^-76; no multiplicity needed), certified and routed. Zero: consistent;
      confirms no rate.
    infrastructure: A timeout, crash or memory stop is never evidence about any heuristic.

  success_criterion: >-
    PASS as defined in outcomes, decidable from T4, T3, KS4, MX4, the pooled
    tests, SH, GU, the control readings and SENS power. Its content is "no
    departure at the stated resolution in the tested cells". It never means
    the heuristic is proved, and the conditional on HEUR-HARVEST-FV-1 is never
    discharged by it.
  falsification_criterion: >-
    FALSIFIED as defined in outcomes: one in-family decision test at raw
    p <= 3.70e-6 (Bonferroni-corrected p < 10^-3 over m_max = 270), with
    every gate passing, the AP and GAP positive controls flagged at corrected
    p < 10^-6, the SID controls flagged, no placebo rejection, GU passing, and
    the cell's split-half null-versus-null calibration passing. Or V3 with any
    configuration. This instantiates version 2's falsification_condition
    (heuristic_as_stated).

  required_artifacts:
    - manifest per run (command, commit, dirty flag, environment, resolved inference block)
    - "per-list records: label, role, cell, size, N_2, Z4, Z3, Z3_struct, Z3_excl, R_2, max r(g)"
    - per-V trace-geometry records and the per-cell skip log
    - per-curve setup records, including trial-division transcripts (summary and hash) and the G16 record
    - gate reports G0 to G16, with the catching gate per mutant
    - per-cell and per-arm test outputs (T4, T3, KS4, MX4, pooled, placebo, SH, GU, N-SCALE, SENS, AP, GAP, SID4, SID3, PLANT)
    - the exact reference distributions (hash-bound) and the Monte Carlo stopping records
    - outcome table and RESULTS text carrying the conditional and scope wording
    - certificate for any V3 configuration (points and independent re-verification)
    - artifact-digests.json binding every file

  # ---------------------------------------------------------------------------
  dominated_by: "n/a (no result claimed)"
  dominated_by_check: >-
    A heuristic-validation experiment claims no algorithm and no bound. This
    session read H-SEMBIN-c7e1d4's dominated_by and RT-20261003-24c995's
    baseline_comparison. It did one web search for prior art: Ahmadi and
    Shparlinski (arXiv 0806.0640, abstract and theorem statements retrieved)
    is adjacent and nontrivial only far above this density; two 2025-2026
    additive-rigidity preprints (arXiv 2510.03828 and 2603.24340, titles only)
    are unrelated. The version-1 check (KN-FIND-ffe1df; the 24 KR-RHO claim
    lines; KR-IC-73db3f, -889857, -b0fcda; KN-FIND-007 lines 1-80) is
    inherited and was NOT repeated in this session.
  sota_delta: >-
    0 on time, memory and data/queries, under every outcome. A falsification
    removes a transfer premise of the generic layer (CH-2) and opens a routed
    attack question. It moves no frontier row without a separate algorithm
    and record.
  claim_ceiling: >-
    Toy and medium-label measurements at the tested (curve, D,
    V-distribution) cells. PASS at most means "consistent with
    HEUR-HARVEST-FV-1(a) version 2 at the stated resolution". FALSIFIED at
    most means "the clause fails at the cell's scope". Neither is a statement
    about any curve's security. Neither changes the conditional status of any
    claim resting on the heuristic without a Coordinator decision.
  novelty_status: unverified
  limitations:
    - "Clause (a) only. Nothing about clause (b), HEUR-HARVEST-FV-2 or higher-arity oracles (KN-OPEN-91d4f6, KN-OPEN-8f3d27)."
    - "The sigma-stable sub-clause and the ker-Tr class are UNTESTED."
    - "Z3 is resolved only in the D3 band (n <= 41); elsewhere it is gross-only."
    - "Per-cell Z4 deficits are unresolvable at lambda_nom <= 2^3; V-classes rarer than 1/N_V are invisible."
    - "Marginal tests only; a departure in the dependence between Z4 and Z3 is not resolved (B6)."
    - "W's realised size and power depend on the trace geometry of the polynomial basis, which is unknown until S0-3."
    - "KR is a single curve at n = 41 if admitted."
    - "Transfer to n >= 97 is BY ASSUMPTION (TA-1, TA-3)."
    - "The section 4 derivation and all sizing arithmetic are single-session scratch, checked by gates before any reading, and not refereed."

  procedure_deviations_at_design:
    - id: PD-1
      severity: material
      what: >-
        Dispatched on the user's instruction before DP-1 (no
        TASK-20261003-6d2f84 receipt; H-SEMBIN-c7e1d4 and the card are not on
        main), DP-2 (no TASK-20261002-5f0b2c receipt; version-1 bytes not
        fixed) and DP-3 (no lane claim by this session). The
        TASK-20261002-c13d8e snapshot had not run either. Inputs were read
        from the working tree of the PR #1771 branch, unverified. Disclosed,
        not waived.
    - id: PD-2
      severity: material
      what: >-
        No shell. The X1 sha256 binding, allocate_id.py, git grep,
        validate_ledger.py and the branch and commit identity were not run or
        verified. All are carried as approval preconditions.
    - id: PD-3
      severity: minor
      what: >-
        Design additions beyond R6's letter, each justified in DESIGN.md: the
        D3 band (for X2's Z3 statistic), M = 6 (for the split-half), the
        frozen KR family with reported-only extras (for X5 and X6), and the
        FALSIFIED-STRUCTURAL label (for B2). The approval decision may decline
        any of them; declining D3 means a re-draft with m_max = 244.
    - id: PD-4
      severity: minor
      what: >-
        Scratch inputs from VAL-20261003-17b1e4 (the Koblitz admissibility
        pattern; KCAL and n = 41 l values) were not re-derived here. G8 and
        S0-3 recompute them. The trinomial trace pattern behind the W caveat
        is recalled and unverified.
    - id: PD-5
      severity: minor
      what: The kb MCP was not in the tool surface; Grep and Glob were used.
    - id: PD-6
      severity: minor
      what: >-
        The card asks for "seconds per cell" (inherited from v1). The largest
        D3 cell is about 25 minutes (scratch), forced by the Z3 resolution
        target. Accepted for v1 as R6 PD-4 for the largest cells.
