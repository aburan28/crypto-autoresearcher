      W (windows): same (n, D) as O4a (12) and O2 (10) = 22 cells;
                   N_V = number of windows with |F_V| > 0 (nominal n - D + 1)
      KR (Koblitz n = 41, a = 0, h = 4; 3 cells): D = 12, 13, 14 as O4 at n = 41
      D3 (6 cells)  curve n  D  |F|   lambda_2  mu4    mu3  N_V  E4     E3
                    O4a  31 13 2^11  2^12      683    4    30   20480  120
                    O4a  37 15 2^13  2^14      2731   4    30   81920  120
                    O4a  41 16 2^14  2^14      2731   2    30   81920   60
