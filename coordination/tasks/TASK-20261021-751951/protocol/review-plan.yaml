review_plan:
  claim_under_review: The prospective successor repairs exact-epoch ownership cleanup without weakening remote publication
    proof or native admission; no mathematical/research claim is reviewed.
  coordinator_prior: Fresh review reported that earlier cleanup reselects a newer same-owner epoch through unqualified
    native release. Native expected-epoch fencing is needed; actual final review remains the binding source for
    the original defect.
  joints:
  - joint: native atomic epoch fence
    assigned_to: TASK-20261021-d0c5d4
    attack_plan: Trace expected epoch through CLI and release_task, reject stale/invalid inputs before mutation,
      inspect selection/write binding and owner/write-once semantics; reject wrapper-only checks.
  - joint: actual divergent-native release regression
    assigned_to: TASK-20261021-d0c5d4
    attack_plan: Independently replay the same-owner epoch1/local versus epoch2/remote counterexample with actual
      goal_lanes CLI. Require zero wrong release-file/Git mutations; cover newly acquired/reused claims and cleanup/normal
      release paths.
  - joint: preserved publication proof, scope and history
    assigned_to: TASK-20261021-d0c5d4
    attack_plan: Check original fetch/containment and fail-closed controls, source closure, backward compatibility,
      log preservation, frozen prior review/source and no actual scientific launch.
  proves_too_much:
    objects:
    - id: same-owner-newer-epoch-after-fetch
      fixture: Local unpublished epoch1 and divergent remote published same-owner epoch2; the actual own-branch
        fetch exposes epoch2, then epoch1 proof/cleanup fails.
      known_false_conclusion: The stale epoch1 operation is authorized to release selected epoch2.
      required_behavior: Zero supervisor calls and no release JSON for either epoch; native expected_epoch mismatch
        refusal occurs before write/commit/push.
    - id: expected-epoch-inputs
      fixture: Actual native API receives bool,0,negative,noninteger; CLI receives invalid argument and a valid
        but mismatched epoch.
      known_false_conclusion: This is a valid exact expected current claim epoch.
      required_behavior: Refuse without release-file or Git mutations; retain precise statuses.
    - id: owner-and-release-path-fencing
      fixture: Expected epoch has foreign owner or an existing immutable release; another same-owner claim is visible.
      known_false_conclusion: This operation may release/overwrite the selected or preexisting claim.
      required_behavior: Preserve owner fencing and write-once behavior; no release of a different epoch.
    - id: unpublished-or-fetch-failure
      fixture: The actual claim is unpublished, fetch fails, branch/claim identity is wrong or tampered, or claim
        publication fails.
      known_false_conclusion: Published exact claim admission succeeded.
      required_behavior: Preserve the original tracking-proof fail-closed controls with zero supervisor calls and
        epoch-safe cleanup.
    failure_signature: Any stale or invalid operation creates/writes/commits/pushes a release for another epoch,
      or any invalid publication-proof case invokes supervisor; any such event is breaks. Missing native release
      control is inconclusive, never holds.
  required_outputs:
  - coordination/tasks/TASK-20261021-d0c5d4/review.md
  - coordination/tasks/TASK-20261021-d0c5d4/findings.json
  independent_session_required: true
  maximum_runs: 0
  scientific_claim_tier: not_applicable_software_only
