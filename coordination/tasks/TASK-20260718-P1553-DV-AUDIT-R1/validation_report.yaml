  metric_recomputations:
    - claim: frobenius_stickelberger_scope
      result: passed_with_scope
      recomputation: "For fixed five generic rows, the determinant is a section of L=O_E(6O) whose divisor consists of those five row-collision points and the Abel complement. The complex sigma formula supplies a compatible trivialization, not a free finite-field scalar prime form."
    - claim: weighted_linear_contraction
      result: passed
      recomputation: "Multilinearity moves each independent Cartesian sum into its determinant row, giving six O(B) row sums and one constant-size determinant."
    - claim: degree_six_slice_gate
      result: passed_with_correction
      recomputation: "In one coherent algebraic affine frame, a nonconstant section of O_E(6O) has map degree at most six, so B distinct inputs yield at least ceil(B/6) values and any exact scalar zero mask has degree at least ceil(B/6)-1. Arbitrary independent per-point frame scaling would invalidate this value-image bound."
    - claim: elliptic_row_mode
      result: passed
      recomputation: "The k-th pure evaluation power is the pullback of evaluation on L^k along Sym^k H^0(L) -> H^0(L^k), and genus-one Riemann--Roch gives dim H^0(L^k)=6k for k>=1."
    - claim: universal_mask_mode_cost
      result: passed_with_notation_correction
      recomputation: "The explicit global row mode at k=p-1 has 6(p-1)=B^(5+o(1)) coordinates from N=p^(1+o(1)); literal Theta(B^5) needs a stronger bounded-ratio assumption. It is still far outside B^(9/4) and B^(5/4)."
    - claim: aggregation_powering_noncommutation
      result: passed
      recomputation: "Squaring after scalar contraction introduces cross-source terms, while pointwise squaring before aggregation retains a B^6 campaign or B^5 fixed-target split source algebra in the standard representation."
    - claim: quadratic_determinant_power
      result: additional_positive_control
      recomputation: "For C_i=sum_A w_i(A)v(A)v(A)^T, Cauchy--Binet gives sum_(A_1,...,A_6)(prod_i w_i)D^2 = [t_1...t_6]det(sum_i t_i C_i), computable in O(B) using 64 constant-size determinant evaluations. Finite-field cancellation and gauge dependence prevent zero reporting."
    - claim: per_target_count_cancellation
      result: correction
      recomputation: "For one fixed target, at most B^4 five-source tuples can solve the equation, because four sources determine the fifth. Since B^4=p^(4/5+o(1))<p, an actually computed unweighted Fermat-mask count in F_p is cancellation-safe for large parameters. The missing operation is the contraction and source inverse, not modular wraparound of this per-target count."
    - claim: represented_cost_rectangle
      result: passed_with_scope
      recomputation: "B^2 pair/unit tables fit B^(9/4); B^3 standard balanced source traffic exceeds setup and query caps; B^5 and B^6 split algebras exceed them further. These are representation costs, not unrestricted lower bounds."
  control_checks:
    - control: gauge_dependence
      result: passed
      detail: "Linear and quadratic determinant moments vary under unary row-frame scaling. The Fermat mask is invariant under F_p^* scaling; a deck-specific mask must freeze and charge a coherent normalization."
    - control: finite_field_characteristic
      result: passed_with_scope
      detail: "Characteristic greater than seven keeps the six-row triangular constants nonzero. The finite-field proof is algebraic through evaluation sections; complex sigma values are not imported as finite-field scalars."
    - control: coefficient_construction
      result: incomplete
      detail: "The universal Fermat mask has explicit coefficients but no passing contraction. The circular h_S construction needs the determinant-value image, whose compact target-uniform construction is absent."
    - control: target_updates
      result: incomplete
      detail: "A mask built for the known-log sixth deck is not proved valid for a new Q+[t]P row, and no B^(5/4) coefficient or contraction update is supplied."
    - control: exact_signed_all_strata_sources
      result: incomplete
      detail: "No exact source inverse is supplied. Cofactors require the selected rows; first moments handle at most a certified simple fiber; cross-colour repetitions need a global length-six confluent convention."
    - control: relation_rank
      result: incomplete
      detail: "No theorem gives Theta(B) independent accepted rows after duplicates and excluded strata."
    - control: factor_logs
      result: incomplete
      detail: "The optimistic B^(2+o(1)) sparse solve is conditional on a verified full-rank relation matrix that is absent."
    - control: blind_descent
      result: incomplete
      detail: "No identical scalar-blind masked-target annihilator, contraction, source inverse, or target recurrence is supplied."
    - control: unrestricted_lower_bound
      result: passed
      detail: "No arithmetic-circuit, Boolean-circuit, word-RAM, cell-probe, incidence, Shoup, or ECDLP lower bound is inferred from the missing construction."
  theorem_receipt_admissibility: admissible_with_corrections
  residual_completion: incomplete
  verdict: incomplete
  verdict_detail: "The exact determinant-section, O(B) linear contraction, coherent-frame slice degree, 6k row-mode, and pointwise-versus-aggregation claims are admissible after the stated corrections. The audit found an O(B) quadratic mixed-discriminant contraction and a cancellation-safe per-target count bound, but neither supplies an annihilator-complete contraction, target update, or exact source inverse. No complete operator enters B^(9/4)/B^(5/4), and no P1554 or breakthrough is justified."
  limitations:
    - "The Frobenius--Stickelberger formula is used only as a complex trivialization of an algebraic divisor identity."
    - "The degree-six value-image bound is normalization-specific and does not constrain arbitrary per-point gauges or arbitrary circuits."
    - "The B^3 statement is a standard explicit-representation control, not a representation-independent lower bound."
    - "Special decks, noncharacter transforms, new invariant contractions, arbitrary circuits, and global confluent representations remain open."
    - "No relation campaign, rank proof, factor-log solve, blind descent, scalar recovery, or cryptographic-scale evidence exists."
