schema_version: "query2p1-red-team-v1"
red_team_report:
  id: "RT-20260718-P1553-Q2P1-R1"
  task_id: "TASK-20260718-P1553-Q2P1-RT-R1"
  role: "red-team"
  as_of_utc: "2026-07-18"
  claim_under_review: >-
    The producer claims a conditional operation-level reduction from Query2P1
    to PCZT-E after screening named indexing, quotient, coordinate, norm,
    resultant, and dynamic-splitting realizations.
  run_accounting:
    experiments_executed: 0
    solvers_executed: 0
    fixtures_executed: 0
    timing_runs_executed: 0
    maximum_runs_consumed: 0
  terminal_scoped_verdict:
    code: >-
      REVISE_PRODUCER__INDEXING_AND_NARROW_QUOTIENT_CONTROLS_RECONSTRUCT__PCZT_E_IS_QUERY2P1_RENAMED_WITH_AN_UNTYPED_TRANSLATED_DIVISOR_MACRO__STANDARD_REALIZATIONS_RESTORE_B3_OR_B4__TARGET_LABEL_ZERO_DIVISOR_COMMON_FACTOR_OPERATION_UNCONSTRUCTED__REPRESENTATION_SENSITIVE_EXCEPTION_PRESERVED__NO_RUN__NO_BREAKTHROUGH
    statement: >-
      The producer correctly reconstructs the named 3SUM/kSUM upper-bound
      transplants, the narrow prime-order homomorphic-quotient lemma, the
      known-scalar carry counterexample, and the conditional MPZ extraction
      benchmark. It does not establish a narrower reduction by naming PCZT-E.
      Its decision and witness contracts are Query2P1 verbatim, while its
      claimed compact gate counts each target translation of a degree-B^2 pair
      divisor as one macro gate. Expanding those B translations gives B^3
      pair-plus-fifth traffic; retaining them as references grants exactly the
      missing common-root oracle. The smallest non-tautological surviving
      exception is therefore an unconstructed target-label zero-divisor or
      common-factor operation with an explicit degree-at-most-B output, not
      PCZT-E as stated. This is a scoped failure of the audited realizations,
      not an unrestricted lower bound.

  objections:
    - id: "RT-O1-PCZT-TAUTOLOGY"
      severity: "fatal_to_claimed_reduction"
      finding: >-
        PCZT-E has the same public preprocessing input, fresh target,
        restrictions, exact existential decision, labelled witness, replay,
        and resource rectangle as Query2P1. The equation that H12 has a common
        point with product_a H34(R-a-U) is just the distributive rewriting of
        exists u,v,a with u+v+a=R. No independently computable intermediate
        value or stronger access interface is supplied.
      consequence: >-
        PCZT-E is not credited as a surviving operation-level reduction.
    - id: "RT-O2-HIDDEN-TRANSLATION-TRAFFIC"
      severity: "fatal_to_compact_gate_count"
      finding: >-
        For every one of Theta(B) fifth occurrences, the gate translates a
        degree-Theta(B^2) D34 divisor by R-a. In dense section coordinates this
        is Theta(B^3) coefficient traffic. In a product-of-leaves
        representation it instantiates Theta(B^3) equality leaves. A DAG can
        share the generic translation formula but not the B distinct parameter
        values and outputs. Calling each translated whole divisor one gate is
        an untyped higher-order primitive.
      consequence: >-
        The advertised O(B) translated-gate circuit is not an ordinary
        arithmetic circuit of O(B) size.
    - id: "RT-O3-INCOMPLETE-ELLIPTIC-DEFINITION"
      severity: "major"
      finding: >-
        The producer names complete coordinate-section rings, chart flags, and
        saturation but gives no finite chart cover, addition-law selectors,
        saturated ideals, line bundles, local trivializations, or gluing rule.
        A single affine equality section can acquire false zeros at vertical,
        tangent, infinity, denominator, repeated-support, or nonreduced strata.
      consequence: >-
        PCZT-E is not yet an exact all-strata algebraic object even before its
        complexity is considered.
    - id: "RT-O4-OCCURRENCE-SEMANTICS"
      severity: "major"
      finding: >-
        Effective pair divisors merge equal endpoints and remember only
        multiplicity. Exact existence survives that merge, but source replay
        does not unless every divisor factor remains linked to its ordered
        source occurrence and every dyadic restriction. Endpoint factors,
        fifth-point factors, and chart branches all require separate labels.
      consequence: >-
        A common endpoint or common factor alone is not a labelled witness.
    - id: "RT-O5-DYADIC-SEMANTICS"
      severity: "major"
      finding: >-
        O(B^2 log^2 B) is a valid favorable upper bound when each query deck is
        one canonical dyadic node and every leaf pair is retained in all
        ancestor-node pairs. If a restriction is a union of canonical nodes,
        all node-pair combinations and their query aggregation must be charged.
        If only leaf pairs are stored once, target-time filtering is not free.
      consequence: >-
        The interface must state single-node versus union-of-nodes semantics;
        polylogarithms do not alter exponents but cannot be omitted from exact
        advice and replay accounting.
    - id: "RT-O6-CANCELLATION-VERSUS-ROOTS"
      severity: "major"
      finding: >-
        On a valid chart over a field, H12 and product_a F_a have a common root
        iff H12 and at least one F_a have a common root; a product cannot cancel
        a zero. Likewise, in the squarefree split label algebra, a norm is zero
        iff one component is zero. By contrast, a trace, moment, selected
        coefficient, or compressed checksum may cancel and is not an existence
        reporter. Invalid chart factors can also create roots rather than
        cancel them.
      consequence: >-
        Common-root existence is exact when fully typed, but it is precisely
        the original existential query and must not be inferred from a
        cancellation-prone coefficient reporter.
    - id: "RT-O7-DYNAMIC-NO-RELATION"
      severity: "major"
      finding: >-
        In the no-relation case every fifth-label component resultant is
        nonzero, so the packed element is a unit and no zero-divisor split is
        available. A brancher whose only progress event is finding a relation
        or zero divisor must exhaust all components or invoke a genuine
        aggregate unit/common-factor test. Standard per-component pair-divisor
        tests cost B^2 each and B^3 total.
      consequence: >-
        Early discovery on favorable positive inputs does not improve the
        exact no-relation worst case.
    - id: "RT-O8-MPZ-SCOPE"
      severity: "scope_correction"
      finding: >-
        MPZ Theorem 3 bounds average-case generic extraction with advice bits
        ell and k main interactions by 3*ell*(k+1)^2/N. It applies here only
        after a complete reduction from the whole ECDLP path to that extraction
        game. Query2P1 and coordinate algorithms do not satisfy that premise.
      consequence: >-
        The B^(19/4) comparison is retained only as a conditional escape test.

  required_controls:
    - id: "RT-C1-KNOWN-SCALAR-CARRY"
      type: "favorable_exact_control"
      statement: >-
        For known canonical scalars x_i,r in [0,N), the modular relation is one
        of constantly many integer equalities sum_i x_i=r+cN. Ordinary modular
        hashing with wrap and base-m carry enumeration is exact. The invalid
        step on fresh points is obtaining log_P(R) mod m, not integer hashing.
      recomputation: >-
        With m=B^3 and N=B^5, a supplied residue leaves N/m=B^2 interval
        candidates. BSGS over that interval costs sqrt(B^2)=B group work and B
        memory. Thus a free residue oracle would already complete the fresh
        target DLP inside the query exponent.
    - id: "RT-C2-SPLIT-LABEL-NORM"
      type: "favorable_exact_control"
      statement: >-
        Let g_I(T)=product_{a in I5}(T-t_a) with distinct public occurrence
        labels and A5=F_p[T]/g_I. If an exact component function r_R(T) is
        already supplied, then gcd(g_I,r_R) identifies exactly the fifth labels
        having a pair-pair common root, and Norm_A5(r_R)=0 is an exact existence
        bit. This proves the output semantics, not a fast constructor for r_R.
    - id: "RT-C3-NO-RELATION-UNIT-MUTATION"
      type: "adversarial_mutation"
      statement: >-
        Choose an admitted instance for which every translated D34 divisor is
        disjoint from D12. Then every component r_R(t_a) is nonzero,
        gcd(g_I,r_R)=1, and r_R is a unit in A5. Dynamic evaluation obtains no
        early zero divisor. Any componentwise realization performs B
        degree-B^2 tests, while any faster certification must instantiate the
        aggregate target-label common-factor operation explicitly.
      claim_boundary: >-
        This mutation falsifies branching-only speedups; it is not a lower
        bound against a new aggregate or representation-sensitive algorithm.
    - id: "RT-C4-WITNESS-REPLAY"
      type: "exact_semantics_control"
      statement: >-
        A positive subset-stable existence predicate supports one labelled
        witness by bisecting one source node at a time. The total is
        sum_i ceil(log_2 |F_i|)=O(log B) calls plus direct group verification.
        Every call, including negative child calls, belongs to online time.

  counterexample_or_mutation:
    overbroad_small_quotient_counterexample: >-
      Known canonical scalar representatives admit exact integer modular
      hashing with carries even though the prime-order point group has no
      proper nontrivial homomorphic quotient. Therefore the quotient lemma
      cannot rule out all small-range hashes or all algorithms. The circular
      point step is extracting log_P(R) mod m from a fresh R.
    pczt_e_mutation: >-
      Replace the word "PCZT-E" by its decision contract. The statement then
      reads: given the Query2P1 preprocessing and online inputs, decide exactly
      whether the Query2P1 relation exists and return its witness. The only
      remaining syntax, K_R(U), expands to the same (u,v,a) leaves or assumes a
      translated-divisor common-root macro. This identity mutation leaves the
      operation unchanged and falsifies claimed reduction progress.

  baseline_comparison:
    frozen_scaling:
      N: "B^5"
      setup_time_and_retained_advice_cap: "B^(9/4+o(1)) = N^(0.45+o(1))"
      online_time_and_workspace_cap: "B^(5/4+o(1)) = N^(0.25+o(1))"
      pollard_rho: "B^(5/2+o(1)) = N^(0.5+o(1))"
      bsgs: "B^(5/2+o(1)) time and memory for a full DLP"
    pair_indexes:
      construction_time: "O(B^2 log^2 B) = B^(2+o(1))"
      retained_occurrence_advice: "O(B^2 log^2 B) = B^(2+o(1))"
      semantics: >-
        This charge is target independent and covers ordered source labels and
        canonical ancestor-node pairs; it does not include R or online divisor
        translations.
    standard_query_routes:
      point_or_split_norm: "B^3 = N^0.6 work"
      pair_pair_convolution: "B^4 = N^0.8 work or state"
      dense_five_deck_quotient: "B^5 = N work or state"
    indexing_recomputations:
      DG_single_target: >-
        n=B^2 gives P=B^4, S=B^(5-2*delta), T=B^(2*delta). T<=B^(5/4)
        forces delta<=5/8 and S>=B^(15/4).
      DG_fifth_sweep: >-
        B shifted queries cost B^(1+2*delta). The cap forces delta<=1/8,
        so S>=B^(19/4); preprocessing remains B^4.
      DG_asymmetric: >-
        n=B^2 and m=B^3 give P=B^5, S=B^(6-2*delta), T=B^(2*delta).
        The query cap gives S>=B^(19/4).
      DG_k_sum: >-
        Four summands use k=5 and at delta=1 give P=B^4, S=B^(7/2), T=B;
        five summands use k=6 and give P=B^5, S=B^(9/2), T=B.
      KPS_pair_universes: >-
        n=B^2 gives P=B^4 and Q=B^3. Known-C state is B^3 but fresh R
        violates known-C preprocessing; unknown-C state is B^4.
      KKMVW_pair_universes: >-
        n=B^2 gives P=B^4, S=B^(4-4*epsilon/3), and
        Q=B^(3+2*epsilon). Minimum state exponent is 10/3 and minimum query
        exponent is 3, attained at different endpoints of the tradeoff.
    conditional_mpz_control: >-
      Advice ell=B^(9/4+o(1)) bits after word-size suppression and main
      interactions k=B^(5/4+o(1)) give ell*k^2=B^(19/4+o(1))<B^5=N.
      This conflicts with constant-success MPZ extraction only if a complete
      generic DLP extraction reduction is supplied.

  smallest_non_tautological_residual:
    name: "target-label zero-divisor/common-factor operation"
    public_preprocessing: >-
      Source-labelled dyadic pair-divisor trees for D12 and D34, plus a
      squarefree fifth-occurrence label tree; R is absent.
    online_input: >-
      Fresh R and one canonical dyadic node for each I1,...,I5.
    exact_object: >-
      In A5=F_p[T]/g_I(T), let A_I(T) interpolate the complete signed fifth
      point. Let r_R(T) be the complete elliptic intersection resultant of
      D12 with (tau_{R-A_I(T)} o [-1])_*D34, reduced modulo g_I(T), with all
      chart, saturation, multiplicity, and occurrence-label data retained.
    required_output: >-
      Return z_R(T)=gcd(g_I(T),r_R(T)), or an equivalent nontrivial factor or
      unit certificate. Its degree is at most B. A nonconstant z_R identifies
      exactly the fifth labels extendible to a selected pair-pair relation.
    why_narrower: >-
      Unlike PCZT-E, this operation has an explicit algebraic output whose
      correctness can be checked componentwise and whose standard dense input
      and output representations can be costed. Given z_R, source-labelled
      dyadic pair replay and direct group verification are separate steps.
    current_status: >-
      Unconstructed. Standard coefficient, resultant, quotient-ring, norm,
      triangular, power-projection, and componentwise realizations expose
      B^3 traffic. A representation-sensitive algorithm producing z_R without
      that traffic remains explicitly outside the negative.

  operation_level_deduplication:
    P1513: >-
      Translated elliptic pair-divisor product, common-root/common-factor
      localization, and standard B^3 norm/resultant traffic. PCZT-E's K_R
      syntax is this operation with the locator left as a macro.
    P1551: >-
      Exact endpoint coefficient or existence aggregation plus labelled source
      unranking. PCZT-E's exact decision and witness contract is this missing
      oracle, not a new representation.
    P1516: >-
      Target-independent B^2 pair states with a missing target-local collision
      router. Query2P1 and PCZT-E request that same router for two pair decks
      and one fifth deck.
    IDEA_138: >-
      Witness self-reduction from a supplied nonzero conditional predicate.
      O(log B) replay is useful but does not construct the predicate.
    IDEA_156: >-
      Exact conditional coefficient/existence oracle over a finite source
      grid. A compact predicate followed by source conditioning is the same
      information flow.
    IDEA_199: >-
      Endpoint coefficient access and exact source unranking from a compact
      transform. Backend changes do not remove the missing coefficient deck.
    IDEA_266: >-
      Dynamic zero-divisor splitting and triangular source branching after a
      represented algebra is supplied. Branching redistributes represented
      degree and gives no no-relation worst-case gain by itself.

  primary_literature_checks:
    - id: "DG-v2"
      source: "https://arxiv.org/abs/2512.04258v2"
      checked: >-
        Theorem statements and version date support the producer's 3SUM and
        kSUM advice/query exponents, near-quadratic or n^(k-1) preprocessing,
        and fixed-list single-challenge semantics. They do not supply dyadic
        subset-universe queries or an elliptic relation map.
    - id: "KPS-v3"
      source: "https://arxiv.org/abs/2410.16784v3"
      checked: >-
        The paper preprocesses integer universes, accepts source subsets, and
        removes modular false positives by an explicit integer congruence
        list. It supports the B^4 preprocessing and B^3 query substitution,
        not nonadditive elliptic coordinate hashing.
    - id: "KKMVW-v1"
      source: "https://arxiv.org/abs/2602.11363v1"
      checked: >-
        Theorem 1.1 supports the stated preprocessing, space/query tradeoff,
        high-probability guarantee, and oblivious-adversary limitation.
    - id: "MPZ-2020-996"
      source: "https://eprint.iacr.org/2020/996"
      checked: >-
        Theorem 3 and Corollary 3 give success at most
        3*ell*(k+1)^2/N in their preprocessing extraction models. Theorem 2
        and Corollary 2 supply the N^(1/3) advice/main upper controls up to
        logarithmic factors. No Query2P1 or coordinate lower bound follows.
    - id: "Semaev-2004-031"
      source: "https://eprint.iacr.org/2004/031"
      checked: >-
        Summation-polynomial vanishing asserts existence of compatible points
        for x-coordinates; it does not preserve the supplied signed occurrence
        labels without extra equations and chart handling.
    - id: "KU-2011"
      source: "https://users.cms.caltech.edu/~umans/papers/KU08-final.pdf"
      checked: >-
        The modular-composition input is a represented polynomial over a
        specified finite ring. It does not grant one constant-cost gate for a
        parameterized translation of an entire degree-B^2 divisor.
    - id: "DMSWX-2005"
      source: "https://users.math.msu.edu/users/wenyuanwu/papers/Lifting_DMSWX.pdf"
      checked: >-
        Dynamic evaluation and lifting operate on a supplied zero-dimensional
        polynomial system or triangular representation. They do not construct
        the Query2P1 source algebra or erase its total no-relation work.

  narrowest_supported_statement: >-
    Two target-independent source-labelled dyadic pair indexes fit
    B^(9/4+o(1)) setup and retained advice. The named integer-indexing
    transplants lack both the frozen exponents and an exact additive map from
    fresh elliptic points; standard elliptic point, resultant, norm,
    quotient-ring, and dynamic component realizations cost B^3 or B^4.
    Known-scalar carry hashing remains exact and is not contradicted by the
    homomorphic-quotient lemma. No exact all-strata Query2P1 algorithm is
    constructed. PCZT-E adds no reduction progress, while an explicit
    representation-sensitive target-label zero-divisor/common-factor
    algorithm remains untested.

  next_concrete_action: >-
    Under existing P1553/P1513/P1551/P1516 ownership, replace PCZT-E by one
    theorem-only specification of the target-label zero-divisor/common-factor
    operation z_R(T)=gcd(g_I(T),r_R(T)); either give a complete-chart,
    source-labelled algorithm that constructs z_R from the dyadic pair trees
    within B^(9/4+o(1)) preprocessing/advice and B^(5/4+o(1)) total online
    time/workspace including replay, or preserve it as the sole explicit
    representation-sensitive exception with the B^3 standard route charged.

