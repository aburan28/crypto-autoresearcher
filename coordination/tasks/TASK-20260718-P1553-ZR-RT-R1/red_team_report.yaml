schema_version: "p1553-zr-red-team-v1"
red_team_report:
  id: "RT-20260718-P1553-ZR-R1"
  task_id: "TASK-20260718-P1553-ZR-RT-R1"
  role: "red-team"
  as_of_utc: "2026-07-18"
  run_accounting:
    experiments_executed: 0
    solvers_executed: 0
    fixtures_executed: 0
    timing_runs_executed: 0
    relation_campaigns_executed: 0
    maximum_runs_consumed: 0

  terminal_scoped_verdict:
    code: >-
      REVISE_SCOPED_NEGATIVE_NAMED_REPRESENTED_ALGEBRA_ROUTES__EXACT_ZR_SEMANTICS_PASS__AMBIENT_PROJECTION_PROPER_NOT_FINITE__COMPACT_ORBIT_LOCATOR_UNSUPPLIED__NO_RUN__NO_P1554__NO_BREAKTHROUGH
    classification: "revise_scoped_negative"
    producer_semantics_reconstructed: true
    producer_cost_boundary_reconstructed: true
    producer_requires_correction: true
    constructor_inside_frozen_rectangle: false
    statement: >-
      The complete signed target-label factor is semantically exact. The
      ambient map E_K x Spec(A_I) -> Spec(A_I) is proper, not finite; only its
      restriction to the finite intersection subscheme is finite. Every named
      represented route restores B^(3+o(1)) online work before the final gcd or
      assumes the missing residue. No general lower bound follows, and the
      compact fifth-orbit locator remains unconstructed.
    breakthrough_claim: false
    shoup_bound_claim: false
    p1554_allocated: false
    contract_created: false
    experiment_created: false
    run_created: false

  algebra_reconstruction:
    masks:
      left_identity: "b_Pinf=o_P"
      right_identity: "b_Qinf=(1-o_P)o_Q"
      finite_flag: "f=(1-o_P)(1-o_Q)"
      vertical: "b_vert=f*eq(x_P-x_Q)*eq(y_P+y_Q)"
      tangent: "b_tan=f*eq(x_P-x_Q)*eq(y_P-y_Q)*(1-eq(y_P+y_Q))"
      secant: "b_sec=f*(1-eq(x_P-x_Q))"
      zero_test: "eq(d)=1-d^(p-1) on F_p-valued split components"
      verified_properties:
        - "the masks are disjoint and sum to one on curve points"
        - "P=Q with y=0 is vertical, not tangent"
        - "tangent and secant denominators are inverted only under nonzero masks"
        - "identity, infinity, vertical, tangent, secant, repeated, and nonreduced strata remain"
    signed_key:
      field: "K=F_p[theta]/h(theta), h irreducible cubic"
      definition: "kappa([x:y:1])=x+theta*y and kappa(O)=theta^2"
      injective: true
    resultant_biconditional: >-
      r_R(t_a), up to a fixed sign, is the product over labelled u,v of
      kappa(u)-kappa(R-a-v), so it vanishes exactly when u+v+a=R for at least
      one labelled pair-pair occurrence.
    multiplicity_boundary: >-
      g_I is squarefree in fifth occurrence labels. Pair intersection length
      and row multiplicity remain in effective divisors and labelled sidecars;
      z_R records an extendible fifth label once and does not encode c_a.
    coefficient_completeness: "semantic_only"
    coefficient_cost: >-
      Masks and split interpolation define all components of H_34^R but do not
      construct its Theta(B^3) target-dependent represented coefficients cheaply.

  fitting_correction:
    ambient_projection: "projective_and_proper_not_finite"
    finite_map: >-
      For Z=D_12 intersection D_34^R, Z is closed in the finite divisor
      D_12 x Spec(A_I), so Z -> Spec(A_I) is finite.
    module: "M_R=(pi|_Z)_* O_Z=pi_* O_Z"
    component_rule:
      nonextendible_label: "(M_R)_a=0 and Fitt_0 component is the unit ideal"
      extendible_label: "(M_R)_a is nonzero and Fitt_0 component is the zero ideal"
    generator: "Fitt_0(M_R) is generated by z_R mod g_I in A_I=product_a K"
    resultant_relation: "r_R has the same zero components and gcd(g_I,r_R)=z_R"
    nonreduced_rule: "intersection length changes module length, not label support"
    cost_boundary: >-
      Standard finite and Sylvester presentations have degree or row scale n
      over width m and expose n*m=B^3 coordinates. This is not a lower bound
      against compact presentations.

  route_audit:
    common_preprocessing_state: "P/S=2/2"
    routes:
      - route: "component_resultants"
        q_w: "3/2"
        result: "B degree-B^2 tests; the no-relation control evaluates all nonzero components"
      - route: "quotient_ring_resultant"
        q_w: "3/3 explicit"
        result: "represented width n*m=B^3; recomputation only trades memory for work"
      - route: "multipoint_remainder_trees"
        q_w: "4/4 for dense eliminant; 1/1 only after residue"
        result: "accelerates supplied coefficients and does not construct r_R"
      - route: "transposed_truncated_resultant"
        q_w: "3/2"
        result: "favorable k*d=B*B^2=B^3; transposition is linear and factor location is not"
      - route: "sylvester_cauchy_displacement"
        q_w: "3/2..3"
        result: "split generators and target updates retain n*m scalar coordinates; hits are singular"
      - route: "modular_composition_power_projection"
        q_w: "3/3"
        result: "coefficient-ring bit width and triangular dimension remain B^3"
      - route: "half_gcd_subresultants"
        q_w: "3/2 before residue; 1/1 after"
        result: "fast only once r_R is represented"
      - route: "dynamic_splitting_no_relation"
        q_w: "3/2"
        result: "r_R is a unit componentwise, so no zero divisor permits an early split"
      - route: "provenance_forest"
        q_w: "root Q=3, W>=2"
        result: "propagates a supplied factor but does not construct the root factor"

  orbit_mutation:
    fifth_deck: "A_j=A_0+[j]T for 0<=j<B"
    explicit_cost: "n*B=B^3"
    optimistic_recurrence_envelope: "n*sqrt(B)=B^(5/2)"
    correction: >-
      B^(5/2) is only a favorable envelope conditional on a supplied compact
      polynomial- or rational-coefficient recurrence. It is not an established
      elliptic orbit algorithm and remains above the B^(5/4) online cap.
    searched_routes:
      - "ordinary product and remainder trees"
      - "elliptic-net term recurrences"
      - "division-polynomial recurrences"
      - "dyadic subinterval product and unit tests"
    surviving_exception: >-
      An unproved oracle-free, gauge-invariant nonlinear or variable-coefficient
      elliptic-net or division-polynomial operation that returns z_R or exact
      dyadic unit products, including all-negative replay, without a degree-B^2
      target vector, B^3 translated endpoints, or supplied resultant terms.

  controls:
    - id: "RT-ZR-C1-SEPARABLE"
      type: "favorable_exactly_separable"
      result: >-
        Exactly one simple finite fifth label a_0 has one labelled u_0,v_0 and
        every other difference is nonzero, so z_R=T-t_a0.
    - id: "RT-ZR-C2-NO-RELATION"
      type: "adversarial_unit"
      result: "All component resultants are units, M_R=0, Fitt_0(M_R)=A_I, and z_R=1."
    - id: "RT-ZR-C3-NONREDUCED"
      type: "collision_tangency_nonreduced"
      result: >-
        Repeated endpoints and vertical, tangent, identity, or infinity
        branches give positive intersection length and one fifth-label factor;
        row multiplicity remains sidecar data.
    - id: "RT-ZR-C4-TARGET-FRESHNESS"
      type: "fresh_target_mutation"
      result: >-
        Replacing R after preprocessing forces every target-dependent
        coefficient or resultant to be rebuilt. Scalar residues, target caches,
        target-trained pointers, and precomputed target orbits are forbidden advice.

  conditional_complete_path:
    status: "conditional_only"
    setup: "B^2"
    relation_queries: "B targets times B^(5/4)=B^(9/4)"
    sparse_linear_algebra: "B^2"
    masked_descent: "B^(5/4)"
    exponents:
      lambda: "max(2/5,9/20,2/5,1/4,1/5)=0.45"
      mu: "max(2/5,1/4,1/5)=0.40"
    missing_assumptions:
      - "the subset-stable constructor including every positive and negative replay"
      - "constant verified relation and target success"
      - "collision and deck-rebuild accounting"
      - "Theta(B) independent rows"
      - "factor-log completion and verification"
      - "identical scalar-blind masked descent"
      - "complete bit-time and bit-memory accounting"

  operation_level_dedup:
    - "P1513/IDEA-121 owns compact pair products to nonlinear common-factor location to labelled replay"
    - "IDEA-063 owns post-factor remainder and subresultant propagation"
    - "IDEA-071 owns supplied Cauchy and displacement determinant reporting"
    - "IDEA-199 owns endpoint-coefficient access followed by source unranking"
    - "IDEA-266 owns splitting after a represented source algebra exists"
    - "IDEA-322 owns supplied resolvent and Woodbury updates, not singular-hit source inversion"
    - "P1540 owns constant recurrence, Hankel, QRT, and supplied net-term controls"
  new_idea_owner_allocated: false

  claim_boundary:
    no_unrestricted_lower_bound: true
    not_claimed:
      - "an arithmetic- or Boolean-circuit lower bound"
      - "a data-structure, word-RAM, or cell-probe lower bound"
      - "a coordinate or generic-group lower bound"
      - "a Shoup lower bound"
      - "an ECDLP lower bound"

  exactly_one_next_action: >-
    Under existing P1553/P1513/P1551/P1516 ownership, require one theorem-only
    specification of an oracle-free, gauge-invariant constructor for r_R mod
    g_I or exact dyadic subinterval unit products within total B^(5/4+o(1)),
    including all strata and replay; otherwise preserve the exception unchanged.

