      attack SD-2.
    - >-
      HEURISTIC CLAUSES: as stated per HEUR-HARVEST-FV-1 and -2. A falsification
      of either removes the conditional pricing of the membership-test class.
      It does not touch the model or generic layers.
    - >-
      SCOPE: any exhibited coordinate-reading harvester (summation polynomial,
      approximate filter) below c sqrt(K l) does NOT falsify this hypothesis,
      which is silent there. It falsifies HEUR-HARVEST-FV-2 only if it lies in
      A_FV. It routes to rule-12 per DEC-20261001-5c9e7a R3 mandatory_revisit.

