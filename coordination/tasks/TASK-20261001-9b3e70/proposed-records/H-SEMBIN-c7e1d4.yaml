  falsification_conditions:
    - >-
      MODEL LAYER: any v2 primary cell violating P1 or P2 with C-IMPL-GATE
      passing. This is an arithmetic defect in the model or the driver; it is
      reported as one and is never a result.
    - >-
      GENERIC LAYER: an exhibited algorithm in class G (G1-G4) whose first
      non-trivial relation costs fewer than c sqrt(l) group operations would
      contradict Shoup's theorem and is therefore expected only as a defect in
      the class definition. The live falsifier is a defect in G1-G4 itself: an
