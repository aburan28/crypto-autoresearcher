  heuristic_assumptions:
    - id: HEUR-HARVEST-FV-1
      formal_statement: >-
        See proposed-records/heuristic-restatement.md section 4. For F = F_V
        and a closure-matched uniformly random list F* of the same size, the
        non-trivial 2-sum coincidence count N_2 and the m-decomposition count of
        a uniformly random target (m in {3, 4}) have the same Poisson
        distributions, within the stated test.
      random_model_justification: >-
        Poisson approximation for sparse sums of weakly dependent indicators of
        probability 1/l, for random lists. The assumption is that x in V adds no
        additive structure beyond negation and pi.
      supporting_results:
        - ref: "Poisson approximation of sparse random sums (classical)"
          provenance: recalled
          claim: pointer only; backs nothing
          verified_by: null
        - ref: "Diem; Petit-Quisquater decomposition-probability heuristic |F|^m/(m! #G)"
          provenance: recalled
          claim: pointer only; backs nothing
          verified_by: null
      validation_experiment_ids: []
      validation_plan: >-
        heuristic-restatement.md section 5: V1 (N_2, toy, exhaustive, closure-
        matched null, arithmetic-progression positive control, KS and Poisson
        tail with Bonferroni correction); V2 (decomposition counts); V3 (n = 131
        and 163, D = 16, predicted N_2 = 0; weak, disclosed).
      falsification_condition: >-
        A departure from the F* null at p < 10^-3 (Bonferroni), with the null
        calibrated and the positive control detected; or a largest-count tail
        beyond the Poisson tail at p < 10^-3.
      status: unvalidated
    - id: HEUR-HARVEST-FV-2
      formal_statement: >-
        For every harvester in A_FV (G plus a unit-cost membership test x(Q) in
        V, plus a unit-cost pi on Koblitz curves), outputting K = |F| + 2
        full-rank relations with fill charged costs T >= (1/8) K sqrt(l /
        min(M, K)) at peak memory M. On Koblitz curves with sigma-stable V,
        replace l by l/(2n).
      random_model_justification: >-
        List-only part: the multiple-DL generic bound (Yun 2015; Hhan 2024 Thm
        3.4; KR-RHO-46c2c6), conditional on the K-of-L step, and Dinur 2020's
        T^2 S bound (KR-RHO-7d93f6, random-function model), met by PCS batching.
        Membership part: each test on a non-formal element succeeds with
        probability |F|/l (clause 1 at m = 1), so relations <~ T|F|/l + T^2/l
        (sketch, unreviewed). It is consistent with IDEA-20260807-070d03's arity-1
        result.
      supporting_results:
        - ref: KR-RHO-46c2c6
          provenance: internal
          claim: L discrete logs cost about sqrt(2 L n), tight by Yun 2015
          verified_by: TASK-20261001-9b3e70 (row read)
        - ref: "Yun, ePrint 2014/637 (EUROCRYPT 2015)"
          provenance: retrieved
          claim: tight generic lower bound for n DL instances, O(sqrt(n p)) algorithms optimal (abstract only)
          verified_by: TASK-20261001-9b3e70 (abstract page read)
        - ref: "Hhan, arXiv 2402.11269, Thm 3.4"
          provenance: retrieved
          claim: "m-MDL success probability O((e(T+2m+1)^2/(2m|G|))^m), Maurer model"
          verified_by: TASK-20261001-9b3e70 (arXiv HTML read)
        - ref: KR-RHO-7d93f6
          provenance: internal
          claim: T^2 S = Theta~(C^2 N) for C collisions (Dinur 2020), PCS optimal
          verified_by: TASK-20261001-9b3e70 (row read; sources abstract-read)
        - ref: IDEA-20260807-070d03
          provenance: internal
          claim: a free arity-1 membership oracle yields rho, N/(2 sqrt L) draws
          verified_by: TASK-20261001-9b3e70 (relevant lines read)
      validation_experiment_ids: []
      validation_plan: >-
        heuristic-restatement.md section 5 V4 (toy harness with five arms on one
        op counter, the closure-matched null arm, at least 30 instances per cell,
        1% quantile tail check). Not carded.
      falsification_condition: >-
        An exhibited harvester in A_FV below the stated line at some tested
        (n, D, M), over at least 30 instances, with the 99% upper confidence
        bound below the line and the harness's PCS arm within a factor of 2 of
        4 K sqrt(l/w).
      status: unvalidated
    - id: HEUR-VOW-CURVE
      formal_statement: >-
        Inherited unchanged from H-SEMBIN-97ea23, as H-SEMBIN-8e7ae3 carried it.
        It is used only for the VOW column's constant 0.886 in the model layer
        (KN-LIT-73f7e1 notes that 0.886 includes a negation map not present in
        the vOW paper).
      random_model_justification: as recorded in H-SEMBIN-97ea23
      supporting_results:
