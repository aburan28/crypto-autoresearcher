          provenance: retrieved
          claim: vOW eq. (5), sqrt(pi p / 2) without negation
          verified_by: coordinator session per KN-LIT-73f7e1 header
      validation_experiment_ids: []
      falsification_condition: as recorded in H-SEMBIN-97ea23
