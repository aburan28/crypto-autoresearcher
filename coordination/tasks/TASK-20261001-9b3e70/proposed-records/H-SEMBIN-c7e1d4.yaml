  statement: >-
    CONDITIONAL, TWO LAYERS.

    (MODEL LAYER) Within the cost model of EXP-SEMBIN-04ec3c protocol version 2
    (specification.yaml plus AMD-20261001-e61f2b), with the oracle table's
    construction charged at one operation per entry, consider an m-summand index
    calculus on a binary curve of prime extension degree n in {97, 109, 131,
    163, 191, 233, 239, 283, 409, 571}. For every table-based or enumeration
    oracle law of that model (ENUM, MITM, MITM_CAPPED), every m >= 2, every d,
    every s <= floor(m/2) and every store budget, the cell's total operation
    count is at least 1 + (N + log2 m! + d)/2 bits. That exceeds the van
    Oorschot-Wiener column log2(0.886) + N/2. So no cell is below that column.
    This is the algebraic identity PROBE + FILL = N + log2 m! + d, i.e. RC x
    store = K m! N.

    (GENERIC LAYER) For relation harvesters in the generic class G of
    COR-GEN, every harvester makes at least c sqrt(l) generic group operations
    before its first non-trivial relation, at any memory. The class is defined
    as: Shoup's model with encodings visible; the factor base given as a list
    of handles, with membership decided only by lookup; and a guarantee that
    holds for a uniformly random list closed under the automorphisms the
    algorithm can detect generically (negation; [lambda_pi] on Koblitz curves).
    Here l is the prime subgroup order and c > 0 is an absolute constant that
    no source opened by this program states numerically. So no generic-class
    index calculus is below c sqrt(l) at any memory. This is a corollary of
    Shoup 1997 via Wagner 2002 Cor. 1 (Dai's reduction), NOT of
    HEUR-GENERIC-MSUM and NOT of HEUR-HARVEST-FV, and its sota_delta is 0.

    SILENT on every oracle that reads the curve's coordinates: membership
    tests x(P) in V (priced only conditionally, under HEUR-HARVEST-FV-2);
    Weil-descended summation polynomials; approximate F_2-linear x-coordinate
    filters; trace and halving tests; Frobenius applied by squaring beyond
    orbit bookkeeping; the Riemann-Roch oracle; and the preprocessing reading
    in which the table is amortised over many instances. Nothing here is a
    statement about any curve's security in either direction.

  statement_differences_from_R6:
    - id: SD-1
      what: >-
        R6 says "no cell ... below the vOW column 0.886 sqrt(N) ... for generic
        algorithms at large it is a corollary of Shoup". Here this is split into
        a MODEL layer, which is constant-exact, and a GENERIC layer, which is
        Omega(sqrt l) with an unspecified constant.
      reason: >-
        Shoup's bound is asymptotic. Hhan 2024 Thm 3.3 (retrieved) states it as
        O(T^2/|G|), and no source opened states the constant. Generic constants
        differ by algorithm (KR-RHO-fbd7b1). So "below 0.886 sqrt(N)" is not a
        consequence of Shoup for generic algorithms at large. It holds inside
        the model, by identity. DERIVATION.md section 3.4 item 1.
    - id: SD-2
      what: >-
        R6's class definition ("touches the group only through group operations
        and equality of encodings, and treats the factor base as an unstructured
        list") is replaced by COR-GEN's conditions G1-G4.
      reason: >-
        Dai's reduction needs the algorithm to succeed on random
        known-representation lists. The list must carry the closure (negation,
        pi) that a generic algorithm can detect in F_V. Shoup's model, not
        Maurer's, is needed for tables and hashing. Membership must be by lookup
        only. DERIVATION.md section 3.2 and section 3.4 items 2-3.
    - id: SD-3
      what: >-
        The "2 <= m <= 16" range is dropped from the model layer. It is kept as
        the frozen-fixture range of the v2 receipt.
      reason: >-
        The identity holds for every m >= 2 and every s (J1 analytic_floor:
        "for every m, d and s, not only m <= 16").
    - id: SD-4
      what: >-
        Added: the conditional pricing of the membership-test (semi-generic)
        class, and the preprocessing exclusion.
      reason: >-
        R6's "SILENT on ... membership tests" leaves the family's own ENUM row
        ambiguous: the contract's ENUM "test whether the remainder lies in F" is
        generic by lookup and non-generic by x-test. The preprocessing reading
        is governed by Corrigan-Gibbs-Kogan, not Shoup (KN-LIT-013;
        KR-RHO-ea34b8).

  mechanism: >-
    In the model, every table-based oracle trades probe time against table
    fill along a fixed product: 2^PROBE * 2^FILL = m! N |F|. With the fill
    charged, AM-GM puts the total at or above 2 sqrt(m! N |F|) >= 2 sqrt(N).
    The v1 sub-rho cells existed only because the fill was not charged; each
    needed fewer than one oracle call and a table larger than rho's whole work
    (DEC-20261001-5c9e7a R1; J1 S6). Outside the model, any harvester that
    treats F as an unstructured list can be handed a random list with known
    representations, and Dai's reduction then turns its first non-trivial
    relation into the discrete logarithm. Shoup's bound prices that at
    Omega(sqrt l) operations at any memory. Per-relation costs below sqrt(l) are
    NOT excluded and are achieved by amortisation (PCS batching). Only the total
    is bounded: by c sqrt(l), and by c sqrt(K l) for K relations, conditional on
    the K-of-L step (DERIVATION.md section 2.3).

  assumptions:
    - >-
      Unit cost: one operation per group operation, field operation, probe,
      table write or multiply-add (the v1/v2 unit, declared optimistic for index
      calculus; blind S4).
    - >-
      Single-instance accounting: the table is built per DL instance and its
      build is charged.
    - >-
      N per degree as in the v2 header: log2 r ~ 129.000 at n = 131, and n
      elsewhere (cofactor sensitivity at most 2 bits; J1 S7).
    - >-
      Generic layer: Wagner 2002 Cor. 1 as retrieved by TASK-20260928-62ad14.
      Not re-read by this author; the PDF was not text-extractable in this
      session.

  proof_search_map:
    bottleneck: >-
      The interface step "a harvester that treats F as an unstructured list
      succeeds on a random closure-matched known-representation list" (G3).
      Without it, COR-GEN does not bind F_V, and the statement falls back to the
      model layer plus HEUR-HARVEST-FV.
    baseline_embedding:
      parameter_slice: >-
        K = 1 relation, list with known logs, table M with probes l/M: TOTAL =
        M + l/M >= 2 sqrt(l) at M = sqrt(l). That is BSGS, the generic optimum's
        existence proof. It is identity (M1) with log2 m! = 0 and K = 1. The PCS
        harvester at K -> 1 reproduces vOW rho sqrt(pi l / 2) (KN-LIT-73f7e1
        eq. (5)).
      reproduction_check: >-
        Symbolic, scratch (DERIVATION.md section 2.6). The model-layer numbers
        are to be checked against the v2 receipt's frozen fixture by the
        reviewing round, not by this author (this task may not read v2 outputs).
        E-2 margins (+16.54 ... +42.70 bits) are reviewer-derived expectations,
        quoted, not measured.
    observation_collision:
      observable: >-
        The model cell (TOTAL, store) and the verdict "below the VOW column".
      distinct_preimage_search: >-
        FOUND (J2 proves-too-much, TASK-20260928-3f90b8). The same accounting
        with the same yield formula gives "no sub-rho cell" on the generic group
        and "sub-rho cells" on F_q^* and on genus-g Jacobians. The verdict flips
        on the oracle class alone. Second collision (DERIVATION.md section 3.3):
        ENUM by lookup and ENUM by x-test have the same TOTAL and different
        class membership. The oracle class must therefore be part of the claim,
        and it is (G1-G4; the SILENT list).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the generic layer to Dai's reduction: the harvester's first
          non-trivial relation becomes a DL solution against a known-
          representation list.
        predicted_gain: >-
          The generic conclusion needs no heuristic (sota_delta 0, cited).
      - transform: stronger_invariant
        proposed_object: >-
          Harvesting invariants (total T against c sqrt(K l); T^2 M against
          K^2 l) instead of the per-target (time, store) law.
        predicted_gain: >-
          A heuristic (HEUR-HARVEST-FV) that a 1999 generic algorithm does not
          already contradict, and that is validatable.
    quantifier_order: >-
      MODEL LAYER: FOR ALL n in the ten degrees, m >= 2, d >= 0, s <=
      floor(m/2), B: TOTAL >= 1 + (N + log2 m! + d)/2. Deterministic; no
      witness depends on anything. GENERIC LAYER: EXISTS c > 0 such that FOR
      ALL l prime, FOR ALL H in G (G1-G4), FOR ALL memory: T_first(H) >= c
      sqrt(l) - O(list size). The constant is uniform and unstated numerically.
      HEURISTIC LAYER (HEUR-HARVEST-FV-2): FOR ALL tested (n, D, M), FOR ALL H
      in A_FV: T(H) >= (1/8) K sqrt(l / min(M, K)). The witness H may depend on
      (E, V). The constant 1/8 is fixed in advance.
    method_ceiling:
      strongest_certifiable_claim: >-
        Generic class: no sub-rho index calculus at any memory (sota_delta 0
        against KN-LIT-011). Model: no sub-VOW cell, by identity. Nothing about
        coordinate-reading oracles.
      nearby_object_control: >-
        (a) F_q^* and genus-g Jacobians (J2): the conditional statement holds
        there, and the unconditioned reading is false. The method separates them
        only through the oracle class, which is what it should do. (b) PCS
        batching on the same curve: it crosses the per-relation sqrt(l) line and
        the T*M line but not the total c sqrt(l) line. This confirms that the
        statement's invariant is the total.
    proof_obligations:
      - claim: identity PROBE + FILL = N + log2 m! + d for every table model
        responsibility: baseline
      - claim: AM-GM floor exceeds the VOW column by at least 1.17 + (log2 m! + d)/2 bits
        responsibility: size
      - claim: Dai's reduction with a closure-matched list (negation; [lambda]) and the non-trivial-relation form
        responsibility: interface
      - claim: list building and target generation are paid by any index calculus
        responsibility: runtime
      - claim: Shoup-model, not Maurer-model, statement needed for hashing algorithms
        responsibility: scope
      - claim: preprocessing reading excluded (KN-LIT-013)
        responsibility: scope
    not_applicable_reason: null

