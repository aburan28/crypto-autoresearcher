    citation: "Itai Dinur and Alexander Golovnev, Improved Time-Space Tradeoffs for 3SUM-Indexing, arXiv:2512.04258v2"
    url: "https://arxiv.org/abs/2512.04258v2"
    version_checked: "v2, revised 2026-04-23"
    exact_controls:
      symmetric_3sum_indexing: "S=~O(n^(2.5-delta)), T=~O(n^delta), 0<=delta<=1, preprocessing ~O(n^2)"
      asymmetric_3sum_indexing: "S=~O(n^(1.5-delta)*m), T=~O(n^delta) for n<=m; the construction is efficient"
      ksum_indexing: "S=~O(n^(k-0.5-delta)), T=~O(n^delta), preprocessing ~O(n^(k-1))"
