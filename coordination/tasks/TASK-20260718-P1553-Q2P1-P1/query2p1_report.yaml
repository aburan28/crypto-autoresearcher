  - id: "KPS-v3"
    citation: "Shashwat Kasliwal, Adam Polak, and Pratyush Sharma, 3SUM in Preprocessed Universes: Faster and Simpler, arXiv:2410.16784v3"
    url: "https://arxiv.org/abs/2410.16784v3"
    version_checked: "v3, revised 2025-10-15"
    exact_controls:
      known_C: "P=O(n^2), S=O(n^1.5 log n), Q=O(n^1.5 log n), randomized Las Vegas; deterministic polylog variant"
      unknown_C: "P=O(n^2), S=O(n^2), Q=O(n^1.5 log n); deterministic P=O(n^2 log n), Q=O(n^1.5 log^3 n)"
      query_semantics: "Subsets A',B' and up to n targets C'; integer addition with modular false positives explicitly removed."
  - id: "KKMVW-v1"
    citation: "Yael Kirkpatrick, John Kuszmaul, Surya Mathialagan, and Virginia Vassilevska Williams, Preprocessed 3SUM for Unknown Universes with Subquadratic Space, arXiv:2602.11363v1"
    url: "https://arxiv.org/abs/2602.11363v1"
    version_checked: "v1, submitted 2026-02-11"
    exact_controls:
      tradeoff: "P=~O(n^2), S=~O(n^(2-2*epsilon/3)), Q=~O(n^(1.5+epsilon)), 0<=epsilon<=1/2"
      probability: "Randomized, high probability, with query-time guarantee stated for an oblivious adversary."
      query_semantics: "Unknown-C preprocessed integer universes with subset queries."
  - id: "MPZ-2020-996"
    citation: "Ueli Maurer, Christopher Portmann, and Jiamin Zhu, Unifying Generic Group Models, IACR ePrint 2020/996"
    url: "https://eprint.iacr.org/2020/996"
    version_checked: "Primary ePrint PDF, Sections 5.2 and 5.3"
    exact_controls:
      lower: "For prime N, success epsilon is at most 3*advice_bits*(k_main+1)^2/N, hence k_main^2*advice_bits=Omega(epsilon*N)."
      upper: "An extraction algorithm uses ~O(N^(1/3)) advice bits and ~O(N^(1/3)) main operations with constant success, in the stated representation-query model."
      applicability: "Conditional only on a complete reduction to generic DLP extraction in the MPZ model."
  - id: "Semaev-2004-031"
    citation: "Igor Semaev, Summation polynomials and the discrete logarithm problem on elliptic curves, IACR ePrint 2004/031"
    url: "https://eprint.iacr.org/2004/031"
    version_checked: "Primary ePrint"
    exact_control: "The m-th x-coordinate summation polynomial vanishes iff compatible y/sign choices exist whose curve-point sum is zero over the algebraic closure."

lemmas_and_mutations:
  prime_order_small_quotient:
    status: "proved_narrowly"
    statement: >-
      If G is cyclic of prime order N and q:G->H is a group homomorphism,
      then q is constant or injective. Consequently there is no nonconstant
      homomorphic quotient of image size less than N. This statement is only
      about homomorphic quotients and exact predicates that factor through them.
    proof: >-
      ker(q) is a subgroup of G, so its order is 1 or N. In the first case q
      is injective; in the second case q is constant.
    forbidden_overreach: >-
      This does not rule out nonhomomorphic coordinate algorithms, target-local
      data structures, known-scalar integer hashing, or representation-sensitive circuits.
  exact_predicate_factorization_corollary:
    status: "proved_with_explicit_hypothesis"
    statement: >-
      If an exact all-input equality or zero-sum predicate depends on each group
      input only through the same homomorphism q, q must distinguish every group
      element and is therefore injective. The conclusion does not apply when
      extra coordinates, verification, or target-dependent state are retained.
  known_scalar_carry_mutation:
    status: "valid_control_but_circular_on_point_challenges"
    exact_relation_map: >-
      For known canonical representatives x_i,r in [0,N), the relation
      sum_i x_i = r (mod N) is an integer equality sum_i x_i=r+cN for one of
      O(1) wrap values c. Modular integer hashing may preserve candidates by
      enumerating those wraps and the ordinary base-m carries. This uses the
      scalar representatives; kP -> k mod m is not a well-defined homomorphism
      C_N -> Z_m when m does not divide N.
    natural_modulus: "m=B^3"
    point_challenge_cost: >-
      An oracle for r0=log_P(R) mod m leaves r=r0+t*m in [0,N), with
      Theta(N/m)=Theta(B^2) values of t. Since m is invertible modulo prime N,
      R-[r0]P=[t]([m]P); BSGS on the t interval takes ~O(B) group work and
      O(B) memory (or a low-memory interval method with the same exponent).
    conclusion: >-
      Known-scalar carry hashing is a legitimate integer control, but obtaining
      the needed scalar residue of a fresh point challenge is partial DLP and
      cannot be charged as a free Query2P1 quotient.
  mpz_generic_preprocessing_control:
    status: "conditional_escape_test_only"
    frozen_substitution: >-
      advice_bits=B^(9/4+o(1)) and k_main=B^(5/4+o(1)) give
      k_main^2*advice_bits=B^(19/4+o(1))=B^4.75<N=B^5.
    implication: >-
      For constant extraction success, a complete generic-DLP reduction with
      these frozen resources would violate the MPZ preprocessing bound.
    non_implication: >-
      Query2P1 is not itself generic DLP extraction, and concrete coordinates
      are non-generic information. MPZ therefore supplies neither a Query2P1
      lower bound nor a lower bound for coordinate, Semaev, or other non-generic routes.
    escape_requirement: "Any positive complete path at the frozen exponents must be representation-sensitive or must fall outside the MPZ reduction hypotheses."

