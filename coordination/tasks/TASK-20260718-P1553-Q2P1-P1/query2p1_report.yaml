    preprocessing: "~O(n^2)=~O(B^4)"
    space: "~O(n^(2.5-delta))=~O(B^(5-2*delta))"
    query: "~O(n^delta)=~O(B^(2*delta))"
    frozen_query_constraint: "2*delta<=5/4, hence delta<=5/8"
    best_space_under_single_target_cap: "~Omega(B^(15/4))=~Omega(B^3.75)"
