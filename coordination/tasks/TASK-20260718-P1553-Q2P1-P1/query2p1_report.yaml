route_tests:
  nonhomomorphic_coordinate_hashes:
    status: "falsified_as_exact_indexing_transplant"
    tested_maps:
      - "x-coordinate modulo an integer or finite-field modulus"
      - "y-coordinate modulo an integer or finite-field modulus"
      - "compressed or serialized point bytes modulo m"
      - "perfect hashing of materialized endpoints"
    obstruction: >-
      These maps do not satisfy h(A+B)=h(A)+h(B). In particular x(Q)=x(-Q),
      and ordinary coordinate addition is rational with exceptional charts.
      Hash-and-verify can remove false positives only after candidate enumeration;
      in the worst case the B^3 target-minus-fifth endpoint traffic returns.
    exact_relation_map: "none"
    exception: "A representation-sensitive target router using more than a hash remains open."
  exact_characters_and_fourier:
    status: "falsified_for_full_transform_and_truncated_modes"
    exact_formula: "C_R=(1/N)*sum_t chi_t(-R)*product_i(sum_{A in I_i} chi_t(A))"
    coefficient_ring: "A splitting field containing an N-th root of unity, or the abstract group algebra"
    obstruction: >-
      Every nontrivial character of prime-order G has image order N. Exact full
      inversion has N=B^5 modes. Computing chi_t(Q) from an unlabeled point Q
      requires its scalar orientation or another unavailable efficiently computable
      character. A strict subset of modes has a nontrivial linear kernel and does
      not determine an arbitrary target coefficient without an additional promise.
    dyadic_update: "Character sums can be selected from trees if all character values are precomputed, but doing so for all N modes is outside setup/state."
    source_output: "Would require repeated exact coefficient queries or a witness tree; no in-rectangle implementation follows."
    exception: "Special low-Fourier-support decks or a concrete non-generic character are untested."
  ffe_coordinate_masks:
    status: "exact_leaf_available_but_no_contraction"
    coefficient_ring: "F_p, with complete projective chart flags"
    exact_leaf: >-
      Fermat equality masks such as 1-(x-x0)^(p-1), combined with y and
      infinity/chart conditions, can test equality of two concrete points exactly.
    obstruction: "Applying the leaf to all (u,v,a) has B^5 raw occurrences or B^3 after the two pair indexes; no sub-B^3 exact aggregation was found."
    exception: "A circuit zero test exploiting the compact leaf generator is PCZT-E."
  semaev_encodings:
    status: "falsified_as_coefficient_complete_route"
    coefficient_ring: "F_p[x_1,...,x_m], or an extension/Weil-descent ring if introduced and fully charged"
    exactness_issue: >-
      Semaev f_m on x-coordinates accepts the existence of some compatible y/sign
      choices. It does not enforce the supplied signed labelled occurrences.
      Adding y/sign and complete-chart constraints restores an exact constant-size
      leaf but leaves the B^3 pair-pair-fifth contraction.
    field_equation_charge: >-
      Weil descent or field-equation constraints enlarge the coordinate system;
      no bounded-degree solver, advice, all-strata proof, or source reporter inside
      the rectangle was constructed.
    source_output: "Absent without dyadic replay and final signed-point verification."
    exception: "A special deck geometry that collapses the signed system remains untested."

algebraic_routes:
  - id: "shifted-pair-divisor-resultants"
    status: "standard_realization_outside_rectangle"
    coefficient_ring: >-
      Additive-line control: F_p[U]. Elliptic realization: a complete collection
      of affine/projective coordinate-section rings on E, with denominators
      saturated and exceptional charts handled separately.
    represented_dimension: >-
      H12 and H34 each have degree Theta(B^2). For one a, the standard
      resultant/gcd traffic is ~Theta(B^2); B shifted values cost ~Theta(B^3).
      Eliminating a symbolically into one dense target polynomial can expose
      Theta(B^4) coefficients.
    target_polynomial: "For each a, H34(R-a-U); the packed control is J_R(A)=Res_U(H12(U),H34(R-A-U))."
    zero_test: "Res_U(H12(U),H34(R-a-U))=0, equivalently a common root in a compatible complete chart."
    dyadic_update: "Select H12 and H34 as products of canonical dyadic nodes; the R-a translation is online and must be recomputed for the selected nodes."
    source_output: "Bisect source dyadic nodes using the same zero test, then verify the five labelled points."
    preprocessing_exponent_B: "2+o(1) for pair product trees"
    retained_space_exponent_B: "2+o(1) for pair product trees; 4 if J_R is materialized, but J_R is target-dependent"
    query_exponent_B: "3+o(1) for B explicit shifted tests; 4+o(1) for a dense packed resultant"
    workspace_exponent_B: "at least 2+o(1) per standard test, or 3+o(1) if all packed coefficients are retained"
    exact_relation_map: "Elliptic translation is used directly, not an integer modulus; completeness requires the chart/saturation conditions above."
    verdict: "fails query; compact unexpanded product remains an exception"
  - id: "pair-plus-fifth-split-norm"
    status: "standard_realization_outside_rectangle"
    coefficient_ring: "A_345=Map(D34_restricted x I5,F_p), a split product ring"
    represented_dimension: "Theta(B^2)*Theta(B)=Theta(B^3) base-field coordinates"
    target_polynomial: "The component function d_R(v,a)=h12(R-v-a); no scalar target polynomial is needed in the split-map representation."
    zero_test: "Norm_{A_345/F_p}(d_R)=product_(v,a) d_R(v,a)=0, with complete equality sections replacing h12 on E."
    dyadic_update: "Restrict the D34 and I5 factors; a generic restriction changes the selected components and their norm product."
    source_output: "Split/bisect the zero-divisor component, then replay D12 and verify labels."
    preprocessing_exponent_B: "2+o(1) for the pair index; target-dependent d_R is online"
    retained_space_exponent_B: "2+o(1) before query"
    query_exponent_B: "3+o(1) represented component traffic"
    workspace_exponent_B: "3+o(1) if materialized; streaming may lower memory but not represented work"
    exact_relation_map: "Direct point translation with complete coordinates"
    verdict: "fails online work"
  - id: "target-polynomial-quotient-ring-norm"
    status: "standard_realization_outside_rectangle"
    coefficient_ring: >-
      A5=F_p[T]/g_I5(T), where g_I5(T)=product_(a in I5)(T-t_a) for distinct
      public occurrence labels t_a. Thus A5 is isomorphic to Map(I5,F_p).
      Complete projective coordinates of Q_a=R-a are interpolated as elements
      X_R(T),Y_R(T),Z_R(T) of A5. Using point-coordinate roots directly is not
      exact when roots collide or discard sign; the label algebra is the exact repair.
    represented_dimension: "dim_Fp(A5)=Theta(B); degree-Theta(B^2) pair polynomials over A5 carry Theta(B^3) base-field coordinates"
    target_polynomial: >-
      g_I5(T) is the exact fifth-label polynomial and Q_R(T) is the target-point
      interpolant. A literal g_R(Z)=product_a(Z-ell(R-a)) is valid only when ell
      separates all selected signed target points; exact collisions must be split
      back into the label algebra, preserving dimension B.
    zero_test: >-
      Compute the common-root resultant r_R(T) of the two degree-B^2 pair
      divisors after translating one by Q_R(T), then test
      Norm_{A5/F_p}(r_R)=0. This is exact only with complete charts and a
      squarefree occurrence-label polynomial.
    dyadic_update: "Use a fifth-deck subproduct tree for g_I5 and pair-node product trees; a new restriction selects a quotient factor but the lifted pair resultant remains online."
    source_output: "A zero divisor identifies a fifth component after splitting; dyadic bisection of pair nodes and final point verification recover labels."
    preprocessing_exponent_B: "2+o(1) for pair trees and 1+o(1) for the fifth subproduct tree"
    retained_space_exponent_B: "2+o(1) before the fresh target"
    query_exponent_B: "3+o(1) for explicit fast polynomial/resultant arithmetic over the B-dimensional quotient ring"
    workspace_exponent_B: "up to 3+o(1) explicitly; streaming does not lower ring-coordinate work"
    exact_relation_map: "Direct complete point coordinates in the split label algebra"
    verdict: "packing B targets into one quotient ring changes syntax, not the B^3 represented dimension"
  - id: "dynamic-splitting-and-evaluation"
    status: "standard_worst_case_not_improved"
    coefficient_ring: "A5 or A_345 as above, including nonreduced local factors if duplicate coordinate roots are used"
    represented_dimension: "Total component degree B for A5 and B^3 for A_345; factorization redistributes but does not erase it"
    target_polynomial: "g_I5(T), or its dynamically discovered coprime factors"
    zero_test: "Split on gcd(r_R(T),g_I5(T)) or on a discovered zero divisor; recurse until a zero component or unit is certified"
    dyadic_update: "Restrictions select factors/subproducts, but new target-dependent resultants are still required"
    source_output: "A terminal component supplies a fifth label; pair labels still require source bisection"
    preprocessing_exponent_B: "2+o(1) pair state plus 1+o(1) target-label tree"
    retained_space_exponent_B: "2+o(1)"
    query_exponent_B: "3+o(1) for the standard explicit path; early split is input-dependent and has no frozen worst-case bound"
    workspace_exponent_B: "between 1 and 3 depending on streaming, with total represented work still B^3"
    exact_relation_map: "Direct complete coordinates"
    verdict: "no worst-case gain proved; special early-splitting decks remain an explicit exception"
  - id: "product-circuit-zero-test"
    status: "conditional_reduction_survives"
    coefficient_ring: >-
      Complete coordinate-section rings for E tensored with the exact split
      fifth-label algebra A5=F_p[T]/g_I5(T); denominator and infinity strata
      are represented by explicit chart flags or saturated ideals.
    represented_dimension: >-
      The unexpanded circuit has O(B) translated pair-index gates plus O(log B)
      dyadic selectors, while its coefficient expansion or leaf expansion has
      Theta(B^3) base-field traffic.
    target_polynomial: "g_I5(T) with the interpolated complete target Q_R(T)=R-a(T)"
    zero_test: >-
      Decide whether the selected D12 divisor has a common point with the
      compact circuit product over selected (v,a) of equality sections for
      U+v=Q_R(a), without expanding the B^3 components.
    dyadic_update: "Accept canonical pair and fifth subproduct nodes directly and charge all target-dependent gate generation online."
    source_output: "Return a zero child/gate or support O(log B) exact bisection queries, then verify one labelled five-point relation."
    preprocessing_exponent_B: "required <=9/4+o(1)"
    retained_space_exponent_B: "required <=9/4+o(1)"
    query_exponent_B: "required <=5/4+o(1)"
    workspace_exponent_B: "required <=5/4+o(1)"
    exact_relation_map: "Direct elliptic equality in complete coordinates; no integer hash"
    verdict: "This is a precise conditional reduction, not a constructed algorithm. Standard dense, KU, resultant, triangular, and power-projection realizations audited in the inputs cost B^3."

conditional_primitive:
  name: "PCZT-E"
  full_name: "Exact source-reporting elliptic product-circuit zero test"
  public_preprocessing_input: "Five labelled signed decks, their complete point coordinates, and frozen dyadic pair/fifth trees; not R"
  online_input: "Fresh R and canonical dyadic restrictions I1,...,I5"
  decision_contract: "Return true iff a selected labelled five-source relation sums exactly to R across every required chart/stratum"
  witness_contract: "Return one labelled source tuple, or permit O(log B) exact restriction queries that recover it, followed by direct group verification"
  correctness: "No false positives and no false negatives; detected randomized construction failure may be retried only with charged cost"
  resource_contract:
    preprocessing_time: "B^(9/4+o(1))"
    retained_state: "B^(9/4+o(1))"
    online_time: "B^(5/4+o(1)) including all bisection queries"
    online_workspace: "B^(5/4+o(1))"
  forbidden_hidden_work:
    - "expanding B^3 equality leaves or quotient-ring coordinates"
    - "precomputing target-dependent advice"
    - "using log_P(R) or log_P(R) mod m"
    - "discarding source occurrences or signs"
    - "omitting exceptional charts or denominator saturation"
  known_realizations_checked:
    dense_coefficients: "B^3 or worse"
    standard_resultant_or_gcd: "B^3 or worse"
    ku_circuit_reduction: "B^3"
    triangular_or_power_projection: "B^3"
    explicit_split_norm: "B^3"
  open_kernel: >-
    A random-access exact zero/witness algorithm acting on the compact translated
    product circuit itself, with target-local branching and no coefficient expansion.

complete_path_gate:
  query2p1_operation: "not constructed"
  all_strata_verification: "not supplied by the conditional primitive"
  relation_density: "not established"
