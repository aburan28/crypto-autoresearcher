  heuristic_assumptions:
    - id: HEUR-CHAR2-CHORD-1
      formal_statement: >-
        For every x-linear span with no element in {1} and Q, R uniform on <P>
        with Q + R != O, every nontrivial F_2-character of the pair
        (L_alpha(x_Q) XOR L_alpha(x_R), L_gamma(lambda_QR)) has absolute bias at
        most C(j) 2^{-n/2}, and the M^2 signed biases entering M pi - 1 cancel
        like a random signed sum, so that the single-bucket excess is
        O(M l^{-1/2} polylog) rather than Theta(M^2 l^{-1/2}).
      random_model_justification: >-
        A uniformly random pair of points has an uncorrelated chord slope and
        x-sum under any fixed pair of linear projections; the curve imposes
        only Artin-Schreier conditions of bounded degree, which a Weil-type bound
        controls when non-degenerate.
      supporting_results:
        - >-
          arXiv:1302.4210 Lemma 1 (retrieved): subgroup x-character sums
          << q^{1/2} for ordinary curves, p >= 5 only -- the odd-characteristic
          analogue, NOT a characteristic-2 result.
        - >-
          KN-LIT-f6de4b (internal): the additive Bombieri-Weil bound on curves is
          largely untraced; no characteristic-2 curve-level source is in the
          corpus.
      validation_experiment_ids: [EXP-SEMBIN-e2b864]
      falsification_condition: >-
        SPEC-T at n in {19, 23} showing max_u |T_u| far above the 2^{-n/2} scale
        (more than 8 2^{-n/2}) on a non-degenerate family, or the REFUTED
        reading of the main test. SPEC-T alone does not decide the hypothesis.
    - id: HEUR-CHAR2-TRANSFER-1
      formal_statement: >-
        A family whose G_sc tracks both nulls at n <= 41 and M <= 2^10 has no
        single-bucket growth at larger n along M ~ l^theta.
      random_model_justification: >-
        If HEUR-CHAR2-CHORD-1 holds uniformly in n, the excess shrinks like
        l^{-1/2} at fixed M; the transfer imitates the prime-field Theorem A'
        route of KN-FIND-ffe1df, whose single-bucket form is itself unproved.
      supporting_results:
        - KN-FIND-ffe1df (internal), Theorem A' plus Weil, level-1, bucket-averaged, conditional (H1').
      validation_experiment_ids: [EXP-SEMBIN-e2b864]
      falsification_condition: >-
        The excess over both nulls at fixed j (j = 6 at four n, j = 8 at three)
        or along the theta = 1/4 and 1/3 diagonals increases with log2 l with a
        CI excluding 0. Extrapolation beyond n = 41 is never a bound.

