        predicted_gain: A precise statement for the negative route of KN-OPEN-91d4f6 at RULE-X.
    quantifier_order: >-
      FOR the declared families (alpha fixed per curve before the run), FOR EACH
      tested curve and rung, the measured G_sc. Not FORALL filters; not FORALL n.
      The best cell is chosen after seeing half A (the attacker's order).
    method_ceiling:
      strongest_certifiable_claim: >-
