  title: >-
    NULL PREDICTION: the selection-corrected single-bucket gain of declared
    characteristic-2 x-functional labels on <P> tracks a SHA null and an exact
    matched-marginal null along M = 2^j, in level and in ladder slope

  statement: >-
    Let E: y^2 + xy = x^3 + A x^2 + B over F_{2^n}, n prime, be ordinary and
    not Koblitz (B not in F_2), with E(F_{2^n}) = Z/h x <P>, l = |<P>| prime,
    h in {2, 4}. For the six declared label families of EXP-SEMBIN-e2b864
    (LR-A, LR-B: Tr(alpha_i x) with DRBG alpha; LP-LO, LP-HI: polynomial-basis
    coordinates of x; LN: normal-basis coordinates of x; LI: Tr(beta_i / x)),
    nested in j, and for each combining rule RULE-A (f_d(a, b) = a + b + d
    mod 2^j, KN-FIND-ffe1df's pi_c(d)) and RULE-X (f_d(a, b) = a XOR b XOR d),
    let G_sc(2^j) be the split-sample, cross-fitted estimate of
    G = M_eff max_{c,d} pi_c(d) with Q, R i.i.d. uniform on <P> minus O. On the
    12 tested curves (n in {19, 23, 31, 41}; three per n), at rungs
    j = 2..j_max(n) with j_max(n) = min(10, floor(0.4 log2 l_min(n))):
    (H-a) for every (family, rule) and every readable n, the top-segment slope
    beta of log2 G_sc per doubling of M is below 0.10, or its paired difference
    from at least one null (N-SHA or the family's N-MM) has a Bonferroni CI
    containing 0; and (H-b) the top-rung excess over the larger of the two
    nulls has a lower Bonferroni CI at or below 0.10. Together: G(M) moves
    with the nulls.

  mechanism: >-
    The nulls carry exactly the two non-structural sources of a high single
    bucket: the finite-population floor of a random-like label on a group of
    order l (about sqrt(2 ln M * M / l), N-SHA) and the marginal-bias floor of
    the family's own level-set sizes (N-MM, an exact level-set-preserving
    pseudorandom bijection of <P>). Any excess beyond both must come from
    sum-structure. For x-linear labels under RULE-X that structure is
    explicit (derivation in IDEA-20261003-5a2c9e claim (2)): the RULE-X error
    vector is w = L_gamma(lambda_QR) XOR L_alpha(A) with gamma = alpha +
    alpha^{1/2} and lambda the chord slope, so the gain is the predictability of
    a linear projection of lambda from L_alpha(x_Q) XOR L_alpha(x_R). The
    null prediction holds if those joint linear projections are equidistributed
    on <P> x <P> up to Weil-scale biases that cancel like a random signed sum
    across the M^2 character pairs (HEUR-CHAR2-CHORD-1); it fails with growth
    if the biases align (barrier saturation, G - 1 ~ M^2 l^{-1/2}), and fails in
    level only if a bounded excess survives. Exact compatibility (gamma = 0)
    happens only for the span {0, 1} (the trace), which is constant on <P>
    (every point of odd order lies in 2E), consistent with Theorem C
    (KN-FIND-ffe1df).

  assumptions:
    - >-
      Q, R i.i.d. uniform on <P> minus O from a SHA-256 counter-mode DRBG; pairs
      with Q + R = O discarded and counted.
    - >-
      Families, rules, rungs, thresholds (0.10 slope, 0.10 level), Bonferroni
      level (0.05 over 12 (family, rule) cells), blocks (8 per curve) and
      eligibility (>= 100 pairs per row per half) are fixed before any run.
    - >-
      The chord identity and the Artin-Schreier identity are checked by run-time
      gates (G-CHORD; the CE-AS identity gate), not assumed.

