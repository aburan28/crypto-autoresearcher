  # ---------------------------------------------------------------------------
  scope:
    included:
      - "RUN-1: fixture FX-1 to FX-4; admission of 12 binary curves; arithmetic and domain gates; E-domain exact controls"
      - "RUN-2: the <P> ladder at n = 19 and n = 23 (6 curves)"
