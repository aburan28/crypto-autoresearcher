  # ---------------------------------------------------------------------------
  definitions:
    field: >-
      F_{2^n} = F_2[z]/(f_n), elements as n-bit integers (bit i = coefficient
      of z^i). f_n is the irreducible trinomial z^n + z^k + 1 with least k; if
      none exists, the pentanomial z^n + z^a + z^b + z^c + 1 (n > a > b > c >= 1)
      with lexicographically least (a, b, c). Irreducibility for prime n is
      tested by z^{2^n} = z mod f_n together with f_n(0) = f_n(1) = 1. f_n is
      recorded per n.
    trace_and_linear_functionals: >-
      Tr(x) = sum over i < n of x^{2^i}. For any alpha, the F_2-linear map
      x -> Tr(alpha x) is parity(x AND m_alpha), with mask bit i = Tr(alpha z^i),
      computed once per alpha. The trace mask m_1 is checked against the direct
      definition on 1000 DRBG elements (0 mismatches; else INVALID).
    normal_basis: >-
      theta = the least integer >= 2 whose conjugates theta^{2^i}, i < n, are
      F_2-linearly independent (rank n by Gaussian elimination). The normal
      coordinates of x are N^{-1} x, where N has columns theta^{2^i}; coordinate
      c_i(x) = parity(x AND row_i(N^{-1})). Self-check on 1000 DRBG elements
      (round trip, and squaring is the cyclic shift).
    curve: >-
      E_{A,B}: y^2 + xy = x^3 + A x^2 + B, ordinary, B not in F_2 (so not
      Koblitz). Roles per n: O2 (A = 1, required cofactor h = 2), O4a and O4b
      (A = 0, required h = 4). B = int(SHA-256("EXP-SEMBIN-e2b864|curve|n<n>|<role>|<attempt>"))
      mod 2^n for attempt = 0, 1, 2, ...; the first admitted attempt is used,
      O4b being the first admitted attempt after O4a's. Group law in affine
      coordinates, with lambda = (y1 + y2)/(x1 + x2) for P != +-Q and
      lambda = x1 + y1/x1 for doubling; x3 = lambda^2 + lambda + x1 + x2 + A.
    admission: >-
      Order #E by two routes. (i) Route B: the order of a DRBG point found by
      baby-step giant-step in the Hasse interval [2^n + 1 - 2^{n/2+1},
      2^n + 1 + 2^{n/2+1}], with exactly one multiple of the point order in that
      interval, confirmed by [#E]R = O on 20 DRBG points. (ii) Route C (n <= 23
      only): an exhaustive count of x with Tr(x + A + B/x^2) = 0 (two points
      each), plus T2 = (0, sqrt(B)) and O. ADMIT iff the routes agree (where
      both exist), #E = h l with h as the role requires, and l is proved prime
      by complete trial division to floor(sqrt(l)) (l < 2^40, at most 2^20
      divisions). P = [h]R for the first DRBG point R with [h]R != O, with
      [l]P = O verified. T_h is T2 when h = 2; when h = 4, T4 is a point with
      [2]T4 = T2, found by halving T2 (D2 of IDEA-20261001-39014f), with
      [4]T4 = O and [2]T4 != O verified. Admission records (routes, #E, the
      trial-division record, P, T_h) are artifacts.
    drbg: >-
      SHA-256 counter mode. word(label, t) = int(SHA-256(label || ":" ||
      t as 8-byte big-endian)). Scalars in [1, l - 1] are 1 + word mod (l - 1);
      the bias of at most l/2^256 is ignored and stated. Every label string is
      recorded in the manifest. No random 64-bit seeds are used.
    streams: >-
      <P>-STREAM per curve: accepted pair t has k1 = scalar("EXP-SEMBIN-e2b864|P|<curve>", 2u)
      and k2 = scalar(..., 2u + 1) for a draw counter u; Q = [k1]P and R = [k2]P.
      A draw with k1 + k2 = 0 mod l is discarded and counted, and t does not
      advance. S = 2^30 accepted pairs. The dlogs k1, k2 and k1 + k2 mod l are
      known by construction. E-STREAM per curve: Q = [k]P + [t]T_h with k
      uniform in [0, l - 1] and t uniform in Z/h, rejecting Q = O; the same for
      R; discarding Q + R = O; S_E = 2^24 accepted pairs. Fixture streams
      (FX-3): index pairs (i, j) uniform on Z/N x Z/N over RT-EXP-1's dlog
      table, O included with x = 0 (RT-EXP-1's population), S_FX = 2^26.
    blocks_and_halves: >-
      Accepted pair index t: block b = t mod 8; half A when floor(t / 8) is
      even, half B otherwise. Blocks are disjoint, independent sub-samples.
    labels: >-
      Every label is a function of the point (families, N-SHA, controls) or of
      its dlog (planted controls, N-MM via sigma), evaluated once per point of
      each pair (Q, R, Q + R). A label at rung j is an integer in [0, 2^j); bit
      i (least significant first) is functional i + 1. Families are nested, so
      the rung-j label is the j_max label mod 2^j.
    families: >-
      DECLARED AND CLOSED; ten functionals each.
      LR-A: Tr(alpha_i x), alpha_i = word("EXP-SEMBIN-e2b864|alpha|LR-A|<curve>", i) mod 2^n,
      redrawn (counter advanced) until alpha_1..alpha_10 are F_2-independent
      and 1 is not in their span.
      LR-B: the same with label LR-B.
      LP-LO: the coefficient of z^{i-1} of x, i = 1..10.
      LP-HI: the coefficient of z^{n-i} of x, i = 1..10.
      LN: the normal coordinate c_{i-1}(x), i = 1..10.
      LI: Tr(beta_i / x), with beta_i drawn as for LR-A under label LI and
      redrawn until independent with sqrt(B) not in their span (x != 0 on <P>,
      since T2 is not in <P>).
      DEGENERACY AUDIT (Stage 0, recorded): for LP-LO, LP-HI and LN, whether 1
      lies in the span of the ten functionals' alphas (computed from the masks);
      a flagged family is kept and reported, not altered.
    rules: >-
      RULE-A: f_d(a, b) = (a + b + d) mod 2^j (KN-FIND-ffe1df's pi_c(d)).
      RULE-X: f_d(a, b) = a XOR b XOR d. Both are applied to every family, null
      and non-planted control. PL-A-* controls are read under RULE-A only and
      PL-X-* under RULE-X only, each against both nulls under the same rule. The
      offset d ranges over all 2^j values and is maximised as part of G.
    histogram: >-
      Per (label, rule, block, half): H[e, c'] over [0, 2^jmax)^2, with combined
      label e = h(Q) + h(R) mod 2^jmax (RULE-A) or h(Q) XOR h(R) (RULE-X) and
      c' = h(Q + R). uint16 counters, saturation detected (IR-6). Rung-j
      histograms are the marginals over the low j bits of (e, c').
    m_eff: >-
      M_eff(label, block, j) is the number of distinct rung-j label values
      observed on that block's points (both halves; Q, R and Q + R). If
      M_eff = 1 then G_sc := 1 (a convention: RT-EXP-1 returned NaN). Labels
      are not remapped onto 0..M_eff - 1.
    estimator_g_sc: >-
      Per (label, rule, block b, rung j). ELIGIBLE rows are those e with
      H_A[e, .] >= 100 and H_B[e, .] >= 100; the excluded row count and mass are
      recorded. A-TO-B: (e*, c*) = argmax over eligible e and all c of
      H_A[e, c]/H_A[e, .], ties broken by least (e, c); pi_AB =
      H_B[e*, c*]/H_B[e*, .]. B-TO-A is symmetric. G_sc(b, j) = M_eff (pi_AB +
      pi_BA)/2. The curve-level G_sc(j) is the mean over blocks. Also recorded
      per block: both selected cells, the row counts and hit counts, and the
      in-sample G (the max over the full block, no split), which is never
      decision-bearing.
    slope: >-
      Per (label, rule, block): beta_b = the weighted least-squares slope of
      log2 G_sc(b, j) on j over the top segment J_top(n) = {j_max(n) - 3, ...,
      j_max(n)}, with FIXED weights w_j = 4^{-(j - j_max(n) + 3)} (the planning
      variance law, fixed now, not estimated). If any G_sc(b, j) <= 0 the block
      is unreadable (recorded).
    pooling_and_cis: >-
      Per n: the readable blocks of the admitted curves of n (up to 24). For a
      family F and a null N, the paired block differences are
      D_b = beta_b(F) - beta_b(N) and L_b = G_sc(b, j_max)(F) - G_sc(b, j_max)(N).
      Point estimates are block means; CIs are mean +- t_{q, df} sd/sqrt(m),
      with m the readable blocks, df = m - 1, and q the two-sided level
      1 - 0.05/12 (Bonferroni over the 12 (family, rule) cells per n; about
      3.18 at df = 23, scratch); the quantile is computed by the analysis code.
    nulls: >-
      N-SHA: bits 0..9 = bits of SHA-256("EXP-SEMBIN-e2b864|sha|<curve>|" ||
      x(Q) as ceil(n/8) big-endian bytes), least significant first; a function
      of x only. N-MM(F) = F o sigma for every family and every planted control,
      where sigma([k]P) = [phi(k)]P. With m = (l - 1)/2 and psi a keyed
      cycle-walking 4-round Feistel permutation of [1, m] (round function
      SHA-256 or keyed BLAKE2b under key "EXP-SEMBIN-e2b864|mm|<curve>",
      declared in the manifest) and s(k) a keyed bit: for k in [1, m],
      phi(k) = psi(k) if s(k) = 0 else l - psi(k); for k in [m + 1, l - 1],
      phi(k) = l - phi(l - k). Hence sigma is a bijection of <P> minus O,
      commutes with negation, and is not a homomorphism. F o sigma has exactly
      F's level sets over <P> minus O. sigma is evaluated at k1, k2 and
      k1 + k2 mod l.
    controls_exact: >-
      h2(Q) = Tr(x) XOR Tr(A) (the E/2E map; h2(T2) = Tr(A)). AS(Q) =
      Tr(sqrt(B)/x) for x != 0, and AS(T2) := Tr(A). Z4(Q) (h = 4 curves): the
      halving presentation b0 = h2(Q), Q1 = Q - b0 T4 = (x1, y1),
      lam^2 + lam = x1 + A (half-trace), b1 = Tr(y1 + (lam + 1) x1), Z4 = b0 +
      2 b1 mod 4 (IDEA-20261001-39014f D5; EXP-BINSTD-c9c8a2 DF-6). The
      REFERENCE is c with [l]Q = [c l mod 4] T4; the presentation must equal the
      reference (gate G-Z4). NEST(Q) at rung j = h2 as bit 0, then N-SHA bits
      1..j-1.
    controls_planted: >-
      On the <P>-stream only, functions of the dlog k of each point, with a
      per-rung coin c_j(k) = [word("EXP-SEMBIN-e2b864|coin|<ctl>|<curve>|j", k)
      / 2^256 < theta_j]. PL-A-*: label k mod 2^j if c_j(k), else the N-SHA
      label mod 2^j. PL-X-*: bit i (i < j) = [4 (xi_i k mod l) >= l and
      4 (xi_i k mod l) < 3 l], with xi_i = scalar("EXP-SEMBIN-e2b864|xi|<curve>", i)
      distinct, if c_j(k), else the N-SHA label mod 2^j.
      theta_j: PL-A-FLAT theta^3 = 2^{-j}; PL-A-EDGE theta^3 = (2^{0.2 j} - 1)/(2^{j-1} - 1);
      PL-X-FLAT theta^3 = 0.5/(1.5^j - 1); PL-X-EDGE theta^3 = (2^{0.2 j} - 1)/(1.5^j - 1);
      capped at 1. Planted labels are computed per rung (not nested).
    gate_g_chord: >-
      On the first 10^4 pairs of every <P>- and E-stream, the RULE-X error
      vector of LR-A, h(Q) XOR h(R) XOR h(Q + R), equals the vector
      (Tr(gamma_i lambda) XOR Tr(alpha_i A))_i with gamma_i = alpha_i +
      sqrt(alpha_i) and lambda the chord or tangent slope, with 0 mismatches.
      This is the identity x(Q) + x(R) + x(Q + R) = lambda^2 + lambda + A
      (derivation, DESIGN.md section 2), checked, not assumed.
    secondary_statistics: >-
      SPEC-T: T_u = mean over pairs of (-1)^{u . w}, w the RULE-X error vector at
      j_max, for every u != 0, for x-linear families, N-SHA and N-MM (the Walsh
      transform of the w histogram); report max_u |T_u| and its u. G_U at
      j <= 5: the same split-sample estimator over cells (a, b) =
      (h(Q), h(R)) with c = h(Q + R) (eligibility >= 100 per (a, b) per half).
      In-sample G and its RT-EXP-1-style slope. The theta-diagonal readings
      G_sc(j_theta) - max(nulls) at j_theta = round(theta log2 l) for theta in
      {1/4, 1/3} where j_theta <= j_max(n). Selection consistency: the fraction
      of blocks selecting the modal (e*, c*). The marginal floor M_eff max_c q_c.
      Per-curve slopes with Cochran Q heterogeneity. Each is reported and none
      decides.

  # ---------------------------------------------------------------------------
  cells:
    n_values: [19, 23, 31, 41]
    curves_per_n: 3
    roles: "O2 (A = 1, h = 2), O4a and O4b (A = 0, h = 4)"
    j_max_rule: "j_max(n) = min(10, floor(0.4 log2 l_min(n))), with l_min(n) the smallest l of the admitted curves of n"
    j_max_design_figures: "n = 19 -> 6; n = 23 -> 8; n = 31 -> 10; n = 41 -> 10 (scratch, from l about 2^{n-2}; recomputed at admission)"
    rungs: "j = 2..j_max(n); top segment J_top(n) = the four largest rungs"
    j_coverage: "j = 2..6 at four n; j = 7..8 at three n; j = 9..10 at two n (card requirement: at least two n per j)"
    fixture: "E(F_p), the three curves curves_near(65539, 3) of analysis/o2-sum-compatible-filters/rt_exp_1.py, N prime, M = round(N^{1/3}) = 40"
    sample_sizes: "S = 2^30 (<P>-stream per curve), S_E = 2^24 (E-stream per curve), S_FX = 2^26 (per fixture curve)"
    sample_size_derivation: >-
      Planning (scratch). With cross-fitting at G near 1, SE(G_sc(j)) is about
      2^j / sqrt(S) per curve, and SE(log2 G_sc) about 1.443 times that. The
      fixed-weight WLS slope over four rungs has SE about 1.40 times the lowest
      rung's SE. With a 1.4x allowance for inter-rung correlation, SE(beta) is
      about 0.354 2^{j_top} / sqrt(S). A per-curve Bonferroni half-width z SE <=
      0.05 with z = 2.87 needs S >= 413 4^{j_top} = 2^{8.69 + 2 j_top}: 2^28.7
      at j_top = 10 (met by S = 2^30) and 2^30.7 at j_top = 11 (not met), hence
      j_max <= 10. Per n (24 blocks) the half-width is about 0.020 at
      j_top = 10, and the top-rung level SE about 0.018. The 0.4 log2 l rule
      keeps the finite-population null floor sqrt(2 ln M * M / l) at or below
      about 0.064 (n = 19, j = 6), 0.037 (n = 23, j = 8) and 0.005 (n = 31,
      j = 10), with null slopes over J_top at most about 0.022, below the 0.10
      threshold. Measured null slopes gate this (SR-5), and the formula
      decides nothing.

  # ---------------------------------------------------------------------------
  inputs:
    internal:
      - analysis/o2-sum-compatible-filters/rt_exp_1.py and fourier_obstruction.py (read-only, FX-1 only)
      - analysis/o2-sum-compatible-filters/reviews/RT-EXP-1-RESULT.md (fixture target values)
      - knowledge/open-problems/KN-OPEN-91d4f6.md
      - knowledge/findings/KN-FIND-ffe1df.md
      - ledger/proposals/IDEA-20261001-39014f.yaml (D2, D5)
      - coordination/tasks/TASK-20261003-3c8ea2/DESIGN.md
    fixture_targets:
      - "rt_exp_1.py printed row x mod M, column 65539: 1.0859 (mean over three curves, M_eff 40)"
      - "rt_exp_1.py printed row sha [null], column 65539: 1.0742"
    instrument: >-
      New code written under the approved contract: binary field arithmetic
      (vectorised or compiled; pure per-element Python is infeasible at S),
      fixed-base windowed scalar multiplication, batched inversion, the PRP,
      label evaluation, histograms, the estimator and the gates. Code sha256 is
      recorded before RUN-1; the analysis code (RUN-A) is frozen and hashed
      before RUN-2's histograms are opened.
    missing_instruments: All code is new; none exists yet. No solver is needed.

  # ---------------------------------------------------------------------------
  controls:
    - id: FX-1
      what: >-
        rt_exp_1.py run read-only from its directory reproduces 1.0859 (x mod M)
        and 1.0742 (sha [null]) at 65539, both RNG-free.
      blocking: true
    - id: FX-2
      what: >-
        The new exact whole-group code (all N^2 pairs, RULE-A, O included with
        x = 0, M = 40) reproduces both means within 5e-5 and outputs the full
        exact pi table per curve.
      blocking: true
    - id: FX-3
      what: >-
        The sampled split-sample estimator for x mod M on each fixture curve at
        S_FX = 2^26: each of the 6 held-out estimates (3 curves x 2
        directions) lies inside its own 99.9 percent Wilson interval around the
        exact pi at its selected cell; 0 failures allowed. The naive in-sample
        sampled G is reported beside the exact G.
      blocking: true
    - id: FX-4
      what: >-
        Exact G by FFT over Z/l (no curve) of PL-A-FLAT, PL-A-EDGE, PL-X-FLAT,
        PL-X-EDGE and the fully planted labels (theta = 1), at the admitted l
        of n = 19 and n = 23, j <= 6, compared with the design formulas.
        Recorded, not gating.
      blocking: false
    - id: CE-TR
      what: >-
        h2 on the E-stream, RULE-X, M = 2: G_sc = 2 exactly, with zero
        violations at the selected cell in every block and direction.
      blocking: true
    - id: CE-Z4
      what: >-
        Z4 on the E-stream of each h = 4 curve, RULE-A, M = 4: G_sc = 4 exactly,
        zero violations. Gate G-Z4 (presentation equals reference on 10^4
        E-points) must pass first.
      blocking: true
    - id: CE-AS
      what: >-
        AS on the E-stream, RULE-X, M = 2: G_sc = 2 exactly. Identity gate: on
        every E-stream point with x != 0, Tr(sqrt(B)/x) = Tr(x) XOR Tr(A)
        (from (y/x)^2 + y/x = x + A + B/x^2), 0 violations.
      blocking: true
    - id: CE-NEST
      what: NEST on the E-stream, RULE-X, j = 2..6, each curve-level G_sc within 4 SE (8-block) of 2.
      blocking: true
    - id: CP-TR, CP-Z4, CP-AS
      what: >-
        h2, Z4 (h = 4 curves) and AS on the <P>-stream: M_eff = 1, G_sc = 1
        exactly, at every rung where read. A reading other than 1 with the
        domain gates intact is an estimator defect (INCONCLUSIVE).
      blocking: true
    - id: CP-NEST
      what: >-
        NEST on the <P>-stream, RULE-X: the paired CIs against N-SHA of the
        top-rung level and of the slope contain 0 at every n.
      blocking: true
    - id: DOMAIN
      what: >-
        Every <P>-stream point satisfies Tr(x) = Tr(A) (0 violations; <P> lies in
        2E). Every 2^16-th point satisfies [l]Q = O (0 violations). The E-stream
        fraction with Tr(x) = Tr(A) lies within 5 binomial SE of 1/2.
      blocking: true
    - id: G-CHORD
      what: definitions.gate_g_chord, 0 mismatches.
      blocking: true
    - id: PL-A-FLAT, PL-X-FLAT
      what: >-
        Under their rule, at each readable n: the paired level difference over
        the larger null is >= 0.25 with lower CI > 0 at every j >= 3; and
        REFUTE-n does NOT hold (the slope is below 0.10 or not separated).
      blocking: true
    - id: PL-A-EDGE, PL-X-EDGE
      what: Under their rule, REFUTE-n holds at every readable n (the growth criterion trips).
      blocking: true
    - id: PL-MM-COLLAPSE
      what: >-
        For each planted control P, the paired CIs of (P o sigma) minus N-SHA,
        in top-rung level and in slope, contain 0 at every readable n (the
        RT-EXP-1 "P2 to P2 SHUF" check).
      blocking: true
    - id: NULL-FLOOR
      what: >-
        Per (n, family): the upper CI of beta(N-SHA) and of beta(N-MM(F)) is
        below 0.10; otherwise that (n, family) is NULL-FLOOR and is not read
        (SR-5).
      blocking: false

  # ---------------------------------------------------------------------------
  independent_variables:
    - "n in {19, 23, 31, 41} and the curve role (O2, O4a, O4b)"
    - the rung j (2..j_max(n))
    - the label (six families; N-SHA; N-MM of each family and planted control; exact, nested and planted controls)
    - the rule (RULE-A, RULE-X)
    - the stream domain (<P>, E, fixture)
    - the block (0..7) and half (A, B)

  # ---------------------------------------------------------------------------
  metrics:
    primary:
      - name: G_sc
        unit: dimensionless
        definition: definitions.estimator_g_sc per (curve, label, rule, block, j), with the curve mean and the 8-block SE
      - name: beta
        unit: log2 G per doubling of M
        definition: definitions.slope per (curve, label, rule, block), pooled per n as in definitions.pooling_and_cis
      - name: Delta_beta_SHA, Delta_beta_MM
        unit: log2 G per doubling of M
        definition: paired block differences of beta, family minus null, per (family, rule, n), with Bonferroni CIs
      - name: Delta_top
        unit: dimensionless
        definition: paired block difference of G_sc at j_max(n), family minus the larger of N-SHA and N-MM(F) per block, per (family, rule, n), with Bonferroni CIs
      - name: control_readings
        unit: dimensionless and counts
        definition: every FX, CE, CP, PL, DOMAIN, G-CHORD and G-Z4 reading with its pass or fail
      - name: classification
        unit: categorical
        definition: REFUTE-n per (family, rule, n); the overall outcome PASS, REFUTED, BOUNDED-EXCESS, INCONCLUSIVE or INVALID
    secondary:
      - name: spec_t
        unit: dimensionless
        definition: definitions.secondary_statistics SPEC-T
      - name: g_u
        unit: dimensionless
        definition: unrestricted-rule envelope at j <= 5
      - name: in_sample_g
        unit: dimensionless
        definition: the uncorrected maximum, for continuity with RT-EXP-1; never decision-bearing
      - name: theta_diagonals
        unit: dimensionless
        definition: "excess over the nulls at j_theta for theta in {1/4, 1/3}, against log2 l"
      - name: selection_consistency
        unit: fraction
        definition: the fraction of blocks selecting the modal cell, per (curve, label, rule, j)
      - name: marginal_floor
        unit: dimensionless
        definition: M_eff max_c q_c per (curve, label, j)
      - name: cochran_q
        unit: dimensionless
        definition: heterogeneity of per-curve slopes within n
      - name: cost
        unit: group additions, hash calls, CPU-seconds, peak RSS
        definition: per run and per curve
      - name: termination_reason
        unit: categorical
        definition: completed, checkpointed, timeout or crash, per run

  heuristic_under_test: >-
    HEUR-CHAR2-CHORD-1 of the draft H-SEMBIN-9c41f7, through its consequence
    (the null prediction) and its secondary diagnostic SPEC-T;
    HEUR-CHAR2-TRANSFER-1 through the n-axis at fixed j and the theta-diagonals.

  preregistered_prediction:
    quantity: >-
      The overall outcome and the control readings.
    formula: >-
      PREDICTED OUTCOME: PASS. Every declared (family, rule) at every readable
      n has beta < 0.10 or a difference CI containing 0 against at least one
      null, and Delta_top's lower CI <= 0.10. Exact readings: CE-TR = 2,
      CE-AS = 2, CE-Z4 = 4 on E; CP-* = 1 on <P>. Planted (approximate, from
      design formulas): PL-A-FLAT about 1.5 - 2^{-j} and PL-X-FLAT about 1.5
      (flat); PL-A-EDGE and PL-X-EDGE about 2^{0.2 j} (slope about 0.2).
      Secondary (low confidence): SPEC-T max_u |T_u| for x-linear families
      above N-SHA's at n in {19, 23} (structured but cancelling).
    source: >-
      KN-FIND-ffe1df (Theorem C; RT-EXP-1's prime-field null with the
      matched-marginal control) transferred to characteristic 2 as
      HEUR-CHAR2-CHORD-1 (untraced, labelled); the exact controls from the
      E/2E and E/4E quotients (H-SEMBIN-83a856; IDEA-20261001-39014f D2, D5);
      the planted formulas from DESIGN.md section 5 (dlog mixture after
      RT-EXP-1; the half-interval bit's XOR probability 3/4 from
      beta(3) = pi^3/32). Written before any run; any change needs a versioned
      protocol_amendment.

  scale_relevance:
    tier: toy
    justification: >-
      n <= 41 (l < 2^40), M <= 2^10, level 1, 12 curves. Nothing transfers to
      deployed n except as HEUR-CHAR2-TRANSFER-1, a labelled assumption tested
      only along the tested n and never a bound.
    correspondence: null

  tail_checks:
    - The largest per-block G_sc of N-SHA and N-MM at each (n, j) against the block distribution of the family at the same (n, j).
    - "Selection consistency of any family with a REFUTE-n or BOUNDED-EXCESS reading: a structural signal should select the same (e*, c*) in most blocks."
    - "The largest SPEC-T |T_u| per family with its u, checked for alignment with span{1} (x-linear) or sqrt(B) (1/x) directions."
    - The excluded-row mass per (label, rule, block, j) against eligibility.
    - The count of discarded Q + R = O draws per stream against its expectation S/l.

  replication:
    seeds: >-
      No numeric seeds. Every random choice is a DRBG word under a recorded
      label (definitions.drbg): curve B values, sampling points, scalars,
      alphas, betas, xis, coins, the PRP key and the SHA-null key.
    independent_instances: 15
    independent_instances_note: >-
      12 admitted binary curves (3 per n) plus the 3 fixture curves; 8
      independent blocks per binary curve.

  # ---------------------------------------------------------------------------
  procedure:
    - >-
      S0 (zero compute, before any run): record f_n, the masks, theta, the
      family alphas and betas with the degeneracy audit, the xis, the PRP key,
      and every DRBG label; record the code sha256.
    - >-
      RUN-1: FX-1, FX-2, FX-3 (stop on failure); admission of 12 curves; mask,
      normal-basis, G-CHORD, G-Z4, AS identity and DOMAIN gates on 10^4-point
      or 10^4-pair streams; E-streams with CE-TR, CE-Z4, CE-AS and CE-NEST;
      FX-4. No family label is read in RUN-1.
    - >-
      RUN-2 (n = 19, 23) and RUN-3 (n = 31, 41): per curve, the <P>-stream with
      every label and rule histogrammed; DOMAIN and G-CHORD on the stream. The
      family histograms are written to sealed files (sha256 recorded); the
      analysis opens them only after that curve's CP, PL and PL-MM-COLLAPSE
      readings have been computed and recorded.
    - >-
      RUN-A (analysis, frozen code): the per-curve and per-n statistics,
      REFUTE-n, NULL-FLOOR, the outcome table, and the secondary statistics;
      no interpretation is written for REFUTE-n or BOUNDED-EXCESS cells.
  runs_plan:
    - {run: RUN-1, content: "fixture, admission, gates, E-domain exact controls, FX-4 (minutes to an hour, advisory)"}
    - {run: RUN-2, content: "<P> ladder at n = 19 and 23 (6 curves)"}
    - {run: RUN-3, content: "<P> ladder at n = 31 and 41 (6 curves)"}
    - {run: RUN-A, content: "frozen analysis over the RUN-2 and RUN-3 outputs"}

  # ---------------------------------------------------------------------------
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 10
    maximum_workers: 1
    note: >-
      Advisory under docs/research-budget-policy.md; null time and CPU fields
      are valid. Scratch estimate (not measured): about 3.2e11 group additions
      over 12 curves (about 20-26 per pair including the N-MM points), about
      4.5 CPU-hours compiled with carry-less multiply at an assumed 50 ns per
      addition, about 90 CPU-hours vectorised at an assumed 1 us; plus about
      1e4-1e5 CPU-seconds of hashing; RUN-1 minutes to an hour. Memory about
      1.1 GB of uint16 histograms; if 4 GB would be exceeded, the
      deterministic stream is regenerated per label group (cost multiplies,
      recorded) and S is never reduced. maximum_runs 10 = four planned runs
      plus up to six infrastructure reruns. A watchdog expiry checkpoints a run
      and resumes from the deterministic stream; it is never evidence.

  # ---------------------------------------------------------------------------
  stopping_rules:
    - id: SR-1
      rule: >-
        FIXTURE FIRST. If FX-1, FX-2 or FX-3 fails, stop the experiment: outcome
        INCONCLUSIVE; no binary curve is run.
    - id: SR-2
      rule: >-
        ADMISSION AND ARITHMETIC. A curve failing admission is replaced by the
        next DRBG attempt of its role (recorded). A curve admitted but failing a
        mask, normal-basis, G-CHORD, G-Z4, AS identity or DOMAIN gate is INVALID
        and is not run further. If two or more curves of one n are INVALID,
        that n is unreadable.
    - id: SR-3
      rule: >-
        E-CONTROLS. If CE-TR, CE-Z4, CE-AS or CE-NEST fails on any admitted
        curve, stop after RUN-1: outcome INCONCLUSIVE (a missed positive
        control).
    - id: SR-4
      rule: >-
        <P>-CONTROLS. If a CP control, a planted control or PL-MM-COLLAPSE fails
        at an n, that n is unreadable and the failure is recorded as an
        instrument defect. If the failure occurs at two or more n, the overall
        outcome is INCONCLUSIVE.
    - id: SR-5
      rule: >-
        NULL-FLOOR. A (n, family) whose null slopes fail the NULL-FLOOR control
        is not read; if this removes n = 31 and n = 41 for a family, that
        family's reading is INCONCLUSIVE.
    - id: SR-6
      rule: >-
        NO ADAPTIVE STOPPING ON RESULTS. A REFUTE-n or BOUNDED-EXCESS reading at
        n = 19 or 23 does not stop or alter RUN-3; it is reported to the
        Coordinator as a pointer, with no interpretation, and the frozen plan
        continues.
    - id: SR-7
      rule: >-
        INFRASTRUCTURE. Timeouts, crashes and watchdog checkpoints are
        infrastructure outcomes (AGENTS.md rule 3); resume from the
        deterministic stream, and never read a partial histogram as a result.

  invalidation_rules:
    - id: IR-1
      rule: The code sha256 differs from the recorded value at any run -> that run is INVALID.
    - id: IR-2
      rule: A DRBG label or stream index is not recorded -> that stream is INVALID.
    - id: IR-3
      rule: Any DOMAIN, G-CHORD, G-Z4, AS identity, mask or normal-basis gate mismatch -> that curve is INVALID.
    - id: IR-4
      rule: >-
        Stream regeneration (memory fallback) whose first 2^16 pairs do not
        hash identically to the original -> that curve is INVALID.
    - id: IR-5
      rule: A sealed family histogram opened before that curve's controls were recorded -> that curve is INVALID.
    - id: IR-6
      rule: >-
        uint16 saturation in any histogram cell -> the affected block is
        recomputed with wider counters before any reading; a saturated count is
        never read.
    - id: IR-7
      rule: A threshold, rung set, family, rule or estimator choice changed after RUN-2 starts without a versioned protocol_amendment -> the run is INVALID.

  success_criterion: >-
    The experiment is informative iff every blocking control passes at the
    readable n and the frozen decision table yields exactly one of PASS,
    REFUTED or BOUNDED-EXCESS. PASS requires at least 3 of the 4 n readable,
    including both n = 31 and n = 41, and no (family, rule) meeting REFUTED or
    BOUNDED-EXCESS. REFUTED: for some declared (family, rule), REFUTE-n holds
    at >= 2 readable n including n = 31 or n = 41, where REFUTE-n means
    beta >= 0.10, the lower Bonferroni CI of Delta_beta_SHA > 0, the lower
    Bonferroni CI of Delta_beta_MM > 0, and both nulls' slopes have upper CI
    < 0.10. BOUNDED-EXCESS: REFUTED does not hold, and for some declared
    (family, rule) the lower Bonferroni CI of Delta_top exceeds 0.10 at >= 2
    readable n. Otherwise INCONCLUSIVE, or INVALID under the invalidation
    rules.
  falsification_criterion: >-
    H-SEMBIN-9c41f7 clause H-a is FALSIFIED by REFUTED, and clause H-b by
    BOUNDED-EXCESS. A REFUTED reading routes to the Coordinator before any
    interpretation, as possible rule-12 material. A PASS supports only the
    scoped null of the method ceiling. INCONCLUSIVE and INVALID falsify
    nothing.
  routing: >-
    REFUTED or BOUNDED-EXCESS, or any single REFUTE-n: the executor writes the
    table and no interpretation, and reports to the Coordinator (bus and
    task receipt). A REFUTED reading is not an attack, not a speedup and not a
    statement about any curve's security.

  method_ceiling: >-
    Level 1 only; tree levels >= 2 are not closed by any outcome
    (KN-FIND-ffe1df). Theorem C already excludes exact filters on <P>, so only
    approximate gain is measured. Declared families only. Resolution: about
    +-0.02 per n on the slope and about 0.05 on the top-rung level; growth
    slower than 0.10 per doubling, or growth beginning beyond j = 10 or
    n = 41, is not resolved. The random-sign Weil-scale regime
    (G - 1 ~ M l^{-1/2}) is visible only at n <= 23 and only through SPEC-T.
    The nearby objects are E(F_2^n) (exact gain h attained) and E(F_p) (the
    fixture).

  required_artifacts:
    - Run manifests (AGENTS.md), with the resolved inference block, code sha256 and every DRBG label
    - "S0 record: f_n, masks, theta, alphas, betas, xis, the degeneracy audit, the PRP key"
    - "Admission records per curve: routes, #E, trial division, P, T_h"
    - FX-1 stdout; FX-2 exact tables; FX-3 per-direction estimates with Wilson intervals; FX-4 exact Z/l values
    - "Gate logs: DOMAIN, G-CHORD, G-Z4, AS identity, mask and normal-basis self-checks"
    - "Sealed histograms (compressed) per (curve, label, rule, block, half) at j_max, with sha256"
    - "Per (curve, label, rule, block, j): selected cells, row and hit counts, M_eff, excluded rows, G_sc, in-sample G"
    - The per-n decision table with every beta, Delta and CI, NULL-FLOOR flags and the outcome
    - The secondary statistics (SPEC-T, G_U, theta-diagonals, selection consistency, marginal floor, Cochran Q)
    - "Cost record: additions, hash calls, CPU-seconds, peak RSS, termination_reason per run"

  # ---------------------------------------------------------------------------
  procedure_deviations_at_design:
    - id: PD-1
      what: >-
        Dispatch preconditions DP-1 (TASK-20261003-6d2f84 receipt) and DP-2 (a
        lane claim) were not met; the user requested this design now, and
        6d2f84 is being run concurrently. Disclosed, not waived.
    - id: PD-2
      what: Identifiers hand-chosen without a shell; checks owed (id_provenance).
    - id: PD-3
      what: Not machine-parsed; a strict parse and tools/validate_ledger.py are owed by the archiving task.
    - id: PD-4
      what: >-
        Every precision, floor, cost and planted-gain figure is scratch hand
        arithmetic; FX-4 and the gates check them at run time, and none is a
        measurement.
