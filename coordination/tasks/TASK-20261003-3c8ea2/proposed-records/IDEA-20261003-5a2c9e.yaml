  title: >-
    The single-bucket-gain ladder on <P> for characteristic-2 x-filters:
    selection-corrected G(M) = M max_{c,d} pi_c(d) of F_2-linear (and 1/x-linear)
    x-functional labels on toy ordinary binary curves, along M = 2^j to 2^10 at
    n in {19, 23, 31, 41}, against a SHA null and an exact matched-marginal
    shuffle, with the trace and one-halving filters alive on E(F_2^n) and dead
    on <P> -- and the identity that turns the XOR-rule gain into the linear
    predictability of the chord slope

  class: measurement

  claim: >-
    (1) MEASUREMENT CLAIM (the falsifiable content; the null prediction). For
    the six declared label families (LR-A, LR-B random Tr(alpha_i x); LP-LO,
    LP-HI polynomial-basis coordinates; LN normal-basis coordinates; LI
    Tr(beta_i / x)) under RULE-A (KN-FIND-ffe1df's pi_c(d) with Z/2^j
    addition) and RULE-X (XOR with offset), on <P> of 12 toy ordinary
    non-Koblitz binary curves, the split-sample cross-fitted single-bucket gain
    G_sc(2^j) tracks both nulls: its top-segment ladder slope beta (log2 G per
    doubling of M) is below 0.10 or not separated from both nulls, and its
    top-rung excess over both nulls is below 0.10. The alternatives the test
    discriminates are named in mechanism: square-root cancellation across the
    M^2 character pairs (G tracks the nulls) versus coherent barrier-saturating
    structure (G - 1 ~ M^2 l^{-1/2}, growing about 2 in log2 per rung once above
    the floor), with a bounded constant excess as a third, separately routed
    reading.
    (2) DERIVATION (zero compute; unreviewed). On y^2 + xy = x^3 + A x^2 + B,
    for Q + R != O with chord or tangent slope lambda,
    x(Q) + x(R) + x(Q+R) = lambda^2 + lambda + A, hence for every alpha
    Tr(alpha x(Q)) + Tr(alpha x(R)) + Tr(alpha x(Q+R)) = Tr(gamma lambda) +
    Tr(alpha A) with gamma = alpha + alpha^{1/2}. So an x-linear bit is exactly
    XOR-compatible on E iff alpha is in {0, 1} (the trace, H-SEMBIN-83a856's
    E/2E map), and for a j-bit label L_alpha(x) the RULE-X gain is
    G_X = M_eff max_{s,d} Pr[L_gamma(lambda_QR) = d | L_alpha(x_Q) XOR
    L_alpha(x_R) = s]: the predictability of a linear projection of the chord
    slope from the XOR of the input labels.

  mechanism: >-
    OBJECT FRAME. Representation R1 (x in F_{2^n}: polynomial basis, normal
    basis, and 1/x). Tracked object: the j-bit label h(Q), a lossy projection of
    Q (n - j bits of x and the sign discarded). Operation set Sigma: translation
    by an element of the partner list, i.e. one Wagner merge. LOSSY-PROJECTION
    TEST AGAINST SIGMA: the label propagates deterministically iff the RULE-X
    error w = h(Q) XOR h(R) XOR h(Q+R) is a function of (h(Q), h(R)); by the
    chord identity w = L_gamma(lambda) XOR L_alpha(A), which is constant iff
    gamma = 0 on the span, i.e. the span lies inside {0, 1}: the trace, Class I
    partial-action on E and constant on <P>. Every non-degenerate span FAILS the
    exact test, as Theorem C (KN-FIND-ffe1df) requires on <P>; the object is
    TRICHOTOMY Class II BRANCHING, and the experiment reads its (L, b) meter
    (IDEA-20260802-002) at one level, L = j and b = M / G. What decides growth
    is whether (L_alpha(x_Q + x_R), L_gamma(lambda)) is equidistributed on
    <P> x <P>; those are additive-character sums of rational functions of
    (x_Q + x_R, lambda) under the Artin-Schreier conditions that define the
    pair set and <P>-membership -- the characteristic-2 degenerate-case surface
    KN-OPEN-91d4f6 names, here explicit. If they cancel at square-root scale
    across characters, M pi - 1 = sum over (u,v) != 0 of +-T(u,v) behaves like a
    random signed sum and G tracks the nulls; if phases align, the sum saturates
    the M^2 Cauchy-Schwarz barrier KN-FIND-ffe1df records (closure only for
    M <= p^{1/4}) and G grows along the ladder. RULE-A has carries and no such
    identity; it is kept because it is the definition.
    OFF-LIMITS AS PRIMARY LENS (declared): KN-FIND-ffe1df families A-J on E(F_p);
    the BINSTD Koblitz Frobenius-invariant arms on E (IDEA-20260926-136bd3 ->
    EXP-BINSTD-811a2e). Theorem C is used as a component.
    WHY THIS IS NOT A RENAMED KNOWN APPROACH: it is the program's own RC5 and
    KN-OPEN-91d4f6 measurable quantity, so it is not new as a question; what it
    adds is the <P> domain the BINSTD lineage declines (EXP-BINSTD-c9c8a2 scope,
    RR-1 route (b)), KN-FIND-ffe1df's quasigroup-rule observable at both rules
    with a split-sample selection correction, a j-ladder to 2^10 at n up to 41,
    and the chord-slope identity.

