  falsification_conditions:
    - >-
      REFUTED (growth): some declared (family, rule) has beta >= 0.10 with both
      Bonferroni difference CIs above 0 at >= 2 n including 31 or 41, all gates
      passed and both nulls' slopes below 0.10. Routes to the Coordinator before
      any interpretation, as possible rule-12 material.
    - >-
      BOUNDED-EXCESS: no growth, but a top-rung excess with lower CI above 0.10
      over both nulls at >= 2 n. The null prediction is falsified in level;
      routes to the Coordinator; no exponent stake as measured.
    - >-
      Instrument outcomes are not falsifications. A missed positive control, a
      control alive on <P>, an unreproduced fixture or a failed planted gate
      gives INCONCLUSIVE; an arithmetic, domain or custody gate gives INVALID;
      timeouts and crashes are infrastructure (AGENTS.md rule 3).

  confounders:
    - >-
      Finite-population floor (about sqrt(2 ln M * M / l)): real, shared by the
      nulls; bounded by j_max(n) = min(10, floor(0.4 log2 l_min)) and gated by
      the nulls' measured slopes.
    - >-
      Correlation between nested rungs on the same pairs: standard errors come
      from 8 independent blocks per curve, not from per-rung formulas.
    - >-
      Selection on thin rows: eligibility requires >= 100 pairs per row in both
      halves; the excluded mass is reported.
    - >-
      Per-curve spread versus n-trend: per-curve slopes and Cochran Q are
      reported (RT-EXP-1 limitation 5).
    - >-
      Basis dependence: LP-LO and LP-HI depend on the field polynomial (least
      trinomial, else pentanomial), LN on the chosen normal element; declared
      choices, not tuned.
    - >-
      Artin-Schreier degeneracy: a span containing 1 (x-linear) or sqrt(B)
      (1/x-linear) has a constant bit on <P>; audited at Stage 0 and
      empirically.
    - >-
      Negation symmetry: every family and N-SHA is negation-invariant; the
      sigma of N-MM commutes with negation.
    - >-
      The planted formulas are approximations (independence of PL-X bits,
      finite l); FX-4 records exact Z/l values, and the gates require
      separation and tripping, not equality.

  interpretation_limits:
    - Level 1 only; a level-1 result does not close tree levels >= 2 (KN-FIND-ffe1df).
    - Toy tier, n <= 41, M <= 2^10; no transfer to deployed n except as a labelled assumption (HA-2).
    - Declared families only; the class of cheap h is not enumerable.
    - A REFUTED reading is not an attack and not a speedup; it is a candidate ingredient routed to review.
    - A PASS does not settle KN-OPEN-91d4f6, whose negative route needs a proof.
    - Nothing here is a statement about the security of any curve, in either direction.

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        (Chord-projection equidistribution.) For every non-degenerate x-linear
        span (no element in {1}) and Q, R uniform on <P> with Q + R != O, every
        nontrivial character of the pair (L_alpha(x_Q) XOR L_alpha(x_R),
        L_gamma(lambda_QR)) has bias at most C(j) 2^{-n/2}, and the M^2 signed
        biases entering M pi - 1 cancel like a random signed sum, so that
        G - 1 is O(M l^{-1/2} polylog) rather than Theta(M^2 l^{-1/2}).
      rigorous_support: >-
        Imitates the Weil-Bombieri bound for additive character sums of
        non-Artin-Schreier-degenerate rational functions on curves (one point
        fixed, sum over the other), combined with square-root cancellation
        across characters. In characteristic 2 on a subgroup this is UNTRACED:
        Ahmadi-Shparlinski Lemma 1 (retrieved) is p >= 5 only; KN-LIT-f6de4b
        records the additive curve-level bound as largely untraced.
      validation_plan: >-
        SAMPLE the diagonal sums T_u (SPEC-T, free from the RULE-X histograms) at
        n in {19, 23} with S = 2^30 (SE about 2^-15 against Weil scale 2^-9.5
        and 2^-11.5). COMPARE max_u |T_u| and the distribution of |T_u| against
        N-SHA and N-MM and against the 2^{-n/2} scale. TAIL: the largest |T_u|
        per family and its u, checked for alignment with
        Artin-Schreier-degenerate directions. TRANSFER: none beyond the tested
        n.
    - id: HA-2
      statement: >-
        (Transfer.) A family whose G_sc tracks both nulls at n <= 41, M <= 2^10
        has no single-bucket growth at larger n along M ~ l^theta.
      rigorous_support: >-
        None in characteristic 2. Imitates KN-FIND-ffe1df's prime-field Theorem
        A' plus Weil (level-1, bucket-averaged, conditional), whose
        single-bucket version is itself unproved (the Lemma 5 hole).
      validation_plan: >-
        The n-axis at fixed j (j = 6 at all four n; j = 8 at three) and the
        theta-diagonals (1/4 and 1/3) of the excess over nulls against log2 l
        must be non-increasing. TRANSFER ASSUMPTION, stated: extrapolation
        beyond n = 41 is heuristic and never a bound.
    - id: HA-3
      statement: >-
        (Null-floor scale, design only.) The finite-population excess of a
        random-like label on <P> is about sqrt(2 ln M * M / l).
      rigorous_support: >-
        The maximum of M bucket-size deviations of relative size sqrt(M/l)
        (normal approximation to multinomial occupancy); used only to choose
        j_max(n).
      validation_plan: >-
        The measured N-SHA and N-MM levels and slopes on every (n, j) against
        the formula; the null-floor gate (upper CI of null slopes < 0.10)
        decides readability, not the formula.

