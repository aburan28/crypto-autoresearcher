        (RT-EXP-1 popcount), separated by N-MM with exact level sets; (b) the
        finite-population floor, present in N-SHA and N-MM at equal scale;
        (c) domain leakage (sampling E instead of <P>), caught by CP-* reading 1
        and the domain gates; (d) sampling selection bias, removed by the split
        sample; (e) a degenerate constant character, caught by M_eff and the
