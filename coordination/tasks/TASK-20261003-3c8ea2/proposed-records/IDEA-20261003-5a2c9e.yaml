        proposed_object: >-
          Hold the label fixed and vary the domain: E(F_{2^n}) (exact gain h
          attained; controls alive) versus <P> (controls constant). The
          intrinsic invariant is the subgroup lattice (Theorem C).
        predicted_gain: >-
          Makes a null reading on <P> admissible, because the same instrument
          reads the forced values on E.
      - transform: representation_reduction
        proposed_object: >-
          RULE-X gain of an x-linear label rewritten as the conditional linear
          bias of the chord slope (claim (2)); encoding exact (identity);
          complete for x-linear labels; soundness checked by G-CHORD; cost loss
          none.
        predicted_gain: >-
          A precise target for the negative route: an equidistribution bound for
          (L_alpha(x_Q + x_R), L_gamma(lambda)) on <P> x <P>, with the
          Artin-Schreier-degenerate (alpha, gamma) classified.
    quantifier_order: >-
      KN-OPEN positive: EXISTS (alpha, f) EXISTS theta > 0 with G unbounded
