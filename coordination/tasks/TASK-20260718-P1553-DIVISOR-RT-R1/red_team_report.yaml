  frozen_geometric_interface:
    compact_parameter_space: X = E^(6B)
    admitted_open: >-
      U is the checked pairwise-disjoint labelled deck-point stratum used by
      P1553.
    relation_components: >-
      For alpha=(j_1,...,j_6) in [B]^6, R_alpha is the kernel divisor of
      mu_alpha:X->E, mu_alpha=sum_i A_(i,j_i).
    reporter_class_tested: >-
      One nonzero algebraic section s of one line bundle on X whose zero set
      has no false negatives on U. Exact support is stronger than needed for
      the divisor inequality.
  reconstructed_scoped_theorem:
    statement: >-
      Every R_alpha is a distinct smooth irreducible prime Cartier divisor and
      R_alpha intersect U is dense in R_alpha. Therefore any such section s
      satisfies div(s) >= sum_alpha R_alpha. On a generic coordinate fibre
      obtained by varying one labelled deck point and fixing all others,
      exactly B^5 relation divisors meet with degree one. Hence
      deg(L restricted to that fibre) >= B^5 for every deck-point coordinate.
    proof_boundary: >-
      This is a divisor and line-bundle degree statement over the universal
      geometric configuration space. It is not a statement about a reporter
      defined only on fixed F_p decks or only on F_p-rational configurations.
    scalar_correction: >-
      X is projective, so a global regular scalar function X->A^1 is constant.
      The determinant product is a section of a nontrivial line bundle, not a
      canonical scalar. The proposed wording must be revised accordingly.
  objections:
    - id: RT-DIV-01
      escape_hatch: irreducibility
      disposition: closed_in_scoped_geometric_model
      finding: >-
        The coefficient vector of mu_alpha is primitive and contains a unit
        coefficient, so an integral change of E^n coordinates identifies its
        kernel with E^(6B-1). Distinct alpha give distinct divisors. Removing
        diagonals leaves a nonempty dense open of each divisor.
      consequence: >-
        Irreducibility does not defeat the reduced-divisor inequality.
    - id: RT-DIV-02
      escape_hatch: localization_away_from_diagonals
      disposition: survives_as_boundary_pole_exception
      finding: >-
        A section extending across X still carries every R_alpha. An arbitrary
        regular scalar on U may instead extend only rationally to X and may
        have poles on X minus U. On each generic coordinate fibre its at least
        B^5 zeros must be balanced by at least B^5 pole degree.
      consequence: >-
        Localization transfers the payload to denominator or boundary-pole
        order; it does not yield a section-degree-free theorem. Pole order and
        denominator construction must be charged separately.
    - id: RT-DIV-03
      escape_hatch: cartier_divisor_multiplicity
      disposition: closed_after_wording_revision
      finding: >-
        Set-theoretic no-false-negative vanishing implies ord_(R_alpha)(s)>=1.
        It does not imply a canonical global factorization or multiplicity
        exactly one. The correct assertion is div(s)>=sum R_alpha.
      consequence: >-
        "Carries the full product divisor" must mean domination of the reduced
        Cartier divisor, not equality with a scalar product polynomial.
    - id: RT-DIV-04
      escape_hatch: gauge_and_frame_dependence
      disposition: closed_for_divisors_but_fatal_to_scalar_wording
      finding: >-
        Row-frame rescaling multiplies local determinant equations by units on
        U and leaves R_alpha invariant. The full product scales a labelled row
        frame with exponent B^5. Frames with zeros or poles add boundary
        divisor terms and must be included in the pole ledger.
      consequence: >-
        The geometric divisor survives gauge changes, while unnormalized
        scalar values and their apparent numerator degrees do not.
    - id: RT-DIV-05
      escape_hatch: finite_deck_restriction
      disposition: open_and_outside_the_divisor_theorem
      finding: >-
        Once all decks are fixed constants there is no universal deck-variable
        divisor. Exactness only on the finite set of F_p-rational
        configurations does not force geometric component containment; finite
        field equations and interpolation can agree on that set without
        containing R_alpha over the algebraic closure.
      consequence: >-
        Credit requires one uniformly constructed algebraic section valid on
        a geometric family. A deck-specific or finite-domain reporter returns
        to P1551 and must charge advice, coefficient construction, aggregation,
        and exact source output.
    - id: RT-DIV-06
      escape_hatch: rational_reporters
      disposition: open_as_a_circuit_exception
      finding: >-
        For f=g/h regular on U, ord_(R_alpha)(f)>=1 still holds, but the
        compactified principal divisor has matching poles. A denominator that
        is nonzero only on the admitted finite evaluation set can place poles
        elsewhere and is not a global-U reporter.
      consequence: >-
        The theorem yields at least B^5 pole degree per coordinate, not a
        lower bound on the arithmetic-circuit size of g, h, or their quotient.
    - id: RT-DIV-07
      escape_hatch: reporter_families
      disposition: defeats_the_single_reporter_conclusion
      finding: >-
        A finite OR-family may distribute the irreducible R_alpha among its
        members. Irreducibility implies that each component is carried by at
        least one member, so total covered section degree is at least B^5 per
        coordinate, but no individual member need have that degree. A
        target-specialized five-list reporter has only B^4 weight in each
        factor-deck coordinate; B known targets restore B^5 total campaign
        weight.
      consequence: >-
        Number of reporters, target-specific coefficient construction, advice,
        adaptive queries, and total degree or circuit traffic must be charged.
        The one-section theorem cannot reject families by itself.
    - id: RT-DIV-08
      escape_hatch: false_positive_verification
      disposition: mixed
      finding: >-
        One universal reporter with no false negatives still contains every
        R_alpha even if it has extra zero components. Verification therefore
        does not evade the divisor inequality. A candidate-generating or
        randomized family that covers only subsets is outside the one-section
        interface and needs a complete coverage and output proof.
      consequence: >-
        Charge false-positive volume, recursive block queries, source
        unranking, and final group verification inside B^(9/4) campaign and
        B^(5/4) fresh-target work.
    - id: RT-DIV-09
      escape_hatch: section_degree_versus_arithmetic_circuit_size
      disposition: fatal_to_the_claimed_cost_obstruction
      finding: >-
        Geometric degree B^5 gives at most a logarithmic multiplication-depth
        observation under bounded-degree inputs. It gives no useful circuit-
        size, coefficient-construction, evaluation, or memory lower bound.
        Repeated squaring computes degree-p expressions in O(log p) gates, and
        norm or resultant circuits can retain high output degree without
        expanding coefficients.
      consequence: >-
        The divisor lemma cannot establish B^(5/2), B^(9/4), B^(5/4), or any
        other polynomial work lower bound. Repeated-squaring routes return to
        P1551 source aggregation; norm routes return to the P1513 specialized
        product-circuit exception.
    - id: RT-DIV-10
      escape_hatch: repeated_squaring
      disposition: survives_with_typed_aggregation_cost
      finding: >-
        A supplied scalar can be raised to p-1 with O(log p) multiplication
        gates despite degree p-1=Theta(B^5). In the split tuple algebra this
        operation is pointwise and neither combines tuple coordinates nor
        returns a nonzero source index.
      consequence: >-
        Formal degree cannot charge the powering circuit. Any useful route must
        separately construct or stream the represented source algebra and pay
        for cancellation-safe aggregation and exact source unranking, which is
        the P1551 boundary.
    - id: RT-DIV-11
      escape_hatch: norm_and_product_circuits
      disposition: survives_outside_standard_represented_grammars
      finding: >-
        The relation-divisor product is a norm of the determinant predicate
        over the split source domain. Standard coefficient, resultant,
        quotient, and source-jet realizations retain the P1513/P1551 B^3 or
        B^4 controls, but divisor degree does not lower-bound a specialized
        succinct norm circuit.
      consequence: >-
        A proposed norm must type its leaves, quotient or circuit input,
        coefficient construction, intermediate state, multiplicity, source
        unranking, and target recurrence. Until then it remains an explicit
        exception rather than a zero-cost operation or a closed route.
  required_controls:
    - >-
      State whether the reporter is a section on X, a regular function on U, a
      rational function on X, a finite-domain circuit, or a family; these
      interfaces are not interchangeable.
    - >-
      For a section, bind its line bundle and record the B^5 restriction degree
      on every labelled deck-point fibre. For a rational reporter, bind and
      charge the complete pole divisor and denominator construction.
    - >-
      Require geometric exactness over the algebraic closure or a stated
      extension-field family before inferring relation-divisor containment.
      Exactness only on fixed F_p decks receives no divisor credit.
    - >-
      For reporter families, give the OR, AND, adaptive, or randomized decision
      rule; component coverage; number of members; coefficient/advice build;
      total query work; and exact source replay.
    - >-
      Give an explicit arithmetic-circuit representation and charge circuit
      size, coefficient generation, intermediate state, denominator handling,
      source-diagonal aggregation, and output. Section degree alone is not a
      proxy for any of these costs.
    - >-
      Preserve the P1553 all-strata, rank, factor-log, scalar-blind masked-target,
      ambiguity, verification, bit-time, and bit-memory gates.
  counterexample_or_mutation: >-
    The finite-field map z -> z^(p-1) is zero exactly at z=0 and has formal
    degree p-1=Theta(B^5), yet repeated squaring evaluates it in O(log p)
    multiplications once z is supplied. Applying it pointwise to a supplied
    determinant does not aggregate or unrank tuple sources, but it decisively
    separates section degree from circuit size. A second mutation uses one
    determinant reporter per tuple and ORs verified hits: each reporter has
    constant individual degree, while total family coverage restores the full
    B^5 coordinate weight and B^6 member traffic.
  baseline_comparison: >-
    At B=N^(1/5), Pollard rho costs B^(5/2)=N^(1/2); the P1553 intermediate
    caps are B^(9/4)=N^0.45 for setup, state, and campaign work and B^(5/4)
    for one fresh target. The B^5 section weight is N, but no valid conversion
    from that weight to work or memory was proved. Standard explicit product,
    norm, source-algebra, and separator realizations retain the existing
    B^3/B^4 controls and fail the caps; specialized succinct circuits remain
    unclassified.
  narrowest_supported_statement: >-
    On the universal labelled six-deck configuration space, any single nonzero
    global algebraic section with no false negatives on the checked disjoint
    stratum has zero divisor at least the sum of all B^6 relation divisors and
    therefore line-bundle degree at least B^5 in every deck-point coordinate.
    A rational version pays the same amount as pole degree. This is a scoped
    divisor-accounting lemma only; it is not a finite-deck, reporter-family,
    arithmetic-circuit, source-recovery, incidence, cell-probe, or ECDLP lower
    bound.
  next_concrete_action: >-
    Preserve P1553's determinant-value residual and, before using this gate in
    any claim, require a versioned section/circuit interface that either derives
    a charged circuit-size consequence from the B^5 divisor weight or records
    the lemma as a P1512/P1513 semantic control without allocating P1554 or an
    experiment.
