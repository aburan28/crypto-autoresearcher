  - item: T6
    target: "Bibliography [35]: Page-Wesolowski EUROCRYPT 2024 - first reviewer found 'Proposition 8.5' does not exist; needed reduction is Proposition 8.4, GRH-conditional. Confirm or refute."
    verdict: CONFIRMED - ERROR (misnumbered citation) + GAP (unstated GRH assumption)
    justification: >
      Independently verified this session in BOTH versions. Published version
      (HAL hal-04209824v2 PDF, LNCS 14656, extracted locally): Section 8.3
      contains 'Proposition 8.4 (Isogeny reduces to EndRing). Assuming the
      generalised Riemann hypothesis, the problem Isogeny_lambda reduces to
      EndRing in probabilistic polynomial time...' and 'Theorem 8.5 (EndRing
      reduces to Isogeny)' (unconditional, CONVERSE direction, not what
      Corollary 1.2 needs); then Proposition 8.6 and Theorem 8.7 (the
      O~(p^{1/2}) algorithm). NO Proposition 8.5 exists. arXiv v2
      (2309.10432v2, HTML extracted locally): the same GRH-conditional
      statement appears as 'Proposition 13 (Isogeny reduces to EndRing)', and
      its Theorem 8.4 = EndRing reduces to Isogeny, Theorem 8.5 = the
      O~(p^{1/2}) algorithm - so no version of [35] contains a 'Proposition
      8.5' with the needed content. Consequences (matching first-review GAP-2,
      now double-sourced): (i) the citation '[35, Proposition 8.5]' is
      misnumbered in every available numbering; the intended statement is
      published Proposition 8.4 / arXiv Proposition 13; (ii) that statement
      is explicitly GRH-conditional, so the isogeny half of Corollary 1.2 as
      written silently imports GRH; (iii) the claim is salvageable in 2026
      via [33] (Herledan Le Merdy-Wesolowski TCC 2025, cited at frozen-text
      line 127 for the unconditional equivalence network), whose
      polynomial-time polynomial-memory reductions preserve the
      p^{1/3+o(1)} time-and-memory claim; Corollary 1.2 should cite [33] for
      Isogeny <= EndRing or carry a GRH disclaimer. Evidence files:
      coordination/tasks/TASK-20260724-P13-REV-R1/evidence/pw24_published_hal.pdf,
      .../pw24_arxiv_v2.html (+ extracted .txt).

