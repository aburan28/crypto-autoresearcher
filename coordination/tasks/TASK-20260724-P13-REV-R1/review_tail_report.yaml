per_item_verdicts:

  - item: T1
    target: "Tail of Theorem 1.1 proof (lines 193-220): P0 and Psi(X,B) asymptotics, total-cost multiplication by P0^{-1}, correctness argument"
    verdict: SOUND
    justification: >
      Verified line by line against the actual tail text; it matches what the
      proof requires and agrees with the first reviewer's independent
      recomputation from lines 1-200. (a) u = log(p/2)/(3 log B) = sqrt(log(p/2))
      since 3 log B = sqrt(log(p/2)); correct. (b) P0 = u^{-u(1+o(1))}: the
      tail writes a chain ending in '= p^{o(1)}' where the intermediate
      expression p^{-log(sqrt(log(p/2))) sqrt(log(p/2))/log p (1+o(1))} equals
      p^{-o(1)}; since P0 is a probability, the correct reading is
      P0 = p^{-o(1)} (equivalently P0^{-1} = p^{o(1)}). Notational sign slip
      only; the subsequent use (total cost = per-attempt cost x P0^{-1}) is
      correct. (c) w = log X/log B = 1/2 + (1/2) sqrt(log(p/2)): rechecked
      exactly from X = B^{1/2}(p/2)^{1/6} and 3 log B = sqrt(log(p/2)); correct
      (the +1/2 over the first reviewer's u_X = u/2 is absorbed in the o(1)).
      (d) Psi(X,B) = X w^{-w(1+o(1))} = p^{1/6+o(1)} by Theorem 1.4, and w is
      inside the CEP uniformity range (w ~ (log p)^{1/2}/2 relative to log X);
      correct. (e) Per-attempt cost Psi * X^{1+o(1)} * B^{O(1)} =
      p^{1/6+o(1)} p^{1/6+o(1)} p^{o(1)} = p^{1/3+o(1)}; expected total =
      P0^{-1} x per-attempt = p^{1/3+o(1)}; correct Las Vegas accounting
      (independent attempts, expected #attempts <= 1/P0). The random-walk cost
      per attempt (n = O(log p) steps) is p^{o(1)} and dominated; not restated
      in the tail but harmless. Memory = table size <= Psi X^{1+o(1)} =
      p^{1/3+o(1)} entries; consistent. (f) Correctness: phi separable
      E' -> E'^{(p)} with cyclic kernel; composition with Frobenius has
      inseparable degree p^1, not a square, hence non-scalar (any scalar
      [m] = [p^a m'] has inseparable degree p^{2a}, an even power); pullback
      omega^ . phi-Frob . phi . omega is non-scalar because omega^ alpha omega
      = [m] would force alpha scalar. Verified; correct as written.

  - item: T2
    target: "Section 4.2 experimental methodology (Deuring-correspondence sampling; uniqueness of the two-sided ideal P; shortest-vector norm = minimal isogeny degree)"
    verdict: SOUND-WITH-CAVEATS
    justification: >
      (a) UNIQUENESS OF P: two-sided ideals of a maximal order O in B_{p,inf}
      form the free abelian group on prime ideals; the ramified prime p has a
      UNIQUE prime ideal P above it (P^2 = pO, Nrd(P) = p), and every two-sided
      ideal of reduced norm p must equal it (unramified primes contribute norm
      ell^2). Claim correct (standard; Voight's quaternion reference). (b)
      ISOMETRY Hom(E, E^{(p)}) = (P, Nrd/p): the map psi -> psi^ o F (dual
      composed with Frobenius) sends isogenies E -> E^{(p)} of degree d to
      endomorphisms of degree d p, lands in the two-sided ideal of norm p, and
      deg(psi) = Nrd(psi^ o F)/p. This is exactly the identification used by
      [4] (Aubry-Oyono-Vincent, fetched this session: 'there exists an
      endomorphism of E of degree np iff there is an isogeny E -> E^{(p)} of
      degree n', via the Gross-lattice formulation). Correct and standard; the
      paper asserts it in Section 4.2 without proof or citation - acceptable
      for an experimental section, corroborated by [4]. (c) SAMPLING:
      'random maximal orders, uniformly random up to conjugation' induces
      uniform isomorphism classes of supersingular curves via the Deuring
      bijection {maximal orders up to conjugation} <-> {supersingular
      j-invariants}, which is the population Heuristic 1 quantifies over.
      Caveats: the actual sampling procedure is unspecified; natural samplers
      (random walks in the Brandt/ideal-class graph) converge to the mass
      distribution proportional to 1/#O^x, which differs from uniform only on
      the O(1) special classes with extra automorphisms (statistical distance
      O(1/p); PW24 Proposition 2, fetched this session, records the same
      O(1/p) gap and a rejection-sampling fix). Negligible for 10^4-10^5
      samples. (d) What the experiment supports: the two point-checks (item T3)
      probe the extreme lower tail of the largest-prime-factor distribution;
      they are consistency checks at the level of the Dickman model rho(u),
      which is stronger than the >= u^{-u(1+o(1))} direction Heuristic 1 needs.
      Supportive but not tight evidence; the figures themselves (CDF vs rho
      over the full range) are the primary evidence and are not independently
      reproducible from the text (no raw data archived in the frozen text).

  - item: T3
    target: "Section 4.2 'smoothest sample' consistency checks: 12589-smoothness at p = 5*2^248-1 (rho(u) ~ 1/69232); e^23-smoothness at p = 27*2^500-1 (rho(u) ~ 1/3312)"
    verdict: SOUND
    justification: >
      Recomputed independently this session (numerical_checks.py; Dickman rho
      by saddle-point Laplace inversion, validated at rho(2) = 1 - ln 2 with
      relative error 1.7e-3, and against the executor's independently
      validated implementation, agreement < 0.01 bit). CHECK 1: ln(p/2) =
      172.8168, ln B = ln 12589 = 9.44058, u = ln(p/2)/(3 ln B) = 6.1019;
      rho(u) = 1.4444e-5 = 1/69233. Paper claims 1/69232. Arithmetically
      CORRECT (1-part-in-69232 agreement, within rounding of the rho
      evaluation). Expected count 100000 * rho = 1.44; observing exactly 1
      sample smoother than 12589 is consistent. CHECK 2: ln(p/2) = 349.1763,
      u = 349.1763/69 = 5.0605; rho(u) = 2.998e-4 = 1/3335. Paper claims
      1/3312 (0.7% relative difference - consistent with a slightly different
      Dickman evaluation or rounding). Expected count 10000 * rho = 3.0;
      observing 1 is Poisson-consistent (P(N <= 1 | lambda = 3) ~ 0.20). Note:
      the paper's Figure-1 caption defines u = log(p/2)/(3x) with x = log B,
      i.e. exactly the recomputed formula; had one instead used the cruder
      u^{-u} convention one would get 1/62065 and 1/3661, so the paper's
      values are specifically rho(u) evaluations, and they check out.

  - item: T4
    target: "Section 4.1: M = Psi(X,B)*X as a LOWER bound; 'at least d isogenies of degree d'; 1 F_{p^2}-op-per-entry assumption; the five (time, memory) pairs"
    verdict: UNVERIFIABLE-AS-WRITTEN (with one GAP and one adequate hedge)
    justification: >
      (a) 'number of isogenies of degree d is at least d': TRUE for the
      cyclic-kernel count I(d) = d prod_{ell|d}(1+1/ell) >= d (first reviewer
      item 7a, re-verified). (b) GAP - 'M = Psi(X,B) X is a lower bound on
      table size': FALSE as a rigorous statement, off by a constant factor.
      #L = sum_{d in S(X,B)} I(d) >= sum d, and sum_{d in S(X,B)} d is NOT
      >= X Psi(X,B): in the Dickman model sum d ~ 0.44 X Psi at the paper's
      optimal parameters (recomputed), and the rigorous truncation bound
      sum d >= (X/2)(Psi(X,B) - Psi(X/2,B)) gives sum d >= ~0.21 X Psi for all
      five field sizes (recomputed numerically). Hence M overstates any
      provable lower bound by ~4.5-4.8x (~2.2 bits) and the true sum by
      ~2.2x. Acceptable as the order-of-magnitude estimate the paper intends;
      mislabeled as a 'lower bound'. Confirms first-review item 7(b) with
      precise constants. (c) The 1-F_{p^2}-op-per-entry assumption: stated in
      Section 4.1 as 'let us be conservative and assume ... a single
      F_{p^2}-operation per entry', and the introduction (line 43) explicitly
      warns the Section 4.1 estimates are 'tentative' and 'make optimistic
      assumptions on the actual cost of certain steps'. The hedge is adequate,
      though the word 'conservative' inside Section 4.1 is confusing (the
      assumption is optimistic about the ATTACK, i.e. cost-underestimating).
      The countervailing hedge (Lemma 3.5 tightness may OVERESTIMATE 1/P0,
      Remark 1) is also stated in the text (line 240). (d) The five pairs:
      NOT determined by the methodology as written. My independent
      reimplementation (P0 = u^{-u} per Lemma 3.5, Psi = X rho(w), B optimized
      on a 0.05-bit grid) yields deltas vs the paper of: 256: +2.23/+0.78;
      384: +0.37/-1.11; 512: +1.90/+0.05; 576: -0.92/-2.78; 768: -1.46/-3.51
      bits (time/memory) - matching the executor's EXP-WESOVOW-001 results
      (tolerance +/-0.75 bit; up to 3.51 bits off) to within 0.1 bit on every
      entry. Two independent implementations agree with each other but not
      with the paper; a P0 = rho(u) variant shifts results by up to ~2.7 bits
      without closing the gap. The residual is consistent with unspecified
      choices (exact-Psi vs Dickman approximation, B grid, rounding, rho
      evaluation). Conclusion: the five pairs are plausible rough estimates
      reproducible only to ~+/-2-3.5 bits; the paper's own 'tentative' hedging
      covers this, but the numbers cannot be validated as written.

  - item: T5
