object: >
  Falsification attempts against the interpretation, the concrete cost model,
  and the claimed scope of Wesolowski (2026), "The supersingular isogeny
  problem in time and memory p^{1/3+o(1)}" (frozen source
  inputs/P13-WESOLOWSKI-2026/paper_fulltext.md), and against the wave-1
  producer artifacts research/P13-HEUR-001/heuristic_analysis.md and
