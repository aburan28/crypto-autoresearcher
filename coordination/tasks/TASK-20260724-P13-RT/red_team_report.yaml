summary_of_falsification_attempts: >
  ATTEMPTED AND FAILED to break the exponent: no new arithmetic bias
  beyond the producer's constant-factor B3 was found; the ell = 2 gap in
  the producer's nondegeneracy argument (RT-H3) is the cheapest
  remaining hiding place for a constant-factor model falsification and
  is untested. SUCCEEDED in falsifying the INTERPRETATION of the paper's
  experimental support: Figures 1-2 test the body of the distribution
  under an unidentified size model, while Heuristic 1 is a tail
  statement at u ~ sqrt(log p) (RT-H1). SUCCEEDED in falsifying the
  NEUTRALITY of the cost model's c = 0 scenario: a defensible classical
  calibration of the un-costed modular-polynomial work sits at c ~ 1.8,
  where the NIST-I margin shrinks to ~2.3 bits - inside the paper's own
  +/-3.51-bit irreproducibility band (RT-C1, RT-C4). SUCCEEDED in
  bounding the SCOPE claim: "beats Delfs-Galbraith at any super-polylog
  memory" is formally true in the idealized RAM model with c = 0 and
  practically undecidable at NIST-I from the current record; NIST-III/V
  margins survive all tested scenarios (RT-S1). No objection in this
  report touches Theorem 1.1 as a conditional asymptotic statement;
  every objection targets interpretation, concrete-cost precision, or
  scope, and each names its cheapest discriminating control.

