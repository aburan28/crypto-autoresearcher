    - "IDEA-156 conditional coefficient oracle"
    - "IDEA-199 endpoint subset/source deck"
    - "IDEA-266 supplied triangular source algebra"

target_update_audit:
  predicate_syntax_update: "constant target-row substitution plus O(log p) pointwise powering"
  contraction_update: "unsupplied"
  endpoint_form: "new target is a new coefficient [R] of a fixed fivefold convolution"
  row_mode_form: "global target mode has B^(5+o(1)) coordinates"
  support_factor_update: "post-mask CP/TT factors require new target-specific matched endpoint sets"
  required_cap: "B^(5/4+o(1)) work and workspace"
  verdict: "fail"

conditional_source_replay:
  required_oracle: >-
    Preprocess(F_1,...,F_5) within B^(9/4), then return the exact target-
    labelled C_R(w_1,...,w_5) for canonical dyadic binary deck weights within
    B^(5/4).
  integer_safety: "every conditional fixed-target count is at most B^4<p"
  one_source_queries: "5*ceil(log_2 B)+O(1)"
  all_source_queries: "O((Z_R+1) log B), plus serialized output"
  sign_replay: "deck labels map through exact signed dictionaries, followed by elliptic verification"
  multiple_fibres: "exact counts permit a canonical positive branch; both branches enumerate all tuples"
  missing_strata:
    - "cross-colour repeated determinant rows create false zeros outside the checked stratum"
    - "infinity and alternate charts"
    - "tangent, vertical, collision, and nonreduced conventions"
    - "charged target, deck, and blind-mask rebuilds or a global confluent reporter"
  verdict: "the replay reduction is exact if the unsupplied oracle and predicate scope are granted"
  coordinator_lemma_classification:
    classification: "deduplicated_conditional_reduction"
    exact_bound: >-
      For every fixed target and arbitrary restricted subdecks, four selected
      points determine at most one fifth point, so the count is at most B^4<p.
    deterministic_replay: >-
      Binary partition one colour at a time, retaining a half exactly when its
      target-labelled count is nonzero; this needs sum_i ceil(log_2 |F_i|)=
      O(log B) count calls and ends in one verified signed singleton tuple.
    cost_consequence: >-
      Source unranking is not a separate exponent after a subset-stable exact
      count constructor is supplied; subset encoding and coefficient rebuilds
      remain charged inside the fresh-target query cap.
    semantic_deduplication:
      - "P1551 endpoint coefficient and source-unranking residual"
      - "IDEA-156 conditional coefficient source self-reduction"
    scope_edges:
      - "full-deck-only or target-fitted counts do not support the reduction"
      - "campaign-unlabelled counts can wrap or hide the successful target"
      - "the identical interface must accept a fresh blind target"
      - "determinant overlap false positives remain outside the checked disjoint stratum"
      - "signed singleton replay and elliptic verification remain mandatory"
      - "enumerating every multiple-fibre tuple is output-sensitive and separately charged"

