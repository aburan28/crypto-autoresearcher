sharp_reduction:
  name: "finite-deck weighted endpoint coefficient (FD-WEC)"
  statement: >-
    On the checked disjoint stratum, a coefficient-complete determinant mask
    contraction supporting target-labelled dyadic subdeck restrictions is
    equivalent, up to logarithmic exact source replay, to a target-uniform
    weighted endpoint-coefficient oracle in F_p[G].
  specialized_norm_alternative: >-
    A characteristic norm is equivalent only if it returns exact zero
    multiplicity or count, supports the same restrictions and fresh targets,
    and constructs source idempotents; a norm bit does not pass.
  operation_level_deduplication: >-
    FD-WEC is the P1551 endpoint-coefficient/source-unranking residual and the
    coefficient-oracle control in IDEA-156/199, now given exact determinant
    CP/TT and split-projector equivalences. It is not a new candidate.

