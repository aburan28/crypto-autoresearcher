model:
  curve_scope: "ordinary prime-field curve with public prime-order subgroup G=<P>"
  asymptotic_relation: "N=p^(1+o(1)), B=N^(1/5)"
  campaign_decks: 6
  fixed_target_source_decks: 5
  deck_size: "Theta(B)"
  admitted_predicate_stratum: "checked pairwise-disjoint signed actual-point decks"
  predicate: "M=1-D^(p-1), D=det(1,x,y,x^2,xy,x^3)"
  fixed_target_count_bound: "0 <= Z_R <= B^4 < p"

rank_receipt:
  pre_mask_campaign:
    condition: "each coloured evaluation-row deck spans F_p^6"
    ordered_tt_ranks: [6, 15, 20, 15, 6]
    cp_rank_lower_bound: 20
    cp_rank_upper_bound: 720
    constructor: "public Leibniz/wedge representation with O(B) factor storage"
  pre_mask_fixed_target:
    condition: "each factor deck spans F_p^6/<v(-R)>"
    ordered_tt_ranks: [5, 10, 10, 5]
    cp_rank_lower_bound: 10
    cp_rank_upper_bound: 120
    constructor: "public alternating five-form representation"
  post_mask_campaign:
    exact_tt_formula: >-
      At every cut S|S^c, rank Flat_S(M)=r_S, where r_S is the number
      of endpoint sums attained on S whose negatives are attained on S^c.
    cp_rank_bounds: "max_S r_S <= rank_CP(M) <= Z"
    exact_cp_condition: "rank_CP(M)=Z whenever one cut gives a distinct matched endpoint for every relation tuple"
    random_control_only: "Z and balanced r_S are Theta(B) in the sparse random-support model"
  post_mask_fixed_target:
    exact_tt_formula: "rank Flat_S(M_R)=r_(R,S), the matched partial-endpoint count"
    cp_rank_bounds: "max_S r_(R,S) <= rank_CP(M_R) <= Z_R"
    random_control_only: "Z_R is Theta(1) for a typical target"
  fermat_power:
    identity: "D^[p-1]=J-M"
    flattening_rank_bounds: "max(0,r_S-1) <= rank Flat_S(D^[p-1]) <= r_S+1"
    cp_rank_upper_bound: "Z+1"
  interpretation: >-
    The low post-mask ranks are support-sensitive representation existence.
    Sparse CP/TT terms name relation paths; dense TT cores with rank Theta(B)
    require Theta(B^3) storage. No support-independent constructor is supplied.

schur_row_mode_audit:
  arbitrary_power_tt_bound: >-
    rank Flat_s(D^[q]) <= min(B^s,B^(6-s),
    binomial(q+binomial(6,s)-1,binomial(6,s)-1)).
  campaign_cp_bound: "rank_CP(D^[q]) <= binomial(q+719,719)"
  fixed_target_mutation: "replace binomial(6,s) by binomial(5,s) and 720 by 120"
  unary_elliptic_mode: "min(B,6q), since dim H^0(E,L^q)=6q"
  q_equals_p_minus_one_global_mode: "B^(5+o(1))"
  exact_positive_controls:
    - "q=1 weighted determinant contraction costs O(B) but is not a zero reporter"
    - "q=2 mixed-discriminant contraction costs O(B) but is not a zero reporter"
  verdict: >-
    Repeated squaring is pointwise; exact rank recompression to the matched-
    endpoint space requires a source diagonal, support pivots, or represented
    endpoint traffic. No annihilator-complete contraction is constructed.

constructor_audit:
