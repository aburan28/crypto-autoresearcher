    failure: "restores central endpoint/source traffic"

finite_deck_annihilator_audit:
  universal_mask:
    syntax: "1-T^(p-1)"
    coefficient_cost: "public and O(log p) pointwise depth"
    failure: "no contraction or source inverse"
  attained_value_mask:
    syntax: "h_R(T)=product_(z in S_R)(1-T/z)"
    exactness: "exact after the complete nonzero determinant value set S_R is supplied"
    failure: "value-image and coefficient construction, contraction, and target update are unsupplied"
  slice_masks:
    exact_bound: "a coherent generic slice needs Omega(B) nonzero-value roots"
    failure: "coefficients vary with the other source choices and restore prefix/source traffic"

ffe_audit:
  source_algebra: "A_[5]=tensor_i Map(F_i,F_p), dimension B^5"
  projector: "m_R=1-d_R^(p-1), multiplication by m_R is idempotent"
  exact_count: "rank(m_(m_R))=Tr(A_[5]/F_p)(m_R)=Z_R mod p, with Z_R<p"
  exact_solution_algebra: "im(m_(m_R)) is Map(relation tuples,F_p)"
  source_recovery_if_constructed: "restrict coordinate multiplications to the image and split primitive idempotents"
  frobenius: "identity on the split F_p source algebra; no source mixing"
  trace_failure: "standard trace/power-projection/transposed operations are charged in B^5 represented dimension"
  norm:
    exact_content: "Norm(d_R)=0 iff a checked-stratum relation exists"
    failure: "bare norm returns neither count nor source"
  characteristic_norm:
    exact_content: "Chi_R(T)=Norm(T-d_R) has T-adic order Z_R"
    failure: "standard constructor and source idempotents retain B^5/B^3 traffic"
    exception: "a succinct restriction-aware characteristic norm remains open"

endpoint_convolution_audit:
  exact_formula: "C_R(w_1,...,w_5)=[R] product_i sum_j w_i(j)[A_(i,j)] in F_p[G]"
  point_basis: "public insertion; B^3 complementary triple traffic"
  full_endpoint_vector: "B^5 state; O(1) coefficient lookup only after state is paid"
  character_basis: "hidden scalar/pairing orientation or all B^5 modes"
  pair_preprocessing: "B^2 state fits; one fresh target still exposes B^3 triple work"
  noncharacter_exact_extractor: "unsupplied and explicitly unclassified"
  semantic_controls:
