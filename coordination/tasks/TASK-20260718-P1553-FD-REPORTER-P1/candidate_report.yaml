    representation: "one delta product per relation tuple"
    storage: "O(Z) sparse labels or O(BZ) dense factors"
    failure: "the constructor input is the desired relation support"
  dense_tt:
    representation: "post-mask TT with typical campaign rank Theta(B)"
    storage: "Theta(B^3) internal cores"
    failure: "exceeds B^(9/4) state"
  sparse_tt:
    representation: "relation-path automaton"
    storage: "output-sized after support"
    failure: "paths already identify sources"
  tt_or_cp_cross:
