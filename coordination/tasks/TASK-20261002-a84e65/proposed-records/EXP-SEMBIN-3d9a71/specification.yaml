  # ---------------------------------------------------------------------------
  heuristic_as_stated:
    source: coordination/tasks/TASK-20261001-9b3e70/proposed-records/heuristic-restatement.md
    source_lines: "24-26 (shared definitions), 54-60 (formal statement and clause (a)), 69-71 (falsification condition)"
    source_binding_note: >-
      No receipt of TASK-20261001-d815a6 was found, so these bytes are not
      hash-fixed. The text is copied verbatim and unedited so that a reviewer
      can diff it.
    shared_definitions_verbatim: |
      - **Group.** E/F_{2^n} is a binary curve with n prime. ⟨P⟩ ≤ E(F_{2^n}) has prime order ℓ and cofactor h ∈ {2, 4}.
      - **Factor base.** V ⊂ F_{2^n} is an F_2-subspace of dimension D. The factor base is F = F_V = {Q ∈ ⟨P⟩ : x(Q) ∈ V}, which is negation-closed, with |F| ≈ 2^D / h (heuristic count, not derived exactly here).
      - **Koblitz case.** On a Koblitz curve with σ-stable V, F is also π-closed.
    formal_statement_verbatim: |
      **Formal statement.** Fix (n, E, ⟨P⟩, V) as in §2, with ℓ prime, and let F = F_V. Let F* be a uniformly random negation-closed list of the same size, also π-closed on Koblitz curves with σ-stable V: a union of the same number of ±-orbits (or ⟨±π⟩-orbits) of uniformly random elements of ⟨P⟩. Two statistics must be indistinguishable between F and F*, up to the stated tolerance:

      - **(a) Two-sum coincidences.** N_2(F) is the number of unordered pairs {{a, b}, {c, d}} ⊂ F with a + b = c + d, excluding formal identities:
        - excluded identities are {a, b} = {c, d}, and pairs where both sides are 0 (a = −b and c = −d);
        - on the Koblitz case, π-images are also excluded.

        N_2(F) is Poisson-distributed with the same mean λ_2 as N_2(F*). For a random list, λ_2 ≈ |F|^4/(8ℓ). The constant here is scratch and must be fixed by the null sample, not by this formula.
    falsification_condition_verbatim: |
      At any tested cell, either of these, with the null F* passing its own calibration and the positive control detected:
      - the empirical distribution of N_2 or of the decomposition count departs from the F* null at p < 10^-3 after Bonferroni correction over all cells;
      - the largest-count cell exceeds the Poisson tail predicted by λ at p < 10^-3.
    quantifiers:
      curves: >-
        FOR ALL binary E/F_{2^n}, n prime, <P> of prime order l, cofactor h in
        {2, 4}. Tested: n in {31, 37, 41, 43, 47}. Per n, three ordinary
        curves (O4a, O4b with h = 4; O2 with h = 2) and every admissible
        Koblitz curve E_a, a in {0, 1}.
      V: >-
        "Fix V", read as FOR ALL V of dimension D. Tested by sampling: V
        uniform among D-dimensional subspaces (arms O4, O2, KR); every window
        W_s = span{z^s, ..., z^(s+D-1)}, s = 0..n-D (arm W); every
        sigma-stable V of dimension D (arm KS, exhaustive). V-classes of
        density below about 1/N_V are not resolved.
      D: >-
        Implicit (dim V). An integer per (n, h), so that the scratch lambda_2
        exponent is 4D - n - 9 (h = 4) or 4D - n - 6 (h = 2).
      closure_group: >-
        Gamma = <-1> for ordinary curves and for Koblitz curves with V not
        sigma-stable. Gamma = <-1, pi> on Koblitz curves with sigma-stable V,
        where every orbit has size exactly 2n.
      null_list: >-
        F* = a union of k_i distinct Gamma-orbits of uniform elements of
        <P> \ {O}, where k_i = |F_(V_i)| / |orbit|. The size is matched per
        V_i to the REALISED size.
      exclusion_set: >-
        {a, b} = {c, d}, and the class a + b = c + d = O. Both are removed
        exactly by N_2 = sum over g != O of C(r(g), 2) taken over 2-element
        subsets. "pi-images excluded" is ambiguous (A3) and is read as orbit
        counting in R_2. N_2 carries no pi exclusion, because the null carries
        the same orbits.
      tolerance: >-
        None is stated in clause (a) (A7). The operative tolerance is this
        contract's reported resolution rho_90.
    statement_issues:
      location: DESIGN.md section 2 (A1 to A11), reported separately as the card requires
      material: >-
        A1. Coincidences in any negation-closed list come in clumps of 6
        (zero-sum 4-sets) and 2 (degenerate multisets), so N_2 = 6 Z4 + 2 Z3
        exactly. N_2(F*) therefore has variance/mean about 6 (about 6n on
        pi-closed lists) and is NOT Poisson. As worded, "N_2(F) is
        Poisson-distributed" is falsified by the heuristic's own null. This
        contract tests "same distribution" on N_2 as worded (S1, S2, by
        permutation) and the Poisson clause on the orbit count R_2 (S3, N-POI).
        That is the proposed restatement (a'), which is not adopted.
      others: >-
        A2 (are {a, a} pairs allowed; this decides whether the formal identity
        2a = mu pi(a) - pi^2(a) is counted |F| times on Koblitz curves); A3
        (three readings of "pi-images excluded"); A4 (every V or random V);
        A5 (realised size); A6 (the omitted |F|^3/(2 l) term); A7 (no
        tolerance); A8 (which lambda in the tail clause); A9 (two-sided);
        A10 (transfer); A11 (the pi-closure sub-clause may be untestable on
        this n-grid).
      routing: >-
        JR-3 rules on the statement in parallel. If the statement changes,
        this contract is re-drafted before approval.

  # ---------------------------------------------------------------------------
  scope:
    included:
      - "Arms O4, O2, W, KR, KS on the cell table below (C_max = 85 cells), at n in {31, 37, 41, 43, 47}"
      - "Controls (i)-(vi), gates G0-G12, the mutation self-test M1-M20"
      - "Optional disclosed-weak arm V3 at n = 131 (ECC2K-130, D = 16, 3 random V)"
      - "Calibration curves CAL-13 and CAL-19, for the gates only; never evidence"
    excluded:
      - Clause (b) of HEUR-HARVEST-FV-1 (decomposition counts, V2) and HEUR-HARVEST-FV-2 (V4)
      - Any discrete logarithm, relation collection, linear algebra or attack
      - Any reuse of experiments/EXP-SEMBIN-04ec3c/code/v2/ (model_v2.py, gate_v2.py, run_v2.py), per DEC-20261002-7a3f19 R3
      - "n = 163 in V3: no primary source for its parameters is vendored"
      - Any statement about the security of any curve

  # ---------------------------------------------------------------------------
  definitions:
    field: >-
      F_(2^n) = F_2[z]/(f_n). f_n is the irreducible trinomial z^n + z^k + 1
      with least k; if none exists, the lexicographically least irreducible
      pentanomial. Irreducibility is tested by z^(2^n) = z mod f_n together
      with f_n(0) = f_n(1) = 1, which is sufficient for prime n. Elements are
      bit-integers. f_n is recorded per n.
    ordinary_curve: >-
      y^2 + x y = x^3 + A x^2 + B. A = 0 for the h = 4 roles, A = 1 for h = 2
      (Tr(1) = 1 for odd n). B is drawn by a SHA-256 counter-mode DRBG under
      label EXP-SEMBIN-3d9a71|curve|<n>|<role>|<attempt>, with B not in F_2.
      #E is computed by BSGS on the order of a random point in the Hasse
      interval, required unique and confirmed by [#E]R = O on 20 random
      points. ACCEPT iff #E = h l with l PROVED PRIME by complete trial
      division to floor(sqrt(l)). Roles: O4a and O4b are the first and second
      acceptances with A = 0; O2 is the first acceptance with A = 1. Rejected
      attempts are logged. Calibration curves CAL-13 (n = 13, A = 0) and
      CAL-19 (n = 19, A = 1) are selected the same way under role CAL.
    koblitz_curve: >-
      E_a: y^2 + x y = x^3 + a x^2 + 1, a in {0, 1}, h = 4 (a = 0) or 2
      (a = 1). #E is computed from the Lucas sequence V_0 = 2, V_1 = mu,
      V_k = mu V_(k-1) - 2 V_(k-2), mu = (-1)^(1-a), #E = 2^n + 1 - V_n, and
      cross-checked by BSGS on 10 points. ADMISSIBLE iff #E/h is proved prime
      by trial division. Admissibility at each n is NOT assumed here.
      EXP-BINSTD-c9c8a2 records (31, a = 0) as inadmissible and (41, a = 0) as
      admissible; both are contract statements, not verified by this task.
    generator_and_subgroup: >-
      P = [h]R for random R with P != O, and [l]P = O. <P> = {Q : [l]Q = O}.
      Membership is DEFINED by [l]Q = O. The halving-trace criteria may be
      used as a fast filter only if they agree with [l]Q = O on every
      element at the calibration curves and on a 1% sample elsewhere (G6).
    frobenius_eigenvalue: >-
      Koblitz only. lambda is the root of lambda^2 - mu lambda + 2 = 0 mod l
      with pi(P) = [lambda]P, where pi(x, y) = (x^2, y^2).
    V_distributions:
      random: >-
        A D x n bit matrix from the DRBG (label
        EXP-SEMBIN-3d9a71|<cell>|V|<i>), accepted iff of rank D. Its row space
        is uniform over D-dimensional subspaces. Duplicates within a cell are
        rejected and logged.
      window: "W_s = span{z^s, ..., z^(s+D-1)} in the polynomial basis of f_n, s = 0..n-D (all of them)"
      sigma_stable: >-
        V_g = ker g(sigma) for every g dividing x^n - 1 over F_2 with
        deg g = D (sigma(x) = x^2). The check sigma(V_g) = V_g and
        dim V_g = D is a gate. Exhaustive.
    factor_base: >-
      F_V = {Q in <P> : x(Q) in V}. Built by enumerating x in V \ {0} and
      testing Tr(x + A + B/x^2) = 0. y is solved by the half-trace, both y
      are kept, and membership is tested by [l]Q = O. |F_V| is recorded. If
      |F_V| = 0, the V is skipped, logged and replaced by the next index.
    statistic:
      r: "r_F(g) = #{ {a, b} : a, b in F, a != b, a + b = g }"
      N_2: "N_2(F) = sum over g != O of r_F(g) (r_F(g) - 1) / 2 (exactly clause (a): distinct 2-subsets, the g = O class dropped)"
      Z3: "Z3 = (1/2) sum over t in F of [ r_F(-2t) - 1{-3t in F} ]: zero-sum multisets {t, t, u, v}, up to global sign"
      Z4: "Z4 = (N_2 - 2 Z3) / 6: zero-sum 4-sets with no antipodal pair, up to global sign; must be a non-negative integer (G9)"
      R_2: "R_2 = Z4 + Z3 for Gamma = <-1>; R_2 = (Z4 + Z3) / n for Gamma = <-1, pi> (Z4 and Z3 each divisible by n, G9)"
      identity_note: >-
        N_2 = 6 Z4 + 2 Z3 exactly. This is scratch derivation in DESIGN.md
        section 2 (A1), checked by G1 and G9 before any reading.
      structural_identities_every_list: >-
        sum over g of r(g) = C(|F|, 2) (KN-FIND-007 at m = 2); r(O) = |F|/2;
        r(g) = r(-g).
    null_list: >-
      For each V_i, M lists of exactly |F_(V_i)| elements. Each list is a
      union of k_i distinct Gamma-orbits of r drawn uniformly from
      [1, l - 1] (label EXP-SEMBIN-3d9a71|<cell>|null|<i>|<j>). The orbits
      are {r, -r}, or {+-lambda^j r : j < n} for KS, with rejection of
      repeated orbits. COUNTED IN Z/l (integer path). One more list per
      stratum (j = 0, label ...|placebo|<i>) is held out as the placebo.
    lambda_hat: >-
      lambda_hat_2(cell) is the mean N_2 over the cell's null pool, and
      lambda_hat_R(cell) is the mean R_2 over it. The scratch formula
      |F|^4/(8 l) enters ONLY the N-SCALE sanity band and never a prediction.

  # ---------------------------------------------------------------------------
  cells:
    rule: >-
      For each curve of h = 4 (O4a, O4b, Koblitz a = 0) take D with
      e = 4D - n - 9 in {-2, 0, 2, 4, 6}. For each curve of h = 2 (O2,
      Koblitz a = 1) take D with e = 4D - n - 6 in {-1, 1, 3, 5}. lambda_nom =
      2^e (scratch). Arm W uses the D of O4a and O2. Arm KS uses
      sigma-stable D with e <= 8 on admissible Koblitz curves (n = 31 and 43
      only; DESIGN.md A11).
    table: |
      h = 4 (O4a, O4b, KR a=0):  n=31: D=10 (e 0), D=11 (e 4)
                                 n=37: D=11 (e -2), D=12 (e 2), D=13 (e 6)
                                 n=41: D=12 (e -2), D=13 (e 2), D=14 (e 6)
                                 n=43: D=13 (e 0), D=14 (e 4)
                                 n=47: D=14 (e 0), D=15 (e 4)
      h = 2 (O2, KR a=1):        n=31: D=9 (e -1),  D=10 (e 3)
                                 n=37: D=11 (e 1),  D=12 (e 5)
                                 n=41: D=12 (e 1),  D=13 (e 5)
                                 n=43: D=12 (e -1), D=13 (e 3)
                                 n=47: D=13 (e -1), D=14 (e 3)
      W (windows; on O4a and O2): the same (n, D) as O4a (12 cells) and O2 (10 cells)
      KS (sigma-stable; exhaustive; only if admissible):
        (n=31, a=0, D=10, e 0, 15 V)  (n=31, a=0, D=11, e 4, 15 V)
        (n=31, a=1, D=10, e 3, 15 V)  (n=31, a=1, D=11, e 7, 15 V)
        (n=43, a=0, D=14, e 4, 3 V)   (n=43, a=0, D=15, e 8, 3 V)
        (n=43, a=1, D=14, e 7, 3 V)
      C_max = 24 (O4) + 10 (O2) + 22 (W) + 22 (KR) + 7 (KS) = 85
    grid_coverage: >-
      Every lambda grid value 2^-2 ... 2^6 occurs at two or three n (h = 4).
      The odd exponents (h = 2) occur at two or three n. KS cells up to 2^8
      lie outside the card's grid and are disclosed. (43, a = 1, D = 15) at
      2^11 is dropped, because |F| of about 2^14 exceeds the 4 GB key budget
      without an orbit-reduced counter.
    v3_weak_arm: >-
      OPTIONAL. ECC2K-130: y^2 + xy = x^3 + 1 over F_2[z]/(z^131 + z^13 + z^2
      + z + 1), #E = 4 l, l = 680564733841876926932320129493409985129, read
      by the executor from inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md
      lines 1093-1098, HALTING the arm on any disagreement. D = 16, 3 random
      V. Not in the Bonferroni family.

  independent_variables:
    - arm (O4, O2, W, KR, KS; V3 optional)
    - curve (role per n; Koblitz a)
    - n and D (hence the nominal lambda_2)
    - V index within the cell
    - list role (F_V, null j = 1..M, placebo, AP and dilates, GAP, SID, planted)

  # ---------------------------------------------------------------------------
  sample_sizes:
    rule: >-
      Random-V arms (O4, O2, KR): N_V = max(30, ceil(300 / lambda_nom)) and
      M = 5. Arm W: N_V = n - D + 1 (all windows) and M = 20. Arm KS: N_V =
      the number of sigma-stable V (15 or 3) and M = 200. Controls: AP, GAP =
      30 lists per random-V cell; SID = N_V capped at 300, at cells with
      lambda_nom >= 2^2; each control list has 5 matched null lists.
    table: |
      lambda_nom  N_V   E = N_V lambda/6   rho_90 excess   rho_90 deficit   P(R_2=0) per null list
      2^-2        1200  50                 2.01            none (only ~0)   0.959
      2^-1        600   50                 2.01            none             0.920
      2^0         300   50                 2.01            none             0.846
      2^1         150   50                 2.01            none             0.717
      2^2         75    50                 2.01            none             0.513
      2^3         38    51                 2.00            none             0.264
      2^4         30    80                 1.80            <= 0.20          0.069
      2^5         30    160                1.57            <= 0.43          0.005
      2^6         30    320                1.40            <= 0.60          ~2e-5
    derivation: >-
      Scratch. Under H0, R_2 per list is about Poisson(mu_R), with mu_R about
      lambda_2/6 (Gamma = <-1>) or lambda_2/(6n) (KS). The cell total has
      E = N_V mu_R. For a uniform rate ratio rho = 1 + delta, the stratified
      permutation test with M nulls per stratum detects at power 0.9 and
      two-sided alpha' = 2.90e-6 (z = 4.68) when delta (M/(M+1)) E >=
      (4.68 + 1.28) sqrt(E), i.e. delta_90 = 7.15 / sqrt(E) at M = 5. The
      target E = 50 gives rho_90 = 2.0 (one bit of relation yield). The floor
      of 30 is for S2-S4.
    pooled: >-
      Arm-pooled S1 rho_90 (excess, scratch): O4 about 1.14 (E about 2460);
      O2 about 1.27 (722); KR about 1.16 if every Koblitz curve is admissible
      (1952); W about 1.17 (1280, M = 20); KS about 1.96 if all 7 cells are
      admissible (E about 39). Per-cell W and KS cells at low lambda (E from
      0.08 to 6) are gross-effect only.
    at_lambda_2_minus_2: >-
      CAN detect: a uniform excess of rho >= 2 per cell; a near-total absence
      of relations; a structured sub-population of V at density >= about 1%
      with a large per-V excess (S3, S4). CANNOT detect: any deficit except
      rho of about 0; V-classes rarer than about 1/1200 (for example
      V contained in ker Tr, density 2^-D); rho < 2 per cell (only the pooled
      arm, at about 1.14); anything about the dense-regime constant.
    v1_comparison: >-
      Scratch. V1's 10 subspaces / 100 null lists give E = 10 lambda/6:
      rho_90 of about 25 at 2^-2 (exact Poisson one-sided threshold T >= 7
      at E = 0.42) and about 1.63 at 2^6. That design is seconds per cell and
      sees gross structure only, so it is not adopted.

  # ---------------------------------------------------------------------------
  controls:
    - id: C-NULL
      card_item: (i)
      what: >-
        The matched null (integer path, M per V), counted by the same
        definitions. N-SCALE: lambda_hat_2 / (mean |F|^4 / (8 l)) in
        [0.5, 2] at every cell, as a counter sanity band only. N-POI: Poisson
        heterogeneity of the null's R_2, by conditional-multinomial Monte
        Carlo given stratum totals, p >= 10^-3 / 85 per cell. PLACEBO: the
        held-out null list per stratum is run as "V" through S1-S4 and the
        pooled tests.
      required: >-
        N-SCALE in band at every cell; no placebo test at raw p <= 2.90e-6;
        N-POI passes (a single-cell failure makes that cell inconclusive;
        >= 2 cells makes the run inconclusive).
      blocking: true
    - id: C-AP
      card_item: (ii)
      what: >-
        F_AP = {+-jP : 1 <= j <= k} with k = (median |F_V| of the cell)/2,
        plus 29 random dilates {+-j s P}. Run as a 30-stratum pseudo-cell with
        5 matched null lists each. One AP list per cell is also counted
        through the point path.
      required: >-
        S1 Bonferroni-corrected p < 10^-6 (raw p <= 2.90e-9) at every admitted
        random-V cell. S2 rejects at its Monte Carlo floor. All 30 N_2 values
        are identical and equal an independent integer count over
        {+-1..+-k} (G5).
      blocking: true
    - id: C-PLANT
      card_item: (iii)
      what: >-
        Null lists with k_inj in {1, 2, 5, 20} injected parallelograms
        {u, u+v, u+w, u+v+w}. On Gamma = <-1> lists, each adds one Z4 orbit
        (N_2 += 6, R_2 += 1). On KS lists the four elements' full
        <+-pi>-orbits are added, giving N_2 += 6n, Z4 += n and R_2 += 1 when
        the four lie in distinct orbits. Also Z3-type injections
        {t, u, -2t-u} (Z3 += 1, N_2 += 2). Integer and point paths on every
        cell; brute force where |F| <= 48.
      required: >-
        The counter returns EXACTLY the independent integer recount, and the
        brute-force count where available. The increment equals the injected
        number except for accidental extras that the exact recount identifies
        and records.
      blocking: true
    - id: C-SCALE
      card_item: (iv)
      what: Each lambda grid value at >= 2 n among five n; S-TREND (slope of log rho_hat on log2 l per arm, with its CI)
      required: A band with fewer than 2 admitted n is INCONCLUSIVE for that band. S-TREND is reported and does not decide.
      blocking: false
    - id: C-SEEDS
      card_item: (v)
      what: >-
        Every random draw is keyed by a unique label
        EXP-SEMBIN-3d9a71|<cell>|<role>|<i>|<j>. The V, null, placebo,
        plant, control, curve and replication streams are disjoint.
      required: G11 passes (no label collision; no repeated V within or across cells; no repeated null orbit set)
      blocking: true
    - id: C-NEARBY
      card_item: (vi)
      what: >-
        GAP: the rank-2 GAP {+-(i g1 + j g2) P : 1 <= i <= L1, 1 <= j <= L2},
        L1 L2 = k, with g1 and g2 random. Koblitz curves use g2 = lambda g1
        (the Frobenius GAP, curve-natural), giving 30 lists per cell. SID: an
        alteration-built Sidon list (drop one orbit from each relation,
        refill with fresh orbits, repeat until R_2 = 0 at size k), N_V lists
        capped at 300, at cells with lambda_nom >= 2^2 (the deficit control).
        SENS: 200 resampled pseudo-cells per random-V cell. Per stratum, one
        of the M + 1 null values is the pseudo-V, plus Poisson((rho - 1)
        mu_hat_R) injected relations (N_2 += 6 each), at rho in {1.5, 2, 3}.
        Additivity is gated by C-PLANT.
      required: >-
        GAP: S1 corrected p < 10^-6 at every admitted random-V cell. SID: S1
        lower tail corrected p < 10^-6 at every cell with lambda_nom >= 2^2.
        SENS: power(rho = 2) >= 0.9 per arm-pooled test and >= 0.5 per cell,
        or PASS is unavailable there.
      reason_no_coordinate_object: >-
        By Theorem C of KN-FIND-ffe1df (validated), a prime-order group has
        no exact sum-compatible coordinate projection. So no coordinate-defined
        subset with exact additive structure exists at toy scale, and the
        known-structure objects must be built by scalar multiplication.
      blocking: true

  # ---------------------------------------------------------------------------
  gates:
    principle: >-
      Written from the statement and the definitions above, with no code shared
      with the counters. Module B (an independent GF(2^n) and curve
      implementation) is used only by the gates. The gates have designed power
      against each defect class that JV-2 named, mapped as follows. Off-grid d
      maps to size and D mislabel (G6, G7). The domain predicate maps to the
      exclusion rules (G1, G3). The enumerator maps to the pair and cell
      enumerators (G2). Shared input maps to l, lambda and f_n (G8). The
      baseline column maps to the null and lambda_hat (G7, C-NULL). All gates
      are STOPPING.
    list:
      - id: G0-ARITH
        check: Modules A and B agree on 10^4 random additions per curve; [l]P = O; [#E]R = O
      - id: G1-BRUTE
        check: >-
          A literal O(|F|^4) enumeration of unordered pairs of distinct
          2-subsets with equal non-O sums, classified Z4/Z3 by the literal
          rule, using module B. It runs on 50 lists at each |F| in {16, 24,
          32, 48} in Z/101, Z/1009 and Z/10007 (the dense regime); on F_V at
          the calibration curves CAL-13 and CAL-19 with |F| <= 48 (where the
          full dlog table also drives the integer path); and on all planted
          lists with |F| <= 48. Fast counters must equal it exactly on N_2,
          Z4, Z3 and R_2.
      - id: G2-ENUM
        check: >-
          Every list satisfies sum r(g) = C(|F|, 2), r(O) = |F|/2 and
          r(g) = r(-g). A per-row partner tally of |F| - 1 is recorded by the
          caller, not by the enumerator. The emitted cell set equals the
          frozen cell table, read from an independent copy.
      - id: G3-EXCL
        check: >-
          Hand-built cases with expected values written before code:
          {+-a, +-b} gives N_2 = 0. One parallelogram gives N_2 = 6, Z4 = 1.
          {+-t, +-u, +-(2t+u)} gives N_2 = 2, Z3 = 1. {+-t, +-3t} gives
          N_2 = 0 and Z3 = 0. One full <+-pi>-orbit at n >= 31 gives
          N_2 = 0 (the expected value at the calibration curves is the
          brute-force value, because accidental intra-orbit relations of order
          n^4/l are possible there). One parallelogram whose four elements lie
          in distinct <+-pi>-orbits, closed under pi, gives N_2 = 6n,
          Z4 = n, R_2 = 1.
      - id: G4-PATH
        check: >-
          The integer path equals the point path exactly (N_2, Z4, Z3, R_2) on
          >= 5 null lists per cell, every planted list, and one AP and one GAP
          list per cell.
      - id: G5-DILATION
        check: "All AP dilates of a cell have identical N_2, equal to an independent integer count over {+-1..+-k}"
      - id: G6-MEMBERSHIP
        check: >-
          Every element of F_V satisfies x in V. The curve equation and
          [l]Q = O are checked by module B: on all elements at the calibration
          curves and at n = 31, and on a 1% sample elsewhere. F_V is
          negation-closed. |F_V| is recounted independently for 3 V per cell.
      - id: G7-NULL
        check: >-
          |F*| = |F_(V_i)| per stratum. Orbits are distinct. KS orbits have
          size exactly 2n. lambda^2 - mu lambda + 2 = 0 mod l and
          pi(P) = [lambda]P. Weak sanity: a chi-square test of the top-8-bit
          histogram of all r per cell has p > 10^-6.
      - id: G8-INPUT
        check: >-
          l and #E are recomputed by module B from the curve (Lucas and BSGS,
          from two independent random points). l is proved prime by trial
          division. f_n is re-tested for irreducibility. The ECC2K-130 l is
          compared with the vendored source string.
      - id: G9-IDENTITIES
        check: N_2 = 6 Z4 + 2 Z3 with Z4 a non-negative integer, on every list; on KS lists Z4 and Z3 are each divisible by n
      - id: G10-STATS
        check: >-
          The exact convolution equals brute-force enumeration on toy strata
          (N_V = 3, M = 2). 1000 synthetic placebo p-values are not rejected as
          U(0, 1) at 10^-3. Synthetic planted shifts reject. m_max = 345 is a
          frozen constant.
      - id: G11-SEEDS
        check: No label collision; no repeated V within or across cells; no repeated null orbit set; replication labels disjoint
      - id: G12-MUTATION
        check: >-
          Each mutant M1-M20 below makes at least one gate fail, and the
          unmutated code passes every gate. An uncaught mutant is a gate-power
          failure, and the run is INVALID.
    mutation_self_test:
      - {id: M1, class: exclusion logic, mutant: "include the g = O class (count C(r(O), 2))"}
      - {id: M2, class: exclusion logic, mutant: "count multiset pairs {a, a} (2-sums with a = b)"}
      - {id: M3, class: pair enumerator, mutant: "skip pairs (i, i+1), or drop the last list element"}
      - {id: M4, class: hash key, mutant: "key on x(g) only and apply C(r_x, 2), conflating g with -g"}
      - {id: M5, class: field arithmetic, mutant: "module A uses a different irreducible pentanomial than f_n"}
      - {id: M6, class: curve special case, mutant: "a + (-a) returns a non-O point"}
      - {id: M7, class: null size, mutant: "null lists of size |F_V| - 2"}
      - {id: M8, class: null closure, mutant: "null of 2k independent elements, not negation-closed"}
      - {id: M9, class: null distribution, mutant: "r drawn from [1, 2^20] instead of [1, l - 1]"}
      - {id: M10, class: KS closure, mutant: "KS null only +-closed (pi-orbits omitted)"}
      - {id: M11, class: shared input (order), mutant: "membership tested by [#E]Q = O instead of [l]Q = O"}
      - {id: M12, class: shared input (eigenvalue), mutant: "the other root of lambda^2 - mu lambda + 2"}
      - {id: M13, class: stratification, mutant: "V_i paired with stratum i+1's null lists"}
      - {id: M14, class: p-value, mutant: "p = G/B without the +1, or one-sided instead of two-sided"}
      - {id: M15, class: orbit count, mutant: "R_2 = round(N_2 / 6)"}
      - {id: M16, class: cell enumerator, mutant: "drop the largest D of each curve"}
      - {id: M17, class: multiplicity, mutant: "Bonferroni m from admitted cells instead of m_max"}
      - {id: M18, class: seed reuse, mutant: "the same null lists reused across strata"}
      - {id: M19, class: V sampling, mutant: "rank-deficient V accepted"}
      - {id: M20, class: window basis, mutant: "W_s built in a basis other than the polynomial basis of f_n"}

  # ---------------------------------------------------------------------------
  metrics:
    primary:
      - {name: N_2, unit: count, definition: "definitions.statistic.N_2, per list"}
      - {name: R_2, unit: count, definition: "definitions.statistic.R_2, per list (with Z4 and Z3)"}
      - {name: S1_p, unit: probability, definition: "two-sided exact stratified-permutation p of the cell total of N_2, per cell and per arm"}
      - {name: S2_p, unit: probability, definition: "stratified Monte Carlo permutation p of the two-sample KS distance on N_2"}
      - {name: S3_p, unit: probability, definition: "stratified permutation p of the Pearson X^2 of binned R_2 against Poisson(lambda_hat_R)"}
      - {name: S4_p, unit: probability, definition: "stratified permutation p of max over V_i of R_2"}
      - {name: rho_hat, unit: ratio, definition: "sum N_2(F_V) / (N_V x mean null N_2 at matched strata), per cell and per arm, with exact 99% CI"}
    secondary:
      - {name: F_size_ratio, unit: ratio, definition: "|F_V| / (2^D / h) per V (A5; an unstated count heuristic, not decided)"}
      - {name: null_VMR_N2, unit: ratio, definition: "variance/mean of null N_2 per cell (A1 check)"}
      - {name: S_TREND, unit: per bit of log2 l, definition: "OLS slope of log rho_hat on log2 l per arm, with 95% CI"}
      - {name: SENS_power, unit: probability, definition: "C-NEARBY SENS power at rho in {1.5, 2, 3}, per cell and per arm"}
      - {name: control_readings, unit: various, definition: "AP, GAP, SID, PLANT, placebo, N-POI, N-SCALE per cell"}
      - {name: cost, unit: "point additions, integer pair-sums, seconds", definition: "per run and per cell, with the measured S0 throughput"}
      - {name: termination_reason, unit: categorical, definition: "completed, checkpointed, timeout, crash or memory stop, per run"}

  statistical_plan:
    alpha: "10^-3 family-wise, Bonferroni"
    multiplicity: >-
      m_max = 4 tests x 85 cells + 5 arm-pooled S1 = 345, FROZEN before any
      run. It is not reduced when cells fail admission (conservative). Raw
      per-test threshold: p <= 10^-3 / 345 = 2.90e-6, two-sided where the
      test is two-sided.
    stratification: >-
      Stratum i = {V_i's list, its M null lists}. Under H0, V_i's value is
      exchangeable with its stratum's null values. Every p-value is computed
      under that exact stratified permutation law. No normal approximation
      decides anything.
    S1: >-
      T = sum_i N_2(F_(V_i)). The reference is the exact distribution of the
      sum of one uniform pick per stratum from its M + 1 values (convolution).
      p = min(1, 2 min(P(T' >= T), P(T' <= T))). The maximum standardised
      excess over cells against the Bonferroni tail is exactly this family's
      decision.
    S2: >-
      KS distance between the ECDFs of {N_2(F_(V_i))} and the pooled null.
      Stratified Monte Carlo permutation with Besag-Clifford sequential
      stopping (h = 20 exceedances), B_max = 10^6. p = h/b if stopped at b,
      else (1 + G)/(B_max + 1).
    S3: >-
      Bins {0, 1, ..., K-1, >= K} for R_2, K the largest value with expected
      count N_V P(R >= K) >= 5 under Poisson(lambda_hat_R). Pearson X^2 of the
      V-sample against N_V Poisson(lambda_hat_R) probabilities, where
      lambda_hat_R is recomputed in every permutation from that permutation's
      null positions. Permutation-calibrated as in S2. Upper tail.
    S4: max_i R_2(F_(V_i)), permutation-calibrated as in S2. Upper tail.
    pooled: S1 over all strata of all admitted cells of an arm (O4, O2, W, KR, KS).
    placebo: S1-S4 and the pooled tests rerun with the held-out null as "V", at the same threshold.
    n_poi: >-
      Within the null pool of a cell, D = sum over strata and j of (Y_ij -
      Ybar_i)^2 / Ybar_i on R_2. p by conditional-multinomial Monte Carlo
      (10^4 draws) given stratum totals. Two-sided. Threshold
      10^-3 / 85.
    replication_of_a_falsification: >-
      Pre-registered. Any cell that falsifies is rerun once with fresh labels
      (role rep1) at the same N_V and M, on the single test that fired,
      at alpha = 10^-3 (one test, no multiplicity). REPLICATED if it rejects
      in the same direction; UNREPLICATED otherwise.

  preregistered_prediction:
    quantity: >-
      Per cell, the stratified-permutation law of N_2(F_V) and of R_2(F_V)
      against the matched closure null.
    formula: >-
      H0(a), as worded: N_2(F_(V_i)) is exchangeable with N_2 of its matched
      null lists. H0(b), restated per A1: R_2(F_V) ~ Poisson(lambda_hat_R),
      where lambda_hat_R is the null-pool mean. PREDICTED READING: no
      S1-S4 or pooled test at raw p <= 2.90e-6, and rho_hat about 1. This is
      true of a null, and it is the reading the placebo arm must give.
    secondary_predictions:
      - "A1 check: the null variance/mean of N_2, pooled over ordinary cells with lambda_nom >= 2^2, lies in [4.5, 7.5] (about 6). A value near 1 refutes the A1 analysis, which would then be withdrawn by a new record."
      - "AP dilation invariance: identical N_2 over the 30 AP lists of a cell, equal to the integer count."
      - "S-TREND slope 0 (reported with its CI; not a decision)."
    source: >-
      HEUR-HARVEST-FV-1(a) (heuristic-restatement.md section 4; draft; internal).
      Its random-model justification is the Poisson approximation for sparse
      sums of weakly dependent indicators of probability 1/l (recalled, a
      pointer only). It is applied here to R_2, not to N_2, because of A1.
      No constant is taken from the scratch formula. Written before any run
      and never adjusted; a change is a new record through the amendment path,
      or a re-draft before approval.

  scale_relevance:
    tier: toy
    tier_note: >-
      The card labels the grid toy. Under the mechanical rule of
      docs/claims-and-verification.md, n = 31 is toy and n = 37..47 is medium
      (field bits 32 < n <= 96). All are far below the parameter labels
      n >= 97 where the heuristic is used. V3 at n = 131 is a disclosed-weak
      arm at a cryptographic label.
    justification: >-
      n in {31, 37, 41, 43, 47}, with l from about 2^28 to 2^46. Five n, three
      ordinary curves per n plus admissible Koblitz curves, and every lambda
      grid value at >= 2 n. TA-1, BY ASSUMPTION: the rate ratio
      rho(lambda) = E N_2(F_V) / E N_2(F*) at matched lambda is the same at
      n >= 97 as measured here. TA-2: random-V results say nothing about
      structured V at other n. V3 can falsify at n = 131 (any coincidence).
      Its zero cannot confirm the dense-regime rate.
    correspondence: null
    correspondence_note: >-
      Direct sampling. No shortcut comparable to the Deuring correspondence is
      known for dense-regime statistics at n >= 97 (heuristic-restatement.md
      section 5 V3).

  tail_checks:
    - S4 per cell, the largest single-V R_2 against its permutation tail (decision test)
    - The largest single-V N_2 over the whole run against the null pool maximum of the same cell (reported)
    - The largest placebo statistic per test family against its threshold (reported; any crossing is INCONCLUSIVE)
    - V3, any non-zero N_2 against the scratch lambda of about 2^-76

  replication:
    seeds: []
    seeds_note: >-
      No integer seed list. Every random draw is keyed by a SHA-256 counter
      DRBG on a unique label EXP-SEMBIN-3d9a71|<cell>|<role>|<i>|<j>, with
      roles {curve, V, null, placebo, plant, ap, gap, sid, sens, rep1, v3}.
      Labels are recorded per draw. G11 checks uniqueness.
    independent_instances: null
    independent_instances_note: >-
      Up to 25 curves (15 ordinary plus up to 10 Koblitz, depending on
      admissibility), with V and null lists per cell as in sample_sizes. The
      realised count is recorded at setup.
    sampled_parameters_recorded: >-
      Per curve: n, f_n, A, B (or a), #E, h, l with its trial-division
      transcript summary, P, lambda (Koblitz). Per V: D, a basis as a hex bit
      matrix, |F_V|, N_2, Z4, Z3, R_2, max r(g). Per null and control list:
      label, size, N_2, Z4, Z3, R_2. Every op-counter definition and the S0
      throughput.

  # ---------------------------------------------------------------------------
  procedure:
    - "S0-1. Read this frozen contract; write the code. Modules A (counters) and B (gates) share no code; the integer and point paths share no counting code."
    - "S0-2. Calibration curves CAL-13 and CAL-19 (full dlog tables), then G0, G1, G3, G9, G10 on toy inputs, then G12 (mutation self-test). Any failure stops: INVALID."
    - "S0-3. Curve selection per definitions (fields, ordinary roles, Koblitz admissibility, P, lambda); G8. Record the admitted cell set; m_max stays 345."
    - "S0-4. Measure throughput (point additions/s, integer sums/s) and project each run; split a run projected above its watchdog into blocks of cells (checkpoints, never evidence)."
    - "S1-1. Per cell: build F_V for every V (G6), the matched nulls and the placebo (G7), the controls (AP, GAP, SID, PLANT); count; G2, G4, G5, G9 on every list as specified."
    - "S1-2. Per cell: N-SCALE and N-POI; then S1-S4; placebo S1-S4; AP, GAP, SID readings; SENS pseudo-cells."
    - "S2-1. Arm-pooled S1 and placebo-pooled S1; S-TREND; the A1 VMR check."
    - "S2-2. Apply the outcome rules in order (INVALID, then INCONCLUSIVE, then FALSIFIED or PASS); if FALSIFIED, run the pre-registered replication of each falsifying cell."
    - "S2-3. Optional V3 arm (ECC2K-130, D = 16, 3 V): stop on the first coincidence and emit a certificate."
    - "S2-4. Write the outcome table: one row per arm and per cell, with rho_hat, CI, p-values, control readings and power."
  runs_plan:
    - {run: RUN-A, content: "S0-1 to S0-4: gates on toy inputs, mutation self-test, curve selection, throughput"}
    - {run: RUN-B, content: "n = 31 and 37 cells, all arms"}
    - {run: RUN-C, content: "n = 41 cells, all arms"}
    - {run: RUN-D, content: "n = 43 cells, all arms"}
    - {run: RUN-E, content: "n = 47 cells, all arms (split into blocks if S0-4 projects above the watchdog)"}
    - {run: RUN-F, content: "KS arm, all admitted cells"}
    - {run: RUN-G, content: "analysis: pooled tests, outcome rules, any pre-registered replication"}
    - {run: RUN-H, content: "optional V3 arm"}

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 6
    maximum_memory_gb: 4
    maximum_runs: 16
    maximum_workers: 1
    estimate: >-
      Scratch, unmeasured. F_V point path about 1.9e10 affine additions in
      total (O4 5.6e9; O2 4.2e9; W 2.1e9; KR <= 7.0e9; KS < 1e8). Integer-path
      nulls and controls about 2e11 pair-sums. At about 5e6 additions/s (a
      portable C kernel with Montgomery batch inversion, KR-RHO-cb1c58) and
      about 1e8 integer sums/s, that is about 2 CPU-hours: about 20 s for the
      median cell and about 500 s for the largest (n = 47, h = 2, D = 13 at
      2.5e9 additions). Pure Python is about 10^2 times slower and is not
      viable. If no compiled kernel or numpy is available, that is an
      infrastructure stop, or an amendment reducing N_V with rho_90
      recomputed and disclosed; never a silent cut. Memory: the largest list
      (|F| = 2^13) needs <= 2^25 keys x 16 bytes = 512 MB.
    note: >-
      maximum_runs 16 = 8 scientific runs plus up to 8 infrastructure reruns.
      A watchdog expiry checkpoints a run and is never evidence. The sample
      counts N_V and M are scientific and frozen; they are not budget knobs.

  stopping_rules:
    - "SR-1. Any gate (G0-G12) fails, or a mutant is uncaught: STOP the run; INVALID; nothing is read."
    - "SR-2. N-SCALE out of band at any cell: STOP; INVALID pending a defect explanation."
    - "SR-3. A cell whose curve fails admission is dropped and logged; m_max is unchanged."
    - "SR-4. V3: the first coincidence found stops the arm; a certificate is emitted and independently re-verified; route to the Coordinator."
    - "SR-5. Watchdog or memory stop: checkpoint; infrastructure, never evidence; resume from the last completed cell."
    - "SR-6. Any FALSIFIED reading: write no interpretation; run the pre-registered replication; route to the Coordinator."

  invalidation_rules:
    - A path mismatch (G4), or an identity failure (G9), on any list
    - A list size mismatch between F_V and its null (G7)
    - Use of the scratch formula anywhere in a decision
    - Any reuse of experiments/EXP-SEMBIN-04ec3c/code/v2/
    - Any change to N_V, M, m_max, the thresholds or the cell table after S0-1 without a versioned protocol_amendment

  outcomes:
    INVALID: "Any gate fails, a mutant is uncaught, N-SCALE is out of band, or a path mismatch occurs. Defect, not evidence."
    INCONCLUSIVE: >-
      Valid, but any of: a placebo test at raw p <= 2.90e-6; C-AP or GAP
      not flagged at corrected p < 10^-6 at some admitted random-V cell; SID
      not flagged at some cell with lambda_nom >= 2^2; N-POI failing at >= 2
      cells. A single N-POI failure makes only that cell inconclusive.
    FALSIFIED: >-
      Valid, controls OK, the cell's N-POI passed, and any F_V test (S1-S4 at
      any admitted cell, or an arm-pooled S1) at raw p <= 2.90e-6. The
      direction (excess, deficit, non-Poisson, tail), the arm and the cell
      are recorded. Labelled REPLICATED or UNREPLICATED by the pre-registered
      replication. The scope is the cell's (curve, D, V-distribution).
    PASS: >-
      Valid, controls OK, no F_V test rejects, and SENS power(rho = 2) >=
      0.9 per arm-pooled test and >= 0.5 at >= 80% of random-V cells.
      Reported with rho_hat and its 99% CI per cell and per arm.
    PASS_UNDERPOWERED: Valid, no rejection, sensitivity floor unmet. Reported as INCONCLUSIVE at the stated resolution.
    UNTESTED: KS arm empty means the pi-closure sub-clause is UNTESTED. A W or KS cell with E < 1 is recorded as UNTESTED for that cell.
    V3: >-
      Any N_2 >= 1: FALSIFIED at that cell (p of about 2^-76; no multiplicity
      needed), certified and routed. N_2 = 0: consistent; confirms no rate.
    infrastructure: A timeout, crash or memory stop is never evidence about any heuristic.

  success_criterion: >-
    PASS as defined in outcomes. It is decidable from S1-S4, the pooled S1,
    the control readings and SENS power. Its content is "no departure at
    resolution rho_90 in the tested cells". It never means the heuristic is
    proved, and the conditional on HEUR-HARVEST-FV-1 is never discharged by
    it.
  falsification_criterion: >-
    FALSIFIED as defined in outcomes: one F_V test at raw p <= 2.90e-6 (that
    is, Bonferroni-corrected p < 10^-3 over m_max = 345), with every gate,
    the placebo, the AP, GAP and SID controls, and the cell's null calibration
    passing. Or V3 with any coincidence.

  required_artifacts:
    - manifest per run (command, commit, dirty flag, environment, resolved inference block)
    - "per-list records: label, role, cell, size, N_2, Z4, Z3, R_2, max r(g)"
    - per-curve setup records (definitions.*), including the trial-division transcripts (summary and hash)
    - gate reports G0-G12, with the per-mutant catching gate
    - per-cell and per-arm test outputs (S1-S4, pooled, placebo, N-POI, N-SCALE, SENS, AP, GAP, SID)
    - the exact S1 reference distributions (hash-bound) and the Monte Carlo stopping records
    - outcome table and RESULTS text carrying the conditional and scope wording
    - certificate for any V3 coincidence (points and independent re-verification)
    - artifact-digests.json binding every file

  # ---------------------------------------------------------------------------
  dominated_by: "n/a (no result claimed)"
  dominated_by_check: >-
    A heuristic-validation experiment claims no algorithm. Checked against:
    KN-FIND-ffe1df (read in full; F_V is one fibre of an approximate F_2-linear
    filter, adjacent to Theorem C and the bucket-gain statistic); all 24
    KR-RHO claim lines (read by Grep in this session; none states an
    additive-energy result); KR-IC-73db3f, KR-IC-889857 and KR-IC-b0fcda
    (read in full); KN-FIND-007 (lines 1-80; first-moment conservation, so
    only N_2's second moment can move). The other KR-IC rows were checked by
    title only.
  sota_delta: >-
    0 on time, memory and data/queries, under every outcome. A falsification
    removes a premise of HEUR-HARVEST-FV-2 and opens a routed attack question.
    It moves no frontier row without a separate algorithm and record.
  claim_ceiling: >-
    Toy and medium-label measurements at the tested (curve, D,
    V-distribution) cells. PASS at most means "consistent with
    HEUR-HARVEST-FV-1(a) at resolution rho_90". FALSIFIED at most means "the
    clause fails at the cell's scope". Neither is a statement about any
    curve's security, and neither changes the conditional status of any
    claim resting on the heuristic.
  limitations:
    - "Clause (a) only. A pass says nothing about clause (b) or HEUR-HARVEST-FV-2, and nothing about coordinate-algebra oracles (OPEN-A, OPEN-B)."
    - "The pi-closure sub-clause may be UNTESTED (A11), and is gross-effect only even when tested."
    - "Per-cell deficits are unresolvable at lambda_nom <= 2^3; rare V-classes (density < 1/N_V) are invisible."
    - "Transfer to n >= 97 is BY ASSUMPTION (TA-1)."
    - "The design's derivations (A1 identity, Z3 closed form, no +-1 pi-identities) are single-session scratch, checked by gates before any reading, not refereed."

  procedure_deviations_at_design:
    - id: PD-1
      what: >-
        Dispatched on the user's instruction before the TASK-20261002-31c9d7
        receipt exists (DP-1; its records are reported committed on main, not
        verified here). No TASK-20261001-d815a6 receipt was found (DP-2), so
        the restatement's bytes are not hash-fixed. No lane claim was made by
        this session (DP-4). Disclosed, not waived.
    - id: PD-2
      what: No shell. allocate_id.py, git grep, validate_ledger.py and check_review_independence.py were not run. The identifier is hand-chosen.
    - id: PD-3
      what: The kb MCP was not in the tool surface; Grep and Glob were used instead.
    - id: PD-4
      what: >-
        The card asks for "seconds per cell". The sized design is seconds for
        the median cell and minutes (up to about 500 s, scratch) for the
        n = 47, lambda <= 1 cells. That is forced by the resolution target.
        The seconds-per-cell variant's resolution is stated in
