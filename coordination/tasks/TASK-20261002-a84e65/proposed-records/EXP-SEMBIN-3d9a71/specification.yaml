  assigned_to: null
  assigned_to_note: Assignment is a Coordinator act after approval. This draft assigns nothing.

  objective: >-
    Decide, at stated resolution and scope, whether the F_2-linear condition
    x(Q) in V gives F_V additive structure that a uniformly random list does
