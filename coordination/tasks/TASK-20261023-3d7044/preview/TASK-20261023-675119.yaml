    LINT OK or CARD OK.
  - Root may only adopt a clean candidate after exact canonical archive ownership
    and Coordinator approval are separately bound; do not publish a runbook or select
    mechanical tier from an incomplete candidate.
  deliverables: &id001
  - coordination/tasks/TASK-20261023-675119/compile_report.yaml
  - coordination/tasks/TASK-20261023-675119/runbook_lint.txt
  - coordination/tasks/TASK-20261023-675119/task_card_lint.txt
  artifact_paths: *id001
  archived_by: TASK-20261023-c5d261
  inference:
    policy: director-runbook
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
    runtime_native: true
    binding_note: Use the session's explicitly resolved runtime-native binding; no
      vendor substitution or API probe is implied.
  budget:
    memory_gb: 2
    wall_clock_seconds: 3600
    maximum_runs: 0
  completion_gate:
  - Actual runbook lint and task-card lint command outputs are retained, including
    failures; report exact non-executing compile status.
  - No runbook is committed unless clean lint can be established; implementation route
    remains available with recorded reason.
