handoff:
  id: TASK-20261023-675119
  role: executor
  from: coordinator
  to: executor
  objective: Compile-mode experiment-director attempt for the exact prospective IC
    workload; run only lint, never science.
  uncertainty_reduced: Whether an exact judgment-free runbook/task card can be compiled
    before approval, or which specification field prevents clean lint.
  inputs:
  - experiments/EXP-ICPERF-3065f9/specification.yaml
  - experiments/EXP-ICPERF-3065f9/trial-plan.json
  - coordination/tasks/TASK-20261023-3d7044/preview/specification.yaml
  - coordination/tasks/TASK-20261023-3d7044/preview/trial-plan.json
  - tools/ic_target_benchmark.py
  - config/ic-target-benchmark.json
  - templates/runbook.yaml
  - agents/experiment-director.md
  - docs/runbook-execution.md
  constraints:
  - Act as experiment-director in compile mode under director-runbook/high; no scientific
    trial, dispatch, API call or approval.
  - Do not change canonical specification, trial plan, sources or any scientific criterion.
  - Create temporary candidate runbook/card under the task directory, run actual lint
    commands and retain their verbatim outputs; remove unapproved candidates if clean
    lint cannot be obtained.
  - Always produce the three declared artifacts. compile_report.yaml names candidate
