  - src/crypto_autoresearcher/index_calculus/wide_tails.py
  - config/ic-target-benchmark.json
  constraints:
  - Fresh independent xhigh session, no sibling report reads.
  - Recompute metrics from raw data; no trial reruns under this zero-run review task.
  - Own J-integrity and J-inference only; test rejection of duplicate-A/A speedup,
    tampered scalar/digest and missing worker records.
  - State measured-vs-derived boundaries, RSS/payload distinction, censoring, confidence
    and tested scope.
  deliverables: &id001
  - coordination/tasks/TASK-20261023-18b489/review_report.yaml
  - coordination/tasks/TASK-20261023-18b489/derivation.md
  artifact_paths: *id001
  archived_by: TASK-20261023-174f6f
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    delivery: interactive
    runtime_native: true
    binding_note: Use the session's explicitly resolved runtime-native binding; no
      vendor substitution or API probe is implied.
  budget:
    memory_gb: 2
    wall_clock_seconds: 3600
    maximum_runs: 0
  completion_gate:
  - Review report declares review_attestation with sources_read and each owned joint
    verdict.
  - Independent code/affine-certificate and metric calculations reconcile or concrete
    breaking artifacts are retained.
  review_plan:
    claim_under_review: Any proposed complete-solve speedup and correctness of the
      fixed-window target generator, at the frozen toy workload only; no numerical
      result exists at plan creation.
    coordinator_prior: The group identity should preserve targets; setup may erase
      gains in small/short solves, so a positive full-cost result is uncertain before
      measurements.
    joints:
    - joint: 'J-algebra: fixed-window digits preserve aP+bQ and independently derived
        reference target group-operation formula.'
      assigned_to: TASK-20261023-5301b1
      attack_plan: Derive the digit expansion independently, including zero scalars
        and final partial window; construct a wrong shifted-digit implementation that
        must fail.
      breaking_artifact: A concrete scalar/point counterexample or a missing precondition.
    - joint: 'J-integrity: paired inputs, targets, relations, recovery certificates
        and complete costs remain comparable.'
      assigned_to: TASK-20261023-18b489
      attack_plan: Audit timer and all162 raw workers; independently regenerate seeded
        target stream and certify kP==Q; mutate k/digests/remove a row and require
        refusal.
      breaking_artifact: A tampered record accepted or a genuine row whose independent
        certificate/digest/cost boundary does not reconcile.
    - joint: 'J-inference: declared full-cost statistic and uncertainty support only
        the exact tested scope.'
      assigned_to: TASK-20261023-18b489
      attack_plan: Recompute all54 paired ratios and clustered stratified bootstrap
        from raw times; replace candidate with identical reference data and require
        the strict improvement gate to fail.
      breaking_artifact: A differing recomputed statistic, accepted known-false performance
        control, omitted censoring or expanded scope.
    blindness:
      mutual: true
      lifted_for: []
    proves_too_much:
      objects:
      - Identical reference timings substituted as candidate (known to have no strict
        speedup).
      - A known-wrong k+1 or shifted digit, corrupted target digest, and an incomplete
        grid.
      failure_signature: No qualified speedup for identical timings; invalid certificates/digests
        and incomplete grids are refused.
      assigned_to: TASK-20261023-18b489
    blind_rederivation:
      required: true
      quantity: Algebraic group element and exact reference E.add call count for nonnegative
        a,b, including zero scalars and the final point sum; derive from the frozen
        group algorithm statement independently.
      parameters: Same public p,a,b,N,P,Q and seeded a,b range as frozen specification;
        window4.
      blind_from:
      - src/crypto_autoresearcher/index_calculus/targets.py
      - tools/ic_target_benchmark.py
      - tools/ic_target_analysis.py
      - experiments/EXP-ICPERF-3065f9/runs/RUN-ICPERF-842b51/raw-result.json
      - experiments/EXP-ICPERF-3065f9/runs/RUN-ICPERF-842b51/arms.jsonl
      - experiments/EXP-ICPERF-3065f9/runs/RUN-ICPERF-842b51/validation.json
      - experiments/EXP-ICPERF-3065f9/reports/
      - coordination/tasks/TASK-20261023-18b489/
      assigned_to: TASK-20261023-5301b1
    procedure_deviations: []
