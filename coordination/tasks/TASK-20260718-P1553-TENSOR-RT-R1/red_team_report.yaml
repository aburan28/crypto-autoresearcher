  rank_reconstruction:
    pre_mask_campaign:
      condition: "Every coloured evaluation-row deck spans F_p^6."
      exact_ordered_tt_ranks: [6, 15, 20, 15, 6]
      cp_rank_bounds: "20 <= rank_CP(D) <= 720"
      verdict: "pass; exact CP rank is not claimed"
    pre_mask_fixed_target:
      condition: "Every projected colour deck spans F_p^6/<v(-R)>."
      exact_ordered_tt_ranks: [5, 10, 10, 5]
      cp_rank_bounds: "10 <= rank_CP(D_R) <= 120"
      verdict: "pass"
    post_mask:
      exact_formula: >-
        On every cut in the checked Cartesian stratum, rank Flat_S(M) is the
        number r_S of matched partial endpoints. Endpoint multiplicities
        enlarge all-ones blocks but do not enlarge their individual rank.
      cp_bounds: "max_S r_S <= rank_CP(M) <= Z"
      collision_receipt: "Z=sum_g a_g*b_-g can be much larger than r_S"
      verdict: "pass with predicate-stratum and injective-deck scope"
    fermat_power:
      identity: "D^[p-1]=J-M"
      bounds: "max(0,r_S-1) <= rank Flat_S(D^[p-1]) <= r_S+1"
      sharpened_core: >-
        Compressing endpoint blocks gives J-P for a partial matching P. Its
        rank is r+1 when both sides have unmatched groups, r when exactly one
        side does, r for a fully matched r>=2 core in the current r<p range,
        zero for one fully matched block, and one when r=0.
      verdict: "pass and sharpened"

  schur_hadamard_audit:
    flattening_bound: >-
      rank Flat_s(D^[q]) <= min(B^s,B^(6-s),
      binomial(q+binomial(6,s)-1,binomial(6,s)-1)).
    cp_bound: "rank_CP(D^[q]) <= binomial(q+719,719)"
    reconstruction: >-
      The symmetric-power upper bounds are public constructors. Standard
      repeated squaring multiplies TT/CP ranks before exact recompression;
      contracting first changes the polynomial by introducing cross-source
      terms.
    objection: >-
      Failure of standard recompression is not a lower bound. A nonstandard
      support-independent exact recompressor or source-free pivot rule stays
      open.

  ffe_audit:
    projector: "m_R=1-d_R^(p-1) is idempotent in the split B^5 source algebra"
    exact_trace: "Tr(m_(m_R))=Z_R mod p; with Z_R<B^4<p this is the integer count"
    exact_image: "im(m_(m_R)) is Map(relation tuples,F_p)"
    standard_cost: "B^5 represented dimension; balanced explicit route B^3"
    verdict: >-
      The identities pass. Projector-image construction and primitive
      idempotents are sufficient but not necessary for one source after an
      exact dynamically restricted decision interface is supplied.

  characteristic_norm_correction:
    producer_claim_revised: >-
      A specialized norm need not return zero multiplicity/count or construct
      source idempotents to return one source.
    minimal_interface: >-
      Exists(S,R,I_1,...,I_5) returns true exactly when the target-labelled
      restricted Cartesian product contains a valid relation.
    norm_realization: >-
      The exact zero bit of the dynamically restricted Norm(d_R) realizes
      Exists on the checked stratum.
    replay_queries: "sum_i ceil(log_2 |F_i|)=O(log B)"
    proof: >-
      Bisect one active colour. If the left child exists, retain it; otherwise
      the right child exists because the true parent is their disjoint union.
      Repeat to a singleton in all five colours and verify its signed elliptic
      sum.
    all_strata_boundary: >-
      A false determinant zero can divert replay to a dead singleton, so the
      decision must be exact on the admitted stratum or use a charged complete
      false-positive recovery protocol.
    standard_constructor: "fail; B^3 to B^5 traffic in named norm routes"
    typed_exception: >-
      A target-uniform dynamically restricted succinct norm-zero decision
      circuit within B^(9/4) setup and B^(5/4) query remains open.

  conditional_count_replay:
    exact_formula: "C_R(w_1,...,w_5)=[R] product_i sum_j w_i(j)[A_(i,j)]"
    safe_weights: "binary subdeck indicators"
    integer_safety: "every restricted count is at most B^4<p for injective checked decks"
    one_source_queries: "O(log B)"
    verdict: >-
      Pass as a conditional reduction. Exact count is stronger than the
      minimal exact existence bit; neither evaluator is constructed for
      arbitrary useful decks.

  sharpened_2_plus_2_plus_1_audit:
    typed_input: >-
      Two source-labelled pair-sum divisors D_12 and D_34, each with B^2
      labelled occurrences, one fifth source deck, one fresh target, and
      canonical dyadic restrictions in every colour.
    exact_coefficient: >-
      C_R=[R] D_12(I_1,I_2)*D_34(I_3,I_4)*D_5(I_5), with
      C_R=sum_(u+v+a=R) m_12(u)m_34(v)m_5(a).
    dyadic_pair_preprocessing:
      work_and_state: "O(B^2 log^2 B) source occurrences per colour pair"
      reason: >-
        Each leaf pair belongs to O(log^2 B) pairs of dyadic ancestor nodes,
        so every requested pair divisor can be selected without rebuilding a
        B^2 leaf table.
      verdict: "passes B^(9/4) setup"
    point_basis_query:
      one_fifth_point: "B^2 scan after hashing one pair list"
      all_fifth_points: "B^3 per target"
      full_pair_pair_precompute: "B^4 occurrences"
      verdict: "fails B^(5/4) query or B^(9/4) setup"
    characteristic_norm_normal_form:
      source_algebra: "A_(34,5)=Map(D_34 x I_5,F_p), dimension B^3"
      norm: "product_(v in D_34,a in I_5) h_12(R-v-a)"
      exact_content: >-
        The norm is zero iff a checked relation exists. Under compatible
        target-local parameters, the target-deformed product has zero order
        C_R, including pair-source multiplicity.
      standard_cost: "B^3 represented or streamed leaves; swapping pairs is identical"
      verdict: "exact formula, no passing standard evaluator"
    semantic_routing:
      P1513: >-
        Same two B^2 pair circuits plus one B selector. Standard selector
        norms cost B^3 and the full composed sum costs B^4; specialized
        product-circuit locators are explicitly open.
      P1551: >-
        Same balanced three-colour source object and endpoint-coefficient
        residual; noncharacter and specialized norm circuits are outside the
        frozen grammar.
      P1516: >-
        B^2 pair state fits setup, but a fixed bounded-degree pair quotient
        does not supply the target-local 2+2+1 collision router. Arbitrary
        indexed target-local routers are explicitly open.
      decision: >-
        Operation-level duplicate/control, not P1554. A typed Query2P1
        specialized characteristic-norm/endpoint-decision exception remains
        open because no cited receipt proves a circuit or data-structure
        lower bound.
    surviving_typed_exception:
      build: >-
        BuildPairIndex constructs source-labelled dyadic pair-divisor state
        within B^(9/4+o(1)) work and state.
      query: >-
        Query2P1 returns exact Exists, exact C_R, or exact zero multiplicity
        within B^(5/4+o(1)) work and workspace for a fresh target and dyadic
        restrictions, without a B^3 complementary side or B^4 composed sum.
      constructor_found: false

  favorable_exact_control:
    name: "full-span checked determinant decks"
    receipt: >-
      Exterior-power pairing proves the exact pre-mask TT ranks, while a
      computed fixed-target binary-subdeck count is exact because it is below
      p. These are exact algebraic controls, not a reporter construction.

  favorable_generic_control:
    model: "six independent random-like disjoint B-subsets of a group of size N=B^5"
    fixed_target: "expected Z_R=1 and post-mask ranks O(1), after support is known"
    campaign: "expected Z=Theta(B), matched cut ranks Theta(B), dense TT state Theta(B^3)"
    scope: "heuristic/model-bound; no density or independent-rank theorem for actual decks"

  collision_heavy_control:
    decks: "F_i={A_i+[j]P:0<=j<B}, with disjoint offsets and no short-index wrap"
    exact_reporter: >-
      Build an O(B) dictionary k -> sum_i A_i+[k]P. For a restricted target
      index k, C_R is [X^k] product_i sum_(j in I_i) X^j, computable in
      B^(1+o(1)) work and O(B) state. Dyadic bisection returns one exact
      source.
    tensor_interpretation: >-
      The public partial-index transition automaton is a support-independent
      sparse TT; dense cores are B^3 but sparse transitions and convolution
      are constructible without relation paths.
    fatal_cost: >-
      Fivefold endpoint support has size O(B), so a uniform known-log or blind
      target hits with probability O(B/N)=O(B^-4). One blind hit needs
      Omega(B^4)=N^(4/5) target trials in the favorable model. Known-log
      orientation and a rank-B factor-log path are also absent.
    verdict: "exact coefficient-complete special-deck control; no ECDLP gain"

  objections:
    - id: "OBJ-NORM-MINIMAL-INTERFACE"
      severity: "material_scope_correction"
      statement: >-
        Requiring zero multiplicity/count and source idempotents from a
        specialized norm is unnecessary for one-source replay; dynamic exact
        existence is sufficient.
    - id: "OBJ-SPARSE-TT-CONSTRUCTION"
      severity: "material_scope_correction"
      statement: >-
        Sparse TT is not universally post-support. A public partial-sum
        automaton can construct sparse cores on structured small-sumset decks.
    - id: "OBJ-PAIR-DIVISOR-QUERY"
      severity: "fatal_for_standard_2_plus_2_plus_1_routes"
      statement: >-
        Two B^2 pair divisors fit setup, but source labels and dyadic node
        tables do not answer the target query. Standard point and norm routes
        restore B^3 or B^4 traffic.
    - id: "OBJ-PREDICATE-STRATUM"
      severity: "required_scope"
      statement: >-
        Matched-endpoint ranks and source replay apply only where the
        determinant mask is exactly the relation indicator. False overlap
        zeros can misroute decision self-reduction.
    - id: "OBJ-COUNT-MULTIPLICITY"
      severity: "required_scope"
      statement: >-
        The B^4 no-wrap count requires injective actual-point sets in each
        colour. Label multiplicity introduces a missing-colour multiplicity
        factor, though an exact existence bit remains meaningful.
    - id: "OBJ-END-TO-END"
      severity: "fatal"
      statement: >-
        No arbitrary-useful-deck constructor, independent relation rank,
        verified factor logs, or identical scalar-blind descent is supplied.

  required_controls:
    - "Full-span exterior-power rank control and rank-deficient deck mutation"
    - "Random-like disjoint decks with fixed-target and campaign occupancy separated"
    - "Collision-heavy arithmetic-progression decks with exact convolution and charged density"
    - "Dyadic pair-node preprocessing with total source-occurrence accounting"
    - "Point-basis B^3 and pair-pair B^4 2+2+1 controls"
    - "P1513 standard selector norm and translated-product source-jet control"
    - "P1516 fixed pair quotient versus explicitly open target-local router"
    - "False determinant zeros, duplicate labels, infinity, tangent, vertical, and nonreduced strata"
    - "Known-log rank, factor-log verification, fresh Q+[t]P descent, ambiguity, output, and memory"

  counterexample_or_mutation: >-
    The arithmetic-progression deck family is an exact mutation against a
    blanket post-support sparse-TT interpretation: it constructs a compact
    transition TT and coefficient-complete reporter before locating support.
    Its O(B) endpoint support makes known-log and blind targets too sparse,
    so it does not contradict the end-to-end negative. The sharper generic
    mutation is Query2P1 over two source-labelled dyadic pair-divisor indexes;
    no standard realization avoids B^3/B^4 traffic, but no unrestricted lower
    bound closes a specialized dynamic norm-decision circuit.

  baseline_comparison: >-
    The desired rectangle is B^(9/4)=N^0.45 setup/state and
    B^(5/4)=N^0.25 per fresh target/restriction query, with B relation queries
    totaling B^(9/4). Standard 2+2+1 norm evaluation costs B^3=N^0.6 per
    target and full pair-pair preprocessing costs B^4=N^0.8. The structured
    progression reporter is faster per query but needs B^4=N^0.8 blind-target
    trials. None beats Pollard rho's N^(1/2+o(1)) complete path.

  operation_level_deduplication:
    P1513: "standard translated-product/common-norm and source-jet realization"
    P1551: "endpoint coefficient and explicit B^3/B^5 aggregation grammar"
    P1516: "B^2 pair-state setup with missing target-local collision router"
    IDEA_136: "post-support rank condenser; structured transition TT retained as special-deck control"
    IDEA_138: "search-to-decision only after the honest decision computation exists"
    IDEA_156: "conditional coefficient self-reduction at a stronger output interface"
    IDEA_199: "dyadic endpoint coefficient/source-deck replay"
    conclusion: >-
      The sharpened residual is not mechanism-new. Its typed specialized
      Query2P1 exception is an unconstructed arm of the existing router/norm
      frontier, not a new candidate.

  narrowest_supported_statement: >-
    On checked pairwise-disjoint injective decks, the producer's tensor-rank
    formulas and exact count-to-source reduction are correct. Exact source
    replay needs only a subset-stable exact relation-existence bit. Two
    source-labelled dyadic B^2 pair-divisor indexes can be precomputed within
    the setup cap, but every audited point, quotient, composed-sum, and
    characteristic-norm evaluator for their 2+2+1 query pays B^3 or B^4.
    P1513/P1551/P1516 occupy these standard operations while expressly leaving
    specialized target-local circuits/data structures open. No such generic
    useful-deck operation or complete ECDLP path is supplied.

