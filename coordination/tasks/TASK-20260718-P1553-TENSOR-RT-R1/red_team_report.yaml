    dynamic_exists_to_source_replay: "pass as conditional reduction"
    two_pair_divisor_preprocessing: "pass in O(B^2 log^2 B)"
    query2p1_standard_point_norm_routes: "fail at B^3 or B^4"
    query2p1_specialized_constructor: "unsupplied and explicitly open"
    arbitrary_useful_deck_reporter: "fail"
