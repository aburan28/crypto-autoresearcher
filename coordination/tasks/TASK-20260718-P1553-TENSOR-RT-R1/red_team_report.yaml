  terminal_scoped_verdict: >-
    REVISE. The pre-mask wedge ranks, post-mask matched-endpoint ranks,
    Fermat-power rank bounds, FFE projector identities, and conditional
    count-to-source replay reconstruct on the checked stratum. The producer
    overrequires zero multiplicity/count and source idempotents from a
    specialized norm: a target-labelled subset-stable exact existence bit is
    already sufficient for one-source replay. It also scopes sparse TT too
    narrowly: structured collision-heavy decks can have a public transition
    TT and exact convolution without prelocating support, although the exact
    control fails target density and the complete factor-log path. The
    sharpened two-pair-divisor 2+2+1 test fits pair preprocessing but standard
    target queries restore a B^3 pair-plus-singleton norm or B^4 pair-pair
    convolution. This deduplicates to P1513/P1551/P1516 while preserving a
    typed dynamically restricted specialized characteristic-norm decision
    exception. No passing arbitrary-useful-deck constructor,
    relation rank, factor logs, blind descent, P1554, Shoup-bound improvement,
    or breakthrough is supplied.

  claim_under_review: >-
    Low CP/TT rank, determinant Schur powers, finite-deck interpolation, FFE
    projectors/norms, and recursive conditional counts can be converted into
    a public coefficient-complete P1553 reporter with B^(9/4) setup,
    B^(5/4) fresh-target/restriction queries, exact signed sources, and a
    complete below-rho ECDLP path.

