  - name: strict_exact_allowlist
    verdict: holds
    evidence: load_plan, tools/experiment_execution.py:150; independent allow_type_00..13,
      path_00..09, reserved_0..7, artifact_type_0..3, exact_subset_no_wildcard
    detail: Type checks precede set conversion; allow_empty names must be unique canonical
      relative paths in artifacts. Generated supervisor names are refused. Omission
      and an explicit empty list retain the default.
  - name: required_outputs_and_checker
    verdict: holds
    evidence: execute_trial, tools/experiment_execution.py:398; independent fixed
      execution controls
    detail: Allowed empty and nonempty regular files validate only after a zero-exit
      producer and checker. Missing files, non-files, symlinks, unlisted empty artifacts
      and checker failure do not validate. The checker ran in each successful-producer
      fixture.
  - name: hash_reconciliation
    verdict: holds
    evidence: trial_state, tools/experiment_execution.py:190; independent tamper_bytes,
      tamper_delete, tamper_receipt_hash, tamper_plan_hash
    detail: Empty content receives the ordinary SHA-256 digest. Changing bytes, deleting
      the artifact, corrupting the stored hash or changing the plan bytes produces
      needs_reconciliation. Observation-only state checks preserve receipt bytes.
  - name: authorization_archive_and_process_regression
    verdict: holds
    evidence: independent source_authorization_cleanup_preserved; full before/after
      production source comparison
    detail: Only load_plan and execute_trial changed. The complete sources of authorize,
      committed, task_lock, terminate_group, run_process, run_plan, safe_path, trial_state
      and coverage are byte-identical to the baseline. The diff neither edits the
      live-claim/exact-plan/archive coverage gates nor their callers.
  - name: absolute_path_fixture_correction
    verdict: holds
    evidence: producer attempt1/2 source diff and attempt1 checker traceback; independent
      path_00
    detail: The original fixture attempted relative_to(root) on /tmp/outside before
      reaching load_plan. Replacing queue synthesis with direct plan serialization
      lets the intended rejection reach the parser. The production confinement function
      is unchanged.
  - name: symlink_expectation_correction
    verdict: holds
    evidence: producer attempt3/4 source diff and attempt3 traceback; independent
      leaf_dangling, leaf_contained, component_escape, plan_symlink and symlink
    detail: The adapter writes invalid_output then coverage rejects the existing symlink
      during load_plan. Expecting that ExecutionError preserves the stronger refusal
      and retains receipt assertions; it does not permit the symlink.
  - name: retained_custody_and_counts
    verdict: holds_with_explicit_missing_history
    evidence: independent producer_custody; producer check-receipt.json raw journals
      and embedded files
    detail: All 83 outer hashes and every present inner fixture-file hash verify.
      Counts recompute to 93 cases per attempt, passed 72/73/92/93, failed 21/20/1/0,
      totals 372/330/42. The unavailable first-attempt fixture transcripts remain
      unavailable.
  limitations:
  - 'Historical producer custody is incomplete: first-attempt temporary fixture transcripts
    were not retained. Later success cannot fill that gap; the missing platform-failure
    cause remains unknown for that attempt.'
  - Both genuine-limit producer attempts failed. Only the second has 24 direct ValueError
    current limit exceeds maximum limit observations. The simulated-limit third attempt
    failed one symlink expectation; the fourth passed.
  - The independent 64 controls used declared resource.setrlimit simulation and temporary
    offline authority placeholders. They establish bounded source conformance, not
    hard memory enforcement, live authorization integration or platform readiness.
  - RSS observations cover the checker alone. No aggregate descendant resource bound
    is supported.
  - Configured model gpt-6-astra and requested xhigh come from dispatch. Actual serving
    identity/probe verification is unknown; no verified resolved model is claimed.
  - The existing 41 test methods are preserved by AST comparison; the independent
    reviewer did not rerun the producer suite or its controllers. Its 93 controls
    per attempt were recomputed from preserved raw journals.
  - Embedded unrelated global ledger validation output was encountered while reading
    the producer receipt. Its AES claims were not independently reviewed or used for
