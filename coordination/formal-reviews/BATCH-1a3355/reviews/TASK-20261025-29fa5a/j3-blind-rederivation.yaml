method:
  field_arithmetic: >-
    Encode a0+a1*t+a2*t^2+a3*t^3 as sum a_i*2^i. Multiply binary polynomials
    and reduce by t^4=t+1. With target_x=a6=1, expand S3 to
    x1^2*x2^2+x1^2+x2^2+x1*x2+1. Boolean reduction gives constant 1,
    linear coefficient b_i^2 for each u_i and w_i, and coefficient
    (b_i*b_j)^2+b_i*b_j for u_i*w_j, where b=(9,3,2,12).
  row_enumeration: >-
    For each coordinate and each of the 256 squarefree multipliers, multiply
    Boolean monomials by taking the union of variable supports and cancel
    duplicate outputs over F_2. Retain a row if its resulting degree is at
    most D; assign the zero row degree minus infinity for counting. Gaussian
    elimination on coefficient bitsets gives the full rank. Elimination on
    the degree-D projection gives its rank; their difference is the
    intersection dimension.
  independent_check: >-
    Directly evaluated S3 for all 256 Boolean assignments, applied the
    Boolean Mobius transform to recover its four coefficient vectors, and
    regenerated the retained rows and ranks from those truth tables. Both
    constructions agreed for every coordinate and every D=0,1,2,3.
exact_outputs:
  coordinate_equations:
    f0: >-
      1 + u0 + u1 + u3 + w0 + u0*w0 + u3*w0 + w1 + u1*w1 + u2*w1
      + u3*w1 + u1*w2 + u2*w2 + w3 + u0*w3 + u1*w3 + u3*w3
    f1: >-
      u3 + u0*w0 + u1*w1 + u2*w2 + u3*w2 + w3 + u2*w3
    f2: >-
      u0 + u1 + u2 + u3 + w0 + u1*w0 + w1 + u0*w1 + u1*w1
      + w2 + u2*w2 + w3 + u3*w3
    f3: "u0 + u3 + w0 + w3"
  row_profile:
