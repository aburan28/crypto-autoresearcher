      low_degree_intersection_dimension: 12
      new_falls: 1
  first_fall_degree: 3
  witness:
    expression: "A0*f0 + A1*f1 + A2*f2 + A3*f3"
    multipliers:
      A0: "u1 + u2 + u3 + w1 + w2 + w3"
      A1: "u0 + u1 + u3 + w0 + w1 + w3"
      A2: "u0 + u1 + w0 + w1"
      A3: >-
        u0*u1 + u1*u3 + u2*w0 + u0*w1 + u1*w1 + u3*w1 + u0*w2
    reduced_polynomial: >-
      u0 + u1 + u2 + u3 + u0*u3 + u1*u3 + u2*u3 + w0
      + u1*w0 + u2*w0 + w1 + u3*w1 + w0*w1 + w2 + u0*w2
      + w3 + w0*w3 + w2*w3
    degree: 2
    membership: >-
      Each monomial multiple in A0*f0, A1*f1, A2*f2, and A3*f3 has
      Boolean-reduced degree at most 3, so the sum belongs to V_3.
  separator:
    linear_functional: >-
      coefficient of u0*u1 plus coefficient of u1*u3, over F_2
    value_on_witness: 1
    value_on_V2: 0
    justification: >-
      V_2 is spanned by f0,f1,f2,f3 and the eight variable multiples of
      f3. The first four have zero functional value. Among variable
      multiples, only u1*f3 contains either selected monomial, and it
      contains both, so its functional value is also zero. The witness
      contains u1*u3 but not u0*u1; hence it is outside V_2.
limitations:
