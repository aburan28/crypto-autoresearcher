  source_custody:
    original_raw_archive: >-
      research/verification/ffd_semaev_results.json at the pinned source commit
      is a 1738-byte eight-cell aggregate. Its n=4,n'=4 cell says six degree-two
      and four degree-three Semaev draws, but it contains no per-draw seeds,
      parameters, equations, rows, or matrices. Its SHA-256 matches the value
      recorded in the later archive-replay receipt, which reports a byte-exact
      rerun; I verified the committed bytes and receipt, not the historical
      execution itself. The original core, measurement script, and aggregate
      file are byte-identical between the replay's declared audited commit
      4db6ed753d3ff72749f6ce74220a69568558a8cf and the pinned input commit.
    later_reconstruction: >-
      The 571941-byte draws.json at the pinned input commit was produced by
      the 2026-10-22 replay and declares audited source commit
      4db6ed753d3ff72749f6ce74220a69568558a8cf. It supplies this per-draw
      seed, basis, equation masks, ranks, and corrected parity profile. It is
      source-bound by matching hashes for the original code and aggregate,
      but is not a historical raw per-draw archive or proof of the earlier
      execution's per-draw state.
  method:
    - >-
      Recreated the deterministic sample generator locally using Python's
      Random(32201), exhaustive curve-x eligibility in F_2[t]/(t^4+t+1), and
      rejection of dependent four-element bases. It selected x_R=1 and basis
      [9,3,2,12] on the sixth candidate basis, matching the later replay.
    - >-
      Independently evaluated S_3=(x1*x2+x1*x_R+x2*x_R)^2+x1*x2*x_R+1 on
      all 256 Boolean assignments, using carryless multiplication followed by
      reduction modulo binary polynomial 0b10011. Applied the Boolean Möbius
      transform separately to each of the four output bits to derive ANF
      coefficient masks. No producer equation builder was imported or run.
    - >-
      For each equation and squarefree multiplier through eight variables,
      formed products by XOR toggling destination masks, kept rows of degree
      at most D, and computed binary ranks of full and degree-D projected
      rows. Repeated with OR/set retention solely as a mutation control.
      This was local exact arithmetic, not a new scientific trial or EKS job.
  finite_sample:
    field_modulus_encoded: 19
    variables_by_bit: [u0, u1, u2, u3, w0, w1, w2, w3]
    n: 4
    nprime: 4
    draw: 1
    seed: 32201
    target_x_encoded: 1
    a6_encoded: 1
    basis_encoded: [9, 3, 2, 12]
    derived_component_monomial_masks:
