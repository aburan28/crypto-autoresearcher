      - [8, 17, 34, 68, 72, 128, 132]
      - [1, 2, 4, 8, 16, 18, 32, 33, 34, 64, 68, 128, 136]
      - [1, 8, 16, 128]
    encoding: >-
      Array order is the coefficient of 1,t,t^2,t^3; each integer is the
      squarefree variable mask, and zero is the constant monomial.
    compact_json_equations_sha256: 89ab8e668c510572bbf9307f105b2eaf46858ad900f0b6b4a2fce8803e0ba6eb
    replay_component_comparison: [true, true, true, true]
    first_mismatched_assignment_or_component: null
    corrected_parity_profile:
      degree_1: {compatible_rows: 17, rank: 1, lowdim: 0, new_falls: 0}
      degree_2: {compatible_rows: 28, rank: 11, lowdim: 1, new_falls: 0}
      degree_3: {compatible_rows: 80, rank: 53, lowdim: 12, new_falls: 1}
    mutated_set_union_profile:
      degree_1: {compatible_rows: 1, rank: 1, lowdim: 0, new_falls: 0}
      degree_2: {compatible_rows: 12, rank: 11, lowdim: 1, new_falls: 0}
      degree_3: {compatible_rows: 64, rank: 59, lowdim: 18, new_falls: 7}
    interpretation: >-
      V_0=0 and dim(V_1)=1. Under correct F_2 multiplication,
      dim(V_2 intersection R_<=1)=1, so new_falls(2)=1-1=0 despite x_R=1.
      At degree three, new_falls(3)=12-11=1 in this finite model. The trace
      residual [1,8,16,128] equals the fourth generator and is already in V_1.
  parity_mutation_control:
    equation_index: 0
    multiplier_monomial_mask: 1
    duplicate_destinations_with_two_input_origins:
      1: [0, 1]
      17: [16, 17]
      129: [128, 129]
    historical_set_union_product_masks: [1, 3, 9, 17, 25, 33, 35, 37, 41, 67, 69, 129, 131, 137]
    correct_F2_product_masks: [3, 9, 25, 33, 35, 37, 41, 67, 69, 131, 137]
    masks_only_in_set_union: [1, 17, 129]
    first_assignment_disagreeing_with_direct_product: 1
    disagreeing_assignments_out_of_256: 64
    F2_product_disagreements_out_of_256: 0
    explanation: >-
      At assignment mask 1, f_0 evaluates to zero because its constant and
      u0 terms cancel, so u0*f_0 is zero; the set-union product evaluates to
