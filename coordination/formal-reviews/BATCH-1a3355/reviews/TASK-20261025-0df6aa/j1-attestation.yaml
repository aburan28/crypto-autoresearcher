  limitations:
    - >-
      This checks the exact n=4,n'=4,draw=1 finite model and a deterministic
      reconstruction of its parameters. It does not authenticate that the
      historical run retained any per-draw matrix; its committed raw output
      has only aggregate cells.
    - >-
      The rank check is local exact arithmetic and source-bound replay
      comparison, not a Lean kernel or axiom audit; J2 owns that review joint.
    - >-
      No inference about other field sizes, a generic first-fall degree,
      solving degree, or ECDLP cost follows from this finite counterexample.
