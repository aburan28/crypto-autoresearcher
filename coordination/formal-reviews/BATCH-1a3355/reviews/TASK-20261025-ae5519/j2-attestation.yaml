  exact_statement_comparison:
    original_abstract_theorem:
      quantifiers: >-
        Universes u_1,u_2; any K with Field K; any L with AddCommGroup L;
        any additive hom T: K ->+ L; every x,t in K.
      premises: >-
        hT: forall z, T(z^2)=T(z); hL: forall y, y+y=0; hx: x != 0.
      conclusion: "T ((x⁻¹)^2 * (t^2 + t*x)) = 0"
      absent: >-
        No CharP K 2, finite-field order, n, n', V, basis, S_3 equation,
        Boolean polynomial, row space, nonzero residue, or first-fall predicate.
      vacuity: >-
        The zero additive map T satisfies hT and, with an exponent-two target
        such as the trivial additive group, hL. The theorem therefore permits
        an entirely zero functional. It cannot alone certify a nontrivial
        relation in any polynomial system.
    original_finite_instance_from_source:
      name: CryptoResearch.Semaev.absTrace_witness_annihilates_degree_two_coeffs
      declaration: |
        {K : Type*} [Field K] [Fintype K] [CharP K 2] {n : ℕ} {ι : Type*}
        (hcard : Fintype.card K = 2 ^ n) (v : ι → K) (x : K)
        (hx : x ≠ 0) (j k : ι) :
        absTrace n ((x⁻¹)^2 *
          (degreeTwoCoeff v j k ^ 2 + degreeTwoCoeff v j k * x)) = 0
      interpretation: >-
        This is a source declaration, not an observed #check output. n is
        implicit Nat with hcard rather than an explicit n >= 1; ι and v are
        arbitrary, with neither finite dimension n' nor basis/subspace
        premise. degreeTwoCoeff is definitionally v j * v k. absTrace is
        K-valued, not explicitly a map into F_2. The theorem proves the same
        cancellation for every t in K, so the arbitrary-family quantification
        adds no source-system specificity.
    concrete_finite_theorem_from_source:
      name: CryptoResearch.Semaev.ConcreteFirstFallWitness.concreteNewFall
      declaration: "witnessVec ∈ lowDegreePartThree ∧ witnessVec ∉ rowSpaceTwo"
      interpretation: >-
        This is the pinned source declaration, not an observed elaborated
        #check. It has no parameters or hypotheses. witnessVec is bitVec of a
        fixed Nat; the fixed comboMask occurs in its membership proof rather
        than in the theorem type. rowSpaceTwo is the span of the 28 literal
        degree-two rows, and lowDegreePartThree is the span of the 80 literal
        degree-three rows intersected with the degree-at-most-two kernel in
        Fin 256 -> ZMod 2. The theorem asserts a new degree-three class in
        that fixed Boolean row-space model only.
  mathematical_analysis:
    missing_first_fall_bridge: >-
      Let q be the trace-weighted combination of the actual descended
      equations. Cancelling every degree-two coefficient yields at most
      q in V_2 intersect R_{<=1}. A degree-two first fall additionally needs
      q outside V_1, or some other explicit vector in
      (V_2 intersect R_{<=1}) minus V_1. q != 0 by itself would not suffice:
      a nonzero degree-one generator already lies in V_1. Neither the checked
      theorem nor the finite coefficient lemma mentions q, V_1 or this
      nonmembership. One also needs a proved link from the full S_3 equations
      and their Boolean coordinate coefficients to the field expression.
    source_level_finite_control: >-
      In the named n=4, n'=4, x_R=1 sample, the pinned finite certificate
      declares ranks 1 and 1 at degree one, 11 and 10 at degree two, and
      53 and 41 at degree three. Its declared newFalls values are 0, 0, 1.
      BooleanParitySemanticRankCertificate states the actual degree-two
      matrix-rank equality 11 - 10 - 1 = 0, and
      BooleanParityFiltrationCertificate states an actual degree-three
      low-degree intersection dimension 12 versus degree-two row-space
      dimension 11. These are source-level observations here, not a blind
      recomputation or newly completed Lean check. They are inconsistent
      with the historical uniform degree-two first-fall assertion if the
      finite source equations are accepted.
    target_and_prose_mismatch: >-
      The frozen target TASK-20260916-43505c / claim
      FFD-SEMAEV-MEASUREMENT1-THM-WITNESS marks source_status PROVED and says
      the mechanism proves a degree-two fall EXISTS uniformly for every n,
      n' and V when x_R != 0. Section 3a of the original producer note says
      the same and calls the attribution derived. Its 2026-10-24 section 6
      explicitly withdraws that first-fall conclusion. The checked Lean
      type proves only the trace identity, which is consistent with the
      later correction and cannot support the frozen consequence.
  finite_source_and_equation_bridge:
    internal_lean_link: >-
      BooleanParityFiniteCertificate.equations is a literal list of four
      squarefree-monomial equations. rows D uses parityProductRow, which XORs
      duplicate output masks. The concrete theorem uses those rows through
      fullRows2/fullRows3. FiniteEquationSemantics uses the SAME equations
      definition and states that, for each of 256 assignments, the packed
      component-polynomial evaluation equals semaevS3. Its semaevS3 code
      computes e2^2 + x1*x2 + 1 with x_R=1 in the four-bit arithmetic modulo
      X^4+X+1, and fieldInput uses basis [9,3,2,12]. Thus the Lean sources
      contain a meaningful finite equation-to-S_3 evaluation bridge, not
      merely an unrelated hard-coded witnessNat. That bridge is a separate
      theorem and is not a premise or import of concreteNewFall.
    external_source_custody_limit: >-
      The archived equation SHA-256
      89ab8e668c510572bbf9307f105b2eaf46858ad900f0b6b4a2fce8803e0ba6eb
      and seed index 1 appear in source comments, not in the concrete theorem
      type or a proved Lean hash equality. The listed archived-source binding
      checker and report are outside this J2 handoff's read scope and were
      not inspected. Therefore this review does not independently attest
      equality of archived JSON bytes to the literal equations. The theorem
      also does not by itself prove that degree three is the FIRST fall;
      that uses the separate degree-one and degree-two no-fall statements.
  additive_correction_recommendation:
    frozen_target: formal/targets/semaev-s3-degree2-fall-witness.yaml
    target_task_id: TASK-20260916-43505c
    claim_id: FFD-SEMAEV-MEASUREMENT1-THM-WITNESS
    existing_theorem: CryptoResearch.Semaev.trace_witness_annihilates_degree_two_part
    action: >-
      Add a separate correction/supersession record identifying the frozen
      target's final uniform first-fall sentence and source_status PROVED as
      unsupported by that theorem. Preserve the historical target bytes.
      State positively that the theorem proves the conditional abstract
      annihilation identity; the finite absolute-trace instance proves
      coefficient cancellation for any family in a finite characteristic-two
      field with hcard and x != 0. Do not promote cancellation to a first fall.
    finite_narrow_target: formal/targets/semaev-s3-concrete-first-fall-20261023.yaml
    finite_narrow_theorem: CryptoResearch.Semaev.ConcreteFirstFallWitness.concreteNewFall
    finite_narrow_scope: >-
      The later target may say that one fixed n=4, n'=4, x_R=1 Boolean row-space
      model has a new degree-three vector, conditional on its separate source
      custody and finite-equation bridge. Any general first-fall theorem needs
      an actual lower-row-space nonmembership premise and proof; a universal
      degree-two claim is already contradicted by the named finite control.
  limitations:
    - >-
      The successful #check/#print axioms imported an existing pinned-cache
