review_plan:
  claim_under_review: >-
    Frozen target FFD-SEMAEV-MEASUREMENT1-THM-WITNESS says its trace witness
    uniformly supplies a degree-two fall for the Weil-descended S_3 system
    for every n, n', and factor-base subspace V when x_R is nonzero. The
    producer's 2026-09-16 addendum called this attribution derived and
    uniform. Its 2026-10-24 correction withdraws the first-fall conclusion
    while retaining the trace identity. This round tests the original
    target-to-result inference and the scope of the later finite certificate;
    it does not attempt a generic ECDLP cost claim.
  coordinator_prior:
    recorded_before_reviewers: true
    expectation: >-
      The trace-cancellation theorem is mathematically valid but omits
      nonmembership in the lower-degree row space. I expect a direct finite
      Boolean calculation at n=4, n'=4, x_R=1 to defeat the original uniform
      first-fall inference, while the later concrete degree-three witness
      should remain faithful only to that one finite model. I have read the
      existing correction and therefore cannot serve as the blind reviewer.
    uncertainty: >-
      Whether independent reviewers find a definition or source-binding
      mismatch in the finite bridge, and whether the exact elaborated Lean
      types support every part of the narrowed claim.
  joints:
    - joint: J1 archived sample to Boolean S_3 model
      assigned_to: TASK-20261025-0df6aa
      attack_plan: >-
        Read the frozen sample parameters and archived equations, derive all
        four component equations independently by evaluating S_3 on all 256
        Boolean assignments, then compare coefficients and the corrected
        parity multiplication with the source-bound replay. Mutate one
        monomial product with a duplicate output mask and check that set union
        and F_2 XOR disagree. Reject source custody beyond the actual bytes.
      breaking_artifact: >-
        A mismatched component coefficient, sample parameter, raw digest, or
        parity product, with the first exact assignment/mask that disagrees.
    - joint: J2 Lean statement and mathematical-to-claim boundary
      assigned_to: TASK-20261025-ae5519
      attack_plan: >-
        Extract the elaborated types and axiom sets of the original trace
        theorem and concrete finite witness at their pinned inputs. Compare
        every quantifier and assumption with the target and original producer
        prose. Attempt to derive first-fall nonmembership from the original
        theorem alone; identify the missing premise if it cannot follow.
        Check that the finite theorem is about the intended row-space model,
        not a hard-coded constant with no source/equation bridge.
      breaking_artifact: >-
        An exact Lean type, countermodel, vacuous premise, unsupported source
        bridge, or unapproved axiom that defeats the claimed correspondence.
    - joint: J3 blind finite first-fall calculation
      assigned_to: TASK-20261025-29fa5a
      attack_plan: >-
        Starting only from blind-input.yaml, derive the four Boolean
        coordinate equations from field evaluation, enumerate every
        degree-compatible product under F_2 parity, and independently compute
        row-space dimensions and the least D with a new low-degree class.
        Construct one explicit separating witness or prove the requested
        nonmembership is underivable from these definitions. Freeze the
        calculation before any comparison with producer artifacts.
      breaking_artifact: >-
        A reproducible finite rank table, explicit counterexample/witness, or
        a precise ambiguity in the mathematical statement that prevents a
        blind calculation.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - >-
        The nonzero-target n=4, n'=4, seed-index-1 Boolean sample with
        x_R=1 and basis [9,3,2,12], for which the corrected finite record
        reports no new degree-two fall.
      - >-
        The archived set-union monomial multiplier applied to the first
        component equation and u_0, where duplicate Boolean monomials should
        cancel under F_2 parity.
    failure_signature: >-
      A sound argument for a uniform nontrivial degree-two first fall must
      fail on the first object; a correct Boolean multiplier must reject the
      set-union result on the second. Passing either known-false control
      means the claimed bridge proves too much.
    assigned_to: TASK-20261025-29fa5a
  blind_rederivation:
    required: true
    quantity: >-
      For the field, curve polynomial and Boolean row-space definition in
      blind-input.yaml, compute the first D in {1,2,3} with
      dim(V_D intersection R_{<=D-1}) - dim(V_{D-1}) > 0 and supply the
      intermediate dimensions from first principles.
    parameters: coordination/formal-reviews/BATCH-1a3355/blind-input.yaml
    blind_from:
      - coordination/formal-reviews/BATCH-1a3355/review-plan.yaml
      - coordination/formal-reviews/BATCH-1a3355/input-bindings.json
      - research/FFD_SEMAEV_MEASUREMENT1.md
      - research/verification/ffd_semaev_core.py
      - research/verification/ffd_semaev_measure.py
      - research/verification/replay_ffd_semaev_20261022.py
      - docs/reports/2026-10-22-semaev-first-fall-replay/
      - docs/reports/2026-10-23-semaev-concrete-witness/
      - formal/CryptoResearch/Semaev/
      - formal/targets/semaev-s3-degree2-fall-witness.yaml
      - coordination/formal-reviews/BATCH-1a3355/reviews/
    assigned_to: TASK-20261025-29fa5a
  procedure_deviations: []
