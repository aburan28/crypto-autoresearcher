schema: crypto.autoresearch.blind_finite_problem.v1
source_claim_id: FFD-SEMAEV-MEASUREMENT1-THM-WITNESS
question: >-
  Compute the Boolean first-fall profile through degree three from the
  mathematical definitions below. Do not consult producer code, results,
  reports, proofs, or other reviewers before freezing the result.
parameters:
  field: F_2[t] / (t^4 + t + 1)
  element_encoding: bit i is the coefficient of t^i, i=0,1,2,3
  basis_encoded: [9, 3, 2, 12]
  target_x_encoded: 1
  a6_encoded: 1
  boolean_variables: [u0, u1, u2, u3, w0, w1, w2, w3]
definitions:
  x1: sum from i=0 to 3 of u_i times basis_encoded[i] in the field
  x2: sum from i=0 to 3 of w_i times basis_encoded[i] in the field
  S3: >-
    (x1*x2 + x1*target_x + x2*target_x)^2
    + x1*x2*target_x + a6 in the field
  component_equations: >-
    Express S3 in the polynomial basis 1,t,t^2,t^3. Each of its four
    coordinates is a Boolean polynomial f_k in the eight variables,
    with u_i^2=u_i and w_i^2=w_i and coefficients in F_2.
  row_space: >-
    Let R be the multilinear Boolean polynomial ring in the eight variables.
    For D=0,1,2,3, V_D is the F_2 span of all Boolean-reduced products m*f_k,
    for each of the four f_k and every squarefree monomial m in R, retaining
    a product exactly when its resulting total degree is at most D. Duplicate
    monomial outputs cancel modulo two. Let R_{<=d} be the polynomials of
    total degree at most d; V_0 is defined by the same rule.
  first_fall: >-
    For D=1,2,3 let new_falls(D) = dim(V_D intersection R_{<=D-1})
    - dim(V_{D-1}); the first-fall degree is the least D with
    new_falls(D)>0, or none in this range.
deliverables:
  - the four coordinate equations or an independently checkable coefficient digest
  - row counts and full ranks for D=1,2,3
  - low-degree intersection dimensions and new_falls(D) for D=1,2,3
  - an explicit witness and separator for any nonzero new fall, if found
  - complete sources_read and a blind-from compliance attestation
limits:
  - No scientific trial, Sage run, or EKS job is authorized by this card.
  - This finite calculation alone cannot establish a generic first-fall or ECDLP cost result.
