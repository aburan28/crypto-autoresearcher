        r={"q":q,"modulus_constant_first":g,"reduction_rule":"z^5 = -a*z^4 - 1, so multiply [r0,r1,r2,r3,r4] by z -> [-r4,r0,r1,r2,r3-a*r4] modulo q","full_successive_z_power_remainders":[{"n":n,"remainder":v} for n,v in enumerate(seq)],"frobenius_columns":cols,"frobenius_matrix_rows":f,"F_powers_1_through_5":fp[1:],"F5_equals_identity":fp[5]==eye(5),"trace_matrix_rows":t,"trace_rank":rank(t,q),"trace_nullity":5-rank(t,q),"trace_kernel_basis":kernel(t,q),"F_minus_I_rref":rref(tm,q)[0],"fixed_space_dimension":5-rank(tm,q),"fixed_space_basis":kernel(tm,q),"x5_minus_one_factorization":fac,"factor_kernels":ks,"nontrivial_kernels_combined_dimension_sum":len(joint),"combined_basis_rank":rank(allmat,q),"sum_equals_ker_T":all(dotmv(t,v,q)==[0]*5 for v in joint) and rank(allmat,q)==5-rank(t,q),"sum_is_direct":rank(allmat,q)==len(joint),"modulus_irreducibility":irreducibility(g,q),"modulus_gcd_with_derivative":pgcd(g,derivg,q)}
        if q==13:
