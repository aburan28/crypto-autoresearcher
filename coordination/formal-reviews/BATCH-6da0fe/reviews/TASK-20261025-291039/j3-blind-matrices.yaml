verdict_scope: "The three supplied quotient models satisfy the stated C5 matrix, trace, fixed-space, and nontrivial-factor-kernel identities; all three supplied moduli are independently certified irreducible. This verdict is solely on the mathematical parameter-card joint."
recorded_at: "2026-10-25T15:26:07.745212+00:00"
observations: ["All 75 Frobenius entries were derived by local polynomial reduction; no reported matrix was used. Every column was also checked using generic polynomial multiplication, division and binary exponentiation.", "For q=11,13,19, F^5 equals the 5-by-5 identity. The trace rank is 1, trace nullity is 4, and the F-fixed-space dimension is 1 with basis [1,0,0,0,0].", "The nontrivial factor-kernel dimensions are respectively [1,1,1,1], [4], and [2,2]. Every listed basis vector lies in ker(T); each concatenated basis has rank 4, proving directness and equality to ker(T).", "For each modulus, the independently calculated residue z^(q^5) is z, and gcd(g,z^q-z)=1. Hence each degree-five modulus is irreducible.", "The q=13 zero-based (1,1) mutation changes 2 to 3. The mutated fifth power differs from I with difference rank 4, and its trace matrix has rank 5.", "In characteristic 5, X^5-1=(X-1)^5 and is not squarefree. The cyclic-shift control satisfies F^5=I but has trace-kernel dimension 4 and an empty nontrivial distinct-factor kernel sum of dimension 0."]
calculation_conventions:
  coefficient_order: "constant first; all coefficients reduced to [0,q-1]"
  basis: ["1", "z", "z^2", "z^3", "z^4"]
  matrix_orientation: "column j represents F(z^j); matrices are printed as rows; vectors in kernel_basis lists are individual column vectors"
  column_derivation: "If g=1+a*z^4+z^5, then z^5=-1-a*z^4. Starting r_0=[1,0,0,0,0], compute r_(n+1)=[-r_n[4],r_n[0],r_n[1],r_n[2],r_n[3]-a*r_n[4]] modulo q. F column j is r_(jq). All r_n through n=4q are retained."
  linear_algebra: "Gauss-Jordan elimination over the prime field: choose the first nonzero pivot, normalize using modular inverse, eliminate from every other row. Set one free coordinate to one for each kernel basis vector."
  factorization: "Exhaust every monic degree-one and degree-two polynomial and divide X^5-1 exactly, retaining multiplicity. Multiply factors back. Linear factors are irreducible; quadratic factors are checked for roots; the remaining degree-four factor is checked for all roots and all q^2 monic quadratic divisors."
  irreducibility_test: "For a monic degree-five g, compute h_0=z and h_(k+1)=h_k^q mod g for k=0,...,4, independently of the matrix calculation. Check h_5=z and compute Euclidean gcd(g,h_1-z)=1. Since 5 is prime, all irreducible factors of z^(q^5)-z have degree 1 or 5; gcd excludes degree 1, so degree(g)=5 forces g irreducible. Euclidean chains include g, h_1-z, and every successive remainder; the final nonzero constant is normalized to gcd 1."
  directness_test: "Concatenate the displayed kernel bases as columns. The combined rank equals the sum of the individual dimensions (4), proving directness. Their inclusion in ker(T), together with nullity(T)=4, proves that their sum equals ker(T)."
factorizations_in_standard_notation:
  q11: "(X-1)(X-3)(X-4)(X-5)(X-9)"
  q13: "(X-1)(X^4+X^3+X^2+X+1)"
  q19: "(X-1)(X^2+5X+1)(X^2+15X+1)"
  q5_control: "(X-1)^5"
interpretation:
  quotient_ring_results_without_assuming_irreducibility: "For a monic degree-five modulus the quotient has the stated five-element basis regardless of irreducibility. In characteristic q, the q-power map is F_q-linear by the binomial identity. Thus the displayed power map matrices, F^5=I, trace matrices/ranks, fixed-space calculations, and factor-kernel direct sums are quotient-ring identities verified without assuming a field."
  field_result_requires_separate_certificate: "The polynomial computations separately establish that each supplied quotient is a field of order q^5. Only after that check may T be identified as its field trace. F^5=I alone is insufficient to establish irreducibility: a degree-five product of distinct linear factors also yields F^5=I."
  trace_and_fixed_space: "The explicit ranks are retained. Algebraically (F-I)T=F^5-I=0, and on the fixed space T=5I. Since q is not 5, multiplication by 5 is invertible, so im(T) is exactly the fixed space."
  scope_on_historical_run: "The card and these calculations do not establish which moduli an archived Sage executable selected, whether the archived process used particular supplied source bytes, C8, or any historical experiment success or performance. No historical executable or run was replayed."
  performance_scope: "No speedup, generic ECDLP attack-cost claim, end-to-end gain, or transfer to an experimental run is established."
