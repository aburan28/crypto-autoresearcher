  python3_source: |-
    import json
    from itertools import product
    
    def trim(v):
        while len(v)>1 and v[-1]==0: v.pop()
        return v
    
    def padd(a,b,q):
        v=[0]*max(len(a),len(b))
        for i in range(len(v)): v[i]=((a[i] if i<len(a) else 0)+(b[i] if i<len(b) else 0))%q
        return trim(v)
    
    def pneg(a,q): return [(-x)%q for x in a]
    def psub(a,b,q): return padd(a,pneg(b,q),q)
    
    def pmul(a,b,q):
        v=[0]*(len(a)+len(b)-1)
        for i,x in enumerate(a):
            for j,y in enumerate(b): v[i+j]=(v[i+j]+x*y)%q
        return trim(v)
    
    def pdiv(a,b,q):
        a=trim([v%q for v in a]); b=trim([v%q for v in b])
        assert b != [0]
        out=[0]*max(1,len(a)-len(b)+1)
        while a != [0] and len(a)>=len(b):
            d=len(a)-len(b); c=a[-1]*pow(b[-1],-1,q)%q
            out[d]=c
            for i in range(len(b)): a[d+i]=(a[d+i]-c*b[i])%q
            trim(a)
        return trim(out),a
    
    def preduce(a,g,q): return pdiv(a,g,q)[1]
    def ppow(a,n,g,q):
        r=[1]
        while n:
            if n&1: r=preduce(pmul(r,a,q),g,q)
            a=preduce(pmul(a,a,q),g,q); n//=2
        return r
    
    def pgcd(a,b,q):
        a=trim(a[:]); b=trim(b[:])
        while b != [0]: a,b=b,pdiv(a,b,q)[1]
        return [x*pow(a[-1],-1,q)%q for x in a]
    
    def fixed(v,n=5): return v+[0]*(n-len(v))
    def eye(n): return [[int(i==j) for j in range(n)] for i in range(n)]
    def zero(n): return [[0]*n for _ in range(n)]
    def madd(a,b,q): return [[(x+y)%q for x,y in zip(ar,br)] for ar,br in zip(a,b)]
    def mneg(a,q): return [[-x%q for x in row] for row in a]
    def msub(a,b,q): return madd(a,mneg(b,q),q)
    def mmul(a,b,q):
        return [[sum(a[i][k]*b[k][j] for k in range(len(b)))%q for j in range(len(b[0]))] for i in range(len(a))]
    def mpow(a,n,q):
        r=eye(len(a))
        while n:
            if n&1: r=mmul(r,a,q)
            a=mmul(a,a,q); n//=2
        return r
    def peval_matrix(p,a,q):
        r=zero(len(a))
        for c in reversed(p):
            r=mmul(r,a,q)
            r=madd(r,[[c*x%q for x in row] for row in eye(len(a))],q)
        return r
    
    def rref(a,q):
        a=[r[:] for r in a]; piv=[]; k=0
        for j in range(len(a[0])):
            pivot=next((i for i in range(k,len(a)) if a[i][j]%q),None)
            if pivot is None: continue
            a[k],a[pivot]=a[pivot],a[k]
            inv=pow(a[k][j],-1,q); a[k]=[x*inv%q for x in a[k]]
            for i in range(len(a)):
                if i!=k:
                    c=a[i][j]; a[i]=[(x-c*y)%q for x,y in zip(a[i],a[k])]
            piv.append(j); k+=1
            if k==len(a): break
        return a,piv
    def rank(a,q): return len(rref(a,q)[1])
    def kernel(a,q):
        rr,piv=rref(a,q); out=[]
        for j in range(len(a[0])):
            if j in piv: continue
            v=[0]*len(a[0]); v[j]=1
            for i,p in enumerate(piv): v[p]=-rr[i][j]%q
            out.append(v)
        return out
    def columns_matrix(vs):
        return [list(x) for x in zip(*vs)]
    def dotmv(a,v,q):
        return [sum(x*y for x,y in zip(row,v))%q for row in a]
    def irreducibility(g,q):
