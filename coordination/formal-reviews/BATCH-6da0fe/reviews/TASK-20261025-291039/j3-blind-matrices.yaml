  language_and_runtime: "Python 3.9.25"
  dependencies: "Python standard library only; the arithmetic implementation uses integer operations and itertools.product, with json for output."
  execution_method: "Execute the complete python3_source scalar with python3. It prints JSON equal to calculation_results. The source is self-contained, uses only the card parameters, and does not read any repository files, network resources, prior results, or external algebra systems."
  exact_command_form: |-
