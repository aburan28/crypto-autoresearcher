nonvacuity_and_load_bearing_distinctions:
- The canonical finite-field premises are instantiated by GaloisField 11 5, GaloisField 13 5 and GaloisField 19
  5, with dimension five proved using GaloisField.finrank. The three scalar characteristic exclusions are decidable
  concrete facts.
- Each monic quotient has an explicit five-element power basis. The transported trace rank one and kernel dimension
  four therefore concern a genuine five-dimensional vector space, not a zero quotient or an assumed rank.
- The q11 and q19 factor-kernel decomposition lemmas hold for any base-linear endomorphism by polynomial coprimality.
  The q13 equality is a direct equality of the same five-term polynomial. These identities alone cannot establish
  that a matrix is the intended Frobenius. Exact matrix binding, fifth power, and rank/dimension checks carry that
  additional burden.
- Irreducibility of the cyclotomic factors h13,p19,q19 and q11 linear factors must not be confused with irreducibility
  of modulus11, modulus13, modulus19. No reviewed Lean declaration proves the latter.
bridge_boundaries:
- bridge: quotient basis to full q-power map
  status: proved_scoped
  evidence: QuotientMatrices plus QuotientFrobeniusMap identify all basis entries and the full linear map. No field
    hypothesis on the quotient is needed.
- bridge: exact matrix to quotient C5 controls
  status: proved_scoped
  evidence: QuotientKernelTransport uses the basis/toMatrix algebra equivalence, matrix rank one and fifth-power
    certificates, and the factor identities. Fixed-line dimension and disjointness are proved.
- bridge: named moduli to fields and canonical GaloisField models
  status: not_proved_in_Lean
  missing: No Irreducible modulusq theorem, quotient Field instance, or ZMod q algebra equivalence from AdjoinRoot
    modulusq to GaloisField q 5 is constructed in the reviewed modules. The executable replay reports irreducibility,
    which is a separate trust path.
- bridge: five-term quotient trace to field trace on the archived encoding
  status: not_identified_in_Lean
  missing: The quotient theorem concludes kernels of trace5, not Algebra.trace on an established quotient field.
    The canonical field trace theorem is proved separately. Formal field identification and transport would close
    this precise connection.
- bridge: historical Sage bytes, inputs and computation to Lean quotient objects
  status: not_established_by_J2
  missing: No theorem models the historical parser, coordinate implementation, matrix/kernel routines, process source
    bytes or execution record. J1 owns the static implementation/custody audit. Hashes in reports and abstract quotient
    theorems cannot supply a missing original execution-source receipt.
- bridge: C8, complete experiment success, ECDLP cost or performance
  status: outside_scope
  missing: These are not conclusions of any reviewed C5 theorem.
