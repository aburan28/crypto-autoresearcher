arithmetic_control_program: |
  from math import comb
  p=13
  M=[[1,5,7,7,6],[0,2,4,11,1],[0,11,10,5,0],[0,9,4,4,6],[0,0,0,8,9]]
  def eye(): return [[int(i==j) for j in range(5)] for i in range(5)]
  def mul(A,B): return [[sum(A[i][k]*B[k][j] for k in range(5))%p for j in range(5)] for i in range(5)]
  def add(A,B): return [[(A[i][j]+B[i][j])%p for j in range(5)] for i in range(5)]
  def rank(A):
      A=[r[:] for r in A];r=0
      for j in range(5):
          v=next((i for i in range(r,5) if A[i][j]),None)
          if v is None: continue
          A[r],A[v]=A[v],A[r];c=pow(A[r][j],-1,p);A[r]=[x*c%p for x in A[r]]
          for i in range(5):
              if i!=r:
                  c=A[i][j];A[i]=[(x-c*y)%p for x,y in zip(A[i],A[r])]
          r+=1
      return r
  def check(A):
      I=eye();P=I;T=[[0]*5 for _ in range(5)]
      for k in range(5): T=add(T,P);P=mul(P,A)
      D=[[(A[i][j]-I[i][j])%p for j in range(5)] for i in range(5)]
      return {'fifth_power_identity':P==I,'fifth_power':P,'trace_matrix':T,'trace_rank':rank(T),'trace_nullity':5-rank(T),'fixed_nullity':5-rank(D)}
  changed=[r[:] for r in M];changed[1][1]=(changed[1][1]+1)%p
  f5=[(-1 if (5-k)%2 else 1)*comb(5,k)%5 for k in range(6)]
  f4=[(-1 if (4-k)%2 else 1)*comb(4,k)%5 for k in range(5)]
  print(f5,f4,check(M),check(changed))
