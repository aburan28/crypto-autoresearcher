    what_is_verified: The 17 scientific files frozen for J1 match their SHA-256/byte bindings at source_commit,
      and the final manifest/code/hash-list fields checked agree with those archived bytes.
    not_inferred: No fabrication, alternative executed source, or mathematical failure is established
      by the missing receipt.
    exit_criterion: Recover an independently checkable contemporaneous record binding invocation, process,
      exact source/support-module bytes, executable/dependencies and output. A new replay can validate
      a newly identified execution but cannot retroactively authenticate the old process.
  - label: coordinates_and_kernels
    status: holds
    claim: Conditioned on these being the loaded Sage source and normal documented Sage arithmetic semantics,
      the archived code uses the stated polynomial power basis, column-action Frobenius matrix and right
      kernels without an observed transpose mismatch.
    evidence:
    - path: experiments/EXP-FROB-91ee9c/specification.yaml
      lines: 37-43,153-167
      observation: The contract fixes constant-first coefficients, quotient field representation and polynomial-basis
        Frobenius kernels.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/work/core.py
      lines: 13-40,54-73
      observation: Lexicographic coefficient tuples generate monic g; is_irreducible gates GF(q**n, modulus=g).
        elt.polynomial().list() supplies padded constant-first coordinates. Column c of M is coordinates
        of (z**c)**q. Polynomial evaluation adds coefficients times successive matrix powers.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/implementation.py
      lines: 94-127
      observation: The matrix feeds an exact factorization of x**n-1 over GF(q); atomic factors exclude
        x-1 and are sorted by coefficient list.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/work/lattice.py
      lines: 21-61,69-91
      observation: f(M).right_kernel() is used for column vectors. Kernel basis vectors are transposed
        into columns of C; invertibility is asserted before C inverse maps power-basis column coordinates
        to block coordinates.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/implementation.py
      lines: 130-162
      observation: The sum of atomic kernel spaces, sum of individual dimensions, equality with ker T
        and fixed-kernel inclusion are actually computed. These checks are not merely factor-degree predictions.
    boundary: This establishes source semantics, not a formal refinement theorem, a fresh Sage result,
      individual kernel basis correctness from serialized witnesses, or historical source identity.
  - label: direct_trace_control
    status: breaks
    claim: The archived T_equals_hM flag does not implement the specified independent direct repeated-q-power
      trace-matrix control.
    evidence:
    - path: experiments/EXP-FROB-91ee9c/specification.yaml
      lines: 359-368
      observation: C5 calls for T computed directly by repeated q-th powering, independently of h(pi),
        followed by matrix equality.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/implementation.py
      lines: 119-142
      observation: T is built as I+M+...+M**(n-1) by successive matrix multiplication. hM is built by
        the same successive-matrix-power loop with all-one coefficients. Neither side independently applies
        repeated field q-th powering to basis elements after M is constructed.
    reason: For any same-sized M these two source expressions give the same geometric matrix sum. Agreement
      cannot by itself detect a wrong Frobenius M or a mismatch between matrix powers and directly powered
      field elements.
    surviving_evidence: M itself is built using field q-th powers of basis elements. The other C5 space
      equality/dimension/directness computations remain separate operations on that M; their content is
      not erased by this weaker equality control.
    exit_criterion: Use a separately implemented direct trace map on basis field elements and compare
      every column with h(M), under a new identified verification record.
  - label: independent_checker_boundary
    status: partial
    claim: The archived stdlib checker supplies a separate field-arithmetic/trace-nullity path, but it
      does not independently verify the full C5 factor-kernel statement.
    evidence:
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/checker.py
      lines: 16-104,170-212,309-377
      observation: No producer or Sage imports appear. A distinct polynomial-reduction/multiplication/exponentiation
        implementation reconstructs the first monic irreducible by trial division and builds a fresh q-power
        matrix. Its sole C5 comparison is dim ker T against the driver value.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/checker.py
      lines: 311-315
      observation: The expected g coefficient list and recorded g string are stored side by side; contrary
        to the nearby parse comment, no parse/equality test of that string is performed.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/work/checker-report.json
      lines: field_and_c5_checks
      observation: All three rows record independently reconstructed coefficients [1,0,0,0,a,1] with a=2,8,3
        and nullity 4 matching the driver. Those coefficients do match the in-scope native modulus strings
        on manual inspection.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/checker.py
      lines: 309-377
      observation: No independent x**5-1 factorization, factor-kernel bases/dimensions, kernel-sum equality/directness,
        fixed-space equality or 75-entry comparison to a serialized driver matrix is checked.
    boundary: The current review inspected this code and preserved its reported results; it did not execute
      the checker or certify its historical execution. The checker source is independent in the narrow
      sense of not importing the producer path, not evidence of full C5 coverage.
  - label: flags_and_gates
    status: partial
    claim: The archived booleans consistently record C5 success on the three cells, but successful worker
      termination is not a fail-closed C5 gate.
    evidence:
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/implementation.py
      lines: 102-116,130-162,398-425,622-631
      observation: squarefree, factor exponents and C5 tests are stored as booleans; main does not assert
        or branch on their failures before object search/partition work, and worker_status becomes ok
        when main returns. There is an actual separate C.is_invertible assertion in lattice.py.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/aggregate.py
      lines: 19-22,60-70,168-172
      observation: The aggregator copies data[C5] into C5_measured and embeds the checker report; these
        paths add no independent scientific validation.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/work/FROB-SPLIT-q11n5.out.json
      lines: JSON line 2
      observation: C5 values match the common flag record included in archive_observations.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/work/FROB-NOLATTICE-q13n5.out.json
      lines: JSON line 2
      observation: C5 values match the common flag record included in archive_observations.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/work/FROB-EQDEG-q19n5.out.json
      lines: JSON line 2
      observation: C5 values match the common flag record included in archive_observations.
    boundary: No false C5 flag was observed in these frozen outputs. The absence of a fail-closed branch
      is an instrument limitation, not a reported failed mathematical control.
  - label: original_process_identity
    status: inconclusive
    claim: The original process, executable/dependency bytes and executor model identity remain unverified
      by this frozen packet.
    evidence:
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/environment.json
      lines: entire JSON
      observation: Sage 10.9, Python 3.11.15 and /opt/conda-sage/bin/sage are recorded, without executable/library
        digests or authenticated process identity. CPU and container identity are explicitly unknown.
        The recorded model_verified=true is justified by session self-identity matching adapter resolve
        output; it supplies no doctor --probe evidence in this file.
    - path: experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/stdout.log
      lines: header sections, native JSON and checker/aggregate sections
      observation: The archive preserves labeled output content, including exact native JSON sections.
        These contents do not authenticate which original process emitted them.
    boundary: I do not claim that the historical Sage process, loaded imports, dependency build, operator
      session, or claimed model endpoint has been authenticated. A matching Git blob, hash list or quotient
      theorem cannot supply that identity.
  custody_chain:
  - link: pinned source_commit to J1 input bytes
    status: holds
    basis: All 17 scientific file hashes and byte lengths match input-bindings.json; same blobs also match
      review HEAD.
  - link: final archived source/selected outputs to final manifest/hash-list metadata
    status: holds_scoped
    basis: The listed in-scope artifact hashes, three code hashes and two support-module hashes agree.
  - link: native outputs to metrics and combined stdout
    status: holds_scoped
    basis: C5/factorization fields agree structurally; native output sections agree exactly after outer
      whitespace stripping; checker JSON agrees across report/metrics/log.
  - link: original invocation/process to loaded source and runtime bytes
    status: unverified
    basis: Only retrospective end-of-task hashes/self-reports and relative source invocation are present
      in the read set.
  - link: archived Sage source to quotient-basis model semantics
    status: holds_conditionally
    basis: Explicit modulus and constant-first power basis, column Frobenius action and right-kernel operations
      are coherent by source inspection.
  - link: independent direct trace control and complete independent C5 certificate
    status: incomplete
    basis: T=hM reuses matrix powers; independent checker compares trace nullity only.
  proves_too_much_control:
    assigned_to_this_joint: false
    historical_conclusion_from_same_abstract_certificate: declined
    reason: Even a valid quotient certificate can coexist with the missing original process/source receipt.
      It does not repair custody. The q=5 and mutated q=13 arithmetic controls belong to J3 and were not
      read or executed here.
  next_obligations:
  - Coordinator should preserve the source/runtime custody gap and the distinction between a coherent
    source model and an authenticated historical execution.
  - If stronger C5 implementation coverage is required, commission a newly identified direct field-power
    trace/control and factor-kernel comparison with explicit matrix/kernel witnesses and fail-closed checks.
  - Recover any original contemporaneous custody receipt separately; new verification remains a new execution.
  - Use the independent J2/J3 reports for Lean boundaries and blind arithmetic before composing any claim-level
    conclusion.
  citation_provenance:
    kind: internal
    verified_by: frob-c5-j1
    note: Every scientific assertion above is grounded in read blobs at the pinned source commit. Reported
      archived computation results are explicitly attributed to their records, not represented as newly
