review_plan:
  claim_under_review: >-
    The frozen EXP-FROB-91ee9c core cells at q=11,13,19 report C5 factor-kernel
    and trace controls. Lean targets certify exact quotient-basis q-power
    matrices and their C5 algebraic consequences. This round tests whether the
    archived code and source custody support that mathematical interpretation,
    whether the exact Lean theorem types prove the stated controls without a
    hidden field or source assumption, and whether blind arithmetic agrees.
    It cannot by itself certify the historical process identity, C8, the full
    experiment success gate, ECDLP cost, or any performance advantage.
  coordinator_prior:
    recorded_before_reviewers: true
    expectation: >-
      The quotient-ring matrices and C5 rank/factor identities will likely
      survive independent arithmetic. I expect a gap between the archived Sage
      process and the Lean quotient model, especially original execution-source
      custody and a formal proof that the selected moduli define fields. The
      q=5 repeated-factor control should prevent overgeneralization. I read
      producer evidence and cannot serve as the blind reviewer.
    uncertainty: >-
      Whether the frozen command, manifest, logs and saved source actually
      identify the bytes run; whether the code's coordinate and kernel paths
      match the proved model; whether exact Lean types and axioms warrant the
      report wording; and whether blind computation finds an entry or rank
      mismatch. No C5 historical promotion is assumed.
  joints:
    - joint: J1 historical source custody and Sage implementation bridge
      assigned_to: TASK-20261025-cc3c17
      attack_plan: >-
        Check the frozen specification, manifest, command, environment, driver,
        core, checker, aggregate, native outputs, logs and hash list at the
        pinned source commit. Identify the earliest custody link from command
        to executed bytes that cannot be verified. Trace field construction,
        quotient/power-basis coordinates, Frobenius, polynomial evaluation,
        kernel, trace and directness checks in source. Compare archived flags
        with those exact paths; distinguish one-expression self-consistency
        from an independent control. Do not execute a scientific trial.
      breaking_artifact: >-
        A byte/hash mismatch, a missing original process-to-source receipt, a
        code/model coordinate mismatch, or a reported C5 flag unsupported by
        the actual implementation path.
    - joint: J2 Lean theorem boundary and quotient-to-field bridge
      assigned_to: TASK-20261025-7c7297
      attack_plan: >-
        Inspect all pinned FrobTrace modules, formal target files, proof
        receipts, reports and toolchain. Obtain elaborated theorem types and
        axiom sets where local resources permit; otherwise state the exact
        blocker and rely only on verified receipts/source. Compare each
        premise and conclusion with C5 report language and the frozen modulus
        claim. Look for missing irreducibility/field identification and
        historical-source refinement. Test q=5 repeated-factor and one
        mutated q=13 matrix entry as negative controls where feasible.
      breaking_artifact: >-
        An extra premise, unsafe axiom, vacuous proposition, failed false-case
        control, or absent representation or source bridge behind a stronger
        claimed interpretation.
    - joint: J3 blind C5 polynomial and matrix derivation
      assigned_to: TASK-20261025-291039
      attack_plan: >-
        Read only blind-input.yaml and AGENTS.md until the result is frozen.
        Independently reduce z^(q*j) modulo each g_q to derive all 75 entries;
        calculate F^5, trace rank/nullity, fixed space, factors and factor
        kernels. Test irreducibility separately and distinguish quotient-ring
        identities from field identities. Show q=5 non-squarefreeness and
        find a failed check after mutating the q=13 (1,1) entry. Supply
        reproducible intermediate values and a sources-read attestation.
      breaking_artifact: >-
        One divergent matrix entry, factor, dimension, direct-sum assertion,
        irreducibility conclusion, or a false control that still passes.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - "Over F_5, X^5-1=(X-1)^5; distinct-factor decomposition cannot be inferred."
      - "Increase the zero-based (1,1) entry of q=13's derived matrix by one modulo 13."
      - "Same abstract quotient certificate with no historical executable/source custody receipt."
    failure_signature: >-
      A sound argument must reject distinct-factor squarefree decomposition in
      characteristic five, detect a failed algebraic check for the mutated
      matrix, and decline a historical-run conclusion from quotient algebra
      alone.
    assigned_to: TASK-20261025-291039
  blind_rederivation:
    required: true
    quantity: >-
      All 75 q-power matrix entries, fifth-power identity, trace and fixed
      dimensions, nontrivial factor kernels and directness for q=11,13,19.
    parameters: coordination/formal-reviews/BATCH-6da0fe/blind-input.yaml
    blind_from:
      - coordination/formal-reviews/BATCH-6da0fe/review-plan.yaml
      - coordination/formal-reviews/BATCH-6da0fe/input-bindings.json
      - coordination/formal-reviews/BATCH-6da0fe/dispatch_queue.json
      - coordination/formal-reviews/BATCH-6da0fe/reviews/
      - experiments/EXP-FROB-91ee9c/
      - formal/CryptoResearch/FrobTrace/
      - formal/targets/frob-c5-
      - docs/reports/2026-10-22-frob-c5-
      - problems/frob-c5-factor-kernel-and-model-bridge.md
    assigned_to: TASK-20261025-291039
  procedure_deviations: []
