schema: crypto.autoresearch.blind_frob_c5_certificate.v1
question: >-
  Derive the exact q-power map and C5 linear-algebra controls from this parameter
  card without opening the producer implementation, reported matrices, Lean
  sources, or sibling reviews. Freeze the result before any comparison.
parameters:
  extension_degree: 5
  quotient_rings:
    - q: 11
      modulus_constant_first: [1, 0, 0, 0, 2, 1]
    - q: 13
      modulus_constant_first: [1, 0, 0, 0, 8, 1]
    - q: 19
      modulus_constant_first: [1, 0, 0, 0, 3, 1]
definitions:
  quotient: "R_q = F_q[z]/(g_q), represented by the ordered basis [1,z,z^2,z^3,z^4]"
  frobenius: "F(v) = v^q; column j is the coefficients of F(z^j) in the ordered basis"
  trace_map: "T = I + F + F^2 + F^3 + F^4"
  factor_kernels: "For each distinct monic irreducible factor f of X^5-1 other than X-1, compute ker f(F)."
tasks:
  - Compute all three 5-by-5 Frobenius matrices by polynomial reduction, without copying any reported matrix.
  - Check F^5 = I, rank and nullity of T, the F-fixed-space dimension, and whether the nontrivial factor kernels sum directly to ker T.
  - Independently test whether each supplied modulus is irreducible; state separately what quotient-ring conclusions hold without field irreducibility.
  - State the factorization and squarefreeness of X^5-1 for each q.
controls:
  characteristic_five: "Over F_5, X^5-1=(X-1)^5; the distinct-factor decomposition must not be asserted there."
  mutated_matrix: "Increase the zero-based (1,1) entry of the q=13 matrix by one modulo 13 and identify a failed algebraic check."
scope_limit: >-
  The card does not establish that an archived Sage executable selected these
  moduli, that the archived process used the supplied source bytes, C8, or the
  experiment's historical success or performance. No generic ECDLP cost claim.
deliverables:
  - Exact matrices and intermediate polynomial remainders sufficient for independent checking.
  - Rank, kernel, factorization, irreducibility and negative-control results with code or calculations.
  - A precise statement of what does and does not follow for the historical run.
  - Sources-read and blind-from attestation, frozen before comparison.
limits:
  - Pure local arithmetic review only; no EKS, Sage, historical experiment replay, or new scientific trial.
