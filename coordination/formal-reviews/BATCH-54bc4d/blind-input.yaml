schema: crypto.autoresearch.blind_integer_certificate.v1
question: Independently compute the integer identities and abstract quadratic-order bound from this
  parameter card. Freeze the result before opening producer sources or sibling reviews.
parameters:
  curve_label: gost/gost512
  p: '3623986102229003635907788753683874306021320925534678605086546150450856166624002482588482022271496854025090823603058735163734263822371964987228582907372403'
  n: '3623986102229003635907788753683874306021320925534678605086546150450856166623969164898305032863068499961404079437936585455865192212970734808812618120619743'
  h: 1
  t: '33317690176989408428354063686744165122149707869071609401230178415964786752661'
  candidate_factors:
  - value: '19870558523'
    exponent: 1
  - value: '11835435841106589935101828631690025847894423092157874929644257201109983'
    exponent: 1
  - value: '56918371428309891184900970137949897231341753258418325639321175932757458199'
