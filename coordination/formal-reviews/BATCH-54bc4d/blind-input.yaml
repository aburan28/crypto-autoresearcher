definitions:
  N: 4*p - t^2
  factorization_test: Multiply the candidate factors with their exponents and compare with N; do not
    assume factor primality.
  squarefree_part: If every candidate factor is prime, multiply exactly those with odd exponents;
    separately state what can be concluded without that premise.
  fundamental_discriminant_candidate: When N=s*f^2 with squarefree positive s, take D_K=-s if -s is
    1 modulo 4; otherwise take D_K=-4*s when -s is 2 or 3 modulo 4. Check t^2-4*p=D_K*f^2.
  abstract_min_nonscalar_norm: For negative D_K congruent to 1 modulo 4, ring elements are (a+b*sqrt(D_K))/2
    with integers a,b of equal parity. For b nonzero, norm=(a^2+abs(D_K)*b^2)/4. Derive the exact
    least integer norm and its power-of-two lower bound, considering both parity cases.
  curve_bridge: Do not infer that p is prime, t is the named curve Frobenius trace, End(E) equals
    this order, or that abstract norm equals endomorphism degree without separate premises.
controls:
  mutated_factor: Replace the second candidate factor by that integer plus 1 and check that the product
    identity fails.
  primality_absence: Treat all candidate factors as unproved prime; state which fundamental-discriminant
    and curve claims remain conditional.
deliverables:
- exact integer identities and first mismatch if any
- derived N, D_K, f and abstract minimum norm with bit bounds
- explicit control outcomes
- sources_read and blind-from attestation
limits:
- No scientific trial, Sage, PARI, EKS job, or producer script is authorized by this card.
- The card supplies candidate factors, not primality proofs or a curve-model certificate.
