review_plan:
  claim_under_review: >-
    Target ENDOSWEEP-DK-EXACT-BATCH5-20261023-EXACT-DISCRIMINANTS claims a
    numeric certificate for gost/gost512: exact integer identities, a
    factorization certificate, a quadratic discriminant and abstract
    minimum nonscalar norm; its fundamental-discriminant conclusion assumes
    three listed factors above 10^8 are prime. The producer README also
    discusses End(E)=O_K under a curve-model bridge. This review tests source
    custody, the exact Lean theorem boundary and blind arithmetic. It does
    not assert named-curve endomorphism-ring equality or a performance bound.
  coordinator_prior:
    recorded_before_reviewers: true
    expectation: >-
      The integer equations should survive independent multiplication and
      subtraction. I expect the Lean theorem to keep large-factor primality
      conditional and to omit the source-curve trace and endomorphism-ring
      bridge. The README currently phrases End(E)=O_K conditionally, but its
      evidence for those premises may be incomplete. I read the source and
      cannot serve as the blind reviewer.
    uncertainty: >-
      Whether source artifacts truly bind the numeric certificate and factor
      provenance; whether the exact theorem type adds or loses assumptions;
      whether a blind computation finds a mismatch or a stronger bound; and
      what can be said about the named curve without independent model data.
  joints:
    - joint: J1 source custody and claim language
      assigned_to: TASK-20261025-5dc462
      attack_plan: >-
        Inspect the pinned README, JSON records, SHA256SUMS, snapshot-five
        state and event log, selected survey, FactorDB receipt and generator
        sources. Check what exact bytes support p, n, t, the factor split and
        external primality assertion. Distinguish project-found and external
        factors, available native PARI proof from a reported prior call, and
        the conditional End(E) paragraph from any unqualified wording.
      breaking_artifact: >-
        First mismatched source hash, factor attribution, result sentence or
        missing native proof that defeats a claimed source-to-certificate step.
    - joint: J2 exact Lean theorem and model bridge
      assigned_to: TASK-20261025-e19dad
      attack_plan: >-
        From pinned Lean sources and toolchain, obtain the elaborated type
        and axiom set of DkExactBatch5.exact_discriminants where feasible.
        Trace Statement, Holds, IsFundamental and min-norm definitions through
        imports. Compare each premise and conclusion with the target and
        source prose. Use a one-digit false arithmetic control. Identify
        exactly which curve-specific assertions have no theorem bridge.
      breaking_artifact: >-
        An unadvertised premise, vacuous implication, non-theorem target,
        unsafe axiom, failed negative control, or absent curve-model map.
    - joint: J3 blind integer and order calculation
      assigned_to: TASK-20261025-9add12
      attack_plan: >-
        Starting only from blind-input.yaml, independently compute p+1-t=h*n,
        N=4p-t^2, the candidate product, discriminant candidate, conductor
        and abstract minimum norm, then derive exact bit inequalities.
        Mutate the second factor by one and test the product; withhold
        primality and curve-model assumptions when stating conclusions.
        Freeze the result before comparing with source or sibling artifacts.
      breaking_artifact: >-
        A concrete integer mismatch, a false bound, a failed mutation control
        or a precise conditionality gap, with enough intermediate values to
        reproduce the calculation.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - A second candidate factor increased by one while all other card integers stay fixed.
      - The same integer card with no primality proofs or named-curve trace certificate.
    failure_signature: >-
      The first control must fail exact factorization. A sound numeric proof
      must not infer a fundamental field discriminant or End(E)=O_K for the
      named curve from the second control alone.
    assigned_to: TASK-20261025-9add12
  blind_rederivation:
    required: true
    quantity: >-
      Exact integer identities, conditional D_K and f construction, and the
      least nonscalar norm of the abstract quadratic order, with bit bounds.
    parameters: coordination/formal-reviews/BATCH-54bc4d/blind-input.yaml
    blind_from:
      - coordination/formal-reviews/BATCH-54bc4d/review-plan.yaml
      - coordination/formal-reviews/BATCH-54bc4d/input-bindings.json
      - research/endosweep_dk_exact_batch5_20261023/
      - research/endosweep_dk_exact_20261016/
      - formal/CryptoResearch/Endosweep/
      - formal/targets/endosweep-dk-exact-batch5-discriminants.yaml
      - docs/reports/2026-10-23-formal-target-inventory/
      - problems/formal-target-semantic-fidelity-unreviewed.md
      - coordination/formal-reviews/BATCH-54bc4d/reviews/
    assigned_to: TASK-20261025-9add12
  procedure_deviations: []
