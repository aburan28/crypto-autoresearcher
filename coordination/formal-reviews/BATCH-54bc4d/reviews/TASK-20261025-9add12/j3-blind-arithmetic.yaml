  t = int('33317690176989408428354063686744165122149707869071609401230178415964786752661')
  q = [19870558523,
       11835435841106589935101828631690025847894423092157874929644257201109983,
       56918371428309891184900970137949897231341753258418325639321175932757458199]
  N = 4*p - t*t
  P = q[0]*q[1]*q[2]
  M = q[0]*(q[1]+1)*q[2]
  D0 = -N
  minimum = (1+N)//4
  assert p+1-t == n and N > 0 and P == N
  assert N%4 == 3 and D0%4 == 1 and t*t-4*p == D0
  assert M != N and M-N == q[0]*q[2]
  assert (1+N)%4 == 0 and minimum < N
  assert 2**511 <= N < 2**512
  assert 2**509 <= minimum < 2**510
  print('N =', N)
  print('D0 =', D0)
  print('conditional D_K =', D0, 'conditional f = 1')
  print('abstract minimum norm =', minimum)
  print('mutated product minus N =', M-N)
  PY
