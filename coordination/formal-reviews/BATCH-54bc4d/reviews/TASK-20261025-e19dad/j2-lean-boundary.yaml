findings:
  - id: J2-1
    severity: moderate
    status: semantic_boundary_mismatch
    evidence:
      - formal/targets/endosweep-dk-exact-batch5-discriminants.yaml:27
      - formal/CryptoResearch/Endosweep/DkExactBatch5.lean:66
      - formal/CryptoResearch/Endosweep/DkExact.lean:62
      - formal/CryptoResearch/Endosweep/NistCertificates.lean:89
    observation: >-
      The target calls the odd-exponent product s the squarefree part among
      unconditional results, and the theorem comments call the displayed
      bases primes. The checked proposition is list filtering plus an exact
      product. Since all three listed bases are largePrimes, Lean proves no
      base prime unconditionally and does not assert SqFree s outside the
      primality implication. Thus this source-to-theorem step needs a
      condition or narrower wording.
    correction: >-
      Call s the product of the odd-exponent listed factors until their
      primality is supplied. State that it is the squarefree part and DK is
      fundamental conditional on the three prime premises, or add checked
      primality certificates if an unconditional Lean claim is intended.
  - id: J2-2
    severity: boundary
    status: disclosed_missing_bridge
    evidence:
      - formal/CryptoResearch/Endosweep/DkExactBatch5.lean:86
      - research/endosweep_dk_exact_batch5_20261023/README.md:119
      - research/endosweep_dk_exact_batch5_20261023/README.md:288
    observation: >-
      The theorem has literal integers and an abstract order norm, with no
      named-curve field, trace, ordinary-curve, endomorphism-ring or
      degree-as-norm premise. README passages that reach End(E)=O_K explicitly
      use external hypotheses and theory. Do not promote the numeric theorem
      alone to that curve-specific conclusion.
