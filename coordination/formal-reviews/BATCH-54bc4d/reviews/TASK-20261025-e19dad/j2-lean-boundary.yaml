definition_trace:
  singleton_scope: >-
    DkExactBatch5.lean:73-74 defines dkCerts as [gost_gost512]. The theorem
    does not quantify over a JSON file, curve model, or arbitrary GOST curve.
  closed_holds: >-
    DkExact.lean:53-60 conjoins q+1-t=h*n, FactoredCert.Holds, oddPrimes.prod=s,
    DK mod 4, the L-bit interval, and the degree bound. DkExactBatch5.lean:64
    proves these for the literal card using decide +kernel without axioms.
  factored_holds: >-
    NistCertificates.lean:89-98 checks the discriminant identity, exact product
    of listed bases to listed exponents, parity-filtered factor list,
    oddPrimes.Nodup, DK construction, IsDisc, degree formula, and trial-division
    obligations for smallPrimes. For gost_gost512, smallPrimes=[] and
    largePrimes contains all three displayed bases.
  statement: >-
    DkExact.lean:62-73 states the same numeric identities, IsDisc, degree and
    bit bounds, ending with ((forall p in c.largePrimes, IsPrimeNat p) ->
    IsFundamental c.DK). Its only prime implication is this last conjunct.
    The prime premise is not discharged by exact_discriminants.
  prime_definitions: >-
    Discriminant.lean:128-137 defines IsPrimeNat by divisors, SqFree by absence
    of nontrivial square divisors, and IsFundamental by the usual negative
    squarefree/discriminant cases. DkCert.statement_of_holds uses trial division
    for smallPrimes and the explicit largePrimes premise to apply
    isFundamental_of_primes. The first gost factor 19870558523, the 71-digit
    factor, and the 74-digit factor are all in that premise.
  abstract_norm: >-
    Discriminant.lean:31-45 defines omegaTrace, omegaNorm, norm(D,a,b), and
    minNonscalarDegree(D). Lines 101-118 prove that for IsDisc D and b != 0,
    this formula is a lower bound for norm(D,a,b), attained at (a,b)=(0,1).
    Statement supplies IsDisc DK and minNonscalarDegree DK = deg; the top-level
    theorem supplies deg >= 2^509. This gives an abstract quadratic-order
    norm bound after applying the imported least-norm theorem, not an
    elliptic-curve endomorphism-degree statement.
  absent_bridges:
    - No theorem binds q to the named curve's prime field size or proves q prime.
    - No theorem binds t to the named curve's actual Frobenius trace or proves n prime.
    - No formal curve model, Frobenius element, endomorphism ring, or isomorphism to the abstract quadratic order occurs in this theorem type.
    - No theorem identifies endomorphism degree on gost/gost512 with the abstract norm or proves End(E)=O_K for that curve.
  source_prose: >-
    README.md:119-129 and 288-295 state the End(E)=O_K and endomorphism-degree
    consequences conditionally on field/trace, factor primality, and standard
    ordinary-curve theory; README.md:384-399 repeats Lean's factor and model
    limits. Those conditional passages are within the theorem boundary.
