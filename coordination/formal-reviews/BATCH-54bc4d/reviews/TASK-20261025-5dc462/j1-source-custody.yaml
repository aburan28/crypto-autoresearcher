bounded_hold: >-
  The first source-to-concrete-curve step left unproved in this scope is the
  identification of the archived p, n and derived t with a prime-field model
  and the actual Frobenius trace of the named gost/gost512 curve. The target and
  README expressly withhold that bridge. The FactorDB record is an operator's
  archived JSON receipt, not a retained authenticated HTTP response; it binds
  the reported external split internally but does not establish who found it.

