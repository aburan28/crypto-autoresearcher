claim_language:
  readme_part_a: >-
    README lines 20-24 say the last C144 split "was not found by this project"
    and "was fetched from FactorDB". Lines 119-125 give f=1 and D_K=-s for the
    recorded integers, then require prime field size q, actual Frobenius trace
    t, the listed large factors' primality, and the ordinary-curve theorem for
    End(E)=O_K. Lines 287-297 repeat the curve-model condition and say the
    identification is not Lean-certified.
  readme_lean: >-
    README lines 372-399 call the arithmetic closed, fundamentality conditional
    on all three factors above 10^8, the PARI proof external to Lean, and
    primality of p,n, named-curve trace and elliptic-curve facts uncertified.
  formal_target: >-
    formal/targets/endosweep-dk-exact-batch5-discriminants.yaml calls this a
    numeric certificate for one curve's recorded p,t,h,n,D_K,f,s and factors;
    its claim gives the integer identities, conditional fundamental
    discriminant, |D_K|>=2^511 and abstract degree>=2^509. Its notes expressly
    exclude actual named-curve trace and End(E) order identification.
  qualification: >-
    The README title and first answer use "Exact CM discriminant of gost512"
    and "so f=1 and D_K=..." without repeating the premise there. Later
    paragraphs qualify this as a recorded-integer/conditional named-curve
    result. A standalone quotation of the first answer would overstate the
    source-supported named-curve conclusion; it must carry the later premise.

procedure_deviations:
