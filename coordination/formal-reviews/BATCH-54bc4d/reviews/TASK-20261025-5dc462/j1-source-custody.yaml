factor_provenance:
  curve: gost/gost512
  survey: >-
    provenance/survey_selected.jsonl records no small factors and gives the
    whole 155-digit 4p-t^2 as its composite, matching factorizations.jsonl.
  frozen_state: >-
    The snapshot entry keyed by that 155-digit composite has open=[], three
    factors, and split-log entries "ECM B1=11000: 155-digit -> 11 x 144" and
    "FactorDB (fetched 2026-10-22T23:04:32.541251Z): 144-digit -> 71 x 74".
    Its C144 counters are ecm_done=5 and 1200 curves at tier 5.
  event_log: >-
    Line 18 records the 11-digit ECM find on 2026-10-16T20:34:13Z. Line 161
    records the FactorDB find at 2026-10-22T23:04:46Z, FactorDB id
    1100000009030548498, and says the product and PARI isprime were checked
    locally. The last logged gost/gost512 tier-5 progress is 1200/4480.
  project_found_factor: '19870558523'
  project_found_method: GMP-ECM 7.0.5 B1=11000, driver tier 1
  external_factors:
    - '11835435841106589935101828631690025847894423092157874929644257201109983'
    - '56918371428309891184900970137949897231341753258418325639321175932757458199'
  external_source: >-
    The operator receipt provenance/gost512_factordb.json labels the C144 split
    source=factordb.com, with the same factor strings, timestamp and id as the
    state and log. Finder and discovery method remain unknown. The project
    does not claim its ECM or CADO found either large factor.
  script_trace: >-
    make_factorizations.py:method() maps the FactorDB log form to
    "FactorDB (external; finder not recorded; fetched <timestamp>)".
    make_factorizations.py checks survey/state agreement, factor product and
    PARI isprime before writing; build_dk_exact.py reloads curve data and
    recomputes t, N, D_K and f before writing dk_exact.json. These are source
    code checks, not fresh executions in this review.
  record_agreement: >-
    factorizations.jsonl and dk_exact.json contain the same three factors,
    exponents 1, found_by order and N; dk_exact.json records h=1, f=1,
    squarefree_part=N and D_K=-N. The numeric target names those same source
    records and keeps large-factor primality conditional in Lean.
  local_static_checks: >-
    Integer and JSON comparison of the pinned records returned true for
    product(factors)=N, p+1-t=h*n, 4p-t^2=N, state/result/receipt factor
    equality, and product(external factors)=the archived C144. This was a
    source-consistency calculation, not a curve-model or prime proof.

