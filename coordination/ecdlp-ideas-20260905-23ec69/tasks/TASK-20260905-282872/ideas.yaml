            checkers), transfer (fails at cells where D_NS is only bounded) and
            cost loss (none) stated separately.
          predicted_gain: >-
            A hardware-free number replacing the source's uncontrolled 300x.
        - transform: baseline_lift
          proposed_object: >-
            Treat the leaf-count proof as the boundary of the certificate
            family and ask for a strict inward improvement: any checked proof
            shorter than 0.5 x leaves.
          predicted_gain: >-
            Strictness, not feasibility: a shorter proof exhibits structure
            the search missed; predicted not to exist.
