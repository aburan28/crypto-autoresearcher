  - id: IDEA-20260905-79112a
    title: >-
      Incremental assumption-based solving across targets amortises nothing -
      with the target's n bits as assumptions every learned clause is predicted
      to contain assumption literals or to be a full-length target negation,
      so T targets cost T times one target; the dominating row is batched
      enumeration of all m-multisets against a hash set of the T targets at
      2^{ml}/m! total, a factor m m! below the per-target loop of
      IDEA-20260904-96c4f3 at memory m! 2^l
    class: control
    pipeline_stage: decomposition (amortisation across targets)
    target_kind: amortised constant
    claim: >-
      SCOPE: binary symmetrized pdp, m = 3, l in 4..8, plain CNF model with
      the target x-coordinate as n free variables r_0..r_{n-1} entering the
      F set through the descent of S'_{m+1}(e, X); cadical in incremental
      mode with the r-literals of each target passed as assumptions; the
      digit-presented prime-field system with target digits as assumptions
      as the prime-field arm. CLAIM TIER toy. NO ATTACK.
      (A) NO AMORTISATION. Over a sequence of T in {1, 10, 100} targets on
      one (curve, V), the total UNSAT conflict count equals T times the
      single-target count within 5 percent; the fraction of learned clauses
      containing no r-literal is below 1 percent; and every learned clause
      consisting only of r-literals has length n (a full target negation,
      reusable only for a repeated target). Reuse, measured as the conflict
      reduction on target t+1 from clauses learned on targets <= t, is below
      2 percent.
      (B) THE DOMINATING ROW, DERIVED. Relation collection over T targets
      known in advance costs C(|B|+m-1, m) + T hash lookups by enumerating
      every m-multiset once and looking its sum up in a hash set of the
      targets; with T = m! 2^{n-(m-1)l} targets needed for 2^l relations
      (KN-FIND-007 mean) and l = n/m this is 2^n/m! + T operations at memory
      T = m! 2^l - a factor m m! (18 at m = 3) below 96c4f3's per-target row
      m 2^n, at memory of the same order as the factor base. Still a factor
      about 2^{n/2}/(m! 0.886) above Pollard rho. The SAT arm cannot beat
      this row and is predicted not to approach it.
      (C) OUTCOMES. (A) holding: multi-target SAT is a per-target search;
      amortisation lives only in the batched enumerator. (A) failing with
      r-free learned clauses accumulating and per-target cost falling in T:
      the solver is learning a target-independent table (the pair-sum table
      of 96c4f3 row D), which is the interesting outcome and is then costed
      against the batched row.
    mechanism: >-
      TRACKED OBJECT AND LOSSY-PROJECTION TEST. The object is the
      ASSUMPTION-DEPENDENCE HISTOGRAM of the learned-clause database: per
      clause, the number of r-literals it contains and its length. Lossy
      (discards everything else), compatible (conflict analysis under
      assumptions produces clauses whose r-literal count is determined by the
      reason chain, so the histogram propagates). Change-of-coordinates
      failure: the clause database.
      WHY EVERY CONFLICT IS TARGET-DEPENDENT. The only clauses carrying the
      target are the F-set clauses, which contain r-derived literals; under
      the no-above-leaf-pruning mechanism every conflict involves an F-set
      clause, so the 1-UIP clause's reason chain includes assumption-level
      literals, which survive as r-literals in the learned clause. An r-free
      learned clause would be a consequence of the curve-only part (E-X
      relations and substitutions), which is satisfiable for every core
      assignment and so implies nothing non-trivial.
      WHY THE BATCHED ROW IS EXACT. Every m-multiset sums to exactly one
      target (KN-FIND-007's double count), so enumerating multisets once and
      hashing finds every relation among T targets at C(|B|+m-1, m) work.
      This is elementary and probably folklore; it is stated because
      96c4f3's frontier row m 2^n omits it and because it is the honest
      dominating row for any multi-target amortisation claim.
      DIFFERENCE FROM 7fd218: that record toggles learning within one target;
      this record measures learning ACROSS targets under assumptions, and
      the falsifier named by the Coordinator (every learned clause is
      target-dependent) is its primary prediction.
