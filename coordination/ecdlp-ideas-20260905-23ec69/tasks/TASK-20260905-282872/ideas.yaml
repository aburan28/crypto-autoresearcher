  - id: IDEA-20260905-a6f98e
    title: >-
      Two certificates of non-decomposability and a proof-size dichotomy - the
      LRAT refutation of an UNSAT pdp instance has length equal to its leaf
      count (no compression), while the Nullstellensatz degree D_NS of the same
      instance is measurable by exact rank, and which certificate is smaller
      decides the SAT-versus-Groebner question on the UNSAT side without any
      solver implementation
    class: measurement
    pipeline_stage: certification
    target_kind: >-
      certifiability (closing the negative-side certificate gap), with the
      Nullstellensatz-degree slope as a pre-registered exponent-bearing
      hypothesis whose honest prior is against it
    claim: >-
      SCOPE: symmetrized binary pdp of SRC-SATIC-TRIMOSKA-2019 (m = 3,
      l in 3..8, n in {3l-1, 4l}) in its plain CNF model (XORs cut ternary and
      expanded, equation (9) of the source) and its direct ANF form in the ml
      core variables; the prime-field digit system of IDEA-20260830-84cdb7
      at m in {2,3}, s <= 6 as the prime-field arm. CLAIM TIER toy. NO ATTACK.
      (A) CERTIFICATE ONE - CLAUSAL. Every UNSAT verdict in this lane carries a
      DRAT or LRAT proof emitted by cadical or kissat and checked by an
      independent checker (drat-trim, lrat-check or cake_lpr, each to be
      built), closing the gap named in RQ-ECDLP-f0a7b0's constraints: today a
      non-decomposition is "reported as unproved". PREDICTION: the proof
      length L_res in learned clauses equals (1 +- 0.2) x the instrumented
      leaf count, i.e. (1 +- 0.2) 2^{ml}/|G|; checking cost is linear in
      L_res; and the proof does NOT compress - trimming (drat-trim's backward
      check) removes fewer than 20 percent of clauses. A proof shorter than
      the leaf count by a factor >= 2 would witness above-leaf structure that
      the search itself did not exploit, which is the "proof size as pruning
      instrument" the Coordinator asked for.
      (B) CERTIFICATE TWO - ALGEBRAIC. For the same UNSAT instance the direct
      Boolean system F = {f_0..f_{n-1}} in the ml core variables has a
      Nullstellensatz certificate 1 = sum g_i f_i modulo the field equations;
      D_NS := the least D at which 1 lies in the degree-D Macaulay row space,
      computed by exact GF(2) rank (the peel_and_rank engine of EXP-DREG-001).
      Its size is Ncols(ml, D_NS) and it is checkable by multiplying out.
      PREDICTION, THREE PRE-REGISTERED OUTCOMES: (I) D_NS grows linearly in l
      with slope in [0.5, 2] - the semi-regular reading, certificate size
      2^{Theta(l)}, and the comparison log2 Ncols(ml, D_NS) versus ml - log2 m!
      is the implementation-free SAT-versus-Groebner verdict on the UNSAT
      side; (II) D_NS is bounded in l over the tested ladder - the
      exponent-bearing outcome, because a uniformly bounded D_NS over the
      family and its bit-restrictions gives, by ml successive restrictions,
      a poly(l) decision procedure for the pdp; honest prior <= 0.05, and it
      licenses only a conditional claim under the two-record rule; (III) D_NS
      exceeds the memory contract at the top cells and is reported as a lower
      bound, which still decides the size comparison whenever
      Ncols(ml, D_lower) already exceeds 2^{ml}/m!.
      (C) THE PRIME-FIELD ARM. Over F_p the same two certificates exist
      (resolution on the bit-blasted digit system; Nullstellensatz over F_p
      on the digit system), and IDEA-20260903-e1e38b's derivation gives
      D_NS >= d_ff = m 2^{m-1} + floor((s - 2^{m-1})/2) + 1, so outcome (II)
      is predicted IMPOSSIBLE at d = 2 and the record's prime-field content is
      the measured excess D_NS - d_ff.
    mechanism: >-
      TRACKED OBJECT AND LOSSY-PROJECTION TEST. The object is the pair
      (L_res, D_NS) - the length of the clausal refutation and the degree of
      the algebraic one - for one UNSAT instance. It is lossy: it discards
      the proof itself, the search order, the Macaulay row space and the
      instance identity, keeping two integers; the fibre over a pair is every
      instance and every proof with those sizes. It propagates compatibly:
      under a bit restriction (fixing one core variable) a resolution proof
      restricts to a proof of at most the same length and a Nullstellensatz
      certificate restricts to one of at most the same degree, so both
      coordinates are monotone under the operation the self-reduction uses.
      The projection that fails the test: the Macaulay row space itself,
      which loses nothing and is a change of coordinates on the ideal.
      WHY L_res EQUALS THE LEAF COUNT. A complete DPLL/CDCL search that
      refutes every node only at the leaves produces a tree-like resolution
      refutation with one learned clause per leaf and no clause reused above
      the leaf level - the classical correspondence between DPLL trees and
      tree-like resolution. IDEA-20260904-3c7a91's no-above-leaf-pruning
      mechanism therefore predicts L_res = leaves, and it predicts that
      backward trimming finds nothing to remove because no learned clause
      subsumes another's role.
      WHY D_NS IS THE RIGHT ALGEBRAIC OBJECT. It is defined without a solver
      ("1 in the row space at degree D"), it is monomial-order-independent,
      it lower-bounds nothing about SAT instances (where no certificate
      exists and the decomposition itself is the certificate), and on UNSAT
      instances it equals the degree at which grevlex F4 terminates with
      basis {1}. The source's own observation that Groebner bases are
      cheaper on instances with no solution is, in this language, the
      statement that D_NS is small relative to the search - which is exactly
      what is measured rather than assumed.
      WHY THE DICHOTOMY IS THE HONEST COMPARISON. Magma is unavailable and
      Sage/Singular ratios are not comparable to the source's Magma ratios
      (notes/satic_solver_environment_20260904.md); certificate sizes are
      implementation-free and hardware-free, so the pair (log2 L_res,
      log2 Ncols(ml, D_NS)) is the one SAT-versus-Groebner number this
      repository can produce without a cross-hardware ratio.
      CALIBRATION BY A KNOWN SEPARATION. Tseitin parity contradictions have
      polynomial-size linear-algebra (degree-of-generators) Nullstellensatz
      certificates over F_2 and exponentially long resolution refutations
      (Urquhart, recalled); a random 3-CNF near threshold has both exponential.
      Running the instrument on both known objects establishes that it can
      see a separation before it is asked to look for one.
      DIFFERENCE FROM THE OFF-LIMITS MECHANISMS: 3c7a91 measures where the
      search conflicts; this record measures what the search PROVES and
      compares it with an algebraic proof of the same fact, and it is the
      only record in the lane that produces an independently checkable
      artifact for a negative answer.
