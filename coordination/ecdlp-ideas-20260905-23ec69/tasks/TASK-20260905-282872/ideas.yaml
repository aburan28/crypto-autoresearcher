    assumptions:
      - >-
        The (BV) encoder is a correct Tseitin encoding of S_{m+1} mod p over the
        digit inputs; correctness is checked by exact agreement of its solution
        set with brute force at s <= 4 before any count is reported.
      - >-
        Solver preprocessing is disabled and verified (variable count before and
        after), otherwise the digit order is not the order that ran.
      - >-
        Leaf/node counts come from a harness-instrumented counter; solver
        conflict counters are recorded but never used as the primary metric.
      - >-
        A timeout, memory abort or unbuildable dependency (cvc5, IPASIR-UP) is
        an infrastructure outcome recorded as such, never a measurement.
    proof_search_map:
      bottleneck: >-
        The number of digit-block assignments a complete CDCL(T) search must
        refute on a prime-field pdp instance; every SMT cost is that number
        times a per-node constant, and whether any theory prunes above the
        last block is the step whose removal would change the cost exponent.
      baseline_embedding:
        parameter_slice: >-
          m = 2, s in {4,5,6}: the residual after one block is univariate of
          degree 2 and both (UP) and brute force are enumerable to completion;
          the prediction is 2^{s}/1 nodes for (UP) and 2^{2s}/2 leaves for
          (BV), checkable exactly. At m = 3, s = 6 the prediction is
          2^{18}/6 = 43691 (BV) and 2^{12} 4/2 = 8192 (UP).
        reproduction_check: >-
          Frozen integer fixture of 2^{ms}/m! and 2^{(m-1)s} 2^{m-1}/(m-1)! at
          every planned cell, committed before any run, plus exact solution-set
          equality of all three arms against brute force at s <= 4.
      observation_collision:
        observable: >-
          The depth-indexed refutation count and its total.
        distinct_preimage_search: >-
          PREDICTED COLLISION: the (BV) histogram on the real system and on the
          support-matched random digit null (84cdb7's null) are identical
          within eps - the observable carries no curve content. The collision
          that would FALSIFY the framing: two encodings with the same backdoor
          size and totals differing by more than 2x, which would mean theory
          reasoning prunes and the record's tier assignment is wrong.
      constructive_transforms:
        - transform: representation_reduction
          proposed_object: >-
            Replace "which SMT theory is fastest" by the integer pair
            (backdoor size ms, number of blocks collapsible by root-finding),
            with the search exponent an arithmetic identity in the pair.
          predicted_gain: >-
            Encoding exact for the node count; soundness: the residual is
            reported, never fitted; transfer: DECLARED UNMET for theory
            solvers with non-Groebner reasoning and for d > 2 digit bases.
        - transform: observable_fiber
          proposed_object: >-
            Hold the histogram fixed and vary curve, target, prime and base
            digit; the intrinsic invariant predicted to distinguish them is none
            on UNSAT instances.
          predicted_gain: >-
            A prohibition on reading curve content out of a prime-field SMT
            cost, matching IDEA-20260904-b40e6d's binary prohibition.
      quantifier_order: >-
        CLAIMED: EXISTS the fixed pair of functions N_BV(m,s) = 2^{ms}/m! and
        N_UP(m,s) = 2^{(m-1)s} 2^{m-1}/(m-1)!, written before measurement,
        FORALL (p, curve, target, seed, solver in the tested set) in the
        boundary, such that measured UNSAT counts lie within 10 percent
        (BV, FF) and within a factor (1 + O(2^{-s})) (UP). The witness may not
        depend on p or the curve. THE QUANTIFIER AT RISK is over theory
        solvers: cvc5's procedure was not read and may prune; if it does, (FF)
        is reported outside the law and the mechanism is exhibited.
      method_ceiling:
        strongest_certifiable_claim: >-
          A toy-tier statement that on the tested encodings, solvers and cells
          the prime-field pdp search visits the predicted counts; it cannot
          certify that no SMT theory prunes, cannot bound the per-node
          constant, and says nothing at cryptographic p.
        nearby_object_control: >-
          The KNOWN-FALSE OBJECT: the same system plus the linear digit
          relation x_1 + x_2 = c (a cross-block linear equation), on which the
          (BV) count must collapse by about 2^s and (UP) by about 2^s; an arm
          that returns the ceiling there is not detecting pruning and reports
          nothing. Second nearby object: a bivariate residual fed to (UP),
          where claim (B) says no collapse occurs.
      proof_obligations:
        - claim: Full-input assignment propagates every gate of the (BV) circuit.
          responsibility: correctness
        - claim: The three arms have identical solution sets at s <= 4.
          responsibility: interface
        - claim: (UP)'s node count equals 2^{(m-1)s}/(m-1)! (1 + O(2^{-s})).
          responsibility: size
        - claim: (BV) UNSAT count within 10 percent of 2^{ms}/m! at every cell.
          responsibility: strictness
        - claim: The known-false object collapses by >= 2^{s-1} on every arm.
          responsibility: feasibility
        - claim: Nothing transfers to cryptographic p, to d > 2, or to solvers not run.
          responsibility: scope
      not_applicable_reason: null
    predictions:
      - metric: >-
          UNSAT bv_leaf_ratio = instrumented leaves of (BV) / (2^{ms}/m!),
          m = 3, s in {5,6,7,8}, block order with lexicographic pruning
        direction: different
        minimum_effect: >-
          In [0.90, 1.10] at every cell. A ratio below 0.80 falsifies (A) and
          is the interesting outcome.
      - metric: >-
          UNSAT ff_check_ratio = theory checks of (FF) / leaves of (BV), same instances
        direction: different
        minimum_effect: >-
          In [0.5, 2]. A value below 0.5 means the theory solver prunes above
          the last block and falsifies claim (B)'s Groebner half.
      - metric: >-
          UNSAT up_node_ratio = depth-(m-1)s nodes of (UP) / (2^{(m-1)s}/(m-1)!)
        direction: different
        minimum_effect: >-
          In [0.95, 1.05]; children per node <= 2^{m-1} at every node.
      - metric: >-
          SAT conflict fraction = conflicts on planted instances / UNSAT conflicts at the same cell, per arm, >= 20 instances
        direction: different
        minimum_effect: >-
          Mean in [0.3, 0.7] with coefficient of variation >= 0.4 for (BV) and
          (FF), consistent with a uniformly placed planted solution; a tight
          small mean indicates the solver locates solutions faster than
          chance.
      - metric: >-
          refutation_depth_mass_top = fraction of (BV) refutations at depth >= ms - s
        direction: higher
        minimum_effect: >-
          >= 0.90. A value <= 0.70 falsifies the mechanism even if the total matches.
      - metric: >-
          known_false_collapse = leaves(real) / leaves(real + x_1 + x_2 = c), per arm
        direction: higher
        minimum_effect: >-
          >= 2^{s-1}. Below that the instrument cannot see pruning and no null
          result is reportable.
      - metric: >-
          null_ratio = leaves(real) / leaves(support-matched random digit null), (BV), UNSAT
        direction: different
        minimum_effect: >-
          In [0.95, 1.05]; a value <= 0.90 is curve-specific structure and is
          the highest-value outcome.
    minimal_test:
      design: >-
        STAGE 0 (zero compute). Commit the integer table N_BV, N_UP at every
        planned cell; write the (BV) circuit spec and the (UP) propagator
        contract (invocation condition, root-finding routine, branching
        bound 2^{m-1}).
        STAGE 1 (instrument validity). m = 2, s in {3,4}, p in {4099, 65537}:
        brute-force all decompositions of 10 targets; require exact
        solution-set equality of (BV) via cadical and kissat, of (UP), and of
        (FF) if built; every SAT answer certified by independent point
        arithmetic and digit re-checking (docs/claims-and-verification.md).
        STAGE 2 (the discriminator). m = 3, s in {5,6,7,8}, p in {2^16, 2^20},
        10 random (mostly UNSAT) and 10 planted targets per cell, >= 3 seeds,
        arms (BV) cadical, (BV) kissat, (UP), and (FF) where available;
        record instrumented leaves/nodes, solver conflicts and decisions, the
        depth histogram, wall clock with pinned version/commit/hardware/seed,
        termination reason, peak RSS. SAT and UNSAT reported separately.
        STAGE 3 (controls). Support-matched random digit null (N0-p) and
        wrong-curve-constant null (N3-p) at one cell per s; the known-false
        object at every cell; the bivariate-residual (UP) variant at s in {5,6}.
        STAGE 4 (analysis). Fit the depth histogram; report the tier each arm
        lands on; report the (UP)/(BV) ratio against 2^{s-m+1}/m.
      controls:
        - >-
          SHAPE-MATCHED RANDOM NULL (prime-field analogue of the
          IDEA-20260904-b40e6d ladder): random polynomial with the same
          digit-multidegree support and random F_p coefficients (N0-p), plus
          the wrong-constant variant (N3-p).
        - >-
          PLANTED-SATISFIABLE INSTANCES from interval factor-base points, with
          certificate re-verification.
        - >-
          KNOWN-FALSE OBJECT: the system plus x_1 + x_2 = c, on which the
          claimed ceiling must vanish (collapse >= 2^{s-1}).
        - >-
          BRUTE-FORCE ORACLE at s <= 4 for solution-set equality.
        - >-
          BIVARIATE-RESIDUAL CONTROL for claim (B).
        - >-
          SEED AND MACHINE-DRIFT CONTROL: spread reported before deviations.
      required_metrics:
        - instrumented_leaf_or_node_count per arm
        - solver_conflicts, solver_decisions, propagations
        - refutation_depth_histogram
        - theory_check_count and theory_check_time (FF)
        - propagator_invocations and children_per_invocation (UP)
        - wall_clock_seconds with pinned solver version, commit, hardware, seed
        - peak_rss_mb
        - termination_reason (completed | timeout | memory_abort | crash | unbuildable)
        - certificate_verified (independent point arithmetic)
        - p, curve_id, m, s, seed, target_kind, arm, null_tier
    falsification_conditions:
      - >-
        F1. bv_leaf_ratio outside [0.90, 1.10] at a cell with a terminated
        search: (A) is false for (BV); restated with the measured pruning
        fraction and the depth at which it occurs.
      - >-
        F2. ff_check_ratio < 0.5: the theory solver prunes above the last
        block; claim (B)'s Groebner half is false and the theory's mechanism
        is exhibited on the cell.
      - >-
        F3. up_node_ratio outside [0.95, 1.05] or children > 2^{m-1}: the
        propagator is not the analysed algorithm; no tier conclusion.
      - >-
        F4. The known-false object does not collapse: instrument failure; no
        result in either direction.
      - >-
        F5. null_ratio <= 0.90: curve-specific structure exists in the
        prime-field search; the localising ladder of b40e6d is run over F_p.
