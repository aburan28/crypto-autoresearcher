    heuristic_assumptions:
      - id: H1
        statement: >-
          CIRCUIT-BACKDOOR CEILING. For the bit-blasted digit pdp at arity m
          and s digits under the block digit order, the probability that unit
          propagation from a uniformly random depth-d partial assignment
          (d < ms) yields a conflict is at most C 2^{-(ms-d)} with C <= 4,
          uniformly over p in [2^12, 2^32] and curves with j not in {0, 1728}.
        rigorous_support: >-
          RIGOROUS HALF: full-input propagation of Tseitin circuits fixes the
          tree height at ms, giving the upper bound 2^{ms}/m!. IMITATED LAW:
          equidistribution of S_{m+1}(x) mod p over a box - the Weil bound for
          complete character sums, vacuous on short intervals, so the
          distributional half is carried by measurement (as in 84cdb7's H2).
        validation_plan: >-
          SAMPLE the refutation-depth histogram at m = 3, s in {5..8} on UNSAT
          runs; SHORTCUT: propagation-only probes on 10^6 random prefixes per
          depth reach s = 16 and p = 2^32 at O(10^6) propagations; COMPARE the
          empirical conflict rate at depth d against C 2^{-(ms-d)}; TAIL: the
          shallowest conflict observed per cell against its predicted
          probability. Sampled parameters recorded: (p, curve, m, s, seed).
          TRANSFER: uniform prefixes stand in for solver-visited prefixes, a
          different distribution, not modelled.
      - id: H2
        statement: >-
          ROOT-INTERVAL EQUIDISTRIBUTION. For m-1 uniformly random interval
          x-coordinates and a random rational target, each of the at most
          2^{m-1} roots of the residual lies in [0, 2^s) with probability
          2^s/p (1 + o(1)), independently.
        rigorous_support: >-
          RIGOROUS HALF: complete splitting with at most 2^{m-1} roots
          (KN-FIND-a8990a Theorem C, derivation). IMITATED LAW: uniform
          distribution of x(+-P_1 ... +-R) in F_p, the standard random-point
          heuristic; failure mode: additive structure of the interval
          concentrating sums (KN-FIND-007's warning).
        validation_plan: >-
          Exhaustive over all (m-1)-tuples at p <= 2^16, s <= 6; compare the
          hit fraction against 2^{m-1} 2^s/p; TAIL: the maximum number of
          in-interval roots any tuple admits versus the binomial tail.
      - id: H3
        statement: >-
          GROEBNER-THEORY COST. A theory check that derives only ideal-
          membership consequences of the residual with j >= 1 free digit
          blocks costs at least 2^{s}/poly(s) field operations under the
          semi-regular null of da1428 at membership degree 2.
        rigorous_support: >-
          RIGOROUS HALF: e1e38b's derived first fall m 2^{m-1} + s/2 for one
          free block (with H-TOP), giving Macaulay column count at least
          binom(s, s/2). IMITATED LAW: Bardet-Faugere-Salvy semi-regularity for
          the residual. The specific procedure inside cvc5 is unknown (abstract
          only) - the assumption is measured, not asserted.
        validation_plan: >-
          Measure theory-check time versus j at s in {5,6,7} on (FF); compare
          against 2^s and against binom(s, s/2)^omega; TAIL: the cheapest check
          with a free block, exhibited.
