ideas:
  - id: IDEA-20260905-24d827
    title: >-
      The prime-field analogue of the SATIC ceiling - a bit-blasted or
      Groebner-theory CDCL(T) search on the digit-presented decomposition
      system visits (1 +- eps) 2^{ms}/m! leaves, a root-finding user
      propagator on the last digit block collapses that to 2^{(m-1)s} 2^{m-1}/(m-1)!
      exactly, and no Groebner-type theory reasoning prunes above depth (m-1)s
    class: control
    pipeline_stage: decomposition
    target_kind: >-
      exponent (a CEILING analogue: the record predicts which search exponent
      each SMT encoding attains on the prime-field pdp, with the honest
      enumeration bound as the floor; no exponent below the enumeration bound
      is claimed)
    claim: >-
      SCOPE: ordinary prime-field short-Weierstrass curves, p in 2^12..2^32,
      decomposition arity m in {2,3}, the base-2 digit presentation of
      IDEA-20260830-84cdb7 with s digits per unknown (2^s <= p, interval factor
      base V = {x in [0,2^s): f(x) a square}), and three constraint encodings:
      (BV) bit-blasted F_p arithmetic over the ms digit bits, run on cadical and
      kissat; (FF) a finite-field SMT theory with the interval expressed by the
      digit constraints a(a-1)=0 (cvc5's prime-field theory, eprint 2023/091,
      once built); (UP) a CaDiCaL IPASIR-UP user propagator that, whenever
      m-1 digit blocks are fully assigned, root-finds the residual univariate
      S_{m+1}(x_1..x_{m-1}, x_R, T) over F_p and forces the last block to one of
      its at most 2^{m-1} interval roots. CLAIM TIER toy. NO ATTACK, NO
      EXPONENT BELOW THE ENUMERATION BOUND, NO TRANSFER TO CRYPTOGRAPHIC p.
      (A) THE PRIME-FIELD CEILING, STATED AS THE FALSIFIABLE PREDICTION. On
      UNSATISFIABLE instances the complete search of (BV) with the block digit
      order and the lexicographic m! symmetry pruning of the frozen source's
      Algorithm 1 (which transfers verbatim, the digit blocks being ordered bit
      vectors) visits N_leaf = (1 +- eps) 2^{ms}/m! leaves, eps <= 0.10 - wider
      than the binary band of IDEA-20260904-3c7a91 because carry chains
      propagate partially. (FF) visits the same number of theory checks to
      within a factor 2, because a Groebner-type theory check on a residual
      with j >= 1 free digit blocks costs at least the enumeration of that
      block under the semi-regular null of IDEA-20260808-da1428, so the theory
      solver cannot refute a residual with a free block cheaper than the
      search does. (UP) visits exactly 2^{(m-1)s}/(m-1)! (1 + O(2^{-s})) nodes
      at depth (m-1)s and at most 2^{m-1} children each, i.e. it REALISES the
      (m-1)-fold-loop-plus-root-finding baseline of IDEA-20260904-96c4f3 and
      IDEA-20260808-da1428 inside a SAT solver. The bits are therefore
      ms - log2 m! for (BV) and (FF), and (m-1)s + (m-1) - log2 (m-1)! for (UP),
      a factor 2^{s-m+1}/m in leaves (21.3x at s = 8, m = 3).
      (B) THE NO-ABOVE-(m-1)s CLAIM. No arm - including (UP) invoked with two
      free blocks and a bivariate residual - reduces the node count below
      2^{(m-1)s}/(m-1)! by more than a factor 2 at any tested cell. This is
      da1428's hybrid verdict (each retained algebraic variable costs more than
      guessing it) restated for CDCL(T) theory checks, and it is the
      prime-field statement that the Coordinator's direction (1) asked for.
      (C) WHAT EACH OUTCOME MEANS. (A) and (B) holding: the prime-field pdp
      has a ceiling analogue and the only exponent-bearing lever available to
      constraint technology is the root-finding propagator, which merely
      matches the known baseline; SMT changes the encoding constant, not the
      exponent. (A) failing on (BV) by more than 20 percent: bit-level
      propagation through modular arithmetic prunes, and the depth histogram
      localises where. (FF) beating (BV) by more than 2x in theory checks:
      the Groebner theory solver prunes above the last block, contradicting
      da1428 on this presentation - the most valuable outcome. (B) failing:
      a bivariate residual is refuted cheaper than enumerating a block, the
      SDEG lane's hybrid boundary moves, and the mechanism must be exhibited.
    mechanism: >-
      TRACKED OBJECT AND LOSSY-PROJECTION TEST. The object is the
      DEPTH-INDEXED REFUTATION COUNT: for each depth d in the block digit order
      (0..ms) the number of search nodes at depth d that are refuted without
      further branching, by unit propagation (BV), by a theory conflict (FF)
      or by the propagator (UP). It is lossy - it discards which digits were
      assigned and which residual polynomial was refuted, collapsing 2^d nodes
      to one integer per depth - and the discarding is compatible with the
      solver's operations, because decide/backjump act on depth deterministically
      and a refutation event is a function of the node's residual, so the
      retained histogram propagates without reference to the discarded
      identity. The projection that fails the test and is not the object: the
      trail restricted to digit bits, which by the circuit-backdoor property
      below determines every other variable and is a change of coordinates.
      WHY THE DIGIT BITS ARE A BACKDOOR IN EVERY ARM. In (BV) the F_p
      evaluation of S_{m+1} is a Tseitin-encoded arithmetic circuit; assigning
      all inputs propagates every gate output by unit propagation (the
      standard full-input property of Tseitin encodings), so the tree height
      is ms exactly as Proposition 1 of SRC-SATIC-TRIMOSKA-2019 fixes ml in the
      binary model. In (FF) the digit constraints a(a-1)=0 plus the linear
      forms x_k = sum 2^i a_{k,i} make every theory atom ground once the
      digits are assigned. In (UP) the propagator is only ever consulted with
      the residual's free variables at most one block.
      WHY ABOVE-LEAF PRUNING IS PREDICTED ABSENT IN (BV). A modular
      multiplier's output bits are not determined by a partial input
      assignment, and the only constraint carrying the curve is "output = 0
      mod p"; a conflict needs all output bits determined, which needs all ms
      inputs. Residual pruning comes from carry chains whose low bits are
      determined early, which is why the predicted band is 10 percent rather
      than 5.
      WHY (FF) CANNOT DO BETTER THAN (BV) UNDER THE NULL. With j free blocks
      the theory residual is a system in js Boolean-valued field variables
      with one summation generator; IDEA-20260903-e1e38b derives its first
      fall at m 2^{m-1} + s/2 and da1428 shows that under the semi-regular
      null the Macaulay cost of the residual exceeds 2^{s} per retained block.
      A theory solver that only derives Groebner consequences therefore pays
      at least the block's enumeration per refutation, and the search does
      the enumeration anyway.
      WHY (UP) COLLAPSES EXACTLY ONE BLOCK AND NO MORE. Given m-1 rational
      x-coordinates and x_R, S_{m+1} in the last variable splits completely
      over F_p with at most 2^{m-1} roots (KN-FIND-a8990a Theorem C, a
      derivation-level internal result), each testable for interval
      membership in O(1); so the last block costs poly(log p) instead of 2^s.
      With two free blocks the residual is bivariate and there is no
      root-finding analogue - that is exactly the boundary da1428 draws.
      This record does NOT restate IDEA-20260904-3c7a91: it changes the field,
      the backdoor mechanism (arithmetic circuit versus XOR substitution), and
      adds the two-tier prediction that separates encodings which cannot
      root-find from the one that can.
    question_id: RQ-ECDLP-f0a7b0
    question_ids: [RQ-ECDLP-f0a7b0, RQ-ECDLP-002, RQ-SATIC-1ae57a, RQ-SDEG-001]
    goal_ids: [GOAL-ECDLP-001, GOAL-SDEG-001, GOAL-SATIC-c49b77]
    goal_applicability:
      GOAL-ECDLP-001: >-
        Supplies the prime-field decomposition-cost ceiling that any SAT/SMT
        route to a prime-field ECDLP cost reduction must beat, priced in bits.
      GOAL-SDEG-001: >-
        Restates the hybrid boundary of IDEA-20260808-da1428 as a CDCL(T)
        measurement and supplies the root-finding propagator as the executable
        form of the enumerative leaf that lane charges.
      GOAL-SATIC-c49b77: >-
        Extends that campaign's binary toy SAT/UNSAT benchmark discipline
        (encoding soundness, SAT witness checks, matched nulls) to a prime-
        field instance family, so the ceiling question can be answered on
        both sides of the field boundary the SATIC question forbids transfer
        across.
