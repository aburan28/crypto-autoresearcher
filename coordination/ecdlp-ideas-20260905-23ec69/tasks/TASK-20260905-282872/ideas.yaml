  - id: IDEA-20260905-3993c3
    title: >-
      Projected model counting for coverage is dominated by loop-sampling by at
      least the number of hashed SAT calls - each hashed call on the free-target
      formula is predicted to cost at least the ceiling because XOR hashes over
      target bits are inert until the leaves - while the unprojected count is
      fixed exactly by conservation and serves as the counter's built-in
      calibrator
    class: control
    pipeline_stage: yield measurement
    target_kind: certifiability and measurement fidelity (predicted negative on cost)
    claim: >-
      SCOPE: binary symmetrized pdp with the target as n free variables
      (as in IDEA-20260905-79112a), m = 3, l in 4..6, n = 3l-1; an approximate
      counter with PAC guarantees (ApproxMC-style, XOR-hashing, to be built)
      projected onto the r-bits; exact enumeration as ground truth. CLAIM TIER
      toy. NO ATTACK.
      (A) THE QUANTITY. The projected count |{x_R : some m-multiset of factor-
      base x-coordinates has x(+-P_1 .. +-P_m) = x_R}| is the coverage numerator
      RQ-RELN-001 needs and KN-FIND-007 leaves free; the unprojected count is
      sum over admissible multisets of the number of distinct signed-sum
      x-values, an exact quantity from enumeration.
      (B) THE COST PREDICTION. Each hashed SAT call with k XOR constraints over
      the r-bits has conflict count >= 2^{ml}/|G| x (1 - eps) for every k,
      because the r-bits are determined only after all core variables and
      the hash rows are therefore never unit above the leaves; so the
      counter's total cost is (number of calls) x ceiling, at least 10^2 x
      the exact enumeration 2^{ml} 2^{m-1}/m! and at least 10^3 x loop-sampling
      of coverage at binomial error. (C) OUTCOMES. (B) holding: model counting
      is a (c)-class tooling result at best and is filed as a priced negative;
      the coverage curve is delivered by enumeration with the conservation
      identity as an exact check. (B) failing (a hashed call cheaper than the
      ceiling by >= 2^{-k/2}): XOR constraints over target bits prune, a
      constraint type outside the null ladder's scope, and the mechanism is
      exhibited.
    mechanism: >-
      TRACKED OBJECT AND LOSSY-PROJECTION TEST. The object is the HASH-LEVEL
      COST CURVE k -> N_conf(k): lossy (one integer per k), compatible (each
      hashed formula is solved by the same complete search, so the curve is
      determined by the propagation behaviour of hash rows at each depth).
      WHY HASH ROWS ARE INERT. A random XOR over r-bits becomes unit only when
      all but one r-bit is determined; r-bits are decided last (or, if decided
      first, they leave the core search untouched), so hash rows fire only at
      the leaves - the same depth argument as 3c7a91 applied to a new
      constraint type, which is why this record is a control rather than a
      restatement: it extends the ceiling's scope to hashed formulas and
      prices a tool the Coordinator asked about. WHY CONSERVATION CALIBRATES.
      The unprojected count is known exactly, so a PAC counter's (epsilon,
      delta) claim is testable on a known answer before the projected count
      is trusted.
