    novelty_screen: >-
      search_knowledge (crypto-kb) was NOT available to this task; screening
      used Grep over ledger/proposals, ledger/hypotheses and knowledge/ for
      bit-vector, QF_BV, SMT, cvc5, QF_FF, MaxSAT, pseudo-Boolean, CDCL(T),
      group-law propagator, and full reads of the eleven prior-art records
      named in the handoff. NEAREST INTERNAL RECORDS AND EXACT DIFFERENCES:
      IDEA-20260904-3c7a91 (binary CNF-XOR ceiling ml - log2|G|, off-limits as
      mechanism) - this record builds on its leaf-count law but changes the
      field, the backdoor mechanism (Tseitin arithmetic circuit rather than
      monomial substitution) and predicts a second, lower tier reachable by a
      propagator; IDEA-20260830-84cdb7 (digit presentation, Groebner first-fall
      ladder) - this record uses the same presentation but measures a search
      count under three constraint encodings, never a Macaulay degree;
      IDEA-20260808-da1428 (hybrid optimum is full guessing) - this record is
      its CDCL(T) form: claim (B) is da1428's inequality tested as a theory-
      check count; IDEA-20260904-96c4f3 ((m-1)-fold loop) - arm (UP) is that
      loop realised as a propagator, and its exact node count is the record's
      floor, not its claim. KN-TECH-076 (MILP/SAT/SMT/CP search hygiene) supplies
      the reporting discipline, not the mechanism. GOAL-SATIC-c49b77 /
      BATCH-1a527c (read: the goal record, contracts/design-intake.json and
      launch.md; its intake.md and benchmark-obligations.json are declared
      artifacts not present in the tree at task time) builds generic Boolean
      readiness on three frozen tiny DIMACS fixtures and an obligation
      inventory for the five binary proposals - binary field only, no
      prime-field instance, no SMT theory, no propagator; this record is
      the prime-field sibling of that package. No internal record encodes
      the prime-field pdp for a SAT or SMT solver. EXTERNAL: eprint 2023/091
      (cvc5 finite-field theory) and arXiv:2407.21169 (SMT-LIB FFA theory)
      abstract pages were retrieved; neither mentions elliptic-curve
      decomposition. Absence of hits is a floor, not novelty evidence; status
      stays unverified.
