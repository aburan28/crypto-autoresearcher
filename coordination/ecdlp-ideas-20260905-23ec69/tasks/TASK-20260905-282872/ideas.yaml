      time_exponent: >-
        NO EXPONENT IMPROVED. Predicted tiers: (BV) and (FF) at ms - log2 m!
        bits (the prime-field SATIC analogue); (UP) at (m-1)s + (m-1) - log2 (m-1)!
        bits, equal to the enumeration bound of IDEA-20260904-96c4f3 in its
        prime-field form and to da1428's k = m-1 leaf. Groebner baseline: under
        the null, cost exceeding enumeration per retained block (da1428),
