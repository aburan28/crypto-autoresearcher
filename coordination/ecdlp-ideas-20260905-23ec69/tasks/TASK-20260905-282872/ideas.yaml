        parameter_slice: >-
          l = 3, m = 3, n = 8: both certificates are computable exactly (leaf
          count 512/6, Macaulay columns Ncols(9, D) <= 512) and the proof can
          be checked by a hand-written checker as well as by drat-trim.
        reproduction_check: >-
          Frozen fixture: L_res versus the instrumented leaf count and versus
          2^{ml}/|G| at l in {3,4,5}; D_NS at l = 3 recomputed by two
          independent rank implementations (peel_and_rank and Sage) with exact
          agreement required.
      observation_collision:
        observable: The pair (L_res, D_NS) of one UNSAT instance.
        distinct_preimage_search: >-
          PREDICTED COLLISION on the leaf axis with the N0 shape-matched null
          (b40e6d ladder): identical L_res. The D_NS axis is where a
          non-collision is possible - the real system may have smaller D_NS
          than N0 (that is what KN-FIND-006's non-generic syzygies would
          predict) - and the record pre-registers that this is the only axis on
          which curve content could appear. A collision on BOTH axes with N0
          means neither certificate sees the curve.
      constructive_transforms:
