    question_ids: [RQ-ECDLP-f0a7b0, RQ-ECDLP-002, RQ-SATIC-1ae57a, RQ-RELN-001]
    goal_ids: [GOAL-ECDLP-001, GOAL-RELN-001, GOAL-SATIC-c49b77]
    goal_applicability:
