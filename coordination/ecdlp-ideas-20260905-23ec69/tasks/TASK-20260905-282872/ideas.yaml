  - id: IDEA-20260905-3de445
    title: >-
      Learned clauses are elements of the elimination ideal - the block-support
      profile of every clause a CDCL solver derives on the pdp is predicted to
      be FULL (all m blocks), the Macaulay degree at which the elimination
      ideal I intersect F_2[blocks 1..m-1] first shows a low-degree element is
      predicted above every tested degree, and either fact failing is
      above-leaf pruning with a named algebraic source
    class: mechanism
    pipeline_stage: decomposition (and the Groebner/algebraic step)
    target_kind: >-
      exponent (a bridge between CDCL learning and elimination-ideal degree
      falls; the pre-registered expectation is zero pruning, so the honest
      target is the obstruction measurement)
    claim: >-
      SCOPE: symmetrized and direct binary pdp systems (m = 3, l in 4..8) in
      the plain CNF model on cadical and kissat, plus the direct ANF system for
      the algebraic arm; the d = 2 digit-presented prime-field system at
      m in {2,3}, s <= 6 as the prime-field arm. CLAIM TIER toy. NO ATTACK.
      (A) BLOCK SUPPORT. Map every model variable to its block support: c_{i,j}
      to {i}; a substituted monomial variable to the set of blocks of its
      factors; d_{i,j} and d' variables and XOR-cut auxiliaries containing
      them to the full set [m]. The block support of a clause is the union
      over its literals. PREDICTION: on UNSAT instances, among all clauses a
      CDCL solver learns (read off the LRAT/DRAT trace), the number whose
      block support omits at least one block AND whose length is below
      ml - l is 0, at every cell, seed and solver, apart from any explicit
      symmetry-breaking clauses if added. Learned clauses with full support
      may be numerous; they are leaf negations and prune nothing.
      (B) ELIMINATION DEGREE. For the direct ANF system F in the ml core
      variables define D_elim(k, e) as the least Macaulay degree D at which
      the degree-D row space (multiples of the f_i by monomials, reduced
      modulo the field equations) contains a nonzero polynomial of degree
      <= e supported on blocks 1..k only. PREDICTION: D_elim(m-1, e) exceeds
      the largest degree computable within the memory contract (D = 8 at
      l = 5, D = 7 at l = 6) for every e <= 3, on real instances and on the
      shape-matched null alike, i.e. no low-degree element of the elimination
      ideal is reachable at low Macaulay degree - even though such elements
      EXIST: the set of (x_1..x_{m-1}) tuples extending to a solution has
      about 2^{(m-1)l} 2^{m-1} 2^{l-n} members (about 8 at n = 3l-1), so its
      vanishing ideal contains affine polynomials by dimension count. The gap
      between existence (degree 1) and derivability (D_elim) is the record's
      obstruction measurement.
      (C) THE BRIDGE. A learned clause with support in blocks 1..m-1 is, as a
      polynomial, an element of the elimination ideal; resolution derives it
      only if a bounded-width derivation exists, and Macaulay derives it only
      at degree D_elim. (A) and (B) are the same statement measured on the two
      sides, and this is the CDCL-to-first-fall bridge the Coordinator's
      direction (7) asked for. If (A) fails, the offending clause is exhibited,
      its polynomial is checked for membership at every D, and its derivation
      depth names the algebraic source; if (B) fails, the low-degree
      elimination element is exhibited and a propagator that uses it is the
      immediate algorithmic consequence. If both hold, the closure meets the
      inventor-protocol section-4 standard with D_elim as the measured
      obstruction.
    mechanism: >-
      TRACKED OBJECT AND LOSSY-PROJECTION TEST. The object is the BLOCK-SUPPORT
      HISTOGRAM of the learned-clause database: for each subset S of [m] and
      each clause length, the number of learned clauses with support exactly
      S. It is lossy - literal identities, polarities and the clause order are
      discarded; the fibre over a histogram is astronomically large. It is
      compatible with the target's operations because resolution on a pivot
      produces a clause whose support is the union of the parents' supports
      minus nothing (support is monotone under resolution and union under
      conflict analysis), so the retained datum propagates deterministically
      under the solver's one derivation rule. The projection that fails the
      test: the clause database itself (a change of coordinates on the proof).
      WHY FULL SUPPORT IS PREDICTED. Every clause carrying the curve (the
      F set) has full support, because d_{1,j} = c_{1,j} + ... + c_{m,j}
      touches all blocks (equation (6) of the source) and every substituted
      monomial of degree >= 2 spans at least two blocks (IDEA-20260904-e12b5a's
      A1-A3, cited for the structural fact, not its GE conclusion). Resolution
      can shrink support only by resolving away all literals of some block,
      which needs a clause set that is unsatisfiable when restricted to the
      other blocks - exactly a refutation of the elimination-ideal statement.
      Under the no-above-leaf-pruning mechanism no such refutation is found
      because every conflict occurs with all blocks assigned.
      WHY EXISTENCE AND DERIVABILITY DIFFER. The vanishing ideal of a small
      point set has low-degree generators (dimension counting), but the
      Macaulay row space at degree D contains only degree-D consequences of
      the generators; that an ideal element of degree 1 appears only at a
      high D is the ordinary last-fall-degree phenomenon (KN-LIT-7607 as read
      in IDEA-20260830-84cdb7), here localised to the elimination ideal, which
      is the sub-ideal that a block-ordered search could actually use.
      DIFFERENCE FROM THE OFF-LIMITS RECORDS. 3c7a91 tracks conflict DEPTH;
      7fd218 toggles learning on and off and predicts 0 bits; e12b5a tracks
      the XOR-row linear deficit. None of them looks at WHAT is learned. This
      record's object is the support of the learned clauses and its algebraic
      twin, and it is runnable on cadical/kissat today with no XOR module.
    question_id: RQ-ECDLP-f0a7b0
    question_ids: [RQ-ECDLP-f0a7b0, RQ-ECDLP-002, RQ-SATIC-1ae57a, RQ-SDEG-001]
    goal_ids: [GOAL-ECDLP-001, GOAL-DREG-001, GOAL-SDEG-001, GOAL-SATIC-c49b77]
