  per_proposal:

    IDEA-20260905-d0fee4:
      set: representation
      record_own_claim_tag: 'Kummer line Bezout-optimal among all coordinates E -> P^1; (C1) size law, (C2) degree law, (C3) corollary, (C4) y-witness'
      J1:
        verdict: holds
        attack: |-
          Read IDEA-20260808-2e14f7 and IDEA-20260807-dadcd2 in full and wrote the two tracked objects
          side by side. Tested whether a renaming maps d0fee4 onto either. Then searched for nearer
          records the screen omits, including the unapproved draft contracts under experiments/.
        result: |-
          No renaming map exists. dadcd2 (L3) asserts that a degree-d membership polynomial in the
          coordinate f names B = g*d rational points; d0fee4 (C1) asserts a window of B values contains
          about B points for EVERY n. These are different numbers, not different notation: (L3) is the
          count for a window adaptively hitting non-empty fibres, (C1) is the count for an oblivious
          window, and (C1) is the correct one for the interval/window bases the lane actually uses.
          The mechanism is therefore distinct. TWO NEAREST RECORDS ARE UNNAMED, both unapproved drafts:
          EXP-MODEL-1554cd (derived_from_idea IDEA-20260807-dadcd2, status draft, approved_by null)
          already runs the same rationality argument in its clause (E) to kill the isogeny-pullback
          candidate ("the geometric fibre {+-P + jT} has 2ell elements but only {+-P} are rational.
          Hence B = 2d, not 2ell*d"), and EXP-MODEL-5c4f24 (derived_from_idea IDEA-20260807-5f5ace)
          is a frozen-in-draft contract to MEASURE exactly d0fee4's Stage-1 and Stage-2 quantities.
          Distinctness holds; screen completeness does not.
      J2:
        verdict: holds
        attack: |-
          Lossy-projection / object-frame audit. Exhibited the fibre (position of P within its f-fibre,
          up to n points) and asked for the one-step propagation rule under the declared Sigma
          (translation by factor-base elements, m-fold relation). Tested for the KN-LIT-7595 (Delta, Pi)
          failure, i.e. whether {x, discarded data} is recoverable from the retained data.
        result: |-
          Not a change of coordinates: the f-value does not determine the point for n >= 2, and the
          record declares clause two FAILS with a quantified branching bound n^{m-2} rather than
          claiming deterministic propagation. That is the admissible "branching object with a stated
          bound" of docs/object-frame-ideation.md section 3, and the bound is verified below in J3 for
          the Galois case. The audit is present, honest and correctly classified (Class I,
          partial-action). One recorded caveat, filed as an objection rather than a break: the
          genericity input for the branching bound is imported from a degree-2 Galois setting.
      J3:
        verdict: breaks
        attack: |-
          Recomputed (C2) and (C3) by hand and checked the record's own baseline_embedding claim that
          the n = 2 row "reproduces KN-TECH-002 and dadcd2 with g = 2". Recomputed the predicted y/x
          Bezout ratio under each membership convention available in the corpus.
        result: |-
          (C2) is CORRECT and reproduces the known value: n^{m-2} at n = 2 gives 2^{m-2} for
          m = 3,4,5,6 (2,4,8,16), matching KN-FIND-a8990a deg_T S_m = 2^{m-2}. (C1) is CORRECT as an
          exact double count. BUT THE BASELINE EMBEDDING IS FALSE AS STATED. dadcd2 (L4) gives Bezout
          B^{m-1}/g at fixed rational base size B; d0fee4 (C3) gives n^{m-2} B^{m-1}. At n = 2, m = 3,
          B = 1024 these are 524288 and 2097152 -- a factor 4, and 2^{m-1} in general. The two cannot
          both hold because they use different membership conventions (tight polynomial of degree B/g
          versus oblivious window of degree B), and (C1) is precisely what forbids the first. The
          record changes the accounting currency and simultaneously claims to reproduce the baseline
          computed in the old currency. CONSEQUENCE THAT MATTERS MORE: at fixed rational base size B,
          m = 3, the predicted y/x Bezout ratio is 4.5 under d0fee4's convention and EXACTLY 2.0 under
          the convention of IDEA-20260807-5f5ace clause (C) and its draft contract EXP-MODEL-5c4f24
          ("predicts a Bezout ratio of exactly 2 at fixed factor-base size"). Both are committed point
          predictions for the same physical measurement on the same kind of object (a degree-3
          non-Galois coordinate against a degree-2 one), they differ by 2.25, and neither record cites
          the other on this point. d0fee4 adopts 5f5ace's degree 9 while silently rejecting 5f5ace's
          density accounting. Additionally (C3) mixes quantities: it is stated with the LOWER bound
          n^{m-2} while the y-prediction uses the exact non-Galois value 3^{m-1} = 9; the "minimised
          at 2^{m-2}" conclusion survives, the stated corollary does not carry the number the
          prediction uses. Finally the adaptive-window escape is named but its membership-predicate
          cost is asserted ("at the price of an extra membership predicate") and never charged.
      J4:
        verdict: holds
        attack: |-
          Listed the frontier rows the record names, added rho with distinguished points, BSGS,
          automorphism-discounted rho, kangaroo, Pohlig-Hellman, generic preprocessing S*T^2 = N and
          PKM/Semaev prime-field decomposition, and checked dominance on time, memory and data/queries
          separately.
        result: |-
          dominated_by is filled row by row and explicitly says the record is dominated on every axis
          by every row because no attack is mounted; sota_delta is quantitative and honest
          ("0.000 bits on any attack exponent"). The added rows change nothing because no cost claim is
          made. No unchecked null. This is a correct Pareto block.
      J5:
        verdict: holds
        attack: |-
          Named the artifact the record is exposed to (a counter that cannot see fibre multiplicity
          would report ratio 1 for every coordinate and manufacture the record's own conclusion) and
          asked whether the declared controls would reproduce the predicted signal if the artifact were
          the whole story. Asked what parameter should destroy the signal.
        result: |-
          The known-false object is genuinely inconvenient and is the right one: an ADAPTIVE window
          W_f = {t : #f^{-1}(t)(F_p) = n} on which (C1) must FAIL by construction with ratio about 3.
          A counter returning 1 there is blind and Stage 1 is void -- the record says so. The PGL_2
          battery, the translation-conjugate null, the matched random curve and the relabelled-Z/nZ
          generic-group control are all declared. Decay parameters are named on the fluctuation axis
          (B, via 1 +- 3/sqrt(B), and p). GAP: no decay parameter is named for (C2)/(C3); the degree
          claim has no stated behaviour as n or m grows beyond the closed forms, so a wrong degree
          measurement has no scaling signature to be caught by.
      J6:
        verdict: breaks
        attack: |-
          Located every load-bearing citation. Classical items (Hasse-Weil, Chebotarev for function
          fields, Burnside) checked for role; Kohel arXiv:1005.3623 checked against the record's own
          disclaimer; the internal citation KN-FIND-a8990a read in full and compared with the use made
          of it in (C2).
        result: |-
          The classical recalled items are used only inside H1's justification and are correctly marked
          as pointers; Kohel is correctly said to support nothing. THE DELTA IS INTERNAL. (C2) cites
          "KN-FIND-a8990a Theorem A step 3" for the claim that the n^{m-1} preimage choices give
          pairwise distinct sums for generic t. KN-FIND-a8990a's Theorem A is proved from exactly two
          properties of the map, quoted there as (P1) "pi is finite separable of DEGREE 2 and K(E)/K(x)
          is Galois with group generated by inversion" and (P2) "inversion is not the identity"; its
          step 3 argues that a coincidence forces sum_{i in S} eps_i P_i in E[2], which is the sign
          structure of the degree-2 cover. For a general degree-n, possibly non-Galois f the
          corresponding statement is about differences of fibre points and is NOT established by that
          step. The cited source does not say what (C2) uses it to say outside n = 2. The conclusion is
          plausible and probably repairable by a direct argument; as filed, the branching bound's
          genericity input is uncited.
      objections:
      - 'BASELINE-EMBEDDING CONTRADICTION (J3): the n = 2 row does not reproduce dadcd2 (L4); it differs by 2^{m-1} because (C1) changed the membership convention.'
      - 'UNDECLARED CURRENCY: (C3) compares coordinates at equal WINDOW size while the corpus baseline compares at equal rational base size with a tight membership polynomial. The comparison is legitimate but the convention is never declared, and it is what produces the headline 4.5.'
      - 'CONTRADICTORY COMMITTED PREDICTION: d0fee4 predicts Bezout ratio 4.5 where IDEA-20260807-5f5ace (C) and its draft contract EXP-MODEL-5c4f24 predict EXACTLY 2 for the same comparison. Neither cites the other.'
      - 'OMITTED NEAREST RECORDS: EXP-MODEL-1554cd (E) already runs the rationality argument that refutes the d-fold free lunch for the isogeny-pullback case; EXP-MODEL-5c4f24 already specifies the measurement. Both are unapproved drafts, both are in experiments/, neither is in the novelty_screen.'
      - '(C2) GENERICITY INPUT UNCITED for n > 2 (J6).'
      - 'UNCHARGED ESCAPE: the adaptive-window escape is priced in words ("an extra membership predicate") and not in operations, although it is the one route by which (C1) fails.'
      required_controls:
      - 'Declare the membership convention BEFORE Stage 1 and pre-register BOTH predicted ratios (2.0 tight-membership, 4.5 oblivious-window) so the measurement discriminates rather than confirms.'
      - 'Keep the adaptive-window known-false object exactly as specified; it is the control that makes the null readable.'
      - 'Add a degree-side decay check: measure deg_t S_m^f for f in {x, y, r o x} at m = 3 and m = 4 and check the predicted growth in n and m, so a wrong degree has a scaling signature.'
      counterexample_or_mutation: |-
        Mutation that separates the two conventions at zero extra cost: on one toy curve, count (a) the
        number of rational points with f(P) in W for a random window W of size B, and (b) the number of
        DISTINCT f-values in W that carry at least one rational point. Under the Chebotarev model (a)/B
        -> 1 for every n while (b)/B -> 1/2 for x and 2/3 for y. Quantity (b) is the tight membership
        degree and is what dadcd2 (L3) and 5f5ace (C) implicitly use; (a) is what d0fee4 uses. Reporting
        both integers settles the 2-versus-4.5 disagreement in the same loop.
      heuristic_challenges:
      - 'H1 is numbered, formally stated, given a rigorous half (the exact double count) and a classical distribution half (Chebotarev/Burnside), and carries a validation plan with a tail check. This meets the target-profile standard and is the best heuristic block in the representation set.'
      - 'The random-model transfer is NOT free and is not challenged in the record: a factor-base window is a structured, low-height set, and the Weil error term deg(f)*sqrt(p) over the full line is what H1 asks a sub-window of size B in [p^{1/8}, p^{1/2}] to inherit. At the small end of that range the error term is larger than the mean, so H1 is a genuine assumption there and the record should say at which B the Weil bound becomes vacuous.'
      cost_model_challenges:
      - 'The Bezout numbers of (C3) are stated with no membership-convention declaration, which is the whole factor 2^{m-1}.'
      - 'The lifting cost n^{m-1} per solution is disclosed ("disclosed the other way") -- credit; but it is not carried into (C3), so the stated Bezout comparison understates the degree-n penalty.'
      reduction_and_scope_challenges:
      - 'The record extends a lever-1 closure "from five degree-2 models to all coordinate functions". The extension is by argument at derivation tier and is scoped to WINDOW-defined bases on prime-order generic-j curves; interpretation_limits says so. No scope inflation found.'
      - '(C1) is flagged as the one non-toy, scale-free statement. That is correct and correctly limited.'
      proof_architecture_challenges:
      - 'Baseline reproduction (audit 1 of section 8) FAILS as written -- see J3. The parameter slice n = 2 does not return the baseline number.'
      - 'Method ceiling is correctly stated ("never certifies anything about Groebner solving degree, support, mixed volume or non-window bases").'
      - 'Nearby-object control is genuinely inconvenient (adaptive window; x^2 on j = 1728).'
      obstruction_reversals:
      - |-
        The record closes the degree-d coordinate class with the obstruction "average rational fibre
        size is 1 for every n". Reversal: which theory WANTS that measurement? A map whose rational
        fibres are empty 1 - 1/|G| of the time and full otherwise is a Chebotarev sampler: the fibre-
        size histogram of f is a direct read-out of the Frobenius class distribution in the Galois
        closure of f. That is not an ECDLP attack, but it makes the histogram an instrument for
        detecting curves or coordinates with anomalously small Galois closure -- exactly the
        exceptional locus KN-OPEN-009 hunts and KN-FIND-a8990a's Theorem A says does not exist for the
        degree-2 cover. Filed as a finding, not evidence; spawned_id withheld pending Coordinator
        minting.
      narrowest_supported_statement: |-
        For a window W chosen independently of f's fibre structure, the expected number of rational
        points in f^{-1}(W) is |W|*(p+1-a_p)/(p+1) for every F_p-rational non-constant f, by exact
        double count; and for a degree-n coordinate whose fibre sums are generically distinct, the
        per-variable degree of the summation polynomial is at least n^{m-2}, with equality at n = 2.
        Nothing follows about attack exponents, about tight-membership Bezout numbers, or about
        adaptive windows.

    IDEA-20260905-24b41a:
      set: representation
      record_own_claim_tag: 'Nets/cubical/Miller/dual-number lifts are one torsor; (T1) homomorphism, (T2) Hom(Z/N,A) = A[N] = 0, (T3) cross-ratio is a coordinate'
      J1:
        verdict: holds
        attack: |-
          Read IDEA-20260727-005 in full (its (C2) Chevalley-Barsotti exit-map classification) and
          IDEA-20260806-0c9de1 in full (its F1 torsor trivialisation), plus KN-FIND-ffe1df Theorem C,
          EV-NET-001 and EV-JETB-001. Tested whether the record is 727-005 or 0c9de1 renamed.
        result: |-
          Distinct. 727-005 classifies NONTRIVIAL exit maps and excludes the degenerate case by
          hypothesis; this record shows four named R3 constructions ARE exit maps into E1/E2 targets
          and are therefore the trivial homomorphism -- the case 727-005 excludes. 0c9de1's F1
          trivialises a torsor by the existence of a rational point; this record trivialises the torsor
          COORDINATE by coprimality, a different hypothesis covering A = F_p as well as A = F_p^*.
          The stated differences are accurate and change the tracked object.
      J2:
        verdict: breaks
        attack: |-
          Object-frame audit against the declared Sigma (the group law lifted to the torsor, containing
          the FULL translation action). Asked what the natural invariant of the cited construction
          actually is, and whether the record's propagation argument covers it.
        result: |-
          The record's propagation argument is: a group-law-compatible invariant of a torsor over G is a
          1-cocycle of Z/N with values in A, i.e. a HOMOMORPHISM, and Hom(Z/N, A) = A[N] = 0. The
          arithmetic of (T2) is correct: F_p^*[N] = 1 iff N does not divide p - 1 iff k > 1;
          F_p^*/(F_p^*)^N is trivial under the same condition because gcd(N, p-1) = 1 makes N-th
          powering an automorphism; F_p[N] = 0 for N != p, and the Schur-Zassenhaus splitting of
          0 -> F_p -> E(F_p[eps]) -> E(F_p) -> 0 is canonical because the group is abelian. BUT THE
          NATURAL INVARIANT OF A BIEXTENSION/CUBICAL TORSOR IS NOT A HOMOMORPHISM. Robert's cubical
          arithmetic computes pairings as biextension MONODROMY, and the invariant attached to a single
          point R is the Tate SELF-pairing t_N(R, R), which is quadratic: t(aR, aR) = t(R, R)^{a^2}. A
          quadratic map q(a) = c^{a^2} well defined on Z/N needs only c in A[N^2], not A[N], so (T2) as
          stated does not cover the object the cited construction produces. The conclusion survives --
          A[N^2] = 1 under the same k > 1 hypothesis, since gcd(N^2, p-1) = 1 -- so this is a repairable
          gap in the mechanism, not a refutation of the 0-bit conclusion. As filed, the class closure
          rests on a homomorphism argument that misses the quadratic case, and the record's own
          bottleneck field ("whether every k-dependent quantity computable from the torsor is a
          HOMOMORPHISM in R") half-sees this without repairing it.
      J3:
        verdict: holds
        attack: |-
          Recomputed the end-to-end path. Charged evaluation of a net term, cubical point, Miller
          function and dual-number lift; compared against the record's stated overhead.
        result: |-
          Costs are charged at O(log N) field operations per evaluation, the same as a scalar
          multiplication, and the record volunteers EV-NET-001's measured 24-135x sieve/BSGS ratio
          against itself rather than suppressing it. No stage omitted; no cost claim is made that a
          hidden stage could dominate.
      J4:
        verdict: holds
        attack: 'Checked dominated_by against every named row plus rho with distinguished points, BSGS, MOV (k = 1) and Smart (N = p).'
        result: |-
          dominated_by is "n/a (no result claimed)" WITH the row list actually enumerated and with the
          honest addition that as a closure it is dominated in generality by KN-FIND-ffe1df Theorem C,
          IDEA-20260807-df906f and 727-005. sota_delta is quantitative (0.000 bits, 3 classes closed,
          2 gates, 2 known-false controls). Correct.
      J5:
        verdict: holds
        attack: |-
          Asked whether the declared known-false objects are inconvenient or convenient, i.e. whether a
          pipeline that reported "constant" on every object would pass them.
        result: |-
          The two known-false objects are exactly right and are the best pair in the representation set:
          a toy curve with k = 1 (N | p - 1), where t(R) MUST be a non-constant homomorphism (the Tate
          self-pairing), and an anomalous curve with N = p, where the tangent component MUST be
          non-zero (Smart). A pipeline reporting constant there is blind and reports nothing -- stated
          as falsification condition. Stage 4 (rerun EV-NET-001's asymmetry on W and on C separately)
          is a genuine attempt to resolve a live open confound rather than to confirm the record.
      J6:
        verdict: breaks
        attack: |-
          Located the load-bearing recalled reference. Fetched arXiv:0710.1316 (Stange) and checked
          whether the abstract states the quasi-periodicity form (T3) needs; searched for the
          multiplier's functional form; attempted Robert eprint 2024/517.
        result: |-
          Retrieval confirms the record's own disclosure and then goes further against it. The Stange
          abstract is silent on quasi-periodicity, periodicity and the Tate pairing (independently
          confirmed by this reviewer's fetch), so (T3)'s premise remains unlocated. AND THE PREMISE IS
          NOT MERELY UNLOCATED, IT IS INSUFFICIENT AS STATED. The standard quasi-periodicity multiplier
          for theta/EDS-type objects is the exponential of a QUADRATIC form Q in v, not a linear one.
          For a cross-ratio C(v) = W(v+e1)W(v+e4)/(W(v+e2)W(v+e3)) the multiplier's exponent is
          Q(v+e1) + Q(v+e4) - Q(v+e2) - Q(v+e3) = [Q(e1)+Q(e4)-Q(e2)-Q(e3)] + 2B(v, e1+e4-e2-e3). The
          record's declared condition e1 + e4 = e2 + e3 kills only the v-DEPENDENT term; the constant
          bracket survives and is generally non-zero. Explicit admissible choice on which (T3) fails as
          stated: e1 = (2,0), e4 = (0,0), e2 = e3 = (1,0), which satisfies e1 + e4 = e2 + e3 while
          Q(e1) + Q(e4) - 2Q(e2) = 4q - 2q = 2q != 0 for the quadratic coefficient q. (T3) needs the
          SECOND-ORDER balance condition Q(e1) + Q(e4) = Q(e2) + Q(e3) as well, which the record does
          not state. Robert eprint 2024/517 remains unlocated from this container and is recorded as
          unlocated, not as confirmed.
      objections:
      - '(T2) COVERS HOMOMORPHISMS ONLY; the biextension/cubical invariant is the quadratic Tate self-pairing. Repair available and cheap: state the argument for A[N^2] rather than A[N]; the k > 1 hypothesis already gives A[N^2] = 1.'
      - '(T3) IS FALSE AS STATED for admissible cross-ratio indices; it needs the second-order balance condition on the quadratic form, not only e1 + e4 = e2 + e3. Explicit index choice given above.'
      - 'The closure of brief classes (2), (3) and (8) is asserted "by mechanism" while the mechanism as written does not reach the class''s own natural invariant. The narrowed closure below is what the record supports today.'
      required_controls:
      - 'Stage 0 must confirm the multiplier form from the paper BODY (not the abstract) and must record whether the exponent is quadratic; the record already gates on this, and the gate must not be waived if the source stays unreachable.'
      - 'If Stage 0 confirms a quadratic multiplier, re-derive (T3) with the balance condition and re-state the admissible e-tuples before any symbolic run, or the symbolic identity test will fail for a reason that is not about the ECDLP.'
      - 'Retain both known-false objects (k = 1 and N = p) exactly as declared.'
      counterexample_or_mutation: |-
        Zero-compute counterexample to (T3) as written: e1 = (2,0), e4 = (0,0), e2 = e3 = (1,0). These
        satisfy the record's only stated condition and give a non-zero residual quadratic bracket, so
        C(v) is quasi-periodic with a constant multiplier rather than L-periodic. The mutation that
        repairs it is to require Q(e1) + Q(e4) = Q(e2) + Q(e3) as well, e.g. e1 = (1,0), e4 = (0,1),
        e2 = (1,1), e3 = (0,0), and to check the balance symbolically before any numeric run.
      heuristic_challenges:
      - 'heuristic_assumptions is empty, and correctly so: (T2) is elementary group theory, not a distributional heuristic. No unnumbered assumption is smuggled in.'
      - 'The one distributional statement in the record ("the map is expected to be as unstructured as a random function") appears in the neighbouring proposal, not here. Nothing to challenge.'
      cost_model_challenges:
      - 'None material. Costs are disclosed against the record and no saving is claimed.'
      reduction_and_scope_challenges:
      - 'Scope is correctly restricted to k > 1 and N != p, with MOV and Smart named as the boundaries rather than re-derived. No scope inflation.'
      - 'The record explicitly says a forced-zero closure of these four constructions is not a closure of all lifts and names higher jets and non-abelian torsors as open. That is the section-4 forward guidance and it is present.'
      proof_architecture_challenges:
      - 'Observation-fiber attack succeeds in the record''s favour: it predicts and wants the collision (every R shares the torsor coordinate), and names the non-collision worth finding (a residue with smaller fibres than x).'
      - 'Quantifier order is explicit and the at-risk quantifier (over non-homomorphic functions of torsor data) is named. This is the correct place to have put the quadratic gap, and it is where the repair belongs.'
      obstruction_reversals:
      - |-
        Obstruction measured: Hom(Z/N, A) = A[N] = 0, i.e. the torsor coordinate carries exactly 0 bits
        on a standardised curve. Reversal: the theory that takes this as its hypothesis is
        pairing-based CONSTRUCTION rather than cryptanalysis -- the same vanishing is precisely the
        condition under which the Tate pairing is trivial and a curve is unusable for pairing-based
        protocols, so the measurement is a usable non-degeneracy test in the opposite direction (k > 1
        certified by observing a constant torsor coordinate). Modest, and filed as a finding only.
      narrowest_supported_statement: |-
        On a prime-order subgroup with N != p and embedding degree k > 1, every GROUP HOMOMORPHISM from
        G into F_p^*, F_p^*/(F_p^*)^N or F_p is trivial, so any torsor invariant that is homomorphic in
        the point carries 0 bits about k. Nothing is established about quadratic or otherwise
        non-homomorphic torsor statistics, and (T3) is not established at all pending the multiplier
        form and the balance condition.

    IDEA-20260905-579fcc:
      set: representation
      record_own_claim_tag: '(M1) shift-multiset dichotomy, (M2) symmetric case = shifted Kummer, (M3) orbit cost |H|, (M4) generic-group ceiling'
      J1:
        verdict: holds
        attack: 'Read IDEA-20260807-4fc635 in full and IDEA-20260901-863e36''s claim block; tested whether (M1)-(M2) are 4fc635''s NULL-3 renamed.'
        result: |-
          Distinct. 4fc635 declares x_R a null with an exact-equality prediction; 579fcc proves that an
          infinite family of candidate objects COLLAPSES onto that null or onto the identity, which
          converts a control into a classification. The 863e36 diff (adding the affine-involution slice
          to the multiplication slice) is stated and correct.
      J2:
        verdict: holds
        attack: |-
          Re-derived (M1) independently rather than reading the sketch. Multiset equality means a
          bijection sigma of S and signs eps_s with P' + sigma(s)R = eps_s(P + sR). Worked the three
          cases.
        result: |-
          (M1) IS CORRECT and I reproduce it. Mixed signs force 2P = -(s - sigma(s) + s' + sigma(s'))R,
          i.e. P in a set of size O(r^2) -- the record's stated generic exclusion, and 2 is invertible
          because N is odd. All-plus forces sigma(s) = s - d with S - d = S, and for prime N with
          |S| < N the stabiliser is trivial so d = 0 and P' = P. All-minus forces sigma(s) = e - s with
          S = e - S, i.e. central symmetry, and P' = -P - eR. (M2) is also correct: iota(P) = -P - cR is
          an involution, and x_T(P) = x(P - T) is constant on its orbits exactly when 2T = -cR, which
          has a unique solution because N is odd. Two conditions the record uses without stating:
          |S| < N (otherwise M_S is constant) and N odd (used twice, for invertibility of 2). Both
          hold in scope; neither is written down.
      J3:
        verdict: breaks
        attack: |-
          Recomputed (M3)'s end-to-end orbit-walk accounting in the record's own declared unit. The
          record requires metrics "measured in group operations, not wall time" and predicts a net
          constant worse by sqrt(|H|).
        result: |-
          UNIT MISMATCH THAT CHANGES THE STATED CONSTANT. c_can is specified as "|H| scalar
          multiplications per orbit". A scalar multiplication by an element of (Z/N)^* is Theta(log N)
          GROUP OPERATIONS, not one. Rho on the quotient costs about 0.886*sqrt(N/|H|) steps, each
          step c_step + c_can, so in group operations the total is about
          sqrt(N/|H|)*|H|*Theta(log N) = sqrt(N)*sqrt(|H|)*Theta(log N). The record's predicted net
          loss factor sqrt(|H|) is therefore the loss in SCALAR MULTIPLICATIONS, and in the record's own
          declared metric it is sqrt(|H|)*Theta(log N). The conclusion (a loss, not a gain) is
          unaffected and is strengthened; the stated constant is not the one the declared unit measures.
          Separately, "gains sqrt(|H|) in space" is loose: parallel rho is already O(1) memory, so the
          quotient buys step count, not space.
      J4:
        verdict: holds
        attack: 'Checked every named row plus the automorphism-discounted rho baseline that (M3) is really about.'
        result: |-
          dominated_by is "n/a (no result claimed)" with rows enumerated, and it correctly identifies
          automorphism-discounted rho (KN-TECH-018) as the only case where the gain is real. sota_delta
          is quantitative. Correct, and (M3) is honest that it re-derives an existing accounting.
      J5:
        verdict: holds
        attack: 'Asked whether the declared controls separate the two arms of the dichotomy, i.e. whether a meter that always answered "(1,2)" would pass.'
        result: |-
          The known-false pair is correctly chosen and inconvenient: S = {0, c} (symmetric, must give
          (1,2)) versus an asymmetric S OF THE SAME SIZE (must give (0,1)); a meter that cannot separate
          them is declared void. The random-label null and the H = Aut(E) positive control are present.
          Decay parameter |H| is named and swept over {2,3,5,7}.
      J6:
        verdict: breaks
        attack: |-
          Challenged the load-bearing recalled citations by name. Opened KN-FIND-b7e091 and KN-TECH-005
          -- both of which are FILES IN THIS REPOSITORY -- and compared their statements with (M4).
        result: |-
          (M4) is the clause that turns a scoped observation into a closure of brief class (9), and its
          support is marked `recalled` with the explicit note "neither KN-FIND-b7e091 nor KN-TECH-005
          was opened in this task, so this entry is a pointer and supports nothing here". Those are
          in-repo corpus files readable at zero cost. Opening them shows the delta. KN-TECH-005 states
          the Shoup bound for algorithms that treat group elements "as opaque labels accessed only via
          the group-operation oracle" and adds, in its own applicability limits, that the bound "says
          nothing about attacks exploiting concrete structure". KN-FIND-b7e091 closes the INCIDENCE and
          ENDOMORPHISM oracle classes, not multiset statistics. (M4) as written -- "Every function of a
          multiset of x-values under group operations is generic-group simulable" -- is broader than
          either source supports and is false without its own parenthetical restriction ("x used only
          for equality and hashing"): a multiset of x-values as FIELD ELEMENTS supports sums, products
          and character values that no generic simulator can produce. The record does carve out the
          field-structured corner one sentence later, so the scope is recoverable; the sentence that
          does the closing is not.
      objections:
      - '(M4)''s generic-group ceiling is stated as a property of the OBJECT and is only a property of a restricted ALGORITHM CLASS. Its two supports are in-repo records marked `recalled` and not opened, and neither states what (M4) claims.'
      - '(M3)''s predicted constant sqrt(|H|) is quoted in a different unit from the record''s own required metric; in group operations it is sqrt(|H|)*Theta(log N).'
      - '(M1) silently uses |S| < N and N odd. Both hold in scope; both should be in the statement, because |S| = N makes M_S constant and is the degenerate case the dichotomy would misreport.'
      required_controls:
      - 'Before any closure language is used, open KN-FIND-b7e091 and KN-TECH-005 and re-state (M4) in the algorithm class those records actually cover.'
      - 'Report c_can in group operations AND in scalar multiplications, with the log N factor visible, so the predicted constant is checkable in the declared unit.'
      counterexample_or_mutation: |-
        Mutation exposing (M4)'s over-reach at zero compute: replace the multiset M_S(P) by the single
        field element sum_{s in S} chi(x(P + sR)) where chi is the quadratic character. This is "a
        function of a multiset of x-values", it is NOT generic-group simulable (it reads the field), and
        it is exactly the class the record names as its open corner one sentence later. Its existence
        refutes (M4) as literally stated while leaving (M1)-(M3) untouched.
      heuristic_challenges:
      - 'heuristic_assumptions is empty and that is correct for (M1)-(M3): they are theorems and an accounting, not distributional claims.'
      - '(M4) IS a distributional claim in disguise ("whose forced value is equidistribution up to Weil error, Kohel-Shparlinski, recalled") and it carries no numbered heuristic, no validation route and an unopened citation. If the field-structured corner is to be named as closed-adjacent, it needs a numbered heuristic like every other distributional statement in this batch.'
      cost_model_challenges:
      - 'See J3. The orbit-walk accounting is directionally right and its constant is quoted in the wrong unit.'
      reduction_and_scope_challenges:
      - 'The record says it closes brief classes (7) and (9). (7) is genuinely closed by (M1)-(M2) at derivation tier. (9) is NOT closed: (M4) is the only clause covering it and it does not hold in the generality stated. Scope should be narrowed to (7) plus the shift/orbit sub-family of (9).'
      proof_architecture_challenges:
      - 'Baseline reproduction is correct and cheap: S = {0} must return (1.000, 2.000), i.e. calibration two of IDEA-20260802-002, before any other S is read.'
      - 'Method ceiling correctly disclaims field-structured statistics -- which is exactly why the closure language in the title and in sota_delta over-reaches relative to the ceiling the record itself declares.'
      obstruction_reversals:
      - |-
        Obstruction measured: c_can = |H| per orbit, i.e. canonicalisation costs more than the quotient
        saves. Reversal: IDEA-20260901-863e36 (C4) already reads this measurement as a HYPOTHESIS
        rather than a barrier -- a generic canonicalisation lower bound Omega(sqrt|H|) is exactly what
        makes a NON-generic arithmetic selector the only remaining cell, and 863e36 (C6) freezes one
        (the smallest-x-coordinate selector). 579fcc re-derives the obstruction without picking up the
        reversal its own cited neighbour supplies. The forward action is to run 579fcc's (M3)
        measurement on 863e36's rho_lambda selector, where a c_can = o(sqrt(r)) result would be
        exponent-relevant and is not forbidden by Shoup because the selector is non-generic.
      narrowest_supported_statement: |-
        For N prime and odd, R != O, 2 <= |S| < N and generic P, the fibre of the unlabelled multiset
        {x(P + sR) : s in S} is {P} when S is not centrally symmetric and {P, -P - cR} when S = c - S,
        in which case the object equals the translation-conjugate coordinate x_T with 2T = -cR. Orbit
        multisets over H <= (Z/N)^* cost |H| scalar multiplications per step to canonicalise. No
        statement about field-structured statistics of multisets is supported.

    IDEA-20260905-ab4a6e:
      set: representation
      record_own_claim_tag: '(Q1) membership, (Q2) small-root ratio tie, (Q3) generic null, (Q4) CM positive control'
      J1:
        verdict: holds
        attack: |-
          Read IDEA-20260815-3dc025, IDEA-20260904-8dccc9, IDEA-20260902-701458, H-FBG-001 and
          IDEA-20260808-c31f1c. Tested the stated differences, in particular whether the box is
          8dccc9's digit reparametrisation of the same interval under another name.
        result: |-
          Distinct and the diffs are accurate. 8dccc9 re-parametrises the SAME point set (volume-
          preserving, demand-neutral, polytope-changing); the box is a DIFFERENT point set with the same
          polytope. 3dc025 presents the GROUP E(F_p) as an O-module and locates the barrier in the
          DLP-equivalence of the exposing coordinate; ab4a6e presents the FIELD F_p as O_K/(pi), and its
          coordinate is free to compute, so 3dc025''s obstruction genuinely does not apply. The record
          also volunteers H-FBG-001 (rejected_scoped) as the prior negative it expects to reproduce,
          which is the correct posture.
      J2:
        verdict: holds
        attack: |-
          Lossy-projection audit. Asked which part is the change of coordinates and whether the record
          admits it.
        result: |-
          The record states plainly that the reduced representative "discards nothing (a bijection
          F_p -> fundamental domain, i.e. a change of coordinates)" and that the only lossy object is
          the membership predicate, which propagates under no group operation on its own. That is the
          honest reading and it is the reading this reviewer reached independently. No enumerator or
          coordinate-change failure hidden.
      J3:
        verdict: holds
        attack: |-
          Recomputed (Q2)'s height bookkeeping independently, including the count of admissible lifts
          lambda, which the record does not compute.
        result: |-
          (Q2) IS CORRECT AND IS STRONGER THAN THE RECORD ARGUES. Interval presentation: |x_i| <= B,
          S_3 has total degree 4, so |S_3| <= cB^4 against p and the number of admissible integer
          lambda is about B^4/p. Box presentation: |alpha_i| <= B^{1/2}, so |S_3(alpha)| <= cB^2
          against |pi| = p^{1/2}, and the number of admissible lambda in O_K -- a TWO-dimensional count
          the record does not perform -- is about (B^2/p^{1/2})^2 = B^4/p. The lift counts agree
          exactly, not merely the dimensionless threshold, which is a better argument for the tie than
          the one filed. Membership (Q1) as one Gauss reduction is polylog and correctly charged, and
          interpretation_limits places the base in KN-OPEN-020's implicit-membership cell with
          description, membership, relation, time and memory all charged.
      J4:
        verdict: holds
        attack: 'Checked dominated_by against every named row and against the CM-arm baseline the record''s only predicted effect lives on.'
        result: |-
          Correct and unusually honest: it names automorphism-discounted rho as dominating the CM arm's
          gain "by the same factor", names the interval base as dominating on simplicity, and names
          H-FBG-001's completed scoped negative as dominating it on empirical standing. sota_delta is
          quantitative.
      J5:
        verdict: breaks
        attack: |-
          The record's predicted outcome is a NULL on generic curves, so its whole evidential weight
          rests on the CM positive control proving the battery is not blind. I therefore tested whether
          the declared box is actually stable under the unit action it claims, by direct enumeration in
          both relevant orders.
        result: |-
          THE POSITIVE CONTROL FAILS BY CONSTRUCTION FOR TWO OF THE FOUR DECLARED DISCRIMINANTS AND IS
          EMPTY FOR THE OTHER TWO. (Q4) claims a unit u acts on the box by alpha -> u*alpha, so F_box is
          a union of Aut(E)-orbits, and predicts orbit structure for "100 percent of members".
          (i) D = -4, O_K = Z[i]: multiplication by i sends (u,v) -> (-v,u) and the square box IS
          stable. The control works.
          (ii) D = -3, O_K = Z[omega] with omega^2 = omega - 1: multiplication by omega sends
          (u,v) -> (-v, u+v), which leaves the declared box {|u|,|v| <= B^{1/2}}. Enumerated: exactly
          25.0% of box members are mapped OUTSIDE the box, stably as the box grows (24.5% at M = 3,
          24.9% at M = 10, 25.0% at M = 50 and M = 200). So F_box is NOT a union of unit orbits for
          D = -3 and the prediction fails on the CM arm for a reason that has nothing to do with the
          curve.
          (iii) |D| in {7, 8}: the unit group of O_K is {+-1} only. The "unit acts on box and curve
          simultaneously" mechanism is vacuous there -- the only automorphism is negation, which is
          already the symmetry of the x-map and buys nothing beyond the standard baseline. The record's
          assumptions admit |D| in {3,4,7,8} while its prediction quotes |Aut| in {4,6}, so two of the
          four admitted discriminants have no positive control at all.
          Under the record's own falsification condition ("The CM arm shows no orbit structure: the unit
          action was mis-specified; instrument fault"), three of four discriminant arms would be spent
          discovering a box-shape defect. A battery whose positive control is mis-specified cannot
          license the null it predicts.
      J6:
        verdict: breaks
        attack: 'Checked the provenance of every citation supporting the one effect the record predicts to be real.'
        result: |-
          The CM-arm gain is the record's ONLY predicted effect, and its support is KN-LIT-004
          (Faugere-Gaudry-Huot-Renault), marked `recalled`, relayed through IDEA-20260807-dadcd2, with
          the explicit note "KN-LIT-004 itself was not opened in this task, so this entry is a pointer
          and supports nothing here". KN-LIT-004 is an in-repo corpus note. Likewise
          IDEA-20260903-81a943 is marked `recalled` and "not opened" while being the pointer for (Q2)'s
          currency, and it is an in-repo ledger record. Two in-repo records, both readable at zero cost,
          both carrying a load-bearing role, both left as pointers. This is the same pattern as 579fcc
          (J6) and is the batch's most systematic citation defect.
      objections:
      - 'THE CM POSITIVE CONTROL IS MIS-SPECIFIED: the declared square box is not unit-stable for D = -3 (25.0% of members escape, uniformly in B), and the unit group is trivial for |D| in {7,8}. Only D = -4 works as filed.'
      - 'Two in-repo records (KN-LIT-004, IDEA-20260903-81a943) carry load-bearing roles at `recalled` provenance without being opened.'
      - '(Q2) is right and under-argued: the record stops at the dimensionless threshold where the two-dimensional lift count actually agrees exactly. The stronger form should be filed because it is what makes the tie a derivation rather than an analogy.'
      required_controls:
      - 'Redefine the box as a unit-stable region before any CM arm is run: a norm ball {alpha : |alpha| <= B^{1/2}} or a hexagonal fundamental domain for D = -3, retaining the square box only for D = -4. Otherwise the CM arm measures the box shape, not the curve.'
      - 'Drop |D| in {7,8} from the CM arm or relabel those cells as generic-arm cells; with unit group {+-1} they carry no positive control.'
      - 'Retain the near-CM (j near but not equal to 0 or 1728) known-false object; it is well chosen and it is what separates the unit action from the box shape once the box is fixed.'
      counterexample_or_mutation: |-
        Explicit counterexample to (Q4) at zero compute, D = -3, omega a primitive sixth root of unity
        with omega^2 = omega - 1: multiplication by omega maps u + v*omega to -v + (u+v)*omega, i.e.
        (u,v) -> (-v, u+v). Take B^{1/2} = M and the member (u,v) = (M, M): its image is (-M, 2M), whose
        second coordinate has absolute value 2M > M. The orbit of a box member leaves the box, so F_box
        is not a union of unit orbits. Enumerated escape fraction converges to exactly 1/4 as M grows.
        Cheapest repair: use the norm ball, on which the unit action is an isometry by construction.
      heuristic_challenges:
      - 'H1 is numbered and carries a rigorous half (exact Gauss-circle box count plus the Hasse density 1/2) and an imitated half, and it VOLUNTEERS that the Weil bound is vacuous at this size so the fair-coin quadratic-residuosity assumption is doing real work. That disclosure is exactly what the target profile asks for and is credited.'
      - 'The random-model transfer is the right thing to doubt and the record does not name the cheapest experiment that would expose a deviation. Box residues rho(u + v*omega) are a low-height set in a lattice presentation; systematic deviation would most plausibly show up as a correlation between the quadratic character of f and the norm of alpha. That statistic should be measured, not only the aggregate count.'
      cost_model_challenges:
      - 'Membership is charged as one Gauss reduction, polylog, with the constant disclosed. Correct.'
      - 'The record does not charge the cost of FINDING a split p and a suitable pi per discriminant, which is small but is the setup cost of the whole construction and is the kind of stage this joint exists to catch. Minor.'
      reduction_and_scope_challenges:
      - 'No scope inflation: the predicted generic outcome is a null, the predicted CM outcome is the known FGHR gain, and the record says the CM gain "is the known one". recommended_priority low is consistent with that.'
      - 'The KN-OPEN-020 class assignment (implicit membership, high-degree description) is filled with charged costs and explicitly does not claim to escape the scoped-out class.'
      proof_architecture_challenges:
      - 'Baseline reproduction (D = -4, box = interval x {v = 0}) is well chosen and would work.'
      - 'The nearby-object control (CM versus near-CM) is right, but it is downstream of the broken box definition and would inherit the defect.'
      obstruction_reversals:
      - |-
        Not a closure record; it predicts a null rather than asserting one, so item 8 applies only to
        its (Q3) prediction. If (Q3) is confirmed, the measurement worth keeping is the exact tie of the
        lift counts in (Q2): a statement that two archimedean presentations of the same field admit the
        same number of small lifts is a constraint any future small-root proposal over F_p must respect,
        and it is reusable independently of the box.
      narrowest_supported_statement: |-
        Reading x(P) as a reduced element of O_K/(pi) and cutting the factor base by a box in the
        (u,v) coordinates gives a base of size about B whose membership costs one Gauss reduction, and
        whose small-root lift count B^4/p equals the interval base's. On a curve with CM by O_K the
        unit group acts on a UNIT-STABLE region and on the curve simultaneously, giving the known
        FGHR/KN-TECH-018 factor; the square box declared in this record is not such a region for
        D = -3, and for |D| in {7,8} the unit group is trivial. No generic-curve effect is claimed.

    IDEA-20260905-0e0982:
      set: representation
      record_own_claim_tag: '(G1) exactly two rational Jacobian self-gluings, (G2) J(F_p) = (Z/N)^2, (G3) cited closure, (G4) line-versus-uniform test'
      J1:
        verdict: holds
        attack: |-
          Read H-ECDLP-f9a627 (statement and mechanism), KN-FIND-61347e in full, IDEA-20260808-fa1d80
          in full, and the KN-LIT-493 / KN-LIT-1482 corpus notes. Tested whether the record is
          f9a627's conorm arm renamed.
        result: |-
          The record answers this against itself and correctly: it states that f9a627's obstruction DOES
          cover its object, that its (G4) arm is "the same shape as f9a627's conorm arm", that the two
          "should be run as ONE contract", and that "this record must not be dispatched as an
          independent test of the barrier". That is the most honest nearest-record disclosure in the
          batch. What it adds beyond f9a627 -- the exact rational-gluing count, the explicit line
          representation, the completed (L,b) audit -- is real and is not notation.
      J2:
        verdict: holds
        attack: |-
          Lossy-projection audit on Phi. Asked whether the isogeny is being sold as lossy when it is
          bijective on the objects actually used.
        result: |-
          The record states outright that Phi "discards nothing on RATIONAL pairs (a bijection)", gives
          meter values (0,1) on rational pairs and (2,1) on geometric pairs, and says this is "stated so
          the pass is not misread as novelty". The only lossy object it claims is the degree-1 relation
          vector, which is ordinary F2. Correct classification; no enumerator or coordinate-change
          failure concealed.
      J3:
        verdict: holds
        attack: 'Recomputed the end-to-end path from target_complexity, adding descent, linear algebra over (Z/N)^2, base size and construction cost.'
        result: |-
          All charged, and charged against the record: exponent 1 via ambient index calculus, a loss of
          N^{1/2} against rho, memory about N for base and relations, construction and Cantor arithmetic
          polynomial, descent explicitly unnecessary because every class is a sum of at most 2 base
          elements. The record states its own prognosis as negative before any measurement.
      J4:
        verdict: holds
        attack: 'Checked every frontier row plus the specialised genus-2 baseline.'
        result: |-
          The strongest dominated_by block in the batch: rho dominates by N^{1/2} with the finding cited,
          BSGS dominates on time at equal-or-less memory, and the record additionally records that as a
          barrier measurement it is dominated by H-ECDLP-f9a627, which already designs the same arm.
          sota_delta is explicitly NEGATIVE as an algorithm and quantified (2^128 at 256-bit N).
      J5:
        verdict: holds
        attack: 'Asked whether the split-gluing known-false object is inconvenient, and whether a planted control exists before any blind draw.'
        result: |-
          Both present and correct: the split gluing psi = id has codomain E x E, so its statistics MUST
          be E's own -- a case where the claimed structure is known absent -- and line elements with k
          known verify the Mumford pipeline before any blind draw. The nearby-object control names a
          genus-3 Jacobian, where index calculus genuinely DOES beat rho, which is the right
          proves-too-much object for this argument.
      J6:
        verdict: holds
        attack: 'Checked the load-bearing recalled items (GTTD eprint 2004/153, Kani/Frey-Kani gluing) against the use made of them.'
        result: |-
          GTTD is `recalled` and blocked, and the record states it is "load-bearing only through
          KN-FIND-61347e's g = 2 robustness argument". Reading KN-FIND-61347e confirms that finding
          carries exactly that robustness argument ("holds using only the well-established,
          uncontroversial g=2 case ... the general-g exponent formula is not load-bearing"). The relay
          is accurate. Kani/Frey-Kani is a pointer for a statement the record does not lean on.
      verified_derivation:
        claim: '(G1): on a prime-order curve, exactly two F_p-rational (2,2)-self-gluings with Jacobian codomain, plus the split one.'
        check: |-
          INDEPENDENTLY VERIFIED AND SLIGHTLY STRENGTHENED. Enumerated the symplectic F_2-space
          V = E[2] (+) E[2] with the product Weil form: 15 Lagrangians in total. Prime order forces
          E(F_p)[2] = 0, so Frobenius acts on E[2] with no non-zero fixed vector, i.e. as an order-3
          element of GL_2(F_2) = S_3. Acting by that element on the 15 Lagrangians leaves exactly 3
          fixed, and all 3 are graphs of isomorphisms -- matching the centraliser computation the record
          gives (centraliser of a 3-cycle in S_3 has order 3: identity plus two 3-cycles). The identity
          graph {(T,T)} is the kernel of (P,Q) -> (P+Q, P-Q), so its codomain is split, leaving exactly
          two candidate Jacobians. The count is correct. It is also COMPLETE in a way the record does
          not claim: no NON-graph rational Lagrangian exists here, so "exactly two" is a statement about
          all rational (2,2)-isogenies, not only about graph kernels. (G2) also checks: Phi is injective
          on E(F_p)^2 because N is odd and the kernel has order 4, and #J(F_p) = N^2 by Tate, so Phi is
          an isomorphism onto J(F_p).
      objections:
      - 'The record is, by its own statement, a companion arm of H-ECDLP-f9a627 and must not be ranked as an independent test. If both are approved they must share one contract, as the record itself requires.'
      - '"Exactly two" is conditional on the two 3-cycle gluings being non-degenerate (a degenerate kernel gives a product, not a Jacobian). The record flags this in assumptions but the title states the count unconditionally.'
      - 'estimated_cost implementation: high, predicted outcome: null, and already dominated by N^{1/2}. The ranking consequence is that this record buys the least per unit of implementation effort in the representation set, which its own recommended_priority (low) already reflects.'
      required_controls:
      - 'Keep the split gluing as the known-false object and the planted known-k line elements as the pipeline check; neither may be dropped for budget.'
      - 'Report the degeneracy count per curve rather than excluding degenerate gluings silently -- the record says so and it must survive into the contract.'
      counterexample_or_mutation: |-
        No counterexample found; the derivation survived an independent enumeration. The useful mutation
        is a strengthening: report that all three Frobenius-stable Lagrangians are graphs, which upgrades
        (G1) from "exactly two graph gluings" to "exactly two rational (2,2)-isogenies with Jacobian
        codomain", closing the gap a reader would otherwise probe.
      heuristic_challenges:
      - 'H1 is numbered and splits correctly into a rigorous half (Chebotarev for the degree-2 cover, Weil error) and an imitated half (fair-coin splitting), and it names the line version as "the heuristic content". Correct form.'
      - 'The transfer question the record does not ask: a subgroup of index N inside (Z/N)^2 is not a random subset, and "Frobenius-generic for u" is precisely the assumption a structured subgroup might violate. The cheapest exposure is to compare the split statistics of the ECDLP line against those of OTHER index-N subgroups of (Z/N)^2 (there are N+1 of them), not only against uniform elements -- a control the record does not declare and which costs nothing extra.'
      cost_model_challenges:
      - 'None material; the record charges against itself throughout.'
      reduction_and_scope_challenges:
      - 'The record explicitly states that even the positive outcome E-A "yields no attack" without a conversion to a sub-N^{1/2} algorithm it does not claim. No scope inflation.'
      - 'KN-FIND-61347e''s closure is cited, not re-derived, and its named open direction is what (G4) probes. Correct instantiation of the cited finding''s own forward guidance.'
      proof_architecture_challenges:
      - 'Baseline embedding (psi = id, split codomain) is exact and checkable, and is the same object as the known-false control -- economical and correct.'
      - 'The method ceiling correctly refuses to certify that no factor-restricted algorithm exists.'
      obstruction_reversals:
      - |-
        The record accepts KN-FIND-61347e's closure rather than asserting its own, so the reversal is
        already partly done: it takes the obstruction (ambient order N^2 versus target N) as the
        hypothesis of the one experiment the finding names as open. The reversal this reviewer adds:
        the measured object -- exactly two rational self-gluings, both graphs -- is itself a rigidity
        statement about prime-order curves that a constructive line could take as a hypothesis
        (a canonical pair of genus-2 curves attached to every prime-order E, with no choice to make).
        Filed as a finding; it changes no status and supports no attack.
      narrowest_supported_statement: |-
        For E/F_p of prime order N > 2, exactly three F_p-rational maximal isotropic subgroups of
        (E x E)[2] exist -- all graphs of isometries -- of which one gives the split codomain and two
        give candidate Jacobian self-gluings, and Phi restricts to an isomorphism E(F_p)^2 -> J(F_p) =
        (Z/N)^2 carrying (P, kP) to e_1 + k*e_2. Any attack through this object costs exponent 1 by
        KN-FIND-61347e, a loss of N^{1/2} against rho. Whether the ECDLP line leaves a trace in the
        degree-1 factor base is untested and predicted null.

    IDEA-20260905-24d827:
      set: sat_smt
      record_own_claim_tag: '(A) prime-field ceiling ms - log2 m!, (B) no-above-(m-1)s claim, three arms (BV), (FF), (UP)'
      J1:
        verdict: holds
        attack: |-
          Read IDEA-20260904-3c7a91 in full and compared the two tracked objects. Read the frozen source
          (Proposition 1, Algorithm 1, section 5 equation (10), Theorem 1) to test whether the transfer
          to the prime field is a restatement.
        result: |-
          Distinct. 3c7a91's backdoor mechanism is monomial substitution over a Weil-descended F_2
          system; 24d827's is a Tseitin ARITHMETIC CIRCUIT over F_p digit blocks, a different reason for
          the same shape of conclusion, and the record adds a second tier ((UP)) that 3c7a91 has no
          analogue of. The frozen source's Proposition 1 and equation (10) say what the record says they
          say (total assignment of the c_{i,j} propagates everything; worst-case conflicts 2^{ml}/m!;
          Algorithm 1 requires the block order "from the leading bit of x_1 to the trailing bit of x_m"
          and is stated to be incorrect otherwise). The transfer of the lexicographic m! quotient to
          ordered digit blocks is legitimate because the summation polynomial is symmetric in the x_i
          and lexicographic order on digit bit-vectors is numeric order on x_i.
      J2:
        verdict: holds
        attack: |-
          Wrote the search as a tree over the declared digit variables and asked what conflict can occur
          above leaf depth. Then asked whether the record hides that it is an enumerator.
        result: |-
          The record IS an enumerator and says so in terms: arm (UP) "REALISES the (m-1)-fold-loop-
          plus-root-finding baseline of IDEA-20260904-96c4f3 ... inside a SAT solver", its floor is the
          enumeration bound, and interpretation_limits states "NO EXPONENT IS IMPROVED. The best arm
          matches the known enumeration baseline". The enumerator-in-disguise failure is disclosed
          rather than committed. Its use of KN-FIND-a8990a Theorem C is also correctly instantiated:
          with m-1 rational x-coordinates plus the target, S_{m+1} splits with at most 2^{(m+1)-2} =
          2^{m-1} roots, which is the number the record uses.
      J3:
        verdict: breaks
        attack: |-
          Recomputed the two tier counts and the claimed factor, then attacked the one assumption that
          makes the node count well defined: the record's claim that modular-arithmetic encoding choice
          moves only the per-node cost.
        result: |-
          The tier arithmetic is CORRECT: (2^{ms}/m!)/(2^{(m-1)s}2^{m-1}/(m-1)!) = 2^{s-m+1}/m, which is
          21.33 at s = 8, m = 3 as stated. THE ENCODING-INVARIANCE ASSERTION IS NOT. confounders says
          "Modular-arithmetic encodings differ enormously in clause count (schoolbook versus Karatsuba,
          Barrett versus repeated subtraction); per-node cost is affected, node count is not." That is
          load-bearing for (A) and it is false for a natural encoding class. If S_{m+1} is encoded as an
          integer computation followed by a reduction constraint S = lambda*p with lambda a bounded
          auxiliary, then the LOW BITS of S are determined by the low bits of the digit inputs (carry
          chains are local at the bottom), while the number of admissible lambda is bounded by
          (bound on S)/p. Determining j low bits of S therefore constrains lambda, and once lambda is
          pinned the constraint propagates upward -- an above-leaf conflict source whose strength grows
          with the number of low bits assigned and which is absent from an encoding that reduces
          eagerly. The record prices this at "10 percent rather than 5" with no derivation, and H1's
          form C*2^{-(ms-d)} with C <= 4 encodes the assumption rather than testing it. SECOND COST
          OMISSION: dominated_by says the enumeration baseline "ties arm (UP) exactly". It ties on NODE
          COUNT only. Per node, 96c4f3's loop does one point subtraction and one interval comparison,
          while (UP) root-finds a degree-2^{m-1} univariate over F_p (Cantor-Zassenhaus, randomised,
          polylog with a large constant). At equal node count the loop dominates (UP) on time; "ties
          exactly" overstates by the per-node ratio the record elsewhere says it will report.
      J4:
        verdict: holds
        attack: |-
          Listed the rows the record names, added rho with distinguished points, BSGS, the honest
          enumeration bound of 96c4f3, target-keyed MITM and the S*T^2 = N preprocessing frontier, and
          checked time, memory and data/queries separately.
        result: |-
          The best Pareto block in the SAT set. Every row this reviewer would add is already present
          with a number, including the one that dominates the record's own best arm (the (m-1)-fold
          enumeration ties (UP) and dominates (BV)/(FF) by 2^{s-m+1}/m), and target-keyed MITM is named
          as dominating all arms at larger memory. dominated_by is not null and sota_delta is
          quantitative ("Zero on every attack axis").
      J5:
        verdict: holds
        attack: |-
          Asked what parameter should destroy the predicted flat ceiling and whether the known-false
          object is inconvenient enough to catch a blind instrument.
        result: |-
          Both are right. The known-false object is the same system plus a cross-block linear relation
          x_1 + x_2 = c, on which the ceiling MUST collapse by at least 2^{s-1}; a run that returns the
          ceiling there reports nothing. The decay parameter is s, and the record predicts and measures
          the tier ratio 2^{s-m+1}/m as s grows, so a flat ratio would be caught. The support-matched
          random digit null (N0-p) and the wrong-constant null (N3-p) are declared, and the record names
          null_ratio <= 0.90 as its highest-value outcome rather than as a nuisance.
      J6:
        verdict: inconclusive
        attack: |-
          Attempted to locate the internals of cvc5's finite-field decision procedure (eprint 2023/091),
          which is what H3 assumes about; the record read the abstract only.
        result: |-
          RETRIEVAL FAILED TO RESOLVE IT. The eprint landing page states only "We study satisfiability
          modulo the theory of finite fields and give a decision procedure for this theory" and does not
          describe the calculus; the PDF body was not reachable from this container. So this reviewer
          cannot confirm or refute the record's H3 assumption that the procedure derives only
          Groebner-type consequences. Recorded as UNLOCATED, not as confirmed. The record's own handling
          is correct: it marks H3 as "measured, not assumed", names the quantifier at risk as being over
          theory solvers, and declares ff_check_ratio < 0.5 as the outcome that falsifies its own claim
          (B) -- which it calls "the most valuable outcome". That is the right posture for an unlocated
          dependency. Other externals (arXiv:2407.21169, LIPIcs.SAT.2023.8) are abstract-level and
          load-bearing only for the existence of an input format and an interface.
      objections:
      - 'ENCODING-INVARIANCE OF THE NODE COUNT IS ASSERTED AND IS FALSE for integer-then-reduce encodings, where low-bit determination plus a bounded multiplier count yields above-leaf conflicts. This is the assumption (A) rests on.'
      - '"Ties arm (UP) exactly" omits the per-node constant, which favours 96c4f3''s loop by the ratio of a Cantor-Zassenhaus root-find to a point subtraction.'
      - 'H1''s conflict-probability form C*2^{-(ms-d)}, C <= 4, is asserted with a rigorous half that only fixes the tree HEIGHT; the distributional half is carried entirely by measurement, which the record admits, but the constant C <= 4 has no derivation at all.'
      - 'The interval [0, 2^s) is not the factor base (about half its elements are not x-coordinates of rational points); the filtering fraction is disclosed, but the relation-yield consequence is out of scope by declaration and so the record cannot be cited for any end-to-end statement.'
      required_controls:
      - 'RUN AT LEAST TWO MODULAR-REDUCTION ENCODINGS (eager reduction versus integer-then-reduce with a bounded multiplier) and report the node counts separately. If they differ beyond the band, the ceiling is a property of the encoding, not of the prime-field pdp -- and this is the cheapest way to find that out.'
      - 'Report the per-node cost of (UP) and of the 96c4f3 loop in the same unit before claiming a tie.'
      - 'Keep the cross-block-linear known-false object and the bivariate-residual control; both are well chosen.'
      heuristic_challenges:
      - 'Three heuristics, all numbered, all with a rigorous half and an explicitly named imitated law, all with validation plans and tail checks, and H3 declared as measured rather than asserted. This is the strongest heuristic block in the batch and meets the exemplar standard on form.'
      - 'H1''s transfer is honestly flagged ("uniform prefixes stand in for solver-visited prefixes, a different distribution, not modelled"). That flag is exactly the deviation the encoding objection above predicts will matter: solver-visited prefixes are precisely the ones where low-bit structure has been assigned.'
      - 'H2''s failure mode is named (additive structure of the interval concentrating sums, citing KN-FIND-007''s warning), which is the correct random-model-transfer challenge to have anticipated.'
      cost_model_challenges:
      - 'Per-attempt versus total expected cost: the record measures per-instance search cost and does not multiply by an inverse success probability, which is correct because it makes no end-to-end claim and says so. No bookkeeping error.'
      - 'Memory is stated beside time for all three arms (poly, plus learned-clause RSS). Correct.'
      reduction_and_scope_challenges:
      - 'Claim tier toy, p <= 2^32, s <= 8, "no downstream citation may raise it", and "NOT A LOWER BOUND: measuring that three encodings do not prune is not a proof that none can". Scope discipline is exemplary here.'
      - 'goal_applicability asserts this record extends GOAL-SATIC-c49b77''s benchmark discipline to a prime-field family. That campaign is owned by another session and carries two open impediments; asserting applicability to it is a coordination claim, not a scientific one, and should not be read as that campaign having accepted the work.'
      proof_architecture_challenges:
      - 'Baseline embedding is a frozen integer fixture committed before any run (2^{ms}/m! and 2^{(m-1)s}2^{m-1}/(m-1)! at every cell, plus exact solution-set equality against brute force at s <= 4). This is the correct form and it is checkable.'
      - 'The method ceiling correctly refuses to certify that no SMT theory prunes.'
      obstruction_reversals:
      - |-
        Obstruction to be measured: the digit bits are a backdoor, so the tree height is ms and no
        theory prunes above the last block. Reversal: a system whose only conflicts occur at full
        assignment is a system with a perfect STRONG BACKDOOR of known size, and backdoor size is the
        hypothesis of the parameterised-complexity line on SAT (a formula with a strong backdoor of size
        k is decidable in 2^k*poly). Read that way the measurement is not only a ceiling but a
        certified backdoor-size statement for a natural cryptographic family, which is the quantity a
        parameterised-complexity reader would want and which no record in this program has recorded.
        Filed as a finding, not evidence.
      narrowest_supported_statement: |-
        For the base-2 digit presentation of the prime-field pdp at the tested cells, under a stated
        modular-arithmetic encoding and the block digit order, the complete search visits about
        2^{ms}/m! leaves for bit-blasted arms and about 2^{(m-1)s}2^{m-1}/(m-1)! for a root-finding
        propagator arm, the latter matching the known enumeration baseline on node count. No exponent is
        improved, nothing transfers to cryptographic p, and the ceiling is a statement about the tested
        encodings rather than about the problem.

    IDEA-20260905-a6f98e:
      set: sat_smt
      record_own_claim_tag: '(A) LRAT length = leaf count, (B) Nullstellensatz degree D_NS by exact rank, (C) prime-field floor'
      J1:
        verdict: breaks
        attack: |-
          Read IDEA-20260904-3c7a91, IDEA-20260806-e4f96e and IDEA-20260805-2afd22 in full and tested
          each stated difference. Then tested the intra-batch neighbours, which the record does not
          consider because the producers were blinded to each other -- but the Coordinator filed them in
          one archive.
        result: |-
          PART (A) IS A COROLLARY OF THE OFF-LIMITS NEIGHBOUR. The producer handoff declares the five
          RQ-SATIC proposals off-limits AS MECHANISMS and forbids "another ceiling restatement". The
          record's own mechanism says "IDEA-20260904-3c7a91's no-above-leaf-pruning mechanism therefore
          predicts L_res = leaves". So on the leaf axis (A) restates 3c7a91's ceiling in the unit of
          proof length; it adds an artifact (a checked proof) but not a mechanism. Part (B) IS distinct
          from e4f96e (which uses PC degree as a solver-independent LOWER BOUND on solving degree) and
          from 2afd22 (which proposes the NS witness as a coverage device), and the record states both
          diffs accurately, including the consistency obligation D_NS >= PC(F).
          INTRA-BATCH DUPLICATION, UNNAMED. On UNSAT instances, IDEA-20260905-3de445's D_elim(m-1, e) is
          the least Macaulay degree at which the row space contains a non-zero polynomial of degree
          <= e supported on blocks 1..m-1. The constant 1 has empty support, so it is supported on every
          block subset, and on an UNSAT instance 1 lies in the ideal. Hence D_elim(m-1, e) <= D_NS for
          every e >= 0, and the two records are measuring the same quantity from opposite sides at
          e = 0 without either saying so. Two records in one batch would produce the same obstruction
          number and could be double-counted as independent evidence.
      J2:
        verdict: holds
        attack: 'Tested the tracked object (L_res, D_NS) for the change-of-coordinates failure and checked the claimed monotone propagation under bit restriction.'
        result: |-
          The pair is genuinely lossy (two integers from a proof and a row space) and the record
          correctly identifies the Macaulay row space itself as the projection that would fail the test.
          The monotonicity claim is right: a resolution proof restricts to a proof of at most the same
          length and an NS certificate restricts to one of at most the same degree.
      J3:
        verdict: breaks
        attack: |-
          Recomputed the end-to-end path for the pipeline stage the record claims to change
          (certification of the relation-finding phase), not only for one instance.
        result: |-
          PER-INSTANCE COSTS ARE PRICED; THE PIPELINE-STAGE CLAIM IS NOT. The record's stage is
          "certification" and (A) says "Every UNSAT verdict in this lane carries a DRAT or LRAT proof".
          Per instance that costs a proof of about 2^{ml}/m! clauses of length about ml -- the record
          discloses "the proof is as large as the search" -- plus linear-time checking with a large
          constant. But the relation phase of the index calculus this is meant to certify performs about
          m!*2^{n-(m-1)l} target attempts, nearly all UNSAT. The total certificate storage is therefore
          (number of UNSAT attempts) x (2^{ml}/m!) clauses, a product that appears nowhere in
          target_complexity or estimated_cost. As a per-instance toy deliverable the accounting is
          complete; as the "closing of the negative-side certificate gap" for a pipeline stage it is
          missing its own multiplier. The record should either restrict the claim to per-instance
          certification at toy scale (which its interpretation_limits nearly does: "Certificates
          certify non-decomposability of ONE target for ONE factor base") or charge the campaign-level
          product.
      J4:
        verdict: holds
        attack: 'Checked dominated_by row by row against enumeration, rho, MITM, BSGS, Groebner and the crossbred/hybrid re-costings.'
        result: |-
          Correct and complete for the axes the record claims: both certificate routes are dominated as
          decision procedures by the (m-1)-fold enumeration and by rho, and the record adds the honest
          observation that no checked row produces a checkable NEGATIVE certificate, which is the axis
          on which it is not dominated. sota_delta is zero on attack axes with the deliverable stated
          separately.
      J5:
        verdict: holds
        attack: |-
          Asked whether the instrument can demonstrate a separation before being asked to find one, and
          whether the known-false object is inconvenient.
        result: |-
          THIS IS THE BEST CONTROL DESIGN IN THE BATCH. It carries a KNOWN-TRUE SEPARATION (a Tseitin
          parity contradiction, where D_NS must be small and L_res exponential) as well as a
          known-false object (the system plus l redundant linear equations, where the proof must shrink
          by about 2^l and trimming must matter) and a random 3-CNF where both must be large. An
          instrument that cannot reproduce the known separation "reports nothing about the pdp". The
          decay/growth parameter is l, with the slope of D_NS in l as the primary read-out and with the
          explicit warning that aborted top cells bias the slope toward the exciting outcome (II) and
          that (II) "may not be declared from a truncated ladder". That is the artifact tell being
          anticipated rather than discovered.
      J6:
        verdict: holds
        attack: 'Checked the recalled proof-complexity citations against the roles they play.'
        result: |-
          Urquhart (Tseitin formulas hard for resolution), Ben-Sasson-Wigderson (width-size) and
          Beame-Karp-Pitassi-Saks (DPLL trees = tree-like resolution) are all `recalled` and are used
          only for the CALIBRATION object and for the L_res = leaves intuition, both of which the record
          then measures rather than assumes. LRAT and FRAT abstracts were retrieved. The Gocht-Nordstrom
          snippet correctly motivates using the plain CNF model for certificate one and naming VeriPB
          for XOR-aware solvers. No citation is asked to carry more than it can.
      objections:
      - 'PART (A) IS A RESTATEMENT of the off-limits neighbour''s ceiling in a new unit; the mechanism is 3c7a91''s and the record says so. The new content is the artifact, not the mechanism.'
      - 'INTRA-BATCH DUPLICATION with IDEA-20260905-3de445: D_elim(m-1, e) <= D_NS on UNSAT instances for every e >= 0, so the two records'' algebraic arms measure the same obstruction. Neither cites the other (the producers were blinded; the Coordinator was not).'
      - 'The certification pipeline-stage claim carries an unpriced per-campaign multiplier (J3).'
      - 'Outcome (II)''s self-reduction derivation is valid -- a uniformly bounded D_NS over the family AND its bit-restrictions gives a poly(l) decider -- and the record correctly names the restriction quantifier as "the one a naive reading forgets". No objection; recorded because it is the step most likely to be mis-cited downstream.'
      required_controls:
      - 'Run the Tseitin and random-3-CNF calibration objects BEFORE any pdp cell, as the record specifies; they are what make a null readable.'
      - 'Report D_NS and 3de445''s D_elim(m-1, e) in one table with the inequality D_elim <= D_NS stated, so the same obstruction is not counted twice across two records.'
      - 'Report the slope with and without aborted top cells, as the record already requires.'
      counterexample_or_mutation: |-
        Cheapest mutation separating (A)'s content from 3c7a91's: run the proof-length measurement on the
        redundant-linear known-false object AND on a cell with symmetry breaking toggled off. If L_res
        tracks the instrumented leaf count in all three settings, (A) has measured 3c7a91's ceiling in a
        new unit; if L_res and leaves diverge in any setting, (A) has content of its own and that
        setting names it.
      heuristic_challenges:
      - 'H1 and H2 are numbered with rigorous and imitated halves separated, and H2 volunteers its own counter-prior (KN-LIT-005/KN-LIT-024''s bounded first fall, correctly noted as bounding a DIFFERENT quantity). H3 gives the prime-field floor D_NS >= d_ff from e1e38b with the correct reason (a certificate for 1 is a fall to degree 0, so it cannot precede the first fall).'
      - 'Random-model transfer challenge the record does not make: H2 justifies the linear slope by Bardet-Faugere-Salvy semi-regularity for n equations of degree <= 6 in ml Boolean variables. The pdp system is NOT semi-regular -- KN-FIND-006 measured a structural rank deficit of exactly 8*dim(V) on this family -- so the semi-regular imitated law is known to fail for this object at low degree. The record cites KN-FIND-006 for its rank engine but not for this tension.'
      cost_model_challenges:
      - 'Time and memory are stated together for both certificates, including the honest statement that the proof is as large as the search. Correct.'
      - 'The find-versus-check asymmetry is stated (the cheaper certificate to find is the more expensive to store). Correct and useful.'
      - 'The campaign-level product in J3 is the one missing charge.'
      reduction_and_scope_challenges:
      - 'Outcome (II) is explicitly routed to the two-record rule and to review-breakthrough, and is never allowed to become an unconditional claim. Correct handling of a heuristic-conditional result.'
      - 'The record refuses any comparison to Magma or to the source''s timings, per the environment note. Correct.'
      proof_architecture_challenges:
      - 'The baseline-as-boundary transform is correctly used: the leaf-count proof is the boundary of the certificate family and the record asks for a strict inward improvement (a checked proof shorter than 0.5 x leaves), predicted not to exist. That is strictness, not feasibility.'
      - 'The quantifier-order block correctly identifies the restriction quantifier in outcome (II) as the at-risk one.'
      obstruction_reversals:
      - |-
        Obstruction to be measured: D_NS grows linearly in l, so the algebraic certificate is
        exponentially large. Reversal: a family with provably large Nullstellensatz degree is the
        HYPOTHESIS of proof-complexity lower-bound work rather than an obstacle to it -- a natural,
        cryptographically motivated family with measured NS degree growth is a contribution to that
        literature independent of any ECDLP consequence, and it is the one deliverable in this batch
        that has value outside this program. The record half-sees this by calling the pair "the one
        SAT-versus-Groebner number this repository can produce"; the reversal is that the number is
        interesting to a different audience than the one the record addresses.
      narrowest_supported_statement: |-
        Assuming no above-leaf pruning, the LRAT refutation of an UNSAT pdp instance has length about
        the instrumented leaf count and does not compress; and the Nullstellensatz degree D_NS of the
        same instance is measurable by exact rank at l <= 6, with D_NS >= d_ff on the prime-field digit
        arm. Which certificate is smaller is decided per cell at toy scale. No exponent is moved, no
        pipeline-level certification cost is established, and the leaf-axis half is a consequence of
        IDEA-20260904-3c7a91's mechanism rather than of this record's.

    IDEA-20260905-3de445:
      set: sat_smt
      record_own_claim_tag: '(A) zero narrow learned clauses, (B) D_elim above tested degrees, (C) the CDCL-to-elimination bridge'
      J1:
        verdict: holds
        attack: 'Read 3c7a91, 7fd218 and e12b5a in full and compared tracked objects.'
        result: |-
          Distinct and the stated diffs are exact: 3c7a91 tracks conflict DEPTH (where), 7fd218 toggles
          learning on and off (whether), e12b5a tracks the XOR-row linear deficit (parity rows only);
          none inspects WHAT is learned. Block support of learned clauses and D_elim are new objects in
          this corpus. (The intra-batch overlap with a6f98e is recorded under that record's J1 and
          applies symmetrically here.)
      J2:
        verdict: breaks
        attack: |-
          Pipeline-stage test: wrote the search as a tree over the declared block order and asked what
          clause would witness above-leaf pruning at the depth that matters, then checked whether the
          record's own metric can see it. Computed the metric's threshold against the maximum length of
          the clause it is supposed to detect.
        result: |-
          THE PRIMARY METRIC IS DEFINED SO THAT IT CANNOT SEE THE CASE THE EXPONENT DEPENDS ON.
          Prediction (A) counts learned clauses "whose block support omits at least one block AND whose
          length is below ml - l". A clause supported on m-1 blocks contains only core variables of
          those blocks (d and d' variables have full support by the record's own block map), so its
          length is AT MOST (m-1)l. And ml - l = (m-1)l exactly -- verified for m = 3 with l = 4,6,8
          (thresholds 8, 12, 16 against maxima 8, 12, 16) and for m = 4 with l = 4,6,8 (12, 18, 24
          against 12, 18, 24). The strict inequality therefore EXCLUDES the maximal-length narrow
          clause, which is precisely the clause "this complete assignment to blocks 1..m-1 has no
          extension" -- i.e. the clause that realises the (m-1)l enumeration bound and would be the
          witness of above-leaf pruning at the enumeration depth. A solver that learned exactly those
          clauses would be scored as narrow_clause_count = 0 and the record would report its
          pre-registered negative. Repair is one character: report the count at length <= (m-1)l, or
          report the full block-support histogram by length as the primary metric (which the record
          already collects as a secondary metric, so the fix costs nothing).
      J3:
        verdict: holds
        attack: 'Recomputed the charged path: proof parsing, block map construction, Macaulay build, kernel projection, memory contract.'
        result: |-
          All named and charged, with aborted Macaulay cells reported as lower bounds rather than values
          and with the memory contract stated before the run. hidden_overhead names the extra
          elimination per degree for the kernel-projection step. No omitted stage found.
      J4:
        verdict: holds
        attack: 'Checked dominated_by against enumeration, MITM, rho, Groebner F4, generic CDCL and the crossbred/hybrid re-costings.'
        result: |-
          Rows are checked and the record correctly states that none of them produces an
          elimination-degree measurement, which is the axis it claims. Not null. sota_delta zero on
          attack axes.
      J5:
        verdict: breaks
        attack: |-
          Tested whether the declared known-false object can detect the artifact the record is actually
          exposed to, namely a metric threshold that excludes the interesting clause (J2).
        result: |-
          THE KNOWN-FALSE OBJECT IS CHOSEN FOR CONVENIENCE. It is the system plus l redundant linear
          equations c_{1,j} = c_{2,j}, on which the record requires narrow clauses of support {1,2} and
          LENGTH 2. Length 2 is far below the threshold (m-1)l, so the control fires comfortably and
          certifies the instrument in a regime the real prediction excludes. It therefore cannot detect
          the J2 blindness: an instrument that sees length-2 narrow clauses and is blind at length
          (m-1)l would pass this control and then report a false negative. A second known-false object
          is needed at the boundary -- an instance with a planted narrow clause of length exactly
          (m-1)l, which is constructible by adding the negation of one full (m-1)-block assignment that
          genuinely has no extension.
      J6:
        verdict: holds
        attack: 'Checked the recalled citation against its role.'
        result: |-
          Ben-Sasson-Wigderson is `recalled` and used only as the imitated law inside H1 ("a system with
          no narrow refutation has only wide derived clauses"), explicitly separated from H1's rigorous
          half (every F-set clause has full support by equation (6) of the frozen source, which this
          reviewer confirmed in the source text). KN-LIT-7607 is relayed through 84cdb7's verified
          reading and the record says so. No citation over-reach.
      verified_derivation:
        claim: '(B): low-degree elements of the elimination ideal EXIST by dimension count while being underivable at low Macaulay degree.'
        check: |-
          The existence half checks out. The number of (x_1..x_{m-1}) tuples extending to a solution is
          about 2^{(m-1)l} * 2^{m-1} * 2^{l-n}, which at m = 3, n = 3l-1 is 2^{2l} * 4 * 2^{-2l+1} = 8,
          independent of l as the record says. Eight points in F_2^{2l} lie in an affine subspace of
          dimension at most 7, so at least 2l - 7 independent affine forms vanish on them for l >= 4.
          The existence-versus-derivability gap is real and is the record's strongest content. CAVEAT
          THE RECORD DOES NOT STATE: this count describes an instance WITH solutions, while (A) and (B)
          are predicted on UNSAT instances, where the projected set is empty, the elimination ideal is
          the whole ring, and 1 itself is the low-degree element. The quantifiers of the dimension count
          and of the prediction do not match, and on the UNSAT arm the quantity collapses to a6f98e's
          D_NS (see that record's J1).
      objections:
      - 'THE NARROWNESS THRESHOLD ml - l EQUALS (m-1)l, so the primary metric excludes the maximal-length narrow clause -- the exact witness of above-leaf pruning at the enumeration depth. One-character repair available.'
      - 'The known-false object fires only at length 2 and cannot detect that blindness.'
      - 'The dimension count justifying (B) is computed on a solution-bearing instance and the prediction is stated on UNSAT instances, where the elimination ideal is the whole ring and D_elim collapses to D_NS.'
      - 'Intra-batch duplication with IDEA-20260905-a6f98e on the UNSAT algebraic arm.'
      required_controls:
      - 'Add a boundary known-false object: an instance with a planted narrow clause of length exactly (m-1)l, on which the instrument must report narrow_clause_count >= 1. Without it the null is unreadable.'
      - 'Report the block-support histogram by length as the PRIMARY metric rather than the thresholded count, so no clause length is excluded by definition.'
      - 'State the UNSAT/SAT quantifier for (B) explicitly and report D_elim(m-1, 0) alongside, since that is D_NS and ties this record to a6f98e.'
      counterexample_or_mutation: |-
        Arithmetic counterexample to the metric, needing no run: at m = 3, l = 6 the threshold is
        "length < 12" while a clause supported on blocks 1 and 2 has at most 12 literals. Construct (on
        paper) the clause negating one complete assignment to blocks 1 and 2 that has no extension: it
        has support {1,2}, omits block 3, has length exactly 12, and is by construction a proof of
        above-leaf pruning at depth (m-1)l. The record's narrow_clause_count scores it as 0.
      heuristic_challenges:
      - 'H1 and H2 are numbered with rigorous and imitated halves separated and with validation plans; H1''s rigorous half was checked against the frozen source and is correct.'
      - 'H2''s imitated law is semi-regularity of the generic system. As with a6f98e, KN-FIND-006 has already MEASURED a structural departure from semi-regularity on this exact family (a rank deficit of exactly 8*dim(V) at degree 4), so the imitated law is known not to hold at low degree for this object. The record reuses that finding''s rank engine while relying on the law it partly refutes; the tension should be stated in obstructions.'
      cost_model_challenges:
      - 'Memory is stated beside time (proof traces 2^{ml}/m! clauses, Macaulay columns under a 4 GiB contract, both as peak RSS). Correct.'
      - 'No per-attempt/total-cost confusion: no end-to-end claim is made.'
      reduction_and_scope_challenges:
      - 'Correctly states that zero narrow clauses on tested solvers is not a proof that none is derivable, and that D_elim lower bounds are bounds not values.'
      - 'The conditional stake (a small D_elim would drop the exponent toward (m-1)l) is stated with an honest prior <= 0.05 and is not asserted.'
      proof_architecture_challenges:
      - 'The baseline embedding at l = 3 (brute-force elimination ideal by enumerating the 64 pairs) is exact, cheap and checkable -- the best baseline fixture in the SAT set.'
      - 'The stronger-compositional-invariant transform is correctly applied (track support, which survives resolution, rather than the final leaf count).'
      - 'The method ceiling correctly refuses to certify that no derivation exists at higher width or degree.'
      obstruction_reversals:
      - |-
        Obstruction to be measured: D_elim is large, i.e. an ideal element that EXISTS at degree 1 is
        not DERIVABLE below a high Macaulay degree. Reversal: a large gap between existence and
        derivability of a low-degree elimination element is exactly the hypothesis of the last-fall-
        degree machinery the record cites (KN-LIT-7607 via 84cdb7) and, more usefully, it is the
        hypothesis of proof-complexity separations between polynomial calculus and Nullstellensatz.
        A measured family where a degree-1 consequence requires degree D to derive is a candidate
        separation witness. The record files the gap as its obstruction and does not read it forward;
        IDEA-20260806-e4f96e is the in-corpus record that would take it up, and it is not cited here.
      narrowest_supported_statement: |-
        On the tested proofs, solvers, orders and cells, a CDCL solver on the binary pdp learns no
        clause of length strictly below (m-1)l whose block support omits a block, and D_elim(m-1, e)
        exceeds the largest Macaulay degree reachable under the memory contract at l >= 4. Nothing is
        established about clauses of length exactly (m-1)l -- which the metric excludes -- nor about
        derivability at untested widths or degrees.

    IDEA-20260905-a94b5f:
      set: sat_smt
      record_own_claim_tag: '(A) |Aut| = m! on generic V, (B) |Aut| = m! on torsion-invariant V, (C) |Aut| = 1 on the null'
      J1:
        verdict: holds
        attack: 'Read IDEA-20260904-3c7a91 in full, in particular its (C)(ii) naming of |G| enlargement via torsion as a lever.'
        result: |-
          Distinct. 3c7a91 names the lever and supplies no detection method and no prediction about
          syntactic visibility; this record supplies a solve-free instrument and predicts the lever is
          invisible to it. The difference changes what is measured, not the notation.
      J2:
        verdict: holds
        attack: |-
          Enumerator-in-disguise test: asked whether the tracked object is a search at all, and whether
          the pipeline stage and target kind are stated.
        result: |-
          The object is the automorphism group of the clause-variable incidence graph, not a search;
          pipeline_stage (factor-base design and decomposition) and target_kind (amortised constant,
          bits of |G| beyond log2 m!) are both stated. The lossy-projection audit is done and correctly
          identifies the semantic symmetry group of the solution set as the projection that fails
          (not computable without solving).
      J3:
        verdict: inconclusive
        attack: 'Recomputed the charged path and looked for an unpriced prerequisite.'
        result: |-
          Detection is polynomial and charged; breaking-clause overhead per node is named. BUT THE WHOLE
          (B) ARM DEPENDS ON AN UNCOSTED PREREQUISITE: Stage 0 must "construct a torsion-invariant V at
          l in {4..6} (or record that none exists at that l)". Whether such a V exists at toy l, and at
          what cost, is the load-bearing feasibility question for the record's headline claim, and it is
          carried as an assumption ("an explicit construction is a Stage-0 obligation, not assumed")
          without an estimate. If no torsion-invariant V exists at the tested l, (B) is untested and the
          record reduces to (A) plus (C), which is an encoder sanity check.
      J4:
        verdict: inconclusive
        attack: |-
          Listed the rows and asked what dominates the record on its own declared axis (bits of |G|),
          rather than on the attack axis.
        result: |-
          dominated_by handles the attack axis correctly (enumeration, MITM, rho) and identifies the
          source's own m! quotient as the row it reproduces. But on the record's OWN axis -- bits of
          |G| -- it says "FHJRV symmetrization (recalled) may dominate on bits but is not a SAT
          detection result". That is a dismissal, not a comparison. FHJRV symmetrized summation
          polynomials are precisely the closest specialised baseline for "how many bits of symmetry can
          be exploited", the record's (B) predicts those bits must come from re-modelling rather than
          detection, and the number of bits FHJRV actually achieves is neither quoted nor bounded. The
          one row that could dominate the record's own axis is left unquantified and unopened.
      J5:
        verdict: breaks
        attack: |-
          Tested whether the declared null's predicted value is derived for the encoding actually used,
          by asking what a random-coefficient system's CNF encoding actually looks like.
        result: |-
          THE NULL'S PREDICTED VALUE IS JUSTIFIED BY THE WRONG MODEL. Prediction (C) is |Aut| = 1 on N0,
          justified by H1's imitated law "random graphs are asymmetric (Erdos-Renyi, recalled)". The
          object is not a random graph: it is the clause-variable incidence graph of a Tseitin/XOR-cut
          encoding, which contains many structurally identical gadgets (one per substituted monomial,
          one per cut XOR), and such gadgets routinely contribute non-trivial automorphisms that have
          nothing to do with the coefficients. A non-trivial group on N0 is therefore likely for
          encoding reasons, and the record's falsification conditions would read it through F1 ("extra
          bits or an encoder defect") rather than as the encoding artifact it is. The null needs an
          ENCODING-MATCHED prediction -- computed on the same encoder with randomised coefficients and
          reported as the baseline group, whatever it turns out to be -- not a random-graph prediction.
          The planted-symmetry known-false object is well chosen and is unaffected by this.
      J6:
        verdict: breaks
        attack: |-
          Checked the provenance of the citations supporting the record's central claim (B), which is a
          claim about what the Galbraith-Gebregiyorgis construction does.
        result: |-
          (B) is a claim about a specific published construction, and BOTH sources are `recalled` and
          unopened: FHJRV (EUROCRYPT 2014, source reference [10]) and Galbraith-Gebregiyorgis (INDOCRYPT
          2014, source reference [14]), each marked "Not read". BreakID is retrieved at search-snippet
          level only, with the record disclosing "The PDF fetch returned unreadable content; internals
          not confirmed" -- so the instrument's own capabilities are also unconfirmed. The record is
          honest about all three, and its H2 is checkable by brute force at l <= 8, which is the right
          mitigation for the mathematical half. But the claim that a torsion-invariant V of the GG kind
          exists and behaves as described rests entirely on unopened sources.
      objections:
      - 'The N0 null prediction |Aut| = 1 is derived from a random-graph law and not from the encoding actually used; encoding gadgets plausibly produce non-trivial automorphisms that the record would read as a finding.'
      - 'The one baseline that could dominate the record''s own axis (FHJRV torsion symmetrization, bits of |G|) is dismissed rather than quantified, and is unopened.'
      - '(B)''s prerequisite -- the existence and construction of a torsion-invariant V at toy l -- is uncosted, and the whole arm is void without it.'
      - 'Both sources for (B) are `recalled` and unread, while (B) is a claim about what those sources'' construction does.'
      required_controls:
      - 'Compute the encoding-matched baseline group: run the detector on N0 through the SAME encoder and report whatever group it returns as the null value, before any real-instance number is interpreted.'
      - 'Run the detector on two encodings of the same system (CNF and CNF-XOR) and require equal group order -- the record already declares this and it is the right encoding control.'
      - 'Open FHJRV and Galbraith-Gebregiyorgis, or restate (B) as a conditional claim about a construction this program has not read.'
      counterexample_or_mutation: |-
        Cheapest mutation exposing the null defect: take the real pdp CNF and randomise only the
        COEFFICIENTS of the descended equations, leaving every substitution gadget and XOR cut
        structurally identical (this is exactly the record's N1-style null). Any automorphism the
        detector finds on that object is by construction an encoding symmetry, not a curve symmetry.
        If the returned group is non-trivial, prediction (C) is refuted for a reason unrelated to the
        elliptic curve, and the record's F1 branch would have mis-attributed it.
      heuristic_challenges:
      - 'H1 and H2 are numbered with rigorous and imitated halves separated. H2''s rigorous half (x(P + T) is a non-linear rational function of x(P)) is correct, and its exhaustive hyperoctahedral membership test at l <= 8 is the right validation -- a signed coordinate permutation is a strong and checkable condition.'
      - 'H1''s imitated law (Erdos-Renyi asymmetry) does not transfer to the object at hand. This is the random-model-transfer failure the target profile asks the Red Team to name: the structured object here is a gadget-rich encoding graph, not a uniformly random graph, and the cheapest experiment that would expose the deviation is the coefficient-randomised encoding run above.'
      cost_model_challenges:
      - 'Detection cost is polynomial and stated; breaking-clause overhead named. The uncosted item is the Stage-0 construction (J3).'
      reduction_and_scope_challenges:
      - 'Correctly limits itself to SYNTACTIC symmetries and states it cannot bound semantic ones.'
      - 'goal_applicability asserts a "zero-solve check on that campaign''s frozen fixtures" for GOAL-SATIC-c49b77, a campaign owned by another session with open impediments. Coordination claim, not a scientific one.'
      proof_architecture_challenges:
      - 'The baseline embedding (generic V at l = 6, m = 3, predicted |Aut| = 6 with generators verified by clause-set invariance) is exact and checkable.'
      - 'The quantifier-order block correctly identifies the quantifier over V as the one at risk.'
      obstruction_reversals:
      - |-
        Obstruction to be measured: the torsion action is not a literal permutation, so a syntactic
        detector cannot see it. Reversal: "this symmetry is real but syntactically invisible" is the
        defining hypothesis of the symmetry-aware-encoding literature -- it says the encoding, not the
        solver, is the object to change, and it prices the FHJRV re-modelling route in advance. The
        record states this ("the bits must come from re-modelling, which fixes the cost of the open
        problem before it is attempted"), which is a correct forward reading; what it does not do is
        quantify the bits, which is what would make the reading actionable.
      narrowest_supported_statement: |-
        At the tested cells and encodings, the syntactic automorphism group of the pdp CNF is the block
        interchange S_m, worth log2 m! bits; a translation by a rational 2-torsion point induces a
        permutation of V that is not a signed coordinate permutation and is therefore not a literal
        permutation of the encoding. Nothing follows about semantic symmetries, about the bits FHJRV
        re-modelling achieves, or about the null's group order until that is measured on the same
        encoder.

    IDEA-20260905-79112a:
      set: sat_smt
      record_own_claim_tag: '(A) no amortisation across targets, (B) the batched-enumeration row 2^n/m! at memory m!2^l'
      J1:
        verdict: holds
        attack: 'Read IDEA-20260904-7fd218, IDEA-20260904-96c4f3 and IDEA-20260808-bfa0b9 in full and compared objects.'
        result: |-
          Distinct. 7fd218 toggles learning WITHIN one target; this measures learning ACROSS targets
          under assumptions. bfa0b9 batches ALGEBRAICALLY over F_p by adjoining y with the target-set
          polynomial g_T(y) and measures solving degree; this batches via CDCL assumption literals over
          F_2 and measures a clause histogram. Both diffs are stated and correct, and the record
          volunteers that the batched row is "very likely folklore" and claims no novelty for it.
      J2:
        verdict: holds
        attack: 'Asked whether the record hides an enumerator: is the batched row a search with a leaf test, and is the SAT arm a per-target enumeration?'
        result: |-
          Neither is hidden. The batched row is explicitly arithmetic ("elementary and probably
          folklore"), and the SAT arm is predicted to be a per-target search -- the record's own
          conclusion (C). No claimed exponent is smuggled past an enumeration bound.
      J3:
        verdict: breaks
        attack: |-
          Recomputed the batched row end to end and checked which stages of the relation phase it
          covers.
        result: |-
          THE ARITHMETIC IS RIGHT AND THE FRAMING IS NOT. Verified: C(|B|+m-1, m) is about
          2^{lm}/m! = 2^n/m! at l = n/m; the number of targets needed for 2^l relations is T = m!*2^l
          (each target yields about 1/m! relations by KN-FIND-007's exact mean), which matches the
          record's m!*2^{n-(m-1)l}; and the ratio to 96c4f3's per-target row m*2^n is exactly
          m*m! = 18 at m = 3. BUT: (i) the row is presented as "correcting" 96c4f3's poly-memory row
          when it is a DIFFERENT MEMORY POINT (m!2^l versus poly), so it is a new row on the frontier,
          not a correction of an existing one; (ii) 96c4f3 already carries a memory-assisted row D at
          time 2^{2n/3} with memory 2^{2n/3}, which beats 2^n/m! on time, so "the batched
          relation-collection row that end-to-end charging should use" is not the right description of
          a row that its own cited neighbour already beats in time; (iii) the phrase "C(|B|+m-1, m) + T
          hash lookups" mis-labels the lookups -- there is one lookup per enumerated multiset
          (2^n/m! of them) and T insertions -- though the stated TOTAL, 2^n/m! + T, is correct;
          (iv) the storage of the 2^l relations and the subsequent linear algebra are not in the row the
          record asks end-to-end charging to use.
      J4:
        verdict: breaks
        attack: |-
          Listed the frontier rows named, then added the closest SPECIALISED baseline for the record's
          own declared axis (amortisation across T targets), which is multi-target rho rather than
          anything in the pdp literature.
        result: |-
          THE CLOSEST SPECIALISED BASELINE FOR A MULTI-TARGET CLAIM IS ABSENT FROM dominated_by. The
          record checks "Pollard rho / VW, the per-target loop, the table row, MITM and BSGS" -- all
          single-target rows -- and never names multi-target rho (Kuhn-Struik, SAC 2001; generic
          hardness analysed by Yun, eprint 2014/637), which solves T instances in the same group at
          about sqrt(T*N) rather than T times sqrt(N). At the record's own operating point
          T = m!*2^{n/3} and N = 2^n, sqrt(T*N) is about 2^{2n/3} -- computed here: 2^{41.3} at n = 60,
          2^{61.3} at n = 90, 2^{81.3} at n = 120, against the batched row's 2^{57.4}, 2^{87.4},
          2^{117.4} -- at memory about T, i.e. the SAME order as the batched row's m!2^l. On the numbers
          the record itself supplies, a row it does not name dominates it on time at comparable memory
          for every n >= 90 and by a growing margin. PROPERLY HEDGED: Kuhn-Struik's sqrt(L*N) upper
          bound is stated for L much smaller than N^{1/4}, and T = 2^{n/3} exceeds N^{1/4} = 2^{n/4}
          (verified: 2^{22.6} versus 2^{15.0} at n = 60), so the row may not apply unmodified at that T.
          That check is exactly what is missing: the record must either cite the row and show it does
          not apply at its T, or accept domination. The corpus already knows the row --
          IDEA-20260808-2e14f7's dominated_by names "Kuhn-Struik multi-target" -- so this is an omission,
          not an unavailable comparison. dominated_by says "Not null", and it is not; it is incomplete
          on the one axis the record claims.
      J5:
        verdict: holds
        attack: |-
          Named the artifact: "learned clauses contain assumption literals" is a property of
          assumption-based CDCL, not of the pdp, and would be reproduced on any formula. Asked whether
          the controls separate that from a genuine no-amortisation finding, and what parameter should
          destroy the signal.
        result: |-
          The controls do separate it. The known-false object is the SAME TARGET REPEATED T times, on
          which amortisation must be near-total (repeated_target_gain >= 0.99 for targets 2..T); an
          interface that could never amortise would fail there and the record declares that a plumbing
          failure with no result. The N0 null wires target bits randomly. The decay/growth parameter is
          T, swept over {1, 10, 100}, with reuse_gain and the total-conflict ratio measured as functions
          of it -- so a quantity that stayed flat when it should move would be visible. Fresh-solver
          baselines are declared for every warm run.
      J6:
        verdict: holds
        attack: 'Checked the retrieved-at-snippet-level externals against their roles.'
        result: |-
          IPASIR (ipasir_assume/ipasir_failed) and Fazekas et al. LPAR 2024 are both marked
          "search-snippet level; primary not opened" and are load-bearing on nothing beyond the
          existence of the interface. KN-FIND-007 is internal, read in full, and supplies the double
          count the batched row rests on -- I confirmed the finding states exactly that
          ("every size-m multiset sums to exactly one target") and that the mean is exact rather than
          heuristic.
      objections:
      - 'MULTI-TARGET RHO IS ABSENT FROM dominated_by, and on the record''s own numbers it dominates the batched row on time at comparable memory for n >= 90 unless the regime condition T << N^{1/4} defeats it -- a check the record does not perform.'
      - 'The batched row is a NEW frontier point at memory m!2^l, not a correction of 96c4f3''s poly-memory row, and 96c4f3''s own table row already beats it on time.'
      - 'The row that "end-to-end charging should use" excludes relation storage and linear algebra.'
      - '"C(|B|+m-1, m) + T hash lookups" mis-labels the lookup count; the stated total is nonetheless correct.'
      required_controls:
      - 'Add multi-target rho (Kuhn-Struik / Yun) as an explicit frontier row with the regime condition stated, and either show it does not apply at T = m!2^{n/3} or record the domination.'
      - 'Keep the repeated-target known-false object; it is the control that makes (A) readable.'
      - 'Report the batched row with its memory and with the downstream linear-algebra stage named as excluded.'
      counterexample_or_mutation: |-
        No counterexample to (A) or to the row's arithmetic; both survived recomputation. The decisive
        mutation is on the Pareto claim: instantiate the batched row and the multi-target rho row at
        n = 60, 90, 120 with the memory of each stated, as computed above. If the regime condition
        rescues the record, that fact belongs in dominated_by; if it does not, the record's frontier
        claim must be withdrawn while (A) survives untouched.
      heuristic_challenges:
      - 'H1 and H2 are numbered with rigorous and imitated halves separated. H2 rests on KN-FIND-007''s exact mean, which is a double count rather than a heuristic -- correctly identified.'
      - 'H1''s imitated law ("in assumption-based CDCL a conflict whose reason chain reaches the assumption levels yields a clause containing assumption literals; the assumption is that every conflict''s chain does") is exactly the right thing to have isolated, because it is the step where a solver-interface property could masquerade as a mathematical one.'
      cost_model_challenges:
      - 'Memory is stated beside time for both rows. Correct.'
      - 'Total cost is computed as per-target cost times number of targets with the yield in the denominator (T = m!2^{n-(m-1)l} from KN-FIND-007''s mean), i.e. per-attempt cost times inverse success probability. No bookkeeping error.'
      reduction_and_scope_challenges:
      - 'Claim tier toy; the batched row is labelled arithmetic and not an attack; "no exponent moves; the batched row stays about 2^{n/2} above rho". Correct.'
      proof_architecture_challenges:
      - 'The baseline embedding (T = 1 reproduces 3c7a91''s single-target count; the repeated-target control must cost one search plus T-1 immediate answers) is exact and cheap.'
      - 'The specialize-measure-pack transform is correctly applied over proved-disjoint blocks (each multiset sums to exactly one target).'
      obstruction_reversals:
      - |-
        The record's negative -- SAT learning amortises nothing across targets -- is supported by a
        mechanism (the curve-only clause set is satisfiable for every core assignment, so its
        consequences are trivial) and by a known-false object, which meets the section-4 standard. The
        reversal on the measurement: "every learned clause is target-dependent" is the hypothesis under
        which a per-target search is EMBARRASSINGLY PARALLEL with no shared state, which is the
        favourable reading for a distributed implementation and is the opposite of the record's framing.
        It changes no exponent and is filed as a finding only.
      narrowest_supported_statement: |-
        On the tested cells, solvers and target sequences, incremental assumption-based solving across
        T pdp targets costs T times the single-target cost within the stated band and yields no reusable
        learned clause; and enumerating all m-multisets once against a hash set of T targets costs about
        2^n/m! operations at memory about m!2^l for the whole relation phase, excluding relation storage
        and linear algebra. Whether that row sits on the frontier is unresolved until multi-target rho
        is placed beside it.

    IDEA-20260905-3993c3:
      set: sat_smt
      record_own_claim_tag: '(A) the coverage quantity, (B) hashed calls cost at least the ceiling, (C) outcomes'
      J1:
        verdict: holds
        attack: 'Read 3c7a91 in full, plus bfa0b9 and c6e7a4 which the record diffs against.'
        result: |-
          Distinct. It extends 3c7a91's depth argument to a NEW CONSTRAINT TYPE (XOR hashes over target
          bits) rather than restating the ceiling, and the diffs against bfa0b9 (constrained y versus
          unconstrained r-bits; solving versus counting; F_p versus F_2) and c6e7a4 (whose exhaustive
          enumeration the record names as the dominating measurement row for its own quantity) are
          stated and correct. Naming your own dominating row inside your novelty screen is the right
          behaviour and is credited.
      J2:
        verdict: holds
        attack: 'Asked whether the hashed search is presented as something other than the same complete enumerator.'
        result: |-
          It is not: the record says each hashed formula "is solved by the same complete search" and
          predicts the hash-level cost curve is flat. The enumerator status is the claim, not a
          concealment.
      J3:
        verdict: breaks
        attack: |-
          Recomputed the record's own headline domination factors from its own cost formulas.
        result: |-
          THE HEADLINE FACTORS ARE NOT DERIVABLE FROM THE RECORD'S OWN NUMBERS WITHOUT AN UNSTATED
          QUANTITY. target_complexity gives counter cost = calls x 2^{ml}/m! and exact enumeration =
          2^{ml} 2^{m-1}/m!. Their ratio is therefore calls/2^{m-1} = calls/4 at m = 3 -- verified at
          l = 4, 5, 6 (enumeration 2731, 21845, 174763 against per-call 683, 5461, 43691). So the
          claim "at least 10^2 x the exact enumeration" requires at least 400 hashed calls, and
          prediction 3 ("counter_total_cost / exact_enumeration_cost >= 100 at every cell") is an
          assertion about the counter's call count, which the record never states. Likewise
          "at least 10^3 x loop-sampling" gives calls x 2^l/(m*S), which at l = 6, S = 100 needs about
          4700 calls. Retrieved for comparison: ApproxMC-style counters use O(log n * log(1/delta))
          bounded-SAT invocations with O(1/epsilon^2) SAT calls each, so the call count is a function of
          (epsilon, delta) that the record does not declare. The record's negative conclusion may well
          hold; its two stated magnitudes are unsupported by its own arithmetic.
      J4:
        verdict: inconclusive
        attack: 'Checked dominated_by against loop-sampling, exact enumeration and rho.'
        result: |-
          The direction is right and honest ("loop-sampling and exact enumeration dominate the counter
          on time and memory at every tested cell; rho dominates all"; "Not null"). But the magnitudes
          carry the same defect as J3: the dominance is asserted at ">= 100x" without the call count
          that determines it. Dominance almost certainly holds; the quantitative claim does not follow
          from the record.
      J5:
        verdict: holds
        attack: |-
          The record predicts a FLAT curve, and a quantity that stays flat is the canonical artifact
          tell. So I asked whether the record has an object on which the curve must NOT be flat.
        result: |-
          IT DOES, AND IT IS THE RIGHT ONE. The known-false object is XOR hashes over the CORE variables
          instead of the r-bits, where N_conf(k)/N_conf(0) must fall by about 2^{-k} because those rows
          become unit early; failure to collapse there is declared an instrument failure. That converts
          the predicted flatness from an artifact tell into a controlled result, and the decay parameter
          k is explicitly the observable swept. The PAC calibration against the exactly known
          unprojected count (from KN-FIND-007 conservation) is a second, independent instrument check.
          This is a well-built control set.
      J6:
        verdict: holds
        attack: 'Checked the ApproxMC citation against its role and retrieved the call-count facts the record leans on implicitly.'
        result: |-
          arXiv:1306.5726 is retrieved at abstract level and the record explicitly says "the XOR-hashing
          mechanism is recalled from secondary sources, not read in the primary" -- accurate, and the
          abstract does say the counter uses a polynomial number of SAT calls. My own retrieval adds the
          quantitative form (O(log n log(1/delta)) bounded-SAT invocations, O(1/epsilon^2) SAT calls
          each), which is precisely the number the record needed for J3 and did not fetch. No
          misattribution; an incomplete retrieval on the one point that carries the headline.
      objections:
      - 'THE ">= 100x" AND ">= 10^3x" DOMINATION FACTORS DO NOT FOLLOW from the record''s own formulas: its ratio to enumeration is calls/2^{m-1}, so >= 100x needs >= 400 calls, and the call count is never stated or derived.'
      - 'The counter''s (epsilon, delta) are not declared, although they determine the call count and therefore the headline.'
      - 'recommended_priority low is consistent with the record''s own predicted negative; nothing here argues for raising it.'
      required_controls:
      - 'Declare (epsilon, delta) and derive the expected call count BEFORE the run; report the measured call count as a primary metric, since it is the quantity the domination claim rests on.'
      - 'Keep the core-variable-hash known-false object; it is what makes a flat curve readable rather than an artifact.'
      counterexample_or_mutation: |-
        No mathematical counterexample; the defect is arithmetic. The mutation: restate prediction 3 as
        "counter_total_cost / exact_enumeration_cost = calls/2^{m-1}, with calls measured", which is
        both true and testable, instead of "= >= 100". This costs nothing and converts an unsupported
        magnitude into a measurement.
      heuristic_challenges:
      - 'H1 (hash inertness) and H2 (coverage law) are numbered with rigorous and imitated halves separated; H2 rests on KN-FIND-007''s exact mean plus a Poisson half, correctly attributed.'
      - 'H1''s rigorous half ("r-bits are undetermined until all core variables are set") is the same structural fact as 3c7a91''s and is sound for the declared encoding; the imitated half (random parity constraints satisfied by half of all completions) is standard and correctly labelled.'
      cost_model_challenges:
      - 'Time and memory stated together (enumeration coverage bitmap 2^n bits, counter poly). Correct.'
      - 'The missing multiplier is the call count, which is the whole of the cost claim (J3).'
      reduction_and_scope_challenges:
      - 'Correctly limits a negative to "ApproxMC-style counting on this encoding at these cells". No inflation.'
      proof_architecture_challenges:
      - 'The observable-fiber transform is correctly applied (hold N_conf fixed, vary k; predicted flat) and paired with the object where it must NOT be flat.'
      - 'Baseline embedding at k = 0 reproduces the free-target single search of 79112a, and l = 3 is exactly enumerable. Correct.'
      obstruction_reversals:
      - |-
        The record files a priced tooling negative. Reversal on its measurement: a formula whose
        projected variables are determined only at the leaves is a formula on which hashing-based
        counting is provably useless -- which makes this family a clean negative BENCHMARK for the
        model-counting community, where such families are sought precisely because they separate
        hashing-based counters from enumeration. The record delivers the coverage curves regardless,
        which is the right disposition; the reversal is that the negative itself has an audience.
      narrowest_supported_statement: |-
        On the tested cells, XOR hashes over the target bits of the free-target pdp formula do not
        reduce the conflict count below the ceiling, and the projected count is obtainable more cheaply
        by exact enumeration, with the conservation identity as an exact calibrator. The size of the
        counting disadvantage is calls/2^{m-1} and is not established until the call count is declared
        and measured.

  proves_too_much_control:
    assigned_to: TASK-20260905-ac087e
    objects_run:
    - object: 'the same curve under a uniformly random PGL_2(F_p) reparametrisation of each coordinate (no stage cost may change)'
      result: |-
        No record's argument survives where it must not. d0fee4's (C1) is invariant because a Moebius
        map permutes windows, and (C2)/(C3) are invariant at n = 2; 579fcc's meter is invariant because
        the multiset is relabelled; 24b41a is unaffected (the torsor coordinate is not a coordinate on
        the line); 0e0982 declares the PGL_2 battery on x before gluing. ab4a6e is the one record whose
        object is NOT PGL_2-invariant -- the box is defined by a specific lattice presentation of the
        specific field element x -- but its claim is a null on generic curves, so predicting "no change"
        is consistent, and its declared control ("PGL_2 battery on the coordinate before boxing") would
        detect the interaction. No survival.
    - object: 'a shape-matched random Boolean or random F_p polynomial system with the same variable blocks and monomial supports (no solver saving attributable to structure)'
      result: |-
        All six SAT records predict COLLISION with the shape-matched null on their primary observable,
        which is the correct prediction for an argument that attributes nothing to the curve. Two
        records pre-register a possible real-versus-null SEPARATION and correctly identify it as the
        localising outcome rather than as the expected one: a6f98e on the D_NS axis (citing
        KN-FIND-006's non-generic syzygies as the reason a separation is possible there and nowhere
        else) and 3de445 on D_elim. No record's argument yields its claimed saving on the null. No
        survival.
    - object: 'a prime cyclic group (Z/N, +) given only as a black-box group (no non-generic saving exists)'
      result: |-
        SURVIVAL FOUND, IN ONE PLACE. 579fcc's (M4) asserts "Every function of a multiset of x-values
        under group operations is generic-group simulable ... so nothing in class (9) beats
        Omega(sqrt N)". Run unchanged on the black-box prime cyclic group, this argument goes through
        and returns the correct answer -- but it goes through for the wrong reason, because it never
        used the elliptic curve at all: the step "x used only for equality and hashing" is doing all the
        work, and it is an assumption about the ALGORITHM, not about the object. The same argument
        applied to a field-structured statistic (a character sum over the multiset) would also "go
        through" and would there be false, since such a statistic is not generic-group simulable. THE
        LOCATION OF THE SURVIVAL is the unstated universal quantifier over algorithms in (M4)'s first
        clause. The record recovers the correct scope one sentence later; the sentence that closes
        class (9) does not carry it.
    additional_object_run_by_reviewer:
      object: 'an integer-then-reduce encoding of the modular constraint S = lambda*p with lambda a bounded auxiliary (an encoding on which "node count is encoding-invariant" is false)'
      result: |-
        SURVIVAL FOUND. 24d827's confounder "per-node cost is affected, node count is not" predicts the
        same leaf count on this encoding. It is false there: the low bits of S are determined by the low
        bits of the digit inputs while the admissible lambda count is bounded by (bound on S)/p, so
        low-bit assignment constrains lambda and produces above-leaf conflicts. The argument survives
        onto an object where its conclusion fails, and the survival happens at the confounders clause
        rather than in claim (A) itself -- which is why the record's own 10 percent band is a guess
        rather than a derivation.

  ranking_input:
    return_for_additive_revision:
    - id: IDEA-20260905-ab4a6e
      why: 'The CM positive control is mis-specified (the declared box is not unit-stable for D = -3; the unit group is trivial for |D| in {7,8}), so the battery cannot license its predicted null. One-line repair: use a norm ball. Highest revision value per word in the representation set.'
    - id: IDEA-20260905-3de445
      why: 'The primary metric''s threshold (length < ml - l = (m-1)l) excludes the exact clause that would witness above-leaf pruning at the enumeration depth, and the known-false object fires only at length 2 so it cannot detect the blindness. Also duplicates a6f98e''s UNSAT algebraic arm. Repairs are trivial and the record is otherwise the strongest mechanism proposal in the SAT set.'
    - id: IDEA-20260905-79112a
      why: 'dominated_by omits multi-target rho, the closest specialised baseline for its own amortisation axis, which on the record''s own numbers dominates the batched row on time at comparable memory unless the regime condition rescues it. (A) is unaffected and survives.'
    - id: IDEA-20260905-d0fee4
      why: 'The baseline-embedding claim is false as stated (factor 2^{m-1} against dadcd2), the membership convention that produces the headline 4.5 is undeclared, and the record makes a committed point prediction that contradicts the draft contract EXP-MODEL-5c4f24 without citing it. The mathematics of (C1) and (C2) survives and is worth having.'
    - id: IDEA-20260905-24b41a
      why: '(T3) is false as stated for admissible cross-ratio indices (second-order balance condition missing) and (T2) does not cover the quadratic biextension invariant that is the cited construction''s natural output. Both repairs are available and cheap; the 0-bit conclusion survives them.'
    - id: IDEA-20260905-3993c3
      why: 'The two headline domination magnitudes do not follow from the record''s own formulas without a call count it never declares. The negative direction is probably right and the control set is good; the numbers must be restated as measurements.'
    - id: IDEA-20260905-579fcc
      why: '(M4) closes brief class (9) on a sentence broader than its own sources support, and its two supports are in-repo files marked `recalled` and unopened. (M1)-(M3) are correct and I verified (M1) independently; the closure scope should be narrowed to class (7) plus the shift/orbit sub-family.'
    - id: IDEA-20260905-a94b5f
      why: 'The null''s predicted |Aut| = 1 rests on a random-graph law that does not describe a gadget-rich encoding graph, so a likely encoding artifact would be read as a finding; and the one baseline on its own axis (FHJRV bits) is dismissed rather than quantified.'
    ready_for_design_experiment_ranking:
    - id: IDEA-20260905-24d827
      caveat: 'Ready, provided the contract runs at least two modular-reduction encodings and reports node counts separately. The encoding-invariance assertion is the one load-bearing step and it is cheap to test. Pareto block, heuristic block, controls and scope discipline are all sound.'
    - id: IDEA-20260905-a6f98e
      caveat: 'Ready for the certificate-two (D_NS) arm and the calibration objects, which are the genuinely new content. Certificate one should be labelled a consequence of IDEA-20260904-3c7a91 rather than an independent prediction, and the pipeline-level certification cost must be restricted to per-instance claims or charged.'
    - id: IDEA-20260905-0e0982
      caveat: 'Mathematically sound and independently verified, but by its own statement it must be run as one contract with H-ECDLP-f9a627 rather than dispatched separately, and it is dominated by N^{1/2} with high implementation cost. Rank accordingly (its own recommended_priority low is right).'
    cheapest_decisive_test_across_the_batch:
      test: 'IDEA-20260905-d0fee4 Stage 1, run with both membership conventions pre-registered.'
      specification: |-
        At one toy prime (p about 2^12, extended to 2^16 if the interval is inconclusive), on three
        prime-order curves, and for each of f in {x, y, r o x with deg r = 2}, draw 10^3 random windows
        W of size B in {32, 128, 512} and report TWO integers per cell: (a) the number of rational
        points P with f(P) in W, and (b) the number of distinct values in W that carry at least one
        rational point. Run the adaptive-window known-false object (W_f = full-fibre values for f = y),
        which must return ratio about 3, and the PGL_2 and translation-conjugate nulls.
      what_it_decides: |-
        Four committed predictions at once, with a counting loop that uses no elimination, no solver and
        no tuning. (i) IDEA-20260808-2e14f7's HA-1 (|V| about d*B) against d0fee4's (C1) (|V| about B):
        quantity (a) separates them at every B. (ii) The membership convention: quantity (b) is the
        tight membership degree, predicted about B/2 for x and about 2B/3 for y, which is what
        IDEA-20260807-dadcd2 (L3) and IDEA-20260807-5f5ace (C) implicitly assume and what
        EXP-MODEL-1554cd (E) uses to kill the isogeny pullback. (iii) The contradictory Bezout ratio:
        4.5 (d0fee4) versus exactly 2 (5f5ace / EXP-MODEL-5c4f24) follows from (a) and (b) without any
        symbolic elimination. (iv) IDEA-20260905-ab4a6e's first prediction (box size within 1 +-
        3/sqrt(B)) is the same measurement on a different window shape and can share the loop.
      why_cheapest: |-
        Minutes of counting on a toy curve; no solver, no Groebner basis, no proof format, no external
        dependency, and a known-false control that proves the counter is not blind. Every other decisive
        test in the batch needs a built checker (a6f98e), a proof-trace parser plus a rank engine
        (3de445), an IPASIR-UP build (24d827 arm UP) or genus-2 arithmetic (0e0982).

  objections:
  - 'BATCH-LEVEL, CITATION DISCIPLINE: four records (579fcc, ab4a6e, and by inheritance the closure language of both) mark IN-REPO records as `recalled` while leaning on them -- KN-FIND-b7e091, KN-TECH-005, KN-LIT-004, IDEA-20260903-81a943. AGENTS.md rule 9 makes a `recalled` reference a pointer that supports nothing; these are files in this repository readable at zero cost, and in the two cases I opened (KN-FIND-b7e091, KN-TECH-005) the sources do not state what the citing clause claims. This is the batch''s most systematic defect and it is entirely repairable.'
  - 'BATCH-LEVEL, STALE ABSENCE ASSERTION: five SAT records state that GOAL-SATIC-c49b77 BATCH-1a527c''s intake.md and benchmark-obligations.json are "absent from the tree at task time". Both exist as blobs AT THE REVIEWED SNAPSHOT COMMIT de6ca2d5 (committed by d445fdbe, an ancestor, at 09:26 on 2026-09-05, before the producer bundles at 22:47/22:55). The assertion is therefore false against the archive in which these records are durable. I checked the substantive diffs against the files'' actual content and they SURVIVE: benchmark-obligations.json lists unsat_certificate_handling as a pending obligation with a requirement and no mechanism (a6f98e''s diff is accurate), and carries no symmetry census (a94b5f accurate), no multi-target protocol and no batched row (79112a accurate), and no learned-clause instrumentation (3de445 accurate). The science is unaffected; the absence claim should be superseded.'
  - 'BATCH-LEVEL, INTRA-BATCH DUPLICATION: IDEA-20260905-a6f98e (B) and IDEA-20260905-3de445 (B) measure the same obstruction on UNSAT instances, because D_elim(m-1, e) <= D_NS for every e >= 0 (the constant 1 is supported on every block subset). The producers were blinded to each other and cannot have caught this; the Coordinator filed both in one archive and should not let one obstruction be counted twice.'
  - 'BATCH-LEVEL, CROSS-GOAL SCOPE: five SAT records assert goal_applicability to GOAL-SATIC-c49b77, a campaign owned by another session with two open impediments. These are coordination claims, not scientific ones, and must not be read as that campaign having accepted, commissioned or been unblocked by this work.'
  - 'See per_proposal for the record-specific objections; they are not repeated here.'

  required_controls:
  - 'Every record whose predicted outcome is a NULL must have a positive control that is verified to be able to fire. Two fail this today: ab4a6e (box not unit-stable) and 3de445 (control fires only far from the boundary the prediction concerns).'
  - 'Every record predicting a FLAT curve must name the object on which the curve must NOT be flat. 3993c3 does this correctly (core-variable hashes) and is the model for the others.'
  - 'Before any closure language is used in 579fcc or 24b41a, open the in-repo records those closures lean on and re-state the closure in the scope the sources actually support.'
  - 'For the representation set, declare the membership-polynomial convention before any Bezout number is reported; it is worth a factor 2^{m-1} and it is the source of a live contradiction between two committed records.'
  - 'For the SAT set, run at least two modular-reduction encodings (24d827) and report the block-support histogram by length rather than a thresholded count (3de445).'

  counterexample_or_mutation: |-
    The four zero-compute counterexamples produced by this review, in decreasing order of consequence:
    (1) ab4a6e (Q4): for D = -3 with omega^2 = omega - 1, multiplication by the unit omega sends
    (u,v) -> (-v, u+v), so the box member (M, M) maps to (-M, 2M) and leaves the box; enumerated escape
    fraction converges to exactly 1/4. The CM positive control fails by construction.
    (2) 3de445 (A): the narrowness threshold ml - l equals (m-1)l, the maximum length of a clause on
    m-1 blocks, so the metric excludes the clause negating a complete unextendable (m-1)-block
    assignment -- the witness of above-leaf pruning at the enumeration depth.
    (3) 24b41a (T3): e1 = (2,0), e4 = (0,0), e2 = e3 = (1,0) satisfies the record's only stated
    condition while leaving a non-zero residual quadratic bracket, so the cross-ratio is not L-periodic.
    (4) 579fcc (M4): the statistic sum_{s in S} chi(x(P + sR)) with chi the quadratic character is a
    function of the multiset, is not generic-group simulable, and refutes (M4) as literally stated.

  baseline_comparison: |-
    Against Pollard rho with distinguished points (0.886*sqrt(N), O(1) memory, 0 queries) and BSGS
    (sqrt(N) time / sqrt(N) memory), all eleven records are dominated on time and none claims otherwise;
    every record states this explicitly and quantitatively, and no dominated_by field in the batch is an
    unchecked null. Against the closest specialised baselines the picture is uneven. The representation
    set correctly names automorphism-discounted rho (KN-TECH-018) where it matters (579fcc M3, ab4a6e CM
    arm), PKM/Semaev prime-field decomposition (KN-LIT-025) throughout, and genus-2 index calculus at
    O~(N^{2-2/g}) for 0e0982 -- which is the strongest and most honest baseline block in the batch,
    since it states its own object is dominated by rho by a factor N^{1/2}. The SAT set correctly names
    the honest enumeration bound of IDEA-20260904-96c4f3 (2^{(m-1)l}/(m-1)!) in every record where it
    applies, and 24d827 additionally names target-keyed MITM. TWO GAPS. (i) IDEA-20260905-79112a omits
    multi-target rho, which is the closest specialised baseline for its own amortisation axis and which,
    on the record's own operating point, gives about 2^{2n/3} against its 2^n/m! at comparable memory --
    subject to the regime condition T << N^{1/4}, which the record must check. (ii) IDEA-20260905-a94b5f
    dismisses FHJRV symmetrization -- the only baseline on its declared axis of bits of |G| -- as "not a
    SAT detection result" rather than quantifying it. Where an invariance or precomputation eliminates a
    search dimension, the invariant's own cost is charged in every record I checked: 24d827 charges the
    propagator's root-finding, 579fcc charges c_can (in the wrong unit, but it charges it), ab4a6e
    charges the Gauss reduction, and 79112a charges the hash-set memory. No record claims a speedup from
    an uncharged eliminated dimension.

  heuristic_challenges:
  - 'FORM: every heuristic in this batch is numbered, formally stated, and split into a rigorous half and a named imitated distribution law with a validation plan and tail checks. That is the exemplar''s structure and the batch meets it. The three strongest blocks are 24d827 (three heuristics, one declared measured-not-asserted), a6f98e (which volunteers its own counter-prior) and d0fee4 (exact double count plus Chebotarev/Burnside).'
  - 'TRANSFER, THE RECURRING FAILURE: the random model is repeatedly justified for a generic object and applied to a structured one. a6f98e H2 and 3de445 H2 both invoke Bardet-Faugere-Salvy semi-regularity for a family on which KN-FIND-006 has already MEASURED a structural rank deficit of exactly 8*dim(V) at degree 4 -- the imitated law is known to fail for this object at low degree, and neither record records the tension in obstructions although both reuse that finding''s rank engine. a94b5f H1 invokes Erdos-Renyi asymmetry of random graphs for a gadget-rich encoding graph. d0fee4 H1 asks a low-height sub-window to inherit a mean whose error term (deg(f)*sqrt(p)) is vacuous at the small end of its own declared range.'
  - 'The cheapest experiments that would expose these deviations are named per record in required_controls: a coefficient-randomised encoding run (a94b5f), a low-degree rank comparison against KN-FIND-006''s measured deficit (a6f98e, 3de445), and the character/norm correlation statistic (ab4a6e).'
  - 'No record presents a heuristic-conditional claim as unconditional, and a6f98e explicitly routes its exponent-bearing outcome (II) to the two-record rule and to review-breakthrough. That discipline is intact across the batch.'

  cost_model_challenges:
  - 'PER-ATTEMPT VERSUS TOTAL EXPECTED COST: only 79112a makes an end-to-end multi-attempt claim and it computes total = per-target cost x number of targets with the yield in the denominator (KN-FIND-007''s exact mean), which is correct bookkeeping. The other ten make per-instance or per-stage claims and say so. One gap: a6f98e''s certification claim is stated at pipeline-stage scope while its costs are per-instance, so the per-campaign multiplier (number of UNSAT attempts) is missing.'
  - 'MEMORY BESIDE TIME: stated in every record. 0e0982, 24d827, a6f98e and 79112a all give explicit memory exponents, and a6f98e volunteers that its proof is as large as its search.'
  - 'CONSTANTS AND UNITS: two unit defects. 579fcc quotes c_can in scalar multiplications while requiring metrics in group operations (a Theta(log N) factor); 24d827 says the enumeration baseline "ties arm (UP) exactly" when it ties on node count and dominates on per-node cost.'
  - 'UNDERIVED MAGNITUDES: 3993c3''s ">= 100x" and ">= 10^3x" require an undeclared call count; 24d827''s 10 percent band for carry-chain pruning is a guess; a94b5f''s Stage-0 construction is uncosted.'
  - 'CONVENTION DEFECT: d0fee4''s Bezout numbers change the membership convention without declaring it, which is worth a factor 2^{m-1} and produces a contradiction with a committed sibling record.'

  reduction_and_scope_challenges:
  - 'CLAIM TIER: every record declares claim_tier toy (or derivation-level for the symbolic parts) and several add explicit no-downstream-raising clauses. No record asserts above its tier.'
  - 'CITED-REDUCTION INSTANTIATION: three records lean on a cited internal theorem and I checked each instantiation. 24d827''s use of KN-FIND-a8990a Theorem C is CORRECT (m-1 rational x-coordinates plus a rational target gives at most 2^{m-1} roots of S_{m+1}). 0e0982''s use of KN-FIND-61347e is CORRECT, including the relay of that finding''s own robustness argument. d0fee4''s use of KN-FIND-a8990a step 3 is NOT correct outside n = 2: that step is proved from properties (P1)-(P2) of the DEGREE-2 map and does not transfer to a general degree-n cover.'
  - 'AFFECTED-VERSUS-SAFE SCOPE: no record inflates the set of affected schemes; none claims any deployed system is affected, and the representation records state that even a positive outcome yields no attack without a separate conversion (0e0982 says this explicitly).'
  - 'CROSS-GOAL SCOPE: the SAT set''s goal_applicability sentences to GOAL-SATIC-c49b77 are coordination claims about another session''s campaign and should be read as such.'
  - 'CLOSURE SCOPE: three records close classes (24b41a: brief classes 2/3/8; 579fcc: 7/9; d0fee4: the degree-d coordinate class). Two of the three close more than they support -- 24b41a''s mechanism misses the quadratic invariant of the very construction it names, and 579fcc''s (M4) is broader than its sources. d0fee4''s closure is correctly scoped to window-defined bases and says so.'

  proof_architecture_challenges:
  - 'BASELINE REPRODUCTION (audit 1): nine of eleven records carry an exact, checkable parameter slice. The two failures are d0fee4 (its n = 2 row does not return dadcd2''s number) and, softly, a94b5f (its baseline is correct but its null''s value is not derived for the encoding used).'
  - 'OBSERVATION COLLISION (audit 2): uniformly well done. Several records PREDICT the collision and name it as the finding (24b41a, 0e0982, 3993c3), which is the correct use of the audit, and a6f98e names the single axis (D_NS) on which a non-collision is possible and why.'
  - 'QUANTIFIER ORDER (audit 3): the batch is strong here. a6f98e explicitly names the restriction quantifier "a naive reading forgets"; 24d827 names the quantifier over theory solvers as at risk; a94b5f names the quantifier over V. The one silent quantifier defect is 3de445''s, whose dimension count is computed on a solution-bearing instance while its prediction is stated on UNSAT instances.'
  - 'METHOD CEILING AND NEARBY OBJECT (audit 4): every record states a strongest-certifiable claim that is narrower than its title, and every record names a nearby object. Two nearby-object choices are defective as controls (ab4a6e''s CM curve, because the box is wrong; 3de445''s redundant-linear object, because it fires far from the boundary).'
  - 'OBSERVATION-FIBER ATTACK, run by this reviewer against the batch''s two "certificate" objects: holding a6f98e''s pair (L_res, D_NS) fixed and varying the instance, the fibre includes both real pdp instances and shape-matched null instances -- which the record predicts and wants on the leaf axis. The separator it proposes (the D_NS axis) is the only one that can distinguish them, and it is also 3de445''s observable, so the two records share their only separator. That is the identifiability consequence of the duplication recorded above.'

  obstruction_reversals:
  - 'Applied to all six records that close a route or price a negative (24b41a, 579fcc, d0fee4, 24d827, 79112a, 3993c3) plus 3de445 and a6f98e, whose deliverables are obstruction measurements. Per-record readings are in per_proposal.obstruction_reversals.'
  - 'The two readings most worth the Coordinator''s attention: (i) 579fcc measures c_can and does not pick up the reversal its own cited neighbour IDEA-20260901-863e36 (C4)-(C6) already supplies -- a non-generic ARITHMETIC SELECTOR with c_can = o(sqrt(r)) is not forbidden by Shoup and would be exponent-relevant, and 863e36 has already frozen one such selector; the forward action is to run 579fcc''s (M3) measurement on it. (ii) 3de445 measures the gap between existence and derivability of a low-degree elimination element and files it as an obstruction; IDEA-20260806-e4f96e is the in-corpus record whose whole subject is exactly that gap as a proof-complexity quantity, and 3de445 does not cite it.'
  - 'All readings above are FINDINGS, not evidence. None changes a status, none is a resource claim, and no spawned_ids are minted here -- identifier allocation is the Coordinator''s.'
  - 'CLOSURE STANDARD: measured against docs/inventor-protocol.md section 4, no record in this batch is a fatigue report. Every closure names an obstruction, gives an argument and states forward guidance. The failures are of SCOPE (a closure asserted broader than its argument reaches: 24b41a, 579fcc) rather than of KIND. That distinction should govern the Coordinator''s disposition: these are records to narrow, not records to reject.'

  narrowest_supported_statement: |-
    Across BATCH-23ec69, no proposal moves any attack exponent, none claims to, and every one places
    itself below Pollard rho with a quantitative sota_delta and a non-null dominated_by. Within the
    tested and stated scopes: (C1)'s average-fibre law, (M1)-(M2)'s shift-multiset dichotomy, (G1)-(G2)'s
    gluing count and group structure, (T2)'s vanishing of homomorphic torsor coordinates, (Q2)'s
    small-root lift-count tie, and the ceiling arithmetic of 24d827 and 79112a's batched row are correct
    as derivations, three of them verified independently by this reviewer. The batch's defects are
    concentrated in three places, all repairable without abandoning any record: controls that cannot
    fire (ab4a6e's CM arm, 3de445's boundary), closures asserted one scope wider than their arguments
    reach (24b41a's quadratic case, 579fcc's (M4)), and comparison bookkeeping (d0fee4's undeclared
    membership convention, 79112a's missing multi-target row, 3993c3's undeclared call count). The
    Coordinator's recorded prior stands on its headline: no exponent-moving survivor was found in either
    set. It is overturned on two sub-claims -- the representation set does not fail mainly as PGL_2
    reparametrisations, and the sharpest SAT break is a metric-definition blindness the prior did not
    anticipate.

  next_concrete_action: |-
    Return IDEA-20260905-ab4a6e and IDEA-20260905-3de445 to their producer for additive revision first,
    because each has a control that cannot fire and each repair is a single declared change (norm ball
    in place of the square box; report the block-support histogram by length instead of a count
    thresholded at ml - l), and then commission the batch's cheapest decisive test as a single frozen
    contract: IDEA-20260905-d0fee4 Stage 1 at p about 2^12 on three prime-order curves for f in
    {x, y, r o x}, reporting BOTH the point count and the count of distinct value-carrying window
    entries, with the adaptive-window known-false object and the PGL_2 and translation-conjugate nulls,
    and with all four contradictory point predictions pre-registered before the run
    (2e14f7's d*B, d0fee4's B, 5f5ace/EXP-MODEL-5c4f24's Bezout ratio 2, d0fee4's ratio 4.5). That one
    counting loop adjudicates two committed records, one unapproved draft contract and one live
    heuristic, and it needs no solver, no proof format and no external dependency.

