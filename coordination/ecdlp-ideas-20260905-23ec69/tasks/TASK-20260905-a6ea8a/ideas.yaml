- id: IDEA-20260905-24b41a
  title: >-
    NETS, CUBICAL LIFTS, MILLER FUNCTIONS AND DUAL-NUMBER LIFTS ARE ONE OBJECT - a
    G_m- or G_a-torsor over the point - and on a prime-order prime-field curve its
    rational content is FORCED: Hom(Z/N, A) = A[N] is trivial for A = F_p^* (when N
    does not divide p - 1) and for A = F_p (Schur-Zassenhaus, N != p), so the torsor
    coordinate carries 0 bits and the twist-invariant residue is a rational function
    of the point - a control record with two symbolic gates and one meter
    measurement, closing classes (2), (3) and (8) of the brief by mechanism
  class: control
  claim: >-
    REPRESENTATION CLASS AND STAGE (RQ-ECDLP-623a32): class R3 (non-function
    representations - elliptic nets, cubical and biextension lifts, Miller
    functions, the dual-number local ring); attack stages whose charged cost is
    addressed are collision structure (walk-state augmentation) and relation
    supply; the claimed change is exactly zero, derived.
    Let G = <P> have prime order N, N != p, embedding degree k (order of p mod N)
    assumed > 1 (true for every standardised prime-field curve).
    (T1) TORSOR CONTENT IS A HOMOMORPHISM. Each of the following attaches to R in G
    an element of an abelian group A additively in R: the quasi-periodicity
    multipliers of the elliptic net W_{P,Q} along its lattice of zeros (Stange; the
    multipliers are Tate-pairing data, A = F_p^*), the cubical torsor coordinate
    [N] R~ = t(R) 0~ of Robert's cubical arithmetic (A = F_p^*/(F_p^*)^N), the Miller
    ratio f_{N,Q} / f_{N,P}^k (a constant in F_p^*), and the tangent component of
    the canonical lift to E(F_p[eps]/eps^2) (A = F_p, additive).
    (T2) FORCED VALUE. Hom(Z/N, A) = A[N]. F_p^*[N] = 1 iff N does not divide p - 1
    iff k > 1; (F_p^*/(F_p^*)^N)[N] is trivial under the same condition; F_p[N] = 0
    since N != p (Schur-Zassenhaus for 0 -> F_p -> E(F_p[eps]) -> E(F_p) -> 0, which
    splits canonically by the unique order-N lift). Every torsor coordinate above is
    CONSTANT on G and contributes 0 bits about k.
    (T3) THE TWIST-INVARIANT PART IS A COORDINATE. For the net W = W_{P,Q}(v),
    v in Z^2, and any e_1 + e_4 = e_2 + e_3, the cross-ratio
    C(v) = W(v+e_1) W(v+e_4) / (W(v+e_2) W(v+e_3)) is invariant under the
    quasi-periodicity multipliers, hence exactly L-periodic (L the lattice of
    zeros), hence a function of the point aP + bQ and, for the standard choices, a
    rational function of x(aP + bQ). The net is therefore "a coordinate function of
    the point" plus "a torsor coordinate forced trivial by (T2)": under
    docs/inventor-protocol.md section 2 it is a change of coordinates.
    TWO EXPLANATIONS DISCRIMINATED. E-A: net/cubical/Miller/jet objects carry
    non-coordinate information about k (the reading behind H-NET-001). E-B: all such
    information is a homomorphic torsor coordinate forced constant by (T2), plus a
    coordinate function. The symbolic gates decide.
  mechanism: >-
    OBJECT FRAME. The PAIR is (representation: the torsor point R~ over R in the
    G_m-torsor of the cubical structure - equivalently a net value, a Miller
    function value, or the dual-number lift; operation set Sigma: the group law
    lifted to the torsor, i.e. the FULL translation action composed with the torsor
    structure). Because Sigma contains the full translation action, the object is
    declared per the frame: it is NOT a branching object - it propagates
    deterministically (the torsor coordinate is a homomorphism) and is therefore,
    by IDEA-20260806-c5d183 (A) and KN-FIND-ffe1df Theorem C, constant or
    injective; (T2) shows it is CONSTANT. TRICHOTOMY CLASS: Class III,
    coordinate-dependent (the same cell as F5 p-adic lifts in KN-TECH-ee6696),
    one-line reason: the torsor coordinate is a function of the chosen lift and
    normalisation, not of the group element, and its group-theoretic content is the
    zero homomorphism. WHAT IS DISCARDED by torsor -> point: only the torsor fibre
    coordinate, which carries 0 bits; in the representation actually used (nets in
    division-polynomial normalisation) the map point -> net value is a lift, and
    the only lossy projection in sight (net residue -> point up to sign) is the
    Kummer sign, a block system of <negation>, not of translation. So the family
    fails the lossy-projection test at clause one: nothing usable is lost.
    Mechanistically the four constructions are one line-bundle theory: Stange's
    nets are values of a section of the theta/cubical torsor, Robert's cubical
    arithmetic is the torsor, Miller functions are its local trivialisations, and
    the dual-number lift is the additive (G_a) first-order analogue. A group-law-
    compatible invariant of a torsor over G is a 1-cocycle of Z/N with values in A,
    i.e. a homomorphism; with gcd(N, |A|) = 1 there are none. This is
    IDEA-20260806-0c9de1's F1 and the rigidity of c5d183 / df906f specialised to a
    coprime-order target, where the value is forced rather than dichotomous.
  non_generic_operation:
    operation: >-
      Evaluation of a net term, cubical point, Miller function or dual-number lift
      at a point - field-level (R1/R3) operations a generic-group simulator cannot
      perform; the record shows the field content they expose is a coordinate
      function plus a constant, so no attack stage is made cheaper.
    attack_stage: collision structure (walk-state augmentation) and relation supply, both predicted unchanged
  object_first_candidate:
    tracked_object: >-
      The torsor coordinate over a point - the class of R~ in the G_m- (or G_a-)
      torsor fibre, tracked under addition.
    established_families_off_limits: >-
      F4 (pairing transfer) is what the torsor becomes when k = 1 and F5 (p-adic
      lift) is what the dual-number lift becomes when N = p; both are boundaries,
      not lenses, and both are stated so the record is not read as closing them.
    lossy_projection_test: >-
      Torsor -> point discards the fibre coordinate, which propagates
      deterministically (homomorphism) and carries 0 bits by (T2): the (Delta, Pi)
      case of the protocol. Meter prediction for the torsor coordinate itself:
      (L, b) = (log2 N, 1) - the constant end, maximal loss, no information. Meter
      prediction for the twist-invariant residue C(v) as a function of the point:
      (1.000, 2.000), identical to the coordinate it equals.
    survival: >-
      (T2) survives every net, lift, normalisation and curve with k > 1 and N != p.
      It dies exactly at k = 1 (MOV) and N = p (Smart): both known, both named.
