  assumptions:
    - >-
      OFF-LIMITS COMPONENT USED: F2 (factor-base decomposition) is the component -
      the object is F2's relation vector with the coordinate generalised; what is
      added is the universal size law (C1) and the degree lower bound (C2), neither
      of which F2's records state.
    - >-
      p > 3, E of prime order N, j not in {0, 1728}; f defined over F_p, non-constant.
    - >-
      The window W is chosen independently of f's fibre structure; adaptive windows
      are excluded and named as the one escape, at the price of an extra membership
      predicate.
    - >-
      "Generic" in (C2) excludes the proper closed subset where signed sums coincide
      (KN-FIND-a8990a branch locus); degrees are read from squarefree polynomials.
  predictions:
    - metric: >-
        |F_W^f| / |W| for f in {x, y, r o x (deg r = 2)} at toy p, 10^3 random
        windows of size B in {32, 128, 512}
      direction: different
      minimum_effect: >-
        Mean within 1 +- 3/sqrt(B) for ALL three coordinates (E-B). Mean near 3 for
        y or near 4 for r o x is E-A and refutes (C1).
    - metric: >-
        PRICED OPEN NUMBER - the loss L and branching b of IDEA-20260802-002 for the
        projections x, y and r o x, measured exhaustively on a toy curve (N about
        2^12) under Sigma = pair addition, against the identity, random-label and
        generic-group (relabelled Z/nZ) controls and the PGL_2 battery
      direction: different
      minimum_effect: >-
        x: (1.000, 2.000) exactly; y: (0.585 +- 0.05, 2.25 +- 0.15); r o x:
        (1.415 +- 0.05, 3.56 +- 0.3); identity: (0, 1); random label of equal image
        size: b within 5 percent of balls-in-bins; relabelled Z/nZ transport of the
        same projections: the SAME (L, b) as on the curve, which is the disclosed
        generic-group content of a coordinate window (its field content lives in
        the membership predicate, not in the meter).
    - metric: per-variable degree of reduced S_3^y on a fixed toy curve
      direction: higher
      minimum_effect: >-
        EXACTLY 9 (numerical distinct-value count over the 9 preimage pairs, as in
        5f5ace Step 5).
    - metric: Bezout ratio y-system to x-system at equal B, m = 3
      direction: higher
      minimum_effect: 4.5 within 5 percent when B is measured, not assumed.
  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): write (C1) and (C2) with the quantifiers of
      proof_search_map and check (C1) exactly by enumerating E(F_p) at p about 2^12.
      STAGE 1 (minutes, DECIDING): for p in {2^12, 2^16, 2^20}, three prime-order
      curves each, count |F_W^f| for 10^3 random windows of each size and each of
      x, y, r o x; report mean ratio and interval. STAGE 2 (minutes): numerical
      distinct-value count for S_3^y. STAGE 3 (minutes): the (L, b) meter on x, y,
      r o x with the identity and random-label calibrations of IDEA-20260802-002 and
      the generic-group control (transport each projection through a random
      relabelling of Z/nZ and re-measure). STAGE 4 (optional, hours): symbolic S_3^y
      and its Bezout number.
    controls:
      - >-
        PGL_2(F_p) battery of IDEA-20260807-4fc635: every Stage 1 count is invariant
        under a random Moebius change of the target line (it permutes windows).
      - >-
        Translation-conjugate null x_R(P) = x(P - R): Stage 1 and Stage 3 values
        reproduce EXACTLY after retargeting.
      - >-
        Matched random prime-order curve at the same p: all ratios agree within
        interval (the law is curve-independent).
      - >-
        Identity, random-label and generic-group (relabelled Z/nZ) controls of
        IDEA-20260802-002 for the meter.
      - >-
        Known-false object: an ADAPTIVE window W_f = { t : #f^{-1}(t)(F_p) = n } for
        f = y, on which (C1) must FAIL by construction (|F| = 3|W_f|), showing the
        counter can see a fibre gain when one exists.
      - >-
        Positive control for (C2): the j = 1728 coordinate x^2 with 4 | p - 1, where
        the fibre IS a block of a group of order 4 and the degree drops to 4^{m-2}
        (4fc635 NULL-5).
    required_metrics:
      - mean and interval of the size ratio per (f, p, B)
      - distinct-value count for S_3^y over 200 random (y_1, y_2)
      - (L, b) per coordinate with the identity, random-label, generic-group and PGL_2 controls
      - adaptive-window control ratio (must be about 3)
      - translation-null pass or fail
  falsification_conditions:
    - >-
      Stage 1 mean ratio for y or r o x materially above 1 (above 1 + 3/sqrt(B) at
      two consecutive p): (C1) false as stated; 2e14f7's HA-1 stands; the degree-d
      lever is real and must be re-ranked upward.
    - >-
      S_3^y distinct-value count of 3 or 6 rather than 9: the collinear-triple fibre
      admits a coincidence structure; 5f5ace's Outcome 2 fires with a prime-order
      witness.
    - >-
      The adaptive-window control returns about 1: the counter cannot see fibre
      multiplicity; Stage 1 void.
    - >-
      Meter values for y or r o x differ from the predictions beyond tolerance
      while the identity and random-label calibrations pass: the Chebotarev fibre
      model is wrong for the rational-point meter, and the branching bound (C2) is
      re-derived before anything else is reported.
    - >-
      Any PGL_2 or translation-null discrepancy: instrument fault, nothing reported.
  confounders:
    - >-
      Branch points of f and the point at infinity bias small windows; use windows
      of size at least 32 and exclude t = infinity explicitly.
    - >-
      Non-reduced elimination inflates degrees; Stage 2 counts values numerically
      and avoids elimination.
    - >-
      At toy p the O(p^{-1/2}) term in (C1) is a few percent at p = 2^12; the
      interval must include it.
  interpretation_limits:
    - >-
      NO EXPONENT CHANGE. The content is a constant-factor closure: no coordinate
      beats 2^{m-2} B^{m-1}, and the y-coordinate loses by 3^{m-1}/2^{m-2}.
      Diem/Gaudry asymptotics untouched.
    - >-
      KN-OPEN-020 CLASS of the factor base considered: a coordinate WINDOW
      F_W = f^{-1}(W) is a HIGH-DEGREE description (membership polynomial of degree
      about B over F_p, or an archimedean interval with no bounded-degree algebraic
      description). Charged: description B field elements; membership one
      comparison (interval) or one polynomial evaluation of degree B; relation
      decomposition Bezout n^{m-2} B^{m-1} per target under a Groebner or
      small-root solver; descent not addressed by this record; time and memory
      those of the windowed family (IDEA-20260904-e9675e, IDEA-20260903-81a943 by
      citation), exponent at least 1 at sigma = 1. The record adds a bound to that
      class; it does not escape it.
    - >-
      (C1) bounds coordinate windows only; predicate-defined bases (Kummer, CM-trace
      IDEA-20260902-701458, lattice boxes) are outside its scope.
    - >-
      Toy verification only; (C1) itself is scale-free and flagged as the one
      non-toy statement.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a window W of size B chosen independently of f, the number of rational
        points in f^{-1}(W) is B(1 + O(B^{-1/2})) uniformly for B in
        [p^{1/8}, p^{1/2}] and n <= 4.
      rigorous_support: >-
        RIGOROUS: the exact double count (C1) gives the mean over all t. CLASSICAL
        DISTRIBUTION IMITATED: Chebotarev equidistribution of Frobenius cycle types
        over the Galois closure of f, whose fixed-point count averages 1 (Burnside),
        with Weil-bound error deg(f) sqrt(p) over the full line. H1 asks that a
        random sub-window inherit the mean with binomial fluctuation.
      validation_plan: >-
        Stage 1 as designed: 10^3 windows per cell; empirical distribution of
        |F_W|/B against the binomial mixture predicted from the exact fibre-size
        histogram (enumerated once per curve); tail check of the maximum deviation
        against the 3-sigma binomial bound and its B^{-1/2} scaling. Parameters
        recorded: p, a, b, N, f, B, seeds. Transfer: none needed for (C1); H1
        concerns fluctuations only.
  target_complexity:
    time_exponent: >-
      Unchanged, 1/2 (rho). Decomposition stage: Bezout >= n^{m-2} B^{m-1} for every
      coordinate, equality only at n = 2; predicted LOSS 3^{m-1}/2^{m-2} for y.
      Against Petit-Kosters-Messeng (KN-LIT-025) and Semaev/Diem: no change; the
      record removes a proposed lever.
    memory_exponent: Unchanged; the base has size B for every coordinate.
    best_known: >-
      Parallel rho 0.886 sqrt(N), O(1) memory (KN-TECH-001/006); BSGS sqrt(N)/sqrt(N)
      (KN-TECH-031); automorphism-discounted rho (KN-TECH-018); prime-field
      decomposition per KN-LIT-025 with the BKK constants (KN-FIND-2a8b7e/c7d31e).
    hidden_overhead: >-
      None hidden; disclosed the other way: the lifting cost n^{m-1} per solution
      makes a degree-n coordinate worse than the Bezout ratio alone says.
    tradeoff_note: Not applicable; no algorithm produced.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  proof_search_map:
    bottleneck: >-
      (C1)'s independence assumption on W. If a window can be chosen adaptively at
      polylog cost per element to hit only full fibres, the size law is escaped at
      the price of a membership predicate; the adaptive-window control measures it.
    baseline_embedding:
      parameter_slice: >-
        f = x, n = 2: (C1) gives |F| = B (half the x-values carry two points) and
        (C2) gives 2^{m-2}; both reproduce KN-TECH-002 and dadcd2 with g = 2.
      reproduction_check: >-
        Frozen fixture: harness/semaev.py s3_expr has per-variable degree 2; x-window
        counts at p = 4099 give B(1 +- 0.05).
    observation_collision:
      observable: >-
        The pair (|F_W^f|/|W|, deg_t S_m^f). DISCARD AND COMPATIBILITY: the observable
        discards the position of each point within its f-fibre (lossy, fibre size
        n); the discard is Sigma-compatible under translation by factor-base
        elements through the stated branching bound n^{m-2} (not a block system).
      distinct_preimage_search: >-
        EXPECTED: x, Montgomery x, Edwards y, Kummer and every Moebius image share
        (1, 2^{m-2}); y and r o x share the first entry with x but differ in the
        second. The first-entry collision IS (C1); the second-entry separation IS
        (C2).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          THE OBJECT: the coordinate-window relation vector (f-values of the summands
          plus their membership in W), with the m-fold relation as Sigma; reduced to
          the pair (mean rational fibre size, deg_t S_m^f), which is an exact count
          and a degree.
        predicted_gain: >-
          Converts "is there a degree-d lever" into one integer inequality per n,
          with a proved minimum at n = 2.
      - transform: observable_fiber
        proposed_object: >-
          THE OBJECT: the full rational fibre-size histogram of f, which decides
