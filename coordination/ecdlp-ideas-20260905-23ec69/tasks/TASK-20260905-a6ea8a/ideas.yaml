- id: IDEA-20260905-ab4a6e
  title: >-
    THE QUADRATIC-ORDER BOX FACTOR BASE - x(P) read as a residue of a small element
    u + v*omega of an imaginary quadratic order O_K modulo a split prime, small
    meaning |u|, |v| <= B^{1/2} - is predicted to be a reparametrisation of the
    interval base (norm-height bookkeeping: |S_3(alpha)| <= B^2 against |pi| = p^{1/2}
    is the same dimensionless ratio as B^4 against p), EXCEPT on a curve with CM by
    O_K where the unit group acts on box and curve simultaneously and the base is
    automorphism-orbit-structured; a representation record whose predicted generic
    outcome is a controlled null with the CM curve as the labelled positive control
  class: representation
  claim: >-
    REPRESENTATION CLASS AND STAGE (RQ-ECDLP-623a32): class R1 (field representation
    of the x-coordinate as a reduced element of O_K/(pi)); attack stages whose
    charged cost is addressed are factor-base membership and relation
    decomposition; the claimed change is 0 on generic curves and the known factor
    |Aut| on CM curves.
    Let O_K = Z[omega] be the maximal order of an imaginary quadratic field of small
    discriminant D, p a prime splitting in O_K, pi a generator of a prime above p
    (N(pi) = p, F_p = O_K/(pi)), rho : O_K -> F_p the reduction. BOX BASE:
    F_box = { P in G : x(P) = rho(u + v omega), |u|, |v| <= B^{1/2} }, of size about
    B (by IDEA-20260905-d0fee4 (C1)).
    (Q1) MEMBERSHIP is one Gauss reduction of x(P) against the lattice (pi): polylog.
    (Q2) SMALL-ROOT RATIO TIE. The relation S_3(x_1, x_2, x_3) = 0 mod pi lifts to
    S_3(alpha_1, alpha_2, alpha_3) = lambda pi in O_K with |S_3(alpha)| <= c B^2
    (degree 4 in |alpha| <= B^{1/2}) against |pi| = p^{1/2}: ratio B^2/p^{1/2} =
    (B^4/p)^{1/2}, the same dimensionless ratio as the interval base's B^4 against
    p. The small-root reach of the windowed family is predicted UNCHANGED.
    (Q3) GENERIC PREDICTION. On a curve with End(E) not containing O_K, F_box is
    log-random: arity-3 yield, the H-PSEUDO statistic C(p) (as in
    IDEA-20260902-701458 (S5)) and Groebner cost over the membership polynomial
    match a random subset of G and the interval base of the same size within
    pre-registered bands.
    (Q4) STRUCTURED POSITIVE CONTROL. On a curve with CM by O_K (j = 0 for D = -3,
    j = 1728 for D = -4, with 6 | p - 1 or 4 | p - 1), a unit u in O_K^* acts on the
    box by alpha |-> u alpha AND on the curve by the automorphism [u] with
    x([u]P) = u' x(P) for the corresponding root of unity, so F_box is a union of
    Aut(E)-orbits: the relation stage gains the known factor |Aut| (FGHR,
