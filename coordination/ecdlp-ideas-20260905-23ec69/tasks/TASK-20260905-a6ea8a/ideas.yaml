      IDEA-20260807-8027a2, KN-FIND-a8990a, KN-FIND-c41ea9, KN-TECH-ee6696; statement
      and mechanism of H-MODEL-25e2eb (Coordinator-supplied nearest record). Web:
      Kohel arXiv 1005.3623 abstract fetched (torsion eigenspaces of addition-law
      sections; silent on fibre counts).
    nearest_internal_records:
      - record: IDEA-20260808-2e14f7
        exact_difference: >-
          2e14f7 proposes degree-d maps as a solve-stage lever with HA-1
          (|V| = d*B*(1+O(B^{-1/2}))). This record predicts HA-1 false by the double
          count (C1) and supplies the lower bound (C2) that 2e14f7 leaves as "by how
          much"; it is 2e14f7's own falsification condition 1, derived.
      - record: IDEA-20260807-dadcd2
        exact_difference: >-
          dadcd2 proves deg = g^{m-2} for Galois coordinates and the upper bound
          n^{m-1}, and accounts B = g*d assuming full rational fibres. This record
          adds the LOWER bound n^{m-2} for arbitrary f and replaces B = g*d by the
          unconditional average B = |W|, which makes the optimality universal.
      - record: IDEA-20260807-5f5ace
        exact_difference: >-
          5f5ace's Hessian x is the same collinear-triple structure but needs
          3 | #E; the y-coordinate realises it on every curve, so "nothing here
          transports to prime-order curves" is corrected: the object transports, the
          loss transports with it.
      - record: H-MODEL-25e2eb
        exact_difference: >-
          25e2eb classifies every model-lane quantity on a DEGREE-2 coordinate into
          PGL_2-invariant (per-variable degree, Bezout number) versus
          reparametrisation-artifact classes, decidable by measurement within one
          PGL_2 orbit. This record works ACROSS coordinate degrees, where no single
          PGL_2 acts: it shows 25e2eb's Class I invariants take strictly LARGER
          values (deg >= n^{m-2}, Bezout >= n^{m-2} B^{m-1}) for every n >= 3 at
          equal window-defined base size, i.e. the degree-2 orbit is the minimum of
          the invariant, not merely constant on it. It consumes 25e2eb's NULL-3
          (shifted Kummer) and NULL-5 (x^2 on j = 1728) as controls and adds
          nothing about the within-orbit classes.
      - record: IDEA-20260905-4dff7b (on open branch, not on main)
        exact_difference: >-
          4dff7b compares Edwards/Hessian presentations holding the point set fixed;
          this record bounds every coordinate function at once by a fibre count and
          holds the WINDOW size fixed, the accounting 4dff7b's point-set arm needs.
      - record: KN-TECH-ee6696
        exact_difference: >-
          The enumeration places F2 as partial-action with KN-FIND-007's mean yield
          as its cost; this record adds a second cost functional for F2 - the
          Bezout number as a function of the coordinate - and bounds it.
    verdict: >-
      unverified. (C1) is elementary and almost certainly folklore; (C2) is a
      three-line count. No global novelty claimed; the value is that a live corpus
      proposal (2e14f7) carries a heuristic (HA-1) contradicting (C1).
