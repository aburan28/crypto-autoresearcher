    container.py:
      - Preserves the exact cached image, private PID namespace, capability, mount, network, CPU, PID and outer-memory profile.
      - Constructs ContainerInspection only by decoding the actual full Docker container and image inspection JSON.
      - Exposes a bounded stdin entry that accepts only the exact task ID, full container ID and one frozen case ID.
    host.py:
      - Implements exact cached-image inspection, create with --pull never, unique task and nonce labels, and no automatic pull.
      - Copies an in-memory tar containing only hash-pinned container.py and supervisor.py; no host source or repository mount exists.
      - Retains every command argv, stdin digest, UTC, process/session/terminal field, stdout and stderr; inspects and logs the exact full ID after attach.
      - Requires a clean inner report, exit0, Running=false and OOMKilled=false. Any incomplete path triggers exact-ID kill, post-kill inspection, final logs and exact-ID removal.
    supervisor.py:
      - Corrects the Path import and maps native wait status through signal.Signals to canonical names such as SIGKILL.
      - Verifies Linux, CGROUP2_SUPER_MAGIC, exact writable cgroup2 mountinfo, exact own /proc/self/cgroup membership and descriptor identity before mutation.
      - Uses descriptor-relative O_NOFOLLOW access, fixed filenames and fixed child names. Partial mkdir/open failure rolls back or reports typed incomplete custody.
      - Tracks the exact worker handle and every pipe through fork, release, bidirectional membership acknowledgement, nonblocking report drain, polling, terminal wait, signal, reap and descriptor/state closure.
      - The dropped worker owns its auxiliary lifecycle. Ordinary failures kill and reap that exact auxiliary; unpermitted parent signalling remains explicit incomplete inner cleanup for outer containment.
      - Verifies direct worker membership after drop and both worker plus auxiliary membership before pressure, retaining ready, acknowledgement and before-allocation order.
      - Polls worker memory.events at bounded cadence and compares final counters with retained baseline counters, requiring oom_group_kill delta at least1 and oom_kill delta at least2.
      - Replaces the constant liveness assertion with inner evidence after worker terminal; small-OOM classification remains pending until independent outer terminal and OOM observations are joined by host.py.
      - Any required cleanup, report sink, malformed/truncated report or custody failure prevents a complete result while the original primary failure remains first.
    tests.py:
      - Runs 81 fixed cases against production supervisor, descriptor, container and host adapter logic using injected OS, Docker, cgroup and mount observations.
      - Runs five sequential current-user POSIX fixtures for large-pipe drain, membership acknowledgement, watchdog SIGKILL naming, report-read failure and release failure.
      - Uses one nested test worker, per-case alarms, aggregate watchdog, resident-memory watchdog, -B and PYTHONDONTWRITEBYTECODE=1.
