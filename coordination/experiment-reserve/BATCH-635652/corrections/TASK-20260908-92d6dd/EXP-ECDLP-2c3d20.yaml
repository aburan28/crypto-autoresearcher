  proof_search_map:
    applicability: empirical structural diagnostic with a modeled search-cost corollary
    exact_baseline_reproduction: The pinned harness recurrence, table coefficients, starts and first min(10000,N)
      transitions are re-derived in scalar coordinates and compared byte for byte before any structural statistic.
    observation_collision_search: Uniform point weighting, stationary basin weighting, label-frequency imbalance,
      recurrent-basin concentration and finite class size can each imitate dependence. The contract records them
      separately and compares only with pointwise nulls of identical map shape.
    quantifier_order: Curves, tables, partitions, null domains, directions, thresholds and the complete cell count
      are frozen first; statistics are then computed for every declared cell; only afterward are replicated review-candidate
      rules evaluated.
    method_ceiling: Exhaustive O(N) map access and known discrete logs cap any result at a toy diagnostic. Passing
      cannot establish a mixing theorem or cheaper ECDLP algorithm; failing a control voids the instrument.
    nearby_object_control: The order-2q descent-symbol map supplies a known algebraic partition whose parity spectrum
      must be detected. The pointwise random-label ensemble is the same-shape null.
  derivations_and_source_changes:
  - Derived the uniform-start Cesaro stationary measure explicitly from cycle basins, removing the archived unspecified
    choice among stationary measures.
  - Replaced the archived common label permutation with sixty-four point-index uniform label functions; a branch
    permutation cannot destroy the original fibers and therefore is not the stated null.
  - Replaced ambiguous 'second singular value after centering' with the leading singular value of the explicitly
    centered, stationary-normalized operator.
  - Froze all forty partitions, exact zero-mass handling, finite arc ties, class matching, conditioning costs, slope
    fits and descriptive rank rules.
  - Added a second domain-separated curve stratum while retaining the three source seeds, yielding the requested
    two-strata/three-replicate ladder.
  - Corrected the order-2q local value at T to Legendre(3e^2+A) and required the exact homomorphism/parity check
    rather than treating a coordinate zero as a branch label.
  - Every derivation in this amendment is prospective mathematical design. None is a run result, validated evidence,
    novelty finding, or claim that a control will pass.
