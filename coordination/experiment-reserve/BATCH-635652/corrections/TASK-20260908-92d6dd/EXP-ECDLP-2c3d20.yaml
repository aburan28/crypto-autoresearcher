  claim_boundary: This is a complete prospective experiment contract. It is not approval, freezing, execution, an
    observation, evidence, a status transition, a mixing theorem, or a solver improvement. Any later run is toy-scale
    and can support only the exact enumerated cells and descriptive decision rules below.
  objective: On exhaustive toy prime-order subgroups, compare the harness r-adding map with sixty-four independently
    domain-separated pointwise-uniform branch-label maps that use the identical step table. Measure the leading
    singular value of each stationary-weighted centered lumped operator, itinerary-class log-arc concentration and
    indicator spectra, with every conditioning cost exposed. Use an order-2q descent-symbol map as the known-true
    control. The experiment decides only whether a replicated true-versus-null structural separation is present
    in the declared toy ladder.
  frozen_scope:
    claim_tier: toy
    field_bits:
    - 12
    - 14
    - 16
    - 18
    - 20
    - 22
    - 24
    curve_strata:
    - A
    - B
    replicate_seeds:
    - 20260905
    - 20260906
    - 20260907
    branches:
    - 4
    - 8
    - 16
    - 32
    pointwise_null_replicates: 64
    partition_count: 40
    primary_curve_bundles: 42
    order_2q_control_bundles: 42
    maximum_workers: 1
    maximum_memory_gb: 8
  deterministic_primitives:
    seed_integer: seed_int(s,tag)=the nonnegative big-endian integer represented by SHA256(UTF8(decimal(s)||':'||UTF8(tag))).
      This is the exact helper _seed_int imported by the pinned harness rho implementation.
    point_encoding: enc(O)=one byte 0x00. For affine (x,y), enc(x,y)=0x04 followed by x and y as fixed-width unsigned
      big-endian integers of width ceil(bit_length(p)/8).
    scalar_enumeration: The log order is i=0,...,N-1 with W_i=[i]P and W_0=O. Build both maps point_to_index[enc(W_i)]=i
      and index_to_point[i]=W_i. Duplicate encodings, [N]P != O, or any [i]P=O for 0<i<N is an instrument failure.
  primary_curve_generation:
    algorithm: For each (field_bits b, stratum S, replicate seed s), set attempt=0,1,... and derived_seed=seed_int(s,'EXP-ECDLP-2c3d20|primary|'||S||'|'||b||'|'||attempt)
      mod 2^63. Call harness.toycurve.generate_instance(derived_seed,b). Reject and increment attempt unless p has
      exactly b bits, the full curve order equals the returned prime subgroup order N (cofactor one), N>=5, and
      the table-validity predicate below holds simultaneously for r=4,8,16,32. Strata A and B are the two disjoint
      domain-separated streams named by S; they assert no CM, trace, or isomorphism property. Accept the first passing
      candidate, record every rejected derived_seed and reason, and cap the search at 20000 attempts. Exhausting
      the cap is failed_infrastructure.
    replicate_meaning: The three listed seeds are fixed independent deterministic streams within each stratum. A
      replacement seed, a changed stratum tag, or a regenerated curve after observing a metric is a new protocol
      amendment.
    certificate: 'Record p,A,B,#E,N,P,k,Q and verify discriminant !=0, #E=N prime, [N]P=O, P!=O, 2<=k<=N-1, and
      Q=[k]P. Exhaustive enumeration must contain exactly N distinct encodings. Because N is prime, these checks
      certify that P generates the enumerated subgroup.'
  harness_r_adding_map:
    table: For j=0,...,r-1 set c_j=seed_int(instance.seed,'rho_c'||j) mod N, d_j=seed_int(instance.seed,'rho_d'||j)
      mod N, R_j=[c_j]P+[d_j]Q, and t_j=(c_j+d_j*k) mod N. Table validity means every t_j is nonzero and t_j values
      are pairwise distinct for the r=32 table; the smaller r tables are its prefixes. Curve rejection, never post-hoc
      table resampling, handles failure. Record c_j,d_j,R_j,t_j and their encodings.
    branch: s_r(O)=0 and s_r((x,y))=x mod r. The true scalar transition is F_r(i)=(i+t_{s_r(W_i)}) mod N, and its
      point transition is W_i -> W_i+R_{s_r(W_i)}. Assert both representations agree at all N points.
    pinned_regression: For each curve and r, use the pinned rho initialization a0=seed_int(instance.seed,'rho_a0_0')
      mod N and b0=seed_int(instance.seed,'rho_b0_0') mod (N-1)+1. Starting at i0=(a0+b0*k) mod N, compare branch,
      point encoding, a, b, and next point for the first min(10000,N) successive tortoise steps with harness/rho.py.
      Serialize each tuple canonically and require byte-identical transcripts. This is a blocking implementation
      regression, not a scientific run.
  pointwise_uniform_branch_null:
    definition: For null replicate u=0,...,63 and every scalar index i=0,...,N-1, let H=SHA256(UTF8('EXP-ECDLP-2c3d20|point-null|'||b||'|'||S||'|'||s||'|'||
      r||'|'||u||'|'||i)). Since every declared r is a power of two, define L_u(i)=int_big_endian(H) bitand (r-1),
      with no modulo bias. The null map is F0_{r,u}(i)=(i+t_{L_u(i)}) mod N. It shares the curve, enumeration, secret,
      step coefficients, points, scalar steps and partition library with F_r; only the pointwise branch labels differ.
    probability_model: Uniformity and independence are the pre-registered SHA-256 PRF model for the labels at distinct
      domain strings. The realized labels are deterministic and need not be exactly balanced. Record all r label
      counts for every null; imbalance is null variation, not a reason to redraw a replicate.
    correction_to_archived_design: A single permutation of the r labels preserves all same-label fibers and is not
      a pointwise-uniform label null. This amendment therefore replaces the archived label-permutation definition
      with independent point-index labels, as required by the committed mathematical-design handoff.
  functional_graph_and_stationarity:
    exact_algorithm: 'Enumerate the complete functional graph of each true and null map in scalar order. Use path
      following with deterministic node order to identify every directed cycle C, its least scalar representative,
      its period |C|, and its basin B(C)={i:some iterate of F sends i into C}. Sort cycles by their least representative.
      The selected stationary distribution is the uniform-start Cesaro limit: pi_i=|B(C)|/(N*|C|) for i on cycle
      C, and pi_i=0 for transient i. Store pi_i as the exact rational pair (|B(C)|,N*|C|), reduced only for display.
      Assert sum_i pi_i=1 and pi_j=sum_{i:F(i)=j}pi_i exactly.'
    interpretation: Deterministic reducible maps have many stationary measures. Basin weighting fixes the unique
      measure induced by a uniformly sampled start followed by a Cesaro time average. No uniform-state substitution
      is allowed. Also report transient count, cycle count, periods, basin sizes and total-variation distance from
      the uniform distribution as descriptive diagnostics.
  frozen_partition_library:
    infinity_rule: O is its own category in every partition. Categories absent from the positive stationary support
      are retained in raw counts and omitted from the normalized operator with an explicit zero_mass flag.
    members:
    - Nine x-residue partitions x mod m for m in [2,3,4,5,7,8,16,32,64].
    - Three y-residue partitions y mod m for m in [2,4,8].
    - 'Nine symbol partitions taking values in {-1,0,1}: Legendre(x+c) for c in [0,1,-1,2,-2,3,-3], Legendre(y),
      and Legendre(x*y), with Legendre(0)=0.'
    - Sixteen binary interval partitions I_j=1[x < floor(j*p/17)] for j=1,...,16, using canonical representatives
      0<=x<p.
    - 'Three mixed partitions: (x mod 2,Legendre(y)); (x mod 4,Legendre(x+1)); and (Legendre(x),Legendre(y)).'
    count_check: 9 + 3 + 9 + 16 + 3 = 40
    freeze_rule: Emit the ordered library and SHA-256 before measurement. No member, category merge, or threshold
      may be changed after observing a cell.
  stationary_weighted_lumped_operator:
    definition: For a retained category a let mu_a=sum_{i:g(i)=a}pi_i. Define Q_ab=mu_a^(-1)*sum_{i:g(i)=a}pi_i*1[g(F(i))=b].
      Let D=diag(mu) and let 1 be the all-ones column. Form the centered normalized operator C=D^(1/2)*(Q-1*mu^T)*D^(-1/2).
      Report sigma_center=max singular_value(C), the leading singular value of the already-centered operator. Also
      report all singular values in descending order, Q, mu, omitted categories and row-sum/stationarity residuals.
    numerical_contract: Construct Q and mu from exact integer/rational counts. Convert the final retained matrix
      to IEEE-754 binary64 in category order and compute a full deterministic SVD. Require max row-sum residual
      and stationarity residual <=1e-12 and agreement of sigma_center with an independent eigenvalue of C^T*C to
      absolute tolerance 1e-10. Failure voids that operator.
    correction_to_archived_design: The archived phrase 'second singular value counting multiplicity' is ambiguous
      after the rank-one stationary component has already been removed. This contract reports the leading singular
      value of C, whose definition is invariant to that indexing convention.
  itinerary_statistics:
    depths: For each (N,r), K(N,r)=floor(log(sqrt(N))/log(r)); use exactly integer depths k=1,...,K, equivalently
      the largest k with r^(2k)<=N. Also record k_star_real=log(N)/(2*log(2*r)) and flag every measured k>k_star_real.
    word_and_class: I_k(i)=(label(i),label(F(i)),...,label(F^(k-1)(i))), using s_r for the true map and L_u for
      a null map. C_w={i:I_k(i)=w}; empty words are recorded in the word-count summary but are not scored.
    cyclic_half_arc: For a nonempty class C of size m, sort its scalar logs 0<=a_0<...<a_(m-1)<N and extend a_(j+m)=a_j+N.
      Put h=ceil(m/2) and ell(C)=min_{0<=j<m}(a_(j+h-1)-a_j), choosing the least a_j on ties. A(C)=ell(C)/N; therefore
      a singleton has A=0. Store the minimizing start, endpoint, h, ell and A.
    aggregates: The primary arc statistic is point-weighted A_point(k)=sum_C (|C|/N)*A(C). Secondary statistics
      are the unweighted class mean, median, and min_{|C|>=32} A(C); the last is NA when no eligible class exists.
      Report every class separately so the aggregate is auditable.
    class_spectrum: For each class C define h_C(i)=1[i in C]-|C|/N and H_C(a)=sum_i h_C(i)*exp(-2*pi*i*a/N). Report
      variance, max_{a!=0}|H_C(a)|, least maximizing a, and the real-function conjugate partner N-a. Let X_C be
      that maximum and, only when C has one deterministic matched class in every null replicate r=0,...,63, let
      X_C,r be the same maximum for its match. Define mu_C=sum_r X_C,r/64 and s_C=sqrt(sum_r (X_C,r-mu_C)^2/63).
      The standardized effect is (X_C-mu_C)/s_C when s_C>0. When s_C=0, store numeric standardized effect null and
      state zero_dispersion_equal if X_C=mu_C, otherwise zero_dispersion_positive_separation or zero_dispersion_negative_separation.
      Raw separation and finite descriptive ranks remain reported, but the standardized-effect predicate and candidate
      eligibility are false. No categorical infinity may substitute for a finite effect and no IEEE infinity is
      serialized. No independent-exponential or Gumbel law is asserted.
    deterministic_size_matching: For each true class, within each null replicate form candidates whose size ratio
      lies in [0.8,1.2]. Choose the unused candidate minimizing (abs(size_null-size_true),lexicographic_word); process
      true classes in (decreasing size,lexicographic_word) order. A null class is used at most once in that replicate.
      If the candidate set is empty, store a typed no_size_match row naming the true class, replicate and candidate
      sizes; do not redraw, delete a class, or reuse a null class. Every unmatched class remains in the raw table.
      A true class is class-inference eligible only if it has exactly one match in all 64 declared null replicates.
      Otherwise its class rank, center, scale, standardized effect and candidate decision are null with reason incomplete_64_match_coverage.
      Map-level summaries remain eligible because they do not condition on class matching.
    conditioning_and_search_cost: For every class report |C|, uniform-start mass |C|/N, stationary mass pi(C), exact
      expected uniform rejection draws N/|C|, k label evaluations per accepted start, complete-map/table construction
      operations, and class enumeration operations. The source expression k+2*sqrt(A(C)*N) is retained only as a
      modeled localized-search term and is reported both alone and with the declared conditioning/construction charges.
      No kangaroo or DLP solve is executed by this experiment.
  stage_accounting_and_memory_conformance:
    scope: global_all_protocol_stages_and_bundles
    advisory_estimates:
    - stage: stage0_freeze_and_manifest
      wall_seconds: null
      cpu_seconds: null
    - stage: curve_log_and_true_map_construction
      wall_seconds: null
      cpu_seconds: null
    - stage: streamed_null_maps_and_partitions
      wall_seconds: null
      cpu_seconds: null
    - stage: class_spectra_and_lumped_matrices
      wall_seconds: null
      cpu_seconds: null
    - stage: order_2q_controls
      wall_seconds: null
      cpu_seconds: null
    - stage: slopes_and_report
      wall_seconds: null
      cpu_seconds: null
    estimate_semantics: Null estimates mean unestimated advisory cost. They are not zero and do not change the fixed
      42 bundles, 168 true maps, 10,752 null maps, 40 lumping rules, 64 null replicates, controls, or stopping rules.
    actual_stage_record: For every stage and bundle store started_monotonic_ns, finished_monotonic_ns, wall_ns,
      cpu_user_ns, cpu_system_ns, group_operations, field_operations, fft_calls, class_count, partition_count, label_count,
      map_count, bytes_read, bytes_written, declared_array_bytes, declared_workspace_bytes, process_group_peak_bytes,
      and termination as typed nonnegative JSON integers except that an unavailable measurement is null with a required
      reason. Aggregate totals sum completed records and are never estimates.
    typed_encodings:
      point_table: 'packed little-endian records <BII: uint8 state, uint32 x, uint32 y; O is (0,0,0), affine is
        state 1'
      scalar_index_and_map: little-endian uint32; shape [N]; file length must equal 4*N
      word_code_and_sorted_index: little-endian uint32; shape [N] for each current map
      class_label: little-endian uint32; shape [N]; labels are dense 0,...,class_count-1 in lexicographic-word order
      class_offsets: little-endian uint64; shape [class_count+1]; first 0, last N, nondecreasing
      itinerary_symbol: unsigned uint8; shape [N, itinerary_length]
      stationarity_count: unsigned little-endian uint64 numerator and denominator; no binary floating approximation
      matrix_and_fft_input: IEEE-754 binary64 little-endian with explicit row-major shape
      fft_output: interleaved IEEE-754 binary64 complex pairs little-endian with explicit shape [N,2]
      scalar_summary: JSON number when finite; undefined or categorical infinite values are JSON null plus a reason/state
        enum
    encoded_size_checks: Every binary object records dtype, byte_order, shape, itemsize, nbytes, file_bytes and
      SHA-256. Require nbytes=itemsize*product(shape) and file_bytes=nbytes before use. JSON count fields, including
      class, partition, label, workspace and map counts, must parse as integers rather than arithmetic strings.
    streaming_order_and_lifetimes: Process bundles in lexicographic (bits,stratum,replicate) order, map families
      in their frozen order, then null indices 0..63. Keep only the current point/log table, one true or null uint32
      map, its word codes, sorted indices, dense labels, offsets, one current class vector, one binary64 FFT input
      and one FFT output/workspace live. Construct and consume each of the four true maps and each of their 64 null
      maps before release; retain only typed scalar summaries, size tables, matching rows and slope accumulators.
      Build one lumping-rule matrix at a time and one class FFT at a time. Finish the primary bundle before constructing
      its order-2q control. The 4 true plus 256 null maps, 260 full label arrays, all class vectors, and all 40
      matrix workspaces may never be resident together.
    prospective_peak_formula: Before a bundle starts, sum exact nbytes for all simultaneously live typed objects,
      the class-sort temporary, the matrix library's documented workspace, the FFT library's documented worst-case
      workspace, measured allocator bytes for curve objects, and a separately measured runtime baseline. This is
      a prospective conformance bound, not measured peak RSS. Record every term and lifetime.
    process_group_guard:
      mechanism: linux_cgroup_v2_memory_controller
      limit_bytes: 8589934592
      swap_limit_bytes: 0
      setup: A supervisor outside the worker cgroup creates a fresh cgroup before any scientific allocation, writes
        memory.max=8589934592, memory.swap.max=0 and memory.oom.group=1, reads all three values back, then moves
        the one-worker launcher into cgroup.procs. Descendants inherit the aggregate limit. No per-process RLIMIT
        or polling-only counter substitutes for this guard.
      unavailable: If the controller or required write/readback is unavailable, launch no scientific cell and record
        memory_guard_unavailable as failed_infrastructure.
      oom_semantics: Flush each completed scalar row atomically. On memory.events oom or oom_kill, preserve flushed
        rows and the supervisor transcript, mark the unfinished cell failed_infrastructure, and draw no scientific
        inference.
      measurements: Record memory.current at stage boundaries, memory.peak when exposed, memory.events before/after,
        and process RSS diagnostics. A missing peak is null with reason; it is never replaced by the prospective
        byte sum.
  order_2q_known_true_control:
    generation: 'For each (b,S,s), set tag to the canonical UTF-8 string ''EXP-ECDLP-2c3d20|control-2q|b=''||decimal(b)||''|stratum=''||S||
      ''|replicate=''||decimal(s), with no whitespace or leading zeroes in decimal fields. Interpret every SHA256
      digest below as one unsigned big-endian integer. For curve_attempt a=0,...,19999 set p=nextprime(2^(b-1)+SHA256(tag|''|p|''||decimal(a))
      mod 2^(b-1)); reject if p>=2^b. Set A=SHA256(tag|''|A|''||decimal(a)) mod p and B=SHA256(tag|''|B|''||decimal(a))
      mod p; reject zero discriminant. Count #E(F_p) exactly and accept the curve predicate only when #E=2q with
      q an odd prime. For point_attempt v=0,...,4095 set x=SHA256(tag|''|P|''||decimal(a)||''|''||decimal(v)) mod
      p, call the pinned deterministic lift_x rule, and canonicalize a lifted root to y=min(y,p-y). Accept the first
      P=(x,y) satisfying [2q]P=O, [q]P!=O and [2]P!=O; set T=[q]P and require T=(e,0). These conditions certify
      that P has exact order 2q and that T is the unique rational two-torsion point. If a curve passes the order
      predicate but all 4096 point attempts fail, record generator_exhausted and continue to the next curve attempt.
      Record every candidate, rejection reason, order count, primality certificate and scalar certificate. Exhaustion
      of all 20,000 curve attempts is typed control_curve_exhausted, makes that control bundle coverage_inconclusive,
      and supports no scientific inference; no fallback sampler or redraw is allowed.'
    harness_helper_audit: The existing toycurve.generate_instance path selects the largest prime subgroup of a sampled
      curve and therefore does not certify a full group of order 2q. It is forbidden for this control. Only the
      explicit full-order census and generator test above may construct the control instance.
    descent_symbol: Let Delta=3*e^2+A mod p and require Legendre(Delta)=-1. Define delta(O)=1, delta(T)=Legendre(Delta),
      and delta((x,y))=Legendre(x-e) otherwise. Exhaustively require delta(U+V)=delta(U)delta(V) and delta([j]P)=(-1)^j
      for all pairs/scalars. Define the r=2 branch label (1-delta(W))/2 and use the first two pinned rho table steps.
      At depth one the two classes must each have q elements; their centered indicators have only the conjugate-identical
      frequency q on the length-2q log ordering, and their cyclic half-arc A tends to one half under the exact finite
      definition. Report the exact finite A, not a hard-coded 0.5.
    role: This is a proves-too-much/known-true instrument object. Failure voids the affected instrument; success
      says nothing about the primary rho map.
  null_inference_and_decisions:
    ranks: Every eligible scalar comparison uses exactly the observed value plus all 64 declared null values, so
      its denominator is 65. For a predeclared upper direction set p_upper=(1+#{r:X_null[r]>=X_true})/65; for a
      predeclared lower direction set p_lower=(1+#{r:X_null[r]<=X_true})/65. Equal values count against separation
      and no null is deleted or redrawn. A two-sided rank may be reported only as the descriptive statistic min(1,2*min(p_upper,p_lower));
      it is not substituted for the predeclared one-sided decision. Class-level ranks exist only with complete 64-match
      coverage under deterministic_size_matching. The standardized center and scale for class spectra are the arithmetic
      mean and sample standard deviation with denominator 63 defined in class_spectrum; map-level summaries use
      the same mean/sample-standard-deviation convention and the same typed zero-dispersion cases when an effect
      is reported.
    multiplicity: The 64 common pointwise-null replicates are reused across all partitions, depths and statistics
      within a map cell, preserving dependence. There is no valid global family-wise p-value at resolution 1/65.
      All ranks and max-over-library summaries are descriptive and trigger independent review, never hypothesis
      promotion by themselves.
    review_candidate: A review candidate exists when EITHER the unchanged six-key scalar_review_candidate route
      OR the complete sigma_center_slope slope_review_candidate route holds. The slope route does not inherit the
      scalar route's two-top-rung eligibility gate. All other statistic keys retain descriptive-only status. Report
      which route and exact fixed identity triggered.
    no_separation: True statistics lying within their null ensemble support a scoped toy diagnostic only. They do
      not prove random mapping, asymptotic mixing, or the absence of another exploitable partition.
    statistic_inventory:
    - key: sigma_center
      scope: map_partition
      direction: upper
      candidate_eligible: true
    - key: A_point
      scope: map_depth
      direction: lower
      candidate_eligible: true
    - key: A_class_mean
      scope: map_depth
      direction: lower
      candidate_eligible: true
    - key: A_class_median
      scope: map_depth
      direction: lower
      candidate_eligible: true
    - key: A_min_size32
      scope: map_depth
      direction: lower
      candidate_eligible: true
    - key: class_spectrum_max
      scope: matched_class_depth_word
      direction: upper
      candidate_eligible: true
    - key: class_variance
      scope: matched_class_depth_word
      direction: upper
      candidate_eligible: false
    - key: class_arc
      scope: matched_class_depth_word
      direction: lower
      candidate_eligible: false
    - key: uniform_start_mass
      scope: matched_class_depth_word
      direction: upper
      candidate_eligible: false
    - key: stationary_mass
      scope: matched_class_depth_word
      direction: upper
      candidate_eligible: false
    - key: uniform_rejection_draws
      scope: matched_class_depth_word
      direction: lower
