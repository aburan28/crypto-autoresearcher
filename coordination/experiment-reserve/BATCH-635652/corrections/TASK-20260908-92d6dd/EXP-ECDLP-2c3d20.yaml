    - key: localized_search_term
      scope: matched_class_depth_word
      direction: lower
      candidate_eligible: false
    - key: fully_charged_modeled_search
      scope: matched_class_depth_word
      direction: lower
      candidate_eligible: false
    - key: sigma_center_slope
      scope: seven_rung_partition_trajectory
      direction: upper
      candidate_eligible: true
    - key: itinerary_summary_slope
      scope: seven_rung_fixed_depth_trajectory
      direction: inherit_base_statistic
      candidate_eligible: false
    statistic_identity: All map keys include r plus statistic_key; partition keys also include the exact frozen
      partition family/parameter, and depth keys include integer k. Class-spectrum candidacy also fixes the literal
      word tuple w of length k (base-r labels) across both top bit rungs, both strata and selected replicate labels.
      A missing/empty word, unavailable depth, missing size32 class or incomplete64-way match makes that cell ineligible,
      with no choice of replacement word/depth. Partition IDs are family+canonical decimal parameters or fixed mixed-family
      name, not categories chosen from data. Every output names(bits,stratum,replicate,r) separately. sigma_center_slope
      retains its all-seven-rung trajectory scope and separate candidate route below; itinerary_summary_slope remains
      descriptive.
    descriptive_field_inventory: Full singular-value arrays, rational Q/mu, residuals, variance/argmax/frequency
      partners, minimizing arc endpoints, class sizes/word counts, per-class masses/search costs, construction operations,
      payload/workspace/RSS/cost fields, trajectory intercepts/residuals, and optional descriptive bootstrap fields
      never trigger candidacy unless the scalar key is explicitly marked candidate_eligible above. Administrative/certificate/count
      fields have direction not_applicable and no rank. A requested scalar rank absent from this inventory is a
      schema error, not a post-data choice; report the raw value only until an additive protocol definition supplies
      a key.
    scalar_review_candidate: Only one of the six scalar keys sigma_center,A_point,A_class_mean,A_class_median,A_min_size32,class_spectrum_max
      may trigger this scalar route. Require its declared one-sided rank1/65 and a defined finite standardized effect
      with positive finite sample scale and absolute value>=2 at BOTH bits22 and24, in BOTH strata, for the SAME
      at-least-two of the three replicate labels. Fix r, partition or depth and (for class_spectrum_max) literal
      word before comparing cells. All required regression, stationarity, class-match (where relevant) and order2q
      controls must pass. Missing or zero-scale cells cannot satisfy the condition. The separately declared sigma_center_slope
      route may also trigger; remaining keys are descriptive. No new family-wise significance or promotion is asserted.
    slope_review_candidate:
      identity: Fix r and the exact frozen partition ID. For each stratum and replicate use allsevenfrozen bit rungs,with
        the existing OLS definition log(max(sigma_center,2^-52)) versus logN. No subset of rungs or post-data partition
        substitution.
      matched_null: For each u=0..63 use that SAME null index across allsevenrungs and compute the identical OLS
        slope. Every observed and all64null trajectories must be complete and finite. No redraw,imputation or changedfloor.
      rank_and_effect: Upper rank=(1+count(null_gamma>=true_gamma))/65, ties against separation. Mean is sum(null_gamma)/64;
        sampleSD=sqrt(sum((null_gamma-mean)^2)/63). Require strictly positive finite SD and finite z=(true_gamma-mean)/SD>=2.
        Zero dispersion never supplies an infinite effect.
      original_falsifier: Require true_gamma>-1/4 and median64(null_gamma)<0. The median is the exact mean of the32ndand33rd
        sorted values. This explicitly defines the original null-decaying condition; no additional requirement that
        top-rung scalar statistics be eligible.
      replication: Require rank1/65,effect>=2 and the original_falsifier in BOTH strata for the SAME at leasttwo
        of the three frozen replicate labels,with the SAME r andpartition. Every predeclared applicable regression,stationarity,class-match
        andorder2qcontrol must pass.
      missing: Any required observed/null rung or control missing/invalid or SD nonpositive/nonfinite makes that
        trajectory ineligible; record the reason and retain all partial values.
      interpretation: This opens independent replication/review of the ORIGINAL primary slope question only. No
        automatic hypothesis transition,asymptotic claim or undeclared family-wise significance follows.
  slopes:
    definition: For each fixed (stratum,replicate,r,partition), fit ordinary least squares y=alpha+gamma*x across
      all seven rungs, x=ln(N), y=ln(max(sigma_center,2^-52)); report gamma, intercept, residuals and all seven
      inputs. Apply the identical fit to every common null index u. For itinerary summaries, fit only a fixed depth
      k present at all seven rungs; identify the trajectory by (stratum,replicate,r,k,statistic).
    inference: Compare each all-seven-rung observed sigma_center slope with its64same-indexmatchednullslopes using
      slope_review_candidate; report rank,finiteeffect,nullmedian andexactreplicatedidentity. Existing three-replicate
      bootstrap summaries remain descriptive,with no newinstances. Itinerary summary slopes remain descriptive.
      Missing/zero-scale trajectories cannot trigger.
