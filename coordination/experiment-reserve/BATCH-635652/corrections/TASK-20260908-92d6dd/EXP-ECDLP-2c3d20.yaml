      exactly 42 run artifacts; retries are new attempt records and never overwrite one.
  controls:
    blocking:
    - exact subgroup and exhaustive point/log-table certificate
    - nonzero pairwise-distinct r=32 scalar step table
    - byte-identical pinned-rho regression for every true map
    - scalar/point transition equality over every node
    - exact functional-graph stationarity equations
    - lumped row, stationary and SVD residual checks
    - deterministic pointwise-null domain and label-count record
    - order-2q descent-symbol homomorphism, parity and spectrum control
    descriptive:
    - second domain-separated curve stratum and three fixed replicates
    - uniform-versus-stationary weight comparison
    - null class-size distribution and deterministic 20-percent matching
    - depths beyond k_star_real listed separately
  invalidation_and_stopping:
  - Stop an affected bundle before interpretation if a certificate, regression, transition, stationarity, SVD, pointwise-null
    serialization or order-2q control fails. Preserve the failed artifact as attempted_and_inconclusive.
  - A timeout, process crash, dependency failure, curve-search exhaustion or memory exhaustion is failed_infrastructure
    and asserts nothing about the hypothesis.
  - Do not redraw a valid null because its labels are imbalanced, redraw a curve because a statistic is extreme,
    or extend the partition library after any observation. Such an execution is completed_invalid.
  - Stop at 42 complete primary bundles, the declared resource cap, or a blocking control failure. A review-candidate
    signal is archived and sent to independent review; it is not promoted in the execution session.
