    claim_tier: toy
  shared_instance_set:
    master_seed_utf8: EXP-ECDLP-709063|shared-instance-set|v2|TASK-20260907-e11ec7|20260907
    seed_derivation: For subgroup bit size b, instance index i in {0,1}, and attempt a=0,1,..., compute D=SHA256(master_seed_utf8_bytes
      || 0x00 || UTF8('candidate|'||b||'|'||i||'|'||a)). The candidate seed is the unsigned big-endian integer in
      D[0:8]. Call harness.toycurve.generate_instance(candidate_seed,b).
    acceptance: Accept the first candidate for which p<2^28, p has exactly b bits, the returned prime subgroup order
      N has exactly b bits, N>=5, P!=O, [N]P=O, Q=[k]P with 2<=k<=N-1, and its canonical tuple (p,A,B,N,P_x,P_y,Q_x,Q_y,k)
      differs from every earlier accepted tuple. Record each rejected seed and reason. At b=28, p<2^28 explicitly
      rejects a next-prime overflow so all coordinates fit the declared uint32 format. Exhaustion of 20000 attempts
      for a cell is failed_infrastructure.
    canonical_instance: Encode each integer as minimal unsigned big-endian bytes prefixed by a four-byte big-endian
      length; encode O as a zero length. Concatenate the fields in the tuple order above. instance_id is 'I-' plus
      the first sixteen lowercase hex digits of SHA256(canonical_instance). The immutable shared-instance manifest
      lists the master-seed bytes and SHA-256, every candidate/rejection, accepted seed and tuple, generator/solution
      checks, harness source blob hashes. The shared-instance-manifest.json contains no field for its own hash.
    timing_boundary: Generate, certify, serialize and hash all eight instances before either algorithm execution.
      Instance generation, knowledge of k, and certification are setup and are excluded from solve timing but retained
      in setup operation and wall-time fields. All arms refer to instance_id and the same manifest SHA-256; no arm
      may regenerate a curve.
    sharing_rule: The master seed is public reproducibility material, not cryptographic entropy. Both independent
      executions and both sibling experiments use the same eight instances. Algorithm-stream seeds may vary as specified
      below; curves, P, Q, N and known k do not.
    manifest_hash_custody: 'Serialize shared-instance-manifest.json as UTF8 canonical JSON: recursively sorted string
      keys, compact comma/colon separators, integer/bool/null/string/array/object values only, no floats/duplicate
      keys, followed by one LF. Its SHA256 is stored in separate shared-instance-manifest.sha256 containing exactly64lowercase
      hex digits followed by LF. Every referring arm/plan binds that digest and recomputes it from complete manifest
      bytes. The sidecar contains no self-hash and is hash-bound by the later outer run manifest/archive.'
  portable_fixed_physical_table:
    slot_layout: 'Allocate exactly S=floor(C/16) consecutive physical slots for byte budget C. Slot q occupies bytes
      [16q,16q+16) and is struct <IIII: little-endian uint32 x, uint32 y, uint32 exponent, uint32 state. state=0
      is empty; state=1 is an affine key; state=2 is O with x=0,y=0. No tombstones exist. Affine coordinates and
      exponents are below 2^28 by the instance rules. O is stored as the ordinary baby step j=0 rather than omitted.'
    key_encoding_and_hash: enc(O)=0x00. For affine (x,y), enc=0x04 || uint32_be(x) || uint32_be(y). h(point)=uint64_little_endian(SHA256(UTF8('EXP-ECDLP-709063|table|v2')
      ||enc(point))[0:8]) mod S. Probe q_t=(h+t) mod S for t=0,...,S-1. Equality compares state and both coordinates.
      On lookup, state=0 means absent; on insertion, the first state=0 slot is used. Duplicate keys must carry the
      identical exponent or the table is completed_invalid.
    capacity: The maximum occupied entries are E=floor(7*S/10). An attempted insertion when occupied=E returns TABLE_FULL
      before writing, even if a physical empty slot remains. The buffer is allocated once as exactly 16*S zero bytes
      and exposes no resize, grow, rehash, spill, secondary dictionary, or auxiliary point-to-exponent path. Every
      read/write checks 0<=q<S. The caller supplies the buffer; the table cannot allocate another table internally.
    exact_capacities:
    - budget_bytes: 8
      slots: 0
      usable_entries: 0
      allocated_table_bytes: 0
    - budget_bytes: 4096
      slots: 256
      usable_entries: 179
      allocated_table_bytes: 4096
    - budget_bytes: 32768
      slots: 2048
      usable_entries: 1433
      allocated_table_bytes: 32768
    - budget_bytes: 262144
      slots: 16384
      usable_entries: 11468
      allocated_table_bytes: 262144
    measured_memory_fields: Record C,S,E,occupied,allocated_table_bytes=16S, occupied_payload_bytes=16*occupied,
      budget_slack=C-16S, probe counts, buffer object identity and length before/after the arm, process baseline
      RSS, peak RSS and RSS delta. The physical slot cost is exactly 16 bytes by format; allocated bytes per occupied
      entry is also reported and is not mislabeled as slot size. RSS includes runtime overhead and is never used
      as the table-cap predicate.
    portability_and_enforcement: A conforming implementation may use a mutable byte array or anonymous mapping,
      but must expose the exact byte length and access it only through this layout. The cap is enforced by the addressable
      slot range and absent grow path, not by a logical byte counter or a platform-specific RLIMIT. ENOMEM, process
      termination, or a particular operating system is not an expected control outcome. The separate 8 GiB process
      guard remains machine protection only.
    representation_domains: logical_point,hash_preimage,physical_slot are distinct tagged schema domains with explicit
      encoders/decoders; all affine states/coordinates and O cases round-trip within their domain. Hash equality
      is point equality, physical empty has no logical point and is never hashed. Golden artifacts name the domain
      and exact bytes.
  table_enforcement_controls:
    positive_budget_probe: Once per execution and positive budget, use successive distinct baby points from the
      first 16-bit shared instance. Insert exactly E keys and require occupied=E, buffer length=16S and all lookups
      correct. Attempt key E+1 and require TABLE_FULL, occupied still E, unchanged buffer identity/length and byte-for-byte
      unchanged buffer SHA-256. Then look up all E keys again.
    degenerate_budget_probe: Once per execution construct the C=8 table. Require S=E=0 and an attempted insertion
      of O to return TABLE_FULL without allocating a table buffer. This is NULL 2 and proves that fixed-table BSGS
      cannot start at that budget.
    forbidden_outcomes: An exception caused only by an out-of-range memory access, a changed buffer length, hidden
      spill structure, successful E+1 insertion, missing retained key, or reliance on a counter while a separate
      table grows voids every memory interpretation in that execution.
  charged_group_operation_convention:
    curve_wrapper: All solvers use the same immutable elliptic-curve object and counting wrapper. Each call to complete
      group addition, including doubling and an addition involving O, charges one group operation. Scalar multiplication
      is the pinned left-to-right binary double-and-add routine and charges every wrapped addition/doubling it invokes.
      Hashing, probing and integer arithmetic have separate counters and never enter group_operations.
    total: total_group_operations includes solver precomputation, baby steps, giant steps, rho table construction/restarts,
      and the final [candidate]P=Q certificate. Setup instance generation is excluded and reported separately. Also
      report the baby, giant, scalar-precompute, walk, restart, certificate, hash and probe components so equality
      can be audited.
    solution_validity: An arm succeeds only if it returns k_hat in [0,N-1] and [k_hat]P=Q. Compare with the pre-generated
      k only after the public group equation passes. A wrong solution is completed_invalid; a TABLE_FULL refusal
      in the exact arm-A condition is a declared capacity outcome, not a solver failure.
  bsgs_arms:
    common_algorithm: For table length M, insert [j]P -> j for j=0,...,M-1 by starting with O and adding P successively.
      Compute H=[M]P using the charged scalar routine. Starting G=Q, for ell=0,...,ceil(N/M)-1, look up G; on a
      hit j, certify k_hat=(ell*M+j) mod N; otherwise replace G by G-H with one charged addition. The loop bound
      covers every residue 0,...,N-1. No use of known k is allowed in the solve or stopping decision.
    unbounded_null_1: Set m=ceil(sqrt(N))=isqrt(N-1)+1 and S_unbounded=ceil(10*m/7), so floor(7*S_unbounded/10)>=m.
      Allocate one 16*S_unbounded buffer in the same format and run the common algorithm with M=m. Record its cost
      beside the rho distribution. BSGS using fewer operations is an expected sanity pattern from the source proposal,
      but the comparison itself is an observation; only solution correctness and complete charging are blocking
      controls.
    arm_a_fixed_table: For budget capacity E, set m=isqrt(N-1)+1. If m>E, return CAPACITY_REFUSAL before constructing
      H or solving. If m<=E, run the common algorithm with M=m in the fixed C-byte buffer. Arm A reports a feasibility
      cliff and never a cost crossover.
    arm_b_memory_constrained: For every positive budget set M=min(E,N). M is positive for all declared cells. Insert
      exactly M baby steps in the fixed C-byte buffer and run the common giant-step algorithm through ceil(N/M)-1.
      A TABLE_FULL response at or before insertion M is an instrument failure. Arm B is the only arm used in measured
      crossover differences.
  stage_accounting_and_memory_conformance:
    advisory_estimates:
    - stage: stage0_freeze_and_manifest
      wall_seconds: null
      cpu_seconds: null
    - stage: immutable_instance_generation
      wall_seconds: null
      cpu_seconds: null
    - stage: rho_baseline
      wall_seconds: null
      cpu_seconds: null
    - stage: arm_a_measurements
      wall_seconds: null
      cpu_seconds: null
    - stage: arm_b_measurements
      wall_seconds: null
      cpu_seconds: null
    - stage: representation_controls_and_report
      wall_seconds: null
      cpu_seconds: null
    estimate_semantics: Null estimates mean unestimated advisory cost. They are not zero and do not alter the fixed
      instances, 16 rho streams, 12-restart and iteration caps, positive budgets, representation controls, or stopping
      rules.
    actual_stage_record: For every stage, execution, instance and budget cell store started_monotonic_ns, finished_monotonic_ns,
      wall_ns, cpu_user_ns, cpu_system_ns, group_additions, group_doublings, table_lookups, scalar_multiplication_group_operations,
      certificate_group_operations, bytes_read, bytes_written, declared_array_bytes, declared_workspace_bytes, process_group_peak_bytes,
      and termination as typed nonnegative JSON integers except that an unavailable measurement is null with a required
      reason. Aggregate totals sum completed rows and are never estimates.
    typed_encodings:
      point: 'Logical interchange only: packed<BII,9bytes: O=(0,0,0), affine=(1,x,y). This is not a physical slot
        or hash preimage.'
      scalar: unsigned little-endian uint32 for every declared toy order and scalar
      rho_attempt: JSON object with integer stream, restart, iteration count and charged operation counts; typed
        outcome enum
      baby_table_key: 'Physical table only: exactly<IIII,16bytes per slot, x,y,exponent,state; state0empty,1affine,2O.
        No13-byte point-plus-value physical record exists.'
      budget_and_count: unsigned little-endian uint32 or typed nonnegative JSON integer
      cost: typed nonnegative JSON integer; rational expected costs use separate integer numerator and denominator
      scalar_summary: JSON number when finite; censored or undefined values are JSON null plus a reason enum
      hash_preimage: 'Hash input only: O=single0x00; affine=0x04||uint32_be(x)||uint32_be(y),9bytes. Map logical
        O state0 to occupied physical O state2; never confuse it with physical empty state0.'
    encoded_size_checks: Every binary object records dtype, byte_order, shape, itemsize, nbytes, file_bytes and
      SHA-256. Require nbytes=itemsize*product(shape) and file_bytes=nbytes before use. Every row-count field parses
      as an integer; equations appear only in the separate derivations map.
    streaming_order_and_lifetimes: Process execution, immutable instance, arm and budget in frozen order. Keep one
      instance, one rho attempt or one Arm-A/Arm-B cell, one baby table, one giant-step state and one certificate
      workspace live. Flush each typed row atomically, release its table and workspace, then advance. Retain only
      scalar rows required for medians, adjacent-sign decisions and reports. No simultaneous tables for multiple
      budgets, instances, streams or arms are permitted.
    prospective_peak_formula: Before a stage starts, sum exact nbytes of every simultaneously live typed object,
      the hash-table implementation's documented capacity and load-factor overhead, scalar-multiplication workspace,
      measured curve-object allocator bytes, and a separately measured runtime baseline. This is a prospective conformance
      bound, not measured peak RSS. Record every term and lifetime.
    process_group_guard:
      mechanism: linux_cgroup_v2_memory_controller
      limit_bytes: 8589934592
      swap_limit_bytes: 0
      setup: A supervisor outside the worker cgroup creates a fresh cgroup before any scientific allocation, writes
        memory.max=8589934592, memory.swap.max=0 and memory.oom.group=1, reads all three values back, then moves
        the one-worker launcher into cgroup.procs. Descendants inherit the aggregate limit. No per-process RLIMIT
        or polling-only counter substitutes for this guard.
      unavailable: If the controller or required write/readback is unavailable, launch no scientific cell and record
        memory_guard_unavailable as failed_infrastructure.
      oom_semantics: Flush each completed row atomically. On memory.events oom or oom_kill, preserve flushed rows
        and the supervisor transcript, mark the unfinished cell failed_infrastructure, and draw no scientific inference.
      measurements: Record memory.current at stage boundaries, memory.peak when exposed, memory.events before/after,
        and process RSS diagnostics. A missing peak is null with reason; it is never replaced by the prospective
        byte sum.
  rho_baseline:
    implementation_source_binding:
      path: harness/rho.py
      sha256: de952371bfa0513b4783e78012f7eddb1098ef2a1fef5bd9adc2b34e2a86bcc0
      provenance: internal_parent_relayed_current_read
      binding_note: This implementation hash was relayed by the parent Coordinator after confirming it is not among
        TASK-20260907-8e3963's 22 original source bindings. Future execution must bind this exact additional source
        or obtain an additive protocol correction; it is not silently treated as an original handoff input.
    stream_seed: For execution e in {0,1}, instance_id I, and stream u=0,...,15, compute D=SHA256(master_seed_utf8_bytes
      || 0x00 || UTF8('rho|'||e||'|'||I||'|'||u)); rho_seed is the unsigned big-endian integer D[0:8]. Copy the
      immutable instance while replacing only its public seed field with rho_seed, then call the pinned harness/rho.py
      solver. This creates a fresh table/start stream on the identical curve,P,Q,N.
    run_rule: Preserve the pinned source default branch_count=32. Define floor_sqrt(N) as the greatest integer t
      with t*t<=N and pass the explicit integer I_max(N)=max(2000,200*floor_sqrt(N)+200) as max_iterations. This
      is the exact integer form of the source default at the declared toy orders and removes floating-point and
      launch-time choice. Each stream makes one solve call; that call constructs its branch table once, executes
      the source's internal restart offsets r=0,...,11 in order, and for each offset executes transition iterations
      it=1,...,I_max(N). A noninvertible collision or a recovered scalar failing [k]P=Q ends that restart unsuccessfully
      and the next source-scheduled offset begins. The first certified scalar makes the stream successful and stops
      later restarts. If all 12 restarts fail or reach their cap, the stream is algorithmically_censored. Charge
      table construction, initialization, every transition, collision processing, all failed restarts, and the successful
      certificate multiplication in total_group_operations under the common convention. Reject launch unless the
      exact base hash and independently reviewed complete corrected hash match prospective_scalar_amendment; no
      other solver modification is allowed.
    censoring: Retain exactly 16 stream rows for every (execution,instance), including algorithmically_censored,
      certificate_invalid, timeout, resource_stop, crash and successful rows; never delete, redraw, or replace a
      stream. Infrastructure outcomes are typed separately from algorithmic censoring and assert nothing about rho.
      The baseline is usable only with at least 12 valid certified successes among those same 16 scheduled streams.
      Its primary cost is the ordinary median of successful fully charged total_group_operations; for an even success
      count it is the arithmetic mean of the two middle sorted values. Fewer than 12 successes censors every Arm-B
      crossover cell for that execution and instance. The success rate always has denominator 16 and every unsuccessful
      row remains in raw data.
    prospective_scalar_amendment:
      base_source:
        path: harness/rho.py
        sha256: de952371bfa0513b4783e78012f7eddb1098ef2a1fef5bd9adc2b34e2a86bcc0
        provenance: internal_parent_relayed_current_read
        binding_note: This implementation hash was relayed by the parent Coordinator after confirming it is not
          among TASK-20260907-8e3963's 22 original source bindings. Future execution must bind this exact additional
          source or obtain an additive protocol correction; it is not silently treated as an original handoff input.
      permitted_change: Before execution create a new immutable copy of the exact base source and replace ONLY the
        nested _count_mul function with the canonical implementation below. Preserve all RNG, branch, restart, collision
        and solver control flow. This explicitly supersedes the old requirement to execute the unmodified source
        hash; bind both the base hash and the complete corrected implementation hash in solver-source-bindings and
        receive independent source review before launch.
      replacement_python: "def _count_mul(k_val: int, pt: Point) -> Point:\n    nonlocal total_ops\n    if k_val\
        \ < 0:\n        raise ValueError(\"nonnegative scalar required\")\n    if k_val == 0:\n        return None\n\
        \    result_pt = pt\n    for digit in bin(k_val)[3:]:\n        result_pt = E.add(result_pt, result_pt)\n\
        \        total_ops += 1\n        if digit == \"1\":\n            result_pt = E.add(result_pt, pt)\n    \
        \        total_ops += 1\n    return result_pt\n"
      cost: s(0)=0; for positive k,s(k)=bit_length(k)-1+popcount(k)-1. All internal rho scalars are nonnegative
        residues by the unchanged solver. Negative values are a protocol-domain error. Every actual E.add counts
        including O and doubling; an alias to the old right-to-left loop is nonconforming.
  execution_order:
  - Materialize, certify and hash the eight-instance manifest, representation definition, solver source bindings
    and complete 16-artifact execution plan.
  - In each execution run the three positive-budget probes and the single 8-byte probe. Archive their results before
    solving any crossover cell.
  - Run unbounded BSGS and all sixteen rho streams for each shared instance; archive correctness, costs and censoring
    before Arm B comparison.
  - Run all Arm A and Arm B cells in lexicographic order (subgroup_bits,instance_index,budget_bytes), clearing and
    zero-hashing the same-sized new buffer for each arm. Never reuse a populated baby table.
  - Compute per-instance differences, per-size aggregates and crossover classifications only after all required
    rows are immutable.
  metrics_and_decisions:
    per_row_required: execution,instance_id,bits,budget,arm,termination,solution_valid, total_group_operations and
      components, wall_ns, baseline/peak/delta RSS, S,E,occupied,allocated/occupied table bytes, load, hash probes,
      source hashes and attempt artifact SHA-256.
    arm_a_cliff: For each positive budget, report the largest tested size at which every instance in both executions
      has m<=E and starts, and the first higher rung with m>E. If none starts, report NO_TESTED_RUNG_STARTS; if
      all start, report ALL_TESTED_RUNGS_START. The exact modeled predicate m<=E is shown beside every row; disagreement
      is an instrument failure.
    per_instance_difference: For an uncensored cell define D(e,I,C)=ArmB_total_group_operations minus median_successful_rho_total_group_operations
      on that execution and instance. Negative means constrained BSGS used fewer charged group operations.
    per_size_difference: For fixed (e,b,C), sort the two instance differences and define their ordinary median as
      their arithmetic mean. Both instances must be uncensored. No confidence interval is inferred from two instances.
    measured_crossover: For one execution/budget, report the first adjacent TESTED rung pair(b_lo,b_hi) with median_D(b_lo)<0
      and median_D(b_hi)>=0 only when every lower tested rung is negative and every higher tested rung is nonnegative.
      If both executions agree, label REPLICATED_TESTED_GRID_SIGN_CHANGE and report the actual two rung values.
      All four medians negative in both gives ALL_TESTED_RUNGS_BSGS_LOWER; all nonnegative gives ALL_TESTED_RUNGS_BSGS_NOT_LOWER.
      These assert only the tested grid, with no bound on an unmeasured crossover bit size. Reverse/multiple changes,
      execution disagreement or censoring give NONMONOTONE_OR_INCONCLUSIVE. No unproved monotonicity or inter-rung
      crossing follows.
    no_interpolation: No interpolation, continuous crossover location, lower/upper bound beyond the tested grid,
      regression of D, pooling operations with wall time, or conflation with the exact ArmA capacity predicate.
      Capacity endpoints also remain tested-grid statements.
    modeled_values: 'Let E>1 be the exact positive baby-table capacity. Freeze the convention that the table stores
      [j]P for j=0,...,E-1, including O, and costs E-1 group additions to construct. Compute G=[E]P by left-to-right
      binary scalar multiplication at s(E)=bit_length(E)-1+popcount(E)-1 charged group operations. For certified
      challenge scalar k_hat in {2,...,N-1}, the first matching giant index is ell=floor(k_hat/E): it costs exactly
      ell giant additions and ell+1 separately reported hash lookups. Certification costs s(k_hat) group operations
      under the same binary convention. Thus the fully charged deterministic BSGS value is B_full_actual=(E-1)+s(E)+ell+s(k_hat),
      and the primary modeled difference is D_full_actual=B_full_actual-rho_median, where rho_median is the measured,
      certified, fully charged usable comparator defined above. For the uniform descriptive model k in {2,...,N-1},
      put q=floor(N/E), r=N-qE, G_num=E*q*(q-1)/2+q*r and S_num=sum_{k=2}^{N-1}s(k). Then E[ell]=G_num/(N-2) and
      B_full_expected=(E-1)+s(E)+(G_num+S_num)/(N-2), stored as an exact rational numerator/denominator before decimal
      rendering. The maximum giant additions are ceil(N/E)-1. Report separately the inherited source crossover N_star_source=(c_ref*E)^2
      and the partial proxy D_partial_proxy(N)=E+ceil(N/E)-c_ref*sqrt(N), with c_ref the ordinary median over usable
      per-instance rho_median/sqrt(N) values. The partial proxy is not called charged, net, measured, optimistic,
      pessimistic, or a bound: E in place of E-1 and ceil(N/E) in place of actual ell overstate two BSGS terms,
      while omitting s(E) and s(k_hat) understates BSGS; replacing measured rho by c_ref*sqrt(N) also suppresses
      instance, restart, setup, collision and certificate variation. Its net bias has no proven sign. Neither proxy
      substitutes for measured D, D_full_actual, or the frozen adjacent tested-grid sign-change pair. Report analytic
      c=0.8862269254527580 only as a source comparison, never as a measured constant.'
    wall_time: Wall time and operation count are separate. A wall-time crossover may be tabulated descriptively
      using the identical tested-grid classification rule, but cannot replace the primary group-operation classification
      because allocation, hashing and language/runtime overhead differ across arms.
    artifact_schema_scope: arm-b-crossover.json stores only one of REPLICATED_TESTED_GRID_SIGN_CHANGE,ALL_TESTED_RUNGS_BSGS_LOWER,ALL_TESTED_RUNGS_BSGS_NOT_LOWER,NONMONOTONE_OR_INCONCLUSIVE
      per budget/execution context,plus actual tested rung values,per-instanceD,medians andreplication status. No
      crossover_bits_less_than,crossover_bits_greater_than or other unmeasured endpoint-bound field is permitted.
      A sign-change pair identifies two tested rungs only; it asserts no monotonic function between them.
