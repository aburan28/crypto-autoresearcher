  - Froze sixteen rho streams per shared instance and execution, a 12-of-16 validity threshold, fully charged median
    cost and exact stream derivation.
  - Recast the source's forced unbounded-BSGS ordering as a descriptive sanity comparison. Solver correctness is
    a valid blocking control; a particular performance ordering cannot be assumed true and then counted as evidence.
  - Preserved the source N*=(cE)^2 expression only as a separately labeled source proxy, relabeled the inherited
    discrete expression as a partial proxy with indeterminate net bias, and added fully charged actual and exact
    rational expected BSGS expressions. None is an observed crossover or a substitute for adjacent measured cells.
  - Every item above is prospective design or an internal source-state read. No algorithm was run, no buffer was
