    artifact_definition: One run artifact is one (execution,bits,instance_index) bundle containing its unbounded
      BSGS, sixteen rho trials, three Arm A rows and three Arm B rows. The four representation controls are execution-level
      artifacts referenced by each of its eight bundles. Retries create new attempts and never overwrite.
  controls:
    blocking:
    - immutable shared-instance manifest and identical instance_id in every arm
    - '[k_hat]P=Q for every solver success'
    - common charged arithmetic wrapper and component-sum equality
    - fixed 16-byte representation hash and exact capacity table
    - E+1 unchanged-buffer probe at all three positive budgets
    - zero-slot 8-byte TABLE_FULL probe
    - Arm A start/refusal exactly agrees with ceil(sqrt(N))<=E
    - Arm B inserts exactly M keys without growth or spill
    - at least 12 of 16 certified rho streams for each compared instance
    - all required operation and memory fields beside every comparison
    descriptive:
    - unbounded BSGS versus rho operation distribution on every shared instance
    - two execution bundles derived from one master seed with disjoint rho domains
    - modeled source proxy and charged model in columns separate from measurement
  invalidation_and_stopping:
  - A wrong solution, source/instance/representation hash mismatch, hidden table growth or spill, failed capacity
    probe, component-count mismatch, Arm A predicate mismatch, or missing memory field makes the affected execution
    completed_invalid and forbids a crossover interpretation.
  - Fewer than 12 certified rho streams censors that instance and can make a tested-grid classification inconclusive;
    it is not evidence for either algorithm.
  - Timeout, dependency failure, process crash, host loss, or exhaustion of the deterministic instance search is
    failed_infrastructure and asserts nothing scientific. Expected CAPACITY_REFUSAL/TABLE_FULL events are controls
    only in their exact predeclared cells.
  - Stop at the sixteen complete immutable bundles, one-worker/8-GiB machine guard, or a blocking representation/solver
    control failure. Preserve all partial rows and reasons. Do not alter budgets, load factor, seed, iteration cap,
    stream-success threshold or crossover rule after observing data.
