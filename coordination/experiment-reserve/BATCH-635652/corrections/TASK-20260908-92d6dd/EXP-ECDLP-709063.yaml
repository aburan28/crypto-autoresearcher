  claim_boundary: This amendment freezes a prospective portable calibration protocol. It is not approval, execution,
    an attack, an algorithmic improvement, an observed crossover, evidence, or a reinterpretation of any earlier
    baseline record. All instances contain a known scalar generated before solving, and all support is capped to
    the declared toy cells and physical table format.
  objective: On a newly frozen set of eight shared known-solution instances, measure unbounded, fixed-table and
    memory-constrained baby-step giant-step beside sixteen charged rho streams at subgroup sizes 16,20,24,28 bits.
    Enforce each nominal table budget through one fixed byte-addressed buffer with no growth path, separate the
    fixed-table feasibility cliff from the constrained-table cost crossover, and report either an adjacent tested-rung
    sign-change pair or an explicit tested-grid all-same-sign or inconclusive label without interpolation.
  source_state_resolution:
    exp_4320a7_state_read: review_required
    exp_4320a7_frozen: false
    exp_4320a7_approved_by: null
    exp_4320a7_execution_authorized: false
    exp_4320a7_replication_seeds: []
    exp_4320a7_run_or_instance_artifacts_found_in_supplied_snapshot: false
    consequence: There is no approved or hash-bound EXP-ECDLP-4320a7 instance manifest to inherit or completed NULL
      1 result to reuse. This amendment therefore freezes a new master seed and one exact generation algorithm.
      Before either sibling experiment executes, a separate additive amendment to EXP-ECDLP-4320a7 must reference
      the resulting manifest SHA-256. The historical 4320a7 file is not rewritten. A later-discovered conflicting
      manifest stops launch for Coordinator reconciliation; it is never silently replaced.
    evidence_status: This source-state read resolves provenance only. Absence of a supplied run artifact asserts
      nothing about either algorithm or hypothesis.
