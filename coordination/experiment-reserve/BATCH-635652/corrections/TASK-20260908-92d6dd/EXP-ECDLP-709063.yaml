  - Resolved the absent sibling instance manifest by freezing one explicit public master seed, candidate-seed derivation,
    acceptance predicate and future cross-experiment manifest binding. No source instance file existed to inherit
    in the supplied snapshot.
  - 'Replaced platform-specific RLIMIT/ENOMEM language with a portable physical byte-buffer contract: exact 16-byte
    slots, fixed addressable range, no grow path, explicit O state, 0.70 load cap and an unchanged-buffer E+1 test.'
  - Derived exact capacities 0,179,1433,11468 for the four declared budgets and distinguished physical slot bytes,
