  proof_search_map:
    applicability: empirical calibration of two incumbent algorithms
    exact_baseline_reproduction: Unbounded BSGS and pinned rho run through one charged group wrapper on the same
      hash-bound known-solution instances, with full component sums and solution certificates.
    observation_collision_search: Table feasibility, table load policy, group operations, hash probes, RSS, wall
      time, rho failures and model extrapolation can each move an apparent crossing. They are separate columns and
      only fully charged operations define the primary measured tested-grid sign-change pair.
    quantifier_order: Master seed, instances, table bytes, load factor, operation convention, stream domains, censoring
      and adjacent-sign rules are frozen before either execution; every declared cell is then retained before classification.
    method_ceiling: Four toy rungs and three tiny table budgets permit only a finite tested-grid calibration or
      all-same-sign/inconclusive label. They do not determine deployment memory, an asymptotic exponent, or whether
      a baseline is generally suitable.
    nearby_object_control: The zero-slot table and E+1 immutable-buffer probes are known capacity failures. The
      unbounded table is the nearby object with no declared budget cliff. A proof or implementation that treats
      these identically is invalid.
