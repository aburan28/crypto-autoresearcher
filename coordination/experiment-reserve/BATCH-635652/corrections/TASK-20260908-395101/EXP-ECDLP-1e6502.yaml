      estimate_semantics: Null estimates mean unestimated advisory cost. They are not zero and do not alter the
        fixed 36 non-anomalous bundles, target 24 anomalous bundles, 64 nulls, exact controls, or stopping rules.
      actual_stage_record: For every stage and bundle store started_monotonic_ns, finished_monotonic_ns, wall_ns,
        cpu_user_ns, cpu_system_ns, group_operations, field_operations, formal_group_operations, fft_calls, bytes_read,
        bytes_written, declared_array_bytes, declared_workspace_bytes, process_group_peak_bytes, and termination
        as typed nonnegative JSON integers except that an unavailable measurement is null with a required reason.
        Aggregate totals sum completed records and are never inferred from advisory estimates.
      typed_encodings:
        point_table: 'packed little-endian records <BII: uint8 state, uint32 x, uint32 y; O is (0,0,0), affine is
          state 1'
        scalar_index_and_permutation: little-endian uint32; shape [N]; file length must equal 4*N
        padic_coordinate: unsigned little-endian fixed-width integer using ceil(3*bit_length(p)/8) bytes; canonical
          range [0,p^3-1]
        base_digit_or_post_function: unsigned uint32 little-endian; shape [N]; values are canonical residues in
          [0,p-1] or binary values
        exact_centering_vector: signed little-endian int64; shape [N]; v_i=N*g_i-sum(g)
        fft_input: IEEE-754 binary64 little-endian; shape [N]
        fft_output: interleaved IEEE-754 binary64 complex pairs little-endian; shape [N,2]
        scalar_summary: JSON number when finite; missing or undefined values are JSON null plus a reason enum
      encoded_size_checks: Every binary object records dtype, byte_order, shape, itemsize, nbytes, file_bytes and
        SHA-256. Require nbytes=itemsize*product(shape) and file_bytes=nbytes before use. JSON integer count fields
        must parse as integers, not arithmetic strings.
      streaming_order_and_lifetimes: Process bundles in lexicographic (bits,stratum,replicate) order and one precision
        at a time. Keep only the current point/log table, its current lifted point and formal coordinates, one digit/member
        vector, one permutation, one centering vector, one FFT input and one FFT output/workspace live. Generate
        and verify p-adic data point by point; release precision-three coordinates after their reduction and digit
        extractions. Process null indices 0..63 sequentially and retain only scalar summaries and family maxima.
        Finish and release the ordinary bundle before its anomalous calibration. No [64,136,N] null tensor and no
        all-point precision-three object graph may be resident.
      prospective_peak_formula: Before a bundle starts, sum exact nbytes for every simultaneously live typed object,
        the p-adic library's measured live-object allocation, the FFT library's documented worst-case workspace,
        and a separately measured runtime baseline. This is a prospective conformance bound, not measured peak RSS.
        Record every term and lifetime.
      process_group_guard:
        mechanism: linux_cgroup_v2_memory_controller
        limit_bytes: 8589934592
        swap_limit_bytes: 0
        setup: A supervisor outside the worker cgroup creates a fresh cgroup before any scientific allocation, writes
          memory.max=8589934592, memory.swap.max=0 and memory.oom.group=1, reads all three values back, then moves
          the one-worker launcher into cgroup.procs. Descendants inherit the same aggregate limit. No per-process
          RLIMIT or polling-only counter substitutes for this guard.
        unavailable: If the controller or required write/readback is unavailable, launch no scientific cell and
          record memory_guard_unavailable as failed_infrastructure.
        oom_semantics: Flush each completed scalar row atomically. On memory.events oom or oom_kill, preserve flushed
          rows and the supervisor transcript, mark the unfinished cell failed_infrastructure, and draw no scientific
          inference.
        measurements: Record memory.current at stage boundaries, memory.peak when exposed, memory.events before/after,
          and process RSS diagnostics. A missing peak is null with reason; it is never replaced by the prospective
          byte sum.
    deterministic_curve_generation:
      encoding: SHA256 inputs are UTF-8 fields joined by literal vertical bars; each digest is an unsigned big-endian
        integer.  For every (bits,stratum,replicate), p is the first in-range nextprime of 2^(bits-1)+SHA256(tag|p|counter)
        mod 2^(bits-1).
      nonanomalous: 'Under tag "EXP-ECDLP-1e6502|ordinary|bits|stratum|replicate", scan u=0,...,4095 with A=SHA256(tag|A|u)
        mod p and B=SHA256(tag|B|u) mod p.  Reject zero discriminant.  Count #E exactly and accept only #E=N an
        odd prime with N!=p.  The whole curve is then the cofactor-one subgroup.  Scan lift_x(SHA256(tag|P|u|v)
        mod p), v=0,...,4095, and accept the first non-infinity P satisfying [N]P=O. Record every rejection; bounded
        exhaustion leaves a missing bundle.'
      anomalous: 'Under tag "EXP-ECDLP-1e6502|anomalous|bits|stratum|replicate", use the same search but accept
        exactly #E=p.  Since p is prime, the first non-infinity point P is a generator after checking [p]P=O.  Twenty
        scalars are m_j=1+SHA256(tag|scalar|j) mod (p-1), j=0,...,19, and Q_j=[m_j]P.  No found curve is duplicated
        to fill a missing bundle.'
      log_domain: For non-anomalous curves enumerate W_i=[i]P for i=0,...,N-1 and independently recalculate min(1000,N)
        domain-separated indices. The array length remains N in every precision and every member.
    lifted_curve_and_hensel_section:
      ring: R_s=Z/p^s Z for s=2 or 3.  The naive curve lift is y^2=x^3+A*x+B with A and B the least representatives
        in [0,p-1], unless an anomalous perturbation is explicitly selected below.
      teichmuller_x: For x0 in {1,...,p-1}, T_s(x0)=x0^(p^(s-1)) mod p^s; set T_s(0)=0. Check T_s(x0)=x0 mod p and
        T_s(x0)^p=T_s(x0) mod p^s.
      hensel_y: For affine R=(x0,y0) with y0!=0, set X=T_s(x0), Y_1=y0.  Given Y_j modulo p^j, let c_j=((Y_j^2-X^3-A*X-B)/p^j)
        mod p and set Y_(j+1)=Y_j-p^j*c_j*(2*Y_j)^(-1) mod p^(j+1), for j=1,...,s-1. The inverse is reduced modulo
        p.  Define L_s(R)=(X,Y_s) and check the curve equation modulo p^s.  O is lifted to O.  A y0=0 input has
        no unique Hensel branch and is masked from the digit census.
      affine_scalar_chain: To compute [N-1]L_s(R), use left-to-right binary double-and-add after the leading one.  Every
        intermediate integer scalar lies in {1,...,N-1}; because N is odd prime, its reduction is neither O nor
        a two-torsion point.  Every affine denominator is therefore a unit.
    formal_kernel_and_chart:
      chart: A formal point is represented by (t,w), equivalently projective [t:-1:w], with t in pR_s and w=t^3+A*t*w^2+B*w^3
        mod p^s.  Starting w=t^3, iterate the right-hand side until stable; at s<=3, t in pR_s implies w=0 mod p^s,
        but the equation and residual are still recorded.
      final_near_opposite_addition: Let L=(x1,y1) and M=[N-1]L=(x2,y2).  Put d=x2-x1, h=y2-y1, U=h^2-d^2*(x1+x2),
        and V=h*x1*d^2-h*U-y1*d^3 in R_s.  Reduction gives d=0 mod p and h=-2*y1 mod p, so U and V are units.  The
        formal chart of K=L+M=[N]L is t_K=-U*d*V^(-1) and w_K=-d^3*V^(-1) mod p^s.  This is obtained by clearing
        the nonunit chord denominator before forming t=-x/y; check the chart equation rather than attempting affine
        division by d.
      formal_log_precision: With invariant differential dx/(2y), the short-Weierstrass formal logarithm begins z(t)=t+(2A/5)t^5+(3B/7)t^7+higher
        terms.  Coefficients are generated from the chart equation, and a term is retained exactly when its p-adic
        valuation is below s.  Here p>7, t is divisible by p, and s<=3, so every term after t vanishes modulo p^s
        and z_K=t_K exactly at the used precision.  The implementation records the valuation test; it must not assume
        this truncation at another p or precision.
      formal_translation: For z in pR_s and affine (x,y), translation by the formal point whose formal logarithm
        is z is, modulo p^3, x'=x+2*y*z+(3*x^2+A)*z^2 and y'=y+(3*x^2+A)*z+6*x*y*z^2. For s=2 reduce the same formulas
        modulo p^2.  They are the degree-two expansion of exp(zD), D=2y*d/dx+(3x^2+A)*d/dy; omitted terms contain
        z^3 and vanish at s<=3.  Check the curve equation after every use.
    prime_to_p_torsion_section:
      inverse_scalar: For N=#E(F_p) with gcd(N,p)=1, compute u_s=N^(-1) mod p^(s-1), choosing 0<=u_s<p^(s-1).  The
        filtration quotients of the formal kernel are additive F_p groups, so p^(s-1) kills E_1(R_s).  Consequently
        scalar multiplication by u_s is defined on K=[N]L and [N*u_s]K=K.
      section: Let z_K=formal_log(t_K), z_U=u_s*z_K mod p^s, and define S_t,s(R)=translate(L_s(R),-z_U).  Then S_t,s
        reduces to R and [N]S_t,s=O because [N](L-[u_s]K)=K-[N*u_s]K=O.  Check both identities exactly.  This is
        the unique N-torsion lift in the reduction fiber.
      defect: Define z_Delta,s=z_U.  Equivalently L_s(R)=translate(S_t,s(R),z_Delta,s). The precision-two identity
        x(L_2)-x(S_t,2)=2*y0*z_Delta,2 mod p^2 is checked pointwise.
      refusal_domain: torsion_section accepts exactly gcd(N,p)=1 and raises noninvertible_torsion_order before computing
        u_s when p divides N. In particular it refuses anomalous N=p curves.  It must not refuse a non-anomalous
        N!=p curve on the contradictory ground "n=p".
    precision_consistency_before_digits:
      rule: Independently compute every modulus-p^2 object L_2,K_2,z_K,2,u_2, S_t,2,z_Delta,2 and every modulus-p^3
        counterpart.  First reduce the underlying p^3 coordinates and formal parameters modulo p^2 and compare them
        exactly with the p^2 objects.  Only after all comparisons pass may any base-p coordinate or defect digit
        be extracted.  Comparing a third digit numerically with a second digit is forbidden.
      failures: Record the first mismatching object, point, modulus, numerator, and denominator valuation.  The
        affected bundle is instrument-inconclusive.
    eight_base_digits:
      common_eligible_domain: A position W_i is eligible exactly when it is affine and x0*y0!=0. For O, x0=0, or
        y0=0, every base digit and every post-function below is assigned the extension value zero without evaluating
        its formula.  The position stays in the length-N array, and O_count, x0_count, y0_count are reported separately.
      coordinate_digit_operator: 'If C_s is represented canonically in [0,p^s-1], define digit_j(C_s)=floor(C_s/p^j)
        mod p for 0<=j<s. Equivalently set c_h=digit_h(C_s) and compute digit_j(C_s)=((C_s-sum_{h=0}^{j-1} c_h*p^h)/p^j)
        mod p. The quotient in the equivalent form is checked for exact divisibility. Subtracting only c0 is forbidden
        for j>1: at p=5 and C=32 the digits are (c0,c1,c2)=(2,1,1), whereas (C-c0)/p^2 is not integral.'
      digit_precision_compatibility: digit_j may be read only from precision s with j<s. Reduction from a canonical
        precision-three value modulo p^2 must preserve digit_0 and digit_1 exactly. digit_2 is defined only from
        the precision-three value and has no precision-two comparator. T_3(x0) modulo p^2 must equal the independently
        computed T_2(x0) before digit extraction.
      definitions:
      - id: F_x
        formula: x0*q_p(x0) mod p, where q_p(a)=((a^(p-1)-1)/p) mod p
        precision: finite_field
      - id: q_x
        formula: q_p(x0)
        precision: finite_field
      - id: q_y
        formula: q_p(y0)
        precision: finite_field
      - id: D_t_x1
        formula: digit_1(x(S_t,2))
        precision: 2
      - id: D_t_y1
        formula: digit_1(y(S_t,2))
        precision: 2
      - id: delta_1
        formula: digit_1(z_Delta,2)
        cross_check_direct: (z_Delta,2/p) mod p because digit_0(z_Delta,2)=0
        cross_check: (F_x-D_t_x1)*(2*y0)^(-1) mod p
        precision: 2
      - id: delta_2
        formula: digit_2(z_Delta,3)
        cross_check: (z_Delta,3-p*delta_1)/p^2 mod p because digit_0(z_Delta,3)=0
        precision: 3
      - id: T_x2
        formula: digit_2(T_3(x0))
        precision: 3
      count: 8
    sixteen_post_functions:
      per_digit_order:
      - I_2,0(d), I_2,1(d)
      - I_4,0(d), I_4,1(d), I_4,2(d), I_4,3(d)
      - I_8,0(d), I_8,1(d), I_8,2(d), I_8,3(d), I_8,4(d), I_8,5(d), I_8,6(d), I_8,7(d)
      - chi(d), with chi(0)=0
      - half(d)=1 exactly when 2*d<p
      formula: I_m,j(d)=1 when the least residue d in [0,p-1] satisfies d mod m=j, and zero otherwise.  On a masked
        group position the final member value is zero for every post-function, rather than phi(0).
      per_digit_count: 16
      total_post_function_members: 128
      base_digits_also_analyzed: 8
      total_precision_3_member_names: 136
    precision_specific_analysis_sets:
      precision_2: Analyze F_x,q_x,q_y,D_t_x1,D_t_y1,delta_1 and their 96 post-functions, for 102 spectra per non-anomalous
        curve.
      precision_3: Analyze all eight base digits and all 128 post-functions, for 136 spectra per curve.  The first
        six precision-three base objects remain separately named so their spectra can be compared with precision
        two.
      zero_extension: Every spectrum uses i=0,...,N-1.  An eligible-only compressed array is prohibited because
        it changes the cyclic Fourier group.
    anomalous_sigma_algorithm:
      lifted_curves: Start with the naive coefficients A_0=A, B_0=B modulo p^2.  If the computed Sigma(P) is zero,
        try h=1,...,64 with alpha_h=SHA256(anomalous_tag|perturb-A|h) mod p and beta_h=SHA256(anomalous_tag|perturb-B|h)
        mod p, replacing a simultaneous zero by alpha_h=1.  Use A_h=A+p*alpha_h and B_h=B+p*beta_h modulo p^2. These
        curves all reduce to the same E/F_p.  Select the first h with Sigma_h(P)!=0 and record every attempt.  Exhaustion
        is perturbation_coverage_inconclusive.
      point_lift: For each R in E(F_p), choose T_2(x(R)) and Hensel-lift the y coordinate on the selected lifted
        curve.  O lifts to O.  Compute [p-1]L by the unit-denominator affine chain and use the same cleared-denominator
        final chart formula to obtain t([p]L) modulo p^2.
      functional: Sigma(R)=(formal_log(t([p]L(R)))/p) mod p; divisibility is exact and formal_log(t)=t modulo p^2.
        Check Sigma(O)=0 and Sigma(U+V)=Sigma(U)+Sigma(V) mod p on exactly the anomalous blocking_pair_schedules;
        no implicit alternate pair sample.
      recovery: Require Sigma(P)!=0.  For each j compute m_recovered=Sigma(Q_j)*Sigma(P)^(-1) mod p, choose its
        least residue, require m_recovered=m_j, and certify [m_recovered]P=Q_j.  A certificate mismatch is an invalid
        implementation, never a counterexample to ECDLP.
      domain_refusal: 'anomalous_log first requires #E(F_p)=p.  It raises non_anomalous_domain when N!=p and never
        calls the prime-to-p torsion inverse.  torsion_section and anomalous_log therefore have disjoint order predicates
        rather than the source''s contradictory refusal.'
      spectrum: Retain all p positions i=0,...,p-1 and set g_i=least_residue(Sigma([i]P))/p, then center and Fourier
        transform. Check the exact sequence identity Sigma([i]P)=i*Sigma(P) mod p. This sawtooth-permuted character
        has raw spike exponent one and its energy is concentrated in the conjugate frequencies corresponding to
        plus/minus Sigma(P); report the complete spectrum and the least number of conjugate pairs carrying half
        the energy.  The source threshold below 8/p is checked, not assumed.
    five_blocking_self_checks:
    - id: SC1_torsion_homomorphism
      exact_test: For non-anomalous curves check S_t(O)=O, reduction(S_t(R))=R,[N]S_t(R)=O and S_t(R+Q)=S_t(R)+S_t(Q)
        at both precisions on exactly blocking_pair_schedules. All points appear in the already required per-point
        checks; pair checks use no implicit extra sample.
      failure_class: instrument_invalid
    - id: SC2_naive_defect_nonadditivity
      exact_test: Use exactly the same ordinary blocking_pair_schedules pairs/order as SC1; compute u(R)=z_Delta,3(R)/p
        mod p^2 and record u(R+Q)!=u(R)+u(Q) witnesses. Recompute each witness through section and translation definitions.
        Retain all outcomes including zero witnessed nonadditivity.
      interpretation: Arithmetic disagreement between the two computations is invalid. The observed nonadditivity
        rate, including zero, is statistical data; the source's "near one" expectation is not an instrument theorem.
    - id: SC3_precision_consistency
      exact_test: perform every pre-digit p^3-to-p^2 comparison specified above on every point
      failure_class: instrument_invalid
    - id: SC4_first_order_translation
      deterministic_index_schedule: For the ordinary curve tag already frozen above, enumerate the eligible scalar/log
        indices in increasing order as E=(i_0,...,i_{m-1}), where eligibility is affine with x0*y0 nonzero. If m=0,
        record sc4_no_eligible_points, mark SC4 coverage_inconclusive, execute no SC4 pairs, and draw no scientific
        inference for the bundle. If m=1 set offset=0 and step=0. If m>1 set offset=SHA256(tag|SC4-R-offset) mod
        m and initialize step=1+SHA256(tag|SC4-R-step) mod (m-1); advance step cyclically through 1,...,m-1 until
        gcd(step,m)=1. For j=0,...,9999 define R_j=W_{i_((offset+j*step) mod m)}. The first min(m,10000) indices
        are distinct; later duplicates occur only by this full cycle and are retained. There is no redraw, deduplication,
        truncation, or exhaustion before 10,000 when m>0.
      deterministic_z_schedule: For exactly the same j=0,...,9999 and ordinary curve tag, set z_j=p*(1+SHA256(tag|formal-z|j)
        mod (p-1)) modulo p^2. Pair R_j with z_j positionally. The decimal j encoding is canonical with no leading
        zero and every hash input is UTF-8 with literal vertical-bar separators.
      exact_test: For all 10,000 scheduled pairs (R_j,z_j) when m>0, form translate(L_2(R_j),z_j) and check x(translate)-x(L_2(R_j))=2*y0(R_j)*z_j
        mod p^2 and the curve equation.
      failure_class: instrument_invalid
    - id: SC5_anomalous_recovery
      exact_test: For every found anomalous bundle, pass the scheduled Sigma additivity check and all twenty scalar/certificate
        recoveries. For the single refusal control use the ordinary bundle(bits10,stratumA,replicate20260905). Invoke
        anomalous_log on that certified N!=p input and require non_anomalous_domain before Sigma or torsion inversion.
        If that exact ordinary bundle is missing, mark refusal-control coverage_inconclusive and do not substitute
        another.
      failure_class: A formula or certificate mismatch is instrument invalid.  Fewer anomalous curves or exhaustion
        of the declared perturbations is coverage-inconclusive and is not padded.
    spectral_null_and_delta_thresholds:
      transform: Use the exact centering, real-conjugate pairing, finite-population Z, and pair-based half-energy
        definitions frozen in this amendment's EXP-ECDLP-184fc4 sibling.  Re-state them in the run's Stage-0 note;
        no compressed eligible-only transform is allowed.
      null: For r=0,...,63 and each curve cell, apply one Fisher-Yates permutation derived from "EXP-ECDLP-1e6502|null|bits|stratum|replicate|precision|r"
        commonly to every member in that precision set.  The conditional joint null is uniform assignment of the
        entire member vector to log indices.
      family_statistic: Freeze all nondegenerate members by permutation-invariant rules and set T=max Z over the
        exact frozen family and 36 curves.  Report p_joint=(1+# of 64 common-permutation maxima at least T_observed)/65.
        This rank has minimum 1/65 only under the stated joint exchangeability null and does not assert broader
        FWER control.
      slopes: For every member, compute six OLS raw-spike slopes over the six bit sizes, one per fixed (stratum,replicate),
        and six terminal 18-to-20-bit slopes.  Also report slopes of M/sqrt(N), whose white prediction is zero.
        Hold null index r fixed across sizes for matched null slopes.
      general_candidate_threshold: A member is a concentration candidate only if p_joint=1/65, the median full and
        terminal raw-spike slopes are each at least 0.60 separately in both strata, the median matched-null raw
        slopes lie in [0.45,0.55], and the top-two-size median observed/null spike ratio is at least two in both
        strata.  It opens replication and independent review only.
      delta_threshold: H-ECDLP-f1e714 claim (2) is a review candidate exactly when delta_1, delta_2, or one of their
        32 post-function members satisfies the complete general candidate threshold.  No other unstated "delta above
        threshold" decision is permitted.
      model_mismatch: Null beta, Z, or half-energy outside a white model while centering, Parseval, precision, and
        arithmetic identities pass is valid evidence about the statistical model, not an instrument failure.
    exact_cell_accounting:
      nonanomalous_curve_bundles: 36
      precision_2_spectra_per_bundle: 102
      precision_3_spectra_per_bundle: 136
      observed_nonanomalous_spectra: 8568
      null_spectra_per_observed_spectrum: 64
      permutation_null_spectra: 548352
      anomalous_curve_bundles_target: 24
      anomalous_scalar_instances_target: 480
      run_artifacts: 36
      derivation: Six bits*two strata*three replicates gives 36 non-anomalous bundles. Each contains 102+136=238
        spectra, hence 8568, each with 64 null spectra.  Four anomalous bits*two strata*three replicates gives 24
        target bundles and 24*20=480 recovery instances.  One artifact per (bits,stratum,replicate) contains both
        non-anomalous precisions and, for bits<=16, the separately labeled anomalous bundle.
    metrics:
      primary:
      - all eight base digits and 128 post-functions with precision labels and full-domain spectra
      - M, Z, conjugate-pair half-energy, six full slopes, six terminal slopes, all 64 null values, and p_joint
      - delta_1/delta_2 threshold components and precision comparison counts
      - Sigma additivity, 480 target recoveries, certificates, spectrum, and perturbation index
      secondary:
      - O/x0/y0 mask counts, lift/section/chart residuals, denominator valuations, and nonadditivity witnesses/rate
      - curve and perturbation search costs, field/group operations, wall/CPU seconds, array bytes, and peak RSS
        per bundle
    decision_rules:
      positive_nonanomalous: A member meeting the exact candidate threshold is snapshotted and sent to independent
        validation and adversarial review.  It is a toy spectral handle, not a discrete-log recovery or exponent
        claim.
      delta_specific: A delta-family member meeting the delta threshold reopens the compact defect-family question
        only at this lift, precision, library, and toy scale.
      null_like: Passing arithmetic controls with no candidate yields a scoped census of this frozen 136-name library.  It
        cannot close all p-adic functions or transfer to another curve lift.
      anomalous: Certified recoveries calibrate only the trace-one known-true object. They supply no evidence that
        the functional exists on N!=p curves.
      inconclusive: Formula, precision, chart, log, or certificate failures void affected bundles.  Curve/perturbation
        search exhaustion, timeouts, crashes, and resource stops are coverage or infrastructure only.
    stopping_and_invalidation:
    - No census spectrum is interpreted before SC1, SC3, and SC4 pass on its bundle and the formula identities are
      archived.
    - Stop the affected bundle at the first exact precision, curve-equation, section-order, or certificate mismatch.
    - Stop after 36 run artifacts and the fixed 64 null permutations; no fourth replicate or new digit is added
      after a spectrum is seen.
    - A watchdog stop censors missing work and is never negative evidence.
    - Compressing away exceptional log positions, computing u_s when p divides N, or using the source's x0^p value
      as T_3 makes the affected result completed_invalid.
    required_artifacts:
    - manifest.yaml
    - stage0-padic-derivations.md
    - curve-selection.json
    - frozen-digit-library.json
    - lift-and-chart-transcript.json
    - precision-consistency.json
    - self-check-transcripts.json
    - raw-result.json
    - null-calibration.json
    - slope-trajectories.json
    - anomalous-curves-and-perturbations.json
    - anomalous-certificates.json
    - cost-and-memory.json
    - decision-readout.md
    proof_search_map:
      baseline_reproduction: Prime-to-p torsion-section identities, explicit precision reduction, formal translation,
        common-permutation nulls, and the certified anomalous recovery are checked before a non-anomalous reading.
      observation_collision: Exceptional-coordinate deletion, wrong Teichmuller precision, a nonunit affine denominator,
        null extreme behavior, and genuine digit correlation can all imitate a spike.  Full-domain masks, pre-digit
        reduction, chart residuals, common nulls, and known-true recoveries separate these preimages.
      quantifier_order: For every eligible point on every declared non-anomalous curve the lift and eight digits
        are fixed first; then all 136 member names are tested. The alternative is existence of one fixed name meeting
        the same replicated threshold in both strata.
      method_ceiling: At most this contract measures the named naive lift, precision two and three, and toy curves.  It
        cannot close face F2, another section or precision, cryptographic scale, or any attack exponent.
      nearby_object_control: the trace-one anomalous curve, plus non-anomalous rejection by anomalous_log
    blocking_pair_schedules:
      domain: Use every ordered pair of group indices(i,j), including O, equality and inverse pairs. W_i=[i]P,0<=i<N
        for ordinary and0<=i<p for anomalous. The full group order n is N or p respectively.
      smallest_rung: At bits10 enumerate(i,j) lexicographically with i outer0..n-1 and j inner0..n-1; exactly n^2
        pairs.
      larger_rungs: For t=0..9999 and slot s=0,1 form tag|pair-control-v3|kind=<ordinary_or_anomalous>|pair=<t>|slot=<s>|counter=<c>.
        tag is the already frozen ordinary/anomalous curve tag. All indices use canonical unsigned base10. Start
        c=0; V=unsigned256-bit big-endian SHA256(UTF8 string); M=n*floor(2^256/n). Reject V>=M and increment c;
        otherwise index=V mod n. Slots0,1 define the ordered pair. Retain all duplicates and exact10000 rows; no
        deduplication, redraw based on arithmetic outcomes or sample exhaustion.
      sharing: SC1 and SC2 use the identical ordinary schedule in identical order. Both precisions use the same
        group indices. Anomalous Sigma uses its distinct anomalous-tag/kind schedule; if evaluating more than one
        coefficient lift, use the same index pairs on every lift and retain lift labels.
      missing_bundle: A missing curve/generator is typed coverage_inconclusive with no pairs or replacement. n must
        be the certified positive group order; an invalid order is instrument_invalid before pair selection.
