  precedence_and_source_map:
    effective_source: This complete successor replaces conflicting predecessor executable definitions prospectively;
      no fragment merging is required. Historical source/ref bindings remain provenance.
    predecessor:
      path: coordination/experiment-reserve/BATCH-635652/corrections/TASK-20260907-8e3963/EXP-ECDLP-1e6502.yaml
      sha256: 781a6bc619f4716fafa5a36f848eed8ebae1e2edef661f34ac779b1bc5c0aa77
      snapshot: d7f6781bcaa1808f3161c594ee5f79f54c12b2c3
    new_definitions: All second_correction_choices entries are explicit pre-data choices pending independent review
      and Coordinator approval.
    no_historical_mutation: true
  preserved_mechanism: On cofactor-one non-anomalous curves, compare canonical coordinate/Hensel lifts with the
    prime-to-p torsion section, turn their formal-kernel defect into a fixed digit library, and census its discrete-log
    spectra against marginal-preserving permutations.  On anomalous curves, reproduce the known formal-logarithm
    scalar recovery as a positive calibration.  The output remains a precision-two/three toy diagnostic.
  substantive_changes:
  - The Teichmuller representative at precision s is x0^(p^(s-1)) modulo p^s, with zero handled separately.  The
    source's one-power x0^p formula is valid at s=2 but is not the precision-three definition.
  - The torsion section is derived explicitly.  For K=[N]L in the formal kernel and u=N^(-1) modulo p^(s-1), S_t=L-[u]K.  The
    modulus of the inverse is stated because E_1(Z/p^s Z) is killed by p^(s-1).
  - The final near-opposite addition into E_1 has a denominator-safe (t,w) formula.  Subsequent translation uses
    the formal logarithm and an exact precision-three invariant-vector-field expansion, so no nonunit affine denominator
    is hidden in an implementation helper.
  - All eight base digits are defined, each has exactly sixteen named post-functions, and both base and post-function
    vectors retain all N cyclic log positions by an explicit zero-extension mask.
  - Precision-three objects are reduced and compared with independently computed precision-two objects before any
    base-p digit is extracted.
  - 'The source refusal sentence is corrected: the prime-to-p torsion section refuses when p divides N, in particular
    N=p on an anomalous curve. anomalous_log instead requires N=p and refuses a non-anomalous N!=p curve before
    any Smart functional is formed.'
  - The anomalous Sigma lift perturbation, its finite search, scalar streams, formal precision, recovery division,
    and full cyclic spectrum are now deterministic.  A perturbation search failure is coverage-inconclusive, not
    evidence against the anomalous theorem.
  - Delta concentration thresholds are the same finite joint-permutation and replicated-slope thresholds as the
    shared spectral instrument; "above threshold" no longer refers to an unstated number.
  - Exact lift/formal identities are instrument gates.  White-spectrum, Gumbel, nonadditivity-rate, and half-energy
    expectations are statistical models and their mismatch is retained as data.
