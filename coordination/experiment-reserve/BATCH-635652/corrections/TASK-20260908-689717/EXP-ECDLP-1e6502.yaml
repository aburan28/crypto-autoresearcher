    proof_search_map:
      baseline_reproduction: Prime-to-p torsion-section identities, explicit precision reduction, formal translation,
        common-permutation nulls, and the certified anomalous recovery are checked before a non-anomalous reading.
      observation_collision: Exceptional-coordinate deletion, wrong Teichmuller precision, a nonunit affine denominator,
        null extreme behavior, and genuine digit correlation can all imitate a spike.  Full-domain masks, pre-digit
        reduction, chart residuals, common nulls, and known-true recoveries separate these preimages.
      quantifier_order: For every eligible point on every declared non-anomalous curve the lift and eight digits
        are fixed first; then all 136 member names are tested. The alternative is existence of one fixed name meeting
        the same replicated threshold in both strata.
      method_ceiling: At most this contract measures the named naive lift, precision two and three, and toy curves.  It
        cannot close face F2, another section or precision, cryptographic scale, or any attack exponent.
      nearby_object_control: the trace-one anomalous curve, plus non-anomalous rejection by anomalous_log
    blocking_pair_schedules:
      domain: Use every ordered pair of group indices(i,j), including O, equality and inverse pairs. W_i=[i]P,0<=i<N
        for ordinary and0<=i<p for anomalous. The full group order n is N or p respectively.
      smallest_rung: At bits10 enumerate(i,j) lexicographically with i outer0..n-1 and j inner0..n-1; exactly n^2
        pairs.
      larger_rungs: For t=0..9999 and slot s=0,1 form tag|pair-control-v3|kind=<ordinary_or_anomalous>|pair=<t>|slot=<s>|counter=<c>.
        tag is exactly canonical_hash_schedules.curve_tag with the actual ordinary/anomalous kind,bits,stratum andreplicate.
        No literal placeholder word may enter tag. All indices use canonical unsigned base10. Start c=0; V=unsigned256-bit
        big-endian SHA256(UTF8 string); M=n*floor(2^256/n). Reject V>=M and increment c; otherwise index=V mod n.
        Slots0,1 define the ordered pair. Retain all duplicates and exact10000 rows; no deduplication, redraw based
        on arithmetic outcomes or sample exhaustion.
      sharing: SC1 and SC2 use the identical ordinary schedule in identical order. Both precisions use the same
        group indices. Anomalous Sigma uses its distinct anomalous-tag/kind schedule; if evaluating more than one
        coefficient lift, use the same index pairs on every lift and retain lift labels.
      missing_bundle: A missing curve/generator is typed coverage_inconclusive with no pairs or replacement. n must
        be the certified positive group order; an invalid order is instrument_invalid before pair selection.
    canonical_hash_schedules:
      numeric_encoding: dec(x) is canonical unsigned ASCII base10 for a nonnegative integer:0 or a nonzero digit
        followed by digits, no leading zeros,plus sign,space or exponent. Booleans are not integers. stratum is
        exactly A or B. bits and replicate are actual values from the already frozen grids; precision is exactly2
        or3 where used. UTF8 encodes the exact concatenated ASCII string with no trailing newline. Reject out-of-domain
        fields before hashing.
      curve_tag: experiment_id + "|" + kind + "|bits=" + dec(bits) + "|stratum=" + stratum + "|replicate=" + dec(replicate).
        The experiment_id is exactly EXP-ECDLP-1e6502. kind is ordinary or anomalous.
      curve_suffixes: For prime counter c append "|p|"+dec(c). For curve attempt u append "|A|"+dec(u) or "|B|"+dec(u).
        For generator attempt v append "|P|"+dec(u)+"|"+dec(v). For anomalous scalar index j append "|scalar|"+dec(j).
        These are actual counter values, not literal placeholder words. Every digest is SHA256 of exactly those
        UTF8 bytes, interpreted unsigned256-bit big-endian. Preserve the existing prime/A/B/generator/scalar arithmetic
        and declared attempt ranges.
      null_tag: experiment_id + "|null|bits=" + dec(bits) + "|stratum=" + stratum + "|replicate=" + dec(replicate)
        + "|precision=" + dec(precision) + "|r=" + dec(r), for r=0..63. No primary/control or different-cell stream
        is substituted.
      unbiased_bounded_draw: For a positive integer n<=2^256 and supplied prefix, for c=0..4095 in increasing order
        compute V=unsignedBE256(SHA256(UTF8(prefix+"|counter="+dec(c)))). Let M=n*floor(2^256/n). Accept the first
        V<M and return V mod n. Each attempted digest consumes its c including rejection; n=1 still consumes one
        digest and returns0. If all4096attempts reject, preserve the complete attempt trace and return digest_rejection_exhausted;
        never modulo-fold a rejected value or create a replacement sample.
      permutation: Initialize pi[i]=i for0<=i<N. For i=N-1 down to1 obtain j=unbiased_bounded_draw(i+1,null_tag+"|swap="+dec(i))
        and swap pi[i],pi[j]. Apply this single permutation to the whole declared member vector. For N=1 retain
        identity with no swaps. A failed draw retains the partial trace and leaves the entire required null realization
        missing/inconclusive, never redrawn under a new key. Index r sharing across sizes and all other predeclared
        sharing are unchanged.
      certificate_tag: 'Use the exact accepted primary/ordinary curve_tag, append "|log-certificate-v4|N="+dec(N).
        No precision/member-dependent resampling: the same accepted group indices certify every member and precision
        of that curve.'
      certificate_indices: Require certified integer1<=N<=2^256; set m=min(1000,N). Initialize empty sparse map
        S. For i=0..m-1 set j=i+unbiased_bounded_draw(N-i,certificate_tag+"|draw="+dec(i)); emit x=S.get(j,j); set
        S[j]=S.get(i,i); delete S[i] if present (including j=i). This is a sparse partial Fisher-Yates sample of
        distinct0..N-1 indices without replacement. There is no duplicate-rejection or data-dependent certificate
        selection. Retain emitted order; exactlymindices on success.
      certificate_check: Independently recompute [x]P at each emitted index and compare with the already enumerated
        log-table point. Preserve all accepted/rejected digest counters and comparison outcomes. If one draw exhausts,
        preserve partial indices and mark the bundle certificate coverage inconclusive; do not shrink m,cycle indices
        or substitute another cell. No new scientific fixture or null count is added.
      boundedness_scope: The4096digest-attempt cap is an explicit prospective serialization/sampling completion
        choice for these new schedules, not a campaign spending cap. Existing scientific counts,curve search ranges,bootstrap
        schedule and pair schedule remain unchanged. A missing required draw never licenses a scientific negative
        or complete-panel verdict.
