    immutable_history: true
  preserved_mechanism: Exhaustive discrete-log spectra of the source's frozen cheap-coordinate library are compared
    with marginal-preserving random reindexings, a real cosine Fourier calibration, and the exact order-two descent
    character on a cyclic order-2q curve.  The experiment remains a toy diagnostic and neither proposes a solver
    nor moves an attack exponent.
  substantive_changes:
  - The 567-member count is made exact and every raw function, including its point-at-infinity value, is defined
    before centering.
  - Two domain-separated curve-sampling strata and three replicate trajectories per stratum are distinguished.  Slopes
    are defined per trajectory and at the terminal 22-to-24-bit interval rather than calling a slope a property
    "at" one size.
  - The real cosine has the mathematically required conjugate pair of peaks at a0 and N-a0.  It is no longer described
    as a one-peak real signal.
  - The order-2q descent value at T=(e,0) is Legendre(3*e^2+A), not an unconditional -1.  Accepted controls must
    prove this value is -1 and exhaustively prove the homomorphism.
  - The permutation test states the joint exchangeability assumption required by a common permutation across all
    members.  Its 64 resamples give a finite randomization rank with minimum 1/65; no unconditional global FWER
    statement is made outside that null.
  - The fixed half-energy value 0.5 is removed as a forced white-noise value. The statistic is calibrated by the
    matched permutation distribution.  The exponential-energy benchmark alpha*(1-ln(alpha*))=1/2 is retained only
    as a modeled diagnostic, alpha* approximately 0.1867.
  - Exact numerical identities are separated from statistical predictions. A null-model mismatch is an observation
    about HEUR-CBIAS-H1 and never an FFT or curve-arithmetic failure by itself.
