    - 20260906
    - 20260907
    maximum_workers: 1
    maximum_memory_gb: 8
    maximum_run_artifacts: 48
    stage_accounting_and_memory_conformance:
      advisory_estimates:
      - stage: stage0_freeze_and_manifest
        wall_seconds: null
        cpu_seconds: null
      - stage: curve_and_log_certificates
        wall_seconds: null
        cpu_seconds: null
      - stage: observed_spectra
        wall_seconds: null
        cpu_seconds: null
      - stage: permutation_null_spectra
        wall_seconds: null
        cpu_seconds: null
      - stage: order_2q_controls
        wall_seconds: null
        cpu_seconds: null
      - stage: slopes_and_report
        wall_seconds: null
        cpu_seconds: null
      estimate_semantics: Null estimates mean unestimated advisory cost. They are not zero and do not alter the
        fixed 42 bundles, 64 nulls, controls, or watchdog rules.
      actual_stage_record: For every stage and bundle store started_monotonic_ns, finished_monotonic_ns, wall_ns,
        cpu_user_ns, cpu_system_ns, group_operations, field_operations, fft_calls, bytes_read, bytes_written, declared_array_bytes,
        declared_workspace_bytes, process_group_peak_bytes, and termination as typed nonnegative JSON integers except
        that an unavailable measurement is null with a required reason. Aggregate totals are sums of completed records
        and never estimates.
      typed_encodings:
        point_table: 'packed little-endian records <BII: uint8 state, uint32 x, uint32 y; O is (0,0,0), affine is
          state 1'
        scalar_index_and_permutation: little-endian uint32; shape [N]; file length must equal 4*N
        raw_library_member: signed int8; shape [N]; values in {-1,0,1} except binary members in {0,1}
        exact_centering_vector: little-endian int64; shape [N]; v_i=N*g_i-sum(g)
        fft_input: IEEE-754 binary64 little-endian; shape [N]
        fft_output: interleaved IEEE-754 binary64 complex pairs little-endian; shape [N,2]
        scalar_summary: JSON number when finite; missing or undefined values are JSON null plus a reason enum
      encoded_size_checks: Every binary object records dtype, byte_order, shape, itemsize, nbytes, file_bytes and
        SHA-256. Require nbytes=itemsize*product(shape) and file_bytes=nbytes before use. JSON integer count fields
        must parse as integers, not arithmetic strings.
      streaming_order_and_lifetimes: Process bundles in lexicographic (bits,stratum,replicate) order. Keep one point/log
        table for the current bundle. Process library members in frozen order and null indices 0..63 sequentially;
        at most one raw member, one permutation, one exact-centering vector, one binary64 FFT input and one FFT
        output/workspace are live. Update the 65 family maxima and append scalar results before releasing arrays.
        Retain scalar summaries only for cross-rung slopes. Release the primary bundle before constructing its order-2q
        control. No [64,567,N] null tensor is permitted.
      prospective_peak_formula: Before a bundle starts, sum the exact nbytes of every simultaneously live typed
        object, the FFT library's documented worst-case workspace bound, the point/log maps' measured allocator
        bytes, and a separately measured interpreter/runtime baseline. This is a prospective conformance bound,
        not a peak-RSS observation. Record each term and object lifetime.
      process_group_guard:
        mechanism: linux_cgroup_v2_memory_controller
        limit_bytes: 8589934592
        swap_limit_bytes: 0
        setup: A supervisor outside the worker cgroup creates a fresh cgroup before any scientific allocation, writes
          memory.max=8589934592, memory.swap.max=0 and memory.oom.group=1, reads all three values back, then moves
          the one-worker launcher into cgroup.procs. Descendants inherit the same aggregate limit. No per-process
          RLIMIT or polling-only counter substitutes for this guard.
        unavailable: If the controller or required write/readback is unavailable, launch no scientific cell and
          record memory_guard_unavailable as failed_infrastructure.
        oom_semantics: Flush each completed scalar row atomically. On memory.events oom or oom_kill, preserve flushed
          rows and the supervisor transcript, mark the unfinished cell failed_infrastructure, and draw no scientific
          inference.
        measurements: Record memory.current at stage boundaries, memory.peak when exposed, memory.events before/after,
          and process RSS diagnostics. A missing peak is null with reason; it is never replaced by the prospective
          byte sum.
    deterministic_curve_generation:
      hash_to_integer: Use canonical_hash_schedules numeric encoding and exact curve tags/suffixes; SHA256 digests
        are unsigned256-bit big-endian.
      primary_algorithm: 'For each (bits,stratum,replicate), construct tag by canonical_hash_schedules.curve_tag
        using kind=primary and actual bits,stratum,replicate.  For prime_counter c=0,1,... choose p=nextprime(2^(bits-1)
        + SHA256(tag|p|c) mod 2^(bits-1)); discard p when p>=2^bits.  For attempt u=0,...,4095 choose A=SHA256(tag|A|u)
        mod p and B=SHA256(tag|B|u) mod p.  Reject zero discriminant.  Count #E(F_p) exactly with EllipticCurve.order();
        accept only #E=N prime, N is odd, N!=p, and hence the whole curve is the cofactor-one group.  Scan x=SHA256(tag|P|u|v)
        mod p for v=0,...,4095, use toycurve.lift_x''s canonical root, and accept the first non-infinity P with
        [N]P=O. Failure of the bounded search is a missing coverage cell.'
      control_algorithm: 'For each primary tag, repeat the same bounded p,A,B search under the exact canonical_hash_schedules.curve_tag
        with kind=control-2q and that actual bits,stratum,replicate and accept only #E=2q with q an odd prime.  Enumerate
        all roots of x^3+A*x+B and require exactly one F_p root e, so T=(e,0) is the unique rational point of order
        two.  Scan candidate P deterministically as above and accept only if [2q]P=O, [q]P=T, and [2]P is not O.  This
        proves P has order 2q.  Finally require Legendre(3*e^2+A)=-1 before the curve is a control instance.'
      certificates: Record all existing p,A,B,#E,N orq,e,P certificates, generator identities and rejected attempts
        unchanged. Enumerate W_i=[i]P for i=0..N-1. Recompute exactly canonical_hash_schedules.certificate_indices
        and use its total missing/exhaustion branch; min(1000,N) distinct indices is mandatory on success.
    frozen_library:
      member_count: 567
      ordered_members:
      - 'x_residue(m,j): indicator x(W) mod m=j, for m in [2,3,4,5,7,8,16,32,64,128,256] and j=0,...,m-1; 525 members.'
      - 'y_residue(m,j): indicator y(W) mod m=j, for m in [2,4,8] and j=0,...,m-1; 14 members.'
      - chi_x_plus_c for c in [0,1,-1,2,-2,3,5], chi_y, and chi_xy, where Legendre(0)=0; 9 members.
      - 'x_interval(j): indicator 2^j*x(W)<p and x_central(j): indicator abs(2*x(W)-p)*2^(j-1)<p, for j=1,...,8;
        16 members.  Integer inequalities remove floating and boundary ambiguity.'
      - parity_x_plus_y, chi_x_times_chi_y, and indicator(x mod 3=0)*indicator(y mod 2=0); 3 members.
      exceptional_value: W=O has no affine coordinates.  Every raw library member is defined to be zero at O.  Legendre
        zero is zero at affine zeros.  These values are part of the marginal and are permuted like all other values.
      freeze_artifact: Stage 0 writes the ordered canonical JSON list and its SHA-256 before any transform.  A changed
        member, order, inequality, or exceptional value requires another additive amendment.
      canonical_member_id: 'ASCII identifiers: x_residue:m=<m>:j=<j>; y_residue:m=<m>:j=<j>; chi_x_plus_c:c=<c>;
        chi_y; chi_xy; x_interval:j=<j>; x_central:j=<j>; parity_x_plus_y; chi_x_times_chi_y; x_mod3_zero_times_y_mod2_zero.
        Integers use canonical signed base10 without leading zeros or plus signs (zero is0). Each label denotes
        the existing family/parameters, never a position chosen from data.'
    exact_spectrum_definitions:
      transform: For a real vector g_i=g(W_i), let mean_g=N^(-1)*sum_i g_i, h_i=g_i-mean_g, H_a=sum_i h_i*exp(2*pi*i*a*i/N),
        and E_a=|H_a|^2. For integer-valued members, centering is also checked exactly using v_i=N*g_i-sum_j g_j
        and H_a=N^(-1)*DFT(v)_a.
      nonzero_domain: a=1,...,N-1
      variance: Var(g)=N^(-1)*sum_i h_i^2
      spike: M=max_{1<=a<N}|H_a|
      finite_population_scale: Under a uniformly random permutation of a fixed centered vector, E(|H_a|^2)=N^2*Var(g)/(N-1)
        for every a!=0.  Define K=(N-1)/2, sigma_perm=N*sqrt(Var(g)/(N-1)), and Z=M/(sigma_perm*sqrt(ln K)) when
        Var(g)>0 and K>1.
      half_energy: Since g is real, combine conjugate frequencies into q=(N-1)/2 pairs J_a=E_a+E_(N-a), a=1,...,q.  Sort
        by decreasing J_a, breaking ties by increasing a.  K_half is the least number whose sum is at least half
        of sum_a J_a.  Report f_half=K_half/q, equivalently the same fraction of the N-1 nonzero frequencies.  Var(g)=0
        gives a degenerate member; Z, beta, and f_half are null rather than zero.
      exact_invariants:
      - sum_i v_i=0 exactly and |H_0| obeys the recorded FFT tolerance
      - H_(N-a)=conjugate(H_a) within the recorded FFT tolerance
      - sum_a |H_a|^2=N*sum_i |h_i|^2 within the recorded FFT tolerance
      - the argmax uses the least a on exact or tolerance-level ties
      modeled_white_benchmarks:
      - beta approximately 1/2 and a Gumbel-scale maximum are statistical predictions, checked against permutations
        rather than numerical invariants.
      - Independent exponential pair energies predict f_half near the unique alpha in (0,1) satisfying alpha*(1-ln(alpha))=1/2,
        approximately 0.1867.  Fourier dependence and discrete marginals make this a diagnostic only; the permutation
        distribution is primary.
    synthetic_real_cosine_control:
      frequency: Let a0=1+floor(N/3), then increment to the least a0 in [1,(N-1)/2] with gcd(a0,N)=1.  N is odd
        prime, so this terminates.
      vector: g0(W_i)=cos(2*pi*a0*i/N)
      required_signature: The exact real transform has two conjugate peaks, H_a0=H_(N-a0)=N/2, and all other coefficients
        zero.  Require each peak magnitude within 1e-10*N, their energy difference at most 1e-10*N^2, maximum off-pair
        magnitude at most 1e-10*N, and off-pair energy at most 1e-18*N^2. The half-energy fraction is one conjugate
        pair divided by (N-1)/2.
    descent_control:
      definition: On y^2=x^3+A*x+B with T=(e,0), define delta(O)=+1, delta(T)=Legendre(3*e^2+A), and delta(W)=Legendre(x(W)-e)
        otherwise.  The special T value is the tangent-factor value f'(e), not Legendre(0).
      blocking_checks:
      - delta(T)=-1 on every accepted cyclic order-2q control
      - delta(U+V)=delta(U)*delta(V) for every ordered pair (U,V)
      - exactly q group elements have each sign
      - delta([i]P)=(-1)^i for all i=0,...,2q-1
      required_signature: With transform length 2q, the sole nonzero coefficient is H_q=2q; all others, including
        H_0, are zero.  This is an exact algebraic calibration subject only to the declared numerical FFT tolerance.
    permutation_null_and_inference:
      resamples: 64
      stream: Use the unchanged canonical_hash_schedules.null_tag and Fisher-Yates schedule for each actual cell
        andr=0..63,applying one permutation to the entire567member vector. Distinct byte keys are domain separation,not
        a proved probabilistic independence claim about actualSHA. Member marginals andsame-point vector dependence
        are preserved.
      joint_null_required: The earlier uniform-joint-assignment proposal is not sufficient to calibrate the fixed
        SHA transform set. Neither marginal norjoint assignment symmetry alone establishes65-way exchangeability.
        The actual rank is descriptive under rank_interpretation; future calibration requirements are explicitly
        named butunadopted.
      global_statistic: Freeze the analyzable set using the unchanged permutation-invariant Var(g)>0 andindicator-support
        rules. For the observed assignment andeach r,compute T=maxZ over that same set andall42cells. Report p_joint=(1+count(T_r>=T_observed))/65
        as the descriptive fixed-schedule rank defined in rank_interpretation. No probability calibration follows
        from assignment exchangeability alone.
      finite_null_summary_and_tie_rules: For each statistic sort its 64 null values nondecreasing with multiplicity
        as x_(1)<=...<=x_(64), using one-based order-statistic notation. The median is (x_(32)+x_(33))/2. The nearest-rank
        2.5-percent endpoint is x_(ceil(0.025*64))=x_(2), and the 97.5-percent endpoint is x_(ceil(0.975*64))=x_(63).
        Equal values are retained separately; their internal stable order is irrelevant. For M and Z use upper-tail
        rank (1+#{u:X_u>=X_obs})/65. For f_half use lower-tail rank (1+#{u:X_u<=X_obs})/65. Thus every equality
        counts against separation. A descriptive two-sided rank, if emitted, is min(1,2*min(p_upper,p_lower)) and
        is never substituted for p_joint.
      zero_dispersion_and_ratio_rules: If all 64 values are equal, the median and both endpoints equal that value
        and the finite rank remains defined by the tie rule. Any optional standardized effect is null with reason
        zero_null_dispersion and cannot satisfy a decision threshold. An observed-to-null-median ratio is defined
        only for a strictly positive finite median; otherwise store null with reason nonpositive_null_median. Degenerate
        observed members already have M, Z and f_half null and do not enter ranks.
      per_member_outputs: Report all 64 matched M, Z, and f_half values, the exact median and x_(2)/x_(63) endpoints,
        tail direction, numerator tie count, denominator 65, finite rank, and every undefined reason under the rules
        above.
      rank_interpretation:
        actual_interpretation: p_joint retains its legacy field name but is a deterministic descriptive comparison
          rank under the fixed SHA schedule. It is not an exact or approximate calibrated p-value asserted by this
          contract.
        formula: p_joint=(1+count(T_r>=T_observed for r=0..63))/65. Ties count against separation; minimum1/65 and
          maximum1 follow algebraically,without any probability premise. Retain all64reference statistics.
        candidate_role: Keep every predeclared numeric candidate gate,including equality to1/65,unchanged. A passing
          gate opens independent replication/review of a finite observation; it is not a null-hypothesis rejection
          or a family-wise-error claim.
        missing: An empty eligible family,missing required cell/statistic/reference,orany nonfinite/invalid required
          value makes the joint rank unavailable with a named reason. Do not change the denominator,redraw references
          orselect a favorable subset.
        calibration_boundary:
          A_ASSIGN: A probabilistic claim must state the exact joint distribution/invariance of the observed member
            vectors and every nuisance parameter being conditioned on. Assignment exchangeability alone does not
            calibrate an arbitrary fixed transform set.
          A_SAMPLER: It must also state a randomness oridealization premise that establishes exchangeability of
            the observed statistic andall64comparison statistics under the exact sampler,including shared domains
            andstopping rules. A PRF/random-oracle claim about actualSHA is not asserted orvalidated here.
          status: Requirements for a separately approved future inferential design; neither is adopted as a sufficient
            real-SHA calibration claim in this contract.
          required_before_calibrated_claim: A complete randomization/model contract and an independently checked
            exchangeability/rank proof,with explicit assumptions andvalidation/falsification plan. An actual fixed
            SHA output orsuccessful implementation check is not that proof.
        known_false_control: The archived66-state orbit withidentity andshifts1..64 gives minimum nominal rank at2/66states=1/33>1/65.
          This refutes assignment-only sufficiency for arbitrary fixed comparisons,not SHA quality or the ECDLP
          hypothesis.
        prohibited_claims:
        - No actual-SHA probability calibration from assignment symmetry alone.
        - No broader orassumption-free FWER orpopulation inference.
        - No hypothetical random-oracle premise presented as an observed orvalidated fact.
    slope_definitions:
      full_ladder: For every member and each fixed (stratum,replicate), fit ordinary least squares log(M)=intercept+beta*log(N)
        over all seven rungs having M>0 and passing the frozen support rule.  No pooling of the six trajectories
        occurs before all six slopes are reported.
      terminal: beta_tail=[log M_24-log M_22]/[log N_24-log N_22] for each fixed (stratum,replicate).  It is undefined
        if either magnitude is zero or a required cell is missing.
      null_slopes: Hold the permutation index r fixed across rungs to form 64 matched null trajectories per (member,stratum,replicate).  Report
        their full and terminal slope distributions beside the observed six trajectories.
      interval: Execute the exactly10000 paired draws per(member,stratum) specified in bootstrap_rng_schedule. Separately
        for full_ladder and terminal, take the median of the three selected slopes per draw. Sort with multiplicity
        and report (b_(5000)+b_(5001))/2 and nearest-rank b_(250),b_(9750), all one-based. Retain all six raw slopes
        per output. No pooling of strata or undefined-output redraw.
      bootstrap_rng_schedule:
        analysis_key: Exact UTF8 ASCII string EXP-ECDLP-184fc4|slope-bootstrap-v3|member=<canonical_member_id>|stratum=<A_or_B>|replicate_pool=20260905,20260906,20260907|shared_outputs=full_ladder,terminal.
          No whitespace or newline is appended. Member IDs are exactly those in frozen_library.canonical_member_id.
        draw: For d=0..9999 and slot t=0,1,2, append |draw=<d>|slot=<t>|counter=<c>, using canonical unsigned base10.
          Start c=0 for each(d,t). Interpret SHA256 as unsigned256-bit big-endian V. Put R=3*floor(2^256/3); reject
          V>=R and increment c, otherwise select replicate_pool[V mod3]. Selection is with replacement; retain slot
          order.
        sharing: Reuse that exact replicate triple for full_ladder and terminal medians of the same member and stratum.
          Different member or stratum keys never share streams. Null trajectories are not bootstrapped. No trial
          is added, removed or redrawn based on slope values.
        missing: If any of the three source slopes for an output is missing/undefined, its entire interval is null
          with named missing labels. The other output remains separately eligible; sharing is a schedule rule, not
          permission to impute a slope.
    exact_cell_accounting:
      primary_curve_bundles: 42
      members_per_bundle: 567
      observed_member_spectra: 23814
      null_spectra_per_observed_member: 64
      permutation_null_spectra: 1524096
      control_curve_bundles: 42
      run_artifacts: 42
      run_definition: One run artifact is one (bits,stratum,replicate) primary curve bundle, all 567 observed vectors,
        all 64 common-permutation bundles, and its independently generated order-2q control.  Missing bounded-search
        cells remain explicit; they are never replaced after seeing spectra.
    metrics:
      primary:
      - M, Z, f_half, argmax pair, and full 64-value null distribution per member and cell
      - six full-ladder beta values and six beta_tail values per analyzable member, with matched null slopes
      - p_joint and the exact frozen family entering it
      - synthetic two-peak and descent single-frequency control residuals
      secondary:
      - Var, support count, degeneracy reason, H_0, conjugacy residual, and Parseval residual
      - per-bundle wall seconds, CPU seconds, array bytes, FFT-workspace bytes, and peak RSS
      - curve-search attempts, log-certificate indices, and rejected-cell reasons
    decision_rules:
      concentration_candidate: A member becomes a replication-and-independent-review candidate only if p_joint=1/65;
        the median full-ladder beta and median beta_tail are each at least 0.60 separately in strata A and B; and
        the matched null median slopes lie in [0.45,0.55] in both strata.  This is a finite descriptive comparison
        filter opening replication andindependent review,not a calibrated null test orsupport for an attack.
      white_diagnostic: If no member triggers the candidate rule, report the measured toy maxima and permutation
        ranks.  Do not promote the source's fixed f_half=0.5 window; use the matched-null result and state that
        the source half-energy model was corrected prospectively.
      null_model_mismatch: Beta, Z, f_half, or extreme-value behavior outside a modeled white window while the exact
        invariants pass is a result about the statistical model.  It is valid data and may make the hypothesis inconclusive
        or false in scope; it is not an instrument defect.
      inconclusive: Curve/generator/log certificates, exact centering, conjugacy, Parseval, or either exact control
        failing voids the affected bundle.  A timeout, crash, dependency failure, or bounded-search exhaustion is
        infrastructure or coverage only.
      next_actions:
        positive: snapshot, independent validation and adversarial review before interpretation
        negative: record only the frozen-library toy diagnostic and method ceiling
        inconclusive: repair the exact failed invariant or generate an additive coverage task
    stopping_and_invalidation:
    - Stop the affected bundle immediately on an exact arithmetic, certificate, or transform invariant failure.
    - Stop after the 42 declared artifacts; no fourth replicate or new library member is added inside this version.
    - Resource watchdog expiry censors unfinished cells and asserts nothing about HEUR-CBIAS-H1.
    - Changing a curve after any spectrum is observed, changing the common-permutation family, or dropping a degenerate
      member without its record makes the run completed_invalid.
    required_artifacts:
    - manifest.yaml
    - frozen-library.json
    - curve-selection.json
    - stage0-derivations.md
    - log-certificates.json
    - raw-result.json
    - null-calibration.json
    - slope-trajectories.json
    - control-real-cosine.json
    - control-order-2q.json
    - cost-and-memory.json
    - decision-readout.md
    proof_search_map:
      baseline_reproduction: The matched common-permutation family, exact real-cosine pair, and exact descent character
        are frozen before a coordinate spectrum is read.
      observation_collision: Near-constant marginals, generic white extremes, and genuine concentration can all
        yield a large raw M.  Var/support reporting, common-permutation ranks, replicated slopes, and exact positive
        controls distinguish these preimages within the tested family.
      quantifier_order: For every one of 567 members and every declared cell the null-like prediction is tested;
        the alternative is existence of one member whose same predeclared slope and joint-rank conditions persist
        in both strata.
      method_ceiling: The strongest possible output is a toy measurement for this exact library.  It says nothing
        about unlisted or growing-degree functions, cryptographic scale, discrete-log recovery, or an attack exponent.
      nearby_object_control: the cyclic order-2q descent character; the real cosine is the transform-only control
    canonical_hash_schedules:
      numeric_encoding: dec(x) is canonical unsigned ASCII base10 for a nonnegative integer:0 or a nonzero digit
        followed by digits, no leading zeros,plus sign,space or exponent. Booleans are not integers. stratum is
        exactly A or B. bits and replicate are actual values from the already frozen grids; precision is exactly2
        or3 where used. UTF8 encodes the exact concatenated ASCII string with no trailing newline. Reject out-of-domain
        fields before hashing.
      curve_tag: experiment_id + "|" + kind + "|bits=" + dec(bits) + "|stratum=" + stratum + "|replicate=" + dec(replicate).
        The experiment_id is exactly EXP-ECDLP-184fc4. kind is primary or control-2q.
      curve_suffixes: For prime counter c append "|p|"+dec(c). For curve attempt u append "|A|"+dec(u) or "|B|"+dec(u).
        For generator attempt v append "|P|"+dec(u)+"|"+dec(v). For anomalous scalar index j append "|scalar|"+dec(j).
        These are actual counter values, not literal placeholder words. Every digest is SHA256 of exactly those
        UTF8 bytes, interpreted unsigned256-bit big-endian. Preserve the existing prime/A/B/generator/scalar arithmetic
        and declared attempt ranges.
      null_tag: experiment_id + "|null|bits=" + dec(bits) + "|stratum=" + stratum + "|replicate=" + dec(replicate)
        + "|r=" + dec(r), for r=0..63. No primary/control or different-cell stream is substituted.
      unbiased_bounded_draw: For a positive integer n<=2^256 and supplied prefix, for c=0..4095 in increasing order
        compute V=unsignedBE256(SHA256(UTF8(prefix+"|counter="+dec(c)))). Let M=n*floor(2^256/n). Accept the first
        V<M and return V mod n. Each attempted digest consumes its c including rejection; n=1 still consumes one
        digest and returns0. If all4096attempts reject, preserve the complete attempt trace and return digest_rejection_exhausted;
        never modulo-fold a rejected value or create a replacement sample.
      permutation: Initialize pi[i]=i for0<=i<N. For i=N-1 down to1 obtain j=unbiased_bounded_draw(i+1,null_tag+"|swap="+dec(i))
        and swap pi[i],pi[j]. Apply this single permutation to the whole declared member vector. For N=1 retain
        identity with no swaps. A failed draw retains the partial trace and leaves the entire required null realization
        missing/inconclusive, never redrawn under a new key. Index r sharing across sizes and all other predeclared
        sharing are unchanged.
      certificate_tag: 'Use the exact accepted primary/ordinary curve_tag, append "|log-certificate-v4|N="+dec(N).
        No precision/member-dependent resampling: the same accepted group indices certify every member and precision
        of that curve.'
      certificate_indices: Require certified integer1<=N<=2^256; set m=min(1000,N). Initialize empty sparse map
        S. For i=0..m-1 set j=i+unbiased_bounded_draw(N-i,certificate_tag+"|draw="+dec(i)); emit x=S.get(j,j); set
        S[j]=S.get(i,i); delete S[i] if present (including j=i). This is a sparse partial Fisher-Yates sample of
        distinct0..N-1 indices without replacement. There is no duplicate-rejection or data-dependent certificate
        selection. Retain emitted order; exactlymindices on success.
      certificate_check: Independently recompute [x]P at each emitted index and compare with the already enumerated
        log-table point. Preserve all accepted/rejected digest counters and comparison outcomes. If one draw exhausts,
        preserve partial indices and mark the bundle certificate coverage inconclusive; do not shrink m,cycle indices
        or substitute another cell. No new scientific fixture or null count is added.
      boundedness_scope: The4096digest-attempt cap is an explicit prospective serialization/sampling completion
        choice for these new schedules, not a campaign spending cap. Existing scientific counts,curve search ranges,bootstrap
        schedule and pair schedule remain unchanged. A missing required draw never licenses a scientific negative
        or complete-panel verdict.
