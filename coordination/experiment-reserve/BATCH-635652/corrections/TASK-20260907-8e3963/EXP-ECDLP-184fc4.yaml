  preserved_mechanism: >-
    Exhaustive discrete-log spectra of the source's frozen cheap-coordinate
    library are compared with marginal-preserving random reindexings, a real
    cosine Fourier calibration, and the exact order-two descent character on a
    cyclic order-2q curve.  The experiment remains a toy diagnostic and neither
    proposes a solver nor moves an attack exponent.

  substantive_changes:
    - >-
      The 567-member count is made exact and every raw function, including its
      point-at-infinity value, is defined before centering.
    - >-
      Two domain-separated curve-sampling strata and three replicate trajectories
      per stratum are distinguished.  Slopes are defined per trajectory and at
      the terminal 22-to-24-bit interval rather than calling a slope a property
      "at" one size.
    - >-
      The real cosine has the mathematically required conjugate pair of peaks at
      a0 and N-a0.  It is no longer described as a one-peak real signal.
    - >-
      The order-2q descent value at T=(e,0) is
      Legendre(3*e^2+A), not an unconditional -1.  Accepted controls must prove
      this value is -1 and exhaustively prove the homomorphism.
    - >-
      The permutation test states the joint exchangeability assumption required
      by a common permutation across all members.  Its 64 resamples give a
      finite randomization rank with minimum 1/65; no unconditional global FWER
      statement is made outside that null.
    - >-
      The fixed half-energy value 0.5 is removed as a forced white-noise value.
      The statistic is calibrated by the matched permutation distribution.  The
      exponential-energy benchmark alpha*(1-ln(alpha*))=1/2 is retained only as
      a modeled diagnostic, alpha* approximately 0.1867.
    - >-
      Exact numerical identities are separated from statistical predictions.
      A null-model mismatch is an observation about HEUR-CBIAS-H1 and never an
      FFT or curve-arithmetic failure by itself.

  effective_contract:
    claim_tier: toy
    field_bits: [12, 14, 16, 18, 20, 22, 24]
    sampling_strata: [A, B]
    replicate_labels: [20260905, 20260906, 20260907]
    maximum_workers: 1
    maximum_memory_gb: 8
    maximum_run_artifacts: 48

    stage_accounting_and_memory_conformance:
      advisory_estimates:
        - {stage: stage0_freeze_and_manifest, wall_seconds: null, cpu_seconds: null}
        - {stage: curve_and_log_certificates, wall_seconds: null, cpu_seconds: null}
        - {stage: observed_spectra, wall_seconds: null, cpu_seconds: null}
        - {stage: permutation_null_spectra, wall_seconds: null, cpu_seconds: null}
        - {stage: order_2q_controls, wall_seconds: null, cpu_seconds: null}
        - {stage: slopes_and_report, wall_seconds: null, cpu_seconds: null}
      estimate_semantics: >-
        Null estimates mean unestimated advisory cost. They are not zero and do
        not alter the fixed 42 bundles, 64 nulls, controls, or watchdog rules.
      actual_stage_record: >-
        For every stage and bundle store started_monotonic_ns,
        finished_monotonic_ns, wall_ns, cpu_user_ns, cpu_system_ns,
        group_operations, field_operations, fft_calls, bytes_read, bytes_written,
        declared_array_bytes, declared_workspace_bytes, process_group_peak_bytes,
        and termination as typed nonnegative JSON integers except that an
        unavailable measurement is null with a required reason. Aggregate totals
        are sums of completed records and never estimates.
      typed_encodings:
        point_table: "packed little-endian records <BII: uint8 state, uint32 x, uint32 y; O is (0,0,0), affine is state 1"
        scalar_index_and_permutation: "little-endian uint32; shape [N]; file length must equal 4*N"
        raw_library_member: "signed int8; shape [N]; values in {-1,0,1} except binary members in {0,1}"
        exact_centering_vector: "little-endian int64; shape [N]; v_i=N*g_i-sum(g)"
        fft_input: "IEEE-754 binary64 little-endian; shape [N]"
        fft_output: "interleaved IEEE-754 binary64 complex pairs little-endian; shape [N,2]"
        scalar_summary: "JSON number when finite; missing or undefined values are JSON null plus a reason enum"
      encoded_size_checks: >-
        Every binary object records dtype, byte_order, shape, itemsize, nbytes,
        file_bytes and SHA-256. Require nbytes=itemsize*product(shape) and
        file_bytes=nbytes before use. JSON integer count fields must parse as
        integers, not arithmetic strings.
      streaming_order_and_lifetimes: >-
        Process bundles in lexicographic (bits,stratum,replicate) order. Keep one
        point/log table for the current bundle. Process library members in frozen
        order and null indices 0..63 sequentially; at most one raw member, one
        permutation, one exact-centering vector, one binary64 FFT input and one
        FFT output/workspace are live. Update the 65 family maxima and append
        scalar results before releasing arrays. Retain scalar summaries only for
        cross-rung slopes. Release the primary bundle before constructing its
        order-2q control. No [64,567,N] null tensor is permitted.
      prospective_peak_formula: >-
        Before a bundle starts, sum the exact nbytes of every simultaneously live
        typed object, the FFT library's documented worst-case workspace bound,
        the point/log maps' measured allocator bytes, and a separately measured
        interpreter/runtime baseline. This is a prospective conformance bound,
        not a peak-RSS observation. Record each term and object lifetime.
      process_group_guard:
        mechanism: linux_cgroup_v2_memory_controller
        limit_bytes: 8589934592
        swap_limit_bytes: 0
        setup: >-
          A supervisor outside the worker cgroup creates a fresh cgroup before
          any scientific allocation, writes memory.max=8589934592,
          memory.swap.max=0 and memory.oom.group=1, reads all three values back,
          then moves the one-worker launcher into cgroup.procs. Descendants
          inherit the same aggregate limit. No per-process RLIMIT or polling-only
          counter substitutes for this guard.
        unavailable: >-
          If the controller or required write/readback is unavailable, launch no
          scientific cell and record memory_guard_unavailable as
          failed_infrastructure.
        oom_semantics: >-
          Flush each completed scalar row atomically. On memory.events oom or
          oom_kill, preserve flushed rows and the supervisor transcript, mark the
          unfinished cell failed_infrastructure, and draw no scientific inference.
        measurements: >-
          Record memory.current at stage boundaries, memory.peak when exposed,
          memory.events before/after, and process RSS diagnostics. A missing peak
          is null with reason; it is never replaced by the prospective byte sum.

    deterministic_curve_generation:
      hash_to_integer: >-
        SHA256 text is interpreted as one unsigned 256-bit big-endian integer.
        All text is UTF-8 and fields are separated by the literal vertical bar.
      primary_algorithm: >-
        For each (bits,stratum,replicate), set tag to
        "EXP-ECDLP-184fc4|primary|bits|stratum|replicate".  For prime_counter
        c=0,1,... choose p=nextprime(2^(bits-1) +
        SHA256(tag|p|c) mod 2^(bits-1)); discard p when p>=2^bits.  For attempt
        u=0,...,4095 choose A=SHA256(tag|A|u) mod p and
        B=SHA256(tag|B|u) mod p.  Reject zero discriminant.  Count #E(F_p)
        exactly with EllipticCurve.order(); accept only #E=N prime, N is odd,
        N!=p, and hence the whole curve is the cofactor-one group.  Scan
        x=SHA256(tag|P|u|v) mod p for v=0,...,4095, use toycurve.lift_x's
        canonical root, and accept the first non-infinity P with [N]P=O.
        Failure of the bounded search is a missing coverage cell.
      control_algorithm: >-
        For each primary tag, repeat the same bounded p,A,B search under the
        domain "EXP-ECDLP-184fc4|control-2q" and accept only #E=2q with q an
        odd prime.  Enumerate all roots of x^3+A*x+B and require exactly one
        F_p root e, so T=(e,0) is the unique rational point of order two.  Scan
        candidate P deterministically as above and accept only if [2q]P=O,
        [q]P=T, and [2]P is not O.  This proves P has order 2q.  Finally require
        Legendre(3*e^2+A)=-1 before the curve is a control instance.
      certificates: >-
        Record p,A,B,#E,N or q,e,P, every rejected-attempt reason, and the
        accepted generator identities.  Primary log tables enumerate W_i=[i]P
        for i=0,...,N-1.  Recompute min(1000,N) distinct indices drawn by the
        domain-separated certificate stream and compare points exactly.

    frozen_library:
      member_count: 567
      ordered_members:
        - >-
          x_residue(m,j): indicator x(W) mod m=j, for m in
          [2,3,4,5,7,8,16,32,64,128,256] and j=0,...,m-1; 525 members.
        - >-
          y_residue(m,j): indicator y(W) mod m=j, for m in [2,4,8] and
          j=0,...,m-1; 14 members.
        - >-
          chi_x_plus_c for c in [0,1,-1,2,-2,3,5], chi_y, and chi_xy, where
          Legendre(0)=0; 9 members.
        - >-
          x_interval(j): indicator 2^j*x(W)<p and x_central(j): indicator
          abs(2*x(W)-p)*2^(j-1)<p, for j=1,...,8; 16 members.  Integer
          inequalities remove floating and boundary ambiguity.
        - >-
          parity_x_plus_y, chi_x_times_chi_y, and
          indicator(x mod 3=0)*indicator(y mod 2=0); 3 members.
      exceptional_value: >-
        W=O has no affine coordinates.  Every raw library member is defined to
        be zero at O.  Legendre zero is zero at affine zeros.  These values are
        part of the marginal and are permuted like all other values.
      freeze_artifact: >-
        Stage 0 writes the ordered canonical JSON list and its SHA-256 before
        any transform.  A changed member, order, inequality, or exceptional
        value requires another additive amendment.

    exact_spectrum_definitions:
      transform: >-
        For a real vector g_i=g(W_i), let mean_g=N^(-1)*sum_i g_i,
        h_i=g_i-mean_g, H_a=sum_i h_i*exp(2*pi*i*a*i/N), and E_a=|H_a|^2.
        For integer-valued members, centering is also checked exactly using
        v_i=N*g_i-sum_j g_j and H_a=N^(-1)*DFT(v)_a.
      nonzero_domain: "a=1,...,N-1"
      variance: "Var(g)=N^(-1)*sum_i h_i^2"
      spike: "M=max_{1<=a<N}|H_a|"
      finite_population_scale: >-
        Under a uniformly random permutation of a fixed centered vector,
        E(|H_a|^2)=N^2*Var(g)/(N-1) for every a!=0.  Define
        K=(N-1)/2, sigma_perm=N*sqrt(Var(g)/(N-1)), and
        Z=M/(sigma_perm*sqrt(ln K)) when Var(g)>0 and K>1.
      half_energy: >-
        Since g is real, combine conjugate frequencies into q=(N-1)/2 pairs
        J_a=E_a+E_(N-a), a=1,...,q.  Sort by decreasing J_a, breaking ties by
        increasing a.  K_half is the least number whose sum is at least half
        of sum_a J_a.  Report f_half=K_half/q, equivalently the same fraction
        of the N-1 nonzero frequencies.  Var(g)=0 gives a degenerate member;
        Z, beta, and f_half are null rather than zero.
      exact_invariants:
        - "sum_i v_i=0 exactly and |H_0| obeys the recorded FFT tolerance"
        - "H_(N-a)=conjugate(H_a) within the recorded FFT tolerance"
        - "sum_a |H_a|^2=N*sum_i |h_i|^2 within the recorded FFT tolerance"
        - "the argmax uses the least a on exact or tolerance-level ties"
      modeled_white_benchmarks:
        - >-
          beta approximately 1/2 and a Gumbel-scale maximum are statistical
          predictions, checked against permutations rather than numerical
          invariants.
        - >-
          Independent exponential pair energies predict f_half near the unique
          alpha in (0,1) satisfying alpha*(1-ln(alpha))=1/2, approximately
          0.1867.  Fourier dependence and discrete marginals make this a
          diagnostic only; the permutation distribution is primary.

    synthetic_real_cosine_control:
      frequency: >-
        Let a0=1+floor(N/3), then increment to the least a0 in [1,(N-1)/2]
        with gcd(a0,N)=1.  N is odd prime, so this terminates.
      vector: "g0(W_i)=cos(2*pi*a0*i/N)"
      required_signature: >-
        The exact real transform has two conjugate peaks, H_a0=H_(N-a0)=N/2,
        and all other coefficients zero.  Require each peak magnitude within
        1e-10*N, their energy difference at most 1e-10*N^2, maximum off-pair
        magnitude at most 1e-10*N, and off-pair energy at most 1e-18*N^2.
        The half-energy fraction is one conjugate pair divided by (N-1)/2.

    descent_control:
      definition: >-
        On y^2=x^3+A*x+B with T=(e,0), define delta(O)=+1,
        delta(T)=Legendre(3*e^2+A), and
        delta(W)=Legendre(x(W)-e) otherwise.  The special T value is the
        tangent-factor value f'(e), not Legendre(0).
      blocking_checks:
        - "delta(T)=-1 on every accepted cyclic order-2q control"
        - "delta(U+V)=delta(U)*delta(V) for every ordered pair (U,V)"
        - "exactly q group elements have each sign"
        - "delta([i]P)=(-1)^i for all i=0,...,2q-1"
      required_signature: >-
        With transform length 2q, the sole nonzero coefficient is H_q=2q;
        all others, including H_0, are zero.  This is an exact algebraic
        calibration subject only to the declared numerical FFT tolerance.

    permutation_null_and_inference:
      resamples: 64
      stream: >-
        For resample r=0,...,63 and each primary cell independently, use a
        Fisher-Yates permutation driven by SHA256 counter blocks under
        "EXP-ECDLP-184fc4|null|bits|stratum|replicate|r".  Apply that one
        permutation to the entire 567-dimensional vector at every W_i.  Thus
        all member marginals and all same-point cross-member dependence are
        preserved.
      joint_null_required: >-
        Within each primary cell, conditional on the unordered multiset of the
        567-dimensional vectors, their joint assignment to the discrete-log
        indices is uniform over all N! permutations; cell assignments are
        independent across the 42 cells.  Only under this joint exchangeability
        null are the identity assignment and the 64 common-permutation
        assignments exchangeable.  Marginal exchangeability of each member
        alone is insufficient for the common-permutation global maximum.
      global_statistic: >-
        Freeze the analyzable set using permutation-invariant rules Var(g)>0
        and, for an indicator slope, at least 30 positive entries on every rung
        of that trajectory.  For observed assignment and each r, compute
        T=max Z over that same frozen set and all 42 cells.  Report
        p_joint=(1+#{r:T_r>=T_observed})/65.  The smallest attainable value is
        1/65.  This is a conditional randomization rank for the stated joint
        null and exact tested family only; it does not support a broader or
        assumption-free FWER claim.
      finite_null_summary_and_tie_rules: >-
        For each statistic sort its 64 null values nondecreasing with
        multiplicity as x_(1)<=...<=x_(64), using one-based order-statistic
        notation. The median is (x_(32)+x_(33))/2. The nearest-rank 2.5-percent
        endpoint is x_(ceil(0.025*64))=x_(2), and the 97.5-percent endpoint is
        x_(ceil(0.975*64))=x_(63). Equal values are retained separately; their
        internal stable order is irrelevant. For M and Z use upper-tail rank
        (1+#{u:X_u>=X_obs})/65. For f_half use lower-tail rank
        (1+#{u:X_u<=X_obs})/65. Thus every equality counts against separation.
        A descriptive two-sided rank, if emitted, is
        min(1,2*min(p_upper,p_lower)) and is never substituted for p_joint.
      zero_dispersion_and_ratio_rules: >-
        If all 64 values are equal, the median and both endpoints equal that
        value and the finite rank remains defined by the tie rule. Any optional
        standardized effect is null with reason zero_null_dispersion and cannot
        satisfy a decision threshold. An observed-to-null-median ratio is defined
        only for a strictly positive finite median; otherwise store null with
        reason nonpositive_null_median. Degenerate observed members already have
        M, Z and f_half null and do not enter ranks.
      per_member_outputs: >-
        Report all 64 matched M, Z, and f_half values, the exact median and
        x_(2)/x_(63) endpoints, tail direction, numerator tie count, denominator
        65, finite rank, and every undefined reason under the rules above.

    slope_definitions:
      full_ladder: >-
        For every member and each fixed (stratum,replicate), fit ordinary least
        squares log(M)=intercept+beta*log(N) over all seven rungs having M>0
        and passing the frozen support rule.  No pooling of the six trajectories
        occurs before all six slopes are reported.
      terminal: >-
        beta_tail=[log M_24-log M_22]/[log N_24-log N_22] for each fixed
        (stratum,replicate).  It is undefined if either magnitude is zero or a
        required cell is missing.
      null_slopes: >-
        Hold the permutation index r fixed across rungs to form 64 matched null
        trajectories per (member,stratum,replicate).  Report their full and
        terminal slope distributions beside the observed six trajectories.
      interval: >-
        A deterministic 10,000-draw cluster bootstrap resamples the three
        replicate labels with replacement independently within each stratum,
        using SHA256 counter blocks under
        "EXP-ECDLP-184fc4|slope-bootstrap|member".  Report stratum medians and
        2.5/97.5 nearest-rank intervals using sorted one-based bootstrap values
        b_(250) and b_(9750) for exactly 10,000 draws; the bootstrap median is
        (b_(5000)+b_(5001))/2. Ties retain multiplicity. The six raw slopes
        remain primary.

    exact_cell_accounting:
      primary_curve_bundles: 42
      members_per_bundle: 567
      observed_member_spectra: 23814
      null_spectra_per_observed_member: 64
      permutation_null_spectra: 1524096
      control_curve_bundles: 42
      run_artifacts: 42
      run_definition: >-
        One run artifact is one (bits,stratum,replicate) primary curve bundle,
        all 567 observed vectors, all 64 common-permutation bundles, and its
        independently generated order-2q control.  Missing bounded-search cells
        remain explicit; they are never replaced after seeing spectra.

    metrics:
      primary:
        - "M, Z, f_half, argmax pair, and full 64-value null distribution per member and cell"
        - "six full-ladder beta values and six beta_tail values per analyzable member, with matched null slopes"
        - "p_joint and the exact frozen family entering it"
        - "synthetic two-peak and descent single-frequency control residuals"
      secondary:
        - "Var, support count, degeneracy reason, H_0, conjugacy residual, and Parseval residual"
        - "per-bundle wall seconds, CPU seconds, array bytes, FFT-workspace bytes, and peak RSS"
        - "curve-search attempts, log-certificate indices, and rejected-cell reasons"

    decision_rules:
      concentration_candidate: >-
        A member becomes a replication-and-independent-review candidate only if
        p_joint=1/65; the median full-ladder beta and median beta_tail are each
        at least 0.60 separately in strata A and B; and the matched null median
        slopes lie in [0.45,0.55] in both strata.  This is an observation under
        the joint null, not support for an attack.
      white_diagnostic: >-
        If no member triggers the candidate rule, report the measured toy
        maxima and permutation ranks.  Do not promote the source's fixed
        f_half=0.5 window; use the matched-null result and state that the source
        half-energy model was corrected prospectively.
      null_model_mismatch: >-
        Beta, Z, f_half, or extreme-value behavior outside a modeled white
        window while the exact invariants pass is a result about the statistical
        model.  It is valid data and may make the hypothesis inconclusive or
        false in scope; it is not an instrument defect.
      inconclusive: >-
        Curve/generator/log certificates, exact centering, conjugacy, Parseval,
        or either exact control failing voids the affected bundle.  A timeout,
        crash, dependency failure, or bounded-search exhaustion is
        infrastructure or coverage only.
      next_actions:
        positive: "snapshot, independent validation and adversarial review before interpretation"
        negative: "record only the frozen-library toy diagnostic and method ceiling"
        inconclusive: "repair the exact failed invariant or generate an additive coverage task"

    stopping_and_invalidation:
      - "Stop the affected bundle immediately on an exact arithmetic, certificate, or transform invariant failure."
      - "Stop after the 42 declared artifacts; no fourth replicate or new library member is added inside this version."
      - "Resource watchdog expiry censors unfinished cells and asserts nothing about HEUR-CBIAS-H1."
      - "Changing a curve after any spectrum is observed, changing the common-permutation family, or dropping a degenerate member without its record makes the run completed_invalid."

    required_artifacts:
      - manifest.yaml
      - frozen-library.json
      - curve-selection.json
      - stage0-derivations.md
      - log-certificates.json
      - raw-result.json
      - null-calibration.json
      - slope-trajectories.json
      - control-real-cosine.json
      - control-order-2q.json
      - cost-and-memory.json
      - decision-readout.md

    proof_search_map:
      baseline_reproduction: >-
        The matched common-permutation family, exact real-cosine pair, and exact
