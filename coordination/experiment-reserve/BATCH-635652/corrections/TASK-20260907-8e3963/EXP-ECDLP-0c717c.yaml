  preserved_mechanism: >-
    The experiment pushes interval and residue factor bases through the elliptic
    addition correspondence, measures additive and quadratic character envelopes
    of the resulting x histogram, compares them with size-matched random bases,
    and checks the quadratic instrument on an index-two subgroup.  It remains a
    toy distribution diagnostic, not relation generation or a solver.

  substantive_changes:
    - >-
      Curve generation now has two domain-separated sampling strata, three
      fixed replicate trajectories in each stratum, exact cofactor-one checks,
      bounded failure behavior, and a separate exact order-2q generator.
    - >-
      The interval base has an exact even cardinality.  The literal residue
      predicate x congruent to zero modulo d generally cannot be forced to the
      same cardinality without changing the predicate, so d is fixed from p and
      gamma and the actual cardinality is measured; every null uses that actual
      size.  No log-ordered truncation is introduced into the residue base.
    - >-
      Pair enumeration excludes exactly the undefined sums and normalizes by
      the accepted pair count L.  Compatibility values normalized by m_F^2 are
      also reported, but never mixed with L-normalized envelopes.
    - >-
      Legendre(0)=0, O has no x coordinate, zero accepted-pair counts and zero
      null medians have explicit null outputs, and no division by them occurs.
    - >-
      The subgroup control uses delta(T)=Legendre(3*e^2+A) and treats S_quad(e)=1
      as the exact known-true identity.  Its additive envelope is a statistical
      blind-spot prediction and a failure is valid model evidence, not an
      arithmetic-instrument failure.
    - >-
      The two strata and three replicates generate six four-rung slope
      trajectories.  Only the first eight null indices exist at every rung;
      those eight define null slopes, while the remaining smaller-size nulls
      are used only for cell distributions.
    - >-
      The finite null rank is descriptive.  With 32 or 8 null bases it cannot
      support an undeclared global significance or FWER claim.

  effective_contract:
    claim_tier: toy
    field_bits: [12, 16, 20, 24]
    sampling_strata: [A, B]
    replicate_labels: [20260905, 20260906, 20260907]
    size_exponents: [one_third, one_half]
    primary_base_families: [interval, residue_zero]
    maximum_workers: 1
    maximum_memory_gb: 8
    maximum_run_artifacts: 48

    stage_accounting_and_memory_conformance:
      advisory_estimates:
        - {stage: stage0_derivations_and_manifest, wall_seconds: null, cpu_seconds: null}
        - {stage: curve_base_and_log_certificates, wall_seconds: null, cpu_seconds: null}
        - {stage: observed_pair_histograms_and_envelopes, wall_seconds: null, cpu_seconds: null}
        - {stage: matched_random_base_nulls, wall_seconds: null, cpu_seconds: null}
        - {stage: order_2q_controls, wall_seconds: null, cpu_seconds: null}
        - {stage: slopes_bootstrap_and_report, wall_seconds: null, cpu_seconds: null}
      estimate_semantics: >-
        Null advisory estimates mean unestimated, not zero. They do not alter
        the 24 bundles, 32/8 null schedule, 10,000 bootstrap draws or controls.
      actual_stage_record: >-
        Each stage and bundle stores started_monotonic_ns,
        finished_monotonic_ns, wall_ns, cpu_user_ns, cpu_system_ns,
        group_additions, pair_candidates, accepted_pairs, histogram_updates,
        fft_calls, bytes_read, bytes_written, declared_array_bytes,
        declared_workspace_bytes, process_group_peak_bytes and termination as
        typed nonnegative JSON integers, except unavailable measurements are
        null with a required reason. Aggregate actuals are sums of retained
        records and never copied from estimates.
      typed_encodings:
        point_table: "packed little-endian <BII records; uint8 state then uint32 x,y; O is (0,0,0)"
        base_indices: "little-endian uint32; shape [m_F]; file length 4*m_F"
        null_permutation: "little-endian uint32; shape [N-1]; file length 4*(N-1)"
        histogram: "little-endian uint64; shape [p]; file length 8*p"
        fft_input: "IEEE-754 binary64 little-endian; shape [p]"
        fft_output: "interleaved IEEE-754 binary64 complex pairs little-endian; shape [p,2]"
        scalar_summary: "finite JSON number or JSON null plus a reason enum"
      encoded_size_checks: >-
        Every binary artifact records dtype, byte_order, shape, itemsize, nbytes,
        file_bytes and SHA-256. Require nbytes=itemsize*product(shape) and
        file_bytes=nbytes. Every count in JSON/YAML is an integer scalar; text
        derivations are stored separately.
      streaming_order_and_lifetimes: >-
        Process bundles lexicographically by (bits,stratum,replicate), then gamma,
        base family and null index. Retain one point/log table for the bundle,
        one base-index vector and one length-p histogram. Enumerate pairs directly
        into the histogram without a pair list. Reuse one FFT input/output
        workspace for additive then quadratic envelopes. Flush observed scalars;
        generate null permutations and their interval/residue prefixes one at a
        time, flushing each scalar before releasing its base and histogram.
        Retain only the 32-or-8 scalar null arrays and cross-rung slope scalars.
        Release the primary bundle before its order-2q control. No tensor of null
        histograms or pair list may be resident.
      prospective_peak_formula: >-
        Before each bundle, sum exact nbytes of simultaneous typed arrays, the
        FFT library's documented maximum workspace, measured point-map allocator
        bytes and a separately measured runtime baseline. Record each lifetime.
        This calculation is a preflight bound, never a fabricated RSS peak.
      process_group_guard:
        mechanism: linux_cgroup_v2_memory_controller
        limit_bytes: 8589934592
        swap_limit_bytes: 0
        setup: >-
          An external supervisor creates a fresh cgroup, writes and reads back
          memory.max=8589934592, memory.swap.max=0 and memory.oom.group=1, then
          moves the one-worker launcher into cgroup.procs before scientific
          allocation. All descendants inherit the aggregate limit. A per-process
          RLIMIT or polling-only byte counter is not a substitute.
        unavailable: >-
          If the controller or exact readback is unavailable, start no scientific
          cell and record memory_guard_unavailable as failed_infrastructure.
        oom_semantics: >-
          Atomically flush completed scalar rows. If memory.events reports oom or
          oom_kill, preserve partial rows and the guard transcript, classify the
          unfinished cell failed_infrastructure and draw no scientific inference.
        measurements: >-
          Record memory.current by stage, memory.peak when available,
          memory.events before/after and process RSS diagnostics. Missing actual
          peak remains null with reason and is not filled by payload arithmetic.

    deterministic_curve_generation:
      common_encoding: >-
        SHA256 inputs are UTF-8 text joined by literal vertical bars and the
        digest is an unsigned big-endian integer.  For each
        (bits,stratum,replicate), the primary tag is
        "EXP-ECDLP-0c717c|primary|bits|stratum|replicate".
      primary_algorithm: >-
        For prime_counter c=0,1,... choose
        p=nextprime(2^(bits-1)+SHA256(tag|p|c) mod 2^(bits-1)); discard p>=2^bits.
        For attempt u=0,...,4095 set A=SHA256(tag|A|u) mod p and
        B=SHA256(tag|B|u) mod p, reject zero discriminant, and count #E exactly
        with EllipticCurve.order().  Accept only #E=N where N is an odd prime,
        N!=p, and the whole curve is therefore the cofactor-one group.  Select
        the first non-infinity lift_x(SHA256(tag|P|u|v) mod p), v=0,...,4095,
        satisfying [N]P=O.  Record all attempts.  Exhaustion is a missing cell,
        never permission to substitute a curve.
      control_algorithm: >-
        Under tag "EXP-ECDLP-0c717c|control-2q|bits|stratum|replicate", use the
        same bounded search and accept only #E=2q with q odd prime, exactly one
        rational cubic root e, T=(e,0), and a scanned P satisfying [2q]P=O,
        [q]P=T, [2]P!=O.  Also require Legendre(3*e^2+A)=-1.  Record the curve,
        point, order, root, and generator certificates.
      log_certificate: >-
        Enumerate W_i=[i]P, i=0,...,N-1.  Recompute min(1000,N) distinct
        domain-separated indices with the independent scalar-multiplication
        path and compare their point encodings exactly.

    exact_base_definitions:
      target_size: >-
        For gamma in {1/3,1/2}, m_star=2*floor(p^gamma/2).  Integer cube-root
        and square-root routines define the floor; floating arithmetic is not
        used.  m_star is even and at least two at every declared size.
      interval: >-
        List the distinct affine x coordinates occurring in the odd-order whole
        group in increasing integer order.  Each fiber has the two points
        (x,+y) and (x,-y).  Select the first m_star/2 fibers.  With B_cut one
        plus the largest selected x, F_interval is exactly
        {W in G minus {O}: x(W)<B_cut} and has cardinality m_star.  Record B_cut.
      residue_zero: >-
        Let d=max(2,round_half_up(p^(1-gamma))), with the root and rounding
        performed by exact integer comparisons.  Define
        F_residue={W in G minus {O}: x(W) mod d=0}.  Its actual cardinality
        m_residue is used everywhere.  Record d, m_residue, and
        gamma_effective=ln(m_residue)/ln(p).  A zero or one-element residue base
        is a coverage failure for that cell.  It is not padded or truncated.
      ordering: >-
        Within either set, order points by (x, y, discrete-log index) solely to
        enumerate unordered pairs.  The membership predicate, not this order,
        defines the base.

    pair_and_histogram_definitions:
      enumeration: >-
        For a base F=(P_0,...,P_(m_F-1)), enumerate exactly i<j.  Since the
        points are distinct, P_i=P_j cannot occur.  Exclude exactly the pairs
        with P_i+P_j=O; on an odd-order short-Weierstrass curve these are exactly
        P_j=-P_i and are the only distinct-pair affine-denominator exception.
      counts: >-
        candidate_count=m_F*(m_F-1)/2,
        excluded_O_count=#{i<j:P_j=-P_i}, and
        L=candidate_count-excluded_O_count.  For every accepted sum S set
        H[x(S)]+=1.  Check sum_t H[t]=L exactly.  L=0 makes both envelopes and
        all ratios null and the cell is coverage-inconclusive.
      additive: >-
        A_a=sum_(t=0)^(p-1) H[t]*exp(2*pi*i*a*t/p).
        S_add=max_(a=1,...,p-1)|A_a|/L, with the least a breaking ties.
        A_0=L is an exact blocking identity before normalization.
      quadratic: >-
        Q_c=sum_(t=0)^(p-1) H[t]*Legendre(t-c), where Legendre(0)=0.
        S_quad=max_(c=0,...,p-1)|Q_c|/L, with the least c breaking ties.
        The mathematical direct sum defines the sign/orientation; any FFT
        convolution is checked against it on the smallest cell.
      compatibility_outputs: >-
        Also report S_add_m2=max|A_a|/m_F^2 and
        S_quad_m2=max|Q_c|/m_F^2 so H-ECDLP-5b245d's written normalization can
        be read.  Decisions in this amendment use the L-normalized pair and
        never compare one normalization with a null using the other.

    matched_random_base_null:
      draws_per_primary_cell: >-
        R_bits=32 at bits 12,16,20 and R_bits=8 at bits 24.
      generation: >-
        For each (bits,stratum,replicate,gamma,r), r=0,...,R_bits-1, generate
        one uniform Fisher-Yates permutation of all N-1 affine group elements
        from SHA256 counter blocks under
        "EXP-ECDLP-0c717c|null|bits|stratum|replicate|gamma|r".  The interval
        null is its first m_star elements; the residue null is its first
        m_residue elements.  This couples the two size-matched controls without
        claiming they are independent.  Apply the identical pair exclusions and
        L normalization separately to each prefix.
      summaries: >-
        Sort each null statistic.  Median is the middle value or the mean of the
        two middle values.  The descriptive 2.5 and 97.5 percentiles are the
        order statistics with one-based indices ceil(0.025*R_bits) and
        ceil(0.975*R_bits).  Report every raw null value as well.
      ratio_and_zero_rule: >-
        ratio=S_observed/null_median only when the median is positive.  A zero
        median yields ratio=null with reason zero_null_median.  The finite
        upper-tail rank is (1+#null values >= observed)/(R_bits+1); its minimum
        is 1/33 or 1/9 and it is descriptive, not a global p-value.
      model_levels: >-
        Report the source benchmark sqrt(2*ln(p))/m_F and the accepted-pair
        complex benchmark sqrt(ln(p-1)/L) beside the empirical additive null.
        Report sqrt(2*ln(2p)/L) beside the empirical real quadratic null.  These
        are labeled statistical approximations; dependence among pair sums and
        frequencies is why the empirical null is primary.  A mismatch never
        invalidates arithmetic that passes the exact mass/direct-sum checks.

    slope_definition:
      observed: >-
        For each fixed (stratum,replicate,gamma,base_family,envelope), fit OLS
        log(S)=intercept+slope*log(p) over the four bits.  This produces
        2*3*2*2*2=48 observed trajectories.  The expected source slope
        -gamma is reported; for the residue base also report the fit against
        log(m_residue) so cardinality drift is visible.
      null: >-
        Only r=0,...,7 exists at every size.  Hold r fixed across the four rungs
        to obtain 2*3*2*2*8*2=384 null slope trajectories.  Null indices 8..31
        at smaller sizes never enter a cross-size slope.
      bootstrap_rng_schedule:
        canonical_analysis_key_utf8: >-
          For each (gamma,base_family,envelope,stratum), analysis_key is the
          exact ASCII subset of UTF-8 string
          "EXP-ECDLP-0c717c|slope-bootstrap-v2|gamma=<g>|base_family=<f>|envelope=<e>|stratum=<S>|replicate_pool=20260905,20260906,20260907|shared_outputs=<o>".
          Replace <g> by exactly 1/3 or 1/2; <f> by interval or residue_zero;
          <e> by additive or quadratic; <S> by A or B; and <o> by log_p for
          interval or log_p,log_m_residue for residue_zero. No whitespace,
          escaping, normalization or trailing newline is added.
        draw_algorithm: >-
          For draw d=0,...,9999 and slot t=0,1,2, append
          "|draw="||decimal(d)||"|slot="||decimal(t)||"|counter="||decimal(c)
          using canonical base-10 integers with no leading zero. Starting c=0,
          hash the UTF-8 concatenation. Interpret SHA256 as an unsigned 256-bit
          big-endian integer V. Let R=3*floor(2^256/3); reject V>=R and increment
          c, otherwise select replicate_pool[V mod 3]. The three selected labels,
          with replacement and in slot order, are the complete resample.
        sharing: >-
          One selected triple is reused for every stored output named by
          shared_outputs in that exact analysis key. In particular the log_p and
          log_m_residue slopes of a residue_zero analysis are paired under the
          same resample. Distinct gamma, base_family, envelope or stratum keys
          never share a schedule. Null-index slope trajectories are not
          bootstrapped and no schedule is selected after observing values.
      intervals: >-
        Report all six observed trajectories per fixed
        (gamma,base_family,envelope). For each stratum apply the exact 10,000-draw
        schedule above to its three fixed replicate slopes. Sort the 10,000
        bootstrap medians nondecreasing with multiplicity. Report median
        (b_(5000)+b_(5001))/2 and nearest-rank endpoints b_(250) and b_(9750),
        all one-based. Ties are retained. A missing/undefined source slope makes
        that analysis interval null with its missing labels; no favorable redraw
        occurs.
      undefined: >-
        Any zero envelope, zero pair count, or missing rung makes that trajectory
        undefined; no pseudocount is introduced.

    exact_order_2q_control:
      character: >-
        Define delta(O)=+1, delta(T)=Legendre(3*e^2+A), and
        delta(W)=Legendre(x(W)-e) otherwise.  Exhaustively require
        delta(U+V)=delta(U)delta(V), delta(T)=-1, and a q/q sign split.
      bases: >-
        For each gamma, form F_plus from the first m_star/2 increasing x fibers
        among affine points with delta=+1.  Thus every member lies in the
        index-two kernel and |F_plus|=m_star.  Use the same unordered-pair and O
        exclusion rule.
      exact_quadratic_signature: >-
        Every accepted sum stays in the kernel and cannot equal T, so
        Legendre(x(sum)-e)=+1 term by term.  Therefore Q_e=L and S_quad=1
        exactly.  This identity is blocking.
      additive_signature: >-
        S_add at or below its matched random-base band is the source's blind-spot
        prediction.  An excess is a valid observation about that prediction;
        it does not void the exact S_quad calibration.

    exact_cell_accounting:
      primary_curve_bundles: 24
      primary_bases_per_bundle: 4
      primary_base_cells: 96
      underlying_null_permutations: 1248
      null_base_evaluations: 2496
      null_envelope_values: 4992
      control_curve_bundles: 24
      control_base_cells: 48
      observed_slope_trajectories: 48
      all_rung_null_slope_trajectories: 384
      run_artifacts: 24
      derivation: >-
        There are 4 bits*2 strata*3 replicates=24 bundles.  Each has 2 gammas*2
        bases=4 primary bases.  The 18 bundles below 24 bits have 2*32=64
        underlying null permutations and the six 24-bit bundles have 2*8=16,
        giving 1248; each permutation supplies two differently sized base
        prefixes, giving 2496 null bases.  One artifact contains the entire
        primary bundle, both gamma controls, all nulls, and exact accounting.

    metrics:
      primary:
        - "S_add, S_quad, both compatibility normalizations, and argmax per base and cell"
        - "all raw null values, empirical summaries, ratio, and finite rank"
        - "48 observed slopes and 384 common-rung null slopes"
        - "exact S_quad=1 control residual at c=e"
      secondary:
        - "m_star, m_F, d, gamma_effective, candidate_count, excluded_O_count, and L"
        - "A_0 residual, histogram-mass residual, and direct-versus-FFT residual"
        - "curve search, generator/log certificates, wall and CPU seconds, histogram/FFT bytes, and peak RSS"

    decision_rules:
      review_candidate: >-
        For one predeclared (base_family,gamma,envelope), require at both 20 and
        24 bits that the median ratio across the three replicates exceed 4 in
        each stratum and every contributing cell have the minimum attainable
        finite null rank; also require every one of the six four-rung slopes to
        be positive.  This opens replication and independent review only.  It
        is not a solver or yield claim and the finite ranks are not combined
        into an undeclared p-value.
      null_like: >-
        Within-null envelopes produce a scoped toy diagnostic.  The empirical
        distribution, actual base cardinalities, and both normalizations remain
        in the record.
      null_model_mismatch: >-
        A random-base distribution outside either modeled level is a scientific
        mismatch with H-ECDLP-5b245d claim (2) at the tested scope, provided the
        exact instrument identities pass.  It is never relabeled an FFT defect.
      inconclusive: >-
        A failed curve/generator/log certificate, A_0 or histogram-mass identity,
        direct-sum check, or exact S_quad control voids its affected bundle.
        Missing curves, timeouts, crashes, or memory stops are coverage or
        infrastructure and assert nothing mathematical.
      next_actions:
        positive: "snapshot and send the named envelope/base to independent validation and adversarial review"
        negative: "record only the toy envelope measurement and its two-character-family ceiling"
        inconclusive: "repair the exact failed invariant or issue a bounded coverage successor"

    stopping_and_invalidation:
      - "Stop an affected bundle on an exact mass, arithmetic, certificate, or control-identity failure."
      - "Stop after the 24 artifacts; no fourth replicate, extra base, or extra null is added after observing an envelope."
      - "Watchdog expiry censors unfinished cells and is never evidence for or against a base."
      - "Changing a base predicate, using log order to force residue cardinality, or dividing by L=0 or a zero null median makes the affected result completed_invalid."

    required_artifacts:
      - manifest.yaml
      - stage0-envelope-derivations.md
      - curve-selection.json
      - base-definitions.json
      - pair-accounting.json
      - raw-result.json
      - null-distributions.json
      - slope-trajectories.json
      - control-order-2q.json
      - cost-and-memory.json
      - decision-readout.md

    proof_search_map:
      baseline_reproduction: >-
        A_0=L, histogram mass L, direct quadratic sums, matched random bases,
        and the exact index-two S_quad identity are all checked before inference.
      observation_collision: >-
        A changed pair count, residue-cardinality drift, additive-flat quadratic
        structure, and a genuine envelope can look alike after an m^2
        normalization.  L-normalization, actual-size nulls, two envelopes, and
        the known-true quadratic object separate them.
      quantifier_order: >-
        For every declared base, exponent, curve cell, frequency or shift, the
        envelope is measured; the alternative is existence of one fixed
        predeclared key whose effect persists across both strata and top rungs.
      method_ceiling: >-
        At most this contract measures two character families of one x-sumset
        histogram at toy scale.  Higher-order characters, relation yield,
        linear algebra, cryptographic scale, and an attack exponent remain out
        of scope.
      nearby_object_control: "an exact index-two subgroup invisible to the additive prediction and visible to S_quad"

  frontier_check:
