review_plan:
  claim_under_review: Source conformance of the confined group-OOM supervisor and native descriptor/process
    adapters before any live operational test.
  coordinator_prior: The producer reports120/120controls in its first complete suite, after two zero-control
    registry discovery invocations. Five actual benign children and all case/descriptor journals were recomputed
    during Coordinator post-check verification, not independent review. This supports review readiness only.
    I expect the four IR repairs to hold, while the highest remaining risks are created-handle/reopened-name/descriptor
    cleanup boundaries, primary-versus-secondary exceptions, launch-versus-unknown process facts, raw-byte
    versus decoded command consumption, and mock coverage that could be self-consistent while omitting full
    production behavior. No live or scientific admission is assumed.
  recorded_before_reviewers: true
  source_snapshot: efe06c32858aff43a22698b260e872916e394846
  joints:
  - joint: complete_supervisor_source_confinement_ordering_and_custody
    assigned_to: TASK-20260910-1c7aa0
    attack_plan: Inspect complete supervisor.py,container.py,host.py,tests.py,protocol binding,report and receipt
      against all original operational prerequisites,F-01 through F-11 with17 evidence-case entries,NF-01 through
      NF-05 andIR-01 through IR-04. Independently exercise actual serializers/host consumers and task/nonce/full-ID
      checks. Challenge created-handle registry ownership,closed/forged/replaced descriptors,wrong parent/direct-child
      relations,population,stat/reopen/rmdir/close failures and both cleanup paths; distinguish residual privileged-mutator
      races from atomic guarantees. Challenge pre-call command rows,Popen and generic transport failures,unknown
      versus not-started facts,communication failure and cleanup errors,raw bytes before decoding,timeout cumulative-output
      preservation,and final consumer behavior. Reproduce original barrier failure with independent cleanup
      failure and verify both survive into outcomes without false terminal/cleanup claims. Preserve capabilities,delegation
      ordering,initial/final supervisor membership,worker/auxiliary acknowledgements,counter deltas,exact-container
      fallback and source-only scope. Audit all three producer invocations including each registry source version,120case
      starts/results,five real PIDs/waits/descriptor dispositions,aggregate sampler membership and missing
      final samples. Confirm README was the sole post-test metadata edit and every tested code/protocol byte
      matches. Inspect named coverage and any unsupported completeness assertion rather than treating the producer
      suite as conformance proof.
    breaking_artifact: Exact source line and independent fixed counterexample,unimplemented native path,or
      missing confinement/ordering/custody obligation.
  blindness:
    mutual: false
    lifted_for:
    - TASK-20260910-1c7aa0
    rationale: Fresh independent complete source-aware review. Only declared historical reports and producer
      artifacts are visible; no parent conversation,unlisted image/CM review,or concurrent reviewer output.
  proves_too_much:
    objects:
    - A correct suffix attached to the wrong parent/root path or a symlink component.
    - A changed inspected container identity or unexpected existing child cgroup.
    - Partial controller writes or a profile asserted without readback.
    - A worker released before migration or retaining writable descriptors/capabilities.
    - A group0 or wrong-memory worker that still reaches allocation.
    - An OOM-looking signal without required group counters or supervisor separation.
    - Cleanup/transcript failures that erase the primary cause or leave a falsely complete outcome.
    - A production v2 envelope rejected while a fabricated v1 fixture passes.
    - A missing/mismatched nonce that still permits payload copy or cleanup mutation.
    - A parent made nonempty while domain memory delegation remains enabled.
    - A supervisor missing from its subgroup while only parent emptiness/liveness passes.
    - A foreign child hidden by stat PermissionError or a disappearing-entry error.
    - A same-name replacement or an unowned handle that cleanup would remove.
    - A launch exception with fabricated empty output/exit or a generic exception labelled not-started without
      evidence.
    - A timeout transcript with duplicated or discarded bytes.
    - A barrier primary failure replaced by finalization failure.
    - A failed fixture assertion that drops the created PID or descriptor record.
    failure_signature: Known-invalid identities,unsafe writes,early worker release,missing observations or
      manual kills must not pass the claimed operational classification.
    assigned_to: TASK-20260910-1c7aa0
  blind_rederivation:
    required: false
    quantity: No mathematical quantity or cryptanalytic claim.
    parameters: Fixed operational interface and mocked observations.
    blind_from: []
    assigned_to: TASK-20260910-1c7aa0
    not_repeated_reason: Source/operational design review only; no new mathematical result.
  scope_limit: Complete source conformance only. No live Docker,cgroup,mount,privilege,migration,pressure,8GiB
    group-guard result,measurement admission or retrospective repair of missing historical custody.
  procedure_deviations: []
