review_plan:
  claim_under_review: Completeness and internal consistency of five corrected prospective contracts before any implementation
    approval. No scientific claim or execution admission.
  coordinator_prior: The known digit and rho proxy defects appear corrected and administrative parsing passes, but
    exhaustive implementability remains uncertain. Highest residual risks are total null matching, encoded domain/size
    consistency, RNG stream sharing, retained counts, and setup/failed-restart accounting. Prior is unresolved readiness,
    not presumed PASS.
  recorded_before_reviewers: true
  source_snapshot: d7f6781bcaa1808f3161c594ee5f79f54c12b2c3
  joints:
  - joint: Corrected finite protocol readiness across five named experiments
    assigned_to: TASK-20260908-5b034f
    attack_plan: Compare each corrected full effective contract with its original specification, predecessor and
      archived reviews. Build fixed counterexamples for quantile indices/ties/undefined ratios, RNG dimension collisions
      and shared resampling, digit reconstruction and SC4 exhaustion, unmatched itinerary classes/full-order sampler/memory
      lifetimes, and exact rho limits/censoring/BSGS charges. Trace every count, seed, quantifier, stopping branch
      and artifact into an executable definition; distinguish implementation prerequisites from missing scientific
      definitions. Report each experiment separately and audit all new correction text, not only previous findings.
    breaking_artifact: Exact field plus fixed arithmetic/mock counterexample or precisely missing definition; no
      experimental execution.
  blindness:
    mutual: false
    lifted_for:
    - TASK-20260908-5b034f
    rationale: Fresh independent hardening review after prior mutually blinded reports and corrected drafts were
      archived. Those prior reports and the drafting disclosure are deliberately visible; no concurrent reviewer
      report or parent conversation may be read.
  proves_too_much:
    objects:
    - 64 identical null values with ties and zero dispersion.
    - Missing one null match among 64, which cannot support a full-null effect.
    - p=5,C=32 under the predecessor higher-digit formula.
    - Two bootstrap analyses differing only in a required key dimension.
    - A failed rho stream with nonzero charged work, or BSGS giant ceiling counted as exact observed work.
    failure_signature: No undefined quantity may silently become finite or eligible; no omitted cost may be reported
      as charged measured work; no accidental key collision or noninteger digit passes.
    assigned_to: TASK-20260908-5b034f
  blind_rederivation:
    required: false
    quantity: Canonical base-p digits and Teichmuller precision identities.
    parameters: Same prime p>=5 and precision 2/3 as the archived blind derivation.
    blind_from: []
    assigned_to: TASK-20260908-5b034f
    not_repeated_reason: Standard quantities were independently derived by TASK-20260907-b27e3e and archived at
      919226fc7cda8815bea6366014f1aa1dc4702680. This review checks explicit corrected contract conformance and prospective
      definitions, not a new mathematical claim or a new blind rederivation.
    prior_review_task: TASK-20260907-b27e3e
    prior_archive_commit: 919226fc7cda8815bea6366014f1aa1dc4702680
  procedure_deviations: []
  scope_limit: Zero scientific runs, no implementation approval or hypothesis/status transition. Known missing Linux
    runtime availability is an operational prerequisite; detect whether its contract is complete without claiming
    availability.
