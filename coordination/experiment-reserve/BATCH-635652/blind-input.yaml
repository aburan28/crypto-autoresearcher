blind_input:
  provenance: internal; Coordinator statement of standard ring quantities, deliberately omitting producer formulas
    and outcomes.
  quantity: Canonical base-p coordinate digits and their precision reduction; Teichmuller representative in Z/(p^s)
    and its fixed-point identity.
  parameters: Prime p>=5, s=2 or 3, canonical integer C in [0,p^s), c0=C mod p, j=1 or 2 when j<s. Derive from these
    definitions. Fixed check parameters include p=5,C=32,c0=2 and residue x=2 at precision three.
  required_properties:
  - Unique base-p expansion with digits in 0..p-1 reconstructs the canonical representative.
  - Reduction from precision three to two preserves available digits.
  - The lift reduces to the requested residue and satisfies T^p=T modulo p^s.
  allowed_checks: At most20 fixed synthetic arithmetic checks, no experimental parameter sweep or curve generation.
