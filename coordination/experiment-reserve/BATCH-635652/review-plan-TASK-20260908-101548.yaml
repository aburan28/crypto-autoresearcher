review_plan:
  claim_under_review: Source conformance of the confined group-OOM supervisor and native descriptor/process
    adapters before any live operational test.
  coordinator_prior: The source producer reports45passing synthetic state-machine cases. Its outer command
    custody is incomplete and implementation_commit labels a checkout base; both remain preserved under failed
    producer state. Independent source review can establish code properties only. The largest risks are a mocked
    interface hiding a native-adapter gap,write confinement,partial migration/cleanup,worker readiness ordering
    and false OOM classification.
  recorded_before_reviewers: true
  source_snapshot: ae1e0ffd286ce70ed781b923554a75a5faf375d0
  joints:
  - joint: complete_supervisor_source_confinement_ordering_and_custody
    assigned_to: TASK-20260908-101548
    attack_plan: Read the entire approved_source_protocol,all seven source/metadata files and failure-custody
      note. Trace every frozen startup,case,telemetry and cleanup obligation to actual production code. Independently
      exercise GroupOomSupervisor plus DescriptorCgroupTransport,PosixProcessTransport,PosixWorkerRuntime and
      container binding functions through fixed ordinary-filesystem/syscall/process mocks; a pass of fake transport
      summaries cannot substitute for native-adapter inspection. Check full inspected64hex containerID and
      task identity before mutations,exact own cgroup subtree and cgroup2 mount semantics,component-wise no-follow
      descriptors,allowlisted files,partial writes,root/direct-membership and existing-directory refusal. Verify
      supervisor moves out before delegation,all three worker values and counters are read before fork,child
      is migrated and confirmed before release,all writable descriptors close and groups/GID/UID/caps/OOM-protection
      checks precede body. Exercise actual profile checker on exact/mismatched fields and group0 refusal before
      allocation. Trace the auxiliary-ready and before-allocation markers and require real terminal/counter
      correspondence for the small group-OOM classification; missing counters,wrong group,manual/watchdog/outer-OOM
      and surviving members cannot pass. Check every exception path retains primary cause and partial transcript,cleanup
      only addresses created paths/owned children,unexpected paths are not swept,failed sink/write/close cannot
      produce false complete custody,signals and deadlines cannot strand a worker or helper. Inspect callback/transport
      contracts for required but unimplemented host/native behavior and name any integration prerequisite precisely.
      Independently verify exact source hashes and preserved45nested case receipt while refusing any inference
      about an unretained outer exit. All tests use fixed synthetic observations and ordinary temporary files
      only; no live Docker,cgroup,privilege,forked memory load or scientific action.
    breaking_artifact: Exact source line and independent fixed counterexample,unimplemented native path,or
      missing confinement/ordering/custody obligation.
  blindness:
    mutual: false
    lifted_for:
    - TASK-20260908-101548
    rationale: Fresh source-aware review. Declared producer and historical operational documents are visible;
      no parent/producer conversation or concurrent reports.
  proves_too_much:
    objects:
    - A correct suffix attached to the wrong parent/root path or a symlink component.
    - A changed inspected container identity or unexpected existing child cgroup.
    - Partial controller writes or a profile asserted without readback.
    - A worker released before migration or retaining writable descriptors/capabilities.
    - A group0 or wrong-memory worker that still reaches allocation.
    - An OOM-looking signal without required group counters or supervisor separation.
    - Cleanup/transcript failures that erase the primary cause or leave a falsely complete outcome.
    failure_signature: Known-invalid identities,unsafe writes,early worker release,missing observations or
      manual kills must not pass the claimed operational classification.
    assigned_to: TASK-20260908-101548
  blind_rederivation:
    required: false
    quantity: No mathematical quantity or cryptanalytic claim.
    parameters: Fixed operational interface and mocked observations.
    blind_from: []
    assigned_to: TASK-20260908-101548
    not_repeated_reason: Source/operational design review only; no new mathematical result.
  scope_limit: Source joint only. No live cgroup/Docker/privilege/migration/pressure action,operational OOM
    result,scientific admission,or retrospective repair of failed producer outer custody.
  procedure_deviations: []
