review_plan:
  claim_under_review: Completeness and internal mathematical consistency of five prospective experimental amendments.
    All remain unapproved and unauthorized for execution; no scientific claim is under review.
  coordinator_prior: 'Before reviewers run: definitions and accounting are more explicit, but the Coordinator suspects
    the higher base-p digit definition may fail when a lower digit is nonzero. Other finite-null, sample-count and
    memory-scope gaps may remain. The prior is NEEDS_CORRECTION, not an approval presumption.'
  recorded_before_reviewers: true
  source_snapshot: e1c6eec166b765d7e6af860b8a5243f26956e311
  joints:
  - joint: Implementability, counts, controls, null exchangeability and cost completeness across all five amendments
    assigned_to: TASK-20260907-ab3eb8
    attack_plan: Read the exact bound amendments and original specifications. Trace all formula domains, quantifiers,
      sample counts, RNG schedules, controls, failure branches and charged costs. Construct fixed small arithmetic
      or mock counterexamples to ambiguous or undefined operations, invalid null pooling, contradictory counts and
      unenforced memory claims. Distinguish proven defects from missing definitions; report separately for every
      experiment.
    breaking_artifact: Exact path and field with a worked counterexample or a precisely missing executable definition;
      no scientific measurements.
  - joint: Blind derivation of canonical base-p digits, precision compatibility and Teichmuller lifts
    assigned_to: TASK-20260907-b27e3e
    attack_plan: Derive digits and compatibility from the quantity statement alone. Check fixed hand-chosen examples
      including nonzero lower digits, canonical representative boundaries and a deliberately insufficient lift exponent.
      State any hypotheses needed for existence and uniqueness. Do not read amendments, producer notes, designs
      or other review reports.
    breaking_artifact: Explicit arithmetic identities and known-false controls that distinguish a valid digit or
      lift formula from an invalid one.
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
    - An integer with a nonzero first higher digit, where division by p squared after removing only the residue
      need not be integral.
    - A purported precision-three Teichmuller representative that is only a precision-two lift.
    failure_signature: A universal digit formula must handle all canonical representatives, and a precision-three
      lift must satisfy its fixed-point and reduction identities modulo p cubed.
    assigned_to: TASK-20260907-b27e3e
  blind_rederivation:
    required: true
    quantity: Canonical base-p coordinate digits and their precision reduction; Teichmuller representative in Z/(p^s)
      and its fixed-point identity.
    parameters: Prime p>=5, s=2 or 3, canonical integer C in [0,p^s), c0=C mod p, j=1 or 2 when j<s. Derive from
      these definitions. Fixed check parameters include p=5,C=32,c0=2 and residue x=2 at precision three.
    blind_from:
    - coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-184fc4.yaml
    - coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-0c717c.yaml
    - coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-1e6502.yaml
