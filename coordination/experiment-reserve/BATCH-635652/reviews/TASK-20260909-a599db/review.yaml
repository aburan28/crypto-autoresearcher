  findings:
    - id: NF-01
      severity: blocking
      verdict: breaks
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/container.py:341
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/container.py:357
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/host.py:387
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/tests.py:442
      evidence_cases:
        - container_and_host_schema_literals_diverge
        - production_container_schema_is_rejected_by_host
        - producer_fixture_schema_masks_host_break
      finding: >-
        container.py emits crypto.autoresearch.group_oom_container_result.v2,
        while host.py accepts only
        crypto.autoresearch.group_oom_native_container_result.v1. Producer
        host tests construct the latter manually. Every actual clean container
        result is therefore rejected and forced through outer failure cleanup.
      implication: No final native case can complete through the production host/container seam.
    - id: NF-02
      severity: blocking
      verdict: breaks
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/supervisor.py:522
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/supervisor.py:529
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/supervisor.py:531
      evidence_case: cgroup_v2_cleanup_order_refuses_move_before_disable
      finding: >-
        Cleanup moves the supervisor into the verified non-root container
        cgroup before writing -memory to cgroup.subtree_control. With a domain
        controller still delegated, cgroup v2's no-internal-process rule
        refuses that migration. The frozen protocol states the safe inverse:
        disable the helper-enabled delegation, then move the supervisor, then
        remove guard-supervisor.
      implication: Every otherwise-clean live case reaches incomplete inner cleanup and must be contained by the outer host.
    - id: NF-03
      severity: high
      verdict: breaks
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/host.py:341
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/host.py:344
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/host.py:368
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/container.py:274
      evidence_case: wrong_nonce_inspection_is_accepted
      finding: >-
        The host generates a unique nonce for name and create label, but the
        independent inspection checks only the task label. It does not compare
        the inspected nonce or name with the generated value. A full-ID
        inspection with a different nonce passes.
      implication: The claimed create-to-inspect exact-container binding lacks its unique possession check.
    - id: NF-04
      severity: high
      verdict: breaks
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/supervisor.py:570
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/supervisor.py:575
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/supervisor.py:634
      evidence_case: missing_supervisor_membership_readback_can_complete
      finding: >-
        The source writes the supervisor PID to guard-supervisor and verifies
        only that the parent is empty. It never requires guard-supervisor's
        direct members to equal the supervisor PID, either after the move or
        after worker termination. The recorded inner evidence contains no
        membership fact, and a transport that loses the supervisor membership
        still returns inner_complete.
      implication: Source evidence does not establish the frozen supervisor-separation invariant.
    - id: NF-05
      severity: high
      verdict: breaks
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/supervisor.py:900
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/supervisor.py:905
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-e5f500/supervisor.py:906
      evidence_case: list_children_stat_error_is_silently_skipped
      finding: >-
        list_children catches every OSError from descriptor-relative stat and
        continues. A visible foreign child whose stat returns PermissionError
        is therefore erased from the precondition view, which can turn an
        unsupported subtree into an apparently empty one.
      implication: Unexpected-child refusal is fail-open for stat errors other than a confirmed disappearance.
  native_integration_prerequisites:
    - Use one shared report schema constant across container.py, host.py and tests.py, and exercise the production container emitter at the host seam.
    - Disable the helper-enabled memory delegation before moving the supervisor back to the verified parent; independently model the cgroup-v2 no-internal-process rule.
    - Bind the generated nonce, and preferably the exact generated name, to initial inspection before copy/start.
    - Read back guard-supervisor direct membership after the move and after worker terminal; include it in inner supervisor evidence.
    - Fail closed on child-entry stat errors, distinguishing only a confirmed ENOENT race if deliberately permitted.
    - Re-run a fresh bounded source review after an additive correction and Coordinator snapshot.
    - Keep live Docker, cgroup, privilege, migration and pressure execution behind a new committed Coordinator handoff after source acceptance.
  heuristic_validation_checks: []
  cost_model_checks: []
  proof_architecture_checks: []
  verdict: failed
  verdict_reason: >-
    The assigned source-conformance joint breaks on five deterministic current-
    source counterexamples. Two are blocking integration failures: production
    report schemas cannot join, and cgroup-v2 cleanup uses the forbidden move-
    before-disable order. The final checker completed successfully and confirms
    both positive custody properties and these breaks; a passing checker is not
    a source-conformance verdict.
  limitations:
    - No live Docker, cgroup, mount, privilege, migration, pressure, OOM or scientific result was produced.
    - Positive Linux fstatfs/mountinfo, actual Docker Desktop bind/delegation, Docker cp into the stopped read-only-root container, and daemon terminal semantics remain untested platform paths.
    - The cross-UID signal-permission failure under SETUID/SETGID-only capabilities was inspected and mocked but not performed; source fails closed to exact outer containment rather than adding CAP_KILL.
    - Bounded POSIX checks ran on Darwin under the current user and establish only pipe, barrier, signal, wait, reap and descriptor custody for those exact fixtures.
    - The hard 2 GiB address-space cap was not applied. The parent enforced a 2 GiB resident-memory watchdog; the raw-poll peak was 50,282,496 bytes and no threshold fired.
    - The receipt summary's RSS basis label is inconsistent with its raw polls as described under metric_recomputations; the raw data remains complete.
    - The prior 251 producer cases, 15 producer child starts and intermediate source versions remain unavailable; this review does not reconstruct or retrovalidate them.
    - This is a verdict on the one assigned joint. It is not a live guard, launch, measurement, cryptanalytic, scientific or official-state verdict.
