        - a command-transport launch exception leaves no attempted-command row
        - a barrier-release primary error is replaced when owned-child finalization also fails
  findings:
    - id: IR-01
      severity: medium
      verdict: breaks
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-8cca96/host.py:346
      evidence_case: break_current_container_name_uses_current_task_identity
      finding: >-
        run_case labels the container with the current TASK-20260909-8cca96 but
        constructs its Docker name with the predecessor TASK-20260909-e5f500.
        The final control observed
        task-20260909-e5f500-exact-profile-111111111111 where the current-task
        prefix was required.
      implication: >-
        Full ID, task-label and nonce checks still carry the security binding,
        but the exact container name and HostOutcome provenance are stale and do
        not conform to the current-task identity contract.
    - id: IR-02
      severity: high
      verdict: breaks
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-8cca96/supervisor.py:476
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-8cca96/supervisor.py:518
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-8cca96/supervisor.py:951
      evidence_case: break_owned_cgroup_removal_revalidates_created_handle_identity
      finding: >-
        Cleanup retains the created worker DirectoryHandle with device/inode
        identity, but remove_empty_child receives only the parent and fixed name.
        It reopens that name, verifies only emptiness and removes it without
        comparing the reopened identity to the created handle. The fixed
        counterexample substituted inode (7,12) for the created inode (7,11),
        and production removal proceeded.
      implication: >-
        Under a concurrent rename/replacement of the fixed child name, cleanup
        can remove a different empty cgroup and report success without proving
        that the task-created cgroup was removed. This breaks the exact-owned
        subgroup cleanup obligation.
    - id: IR-03
      severity: high
      verdict: breaks
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-8cca96/host.py:83
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-8cca96/host.py:236
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-8cca96/host.py:450
      evidence_case: break_host_launch_exception_retains_attempted_command_custody
      finding: >-
        DockerHostAdapter._run appends a command row only after transport.run
        returns. If SubprocessTransport cannot launch Popen, or an injected
        transport raises the same boundary exception, run_case retains only an
        unexpected_host_error string. The attempted argv, stdin digest, timeout,
        UTC boundaries and absence of an owned process are not recorded in
        HostOutcome.commands.
      implication: >-
        The complete external-command custody promise fails on launch exceptions,
        even though the host outcome itself fails closed and no success is claimed.
    - id: IR-04
      severity: high
      verdict: breaks
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260909-8cca96/supervisor.py:1131
      evidence_case: break_release_preserves_primary_when_finalize_also_fails
      finding: >-
        release calls finalize_owned_child inside the exception handler for the
        barrier write. If finalization also raises, its secondary GuardError
        replaces the original worker_barrier_release_failed/OSError. The fixed
        control produced exactly secondary_cleanup_failure with the bad-file-
        descriptor primary absent from the returned exception.
      implication: >-
        A combined barrier and cleanup failure erases the primary cause rather
        than retaining primary and secondary custody evidence as the frozen
        contract requires.
  residual_observation:
    memory_delegation_enable_readback: >-
      The source reads back -memory during cleanup and all three worker profile
      files, but it does not explicitly read cgroup.subtree_control immediately
      after +memory. A conforming live kernel should make missing delegation
      surface when worker profile files are created/written, but source checks
      cannot establish that platform behavior. A future live admission must
      retain the actual delegation readback rather than infer it from this review.
