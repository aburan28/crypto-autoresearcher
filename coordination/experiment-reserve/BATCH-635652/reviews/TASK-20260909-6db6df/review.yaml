      checked_repairs:
        - Path and PurePosixPath resolve in native references
        - wait status maps SIGKILL canonically
        - migration failure finalizes the owned paused child
        - malformed auxiliary readiness kills and reaps the exact auxiliary
        - failed required cgroup cleanup downgrades a nominal classification
        - membership acknowledgement, bounded polling and counter deltas are required
        - partial child creation rolls back or returns a typed cleanup failure
        - fork failure closes all four newly opened pipe descriptors
        - partial and interrupted event writes complete through the write loop
        - outer terminal and OOM exclusion are host observations rather than a constant liveness assertion
        - native host, mount, membership and descriptor adapters exist and are joined
        - missing historical producer custody remains missing and is not reconstructed
    - family: proves_too_much
      result: breaks
      held_objects:
        - wrong parent, root, traversal and symlink paths are refused
        - changed inspected container ID is refused before identity-dependent mutation
        - partial writes loop and all three worker profile files are read back
        - release follows profile, worker migration and membership checks
        - group-zero and mismatched worker profiles cannot reach the allocation path
        - OOM-looking signals require group counter deltas and supervisor separation
        - production v2 passes while a fabricated schema fails
        - missing or mismatched nonce refuses payload copy and cleanup mutation
        - delegation-disable failure prevents moving the supervisor into a non-root parent
        - missing supervisor membership and child-enumeration errors fail closed
      broken_objects:
