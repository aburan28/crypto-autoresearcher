  interpretation: >-
    The five NF corrections and the earlier enumerated repairs materially hold,
    but four complete-source counterexamples remain. Therefore the assigned
    source-conformance joint breaks. No live guard, runtime, measurement or
    scientific execution is admitted. The independent first-attempt fixture
    custody gap also prevents describing this review's entire attempt history as
    complete, although the gap and corrected final attempt are preserved.
  required_repairs_before_new_source_review:
    - derive the Docker name from the current TASK_ID and test the exact current name
    - bind remove_empty_child to the originally created DirectoryHandle identity and reject replacement
    - retain an attempted-command record, including launch exception and no-owned-process state, before transport execution can raise
    - aggregate a barrier-release primary with any finalize_owned_child secondary failure without losing either
    - create a new immutable source snapshot and a fresh independent review; do not alter this snapshot
  caller_host_platform_prerequisites_after_source_repair:
    - exact pinned Linux/arm64 image ID and digest must be inspected from the allowed local Docker endpoint before create
    - the exact task label, nonce label, full container ID, command, capability set, namespace, mount and resource profile must be inspected before copy or start
    - /host-cgroup must be the exact writable cgroup2 bind and /proc/self/cgroup must resolve to one allowed full-ID path with no symlink or replacement component
    - the memory controller must be available and actual subtree delegation/profile readbacks must be retained
    - the parent must initially contain exactly the supervisor and no child cgroups; initial and final supervisor subgroup membership must be exact
    - setgroups, GID, UID, capability and oom_score_adj postconditions plus same-UID auxiliary signal/reap behavior must succeed under cap-drop ALL with SETUID and SETGID only
    - worker and auxiliary membership, event order, baseline-to-final counter deltas, subtree emptiness and exact terminal states must be observed live
    - outer host containment must retain terminal inspection and full logs and remove only the verified exact container ID
    - observed Docker VM memory remains below 8 GiB in the bound administrative record, so configuration readback must remain distinct from physical-availability or 8 GiB pressure claims
  limitations:
    - Source review and fixed injected observations cannot establish live Docker, cgroup-v2, mount, capability, migration, signal, OOM or cleanup behavior.
    - The 106 independent controls include repeated source checks, not scientific or measured-performance runs.
    - The first independent watchdog fixture retained its assertion failure but omitted one actual PID and terminal object; neither was reconstructed. The final fixture retained all five exact PIDs and terminal records.
    - Parent RSS samples observe the exact checker PID only. Descendant RSS is not aggregated, post-exit unavailability is explicit, and no RLIMIT_AS or hard-kernel-memory claim is made.
    - The producer's 99/99 final suite, 198 registered executions and ten retained fixture starts establish only the properties those checks exercised; they are not inferred to establish correctness.
    - The predecessor's 251 cases and 15 starts remain summary-only. This review does not reconstruct or retrovalidate them.
    - This report owns one review-plan joint and is not a whole-runtime, operational, scientific, cryptanalytic or official-state verdict.
