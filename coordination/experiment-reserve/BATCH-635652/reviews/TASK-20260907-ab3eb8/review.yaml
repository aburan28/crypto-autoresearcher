      A failed checker is not reported as a protocol pass. No check was rerun.

  verdict: incomplete
  owned_joint_verdict: breaks
  per_experiment_summary:
    EXP-ECDLP-184fc4: NEEDS_CORRECTION
    EXP-ECDLP-0c717c: NEEDS_CORRECTION
    EXP-ECDLP-1e6502: NEEDS_CORRECTION
    EXP-ECDLP-2c3d20: NEEDS_CORRECTION
    EXP-ECDLP-709063: NEEDS_CORRECTION
