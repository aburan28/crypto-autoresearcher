      plugins/crypto-autoresearcher-harness/skills/crypto-autoresearcher-harness/SKILL.md,
      docs/task-lifecycle.md and docs/dynamic-subagent-dispatch.md. These are
      process contracts, not producer evidence; they contained no sibling report.
      The deviation is disclosed because those paths are not listed in the
