  scope_statement: >-
    This report reviews only the owned joint: implementability, counts,
    controls, null exchangeability and cost completeness of the five
    prospective amendments. It is a task-scoped zero-run readiness report, not
    a new VAL-namespace or ledger evidence record. It does not validate a run,
    approve a protocol, authorize execution, change an experiment or hypothesis
    status, or decide any scientific claim.

  artifact_checks:
    - check: source_snapshot_binding
      result: PASS
      detail: >-
        All five amendment files and readiness.md byte-match their versions at
        e1c6eec166b765d7e6af860b8a5243f26956e311. Their six SHA-256 values match
        the committed handoff exactly.
    - check: original_specification_binding
      result: PASS
      detail: >-
        The five original specification SHA-256 values recompute to the values
        named by their amendments: a805989f1ae1880afef401ab98a764067e41eefec87afbc2c5804a4844bdf82a,
        949b447b57e2d652e1d021e8f19c8bb3f6f4b29c4f90fd8c86aef4ae3667b6c2,
        873a61b27d90b0da2f134ce0bb0412cd7d13b1ff7f2b2973632f05ce3b17e82a,
        d38d39bfb8aeee1874433ef054605bc32fdbbc190496bd152379561bf8e62854,
        and fbb7e4a95a35b98eee07abe93828ad532301fe83e69b8ffdca67435e262a6bff.
    - check: review_plan_precommitment
      result: PASS
      detail: >-
        The live review-plan path byte-matches commit
        aa6270668f28dfe8be05c9ee6da82496f6f9d944, and that commit is an ancestor
        of the review worktree. No sibling report was read.
    - check: declared_input_worktree_state
      result: PASS
      detail: >-
        Every declared input is clean against HEAD. Unrelated concurrent edits
        and untracked paths were observed by git status but their contents were
        not read or changed.

  metric_recomputations:
    - experiment_id: EXP-ECDLP-184fc4
      result: PASS
      detail: >-
        The library count is 525+14+9+16+3=567. The 42 bundles give
        42*567=23,814 observed spectra and 23,814*64=1,524,096 null spectra.
    - experiment_id: EXP-ECDLP-0c717c
      result: PASS
      detail: >-
        Four rungs, two strata and three replicates give 24 bundles and 96
        primary base cells. The null count is
        18*2*32+6*2*8=1,248 underlying permutations, 2,496 base evaluations and
        4,992 envelope values. The declared nearest-rank indices are (1,32) for
        R=32 and (1,8) for R=8.
    - experiment_id: EXP-ECDLP-1e6502
      result: PASS
      detail: >-
        Precision two has 6+6*16=102 members and precision three has
        8+8*16=136. Thus 36*(102+136)=8,568 observed spectra and
        8,568*64=548,352 null spectra. The anomalous target is 24*20=480
        recovery cases.
    - experiment_id: EXP-ECDLP-2c3d20
      result: PASS_WITH_SCHEMA_LIMITATION
      detail: >-
        Arithmetic recomputation gives 42 bundles, 168 true maps, 10,752 null
        maps, 6,720 true lumped matrices, 430,080 null lumped matrices, 960 true
        slope trajectories and 61,440 null slope trajectories. The amendment
        stores these entries as human arithmetic strings rather than integer
        scalars, so a manifest builder must recompute them instead of consuming
        typed counts.
    - experiment_id: EXP-ECDLP-709063
      result: PASS_WITH_SCHEMA_LIMITATION
      detail: >-
        The capacity rule gives (S,E)=(0,0),(256,179),(2048,1433),
        (16384,11468). Algorithm rows total 16+256+48+48=368 and representation
        controls total 8. The latter two YAML values are arithmetic strings,
        not machine-readable integer scalars.

  control_checks:
    - experiment_id: EXP-ECDLP-184fc4
      result: DEFINITION_HOLDS
      detail: >-
        The real-cosine conjugate pair, exact centering/Parseval checks, and the
        order-2q descent-character definition have compatible domains. This is
        a definition audit; no control was executed or declared passed.
    - experiment_id: EXP-ECDLP-0c717c
      result: DEFINITION_HOLDS
      detail: >-
        The accepted-pair count L, L=0 branch, direct quadratic sum, and
        index-two S_quad=1 identity are internally compatible. This is a
        definition audit; no control was executed or declared passed.
    - experiment_id: EXP-ECDLP-1e6502
      result: NEEDS_CORRECTION
      detail: >-
        The anomalous and prime-to-p routines have disjoint order predicates,
        but the higher coordinate digit and SC4 schedule defects below prevent
        the precision/control package from being executable as frozen.
    - experiment_id: EXP-ECDLP-2c3d20
      result: NEEDS_CORRECTION
      detail: >-
        The pointwise-null domain and stationary equations are exact, but the
        order-2q control generator does not freeze candidate p,A,B derivation,
        point-stream serialization, or an attempt cap. The phrase "same
        derived-seed stream" is insufficient to implement a generator whose
        target order differs from the primary helper's prime-order output.
    - experiment_id: EXP-ECDLP-709063
      result: DEFINITION_HOLDS
      detail: >-
        The fixed byte buffer, zero-slot probe, E+1 unchanged-buffer probe,
        solution certificate and charged component-sum controls are mutually
        compatible. This is a definition audit; no allocation or solver was run.

  null_exchangeability_checks:
    - experiment_id: EXP-ECDLP-184fc4
      result: PASS_WITH_STATED_ASSUMPTION
      detail: >-
        The amendment explicitly conditions on joint exchangeability of the
        whole 567-vector under one common permutation and limits the 65-way rank
        to that null. It does not rely on marginal exchangeability alone.
    - experiment_id: EXP-ECDLP-0c717c
      result: PASS_AS_DESCRIPTIVE_MODEL_NULL
      detail: >-
        Each uniform random-base prefix is size matched, the interval/residue
        coupling is disclosed, and only indices 0 through 7 span the slope
        ladder. The observed structured base is not exchangeable with a uniform
        prefix by construction, but the amendment labels its ranks descriptive
        and claims no exact p-value or family-wise error control.
    - experiment_id: EXP-ECDLP-1e6502
      result: PASS_WITH_STATED_ASSUMPTION
      detail: >-
        One permutation is common to every member within a precision/cell and
        the required joint assignment null is explicit. The 65-way rank remains
        conditional on that stated model.
    - experiment_id: EXP-ECDLP-2c3d20
      result: NEEDS_CORRECTION
      detail: >-
        Map-level pointwise-label nulls are defined under a disclosed SHA-256
        PRF model. Class-level nulls are not total: deterministic 20-percent
        matching explicitly allows unmatched classes, while every scalar rank
        later divides by 65 and class-spectrum Z has no missing-match rule.
    - experiment_id: EXP-ECDLP-709063
      result: NOT_APPLICABLE
      detail: >-
        The comparison uses paired deterministic instances and independent rho
        streams rather than a permutation/randomization rank. Censoring and the
        12-of-16 usability rule are explicitly stated.

  cost_model_checks:
    - experiments:
        - EXP-ECDLP-184fc4
        - EXP-ECDLP-0c717c
        - EXP-ECDLP-1e6502
      result: NEEDS_CORRECTION
      detail: >-
        Each complete replacement declares an 8 GiB number and future measured
        wall/CPU/RSS or array fields, but omits a stage cost plan, explicit null
        wall/CPU estimates, memory object lifetimes and an enforcement rule.
        Advisory estimates may be null under the research-budget policy; the
        missing accounting fields and memory conformance definition are the
        defect, not a finite research-spending cap.
    - experiments:
        - EXP-ECDLP-2c3d20
      result: NEEDS_CORRECTION
      detail: >-
        Required transition maps and label/map artifacts have no frozen index
        width, streaming order or lifetime. A fixed mock at N=2^23 with four r
        values, one true plus 64 null maps each, and uint32 transitions requires
        8,724,152,320 bytes if resident together, above 8 GiB before labels,
        partitions or SVD workspaces. This does not prove a streamed
        implementation exceeds the guard; it proves the contract has not made
        8 GiB conformance checkable.
    - experiments:
        - EXP-ECDLP-709063
      result: NEEDS_CORRECTION
      detail: >-
        Measured total_group_operations is fully componentized, but the formula
        labeled the discrete charged model,
        D_model=E+ceil(N/E)-c_ref*sqrt(N), omits the separately charged [E]P
        scalar precompute, the exact M-1 versus M baby-step convention,
        termination-dependent giant steps and the final certificate. The text
        assigns baby/precompute/certificate omission only to the first proxy,
        so the second model's bias is not disclosed.

  heuristic_validation_checks:
    - result: NOT_APPLICABLE_ZERO_RUN
      detail: >-
        No observation, distribution, control outcome or heuristic agreement
        was produced. The checks above only assess whether future nulls and
        decision rules are executable and scoped.

  proof_architecture_checks:
    - result: PARTIAL
      detail: >-
        Every amendment names a toy-scale method ceiling and nearby control.
        Those boundaries are appropriately narrow. The implementation gaps in
        the owned joint prevent the prospective control architecture from being
        complete; no proof, strictness witness or scientific conclusion was
        reviewed.

  per_experiment_owned_joint_verdicts:
    - experiment_id: EXP-ECDLP-184fc4
      verdict: NEEDS_CORRECTION
      checks_that_hold:
        - library and cell counts recompute exactly
        - joint common-permutation exchangeability assumption and rank scope are explicit
        - cosine and descent controls are domain consistent
      breaking_artifacts:
        - id: F-184-1
          kind: missing_executable_definition
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-184fc4.yaml
          field: protocol_amendment.effective_contract.permutation_null_and_inference.per_member_outputs
          worked_attack: >-
            For the sorted null vector 0,1,...,63, the one-based nearest-rank
            2.5-percent value is 1 whereas linear interpolation gives 1.575;
            the upper values differ similarly. The field requests a "declared
            order-statistic rule" but no such rule occurs in this amendment.
          correction_required: >-
            Freeze median behavior for 64 values and exact one-based indices or
            interpolation for both percentiles.
        - id: F-184-2
          kind: incomplete_cost_contract
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-184fc4.yaml
          field: protocol_amendment.effective_contract
          worked_attack: >-
            The contract fixes maximum_memory_gb=8 and asks for array,
            workspace and RSS outputs, but specifies no object lifetime,
            streaming plan, memory enforcement or explicit null stage estimate.
          correction_required: >-
            Add a stage accounting block and a checkable memory-lifetime and
            enforcement rule; wall/CPU estimates may remain null.

    - experiment_id: EXP-ECDLP-0c717c
      verdict: NEEDS_CORRECTION
      checks_that_hold:
        - base, null, envelope and slope counts recompute exactly
        - finite percentiles and common eight-rung null indices are explicit
        - L=0 and zero-null-median branches are total
      breaking_artifacts:
        - id: F-0C-1
          kind: ambiguous_rng_schedule
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-0c717c.yaml
          field: protocol_amendment.effective_contract.slope_definition.intervals
          worked_attack: >-
            The SHA-256 domain ends in the literal text "analysis-key", but no
            serialization for gamma, base_family, envelope or stratum is
            defined. Treating it literally reuses one resample schedule for all
            analyses; treating it as a placeholder gives multiple incompatible
            encodings.
          correction_required: >-
            Define the exact UTF-8 analysis-key tuple and state which bootstrap
            resample indices are intentionally shared.
        - id: F-0C-2
          kind: incomplete_cost_contract
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-0c717c.yaml
          field: protocol_amendment.effective_contract
          worked_attack: >-
            Pair counts and output memory fields exist, but the replacement has
            no stage cost schema, explicit null wall/CPU estimates, memory
            lifetimes or 8 GiB enforcement rule.
          correction_required: >-
            Freeze the stage accounting and memory conformance contract; cost
            estimates may be explicit nulls.

    - experiment_id: EXP-ECDLP-1e6502
      verdict: NEEDS_CORRECTION
      checks_that_hold:
        - member, spectrum, null and anomalous-target counts recompute exactly
        - anomalous and prime-to-p order predicates are disjoint
        - common-permutation null scope is explicit
      breaking_artifacts:
        - id: F-1E-1
          kind: proven_formula_domain_failure
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-1e6502.yaml
          field: protocol_amendment.effective_contract.eight_base_digits.coordinate_digit_operator
          worked_attack: >-
            At p=5, C=32 and c0=2, the canonical base-p digits are (2,1,1).
            For j=2 the declared numerator C-c0=30 is not divisible by p^2=25,
            so the required divisibility check rejects a valid coordinate and
            digit_2 is undefined. The correct extraction is floor(C/p^j) mod p,
            equivalently subtract all lower digits before exact division.
          correction_required: >-
            Replace the universal operator with floor(C/p^j) mod p or the
            explicitly lower-digit-subtracted quotient, and bind every caller
            including T_x2 to the corrected definition.
        - id: F-1E-2
          kind: missing_rng_schedule
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-1e6502.yaml
          field: protocol_amendment.effective_contract.five_blocking_self_checks.SC4_first_order_translation.exact_test
          worked_attack: >-
            SC4 requests 10,000 deterministic pairs (R,z) and fixes z_j, but it
            never defines how eligible points R are selected or cycled. Two
            conforming implementations can cover different points while
            producing the same requested check count.
          correction_required: >-
            Freeze an R-index derivation, duplicate policy and exhaustion rule.
        - id: F-1E-3
          kind: incomplete_cost_contract
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-1e6502.yaml
          field: protocol_amendment.effective_contract
          worked_attack: >-
            Field/group-operation and RSS outputs are named, but no stage cost
            block, explicit null wall/CPU estimates, memory lifetime or 8 GiB
            enforcement rule is frozen.
          correction_required: >-
            Add explicit stage and memory conformance accounting before approval.

    - experiment_id: EXP-ECDLP-2c3d20
      verdict: NEEDS_CORRECTION
      checks_that_hold:
        - map, matrix and slope arithmetic counts recompute
        - stationary distribution and centered operator have total definitions
        - pointwise SHA-256 label model and descriptive rank limitation are disclosed
      breaking_artifacts:
        - id: F-2C-1
          kind: incomplete_class_null
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-2c3d20.yaml
          fields:
            - protocol_amendment.itinerary_statistics.deterministic_size_matching
            - protocol_amendment.itinerary_statistics.class_spectrum
            - protocol_amendment.null_inference_and_decisions.ranks
          worked_attack: >-
            For a true class of size 100 and a null replicate whose classes have
            sizes 10 and 190, no class lies in the allowed [80,120] interval.
            The matching rule correctly leaves the true class unmatched, but
            class-spectrum Z and the universal (1+#null)/65 rank then have no
            X_null[u] for that replicate.
          correction_required: >-
            Define whether a missing match invalidates that class statistic,
            requires 64 matches, or changes the denominator and inferential
            scope. Define the exact class-spectrum center, scale and
            zero-dispersion branch.
        - id: F-2C-2
          kind: missing_decision_statistic
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-2c3d20.yaml
          field: protocol_amendment.null_inference_and_decisions.review_candidate
          worked_attack: >-
            "Absolute standardized effect at least 2" occurs once and has no
            formula identifying a center, scale, tail direction or zero-scale
            outcome. Rank 1/65 alone does not determine this value.
          correction_required: >-
            Freeze a summary-specific effect formula and all exceptional cases.
        - id: F-2C-3
          kind: missing_control_generator
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-2c3d20.yaml
          field: protocol_amendment.order_2q_known_true_control.generation
          worked_attack: >-
            The primary generator calls a named helper, but the order-2q path
            only says to use the same stream under another domain. It gives no
            candidate p,A,B mapping, candidate-point stream encoding or attempt
            ceiling for the different target order.
          correction_required: >-
            Freeze the complete order-2q candidate and point algorithms and
            bounded exhaustion behavior.
        - id: F-2C-4
          kind: uncheckable_memory_guard
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-2c3d20.yaml
          fields:
            - protocol_amendment.required_artifacts_for_future_execution
            - protocol_amendment.budgets.future_maximum_memory_gb
          worked_attack: >-
            The fixed sizing mock exceeds 8 GiB when all 260 uint32 transition
            maps are resident. Streaming could satisfy the guard, but the
            contract fixes no width, lifetime or streaming order.
          correction_required: >-
            Freeze encodings and a stage lifetime/streaming plan with peak-byte
            accounting before approval.

    - experiment_id: EXP-ECDLP-709063
      verdict: NEEDS_CORRECTION
      checks_that_hold:
        - fixed-table capacities recompute exactly
        - zero-slot and E+1 controls define physical-cap enforcement
        - measured operation components, solution certificates and paired/censored branches are explicit
      breaking_artifacts:
        - id: F-709-1
          kind: deferred_stopping_rule
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-709063.yaml
          field: protocol_amendment.rho_baseline.run_rule
          worked_attack: >-
            The exact maximum-iteration formula is deferred to an execution
            plan. Different pre-launch choices change which streams censor,
            whether 12 successes are reached, the successful-cost median and
            every crossover classification.
          correction_required: >-
            Freeze the iteration formula and source binding in an additive
            contract before approval, not in an executor-authored launch plan.
        - id: F-709-2
          kind: incomplete_charged_cost_model
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-709063.yaml
          fields:
            - protocol_amendment.charged_group_operation_convention.total
            - protocol_amendment.metrics_and_decisions.modeled_values
          worked_attack: >-
            The measured convention charges scalar precomputation and the final
            certificate, while D_model contains only E+ceil(N/E) on the BSGS
            side. It also uses a full giant-step ceiling rather than the
            termination-dependent count. Therefore it is neither the full
            charged model nor an unbiased representation of measured D.
          correction_required: >-
            Add every charged component or relabel the expression as a partial
            optimistic proxy and list each omitted term with bias direction.
        - id: F-709-3
          kind: non_machine_readable_count_fields
          path: coordination/experiment-reserve/BATCH-c26423/amendments/TASK-20260907-e11ec7/EXP-ECDLP-709063.yaml
          field: protocol_amendment.exact_cell_accounting
          worked_attack: >-
            YAML parses total_algorithm_rows and
            total_representation_control_records as strings containing equations,
            even though the arithmetic totals are 368 and 8.
          correction_required: >-
            Store integer values and move derivations to separate text fields.

  fixed_check_receipt:
    path: coordination/experiment-reserve/BATCH-635652/reviews/TASK-20260907-ab3eb8/check-receipt.json
    command: >-
      PYTHONDONTWRITEBYTECODE=1 /usr/bin/time -lp python3
      coordination/experiment-reserve/BATCH-635652/reviews/TASK-20260907-ab3eb8/checks.py
    process_executions: 1
    fixed_synthetic_or_mock_checks: 20
    checks_passed: 18
    checks_failed: 2
    wall_seconds: 0.14
    cpu_seconds: 0.11
    maximum_workers: 1
    maximum_memory_gb: 2
    within_limits: true
    interpretation: >-
      One failure exposes string-valued 709063 count fields. The other is an
      intentionally simple token detector that could not isolate the charged
