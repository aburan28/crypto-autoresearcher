    - Ordinary temporary directories do not reproduce cgroup kernfs or Docker Desktop mount/delegation behavior.
    - All process, signal, privilege, and pressure paths were fixed mocks; no OS-level success is inferred.
    - The requested 2 GiB address-space soft limit could not be applied on this host; two zero-case failures and the 43,253,760-byte observed peak are retained.
    - The producer's missing complete outer command custody and misleading implementation_commit remain failed historical properties.
    - This report evaluates only its assigned joint and makes no mathematical, cryptanalytic, or scientific conclusion.
