  findings:
    - id: F-01
      severity: blocking
      verdict: breaks
      source:
        - supervisor.py:884
        - supervisor.py:956
        - supervisor.py:958
      evidence_cases:
        - runtime_missing_path_name_blocks_native_bootstrap
        - static_unresolved_path_loads
      finding: >-
        supervisor.py imports PurePosixPath but never Path. The actual
        PosixWorkerRuntime bootstrap raises NameError after the mocked
        close/groups/GID/UID sequence and before it can read /proc, emit the
        privilege postcondition, check the profile, or enter any fixed case.
        fixed_small_group_oom_body has the same unresolved name in its
        auxiliary path.
      implication: No native exact-profile, group-zero, or small-OOM case is runnable from this snapshot.
    - id: F-02
      severity: blocking
      verdict: breaks
      source:
        - supervisor.py:409
        - supervisor.py:837
        - supervisor.py:840
      evidence_case: process_sigkill_numeric_name_breaks_classifier
      finding: >-
        PosixProcessTransport converts negative waitstatus_to_exitcode values
        with f"SIG{abs(exit_code)}". A real SIGKILL therefore becomes SIG9,
        while _verify_worker_terminal requires the literal SIGKILL. The fixed
        native group-OOM terminal cannot satisfy its own classifier.
    - id: F-03
      severity: blocking
      verdict: breaks
      source:
        - supervisor.py:443
        - supervisor.py:452
        - supervisor.py:855
        - supervisor.py:859
        - supervisor.py:874
        - supervisor.py:907
      evidence_cases:
        - supervisor_migration_failure_strands_paused_child
        - runtime_fixed_body_malformed_ready_strands_helper
      finding: >-
        Cleanup kills the owned worker only when guard-worker is populated.
        A migration failure leaves the paused child in guard-supervisor and
        guard-worker empty, so it is not killed. kill_owned_child sends a
        signal but does not reap or close its pipes. The separately forked
        auxiliary is not represented by an owned handle and the pressure body
        has no finally path; malformed readiness or an early exception can
        strand it.
    - id: F-04
      severity: high
      verdict: breaks
      source:
        - supervisor.py:554
        - supervisor.py:576
        - supervisor.py:579
      evidence_case: supervisor_cleanup_failure_false_complete
      finding: >-
        The primary classification is set to complete before cleanup. Cleanup
        failures are appended but never downgrade or qualify status. An
        injected guard-worker removal failure therefore returns complete with
        an explicitly failed cleanup row, which violates complete custody.
    - id: F-05
      severity: high
      verdict: breaks
      source:
        - ledger/decisions/DEC-20260908-a617fa.yaml:82
        - ledger/decisions/DEC-20260908-a617fa.yaml:127
        - supervisor.py:291
        - supervisor.py:300
        - supervisor.py:415
        - supervisor.py:420
        - supervisor.py:535
        - supervisor.py:552
      evidence_cases:
        - supervisor_stale_absolute_oom_counters_false_pass
        - static_no_worker_membership_readback_interface
        - static_no_counter_delta_or_live_poll
      finding: >-
        The protocol requires both worker-group members established and
        memory.events increments. The worker interface cannot read membership,
        the supervisor checks the direct worker only before release, and no
        check binds the auxiliary PID to guard-worker before allocation.
        Baseline counters are retained but never compared to final counters;
        unchanged preloaded threshold values pass. Worker counters are read
        once after wait_terminal rather than polled with the child at bounded
        cadence.
    - id: F-06
      severity: high
      verdict: breaks
      source:
        - supervisor.py:664
        - supervisor.py:668
      evidence_case: descriptor_partial_create_not_rolled_back
      finding: >-
        DescriptorCgroupTransport.create_child does not roll back when mkdir
        succeeds and _open_child fails. The created path is never returned to
        GroupOomSupervisor, so scoped cleanup cannot know it exists.
    - id: F-07
      severity: high
      verdict: breaks
      source:
        - supervisor.py:761
        - supervisor.py:788
        - supervisor.py:827
        - supervisor.py:835
      evidence_cases:
        - process_fork_failure_leaks_pipe_fds
        - process_report_read_failure_leaves_state
      finding: >-
        Fork setup has no exception cleanup for the four pipe descriptors. A
        report read failure after waitpid leaves the report descriptor and
        child-state entry retained. These are deterministic partial-failure
        custody gaps.
    - id: F-08
      severity: high
      verdict: breaks
      source:
        - supervisor.py:757
        - supervisor.py:759
      evidence_case: process_partial_event_sink_not_detected
      finding: >-
        _write_event ignores the os.write return length. A short write is
        silently treated as success, so the event transcript has no complete
        sink-custody guarantee.
    - id: F-09
      severity: medium
      verdict: breaks
      source:
        - supervisor.py:861
        - supervisor.py:862
      evidence_case: process_supervisor_alive_is_constant
      finding: >-
        PosixProcessTransport.supervisor_alive always returns true. This is not
        an independently observed outer-container terminal state and cannot
        discharge the protocol's outer-OOM exclusion or external custody step.
    - id: F-10
      severity: blocking_integration_gap
      verdict: breaks
      source:
        - container.py:1
        - container.py:6
        - supervisor.py:598
        - supervisor.py:628
      evidence_cases:
        - static_no_native_container_host_adapter
        - static_no_cgroup2_mount_verification
      finding: >-
        The package has no native host adapter that creates, independently
        inspects, starts, and terminally inspects the exact Docker container or
        binds the task/ID from stdin. ContainerInspection is caller-supplied.
        DescriptorCgroupTransport opens the configured path but never verifies
        Linux or the cgroup2 filesystem type. These were acknowledged as
        future-live prerequisites, and they remain unimplemented boundaries
        rather than tested conformance.
    - id: F-11
      severity: preserved_limitation
      verdict: inconclusive
      source:
        - group-oom-source-delivery-custody.json:8
        - group-oom-source-delivery-custody.json:10
      evidence_case: producer_nested_receipt_preserved_not_outer
      finding: >-
        The 45 producer synthetic cases and nested exit 0 remain readable, but
        the producer outer exit was not retained and implementation_commit is
        misleading. This independent source review cannot reconstruct either
        past receipt fact.
  native_integration_prerequisites:
    - Correct the unresolved Path import and native signal-name conversion, then independently retest the exact snapshot.
    - Define owned-child and owned-auxiliary lifecycle cleanup that closes pipes, reaps every child, and cannot strand a pre-migration worker.
    - Make any failed required cleanup or transcript sink prevent a complete custody result while preserving the primary failure.
    - Bind baseline-to-final counter increments and verify both worker subgroup members before the allocation marker.
    - Implement an exact-ID Docker host adapter with independent create/inspect/start/terminal custody and task-ID stdin binding.
    - Verify Linux, actual cgroup2 mount type, writable delegation, exact own membership, and descriptor identity before mutation.
    - Obtain a new source snapshot and fresh independent review before any separately authorized live operational protocol.
