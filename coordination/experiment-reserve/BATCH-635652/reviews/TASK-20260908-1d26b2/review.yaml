    - The 2c3d20 worked attack is an analytic decision-map counterexample; it is not an executed null panel or observed signal.
    - The archived blind base-p digit derivation was not repeated because the precommitted plan explicitly made it unnecessary for this joint.
    - Host Darwin 25.6.0 is not the future Linux cgroup-v2 execution environment; this is an operational prerequisite and asserts nothing scientific.
    - No fresh model-serving probe was made; resolved_model_id records the native session assignment rather than a new adapter verification receipt.

  procedure_deviations:
