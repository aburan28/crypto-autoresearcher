  per_experiment_owned_joint_verdicts:
    - experiment_id: EXP-ECDLP-184fc4
      contract_sha256: c268cd5d21f76c6779c7bc41cbcf85f0ec0038ff68eb517e71f298af1c7fa234
      verdict: NEEDS_CORRECTION
      exact_tested_scope: >-
        The complete second-corrected successor, compared with its original,
        first amendment, immediate predecessor and archived validator review.
        Fixed checks covered 567-member/42-bundle arithmetic, canonical member
        identity, bootstrap analysis-key separation, unbiased three-label
        rejection boundaries, intentional full/terminal sharing, and undefined
        ratio behavior. Hash-domain completeness was audited separately from
        the repaired bootstrap schedule.
      checks_that_hold:
        - The canonical member identifiers distinguish every family and parameter with signed base-10 rules.
        - The bootstrap key separates member and stratum and intentionally shares only full_ladder and terminal triples within one member/stratum.
        - V below R=3*floor(2^256/3) is accepted and V at R is rejected, so the three-label selection rule is unbiased and total.
        - Missing source slopes and nonpositive null medians reach typed null branches without redraw or division.
        - All retained member, bundle, observed-spectrum and null-spectrum counts recompute.
      breaking_artifacts:
        - id: FRESH2-184-1
          kind: incomplete_cell_and_certificate_hash_domains
          fields:
            - protocol_amendment.effective_contract.deterministic_curve_generation.primary_algorithm
            - protocol_amendment.effective_contract.deterministic_curve_generation.certificates
            - protocol_amendment.effective_contract.permutation_null_and_inference.stream
          worked_attack: >-
            The primary curve tag is quoted as the exact text
            EXP-ECDLP-184fc4|primary|bits|stratum|replicate and the null tag is
            quoted analogously. Reading those words literally makes all strata
            and replicates at a fixed bit size reuse the same curve stream and
            makes null streams share a base domain, contradicting the declared
            domain separation and cross-cell independence. Reading the words as
            placeholders instead still leaves the substituted field syntax,
            decimal representation and delimiters unspecified; implementations
            can use 12|A|20260905, bits=12|stratum=A|replicate=20260905, or the
            literal words. The certificate clause then asks for min(1000,N)
            distinct indices from a domain-separated stream but supplies no
            domain, counter-to-index rule, rejection rule or duplicate handling.
            These choices affect curves, null assignments and blocking
            certificates, so they cannot be delegated to an implementation.
          correction_required: >-
            Freeze exact actual-value construction for every primary, control
            and null cell tag, including canonical unsigned decimals and
            delimiters. Freeze the certificate index domain, digest endianness,
            unbiased range mapping, counter progression, uniqueness/duplicate
            behavior and bounded exhaustion. Retain the repaired bootstrap
            schedule unchanged unless a new additive amendment says otherwise.
      unresolved_definitions:
        - exact curve-cell tag serialization across bit, stratum and replicate
        - exact null-cell/r tag serialization and claimed cross-cell separation
        - exact distinct log-certificate index schedule
      remaining_implementation_prerequisites:
        - correct and independently review the three hash domains above
        - bind exact curve, FFT, runner and dependency bytes after the protocol correction
        - materialize the frozen member and cell manifests
        - provide the declared Linux cgroup-v2 guard or take the specified failed_infrastructure branch
        - obtain a committed Coordinator decision; this report supplies no approval

    - experiment_id: EXP-ECDLP-1e6502
      contract_sha256: eaadf05c467b87de8ad3c1ebdbfef6de5dcdfb9b741f322f5f6cdfb2951de066
      verdict: NEEDS_CORRECTION
      exact_tested_scope: >-
        The complete second-corrected successor, compared with its original,
        first amendment, immediate predecessor, archived validator report and
        archived independent base-p digit derivation. Fixed checks covered the
        102/136 member sets, 8568/548352 spectrum counts, complete ordered-pair
        domain, rejection boundaries, SC1/SC2/precision sharing, anomalous
        separation and the fixed SC5 refusal fixture. Curve, null and log-index
        domains were then audited as machine-readable YAML.
      checks_that_hold:
        - The bits-10 schedule exhausts every ordered pair, including O, equal and inverse pairs.
        - Larger rungs use two unbiased rejection-sampled indices with replacement, retain duplicates and produce exactly 10000 ordered pairs.
        - SC1 and SC2 share the ordinary pair order across precisions; anomalous Sigma uses a separately tagged schedule and reuses it across coefficient lifts.
        - SC5 names bits10/stratumA/replicate20260905 and has an explicit missing-bundle coverage branch.
        - Precision member counts and anomalous recovery targets recompute exactly.
      breaking_artifacts:
        - id: FRESH2-1E-1
          kind: incomplete_hash_domains_and_invalid_string_key
          fields:
            - protocol_amendment.effective_contract.deterministic_curve_generation.nonanomalous
            - protocol_amendment.effective_contract.deterministic_curve_generation.anomalous
            - protocol_amendment.effective_contract.deterministic_curve_generation.log_domain
            - protocol_amendment.effective_contract.spectral_null_and_delta_thresholds.<YAML-null-key>
            - protocol_amendment.effective_contract.blocking_pair_schedules.larger_rungs
          worked_attack: >-
            The ordinary, anomalous and permutation-null cell tags quote the
            words bits, stratum, replicate, precision and r without defining an
            actual-value serialization. Literal use collapses strata and
            replicates; placeholder use admits multiple byte strings. The
            otherwise complete pair schedule inherits this ambiguous curve tag,
            so its pair-control-v3 suffix cannot identify one unique bundle.
            The log-domain certificate also requests domain-separated indices
            without an index domain or counter/range/duplicate rule. In
            addition, the section is spelled as bare YAML null:, which a strict
            YAML loader resolves to a null scalar key, not the string key
            "null"; this caused the recorded checker attempt to fail before the
            checker was corrected to inspect the null-scalar key. A JSON/YAML
            implementation expecting a named null section and one treating it
            as a null key therefore see different schemas.
          correction_required: >-
            Define canonical actual-value ordinary, anomalous and null cell
            tags; make the pair schedule inherit those exact strings; freeze
            the distinct log-certificate index schedule; and quote or rename
            the null section key so it is an ordinary stable string identifier.
      unresolved_definitions:
        - exact ordinary/anomalous/null cell-tag byte serialization
        - exact log-certificate index stream
        - stable string key for the spectral null definition
      remaining_implementation_prerequisites:
        - correct and independently parse-review the identified domains and YAML key
        - independently review the ring, chart, torsion-section and formal-translation implementation
        - bind the sibling spectral contract by exact hash or restate it locally after correction
        - materialize and hash the digit-library and cell manifests
        - provide the declared Linux cgroup-v2 guard before scientific allocation
        - obtain a committed Coordinator decision; this report supplies no approval

    - experiment_id: EXP-ECDLP-2c3d20
      contract_sha256: fbc0f0c3da7da1db226ac63df28b9b16a9cbd88af6a60f9ddc52789ae355be1b
      verdict: NEEDS_CORRECTION
      exact_tested_scope: >-
        The complete second-corrected successor, compared with the original
        preregistration, first amendment, immediate predecessor and archived
        reviews. Fixed checks covered all seven typed totals, the complete
        16-key statistic inventory, six candidate directions, positive finite
        null-dispersion gating, exact top-rung/stratum/replicate/r/depth/word
        identity and the effect of making slopes descriptive-only.
      checks_that_hold:
        - The 16 statistic keys and six candidate-eligible scalar directions are explicit.
        - A zero-dispersion null, even with observed separation, cannot satisfy the finite standardized-effect predicate.
        - Candidacy fixes both top rungs, both strata, the same at least two replicate labels, r, partition/depth and the literal itinerary word where applicable.
        - Cost, conditioning and slope fields remain reported rather than discarded; unmatched or missing cells have typed branches.
        - Map, matrix and slope-trajectory totals are typed integers and recompute.
      breaking_artifacts:
        - id: FRESH2-2C-1
          kind: preregistered_primary_slope_falsifier_suppressed
          fields:
            - experiments/EXP-ECDLP-2c3d20/specification.yaml:metrics.primary
            - experiments/EXP-ECDLP-2c3d20/specification.yaml:falsification_criterion
            - protocol_amendment.null_inference_and_decisions.statistic_inventory.sigma_center_slope
            - protocol_amendment.null_inference_and_decisions.review_candidate
            - protocol_amendment.slopes.inference
          worked_attack: >-
            Let x_b=ln(N_b) over the seven frozen rungs. For one fixed
            stratum/replicate/r/partition set the true log-sigma trajectory to
            y_b=0. Define the 64 matched null trajectories analytically by
            slopes g_u=-0.49-0.02*u/63 and intercepts a_u=-g_u*x_24. At rung 24
            every null equals the true value, giving ties and zero dispersion;
            at rung 22 every null is above the true value, so an upper-tail
            sigma_center candidate also fails there. Thus no eligible top-rung
            sigma_center cell triggers. The true slope is 0 while all 64 null
            slopes lie from -0.49 to -0.51, giving upper rank 1/65, positive
            finite slope dispersion and an effect far above two. Repeating this
            fixed construction for both strata and the same two replicate labels
            meets the original explicit falsifier: lambda_2 slope above -0.25
            while the null decays. Yet sigma_center_slope is
            candidate_eligible:false, so the successor cannot trigger review on
            that primary preregistered observable. This is an analytic fixed
            counterexample to the decision map; no null panel was run.
          interpretation: >-
            Keeping conditioning costs descriptive is consistent with the
            original specification, where modeled localized cost was secondary.
            Keeping sigma_center_slope descriptive-only is not sufficient to
            decide the original question because the original named that slope
            as primary and gave it its own falsification threshold. The current
            choice suppresses a plausible replicated observable without a
            replacement decision or explicit scoped amendment of the question.
          correction_required: >-
            Either make sigma_center_slope candidate-eligible under a complete
            trajectory-level rank/effect/replication rule, or additively amend
            the original objective and falsifier with a technical rationale and
            a concrete successor test. Do not allow the six top-rung scalar keys
            to stand in for a slope whose anomaly can occur while those keys fail.
      unresolved_definitions:
        - how the original primary sigma/lambda slope can trigger independent review
        - whether the contract still claims to decide original claim 1 if that slope remains descriptive-only
      remaining_implementation_prerequisites:
        - correct the slope decision boundary before implementation admission
        - bind exact rho/map/stationarity/SVD source bytes and independent fixtures
        - materialize and hash the complete cell/statistic manifest
        - provide the declared Linux cgroup-v2 guard or take the failed_infrastructure branch
        - obtain a committed Coordinator decision; this report supplies no approval

    - experiment_id: EXP-ECDLP-709063
      contract_sha256: 9e51ed803d84824cb803a3414b643cd01d3624aca0e3ac84575a8888304c5629
      verdict: NEEDS_CORRECTION
      exact_tested_scope: >-
        The complete second-corrected successor, compared with its original,
        first amendment, immediate predecessor, source-bound rho helper and
        archived reports. Fixed checks covered logical/hash/physical encoding
        domains, O states, detached canonical-manifest custody, left-to-right
        scalar results and calls for k=-1,0,1,2,13,31 in an abstract additive
        group, supplied-replacement syntax, a fixed BSGS charge example,
        capacities/row totals and all-negative/nonmonotonic tested-grid labels.
      checks_that_hold:
        - Logical packed-BII, hash preimage and physical packed-IIII encodings are separate and give O unambiguous roles.
        - Canonical JSON plus LF and the detached 64-lowercase-hex-plus-LF sidecar avoid any in-file self-hash requirement.
        - The supplied left-to-right replacement parses, rejects negative k, returns identity with zero calls for k=0, and matches kP and s(k) on every fixed abstract input.
        - For N=101,E=7,k=37, the stated formula gives ell=5 and B_full_actual=22; setup, solver, restart and certificate components remain separately named.
        - All-negative data receives only ALL_TESTED_RUNGS_BSGS_LOWER, while -,+,-,+ data is NONMONOTONE_OR_INCONCLUSIVE.
        - Physical capacities, 368 algorithm rows and 8 representation-control records recompute.
      breaking_artifacts:
        - id: FRESH2-709-1
          kind: contradictory_unmeasured_bound_semantics
          fields:
            - protocol_amendment.objective
            - protocol_amendment.metrics_and_decisions.measured_crossover
            - protocol_amendment.metrics_and_decisions.no_interpolation
            - protocol_amendment.proof_search_map.method_ceiling
            - protocol_amendment.frontier.sota_delta
            - protocol_amendment.required_artifacts_for_future_execution.arm-b-crossover.json
          worked_attack: >-
            For fixed tested signs (-,-,-,-), measured_crossover requires
            ALL_TESTED_RUNGS_BSGS_LOWER and explicitly says this asserts only
            the tested grid, with no bound on an unmeasured crossover bit size.
            no_interpolation likewise forbids a lower or upper bound beyond the
            tested grid. The objective nevertheless promises an explicit
            directional bound; the method ceiling says a directional bound is
            available; the frontier calls the output a bracket/bound; and the
            required arm-b artifact requests brackets/bounds. One implementation
            can emit only the tested-grid label while another can revive the
            predecessor's crossover_bits>28 claim, and each can cite a different
            live field. The nonmonotonic branch itself is total and does not make
            a between-rung inference; the conflict is the retained bound language.
          correction_required: >-
            Replace every remaining directional-bound, bracket/bound and
            brackets/bounds phrase with the exact tested-grid label vocabulary,
            while retaining the adjacent tested-rung sign-change bracket where
            its monotonic sign pattern is actually observed. Make the artifact
            schema prohibit crossover_bits< or > endpoint claims outside the grid.
      unresolved_definitions:
        - whether all-same-sign output is only a tested-grid label or an unmeasured endpoint bound
      remaining_implementation_prerequisites:
        - reconcile all output and claim-boundary prose with the detailed tested-grid rule
        - materialize and independently review the shared-instance manifest
        - additively bind EXP-ECDLP-4320a7 to that manifest before either sibling runs
        - implement and independently review golden representation, overflow, lookup and component-sum fixtures
        - bind both the base rho source and the corrected scalar-source hash
        - obtain a committed Coordinator decision; this report supplies no approval

  cross_contract_observations:
