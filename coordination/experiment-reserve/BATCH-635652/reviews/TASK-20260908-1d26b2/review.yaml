        scalar. Nineteen cases had completed and the twentieth attempt failed.
        The checker was changed only within its owned path to assert this exact
        source behavior, then rerun once. Both invocations are fully charged in
        the receipt; no scientific command was involved.
      effect_on_review: >-
        The failure strengthened FRESH2-1E-1 and did not alter any source
        contract, input, threshold, result or review scope.

