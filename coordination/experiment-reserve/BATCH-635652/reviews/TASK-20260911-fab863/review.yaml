          close_error:
            message: native optional close uncertainty
            type: OSError
          disposition: unknown
          fd: 501
          path: memory.peak
        detail: 'close_owned_descriptor: OSError:native optional close uncertainty'
        error:
          message: native optional close uncertainty
          type: OSError
      code: cgroup_read_too_large
      detail: memory.peak
      message: 'cgroup_read_too_large: memory.peak'
      operation_observations:
        action: read_text
        decoded_complete: false
        descriptor:
          close_error:
            message: native optional close uncertainty
            type: OSError
          disposition: unknown
          fd: 501
          path: memory.peak
        received_base64: MTIz
        received_bytes: 3
      type: GuardError
    supervisor_status: inner_complete
    supervisor_cleanup_complete: true
    host_status: complete
  control_boundary: The injected native read returned three bytes and MAX_EVENT_BYTES was set to two for
    this branch control; the production limit is 1 MiB. The exact production DescriptorCgroupTransport.read_text,
    exception carrier, GroupOomSupervisor and serializer/host consumers were exercised. This establishes
    exception propagation failure, not occurrence on a live cgroup.
  correction_boundary: Optional metric unavailability must retain the original error and any descriptor
    uncertainty, and uncertainty must prevent complete cleanup through the actual outcome/host path.
