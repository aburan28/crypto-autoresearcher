        pinned base suffix. In-memory one-byte mutations outside the span and a
        wrong scalar predicate inside the span both failed conformance. The
        isolated actual body returned O at zero, rejected negative scalars and
        matched independent values/call counts for 1,2,13,31. No rho solve ran.

  breaking_artifacts:
    - id: DECODER-TYPE-1
      kind: bytes_constructor_scalar_alias_across_all_public_decoders
      affected_source:
        path: experiments/EXP-ECDLP-709063/implementation/TASK-20260908-7771f2/table.py
        sha256: 078256c8abd57dc2442f89bc8e889838314c314358fad9f2a7a6621ead529705
        lines:
