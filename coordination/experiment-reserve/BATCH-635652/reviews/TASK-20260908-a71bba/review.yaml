      worked_counterexamples:
        - >-
          decode_logical_point(9) executes bytes(9), obtains nine zero bytes and
          returns LogicalPoint(tag=0,x=0,y=0), although 9 is outside the
          declared bytes/bytearray/memoryview input domain.
        - >-
          decode_hash_preimage(True) executes bytes(True), obtains the single
          zero byte and returns logical O, so a bool is accepted across the
          hash-preimage boundary.
        - >-
          decode_physical_slot(16) executes bytes(16), obtains sixteen zero
          bytes and returns a physical empty slot, although the caller supplied
          an integer rather than physical bytes.
      failure_signature: >-
        Three invalid representations crossed an explicit decoder boundary and
        were accepted as canonical O/empty encodings. This is exactly a
        proves-too-much failure for the component conformance claim.
      scope: >-
        The defect is in the public decoder API. Internal table reads currently
        pass memoryview slices, so these counterexamples do not show an
        incorrect BSGS solution or a scientific result.
      correction_required: >-
        Add an explicit runtime bytes-like type check before bytes(raw) in all
        three decoders, retain the exact malformed-scalar controls, snapshot a
        prospective corrected source package and commission a fresh independent
        component review. This report does not edit or approve that correction.

