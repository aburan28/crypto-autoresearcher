  control_checks:
    - control: logical_hash_and_physical_encoding_domains
      result: BREAKS
      detail: >-
        Valid O/affine/empty golden bytes and round trips hold; malformed byte
        lengths, reserved tags/states, noncanonical O/empty fields, bool-valued
        record fields and uint28 bounds reject. The public decoder input type
        boundary does not hold: integer and bool arguments are converted into
        zero-filled bytes and accepted as canonical values. See DECODER-TYPE-1.
    - control: fixed_physical_table_enforcement
      result: PASS
      detail: >-
        Zero-slot refusal, exact positive capacities, natural forced collisions,
        duplicate/conflicting exponents below capacity, table-full priority,
        no-write cancellation/refusal, offset bounds, retained lookup, one
        caller buffer and absence of a persistent secondary index all held.
    - control: stale_external_buffer_mutation
      result: PASS_WITH_BOUNDARY
      detail: >-
        A live memoryview blocks caller resize; a same-length reserved-state
        overwrite is rejected when read. A caller can still replace a populated
        slot with canonical zero bytes, after which occupied remains stale and
        lookup returns NOT_FOUND. The frozen contract does not require
        tamper-detection for a caller-owned buffer, so this is an integration
        ownership prerequisite rather than a second source break.
    - control: unbounded_arma_armb_and_certificates
      result: PASS_WITHIN_FIXED_SYNTHETIC_SCOPE
      detail: >-
        Fixed complete groups covered M>N/2, M=min(E,N), M=N, capacity equality
        and refusal, O, k=0/1, last giant blocks and full exhaustion. Bad baby
        aliases stopped completed-invalid; a deliberately false lookup hit was
        rejected by the public equation certificate; the last unsuccessful
        lookup performed no extra giant addition.
    - control: public_input_only_and_cancellation
      result: PASS
      detail: >-
        Solver signatures expose no k/secret/oracle argument. Curve secret and
        known_scalar properties raise if accessed and were never read. Hooks
        cancelled before baby, scalar, giant, certificate and table work; no
        later operation occurred and every completed partial counter remained.
    - control: rho_scalar_derivative
