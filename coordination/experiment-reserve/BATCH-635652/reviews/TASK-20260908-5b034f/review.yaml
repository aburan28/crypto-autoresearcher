  per_experiment_owned_joint_verdicts:
    - experiment_id: EXP-ECDLP-184fc4
      verdict: NEEDS_CORRECTION
      exact_tested_scope: >-
        The complete corrected contract at SHA-256
        8f809f31b1405def910bb5bb16f74304547ed168dcf037039863b3ed3a115082,
        compared with its bound original, predecessor, archived validator
        report and archived digit re-derivation. Fixed checks covered counts,
        64-value quantiles/ties, undefined ratios and the slope-bootstrap key.
      checks_that_hold:
        - The 567-member and 42-bundle arithmetic is exact.
        - The median, x_(2)/x_(63), equality-against-separation and undefined-ratio rules are total.
        - The common-permutation joint-null assumption and 1/65 rank scope are explicit.
        - Stage memory lifetimes forbid a resident null tensor and state a complete unavailable/OOM branch.
      breaking_artifacts:
        - id: FRESH-184-1
          kind: ambiguous_rng_schedule
          field: protocol_amendment.effective_contract.slope_definitions.interval
          worked_attack: >-
            The only quoted bootstrap domain is the literal
            EXP-ECDLP-184fc4|slope-bootstrap|member. It contains neither
            stratum nor full-versus-terminal statistic identity, and the field
            gives no counter-to-draw map or sharing rule. Restarting a hash
            stream for strata A and B gives identical replicate triples;
            consuming one shared stream sequentially gives different triples
            whose assignment depends on traversal order. Both satisfy the
            current prose, although it says the strata are resampled
            independently. The same ambiguity applies to whether full and
            terminal slopes intentionally share triples.
          correction_required: >-
            Freeze a canonical member identifier, stratum, statistic or named
            sharing group, draw and slot indices, unbiased digest-to-label
            mapping, counter rejection rule, and every intentional shared
            resample. Preserve the 10,000 count.
      remaining_implementation_prerequisites:
        - bind exact curve, FFT and runner source bytes and dependency versions
        - materialize the frozen library and deterministic cell manifest
        - provide a Linux cgroup-v2 execution host or take the declared failed_infrastructure branch
        - independent implementation conformance review after the contract correction

    - experiment_id: EXP-ECDLP-0c717c
      verdict: PASS
      exact_tested_scope: >-
        The complete corrected contract at SHA-256
        cf1d0de832648dedc55bf75795bdab983877393ad10a24d8204102e9a4971904,
        compared with its bound original, predecessor and archived reviews.
        Fixed checks covered exact cells, finite-null indices, L=0 and
        zero-median branches, all 16 bootstrap analysis keys and intentional
        shared outputs.
      worked_attack_and_result: >-
        Enumerating every gamma, base-family, envelope and stratum key produced
        16 distinct byte strings. The residue log_p and log_m_residue outputs
        alone share their triple by declaration. R=32 and R=8 order statistics
        evaluate to (1,32) and (1,8); an L=0 or nonpositive null median reaches
        a typed null branch rather than division. No contradictory or missing
        finite definition was found in the declared source set.
      scope_of_pass: >-
        PASS means definition-complete and internally consistent for this owned
        prospective-contract joint only. It is not implementation readiness,
        approval, a control result, or scientific admission.
      remaining_implementation_prerequisites:
        - bind exact arithmetic, root, FFT and runner bytes and dependency versions
        - materialize and hash curves, bases and the full cell manifest
        - run independent arithmetic/FFT implementation fixtures under a later authorized executor task
        - provide a Linux cgroup-v2 execution host or retain the declared failed_infrastructure outcome
        - obtain a committed Coordinator approval after archival of this review

    - experiment_id: EXP-ECDLP-1e6502
      verdict: NEEDS_CORRECTION
      exact_tested_scope: >-
        The complete corrected contract at SHA-256
        781a6bc619f4716fafa5a36f848eed8ebae1e2edef661f34ac779b1bc5c0aa77,
        compared with its bound original, predecessor, archived validator
        report and archived blind digit derivation. Fixed checks covered the
        p=5,C=32 digit witness, precision-2/3 Teichmuller compatibility, SC4
        zero/one/many-eligible branches and every remaining pair-selection
        phrase.
      checks_that_hold:
        - digit_j(C)=floor(C/p^j) mod p reconstructs C=32 as (2,1,1), while the predecessor exact quotient is nonintegral.
        - T_2(2)=7 and T_3(2)=57 at p=5 satisfy the fixed-point and reduction identities.
        - SC4 has explicit m=0, m=1, coprime-cycle, retained-duplicate and 10,000-position behavior.
        - Precision-specific member and null counts recompute exactly.
      breaking_artifacts:
        - id: FRESH-1E-1
          kind: missing_deterministic_pair_schedule
          fields:
            - protocol_amendment.effective_contract.five_blocking_self_checks.SC1_torsion_homomorphism.exact_test
            - protocol_amendment.effective_contract.five_blocking_self_checks.SC2_naive_defect_nonadditivity.exact_test
            - protocol_amendment.effective_contract.anomalous_sigma_algorithm.functional
          worked_attack: >-
            SC1 says only 10,000 SHA256-selected ordered pairs at every larger
            ordinary bundle. It supplies no hash domain, point-index
            serialization, with-replacement or duplicate rule, or exhaustion
            behavior; SC2 inherits this undefined set. The anomalous functional
            separately requests 10,000 deterministic pairs at larger anomalous
            sizes without saying that it shares an ordinary schedule or giving
            its own. Two implementations can select different pairs while
            satisfying the same counts, so exact self-check outcomes are not
            source reproducible.
          correction_required: >-
            Freeze ordinary and anomalous pair domains, canonical index tuples,
            digest rejection or cycling rules, duplicate/exhaustion behavior,
            and the intended SC1/SC2 sharing. Also name the exact non-anomalous
            bundle used by SC5's refusal control.
      remaining_implementation_prerequisites:
        - independently review the ring, chart, torsion-section and formal-translation implementation
        - bind the corrected sibling spectral definitions or restate them locally with an exact hash
        - materialize the digit-library and cell manifests
        - provide the declared Linux cgroup-v2 guard before scientific allocation
        - obtain committed Coordinator approval after correction and archive

    - experiment_id: EXP-ECDLP-2c3d20
      verdict: NEEDS_CORRECTION
      exact_tested_scope: >-
        The complete corrected contract at SHA-256
        8e3eac2752ee58a97a8dfb5701b457189ef5e83f7401e3fc77a11088f1f60084,
        compared with its bound original, predecessor and archived reviews.
        Fixed checks covered typed counts, the one-map memory lifetime, missing
        64-way class matches, zero-dispersion states, full-order sampler caps
        and the decision-tail map.
      checks_that_hold:
        - A no-size-match replicate now makes every class-inference quantity null with incomplete_64_match_coverage.
        - All map, matrix and slope count fields are typed integers.
        - Streaming expressly forbids the 260 resident-map/label allocation.
        - The explicit 20,000-by-4,096 full-order sampler and divisor checks certify order 2q or a typed coverage failure.
      breaking_artifacts:
        - id: FRESH-2C-1
          kind: missing_decision_direction_map
          fields:
            - protocol_amendment.null_inference_and_decisions.ranks
            - protocol_amendment.null_inference_and_decisions.review_candidate
            - protocol_amendment.itinerary_statistics.aggregates
            - protocol_amendment.stationary_weighted_lumped_operator.definition
          worked_attack: >-
            The rank field defines both tails and repeatedly says to use a
            predeclared direction, but no field assigns sigma_center, arc
            summaries, class-spectrum maxima, costs or slopes to upper or lower
            tails, nor identifies exactly which statistic keys are candidate
            eligible. For a true value above all 64 nulls, p_upper=1/65 while
            p_lower=1; reversing the undeclared direction reverses candidacy.
          correction_required: >-
            Freeze a complete statistic-key inventory with its one-sided
            direction, class/map scope, depth and partition identity, and state
            which keys may trigger the replicated candidate rule.
        - id: FRESH-2C-2
          kind: proves_too_much_zero_scale_branch
          field: protocol_amendment.itinerary_statistics.class_spectrum
          worked_attack: >-
            With all 64 matched null maxima equal to 5 and X_true=6, the sample
            scale is zero, the numeric standardized effect is null, the upper
            rank is 1/65, yet the contract declares the absolute effect
            threshold true through categorical positive_infinity. This makes an
            undefined standardized quantity candidate eligible, contrary to
            the review plan's zero-dispersion failure signature. The category
            is explicit rather than silently serialized as IEEE infinity, but
            it still substitutes for the required finite effect predicate.
          correction_required: >-
            Either require positive finite scale for the standardized-effect
            threshold, or define a separately named zero-dispersion separation
            branch with its own candidate rule and interpretation. Do not call
            a null numeric effect an absolute standardized effect at least two.
      remaining_implementation_prerequisites:
        - bind exact toycurve and rho blobs in the eventual execution contract
        - implement independent functional-graph, rational-stationarity and SVD fixtures
        - materialize the fixture-dependent itinerary row count and complete statistic manifest
        - provide the declared Linux cgroup-v2 guard
        - obtain committed Coordinator approval after correction and archive

    - experiment_id: EXP-ECDLP-709063
      verdict: NEEDS_CORRECTION
      exact_tested_scope: >-
        The complete corrected contract at SHA-256
        ef7aef756ad767da64ece62437458da633283bc96947b547d691d9abd014fd09,
        compared with its bound original, predecessor, archived reviews and
        exact harness/rho.py and harness/toycurve.py bytes. Fixed checks covered
        capacities, typed rows, the exact rho cap/restart count, BSGS actual and
        expected charges, physical encodings and the source scalar loop.
      checks_that_hold:
        - I_max(N)=max(2000,200*floor_sqrt(N)+200) matches the bound source default at the declared toy orders.
        - All 16 stream rows and unsuccessful outcomes are retained; fewer than 12 certified successes censors the comparison.
        - E-1 baby additions, s(E), actual giant index, s(k_hat), exact rational expected giants and partial-proxy bias terms are defined correctly.
        - Capacity rows, TABLE_FULL probes and all algorithm/control counts recompute exactly.
      breaking_artifacts:
        - id: FRESH-709-1
          kind: incompatible_point_and_slot_encodings
          fields:
            - protocol_amendment.portable_fixed_physical_table.slot_layout
            - protocol_amendment.stage_accounting_and_memory_conformance.typed_encodings.point
            - protocol_amendment.stage_accounting_and_memory_conformance.typed_encodings.baby_table_key
          worked_attack: >-
            The physical slot is <IIII>, 16 bytes, with state 0 empty, state 1
            affine and state 2 O. The typed point is <BII>, 9 bytes, with O
            encoded as state byte 0; appending the stated uint32 value gives 13
            bytes and collides O with the physical empty state if used as a
            table key. The hash preimage is a third, big-endian 9-byte encoding.
            The contract does not label these as separate logical, hash and
            physical domains, so representation golden fixtures cannot know
            which baby_table_key definition is authoritative.
          correction_required: >-
            Name each encoding domain separately and make the physical baby
            slot exactly <IIII> with state 2 for O. If <BII> is retained for
            artifacts, prohibit it from table storage and state its conversion
            and hash-only role explicitly.
        - id: FRESH-709-2
          kind: source_bound_operation_convention_conflict
          fields:
            - protocol_amendment.charged_group_operation_convention.curve_wrapper
            - protocol_amendment.rho_baseline.implementation_source_binding
            - harness/rho.py:_count_mul
          worked_attack: >-
            The contract says every solver uses the pinned left-to-right binary
            scalar routine, whose declared cost for k=13 is
            bit_length-1+popcount-1=5. The bound rho source uses a right-to-left
            loop and unconditionally doubles addend once per bit; for k=13 it
            invokes E.add seven times. This two-call difference occurs for each
            positive scalar multiplication in table construction, restart
            initialization and certification. The exact source hash is also a
            launch gate, so an implementation cannot both call those bytes and
            satisfy the common-routine claim.
          correction_required: >-
            Either bind an additive rho implementation that actually uses the
            common routine, or declare and componentize the source's actual
            right-to-left calls while retaining group additions as the common
            cost unit. Any normalization must be explicit and must not be
            labeled measured source operations.
        - id: FRESH-709-3
          kind: impossible_in_file_self_hash
          field: protocol_amendment.shared_instance_set.canonical_instance
          worked_attack: >-
            The shared-instance manifest is required to list its own ordinary
            SHA-256. Changing that field changes the bytes being hashed, so the
            contract supplies no finite construction of the required value and
            conflicts with the repository archive rule against self-hashes.
          correction_required: >-
            Put the finalized manifest hash in a separate receipt or archive,
            or define a canonical payload digest that explicitly excludes the
            digest field. Every arm may then bind that external digest.
        - id: FRESH-709-4
          kind: unsupported_endpoint_crossover_bound
          field: protocol_amendment.metrics_and_decisions.measured_crossover
          worked_attack: >-
            Four negative sampled medians establish only that no nonnegative
            tested rung occurred through 28 bits. Without a monotonicity
            assumption between and beyond rungs, a sign can cross and reverse
            between sampled sizes while producing the same four rows. Calling
            the outcome the strict global bound crossover_bits>28 therefore
            exceeds the measured grid; the symmetric <=16 label has the same
            issue.
          correction_required: >-
            Report NO_NONNEGATIVE_TESTED_RUNG_THROUGH_28 or
            NO_NEGATIVE_TESTED_RUNG_FROM_16, or state and justify the exact
            monotonicity/transfer assumption under which the endpoint labels
            become bounds.
      remaining_implementation_prerequisites:
        - materialize and independently review the shared-instance manifest after resolving its hash binding
        - additively bind EXP-ECDLP-4320a7 to the external manifest digest before either sibling executes
        - expose per-restart source accounting without silently changing the bound rho bytes
        - implement golden physical-slot, overflow, lookup and component-sum fixtures
        - provide the declared Linux cgroup-v2 guard and obtain committed Coordinator approval after correction

