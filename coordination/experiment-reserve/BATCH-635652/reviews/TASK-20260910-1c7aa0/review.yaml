        - a replacement-identity primary refusal is hidden from the structured caller result when reopened-handle close also fails
        - generic exact-ID kill transport failure prevents the failed outcome and later cleanup from being returned
        - generic exact-ID remove transport failure prevents an otherwise complete outcome and exact removal uncertainty from being returned
  findings:
    - id: V-01
      severity: high
      verdict: breaks
      contract_refs: [F-06, IR-02]
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260910-89d2df/supervisor.py:919
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260910-89d2df/supervisor.py:920
      evidence_case: break_f06_open_child_fstat_failure_leaks_descriptor
      finding: >-
        DescriptorCgroupTransport._open_child opens the child directory FD and
        calls fstat without an exception cleanup. If fstat fails, the opened FD
        is neither returned nor closed. The fixed counterexample observed FD
        701 opened, an injected fstat OSError propagated, and no close call.
      implication: >-
        The partial-open path still lacks complete descriptor custody. The
        original mkdir rollback may remove the name while retaining an
        unreachable descriptor, so F-06 and IR-02's every-failure descriptor
        disposition do not conform.
      correction_boundary: >-
        Close the exact newly opened FD on every _open_child post-open failure,
        while preserving the original open/fstat error and any close error as
        separate facts. Exercise both create rollback and removal reopen paths.
    - id: V-02
      severity: high
      verdict: breaks
      contract_refs: [IR-02, IR-03]
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260910-89d2df/supervisor.py:975
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260910-89d2df/supervisor.py:977
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260910-89d2df/supervisor.py:988
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260910-89d2df/supervisor.py:989
      evidence_case: break_ir02_primary_removal_error_masked_by_close_error
      finding: >-
        remove_empty_child raises the identity refusal inside try and closes the
        reopened handle in an unguarded finally. If close also fails, the close
        OSError becomes the exception seen by GroupOomSupervisor._cleanup. The
        original cgroup_removal_identity_changed refusal survives only as Python
        exception context, which _cleanup does not serialize; it records only
        the close OSError string.
      implication: >-
        The substitute is not removed, so the safety refusal itself works, but
        the primary identity failure and secondary descriptor uncertainty do
        not survive as separate outcome facts. This violates the complete
        ownership and primary-secondary custody contract.
      correction_boundary: >-
        Retain the removal refusal as primary, record close failure separately,
        and mark descriptor disposition unavailable or failed. Add equivalent
        controls for population, boundary-stat and rmdir primary failures.
    - id: V-03
      severity: blocking_source_conformance
      verdict: breaks
      contract_refs: [IR-03, NF-01, F-09, F-10]
      source:
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260910-89d2df/host.py:541
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260910-89d2df/host.py:542
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260910-89d2df/host.py:558
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260910-89d2df/host.py:565
        - coordination/experiment-reserve/BATCH-635652/runtime/TASK-20260910-89d2df/host.py:568
      evidence_cases:
        - break_host_cleanup_kill_transport_exception_escapes_outcome
        - break_host_cleanup_rm_transport_exception_escapes_complete_outcome
      finding: >-
        DockerHostAdapter.run_case calls _run for exact-ID kill and rm directly
        inside finally. Unlike inspect and logs, neither call has a preserving
        exception boundary. A generic kill transport failure escaped after the
        original failed inner outcome, and a generic rm transport failure
        escaped after an otherwise complete inner and outer result. In both
        controls no HostOutcome was returned; ended_at_UTC and wall_seconds were
        never set, and later cleanup or exact-removal uncertainty was not
        available to the caller. _run had appended a pre-call command row, but
        the raised exception does not carry the outcome that owns that row.
      implication: >-
        Source custody is incomplete on precisely the exceptional outer cleanup
        paths that must retain the primary cause and exact containment facts.
        Unknown transport state is not evidence that kill or removal failed or
        succeeded, and the missing returned outcome cannot be reconstructed.
      correction_boundary: >-
        Catch exact-ID kill and rm transport exceptions inside run_case, retain
        their CommandTransportFailure observations or generic unknown-state
        facts in the HostOutcome, continue only the cleanup steps that remain
        safe, set terminal timestamps, and return a failed custody outcome.
        Independently cover launch, communication and cleanup exceptions for
        every cleanup command, including simultaneous original and cleanup
        failures.
