  per_experiment_owned_joint_verdicts:
    - experiment_id: EXP-ECDLP-184fc4
      contract_sha256: bd5e5c40f3870e54ca6f74df84a7523ca072d51affcc492f783615c8a7a5fa9f
      verdict: NEEDS_CORRECTION
      exact_tested_scope: >-
        The complete third successor compared with the immutable source, all
        three predecessor generations and all archived reviews. Fixed checks
        covered every new actual-value tag, suffix/range rule, sparse distinct
        certificate schedule, 567/42/1,524,096 counts, bootstrap sharing,
        finite ties, zero dispersion and undefined ratios. An abstract
        group-action object attacked the inferential status of a fixed
        permutation schedule.
      checks_that_hold:
        - Curve, control, bit, stratum, replicate and null-index domains serialize to distinct canonical byte strings.
        - Range rejection is unbiased conditional on uniform digest values and has an exhaustive typed 4096-cap failure branch.
        - Sparse partial Fisher-Yates produces exactly min(1000,N) distinct ordered indices or an explicit incomplete certificate.
        - Full/terminal bootstrap triples share only as declared; member and stratum domains remain separate.
        - Zero-dispersion and nonpositive-median cases cannot fabricate a finite effect or ratio.
      breaking_artifacts:
        - id: THIRD-184-1
          kind: missing_probability_model_for_fixed_sha_randomization_rank
          fields:
            - protocol_amendment.effective_contract.permutation_null_and_inference.stream
            - protocol_amendment.effective_contract.permutation_null_and_inference.joint_null_required
            - protocol_amendment.effective_contract.permutation_null_and_inference.global_statistic
            - protocol_amendment.effective_contract.canonical_hash_schedules.unbiased_bounded_draw
          worked_attack: >-
            The contract states that the observed assignment is uniform under
            its conditional joint null, but the 64 comparison permutations are
            one fixed SHA-256 schedule. Uniformity of the observed assignment
            gives identical marginals after any fixed permutation; it does not
            make identity plus an arbitrary fixed set exchangeable. On a fixed
            66-state orbit, take identity and shifts 1 through 64 and let the
            statistic decrease strictly around the orbit. A uniform base state
            then receives the nominal minimum rank 1/65 at two of 66 states, so
            Pr(rank=1/65)=1/33, greater than 1/65. This is an analytic abstract
            counterexample to the claimed sufficient premise, not an evaluation
            of the committed SHA outputs. The source nowhere declares SHA-256
            outputs to be independent uniform values, a PRF, or a random oracle.
          correction_required: >-
            Add the exact hash-sampler probability assumption and bind the
            65-way rank's calibration to both that assumption and the joint
            assignment null, or replace the fixed schedule with independently
            sampled recorded permutations under a complete randomness contract.
            If neither premise is asserted, retain the number as descriptive
            and do not call joint assignment exchangeability alone sufficient.
      unresolved_definitions:
        - whether the fixed SHA-256 stream is modeled as independent uniform randomness for permutation-test calibration
        - whether p_joint is inferential under two assumptions or only a deterministic descriptive rank
      remaining_implementation_prerequisites:
        - correct and independently review the randomization-rank premise
        - bind exact curve, FFT, runner and dependency bytes
        - materialize the frozen member and cell manifests
        - supply the specified Linux cgroup-v2 guard or take its failed_infrastructure branch
        - obtain a committed Coordinator decision; this report supplies no approval

    - experiment_id: EXP-ECDLP-1e6502
      contract_sha256: a2cf3b63c7d4cf373bdabd7f0cb21945ab527e842aa37278dcf8df0793d7f8a4
      verdict: NEEDS_CORRECTION
      exact_tested_scope: >-
        The complete third successor compared with the immutable source, all
        predecessor generations, the archived base-p derivation and every
        archived full-contract review. Checks covered actual ordinary,
        anomalous and precision-null tags; stable YAML keys; exact sibling
        path/hash/field resolution; 102/136/8,568/548,352/480 counts; full-group
        ordered pairs and all sharing/refusal/missing branches.
      checks_that_hold:
        - permutation_null is a stable string key and no YAML null-scalar key remains.
        - The sibling path and SHA-256 match, and both named field paths exist.
        - Ordered-pair controls include O, equal and inverse pairs; larger-rung duplicates are retained.
        - SC1/SC2 and precision sharing, anomalous separation and the fixed SC5 refusal fixture are explicit.
        - The local precision-two, precision-three, non-anomalous and anomalous counts recompute.
      breaking_artifacts:
        - id: THIRD-1E-1
          kind: overbroad_exact_sibling_field_binding
          fields:
            - protocol_amendment.effective_contract.spectral_null_and_delta_thresholds.sibling_definition_binding.fields
            - protocol_amendment.effective_contract.spectral_null_and_delta_thresholds.family_statistic
            - protocol_amendment.effective_contract.spectral_null_and_delta_thresholds.permutation_null
            - protocol_amendment.effective_contract.exact_cell_accounting
          worked_attack: >-
            The exact sibling binding names the whole
            effective_contract.permutation_null_and_inference mapping from
            EXP-ECDLP-184fc4. Those exact bound bytes say that one permutation
            is applied to all 567 members, assignments are independent across
            42 cells, and the global maximum spans all 42 cells. The local
            1e6502 contract instead has 102 members at precision two, 136 at
            precision three, 36 non-anomalous cells, and a precision field in
            every null tag. The prose scope says only shared centering and
            finite-null conventions are intended, but it does not identify
            which subfields of the exact whole-block binding survive. One
            implementation can import the bound 567/42 definitions while
            another can follow the local 102/136/36 definitions; both have a
            live field to cite.
          correction_required: >-
            Bind only the generic sibling subfields actually inherited, such
            as the exact spectrum identities and the explicit finite-null
            order-statistic/tie/zero-dispersion rules. Keep the 1e6502 member,
            cell, precision-tag, family-statistic and permutation stream local.
            Carry the corrected SHA probability premise from THIRD-184-1 into
            the local 1e6502 rank semantics rather than importing a
            family-specific sibling block.
      unresolved_definitions:
        - which exact sibling subfields are inherited and which local 1e6502 fields override them
        - whether the local 36-cell precision-specific rank inherits the missing fixed-SHA probability premise
      remaining_implementation_prerequisites:
        - narrow and independently parse-review the sibling field binding
        - independently review ring, chart, torsion-section and formal-translation implementation
        - materialize and hash digit-library and cell manifests
        - provide the declared Linux cgroup-v2 guard before scientific allocation
        - obtain a committed Coordinator decision; this report supplies no approval

    - experiment_id: EXP-ECDLP-2c3d20
      contract_sha256: b1d6d7b1f8627e59cb69321cf2d484010159b19b817f4c34458616501025c6b9
      verdict: NEEDS_CORRECTION
      exact_tested_scope: >-
        The complete third successor compared with the immutable
        preregistration, all predecessor generations and archived reviews.
        Checks covered the 16-key inventory, all typed counts, the restored
        all-seven-rung route, 64 matched null slopes, upper rank, finite effect,
        strict threshold, null decay, both-stratum/same-replicate identity,
        missing/zero-scale branches and separation from the top-rung scalar
        route. A fixed Hasse-compatible abstract ladder tested abscissa fidelity.
      checks_that_hold:
        - sigma_center_slope is candidate eligible and ORed with the unchanged six scalar routes.
        - The slope route does not inherit the scalar route's top-two-rung gate.
        - A flat true trajectory with 64 decaying null trajectories triggers even when the scalar top rung is tied and ineligible.
        - Zero dispersion, missing rungs, nondecaying nulls and true gamma equal to -1/4 cannot trigger.
        - Conditioning costs, modeled localized-search fields and itinerary slopes remain descriptive.
      breaking_artifacts:
        - id: THIRD-2C-1
          kind: original_slope_abscissa_changed
          fields:
            - experiments/EXP-ECDLP-2c3d20/specification.yaml:metrics.primary
            - experiments/EXP-ECDLP-2c3d20/specification.yaml:falsification_criterion
            - protocol_amendment.slopes.definition
            - protocol_amendment.null_inference_and_decisions.slope_review_candidate.identity
          worked_attack: >-
            The immutable specification preregisters the primary singular-value
            slope against log p and states the falsifier as lambda_2 slope above
            -0.25 with the null decaying. The successor fits against ln(N).
            These are asymptotically related on cofactor-one curves but are not
            the same finite statistic. On the fixed seven rungs b=12 through
            24, set p_b=2^b, N_b=p_b+2*sqrt(p_b), and
            y_b=-0.2499*ln(p_b). These abstract pairs satisfy the Hasse interval;
            no curve existence is claimed. The same y values give
            gamma_p=-0.249900000, which passes the strict original threshold,
            and gamma_N=-0.250711358, which fails it. Thus the abscissa choice
            can reverse candidacy exactly at the registered boundary. The
            correction authority explicitly required restoration of the
            original question, not an unrecorded replacement.
          correction_required: >-
            Fit the restored sigma_center slope against ln(p) on all seven
            rungs, and apply the identical ln(p) abscissa to every matched null
            trajectory. If ln(N) is desired as a second descriptive diagnostic,
            give it a separate key. Replacing the original primary abscissa
            instead requires an explicit additive scope amendment and technical
            rationale; it cannot be called preservation of the original question.
      unresolved_definitions:
        - whether the review-candidate route decides the registered log-p slope or a new log-N slope
      remaining_implementation_prerequisites:
        - restore the exact original abscissa before implementation admission
        - bind exact rho, map, stationarity and SVD source bytes and independent fixtures
        - materialize and hash the complete cell/statistic manifest
        - provide the declared Linux cgroup-v2 guard or take its failed_infrastructure branch
        - obtain a committed Coordinator decision; this report supplies no approval

    - experiment_id: EXP-ECDLP-709063
      contract_sha256: feff89ed66f21c66db21e6fd2525fd6a0e6727cc8382aae5ff05afe7c855093a
      verdict: PASS
      exact_tested_scope: >-
        The complete third successor compared with the immutable source, all
        predecessor generations, source-bound rho helper and all archived
        reviews. Fixed cases covered negative, zero, one and leading-one scalar
        words in an abstract additive group; supplied replacement syntax and
        behavior; logical/hash/physical bytes including O; detached digest
        custody; exact capacities and row counts; BSGS actual/expected charges;
        and every finite tested-grid sign/missing branch and artifact label.
      worked_attacks_and_results:
        - >-
          Independent left-to-right derivation in Z/101Z and execution of the
          supplied isolated replacement agree: k=0 returns O with 0 calls; k=1
          returns 7 with 0 calls; k=2 returns 14 with 1 call; k=13 returns 91
          with 5 calls; k=31 returns 15 with 8 calls; and k=-1 raises the exact
          protocol-domain error. This is mock group arithmetic, not rho or ECC.
        - >-
          For N=101,E=7,k=37, ell=5 and the declared fully charged formula gives
          22 group calls; the closed giant-index sum equals the direct fixed
          arithmetic sum over k=2 through 100.
        - >-
          All-negative and all-nonnegative signs produce only their named
          tested-grid labels; one monotone negative-to-nonnegative transition
          produces its adjacent rung pair; a reversal or missing rung is
          NONMONOTONE_OR_INCONCLUSIVE. Objective, method ceiling, frontier and
          arm-b artifact all use this vocabulary and explicitly prohibit an
          unmeasured endpoint field.
