    registered cases include one preserved checker failure, and production hashes are unchanged between attempts.
    This may resolve NF-01 through NF-05, but a full independent source review remains necessary. Highest remaining
    risks are mismatched production/consumer payload semantics, incomplete identity checks before mutations,
    cleanup failure paths, supervisor membership guarantees and self-consistent mock assumptions. No live guard
    or scientific admission is assumed.
  recorded_before_reviewers: true
  source_snapshot: 2b7ecb4ab3285174132eb37156676a6732952e95
  joints:
  - joint: complete_supervisor_source_confinement_ordering_and_custody
    assigned_to: TASK-20260909-6db6df
    attack_plan: Inspect the complete current supervisor.py,container.py,host.py,tests.py and metadata against
      the full frozen operational contract. Independently exercise the actual production serializer and host
      parser together,including clean and startup-failure envelopes,wrong/missing fields and false cleanup.
      Verify nonce/task/full-ID possession before copy/start and ownership-dependent cleanup,including unverified-identity
      refusal. Enforce cgroup-v2 no-internal-process semantics while tracing delegation disable,supervisor
      return,membership readback and owned-subgroup removal;failed or ignored disable must not permit a false
      clean return. Challenge initial and final supervisor membership separately from parent emptiness/liveness,
      preserve worker/auxiliary acknowledgements and counter deltas,and require stat/enumeration errors to
      fail closed. Recheck all five NF findings and all17earlier defects in the complete component,not just
      changed lines. Use fixed injected Docker/cgroup/syscall observations and bounded benign owned POSIX processes
      to inspect pipe/barrier/drain/wait/reap/descriptor behavior. Preserve the original capability profile
      and exact-container fallback. Independently audit both producer attempts,source copies,controller copies,full
      outer/nested custody,raw RSS sample basis and the single fixture error without reconstructing older251case/15start
      gaps. Inspect every metadata field for stale identities or unsupported runtime claims. Name residual
      caller/host/platform prerequisites precisely.
    breaking_artifact: Exact source line and independent fixed counterexample,unimplemented native path,or
      missing confinement/ordering/custody obligation.
  blindness:
    mutual: false
    lifted_for:
    - TASK-20260909-6db6df
    rationale: Fresh complete source-aware review. Bound historical reviews and producer records are visible;no
      parent conversation,unrelated image-audit report or concurrent reviewer output.
  proves_too_much:
    objects:
    - A correct suffix attached to the wrong parent/root path or a symlink component.
    - A changed inspected container identity or unexpected existing child cgroup.
    - Partial controller writes or a profile asserted without readback.
    - A worker released before migration or retaining writable descriptors/capabilities.
    - A group0 or wrong-memory worker that still reaches allocation.
    - An OOM-looking signal without required group counters or supervisor separation.
    - Cleanup/transcript failures that erase the primary cause or leave a falsely complete outcome.
    - A production v2 envelope rejected while a fabricated v1 fixture passes.
    - A missing/mismatched nonce that still permits payload copy or cleanup mutation.
    - A parent made nonempty while domain memory delegation remains enabled.
    - A supervisor missing from its subgroup while only parent emptiness/liveness passes.
    - A foreign child hidden by stat PermissionError or a disappearing-entry error.
    failure_signature: Known-invalid identities,unsafe writes,early worker release,missing observations or
      manual kills must not pass the claimed operational classification.
    assigned_to: TASK-20260909-6db6df
  blind_rederivation:
    required: false
    quantity: No mathematical quantity or cryptanalytic claim.
    parameters: Fixed operational interface and mocked observations.
    blind_from: []
    assigned_to: TASK-20260909-6db6df
    not_repeated_reason: Source/operational design review only; no new mathematical result.
  scope_limit: Complete source conformance only. No live Docker,cgroup,mount,privilege,migration,pressure,8GiB
