design:
  experiment_id: EXP-ECDLP-0c717c
  status: prospective_complete_pending_approval
  approved_by: null
  source_binding: {path: experiments/EXP-ECDLP-0c717c/specification.yaml, sha256: 949b447b57e2d652e1d021e8f19c8bb3f6f4b29c4f90fd8c86aef4ae3667b6c2}
  preserves_mechanism: additive and quadratic Fourier envelopes of factor-base sumset x-histograms against size-matched random bases and an index-two-subgroup control.
  scope: {claim_tier: toy, field_bits: [12,16,20,24], curve_families: [A,B], replicates: [20260905,20260906,20260907], gammas: [1/3,1/2], primary_base_families: [interval,residue]}
  definitions:
    subgroup: "Primary G=<P> has odd prime order N. For a control E(F_p) cyclic of order 2q with rational (e,0), define chi(W)=Legendre(x(W)-e) for W neither O nor (e,0), chi(O)=1, chi((e,0))=-1. Use F_plus={W:chi(W)=1}; accept it only after exhaustive chi(U+V)=chi(U)chi(V) and |F_plus|=q. No assertion about x=e or a zero Legendre value substitutes for this test."
    base_size: "Set target m=floor(p^gamma), m>=2. For interval choose all non-O points with x<floor(p*m/N); for residue set M=2^ceil(log2(N/m)) and choose all non-O points with x mod M<floor(M*m/N). These predicates use only affine coordinates, never log labels. Record m_actual separately for each base and sample null subsets at that exact m_actual; no truncation to m is permitted."
    pairs: "Enumerate unordered index pairs i<j from the base's canonical lexicographic (x,y) order, not DL order. Exclude only P_i+P_j=O or x undefined; P_i=-P_j is exactly the O exclusion. Record candidate_count=m_actual(m_actual-1)/2, excluded_count, accepted_count L. If L=0, record S_add/S_quad/ratios as undefined and the cell attempted_and_inconclusive."
    histogram: "H_F[t]=#{i<j accepted:x(P_i+P_j)=t}. Check sum_t H_F[t]=L exactly. Define Hhat[a]=sum_t H_F[t] exp(2*pi*i*a*t/p); S_add=max_{a=1..p-1}|Hhat[a]|/L. Define S_quad=max_{c in F_p}|sum_t H_F[t]Legendre(t-c)|/L, with Legendre(0)=0."
    null: "For each primary base, sample without replacement 32 bases of its recorded m_actual using seed SHA256('EXP-ECDLP-0c717c|null|'+cell+'|r), r=0..31; at 24 bits use r=0..7 as frozen in the source. The same pair/exclusion rule applies. If the null median is zero, ratios are undefined and raw envelopes/quantiles are reported."
    slope: "For each base family and gamma, regress log(envelope) on log(p) separately within each seed stratum over its four field sizes; zero envelope makes the slope undefined. Report the three slopes and their median; do not pool strata or impute zero logs."
  cells:
    primary_curve_bundles: 24
    primary_base_cells: 96
    null_base_cells: 2496
    control_bundles: 24
    run_definition: "one (bits,family,replicate) artifact includes both gammas, both coordinate-defined bases, all declared nulls, and paired order-2q control; 24 artifacts remain within source maximum_runs=48."
  controls: ["sum H=L exact at a=0", matched-null distribution, second curve seed/family, exhaustive subgroup homomorphism and membership control]
  metrics: [S_add,S_quad,accepted_count,excluded_count,argmax_add,argmax_quad,ratio_to_null_median,bootstrap_slope,null_quantiles,RSS_peak,array_bytes]
  decisions:
    positive: "The 32-null (8-null at 24 bits) distributions are descriptive and are never assigned an unattainable fine-grained p value. A review candidate requires ratio>4, slope greater than zero, and the same direction on both largest sizes in both curve families with nonzero L and matching null-size convention."
    negative: "Within-null envelopes report a scoped toy result only."
    inconclusive: "a=0, histogram-mass, or subgroup control failure voids affected arm; infrastructure outcomes are non-scientific."
  costs: {time: "O(m^2) additions per base plus length-p transforms", memory: "length-p integer histogram and transform workspace; record both bytes and RSS", cap_gb: 8, workers: 1}
  proof_search_map: {applicability: empirical diagnostic, baseline_embedding: matched random m-subsets, observation_collision: "pair-count changes can mimic envelopes and are separated by L/excluded counts", quantifier_order: "for each declared base/cell", method_ceiling: "toy envelope observation only", nearby_object_control: index-two subgroup}
  citations: [{ref: H-ECDLP-5b245d, provenance: internal, claim: preserved source hypothesis, verified_by: TASK-20260907-9c3566}]
  frontier: {dominated_by: unknown, sota_delta: "Unknown from supplied materials; no solver or asymptotic improvement is claimed.", novelty_status: unverified}
  required_artifacts: [stage0-base-definitions.md, curve-selection.json, raw-result.json, null-distribution.json, control-subgroup.json, manifest.yaml]
  implementation_prerequisite: "Bind the source arithmetic routines and verify point-at-infinity representation before approval; the contract never assumes an affine x for O."
