design:
  experiment_id: EXP-ECDLP-1e6502
  status: prospective_incomplete_pending_formal_padic_formula_amendment
  approved_by: null
  source_binding: {path: experiments/EXP-ECDLP-1e6502/specification.yaml, sha256: 873a61b27d90b0da2f134ce0bb0412cd7d13b1ff7f2b2973632f05ce3b17e82a}
  preserves_mechanism: p-adic digit census on non-anomalous curves with anomalous Smart-functional known-true recovery.
  scope: {claim_tier: toy, nonanomalous_bits: [10,12,14,16,18,20], anomalous_bits: [10,12,14,16], families: [A,B], replicates: [20260905,20260906,20260907], precisions: [2,3]}
  definitions:
    coordinate_domain: "The FFT domain remains the full cyclic log array i=0,...,N-1. For R=O, x=0, or y=0, set every digit/post-function value to zero and retain its array position; record the three counts. Thus all transforms retain length N and inference is explicitly about this zero-extended full-domain function."
    teichmuller: "For x in F_p^*, choose x0 in 1..p-1 and precision s in {2,3}; set T_x=x0^(p^(s-1)) mod p^s. Stage 1 verifies T_x=x0 mod p and T_x^p=T_x mod p^s. This replaces the invalid one-power x0^p convention at s=3."
    torsion_section: "On the naive lift E~ over Z/p^sZ, with n=#E(F_p) prime to p and L=lift_point(E,R,s), define S_t(R)=L-[n]^{-1}[n]L, where [n]^{-1} is the inverse scalar on the formal kernel E_1 and the final E_1 operation is evaluated in the declared (t,w) chart t=-x/y. Record the lifted coordinates, valuation of every denominator, and the second x/y digits of S_t. A nonunit denominator is an explicit zero-extended exceptional point."
    precision_consistency: "For each precision-3 p-adic object A_3, reduce its underlying lift/section modulo p^2 before extracting the corresponding precision-2 digit and compare that digit exactly with A_2. The third digit is never compared as the same integer as the second digit."
    anomalous: "For each accepted anomalous curve and generator P, choose m_j=1+(int(SHA256('EXP-ECDLP-1e6502|anom|curve|j')) mod (p-1)), j=0..19. Define Sigma only from the Stage-0 formal-group chart with its domain and denominator stated; certify [m_j]P=Q_j and Sigma(Q_j)=m_j Sigma(P) mod p before calling a recovery."
  cells:
    nonanomalous_curve_bundles: 36
    precision_bundles: 72
    anomalous_curve_bundles: 24
    anomalous_instances: 480
    run_definition: "One artifact is one (bits,family,replicate) non-anomalous bundle containing both precisions and its paired anomalous bundle when bits<=16; the 36 non-anomalous and 24 anomalous bundles are grouped into 36 run artifacts, within source maximum_runs=48."
  controls: [five required p-adic checks with transcripts, Teichmuller fixed-point and Hensel checks, full-domain zero-extension check, log-table certificate, matched permutation, anomalous certificate]
  self_checks_required: ["torsion_section homomorphism on 10^4 deterministic random pairs and exhaustively at 10 bits", "naive-section defect nonadditivity with named witness pairs and rate", "precision consistency from k=3 reduction to k=2", "first-order identity x(P+X)-x(P)=2y(P)*formal_log(X) mod p^2 on deterministic pairs", "anomalous_log recovers 20 seeded scalars and refuses non-anomalous n=p inverse step"]
  basic_checks: ["T_x=x mod p and T_x^p=T_x mod p^s", "Hensel lift satisfies curve equation mod p^s", "torsion section reduces to R mod p", "zero extension leaves transform length N"]
  metrics: [eligible_count,exceptional_O_count,exceptional_y0_count,exceptional_x0_count,per_digit_beta,Z,nonzero_frequency_half_energy,null_quantiles,precision_mismatch_count,Sigma_recovery_certificates,RSS_peak]
  decisions:
    positive: "A non-anomalous spectral candidate requires the same familywise rule as 184fc4 and a passing precision check; anomalous recovery only validates the instrument on its stated known-true object."
    negative: "Valid null-like non-anomalous cells are scoped toy observations."
    inconclusive: "Any self-check, lift, chart-domain, or precision mismatch failure voids its affected arm; failures never falsify a mathematical hypothesis."
  costs: {time: "O(N*digit_count) p-adic operations plus transforms", memory_cap_gb: 8, workers: 1, measurement: "per-bundle wall/RSS and digit-library cardinality"}
  proof_search_map: {applicability: empirical instrument plus known-true control, baseline_embedding: matched permutation and anomalous recovery, observation_collision: "apparent digit effect due to exceptional-coordinate exclusion is separated by explicit class counts", quantifier_order: "all eligible points only", method_ceiling: toy digits on named lifts, nearby_object_control: anomalous curve}
  citations: [{ref: H-ECDLP-f1e714, provenance: internal, claim: preserved source hypothesis, verified_by: TASK-20260907-9c3566}, {ref: "Smart anomalous-curve functional", provenance: recalled, claim: retrieval target only; not used as support, verified_by: null}]
  frontier: {dominated_by: unknown, sota_delta: "No source-backed frontier comparison supplied; no attack or exponent claim.", novelty_status: unverified}
  required_artifacts: [stage0-padic-derivation.md, frozen-digit-library.json, self-check-transcripts.json, curve-lifts.json, raw-result.json, anomalous-certificates.json, manifest.yaml]
  implementation_prerequisite: "A pure-Python p-adic module must expose explicit modulus, lift, and exceptional-domain APIs before approval; installing a dependency is not an implicit prerequisite."
  bounded_impediment: "The supplied p-adic tooling proposal specifies the interface and torsion-section identity but does not supply a complete executable formula for lift_point, the formal-kernel scalar inverse [n]^-1, formal_log/Sigma truncation, or the eight frozen digit/post-function definitions with numeric delta thresholds. These are mathematical protocol fields, not implementation details. Before approval, an additive formal-formula amendment must bind the retrieved Sage/formal-group source passages and state each formula, domain, precision, and threshold; no value may be invented from recollection."
