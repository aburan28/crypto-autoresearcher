design:
  experiment_id: EXP-ECDLP-2c3d20
  status: prospective_complete_pending_approval
  approved_by: null
  source_binding: {path: experiments/EXP-ECDLP-2c3d20/specification.yaml, sha256: d38d39bfb8aeee1874433ef054605bc32fdbbc190496bd152379561bf8e62854}
  preserves_mechanism: r-adding-walk lumping and itinerary-class concentration against a random-label walk and descent-symbol walk.
  scope: {claim_tier: toy, field_bits: [12,14,16,18,20,22,24], families: [A,B], replicates: [20260905,20260906,20260907], r: [4,8,16,32]}
  definitions:
    shared_instance: "For each (bits,seed), freeze curve, P, secret k, Q=[k]P, r-table coefficients, table points, and branch partition hash before either true or null walk. Both walks share all items except the declared label permutation."
    true_transition: "T(i)=index(W_i+R_{F(W_i)}). F and R_j are byte-for-byte checked against the pinned source rho implementation for its first 10,000 state iterations, continuing through revisits when N<10,000."
    null_transition: "For each null replicate z=0..63 and every point index i independently draw L_z(i) uniformly from {0,...,r-1} using SHA256('EXP-ECDLP-2c3d20|null|bits|family|replicate|r|z|i); set T_z(i)=index(W_i+R_{L_z(i)}). This is the source random-label map, not a global permutation of branch labels."
    stationary: "For every deterministic transition map, compute its recurrent communicating classes, class periods, and stationary distribution pi by solving pi=pi T separately on each recurrent class, weighted by its basin size/N. Transient states have stationary weight zero. Report this object before any lumping; do not substitute uniform weighting unless total-variation distance to uniform is reported as zero."
    lumped_singular_value: "For partition g and stationary pi, Q_ab=(sum_{i:g(i)=a}pi_i*1[g(T(i))=b])/(sum_{i:g(i)=a}pi_i), omitting zero-mass rows with a record. Let Pi_b=diag(sum_{g(i)=b}pi_i); define D=Pi^(1/2)(Q-1*pi_Q^T)Pi^(-1/2) and report sigma_max(D), the largest singular value after centering. Reducibility/zero rows are separate flags."
    partition_library: "Freeze the ordered library before execution: branch F; x mod m for m={2,4,8,16,32,64,128,256}; y mod m for m={2,4,8}; Legendre(x+c) for c={0,1,-1,2,-2,3,5}; interval 1[x<p/2^j] for j=1,...,8; and mixed (x+y) mod 2. O maps to bin 0 for every coordinate partition. Emit partitions.json and SHA-256; no post-result modification."
    conditioning_cost: "All class quantities condition on class C only after reporting |C|, pi(C), rejection draws needed to sample C from uniform starts, and table-construction/search operations. The localized-kangaroo expression remains modeled and adds these stated conditioning costs; it is never an executed solver cost."
    itinerary: "I_k(i)=(F(i),F(T(i)),...,F(T^(k-1)(i))); depth k is included iff r^k<=sqrt(N), k>=1. For a class C, A(C)=ell(C)/N where ell(C) is the shortest cyclic log arc containing ceil(|C|/2) distinct log indices; singleton A=0 and empty classes are not scored."
  cells:
    curve_bundles: 42
    r_subcells_per_bundle: 4
    true_null_pairs: 168
    order_2q_control_bundles: 42
    run_definition: "one (bits,family,replicate) artifact contains all r values, true/null maps, stationary diagnostics, all admissible depths, frozen partitions, and paired control; 42 artifacts are within source maximum_runs=64."
  controls: [pinned-rho 10000-iterate regression, table nonzero/distinct-log check, log certificate, stationary/recurrent-class diagnostic, 64 independent random-label maps per cell, order-2q descent-symbol control]
  metrics: [recurrent_classes,periods,pi_distance_to_uniform,sigma2_and_convention,zero_mass_rows,class_size,class_stationary_mass,arc_concentration,conditioned_search_ops,indicator_spectrum,paired_null_difference,modelled_cost,RSS_peak]
  decisions:
    positive: "The 64 null maps are an empirical finite descriptive distribution, not a calibrated FWER p-value: report mean, 2.5/97.5 percentiles, and rank/(65) for every true-minus-null statistic. A review candidate requires absolute A separation>=0.10, outside that empirical central interval, and the same sign at both largest sizes in both seed strata; it does not establish a kangaroo speedup."
    negative: "No separation is a scoped toy diagnostic result."
    inconclusive: "Regression, transition, stationary, or control failure voids the affected statistic; timeout is infrastructure."
  costs: {time: "O(N*r) transition construction plus partition/lumping and class enumeration", memory: "record next-map, class tables, matrices, and RSS separately", cap_gb: 8, workers: 1}
  proof_search_map: {applicability: empirical diagnostic, baseline_embedding: paired random-label walk, observation_collision: "uniform and stationary weighting can disagree; both are reported and only declared stationary weighting defines sigma2", quantifier_order: "per frozen partition and admissible depth", method_ceiling: "no mixing theorem or solver-cost claim", nearby_object_control: descent-symbol walk}
  citations: [{ref: H-ECDLP-3ca750, provenance: internal, claim: preserved source hypothesis, verified_by: TASK-20260907-9c3566}, {ref: "published rho random-mapping analyses", provenance: recalled, claim: retrieval target only, verified_by: null}]
  frontier: {dominated_by: unknown, sota_delta: "No retrieved frontier comparison supplied; modeled costs are not an algorithmic improvement.", novelty_status: unverified}
  required_artifacts: [stage0-walk-definitions.md, shared-instances.json, rho-regression.json, transition-diagnostics.json, stationary-diagnostics.json, raw-result.json, control-order-2q.json, manifest.yaml]
  implementation_prerequisite: "Before approval, bind exact rho function/version and implement recurrent-class/stationary solver with synthetic reducible and periodic fixture checks; those checks are instrument tests, not scientific measurements."
