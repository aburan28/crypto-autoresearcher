protocol_amendment:
  amendment_label: AMEND-EXP-ECDLP-2c3d20-TASK-20260907-e11ec7
  experiment_id: EXP-ECDLP-2c3d20
  authored_under_task: TASK-20260907-e11ec7
  status: prospective_complete_pending_approval
  approved_by: null
  execution_authorized: false
  evidence_eligible: false
  recorded_at: '2026-09-07'
  amendment_kind: additive_prospective_replacement
  replaces_for_future_execution_only:
    path: experiments/EXP-ECDLP-2c3d20/specification.yaml
    sha256: d38d39bfb8aeee1874433ef054605bc32fdbbc190496bd152379561bf8e62854
  archived_design_binding:
    path: coordination/experiment-reserve/BATCH-c26423/designs/EXP-ECDLP-2c3d20.yaml
    sha256: ca59f4b0c4b79dbd8cb74f57e0a6c4307d78669d1aa280a16dc306a744979f39
    snapshot_commit: 3108ed960bdcc51ab895f5c9d0d342fe4bc24e38
  source_records:
    - {id: H-ECDLP-3ca750, provenance: internal, sha256: 3836e514b64875383ad62d80be166e41337f4cebe52334f56fcc24d01bc84cf6}
    - {id: IDEA-20260905-9c4f0c, provenance: internal, sha256: 8a691d9b7eb19391edb4aea7922e0e74e42b266d9dab0ac8ba1dec9d5ba10ad8}
    - {ref: harness/toycurve.py, provenance: internal, claim: deterministic toy-curve and subgroup generator}
    - {ref: harness/rho.py, provenance: internal, claim: exact r-adding table and branch recurrence}
    - {ref: KN-TECH-006, provenance: internal, claim: rho random-mapping baseline and generic-cost context}
  inference:
    policy: research-deep
    reasoning_effort: max
    resolved_model_id: gpt-5.6-sol
    resolved_backend: openai
    fallback_allowed: false
    fallback_used: false
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    note: >-
      The committed handoff maps research-deep/max to this model. This zero-run
      design task made no fresh API probe and used no Bedrock endpoint.
  claim_boundary: >-
    This is a complete prospective experiment contract. It is not approval,
    freezing, execution, an observation, evidence, a status transition, a mixing
    theorem, or a solver improvement. Any later run is toy-scale and can support
    only the exact enumerated cells and descriptive decision rules below.

  objective: >-
    On exhaustive toy prime-order subgroups, compare the harness r-adding map
    with sixty-four independently domain-separated pointwise-uniform branch-label
    maps that use the identical step table. Measure the leading singular value of
    each stationary-weighted centered lumped operator, itinerary-class log-arc
    concentration and indicator spectra, with every conditioning cost exposed.
    Use an order-2q descent-symbol map as the known-true control. The experiment
    decides only whether a replicated true-versus-null structural separation is
    present in the declared toy ladder.

  frozen_scope:
    claim_tier: toy
    field_bits: [12, 14, 16, 18, 20, 22, 24]
    curve_strata: [A, B]
    replicate_seeds: [20260905, 20260906, 20260907]
    branches: [4, 8, 16, 32]
    pointwise_null_replicates: 64
    partition_count: 40
    primary_curve_bundles: 42
    order_2q_control_bundles: 42
    maximum_workers: 1
    maximum_memory_gb: 8

  deterministic_primitives:
    seed_integer: >-
      seed_int(s,tag)=the nonnegative big-endian integer represented by
      SHA256(UTF8(decimal(s)||':'||UTF8(tag))). This is the exact helper
      _seed_int imported by the pinned harness rho implementation.
    point_encoding: >-
      enc(O)=one byte 0x00. For affine (x,y), enc(x,y)=0x04 followed by x and y
      as fixed-width unsigned big-endian integers of width ceil(bit_length(p)/8).
    scalar_enumeration: >-
      The log order is i=0,...,N-1 with W_i=[i]P and W_0=O. Build both maps
      point_to_index[enc(W_i)]=i and index_to_point[i]=W_i. Duplicate encodings,
      [N]P != O, or any [i]P=O for 0<i<N is an instrument failure.

  primary_curve_generation:
    algorithm: >-
      For each (field_bits b, stratum S, replicate seed s), set attempt=0,1,...
      and derived_seed=seed_int(s,'EXP-ECDLP-2c3d20|primary|'||S||'|'||b||'|'||attempt)
      mod 2^63. Call harness.toycurve.generate_instance(derived_seed,b). Reject
      and increment attempt unless p has exactly b bits, the full curve order
      equals the returned prime subgroup order N (cofactor one), N>=5, and the
      table-validity predicate below holds simultaneously for r=4,8,16,32.
      Strata A and B are the two disjoint domain-separated streams named by S;
      they assert no CM, trace, or isomorphism property. Accept the first passing
      candidate, record every rejected derived_seed and reason, and cap the search
      at 20000 attempts. Exhausting the cap is failed_infrastructure.
    replicate_meaning: >-
      The three listed seeds are fixed independent deterministic streams within
      each stratum. A replacement seed, a changed stratum tag, or a regenerated
      curve after observing a metric is a new protocol amendment.
    certificate: >-
      Record p,A,B,#E,N,P,k,Q and verify discriminant !=0, #E=N prime,
      [N]P=O, P!=O, 2<=k<=N-1, and Q=[k]P. Exhaustive enumeration must contain
      exactly N distinct encodings. Because N is prime, these checks certify that
      P generates the enumerated subgroup.

  harness_r_adding_map:
    table: >-
      For j=0,...,r-1 set c_j=seed_int(instance.seed,'rho_c'||j) mod N,
      d_j=seed_int(instance.seed,'rho_d'||j) mod N, R_j=[c_j]P+[d_j]Q,
      and t_j=(c_j+d_j*k) mod N. Table validity means every t_j is nonzero and
      t_j values are pairwise distinct for the r=32 table; the smaller r tables
      are its prefixes. Curve rejection, never post-hoc table resampling, handles
      failure. Record c_j,d_j,R_j,t_j and their encodings.
    branch: >-
      s_r(O)=0 and s_r((x,y))=x mod r. The true scalar transition is
      F_r(i)=(i+t_{s_r(W_i)}) mod N, and its point transition is
      W_i -> W_i+R_{s_r(W_i)}. Assert both representations agree at all N points.
    pinned_regression: >-
      For each curve and r, use the pinned rho initialization
      a0=seed_int(instance.seed,'rho_a0_0') mod N and
      b0=seed_int(instance.seed,'rho_b0_0') mod (N-1)+1. Starting at
      i0=(a0+b0*k) mod N, compare branch, point encoding, a, b, and next point
      for the first min(10000,N) successive tortoise steps with harness/rho.py.
      Serialize each tuple canonically and require byte-identical transcripts.
      This is a blocking implementation regression, not a scientific run.

  pointwise_uniform_branch_null:
    definition: >-
      For null replicate u=0,...,63 and every scalar index i=0,...,N-1, let
      H=SHA256(UTF8('EXP-ECDLP-2c3d20|point-null|'||b||'|'||S||'|'||s||'|'||
      r||'|'||u||'|'||i)). Since every declared r is a power of two, define
      L_u(i)=int_big_endian(H) bitand (r-1), with no modulo bias. The null map is
      F0_{r,u}(i)=(i+t_{L_u(i)}) mod N. It shares the curve, enumeration, secret,
      step coefficients, points, scalar steps and partition library with F_r;
      only the pointwise branch labels differ.
    probability_model: >-
      Uniformity and independence are the pre-registered SHA-256 PRF model for
      the labels at distinct domain strings. The realized labels are deterministic
      and need not be exactly balanced. Record all r label counts for every null;
      imbalance is null variation, not a reason to redraw a replicate.
    correction_to_archived_design: >-
      A single permutation of the r labels preserves all same-label fibers and is
      not a pointwise-uniform label null. This amendment therefore replaces the
      archived label-permutation definition with independent point-index labels,
      as required by the committed mathematical-design handoff.

  functional_graph_and_stationarity:
    exact_algorithm: >-
      Enumerate the complete functional graph of each true and null map in scalar
      order. Use path following with deterministic node order to identify every
      directed cycle C, its least scalar representative, its period |C|, and its
      basin B(C)={i:some iterate of F sends i into C}. Sort cycles by their least
      representative. The selected stationary distribution is the uniform-start
      Cesaro limit: pi_i=|B(C)|/(N*|C|) for i on cycle C, and pi_i=0 for transient
      i. Store pi_i as the exact rational pair (|B(C)|,N*|C|), reduced only for
      display. Assert sum_i pi_i=1 and pi_j=sum_{i:F(i)=j}pi_i exactly.
    interpretation: >-
      Deterministic reducible maps have many stationary measures. Basin weighting
      fixes the unique measure induced by a uniformly sampled start followed by a
      Cesaro time average. No uniform-state substitution is allowed. Also report
      transient count, cycle count, periods, basin sizes and total-variation
      distance from the uniform distribution as descriptive diagnostics.

  frozen_partition_library:
    infinity_rule: >-
      O is its own category in every partition. Categories absent from the
      positive stationary support are retained in raw counts and omitted from
      the normalized operator with an explicit zero_mass flag.
    members:
      - >-
        Nine x-residue partitions x mod m for m in
        [2,3,4,5,7,8,16,32,64].
      - Three y-residue partitions y mod m for m in [2,4,8].
      - >-
        Nine symbol partitions taking values in {-1,0,1}: Legendre(x+c) for
        c in [0,1,-1,2,-2,3,-3], Legendre(y), and Legendre(x*y), with
        Legendre(0)=0.
      - >-
        Sixteen binary interval partitions I_j=1[x < floor(j*p/17)] for
        j=1,...,16, using canonical representatives 0<=x<p.
      - >-
        Three mixed partitions: (x mod 2,Legendre(y));
        (x mod 4,Legendre(x+1)); and (Legendre(x),Legendre(y)).
    count_check: 9 + 3 + 9 + 16 + 3 = 40
    freeze_rule: >-
      Emit the ordered library and SHA-256 before measurement. No member,
      category merge, or threshold may be changed after observing a cell.

  stationary_weighted_lumped_operator:
    definition: >-
      For a retained category a let mu_a=sum_{i:g(i)=a}pi_i. Define
      Q_ab=mu_a^(-1)*sum_{i:g(i)=a}pi_i*1[g(F(i))=b]. Let D=diag(mu) and let
      1 be the all-ones column. Form the centered normalized operator
      C=D^(1/2)*(Q-1*mu^T)*D^(-1/2). Report sigma_center=max singular_value(C),
      the leading singular value of the already-centered operator. Also report
      all singular values in descending order, Q, mu, omitted categories and
      row-sum/stationarity residuals.
    numerical_contract: >-
      Construct Q and mu from exact integer/rational counts. Convert the final
      retained matrix to IEEE-754 binary64 in category order and compute a full
      deterministic SVD. Require max row-sum residual and stationarity residual
      <=1e-12 and agreement of sigma_center with an independent eigenvalue of
      C^T*C to absolute tolerance 1e-10. Failure voids that operator.
    correction_to_archived_design: >-
      The archived phrase 'second singular value counting multiplicity' is
      ambiguous after the rank-one stationary component has already been
      removed. This contract reports the leading singular value of C, whose
      definition is invariant to that indexing convention.

  itinerary_statistics:
    depths: >-
      For each (N,r), K(N,r)=floor(log(sqrt(N))/log(r)); use exactly integer
      depths k=1,...,K, equivalently the largest k with r^(2k)<=N. Also record
      k_star_real=log(N)/(2*log(2*r)) and flag every measured k>k_star_real.
    word_and_class: >-
      I_k(i)=(label(i),label(F(i)),...,label(F^(k-1)(i))), using s_r for the true
      map and L_u for a null map. C_w={i:I_k(i)=w}; empty words are recorded in
      the word-count summary but are not scored.
    cyclic_half_arc: >-
      For a nonempty class C of size m, sort its scalar logs
      0<=a_0<...<a_(m-1)<N and extend a_(j+m)=a_j+N. Put h=ceil(m/2) and
      ell(C)=min_{0<=j<m}(a_(j+h-1)-a_j), choosing the least a_j on ties.
      A(C)=ell(C)/N; therefore a singleton has A=0. Store the minimizing start,
      endpoint, h, ell and A.
    aggregates: >-
      The primary arc statistic is point-weighted
      A_point(k)=sum_C (|C|/N)*A(C). Secondary statistics are the unweighted
      class mean, median, and min_{|C|>=32} A(C); the last is NA when no eligible
      class exists. Report every class separately so the aggregate is auditable.
    class_spectrum: >-
      For each class C define h_C(i)=1[i in C]-|C|/N and
      H_C(a)=sum_i h_C(i)*exp(-2*pi*i*a/N). Report variance, max_{a!=0}|H_C(a)|,
      least maximizing a, and the real-function conjugate partner N-a. Define
      Z from the empirical distribution of the same max statistic among matched
      null classes; no independent-exponential or Gumbel law is asserted.
    deterministic_size_matching: >-
      For each true class, within each null replicate form candidates whose size
      ratio lies in [0.8,1.2]. Choose the unused candidate minimizing
      (abs(size_null-size_true),lexicographic_word); process true classes in
      (decreasing size,lexicographic_word) order. Unmatched classes remain in the
      raw table and are excluded only from paired class-level differences.
    conditioning_and_search_cost: >-
      For every class report |C|, uniform-start mass |C|/N, stationary mass
      pi(C), exact expected uniform rejection draws N/|C|, k label evaluations
      per accepted start, complete-map/table construction operations, and class
      enumeration operations. The source expression k+2*sqrt(A(C)*N) is retained
      only as a modeled localized-search term and is reported both alone and
      with the declared conditioning/construction charges. No kangaroo or DLP
      solve is executed by this experiment.

  order_2q_known_true_control:
    generation: >-
      For each (b,S,s), use the same derived-seed stream with domain
      'EXP-ECDLP-2c3d20|control-2q'. Accept the first nonsingular short
      Weierstrass curve over an exactly b-bit prime p whose group is cyclic of
      order 2q with q odd prime. Select the first candidate point, in the
      deterministic harness lift_x stream, having order 2q as generator P, and
      locate the unique rational two-torsion point T=(e,0). Record all rejections
      and certify [2q]P=O, [q]P=T and #E=2q.
    descent_symbol: >-
      Let Delta=3*e^2+A mod p and require Legendre(Delta)=-1. Define
      delta(O)=1, delta(T)=Legendre(Delta), and
      delta((x,y))=Legendre(x-e) otherwise. Exhaustively require
      delta(U+V)=delta(U)delta(V) and delta([j]P)=(-1)^j for all pairs/scalars.
      Define the r=2 branch label (1-delta(W))/2 and use the first two pinned rho
      table steps. At depth one the two classes must each have q elements; their
      centered indicators have only the conjugate-identical frequency q on the
      length-2q log ordering, and their cyclic half-arc A tends to one half under
      the exact finite definition. Report the exact finite A, not a hard-coded
      0.5.
    role: >-
      This is a proves-too-much/known-true instrument object. Failure voids the
      affected instrument; success says nothing about the primary rho map.

  null_inference_and_decisions:
    ranks: >-
      For every scalar summary X whose large direction is predeclared, use the
      upper rank p=(1+#{u:X_null[u]>=X_true})/65; reverse the inequality for a
      lower-tail arc statistic. Ties count against separation. The minimum rank
      is 1/65. Report two-sided ranks as min(1,2*min(p_upper,p_lower)) only when
      explicitly labeled descriptive.
    multiplicity: >-
      The 64 common pointwise-null replicates are reused across all partitions,
      depths and statistics within a map cell, preserving dependence. There is
      no valid global family-wise p-value at resolution 1/65. All ranks and
      max-over-library summaries are descriptive and trigger independent review,
      never hypothesis promotion by themselves.
    review_candidate: >-
      A true-map effect becomes a review candidate only when its predeclared
      direction has rank 1/65 and absolute standardized effect at least 2 in
      each of bits 22 and 24, in both strata, for at least two of the three
      replicate seeds, with passing regression, stationary, size-match and
      order-2q controls. Report every other outcome descriptively.
    no_separation: >-
      True statistics lying within their null ensemble support a scoped toy
      diagnostic only. They do not prove random mapping, asymptotic mixing, or
      the absence of another exploitable partition.

  slopes:
    definition: >-
      For each fixed (stratum,replicate,r,partition), fit ordinary least squares
      y=alpha+gamma*x across all seven rungs, x=ln(N),
      y=ln(max(sigma_center,2^-52)); report gamma, intercept, residuals and all
      seven inputs. Apply the identical fit to every common null index u. For
      itinerary summaries, fit only a fixed depth k present at all seven rungs;
      identify the trajectory by (stratum,replicate,r,k,statistic).
    inference: >-
      Compare the observed slope with the 64 same-index null slopes by the rank
      rule above. Bootstrap intervals from resampling the three fixed replicates
      may be reported descriptively; resampling never creates new instances.

  exact_cell_accounting:
    primary_curve_bundles: 7 * 2 * 3 = 42
    primary_true_maps: 42 * 4 = 168
    primary_null_maps: 168 * 64 = 10752
    true_lumped_matrices: 168 * 40 = 6720
    null_lumped_matrices: 10752 * 40 = 430080
    lumped_slope_trajectories_true: 2 * 3 * 4 * 40 = 960
    lumped_slope_trajectories_null: 960 * 64 = 61440
    order_2q_control_bundles: 42
    itinerary_map_depth_rows: >-
      The exact fixture-dependent count is
      sum_over_42_bundles sum_over_r K(N_bundle,r) true rows and sixty-four times
      that expression for null rows. The pre-run manifest must evaluate this
      integer from the frozen certified N values before any metric is computed;
      it is not guessed before curve generation.
    run_definition: >-
      One executor run artifact is one primary curve bundle containing all four
      r values, their 64 null maps, all partitions and depths, plus its paired
      order-2q control. Therefore a complete execution has exactly 42 run
      artifacts; retries are new attempt records and never overwrite one.

  controls:
    blocking:
      - exact subgroup and exhaustive point/log-table certificate
      - nonzero pairwise-distinct r=32 scalar step table
      - byte-identical pinned-rho regression for every true map
      - scalar/point transition equality over every node
      - exact functional-graph stationarity equations
      - lumped row, stationary and SVD residual checks
      - deterministic pointwise-null domain and label-count record
      - order-2q descent-symbol homomorphism, parity and spectrum control
    descriptive:
      - second domain-separated curve stratum and three fixed replicates
      - uniform-versus-stationary weight comparison
      - null class-size distribution and deterministic 20-percent matching
      - depths beyond k_star_real listed separately

  invalidation_and_stopping:
    - >-
      Stop an affected bundle before interpretation if a certificate, regression,
      transition, stationarity, SVD, pointwise-null serialization or order-2q
      control fails. Preserve the failed artifact as attempted_and_inconclusive.
    - >-
      A timeout, process crash, dependency failure, curve-search exhaustion or
      memory exhaustion is failed_infrastructure and asserts nothing about the
      hypothesis.
    - >-
      Do not redraw a valid null because its labels are imbalanced, redraw a curve
      because a statistic is extreme, or extend the partition library after any
      observation. Such an execution is completed_invalid.
    - >-
      Stop at 42 complete primary bundles, the declared resource cap, or a
      blocking control failure. A review-candidate signal is archived and sent
      to independent review; it is not promoted in the execution session.

  budgets:
    scientific_runs_in_this_amendment_task: 0
    future_maximum_run_artifacts: 42
    future_wall_clock_seconds_per_run: 3600
    future_total_cpu_hours: null
    future_maximum_memory_gb: 8
    future_maximum_workers: 1
    note: >-
      CPU and wall-clock values are measurement/reporting fields under the
      standing research-budget policy. They do not change the fixed cell set,
      controls, one-worker machine guard or immutable attempt records.

  proof_search_map:
    applicability: empirical structural diagnostic with a modeled search-cost corollary
    exact_baseline_reproduction: >-
      The pinned harness recurrence, table coefficients, starts and first
      min(10000,N) transitions are re-derived in scalar coordinates and compared
      byte for byte before any structural statistic.
    observation_collision_search: >-
      Uniform point weighting, stationary basin weighting, label-frequency
      imbalance, recurrent-basin concentration and finite class size can each
      imitate dependence. The contract records them separately and compares only
      with pointwise nulls of identical map shape.
    quantifier_order: >-
      Curves, tables, partitions, null domains, directions, thresholds and the
      complete cell count are frozen first; statistics are then computed for
      every declared cell; only afterward are replicated review-candidate rules
      evaluated.
    method_ceiling: >-
      Exhaustive O(N) map access and known discrete logs cap any result at a toy
      diagnostic. Passing cannot establish a mixing theorem or cheaper ECDLP
      algorithm; failing a control voids the instrument.
    nearby_object_control: >-
      The order-2q descent-symbol map supplies a known algebraic partition whose
      parity spectrum must be detected. The pointwise random-label ensemble is
      the same-shape null.

  derivations_and_source_changes:
    - >-
      Derived the uniform-start Cesaro stationary measure explicitly from cycle
      basins, removing the archived unspecified choice among stationary measures.
    - >-
      Replaced the archived common label permutation with sixty-four point-index
      uniform label functions; a branch permutation cannot destroy the original
      fibers and therefore is not the stated null.
    - >-
      Replaced ambiguous 'second singular value after centering' with the leading
      singular value of the explicitly centered, stationary-normalized operator.
    - >-
      Froze all forty partitions, exact zero-mass handling, finite arc ties,
      class matching, conditioning costs, slope fits and descriptive rank rules.
    - >-
      Added a second domain-separated curve stratum while retaining the three
      source seeds, yielding the requested two-strata/three-replicate ladder.
    - >-
      Corrected the order-2q local value at T to Legendre(3e^2+A) and required
      the exact homomorphism/parity check rather than treating a coordinate zero
      as a branch label.
    - >-
      Every derivation in this amendment is prospective mathematical design.
      None is a run result, validated evidence, novelty finding, or claim that a
      control will pass.

  frontier:
    dominated_by: unknown
    sota_delta: >-
      No asymptotic, concrete-time, memory, or query improvement is claimed.
      The complete-map instrument costs O(N) per map before partition and
      itinerary summaries and is outside a cryptographic-scale solver model.
    novelty_status: unverified

  required_artifacts_for_future_execution:
    - stage0-definitions.md with the exact derivations and frozen hashes
    - curve-selection.json with every attempted seed, rejection and certificate
    - shared-instances.json with all points/table scalars and source-code hashes
    - rho-regression.json with canonical byte transcript and comparison result
    - pointwise-null-labels.json with domains, hashes and label counts
    - transition-maps.bin plus SHA-256 and scalar/point equality checks
    - stationary-diagnostics.json with cycles, basins and exact rational masses
    - partition-library.json with ordered definitions and SHA-256
    - lumped-operators.json with Q, mu, centered singular values and residuals
    - itinerary-classes.json with class words, costs, arcs and spectra
    - null-ranks.json with all 64 values, ties and multiplicity statement
    - control-order-2q.json with curve, Delta, exhaustive symbol and spectrum
    - raw-result.json with every declared cell and explicit missing/invalid rows
    - manifest.yaml with command, commit, dirty state, environment and inference

  completion_and_approval_gate:
    contract_complete: true
    unresolved_mathematical_definitions: []
    implementation_prerequisites:
      - bind exact harness/toycurve.py and harness/rho.py blob hashes
      - implement two independent stationary/SVD fixture checks before a scientific cell
      - materialize and hash the complete deterministic cell manifest
      - obtain Coordinator approval in a committed additive decision
    approval_statement: >-
      approved_by remains null. The parent Coordinator may approve this complete
      prospective contract under standing user authorization only after snapshot
      and implementation-readiness review. This amendment itself confers no
      execution authority and changes no hypothesis status.
