  objective: >-
    On a newly frozen set of eight shared known-solution instances, measure
    unbounded, fixed-table and memory-constrained baby-step giant-step beside
    sixteen charged rho streams at subgroup sizes 16,20,24,28 bits. Enforce each
    nominal table budget through one fixed byte-addressed buffer with no growth
    path, separate the fixed-table feasibility cliff from the constrained-table
    cost crossover, and report either an adjacent-rung crossover bracket or an
    explicit directional bound without interpolation.

  source_state_resolution:
    exp_4320a7_state_read: review_required
    exp_4320a7_frozen: false
    exp_4320a7_approved_by: null
    exp_4320a7_execution_authorized: false
    exp_4320a7_replication_seeds: []
    exp_4320a7_run_or_instance_artifacts_found_in_supplied_snapshot: false
    consequence: >-
      There is no approved or hash-bound EXP-ECDLP-4320a7 instance manifest to
      inherit or completed NULL 1 result to reuse. This amendment therefore
      freezes a new master seed and one exact generation algorithm. Before either
      sibling experiment executes, a separate additive amendment to EXP-ECDLP-4320a7
      must reference the resulting manifest SHA-256. The historical 4320a7 file
      is not rewritten. A later-discovered conflicting manifest stops launch for
      Coordinator reconciliation; it is never silently replaced.
