  frozen_scope:
    subgroup_bits: [16, 20, 24, 28]
    instances_per_size: 2
    shared_instance_count: 8
    independent_execution_bundles: 2
    rho_streams_per_instance_per_execution: 16
    positive_table_budgets_bytes: [4096, 32768, 262144]
    degenerate_table_budget_bytes: 8
    physical_slot_bytes: 16
    maximum_load_numerator: 7
    maximum_load_denominator: 10
    maximum_workers: 1
    maximum_process_memory_gb: 8
    claim_tier: toy

  shared_instance_set:
    master_seed_utf8: 'EXP-ECDLP-709063|shared-instance-set|v2|TASK-20260907-e11ec7|20260907'
    seed_derivation: >-
      For subgroup bit size b, instance index i in {0,1}, and attempt a=0,1,...,
      compute D=SHA256(master_seed_utf8_bytes || 0x00 ||
      UTF8('candidate|'||b||'|'||i||'|'||a)). The candidate seed is the unsigned
      big-endian integer in D[0:8]. Call
      harness.toycurve.generate_instance(candidate_seed,b).
    acceptance: >-
      Accept the first candidate for which p<2^28, p has exactly b bits, the
      returned prime subgroup order N has exactly b bits, N>=5, P!=O,
      [N]P=O, Q=[k]P with 2<=k<=N-1, and its canonical tuple
      (p,A,B,N,P_x,P_y,Q_x,Q_y,k) differs from every earlier accepted tuple.
      Record each rejected seed and reason. At b=28, p<2^28 explicitly rejects
      a next-prime overflow so all coordinates fit the declared uint32 format.
      Exhaustion of 20000 attempts for a cell is failed_infrastructure.
    canonical_instance: >-
      Encode each integer as minimal unsigned big-endian bytes prefixed by a
      four-byte big-endian length; encode O as a zero length. Concatenate the
      fields in the tuple order above. instance_id is 'I-' plus the first sixteen
      lowercase hex digits of SHA256(canonical_instance). The immutable
      shared-instance manifest lists the master-seed bytes and SHA-256, every
      candidate/rejection, accepted seed and tuple, generator/solution checks,
      harness source blob hashes, and its own SHA-256.
    timing_boundary: >-
      Generate, certify, serialize and hash all eight instances before either
      algorithm execution. Instance generation, knowledge of k, and certification
      are setup and are excluded from solve timing but retained in setup operation
      and wall-time fields. All arms refer to instance_id and the same manifest
      SHA-256; no arm may regenerate a curve.
    sharing_rule: >-
      The master seed is public reproducibility material, not cryptographic
      entropy. Both independent executions and both sibling experiments use the
      same eight instances. Algorithm-stream seeds may vary as specified below;
      curves, P, Q, N and known k do not.

  portable_fixed_physical_table:
    slot_layout: >-
      Allocate exactly S=floor(C/16) consecutive physical slots for byte budget
      C. Slot q occupies bytes [16q,16q+16) and is struct <IIII: little-endian
      uint32 x, uint32 y, uint32 exponent, uint32 state. state=0 is empty;
      state=1 is an affine key; state=2 is O with x=0,y=0. No tombstones exist.
      Affine coordinates and exponents are below 2^28 by the instance rules.
      O is stored as the ordinary baby step j=0 rather than omitted.
    key_encoding_and_hash: >-
      enc(O)=0x00. For affine (x,y), enc=0x04 || uint32_be(x) || uint32_be(y).
      h(point)=uint64_little_endian(SHA256(UTF8('EXP-ECDLP-709063|table|v2')
      ||enc(point))[0:8]) mod S. Probe q_t=(h+t) mod S for t=0,...,S-1.
      Equality compares state and both coordinates. On lookup, state=0 means
      absent; on insertion, the first state=0 slot is used. Duplicate keys must
      carry the identical exponent or the table is completed_invalid.
    capacity: >-
      The maximum occupied entries are E=floor(7*S/10). An attempted insertion
      when occupied=E returns TABLE_FULL before writing, even if a physical empty
      slot remains. The buffer is allocated once as exactly 16*S zero bytes and
      exposes no resize, grow, rehash, spill, secondary dictionary, or auxiliary
      point-to-exponent path. Every read/write checks 0<=q<S. The caller supplies
      the buffer; the table cannot allocate another table internally.
    exact_capacities:
      - {budget_bytes: 8, slots: 0, usable_entries: 0, allocated_table_bytes: 0}
      - {budget_bytes: 4096, slots: 256, usable_entries: 179, allocated_table_bytes: 4096}
      - {budget_bytes: 32768, slots: 2048, usable_entries: 1433, allocated_table_bytes: 32768}
      - {budget_bytes: 262144, slots: 16384, usable_entries: 11468, allocated_table_bytes: 262144}
    measured_memory_fields: >-
      Record C,S,E,occupied,allocated_table_bytes=16S,
      occupied_payload_bytes=16*occupied, budget_slack=C-16S, probe counts,
      buffer object identity and length before/after the arm, process baseline RSS,
      peak RSS and RSS delta. The physical slot cost is exactly 16 bytes by
      format; allocated bytes per occupied entry is also reported and is not
      mislabeled as slot size. RSS includes runtime overhead and is never used as
      the table-cap predicate.
    portability_and_enforcement: >-
      A conforming implementation may use a mutable byte array or anonymous
      mapping, but must expose the exact byte length and access it only through
      this layout. The cap is enforced by the addressable slot range and absent
      grow path, not by a logical byte counter or a platform-specific RLIMIT.
      ENOMEM, process termination, or a particular operating system is not an
      expected control outcome. The separate 8 GiB process guard remains machine
      protection only.

  table_enforcement_controls:
    positive_budget_probe: >-
      Once per execution and positive budget, use successive distinct baby points
      from the first 16-bit shared instance. Insert exactly E keys and require
      occupied=E, buffer length=16S and all lookups correct. Attempt key E+1 and
      require TABLE_FULL, occupied still E, unchanged buffer identity/length and
      byte-for-byte unchanged buffer SHA-256. Then look up all E keys again.
    degenerate_budget_probe: >-
      Once per execution construct the C=8 table. Require S=E=0 and an attempted
      insertion of O to return TABLE_FULL without allocating a table buffer.
      This is NULL 2 and proves that fixed-table BSGS cannot start at that budget.
    forbidden_outcomes: >-
      An exception caused only by an out-of-range memory access, a changed buffer
      length, hidden spill structure, successful E+1 insertion, missing retained
      key, or reliance on a counter while a separate table grows voids every
      memory interpretation in that execution.

  charged_group_operation_convention:
    curve_wrapper: >-
      All solvers use the same immutable elliptic-curve object and counting
      wrapper. Each call to complete group addition, including doubling and an
      addition involving O, charges one group operation. Scalar multiplication
      is the pinned left-to-right binary double-and-add routine and charges every
      wrapped addition/doubling it invokes. Hashing, probing and integer arithmetic
      have separate counters and never enter group_operations.
    total: >-
      total_group_operations includes solver precomputation, baby steps, giant
      steps, rho table construction/restarts, and the final [candidate]P=Q
      certificate. Setup instance generation is excluded and reported separately.
      Also report the baby, giant, scalar-precompute, walk, restart, certificate,
      hash and probe components so equality can be audited.
    solution_validity: >-
      An arm succeeds only if it returns k_hat in [0,N-1] and [k_hat]P=Q. Compare
      with the pre-generated k only after the public group equation passes.
      A wrong solution is completed_invalid; a TABLE_FULL refusal in the exact
      arm-A condition is a declared capacity outcome, not a solver failure.

  bsgs_arms:
    common_algorithm: >-
      For table length M, insert [j]P -> j for j=0,...,M-1 by starting with O and
      adding P successively. Compute H=[M]P using the charged scalar routine.
      Starting G=Q, for ell=0,...,ceil(N/M)-1, look up G; on a hit j, certify
      k_hat=(ell*M+j) mod N; otherwise replace G by G-H with one charged addition.
      The loop bound covers every residue 0,...,N-1. No use of known k is allowed
      in the solve or stopping decision.
    unbounded_null_1: >-
      Set m=ceil(sqrt(N))=isqrt(N-1)+1 and
      S_unbounded=ceil(10*m/7), so floor(7*S_unbounded/10)>=m. Allocate one
      16*S_unbounded buffer in the same format and run the common algorithm with
      M=m. Record its cost beside the rho distribution. BSGS using fewer
      operations is an expected sanity pattern from the source proposal, but the
      comparison itself is an observation; only solution correctness and complete
      charging are blocking controls.
    arm_a_fixed_table: >-
      For budget capacity E, set m=isqrt(N-1)+1. If m>E, return
      CAPACITY_REFUSAL before constructing H or solving. If m<=E, run the common
      algorithm with M=m in the fixed C-byte buffer. Arm A reports a feasibility
      cliff and never a cost crossover.
    arm_b_memory_constrained: >-
      For every positive budget set M=min(E,N). M is positive for all declared
      cells. Insert exactly M baby steps in the fixed C-byte buffer and run the
      common giant-step algorithm through ceil(N/M)-1. A TABLE_FULL response at
      or before insertion M is an instrument failure. Arm B is the only arm used
      in measured crossover differences.

  rho_baseline:
    stream_seed: >-
      For execution e in {0,1}, instance_id I, and stream u=0,...,15, compute
      D=SHA256(master_seed_utf8_bytes || 0x00 ||
      UTF8('rho|'||e||'|'||I||'|'||u)); rho_seed is the unsigned big-endian
      integer D[0:8]. Copy the immutable instance while replacing only its public
      seed field with rho_seed, then call the pinned harness/rho.py solver. This
      creates a fresh table/start stream on the identical curve,P,Q,N.
    run_rule: >-
      Use the source default branch count and at most 12 deterministic restarts;
      freeze the exact maximum-iteration formula and rho source blob hash in the
      execution plan before launch. Record every attempt, including failures,
      with total_group_operations fully charged under the common convention.
    censoring: >-
      A (execution,instance) rho baseline is usable only with at least 12 valid
      certified solutions among 16 streams. Its primary cost is the ordinary
      median of successful total_group_operations; for an even count this is the
      arithmetic mean of the two middle sorted values. Fewer than 12 successes
      censors every crossover cell for that instance; failures remain in raw data
      and are never discarded from the success-rate metric.

  execution_order:
    - >-
      Materialize, certify and hash the eight-instance manifest, representation
      definition, solver source bindings and complete 16-artifact execution plan.
    - >-
      In each execution run the three positive-budget probes and the single
      8-byte probe. Archive their results before solving any crossover cell.
    - >-
      Run unbounded BSGS and all sixteen rho streams for each shared instance;
      archive correctness, costs and censoring before Arm B comparison.
    - >-
      Run all Arm A and Arm B cells in lexicographic order
      (subgroup_bits,instance_index,budget_bytes), clearing and zero-hashing the
      same-sized new buffer for each arm. Never reuse a populated baby table.
    - >-
      Compute per-instance differences, per-size aggregates and crossover
      classifications only after all required rows are immutable.

  metrics_and_decisions:
    per_row_required: >-
      execution,instance_id,bits,budget,arm,termination,solution_valid,
      total_group_operations and components, wall_ns, baseline/peak/delta RSS,
      S,E,occupied,allocated/occupied table bytes, load, hash probes,
      source hashes and attempt artifact SHA-256.
    arm_a_cliff: >-
      For each positive budget, report the largest tested size at which every
      instance in both executions has m<=E and starts, and the first higher rung
      with m>E. If none starts, report CLIFF_BELOW_16; if all start, report
      CLIFF_ABOVE_28. The exact modeled predicate m<=E is shown beside every row;
      disagreement is an instrument failure.
    per_instance_difference: >-
      For an uncensored cell define D(e,I,C)=ArmB_total_group_operations minus
      median_successful_rho_total_group_operations on that execution and instance.
      Negative means constrained BSGS used fewer charged group operations.
    per_size_difference: >-
      For fixed (e,b,C), sort the two instance differences and define their
      ordinary median as their arithmetic mean. Both instances must be uncensored.
      No confidence interval is inferred from two instances.
    measured_crossover: >-
      Within one execution and budget, a crossover bracket is the first adjacent
      pair of tested rungs (b_lo,b_hi) with median_D(b_lo)<0 and
      median_D(b_hi)>=0. Require all lower rungs negative and all higher rungs
      nonnegative. If both executions return the identical bracket, report it as
      REPLICATED_BRACKET. If all four medians are negative in both executions,
      report the strict lower bound crossover_bits>28. If all are nonnegative in
      both, report crossover_bits<=16. Any reverse/multiple sign change, disagreement
      between executions, or censored neighbor is NONMONOTONE_OR_INCONCLUSIVE and
      receives no directional bound.
    no_interpolation: >-
      A measured result is only the tested adjacent bit bracket or directional
      bound above. Do not interpolate a point, regress D, pool wall time with
      operations, or call Arm A's capacity cliff a crossover.
    modeled_values: >-
      Report separately (i) the source optimistic giant-only proxy
      N_star_source=(c_ref*E)^2, with c_ref the ordinary median over all usable
      per-instance rho_median/sqrt(N) values, and (ii) the discrete charged model
      D_model(N)=E+ceil(N/E)-c_ref*sqrt(N), evaluated at every tested N. Label the
      first model's omission of baby-step and precompute/certificate costs as a
      bias toward BSGS. Neither model substitutes for measured D or creates a
      bound. Also report analytic c=0.8862269254527580 only as a source comparison,
      never as a measured constant.
    wall_time: >-
      Wall time and operation count are separate. A wall-time crossover may be
      tabulated descriptively using the identical bracket rule, but cannot replace
      the primary group-operation classification because allocation, hashing and
      language/runtime overhead differ across arms.

  exact_cell_accounting:
    shared_instances: 4 * 2 = 8
    immutable_run_artifacts: 2 * 4 * 2 = 16
    per_execution_positive_budget_comparison_cells: 8 * 3 = 24
    total_positive_budget_comparison_cells: 2 * 24 = 48
    per_execution_unbounded_bsgs_rows: 8
    total_unbounded_bsgs_rows: 16
    per_execution_rho_trial_rows: 8 * 16 = 128
    total_rho_trial_rows: 256
    per_execution_arm_a_rows: 8 * 3 = 24
    total_arm_a_rows: 48
    per_execution_arm_b_rows: 8 * 3 = 24
    total_arm_b_rows: 48
    per_execution_representation_control_records: 3 + 1 = 4
    total_representation_control_records: 8
    total_algorithm_rows: 16 + 256 + 48 + 48 = 368
    artifact_definition: >-
      One run artifact is one (execution,bits,instance_index) bundle containing
      its unbounded BSGS, sixteen rho trials, three Arm A rows and three Arm B rows.
      The four representation controls are execution-level artifacts referenced by
      each of its eight bundles. Retries create new attempts and never overwrite.

  controls:
    blocking:
      - immutable shared-instance manifest and identical instance_id in every arm
      - '[k_hat]P=Q for every solver success'
      - common charged arithmetic wrapper and component-sum equality
      - fixed 16-byte representation hash and exact capacity table
      - E+1 unchanged-buffer probe at all three positive budgets
      - zero-slot 8-byte TABLE_FULL probe
      - Arm A start/refusal exactly agrees with ceil(sqrt(N))<=E
      - Arm B inserts exactly M keys without growth or spill
      - at least 12 of 16 certified rho streams for each compared instance
      - all required operation and memory fields beside every comparison
    descriptive:
      - unbounded BSGS versus rho operation distribution on every shared instance
      - two execution bundles derived from one master seed with disjoint rho domains
      - modeled source proxy and charged model in columns separate from measurement

  invalidation_and_stopping:
    - >-
      A wrong solution, source/instance/representation hash mismatch, hidden table
      growth or spill, failed capacity probe, component-count mismatch, Arm A
      predicate mismatch, or missing memory field makes the affected execution
      completed_invalid and forbids a crossover interpretation.
    - >-
      Fewer than 12 certified rho streams censors that instance and can make a
      bracket inconclusive; it is not evidence for either algorithm.
    - >-
      Timeout, dependency failure, process crash, host loss, or exhaustion of the
      deterministic instance search is failed_infrastructure and asserts nothing
      scientific. Expected CAPACITY_REFUSAL/TABLE_FULL events are controls only in
      their exact predeclared cells.
    - >-
      Stop at the sixteen complete immutable bundles, one-worker/8-GiB machine
      guard, or a blocking representation/solver control failure. Preserve all
      partial rows and reasons. Do not alter budgets, load factor, seed, iteration
      cap, stream-success threshold or crossover rule after observing data.

  budgets:
    scientific_runs_in_this_amendment_task: 0
    future_maximum_run_artifacts: 16
    future_wall_clock_seconds_per_artifact: 3600
    future_total_cpu_hours: null
    future_maximum_memory_gb: 8
    future_maximum_workers: 1
    note: >-
      Fixed cells and table budgets are scientific parameters; the one-worker and
      8-GiB limits protect the machine. Routine cost estimates do not stop the
      active ECC research program, and a watchdog outcome is infrastructure only.

  proof_search_map:
    applicability: empirical calibration of two incumbent algorithms
    exact_baseline_reproduction: >-
      Unbounded BSGS and pinned rho run through one charged group wrapper on the
      same hash-bound known-solution instances, with full component sums and
      solution certificates.
    observation_collision_search: >-
      Table feasibility, table load policy, group operations, hash probes, RSS,
      wall time, rho failures and model extrapolation can each move an apparent
      crossing. They are separate columns and only fully charged operations define
      the primary measured bracket.
    quantifier_order: >-
      Master seed, instances, table bytes, load factor, operation convention,
      stream domains, censoring and adjacent-sign rules are frozen before either
      execution; every declared cell is then retained before classification.
    method_ceiling: >-
      Four toy rungs and three tiny table budgets permit only a local calibration
      or directional bound. They do not determine deployment memory, an asymptotic
      exponent, or whether a baseline is generally suitable.
    nearby_object_control: >-
      The zero-slot table and E+1 immutable-buffer probes are known capacity
      failures. The unbounded table is the nearby object with no declared budget
      cliff. A proof or implementation that treats these identically is invalid.

  derivations_and_source_changes:
    - >-
      Resolved the absent sibling instance manifest by freezing one explicit
      public master seed, candidate-seed derivation, acceptance predicate and
      future cross-experiment manifest binding. No source instance file existed
      to inherit in the supplied snapshot.
    - >-
      Replaced platform-specific RLIMIT/ENOMEM language with a portable physical
      byte-buffer contract: exact 16-byte slots, fixed addressable range, no grow
      path, explicit O state, 0.70 load cap and an unchanged-buffer E+1 test.
    - >-
      Derived exact capacities 0,179,1433,11468 for the four declared budgets and
      distinguished physical slot bytes, allocated bytes per occupied entry, RSS
      and process guard rather than treating them as one quantity.
    - >-
      Defined complete Arm A and Arm B algorithms and kept the feasibility cliff
      separate from the constrained-cost crossover. Defined every sign, equality,
      nonmonotonicity, censoring and replication branch without interpolation.
    - >-
      Froze sixteen rho streams per shared instance and execution, a 12-of-16
      validity threshold, fully charged median cost and exact stream derivation.
    - >-
      Recast the source's forced unbounded-BSGS ordering as a descriptive sanity
      comparison. Solver correctness is a valid blocking control; a particular
      performance ordering cannot be assumed true and then counted as evidence.
    - >-
      Preserved the source N*=(cE)^2 expression only as a separately labeled
      optimistic model and added the discrete charged expression. Neither is an
      observed crossover or a substitute for adjacent measured cells.
    - >-
      Every item above is prospective design or an internal source-state read.
      No algorithm was run, no buffer was allocated, no fixture was searched, no
      control passed, and no numerical performance evidence was produced here.

  frontier:
    dominated_by: null
    dominated_by_check: >-
      The supplied frontier inventory was checked across time, memory and data;
      this record calibrates existing BSGS/rho baselines and proposes no candidate
      algorithm that could be dominated. The field is null for that reason.
    sota_delta: >-
      Zero claimed improvement in time, memory, data or asymptotic exponent. The
      prospective output is a measured toy crossover bracket/bound for a single
      packed representation.
    novelty_status: not_applicable_baseline_calibration

  required_artifacts_for_future_execution:
    - stage0-source-and-supersession-log.md with exact paths and read-scope limits
    - shared-instance-manifest.json with master seed, rejections, certificates and SHA-256
    - representation.json with layout, capacities, source hash and golden encodings
    - execution-plan.json with all 16 bundles and every rho stream seed
    - enforcement-controls.json with before/after length, identity, hashes and lookups
    - solver-source-bindings.json with arithmetic/rho/BSGS blob hashes
    - raw-result.json with all 368 algorithm rows and invalid/censored rows retained
    - operation-accounting.json with component-sum checks
    - memory-accounting.json with table, RSS and process fields beside every arm
    - arm-a-cliff.json with exact predicate and classifications
    - arm-b-crossover.json with per-instance D, medians, brackets/bounds and replication
    - modeled-crossovers.json with source proxy, charged model and optimistic biases
    - manifest.yaml with command, commit, dirty state, host, environment and inference

  completion_and_approval_gate:
    contract_complete: true
    unresolved_mathematical_or_runtime_definitions: []
    implementation_prerequisites:
      - materialize and independently review the shared-instance manifest
      - additively bind EXP-ECDLP-4320a7 to that exact manifest before either sibling runs
      - implement golden slot/overflow/lookup fixtures and charge-accounting checks
      - bind exact solver source hashes and maximum-iteration formula
      - obtain Coordinator approval in a committed additive decision
    approval_statement: >-
      approved_by remains null. The parent Coordinator may approve this complete
      prospective contract under standing user authorization only after snapshot
      and implementation-readiness review. This amendment itself confers no
      execution authority and changes no experiment or hypothesis status.
