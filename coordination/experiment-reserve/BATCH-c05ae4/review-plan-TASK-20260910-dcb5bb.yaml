review_plan:
  claim_under_review: Complete CM cost component conformance and custody before trusted runner integration; no scientific
    claim.
  recorded_before_reviewers: true
  source_snapshot: 3e2a3488d0ee268aa3f907f9e5afe2e802016ba3
  coordinator_prior: The final producer suite passed397/397 after an initial388-control suite with seven interval-lookup
    watchdog failures and one incorrect instability-control construction. This supports independent review readiness
    only. I expect the integer allocation and selection-versus-actual-spend distinction to be largely implemented.
    The highest remaining risks are required-work completeness, partial/resource observations and hard-prerequisite
    conjunctions, scope/owner/context joins, inferred zero values, metadata equality being mistaken for authenticity,
    and source coverage that is narrower than the submitted complete contract. Challenge all of those even where
    a producer test passes.
  joints:
  - joint: complete_cm_cost_component_conformance_and_custody
    assigned_to: TASK-20260910-dcb5bb
    attack_plan: Read the complete frozen effective_contract and source, not just the reported corrections. Independently
      exercise strict carriers, all component/scope/plane/arm/owner relations, candidate origins and prefixes, physical
      and logical identity, overlapping/disjoint/empty captures with arbitrary integers, rollup ownership/completeness,
      resource null pairs and operation observations. Challenge complete edge existence and integer remainders including
      global72-target arm7 initialization, alternative scenario copies and actual-only partial records. Challenge
      normalization after allocation, allsix candidates/eight endpoints/nine strata, winner reuse, actual selection
      spend, mandatory work coverage, and missing or partial facts. Challenge all288/8/36 identities, labelled joint
      omissions, thresholds and crossover prefixes, and the connection into manifest cost/coverage/branch checks.
      In particular, test whether supplied true hard-prerequisite flags can override contradictory retained cost/resource/timing
      observations. Audit fixed metadata/dependency/public-key/companion comparisons without treating them as authentication.
      Independently audit both producer attempts, all785 case starts/results, source versions, changed instability
      construction, extra interval controls, raw outputs, outer calls, PID/reaping and RSS observations. Decode/hash
      embedded payloads as data, compare source hashes to the final snapshot, and identify any unverified completeness
      or custody assertion.
    breaking_artifact: Exact source location plus a fixed independent counterexample, a missing required implementation
      path, or a concrete missing custody binding. Passing the producer suite alone is not a conformance verdict.
  blindness:
    mutual: false
    lifted_for:
    - TASK-20260910-dcb5bb
    rationale: Fresh independent session. First perform the blind arithmetic phase from its statement and the frozen
      contract only, then read the declared producer sources and reports for complete source-aware review. No parent
      conversation or unrelated/concurrent reviewer output.
  proves_too_much:
    assigned_to: TASK-20260910-dcb5bb
    objects:
    - A partial or resource-unaccounted block paired with supplied true validity prerequisites.
    - Balanced supplied allocation groups with a required group omitted.
    - A class label flattened into arbitrary endpoint aliases or a global candidate ordinal treated as a local list
      index.
    - An omitted invalid original block, a swapped LOO label/value, or a global average masking a failing primary
      cell.
    - An omitted evaluator/warmup/capture leaf that becomes zero cost.
    - A source or runtime metadata match treated as authentic authorization, or a changed companion stream that
      still passes.
    - A partial source/case/terminal record represented as complete custody.
    failure_signature: Known-invalid or incomplete data must not acquire a resolved primary result or completed-valid
      cost predicate; metadata/source checks never establish runtime or scientific admission.
  blind_rederivation:
    required: true
    assigned_to: TASK-20260910-dcb5bb
    quantity: For one canonical endpoint, derive candidate scores, selected arm, actual selection spend, scalar/transport
      cold totals and ratio under each supplied artificial parameter set. Explain the two-endpoint class aggregation
      and joint omission rule.
    parameters:
      common: Six candidates2..7, each with34ns fixed selection setup/warmup. Seven identical normalized blocks
        per candidate. Main fixed setup/warmup34ns for each strategy; main transport repeated block25ns. No other
        setup terms in this artificial fragment.
      case_A: Candidate per-block total CPU[30,60,80,100,120,105]ns for arms2..7, each with one repetition. The
        selected scalar main repeated block equals its candidate repeated-work cost.
      case_B: AsA except candidate7 has two repetitions and6ns total per selection block. If selected, its main
        repeated block is105ns with one repetition. Other candidates unchanged.
    blind_from:
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/costs.py
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/allocations.py
