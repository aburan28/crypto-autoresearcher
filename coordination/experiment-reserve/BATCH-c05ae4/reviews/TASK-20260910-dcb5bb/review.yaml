  findings:
  - id: CM-COST-BREAK-001
    severity: major
    joint: complete_cm_cost_component_conformance_and_custody
    title: Existing-rollup validation does not enforce complete required leaf coverage
    contract_source: >-
      effective_contract.cost_contract.raw_cost_tensor.rollups and
      semantic_validation_predicates require exact leaf lists and make omitted
      required rows or groups invalid.
    implementation_source:
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/costs.py:623
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/costs.py:634
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/costs.py:659
    fixed_counterexample: break.rollup_completeness
    observed: >-
      A level_and_multiplicity_certificate rollup referencing only one
      level_source_certificate leaf finalizes successfully while the
      class_multiplicity_certificate and within_pair_isomorphism leaf kinds are
      absent. The code checks that supplied references are allowed and owned;
      it does not establish that the required leaf set is complete.
    consequence: A source-valid incomplete rollup can cross the component finalization boundary without an internal completeness failure.
    required_repair: Bind each rollup to its exact required identity set and reject missing leaf kinds or missing required rollup rows before any complete projection.
  - id: CM-COST-BREAK-002
    severity: critical_for_completed_valid_admission
    joint: complete_cm_cost_component_conformance_and_custody
    title: Supplied true resource/custody prerequisite can override a contradictory retained timing fact
    implementation_source:
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/reducers.py:194
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/reducers.py:750
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/reducers.py:765
    fixed_counterexample: break.resource_prerequisite
    observed: >-
      A complete 35,280-row TimingIndex with exactly one top-control
      resource_accounted=false row retains that row as invalid_input, yet every
      value returned by cost_related_hard_facts is true. An independently
      supplied all-true 14-field prerequisite map therefore reports a true
      conjunction. compare_manifest_costs rejects contradictions only for the
      five names returned by cost_related_hard_facts; resource_accounted is not
      among them.
    consequence: resource_and_custody_receipts_valid=true is not checked against this directly contradictory retained component observation.
    required_repair: Add a retained-resource hard fact covering every required timing/control row and conjunct it with, or explicitly cross-check it against, resource_and_custody_receipts_valid.
  - id: CM-COST-BREAK-003
    severity: major
    joint: complete_cm_cost_component_conformance_and_custody
    title: Partial resource-unaccounted actual-only work can return cost_projection_computed
    implementation_source:
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/allocations.py:210
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/allocations.py:214
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/reducers.py:454
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/reducers.py:458
    - experiments/EXP-ECDLP-1b1b99/implementation/TASK-20260910-2631a0/reducers.py:498
    fixed_counterexample: break.partial_actual_only
    observed: >-
      A partial reporting_and_artifact_publication exclusive leaf with null
      CPU, wall, and RSS receives a single actual-only edge with no issue.
      AllocationReduction skips that edge before its partial-row check and
      reduce_cost_component returns state cost_projection_computed while
      actual_accounting reports one partial/failed row and unavailable CPU.
    consequence: The primary ratios remain unresolved in this minimal object, but the component state overstates the completeness of retained physical accounting and can be paired with supplied true hard flags downstream.
    required_repair: Make any retained partial/failed or required-resource-unavailable physical leaf force an explicit partial/incomplete component state, including actual-only rows.

  proves_too_much:
    verdict: BREAKS
    observed_objects:
    - partial or resource-unaccounted actual-only block paired with a component projection
    - supplied true resource/custody prerequisite paired with a retained false resource observation
    - incomplete certificate rollup represented as finalized internally consistent custody
    held_objects:
