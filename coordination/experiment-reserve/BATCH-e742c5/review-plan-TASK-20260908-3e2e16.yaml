review_plan:
  claim_under_review: Full corrected Tate implementation conformance to frozen public-character protocol and source-bound
    launch prerequisites; no scientific or new mathematical claim.
  coordinator_prior: Implementation readiness remains unresolved. The preceding review exceeded its fixed case allowance
    (64/60) and was released failed. Its observations are not admitted or supplied to this independent successor.
    Review the unchanged archived producer source against the complete frozen protocol. This is an operational recovery,
    not corroboration of the failed session or evidence against the hypothesis.
  recorded_before_reviewers: true
  source_snapshot: 063ea527d88e4515b266d012ce70d5087bb20ff9
  joints:
  - joint: Executable Tate protocol, public-only evaluator isolation, cost/timing matrix and canonical admission/custody
    assigned_to: TASK-20260908-3e2e16
    attack_plan: Trace every frozen obligation and additive approval to concrete executable code and outputs. Inspect
      fixture eligibility/bin assignment, field/T ordering and rejection, real pairing/final exponent, both explicit
      BSGS solvers, separate-process public inputs/verifier labels, every exact/null/injection/coordinate/isotropy
      control, complete seeds/q/seven-block alternation and resolution rules. Verify setup and rejected-candidate
      charges, operation-count honesty, progressive preservation during child or discovery failure, process-group
      memory and atomic canonical publication. Challenge lock/review/source authentication with known-false inputs.
      Independent fixed mocks may replace experimental stages, but must expose missing or false outputs; never run
      the frozen scientific panel. Review the entire corrected package, not only the predecessor findings. Include
      k=1 polynomial reduction, nested unknown/duplicate-key injection at both parent and child boundaries, q=1
      literal-prefix relation to q=64 private labels, actual arm invocation order, all selection/setup/per-cell
      cost keys, bin-and-bit coverage identity, progressive rejection/partial-state retention, evaluator process
      cleanup, and source snapshot -> review archive -> clean executing commit ancestry with altered-source and
      forged-report controls.
    breaking_artifact: A source-bound data-flow defect or bounded independently reproducible counterexample tied
      to a frozen field; distinguish proven defects from untested coverage.
  blindness:
    mutual: false
    lifted_for:
    - TASK-20260908-3e2e16
    rationale: Historical completed and archived reviews named in the original source handoff may be read. The failed
      TASK-20260908-5e2c15 outputs, its source-level findings, parent conversation and any concurrent reviewer reports
      are excluded. The failed release is visible solely to establish operational recovery provenance.
  proves_too_much:
    objects:
    - Trivial chi=1 on prime-order subgroup, where identities hold but no scalar information exists.
    - An encoder returning the withheld scalar, where identity checks alone cannot certify a public interface.
    - A cost ratio excluding field/T construction or the field decoder while curve decoding remains fully charged.
    - One missing selected cell, failed mandatory calibration, or below-resolution block amid favorable ratios.
    - A valid arithmetic cell duplicated into a different required bit/bin slot.
    - Public nested input carrying a withheld scalar or duplicate JSON key.
    - A PASS-looking report bound to other producer bytes or an unreachable review archive.
    - A failure after partial evaluator work that leaves a complete-looking result without failure custody.
    failure_signature: Refuse solved claims for trivial or leaked interfaces and refuse complete-panel positive/negative
      branches on missing or invalid data; all solver-specific work must remain charged.
    assigned_to: TASK-20260908-3e2e16
  blind_rederivation:
    required: false
    quantity: Unchanged reduced Tate character assumptions, explicit field/curve BSGS bounds and complete finite-panel
      charged cost identities.
    parameters: Ordinary selected E/Fp with r prime17..251, r!=p,v_r(#E)=1,k=ord_r(p) in bins1,2,3..6,7..12; arbitrary
      extension point T selected for defined nontrivial chi(G), not its r-projection; m=ceil(sqrt(r)), baby powers0..m-1
      and giants0..m, final curve certificate; pblocks8,10; q1,64; target seeds606223,606227; source calibrationp103,E[1,18],G(33,91),r19,k6.
      Full definitions and charges in frozen specification/blind input.
    blind_from: []
    assigned_to: TASK-20260908-3e2e16
    prior_review_task: TASK-20260907-79fbff
    prior_archive_commit: ef9ba9a303209894d7735ed8d4de6072fd1e5b55
    not_repeated_reason: The prior independent blinded derivation passed on the same frozen statement. This fresh
      session checks corrected implementation conformance; it does not assert a new blind rederivation or scientific
      validation.
  procedure_deviations: []
  scope_limit: A valid independent implementation-conformance report on the unchanged archived source. Zero scientific
    runs, no launch or mathematical status verdict. Failure of the earlier review remains failure; this successor
    never reclassifies it completed.
