blind_input:
  source_path: experiments/EXP-ECDLP-910fcd/specification.yaml
  source_sha256: 75148fa8dc182d14f0894b3e525418c72fc939338b6a60d2c07cd2fc9df32555
  provenance: internal; literal extraction of frozen statement only; no implementation or producer narrative.
  quantity_statement:
    inputs:
      fixtures: "For each b in [8,10], enumerate the first32 primes p>=2^b and E:y\xB2=x\xB3+x+B for B=0..15 in\
        \ that order. Discard singular or supersingular E. Factor N; consider prime divisors r in decreasing order\
        \ with 17<=r<=251, r!=p and v_r(N)=1. Compute k=ord_r(p). For each bin [1],[2],[3..6],[7..12], choose the\
        \ first eligible (p,B,r) in each b block; a curve may supply only one bin, assigned to its first qualifying\
        \ divisor. No timing-based selection. Eight fixtures total; report all k>12 exclusions with representation\
        \ lower bound k*ceil(log2 p) bits but do not construct those fields."
      generator: Scan x=0..min(p-1,4095), both roots in increasing integer order, take first nonzero [N/r](x,y).
        Certify [r]G=O. All search costs charged.
      field: For k=1 use Fp. Otherwise enumerate monic degree-k polynomials by increasing integer I=sum_(j=0..k-1)
        a_j p^j, with constant a0 least significant; skip a0=0 without counting a tested candidate. Test at most4096
        remaining polynomials for irreducibility and select first irreducible. Archive all tested I, modulus and
        irreducibility certificate. This ordering varies the constant coefficient first; it does not scan the a0=0
        hyperplane. Construct a fixed polynomial-basis field. Encode each a_j in exactly ceil(log2(p)/8) big-endian
        bytes, constant coefficient first.
      second_argument: "From SHA256 rejection sampling seed606211 and the fixture tuple, generate at most128 uniform\
        \ x-coefficient vectors in Fp^k; take the lexicographically smaller y square root when available and skip\
        \ nonsquares. Use T itself, not its r-torsion projection. Accept first defined \u03C7(G)=t_r(G,T) with \u03C7\
        (G)^r=1 and \u03C7(G)!=1. Pairing poles/exceptional divisors must be handled by documented shifted divisors\
        \ or recorded candidate rejection, never silently replaced by zero. Archive T, every attempt and final exponent."
      targets: For q=1,64 generate labels a uniformly in0..r-1 with seeds606223,606227; producer evaluator receives
        only Q=aG and public G,T,r,k,p,modulus. Labels and exhaustive reference table are held by verifier only.
        q=1 is prefix of q=64. Query repetition permitted and logged; prohibit per-target result caching.
      unavailable_fixture: Missing bin, exhausted polynomial/T/point search, pairing backend refusal or preparation
        cap => partial/inconclusive. Never widen k/r/search caps or swap a special curve. Source-documented example
        p=103,E=[1,18],G=(33,91),r=19,k=6 is a mandatory independent calibration fixture, not a replacement for
        missing selected cells.
    controls:
    - id: exact_character
      description: "For every fixture and documented calibration, \u03C7(O)=1, \u03C7(G)^r=1, \u03C7(G)!=1 and \u03C7\
        ([a]G)=\u03C7(G)^a for all a=0..r-1. Exhaustive table restricted to verifier; evaluator is a separate process/input\
        \ manifest. These identities are expected controls, not novel findings."
    - id: null_and_injection
      description: "Trivial \u03C7=1 must return ambiguous/no-information, never solved. A deliberately dishonest\
        \ encoder returning the withheld scalar must be caught by input-access audit even though identities pass.\
        \ A single flipped coefficient in a known character value must fail at least one exact check."
    - id: base_field_isotropy
      description: 'For k>1 repeat reduced Tate with base-field T=G: it must be trivial in this rational subgroup
        setting. Record Weil e_r(G,G)=1 separately; do not assume reduced Tate self-pairing trivial when k=1. Extension
        T nontrivial control must succeed before interpreting a null.'
    - id: coordinates
      description: "Transport equation/G/Q/T by u=2 scaling (x,y)\u2192(u\xB2x,u\xB3y), build the associated curve\
        \ over both fields and verify decoded scalar unchanged. Character values may depend on implementation normalization;\
        \ compare identities and decoded scalars, not unproved byte equality."
    - id: full_decoder
      description: Explicit BSGS table size m=ceil(sqrt(r)), powers indexed0..m-1, giant steps0..m, exact collision
        check and final curve verification. Same algorithm structure for additive curve BSGS. Return no-solution
        if bounds exhausted; library discrete_log and precomputed full tables prohibited.
    metrics:
      primary:
      - Rq=complete curve-BSGS CPU / complete character-transfer-BSGS CPU, per fixture and seed; q=64 primary, q=1
        separate.
      secondary:
      - Field construction, T search, Miller+final exponent, decoder preprocessing/query and curve verification
        CPU/wall; field/group operation counts; peak RSS; BSGS table bytes and output bytes.
      - Fraction of total CPU in decoder, field/T setup and character evaluator; exact output cardinality and count
        of certificate failures.
    cost_model: "Primary Tcharacter(q)=Cshared+Cfield+CsearchT+C\u03C7G+CBSGS_field_table+sum_q(C\u03C7Q+Cfield_giant_steps+Ccurve_verify);\
      \ primary Tcurve(q)=Cshared+CBSGS_curve_table+sum_q(Ccurve_giant_steps+Ccurve_verify). Cshared is the entire\
      \ deterministic fixture selection, point count/factorization, generator search and input validation cost,\
      \ split equally over the eight selected fixtures and included identically in both arms; retain rejected-candidate\
      \ work and report the allocation. Field/T setup belongs uniquely to character arm. A secondary table may cancel\
      \ Cshared explicitly. Query-generation and exhaustive validation tables are shared experimental scaffolding,\
      \ reported and charged to run budget separately, never supplied to either solver. Report measured components\
      \ and modeled q-amortization separately; no NFS extrapolation or hidden scalar oracle."
    replication:
      seeds:
      - 606211
      - 606223
      - 606227
      independent_instances: 8
      timing: Seven alternating-order blocks per cell, repeat full q-workload until>=0.1 CPU sec or100 repeats;
        report all blocks, median and repetitions. Setup charged once per q batch. Target seeds are replication,
        not new independent curves.
    success_criterion: All eight selected cells and source calibration valid; at least one embedding-degree bin
      satisfies R64>=1.20 in both bit blocks and both seeds. This is only a baseline interface/cost crossover and
      requires independent verification.
    falsification_criterion: All eight cells valid and R64<=1 in every cell and both seeds. This rules out an amortized
      saving for this concrete measured interface/decoder at this panel, not new characters. Other complete data
      patterns are inconclusive for the>=20% hypothesis.
    operation_count_rule: Only explicitly instrumented arithmetic yields measured operation counts. Opaque Sage/PARI/library
      arms report operation counts unavailable, plus measured CPU/wall/RSS; never infer exact counts from elapsed
      time. The primary comparison is CPU, using the same process/backend and declared timing convention.
    randomness:
      hash: SHA256, UTF-8 bytes of JSON.stringify([experiment_id,purpose,[p,A,B,r,k,u,arm],seed,counter]); JSON
        has no whitespace; integers decimal; unused numeric tuple fields0; seed and counter are nonnegative integers.
        Read digest as unsigned256-bit big-endian integer. Separate counter starts0 for each complete tuple excluding
        counter.
      uniform: To draw uniform integer in[0,n), reject digest >= floor(2^256/n)*n; increment counter on every digest
        including rejection; accepted output is digest mod n. For n=1 output0 and consume one digest. No platform
        PRNG or modulo-biased draws.
      purposes: Use exactly query for input scalars, control for random control scalars, field_x for extension point
        coordinates, target for spectral target scalar, shuffle for Fisher-Yates. Each list follows increasing query/control/coordinate
        index. Arm is0 except shuffled partitions1..7. Scalar timing seed is the declared seed. Fixture selection
        has no randomness.
      shuffle: Fisher-Yates starts from canonical sorted input and for i=n-1 down to1 draws j uniformly in[0,i],
        then swaps entries i,j. Curve subgroup point order is infinity first, then increasing integer x and y; extension
        coefficient-vector order is increasing integer sum_j a_j p^j.
      pairing: For query/control/field_x/target streams, use original unscaled curve coefficients A,B with u=0 and
        arm=0 so coordinate models share the same underlying sampled inputs. For shuffle use original A,B and actual
        u in1,2,3 and actual arm1..7. In all cases k is actual embedding degree for character experiment and0 otherwise.
        Counter persists globally for each complete stream tuple across all calls; never reset between draws. Spectral
        target is selected once per fixture/seed before any u or shuffle. Volcano floor-specific A,B are original
        normalized floor coefficients; query lists for coordinate variants are exact transports of the same samples.
