    producer exhausted its 20 fixed cases; it explicitly records final corrected runner untested and protocol_complete:false.
    Independent review should determine complete matrix execution, actual field/T/decoder algorithms, label isolation,
    cost allocation and canonical progressive custody. The separate mathematical joint must verify the character
    assumptions and finite-panel cost branches from the frozen statement without reading the implementation.'
