      to a frozen field; distinguish proven defects from untested coverage.
  - joint: Blind Tate-character injectivity/isotropy conditions, explicit decoder completeness and full-cost finite-panel
      decision
    assigned_to: TASK-20260907-79fbff
    attack_plan: From the frozen statement alone derive conditions for chi([a]G)=chi(G)^a and nontriviality/injectivity
      on prime r subgroup, effect of extension argument T and reduced final exponent, and base-field T=G isotropy
      for k>1 without assuming k=1 self-pairing trivial. Derive explicit multiplicative and additive BSGS bounds
