      setup, query and final curve verification. Audit complete-panel positive/negative quantifiers, calibration
      and timing-resolution eligibility. Build known-false trivial-character, leaked-label, missing-final-exponent/omitted-decoder-cost
      and missing-cell counterexamples. No producer source or report may be read.
    breaking_artifact: Exact algebraic assumption, finite decoder counterexample, arithmetic cost table or quantifier
      counterexample changing validity or branch.
