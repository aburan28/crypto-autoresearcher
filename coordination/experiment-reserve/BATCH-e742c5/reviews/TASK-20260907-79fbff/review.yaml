  claim_under_review: >-
    Readiness of the prospective public Tate-character interface and full
    decoding-cost calibration implementation. No scientific run,
    novel-character claim, complexity claim, or launch decision is reviewed.
  joint_owned: >-
    Blind Tate-character injectivity/isotropy conditions, explicit decoder
    completeness and full-cost finite-panel decision.
  owned_joint_verdict: PASS
  plan_joint_result: holds
  verdict_scope: >-
    PASS means the frozen statement supplies mathematically sufficient
    conditions and unambiguous finite-panel branch quantifiers for this owned
    joint. It does not say that any producer implemented those conditions, that
    any fixture exists, that any timing is valid, or that either empirical
    branch is true.
  objections: []
  assumptions_and_admission_conditions:
    - >-
      The pairing is the reduced Tate-Lichtenbaum pairing over
      K=F_(p^k): t_r(P,T)=f_(r,P)(D_T)^((p^k-1)/r), evaluated on a divisor D_T
      disjoint from the Miller divisor. A pole, zero, or exceptional divisor is
      a rejected T attempt rather than a field value.
    - >-
      G is nonzero and [r]G=O with prime r, hence has exact order r. The
      accepted g=chi(G) satisfies g^r=1 and g!=1, hence also has exact order r.
    - >-
      T is used as a representative of E(K)/rE(K). It need not be r-torsion.
      The same accepted T and the same final exponent are used for G and every
      Q in a cell.
    - >-
      Multiplicative and additive BSGS use canonical exact element equality,
      canonicalize the collision exponent modulo r into [0,r-1], and accept it
      only after both the group-side equality and final [a]G=Q verification.
    - >-
      CsearchT includes all rejected point, square-root, divisor-handling,
      Miller, and final-exponent work. If the accepted chi(G) evaluation is
      reported as CchiG, that exact accepted evaluation is excluded from
      CsearchT to prevent double charging; every other accepted-T selection
      cost remains charged once.
    - >-
      Setup is charged once per declared cold q-batch and is not multiplied by
      timing repetitions. If one physical setup is reused across target seeds
      or q values, its allocation is declared rather than silently charged
      zero times or multiple times.
  required_controls:
    - >-
      Reject g=1 before decoding. Homomorphism identities alone all pass for
      the trivial character, while no scalar information is present.
    - >-
      Enforce a separate evaluator process and public-input manifest containing
      Q,G,T,r,k,p,modulus but no scalar label or exhaustive verifier table. An
      encoder that receives a is not certified by correct output identities.
    - >-
      Archive and apply the exact final exponent (p^k-1)/r. The non-reduced
      Miller value is not generally in mu_r and cannot be used as a certified
      BSGS base merely because selected outputs happen to pass.
    - >-
      Charge field construction, all T attempts, accepted chi(G), field baby
      table, every chi(Q), field giant steps, and final curve verification to
      the character arm; charge curve table, curve giant steps, and the same
      final curve verification to the curve arm; include identical allocated
      deterministic fixture-selection cost in both primary totals.
    - >-
      Refuse positive and negative complete-panel branches when any selected
      cell is absent, mandatory calibration is invalid, an exact control fails,
      or a timing block remains below resolution after 100 repeats.
  counterexample_or_mutation:
    - id: trivial-character
      result: >-
        chi(P)=1 satisfies chi([a]G)=chi(G)^a and chi(G)^r=1 for every a, but
        fails chi(G)!=1 and must return ambiguous/no-information.
    - id: leaked-label
      result: >-
        An evaluator supplied a can return a and pass all decoded-scalar and
        character identities. Only the input-access boundary detects this.
    - id: missing-final-exponent
      result: >-
        In the cyclic group F_(103^6)^* of order 1194052296528, a raw generator
        has order 1194052296528, not 19. Raising by 62844857712 produces an
        element of exact order 19. Omitting reduction is therefore not
        justified by the Miller value alone.
    - id: omitted-decoder-and-setup-cost
      result: >-
        A fixed arithmetic table gives Tcurve=222 and fully charged
        Tcharacter=346, so R=0.6416184971. Omitting field/T/table/giant costs
        gives Tcharacter=138 and R=1.6086956522, reversing the >=1.20 branch.
    - id: crossed-bin-quantifier
      result: >-
        Ratios >=1.20 in bin 1 only for b=8 and in bin 2 only for b=10 do not
        witness the existential. One common embedding-degree bin must satisfy
        all four bit-block/seed inequalities.
  baseline_comparison:
    multiplicative_bsgs: >-
      With m=ceil(sqrt(r)), store g^j for 0<=j<m and inspect
      h*(g^(-m))^i for 0<=i<=m. The table has m entries. A valid target is found
      by i<=m-1; the declared exhausted loop has at most m+1 lookups and m
      giant multiplications after initialization. Preprocessing needs at most
      m multiplications to obtain g^0 through g^m plus one inversion when the
      giant factor is formed that way.
    additive_bsgs: >-
      Store [j]G for 0<=j<m and inspect Q-[im]G for 0<=i<=m. The table has m
      entries. A valid target is found by i<=m-1; the declared exhausted loop
      has at most m+1 lookups and m additions/subtractions after
      initialization. Repeated-addition preprocessing uses m-1 additions for
      the baby table and one more for [m]G.
    classical_scope: >-
      Both are explicit O(sqrt(r))-time, O(sqrt(r))-memory BSGS decoders on the
      same order-r discrete logarithm. No Pollard-rho, NFS, asymptotic, or
      cryptographic-scale advantage follows from this finite comparison.
  heuristic_challenges: []
  cost_model_challenges:
    - >-
      A favorable ratio is inadmissible if Cfield, rejected T candidates,
      accepted chi(G), the field decoder table, field giant steps, or final
      curve certificates are omitted. The fixed arithmetic mutation above
      demonstrates a branch reversal.
    - >-
      Timing repeats measure one q-workload. Query time is normalized by the
      repetition count, while setup remains charged once; multiplying setup by
      repeats or amortizing it away changes the registered quantity.
    - >-
      Cshared is the entire deterministic selection/generator/input-validation
      cost divided by eight. It must be retained identically in both primary
      arms even though a secondary delta may cancel it algebraically.
    - >-
      Opaque Sage/PARI paths cannot acquire invented operation counts. CPU,
      wall, RSS, and explicitly instrumented counts remain separate fields.
  reduction_and_scope_challenges:
    - >-
      The only algebraic transfer is from Q=[a]G to chi(Q)=chi(G)^a for an
      already accepted nontrivial Tate character. This is an interface
      calibration and does not construct a new character or lower a generic
      ECDLP exponent.
    - >-
      The source calibration fixture is a mandatory functional control and
      cannot replace any of the eight selected cells or witness a cost branch.
    - >-
      A failed field/T search is a partial/inconclusive preparation outcome,
      not evidence against Tate nondegeneracy or an empirical negative branch.
  proof_architecture_challenges:
    - control: proves-too-much/trivial-character
      outcome: rejected_by_nontriviality_gate
    - control: proves-too-much/leaked-label
      outcome: rejected_only_by_public-input-audit
    - control: proves-too-much/omitted-cost
      outcome: rejected_by_fully_charged_denominator
    - control: proves-too-much/missing-or-invalid-panel-data
      outcome: rejected_by_complete-panel-validity_predicate
  finite_panel_decision:
    valid_predicate: >-
      V means exactly eight selected fixtures exist; mandatory calibration and
      all exact controls are valid; both target seeds and both q workloads are
      present as required; all seven alternating blocks are reported; and no
      mandatory primary timing remains below 0.1 CPU second after 100 repeats.
    positive: >-
      V and there exists one bin z in {1,2,3..6,7..12} such that for every
      b in {8,10} and s in {606223,606227}, R64(b,z,s)>=1.20.
    negative: >-
      V and for every b, z, and s, R64(b,z,s)<=1. Other complete data patterns
      are inconclusive for the >=20 percent hypothesis.
    boundary_notes:
      - R64=1.20 qualifies for the positive inequality.
      - R64=1 qualifies for the negative inequality.
      - q=1 is reported separately and does not replace the q=64 primary test.
      - A failed exact control makes the affected experiment invalid rather
        than positive or negative.
  decoder_certificate_requirements:
    fixture:
      - p,A,B,N and factorization evidence for prime r, r!=p and v_r(N)=1
      - k=ord_r(p), bin assignment, ordinary/nonsingular checks
      - nonzero G with [r]G=O
      - field modulus, candidate trace and irreducibility certificate
      - every T attempt, divisor/pole disposition and exact final exponent
      - g=chi(G), g^r=1, g!=1 and exhaustive exact-character table
    target:
      - public evaluator input manifest and separately held verifier label
      - canonical h=chi(Q), m, table size and collision indices i,j
      - exact h*g^(-im)=g^j or exact Q-[im]G=[j]G equality
      - canonical a=(im+j) mod r with g^a=h
      - final [a]G=Q verification and no-solution record on exhaustion
    cost:
      - every measured component in both primary formulas
      - seven block values, order, repetitions, medians and resolution status
      - CPU/wall/RSS, table bytes, output bytes and only instrumented op counts
