  control_checks:
    - control: degree_one_field_preparation
      status: NEEDS_CORRECTION
      counterexample: >-
        X+1 over F5 is irreducible, but
        rabin_irreducibility_certificate(5,(1,)) returns irreducible:false and
        select_certified_modulus(5,1) exhausts. driver.py lines 96-112 compare
        X^(p^k) mod f with unreduced X; for k=1, X must also be reduced modulo
        f. The frozen specification line 43 requires direct Fp for k=1, so the
        mandatory k=1 bin cannot execute.
    - control: public_only_input
      status: NEEDS_CORRECTION
      counterexample: >-
        PublicEvaluatorInput({},0,Q,{"opaque_verifier_value":7}) passes
        audit_public_input while carrying withheld value 7. driver.py lines
        181-183 implement a substring blacklist over arbitrary fixture/context
        mappings rather than an allowlisted typed schema. The evaluator-stdin
        entrypoint also checks forbidden keys only at the top level.
    - control: dishonest_encoder
      status: NEEDS_CORRECTION
      detail: >-
        driver.py lines 309-315 inserts a label into a local dict, directly
        detects the literal key, raises its own ValueError and records success.
        It never sends that dishonest object through audit_public_input or the
        evaluator child, so the known-false control is tautological and does
        not test the claimed isolation boundary.
    - control: exact_character
      status: UNCHECKABLE
      detail: >-
        Source contains exhaustive identities and a nontriviality check, but
        the handoff forbids executing the frozen pairing/control panel. The k=1
        preparation defect prevents complete executable coverage regardless.
    - control: base_field_isotropy
      status: UNCHECKABLE
      detail: >-
        Source contains a k>1 branch, but the frozen mathematical/pairing
        control was deliberately not run and this joint does not own the blind
        algebraic derivation.
    - control: coordinates
      status: UNCHECKABLE
      detail: >-
        Source transports G, T, shift and Q at u=2 and compares decoded
        scalars, but no frozen control ran. Only the data flow was inspected.
    - control: null_character
      status: PASS
      detail: >-
        bounded_multiplicative_bsgs refuses base one as NoSolution before the
        predecessor BSGS call. This narrow source check does not cure the
        dishonest-input control.
    - control: missing_complete_panel
      status: NEEDS_CORRECTION
      counterexample: >-
        With build_future_fixtures mocked to return one selected cell and no
        calibration, execute_authorized_run emits completed_pending_review.
        There is no cardinality, eight-cell, two-seed, mandatory-calibration or
        complete-control gate before driver.py line 380, contrary to
        specification lines 46 and 120-121.

  protocol_checks:
    - obligation: fixture_selection_and_exclusions
      status: NEEDS_CORRECTION
      detail: >-
        The predecessor returns the first 32 primes and the final selector uses
        deterministic p/B/r order, v_r(N)=1 and one bin per curve. However,
        driver.py lines 237-258 retain only selected fixtures and high-k rows,
        not singular, supersingular, nonqualifying or generator-search rejects
        required by specification line 139. It also stops after all four bins
        are found and therefore does not retain all high-k exclusions from the
        remaining primes in the declared 32-prime block.
    - obligation: second_argument_attempts
      status: NEEDS_CORRECTION
      detail: >-
        extension_point_candidates lines 134-142 silently drop every nonsquare
        x attempt; bounded_t_search records only yielded point/shift pairing
        attempts. The frozen line 44 requires every bounded attempt and final
        exponent to be archived.
    - obligation: pairing_and_final_exponent
      status: PASS
      detail: >-
        The hash-verified predecessor implements a binary shifted-divisor Miller
        quotient at lines 150-163 and reduced_tate applies (p^k-1)/r at lines
        373-378. The final driver calls both at lines 151-164. This is static and
        tiny-unit coverage only, not a calibration or proof of all pairing
        cases.
    - obligation: explicit_bsgs
      status: PASS
      detail: >-
        The hash-verified predecessor implements baby exponents 0..m-1, giant
        steps 0..m, candidate bound below r and final verification for both
        multiplicative and additive BSGS at lines 390-430. Tiny producer cases
        for each passed. Cost separation and complete-panel behavior still
        break.
    - obligation: fixed_targets_and_q_prefix
      status: NEEDS_CORRECTION
      detail: >-
        driver.py lines 281-295 draw a new label inside every
        repeat/block/q/query loop using one advancing stream. The q=1 target is
        not the prefix of the q=64 target list, and timing repeats do not replay
        the same fixed workload as required by specification line 45.
    - obligation: seven_block_alternation
      status: NEEDS_CORRECTION
      detail: >-
        Raw rows label odd blocks character_first and even blocks curve_first,
        but _evaluate_public_payload lines 190-198 always performs curve BSGS,
        pairing, then field BSGS. No execution branch consumes block/order, so
        the recorded alternation is false.
    - obligation: timing_resolution
      status: NEEDS_CORRECTION
      detail: >-
        The >=0.1 CPU rule at lines 278 and 296-297 uses the parent process
        process_time while the solver work runs in children. It measures parent
        spawn/serialization overhead rather than the declared solver workload;
        all-block medians and per-block timings are absent.
    - obligation: failure_semantics
      status: NEEDS_CORRECTION
      counterexample: >-
        Mocked SearchExhausted("missing frozen fixture bin") is recorded as
        status failed and classification invalid_measurement at lines 385-386,
        with no retained partial fixture progress. Frozen line 46 requires
        missing bin or exhausted polynomial/T/point search to be
        partial/inconclusive, asserting nothing adverse about the measurement
        or hypothesis.

  cost_model_checks:
    - check: shared_and_field_setup
      status: NEEDS_CORRECTION
      detail: >-
        driver.py line 277 assigns the identical field_done-began interval to
        both fixture_selection and field_construction. It omits the global
        build_future_fixtures time and does not split the full shared selection
        cost equally over eight fixtures as specification line 70 requires.
    - check: decoder_preprocessing_and_query
      status: NEEDS_CORRECTION
      detail: >-
        chi_g, field_table and curve_table are never incremented. Whole BSGS
        calls are charged to giant-step fields on every query, so one-time table
        setup and per-query work are not separated. Field/curve reconstruction
        in the child occurs before its c0 timer and is uncharged.
    - check: q_cell_seed_matrix
      status: NEEDS_CORRECTION
      detail: >-
        costs.csv contains one aggregate ChargingLedger row across all cells,
        seeds and q values. No Rq per fixture/seed, q=1 versus q=64 split,
        block values, medians, modeled amortization or decision-branch inputs
        can be reconstructed.
    - check: units_operations_and_memory
      status: NEEDS_CORRECTION
      detail: >-
        No instrumented field/group operation counts or explicit unavailable
        markers, wall components, peak RSS, BSGS table bytes or output bytes are
        emitted. This does not satisfy specification lines 66-70, 139-140.

  admission_and_custody_checks:
    - check: runtime_policy
      status: NEEDS_CORRECTION
      counterexample: >-
        With openssl mocked to return a valid signature, verify_launch_lock
        accepted runtime {provider:"Amazon Bedrock", model_verified:false,
        resolved_model_id:"bedrock/mock"}. driver.py line 333 checks only that
        runtime is a mapping. The mandatory Bedrock refusal and runtime
        verification are absent.
    - check: signed_payload_completeness
      status: NEEDS_CORRECTION
      detail: >-
        The required lock fields at line 329 do not bind
        IMPLEMENTATION_APPROVAL_ID, the transitive predecessor hash/snapshot,
        the allocated run id, implementation commit or dirty-tree state.
        run_id is passed separately at line 407. A valid signature therefore
        does not authenticate the full executing source closure or canonical
        run identity.
    - check: lock_temporary_files
      status: NEEDS_CORRECTION
      detail: >-
        Lines 337-341 write fixed .lock-payload and .lock-signature names in the
        caller-supplied lock directory before openssl. Concurrent verifications
        can race, and pre-existing files or symlinks can be overwritten and then
        unlinked. Use exclusive private temporary files with restrictive mode.
    - check: main_resource_enforcement
      status: NEEDS_CORRECTION
      detail: >-
        _limit_child sets address-space and process limits only for evaluator
        children. The main fixture/pairing/control process has no 8 GiB limit,
        wall/CPU watchdog, peak-RSS monitor, signal checkpoint or harness
        wrapper. Merely comparing RESOURCE_LIMITS in a signed map does not
        enforce them.
    - check: timeout_process_group
      status: NEEDS_CORRECTION
      counterexample: >-
        subprocess.run starts a new session, but TimeoutExpired is converted to
        RunInterrupted without killpg. The bounded mock confirmed that no
        process-group kill occurs, contradicting line 208's detail that the
        group was terminated.
    - check: manifest_reproducibility
      status: NEEDS_CORRECTION
      detail: >-
        driver.py line 389 permits null commit/dirty/RSS, records process
        lifetime CPU that excludes child CPU, leaves result.metrics empty, uses
        float timestamps, and records a command omitting the public key,
        execution plan, run id and run root. Status values
        completed_pending_review/failed/cancelled also do not match the frozen
        lifecycle terminal vocabulary.
    - check: dispatch_and_ledger_tools
      status: NEEDS_CORRECTION
      detail: >-
        The pinned dispatcher validates queue read/write scopes and archival
        chains but does not validate handoff.source_bindings. The pinned ledger
        validator validates review-plan shape but likewise does not authenticate
        those bindings. Manual git-show verification succeeded here; a
        known-false changed source binding would not be rejected by these
        pinned gates. Source authentication remains an unchecked human
        obligation until a dedicated gate is added.

