validation_report:
  id: TASK-20260908-3e2e16
  task_id: TASK-20260908-3e2e16
  role: validator
  experiment_id: EXP-ECDLP-910fcd
  source_snapshot: 063ea527d88e4515b266d012ce70d5087bb20ff9
  source_task_id: TASK-20260908-ccfc14
  claim_epoch: 1
  claim_publication_commit: 02191e661e
  authority_commit: '2538725039'
  claim_owner:
    holder: coordinator-reserve-admission-20260907
    session_id: 01a07d92-d309-7620-9947-a358afc60883
  claim_under_review: >-
    Full corrected Tate implementation conformance to the frozen
    public-character protocol and source-bound prospective admission
    prerequisites. No scientific result, launch decision, mathematical status,
    or whole-claim verdict is reviewed.
  joint_owned: >-
    Executable Tate protocol, public-only evaluator isolation, cost/timing
    matrix and canonical admission/custody.
  owned_joint_verdict: NEEDS_CORRECTION
  plan_joint_result: breaks
  verdict: failed
  verdict_scope: >-
    The archived source does not conform to several frozen implementation,
    cost, complete-panel, failure-custody, and review-authentication
    obligations. This is only an implementation-conformance finding on the
    assigned joint. It says nothing about the Tate-character hypothesis or any
    future scientific measurement, and it is not a launch/status decision.

  run_ids: []
  scientific_runs_reviewed: 0
  scientific_runs_executed: 0
  metric_recomputations: []
  metric_recomputation_status: not_applicable_no_scientific_run

  artifact_checks:
    - check: declared_source_bindings
      status: PASS
      detail: >-
        Before source review, all 40 handoff source bindings existed and matched
        their declared SHA-256 values. The seven corrected producer paths match
        both the handoff and the snapshot receipt. A later concurrent merge
        changed only live tools/research_dispatch.py; the exact bound bytes were
        retained at authority commit 2538725039 and were used here as required.
    - check: coordinator_snapshot
      status: PASS
      detail: >-
        Commit 063ea527d88e4515b266d012ce70d5087bb20ff9 is reachable from the
        reviewed HEAD, has declared parent
        58616f3c7d02ca723dab888794cfd2319bcba8a5, changes the seven producer
        artifacts plus TASK-20260908-16ec11/snapshot.json, and its seven
        producer blobs match the receipt hashes.
    - check: reviewed_source_unchanged_after_snapshot
      status: PASS
      detail: >-
        Git diff from source snapshot 063ea527d88e4515b266d012ce70d5087bb20ff9
        over all seven corrected producer paths was empty during review.
    - check: failed_predecessor_exclusion
      status: PASS
      detail: >-
        No TASK-20260908-5e2c15 review.yaml, checks.py, check-receipt.json,
        source-level finding, or report content was read. Its release record was
        read only for the explicitly permitted operational provenance. A Git
        status listing exposed the three predecessor filenames but not their
        contents.

  implementation_checks:
    - check: degree_one_rabin_and_explicit_decoders
      status: PASS
      detail: >-
        Fixed arithmetic cases confirm the corrected reduced-X Rabin comparison
        accepts irreducible linear polynomials, retains a higher-degree gcd
        witness, rejects a reducible quadratic, and both explicit BSGS solvers
        recover fixed synthetic targets with the declared baby/giant bounds.
        The trivial multiplicative base is refused.
    - check: shifted_tate_and_final_exponent_data_flow
      status: PASS_STATIC_ONLY
      detail: >-
        The corrected driver calls the hash-bound predecessor's shifted-divisor
        Miller quotient and reduced_tate final exponent path. This is source
        tracing only; the handoff prohibited a pairing or calibration execution.
    - check: public_label_isolation
      status: PASS_WITH_SCHEMA_DEFECTS_BELOW
      detail: >-
        The public input has exact object-key allowlists, no label-bearing field,
        and global duplicate-key rejection. Fixed top-level, nested-context, and
        nested-query unknown/duplicate mutations were rejected by the parent
        audit and invalid nested mutations were rejected by the child entry
        before arithmetic. Fixed mocks confirm both executable arm orders.
    - check: fixed_q_prefix
      status: PASS
      detail: >-
        fixed_q64_labels creates one deterministic 64-label sequence per
        fixture/seed and _future_cell uses labels[:q], making q=1 the literal
        prefix replayed across blocks.
    - check: operation_count_honesty
      status: PASS
      detail: >-
        The evaluator reports field and group operation counts as
        unavailable_uninstrumented instead of deriving counts from time, and
        emits child CPU component, wall, RSS, table-byte, and output-byte keys.
    - check: evaluator_process_cleanup
      status: PASS_NARROW
      detail: >-
        Source starts evaluator children in a new session and timeout/RSS paths
        call _kill_process_group; a fixed mock confirms SIGTERM targets the
        process group. No real child, timeout, RSS excursion, or signal was run.
    - check: canonical_atomic_publication
      status: PASS_NARROW
      detail: >-
        A temporary fixed mock package moved one same-filesystem partial
        directory to its canonical directory once and wrote all twelve declared
        paths. This does not establish fsync/crash durability and exposes the
        unbound progress.json issue below.

  control_checks:
    - control: public_canonical_field_encoding
      status: NEEDS_CORRECTION
      counterexample: >-
        validate_public_payload accepts context.A=[6] for p=5 and returns the
        unreduced [6], while the child later reduces it to [1]. It also accepts
        fixture.A=1 with context.A=[2]. PublicEvaluatorInput serializes JSON
        integer arrays and contains no exact ceil(log2(p)/8)-byte big-endian
        coefficient encoder. Thus the closed key schema does not enforce the
        frozen canonical field encoding or one authenticated curve context.
    - control: exact_and_scalar_isolation_order
      status: NEEDS_CORRECTION
      detail: >-
        _future_cell executes the complete repeated q=1/q=64 workload before
        exact_character, isotropy, null/injection, flip, and coordinate controls.
        The frozen stopping rule requires the first exact or scalar-isolation
        failure to stop the affected experiment as invalid, preserving attempts.
    - control: base_field_isotropy
      status: NEEDS_CORRECTION
      detail: >-
        isotropy_control records the reduced Tate rational self-pairing for k>1
        but the source contains no separate Weil e_r(G,G)=1 record required by
        the frozen control. The pairing part was not executed in this review.
    - control: complete_control_gate
      status: NEEDS_CORRECTION
      counterexample: >-
        Sixteen synthetic cell records and a calibration containing only
        exact_character.all_powers, dishonest_encoder.passed, and
        full_decoder.curve_verified pass validate_panel_coverage while omitting
        chi(O), nontriviality, trivial-character ambiguity, flipped-value,
        isotropy, coordinate, final-exponent, and decoder-detail checks.

  protocol_checks:
    - obligation: fixture_one_bin_per_curve
      status: NEEDS_CORRECTION
      detail: >-
        build_future_fixtures continues across every qualifying divisor of one
        curve and appends every not-yet-filled bin; it has no per-curve stop
        after the first qualifying divisor. This violates the frozen rule that
        one curve may supply only one bin assigned to its first qualifying
        divisor.
    - obligation: bin_and_bit_coverage_identity
      status: NEEDS_CORRECTION
      counterexample: >-
        Eight records made from the same p=5,A=1,B=1,r=4,k=1 arithmetic tuple,
        relabeled across all four bins and both bit blocks, plus two seeds each,
        pass validate_panel_coverage. The gate trusts bit/bin metadata and does
        not bind bin to k, bit block to p, or cell identity to the retained
        selector trace. A duplicated arithmetic cell can therefore stand in for
        every required slot.
    - obligation: frozen_randomness_and_partition_streams
      status: NEEDS_CORRECTION
      detail: >-
        The frozen randomness block requires query, control, field_x, target,
        and shuffle purposes plus Fisher-Yates partition streams with arms 1..7.
        The corrected source calls only query and field_x; no control, target,
        shuffle, Fisher-Yates, or seven-partition counter/certificate is present.
    - obligation: complete_q_block_resolution
      status: NEEDS_CORRECTION
      counterexample: >-
        _future_cell uses one elapsed_cpu accumulator over both q workloads,
        both arms, and all seven blocks. A large q=64 workload can satisfy 0.1
        seconds while q=1 remains below resolution. No per-q/per-arm/block
        resolution status is stored.
    - obligation: finite_panel_decision_completeness
      status: NEEDS_CORRECTION
      counterexample: >-
        One favorable q=64 row for each metadata cell/seed triggers the positive
        predicate without seven blocks or resolution fields. One single q=64
        row at ratio 0.9 triggers the universal negative predicate. Neither
        decision_matrix nor validate_panel_coverage checks required cost-row
        cardinality, q=1 presence, seven alternating blocks, repetitions, or
        per-workload resolution before emitting these complete-panel predicates.
    - obligation: pairing_attempt_order_and_shift_definition
      status: UNTESTED_CONCERN
      detail: >-
        T candidates and shifts are nested over the same retained point list and
        cut off after 128 T/shift pairs. The frozen specification fixes 128
        x-vector attempts but does not fully specify the shift-candidate mapping.
        A Coordinator amendment or exact definition is needed before this
        ordering can be judged equivalent; this review did not search points.

  cost_model_checks:
    - check: shared_generator_and_input_cost
      status: NEEDS_CORRECTION
      counterexample: >-
        Generator search occurs between field_started and field_cpu, and
        ChargingLedger puts field_construction only in character_total. With a
        fixed generator cost 5 and all other fields zero, the implementation
        yields Tcharacter=5 and Tcurve=0; the frozen identity requires that
        generator/input-validation cost in Cshared and hence 5 in both arms.
    - check: accepted_chi_g_separation
      status: NEEDS_CORRECTION
      detail: >-
        bounded_t_search computes the accepted chi(G) inside t_cpu. The later
        chi_g_cpu interval only rechecks chi(G)^r and chi(G)!=1. The emitted
        CsearchT/CchiG columns therefore do not separate the accepted pairing,
        and their labels cannot support the frozen no-double-count identity.
    - check: reused_setup_allocation
      status: NEEDS_CORRECTION
      detail: >-
        One physical selection/field/T preparation measurement is copied in
        full into every seed/q/block/repetition cost row. No allocation record
        explains reuse across q values, target seeds, blocks, or repetitions,
        contrary to the frozen once-per-cold-q-batch rule and archived blind
        cost statement.
    - check: scaffolding_and_tail_costs
      status: NEEDS_CORRECTION
      detail: >-
        Query generation, exhaustive exact controls, coordinate control, and
        certificate-failure counts have no measured cost fields even though the
        frozen contract requires shared scaffolding to be reported and charged
        separately. Slowest Miller query and maximum-attempt tail summaries are
        also not emitted as registered metrics.

  admission_and_custody_checks:
    - check: current_executing_source_closure
      status: PASS_NARROW
      detail: >-
        A changed current-driver hash in source_closure is rejected before the
        signature primitive, and the current clean commit/dirty state is checked.
    - check: archived_review_authentication_and_ancestry
      status: NEEDS_CORRECTION
      counterexample: >-
        With only the signature primitive and current git-state query isolated,
        verify_launch_lock accepts arbitrary 40-hex c... as
        reviewed_snapshot_commit and arbitrary 40-hex a... as review_commit.
        The function checks string inequality and copied source_closure only; it
        never resolves either commit, proves reachability or ancestry, reads the
        declared report from that commit, verifies its artifact hash/verdict, or
        binds the source snapshot to actual commit
        063ea527d88e4515b266d012ce70d5087bb20ff9. A PASS-looking unreachable
        review archive can satisfy the code gate.
    - check: trusted_key_and_run_allocation
      status: OPERATIONAL_PREREQUISITE
      detail: >-
        No trusted Coordinator public key fingerprint/path, genuine signature,
        allocated run-id receipt, nonce, runtime probe, or launch authority was
        supplied or tested. These remain future control-plane inputs. Their
        absence here is not evidence against the implementation or science, but
        the current CLI accepts whichever public-key path a caller supplies and
        therefore depends on external trust-root enforcement.
    - check: progressive_failure_custody
      status: NEEDS_CORRECTION
      detail: >-
        Polynomial, generator, point, or T/shift SearchExhausted exceptions carry
        or imply rejected state, but execute_authorized_run recovers only
        fixture_history. A failure inside the current cell returns no raw rows,
        controls, costs, polynomial trace, generator attempts, point attempts,
        or T attempts to the canonical records. completed_batch cost checkpoints
        survive only in progress.json, an extra file omitted from RUN_FILES and
        the manifest artifact map.
    - check: bounded_search_and_resolution_semantics
      status: NEEDS_CORRECTION
      detail: >-
        Every SearchExhausted maps to status completed_invalid despite the frozen
        partial/inconclusive rule. Under-resolution raises RuntimeError and maps
        to failed_implementation, while exact/isolation failures raised as
        RuntimeError also map there instead of invalid. These categories change
        the meaning of operational and control failures.
    - check: manifest_timestamp_provenance
      status: NEEDS_CORRECTION
      detail: >-
        started_at and finished_at are both generated after all work, rather than
        retaining the actual UTC start. The manifest therefore lacks an exact
        execution start timestamp despite advertising complete lifecycle
        provenance.

  heuristic_validation_checks:
    - status: not_applicable
      detail: The frozen experiment declares no heuristic and no samples were taken.
  proof_architecture_checks:
    - status: not_applicable
      detail: The assigned joint is implementation/custody conformance, not a proof claim.

  bounded_checks:
    checker: coordination/experiment-reserve/BATCH-e742c5/reviews/TASK-20260908-3e2e16/checks.py
    receipt: coordination/experiment-reserve/BATCH-e742c5/reviews/TASK-20260908-3e2e16/check-receipt.json
    declared_fixed_cases_per_full_suite: 50
    total_case_cap: 160
    scientific_runs: 0
    frozen_fixture_searches: 0
    pairing_or_calibration_runs: 0
    experimental_control_or_timing_panels: 0
    maximum_workers: 1
    per_case_limit_seconds: 10
    aggregate_wall_cpu_limit_seconds: 1800
    final_accounting: see check-receipt.json

  limitations:
    - >-
      No fixture discovery, extension-point search, real pairing, exact
      character/isotropy/coordinate/null panel, timing workload, launch
      entrypoint, genuine signature, private key, launch lock, or RUN record was
      executed or read.
    - >-
      Source-only PASS items establish visible control flow or tiny arithmetic
      behavior, not correctness on the frozen scientific panel.
    - >-
      The historical blind mathematical review was read under the declared lift
      and remains limited to its owned statement-level joint. This report neither
      repeats that derivation nor converts it into implementation validation.
    - >-
      The predecessor TASK-20260908-5e2c15 remains procedurally failed. This
      separate successor report does not validate, supersede, or reclassify it.

  required_corrections:
    - >-
      Enforce one bin per curve at the first qualifying divisor and bind every
      coverage slot to the selector trace, actual bit block, and k-derived bin.
    - >-
      Implement and verify the frozen fixed-width big-endian coefficient
      encoding; reject noncanonical coefficients and fixture/context mismatch.
    - >-
      Run exact/isolation controls before timing, add the separate Weil
      self-pairing record, and gate completion on every control field for every
      selected cell and calibration.
    - >-
      Implement the frozen control/target/shuffle streams or record an additive
      amendment that precisely removes inapplicable fields before execution.
    - >-
      Produce a complete q/seed/block/repetition/resolution matrix and refuse
      both decision predicates unless the matrix and control gate are complete.
    - >-
      Put generator/input validation in shared cost, separate accepted chi(G)
      from rejected T search, declare physical setup allocation, and measure the
      required scaffolding/tail components without multiplying setup by repeats.
    - >-
      Preserve current-cell rejection and partial evaluator state in bound
      canonical artifacts, and map bounded search/resource/under-resolution and
      exact-control failures to the frozen categories.
    - >-
      Authenticate the reviewed snapshot/report/review commits by exact hashes,
      reachability, and ancestry to the clean executing commit; retain the real
      UTC start and lifecycle-valid provenance in the future manifest.

  artifact_paths:
