    bedrock_used: false
    model_provenance: task-bound native Codex dispatch and supplied READY preflight
    model_probe_performed_in_this_session: false

  procedure_deviations:
    - >-
      During review a concurrent main merge changed only the live administrative
      input tools/research_dispatch.py from handoff-bound SHA-256
      b832411917ec8b823eba3bae52f158e19fd179b087da166fedf379d350427c40 to
      5c40d891369c38f8d9013603fdf627f286243dffe4443878dd9e75926ec32c5c.
      Authority commit 2538725039 resolves and its blob hashes to the required
      b832411917ec8b823eba3bae52f158e19fd179b087da166fedf379d350427c40.
      The authority bytes inspected before that merge remain the administrative
      source for this report; the live drift supplied no source or scientific
      finding. All other declared bindings remained unchanged.
    - >-
      AGENTS.md required the canonical harness SKILL.md, which was read for task
      routing although it is not one of the handoff's 40 bound inputs. It did not
      supply a source finding.
    - >-
      The dispatch message explicitly supplied
      coordination/experiment-reserve/BATCH-e742c5/dispatch_queue.json; selected
      task/archive metadata was read for operational custody although the queue
      is not one of the 40 source bindings.
    - >-
      A repository-wide Git status command listed the filenames of the excluded
      failed predecessor's three untracked outputs. None was opened, parsed,
      hashed, or used.
    - >-
      The first test command attempted zsh ulimit -v 2097152; the host returned
      'setrlimit failed: invalid argument' and continued to the suite. Peak RSS
      was measured at 44433408 bytes, below 2 GiB. The failed enforcement attempt
      is preserved in check-receipt.json and is not represented as success.
    - >-
      The administrative python3 -m py_compile syntax check created
      __pycache__/checks.cpython-313.pyc despite PYTHONDONTWRITEBYTECODE=1. The
      transient cache was detected by the final output inventory and removed;
      the sealed output directory contains exactly the three authorized files.

