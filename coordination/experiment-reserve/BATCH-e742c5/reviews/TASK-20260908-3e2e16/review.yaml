    - coordination/experiment-reserve/BATCH-e742c5/reviews/TASK-20260908-3e2e16/checks.py
    - coordination/experiment-reserve/BATCH-e742c5/reviews/TASK-20260908-3e2e16/check-receipt.json
  archival_status: pending_coordinator_snapshot_TASK-20260908-68e88a
  coordinator_adjudication_required: true
  launch_effect: none_validator_has_no_launch_authority
  scientific_effect: none_no_measurement_or_interpretation

  inference:
    requested_policy: review-adversarial
    requested_model_id: gpt-5.6-sol
    resolved_model_id: gpt-5.6-sol
    requested_reasoning_effort: xhigh
    reasoning_effort: xhigh
    independent_session: true
    fallback_used: false
    degraded_requirements: []
