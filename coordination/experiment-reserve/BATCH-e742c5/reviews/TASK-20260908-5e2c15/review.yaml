  public_isolation_checks:
    - check: canonical_numeric_representation
      status: NEEDS_CORRECTION
      evidence_class: reproduced_counterexample
      detail: >-
        The closed public schema accepts a field coefficient larger than p and
        retains that raw integer in the parsed payload even though arithmetic
        later reduces it modulo p. A value such as 1+3p is the same field
        element as 1 while carrying the extra quotient 3 across the public
        boundary. Recursive key rejection therefore does not establish scalar
        isolation until every numeric field is range-checked and canonicalized
        into the retained object.
    - check: fixture_context_curve_binding
      status: NEEDS_CORRECTION
      evidence_class: reproduced_counterexample
      detail: >-
        A fixture on one curve and evaluator context naming unrelated A/B values
        are accepted. Coordinate controls legitimately need a transformed
        context, so unconditional equality is not required; the missing piece is
        an explicit typed transform relation, source-curve binding and verifier
        check that distinguishes an authorized u=2 image from an unrelated
        context.
    - check: dishonest_label_known_false_control
      status: PARTIAL
      evidence_class: source_trace
      detail: >-
        Unknown and duplicate keys are now rejected at both serialized
        boundaries, but allowed integer fields remain a carrier through
        noncanonical representatives. The known-false isolation control does not
        cover this same-shape numeric channel.

  protocol_checks:
