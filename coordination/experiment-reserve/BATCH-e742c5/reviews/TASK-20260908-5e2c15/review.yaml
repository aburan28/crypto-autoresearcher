      status: NEEDS_CORRECTION
      evidence_class: reproduced_mock_counterexample
      detail: >-
        The selector can retain multiple bin rows from one curve because it does
        not stop after that curve's first qualifying divisor. The frozen rule
        permits one bin per curve, assigned by the first qualifying divisor.
    - obligation: field_x_rng_tuple
      status: NEEDS_CORRECTION
      evidence_class: static_signature_and_call_trace
      detail: >-
        extension_point_attempts has no r parameter and seeds its field-x stream
        with a tuple containing a literal zero in that position. It therefore
        does not implement the frozen [p,A,B,r,k,u,arm] stream for the selected
        subgroup order.
    - obligation: seven_block_setup_and_arm_order
      status: NEEDS_CORRECTION
      evidence_class: fixed_mock_trace
      detail: >-
        _evaluate_public_payload always builds the multiplicative field table
        and then the additive curve table. curve_first/character_first changes
        query calls only, so recorded block alternation does not cover cold
        setup order or the full arm invocation sequence.
    - obligation: per_q_per_block_resolution
      status: NEEDS_CORRECTION
      evidence_class: reproduced_synthetic_counterexample
      detail: >-
        The resolution gate sums one elapsed_cpu value across q=1, q=64 and all
        seven blocks. It can pass while an individual q or block remains below
        0.1 CPU seconds, so the required cell/q/block timing resolution is not
        established.
    - obligation: complete_panel_positive_and_negative_quantifiers
      status: NEEDS_CORRECTION
      evidence_class: reproduced_synthetic_counterexamples
      detail: >-
        decision_matrix can emit the frozen negative predicate from one
        incomplete q=64 row. validate_panel_coverage can accept the same
        arithmetic fixture copied into all eight bit/bin tags, and can accept
        cell records with no q rows, blocks, repetitions, resolution status or
        cost rows. The finite-panel branches therefore are not gated on the
        complete bound matrix or authentic cell identities.
    - obligation: separate_weil_self_pairing_control
      status: NEEDS_CORRECTION
      evidence_class: full_source_absence
      detail: >-
        No separate e_r(G,G)=1 Weil self-pairing control is implemented. Other
        Tate/isotropy checks do not supply this independently named control.
    - obligation: exact_decoder_certificates
      status: NEEDS_CORRECTION
      evidence_class: schema_trace
      detail: >-
        Target certificates omit chi(Q), BSGS collision indices and checked
        collision equalities. Raw rows also do not retain the public payload or
        Q needed to reconstruct each decoder claim independently from archived
        artifacts.

