    Existing specifications, approvals, reviews, archives, and results remain
    byte-for-byte historical records. Corrections are additive.

finding_to_change_map:
  - finding: MATH-FOUR-MODELS-NOT-FOUR-CLASSES
    sources: [TASK-20260907-167cea]
    accepted_change: >-
      Preserve four labeled kernels and quotient endpoints, assign them to two
      Fp-isomorphism classes of multiplicity two, and require explicit
      within-pair isomorphisms.
  - finding: MATH-DUAL-ISOMORPHISM-DIRECTION
    sources: [TASK-20260907-167cea]
    accepted_change: >-
      Define phi = alpha o v and psi = dual(v) o alpha^-1, and under rho_u use
      phi_u = rho_u o phi and psi_u = psi o rho_u^-1.
  - finding: COST-AGGREGATION-AMBIGUOUS
    sources: [TASK-20260907-c96324, TASK-20260907-167cea]
    accepted_change: >-
      Use ratio of equally weighted charged totals as primary; retain a mean of
      endpoint ratios only as a labeled secondary statistic.
  - finding: COST-INDEX-AND-ALLOCATION-MISSING
    sources: [TASK-20260907-c96324]
    accepted_change: >-
      Freeze every cost dimension and a one-to-one allocation ledger whose
      weights reconcile to raw charged totals.
  - finding: BASELINE-SELECTION-UNFROZEN
    sources: [TASK-20260907-c96324]
    accepted_change: >-
      Use interval-by-coordinate strata, a fixed integer-score tie-break, and a
      seed-606101 freeze applying across both seeds and every q.
  - finding: ARBITRARY-CALLBACK-RUNNER
    sources: [TASK-20260907-c96324]
    accepted_change: >-
      Require a concrete runner with typed fixed stages and a hard validity
      reducer; empty or explicitly false controls can never reduce to valid.
  - finding: LABEL-CUSTODY-LEAK
    sources: [TASK-20260907-c96324]
    accepted_change: >-
      Give measurement code only typed public inputs and retain fixture,
      generator, kernel, class, scalar, and expected-answer labels in verifier
      custody.
  - finding: RNG-RESET-AND-CALLER-COEFFICIENTS
    sources: [TASK-20260907-c96324]
    accepted_change: >-
      Make stream counters persistent for the complete tuple, derive every
      coefficient from the fixed SHA-256 stream, and preserve partial search
      history.
  - finding: CERTIFICATE-ADMISSION-TOO-WEAK
    sources: [TASK-20260907-c96324]
    accepted_change: >-
      Bind trace, order, discriminant, conductor valuation, rational torsion,
      maps, duals, edge counts, class multiplicity, and within-pair isomorphisms.
  - finding: CONTROL-AND-MATRIX-COVERAGE-MISSING
    sources: [TASK-20260907-c96324]
    accepted_change: >-
      Freeze the full timing matrix and executable composition, coordinate,
      level, identity, wrong-answer, and label-permutation controls.
  - finding: PINNED-LIBRARY-DUPLICATES-LOCAL-MUL
    sources: [TASK-20260907-c96324]
    accepted_change: >-
      Refuse admission until a real, exact, independently sourced library
      binding replaces the duplicate local Curve.mul alias.
  - finding: RESOURCE-ACCOUNTING-NOT-ENFORCED
    sources: [TASK-20260907-c96324]
    accepted_change: >-
      Require process-group enforcement, platform-correct RSS units,
      cooperative inner-loop cancellation, and partial preservation.
  - finding: ARTIFACT-CUSTODY-NONATOMIC
    sources: [TASK-20260907-c96324]
    accepted_change: >-
      Persist canonical artifacts progressively, fsync them, and atomically
      publish only after the hard reducer completes.
  - finding: AUTHORIZATION-HASH-CYCLE-AND-UNBOUND-VERIFIER
    sources: [TASK-20260907-c96324]
    accepted_change: >-
      Use a detached signature over one canonical authorization payload, a
      fixed trusted verifier, exact run/source/review/runtime/path bindings, and
      a consumed one-run nonce.

effective_contract:
  identity:
    version: 1
    frozen_date: '2026-09-06'
    frozen_by: TASK-20260906-264d58
    predecessor_status: review_required
    title: Charged conductor-3 CM auxiliary-map calibration across a j=1728 volcano
    research_question_id: RQ-CRYPTO-001
    goal_id: GOAL-CRYPTO-001
    hypothesis_id: H-ECDLP-234ae4
    idea_id: IDEA-20260905-1dd2e5
    novelty_status: unverified
    approved_by: null
    execution_authorized: false
    evidence_eligible: false
  objective: >-
    Compute the real auxiliary action [3 lambda] on transported prime-order
    subgroup points and compare the fully charged finite setup-plus-transport
    cost with a preselected scalar baseline. This is a toy calibration only.
  mechanism: >-
    On E0 with End(E0)=Z[i], a normalized degree-three quotient phi, its exact
    dual psi, and iota satisfy beta = phi o iota o psi. On the transported
    r-subgroup beta acts as [3 lambda], while beta^2 acts as [-9].
  predictions:
    positive: >-
      Every one of the 36 confirmation cells at q=4096 has a resolved
      fully-charged scalar-to-transport ratio at least 1.20.
    scoped_negative: >-
      Every one of the same 36 cells has a resolved fully-charged ratio at most
      1.00.
    inconclusive: >-
      Any mixed panel, any ratio strictly between 1.00 and 1.20, any missing or
      below-resolution required datum, any unstable classification, or any
      invalid control is inconclusive for the hypothesis.
  test_boundary:
    source_fixtures: 6
    kernel_endpoints_per_fixture: 4
    target_isomorphism_classes_per_fixture: 2
    endpoint_multiplicity_per_target_class: 2
    coordinates: [1, 2, 3]
    q_values: [1, 16, 256, 4096]
    selection_seed: 606101
    confirmation_seed: 606103
    no_extra_q: true
    no_interpolation: true
    no_parameter_extrapolation: true
  claims_prohibited:
    - population effect
    - asymptotic improvement
    - ECDLP-use improvement
    - causal conductor effect
    - novelty
    - best possible scalar multiplication
    - lane closure
    - goal completion
    - breakthrough

  input_selection:
    prime_intervals:
      - id: I0
        lower_inclusive: 4096
        upper_exclusive: 8192
      - id: I1
        lower_inclusive: 16384
        upper_exclusive: 32768
      - id: I2
        lower_inclusive: 65536
        upper_exclusive: 131072
    enumeration:
      order: increasing_prime
      congruence: 'p mod 4 = 1'
      accepted_per_interval: 2
      total_accepted_when_complete: 6
      maximum_prime_candidates_total: 4096
      cap_unit: prime_candidates
      never_replace_slow_chosen_instance: true
      before_timing: true
    source_curve:
      equation: 'E0: y^2 = x^3 - x over Fp'
      field_representation: canonical_integer_0_through_p_minus_1
      nonsingular_required: true
      ordinary_required: true
      iota_root_rule: smaller_canonical_square_root_of_minus_one
    arithmetic_eligibility:
      trace:
        exact: true
        symbol: t
        require_nonzero: true
      order:
        equation: 'N = p + 1 - t'
        exact: true
      frobenius_conductor:
        equation: 'D_pi = t^2 - 4p = -4 f_pi^2'
        f_pi_integer: true
        v3_f_pi: 1
      torsion:
        full_rational_E0_3: true
        total_points: 9
        nonzero_points: 8
        cyclic_order_three_kernels: 4
      subgroup:
        r_definition: largest_prime_divisor_of_N
        minimum_r: 127
        excluded_r: [3]
        require_r_not_equal_p: true
        require_v_r_N: 1
      failure_action: preserve_partial_and_mark_incomplete_inconclusive
      forbidden_relaxations:
        - widen_prime_ranges
        - lower_r_minimum
        - change_v3_condition
        - change_CM_family
        - replace_a_slow_selected_fixture
    generator_selection:
      enumerate_affine_points_by: lexicographic_x_then_y
      multiply_each_by: N_div_r
      select: first_nonzero_result
      search_cap: 4096
      cap_unit: x_values
      both_y_values_for_an_x_are_within_one_x_value: true
      retain_all_attempts: true
      labels_hidden_from_evaluator: true
    partial_custody:
      retain_accepted_candidates: true
      retain_rejected_candidates: true
      retain_search_work: true
      cap_or_certificate_failure_outcome: partial_inconclusive

  kernel_and_class_model:
    mathematical_scope: conditional_certificate
    conditions:
      - 'End(E0) = Z[i]'
      - 'D_pi = -4 f_pi^2 with integer f_pi and v3(f_pi) = 1'
      - full rational E0[3]
      - exact rational order-three kernels
      - exact normalized maps and exact duals
    kernel_enumeration:
      canonical_nonzero_point_order: lexicographic_x_then_y
      canonical_generator_of_subgroup: lexicographically_smaller_of_P_and_minus_P
      kernel_polynomial: 'kappa_K(X) = X - x(P)'
      coefficient_representation: monic_coefficients_in_canonical_field_integers
      label_sort: lexicographic_kernel_polynomial_coefficients_then_generator
      labels: [K0, K1, K2, K3]
      four_labels_are_distinct: true
    corrected_level_statement:
      prime_three_behavior: inert_in_Q_i
      source_endomorphism_ring: 'Z[i]'
      target_endomorphism_ring: 'Z + 3 Z[i]'
      target_discriminant: -36
      source_rational_degree_three_edges: 4
      source_edge_direction: descending
      target_rational_degree_three_edges_per_labeled_endpoint: 1
      target_edge_direction: ascending_to_source
      exceptional_source_j: 1728
      automorphism_projective_action: >-
        Aut(E0)/{+1,-1} acts on P1(F3) without a fixed line and gives two
        orbits of size two.
      unit_corrected_class_count_equation: '(3 - (-1)) / (4 / 2) = 2'
      target_Fp_isomorphism_class_count: 2
      target_class_ids: [C0, C1]
      multiplicity_by_class:
        C0: 2
        C1: 2
      forbidden_interpretation: four_pairwise_nonisomorphic_floor_classes
      support: [CIT-KOHEL-1996, CIT-INTERNAL-BLIND]
    endpoint_class_assignment:
      required_matrix_rows_per_fixture: 4
      required_columns:
        - fixture_id
        - kernel_label
        - canonical_generator
        - kernel_polynomial_coefficients
        - raw_velu_map_id
        - normalizing_isomorphism_id
        - normalized_phi_id
        - exact_dual_psi_id
        - target_equation
        - target_j_invariant
        - target_class_id
        - class_multiplicity
        - class_representative_label
        - within_pair_isomorphism
        - within_pair_inverse
        - edge_count_certificate_id
      class_id_rule: >-
        Partition by an explicit Fp-isomorphism certificate. Name C0 as the
        class containing the smallest kernel label and C1 as the other class.
      pair_certificate_rule: >-
        For the nonrepresentative endpoint give an explicit Fp-isomorphism to
        the representative, its inverse, equation transport, and map
        commutation checks.
      required_partition: 'four labels -> two disjoint classes of size two'
      missing_or_wrong_partition_outcome: unavailable_fixture

  map_conventions:
    raw_map:
      symbol: v_K
      method: normalized_velu_before_endpoint_normalization
    endpoint_normalization:
      symbol: alpha_K
      definition: explicit_Fp_isomorphism_from_raw_codomain_to_canonical_target
    forward:
      symbol: phi_K
      equation: 'phi_K = alpha_K o v_K'
    exact_dual:
      symbol: psi_K
      equation: 'psi_K = dual(v_K) o alpha_K^-1'
    coordinate_transport:
      values: [1, 2, 3]
      rho_u_point_equation: '(x,y) -> (u^2 x, u^3 y)'
      rho_u_curve_equation: '(A,B) -> (u^4 A, u^6 B)'
      forward_equation: 'phi_K,u = rho_u o phi_K'
      dual_equation: 'psi_K,u = psi_K o rho_u^-1'
      inverse_in_dual_required: true
      all_conversion_and_normalization_costs_charged: true
    transported_generator:
      equation: 'G_K = phi_K(G0)'
      require_nonzero: true
      require_order: r
      dual_check: 'psi_K(G_K) = [3]G0'
    source_eigenvalue:
      candidates: both_square_roots_of_minus_one_mod_r
      test: >-
        Test both scalar products on G0 against iota(G0); exactly one candidate
        must agree.
      require_unique: true
      charged_operations:
        - modular_square_root
        - both_scalar_products
        - comparison_and_sign_selection
      lambda_symbol: lambda
      m_equation: 'm = 3 lambda mod r'
    auxiliary_map:
      symbol: beta_K
      equation: 'beta_K = phi_K o iota o psi_K'
      square_identity: 'beta_K^2 = [-9]'
      subgroup_action: 'beta_K acts as [m] = [3 lambda]'
      forbidden_cancellation: no_inverse_of_3
      support: [CIT-SHUMOW-2009, CIT-INTERNAL-BLIND]
    static_illustration_not_data:
      r: 149
      lambda: 44
      m: 132
      m_squared_mod_r: 140
      minus_nine_mod_r: 140
      wrong_factor: 44
      wrong_sign: 17
      obligations:
        - '[44] must fail the beta action on a nonzero target point'
        - '[17] must fail the beta action on a nonzero target point'
        - 'a coordinate conjugation by 7 must use rho_7^-1 in the dual'

  query_generation:
    q_values: [1, 16, 256, 4096]
    scalar_range: 'uniform integers 1 through r-1'
    point_equation: 'R_K,j = [s_j]G_K'
    repetitions_allowed_when_q_exceeds_r_minus_1: true
    repetition_flag_required: true
    cache_policy:
      per_input_cache_forbidden: true
      full_multiplication_table_forbidden: true
      scalar_labels_to_evaluator_forbidden: true
      generator_labels_to_evaluator_forbidden: true
    public_evaluator_fields:
      - public source and target curve equations
      - r
      - m
      - phi
      - psi
      - coordinate isomorphisms required by the selected public endpoint
      - opaque query points
    verifier_only_fields:
      - fixture identity and interval rank
      - G0 and every G_K
      - kernel label and target class label
      - query scalars
      - expected outputs
      - certificate labels
      - RNG counters and join table

  rng:
    digest: SHA-256
    serialization: compact_JSON_UTF8
    serialized_tuple: '[experiment_id,purpose,[p,A,B,r,k,u,arm],seed,counter]'
    integer_encoding: decimal
    spaces: forbidden
    digest_integer: unsigned_256_bit_big_endian
    purposes: [query, control, field_x, target, shuffle]
    unused_numeric_field_value: 0
    stream_key: full_serialized_tuple_except_counter
    state:
      counter_initial_value: 0
      persists_across_all_calls_for_same_stream_key: true
      reset_on_query_points_call_forbidden: true
      increment_on_every_digest_including_rejection: true
      state_custodian: verifier
    uniform_zero_to_n_minus_one:
      rejection_limit: 'floor(2^256 / n) * n'
      accept_when: digest_integer_less_than_rejection_limit
      output: digest_integer_mod_n
      n_equals_one: consume_one_digest_and_return_zero
    index_order:
      query: increasing_query_index
      control: increasing_control_index
      coordinate: increasing_coordinate_index
    nonshuffle_tuple_rule:
      curve_coefficients: original_unscaled_floor_A_B
      u: 0
      arm: 0
      k_for_CM_stream: 0
      coordinate_variants: exact_transport_of_same_base_samples
    shuffle_tuple_rule:
      u_values: [1, 2, 3]
      arm_values: [1, 2, 3, 4, 5, 6, 7]
      algorithm: Fisher_Yates
      initial_order: canonical_sorted_kernel_labels
      loop: 'for i from n-1 down to 1, j = uniform(0..i)'
    subgroup_point_encoding:
      first: point_at_infinity
      then: affine_points_by_integer_x_then_integer_y
    caller_supplied_coefficients: forbidden
    partial_stream_and_candidate_history_retained: true

  evaluator_custody:
    public_type:
      name: PublicEvaluatorBatch
      closed_schema: true
      fields:
        - opaque_batch_id
        - source_curve_public_equation
        - target_curve_public_equation
        - r
        - m
        - forward_map
