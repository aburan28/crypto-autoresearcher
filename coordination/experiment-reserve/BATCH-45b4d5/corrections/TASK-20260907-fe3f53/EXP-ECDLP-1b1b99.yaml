        - q_other_than_256
      members_per_stratum:
        source_fixtures: 2
        endpoints_per_fixture: 4
        total_endpoints: 8
      rationale: >-
        Pooling every endpoint in an interval prevents endpoint- or
        isomorphism-class-specific oracle selection while retaining the two
        predeclared performance covariates: field-size interval and coordinate
        representation.
    candidate_score:
      unit: integer_CPU_nanoseconds
      equation: >-
        Sum over the eight endpoints of every charged candidate setup,
        per-point table, warmup resource charge, seven selection timing blocks
        with all actual repetitions, and verification cost.
      aggregation: sum_of_equally_weighted_charged_scalar_endpoint_costs
      equivalent_ratio_rule: >-
        Dividing every candidate score by the same charged transport total
        gives the same argmin; no endpoint-wise ratio is averaged.
      invalid_candidate_score: unresolved_stratum
    argmin:
      primary: smallest_candidate_score
      deterministic_tie_break: lowest_numeric_arm_id
      exact_tie_unit: integer_CPU_nanoseconds
    freeze:
      persisted_before_any_seed_606103_work: true
      persisted_location: controls.json
      freeze_record_hash_in_manifest: true
