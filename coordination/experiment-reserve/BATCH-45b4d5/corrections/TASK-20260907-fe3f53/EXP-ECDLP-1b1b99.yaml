        - one_run_nonce
        - replay_reference_implementation_hash
        - public_private_schema_hashes
    signature:
      form: detached
      signed_bytes: exact_canonical_payload_bytes
      signature_is_not_in_payload: true
      lock_hash_is_not_in_payload: true
      no_mutual_hash_cycle: true
    trust_root:
      dependency_id: DEP-CM-TRUSTED-VERIFIER-001
      status: unresolved_required_dependency
      later_binding_must_include:
        - verifier_algorithm
        - public_key_bytes_or_certificate
        - repository_path
        - immutable_commit
        - SHA256
        - owner_and_rotation_policy
      caller_supplied_verifier_forbidden: true
    lock:
      contains:
        - canonical_payload_bytes
        - payload_SHA256
        - detached_signature
        - signature_SHA256
        - trust_root_identifier
      create_mode: exclusive_create_after_signature_verification
      live_PID_in_signed_or_immutable_payload_forbidden: true
      live_PID_allowed_only_in_ephemeral_progress_receipt: true
    nonce:
      size_bits: 256
      issued_by: later_Coordinator_authorization
      one_run_only: true
      atomically_claim_before_work: true
      consumed_nonce_registry_append_only: true
      replay_or_prior_consumption: refused_before_run
      no_nonce_allocated_by_this_correction: true
    malformed_input:
      language_exception_as_interface: forbidden
      typed_refusal_required: true
      required_reason_codes:
        - AUTH_MALFORMED
        - AUTH_SIGNATURE_INVALID
        - AUTH_TRUST_ROOT_UNBOUND
        - AUTH_BINDING_MISMATCH
        - AUTH_NONCE_REPLAY
        - AUTH_RUN_PATH_MISMATCH
        - AUTH_RUNTIME_MISMATCH
    current_state:
      real_key: null
      real_signature: null
      real_lock: null
      run_id: null
      execution_authorized: false

  resource_and_cancellation:
    future_scientific_run:
      process_group_memory_gb: 8
      workers: 1
      maximum_runs: 1
      historical_wall_seconds_estimate: 7200
      historical_CPU_seconds_estimate: 7200
      estimates_are_advisory: true
      stage_estimates_seconds:
        preparation: 2400
        audit: 1200
        measurement: 3000
        reporting: 600
      stage_estimates_are_advisory: true
      exceptional_stagnation_cap_active: false
      machine_watchdog:
        required_if_used: explicitly_justified
        expiry_effect: checkpoint_and_preserve_partial
        campaign_exhaustion_effect: false
    enforcement:
      supervisor_scope: entire_process_group
      wall_clock_source: monotonic_nanoseconds
      CPU_scope: process_group_including_waited_descendants
      RSS_scope: sum_of_resident_bytes_for_all_live_process_group_members
      platform_units:
        Darwin_ru_maxrss: bytes_no_multiplication
        Linux_ru_maxrss: kibibytes_multiply_by_1024
      platform_and_method_recorded_in_environment_json: true
      metadata_without_enforcement_invalid: true
      cooperative_checks_inside_candidate_query_repeat_and_artifact_loops: true
      subprocess_group_termination_and_wait_receipt_required: true
      cancellation_only_at_callback_boundaries_invalid: true
      memory_or_cancellation_outcome: partial_inconclusive
      operational_stop_is_scientific_evidence: false

  artifact_custody:
    run_directory_pattern: runs/<run-id>
    staging_directory_pattern: runs/<run-id>.partial
    create_final_directory_before_valid_publication: false
    progressive_stage_writes: true
    append_only_progress_for_long_stages: true
    atomic_file_rule: write_temp_fsync_rename_fsync_parent
    final_publish_rule: fsync_staging_then_atomic_rename_to_final
    overwrite_existing_path: forbidden
    failure_preserves_partial_directory: true
    stdout_and_stderr_stream_actual_bytes: true
    force_empty_stdout_or_stderr: forbidden
    required_artifacts:
      - manifest.yaml
      - fixtures.json
      - raw.jsonl
      - controls.json
      - costs.csv
      - certificates.json
      - stdout.log
      - stderr.log
      - report.md
      - command.txt
      - environment.json
      - raw-result.json
    manifest_required_sections:
      - run
      - code
      - inference
      - environment
      - input
      - timing
      - resource
      - result
      - artifact
    manifest_required_bindings:
      - actual_command
      - exact_git_commit
      - exact_dirty_state_and_diff_hash_or_clean_marker
      - executed_source_hashes
      - dependency_names_versions_and_hashes
      - backend_and_model_provenance
      - fixed_seeds
      - UTC_start_and_end
      - process_group_CPU_wall_and_RSS
      - validity_and_typed_outcome_reason
      - every_companion_artifact_SHA256
      - run_directory_path_hash
    manifest_self_hash_rule: >-
      The manifest does not hash itself. The later immutable archive receipt
      hashes the finalized manifest and run-directory binding.
    fixture_custody:
      retain_all_accepted_and_rejected_candidates: true
      retain_all_certificates_and_reasons: true
      retain_cap_progress: true
    timing_custody:
      retain_every_cell_arm_block_and_repetition: true
      retain_measured_and_modeled_costs_separately: true
      retain_coverage_and_branch: true
      retain_below_resolution_rows: true
    reporting:
      worst_class_floor_coordinate_and_all_rejects: required
      best_endpoint_headline: forbidden
      operation_counts_only_from_explicit_instrumentation: true
      opaque_backend_counts: unavailable
      timing_derived_operation_counts: forbidden
    artifact_hash_coverage_failure: completed_invalid_or_partial_inconclusive

  analysis_and_decision:
    primary_cells:
      dimensions: [source_fixture, target_isomorphism_class, coordinate]
      count: 36
      endpoint_aggregation: ratio_of_two_equally_weighted_charged_totals
      seed: 606103
      q: 4096
    stability_rule:
      method: seven_leave_one_block_out_reductions
      no_new_numeric_threshold: true
      success_stable_if: >-
        The full seven-block reduction and all seven leave-one-block-out
        reductions remain at or above 1.20.
      negative_stable_if: >-
        The full seven-block reduction and all seven leave-one-block-out
        reductions remain at or below 1.00.
      otherwise: unstable_inconclusive
    success_gate:
      all_36_cells_resolved: true
      all_36_ratios_at_least: 1.20
      all_36_stable: true
      complete_valid_panel: true
      top_control_valid: true
      full_search_and_setup_charges_present: true
      result_scope: finite_panel_signal_only
    scoped_negative_gate:
      all_36_cells_resolved: true
      all_36_ratios_at_most: 1.00
      all_36_stable: true
      complete_valid_panel: true
      result_scope: exact_finite_cost_gap_only
      lane_death_claim: forbidden
    forced_inconclusive:
      - mixed_cell_classifications
      - any_ratio_strictly_between_1_and_1_2
      - missing_floor_class_coordinate_q_seed_arm_or_block
      - missing_or_invalid_certificate
      - below_resolution_primary_block
      - unstable_block_reduction
      - failed_control
      - invalid_cost_reconciliation
      - unresolved_baseline_stratum
      - infrastructure_stop
    q_star:
      computed_per_primary_cell: true
      least_q_with_ratio_at_least_1: true
      every_earlier_ladder_cell_resolved_below_1: true
      interpolation: forbidden
    positive_followup: >-
      Nominate the finite signal for independent verification and, only in a
      separate proposal, assess ECDLP use.
    negative_followup: >-
      Record the exact charged cost gap and panel boundary; do not close a lane.
    inconclusive_followup: >-
      Record the precise missing or unstable field and rerank without changing
      the frozen panel.
    unexpected_observations_preserved: true
    no_automatic_promotion: true
    breakthrough_or_closure_requires_separate_max_review: true

  overlap_and_pareto:
    nearest_internal_records:
      - IDEA-20260807-3f5545
      - IDEA-20260905-7c2cc1
      - EXP-ECTD-9e4248
    known_context: conductor_Semaev_and_Hecke_routes_previously_inspected
    novelty_claim: none
    novelty_status: unverified
    dominated_by_status: unchecked
    dominated_by: unresolved
    sota_delta:
      status: unverified
      quantity: finite_fully_charged_ratio_only
      value: null
      reason: no_valid_measurement
    proof_search_map:
      applicability: not_applicable
      reason: finite_calibration_not_a_theorem_asymptotic_bound_reduction_or_closure_argument

current_readiness:
  design_sections_complete_in_this_draft: true
  executable_ready: false
  scientific_ready: false
  protocol_approval_state: pending_Coordinator_adjudication
  protocol_may_be_approved_before_implementation: true
  execution_authorization_must_remain_false_until_all_execution_gates_hold: true
  execution_admission_dependencies:
    - id: DEP-CM-PINNED-SCALAR-001
      condition: real_exact_independently_sourced_library_binding_absent
      clears_when: >-
        A named package/repository, exact version or commit, hashes, build
        configuration, callable semantics, lock entry, and distinct call-path
        proof are frozen.
      asserts_nothing_about: science
    - id: DEP-CM-TRUSTED-VERIFIER-001
      condition: trusted_detached_signature_verifier_and_key_provenance_absent
      clears_when: >-
        A later Coordinator decision binds the algorithm, public key or
        certificate, repository path, immutable commit, SHA-256, owner, and
        rotation policy.
      asserts_nothing_about: science
    - id: DEP-CM-CORRECTED-RUNNER-001
      condition: concrete_full_runner_and_hard_reducer_not_implemented_or_archived
      clears_when: >-
        A scoped implementation handoff produces an immutable archive and
        independent review verifies every executable checklist predicate.
      asserts_nothing_about: science
    - id: DEP-CM-EXECUTOR-BINDING-001
      condition: no_frozen_executor_handoff_runtime_RUN_nonce_lock_or_signature
      clears_when: >-
        After implementation readiness, a later Coordinator decision and
        frozen Executor handoff bind a non-Bedrock runtime, RUN, path,
        resources, trust root, and one-run authorization.
      asserts_nothing_about: science
  unresolved_future_executor_runtime:
    value: null
    reason: not_bound_by_this_drafting_handoff
    do_not_invent: true
    bedrock_allowed: false

