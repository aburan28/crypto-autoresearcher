        - top_level_control
        - identity_transport_control
        - reporting_and_artifact_publication
    primary_inclusion:
      shared_source_in_both_strategy_totals: true
      every_transport_discovery_and_certificate_cost_in_transport: true
      every_baseline_selection_trial_in_scalar: true
      corresponding_setup_and_warmup_in_each_strategy: true
      actual_query_evaluation_and_verification_in_each_strategy: true
      separately_reported_scaffolding_excluded_from_ratio: true
      no_silent_cancellation: true
      optional_secondary_shared_cancellation_must_be_explicitly_labeled: true
    allocation_ledger:
      one_record_per_raw_cost_item: true
      required_fields:
        - raw_cost_row_id
        - strategy_view
        - component
        - allocation_target
        - rational_weight_numerator
        - rational_weight_denominator
        - allocated_CPU_nanoseconds
        - allocated_wall_nanoseconds
        - reason_code
      exact_rules:
        - component: shared_source_fixture_level
          rule: >-
            In each strategy view split equally over four kernel labels and
            three coordinates of that fixture: weight 1/12 per endpoint-
            coordinate. Reconcile scalar and transport views separately.
        - component: interval_candidate_search
          rule: >-
            Attribute candidates in increasing order to the next accepted
            fixture: all attempts through the first acceptance belong to F0;
            subsequent attempts through the second acceptance belong to F1.
            Split each accepted fixture's attributed cost by 1/12.
        - component: transport_fixture_level
          includes:
            - point_count_and_factor
            - level_source_certificate
            - eigenvalue_and_sign_selection
          rule: split_1_over_12_over_four_labels_and_three_coordinates
        - component: transport_kernel_level
          includes:
            - kernel_search
            - map_construction
            - exact_dual_construction
          rule: split_1_over_3_over_coordinates_for_that_kernel
        - component: transport_class_level
          includes:
            - class_multiplicity_certificate
            - within_pair_isomorphism
          rule: split_1_over_6_over_two_labels_and_three_coordinates_in_that_class
        - component: coordinate_endpoint_level
          includes:
            - coordinate_normalization
            - map_conjugation
          rule: assign_fully_to_that_endpoint_coordinate
        - component: baseline_selection_endpoint_trial
          rule: assign_fully_to_that_endpoint_coordinate_scalar_cell
        - component: baseline_selection_stratum_global_overhead
          rule: split_1_over_8_over_the_eight_endpoints_in_that_stratum
        - component: measured_arm_workload
          rule: assign_fully_to_exact_fixture_endpoint_coordinate_seed_q_arm_block
        - component: class_aggregation
          rule: >-
            Use unnormalized endpoint weights 1 and 1 for reconciliation.
            Dividing both totals by 2 is allowed for display and leaves the
            ratio unchanged.
      reconciliation:
        per_raw_item_allocated_weights_sum_exactly_one: true
        per_component_allocated_integer_costs_sum_to_raw_cost: true
        integer_remainder_rule: >-
          Allocate floor(total/n) by canonical target order, then distribute
          the remaining one-nanosecond units one each in canonical order.
        shared_source_reconciles_once_per_strategy_view: true
        fixed_q_view_reconciles_all_setup_once: true
        q_views_are_alternative_views_and_never_summed: true
        mismatch_effect: invalid_cost_ledger
    report_layers:
      actual_campaign:
        definition: >-
          Sum every actually executed preparation, selection, control, timing,
          repeat, verification, and publication resource charge exactly once.
        may_support_resource_audit: true
        may_be_substituted_for_primary_normalized_batch: false
      normalized_batch:
        definition: >-
          For each fixed q, use one allocated setup and the median normalized
          q-workload estimator. Each q view independently reconciles its setup.
        primary_decision_layer: true
      modeled_amortization:
        definition: >-
          Optional declared reuse scenarios with an explicit denominator and
          no effect on the primary decision.
        label_required: modeled_secondary
        primary_decision_layer: false
    strategy_totals:
      transport_endpoint_equation: >-
        allocated Cshared + allocated discovery, point-count/factor, kernel,
        maps, duals, level/class certificates, eigenvalue/sign, normalization,
        setup and warmup + median normalized (Cpsi + Ciota + Cphi + Cverify)
      scalar_endpoint_equation: >-
        allocated Cshared + allocated costs of all six q=256 selection trials +
        selected-arm setup, every per-point table, library setup and warmup +
        median normalized (Cmul + Cverify)
      setup_once_per_class_batch: true
      unrelated_class_batches_never_share_setup: true
    primary_ratio:
      direction: scalar_total_divided_by_transport_total
      endpoint_weights_within_class: equal
      cell_equation: >-
        R[f,c,u,q] = sum over the two labels K in class c of
        T_scalar[f,K,u,q] divided by the corresponding sum of
        T_transport[f,K,u,q].
      global_q_equation: >-
        R_global[q] = sum of all charged scalar endpoint totals divided by the
        sum of all charged transport endpoint totals.
      governing_seed: 606103
      governing_q: 4096
      governing_cell_count: 36
      mean_of_endpoint_ratios:
        status: secondary_only
        label: unweighted_mean_of_endpoint_ratios
        cannot_support_decision: true
      illustrative_cost_check_not_data:
        scalar: [1, 1, 9, 9]
        transport: [1, 1, 3, 3]
        ratio_of_totals: 2.5
        mean_of_ratios: 2.0
    q_star:
