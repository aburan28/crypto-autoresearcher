  - finding: MATH-FOUR-MODELS-NOT-FOUR-CLASSES
    sources:
    - TASK-20260907-167cea
    accepted_change: Preserve four labeled kernels and quotient endpoints, assign them to two Fp-isomorphism classes
      of multiplicity two, and require explicit within-pair isomorphisms.
  - finding: MATH-DUAL-ISOMORPHISM-DIRECTION
    sources:
    - TASK-20260907-167cea
    accepted_change: Define phi = alpha o v and psi = dual(v) o alpha^-1, and under rho_u use phi_u = rho_u o phi
      and psi_u = psi o rho_u^-1.
  - finding: COST-AGGREGATION-AMBIGUOUS
    sources:
    - TASK-20260907-c96324
    - TASK-20260907-167cea
    accepted_change: Use ratio of equally weighted charged totals as primary; retain a mean of endpoint ratios only
      as a labeled secondary statistic.
  - finding: COST-INDEX-AND-ALLOCATION-MISSING
    sources:
    - TASK-20260907-c96324
    accepted_change: Freeze every cost dimension and a one-to-one allocation ledger whose weights reconcile to raw
      charged totals.
  - finding: BASELINE-SELECTION-UNFROZEN
    sources:
    - TASK-20260907-c96324
    accepted_change: Use interval-by-coordinate strata, a fixed integer-score tie-break, and a seed-606101 freeze
      applying across both seeds and every q.
  - finding: ARBITRARY-CALLBACK-RUNNER
    sources:
    - TASK-20260907-c96324
    accepted_change: Require a concrete runner with typed fixed stages and a hard validity reducer; empty or explicitly
      false controls can never reduce to valid.
  - finding: LABEL-CUSTODY-LEAK
    sources:
    - TASK-20260907-c96324
    accepted_change: Give measurement code only typed public inputs and retain fixture, generator, kernel, class,
      scalar, and expected-answer labels in verifier custody.
  - finding: RNG-RESET-AND-CALLER-COEFFICIENTS
    sources:
    - TASK-20260907-c96324
    accepted_change: Make stream counters persistent for the complete tuple, derive every coefficient from the fixed
      SHA-256 stream, and preserve partial search history.
  - finding: CERTIFICATE-ADMISSION-TOO-WEAK
    sources:
    - TASK-20260907-c96324
    accepted_change: Bind trace, order, discriminant, conductor valuation, rational torsion, maps, duals, edge counts,
      class multiplicity, and within-pair isomorphisms.
  - finding: CONTROL-AND-MATRIX-COVERAGE-MISSING
    sources:
    - TASK-20260907-c96324
    accepted_change: Freeze the full timing matrix and executable composition, coordinate, level, identity, wrong-answer,
      and label-permutation controls.
  - finding: PINNED-LIBRARY-DUPLICATES-LOCAL-MUL
    sources:
    - TASK-20260907-c96324
    accepted_change: Refuse admission until a real, exact, independently sourced library binding replaces the duplicate
      local Curve.mul alias.
  - finding: RESOURCE-ACCOUNTING-NOT-ENFORCED
    sources:
    - TASK-20260907-c96324
    accepted_change: Require process-group enforcement, platform-correct RSS units, cooperative inner-loop cancellation,
      and partial preservation.
  - finding: ARTIFACT-CUSTODY-NONATOMIC
    sources:
