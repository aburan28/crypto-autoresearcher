        source_fixtures: 2
        endpoints_per_fixture: 4
        total_endpoints: 8
      rationale: 'Pooling every endpoint in an interval prevents endpoint- or isomorphism-class-specific oracle
        selection while retaining the two predeclared performance covariates: field-size interval and coordinate
        representation.'
    candidate_score:
      unit: exact_rational_CPU_nanoseconds_per_q256_workload
      endpoint_equation: J[s,e,a]=U_selection_integer[s,e,a]+Med7(B_selection[s,e,a,b]/n[s,e,a,b],b=0..6). B includes
        every repeated table,library input/output conversion,multiplication and charged output verification for
        all actual whole-query-list repetitions. U includes one-time allocated candidate/library setup,warmup and
        their verification. No second division by q.
      stratum_equation: Score[s,a]=(sum(J[s,e,a] for the exact eight endpoints e in stratum s))/8. All six candidates2..7
        require complete valid seven-block input.
      selection_data: seed606101,q256,seven blocks,all nine interval-by-coordinate strata; no606103input.
      invalid_candidate_score: Any missing/duplicate/invalid/below-resolution block,warmup/setup/allocation or unknown
        component makes the entire stratum unresolved; never drop a candidate.
      equivalent_ratio_rule: A common positive denominator does not change this exact score argmin; no ratio of
        adaptive total repetitions or average endpoint ratio is used.
      prospective_override: Replaces the integer adaptive-total selector in DEC-20260908-166ad3; no historical score
        is rewritten.
    argmin:
      primary: smallest_exact_rational_Score
      deterministic_tie_break: lowest_numeric_arm_id
      exact_tie_unit: rational_CPU_nanoseconds; compare reduced numerator/positive denominator without floating
        point
    freeze:
      persisted_before_any_seed_606103_work: true
      persisted_location: controls.json
      freeze_record_hash_in_manifest: true
      reuse_across_q:
