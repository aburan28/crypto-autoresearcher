    serialized_schema:
      path: coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/schema.json
      sha256: 5cf7442bf87c8c101050cc2f0380dbc2b6ac3b45fb007cf60cac465a8d4d99c5
      standard: JSON Schema Draft2020-12
      entry_definitions: *id001
    serialization_rules:
      parser: Parse UTF8 JSON with duplicate object keys rejected at every depth and NaN/Infinity rejected before
        schema validation. No coercion,case folding,whitespace trimming,integer-string conversion or alias acceptance
        is permitted. JSON booleans are not integers.
      canonical_form: Recursively sort object keys; compact comma/colon separators; preserve array order; decimal
        JSON integers with no leading zero; UTF8,one final LF for standalone JSON files. Fractions have nonnegative
        integer numerator,positive denominator,gcd=1. Edge weights have strictly positive numerator.
      costs_csv: Header exactly record_type,record_json. RFC4180 CSV quoting with LF line ends. Each record_json
        is one compact canonical JSON object without an embedded final LF,validated against raw_cost or allocation_edge;
        first column equals its record_type. Raw rows retain actual chronological order; derived allocation edges
        follow raw row order then canonical view/scenario/target order.
      scope: This carrier and grammar are prospective formatting choices. They do not change a physical cost,scientific
        sample,statistical statistic or scope.
      numeric_lexical_profile: Before JSON Schema validation reject every floating-point lexical value,including
        integral spellings such as1.0,in raw-cost andallocation records andin manifest fields other than run.timing.wall_seconds
        andrun.resources.cpu_seconds. These two display fields alone admit finite fractional numbers. JSON parsers
        must retain integer-versus-fractional token kind until this check; no coercion orrounding is permitted.
        This is required in addition to standard JSON Schema integer semantics.
    semantic_validation_predicates:
    - Validate strict JSON grammar first,including recursive duplicate-key and nonfinite-number rejection. No caller-side
      coercion or alias canonicalization precedes admission.
    - Apply the mandatory numeric lexical profile before canonical keys orschema validation; integral float spellings
      cannot create alternate scenario,target,axis orcost encodings. The checks.py numeric_profile routine specifies
      this local parser predicate.
    - Validate every component/phase/scope triple against the complete table. A scaffolding row has scaffold_kind
      equal to component. A control owner with a plane must use the matching top_control oridentity_control component
      andnamed arm. Source-curve controls never acquire endpoint/kernel/class axes.
    - For interval-scoped candidate charges,event_ordinal is the nonnegative candidate ordinal in the retained interval
      candidate trace; all charges for that candidate join by(interval,event_ordinal). Other scopes use the chronological
      nonnegative event ordinal within their capture stream. Missing orduplicate candidate joins make the ledger
