        - 3
        - 4
        - 5
        - 6
      cardinalities:
        endpoint_arm_workloads_before_blocks: 4032
        required_main_timing_block_rows: 28224
        baseline_selection_endpoint_arm_workloads: 432
        baseline_selection_timing_block_rows: 3024
        confirmation_class_coordinate_primary_cells_at_q4096: 36
        class_coordinate_q_panel_cells: 144
      workload:
        warmup_calls_per_arm_workload: 1
        warmup_excluded_from_block_median: true
        warmup_resource_cost_charged_to_corresponding_arm_setup: true
        timed_blocks: 7
        each_repeat_executes_entire_q_query_list: true
        stop_repeating_block_when:
          any:
          - aggregate_process_group_CPU_seconds_at_least_0_1
          - repetitions_equal_100
        retain_every_block: true
        retain_every_repetition_count: true
        normalized_block_cost: actual_block_cost_divided_by_actual_repetitions
        cell_estimator: median_of_seven_normalized_block_CPU_costs
        below_resolution_when: CPU_seconds_below_0_1_after_100_repetitions
        below_resolution_effect: no_ratio_for_affected_cell
        arm_order: alternated_by_seed_using_fixed_shuffle_stream
        report_wall_and_CPU: true
        wall_CPU_disagreement_reported: true
      complete_matrix_gate: Every required coordinate, seed, q, arm, and seven-block row must be present, typed,
