        kernel_endpoint: 4
        target_isomorphism_class: 2_derived_from_kernel_endpoint
        coordinate: 3
        seed: 2
        q: 4
        arm: 7
        timing_block: 7
      required_values:
        source_fixture_ids:
        - I0F0
        - I0F1
        - I1F0
        - I1F1
        - I2F0
        - I2F1
        kernel_endpoint_ids:
        - K0
