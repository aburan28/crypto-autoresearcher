      stratum:
        key:
        - prime_interval_id
        - coordinate_u
        count: 9
        excludes:
        - source_fixture_identity
        - kernel_label
        - target_class_id
        - confirmation_seed
        - q_other_than_256
        members_per_stratum:
          source_fixtures: 2
          endpoints_per_fixture: 4
          total_endpoints: 8
        rationale: 'Pooling every endpoint in an interval prevents endpoint- or isomorphism-class-specific oracle
          selection while retaining the two predeclared performance covariates: field-size interval and coordinate
          representation.'
      candidate_score:
        unit: integer_CPU_nanoseconds
        equation: Sum over the eight endpoints of every charged candidate setup, per-point table, warmup resource
          charge, seven selection timing blocks with all actual repetitions, and verification cost.
        aggregation: sum_of_equally_weighted_charged_scalar_endpoint_costs
        equivalent_ratio_rule: Dividing every candidate score by the same charged transport total gives the same
          argmin; no endpoint-wise ratio is averaged.
        invalid_candidate_score: unresolved_stratum
      argmin:
        primary: smallest_candidate_score
        deterministic_tie_break: lowest_numeric_arm_id
        exact_tie_unit: integer_CPU_nanoseconds
      freeze:
        persisted_before_any_seed_606103_work: true
        persisted_location: controls.json
        freeze_record_hash_in_manifest: true
        reuse_across_q:
        - 1
        - 16
        - 256
        - 4096
        reuse_across_seeds:
        - 606101
        - 606103
        reuse_across_all_eight_endpoints_in_stratum: true
        confirmation_may_reselect: false
        confirmation_oracle_minimum_may_replace_primary: false
        missing_or_invalid_stratum: entire_affected_panel_inconclusive
      charge:
        every_candidate_trial_charged: true
        all_six_candidates_charged_to_scalar_total: true
        endpoint_specific_trial_cost_stays_with_endpoint: true
        stratum_global_overhead_split_equally_across_eight_endpoints: true
        each_fixed_q_view_contains_selection_once: true
        q_views_must_not_be_summed: true
        q1_interpretation: Because it includes the q=256 selection campaign, q=1 is a protocol-defined cold-total
          scenario and is not ordinary one-query latency.
      secondary_oracle:
        allowed: descriptive_only
        uses_all_measured_scalar_arms: true
        label: separate_conservative_oracle_minimum
        can_support_primary_decision: false
    timing_matrix:
