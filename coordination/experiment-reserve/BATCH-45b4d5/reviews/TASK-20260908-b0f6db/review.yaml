  - control_id: closed_shape_and_no_fabricated_RUN_facts
    verdict: HOLDS
    evidence: cases CM6-119 through CM6-145 and CM6-229 through CM6-241
    reason: >-
      Removing any of eight required fields fails. Adding any tested RUN/id/code,
      source, scientific input, resource, directory, admission, curve or nonce
      field fails. Malformed trusted task/hash shapes and extra trusted fields
      fail. The fourth union alternative does not admit an object rejected by all
      three old domains unless it is an actual complete pre_run_outcome.
  - control_id: independent_trusted_context_and_UTC
    verdict: HOLDS_AS_A_DEFINITION_WITH_IMPLEMENTATION_PREREQUISITE
    evidence: cases CM6-146 through CM6-159 and targeted CM6-242
    reason: >-
      The independent semantic verifier rejects absent context, a receipt-copied
      expected context, and task/hash mismatches. Valid Z and +00:00 timestamps
      pass; malformed, offset-free, nonzero-offset and non-UTC spellings fail.
      The contract explicitly says the expected task and handoff digest come from
      an already verified invoking context and are never copied from the payload
      or receipt. A future launcher's actual trust-channel separation remains an
      implementation prerequisite outside this definition review.
  - control_id: observed_authorization_input_completeness
    verdict: HOLDS_AS_A_DEFINITION_WITH_IMPLEMENTATION_PREREQUISITE
    evidence: cases CM6-160 through CM6-176
    reason: >-
      Closed available and unavailable shapes reject missing fields, malformed
      digests, negative lengths, unknown unavailability reasons, raw-byte
      retention, digest smuggling and extra fields. Semantic comparison rejects a
      partial byte string presented as complete, a different complete byte
      string, a digest without independently available complete bytes, an
      unavailability reason not independently established, reason mismatch, and
      an unavailable claim despite observed bytes. Exact empty input is admitted
      with its correct zero length and SHA-256. Actual constructor capture and
      receiver comparison remain prospective.
  - control_id: exact_authoritative_policy_failure_block
    verdict: HOLDS_AS_A_DEFINITION_WITH_IMPLEMENTATION_PREREQUISITE
    evidence: cases CM6-177 through CM6-228
    reason: >-
      POLICY_RESOLUTION_FAILED requires the complete failure branch with a
      nonempty resolution_error, literal note, model_verified false and the
      governing writer fields. Stripping every field fails. Served backend,
      provider, model, serving provenance, verification, reasoning, fallback,
      degradation, independent-session and config-digest fabrications fail.
      Every other early reason rejects the block. Semantic comparison rejects
      requested/canonical mismatch, changed adapter/error bytes, absent expected
      writer output, and an expected block copied from the receipt. Actual writer
      capture remains an implementation prerequisite and the nested block is not
      evidence that a model served.
  - control_id: initialization_and_delivery_boundary
    verdict: HOLDS_AS_AN_EXPLICIT_PROSPECTIVE_INTERFACE
    evidence: cases CM6-238 through CM6-247 plus effective_contract.artifact_custody.pre_run_outcome
    reason: >-
      The contract forbids advancing beyond authorization until the trusted run
      allocation and every required factual full-manifest field exist. It says no
      schema default or declared path supplies a fact, requires canonical JSON
      plus one LF to the trusted invoking control plane, forbids deriving a path
      from untrusted input or creating a RUN directory, and declines durable
      delivery when output fails. No launcher, receiver, spool or refusal delivery
      was executed here.

