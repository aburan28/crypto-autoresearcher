  task_id: TASK-20260907-167cea
  role: red-team
  report_scope: assigned_joint_only
  claim_under_review: >-
    Mathematical readiness of the prospective conductor-3 CM auxiliary-map
    calibration on the joint "Blind transport identity, conductor-three level
    assumptions, exceptional multiplicities and charged finite-panel cost".
    No implementation, scientific measurement, complexity claim, launch gate,
