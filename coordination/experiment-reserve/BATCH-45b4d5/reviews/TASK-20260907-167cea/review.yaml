  derived_joint_results:
    - id: transport-identity
      verdict: holds
      statement: >-
        For a separable degree-3 isogeny phi:E0->Ek and its exact dual
        psi:Ek->E0, beta=phi o iota o psi satisfies beta^2=[-9]. On the
        r-subgroup Gk=phi(G0), where iota acts as [lambda] on G0, beta acts as
        [3 lambda mod r], not [lambda].
      required_assumptions:
        - r is prime and r is not 3 or p, so phi restricts to an isomorphism on the r-subgroup.
        - psi o phi=[3] on E0 and phi o psi=[3] on the actual presented codomain model.
        - The selected lambda is the unique root satisfying [lambda]G0=iota(G0).
      exact_control: >-
        For r=149 and lambda=44, lambda^2=-1 mod r, m=3lambda=132,
        m^2=140=-9 mod r; the wrong factor gives 44 and the wrong sign gives 17.
    - id: dual-model-normalization
      verdict: holds_conditionally
      statement: >-
        If v:E0->Eraw is the raw normalized isogeny and alpha:Eraw->Ek is the
        chosen codomain isomorphism, then phi=alpha o v requires
        psi=dual(v) o alpha^-1. Under a coordinate conjugation rho:Ek->Ek_u,
        the maps must be phi_u=rho o phi and psi_u=psi o rho^-1, giving
        beta_u=rho o beta o rho^-1 and preserving [3lambda].
      breaking_condition: >-
        Reusing an untransported dual after post-composing phi changes an endpoint
        or scalar. The fixed r=149 mock with conjugating scalar 7 preserved 132
        with the inverse and produced 30 without it.
    - id: conductor-three-level
      verdict: holds_conditionally
      statement: >-
        With End(E0)=Z[i], p not 3, D_pi=t^2-4p=-4 f_pi^2,
        v_3(f_pi)=1, and full rational E0[3], E0 is the 3-volcano surface,
        3 is inert in Q(i), no horizontal 3-edge exists, and every rational
        order-3 kernel descends to End=Z+3 Z[i]. The target is the floor of
        rationality and must have exactly one rational 3-isogeny, the ascending
        edge, as its level crosscheck.
      certificate_boundary: >-
        Each fixture must bind the trace, square/integrality of f_pi, v_3(f_pi),
        End(E0)=Z[i], full rational 3-torsion, all four kernel maps and exact
        duals, target endomorphism order, and one-rational-edge floor check.
        Missing data is unavailable_fixture, not a level inference.
    - id: exceptional-j-multiplicity
      verdict: breaks
      statement: >-
        The four cyclic order-3 kernels are not four independent arithmetic or
        isomorphism classes. Aut(E0)/{+-1} has order two and acts without a fixed
        line on P^1(F3), producing two orbits of size two. Equivalently, Kohel's
        unit-corrected count is (3-(-1))/(4/2)=2 descending target classes.
      correction_required: >-
        Replace any pairwise-distinct-isomorphism requirement by four labeled
        kernel/map endpoints carrying exactly two F_p-isomorphism-class IDs with
        multiplicity two each, plus explicit within-pair isomorphisms. If
        "distinct quotient models" means only four labeled equations, say so and
        forbid interpreting those labels as independent classes.
    - id: charged-primary-cost
      verdict: breaks
      statement: >-
        The named costs correctly require discovery, rejected candidates, point
        counting/factorization, kernel search, maps, level certificates, eigenvalue
        sign, normalization, scalar selection/setup and verification. However,
        Cmaps/Clevel/Cnormalization and the evaluation sum are not indexed by
        floor, coordinate and seed, and "all four floors aggregated with equal
        weight" does not select ratio-of-totals versus mean-of-floor-ratios or
        allocate setup shared by floors, coordinates and seeds.
      arithmetic_break: >-
        With floor scalar totals [1,1,9,9] and transport totals [1,1,3,3], the
        ratio of equal-weight totals is 2.5 while the mean of four floor ratios is
        2.0. Both fit the prose phrase, so an implementation can change R_q without
        violating the current text.
    - id: baseline-selection-split
      verdict: breaks
      statement: >-
        Selection on seed 606101 at q=256 and confirmation on seed 606103 is
        directionally correct, and the confirmatory arm must remain frozen even
        when another arm is faster on 606103. The specification does not say
        whether argmin is global, per source class, per floor, per coordinate, or
        over the equal-floor aggregate, nor how the measured cost of every
        candidate selection trial is allocated to per-seed/per-coordinate R_q.
      correction_required: >-
        Freeze the argmin index set, deterministic tie-break, reuse scope across
        q and seeds, complete selection-trial charge, and allocation of shared
        selection cost. Keep the seed-606103 oracle minimum descriptive only.
    - id: finite-panel-logic
      verdict: holds_conditionally
      statement: >-
        Once R is uniquely defined, success requires all 36 aggregate q=4096
        cells (6 source classes x 2 seeds x 3 coordinates) resolved and at least
        1.20. Scoped falsification requires the same complete 36 cells all at most
        1. Any mixed value, value strictly between 1 and 1.20, missing class,
        missing floor/coordinate cell, failed certificate, or below-resolution
        primary block is inconclusive. Floors, coordinates and seeds do not enlarge
        the six-class replication unit.
      crossover_rule: >-
        q-star is the least resolved q in [1,16,256,4096] with R_q>=1 only when
        every earlier ladder cell is resolved and below 1. It is >4096 only when
        all four ladder cells are resolved below 1. Otherwise q-star is unresolved;
        interpolation is forbidden.
  objections:
    - id: OBJ-1
      severity: blocking_for_owned_joint
      finding: >-
        Pairwise-distinct target isomorphism classes contradict the exceptional
        j=1728 automorphism-orbit count; four kernels yield two classes with
        multiplicity two.
    - id: OBJ-2
      severity: blocking_for_owned_joint
      finding: >-
        The primary cost ratio has more than one mathematically consistent
        aggregation and shared-setup allocation under the frozen prose.
    - id: OBJ-3
      severity: blocking_for_owned_joint
      finding: >-
        Baseline selection lacks an exact quantifier domain and cost-allocation
        rule, so the frozen confirmatory comparator is not uniquely determined.
    - id: OBJ-4
      severity: interpretation_limit
      finding: >-
        Charging a q=256 scalar-selection exercise inside the q=1 numerator makes
        the q=1 ratio a protocol-defined cold-total scenario, not ordinary
        one-query latency. Any later wording must retain that distinction.
  required_controls:
    - Exact dual compositions on source and actual normalized codomain models.
    - beta=[3lambda] and beta^2=[-9] on nonzero points; wrong factor and wrong sign must fail.
    - Four kernel IDs mapped to two isomorphism-class IDs of multiplicity two; no independent-floor count.
    - Exactly one rational 3-isogeny on every certified conductor-3 floor.
    - Whole-batch cost ledger retaining every rejected discovery candidate and all setup/verification terms.
    - Frozen baseline selected only on seed 606101 at q=256 under a declared index set and tie-break.
    - Missing-cell and below-resolution branches forced to incomplete/inconclusive.
  counterexample_or_mutation:
    wrong_scalar_factor: >-
      r=149, lambda=44 gives correct m=132; substituting lambda gives 44 and
      substituting -3lambda gives 17, both distinct from 132.
    exceptional_independence: >-
      On P^1(F3), i acts as [[0,-1],[1,0]] and pairs (1:0) with (0:1), and
      (1:1) with (1:2); treating four kernels as four independent classes
      duplicates each class.
    omitted_discovery_cost: >-
      In the fixed illustrative model S(q)=30+2q, T_full(q)=5000+q and
      T_omitted(q)=5+q, omission changes R_4096 from 0.9039138083 to
      2.0048768593 and q-star from >4096 to 1. This is a synthetic branch test,
      not a measured panel or estimate of the proposed implementation.
    incomplete_panel: >-
      Thirty-five favorable resolved primary cells plus one missing cell, or
      thirty-six favorable values plus one below-resolution underlying block,
      remains inconclusive.
  baseline_comparison: >-
    The only comparator supported by this task is the finite frozen scalar set:
    binary, wNAF widths 2 through 5 including per-point tables, and a pinned
    library scalar arm, with direct [3]i on E0 as a separate mandatory
    known-resource control. No best-possible-scalar, Pollard-rho, ECDLP, or
    asymptotic comparison is established. The oracle minimum is descriptive and
    cannot replace the preselected confirmatory arm.
  heuristic_challenges: []
  cost_model_challenges:
    - Index and aggregate floor-, coordinate-, seed-, q-, and arm-specific costs before computing any ratio.
    - Use ratio of declared charged totals under one frozen rule; never silently average per-floor ratios.
    - Keep discovery and setup in transport even when the source floor is known after fixture construction.
    - Charge every scalar selection candidate and table under the declared allocation; do not reselect on seed 606103.
    - Label q=1 according to whether q=256 selection cost is included as experimental cold setup.
  reduction_and_scope_challenges:
    - General backward path discovery from an arbitrary floor is explicitly outside the measured interface.
    - This auxiliary equality and finite cost ratio imply no ECDLP reduction or cryptographic-scale transfer.
  proof_architecture_challenges:
    observation_collision: >-
      Four kernel labels collide into two target isomorphism classes; the missing
      separator is the kernel/map label and multiplicity, not the j-invariant.
    quantifier_order: >-
      Baseline selection must be a deterministic function of seed 606101 at
      q=256 on a declared stratum before any seed-606103 result is read.
    method_ceiling: >-
      Even an ideal outcome can certify only the specified finite known-auxiliary
      calibration over six deterministic toy classes. It cannot certify a causal
      conductor effect, population gain, asymptotic improvement, or ECDLP attack.
    nearby_object_controls: >-
      Wrong [lambda], wrong sign, untransported dual, four-independent-floor
      labels, omitted discovery cost, and incomplete primary matrix all fail at
      their declared signatures.
  pareto_accounting:
    dominated_by: not_applicable_no_algorithmic_result_or_closure_claim_under_review
    sota_delta: no_attack_result_owned_joint_mathematical_readiness_review_only
  narrowest_supported_statement: >-
    Under the stated exact-dual and certified ordinary-CM assumptions,
    phi o iota o dual(phi) is an integral conductor-3 endomorphism acting as
    [3lambda] on the transported r-subgroup, and the four rational kernels form
    two target isomorphism classes with multiplicity two. The frozen finite-panel
    cost and baseline-selection semantics need additive clarification before an
    implementation can be judged against one unique R_q or q-star.
  next_concrete_action: >-
    The Coordinator should create an additive specification clarification or
    successor contract that binds (1) kernel IDs to two multiplicity-two
    isomorphism-class IDs and explicit model isomorphisms, (2) the exact indexed
    whole-batch cost formula and allocation of shared setup across coordinates
    and seeds, and (3) the baseline argmin domain, tie-break, freeze and selection
    charge. Then the independent executable-protocol reviewer can test the
    implementation against those definitions. This report changes no status.
