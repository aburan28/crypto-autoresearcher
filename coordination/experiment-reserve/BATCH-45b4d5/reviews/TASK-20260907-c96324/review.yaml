  implementation_presence:
    verdict: PARTIAL
    holds:
      - Individual routines exist for the fixed SHA-256 stream wire form and rejection sampling.
      - Individual routines exist for field-point enumeration, rational 3-kernels, normalized degree-three map formulas, candidate dual construction, the j=1728 automorphism, scalar arms and coordinate conjugation.
      - The checked CLI is dry-run only, so the archived package itself did not begin a scientific run.
      - The producer exposes unresolved mathematical assumptions in its narrative rather than presenting them as proved.
    boundary: >-
      Presence of these routines does not implement the frozen runner, enforce the
      controls, or establish the unreviewed CM identities and level theorem.
  findings:
    - finding: caller_supplied_stages_bypass_the_protocol
      verdict: NEEDS_CORRECTION
      evidence: checks.py C01 and C02
      frozen_fields:
        - inputs
        - controls
        - independent_variables
        - metrics
        - algorithms
        - replication
        - stopping_rules
        - invalidation_rules
      worked_attack: >-
        After replacing only the unavailable future authorization check with a
        mock, call execute_frozen_run with prepare, audit and measure callbacks
        returning a label-bearing fixture, empty controls and no rows. The driver
        passed the complete fixture, including verifier-only scalar labels, to
        measure and wrote completed_valid. A second call returned explicit false
        composition and beta checks and was also written completed_valid.
      observed: >-
        execute_frozen_run is a callback and metadata scaffold. It never calls
        discover_frozen_panel, verify_controls, timed_blocks, either workload
        evaluator, baseline selection or CostLedger, and it does not validate the
        callback outputs. An external caller can omit every frozen cell and control.
      exact_scope: Post-authorization runner behavior with fixed empty mock stages; no scientific fixture or claim was tested.
    - finding: rng_state_and_selection_domains_are_not_frozen
      verdict: NEEDS_CORRECTION
      evidence: checks.py C07 and C11
      frozen_fields:
        - randomness
        - inputs.selection
        - inputs.field_and_points
        - inputs.queries
        - inputs.unavailable_fixture
      worked_attack: >-
        Invoke query_points twice on the same fixed F_7 mock tuple. The second call
        reproduced the first list because counter is reset to zero and no counter
        state is returned. Inspect choose_g0 and discover_frozen_panel at the bound
        source.
      observed: >-
        query_points accepts caller supplied p,A,B instead of deriving the floor's
        normalized coefficients and resets the per-tuple counter on each call;
        choose_g0 caps affine points rather than x values; an unavailable interval
        raises before returning its partial accepted/rejected panel. The top-level
        prepare callback then loses that local partial state.
      exact_scope: Frozen stream continuation, cap units and partial-panel custody in the prospective code.
    - finding: endpoint_dual_and_level_certificates_are_not_enforced
      verdict: NEEDS_CORRECTION
      evidence: checks.py C08
      frozen_fields:
        - inputs.field_and_points
        - inputs.levels
        - controls.composition
        - controls.level
      worked_attack: >-
        Construct a fixed certificate object with p=5, trace=999, discriminant=-36,
        four asserted quotient models but only one rational-isogeny count. validate
        accepts it. Trace the endpoint values used by verify_controls.
      observed: >-
        Conductor3Certificate.validate does not bind trace to p/discriminant, check
        rational-isogeny count cardinality or values, require distinct quotient
        models, or represent exceptional-j multiplicities. exact_dual selects on
        one source point. verify_controls places floor.generator, a target point,
        in a list otherwise treated as source-curve points and checks only
        psi(phi(P))=[3]P; it never checks phi(psi(Q))=[3]Q on the floor endpoint.
      exact_scope: Executable type and certificate checks only; the conductor-three theorem itself belongs to the blind sibling joint.
    - finding: declared_controls_are_descriptions_or_partial_checks
      verdict: NEEDS_CORRECTION
      evidence: checks.py C01, C02 and C09 plus bound source trace
      frozen_fields:
        - controls.composition
        - controls.coordinate
        - controls.level
        - controls.identity_transport
        - controls.label_permutation
      worked_attack: >-
        Trace each control from specification to executable assertions and data.
        Supply a false control result through the runner and inspect call sites in
        verify_controls.
      observed: >-
        No callback result schema is enforced. The label-permutation control is
        only a method-description string: no permutation or reaggregation occurs.
        The identity-transport arm phi=psi=identity and its separately charged
        setup are absent. The level entries store top points without asserting
        equality. Coordinate checks cover one phi image per u, without equivalent
        workloads, dual/i conjugation, charged conversions or structural operation
        count comparison. Measured outputs are not replayed against the selected
        fastest scalar baseline.
      exact_scope: Executable control coverage; it says nothing about how future data would compare.
    - finding: timing_baseline_and_cost_matrix_have_no_concrete_runner
      verdict: NEEDS_CORRECTION
      evidence: checks.py C10
      frozen_fields:
        - independent_variables
        - metrics
        - algorithms.baseline
        - algorithms.cost_formula
        - replication
        - invalidation_rules
        - tail_checks
      worked_attack: >-
        Search the bound module AST and execute_frozen_run body for calls to
        timed_blocks, select_baseline, CostLedger and the scalar/transport workload
        evaluators; inspect the pinned-library arm.
      observed: >-
        None is called. There is no six-class x four-floor x three-coordinate x
        four-q x two-seed x arm matrix, seven-block records, alternating order,
        warm-call treatment, resolution invalidation, seed-606101 selection then
        seed-606103 confirmation, oracle-minimum disclosure, Rq/q-star aggregation,
        worst-cell gate or actual charge path. The labelled pinned-library arm is
        the same Curve.mul affine routine as binary_mul rather than a separately
        pinned library implementation. CostLedger is never instantiated and has no
        per-class/floor/coordinate/seed/block custody.
      exact_scope: Missing executable data flow; no performance estimate substitutes for the absent measurement.
    - finding: machine_protection_and_cancellation_are_not_enforced
      verdict: NEEDS_CORRECTION
      evidence: checks.py C05
      frozen_fields:
        - budget
        - resource_estimate
        - stopping_rules
      worked_attack: Trace every callback boundary and resource read in execute_frozen_run and _memory_guard.
      observed: >-
        Frozen limits are lock data only. There is no wall, CPU or per-stage
        watchdog; maximum_workers and maximum_runs are not enforced; cancellation
        is sampled only before each opaque callback. RSS is RUSAGE_SELF rather than
        process-group RSS and is multiplied by 1024 unconditionally. On the observed
        Darwin host ru_maxrss is already bytes, so the guard overstates RSS by 1024.
      policy_boundary: >-
        Current progress-first policy makes routine spending estimates advisory.
        This finding concerns the frozen scientific plan's explicit machine-memory,
        cancellation, one-run/one-worker and validity controls; it does not demand a
        renewed spending cap or treat a future watchdog event as scientific evidence.
    - finding: canonical_and_failure_custody_are_missing
      verdict: NEEDS_CORRECTION
      evidence: checks.py C01 and C06; docs/evidence-and-reproducibility.md; tools/validate_ledger.py check_run
      frozen_fields:
        - required_artifacts
        - artifact_binding
        - inputs.unavailable_fixture
        - stopping_rules
      worked_attack: >-
        Let mocked stages return no rows and inspect the exact prospective output;
        trace output creation relative to the callbacks and compare manifest fields
        and companion paths to the canonical run contract.
      observed: >-
        The run directory is created before the stages, but no artifact is written
        until every opaque stage returns or throws. A kill or hang can therefore
        strand an empty immutable run id and loses in-stage candidate progress.
        Writes use direct write_text/open with no temporary-file replace, fsync or
        incremental hash chain. manifest.yaml is a flat five-field JSON object,
        lacks the canonical run/code/inference/environment/input/timing/resource/
        result/artifact blocks, and the directory lacks command.txt,
        environment.json and raw-result.json required by check_run. stdout/stderr
        are forced empty rather than captured. The manifest contains no exact
        command, git commit/dirty state, executed-source hashes, dependency versions,
        seeds, UTC timestamps, measured CPU/wall/RSS, validity reason or artifact
        hashes.
      exact_scope: Prospective artifact writer and canonical ledger admissibility; no run receipt was created by this review.
    - finding: launch_and_review_gate_is_neither_constructible_nor_fully_bound
      verdict: NEEDS_CORRECTION
      evidence: checks.py C03 and C04 plus bound source trace
      frozen_fields:
        - execution_prerequisites
        - artifact_binding
        - budget.maximum_runs
      worked_attack: >-
        Trace every equality in verify_launch_lock, its caller-controlled arguments
        and main entrypoint; submit a malformed lock missing runtime but containing
        an extra key.
      observed: >-
        The lock requires SHA256 of the authorization bytes while authorization
        requires SHA256 of the final lock bytes, creating a mutual hash dependency
        with no construction or signing handshake. The verifier executable is a
        caller argument and its identity/hash/trust root is not bound. No snapshot
        or independent-review receipt is bound. The lock omits run_id, run_root and
        a consumed one-run nonce, and execute_frozen_run does not call
        canonical_artifact_layout, so collision checking, path confinement and the
        one-run limit are unenforced. runtime includes the live PID, further
        preventing ordinary preconstruction. The only CLI is dry-run. A malformed
        record with one missing required field and one extra field bypasses the
        strict-subset test and raises KeyError rather than LaunchRefused.
      exact_scope: Future authorization and admission mechanism. The absence of a valid launch path is operational, not mathematical evidence.
  control_checks:
    - control_id: composition
      verdict: NEEDS_CORRECTION
      reason: wrong endpoint typing, reverse dual identity absent, and false callback results accepted
    - control_id: coordinate
      verdict: NEEDS_CORRECTION
      reason: only one phi-image equality per u; no full equivalent workload, dual/i conjugation, charged conversion or count comparison
    - control_id: level
      verdict: NEEDS_CORRECTION
      reason: descriptive point records and permissive certificate, without enforced equality, distinct-class or multiplicity checks
    - control_id: identity_transport
      verdict: NEEDS_CORRECTION
      reason: wrong-sign predicate exists, but the identity map overhead arm and separate setup accounting do not
    - control_id: label_permutation
      verdict: NEEDS_CORRECTION
      reason: method-description dictionary only; no permutation or invariant reaggregation check
  cost_model_checks:
    - check: fully_charged_primary_totals
      verdict: NEEDS_CORRECTION
      reason: cost terms are named but have no measured and retained data-flow path
    - check: baseline_selection_and_confirmation
      verdict: NEEDS_CORRECTION
      reason: helper exists but is never called by a concrete matrix runner
    - check: timing_resolution_and_repetitions
      verdict: NEEDS_CORRECTION
      reason: timed_blocks exists but is never called; below-resolution blocks cannot invalidate anything
    - check: setup_and_discovery_custody
      verdict: NEEDS_CORRECTION
      reason: candidate and setup work are neither timed into CostLedger nor retained incrementally
  required_corrections:
    - Replace caller-supplied prepare/audit/measure semantics with a concrete, reviewable orchestrator that invokes the frozen discovery, every control, the full matrix, cost aggregation, validity branches and canonical writer.
    - Define typed evaluator inputs that expose only the permitted public curve, r, m and maps; keep generators, sampled scalars, certificates and verifier labels in a separate verifier object.
    - Persist and return RNG counters by complete tuple, derive the unscaled floor coefficients inside the stream builder, count the G0 cap in x values, and return partial accepted/rejected work on unavailable fixtures.
    - Enforce source/target point types, both dual identities, distinct quotient-model and exceptional multiplicity records, and hard-fail every exact control before measurement or interpretation.
    - Implement the complete seed/class/floor/coordinate/q/arm schedule, actual baseline freeze and confirmatory split, timing-resolution gate, all repetitions and all setup/discovery/verification charges; bind a real pinned library or label the duplicate affine arm honestly.
    - Add a supervisor covering stage wall/CPU, process-group RSS, one worker, one run and cooperative cancellation inside long discovery/evaluation loops, with platform-correct RSS units and terminal classifications.
    - Create incremental, atomic, hash-bound artifacts from the first candidate onward and emit the canonical manifest plus command/environment/stdout/stderr/raw-result companions with actual provenance and resource measurements.
    - Redesign authorization as a constructible detached signature or one-direction hash binding; bind a fixed authenticator/trust root, exact run id/path, consumed nonce, source snapshot and completed independent-review archive. Validate required keys with subset containment and convert all malformed input to LaunchRefused.
  limitations:
    - No frozen prime search, scientific fixture, protocol control panel, timing block, experiment run or metric recomputation was performed.
    - The mathematical transport identity, conductor-three theorem, exceptional multiplicities and fully re-derived arithmetic cost are assigned to TASK-20260907-167cea and were not adjudicated here.
    - The future external authenticator does not exist in the reviewed snapshot; its real implementation and trust root could not be inspected.
    - Producer tests were read but not rerun. Their ten passing cases do not cover the demonstrated full-run paths, and the review task's cumulative fixed-case limit was preserved.
    - Attempt-1 git/shasum CPU and subprocess RSS were not separately sampled; check-receipt.json records the observed wall durations and leaves unavailable measurements null.
    - A Coordinator resume instruction reported an upstream usage-limit interruption. This report makes no independent account-usage or model-probe claim and assigns that interruption no scientific significance.
