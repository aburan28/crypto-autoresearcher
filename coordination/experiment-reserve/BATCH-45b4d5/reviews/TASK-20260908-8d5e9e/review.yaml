  scope_limit: >-
    Prospective readiness of the assigned executable implementation joint only.
    This report is not a verdict on the companion blind mathematical joint, the
    whole review round, protocol approval, launch authorization, a future run,
    the hypothesis, any scientific result, ECDLP complexity, promotion, closure,
    queue state, ledger state, or goal status.

  artifact_checks:
    - check: authority_bound_repository_sources
      verdict: PASS
      evidence: check-receipt.json administrative_binding_checks
      observed: >-
        All 48 handoff source bindings match both the authority-commit bytes and
        the current tree. The handoff and plan hashes are
        b32402d41f2f08a875801f48a8649cb9fdc24e79b6e54f5f28e8afacd7d7b0e4
        and 5cb2ec1af93e98009e6ed9ebca4e1c8ebedb1fab3b1794e51e6212b50ba17c0d.
        No authority-byte fallback was needed.
    - check: producer_snapshot_exactness
      verdict: PASS
      evidence: check-receipt.json administrative_binding_checks
      observed: >-
        Snapshot 0094bf3395a72c4c0e376945be8907c99ecde70a has the receipt-declared
        parent 0a8b243013f291eece5a21d70f7b67eec341151b, changes exactly the
        seven producer files plus the snapshot receipt, and all seven bound
        producer hashes match. The snapshot is an ancestor of the authority
        commit.
    - check: claim_epoch_and_write_scope
      verdict: PASS
      evidence: check-receipt.json administrative_binding_checks
      observed: >-
        Published epoch-one claim a91c3fdbaab6c67411e154ef389453ab467c3210
        names this task and the exact three-path write scope.
    - check: pinned_runtime_file_custody
      verdict: PASS
      evidence: check-receipt.json administrative_binding_checks and checks.py C02
      observed: >-
        All 44 permitted external runtime files match path, resolved path, byte
        count and SHA256. The fixed F_7 scalar agrees across the local arms and
        the real pinned CyPari2/PARI ellmul call. This positive fixed check does
        not validate the frozen scientific panel or its costs.
    - check: private_signing_key_boundary
      verdict: PASS
      evidence: check-receipt.json
      observed: >-
        The private signing key was never opened, read, statted, invoked or
        synthesized. No real payload, signature, lock, nonce or run identifier
        was created.
    - check: prospective_pipeline_admissibility
      verdict: FAIL
      evidence: checks.py C03-C06, C10-C20
      observed: >-
        Fifteen fixed counterexamples or exact source-conformance checks break
        the assigned implementation joint. The pipeline cannot serialize its
        accepted authorization at stage one, exposes private verifier state to
        the timed evaluator, omits required cost and control semantics, accepts
        unbound signed custody fields, lacks the required launch lock and
        resource supervisor, and may call a Boolean-only validity reducer with
        artifact validity hardcoded true.

  metric_recomputations: []

  control_checks:
    - control_id: canonical_payload_and_cli_inertness
      verdict: PASS
      evidence: checks.py C01 and C02
      reason: >-
        Canonical JSON rules reject duplicate keys, floats and a missing terminal
        newline; the command-line entry remains a dry non-launching surface.
    - control_id: bedrock_and_output_path_refusal
      verdict: PASS
      evidence: checks.py C07
      reason: >-
        Bedrock provider text and a signed output-path mismatch are refused with
        typed pre-runtime codes.
    - control_id: nonce_replay
      verdict: PASS
      evidence: checks.py C08
      reason: A fixed mock nonce is exclusively created and its replay is refused.
    - control_id: complete_and_missing_selection_tensor
      verdict: PASS
      evidence: checks.py C09
      reason: >-
        A fixed complete 3024-row selection tensor is accepted and removing one
        row is rejected.
    - control_id: duplicate_selection_tensor_index
      verdict: FAIL
      evidence: checks.py C10; driver.py lines 407-420
      reason: >-
        A duplicate endpoint-arm-block index is not rejected. One fixed duplicate
        changes the selected winner from arm 2 to arm 3 even though all required
        set members remain present.
    - control_id: public_private_evaluator_isolation
      verdict: FAIL
      evidence: checks.py C03 and C04; driver.py lines 333-345 and 628-648
      reason: >-
        The public validator checks only the top-level key set and accepts q=-1
        with zero query points. The timed evaluator receives PrivateVerifierBatch,
        endpoint and coordinate, then reads private.expected_points during the
        timed call. This violates the public-only input and post-timing private
        join obligations at corrected contract lines 631-643.
    - control_id: label_permutation_reaggregation
      verdict: FAIL
      evidence: checks.py C16; driver.py lines 660-682
      reason: >-
        The implementation shuffles the four label strings and tests their sorted
        value. It never permutes the actual opaque-to-private join table, reuses
        raw rows through that join, or reaggregates class costs as required at
        corrected contract lines 638-644 and 1090-1096.
    - control_id: coordinate_query_transport
      verdict: FAIL
      evidence: checks.py C17; driver.py lines 628-636 and 712-724
      reason: >-
        Every coordinate constructs a new private batch and draws again from the
        persistent stream. The required coordinate comparison transports the same
        base query points exactly, and the public batch omits the required
        repetition flag.

  heuristic_validation_checks: []

  cost_model_checks:
    - check: selection_score_completeness
      verdict: FAIL
      evidence: checks.py C10 and C15; driver.py lines 684-695
      reason: >-
        Selection filters to scalar_multiplication rows before scoring, excluding
        the charged scalar_warmup and providing no explicit per-point table or
        library setup rows. The frozen candidate score includes every setup,
        table, warmup, timing repetition and verification charge.
    - check: median_normalized_primary_totals
      verdict: FAIL
      evidence: checks.py C14; driver.py lines 733-758
      reason: >-
        The reducer sums block CPU divided by repetitions. It does not compute
        the median of seven normalized block costs and does not allocate required
        discovery, certificate, selection, setup, warmup and verification costs
        into the two fully charged totals required by corrected contract lines
        850-885 and 955-990.
    - check: complete_finite_decision
      verdict: FAIL
      evidence: checks.py C14; driver.py lines 733-758
      reason: >-
        The reducer emits 36 q=4096 primary ratios only. It has no leave-one-out
        stability, fixed-q reconciliation views, q-star ladder/crossover labels,
        worst-cell acceptance branch, below-resolution branch propagation, or
        complete finite decision.
    - check: repetition_and_raw_timing_custody
      verdict: FAIL
      evidence: static trace of driver.py lines 432-441, 651-658 and 712-758
      reason: >-
        timed_blocks constructs per-repetition receipts, but _warmup_and_blocks
        converts each block to BlockCost and discards those receipts. The final
        raw rows retain only an aggregate repetition count, contrary to corrected
        contract lines 791-808 and 1393-1397.

  proof_architecture_checks: []

  findings:
    - finding_id: CM-IMPLEMENTATION-FIRST-STAGE-001
      severity: blocking
      evidence_class: reproduced_fixed_mock_defect
      verdict: BREAK
      evidence: checks.py C05; driver.py lines 515-522 and 531-570
      worked_attack: >-
        Replace only authorization verification with an accepted fixed AuthCheck,
        use temporary paths, and invoke the internal prospective pipeline without
        fixture work.
      observed: >-
        The first authorize_and_claim_nonce stage hashes json_ready(AuthCheck).
        json_ready has no AuthCheck conversion, canonical_json rejects the object,
        and run_authorized returns infrastructure_stopped with "canonical payload
        has unsupported value" before fixture enumeration. Therefore an otherwise
        accepted authorization cannot reach the concrete protocol.
      exact_scope: Prospective implementation reachability; operational, not scientific evidence.

    - finding_id: CM-PUBLIC-CUSTODY-002
      severity: blocking
      evidence_class: reproduced_fixed_counterexample_and_source_trace
      verdict: BREAK
      evidence: checks.py C03, C04 and C17; driver.py lines 333-345 and 628-648
      worked_attack: >-
        Inspect the timed evaluator signature and construct a closed-key public
        batch with q=-1 and zero points.
      observed: >-
        The malformed nested semantics pass validation, while the timed evaluator
        directly receives the private expected outputs and endpoint labels needed
        to verify them. Separate serialized public custody and a post-commit,
        post-timing private join are not implemented.
      exact_scope: Public-only evaluator and query-transport custody.

    - finding_id: CM-AUTHORIZATION-BINDINGS-003
      severity: blocking
      evidence_class: reproduced_fixed_mock_counterexample_and_source_trace
      verdict: BREAK
      evidence: checks.py C06, C19 and C20; driver.py lines 489-506 and 531-568
      worked_attack: >-
        Mock only signature success, source/runtime checks and nonce creation to
        isolate binding comparisons, then supply canonical fields with arbitrary
        review archive, implementation archive/tree, handoff, fixed protocol,
        resource policy, replay and public/private schema values.
      observed: >-
        The canonical valid-signature mock is accepted. Those fields are required
        by the field set but are absent from the exact bindings mapping. No
        repository comparison validates the review archive/report hashes or the
        implementation archive/tree hash. There is no exclusive launch-lock
        creation containing payload/signature hashes. Bedrock, exact runtime
        fields, output path and nonce replay are separately implemented and passed
        their fixed controls.
      exact_scope: Fixed-key launch binding and custody; no real signature was attempted.

    - finding_id: CM-FINITE-COST-MATRIX-004
      severity: blocking
      evidence_class: reproduced_fixed_counterexample_and_static_conformance_defect
      verdict: BREAK
      evidence: checks.py C09, C10, C14 and C15; driver.py lines 407-420 and 684-758
      worked_attack: >-
        Exercise complete, missing and duplicate selection tensors and trace every
        input to candidate scoring and the q=4096 reducer.
      observed: >-
        Missing selection coverage is refused, but duplicates are accepted and can
        change the winner. Candidate selection omits warmup/setup charges. Primary
        totals omit required transport discovery/certification, all selection
        trials, setup and verification allocations; blocks are summed instead of
        median-aggregated. Required stability, q-star and final branch logic is
        absent.
      exact_scope: Complete frozen matrix and fully charged finite decision implementation.

    - finding_id: CM-CERTIFICATE-GENERATOR-CONTROL-005
      severity: blocking
      evidence_class: reproduced_fixed_synthetic_and_static_conformance_defect
      verdict: BREAK
      evidence: checks.py C12, C13, C16 and C17; driver.py lines 296-301 and 581-636
      worked_attack: >-
        Use a fixed synthetic affine iterator with two y values per x, inspect the
        concrete certificate schema, and trace label/query control data flow.
      observed: >-
        first_generator stops after 4096 affine points, which can represent only
        2048 complete x values, and it does not return attempts for custody. The
        certificate type cannot carry r/factorization/primality, exact duals,
        edge counts, within-pair isomorphisms, lambda or m. The label control is a
        string permutation rather than a private join, and coordinate queries are
        redrawn instead of exactly transported.
      exact_scope: Frozen fixture certificate, cap custody, and stated protocol controls.

    - finding_id: CM-RESOURCE-SUPERVISION-006
      severity: blocking
      evidence_class: static_conformance_defect
      verdict: BREAK
      evidence: checks.py C18; driver.py lines 423-445, 531-570 and 638-658
      worked_attack: >-
        Trace resource enforcement, child-group termination and cancellation into
        the q-point evaluator.
      observed: >-
        Metrics are sampled, but no memory limit, one-worker supervisor or
        process-group enforcement surrounds the pipeline. terminate_child_group
        is unused. Cancellation is checked around stages and timing repeats but
        not inside the tuple construction over q points. This does not satisfy the
        corrected contract's enforcement obligations at lines 1303-1335.
      exact_scope: Future-run machine protection. No watchdog event occurred and none is scientific evidence.

    - finding_id: CM-VALIDITY-ARTIFACT-CUSTODY-007
      severity: blocking
      evidence_class: reproduced_fixed_mock_and_static_conformance_defect
      verdict: BREAK
      evidence: checks.py C11 and C20; driver.py lines 508-513 and 531-568
      worked_attack: >-
        Feed the reducer completed stage dictionaries and true coverage/control
        booleans without raw rows or artifacts, then trace actual manifest and
        progress writes.
      observed: >-
        hard_validity_reduce returns completed_valid. run_authorized supplies the
        artifact argument as literal True. stdout.log, stderr.log and command.txt
        contain synthetic descriptions instead of actual streams/argv; the
        manifest omits actual_command and run_directory_path_hash. The allowed
        stage-receipts path is never written. File writes do use a temporary file,
        fsync and atomic replace, so this finding does not claim the per-file
        atomic primitive is absent.
      exact_scope: Prospective validity reduction, provenance and progressive artifact custody.

  positive_holds:
    - Canonical JSON, duplicate-key, float and terminal-newline rules held.
    - Default CLI is inert and allocated no RUN identifier.
    - Fixed F_7 scalar results agree across local arms and real hash-pinned PARI ellmul.
    - Bedrock provider/model text and mismatched signed output paths are refused.
    - Fixed mock nonce replay is refused.
    - A complete selection tensor is accepted and one missing tensor cell is refused.
    - All 48 repository and 44 external-runtime custody bindings matched.

  required_corrections:
    - >-
      Make accepted AuthCheck serializable at the first stage and add a fixed
      non-scientific end-to-end admission check that reaches the next stage without
      enumerating fixtures.
    - >-
      Serialize the closed public batch, enforce nested types/ranges/cardinality,
      invoke a public-only evaluator, commit its raw outputs, then perform the
      private expected-point join and verification after timing.
    - >-
      Bind and compare every signed review/archive/tree/handoff/protocol/resource/
      replay/schema field against exact repository state, and exclusively create
      the post-verification launch lock with payload and signature hashes.
    - >-
      Reject duplicate selection indices; score every candidate with all endpoint
      setup/table/warmup/block/repetition/verification costs; retain all repetition
      receipts and confirmation rows.
    - >-
      Build reconciled transport and scalar allocation ledgers covering discovery,
      certificates, all selection trials, setup, conversion, workload and
      verification; use the median of seven normalized blocks and implement all
      predeclared q, leave-one-out, q-star and decision branches.
    - >-
      Count generator search in x values and retain attempts; extend the certificate
      schema to carry every subgroup/primality/map/class/eigenvalue obligation;
      implement actual private-label permutation/reaggregation and exact coordinate
      transport of one base query set with repetition flags.
    - >-
      Enforce process-group memory and one-worker custody, connect child-group
      termination, and place cooperative cancellation checks inside candidate,
      query, repeat and artifact loops.
    - >-
      Derive validity from parsed, hash-bound artifacts; record actual stdout,
      stderr and command; write stage receipts and every required manifest binding,
      including the run-directory path hash.

  limitations:
    - >-
      No frozen interval or fixture was searched; no class census, scientific
      control panel, protocol timing block, future-run path, real launch material,
      RUN identifier or scientific experiment was executed.
    - >-
      The mathematical transport, multiplicity and fully rederived finite-cost
      statement belong to TASK-20260908-3bc02e and were not adjudicated here.
    - >-
      A Coordinator operational note stated that the companion native spawn had
      been refused for thread capacity and had produced no report at that time.
      Later scoped git status exposed only that the sibling review directory now
      exists; this Validator did not list or read its contents and makes no current
      companion-result claim. The whole round and admission remain pending
      regardless of this joint result.
    - >-
      The checker initially failed one overbroad C14 assertion. The failure was
      preserved, one fixed static diagnostic localized it, the assertion was
      narrowed without changing producer source, and the one allowed full rerun
      passed all 20 checker expectations. Total case accounting is 41 of 60.
    - >-
      Exact per-case timings from the direct checker output were not separately
      retained. Every case was observed at or below 0.633 seconds; the receipt
      records exact retained invocation totals and does not reconstruct missing
      values.
    - >-
      Fixed and static checks demonstrate concrete implementation defects and
      missing executable obligations. They provide no scientific observation and
      no evidence for or against the mathematical hypothesis.

