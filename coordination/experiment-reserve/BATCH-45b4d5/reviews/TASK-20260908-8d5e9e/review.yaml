  task_id: TASK-20260908-8d5e9e
  experiment_id: EXP-ECDLP-1b1b99
  review_kind: prospective_corrected_implementation_admission
  owned_joint: >-
    Executable corrected CM protocol, scalar library/public isolation, cost
    matrix and launch/custody conformance
  owned_joint_verdict: breaks
  source_snapshot: 0094bf3395a72c4c0e376945be8907c99ecde70a
