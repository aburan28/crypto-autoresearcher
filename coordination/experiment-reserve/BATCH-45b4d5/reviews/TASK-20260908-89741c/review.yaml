  findings:
  - finding_id: CM5-PRE-RUN-REFUSAL-CARRIER-001
    severity: blocking
    evidence_class: independently_reproduced_required_valid_object_unrepresentable
    verdict: BREAK
    exact_sources:
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-e06add/EXP-ECDLP-1b1b99.yaml#effective_contract.authorization_and_lock.malformed_input
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-e06add/EXP-ECDLP-1b1b99.yaml#effective_contract.artifact_custody.outcome_relation
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-e06add/schema.json#oneOf
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-e06add/schema.json#$defs.manifest.properties.run.required
    reproduced_objects:
    - >-
      Required-valid fixed refusal {status:refused_before_run,
      reason_code:AUTH_MALFORMED,stage:authorize_and_claim_nonce,detail:fixed malformed
      bytes} under a standalone refusal carrier is rejected because no refusal or
      typed_refusal definition exists.
    - >-
      A schema-valid AUTH_MALFORMED full manifest exists only after supplying a RUN-like
      id plus code/source_sha256, inputs, timing, resources, directory, and admission.
      Deleting each of those seven fields independently is rejected.
    consequence: >-
      A malformed authorization input observed before RUN allocation or source/custody
      initialization has no honest serialized outcome. A future implementation must either
      fabricate facts, throw outside the typed interface, or violate the full-manifest schema.
    required_correction: >-
      Add a closed standalone pre-run refusal receipt to the carrier and artifact-custody
      contract. It should bind the task/handoff and observed authorization input when
      available, require status, exact AUTH_* reason, originating stage, UTC time, and
      optional detail, and explicitly forbid RUN id, scientific inputs, source hashes,
      directory, resource measurements, or admission fields that do not yet exist.
      Alternatively, prove and encode that every malformed-input check occurs only after
      those facts are independently allocated and bound; do not invent them merely to fit
      manifest.
  - finding_id: CM5-AUTHORITY-QUEUE-BINDING-RECOVERY-002
    severity: administrative_nonblocking
    evidence_class: exact_hash_matching_parent_recovery
    verdict: DISCLOSED_LIMITATION
    exact_source:
    - ledger/handoffs/TASK-20260908-89741c.yaml#handoff.source_bindings
    - coordination/experiment-reserve/BATCH-45b4d5/dispatch_queue.json at commits 209b4196d5fb0f008c465cc9a1cc8a2045e4967c and dfc0547e0f0f692c3d252584d29916a018b135eb
    observed: >-
      The bound queue hash is the authority parent's exact bytes, while authority changes
      the queue to add this round. The recovery is unique, hash exact, and administrative.
    consequence: >-
      The handoff's source_bindings list alone does not say which commit supplies this one
      causal pre-authority queue input. It does not alter the reviewed definition.
    recommended_correction: >-
      Future self-updating queue handoffs should bind the pre-authority queue with an
      explicit source commit or exclude the mutating queue from same-commit source hashes.

