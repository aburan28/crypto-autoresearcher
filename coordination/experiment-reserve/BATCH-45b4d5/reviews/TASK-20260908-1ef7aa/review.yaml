  findings:
  - finding_id: CM-DEFINITION-COST-SCENARIO-TARGET-001
    severity: blocking
    evidence_class: precise_undefined_required_branch_and_fixed_schema_counterexample
    verdict: BREAK
    exact_source:
    - effective_contract.cost_contract.allocation_ledger.record_unit
    - effective_contract.cost_contract.allocation_ledger.required_fields
    - effective_contract.cost_contract.allocation_ledger.scenario
    - effective_contract.cost_contract.allocation_ledger.strategy_views
    - effective_contract.cost_contract.allocation_ledger.target
    - effective_contract.cost_contract.allocation_ledger.eligible_edges
    worked_attack: >-
      Admit one exclusive 37 ns reporting_and_artifact_publication raw event
      with a valid scaffolding owner. eligible_edges requires an
      actual_only_scaffolding edge and required_fields requires scenario. The
      only scenario definition is one fixed (q,seed) cold-total alternative,
      although this publication event has no q or seed. Leaving scenario absent
      violates the edge schema; choosing one q/seed fabricates ownership;
      copying it to all eight q/seed alternatives creates view copies that have
      no defined actual-only reconciliation meaning. Independently, the same
      endpoint-coordinate target can be serialized as a string, list, or object
      because target has no closed type. Those encodings evade the promised one
      edge per semantic target rule.
    consequence: >-
      The allocation ledger is not a total deterministic serialized function
      over every mandatory physical row. Exact view/scenario uniqueness and
      actual-versus-normalized separation therefore cannot yet be implemented
      without an Executor choice.
    required_correction: >-
      Define a closed tagged scenario union, including exact cold(q,seed),
      selection-score(candidate/stratum as needed), and actual-only variants;
      define a canonical JSON target union and the exact uniqueness key for each
      variant. State which raw families require, forbid, or omit allocation
      edges and how actual-only edges reconcile without q/seed copies.

  - finding_id: CM-DEFINITION-COST-AXES-002
    severity: blocking
    evidence_class: fixed_schema_alias_counterexample_and_missing_domain
    verdict: BREAK
    exact_source:
    - effective_contract.cost_contract.raw_cost_tensor.common_required
    - effective_contract.cost_contract.raw_cost_tensor.common_types
    - effective_contract.cost_contract.raw_cost_tensor.scope_variants.selection_stratum
    - effective_contract.cost_contract.raw_cost_tensor.scope_variants.arm_workload
    - effective_contract.cost_contract.raw_cost_tensor.axis_validation
    - effective_contract.cost_contract.component_crosswalk.phase_rules
    worked_attack: >-
      Two otherwise identical timing-block rows, one with plane=main and one
      with plane=MAIN, both satisfy every required/forbidden index rule because
      no plane domain exists. The logical duplicate key treats them as distinct,
      so both can be retained and charged. Likewise phase is mandatory but has
      no type/domain or per-component allowed_phases mapping; phase=banana is
      not excluded by the formal common_types block. selection_stratum already
      has the semantic key (interval,coordinate) but also requires an undefined
      stratum value, so S0 and S8 can alias the same stratum.
    consequence: >-
      Invalid aliases and nonsensical rows are not rejected by the declared
      typed schema, defeating logical uniqueness and potentially duplicating a
      physical charge or hiding a missing cell.
    required_correction: >-
      Enumerate canonical plane tokens and their exact axis domains; enumerate
      phase tokens and allowed component/phase/scope triples; either derive and
      omit stratum or define its canonical identifier and consistency equation.
      Include these fields in typed duplicate detection after canonicalization.

  - finding_id: CM-DEFINITION-MANIFEST-XREF-003
    severity: blocking
    evidence_class: exact_governing_source_cross_reference_conflict
    verdict: BREAK
    exact_source:
    - effective_contract.artifact_custody.manifest_required_sections
    - docs/evidence-and-reproducibility.md Minimum run manifest
    worked_attack: >-
      The successor requires sections named run,code,inference,environment,
      input,timing,resource,result,artifact. The governing minimum run manifest
      places the payload under run and names inputs,resources,artifacts in the
      plural. A manifest using the generic contract fails the successor names;
      one using the successor names fails the generic minimum. No explicit
      experiment-specific supersession or complete schema resolves the
      singular/plural and nesting choice.
    consequence: >-
      A future Executor cannot produce one exact manifest that is demonstrably
      conformant to both declared sources, and an independent checker cannot
      know which representation to parse.
    required_correction: >-
      Bind one complete manifest schema with exact nesting and field names, or
      explicitly state and justify the experiment-specific override while
      preserving every governing minimum field and semantic requirement.

  - finding_id: CM-DEFINITION-COST-UNAVAILABLE-004
    severity: blocking
    evidence_class: precise_unserializable_required_failure_branch
    verdict: BREAK
    exact_source:
    - effective_contract.cost_contract.raw_cost_tensor.common_required
    - effective_contract.cost_contract.raw_cost_tensor.common_types.process_group_peak_RSS_bytes
    - effective_contract.cost_contract.raw_cost_tensor.common_types.operation_counts
    worked_attack: >-
      An infrastructure-stopped physical row must retain an explicit unavailable
      RSS reason and an uninstrumented library row must retain an operation-count
      reason. The common schema requires only the numeric/null value fields and
      rejects unknown keys. It names no tagged union and no
      process_group_peak_RSS_unavailable_reason or
      operation_counts_unavailable_reason field. A string in the bytes field,
      a null without reason, and a companion reason key are three incompatible
      encodings, none selected by the contract.
    consequence: >-
      Mandatory partial/failure rows cannot be serialized and independently
      parsed without inventing a representation, so failure custody is not
      definition-complete.
    required_correction: >-
      Define exact tagged JSON unions or companion reason-code fields and their
      required/forbidden conditions for measured, unavailable, partial and
      infrastructure-stopped values.

