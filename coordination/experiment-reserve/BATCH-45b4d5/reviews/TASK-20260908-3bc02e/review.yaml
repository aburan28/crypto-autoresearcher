red_team_report:
  id: RT-20260908-3bc02e
  task_id: TASK-20260908-3bc02e
  role: red-team
  claim_under_review: >-
    Prospective readiness, on the assigned joint only, of the corrected CM
    transport/multiplicity statement and its fully charged finite-panel cost
    definition. This is not a whole-claim, protocol, launch, or scientific
    verdict.
  owned_joint: Blind corrected CM transport/multiplicity and fully charged finite-panel cost definitions
  owned_joint_verdict: breaks
  component_verdicts:
    transported_CM_scalar_and_coordinate_model:
      verdict: holds
      scope: >-
        Conditional on each admitted fixture satisfying the exact source,
        subgroup, normalized-isogeny, dual, and coordinate certificates in the
        curated statement.
      basis: >-
        On the unique rational order-r subgroup, iota acts as [lambda]. For
        Q=phi_K(P), beta_K(Q)=phi_K iota psi_K phi_K(P)=phi_K iota([3]P)
        =[3 lambda]Q. Thus m=3 lambda modulo r and beta_K^2=[-9]. Under
        coordinate transport, beta_K,u=rho_u beta_K rho_u^-1, so the scalar is
        unchanged and the inverse in the transported dual is necessary.
    four_kernels_two_classes:
      verdict: holds_conditionally
      scope: >-
        The elementary kernel and automorphism count holds from the stated
        full rational E0[3], p congruent 1 modulo 4, and j=1728 hypotheses.
        The descending/ascending conductor interpretation remains conditional
        on the required exact endomorphism-ring, trace/conductor, edge-count,
        and Fp-isomorphism certificates; no external theorem was retrieved in
        this task.
      basis: >-
        E0[3] has four cyclic order-three subgroups. Multiplication by i on
        P1(F3) has no fixed line and two orbits of size two. Hence the four
        labeled kernels must be retained as four endpoints but aggregated as
        two certified Fp-isomorphism classes of multiplicity two. The order
        Z+3Z[i] has discriminant -36.
    endpoint_weighted_ratio:
      verdict: holds
      scope: >-
        Once every raw charge is assigned unambiguously, a class cell must be
        (S_K0+S_K1)/(T_K0+T_K1) for its two labels, with equal unnormalized
        weights. Dividing both sums by two is display-only. Endpoint ratios
        may not be averaged.
    baseline_and_allocation_definition:
      verdict: breaks
      basis:
      - finding: COST-ALLOC-1
        statement: >-
          The allocation ledger gives mutually incompatible global and
          per-strategy requirements for a shared raw source item. Splitting one
          shared item by 1/12 in each of the scalar and transport views produces
          total weight 2 for the raw item, while the declared reconciliation
          says each raw item's allocated weights sum exactly 1. The statement
          hints at reconciliation per strategy view but does not put
          strategy_view into the reconciliation key.
        fixed_counterexample: >-
          A 120 ns shared item gives twelve 10 ns allocations in each view:
          120 ns in scalar plus 120 ns in transport. Global allocated weight is
          2 and global allocated cost is 240 ns; per-(raw item,strategy view)
          reconciliation is 1 and 120 ns. Both readings are required by
          different lines of the statement.
      - finding: COST-ALLOC-2
        statement: >-
          One-off and setup components do not have a complete typed placement
          in the mandatory raw tensor or allocation rules. The tensor forbids
          null source_fixture, kernel, class, coordinate, seed, q, arm, block,
          repetition, component, and stage indices, but discovery, fixture
          certificates, scalar selection, selected-arm setup, per-point tables,
          library setup, and warmups are incurred outside at least some of
          those dimensions. No not-applicable sentinel or separate raw-event
          schema is defined. The exact allocation rule list also lacks an
          explicit rule for selected scalar setup/table/library setup and both
          warmups, despite including them in strategy totals.
        consequence: >-
          An implementation must either duplicate a one-off raw event across
          seed/q/block cells, assign it arbitrarily to one cell, insert an
          undeclared sentinel, or leave a charged item unindexed. Those choices
          change reconciliation and can change a threshold cell.
      - finding: BASELINE-1
        statement: >-
          Candidate selection minimizes the total CPU used by all actual
          adaptive repetitions in the selection campaign, while the primary
          workload estimator is normalized per repetition. The selected arm is
          therefore not necessarily the fastest declared scalar arm, yet replay
          names its reference fastest_declared_scalar_baseline and the
          conservative normalized oracle is barred from the primary decision.
        fixed_counterexample: >-
          With zero setup, a 3,000,000 ns workload repeats 34 times and scores
          102,000,000 ns; a slower 100,100,000 ns workload repeats once and
          scores 100,100,000 ns. The declared argmin selects the slower arm.
        consequence: >-
          The current definition is exact only if labeled as cheapest charged
          selection-campaign arm. It cannot also serve as the fastest scalar
          baseline. Using it in scalar/transport ratios can bias the ratio
          upward.
    finite_panel_reducer:
      verdict: breaks
      basis:
      - finding: REDUCER-1
        statement: >-
          Stability requires the full seven-block reduction and seven
          leave-one-block-out reductions, but the only estimator defined is the
          median of seven normalized block costs. Every leave-one-out set has
          six values; the statement defines neither lower, upper, nor averaged
          even-sample median, nor whether the same block index is omitted in
          every endpoint and strategy term of the class ratio.
        fixed_counterexample: >-
          For remaining normalized values [1,1,1,2,2,2] against unit transport,
          lower median gives ratio 1.00, averaged median gives 1.50, and upper
          median gives 2.00. The same leave-one-out input can therefore satisfy
          the scoped-negative threshold or the positive threshold.
        consequence: >-
          Stable-positive, stable-negative, and inconclusive labels are not a
          total deterministic function of the frozen rows.
      - finding: QSTAR-1
        statement: >-
          The q-star rule is otherwise coherent if typed exactly as follows:
          return the first q in [1,16,256,4096] whose resolved ratio is at least
          1 only when every earlier ratio is resolved and below 1; return
          greater_than_4096 only when all four are resolved and below 1; return
          unresolved whenever a needed earlier cell or the no-crossing panel is
          unresolved. Interpolation remains forbidden.
        severity: clarification_required
  objections:
  - COST-ALLOC-1
  - COST-ALLOC-2
  - BASELINE-1
  - REDUCER-1
  required_controls:
  - >-
    Freeze a typed raw-event and derived-allocation schema. Reconcile unique
    components by raw event and shared components by (raw event,strategy view),
    and give every setup/warmup/selection component one explicit allocation
    rule without duplicating actual-campaign cost.
  - >-
    Separate the arm-selection statistic from the charged cost of conducting
    the selection. Select the baseline using the frozen normalized per-workload
    statistic, or relabel the existing winner and prevent any fastest-baseline
    claim. Keep all six selection campaigns charged in the scalar total either
    way.
  - >-
    Freeze an even-sample median convention and a joint leave-one-block-out
    key covering both endpoints and both strategies before any measurement.
  - >-
    Retain the declared wrong-factor, wrong-sign, missing-dual-inverse,
    four-independent-class, omitted-charge, mean-of-ratios, and missing-cell
    known-false controls.
  counterexample_or_mutation:
    primary: REDUCER-1
    description: >-
      The fixed six-value leave-one-out vector [1,1,1,2,2,2] changes the finite
      decision between negative and positive solely by an unspecified median
      convention.
  baseline_comparison: >-
    No ECDLP baseline or scientific performance was measured. The static cost
    comparison shows only that the declared adaptive-repetition argmin can
    select an arm with a higher normalized scalar workload, so it is not a
    sound fastest-scalar reference without an amendment or narrower label.
  heuristic_challenges: []
  cost_model_challenges:
  - COST-ALLOC-1
  - COST-ALLOC-2
  - BASELINE-1
  - REDUCER-1
  reduction_and_scope_challenges:
  - >-
    The two-class statement is conditional on exact certificates and does not
    support a population, causal-conductor, ECDLP-use, asymptotic, novelty,
    closure, or breakthrough claim.
  proof_architecture_challenges:
  - >-
    Proves-too-much controls reject lambda in place of 3 lambda, the negative
    scalar, a dual without rho_u^-1, and four independent floor classes.
  narrowest_supported_statement: >-
    From the curated statement alone, the corrected transported subgroup
    action is [3 lambda], its square is [-9], and four certified labeled
    kernels form two multiplicity-two target classes. For any already
    unambiguously allocated endpoint totals, the class statistic is the ratio
    of equally weighted totals and the 36-cell/q-star quantifiers have the
    narrow typed reading stated above. The complete fully charged stability
    decision is not implementation-ready until COST-ALLOC-1, COST-ALLOC-2,
    BASELINE-1, and REDUCER-1 are resolved additively.
  next_concrete_action: >-
    Coordinator should add a prospective amendment defining raw-event versus
    strategy-view allocation keys, exhaustive setup allocation, normalized
    baseline selection semantics, and the paired even-median leave-one-out
    reducer; then request a fresh blind recheck of this same joint before
    admission.
