  findings:
  - finding_key: component_arm_and_edge_reason_mapping
    severity: blocking
    evidence_class: reproduced_fixed_schema_admission_and_missing_normative_foreign_key
    exact_sources:
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/schema.json#$defs.raw_cost.allOf component clauses
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/schema.json#$defs.allocation_edge.oneOf[*].properties.reason_code
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/EXP-ECDLP-1b1b99.yaml#effective_contract.cost_contract.component_crosswalk
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/EXP-ECDLP-1b1b99.yaml#effective_contract.cost_contract.semantic_validation_predicates
    reproduced_examples:
    - >-
      A valid block_repetition psi_evaluation row remains schema-valid after changing arm
      from transport arm 1 to scalar arm 2.
    - >-
      A valid scalar_multiplication or scalar_warmup row remains schema-valid on transport
      arm 1.
    - >-
      A cold scalar edge remains schema-valid with reason_code actual_only; every edge
      variant independently accepts all six reason-code tokens.
    observed_cases:
    - 57
    - 58
    - 59
    - 77
    consequence: >-
      A serializer/validator can assign transport components to scalar selection, scalar
      components to transport, or misleading edge reasons without violating any exact
      component/phase/scope or schema clause. This can move a physical cost between the
      scalar and transport totals or candidate score.
    required_correction: >-
      Add exact allowed plane and arm domains to every arm-context component row, including
      warmup/setup/evaluation/conversion cases, and add an exhaustive reason_code mapping
      keyed by component family, strategy_view, and scenario kind. Enforce both in the
      schema where possible and in one explicit global semantic predicate.

  - finding_key: inference_writer_schema_conflict
    severity: blocking
    evidence_class: reproduced_cross_source_serialization_conflict
    exact_sources:
    - orchestration/adapter/manifest.py#deterministic_block
    - orchestration/adapter/manifest.py#block_from_env
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/schema.json#$defs.manifest.properties.run.properties.inference
    reproduced_example: >-
      The sole governing writer deterministic_block() returns all listed inference fields
      plus note. A resolution failure adds resolution_error. The manifest inference object
      has additionalProperties false and lists neither key, so both actual writer outputs
      are rejected. Fixed cases 105 and 106 reproduce the rejection without a backend call.
    consequence: >-
      A deterministic future run or a typed pre-run policy-resolution failure cannot retain
      the authoritative inference block and satisfy the bound manifest schema at once.
    required_correction: >-
      Reconcile the schema with the sole writer additively. Define closed note and
      resolution_error branches and their status conditions, or change the authoritative
      writer and corresponding governance contract together. Do not silently strip the
      provenance/error fields downstream.

  - finding_key: unlabeled_leave_one_out_identity
    severity: blocking
    evidence_class: reproduced_ambiguous_canonical_serialization
    exact_sources:
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/schema.json#$defs.manifest...R_cells.items.properties.leave_one_out
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/EXP-ECDLP-1b1b99.yaml#effective_contract.analysis_and_decision.stability_rule.omission_key
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/EXP-ECDLP-1b1b99.yaml#effective_contract.cost_contract.semantic_validation_predicates
    reproduced_example: >-
      Case 121 uses seven distinct reduced values 1/8, 1/4, 3/8, 1/2, 5/8,
      3/4, and 7/8. Reversing every governing cell's list remains schema-valid and passes
      the declared cardinality/global predicates because an item contains only kind and
      value/reason. Neither block nor omitted_block exists and no clause binds array index
      i to omitted timing_block i.
    consequence: >-
      The manifest cannot demonstrate that the same named block was omitted jointly from
      both strategies and both endpoints. A checker must invent array-order semantics,
      weakening recomputation and allowing mislabeled or permuted omissions to retain a
      valid shape.
    required_correction: >-
      Add omitted_block with the closed domain 0 through 6 to every leave-one-out item,
      require exactly one of each label for each governing cell, and recompute against the
      same label in both strategies and endpoints. An explicit immutable array-index rule
      plus exact uniqueness checks would also close the encoding, but it must be stated.

  - finding_key: untyped_manifest_failure_reason
    severity: blocking
    evidence_class: reproduced_schema_and_semantic_escape
    exact_sources:
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/schema.json#$defs.manifest...result.properties.invalid_reason
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/EXP-ECDLP-1b1b99.yaml#effective_contract.runner.result_states
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/EXP-ECDLP-1b1b99.yaml#effective_contract.authorization_and_lock.malformed_input.required_reason_codes
    - coordination/experiment-reserve/BATCH-45b4d5/corrections/TASK-20260908-5e3d88/EXP-ECDLP-1b1b99.yaml#effective_contract.artifact_custody.manifest_binding_map.validity_and_typed_outcome_reason
    reproduced_example: >-
      An infrastructure_stopped manifest with result.valid false, branch inconclusive, and
      invalid_reason banana is schema-valid and passes every stated generic nonvalid branch
      condition in the independent semantic checker (case 107).
    consequence: >-
      Required typed refusal, invalid, partial, and infrastructure outcomes are not a closed
      serialization. A future Executor must invent strings and a Validator cannot check
      status-to-reason compatibility or exhaustiveness.
    required_correction: >-
      Define a closed outcome reason-code union covering every result state, bind each code
      to its permitted status and stage, include the existing AUTH_* codes, and require a
      separate optional detail field if free diagnostic prose is needed.

  positive_holds:
  - >-
    The four previously accepted scenario/target/axis/unavailable/manifest-shape findings
    are substantially repaired: tags are closed, actual-only events need no q or seed,
