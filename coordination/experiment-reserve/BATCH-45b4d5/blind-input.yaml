blind_input:
  source_path: experiments/EXP-ECDLP-1b1b99/specification.yaml
  source_sha256: b331940a2f5215058d84845f953365c39dac78b4a0d4894604e90b06bc2f3fff
  provenance: internal; literal extraction of original frozen specification fields, with no producer implementation
    or report content.
  quantity_statement:
    inputs:
      selection: "Enumerate primes p in increasing order in [2^12,2^13), [2^14,2^15), [2^16,2^17), with p=1 mod4.\
        \ For E0:y^2=x^3-x require nonsingular ordinary E0, trace t!=0, integer f\u03C0=sqrt((4p-t^2)/4), v3(f\u03C0\
        )=1, and full rational E0[3] (nine points, eight nonzero, four distinct cyclic kernels). Let r be the largest\
        \ prime divisor of N=#E0(Fp); require r>=127, r!=3,p, v_r(N)=1. Select first two eligible p per interval\
        \ before any timing. Search at most 4096 prime candidates total and stop at preparation budget. Never replace\
        \ a selected slow instance."
      field_and_points: "Field elements canonical integers 0..p-1. Choose iota as the smaller square root of -1.\
        \ Choose G0 by scanning affine points lexicographically in (x,y), multiplying by N/r, taking first nonzero\
        \ output; at most 4096 x values. Record all candidate work. Enumerate rational 3-kernel generators canonically\
        \ (pair \xB1K shares a kernel), sort by kernel polynomial coefficients. Construct all four normalized V\xE9\
        lu \u03C6j and their exact duals \u03C8j; certify duals and normalize codomain model/isomorphism explicitly."
      levels: "E0 has maximal order Z[i]. Require all four distinct quotient models to have conductor 3, using a\
        \ certificate of D\u03C0=-4 f\u03C0\xB2 and the degree-3 downward edge from maximal order with 3 inert in\
        \ Q(i); count rational 3-isogenies on each quotient as a crosscheck, retaining multiplicities and exceptional-j\
        \ bookkeeping. Independent mathematical review must certify this level rule before execution. A missing\
        \ certificate is unavailable_fixture, never an assumed label."
      eigenvalue: "Calculate the two square roots \xB1\u03BB of -1 modulo r, test both [\u03BB]G0 against i(G0),\
        \ choose the unique match; charge modular square root and both scalar multiplications. Gi=\u03C6i(G0) is\
        \ nonzero, order r; require \u03C8i(Gi)=[3]G0. m=(3\u03BB mod r)."
      queries: "q in [1,16,256,4096], independent input points Rj=[sj]Gi with sj uniformly drawn from 1..r-1 by\
        \ SHA256 rejection sampling. Repetition is allowed and flagged when q>r. No per-input cache, full multiplication\
        \ table or scalar labels are supplied to timed evaluator. Generator/fixture labels live only in verifier\
        \ input; normal form of public curve, r,m, \u03C6,\u03C8 is allowed."
      unavailable_fixture: "If fewer than two eligible classes per interval or a certificate/point search cap fails,\
        \ retain the partial panel and report incomplete/inconclusive. Do not expand ranges, lower r, alter v3(f\u03C0\
        ) or substitute a different CM family."
    controls:
    - id: composition
      description: "On G0/Gi and 128 seed-derived public scalars per endpoint verify dual identities, i\xB2=-1 and\
        \ \u03B2=[m]; replay every measured output against the fastest declared scalar baseline."
    - id: coordinate
      description: "Repeat equivalent workloads under (x,y)\u2192(u\xB2x,u\xB3y), u=2,3, including equation/map\
        \ conjugation. Both arms use the same backend and coordinate convention, and conversion/setup is charged.\
        \ Structural operation counts should match after canonical normalization; discrepant counts are an instrument\
        \ warning requiring explanation before interpretation."
    - id: level
      description: 'Compare maximal E0 direct [3]i against scalar m, and all four conductor-3 floors against one
        another. The four floors are paired endpoints within one class, not independent classes. Do not call top-vs-floor
        timing a causal conductor effect: special automorphism and map form are intentionally linked.'
    - id: identity_transport
      description: "\u03C6=\u03C8=identity on the same curve with direct i is a map-overhead calibration; report\
        \ its setup separately. A deliberately wrong eigenvalue sign must fail a nonzero-point identity check."
    - id: label_permutation
      description: Permute floor labels and reaggregate the same costs; class summary must be unchanged. Do not
        assign significance to permutation of only two genuinely different arithmetic levels.
    metrics:
      primary:
      - Per-class fully charged total CPU ratio Rq=Tbest_scalar(q)/Ttransport(q), with all four floors aggregated
        with equal weight. Report q=1 separately; success primary is q=4096.
      - 'Break-even q*: least q in frozen query ladder with Rq>=1, or >4096; no interpolated empirical claim.'
      secondary:
      - Construction/evaluation/verification CPU and wall seconds, peak RSS, map degree/coefficient bytes, field
        multiplications/squarings/inversions, group operations and table bytes.
      - One-shot ratio; each floor and each coordinate arm; minimum/maximum per-class ratio; cold and warm totals
        kept separate.
    algorithms:
      transport: "For each floor evaluate \u03C8i(R), i(result), \u03C6i(result); this returns [3\u03BB]R, NOT [\u03BB\
        ]R. No omitted multiplication by 3 inverse. Source floor known via fixture construction; all forward discovery\
        \ costs are included. General backward path search from an arbitrary floor is outside the measured interface."
      baseline: Compare binary double-and-add, width-w nonadjacent scalar multiplication w=2,3,4,5 including every
        per-point table, and pinned library scalar multiplication [m]R. Scalar is fixed but points vary. Choose
        fastest baseline using only seed 606101 at q=256; freeze choice before reporting confirmatory seed 606103.
        Also report the oracle minimum across these arms as a conservative descriptive comparator and disclose selection.
        No unsupported claim to best possible scalar algorithm. On E0 add direct [3]i as mandatory known-resource
        baseline.
      cost_formula: "Let Cshared be only constructing the supplied public source curve equation, verifying nonsingularity,\
        \ reading supplied public N and r and their primality/divisibility certificates, and reading supplied m.\
        \ Primary Ttransport(q)=Cshared+Cdiscovery_all_candidates+Cpointcount_factor+Ckernel_search+Cmaps+Clevel_cert+Ceigenvalue_sign+Cnormalization+sum_q(C\u03C8\
        +Ci+C\u03C6+Cverify). Primary Tscalar(q)=Cshared+Calgorithm_selection+Cscalar_setup+sum_q(Cmul+Cverify).\
        \ Discovery, point counting/factorization used to find the chosen source, level certificates, maps and \u03BB\
        -sign identification are unique to transport and never canceled or credited to the scalar branch. Cshared\
        \ is included on both primary totals and may be canceled only in a separately labelled secondary table.\
        \ Query-generation cost is shared experimental scaffolding, reported separately; scalar labels never reach\
        \ either evaluator. Charge actual timing repetitions to resource budget; normalize only to the declared\
        \ q workload. Setup is counted once per class batch, never spread across unrelated classes."
    replication:
      seeds:
      - 606101
      - 606103
      independent_instances: 6
      unit: Class is the unit; four floors and coordinate models are paired controls, not independent replicates.
      timing: Warm one untimed call per arm; then seven timed blocks per workload, each repeating the entire query
        list until >=0.1 CPU seconds or 100 repeats. Report median block CPU, all blocks and repeats. Charge actual
        repeated execution to run resource budget; normalize per workload for cost table. Alternate arm order by
        seed and report wall/CPU disagreement.
    success_criterion: Complete valid six-class panel; R4096>=1.20 for all six classes in both seeds and every coordinate
      arm; mandatory top baseline and full search charges included. This nominates only the known auxiliary calibration
      for independent verification.
    falsification_criterion: 'Complete valid six-class panel and R4096<=1 for all six classes in both seeds and
      every coordinate arm: no amortized gain of the specified kind at the tested scale. Any mixed outcome, gain
      below20%, missing panel or unstable timing is inconclusive for the declared hypothesis.'
    operation_count_rule: Only explicitly instrumented arithmetic yields measured operation counts. Opaque Sage/PARI/library
      arms report operation counts unavailable, plus measured CPU/wall/RSS; never infer exact counts from elapsed
      time. The primary comparison is CPU, using the same process/backend and declared timing convention.
