review_plan:
  claim_under_review: Source-bound full implementation admission conformance of the third corrected spectral runner
    under original specification and DEC-20260907-38017a; no scientific evidence or launch approval.
  coordinator_prior: 'Before this fresh session: the third producer reports V01-V08 preserved and all eight S2 defects
    repaired, with final44/44 fixed cases PASS after116 total attempts including seven retained initial failures.
    Parent verified the six exact output hashes and read the full report and receipt. Full readiness remains uncertain:
    final-directory failure custody, exact exploration/heldout distinction, complete diagnostic accounting, authentic
    admission ancestry and dense-loop guards require adversarial integration checks. Prior is unresolved readiness,
    not presumed PASS.'
  recorded_before_reviewers: true
  source_snapshot: 1cf7cc7004bd058eb92b81d65f05e89f6aff71d0
  joints:
  - joint: Corrected executable spectral protocol and admission/custody conformance
    assigned_to: TASK-20260908-969801
    attack_plan: Read the entire unchanged specification/amendment and third corrected implementation. Audit every
      obligation and canonical output, not merely V01..V08. Independently construct fixed synthetic/mock attacks
      on exploratory/heldout ordering and missing cells, failed certificate immediate stop, topology/first-repeat
      summaries and per-diagnostic costs, UTC/CPU intervals, post-rename/quarantine/receipt failures, genuine producer-source
      to review-archive to executing-commit ancestry with exact source hashes, forged admission, and cancellation/RSS
      in every dense loop. Prior reports/checks are deliberately visible after archive and may be used as regressions,
      but a passing copied suite is not independent full-source evidence. Specifically challenge S2 relabel tuple(u=0),
      typed incomplete fixture vs unexpected failure, coverage derived from actual retained diagnostics and costs,
      failure-receipt durability/quarantine truth, canonical six-hex run-id and non-symlink root allocation binding,
      complete genuine independent review-plan/attestation/session/source/commit receipt verification, missing or
      malformed current-process-group RSS, and every inner-loop guard/progress path without invoking a future-run
      entrypoint. Include lower-level malformed admission fields and partial output cases. The internal receipt
      must not self-reference its own commit hash; the external queue binding supplies exact Git-resolved snapshot
      provenance.
    breaking_artifact: Exact source path/line or bounded independent synthetic reproduction of a frozen obligation
      violation; untested uncertainty explicitly distinguished from reproduced defects.
  blindness:
    mutual: false
    lifted_for:
    - TASK-20260908-969801
    rationale: Fresh independent hardening review after both prior spectral rounds and the third corrected producer
      were archived. Prior completed reports/checks and source versions are deliberately visible; no concurrent
      reviewer report or parent conversation may be read.
  proves_too_much:
    objects:
    - Zero successful collisions with positive work, for which finite charged cost is undefined.
    - Unequal-success null arms whose mean cost differs from total work divided by total successes.
    - One missing heldout cell or one coordinate arm that fails the effect threshold, for which a complete-panel
      positive verdict is false.
    - An arbitrary hash-bound text document or forged PASS report without reachable archive/source binding.
    - A completed-looking final directory missing one mandatory canonical artifact.
    - A failed certificate hidden among otherwise successful controls.
    - A failed first exploratory cell followed by any scheduled heldout work.
    - A post-rename parent-fsync or quarantine failure that leaves a canonical-looking failed run without an explicit
      durable state.
    - A valid-looking archived PASS report for different source bytes or the wrong reviewed/executing commit roles.
    failure_signature: The derivation must refuse finite gain for zero successes and refuse a positive complete-panel
      verdict for missing or failed arms; use pooled work/success counts.
    assigned_to: TASK-20260908-969801
  blind_rederivation:
    required: false
    quantity: Unchanged coefficient identity and pooled cost ratios already independently derived by TASK-20260907-2f3a77
      before producer correction.
    parameters: The prospective availability amendment explicitly selects Zcoord>0 and sum(Znull)>0 and retains
