    prior_review_task: TASK-20260907-2f3a77
    prior_archive_commit: aeea9f8ad3ed455baa88d01ebb1853617d5956c1
  procedure_deviations: []
  scope_limit: Implementation admission review only, zero scientific runs; no approval or scientific transition.
