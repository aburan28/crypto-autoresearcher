review_plan:
  claim_under_review: Producer reports implemented_pending_independent_review, protocol_complete:false and archive_pending:true
    for the prospective EXP-ECDLP-651b94 implementation; determine the exact remaining barriers before scientific
    launch. No empirical or complexity claim is under review.
  coordinator_prior: 'Before reviewer dispatch: the Coordinator expects at least one substantive correction before
    measurement. Several controls and runner obligations were implemented only after parent inspection and received
    static checks, not a new test pass. Likely weak points are manifest/failure semantics, partial-data preservation,
    cancellation/RSS enforcement, exact RNG/panel coverage and the distinction between formula correctness and faithful
    implementation.'
  recorded_before_reviewers: true
  source_snapshot: da2753868e183e40512410baa0e7e79c6595da54
  joints:
  - joint: Faithful executable arithmetic, fixture/RNG/control pipeline, launch authenticity and canonical outcome
      custody
    assigned_to: TASK-20260907-774962
    attack_plan: Trace every frozen obligation to executable code. Use synthetic finite transition tables and mock
      I/O/runtime/locks to challenge conjugation, reset maps, zero-success collisions, forged/stale lock rejection,
      resource/cancellation classification, partial output retention and manifest schema. Check producer hash/plan
      bindings at the exact snapshot. Report executable counterexamples or precise source-line defects, not merely
      missing metadata. Do not execute the experimental fixture/census/control matrix.
    breaking_artifact: A reproducible bounded synthetic check failure or exact code path that violates an identified
      frozen obligation; separate untested gaps from proven defects.
  - joint: Blind mathematical derivation of charged useful-collision/null cost and finite all-coordinate decision
      rules
    assigned_to: TASK-20260907-2f3a77
    attack_plan: From the frozen quantity statement and parameters only, derive the cost and pooled-null denominators,
      coefficient recovery sign and verification charge, unavailable-cell rule and the all-u positive/negative/inconclusive
      conjunction. Construct unequal-success-count and zero-success synthetic tables where averaging arm ratios
      gives the wrong comparison. Explain finite-panel scope and which group relabeling can preserve the result.
      Do not read producer implementation, notes, tests, or report.
    breaking_artifact: An explicit arithmetic table, coefficient identity, or quantifier counterexample that changes
      a claimed comparison or branch.
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
    - Zero successful collisions with positive work, for which finite charged cost is undefined.
    - Unequal-success null arms whose mean cost differs from total work divided by total successes.
    - One missing heldout cell or one coordinate arm that fails the effect threshold, for which a complete-panel
      positive verdict is false.
    failure_signature: The derivation must refuse finite gain for zero successes and refuse a positive complete-panel
      verdict for missing or failed arms; use pooled work/success counts.
    assigned_to: TASK-20260907-2f3a77
