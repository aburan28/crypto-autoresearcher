blind_input:
  source_path: experiments/EXP-ECDLP-651b94/specification.yaml
  source_sha256: 97b44f40c8f9d52a587cf4fd9788dd391e42ce5c6dab8ec212a8af34cdfa4eee
  provenance: internal; literal parsed field extraction from frozen specification, no producer code/report contents.
  quantity_statement:
    id: EXP-ECDLP-651b94
    inputs:
      fixtures: "For b in[9,11], enumerate the first32 primes p>=2^b and curves y\xB2=x\xB3+x+B, B=0..31, lexicographically.\
        \ Discard singular and supersingular curves. Let r be the largest prime divisor of N in[127,509] with v_r(N)=1\
        \ and r!=p. Select first two eligible distinct p per b before any graph/partition measurement. G is first\
        \ nonzero [N/r]P from points ordered by(x,y), x<=min(p-1,4095). Certify order and enumerate G exactly by\
        \ repeated addition."
      seeds: Seed numbers606300..606315 inclusive; indices0..7 exploratory control checks,8..15 held out. SHA256
        rejection sampling with domain-separated strings experiment/fixture/seed/purpose/counter supplies every
        integer. Archive complete stream specification. For each seed select a in1..r-1, Q=[a]G. Only isolated verifier/reference
        receives a; rho transition receives G,Q,r and point coordinates.
      partitions: "For u=1,2,3 conjugate equation,G,Q by (x,y)\u2192(u\xB2x,u\xB3y). At infinity set c(O)=0; otherwise\
        \ c(R)=integer(x(R)) mod3. Define F(R)=R+G if c=0, R+Q if c=1, [2]R if c=2. For each cell make seven independent\
        \ uniformly shuffled assignments of the same multiset of c-values to the canonical lexicographically sorted\
        \ point list, via SHA256 rejection-sampled Fisher-Yates. Shuffles preserve branch counts, not the original\
        \ transition graph."
      unavailable_fixture: Fewer than two distinct-p fixtures per b, point search cap or invalid subgroup => incomplete/inconclusive;
        do not widen r,p or permit supersingular substitutions.
      baseline_calibration: "Build symmetric lazy K on all r points with weights1/2 stay and1/8 for\xB1G,\xB1Q.\
        \ Degenerate coincident moves add weights. Separately build labelled cyclic reference from a only in verifier.\
        \ This is a reversible doubly stochastic operator; \u03BB1=1 and gap=1-max(nonconstant eigenvalues). r prime\
        \ and G nonzero ensure connectedness. Do not compute a purported rho gap from this formula."
    controls:
    - id: cayley_exact
      description: All entries nonnegative, row/column sums1 within1e-12; eigenvalue multiset matches Fourier formula
        within1e-10 using128-bit arithmetic. For t=0,1,2,4,8,16,32 compare point-basis distribution from O to inverse-Fourier
        distribution in total variation within1e-10. Report actual total variation, not an inferred DLP benefit.
    - id: relabel
      description: Apply one seeded bijection simultaneously to state names and the fixed transition/coefficient
        action table. First-collision length and useful relation count must be exactly identical. This identity
        is only an instrument control; shuffled partitions are a different operation.
    - id: known_false
      description: "Replace F by the constant O map with tracked coefficients reset to(0,0). Every repeated O collision\
        \ has \u0394B=0 and must be fruitless; any reported solve fails control. Also modify one candidate recovered\
        \ scalar by1 modr and require independent curve certificate failure."
    - id: occupancy
      description: Every shuffled partition has exactly the same three bucket counts as the coordinate arm. Report
        counts and seven null results individually, retaining zero-yield arms.
    - id: coordinate
      description: Frozen u=1,2,3 are separate primary comparisons. A positive in one coordinate model only is representation-specific
        and falls into inconclusive for the robust effect hypothesis.
    metrics:
      primary:
      - "For each curve/seed/u/arm enumerate all r starts R0=[s]G with known initialization(A0,B0)=(s,0), s=0..r-1.\
        \ Stop each at first repeated point, at most r+1 transitions. Update coefficients by the matching +G,+Q\
        \ or doubling rule. Let w_s be actual group additions+doublings through that repeat; let v_s be scalar-verification\
        \ group operations for nonzero \u0394B; let z_s=1 iff \u0394B!=0 and a_hat=(A_old-A_new)/(B_new-B_old) verifies\
        \ [a_hat]G=Q. C=sum_s(w_s+v_s)/sum_s z_s, infinity if no success. This charges fruitless work under uniform-start\
        \ restart; group adds/doubles are reported separately as well."
      - 'Cnull pools all seven shuffles: sum their work / sum their successes, not mean of per-shuffle ratios. d=log(Cnull/Ccoord);
        any infinity makes that inferential cell unavailable but remains in raw results.'
      secondary:
      - Mean first-repeat length, useful fraction, fixed points, two-cycles, component sizes, max tail/cycle length
        and full collision certificates.
      - Fully charged measured CPU and wall per diagnostic, including subgroup enumeration, shuffle construction,
        partition queries, collision table memory, all rejected starts and verification; separate from primary step
        diagnostic.
      - Cayley gap and measured total-variation curve only in separately named reversible calibration. No rho eigen-gap,
        singular-gap mixing bound, stationary-uniformity claim or inferential p-value.
    replication:
      seeds:
      - 606300
      - 606301
      - 606302
      - 606303
      - 606304
      - 606305
      - 606306
      - 606307
      - 606308
      - 606309
      - 606310
      - 606311
      - 606312
      - 606313
      - 606314
      - 606315
      independent_instances: 4
      unit: Curves are fixed independent fixtures; seeds vary targets and shuffled assignments. Repeated starts
        are an exhaustive census, not independent statistical samples.
    success_criterion: Complete valid four-curve panel and all32 finite held-out cells per u; all three u satisfy
      mean d>=log(1.20) and positive mean for each fixed curve. Nominates only a finite coordinate diagnostic for
      independent review, not a population effect.
    falsification_criterion: Complete valid finite panel and d<=0 in every held-out cell for all three u. No coordinate-work
      advantage is present in this finite panel. Positive and negative criteria are mutually exclusive; every other
      pattern, including mixed signs or missing/zero-yield cells, is inconclusive.
    decision_branches:
      positive: Independently rederive useful-work statistic from definitions and replay certificates; only then
        design a separate mechanism/scale study if missing user proposal is supplied and admission cleared.
      negative: Record all cell ratios and exact finite boundary; keep the missing user idea open. No global spectral/random-walk
        closure or confidence exclusion.
      inconclusive: Report missing cells, infinite costs or intermediate effects. Do not tune against held-out data;
        require a new precommitted hypothesis for any anomaly follow-up.
