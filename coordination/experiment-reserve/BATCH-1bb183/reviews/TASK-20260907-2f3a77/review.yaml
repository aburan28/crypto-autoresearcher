  owned_joint_verdicts:
    - joint: >-
        Blind mathematical derivation of charged useful-collision/null cost
        and finite all-coordinate decision rules
      verdict: NEEDS_CORRECTION
      review_plan_verdict: breaks
      exact_scope: >-
        The coefficient identity, verification charge, arm cost, pooled-null
        ratio, logarithmic comparison, and positive/negative conjunction are
        derivable. The frozen text does not uniquely determine whether a
        single zero-success null arm makes the inferential cell unavailable
        when the seven-arm pooled null denominator remains positive. The two
        readings yield different decision branches on an explicit finite
        table, so mathematical launch readiness on this joint requires an
        additive protocol clarification.
      worked_attack: >-
        Derived every quantity from R=[A]G+[B]Q and the frozen all-start
        census; applied the zero-success and unequal-success proves-too-much
        controls; compared total-work/total-success pooling with an unweighted
        mean of arm ratios; expanded the all-u decision into its 96-cell,
        three overall-mean, and twelve curve-mean conjunctions; and checked
        missing-cell, failed-u, strict curve-mean, and relabeling boundaries.
      breaking_artifact: >-
        With Ccoordinate=5, null arm 1 having (W,Z)=(100,0), and null arms
        2..7 each having (W,Z)=(60,10), the direct pooled definition gives
        Cnull=460/60=23/3 and d=log(23/15)>log(1.20). Yet arm 1 has
        C1=infinity, so the sentence "any infinity makes that inferential cell
        unavailable" also makes d unavailable. The same frozen inputs
        therefore admit positive-cell and unavailable-cell readings.
  objections:
    - statement: >-
        The unavailable-cell rule is ambiguous for a zero-success individual
        null arm when at least one other null arm succeeds.
      severity: substantive_prelaunch_correction
      basis: >-
        The specification first defines an arm-level C as infinity at zero
        successes, then defines Cnull directly by pooling all seven arms, and
        finally says any infinity makes the inferential cell unavailable. It
        does not say whether "any" ranges only over Ccoordinate and pooled
        Cnull or also over the seven arm-level costs.
      decision_impact: >-
        The explicit (100,0), six-times-(60,10) null table has finite pooled
        cost and crosses the effect threshold, while the individual-infinity
        reading censors the cell. Missing versus finite cells can change the
        positive/inconclusive branch.
      required_correction: >-
        Before launch, additively freeze exactly one availability predicate:
        either Zcoordinate>0 and sum_j Znull,j>0, with zero-yield null arms
        charged through their work; or Zcoordinate>0 and every Znull,j>0,
        with any zero-yield null arm making the cell unavailable. State the
        choice directly in the success/falsification and analysis rules.
      recommended_resolution: >-
        Prefer the pooled-side predicate Zcoordinate>0 and sum_j Znull,j>0.
        It follows the expressly frozen pooled estimator and the instruction
        to retain and charge zero-yield null arms. If the intended estimand
        instead requires every fixed null shuffle to be individually usable,
        freeze the stricter every-arm predicate and name that different
        stability requirement explicitly.
  required_controls:
    - >-
      Preserve direct seven-arm pooling as sum_j W_j / sum_j Z_j. Never replace
      it with an unweighted mean of per-arm W_j/Z_j values.
    - >-
      Treat zero total successes on either inferential side as unavailable;
      never insert +infinity, -infinity, a cap, or a deleted cell into a held-out
      mean.
    - >-
      Require all 96 held-out curve/seed/u cells to be finite before either the
      positive or negative complete-panel branch can fire.
    - >-
      Apply the positive criterion separately to every u and every fixed curve;
      do not pool coordinates or let strong cells substitute for a failed u or
      nonpositive curve mean.
  counterexample_or_mutation: >-
    The derivation note gives three worked families: a seven-null unequal-success
    table where averaging arm ratios reverses the sign of d; zero-total-success
    tables that must remain unavailable; and complete/missing finite panels that
    distinguish positive, negative, and inconclusive conjunctions. The
    single-zero-null-arm table above is the decision-changing break.
  baseline_comparison: >-
    No Pollard-rho, BSGS, specialized ECDLP, CPU, wall-clock, memory, or
    asymptotic baseline is under review. The only comparison is the frozen
    primary diagnostic: abstract transition-plus-verification group operations
    per verified useful collision for the coordinate arm versus the pooled
    seven occupancy-matched null arms. At d=log(1.20), coordinate throughput is
    1.20 times null throughput and coordinate work is 1/1.20=5/6 of null work,
    a 16.7 percent cost reduction rather than a 20 percent cost reduction.
  heuristic_challenges: []
  cost_model_challenges:
    - >-
      C charges transition group operations and explicit scalar-verification
      group operations for every nonzero collision denominator, including
      failed candidates, and charges every fruitless start in W. It does not
      by itself establish CPU, memory, setup, subgroup-enumeration, shuffle,
      field-arithmetic, inversion, or end-to-end ECDLP cost.
    - >-
      Equal-weight means are taken over cellwise logarithms after forming each
      cell's coordinate and pooled-null costs. Pooling work and successes across
      held-out cells or taking a ratio of arithmetic mean costs would implement
      a different statistic.
  reduction_and_scope_challenges:
    - >-
      A seeded state relabeling preserves the primary diagnostic only when it
      conjugates the full transition system, transports every start, and keeps
      the coefficient-action label with the corresponding transition. An
      occupancy-matched branch shuffle is not such a conjugacy.
    - >-
      The coordinate scaling is a group isomorphism when u is nonzero and the
      equation, G, and Q are transported. Recomputing c(R)=integer(x(R)) mod 3
      after scaling is representation dependent, so the three u arms need not
      agree and must remain separate.
    - >-
      The decision concerns exactly four frozen toy curves, held-out seeds
      606308..606315, u=1,2,3, all r starts, and seven null arms per cell. It
      supports no curve-population, randomness, asymptotic, CPU, memory,
      cryptographic-scale, or general spectral conclusion.
  proof_architecture_challenges:
    - >-
      The zero-total-success control correctly blocks finite d. The
      unequal-success control requires direct pooling. The missing-cell and
      failed-coordinate controls correctly block the positive conjunction.
      The single-zero-null-arm case exposes the unresolved quantifier in
      "any infinity".
  narrowest_supported_statement: >-
    Conditional on an explicit choice of the zero-null-arm availability rule,
    the frozen definitions uniquely determine the coefficient sign, charged
    cost ratios, logarithmic effect, and complete finite-panel decision. This
    analytic agreement says nothing about whether an unseen implementation
    computes them faithfully and supplies no mathematical or empirical
    evidence for the underlying ECDLP direction.
  next_concrete_action: >-
