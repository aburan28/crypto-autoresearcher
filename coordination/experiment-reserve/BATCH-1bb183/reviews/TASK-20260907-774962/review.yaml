  findings:
    - id: F-01
      verdict: NEEDS_CORRECTION
      title: Singular frozen candidates abort enumeration instead of being discarded
      frozen_obligation: >-
        specification.yaml inputs.fixtures says singular curves are discarded
        while the lexicographic p,B scan continues.
      code_evidence:
        - >-
          driver.py:151-165 constructs Curve(p,1,B) at line 155 before any
          discriminant guard or ValueError handler.
        - >-
          driver.py:81-83 raises ValueError for a singular curve.
      worked_attack: >-
        The static/synthetic case constructed Curve(7,1,2), whose discriminant
        is zero modulo 7. Curve correctly raises. Inspection then confirmed
        fixture_candidates has no catch/discard path, so the generator would
        terminate at such a B instead of advancing.
      impact: >-
        A singular candidate in the frozen lexicographic range stops fixture
        selection and prevents the declared incomplete/no-widening logic from
        making an honest panel decision.
      necessary_fix: >-
        Test the discriminant before Curve construction or catch only the
        singular-curve exception, record the rejection, and continue to the
        next B without changing the frozen ordering or bounds.
    - id: F-02
      verdict: NEEDS_CORRECTION
      title: The constant-O known-false control is asserted rather than executed
      frozen_obligation: >-
        controls.known_false requires the constant O map with tracked labels
        reset to (0,0), every repeated-O collision retained, delta-B zero, and
        no reported solve.
      code_evidence:
        - >-
          driver.py:323-334 initializes delta_b_zero=True, sets state=None and
          A=B=0, reads seen.get(...,(0,0)), and compares two zero B labels. It
          never executes the reset map, advances to the second O, records a
          collision, or checks that the pipeline reported no solve.
      worked_attack: >-
        Static executable-path inspection required a reset transition/census
        and collision or success output. Neither exists; the bounded check
        therefore reproduced a fail without invoking a real curve fixture.
      impact: >-
        constant_map_delta_b_zero can be true even if the future reset-map
        implementation or outcome reporting is absent or wrong, so this named
        known-false control cannot detect a proves-too-much solver path.
      necessary_fix: >-
        Implement an explicit all-start constant-O transition/collision census
        with coefficient reset, retain each collision and success count, and
        require zero nonzero denominators and zero solves.
    - id: F-03
      verdict: NEEDS_CORRECTION
      title: Failed certificate and named-control outcomes do not invalidate a run
      frozen_obligation: >-
        Any scalar certificate, exact relabel, occupancy, or known-false failure
        invalidates measurement; every candidate remains retained and charged.
      code_evidence:
        - >-
          driver.py:217-225 turns a failed nonzero-denominator candidate into
          successes+=0 but exposes no invalidation flag.
        - >-
          driver.py:385-386 stores known_false booleans without requiring them
          to be true.
        - >-
          driver.py:451-453 emits completed_valid solely because the pipeline
          returned, without reducing all named control/certificate outcomes.
      worked_attack: >-
        A mocked panel carrying false constant-map and mutated-candidate
        booleans was passed to the canonical output path. The manifest was
        emitted with status completed_valid.
      impact: >-
        A failed known-false control or arithmetic certificate can coexist with
        a nominally valid run package.
      necessary_fix: >-
        Add one explicit validity reduction over every coordinate/null
        certificate and named control before outcome classification. Preserve
        the failing artifacts, set completed_invalid only for measurement or
        control invalidity, and never count a certificate failure as an
        ordinary fruitless collision.
    - id: F-04
      verdict: NEEDS_CORRECTION
      title: Future manifests and companion files are not ledger-admissible
      frozen_obligation: >-
        The artifact_binding requires exact command, executing revision and
        dirty state, environment, resource measurements and validity. The
        repository minimum package also requires command.txt,
        environment.json and raw-result.json.
      code_evidence:
        - >-
          driver.py:431-432 hard-codes code.commit=null and dirty=true, omits
          code.command, resources.cpu_seconds, result.certificate and the
          artifacts map, and emits empty result.metrics.
        - >-
          driver.py:452-453 and 456-463 emit nine experiment-specific files but
          never command.txt, environment.json, or raw-result.json.
        - >-
          tools/validate_ledger.py:697-714 requires a nonempty commit and
          command plus those companion artifacts.
        - >-
          harness/runner.py:594-665 shows the standard provenance and package
          fields available to reuse.
      worked_attack: >-
        Generated _manifest with synthetic inputs and compared its shape to the
        declared minimum. The case found missing code.commit, code.command,
        resources.cpu_seconds, result.certificate and artifacts.
      impact: >-
        Even a scientifically complete future execution would fail the current
        ledger reproduction-package validator and would not bind the command or
        revision that actually ran.
      necessary_fix: >-
        Route final persistence through a standard runner or reproduce its
        execution-time provenance exactly, including source hashes when dirty;
        emit all minimum companion files alongside the experiment-specific
        artifacts and validate the package before exposing the run directory.
    - id: F-05
      verdict: NEEDS_CORRECTION
      title: Cancellation and resource stops lose partial data and are mislabeled
      frozen_obligation: >-
        CPU, wall, RSS and cancellation stops preserve all data and are
        partial/inconclusive; they are not invalid measurements or scientific
        evidence.
      code_evidence:
        - >-
          driver.py:442 sets fixtures=[] and panel=[] outside the producer
          helpers; assignments at lines 448-450 occur only after each helper
          returns, so an exception discards their internal progress.
        - >-
          driver.py:446 runs the first checkpoint outside the preservation
          try-block.
        - >-
          driver.py:454-465 maps every exception, including cancellation and
          RSS exhaustion, to completed_invalid.
      worked_attack: >-
        A mocked future_panel created one completed synthetic row and then
        raised LaunchRefused('cancelled'). The persisted manifest reported
        completed_invalid and raw.jsonl retained zero rows. A separate initial
        RSS mock raised before any terminal package was written.
      impact: >-
        Completed cells can disappear on interruption, while operational stops
        are recorded as data invalidity. The resulting package cannot support
        honest coverage or failure semantics.
      necessary_fix: >-
        Put every checkpoint inside a typed preservation boundary; append
        fixtures, rejection records, cells and attempts to an owned progress
        sink as they complete; map cancellation and resource exceptions to
        their distinct terminal statuses and an inconclusive interpretation.
    - id: F-06
      verdict: NEEDS_CORRECTION
      title: Frozen wall and CPU budgets are not enforced
      frozen_obligation: >-
        The future run has a 5400-second wall limit, 1.5 CPU-hour limit,
        per-stage limits and an 8 GiB process-group RSS stop.
      code_evidence:
        - >-
          driver.py:443-445 checks only a cancellation callback and this
          process's ru_maxrss. It never compares elapsed wall time or CPU time,
          never enforces stage deadlines, and does not measure a process group.
      worked_attack: >-
        With all scientific functions mocked, monotonic time advanced from zero
        to 5401 seconds. The pipeline still emitted completed_valid.
      impact: >-
        A run can exceed the frozen wall/CPU plan and still claim valid
        completion; cancellation latency inside collision_census is also
        unbounded because it receives no checkpoint.
      necessary_fix: >-
        Use runner-owned monotonic and CPU/process-group accounting, check
        within long start/transition loops, classify overruns as
        resource_exhaustion, and record total and per-stage measured resources.
    - id: F-07
      verdict: NEEDS_CORRECTION
      title: Final run-directory publication is non-atomic
      frozen_obligation: >-
        Canonical run artifacts are immutable, complete, and never exposed as a
        partial package under their final run id.
      code_evidence:
        - >-
          driver.py:408-415 creates the final run directory first and writes
          each artifact directly with no staging directory, fsync, aggregate
          verification, or atomic rename.
      worked_attack: >-
        A mocked write error at raw.jsonl left the final immutable run directory
        containing manifest.yaml and fixtures.json. A retry would then be
        refused by line 409.
      impact: >-
        An I/O failure can consume the run id and expose a package that is both
        incomplete and unrecoverable through the same canonical writer.
      necessary_fix: >-
        Write and hash all files in a sibling staging directory, fsync as
        appropriate, verify the full declared set, and atomically rename only
        after completion. Preserve a typed infrastructure-failure receipt if
        publication itself fails.
    - id: F-08
      verdict: NEEDS_CORRECTION
      title: Rejected fixtures, cost components, calibration gap and global branch lack canonical custody
      frozen_obligation: >-
        Fixtures retain accepted and rejected candidates with certificates;
        costs separate transition/add/double/verification work and measured
        time; Cayley calibration reports its gap; and the run records one
        global positive, negative or inconclusive finite-panel branch across
        all three u values.
      code_evidence:
        - >-
          driver.py:151-165 yields only eligible candidates and no rejection
          reason; lines 448-453 persist only selected fixtures.
        - >-
          driver.py:292-301 reports stochastic/eigen/TV errors but no Cayley
          gap value.
        - >-
          driver.py:399-400 returns three per-u labels but no global all-u
          conjunction.
        - >-
          driver.py:431-432 leaves manifest result.metrics empty; line 453
          writes costs.csv with only curve_id,seed,u,d and report.md with only
          the per-u decision dictionary.
      worked_attack: >-
        Static data-flow tracing followed every produced object to all nine
        artifacts; no omitted value is written elsewhere.
      impact: >-
        The canonical package cannot reconstruct fixture rejection coverage,
        charged cost components, the requested Cayley secondary metric, full
        resource diagnostics, or the experiment's declared aggregate branch.
      necessary_fix: >-
        Add a rejection ledger with candidate certificates; serialize Ccoord,
        pooled Cnull, work/success denominators, operation splits and measured
        CPU/wall data; report the calibrated gap separately from rho; compute
        and store exactly one global all-u branch plus its per-u inputs.
    - id: F-09
      verdict: NEEDS_CORRECTION
      title: implementation_review_receipt has byte binding but no semantic or archival verification
      frozen_obligation: >-
        A real launch follows archived independent implementation review and
        binds that review to the exact producer snapshot.
      code_evidence:
        - >-
          driver.py:521-525 accepts any existing file whose bytes match the
          lock's path/hash pair; it does not parse a review attestation, verify
          the owned-joint verdict, bind source_snapshot, or verify a reachable
          Coordinator archive receipt.
      worked_attack: >-
        The correctly signed ephemeral-lock case used a file containing only
        synthetic:true as implementation_review_receipt. Its path/hash check
        passed. The signature and all other lock bindings were genuine for the
        ephemeral test key, so this isolates the receipt semantic gap.
      impact: >-
        The local verifier cannot distinguish an archived independent review
        from an arbitrary hash-bound file. A Coordinator signature still
        authenticates the lock, but the code does not enforce the review gate
        its field name claims.
      necessary_fix: >-
        Bind and validate a Coordinator-authored review archive receipt that
        names this review task, source snapshot and exact review hashes, then
        verify its commit reachability and required verdict before launch.
