  findings:
    - id: S3-01
      verdict: NEEDS_CORRECTION
      title: Review admission still accepts incomplete, contradictory, and unbound review authority
      frozen_obligation: >-
        AGENTS.md review architecture, templates/research-records.md and accepted
        S2-06 require a genuine archived independent review: exact assigned joint,
        standard attestation, declared sources, blindness statement, joint verdict,
        policy/session provenance, review-task claim, complete declared artifacts,
        and Git-resolved archive/source/commit custody.
      source_evidence:
        - >-
          driver.py:1324-1344 looks up and validates only the archive task; it never
          requires the external queue to contain the review task or binds that task's
          role, inference, claim owner/session/epoch, or declared write scope.
        - >-
          driver.py:1355-1366 accepts any nonempty top-level claim owner/session/model
          strings and PASS words without comparing them to a committed review task or claim.
        - >-
          driver.py:1367-1381 requires only complete_source_read, plan path and a
          nonstandard source_reads hash mapping. It does not require the standard
          task_id, joints_owned, sources_read, read_sibling_reports, blind status or
          attestation verdict, and does not compare an attested joint with the plan joint.
      worked_attack: >-
        A fresh temporary Git graph first admitted a complete governed synthetic
        review. Five one-variable known-false variants were then expected to be
        rejected but all returned normally: a minimal attestation missing every
        standard field, no review task in the external queue, attestation verdict
        breaks paired with top-level PASS, an archive missing the declared checks.py,
        and report claim_owner forged-owner against queue owner fixed-owner. Cases
        55-59 failed in at most 5.843713 seconds each. Wrong source-read hash,
        wrong report snapshot and a self-referential receipt were correctly rejected.
      impact: >-
        Exact byte and archive ancestry checks can still admit bytes that do not
        represent the governed independent review the launch gate claims. A later
        signed lock would bind the flawed admission mapping but would not repair its
        missing review-task or attestation semantics.
      necessary_fix: >-
        Locate the review task in the external authority queue; require its completed
        state, validator role, exact review-adversarial/xhigh envelope, claim
        owner/session/epoch and declared output paths. Require the standard attestation
        fields and exact owned joint/verdict, bind them to the precommitted plan and task,
        and require the archive path set to contain every declared review output.

    - id: S3-02
      verdict: NEEDS_CORRECTION
      title: A failed parent-directory fsync is silently reported as durable quarantine
      frozen_obligation: >-
        DEC-20260907-38017a publication policy plus V-06 and S2-04 require typed,
        truthful publication failure custody. A canonical-looking final must not be
        reported as safely quarantined unless all directory state needed for the move
        is durably confirmed.
      source_evidence:
        - >-
          driver.py:1682-1687 moves the source to runs/incomplete and fsyncs the
          incomplete directory.
        - >-
          driver.py:1688-1693 catches and discards OSError from fsync_directory(runs),
          then driver.py:1694 reports state=quarantined and quarantine_complete=true
          without retaining the secondary failure named by its own comment.
      worked_attack: >-
        Fixed case 46 used a temporary post-rename final tree and allowed receipt,
        source-directory, rename and incomplete-directory durability to succeed, then
        injected OSError only at the final runs-parent fsync. The helper returned
        state=quarantined, so the assertion that failed parent durability cannot claim
        durable quarantine failed in 0.007486 seconds.
      impact: >-
        After a crash, the parent directory may not durably reflect removal of the
        canonical final name, while the returned state asserts completed quarantine
        and omits the failed durability boundary.
      necessary_fix: >-
        Treat runs-parent fsync as part of quarantine completion. If it fails, retain
        an explicit parent_directory_fsync_failed field and a non-durable state; do not
        set quarantine_complete or state=quarantined.

    - id: S3-03
      verdict: NEEDS_CORRECTION
      title: A failed scalar certificate does not apply the frozen immediate-stop rule
      frozen_obligation: >-
        specification.yaml stopping_rules requires stop on scalar certificate failure.
        Accepted V-03 requires durable retention of the failed cell/certificate and a
        typed measurement-invalid stop before another cell is scheduled. The current
        review plan explicitly attacks failed-certificate immediate stop.
      source_evidence:
        - >-
          driver.py:517-529 classifies and records a failed certificate, increments
          failed_certificates, and then breaks only the inner trace loop; the outer
          all-start census continues.
        - >-
          driver.py:952-1016 completes the coordinate census, seven null censuses and
          remaining controls before reducing validity. driver.py:1787-1791 raises
          MeasurementInvalidStop only after future_cell returns and the entire cell is recorded.
      worked_attack: >-
        Fixed case 47 replaced only rho_step and binary_verifier on an abstract
        three-state mock so the first repeated state had nonzero delta-B and a failed
        verification. collision_census returned without raising MeasurementInvalidStop;
        the required immediate-stop assertion failed in 0.003589 seconds.
      impact: >-
        The runner performs additional starts and later diagnostics after the exact
        validity failure that the frozen protocol says must stop work. Later data are
        outside the preregistered stopping rule even though the eventual cell becomes invalid.
      necessary_fix: >-
        Persist the failing certificate, terminate that census immediately, preserve a
        typed partial invalid-cell record, and propagate MeasurementInvalidStop before
        any later start, arm, control or cell is scheduled.

    - id: S3-04
      verdict: NEEDS_CORRECTION
      title: Interrupted collision diagnostics and per-diagnostic memory observations remain unretained
      frozen_obligation: >-
        The frozen secondary metric, accepted V-04 and S2-03 require fully charged
        diagnostic CPU/wall and memory custody, including interrupted work and all
        rejected starts, in canonical outputs.
      source_evidence:
        - >-
          driver.py:952-955 and 970-973 call collision_census directly rather than
          through measured_diagnostic. A cancellation, resource stop or unexpected
          exception therefore preserves some certificates but no failed collision
          diagnostic CPU/wall row.
        - >-
          driver.py:893-921 records CPU/wall and completion/error only. It does not
          observe process-group RSS or any other memory value at either diagnostic boundary.
        - >-
          driver.py:1528-1544 records one final process-group RSS value for the whole
          run, which cannot reconstruct memory by diagnostic or an interrupted census.
      worked_attack: >-
        AST case 48 found two direct collision_census calls in future_cell where zero
        are permitted for interrupted diagnostic custody. Source case 49 found no
        process_group_rss_bytes observation in measured_diagnostic. Both conformance
        assertions failed in at most 0.002579 seconds.
      impact: >-
        A stopped coordinate or null census can lose its diagnostic timing row, and
        successful or stopped non-census diagnostics have no measured memory observation.
        Canonical outputs therefore cannot satisfy the complete V-04/S2-03 custody claim.
      necessary_fix: >-
        Meter coordinate and each null census through a failure-retaining wrapper, and
        record start/end or peak process-group RSS for every named diagnostic without
        substituting estimates. Keep completed and interrupted rows distinct and avoid
        serializing successful rows twice as partial records.

    - id: S3-05
      verdict: NEEDS_CORRECTION
      title: Long-loop guard probes still lack durable progress and artifact assembly has no machine guard
      frozen_obligation: >-
        DEC-20260907-38017a machine protection and accepted V-08/S2-08 require
        cancellation/RSS checks inside every long loop with outer/inner coordinates
        persisted before each bounded probe. The current review plan explicitly
        requires every inner-loop guard/progress path.
      source_evidence:
        - >-
          driver.py:384-409 enumerate_subgroup and driver.py:442-558
          collision_census accept check callbacks but no progress callback; direct
          checks have no durable scalar/start/step coordinate.
        - >-
          driver.py:942-947 passes on_progress=None to the coordinate-partition
          guarded checkpoint, so a probe is not preceded by a retained coordinate.
        - >-
          driver.py:1472-1620 builds large per-cell metric, certificate, CSV, JSON and
          report structures with no check callback. driver.py:1817-1825 restores signal
          handlers and finishes the meter before artifact assembly and publication.
      worked_attack: >-
        Cases 50-53 independently required a persisted coordinate at the coordinate
        partition probe, progress callback support in subgroup and collision loops,
        and a machine guard in artifact assembly. All four failed in at most 0.007920 seconds.
      impact: >-
        Cancellation and process-group RSS latency is unbounded across additional
        prospective work, and a stop can lack the coordinates needed to identify the
        interrupted boundary. The potentially largest serialization phase runs after
        scientific-loop handlers are restored and outside the 8 GiB guard.
      necessary_fix: >-
        Thread on_progress through subgroup, collision and coordinate partition loops;
        persist every relevant outer/inner coordinate before Guard.check. Extend the
        guard through bounded artifact construction and publication or use chunked
        guarded serialization, retaining a typed operational failure state.

