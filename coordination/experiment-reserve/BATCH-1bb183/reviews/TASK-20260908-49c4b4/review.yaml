  findings:
    - id: S2-01
      verdict: NEEDS_CORRECTION
      title: The relabel-control RNG violates the frozen control-stream tuple
      frozen_obligation: >-
        specification.yaml randomness.pairing requires query, control, field_x
        and target streams to use original A,B with u=0 and arm=0 so coordinate
        models share the same underlying inputs. Only shuffle uses actual u.
      source_evidence:
        - >-
          driver.py:903-905 calls deterministic_shuffle with purpose=control
          and params=(curve.p,curve.A,curve.B,r,0,u,0).
      worked_attack: >-
        The independent AST case located the sole purpose=control shuffle call
        and required tuple position u to be literal zero. It found the live u
        variable and failed in 0.000587 seconds without drawing a scientific
        sample.
      impact: >-
        Relabel controls for u=1,2,3 use different random permutations, contrary
        to the frozen pairing rule and the claim that coordinate models share
        their control inputs.
      necessary_fix: >-
        Use the frozen control tuple (p,A,B,r,0,0,0) for the relabel bijection;
        retain actual u only in the shuffle-arm streams.

    - id: S2-02
      verdict: NEEDS_CORRECTION
      title: Unavailable fixtures and implementation exceptions are mislabeled as completed invalid data
      frozen_obligation: >-
        specification.yaml inputs.unavailable_fixture makes an incomplete
        fixture panel incomplete/inconclusive. The task lifecycle separately
        distinguishes failed_implementation from completed_invalid, and
        AGENTS.md forbids treating implementation failure as mathematical
        evidence.
      source_evidence:
        - >-
          driver.py:340-343 raises LaunchRefused when a frozen fixture panel is
          incomplete.
        - >-
          driver.py:1524-1526 catches every remaining Exception and sets
          status=completed_invalid with reason implementation_error.
      worked_attack: >-
        With every scientific function replaced, one fixed mock raised the
        implementation's exact incomplete-fixture LaunchRefused and another
        raised ValueError. Both were serialized as completed_invalid. The cases
        took 0.000898 and 0.000503 seconds.
      impact: >-
        A prospective package would conflate a declared unavailable panel or a
        software defect with invalid experimental data, defeating the required
        operational/scientific boundary.
      necessary_fix: >-
        Add a typed incomplete-fixture outcome mapped to inconclusive and map
        unexpected implementation exceptions to failed_implementation while
        preserving partial custody.

    - id: S2-03
      verdict: NEEDS_CORRECTION
      title: Canonical report and per-control diagnostic custody remain incomplete
      frozen_obligation: >-
        specification.yaml metrics.secondary and artifact_binding, plus
        DEC-20260908-0d2555 V-04, require every named secondary and diagnostic
        cost in raw-result.json, costs.csv, manifest metrics and report.md; the
        report must state actual coverage.
      source_evidence:
        - >-
          driver.py:903-920 executes transition-table/relabel, constant-O and
          mutated-candidate verification directly; only subgroup, partition,
          shuffle construction and Cayley are wrapped by measured_diagnostic at
          lines 869-915.
        - >-
          driver.py:928-933 therefore exposes no separate diagnostic rows for
          relabel, constant-O or mutated-candidate verification.
        - >-
          driver.py:1342-1350 builds report.md from status, decision, one timing
          bracket, the constant exploratory seed count and prose. It contains
          no actual completed-cell/fixture coverage, named secondary values or
          per-diagnostic costs.
      worked_attack: >-
        A one-cell partial exploratory mock omitted its actual cell count and
        nevertheless reported eight seeds retained. A second fixed payload
        lacked mean_first_repeat_length, component_sizes, scalar_inversions and
        diagnostic_cpu_seconds in report.md. Static call-site inspection found
        the three unmetered control diagnostics. The cases took 0.011782,
        0.020233 and 0.000832 seconds.
      impact: >-
        The raw and CSV names exist for the metrics that are computed, but the
        canonical human report overstates partial coverage and cannot
        reconstruct all preregistered diagnostic costs.
      necessary_fix: >-
        Meter the relabel table/control, constant-O census and mutated verifier;
        serialize their rows everywhere required; derive report coverage from
        sink contents and include actual secondary/cost values rather than the
        frozen seed-list length.

    - id: S2-04
      verdict: NEEDS_CORRECTION
      title: Failed publication-failure annotation is reported as annotated_final
      frozen_obligation: >-
        DEC-20260907-38017a operational_policy.publication and
        DEC-20260908-0d2555 V-06 require a canonical-looking failed final tree
        to have an explicit durable state or be quarantined.
      source_evidence:
        - >-
          driver.py:1391-1410 catches any OSError during receipt write, receipt
          fsync, directory fsync, incomplete-directory creation or rename, then
          reports annotated_final solely when final.exists().
      worked_attack: >-
        A fixed temporary final tree injected OSError on
        publication-failure.json write. The receipt did not exist, the final
        tree remained, and the function returned state=annotated_final. The
        case took 0.000738 seconds.
      impact: >-
        The caller can claim an explicit failure state that was never written
        or made durable, leaving an unlabeled canonical-looking failed run.
      necessary_fix: >-
        Track receipt creation and durability separately; return annotated_final
        only after the receipt file and containing directory are durably
        confirmed, otherwise use an explicit unretained state and prevent the
        final path from being mistaken for a complete run where possible.

    - id: S2-05
      verdict: NEEDS_CORRECTION
      title: Run path and identifier admission do not enforce canonical allocation custody
      frozen_obligation: >-
        specification.yaml artifact_binding makes run artifacts relative to the
        experiment directory, while AGENTS.md rule 14 requires every new record
        identifier to carry an allocated random six-hex suffix.
      source_evidence:
        - >-
          driver.py:1191-1193 accepts any string starting RUN- that lacks slash,
          backslash, dot or dot-dot; RUN-anything passes.
        - >-
          driver.py:1567-1579 accepts arbitrary --run-root and passes it to
          run_future_pipeline without binding it to
          ROOT/experiments/EXP-ECDLP-651b94 or to the signed lock.
      worked_attack: >-
        canonical_run_id accepted RUN-anything in 0.000006 seconds. With
        verification and pipeline fully mocked, an arbitrary temporary
        --run-root reached the pipeline in 0.002353 seconds. The latter was a
        mocked entrypoint call and performed no future execution.
      impact: >-
        Even a signed lock does not by itself establish that the run id was
        allocated under the required form or that the package is written to
        the experiment's canonical immutable namespace.
      necessary_fix: >-
        Enforce the allocated RUN-ECDLP-<six-lowercase-hex> form, bind the
        canonical experiment run root in authority, and reject any different
        resolved path before scientific work begins.

    - id: S2-06
      verdict: NEEDS_CORRECTION
      title: Review admission accepts a forged minimal PASS report and a false archive receipt commit
      frozen_obligation: >-
        AGENTS.md review architecture and the task lifecycle require a genuine
        archived independent review with the assigned joint, sources read,
        inference policy, session independence and verified Coordinator archive
        custody.
      source_evidence:
        - >-
          driver.py:1181-1188 checks only task_id, source_snapshot_commit,
          owned_joint_verdict and verdict in the parsed report, plus source task
          and report hash in the receipt.
        - >-
          driver.py:1177-1188 never requires review_attestation, joints_owned,
          sources_read, independent_session, requested policy/model,
          fallback/degradation status, archive task id, receipt commit_sha,
          receipt parent_sha or exact archive diff semantics.
        - >-
          tests.py:368-385 positively tests admission of the same minimal report
          shape and a minimal receipt rather than the governed review envelope.
      worked_attack: >-
        A temporary reachable two-commit Git history admitted a minimal PASS
        mapping with no attestation or independence provenance in 0.618088
        seconds. A second history admitted a receipt declaring all-zero
        commit_sha in 0.452172 seconds. Independent mismatch controls showed
        that the existing report hash and reviewed-source equality checks do
        reject their narrow failure modes.
      impact: >-
        Hash and ancestry binding proves custody of bytes, but the admitted
        bytes need not represent the independent governed review the launch
        gate claims to require.
      necessary_fix: >-
        Validate the complete review attestation and inference envelope against
        the precommitted plan, and verify the archive receipt's task, commit,
        parent, exact path set and hashes against Git before accepting PASS.

    - id: S2-07
      verdict: NEEDS_CORRECTION
      title: Missing process-group rows are accepted as a zero-byte RSS measurement
      frozen_obligation: >-
        DEC-20260907-38017a retains the 8 GiB process-group memory guard and
        requires unavailable resource measurement to be an operational failure,
        never a substituted estimate.
      source_evidence:
        - >-
          driver.py:1027-1037 parses ps output and returns total_kib*1024 even
          when no row matched the current process group.
      worked_attack: >-
        A successful fixed ps mock with empty output returned zero rather than
        InfrastructureStop in 0.000101 seconds.
      impact: >-
        Parser or platform drift can silently disable the memory guard by
        converting an unavailable measurement into an apparently measured zero.
      necessary_fix: >-
        Require at least the current process row and a valid matching group row;
        treat no matches or malformed measurement rows as InfrastructureStop.

    - id: S2-08
      verdict: NEEDS_CORRECTION
      title: Cancellation and RSS progress coverage remains incomplete outside the repaired Cayley loops
      frozen_obligation: >-
        DEC-20260907-38017a machine_protection requires checks inside long loops
        with preserved progress; the fresh plan specifically attacks
        cancellation/RSS in every dense loop and exact partial-control custody.
      source_evidence:
        - >-
          driver.py:624-676 gives transition_table and relabel_control no check
          callback, although relabel_control recomputes a first collision for
          every state over the complete table.
        - >-
          driver.py:125-134 gives deterministic_shuffle no guard callback.
        - >-
          driver.py:710-719 invokes _cayley_checkpoint with on_progress=None in
          cayley_fourier_eigenvalues.
        - >-
          driver.py:679-687 records only phase and one local index; nested calls
          at lines 735-755 omit the outer requested step, iteration and
          destination/state coordinates.
      worked_attack: >-
        Four independent static cases required a guard callback in the dense
        relabel/table and shuffle paths, a progress callback in the Fourier
        phase, and full nested-loop coordinates in progress records. All four
        failed in 0.000069, 0.000007, 0.000012 and 0.000621 seconds without
        running Cayley or collision work.
      impact: >-
        Cancellation latency and process-group RSS enforcement remain
        unbounded across additional prospective work, and a Cayley stop may
        retain a phase/local index that does not identify where the nested
        calculation stopped.
      necessary_fix: >-
        Thread Guard.check through every long table/relabel/shuffle loop and
        pass on_progress through the Fourier phase. Record all outer and inner
        indices needed to identify each persisted dense-loop boundary.

