  findings:
  - id: S5V-01
    verdict: NEEDS_CORRECTION
    title: Review admission requires the later precommitted plan to exist in the earlier source snapshot
    frozen_obligation: The lifecycle and current handoff require a source snapshot followed by a separately precommitted
      review plan, claim, completed release, archive and authority. The review plan is itself a declared reviewer
      input and must be bound at its actual plan commit.
    source_evidence:
    - driver.py:2213-2215 requires source_reads to cover every review_handoff input.
    - driver.py:2216-2220 then resolves every such path only at reviewed_source_snapshot, even though review_plan_commit
      and review_plan_sha256 were independently verified at driver.py:2188-2192.
    - 'The actual TASK-20260908-1367aa handoff binds 100 inputs: 99 exist byte-identically at source snapshot 6bf2c6b2,
      while review-plan-TASK-20260908-1367aa.yaml is absent there and first exists at authority/plan commit 9faba46c.'
    worked_attack: 'A fresh temporary Git history used a canonical queue and full standard handoff, source bindings,
      plan, holds attestation, claim, exact completed release, exact archive, authority and executing descendant,
      with an unrelated commit between plan and claim. The plan was a declared review input and source_read bound
      to its plan-commit bytes. The real verify_review_admission rejected it with LaunchRefused: archive commit
      does not contain coordination/review-plan.yaml. An otherwise identical reduced-input history omitting the
      plan from handoff.inputs was accepted; inline-only and path-only representations also passed. The final counterexample
      took 1.435285 seconds.'
    impact: 'A truthful archive of this current S5 review cannot satisfy S5 admission after it completes: omitting
      the plan misstates what the reviewer was required to read, while declaring it makes the verifier demand a
      blob from before the plan existed. The gate fails closed, but genuine launch admission for the actual governed
      review shape is unreachable.'
    necessary_fix: Resolve each declared read at its governing commit. At minimum, validate review_plan_path and
      its digest at review_plan_commit while retaining source-snapshot resolution for the 99 producer and historical
      inputs. Preserve exact handoff-binding equality and the strict source-to-plan ancestry; do not invent the
      plan in the source snapshot or omit it from the reviewer input inventory.
  - id: S5V-02
    verdict: NEEDS_CORRECTION
    title: iter_jsonl bypasses maximum_record_bytes when the oversized record includes a newline
    frozen_obligation: The S5 streaming boundary retains only one explicitly bounded current JSONL record while
      reading no more than 64 KiB per filesystem chunk. maximum_record_bytes is the lifetime bound on that current
      record.
    source_evidence:
    - streaming.py:183 appends a new chunk to pending.
    - streaming.py:184-187 raises only when pending is oversized and contains no newline.
    - streaming.py:188-195 converts and parses the bytes before the newline without comparing that line length to
      maximum_record_bytes; streaming.py:196-197 likewise parses a final unterminated pending record without an
      EOF length check.
    worked_attack: A fixed JSONL file contained one 2061-byte newline-terminated JSON object. Calling the actual
      iter_jsonl(path, maximum_record_bytes=1024) returned and materialized the record instead of raising StreamingEncodingError.
      The final case took 0.000318 seconds. With the default 64 MiB bound, the same control admits a first-over-bound
      record when its newline appears in the chunk that crosses the limit, exceeding the promised bound by up to
      one read chunk.
    impact: Chunked filesystem reads still hold, but the declared current-record lifetime bound does not. A malformed
      or unexpectedly large spool record can allocate and parse beyond maximum_record_bytes before the guard fires,
      so the complete bounded-streaming claim is false at this source snapshot.
    necessary_fix: Before converting pending bytes, reject every located newline whose offset exceeds maximum_record_bytes.
      If no newline exists, reject pending once it exceeds the bound. At EOF, reject an unterminated pending record
      over the same limit before bytes conversion or json.loads. Retain chunked reads and record ordering.
