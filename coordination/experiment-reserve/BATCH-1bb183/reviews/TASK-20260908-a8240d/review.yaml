  findings:
    - id: A8240D-01
      verdict: NEEDS_CORRECTION
      title: Review admission rejects the standard attestation and accepts non-governed task, claim and plan shapes
      frozen_obligation: >-
        AGENTS.md review architecture, templates/research-records.md, S2-06,
        S3-01 and this review plan require the actual dispatch-queue task and
        full handoff, a goal_lanes claim, a precommitted complete plan, every
        declared source read, and the standard owned-joint verdict vocabulary
        holds|breaks|inconclusive.
      source_evidence:
        - >-
          driver.py:1438-1440 accepts any JSON mapping with a tasks list; it does
          not require crypto.autoresearch.dispatch_queue.v1, objective,
          max_concurrent or the rest of research_dispatch.validate_queue.
        - >-
          driver.py:1474-1487 checks selected task/handoff fields but not the
          required objective, uncertainty, inputs, source_bindings, constraints,
          deliverables, archive owner, completion gate, budget, dependency or
          exact queue schema.
        - >-
          driver.py:1538-1541 accepts a reduced claim/release subset rather than
          the complete goal_lanes.py shapes.
        - >-
          driver.py:1550-1562 checks only plan source, recorded flag and one named
          assignment; claim_under_review, Coordinator prior, worked attack,
          breaking artifact, blindness and proves-too-much are not required.
        - >-
          driver.py:1570 requires review_attestation.verdict=pass. The standard
          template and tools/validate_ledger.py define holds|breaks|inconclusive.
        - >-
          driver.py:1576-1585 requires only four source hashes and never compares
          attested reads with the review handoff's complete inputs/source_bindings.
      worked_attack: >-
        A canonical synthetic history used three distinct reviewer outputs,
        a queued task, claim, standard holds attestation, completed release with
        exact output hashes, later archive and final external authority. It was
        rejected in 0.808609 seconds. Changing only the attestation verdict to
        nonstandard pass was accepted. Independent mutations showed that a queue
        with only tasks, a truncated handoff, truncated claim, incomplete plan,
        and complete_source_read=true with one handoff input omitted from both
        source-read fields were all admitted.
      impact: >-
        The positive path is incompatible with a standard Validator report while
        malformed control-plane bytes can satisfy the gate. A signed future lock
        would authenticate those bytes but would not turn them into a governed review.
      necessary_fix: >-
        Validate the exact dispatch queue and full nested handoff/claim schemas;
        bind every handoff source_binding to source_reads and sources_read; validate
        the complete review plan; and require standard attestation verdict holds
        alongside top-level PASS/passed semantics.

    - id: A8240D-02
      verdict: NEEDS_CORRECTION
      title: Completed-release output custody and lifecycle ordering are not enforced
      frozen_obligation: >-
        Dynamic dispatch and goal_lanes define the usable lifecycle as a precommitted
        queued task, claim, completed release carrying exact output hashes, and only
        then a Coordinator archive whose queue completion is later authority.
      source_evidence:
        - >-
          driver.py:1424-1427 constrains source/plan/archive/external/executing
          ancestry but omits plan-before-claim and release-before-archive.
        - >-
          driver.py:1523-1526 requires claim and release only to be ancestors of
          external authority; it does not require plan <= claim <= release <= archive.
        - >-
          driver.py:1540-1541 checks release task/epoch/owner/outcome but ignores
          released_at, was_expired, note and artifact_sha256, including exact equality
          with all declared reviewer output hashes.
      worked_attack: >-
        The verifier admitted an archive committed before the completed release,
        a claim committed before its plan, and completed releases with empty,
        all-wrong, or one-of-three artifact hash mappings. Each history retained
        valid Git blobs, exact admitted hashes and a later external authority, so
        each failure isolates the missing lifecycle/output check.
      impact: >-
        The gate can admit a review before the worker declared completion and can
        accept a completion receipt that binds none of the archived review outputs.
      necessary_fix: >-
        Require review_plan_commit to precede claim_commit, claim_commit to precede
        release_commit, release_commit to precede archive_commit, and the completed
        release artifact_sha256 mapping to equal the declared output set and the
        archive's exact hashes. Keep the archive receipt separate from reviewer outputs.

    - id: A8240D-03
      verdict: NEEDS_CORRECTION
      title: Successful diagnostic rows are duplicated and boundary RSS samples are mislabeled as peaks
      frozen_obligation: >-
        S3-04 requires one completed or interrupted row per named diagnostic,
        actual process-group memory observations with their exact sample scope,
        and no duplicate successful row represented as partial. The current plan
        explicitly forbids calling a boundary-sampled maximum a continuous peak.
      source_evidence:
        - >-
          driver.py:925-1007 samples process-group RSS only before and after an
          action, then writes max(start,end) as process_group_rss_peak_bytes.
        - >-
          driver.py:1767-1778 serializes successful coordinate/null meters in the
          canonical arm rows, then driver.py:1788-1795 serializes every sink
          diagnostic again with stream=partial.
        - >-
          driver.py:1735-1751 samples RSS once during artifact construction and
          writes that final boundary value as manifest resources.peak_rss_bytes.
      worked_attack: >-
        Fixed start/end samples 101 and 202 produced a field named peak even though
        no interior observation occurred. A one-cell fixed artifact with the same
        successful coordinate meter in its cell and retained sink produced two
        costs.csv rows; an interrupted-only diagnostic produced exactly one row.
      impact: >-
        Downstream readers can mistake an endpoint maximum or final sample for a
        measured continuous peak and can double-count successful diagnostic cost.
      necessary_fix: >-
        Rename endpoint values to start/end and boundary_sample_max, or install a
        real sampler and state its cadence. Track a measured process-group peak only
        from those samples. Serialize completed diagnostics from one canonical source;
        reserve partial rows for interrupted diagnostics only.

    - id: A8240D-04
      verdict: NEEDS_CORRECTION
      title: Artifact construction and publication remain outside complete typed resource and timing custody
      frozen_obligation: >-
        S3-05, the amendment and the original report-stage estimate require guards,
        total/report timing and typed cancellation/resource/infrastructure custody
        through final artifact construction and durable publication.
      source_evidence:
        - >-
          driver.py:1817-1839 uses monolithic json/yaml serializers for the largest
          report, manifest, controls, certificate and raw-result objects after only
          boundary probes.
        - >-
          driver.py:1934-1964 hashes whole in-memory payloads, writes each artifact
          in one handle.write(value), and verifies with sha256_file/read_bytes without
          intra-artifact cancellation or RSS probes.
        - >-
          driver.py:1980-1987 catches every publication exception and converts
          CancellationStop and ResourceStop to InfrastructureStop.
        - >-
          driver.py:2064-2080 finishes the resource meter before artifact_bytes,
          places construction/publication after the typed outcome catches, and
          removes the progress directory in finally even when construction fails.
      worked_attack: >-
        Static cases located six monolithic serializer paths and whole-artifact
        write/read hashing. Fixed guard exceptions at publication entry showed both
        CancellationStop and ResourceStop returned as InfrastructureStop. Control-flow
        inspection showed no typed catch around artifact_bytes and meter.finish before it.
      impact: >-
        The reported total and report-stage timings exclude report generation and
        publication. A late cancellation/resource stop can lose its status and, if
        construction fails before atomic_publish, lose the only progress tree without
        a canonical typed failure artifact.
      necessary_fix: >-
        Keep the timing bracket open through publication; chunk large serialization,
        writes and hash verification with progress-before-guard checkpoints; wrap
        construction and publication in the same typed outcome/custody state machine;
        preserve the progress tree until a durable final or typed incomplete package
        exists; and retain CancellationStop/ResourceStop classifications.

    - id: A8240D-05
      verdict: NEEDS_CORRECTION
      title: Dense-loop progress custody is quadratic, misclassified and too large for the declared protocol
      frozen_obligation: >-
        S3-05 requires durable coordinates before bounded guard probes. Progress
        must be a compact resumable boundary and must not itself predictably exhaust
        the process-group memory/disk path it is meant to protect.
      source_evidence:
        - >-
          driver.py:1297-1300 appends every generic progress record to
          partial_certificates and labels its checkpoint start_completed.
        - >-
          driver.py:1313-1319 appends every event to an in-memory list and rewrites
          the entire list to progress.json on every checkpoint.
        - >-
          driver.py:1116-1120 routes every sampled nested Cayley progress coordinate
          through on_partial and therefore through both growing lists and the full rewrite.
      worked_attack: >-
        Exact arithmetic at the minimum permitted subgroup order r=127 gives at least
        192*63*127*ceil(127/16)=12,289,536 matrix-vector-origin progress callbacks
        before counting other Cayley, subgroup, collision, shuffle, control, assembly
        or publication phases. Each callback is retained as a partial certificate and
        triggers a complete event-history serialization.
      impact: >-
        The progress mechanism performs quadratic cumulative serialization and builds
        millions of non-certificate records in memory. It can turn the mandatory guard
        path itself into the dominant resource consumer; no future full-run reachability
        was established by the 58 producer regressions.
      necessary_fix: >-
        Separate certificates from progress, use an append-only event log plus one
        atomically replaced compact latest checkpoint, use truthful in-progress event
        names, and choose a bounded checkpoint cadence whose full-panel event count and
        storage are explicitly calculated under the machine cap.

    - id: A8240D-06
      verdict: NEEDS_CORRECTION
      title: Frozen immediate-stop semantics still defer known relabel and occupancy failures
      frozen_obligation: >-
        specification.yaml stopping_rules requires an immediate stop on exact relabel,
        occupancy or scalar-certificate failure after retaining the failure.
      source_evidence:
        - >-
          driver.py:1096-1115 obtains relabel before executing constant-O, mutated
          verifier and Cayley controls but performs no relabel failure check between them.
        - >-
          driver.py:1070-1093 completes every shuffle and has all bucket counts, yet
          driver.py:1123-1130 computes occupancy only after relabel and all later controls.
      worked_attack: >-
        Independent source-order cases required MeasurementInvalidStop between the
        relabel result and the next control, and required occupancy reduction at the
        completed-shuffle boundary. Both failed without invoking future_cell or a panel.
        The separate scalar-certificate retention/stop case passed.
      impact: >-
        A future run can execute additional control work after a declared stopping rule
        is already known to have fired. Later completed data are outside the frozen path.
      necessary_fix: >-
        Compute and retain occupancy immediately after the seven assignments and stop
        before relabel on failure. Retain and inspect relabel immediately after it returns
        and stop before subsequent controls. Preserve the partial invalid-cell reason and
        diagnostic row in both cases.

