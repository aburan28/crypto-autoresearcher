  findings:
    - id: S4V-01
      verdict: NEEDS_CORRECTION
      title: Review admission still accepts reduced or internally inconsistent governed authority
      retained_obligation: >-
        A8240D-01 and A8240D-02 require the full canonical dispatch queue,
        nested handoff and review plan, exact binding/read correspondence,
        unchanged claimed task declaration, complete write-once release, and
        source-pinned validator semantics.
      source_evidence:
        - >-
          driver.py:1627-1669 validates selected review-handoff fields and only
          checks that source-binding paths align with inputs. It never compares
          each source-binding SHA-256 to the attested source_reads value and
          never requires the nested review_plan or review_plan_path.
        - >-
          driver.py:1672-1697 validates only the selected review and archive
          rows. Other queue rows are not schema-validated, and only id, role,
          read/write/artifact scopes and handoff are later frozen from queued to
          completed; dependencies can change.
        - >-
          driver.py:1870-1876 requires plan section names and one worked joint
          but does not validate the contents of blindness, proves_too_much,
          blind_rederivation, Coordinator prior, or deviations.
        - >-
          driver.py:1890-1896 checks attested source_reads against snapshot
          blobs but not against the SHA-256 values declared by the handoff.
          The pinned dispatcher and lane files are hash-checked, but their pure
          validation semantics are not applied to the admitted queue.
      worked_attack: >-
        A canonical temporary history with an unrelated plan-to-claim commit
        passed both the canonical dispatcher and S4 verifier. Five one-variable
        mutations then remained accepted: a wrong handoff source-binding digest
        paired with the real report hash; no nested review_plan; empty blindness
        and proves-too-much mappings; a dependency list changed after claim; and
        an extra queue task with an invalid role and missing required fields.
        Empty, wrong and partial release hash maps and a contradictory
        attestation were correctly refused, localizing the gap to the reduced
        schema mirror rather than Git/hash custody generally.
      impact: >-
        A future signed lock can authenticate bytes that do not constitute the
        governed independent review the gate says it admits. The valid path is
        reachable, so fail-closed lifecycle strictness need not be weakened to
        repair this.
      necessary_fix: >-
        Apply a source-pinned pure canonical queue/handoff/claim/release/review-plan
        validator to every task without executing arbitrary commit code or
        mutating the queue. Require the nested handoff plan to equal the
        precommitted plan, freeze every governed review-task field across claim,
        validate every plan subsection, and require every handoff binding digest
        to equal the corresponding attested source_reads digest and snapshot blob.

    - id: S4V-02
      verdict: NEEDS_CORRECTION
      title: Chunked write helpers still materialize complete artifacts and duplicate all-history payloads
      retained_obligation: >-
        A8240D-04 requires guarded serialization, hashing, writes and readback in
        chunks no larger than 64 KiB and explicitly forbids a whole-artifact
        memory copy or chunking only after monolithic construction.
      source_evidence:
        - >-
          driver.py:141-154 accumulates every JSON encoder fragment into one
          bytearray and returns a second complete bytes object.
        - >-
          driver.py:157-169 calls yaml.safe_dump before the first guarded
          checkpoint, then builds bytearray and bytes copies of the complete text.
        - >-
          driver.py:1975-2166 constructs complete secondary, diagnostic,
          fixture, control, certificate, cost, raw-line and raw-result objects,
          reads the complete spooled CSV back into memory, and returns one
          dict containing every complete artifact as bytes.
        - >-
          atomic_publish receives that complete payload mapping; its later
          64-KiB hashing and writes do not remove the prior monolithic copies.
      worked_attack: >-
        AST/data-flow checks found the bytearray-to-bytes JSON copy, proved that
        yaml.safe_dump is entered before any check callback, and enumerated the
        simultaneous complete payload objects. The independent 64-KiB writer
        check passed, showing the defect is pre-write materialization rather
        than chunk size at the final file handle.
      impact: >-
        Artifact construction can consume unbounded memory and spend an
        unbounded YAML serialization interval outside cancellation/RSS probes.
        The largest future package therefore lacks the claimed assembly guard
        and can fail before typed custody becomes durable.
      necessary_fix: >-
        Stream each canonical artifact directly into an owned staging file
        through incremental encoders and a guarded 64-KiB writer, updating its
        digest during the same pass. Avoid returning a dict of complete bytes,
        avoid rebuilding certificates/metrics into parallel all-history objects,
        and use a streaming YAML emitter or another canonical manifest writer
        whose producer is probed before bounded output fragments.

    - id: S4V-03
      verdict: NEEDS_CORRECTION
      title: The required post-publication completion receipt is deleted on success and its failure can replace the original typed stop
      retained_obligation: >-
        A8240D-04 requires timing through durable payload publication followed
        by a separate durable operational receipt; missing final custody must
        neither expose a falsely complete package nor destroy the only progress,
        and late cancellation/resource classification must survive secondary I/O.
      source_evidence:
        - >-
          execution-plan.json:31-35 declares progress/operational-completion.json
          a required post-boundary receipt.
        - >-
          driver.py:2326-2351 writes operational-completion.json inside the
          temporary progress_dir, not inside the published thirteen-artifact
          package or another declared durable namespace.
        - >-
          driver.py:2453-2463 publishes the payload, writes the temporary
          receipt, sets published true and returns; driver.py:2480-2486 then
          removes the entire progress_dir, including that required receipt.
        - >-
          driver.py:2464-2479 calls retain_operational_completion directly from
          typed and generic exception handlers. A receipt write/fsync exception
          can escape in place of the original CancellationStop, ResourceStop,
          or InfrastructureStop; a payload already renamed final is not
          quarantined merely because terminal custody failed.
      worked_attack: >-
        The source-order cases show that a successful low-level receipt is
        created before unconditional success cleanup deletes its parent and
        that operational-completion.json is absent from EXPERIMENT_ARTIFACTS.
        A separate handler check found no secondary-custody try boundary that
        preserves the original typed exception. The meter correctly finishes
        after atomic_publish, so the timing boundary itself is not the defect.
      impact: >-
        A normal return leaves no required complete-duration/guard receipt.
        A receipt I/O failure can leave a canonical-looking payload without
        final custody and can misreport the primary operational stop.
      necessary_fix: >-
        Retain the receipt in an explicit immutable operational namespace that
        survives success and is bound by the future execution plan. If receipt
        publication fails after the payload rename, quarantine or explicitly
        mark the payload incomplete before returning. Preserve the original
        typed stop alongside every secondary retention error, and remove the
        progress tree only after its required receipt has durable replacement
        custody.

    - id: S4V-04
      verdict: NEEDS_CORRECTION
      title: Occupancy failure is checked only after all seven null collision censuses
      retained_obligation: >-
        A8240D-06 requires occupancy to be reduced and retained immediately
        after the seven shuffle assignments and requires a known failure to stop
        before further control or measurement work.
      source_evidence:
        - >-
          driver.py:1144-1172 constructs one assignment and immediately executes
          that arm's complete null_collision_census before constructing the next
          assignment.
        - >-
          driver.py:1173-1183 computes and stops on occupancy only after all seven
          null censuses have completed. The relabel stop at lines1194-1206 is in
          the correct immediate position before later controls.
      worked_attack: >-
        An AST control located occupancy_assignment and
        collision_census_with_custody inside the same seven-arm loop. A corrupted
        first assignment therefore permits that arm and every later arm census
        before the already-computable bucket mismatch is reduced.
      impact: >-
        Work executed after a declared immediate-stop condition is outside the
        frozen path, even though the eventual package is invalid.
      necessary_fix: >-
        Construct and retain all seven assignment/bucket-count objects first,
        reduce occupancy once at that boundary, and stop with the retained
        partial invalid state before any null census or relabel/control work.
        Only after occupancy holds should the seven frozen null censuses run.

