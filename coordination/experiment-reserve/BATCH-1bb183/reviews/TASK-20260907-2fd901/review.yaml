  findings:
    - id: V-01
      verdict: NEEDS_CORRECTION
      title: Frozen subgroup enumeration is not implemented by repeated addition
      frozen_obligation: >-
        specification.yaml inputs.fixtures requires the certified subgroup to
        be enumerated exactly by repeated addition.
      source_evidence:
        - >-
          driver.py:354-361 loops scalar=0..r-1 and calls
          curve.scalar(scalar, generator) independently for every scalar.
      worked_attack: >-
        Static executable-path inspection required one accumulator initialized
        at O and advanced by curve.add(current,G). The implementation instead
        contains curve.scalar(scalar,generator) and no repeated-addition
        accumulator in subgroup_points; the fixed case failed in 0.000092 s.
      impact: >-
        Exact point values may agree, but the approved enumeration algorithm,
        operation path and its charge/checkpoint surface are different. This
        source therefore does not implement the exact frozen fixture contract.
      necessary_fix: >-
        Enumerate O,G,2G,...,(r-1)G with one checked repeated-addition
        accumulator, retain the order/distinctness certificate, and keep the
        canonical sort only after the exact enumeration is complete.

    - id: V-02
      verdict: NEEDS_CORRECTION
      title: The prospective runner omits all eight frozen exploratory seeds
      frozen_obligation: >-
        specification.yaml inputs.seeds and replication.seeds fix
        606300..606315, with 606300..606307 designated exploratory control
        checks and 606308..606315 held out. The analysis plan forbids the first
        set from selecting the frozen curve, u, partition or metric.
      source_evidence:
        - driver.py:45 defines only HELDOUT_SEEDS=606308..606315.
        - driver.py:1139-1149 executes future_cell only for HELDOUT_SEEDS.
        - >-
          execution-plan.json future_algorithm and manifest inputs likewise
          describe only the held-out stream; no exploratory artifact path or
          execution branch exists.
      worked_attack: >-
        The fixed source case searched the executable entry path for a distinct
        exploratory seed set and use. No such constant or loop exists; it
        failed in 0.000435 s without running a seed or fixture.
      impact: >-
        A future run could present a complete 96-cell held-out result while
        never executing or preserving half of the frozen seed plan. Hardcoding
        the rule prevents tuning but does not execute the declared exploratory
        controls.
      necessary_fix: >-
        Add the exact 606300..606307 exploratory stream with separate custody
        and labels, prohibit its outputs from mutating any frozen choice, and
        keep the 96 held-out cells as the sole threshold decision panel.

    - id: V-03
      verdict: NEEDS_CORRECTION
      title: Named validity failure does not apply the frozen immediate stop rule
      frozen_obligation: >-
        specification.yaml stopping_rules says to stop on exact relabel,
        occupancy or scalar-certificate failure and preserve all data as invalid.
      source_evidence:
        - driver.py:656-670 correctly reduces failed certificates and named controls.
        - >-
          driver.py:1148-1150 records each future_cell and immediately advances
          to the next cell without examining cell.validity.valid.
        - >-
          driver.py:1152-1155 waits until all cells complete before global
          validity can make status completed_invalid.
      worked_attack: >-
        The corrected targeted mock made the first future_cell return
        validity.valid=false. run_future_pipeline still invoked the mock for all
        96 held-out cells. The bounded case took 0.003077 s and performed no
        curve operation, census, control panel or publication.
      impact: >-
        The future path continues scientific work after a declared invalidating
        control/certificate failure, contrary to the frozen stop rule. Its
        eventual invalid status does not repair the execution deviation.
      necessary_fix: >-
        After durably recording the failed cell and certificates, raise a typed
        measurement-invalid stop that preserves the partial package and emits
        completed_invalid without scheduling another cell.

    - id: V-04
      verdict: NEEDS_CORRECTION
      title: Frozen secondary and per-diagnostic cost custody remains incomplete
      frozen_obligation: >-
        specification.yaml metrics.secondary and operation_count_rule require
        mean first-repeat length, useful fraction, fixed points, two-cycles,
        component sizes, maximum tail/cycle length, complete certificates,
        per-diagnostic CPU/wall and collision-table memory, plus scalar
        inversion/comparison costs separated from group operations.
      source_evidence:
        - >-
          driver.py:388-445 returns aggregate starts/successes/group operations
          and certificates but no component, fixed/two-cycle, maximum
          tail/cycle or per-diagnostic resource fields.
        - >-
          driver.py:419 performs scalar inversion and line 422 performs the
          certificate comparison without incrementing a retained integer-cost field.
        - >-
          driver.py:991-1055 and costs.csv retain stage/total resources and
          group-operation rows but no per-diagnostic CPU/wall, collision-table
          memory, scalar inversion/comparison or named secondary summaries.
      worked_attack: >-
        A fixed mock cell was passed through artifact_bytes and the canonical
        costs.csv/raw-result.json were independently parsed. Five required
        diagnostic cost fields and seven required secondary summaries were
        absent; the case failed in 0.004774 s.
      impact: >-
        The future package cannot reconstruct all preregistered diagnostics or
        distinguish their resource costs. implementation-report.yaml's
        ordinary_code_completeness:complete assertion is therefore unsupported.
      necessary_fix: >-
        Compute and serialize every named secondary statistic, instrument
        inversion/comparison counts, bracket each diagnostic with CPU/wall and
        memory observations, and bind those rows into raw-result.json,
        costs.csv, report.md and manifest metrics.

    - id: V-05
      verdict: NEEDS_CORRECTION
      title: Manifest UTC timestamps do not bracket the measured execution
      frozen_obligation: >-
        The specification artifact binding and evidence contract require
        actual UTC start/finish timestamps and measured resource timing.
      source_evidence:
        - >-
          driver.py:771-798 records only monotonic/CPU starts in ResourceMeter;
          it retains no UTC execution start.
        - >-
          driver.py:1012 calls datetime.now twice while constructing the final
          manifest, so both started_at and finished_at describe artifact
          creation rather than the run interval.
      worked_attack: >-
        With a fixed ResourceMeter age of 10 seconds, artifact_bytes emitted a
        10.000025-second measured wall duration but UTC timestamps only
        0.000007 seconds apart. The case failed in 0.004850 s.
      impact: >-
        The manifest would contain internally inconsistent provenance and could
        not establish when the future run actually began and ended.
      necessary_fix: >-
        Capture UTC and monotonic clocks together at pipeline entry, capture
        UTC/monotonic finish after the terminal outcome, and serialize that
        same bracket once into manifest timing and the report.

    - id: V-06
      verdict: NEEDS_CORRECTION
      title: A post-rename durability failure leaves a canonical final directory exposed
      frozen_obligation: >-
        DEC-20260907-38017a operational_policy.publication and README.md require
        verified atomic publication, no exposed final directory on publication
        failure, and a retained typed infrastructure-failure receipt.
      source_evidence:
        - >-
          driver.py:1095 renames staging to the canonical final directory and
          line 1096 then fsyncs runs inside the same broad try block.
        - >-
          driver.py:1098-1111 handles any subsequent exception as publication
          failure but attempts to write the receipt through the now-moved
          staging path; it does not quarantine or remove final.
      worked_attack: >-
        A fixed mock injected OSError at the third fsync_directory call, the
        first parent-directory fsync after os.rename. atomic_publish raised
        InfrastructureStop while runs/RUN-ECDLP-deadbe remained visible. The
        case took 0.007000 s and used only temporary files.
      impact: >-
        Downstream tooling can see a complete-looking canonical run directory
        even though the writer reported publication failure, and the promised
        failure receipt may not exist because staging no longer exists.
      necessary_fix: >-
        Give the post-rename durability boundary its own state transition.
        On failure, move the exposed final directory to the incomplete area
        with a typed receipt when possible, and never return a failure while a
        canonical final path remains visible without an explicit durable state.

    - id: V-07
      verdict: NEEDS_CORRECTION
      title: Review admission conflates reviewed source snapshot with executing archive HEAD
      frozen_obligation: >-
        A real launch must bind a PASS review to the exact corrected producer
        snapshot, require a reachable Coordinator review archive, and execute
        from a clean source whose bytes match that reviewed snapshot.
      source_evidence:
        - >-
          driver.py:951-954 requires report.source_snapshot_commit to equal the
          corrected_snapshot argument.
        - >-
          driver.py:983-987 requires lock.corrected_source_snapshot to equal
          current HEAD, then passes that current HEAD as corrected_snapshot to
          verify_review_admission.
        - >-
          driver.py:933 simultaneously requires the later review archive commit
          to be an ancestor of current HEAD.
      worked_attack: >-
        A temporary two-commit Git history used a producer source snapshot S
        followed by an archive A containing a structurally valid PASS report
        bound to S and a receipt binding that report. At HEAD=A the verifier
        demanded report.source_snapshot_commit=A and rejected S. At HEAD=S it
        accepted the source identity but rejected archive A as unreachable.
        The two fixed cases took 0.599040 s and 0.534046 s.
      impact: >-
        Under the ordinary producer-snapshot then review-archive lifecycle,
        no future lock can satisfy all three conditions. This is fail-closed,
        but it makes genuine launch admission unreachable rather than secure.
      necessary_fix: >-
        Bind separate reviewed_source_snapshot and executing_commit fields.
        Require the report to name the former, require the archive and former
        to be ancestors of the latter in the correct order, require HEAD to
        equal the latter, and compare the executing source bytes against the
        reviewed snapshot and lock hashes.

    - id: V-08
      verdict: NEEDS_CORRECTION
      title: Dense Cayley control work runs outside bounded guard checkpoints
      frozen_obligation: >-
        DEC-20260907-38017a machine_protection requires explicit cancellation
        and 8 GiB process-group checks inside long loops while preserving
        progress. The handoff specifically requires cancellation/memory mocks.
      source_evidence:
        - >-
          driver.py:590-597 allocates and fills the r-by-r Cayley matrix in
          cayley_weights without receiving the check callback.
        - >-
          driver.py:614-620 performs dense matrix-vector and inverse-Fourier
          reductions with only outer checkpoints; the full matrix-vector
          comprehension runs between checks.
        - >-
          driver.py:634-647 computes full row/column reductions and other dense
          calibration structures between guard calls.
      worked_attack: >-
        Static executable-path inspection checked the callback signature and
        dense reduction sites. cayley_weights has no check parameter, so the
        fixed case failed in 0.002632 s without invoking calibration.
      impact: >-
        Cancellation latency and memory enforcement are bounded around some
        calibration phases but not throughout every long control loop, contrary
        to the accepted F-06 correction and execution-plan claim.
      necessary_fix: >-
        Thread the guard callback through allocation, matrix construction,
        row/column and matrix-vector loops at a documented bounded stride, and
        durably record any partial control state before returning an operational
        incomplete outcome.

