review_plan:
  claim_under_review: Complete S6 spectral source conformance,including exact later-plan origin and bounded
    JSONL records;no scientific or launch claim.
  coordinator_prior: The S6 producer reports both S5V defects corrected with two107case suites passing,214total
    fixed executions,and complete outer/nested custody. Its custody.py remains identical to S5. This supports
    source-review readiness only. One initial byte-identical copy went to the wrong checkout and was removed
    before edit/test;the producer disclosed it and root confirmed the unintended path absent. Independently
    assess actual source behavior and preservation,not the producer pass count.
  recorded_before_reviewers: true
  source_snapshot: c48a335b37aa7f5da9e71ae289d426806b8343d5
  source_task_id: TASK-20260908-5c0cc3
  source_task_state: completed
  joints:
  - joint: complete_source_admission_streaming_and_custody_conformance
    assigned_to: TASK-20260908-707dff
    attack_plan: 'First reproduce the complete canonical lifecycle with the review plan as a declared bound
      input created after the source snapshot. Only that exact verified plan path may resolve at review_plan_commit;all
      other inputs stay at reviewed_source_snapshot. Reject omitted plan inventory,wrong plan digest/commit,arbitrary
      later sources and backdated or reordered authority while accepting equivalent legitimate plan forms and
      an unrelated intervening commit. Independently exercise JSONL exact-bound and over-bound records with
      newline,EOF,first chunk,cross-chunk boundaries,multiple records per chunk and valid-prefix/oversized-successor
      combinations. No oversized line may reach bytes conversion/json.loads;bounded chunking and record order
      must survive. Then perform the full prior source-conformance audit: Read the full original specification,
      operative amendments, all retained V/S2/S3/S4 obligations, the S5 decision, eight source files and metadata.
      Independently construct a complete canonical queued -> plan -> claim -> completed release -> archive
      -> authority lifecycle with an unrelated intervening commit, and show the actual verifier accepts it
      without invented fields. Exercise valid inline and path-bound plans and all malformed S4V-01 cases, including
      wrong declared input digests, missing/empty plan sections, mutation of dependencies and an unrelated
      invalid extra queue task. Check locally trusted source pins for every loaded validator dependency, no
      external-commit code execution, no queue mutation, exact read/hash/output/release/archive correspondences
      and real ancestry. Trace the production spool and all artifact paths end to end: a large lazy payload,
      large single string, CSV/YAML keys, file copy and all-history cases must not materialize complete payloads
      before guarded chunks. Verify spool preservation, bounded current-cell state and compact reducers against
      all192cells and781824maximum certificate records. Verify every required scientific record remains serializable
      with unchanged types; rejecting an integer-key fixture is not enough if the real manifest requires that
      key. Test custody.finalize_run directly with payload rename, companion write/fsync, parent fsync, quarantine
      and cleanup failure injections. Success must leave both complete durable payload and stable companion;
      late failure must retain incomplete evidence and original typed stop without replacing it with a secondary
      exception. Check timing excludes only declared terminal self-cost. Audit guard cadence, compact progress/certificate
      separation and caps through serialization and finalization. Verify all seven assignments and occupancy
      are retained before any null census and failure stops immediately; retain relabel/scalar-certificate
      controls. Independently check exact RNG bytes/draw schedules, estimator, zero-success, validity and complete-panel
      decision branches. Use lower-level fixed synthetic/mock/artifact/Git cases only; never invoke the prospective
      scientific pipeline even with mocked admission.'
    breaking_artifact: Exact source line and worked fixed counterexample or a precise missing source obligation,
      with the assigned-joint verdict distinguished from historical producer custody and scientific/runtime
      readiness.
  blindness:
    mutual: false
    lifted_for:
    - TASK-20260908-707dff
    rationale: Fresh independent complete source review. Declared completed historical reports and producer
      artifacts visible;no parent/producer conversation or concurrent report.
  proves_too_much:
    objects:
    - A canonical valid lifecycle with all standard governed fields; must reach admission without bespoke synthetic-only
      metadata.
    - A wrong input digest hidden behind a correct snapshot or report digest; must be refused.
    - A malformed unrelated task or mutated claimed declaration inside an otherwise valid queue.
    - A large lazy source and one large string that expose serialization-before-chunking.
    - A required scientific record containing an integer key that must retain its declared type.
    - A complete payload with missing or nondurable required operational companion.
    - A cancellation/resource stop whose companion writer also fails.
    - A bad occupancy assignment followed by a null census; no post-failure work may run.
    - A complete valid review that declares its later-created plan as an input.
    - A wrong plan binding accepted through an arbitrary later-commit fallback.
    - An oversized JSONL record containing a newline in its first or boundary-crossing chunk.
    - A valid JSONL prefix hiding an oversized later record or EOF fragment.
    failure_signature: A known-invalid authority, lost required record, falsely complete payload, changed frozen
      statistic or work after a decidable invalid-control boundary breaks this source joint.
    assigned_to: TASK-20260908-707dff
  blind_rederivation:
    required: false
    quantity: No new mathematical quantity is proposed.
    parameters: The frozen spectral estimators and finite parameter inventory remain unchanged.
    blind_from: []
    assigned_to: TASK-20260908-707dff
    not_repeated_reason: This is source conformance, not a new proof or quantitative claim. If a load-bearing
      formula changed, report the difference and require a separate preregistered blind review.
  scope_limit: One complete source-conformance joint only. No scientific observation, performance result, real
    Linux guard validation, launch approval, hypothesis/goal transition or retrospective repair of failed S4
    execution.
  procedure_deviations: []
