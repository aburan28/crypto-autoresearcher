joint_matrix:
  columns: [J1, J2, J3, J4, J5]
  rows:
    F1-relative-frobenius: [holds, holds, breaks, breaks, breaks]
    F2-exceptional-automorphism-transport: [holds, holds, breaks, breaks, breaks]
    F3-short-cycle: [holds, holds, inconclusive, breaks, breaks]
    F4-bounded-map-search: [holds, holds, inconclusive, breaks, inconclusive]
  scope_notes:
    J1: >-
      Holds means the exact campaign law, bare-input declaration, and source
      boundary are stated honestly; it does not establish useful-locus mass.
    J2: >-
      Holds only for accepted non-FAIL descriptors. It does not establish a
      public constructor, existence on general E, density, or scaling.
    J4: >-
      The same breaks verdict applies to the frozen sampler interface, hence to
      every family: distributional bounded OneEnd does not instantiate the
      always-answer adaptive oracle used by the cited EndRing reduction.

family_outcomes:
  - family_id: F1-relative-frobenius
    status: scoped_typed_obstruction
    earliest_nonpassing_arrow: P1_bare_E_to_public_separable_conjugate_map
    joint_verdicts: {J1: holds, J2: holds, J3: breaks, J4: breaks, J5: breaks}
    preserved_result: >-
      Given a valid separable phi:E->E^(p), relative p-Frobenius after phi is a
      typed E->E map with nonsquare inseparable degree p; the deterministic C1
      core is also typed.
    decisive_gaps: >-
      No general public FindConjugate is supplied. The only exact core has
      unproved D_ER mass and polynomial cost and publicly enumerable singleton
      support. Even a repaired distributional sampler would still lack the
      adaptive every-query bridge required by the Page--Wesolowski reduction.
  - family_id: F2-exceptional-automorphism-transport
    status: scoped_typed_obstruction
    earliest_nonpassing_arrow: P1_bare_E_to_public_exceptional_path
    joint_verdicts: {J1: holds, J2: holds, J3: breaks, J4: breaks, J5: breaks}
    preserved_result: >-
      Direct exceptional automorphisms and dual(phi) o u o phi are typed
      non-scalar E->E maps on their accepted scopes; the nonzero-discriminant
      certificate rejects the identity-middle backtrack.
    decisive_gaps: >-
      No general public path constructor is supplied. The direct core has
      unproved exceptional-locus mass and polynomial cost and singleton public
      support. The adaptive OneEnd-oracle coverage bridge is also absent.
  - family_id: F3-short-cycle
    status: inconclusive_sampler_family_with_scoped_obstructions
    earliest_nonpassing_arrow: P4_high_mass_cycle_and_public_line_cost
    joint_verdicts: {J1: holds, J2: holds, J3: inconclusive, J4: breaks, J5: breaks}
    preserved_result: >-
      An accepted closed odd ell-isogeny word is a typed E->E map of nonsquare
      degree ell^d, and its exact deterministic byte law is specified.
    decisive_gaps: >-
      F3-ODD-CYCLE-MASS and F3-PUBLIC-LINE-ENUM remain unproved. The submitted
      lexicographically first output has publicly enumerable singleton support,
      and no adaptive query-coverage bridge is supplied.
  - family_id: F4-bounded-map-search
    status: inconclusive_sampler_family_with_broken_reduction_bridge
    earliest_nonpassing_arrow: P4_high_mass_descriptor_density
    joint_verdicts: {J1: holds, J2: holds, J3: inconclusive, J4: breaks, J5: inconclusive}
    preserved_result: >-
      Every accepted rational/interpolation descriptor is a globally verified,
      canonically serialized non-scalar E->E map; the raw-bit and retry laws are
      exact and one attempt is symbolically polynomial.
    decisive_gaps: >-
      F4-BOUNDED-DESCRIPTOR-DENSITY is unproved, so high-mass conditional
      success is not established. No positive support-entropy or absence-of-
      polynomial-enumerator theorem is established, and the adaptive
      query-coverage bridge is absent.

hard_problem_implication:
  accepted_output_to_bounded_OneEnd: holds_on_that_same_curve
  frozen_sampler_to_distributional_bounded_OneEnd: >-
    Holds on the D_ER good set with capped failure at most
    nu(lambda)+2^(-kappa), subject to an actual family satisfying J3.
  cited_reduction_direction: EndRing_less_than_or_equal_to_bounded_OneEnd
  frozen_sampler_to_EndRing: breaks
  earliest_missing_bridge: >-
    Upgrade the high-mass D_ER promise to a total bounded OneEnd oracle for
    every adaptive curve queried by Page--Wesolowski Algorithm 3, or prove a
    complete internal-query-law bridge with reciprocal-success, termination,
    degree, representation, and total-cost bounds.
  claim_boundary: >-
    This is a quantifier/coverage failure of the proposed composition, not an
    EndRing algorithm, EndRing hardness theorem, or separation between OneEnd
    and EndRing.

optional_correction:
  reserved_task_id: TASK-20261009-1f7c04
  user_authorization_received: true
  queued: false
  disposition: skipped_by_frozen_admission_rule
  reason: >-
    No one missing source or typing repair can change a family disposition.
    F1 and F2 need a new public constructor plus mass/cost/support and oracle-
    coverage results. F3 needs independent mass/cost, support, and coverage
    repairs. F4 needs density, support, and coverage results. Changing D_ER or
    adding a path, orientation, ideal, tag, torsion data, or complete ring is
    forbidden by the frozen rule.

