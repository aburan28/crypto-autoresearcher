exactly_one_next_action:
  id: ENDRING-ADAPTIVE-ONEEND-COVERAGE
  owner: future_coordinator
  automatic_launch: false
  objective: >-
    Before another PKE/KEM wrapper, generate and evaluate candidate interfaces
    that either provide a uniformly polynomial public non-scalar-endomorphism
    sampler on every supersingular oracle input, or prove a complete bridge
    from a declared sampler law to every adaptive Page--Wesolowski internal
    query law. Each candidate must retain exact success, total cost, and honest
    support accounting.
  acceptance: >-
    One immutable round proposes materially distinct candidates, independently
    evaluates construction, typing, per-query success, adaptive termination,
    cost, support enumeration, and exact reduction quantifiers, and promotes
    only candidates surviving every joint.
  exclusions:
    - no automatic PKE, KEM, AKE, or security claim
    - no hidden orientation, ideal, path, tag, torsion basis, or complete ring
    - no resampling the challenge curve as a retry
    - no inference that a failed bounded family proves universal impossibility
    - no automatic successor launch

knowledge_promotion:
  promoted: []
  not_warranted: >-
    The round produced scoped typed facts, candidate-specific breaks, and open
    obligations. It produced no surviving sampler, replicated positive
    construction, complete reduction, secure primitive, or verified novelty.

no_claim_boundary: >-
  This composition establishes no secure, novel, practical, deployable,
  EndRing-only, IND-CPA, IND-CCA, PKE, KEM, AKE, parameter, hardness, or
  family-level impossibility result. It does not prove that a public
  noncentral sampler cannot exist. It only records the fate of F1--F4 and the
  exact missing adaptive-oracle bridge under the frozen D_ER interface.
