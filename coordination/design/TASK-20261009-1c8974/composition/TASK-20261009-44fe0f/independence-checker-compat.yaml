schema: crypto.autoresearch.review_plan_checker_compat.v1
derivation:
  source: coordination/design/TASK-20261009-1c8974/review-preparation/review-plan.yaml
  source_sha256: 6bdde66e65194ff6e5185499c4f5e08ff19be04f31dbe454593bd5c941bce552
  purpose: >-
    Mechanical key and scope adapter for tools/check_review_independence.py.
    It maps prior to coordinator_prior, owner_task_id to assigned_to, and
    worked_attack to attack_plan. It restricts this pre-composition check to
    scientific joints J1--J5; J6 remains the separately queued post-report
    documentation gate. It does not change an owner, attack, blind-from path,
    control, candidate byte, or verdict.
  raw_checker_result: >-
    The frozen plan produced eight schema-shape failures: missing
    coordinator_prior, missing assigned_to on J1--J6, and missing a top-level
    proves_too_much.failure_signature. No report-level blindness or ownership
    conflict was reported in that raw invocation.

review_plan:
  id: RP-BATCH-12e6aa-CHECKER-COMPAT
  extends: RP-BATCH-12e6aa
  coordinator_prior: >-
    The Coordinator expects every frozen family to fail at distribution mass,
    public-only construction, exact success/runtime, or to become a OneEnd
    solver. A source-supported general sampler would overturn the family-level
    prior but would be routed as a hard-problem algorithm, not as a PKE public
    interface.
  joints:
    - id: J1
      assigned_to: TASK-20261009-8182ff
      attack_plan: >-
        Trace every input to the challenge and sampler; reinsert the erased
        walk, orientation, ideal, torsion labels, and basis one at a time;
        condition on easy loci; then compare every invoked equivalence theorem
        against the pages, assumptions, representation, and quantifiers read.
    - id: J2
      assigned_to: TASK-20261009-b3e555
      attack_plan: >-
        Apply the p-Frobenius codomain mismatch, scalar maps, dual backtracks,
        central q-Frobenius where applicable, automorphism conjugation, and two
        syntactic encodings of one map. Re-derive source, target, and degree for
        every composition in all four families.
    - id: J3
      assigned_to: TASK-20261009-38456a
      attack_plan: >-
        Separate average from per-curve success, expose rare prime-field and
        exceptional loci, replace return-probability heuristics by their
        missing theorem, charge enumeration and normalization, and derive the
        capped retry failure from the stated q(lambda).
    - id: J4
      assigned_to: TASK-20261009-8a1dc4
      attack_plan: >-
        Starting only from the opening contract and primary sources, construct
        the solver, compute probability and runtime, audit degree and output
        representation bounds, and attempt the cited OneEnd-to-EndRing
        reduction while separating worst-case, per-instance, and
        distributional games.
    - id: J5
      assigned_to: TASK-20261009-38456a
      attack_plan: >-
        Build public lists for scalars, immediate backtracks, exceptional
        maps, bounded cycles, and bounded descriptor spaces; substitute each
        forbidden leaked witness and identify exactly where the bare-E route
        changes problems.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - PTM-J1-CONDITIONED-LOCUS
      - PTM-J2-SCALAR-AND-WRONG-CODOMAIN
      - PTM-J3-DETERMINISTIC-EASY-POINT
      - PTM-J4-SINGLE-DISTRIBUTION-ORACLE
      - PTM-J5-SINGLETON-HIDDEN-SUPPORT
    failure_signature: >-
      The scoped argument must reject each known-false conclusion: conditioning
      is not the original law; a scalar or wrong-codomain map is not a
      non-scalar self-map; one easy endpoint does not prove high distribution
      mass; one endpoint distribution is not every adaptive oracle query; and
      a public singleton has zero conditional min-entropy.
  blind_rederivation:
    required: true
    assigned_to: TASK-20261009-8a1dc4
    quantity: >-
      Exact success and runtime of Samp-to-OneEnd followed by the sourced
      coverage, loss, and runtime premises of OneEnd-to-EndRing.
    blind_from:
      - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-589f9d/family-a.yaml
      - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-589f9d/report.md
      - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-9fd740/family-b.yaml
      - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-9fd740/report.md
      - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-8182ff/review.yaml
      - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-b3e555/review.yaml
