    - F2 has no public FindExceptionalPath law or exceptional-locus mass bound.
    - F3 has no F3-ODD-CYCLE-MASS theorem and no discharged public-line enumeration cost theorem.
    - F4 has no F4-BOUNDED-DESCRIPTOR-DENSITY theorem.
    - No source supplies an exact bridge from D_ER to a standard EndRing input law or every-query oracle coverage.
  interpretation: >-
    These gaps keep the corresponding success or bridge claims unestablished.
    They do not prove nonexistence, hardness, or failure of any broader family.

