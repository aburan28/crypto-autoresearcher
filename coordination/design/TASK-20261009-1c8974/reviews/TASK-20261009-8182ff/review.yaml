endpoint_law_rederivation:
  source_of_statement: D-ER-BATCH-12e6aa-v1 public parameters and edge_and_walk_law
  sample_space: >-
    Omega_L is the set of length-L kernel-line words from E0. At the first
    step there are ell+1 geometric kernel lines. At every later step there are
    exactly ell choices after excluding only the transported dual of the
    immediately preceding edge. Norm and Canon are applied at every step.
  sample_space_size: >-
    |Omega_L|=1 for L=0, and |Omega_L|=(ell+1)*ell^(L-1) for L>=1.
  word_probability: >-
    Every admissible word has probability 1/|Omega_L| because every finite-set
    choice is exact uniform, with biased machine-word residues rejected.
  endpoint_probability: >-
    D_ER(lambda)(e)=#{w in Omega_L: canonical_endpoint_bytes(w)=e}/|Omega_L|.
    Distinct kernel lines, parallel edges, and distinct paths that canonicalize
    to e retain their multiplicity.
  challenge_bytes: canonical endpoint bytes only
  erased_state:
    - sampled coins and kernel lines
    - intermediate curves, quotient maps, isomorphisms, and composed walk
    - incoming-edge marker
    - orientation, ideal, tag, and hidden label
    - torsion labels and torsion basis
    - endomorphism, order, and complete ring basis
  efficient_specification_verdict: holds
  efficient_specification_rationale: >-
    At the frozen contract level, Pi fixes the finite field, E0, ell, polynomially
    bounded L, exact finite-set rule, Norm, Canon, encodings, and arithmetic.
    This review did not run an implementation and does not promote that
    specification into a measured implementation result.
  standard_distribution_boundary: >-
    D_ER is campaign-defined. PW24-VOR Proposition 2.7 gives closeness after a
    sufficiently long stated walk to an automorphism-weighted stationary law,
    itself close to uniform; it does not state exact equality of this fixed
    finite-length, canonical-byte, nonbacktracking endpoint law with a uniform
    or standard EndRing input law. No applicable L-dependent bridge is supplied.

good_curve_mass_rederivation:
  general_identity: >-
    For s_E=Pr_rho[A_eval.validity(E,Samp(Pi,E;rho))=true], the frozen good set
    is G_lambda={E:s_E>=1/q(lambda)} and its mass is
    sum_e D_ER(lambda)(e)*1[s_e>=1/q(lambda)]. An average over (E,rho) cannot
    replace this outer mass.
  F1-relative-frobenius:
    public_core: >-
      The core is deterministic, so s_E=1[C1(E)], q_1=1, G_1=C1, and
      Pr_D_ER[G_1]=mu_1=sum_e D_ER(e)*1[C1(e)]. The exact required bad mass is
      nu_1=1-mu_1.
    intended_route: >-
      Without an instantiated K1_E or q, its per-E success, good set, and mass
      are not defined beyond a future pushforward obligation.
    mass_bound_verdict: inconclusive
    reason: No inspected source bounds mu_1 or proves nu_1 negligible.
  F2-exceptional-automorphism-transport:
    direct_core: >-
      The direct core is deterministic, so s_E=1[C2(E)], q_2=1, G_2=C2, and
      Pr_D_ER[G_2]=mu_exc=sum_e D_ER(e)*1[C2(e)]. The exact required bad mass
      is 1-mu_exc.
    transported_route: >-
      Without an instantiated public pathfinder law or q, its per-E success,
      good set, and mass are not defined beyond a future pushforward obligation.
    mass_bound_verdict: inconclusive
    reason: >-
      The source-supported count of two exceptional geometric classes is not a
      D_ER probability bound and proves neither side negligible.
  F3-short-cycle:
    derivation: >-
      The enumerator is deterministic. With Z_3(E) the accepted searched odd
      cycles, s_E=1[Z_3(E) nonempty], q_3=1, G_3={E:Z_3(E) nonempty}, and
      Pr_D_ER[G_3]=sum_e D_ER(e)*1[Z_3(e) nonempty]=1-nu_3.
    mass_bound_verdict: inconclusive
    reason: F3-ODD-CYCLE-MASS is absent; graph intuition is not a theorem.
  F4-bounded-map-search:
    derivation: >-
      With R_4 raw bits and A_4(E) accepting strings, s_E=a_4(E)=A_4(E)/2^R_4.
      For q_4=lambda^c_q, G_4={E:a_4(E)>=lambda^(-c_q)} and
      Pr_D_ER[G_4]=sum_e D_ER(e)*1[a_4(e)>=lambda^(-c_q)]=1-nu_4.
    mass_bound_verdict: inconclusive
    reason: F4-BOUNDED-DESCRIPTOR-DENSITY is absent; exact counting identities do not lower-bound their values.

worked_attacks_and_controls:
  input_trace:
    F1-relative-frobenius: >-
      The public core uses Pi, E, coefficient conjugation, Canon, and no coins.
      The intended FindConjugate signature permits only Pi, E, and independent
      coins; its implementation is missing rather than secretly augmented.
    F2-exceptional-automorphism-transport: >-
      The direct core uses Pi and E. The intended pathfinder permits only Pi,
      E, and independent coins; its implementation is missing rather than
      supplied with a path or label.
    F3-short-cycle: >-
      Enumeration starts anew at the supplied canonical E and uses public
      Norm/Canon data; it does not read the endpoint-generating walk.
    F4-bounded-map-search: >-
      The parser/compiler uses Pi, E, and independent uniform rho only; all
      payload material is checked against public E.
  erased_state_reinsertion:
    - item: endpoint walk or its random coins
      result: changes every family to a correlated-advice problem; no family consumes it
    - item: kernel lines, quotient maps, intermediate curves, or incoming-edge marker
      result: changes the input relation; no family consumes them
    - item: orientation
      result: augmented problem; absent from every declared input
    - item: ideal or tag/hidden curve label
      result: augmented problem; absent from every declared input
    - item: torsion label or torsion basis
      result: augmented problem; absent from every declared input
    - item: endomorphism, order, or complete ring basis
      result: supplies the sought witness or an oracle; absent from every declared input
  identity_D_ER_without_hardness_bridge:
    outcome: passed
    rationale: >-
      Each family measures its locus or acceptance threshold under unchanged
      D_ER and explicitly declines a standard-distribution hardness bridge.
  PTM-J1-CONDITIONED-LOCUS:
    outcome: passed
    known_false_conclusion_rejected: >-
      A distribution conditioned on an exceptional, prime-field, cycle, or
      other easy locus is identical to unconditioned D_ER.
    exact_calculation: >-
      For a locus C of mass mu with 0<mu<=1,
      D_ER^C(e)=D_ER(e)*1[e in C]/mu and
      TV(D_ER,D_ER^C)=1-mu. For mu=0 the conditional law is undefined. Thus
      identity requires the separately proved degenerate case mu=1; it cannot
      be inferred from a useful point or class count.
    family_behavior: >-
      F1 and F2 return FAIL off their public loci; F3 and F4 retain an exact
      bad-instance mass under D_ER. None replaces the challenge law by its
      conditional law.
  noncanonical_challenge_encoding:
    outcome: passed
    rationale: >-
      D_ER is a law on Canon output bytes, not merely isomorphism classes, and
      all four packets preserve exact byte equality and path multiplicity.
  source_equivalence_comparison:
    outcome: passed
    rationale: >-
      PW24-VOR supports efficient representations and an EndRing-to-bounded-
      OneEnd oracle reduction. It does not identify D_ER with the reduction's
      internal query laws. Campaign canonical serialization, public
      non-scalarity certificates, family mass theorems, and public connecting
      constructors are correctly labeled derived, contractual, or missing.

family_verdicts:
  F1-relative-frobenius:
    verdict: holds
    canonical_subverdicts:
      exact_D_ER_law: holds
      bare_input_dependency: holds
      representation_source_coverage: holds
      standard_distribution_or_equivalence_boundary: holds
      good_curve_mass_bound: inconclusive
    rationale: >-
      F1 leaves D_ER unconditioned and its public core is bare-input. The
      general constructor and its law are expressly absent, and the conditional
      Frobenius typing is not misrepresented as that constructor. The exact
      core mass is mu_1, but no inspected source makes 1-mu_1 negligible.
      This missing evidence is not a J1 break and is not evidence against a
      future constructor.
  F2-exceptional-automorphism-transport:
    verdict: holds
    canonical_subverdicts:
      exact_D_ER_law: holds
      bare_input_dependency: holds
      representation_source_coverage: holds
      standard_distribution_or_equivalence_boundary: holds
      good_curve_mass_bound: inconclusive
    rationale: >-
      F2's direct sampler returns FAIL outside the exceptional locus rather
      than conditioning D_ER, and the transported interface forbids a supplied
      path or hidden label. Primary sources cover the exceptional algebra and
      dual identities, not a public pathfinder or D_ER mass. The producer states
      those gaps and asserts no distribution equivalence.
  F3-short-cycle:
    verdict: holds
    canonical_subverdicts:
      exact_D_ER_law: holds
      bare_input_dependency: holds
      representation_source_coverage: holds
      standard_distribution_or_equivalence_boundary: holds
      good_curve_mass_bound: inconclusive
    rationale: >-
      F3 searches from the supplied E with public data and preserves the
      original endpoint weights. Its deterministic good set and exact bad mass
      are correctly derived. F3-ODD-CYCLE-MASS and the public-line enumeration
      bit-cost theorem are carried as open obligations rather than invoked
      sources, so no uncovered theorem or law substitution occurs.
  F4-bounded-map-search:
    verdict: holds
    canonical_subverdicts:
      exact_D_ER_law: holds
      bare_input_dependency: holds
      representation_source_coverage: holds
      standard_distribution_or_equivalence_boundary: holds
      good_curve_mass_bound: inconclusive
    rationale: >-
      F4's raw denominator, parsing rejects, byte multiplicity, and semantic
      pushforward are exact per E and then averaged under unchanged D_ER. It
      uses only public input and independent coins. The missing descriptor-
      density theorem is declared missing, so the exact law holds while its
      high-mass consequence remains inconclusive.

missing_evidence_not_failure:
