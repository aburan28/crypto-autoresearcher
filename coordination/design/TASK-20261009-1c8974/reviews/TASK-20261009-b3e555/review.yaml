schema: crypto.autoresearch.joint_review.v1
review:
  task_id: TASK-20261009-b3e555
  batch_id: BATCH-12e6aa
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  review_plan_id: RP-BATCH-12e6aa
  joint_id: J2
  joint_title: self-map typing, serialization, and non-scalarity
  verdict_vocabulary: [holds, breaks, inconclusive]
  overall_joint_verdict: holds
  scope: >-
    Specification-level algebraic and representation review of every non-FAIL
    output admitted by the four frozen producer families. This verdict does
    not assert that a family constructs such an output on a general endpoint,
    has the required D_ER mass, runs in polynomial total cost, has broad
    support, supplies the PW24 oracle, or yields EndRing or PKE.
  conclusion: >-
    For F1--F4, each descriptor that satisfies the frozen A_eval contract has
    root type E->E and a public certificate that excludes every scalar [a]
    without an EndRing oracle. The conditional and restricted routes still
    have the public-construction, mass, or scaling gaps stated below; those
    gaps do not falsify the narrower J2 accepted-output invariant.

  family_verdicts:
    - family_id: F1-relative-frobenius
      verdict: holds
      verdict_scope: >-
        Holds for the deterministic public core on C1(E) and conditionally for
        the intended route whenever a valid separable phi descriptor is
        supplied. It does not establish FindConjugate or high D_ER mass.
      exact_map:
        source: E over the canonical F_(p^2) model
        intermediate: E^(p), formed by coefficientwise p-conjugation
        target: E^(p^2)=E on the original canonical model
        maps:
          - 'phi:E->E^(p), separable, degree d, gcd(d,p)=1'
          - 'F_(E^(p)),p:E^(p)->E, purely inseparable, degree p'
        root: 'alpha=F_(E^(p)),p o phi:E->E'
        total_degree: p*d
        inseparable_degree: p
        field_of_definition: >-
          The DER primitives and root are over the fixed F_(p^2) encoding;
          evaluation on extension points uses the fixed F_(p^(2k)) encoding.
      public_core: >-
        If Canon(E^(p)) returns canonical bytes E and c:E^(p)->E, then
        phi=c^(-1) and alpha=F_(E^(p)),p o c^(-1) have total and inseparable
        degree p.
      normalization_and_serialization: >-
        The public core stores c^(-1), then REL_FROB_P with source E^(p) and
        target E, then COMPOSE in the semantic order Frobenius after c^(-1).
        Conditional phi syntax is fully typed before composition. Canonical
        DER bytes are unique per syntax tree, not per semantic map.
      non_scalarity: >-
        Scalar multiplication has square inseparable degree on the
        supersingular curve, whereas the verified root has inseparable degree
        the prime p. INSEP_NOT_SQUARE therefore excludes alpha in Z.
      kernel_and_exceptional_cases: >-
        No proper subgroup is part of the frozen relation. Failure of C1,
        malformed phi syntax, a field mismatch, or an unmatched codomain
        yields FAIL/rejection. Substituting the inseparable E->E^(p)
        Frobenius for separable phi produces the p^2-Frobenius control with
        square inseparable degree and cannot use the F1 certificate.
      construction_vs_existence: >-
        The algebra exists for a supplied valid phi, and the core is publicly
        constructed only on C1. No public general FindConjugate algorithm is
        supplied. This is recorded as an open construction obligation, not as
        nonexistence or hardness.
      subgroup_preservation: not_applicable
      subgroup_reason: >-
        The relation asks for an ambient endomorphism, and identifies no
        proper subgroup or transported point workload whose preservation or
        kernel intersection could be certified.

    - family_id: F2-exceptional-automorphism-transport
      verdict: holds
      verdict_scope: >-
        Holds for direct accepted exceptional automorphisms and conditionally
        for transport through a supplied valid separable path. It does not
        establish a public FindExceptionalPath or exceptional-locus mass.
      exact_map:
        direct: >-
          With a public isomorphism s:E->C, the flattened map
          s^(-1) o u o s:E->E has degree and inseparable degree one.
        transported_maps:
          - 'phi:E->X, separable, degree d'
          - 'u:X->X, degree 1, t_u=0 for u_4 or t_u=-1 for u_3'
          - 'dual(phi):X->E, degree d'
        transported_root: 'alpha=dual(phi) o u o phi:E->E'
        transported_total_degree: d^2
        transported_inseparable_degree: 1
        field_of_definition: >-
          Direct roots and every accepted transported primitive are over the
          fixed F_(p^2) encoding. For p>3 the required fourth- and third-root
          controls are representable in F_(p^2); A_eval still checks the
          actual formulas and fields.
      normalization_and_serialization: >-
        Direct maps are flattened and canonically reduced as one EXPLICIT_MAP,
        so DEGREE_ONE_NOT_PM_ONE applies to the root itself. Transport stores
        normalized forward steps, u, explicit normalized reverse dual steps,
        and COMPOSE order phi, u, dual(phi). Any accepted root has exact
        adjacent source/target byte matches.
      non_scalarity: >-
        Direct u_3/u_4 roots are degree-one maps different from +1 and -1.
        For transport, dual(phi) o phi=[d] and phi o dual(phi)=[d] imply
        alpha^2-[d*t_u]alpha+[d^2]=0. Its discriminant is
        d^2*(t_u^2-4), nonzero for t_u in {0,-1}; a positive-degree scalar
        satisfying the verifier identity would instead force zero
        discriminant.
      kernel_and_exceptional_cases: >-
        Direct maps are automorphisms with trivial kernel. No kernel
        injectivity is claimed for the transported endomorphism because no
        relevant subgroup is specified. Nonexceptional endpoints make the
        direct core fail; absent or unencodable paths make transport fail.
        Setting u=[1] gives the immediate-backtrack scalar [d] and zero
        discriminant, so the negative control is rejected.
      construction_vs_existence: >-
        Direct public construction is specified on the two exceptional loci.
        Transported correctness is conditional on a supplied path and an
        explicit dual; no public general path constructor is supplied.
      subgroup_preservation: not_applicable
      subgroup_reason: >-
        Neither a proper subgroup nor a point-transfer/recovery workload is
        specified by the frozen sampler relation.

    - family_id: F3-short-cycle
      verdict: holds
      verdict_scope: >-
        Holds for every word that compiles and is accepted. It does not
        discharge public geometric-line enumeration, cycle mass, or their
        complete polynomial cost.
      exact_map:
        source: 'C_0=E over F_(p^2)'
        steps: 'psi_i:C_(i-1)->C_i, separable, degree ell'
        closure: 'canonical target bytes C_d equal source bytes E'
        target: 'C_d=E'
        root: 'alpha=psi_d o ... o psi_1:E->E'
        searched_lengths: 'odd d with 1<=d<=B_3(lambda)'
        total_degree: ell^d
        inseparable_degree: 1
        field_of_definition: >-
          Each accepted VELU_STEP, target isomorphism, and composition is
          verified in the fixed F_(p^2) representation. The packet has not
          supplied the separate public-line enumeration theorem for all
          declared geometric lines.
      normalization_and_serialization: >-
        Every step uses Norm followed by Canon, carries the explicit target
        isomorphism, and matches adjacent canonical bytes. Words are ordered
        by length and step bytes; the lexicographically first accepted DER
        descriptor fixes output syntax while allowing semantic collisions.
      non_scalarity: >-
        Since ell is prime and d is odd, ell^d is not an integer square.
        Every scalar [a] has degree a^2, so DEGREE_NOT_SQUARE excludes a
        scalar root. Nonbacktracking by itself is not used as a proof.
      kernel_and_exceptional_cases: >-
        The composite has finite kernel of order ell^d, but no relevant
        subgroup is specified. An immediate dual backtrack is excluded from
        the word domain; if inserted it equals [ell], has square degree
        ell^2, and fails the certificate. No accepted closed word gives FAIL;
        absence of one, line-enumeration failure, or normalization failure does.
      construction_vs_existence: >-
        Existence is only per endpoint through nonemptiness of Z_3(E). The
        deterministic compiler is explicit after lines are available, but
        F3-PUBLIC-LINE-ENUM remains an open exact public construction and
        polynomial-bit-cost obligation.
      subgroup_preservation: not_applicable
      subgroup_reason: >-
        The frozen relation requires an endomorphism of the ambient curve and
        declares no subgroup to preserve.

    - family_id: F4-bounded-map-search
      verdict: holds
      verdict_scope: >-
        Holds for every rational-mode or interpolation-mode descriptor that
        passes the global verifier. It does not establish accepting-string
        density or complete retry scaling.
      exact_map:
        source: E over the canonical F_(p^2) model
        target: E on the identical canonical bytes
        root: one canonically reduced EXPLICIT_MAP node
        total_degree: 'delta with 1<=delta<=D_4(lambda)<p'
        inseparable_degree: 1 for every admitted positive-degree root
        field_of_definition: >-
          Coefficients and checked interpolation points use the fixed
          F_(p^2) representation; A_eval verifies the global projective
          rational-map identity, not only sampled pairs.
      normalization_and_serialization: >-
        Rational mode rejects noncanonical input rather than normalizing it.
        Interpolation uses a fixed monomial order and deterministic reduced
        row-echelon pivots, requires one normalized reduced solution, and then
        emits DER bytes rather than a new transcript opcode. Byte and semantic
        preimage counts remain separate.
      non_scalarity: >-
        A_eval accepts only a public frozen certificate. INSEP_NOT_SQUARE and
        DEGREE_NOT_SQUARE contradict the square invariants of a scalar;
        DEGREE_ONE_NOT_PM_ONE excludes the only degree-one scalars; and for
        NONZERO_DISCRIMINANT, substituting alpha=[a] with deg(alpha)=a^2 into
        the verified quadratic identity forces t=2a and zero discriminant.
        Under delta<p, INSEP_NOT_SQUARE is in fact unavailable because the
        inseparable degree is one, but this does not weaken the other checks.
      kernel_and_exceptional_cases: >-
        No subgroup-kernel condition is part of this relation. Malformed,
        noncanonical, pointwise-only, wrong-field, wrong-codomain, scalar, or
        uncertified payloads are failures. A raw E->E^(p) map with distinct
        target fails typing, and D_4<p separately excludes degree p.
      construction_vs_existence: >-
        The public one-call parser/compiler/verifier is explicitly specified,
        but existence of enough accepting raw strings on high D_ER mass is
        unproved. No implementation or measured cost was reviewed.
      subgroup_preservation: not_applicable
      subgroup_reason: >-
        No proper subgroup, injection, or recovery workload is specified.

  blind_rederivation:
    quantity: >-
      Source, target, degree, field of definition, normalization, and public
      non-scalarity for every composed map in F1--F4.
    result: agrees_with_accepted_output_claims
    derivations:
      F1: >-
        Composition types E->E^(p)->E; morphism degrees and inseparable
        degrees multiply, giving pd and p. The scalar invariant is square.
      F2: >-
        The source/target chain closes. Expanding alpha^2 and inserting
        phi o dual(phi)=[d] transports u^2-[t_u]u+[1]=0 to the displayed
        quadratic with nonzero discriminant.
      F3: >-
        Exact canonical closure makes the normalized composition a self-map;
        degree multiplication gives ell^d, nonsquare for odd d.
      F4: >-
        Global A_eval validation establishes the explicit E->E map. Each
        allowed certificate was checked directly against a hypothetical
        scalar, including the discriminant case.
    blind_from:
      - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-8182ff/review.yaml
      - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-38456a/review.yaml
      - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-8a1dc4/review.yaml
      - coordination/design/TASK-20261009-1c8974/composition/
    blind_from_respected: true

  control_checks:
    proves_too_much:
      id: PTM-J2-SCALAR-AND-WRONG-CODOMAIN
      known_false_conclusion: >-
        A scalar/backtrack or E-to-E^(p) map is a certified non-scalar E-to-E
        endomorphism.
      outcome: rejected_as_required
      scalar_half: >-
        F1 rejects square inseparable degree; F2 direct rejects +/-1 and
        transport makes the identity middle map a zero-discriminant [d]; F3
        rejects square degree; F4 rejects a scalar under every allowed
        certificate.
      wrong_codomain_half: >-
        A lone relative Frobenius with distinct target E^(p) fails the root
        target-byte check in every family. F1 succeeds only with the explicit
        return leg; F2/F3 emit no such node; F4 also has D_4<p.
    frozen_matrix:
      scalar_multiplication: pass_negative
      immediate_dual_backtrack: pass_negative
      central_p2_frobenius_slice: pass_negative
      unmatched_p_frobenius: pass_negative
      exceptional_automorphism: pass_positive
      automorphism_conjugation: pass_positive_for_F2_direct
      two_syntaxes_one_semantic_map: >-
        pass: canonicality is per syntax; each packet states a byte law first
        and separately aggregates semantic collisions.
      leaked_auxiliary_data: >-
        Interface check only: pointers, hidden tables, orientations, ideals,
        tags, and torsion labels/bases are forbidden syntax. No J5 support or
        auxiliary-data verdict is made.
      distribution_conditioning: >-
        Interface check only: restricted cores return FAIL off their loci and
        do not relabel the input distribution. No J1 mass verdict is made.
      proper_witness_enumeration: >-
        Recorded but not adjudicated: F1/F2 cores and F3 outputs are singleton
        per successful E; F4 distinguishes finite from polynomial
        enumeration. J5 remains outside this review.

  cost_and_transfer_boundary:
    evidence_label: unmeasured
    construction: >-
      F1 FindConjugate and F2 FindExceptionalPath are absent; F3 still owes
      F3-PUBLIC-LINE-ENUM; F4 specifies a bounded public one-call constructor.
    evaluation: >-
      Accepted descriptors are evaluable by A_eval in the frozen extension
      representation, but no concrete operation count or measurement exists.
    verification: >-
      All routes charge A_eval symbolically. F3 additionally charges every
      unsuccessful enumerated word; F4 charges every raw rejection.
    retry: >-
      Core/F3 routes are deterministic on a fixed E; F4 gives a conditional
      retry formula. No J3 verdict on success, mass, or total cost is made.
    duplicates: >-
      F3 traversal and F4 raw preimages retain duplicate work; byte/semantic
      collisions are not silently deduplicated in probability laws.
    memory: symbolic_only
    recovery: not_applicable_self_map_relation
    computational_advantage: not_established_or_measured

  limits_and_non_owned_joints:
    not_judged: [J1, J3, J4, J5, J6]
    explicit_limits:
      - No distribution-law, good-set-mass, retry-success, or polynomial-total-cost verdict.
      - No sampler-to-OneEnd-to-EndRing reduction verdict.
      - No support-enumeration, entropy, documentation, PKE, or security verdict.
      - No source theorem outside the frozen producer packets was independently checked.

  source_integrity:
