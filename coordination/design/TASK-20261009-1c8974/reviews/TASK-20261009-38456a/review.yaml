schema: crypto.autoresearch.public_noncentral_sampler_red_team_review.v1
task_id: TASK-20261009-38456a
batch_id: BATCH-12e6aa
goal_id: GOAL-SSI-2fa82a
question_id: RQ-SSI-1946c9
date: '2026-10-09'
role: red-team
review_plan_id: RP-BATCH-12e6aa
owned_joints: [J3, J5]
verdict_vocabulary: [holds, breaks, inconclusive]

scope:
  objective: >-
    Independently attack the exact conditional-success, bad-instance-mass,
    retry, polynomial-cost, support-enumeration, byte/semantic-multiplicity,
    and hidden-auxiliary-data claims of F1--F4.
  unowned_joints_not_judged: [J1, J2, J4, J6]
  interpretation_rule: >-
    A missing proof needed by the frozen sampler contract can break a submitted
    contract claim, but it is not a proof that the missing construction,
    negligible-mass bound, or polynomial enumerator does not exist. Every such
    nonexistence question is reported as inconclusive.
  exact_contract_tested: >-
    For one lambda-only polynomial q and negligible nu, the candidate must have
    Pr_{E<-D_ER}[Pr_rho[valid(E,Samp(Pi,E;rho))]>=1/q(lambda)]
    >=1-nu(lambda), with same-E independent retries and polynomial total time,
    memory, descriptor size, validation, and output cost.

canonical_family_verdicts:
  F1-relative-frobenius:
    J3: breaks
    J5: breaks
  F2-exceptional-automorphism-transport:
    J3: breaks
    J5: breaks
  F3-short-cycle:
    J3: inconclusive
    J5: breaks
  F4-bounded-map-search:
    J3: inconclusive
    J5: inconclusive

family_findings:
  F1-relative-frobenius:
    J3:
      verdict: breaks
      component_verdicts:
        exact_output_law: breaks
        exact_conditional_success: breaks
        bad_instance_mass: inconclusive
        retries: breaks
        polynomial_total_cost: breaks
      public_core:
        good_predicate: C1(E)
        one_call_success: 's_1(E)=1[C1(E)]'
        q: q_1(lambda)=1
        good_set: 'G_1(lambda)={E:C1(E)}'
        easy_locus_mass: 'mu_1(lambda)=Pr_{E<-D_ER(lambda)}[C1(E)]'
        exact_bad_mass: nu_1(lambda)=1-mu_1(lambda)
        bad_mass_status: >-
          Neither mu_1>=1-negl nor its negation is proved. Deterministic success
          at one C1 endpoint supplies no D_ER mass bound.
        retry_derivation: >-
          On C1 the exact failure after one call is zero; off C1 it is one for
          every number of same-E calls. The generic q=1 cap
          ceil(kappa*ln(2)) is valid on G_1 but loose; one call is tight.
        degree_bound: log2(deg(alpha_1))=log2(p)<=n_lambda
        cost_status: >-
          The expression charges conjugation, Canon, inverse-isomorphism
          construction, serialization, A_eval, and output storage, but no
          explicit polynomial T_1 or M_1 and no polynomial Canon/construction
          bound is supplied.
      intended_full_route:
        status: >-
          K1_E, FindConjugate, R_1, q_1, nu_1, T_1, M_1, Lambda_PW, and its
          retry cap are not instantiated. A symbolic pushforward of an absent
          law is not an exact candidate output law.
      joint_reason: >-
        The only exact route is deterministic on an easy locus whose outer
        mass and full polynomial cost are unproved. The intended general route
        omits the algorithm and every load-bearing success/cost parameter, so
        the submitted F1 family does not satisfy J3. This does not prove that a
        public FindConjugate algorithm or high-mass route cannot exist.
    J5:
      verdict: breaks
      component_verdicts:
        support_avoidance_and_public_enumeration: breaks
        byte_semantic_multiplicity_accounting: holds
        no_hidden_auxiliary_data: inconclusive
      support_accounting:
        public_core_byte_support: at most one non-FAIL byte string for each E
        public_core_semantic_support: at most one map for each E
        conditional_min_entropy_on_success_bits: 0
        enumeration_attack: >-
          The public core itself identifies the singleton Enc_F1core(Pi,E).
          In any repair that makes its deterministic construction polynomial,
          one call enumerates its entire honest non-FAIL support. Missing J3
          runtime bounds cannot turn singleton support into hidden support.
        intended_route_status: >-
          K1_E and all of its syntax and semantic multiplicities are absent.
          No conclusion about the existence or nonexistence of a polynomial
          enumerator for a future general route is available.
      auxiliary_data_status: >-
        The exact public core reads only Pi and E. The absent intended
        pathfinder cannot be audited as an implementation; any version that
        consumes erased or correlated witness data is an augmented problem.
      joint_reason: >-
        The only instantiated output law has public singleton support and zero
        conditional min-entropy, so it breaks the support-avoidance half of
        J5. This is not a defect in the OneEnd relation and says nothing about
        support of a future, presently uninstantiated extension.

  F2-exceptional-automorphism-transport:
    J3:
      verdict: breaks
      component_verdicts:
        exact_output_law: breaks
        exact_conditional_success: breaks
        bad_instance_mass: inconclusive
        retries: breaks
        polynomial_total_cost: breaks
      direct_public_core:
        good_predicate: C2(E)
        one_call_success: 's_2(E)=1[C2(E)]'
        q: q_2direct(lambda)=1
        good_set: 'G_2direct(lambda)={E:C2(E)}'
        easy_locus_mass: 'mu_exc(lambda)=Pr_{E<-D_ER(lambda)}[C2(E)]'
        exact_bad_mass: nu_2direct(lambda)=1-mu_exc(lambda)
        bad_mass_status: >-
          The fact that two exceptional geometric classes exist is not a
          probability bound under the path-multiplicity endpoint law. Neither
          mu_exc>=1-negl nor its negation is established.
        retry_derivation: >-
          One call succeeds with certainty on C2 and all same-E calls fail off
          C2. Repetition never changes exceptional-locus mass.
        degree_bound: log2(deg(alpha_2direct))=0
        cost_status: >-
          Computing j, converting models, canonical field-root selection,
          flattening, reduction, validation, and output are named, but no
          explicit polynomial T_2direct/M_2direct or polynomial canonical-root
          procedure is frozen.
      transported_route:
        status: >-
          K2_E, FindExceptionalPath, R_2, q_2, nu_2, path-degree bound,
          T_2, M_2, retry cap, and an instantiated byte law are absent.
      joint_reason: >-
        The direct route is exact only on an unbounded-mass exceptional locus
        and lacks required cost polynomials. The intended transported route is
        not an instantiated sampler. J3 therefore breaks for the submitted
        family, without implying that a public pathfinder cannot exist.
    J5:
      verdict: breaks
      component_verdicts:
        support_avoidance_and_public_enumeration: breaks
        byte_semantic_multiplicity_accounting: holds
        no_hidden_auxiliary_data: inconclusive
      support_accounting:
        direct_core_byte_support: at most one non-FAIL byte string for each E
        direct_core_semantic_support: at most one map for each E
        conditional_min_entropy_on_success_bits: 0
        proper_family: the two public exceptional loci with a fixed map choice
        enumeration_attack: >-
          The direct core exposes its entire singleton support. If its public
          construction is made polynomial as J3 requires, a single run is a
          complete polynomial support enumerator.
        transported_route_status: >-
          K2_E is absent, so transport-path byte preimages, semantic
          multiplicities, min-entropy, and polynomial enumerability are all
          inconclusive. Their absence is not evidence that no enumerator exists.
      auxiliary_data_status: >-
        The direct core is bare-E public computation. The transported
        implementation is absent; a path, orientation, ideal, tag, torsion
        data, or basis supplied rather than publicly computed changes the
        input relation to an augmented problem.
      joint_reason: >-
        The direct candidate is an explicit proper singleton family, which
        breaks support avoidance. The finding does not extend to the missing
        transported route.

  F3-short-cycle:
    J3:
      verdict: inconclusive
      component_verdicts:
        exact_output_law: holds
        exact_conditional_success: holds
        bad_instance_mass: inconclusive
        retries: holds
        polynomial_total_cost: inconclusive
      rederived_counts:
        searched_lengths: 'D_3={d:1<=d<=B_3, d odd}'
        words_at_length_d: '(ell+1)*ell^(d-1)'
        total_words: 'W_3=(ell+1)*sum_{d in D_3} ell^(d-1)'
        justification: >-
          There are ell+1 first kernel lines and exactly ell choices after
          deletion of only the transported immediate dual. Endpoint and
          semantic collisions do not reduce W_3 because word multiplicity is
          retained.
        accepted_words: >-
          Z_3(E) is the subset of the W_3 words that close at the supplied
          canonical E and compile to an accepted descriptor.
      exact_success:
        q: q_3(lambda)=1
        good_set: 'G_3(lambda)={E:Z_3(E) is nonempty}'
        exact_bad_mass: 'nu_3(lambda)=Pr_{E<-D_ER(lambda)}[Z_3(E) is empty]'
        warning: >-
          |Z_3(E)|/W_3 is the return probability of a separate uniform-word
          diagnostic, not the conditional success of the submitted
          deterministic lexicographic enumerator. The latter is exactly one
          on G_3 and zero off G_3.
        missing_mass_result: >-
          F3-ODD-CYCLE-MASS is absent. No random-regular-graph, mixing, or
          average return heuristic supplies the required negligible nu_3.
      retry_derivation: >-
        The tight cap is one on G_3 and gives zero conditional failure.
        Repeating the deterministic sampler off G_3 always fails; resampling E
        is prohibited and cannot be charged as a retry.
      cost_derivation:
        time_upper_bound: >-
          T_3 <= (1+B_3*W_3)*C_line + B_3*W_3*C_step +
          W_3*C_verify, plus polynomial loop, comparison, serialization, and
          output work.
        memory_upper_bound: >-
          Depth-first traversal needs one path of at most B_3 steps, one
          incoming marker, one candidate descriptor, verifier workspace, and
          output storage; it need not retain W_3 complete words.
        degree_output_bound: log2(deg(alpha))<=B_3*ceil(log2(ell))
        status: >-
          Admission requires W_3 polynomial, but F3-PUBLIC-LINE-ENUM does not
          supply a source-backed polynomial bit-cost bound for exact geometric
          kernel-line enumeration, ordering, normalized steps, and transported
          dual markers. Polynomial total cost is therefore inconclusive.
      joint_reason: >-
        The per-curve law, q, and retries are exact, but the negligible outer
        bad mass and one public enumeration primitive's polynomial cost remain
        unproved. No counterexample or nonexistence proof resolves either gap,
        so the canonical J3 verdict is inconclusive.
    J5:
      verdict: breaks
      component_verdicts:
        support_avoidance_and_public_enumeration: breaks
        byte_semantic_multiplicity_accounting: holds
        no_hidden_auxiliary_data: holds
      support_accounting:
        candidate_word_multiplicity: W_3 distinct public words before collisions
        accepted_word_multiplicity: '|Z_3(E)|, retained even when programs denote one map'
        returned_byte_support_per_E: at most one non-FAIL descriptor
        returned_semantic_support_per_E: at most one semantic map
        conditional_min_entropy_on_success_bits: 0
        enumeration_attack: >-
          The sampler is deterministic and returns the lexicographically first
          accepted descriptor. Consequently, any repair establishing its J3
          polynomial runtime also gives a one-call polynomial enumeration of
          its entire honest output support. Separately, enumerating all W_3
          witness words is polynomial only if the carried W_3 and
          F3-PUBLIC-LINE-ENUM obligations hold.
      auxiliary_data_status: >-
        The declared algorithm recomputes candidates from public E and uses no
        erased walk, correlated coins, incoming marker, orientation, ideal,
        tag, torsion label/basis, or ring basis. Supplying one of those is a
        different augmented route, not a retry or enumeration shortcut for
        this bare-E sampler.
      joint_reason: >-
        The singleton returned support cannot be called hidden or
        positive-entropy. This breaks support avoidance while preserving the
        separate inconclusive status of the full W_3 polynomial bit-cost
        obligation.

  F4-bounded-map-search:
    J3:
      verdict: inconclusive
      component_verdicts:
        exact_output_law: holds
        exact_conditional_success: holds
        bad_instance_mass: inconclusive
        retries: holds
        polynomial_total_cost: holds
      rederived_domain:
        byte_budget: S_4=n_lambda^c_S
        length_bits: b_4=ceil(log2(S_4+1))
        coin_bits: R_4=1+b_4+8*S_4
        raw_domain_size: 2^R_4
        success_preimages: 'A_4(E)=sum_d m_4(E,d)'
        one_call_success: 'a_4(E)=A_4(E)/2^R_4'
      exact_success:
        q: q_4(lambda)=lambda^c_q
        good_set: 'G_4(lambda)={E:a_4(E)>=lambda^(-c_q)}'
        exact_bad_mass: >-
          nu_4(lambda)=Pr_{E<-D_ER(lambda)}[a_4(E)<lambda^(-c_q)]
        missing_mass_result: >-
          F4-BOUNDED-DESCRIPTOR-DENSITY is absent. Exact unconditional average
          acceptance does not imply this per-curve threshold on 1-negligible
          D_ER mass, and no coefficient-density guess is substituted.
      retry_derivation:
        cap: N_4(lambda,kappa)=ceil(lambda^c_q*kappa*ln(2))
        exact_failure_for_E: '(1-a_4(E))^N_4'
        bound_on_good_E: >-
          (1-a_4)^N_4 <= exp(-a_4*N_4) <=
          exp(-kappa*ln(2))=2^(-kappa).
        exact_first_byte_law: >-
          For a_4(E)>0, Pr[first accepted d by K]=
          (m_4(E,d)/2^R_4)*(1-(1-a_4(E))^K)/a_4(E).
        scope: fresh independent coins on the same E only
      cost_derivation:
        one_call: >-
          R_4-bit parsing, at-most-S_4-byte storage, deterministic bounded
          interpolation/field arithmetic, canonical compilation, at-most-S_4
          descriptor validation, and output are polynomial under the frozen
          A_eval and arithmetic requirements.
        retry_time: N_4*T_4, polynomial in lambda and kappa on G_4
        peak_memory: M_4 plus one at-most-S_4 output and retry counters
        exhaustive_search_warning: >-
          Enumerating all raw strings costs exactly 2^R_4 invocations and is
          not part of one-call or retry cost. Polynomial R_4 does not make
          2^R_4 polynomial.
      joint_reason: >-
        The exact per-curve law, q, retries, and charged cost hold. The
        high-D_ER-mass density premise is neither proved nor disproved, so J3
        remains inconclusive rather than being promoted from an average.
    J5:
      verdict: inconclusive
      component_verdicts:
        support_avoidance_and_public_enumeration: inconclusive
        byte_semantic_multiplicity_accounting: holds
        no_hidden_auxiliary_data: holds
      support_accounting:
        byte_support: 'B_4(E)={d:m_4(E,d)>0}'
        byte_support_bounds: '0<=|B_4(E)|<=A_4(E)<=2^R_4'
        byte_preimage_multiplicity: m_4(E,d)
        semantic_preimage_multiplicity: >-
          m_4(E,alpha)=sum_{d denoting alpha}m_4(E,d)
        conditional_byte_min_entropy: >-
          If A_4(E)>0, H_infinity=-log2(max_d m_4(E,d)/A_4(E)).
        entropy_status: >-
          Transcript, normalization, and cross-mode collisions may make the
          support singleton; no positive lower bound is established.
        exhaustive_public_enumeration: >-
          The declared raw domain is public and proper but requires 2^R_4
          parser/compiler/verifier invocations. It is not a polynomial
          enumerator. No proof excludes a different polynomial enumerator, so
          support avoidance is inconclusive, not holds.
      auxiliary_data_status: >-
        The declared raw coins are independent of E's erased walk and every
        payload is checked using public Pi,E. A path pointer, orientation,
        ideal, hidden tag, torsion label/basis, ring basis, or correlated
        suggested descriptor violates the declared raw-coin law and is an
        augmented problem.
      joint_reason: >-
        Exact multiplicities and the exponential exhaustive enumeration are
        accounted, but neither a polynomial honest-support enumerator nor its
        nonexistence is proved. Therefore J5 is inconclusive.

cross_family_attacks:
  average_to_per_curve:
    result: holds
    attack: >-
      Let success be one on a locus S and zero elsewhere. Its average success
      is D_ER(S), while the q=1 good-set mass is also only D_ER(S). Even an
      inverse-polynomial average can leave 1-inverse-polynomial bad mass, far
      larger than negligible. No family is credited with the outer quantifier
      from an average over (E,rho).
  endpoint_resampling_as_retry:
    result: holds
    attack: >-
      Every cap is applied to fresh independent rho on the same E. Sampling a
      new endpoint would alter the challenge experiment and can artificially
      evade a bad curve; it is not used in any derivation here.
  failure_symbol_and_abort_charge:
    result: holds
    attack: >-
      The sole 0x00 failure byte remains in every denominator. F4 charges
      malformed length/padding, parse, interpolation, typing, certificate, and
      duplicate-preimage rejects; F3 maps public enumeration/normalization and
      no-cycle failures to 0x00; F1/F2 cores fail off their loci.
  heuristic_substitution:
    result: holds
    attack: >-
      Random-regular-graph intuition, endpoint mixing, coefficient-density
      guesses, and observed hit rates are not theorems for the exact D_ER law.
      None is used to bound nu_1, nu_2, nu_3, or nu_4.
  cost_omission:
    result: holds
    attack: >-
      Path construction, exact kernel-line enumeration, normalization,
      Canon, serialization, validation, rejection, retries, memory, and output
      bytes are charged or identified as missing. Exponential raw-domain
      enumeration is never renamed polynomial sampling.

proves_too_much_controls:
  PTM-J3-DETERMINISTIC-EASY-POINT:
    control_result: holds
    known_false_conclusion_rejected: >-
      Deterministic success on one public easy endpoint proves high D_ER
      good-set mass.
    derivation: >-
      For a deterministic sampler that succeeds on E_star, q=1 is valid at
      E_star, but the contribution to the outer good-set mass is exactly
      D_ER(E_star), or D_ER(S) for the full easy set S. Without a lower bound on
      that mass, neither one point nor one conditioned experiment establishes
      1-negligible good-set mass. Repetition on E_star changes no outer mass.
    exercised_on:
      - F1 public conjugation-isomorphism core
      - F2 direct exceptional core
      - F3 a curve with one qualifying searched cycle
      - F4 a hypothetical single curve with high accepting-string density
  PTM-J5-SINGLETON-HIDDEN-SUPPORT:
    control_result: holds
    known_false_conclusion_rejected: >-
      A publicly enumerable singleton output family has unproved positive
      conditional min-entropy.
    derivation: >-
      Conditional on success, a singleton byte support has maximum probability
      one and therefore H_infinity=-log2(1)=0. Distinct unused DER programs for
      the same map do not enlarge the sampler's byte support; semantic
      quotienting cannot increase it. F1/F2 cores and F3 return singleton
      support. F4 may also collapse to a singleton because m_4 multiplicities
      have no anti-concentration bound.

frozen_enumeration_controls:
  public_scalar_list:
    control_result: holds
    outcome: >-
      Scalars form a public enumerable control list but are outside every
      declared honest non-FAIL support under the frozen candidate laws. This
      is a support-accounting statement only; no independent J2 verdict is made.
  immediate_dual_backtracks:
    control_result: holds
    outcome: >-
      The length-two backtrack list is public and is not counted as honest
      noncentral support. F3 excludes it from its word domain; F4 charges any
      explicit composite as a rejected candidate under its declared law. No
      independent typing/non-scalarity verdict is made here.
  exceptional_maps:
    control_result: holds
    outcome: >-
      The fixed j=0 and j=1728 choices give F2 direct a singleton proper
      family on C2. F4's rational mode can include their explicit bytes only
      where the raw payload hits them. They give no D_ER mass bound.
  bounded_cycles:
    control_result: holds
    outcome: >-
      F3 has exactly W_3 public candidate words and |Z_3(E)| accepted closing
      words before the lexicographic singleton is selected. Polynomial
      bit-cost enumeration of the whole family remains conditional on
      F3-PUBLIC-LINE-ENUM; its absence is not a nonexistence proof.
  bounded_descriptor_space:
    control_result: holds
    outcome: >-
      F4's raw bounded family has exactly 2^R_4 strings before rejection and
      duplicate coalescing. This is a complete public finite enumeration but
      an exponential one. No polynomial-list conclusion in either direction
      follows.
  duplicate_serializations_one_map:
    control_result: holds
    outcome: >-
      F1/F2 symbolic extensions sum path-syntax preimages, F3 retains word
      multiplicity but selects one returned byte string, and F4 separately
      records m_4(E,d) and m_4(E,alpha). No average or entropy claim counts
      syntactic collisions as distinct semantic maps.

frozen_leaked_witness_controls:
  common_rule: >-
    A value publicly recomputed from Pi,E with its full cost charged is allowed.
    Supplying any erased or endpoint-correlated value below, or correlating rho
    with it, changes the frozen challenge from bare E to an augmented problem.
    Whether the leak is useful is immaterial to that classification.
  controls:
    - witness: endpoint-generating walk, its coins, kernels, maps, or intermediate curves
      control_result: holds
      F1: cannot instantiate FindConjugate as an honest bare-E input if consumed
      F2: cannot instantiate FindExceptionalPath as an honest bare-E input if consumed
      F3: cannot replace public cycle enumeration or provide a closing word
      F4: cannot seed or correlate a candidate descriptor/raw string
    - witness: incoming-edge marker
      control_result: holds
      outcome_for_all_families: augmented problem if consumed rather than recomputed
    - witness: orientation
      control_result: holds
      outcome_for_all_families: augmented problem if supplied or endpoint-correlated
    - witness: ideal
      control_result: holds
      outcome_for_all_families: augmented problem if supplied or endpoint-correlated
    - witness: tag or hidden curve label
      control_result: holds
      outcome_for_all_families: augmented problem if supplied or used as lookup advice
    - witness: torsion labels
      control_result: holds
      outcome_for_all_families: augmented problem if supplied rather than publicly derived and charged
    - witness: torsion basis
      control_result: holds
      outcome_for_all_families: augmented problem if supplied rather than publicly derived and charged
    - witness: complete endomorphism-ring basis
      control_result: holds
      outcome_for_all_families: >-
        It can expose non-scalar maps but is circular auxiliary data and changes
        the problem; it is never evidence for a bare-E sampler.

blind_rederivation:
  method: >-
    Starting from D-ER-BATCH-12e6aa-v1 and each candidate's algorithm and fixed
    parameters, recompute per-E success, good sets, exact outer bad mass,
    retry failure, cost, byte preimages, semantic preimages, and support size.
    Producer dispositions and average summaries were not used as premises.
  quantities_rederived:
    - all F1--F4 q and nu expressions above
    - deterministic and geometric retry laws
    - F3 word count W_3 and accepted-word multiplicity |Z_3(E)|
    - F3 charged time, memory, degree, and output-support bounds
    - F4 raw-domain size, a_4(E), retry cap and failure bound
    - F4 byte and semantic preimage multiplicities and entropy formula
  no_average_conversion: true
  absence_is_not_nonexistence: true

