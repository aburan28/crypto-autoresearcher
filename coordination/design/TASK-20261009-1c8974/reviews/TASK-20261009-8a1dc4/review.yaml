  role: reviewer_blind_rederivation
  joint:
    id: J4
    title: sampler-to-OneEnd-to-EndRing implication
    verdict: breaks
    scoped_rationale: >-
      An accepted frozen descriptor is a bounded, efficiently represented
      OneEnd answer for that same curve, and on every D_ER-good curve
      same-curve repetition gives the stated conditional Las Vegas or capped
      success bounds. This is only a high-mass, single-distribution result.
      Page--Wesolowski Theorem 7.2 has the reduction direction EndRing <=
      OneEnd_B: its Algorithm 3 assumes an oracle that returns a valid bounded
      OneEnd answer on the curves generated by its own, adaptively
      parameterized 2-isogeny random walks. The frozen D_ER guarantee neither
      covers every supersingular input nor identifies and bounds those
      internal query laws. Thus the source theorem cannot be instantiated from
      the frozen interface.
    earliest_missing_bridge: >-
      After a valid Samp output has been converted to a bounded OneEnd answer,
      but before Page--Wesolowski Algorithm 3 can be invoked, one must upgrade
      the 1-nu high-mass D_ER guarantee to an always-answer bounded OneEnd
      oracle on every queried curve, or prove a complete bridge to every
      adaptive internal query distribution with termination, reciprocal-success,
      degree, representation, and total-cost bounds. No such bridge is supplied.

  requirement_to_evidence:
    - requirement: independently derive Samp to bounded OneEnd
      status: verified_with_distributional_scope
      evidence: >-
        The frozen verifier accepts only an efficiently evaluable non-scalar
        self-map and enforces log2(deg(alpha)) <= Lambda_PW(n). The probability,
        output-law, retry, abort, and runtime derivations below use only the
        frozen contract.
    - requirement: determine the exact Page--Wesolowski direction and quantifiers
      status: verified
      evidence: >-
        PW24-VOR Definition 2.1, Problems 2.4--2.5, Algorithm 1, Theorem 4.2,
        Algorithm 3, Lemma 7.1, and Theorem 7.2 were read from the retrieved
        version-of-record bytes. The oracle arrow is bounded OneEnd oracle to
        EndRing solver; in reduction notation, EndRing <= OneEnd_B.
    - requirement: separate the three distribution regimes
      status: verified
      evidence: >-
        The sections high_mass_single_distribution, every_input_oracle, and
        pw_internal_query_distributions below state distinct quantifiers and
        show which one the frozen contract supplies.
    - requirement: test PTM-J4-SINGLE-DISTRIBUTION-ORACLE
      status: verified_control_rejects_known_false_conclusion
      evidence: >-
        A D_ER-only good-set guarantee permits zero success away from that set.
        Without a query-law bridge, Algorithm 3 can query such a curve and its
        required oracle response is absent. The control therefore does not
        inherit every-query coverage from single-distribution mass.

  blind_rederivation:
    notation:
      n: n_lambda=ceil(log2(p_lambda))
      delta_E: >-
        Pr_rho[A_eval.validity(E,Samp(Pi_lambda,E;rho))=true]. FAIL and every
        rejected non-FAIL byte string are unsuccessful attempts.
      good_set: 'G_lambda={E: delta_E >= 1/q(lambda)}'
      mass_bound: Pr_{E<-D_ER(lambda)}[E in G_lambda] >= 1-nu(lambda)
      degree_bound: B(n)=Lambda_PW(n), with log2(deg(alpha)) <= B(n)
      verification_cost: >-
        V(lambda) denotes the worst-case time of the frozen polynomial-time
        parser, validity checks, and non-scalarity check for one polynomial-size
        descriptor. One retry attempt costs at most C(lambda)=T(lambda)+V(lambda).

    sampler_to_oneend_relation:
      result: holds_for_each_accepted_output
      derivation: >-
        Validity proves that the descriptor root has source E, target E, and a
        public non-scalarity certificate, so its semantic map lies in
        End(E) minus Z. Its polynomial-size evaluator is an efficient
        representation in the sense of PW24-VOR Definition 2.1, using that the
        field has logarithmic size 2n and lambda and n are polynomially
        related. The verified degree bound makes it a OneEnd_B answer. Removing
        campaign framing changes neither the semantic map nor its evaluator.
      representation_caveat: >-
        This is a relation/output implication, not yet the standard OneEnd
        algorithmic quantifier: Samp also receives the fixed Pi_lambda, and its
        success promise is only high mass under D_ER. Instantiating a standard
        oracle additionally requires Pi_lambda and canonicalization/transport
        to be uniformly available for every oracle input.

    exact_retry_and_output_law:
      per_attempt_law: >-
        For fixed E, let p_E(d) be the probability that one invocation emits
        the valid byte string d. Then delta_E=sum_d p_E(d), over valid d, and
        all FAIL or rejected-byte mass is 1-delta_E.
      unbounded_same_curve_repetition: >-
        If delta_E>0, repeat with independent rho until validity. Termination is
        almost sure, E[number of attempts]=1/delta_E, and the output-byte law is
        Pr[out=d]=p_E(d)/delta_E. The wrapper is zero-error because it releases
        only verifier-accepted descriptors.
      capped_same_curve_repetition: >-
        With N attempts, Pr[no valid output | E]=(1-delta_E)^N and
        Pr[out=d | E]=p_E(d)*(1-(1-delta_E)^N)/delta_E for delta_E>0. If no
        attempt validates, the wrapper emits an explicit failure; this failure
        is not a OneEnd answer.
      frozen_cap: >-
        N(lambda,kappa)=ceil(q(lambda)*kappa*ln(2)). For E in G_lambda,
        (1-delta_E)^N <= exp(-N/q) <= 2^(-kappa).
      exact_attempt_count: >-
        For delta_E>0, E[min(tau,N)]=(1-(1-delta_E)^N)/delta_E, where tau is
        the first-valid attempt. This is at most min(N,1/delta_E), hence at
        most q(lambda) on a good curve for unbounded repetition and at most N
        for the capped wrapper.
      cost: >-
        Capped time is at most N*C(lambda), uses at most N*R(lambda) fresh
        sampler bits, and has sequential peak memory bounded by the sampler,
        verifier, and one descriptor's storage. On a good curve, unbounded
        expected time is at most q(lambda)*C(lambda). No expected bound follows
        for a bad curve.

    high_mass_single_distribution:
      supplied_by_frozen_contract: true
      one_shot_bound: >-
        Pr_{E<-D_ER,rho}[valid] = E_E[delta_E] >= (1-nu(lambda))/q(lambda).
      capped_bound: >-
        For the frozen N(lambda,kappa), success under D_ER is at least
        (1-nu(lambda))*(1-2^(-kappa)); failure is at most
        nu(lambda)+(1-nu(lambda))*2^(-kappa), and therefore at most
        nu(lambda)+2^(-kappa).
      aborts: >-
        FAIL and rejected descriptors consume an attempt. After N unsuccessful
        attempts the wrapper must expose failure; it may not resample E,
        condition D_ER, or silently continue beyond the charged cap.
      limitation: >-
        Unbounded repetition is expected-polynomial conditional on E in
        G_lambda, but need not even terminate on the D_ER bad set. A negligible
        positive bad-set mass can therefore make its unconditional expected
        runtime infinite. Capping restores polynomial halting but leaves a
        nonzero failure output, which is not the oracle assumed by PW24-VOR.

    every_input_oracle:
      supplied_by_frozen_contract: false
      sufficient_strengthening: >-
        For every supersingular E/F_{p^2} accepted as an oracle input, require
        delta_E >= 1/q(lambda), the same efficient-representation and degree
        bound, and uniformly available Pi_lambda/canonical transport. Then
        repeat-until-valid defines a total Las Vegas OneEnd_B oracle: it is
        zero-error, terminates almost surely, and has expected per-query cost at
        most q(lambda)*C(lambda).
      end_to_end_oracle_instantiation_cost: >-
        If the PW reduction makes an expected P(n,B(n)) oracle calls, the tower
        property bounds the expected sampler/verifier work by
        P(n,B(n))*q(lambda)*C(lambda), provided this conditional per-query bound
        holds uniformly after every adaptive transcript. The source theorem
        states only an expected polynomial and does not give a concrete P.
      not_obtained_from_mass: >-
        Pr_{D_ER}[E in G_lambda] >= 1-nu does not imply the universal
        quantifier, even when nu is negligible.

    pw_internal_query_distributions:
      source_definition: >-
        For an EndRing input E, RichO_k first samples a source-defined
        length-k 2-isogeny random walk phi:E->E' and then calls O(E'). Let
        Q_{E,k} denote that endpoint law. Algorithm 3 uses k1=O(log p) in its
        first loop and adaptive k2(N) values in its second loop; N depends on
        the current generated order and earlier oracle outputs. The second loop
        calls O_N(E'), which first calls O(E') and then applies Reduce_N.
      oracle_quantifier_in_source: >-
        Algorithm 1 requires O to solve OneEnd and line 3 receives a non-scalar
        endomorphism, not FAIL. Theorem 4.2 defines a normalized distribution
        F(E',beta)=Pr[O(E') mod N=beta] for each queried E'. Algorithm 3 and
        Theorem 7.2 therefore assume valid bounded responses throughout these
        query distributions.
      weaker_query_specific_condition_that_would_need_proof: >-
        For execution on every outer EndRing input, it could be enough to show,
        uniformly over every adaptive transcript and every Q_{E,k} used, that
        delta_E'>0 almost surely and E_{E'<-Q_{E,k}}[1/delta_E'] is polynomial,
        together with the same output relation, degree, representation, and
        canonical-transport bounds. A simpler sufficient condition is the
        every-input lower bound above. A merely high-mass Q-good set still
        permits nontermination on positive query mass; a capped FAIL oracle
        would require a new failure-aware reduction and probability analysis.
      comparison_with_frozen_law: >-
        D_ER is a fixed-start, fixed-length, nonbacktracking ell-isogeny endpoint
        law with erased state. Q_{E,k} is generated inside PW Algorithm 3 from
        the arbitrary EndRing input E, uses source-defined 2-isogeny walks, and
        has fixed and adaptive lengths. No equality, domination, statistical
        distance, or good-set transfer between these laws is supplied.
      conclusion: not_covered

    page_wesolowski_reduction:
      exact_direction:
        reduction_notation: EndRing <= OneEnd_B
        oracle_arrow: bounded OneEnd_B oracle -> EndRing solver
        reverse_direction: >-
          OneEnd <= EndRing is the separate obvious direction: a full
          EndRing basis can yield one non-scalar element. It is not Theorem 7.2.
      input_output_relation: >-
        On input a prime p and an arbitrary supersingular E/F_{p^2}, Algorithm
        3 outputs End(E); Problem 2.4 spells this out as four efficiently
        represented endomorphisms forming a Z-lattice basis of End(E).
      oracle_output_relation: >-
        Every oracle response is an efficiently represented element of
        End(E') minus Z with log2(deg(alpha)) <= B(log2 p).
      probability_and_runtime: >-
        Theorem 7.2 is a probabilistic expected-time oracle reduction,
        polynomial in log(p) and B(log(p)). In the proof the first loop reaches
        full rank after an expected O(1) iterations; second-loop progress has
        probability Omega((log N)^(-12)), and the number of progress events is
        polynomial in the logarithm of the intermediate index. The paper
        states that the construction makes polynomially many OneEnd instances;
        it gives no concrete end-to-end polynomial for sampler instantiation.
      degree_and_representation: >-
        If beta is an oracle answer and phi is a length-k 2-isogeny walk, then
        deg(phi_hat o beta o phi)=2^(2k)*deg(beta), so log degree increases by
        2k. The source proof includes this growth in its discriminant/index
        bound. Composition by the explicit walk and its dual preserves an
        efficient representation, and Reduce_N is polynomial-time on efficient
        representations. These facts do not relax the oracle's initial B bound.
      assumptions:
        - >-
          The proof invokes its p>3 mixing theorem; the frozen contract already
          requires p_lambda>3.
        - >-
          Oracle answers must be bounded by B(log p), efficiently represented,
          valid non-scalar endomorphisms on every call, and distributed as a
          normalized response law for each input curve.
        - >-
          The reduction is expected polynomial in the oracle model. Replacing
          the oracle by Samp requires charging Samp, verification, retries, and
          any canonicalization/transport as above.
        - >-
          No GRH or heuristic premise is stated in PW24-VOR Theorem 7.2 or its
          proof. The heuristic in the frozen 2026 Wesolowski paper belongs to a
          different p^(1/3+o(1)) OneEnd algorithm and is not used here.

  proves_too_much_control:
    id: PTM-J4-SINGLE-DISTRIBUTION-ORACLE
    known_false_conclusion: >-
      Success only on one declared endpoint distribution supplies every
      OneEnd query made by PW24-VOR Algorithm 3.
    test: >-
      Let a putative sampler have delta_E>=1/q on its D_ER-good set and
      delta_E=0 elsewhere, which the frozen high-mass contract permits. Run the
      proposed implication on an internal Q_{E,k} query. Because the premises
      contain no bound on Q_{E,k}(G_lambda), no conclusion excludes positive
      query mass outside G_lambda. On such a curve repeat-until-valid never
      terminates, while capped repetition returns FAIL.
    result: control_passes_argument_rejects_conclusion
    implication: >-
      Any proof that invokes Theorem 7.2 directly from D_ER mass has proved too
      much. It needs either universal coverage or an explicit bridge for every
      adaptive internal query law and a failure/expected-cost analysis.

