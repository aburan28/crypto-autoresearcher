schema: crypto.autoresearch.endring_public_noncentral_sampler_opening.v1
opening:
  task_id: TASK-20261009-1c8974
  batch_id: BATCH-12e6aa
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  opening_decision_id: DEC-20261009-00e7ac
  date: '2026-10-09'
  mode: goal
  kind: bounded_zero_run_source_theory
  selected_continuation: ENDRING-PUBLIC-NONCENTRAL-SAMPLER-FEASIBILITY
  objective: >-
    On one exact bare-E campaign distribution, type and source-check four
    materially distinct public noncentral-endomorphism sampler families, then
    independently determine whether a passing public sampler is itself a
    OneEnd/EndRing solver. Stop before public binding, complete-ring
    reconstruction, or any PKE wrapper.
  exact_distribution:
    parameter_family: >-
      Pi_lambda=(p_lambda,F_{p_lambda^2},E0_lambda,ell,L_lambda,Canon,A_eval),
      fixed before the sampled endpoint is seen.
    sampler: >-
      Starting at the public supersingular E0_lambda, choose an exact uniform
      nonbacktracking ell-isogeny edge at each of the declared L_lambda steps,
      retaining edge multiplicity under the frozen graph convention. Encode
      the endpoint with Canon and erase the walk, kernels, maps, orientation,
      ideals, torsion labels, and any endomorphism-ring witness.
    challenge_input: >-
      Pi_lambda and the canonical endpoint curve E only.
    status: >-
      Campaign-defined distribution inherited from the UTTK predecessor. A
      connection to a standard EndRing hardness distribution is open and must
      not be inferred from the definition.
  output_interface:
    algorithm: Samp(Pi_lambda,E;rho)
    output: FAIL or a canonical serialized efficient representation D_alpha
    semantics: alpha:E->E with alpha in End(E) minus Z
    evaluator: >-
      A_eval exposes validity, source and target curves, degree, and point
      evaluation in polynomial time. The source task must reconcile this with
      the exact primary definition of efficient representation.
    success: >-
      For explicit polynomial q and negligible nu,
      Pr_E[Pr_rho[Verify(E,D_alpha)=1] >= 1/q(lambda)] >= 1-nu(lambda).
      Bad-curve mass and per-curve coin failure are separate quantities.
    required_accounting:
      - exact unconditional law on serialized output bytes
      - canonical grammar versus semantic map equality
      - public non-scalarity certificate
      - runtime, memory, retry cap, aborts, and failure symbol
      - public-enumeration and conditional-min-entropy status
  quantifier_order:
    - Fix parameters, distribution, byte grammar, evaluator, route, and bounds.
    - Sample E from the exact endpoint distribution.
    - Give the algorithm only Pi_lambda, E, and independent coins rho.
    - Bound conditional success for each good E and then bad-instance mass.
    - Apply retries only after the two preceding bounds are established.
    - Quantify over every accepted descriptor for self-map and non-scalarity validity.
    - Apply the sampler-to-OneEnd implication only after the sampler contract is typed.
    - Apply a OneEnd-to-EndRing reduction only under its exact sourced assumptions and representation bounds.
  candidate_families:
    - id: F1-relative-frobenius
      producer_task: TASK-20261009-589f9d
      construction: >-
        Publicly construct a separable phi:E->E^(p), then compose with the
        relative Frobenius E^(p)->E. Audit the E/F_p easy locus separately and
        reject a coordinatewise p-power map with an unmatched codomain.
    - id: F2-exceptional-automorphism-transport
      producer_task: TASK-20261009-589f9d
      construction: >-
        Use a nontrivial automorphism directly at j=0 or 1728, or pull it back
        as dual(phi) o u o phi through a publicly found path. Charge exceptional
        support and public path finding separately.
    - id: F3-short-cycle
      producer_task: TASK-20261009-9fd740
      construction: >-
        Enumerate or sample bounded-length nonbacktracking small-degree cycles
        returning to E, compose normalized maps, and certify non-scalarity.
        Exact return probability replaces graph heuristics.
    - id: F4-bounded-map-search
      producer_task: TASK-20261009-9fd740
      construction: >-
        Sample a canonical bounded rational-map or interpolation descriptor,
        verify that it is a self-isogeny, and reject scalars. Charge the full
        coefficient-space acceptance and normalization cost.
  controls:
    - scalar multiplication maps [a]
    - immediate dual backtracks dual(phi) o phi=[deg(phi)]
    - the applicable central p^2-Frobenius slice
    - p-Frobenius with codomain E^(p) distinct from E
    - an explicit exceptional automorphism as a positive typing control
    - leaked walk, orientation, ideal, tag, torsion labels, or complete basis
    - conditioning on exceptional or prime-field loci
    - a polynomially enumerable proper witness family
    - distinct program serializations of one semantic map
  proof_search_map:
    P0: exact challenge distribution and representation grammar
    P1: public-only dependency and auxiliary-data audit
    P2: source/target typing and canonical serialization
    P3: exact public non-scalarity certificate
    P4: polynomial runtime, law, success, retries, and bad-instance mass
    P5: Samp-to-OneEnd construction and probability accounting
    P6: exact sourced OneEnd-to-EndRing reduction and conditions
    P7: proper-family enumeration and support audit
    P8: method ceiling before binding, reconstruction, message recovery, or PKE
  source_requirements:
    mandatory:
      - >-
        Page-Wesolowski ePrint 2023/1399 full primary text: problem definitions,
        bounded output, efficient representation, reduction direction,
        success quantifiers, runtime, distribution scope, and assumptions.
      - >-
        Frozen Wesolowski 2026 text: Definition 2.1, Problems 2.2--2.4,
        conjugate/Frobenius route, and the exact equivalence statement.
      - >-
        Primary statements supporting relative Frobenius typing, exceptional
        automorphism loci, normalized isogeny composition, and cycle encodings.
    conditional:
      - HLMW or other unconditional-equivalence sources only if invoked.
    provenance_gate: >-
      Record source bytes/hash, version, pages or sections read, retrieval
      route, and exact supported statement. A repository summary remains a
      pointer. Retrieval failure yields inconclusive, never negative evidence.
  task_graph:
    queue_path: coordination/goals/GOAL-SSI-2fa82a/batches/BATCH-12e6aa/dispatch_queue.json
    max_concurrent: 2
    initial_ready: [TASK-20261009-daf6ab]
    optional_correction_reserved_not_queued: TASK-20261009-1f7c04
    closing_records: [EV-SSI-65dc17, DEC-20261009-e8b142]
  budgets:
    scientific_runs: 0
    implementation_runs: 0
    formalizer_runs: 0
    experiment_runs: 0
    benchmark_runs: 0
    parameter_selection_runs: 0
    maximum_memory_gb: 4
    maximum_concurrent_tasks: 2
  completion_gates:
    - source ledger and exact distribution/representation contract archived
    - four typed family packets frozen before review
    - each scientific joint J1--J5 has exactly one owner and one verdict
    - J4 is blindly re-derived from the frozen contract and primary sources
    - candidate-specific independence checks pass
    - composition records the earliest failed arrow per family without voting
    - source-linked report, editable diagram, SVG, inspected PDF, and J6 documentation gate complete
    - EV-SSI-65dc17, DEC-20261009-e8b142, checkpoint, and additive goal-head update pass archive verification
  stop_rule: >-
    One initial evaluation and at most one single-gap correction using reserved
    TASK-20261009-1f7c04. The correction is admitted only if it can change one
    disposition without changing D_ER or adding auxiliary data. Stop after its
    scoped re-review or skip it when no such repair exists.
  claim_boundary: >-
    No PKE, security theorem, novelty claim, parameter claim, hard-problem
    break, universal impossibility result, or complete-ring reconstruction is
    established by opening or by an unreviewed task artifact.
  exactly_one_next_action:
    task_id: TASK-20261009-daf6ab
    owner: source_researcher
    action: Complete and archive the primary-source and exact-distribution packet.
