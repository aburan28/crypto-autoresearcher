schema: crypto.autoresearch.review_plan.v1
review_plan:
  id: RP-BATCH-12e6aa
  batch_id: BATCH-12e6aa
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  frozen_by_decision: DEC-20261009-00e7ac
  frozen_at: '2026-10-09'
  subject: public_noncentral_endomorphism_sampler_feasibility
  prior: >-
    The Coordinator expects every frozen family to fail at distribution mass,
    public-only construction, exact success/runtime, or to become a OneEnd
    solver. A source-supported general sampler would overturn the family-level
    prior but would be routed as a hard-problem algorithm, not as a PKE public
    interface.
  verdict_vocabulary: [holds, breaks, inconclusive]
  composition_rule: >-
    Copy each owner's joint verdict and scoped rationale. Do not vote, average,
    or let a reviewer opine on unowned joints. Candidate dispositions follow
    the earliest broken arrow; inconclusive remains inconclusive.
  joints:
    - id: J1
      title: exact distribution and source contract
      owner_task_id: TASK-20261009-8182ff
      owner_role: validator
      question: >-
        Is the endpoint law exact, efficiently specified, bare-E only, and
        honestly separated from any standard EndRing distribution claim?
      worked_attack: >-
        Trace every input to the challenge and sampler; reinsert the erased
        walk, orientation, ideal, torsion labels, and basis one at a time;
        condition on easy loci; then compare every invoked equivalence theorem
        against the pages, assumptions, representation, and quantifiers read.
      breaking_artifact: >-
        An undeclared correlated input, distribution conditioning, noncanonical
        challenge encoding, or source claim that does not cover the frozen law.
      controls:
        - identity use of the frozen campaign distribution without an asserted hardness bridge
        - exceptional-locus conditioning labeled as a changed distribution
      blind_from:
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-b3e555/review.yaml
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-38456a/review.yaml
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-8a1dc4/review.yaml
    - id: J2
      title: self-map typing, serialization, and non-scalarity
      owner_task_id: TASK-20261009-b3e555
      owner_role: reviewer
      question: >-
        Does each accepted descriptor encode an evaluable endomorphism E->E,
        and is alpha not in Z certified without an EndRing oracle?
      worked_attack: >-
        Apply the p-Frobenius codomain mismatch, scalar maps, dual backtracks,
        central q-Frobenius where applicable, automorphism conjugation, and two
        syntactic encodings of one map. Re-derive source/target and degree for
        every composition in all four families.
      breaking_artifact: >-
        A map with target E^(p) rather than E, a scalar accepted as noncentral,
        ambiguous semantic parsing, or a non-scalarity test requiring the
        unknown complete ring.
      controls:
        - explicit nontrivial exceptional automorphism must type-check
        - scalar and immediate backtrack must fail noncentrality
      blind_from:
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-8182ff/review.yaml
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-38456a/review.yaml
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-8a1dc4/review.yaml
    - id: J3
      title: exact success, retries, and polynomial cost
      owner_task_id: TASK-20261009-38456a
      owner_role: red_team
      question: >-
        Is conditional success inverse-polynomial outside an explicitly bounded
        bad set, with an exact output law and polynomial total cost?
      worked_attack: >-
        Separate average from per-curve success, expose rare F_p and exceptional
        loci, replace return-probability heuristics by their missing theorem,
        charge enumeration and normalization, and calculate the capped retry
        failure from the stated q(lambda) rather than an assumed density.
      breaking_artifact: >-
        Negligible useful-locus mass, unbounded or hidden retries, heuristic-only
        cycle return, exponential coefficient search, or omitted output cost.
      controls:
        - deterministic exceptional map on an exceptional curve does not establish mass under D_ER
        - a public failure symbol is charged, not silently retried
      blind_from:
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-8182ff/review.yaml
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-b3e555/review.yaml
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-8a1dc4/review.yaml
    - id: J4
      title: sampler-to-OneEnd-to-EndRing implication
      owner_task_id: TASK-20261009-8a1dc4
      owner_role: reviewer_blind_rederivation
      question: >-
        Does any sampler satisfying the frozen interface yield a correctly
        quantified OneEnd solver, and does a primary-source polynomial
        reduction carry that solver to the exact EndRing output relation?
      worked_attack: >-
        Starting only from the opening contract and primary sources, construct
        the solver, compute its probability and runtime, audit degree/output
        representation bounds, and attempt the cited OneEnd-to-EndRing
        reduction. Keep worst-case, per-instance, and distributional games
        separate.
      breaking_artifact: >-
        A reversed reduction, an uncovered distribution, an output-degree or
        representation precondition, a hidden GRH/heuristic premise, or an
        invalid amplification across different E instances.
      blind_rederivation:
        quantity: >-
          Exact success and runtime of Samp-to-OneEnd, followed by the sourced
          loss and runtime of OneEnd-to-EndRing.
        allowed_inputs:
          - ledger/decisions/DEC-20261009-00e7ac.yaml
          - coordination/design/TASK-20261009-1c8974/opening.yaml
          - research/ssi-endring-pke/2026-10-09-public-noncentral-sampler/methodology.md
          - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-daf6ab/source-ledger.yaml
          - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-daf6ab/distribution-contract.yaml
          - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
          - retrieved primary source bytes listed in source-ledger.yaml
        blind_from:
          - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-589f9d/family-a.yaml
          - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-589f9d/report.md
          - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-9fd740/family-b.yaml
          - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-9fd740/report.md
          - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-8182ff/review.yaml
          - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-b3e555/review.yaml
          - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-38456a/review.yaml
          - coordination/design/TASK-20261009-1c8974/composition/TASK-20261009-44fe0f/final-composition.yaml
    - id: J5
      title: support, public enumeration, and auxiliary-data collapse
      owner_task_id: TASK-20261009-38456a
      owner_role: red_team
      question: >-
        Does the output law avoid an explicitly polynomially enumerable proper
        witness family and all hidden or secret-correlated auxiliary data?
      worked_attack: >-
        Build public lists for scalars, immediate backtracks, exceptional maps,
        bounded cycles, and bounded descriptor spaces; then substitute a leaked
        path, orientation, ideal, tag, torsion basis, or full ring and identify
        exactly where the claimed bare-E route changes problems.
      breaking_artifact: >-
        Complete polynomial enumeration of the honest support, a proper-family
        factorization, or any auxiliary field not sampled from bare E.
      controls:
        - public scalar list
        - leaked-witness sampler that must be labeled augmented
        - unsupported absence of an enumerator remains inconclusive
      blind_from:
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-8182ff/review.yaml
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-b3e555/review.yaml
        - coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-8a1dc4/review.yaml
    - id: J6
      title: documentation, sources, controls, and claim boundary
      owner_task_id: TASK-20261009-300e8e
      owner_role: reviewer_documentation
      question: >-
        Do report, diagram source, SVG, PDF, source ledger, joint matrix, run
        accounting, and no-claim language agree exactly?
      worked_attack: >-
        Trace every report claim to a frozen task or primary source, compare all
        joint labels across formats, inspect every rendered page and the SVG,
        search for PKE/security/impossibility overclaims, and verify zero-run
        accounting and the exactly-one-next-action field.
      breaking_artifact: >-
        Unsupported source language, a diagram/prose verdict mismatch,
        illegible or stale rendering, absent negative finding, or claim scope
        broader than the reviewed joints.
      blindness:
        reads_after_report: true
        not_a_vote_on_scientific_composition: true
  review_execution:
    producer_snapshot_task_id: TASK-20261009-e7a4c3
    scientific_review_tasks:
      - TASK-20261009-8182ff
      - TASK-20261009-b3e555
      - TASK-20261009-38456a
      - TASK-20261009-8a1dc4
    composition_task_id: TASK-20261009-44fe0f
    documentation_task_id: TASK-20261009-300e8e
    independence_check: >-
      Run the repository review-independence checker on the frozen batch before
      treating J1--J5 as complete. Record every procedural departure.
  blind_rederivation:
    J1:
      quantity: Exact endpoint law, good-curve mass quantifier, and source coverage.
      assigned_to: TASK-20261009-8182ff
      blind_from: [peer reviews, composition]
    J2:
      quantity: Source/target, degree, field of definition, normalization, and public non-scalarity for every composed map.
      assigned_to: TASK-20261009-b3e555
      blind_from: [peer reviews, composition]
    J3:
      quantity: Conditional success, bad-instance mass, retry failure, and charged polynomial cost.
      assigned_to: TASK-20261009-38456a
      blind_from: [peer reviews, composition]
    J4:
      quantity: Sampler-to-OneEnd success/runtime and exact Page--Wesolowski reduction coverage.
      assigned_to: TASK-20261009-8a1dc4
      blind_from: [producer conclusions, peer reviews, composition]
    J5:
      quantity: Public support enumeration, auxiliary-data dependency, and byte/semantic multiplicity.
      assigned_to: TASK-20261009-38456a
      blind_from: [peer reviews, composition]
  proves_too_much:
    objects:
      - id: PTM-J1-CONDITIONED-LOCUS
        known_false_conclusion: A distribution conditioned on an exceptional or prime-field endpoint is identical to unconditioned D_ER.
        owner_task_id: TASK-20261009-8182ff
      - id: PTM-J2-SCALAR-AND-WRONG-CODOMAIN
        known_false_conclusion: A scalar/backtrack or E-to-E^(p) map is a certified non-scalar E-to-E endomorphism.
        owner_task_id: TASK-20261009-b3e555
      - id: PTM-J3-DETERMINISTIC-EASY-POINT
        known_false_conclusion: Deterministic success on one public easy endpoint proves high D_ER good-set mass.
        owner_task_id: TASK-20261009-38456a
      - id: PTM-J4-SINGLE-DISTRIBUTION-ORACLE
        known_false_conclusion: Success only on one declared endpoint distribution supplies every OneEnd query made by PW24 Algorithm 3.
        owner_task_id: TASK-20261009-8a1dc4
      - id: PTM-J5-SINGLETON-HIDDEN-SUPPORT
        known_false_conclusion: A publicly enumerable singleton output family has unproved positive conditional min-entropy.
        owner_task_id: TASK-20261009-38456a
  transfer_assessment_extension:
    trigger: >-
      origin/main added the repository transfer assessment skill after this
      plan was initially frozen but before any scientific reviewer ran.
    owner_task_id: TASK-20261009-b3e555
    companion_artifact: coordination/design/TASK-20261009-1c8974/reviews/TASK-20261009-b3e555/transfer-assessment.json
    template: .claude/skills/transfer/assets/assessment-template.json
    required_for_each_composed_route:
      - exact source, destination, fields, dimensions, and representation
      - existence versus executable public construction
      - map correctness, kernel/exceptional cases, normalization, and field of definition
      - subgroup preservation or a justified not_applicable disposition
      - construction, transfer, verification, retry, duplicate, memory, and recovery costs
      - weakest open obligation and exploration boundary
    authority: companion draft only; not a ledger record or mathematical certificate
  procedure_deviations:
    - >-
      Before review dispatch and without changing producer bytes, ownership,
      candidate families, or verdict vocabulary, the Coordinator added the
      transfer companion artifact plus explicit blind-rederivation and
      proves-too-much controls required by the newly merged upstream AGENTS
      contract. This is a stricter review gate, not a scientific repair.
  optional_correction:
    reserved_task_id: TASK-20261009-1f7c04
    queued: false
    admission: >-
      One missing source or typing repair can change one family disposition
      without changing D_ER or adding auxiliary data.
    maximum_count: 1
    review_rule: Re-review only the affected joint with the same owner and controls.
  closure_gate: >-
    Scientific composition waits for J1--J5. Ledger closure waits additionally
    for the J6 documentation gate. No adverse family verdict generalizes to all
    public samplers or all EndRing PKE.
