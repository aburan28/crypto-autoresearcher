    inspected_extent:
      - Sections 1.4 and 2.1--2.3, including Definition 2.1 and Problems 2.2--2.4
      - Algorithm 2 line 6 and its representation note
      - Algorithm 3 and the proof of Theorem 1.1
    supported_statements:
      - >-
        The frozen Definition 2.1 strengthens an evaluator with validity,
        source/target curves, degree, and point-evaluation modes and requires a
        polynomial-size descriptor.
      - >-
        The relative Frobenius has type E^(p)->E^(p^2)=E for E/F_{p^2}; if a
        separable phi:E->E^(p) is supplied, Frob_p composed after phi is an
        endomorphism of E with inseparable degree p and hence is non-scalar.
      - >-
        A raw p-power map starting at E has target E^(p), not E in general.
      - >-
        Isogenies may be represented by rational maps, composable paths, or
        interpolation data; the source explicitly describes converting a final
        path with Velu maps and interpolation.
      - >-
        The dual identity phi_hat composed with phi=[deg(phi)] supports the
        scalar immediate-backtrack negative control.
      - >-
        Problems 2.2--2.4 respectively define OneEnd, EndRing, and Isogeny for
        supersingular curves over F_{p^2}; the paper reports their probabilistic
        polynomial equivalence by citation, while PW24-VOR is the relied-on
        primary reduction for this packet.
    unsupported_or_not_transferred:
      - >-
        Theorem 1.1 and Corollary 1.2 in this source depend on Heuristic 1.
        This packet uses their algebraic typing statements, not their attack
        complexity or success claims.
      - The source does not identify the campaign endpoint law as a standard EndRing distribution.

