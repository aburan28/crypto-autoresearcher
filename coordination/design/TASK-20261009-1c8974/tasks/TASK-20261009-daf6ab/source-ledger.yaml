      external_pdf_recorded_sha256: ccc85233147b4de39f093b70c6c29864ff13e9d1becb5f1f1b4c81416b73d3d7
      provenance_note: >-
        The repository source record says the transcript was supplied verbatim
        on 2026-07-24. Its later external fidelity check covered only ten
        Section 4.1 cost values, not the whole transcript; this task therefore
        cites exact transcript extents and does not claim a full PDF/transcript
