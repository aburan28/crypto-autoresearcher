    supported_statements:
      - >-
        Coordinatewise q-power is the Frobenius endomorphism only when the
        curve is defined over F_q; the p-power map on an F_{p^2}-model with
        non-F_p coefficients lands on the coefficient-conjugate curve.
      - >-
        A finite subgroup determines a separable quotient isogeny; explicit
        Velu formulas give a rational-map evaluator for a supplied kernel.
      - >-
        The dual identities and reversal of composition are valid, supporting
        typed composition and immediate-backtrack controls.
    unsupported_or_not_transferred:
