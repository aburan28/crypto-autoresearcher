    inspected_extent:
      - version-of-record pp. 388--395: abstract, Theorem 1.1, direction note, elliptic-curve preliminaries, Definition 2.1, Problems 2.4--2.5, and bounded OneEnd_lambda
      - version-of-record pp. 408--410: Algorithm 3, Lemma 7.1, and Theorem 7.2 with its cost and probability analysis
      - version-of-record p. 417: bibliographic identity of ePrint 2023/1399 and cited algebra sources
      - arXiv v2 pp. 1--8 and 34--37: corresponding extended text, checked for numbering and wording only
    supported_statements:
      - >-
        Definition 2.1: an efficient representation D_phi has size polynomial
        in log(deg(phi)) and log(q), and evaluates on E(F_{q^k}) in time
        polynomial in log(deg(phi)), log(q), and k.
      - >-
        Problem 2.4 EndRing asks for four efficiently represented
        endomorphisms forming a lattice basis of End(E); Problem 2.5 OneEnd
        asks for one efficiently represented element of End(E) minus Z.
      - >-
        OneEnd_lambda additionally requires log(deg(alpha)) <=
        lambda(log(p)).
      - >-
        Theorem 7.2 is EndRing <= OneEnd_lambda: Algorithm 3, using a bounded
        OneEnd oracle, has expected running time polynomial in log(p) and
        lambda(log(p)). The introduction says it transforms one EndRing
        instance into polynomially many OneEnd instances.
      - >-
        The reverse problem reduction OneEnd <= EndRing is called obvious in
        the introduction. In algorithmic prose this means a full EndRing basis
        can be used to output a non-scalar endomorphism; it must not be
        confused with Theorem 7.2.
      - >-
        For characteristic different from 2 and 3, all but two geometric
        isomorphism classes have Aut(E)={+1,-1}; the two exceptional classes
        have automorphism-group sizes 6 and 4.
      - >-
        An isogeny phi:E->E' has a dual phi_hat:E'->E satisfying both
        compositions equal multiplication by deg(phi), supporting the
        immediate-backtrack scalar control.
    unsupported_or_not_transferred:
      - >-
        The theorem does not state a reduction from a solver that succeeds
        only on a 1-negligible fraction of an arbitrary campaign endpoint
        distribution. Algorithm 3 queries the OneEnd oracle on curves reached
        inside its own randomisation.
      - >-
        The source's Definition 2.1 alone does not provide the campaign's
        validity, source/target, degree, canonical-serialization, or public
        non-scalarity checks; those are deliberate strengthening fields below.
      - No PKE security, public-key binding, or standard hardness distribution is established.

