      - It does not establish a public sampler or any success probability.

derived_algebra_checks:
  status: derived_in_packet_not_quoted_theorems
  checks:
    - >-
      For p>3, the j=1728 model y^2=x^3+A*x has the explicit automorphism
      (x,y)->(-x,i*y) when i^2=-1; the j=0 model y^2=x^3+B has
      (x,y)->(zeta*x,y) when zeta^3=1 and zeta!=1. Direct substitution checks
      the equations. F_{p^2} contains the required roots. Combined with
      PW24-VOR's exactly-two-exceptional-classes statement, these are the two
      positive exceptional controls; this packet does not use them to assert
      non-negligible mass under D_ER.
    - >-
      The campaign normalization below is a deterministic syntax convention:
      a supplied quotient map is followed by the explicit isomorphism to the
      canonical target model. It is not claimed to make the semantic map have
      a unique program representation.

claim_boundary:
  verified: primary source identities and exact reduction statement listed above
  derived: explicit exceptional-model substitutions and campaign grammar consequences
  open:
