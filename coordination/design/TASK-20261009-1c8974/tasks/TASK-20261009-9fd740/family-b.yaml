frozen_input_and_output:
  challenge_law: >-
    E is sampled exactly from D_ER(lambda), the canonical endpoint-byte law of
    the declared L_lambda-step nonbacktracking ell-isogeny walk from E0_lambda,
    with kernel-line/path multiplicity retained and all walk state erased.
  candidate_input: (Pi_lambda,E) and independent coins only
  forbidden_auxiliary_data:
    - endpoint-generating path or its coins
    - incoming-edge marker
    - orientation, ideal, tag, or hidden curve label
    - torsion labels, torsion basis, or complete endomorphism basis
    - OneEnd or EndRing oracle or endpoint-dependent preprocessing
  result: FAIL encoded by exactly 0x00, or one canonical DER-ENDO-v1 byte string
  verifier: A_eval from Pi_lambda

families:
  - id: F3-short-cycle
    title: Public enumeration of bounded odd nonbacktracking cycles
    disposition: scoped_typed_obstruction
    earliest_failed_arrow: P4
    scope_of_disposition: >-
      The route below is typed and its probabilities are exact, but the frozen
      packet contains neither a negligible D_ER bound for endpoints without a
      qualifying odd cycle nor a complete polynomial bit-cost theorem for the
      public geometric-kernel-line enumerator. This is not a nonexistence claim
      about longer cycles, even cycles with another certificate, or other
      sampler families.

    fixed_before_endpoint:
      B_3: >-
        A positive odd-integer bound B_3(lambda), fixed as part of the route.
        It is admissible only when W_3(lambda) below is polynomial in lambda.
        A fixed odd constant is one admissible specialization when ell is
        polynomially bounded.
      searched_lengths: 'D_3(lambda)={d: 1<=d<=B_3(lambda) and d is odd}'
      path_count: >-
        W_3(lambda)=(ell+1)*sum_{d in D_3(lambda)} ell^(d-1).
        This is exact under the frozen directed-kernel-line convention: ell+1
        choices at the first step and ell after excluding exactly the incoming
        dual at every later step.
      degree_bound: deg(alpha)=ell^d for d in D_3(lambda)
      bounded_oneend_polynomial: >-
        Declare a fixed polynomial Lambda_PW,3(n) satisfying
        B_3(lambda)*ceil(log2(ell)) <= Lambda_PW,3(n_lambda). Promotion of the
        route requires the concrete parameter family to exhibit this bound.
      coins: R_3(lambda)=0

    public_enumerator:
      domain: >-
        For every d in increasing order, enumerate every length-d word of the
        frozen geometric ell-kernel lines from E. At each vertex, order lines
        by the canonical bytes of their public Norm/Canon step description and
        omit exactly the transported dual of the previous line. Use a
        canonical monic kernel polynomial or other public line representation
        produced from the curve; never accept a supplied torsion label or
        basis. Order words by (d, concatenated step bytes).
      public_primitive_obligation: F3-PUBLIC-LINE-ENUM
      obligation_statement: >-
        Give a deterministic polynomial-bit-cost procedure that enumerates
        exactly the ell+1 geometric kernel lines required by the frozen graph,
        constructs their Norm/Canon VELU_STEP bytes, identifies the transported
        incoming dual, and uses no hidden torsion basis. The packet defines the
        finite set and normalization but does not provide this full complexity
        theorem.
      candidate_algorithm:
        - Start only from the supplied canonical E; do not use the erased challenge walk.
        - Enumerate the preceding domain depth-first.
        - For each word, compose its normalized VELU_STEP nodes in traversal order.
        - Discard it unless the final canonical target bytes equal the input E.
        - >-
          Attach DEGREE_NOT_SQUARE with declared degree ell^d, construct the
          canonical DER-ENDO-v1 DAG, and run A_eval.validity.
        - Return the lexicographically first valid descriptor; return 0x00 if none exists.

    typing_and_certificate:
      source_target: >-
        Each adjacent target/source byte string is checked. Closure is equality
        of the final canonical target bytes with E, so every returned root has
        type E->E.
      certificate: DEGREE_NOT_SQUARE
      derivation: >-
        Every step is separable of prime degree ell, hence a length-d
        composition has total degree ell^d. Because d is odd, ell^d is not an
        integer square. A scalar [a] has degree a^2, so an accepted descriptor
        is non-scalar.
      semantic_caveat: >-
        Nonbacktracking alone is not used as a non-scalarity proof. Longer
        relations can denote scalars; only the verified non-square degree
        certificate is relied upon.

    exact_law:
      definitions:
        Z_3_E: >-
          The subset of the W_3(lambda) enumerated words whose normalized final
          target bytes equal E and whose compiled descriptor passes A_eval.
        d_3_E: the lexicographically first descriptor induced by Z_3_E, if nonempty
      uniform_word_return_probability: Pr[return to E and verify | E]=|Z_3_E|/W_3(lambda)
      enumerator_byte_law:
        success: Pr[Samp_3=d_3_E | E]=1 when Z_3_E is nonempty
        failure: Pr[Samp_3=0x00 | E]=1 when Z_3_E is empty
        all_other_bytes: probability 0
      enumerator_semantic_law: >-
        Conditional on Z_3_E being nonempty, probability one is placed on the
        semantic map denoted by d_3_E. Distinct cycle programs may denote the
        same map; the lexicographic byte rule fixes the returned syntax without
        asserting semantic uniqueness.
      unconditional_byte_law: >-
        For bytes d, Pr[Samp_3=d]=sum_e D_ER(lambda)(e)*1[d=d_3_e and
        Z_3_e nonempty]. Failure mass is
        sum_e D_ER(lambda)(e)*1[Z_3_e empty]. Endpoint multiplicities remain
        exactly those of D_ER.

    success_quantifiers:
      q_3: q_3(lambda)=1
      good_set: 'G_3(lambda)={E: Z_3_E is nonempty}'
      nu_3_exact: nu_3(lambda)=Pr_(E<-D_ER(lambda))[Z_3_E is empty]
      required_but_unproved: nu_3(lambda) is negligible
      named_missing_theorem:
        id: F3-ODD-CYCLE-MASS
        statement: >-
          For the exact D_ER endpoint law and the fixed admissible B_3, the
          probability that E has no publicly encodable odd nonbacktracking
          ell-cycle of searched length is negligible.
        source_status: not supplied by the frozen sources
        forbidden_substitute: random-regular-graph intuition, density guesses, or an unproved mixing claim
      retry_accounting: >-
        Samp_3 is deterministic and succeeds on every E in G_3 in one call, so
        the tight route-specific retry cap is one and conditional failure is
        zero. Repeating on E outside G_3 never helps and must not be described
        as resampling E. The generic frozen cap with q_3=1 is valid but
        redundant on G_3.

    cost_accounting:
      C_line: worst-case bit cost of F3-PUBLIC-LINE-ENUM for one expanded vertex
      C_step: worst-case bit cost of Norm, Canon, and one VELU_STEP serialization
      C_verify: worst-case A_eval cost for a descriptor of at most B_3 steps
      time_bound: >-
        T_3(lambda) <= (1+B_3*W_3)*C_line +
        B_3*W_3*C_step + W_3*C_verify, up to fixed loop and comparison costs.
        This is polynomial only after W_3, C_line, C_step, and C_verify receive
        polynomial bit bounds.
      memory_bound: >-
        Depth-first enumeration uses M_3(lambda) <=
        B_3*(one curve, incoming marker, and one step descriptor) plus one
        candidate DER descriptor and A_eval workspace; it need not retain all
        W_3 words.
      aborts:
        - public line enumeration or normalization failure maps to 0x00
        - no closed accepted word maps to 0x00
        - malformed or noncanonical compiled syntax maps to 0x00
      no_omitted_costs:
        - geometric line enumeration and exact ordering
        - dual-marker transport
        - Norm and Canon isomorphism bytes
        - composition, serialization, and A_eval
        - traversal of unsuccessful and duplicate-semantic words

    support_and_enumeration:
      candidate_word_family_size: W_3(lambda)
      family_status: publicly enumerable proper bounded-cycle family, conditional on F3-PUBLIC-LINE-ENUM
      returned_byte_support_per_E: at most one non-FAIL byte string
      returned_semantic_support_per_E: at most one map
      conditional_min_entropy: 0 bits on successful output
      consequence: >-
        The route openly exposes a polynomial witness enumeration whenever its
        admissibility condition holds. This does not falsify the sampler
        relation, but it cannot be presented as hidden or high-entropy support.

    frozen_controls:
      scalar_multiplication: >-
        A scalar has square degree and fails DEGREE_NOT_SQUARE; a MUL root is
        also rejected by the frozen verifier.
      immediate_dual_backtrack: >-
        Excluded from the word domain. If inserted, the two-step composition is
        [ell], has square degree ell^2, and is not accepted as non-scalar.
      central_p2_frobenius: >-
        The route contains only separable prime-to-p ell-isogenies. The supplied
        scalar p^2-Frobenius control has no valid non-scalarity certificate and
        is rejected.
      unmatched_p_frobenius: >-
        The route emits no REL_FROB_P node. A supplied E->E^(p) map with
        E^(p) distinct from E fails root self-map typing.
      exceptional_automorphism_positive: >-
        A supplied explicit j=0 or j=1728 automorphism is accepted by A_eval
        with DEGREE_ONE_NOT_PM_ONE. It is outside this ell-cycle output domain
        and gives no D_ER cycle-mass bound.
      leaked_witness_data: >-
        The algorithm is unchanged when the endpoint-generating walk,
        orientation, ideal, tag, torsion labels, and bases remain erased. A
        variant consuming any of them is rejected as an augmented problem.
      distribution_conditioning: >-
        G_3 and nu_3 are measured under unconditioned D_ER; no exceptional,
        prime-field, or cycle-conditioned endpoint law is substituted.
      proper_witness_enumeration: >-
        The full bounded route is deliberately enumerated and its W_3 cost is
        charged. Its public enumerability and zero output entropy are recorded.
      duplicate_programs_one_map: >-
        Words are ordered and the first accepted DER bytes are returned.
        Semantic collisions remain possible and are not counted as distinct
        maps in the semantic law.

    proof_search:
      P0: pass_exact_D_ER_domain_DER_grammar_and_byte_law_frozen
      P1: pass_dependency_syntax_public_only; public_enumerator_cost_obligation_carried_to_P4
      P2: pass_for_every_returned_descriptor_by_normalized_step_typing_and_A_eval
      P3: pass_for_every_returned_descriptor_by_DEGREE_NOT_SQUARE
      P4: >-
        fail_open: F3-ODD-CYCLE-MASS is missing, and F3-PUBLIC-LINE-ENUM lacks
        a source-backed polynomial bit-cost theorem. No inverse-polynomial
        high-mass route is established.
      P5: >-
        conditional pass: any returned descriptor is a bounded OneEnd answer
        for that same E; q_3=1 gives one-call Las Vegas success on G_3 only.
      P6: >-
        open and not reached: D_ER high-mass coverage does not cover every
        OneEnd oracle query in PW24-VOR Theorem 7.2.
      P7: pass_audit; bounded family is publicly polynomially enumerable only under the explicit admissibility and enumerator obligations
      P8: pass_boundary; analysis stops before binding, ring reconstruction, recovery, or PKE

  - id: F4-bounded-map-search
    title: Uniform bounded raw rational-map and interpolation-transcript search
    disposition: scoped_typed_obstruction
    earliest_failed_arrow: P4
    scope_of_disposition: >-
      A fixed raw-bit search has an exact rejection and output law and returns
      only publicly verified non-scalar self-maps. The frozen packet provides
      no inverse-polynomial lower bound on the valid preimage density for
      1-negligible D_ER mass. This is an obstruction to this declared bounded
      search contract, not a claim that no structured map constructor exists.

    fixed_before_endpoint:
      n: n_lambda=ceil(log2(p_lambda))
      constants: fixed positive integers c_S, c_D, and c_q
      byte_budget: S_4(lambda)=n_lambda^c_S
      degree_budget: D_4(lambda)=min(p_lambda-1,n_lambda^c_D)
      length_bits: b_4(lambda)=ceil(log2(S_4(lambda)+1))
      coins: R_4(lambda)=1+b_4(lambda)+8*S_4(lambda)
      raw_domain: U_4(lambda)={0,1}^R_4(lambda)
      raw_domain_size: 2^R_4(lambda)
      q_4: q_4(lambda)=lambda^c_q
      bounded_oneend_polynomial: Lambda_PW,4(n)=n^c_D

    raw_coin_parsing:
      common: >-
        Parse one mode bit, then b_4 bits as an unsigned payload length s, then
        S_4 bytes. Reject if s>S_4 or if any byte after the first s payload
        bytes is nonzero. Thus every (mode,s,payload) has one raw-coin preimage;
        all malformed length/padding strings remain charged as failures.
      rational_map_mode: >-
        Treat the payload as candidate DER-ENDO-v1 bytes. Require exactly one
        used EXPLICIT_MAP node, root source and target equal to E, verified
        degree between 1 and D_4, no forbidden syntax, and one of the frozen
        public non-scalarity certificates. Require the coefficient tuples to
        arrive already in canonical reduced form; reject rather than silently
        normalize them. Run A_eval and output the payload iff it accepts.
      interpolation_mode: >-
        Parse the payload as version I1, a canonical degree delta in [1,D_4],
        a canonical count m, and m distinct canonical projective point pairs
        (P_i,Q_i) on E, with no trailing bytes. Use the fixed lexicographic
        monomial basis through degree delta and deterministic reduced-row-
        echelon pivots to solve for projective coordinate functions. Reject
        unless the system has one normalized reduced solution. Compile that
        solution to a one-node EXPLICIT_MAP descriptor with source and target
        E. Attach the first applicable certificate in the fixed order
        INSEP_NOT_SQUARE, DEGREE_NOT_SQUARE, DEGREE_ONE_NOT_PM_ONE; reject if
        none applies. Output only if the global A_eval checks accept. The
        transcript is generation data, not a new DER opcode.
      algorithm: >-
        On input (Pi_lambda,E;rho), apply the parser for rho's selected mode.
        Return the accepted canonical descriptor or exactly 0x00. No candidate
        is accepted from agreement on sampled points alone: A_eval must verify
        the resulting global rational-map identity, degree, typing, and public
        non-scalarity certificate.

    public_dependency_and_typing:
      dependency: >-
        All coefficient bytes and interpolation points come from independent
        rho and are checked against public E. No path, orientation, ideal,
        torsion label, torsion basis, or ring basis is an input.
      self_map_rule: Every returned root has source bytes E and target bytes E, verified by A_eval.
      non_scalarity_rule: >-
        Every return carries one of INSEP_NOT_SQUARE, DEGREE_NOT_SQUARE,
        DEGREE_ONE_NOT_PM_ONE, or NONZERO_DISCRIMINANT, and A_eval verifies its
        rule. Search-space membership without a valid certificate never
        establishes non-scalarity.
      semantic_uniqueness: not assumed

    exact_law:
      definitions:
        m_4_E_d: >-
          The exact number of rho in U_4(lambda) that cause the deterministic
          parser/compiler/verifier to return byte string d on E.
        A_4_E: sum_d m_4_E_d over non-FAIL canonical descriptors d
        a_4_E: A_4_E/2^R_4(lambda)
        m_4_E_alpha: >-
          sum of m_4_E_d over all returned descriptor bytes d denoting semantic
          map alpha
      one_call_byte_law:
        success: Pr[Samp_4=d | E]=m_4_E_d/2^R_4(lambda)
        failure: Pr[Samp_4=0x00 | E]=1-A_4_E/2^R_4(lambda)
      one_call_semantic_law: Pr[[Samp_4]=alpha | E]=m_4_E_alpha/2^R_4(lambda)
      unconditional_byte_law: >-
        Pr[Samp_4=d]=sum_e D_ER(lambda)(e)*m_4_e_d/2^R_4(lambda), and
        failure is the corresponding D_ER average of 1-a_4_e. This is an exact
        identity, not an average-to-per-curve success inference.
      k_try_first_success_law: >-
        For K independent same-E attempts and a_4_E>0,
        Pr[first accepted bytes are d by K]=(m_4_E_d/2^R_4)*
        (1-(1-a_4_E)^K)/a_4_E. Failure is (1-a_4_E)^K. Semantic probability
        sums this expression over all d denoting the same map.

    success_quantifiers:
      good_set: 'G_4(lambda)={E: a_4_E >= 1/q_4(lambda)}'
      nu_4_exact: nu_4(lambda)=Pr_(E<-D_ER(lambda))[a_4_E<lambda^(-c_q)]
      required_but_unproved: nu_4(lambda) is negligible
      named_missing_theorem:
        id: F4-BOUNDED-DESCRIPTOR-DENSITY
        statement: >-
          Under exact D_ER, all but negligible endpoint mass has at least
          2^R_4(lambda)/lambda^c_q accepting raw strings in the declared
          rational/interpolation domain, counted with transcript multiplicity.
        source_status: not supplied by the frozen sources
        forbidden_substitute: coefficient-density guesses, graph heuristics, or observed hit rates
      retry_cap_if_theorem_holds: N_4(lambda,kappa)=ceil(lambda^c_q*kappa*ln(2))
      retry_failure_if_theorem_holds: at most 2^(-kappa) for each E in G_4
      retry_scope: same supplied E with fresh independent coins; never resample or condition E

    cost_accounting:
      one_call_time: >-
        T_4(lambda) is the sum of R_4-bit parsing, DER parsing or deterministic
        interpolation linear algebra on at most S_4 bytes, canonical
        compilation, and A_eval on an at-most-S_4-byte descriptor. These are
        polynomial only under the frozen A_eval requirement and the stated
        deterministic field/polynomial arithmetic algorithms.
      one_call_memory: >-
        M_4(lambda) stores at most the S_4-byte payload, the interpolation
        matrix and reduced map bounded by S_4 and D_4, and A_eval workspace.
      retry_time: N_4*T_4 if F4-BOUNDED-DESCRIPTOR-DENSITY holds
      retry_peak_memory: M_4 plus one output descriptor and retry counters
      exhaustive_enumeration_time: >-
        Exactly 2^R_4 invocations of the deterministic parser/compiler/verifier
        enumerate the raw domain before duplicate outputs are coalesced. This
        is not polynomial merely because R_4 is polynomial.
      charged_rejections:
        - invalid length or nonzero padding
        - invalid field, point, integer, or DER encodings
        - noncanonical or reducible coefficient tuples
        - inconsistent or nonunique interpolation systems
        - pointwise fits that fail the global map identity
        - wrong source, target, degree, or inseparable degree
        - scalar or uncertified maps
        - duplicate transcripts and duplicate-semantic programs

    support_and_enumeration:
      byte_support: 'B_4(E)={d: m_4_E_d>0}'
      size_bounds: 0<=|B_4(E)|<=A_4_E<=2^R_4(lambda)
      semantic_support: quotient B_4(E) by semantic-map equality; no efficient quotient procedure is assumed
      conditional_byte_min_entropy: >-
        If A_4_E>0, H_infinity(bytes | success,E)=
        -log2(max_d m_4_E_d/A_4_E). Interpolation and cross-mode collisions can
        lower it; no positive lower bound is established.
      enumeration_status: >-
        The bounded raw family is finite and publicly enumerable in exactly
        2^R_4 trials. It is not thereby polynomially enumerable. No claim is
        made that a different polynomial enumerator does not exist.
      proper_family_status: >-
        The S_4 and D_4 cutoffs define a proper bounded subfamily. They do not
        cover all of End(E) and cannot support a universal impossibility claim.

    frozen_controls:
      scalar_multiplication: >-
        A rational program for [a] is rejected unless it has a valid frozen
        certificate; none applies to a scalar because its degree and
        inseparable degree are squares, its degree-one case is +/-1, and its
        characteristic discriminant is zero. A MUL root is outside the
        one-node EXPLICIT_MAP domain and rejected as well.
      immediate_dual_backtrack: >-
        Path nodes are outside the F4 domain. If the composite rational map is
        supplied, it equals [ell] and fails every non-scalarity certificate.
      central_p2_frobenius: >-
        D_4<p excludes degree p^2, and the frozen verifier independently
        rejects the applicable scalar p^2-Frobenius slice.
      unmatched_p_frobenius: >-
        A raw p-power map with target E^(p) distinct from E fails the E->E
        check. No target is silently relabelled; D_4<p also excludes degree p.
      exceptional_automorphism_positive: >-
        A correctly encoded explicit j=0 or j=1728 automorphism can pass in
        rational mode with DEGREE_ONE_NOT_PM_ONE. This positive control does
        not condition D_ER or give a density bound.
      leaked_witness_data: >-
        Raw bytes, points, interpolation, and verification use only Pi, E, and
        independent rho. A transcript containing a path pointer, orientation,
        ideal, hidden tag, torsion label, or basis is forbidden syntax.
      distribution_conditioning: >-
        a_4_E is defined per curve and nu_4 is measured under unconditioned
        D_ER. Exceptional and prime-field loci receive no substituted law.
      proper_witness_enumeration: >-
        The exact bounded raw domain is charged at 2^R_4 for exhaustive search.
        Replacing it by a polynomial list creates a new route whose D_ER
        coverage must be proved; absence of such a list is not inferred.
      duplicate_programs_one_map: >-
        The byte law uses m_4_E_d and the semantic law uses m_4_E_alpha, so
        transcript and program multiplicities are explicit rather than
        silently identifying syntax with semantics.

    proof_search:
      P0: pass_exact_D_ER_raw_coin_domain_rejection_law_and_DER_output_grammar_frozen
      P1: pass_public_only_dependency_and_no_correlated_advice
      P2: pass_for_every_returned_descriptor_by_A_eval_self_map_validation
      P3: pass_for_every_returned_descriptor_by_one_verified_frozen_certificate
      P4: >-
        fail_open: F4-BOUNDED-DESCRIPTOR-DENSITY is missing. Therefore the
        chosen polynomial q_4 has no proved high-mass conditional-success
        guarantee and polynomial retry cost is not established.
      P5: >-
        conditional pass: each accepted bounded descriptor is a OneEnd answer
        for that same E, and the stated retry calculation applies only on G_4.
      P6: >-
        open and not reached: high D_ER mass does not supply the every-query
        oracle coverage required by PW24-VOR Theorem 7.2.
      P7: pass_audit; exact finite support and multiplicities stated, polynomial enumerability unresolved without a false negative inference
      P8: pass_boundary; analysis stops before binding, ring reconstruction, recovery, or PKE

cross_family_conclusion:
  result: >-
    F3 and F4 each admit an exact public typed search packet, but neither meets
    the frozen sampler contract because its P4 high-mass theorem is absent.
    No graph heuristic, coefficient-density guess, erased witness, or endpoint
    conditioning is substituted for that theorem.
  local_oneend_implication: >-
    Every accepted output is a bounded OneEnd answer for the same supplied E.
    This local fact neither constructs a full ring nor supplies the oracle
    query coverage needed by the sourced EndRing-to-OneEnd reduction.
  claim_tier: two scoped typed obstructions, not universal impossibility

run_accounting:
  scientific_runs: 0
  implementation_runs: 0
  formalizer_runs: 0
  experiment_runs: 0
  benchmark_runs: 0
  parameter_selection_runs: 0
