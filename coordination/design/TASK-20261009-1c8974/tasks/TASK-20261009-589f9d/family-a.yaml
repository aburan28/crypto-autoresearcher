contract_binding:
  distribution_id: D-ER-BATCH-12e6aa-v1
  descriptor_grammar: DER-ENDO-v1
  challenge_input: (Pi_lambda,E) only
  failure_bytes: '0x00'
  required_outer_inner_bound: >-
    Pr_(E<-D_ER(lambda))[Pr_rho[valid(E,Samp(Pi,E;rho))]>=1/q(lambda)]
    >=1-nu(lambda), for explicit polynomial q and negligible nu.
  no_erased_state: true
  semantic_uniqueness_assumed: false
  bounded_degree_requirement: log2(deg(alpha))<=Lambda_PW(n_lambda)

families:
  - id: F1-relative-frobenius
    status_candidate: scoped_typed_obstruction
    status_scope: >-
      The composition is a typed, publicly certifiable non-scalar endomorphism
      once a separable phi:E->E^(p) is supplied.  The frozen packet supplies no
      public polynomial algorithm that constructs such a phi from a general
      bare endpoint.  A deterministic conjugation-isomorphism core is exact on
      its public easy locus, but its D_ER mass is unbounded.
    asserts_no_universal_impossibility: true

    intended_full_route:
      missing_constructor:
        signature: FindConjugate(Pi_lambda,E;rho_phi) -> FAIL or D_phi
        required_output: >-
          A DER-ENDO-v1-compatible separable isogeny descriptor for
          phi:E->E^(p), obtained from public data only.
        status: not_supplied_or_sourced
        significance: >-
          This is the connecting-path problem, not bookkeeping after a known
          map.  The relative Frobenius itself does not construct phi.  No
          hardness or impossibility claim is made.
        forbidden_substitutes:
          - the erased endpoint walk or any of its kernels or maps
          - an orientation, ideal, tag, torsion basis, or torsion label
          - the inseparable map Frob_p:E->E^(p) used in place of separable phi
      typed_maps_given_a_valid_phi:
        - symbol: phi
          type: E -> E^(p)
          separability: separable
          degree: d with gcd(d,p)=1
        - symbol: F_Ep_p
          type: E^(p) -> (E^(p))^(p)=E
          separability: purely_inseparable
          degree: p
          inseparable_degree: p
        - symbol: alpha
          definition: F_Ep_p o phi
          type: E -> E
          total_degree: p*d
          inseparable_degree: p
      descriptor_given_a_valid_phi:
        nodes: >-
          Include every typed node of D_phi, then REL_FROB_P with source E^(p)
          and target E, then COMPOSE with semantic order F_Ep_p after phi.
        declared_degree: p*d
        declared_inseparable_degree: p
        certificate:
          tag: INSEP_NOT_SQUARE
          proof: p is prime, hence the verified inseparable degree p is not a square
      conditional_output_law:
        pathfinder_law: >-
          Let K1_E be the byte law of a fully specified FindConjugate over
          accepted phi descriptors plus FAIL.
        byte_law: >-
          Pr[D=0x00|E]=K1_E(FAIL), and for every accepted phi syntax w,
          Pr[D=Enc_F1(E,w)|E]=K1_E(w), with probabilities summed if the fixed
          encoder ever identifies syntax records.
        semantic_law: >-
          Pr[alpha=a|E]=sum over w with F_Ep_p o phi_w=a of K1_E(w);
          FAIL retains mass K1_E(FAIL).
        current_status: >-
          K1_E, its coin length, and its algorithm are not supplied, so these
          formulas are an obligation, not an instantiated output law.
      conditional_cost_and_success:
        success: exactly the valid-output probability of FindConjugate on E
        degree: log2(deg(alpha))=log2(p)+log2(d)
        time: T_FindConjugate + T_encode + T_verify
        memory: M_FindConjugate + descriptor_and_verifier_workspace
        missing:
          - explicit R(lambda), q(lambda), and negligible nu(lambda)
          - explicit polynomial T(lambda) and M(lambda)
          - a polynomial Lambda_PW bounding log2(p*d)
          - a same-curve retry bound derived from q
      family_earliest_failed_arrow: P1

    public_core_candidate:
      id: F1-conjugation-isomorphism-core
      purpose: >-
        Give an exact public-only law without pretending that it covers a
        general endpoint.
      public_predicate: >-
        C1(E) holds when coefficient conjugation gives E^(p), Canon(E^(p))
        returns canonical target bytes exactly E and an explicit encodable
        isomorphism c:E^(p)->E, and the descriptor below passes A_eval.
      algorithm:
        coins: none
        steps:
          - Compute the coefficientwise conjugate E^(p).
          - Apply public Canon to E^(p); if its target bytes are not E, return 0x00.
          - Let phi=c^(-1):E->E^(p); encode phi as ISOMORPHISM.
          - Encode REL_FROB_P from E^(p) to E and COMPOSE it after phi.
          - Attach INSEP_NOT_SQUARE; return the descriptor only if A_eval accepts.
      typed_maps:
        - symbol: c
          type: E^(p) -> E
          degree: 1
        - symbol: phi=c^(-1)
          type: E -> E^(p)
          degree: 1
          separability: separable
        - symbol: F_Ep_p
          type: E^(p) -> E
          degree: p
          inseparable_degree: p
        - symbol: alpha_1
          definition: F_Ep_p o c^(-1)
          type: E -> E
          total_degree: p
          inseparable_degree: p
      DER_ENDO_v1:
        root_nodes: [ISOMORPHISM, REL_FROB_P, COMPOSE]
        compose_child_order: [c_inverse, F_Ep_p]
        root_source: E
        root_target: E
        declared_total_degree: p
        declared_inseparable_degree: p
        certificate_tag: INSEP_NOT_SQUARE
      exact_law:
        R: R_1(lambda)=0
        byte_law: >-
          Conditional on E, output is the point mass at the unique bytes
          Enc_F1core(Pi,E) when C1(E) holds and the point mass at 0x00 otherwise.
        semantic_law: >-
          Conditional on E, output is the point mass at alpha_1 when C1(E)
          holds and FAIL otherwise.
        syntax_semantics_note: >-
          This fixes one construction syntax only.  It neither asserts nor
          uses semantic uniqueness among all DER-ENDO-v1 programs.
      public_non_scalarity:
        result: pass_on_every_non_FAIL_output
        reason: >-
          A_eval verifies inseparable degree p.  Scalar multiplication [a] has
          square inseparable degree, whereas prime p is not a square.
      success_and_outer_mass:
        q: q_1(lambda)=1 on C1
        good_set: G1_lambda=C1_lambda
        support_mass_symbol: mu_1(lambda)=Pr_(E<-D_ER(lambda))[C1(E)]
        required_nu: nu_1(lambda)=1-mu_1(lambda)
        bound_status: >-
          No bound on mu_1 is in the frozen packet; nu_1 is not established
          negligible.  The law is not conditioned on C1.
      retry_accounting:
        on_C1: one attempt succeeds deterministically; further retries add no value
        off_C1: every attempt fails; retries cannot change E or mu_1
        frozen_formula: >-
          The generic N=ceil(q_1*kappa*ln(2)) bound is valid but loose on C1;
          actual failure there is zero after one attempt.
      cost_accounting:
        degree_bound: Lambda_1(n)=n, since log2(p)<=n_lambda
        time_expression: T_conjugate+T_Canon+T_inverse_iso+T_encode+T_A_eval
        memory_expression: M_Canon+M_encode+M_A_eval+output_storage
        status: >-
          Public operations are identified, but the packet does not give an
          explicit polynomial bound for Canon and descriptor construction;
          explicit T(lambda) and M(lambda) remain undeclared.
      support_and_entropy:
        non_FAIL_support_per_E: at most one byte string and one semantic map
        publicly_enumerable: true
        conditional_min_entropy_bits_on_success: 0
        locus_note: >-
          C1 is the public conjugation-isomorphism/easy locus and is not
          substituted for D_ER or assumed to have high mass.
      earliest_failed_arrow: P4

    proof_search_map:
      P0:
        status: pass
        note: D_ER and DER-ENDO-v1 are frozen exactly.
      P1:
        status: fail_for_intended_full_route
        note: No public PPT FindConjugate is supplied; the public core passes P1 only on C1.
      P2:
        status: conditional_pass
        note: The displayed source and target chain is exact for every supplied valid phi.
      P3:
        status: conditional_pass
        note: INSEP_NOT_SQUARE publicly proves non-scalarity.
      P4:
        status: fail_for_public_core_and_unresolved_for_extension
        note: The core lacks negligible 1-mu_1 and explicit T/M; the extension lacks law and bounds.
      P5:
        status: local_conditional_pass
        note: Every valid bounded output is a bounded OneEnd answer for that same E.
      P6:
        status: not_established
        note: D_ER high-mass success would not cover every PW24-VOR Algorithm 3 oracle query.
      P7:
        status: core_enumerated_extension_unresolved
        note: The core has singleton support; no extension support law or enumerator is supplied.
      P8:
        status: pass
        note: Analysis stops before reconstruction, binding, message recovery, or PKE.

    controls:
      scalar_multiplication: rejected because scalar inseparable degree is a square
      immediate_dual_backtrack: rejected as [deg(phi)] with square inseparable degree
      central_p2_frobenius: >-
        Using Frob_p:E->E^(p) in the phi slot yields the p^2-Frobenius slice
        with inseparable degree p^2; it is not this separable-phi route and is rejected.
      unmatched_p_frobenius: rejected unless the explicit E^(p)->E return map is present
      exceptional_positive_control: accepted separately by the frozen verifier; not emitted by F1
      leaked_auxiliary_data: forbidden; no erased path, orientation, ideal, tag, torsion data, or basis is used
      conditioning: no endpoint resampling or conditioning on j(E) in F_p
      proper_witness_family: the core descriptor is a publicly enumerable singleton on each C1 endpoint
      duplicate_semantic_programs: byte law is stated before semantic pushforward; equality is not inferred from bytes

  - id: F2-exceptional-automorphism-transport
    status_candidate: scoped_typed_obstruction
    status_scope: >-
      Direct exceptional automorphisms give typed deterministic outputs only
      on the two exceptional loci, whose D_ER mass has no frozen bound.  The
      transport formula is typed and publicly certifiable once a separable
      path to an exceptional curve is supplied, but no public polynomial path
      constructor from a general bare E is supplied or sourced.
    asserts_no_universal_impossibility: true

    direct_public_core:
      id: F2-direct-exceptional-core
      exceptional_set: j(E) in {0,1728}
      canonical_choice_rule: >-
        Use the lexicographically least canonical field root satisfying the
        displayed root equation, convert the public E to a short model, and
        flatten the conjugated automorphism back to E as one canonically
        reduced EXPLICIT_MAP.  Return FAIL if any public construction or
        A_eval check fails.
      typed_maps:
        j_1728:
          model: C:y^2=x^3+A*x
          root: i^2=-1
          map: u_4:C->C, (x,y)|->(-x,i*y)
          order: 4
          trace: 0
          degree: 1
        j_0:
          model: C:y^2=x^3+B
          root: zeta^2+zeta+1=0
          map: u_3:C->C, (x,y)|->(zeta*x,y)
          order: 3
          trace: -1
          degree: 1
        general_canonical_model: >-
          For a public isomorphism s:E->C, flatten
          alpha_2=s^(-1) o u o s as an explicit rational map E->E.
      DER_ENDO_v1:
        root_opcode: EXPLICIT_MAP
        root_source: E
        root_target: E
        declared_total_degree: 1
        declared_inseparable_degree: 1
        certificate_tag: DEGREE_ONE_NOT_PM_ONE
        verifier_obligation: reduced root functions differ from both +1 and -1
      exact_law:
        R: R_2direct(lambda)=0
        public_predicate: >-
          C2(E) holds exactly when j(E) is 0 or 1728, the canonical public
          root/model/map construction above terminates, and A_eval accepts.
        byte_law: >-
          Conditional on E, output is the point mass at the unique canonical
          bytes Enc_F2direct(Pi,E) when C2(E) holds and at 0x00 otherwise.
        semantic_law: >-
          Conditional on E, output is the point mass at the flattened u_3 or
          u_4 endomorphism when C2(E) holds and FAIL otherwise.
        syntax_semantics_note: >-
          The root is flattened so DEGREE_ONE_NOT_PM_ONE applies to an explicit
          map.  No semantic uniqueness among other programs is assumed.
      public_non_scalarity:
        result: pass_on_every_non_FAIL_output
        reason: A_eval verifies an explicit degree-one map different from both +1 and -1
      success_and_outer_mass:
        q: q_2direct(lambda)=1 on C2
        good_set: G2direct_lambda=C2_lambda
        support_mass_symbol: mu_exc(lambda)=Pr_(E<-D_ER(lambda))[C2(E)]
        required_nu: nu_2direct(lambda)=1-mu_exc(lambda)
        bound_status: >-
          The frozen sources identify two exceptional geometric classes but
          give no D_ER probability bound.  They establish neither that
          mu_exc is negligible nor that 1-mu_exc is negligible.  Class count
          alone is not a bound for this endpoint law.
      retry_accounting:
        on_C2: one deterministic attempt succeeds
        off_C2: all retries fail on the same E
        law_effect: retries do not alter exceptional support mass
      cost_accounting:
        degree_bound: Lambda_2direct(n)=0
        time_expression: T_j+T_short_model+T_root_select+T_flatten+T_reduce+T_A_eval
        memory_expression: M_model+M_root+M_map+M_A_eval+output_storage
        status: >-
          No explicit polynomial T/M or exact polynomial-time canonical root
          selection routine is frozen.  The construction is public-only, but
          its complete contract-level runtime declaration is missing.
      support_and_entropy:
        non_FAIL_support_per_E: at most one byte string and one semantic map
        publicly_enumerable: true
        proper_family: the two public exceptional loci
        conditional_min_entropy_bits_on_success: 0
      earliest_failed_arrow: P4

    transported_route:
      missing_constructor:
        signature: FindExceptionalPath(Pi_lambda,E;rho_phi) -> FAIL or (X,D_phi)
        required_output: >-
          An exceptional X with j(X) in {0,1728} and a separable, explicitly
          represented phi:E->X, found from public data only.
        status: not_supplied_or_sourced
        significance: >-
          Finding phi is the missing connecting-path step.  Naming the two
          exceptional targets or knowing u on them does not construct the
          path.  No hardness or impossibility claim is made.
      forbidden_substitutes:
        - the erased D_ER endpoint walk
        - an orientation, ideal, hidden label, torsion basis, or torsion label
        - a precomputed table correlated with the sampled walk
      typed_maps_given_a_valid_path:
        - symbol: phi
          type: E -> X
          separability: separable
          degree: d with gcd(d,p)=1
        - symbol: u
          type: X -> X
          choices: u_4 with trace 0 or u_3 with trace -1
          degree: 1
        - symbol: dual_phi
          type: X -> E
          degree: d
          identity: dual_phi o phi=[d]_E and phi o dual_phi=[d]_X
        - symbol: alpha_2t
          definition: dual_phi o u o phi
          type: E -> E
          total_degree: d^2
          inseparable_degree: 1
      DER_ENDO_v1_given_a_valid_path:
        nodes: >-
          Encode phi as normalized VELU_STEP/ISOMORPHISM nodes, encode u as an
          EXPLICIT_MAP on X, encode the explicit reversed dual path, and use a
          COMPOSE root in the order phi, u, dual_phi.
        declared_total_degree: d^2
        declared_inseparable_degree: 1
        certificate:
          tag: NONZERO_DISCRIMINANT
          trace_payload: t=d*t_u, where t_u is 0 for u_4 and -1 for u_3
          verified_identity: alpha_2t^2-[d*t_u]*alpha_2t+[d^2]=0
          discriminant: d^2*(t_u^2-4), which is nonzero
          derivation: >-
            Insert phi o dual_phi=[d]_X into alpha_2t^2 and transport
            u^2-[t_u]u+[1]=0 through dual_phi and phi.
      conditional_output_law:
        pathfinder_law: >-
          Let K2_E be the byte law of a fully specified public
          FindExceptionalPath, including its choice of exceptional target and
          the fixed canonical u, over accepted path syntaxes plus FAIL.
        byte_law: >-
          Pr[D=0x00|E]=K2_E(FAIL); for a byte string b, Pr[D=b|E] is the sum of
          K2_E(w) over accepted path records w whose fixed encoder gives b.
        semantic_law: >-
          Pr[alpha=a|E] is the sum of K2_E(w) over records w satisfying
          dual(phi_w) o u_w o phi_w=a; syntactically distinct paths that give
          the same map are aggregated.
        current_status: >-
          K2_E, its random coins, and its algorithm are absent.  The displayed
          pushforward is exact once K2_E is fixed, but is not an instantiated law.
      conditional_cost_and_success:
        success: exactly the valid-output probability of FindExceptionalPath on E
        degree: log2(deg(alpha_2t))=2*log2(d)
        time: T_FindExceptionalPath+T_dual+T_encode+T_verify
        memory: M_FindExceptionalPath+descriptor_and_verifier_workspace
        retry_if_bounds_existed: >-
          For an explicit q_2 and good set, N=ceil(q_2*kappa*ln(2)) same-E
          independent attempts would cost N times the per-attempt time and
          would not change the bad-curve mass.
        missing:
          - exact R(lambda), q(lambda), and negligible nu(lambda)
          - exact byte law K2_E
          - explicit polynomial T(lambda) and M(lambda)
          - a polynomial bound on path degree d and Lambda_PW
          - support enumeration or conditional-min-entropy accounting
      earliest_failed_arrow: P1

    proof_search_map:
      P0:
        status: pass
        note: D_ER and DER-ENDO-v1 are frozen exactly.
      P1:
        status: fail_for_transported_route
        note: No public PPT path constructor E->X is supplied; the direct core uses public data only.
      P2:
        status: conditional_pass
        note: Direct and conditional transported source/target chains are explicit.
      P3:
        status: conditional_pass
        note: Direct uses DEGREE_ONE_NOT_PM_ONE; transport uses NONZERO_DISCRIMINANT.
      P4:
        status: fail_for_direct_core_and_unresolved_for_transport
        note: Direct exceptional mass and T/M are unbounded; transport has no q/nu/law/cost.
      P5:
        status: local_conditional_pass
        note: Every valid bounded output is a bounded OneEnd answer for that same E.
      P6:
        status: not_established
        note: No every-query oracle or distribution bridge for PW24-VOR Algorithm 3 is supplied.
      P7:
        status: direct_enumerated_transport_unresolved
        note: The direct proper family is explicit; no transport support enumerator is supplied.
      P8:
        status: pass
        note: Analysis stops before reconstruction, binding, message recovery, or PKE.

    controls:
      scalar_multiplication: >-
        Direct +1 and -1 fail DEGREE_ONE_NOT_PM_ONE; transported scalars have
        zero characteristic discriminant and fail NONZERO_DISCRIMINANT.
      immediate_dual_backtrack: >-
        With u=[1], dual_phi o phi=[d] and the discriminant is zero; it is
        rejected.  The chosen u_3 or u_4 is the non-scalar middle map.
      central_p2_frobenius: rejected by the frozen verifier and not used
      unmatched_p_frobenius: rejected by the frozen verifier and not used
      exceptional_positive_control: exactly the direct u_3 and u_4 maps above
      leaked_auxiliary_data: forbidden in both direct and transported routes
      conditioning: >-
        The direct sampler returns FAIL off its locus; it does not condition or
        replace D_ER.  The transported route may not condition on a path existing.
      proper_witness_family: >-
        The direct exceptional family is publicly enumerable; the missing
        transport law cannot be assumed to evade or admit enumeration.
      duplicate_semantic_programs: >-
        The transported semantic law sums over all path syntaxes yielding the
        same alpha; no byte/semantic uniqueness is assumed.

cross_family_conclusions:
  contract_passing_sampler_established: false
  F1_earliest_family_failure: P1
  F1_public_core_earliest_failure: P4
  F2_earliest_family_failure: P1
  F2_public_core_earliest_failure: P4
  oneend_implication: >-
    Any accepted bounded non-FAIL output produced here would be a OneEnd
    answer for that same endpoint.  No family supplies the required D_ER-wide
    sampler guarantee.
  endring_implication: >-
    Not established.  The D_ER high-mass contract does not provide a bounded
    OneEnd answer on every curve queried by PW24-VOR Algorithm 3.
  support_warning: >-
    Neither the prime-field/conjugation easy-locus mass nor the exceptional
    locus mass is bounded by the frozen packet.  In particular, two geometric
    classes do not by themselves imply negligible D_ER mass.
  prohibited_claims_not_made:
    - PKE or public-key binding construction
    - EndRing reconstruction or break
    - security or novelty claim
    - concrete parameter claim
    - hardness claim for either missing path constructor
    - universal impossibility claim

provenance:
  primary_claims_via_frozen_packet:
    - source_id: WESOLOWSKI26-FROZEN
      use: relative Frobenius typing and non-scalarity after a supplied separable phi
    - source_id: PW24-VOR
      use: exceptional-class count, dual identities, efficient representation, and bounded OneEnd/EndRing direction
    - source_id: DEFEO17-ALGEBRA
      use: Frobenius codomain, supplied-kernel quotient maps, duals, and composition
  derived_here:
    - exact deterministic easy-locus byte and semantic laws
    - transported automorphism characteristic polynomial
    - exact symbolic D_ER mass obligations
  unresolved:
    - both public connecting-map constructors
    - all required outer-mass bounds
    - explicit polynomial time and memory bounds for complete candidates
    - any distribution/query-coverage bridge to PW24-VOR Algorithm 3
