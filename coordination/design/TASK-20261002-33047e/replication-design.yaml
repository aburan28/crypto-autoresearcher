        replication runs a build whose pre-existing arms reproduce the
        archived EXP-PFDR-011cd0 rows exactly. experiments/EXP-PFDR-011cd0/**
        stays read-only for every task (invoked by path only).
    experiment_scripts_new:
      - experiments/<EXP-A>/run_jobs.py (launcher; may start from a copy of experiments/EXP-PFDR-011cd0/run_jobs.py; imports no engine module)
      - experiments/<EXP-A>/design_a.py (P0; may import curve.py and factor_base.py only)
      - experiments/<EXP-A>/analyze_a.py (subcommands p0, calibrate, unmask; imports NO crypto_autoresearcher module; its relation recount is written from the CC-1 to CC-3 clauses and shares no code with harvest.py)
      - experiments/<EXP-A>/reproduce_check.py (G-REPRO comparator; standard library only)
    reused_read_only_by_path:
      - experiments/EXP-PFDR-011cd0/verify_rows.py (disjoint row verifier, standard library only; pinned by sha256 at first use)
      - experiments/EXP-PFDR-1b78f7/amd-1de84f/run_wrapper.py (RLIMIT_AS on each job process)
    not_reused:
      - >-
        experiments/EXP-PFDR-011cd0's check_identity_v5.py and the CR-4 text
        (AMD-20261002-f3fa33) are NOT reused (F-6 lesson). If an approval
        decision elects to reuse either, an additive amendment of the H9 clause
        closing the text-level blind spots is a precondition of that reuse.
    permitted_means_CD-12:
      - design.json of this experiment -- written only by design_a.py / analyze_a.py p0 (pinned) from the declared generator, seeds and the P0 inputs above; never edited by hand.
      - the planted-target subset S and K_plant -- computed only by analyze_a.py p0 from the declared seed rule; recorded in design.json before any census run.
      - the offsets x0 -- computed only by the EC-A1 builder in each job; recomputed independently by design_a.py (standard random module, same label) and recorded in design.json; G7-OFFSET compares them.
      - the small-height screen of the offset bases -- applied only by design_a.py from design quantities, before any census run.
      - calibration.json -- written only by analyze_a.py calibrate from null-arm records filtered by arm name before any count is parsed; its sha256 pinned in implementation-notes.yaml before unmask.
      - G-REPRO comparison -- only reproduce_check.py reading the archived files named in gates G-REPRO.
      - row and base verification -- only experiments/EXP-PFDR-011cd0/verify_rows.py invoked by path.
      - any other data file or mechanical rule application not listed here is a stop with options recorded (local_ambiguity_rule), never an improvised file or hand edit.
  controls:
    - MATCHED RANDOMS (the null) -- random_sub_r0, r1, r2 (FactorBase.random(E, s_sub, seed = c, c + 1000, c + 2000)), same curve, |F| and table arity as every scored arm (CC-5)
    - KNOWN-NULL ARM -- known_null_sub (FactorBase.random(E, s_sub, seed = c + 6000)) scored by the identical CC-8 formula against r0..r2
    - RANDOM-AS-STRUCTURED NULL PSEUDO-CELLS (RC-1 null object; red team PTM1 construction) -- each of r0, r1, r2 scored as structured against the triple formed by the other two randoms and known_null_sub; with the known-null arm, four null pseudo-cells (PC-NULL-R)
    - REAL-DATA PERMUTATION NULL (RC-3; red team PTM2 (b)) -- per curve, the four null arms' counts exchanged uniformly at random, position 0 scored against positions 1-3 by CC-8; its 0.99 quantile t_perm reported beside G-NB-R's t_A; the larger governs (t_dec)
    - PLANTED ARM AT TARGET SIZE (RC-2) -- planted_target, derived from planted_sub (FactorBase.planted(E, s_sub, seed = c + 8000), one TT plant per curve at m = 4) by counting its planted TT relation only on a pre-registered subset S of curves of size K_plant = round(0.15 x predicted C_R); expected kappa about 1.15 (PC-R-T)
    - FULL PLANTED ARM (dynamic range) -- planted_sub with every planted relation counted (expected kappa about 1 + 1/0.26, about 4.9; PC-R-D)
    - BASE MUTATION -- small_x_offset (EC-A1), the s_sub smallest liftable x above a seeded random offset x0 in [p/4, 3p/4); keeps curve, N, P, |F|, table arity and the consecutive-x shape; removes only the small height of the x-coordinates
    - SECONDARY STRUCTURED COMPARATOR -- subgroup (F_sub), scored against the same randoms; never decision-bearing for Part A
    - BASELINE REPRODUCTION -- G-REPRO (archived EXP-PFDR-011cd0 R12 rows reproduced on the EC-A1 build) and P0X-A (the archived 011cd0 TT4 random-arm C_R and sum_s2 recounted from archived rows)
    - DISJOINT VERIFICATION -- in-process row certificates (G4) and verify_rows.py on every instance with c % 10 == 0 (G4-R)
  controls_design_notes:
    mutation_choice_and_justification: >-
      Chosen before any data: the offset mutation, not small_x on the
      quadratic twist. The twist E' has order 2p + 2 - N, in general
      composite: it leaves the prime-order generator, the N-prime setting of
      Lemma L1 (red team PTM-L shows L1 failing at composite N) and the
      calibrated CC-8 null, and it changes the group, the targets and the
      base-size rule. The offset keeps every one of those and changes exactly
      one property: whether the consecutive x-coordinates are small integers
      (low height) or sit at a random place in F_p. It separates the three
      explanations: chance (neither small_x nor the mutation shows an excess
      on fresh curves), a small-x-specific source (small_x does, the mutation
      does not, and the paired contrast is positive), and an interval, engine
      or size artefact shared by consecutive-x bases (both do).
    offset_range_and_height_screen: >-
      x0 is drawn in [p/4, 3p/4) so the walk neither wraps nor touches the
      small_x interval. Rationals of small height (for example (p + 1)/2 + k =
      (2k + 1)/2) can still fall inside the walk with small probability, so
      before any census run design_a.py lists every curve whose offset base
      contains an x with x * v mod p in [-2^12, 2^12] for some v in 1..16;
      such a curve is dropped from the mutation arm and from the contrast
      only (CC-6-style listed exclusion), never from the primary test.
    planted_target_construction: >-
      planted_sub plants, at m = 4 and 30-32 bits, exactly one TT relation
      F_d = F_a + F_b - F_c' per curve (n_tt = max(1, round(s^4 / (6 N))) is 1
      there: at bits 32, curve 10, s_sub 209 and N 2839806169 give s^4/(6N)
      about 0.11, a planning approximation (hand)) plus one TB relation. The
      planted relations, with indices and signs, are written in the base's
      params. planted_target counts every relation of planted_sub on curves in
      S, and on curves outside S every relation except that curve's planted
      TT monic vector, removed by exact match. The planted excess is
      therefore exactly K_plant relations, located on declared curves of a
      real planted base. If a planted TT vector is absent from its curve's
      relation set on ANY curve, PC-R (iii) fails and the run is invalid.
      K_plant per rung b = round(0.15 x n_b x mu_b) with mu_30 =
      521.3333333333334/2000 and mu_32 = 513.6666666666666/2000 (the
      smallx-tt4-localise.json C_R fields); at the declared n_b = 3400 this
      is 133 and 131, a planning approximation (hand); the P0 run computes
      the exact values. S is the first K_plant_b curves of
      random.Random(f"plant-target|<EXP-A>|{b}").sample(curves_b, n_b),
      recorded in design.json before any census run.
    why_planted_target_is_new: >-
      EXP-PFDR-011cd0's planted arm sat far above the target (TT3 kappa about
      1.50, TB3 about 4.79; OBJ-RT-2), so its pass showed dynamic range, not
      sensitivity at 1.15. RC-2 requires sensitivity at the target; at the
      declared n the predicted detection of kappa 1.15 by z > t_dec is about
      0.999 (planning approximation (hand): (1.15 - 1)/SE with SE about
      0.0277 is about 5.4 null SDs), so a miss is a calibration failure.
  independent_variables:
    - base geometry at fixed curve, |F| = s_sub and exposure (the full m = 4 table) -- small_x (A) against small_x_offset (M), against matched randoms
    - bits in {30, 32} (pooled for the decision, per rung secondary)
  controlled_variables:
    - curve, |F| per family (s_sub = max(4, |F_sub|) with F_sub = FactorBase.subgroup(E, default_fb_size(N, 4), c)), table arity 2, pivot min_fill, engine mitm, numpy acceleration (p < 2^32)
    - class TT over the whole table (CC-3); TB harvested and reported, never decision-bearing
    - target stream as cells.design_curves of EXP-PFDR-011cd0 (label census, target seed 0), unused by table-only mode
  metrics:
    primary:
      - small_x TT4 pooled 30-32 -- C_A, C_R, V, SD_null, kappa_rel and z by CC-8; calibrated one-sided p against t_A; the outcome id
      - t_A (G-NB-R 0.99 quantile, seed-averaged over 5 families, spread reported), t_perm (permutation-null 0.99 quantile) and t_dec = max(t_A, t_perm)
      - decision-bearing one-sided upper bound U_A on small_x TT4 kappa_rel (signed-quantile method, its simulated coverage stated beside it) and the achieved X_rel at the realised n
      - mutation small_x_offset -- kappa_rel and z_M (CC-8, same randoms); contrast z_Delta with its calibrated one-sided 0.05 threshold t_Delta
      - PC-NULL-R (four null pseudo-cells), PC-R-T (planted at target) and PC-R-D (full planted) readings
      - every gate of `gates`
    secondary:
      - per-rung (30, 32) readings of small_x, small_x_offset, subgroup, planted_target and the null pseudo-cells -- kappa, z, per-rung calibrated p (pre-registered secondary; only the per-rung SIGN of small_x enters, as a qualifier of the routing in outcomes)
      - subgroup TT4 pooled reading (Part B pre-coverage; never decision-bearing here)
      - the |dev|-quantile bound of EXP-PFDR-011cd0 A-INT beside U_A, labelled by its simulated coverage (OBJ-RT-3)
      - structured-arm dispersion ratio rho_A (and rho_M) with a curve-cluster bootstrap 95% interval, and z_A recomputed with V scaled by the interval's upper end (dispersion robustness; red team J4 d method)
      - per-curve count histograms of A, M and the randoms; zero-count curves; share of the excess carried by the top 10 curves (as smallx-tt4-localise.json)
      - TB counts of every arm (TB4 is outside any family; Poisson tail screen as A-TAIL)
      - CC-1b sign-only recount beside every projective count; multiplicity histograms; informative rank and R_star (H3 is not evaluable at TT4, EV-PFDR-ad6274 INF-5)
      - per-instance time, table bytes and worker RSS
  heuristic_under_test:
    - HEUR-2765d2-H2 (structural null) for the single cell (small_x, TT, m 4, 30-32 bits) on fresh curves, and for the mutation base as a secondary cell
    - HEUR-2765d2-H4 (random base behaves as U; known-null distributed as the calibrated null) through PC-NULL-R and the permutation null
    - HEUR-2765d2-H1c, TT m = 4 dispersion clause only (pooled within-curve relation dispersion of r0..r2 with a 99% interval in [0.8, 1.25]), at the tested scale
  preregistered_prediction:
    quantity: >-
      kappa_rel(small_x, TT, m 4) pooled over fresh 30-bit and 32-bit curves
      (c in the Part A range), with z_A, and the same for small_x_offset and
      the paired contrast.
    formula: >-
      Null (pre-committed): HEUR-2765d2-H2, kappa_rel = 1 + O(N^{-1/2+eps}),
      so E[C_A] = E[C_R] to well below SE and P(z_A > t_dec) <= 0.01 by
      construction of t_A (one-sided 0.01); the planning SE at the declared
      6800 pooled curves is about 0.0277 (planning approximation (hand):
      0.03613980068046521 x sqrt(4000/6800)). Alternative carried from
      EV-PFDR-ad6274 OBS-4: kappa_rel about 1.097, which this design detects
      with probability >= 0.9 (P0-verified). Coordinator prior, recorded
      before any data of this experiment and after reading EV-PFDR-ad6274
      (exposure as draft_meta): O-A3 0.80; O-A4 0.02; a replicated excess
      (O-A1, O-A1b or O-A2) 0.13 in total (O-A1 0.05, O-A1b 0.04, O-A2 0.04);
      O-A-UNCAL or O-A-INVALID 0.05.
    source: >-
      H-PFDR-2765d2 HEUR-2765d2-H2 (random-model justification: complete
      mixed character sums cancel because Hom(E, G_m) = 0 -- recalled, supports
      nothing; incomplete-sum regime outside the proven range per Shparlinski
      2008, abstract retrieved by TASK-20260928-9c44f2); Lemma L1 (derivation
      tier for TT under U, DEC-20261002-c3f49b na8_ruling_L1) for the
      first two moments of the null relation count; the alternative's size
      from EV-PFDR-ad6274 OBS-4. Frozen at approval; any change is an
      additive protocol_amendment and never re-scores a run.
  scale_relevance:
    tier: toy
    justification: >-
      Generated prime-order curves at 30 and 32 bits (max log2 p = 32: toy by
      the mechanical rule cited in EV-PFDR-ad6274 claim_tier_basis), one
      engine (mitm, arity 2, min_fill), m = 4, class TT. No transfer or
      extrapolation is asserted: nothing about N above 32 bits, growth with N
      (Part C), other cells, other bases, other engines or deployed curves
      (TW-SCOPE).
    correspondence: none -- direct sampling of generated curves (no sampling correspondence is used)
  tail_checks:
    - z_A against the calibrated single-cell null distribution (G-NB-R) and against the permutation null (both computed before unmasking)
    - the four null pseudo-cells' z values against their simulated joint law (PC-NULL-R)
    - per-curve A and M counts -- curves with count >= 3 against the randoms' histogram; per-curve Poisson tail P(Poisson(mbar_j) >= n_A,j) < 1e-4 listed (A-TAIL style)
    - concentration of the excess -- share carried by the top 10 curves against the same share for the null pseudo-cells (diffuse versus clustered excess, smallx-tt4-localise.json method)
    - per-rung z of small_x against the per-rung calibrated null (a single-rung excursion like EXP-PFDR-011cd0's 32-bit z 3.45 is recorded, never decision-bearing)
  replication:
    seeds:
      - 'curve seeds: c = 2010 .. 2010 + n_b - 1 at each of bits 30 and 32 (n_b from P0; at most 6800, so c <= 8809); the reserved Part A range is 2010 .. 9999, disjoint from EXP-PFDR-011cd0 (c = 10 .. 2009 at 30-32 bits), from the Stage R range (c >= 20000) and from the Part B reservation (10000 .. 19999)'
      - 'curve generator: generate_prime_order_curve(bits, c, p_filter=subgroup_prime_filter([3, 4, 5], 0.15)) (EXP-PFDR-011cd0 cells.design_curves)'
      - 'instance: __main__._instance(bits, c, 0, pf) where a target is built; target label census, target seed 0; solver seed c'
      - 'bases: subgroup seed c; random_sub_r0, r1, r2 seeds c, c + 1000, c + 2000; known_null_sub c + 6000; planted_sub c + 8000; small_x_offset c + 9000 (rng label fb-smallx-offset|p|a|b|size|seed)'
      - 'planted-target subset: random.Random(f"plant-target|<EXP-A>|{bits}"), first K_plant_b of a full sample of the rung''s curves'
      - 'simulation: numpy SeedSequence([0x<tok-A>, family_index]) for 5 seed families (G-NB-R, X_rel, coverage, contrast); permutation null SeedSequence([0x<tok-A>, 100 + family_index]); bootstrap SeedSequence([0x<tok-A>, 200]); <tok-A> is the 6-hex token of the minted experiment id'
      - 'replicates: >= 20000 per seed family for every simulated quantile; >= 4000 synthetic designs per kappa for coverage'
    independent_instances: 6800
    independent_instances_note: >-
      Declared pooled curves (3400 at 30 bits, 3400 at 32 bits), the red
      team's Gaussian power-0.9 figure 6801 rounded to equal rungs; P0 may
      raise it (power_analysis) and never lowers it. Each curve carries eight
      arm-instances (small_x, small_x_offset, subgroup, r0, r1, r2,
      known_null_sub, planted_sub): 54400 table instances at the declared n.
  power_analysis:
    target: >-
      P(z_A > t_dec | kappa = 1.10) >= 0.90 (the observed effect size of
      EV-PFDR-ad6274 OBS-4, below the 1.15 target), one-sided alpha 0.01; and
      P(z_Delta > t_Delta | kappa_A - kappa_M = 0.10) >= 0.80.
    gaussian_check_planning_approximation: >-
      By hand from the inputs: SE(n) = 0.03613980068046521 x sqrt(4000 / n);
      power 0.9 at alpha 0.01 needs (1.10 - 1)/SE >= 2.326 + 1.282 = 3.608, so
      SE <= 0.0277 and n >= about 6800, reproducing replication-sizing.json's
      6801 (and 5244 for power 0.8). The contrast's null SD is about
      sqrt(2 x D x C_R); at n 6800, D about 1.01 and C_R about 0.2588 x 6800,
      an effect of 0.10 x C_R is about 2.95 null SDs, power about 0.90 at
      one-sided 0.05. Not a result; P0 replaces both by simulation.
    P0_rule: >-
      RA-03 (P0), before any census run of this experiment and from no census
      data of it: (1) design_a.py builds every design curve at the declared n
      and its s_sub, X-free model means mu_model(j) for TT at m = 4 (L1 first
      moment with generic multiplicity 3, L2), the offsets x0 and the height
      screen; (2) analyze_a.py p0 derives, from the inputs by path and field
      above, rho1_hat_b = sum_j mj / sum_j mu_model(j) over the EXP-PFDR-011cd0
      curves of rung b (mu_model recomputed from that design.json's curves),
      and D_plan = max(D_30, D_32) x 1.2; P0X-A recounts the archived R12 TT4
      random-arm and known-null relation counts from the archived rows and
      must reproduce calibration.json's known_null_sub|TT4|band C_R and sum_s2
      exactly (a stop otherwise); (3) it simulates the single cell under
      G-NB-R at the design curves (means rho1_hat_b x mu_model(j), dispersion
      D_plan) to get t_A_plan, and the power of z_A at kappa 1.10 with a
      Poisson-planted excess and with a compound-planted excess whose A-arm
      dispersion is 1.307 x D_plan (red team J4 d upper CI), the smaller
      governing; and the contrast power; (4) RULE: if the governing power is
      below 0.90 or the contrast power below 0.80 at the declared n, n_b at
      both rungs is raised to the smallest of {1.25, 1.5, 2} x declared that
      meets both; if 2 x does not, n_b = 2 x declared (6800 per rung) and the
      predicted powers are recorded as "target unattainable by design" before
      any census data; n is never lowered; (5) it records in design.json the
      final n, the curves, s_sub, mu_model, x0 and the height-screen list,
      K_plant_b and S, t_A_plan, the predicted powers, the predicted X_rel and
      the predicted U_A at kappa = 1, the Gaussian figures 5244 / 6801 beside
      the simulated requirement, and the expected disk and CPU. Its sha256 is
      pinned in implementation-notes.yaml before RA-04 starts.
    design_stop: >-
      Stop before RA-04 and return to the Coordinator (a design question, not
      data) if: P0X-A fails; G-FRESH fails; the expected package exceeds 1.0
      GB; any curve's planted_sub cannot plant (ValueError); or the
      height-screen list exceeds 1% of the rung's curves.
    design_properties_recorded_before_data: >-
      Planning approximation (hand), for the approval reader: at the declared
      n, z_A <= t_dec implies kappa_hat <= 1 + t_dec x SE (about 1.065 with t
      about 2.33 and SE 0.0277), hence U_A <= about 1.065 + 1.645 x 0.0277,
      about 1.11 < 1.15; so outcome O-A4 is structurally excluded unless the
      realised SE, t_dec or the coverage fallback exceed their planning values
      (it needs SE above about 0.0377, i.e. fewer than about 3700 pooled
      curves, or the |dev| fallback with fewer than about 4500). O-A4 is still
      pre-registered because those departures are possible.
  analysis:
    two_step_blinding: >-
      RA-05 (calibrate) reads, from every census row and harvest-row file,
      ONLY records whose arm is random_sub_r0, r1, r2 or known_null_sub;
      analyze_a.py filters by arm name before parsing any count and writes
      arm-read-log.json. It computes t_A, t_perm, t_dec, t_Delta, PC-NULL-R,
      the predicted X_rel and U-coverage at the realised n, and writes
      calibration.json, whose sha256 is pinned in implementation-notes.yaml
      before RA-06 starts. RA-06 (unmask) refuses to run unless
      calibration.json matches the pinned sha256, then reads small_x,
      small_x_offset, subgroup and planted_sub.
    statistic: >-
      CC-8 of EXP-PFDR-011cd0 unchanged, pooled over 30 and 32 bits (CC-10):
      C_X = sum_j n_{X,j}; C_R = (1/3) sum over r0..r2; s_j^2 the ddof-1
      variance of the three random counts on curve j; V = max(sum_j s_j^2,
      C_R); SD_null = sqrt(4V/3); z = (C_X - C_R)/SD_null; kappa_rel =
      C_X/C_R. The null pseudo-cells use the same formula with their own
      triple. The contrast is z_Delta = (C_A - C_M)/sqrt(2V) on the curves
      where M is admitted.
    calibration_G-NB-R: >-
      EXP-PFDR-011cd0 analysis.A-CAL_calibration restricted to the groups
      (SUB, TT, 4, 30) and (SUB, TT, 4, 32) of THIS experiment: per curve, each
      arm's count is negative binomial with mean m_j = rho1_hat_b x
      mu_model(j) and variance D m_j, rho1_hat_b and D = max(D_hat, 1)
      estimated from r0..r2 of this experiment only. The three randoms are
      drawn once per replicate and shared by every pseudo-structured arm. t_A
      = the 0.99 quantile of the single-cell pooled z (seed-averaged over 5
      families, >= 20000 replicates each; spread reported); t_Delta = the 0.95
      quantile of z_Delta for two independent pseudo-structured arms; the
      joint law of the four null pseudo-cells is simulated alongside.
    permutation_null_RC-3: >-
      Per replicate and per curve, the counts of (r0, r1, r2, known_null_sub)
      are permuted uniformly; position 0 is scored against positions 1-3 by
      CC-8; pooled z; >= 20000 replicates x 5 families; t_perm = the 0.99
      quantile. Reported beside t_A with both values and the family-wise rate
      of each at the other's threshold. Pre-registered: t_dec = max(t_A,
      t_perm) is the decision-bearing threshold (a heavier real-data null can
      only raise the bar).
    PC-NULL-R_rule: >-
      Passes iff (i) K, the number of the four null pseudo-cells with z > t_dec,
      has P(K_null >= K) >= 0.01 under the simulated joint law, and (ii) the
      mean of the four pooled null z lies inside the simulated 99% interval of
      that mean. Per-rung null z (8 values) are reported, never gating.
    upper_bound_U_A: >-
      Signed quantile, labelled by its simulated coverage (OBJ-RT-3): under
      G-NB-R with a Poisson-planted excess at kappa = kappa_hat, dev = (kappa*
      - kappa_hat)/SE*; q_lo = the 0.05 quantile of dev (signed); U_A =
      kappa_hat - q_lo x SE, with SE = SD_null/C_R; >= 20000 replicates x 5
      families. One-sided coverage of U_A is simulated at kappa = 1.00, 1.10
      and 1.15 (>= 4000 synthetic designs each) and printed beside U_A as
      "one-sided 95% (signed quantile), simulated coverage x.xxx". If any of
      the three simulated coverages is below 0.945, the EXP-PFDR-011cd0
      A-INT |dev|-quantile bound governs instead, labelled "quantile of |dev|,
      simulated one-sided coverage x.xxx". The |dev| bound is reported beside
      U_A in every case.
    X_rel: >-
      Smallest kappa on the grid 1.00, 1.01, ..., 1.30 with simulated P(z >
      t_dec) >= 0.5 at the realised n, Poisson-planted and compound-planted
      (A-arm dispersion 1.307 x D) beside each other; the larger is reported.
      A design sensitivity, never a realised bound (EV-PFDR-ad6274 INF-4).
    dispersion_robustness: >-
      rho_A = D_A_hat / D_R_hat with D_A_hat = [sum_j (d_j - (kappa_hat - 1)
      nbar_j)^2 - sum_j s_j^2/3] / sum_j nbar_j (red team J4 d), curve-cluster
      bootstrap 95% interval; z_A recomputed with V x max(1, upper end). If the
      outcome class depends on it, the outcome id carries the flag
      dispersion-sensitive; routing is unchanged.
    per_rung: >-
      Per rung b: kappa_b, z_b and per-rung calibrated p for small_x,
      small_x_offset, subgroup, planted_target and the null pseudo-cells.
      Secondary; the only per-rung quantity used anywhere is the sign of
      small_x's kappa_30 - 1 and kappa_32 - 1, as a routing qualifier.
  gates:
    - id: G-REPRO
      text: >-
        RA-02, on the EC-A1 build: re-run the two archived EXP-PFDR-011cd0 R12
        jobs 4-b30-c10 and 4-b32-c10 with the exact commands in
        experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-table/attempt-1/jobs/4-b30-c10/command.txt
        and .../4-b32-c10/command.txt (output paths moved under this
        experiment's run directory); after gzip decompression and JSON parse,
        every census row (timing keys excluded, as EXP-PFDR-011cd0 G1'), every
        harvest row and every staircase row equals the archived
        rows.jsonl.gz, harvest-rows.jsonl.gz and staircase.jsonl.gz of the
        same job; then the same two jobs with --arms extended by planted_sub
        and small_x_offset give identical rows for every pre-existing arm.
        Comparator reproduce_check.py only.
    - id: P0X-A
      text: analyze_a.py's recount (CC-1 to CC-3) of the archived R12 TT4 random-arm and known-null relation counts reproduces calibration.json PC_NULL.known_null_band_cells["known_null_sub|TT4|band"].C_R and .sum_s2 exactly
    - id: G-FRESH
      text: every (bits, c) of this design has 2010 <= c <= 9999, and no (p, a, b) of this design equals any (p, a, b) of experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-p0-design/attempt-3/design.json curves
    - id: G-T
      text: tests/test_index_calculus_fp.py, tests/test_index_calculus_harvest.py and tests/test_index_calculus_relcensus.py pass unedited; tests/test_index_calculus_smallx_offset.py passes (T-OFFSET-1, T-OFFSET-2, T-PLANT-M4, T-DET)
    - id: G4
      text: cert_fail == 0 and cert_pass == rows_emitted for every class of every instance (in process, as EXP-PFDR-011cd0 G4)
    - id: G4-R
      text: experiments/EXP-PFDR-011cd0/verify_rows.py accepts every retained row of every instance with c % 10 == 0 and every sampled base point lies on its curve
    - id: G7
      text: subgroup and planted base checks as EXP-PFDR-011cd0 G7 (planted relations hold on an independent instance; |F_planted| == s_sub)
    - id: G7-OFFSET
      text: for every sampled small_x_offset base (c % 10 == 0), x0 equals design.json's x0 and the points are exactly the first s_sub liftable x >= x0 with y != 0 (checked with standard-library Legendre symbols in analyze_a.py)
    - id: G-CURVE
      text: every instance's (p, a, b, N, P) equals design.json's entry for (bits, c)
    - id: G-REL
      text: for every instance, the harvester's relations_distinct, relations_distinct_sign, relations_nonformal, R_star and multiplicity histogram equal analyze_a.py's recount from the retained rows
    - id: PC-R-iii
      text: on every curve, planted_sub's planted TT monic vector (from the base params) is in the instance's TT relation set; on curves in S it is counted once, elsewhere it is removed by exact match
    - id: PC-NULL-R
      text: analysis.PC-NULL-R_rule
    - id: PC-R-T
      text: (i) planted_target pooled z > t_dec; (ii) C_planted_target - C_R within +- 4 SD_null of K_plant
    - id: PC-R-D
      text: full planted_sub pooled z > t_dec (dynamic range)
  gate_rule: >-
    Any failure of G-REPRO, P0X-A, G-FRESH, G-T, G4, G4-R, G7, G7-OFFSET,
    G-CURVE, G-REL or PC-R-iii makes the affected run invalid and nothing
    downstream is read (O-A-INVALID). A failure of PC-NULL-R, PC-R-T (i) or
    (ii) or PC-R-D, with every invalidating gate passing, leaves the
    structural reading INCONCLUSIVE (O-A-UNCAL); the H1c TT4 and H4 readings
    stay readable.
  outcomes:
    note: >-
      Pre-registered before any data; "replicates" means pooled z_A > t_dec.
      Evaluated only when every invalidating gate and every control passes.
      A timeout, crash, memory or disk stop is failed_infrastructure or a
      checkpoint, never a negative reading. Status changes, if any, are made
      only by a later Coordinator decision after independent review.
    rows:
      - id: O-A-INVALID
        condition: any invalidating gate fails
        meaning: nothing is read; the run returns to the executor with the defect named; never evidence about small_x TT4
      - id: O-A-UNCAL
        condition: invalidating gates pass; PC-NULL-R, PC-R-T or PC-R-D fails; or fewer than 80% of a rung's design curves remain after CC-6 for small_x
        meaning: structural reading INCONCLUSIVE; the failing control is analysed in review before any redesign
      - id: O-A1
        ds3_case: (i)
        condition: z_A > t_dec; kappa_30 > 1 and kappa_32 > 1 for small_x; z_M <= t_dec; z_Delta > t_Delta
        meaning: >-
          The excess replicates at both rungs and is lost under the base
          mutation: a small_x-specific relation-source CANDIDATE. No reading,
          no status change, no synthesis (TW-ALIVE). Routed to a
          review-breakthrough round at max with an independent replication,
          S_3-to-solution measured there (the remaining observation collision:
          an informative but solve-useless homogeneous excess).
      - id: O-A1b
        ds3_case: (i)/(ii) not separable
        condition: z_A > t_dec and the case is neither O-A1 nor O-A2 (one rung's small_x kappa <= 1, or z_M <= t_dec with z_Delta <= t_Delta, or M excluded on more than 20% of curves)
        meaning: >-
          A replicated small_x excess whose specificity the mutation (or the
          rung split) does not resolve. TW-ALIVE as O-A1, with the review
          asked to design a sharper mutation; no reading.
      - id: O-A2
        ds3_case: (ii)
        condition: z_A > t_dec and z_M > t_dec
        meaning: >-
          The excess replicates and persists under the mutation: NOT
          small_x-specific; attributable to the consecutive-x construction,
          the engine or the size matching. Because two structured arms then
          exceed matched randoms on fresh curves, it is still a TW-ALIVE
          event under H-PFDR-2765d2's falsification conditions: review
          (instrument audit first: G-REL, planted recovery, arm-order and
          table-construction effects) before any reading.
      - id: O-A3
        ds3_case: (iii)
        condition: z_A <= t_dec, U_A <= 1.15 and achieved X_rel <= 1.15
        meaning: >-
          No excess, bounded at the target: small_x TT4 joins the weakened set
          of DEC-20261002-c3f49b (a weaken by a new Coordinator decision after
          review). If Part B's per-cell requirements R-B1 to R-B6 are met by
          this run and its review (they are designed in), it also serves as
          the independent replication of this cell for a later reject_scoped.
      - id: O-A4
        ds3_case: (iv)
        condition: z_A <= t_dec and (U_A > 1.15 or achieved X_rel > 1.15)
        meaning: INCONCLUSIVE at the target again; the achieved X_rel and U_A are recorded; no transition for this cell
    unexpected_observations:
      - 'U-1 -- z_M > t_dec with z_A <= t_dec (an excursion of the mutation base alone) -- listed and routed to review; a single unregistered secondary test, no reading'
      - 'U-2 -- z_A < -t_dec (deficit) -- listed; never read as kappa_rel < 1'
      - 'U-3 -- subgroup pooled z > t_dec (secondary) -- listed and routed to review; not a candidate by itself'
      - 'U-4 -- any per-rung |z| > t_dec -- listed (A-TAIL style); not decision-bearing'
  success_criterion: >-
    Decidable from the declared metrics: every invalidating gate passes,
    PC-NULL-R, PC-R-T and PC-R-D pass, and exactly one of O-A1, O-A1b, O-A2,
    O-A3, O-A4 is assigned by the rules above, with t_A, t_perm, t_dec, U_A
    (and its simulated coverage), X_rel, z_M and z_Delta reported. O-A3 is the
    expected success; any assigned outcome is a success of the experiment.
  falsification_criterion: >-
    HEUR-2765d2-H2 is refuted for (small_x, TT, m 4, 30-32 bits, this engine,
    these curves) by O-A1, O-A1b or O-A2 only after the review-breakthrough
    round and its independent replication confirm it (TW-ALIVE). HEUR-2765d2-H4
    is refuted at this cell by a PC-NULL-R failure or by t_perm exceeding
    t_A's simulated 0.999 quantile (real-data null heavier than the
    calibrated one). HEUR-2765d2-H1c's TT m = 4 dispersion clause is refuted
    by its own frozen condition (99% interval of the pooled within-curve
    relation dispersion of r0..r2 entirely outside [0.8, 1.25]). A gate
    failure is an instrument failure, never evidence; every negative reading
    covers only this cell, these bits, this engine and these curves.
  tripwires:
    - id: TW-ALIVE
      text: O-A1, O-A1b or O-A2 -- no interpretation, status change or synthesis; review_plan at review-breakthrough (max) with independent replication (AGENTS.md rule 12)
    - id: TW-SCOPE
      text: no deployed-curve implication, universal impossibility, exponent below rho's, or floor-relative reading from this experiment
    - id: TW-FLOOR-INDEPENDENCE
      text: no floor ratio, A7 quantity or harvest-on mode is computed, read or written
    - id: TW-DISK
      text: no job starts while free disk is below 2.5 GB; the task checkpoints if the experiment directory exceeds 1.0 GB; a disk checkpoint is never a result
  budget:
    enforcement: advisory
    advisory_scope: >-
      Time and CPU are advisory (docs/research-budget-policy.md); machine
      protection binds; scientific counts (curves after P0, arms, seeds,
      replicates) are fixed.
    wall_clock_seconds_per_run: 86400
    wall_clock_note: Per-attempt watchdog; expiry checkpoints the run and unfinished jobs resume in attempt-N of the same run id; never a result.
    per_job_watchdog_seconds: 21600
    per_instance_watchdog_seconds: 1800
    per_task_watchdog_seconds: 259200
    total_cpu_hours: 6
    total_cpu_note: >-
      Advisory, derived not measured: EXP-PFDR-011cd0 R12 measured 6841.569
      CPU-seconds for 77020 table instances (manifest
      resources.cpu_seconds_sum_job_processes), about 0.089 s per instance
      including curve generation and dominated by larger m = 3 tables; 54400
      m = 4 instances at that rate is about 1.3 CPU-hours (about 2.7 at a 2 x
      raise), plus G-REPRO (2200 instances), P0 and calibration simulations,
      unmask and verification. About 1-3 hours wall on 4 processes.
    expected_disk: >-
      Modeled, not measured: TT4 rows are sparse (about 0.26 relations per
      random instance), census rows about 0.5 kB per instance (about 30 MB),
      staircases and base samples of the same order; well under the 1.0 GB
      package guard. P0 records a modeled figure in design.json.
    maximum_memory_gb: 14
    per_process_address_space_cap_bytes: 3500000000
    per_process_note: >-
      Every job process runs under experiments/EXP-PFDR-1b78f7/amd-1de84f/run_wrapper.py
      (RLIMIT_AS 3.5e9). Observed peak RSS of an EXP-PFDR-011cd0 R12 job
      process was 537137152 bytes (manifest
      resources.peak_rss_bytes_max_job_process); m = 4 tables are smaller.
    maximum_runs: 7
    maximum_runs_note: RA-01 to RA-06 planned plus RA-07 conditional (attribution, only if G-REPRO fails); attempts and job processes belong to their run id
    maximum_workers: 4
    maximum_workers_note: at most 4 job processes at once; none starts while MemAvailable < 4 GB; no cap or worker count is raised for any reason
  runs:
    note: Run ids are minted at approval as RUN-PFDR-<tok-A>-<name>; none exists. <PY> is the interpreter the execution handoff fixes.
    list:
      - id: RA-01
        name: tests
        command: <PY> -m pytest tests/test_index_calculus_fp.py tests/test_index_calculus_harvest.py tests/test_index_calculus_relcensus.py tests/test_index_calculus_smallx_offset.py -q -p no:cacheprovider --junitxml RUN_DIR/junit.xml (G-T)
      - id: RA-02
        name: repro
        command: the two archived R12 job commands (G-REPRO), then the same with --arms extended, then reproduce_check.py into RUN_DIR/g-repro-report.json
      - id: RA-03
        name: p0-design
        command: design_a.py, then analyze_a.py p0 (P0X-A, G-FRESH, sizing, S, x0, height screen) into RUN_DIR (curves.jsonl.gz, design.json, power.json, p0x-a-report.json); design.json sha256 pinned before RA-04
      - id: RA-04
        name: table
        command: >-
          run_jobs.py over design.json's jobs, each: <PY> -m
          crypto_autoresearcher.index_calculus census --panel main --m 4
          --bits <30|32> --curve-offset <c0> --curves <K <= 100> --modes table
          --arms subgroup small_x random_sub_r0 random_sub_r1 random_sub_r2
          known_null_sub planted_sub small_x_offset --known-log-max-bits 0
          --retain all --relcount --instance-watchdog 1800 --bases-out
          JOB/bases.jsonl --bases-sample-mod 10 --workers 1 --out
          JOB/rows.jsonl --rows-out JOB/harvest-rows.jsonl --staircase-out
          JOB/staircase.jsonl; then merge; then verify_rows.py (G4-R) and the
          G-CURVE, G-REL, G7-OFFSET and PC-R-iii checks
      - id: RA-05
        name: calibrate
        command: analyze_a.py calibrate (null arms only; arm-read-log.json) into RUN_DIR (calibration.json, null tables); sha256 pinned before RA-06
      - id: RA-06
        name: analysis
        command: analyze_a.py unmask --calibration-sha256 <pinned> into RUN_DIR (analysis.json, cells.jsonl, outcome id)
      - id: RA-07
        name: repro-attribution
        condition: G-REPRO fails only
        command: the failing comparison restricted to the mismatching instances on the 38be58dad engine bytes in a separate worktree; report whether the mismatch predates EC-A1
  stopping_rules:
    - Order is fixed -- RA-01; RA-02; RA-03 (design.json pinned); RA-04; cross-run checks; RA-05 (calibration.json pinned); RA-06.
    - If G-T or G-REPRO fails -- stop before RA-03; RA-07; return for a Coordinator decision.
    - If P0X-A or G-FRESH fails or P0 reaches a design stop -- stop before RA-04 and return.
    - A certificate or row-verification failure (G4, G4-R) stops that run at once; the run is invalid; rows so far are retained.
    - A per-instance, per-job or address-space stop ends that instance or job as failed_infrastructure; others continue; no re-run except a per-run watchdog continuation of unstarted or killed jobs.
    - No adaptive sampling beyond the pre-data P0 rule. No optional stopping, no look at any structured-arm count before RA-06.
    - TW-DISK checkpoints the task; never a result.
  invalidation_rules:
    - I-A1 a G-T, G-REPRO, P0X-A or G-FRESH failure
    - I-A2 any modification of an engine file outside EC-A1, of any existing test, of a committed results file, or of any path under experiments/EXP-PFDR-011cd0/ or experiments/EXP-PFDR-1b78f7/
    - I-A3 any harvested row failing its certificate, any sampled row failing verify_rows.py
    - I-A4 a G7, G7-OFFSET, G-CURVE or G-REL failure, or PC-R-iii
    - I-A5 nondeterminism (rows differing between worker counts, block sizes or repeated identical commands)
    - I-A6 a missing required artifact, an overwritten run record, a run directory outside experiments/<EXP-A>/runs/, or RA-06 run with a calibration.json whose sha256 was not pinned first
    - I-A7 RA-05 having parsed a count of small_x, small_x_offset, subgroup or planted_sub (its arm-read-log shows any)
  required_artifacts:
    per_run:
      - >-
        manifest.yaml at every attempt, canonical location and run root: run
        id; experiment id; status (completed_valid | failed_infrastructure |
        invalid) with completeness; code commit, dirty state and sha256 of
        every executed source file; exact command or command template and job
        list; environment (python, numpy, OS, CPU); inputs, curves and every
        seed (RA-01 states "no seeds (deterministic tests)" explicitly); the
        inference block (requested policy executor-implementation, backend,
        resolved model id or the provenance of its absence, model_verified,
        reasoning effort, fallback_used, degraded requirements; never a
        Bedrock provider); started_at and finished_at non-null at every
        location; peak RSS, CPU and wall seconds; the certificate block with
        kind none AND instances_claimed 0 AND instances_verified 0 written
        explicitly (F-1 lesson; no run of this experiment determines a
        discrete log).
      - command.txt
      - environment.json
      - stdout.log
      - stderr.log
      - raw-result.json (counts by status, gates, file hashes; for RA-05 and RA-06 every declared metric and the outcome id)
      - checksums.sha256 (every file beneath the location)
    per_run_data:
      RA-01: [junit.xml]
      RA-02: [jobs/, g-repro-report.json]
      RA-03: [curves.jsonl.gz, design.json, power.json, p0x-a-report.json]
      RA-04: [jobs/, rows.jsonl.gz, staircase.jsonl.gz, merge-report.json, row-verify.json, checks-report.json]
      RA-05: [calibration.json, arm-read-log.json, view-map.json]
      RA-06: [analysis.json, cells.jsonl, view-map.json]
      RA-07: [rows.jsonl.gz, attribution-report.json]
    per_experiment:
      - experiments/<EXP-A>/specification.yaml (this contract, frozen at approval with ids filled)
      - experiments/<EXP-A>/run_jobs.py, design_a.py, analyze_a.py, reproduce_check.py
      - experiments/<EXP-A>/fixtures/ (synthetic fixtures and the fixture exercise log run before first use on real data -- a known-null arm, a planted excess of known size, a planted vector absent on one curve, duplicated keys)
      - experiments/<EXP-A>/implementation-notes.yaml (EC-A1 mapped to functions; every pin with timestamp and sha256; the build-base check against 38be58dad; every deviation with reason and both hashes)
      - experiments/<EXP-A>/execution-report.yaml (runs, attempts, gates, controls, outcome id, failed instances, CC-6 exclusions, height-screen exclusions, unexpected observations; no interpretation beyond the outcome table)
      - src/crypto_autoresearcher/index_calculus/factor_base.py and __main__.py (EC-A1 only) and tests/test_index_calculus_smallx_offset.py
  machine_protection:
    concurrency: at most 4 job processes; nothing else running during RA-04
    memory: RLIMIT_AS 3.5e9 per process; no job starts while MemAvailable < 4 GB; 14 GB total
    disk: TW-DISK (2.5 GB floor, 1.0 GB package guard); no single file above 95 MB (per-job files)
    watchdogs: 1800 s per instance, 21600 s per job, 86400 s per attempt, 259200 s per task
    rule: a watchdog, memory or disk stop is failed_infrastructure or a checkpoint, never a result; no cap or worker count is raised for any reason
  review_requirements:
    after_RA-06: >-
      A snapshot archive of the whole run package, run alone, then an
      independent review round whose review_plan (with a recorded prior) is
      written at dispatch: a validator (validity; a G-REL-style recount from
      rows; a blind re-derivation of C_A, C_R, V, z_A, z_M, z_Delta and U_A
      from rows with analysis.json, cells.jsonl and calibration.json in
      blind_from until its sealed section is written) and a red team
      (calibration, permutation null, proves-too-much on the null
      pseudo-cells, planted-target recovery, the mutation logic, dispersion
      robustness). Tier review-adversarial (xhigh) for O-A3, O-A4, O-A-UNCAL
      and O-A-INVALID; review-breakthrough (max) for O-A1, O-A1b and O-A2,
      which may not be degraded (AGENTS.md rule 12).
    executor_independence: >-
      The executor session must be a new session that did not produce
      EXP-PFDR-011cd0 (TASK-20261001-7f7a33 and its continuations); same-model
      sessions attest session independence only (DEC-20261002-c3f49b
      limitations).
  pareto_honesty:
    dominated_by: >-
      Pollard rho (about 0.886 sqrt(N) group operations, O(1) memory;
      internal: H-PFDR-2765d2 asymptotic_claim.prior_best) for every outcome
      of this engine. This experiment claims no attack and no speedup; a
      constant kappa_rel cannot move this engine's exponent N^{max(h, m-h+1)/m}
      (0.75 at m = 4, internal), and nothing here measures growth with N.
    sota_delta: >-
      No attack; a measurement contribution only. Resolution on small_x TT4
      relation-level kappa improves from SE 0.0361 at 4000 curves (U 1.171,
      not excluding 1.15) to a planned SE of about 0.0277 at 6800 fresh curves
      (planning approximation), with a mutation contrast that EXP-PFDR-011cd0
      did not have.
  interpretation_limits:
    - A non-detection bounds this one cell at 30-32 bits on these curves and this engine; it closes nothing by itself and says nothing about growth with N.
    - A replicated excess is a lever candidate for review-breakthrough and independent replication, not a result and not a speedup.
    - The mutation separates small x-height from chance and from consecutive-x structure only within its own power; a non-discriminating mutation is reported as such (O-A1b).
    - Toy scale; generated curves; no deployed-curve statement.
  assigned_to: executor
  approved_by: null

# -----------------------------------------------------------------------------
# proof_search_map for Part A (KN-TECH-080; docs/inventor-protocol.md s. 8)
# -----------------------------------------------------------------------------
proof_search_map:
  scope_note: >-
    The map of the Part A measurement. It restates, narrowed to one cell, the
    H-PFDR-2765d2 map, with the lessons of the EXP-PFDR-011cd0 review.
  bottleneck: >-
    Whether the small_x base at m = 4 supplies distinct informative TT
    relations at a rate above matched random bases at 30-32 bits by a
    small_x-specific amount. Under U the relation count's first two moments
    are fixed by Lemma L1 (derivation tier for TT; DEC-20261002-c3f49b
    na8_ruling_L1), so only a non-generic excess moves it; and only growth
    kappa_rel ~ N^delta (Part C), never a constant, could bear on an exponent.
  baseline_embedding:
    parameter_slice: >-
      (i) the matched random arms, kappa_rel = 1 by definition; (ii) the
      archived EXP-PFDR-011cd0 R12 TT4 rows for curves 10..109 at 30 and 32
      bits (jobs 4-b30-c10, 4-b32-c10); (iii) the archived 4000-curve
      random-arm TT4 count and dispersion (calibration.json
      known_null_sub|TT4|band and the G-NB-R groups).
    reproduction_check: >-
      G-REPRO (byte-level row, harvest-row and staircase equality of the
      archived R12 jobs on the EC-A1 build, with and without the new arms) and
      P0X-A (the archived C_R 1035.0000000000095 and sum_s2 1049.333333333356
      recounted exactly), both before any census row of this experiment
      exists.
  observation_collision:
    observable: pooled kappa_rel and z of small_x TT4 on fresh curves, with z_M, z_Delta, U_A and the per-rung signs as companions
    distinct_preimage_search: >-
      Collisions searched and how each is separated. (1) Chance versus a real
      excess: the EXP-PFDR-011cd0 cell was singled out after the fact (per-cell
      p 0.00425 in a 21-cell family, family-wise p 0.082); fresh curves and one
      pre-registered single test separate them. (2) Small x-height versus
      consecutive-x structure versus an engine or ordering artefact: the
      offset mutation and the paired contrast. (3) Arm over-dispersion
      inflating z: rho_A and the dispersion-robust z. (4) A generator that is
      too light: the permutation null and t_dec = max(t_A, t_perm). (5) An
      instrument blind at the target: planted_target at kappa about 1.15. (6)
      Rung or size dependence (the 011cd0 excess sat in the 32-bit rung): per-
      rung readings, which two rungs cannot resolve -- stated, and handed to
      Part C. (7) Remaining, stated: an informative but solve-useless
      homogeneous excess reads as kappa_rel > 1 with rank; any candidate goes
      to review-breakthrough with S_3-to-solution measured there.
  constructive_transforms:
    - transform: observable_fiber
      proposed_object: fixed curve, N, P, |F| = s_sub and full-table exposure; vary only the location of a consecutive-x base (small_x at 0 versus small_x_offset at a random x0)
      predicted_gain: separates a small-height source from chance and from consecutive-x or engine artefacts in one paired comparison
    - transform: specialization_pack
      proposed_object: a single pre-registered cell with its own null-arm calibration, instead of a 21-cell family threshold
      predicted_gain: alpha 0.01 single-test power at kappa 1.10 of about 0.9 at 6800 curves (planning approximation), against X_rel 1.11 at the family t* in EXP-PFDR-011cd0
  quantifier_order: >-
    Target (unchanged, untestable here): THERE EXISTS an x-defined family
    {F_N} with kappa_rel >= 1 + c N^delta FOR ALL N in range. Tested: FOR the
    small_x family (and its offset mutation) at m = 4, class TT, AT the pooled
    30-32 band on fresh curves c in [2010, 2010 + n_b), whether kappa_rel
    exceeds t_dec, and a calibrated one-sided upper bound when it does not.
    Allowed dependencies: s_sub depends on N through the subgroup divisor;
    t_A, t_perm, t_Delta and the coverage depend only on null arms and design
    quantities; S, K_plant and x0 depend only on declared seeds, design curves
    and archived EXP-PFDR-011cd0 inputs; nothing depends on any structured
    arm of this experiment. A non-detection is "no excess above U_A at these
    N", never "for all N".
  method_ceiling:
    strongest_certifiable_claim: >-
      For this one cell at 30-32 bits on these curves and this engine: a
      calibrated kappa_rel, a one-sided upper bound labelled by its simulated
      coverage, the achieved X_rel, the mutation's kappa and the paired
      contrast, under a calibrated single-test false-alarm rate checked by a
      real-data null. It cannot certify delta, any N above 32 bits, any other
      cell or base, any other engine, or solve usefulness.
    nearby_object_control: >-
      Two-sided. Excess false: known_null_sub and the three random-as-
      structured pseudo-cells (PC-NULL-R) and the permutation null. Excess
      true with known size at the target: planted_target (K_plant relations,
      PC-R-T); far above it: full planted_sub (PC-R-D). Structured without
      small height: small_x_offset. Structured, different family: subgroup
      (secondary).
  proof_obligations:
    - claim: archived EXP-PFDR-011cd0 R12 rows reproduce on the EC-A1 build, with and without the new arms (G-REPRO)
      responsibility: baseline
    - claim: the archived 4000-curve random-arm TT4 C_R and sum_s2 recount exactly (P0X-A)
      responsibility: baseline
    - claim: L1 first and second moments of TT relation counts under U (derivation tier) and their engine transfer through HEUR-2765d2-H4 with the -2/s bias
      responsibility: success_probability
    - claim: every curve is fresh and disjoint (G-FRESH)
      responsibility: scope
    - claim: every planted vector is recovered and the thinning removes exactly one vector per non-S curve (PC-R-iii, T-PLANT-M4)
      responsibility: correctness
    - claim: harvester relation counts equal the disjoint recount from rows (G-REL); rows verify with disjoint code (G4-R)
      responsibility: correctness
    - claim: the offset base keeps |F|, the curve and the consecutive-x rule and removes small height (G7-OFFSET, height screen)
      responsibility: interface
    - claim: the decision-bearing bound has simulated one-sided coverage >= 0.945 at kappa 1.00, 1.10, 1.15, or the |dev| bound governs
      responsibility: strictness
    - claim: per-instance table bytes and job RSS are reported under the address-space cap
      responsibility: memory
  not_applicable_reason: none -- every audit applies and is filled above

# -----------------------------------------------------------------------------
# PART B -- independent replication of the 20 weakened FAM-1 cells
# (requirement-level design; a separate experiment with its own contract)
# -----------------------------------------------------------------------------
part_B:
  form: >-
    A SEPARATE experiment (EXP id to mint at its own design task), not a phase
    of Part A: it covers 20 cells under a family-wise threshold, needs its own
    P0, its own engine additions (planted arms at target for TT5 and SS) and
    its own review round. This file fixes its requirements, engine scope,
    cost and order; its contract is written by a later design task.
  cells_covered:
    - subgroup, small_x and dickson at TT3, TT5, SS3, SS4, SS5 and TB3 (18 cells)
    - subgroup and dickson at TT4 (2 cells)
    - criterion source -- DEC-20261002-c3f49b decision_class.cell_scope.weakened_20_cells (one-sided upper bound at or below target AND achieved X_rel at or below target); dickson SS4 included and read as "no excess detected", never as kappa_rel < 1 [SS m 4 P0 inputs estimated at 22-24 bits; TA-1 assumed, not verified by P0]
  per_cell_requirements:
    - id: R-B1
      text: >-
        Fresh curves from the same generator and p_filter, disjoint from
        EXP-PFDR-011cd0 (c = 10 .. 2009 at 30-32 bits; and every c it used at
        any rung), from Part A's reservation (2010 .. 9999) and from the Stage
        R range (c >= 20000): reserved range 10000 .. 19999. Same bits (30, 32
        pooled), m, arms, |F| matching, CC-1 to CC-10 (by clause) and
        statistic, pre-registered before any count is read.
    - id: R-B2
      text: A separate executor session (not the EXP-PFDR-011cd0 producer and not the Part A executor), and an independent review round with a blind re-derivation of every decision-bearing cell from rows and a G-REL-style recount from rows.
    - id: R-B3
      text: t* recalibrated on the replication's own random arms before any structured arm is read (two-step blinding), with the real-data permutation null of the null arms beside G-NB-R and the larger threshold governing.
    - id: R-B4
      text: For every covered cell, achieved X_rel at or below target AND a one-sided upper bound at or below target (1.15 TT and SS; 1.5 TB3), the bound labelled by its simulated coverage (signed quantile, with the |dev| fallback rule of Part A).
    - id: R-B5
      text: >-
        A planted arm at the target size per (class, m) so PC-R measures
        sensitivity (RC-2). Achievable without an engine change by Part A's
        thinning of the existing planted_sub for TT3 (about 55 plants per
        curve at 30-32 bits, planning approximation from the declared planted
        total 33060 on 600 curves in EV-PFDR-ad6274 OBS-7), TT4 (one per
        curve) and TB3 (one TB plant per curve against about 0.25 null
        relations per curve). NOT achievable by thinning for TT5 (one plant
        per curve against about 8 null relations per curve caps kappa near
        1.125 < 1.15) or for SS3-SS5 (search-class relations need planted
        encodings or targets): B requires an additive engine planted
        mechanism (EC-B1: a planted base with a declared plant count, and a
        planted SS mechanism whose relations the harvester provably records),
        designed and tested in B's design task. Until EC-B1 exists, the TT5
        and SS cells cannot meet J6 requirement (6) and B could support at
        most a replicated weaken for them, never a reject_scoped.
    - id: R-B6
      text: >-
        P0 inputs at the decision scope (OBJ-RT-6): TT and TB from
        EXP-PFDR-011cd0 R15 calibration groups (30-32 bits, full table,
        realised randoms); SS from EXP-PFDR-011cd0 R13 random arms at X_fix
        (30-32 bits), labelled "SS P0 inputs estimated at 30-32 bits at X_fix
        from EXP-PFDR-011cd0 R13 random arms" -- not the TA-1 inputs.
        Declared n: EXP-PFDR-011cd0 final n (design.json final_n: table 300,
        2000, 400 per rung at m 3, 4, 5; search 32, 144, 32), except search m 4
        declared at 96 per rung (the pre-raise declared value; the raise to
        144 was spent on the TA-1 transfer error, OBJ-RT-6). P0 RULE: raise a
        (panel, m) until every covered cell has predicted X_rel <= target AND
        simulated P(upper bound <= target | kappa = 1) >= 0.99; never lower.
    - id: R-B7
      text: Manifests write instances_claimed and instances_verified explicitly (F-1); conventions cited by specification clause (F-2); check_identity_v5.py / CR-4 not reused without first amending H9 (F-6); every data file and rule application names its permitted means (CD-12).
  engine_scope: >-
    The draft supports ENGINE-SCOPED statements only: this mitm engine at
    default arity (m+1)//2 and min_fill, at the 38be58dad build plus additive
    arms whose pre-existing rows reproduce the archived rows (G-REPRO style).
    A second engine is NOT needed for a reject_scoped stated for this engine
    (red team J6 requirement (5)) and IS needed for any statement beyond it;
    no second engine is designed here.
  advisory_cost: >-
    Advisory, derived from measured EXP-PFDR-011cd0 resources (manifest
    resources fields): R12 table panel 6841.569 CPU-s (wall 1850.492 s, peak
    RSS 537137152 bytes), R13 search panel 9126.913 CPU-s (wall 2386.418 s,
    peak RSS 445931520 bytes), R14 1011.936 CPU-s; about 4.7 CPU-hours for
    panels that also covered 20-28-bit rungs. B at 30-32 bits with planted
    arms at target, recalibration, permutation null and verification:
    about 4-8 CPU-hours and 2-4 hours wall on 4 processes (advisory), plus
    the EC-B1 implementation and tests and a review round. Machine
    protection as Part A.
  order_and_whether_to_run_before_A: >-
    NOT before Part A returns. (1) A's outcome changes B's scope: O-A3 adds
    small_x TT4 to the covered set, and A's run is designed to be that
    cell's independent replication (R-B1 to R-B6 are built into A), so B
    need not re-run it; O-A1, O-A1b or O-A2 fire TW-ALIVE, and a
    review-breakthrough round preempts a constant-level confirmation of the
    other cells. (2) A implements and validates the planted-at-target
    thinning, the permutation-null threshold rule and the signed bound that
    B reuses, so B after A is cheaper and less likely to stop. (3) B is a
    constant-level census at 30-32 bits whose only product is a toy-scale
    reject_scoped; it cannot bear on an exponent, and DEC-20261002-c3f49b
    NA-6 (3) ranks the growth read above any further constant-level census.
    Order: A, then C-1 (with the C-2 pilot), then B -- or B merged into C-1
    (B's fresh 30-32-bit rungs at B's n as the top rungs of C-1's ladder),
    which the approval decision for C may choose. B is run only if a
    reject_scoped on these cells is actually sought.

# -----------------------------------------------------------------------------
# PART C -- feasibility of a growth-with-N read (exponent bias)
# -----------------------------------------------------------------------------
part_C:
  question: >-
    Can kappa_rel ~ 1 + c N^delta (H-PFDR-2765d2's motivating conditional:
    growth with N would move the engine's exponent by delta/2,
    asymptotic_claim.time_exponent) be measured, under machine protection,
    on the cells where it is cheapest, and with what resolution on delta?
    EV-PFDR-ad6274 INF-6: a two-rung band cannot estimate delta. Binding: no
    growth statement may be designed to rest on two rungs; every ladder below
    has at least four.
  per_instance_scaling_planning_approximation: >-
    By hand, from Lemma L1's first moment with |F| ~ N^{1/m} and table arity h
    = (m+1)//2: TT relations per instance scale as |F|^{2h}/N. TT3 (h 2):
    N^{1/3}, about 110 per instance at 30-32 bits (calibration.json
    known_null_sub|TT3|band C_R 66033.67 on 600 curves). TT4 (h 2): N^0, about
    0.26 at every N (1035 on 4000 curves). TT5 (h 3): N^{1/5}, about 8 at
    30-32 bits. TB3: N^0, about 0.25. SS at X_fix = 20 isqrt(N): about constant
    in N (about 220, 80 and 75 relations per instance at m 3, 4, 5;
    EXP-PFDR-011cd0 power_analysis). So the per-rung SE at fixed n shrinks
    with N for TT3 and TT5, is flat for SS, and is flat and large for TT4 and
    TB3.
  delta_resolution:
    multiplicative_model: >-
      kappa(N) = a N^delta. Weighted OLS of log2 kappa_hat_b on x_b = mean
      log2 N of rung b, per-rung SE sigma_b (kappa near 1): SE(delta_hat) =
      sigma / (ln 2 x sqrt(sum_b (x_b - xbar)^2)) for equal sigma; one-sided
      0.05 detection at P = 0.5 is 1.645 SE(delta_hat), at P = 0.9 about 2.93
      SE(delta_hat). Ladder {20, 24, 28, 32} (sum of squares 80): SE = sigma /
      6.20; at sigma = 0.005 per rung, SE about 0.0008, detectable delta about
      0.0013 (P 0.5) or 0.0024 (P 0.9). Ladder {20, 24, 28, 32, 36} (sum 160):
      SE = sigma / 8.77, about 0.00057 at sigma 0.005. Under this model the
      exponent move delta/2 would be bounded at toy N to about 0.001 or less
      by a null ladder -- a statement about the fitted toy range only, never
      an extrapolation (TW-SCOPE). Planning approximations (hand).
    additive_model: >-
      kappa(N) = 1 + c N^delta, the DS-5 form. If the excess is not resolved
      at any rung (every bound near 1), (c, delta) are not jointly
      identifiable: a null ladder states only the envelope c N_b^delta <= U_b
      - 1 at each tested N, and that envelope is what would be recorded.
      delta becomes estimable only if the excess is resolved (about 3 SE or
      more) on at least three rungs, with per-rung log-scale error about
      sigma_b / ((kappa_b - 1) ln 2). No growth statement is designed on two
      rungs.
  cells_and_feasibility:
    C-1_in_band_ladder:
      verdict: FEASIBLE NOW, inside the current build (numpy path, p < 2^32; _accel.py MAX_P = 1 << 32), no engine change
      design: >-
        Rungs 20, 24, 28, 32 bits (Delta log2 N about 12), per-rung n chosen
        for equal sigma_b, fresh curves, the three FAM-1 bases plus three
        randoms and a known-null per family, calibrated per rung on its own
        randoms. Cheapest cells: TT3 and SS3/SS5.
      sizing_planning_approximation: >-
        TT3 at sigma_b = 0.005: n about 6750, 2690, 1060 and 460 curves at 20,
        24, 28 and 32 bits (from SE^2 = (4/3) D / (n mu_b) with D about 1 and mu_b
        scaled as N^{1/3} from about 110 at 30-32 bits); the low rungs' tables
        are tiny. SS3, SS5 at sigma_b = 0.005: about 230 curves per rung
        (from the pooled 64-curve SE 0.0095 of replication-sizing.json
        subgroup|SS3|band). TT5 at sigma_b about 0.01: about 9000 curves at
        20 bits (mu about 1.7 per instance), fewer above.
      advisory_cost: >-
        TT3 ladder about 11000 curves x 7 arms, mostly at 20-28 bits; at the
        R12 average of about 0.089 CPU-s per table instance (an overestimate
        for small tables) under 2 CPU-hours. SS3/SS5 ladder about 4 rungs x
        230 curves x 11 arms x 2 m at the R13 average of about 1.77 CPU-s per
        search instance (9126.913 CPU-s / 5170 declared instances), dominated
        by 32 bits: about 5-10 CPU-hours. Advisory.
    C-2_rungs_above_32_bits:
      verdict: CONDITIONALLY FEASIBLE for TT3 up to 36 bits; NOT FEASIBLE for TT3 at 38 bits or above under the 3.5e9 address-space cap; not designed for SS or TT5 above 34 bits before a probe
      reason: >-
        Above 2^32 the numpy table build and the numpy SS store cannot be
        used (_accel.usable needs p < 2^32; tails.py: "8 to 12 bytes a tail,
        against about 185 in a Python dict"), so the engine falls back to its
        pure-Python path, which EXP-PFDR-011cd0 never exercised at census
        scale. Memory, planning approximation (hand) from the tails.py
        figure and |F|^2 tails at m = 3 (1.23e6 tails at 32 bits, README):
        about 2.9e6 tails, 0.54 GB at 34 bits; about 7.3e6, 1.35 GB at 36
        bits; about 1.8e7, 3.4 GB at 38 bits -- over the 3.5e9 cap once
        interpreter overhead is added. Speed of the pure-Python path is
        unmeasured. The tier of a 34-36-bit rung is above the toy boundary of
        the mechanical rule and is assigned by that rule at C's design.
      preconditions: >-
        (a) a census --no-accel switch (an additive CLI flag; sweep and solve
        already have --no-accel) and an equality gate showing the pure-Python
        path reproduces the archived numpy-path R12 rows exactly at 30-32 bits;
        (b) a resource probe at 34 and 36 bits on a few curves per rung (RSS,
        CPU per instance) under the cap; (c) TT4 and TB3 are excluded from
        C-2, since a growth read there needs about 2.5e5 curves per rung for
        sigma_b = 0.005 (planning approximation: 1.6 / (0.26 x 2.5e-5)).
  recommendation: >-
    Design C-1 (TT3, SS3, SS5; rungs 20-32; at least four rungs) as the next
    experiment after Part A, with the C-2 pilot (preconditions a, b) in the
    same task as its feasibility step. Its product is a per-cell delta
    resolution under the multiplicative model and a per-rung envelope under
    the additive model, both scoped to the tested range. This is the only
    route on this line that can bear on an exponent
    (docs/target-result-profile.md), and DEC-20261002-c3f49b NA-6 ranks it
    above any further constant-level census.

# -----------------------------------------------------------------------------
# Identifiers to mint (top-level session, tools/allocate_id.py, then --check)
# -----------------------------------------------------------------------------
ids_to_mint:
  at_approval_of_part_A:
    - EXP-PFDR-<tok-A> (--next experiment --area PFDR) -- this contract's id; <tok-A> also seeds every simulation stream
    - DEC-<YYYYMMDD>-<tok> -- the approval (or revise / decline) decision for Part A
    - TASK-<YYYYMMDD>-<tok> -- the ledger archive of that decision (run alone, after TASK-20261002-1dc2ba's snapshot receipt verifies)
    - TASK-<YYYYMMDD>-<tok> -- the executor implementation-and-execution task (EC-A1, scripts, RA-01 .. RA-06); write scope experiments/<EXP-A>/** plus exactly the EC-A1 files
    - TASK-<YYYYMMDD>-<tok> -- the output (snapshot) archive of the run package, run alone before review
    - RUN-PFDR-<tok-A>-tests, -repro, -p0-design, -table, -calibrate, -analysis, and -repro-attribution (conditional) -- derived from <tok-A> when the run ids are fixed by the approval
  after_part_A_returns:
    - TASK ids for the validator and red-team reviews (review_plan written at dispatch), their sealing archive, the composing DEC, the EV-PFDR evidence record and its ledger archive TASK
  later_separate_designs:
    - EXP-PFDR-<tok-B> and its design TASK (Part B), only if a reject_scoped on the 20 cells is sought
    - EXP-PFDR-<tok-C> and its design TASK (Part C, C-1 with the C-2 pilot)
  not_needed:
    - 'No new H-* record -- Part A tests H-PFDR-2765d2 at one cell. OBJ-RT-5''s wording corrections to L1 and L2 travel into a successor hypothesis only if one is written (DEC-20261002-c3f49b rulings OBJ-RT-5).'
    - No protocol_amendment of EXP-PFDR-011cd0 (frozen; NA-5).

