# Lessons binding on this draft (DS-6) and how each is met
# -----------------------------------------------------------------------------
lessons_applied:
  OBJ-RT-6: P0 inputs for TT4 are the realised EXP-PFDR-011cd0 random arms at the decision scope (30-32 bits, full table); design.json estimates.TT4 (15 relations, EXP-PFDR-1b78f7 arms) is not used. Part B's SS inputs are at X_fix (R-B6).
  OBJ-RT-3: U_A is a signed-quantile bound labelled by its simulated coverage; the |dev|-quantile bound is labelled "quantile of |dev|" with its simulated coverage and governs only under the stated fallback.
  CD-12: experiment.inputs.permitted_means_CD-12.
  F-2: experiment.inputs.convention_source cites specification clauses CC-1 to CC-10 and cells.design_curves; no README.
  F-1: required_artifacts.per_run manifest text writes instances_claimed 0 and instances_verified 0 explicitly.
  F-6: check_identity_v5.py and CR-4 are not reused; reuse requires an H9 amendment first (experiment.inputs.not_reused).
  KN-TECH-080: proof_search_map above (baseline embedding = EXP-PFDR-011cd0 random arms and archived R12 rows; nearby-object controls; method ceiling; quantifier order).
  TW-SCOPE_and_labels: toy scale for A and B; C-2's tier assigned by the mechanical rule at its design; no SS m 4 statement in Part A; Part B names its own SS estimation scope; no floor ratio or A7 quantity anywhere.
