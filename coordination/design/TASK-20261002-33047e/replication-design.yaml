        role: per-rung random-arm means for K_plant (planted arm at target size)
      - path: experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-analysis/analysis.json
        field: A_INT["small_x|TT4|band"].SE, .q.q_one_sided_095, .upper95_one_sided, .kappa_rel
        value_read: 'SE 0.03613980068046521 at 4000 curves; q_one_sided_095 2.062313461586913 (quantile of |dev|); upper95_one_sided 1.1711499549303037; kappa_rel 1.0966183574879125'
        role: the SE scaling anchor for the Gaussian planning check; the |dev|-quantile convention reported beside this experiment's signed bound
      - path: coordination/review/pfdr-011cd0-20261002/reviews/TASK-20261002-87ffc4/attacks/j6/out/replication-sizing.json
