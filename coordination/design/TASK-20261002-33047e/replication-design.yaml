      - path: coordination/review/pfdr-011cd0-20261002/reviews/TASK-20261002-87ffc4/red-team-report.yaml
        field: joints.J4.computation.d_dispersion (small_x TT4 arm dispersion ratio)
        value_read: 'rho 1.148 [0.998, 1.307] (curve-cluster bootstrap 95% CI)'
        role: the structured-arm dispersion multiplier 1.307 used in P0's compound-planted power (the smaller power governs)
      - path: experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-p0-design/attempt-3/design.json
        field: curves[*] (bits, curve, p, a, b, N, P, sizes["4"]) for bits 30 and 32
        value_read: 'curve ranges c = 10 .. 2009 at 30 and 32 bits (final_n.table["4"]["30"] = final_n.table["4"]["32"] = 2000); e.g. bits 32, curve 10: N 2839806169, sizes["4"].s_sub 209'
        role: the curve set the replication must be disjoint from (G-FRESH) and the 011cd0 curves on which P0 recomputes mu_model to derive rho1_hat per rung
    p0_inputs_not_used_and_why:
      - path: experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-p0-design/attempt-3/design.json
        field: estimates.TT4 (rho1 0.9321981854310321, D_R_hat 0.8, D_R_ub95 1.230769230769231, sum_relations 15)
        reason: estimated from 15 relations of EXP-PFDR-1b78f7 random arms; the realised 4000-curve EXP-PFDR-011cd0 random arms at the decision scope supersede it as a P0 input (OBJ-RT-6 lesson; no SS input enters Part A)
    engine_build:
      base: >-
        The EXP-PFDR-011cd0 build: code commit 38be58dad, dirty false
        (EV-PFDR-ad6274 claim_boundaries.solver_and_version), mitm engine,
        default table arity (m+1)//2 (2 at m = 4), min_fill.
      change_EC-A1: >-
        ONE additive base builder and arm name, nothing else.
        (1) src/crypto_autoresearcher/index_calculus/factor_base.py: new
        classmethod FactorBase.small_x_offset(E, size, seed): x0 =
        p//4 + random.Random(f"fb-smallx-offset|{p}|{a}|{b}|{size}|{seed}").randrange(p//2);
        walk x = x0, x0+1, x0+2, ... (no wrap is possible: x0 + 4*size < p at
        30-32 bits), appending E.lift_x(x) when it exists with y != 0, until
        `size` points; kind "small_x_offset"; params {x0, bound (last x + 1),
        seed}; membership_poly is the generic product branch (unchanged code
        path). (2) src/crypto_autoresearcher/index_calculus/__main__.py: the
        builder entry "small_x_offset": FactorBase.small_x_offset(E, s_sub,
        seed=c + 9000), and the name inserted in MAIN_ARMS_ALL immediately
        after "planted_sub" (before "known_log"); selectable with --arms only;
        MAIN_ARMS unchanged. (3) tests/test_index_calculus_smallx_offset.py
        (new): T-OFFSET-1 (|F| == s_sub, x distinct, every point on the curve
        with y != 0, the consecutive-from-x0 rule, x0 recorded, determinism);
        T-OFFSET-2 (rows, harvest rows and staircases of every pre-existing
        arm are identical with and without small_x_offset and planted_sub in
        --arms, m = 4, 16-20 bits); T-PLANT-M4 (planted_sub at m = 4, 20-24
        bits: exactly one TT plant per curve whose monic vector is in the TT
        relation set, and removing that one vector leaves the rest of the set
        unchanged); T-DET (--workers 1 and 2 identical for the new arm).
        Every other file of src/crypto_autoresearcher/index_calculus/** and
        every existing test is byte-identical to 38be58dad. planted_sub at
        m = 4 needs no code change: the census CLI accepts it at any m (the
        "m = 3 only" restriction is EXP-PFDR-011cd0 specification text, not
        code; __main__.py builders and cmd_census, read for this design).
      na5_note: >-
        DEC-20261002-c3f49b NA-5 bars write scope over
        src/crypto_autoresearcher/index_calculus/**, tests/test_index_calculus_*.py
        and tests/fixtures/** until this design is approved or declined. An
        approval of Part A lifts it ONLY for the EC-A1 files above, in one
