# Proof-search-map audit for H-LHW-371a91 / EXP-LHW-9adf78
# Design archive TASK-20261002-be3df0. Zero runs. Inventor-protocol section 8
# (KN-TECH-080). The Coordinator re-checks the four audits that the idea carries
# in IDEA-20260930-750de2 proof_search_map. Hand arithmetic only (no shell); every
# derived figure is labeled and is re-derived in Stage 0.
audit:
  id: AUDIT-LHW-371a91-20261002
  hypothesis_id: H-LHW-371a91
  experiment_id: EXP-LHW-9adf78
  source_idea: IDEA-20260930-750de2
  question_id: RQ-LHW-1877bb
  recorded_at: '2026-10-02'
  recorded_by: coordinator
  zero_runs: true
  decision_ref: DEC-20261002-33bacf

  bottleneck: >-
    Whether any odd modulus M concentrates W(m, w) on few residue classes relative
    to sqrt(M) (D_M > sqrt(M)) outside the trivial brute-force regime. Decision
    changing: a positive answer gives a guess-and-kangaroo algorithm below
    min(kangaroo, brute force) with polylog memory (an exponent-level lead); a
    negative answer closes the congruence-filter route for class F_M. CONFIRMED as
    decision-changing and as the single measured quantity.

  baseline_embedding:
    parameter_slice: >-
      M = 1 reproduces plain kangaroo; M = 2^m - 1 reproduces brute force; the
      interval W_I = [0, |W|) returns kangaroo with the exact identities G_M =
      min(M, |W|), n_max = ceil(|W| / M).
    reproduction_check: >-
      Frozen as identity fixtures M1 in the contract (class sizes sum to C(m, w),
      first-moment checksum (2^m - 1) C(m-1, w-1), G = 1 at M = 1, G = |W| at
      M = 2^m - 1, G_M = M at M in {3, 5, 7}, NULL-2 identities) with two
      independent counters that must agree exactly. The Stage-2 kangaroo-constant
      reproduction (mean within a factor 1.5 of 2 sqrt(L)) is deferred; until it
      exists every C_M is MODELED and the contract says so.
    coordinator_recheck: >-
      PASSES as a design: every slice is an exact identity checkable without
      trust in the solver. One honest gap, stated: the idea requires the
      kangaroo-constant reproduction "before any C_M is read off the law" yet
      also says Stage 1 alone decides E1 versus E2. Resolved by labeling every
      Stage 1 cost MODELED and by requiring, in the hypothesis limits and the
      decision, that a closure record states the law as modeled unless Stage 2
      confirms it.
    status: declared_in_contract

  observation_collision:
    observable: The pair (G_M, D_M) per modulus and the ratio C_M / B per cell.
    distinct_preimage_search: >-
      REQUIRED by the idea before D_M is used as a flag. Written into the
      contract as the deliverable stage1/observation-collision.json: per cell,
      pairs (W, W' of one seed) and moduli with D_M / sqrt(M) within a factor 1.1
      and R differing by a factor outside [1/2, 2]; the report states an exhibited
      pair or that none exists. Pre-compute note (hand, Coordinator): the random-set
      null has D_M about M / |W| (plus Poisson fluctuation), which exceeds sqrt(M)
      only for M above |W|^2, a range outside the declared set (M <= 2^m), so the
      idea's own example pair lies outside the ladder and the search is a real
      search, not a formality.
    coordinator_recheck: >-
      PASSES as a design (deliverable, pass/fail, with the factors 1.1 and 2 labeled
      Coordinator design parameters). The M4 flag is reported only with the
      observation-collision statement attached and never moves the verdict by
      itself; the verdict is decided through R.
    status: declared_in_contract

  quantifier_order: >-
    THEOREM 3: for all m, all w <= m/2, all k with 1.124 w <= k <= m, M in
    {2^k - 1, 2^k + 1}. CONJECTURE 4: for all odd M not of fold type under H1 and
    H1'. EMPIRICAL CLAIM: for the declared cells and moduli, exact integers. The
    modulus is chosen before the target; no forall-x / exists-M swap. Coordinator
    re-check: the contract adds the explicit definition of "non-fold" (M divides no
    2^k -+ 1 with k <= 32), without which M4's population is undefined, and the
    declared set M <= 2^m, which is the idea's own scope. PASSES.
  status_quantifier: declared_in_contract

  method_ceiling:
    strongest_certifiable_claim: >-
      Every algorithm in F_M pays a factor G_M; for Mersenne and Fermat moduli the
      guess-and-kangaroo family is no better than min(kangaroo, brute force) at
      leading exponent; on the ladder no tested modulus gives C_M < B / 4. Nothing
      about hash-iterated walks, nested collisions, approximate group-side filters,
      or any ECDLP without the promise. Carried into the hypothesis
      interpretation_limits.
    nearby_object_control: >-
      The planted clustered class W_clu (k0 = 8, S0 = {0, 1, 2}) where the
      conclusion FAILS and a gain must be detected. COORDINATOR RE-CHECK: FAILED
      the audit as numerically specified (FA-1), then RESOLVED at design time: the
      blocking control is a residue-planted set (G_255 = 3, ratio 3 / sqrt(255) =
      0.188 against the kangaroo cost, threshold 0.25 unchanged) and the positional
      W_clu is a non-blocking descriptive row. Re-check of the repaired control:
      PASSES (attainable by construction, exact G = 3 test, integer inequality
      576 <= 1020).
    status: nearby_object_control_repaired_and_declared_in_contract

  proof_obligations_count: 8
  proof_obligation_recheck:
    - obligation: Lemma 1 (no homomorphism G -> Z/M, prime n, odd M > 1)
      recheck: >-
        The first claim is elementary: a homomorphism image has order dividing both
        n and M, and gcd(n, M) = 1 because M <= 2^m < n and n is prime. The stronger
        "no exactly sum-compatible bucket function" rests on KN-FIND-ffe1df
        Theorem C (exact case), as cited by the idea; not re-read here. Stage 0 note
        restates both.
    - obligation: Lemma 2 (C_M = G_M K(2^m/M), G_M >= M / D_M)
      recheck: >-
        Elementary: n_max >= |W| / G_M gives D_M >= M / G_M, hence G_M >= M / D_M and
        C_M >= 2 sqrt(M) 2^{m/2} / D_M, so C_M < 2 * 2^{m/2} requires D_M > sqrt(M).
        Consistent with the idea.
    - obligation: Theorem 3 (counting step, concavity, crossing)
      recheck: >-
        Counting step: every k-bit r of weight w is in W and distinct r are distinct
        residues modulo 2^k -+ 1 (r < 2^k - 1 unless w = k), so G_M >= C(k, w).
        Concavity: d/dkappa [kappa H(alpha/kappa)] = -log2(1 - alpha/kappa), so
        L'(kappa) = -log2(1 - alpha/kappa) - 1/2 is decreasing and L is concave.
        Endpoints: L(1) = H(alpha) and L(1.124 alpha) >= 1/2 since H(0.11) = 0.49992
        and the root of H(p) = 1/2 is about 0.1100, 1/(1 - 0.1100) = 1.1236 <= 1.124.
        NOTE DN-1: the clause "L >= 1/2 for kappa >= alpha/0.89" holds only on
        [alpha/0.89, alpha/0.11]; the conclusion is unaffected because only the
        endpoints and concavity are used. Hand figures, to be re-derived in Stage 0.
    - obligation: Conjecture 4 arithmetic (M <= |W| gives C_M >= 2 sqrt(M) 2^{m/2}; M > |W| gives C_M >= 2|W| sqrt(2^m/M) >= 2|W| for M <= 2^m)
      recheck: >-
        Correct given G_M >= min(M, |W|); then C_M >= B in both ranges because
        sqrt(M) >= 1 and 2|W| >= |W|. The conditionality is entirely in H1 and H1'.
    - obligation: P-FOLD-2 (residue inflation for k < 1.124 w)
      recheck: >-
        FINDING DN-2: the split 2^a = 2^{a-1} + 2^{a-1+k} is a residue identity
        modulo 2^k - 1 only; modulo 2^k + 1 the pair sums to 0. It also needs a >= 1,
        non-colliding positions, w - floor(k/2) available splits and a - 1 + k <= m - 1.
        FINDING DN-3: on the eight cells the only k in [w, 1.124 w) is k = w (where
        C(w, w) = 1 is trivial), so P-FOLD-2 is needed on the ladder only at a
        vacuous point. Neither finding changes a threshold.
    - obligation: baseline slices M = 1 and M = 2^m - 1
      recheck: PASSES (exact identities, fixtures M1).
    - obligation: guess list in polynomial memory by unranking
      recheck: Not exercised in Stages 0-1 (tables are analysis cost); carried to the deferred Stage 2.
    - obligation: certificates for Stage-2 solves
      recheck: Deferred with Stage 2.

  audits_applicable:
    - baseline_embedding
    - observation_collision
    - quantifier_order
    - method_ceiling
  audits_not_applicable: []

  failed_audits:
    - id: FA-1
      audit: method_ceiling.nearby_object_control (numeric pass criterion of the positive control M5)
      statement: >-
        The idea requires C_M / B <= 0.25 at M = 2^8 - 1 = 255 on W_clu with
        S0 = {0, 1, 2}. At M = 255 the per-guess cost is the kangaroo cost divided
        by sqrt(255) = 15.97, so the ratio to the kangaroo cost is G_255 / 15.97
        and a 0.25 gate needs G_255 <= 3; the residue of x on W_clu is w + c1 + 3 c2
        (c_j the number of set bits at positions congruent to j mod 8), which takes
        9 to 13 distinct values on the eight cells.
      numbers_label: >-
        Derived by the Coordinator by hand from the multiplicities C(n, c0) C(n, c1)
        C(n, c2) (n = 3 positions per class at m = 24, 4 at m = 28 and 32), to be
        re-derived in Stage 0.
      worst_case_G_255: {"(24,3)": 9, "(24,4)": 10, "(24,6)": 9, "(28,4)": 12, "(28,7)": 13, "(32,4)": 12, "(32,6)": 13, "(32,8)": 12}
      worst_case_ratio_to_kangaroo: 0.56 at the smallest to 0.81 at the largest; to B it is at least as large
      average_case_ratio_to_kangaroo_hand: {"(24,3)": 0.215, "(24,4)": 0.215, "(24,6)": 0.215, "(28,4)": 0.236, "(28,7)": 0.245, "(32,4)": 0.236, "(32,6)": 0.258, "(32,8)": 0.236}
      average_case_note: >-
        With B = |W| at (24,3), (28,4), (32,4) the ratio to B is about 0.87, 0.38,
        0.86; the 0.25 gate is therefore met at four cells and missed at four even
        under the average-case reading.
      consequence: >-
        Stage 1 as frozen would be ARTIFACT_VOID by construction (idea F4). The
        idea's own nearby_object_control sentence says only that guess-and-kangaroo
        beats kangaroo on W_clu, which is attainable (G_255 <= 13 < 15.97).
      independent_confirmation: >-
        The dispatching session reproduced the residue counts (9, 10, 9, 12, 13, 12,
        13, 12) and the ratios by exact enumeration over (c0, c1, c2).
      status: >-
        RESOLVED at design time before any run (DEC-20261002-33bacf): M5 threshold
        unchanged and the idea's B formula literal, blocking object repaired to a
        residue-planted set sized n_c = max(|W|, 2^{m/2 + 1}) so that B(m, n_c) is the
        kangaroo cost, positional W_clu kept as a non-blocking descriptive
        row, decay ladder on the planted class.
  note: >-
    A failed audit is often the useful result. Here it is a pre-compute
    falsification of the idea's control calibration, not of the idea: the
    mechanism, cells, nulls, decay ladder and outcome rules pass the audits. Passing
    these cheap pre-compute audits asserts nothing beyond AGENTS.md rules 4 and 6.

  pareto_honesty:
    dominated_by: >-
      KR-RHO-898783 kangaroo for alpha above about 0.11 and brute force below it,
      at leading exponent for Mersenne and Fermat moduli (Theorem 3); vOW and the
      half-split law of IDEA-20260906-ab08cb where |W|^{3/4} 2^{-w/4} <
      min(2^{m/2}, |W|); Esser-May as reported (KN-LIT-4794). As an obstruction
      not applicable (no attack claimed).
    sota_delta: >-
      Time 0, memory 0, data 0; no attack. Model delta only: the transfer price G_M,
      the fold dominance and the measured reversal quantity D_M on eight cells.
    checked: true

  stage_authorization:
    authorized: [0, 1]
    deferred:
      - Stage 2 and every task that performs group operations (designed only if Stage 1 returns E2 or the cost law must be confirmed for the closure record)
