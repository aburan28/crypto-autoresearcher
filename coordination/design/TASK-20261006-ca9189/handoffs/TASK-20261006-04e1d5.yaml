handoff:
  id: "TASK-20261006-04e1d5"
  from: "coordinator"
  to: "idea-generator"
  objective: >-
    Implement OBL-SSI-ADMISSION-DECODE-1 as one bounded zero-run mathematical
    design: define an efficiently checkable staged admission predicate for the
    exact labelled interface, then prove or refute honest KeyGen compatibility,
    message injectivity, and actual-message decoding without constructing the
    still-missing exact map or two-point evaluator.
  uncertainty_reduced: >-
    Whether exact ord(P)=N, canonical model tags, an admissible ordered
    E[D]-basis, nondegeneracy, and post-evaluation image-order checks suffice
    to repair the P=0 and V=0 statement defects while remaining compatible
    with honest key generation and the retained kernel-slope encoding.
  inputs:
