  constraints:
    - "One repair mechanism only. No new PKE family, alternate evaluator search, implementation, formalization, or scientific experiment."
    - "Zero scientific, implementation, formalizer, and experiment runs. Symbolic derivation and source checking are allowed; never invent an outcome."
    - >-
      Define canonical exact field/curve/model/point encodings and a two-stage
      predicate: public pre-admission before evaluation, and post-evaluation
      output/decoder admission when f(U),f(V) are available. Do not pretend an
      image-order check is available before its input exists.
    - >-
      Give efficient exact-order checks specialized to N=5^b and D=2^a;
      specify membership, [N]P=0 with [N/5]P!=0, corresponding checks for X,
      D-torsion/order checks for U,V, and a basis/nondegeneracy criterion such
      as exact-order Weil pairing with every representation and cost explicit.
    - >-
      Prove or refute that honest parameter/key generation can sample admitted
      exact models, P,X and an ordered basis (U,V), and that a kernel
      <U+sV> with unit U coefficient forces f(V) to have exact order D. State
      setup/keygen failure probability and retry accounting rather than
      assuming admission.
    - >-
      Prove or refute message injectivity at the exact ciphertext/public-
      relation level. Use the exact-order N>4D uniqueness premise only as an
      identifiability lemma, and separately prove that equality of kernels
      gives equality of slopes modulo D in the admitted basis and hence
      equality of m=s mod 2^k.
    - >-
      Type the actual decoder from certified A0=f(U), B0=f(V): verify exact
      models, ord(B0)=D, H=[2^(a-k)]B0 of exact order 2^k, solve and recheck
      G=-[2^(a-k)]A0=[m]H, and return the selected message. Partition admission,
      evaluator, decoder, malformed-input, and wrong-key failures.
    - >-
      Run nearest-object/collision controls for P=0, non-generator P, V=0,
      U,V dependent or not a basis, weakened point/pairing/image orders,
      swapped or retagged models, x(X)-only sign loss, and a supplied evaluated
      map. Record which exact conjunct separates each control.
    - >-
      No hidden Hom(E,C), connection map/isogeny, target frame/action/order
      evaluators, orientation, sender map/dual, retained walk, per-instance
      advice, or exponential preprocessing. A supplied evaluator is a
      proves-too-much control, not a construction.
    - >-
      Keep exact-map construction and uniform two-point evaluation as a
      separately named open obligation in every positive branch. Do not turn
      interface repair into an evaluator, finalist, or security result.
    - >-
      Complete a proof_search_map: exact baseline reproduction, observation-
      collision search, forall/exists quantifier order, constructive transforms,
      method ceiling, nearby-object controls, and separate interface/runtime/
      correctness/scope obligations.
    - >-
      Fill the O1--O6 scheme-obligation delta. Solver-to-decrypt remains an
      attack upper bound, not a correctly directed IND-CPA reduction. No
      security, novelty, practicality, deployment, finality, family closure,
      or universal EndRing-PKE possibility/impossibility claim.
    - >-
      Use research-visuals: dated source-linked report, editable Mermaid,
      matching SVG, and current inspected PDF in the declared study directory.
      Label claims proposed/derived/independently verified/measured and record
      that no quantitative graph applies because there are no measured data.
    - >-
      Write blind-statement.yaml as definitions, predicate pseudocode, exact
      theorem statements, parameters, and claimed quantities only. Include no
      derivation, producer verdict, source interpretation, or suggested break.
    - "Write provenance.yaml last, listing every source actually read, rendering/inspection status, exact zero-run counts, and hashes of the other thirteen outputs."
    - "Preserve H-SSI-072490, H-SSI-1ed6df, H-SSI-4a0c67 and all prior immutable records; write only the two declared scopes."
