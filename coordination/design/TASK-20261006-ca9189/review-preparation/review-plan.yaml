review_plan:
  id: "REVIEW-SSI-ADMISSION-DECODE-BATCH-9681e3"
  goal_id: "GOAL-SSI-2fa82a"
  question_id: "RQ-SSI-1946c9"
  batch_id: "BATCH-9681e3"
  obligation_id: "OBL-SSI-ADMISSION-DECODE-1"
  preparation_task: "TASK-20261006-ca9189"
  preparation_archive: "TASK-20261006-99f16f"
  producer_task: "TASK-20261006-04e1d5"
  producer_snapshot: "TASK-20261006-dfe098"
  reviewer_tasks: ["TASK-20261006-e3dc42", "TASK-20261006-ab7bd2"]
  composer_task: "TASK-20261006-4aba76"
  ledger_archive: "TASK-20261006-29eb9e"
  opening_decision: "DEC-20261006-3de254"
  final_decision_reserved: "DEC-20261006-0eb3fe"
  claim_under_review: >-
    TASK-20261006-04e1d5 either does or does not define an efficiently
    decidable, canonically encoded staged admission predicate requiring exact
    ord(P)=ord(X)=N, an admissible ordered basis U,V of E[D], nondegeneracy,
    and post-evaluation image-order conditions; establish honest KeyGen
    compatibility; and prove public-relation message injectivity plus checked
    actual-message decoding for every admitted honest instance. Exact-map
    construction and uniform evaluation of f(U),f(V) are excluded and remain
    separately open. No PKE security, novelty, practicality, or finality claim
    is under review.
  claim_binding_status: "producer_then_snapshot_required"
  claim_binding_rule: >-
    The Red Team checks the pushed TASK-20261006-dfe098 snapshot and quotes the
    exact submitted predicates and theorem statements before judging J3--J5.
    The blind Validator reads no producer byte except the immutable producer-
    authored blind-statement.yaml and judges J1--J2 only from its standalone
    card and that statement.
  coordinator_prior: >-
    Recorded before any reviewer runs. Exact prime-power order tests and a
    full-order Weil-pairing basis test appear capable of excluding the P=0,
    V=0, and dependent-basis controls. If the kernel is exactly <U+sV> in an
    admitted basis, equality of kernels should determine s modulo D and an
    evaluated f should give ord(f(V))=D and the retained low-bit decoder.
    The likely weak point is not this conditional algebra but whether the
    producer states an honestly sampleable KeyGen distribution and keeps
    post-evaluation checks out of pre-admission. A complete theorem would
    repair only the interface and would leave the exact-map/two-point evaluator
    obligation open. These are priors, not reviewer verdicts.
  canonical_attestation_schema:
    top_level: "review_attestation"
    required_fields: ["task_id", "joints_owned", "verdicts"]
    blind_validator_additional_required: ["sources_read", "blind_from_respected", "read_sibling_reports", "independent_session"]
    red_team_additional_required: ["sources_read", "read_sibling_reports", "independent_session"]
    verdict_mapping_keys: ["J1", "J2", "J3", "J4", "J5"]
    verdict_values: ["holds", "breaks", "inconclusive"]
    forbidden_aliases: ["canonical_verdicts", "per_joint_verdict", "per_joint_verdicts", "review_id", "jurisdiction"]
  joints:
    - id: "J1"
      joint: "J1 -- Exact model, point-order, ordered-basis, nondegeneracy, and staged admission decidability."
      assigned_to: "TASK-20261006-e3dc42"
      attack_plan: >-
        From the bare statement type every parser and public pre-admission
        check. Rederive the prime-power exact-order tests for N=5^b and D=2^a,
        the full-order pairing criterion for an ordered E[D] basis, and the
        canonical field/curve/model tags. Separate checks available before f
        is evaluated from the output/image-order checks available afterward.
        Run P=0, non-generator P, V=0, dependent U,V, swapped order, weakened
        pairing order, and retagged-model controls.
      breaking_artifact: >-
        An undefined or secret-dependent predicate, a false exact-order/basis
        equivalence, a post-evaluation value used during pre-admission, or a
        stated admitted control that still accepts.
    - id: "J2"
      joint: "J2 -- Message injectivity and checked actual-message decoder on every admitted honest instance."
      assigned_to: "TASK-20261006-e3dc42"
      attack_plan: >-
        Starting only from the theorem statement, prove or refute that equal
        exact public relations force the same degree-D map, equal cyclic
        kernels force the same slope s modulo D in the admitted ordered basis,
        and therefore the same m=s mod 2^k. Type A0=f(U), B0=f(V), exact image
        orders, H, G, the power-of-two digit recovery, final equality check,
        and every failure tag. Test V=0, nonbasis, weakened image order, x(X)-
        only sign, wrong model, and constant two-message views.
      breaking_artifact: >-
        A cross-message collision at the submitted quantifier scope, an
        unchecked order/model premise, recovery of an auxiliary value rather
        than the chosen message, or use of an evaluator not present in the
        theorem's conditional input.
    - id: "J3"
      joint: "J3 -- Honest KeyGen compatibility, sampling/retry probability, and kernel-to-image-order lemma."
      assigned_to: "TASK-20261006-ab7bd2"
      attack_plan: >-
        Expand Setup/KeyGen/Encrypt sampling on the exact labelled torsion
        modules. Verify that admitted P,X,U,V and a kernel <U+sV> can arise for
        every declared honest key/message/randomness, with all rejection/retry
        probabilities and costs. Prove or break the unit-U-coefficient lemma
        that f(V) has exact order D, and check whether any secret map, target
        frame, or post-evaluation datum was smuggled into public admission.
      breaking_artifact: >-
        Honest keys fail admission with undeclared probability, sampling needs
        a forbidden witness, the kernel shape is not guaranteed, or exact
        image order is assumed rather than derived or checked.
    - id: "J4"
      joint: "J4 -- Nearby-object and collision controls for weakened order, basis, model, and sign conditions."
      assigned_to: "TASK-20261006-ab7bd2"
      attack_plan: >-
        Construct the nearest false objects P=0, lower-order P, V=0, U,V in a
        proper cyclic submodule, a pairing of non-full order, swapped basis
        labels, relaxed codomain/model identity, x(X)-only observation, and a
        supplied evaluated map. For each, demand an explicit acceptance or
        collision trace and the exact predicate conjunct that separates the
        honest object. Search for an admitted cross-message collision rather
        than accepting prose about nondegeneracy.
      breaking_artifact: >-
        A known-false object passes the stated predicate or decoder, a claimed
        separator is unavailable or insufficient, or a supplied evaluator is
        mistaken for an evaluator construction.
    - id: "J5"
      joint: "J5 -- Proof-search map, evaluator separation, O1--O6, sources, visuals, costs, and claim hygiene."
      assigned_to: "TASK-20261006-ab7bd2"
      attack_plan: >-
        Audit exact baseline reproduction, observation collisions, quantifier
        order, constructive transforms, method ceiling, nearby objects, and
        each interface/runtime/correctness/scope obligation. Remove every
        hidden Hom/connection/frame/action/orientation/advice input. Check the
        O1--O6 delta, reduction direction, source provenance, cost/failure
        ledger, report/Mermaid/SVG/PDF consistency, and explicit separation of
        exact-map/two-point evaluation from the admission theorem.
      breaking_artifact: >-
        Hidden auxiliary data, evaluator work hidden inside admission, a
        solver-to-decrypt arrow called security, incomplete O1--O6 accounting,
        unsupported source/visual claim, or widened security/novelty/finality/
        impossibility language.
  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Validator and Red Team own disjoint joints in fresh fork-none independent
      sessions. Neither may read, list, receive, or be summarized the sibling
      report, the plan, composition, inter-agent messages, or conversation
      context beyond its standalone card and explicitly listed immutable
      inputs. The composer reads both reports only after both are terminal.
  proves_too_much:
    objects:
      - object: "P=0 or a non-generator P in E[N]."
        known_false: "Membership P in E[N] alone gives the N>4D singleton conclusion."
        expected_signature: "Exact-order checking rejects the object before uniqueness is invoked."
        assigned_to: "TASK-20261006-e3dc42"
      - object: "V=0 or a dependent pair U,V in E[D]."
        known_false: "Individual D-torsion membership alone makes slope encoding injective and the decoder valid."
        expected_signature: "The full-order pairing/basis check rejects it, and any weakened predicate exhibits the collision or order failure."
        assigned_to: "TASK-20261006-e3dc42"
      - object: "A post-evaluation ord(f(V)) test presented as public pre-admission."
        known_false: "A sender can check an output that has not been constructed from the declared public interface."
        expected_signature: "Pre-admission and evaluator-output admission are separate typed stages."
        assigned_to: "TASK-20261006-e3dc42"
      - object: "A supplied certified evaluator f or supplied f(U),f(V)."
        known_false: "Conditional decoder correctness constructs the missing evaluator from End(E)."
        expected_signature: "The theorem is explicitly conditional and exact-map/two-point evaluation remains open."
        assigned_to: "TASK-20261006-ab7bd2"
      - object: "Relaxed model tags or x(X)-only observation."
        known_false: "Map sign and codomain isomorphism are fixed without exact signed labelled encodings."
        expected_signature: "The relaxed object collides or loses a premise; the exact predicate names the separator."
        assigned_to: "TASK-20261006-ab7bd2"
      - object: "A solver-to-decrypt attack path."
        known_false: "Conditional decryption functionality is an IND-CPA adversary-to-EndRing reduction."
        expected_signature: "Security target, embedding, simulation, extraction, and advantage remain open."
        assigned_to: "TASK-20261006-ab7bd2"
    failure_signature: >-
      Any proof that accepts P=0 or V=0, merges pre-admission with unavailable
      evaluator outputs, infers evaluator construction from a supplied map, or
      reverses the security arrow has proved too much and receives a scoped
      break.
    assigned_to: "TASK-20261006-ab7bd2"
  blind_rederivation:
    required: true
    quantity: >-
      Q1: exact prime-power order and full-order pairing/basis admission,
      including the P=0 and V=0 controls. Q2: exact public-relation message
      injectivity and the A0,B0-to-m decoder with pre/post-admission and failure
      partitions kept separate.
    parameters: >-
      Exact labelled E,C/F_(p^2); D=2^a; N=5^b>4D; P,X of claimed N-order;
      ordered U,V in E[D]; k=floor(a/2); a conditional exact degree-D
      homomorphism f with kernel <U+sV> and f(P)=X.
    blind_from:
      - "coordination/design/TASK-20261006-ca9189/tasks/TASK-20261006-04e1d5/admission-decoder-repair.md"
      - "coordination/design/TASK-20261006-ca9189/tasks/TASK-20261006-04e1d5/admission-predicate.yaml"
      - "coordination/design/TASK-20261006-ca9189/tasks/TASK-20261006-04e1d5/honest-keygen-compatibility.yaml"
      - "coordination/design/TASK-20261006-ca9189/tasks/TASK-20261006-04e1d5/injectivity-decoder-theorem.yaml"
      - "coordination/design/TASK-20261006-ca9189/tasks/TASK-20261006-04e1d5/exact-model-encodings.yaml"
      - "coordination/design/TASK-20261006-ca9189/tasks/TASK-20261006-04e1d5/proof-search-map.yaml"
      - "coordination/design/TASK-20261006-ca9189/tasks/TASK-20261006-04e1d5/scheme-obligation-delta.yaml"
      - "coordination/design/TASK-20261006-ca9189/tasks/TASK-20261006-04e1d5/attack-gates.yaml"
      - "coordination/design/TASK-20261006-ca9189/tasks/TASK-20261006-04e1d5/provenance.yaml"
      - "research/ssi-endring-pke/2026-10-06-admission-decoder-repair/"
      - "coordination/design/TASK-20261006-ca9189/review-preparation/review-plan.yaml"
      - "coordination/design/TASK-20261006-ca9189/reviews/"
      - "coordination/design/TASK-20261006-ca9189/composition/"
      - "producer, Coordinator, sibling, composition, and scientific inter-agent messages"
    assigned_to: "TASK-20261006-e3dc42"
    allowed_sources:
      - "coordination/design/TASK-20261006-ca9189/handoffs/TASK-20261006-e3dc42.yaml"
      - "coordination/design/TASK-20261006-ca9189/tasks/TASK-20261006-04e1d5/blind-statement.yaml"
  source_review:
    assigned_to: "TASK-20261006-ab7bd2"
    intake_is_locator_not_evidence: true
    independent_retrieval_or_hash_verification_required: true
    boundaries:
      - "No recalled citation supports a theorem, complexity claim, or novelty label; unavailable sources record precise impediments."
      - "Preserve source version, locator/hash, exact theorem/interface, assumptions, output representation, and reduction direction."
  expected_composition:
    raw_checker: "tools/check_review_independence.py"
    command: "python3 tools/check_review_independence.py --plan coordination/design/TASK-20261006-ca9189/review-preparation/review-plan.yaml --reports coordination/design/TASK-20261006-ca9189/reviews/TASK-20261006-e3dc42 coordination/design/TASK-20261006-ca9189/reviews/TASK-20261006-ab7bd2 --no-addenda"
    stable_labels: ["J1", "J2", "J3", "J4", "J5"]
    required_attestation_field: "verdicts"
    required_task_field: "task_id"
    required_ownership_field: "joints_owned"
    verdict_values: ["holds", "breaks", "inconclusive"]
    metadata_projection_permitted: false
    review_or_plan_repair_permitted: false
    whole_claim_verdict_from_individual_reviewer: "forbidden"
  outcome_branches:
    positive: >-
      If J1--J5 support efficient admission, honest compatibility, injectivity,
      and actual-message decoding, preserve the repaired interface and rerank
      the separately open evaluator obligation. Do not call the scheme a
      finalist or launch a successor automatically.
    negative: >-
      If honest generation fails, a cross-message collision survives, or a
      predicate is unavailable, record the scoped interface failure and
      redesign the encoding without inferring EndRing-PKE impossibility.
    inconclusive: >-
      Freeze the smallest unresolved admission, generation, injectivity, or
      decoder lemma with a concrete falsifier and return to coordination
      without repeating the same search automatically.
  inference:
    reviewer_policy: "review-adversarial"
    reasoning_effort: "xhigh"
    independent_session_required: true
    degraded_allowed: false
    fallback_allowed: true
    fallback_boundary: "Substitution only to a binding fully satisfying review-adversarial/xhigh; no degradation."
    resolved_model_id: null
    model_verified: false
    fork_turns: "none"
  procedure_deviations: []
