blind_rederivation:
  task_id: "TASK-20261006-e3dc42"
  review_scope: [J1, J2]
  evidence_mode: "independent symbolic rederivation from the two declared sources"
  run_counts:
    scientific: 0
    implementation: 0
    formalizer: 0
    experiment: 0
  requirement_evidence:
    J1: "Typed admission predicates, prime-power order proof, basis proof, bit-cost accounting, and every named control below."
    J2: "Exact-map observation proof, kernel/slope/message injectivity, image-order proof, checked digit decoder, and failure partition below."
  joint_reviews:
    J1:
      verdict: holds
      typed_inputs:
        pre_admission:
          pp:
            - "the prime p and canonical F_(p^2)=F_p[i]/(i^2+1) representation"
            - "a,b,D=2^a,N=5^b,k=floor(a/2), including p>3, p=3 mod 4, a>=2, b>=1, v2(p+1)=a, v5(p+1)=b, and N>4D"
            - "the exact short-Weierstrass source-model tag for E:y^2=x^3+x"
          pk:
            - "the exact E model, full signed P, and full signed U,V in distinct ordered role tags"
          ct:
            - "the exact target short-Weierstrass model C and full signed X"
          binding: "Canonical parsing and equality are on all field/model/point/sign/role bytes, and the successful receipt binds the complete pp/pk/ct byte strings."
        post_evaluation:
          - "the unchanged successful pre-admission receipt, hence the identical bound pp/pk/ct bytes"
          - "returned full points A0 and B0, parsed in their roles on the exact bound C"
          - "No supplied map construction is inferred: A0=f(U), B0=f(V) is a conditional evaluator contract, not an admission fact."
      exact_prime_power_order:
        statement: >-
          For q=l^e and a point T, [q]T=O and [q/l]T!=O are
          equivalent to ord(T)=q.  The first condition makes ord(T) divide
          l^e; every proper divisor of l^e divides l^(e-1), so the second
          condition excludes every proper divisor.
        applications:
          - "P and X use l=5,e=b."
          - "U and V use l=2,e=a."
          - "B0 uses l=2,e=a, and H uses l=2,e=k."
      ordered_basis:
        forward: >-
          Let z=e_D(U,V).  The checks z^D=1 and z^(D/2)!=1 give
          ord(z)=D.  If [x]U+[y]V=O, pairing with U gives z^y=1 and
          pairing with V gives z^x=1 (up to inversion), hence x=y=0 mod D.
          Thus (x,y) maps injectively from (Z/DZ)^2 to E[D].  Since D is
          prime to p and E[D] has D^2 geometric points, this is a bijection,
          so U,V are an ordered basis.
        reverse: >-
          For an ordered basis U,V, perfectness and alternation of the Weil
          pairing make e_D(U,V) primitive: relative to any basis with
          primitive pairing, its exponent is the determinant of the
          change-of-basis matrix, a unit modulo D.  Each basis element also
          has exact order D.  Hence the predicate is equivalent to being an
          ordered Z/DZ-basis.
      decidability_and_cost:
        notation: "L=ceil(log2(p)); the stated equations imply a,b,k=O(L)."
        pre_admission: >-
          Canonical parsing, model/coordinate/discriminant checks, parameter
          arithmetic, and full-byte comparisons are bit-polynomial in the
          input size.  Each exact-order test uses a scalar multiplication of
          O(a) or O(b) group steps.  The Weil pairing is computable by a
          Miller loop in O(a) curve/field steps, followed by the two stated
          order tests.  The exact point-count test for C over F_(p^2) is
          deterministic polynomial time in L by standard Schoof-style point
          counting.  Thus pre-admission is an exact polynomial-time predicate.
        post_evaluation: >-
          Exact-C parsing and the D-order tests take O(a) group steps.  Forming
          H and G takes O(a-k) doublings.  The checked binary loop below takes
          O(k^2) group operations and the final equality is exact, for total
          O(a+k^2) group work and polynomial bit cost.
      symbolic_controls:
        P_zero:
          result: reject
          separating_conjunct: "[N/5]P!=O in the exact-order-N predicate"
        P_non_generator:
          result: reject_if_order_is_a_proper_divisor_of_N
          separating_conjunct: "[N/5]P!=O after [N]P=O"
          scope_note: >-
            An exact-order-N point necessarily generates its own cyclic
            order-N subgroup; the statement imposes no stronger choice of a
            distinguished subgroup and a single point is not required to
            generate the rank-two module E[N].
        V_zero:
          result: reject
          separating_conjunct: "[D/2]V!=O; independently e_D(U,V)^(D/2)!=1 also fails"
        dependent_U_V:
          result: reject
          separating_conjunct: >-
            e_D(U,V)^(D/2)!=1.  For example V=U gives pairing 1 even when
            both points individually have exact order D.
        weakened_pairing_or_order:
          result: reject_under_the_literal_predicate
          separating_conjunct: >-
            Omitting [q/l]T!=O admits lower l-power order.  Omitting the
            pairing condition e_D(U,V)^(D/2)!=1 admits a proper submodule:
            from a basis R,S, the exact-order pair U=R,V=R+[2]S has pairing
            e_D(R,S)^2 of order D/2 and satisfies only the weakened z^D=1 test.
        swapped_basis:
          result: "not_equal_to_the_original_key_or_receipt"
          separating_conjunct: >-
            U and V have distinct canonical role tags and the receipt binds
            the full bytes.  An unretagged positional swap fails role parsing;
            a correctly retagged swap may itself be an admitted ordered basis,
            but it is a different public key with a different receipt and
            cannot be substituted for the original.
        retagged_model:
          result: reject
          separating_conjunct: >-
            The canonical field, source-curve, and target-curve model-tag
            equality checks.  Isomorphic coordinates under a different tag
            do not equal the required exact models or the bound receipt bytes.
    J2:
      verdict: holds
      exact_public_relation_injectivity:
        exact_ciphertext_equality: >-
          Full canonical ciphertext-byte equality gives the identical exact
          target model C and identical signed point X; x-only sign ambiguity
          and isomorphic-but-retagged codomains are excluded.
        calibrated_map_equality: >-
          Let f and g be the two normalized separable degree-D honest maps
          E->C.  Since f(P)=g(P)=X, h=f-g kills the exact-order-N subgroup
          <P>.  If h were nonzero, N<=deg(h).  The degree norm satisfies
          deg(f-g)<=(sqrt(deg(f))+sqrt(deg(g)))^2=4D, contradicting N>4D.
          Therefore h=0 and f=g.
        cyclic_kernel_equality: "Equal maps have equal kernels, so <U+sV>=<U+s'V>."
        slope_equality: >-
          In the admitted ordered basis, the generators have coordinates
          (1,s) and (1,s').  Equality of their cyclic order-D subgroups gives
          (1,s)=lambda(1,s') mod D for some unit lambda.  The first coordinate
          forces lambda=1 mod D, and then s=s' mod D.
        message_and_randomness_equality: >-
          The stated ranges put both s=m+2^k r and s'=m'+2^k r' in [0,D).
          Congruence modulo D is therefore equality.  Uniqueness of radix-2^k
          decomposition gives m=m' (equivalently m=s mod 2^k) and r=r'.
      conditional_decoder:
        contract_boundary: >-
          The proof assumes the supplied f, or supplied values A0=f(U) and
          B0=f(V), belongs to the exact honest relation.  It neither demands
          nor infers an algorithm constructing or evaluating f.
        image_orders_and_relations:
          A0: >-
            A0=f(U)=-[s]B0, so [D]A0=O and
            ord(A0)=D/gcd(D,s), with order 1 when s=0.
          B0: >-
            ord(B0)=D.  Indeed, if [n]V is in ker(f)=<U+sV>, basis-coordinate
            comparison forces the kernel multiplier and n to be 0 mod D, so
            f is injective on <V>.
          H: "H=[2^(a-k)]B0 has exact order 2^k."
          G: >-
            G=-[2^(a-k)]A0=[s]H=[m]H and has order
            2^k/gcd(2^k,m), with order 1 when m=0; G need not have full order.
        checked_power_of_two_digit_loop: >-
          Set t_0=0.  For j=0,...,k-1 let R_j=G-[t_j]H and
          Q=[2^(k-1)]H.  Compute W_j=[2^(k-1-j)]R_j.  Accept digit 0 only
          when W_j=O and digit 1 only when W_j=Q; otherwise reject.  Put
          t_(j+1)=t_j+digit*2^j.  Because H has exact order 2^k, induction
          recovers the unique low j+1 bits of the discrete logarithm.  After
          k digits, recheck [t_k]H=G exactly.  Under the contract G=[m]H and
          0<=m<2^k, so the returned t_k is m.
      failure_partition:
        pre_admission: >-
          Parse/tag/parameter/model/curve/count/order/basis failures reject
          before any evaluator value is used and produce no valid receipt.
        evaluator: >-
          Absence of f or of its two contracted images, or failure to compute
          them, is an evaluator-interface failure outside this conditional
          decoder theorem; it is not replaced by an assumed construction.
        post_evaluation_malformed: >-
          A changed receipt, wrong-C point encoding, [D]A0!=O, non-exact-order
          B0, non-exact-order H, a digit test outside {O,Q}, or failed final
          equality is rejected by its named post-evaluation conjunct.
        wrong_key: >-
          Switching pp/pk/ct is rejected by the receipt and a different
          codomain is rejected by exact-C parsing.  Arbitrary same-C points
          from a wrong key are not authenticated by the stated post-checks and
          can sometimes satisfy them; such points are outside the evaluator
          contract, and no actual-message guarantee is claimed for them.
        admitted_contract_case: >-
          Only an unchanged pre-admitted instance plus exact contracted
          A0=f(U),B0=f(V) reaches the proved actual-message conclusion.
