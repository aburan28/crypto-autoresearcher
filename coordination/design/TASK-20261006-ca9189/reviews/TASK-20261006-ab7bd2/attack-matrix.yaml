attack_matrix:
  task_id: TASK-20261006-ab7bd2
  reviewed_snapshot: TASK-20261006-dfe098
  joints_owned: [J3, J4, J5]
  entries:
    - id: J3-UNIFORM-POINT
      joint: J3
      target: honest UniformPoint distribution
      adversarial_question: "Does infinity or y=0 receive extra sampler mass?"
      trace: >-
        j=0 is the sole accepting preimage of O; j=1 always retries; every
        nonzero affine point has exactly one (x,sign) preimage; a y=0 point is
        accepted only for sign 0.  Hence every curve point has one accepting
        index.
      separator_or_certificate: exact one-preimage count
      result: holds
    - id: J3-PROJECTION
      joint: J3
      target: torsion sampling
      adversarial_question: "Do cofactor maps bias E[N] or E[D]?"
      trace: >-
        Exact valuations give gcd((p+1)/N,N)=gcd((p+1)/D,D)=1.  On
        E[p+1]~(Z/(p+1)Z)^2 the two cofactor maps are surjective with equal
        fiber sizes onto E[N] and E[D].
      separator_or_certificate: exact valuation predicate
      result: holds
    - id: J3-RETRY
      joint: J3
      target: bounded KeyGen failure
      adversarial_question: "Is a sampler failure silently conditioned away?"
      trace: >-
        Union-bound all t_P+2t_B UniformPoint calls, then add the independent
        all-nongenerator and all-nonbasis rejection events.  This produces the
        stated bound without hiding a retry tail.
      separator_or_certificate: >-
        (t_P+2t_B)2^(-t_R)+(1/25)^t_P+(5/8)^t_B
      result: holds
    - id: J3-KERNEL-IMAGE
      joint: J3
      target: honest kernel shape and ord(f(V))
      adversarial_question: "Can U+sV or f(V) have lower order?"
      trace: >-
        The coordinate 1 of U+sV is a unit modulo D.  If nV belongs to
        <U+sV>, coordinate comparison forces the kernel multiplier and then n
        to vanish modulo D.
      separator_or_certificate: admitted ordered D-basis
      result: holds
    - id: J3-HIDDEN-INPUT
      joint: J3
      target: public admission
      adversarial_question: "Does admission read secret or post-evaluation data?"
      trace: >-
        PreAdmit reads canonical pp, pk, and ct only.  The complete End(E)
        representation belongs to the secret key but is not an admission
        input; all evaluator outputs and map-side objects are deferred.
      separator_or_certificate: staged interface
      result: holds
    - id: J4-P-ZERO
      joint: J4
      target: P=O under membership-only admission
      weakened_acceptance: "[N]P=O"
      trace: >-
        P=O makes f(P)=O for every candidate map.  The packet, however, does
        not exhibit two distinct normalized degree-D maps with different
        kernels, the same exact labelled C, and the same accepted ciphertext.
      separator_or_certificate: "[N/5]P!=O"
      result: exact_order_separator_holds_collision_trace_incomplete
    - id: J4-P-LOWER-ORDER
      joint: J4
      target: lower-order P
      weakened_acceptance: "[N]P=O"
      trace: >-
        If ord(P)=M<=N/5, a nonzero f-g killing P gives only M<=deg(f-g), so
        N>4D no longer yields a contradiction.  This defeats the proof but is
        not itself an explicit same-C cross-message collision.
      separator_or_certificate: "[N/5]P!=O"
      result: exact_order_separator_holds_collision_trace_incomplete
    - id: J4-V-ZERO
      joint: J4
      target: V=O
      weakened_acceptance: "[D]V=O"
      trace: >-
        For m=0 and m=1 with r=0, K=U+sV=U in both cases.  The exact same
        normalized quotient map, C, and X result, giving a cross-message
        collision under the weakened predicate.
      separator_or_certificate: "[D/2]V!=O and full-order e_D(U,V)"
      result: rejected_by_full_predicate
    - id: J4-DEPENDENT-BASIS
      joint: J4
      target: exact-order but dependent U,V
      weakened_acceptance: individual exact D orders only
      trace: >-
        On a>=4 choose V=U and slopes 0 and 2 (messages 0 and 2, r=0).
        K_0=U and K_2=3U generate the same order-D subgroup, hence the same
        normalized quotient and exact ciphertext.  Both U,V have order D but
        e_D(U,V)=1.
      separator_or_certificate: "ord(e_D(U,V))=D"
      result: rejected_by_full_predicate
    - id: J4-WEAK-PAIRING
      joint: J4
      target: pairing order merely dividing D
      weakened_acceptance: "e_D(U,V)^D=1"
      trace: >-
        The dependent V=U trace passes the weakened equation because the
        pairing is 1, while its determinant is nonunit and slopes collapse.
      separator_or_certificate: "e_D(U,V)^(D/2)!=1"
      result: rejected_by_full_predicate
    - id: J4-WEAK-IMAGE
      joint: J4
      target: B0/H lower order
      weakened_acceptance: target membership only
      trace: >-
        Let ord(B0)=D/2 and A0=-[s]B0.  Then ord(H)=2^(k-1).  Messages s=0
        and s=2^(k-1), with r=0, give the same projected G=[s]H=O, so a
        weakened decoder returns 0 for the second selected message.
      separator_or_certificate: exact order D for B0 and exact order 2^k for H
      result: rejected_by_full_predicate
    - id: J4-SWAP
      joint: J4
      target: swapped U,V
      weakened_acceptance: unordered basis identity
      trace: >-
        Swapping relative to fixed pk changes ordered role-tagged bytes and the
        receipt.  Deliberately binding the swapped tuple at fresh KeyGen makes
        a different key and slope convention, not a fixed-key collision.
      separator_or_certificate: ordered role binding plus full-byte receipt
      result: rejected_relative_to_fixed_key
    - id: J4-RETAG
      joint: J4
      target: isomorphic or retagged model
      weakened_acceptance: equality by field size or j-invariant
      trace: >-
        Alternate field, curve, role, or point tags alter canonical bytes even
        when a coarse isomorphism class is unchanged.
      separator_or_certificate: exact canonical model and point bytes
      result: rejected_by_full_predicate
    - id: J4-X-ONLY
      joint: J4
      target: x(X)-only observation
      weakened_acceptance: equal x-coordinates
      trace: >-
        Equality gives g(P)=+/-f(P).  The plus case gives f=g.  The minus case
        gives g=-f by N>4D, contradicting simultaneous normalization because
        [-1]^*omega_C=-omega_C in characteristic p>3.  Moreover f and -f have
        the same kernel even without normalization, so they do not encode
        different messages.
      claimed_separator: full signed X
      result: producer_cross_message_control_refuted
    - id: J4-SUPPLIED-EVALUATOR
      joint: J4
      target: supplied correct f(U),f(V)
      weakened_acceptance: treat supplied output as evaluator construction
      trace: >-
        Correct A0,B0 make the slope decoder public to their holder.  They do
        not provide an algorithm to construct those values from the declared
        recipient input.
      separator_or_certificate: evaluator-separation gate
      result: proves_too_much_control_holds
    - id: J5-QUANTIFIERS
      joint: J5
      target: witness dependence
      trace: >-
        BaseGen is fixed before keys and ciphertexts; the theorem then ranges
        over admitted keys/messages/randomness and conditions on an output for
        the same honest map.  No uniform evaluator program or epsilon_eval is
        asserted.
      result: holds
    - id: J5-HIDDEN-AUX
      joint: J5
      target: Hom/connection/frame/action/orientation/advice
      trace: >-
        None appears in PreAdmit or ciphertext.  The evaluator interface names
        only the represented End(E) secret and public exact objects, and stays
        open rather than importing an unlisted oracle.
      result: holds
    - id: J5-O1
      joint: J5
      target: exact hard problem
      result: open_and_correctly_scoped
    - id: J5-O2
      joint: J5
      target: complete honest-party algorithms
      result: open_because_BaseGen_and_Eval2_are_missing
    - id: J5-O3
      joint: J5
      target: quantified correctness
      result: open_because_epsilon_eval_is_unbounded
    - id: J5-O4
      joint: J5
      target: functionality mechanism
      result: open_because_private_recipient_lift_is_missing
    - id: J5-O5
      joint: J5
      target: correctly directed security reduction
      result: open_with_solver_to_decrypt_correctly_labeled_attack_upper_bound
    - id: J5-O6
      joint: J5
      target: complete adversarial view
      result: open_with_repeated_use_side_channels_authentication_and_game_absent
    - id: J5-SOURCES
      joint: J5
      target: primary-source evidence
      trace: >-
        Packet provenance has external_primary_retrievals: []; the KB records
        consulted are reported/abstract tier and disclaim full-paper
        verification.  File hashes match the frozen receipt but do not verify
        the invoked external mathematical theorems.
      result: breaks_required_source_gate
    - id: J5-VISUALS
      joint: J5
      target: Mermaid/SVG/PDF consistency
      trace: >-
        Mermaid sends CTRL to POST.  SVG path M325,690 V645 H760 V625 lands on
        Checked decoder; the PDF reproduces that SVG.  All four PDF pages are
        legible, but the editable and rendered graph semantics differ.
      result: breaks_consistency
    - id: J5-COSTS
      joint: J5
      target: cost and failure accounting
      trace: >-
        Added work and retry tails are stated, zero measured runs are not
        presented as performance evidence, and missing evaluator preprocessing,
        memory, runtime, output, and failure bounds remain explicit.
      result: holds_at_symbolic_conditional_scope
    - id: J5-CLAIMS
      joint: J5
      target: claim hygiene
      trace: >-
        Security, novelty, practicality, deployment, finalist status, family
        closure, and universal possibility/impossibility are excluded.
      result: holds
  run_accounting:
    scientific_runs: 0
    implementation_runs: 0
    formalizer_runs: 0
    experiment_runs: 0
