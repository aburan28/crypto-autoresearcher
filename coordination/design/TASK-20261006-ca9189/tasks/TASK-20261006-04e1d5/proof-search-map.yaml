task_id: TASK-20261006-04e1d5
mechanism: canonical_staged_admission_and_checked_slope_decode
proof_search_map:
  bottleneck: >-
    Repair the exact public relation so the earlier P=0 and V=0 fibers are
    excluded and a supplied correct pair f(U),f(V) decodes the selected
    message, without inferring or constructing the recipient evaluator.
  baseline_embedding:
    exact_parameter_slice: >-
      E,C/F_(p^2), D=2^a, N=5^b>4D, k=floor(a/2), public P,X,U,V,
      relation ker(f)=<U+sV>, s=m+2^k r, and full signed f(P)=X.
    reproduction_check: >-
      Dropping exact OrdN(P) admits P=0 and the f/-f signed-map collision;
      dropping OrderedBasisD admits V=0 and constant kernels/views across
      slopes.  The repaired predicate restores exactly those two premises.
    prior_decoder_reproduction: >-
      From an actually correct A0=f(U),B0=f(V), reproduce H, G, the exact
      2-power digit loop, and its final equality check.
    family_extension_status: "not a new family; one interface repair to the frozen relation"
  observation_collision:
    observable: "exact fixed public-key bytes and exact ciphertext bytes (C, full signed X)"
    distinct_preimage_search:
      P_zero: "many degree-D maps share X=O; separated by OrdN(P)"
      lower_order_P: "degree-norm uniqueness loses N; separated by OrdN(P)"
      V_zero_or_dependent: "many slopes share a kernel/view; separated by full-order pairing"
      x_only_X: "f and -f collide; separated by full signed X"
      model_alias: "isomorphic/retagged models collide at coarse identity; separated by literal canonical bytes"
      supplied_evaluator: "same decoder works publicly; separated from any claim of evaluator construction"
    admitted_collision_result: >-
      No cross-message collision remains under the exact relation: unique map
      plus basis-coordinate kernel equality forces equal slopes modulo D.
  quantifier_order: >-
    For every valid BaseGen output, every successfully admitted key, every
    message m and sender randomness r, there exists the honest normalized
    sender quotient f_s; for every semantically correct evaluator output for
    that same f_s, PostAdmitDecode returns m.  The evaluator program and a
    polynomial epsilon_eval bound must be chosen before instances for full
    efficient correctness; this task supplies neither.  BaseGen witnesses may
    not depend on a ciphertext.
  constructive_transforms:
    - transform: representation_reduction
      proposed_object: "canonical field/curve/point/ordered-basis byte representation"
      predicted_gain: "turn model/sign ambiguity into literal typed equality"
    - transform: stronger_invariant
      proposed_object: "exact prime-power orders plus full-order Weil pairing"
      predicted_gain: "make the slope coordinates unique and exclude zero/dependent controls"
    - transform: stronger_invariant
      proposed_object: "typed PRE_OK receipt followed by post-evaluation image orders"
      predicted_gain: "keep unavailable evaluator outputs out of public pre-admission"
    - transform: observable_fiber
      proposed_object: "hold coarse C or x(X) fixed while varying sign/model/basis"
      predicted_gain: "exhibit the precise conjunct needed for injectivity"
  method_ceiling:
    strongest_certifiable_claim: >-
      Efficiently decidable staged admission; conditional honest sampling on
      an admitted BaseGen; exact public-relation injectivity; and actual-message
      decoding from a semantically correct evaluated pair.
    nearby_object_control:
      - "P=0 passes torsion membership but fails exact N order."
      - "V=0 has D-torsion membership but fails exact D order and pairing."
      - "An independent nonbasis pair can have exact individual orders but fails full-order pairing."
      - "x(X) admits f/-f while full signed X does not."
      - "A supplied evaluated map makes decoding public but constructs nothing."
    cannot_certify:
      - "autonomous complete End(E) base generation"
      - "exact calibrated recipient map construction"
      - "uniform two-point Eval2 or a polynomial epsilon_eval"
      - "IND-CPA security or any adversary-to-EndRing reduction"
      - "novelty, practicality, deployment, finalist status, or universal possibility/impossibility"
  proof_obligations:
    - claim: "canonical parsing and literal model equality"
      responsibility: interface
      disposition: derived
    - claim: "prime-power exact-order equivalences"
      responsibility: correctness
      disposition: derived
    - claim: "full-order Weil pairing iff the ordered pair is a D-basis"
      responsibility: correctness
      disposition: derived
    - claim: "PreAdmit/PostAdmitDecode polynomial cost"
      responsibility: runtime
      disposition: derived
    - claim: "bounded honest P and basis rejection sampling"
      responsibility: success_probability
      disposition: derived_conditional_on_BaseGen
    - claim: "normalized degree-two sender quotient has kernel <U+sV>"
      responsibility: interface
      disposition: derived
    - claim: "same exact ciphertext implies same slope and message"
      responsibility: correctness
      disposition: derived
    - claim: "correct evaluated pair returns actual selected message"
      responsibility: correctness
      disposition: derived_conditional_on_Eval2
    - claim: "recipient Eval2 exists uniformly in polynomial bit complexity"
      responsibility: feasibility
      disposition: open_separate
    - claim: "no security or wider-family conclusion leaks from the repair"
      responsibility: scope
      disposition: enforced
  not_applicable_reason: null
