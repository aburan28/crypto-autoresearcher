artifact: honest_keygen_compatibility
status: derived_conditional
base_parameter_interface:
  name: BaseGen
  output: >-
    p,a,b and the exact E0/F_(p^2) model together with a complete represented,
    domain-labelled, evaluable O=End(E0) and its multiplication table.
  required_slice: >-
    p>3 prime, p=3 mod 4, D=2^a, N=5^b, a>=2, b>=1,
    v2(p+1)=a, v5(p+1)=b, and N>4D.
  failure_symbol: epsilon_base(lambda)
  boundary: >-
    This task does not construct the inherited full End(E) representation or
    prove an asymptotic prime sampler.  Compatibility below is for every
    BaseGen output satisfying the exact predicate; autonomous BaseGen remains
    open in O1/O2.
uniform_point_sampler:
  name: UniformPoint
  algorithm: >-
    Let q=p^2.  Draw uniformly j in {0,...,2q+1}.  j=0 returns O and j=1
    retries.  Otherwise decode j-2 as (x,c) in F_q x {0,1}; retry when
    x^3+x is nonsquare, choose root sign c when it is a nonzero square, and
    for zero output y=0 only for c=0.  Conditional on acceptance, each point
    of E0(F_q), including O, has one accepting preimage and is exactly uniform.
  acceptance_probability: "#E0(F_q)/(2(q+1))=(p+1)^2/(2(p^2+1))>1/2"
  bounded_failure: "at most 2^(-t_R) after t_R independent attempts"
  cost: "expected polynomial in log p using exact field square-root and group arithmetic"
keygen:
  public_key: [exact_pp, E0, P, ordered_U, ordered_V]
  secret_key: [represented_evaluable_O, public_key]
  algorithm: |
    h_N=(p+1)/N; h_D=(p+1)/D.
    Repeat at most t_P times: R<-UniformPoint(t_R); P=[h_N]R;
      accept P iff OrdN(P).
    Repeat at most t_B times: R1,R2<-UniformPoint(t_R);
      U=[h_D]R1; V=[h_D]R2;
      accept the ordered pair iff OrderedBasisD(E0,U,V).
    Canonically serialize and bind (E0,P,U_role,U,V_role,V).
  distribution_facts:
    - >-
      E0(F_(p^2))=E0[p+1] is isomorphic to (Z/(p+1)Z)^2; exact valuations make
      [h_N] and [h_D] uniform projections onto E0[N] and E0[D].
    - "A uniform E0[N] point has exact order N with probability 1-5^(-2)=24/25."
    - >-
      A uniform ordered pair in E0[D]^2 is a basis with probability
      |GL_2(Z/2^a Z)|/2^(4a)=(1-1/2)(1-1/4)=3/8.
  failure_bound: >-
    epsilon_KG <= epsilon_base(lambda) + (t_P+2*t_B)*2^(-t_R)
    + (1/25)^t_P + (5/8)^t_B.
  retry_cost: >-
    Conditional expected torsion candidate counts are 25/24 for P and 8/3
    ordered pairs for (U,V), plus the constant expected cost of UniformPoint.
honest_encrypt:
  messages: "m in {0,...,2^k-1}"
  randomness: "uniform r in {0,...,2^(a-k)-1}"
  slope: "s=m+2^k*r in {0,...,D-1}"
  algorithm: |
    K=U+[s]V.
    Starting from (E0,K,P), for i=1,...,a take the normalized degree-two
    Velu quotient whose kernel is generated by the unique nonzero order-two
    point in the current <K>; transport K and P after each step.
    Output ct=(C,X), the exact final curve and transported P.
    Erase the chain/composite map; it is not ciphertext or recipient advice.
  exact_properties:
    - "K has exact order D because its U-coordinate is the unit 1 in the admitted basis."
    - "The composite f_s is separable of exact degree D and ker(f_s)=<U+sV>."
    - "gcd(D,N)=1 makes f_s injective on E[N], so X=f_s(P) has exact order N."
    - "C is isogenous over F_(p^2), has q-Frobenius [-p], and #C(F_(p^2))=(p+1)^2."
    - "Every honestly generated (pk,ct) passes PreAdmit."
  cost: "O(a) normalized degree-two quotient/evaluation steps and polynomial bit complexity"
  failure_probability_after_valid_key: 0
kernel_to_image_order_lemma:
  statement: >-
    For any homomorphism f with ker(f)=<U+sV> on an admitted ordered E[D]
    basis, f(V) has exact order D and f(U)=-[s]f(V).
  proof: >-
    If [n]f(V)=O then nV=z(U+sV) for some z mod D.  Comparing U-coordinates
    in the basis gives z=0, then comparing V-coordinates gives n=0 mod D.
    Also f(U+sV)=O gives f(U)=-[s]f(V).
overall_correctness_failure_bound: >-
  Conditional on BaseGen and a semantically correct Eval2, honest encryption
  and decoding add no probabilistic failure.  The declared bound is therefore
  epsilon_KG above plus the separately declared evaluator failure
  epsilon_eval; epsilon_eval is not bounded by this task.
separately_open:
  - "autonomous BaseGen for the complete evaluable endomorphism-ring representation"
  - "exact calibrated recipient map construction"
  - "uniform bit-polynomial two-point Eval2 returning f(U),f(V)"
claims_not_made: [security, novelty, practicality, deployment, finalist_status]
