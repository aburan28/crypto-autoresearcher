format: scheme-construction-contract/v1-delta
task_id: TASK-20261006-04e1d5
goal_id: GOAL-SSI-2fa82a
primitive: pke
scope: one canonical admission and actual-message decoder repair
security_claims: []
domains:
  public_parameters: "exact p,a,b,D,N,k,Fp2_i_v1 and registered E0 model"
  public_key: "exact (E0,P,ordered U,V) bytes"
  secret_key: "represented/evaluable O=End(E0), plus the public key"
  message: "{0,...,2^k-1}"
  ciphertext: "exact (C,X) bytes"
  encoding_and_equality: "literal canonical bytes; full signed points"
obligations:
  O1:
    name: exact_hard_problem
    status: open
    delta: >-
      The repaired interface fixes one exact parameter slice and distinguishes
      the complete evaluable O from an abstract order, ideal, connecting map,
      or Hom module.  It does not define a complete EndRing challenge sampler,
      output equivalence, real-key distribution argument, or conversion theorem.
    instance_sampler: "BaseGen remains an explicit inherited interface"
    adversary_input_and_auxiliary_data: "public pp, E,P,U,V and ciphertext C,X; no connection/map/orientation/advice"
    solution_representation_and_success_predicate: "not supplied by this admission task"
    retained_gaps: [base_prime_family_sampler, complete_evaluable_EndE_generation, exact_EndRing_game]
    next_action: "do not address O1 until functionality and the evaluator obligation are separately resolved"
  O2:
    name: honest_party_algorithms
    status: open
    delta: >-
      Conditional on BaseGen, exact point/basis KeyGen has an explicit retry
      bound and honest Encrypt is an O(a) normalized two-isogeny chain.  Public
      PreAdmit and post-evaluation decoding are polynomial.  Recipient Eval2
      remains unavailable, so the complete honest-party algorithm set is open.
    algorithms: [UniformPoint, KeyGen_rejection_sampling, Encrypt_2_isogeny_chain, PreAdmit, PostAdmitDecode]
    preprocessing_and_retry_costs: "epsilon_KG and expected 25/24, 8/3 candidate counts are explicit"
    unavailable_subroutines: [BaseGen_complete_EndE, exact_calibrated_map, uniform_two_point_Eval2]
    complexity_guarantee: "all added admission/sender/decoder work is polynomial; missing Eval2 has no bound"
    next_action: "separately rerank, but do not automatically launch, the evaluator obligation"
  O3:
    name: quantified_correctness
    status: open
    delta: >-
      The task gives per-admitted-key injectivity and perfect decoder
      correctness conditioned on a correct Eval2 return.  KeyGen failure is
      bounded explicitly.  Full PKE correctness remains open because
      epsilon_eval is unbounded and BaseGen is inherited.
    statement_and_quantifiers: "for every admitted key/message/randomness, correct Eval2 output implies Dec=message"
    probability_space: "BaseGen, bounded KeyGen sampling, uniform r, evaluator coins"
    per_key_or_average_guarantee: "per admitted key after sampling succeeds"
    failure_probability_bound: "epsilon_KG + epsilon_eval; epsilon_eval open"
    actual_message_or_key_recovery: "actual selected m, not an orbit or auxiliary value"
    exceptional_inputs: [malformed, admission_failure, evaluator_failure, decoder_failure, detectable_wrong_key]
    next_action: "supply Eval2 and its failure theorem before claiming full correctness"
  O4:
    name: functionality_mechanism
    status: open
    delta: >-
      The public sender operation is now explicit and the private endpoint is
      exactly two evaluated images followed by a checked slope decoder.  The
      recipient lift itself remains the separately named missing operation.
    public_operation: "m,r -> s -> normalized quotient f_s -> (C,f_s(P))"
    private_operation: "Eval2(O,E,C,P,X,U,V) -> (f(U),f(V)), then PostAdmitDecode"
    agreement_or_message_binding_lemma: "unique exact map + kernel slope + image order + 2-power decode"
    extra_recipient_secrets: [represented_evaluable_O_only]
    recipient_lift:
      applicability: true
      interface: uniform_two_point_Eval2
      inputs: "O,E,C,P,X,D,N,U,V and exact encodings"
      output_representation_and_equivalence: "two exact points A0,B0 on the exact C"
      uniqueness_or_acceptance_condition: "degree D, f(P)=X, ker(f)=<U+sV> for the honest relation"
      polynomial_algorithm_and_cost: open
      failure_bound: open
      recovery_of_actual_message_or_key: "proved conditionally: A0,B0 -> actual m"
      identical_public_data_control: "a supplied correct evaluator lets any holder decode; it is not constructed here"
    next_action: "keep exact-map/two-point evaluation separate and open"
  O5:
    name: correctly_directed_security_reduction
    status: open
    delta: >-
      None.  An EndRing/evaluator solver followed by this decoder is only a
      solver-to-decrypt attack upper bound.  No IND-CPA adversary is converted
      into an EndRing solution; embedding, simulation, extraction, advantage
      loss, and model are absent.
    reductions: []
    intermediate_assumptions: []
    next_action: "only after functionality, define a game and attempt the correctly directed adversary-to-EndRing reduction"
  O6:
    name: complete_adversarial_view
    status: open
    delta: >-
      Exact encodings, rejection tags, P/order, basis/pairing, model/sign,
      image-order, wrong-key, and supplied-evaluator controls are now explicit.
      Ciphertext authentication, repeated-use leakage, side channels, and a
      complete security-game view remain outside this repair.
    public_disclosures: [p,a,b,D,N,k,E,P,U,V,C,X,canonical_tags,admission_failures]
    validation_rejection_and_failure_observables: "five failure classes are tagged; constant-time behavior is not claimed"
    malformed_inputs_and_alternate_encodings: "noncanonical and x-only encodings reject"
    repeated_use_and_collision_analysis: "exact honest relation is injective in (m,r); security consequences not assessed"
    public_data_and_known_false_controls: [P_zero, lower_order_P, V_zero, dependent_basis, weak_pairing, retagged_model, x_only_X, supplied_evaluator]
    concrete_parameter_security: not_assessed
    next_action: "complete only after a full candidate and security game exist"
assessment:
  verdict: candidate
  disposition: positive_scoped_interface_repair
  finite_functionality_status: "conditional on a supplied correct evaluator; prior exponential reconstructions are not upgraded"
  efficient_functionality_status: "open at uniform two-point Eval2"
  security_status: unresolved
  open_obligations: [O1, O2, O3, O4, O5, O6]
  independent_review_artifacts: []
  official_state_transition_record: null
scope_guards:
  evaluator_constructed: false
  solver_to_decrypt_is_security_reduction: false
  security_novelty_practicality_deployment_claim: false
  family_closed_or_impossible: false
  retained_hypotheses: [H-SSI-072490, H-SSI-1ed6df, H-SSI-4a0c67]
  scientific_runs: 0
