definitions:
  public_key: "fixed exact bytes (pp,E,P,U,V) passing key admission"
  ciphertext: "exact canonical bytes ct=(C,X)"
  honest_relation: >-
    Rel(pk,ct,m,r,f) holds when s=m+2^k r is in [0,D), f:E->C is the exact
    normalized separable degree-D homomorphism, ker(f)=<U+sV>, f(P)=X, and
    every model and point uses the canonical bytes bound by pk and ct.
  evaluator_contract: >-
    Eval2 returns A0=f(U), B0=f(V) for that exact f, or a tagged failure.  This
    contract is a premise and is not constructed or locally certified here.
lemma_unique_map:
  statement: >-
    If f,g:E->C have degree at most D on the same exact labelled models,
    ord(P)=N, N>4D, and f(P)=g(P)=X, then f=g.
  derivation: >-
    For nonzero h=f-g, P lies in ker(h), hence N<=deg(h).  The positive
    definite degree norm gives deg(f-g)<=2deg(f)+2deg(g)<=4D, contradiction.
  limit: "Identifiability only; it supplies no map or evaluation algorithm."
lemma_kernel_slope:
  statement: >-
    For an ordered Z/DZ-basis (U,V), equality
    <U+sV>=<U+tV> implies s=t mod D.
  derivation: >-
    Equality of cyclic order-D subgroups gives U+sV=z(U+tV) for a unit z.
    Comparing U-coordinates gives z=1 mod D; comparing V-coordinates gives
    s=t mod D.
theorem_ciphertext_injectivity:
  quantifiers: >-
    For every admitted pp and fixed admitted pk, for all allowed m,m',r,r'
    and exact witnesses f,g, if Rel(pk,ct,m,r,f) and Rel(pk,ct,m',r',g) for
    the same exact ciphertext bytes ct, then m=m' and r=r'.
  proof: >-
    Exact ciphertext equality gives the same exact C and full signed X.
    Unique-map gives f=g; equal maps have equal kernels; kernel-slope gives
    s=s' mod D.  Both slopes lie in [0,D), hence s=s'.  The canonical mixed
    radix representation s=m+2^k r is unique, so m=m' and r=r'.
  x_only_limit: >-
    Replacing X by x(X) invalidates the premise: f and -f share x(X).  The
    full signed canonical point is the separating conjunct.
theorem_image_order:
  quantifiers: >-
    For every admitted basis, every s mod D, and every f with
    ker(f)=<U+sV>, B0=f(V) has exact order D and A0=f(U)=-[s]B0.
  proof: >-
    If [n]B0=O, then nV=z(U+sV).  Basis-coordinate comparison first gives
    z=0 and then n=0 mod D.  The second equality is f(U+sV)=O.
theorem_actual_message_decoder:
  quantifiers: >-
    For every admitted honest relation with s=m+2^k r and every semantically
    correct evaluator output A0=f(U),B0=f(V), PostAdmitDecode returns exactly
    the selected m and does not return a different message.
  proof: >-
    Image-order gives ord(B0)=D.  Thus H=[2^(a-k)]B0 has exact order 2^k.
    From A0=-[s]B0, G=-[2^(a-k)]A0=[s]H=[m]H because 2^k H=O.  The binary
    digit loop uniquely recovers the scalar in [0,2^k), and the final equality
    rechecks it.
  cost: "O(a+k^2) group operations after the two evaluator outputs"
theorem_combined_honest_correctness:
  probability_space: "BaseGen and bounded KeyGen coins, uniform encryption r, and evaluator coins"
  statement: >-
    For every valid BaseGen output and every allowed m, conditioned on KeyGen
    success and on Eval2 returning the correct A0,B0, Dec returns m.
  failure_bound: "epsilon_base + (t_P+2*t_B)2^(-t_R)+(1/25)^t_P+(5/8)^t_B+epsilon_eval"
  unresolved_term: "epsilon_eval has no bound in this task because exact-map/two-point evaluation remains open"
