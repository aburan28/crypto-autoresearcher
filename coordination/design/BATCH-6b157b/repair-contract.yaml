protocol_repair_contract:
  task_id: TASK-20260908-2e3475
  decision_id: DEC-20260908-2b80aa
  experiment_id: EXP-ECDLP-9cd134
  hypothesis_id: H-ECDLP-c9e189
  derived_from_idea: IDEA-20260815-66496a
  governing_question: RQ-SDEG-001
  governing_goal: GOAL-SDEG-001
  disposition: revise
  purpose: Complete a full-scope additive successor protocol for operation counting and timing on the governing S3/S4 decomposition panel, without representing these repair requirements as an already frozen scientific specification.
  scientific_execution_authorized: false
  implementation_authorized: false
  current_task_budget:
    maximum_runs: 0
    maximum_memory_gb: 4
    maximum_workers: 1
    wall_clock_seconds: null
    total_cpu_hours: null
  source_binding:
    packet: coordination/design/BATCH-6b157b/source-packet.json
    supplement: coordination/design/BATCH-6b157b/source-supplement.json
    access: Parent-transmitted actual source reads; bind exact source-packet hashes and contemporary authority when drafting the successor. No code, version, verifier, fixture or execution hash is invented here.
    paths:
      - ledger/proposals/IDEA-20260815-66496a.yaml
      - ledger/hypotheses/H-ECDLP-c9e189.yaml
      - experiments/EXP-ECDLP-9cd134/specification.yaml
      - ledger/questions/RQ-SDEG-001.yaml
      - ledger/goals/GOAL-SDEG-001.yaml
      - coordination/goals/GOAL-SDEG-001/batches/BATCH-001/tasks/TASK-20260725-641/scaling_protocol.yaml
