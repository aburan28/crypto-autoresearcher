  immutable_boundary:
    - Preserve all original hypothesis/experiment/idea/goal/evidence/protocol records and their historical status and assertions.
    - Allocate any successor IDs with the required allocator and create additive records; this repair task allocates no experiment, implementation, review or launch task.
    - Do not replace the full study with a synthetic counter calibration, S3-only implementation, Gröbner timer or easier candidate.
  authority_gates:
    protocol_review_first: >-
      RQ-SDEG-001 requires independent protocol review before implementation
      or experiment. First complete the successor scientific contract and
      commit a prospective independent review plan with real sessions and
      required inference policy. No immediate zero-run code-preparation
      handoff may bypass this protocol-review gate.
    contemporary_activation: >-
      Re-read current goal heads, decisions, execution claims and gate-discharge
      artifacts before admission. Determine the actual status of verifier
      hash, fixtures, sealed schedules and other residuals from current
      evidence. The historical design-PASS/no-measurement notes neither
      discharge these gates nor establish their current global state.
    later_sequence: Complete full contract; snapshot; independent protocol review; Coordinator disposition; only then consider bounded implementation and actual verifier/fixture admission; separate locked execution authorization and later evidence review remain required.
    user_authorization: Already satisfied by standing AGENTS.md authorization. Missing technical readiness is repaired or documented; no repeated user confirmation or funding veto.
  mandatory_scope:
    ladder:
      - {family: S3, m: 2, requested_prime_bits: 8, factor_base_cap: 16}
      - {family: S3, m: 2, requested_prime_bits: 10, factor_base_cap: 24}
      - {family: S3, m: 2, requested_prime_bits: 12, factor_base_cap: 32}
      - {family: S3, m: 2, requested_prime_bits: 16, factor_base_cap: 48}
      - {family: S3, m: 2, requested_prime_bits: 20, factor_base_cap: 64}
      - {family: S3, m: 2, requested_prime_bits: 24, factor_base_cap: 80}
      - {family: S4, m: 3, requested_prime_bits: 8, factor_base_cap: 12}
      - {family: S4, m: 3, requested_prime_bits: 10, factor_base_cap: 16}
      - {family: S4, m: 3, requested_prime_bits: 12, factor_base_cap: 20}
      - {family: S4, m: 3, requested_prime_bits: 16, factor_base_cap: 24}
    factor_base_size: min(the listed cap, floor(p/4)); preserve the governing factor-base membership/lift/certificate interface and explicitly select its authorized semantics.
    tier_boundary: The source ladder has a 32-bit hard tier cap with later review required for a new tier; this does not authorize expanding the current listed ten cells to 32 bits.
    instances: At least 20 instances in every declared size cell. Freeze one exact count in the successor, retaining the original requirement of at least four prime sizes for each reported scaling comparison. The listed minimum is 200 EC system instances before paired curve-free controls, modes or calibration factors; it is not a run count.
    matched_controls: Curve-free systems matched in variables, degree and sparsity use the same solver. Mandatory matched rho/BSGS controls, independent decomposition certificates and all nine governing conservation controls remain included.
    treatment_factors:
      workload_multipliers: [1, 2, 4, 8, 16]
      pinned_core_load_burners: [0, 1, 2, 4]
      primitive_types: [M, S, I, A]
      execution_modes: [timing, counting]
      pairing: Timing and counting are separate processes on identical sealed base instances/seeds and the identical pinned solver algorithm/domain. Do not derive different systems from the measurement-mode label.
    change_control: Any different ladder or omission of S4/baselines needs an explicit justified additive scope/authority decision against the governing protocol; no silent simplification is permitted by this contract.
  repair_requirements:
    - id: R1_AUTHORITY_AND_SOURCE
      defect: Design-only records and historical preliminary design PASS do not approve this measurement or discharge current activation requirements.
      required_artifact: A contemporary authority/source matrix pinning the full relevant scaling-protocol sections, current goal/decisions and each activation residual's actual discharge or remaining defect.
      acceptance: Independent-protocol-review-first is preserved, each source is hash-bound with actual reader provenance, and no old note is represented as a current global execution/gate audit.
    - id: R2_FIXTURES_AND_PANEL
      defect: Exact realized prime/curve/target/factor-base and S4 fixtures are absent; the existing nextprime generator does not itself assert the requested output bit length.
      required_artifact: A deterministic full ten-cell fixture-generation/certificate specification, bit-length assertions, admissibility/rejection rules, factor-base/lift semantics and sealed fixture manifest procedure.
      acceptance: No fixture is tuned to solver performance; every rejection/insufficient factor base is retained without favorable replacement; exact group/order/lift checks and charged generation work are defined before execution. Requested and actual bit lengths are separately recorded.
    - id: R3_ALGORITHM_AND_DOMAIN_PINS
      defect: Existing S3 measurement invokes sympy.groebner with grevlex but has no explicit solver method/version/domain backend pin or operation hooks; there is no S4 measurement function in the inspected file.
      required_artifact: Source-backed selection of an actual SymPy version, exact algorithm/method and coefficient domain/backend, variable/monomial orders, S3/S4 construction and all hooks along the real call path, with exact code/dependency hashes at later admission.
      acceptance: Inspect the actual chosen implementation before claiming hook coverage. Timing/counting follow the same mathematical algorithm and branch semantics; counters do not silently select another backend. S4 resultants use the governing simultaneous-substitution interface and receive equivalent measurement support.
      supplemental_source: Parent found repository requirement sympy>=1.12 and locally installed1.14.0; installed groebnertools chooses mutable polyconfig when method=None. These are observed source/environment facts, not an approved version/method/backend selection.
      backend_selection_source: Parent-read finitefield.py _modular_int_factory selects flint nmod/fmpz_mod for prime moduli when available and otherwise ModularIntegerFactory. Bind the actually selected backend before relying on Python hooks; no field/solver instance was executed to identify an active backend in this review.
    - id: R4_COUNTER_SEMANTICS
      defect: No declared frozen weights, complete coefficient-operation boundary, inversion/square treatment or proof of hook coverage exists in the pending contract.
      required_artifact: A typed M/S/I/A event specification with exact entry/exit boundaries, reductions, square detection, inversion expansion policy, batch/reuse behavior and a coverage map of every arithmetic route and shared library.
      acceptance: Preserve raw four-type vectors. Freeze any supplementary positive-weight statistic before data; state units and sensitivity assumptions. No double counting between an I API event and expanded internals, no unsupported claim that wall profiling bounds omitted arithmetic, and no scalar weighted statistic replacing the governing resource vector.
      required_bypass_audit: Parent-read modularinteger source has __truediv__ multiplying val by _invert(val) without __mul__, __pow__ using modular pow directly, and __rtruediv__ combining inversion with __mul__. Audit these bypass/double-count paths in the actually selected backend; do not assume this class is active or that a __mul__ wrapper certifies coefficient-operation coverage.
    - id: R5_ALL_TYPE_CALIBRATION
      defect: A schoolbook multiplication loop alone may exercise only M and A and cannot certify S/I hooks or arbitrary dynamic-range behavior.
      required_artifact: Exact independently predicted calibration programs/formulas for all four event types across multipliers 1,2,4,8,16, with actual polynomial degrees/loop bounds, nonzero inversion operands, exceptional branches and an independent finite count oracle.
      acceptance: Derive expected counts from the frozen program, not observed counters; include deliberate omission/double-count faults that must be detected. Preserve exact dynamic-range and bit-identical-under-load predictions; source inspection and independent protocol review precede implementation.
    - id: R6_CURVE_FREE_MATCH
      defect: Matched variables/degrees/sparsity alone do not uniquely isolate elliptic structure or define an executable null generator.
      required_artifact: A frozen deterministic curve-free construction with exact support/degree/coefficient matching, nondegeneracy/rejection rules, pairing to every EC instance and the same solver/backend.
      acceptance: Record realized matches and failures without favorable resampling; no unproved equal solving complexity. A matching response constrains this pair of families and does not prove a unique non-EC cause.
    - id: R7_SEED_AND_COUNT_RECONCILIATION
      defect: Five declared seed labels, 20 independent instances, seeds_per_cell20 and a 240-run estimate do not define a unique schedule; the stated SHA256 domain lacks master/tuple byte binding.
      required_artifact: A sealed seed table and exact job/cell formula specifying which factors apply to calibrators, EC/curve-free systems and baselines, paired timing/counting, workload/load conditions and repeats. Pin master mapping and domain-separated byte encoding including lengths/order/rejection behavior.
      acceptance: Preserve [0,1,2,3,4] and at least20 instances per size without silently turning them into 100 or reusing 240 as a sample cap. Define how the five masters map to instance indices. Base fixture seeds exclude measurement mode/load; separate domains govern null generation and scheduling. Distinguish instances, physical processes, repeated conditions, jobs and attempts; archive exact counts before launch.
    - id: R8_TIMING_LOAD_AND_BOUNDARY
      defect: Load timing targets and boundary profiling are not defined as executable controlled measurements; a boundary-time fraction does not certify counter completeness.
      required_artifact: A fixed native-host CPU affinity/topology and burner program/schedule, warmup/repeat/order policy, timer/RSS method and operation-boundary profile definition with exact numerator/denominator and paired-load handling.
      acceptance: Keep load levels0,1,2,4, monotone wall-time and highest-load factor>=1.5 as measured targets, not guaranteed facts. Retain ratio wall/weighted-ops monotonicity and factor>2 across size as a separate finite hypothesis target. Boundary fraction>0.5 triggers the original size exclusion only for designated slope summaries; retain excluded data and reasons. Fewer than four eligible sizes leaves that family slope claim inconclusive.
    - id: R9_PAIRED_STATISTICS
      defect: Agreement within +/-0.05 and disjoint marginal slope intervals can both hold; pairing and bootstrap rules are unspecified.
      required_artifact: Per-family definitions of local log-p slopes of instance medians, paired delta, exact shared-instance 2000-bootstrap indices/seed/percentile rule, exclusions and nonpositive/missing-value branches.
      acceptance: Use mutually exclusive paired-delta decisions specified below; preserve marginal intervals and their disjointness as diagnostics. No independent resampling of timing/counting or mixing S3/S4 sizes. Report sample/size counts and finite scope without machine-dependence proof from one host.
    - id: R10_FULL_RESOURCE_VECTOR
      defect: Existing elapsed time covers only Gröbner construction; decomposition enumeration/lifting/checking occur afterwards, and fixture/search costs are separate.
      required_artifact: Stage-wise counters, wall/CPU, memory, allocation/data/certificate/communication bytes and success/failure accounting for setup, relation_collection, linear_algebra, descent, verification and shared overhead, explicitly mapping this decomposition workflow to those governing stages.
      acceptance: Charge factor-base/fixture search, order/certification, equation/resultant construction, Gröbner work, basis analysis, tuple enumeration, lifts/signs/point sums, rho/BSGS, independent checking and serialization. Distinguish timed subroutine from full decomposition. Unsupported stages are explicit interface obligations or justified NA, never zero. Supplementary weightedops never replace the lawful governing ICEX numerator.
    - id: R11_CERTIFICATES_AND_CONSERVATION
      defect: The existing verifier shares EllipticCurve implementation with the producer; its name is not evidence of independent authorship/runtime or complete certificate contract compliance.
      required_artifact: Exact source-bound certificatecontract1.0.0-review interface, genuine independent verifier implementation/review/hash, all nine conservation-control definitions and known-false cases, plus matched rho/BSGS correctness and cost certificates.
      acceptance: Obtain actual independent protocol review first, then actual verifier/fixture hashes and a contemporary gate-discharge decision. No independent status inferred from function names, old fallback reviews or preliminary theory-only EV records.
    - id: R12_RUNTIME_AND_ARTIFACTS
      defect: Process tree, aggregate memory, checkpoints, complete artifact filenames and launch-lock/admission data are not frozen.
      required_artifact: Exact native-host launcher contract and per-admission/run/summary filenames, with sealed code/fixture/seed/config/verifier hashes, exclusive launch/log/terminal receipts, checkpoints, stage/counter/profile/statistical tables and independent check reports.
      acceptance: Enforce aggregate8GiB across runner and four burner processes at maximum load; add any separate supervisor/solver process to maximum_workers explicitly rather than hiding it. Pin CPU affinity and read back resource guards. Wall watchdogs checkpoint and retain partial work; time/CPU estimates remain advisory. Hash manifests exclude self entries and use an acyclic graph with external archive binding.
  statistical_resolution:
    delta_definition: In the successor, fix orientation as timing local slope minus supplementary weighted-operation local slope on the same retained instance/size panel; paired resampling must preserve both values and each matched EC/null identity.
    agreement: Point estimate delta lies in [-0.05,0.05] AND the paired-delta interval is entirely contained in [-0.05,0.05].
    disagreement: Point estimate and the entire paired-delta interval lie strictly above0.05, OR both lie strictly below-0.05.
    inconclusive: Every other valid interval configuration, including boundary crossing or inadequate eligible sizes; missing/invalid measurements retain their separate reasons.
    marginal_interval_diagnostic: Preserve the original disjoint-marginal-interval observation as a reported diagnostic, not a competing primary category. A precise nonzero difference inside practical tolerance can still be agreement.
    target_failures: Valid failure of load monotonicity, factor1.5 or size-ratio factor2 is a finite target failure, not automatically instrument invalidity. Exact count mismatches, unsupported hooks or failed known-count controls are instrument validity defects.
  proof_search_map:
    bottleneck: Establish that observed counters cover the selected solver's coefficient arithmetic and that paired timing/count slopes describe the full governing finite panel with honest costs.
    baseline_embedding:
      parameter_slice: Known-count calibrators for each M/S/I/A event, plus matched certified rho/BSGS and all governing conservation controls.
      reproduction_check: Freeze independent expected counts and known-false fault controls before code; reproduce the full governing baseline interfaces after independent protocol review.
    observation_collision:
      observable: Equal weighted total, similar log-p slope, or low profiler boundary-time fraction.
      distinct_preimage_search: Distinct raw event vectors may share a weighted total; uncounted fast arithmetic may occupy little time; curve-free families may match coarse features while retaining different algebraic structure. Preserve typed vectors, coverage maps and paired family strata.
    quantifier_order: Fix full ladder, algorithms/hooks, fixtures/seeds, weights, calibrators, load schedule, statistical rules and certificate interfaces before measurements. Independent protocol review precedes implementation; current activation discharge precedes launch.
    method_ceiling:
      strongest_certifiable_claim: Finite calibrated operation accounting and paired timing/count behavior for the exact solver/backend, native host, S3/S4 and matched control panel.
      nearby_object_control: An instrument that counts schoolbook M/A correctly but omits inversion/squaring must fail all-type controls; two precise slopes differing by0.01 cannot be both practically agreed and primarily disagreed under the repaired rule. Neither equal curve-free slopes nor one-host timing discrepancy proves a unique structural/machine cause.
    constructive_transforms:
      - transform: specialization_pack
        description: Source-pin the exact solver/domain and derive complete typed event/count interfaces.
        proposed_object: Paired source-bound event accounting with independent finite oracles
        predicted_gain: A reproducible full-scope cost measurement, not an asserted asymptotic advantage.
    proof_obligations:
      - {claim: All typed arithmetic routes are covered and independently calibrated, responsibility: correctness}
      - {claim: Governing fixture/order/certificate/baseline/conservation interfaces are preserved, responsibility: interface}
      - {claim: Stage accounting covers full decomposition and independent checks, responsibility: runtime}
      - {claim: Aggregate process memory and data costs are explicit, responsibility: memory}
      - {claim: Finite observations are not extrapolated to global impossibility or unique causal attribution, responsibility: scope}
    not_applicable_reason: No asymptotic ECDLP improvement is asserted by this readiness review; finite counting and cost-interface obligations do apply.
  formalization:
    smallest_obligation: Once the actual calibration programs are fixed, define a finite trace over M/S/I/A events and prove concatenation/repetition preserves the declared per-type count recurrence and weighted sum; bind the chosen source hooks to that trace separately.
    missing_binding: The selected solver/backend, calibration degrees/programs, event semantics and implementation-to-trace refinement are not yet fixed. An abstract counting lemma cannot certify SymPy coverage, omitted work or decomposition correctness.
    revisit: After source inspection and complete protocol drafting, present precise trace/coverage statements to the required independent protocol reviewers; revisit formal implementation binding after permitted implementation. No global Lean/Mathlib absence claim.
  required_successor_deliverables:
    - Additive source-pinned hypothesis/experiment contracts preserving every mandatory study and governing interface above.
    - Exact fixture/seed/factorial-job and all-type calibration definitions, solver/domain coverage map, stage cost vector and certificate/baseline/conservation contracts.
    - Complete paired statistics, runtime/admission/failure artifacts, contemporary authority-residual matrix and preregistered independent protocol review plan.
    - Coordinator completion checklist mapping R1 through R12 to exact committed fields/paths; unresolved items remain technical defects rather than approval requests or false completed fields.
  ordered_ownership:
    - phase: 1_SOURCE_AND_DESIGN_NOW
      owner: Responsible Coordinator, with parent/control-plane source access as required by role permissions
      action: Inspect the source-pinned SymPy algorithm/domain call chain and actual coefficient representations; document an explicit proposed solver/method/backend selection, M/S/I/A event boundary and every bypass/delegation/double-count route. Complete the paired-delta decision schema alongside this source map. No solver, calibrator, fixture or measurement execution.
      acceptance_evidence: A source-located/hash-bound algorithm/domain and hook-coverage design table, typed event semantics and deterministic statistical decision fields addressing R3/R4/R9, with named unresolved source questions rather than invented complete instrumentation.
      blocking_boundary: Unknown future runtime, realized fixtures and verifier hashes do not block this source/design work. Do not repeatedly re-audit activation gates instead of completing the design.
    - phase: 2_FULL_SUCCESSOR_CONTRACT
      owner: Responsible Coordinator
      action: Complete every remaining R1-R12 field, including full ladder/baselines, exact seed/job/calibration tables, curve-free construction, costs, artifacts and prospective independent protocol-review plan; allocate additive record IDs and archive the exact design.
      acceptance_evidence: A field/path checklist for the full scope with source provenance and exact finite procedures. Runtime/fixture/verifier values remain explicitly typed later-admission outputs, not reasons to omit their specification or make up actual values.
    - phase: 3_INDEPENDENT_PROTOCOL_REVIEW
      owner: Genuinely independent reviewers under the required policy and precommitted Coordinator review plan
      action: Review the complete archived protocol and worked known-false/coverage attacks before any implementation is dispatched.
      acceptance_evidence: Actual independent session/access/policy receipts and scoped reports, followed by a committed Coordinator disposition. No retrospective independence attribution.
    - phase: 4_IMPLEMENTATION_AND_LATER_ACTIVATION
      owner: Executor after protocol-review admission; independent verifier/review owners and Coordinator for activation
      action: Only after the preceding gate, implement the reviewed full protocol and establish actual verifier/fixture/code/runtime hashes and contemporary activation discharge before separately authorized measurements.
      acceptance_evidence: Genuine implementation/review/archive receipts, verified sealed data and resource guards, and a locked execution handoff. Historical no-measurement/design-PASS notes cannot substitute.
  stage_gate_mapping:
    interpretation_of_R1_through_R12: Each requirement separates a design specification from the evidence later produced by implementing or executing that specification. References to actual new verifier/code/fixture hashes or runtime receipts in R11/R12 and elsewhere are later implementation/activation obligations, not prerequisites for submitting the complete design to protocol review.
    design_acceptance:
      required_now: Every R1-R12 item must have a concrete source-backed protocol field, exact algorithm/control/measurement choice, interface or deterministic procedure, acceptance test, responsible role and named later evidence artifact. Fix the actual proposed solver method/backend, source callgraph and justified hook semantics, complete calibration programs, fixture/seed rules, counters, weights, statistical decisions, certificate/verifier specification and runtime guards before protocol review.
      R11_boundary: Supply the complete independent-verifier/certificate interface, mathematical checks, all conservation/baseline controls, independence plan and required future hash-binding procedure. A newly implemented verifier, its completed independent review and actual executable hash are not required to make this design reviewable.
      R12_boundary: Supply the exact launcher/resource/checkpoint/artifact contract and admission/readback procedure. New implementation hashes, realized fixture bytes and observed runtime receipts are not required before protocol review.
      not_deferred: Actual algorithm/backend choices, calibration formulas, controls, sample counts and scientific decision rules cannot be placeholders masquerading as future hash outputs. A source-backed coverage design argument is required now; empirical implementation validation is later.
    independent_protocol_review: Review the archived complete design and its source/coverage arguments in genuine independent sessions before any new implementation. The subsequent Coordinator disposition determines whether implementation may begin.
    implementation_acceptance: After protocol-review admission, require actual newly written source/verifier artifacts, implementation hashes and the specified independent implementation/checker reviews. An unimplemented interface or expected hash is not completed implementation evidence.
    execution_admission: Require actual certified fixtures, sealed seeds/code/config/verifier hashes, resource/admission receipts, contemporary authority discharge and the separately claimed locked execution plan. All outputs must conform to the frozen design; hashes record realized bytes and never authorize changing scientific choices.
  completion_gate: Protocol-design readiness requires DESIGN acceptance for every R1-R12 item under stage_gate_mapping, not the existence of newly implemented verifiers or observed runtime receipts. Independent protocol review still precedes implementation; implementation and execution admission require their actual later artifacts. This repair contract itself grants no implementation or measurement authority.
  next_action: Begin phase1 source/design now by tracing the selected SymPy FiniteField and polynomial-ring coefficient callgraph, including conditional backend delegation, to fix the proposed method/backend and M/S/I/A hook semantics and source-backed coverage table; complete the paired decision schema, then the same full ten-cell successor and independent protocol-review package. Do not wait for later runtime/fixture/verifier receipts or substitute an easier candidate.
