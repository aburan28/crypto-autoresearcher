blind_rederivation:
  format: ssi-j4-independent-rederivation/v1
  task_id: TASK-20261007-1eef05
  joint_owned: J4
  input_statement: coordination/design/TASK-20261007-8b5d55/tasks/TASK-20261007-efaa15/blind-control-statement.yaml
  input_statement_sha256: 451cdd03a1ffe3170cc30e645c94ada0520f9187c78351e5f11cd76709a173b1
  scientific_method: Independent symbolic derivation from the permitted bare definitions; no producer proof, implementation, prior review, sibling report, or external scientific source read.
  assumptions_and_quantifiers:
    - For every p>3 prime with p=3 mod 4, work over the specified F_(p^2), on the exact specified short-Weierstrass E and one fixed exact short-Weierstrass C.
    - D=2^a, N=5^b, a>=2, b>=1, v2(p+1)=a, v5(p+1)=b, N>4D, k=floor(a/2).
    - Messages satisfy 0<=m<2^k; randomness satisfies 0<=r<2^(a-k); s=m+2^k*r lies in [0,D).
    - Normalization always means pullback of the fixed target differential equals the fixed source differential. It is not normalization after an unspecified target isomorphism.
    - Each cross-message witness fixes one complete key, one exact target model, one actual map and one exact ciphertext; there is no existential re-selection of C or key between the two messages.
    - Every collision asserted below is conditional on the submitted existence of the indicated torsion points and normalized quotient. No BaseGen, evaluator, security, or construction claim is supplied.
  degree_and_observation_derivation:
    degree_form: |
      On Hom(E,C), set q(h)=deg(h) for a nonzero homomorphism and q(0)=0.
      Pullback of a symmetric degree-one divisor, with the group-addition
      divisor identity, gives q(f+g)+q(f-g)=2q(f)+2q(g).
      Both summands are nonnegative, so if q(f),q(g)<=D then
      q(f-g)<=4D and q(f+g)<=4D. These are separate bounds on the
      difference and sum; the sum cannot be omitted for an x-only observation.
    kernel_bound: |
      For any nonzero h with h(P)=O and ord(P)=M, the M distinct points
      of <P> lie in the geometric kernel. Therefore
      M<=#ker(h)(algebraic closure)=deg_sep(h)<=deg(h).
      This remains valid if h is inseparable; it never equates geometric
      kernel size with total degree without separability.
    signed_observation: |
      If f(P)=g(P), then (f-g)(P)=O. Either f=g, or
      M<=deg(f-g)<=4D. Thus M>4D suffices for uniqueness.
      M<=4D leaves this particular contradiction unavailable; it does
      not produce a collision or prove that uniqueness fails.
    x_only_observation: |
      On the SAME short-Weierstrass model in characteristic p>3, an affine
      x-coordinate determines the two points Q and -Q, because their y
      coordinates are the two roots of y^2=x^3+A*x+B. The dedicated
      infinity symbol denotes O alone. Consequently equality
      x(f(P))=x(g(P)) implies f(P)=g(P) or f(P)=-g(P).
      Apply the kernel bound to f-g in the first case and f+g in the
      second. For M=N>4D, the appropriate map is zero, so g=f or g=-f.
      If f and g are both normalized, g=-f is impossible:
      (-f)^*omega_C=-f^*omega_C=-omega_E, whereas g^*omega_C=omega_E.
      Since p>3, omega_E is not -omega_E. Hence f=g.
      In fact neither image can be O here: otherwise N<=deg(f)<=D.
    scope_limited_normalization_refinement: |
      There is an additional conclusion within the submitted parameter
      scope. Since DN divides p+1 and N>4D, p>=DN-1>4D.
      For simultaneously normalized maps, (f-g)^*omega_C=0.
      If f-g were nonzero, it would be an inseparable isogeny, whose
      degree is divisible by p and therefore at least p. This contradicts
      deg(f-g)<=4D<p. Thus at these exact parameters, exact fixed models,
      and simultaneous normalization, f=g even independently of P.
      This is confined to the stated low-degree/characteristic premises;
      it establishes no general impossibility or security claim. In
      particular removing exact N order does not establish a collision.
    kernel_consequence: |
      Once f=g, the two kernels coincide. With an actual ordered basis
      (U,V) of E[D], equality <U+sV>=<U+tV> implies
      U+sV=c(U+tV) for a unit c modulo D. Compare basis coordinates:
      c=1 mod D and s=t mod D. Both slopes are in [0,D), so s=t,
      and m=s mod 2^k is equal. This coordinate argument is precisely
      what the V=O and dependent-basis controls remove. It is not used
      to claim injectivity for their weakened inputs.
  exact_order_derivation:
    prime_power_separator: |
      For N=5^b, [N]T=O restricts ord(T) to 1,5,...,5^b.
      Within that membership set, [N/5]T!=O is equivalent to ord(T)=N.
      Thus it rejects O and every order M=5^j with j<b.
    image_order: |
      A separable degree-D isogeny has kernel of order D. For a point
      P of order M=5^j, its cyclic subgroup meets that kernel trivially,
      since gcd(M,D)=1. Restriction of f to <P> is injective, so
      ord(f(P))=M. Therefore the same exact-order separator rejects X.
    lower_order_precision: |
      C2 is instantiable only when b>=2; for b=1 there is no j with
      1<=j<b. For every permitted lower order M the original exact-N
      premise is absent. If M>4D, the observation bound still proves
      uniqueness using M. If M<=4D, that bound alone is inconclusive.
      The normalization/characteristic refinement above also applies
      throughout the submitted parameter scope. None of these cases
      turns a proof-premise control into an actual collision.
  control_checks:
    - id: C1_P_ZERO
      submitted_classification: proof_premise_control
      established_scope: |
        P=X=O passes [N]T=O and fails [N/5]T!=O. All other premises
        can be retained by the submitted degree-D valid-basis quotient.
        The order-N proof premise is removed; no pair of different maps,
        messages, or exact ciphertexts has been exhibited by this object.
      result: established_at_submitted_scope
    - id: C2_P_LOWER
      submitted_classification: proof_premise_control
      established_scope: |
        For every 1<=j<b, M=5^j divides N/5, so P and its equal-order
        image X pass membership and fail the exact-N separator.
        This removes the exact-N premise only. The M>4D alternative and
        the scope-limited normalization refinement must not be discarded.
        The statement expressly claims no exact ciphertext collision.
      result: established_at_submitted_scope
    - id: C3_V_ZERO
      submitted_classification: same_key_exact_ciphertext_cross_message_witness
      witness_id: W_V_ZERO
      same_key_model_normalization_degree: |
        Fix E,P,U,V=O and their role-tagged bytes once. Fix f as the
        normalized separable degree-D deterministic quotient by <U>.
        Fix its exact output C and signed X=f(P). The same f,C,X and
        full key are used in both relations; neither -f nor an isomorphic
        target model is substituted.
      accepted_weakened_predicate: |
        OrdD(U) holds. [D]V=O and e_D(U,O)^D=1 hold because V=O and
        e_D(U,O)=1. OrdN(P) is chosen and OrdN(X) follows from
        gcd(D,N)=1. The omitted OrdD(V) and primitive pairing tests
        both fail in the original predicate.
      different_messages_equal_bytes: |
        For a>=2, k>=1, so m0=0,m1=1,r0=r1=0 are permitted.
        Both K0=U+0*O and K1=U+1*O equal U as points. The sender
        chain, every quotient model, final map, and transported P
        are identical. Hence the complete ciphertext bytes agree.
      result: established_at_submitted_scope
    - id: C4_DEPENDENT
      submitted_classification: same_key_exact_ciphertext_cross_message_witness
      witness_id: W_DEPENDENT
      same_key_model_normalization_degree: |
        Fix E,P,U,V=U, one normalized separable degree-D quotient f
        by <U>, its exact C, and X=f(P). All labelled key and target
        bytes are common to the two messages.
      accepted_weakened_predicate: |
        OrdD(U) and OrdD(V) both hold. Alternation gives
        w=e_D(U,U)=1, so w^D=1 but w^(D/2)=1; the omitted primitive
        pairing test is exactly the failing original separator.
        OrdN(X) follows from OrdN(P) and gcd(N,D)=1.
      different_messages_equal_bytes: |
        For a>=4, k>=2 and m0=0,m1=2,r0=r1=0 are permitted.
        K0=U and K1=3U have exact order D and the same cyclic kernel,
        since 3 is a unit modulo 2^a. At each stage of the sender,
        the transported generators remain related by multiplication
        by 3. Their unique nonzero order-two point is identical.
        Thus each fixed normalized quotient formula and each exact
        next model agree, inductively giving the same f,C and X.
        Complete ciphertext bytes agree for different messages.
      result: established_at_submitted_scope
    - id: C5_WEAK_PAIRING
      submitted_classification: same_key_exact_ciphertext_cross_message_witness
      witness_id: W_DEPENDENT
      established_scope: |
        This is precisely the same fixed-key/map/model/degree witness
        checked in C4. The weakened condition w^D=1 accepts w=1;
        the exact primitive condition w^(D/2)!=1 rejects it.
        It is one reused witness, not a second independent object.
      result: established_at_submitted_scope
    - id: C6_WEAK_IMAGE
      submitted_classification: post_evaluation_observation_control
      algebraically_established: |
        Let q=2^(a-k), choose B of exact order D/2=2^(a-1), and set
        H=[q]B. For a>=4,k>=2, ord(H)=2^(k-1).
        Put s0=0 and s1=2^(k-1), with permitted messages m_j=s_j
        and r_j=0, and A_j=-[s_j]B. Both [D]A_j=O and [D]B=O hold.
        G_j=-[q]A_j=[s_j]H=O for both messages. Thus (G,H) are
        identical, and t=0 and t=2^(k-1) both lie in [0,2^k) and
        satisfy the final equation [t]H=G. Original OrdD(B) and
        Ord2k(H) reject these points. No correct-evaluator premise,
        honest-map collision, or exact ciphertext collision follows.
      unresolved_literal_assertion: |
        The statement says the checked binary digit loop returns0,
        but supplies no loop pseudocode or tie handling. When
        T=[2^(k-1)]H=O, the ordinary digit comparisons against O
        and T are identical. A zero-first convention returns 0.
        A convention that chooses the high bit in that final tie
        returns 2^(k-1); it also passes the supplied final check.
        An explicit deficient-order or ambiguity check can reject.
        All agree with ordinary correct decoding when H has exact
        order 2^k, because then T is nonzero and there is no tie.
        Therefore the given bare definition does not determine the
        precise weakened-input outcome. The observation collision is
        proved; the particular assertion returns0 is not established.
      falsifier_to_overstrong_inference: |
        Symbolically use the same digit loop as the zero-first loop
        on full-order inputs, but choose bit k-1=1 when its final
        comparison is O=T. On these G=O deficient-order inputs,
        all earlier bits are zero and the returned representative
        is 2^(k-1), whose product with H is O. This is a completion
        of the unspecified tie rule compatible with the supplied
        final verification, and falsifies an inference that that
        verification alone forces a return value of zero.
        This is a symbolic specification control, not an implemented
        loop, experiment, or assertion about the unread producer loop.
      result: partial_exact_loop_outcome_underdetermined
      needed_to_resolve: Bare loop pseudocode including deficient-order and equal-branch behavior; it must be supplied in a newly authorized blind input, not inferred from an unread producer implementation.
    - id: C7_SWAP
      submitted_classification: encoding_control
      established_scope: |
        Under the valid ordered basis, U and V are distinct: otherwise
        the pairing would be 1. Swapping their bound roles relative
        to the same frozen key changes the ordered full key bytes.
        A freshly bound swapped tuple is a different key and supplies
        no fixed-key witness. No stronger authentication is inferred.
      result: established_at_submitted_scope
    - id: C8_RETAG
      submitted_classification: encoding_control
      established_scope: |
        A changed bound field, curve or role tag either fails canonical
        parsing or disagrees in the complete encoded bytes. Equality
        of j-invariants, cardinalities or isomorphism classes does
        not imply equality of those bytes. No exact collision follows.
      result: established_at_submitted_scope
    - id: C9_X_ONLY
      submitted_classification: normalized_observation_control
      established_scope: |
        The plus/minus derivation above proves x-only equality forces
        f=g for every pair satisfying the submitted fixed-model,
        degree, normalization and ord(P)=N>4D premises. The pair
        f,-f shares a kernel but cannot both be normalized in p>3.
        Original serialization still requires signed X; that rule
        does not establish a necessary separator for these normalized
        cross-message claims. x-only bytes remain outside original
        PreAdmit; this control does not silently change its encoding.
      result: established_at_submitted_scope
    - id: C10_WRONG_RECEIPT
      submitted_classification: encoding_control
      established_scope: |
        Exact PRE byte binding rejects changed key/ciphertext bytes;
        exact target tags reject a merely isomorphic replacement;
        curve membership rejects an off-curve point. These are the
        detectable mismatches claimed. They say nothing universal
        about authentication of all possible wrong-key objects.
      result: established_at_submitted_scope
    - id: C11_SUPPLIED_EVAL
      submitted_classification: method_ceiling_control
      established_scope: |
        Given the same semantically correct A0,B0 and the public
        decoder inputs, any holder has the same group operations and
        checks available. Supplying an instance's correct pair is
        not an algorithm constructing that pair on the required
        input family and establishes no recipient-only advantage.
        No evaluator search or construction is performed here.
      result: established_at_submitted_scope
    - id: C12_REVERSED_ARROW
      submitted_classification: method_ceiling_control
      established_scope: |
        An EndRing/evaluator solver followed by decryption supplies
        an attack route if those steps are available. A security
        reduction in the claimed direction would instead use a
        scheme-game attacker to solve the target EndRing challenge,
        with embedding, simulation, extraction and loss accounting.
        Those are distinct arrows; the supplied route is not that
        security theorem. No missing theorem is asserted impossible.
      result: established_at_submitted_scope
  joint_assessment_reason: |
    The corrected x-only and exact-order classifications and all retained
    exact-ciphertext cross-message witnesses are established at their stated
    scopes. C6's observation collision and order separators are established,
    but its literal deterministic return value is underdetermined by the
    only permitted scientific input. That precise unresolved in-joint
    assertion makes the aggregate J4 verdict inconclusive. It does not
    refute the observation collision or invent a failure of an unread loop.
  requirements_to_evidence:
    - requirement: Blind independent derivation of plus/minus bounds, normalization, order-M separator and kernel consequences
      status: verified_complete_symbolically
      evidence: degree_and_observation_derivation and exact_order_derivation
    - requirement: Fixed-key exact-model normalized degree-D accepted weakened witnesses with different messages and equal full bytes
      status: verified_complete_symbolically
      evidence: C3_V_ZERO, C4_DEPENDENT and C5_WEAK_PAIRING
    - requirement: Nearest false V=O, dependent-basis and weak-order objects
      status: partial
      evidence: C3 through C6; C6 algebra complete, precise loop output requires an explicit tie rule
    - requirement: Own J4 only and preserve blindness; zero scientific, implementation, formalizer and experiment runs
      status: verified_complete
      evidence: Separate canonical review-attestation.yaml and runtime-session-receipt.json
  runs:
    scientific: 0
    implementation: 0
    formalizer: 0
    experiment: 0
  limitations:
    - No historical J1, J2 or J3 theorem is re-reviewed; no J5 finding or whole-claim verdict is supplied.
    - The C6 precise return claim needs a specified loop, not another reviewer's agreement or the producer's implementation.
    - No literature citation, runtime measurement, numerical example, BaseGen, evaluator, security, novelty or practical construction claim is supplied.
    - Symbolic specification alternatives are worked falsifiers of an overstrong inference, not reports of executed code.
