        "status": "supports_scoped_statement",
        "derivation": "With D=2^a prime to p and full geometric E[D], take basis A,B. Bilinearity/alternation give e(U,V)=e(A,B)^(u1*v2-u2*v1). If e(A,B) had order at most D/2, the nonzero (D/2)A would be in the radical, contradicting nondegeneracy. Thus primitive e(U,V) is equivalent to an odd, hence invertible, determinant. Rational U,V give rational pairing values by Galois covariance.",
