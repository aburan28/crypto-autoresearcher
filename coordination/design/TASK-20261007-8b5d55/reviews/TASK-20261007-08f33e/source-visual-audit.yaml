        "family": "degree-norm",
        "status": "supports_mathematics_with_locator_break",
        "derivation": "For f,g:E->C on the same source/target, if both are zero the formula is trivial; otherwise a dual of a nonzero map supplies fixed nonzero u:C->E. Apply the End(E) law to uf,ug and cancel deg(u)>0 using degree multiplicativity. Nonnegative total degree gives deg(f+/-g)<=2deg(f)+2deg(g)<=4D. A nonzero map killing an order-M point has M<=#ker(h)=deg_s(h)<=deg(h), including inseparable differences.",
