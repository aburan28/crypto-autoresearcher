blind_statement:
  id: BLIND-ENDRING-PKE-TORSION-20261005
  purpose: >-
    Re-derive a finite-level uniqueness quantity and the kernel-to-message
    interface from parameters only. This statement contains no producer result,
    route verdict, private decoder, or security assertion.
  objects:
    base_field: A finite field k with algebraic closure kbar.
    curves: Elliptic curves E and E_prime over kbar.
    degree: A positive integer D.
    torsion_level: A positive integer N with gcd(N, char(k)) = 1 and gcd(N, D) = 1.
    maps: >-
      Separable homomorphisms phi, psi in Hom(E, E_prime), each of degree D,
      represented only through their algebraic properties and action on E[N].
    full_action: >-
      Images of a basis P,Q of E[N] under each map, with equality meaning
      phi(P)=psi(P) and phi(Q)=psi(Q), hence identical action on all E[N].
    messages: A finite message set M.
    kernel_encoding: A possibly partial map EncK from M and public randomness to subgroup descriptions K.
    kernel_decoder: A possibly partial map DecK from recovered subgroup/kernel data and declared auxiliary input to M or failure.
  permitted_lemmas_to_prove_or_condition_on:
    - >-
      Torsion divisibility lemma: if delta in Hom(E,E_prime) kills all E[N],
      then delta = [N] composed with gamma for some gamma in Hom(E,E_prime),
      under the exact hypotheses the re-deriver states.
    - >-
      Degree-norm premise: the square-root degree norm on the relevant Hom
      space satisfies the triangle inequality. Derive, rather than assume, that
      sqrt(deg(phi-psi)) <= sqrt(deg(phi))+sqrt(deg(psi))=2sqrt(D), hence
      deg(phi-psi) <= (sqrt(D)+sqrt(D))^2=4D; record equality and
      characteristic caveats.
    - For nonzero gamma, deg([N] composed with gamma) = N^2 deg(gamma) >= N^2.
  quantities:
    - id: Q1
      statement: >-
        Determine whether identical full E[N] action and N^2 > 4D force
        phi=psi, exactly which lemmas make the implication valid, and what can
        and cannot be concluded at and below N^2=4D. Supply the equality
        collision [n] versus [-n] at N=2n, D=n^2 when char(k) does not divide
        2n; the n=1, N=2, D=1 cell is an allowed minimal control.
    - id: Q2
      statement: >-
        Given a public algorithm RecoverHom that reconstructs phi or ker(phi)
        from the public full action, state the exact arrows needed to output the
        original m. Decide conditionally whether recovery is public when EncK,
        DecK, validation, and all auxiliary values are public, and identify
        collisions or missing arrows otherwise.
    - id: Q3
      statement: >-
        Separate Q1's uniqueness from the distinct source-level algorithmic
        claim that an isogeny may be recovered when N^2>D under rationality,
        known-factorization, smoothness, kernel-rank, and curve-model
        conditions. Do not prove or cite that source claim here and do not turn
        either quantity into a security conclusion.
  quantifiers:
    - State for-all E,E_prime,D,N,phi,psi dependencies before the uniqueness implication.
    - State whether message recovery is for all m and allowed randomness or only for an injective encoded subset.
    - State every existence choice in divisibility, recovery, validation, and decoding.
  known_false_controls:
    - >-
      Actual equality collision: if char(k) does not divide 2n, the distinct
      endomorphisms [n] and [-n] on E have degree D=n^2 and identical action on
      E[N] for N=2n, since [n]-[-n]=[2n] kills E[2n]; thus N^2=4D. The n=1
      cell gives N=2 and D=1. Do not overstate this as nonuniqueness for every
      instance with N^2 <= 4D.
    - Unique phi or ker(phi) without an injective/stated DecK does not imply recovery of m.
    - Public RecoverHom plus public DecK is not a recipient-only trapdoor.
    - Partial, masked, noisy, nonsmooth, or nonrational torsion data are not full_action by definition.
  required_output:
    - A line-by-line derivation or an explicit missing lemma for Q1.
    - A typed composition diagram for Q2, including collision and undefined-map cases.
    - A boundary table separating uniqueness, algorithmic recovery, message recovery, and recipient-only advantage.
    - Per-control expected refusal and one concrete next mathematical obligation for every unresolved step.
  forbidden_inferences:
    - EndRing-based PKE is impossible.
    - A unique lift is secret or computationally hidden.
    - Robert's algorithm applies without independently checked conditions.
    - Recovery of a Hom element, path, kernel, witness, or branch is recovery of m without a typed decoder.
  scientific_inputs_allowed: []
  blind_from:
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/
    - coordination/design/TASK-20261005-638ca5/review-preparation/review-plan.yaml
    - coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/
    - analysis/ideation-RQ-SSI-1946c9-20261005/robert-torsion-boundary.md
    - producer or inter-agent messages
