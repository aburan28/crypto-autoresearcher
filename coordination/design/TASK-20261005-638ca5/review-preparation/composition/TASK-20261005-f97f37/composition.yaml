  joint_composition:
    J1:
      owner: TASK-20261005-a983cf
      verdict: holds
      composed_scope: >-
        Conditional finite-level uniqueness holds: identical full E[N] action
        and N^2>4D force equality of degree-D maps under the declared
        square-root-degree norm premise. This is neither a reconstruction
        algorithm nor a plaintext or security conclusion.
      controls_retained:
        - The admissible n=1, N=2, D=1 maps id and -id collide at N^2=4D, so strictness is necessary for this argument.
        - N^2<4D supplies no universal uniqueness or nonuniqueness conclusion.
      unresolved_obligation: Prove the positive-definite degree quadratic form/norm premise if the conditioning is to be removed.
    J2:
      owner: TASK-20261005-a983cf
      verdict: inconclusive
      composed_scope: >-
        The typed recovery chain requires realization, parsing, Hom/kernel
        recovery, extraction, validation, message separation, and a left-
        inverse decoder. The abstract statement supplies no instantiated total
        decoder; a unique Hom/kernel does not itself recover m.
      controls_retained:
        - A two-message collision can share one unique recovered map/kernel and therefore defeats an unstated decoder.
        - If RecoverHom and DecK are public, the same composition is public and does not establish recipient-only advantage.
      unresolved_obligation: Supply a typed message-separating left inverse and identify the private operation that makes it recipient-only.
    J3:
      owner: TASK-20261005-5cf08f
      verdict: breaks
      composed_scope: >-
        The frozen all-routes public-interface condition breaks because Route A
        maps both valid messages to the same endpoint and Decrypt returns
        bottom. Route B has public sender evaluation and actual-bit recovery;
        Route C has finite public evaluation and finite actual-message recovery,
        while its polynomial KeyGen/fast secret decoder remain unresolved.
      route_scopes:
        A: breaks correctness and actual-message recovery
        B: holds syntax/correctness but not recipient-only advantage
        C: holds finite syntax/correctness only; efficient secret path unresolved
    J4:
      owner: TASK-20261005-5cf08f
      verdict: breaks
      composed_scope: >-
        None of A/B/C supplies the claimed recipient-only EndRing advantage as
        written. A irreversibly erases the bit; B publishes its fixed-rank
        decoding lattice/metric; C omits its EndRing-to-evaluated-Hom operation
        and its unchanged public full smooth action admits the separately
        source-checked Robert map-to-message route.
      controls_retained:
        - Deleting End(E) still permits B's decoder and C's public recovery under the audited conditions.
        - Secret-dependent Encrypt mutations are rejected as non-public-sender syntax.
        - Masked, partial, noisy, nonsmooth, or nonrational successors do not inherit the full-action conclusion without separate proofs.
    J5:
      owner: TASK-20261005-5cf08f
      verdict: inconclusive
      composed_scope: >-
        Eight independently retrieved primary PDFs support the concrete
        Robert/FESTA/POKE/PIKE/Maino/SiGamal/SÉTA/LIT boundaries. Broad
        comparison completeness remains unverified because the generic UPKE
        and residual unnamed ideal-action families lack precise primary-source
        locators in the declared boundary.
      source_impediments:
        - unidentified-UPKE-comparison
        - unspecified-ideal-action-comparison
      claim_limit: No complete novelty audit, security endorsement, or universal construction comparison is supported.

