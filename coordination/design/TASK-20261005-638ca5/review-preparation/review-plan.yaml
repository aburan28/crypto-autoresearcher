review_plan:
  id: REVIEW-ENDRING-PKE-20261005-08b4a0
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  preparation_task: TASK-20261005-08b4a0
  producer_task: TASK-20261005-dae3ed
  producer_snapshot: TASK-20261005-94df71
  reviewer_tasks:
    - TASK-20261005-a983cf
    - TASK-20261005-5cf08f
  composer_task: TASK-20261005-f97f37
  ledger_archive: TASK-20261005-ad194b
  claim_under_review: >-
    The future producer packet's exact route statements, once quoted and bound
    by TASK-20261005-94df71, satisfy or fail the frozen viability rule: public
    Encrypt is evaluable from public inputs, Decrypt recovers the actual
    message, correctness is well typed, and any EndRing role is separated from
    auxiliary assumptions and elementary public recovery. This review does not
    ask whether any route is secure, novel, deployable, or an impossibility
    result for EndRing PKE.
  claim_binding_status: pending_producer_snapshot
  claim_binding_rule: >-
    No reviewer launches until TASK-20261005-94df71's pushed receipt supplies a
    reachable commit, exact five producer paths, and SHA-256 values. Each active
    review card must bind that receipt and quote only the route statements it
    owns. A path/hash mismatch blocks review and is not scientific evidence.
  coordinator_prior: >-
    Recorded before reading any producer artifact: the finite-torsion route is
    likely to lose recipient-only advantage if a public full-torsion action
    falls under an efficient isogeny/kernel recovery interface; uniqueness of a
    lift alone is unlikely to supply a private decoder. The fiber and lattice
    routes are more likely to expose a public-encryption or auxiliary-assumption
    gap than a complete ordinary-PKE interface. These are priors, not verdicts;
    a fully typed recipient-only mechanism can overturn them.
  written_before_producer_snapshot: true
  producer_artifacts_read_by_coordinator: []
  messages_used_as_scientific_input: false
  joints:
    - id: J1
      joint: >-
        Full-torsion uniqueness: for two degree-D homomorphisms with identical
        action on E[N], derive exactly what divisibility and degree bound yield
        uniqueness under N^2 > 4D, including all field/rationality caveats.
      assigned_to: TASK-20261005-a983cf
      attack_plan: >-
        Starting only from the blind statement, form delta = phi - psi, derive
        the consequence of delta killing E[N], compare the minimum possible
        nonzero degree with the upper bound derived from
        (sqrt(D)+sqrt(D))^2=4D, and test the equality collision [n] versus
        [-n] at N=2n and D=n^2. Refuse to import any producer notation or report.
      breaking_artifact: >-
        A typed counterexample, missing divisibility premise, invalid degree
        inequality, or boundary value where the stated strict uniqueness
        conclusion does not follow.
    - id: J2
      joint: >-
        Kernel-to-message recovery: identify the exact additional public or
        secret map needed to turn a uniquely reconstructed homomorphism/kernel
        into the original plaintext, and whether the resulting decoder is
        recipient-only.
      assigned_to: TASK-20261005-a983cf
      attack_plan: >-
        Compose public full-action recovery with public kernel extraction and a
        stated message/kernel encoding. Distinguish unique Hom recovery from
        message recovery; construct two messages with the same decoded object
        or show that a public decoder gives every sender/adversary the same
        recovery ability as the recipient.
      breaking_artifact: >-
        An explicit collision, an undefined decoding arrow, or a complete
        public recovery chain showing that the purported private decoder is
        already public.
    - id: J3
      joint: >-
        All producer routes, including mandatory A/B/C and any additional
        route, satisfy the public interface: every Encrypt operation uses only
        public parameters, pk, m, and randomness, while recipient Decrypt
        returns m rather than a path, Hom element, kernel, branch, witness, or list.
      assigned_to: TASK-20261005-5cf08f
      attack_plan: >-
        Trace the actual snapshotted pseudocode value-by-value. Replace sk with
        an opaque token at Encrypt and remove any unstated oracle; then type the
        ciphertext-to-message chain at Decrypt. For every failure, state the
        smallest mathematical interface that would repair it.
      breaking_artifact: >-
        A value-flow table locating a secret-dependent sender step, undefined
        public operation, non-message output, ambiguity, or exact repair
        obligation.
    - id: J4
      joint: >-
        For all producer routes, including mandatory A/B/C and any additional
        route, audit the EndRing-to-Hom/decoder bridge and public attacks:
        isolate which arrow actually uses an evaluable ring basis, which
        stronger datum or assumption is added, and whether public torsion
        linear algebra or low-rank lattice reduction already computes the
        claimed advantage.
      assigned_to: TASK-20261005-5cf08f
      attack_plan: >-
        Draw the reduction/interface arrows in their claimed direction; delete
        the EndRing witness and run the public algorithms symbolically. Apply
        finite-torsion reconstruction, basis reduction, branch collision, and
        public linear-algebra attacks before accepting any trapdoor label.
      breaking_artifact: >-
        A direction-reversed or missing reduction arrow, an unstated auxiliary
        assumption, or a public symbolic recovery chain reaching the same
        object as the alleged trapdoor.
    - id: J5
      joint: >-
        For all producer routes, including mandatory A/B/C and any additional
        route, enforce the primary-source and scope boundary: compare only
        supported route details with independently retrieved or hash-verified
        Robert/FESTA/POKE/PIKE and the closest source named by the packet; scope
        failures to the exact definitions examined and give forward
        recipient-only guidance.
      assigned_to: TASK-20261005-5cf08f
      attack_plan: >-
        Retrieve each load-bearing primary source or verify an independently
        obtained PDF against the recorded SHA-256; read the exact cited
        sections. Check that circulant masks, the POKE correction, PIKE's
        assumption comparison, and Robert's N^2>D extension are not misstated.
        For a failed route, write one constructive next obligation rather than
        universal negative language.
      breaking_artifact: >-
        A source quotation/section/hash contradicting the packet, an
        independently documented retrieval impediment, an exact prior-art
        overlap, or overbroad impossibility wording with its scoped correction.
  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Validator and Red Team attack disjoint joints in independent native
      sessions and may not read, list, receive, or summarize sibling reports.
      The later Coordinator composer may read both only after both are terminal.
  proves_too_much:
    objects:
      - >-
        A public full-torsion action satisfying the stated rationality,
        factorization, smoothness, and kernel-rank conditions, where public
        recovery of Hom/kernel means a recipient-only EndRing decoder is false.
      - >-
        A route whose Encrypt invokes the recipient's secret ring basis, where
        ordinary public-sender PKE syntax is false.
      - >-
        A masked, partial, noisy, nonsmooth, or nonrational torsion interface,
        where unqualified application of the full-action Robert boundary is false.
    failure_signature: >-
      Any argument that still concludes private message recovery, public
      evaluability, or Robert applicability on its corresponding
      known-false object has proved too much and must be reported as broken.
    assigned_to: TASK-20261005-5cf08f
  blind_rederivation:
    required: true
    quantity: >-
      Q1: the strict finite-level uniqueness implication N^2 > 4D for two
      degree-D homomorphisms with the same full E[N] action, conditional on the
      stated torsion-divisibility lemma and degree bound. Q2: the exact composed
      arrows required to turn public Hom/kernel recovery into actual message
      recovery, and whether those arrows are public or recipient-only. The
      quantity is neither a secret decoder nor a security statement.
    parameters: >-
      Symbolic E, E', D, N, phi, psi, full N-torsion bases/actions, message set
      M, kernel encoding EncK, and decoder DecK from the immutable blind
      statement; no producer-selected numeric parameter or route text.
    blind_from:
      - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/
      - coordination/design/TASK-20261005-638ca5/review-preparation/review-plan.yaml
      - coordination/design/TASK-20261005-638ca5/review-preparation/handoffs/TASK-20261005-5cf08f.yaml
      - coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/
      - coordination/design/TASK-20261005-638ca5/review-preparation/composition/
      - analysis/ideation-RQ-SSI-1946c9-20261005/robert-torsion-boundary.md
      - producer or inter-agent messages
    assigned_to: TASK-20261005-a983cf
  source_review:
    assigned_to: TASK-20261005-5cf08f
    intake_is_locator_not_evidence: true
    independent_retrieval_or_hash_verification_required: true
    expected_sources:
      - Damien Robert, ePrint 2022/1038, archived PDF SHA-256 52b371e245085709689e8c94aec0af2f287ad145fbaa170ac6f627bc88e5384e
      - FESTA, ePrint 2023/660, archived PDF SHA-256 cfa2c92cf8a40e6c27c5679c5468936c65a35dcbe77a1e9e791035f500c0d679
      - POKE, ePrint 2024/624 archived 20241009051546, PDF SHA-256 010faef9c893d1460c3a69fce256da86cedd1fd8b2c5f416821b65bd42b1b66b
      - PIKE, ePrint 2026/473, archived PDF SHA-256 c46511f6f53db87a51b9229d92c03b35da68adc83123392e7adc7cf9d802e8aa
      - every additional primary source on which the producer's exact route comparison relies
  composition_rule: >-
    Compose per-joint holds/breaks/inconclusive only. If a stronger actual
    mechanism survives all syntax and elementary gates, recommend the next
    design/implementation task under standing user authority without asking
    again. If none survives, recommend a narrow active-goal checkpoint with one
    exact mathematical continuation obligation; never universal closure.
  procedure_deviations: []

launch_gate:
  preparation_snapshot_task: TASK-20261005-84383f
  producer_snapshot_task: TASK-20261005-94df71
  required_before_review:
    - Both snapshot receipts exist in pushed commits reachable from the review branch.
    - Producer receipt binds exactly the five artifacts declared by TASK-20261005-dae3ed.
    - Every non-self producer path hash verifies before a reviewer reads it.
    - Review preparation exact-path manifest verifies with no undeclared edit.
    - At most two independent native reviewer sessions launch concurrently.
  on_failure: Block launch and report a custody or availability impediment; make no scientific inference.
