handoff:
  id: TASK-20261005-5cf08f
  from: coordinator
  to: red-team
  objective: >-
    Adversarially review all snapshotted producer routes, including mandatory
    A/B/C and any additional route, for public sender evaluability, actual
    message recovery, EndRing-to-Hom/decoder gaps, public symbolic attacks, and
    exact primary-source/prior-art boundaries.
  uncertainty_reduced: >-
    Whether any exact route definition survives elementary interface and public
    recovery attacks, and what recipient-only mathematical obligation remains
    when a route fails.
  inputs:
    - coordination/design/TASK-20261005-638ca5/review-preparation/review-plan.yaml
    - coordination/design/TASK-20261005-638ca5/review-preparation/handoffs/TASK-20261005-5cf08f.yaml
    - coordination/design/TASK-20261005-638ca5/archives/TASK-20261005-94df71/snapshot-receipt.json
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/constructive-theory-packet.md
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/scheme-interface.yaml
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/proof-search-map.yaml
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/source-and-nonduplication.yaml
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/provenance.yaml
    - analysis/ideation-RQ-SSI-1946c9-20261005/construction-source-boundaries.md
    - analysis/ideation-RQ-SSI-1946c9-20261005/robert-torsion-boundary.md
  constraints:
    - >-
      Before reading any producer byte, verify TASK-20261005-94df71's reachable
      pushed commit, exact five paths, and every non-self SHA-256. A mismatch
      blocks review and is not a scientific result.
    - Own J3, J4, and J5 only; issue per-joint verdicts and no whole-packet verdict.
    - >-
      Trace public Encrypt and recipient Decrypt value-by-value for every
      producer route, including mandatory A/B/C and any additional route.
      Recovery of a Hom element, kernel, witness, path, branch, or shared value
      is not actual-message recovery without a typed decoding arrow.
    - >-
      Test endpoint ambiguity, public finite-torsion linear algebra, low-rank
      lattice/basis reduction, and direction of every EndRing-to-intermediate
      assumption arrow before accepting a trapdoor label.
    - >-
      Independently retrieve every load-bearing primary source or verify an
      independently obtained PDF against the expected hash and read the cited
      sections. The root intake is a locator only, never a substitute for this
      source read. Record exact URL/archive, hash, sections, and retrieval time;
      otherwise return a source impediment.
    - >-
      Do not claim the POKE Section 4 PKE is broken from its split-KEM/OPRF
      correction; do not treat a new commuting/circulant mask as novel over
      FESTA; do not invent a PIKE-to-EndRing reduction.
    - >-
      Scope every break to the exact definition and assumptions reviewed. Do
      not claim EndRing PKE is impossible. For each failed route give one exact
      forward obligation aimed at a recipient-only public interface.
    - Do not read, list, receive, or summarize Validator outputs or messages.
    - Run no experiment or implementation; symbolic checks and source retrieval/hash verification only.
    - Use an independent native session at review-adversarial/xhigh; no Bedrock and no degradation below xhigh.
    - Create only the four declared outputs, with runtime-session-receipt.json written last.
  deliverables:
    - coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/red-team-report.yaml
    - coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/source-verification.yaml
    - coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/review-attestation.yaml
    - coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/runtime-session-receipt.json
  artifact_paths:
    - coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/red-team-report.yaml
    - coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/source-verification.yaml
    - coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/review-attestation.yaml
    - coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/runtime-session-receipt.json
  write_scope:
    - coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/
  archived_by: TASK-20261005-ad194b
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    fallback_boundary: native binding must meet the review-adversarial xhigh floor
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 0
    experiment_maximum_runs: 0
  completion_gate:
    - J3, J4, and J5 each have a worked attack and holds, breaks, or inconclusive verdict.
    - Every producer route, including mandatory A/B/C and any additional route, has public-sender and actual-message-recovery traces plus all required symbolic public attacks.
    - Every load-bearing source is independently retrieved/hash-verified and section-read, or an exact source impediment is recorded.
    - Every negative conclusion names only the failed definition and one recipient-only next obligation.
    - review_attestation lists every read and truthfully records read_sibling_reports false.
    - Exactly four outputs exist and the runtime receipt is last.
  return_format: Red-Team report, independent source-verification record, canonical review attestation, and last-written runtime receipt.
  review_plan: coordination/design/TASK-20261005-638ca5/review-preparation/review-plan.yaml
  dispatch_preconditions:
