handoff:
  id: TASK-20261005-ad194b
  from: coordinator
  to: coordinator
  objective: >-
    Run alone after review composition, create one scoped Coordinator decision,
    update the GOAL-SSI-2fa82a head and BATCH-f72362 checkpoint, and
    ledger-archive the exact review and composition artifacts with a
    self-neutral receipt.
  uncertainty_reduced: >-
    Whether the independently composed review is durably recorded with one
    authorized continuation and no unsupported status or scientific claim.
  inputs:
    - TASK-20261005-a983cf
    - TASK-20261005-5cf08f
    - TASK-20261005-f97f37
    - coordination/design/TASK-20261005-638ca5/archives/TASK-20261005-94df71/snapshot-receipt.json
    - ledger/goals/GOAL-SSI-2fa82a.yaml
  constraints:
    - Run alone only after all three source tasks are terminal and exact artifacts exist.
    - >-
      Create DEC-20261005-dbb0d2 using an allowed decision enum and scope it to
      the composed review. Create no H, EXP, EV, IDEA, or KN record.
    - >-
      Update ledger/goals/GOAL-SSI-2fa82a.yaml in this isolated archive from
      draft to active under the standing user build authority. Preserve its
      objective, questions, criteria, pause conditions, non-duplication text,
      related entries, unlimited campaign totals, max_concurrent, and every
      unrelated field. Do not set paused, blocked, completed, cancelled, or
      closed_at_budget.
    - >-
      The goal head must retain owner coordinator, contain exactly one concrete
      next_action selected from the valid composition, point to BATCH-f72362,
      cite producer snapshot TASK-20261005-94df71 and final decision
      DEC-20261005-dbb0d2, and keep runtime.provider none/runtime.goal_id null
      unless a real persistent runtime has actually been created. Never invent
      a background process.
    - >-
      Write the immutable checkpoint
      ledger/goals/GOAL-SSI-2fa82a/checkpoints/BATCH-f72362.yaml. It must record
      the exact snapshot/review/composition custody, status draft to active,
      DEC-20261005-dbb0d2, and exactly one continuation with owner, condition,
      what_is_blocked, clears_when, recheck, next_action, and
      asserts_nothing_about.
    - >-
      If a stronger mechanism survives, the single continuation prepares its
      exact design/implementation under standing user authority without asking
      again. If none survives, activate the goal with the composition's named
      definition impediment and one exact mathematical obligation. Either
      branch asserts no security, novelty, deployment, EndRing break, or
      universal impossibility claim.
    - >-
      If a stronger mechanism survives, authorize the exact next
      design/implementation preparation under standing user authority. If none
      survives, record only the exact impediment and continuation obligation;
      no universal closure.
    - >-
      Stage only the ten source artifacts, DEC-20261005-dbb0d2, the updated
      goal head, the new BATCH-f72362 checkpoint, and the self-neutral receipt.
    - Do not modify any reviewer, composition, producer, source, question, or unrelated goal artifact.
    - Do not launch the next task from this archive act; no Bedrock.
  deliverables:
    - ledger/decisions/DEC-20261005-dbb0d2.yaml
    - ledger/goals/GOAL-SSI-2fa82a.yaml
    - ledger/goals/GOAL-SSI-2fa82a/checkpoints/BATCH-f72362.yaml
    - coordination/design/TASK-20261005-638ca5/review-preparation/archives/TASK-20261005-ad194b/ledger-receipt.json
  artifact_paths:
    - ledger/decisions/DEC-20261005-dbb0d2.yaml
    - ledger/goals/GOAL-SSI-2fa82a.yaml
    - ledger/goals/GOAL-SSI-2fa82a/checkpoints/BATCH-f72362.yaml
    - coordination/design/TASK-20261005-638ca5/review-preparation/archives/TASK-20261005-ad194b/ledger-receipt.json
  write_scope:
    - ledger/decisions/DEC-20261005-dbb0d2.yaml
    - ledger/goals/GOAL-SSI-2fa82a.yaml
    - ledger/goals/GOAL-SSI-2fa82a/checkpoints/BATCH-f72362.yaml
    - coordination/design/TASK-20261005-638ca5/review-preparation/archives/TASK-20261005-ad194b/
  archived_by: TASK-20261005-ad194b
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1200
    memory_gb: 2
    maximum_runs: 0
    experiment_maximum_runs: 0
  completion_gate:
    - >-
      Commit changes exactly fourteen paths: ten declared source artifacts,
      scoped decision, goal head, checkpoint, and self-neutral receipt.
    - Receipt binds reachable commit, parent, exact paths, record IDs, and non-self SHA-256 values.
    - Goal is active with preserved budgets/criteria, real runtime fields only, Coordinator owner, cited source snapshot/final decision, and exactly one next_action.
    - Checkpoint has one continuation with condition, what_is_blocked, clears_when, recheck, next_action, owner, and asserts_nothing_about.
    - Decision and checkpoint language are limited to the exact reviewed definitions and one continuation; no paused/blocked/completed state or universal conclusion.
    - Post-commit archive verification and push succeed before any successor launches.
  return_format: Decision path, updated goal head, BATCH-f72362 checkpoint, receipt, commit/parent, exact fourteen changed paths/hashes, verification, push, and next eligible task.
  review_plan: null
  dispatch_preconditions:
