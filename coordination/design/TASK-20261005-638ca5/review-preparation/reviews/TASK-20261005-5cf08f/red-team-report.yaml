  statement_bindings_before_verdicts:
    - id: A-definition
      artifact: P1
      section: A, endpoint-only coprime diamond
      exact_quote: |-
        Encrypt computes alpha_m:E->E/H_m of degree 2, then its dual back to E,
        and emits only the endpoint c=E.
    - id: A-output
      artifact: P2
      field: routes[A].correctness
      exact_quote: 'forall keys,m: Dec(sk,Enc(pk,m;0))=bottom != m'
    - id: B-definition
      artifact: P1
      section: B, exposed rank-four order-lattice cosets
      exact_quote: |-
        Encrypt emits x=Bz+m v+e in Q^4, with reduced rational-coordinate encoding.
        Decrypt computes d_i=min_z||x-i v-Bz||_G, i=0,1. Return the unique i with
        d_i<=epsilon, else ⊥.
    - id: B-public-decoder
      artifact: P1
      section: B
      exact_quote: 'The exact same decoder uses only pk: closest-vector search in fixed dimension'
    - id: C-definition
      artifact: P1
      section: C, cyclic-kernel encoding with a finite-torsion lift
      exact_quote: |-
        Set s=m+2^k r in Z/DZ and K_s=<U+sV>. Encrypt computes the cyclic degree-D
        quotient phi_s:E->C_s as a chain of a degree-2 isogenies and emits
        c=(C_s,phi_s(P),phi_s(Q)), normalized together.
    - id: C-finite-decoder
      artifact: P2
      field: routes[C].Decrypt_finite
      exact_quote: enumerate all s; reenact exact ciphertext; unique match yields s mod 2^k
    - id: C-missing-operation
      artifact: P1
      section: C
      exact_quote: |-
        The proposed efficient secret Dec has a missing operation C1: from sk=End(E)
        and c compute an evaluable Z-basis h_1,...,h_4 of Hom(E,C), its positive
        degree form and its restriction to E[N], in polynomial input/output size.
    - id: source-scope
      artifact: P4
      field: honest_accounting.closures
      exact_quote: none; failures concern only the three written definitions
  route_coverage:
    actual_routes: [A, B, C]
    additional_routes: []
    evidence: All five producer artifacts read completely; P1 says no open-ended fourth mechanism is proposed.
  joint_verdicts:
    J3:
      verdict: breaks
      statements: [A-definition, A-output, B-definition, C-definition, C-finite-decoder, C-missing-operation]
      worked_attack: Replace the secret key by an opaque token at every sender step and type the recipient output. A's two valid messages have one ciphertext; B returns the actual bit publicly; C's finite decoder returns the actual message, whereas its efficient secret continuation has no C1 algorithm.
      route_verdicts: {A: breaks, B: holds, C: holds}
      C_qualification: holds concerns finite public evaluation and finite actual-message decoding only; polynomial key generation and efficient secret decoding are unresolved.
      scope: A alone falsifies the assigned all-routes correctness/interface condition; no verdict on J1 or J2 or on the packet as a whole.
    J4:
      verdict: breaks
      statements: [A-definition, B-public-decoder, C-definition, C-missing-operation]
      worked_attack: Delete the EndRing witness. A's observation still erases the bit; B's identical decoder still runs; C's unmasked smooth full action satisfies Robert's extended public-recovery conditions and reaches its public kernel-to-message arrow. End(E)'s right action on Hom(E,C) supplies no connecting basis by type alone.
      route_verdicts: {A: breaks, B: breaks, C: breaks}
      scope: Breaks the recipient-only advantage of these exact definitions, with C's complexity stated in represented-field arithmetic and charged field/model conversion costs.
    J5:
      verdict: inconclusive
      statements: [source-scope, C-definition, C-missing-operation]
      worked_attack: Independently downloaded and section-read eight primary PDFs. The concrete Robert/FESTA/POKE/PIKE/SÉTA/SiGamal/C-SiGamal/LIT comparisons have verified boundaries; SÉTA already has the exact uniqueness lemma. The generic isogeny-UPKE and unspecified known-ideal-action comparison entries have no uniquely identified primary source in the declared inputs, so full comparison coverage cannot be certified.
      concrete_source_boundary_verdict: holds
      source_impediments: [unidentified-UPKE-comparison, unspecified-ideal-action-comparison]
      scope: No security endorsement, complete novelty audit, new mask novelty, PIKE-to-EndRing reduction or universal EndRing-PKE impossibility is inferred.
  value_flow:
    A:
      sender_inputs: public E,U,V,a; bit m; singleton randomness
      sender_steps:
        - 'm -> H_m=<2^(a-1)U> or <2^(a-1)V>: public scalar multiplication'
        - 'H_m -> alpha_m:E->E/H_m: public degree-2 quotient'
        - 'alpha_m -> dual(alpha_m); composite [2]: public dual and composition'
        - 'composite endpoint -> canonical E: public ciphertext, independent of m'
      opaque_sk_sender_result: Every operation remains defined; no secret or unstated oracle is used.
      recipient_steps:
        - 'c=E -> two reencryption matches {0,1}: both branches emit E'
        - 'two matches -> bottom: actual output, not an actual message'
      actual_message_recovery: fails for both valid plaintexts, for every generated key
      arrows_and_assumptions:
        - 'End(E) -> diamond completion: even granting complete Hom information yields [2]tau=tau[2] for both branches'
        - 'diamond/composite -> first-edge bit: no function exists for this observation fiber'
      endpoint_attack: Enc(0;0)=E=Enc(1;0); one deterministic Dec input cannot yield both bits.
      torsion_linear_algebra_attack: rho_N([2])=2I for both branches; more torsion observations of the composite cannot separate them.
      low_rank_attack: Both branches have the identical quaternion element [2] and degree 4; any norm/basis computation preserves the collision.
      retained_path_control: Disclosing tau, all evaluated Hom modules and the exact composite does not restore the discarded first-edge choice.
      forward_recipient_only_obligation: Replace the endpoint observation by a publicly evaluable ciphertext separator for H_0 and H_1, and specify a polynomial, well-typed ring-derived inverse to the bit whose essential operation is unavailable from that public separator. Merely solving the existing diamond cannot repair the collision.
    B:
      sender_inputs: public rational B,G,v,epsilon,Z,error grid; bit m; allowed z,e
      sender_steps:
        - 'z -> Bz: public rational matrix multiplication'
        - '(m,v) -> m v; add public grid error e'
        - 'Bz+m v+e -> reduced rational encoding x'
      opaque_sk_sender_result: Every operation remains defined.
      recipient_steps:
        - '(x,B,G,v) -> distances d_0,d_1 to the two public lattice cosets'
        - 'd_m<=epsilon; d_(1-m)>=delta-epsilon>epsilon -> unique nearby index m'
        - 'index m -> plaintext bit m: no additional decoder or witness is required'
      actual_message_recovery: holds for every allowed z,e by the strict coset separation
      arrows_and_assumptions:
        - 'O -> Lambda=qO -> B: key generation publishes the entire decoding lattice'
        - 'B,G,v,x -> m: all actual decoder inputs are public; ring-map evaluation is unused'
      endpoint_attack: A cross-message equality would put v within 2epsilon of Lambda, contradicting delta>2epsilon; absence of collisions does not create secrecy.
      torsion_linear_algebra_attack: Not the actual Q^4 ciphertext. The packet's proposed replacement, if a full evaluated four-column representation were public, reduces to modular linear equations; rank deficiency would require its own ambiguity proof, not establish secrecy here.
      low_rank_attack: The public and secret algorithms are identical exact rank-four CVP computations. Even without relying on an external polynomial-CVP theorem, no relative recipient advantage follows; fixed-dimension optimization supplies the packet's claimed polynomial continuation, with bit lengths charged.
      basis_mutation_control: Replacing B by a poor GL_4(Z)-equivalent basis changes neither the public lattice nor which coset contains x; a secret short basis is not a hardness argument in fixed rank.
      forward_recipient_only_obligation: Supply an explicit public evaluation interface that does not disclose the rank-four basis and decoding metric, and identify a ring-derived recipient operation absent from public exact-CVP decoding. A new interface must separately prove public sender evaluation, actual-message decoding and ambiguity bounds.
    C:
      sender_inputs: public E,U,V,P,Q,D=2^a,N=5^b,k,F; m in [0,2^k), r in [0,2^(a-k))
      sender_steps:
        - '(m,r) -> s=m+2^k r mod D: public injective encoding of the pair'
        - 's -> U+sV -> cyclic K_s of exact order D: public point arithmetic'
        - 'K_s -> a successive degree-2 quotients phi_s:E->C_s'
        - 'phi_s -> phi_s(P),phi_s(Q); normalize the curve and both points together'
      opaque_sk_sender_result: The finite sender remains defined. Field construction, canonicalization, torsion enumeration and K0 costs have no proven uniform polynomial bound in the packet.
      recipient_finite_steps:
        - 'c -> public enumeration of all D coefficients s and exact reencryption'
        - 'unique matching s -> s mod 2^k -> actual plaintext m'
      recipient_fast_steps:
        - '(End(E),c) -> evaluated integral Hom(E,C) basis and positive degree form: missing C1'
        - 'given that basis -> smooth-N coordinate logs and compatible affine rank-four lattice'
        - 'given a unique bounded-degree lift -> phi_s(U),phi_s(V)'
        - '-phi_s(U)=s phi_s(V), with phi_s(V) of order D -> smooth-order log s -> low k bits m'
      actual_message_recovery: The finite decoder has an explicit message arrow. The fast recipient decoder lacks its first algorithm; Hom, a kernel or an isogeny is not itself a plaintext.
      arrows_and_assumptions:
        - 'End(E) -> right action on Hom(E,C): valid algebraic action'
        - 'right action -> complete evaluated connecting module: not supplied; ring basis alone does not select or evaluate connecting maps'
        - 'evaluated Hom + public full action -> phi_s -> s -> m: public as soon as Hom is public'
        - 'public full action -> evaluable phi_s -> s -> m: separate Robert route, independent of obtaining a complete Hom basis or End(E)'
        - 'augmented-level inversion -> bare EndRing-eval(D_curve): no reduction in this direction is supplied'
      endpoint_attack: The endpoint alone can be ambiguous; the packet deliberately retains two full torsion images. Equal normalized triples identify maps to one codomain and, under the stated divisibility/degree premises, identical kernels and coefficients. No endpoint-only or path-recovery claim is imported.
      torsion_linear_algebra_attack: Smooth-order logs and modular linear algebra compute restrictions in a known Hom basis but cannot manufacture the integral connecting module. The separate source-backed full-action recovery route bypasses this gap.
      low_rank_attack: Given evaluated Hom and its rational positive form, rank-four compatible-lattice optimization recovers the bounded-degree map. This does not make C1 secret-dependent by itself; the identical continuation works with publicly evaluated Hom.
      public_Robert_hypothesis_audit:
        source: ROBERT-2022-1038
        parameters: 'N_A=N=5^b; N_B=D=2^a; p>5; gcd(N,D)=1; N^2>4D>D'
        rationality: E,P,Q and c=(C,P_prime,Q_prime) are represented over the declared finite F; the quotient map is defined over F.
        bases: P,Q are a full E[N] basis; phi_s(P),phi_s(Q) form a full C[N] basis because degree D is coprime to N. U,V give rational source D-torsion for the final kernel-coefficient log.
        factorizations_and_smoothness: All factorizations are known; largest prime factors are 5 and 2.
        kernel_rank: C's isogeny has a cyclic kernel; the known-domain-and-codomain dimension-eight embedding has the required full-rank graph kernel, as covered by Robert Example 6.4 and Lemma 6.3.
        extension_to_smaller_torsion: Remark 1.2 explicitly allows N_A^2>N_B; Section 6.4 reconstructs the embedding by its two factors using both-side N-torsion bases. Thus sqrt(4D)<N<D is not an escape condition.
        model_conversions: Robert Remark 2.3 supplies theta/Weierstrass conversion with a constant-degree extension and fixed-dimension constants; the packet's normalization isomorphisms must transport all public points consistently.
        public_actual_message_chain: Robert's public evaluation of phi_s on U,V -> cyclic smooth-order coefficient s -> s mod 2^k. The coefficient is unique since <V> intersects <U+sV> trivially.
        costs: Randomized polynomial four-squares precomputation and polynomial represented-field arithmetic; fixed dimension has large constants. No timing or practical resource claim. A bit-complexity statement must additionally charge [F:F_p], field encodings and preprocessing; K0 remains unresolved.
        does_not_require: End(E), a retained tau, GRH, a preexisting complete Hom basis or an unstated secret oracle
      forward_recipient_only_obligation: Before treating C1 as an inversion advantage, specify a public ciphertext interface whose evaluated full smooth action is unavailable to the public but recoverable by an explicitly ring-derived recipient operation; give the actual-message arrow and recheck the exact Robert hypotheses. An EndRing-to-Hom compiler alone cannot make the unchanged full-action ciphertext recipient-only, and another commuting mask alone cannot establish novelty over FESTA.
  proves_too_much_controls:
    - object: Public full smooth torsion action with the rationality, basis, factorization and embedding-rank conditions verified above.
      unchanged_argument: Unique degree-bounded lift plus its kernel coefficient recovers the plaintext.
      failure_signature_test: The same message arrow works after deleting End(E), via Robert; any inference from uniqueness to a private trapdoor would therefore prove a false claim.
      result: breaks the private-advantage inference for C; finite injectivity is preserved
    - object: Mutate a sender operation so it requires the recipient's secret evaluated ring basis.
      unchanged_argument: Replace sk by an opaque token at Encrypt.
      failure_signature_test: The mutated operation becomes undefined, so it is not ordinary public-sender syntax. Actual A/B/C senders have no such step.
      result: detects the known-false sender object and does not falsely condemn the actual finite senders
    - object: Masked, partial, noisy, nonsmooth or nonrational torsion data.
      unchanged_argument: Apply the Robert applicability checklist without changing its hypotheses.
      failure_signature_test: Full rational basis images or polynomial smoothness costs are missing. Pairing compatibility alone does not reconstruct an unknown mask or supply omitted action values.
      result: no unqualified recovery conclusion; modified interfaces require separate proofs
  objections:
    - joint: J3
      route: A
      statement: A-output
      finding: Both valid messages decrypt to bottom because the observation fiber contains both bits.
    - joint: J4
      route: B
      statement: B-public-decoder
      finding: The actual decoder uses only public data, so evaluation of End(E) provides no recipient advantage.
    - joint: J4
      route: C
      statement: C-missing-operation
      finding: A source order action is not an evaluated connecting module. Moreover, C's unchanged full-action interface already permits a separate public map-to-message route under the audited Robert conditions.
    - joint: J5
      route: C
      finding: The N^2>4D uniqueness calculation is already SÉTA Lemma 3.1, and cyclic kernels parametrized by a slope already appear in FESTA Remark 5. Neither is a demonstrated construction delta.
  required_controls:
    - Preserve the exact A observation collision even when all intended trapdoor information is disclosed.
    - Compare B's public and alleged secret decoder symbolically on every allowed error, including a poor public basis.
    - For any C1 derivation, type every connecting ideal/map input and rerun with public evaluated Hom; then audit public full-action recovery before claiming recipient-only inversion.
    - Recheck full-action prerequisites separately for any masked, partial, noisy, nonsmooth or nonrational successor.
  counterexample_or_mutation: A has distinct messages (0,0) and (1,0) with the identical ciphertext E; the public-Hom substitution for C and sk deletion for B remove all claimed recipient asymmetry.
  baseline_comparison:
    appropriate_baselines: A's observation collision, B's same public decoder, C's D-term finite enumeration and Robert full-torsion recovery.
    Pollard_rho_and_BSGS: The final logs have known smooth orders 2^a and 5^b; generic rho/BSGS are not the closest costs. Smooth prime-power decomposition is already public. No ECDLP exponent improvement is claimed or supported.
    closest_construction_sources: SÉTA for full action and the exact injectivity lemma; FESTA for masked torsion inversion and cyclic-slope encoding; SiGamal/C-SiGamal and LIT-SiGamal for typed point-to-message recovery; POKE and PIKE for higher-dimensional and pairing interfaces.
    time_memory_data: C's fallback is D reencryption calls with streaming comparison plus map/field storage. Robert has polynomial field-arithmetic cost with large dimension constants. K0 and field bit costs are unresolved. No practical comparison or complete Pareto frontier audit was performed.
    dominated_by: not asserted; no headline algorithm or numerical advantage is being reviewed
  heuristic_challenges:
    - The exact route round trips use no distribution heuristic; D_curve is the stated walk law, not an asserted uniform law.
    - Security transfer from bare EndRing-eval(D_curve) to augmented public levels D_level is unproved, regardless of sampling terminology.
  cost_model_challenges:
    - Finite key saturation, torsion enumeration, canonicalization and field-extension construction are specifications, not uniform polynomial algorithms.
    - Charge evaluated-map output sizes, coordinate bit lengths, field-extension degree, memory and source/model conversion costs before any efficiency claim.
    - C1 is missing, and public full-action recovery is the closer baseline for C than its exhaustive fallback. Polynomial field arithmetic is not a measured practical running time.
  reduction_and_scope_challenges:
    - No EndRing-to-Hom algorithm or inversion-to-EndRing reduction follows from the abstract module action.
    - POKE's archived correction concerns split KEM/OPRF validation and expressly leaves Section 4 PKE unaffected.
    - FESTA's connecting isogeny, secret mask and correlated scaled-action assumptions are additional structures, not a bare-EndRing game; circulant masks already occur there.
    - PIKE Section 5.1 gives no formal one-sided PIKE/POKE reduction and calls its LIT comparison heuristic; it provides no PIKE-to-EndRing reduction.
    - Maino et al. Section 4 uses a known evaluable ring and GRH for prescribed-degree isogeny generation, with its stated B>A route; this is not a compiler to Hom(E,C) for an arbitrarily specified C.
    - These objections concern A's backtracking bit encoding, B's exposed rank-four rational cosets and C's unmasked smooth full-action encoding only.
  proof_architecture_challenges:
    - Observation-fiber attack finds A's missing message separator, while B's separation proves public decoding rather than a trapdoor.
    - C1 requires one uniform algorithm fixed before the for-all key/ciphertext quantifiers; per-ciphertext existence of Hom maps is insufficient.
    - Finite injectivity and the typed kernel coefficient remain useful for C even when its recipient-only interpretation fails.
  narrowest_supported_statement: A loses its bit in the written observation; B's correct decoder is public; C has finite actual-message decoding but no specified efficient EndRing-to-Hom compiler, and its exact full-action public interface admits source-backed public recovery in represented-field arithmetic. Concrete primary-source guardrails hold; generic unidentified comparisons remain unverified.
  next_concrete_action: The Coordinator may request a bounded mathematical interface obligation for C that separates publicly evaluated data from a genuinely ring-derived recipient operation, retaining the explicit message decoder and public-Hom/Robert controls. C1 alone on the unchanged ciphertext does not discharge recipient-only recovery.
