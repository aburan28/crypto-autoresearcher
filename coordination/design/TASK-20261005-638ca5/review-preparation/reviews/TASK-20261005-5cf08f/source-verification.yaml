      expected_sha256_match: true
      HTTP_status: 200
      retrieval_interval_UTC: ['2026-10-05T02:00:58Z', '2026-10-05T02:01:33Z']
      section_reads:
        - Section 3, Algorithms 1 and 2, commuting-mask footnote and Remark 5.
        - Section 4, Problems 6-8, Theorem 9 and its proof, full hardness/prior-interface analysis; extracted lines 330-707 also include the start of Section 5.1's partial-domain statement.
      load_bearing_boundary: A secret connecting isogeny and commuting mask enable inversion of correlated scaled torsion data. The one-wayness statement uses a decisional hybrid and CIST2, rather than an EndRing-only assumption. Circulant masks and cyclic kernels <P+[x]Q> are already explicit.
      exact_short_quote: 'This is not the only option: for instance, circulant matrices'
      quote_section: Section 3, footnote 3
      route_result: No commuting/circulant mask novelty is available by changing matrix family; C's slope encoding is already a stated kernel representation. This is structural overlap, not a proof that A/B/C instantiate FESTA.
