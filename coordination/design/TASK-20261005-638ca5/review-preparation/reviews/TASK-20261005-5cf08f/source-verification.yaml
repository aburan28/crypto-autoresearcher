      title: FESTA, Fast Encryption from Supersingular Torsion Attacks
      canonical_url: https://eprint.iacr.org/2023/660.pdf
      retrieval_url: https://web.archive.org/web/20260429140607id_/https://eprint.iacr.org/2023/660.pdf
