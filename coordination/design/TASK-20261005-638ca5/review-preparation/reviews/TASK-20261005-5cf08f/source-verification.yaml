    - id: ROBERT-2022-1038
      title: Breaking SIDH in polynomial time
      author: Damien Robert
      version_date_in_PDF: '2024-10-07'
      canonical_url: https://eprint.iacr.org/2022/1038.pdf
      retrieval_url: https://web.archive.org/web/20260823023323id_/https://eprint.iacr.org/2022/1038.pdf
      effective_url: https://web.archive.org/web/20260823023323id_/https://eprint.iacr.org/2022/1038.pdf
      archive_timestamp: '20260823023323'
      local_pdf: /tmp/endring-red-team-5cf08f.t5t8TV/robert.pdf
      pdf_bytes: 343979
      sha256: 52b371e245085709689e8c94aec0af2f287ad145fbaa170ac6f627bc88e5384e
      expected_sha256_match: true
      HTTP_status: 200
      retrieval_interval_UTC: ['2026-10-05T02:00:58Z', '2026-10-05T02:01:33Z']
      section_reads:
        - Introduction through Remark 1.2; additionally introduction/context text in extracted lines 1-290.
        - Section 2 dimension-eight embedding, Lemmas 2.1/2.2, proof of Theorem 1.1 and model caveats in Remark 2.3; extracted lines 365-545.
        - Section 6.4, Lemma 6.3 and Example 6.4, and Section 7; extracted lines 1240-1365.
      load_bearing_boundary: Theorem 1.1 has a full rational basis-action interface, known coprime factorizations and smoothness costs. Remark 1.2 and Section 6.4 extend evaluation/recovery to N_A^2>N_B without knowing the source EndRing. Kernel extraction has an additional rational source N_B-basis; C supplies U,V.
      exact_short_quote: 'it is also possible to directly reconstruct ϕ_B (with the same complexity) as long as N_A^2 > N_B.'
      quote_transcription: Mathematical glyphs normalized from Remark 1.2; wording unchanged.
      route_result: For exact C, N_A=5^b and N_B=2^a satisfy the extended size and coprimality conditions. Source/target N-bases are public; the embedding's kernel-rank and model conditions are covered by the cited sections. Public recovery is polynomial in represented-field arithmetic, with field bit costs and preprocessing explicitly separate.
      excluded_scope: No automatic transfer to unknown masks, partial/noisy actions, missing rational bases or nonsmooth levels.
