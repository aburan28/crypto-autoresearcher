  J1:
    proposition: Identical full E[N] action implies phi=psi when N^2>4D under the stated degree-norm premise.
    verdict: holds
    verdict_scope: Conditional finite-level uniqueness; no recovery algorithm or plaintext consequence.
    universal_quantifiers: >-
      For every finite field k of characteristic p, every pair of elliptic
      curves E,E_prime over kbar, every positive integer D and positive integer
      N with gcd(N,p)=gcd(N,D)=1, and every pair of separable homomorphisms
      phi,psi:E->E_prime of degree D, choose a full basis P,Q of E[N](kbar).
      If the relevant Hom space has the square-root degree norm described
      below, phi(P)=psi(P), phi(Q)=psi(Q), and N^2>4D, then phi=psi.
    conditional_premise:
      statement: sqrt(deg) is a norm on the real Hom space, with deg(0)=0, invariant under sign, and the triangle inequality.
      status: Explicitly conditioned on the premise permitted by the blind statement; not assumed as a precomputed 4D bound.
      obligation_to_remove_conditioning: Prove the positive-definite quadratic degree form and its norm property on this Hom space.
    derivation:
      - step: 1
        equation: delta=phi-psi in Hom(E,E_prime).
        reason: Differences of homomorphisms are homomorphisms; delta need not be separable.
      - step: 2
        equation: delta(P)=delta(Q)=O, so delta(aP+bQ)=O for all a,b in Z/NZ.
        reason: P,Q generate all geometric N-torsion because p does not divide N.
      - step: 3
        equation: E[N] is finite etale of order N^2; killing all geometric points kills the entire subgroup scheme.
        reason: The prime-to-characteristic hypothesis identifies the full geometric point set with the reduced torsion scheme.
      - step: 4
        equation: There exists a unique gamma:E->E_prime with delta=gamma o [N]_E=[N]_E_prime o gamma.
        reason: The quotient/factorization argument below applies to the entire subgroup E[N].
      - step: 5
        equation: sqrt(deg(delta)) <= sqrt(deg(phi))+sqrt(deg(-psi))=sqrt(D)+sqrt(D)=2sqrt(D).
        reason: Apply the declared norm triangle inequality to phi+(-psi); sign does not change degree.
      - step: 6
        equation: deg(delta) <= (2sqrt(D))^2=4D.
        reason: Both sides of the preceding norm inequality are nonnegative, so squaring preserves the inequality.
      - step: 7
        equation: delta!=0 implies gamma!=0 and deg(delta)=N^2 deg(gamma)>=N^2.
        reason: Nonzero elliptic-curve homomorphisms are finite of positive integer degree; degree multiplies under composition, including inseparable maps.
      - step: 8
        equation: delta!=0 would imply N^2<=deg(delta)<=4D, contradicting N^2>4D.
        reason: Therefore delta=0 and phi=psi. No algorithm was constructed by this contradiction.
    factorization_argument:
      zero_case: If delta=0, take gamma=0.
      nonzero_case: >-
        The separable map [N]_E is the quotient by the translation group
        E[N](kbar), whose size and map degree are N^2. The function-field
        extension induced by [N]_E has exactly these N^2 translation
        automorphisms, so its image is the invariant field. Since delta(x+T)
        =delta(x) for every T in E[N], delta^* factors through that invariant
        field. This supplies a rational gamma with delta=gamma o [N]_E.
        A rational map between these smooth projective curves extends to a
        morphism. Surjectivity of [N]_E and the homomorphism identity for
        delta imply gamma(O)=O and gamma(x+y)=gamma(x)+gamma(y).
        Surjectivity also proves uniqueness of gamma. Homomorphisms commute
        with multiplication, giving the codomain form [N]_E_prime o gamma.
      foundational_facts_used: [prime-to-p torsion structure, multiplication degree N^2, finite quotient invariant-field identity, extension of rational maps between smooth projective curves]
      existence_choice: gamma is forced by the quotient; it is not a private parameter or a chosen plaintext branch.
    hypothesis_audit:
      gcd_N_characteristic: Essential here for promoting geometric-point equality to annihilation of the whole torsion scheme and using the separable quotient proof.
      gcd_N_D: Retained from the statement; unnecessary for this uniqueness proof. It makes the degree-D separable map injective on E[N].
      separability_phi_psi: Retained from the statement; the factorization and degree contradiction do not require delta to be separable.
      field_of_definition: Over kbar as stated; k-rational torsion is not a hypothesis of this uniqueness proof.
      smoothness_or_factorization_N: No smoothness or known-factorization assumption occurs in the uniqueness argument.
    equality_and_below_boundary:
      equality_case: >-
        At N^2=4D, a nonzero delta would force deg(delta)=4D and
        deg(gamma)=1, so the strict contradiction disappears. The following
        explicit collision demonstrates that replacing > by >= is false.
      equality_collision:
        parameters: E_prime=E, phi=[n], psi=[-n], N=2n, D=n^2, p not dividing 2n.
        degrees: deg(phi)=deg(psi)=n^2; deg(phi-psi)=deg([2n])=4n^2=N^2.
        distinctness: '[n]!=[-n] because their difference [2n] is a nonzero finite map of degree (2n)^2.'
        equal_full_action: '[n](T)-[-n](T)=[2n](T)=O for every T in E[2n], including both basis elements.'
        coprimality_caveat: gcd(2n,n^2)=1 only when n=1. The general collision is outside the full frozen hypotheses for n>1.
        fully_admitted_cell: n=1, N=2, D=1, p!=2; id and -id are distinct, have the same full E[2] action, and satisfy both gcd conditions.
      below_case: >-
        For N^2<4D, the proof supplies only N^2<=deg(delta)<=4D
        when delta is nonzero. It neither certifies uniqueness nor proves
        nonuniqueness for every parameter cell. As one admitted below-bound
        example, [3] and [-3] have D=9 and identical E[2] action when p
        does not divide 6; N=2 is coprime to D. This is one symbolic
        collision, not a classification of all cells.
  J2:
    proposition: A recovered Hom element or kernel yields the original message only through a typed, correct decoding composition.
    verdict: inconclusive
    verdict_scope: The composition and its necessary conditions are derived; the supplied abstract maps do not instantiate a decoder or establish its correctness on any entire message set.
    types:
      PublicParameters: Identified curves, models, D,N, basis, representation fields, and format declarations.
      R: Allowed public randomness; a public sampling rule does not automatically expose the sampled value.
      KDesc: Exact subgroup descriptions modulo a declared equality or canonicalization convention.
      HomD: Degree-D separable homomorphisms E->E_prime with a representation admitting kernel extraction.
      FullAction: Exact images of the declared full torsion basis, with public representation data.
      Aux: Every decoder or validator auxiliary value, with availability and dependence declared.
      ValidatedInput: Accepted canonical kernel and declared auxiliary/transcript values.
      Failure: A distinguished failure value, written bottom in the diagram.
    typed_composition_diagram: |
      (m,r) in Admissible subset M x R
        -- EncK, possibly partial --> K in KDesc
        -- Realize/SelectHom, NOT supplied --> phi in HomD, ker(phi)=K
        -- Observe_N --> a=(phi(P),phi(Q)) in FullAction
        -- RecoverHom, conditionally assumed correct --> phi_hat or K_hat or bottom
        -- KernelExtract if phi_hat; identity if K_hat --> K_recovered or bottom
      (K_recovered, Aux, public transcript)
        -- Canonicalize and Validate, NOT supplied --> ValidatedInput or bottom
        -- DecK, possibly partial --> m_hat in M or bottom

      If the starting object is a ciphertext rather than a declared FullAction,
      a separate public Parse/Unmask/Normalize arrow into FullAction is needed.
      Every bottom value terminates this composition without a plaintext claim.
    arrows_and_existence_choices:
      - arrow: EncK
        obligation: Declare its admissible domain and subgroup constraints; specify whether randomness is visible or recoverable.
        supplied_status: Only an abstract possibly partial map is named.
      - arrow: Realize/SelectHom
        obligation: Supply an isogeny with exactly the encoded kernel, degree, target curve identification, and any chosen post-isomorphism or branch.
        supplied_status: No such arrow is supplied. A kernel alone does not specify all target identifications or map choices.
      - arrow: Observe_N and optional Parse
        obligation: Bind the observed basis images and public parameters to the encoded instance; prove exact complete data and representation compatibility.
        supplied_status: A mathematical full-action definition is supplied; a scheme transcript binding is not.
      - arrow: RecoverHom
        obligation: On the intended domain, prove correct reconstruction of the intended map or the same canonical kernel and provide runtime, memory, and failure guarantees if efficiency is claimed.
        supplied_status: Q2 assumes a public recovery algorithm conditionally; Q1 does not construct it.
      - arrow: KernelExtract
        obligation: Produce the subgroup description type consumed by validation and decoding; account for representation conversion and cost.
        supplied_status: Mathematical ker(phi) exists, but a computational extraction procedure and its cost are not specified.
      - arrow: Canonicalize and Validate
        obligation: Declare acceptance rules and verify encoded-image membership and transcript consistency without treating acceptance itself as a decoder.
        supplied_status: Required interface, not supplied algorithm or proven acceptance condition.
      - arrow: DecK
        obligation: Prove the left-inverse identity below on the stated domain and provide every auxiliary value.
        supplied_status: Only an abstract possibly partial map is named; no left-inverse guarantee is supplied.
    message_recovery_quantifiers:
      desired_all_messages: >-
        For every admissible (m,r), every realization allowed by the encoding
        rule, and every successful correctly specified recovery outcome, the
        validated decoder input must be defined and DecK must output that m.
        Randomized recovery additionally needs a stated success event and
        probability; an existence witness does not establish success for all
        executions. These are separate obligations, not results of J1.
      left_inverse_identity: >-
        DecK(Validate(Canonicalize(KernelExtract(RecoverHom(Observe_N(
        Realize(EncK(m,r)))))), Aux(m,r), Transcript(m,r)))=m,
        with identity extraction for a kernel-valued RecoverHom and with
        every arrow defined on the admitted input.
      injectivity_requirement: >-
        Let Z(m,r) be the entire actual decoder input: canonical kernel,
        supplied auxiliary values, and any transcript values consumed by the
        decoder. Necessarily Z(m,r)=Z(m_prime,r_prime) implies m=m_prime.
        Injectivity of EncK for each fixed r is insufficient when the decoder
        does not have r. Distinct randomness values for the same message may
        collide harmlessly; distinct messages with identical Z may not.
      possible_restricted_result: A left inverse can recover messages only on an explicitly restricted encoded subset where the preceding separation condition and all domains are proved.
      undefined_map_cases: An undefined EncK, incompatible realization, recovery failure, failed validation, unavailable auxiliary value, or undefined DecK leaves m unrecovered.
    explicit_message_collision:
      parameters: M={m0,m1}, one randomness value r0, E_prime=E, N=3, D=1, p!=3.
      construction: EncK(m0,r0)=EncK(m1,r0)={O}; choose phi=id and identical auxiliary/transcript values.
      map_uniqueness: N^2=9>4D=4, so J1 uniquely identifies id from its full E[3] action under the norm premise.
      decoding_failure: Both messages produce the same recovered map, kernel, and decoder input. A single-valued DecK cannot output both originals on that input.
      next_obligation: Prove message separation by the entire supplied decoder input, or restrict the domain to one message representative per collision class.
    public_composition:
      conditional_result: >-
        If EncK, parsing, realization conventions, RecoverHom, kernel
        extraction, canonicalization, validation, DecK, and every auxiliary
        value required by the successful composition are public and
        executable, any party with the same public transcript can execute
        that composition and obtain its output. If every arrow is also
        efficient with appropriate success guarantees, this is an efficient
        public plaintext recovery procedure on its proved domain.
      recipient_only_advantage: >-
        No recipient-exclusive capability is established by this entirely
        public composition. Public computability alone does not determine
        practical complexity, prove that no faster private algorithm exists,
        or decide security. A recipient-only advantage would require an
        identified private input or private algorithmic resource, a correct
        recipient decoder, and a separately justified cost or hardness gap.
      unresolved_private_auxiliary: A missing or secret auxiliary value breaks the public typed composition; it does not by itself prove a working trapdoor.
  Q3_source_algorithm_boundary:
    statement_kept_separate: The distinct source-level N^2>D recovery claim is neither proved, cited, nor applied here.
    conditions_to_check_elsewhere: [rationality, known-factorization, smoothness, kernel-rank, curve-model conditions]
    next_obligation: In a separately authorized source review, state the exact recovery theorem, input/output representation, every hypothesis, and its computational costs; establish those hypotheses on the proposed input.
    threshold_relation: N^2>4D is a sufficient uniqueness inequality derived here; N^2>D is a different claimed algorithmic premise. Neither threshold supplies the other's conclusion by substitution.
  boundary_table: |
    | Layer | Input or hypothesis | Scoped result | Additional obligation |
    |---|---|---|---|
    | Uniqueness | Equal full E[N] action, prime-to-p N, degree norm, N^2>4D | At most one degree-D Hom map with that action | None for this conditional implication; prove norm if removing conditioning |
    | Equality/below bound | N^2<=4D | No uniqueness conclusion from this argument; explicit equality collision exists | Analyze the individual parameter cell rather than infer universal failure |
    | Algorithmic Hom/kernel recovery | Specified RecoverHom or separately checked source theorem | Conditional reconstruction on its actual domain | Prove algorithm correctness, domain, representation, time, memory, success |
    | Original-message recovery | Recovered kernel plus typed validation/DecK and available auxiliary values | Original m only where the left-inverse identity holds | Prove totality on stated domain and separation across different messages |
    | Recipient-only advantage | A specified private input/resource and compared public/private costs | No such advantage established by this statement | Supply a working private decoder and justified computational advantage |
  known_false_controls:
    - id: C1
      statement_control: Actual equality collision at N=2n, D=n^2.
      expected_refusal: UNIQUENESS_REQUIRES_STRICT_N2_GT_4D
      observed_reasoning_result: >-
        Refused the inference from N^2>=4D to uniqueness. The explicit
        [n]/[-n] construction has equal full action and distinct maps; the
        n=1 cell satisfies every frozen gcd condition. General n>1 was not
        silently admitted because gcd(2n,n^2)!=1.
      next_obligation: Any replacement equality-bound theorem must add a stated restriction excluding this admitted collision and prove sufficiency for that restriction.
    - id: C2
      statement_control: Unique Hom/kernel data do not recover m without a separating, defined decoder.
      expected_refusal: MESSAGE_ARROW_MISSING_OR_COLLIDING
      observed_reasoning_result: Refused the plaintext inference; the explicit m0/m1 example has a unique recovered phi and identical entire decoder input for two messages.
      next_obligation: Supply the typed decoder and prove its left-inverse identity on the admitted encoded subset.
    - id: C3
      statement_control: Public RecoverHom plus public DecK is not a recipient-only trapdoor.
      expected_refusal: RECIPIENT_ONLY_ADVANTAGE_NOT_ESTABLISHED_PUBLIC_PIPELINE
      observed_reasoning_result: Refused a recipient-exclusive inference; a party with identical public inputs can evaluate the public composition. No complexity or scheme-security conclusion was substituted.
      next_obligation: Identify a private dependency and prove both recipient correctness and a public/private computational gap if an advantage is claimed.
    - id: C4
      statement_control: Altered or out-of-domain torsion data must not be treated as the admitted public full-action interface.
      expected_refusal: TORSION_DATA_NOT_ADMITTED_AS_FROZEN_PUBLIC_FULL_ACTION
      observed_reasoning_result: Refused silent admission of every listed variant; mathematical completeness and source-algorithm prerequisites were kept separate as detailed below.
      variants:
        - variant: partial
          refusal_signature: FULL_ACTION_REQUIRES_BOTH_BASIS_IMAGES
          reasoning: One basis image does not establish that delta kills all E[N]; the N^2 divisibility step is unavailable.
          next_obligation: Supply exact images of a verified full basis or prove a different partial-data theorem.
        - variant: masked
          refusal_signature: FULL_ACTION_REQUIRES_UNMASKED_EXACT_IMAGES
          reasoning: Unknown masks leave the actual phi(P),phi(Q) unspecified; equality of encoded masks is not equality of map actions.
          next_obligation: Supply and justify the unmasking arrow and its public or private dependencies.
        - variant: noisy
          refusal_signature: FULL_ACTION_REQUIRES_EXACT_IMAGES
          reasoning: Approximate or corrupted observations do not establish the exact zero equation for delta on both basis elements.
          next_obligation: Prove exact correction with specified failure guarantees before invoking J1.
        - variant: nonsmooth
          refusal_signature: SOURCE_ALGORITHM_SMOOTHNESS_NOT_VERIFIED
          reasoning: >-
            Refused invoking the separate source-level recovery algorithm or
            silently treating this as its admitted input. Nonsmooth N can
            nevertheless have mathematically complete exact E[N] action;
            smoothness is absent from the J1 proof and the full_action object
            definition. The control's blanket exclusion is therefore an
            interface restriction, not a mathematical incompleteness claim.
          next_obligation: State the computational full-action domain and the exact source algorithm's smoothness condition, or supply another algorithm for that input.
        - variant: nonrational
          refusal_signature: SOURCE_ALGORITHM_RATIONALITY_NOT_VERIFIED
          reasoning: >-
            Refused importing the source-level rationality condition or
            assuming an efficiently available public representation. Exact
            basis images over a specified extension inside kbar can still be
            mathematically full action: the blind statement places the curves
            and Hom maps over kbar, and J1 does not assume E[N] is k-rational.
          next_obligation: Declare representation fields, extension costs, basis accessibility, and the precise rationality premise for any recovery algorithm.
  unresolved_steps:
    - step: Remove conditioning on the degree norm.
      mathematical_obligation: Establish the positive-definite degree quadratic form and norm triangle inequality on the Hom space.
    - step: Instantiate public Hom/kernel recovery.
      mathematical_obligation: Give an actual algorithm with checked domain, exact output representation, correctness, and computational costs.
    - step: Bind encoding to observed map data.
      mathematical_obligation: Prove the realization and observation arrows and their target/basis choices preserve the encoded kernel.
    - step: Decode every claimed message.
      mathematical_obligation: Prove definedness and the left-inverse identity, including separation across different messages and all available auxiliary inputs.
    - step: Resolve the nonsmooth/nonrational control's domain terminology.
      mathematical_obligation: Distinguish exact mathematical full action from source-algorithm admission and public computational availability in a future additive clarification.
    - step: Establish a recipient-only advantage if separately claimed.
      mathematical_obligation: Identify a private dependency, verify a working recipient composition, and justify its computational advantage against public recovery.
  limitations:
    - No producer artifact, producer message, source intake, source theorem, global review plan, sibling output, or composition was read.
    - No experiment, implementation, corpus search, citation retrieval, model probe, git mutation, or research-state transition was performed.
    - The degree-norm premise is explicit; only the 4D bound and ensuing uniqueness implication were derived from it.
