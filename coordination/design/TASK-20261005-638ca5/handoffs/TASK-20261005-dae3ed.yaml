handoff:
  id: TASK-20261005-dae3ed
  from: coordinator
  to: idea-generator
  objective: >-
    Produce one constructive theory packet for public-key encryption whose
    secret-key advantage is tied explicitly to evaluable supersingular
    endomorphism-ring information, after attempting at least three genuinely
    distinct mathematical mechanisms.
  uncertainty_reduced: >-
    Whether any explicitly typed EndRing-PKE construction lets every public
    sender compute Enc and lets the secret-key holder recover the actual
    message, before any security hypothesis or experiment is admitted.
  inputs:
    - coordination/design/TASK-20261005-638ca5/handoffs/TASK-20261005-dae3ed.yaml
    - ledger/goals/GOAL-SSI-2fa82a.yaml
    - ledger/questions/RQ-SSI-1946c9.yaml
    - ledger/decisions/DEC-20261004-23eb8d.yaml
    - analysis/ideation-RQ-SSI-1946c9-20261004/primary-source-intake.md
    - analysis/ideation-RQ-SSI-1946c9-20261004/generator-report.md
    - ledger/proposals/IDEA-20261004-edbd24.yaml
    - ledger/proposals/IDEA-20261004-e4c461.yaml
    - ledger/proposals/IDEA-20261004-a09dd4.yaml
    - analysis/ideation-RQ-SSI-1946c9-20261005/construction-source-boundaries.md
  constraints:
    - >-
      This is constructive mathematical design, not another generic audit.
      Attempt at least three mechanism-distinct routes and write a failed
      definition for every route that does not survive the cheap gates.
    - >-
      For every route, give explicit Setup if needed, KeyGen, Encrypt, and
      Decrypt algorithms; exact input/output domains, encodings, randomness,
      failure behavior, and the quantified correctness equation
      Dec(sk, Enc(pk, m; r)) = m.
    - >-
      Encrypt must be executable by an arbitrary public sender using only pk,
      m, r, and public parameters. Decrypt must return the actual message m,
      not a path, witness, equality bit, shared secret, branch label, or
      unvalidated candidate list.
    - >-
      Separate the exact EndRing-eval(D) secret advantage from every additional
      assumption. State D, the public data, the secret ring representation, and
      which individual operation needs the ring. Never relabel a path-finding,
      ideal-transport, or decisional assumption as EndRing equivalence.
    - >-
      At minimum explore: (A) a fiber-resolving or multivalued modular-
      correspondence route where the ring resolves ciphertext ambiguity; (B)
      a quaternion/order-lattice coset or syndrome route where the ring is a
      decoding trapdoor; and (C) a finite-torsion action/lift route where the
      full ring enables a lift or inversion not available from public torsion
      data. Substantive replacements are allowed only if mathematically
      mechanism-distinct and explained.
    - >-
      For each route symbolically test endpoint or branch ambiguity, low-rank
      lattice/basis-reduction recovery, and public finite-torsion linear
      algebra. A hand-wave that the secret path is unique, hidden, or canonical
      is a route failure.
    - >-
      Do not infer PKE from a TDF or OWF without a complete applicable
      transformation. Do not use generic iO or witness encryption as a relabel.
      Do not rename SÉTA, FESTA, POKÉ, PIKE, SiGamal/LIT-SiGamal, or the known
      ideal-action constructions.
    - >-
      Per the durable construction-source boundary note, treat a new
      masking-matrix family alone as non-novel because FESTA already
      contemplates circulant structure. Do not use the withdrawn POKÉ split-
      KEM/OPRF validation assumption to claim its Section 4 PKE is broken. Do
      not assert that PIKE single-point pairing assumptions reduce to EndRing.
      If the durable repository inputs do not support a finer comparison, mark
      it unresolved rather than relying on a transient source.
    - >-
      A route is viable only if all public-sender, actual-message-recovery,
      typing, correctness, ambiguity, elementary-attack, and non-duplication
      gates pass. Label every unproved statement as an unresolved lemma and
      make no security, novelty, deployment, or reduction claim.
    - >-
      Return exactly one constructive theory packet: either one strongest
      surviving candidate plus explicit unresolved lemmas, or route-specific
      failed definitions plus one concrete next mathematical obligation. Do
      not create three-to-five ledger proposals.
    - >-
      Use only the declared committed repository paths as scientific inputs.
      Run no experiment, write no implementation, create no H/EXP/EV/IDEA/KN
      record, and change no official status.
    - No Bedrock. Record the actual runtime interface and resolved model honestly.
  deliverables:
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/constructive-theory-packet.md
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/scheme-interface.yaml
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/proof-search-map.yaml
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/source-and-nonduplication.yaml
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/provenance.yaml
  artifact_paths:
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/constructive-theory-packet.md
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/scheme-interface.yaml
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/proof-search-map.yaml
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/source-and-nonduplication.yaml
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/provenance.yaml
  write_scope:
    - coordination/design/TASK-20261005-638ca5/tasks/TASK-20261005-dae3ed/
  archived_by: TASK-20261005-94df71
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0
    experiment_maximum_runs: 0
  completion_gate:
    - At least three mechanism-distinct routes have complete typed definitions or explicit route-specific definition failures.
    - Every surviving candidate passes public sender evaluation and actual message recovery with a quantified correctness equation.
    - EndRing-eval(D) and every added assumption are separated operation by operation.
    - Endpoint ambiguity, low-rank lattice attacks, and public finite-torsion linear algebra are worked symbolically for every route.
    - The proof-search map records baseline, collision, quantifier order, method ceiling, and a nearby control.
    - The packet selects at most one strongest candidate and labels every unresolved lemma, or names one concrete next mathematical obligation if all routes fail.
    - Exactly the five declared artifacts exist; no experiment, implementation, status change, or scientific claim occurred.
  return_format: >-
    Five-file constructive theory packet with a route comparison table, explicit
    algorithms/equations, cheap-gate verdicts, and either one conditional
    survivor or a ranked failure diagnosis with one next obligation.
  review_plan: null
  dispatch_preconditions:
    - TASK-20261005-e7ad33 has archived and verified the preparation package on the PR branch.
    - A GOAL-SSI-2fa82a lane for BATCH-f72362 has been claimed without editing the draft goal.
    - Every scientific input listed above, including the supplemental construction-source boundary note, is committed and pushed before launch.

constructive_task_specification:
  route_matrix_required_fields:
    - route_id and mechanism_delta
    - Setup or explicit not-needed rationale
    - KeyGen, Encrypt, and Decrypt pseudocode
    - public_parameter, key, message, randomness, and ciphertext domains
    - encoding, equality, validation, and decryption-failure semantics
    - quantified correctness equation and proof or exact unresolved lemma
    - public_sender_evaluability trace
    - actual_message_recovery trace
    - exact EndRing operation and additional assumptions
    - endpoint ambiguity analysis
    - low-rank lattice or basis-reduction attack analysis
    - public finite-torsion linear-algebra attack analysis
    - closest known construction and exact non-duplication delta
    - gate verdict: pass, fail, or unresolved
  cheap_gate_order:
    - type_and_domain_consistency
    - public_sender_evaluability
    - actual_message_recovery_and_correctness
    - endpoint_or_branch_ambiguity
    - public_torsion_linear_algebra
    - low_rank_lattice_and_basis_reduction
    - known_construction_duplication
    - exact_assumption_boundary
  proof_search_map:
    baseline_embedding: >-
      Instantiate the route at the boundary where the secret EndRing is removed
      or replaced by its public finite-level image; state whether encryption or
      decryption still works and which known construction/control remains.
    observation_collision: >-
      Name the ciphertext-visible observable and explicitly search for two
      distinct messages, branches, ideals, or lifts with the same observable;
      explain how Decrypt distinguishes them or fail the route.
    quantifier_order: >-
      Write all for-all/there-exists dependencies across parameters, keys,
      messages, encryption randomness, auxiliary choices, and decryption
      failure before invoking a hardness assumption.
    method_ceiling: >-
      State the strongest claim that syntax and symbolic reasoning alone can
      certify; security and novelty are outside this task.
    nearby_control: >-
      Apply the proposed decryption argument to a nearby public-information
      control where the trapdoor is absent or already recoverable. If the same
      reasoning still decrypts, identify the proves-too-much failure.
  candidate_rule: >-
    Viable means syntactically evaluable PKE with actual message recovery and no
    surviving elementary symbolic break; it does not mean secure or novel.
