hypothesis:
  id: H-CRYPTO-acdb49
  question_id: RQ-CRYPTO-001
  related_question_ids: [RQ-ECDLP-002, RQ-GGMB-6eaabc]
  derived_from_idea: IDEA-20260905-b1f9f0
  status: specified
  statement: >-
    In the frozen visible-cycle panel, at least one preregistered residue
    feature and restricted fresh-private kernel pair has joint lumpability
    defect at least 1/8 below its matched-partition mean and strictly beats at
    least 24 of 32 matched partitions, at both C11 and C17 with the same pair.
    Separately, the declared memoryless conditional-kernel defect bounds the
    representative simulator's full joint label/feature transcript TV by
    min(1,t*delta), uniformly over the declared initial states and horizons.
  mechanism: >-
    For visible x in C_N and feature v, public label l is drawn from a fixed
    state-independent law nu, then a fresh independent private translation is
    drawn from mu_l. K_l(x,b)=sum_a mu_l(a)*1[v(x+a)=b]. Define delta as the
    maximum over v(x)=v(x') of sum_l nu(l)*TV(K_l(x),K_l(x')). A simulator
    uses the least state in each current feature cell. Conditional hidden
    states remain in that cell, so convexity and an iterative coupling give
    the prospective transcript bound under the explicit freshness/history
    premises. No approximation theorem is attributed to the exact-lumping source.
  assumptions:
    - States are visible integers modulo 11,17 or15; residue features are not cheap functions of an unknown ECDLP scalar.
    - The main panel uses the fixed memoryless laws, with fresh independent labels/translations at every step.
    - The observer sees the initial feature and each public label and subsequent feature, and nothing else.
    - Kernel, feature, representative, initial states, horizons, null seeds and score thresholds are frozen before measurement.
    - All full-state tables, feature access, construction, rational arithmetic, verification, storage and transcript data are charged.
    - The persistent-translation trap violates freshness and is an assumption-control case, not evidence against the scoped bound.
  predictions:
    - metric: Paired-size finite defect advantage under the four restricted kernels.
      direction: lower
      minimum_effect: Same q/kernel at both N values has mean-null minus coordinate delta at least 1/8 and at least24 strict wins out of32.
    - metric: Full joint transcript TV minus min(1,t*delta).
      direction: different
      minimum_effect: No positive difference in all91488 main-panel initial-state/horizon comparisons; exact rational certificates required.
    - metric: Assumption-trap full versus final-marginal TV.
      direction: different
      minimum_effect: All11 persistent-control starts at horizon2 have full TV10/11 and final-marginal TV0, with freshness explicitly false.
  test_boundary:
    instances:
      - C11 and C17 residue q=2,3,4,5 features with32 matched partitions each, plus identity and constant.
      - C15 genuine mod3/mod5 cosets, identity and constant.
      - Separate C11 identity persistent-uniform-translation assumption trap.
    parameters:
      main_partitions: 272
      main_kernels: 6
      partition_kernel_cells: 1632
      horizons: [0,1,2,3]
      main_transcript_checks: 91488
      assumption_trap_checks: 11
      total_transcript_checks: 91499
    budget: {maximum_runs: 1, maximum_workers: 1, memory_gb: 8, wall_clock_seconds: null, total_cpu_hours: null}
  falsification_criterion:
    - If every validity/control gate passes but none of16 preregistered q/kernel pairs qualifies at both primes, reject only this finite advantage prediction.
    - A certified main-panel transcript violation under verified freshness falsifies the stated finite implementation/derivation claim and requires independent diagnosis.
    - Incorrect kernel laws, violated freshness, missing tables or failed exact controls invalidate interpretation rather than falsify the correctly scoped theorem.
  proof_search_map:
    bottleneck: Separate restricted fresh-private averaging from public deterministic rigidity, hidden-uniform cancellation and full-transcript simulation.
    baseline_embedding:
      parameter_slice: Identity/constant features, genuine C15 cosets and hidden-uniform translations.
      reproduction_check: Certify exact delta0 and exact simulator transcripts throughout the fresh main panel where these controls apply.
    observation_collision:
      observable: Equal averaged one-step rows or final-time marginal distributions.
      distinct_preimage_search: Preserve every public-label conditional row; persistent-translation trap has equal final marginals but unequal joint histories.
    constructive_transforms:
      - {transform: observable_fiber, proposed_object: Cell-size-matched seeded partitions., predicted_gain: No gain presumed; all32 fixed nulls reported for every restricted comparison.}
      - {transform: specialization_pack, proposed_object: Reveal each translation as a public label., predicted_gain: Per-operation rigidity differs from joint averaged defect; no monotone-destruction claim.}
    quantifier_order: Freeze state space, feature, laws, observation grammar, representatives and horizons, then quantify over every initial state and compatible history; no adaptive extra observations or selected successful kernels.
    method_ceiling:
      strongest_certifiable_claim: Exact finite defects/transcripts and a deterministic matched-panel comparison; no general group-family or ECDLP advantage.
      nearby_object_control: Persistent uniform translation at C11 identity violates freshness; C15 nontrivial cosets refute extension of prime-order rigidity to all groups.
    proof_obligations:
      - {claim: Exact lumping requires common target-cell mass within each source cell., responsibility: correctness, owner: Independently checked finite transition tables and retrieved exact-lumping source.}
      - {claim: Conditional mixtures and iterative coupling give the bound under fresh laws., responsibility: correctness, owner: Explicit prospective derivation and later independent review.}
      - {claim: Every matched partition preserves the exact ordered cell-size vector., responsibility: interface, owner: Independent fixture checker.}
      - {claim: All tables/transcripts and feature/kernel access are counted without scalar advice., responsibility: scope, owner: Independent cost and implementation review.}
    not_applicable_reason: null
  interpretation_limits:
    - Conjecture-negative with valid controls is distinct from invalid or incomplete execution; it closes no broader research direction.
    - Exact lumpability is a known boundary, not a claimed new theorem.
    - Finite seeded-null scores are descriptive; no p-value, IID assertion, population confidence or global novelty claim.
    - No r-adding spectral or history-refinement experiment is designed here.
  asymptotic_claim: null
  novelty_status: unverified
  dominated_by: 'n/a (no result claimed)'
  sota_delta: 'no attack; finite diagnostic design only; established improvement0'
