    - Exact public translation, hidden-uniform, identity/constant and composite-coset boundaries prevent confusing binary rigidity or forced-zero defect with an advantage.
    - The strict paired-size finite criterion allows a negative result with valid controls and uses no population significance or selected seeds.
    - All public labels/features are retained in full histories and every initial state is checked, rather than using only final marginals.
    - A separate persistent-translation trap explicitly violates freshness and checks the required assumption and transcript scope without falsifying a correctly scoped theorem.
    - Exact-lumping source support is separated from the prospective own approximation derivation and its still-required independent review.
    - Full state/feature/kernel access, table construction, rational bit arithmetic, checking, memory and output costs remain charged.
    - Runtime matches actual exclusive output creation and receipt.json naming, with backend-specific positive checkpoints and bounded partial-result transport rather than an unsupported output mount.
