schema_version: '1.0'
record_kind: batch_local_draft_hypothesis
id: H-ECDLP-a8ad36
status: draft
title: Typed minimum-viable-batch cost gate for deferred ECDLP lanes
source_idea: IDEA-20260815-143d6e
area: ECDLP
scope: >
  A source-bound, zero-run accounting contract for deciding whether a declared
  deferred lane has enough immutable inputs to express a comparable minimum
  viable batch cost. This draft is about the integrity of a future accounting
  procedure; it makes no statement about any existing lane, experiment, cost,
  priority, cryptanalytic method, or ECDLP security property.
mechanism: >
  A future accounting record is admissible only when its declared source
  objects, comparable baseline, cost units, range, count, ratio, calibration,
  and consumer relation are all typed, source-bound, and cross-consistent.
  Missing or unbound inputs produce UNESTIMABLE rather than an inferred value.
prediction:
  - >
    A synthetically complete, source-bound accounting fixture can be classified
    as COMPARABLE without asserting that any real lane is comparable.
  - >
    A fixture with a missing source, incompatible unit, undefined range, absent
    consumer, or uncalibrated quantity is classified UNESTIMABLE or
    NO_CONSUMER according to the closed precedence rule.
test_boundary:
  allowed: >
    Static validation of future record schemas and deliberately synthetic
    fixtures after an independent implementation-admission decision.
  excluded:
    - reading live lanes, goals, queues, claims, priorities, or costs
    - estimating or comparing any live cost
    - ranking, retiring, approving, or reprioritizing any research branch
    - creating canonical ledger records
    - implementation, fixture construction, execution, or scientific measurement
falsification_criteria:
  - >
    The contract is broken if a result can be labeled COMPARABLE while a required
    source identity, cost unit, range, count, ratio, calibration, or consumer
    binding is absent, ambiguous, or inconsistent.
  - >
    The contract is broken if an UNESTIMABLE or NO_CONSUMER result can carry a
    numerical cost, ratio, ranking, retirement, priority, or approval effect.
evidence_status: unverified
implementation_authorized: false
scientific_execution_authorized: false
maximum_runs: 0
sources:
  status: unread
  records: []
  impediment: >
    No source, live lane, cost record, or comparable baseline was read in this
    design task. Recalled literature or repository context is not evidence and
    cannot support a cost, baseline, or applicability claim.
claims_not_made:
  - no live deferred lane has a minimum viable cost
  - no live deferred lane is estimable, comparable, dominated, or worthwhile
  - no priority, retirement, approval, or resource decision follows
  - no ECDLP attack, speedup, cost improvement, or security conclusion follows
