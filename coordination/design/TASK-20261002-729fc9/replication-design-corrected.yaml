# -----------------------------------------------------------------------------
# PART A -- the complete Experiment contract (templates/research-records.md
# "Experiment"; every field filled except approved_by, null by DS-1 and CD-6).
# -----------------------------------------------------------------------------
experiment:
  id: TO-MINT EXP-PFDR-<tok-A> (minted by the top-level session with tools/allocate_id.py --next experiment --area PFDR and confirmed with --check at approval; this design minted nothing)
  hypothesis_id: H-PFDR-2765d2
  version: 1
  title: >-
    Single-cell confirmatory replication of the small_x TT4 relation-level
    excess of EXP-PFDR-011cd0 at 30 and 32 bits on fresh curves: one
    pre-registered one-sided alpha 0.01 test, three matched random arms, a
    known-null arm, random-as-structured null pseudo-cells, a small_x offset
    mutation, a planted arm at kappa about 1.15 (and the full planted arm),
    recalibration on the replication's own null arms before unmasking, and a
    real-data permutation null beside G-NB-R
  status: review_required
  objective: >-
    Decide, with one pre-registered test, whether the small_x TT4
    relation-level excess seen in EXP-PFDR-011cd0 (kappa_rel
    1.0966183574879125, one-sided bound 1.1711499549303037 above the 1.15
    target, excess concentrated in the 32-bit rung; EV-PFDR-ad6274 OBS-4) is
    chance or a small_x-specific relation excess, on fresh prime-order curves
    at 30 and 32 bits, this mitm engine at default arity and min_fill, m = 4,
    class TT, with |F| matched to the subgroup base. Primary: the pooled
    30-32 small_x TT4 z against a threshold calibrated on this run's own null
    arms, with a decision-bearing one-sided upper bound. Discriminating
    secondary: the same statistic for a base mutation (the s_sub smallest
    liftable x above a seeded random offset) and the paired contrast
    small_x minus mutation. Sensitivity at the target is shown by a planted
    arm at kappa about 1.15 (RC-2); the threshold is checked against a
    real-data permutation null (RC-3). The pre-committed expectation is the
    null (outcome O-A3). Any replicated excess is a lever CANDIDATE routed
    under TW-ALIVE, never a result.
  inputs:
    source_records:
      - ledger/decisions/DEC-20261002-c3f49b.yaml (decision_class.cell_scope.scoped_out; red_team_required_controls RC-1, RC-2, RC-3; NA-3, NA-5, NA-6)
      - ledger/evidence/EV-PFDR-ad6274.yaml (OBS-2, OBS-4, OBS-6, OBS-7, OBS-8, OBS-9; claim_boundaries; unresolved_confounds)
      - ledger/hypotheses/H-PFDR-2765d2.yaml (statement, lemmas L1 and L2, HEUR-2765d2-H1c, H2, H4, proof_search_map, test_boundary)
      - experiments/EXP-PFDR-011cd0/specification.yaml (counting_conventions CC-1 to CC-10; cells.design_curves; analysis.two_step_blinding, A-CAL_calibration, A-INT_intervals; gates; machine_protection) -- protocol v6 with AMD-20261002-280481, -c7ccde, -f3fa33, -594eab, -236691, none of which changes CC-1 to CC-10, the statistic or A-CAL (each amendment header states it changes no threshold, statistic, cell, arm, seed or gate)
      - coordination/review/pfdr-011cd0-20261002/reviews/TASK-20261002-87ffc4/red-team-report.yaml (J4 d_dispersion, J6, PTM1, PTM2, required_controls, OBJ-RT-1 to OBJ-RT-6)
    convention_source: >-
      F-2 lesson (DEC-20261002-c3f49b rulings.validator_findings F-2): the row
      and relation conventions are those of
      experiments/EXP-PFDR-011cd0/specification.yaml counting_conventions
      CC-1_relation_unit, CC-1b_sign_only (reported only), CC-2_nonformal,
      CC-3_scope (TT: the whole table), CC-4_classes, CC-5_unit_of_replication,
      CC-6_exclusions, CC-7_counts, CC-8_statistic, CC-10_band; and
      cells.design_curves for the curve generator and base sizes. They are
      adopted here by clause, unchanged. No README is a convention source.
    p0_inputs_by_path_and_field:
