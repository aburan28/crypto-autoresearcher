        State in the contract text the simulation rule for kappa_hat < 1
        (binomial thinning of the simulated count, as analyze_relcensus.py
        does, or simulation at max(kappa_hat, 1), named as such), apply the
        same rule in the U_A coverage simulation and the |dev| fallback, and
        state the label the bound carries in that case.
      option_chosen: binomial thinning of the simulated count below kappa 1 (not simulation at max(kappa_hat, 1))
      option_justification: >-
        Chosen before data. (1) It is the rule under which the
        EXP-PFDR-011cd0 A-INT |dev|-quantile bound was computed
        (analyze_relcensus.py header "kappa < 1 (A-INT only) thins NB(mu, D)
        binomially", planted() and aint_q, read for this task); this draft
        names that bound as its fallback and reports it beside U_A in every
        case, so thinning keeps the fallback and the reported comparison bound
        on the same simulation model as their archived source. (2) It
        simulates the plug-in model at kappa_hat itself, so U_A keeps one
        construction for every kappa_hat and its simulated coverage at kappa
        = 1.00 measures the procedure actually applied there; simulation at
        max(kappa_hat, 1) would substitute a different model exactly in the
        region of the pre-committed expected outcome (O-A3). (3) The rule is
        stated in words in the contract, so analyze_a.py implements it from
        the text and still shares no code with the producer's tools.
      edits:
