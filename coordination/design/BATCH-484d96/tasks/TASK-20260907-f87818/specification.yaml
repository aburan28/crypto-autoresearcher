experiment:
  id: EXP-AUXIN-684adf
  hypothesis_id: H-AUXIN-7c52b2
  version: 1
  title: Exhaustive supplied-residue CRT coverage and charged-supply calibration
  status: draft
  review_required: true
  objective: >-
    Test the full stated finite arithmetic mechanism, its artifact controls,
    and its accounting interface without representing synthetic residues as a
    measured Cheon first stage or claiming an end-to-end attack improvement.
  inputs:
    source_paths:
      - ledger/hypotheses/H-AUXIN-7c52b2.yaml
      - ledger/proposals/IDEA-20260906-81648b.yaml
      - ledger/proposals/IDEA-20260905-830138.yaml
      - ledger/questions/RQ-AUXIN-f8d8c0.yaml
      - knowledge/literature/KN-LIT-6501.md
      - knowledge/literature/addenda/KN-LIT-6501/20260907-484d96.md
      - coordination/design/BATCH-484d96/source-packet.json
  source_boundary:
    primary_read_scope: Parent-filed Cheon r-1 Theorem 1 and Corollary 1 proof passages.
    published_precedent: Multiple supplied powers, residues, and CRT are already in Corollary 1.
    source_access: Parent retrieved the source; this design uses transmitted excerpts and the filed addendum.
    local_pdf_hash: null
    arithmetic_derivation: Internal elementary generalized-CRT derivation below; no new asymptotic result.
    excluded: [r_plus_1_branch, ordinary_input_ECDLP, deployment_supply_claims, actual_group_measurements]
  scale_relevance:
    tier: toy
    justification: Complete abstract arithmetic at primes 101 and 241; no elliptic-curve instance is executed.
    correspondence: null
  experimental_unit: >-
    One fixed tuple (r, family, panel, exponent k where applicable, order variant).
    Boundary and malformed fixtures are separate units. A scientific run is one
    complete invocation producing every declared unit; units are not independent trials.
  arithmetic_definitions:
    primes:
      - r: 101
        n: 100
        factorization: [{prime: 2, exponent: 2}, {prime: 5, exponent: 2}]
      - r: 241
        n: 240
        factorization: [{prime: 2, exponent: 4}, {prime: 3, exponent: 1}, {prime: 5, exponent: 1}]
    primality: Deterministic trial division through isqrt(r); verify factors prime and their powered product equals n.
    primitive_element: >-
      Select the least integer zeta from 2 through r-1 for which pow(zeta,n/q,r)
      differs from 1 for every distinct prime q dividing n. Verify pow(zeta,n,r)=1.
      This rule defines the fixture; no unexecuted numerical generator value is asserted.
    nonzero_positions: k=0,1,...,n-1 in ascending order; fixture truth x=pow(zeta,k,r).
    divisors: Each listed m is positive and divides n; d=n//m; m=1 is allowed and carries no information.
    residue: a=k mod m for correct fixtures; canonical integer 0<=a<m, with a=0 for m=1.
    empty_system: M=1, k0=0, all n exponent candidates; no auxiliary constraints.
    fold: >-
      Start (A,M)=(0,1). For each (a,m), let g=gcd(M,m). Reject inconsistent
      when (a-A) mod g != 0. Otherwise set h=m/g. If h=1 set u=0;
      else u=(((a-A)/g)*inverse(M/g mod h,h)) mod h. Set Mnew=M*h
      and Anew=(A+M*u) mod Mnew. Preserve integers exactly. End with k0=A.
    candidate_set: E={k0+M*t | integer 0<=t<n/M}; list in ascending exponent order.
    candidate_scalars: pow(zeta,e,r) for each e in E; use exact modular arithmetic.
    toy_original_verification: >-
      Compare every candidate scalar with fixture truth x. This is a disclosed
      scalar-equality surrogate for [candidate]P=Q, not a group-operation measurement.
      Evaluate all candidates, including after a match, and record match count and
      first-match index. Production combiner receives only n and ordered (m,a)
      inputs; no k, x, truth table, seed-derived solution, or reference result.
    independent_reference: >-
      A separately written reference function scans every e=0,...,n-1 and retains
      exactly those satisfying all canonical congruences. It must not import the
      production fold, CRT inverse helper, predicted M, or candidate generator.
      It compares sorted full sets, then independently verifies candidate scalars.
    elementary_derivation: >-
      Two congruences intersect iff their residues agree modulo gcd(M,m);
      dividing by that gcd leaves coprime factors and the stated modular inverse.
      The new modulus is lcm(M,m). Induction gives the complete intersection.
      Every input modulus divides n, so M divides n and the coset has n/M
      representatives in [0,n). A primitive zeta maps these representatives
      injectively to nonzero scalars. This is a design argument, not a run result.
  input_supply:
    fixture_kind: synthetic_scalar_residues
    generation: >-
      The fixture generator knows k and x and forms the residue inputs. It also
      writes one labeled supplied-token placeholder per constraint with exponent d.
      No placeholder is an actual group point, and no certificate asserts that a
      Cheon first stage was executed. Truth is stored separately and passed only
      to the independent verifier and toy original-target equality service.
    token_binding: >-
      Label each ordered constraint with its underlying fixture and original
      token index, exponent d, and source_kind=synthetic_placeholder. Reordering
      reorders whole records. Repeated d values retain separate references and
      report their multiplicity and distinct-exponent count; duplicate acquisition
      is never silently treated as extra independent information.
    measured: Fixture construction, input parsing, token-label checks, primitive certification, CRT, enumeration, model calculations, artifact serialization.
    not_measured: Actual group token acquisition, Cheon stages, group encoding size, group verification, or their success probability.
    acquisition_cost_policy: >-
      Actual acquisition time/memory/data and actual group operations are null
      with reason not_executed. Record both list token references and distinct d
      requirements. The eventual d=1 input can reference original Q and d=n can
      reference public P for nonzero x, but any such reuse needs an explicit source
      rule and charged verification; this calibration grants no free nonlinear token.
  positive_panels:
    - {id: P00, class: empty_baseline, m: [], expected_M: 1}
    - {id: P01, class: one, m: [10], expected_M: 10}
    - {id: P02, class: repeated, m: [10, 10, 10], expected_M: 10}
    - {id: P03, class: nested, m: [5, 10, 20], expected_M: 20}
    - {id: P04, class: noncoprime, m: [4, 10], expected_M: 20}
    - {id: P05, class: coprime_partial, m: [4, 5], expected_M: 20}
    - {id: P06, class: equal_lcm_single, m: [20], expected_M: 20}
    - {id: P07, class: equal_lcm_redundant, m: [4, 5, 20, 20], expected_M: 20}
    - {id: P08, class: full_single, m_by_r: {'101': [100], '241': [240]}, expected_M: n}
    - {id: P09, class: full_coprime, m_by_r: {'101': [4, 25], '241': [16, 3, 5]}, expected_M: n}
    - {id: P10, class: modulus_one, m: [1], expected_M: 1}
    - {id: P11, class: modulus_one_augmented, m: [1, 4, 10], expected_M: 20}
  inconsistency_panels:
    - {id: I01, m: [10, 10], residues: ['k mod 10', '(k+1) mod 10']}
    - {id: I02, m: [4, 10], residues: ['k mod 4', '(k+1) mod 10']}
    - {id: I03, m: [5, 20], residues: ['k mod 5', '(k+1) mod 20']}
    - {id: I04, m: [20, 20], residues: ['k mod 20', '(k+1) mod 20']}
  wrong_target_panels:
    source_positive_ids: [P01, P02, P03, P04, P05, P06, P07, P08, P09, P11]
    transformation: Replace every residue by (k+1) mod m; preserve original truth x=pow(zeta,k,r).
    expected: Consistent CRT and n/M candidates, but zero matches to the original x because M>1.
    supply_disclosure: Labels are well formed but describe synthetic powers of the wrong target; labels cannot authenticate input truth.
  malformed_fixtures:
    base: For each r use k=1 and positive P04, forward order, otherwise correct fields; apply one mutation only.
    cases:
      - {id: V01, mutation: 'replace r by r-1', expected: INPUT_UNSUPPORTED_R}
      - {id: V02, mutation: 'replace zeta by 1', expected: INPUT_NOT_PRIMITIVE}
      - {id: V03, mutation: 'remove factor 5 from n factorization', expected: INPUT_BAD_FACTORIZATION}
      - {id: V04, mutation: 'set first d to 0', expected: INPUT_BAD_D}
      - {id: V05, mutation: 'set first d to n+1', expected: INPUT_BAD_D}
      - {id: V06, mutation: 'set first m to 0', expected: INPUT_BAD_M}
      - {id: V07, mutation: 'set first m to 5 but retain first d=n/4', expected: INPUT_M_D_MISMATCH}
      - {id: V08, mutation: 'set first residue to -1', expected: INPUT_BAD_RESIDUE}
      - {id: V09, mutation: 'set first residue to first m', expected: INPUT_BAD_RESIDUE}
      - {id: V10, mutation: 'remove first supplied-token placeholder', expected: INPUT_MISSING_SUPPLY}
      - {id: V11, mutation: 'change first token exponent label to d+1 only', expected: INPUT_SUPPLY_BINDING_MISMATCH}
      - {id: V12, mutation: 'set x=0 with mode=nonzero', expected: INPUT_ZERO_NONZERO_MODE}
    gate_order: >-
      Supported r and primality; complete factorization; primitive element;
      nonzero mode boundary; d range/divisibility; m range/divisibility; m*d=n;
      canonical residue; supply presence; supply label binding. Expected error
      is the first failing check. Malformed cases never enter production CRT.
  zero_boundary:
    cases_per_prime: 1
    input: mode=zero, x=0, no constraints; original-target identity sentinel.
    expected: Return scalar 0 through the separate identity branch; no logarithm, CRT, first stage, or residual search.
    group_boundary: A future real group implementation checks Q is the identity before entering the nonzero branch.
  ordering_and_counts:
    prime_order: [101, 241]
    family_order: [malformed, zero, inconsistent, wrong_target, positive]
    order_variants:
      - {id: forward, transform: Original record order.}
      - {id: reverse, transform: Reverse the complete constraint records.}
      - {id: rotate_left_one, transform: Move the first record to the end; empty stays empty.}
    traversal: Family order, then prime order, then panel ID, then ascending k, then listed order variant.
    duplicate_order_policy: All three variants count even if their byte sequences coincide; they are deterministic invariance checks, not independent replications.
    formulas:
      positive: '(100+240)*12*3 = 12240'
      inconsistent: '(100+240)*4*3 = 4080'
      wrong_target: '(100+240)*10*3 = 10200'
      malformed: '2*12 = 24'
      zero: '2*1 = 2'
      total: '12240+4080+10200+24+2 = 26546'
    cases_by_prime: {'101': 7813, '241': 18733}
    scalar_constraint_cases: 26520
    reference_exponent_visits: 5272800
    predicted_candidate_equality_evaluations:
      positive: 509040
      wrong_target: 103440
      inconsistent: 0
      total: 612480
    counting_boundary: >-
      Candidate-equality totals refer to production candidates in a correct run,
      exclude the independent verifier's duplicate work and zero-branch checks,
      and are predictions, not measurements. Raw counters report both producer
      and verifier work separately. No malformed fixture is triplicated.
  replication:
    seeds: [0]
    seed_semantics: Reserved metadata seed 0; no RNG is permitted and no sampling occurs.
    independent_instances: 2
    independent_instances_definition: Two different prime-order arithmetic domains, not IID statistical samples.
    repeats_per_declared_cell: 1
    confidence_intervals: Not applicable to exhaustive exact arithmetic; no statistical extrapolation.
  independent_variables: [r, panel, k, constraint_order, consistency_family, input_mutation]
  controls:
    - name: independent_enumeration
      requirement: Exact set equality for every scalar-constraint cell, using separate full-domain code.
    - name: one_and_empty_baselines
      requirement: P00 gives all n exponents; P01 gives n/10; P08 and P09 give one; P10 gives all n.
    - name: matched_null
      requirement: P02 has P01 coverage; P03/P04/P05/P06/P07/P11 have identical sets at fixed r,k.
    - name: inconsistent_known_false
      requirement: I01-I04 have empty reference sets and production rejects before scalar verification.
    - name: consistent_wrong_target
      requirement: Every wrong-target cell has a nonempty consistent coset but no original-target recovery.
    - name: order_invariance
      requirement: All three orders have identical canonical coset or rejection outcome for the same unpermuted cell.
    - name: deliberately_faulty_product_rule
      requirement: >-
        On each existing positive cell also compute M_bad=product(m_i), with
        empty product 1. Compare this claimed coverage to independent reference
        cardinality and n divisibility. P02/P03/P04/P07/P11 must expose its error
        in exactly (100+240)*5*3=5100 cells; the other seven panels do not.
        This is an analytical mutant check inside existing cells, not extra runs.
    - name: input_and_zero_boundary
      requirement: All 24 malformed inputs reject with the declared code; both zero fixtures bypass CRT.
  metrics:
    primary:
      - Exact candidate-set disagreement count and first counterexample artifact.
      - CRT consistency/rejection confusion matrix against independent enumeration.
      - Original-target match counts for positive and wrong-target families.
      - Equal-LCM/repetition/order invariance violations.
      - Product-rule mutant detections by panel and their expected total 5100.
      - Completed case counts by prime/family/panel/order and missing/duplicate identifiers.
    secondary:
      - Measured stage time in integer nanoseconds and process CPU time; setup and serialization included separately.
      - Peak process RSS in bytes with platform units documented, live candidate-list sizes, input/output byte counts.
      - Gcd, inverse, residue-test, modular-power and candidate-equality call counts, with integer operand bit lengths.
      - Token-reference count, distinct required exponent count, and maximum serialized fixture and retained-result bytes.
      - Exact ceiling-square-root proxy and symbolic charged-supply expressions for every comparator row.
      - Actual group-operation/acquisition/time/memory/data fields null with not_executed reason.
  cost_and_frontier:
    accounting_scope: >-
      Measure actual arithmetic calibration overhead, including primality and
      factor checks, primitive search, fixture/supply-label construction, input
      verification, CRT, independent checking, toy equality, model computation,
      file IO and serialization. These costs are not the actual Cheon algorithm.
    exact_proxy: >-
      isqrtceil(z)=isqrt(z) if isqrt(z)^2=z else isqrt(z)+1. For a nonempty
      list define W=sum(isqrtceil(m_i))+isqrtceil(L) and
      S=max({isqrtceil(m_i)} union {isqrtceil(L)}). For empty list use
      W=isqrtceil(n), S=isqrtceil(n), explicitly as a residual-search proxy.
      These are integer model units, not operation counts. Report actual lists,
      multiplicities and L; do not silently deduplicate stage costs.
    symbolic_total: >-
      C_factor(n)+C_divisorcert+C_setup+C_supply+sum_i C_first(m_i)
      +C_CRT+C_residual(L)+C_verify+C_data_IO. The source-motivated table
      model has C_first(m)=O(sqrt(m)*log r) and residual
      O(sqrt(L)*log r), with unspecified constants. A complete-recovery cost
      additionally accounts for inverse success probability and all attempts.
      That probability and real acquisition cost are unknown here.
    memory: >-
      Report measured arithmetic peak memory. A prospective streamed table
      model needs max_i sqrt(m_i) and sqrt(L) group entries plus live input,
      certificates and overhead; entry byte size is unknown without a group
      encoding. Streaming does not make retained auxiliary data free.
    data: >-
      Report actual fixture/artifact bytes separately from future encoded group
      input bytes. List sparse token count and, as a comparator only, dense supply
      q=max(d_i) nontrivial power positions with explicit original-Q/public-P reuse
      convention unresolved. Dense acquisition is at least proportional to supplied
      token data; no conversion of token count into seconds or zero acquisition cost.
    comparison_rule: >-
      Compare proxies descriptively; a lower W alone is modeled arithmetic benefit.
      Net benefit remains unknown unless acquisition, preprocessing, verification,
      peak memory, data and success are matched and measured in a future protocol.
      Do not select panels or candidates after observing outcomes.
    comparator_rows:
      - id: F0
        name: No-auxiliary original-input baseline
        assessment: P00 arithmetic enumeration; generic table and rho-type time/memory tradeoffs are contextual, not reproduced group baselines.
      - id: F1
        name: Every single supplied divisor available in the current panel
        assessment: Enumerate every distinct listed m; report ceil-sqrt(m)+ceil-sqrt(n/m), memory proxy, source requirements, and minimum proxy with ties retained.
      - id: F2
        name: Every arithmetic single-divisor possibility for n
        assessment: Enumerate every divisor m of the certified n; report the same proxy; unsupplied powers remain unavailable rather than free baseline inputs.
      - id: F3
        name: Published multiple-power CRT table mechanism
        assessment: P09 full coprime coverage and every supplied partial panel; known precedent, source-motivated model only.
      - id: F4
        name: Redundant and equal-LCM inputs
        assessment: P01/P02 and P03/P04/P05/P06/P07/P11; same residual count does not imply same acquisition, stage cost or memory.
      - id: F5
        name: Table versus low-memory auxiliary-input variants
        assessment: Unresolved; parent-transmitted DEC-20260802-204 notes existing variants but current primary frontier and implementation are not reproduced.
      - id: F6
        name: Sparse versus dense power acquisition
        assessment: Explicit symbolic acquisition/data rows only; no legal protocol supply or measured acquisition is established.
      - id: F7
        name: IDEA-20260905-830138 typed supplied-token certificate
        assessment: Input grammar/provenance comparator, not an implemented solver; numerical algorithm comparison is not applicable.
      - id: F8
        name: Complete published ECC frontier
        assessment: Unknown; no complete all-row frontier was retrieved. No global Pareto or novelty conclusion is permitted.
    dominated_by: 'n/a (no result claimed)'
    sota_delta: 'no attack; conceptual/measurement contribution only; established improvement 0'
  prospective_group_interface:
    authorization: >-
      This section preserves the full mechanism for a later frozen source-group
      protocol. It authorizes no group code execution or group measurement here.
    input: >-
      Exact-order group (G,P,r), original Q=[x]P, certified n factorization and
      primitive zeta, each explicitly supplied Q_i=[x^d_i]P with recorded source,
      acquisition and storage. Validate encodings and subgroup membership;
      establish correctness of supply separately from mere membership.
    first_stage: >-
      With g_i=zeta^d_i of order m_i in F_r*, recover a_i by the sourced
      implicit-group first stage. A residue certificate checks
      [pow(zeta,d_i*a_i,r)]P=Q_i and 0<=a_i<m_i. This verifies the residue
      against its token, not that the token belongs to the original hidden x.
    crt: Use exactly the generalized fold above; reject incompatible residues.
    residual_search: >-
      Set L=n/M, b=ceil_sqrt(L). Baby table A_j=[zeta^(k0+M*j)]P for
      0<=j<b; giant values B_i=[zeta^(-M*b*i)]Q for
      0<=i<ceil(L/b). Collision gives t=j+b*i; enforce 0<=t<L,
      compute candidate scalar and verify [candidate]P=Q. Charge all modular
      exponentiation, scalar multiplication, table hashing/collision checks,
      storage and final verification. Stream stage tables only with an explicit
      memory schedule. Neither this table search nor its cost is run in this calibration.
    remaining_requirements: >-
      Exact curve/group fixtures, authenticated or planted supply generation,
      source-defined stage implementation and independent review, baseline
      operation accounting, memory/data schedule, success definition and a new
      genuine launch lock. No ordinary-point derivation of Q_i is assumed.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 4
    memory_limit_bytes: 4294967296
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Complete the exact declared case set once; do not add sizes, seeds, panels or successful-only retries.
    - Record every mismatch and continue the fixed set when safe; never discard anomalous cases.
    - On input-source/hash mismatch, abort before scientific execution and record an operational invalidation.
    - On memory protection, crash, interruption or write failure, preserve a partial receipt and counts; classify incomplete, not negative scientific evidence.
    - No arbitrary wall-clock or CPU research cap; any machine watchdog is disclosed protection and does not exhaust the campaign.
    - Any additional scientific invocation needs a separately bound run and Coordinator handling of the frozen count; no silent retries.
  invalidation_rules:
    - Unapproved or unbound code, dirty-tree provenance missing, missing genuine launch lock or required independent implementation review.
    - Producer reads k/x/truth or reference outputs, except the explicitly separate equality verification service.
    - Missing/duplicate/altered planned cells, changed fixture rules, control omission, or mismatched artifact hashes.
    - Reference code shares the production CRT logic, or toy equality/group-operation metrics are mislabeled.
    - Incomplete execution or unavailable artifact provenance; distinguish this from a complete valid run exposing a counterexample.
  success_criterion: >-
    A complete, provenance-valid run covers all 26546 cells; all 26520 scalar
    candidate sets and classifications match independent enumeration; every
    positive cell has exactly one original-target match, every wrong-target
    cell has none, all 4080 inconsistent systems reject, all 24 malformed
    controls and both zero boundaries behave as declared; matched/order controls
    pass and the product mutant is detected in exactly 5100 cells. Complete
    source/cost/null accounting is mandatory. Outcome means finite calibration
    passed, never that a new attack or net speedup was established.
  falsification_criterion: >-
    In a complete provenance-valid run, any independent-reference mismatch,
    invalid accepted input, missed inconsistent system, wrong-target recovery,
    incorrect coverage invariance, or escaped declared product-mutant control
    falsifies this implementation/calibration claim within the exact tested
    scope. Preserve counterexamples and diagnose artifacts before attributing
    anything to the mathematical mechanism. A worse cost proxy alone is not
    falsification of CRT or evidence against all supplied-input algorithms.
  decision_outcomes:
    positive: finite_arithmetic_calibration_passed_only
    negative: complete_valid_calibration_counterexample_requires_diagnosis
    inconclusive: missing_provenance_or_incomplete_execution_or_unreliable_reference
    modeled_benefit: >-
      For each panel independently label integer W versus its available-single
      baseline lower/equal/higher; P00 with no available token uses no-aux baseline.
      This descriptive label cannot determine the scientific success outcome.
    end_to_end_benefit: not_measured
    hypothesis_transition: Requires a separate committed Coordinator decision and independent review; none automatic.
  required_artifacts:
    - manifest.yaml
    - command.txt
    - environment.json
    - stdout.log
    - stderr.log
    - raw-result.json
    - source-bindings.json
    - launch-binding.json
    - fixtures.jsonl
    - truth.jsonl
    - cases.jsonl
    - reference-results.jsonl
    - counterexamples.jsonl
    - control-summary.json
    - cost-frontier.json
    - telemetry.json
    - artifact-sha256.json
    - execution-report.yaml
  artifact_layout:
    run_directory: experiments/EXP-AUXIN-684adf/runs/<allocated_RUN_ID>/
    exact_filename_count: 18
    contents: >-
      The manifest follows the current canonical run schema, with authentic
      executing commit and dirty state, actual environment, inputs, timing,
      result and certificate.kind=none. Source bindings hash the approved spec,
      implementation and reference, input packet, hypothesis, source-reading
      addendum, approval decision, implementation review and genuine launch lock.
      launch-binding records the allocated run/task/claim and exact authorized
      scientific count. cases contains every declared case once with input
      binding, exact output, reference comparison and counters. Empty
      counterexamples.jsonl is an explicit zero-length artifact, not omitted.
      raw-result summarizes all counts/outcomes and distinguishes model values
      from measured arithmetic and unmeasured group costs. artifact-sha256 hashes
      every other listed file using relative paths; it excludes itself to avoid
      a circular hash and is bound by the archive. No commit/hash/run ID is invented.
  assigned_to: executor
  approved_by: null
  future_approval_decision: DEC-20260907-6e1311
  execution_gate: >-
    Scientific execution requires canonical archival and committed
    Coordinator approval, an implementation-only handoff followed by an
    independent implementation review, and a separate scientific executor
    handoff with a genuine launch lock bound to the exact approved bytes.
