    repo_head_at_review: df6633e3eb40edcfa80579d9d82c5572945f3283
    producer_snapshot_commit: 8c7082b95
    note: >-
      Reviewed Coordinator-committed producer artifacts on this branch. Did not
      treat working-tree-only sibling outputs as evidence. Did not read
      TASK-20260916-41af61 outputs (blindness constraint; sibling review dir
      absent at review time).
  claim_under_review: >-
    Producer package RUN-AUXIN-6117d3 reports controls_passed=true under an
    asymptotic evaluator-sanity substitution, writes a deployed E(r)/E_bound
    table, and sets stop_and_escalate=true with six deployed curves at reported
    E(r)<=0.40. DEC-20260916-c81d20 accepts the bytes as snapshotted
    observations with disclosed protocol deviations and forbids promoting
    deployed E(r). This red-team attacks overclaim risk, control-failure
    contamination, E_bound vs E(r) conflation, and any path from reported
    E(r)<=0.40 to an ordinary-ECDLP or vulnerability sentence.
  does_not_promote_deployed_E_r: true
  does_not_assert_vulnerability: true
  does_not_assert_ordinary_ECDLP_improvement: true

  review_attestation:
    joints_owned:
      - overclaim_risk_on_stop_and_escalate_package
      - control_failure_contamination_of_deployed_rows
      - E_bound_vs_E_r_conflation
      - ordinary_ECDLP_or_vulnerability_leak_paths
    read_sibling_reports: false
    read_sibling_reports_note: >-
      Blindness constraint forbids reading TASK-20260916-41af61. Sibling review
      directory was absent. No validator verdict was read or relied on.
    sources_read:
      - agents/red-team.md
      - ledger/handoffs/TASK-20260916-fa9626.yaml
      - ledger/decisions/DEC-20260916-c81d20.yaml
      - ledger/decisions/DEC-20260802-204.yaml
      - ledger/goals/GOAL-AUXIN-a93442.yaml
      - experiments/EXP-AUXIN-7e2e3d/specification.yaml
      - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/e_table.json
      - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/controls_receipt.json
      - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/execution-report.yaml
      - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/stdout.log
      - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/manifest.yaml
      - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/raw-result.json
    sources_deliberately_not_read:
      - coordination/design/BATCH-cae584/reviews/TASK-20260916-41af61/
      - any Cheon primary PDF beyond DEC-20260802-204's already-filed prior-art summary
    verdict_on_owned_joints: breaks
    verdict_scope: >-
      `breaks` on the joints this task owns: the package's controls_passed /
      stop_and_escalate packaging is not a safe measurement-success escalate
      reading under the frozen contract; deployed rows are contaminated by
      failed frozen control bands; E_bound/E(r) edges can be conflated; and
      every ordinary-ECDLP or vulnerability sentence from these numbers is
      forbidden. This is NOT a whole-claim verdict on H-AUXIN-66e6fd and NOT
      promotion or rejection of any numeric E(r). Coordinator composes with the
      independent validator lane.

  objections:
    - id: RT-FA9626-O1
      topic: frozen_control_failure_contaminates_all_deployed_rows
      severity: critical
      finding: >-
        controls_receipt.json records frozen_numeric_bands_pass=false:
        planted E≈0.27795 outside frozen band [0.24,0.26], and safe-prime
        r-1 E≈0.48387 below frozen threshold 0.49. specification.yaml
        stopping_rules[0] requires stopping Stage 1 deployed rows if either
        synthetic control fails and forbids interpreting deployed
        factorizations. falsification_criterion likewise voids deployed
        conclusions when planted E is out of band or safe-prime r-1 E < 0.49.
        The executor continued under control_gate_mode=
        asymptotic_evaluator_sanity_due_to_spec_band_bitlength_conflict and
        set controls_passed=true. That substitution is a disclosed protocol
        deviation, not a passing frozen control. Every deployed row in
        e_table.json, and the stop_and_escalate flag itself, is therefore
        contaminated for official reading: the frozen contract's admission
        gate for deployed conclusions did not open.
      cited_artifacts:
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/controls_receipt.json
        - experiments/EXP-AUXIN-7e2e3d/specification.yaml
        - ledger/decisions/DEC-20260916-c81d20.yaml
      falsification_route: >-
        Re-run Stage 0–1 controls only under the frozen numeric bands (or an
        additive amendment that rewrites those bands and bit-length floors
        consistently). If planted E lands in [0.24,0.26] and safe-prime r-1
        E >= 0.49 with the same evaluator, contamination is cleared for a
        fresh deployed census. If frozen bands remain unreachable at the
        stated toy bit lengths, the control design itself is the defect and
        no deployed table from RUN-AUXIN-6117d3 becomes admissible by
        reinterpretation.

    - id: RT-FA9626-O2
      topic: controls_passed_true_is_label_laundering
      severity: critical
      finding: >-
        The same boolean controls_passed=true is written into
        controls_receipt.json, e_table.json, execution-report.yaml,
        manifest.yaml, and raw-result.json, while frozen_numeric_bands_pass
        remains false and is easy to miss. Downstream readers that key only
        on controls_passed will treat the escalate package as a completed
        measurement success. That is the cheapest overclaim path in the
        artifact set: no one needs to invent a vulnerability sentence for
        the false gate bit to smuggle an admissible-table reading.
      cited_artifacts:
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/e_table.json
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/controls_receipt.json
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/execution-report.yaml
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/manifest.yaml
      falsification_route: >-
        Any official evidence or decision record that cites this run must
        quote frozen_numeric_bands_pass=false beside controls_passed, or
        refuse the controls_passed bit as non-authoritative under the frozen
        contract. A mechanical check: if frozen_numeric_bands_pass is false,
        treat controls_passed as non-binding for Stage 1 admission.

    - id: RT-FA9626-O3
      topic: stop_and_escalate_is_not_admissible_escalate_measurement_success
      severity: major
      finding: >-
        e_table.json sets stop_and_escalate=true with curves NIST-P-224,
        NIST-P-256, secp256k1, brainpoolP256r1, BN254-r, BLS12-381-r at
        reported complete-lattice E(r) in approximately
        [0.2539, 0.3945], all <= 0.40. specification.yaml's escalate
        reading is defined as a measurement-success shape that also
        requires planted and safe-prime frozen controls. Goal pause
        condition requires independent validation and red team on a
        near-sqrt(r) hit before further work — that is a protocol event,
        not permission to promote the numbers. Under O1, the correct
        status of these rows is: observed bytes under a failed frozen
        gate; review-only; not an inert/escalate adjudication.
      cited_artifacts:
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/e_table.json
        - experiments/EXP-AUXIN-7e2e3d/specification.yaml
        - ledger/goals/GOAL-AUXIN-a93442.yaml
        - ledger/decisions/DEC-20260916-c81d20.yaml
      falsification_route: >-
        After a passing frozen-band control re-run (or amended bands),
        recompute only then whether any deployed complete E(r) is <= 0.40.
        Until then, strip stop_and_escalate from any claim sentence; retain
        it only as a disclosed producer flag under failed controls.

    - id: RT-FA9626-O4
      topic: E_bound_vs_E_r_conflation
      severity: major
      finding: >-
        Four rows are quantity_kind=E_bound (NIST-P-384, NIST-P-521,
        brainpoolP384r1, Ed25519-L). Three of those report values <= 0.40
        (P-384≈0.3925, brainpoolP384r1≈0.3972, Ed25519-L≈0.3570) but are
        correctly absent from stop_and_escalate_curves. Two opposite errors
        remain open: (A) promoting an E_bound as if it were exact E(r);
        (B) reading bound_direction
        ("true E(r) <= reported value; unknown factors could only lower E")
        and treating a <=0.40 E_bound as weaker evidence than it is for
        escalate urgency, or as proof of a specific E(r). Ed25519-L is a
        sharp edge: r+1 factorization is complete with minimizing E≈0.357,
        while r-1 has an unfactored cofactor, so the row is labeled E_bound
        even though one complete branch already sits below 0.40. That is
        not license to call the row E(r), and not license to drop it from
        escalate consideration after controls actually pass — it is a
        protocol ambiguity that must be named, not silently resolved toward
        either a vulnerability sentence or a false inert reading.
      cited_artifacts:
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/e_table.json
        - experiments/EXP-AUXIN-7e2e3d/specification.yaml
      falsification_route: >-
        Tabulate three mutually exclusive columns for every curve:
        E(r)_complete (both branches complete), E_branch_complete (per
        complete branch only), and E_bound (known-divisor min). Apply the
        escalate ceiling only to the column the amendment names. Completing
        the Ed25519-L r-1 cofactor (or an amended rule that escalate may
        fire on a complete-branch E) is the discriminating mutation.

    - id: RT-FA9626-O5
      topic: ordinary_ECDLP_and_vulnerability_leak_paths
      severity: critical
      finding: >-
        REFUSAL: no sentence of the form "P-256 / secp256k1 / Ed25519 is
        broken", "ordinary ECDLP below rho", or "deployed ECDSA/EdDSA is
        vulnerable" is supported by RUN-AUXIN-6117d3. The measured object
        is a modelled Cheon-expression exponent on divisor lattices of
        pinned r±1; cheon_executions=0 and discrete_log_recoveries=0.
        DEC-20260802-204's acquisition gate remains binding: Cheon's
        O(sqrt((r-1)/d)+sqrt(d)) route assumes certified auxiliary input
        A=[x^d]P; ordinary input P,Q=[x]P does not supply it below
        rho-scale work. GOAL-AUXIN-a93442 states a vulnerability claim
        would require arithmetic census AND protocol-supply audit AND
        certified recovery; Stage 2 protocol join is unauthorized under
        EXP-AUXIN-7e2e3d. Comparing E(r) to rho baseline 0.5 without the
        auxiliary-input assumption is exactly the ordinary-ECDLP overclaim
        the acquisition gate forbids. Pairing-friendly rows BN254-r and
        BLS12-381-r are flagged expected_structure_flag=true; folding them
        into a "six standardized curves hit" vulnerability narrative
        inflates surprise against the preregistered prediction.
      cited_artifacts:
        - ledger/decisions/DEC-20260802-204.yaml
        - ledger/goals/GOAL-AUXIN-a93442.yaml
        - experiments/EXP-AUXIN-7e2e3d/specification.yaml
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/e_table.json
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/controls_receipt.json
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/execution-report.yaml
      falsification_route: >-
        Proves-too-much control: take the same E(r)<=0.40 observation and ask
        whether it implies ordinary-ECDLP < rho on a curve with no released
        powers. The implication must fail. Any draft evidence/decision text
        that still asserts ordinary-ECDLP improvement or vulnerability from
        this run alone is invalid_measurement under specification.yaml
        invalidation_rules.

    - id: RT-FA9626-O6
      topic: r_plus_1_minimizers_are_not_classic_r_minus_1_Cheon_without_variant
      severity: major
      finding: >-
        Among complete E(r) escalate-list rows, NIST-P-224 and
        brainpoolP256r1 minimize on branch r+1, not r-1. Classic Cheon
        auxiliary-input statements filed in DEC-20260802-204 are for d |
        (r-1). The experiment's frozen formula admits an r+1 variant, but
        reporting a single E(r) and comparing it to 0.40 / 0.5 without naming
        the branch lets a reader import the EUROCRYPT-2006 r-1 theorem
        unchanged. That is a reduction-instantiation overclaim even before
        any protocol-supply sentence.
      cited_artifacts:
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/e_table.json
        - ledger/decisions/DEC-20260802-204.yaml
        - experiments/EXP-AUXIN-7e2e3d/specification.yaml
      falsification_route: >-
        Split the table into E_{r-1} and E_{r+1}. Apply escalate ceilings
        per branch against the matching cited variant. If the r+1 variant
        citation cannot be filed as KN-LIT, keep r+1 numbers as arithmetic
        only and forbid Cheon-named security sentences on those rows.

    - id: RT-FA9626-O7
      topic: executor_self_assessment_understates_required_repair
      severity: minor
      finding: >-
        execution-report.yaml executor_assessment.requires_rerun=false and
        protocol_complete=true while disclosing that frozen control bands
        failed and asymptotic substitution was used. Under the frozen
        stopping rule, Stage 1 deployed interpretation is not complete.
        DEC-20260916-c81d20 correctly refuses that self-assessment; this
        objection records the producer's requires_rerun=false as an
        overclaim risk if later readers cite the executor_assessment instead
        of the Coordinator decision.
      cited_artifacts:
        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/execution-report.yaml
        - ledger/decisions/DEC-20260916-c81d20.yaml
      falsification_route: >-
        Prefer DEC-20260916-c81d20 over executor_assessment for any admission
        or rerun decision. A passing frozen-band control package is the
        only mutation that can flip requires_rerun for scientific reading.

  required_controls:
    - id: RT-FA9626-C1
      name: frozen_band_control_rerun_or_additive_amendment
      purpose: Clear or formally replace the failed Stage 1 admission gate.
      procedure: >-
        Either (i) additive amendment reconciling planted/safeprime numeric
        bands with toy bit lengths and asymptotic E≈0.25+1/log2(r) /
        E≈0.5-0.5/log2(r), then re-approve; or (ii) re-run controls only
        under the existing frozen bands at bit lengths that make those
        bands reachable. Do not interpret deployed rows until one of these
        completes.
    - id: RT-FA9626-C2
      name: controls_passed_authority_check
      purpose: Prevent label-laundering of asymptotic substitution.
      procedure: >-
        Machine-check that no evidence/decision record treats
        controls_passed=true as Stage 1 admission while
        frozen_numeric_bands_pass=false.
    - id: RT-FA9626-C3
      name: three_column_E_table
      purpose: Block E_bound / E(r) / complete-branch conflation.
      procedure: >-
        Emit E(r)_complete, E_branch_complete, E_bound as separate labeled
        columns; apply escalate ceiling only to the amended column.
    - id: RT-FA9626-C4
      name: proves_too_much_ordinary_ECDLP
      purpose: Detect vulnerability/ordinary-ECDLP leak language.
      procedure: >-
        Run any candidate claim sentence against a null protocol that
        releases no auxiliary powers. The sentence must fail. Also require
        explicit DEC-20260802-204 acquisition-gate citation beside any
        comparison of E(r) to 0.5.
    - id: RT-FA9626-C5
      name: pairing_expected_structure_stratification
      purpose: Prevent surprise inflation from BN254/BLS12 rows.
      procedure: >-
        Report escalate hits stratified by expected_structure_flag; never
        count pairing-friendly rows toward a "surprising standardized
        curve" headline without the flag.

  counterexample_or_mutation: >-
    Cheapest discriminating mutation: keep the evaluator fixed, amend or
    re-run only the two synthetic controls to frozen bands, and refuse every
    deployed E(r)/E_bound reading until that gate passes. If the gate cannot
    pass at the stated toy bit lengths, the control design is falsified and
    RUN-AUXIN-6117d3's deployed table remains permanently non-admissible
    under this contract version — not evidence that Cheon is inert or live.
    Second mutation for E_bound conflation: complete Ed25519-L's r-1
    cofactor (or declare complete-branch escalate rules) and check whether
    the escalate set changes without touching any security sentence.

  baseline_comparison:
    ordinary_ECDLP:
      dominated_by: Pollard_rho_kangaroo
      time_exponent_prior_best: 0.5
      sota_delta_from_this_run: 0.0
      interpretation: >-
        No ordinary-ECDLP Pareto movement. E(r) is not an ordinary-input
        cost. Acquisition of A=[x^d]P remains unresolved
        (DEC-20260802-204 C7/C8).
    auxiliary_input_Cheon_expression:
      baseline: Cheon_DLP_with_auxiliary_input
      prior_art_ref_decision: DEC-20260802-204
      expression: O(sqrt((r±1)/d) + sqrt(d))
      what_this_run_measures: >-
        MODELLED dimensionless exponent from that expression on measured
        divisor lattices — not wall-clock Cheon, not memory of Cheon
        tables as an attack, not supply of auxiliary powers.
      dominated_by_note: >-
        Against ordinary ECDLP, this route is dominated by rho unless
        auxiliary input is independently supplied. Against the auxiliary-
        input problem, the baseline is Cheon itself; a low E(r) is a
        parameter fact about r±1, not a new algorithm.
      sota_delta: null
      sota_delta_note: >-
        No algorithmic SOTA claim is in scope. Deployed E(r) values are
        not promoted.

  heuristic_challenges:
    - id: RT-FA9626-H1
      challenge: >-
        No numbered heuristic is claimed; the census is billed as exact
        arithmetic. Challenge: asymptotic control substitution reintroduces
        an unnumbered modelling assumption (E≈0.25+1/log2(r) /
        E≈0.5-0.5/log2(r) at toy bit length) into the admission gate while
        leaving the deployed table labeled as exact. Either the gate is
        exact frozen bands, or the modelling assumption must be numbered,
        justified, and amended into the contract — not smuggled via
        controls_passed.
    - id: RT-FA9626-H2
      challenge: >-
        Optimistic omission of log2(r) group-op cofactor (specification
        cost_model_disclosure) systematically understates modelled Cheon
        operation counts. For NIST-P-256, MODELLED_LOG_COFACTOR≈0.285 still
        sits below 0.40, so the escalate bit is not removed by that cofactor
        alone — but any concrete-cost or vulnerability-adjacent sentence
        that uses bare E(r) without the cofactor column is still cost-model
        dishonest.

  cost_model_challenges:
    - id: RT-FA9626-CM1
      challenge: >-
        Total attack cost is not E(r). Even under auxiliary input, end-to-end
        cost needs per-attempt group operations × scheduling × memory
        (tables O(max(sqrt(m/d),sqrt(d)))) × acquisition/supply of the
        powers. This run measures none of the group-op side and must not be
        read as a concrete attack cost.
    - id: RT-FA9626-CM2
      challenge: >-
        Comparing E(r) to rho baseline 0.5 in one table without a column
        labeled ASSUMES_AUXILIARY_INPUT is a cost-model category error that
        recreates the ordinary-ECDLP overclaim DEC-20260802-204 rejected.

  reduction_and_scope_challenges:
    - id: RT-FA9626-R1
      challenge: >-
        Reduction instantiation: filing E(r) under "Cheon" requires the
        matching branch hypothesis (d|r-1 vs d|r+1 variant), certified
        auxiliary powers, and no silent transfer to ordinary ECDLP.
    - id: RT-FA9626-R2
      challenge: >-
        Scope inflation: affected-vs-safe scheme lists are explicitly not
        authorized (specification what_this_is_not; Stage 2 gated). Any
        "P-256 weak / Ed25519 safe" sentence from this census alone is
        scope inflation.
    - id: RT-FA9626-R3
      challenge: >-
        IDEA-20260831-ccb587 must stay closed. Opening a protocol audit
        because stop_and_escalate fired under failed controls would convert
        a contaminated arithmetic observation into a supply-side security
        narrative.

  proof_architecture_challenges:
    - id: RT-FA9626-P1
      challenge: observation_fiber
      detail: >-
        Hold E(r)<=0.40 fixed and vary the protocol object from
        "no released powers" to "q-SDH-style released powers". The security
        conclusion changes; therefore E(r) alone does not determine
        vulnerability. Missing separator: protocol-supply join + recovery
        certificate.
    - id: RT-FA9626-P2
      challenge: quantifier_order
      detail: >-
        The executor chose the asymptotic gate after seeing frozen-band
        failure. That is exists-gate-after-seeing-outcome, not
        forall-rows under the pre-registered gate. Official reading must
        not inherit that quantifier order.
    - id: RT-FA9626-P3
      challenge: nearby_object
      detail: >-
        Nearby object where escalate-style numbers are expected and
        non-scandalous: pairing-friendly BN254/BLS12 (expected_structure
        flag). An argument that treats those the same as NIST-P-256 for
        surprise/urgency proves too little about standardized Weierstrass
        orders.

  contamination_analysis:
    frozen_controls_failed: true
    planted_frozen_band_pass: false
    planted_E_observed: 0.2779524849907762
    planted_band_frozen: [0.24, 0.26]
    safeprime_frozen_band_pass: false
    safeprime_r_minus_1_E_observed: 0.4838730086586321
    safeprime_threshold_frozen: 0.49
    asymptotic_substitution_used: true
    deployed_rows_admissible_under_frozen_contract: false
    stop_and_escalate_admissible_as_measurement_success: false
    stop_and_escalate_admissible_as_protocol_review_event: true
    protocol_review_event_note: >-
      Goal pause_conditions still require independent validation and red
      team on this class of observation. That review is what this task is.
      It does not clear contamination or promote E(r).
    contaminated_artifacts:
      - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/e_table.json
      - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/execution-report.yaml
      - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/manifest.yaml
      - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/raw-result.json
    uncontaminated_for_control_diagnosis_only:
      - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/controls_receipt.json
    summary: >-
      Failed frozen controls void deployed-curve conclusions under the
      frozen specification. The asymptotic sanity gate may be useful later
      as an amended control, but as executed it contaminates every deployed
      E(r)/E_bound row and the stop_and_escalate packaging for official
      scientific reading. Retain the control receipt as evidence of the
      band/bitlength conflict; do not promote the deployed table.

  explicit_refusals:
    - refusal: vulnerability_claim
      text: >-
        This review refuses any vulnerability claim about ECDSA, Ed25519,
        P-256, secp256k1, Brainpool, BN254, BLS12-381, or any other
        deployed scheme based on RUN-AUXIN-6117d3.
    - refusal: ordinary_ECDLP_improvement
      text: >-
        This review refuses any ordinary-ECDLP improvement, SOTA, or
        below-rho claim based on reported E(r)<=0.40. DEC-20260802-204
        acquisition gate stands.
    - refusal: promotion_of_deployed_E_r
      text: >-
        This review refuses promotion of deployed E(r) or E_bound values to
        supported measurement success, KN-FIND, or hypothesis-status
        movement.
    - refusal: cheon_execution_or_dl_recovery
      text: >-
        This review did not run Cheon, did not recover a discrete logarithm,
        and treats cheon_executions=0 / discrete_log_recoveries=0 on the
        producer receipt as binding for scope.

  narrowest_supported_statement: >-
    RUN-AUXIN-6117d3 is a snapshotted producer observation in which frozen
    numeric control bands failed, an asymptotic control substitution was
    disclosed, deployed E(r)/E_bound rows and a stop_and_escalate flag were
    nevertheless written, and no Cheon execution or DL recovery occurred.
    Under EXP-AUXIN-7e2e3d's frozen stopping and falsification rules, those
    deployed rows are not admissible measurement success. The package is a
    protocol stop-and-review event only. No ordinary-ECDLP improvement and
    no vulnerability statement follows. DEC-20260916-c81d20's refusal to
    promote deployed E(r) is upheld on red-team grounds.

  next_concrete_action: >-
    After the sibling validator returns on the control-band vs toy-bitlength
