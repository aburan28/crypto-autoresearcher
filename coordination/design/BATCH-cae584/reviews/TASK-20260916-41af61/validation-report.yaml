        - experiments/EXP-AUXIN-7e2e3d/runs/RUN-AUXIN-6117d3/execution-report.yaml
        - coordination/design/BATCH-cae584/archives/TASK-20260913-d428ec/snapshot.json
    conclusion: >-
      Under the frozen stopping_rules and success/falsification criteria,
      both synthetic controls fail their numeric bands, so Stage 1 deployed
      rows are void. The executor's asymptotic-sanity substitution is a
      disclosed protocol deviation and does not restore admissibility of
      deployed conclusions. Official reading of deployed rows requires an
      additive protocol amendment or a control re-run that passes the
      (possibly amended) frozen bands.

  deployed_E_r_promotion:
