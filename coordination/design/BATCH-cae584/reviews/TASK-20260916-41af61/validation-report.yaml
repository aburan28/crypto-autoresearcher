  frozen_band_vs_bitlength:
    verdict: incompatible
    detail: >-
      The frozen numeric success bands are jointly unreachable with the
      stated toy construction bit lengths under the same E(r) formula the
      contract freezes. This is a specification defect, not a flaky sample.
    planted:
      frozen_band: [0.24, 0.26]
      construction_bit_length: [32, 64]
      asymptotic_model: 'E ≈ 0.25 + 1/log2(r) when d ≈ sqrt(r) divides r-1'
      observed:
        r: 58795822963
        r_bits: 36
        E_r_float64: 0.2779524849907762
        asymptotic_prediction_receipt: 0.2777777777777778
        independent_recompute_E: 0.2779524849907762
        frozen_band_pass: false
      range_check: >-
        Across the entire allowed construction range, asymptotic E stays
        above 0.26: ~0.28125 at 32 bits, ~0.265625 at 64 bits. Entering
        [0.24, 0.26] requires log2(r) ≳ 100 (~100-bit r), outside [32, 64].
    safeprime_r_minus_1:
      frozen_threshold: 0.49
      construction_bit_length: [16, 32]
      asymptotic_model: 'E ≈ 0.5 − 0.5/log2(r) for minimizing d=2 on r-1=2q'
      observed:
        r: 2147576603
        r_bits: 32
        r_minus_1_E_float64: 0.4838730086586321
        asymptotic_prediction_receipt: 0.484375
        independent_recompute_E_d2: 0.4838730086586321
        frozen_band_pass: false
      range_check: >-
        Across the entire allowed construction range, asymptotic E stays
        below 0.49: ~0.46875 at 16 bits, ~0.484375 at 32 bits. Reaching
        ≥0.49 requires log2(r) ≳ 50 (~50-bit r), outside [16, 32].

  stage1_deployed_rows_voided:
    verdict: true
    under: experiments/EXP-AUXIN-7e2e3d/specification.yaml stopping_rules
    frozen_rule: >-
      Stop Stage 1 deployed rows if either synthetic control fails; report
      the control failure; do not interpret deployed factorizations.
    success_criterion_clause: >-
      Measurement success requires planted E(r) in [0.24, 0.26] and
      safe-prime r-1 exponent >= 0.49.
    falsification_clause: >-
      Planted E outside [0.24, 0.26] or safe-prime r-1 < 0.49 voids the
      evaluator; no deployed conclusion.
    observed_gate_substitution:
      control_gate_mode: asymptotic_evaluator_sanity_due_to_spec_band_bitlength_conflict
      controls_passed_under_substitute: true
      frozen_numeric_bands_pass: false
      disclosed_in:
