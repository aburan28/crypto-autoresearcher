      - plant selections (planted_target and planted_growth index sets) and their K_b -- computed only by analyze_c.py p0 from the declared seed rules; recorded in design.json before any census run
      - the offsets x0 and the small-height screen -- design_c.py only, as EXP-PFDR-0b3699 controls_design_notes, before any census run
      - census rows, harvest rows, staircases and base records -- the census CLI launched by run_jobs.py only
      - merged rows and merge-report.json -- run_jobs.py merge only (AR-1 (3) form)
      - row-verify.json and checks-report.json -- analyze_c.py checks only (verify_rows.py invoked by path; AR-2 (1) form)
      - calibration.json, arm-read-log.json, null-tables, real-data power tables and view-map.json -- analyze_c.py calibrate only, from null-arm records filtered by arm name before any count is parsed; sha256 pinned before RC-07
      - analysis.json, cells.jsonl, ladders.jsonl and view-map.json -- analyze_c.py unmask only
      - g-repro-report.json -- reproduce_check.py only
      - raw-result.json, manifest.yaml, checksums.sha256 -- run_jobs.py finalize only (or run_wrapper.py for the wrapped process's own files)
      - pins -- implementation-notes.yaml only, append-only, each pin with timestamp and sha256 (the pin location analyze_c.py reads is named in the file's header before first use; A-6 lesson)
      - any other data file or mechanical rule application is a stop with options recorded (local_ambiguity_rule), never an improvised file or hand edit

  # ---------------------------------------------------------------------------
  cells_and_rungs:
    growth_cells: >-
      Nine: (A, class, m) for A in {subgroup, small_x, dickson} and (class, m)
      in {TT3, SS3, SS5}. These are the FAM-1 cells of EXP-PFDR-011cd0 at
      those (class, m), read across rungs instead of pooled over 30-32. The
      family-wise control (DS-3 "across the three cells") is taken over all
      nine: the three named (class, m) cells each carry three bases, and
      controlling the nine controls the three.
    rungs: [20, 22, 26, 30, 32]
    rung_choice_reason: >-
      Five rungs, all inside the numpy band (p < 2^32). Delta log2 N is about
      12 (20 to 32 bits). The spread is chosen for slope precision and for
      rung-loss robustness: the bit-level sum of squares about the mean is
      104 (deviations -6, -4, 0, 4, 6), against 80 for {20, 24, 28, 32};
      losing either end rung leaves four rungs with sum of squares 59, and
      losing an inner rung leaves 104 (rung 26) or 84 (rung 22 or 30)
      (planning approximation (hand)).
      Every rung is an even bit size at which EXP-PFDR-011cd0 has realised
      random arms for TT3, SS3 and SS5 at the decision scope, so each rung's
      P0 inputs are read directly, not interpolated; 30 and 32 keep the
      rungs comparable with the FAM-1 band for the RCT-2 yardstick.
    rung_loss_rule: >-
      A cell may lose ONE rung and still be read (four valid rungs). A rung b
      is valid for a cell when the runs it reads pass every invalidating
      gate and at least 80% of rung b's design curves for that (class, m)
      remain after CC-6 for the cell's arm and its family's randoms. A cell
      with fewer than four valid rungs is G-INVALID (reason: rungs). A rung
      lost to a timeout, crash, memory or disk stop is infrastructure signal,
      never a negative reading; it is resumed by a per-run watchdog
      continuation where the stopping rules allow, before it is counted lost.
    excluded_cells: >-
      TT4 and TB3 (per-instance relation means flat in N and about 0.26 and
      0.25, so a growth read needs about 2.5e5 curves per rung for sigma_b
      0.005; corrected draft part_C C-2 precondition (c)); TT5 (cost at low
      rungs; corrected draft part_C sizing); SS4 (dispersion about 13 at
      A_fix, and its P0 inputs at 30-32 bits rest on TA-1, EV-PFDR-ad6274
      largest_claim_justified). TB3 counts are harvested on the table panel
      and reported, never decision-bearing.

  # ---------------------------------------------------------------------------
  controls:
    - MATCHED RANDOMS (the null) -- random_sub_r0, r1, r2 (FactorBase.random(E, s_sub, seed = c, c + 1000, c + 2000)) and random_dick_r0, r1, r2 (seed c + 3000 + 1000K, size s_dick), same curve, |F| per family, table arity and exposure as every scored arm (CC-5), at every rung
    - KNOWN-NULL ARM PER FAMILY -- known_null_sub (seed c + 6000) and known_null_dick (seed c + 7000), scored by the identical CC-8 formula at every rung
    - RANDOM-AS-STRUCTURED NULL PSEUDO-CELLS AND NULL LADDERS -- per (family, class-m, rung), each of r0, r1, r2 and the known-null arm scored as structured against the triple of the other three (four null pseudo-cells per family, eight per class-m); each pseudo-cell read across the five rungs is a null ladder (eight per class-m, 24 in all), on which growth is known false (PC-NULL-R-L and PC-NULL-G, rct_and_fixes.RCT-1)
    - REAL-DATA PERMUTATION NULL -- per rung and per curve, the four null arms of a family exchanged uniformly; position 0 scored against positions 1-3 by CC-8 at every rung and the slope fitted across rungs; its quantiles reported beside the model (G-NB-R) null, and the larger threshold governs
    - PLANTED ARM AT THE TARGET SIZE, AT EVERY RUNG (TT3; engine-level) -- planted_target, derived from planted_sub (FactorBase.planted(E, s_sub, seed = c + 8000), m = 3) by counting exactly K_T,b = round(0.15 x C_R_pred_b) of its planted TT relations on rung b and removing every other planted TT monic vector by exact match; expected kappa about 1.15 at every rung (constant excess, delta 0)
    - CONSTANT-EXCESS LADDER (proves-too-much on the growth test; TT3 engine-level) -- planted_target read across the five rungs; a constant excess must be detected at every rung and must NOT read as growth (PC-CONST)
    - PLANTED-GROWTH LADDER (TT3; engine-level) -- planted_growth, derived from the same planted_sub base by counting exactly K_G,b = round((2^{delta_PG (x_b - x_1)} - 1) x C_R_pred_b) planted TT relations on rung b (x_1 = the lowest rung's mean log2 N; K_G at the lowest rung is 0) and removing every other planted TT monic vector by exact match; delta_PG fixed by P0 before data; it must be detected as growth and its delta recovered (PC-PG)
    - ANALYSIS-LEVEL PLANTED LADDERS (SS3, SS5 and TT3; calibrate step, null arms only) -- PG-ANA and CONST-ANA, built on the REAL known-null arm counts of each family by adding a declared excess (Poisson-planted at the declared kappa_b) on every curve of every rung, scored against the real r0..r2; PG-ANA at delta_PG must be detected and recovered, CONST-ANA at constant kappa 1.15 must be detected at every rung and must not read as growth; the same construction at delta_res over curve-cluster bootstrap resamples gives the REAL-DATA POWER at the declared resolution
    - FULL PLANTED ARM (dynamic range; TT3) -- planted_sub with every planted relation counted, read per rung (kappa about 1.5 at 30-32 bits; EV-PFDR-ad6274 OBS-7 planted total); reported, never a growth cell
    - BASE MUTATION (nearby object for small_x) -- small_x_offset (EC-A1; seed c + 9000), the s_sub smallest liftable x above a seeded random offset x0 in [p/4, 3p/4), on both panels; its ladder and the small_x minus offset contrast slope are secondary (routing qualifiers for any small_x G+)
    - BASELINE REPRODUCTION -- G-REPRO-C (archived EXP-PFDR-011cd0 R12 and R13 job rows reproduced on the merged tree under the pre-registered exclusion set) and P0X-C (archived known-null band integers recounted from archived rows)
    - DISJOINT VERIFICATION -- in-process row certificates (G4) and experiments/EXP-PFDR-011cd0/verify_rows.py on every instance with c % 10 == 0 (G4-R)
  controls_design_notes:
    why_two_planted_ladders: >-
      A slope test has two ways to mislead: reading a constant excess, or
      calibration drift between rungs, as growth; and missing real growth.
      The constant-excess ladder is the nearest object with an excess and no
      growth, so a growth test that fires on it proves too much. The
      planted-growth ladder is the nearest object with growth of known
      exponent, so a growth test that misses it, or misplaces its exponent,
      is blind. Both are read with the same estimator, weights and threshold
      as the growth cells.
    engine_level_vs_analysis_level: >-
      TT3 has engine-level planted ladders: real planted relations on a real
      planted base, recovered by the harvester (PC-G-iii) and thinned by
      exact match, as EXP-PFDR-0b3699 planted_target. SS has none: a planted
      base-only relation is not an SS two-target relation, and an engine SS
      plant needs the additive mechanism EC-B1 that the corrected draft
      part_B.per_cell_requirements R-B5 assigns to Part B. C-1 requests no
      engine change, so the SS planted ladders are analysis-level: real
      null-arm noise with a declared added excess. They test the estimator,
      weights, thresholds and bound on real SS noise; they do NOT test the
      harvester's SS recall, which rests on G-REL, G4, G4-R and the
      EXP-PFDR-011cd0 EC-1 repair test. This limitation is carried into every
      SS reading (interpretation_limits).
    plant_supply_check_planning_approximation: >-
      planted_sub plants n_tt = max(1, round(s^4 / (6N))) TT relations per
      curve (DEC-20261002-d0594a verified_claims.engine). At m = 3 this is
      about half the random TT3 mean per curve: about 55 at 30-32 bits
      (planned total 33060 on 600 curves, corrected draft part_B R-B5 from
      EV-PFDR-ad6274 OBS-7) and about 3 to 4 at 20 bits (planning
      approximation (hand): s^4/N scales as N^{1/3}). planted_target needs 0.15 x the null
      mean per curve, about 1.1 at 20 bits and 21 at 32 bits; planted_growth
      at delta_PG about 0.0054 needs at most about 0.05 x the null mean per
      curve at 32 bits. Both fit inside the supply at every rung. P0 checks
      the supply per rung from design quantities and stops if it fails.
    plant_selection_rule: >-
      For rung b, P0 lists every (curve j, plant index i) with 0 <= i <
      n_tt(j), n_tt(j) computed from s_sub(j) and N(j). planted_target keeps
      the first K_T,b pairs of random.Random(f"plant-target|EXP-PFDR-969aae|{b}").sample(pairs_b,
      len(pairs_b)); planted_growth keeps the first K_G,b pairs of
      random.Random(f"plant-growth|EXP-PFDR-969aae|{b}").sample(pairs_b,
      len(pairs_b)). Both lists are written to design.json before any census
      run. Each derived arm counts every relation of planted_sub except the
      planted TT monic vectors not in its list, which are removed by exact
      match. The planted vectors are read from planted_sub's base params; the
      implementation task confirms before any real-data run where those
      params are recorded for every curve (if only for sampled curves, the
      table panel runs with --bases-sample-mod 1 and P0 models the disk), and
      stops if neither holds.
    offset_range_and_height_screen: >-
      As EXP-PFDR-0b3699 controls_design_notes.offset_range_and_height_screen,
      applied per rung by design_c.py before any census run; a screened curve
      is dropped from the mutation arm and its contrast only.
    subgroup_divisor_stratum: >-
      The subgroup base depends on a divisor d of p - 1, and the p_filter
      subgroup_prime_filter([3, 4, 5], 0.15) admits different d mixes at
      different bit sizes. P0 records each design curve's d (from
      design_c.py's subgroup construction) so the analysis can report the
      subgroup slope within the dominant d stratum (secondary;
      proof_search_map observation-collision C-3).

  independent_variables:
    - rung b in {20, 22, 26, 30, 32} bits (x_b = mean log2 N over the rung's design curves, a design quantity)
    - base geometry at fixed curve, |F| per family and exposure -- subgroup, small_x, dickson against matched randoms; small_x_offset as the small_x mutation
    - (class, m) in {TT3 (table mode, whole table), SS3 and SS5 (search mode, X_fix = 20 * isqrt(N))}
  controlled_variables:
    - curve, target stream (label census, target seed 0), solver seed c, and |F| per family on each curve (s_sub = max(4, |F_sub|); s_dick = max(4, |F_dick|); cells.design_curves of EXP-PFDR-011cd0)
    - engine mitm, default arity, min_fill, numpy path at every rung (no rung uses the pure-Python path)
    - base-size path |F| = default_fb_size(N, m) as the engine sets it (growth is read along this path; proof_search_map quantifier_order)

  metrics:
    primary:
      - per growth cell -- delta_hat (WLS slope of log2 kappa_hat_b on x_b, weights fixed from null arms), SE0 (simulated null SD of delta_hat at the realised design), z_G = delta_hat / SE0, the calibrated threshold t_G_dec(cell), and the outcome id (G+, G0, G?, G-INVALID with reason)
      - per growth cell -- the decision-bearing one-sided 95% upper bound U_delta under the RCT-3 rule (the larger of the signed-quantile and |dev|-quantile bounds always governs), both bounds with their simulated coverages and Monte Carlo SEs, and the frozen delta_res
      - thresholds -- t_G_model (family-wise one-sided 0.05 over the nine cells under G-NB-R), t_G_perm per (family, class-m) group (permutation null), t_G_dec = max of the two per cell; seed-family spread and Monte Carlo SE of each
      - controls -- PC-NULL-R-L and PC-NULL-G (RCT-1 rules) per class-m; PC-RT and PC-CONST and PC-PG (TT3 engine-level); PC-CONST-ANA and PC-PG-ANA per class-m; PC-G-iii; the real-data power at delta_res per class-m
      - every gate of `gates`
    secondary:
      - per cell-rung -- C_A,b, C_R,b, V_b, SD_null,b, kappa_b, z_b, per-rung calibrated p; the per-rung upper bound U_b (RCT-3 rule) and the additive envelope E_b = U_b - 1 (c N_b^delta <= E_b)
      - additive model -- only where at least three rungs of a cell have z_b > 3 (excess resolved), a WLS fit of log2(kappa_b - 1) on x_b with its SE; otherwise "not identifiable (excess not resolved)" and only the envelope is recorded
      - the RCT-2 common-mode yardstick per rung and pooled (rct_and_fixes.RCT-2)
      - small_x_offset ladder slope and the small_x minus small_x_offset contrast slope with their simulated null thresholds (one-sided 0.05, reported)
      - subgroup slope within the dominant divisor stratum d; s_sub / N^{1/m} and s_dick / N^{1/m} per rung; formally distinct stored tails E' / |F|^2 per arm per rung (TT3)
      - full planted_sub per-rung kappa and z (dynamic range)
      - heuristic readings per rung -- H1a pair first-moment ratio (all three class-m), H1c TT3 relation dispersion with 99% interval and randomized-PIT KS, H3 rank ratio (TT3), H5 SS relation dispersion with 99% interval (SS3, SS5)
      - TB3 counts of every table arm (never decision-bearing); CC-1b sign-only recount beside every projective count; multiplicity histograms; informative rank and R_star
      - per-instance time, table bytes, SS store peak entries and worker RSS (A9 form) per rung -- the measured concrete-cost rows

  heuristic_under_test:
    - HEUR-2765d2-H2 (structural null, kappa_rel = 1 + O(N^{-1/2+eps})) -- its growth implication on the nine cells over 20-32 bits; falsification condition below (falsification_criterion)
    - HEUR-2765d2-H4 (random base behaves as U; known-null distributed as the calibrated null) -- per rung and across rungs through PC-NULL-R-L, PC-NULL-G and the permutation null
    - HEUR-2765d2-H1c (TT m = 3 relation dispersion clause, and its randomized-PIT KS clause) -- per rung at TT3
    - HEUR-2765d2-H5 (SS exposure equivalence) -- per rung at SS3 and SS5
    - HEUR-2765d2-H1a (pair first moment) and HEUR-2765d2-H3 (rank) -- per rung, secondary, by their frozen falsification conditions
    - note -- the growth conditional itself (kappa_rel ~ N^delta) is NOT a numbered heuristic of H-PFDR-2765d2 (asymptotic_claim.time_exponent carries it as a motivating conditional only); if any cell reaches G+ and survives review, a successor hypothesis must number it before any claim

  preregistered_prediction:
    quantity: >-
      delta per growth cell over rungs {20, 22, 26, 30, 32} (fresh curves in
      the Part C reservation), with U_delta and the per-rung envelope.
    formula: >-
      Null (pre-committed): HEUR-2765d2-H2 gives kappa_rel = 1 + O(N^{-1/2+eps}),
      so log2 kappa_rel is flat to well below the per-rung SE over 20-32 bits
      and delta <= 0 up to O(N^{-1/2}) drift; P(z_G > t_G_dec for some cell)
      <= 0.05 by construction of t_G_model. Planning (hand), at per-rung
      sigma_b = 0.005 on the five rungs: SE(delta_hat) = sigma_b / (ln 2 x
      sqrt(104)), about 0.00071; with a one-sided Bonferroni 0.05/9 bound on
      the family-wise threshold (z about 2.54; the simulated t_G_model can
      only be lower or equal), the detectable delta is about 0.0018 at power
      0.5 and about 0.0027 at power 0.9, so the resolution on the exponent
      move delta/2 is about 0.0009 and 0.00135. Alternative: none is carried
      from data (no post-selection effect size; DF-2). delta_res, the frozen
      G0 boundary, is P0's simulated power-0.9 detectable delta at the final
      design, written to design.json before any census data. [SS P0 inputs
      estimated per rung at X_fix from EXP-PFDR-011cd0 R13 random arms: 10
      curves per rung at 20-28 bits, 32 at 30-32 bits]
    source: >-
      H-PFDR-2765d2 HEUR-2765d2-H2 (random-model justification recalled,
      supports nothing; incomplete-sum regime outside the proven range per
      Shparlinski 2008, abstract retrieved by TASK-20260928-9c44f2); Lemma L1
      (first two moments of TT relation counts under U) for the null model;
      the motivating conditional of asymptotic_claim.time_exponent (a growth
      kappa_rel ~ N^delta would move this engine's exponent by delta/2), not
      relied on. Frozen at approval; any change is an additive
      protocol_amendment and never re-scores a run.

  scale_relevance:
    tier: toy
    justification: >-
      Generated prime-order curves at 20-32 bits (max log2 p = 32: toy by the
      mechanical rule of docs/claims-and-verification.md, as cited in
      EV-PFDR-ad6274 claim_tier_basis), one engine (mitm, default arity,
      min_fill), m = 3 and 5, classes TT and SS. The slope is a local
      statement over the tested range. No transfer or extrapolation is
      asserted: nothing about N above 32 bits, asymptotic delta, other bases,
      engines, classes or deployed curves (TW-SCOPE; TW-EXTRAP).
    correspondence: none -- direct sampling of generated curves (no sampling correspondence is used)

  tail_checks:
    - each cell's z_G against the calibrated single-cell null slope law (G-NB-R) and the permutation slope law, both computed before unmasking
    - the 24 null-ladder slope z values against their simulated joint law (PC-NULL-G), and the per-class-m pooled-level null z against theirs (PC-NULL-R-L)
    - per cell-rung z_b against the per-rung calibrated null; any per-rung |z_b| > t_b,dec listed (A-TAIL style; never decision-bearing)
    - leave-one-rung-out slopes per cell (five values) -- a slope carried by one rung is listed as an unexpected observation (U-G3) and routed to review; never changes the outcome
    - per-curve counts on structured arms -- curves with a Poisson tail P(Poisson(rho1_hat_b x mu_model(j)) >= n) < 1e-4 listed (TT3), and the share of each rung's excess carried by its top 10 curves against the same share on the null pseudo-cells
    - curvature check -- a quadratic term in x_b fitted beside the linear slope, reported only (a log-type growth and N^delta are not separable over this range; proof_search_map)

  replication:
    seeds:
      - 'curve seeds: the Part C reservation is c = 40000 .. 79999 at every bit size. Allocation: TT3 c = 40000 .. 40000 + n_b - 1 (block 40000 .. 59999); SS3 c = 60000 .. 60000 + n_b - 1 (block 60000 .. 64999); SS5 c = 65000 .. 65000 + n_b - 1 (block 65000 .. 69999); C-2 pilot probe curves 70000 .. 70999 (c2_pilot); spare 71000 .. 79999 for a replication of this ladder, unused unless a later decision assigns it. Each (class, m) has its own curves, so cells of different (class, m) share no curve.'
      - 'disjointness: EXP-PFDR-1b78f7 used c = 0 .. 9; EXP-PFDR-011cd0 used c = 10 .. 2009 at most (design.json final_n; table m 4 at 30-32 is the largest block) and reserved its Stage R'' range c = 20000 .. 20000 + n - 1 with n at most 2000 (specification cells.stage_R_prime; not triggered, EV-PFDR-ad6274); EXP-PFDR-0b3699 used c = 2010 .. 7109 at 30-32 bits within its reservation 2010 .. 9999; Part B is reserved 10000 .. 19999 (corrected draft part_B R-B1). 40000 .. 79999 meets none of these.'
      - 'within-design duplicates: if two design curves of one (class, m, rung) share (p, a, b), the later c is replaced, before any census run, by the next unused c above the block''s planned end; listed in design.json'
      - 'curve generator: generate_prime_order_curve(bits, c, p_filter=subgroup_prime_filter([3, 4, 5], 0.15)) (EXP-PFDR-011cd0 cells.design_curves)'
      - 'instance: __main__._instance(bits, c, 0, pf) where a target is built; target label census, target seed 0; solver seed c'
      - 'bases: subgroup seed c; dickson seed c; random_sub_r0, r1, r2 seeds c, c + 1000, c + 2000; random_dick_r0, r1, r2 seeds c + 3000, c + 4000, c + 5000; known_null_sub c + 6000; known_null_dick c + 7000; planted_sub c + 8000 (table panel); small_x_offset c + 9000 (rng label fb-smallx-offset|p|a|b|size|seed)'
      - 'plant selections: random.Random(f"plant-target|EXP-PFDR-969aae|{b}") and random.Random(f"plant-growth|EXP-PFDR-969aae|{b}") (controls_design_notes.plant_selection_rule)'
      - 'simulation: numpy SeedSequence([0x969aae, family_index]) for 5 seed families (G-NB-R thresholds, joint null laws, coverage, power); permutation null SeedSequence([0x969aae, 100 + family_index]); bootstrap and real-data power SeedSequence([0x969aae, 200 + family_index]); PG-ANA and CONST-ANA plantings SeedSequence([0x969aae, 300 + family_index]); 969aae is the 6-hex token of EXP-PFDR-969aae'
      - 'replicates: >= 20000 per seed family for every simulated quantile at 0.95 or 0.99; >= 50000 per seed family for t_G_perm (a 1 - 0.05/9 quantile); >= 8000 synthetic designs per point for the coverage of U_delta and >= 4000 per point for per-rung U_b; >= 2000 curve-cluster bootstrap resamples per class-m for the real-data power'
    independent_instances: 20504
    independent_instances_note: >-
      Declared planning curve count, summed over (class, m) and rungs, from
      the P0 sizing formula n_b = 4 D_plan / (3 sigma_t^2 mu_b) with sigma_t
      = 0.005 and D_plan = 1.2 (planning approximation (hand); 4 x 1.2 / (3 x
      2.5e-5) = 64000 relations per random arm per rung): TT3 7390, 4655,
      1849, 733 and 462 curves at 20, 22, 26, 30 and 32 bits (15089), with mu_b
      = 110 x 2^{(b - 31)/3} relations per curve (110 = C_R / curves_used of
      known_null_sub|TT3|band, scaled as N^{1/3}); SS3 280 per rung (1400),
      mu 229; SS5 803 per rung (4015), mu 80. Total 20504. P0 computes the
      final n per (class, m, rung) from the cited per-rung inputs; it may
      raise n and never lowers it. Each TT3 curve carries 13 arm-instances
      and each SS curve 12 (about 196000 table and 65000 search instances at
      the declared n).

  # ---------------------------------------------------------------------------
  power_analysis:
    target: >-
      Equal per-rung precision sigma_b = 0.005 (SE of kappa_hat_b) for every
      growth cell at every rung, so that the WLS slope is near-OLS and its
      precision is set by the rung spread; the resulting detectable delta at
      power 0.5 and 0.9 is computed by P0 and recorded before any census
      data. No power is computed at a data-derived effect size.
    planning_approximation_hand: >-
      sigma_b^2 = 4 D / (3 n_b mu_b) (CC-8 with V about D C_R). SE(delta_hat)
      = sigma_b / (ln 2 x sqrt(S_xx)), S_xx = sum_b (x_b - xbar)^2, about 104
      on the five rungs, so SE about 0.000707 at sigma_b 0.005. Family-wise
      one-sided 0.05 over nine cells, bounded by Bonferroni (z 2.54): detectable
      delta about 0.0018 (power 0.5) and 0.0027 (power 0.9); exponent move
      delta/2 about 0.0009 and 0.00135. With one rung lost at an end, S_xx
      about 59 and these scale by sqrt(104/59), about 1.33. [SS P0 inputs
      estimated per rung at X_fix from EXP-PFDR-011cd0 R13 random arms: 10
      curves per rung at 20-28 bits, 32 at 30-32 bits]
    P0_rule: >-
      RC-03 (P0), before any census run of this experiment and from no
      census data of it.
      (1) design_c.py builds, per (class, m) block and rung, the design
      curves c = block start .. block start + n_plan - 1 (n_plan as
      replication.independent_instances_note), their N, P, s_sub, s_dick,
      the subgroup divisor d, x_b = mean log2 N, mu_model(j) for TT3 (the
      L1 first moment with the L2 generic multiplicity, by the rule
      EXP-PFDR-011cd0's P0 recorded in its design.json for m = 3), n_tt(j),
      the offsets x0 and the height screen.
      (2) analyze_c.py p0 reads, by key, the per-rung inputs
      (p0_inputs_by_path_and_field) and sets, per (class, m, rung b):
      D_plan_b = 1.2 x max(1, D_b,SUB, D_b,DICK); for TT3 rho1_hat_b = sum
      mj / sum mu_model over the EXP-PFDR-011cd0 curves of rung b
      (mu_model recomputed on those curves from that design.json) and mu_b =
      rho1_hat_b x mean mu_model over the first 200 design curves of rung b;
      for SS mu_b = the mean of mj over the EXP-PFDR-011cd0 curves of rung b
      (A-CAL uses the rung mean for SS). Then n_b = ceil(4 D_plan_b / (3 x
      0.005^2 x mu_b)), using the smaller of the two families' mu_b. If n_b
      exceeds n_plan, design_c.py extends the block (same seed rule).
      (3) P0X-C (gates) runs; a failure is a design stop.
      (4) It simulates the nine growth cells, the 24 null ladders and the
      permutation-free model null under G-NB-R at the design curves (means
      rho1_hat_b x mu_model(j) for TT3 and mu_b for SS; dispersion
      D_plan_b; the three randoms of a family drawn once per replicate and
      shared by the family's pseudo-structured arms) to get, per cell,
      sigma_b,sim, SE0_plan and z_G's null law; t_G_plan (family-wise 0.95 of
      max z_G over the nine cells); the detectable delta at power 0.5 and 0.9
      on the grid delta = 0.0001, 0.0002, ... with Poisson-planted and
      compound-planted growth (structured-arm dispersion 1.307 x D_plan, the
      red-team multiplier carried from EXP-PFDR-0b3699; the smaller power
      governs).
      (5) RULE: if sigma_b,sim > 1.1 x 0.005 for some (class, m, rung), that
      rung's n_b is raised to the smallest of {1.25, 1.5, 2} x n_b that meets
      it; if 2 x does not, n_b = 2 x and the rung is recorded "target
      unattainable by design" before any census data; n is never lowered.
      Step (4) is then re-run at the final n.
      (6) It fixes, in design.json, delta_res = the governing power-0.9
      detectable delta at the final design for each (class, m) (the largest
      over the three bases of that class-m); delta_PG = max(2 x delta_res,
      the smallest grid delta with governing power >= 0.99); K_T,b, K_G,b and
      both plant selections; and it records the RCT-1 null rejection rates
      and powers, the RCT-3 coverages of both bound methods with Monte Carlo
      SEs, and the predicted per-rung U_b and U_delta at kappa = 1 and delta
      = 0 (simulation rule of analysis.simulation_rule).
      (7) It records the modeled package size and CPU (from the archived
      EXP-PFDR-011cd0 R12 and R13 per-job file sizes and execution.json CPU
      at the same (m, rung), scaled to the final n and arm count), and the
      expected per-process peak RSS.
      design.json's sha256 is pinned in implementation-notes.yaml before
      RC-04 starts.
    design_stop: >-
      Stop before RC-04 and return to the Coordinator (a design question, not
      data) if: P0X-C fails; G-FRESH-C fails; the modeled package exceeds 2.0
      GB; the plant supply fails at any rung; planted_sub cannot plant on
      any curve (ValueError); the height screen removes more than 1% of a
      rung's curves; any per-(class, m) total exceeds 2 x its planning
      total; or delta_res for some (class, m) exceeds 2 x its planning value
      (0.0027).
    design_properties_recorded_before_data: >-
      Planning (hand), for the approval reader: under the null, delta_hat is
      about N(0, SE0) and U_delta about delta_hat + 1.645 SE0, so P(U_delta
      <= delta_res) is about P(Z <= 3.82 - 1.645), about 0.985 per cell when
      delta_res sits at the power-0.9 point of a 2.54-sigma test; G0 is
      therefore the expected reading under the null and G? is not
      structurally excluded (it needs an unlucky positive delta_hat, a
      realised SE above plan, or the RCT-3 |dev| bound to be wider).

  # ---------------------------------------------------------------------------
  analysis:
    two_step_blinding: >-
      Per rung and per (class, m), RC-06 (calibrate) reads, from every census
      row and harvest-row file of RC-04 and RC-05, ONLY records whose arm is
      random_sub_r0, r1, r2, known_null_sub, random_dick_r0, r1, r2 or
      known_null_dick; analyze_c.py filters by arm name before parsing any
      count and writes arm-read-log.json. It calibrates EACH RUNG on its own
      null arms (rho1_hat_b, D_b per family), fixes the WLS weights w_b, SE0
      per cell, t_G_model, t_G_perm, the per-rung thresholds t_b,dec, the
      RCT-1 joint laws and rules, the RCT-2 yardstick, the RCT-3 coverages,
      PG-ANA, CONST-ANA and the real-data power at delta_res, and writes
      calibration.json, whose sha256 is pinned in implementation-notes.yaml
      before RC-07 starts. RC-07 (unmask) refuses to run unless
      calibration.json matches the pinned sha256, then reads subgroup,
      small_x, dickson, small_x_offset and planted_sub (with planted_target
      and planted_growth derived from it).
    statistic_per_rung: >-
      CC-8 of EXP-PFDR-011cd0 unchanged, applied per (cell, rung b) on the
      rung's curves after CC-6: C_X,b = sum_j n_X,j; C_R,b = (1/3) sum over
      the family's r0..r2; s_j^2 the ddof-1 variance of the three random
      counts on curve j; V_b = max(sum_j s_j^2, C_R,b); SD_null,b =
      sqrt(4 V_b / 3); z_b = (C_X,b - C_R,b) / SD_null,b; kappa_b = C_X,b /
      C_R,b; SE_b = SD_null,b / C_R,b. Null pseudo-cells use the same formula
      with their own triple.
    growth_estimator_primary: >-
      Per growth cell: y_b = log2 kappa_b and x_b = mean log2 N over rung b's
      design curves (a design quantity). Weights w_b = (C_R,b x ln 2 /
      SD_null,b)^2 = 1 / (SE_b / ln 2)^2, computed from the family's null arms
      only and fixed in calibration.json before unmasking. delta_hat = sum_b
      w_b (x_b - xbar_w)(y_b - ybar_w) / sum_b w_b (x_b - xbar_w)^2 over the
      cell's valid rungs. SE0 = the simulated SD of delta_hat under the
      calibrated null at the realised design (calibrate); the analytic WLS
      SE is reported beside it. z_G = delta_hat / SE0. The multiplicative
      model kappa(N) = a N^delta is the reading frame; log2 a is a nuisance
      that the slope test ignores, so a constant excess (a > 1, delta = 0)
      is not growth.
    growth_test: >-
      One one-sided test of delta > 0 per growth cell: G+ iff z_G >
      t_G_dec(cell). t_G_model = the 0.95 quantile of max over the nine cells
      of z_G under the calibrated G-NB-R null, simulated jointly (the cells
      of one (family, class-m) share curves and randoms; different (class, m)
      share no curve), seed-averaged over 5 families of >= 20000 replicates.
      t_G_perm(group) = for each (family, class-m) group, the 1 - 0.05/9
      quantile of the permutation slope z (analysis.permutation_null), >=
      50000 replicates x 5 families. t_G_dec(cell) = max(t_G_model,
      t_G_perm(group of the cell)): a heavier real-data null can only raise
      the bar. Family-wise one-sided alpha 0.05 over the nine cells.
      Monte Carlo SE of each threshold is reported; if |z_G - t_G_dec| < 3 x
      that SE the outcome id carries the flag threshold-at-MC-resolution
      (routing unchanged; the review owns the flag).
    permutation_null: >-
      Per replicate, per rung and per curve, the four null arms' counts of a
      family are permuted uniformly; position 0 is scored against positions
      1-3 by CC-8 at each rung; the slope and its z (with the same weights
      and SE0) are computed across rungs. Per-rung permutation quantiles
      t_perm,b are reported beside t_b (model).
    simulation_rule: >-
      As EXP-PFDR-0b3699 analysis.upper_bound_U_A, stated per rung: on each
      simulated curve the structured-arm count is first drawn from the
      G-NB-R null model of that curve and rung; where the simulated kappa_b
      > 1 a Poisson-planted excess (compound-planted where a clause names
      it) is added; at kappa_b = 1 the null draw is used; where kappa_b < 1
      the null draw is binomially thinned with keep probability kappa_b and
      no excess is added. A simulated growth ladder at (a, delta) uses kappa_b
      = a x 2^{delta (x_b - xbar_w)}, so some rungs may be planted and others
      thinned. The rule applies to every simulation of this contract: P0,
      calibrate, U_b, U_delta, coverage, power, PG-ANA and CONST-ANA.
    upper_bound_U_delta: >-
      Governing one-sided 95% upper bound on delta per growth cell, under
      the RCT-3 rule (rct_and_fixes.RCT-3): simulate at (a_hat, delta_hat)
      (simulation_rule), dev = (delta* - delta_hat) / SE0. Signed bound:
      q_lo = 0.05 quantile of dev, U_signed = delta_hat - q_lo x SE0. |dev|
      bound: q_abs = 0.95 quantile of |dev|, U_abs = delta_hat + q_abs x SE0.
      U_delta = max(U_signed, U_abs), ALWAYS; both are reported with their
      simulated one-sided coverage at delta = 0, delta_res and delta_PG (>=
      8000 synthetic designs per point; Monte Carlo SE about 0.0024 at
      coverage 0.95, planning (hand)), labelled "one-sided 95% (signed
      quantile), simulated coverage x.xxx +- y.yyy" and "one-sided 95%
      (quantile of |dev|), simulated coverage x.xxx +- y.yyy". No coverage
      value selects the bound.
    per_rung_bounds_and_additive_envelope: >-
      Per cell-rung, U_b by the same rule on kappa_b (signed and |dev|
      quantiles at kappa = kappa_b, the larger governs; coverage at kappa
      1.00, 1.05 and 1.15 with >= 4000 synthetic designs each, Monte Carlo SE
      about 0.0034). The additive model kappa(N) = 1 + c N^delta is recorded
      as its per-rung envelope E_b = U_b - 1 >= c N_b^delta at each tested
      N_b. Where U_b <= 1 the label reads "no excess detected at rung b",
      never kappa_rel < 1. (c, delta) are estimated only where at least three
      rungs of a cell have z_b > 3 (metrics.secondary).
    rct_rules_applied: >-
      PC-NULL-R-L and PC-NULL-G are the RCT-1 rules; the common-mode
      yardstick and its G0 qualifier are RCT-2; the bound rule is RCT-3
      (rct_and_fixes, each with its full text).
    real_data_power: >-
      Calibrate, null arms only: for each (family, class-m), >= 2000
      curve-cluster bootstrap resamples (curves resampled within rung, same
      indices for all four null arms), the known-null arm given a
      Poisson-planted multiplicative growth at delta_res (and at delta_PG),
      scored against the resampled r0..r2 with the frozen weights and
      t_G_dec; the detection frequency is the real-data power, reported
      beside the model power with its binomial SE. Reported, not gating.
    dispersion_robustness: >-
      As EXP-PFDR-0b3699 analysis.dispersion_robustness, per cell-rung, and
      z_G recomputed with every V_b scaled by max(1, upper end of rho_A,b);
      if the outcome class depends on it the outcome id carries the flag
      dispersion-sensitive; routing unchanged.
    per_rung_secondary: >-
      Per cell-rung kappa_b, z_b and per-rung calibrated p, for every growth
      cell, small_x_offset, planted_target, planted_growth, planted_sub and
      the null pseudo-cells. Secondary; no per-rung quantity enters an
      outcome except through rung validity and the slope.

  gates:
    - id: G-ID
      text: identity_check_DS-10f passes on the merged tree before RC-01 (every engine and engine-test file equal to its validated bytes)
    - id: G-T
      text: tests/test_index_calculus_fp.py, tests/test_index_calculus_harvest.py, tests/test_index_calculus_relcensus.py and tests/test_index_calculus_smallx_offset.py pass unedited
    - id: G-REPRO-C
      text: >-
        RC-02: re-run the archived EXP-PFDR-011cd0 jobs
        RUN-PFDR-011cd0-table/attempt-1/jobs/3-b20-c10 and 3-b32-c10 and
        RUN-PFDR-011cd0-search/attempt-1/jobs/3-b20-c10, 3-b32-c10,
        5-b20-c10 and 5-b32-c10 with the exact commands in their
        command.txt (output paths moved under this experiment's run
        directory); after gzip decompression and JSON parse, every census row
        equals the archived row with exactly the keys seconds,
        harvest.harvest_seconds and harvest.worker_maxrss_bytes excluded (the
        AMD-20261008-9c080d A-3 set, pre-registered here before any run);
        every harvest row and every staircase row equals the archived file
        with no exclusion; census rows matched by (bits, curve, m, arm,
        mode); harvest and staircase records compared in file order within
        an instance. Then the same six jobs with --arms extended by
        small_x_offset (and planted_sub where absent) give identical rows for
        every pre-existing arm under the same exclusion set. Comparator
        reproduce_check.py only.
    - id: P0X-C
      text: >-
        analyze_c.py's CC-1 to CC-3 recount of the archived EXP-PFDR-011cd0
        random-arm and known-null relation counts reproduces, as integers,
        round(3 x C_R), round(6 x sum_s2) and round(C_A) of
        calibration.json PC_NULL.known_null_band_cells
        ["known_null_sub|TT3|band"], ["known_null_sub|SS3|band"] and
        ["known_null_sub|SS5|band"] as read at RC-03. Planning (hand) from the
        values read: TT3 198101, 374574, 66052; SS3 43903, 82840, 14704; SS5
        15305, 27614, 5073. No float is compared for equality;
        p0x-c-report.json records the nine integer pairs.
    - id: G-FRESH-C
      text: >-
        every (bits, c) of this design has 40000 <= c <= 79999; no (p, a, b)
        of this design equals any (p, a, b) of
        experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-p0-design/attempt-3/design.json
        curves or of experiments/EXP-PFDR-0b3699/runs/RUN-PFDR-0b3699-p0-design/curves.jsonl.gz;
        and no two design curves of one (class, m, rung) share (p, a, b)
        after the within-design replacement rule
    - id: G4
      text: cert_fail == 0 and cert_pass == rows_emitted for every class of every instance (in process)
    - id: G4-R
      text: experiments/EXP-PFDR-011cd0/verify_rows.py accepts every retained row of every instance with c % 10 == 0, and every sampled base point lies on its curve
    - id: G7
      text: subgroup, dickson and planted base checks as EXP-PFDR-011cd0 G7 (planted relations hold on an independent instance; |F_planted| == s_sub)
    - id: G7-OFFSET
      text: for every sampled small_x_offset base (c % 10 == 0), x0 equals design.json's x0 and the points are exactly the first s_sub liftable x >= x0 with y != 0
    - id: G-CURVE
      text: every instance's (p, a, b, N, P) equals design.json's entry for (bits, c)
    - id: G-REL
      text: for every instance, the harvester's relations_distinct, relations_distinct_sign, relations_nonformal, R_star and multiplicity histogram equal analyze_c.py's recount from the retained rows
    - id: PC-G-iii
      text: on every TT3 curve, every planted TT monic vector of planted_sub (from its base params) is in the instance's TT relation set; each derived arm counts exactly its listed vectors and removes the others by exact match
    - id: G-META
      text: >-
        DEF-2 field-level completeness (rct_and_fixes.DEF-2): for every run,
        raw-result.json at every location carries non-null metrics.declared_metrics
        and metrics.outcome_id wherever required_artifacts.per_run requires
        them, every declared metric key listed for that run is present and
        non-null, and manifest.yaml carries run.code.command and the
        certificate block with instances_claimed and instances_verified
        written explicitly
    - id: PC-NULL-R-L
      text: rct_and_fixes.RCT-1 level rule, per (class, m)
    - id: PC-NULL-G
      text: rct_and_fixes.RCT-1 growth rule, per (class, m)
    - id: PC-RT
      text: TT3 planted_target detected at every valid rung -- z_b > t_b,dec, and C_planted_target,b - C_R,b within +- 4 SD_null,b of K_T,b
    - id: PC-CONST
      text: TT3 planted_target ladder z_G <= t_G_dec (a constant excess does not read as growth)
    - id: PC-PG
      text: TT3 planted_growth ladder (i) z_G > t_G_dec and (ii) |delta_hat_PG - delta_PG| <= 4 x SE0
    - id: PC-CONST-ANA
      text: per (class, m) and family, CONST-ANA detected at every valid rung (z_b > t_b,dec) and its z_G <= t_G_dec
    - id: PC-PG-ANA
      text: per (class, m) and family, PG-ANA (i) z_G > t_G_dec and (ii) |delta_hat - delta_PG| <= 4 x SE0
  gate_rule: >-
    INVALIDATING (instrument): G-ID, G-T, G-REPRO-C, P0X-C, G-FRESH-C, G4,
    G4-R, G7, G7-OFFSET, G-CURVE, G-REL, PC-G-iii, G-META. A failure makes
    the affected run invalid; every growth cell that reads it is G-INVALID
    (reason: instrument) and nothing downstream of it is read. GATING
    CONTROLS (control): PC-NULL-R-L, PC-NULL-G, PC-CONST-ANA, PC-PG-ANA for
    every (class, m); PC-RT, PC-CONST, PC-PG for TT3. A failure, with every
    invalidating gate passing, makes the three growth cells of that (class,
    m) G-INVALID (reason: control); the failing control is analysed in
    review before any redesign, and the heuristic readings (H1c, H4, H5,
    H1a, H3) stay readable. The DS-3 outcome G-INVALID covers both reasons;
    the reason code is part of the outcome id.

  # ---------------------------------------------------------------------------
  outcomes:
    note: >-
      Pre-registered before any data. Assigned PER GROWTH CELL, in this
      order, so that exactly one of G-INVALID, G+, G0, G? applies to each
      cell (a partition). A timeout, crash, memory or disk stop is
      failed_infrastructure or a checkpoint, never a negative reading. Status
      changes, if any, are made only by a later Coordinator decision after
      independent review. No growth statement rests on fewer than four valid
      rungs. Per-rung kappa readings are secondary. No single unreplicated
      run set carries reject_scoped.
    rows:
      - id: G-INVALID
        condition: >-
          an invalidating gate fails for a run the cell reads (reason
          instrument); or a gating control of the cell's (class, m) fails
          (reason control); or the cell has fewer than four valid rungs
          (reason rungs)
        meaning: >-
          No reading. Instrument: the run returns to the executor with the
          defect named. Control: the failing control is analysed in review.
          Rungs: infrastructure signal, re-run by continuation or a later
          task; never evidence about growth.
        permitted_transition_under_H-PFDR-2765d2: none
      - id: G+
        condition: not G-INVALID, and z_G > t_G_dec(cell)
        meaning: >-
          Growth resolved over 20-32 bits on this cell: an exponent-relevant
          CANDIDATE. No claim, no reading, no status change, no synthesis
          (TW-ALIVE-G). Routed to a review-breakthrough round at max (never
          degraded) with an independent replication of the ladder on fresh
          curves (the spare range 71000 .. 79999), the small_x_offset and
          divisor-stratum qualifiers, the leave-one-rung-out slopes and the
          observation-collision audit as owned joints. A confirmed candidate
          would need a successor hypothesis that numbers the growth
          heuristic before any claim.
        permitted_transition_under_H-PFDR-2765d2: none from this run set; route to review-breakthrough (rule 12)
      - id: G0
        condition: >-
          not G-INVALID, not G+, U_delta <= delta_res (governing bound, RCT-3
          rule; delta_res frozen in design.json), and the cell is not
          common-mode-sensitive at the G0 boundary (RCT-2)
        meaning: >-
          No growth above the declared resolution: a bounded statement over
          the tested range only -- on these curves, this engine and rungs
          20-32 bits, delta <= U_delta for this cell, with the per-rung
          additive envelope E_b recorded. Not "kappa_rel does not grow", not
          a statement about N above 32 bits or about an asymptotic delta.
        permitted_transition_under_H-PFDR-2765d2: >-
          Eligible, by a new Coordinator decision after independent review,
          for a WEAKEN of the structural branch's growth reading for this
          cell over 20-32 bits (empirical_only; one unreplicated run set).
          Never reject_scoped from this run set; a replication on the spare
          range is the route if a scoped rejection is ever sought.
      - id: G?
        condition: not G-INVALID, not G+, not G0
        meaning: >-
          Inconclusive at the declared resolution; the achieved U_delta,
          SE0, the per-rung envelope and the real-data power are recorded.
        permitted_transition_under_H-PFDR-2765d2: none; the cell is a rerank input (larger n, a replication, or C-2 rungs)
    experiment_level_composition: >-
      The experiment's outcome id is the list of nine cell outcomes with
      their reason codes and flags. Any G+ fires TW-ALIVE-G for the whole
      experiment's review tier. Otherwise the review tier is
      review-adversarial (xhigh).
    unexpected_observations:
      - 'U-G1 -- a null ladder or the CONST ladder with z_G > t_G_dec while its control rule still passes -- listed and routed to review'
      - 'U-G2 -- z_G < -t_G_dec on a growth cell (a resolved decrease of kappa_rel with N) -- listed; never read as kappa_rel < 1 at any rung'
      - 'U-G3 -- a cell whose leave-one-rung-out slopes change sign or whose slope is carried by one rung -- listed and routed to review'
      - 'U-G4 -- any per-rung |z_b| > t_b,dec on a growth cell -- listed (A-TAIL style); not decision-bearing'
      - 'U-G5 -- small_x_offset z_G > t_G_dec -- listed and routed to review; a single unregistered secondary test, no reading'

  success_criterion: >-
    Decidable from the declared metrics: every invalidating gate is
    evaluated, every gating control is evaluated, and exactly one of G+, G0,
    G?, G-INVALID (with reason) is assigned to each of the nine growth cells
    by the rules above, with t_G_model, t_G_perm, t_G_dec, delta_hat, SE0,
    z_G, U_delta (both bounds and their simulated coverages), delta_res, the
    per-rung envelopes, the RCT-1 rule values, the RCT-2 yardstick and the
    real-data power reported. Any assigned outcome set is a success of the
    experiment; G0 on every cell is the pre-committed expectation.
  falsification_criterion: >-
    What each outcome can refute, scoped to these cells, rungs 20-32 bits,
    this engine and these curves.
    HEUR-2765d2-H2's growth implication is refuted for a cell only by G+
    confirmed by the review-breakthrough round and an independent
    replication (TW-ALIVE-G); a single G+ refutes nothing by itself.
    HEUR-2765d2-H4 is refuted at a (class, m) by a PC-NULL-R-L or PC-NULL-G
    failure, or by t_perm,b exceeding t_b's simulated 0.999 quantile at some
    rung. HEUR-2765d2-H1c is refuted at TT3 at a rung by its own frozen
    condition (99% interval of the pooled within-curve relation dispersion
    of r0..r2 entirely outside [0.8, 1.25], or the randomized-PIT KS
    rejecting at 1%). HEUR-2765d2-H5 is refuted at SS3 or SS5 at a rung by
    its frozen condition (99% interval lower end > 4). H1a and H3 by their
    frozen conditions, per rung. A gate failure is an instrument failure and
    never evidence; a G0 bounds growth over the tested range only.
  tripwires:
    - id: TW-ALIVE-G
      text: any G+ -- no interpretation, status change or synthesis; review_plan at review-breakthrough (max) with independent replication (AGENTS.md rule 12); never degraded
    - id: TW-SCOPE
      text: no deployed-curve implication, universal impossibility, exponent claim, or exponent below rho's from this experiment
    - id: TW-EXTRAP
      text: a fitted delta, bound or envelope is a statement over rungs 20-32 bits only and is never extrapolated, in any record, to larger N or to an asymptotic exponent
    - id: TW-FLOOR-INDEPENDENCE
      text: no floor ratio, A7 quantity, floor-relative reading or harvest-on mode is computed, read or written
    - id: TW-DISK
      text: no job starts while free disk is below 2.5 GB; the task checkpoints if the experiment directory exceeds the 2.0 GB package guard; a disk checkpoint is never a result

  # ---------------------------------------------------------------------------
  budget:
    enforcement: advisory
    advisory_scope: >-
      Time and CPU are advisory (docs/research-budget-policy.md); machine
      protection binds; scientific counts (curves after P0, arms, rungs,
      seeds, replicates) are fixed.
    wall_clock_seconds_per_run: 86400
    wall_clock_note: Per-attempt watchdog; expiry checkpoints the run and unfinished jobs resume in attempt-N of the same run; never a result.
    per_job_watchdog_seconds: 21600
    per_instance_watchdog_seconds: 1800
    per_task_watchdog_seconds: 345600
    total_cpu_hours: 30
    total_cpu_note: >-
      Advisory, derived not measured (planning approximation (hand)). Table
      panel (TT3, about 196000 instances, most at 20-22 bits where tables are
      tiny): at most the EXP-PFDR-011cd0 R12 average of about 0.089 CPU-s per
      instance overall (6841.569 CPU-s / 77020 instances; corrected draft
      part_B.advisory_cost), about 2-5 CPU-hours. Search panel (SS3, SS5,
      about 65000 instances): per-instance cost scales with X_fix ~ sqrt(N),
      so the five rungs cost about 1.67 times the 32-bit rung alone; at an
      assumed 2.5 CPU-s per 32-bit search instance (unmeasured; the R13
      average over all rungs and m is 9126.913 / 5170, about 1.77) about 4
      CPU-hours for SS3 and 11 for SS5. Plus G-REPRO-C, P0 and calibration
      simulations (about 2-4) and verification. About 20-30 CPU-hours, 6-10
      hours wall on 4 processes. P0 replaces these with a modeled figure from
      archived per-job CPU (power_analysis.P0_rule (7)). The concrete-cost
      table with memory beside time is proof_search_map.concrete_cost_table.
    expected_disk: >-
      Modeled, not measured. Every harvested row is retained (G-REL and the
      blind re-derivation read rows). TT3 rows: about 3 pairs per relation at
      arity 2 (Lemma L2) and about 64000 relations per random arm per rung at
      the declared n, so a few million rows per rung over 13 arms; SS rows
      depend on SS multiplicities, which are large at m = 5 (H-PFDR-2765d2
      mechanism: up to several hundred at m = 4, 5). P0 models the package from
      archived EXP-PFDR-011cd0 per-job file sizes; above 2.0 GB it is a design
      stop (power_analysis.design_stop). This is the design's likeliest stop.
    maximum_memory_gb: 14
    per_process_address_space_cap_bytes: 3500000000
    per_process_note: >-
      Every job process runs under
      experiments/EXP-PFDR-1b78f7/amd-1de84f/run_wrapper.py (RLIMIT_AS
      3.5e9). Observed peaks at 32 bits on the same build lineage: R12 table
      job 537137152 bytes, R13 search job 445931520 bytes (corrected draft
      part_B.advisory_cost, from the EXP-PFDR-011cd0 manifests). Calibration
      simulations run in chunks sized so that no process exceeds the cap.
    maximum_runs: 8
    maximum_runs_note: RC-01 to RC-07 planned plus RC-08 conditional (attribution, only if G-REPRO-C fails); attempts and job processes belong to their run
    maximum_workers: 4
    maximum_workers_note: at most 4 job processes at once; none starts while MemAvailable < 4 GB; RC-04 and RC-05 run one after the other, never together; no cap or worker count is raised for any reason

  runs:
    note: >-
      Run names below. Run ids are RUN-PFDR-969aae-<name>, fixed by the
      approval act; none exists and this design writes none. RUN_DIR is
      experiments/EXP-PFDR-969aae/runs/RUN-PFDR-969aae-<name>. <PY> is the
      interpreter the execution handoff fixes. Every finalize argv is
      written in full to the run root's command.txt (DEF-2; DEF-1).
    list:
      - id: RC-01
        name: tests
        command: <PY> -m pytest tests/test_index_calculus_fp.py tests/test_index_calculus_harvest.py tests/test_index_calculus_relcensus.py tests/test_index_calculus_smallx_offset.py -q -p no:cacheprovider --junitxml RUN_DIR/junit.xml (G-T), preceded by the G-ID identity check written to RUN_DIR/identity-report.json
        finalize: run_jobs.py finalize --run-id <id> --status <s> --reason <r> --gate-report RUN_DIR/identity-report.json (no metrics required)
      - id: RC-02
        name: repro
        command: the six archived EXP-PFDR-011cd0 job commands of G-REPRO-C, then the same with --arms extended, then reproduce_check.py into RUN_DIR/g-repro-report.json
        finalize: run_jobs.py finalize ... --gate-report RUN_DIR/g-repro-report.json (no metrics required)
      - id: RC-03
        name: p0-design
        command: design_c.py, then analyze_c.py p0 (P0X-C, G-FRESH-C, sizing, plant selections, x0, height screen, delta_res, delta_PG, RCT-1 and RCT-3 pre-data properties) into RUN_DIR (curves.jsonl.gz, design.json, power.json, p0x-c-report.json); design.json sha256 pinned before RC-04
        finalize: run_jobs.py finalize ... --gate-report RUN_DIR/p0x-c-report.json --metrics-from RUN_DIR/design.json (declared metrics required)
      - id: RC-04
        name: table
        command: >-
          run_jobs.py over design.json's TT3 jobs (one process per (rung,
          block of at most 100 consecutive curves)), each the exact flag set
          of the archived experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-table/attempt-1/jobs/3-b32-c10/command.txt
          with only --bits, --curve-offset, --curves and the output paths
          changed, small_x_offset appended to --arms, and --bases-sample-mod
          as controls_design_notes.plant_selection_rule fixes; then run_jobs.py
          merge; then analyze_c.py checks (verify_rows.py by path for G4-R;
          G4, G-CURVE, G-REL, G7, G7-OFFSET, PC-G-iii), emitting for
          structured and planted arms only per-instance PASS/FAIL and
          mismatch keys (stopping_rules [5])
        finalize: run_jobs.py finalize ... --gate-report RUN_DIR/checks-report.json --gate-report RUN_DIR/row-verify.json (no metrics required)
      - id: RC-05
        name: search
        command: >-
          as RC-04 for the SS3 and SS5 jobs (one process per (m, rung, block
          of at most 10 consecutive curves)), each the exact flag set of the
          archived experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-search/attempt-1/jobs/<m>-b32-c10/command.txt
          (m = 3 or 5) with only --bits, --curve-offset, --curves and the
          output paths changed and small_x_offset appended to --arms; then
          merge and checks as RC-04 (PC-G-iii not applicable)
        finalize: run_jobs.py finalize ... --gate-report RUN_DIR/checks-report.json --gate-report RUN_DIR/row-verify.json (no metrics required)
      - id: RC-06
        name: calibrate
        command: analyze_c.py calibrate (null arms only; arm-read-log.json) into RUN_DIR (calibration.json, null-tables.npz, real-data-power.json, view-map.json); sha256 pinned before RC-07
        finalize: run_jobs.py finalize ... --metrics-from RUN_DIR/calibration.json (declared metrics required)
      - id: RC-07
        name: analysis
        command: analyze_c.py unmask --calibration-sha256 <pinned> into RUN_DIR (analysis.json, cells.jsonl, ladders.jsonl, view-map.json, outcome id)
        finalize: run_jobs.py finalize ... --metrics-from RUN_DIR/analysis.json (declared metrics AND outcome id required)
      - id: RC-08
        name: repro-attribution
        condition: G-REPRO-C fails only
        command: the failing comparison restricted to the mismatching instances on the validated engine bytes, extracted read-only as EXP-PFDR-0b3699 AR-7 states; report whether the mismatch predates the merge of main
        finalize: run_jobs.py finalize ... --gate-report RUN_DIR/attribution-report.json (no metrics required)

  stopping_rules:
    - Order is fixed -- G-ID and RC-01; RC-02; RC-03 (design.json pinned); RC-04; RC-05; cross-run checks; RC-06 (calibration.json pinned); RC-07.
    - If G-ID, G-T or G-REPRO-C fails -- stop before RC-03; RC-08 only on a G-REPRO-C failure; return for a Coordinator decision.
    - If P0X-C or G-FRESH-C fails or P0 reaches a design stop -- stop before RC-04 and return.
    - A certificate or row-verification failure (G4, G4-R) stops that run at once; the run is invalid; rows so far are retained.
    - A per-instance, per-job or address-space stop ends that instance or job as failed_infrastructure; others continue; no re-run except a per-run watchdog continuation of unstarted or killed jobs (attempt-N of the same run).
    - >-
      No adaptive sampling beyond the pre-data P0 rule; no optional stopping.
      Blinding before RC-07 in the EXP-PFDR-011cd0 I-7 form: RC-06 parses no
      count of subgroup, small_x, dickson, small_x_offset or planted_sub; and
      every check run in or between RC-04 and RC-06 emits, for those arms and
      for the derived planted_target and planted_growth, only per-instance
      PASS/FAIL and mismatch keys -- never a relation count, row count,
      total, kappa, z or slope -- to any log or file. A mismatch key holds
      the check id, run, job, bits, c, arm, m, mode, class and the compared
      field's name, and nothing else. Census job stdout and stderr are
      handled as EXP-PFDR-0b3699 AR-1 (1) to (3) state, with merge-report.json
      carrying no total over any set including those arms.
    - >-
      Checkpointing (DS-10 (b)): every long step (census jobs, merge, checks,
      calibration simulations, unmask) writes resumable state; on resume it
      re-hashes every input it read and refuses to continue on a mismatch;
      the adopted values of a step are written to their file before any
      supplementary or diagnostic computation starts.
    - TW-DISK checkpoints the task; never a result.
    - A finalize that refuses (rct_and_fixes.DEF-2) stops that finalize only; it is re-invoked with the missing --metrics-from, never repaired by editing a file.
  invalidation_rules:
    - I-C1 a G-ID, G-T, G-REPRO-C, P0X-C or G-FRESH-C failure
    - I-C2 any modification of an engine file, of any existing test, of a committed results file, or of any path under experiments/EXP-PFDR-011cd0/, experiments/EXP-PFDR-0b3699/ or experiments/EXP-PFDR-1b78f7/
    - I-C3 any harvested row failing its certificate, any sampled row failing verify_rows.py
    - I-C4 a G7, G7-OFFSET, G-CURVE, G-REL or PC-G-iii failure
    - I-C5 nondeterminism (rows differing between worker counts, block sizes or repeated identical commands)
    - I-C6 a missing required artifact, an overwritten run record, a run directory outside experiments/EXP-PFDR-969aae/runs/, or RC-07 run with a calibration.json whose sha256 was not pinned first
    - I-C7 RC-06 having parsed a count of a structured or planted arm (its arm-read-log shows any), or any check, job log or merge report having written, before RC-07, a relation count, row count, total, kappa, z or slope of subgroup, small_x, dickson, small_x_offset, planted_sub, planted_target or planted_growth
    - >-
      I-C8 (DEF-2) a G-META failure: a raw-result.json at any location whose
      metrics.declared_metrics or metrics.outcome_id is null where
      required_artifacts.per_run requires it, a required declared-metric key
      missing or null, or a manifest lacking run.code.command or the
      explicit certificate counts. The run is invalid; the remedy is a
      Coordinator-ruled superseding record, never an edit.

  required_artifacts:
    per_run:
      - >-
        manifest.yaml at every attempt, canonical location and run root: run
        id; experiment id; the executing task id and protocol version (not
        launcher constants; A-5 lesson); status (completed_valid |
        failed_infrastructure | invalid) with completeness; code commit,
        dirty state and sha256 of every executed source file; run.code.command
        (the exact command or template, DEF-1) and the job list; environment
        (python, numpy, OS, CPU); inputs, curves and every seed (RC-01 states
        "no seeds (deterministic tests)" explicitly); the inference block
        (requested policy, backend, resolved model id or the provenance of
        its absence, model_verified, reasoning effort, fallback_used,
        degraded requirements; never a Bedrock provider); started_at and
        finished_at non-null at every location; peak RSS, CPU and wall
        seconds; the certificate block with kind none AND instances_claimed 0
        AND instances_verified 0 written explicitly (F-1 lesson; no run of
        this experiment determines a discrete log).
      - command.txt (every run_jobs.py and analyze_c.py invocation of the run, finalize included, argv in full, with UTC start and end; A-9 and DEF-2 lessons)
      - environment.json
      - stdout.log
      - stderr.log
      - >-
        raw-result.json (counts by status, gates from gate-report files only
        -- each with non-null gate and pass, F-3 lesson -- and file hashes;
        for RC-03 and RC-06 metrics.declared_metrics non-null with every
        declared key; for RC-07 metrics.declared_metrics AND
        metrics.outcome_id non-null; written by finalize from --metrics-from)
      - checksums.sha256 (every file beneath the location)
    per_run_data:
      tests: [junit.xml, identity-report.json]
      repro: [jobs/, g-repro-report.json]
      p0-design: [curves.jsonl.gz, design.json, power.json, p0x-c-report.json]
      table: [jobs/, rows.jsonl.gz, staircase.jsonl.gz, merge-report.json, row-verify.json, checks-report.json]
      search: [jobs/, rows.jsonl.gz, staircase.jsonl.gz, merge-report.json, row-verify.json, checks-report.json]
      calibrate: [calibration.json, arm-read-log.json, null-tables.npz, real-data-power.json, view-map.json]
      analysis: [analysis.json, cells.jsonl, ladders.jsonl, view-map.json]
      repro-attribution: [rows.jsonl.gz, attribution-report.json]
    declared_metrics_by_run:
      p0-design:
        - final_n per (class, m, rung)
        - x_b per rung and (class, m)
        - delta_res per (class, m)
        - delta_PG
        - t_G_plan
        - SE0_plan per cell
        - detectable delta at power 0.5 and 0.9 per cell
        - K_T,b and K_G,b per rung
        - RCT-1 null rejection and power of each rule
        - RCT-3 coverages of both bound methods with Monte Carlo SE
        - modeled package bytes and modeled CPU
      calibrate:
        - rho1_hat_b and D_b per (family, class-m, rung)
        - w_b per (family, class-m, rung)
        - SE0 per cell
        - t_G_model, t_G_perm per group, t_G_dec per cell
        - t_b, t_perm,b and t_b,dec per (class-m, rung)
        - PC-NULL-R-L and PC-NULL-G statistics, thresholds and pass
        - PC-CONST-ANA and PC-PG-ANA statistics and pass
        - RCT-2 yardstick per rung and pooled
        - real-data power at delta_res and delta_PG
        - realised detectable delta per cell
      analysis:
        - per cell delta_hat, SE0, z_G, U_signed, U_abs, U_delta
        - per cell outcome, reason code and flags
        - per cell-rung kappa_b, z_b, U_b, E_b
        - PC-RT, PC-CONST and PC-PG statistics and pass
        - gates_read
    per_experiment:
      - experiments/EXP-PFDR-969aae/specification.yaml (this contract, frozen at approval with ids filled)
      - experiments/EXP-PFDR-969aae/trial-plan.json (crypto.autoresearch.trial_plan.v1; runnable_gate)
      - experiments/EXP-PFDR-969aae/run_jobs.py, design_c.py, analyze_c.py, reproduce_check.py
      - experiments/EXP-PFDR-969aae/fixtures/ (synthetic fixtures and the fixture exercise log, run before first use on real data -- a null ladder, a constant-excess ladder, a planted-growth ladder of known delta, a planted vector absent on one curve, duplicated keys, a raw-result with a null metric that finalize must refuse)
      - experiments/EXP-PFDR-969aae/implementation-notes.yaml (append-only; pins with timestamp and sha256; the identity check; pre-data interpretations with their recorded_at; every deviation with reason and both hashes)
      - experiments/EXP-PFDR-969aae/execution-report.yaml (runs, attempts, gates, controls, rung validity table, outcome ids, failed instances, CC-6 exclusions, height-screen exclusions, unexpected observations; no interpretation beyond the outcome table)
  machine_protection:
    concurrency: at most 4 job processes; nothing else running during RC-04 and RC-05; RC-04 and RC-05 are never concurrent
    memory: RLIMIT_AS 3.5e9 per process; no job starts while MemAvailable < 4 GB; 14 GB total
    disk: TW-DISK (2.5 GB floor, 2.0 GB package guard); no single file above 95 MB (per-job files)
    watchdogs: 1800 s per instance, 21600 s per job, 86400 s per attempt, 345600 s per task
    rule: a watchdog, memory or disk stop is failed_infrastructure or a checkpoint, never a result; no cap or worker count is raised for any reason

  review_requirements:
    after_RC-07: >-
      A snapshot archive of the whole run package, run alone, then an
      independent review round whose review_plan (with the Coordinator's
      prior recorded first) is written at dispatch. Tier: review-adversarial
      (xhigh) when no cell is G+; review-breakthrough (max), never degraded,
      when any cell is G+ (AGENTS.md rule 12). Proposed joints, each with
      exactly ONE owner and a worked attack: J-BLIND (blind re-derivation),
      J-VAL (validity from artifacts, incl. G-META field completeness and the
      rung validity table), J-ID (engine identity and G-REPRO-C), J-CAL
      (per-rung calibration, t_G_model, t_G_perm), J-PTM (null ladders and
      the CONST ladders), J-PLANT-G (PG ladders, engine and analysis level,
      and PC-G-iii), J-COV (RCT-3 coverages of U_delta and U_b), J-CM (RCT-2
      common mode), J-COLL (the observation-collision audit of
      proof_search_map: |F| path, divisor stratum, p_filter, table fill,
      calibration drift, curvature).
    blind_rederivation: >-
      From rows and the frozen text only, the re-deriver recomputes per
      cell-rung C_X,b, C_R,b, V_b, SD_null,b (integers exact; floats within
      1e-12 relative), the weights w_b, delta_hat and z_G, and with its own
      simulation code and seeds the per-rung U_b, U_delta and t_G_model
      within a comparison tolerance fixed in the review_plan before
      dispatch. blind_from: analysis.json, cells.jsonl, ladders.jsonl,
      calibration.json, real-data-power.json and analyze_c.py, until its
      sealed section is written.
    proves_too_much: >-
      Objects where growth is known false must show none: the 24
      random-as-structured null ladders and the CONST ladders (engine-level
      planted_target for TT3; CONST-ANA for every class-m). Objects where
      growth is known true must show it with the right exponent: the
      planted_growth ladder (TT3) and PG-ANA (every class-m) at delta_PG.
    report_directories: >-
      ONE ATTESTATION PER REPORT DIRECTORY (DEC-20261010-b662c7 R-3 item 1):
      each reviewer's deliverable carries the single review_attestation;
      fragments merged by an assembler carry no top-level review_attestation.
      tools/check_review_independence.py must PASS in directory mode
      (--batch or the report directory) AND in file mode (--plan with
      --reports); both invocations and exit codes are recorded verbatim by
      the sealing archive.
    reviewer_checkpointing: >-
      Long reviewer computations write resumable state, re-hash inputs on
      resume and write adopted values before any supplementary work
      (DEC-20261010-b662c7 R-5).
    launch_prompt_rule: >-
      Every executor, reviewer and archive handoff this contract implies
      states that its launch prompt names each receipt the task depends on
      -- task id, commit sha, verifier verdict and, under CF-1, the main
      commit carrying the same bytes -- and the dispatched session refuses to
      begin until it has them (rct_and_fixes.launch_prompt_rule).
    coordinator_validity_checklist: >-
      Before any interpretation: (1) expected run count against the stop
      point; (2) schema-complete manifests; (3) FIELD-LEVEL COMPLETENESS of
      required artifacts -- for every run, raw-result.json
      metrics.declared_metrics and (RC-07) metrics.outcome_id non-null, every
      declared_metrics_by_run key present and non-null, run.code.command
      present, instances_claimed and instances_verified written explicitly;
      a file that exists is NOT enough (DEF-2); (4) seed integrity against
      design.json; (5) raw/summary agreement (cells.jsonl and ladders.jsonl
      against analysis.json; a sampled recount from rows); (6) control
      comparability (same curves, arms, rungs and randoms per family); (7)
      pins and blinding logs (arm-read-log, view-maps, check outputs); (8)
      the identity report; (9) the rung validity table and CC-6 lists.
    executor_independence: >-
      A new executor session that did not produce EXP-PFDR-011cd0 or
      EXP-PFDR-0b3699 (TASK-20261001-7f7a33, TASK-20261002-8a6b8a,
      TASK-20261008-9456e8 and their continuations); same-model sessions
      attest session independence only.

  pareto_honesty:
    dominated_by: >-
      Pollard rho (about 0.886 sqrt(N) group operations, O(1) memory;
      internal: H-PFDR-2765d2 asymptotic_claim.prior_best) for every outcome
      of this engine. This engine's measured exponent is N^{max(h, m-h+1)/m}
      (internal): 2/3 at m = 3 (h 2) and 3/5 at m = 5 (h 3). Under the
      motivating conditional (exponent move delta/2), reaching rho's 1/2
      would need delta of about 1/3 (m 3) or 1/5 (m 5), about a hundred times
      the declared resolution (planning approximation (hand)). Any G+ here is
      therefore a heuristic-validation signal and a candidate for review,
      not an attack, and no reading of it may be framed as one.
    sota_delta: >-
      No attack; a measurement contribution only. On this line growth with N
      goes from "not estimable" (two rungs; EV-PFDR-ad6274 INF-6) and an
      unpowered secondary slope (DF-2) to a pre-registered, calibrated slope
      test on five rungs with a planned resolution of about 0.0027 in delta
      at power 0.9 (planning approximation (hand); P0 fixes delta_res).

  interpretation_limits:
    - A G0 bounds growth for one cell over rungs 20-32 bits on these curves and this engine; it says nothing about N above 32 bits or about an asymptotic exponent, and it closes nothing by itself.
    - A G+ is a candidate for review-breakthrough and independent replication, not a result, not a speedup and not an exponent claim.
    - The slope is read along the engine's default base-size path |F| ~ N^{1/m}; growth in N and growth in |F| are not separated (proof_search_map quantifier_order).
    - N^delta and a log-type growth are not separable over Delta log2 N of about 12; the fitted delta is a local slope.
    - SS planted ladders are analysis-level; SS readings carry the limitation that the harvester's SS recall is not tested by a planted SS relation.
    - Toy scale; generated curves; no deployed-curve statement.

  design_options_for_the_approval_act:
    part_B_merge: >-
      OPTIONAL, not adopted by this draft. Part B stays conditional
      (DEC-20261010-b662c7 NA-4; DEC-20261002-d0594a NA-6). If the approval
      act merges it, Part B's fresh 30-32-bit curves (reserved c = 10000 ..
      19999; corrected draft part_B R-B1) at n_b = max(B's n, this ladder's
      n) would serve as the 30 and 32 rungs of TT3, SS3 and SS5 here, and B's
      other cells (TT4, TT5, SS4, TB3; 21 cells with small_x TT4) would run
      in the same panels. Stated cost: Part B's own advisory 4-8 CPU-hours
      and 2-4 hours wall (corrected draft part_B.advisory_cost), plus the
      EC-B1 engine planted mechanism that B needs for TT5 and SS planted
      arms at target (R-B5) -- an engine change this contract does not
      otherwise make, with its own lift and tests -- plus a family-wise
      threshold over 21 level cells and a review round wider by B's joints.
      Recommendation: do not merge. The merge would put an engine change
      and a constant-level census on the critical path of the line's only
      exponent-relevant read.
    ss5_precision_relaxation: >-
      OPTIONAL. sigma_t = 0.0075 for SS5 only would cut its n_b from about
      803 to about 357 per rung (planning (hand), factor 2.25) and raise its
      delta_res by 1.5; the family-wise threshold is unchanged. Not adopted:
      equal resolution across the nine cells keeps the G0 statements
      comparable.
    ss_row_retention_fallback: >-
      NOT adopted; named so that a design stop on package size has a ready
      option. If P0 models the package above 2.0 GB, the approval act (or a
      protocol_amendment before RC-05) may retain full SS rows only on curves
      with c % 4 == 0 and record rows_digest for the rest; G-REL and the
      blind re-derivation would then run on the retained sample plus the
      in-process counts. This weakens the blind re-derivation and needs a
      Coordinator ruling before any census data.

  assigned_to: executor
  approved_by: null

# =============================================================================
# C-2 PILOT PRECONDITIONS (DS-4; DEC-20261002-d0594a OB-5; corrected draft
# part_C C-2_rungs_above_32_bits). Requirement-level design; approves nothing,
# lifts nothing.
# =============================================================================
c2_pilot:
  position: >-
    A LATER, SEPARATE experiment (EXP id minted at its own approval), not a
    phase of EXP-PFDR-969aae. Reasons:
    (1) ENGINE IDENTITY. C-1 must run on the build Part A's G-REPRO
    validated (DS-10 (f)); C-2 needs the engine change EC-C1. One
    experiment spanning two builds would break the identity its ladder
    rests on, and EC-C1's files must not change while C-1 is queued or
    running.
    (2) HYPOTHESIS BOUNDARY. Rungs at 34-36 bits fall outside
    H-PFDR-2765d2 test_boundary (toy, fields <= 32 bits; no statement about
    N above 32 bits) (DF-4). A growth fit that uses them needs a Coordinator
    act extending or succeeding that boundary first; C-1 does not.
    (3) RUNNABILITY. C-1 needs no engine change and no lift, so it can pass
    the runnable gate once its scripts exist; tying it to EC-C1 would put an
    engine implementation and its lift on C-1's critical path.
    (4) INFORMATION ORDER. The pilot's products (the equality gate and the
    resource probe) are infrastructure facts that decide whether a C-2
    ladder is feasible and how large it may be; they are best known before
    that ladder is designed, and they are never a reading about growth.
    Sequencing: EC-C1 is implemented only after C-1's run package is
    snapshot-archived, so C-1's build stays fixed throughout its execution.
  scope_of_the_pilot: >-
    TT3 (table mode) at 34 and 36 bits; SS3 and SS5 (search mode) at 34 and
    36 bits for measurement only (no SS or TT5 C-2 ladder is designed before
    the probe; corrected draft part_C C-2 verdict). TT3 at 38 bits or above
    stays out of scope under the 3.5e9 cap unless the probe shows otherwise
    (rule below).
  preconditions:
    - id: C2-a
      title: census --no-accel switch (EC-C1) with an equality gate
      text: >-
        EC-C1 (below) is implemented and its tests pass, and the equality
        gate G-EQ passes: on the EC-C1 build, the pure-Python path (census
        --no-accel) reproduces the archived numpy-path rows of
        EXP-PFDR-011cd0 exactly at 30-32 bits -- jobs
        RUN-PFDR-011cd0-table/attempt-1/jobs/3-b30-c10 and 3-b32-c10 (the
        first 20 curves of each, compared with the archived rows of those
        curves) and RUN-PFDR-011cd0-search/attempt-1/jobs/3-b30-c10,
        3-b32-c10 and 5-b32-c10 (the full ten-curve jobs), each run with the
        exact archived command plus --no-accel. Every census row equals the
        archived row with exactly the keys seconds, harvest.harvest_seconds
        and harvest.worker_maxrss_bytes excluded (the A-3 set) and the
        path-indicator key accelerated compared as "archived true, new
        false"; every harvest row and staircase row equals the archived
        file with no exclusion. If the implementation finds any other key
        that records the code path, it stops and returns BEFORE the gate
        runs; no exclusion is added after any output exists (the A-3 lesson).
        Also G-REPRO-EC: on the EC-C1 build WITHOUT the flag, the same jobs
        reproduce the archived rows exactly under the A-3 set (the switch is
        additive).
    - id: C2-b
      title: resource probe at 34 and 36 bits
      text: >-
        On the EC-C1 build, under run_wrapper.py (RLIMIT_AS 3.5e9), at most 4
        processes: for each of TT3, SS3 and SS5 and each of 34 and 36 bits,
        three curves (c = 70000 .. 70002 for TT3, 70100 .. 70102 for SS3,
        70200 .. 70202 for SS5; the C-2 probe block of the Part C
        reservation) with the full C-1 arm list of the class's panel, one
        curve per process (--workers 1). Recorded per instance: CPU seconds,
        wall seconds, table bytes or SS store peak entries, and per process
        peak RSS (ru_maxrss and the wrapper's peak). PASS for a (class, m,
        rung) iff every instance completes under the 1800 s per-instance
        watchdog with no MemoryError and the per-process peak RSS is at most
        2.8e9 bytes (80% of the cap). A failure is a feasibility fact for
        that (class, m, rung), never a reading.
    - id: C2-c
      title: exclusions
      text: >-
        TT4 and TB3 are excluded from C-2: a growth read there needs about
        2.5e5 curves per rung for sigma_b 0.005 (corrected draft part_C,
        planning 1.6 / (0.26 x 2.5e-5)). TT5 and SS4 are not in Part C.
  EC-C1:
    title: census --no-accel switch (engine change; additive)
    files:
      - src/crypto_autoresearcher/index_calculus/__main__.py -- add --no-accel to the census subparser only; carry accelerate = False into the census job and every solver or harvester call the census path makes; sweep and solve unchanged
      - src/crypto_autoresearcher/index_calculus/harvest.py -- honour an explicit accelerate = False, with no vectorised scan and no numpy store (today line 197 selects the vectorised scan by _accel.usable(p) alone); behaviour with accelerate None unchanged
      - src/crypto_autoresearcher/index_calculus/solver.py -- pass accelerate through to the harvesters where it is not already passed; nothing else
      - tests/test_index_calculus_noaccel.py (new)
    files_unchanged_note: >-
      tails.py (line 129 already honours accelerate is not False) and
      decompose.py (use_acceleration) need no change as read. If the
      implementation finds that any file other than the three named engine
      files must change, it stops and returns; the lift covers only the
      named files.
    new_tests:
      - T-NOACCEL-1 -- at 12-16 bits, m = 3 and 5, table and search modes, every C-1 arm -- rows, harvest rows and staircases with --no-accel equal those without it, except the path-indicator key accelerated
      - T-NOACCEL-2 -- with --no-accel the harvester performs no vectorised scan and creates no numpy store (assert on the harvester's state, not on timing)
      - T-NOACCEL-3 -- without the flag, census rows, harvest rows and staircases on frozen 16-20-bit fixture instances are byte-identical to the 38be58dad-plus-EC-A1 bytes
      - T-NOACCEL-DET -- --workers 1 and 2 give identical rows with --no-accel
      - every existing tests/test_index_calculus_*.py passes unedited
    gate: G-EQ and G-REPRO-EC (C2-a); G-T on the EC-C1 build
  lift_requested: >-
    REQUESTED, NOT GRANTED BY THIS DRAFT. At the approval of the C-2
    experiment (not at C-1's approval), a Coordinator lift of the standing
    restriction DEC-20261002-c3f49b NA-5, as continued by
    DEC-20261002-e7f8c9 na5_lift.continues_for, limited to exactly the four
    EC-C1 paths above, for exactly one executor-implementation task (id
    minted then), ending when that task returns. Every other path under
    src/crypto_autoresearcher/index_calculus/**, tests/test_index_calculus_*.py,
    tests/fixtures/** and experiments/EXP-PFDR-011cd0/** stays read-only for
    every task. The lift may be granted only after C-1's run package
    snapshot archive has verified.
  tier_rule: >-
    The tier of a rung is assigned by the mechanical rule of
    docs/claims-and-verification.md, as cited in EV-PFDR-ad6274
    claim_tier_basis: toy when the max field bit size is <= 32, medium when
    32 < max <= 96. A 34- or 36-bit rung is medium; a growth fit that
    includes any C-2 rung has max field size 34 or 36 and is medium tier as
    a whole; a C-1-only fit stays toy. The label is descriptive and asserts
    no transfer (TW-SCOPE).
  growth_fit_entry_rule: >-
    C-2 rungs enter a growth fit only after C2-a and C2-b both pass for that
    (class, m, rung), and only under a later contract that (i) follows the
    hypothesis-boundary act of DF-4, (ii) pre-registers the joint estimator
    (the same WLS slope with weights from null arms, a family-wise
    threshold re-declared for the joint ladder) before any C-2 census data,
    and (iii) keeps C-1's outcome as recorded: no C-1 cell is re-scored by
    C-2 data.
  tt3_38_bits_rule: >-
    Out of scope under the 3.5e9 cap: the corrected draft's planning memory
    for the pure-Python TT3 table is about 0.54 GB at 34 bits, 1.35 GB at 36
    and 3.4 GB at 38 (planning approximation (hand) from tails.py's about
    185 bytes per dict tail), over the cap once interpreter overhead is
    added. A 38-bit single-curve probe may be PROPOSED by a later decision
    only if the measured per-process peak RSS ratio r = RSS(36) / RSS(34)
    satisfies RSS(36) x r <= 2.8e9; nothing here designs it.
  prospective_runs_of_the_pilot:
    - noaccel-tests (T-NOACCEL-1 to -DET and G-T on the EC-C1 build)
    - default-repro (G-REPRO-EC)
    - noaccel-equality (G-EQ)
    - probe (C2-b; 34 and 36 bits)
  machine_protection: as experiment.machine_protection; the probe never runs while any C-1 run is running
  advisory_cost: >-
    Unknown and unmeasured: the pure-Python census speed was never exercised
    at census scale. The equality gate is bounded by the watchdogs (1800 s
    per instance, 21600 s per job); the probe is 18 curves. Recorded by the
    pilot, never estimated into a result.
  handoffs_implied: >-
    An executor-implementation task for EC-C1 (write scope exactly the four
    EC-C1 paths plus the C-2 experiment directory), its snapshot archive,
    the pilot's run task and its archive. Each card carries the
    launch-prompt rule (rct_and_fixes.launch_prompt_rule) and the DEF-2
    finalize rule (rct_and_fixes.DEF-2).

# =============================================================================
# RCT-1 to RCT-3, DEF-2 AND THE LAUNCH-PROMPT RULE (DEC-20261010-b662c7 R-2,
# R-4, R-5, R-6), each with its text and where `experiment` applies it.
# =============================================================================
rct_and_fixes:
  RCT-1:
    source: >-
      DEC-20261010-b662c7 R-2 and R-6; red team TASK-20261009-bfdc5b
      required_controls RCT-1 and joints J-PCNULLR (on EXP-PFDR-0b3699 the
      max of the four null z against its simulated 0.99 quantile 2.853 had
      null rejection 0.0114 and power 0.925 to 0.930 at a single null arm at
      kappa 1.10; criterion (i) failed with probability at most 0.00035
      under every assessed single-arm departure). Those numbers belong to
      that design; this contract computes its own at P0.
    text: >-
      PC-NULL-R criterion (i) is REPLACED by a family-wise maximum of the
      null pseudo-cell z values, calibrated under their simulated joint law.
      Applied to the ladder per (class, m), over its eight null pseudo-cells
      (four per family: r0, r1, r2 and the known-null arm, each scored
      against the other three):
      LEVEL rule PC-NULL-R-L. (i-L) the maximum over the eight of the
      ladder-pooled level z (z_pool = sum_b (C_X,b - C_R,b) /
      sqrt((4/3) sum_b V_b) over the valid rungs) does not exceed the 0.995
      quantile of that maximum under the joint law; (ii-L) the sum of the
      eight squared z_pool does not exceed its simulated 0.995 quantile.
      GROWTH rule PC-NULL-G. (i-G) the maximum over the eight null ladders
      of z_G does not exceed the 0.995 quantile of that maximum under the
      joint law; (ii-G) the sum of the eight squared z_G does not exceed its
      simulated 0.995 quantile.
      The joint law is simulated with each family's four null arms drawn per
      curve and rung from the calibrated G-NB-R model, the triples formed
      exactly as in the data, >= 20000 replicates x 5 seed families.
      CRITERION (ii) of the old rule (mean of the null z inside its 99%
      interval) is NOT kept as a gate; it is reported. Reason: within a
      family the four pseudo-cell numerators sum to zero identically, so
      the mean measures only the covariance of numerator and SD_null (its
      99% interval was 0.016 wide on EXP-PFDR-0b3699) and is blind to common
      mode (OBJ-RT-2). It is replaced by (ii-L) and (ii-G), which see a
      depressed or over-dispersed null arm that a one-sided maximum misses
      (the red team's sum-of-squares alternative on EXP-PFDR-0b3699: null
      rejection 0.0138, power 0.875 to 0.882 at kappa 1.10).
      Per rung, pooled or both: the LEVEL rule is POOLED over rungs and the
      GROWTH rule is across rungs; both GATE, per (class, m). Per rung, the
      maximum over the eight null pseudo-cells' z_b against its simulated
      0.99 quantile is REPORTED for every rung and never gates (fifteen
      per-rung gates would fail by chance about 0.14 of the time per
      experiment, planning approximation (hand)).
      At P0, before any data, P0 computes and records for each rule its null
      rejection rate (target about 0.01 per (class, m)) and its power
      against a single-arm departure at the target: a constant kappa 1.15 on
      one null arm (level rule) and growth at delta_PG on one null arm
      (growth rule). Nothing is computed by this draft.
    applied_in:
      - experiment.controls (RANDOM-AS-STRUCTURED NULL PSEUDO-CELLS AND NULL LADDERS)
      - experiment.gates PC-NULL-R-L and PC-NULL-G; experiment.gate_rule (gating controls)
      - experiment.analysis.rct_rules_applied; experiment.analysis.two_step_blinding (calibrate computes them from null arms only)
      - experiment.power_analysis.P0_rule (6) (null rejection and power recorded before data)
      - experiment.tail_checks (null-ladder joint law; per-rung report)
      - experiment.falsification_criterion (HEUR-2765d2-H4)
      - experiment.required_artifacts.declared_metrics_by_run (p0-design and calibrate)
  RCT-2:
    source: DEC-20261010-b662c7 R-6; TASK-20261009-bfdc5b required_controls RCT-2 and joints J-PCNULLR.numbers.common_mode
    text: >-
      A common-mode yardstick is reported per rung and pooled, per (family,
      class-m). (1) The null-arm rate against U: for TT3, rho1_hat_b = sum of
      the three randoms' counts / (3 x sum_j mu_model(j)) with a 99%
      curve-cluster interval; for SS3 and SS5 (no relation-level uniform
      mean: Lemma L3 is a sketch) the pair first-moment ratio of
      HEUR-2765d2-H1a with its 99% interval. (2) The null-arm rate against
      EXP-PFDR-011cd0's random-arm rate at the same (family, class-m, rung)
      -- comparable at all five rungs, because EXP-PFDR-011cd0 ran 20 to 32
      bits in steps of 2 -- as raw and mu_model-normalised ratios f_b with
      99% intervals. EXP-PFDR-0b3699 measured TT4 only and is NOT comparable
      for TT3, SS3 or SS5; this is stated in the report rather than forced.
      (3) The pooled yardstick over rungs, as on EXP-PFDR-0b3699.
      (4) The growth form of the yardstick: the WLS slope g of log2 of the
      null-arm rate ratio (against U, and against EXP-PFDR-011cd0) on x_b,
      with its 99% interval. (5) The drift needed to carry each decision
      boundary, per cell: Delta_G = (t_G_dec - z_G) x SE0 (the drift in log2
      kappa per unit log2 N that would move z_G onto t_G_dec) and Delta_0 =
      delta_res - U_delta (the drift that would move U_delta onto
      delta_res), and per cell-rung the multiplicative factor that would
      carry U_b across 1.15.
      GATES OR REPORTED, stated before data: the yardstick does not gate a
      run or a control. It qualifies one outcome: a cell is
      common-mode-sensitive at the G0 boundary when the wider of the two
      admitted 99% intervals of g contains a drift of magnitude at least
      |Delta_0| in the direction that would carry U_delta above delta_res;
      such a cell cannot be G0 and is G? instead. At the G+ boundary the flag
      common-mode-sensitive is recorded and routed to the review; G+ routing
      is unchanged.
    applied_in:
      - experiment.metrics.secondary (the RCT-2 common-mode yardstick)
      - experiment.outcomes.rows G0 condition (common-mode qualifier)
      - experiment.analysis.rct_rules_applied; experiment.analysis.two_step_blinding (computed at calibrate except Delta_G and Delta_0, which need z_G and U_delta and are computed at unmask)
      - experiment.review_requirements.after_RC-07 (joint J-CM)
      - experiment.required_artifacts.declared_metrics_by_run (calibrate)
  RCT-3:
    source: DEC-20261010-b662c7 R-6 (OBJ-RT-3, OBJ-RT-4); TASK-20261009-bfdc5b required_controls RCT-3; TASK-20261009-a92ff3 rederivation.U_A["AR-3_choice"] (choice_at_monte_carlo_resolution true; minimum signed coverage 0.94445 against the 0.945 floor)
    text: >-
      The AR-3 coverage switch is REPLACED by a governing-bound rule that
      Monte Carlo noise cannot decide: for every bound this contract
      computes -- every per-rung U_b, every U_delta, and so every additive
      envelope E_b = U_b - 1 -- the LARGER of the signed-quantile bound and
      the |dev|-quantile bound ALWAYS governs. No simulated coverage selects
      the method. Both bounds are reported with their simulated one-sided
      coverage and its Monte Carlo SE. Replicate counts are sized so each
      coverage's Monte Carlo SE is stated: U_delta coverage at delta = 0,
      delta_res and delta_PG on >= 8000 synthetic designs per point (SE
      about 0.0024 at 0.95); per-rung U_b coverage at kappa 1.00, 1.05 and
      1.15 on >= 4000 per point (SE about 0.0034); every quantile on >= 20000
      replicates x 5 seed families with the spread reported. The threshold
      rule t_G_dec = max(t_G_model, t_G_perm) is likewise a max rule, so its
      source cannot flip a decision; a z_G within 3 Monte Carlo SE of t_G_dec
      carries the flag threshold-at-MC-resolution (OBJ-RT-4).
    applied_in:
      - experiment.analysis.upper_bound_U_delta
      - experiment.analysis.per_rung_bounds_and_additive_envelope
      - experiment.analysis.growth_test (max rule and MC flag)
      - experiment.metrics.primary (U_delta row)
      - experiment.outcomes.rows G0 condition (governing bound)
      - experiment.power_analysis.P0_rule (6) (coverages recorded before data)
      - experiment.review_requirements.after_RC-07 (joint J-COV)
  DEF-2:
    source: DEC-20261010-b662c7 R-4 F-2 (validator TASK-20261009-33b5cf F-2; F-3 alongside)
    text: >-
      Every finalize of a run whose required_artifacts.per_run demands
      declared metrics or an outcome id passes --metrics-from, and the run
      list writes that argv in full. The pinned EXP-PFDR-0b3699 finalize
      supports --metrics-from but copies only declared_metrics (as read:
      m.get("declared_metrics", m.get("raw_result_metrics"))) and no outcome
      id, so the new launcher's finalize
      (experiments/EXP-PFDR-969aae/run_jobs.py) (1) copies both
      metrics.declared_metrics and metrics.outcome_id from the --metrics-from
      file; (2) REFUSES, with a non-zero exit and no file written, to
      finalize a run named in declared_metrics_by_run without
      --metrics-from, or when any declared key or (for analysis) the outcome
      id would be missing or null; (3) accepts as --gate-report only files
      carrying non-null gate and pass (F-3); (4) writes run.code.command
      (DEF-1, AMD-20261008-9c080d A-4). Gate G-META and invalidation rule
      I-C8 fail any run whose raw-result metrics or outcome id is null where
      required. The Coordinator validity checklist carries a FIELD-LEVEL
      completeness item: checking that a required file exists is not
      enough.
    applied_in:
      - experiment.runs.list[*].finalize (argv in full; --metrics-from on p0-design, calibrate and analysis)
      - experiment.required_artifacts.per_run (raw-result.json and command.txt clauses) and declared_metrics_by_run
      - experiment.gates G-META; experiment.invalidation_rules I-C8; experiment.stopping_rules (finalize refusal)
      - experiment.review_requirements.coordinator_validity_checklist item (3)
      - experiment.inputs.experiment_scripts_new (run_jobs.py) and required_artifacts.per_experiment (fixture -- a null metric that finalize must refuse)
  launch_prompt_rule:
    source: DEC-20261010-b662c7 R-5 (the a92ff3 and 33b5cf launch prompts lacked the receipt statement; both sessions refused until supplied) and R-6
    text: >-
      Every executor, reviewer and archive handoff this draft proposes says
      that its launch prompt names each receipt the task depends on: the
      task id, the commit sha, the verifier verdict and, under CF-1, the main
      commit carrying the same bytes (0b0d513b6a for any receipt at or
      before fdbe201359; for later receipts, the main commit named when the
      branch carrying them is merged). The dispatched session refuses to
      begin until it has them, and records them in its first output.
    applied_in:
      - experiment.review_requirements.launch_prompt_rule (reviewer and sealing-archive cards)
      - runnable_gate.handoffs_implied (pre-approval implementation task, executor run task, snapshot archives, ledger archives)
      - c2_pilot.handoffs_implied

# =============================================================================
# PROOF SEARCH MAP (KN-TECH-080; docs/inventor-protocol.md section 8). Part of
# the contract by reference at approval (as EXP-PFDR-0b3699 AR-6).
# =============================================================================
proof_search_map:
  scope_note: >-
    The map of a measurement, not of a theorem: it audits whether the slope
    of log2 kappa_rel on log2 N over 20-32 bits identifies growth of the
    relation-level structural excess, and what it cannot certify. It
    extends H-PFDR-2765d2's proof_search_map (read-only) to the growth
    observable.
  bottleneck: >-
    Whether the number of DISTINCT informative relations a structured base
    supplies, relative to matched random bases at the same |F| and exposure,
    grows with N along the engine's default base-size path. Under U the
    random-arm first moment is fixed by Lemma L1 and HEUR-2765d2-H2 predicts
    kappa_rel -> 1; only kappa_rel ~ N^delta with delta > 0 could bear on
    this engine's exponent (the motivating conditional of asymptotic_claim,
    not relied on). The constant at 30-32 bits is already bounded on all 21
    FAM-1 cells (DEC-20261002-c3f49b; DEC-20261010-b662c7); the slope is the
    untested quantity.
  baseline_embedding:
    parameter_slice: >-
      (i) The matched random arms, kappa_rel = 1 by definition, at every
      rung; each random arm scored as structured is the delta = 0 slice of
      the growth observable (the null ladders). (ii) The EXP-PFDR-011cd0
      random arms at rungs 20, 22, 26, 30 and 32 as RUNG FIXTURES: their
      calibration groups are this ladder's P0 inputs at the decision scope,
      and their archived rows are the G-REPRO-C reproduction targets and the
      P0X-C integer anchors. (iii) The EXP-PFDR-0b3699 random arms (TT4,
      30-32 bits) as the fixture of the validated build: the same engine
      bytes reproduced the archived EXP-PFDR-011cd0 rows under G-REPRO
      (EV-PFDR-f6b76c A-3); they are a different (class, m) and are not a
      rung of this ladder or a yardstick for it (RCT-2).
    reproduction_check: >-
      Frozen fixtures run before any census data of this experiment: G-ID
      (engine bytes), G-T (tests unedited), G-REPRO-C (six archived jobs, table
      m 3 and search m 3 and m 5 at 20 and 32 bits, rows equal under the
      pre-registered A-3 exclusion set), P0X-C (nine archived integers
      recounted from rows), and the experiment's synthetic fixtures (a null
      ladder, a constant-excess ladder, a planted-growth ladder of known
      delta) exercised through analyze_c.py before first use on real data.
  observation_collision:
    observable: delta_hat per growth cell -- the WLS slope of log2 kappa_b on x_b with null-fixed weights -- with z_G, U_delta and the per-rung envelope as companions
    distinct_preimage_search:
      - id: C-1
        collision: Growth in N versus growth in |F| -- the default size default_fb_size(N, m) and the subgroup size (from d | p - 1) need not track N^{1/m} exactly, so a structure effect that depends on |F| reads as an N-slope.
        separation: Not separated by this design; declared. The reading is ALONG the engine's default |F| path, which is the path the exponent conditional uses (quantifier_order). s / N^{1/m} per rung is reported.
      - id: C-2
        collision: Calibration drift between rungs (rho1_hat_b, D_b differ by rung) read as growth.
        separation: Each rung is calibrated on its own null arms; the null slope law is simulated at the realised per-rung parameters; the CONST ladders (a constant excess) must not read as growth (PC-CONST, PC-CONST-ANA).
      - id: C-3
        collision: The p_filter subgroup_prime_filter([3, 4, 5], 0.15) admits a different divisor mix at each bit size, so the subgroup base's structure changes with the rung.
        separation: The null ladders run on the same filtered curves, so filter-induced drift of the null is excluded by PC-NULL-G; the subgroup slope within the dominant divisor stratum is reported (secondary).
      - id: C-4
        collision: Table fill and formal duplicates (E' / |F|^2) drifting with N.
        separation: CC-2 removes formal relations; E' / |F|^2 per arm per rung is reported; the null arms share any arm-independent drift.
      - id: C-5
        collision: Small-count bias of log2 of a ratio at low rungs (Jensen).
        separation: Equal per-rung precision by design; the null slope law is simulated at the realised design, so any bias sits inside the null.
      - id: C-6
        collision: SS exposure and early-return behaviour changing with N (X_fix = 20 isqrt(N)).
        separation: X_fix is identical for every arm of a curve (CC-3); HEUR-2765d2-H5 is read per rung; the SS null ladders.
      - id: C-7
        collision: Common mode -- the random bases drifting away from U with N, which moves C_R and so kappa_rel.
        separation: RCT-2 yardstick, its growth form g, and the G0 qualifier.
      - id: C-8
        collision: A one-rung artefact (as the 32-bit elevation of small_x TT4 in EXP-PFDR-011cd0, EV-PFDR-ad6274 OBS-4, which did not recur on fresh curves) read as a slope.
        separation: Five rungs; leave-one-rung-out slopes (U-G3); fresh curves per rung.
      - id: C-9
        collision: Functional form -- N^delta, a log-type growth and curvature give similar local slopes over Delta log2 N of about 12.
        separation: Not separable; declared. The quadratic term is reported; delta is a local slope over the tested range (TW-EXTRAP).
      - id: C-10
        collision: An informative but solve-useless homogeneous excess (H-PFDR-2765d2 proof_search_map remaining collision).
        separation: Any G+ goes to review-breakthrough with S_3-to-solution measured there; never read here as a speedup.
      - id: C-11
        collision: A change of code path between rungs (numpy versus pure Python) read as growth.
        separation: Every C-1 rung uses the numpy path (p < 2^32); C-2 introduces the pure-Python path only behind the equality gate G-EQ.
  constructive_transforms:
    - transform: observable_fiber
      proposed_object: hold (class, m), the default |F| path, exposure and the random-arm construction fixed; vary N across rungs and the base geometry across arms
      predicted_gain: separates growth of a base's structure from rung-wise calibration and from a constant excess
    - transform: representation_reduction
      proposed_object: carried from H-PFDR-2765d2 -- pair counts to projective relation classes (Lemma L1), so each rung's null is an exact two-moment statement for TT
      predicted_gain: per-rung null in the right unit, hence a slope null that is not a pair-unit artefact
  quantifier_order: >-
    Target (unchanged, from H-PFDR-2765d2): THERE EXISTS an x-defined,
    target-independent base family {F_N}, membership testable in polylog(p),
    such that FOR ALL N in the range, kappa_rel_c(F_N) >= 1 + c N^delta
    (delta > 0) with informative rank >= 0.9 R_star. What this design can
    test: FOR EACH of the nine named (base, class, m) cells, ALONG the
    engine's default |F| ~ N^{1/m} path, OVER the rungs 20, 22, 26, 30 and 32
    bits with fresh curves per rung, whether the WLS slope of log2 kappa_rel
    exceeds a family-wise calibrated threshold, and a calibrated upper bound
    on that slope when it does not. A G0 is "no slope above delta_res on
    these rungs", never "for all N". Allowed dependencies: the base may
    depend on N through d | p - 1 and through the default size; thresholds,
    weights and SE0 depend on the design and the null arms only, never on a
    structured arm; x_b depends on the design curves only; delta_res and
    delta_PG depend on P0's design quantities only.
  method_ceiling:
    strongest_certifiable_claim: >-
      Per growth cell, a calibrated local slope delta_hat over 20-32 bits
      with a governing one-sided upper bound U_delta, a family-wise
      one-sided 0.05 test, and per-rung envelopes, on these arms, this
      engine and these curves. Planned resolution about 0.0018 (power 0.5)
      and 0.0027 (power 0.9) in delta (planning approximation (hand); P0 fixes
      delta_res). It cannot certify an asymptotic delta, separate N^delta from
      log-type growth, or say anything for N above 32 bits, other bases,
      classes, arities or engines.
    nearby_object_control: >-
      Four-sided. (i) Null ladders: the closest objects where growth is
      FALSE and there is no excess (PC-NULL-G). (ii) CONST ladders: the
      closest objects with an excess and NO growth (PC-CONST, PC-CONST-ANA).
      (iii) Planted-growth ladders: the closest objects with growth of KNOWN
      exponent delta_PG (PC-PG, PC-PG-ANA). (iv) small_x_offset: the closest
      base to small_x without the small x-height (secondary; a routing
      qualifier for any small_x G+).
  heuristics_validated:
    - id: HEUR-2765d2-H2
      what_the_ladder_tests: its growth implication (kappa_rel -> 1, so no positive slope) on the nine cells over 20-32 bits
      falsification_condition: a G+ on a cell confirmed by the review-breakthrough round and an independent replication of the ladder on fresh curves (TW-ALIVE-G); a G0 does not confirm H2, it bounds the slope by U_delta
    - id: HEUR-2765d2-H4
      what_the_ladder_tests: random base ~ U and the known-null arm distributed as the calibrated null, per rung and across rungs
      falsification_condition: PC-NULL-R-L or PC-NULL-G fails at a (class, m), or t_perm,b exceeds t_b's simulated 0.999 quantile at some rung
    - id: HEUR-2765d2-H1c
      what_the_ladder_tests: the TT m = 3 relation dispersion clause and its randomized-PIT KS clause, per rung
      falsification_condition: at a rung, the 99% interval of the pooled within-curve relation dispersion of r0..r2 lies entirely outside [0.8, 1.25], or the randomized-PIT KS rejects at 1% (frozen condition)
    - id: HEUR-2765d2-H5
      what_the_ladder_tests: SS exposure equivalence at X_fix, per rung, at m = 3 and 5
      falsification_condition: at a rung, the random-arm SS relation dispersion's 99% interval has lower end > 4, or the SS null ladders fail PC-NULL-R-L or PC-NULL-G (frozen condition)
    - id: HEUR-2765d2-H1a
      what_the_ladder_tests: pair first moment against the uniform mean, per rung (secondary)
      falsification_condition: at a rung, the 99% curve-cluster interval of sum n_P / sum mu over r0..r2 lies entirely outside [0.90, 1.10] (frozen condition)
    - id: HEUR-2765d2-H3
      what_the_ladder_tests: rank in relation units at TT3, per rung (secondary)
      falsification_condition: for a random arm with >= 20 qualifying instances (R_star >= 10) at a rung, the median of informative_rank / min(R_star, U) is below 0.95 (frozen condition)
    - id: growth-conditional (not numbered)
      what_the_ladder_tests: kappa_rel ~ N^delta is asymptotic_claim's motivating conditional, not a numbered heuristic
      falsification_condition: none assigned here; a successor hypothesis must number and state it before any claim (experiment.heuristic_under_test note)
  proof_obligations:
    - claim: L1 two-moment formula for fixed stored sets (TT null per rung)
      responsibility: success_probability
    - claim: equal per-rung precision is achieved at the final n (P0 rule (5))
      responsibility: size
    - claim: the engine bytes equal the validated build and the archived rows reproduce (G-ID, G-REPRO-C)
      responsibility: baseline
    - claim: in-process relation counts equal the analysis recount from retained rows at every rung (G-REL)
      responsibility: correctness
    - claim: every planted TT vector is recovered and each derived arm counts exactly its listed plants (PC-G-iii)
      responsibility: correctness
    - claim: the slope test does not fire on a constant excess and does fire on planted growth with the right exponent (PC-CONST, PC-PG and their analysis-level forms)
      responsibility: correctness
    - claim: the governing bound covers at its label (RCT-3 coverages with Monte Carlo SE)
      responsibility: success_probability
    - claim: the reading is along the default |F| path and over 20-32 bits only
      responsibility: scope
    - claim: table bytes, SS store entries and per-process RSS are reported per rung
      responsibility: memory
  concrete_cost_table:
    label: >-
      ADVISORY, planning approximation (hand). This experiment's own cost,
      with memory beside time, per (class, m) and rung at the declared n. It
      is not a cost table for any attack: no attack is claimed. Assumptions
      flagged as optimistic (OPT) or as overestimates (OVR) below; P0 and the
      run's manifests replace every figure.
    assumptions:
      - OPT -- 32-bit TT3 table instance about 0.3 CPU-s, scaling as table size N^{2/3}, plus about 0.01 CPU-s per instance of curve and base overhead (unmeasured split of the R12 average)
      - OPT -- 32-bit search instance about 2.5 CPU-s at m = 3 and 5, scaling as X_fix ~ N^{1/2} (unmeasured; the R13 average over all m and rungs is about 1.77)
      - OVR -- per-process peak RSS taken as the observed 32-bit job maxima (R12 537137152 bytes; R13 445931520 bytes) at every rung; lower rungs are smaller
      - numpy stored-set memory 8 to 12 bytes per tail or SS entry (tails.py, as quoted in the corrected draft part_C); TT3 tails about 1.23e6 at 32 bits (README, as quoted there), scaling as N^{2/3}; SS store about X_fix = 20 isqrt(N) entries
    rows:
      - {cell: TT3, rung: 20, curves: 7390, arms: 13, instances: 96070, cpu_hours: 0.3, tails_per_instance: 4.8e3, stored_bytes_per_instance: 6e4, peak_rss_bytes_per_process: 5.4e8}
      - {cell: TT3, rung: 22, curves: 4655, arms: 13, instances: 60515, cpu_hours: 0.2, tails_per_instance: 1.2e4, stored_bytes_per_instance: 1.5e5, peak_rss_bytes_per_process: 5.4e8}
      - {cell: TT3, rung: 26, curves: 1849, arms: 13, instances: 24037, cpu_hours: 0.2, tails_per_instance: 7.7e4, stored_bytes_per_instance: 9e5, peak_rss_bytes_per_process: 5.4e8}
      - {cell: TT3, rung: 30, curves: 733, arms: 13, instances: 9529, cpu_hours: 0.3, tails_per_instance: 4.9e5, stored_bytes_per_instance: 6e6, peak_rss_bytes_per_process: 5.4e8}
      - {cell: TT3, rung: 32, curves: 462, arms: 13, instances: 6006, cpu_hours: 0.5, tails_per_instance: 1.23e6, stored_bytes_per_instance: 1.5e7, peak_rss_bytes_per_process: 5.4e8}
      - {cell: SS3, rung: 20, curves: 280, arms: 12, instances: 3360, cpu_hours: 0.04, ss_entries_per_instance: 2.0e4, stored_bytes_per_instance: 2.5e5, peak_rss_bytes_per_process: 4.5e8}
      - {cell: SS3, rung: 22, curves: 280, arms: 12, instances: 3360, cpu_hours: 0.07, ss_entries_per_instance: 4.1e4, stored_bytes_per_instance: 4.9e5, peak_rss_bytes_per_process: 4.5e8}
      - {cell: SS3, rung: 26, curves: 280, arms: 12, instances: 3360, cpu_hours: 0.3, ss_entries_per_instance: 1.6e5, stored_bytes_per_instance: 2.0e6, peak_rss_bytes_per_process: 4.5e8}
      - {cell: SS3, rung: 30, curves: 280, arms: 12, instances: 3360, cpu_hours: 1.2, ss_entries_per_instance: 6.6e5, stored_bytes_per_instance: 7.9e6, peak_rss_bytes_per_process: 4.5e8}
      - {cell: SS3, rung: 32, curves: 280, arms: 12, instances: 3360, cpu_hours: 2.3, ss_entries_per_instance: 1.3e6, stored_bytes_per_instance: 1.6e7, peak_rss_bytes_per_process: 4.5e8}
      - {cell: SS5, rung: 20, curves: 803, arms: 12, instances: 9636, cpu_hours: 0.1, ss_entries_per_instance: 2.0e4, stored_bytes_per_instance: 2.5e5, peak_rss_bytes_per_process: 4.5e8}
      - {cell: SS5, rung: 22, curves: 803, arms: 12, instances: 9636, cpu_hours: 0.2, ss_entries_per_instance: 4.1e4, stored_bytes_per_instance: 4.9e5, peak_rss_bytes_per_process: 4.5e8}
      - {cell: SS5, rung: 26, curves: 803, arms: 12, instances: 9636, cpu_hours: 0.8, ss_entries_per_instance: 1.6e5, stored_bytes_per_instance: 2.0e6, peak_rss_bytes_per_process: 4.5e8}
      - {cell: SS5, rung: 30, curves: 803, arms: 12, instances: 9636, cpu_hours: 3.3, ss_entries_per_instance: 6.6e5, stored_bytes_per_instance: 7.9e6, peak_rss_bytes_per_process: 4.5e8}
      - {cell: SS5, rung: 32, curves: 803, arms: 12, instances: 9636, cpu_hours: 6.7, ss_entries_per_instance: 1.3e6, stored_bytes_per_instance: 1.6e7, peak_rss_bytes_per_process: 4.5e8}
    totals: >-
      About 1.5 CPU-hours (TT3), 3.9 (SS3) and 11.1 (SS5) for the census
      panels, about 17 in all, plus G-REPRO-C, P0 and calibration simulations
      and verification: about 20-30 CPU-hours (budget.total_cpu_hours 30),
      6-10 hours wall at 4 processes. Memory: per-process peak about 0.5 GB
      against the 3.5e9 cap at every rung; total resident at most 4 x 0.54
      GB, far inside 14 GB. Disk is the binding resource and is modeled by P0
      (budget.expected_disk).
    time_memory_tradeoff_and_parallelism: >-
      None exploited: jobs are independent blocks of curves, so wall time
      scales about as CPU / 4 at the 4-process cap; memory per process does
      not grow with the worker count.
    o1_and_hidden_overheads: >-
      Not applicable to a measurement: no asymptotic cost is claimed. The
      engine exponent context is in experiment.pareto_honesty.
    affected_vs_safe_scope: >-
