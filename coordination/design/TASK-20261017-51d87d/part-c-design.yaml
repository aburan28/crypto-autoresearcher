experiment:
  id: EXP-PFDR-969aae
  hypothesis_id: H-PFDR-2765d2
  question_id: RQ-PFDR-ae2fba
  version: 1
  title: >-
    C-1 in-band growth-with-N ladder for H-PFDR-2765d2: relation-level
    kappa_rel of the subgroup, small_x and dickson bases at TT3, SS3 and SS5
    on five rungs (20, 22, 26, 30, 32 bits) of fresh curves, with a
    pre-registered weighted log-log slope test of growth (family-wise
    one-sided 0.05 over nine cells), per-rung calibration on each rung's own
    null arms before unmasking, random-as-structured null ladders, a
    constant-excess planted ladder and a planted-growth ladder at a declared
    exponent, and a real-data permutation null beside the model null
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible_before_review: false
  designed_by: coordinator (design session TASK-20261017-51d87d; snapshot archive TASK-20261010-893a99)
  objective: >-
    Measure, for each of nine growth cells (base A in {subgroup, small_x,
    dickson} x (class, m) in {TT3, SS3, SS5}), whether the relation-level
    structural excess kappa_rel(A, class, m; N) = C_A / C_R (CC-8 of
    EXP-PFDR-011cd0, unchanged) grows with N over the in-band range 20-32
    bits on this mitm engine. Primary: the slope delta of log2 kappa_hat_b on
    x_b (mean log2 N of rung b) by weighted least squares with weights fixed
    from the null arms before unmasking (multiplicative model kappa(N) = a
    N^delta), tested one-sided for delta > 0 against a family-wise threshold
    calibrated on this experiment's own null arms, with a decision-bearing
    one-sided upper bound U_delta. Reported beside it: the additive model's
    per-rung envelope c N_b^delta <= U_b - 1. The declared resolution
    delta_res is fixed by P0 before any census data. Growth with N is the
    only route on this line that can bear on an exponent
    (DEC-20261002-c3f49b NA-6 (3); docs/target-result-profile.md); two rungs
    cannot estimate it (EV-PFDR-ad6274 INF-6), so every reading here rests on
    at least four valid rungs. A resolved positive slope is an
    exponent-relevant CANDIDATE routed under TW-ALIVE-G, never a result. A
    fitted delta is a statement over 20-32 bits only and is never
    extrapolated.

  # ---------------------------------------------------------------------------
  inputs:
    source_records:
      - ledger/hypotheses/H-PFDR-2765d2.yaml (statement; asymptotic_claim.time_exponent as the motivating conditional only; HEUR-2765d2-H1a, H1c, H2, H3, H4, H5; proof_search_map; test_boundary bits 20..32, band 20..28 for slope)
      - ledger/evidence/EV-PFDR-ad6274.yaml (INF-6; OBS-4; claim_boundaries; claim_tier_basis) and ledger/evidence/EV-PFDR-f6b76c.yaml (claim_boundaries.solver_and_version; limitations; heuristic_validation)
      - ledger/decisions/DEC-20261010-b662c7.yaml (R-2, R-4 DEF-2, R-5, R-6 RCT-1 to RCT-3; NA-3)
      - experiments/EXP-PFDR-011cd0/specification.yaml (counting_conventions CC-1 to CC-10; cells.design_curves, arms, arm_order; analysis A-CAL_calibration, PC-NULL_rule, A-INT_intervals, A2R_slope, A6R_heuristics; power_analysis per-instance planning figures) -- protocol v6 with its amendments, none of which changes CC-1 to CC-10, the statistic or A-CAL
      - experiments/EXP-PFDR-0b3699/specification.yaml (frozen; controls, analysis.two_step_blinding, permutation_null_RC-3, upper_bound_U_A simulation rule, gates, stopping_rules, invalidation_rules, required_artifacts, machine_protection, approval_rulings AR-1, AR-2, AR-7) and amendments/AMD-20261008-9c080d.yaml (A-3, A-4, A-5, A-6, A-8, A-9)
    convention_source: >-
      The row and relation conventions are EXP-PFDR-011cd0
      specification.yaml counting_conventions CC-1_relation_unit,
      CC-1b_sign_only (reported only), CC-2_nonformal, CC-3_scope (TT and TB:
      the whole table; SS: pairs whose two encodings both have formally
      distinct sequence number < X_fix = 20 * isqrt(N)), CC-4_classes,
      CC-5_unit_of_replication, CC-6_exclusions, CC-7_counts, CC-8_statistic,
      and cells.design_curves for the generator and base sizes. Adopted by
      clause, unchanged. CC-9 (family membership by E[C_R] >= 100) is
      applied per rung by P0 to every growth cell. CC-10 (band pooling) is
      NOT used for any decision here: each rung is its own cell-rung, and
      the decision quantity is the slope across rungs. No README is a
      convention source (F-2 lesson).
    p0_inputs_by_path_and_field:
      - path: experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-calibrate/calibration.json
        field: generators["G-NB-R"].groups[key == [F, C, m, b]].D and .mj and .curves, for F in {SUB, DICK}, (C, m) in {(TT, 3), (SS, 3), (SS, 5)}, b in {20, 22, 26, 30, 32}
        value_read: >-
          Keys and field names confirmed present (groups ordered by key; e.g.
          the first group has key ["SUB", "TT", 3, 20], curves 10..109 and mj
          values near 7.5). No D or mj value is transcribed here; P0 reads
          them by key. Index positions are never used (match on key only).
        role: >-
          Per-rung relation dispersion D_b and per-curve null means at the
          decision scope (TT3: full table; SS: X_fix), realised random arms
          (OBJ-RT-6 compliant). At 20-28 bits these rest on 100 (table) and
