# =============================================================================
# RUNNABLE-GATE READINESS (DS-11; AGENTS.md "Approval is bounded by
# execution"). The design session has no shell and did not run
# tools/experiment_preapproval.py; this section lists what the approval act's
# packet will need and what blocks it today.
# =============================================================================
runnable_gate:
  probe: python3 tools/experiment_preapproval.py --packet <PACKET.json> must report approvable true for the exact prospective bytes before approval; read-only, grants nothing
  packet_schema: crypto.autoresearch.preapproval_packet.v1 (tools/experiment_preapproval.py module docstring)
  prospective_packet:
    experiment_id: EXP-PFDR-969aae
    approval_decision_id: DEC-<YYYYMMDD>-<tok> (to mint; ids_to_mint)
    specification: experiments/EXP-PFDR-969aae/specification.yaml (this draft's `experiment` mapping transcribed at approval with ids filled, status approved, frozen true)
    trial_plan: experiments/EXP-PFDR-969aae/trial-plan.json (schema crypto.autoresearch.trial_plan.v1; one trial per run of experiment.runs.list in the stopping-rule order, RC-08 conditional)
    queue: coordination/goals/<GOAL-id>/batches/<BATCH-id>/queue.json (BLOCKED by B-1)
    handoff: ledger/handoffs/TASK-<YYYYMMDD>-<tok>.yaml (the executor run task; to mint)
    preview: temporary copies of the four files above; their sha256 must equal the later canonical archive exactly
    source_ref: origin/main
    lane_id: BATCH-<id> (BLOCKED by B-1)
    execution_route:
      kind: implementation
      reason: >-
        No existing launcher implements this ladder: the per-rung P0 sizing,
        the per-rung two-step calibration, the WLS slope test with null-fixed
        weights, the RCT-1 to RCT-3 rules, the derived planted ladders and
        the DEF-2 finalize are new experiment code. The engine is unchanged
        (experiment.inputs.engine_build.no_engine_change). A runbook route
        would need these scripts to exist already; they do not.
  source_and_input_paths_bound_by_the_packet:
    - experiments/EXP-PFDR-969aae/run_jobs.py, design_c.py, analyze_c.py, reproduce_check.py (to be written; B-2)
    - experiments/EXP-PFDR-969aae/fixtures/ and implementation-notes.yaml (to be written; B-2)
    - src/crypto_autoresearcher/index_calculus/** and tests/test_index_calculus_*.py at the validated bytes (G-ID; B-4)
    - experiments/EXP-PFDR-011cd0/verify_rows.py and experiments/EXP-PFDR-1b78f7/amd-1de84f/run_wrapper.py (read-only, invoked by path)
    - experiments/EXP-PFDR-011cd0/runs/RUN-PFDR-011cd0-calibrate/calibration.json, RUN-PFDR-011cd0-p0-design/attempt-3/design.json, the six G-REPRO-C job directories under RUN-PFDR-011cd0-table and RUN-PFDR-011cd0-search, and experiments/EXP-PFDR-0b3699/runs/RUN-PFDR-0b3699-p0-design/design.json and curves.jsonl.gz (inputs)
  blockers:
    - id: B-1
      text: >-
        NO GOAL LANE. The probe requires a GOAL-* with an open lane (queue
        and lane_id); this line has goal_id null (DEC-20261010-b662c7). This
        is an approval-time blocker for the Coordinator. Resolving it is a
        Coordinator act outside this design -- for example attaching the
        line to an existing ECC goal with an open lane, or opening a goal for
        it, each by its own committed record and tools/goal_lanes.py. This
        draft creates no goal and no lane and proposes neither.
    - id: B-2
      text: >-
        SCRIPTS DO NOT EXIST. The packet binds source hashes on origin/main,
        so the experiment scripts, fixtures and trial plan must be written,
        exercised on synthetic fixtures only (no real-data run), snapshot-
        archived and merged to main with a merge commit BEFORE the probe. This
        needs a pre-approval implementation task (handoffs_implied H-1) with
        write scope experiments/EXP-PFDR-969aae/{run_jobs.py, design_c.py,
        analyze_c.py, reproduce_check.py, fixtures/, implementation-notes.yaml,
        trial-plan.json} only. It touches no engine file, so it needs no NA-5
        lift. Writing these paths before approval creates no record:
        specification.yaml is written only at approval.
    - id: B-3
      text: >-
        TRIAL PLAN SCHEMA. trial-plan.json must satisfy
        crypto.autoresearch.trial_plan.v1; its fields beyond the schema name
        were not read by this session (docstring only) and are the
        implementation task's to satisfy, checked by the probe.
    - id: B-4
      text: >-
        ENGINE IDENTITY UNVERIFIED. Main has moved since the validated build
        (main db3b3fe7ed was merged into the branch at 714e2ac8a7, per the
        launch facts). G-ID must pass on the merged tree before the packet is
        built; a mismatch is a stop with the AR-7 extraction as the
        pre-named remedy, by Coordinator ruling only.
    - id: B-5
      text: >-
        AFTER APPROVAL. Once the approval decision and its archive are
        committed, python3 tools/newest_experiments.py --experiment
        EXP-PFDR-969aae --json must report execution_state ready before
        dispatch; a mismatch stops dispatch and needs an additive correction.
    - id: B-6
      text: >-
        KNOWN RISK, not a gate blocker: the P0 package-size design stop
        (budget.expected_disk). Its pre-named fallback is
        experiment.design_options_for_the_approval_act.ss_row_retention_fallback,
        not adopted.
  handoffs_implied:
    - id: H-1
      text: pre-approval implementation task (executor-implementation policy; fresh session; write scope as B-2; synthetic fixtures only; zero real-data runs); archived_by H-2; launch prompt names the TASK-20261010-893a99 receipt and the design-return ledger receipt (launch-prompt rule)
    - id: H-2
      text: snapshot archive of H-1's files, run alone; then push and merge to main with a merge commit
    - id: H-3
      text: approval decision (after the probe reports approvable true) and its ledger archive, run alone, committing the frozen specification, trial plan, the executor card H-4 and the run-package archive card H-5
    - id: H-4
      text: executor run task (a new session per experiment.review_requirements.executor_independence; claim before launch; G-ID on the merged tree; RC-01 to RC-07; DEF-2 finalize); its launch prompt names the H-2 and H-3 receipts with commit, verdict and main commit (launch-prompt rule)
    - id: H-5
      text: snapshot archive of the whole run package, run alone, before any review agent reads it
    - id: H-6
      text: review round (review_plan with recorded prior written first; joints of experiment.review_requirements; one attestation per report directory; checker in directory and file modes) and its sealing archive; each card carries the launch-prompt rule
    - id: H-7
      text: composing decision, evidence record and their ledger archive, run alone after check (j)

# =============================================================================
# IDENTIFIERS TO MINT (top-level session: tools/allocate_id.py --next <type>
# --date <YYYYMMDD>, then --check). This design minted nothing.
# =============================================================================
ids_to_mint:
  already_bound_not_to_mint:
    - EXP-PFDR-969aae (C-1; pre-named by the card)
    - TASK-20261010-893a99 (this draft's snapshot archive; bound by the card)
  at_design_return:
    - DEC-<YYYYMMDD>-<tok> -- the design-return decision (card snapshot_archive_arrangement)
    - TASK-<YYYYMMDD>-<tok> -- its ledger archive (commits the 893a99 card and the decision after the 893a99 receipt verifies)
  before_approval_of_C-1:
    - TASK-<YYYYMMDD>-<tok> -- H-1, pre-approval implementation of the experiment scripts (B-2)
    - TASK-<YYYYMMDD>-<tok> -- H-2, its snapshot archive
    - GOAL-* and BATCH-* -- ONLY if the Coordinator resolves B-1 by opening a goal; not proposed by this draft
  at_approval_of_C-1:
    - DEC-<YYYYMMDD>-<tok> -- the approval (or return or decline) decision; if declined, EXP-PFDR-969aae is recorded reserved_unused by that act
    - TASK-<YYYYMMDD>-<tok> -- H-3, its ledger archive
    - TASK-<YYYYMMDD>-<tok> -- H-4, the executor run task
    - TASK-<YYYYMMDD>-<tok> -- H-5, the run-package snapshot archive
    - RUN-PFDR-969aae-<name> for name in tests, repro, p0-design, table, search, calibrate, analysis, repro-attribution (derived from the experiment token when the approval fixes the run ids)
  after_C-1_returns:
    - TASK ids for the review round (validator and re-deriver, red team), its sealing archive, the composing DEC, the EV-PFDR evidence record and its ledger archive TASK
  for_C-2_later_separate:
    - DEC-<YYYYMMDD>-<tok> -- the hypothesis-boundary act of DF-4 (and any successor H-PFDR-* it creates), before any C-2 ladder contract
    - EXP-PFDR-<tok> -- the C-2 experiment, at its own approval, with its approval DEC (which grants the EC-C1 lift) and ledger archive TASK
    - TASK-<YYYYMMDD>-<tok> -- the EC-C1 executor-implementation task, its snapshot archive, the pilot run task and its archive
  not_needed:
    - No new H-* record for C-1 (it tests H-PFDR-2765d2 within its test_boundary, rungs 20..32 bits).
    - No protocol_amendment of EXP-PFDR-011cd0 or EXP-PFDR-0b3699 (both frozen; read only).
    - No AMD id now. tools/allocate_id.py has no amendment type (AMD-20261008-9c080d id_provenance); any amendment of this contract after approval draws its token as that record did.

