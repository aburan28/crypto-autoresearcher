      gamma (that contract''s box ladder is not reproduced numerically; the enumeration
      here is by work W on sup-norm shells).'
    - 'CTRL-TDC: one f = t^d - c cell (the EXP-ECDLP-3e8403 form, smallest c in {3,
      5, 7, 11, 13} with a toy prime) per degree is included and reported beside that
      contract''s gamma for the same reason.'
    - 'CTRL-DISC: polynomial discriminants computed exactly; PARI nfdisc recorded
      when gp is present; a field whose root discriminant is far from its shape''s
      is reported, never dropped.'
    - 'CTRL-IRRED: every defining polynomial is irreducible over Q (distinct-degree
      factorisation at many primes plus a rational-root check); a reducible g is replaced
      by the next seeded g.'
    - 'CTRL-REPLAY: seeded replay is byte-identical.'
