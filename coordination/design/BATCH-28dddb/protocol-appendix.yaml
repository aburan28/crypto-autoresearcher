protocol_appendix:
  experiment_id: EXP-ECDLP-ac7e8b
  version: 1
  status: frozen_for_protocol_review
  execution_authorized: false
  authority: RQ-SDEG-001 independent protocol review must precede implementation. This appendix fixes scientific choices; actual code/verifier/fixture/runtime hashes are later admission outputs, not choices left open.
  imported_contract:
    path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-012/certificate_contract.yaml
    version: 1.0.0-review
    schema: crypto.autoresearch.rank_failure_conservation_certificate
    hash_binding: Exact source-packet hash, full contract imported including literal domain tags, required field names, canonicalization and nine conservation gates. No historical source mutation.
    source_priority: Apply that contract to schedules/receipts/conservation. The explicit watchdog adapter below adds segment semantics without reinterpreting the historical TIMEOUT_CENSORED lifecycle.
  panel:
    cells:
      - {id: S3-b08, family: S3, m: 2, bits: 8, cap: 16}
      - {id: S3-b10, family: S3, m: 2, bits: 10, cap: 24}
      - {id: S3-b12, family: S3, m: 2, bits: 12, cap: 32}
      - {id: S3-b16, family: S3, m: 2, bits: 16, cap: 48}
      - {id: S3-b20, family: S3, m: 2, bits: 20, cap: 64}
      - {id: S3-b24, family: S3, m: 2, bits: 24, cap: 80}
      - {id: S4-b08, family: S4, m: 3, bits: 8, cap: 12}
      - {id: S4-b10, family: S4, m: 3, bits: 10, cap: 16}
      - {id: S4-b12, family: S4, m: 3, bits: 12, cap: 20}
      - {id: S4-b16, family: S4, m: 3, bits: 16, cap: 24}
    instances_per_cell: 20
    index: j=0..19, master=j mod5, replica=floor(j/5); all five master labels0..4 occur four times per cell.
    independence_scope: Twenty separately domain-separated fixture draws per cell under a deterministic hash-stream model; repeat conditions are paired, and accidental identical realized fixtures are retained/reported rather than declared independent new information.
    factor_base_size: min(cap,floor(p/4))
    tier: No requested cell exceeds24bits; the governing32bit cap does not authorize an added tier.
  bytes_and_seeds:
    encoding: A string is u32 big-endian UTF-8 byte length followed by UTF-8 bytes. Unsigned indices/master/replica/bits are u32 big-endian; counters are u64 big-endian; concatenation is exactly the listed order. All external conservation/JCS integer values are decimal strings, even when internal hash input is binary.
    fixture_seed: SHA256(str(EXP-ECDLP-ac7e8b/v1/fixture)||str(cell_id)||u32(master)||u32(replica)||u32(j)). This shared seed excludes mode, load, calibrator and timing order.
    work_seed: SHA256(str(EXP-ECDLP-ac7e8b/v1/work)||raw_fixture_seed||str(component_name)); identical across load/mode and warmup/measured repeat.
    sample: For seed32bytes, literal domain, index and counterc starting0, h=integer(SHA256(str(domain)||seed||u32(index)||u64(c))). To draw [0,L-1], accept h<floor(2^256/L)*L and return h mod L; record rejections. Nonzero draw is1+draw(L-1). No modulus-zero or counter wrap; overflow is retained implementation/capacity failure.
    attempt_seed: SHA256(str(EXP-ECDLP-ac7e8b/v1/attempt)||str(cell_id)||u32(j)||u32(load)||str(mode)); these unique sealed attempt identity seeds are distinct from shared fixture/work seeds. Check uniqueness before sealing; a hash collision prevents admission, not remapping after launch.
    bootstrap_seed: SHA256(str(EXP-ECDLP-ac7e8b/v1/bootstrap)||u32(0)); domain-separated from all scientific fixtures.
  fixture_generation:
    candidate_limit: 64 candidates per sealed(cell,j), ordered c=0..63; accept first passing structural requirements, before any solver work. Retain every rejection and cost. Exhaustion leaves that instance/cell inadmissible and the full intended comparison incomplete, never replace it using solver outcomes.
    candidate_seed: SHA256(str(EXP-ECDLP-ac7e8b/v1/curve-candidate)||raw_fixture_seed||u32(c))
    prime: >-
      Draw an index uniformly in the odd b-bit integers, then scan that odd
      interval cyclically in ascending order from that index until the first
      prime, proving primality by trial division through floor(sqrt(n)).
      Assert2^(b-1)<=p<2^b andp>3. The scan and all composite witnesses are charged.
    coefficients: Draw a,b uniformly in Fp with distinct domains curve-a/curve-b; reject4a^3+27b^2=0. Use y^2=x^3+a*x+b.
    order_and_ordinary: >-
      Count points exactly by x=0..p-1 using Euler's criterion for each RHS,
      with zero contributing one y, a nonzero square two and nonsquare zero,
      plus O. Record N_curve and the reproducible count certificate/digest.
      Require(p+1-N_curve) modp !=0 for an ordinary prime-field curve.
      Independently recount with the verifier's arithmetic before admission.
    subgroup: Trial-factor N_curve completely; choose its largest prime factor ell, certify primality and ell>=5. Require(ell-1)/2>=factor_base_size. Let h=N_curve/ell.
    generator: Scan affine x ascending and the least canonical square root y; for every nonzero square RHS form R=(x,y), P=[h]R. Choose first nonidentity P and check[ell]P=O. Square roots use the frozen Tonelli-Shanks procedure below; scanning/search work is retained. Failure of the exhaustive scan rejects the candidate.
    target: After factor-base construction letT be its first ascending-x canonical lift andR_plant=[m]T. Drawk uniformly from[2,ell-1] excluding the known generator-side scalar ofR_plant if it lies in that interval, by drawing a compressed interval index and skipping that one scalar; setQ=[k]P. R_plant!=O becauseell>=5 andm is2or3. The negative-randomtarget control is this Q outside the named singleton planted window {R_plant}; it is not assumed to have no other decomposition. Producer solvers receive public points and sealed work seeds, never k or factor-base scalar provenance; private generation data is separate. This is reproducible planted benchmarking, not secrecy from a party holding all generation seeds.
    factor_base: >-
      Fisher-Yates shuffle the integers1..ell-1 using the fixture stream/domain
      factorbase and exact rejection sampling, then traverse that order.
      Compute[k]P, normalize to the least y of its two signs, and keep each
      distinct x once until the required size. The full shuffle/point work
      is construction expense. No outcome-based selection. Every retained
      canonical lift and its negative must satisfy[ell]T=O. Sort retained x
      ascending for the public polynomial and tuple-enumeration order.
    square_roots: >-
      For z=0 return0. Check z^((p-1)/2)=1 or reject nonsquare. Factorp-1=q*2^s
      withq odd; choose least integer nonresidue u>=2; initialize c=u^q,
      r=z^((q+1)/2),t=z^q,m=s. Whilet!=1 choose least i in[1,m-1] with
      t^(2^i)=1, b=c^(2^(m-i-1)),r=r*b,t=t*b^2,c=b^2,m=i.
      Verify r^2=z and return min(r,p-r). All operations use the declared
      arithmetic; independent verifier uses a separately authored implementation.
    source_provenance: Ordinary criterion is from the parent-read official Sage source branch recorded in external-source-note.json; no Sage runtime or actual curve was invoked in design.
  coefficient_kernel:
    domain: Private Fp coefficient class under pinned CPython3.13.1/SymPy1.14.0, SYMPY_GROUND_TYPES=python/PYTHONHASHSEED=0/SYMPY_USE_CACHE=no before import, explicit buchberger/grevlex. Assert every ring coefficient and domain operation routes here; native fallbacks refuse admission.
    arithmetic: Canonical residues0..p-1; all operations reduce modulo p. Timing/counting execute identical instructions apart from the enabled per-type counter sink. The replacement POW is a declared arithmetic algorithm change used in both modes, not stock SymPy timing.
    events:
      M: MUL(a,b) performs one residue product/reduction and emits one M even ifa=b numerically or either operand is0/1.
      S: SQUARE(a) performs one residue square/reduction and emits one S. It does not call the public MUL emitter.
      I: INV(nonzero a) performs extended Euclid on(p,a), emitting one I; quotient/remainder/coefficient integer work is separately counted boundary work, not recursively charged FpM/S. INV(0) fails explicitly.
      A: ADD,SUB,NEG each emits exactly one A and performs its direct operation/reduction. Reverse subtraction calls direct SUB once, not NEG plus ADD. Small constants become field multiplications when multiplied; no hidden free repeated addition.
    division: DIV(a,b)=MUL(a,INV(b)), emitting I+M exactly once, includinga=0; preserve explicit algorithmic skips such as monic divisor1 before the call.
    pow: >-
      For integer n=0 returnONE without events. Initialize r=ONE and b=a
      for n>0, or b=INV(a) and n=abs(n) for n<0, retaining that inverse as
      the base. While n>0, ifodd setr=MUL(r,b);
      n=floor(n/2); ifn>0 setb=SQUARE(b). Returnr. Thus positive n uses
      popcount(n) M and floor(log2(n)) S. Direct MUL never changes type
      because its operands compare equal.
    dunders: __add__/radd,sub/rsub,neg,mul/rmul,truediv/rtruediv,pow and invert/domain.quo/exquo explicitly route to those definitions once; no inherited modularinteger bypass. Record callsite class/domain counters and reject any unrecognized arithmetic route.
    outside_field_counts: Constructors/coercions/reductions not already inside an event, integer exponent indices/gcd/primality/factorization, outer pointcount accumulation, hashes, comparison, allocation, parser/serialization and loop/monomial work get separate boundary counts/time/resources. Actual Fp RHS evaluation, Euler/nonresidue powers, Tonelli-Shanks, scalar/group arithmetic and independent recounting remain typed Fp kernel operations even inside setup/order routines. Field event vectors do not count every CPU instruction.
    vectors: Producer Fp, independently implemented verifier Fp and independent rank F_ell are separate typed vectors; never add unlike fields under an unlabeled weight.
    weights: SupplementaryFp statistic W=M+S+100*I+A, separately for producer/verifier and their labeled sum. Allweightspositive and fixed; not measured hardware equivalence and not the ICEX/resource numerator. Retain raw vectors and per-type slopes.
  group_arithmetic:
    representation: Canonical affine points with explicit O tag. Finite SEC1 uncompressed0x04||x||y, each coordinate widthceil(bitlen(p)/8); O is0x00 and accepted only where the imported fixture schema permits. No y-bit compression.
    add: >-
      O returns other point. For samex andy1=-y2 returnO; equality withy=0
      also returnsO. For equal finite points otherwise lambda=DIV(ADD(MUL(3,SQUARE(x)),a),MUL(2,y)).
      Otherwise lambda=DIV(SUB(y2,y1),SUB(x2,x1)). Then
      x3=SUB(SUB(SQUARE(lambda),x1),x2),y3=SUB(MUL(lambda,SUB(x1,x3)),y1).
      Named constants are field residues; every displayed kernel call is charged.
    scalar: Binary left-to-right over the minimal nonnegative scalar bitstring, R=O; double each bit and add the base if1. Negative signed summands use NEG(y) once and retain that cost; no endomorphism/negation quotient acceleration.
    independent: Verifier implements affine formulas/encoding/membership/sums separately without importing producer kernel or point code, with the same declared event vocabulary and its own recorded arithmetic counts.
  polynomial_algorithm:
    representation: Sparse monomial-exponent tuples in variable order x1,x2 (S3) orx1,x2,x3 (S4), canonical coefficients, zero coefficients deleted. Construction iteration order descending grevlex, with exponent tuple lexical tie break. Dense intermediate slots in explicit calibrators are the separate fixed loops below.
    S3: '(x1-x2)^2*xR^2 - 2*((x1+x2)*(x1*x2+a)+2*b)*xR + (x1*x2-a)^2 - 4*b*(x1+x2)'
    construction_order: Evaluate the displayed expression tree left-to-right with the following explicit sparse constructor operations. ADD/SUB iterate the union of supports in canonical order and invoke exactly one kernel ADD/SUB per slot, supplying zero for an absent operand. Unary NEG invokes one NEG per coefficient. MUL loops first-factor then second-factor canonical term order and ADDs every coefficient MUL into its slot including an initially zero slot; delete zeros after the whole operation. Polynomial SQUARE uses this same MUL(P,P), not operand-equality reclassification. Powers0/1 areONE/copy; higher fixed construction powers repeat MUL left-to-right. These constructor SUB and separate NEG+ADD schedules have different counts; the pinned solver's own PolyElement arithmetic keeps its source semantics. No common-subexpression optimization.
    factor_polynomial: g(X)=product over sorted V of(X-v), startingONE and multiplying successive factors in that order. Reuse its sealed coefficient bytes across variable substitutions with construction attribution, never recount a reused construction as new work.
    S4: >-
      Form A(t)=S3(x1,x2,t)=a2*t^2+a1*t+a0 and
      B(t)=S3(x3,xR,t)=b2*t^2+b1*t+b0 by simultaneous variable binding.
      Evaluate the determinant of[[a2,a1,a0,0],[0,a2,a1,a0],
      [b2,b1,b0,0],[0,b2,b1,b0]] using all24 permutations in lexicographic
      order. For each permutation multiply its four entries fromONE in row
      order, negate for odd inversion parity, ADD into the accumulator.
      Polynomial zero multiplication returns zero with zero coefficient
      events but charged branch work. No opaque symbolic resultant is called.
    independent_S4_check: Independently construct both S3-in-t quadratics and their Sylvester matrix using separate polynomial code. Bareiss determinant starts previous_pivot=ONE,sign=1; fork=0,1,2 choose the first rowr>=k with nonzeroM[r,k], swap and flip sign ifneeded, returnZERO if none. Simultaneously update every trailing M[i,j]=(pivot*M[i,j]-M[i,k]*M[k,j])/previous_pivot by independently checked exact single-divisor polynomial long division, then set lower column entrieszero and previous_pivot=pivot. Return sign*M[3,3]. A nonzero remainder or disagreement with producer determinant invalidates the checker/construction; no fallback hides it. Record pivots/divisions and costs; no producer construction import.
    ideal: '[f,g(x1),...,g(xm)] in Fp[x1,...,xm], f=S3 orS4. Freeze generator order as written, direct sparse PolyRing construction, explicit groebnertools.groebner(method=buchberger), grevlex. Preserve pinned reduction/pair-selection code and record input/basis hash plus deterministic event traces at admission.'
    solve_and_certify: >-
      After Gröbner construction, enumerate every V^m tuple in lexicographic
      order. Evaluate f and all ideal generators by deterministic monomial
      summation: accumulatorZERO; for each canonical monomial initialize
      term=coefficient, then for variablei in ascending order compute
      POW(value_i,exponent_i) and MUL it into term, including exponentzero;
      ADD term into the accumulator. No cache or omitted zero/one operations.
      For EC f=0 tuples, enumerate all2^m sign choices lexicographically(-,+),
      independently check the affine sum againstQ, and retain the first valid
      decomposition certificate while continuing enumeration to completion.
      Record all tuple/sign checks and valid solutions; no early timing stop
      on a favorable solution. An exhaustive absence is finite NO_RELATION,
      not a general negative result. Gröbner basis is separately checked by
      independent reduction of generators and Buchberger pairs, with every
      basis element's producer derivation checked for ideal inclusion.
    groebner_derivation_DAG: >-
      Add external immutable provenance nodes without changing pair choice,
      polynomial ordering or mathematical reductions. INPUT(i) names the
      ith sealed generator. SUB/ADD, SCALE(c) and MUL_MONOM(exponents)
      nodes record parent IDs and exact canonical operands. For every rem
      call record each actual quotient term and reducer identity, then form
      a DAG for input minus the ordered sum of quotient-monomial-scaled
      reducers; do not claim individual irreducible remainder terms are in
      the ideal. Monic normalization adds SCALE(1/lc), with the existing
      zero/one skips preserved. S-polynomial nodes use its two shifted monic
      parents and SUB. Final basis nodes point to these derivations. Both
      modes execute the same provenance generation and hashing; counter sink
      alone differs. Record all extra arithmetic and certificate costs.
    independent_DAG_checker: >-
      Separate author reparses generator/dag bytes, enforces topological
      parent IDs and allowed ideal-preserving operations, evaluates every
      node in its own sparse polynomial arithmetic and compares canonical
      polynomial hashes/bytes. Check each final basis node matches the
      published basis, each original generator reduces to zero by that basis,
      and every Buchberger pair reduces to zero. Division chooses the least
      basis index whose leading monomial divides the current leading term;
      otherwise moves that leading term to the remainder, repeating until
      zero. Monomials use the fixed grevlex order. All field/certificate work
      is charged in the independent-verifier vector. Stock Buchberger does
      not already emit this DAG; it is a declared source-preserving algorithm
      adaptation requiring independent protocol and later implementation review.
    curve_free: >-
      Use exactly the EC f's nonzero monomial support and degrees. Replace
      every nonzero coefficient independently by1+uniform_draw(p-1), using
      null-coefficient domain and canonical monomial index; retain the same
      g constraints, variables, solver and public V. No resampling if a
      coefficient coincides or a null accidentally equals f. Check exact
      support/degree/variable/sparsity match. Enumerate all V^m null roots
      and independently verify them; no elliptic relation is attributed to
      a null root, and no EC-only sign enumeration is fabricated as null work.
    parity_limit: EC/null share solver/support constraints but semantic verification differs and is charged separately. Report Gröbner-stage matched comparisons and full-workflow differences without claiming uniquely isolated EC causality.
  calibration:
    multipliers: [1, 2, 4, 8, 16]
    input: For each sealed fixture and program draw canonical nonzero operands with its work_seed and named calibration domain; loops use ascending indices. Identical inputs across all modes/loads/repeats. All outputs are independently checked and consumed by a hash sink.
    programs:
      - id: schoolbook
        definition: For each ofu repetitions, multiply two degree7 polynomials as8by8 nested coefficient loops, accumulate into15 initialized-zero slots with one MUL and one ADD for every pair. Do not skip zero intermediate values.
        expected: '{M:64*u,S:0,I:0,A:64*u}'
      - id: square
        definition: 64*u direct SQUARE calls on the sealed nonzero operand stream.
        expected: '{M:0,S:64*u,I:0,A:0}'
      - id: inverse
        definition: 8*u direct INV calls on sealed nonzero operands.
        expected: '{M:0,S:0,I:8*u,A:0}'
      - id: add
        definition: 64*u ADD calls on sealed operand pairs.
        expected: '{M:0,S:0,I:0,A:64*u}'
      - id: division_neg_power
        definition: Repeatu times DIV(a,b),NEG(a),SUB(a,b),POW(a,13),POW(a,-3), in that order on sealed nonzero a,b; consume all results.
        expected: '{M:6*u,S:4*u,I:2*u,A:2*u}'
    oracle: Independent author derives the count table from these loop/program statements only, blind to producer source/counters/report. Independent integer modular arithmetic checks values. No expected count is learned from an observed trace.
    faults: >-
      For every program apply four synthetic event-log mutations separately:
      remove its first present event, duplicate it, relabel it to the next
      type in cycleM,S,I,A and corrupt an output residue by+1 modp. Each
      must be rejected by exact count/output checking. These mutate copied
      logs only, never production counters or records.
  baselines:
    public_problem: Same fixture curve,P,Q,ell and workload seed family; no access to planted k, no quotient shortcuts. Baselines are measured in both modes/all loads and independently verify the recoveredkP=Q.
    BSGS: >-
      w=ceil(sqrt(ell)); build baby[j]=jP forj=0..w-1 in ascending order,
      retaining leastj for duplicate encodings. ComputeT=[w]P once, then
      gamma=Q. Fori=0..w inclusive, ifgamma matchesbaby[j], formk=(i*w+j) modell
      and independently verifykP=Q, stop on first verified result; otherwise
      gamma=gamma-T. Hash tables compare full canonical point bytes after
      hash collisions. Charge table/lookup/encoding/construction/verification.
    rho: >-
      Deterministic Floyd three-partition walk, no negation quotient.
      X=aP+bQ; partition SHA256(str(SDEG-rho-partition)||work_seed||encoding(X))
      reduced to0..2 by rejection with appendedu64 counter. Branch0 addsP
      and incrementsa; branch1 doublesX,a,b; branch2 addsQ and incrementsb,
      scalar coefficients moduloell with a separately typed F_ell vector.
      Each restart draws a,b uniformly fromF_ell in rho-start domain with
      restart index. Set tortoise=F(start),hare=F(F(start)); compare, then
      advance tortoise once/hare twice until collision. Recoverk=(a-c)/(d-b)
      modell from equal points when denominator nonzero and verifykP=Q.
      A zero denominator or failed candidate is recorded and starts the next
      restart; a failed independently checked candidate is an implementation
      defect. Limit each restart to2*ell comparison rounds, retain all work;
      at most64 restarts per sealed baseline component, then report finite
      NO_RELATION_WITHIN_BUDGET with its declared search bound, not global failure.
    comparison: Full baseline resource vectors and certificates are mandatory controls; no claim the chosen implementations are optimal, no universal random-map or asymptotic scaling validation. Failed/incomplete baselines block corresponding comparative claims but do not erase other data.
  schedule:
    instance_groups: 200 sealed(cell,j) groups, each with8 logical jobs from4 loads by2 modes; total1600 logical measurement attempts.
    modes: timing,counting; each executes in a separate fresh worker process. No in-process mode switch or result/cache reuse. One supervisor orchestrates one job at a time.
    loads: [0, 1, 2, 4]
    order: Cells in panel order,j ascending; rotate the load list left byj mod4; COUNTING then TIMING at each load, so exact same-input calibrator evidence is available before the timing root. Disclose fixed mode-order as a possible temporal confounder. Each job runs25 calibrators in program order then multiplier order, then the planted-positive control, thenEC/curve-free in that order for evenj and reverse for oddj, thenrho/BSGS for evenj and reverse for oddj.
    components_per_job: 25 calibrators plus1 planted-positive EC decomposition plus2 main EC/curve-free decompositions plus2 baselines equals30; total48000 measured components, comprising40000 calibrators,1600 planted-positive decompositions,3200 main decompositions and3200 baselines.
    warmup: One complete warmup of every component followed by one measured evaluation, same input/workseed, fresh component state and disabled SymPy cache. Warmup costs and outputs are retained separately, never treated as independent instances; total48000 warmup component evaluations.
    timing_profile_audits: Every one of the800timing jobs additionally executes one fresh-state profiled/count-disabled evaluation of each30components,24000 profiled audit components total. Primary TIMING evaluations are unprofiled and count-disabled; warmups also unprofiled. After warmup, primary precedes profile for evenj and profile precedes primary for oddj. Both use sequential producer/verifier workers and identical sealed inputs. Retain actual order and profiled/unprofiled perturbation without pretending an unbiased overhead correction. Total component evaluations are120000=48000warmup+48000primary+24000profile, apart from declared admission/conservation/fault checks.
    process_restart: Each component uses a fresh producer worker which exits, followed by a fresh independent-code verifier worker reading only serialized public inputs/results/certificates; they never overlap. Supervisor and required burners persist. Both phases pin to the same worker core and obey the selected timing/counting mode. Startup/serialization costs are charged setup/boundary, inner stage and full-process clocks retained. Independence of verifier author/source is required; this topology itself is not an independent scientific-review session.
    calibration_faults: On the measured u=1 log of each of the five programs in every job, execute the four copied-log mutations in calibration.faults,20 fault checks/job and32000 total. Timing jobs use the sealed paired counting logs as explicitly stated below. All25 exact calibration gates/job must pass before decomposition/baseline execution.
    observed_count_boundary: Counting roots emit actual count traces. Timing roots emit no producer counts; their exact count/fault gate rechecks the hash-bound earlier paired counting-root logs and independently checks current calibration outputs/input/algorithm bindings before proceeding. Report timing counts as not_recorded, never as observed oracle counts. Rechecking copied logs is an audit, not a new independent count measurement.
    execution_gate_order: Run calibrators/faults first and stop the current job on the first exact failure BEFORE any planted/main decomposition or baseline executes. Then run the planted-positive component and require success before main components. Record omitted components explicitly. For every remaining sealed root after a global instrument failure, activate a real start-and-abort administrative attempt, record actual startup/check/receipt costs and terminal IMPLEMENTATION_FAILURE with causal root reference, no scientific components. These roots are never falsely NOT_ACTIVATED; only the synthetic conditional retry uses that code. Preserve one final receipt per sealed root and all shared prior costs.
    planted_positive: At every fixture/load/mode, run the full same family solver/enumeration/verifier with targetR_plant=[m]T and known tuple(T,...,T), before main EC/null work. Require the known tuple to occur among validated solutions; independent group/polynomial/ideal certificates check it. Main20random instances are unchanged. This control exercises actual S3 and S4 solvers, not just conservation rows; its certificate is retained separately and does not add to main random-target R_gain.
    conservation_controls: Nine fixed synthetic conservation cases before any measurement job and the same nine at final aggregation;18 case evaluations total, on the separate seven-point control fixture. They are not added to main size/slope samples.
    roots_and_retries: All1600 measurement nodes are sealed roots with retry_parent_id null and empty activation codes. No retry nodes or extra samples are added after sealing. Checkpoint segments resume the same attempt identity; bounded rho restarts are internal algorithm steps, not new scheduled attempts. A positive/control failure follows the explicit start-and-abort root receipt policy, not synthetic NOT_ACTIVATED semantics.
    sealing: Materialize and independently verify the full fixture/column/workseed manifests and deterministic schedule before measurements. Distinct unique attempt seeds and ordinal order are checked; physical job order defines contiguous ordinals separately within each fixture conservation campaign.
    imported_schedule_values: Each fixture campaign uses the imported contract_schema/version, its public fixture and ell field/column schema, canonical row/terminal/resource vocabularies, initial_matrix empty and probability_plan finite_tail_gate_active false with no probability_cohort claim. Each root worker_slot is measurement_worker, stage_id relation_collection with the full separately itemized stage vector; ordinal0..7 follows rotated load and counting-before-timing order. probability_cohort_member false, statistical_stratum_id=cell/arm-independent-job/load/mode. Budgets declare the fixed component/search bounds, memory protection and null time/CPU estimates. Complete all literal required imported fields before sealing; precommit snapshot/verifier values are actual admission outputs, not schema omissions or tunable choices.
  certificates_and_rows:
    campaigns: One local conservation campaign per(cell,j), campaign_id=EXP-ECDLP-ac7e8b/cell_id/j formatted with j as two decimal digits. These are finite local campaign keys, not newly minted ledger record IDs. Each campaign has one subgroup field F_ell and its eight ordered jobs; never combine distinct subgroup moduli into one rank calculation.
    columns: >-
      Collect all positive/negative factor-base points, Q and R_plant; deduplicate
      identical canonical point encodings, sort by raw encoding bytes and
      assignASCII C000,C001,... in that order. Q reuses its existing column
      if equal to a factor-base point, otherwise gets its unique sorted
      column. Signed summands refer to actual signed point columns, not
      undocumented negative multiplicities. Verify every named point has
      ell*point=O and every ID/encoding is unique and schema-hash bound.
    target_and_statement: Decomposition certificate includes the imported fixture hash, curve parameters, actual target column/encoding, ordered summand column IDs/encodings, statement hash and producer certificate hash. Independent verifier reparses the public fixture, checks exact columns and points, sums signed summands and derives the row independently.
    row: Multiplicity of each summand column minusone in the target column moduloell, canonical unsigned residues; widthceil(bitlen(ell-1)/8), unsigned big-endian concatenation in column order. Use literal row/equation hash domain tags and raw schema/statement hashes from the imported contract; do not invent new hash syntax.
    initial_matrix: Empty per fixture campaign. Independently eliminate accepted rows in sealed ordinal order using leftmost nonzero pivot, normalize by pivot inversion and eliminate all other rows in ascending row index overF_ell. Duplicate rows can add zero rank; record R_gain per attempt and campaign.
    relation_scope: Only a verified EC decomposition contributes a relation row. Null roots and recovered baseline logarithms have their own certificates/results and zero relation-rank contribution. Invalid certificates/declared rows give RELATION_INVALID and zero rank while retaining all costs.
    resource_per_rank: Keep every resource coordinate and zero-rank infinity/undefined convention. No scalar C_decomp and no conversion to ceil(r/p_L); finite_tail_gate_active=false and no IID success theorem claimed.
    verification_counts: Independent verifier uses separately authored finite-field arithmetic with the same explicitM/S/I/A definitions, logs Fp membership/sum/polynomial-check events separately from F_ell row/rank events, and records its integer/parser/hash costs. Full-workflow costs never pair total wall time with an unlabeled producer-only count vector.
  conservation_controls:
    fixture: >-
      Separate prospective control curve overF5:y^2=x^3+2*x+1,ell=7,
      named columnsP=(0,1),2P=(1,3),4P=(3,2). Publicly declare all7points
      by the six affine lifts atx=0,1,3 plusO. The independent checker must
      derive/check point count, subgroup, doubles, columns and certificates;
      these stated values are preregistered expectations, not executed proof.
    clean_relations: '2P=P+P;4P=2P+2P;P=4P+4P. Expected canonicalF7 rows[[2,6,0],[0,2,6],[6,0,2]], rank2; reduction of these canonical entries modulo2 has rank0. Independently derive from legal length2 group certificates before accepting this control.'
    clean_schedule: Three active root attempts with those ordered legal certificates and one inactive predeclared retry of the first root, activated only on RELATION_INVALID. Unique domain-derived seed/id/ordinals; clean retry is NOT_ACTIVATED with zero own resources. Give each active root one unit of declared synthetic CPU and one correctly owned shared-work object with exact one-third attribution; all fields obey imported contract.
    cases:
      - {id: clean, mutation: None, expected: PASS_ONLY_IF_ALL_CONSERVATION_GATES_PASS}
      - {id: omission, mutation: Remove the second root receipt only, expected: BIJECTION_MISSING_RECEIPT}
      - {id: duplicate, mutation: Copy the first root receipt with the same attempt ID, expected: BIJECTION_DUPLICATE_ID}
      - {id: cycle, mutation: Set first and second root retry_parent_id to each other in a copied schedule, expected: SCHEDULE_RETRY_CYCLE}
      - {id: field_schema, mutation: Change declared row field modulus7 to5 without changing fixture/schema bindings, expected: FIELD_OR_SCHEMA_MISMATCH}
      - {id: double_owner, mutation: Assign the same shared-work ID to two owners with two vectors, expected: SHARED_WORK_DOUBLE_COUNT}
      - {id: unowned, mutation: Remove the shared object's owner while leaving its references, expected: SHARED_WORK_UNOWNED}
      - {id: wrong_row, mutation: Keep first valid group certificate but replace its declared row with zeros, expected: CERTIFICATE_ROW_MISMATCH_AND_ZERO_RANK}
      - {id: wrong_prime_rank, mutation: Keep canonical F7 rows/metadata but report producer rank0 calculated overF2, expected: INDEPENDENT_RANK_MISMATCH}
    isolation: Mutations apply individually to copied control data. No production records are edited. The correct-rank oracle is independently derived from the legal certificates, not a metadata-only wrong-modulus test.
  resources:
    stage_map:
      setup: Fixture/prime/order/factorization/factor-base/column/schedule generation, code/domain initialization, equation/resultant/constraint construction and private worker startup; separately identify shared versus per-component work.
      relation_collection: Gröbner computation, basis diagnostics, complete tuple/sign enumeration and the actual producer relation construction. Record Gröbner-only and enumeration substages separately.
      linear_algebra: Independent relation-row rank and conservation checking overF_ell, separately from Gröbner reductions already assigned to relation_collection.
      descent: No recursive descent is implemented in this diagnostic; report explicit NA with rationale. Baseline rho/BSGS solves are labeled baseline components, not relabeled descent or omitted overhead.
      verification: Independent polynomial/group/baseline/certificate/control parsing and semantic checks and report validation; independent typed vectors and costs retained. Relation-row Gaussian/rank arithmetic and its conservation-rank check belong exclusively to linear_algebra, with references here but no recounted cost.
    vector: Preserve all imported additive CPU/group-operation/IO/communication coordinates and nonadditive wall intervals, memory domains, campaign peak and retained unique objects. Extend vocabulary with field_fp_producer_M/S/I/A,field_fp_verifier_M/S/I/A,field_ell_rank_M/S/I/A and explicit boundary counters; preserve group add,dbl,mixed_add,scalar_mul_fixed_window,endomorphism_apply,equality_test,encode_decode,polynomial_mul_mod_p,polynomial_reduce_mod_p,groebner_spoly_step with actual usage or justified zero/NA.
    ownership: Every exclusive operation has one owner. Shared fixture/setup work has one independently receipted owner per fixture and exact attribution1/8 to its eight scheduled jobs for reported allocation; raw conservation sums count that vector once, never again through references. If jobs are unactivated, retain setup cost at its actual owner and report unallocated share rather than inventing their own work. Each attribution set including explicit unallocated share sums exactly1.
    bytes: Retained objects have one content hash, size and owner; references do not recount bytes. Merge actual active wall intervals by union and measure aggregate memory peak; never sum process or campaign peaks as simultaneous memory.
    load_cost: Burner/supervisor CPU and memory are environmental-control overhead, separately labeled and included in total campaign costs; do not insert burner arithmetic into solverFp counts or pretend it is free.
    timing_scope: Report paired stage wall/CPU and W on identical stages; primary slopes use measured relation_collection plus its independent verification, with bothFp vectors labeled and summed only under the stated common weights. Also publish producer-only/Gröbner-only views and fullworkflow resources including allocated setup, baseline and controls, explicitly labeled; no partial-operation vector is called complete fullpipeline arithmetic.
    boundary_fraction: >-
      Use only the separately declared profiled TIMING audit with counters
      disabled. The original exclusion observable is
      library_boundary_ns/audited_stage_ns: exclusive time with an active
      frame in the hash-pinned SymPy package or declared sdeg_counter
      producer_polynomials,verifier_polynomials,producer_group,verifier_group
      modules, excluding primitive kernel spans. Assign nested time once
      with priority field_kernel,then library_boundary,then other; integer/C
      calls inherit the nearest classified caller. Publish source/module/function
      classification and any unclassified-span defect. Library bookkeeping
      outside hooks is not missing-arithmetic evidence. Report total
      outside_field_ns/audited_stage_ns separately. Primary timing/count slopes
      use the UNPROFILED primary TIMING evaluation and paired COUNTING W,
      never profiled time or warmup. Publish paired profiling perturbation
      and order; no assumed subtraction.
  statistics:
    median_rule: Sort the complete finite values ascending; odd count takes the middle, even count the exact arithmetic mean of the two middle values. Keep rational medians exact until logarithm evaluation; never choose lower-median implicitly.
    cells: For each family,arm(EC/curve-free),load and mode separately, retain20 instances per size. Mode-paired values share exact fixture/workseed. Calibration and baseline panels have separate summaries and never replace decomposition samples.
    x_coordinate: log(p) per actual fixture; size-cell x is median log(p) over its20 paired retained instances. y_time=log(median primary-stage timing-mode wall_ns); y_ops=log(median counting-mode W) for the matching complete instances.
    local_slopes: >-
      Adjacent retained size cells within the same S3/S4 family: difference
      of y divided by difference of median logp. Never pool S3 and S4.
      Report all adjacent slopes; nonpositive time/W, equal x or missing
      paired samples makes that slope undefined.
    eligibility: For each family/arm/load/size, exclude the size from primary slope inference if the median of20 per-instance boundary fractions exceeds0.5; retain all raw rows and excluded summary. Require all20 complete valid paired instances and at leastfour eligible sizes for that family/arm/load scaling inference. Missing/censored rows are not replaced and not survivor-only medians.
    delta: Local timing slope minus local W slope, same retained paired data. Agreement if estimate and entire paired bootstrap interval lie in[-0.05,0.05]; disagreement if both strictly above0.05 or both strictly below-0.05; otherwise inconclusive. Disjoint marginal intervals remain diagnostics, not a conflicting primary label.
    bootstrap: >-
      Exactly2000 shared paired resamples. For each family and cell choose20
      indices with replacement from0..19 using sample withbootstrap_seed,
      domain=cell_id, index=20*r+draw forr=0..1999,draw=0..19. Use identical
      indices for timing/counting, loads, EC/null and corresponding baselines.
      Freeze original complete-size eligibility for primary intervals and
      report boundary-threshold crossing frequency as sensitivity. Recompute
      medians,x coordinates,local slopes and paired deltas. Sort finite
      results; endpoints are one-based50th and1950th of2000, no interpolation.
      Any undefined resample for a primary statistic makes its interval
      undefined with all reasons retained, not a trimmed interval.
    load_targets: Counting vectors must be bit-identical across all four loads for the same component/input; exact calibration failures invalidate the instrument. Timing medians across0,1,2,4 are predicted nondecreasing and highest/zero-load>=1.5, separately for each size/arm/program. Valid target failure is descriptive negative, not automatic infrastructure failure.
    drift_target: At load0, the sequence of median per-instance primary timing/W ratios must be either nondecreasing OR nonincreasing across sizes, with max/min>2, in each family/arm. No direction is chosen from a one-sided hypothesis; this preserves the original sign-unspecified monotone-drift target. Report the observed direction and all values separately from slope agreement; no unique machine/EC causality or asymptotic transfer follows.
  runtime:
    admission_host: Actual admitted Linux host with at leastsix physical cores, verified topology, sched_setaffinity and delegated cgroup-v2 memory protection. Current parent macOS capability is not assumed to satisfy this.
    affinity: Choose the six lowest-numbered distinct physical cores available in the admitted affinity mask, recordIDs/topology. Worker and every burner pin to the first core to create matched-core contention; supervisor pins to the second, remaining four reserved from other experiment work. SMT siblings are not counted as distinct cores.
    burners: For each load launch0/1/2/4 single-threaded native unsigned64 LCG busy loops x=6364136223846793005*x+1442695040888963407 modulo2^64, seed lane+1, with no sleeps; bounded private memory<=1MiB each. Publish source/compiler/hash; wait for ready barrier then2 seconds of steady load before warmup, record actualCPU/time and stop after measured component group.
    processes: Supervisor plus one worker plus at mostfour burners gives maximum6; no extra threads, children or overlapping workers. Allocation of six physical cores is headroom, not a claim all burners use separate cores.
    guards: cgroup memory.max=8*2^30,memory.swap.max=0,pids.max=6; verify readback and actual descendant membership. CPU/time research estimates null; no CPU cap. Record memory.peak/events,cpu.stat,worker peakRSS and full elapsed spans. Missing guard/affinity refuses admission.
    watchdog: 3600-second process wall checkpoint interval with at most5 seconds cleanup, explicitly machine protection. Write exclusive segment launch.json before setup, stdout/stderr and segment receipt on catchable exit. Checkpoint sealed attempt state/counters/outputs; resume the same root with new immutable segments and identical algorithms/seeds. Uncatchable death without durable state is retained infrastructure/implementation failure, never silent restart from favorable data.
    terminal_mapping: A checkpoint segment is nonterminal and emits no imported final receipt. Exactly one final receipt is emitted when the sealed attempt finishes or receives explicit terminal disposition. If an actual final TIMEOUT_CENSORED is deliberately declared, retain the imported cancelled_by_budget lifecycle mapping as historical interface metadata but annotate machine_checkpoint_origin and no campaign budget exhaustion; never infer a cancelled goal. NO_RELATION_WITHIN_BUDGET means the frozen exhaustive/algorithmic search bound, not CPU budget.
    proposed_degree_amendment: The successor explicitly sets maximum_groebner_degree_cap=null, replacing the governing default32 for this experiment because initial factor-base generators already have degrees48/64/80. This is a prospective scientific/censoring amendment requiring the same independent protocol review and Coordinator approval, not a historical rewrite. Aggregate8GiB and honest memory censoring remain; the separate32bit tier boundary is unchanged.
  outputs:
    admission_files: [manifest.yaml,source-bindings.json,fixture-manifest.jsonl,rejected-candidates.jsonl,fixture-certificates.jsonl,column-schemas.jsonl,work-seeds.jsonl,sealed-schedules.jsonl,precommit.json,verifier-admission.json,runtime-admission.json,control-results.jsonl,shared-work.jsonl,artifact-sha256.json]
    per_job_files: [manifest.yaml,schedule-node.json,receipt.json,component-results.jsonl,calibration-results.jsonl,fault-controls.jsonl,typed-counts.jsonl,stage-resources.jsonl,boundary-profile.jsonl,groebner-certificates.jsonl,decomposition-certificates.jsonl,null-roots.jsonl,baseline-certificates.jsonl,independent-checks.jsonl,rank-results.jsonl,shared-work-refs.jsonl,checkpoint-index.json,artifact-sha256.json,execution-report.yaml]
    per_segment_files: [launch.json,receipt.json,command.txt,environment.json,stdout.log,stderr.log,checkpoint.json,artifact-sha256.json]
    summary_files: [manifest.yaml,job-bindings.json,conservation-results.jsonl,rank-by-fixture.jsonl,paired-slopes.jsonl,bootstrap-indices.jsonl,bootstrap-summary.json,load-and-drift.jsonl,exclusions.jsonl,full-resource-vector.json,readiness-residuals.json,artifact-sha256.json,execution-report.yaml]
    roots: Later execution handoffs allocate and own exact admission/<plan-id>,runs/<run-id>,runs/<run-id>/segments/<segment-id>,summary/<plan-id> under experiments/EXP-ECDLP-ac7e8b. No dynamic per-coefficient file fragmentation; aggregate rows retain every declared component and control.
    canonicalization: Imported certificate/schedule/receipt JCS uses decimal strings for all integer values and exact literal contract hash domains. Binary row encodings remain as imported. Other tables declare schema/version and exact integer/string/rational encoding before sealing; fractions numerator/denominator decimal strings, finite decimals for clocks never needed.
    hash_graph: Hash manifests exclude their own entries and are externally bound by Coordinator snapshot receipts. Reports reference a hashing manifest by path only if that manifest hashes the report. No self/circular hash or invented precommit/verifier/runtime value.
    table_schema:
      schema_version: sdeg_counter_tables_v1
      common_row_keys: [experiment_id,campaign_id,attempt_id,segment_id,cell_id,instance_index,master,replica,load,mode,component,phase,stage,ordinal,status,reason,input_sha256,source_sha256]
      common_types: All IDs/keys/digests are strings, integer quantities decimal strings, modes timing/counting, phases warmup/primary/profile/admission, status complete/omitted/invalid/censored/not_applicable. Null is permitted only with explicit reason. Content digests are lowercase64hex; table ordering is sealed job/component/phase then localordinal.
      typed_count_payload: 'field_tag in producer_Fp/verifier_Fp/rank_Fell; modulus_decimal; M,S,I,A decimal-string counts or null with not_recorded reason in timing/profile; event_digest and callsite_coverage_digest strings. Never serialize predicted counts as measured counts.'
      stage_resource_payload: Imported exact resource schema and ownership keys plus nonoverlapping phase/stage interval lists, typed-vector references, unique shared/retained object references and explicit burner/supervisor domains.
      profile_payload: 'audit_stage_ns,kernel_ns,library_boundary_ns,other_ns as decimal strings; exact rational fractions {numerator,denominator}; classification source hash, perturbation pair reference and chronological order. No counting-mode substitution.'
      component_payload: Exact input/output hashes, canonical output reference, algorithm/method/domain bindings, start/finishns, all check statuses and omission/censor reason. Tuple/root arrays encode coordinate residues as decimal strings in fixed variable order; sign arrays use literal -/+ strings.
      certificate_payload: Imported decomposition/group/row contract for relations; baseline k plus independently checked kP=Q statement; polynomial DAG/Bareiss nodes topological with explicit node_kind,parent_IDs,monomial exponent strings,canonical coefficients and polynomial hashes. No opaque unsupported certificate kind.
      statistical_payload: Exact sample/size IDs, scalar/log values serialized as roundtrip binary64 hex with source numeric version, rational count quantities exact, interval endpoints and bootstrap-index references. Undefined/nonpositive/insufficient-size values are null with declared reason; do not omit their rows.
      numeric_pin: Render approximations with CPython3.13.1 math.log and record actual libm/platform binding, but determine final threshold categories with the exact rational log-interval procedure below at64,128,256,512bits. If a category is not established by512bits, report inconclusive; no epsilon or platform rounding decides an equality.
    log_interval_procedure: For positive rationalx, write x=2^k*m with exact integerk and1<=m<2. Setz=(m-1)/(m+1); boundlog(m) by2*sum_{i=0..n-1}z^(2i+1)/(2i+1) and that sum plus2*z^(2n+1)/((2n+1)*(1-z^2)). Boundlog2 withz=1/3. Increase n until combined width, including |k| timeslog2 width, is<=2^(-precision). Use exact rational outward interval addition/subtraction/multiplication/division, refusing denominator intervals containingzero. Enclose order statistics by sorting interval lower endpoints and upper endpoints separately at the frozen ranks; refine all ambiguous comparisons together. This is a prospective algorithm/bound for independent review, not an executed numerical certificate.
  adapter_admission_matrix:
    scope: Future implementation-admission checks AFTER independent protocol review and permitted implementation, before main measurements. Separate from1600main roots and main slope samples;19cases, each in counting and timing mode,38evaluations. Fixp=131 andringFp[X], construct inputs before resetting event counters, then evaluate only the named operation. Independent reviewer derives all expected traces from definitions/source, not producer results.
    cases:
      - {id: quo, operation: 'domain.quo(6,3)', expected_vector: 'M1 S0 I1 A0', value: '2'}
      - {id: exquo, operation: 'domain.exquo(6,3)', expected_vector: 'M1 S0 I1 A0', value: '2'}
