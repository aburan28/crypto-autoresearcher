review_plan:
  claim_under_review: >-
    Each frozen producer packet is an explicit EndRing-based PKE candidate with
    a defined functionality mechanism and accurately scoped security dependency.
  coordinator_prior: >-
    Expect both candidates to remain candidates rather than constructions. At
    least one is likely to break at O4 recipient-only functionality or O5
    reduction direction; a well-specified intermediate assumption would still
    be useful progress.
  joints:
    - joint: "J1 / O1: exact hard problem, distributions, representations, setup, and conversion interfaces"
      assigned_to: TASK-20261007-bc6c0f
      attack_plan: "Compare every real public-key field with the claimed EndRing challenge sampler; mark any unembedded auxiliary datum or representation conversion."
      breaking_artifact: "A typed public-key field or distribution with no simulator/compiler from the stated EndRing challenge."
    - joint: "J2 / O2-O3: complete honest algorithms and actual selected-message correctness"
      assigned_to: TASK-20261007-bc6c0f
      attack_plan: "Derive Dec(sk,Enc(pk,m;r)) from each contract only; substitute wrong keys, exceptional keys, and two messages sharing any endpoint/orbit observation."
      breaking_artifact: "An undefined subroutine, ill-typed call, or admissible pair m0 != m1 with identical decryption observation."
    - joint: "J3 / O4: public sender operation versus efficient secret-dependent recipient operation"
      assigned_to: TASK-20261007-385334
      attack_plan: "Run the claimed private recovery from identical public data, charge enumeration, and compare against the prior SecretLift/EndpointLift/Complete_2 failures."
      breaking_artifact: "A public recovery algorithm, a constant/message-independent invariant, or a missing lift exposed as an oracle."
    - joint: "J4 / O5: correctly directed reduction for the exact game"
      assigned_to: TASK-20261007-385334
      attack_plan: "Start from an EndRing challenge and attempt to embed it as a real public key while simulating every oracle; reject the forward EndRing-solver attack as a security reduction."
      breaking_artifact: "A failed challenge embedding, unsimulated oracle, superpolynomial loss, or separately necessary assumption with no reduction to EndRing."
    - joint: "J5 / O6: complete adversarial view, malformed inputs, repeated use, alternate encodings, and prior-art delta"
      assigned_to: TASK-20261007-385334
      attack_plan: "List all disclosed curves/torsion/hints/bases/responses; mutate encodings and ciphertexts; normalize syntax against Seta, SiGamal/C-SiGamal, LIT-SiGamal, and supersingular UPKE."
      breaking_artifact: "An uncovered disclosure/oracle, challenge-equivalent alternate encoding, decryption side channel in scope, or exact prior construction match."
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
      - "Leaked-plaintext control PKE: Enc(pk,m)=(m,r), Dec returns first component; confidentiality is known false."
      - "Public-recovery control: the alleged private operation is copied into the public key; recipient asymmetry is known false."
    failure_signature: "The O4/O5 argument must fail at confidentiality or challenge simulation; if it still proves security, it proves too much."
    assigned_to: TASK-20261007-385334
  blind_rederivation:
    required: true
    quantity: "For each candidate contract, whether the stated algebraic invariant implies recovery of the actual selected message for every admitted valid key/message and declared coins."
    parameters: "Exactly the domains, algorithms, exceptional cases, and probability spaces in the two scheme-contract.yaml files."
    blind_from:
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/candidate.md
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/proof-search-map.yaml
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-61f3bc/candidate.md
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-61f3bc/proof-search-map.yaml
    assigned_to: TASK-20261007-bc6c0f
  procedure_deviations: []
