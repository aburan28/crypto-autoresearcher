review_plan:
  claim_under_review: >-
    The gap-fed revised packet repairs the exact selected gap without weakening
    the primitive/security game or moving it into an unstated assumption.
  coordinator_prior: >-
    Expect a useful narrowing but not a complete construction; the most likely
    failure is relocation of the same missing recipient lift or EndRing
    challenge-embedding gap.
  joints:
    - joint: "R1: selected gap is actually discharged under the unchanged contract"
      assigned_to: TASK-20261007-b6c1ec
      attack_plan: "Replay the initial counterexample and compare the exact before/after interface and quantifiers."
      breaking_artifact: "The original counterexample still applies or the revised domain silently excludes it."
    - joint: "R2: O1-O3 syntax and actual-message correctness"
      assigned_to: TASK-20261007-b6c1ec
      attack_plan: "Type-check all algorithms and derive the round trip on admitted keys, messages, coins, and failure paths."
      breaking_artifact: "Undefined subroutine, ill-typed call, or collision yielding the same decryption observation for different messages."
    - joint: "R3: O4-O6 functionality, reduction direction, and complete view"
      assigned_to: TASK-20261007-b6c1ec
      attack_plan: "Run public-data and leaked-plaintext controls, embed the exact EndRing challenge, and mutate ciphertext encodings."
      breaking_artifact: "Public recovery, missing embedding/oracle simulation, hidden intermediate assumption, or uncovered adversarial input."
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
      - "Leaked-plaintext control PKE."
      - "Public-recovery control with recipient operation in pk."
    failure_signature: "Any unchanged proof of confidentiality/security is invalid."
    assigned_to: TASK-20261007-b6c1ec
  blind_rederivation:
    required: false
    quantity: null
    parameters: null
    blind_from: []
    assigned_to: null
  procedure_deviations: []
