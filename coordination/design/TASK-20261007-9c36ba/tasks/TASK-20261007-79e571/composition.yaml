composition:
  schema: crypto.autoresearch.candidate_composition.v1
  task_id: TASK-20261007-79e571
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  batch_id: BATCH-65c2dd
  phase: initial_evaluation
  inputs:
    producer_tasks:
      - TASK-20261007-913665
      - TASK-20261007-61f3bc
    validator_report: coordination/design/TASK-20261007-9c36ba/reviews/TASK-20261007-bc6c0f/validation-report.yaml
    red_team_report: coordination/design/TASK-20261007-9c36ba/reviews/TASK-20261007-385334/red-team-report.yaml
    snapshot_commit: 0f0a92e25ed0a958044d80876cb11e7ed9f026f3
  composition_rule: >-
    Copy the verdict of the owner of each frozen joint. Do not average,
    majority-vote, repair a candidate inline, or turn survival of one joint
    into a security claim.
  joint_ownership:
    J1_O1: TASK-20261007-bc6c0f
    J2_O2_O3: TASK-20261007-bc6c0f
    J3_O4: TASK-20261007-385334
    J4_O5: TASK-20261007-385334
    J5_O6: TASK-20261007-385334
  candidates:
    CEST-PKE:
      producer_task: TASK-20261007-913665
      joint_verdicts:
        J1_O1: inconclusive
        J2_O2_O3: breaks
        J3_O4: inconclusive
        J4_O5: breaks
        J5_O6: inconclusive
      obligation_detail:
        O1: >-
          The auxiliary game names the full real view, but efficient sampling
          and a bridge from bare EndRing to A=psi_E(P) are absent.
        O2: >-
          TrapCurveGen, complete-ring verification, canonical selector
          normalization, evaluator bounds, and retry tails are unavailable.
        O3: >-
          Conditional on an accepted valid key, actual-message correctness
          holds by psi_E([r]P)=[r]psi_E(P).
        O4: >-
          Sender and recipient meet on one transfer point, but decryption
          factors through a single psi_E evaluator rather than a complete ring.
        O5: >-
          The only EndRing implication is solver-to-break. No real-distribution
          embedding or attacker-to-complete-ring extractor is supplied.
        O6: >-
          The scoped classical single-user IND-CPA view is substantially
          enumerated, while transfer hardness, parameters, and primary-source
          comparison remain unverified.
      disposition: gap_fed_revision_eligible
      reason: >-
        The algebraic receiver identity survives conditionally, so the
        completeness/extraction gap is decision-changing. The candidate is not
        secure, not an EndRing reduction, and not a finalist.
      narrowest_supported_statement: >-
        An explicit conditional hashed same-scalar-transfer PKE shell can use
        one endomorphism evaluator for decryption; complete EndRing necessity
        and EndRing-based confidentiality are not established.
    ER-McE:
      producer_task: TASK-20261007-61f3bc
      joint_verdicts:
        J1_O1: breaks
        J2_O2_O3: breaks
        J3_O4: breaks
        J4_O5: breaks
        J5_O6: breaks
      decisive_counterexample:
        name: chosen_pair_exact_weight_residual_test
        adversary: >-
          Given distinct m0,m1 and c=m_b G_pub+e, output the unique i for
          which wt(c-m_i G_pub)=t.
        proof: >-
          The true residual has weight t. If both residuals had weight t, the
          nonzero codeword (m0-m1)G_pub would have weight at most 2t,
          contradicting the declared distance at least 2t+1.
        success_probability: 1
        advantage: "1/2"
        evidence_kind: static_symbolic
      disposition: eliminated_exact_syntax
      reason: >-
        The public view perfectly distinguishes the two selected messages
        before any EndRing or code-decoding hardness question. Replacing the
        entire encryption transform would be a new mechanism, not a local
        repair.
      narrowest_supported_statement: >-
        A complete ring witness can seed a conditional Goppa decoder, but the
        stated raw exact-weight ciphertext is not IND-CPA.
  initial_result:
    finalists: []
    secure_pke_established: false
    endring_reduction_established: false
    novelty_established: false
    implementation_authorized: false
    experiments_run: 0
  selected_gap:
    id: GAP-CEST-COMPLETE-RING-EXTRACTION
    candidate: CEST-PKE
    selection_reason: >-
      This is the smallest gap that separates a merely EndRing-seeded transfer
      shell from a construction whose security is actually based on the
      complete EndRing problem. ER-McE's decisive IND-CPA break is preserved
      as a regression control but is not selected for local repair.
    packet: coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-79e571/gap-packet.yaml
  controls_preserved:
    - leaked_plaintext_known_false
    - public_recovery_known_false
    - distribution_bridge
    - actual_selected_message
    - wrong_key_and_malformed_ciphertext
    - prior_failure_regression
    - ER_McE_exact_weight_residual_test
  limitations:
    - No scientific, implementation, formalizer, benchmark, or parameter run occurred.
    - No candidate passed all five joints or all six construction obligations.
    - Candidate-specific breaks do not establish a universal EndRing-PKE impossibility.
