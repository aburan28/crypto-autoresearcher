gap_packet:
  schema: crypto.autoresearch.gap_packet.v1
  id: GAP-CEST-COMPLETE-RING-EXTRACTION
  task_id: TASK-20261007-79e571
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  batch_id: BATCH-65c2dd
  status: frozen_input_for_fresh_ideation
  selected_from: CEST-PKE
  narrow_surviving_mechanism:
    public_key_shape: >-
      A supersingular curve E, a prime-order torsion line generated by P, and a
      public point A=psi_E(P), where psi_E is selected from a secret complete
      evaluable basis of End(E).
    sender_operation: >-
      Sample r, set R=[r]P, compute S_snd=[r]A, and mask the selected message
      with a hash of the canonical public transcript and S_snd.
    recipient_operation: >-
      Use secret data to compute S_rec=psi_E(R) and unmask.
    conditional_identity: "psi_E([r]P)=[r]psi_E(P)=[r]A"
    direct_security_object: >-
      Same-scalar transfer or its hashed real-or-random game, not bare EndRing.
  decision_changing_gap:
    statement: >-
      Decryption uses only one evaluator for psi_E. Replacing the complete
      rank-four End(E) witness by that evaluator leaves every reachable
      decryption transcript unchanged. The public key A=psi_E(P) also cannot
      presently be sampled from a bare curve-only EndRing challenge without
      knowing the hidden action. Consequently no supplied black-box
      IND-attacker transcript identifies a complete evaluable End(E) basis.
    affected_obligations:
      - O1
      - O4
      - O5
    current_wrong_direction: >-
      complete EndRing solver -> derive psi_E -> compute transfer -> decrypt
    required_direction: >-
      IND-CPA attacker on the exact real distribution -> complete evaluable
      basis of End(E), with a quantified polynomial-time reduction
    exact_output_required: >-
      A rank-four evaluable Z-basis spanning exactly End(E), not one
      endomorphism, a torsion action, a transfer point, a code decoder, an
      endpoint, or an oracle for the selected quotient.
  revision_challenge:
    objective: >-
      Revise or replace the surviving mechanism so that complete EndRing
      information is both sufficient and demonstrably necessary for recipient
      functionality on the exact real public-key distribution, or return a
      scoped obstruction explaining why the supplied interface cannot do so.
    admissible_changes:
      - Replace the single-evaluator interface with a materially different mechanism.
      - Strengthen validation, encodings, and exceptional-case handling.
      - State a narrower auxiliary-data EndRing problem if every auxiliary field and the witness relation are explicit.
      - Return an obstruction packet if no honest correctly directed reduction can be formulated.
    forbidden_shortcuts:
      - Do not rename same-scalar transfer, CDH, a torsion action, or code decoding as EndRing.
      - Do not assume SecretLift, EndpointLift, C-star, evaluator reconstruction, or a missing map as an oracle.
      - Do not claim complete-ring necessity merely because KeyGen started from a complete witness.
      - Do not publish plaintext, the transfer secret, or a public recovery evaluator.
      - Do not weaken selected-message IND-CPA, change PKE into KEM without labeling it, or omit real-key auxiliary data.
      - Do not erase the original candidates or their failures.
  mandatory_outputs_for_revision:
    - Exact PKE or separately labeled KEM algorithms and canonical encodings.
    - Actual selected-message correctness with explicit quantifiers and failures.
    - O1-O6 table using open when an obligation is unavailable.
    - A real-distribution challenge-embedding diagram.
    - An attacker-to-complete-EndRing extraction map, or the exact failed arrow.
    - A quotient audit showing whether secret functionality factors through less than complete EndRing.
    - Complete adversarial view and all preserved controls.
  frozen_controls:
    leaked_plaintext_known_false: >-
      Append the message to the ciphertext. Any alleged reduction must fail at
      a named confidentiality or extraction step.
    public_recovery_known_false: >-
      Publish the alleged recipient operation. Any confidentiality argument
      must fail at the recipient-asymmetry step.
    distribution_bridge: >-
      Account for every real public-key field produced with the hidden witness;
      an auxiliary challenge may match the view but does not itself prove
      relation to bare EndRing.
    quotient_control: >-
      Replace the complete witness with the smallest evaluator or finite
      quotient that preserves decryption. If behavior is unchanged, complete
      EndRing necessity remains open.
    actual_message: >-
      Decapsulation of a key, recovery of an endpoint, or equality of an
      invariant does not by itself satisfy PKE selected-message correctness.
    prior_failure_regression:
      - C-star public or non-recipient evaluation
      - missing SecretLift or EndpointLift
      - target-frame or evaluator reconstruction
      - admission decoder or digit-loop tie rules
      - ER-McE exact-weight residual test
  acceptance_gate:
    accepted_revision_requires:
      - Every changed interface maps to this gap.
      - The security game is unchanged or explicitly strengthened.
      - No separate hardness assumption is hidden under the EndRing name.
      - Remaining gaps are explicit and no security or novelty claim is made.
    secure_scheme_gate: >-
      Out of scope for this ideation task. Passing this packet only produces a
      revised candidate for a fresh independent review.
  evidence_boundary:
    experiments_run: 0
    primary_sources_read_in_composition: 0
    security_established: false
    novelty_established: false
    universal_impossibility_established: false
