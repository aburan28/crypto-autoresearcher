format: proof-search-map/v1
task_id: TASK-20261007-913665
candidate: CEST-PKE
proposal_id: IDEA-20261007-560bcb
hypothesis_id: H-SSI-fbe68d
claim_boundary: >-
  This is a zero-run proof search map for a PKE candidate. It claims neither
  security nor novelty. Correctness is conditional on accepted keys and the
  declared interfaces; the correctly directed EndRing reduction is open.

object:
  tracked_object: >-
    The same-scalar transfer pair (R,S)=([r]P,[r]A), where A=psi_E(P) and
    psi_E is selected canonically from a complete evaluable End(E) witness.
  retained_information: "the q-torsion scalar relation shared across the public basis (P,A)"
  discarded_information: "r itself, the canonical endomorphism map, and the rest of the complete ring witness"
  operation_set:
    - "public scalar multiplication by the encryption nonce"
    - "private evaluation of the canonical endomorphism"
  classification: partial-action
  classification_reason: >-
    The sender propagates only from A using known r, while a ciphertext holder
    seeing R lacks r. The recipient propagates from R with psi_E. No lossy
    quotient is claimed to survive arbitrary group translation or isogeny
    composition.
  lossy_projection_audit: >-
    Functionality actually depends only on an evaluator for psi_E, not the
    complete ring W. This is deliberately recorded as a witness-quotient gap,
    not hidden as an EndRing theorem.

bottleneck: >-
  Convert a successful IND-CPA or scalar-transfer adversary into a solver that
  outputs a complete evaluable End(E) witness for the exact real key
  distribution. Computing one transfer point or one canonical endomorphism
  action is not a rank-four EndRing solution.

baseline_embedding:
  parameter_slice: >-
    At the algebraic boundary, replace psi_E by multiplication-by-s for a
    hidden scalar s on a prime-order group. Then A=[s]P, R=[r]P, and the shared
    point is [rs]P: ordinary hashed static Diffie-Hellman. This is a regression
    baseline, not an EndRing construction.
  reproduction_check: >-
    Symbolically substitute psi_E=[s] and verify that KeyGen/Enc/Dec reduce to
    the hashed DH identity. If the proposed EndRing argument also proves this
    scalar-only baseline from EndRing hardness, it is using no ring-specific
    structure and must be rejected.
  status: "specified but not executed; zero experiments"

observation_collision:
  observable: >-
    The complete functional transcript available to decryption: pk_ser,
    psi_E(P), and the oracle mapping R in <P> to psi_E(R), restricted to the
    reachable ciphertext line.
  distinct_preimage_search: >-
    Seek two non-equivalent complete endomorphism rings or complete witnesses
    that induce the same canonical psi_E action on <P>. Such a collision shows
    that the observable cannot identify the complete ring without an
    additional theorem.
  cross_conclusion_pair: >-
    Compare an honest full witness W with the strict quotient consisting only
    of an evaluator for psi_E. They produce identical decryption outputs even
    though only W is a valid AuxEndRing_CEST solution.
  falsifying_effect: >-
    A collision blocks black-box extraction of the complete ring from the
    decryption observable alone; it does not rule out non-black-box or
    distribution-specific reductions.

quantifier_order: >-
  For every security parameter and every accepted honest key, correctness
  quantifies over every mu-bit message and every r in Z_q^*. The desired
  security statement quantifies over every PPT classical-ROM IND-CPA
  adversary A and requires existence of a PPT AuxEndRing_CEST solver B whose
  input is one challenge pk and whose success is bounded below by a polynomial
  function of A's advantage. B may depend on A but not on the hidden W or on
  the challenge coins. No such B is currently constructed.

constructive_transforms:
  - transform: representation_reduction
    proposed_object: >-
      Factor the proof into IND-CPA -> CEST-XFER-KI -> canonical-endomorphism
      recovery -> complete EndRing, with a separate distribution statement at
      every arrow.
    predicted_gain: >-
      Prevents the existing wrong-direction implication from being mislabeled
      and identifies exactly which reverse arrow is missing.
    prerequisite: >-
      An extractor that upgrades transfer behavior or psi_E recovery to a
      rank-four evaluable End(E) basis on the real auxiliary-data distribution.
  - transform: observable_fiber
    proposed_object: >-
      The fiber of full ring witnesses and ring structures compatible with one
      reachable-line action transcript.
    predicted_gain: >-
      Either a collision gives a scoped extraction obstruction or an
      injectivity theorem supplies the missing identifiability premise.
    prerequisite: "A representation-independent definition of complete witness equivalence."
  - transform: stronger_invariant
    proposed_object: >-
      Replace one line <P> by actions on enough independently sampled torsion
      bases to determine the full ring, while preserving public encryption.
    predicted_gain: >-
      May make complete-ring extraction plausible, at the cost of larger
      public auxiliary data and a potentially easier/different EndRing problem.
    prerequisite: >-
      A theorem that the published finite actions identify End(E), plus an
      analysis showing the public data does not reveal the trapdoor.

method_ceiling:
  strongest_certifiable_claim: >-
    With the current map, one can at most certify perfect correctness for
    accepted keys and a conditional IND-CPA reduction to CEST-XFER-KI. The map
    cannot certify EndRing-based confidentiality, QPT/QROM security, concrete
    security, or complete-ring necessity.
  nearby_object_control: >-
    The scalar-only hashed DH baseline has identical sender/recipient algebra
    but no complete End(E) role. Any proof method unable to distinguish it from
    CEST-PKE has not isolated an EndRing-specific security mechanism.
  dominated_by: >-
    As a confidentiality construction, the candidate is provisionally
    dominated by ordinary hashed DH syntax because no EndRing-specific
    security implication or performance benefit is established.

proof_obligations:
  - id: O1-DISTRIBUTION
    claim: "The real public-key distribution is an exact hard AuxEndRing_CEST distribution."
    responsibility: scope
    status: open
    falsifier: "Public P,A or structured-curve support enables ring recovery or differs from the advertised challenge."
  - id: O2-SAMPLER
    claim: "TrapCurveGen and CanonicalBoundedEnd terminate in expected polynomial time and output valid complete objects."
    responsibility: feasibility
    status: open
    falsifier: "negligible accepted mass, superpolynomial normalization, or incomplete transported order"
  - id: O3-CORRECTNESS
    claim: "Dec(sk,Enc(pk,m;r))=m for every accepted key, message and nonce."
    responsibility: correctness
    status: proposed_discharge
    falsifier: "one accepted symbolic trace with psi_E([r]P) != [r]psi_E(P) or encoding mismatch"
  - id: O4-ASYMMETRY
    claim: "Recipient evaluation is unavailable from identical public data."
    responsibility: interface
    status: open
    falsifier: "a polynomial public ScalarTransfer(pk,R) algorithm with non-negligible success"
  - id: O4-FULL-WITNESS
    claim: "The recipient advantage is tied to a complete ring rather than only psi_E."
    responsibility: strictness
    status: open
    falsifier: "the psi_E quotient reproduces all decryption behavior without a quotient-to-EndRing reduction"
  - id: O5-INTERMEDIATE
    claim: "IND-CPA reduces to CEST-XFER-KI in the classical ROM."
    responsibility: security_reduction
    status: proposed_discharge
    falsifier: "the random-pad world remains message-dependent or oracle simulation changes distribution"
  - id: O5-ENDRING
    claim: "An IND-CPA attacker yields an AuxEndRing_CEST solver with polynomial loss."
    responsibility: security_reduction
    status: open
    falsifier: "observable-fiber collision or simulator unable to extract a complete ring"
  - id: O6-VIEW
    claim: "The intermediate game covers every public input and oracle available in IND-CPA."
    responsibility: scope
    status: proposed_discharge
    falsifier: "an omitted pairing, validation response, encoding, repetition, or auxiliary datum changes the attack"

assumption_direction:
  desired:
    input: "AuxEndRing_CEST challenge pk sampled from the exact real key distribution"
    use: "successful IND-CPA attacker on the complete CEST-PKE view"
    output: "complete evaluable End(E) witness satisfying O1"
    status: open
  available_attack_route:
    input: "complete AuxEndRing_CEST solution W"
    operation: "derive psi_E and compute psi_E(R)"
    output: "break the transfer challenge and decrypt"
    status: derived_by_producer
    security_value: "none; direction is reversed"
  intermediate:
    chain: "CEST-XFER-KI hardness -> IND-CPA candidate"
    status: proposed_not_reviewed
    limitation: "CEST-XFER-KI is not relabeled EndRing and may collapse to ordinary gap-CDH."

controls:
  public_data:
    mutation: "remove W and give only pk_ser,R to the alleged recipient operation"
    decision: "polynomial transfer success breaks O4"
  leaked_plaintext_known_false:
    mutation: "append S_snd, pad, or m to c"
    decision: "the random-world message-independence step must fail"
  wrong_key:
    mutation: "decrypt a ciphertext whose embedded pk_ser differs from sk.pk_ser"
    decision: "must return the single failure symbol before secret evaluation"
  malformed_ciphertext:
    mutation: "noncanonical/off-curve/infinity/wrong-order/outside-line R or wrong v length"
    decision: "must return the single failure symbol"
  distribution:
    mutation: "replace the real structured sampler by a bare or uniform supersingular curve challenge"
    decision: "requires an explicit distance/compiler/pullback theorem; otherwise the reduction stops"
  actual_message:
    mutation: "replace v XOR pad recovery by outputting only S_rec"
    decision: "fails PKE correctness even if transfer agreement holds"
  pairing:
    mutation: "claim DDH hardness for (P,A,R,S)"
    decision: "rejected because e_q(P,S)=e_q(R,A) publicly verifies S"
  prior_failure_regression:
    prohibited_dependencies:
      - C-star
      - BaseGen
      - Eval2
      - target-frame reconstruction
      - normalized quotient lift
      - endpoint lift
      - digit-loop tie rule
    check: "None appears in KeyGen, Enc, Dec, correctness, or the intermediate reduction."

heuristic_assumptions:
  - id: HEUR-CEST-1
    statement: >-
      TrapCurveGen produces a non-negligible fraction of curves having a
      degree-at-most-B canonical noncentral endomorphism that acts non-scalarly
      on a polynomial-size q-torsion module.
    rigorous_support: "none supplied; it is an explicit sampler-design obligation"
    validation_plan: >-
      Before any experiment, derive a family theorem or exact sampler count.
      A later toy enumeration could check definitions but would not justify
      cryptographic-scale density without a transfer theorem.
  - id: HEUR-CEST-2
    statement: >-
      CEST-XFER-KI remains hard despite the public pairing verifier and the
      structured relation A=psi_E(P).
    rigorous_support: "none supplied; DDH is explicitly unavailable"
    validation_plan: >-
      First compare against generic and pairing-assisted CDH algorithms and
      seek a reduction/counterexample. Failed attacks would not establish the assumption.

target_complexity:
  construction_time: >-
    Desired polynomial in lambda for all honest algorithms; not established
    for KeyGen or canonical selection.
  construction_memory: "desired polynomial in lambda; not established for W normalization"
  security_exponent: "none claimed"
  best_known_comparison: >-
    The scalar-only slice is ordinary hashed DH syntax. No EndRing-specific
    asymptotic or concrete improvement is claimed.
  hidden_overhead: >-
    complete ring representation, secret curve generation/transport,
    norm-bounded enumeration, rational-map normalization, extension-field
    q-torsion, pairing validation, and public-key duplication in ciphertexts

execution:
  scientific_runs: 0
  implementation_runs: 0
  formalizer_runs: 0
  experiment_runs: 0
  measured_observations: []
  next_action: >-
    Independent blind O1-O3 derivation and disjoint adversarial O4-O6 review;
    do not implement until the sampler/selector and reduction target survive.
