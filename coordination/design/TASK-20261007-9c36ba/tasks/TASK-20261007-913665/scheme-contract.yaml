format: scheme-construction-contract/v1
title: "CEST-PKE: canonical-endomorphism scalar-transfer public-key encryption candidate"
primitive: pke
parent_record_ids:
  - GOAL-SSI-2fa82a
  - RQ-SSI-1946c9
  - TASK-20261007-913665
  - IDEA-20261007-560bcb
  - H-SSI-fbe68d
artifact_revision: "uncommitted producer artifact; independent review not yet performed"
author: "idea-generator TASK-20261007-913665"
security_parameter: >-
  lambda; p and q have lambda-dependent bit length, q is an odd prime not
  equal to p, extension degree d and degree bound B are polynomial in lambda,
  and message length is mu(lambda).
domains:
  public_parameters: >-
    Canonical finite-field, curve, point, tuple and infinity encodings; public
    Weil-pairing algorithm e_q; polynomial bounds d and B; message length mu;
    and domain-separated classical random oracle H_pad:{0,1}*->{0,1}^mu.
  public_key: >-
    pk_ser=Encode(version,lambda,p,d,E,q,B,P,A,H_pad_domain), where E/F_(p^2)
    is supersingular, P and A are nonzero exact-order-q points over the
    declared extension, and e_q(P,A)!=1.
  secret_key: >-
    (pk_ser,W), where W is a rank-four Z-basis for exactly End(E), with
    multiplication, reduced trace/norm, and evaluators for represented
    endomorphisms. W must support the representation-independent
    CanonicalBoundedEnd interface.
  message: "All bit strings m in {0,1}^mu."
  ciphertext: >-
    Canonical tuple (pk_ser,R,v), with R a nonzero point in the q-order line
    generated by P and v in {0,1}^mu. Bytewise serialization defines challenge
    equality; alternate encodings are rejected.
  signature: "not applicable: the primitive is PKE"
  key_space: "not applicable to the PKE payload; H_pad outputs the mu-bit one-time mask"
  encoding_and_equality: >-
    Public keys and ciphertexts have unique canonical byte encodings. Field
    and point encodings are rejected if noncanonical. Public-key and
    ciphertext equality are bytewise; mathematical points are compared after
    successful canonical parsing only.
  inapplicable_reasons:
    signature: "CEST-PKE does not sign or authenticate."
    key_space: "The output is a selected plaintext, not a KEM key."

security_claims:
  - name: IND-CPA
    primitive: pke
    status: conjectured
    adversary: PPT
    oracle_model: ROM
    oracle_query_access: classical
    game_definition: >-
      Generate (pk,sk)<-KeyGen(1^lambda), give pk and classical H_pad access to
      A, receive equal-length m0,m1 in {0,1}^mu, sample beta uniformly, return
      c*=Enc(pk,m_beta), and receive beta'. The win event is beta'=beta. There
      is no decryption oracle; public encryption is available by definition.
    advantage_convention: "abs(Pr[beta'=beta]-1/2)"
    query_bounds:
      random_oracle_queries: "polynomial in lambda"
      encryption_computations: "unbounded polynomial public computations"
      challenge_count: 1
    oracle_access_and_challenge_exclusions: >-
      Classical adaptive H_pad queries are permitted before and after the
      challenge. No decryption oracle exists. QROM and superposition queries
      are outside this claim.
    assumptions:
      - CEST-XFER-KI for the complete real public-key distribution
      - Correct and polynomial TrapCurveGen and CanonicalBoundedEnd interfaces
    theorem_artifact: >-
      candidate.md section 5 gives only the proposed reduction to the named
      intermediate assumption; no EndRing theorem is supplied.
    review_artifact: "none; independent review pending"

obligations:
  O1:
    name: exact_hard_problem
    status: proposed_discharge
    instance_sampler: >-
      AuxEndRing_CEST runs the honest key sampler internally, derives
      psi_E=CanonicalBoundedEnd(E,W,B), samples P until A=psi_E(P) forms a
      q-torsion basis with P, and releases the complete pk_ser while discarding
      W. CEST-XFER-KI additionally samples r<-Z_q^*, R=[r]P, and releases a
      real H_pad value on [r]A or an independent uniform mu-bit string.
    real_key_distribution: >-
      Exactly the output distribution of TrapCurveGen plus all KeyGen retries,
      bounded-endomorphism selection, P sampling, basis rejection, and
      canonical serialization. No replacement by a uniform supersingular
      curve distribution is asserted.
    adversary_input_and_auxiliary_data: >-
      version,lambda,p,d,E,q,B,P,A,H_pad domain and algorithms, canonical
      encodings, public pairing, pk bytes, R and the key-indistinguishability
      challenge string where applicable.
    solution_representation_and_success_predicate: >-
      For AuxEndRing_CEST, output any complete evaluable W' spanning exactly
      End(E), with valid multiplication/trace/norm data, for which
      CanonicalBoundedEnd(E,W',B)(P)=A. A single endomorphism or torsion matrix
      is not a successful EndRing output. For CEST-XFER-KI, output the hidden
      real-or-random bit under the advantage convention in the game.
    setup_trust_and_erasure: >-
      TrapCurveGen is a structured honest setup that knows W. No transparent
      setup, erasure theorem, or malicious-setup robustness is claimed.
    secret_representation_and_conversion_costs: >-
      W includes evaluators, so psi_E(R) is defined once CanonicalBoundedEnd
      succeeds. Enumeration of norm-bounded elements, normalized rational-map
      conversion, and representation-independent tie breaking are required to
      be polynomial but are not proved here.
    assumptions:
      - name: AuxEndRing_CEST
        formal_game: >-
          On an honestly distributed pk_ser, output a complete evaluable
          End(E) witness satisfying the stated success predicate.
        distribution: "the exact real CEST-PKE key distribution with P,A auxiliary data"
        model: "classical PPT; hardness unestablished"
        source_artifact: "this scheme contract and candidate.md"
        provenance: internal
        verified_by: "not independently verified"
      - name: CEST-XFER-KI
        formal_game: >-
          Distinguish H_pad(pk_ser,R,[r]A) from a uniform mu-bit string given
          pk_ser and R=[r]P, with classical random-oracle access.
        distribution: "the exact real CEST-PKE key and encryption distributions"
        model: "classical PPT in the ROM; hardness conjectured only"
        source_artifact: "this scheme contract and candidate.md"
        provenance: internal
        verified_by: "not independently verified"
    cited_equivalences_and_hypotheses:
      - claim: >-
          No equivalence is asserted. A complete EndRing solver is sufficient
          to compute the transfer value; the reverse implication is open.
        source: "candidate.md section 5"
        provenance: internal
        verified_by: "producer only"
    evidence_artifacts:
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/candidate.md
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/proof-search-map.yaml
    review_artifact: "none; independent review pending"
    remaining_gap: >-
      Relate the real auxiliary-data distribution to bare EndRing, prove the
      setup sampler and canonical selector, and establish hardness rather than
      merely naming the games.
    next_action: >-
      Audit distribution support and whether P,A or the structured curve locus
      make AuxEndRing_CEST easier than the intended bare problem.

  O2:
    name: honest_party_algorithms
    status: open
    algorithms:
      - name: TrapCurveGen
        inputs: "1^lambda"
        outputs: "(E,W,q,d) satisfying the accepted-key predicates"
        randomness: "private generation coins and any secret walk coins"
        validation: >-
          W spans exactly End(E), W evaluators agree with its tables,
          CanonicalBoundedEnd succeeds, and its output is non-scalar on E[q].
        failure_behavior: "retry; expected-polynomial retry bound required but open"
        pseudocode_artifact: "candidate.md sections 2-3"
        time: "required expected poly(lambda); not established"
        memory: "required poly(lambda); not established"
        bit_length_bounds: "all public encodings, W, d and B required poly(lambda)"
      - name: CanonicalBoundedEnd
        inputs: "(E,W,B)"
        outputs: "a unique normalized evaluable noncentral primitive psi_E or fail"
        randomness: "none"
        validation: >-
          Enumerate degree-at-most-B ring elements, normalize rational maps,
          remove duplicate maps, and take the lexicographically first encoding.
        failure_behavior: "fail if no admissible element exists"
        pseudocode_artifact: "candidate.md section 2"
        time: "required poly(lambda) on TrapCurveGen support; not established"
        memory: "required poly(lambda); not established"
        bit_length_bounds: "degree B and normalized-map encodings required poly(lambda)"
      - name: KeyGen
        inputs: "1^lambda"
        outputs: "pk=pk_ser and sk=(pk_ser,W)"
        randomness: "TrapCurveGen coins and uniform exact-order-q point sampling"
        validation: "canonical pk; P,A exact order q; e_q(P,A)!=1; A=psi_E(P)"
        failure_behavior: "retry failed setup, selector, or point samples"
        pseudocode_artifact: "candidate.md section 3"
        time: "expected polynomial conditional on the two unavailable-interface bounds"
        memory: "polynomial conditional on W and normalized-map representations"
        bit_length_bounds: "polynomial conditional on the declared sampler"
      - name: Enc
        inputs: "canonical pk_ser and m in {0,1}^mu"
        outputs: "canonical c=(pk_ser,R,v)"
        randomness: "uniform r in Z_q^*"
        validation: "public key parsing, curve/order checks and e_q(P,A)!=1"
        failure_behavior: "return fail on invalid key or message"
        pseudocode_artifact: "candidate.md section 3"
        time: "polynomial: two scalar multiplications, validation, pairing and one oracle query"
        memory: "polynomial in public encoding sizes"
        bit_length_bounds: "|c|=|pk_ser|+|Encode(R)|+mu plus tuple overhead"
      - name: Dec
        inputs: "sk=(pk_ser,W) and ciphertext bytes"
        outputs: "m in {0,1}^mu or the single failure symbol"
        randomness: "none"
        validation: >-
          Canonical parsing, exact pk binding, length, nonzero/on-curve/order
          checks, e_q(P,R)=1, successful selector, and psi_E(P)=A.
        failure_behavior: "return fail on any failed check; otherwise return v XOR pad"
        pseudocode_artifact: "candidate.md section 3"
        time: "polynomial conditional on CanonicalBoundedEnd and psi evaluation"
        memory: "polynomial conditional on W"
        bit_length_bounds: "all parsed inputs bounded by declared parameter sizes"
    preprocessing_and_retry_costs: >-
      Setup and point retries are charged to KeyGen. A non-negligible accepted
      setup mass and expected-polynomial retry count remain unproved. Enc and
      Dec have no hidden preprocessing beyond public parsing and the stored W.
    complexity_guarantee: >-
      Enc is worst-case polynomial on valid bounded inputs. KeyGen and Dec are
      only conditionally polynomial because the sampler, canonical selector,
      normalized-map conversion and evaluator-cost bounds are open.
    unavailable_subroutines:
      - "TrapCurveGen with an exact distribution, complete transported ring, and retry bound"
      - "CanonicalBoundedEnd with representation-independent normalized-map encoding and polynomial cost"
      - "A verifier/certificate that W equals the full End(E), rather than a suborder"
    evidence_artifacts:
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/candidate.md
    review_artifact: "none; independent review pending"
    remaining_gap: "The three unavailable interfaces prevent an unconditional efficient construction."
    next_action: "Attempt a symbolic implementation contract for the sampler and selector before any code or experiment."

  O3:
    name: quantified_correctness
    status: proposed_discharge
    statement_and_quantifiers: >-
      For every lambda, every accepted (pk,sk) output by KeyGen, every
      m in {0,1}^mu, and every r in Z_q^*,
      Dec(sk,Enc(pk,m;r))=m.
    probability_space: >-
      KeyGen coins conditioned on an accepted key and uniform Enc coin r. H_pad
      is a fixed function within a game; both algorithms query the identical
      input, so no probabilistic oracle property is needed for correctness.
    valid_key_and_message_scope: >-
      Accepted keys satisfying all O2 validation predicates and all mu-bit
      messages. Malicious public keys and failed setup outputs are excluded.
    per_key_or_average_guarantee: "per accepted key, per message and per encryption coin"
    failure_probability_bound: "epsilon_pke(lambda)=0 conditional on accepted valid keys and correct declared interfaces"
    actual_message_or_key_recovery: >-
      S_rec=psi_E([r]P)=[r]psi_E(P)=[r]A=S_snd, so the identical pad is XORed
      twice and Dec returns the selected m exactly.
    exceptional_inputs:
      - "Key-generation retries are outside the accepted-key theorem and lack a tail bound."
      - "Malformed ciphertexts follow the explicit failure/unauthenticated-valid behavior in O6."
      - "An incorrect or incomplete W is not a valid secret key."
    theorem_artifact: "candidate.md section 4; producer derivation only"
    supporting_test_artifacts: []
    review_artifact: "none; blind rederivation pending"
    remaining_gap: "Independent derivation and O2 interface proofs are absent."
    next_action: "Blindly derive actual-message correctness from this contract alone."

  O4:
    name: functionality_mechanism
    status: proposed_discharge
    public_operation: >-
      Sender samples r, computes R=[r]P and S_snd=[r]A using only pk, then
      hashes the canonical (pk,R,S_snd) transcript.
    private_operation: >-
      Recipient derives psi_E from complete evaluable W, verifies psi_E(P)=A,
      computes S_rec=psi_E(R), and hashes the same transcript.
    agreement_or_message_binding_lemma: >-
      Endomorphism additivity gives psi_E([r]P)=[r]psi_E(P). XOR with the
      resulting transcript-bound pad recovers the selected plaintext.
    extra_recipient_secrets:
      - "No secret beyond (pk_ser,W) is declared."
      - "A compressed psi_E evaluator suffices for decryption, exposing a strict witness-quotient concern."
    recipient_lift:
      applicability: false
      inapplicable_reason: >-
        No SecretLift, Complete_2, EndpointLift, target-frame reconstruction,
        quotient lift, or label transport is used; Dec evaluates psi_E directly on R.
      interface: "not applicable"
      inputs: "not applicable"
      output_representation_and_equivalence: "not applicable"
      uniqueness_or_acceptance_condition: "not applicable"
      polynomial_algorithm_and_cost: "not applicable"
      failure_bound: "not applicable"
      recovery_of_actual_message_or_key: "not applicable"
      identical_public_data_control: >-
        The public-data control is ScalarTransfer(pk,R): compute [r]A from
        R=[r]P without r or W. Any polynomial solution breaks the mechanism.
    identification_and_transform:
      applicability: false
      inapplicable_reason: "No identification protocol or Fiat-Shamir transform is used."
      relation: "not applicable"
      completeness: "not applicable"
      soundness_extractor_and_knowledge_error: "not applicable"
      simulator_and_verifier_scope: "not applicable"
      challenge_space: "not applicable"
      transcript_message_key_and_context_binding: "not applicable"
      transform_theorem_and_hypotheses: "not applicable"
    ake_identity_and_session_binding: "not applicable: this is PKE, not AKE"
    evidence_artifacts:
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/candidate.md
    review_artifact: "none; independent review pending"
    remaining_gap: >-
      Functionality factors through one canonical endomorphism evaluator. A
      reverse reduction is required before complete EndRing can be called
      necessary rather than merely sufficient.
    next_action: "Run the finite-witness quotient audit symbolically and attack public scalar transfer."

  O5:
    name: correctly_directed_security_reduction
    status: open
    reductions:
      - security_claim: "IND-CPA to CEST-XFER-KI"
        solver_input_distribution: >-
          Exact real pk_ser, R=[r]P, and K equal to the real H_pad transfer pad
          or an independent uniform mu-bit string.
        scheme_attacker: "a PPT classical-ROM IND-CPA attacker A"
        assumption_problem_solved: CEST-XFER-KI
        challenge_embedding: >-
          Obtain equal-length m0,m1 from A, choose beta, return
          (pk_ser,R,m_beta XOR K) as the challenge ciphertext.
        real_key_distribution_argument: "identity: the intermediate game uses the exact KeyGen distribution"
        oracle_simulation: "Forward every classical H_pad query to the supplied random oracle."
        extraction: "Output whether beta'=beta as the real-versus-random decision statistic."
        aborts: "Only invalid attacker messages; no algebraic abort on a valid intermediate challenge."
        advantage_loss_bound: >-
          Adv_IND-CPA_CEST(A) <= Adv_CEST-XFER-KI(D)+delta_parse, with
          delta_parse=0 for honest canonical challenges under the stated advantage conventions.
        solver_runtime: "time(A)+polynomial parsing and XOR overhead"
        model: "classical ROM only"
        theorem_artifact: "candidate.md section 5; proposed proof, not reviewed"
        independently_reviewed_artifact: "none"
      - security_claim: "IND-CPA to AuxEndRing_CEST"
        solver_input_distribution: "an AuxEndRing_CEST challenge pk_ser"
        scheme_attacker: "a successful IND-CPA attacker A"
        assumption_problem_solved: AuxEndRing_CEST
        challenge_embedding: "open: no embedding/extraction producing a complete ring is known"
        real_key_distribution_argument: "the distributions can match by definition, but that does not provide extraction"
        oracle_simulation: "open"
        extraction: "open: a transfer distinguisher or plaintext guess does not reveal a rank-four ring basis"
        aborts: "unquantified because the reduction is absent"
        advantage_loss_bound: "none established"
        solver_runtime: "none established"
        model: "open for classical PPT; no quantum claim"
        theorem_artifact: "none"
        independently_reviewed_artifact: "none"
    intermediate_assumptions:
      - name: CEST-XFER-KI
        game_and_distribution: >-
          The exact hashed scalar-transfer real-or-random game in O1, including
          P,A, pairings, parsing, structured keys and classical random-oracle access.
        relation_to_endring: >-
          A complete AuxEndRing_CEST solver breaks the game by deriving psi_E
          and evaluating psi_E(R). The reverse reduction required for an
          EndRing-based security theorem is open and may be false.
        status: "separate stronger/unrelated intermediate assumption; not relabeled EndRing"
    multiple_assumption_dependency: >-
      The only proposed confidentiality implication is
      CEST-XFER-KI hardness plus correct efficient interfaces implies IND-CPA.
      No implication from plain or auxiliary EndRing hardness is established.
    classical_quantum_and_rewinding_scope: >-
      Classical PPT and classical ROM only. There is no rewinding, QPT,
      superposition-query, QROM, or post-quantum theorem.
    evidence_artifacts:
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/candidate.md
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/proof-search-map.yaml
    review_artifact: "none; adversarial reduction review pending"
    remaining_gap: >-
      Construct a solver that takes the exact EndRing challenge, uses A, and
      outputs a complete ring witness. The currently available implication is
      only EndRing-solver-to-scheme-break and therefore proves no security.
    next_action: >-
      Attempt an observable-fiber counterexample: hold transfer behavior fixed
      while varying complete ring witnesses to test whether extraction is
      information-theoretically underdetermined.

  O6:
    name: complete_adversarial_view
    status: proposed_discharge
    public_disclosures:
      - "version, lambda, p, d, E, q, B and all encoding/validation algorithms"
      - "P, A=psi_E(P), e_q and all pairing-test outcomes"
      - "H_pad domain separation and every classical random-oracle answer"
      - "full pk bytes, every ciphertext (pk_ser,R,v), repetitions and rejection behavior"
      - "the structured key-generation algorithm and accepted-key distribution"
    allowed_oracles_and_query_history: >-
      IND-CPA gives adaptive classical H_pad access and public encryption by
      ordinary computation. No Dec oracle exists. Query count is polynomial;
      the proof must retain the full history for repeated-input consistency.
    validation_rejection_and_failure_observables: >-
      Key parsing, point/order/basis checks and ciphertext parsing are public.
      Dec emits one failure symbol for noncanonical, wrong-key, wrong-length,
      infinity, off-curve, wrong-order, or outside-<P> inputs. Timing and fault
      behavior are explicitly outside the claim.
    malformed_inputs_and_alternate_encodings: >-
      Alternate encodings are rejected. A valid in-line R is accepted and
      yields an unauthenticated plaintext. Mathematical endpoint equality does
      not create an alternate challenge-ciphertext exclusion because no
      decryption oracle is present.
    repeated_use_and_collision_analysis: >-
      Repeated r repeats R and the pad, exposing XORs of plaintexts. For Q
      encryptions, nonce collision probability is at most Q(Q-1)/(2(q-1)).
      Fixed (pk,R) with different messages yields different v. No concrete
      random-oracle or serialization collision bound is supplied.
    side_channel_scope_and_exclusions: >-
      Timing, cache, power, fault, RNG compromise, malicious setup, malicious
      public keys, CCA, multi-user, QPT and QROM behavior are excluded. No
      implementation-side-channel claim is made.
    public_data_and_known_false_controls:
      - name: public_data_scalar_transfer
        procedure: "Using only pk_ser and R=[r]P, attempt to compute [r]A; charge all work."
        falsifier: "non-negligible polynomial success destroys recipient-only asymmetry"
      - name: complete_witness_quotient
        procedure: "Replace W by an evaluator for psi_E and compare every Dec output."
        expected: "identical functionality, exposing that full-ring necessity is unproved"
      - name: leaked_plaintext_known_false
        procedure: "Add S_snd, the pad, or m itself to the ciphertext."
        expected: >-
          The random-world message-independence step fails; any proof that
          survives this mutation proves too much.
      - name: pairing_control
        procedure: "Test candidate S with e_q(P,S)=e_q(R,A)."
        expected: "DDH-style decisional hardness is false/inapplicable; computation remains the target"
      - name: wrong_key_and_malformed
        procedure: "Use a different pk-bound sk and every declared malformed-input class."
        expected: "one failure symbol before secret output, except valid in-line mutations"
    concrete_parameter_security: "none; no parameter set or bit-security estimate is proposed"
    asymptotic_to_concrete_limitations: >-
      Even an asymptotic CEST-XFER-KI conjecture would not supply EndRing
      equivalence, quantum security, implementation security, or concrete
      sizes. Pairing-aided verification and generic CDH attacks must be costed.
    evidence_artifacts:
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/candidate.md
    review_artifact: "none; independent red-team review pending"
    remaining_gap: "No CCA, quantum, multi-user, side-channel or concrete analysis exists."
    next_action: "Apply every frozen control and preserve the narrowest surviving IND-CPA statement."

assessment:
  verdict: candidate
  finite_functionality_status: >-
    algebraically specified for accepted keys; no implementation or finite test was run
  efficient_functionality_status: >-
    unresolved because TrapCurveGen, CanonicalBoundedEnd and complete-ring verification costs are open
  security_status: >-
    unresolved; conditional intermediate CEST-XFER-KI reduction proposed, correctly directed EndRing reduction absent
  named_conditions:
    - "accepted valid key from the exact TrapCurveGen distribution"
    - "correct complete evaluable End(E) witness"
    - "representation-independent polynomial CanonicalBoundedEnd"
    - "classical PPT adversary and classical ROM"
    - "CEST-XFER-KI hardness on the complete public view"
  open_obligations: [O1, O2, O3, O4, O5, O6]
  obstruction:
    affected_obligation: O5
    exact_family_and_parameter_scope: >-
      CEST-PKE keys in which Dec factors through psi_E and sender transfer is
      [r]A on prime-order q-torsion.
    counterexample_or_argument_artifact: >-
      candidate.md sections 5 and 7: an EndRing solver breaks the scheme, but
      a transfer solver supplies no complete ring extractor; quotient control pending review.
    what_remains_open: >-
      Whether another embedding/extractor, altered canonical selector, or
      different EndRing distribution yields the required direction.
  independent_review_artifacts: []
  next_action: >-
    Blind correctness derivation plus adversarial O4-O6 review of quotient,
    pairing, distribution and reduction-direction controls.
  official_state_transition_record: "none; this producer cannot change official status"

