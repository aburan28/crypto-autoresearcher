final_composition:
  schema: crypto.autoresearch.candidate_funnel_composition.v1
  task_id: TASK-20261007-c47fc6
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  batch_id: BATCH-65c2dd
  method: propose_evaluate_gap_feed_propose_evaluate
  method_status: completed_for_declared_two_evaluation_limit
  source_artifacts:
    methodology: research/ssi-endring-pke/2026-10-07-candidate-funnel/methodology.md
    initial_composition: coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-79e571/composition.yaml
    gap_packet: coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-79e571/gap-packet.yaml
    revision_packet: coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-8ab26c
    revision_review: coordination/design/TASK-20261007-9c36ba/reviews/TASK-20261007-b6c1ec/revision-review.yaml
  stage_results:
    - stage: propose_1
      outputs:
        - candidate: CEST-PKE
          producer_task: TASK-20261007-913665
          mechanism: canonical endomorphism same-scalar transfer
        - candidate: ER-McE
          producer_task: TASK-20261007-61f3bc
          mechanism: EndRing-seeded Goppa-code trapdoor
      evidence_class: proposed_unreviewed
    - stage: evaluate_1
      reviewer_tasks:
        - TASK-20261007-bc6c0f
        - TASK-20261007-385334
      outputs:
        CEST-PKE:
          verdict: no_finalist
          joint_verdicts:
            J1_O1: inconclusive
            J2_O2_O3: breaks
            J3_O4: inconclusive
            J4_O5: breaks
            J5_O6: inconclusive
          surviving_evidence: >-
            Conditional accepted-key actual-message correctness follows from
            psi_E([r]P)=[r]psi_E(P).
          decisive_gap: >-
            Decryption needs one evaluator and the only EndRing implication is
            solver-to-break; real-key embedding and attacker-to-complete-ring
            extraction are missing.
        ER-McE:
          verdict: contradicted_exact_syntax
          joint_verdicts:
            J1_O1: breaks
            J2_O2_O3: breaks
            J3_O4: breaks
            J4_O5: breaks
            J5_O6: breaks
          decisive_break: >-
            For distinct m0,m1, exactly one residual c-m_i G_pub has weight t
            under the declared distance at least 2t+1, so the IND-CPA
            challenge bit is recovered with probability one.
          scope: >-
            This breaks raw exact-weight ER-McE, not general McEliece,
            EndRing, or every seeded composition.
    - stage: gap_feed
      selected_gap: GAP-CEST-COMPLETE-RING-EXTRACTION
      reason: >-
        CEST retained a conditional message-transfer identity, making
        complete-ring necessity and correctly directed extraction the smallest
        decision-changing gap. ER-McE required replacement of its whole
        encryption transform rather than a local repair.
      constraints_preserved:
        - selected-message IND-CPA is not weakened
        - PKE is not silently relabeled as KEM
        - separate transfer or decoding hardness is not renamed EndRing
        - prior lift/evaluator failures remain regression controls
    - stage: propose_2
      output:
        candidate: RWCT-PKE
        producer_task: TASK-20261007-8ab26c
        mechanism: >-
          Polynomial tables of noncommutative words syntactically using all
          four planted basis elements, compiled to scalar-transfer slots.
        producer_outcome: scoped_obstruction_proposed
        surviving_evidence: >-
          A conditional selected-message correctness identity exists for valid
          planted tuples.
        producer_failed_arrows:
          - bare curve E to exact real public key
          - IND attacker to complete evaluable End(E) basis
          - arbitrary EndRing basis to planted word evaluators
    - stage: evaluate_2
      reviewer_task: TASK-20261007-b6c1ec
      joint_verdicts:
        R1_selected_gap: breaks
        R2_O1_O3: breaks
        R3_O4_O6: breaks
      selected_gap_repaired: false
      obligation_verdicts:
        O1: open
        O2: open
        O3: open_with_conditional_identity_verified
        O4: open_with_conditional_functionality_verified
        O5: open_missing_reduction
        O6: open
      new_breaking_artifacts:
        - >-
          KeyGen returns sk=B while Dec reads pp, pk, word descriptors, and
          validation domains that are absent from its declared input.
        - >-
          Uniform encryption coins include zero, while identity-point
          acceptance is ambiguous.
        - >-
          The valid word
          X_1+(X_2-X_2)+(X_3-X_3)+(X_4-X_4) syntactically contains every
          variable but collapses to the original single-evaluator route.
      quotient_finding: >-
        The factorization through restricted word evaluators is exact, but no
        strict efficient quotient, collision pair, meta-reduction, or
        reconstruction impossibility is proved. The proposed family-level
        obstruction is therefore inconclusive, not a no-go theorem.
  candidate_table:
    - candidate: CEST-PKE
      primitive: PKE
      correctness: conditional_valid_key_identity_verified
      endring_security: not_established
      exact_disposition: retained_as_transfer_shell_only
      implementation_recommended: false
      novelty_status: unverified
    - candidate: ER-McE
      primitive: PKE
      correctness: conditional_and_contract_incomplete
      endring_security: not_established
      exact_disposition: eliminated_by_perfect_ind_cpa_distinguisher
      implementation_recommended: false
      novelty_status: unverified
    - candidate: RWCT-PKE
      primitive: PKE
      correctness: conditional_identity_survives_but_interface_is_ill_typed
      endring_security: not_established
      exact_disposition: selected_gap_not_repaired
      implementation_recommended: false
      novelty_status: unverified
  final_gate:
    candidates_generated: 3
    independently_evaluated_candidate_packets: 3
    finalists: []
    O1_O6_complete_candidates: 0
    secure_pke_established: false
    endring_hardness_reduction_established: false
    implementation_or_parameter_run_warranted: false
    novelty_established: false
    universal_impossibility_established: false
    scientific_runs: 0
    implementation_runs: 0
    formalizer_runs: 0
    benchmark_runs: 0
  campaign_learning:
    - >-
      Starting KeyGen from a complete EndRing witness proves sufficiency only;
      it does not make the complete ring necessary for decryption or
      extractable from an attacker.
    - >-
      Public-key fields correlated with a hidden ring witness must be sampled
      from the exact EndRing challenge or justified by a distribution compiler.
    - >-
      A scheme-attacker-to-EndRing reduction must output a complete evaluable
      rank-four basis, not a transfer point, one evaluator, torsion action,
      code decoder, or planted-basis label.
    - >-
      Syntactic use of four basis variables does not imply semantic dependence:
      cancellation and finite restricted-evaluator factorization must be
      excluded or explicitly reconstructed.
    - >-
      Candidate evaluation must include elementary selected-message tests
      before assumption-level analysis; this exposed ER-McE's exact-weight
      attack immediately.
  exactly_one_next_action:
    id: NEXT-ENDRING-TRAP-INTERFACE
    action: >-
      Define and audit one basis-independent trapdoor map Trap_E:X_E->Y_E
      before proposing another PKE wrapper.
    required_properties:
      - >-
        Public instance sampling and forward evaluation are polynomial from a
        bare curve E drawn from the exact EndRing challenge distribution.
      - >-
        Any complete evaluable basis of End(E), not one planted basis, gives a
        polynomial inversion algorithm.
      - >-
        The inversion observable either provably does not factor through a
        declared smaller witness or comes with a proved reconstruction theorem
        from that witness to a complete ring.
      - >-
        A selected-message IND attacker yields a complete evaluable End(E)
        basis with explicit game hops, oracle simulation, probability loss,
        runtime, and abort bounds.
    stop_condition: >-
      If any property is unavailable, record that exact failed arrow before
      constructing another encryption syntax.
    why_selected: >-
      All three candidates failed at this common interface boundary. Another
      wrapper would move the same missing theorem rather than reduce it.
  status_decision:
    goal_status: active
    batch_status: complete_no_finalist
    reason: >-
      The approved two-evaluation method completed and produced scoped
      evidence, but no candidate satisfies O1-O6 and no completion criterion
      for a secure EndRing-based PKE was met.
