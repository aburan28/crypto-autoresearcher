revision_map:
  schema: crypto.autoresearch.endring_revision_map.v1
  task_id: TASK-20261007-8ab26c
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  batch_id: BATCH-65c2dd
  input_gap_id: GAP-CEST-COMPLETE-RING-EXTRACTION
  local_candidate_label: RWCT-PKE
  outcome: scoped_obstruction
  evidence_tier: symbolic_unreviewed_unmeasured
  claims:
    security_established: false
    novelty_established: false
    deployability_established: false
    universal_impossibility_established: false
    experiments_run: 0
    primary_sources_read: 0

  source_boundary:
    research_input_read:
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-79e571/gap-packet.yaml
    method_and_contract_inputs_read:
      - research/ssi-endring-pke/2026-10-07-candidate-funnel/methodology.md
      - docs/scheme-construction-contract.md
      - templates/scheme-construction-contract.yaml
      - AGENTS.md
      - agents/idea-generator.md
      - docs/inventor-protocol.md
      - coordination/goals/GOAL-SSI-2fa82a/batches/BATCH-65c2dd/dispatch_queue.json
    forbidden_research_inputs_read: []
    note: >-
      No original candidate packet, validator report, red-team report,
      composition.yaml, sibling output, corpus record, or primary literature
      was used.

  frozen_gap:
    target: >-
      Make complete EndRing information both sufficient and demonstrably
      necessary for recipient functionality on the exact real public-key
      distribution, with an IND-CPA-attacker-to-complete-ring reduction.
    required_output: >-
      Any rank-four evaluable Z-basis spanning exactly End(E), not one
      evaluator, torsion action, transfer point, endpoint, quotient decoder,
      or planted-basis recovery witness.
    prohibited_shortcuts:
      - Rename a transfer, CDH, torsion-action, or decoding assumption as EndRing.
      - Assume a secret lift, endpoint lift, target frame, evaluator reconstruction, or missing map.
      - Weaken selected-message IND-CPA or silently reclassify PKE as KEM.

  attempted_change:
    mechanism_delta: >-
      Replace the single hidden evaluator by t noncommutative straight-line
      words w_j(B), every one syntactically using all four elements of the
      planted complete basis, and require every ciphertext to use every word.
    why_materially_different: >-
      Recipient evaluation now composes, adds, negates, and scales all four
      basis elements through polynomial-size ring words instead of evaluating
      one selected endomorphism. The attempt explicitly tests whether using
      ring multiplication/composition prevents quotienting to one evaluator.
    interfaces:
      setup: >-
        Declare canonical encodings, L,t,d, admissible exact-order torsion, ROM
        H_RWCT, and a joint planted pair distribution D_pair.
      keygen: >-
        Sample (E,B), words w_j, points P_j, compile gamma_j=w_j(B), and publish
        A_j=gamma_j(P_j); reject exact-order failures.
      encryption: >-
        For all j sample r_j, publish R_j=[r_j]P_j, derive the pad from all
        Z_j=[r_j]A_j, and XOR it with the selected L-bit message.
      decryption: >-
        Recompile every gamma_j from planted B, evaluate gamma_j(R_j), derive
        the same pad, and return the selected plaintext.
    security_game_change: none; equal-length selected-message IND-CPA is retained
    exact_algorithm_artifact: revised-candidate.md#exact-attempted-family
    exact_contract_artifact: revised-scheme-contract.yaml

  conditional_correctness:
    status: proposed_discharge_unreviewed
    quantifiers: >-
      For every valid KeyGen output (pk,B), every m in {0,1}^L, and every
      encryption coin vector (r_1,...,r_t), Dec(B,Enc(pk,m;r_1,...,r_t))=m.
    identity: >-
      w_j(B)([r_j]P_j)=[r_j]w_j(B)(P_j)=[r_j]A_j for every j.
    actual_message_recovered: true
    failure_bound: zero conditional on valid keys and canonical inputs
    unresolved_generation_probability: >-
      D_pair has no supplied efficient sampler and the key-generation rejection
      tail has no bound.

  gap_mapping:
    - gap: A single evaluator preserved every reachable decryption transcript.
      change: Every ciphertext invokes t words that each contain all four basis variables.
      result: not_repaired
      reason: >-
        After word compilation, all transcripts factor through the finite tuple
        Q(pk,B)=(w_j(B)|<P_j>)_j. Ring syntax does not survive as an observable.
    - gap: Real public-key fields could not be sampled from bare E.
      change: Real distribution and all planted word-image fields are stated exactly.
      result: exposed_not_repaired
      reason: >-
        From E alone a reduction still cannot generate A_j=w_j(B)(P_j).
        Random A_j needs an unproved compiler and may admit no consistent sk.
    - gap: No IND-attacker transcript identified a complete evaluable basis.
      change: The intended extraction map and direct hashed-transfer intermediate game are explicit.
      result: contradicted_for_this_route
      reason: >-
        The attacker outputs a bit about a view depending on Q; no
        RestrictedEvaluatorsToCompleteRing algorithm or quantitative loss exists.
    - gap: Complete-ring sufficiency was assumed from KeyGen provenance.
      change: An arbitrary EndRing output B' is distinguished from the planted ordered B.
      result: additional_gap_found
      reason: >-
        Public words refer to planted basis variables. BasisAlign(B',pk) is
        required to recover the intended word evaluators and is unavailable.

  real_distribution_challenge_embedding:
    nodes:
      - id: pair
        label: "real (E,B) from D_pair"
      - id: pk
        label: "real pk with planted A_j=w_j(B)(P_j)"
      - id: ct
        label: "selected-message IND-CPA challenge"
      - id: bit
        label: "attacker output bit"
      - id: ring
        label: "complete evaluable basis of End(E)"
      - id: bare
        label: "bare challenge E"
      - id: eval
        label: "planted word evaluators"
    edges:
      - from: pair
        to: pk
        status: defined
        map: compile words and evaluate them at P_j
      - from: pk
        to: ct
        status: defined
        map: public scalar transfer and random-oracle mask
      - from: ct
        to: bit
        status: adversary_interface
        map: IND-CPA attacker
      - from: bit
        to: ring
        status: failed
        missing_interface: RestrictedEvaluatorsToCompleteRing
      - from: bare
        to: pk
        status: failed
        missing_interface: RealPublicKeySamplerFromBareCurve
      - from: ring
        to: eval
        status: failed
        missing_interface: BasisAlign

  attacker_to_complete_ring:
    required_direction: >-
      Given bare E from D_curve and oracle access to a successful RWCT
      selected-message IND-CPA attacker on the exact real distribution, output
      any complete evaluable rank-four Z-basis of End(E) in polynomial time.
    available_direction: >-
      A planted valid B computes word evaluators and decrypts. This is
      functionality, not the required security direction.
    direct_intermediate_game:
      name: HRT-RWCT
      statement: >-
        Given the real pk, R_j=[r_j]P_j, and either
        H_RWCT(T,([r_j]A_j)_j) or a uniform L-bit string, distinguish which.
      conditional_bound: "Adv_IND-CPA(A) <= 2 * Adv_HRT-RWCT(D)"
      relation_to_endring: open
      classification: separate_scheme_shaped_assumption_not_EndRing
    failed_arrow: >-
      HRT-RWCT or an IND output bit -> complete evaluable End(E) basis.
    why_no_extractor_is_claimed: >-
      Decryption depends only on Q(pk,B), and neither public-key sampling from
      bare E nor recovery of ring structure outside Q is supplied.

  quotient_audit:
    complete_secret: "B=(beta_1,...,beta_4), a planted ordered complete evaluable basis"
    quotient_map: "Q(pk,B)=(w_j(B) restricted to <P_j>)_{j=1}^t"
    factorization: "Dec(B,pk,ct)=Dec_Q(Q(pk,B),pk,ct) for every valid ct"
    proof: >-
      Each valid R_j is [r_j]P_j and Dec makes no query to w_j(B) outside
      <P_j>; the random-oracle input contains only the resulting point tuple.
    consequence: >-
      Complete-ring functional necessity is not established. A proof would
      need an explicit theorem that the restricted tuple efficiently yields a
      complete evaluable ring on this exact distribution.
    limitations:
      - No explicit pair of distinct rings or bases with equal Q is constructed.
      - The audit does not show that obtaining Q is easy.
      - The audit does not exclude a future distribution-specific reconstruction theorem.
    dynamic_word_escape_check: >-
      A word absent from the finite public table makes Enc require B; publishing
      enough composable action to evaluate it publicly also gives the public
      the recipient operation. Neither branch repairs public-key encryption.

  proof_search_map:
    bottleneck: >-
      Convert selected-message IND advantage on the exact real RWCT key
      distribution into any complete evaluable basis of End(E), rather than a
      transfer predictor or restricted word evaluator.
    baseline_embedding:
      parameter_slice: >-
        t=1 and w_1=X_1 reproduces the single-evaluator transfer interface
        described by the frozen gap packet.
      reproduction_check: >-
        Symbolically, KeyGen publishes A=beta_1(P), Enc computes [r]A, and Dec
        computes beta_1([r]P), exactly the frozen conditional identity.
    observation_collision:
      observable: >-
        The public key, valid ciphertexts, random-oracle inputs reached by honest
        decryption, and attacker output bits; all depend on B through planted
        public images and Q(pk,B).
      distinct_preimage_search: >-
        The algebraic equivalence criterion Q(pk,B)=Q(pk,B_tilde) was derived,
        but no concrete distinct valid pair was constructed. This prevents an
        information-theoretic impossibility claim and leaves a reconstruction
        theorem logically open.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Noncommutative words containing all four basis variables, used in
          every ciphertext instead of one evaluator.
        predicted_gain: >-
          Intended to retain ring multiplication/composition in the decryption
          observable; audit shows compilation erases it into Q.
      - transform: observable_fiber
        proposed_object: >-
          Hold Q fixed and vary all unqueried evaluations and ring
          representation data.
        predicted_gain: >-
          Localizes exactly which information a complete-ring extractor must
          recover beyond the functionality transcript; no concrete fiber pair
          is claimed in this packet.
      - transform: representation_reduction
        proposed_object: >-
          A future basis-independent Trap_E map with public evaluation and
          inversion from any complete EndRing basis.
        predicted_gain: >-
          Would remove planted-basis alignment and public-key embedding gaps if
          an explicit map and proof are supplied.
    quantifier_order: >-
      Desired: for every PPT A with nonnegligible IND advantage on keys sampled
      from D_pair, there exists a PPT solver S^A such that for every bare
      challenge E drawn from D_curve, S^A(E) outputs a complete evaluable basis
      with related nonnegligible probability. Established only: for every
      valid planted (pk,B), every selected message m, and every encryption coin
      vector r, the correctness identity holds. The latter does not imply the former.
    method_ceiling:
      strongest_certifiable_claim: >-
        Perfect selected-message correctness for valid planted keys plus a
        conditional IND-to-HRT hybrid; no EndRing security implication.
      nearby_object_control: >-
        Appending the plaintext preserves every ring word and correctness
        relation while making IND trivial. A generic transcript-to-ring
        argument that also accepts this object proves too much.
    proof_obligations:
      - claim: Sample the exact real public key from bare E.
        responsibility: interface
        status: open
      - claim: Convert any valid EndRing basis to planted word evaluators.
        responsibility: representation_reduction
        status: open
      - claim: Recover a complete evaluable basis from IND advantage.
        responsibility: soundness
        status: contradicted_for_the_present_transcript_only_route
      - claim: Bound D_pair sampling and KeyGen rejection.
        responsibility: runtime
        status: open
      - claim: Recover the actual selected plaintext for valid keys.
        responsibility: correctness
        status: proposed_discharge_unreviewed
    not_applicable_reason: null

  controls:
    leaked_plaintext_known_false:
      transformation: Append m to every ciphertext.
      expected_failure: IND confidentiality fails independently of EndRing.
      named_failed_step: attacker output does not identify ring data; extraction fails
      result: symbolic_control_pass
    public_recovery_known_false:
      transformation: Publish Q(pk,B) or composable public word evaluators.
      expected_failure: Anyone computes the recipient transfer tuple and unmasks m.
      named_failed_step: recipient-only asymmetry
      result: symbolic_control_pass
    distribution_bridge:
      comparison: >-
        Real pk contains planted A_j=w_j(B)(P_j); bare EndRing input contains only E.
      result: open
      missing_map: RealPublicKeySamplerFromBareCurve
    quotient_control:
      replacement: Replace B by the abstract restricted evaluator tuple Q(pk,B).
      behavior_change: none on valid decryption inputs
      result: complete_ring_necessity_not_established
    actual_message:
      result: pass_conditional_on_valid_key
      evidence: exact XOR-pad correctness identity in revised-candidate.md
    wrong_key_and_malformed_ciphertext:
      malformed: Noncanonical or out-of-subgroup inputs return bottom.
      wrong_key: A canonical ciphertext can decrypt to an unrelated L-bit string.
      scope: IND-CPA only; no CCA or authenticity claim
    prior_failure_regression:
      forbidden_oracles_used: []
      newly_named_open_interfaces:
        - BasisAlign
        - RestrictedEvaluatorsToCompleteRing
        - RealPublicKeySamplerFromBareCurve

  adversarial_view:
    disclosed:
      - pp, field, E, canonical encodings, random-oracle domain
      - every w_j, N_j, P_j, A_j
      - every challenge R_j and mask C
      - validation and rejection behavior
      - all repeated honest ciphertexts and classical random-oracle histories
    oracle_access:
      random_oracle: polynomial classical queries before and after challenge
      decryption: none
    retained_edge_cases:
      - zero and repeated r_j values
      - word, point-image, ciphertext, and hash-input collisions
      - scalar or zero evaluated words not caught beyond the exact-order check
      - repeated public-key use
      - structurally valid wrong-key decryptions
    side_channels_excluded:
      - timing
      - cache
      - power
      - fault
      - memory disclosure
    concrete_security: absent

  falsifiers_and_revisit_conditions:
    scoped_obstruction_falsifiers:
      - >-
        Exhibit a polynomial RestrictedEvaluatorsToCompleteRing algorithm for
        Q on the exact D_pair distribution with a proved success bound.
      - >-
        Exhibit a polynomial real-public-key sampler from bare E whose output
        distribution is proved identical or negligibly close to RWCT KeyGen.
      - >-
        Exhibit a polynomial BasisAlign algorithm from any valid EndRing output
        to the planted word evaluators with a quantified failure bound.
      - >-
        Give a correctly directed IND-attacker-to-complete-ring reduction that
        explicitly fails on the leaked-plaintext control.
    correctness_falsifiers:
      - A valid key/message/coin tuple for which canonical sender and recipient random-oracle inputs differ.
      - A permitted exceptional input not covered by the stated bottom behavior.
    interpretation_limits:
      - Failure of these repairs does not imply universal EndRing-PKE impossibility.
      - HRT-RWCT hardness is not EndRing hardness.
      - Symbolic checks are not experiments or independent review.

  inventor_accounting:
    object: Polynomial tables of compiled noncommutative ring-word evaluators as a PKE trapdoor interface.
    depth_of_verified_structure: symbolic_unreviewed
    dominated_by: n/a (no secure construction or attack claimed)
    sota_delta: >-
      Zero security or attack improvement; one exact correctness shell and one
      scoped factorization/alignment obstruction.
    enumerated_closures:
      - >-
        Finite compiled words factor through restricted evaluators and do not
        make complete-ring extraction a functional consequence.
      - >-
        Dynamic words either require the secret in Enc or publish an operation
        that also enables recovery.
    open_directions:
      - >-
        A basis-independent Trap_E map publicly samplable from bare E,
        invertible from any complete EndRing basis, and equipped with a
        complete-ring extraction theorem that survives the quotient control.
    decision_changing_next_action: >-
      Specify and audit one exact Trap_E candidate before constructing another
      encryption wrapper.

  output_artifacts:
    - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-8ab26c/revised-candidate.md
    - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-8ab26c/revised-scheme-contract.yaml
    - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-8ab26c/revision-map.yaml

