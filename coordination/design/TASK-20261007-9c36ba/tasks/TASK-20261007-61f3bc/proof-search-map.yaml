proof_search_map:
  task_id: TASK-20261007-61f3bc
  candidate: ER-seeded McEliece PKE
  bottleneck: >-
    Construct a correctly distributed ER-McE public key from a bare EndRing
    challenge E without knowing End(E), then use an IND-CPA distinguisher to
    output a complete evaluable basis of End(E). The ring-derived code matrix
    blocks the embedding and plaintext advantage does not expose a ring basis.
  baseline_embedding:
    parameter_slice: >-
      Fix the code trapdoor and omit E. The remaining syntax is ordinary
      randomized McEliece encryption c=mG_pub+e. Fix End(E) and run CanRing
      twice from GL_4(Z)-equivalent bases as the canonicalization slice.
    reproduction_check: >-
      Symbolically derive cP^-1=(mS)G_sec+eP^-1 and require identical canonical
      ring strings for equivalent bases. No experiment was run in this task.
  observation_collision:
    observable: >-
      The IND-CPA adversary's output bit and advantage, compared with the
      ground-truth complete ring basis/canonical string.
    distinct_preimage_search: >-
      Exhibit two worlds with the same useful plaintext distinguisher but
      different or unavailable EndRing witnesses, including the known-false
      ciphertext (m,c). If the adversary transcript is unchanged while the
      required ring output changes, extraction from advantage alone fails.
  constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        A simulator that maps bare E to a correctly distributed ring-seeded
        G_pub without computing the ring, plus an extractor from IND advantage
        to an accepted evaluable End(E) basis.
      predicted_gain: >-
        Would supply the missing correctly directed reduction if both the
        distribution and extraction proofs hold with polynomial loss.
    - transform: observable_fiber
      proposed_object: >-
        Fibers of public matrices/adversary transcripts over canonical EndRing
        witnesses and over independently weak code instances.
      predicted_gain: >-
        A collision can show exactly why the scheme breaker does not identify
        an EndRing solution, yielding a scoped O5 obstruction.
  quantifier_order: >-
    For every lambda and every PPT IND-CPA adversary A with nonnegligible
    advantage over exact ER-McE keys, there must exist a PPT solver B which,
    for E sampled from Walk-ER before A's coins are fixed, constructs A's view
    and outputs an accepted complete evaluable basis of End(E), except with an
    explicitly bounded abort probability. No witness may be chosen before the
    EndRing instance or supplied to the simulator.
  method_ceiling:
    strongest_certifiable_claim: >-
      At best this method gives a black-box classical-ROM reduction for the
      exact path-generated distribution. It cannot by itself establish QPT or
      QROM security, uniform-curve EndRing hardness, concrete parameters, or
      CCA security.
    nearby_object_control: >-
      Ciphertext (m,mG_pub+e) is trivially distinguishable/decryptable yet need
      not reveal End(E). Any extractor that also succeeds there proves too much.
  proof_obligations:
    - claim: bare E challenge can be embedded as an exact ER-McE public key
      responsibility: distribution and auxiliary-data simulation
      status: open
    - claim: adversary advantage yields an accepted complete evaluable ring basis
      responsibility: extraction in the required direction
      status: open
    - claim: advantage loss is polynomial and abort probability negligible
      responsibility: quantitative reduction
      status: open
    - claim: CanRing agrees on every accepted representation of End(E)
      responsibility: representation correctness and runtime
      status: open
    - claim: code-decoding hardness is implied by EndRing rather than separate
      responsibility: assumption minimization
      status: open
    - claim: conditional decryption returns the selected message
      responsibility: correctness baseline
      status: proposed_discharge
  falsifiers:
    - public matrix generation requires the unknown canonical ring string
    - a successful scheme attacker exposes only a plaintext bit or code decoder, not an EndRing witness
    - the known-false plaintext-appended scheme passes the same claimed extractor
    - two equivalent ring bases canonicalize differently
    - a public structural decoder breaks Seeded-Goppa-IND without solving EndRing
  not_applicable_reason: null

