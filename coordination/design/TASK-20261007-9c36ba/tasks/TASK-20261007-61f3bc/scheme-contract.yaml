    primitive: pke
    status: conjectured
    adversary: PPT
    oracle_model: ROM
    oracle_query_access: classical
    game_definition: Challenger generates pk,sk; adversary receives pk and submits equal-length m0,m1 in F_2^k; challenger samples b and an independent uniform weight-t error and returns Enc(pk,mb); adversary outputs b-prime.
    advantage_convention: abs(Pr[b-prime=b]-1/2)
    query_bounds: {hash_queries: polynomial, encryption_computations: polynomial}
    oracle_access_and_challenge_exclusions: no decryption oracle; all hash/XOF interfaces are public and domain separated
    assumptions: [Seeded-Goppa-IND, Aux-ER-McE only as a key-recovery attack target]
    theorem_artifact: null
    review_artifact: null

