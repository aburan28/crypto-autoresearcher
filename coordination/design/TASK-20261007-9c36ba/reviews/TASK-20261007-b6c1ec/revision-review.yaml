red_team_report:
  id: RT-20261007-b6c1ec
  task_id: TASK-20261007-b6c1ec
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  batch_id: BATCH-65c2dd
  reviewed_candidate: RWCT-PKE
  claim_under_review: >-
    The gap-fed revised packet repairs GAP-CEST-COMPLETE-RING-EXTRACTION
    without weakening selected-message IND-CPA or moving the missing result
    into an unstated assumption.
  review_kind: independent_symbolic_red_team
  overall_verdict: breaks
  selected_gap_repaired: false
  experiments_run: 0
  primary_sources_read: 0
  security_established: false
  novelty_established: false
  deployability_established: false
  universal_impossibility_established: false

  snapshot_verification:
    snapshot_task_id: TASK-20261007-8116c4
    queue_archive_commit: c020468c0e27cb46528fa644296ba69977ea742d
    commit_object_present: true
    content_hashes_match_receipt: true
