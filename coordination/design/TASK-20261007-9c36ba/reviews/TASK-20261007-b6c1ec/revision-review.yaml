      - path: coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-8ab26c/revised-candidate.md
        sha256: 761c95cfb2e8c842b44054e3838d6cc95a65a1079b1624dd88c351fd1c712f06
      - path: coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-8ab26c/revised-scheme-contract.yaml
        sha256: f235023ec8a8e8596957782259fc720915955851a31f44067246e4027bd21706
      - path: coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-8ab26c/revision-map.yaml
        sha256: 2eae0006ec9747a4e602e19d27358d0059a5fa57ec1c9bb9ba8f4c98b0b9b29a

  joint_verdicts:
    - joint: "R1: selected gap is actually discharged under the unchanged contract"
      verdict: breaks
      reason: >-
        The revised algorithms still expose only finitely many scalar-transfer
        observations. Decryption factors through the listed word actions on
        the listed cyclic subgroups, and no theorem converts those observations
        to a complete evaluable ring. Moreover the stated word syntax permits
        a direct replay of the one-evaluator case: the valid descriptor
        X_1+(X_2-X_2)+(X_3-X_3)+(X_4-X_4) contains every variable but evaluates
        to X_1. No semantic non-cancellation or complete-ring-sensitivity check
        excludes it, and the descriptor sampling distribution is unspecified.
      exact_failed_arrows:
        - "bare E -> real RWCT public key containing correlated A_j values"
        - "IND-CPA adversary on the real RWCT distribution -> complete evaluable End(E) basis"
        - "arbitrary complete EndRing basis -> planted-basis word evaluators"
      gap_status: not_repaired
    - joint: "R2: O1-O3 syntax and actual-message correctness"
      verdict: breaks
      reason: >-
        The displayed transfer identity is correct for a valid planted tuple,
        but the declared scheme is not a complete typed PKE. KeyGen returns
        sk=B while Dec(sk,ct) reads the associated pk, pp, and every public word
        descriptor without receiving or storing them. D_pair, the word sampler,
        torsion-family generation, integer-constant size bounds, and retry tails
        are also absent. The r_j=0 case additionally requires the parser to
        accept the identity as a subgroup member; the phrase "exact-order
        subgroup" must not be implemented as an exact-order-N_j test on R_j.
      surviving_correctness_evidence: >-
        If sk is explicitly augmented by the associated canonical (pp,pk), all
        R_j in the subgroup including the identity are accepted, and KeyGen has
        returned a valid planted key, then Z'_j=w_j(B)([r_j]P_j)=[r_j]A_j for
        every j and the same canonical random-oracle input yields the selected
        plaintext with conditional error zero.
      gap_status: conditional_identity_only
    - joint: "R3: O4-O6 functionality, reduction direction, and complete view"
      verdict: breaks
      reason: >-
        Conditional recipient functionality is present, but it does not require
        a complete ring and no correctly directed reduction to Bare-EndRing is
        supplied. HRT-RWCT and Aux-RWCT-EndRing remain separate scheme-shaped
        assumptions. The view audit records many edge cases but cannot repair
        the missing key distribution, ill-typed decryption context, ambiguous
        zero-coin validation, or undefined wrong-key cross-curve behavior.
      exact_failed_arrows:
        - "Bare-EndRing challenge E -> exact real KeyGen view"
        - "black-box access to a successful IND adversary -> complete rank-four evaluable basis"
        - "restricted word-evaluator tuple -> complete ring, with a polynomial representation and loss bound"
      gap_status: functionality_conditional_security_open

  obligation_verdicts:
    O1:
      artifact_status: open
      reviewer_verdict: open
      rationale: >-
        Bare-EndRing is named but its sampler is only the marginal of the
        unavailable D_pair. The parameterized curve/torsion family, exact
        efficient sampler, evaluator/certificate representation, and real-key
        distribution are not supplied. Aux-RWCT-EndRing is correctly kept
        separate and does not discharge O1 for bare EndRing.
    O2:
      artifact_status: open
      reviewer_verdict: open
      rationale: >-
        KeyGen lacks D_pair, an exact word-descriptor law, torsion generation,
        and rejection bounds. Dec is ill-typed because sk=B omits the pk and pp
        that Dec reads. Bounding straight-line-program operation count d also
        does not bound encoded integer constants unless their bit lengths are
        separately bounded.
    O3:
      artifact_status: proposed_discharge
      reviewer_verdict: open
      rationale: >-
        The algebraic equality is independently rechecked and holds under the
        explicit valid-key, associated-pk, and subgroup-membership conditions.
        It is not yet a theorem for the declared interface because Dec lacks
        its context, KeyGen is unavailable, and identity-point acceptance is
        ambiguous. Thus the identity survives but O3 is not a reviewed discharge.
    O4:
      artifact_status: proposed_discharge
      reviewer_verdict: open
      rationale: >-
        Sender scalar transfer and planted-basis evaluation meet for valid
        tuples. Recipient behavior nevertheless factors through the compiled
        evaluators. The packet neither proves that its abstract restricted
        functions have a smaller polynomial representation nor that they fail
        to determine the full ring on the real distribution. Complete-ring
        necessity is therefore open, not contradicted.
    O5:
      artifact_status: contradicted
      reviewer_verdict: open
      rationale: >-
        The packet correctly identifies three absent arrows, so it contains no
        EndRing security reduction. Absence of an extractor is not itself a
        counterexample or no-reduction theorem. Because no two valid secrets
        with the same observation and different complete-ring answer are
        constructed, and no meta-reduction is given, "contradicted" and
        "refuted_scoped" overstate the evidence. The route is incomplete.
        The HRT hybrid targets only HRT-RWCT; its advantage convention is not
        defined well enough to audit the claimed factor two.
    O6:
      artifact_status: proposed_discharge
      reviewer_verdict: open
      rationale: >-
        The packet lists the main mathematical IND-CPA disclosures and excludes
        side channels explicitly. It still lacks an exact word/key distribution,
        executable Dec context, an unambiguous r_j=0 validation rule, and typed
        wrong-key behavior when the key and ciphertext curves differ. These
        omissions prevent a complete adversarial-view discharge.

  objections:
    - id: OBJ-RWCT-1
      severity: decisive
      affected_obligations: [O1, O5]
      statement: >-
        A Bare-EndRing challenge contains no planted B, so the reduction cannot
        sample the correlated A_j=w_j(B)(P_j) values of the exact real public
        key. Random replacements have neither a distribution proof nor a
        consistent secret-key witness.
    - id: OBJ-RWCT-2
      severity: decisive
      affected_obligations: [O4, O5]
      statement: >-
        The observation Q is only asserted to be a smaller quotient. No compact
        polynomial representation, strict information loss, collision fiber,
        or failure of a distribution-specific reconstruction theorem is shown.
        Exact factorization proves which calls Dec makes, not a no-extraction result.
    - id: OBJ-RWCT-3
      severity: decisive
      affected_obligations: [O1, O4, O5]
      statement: >-
        Syntactic occurrence of all four variables is defeated by cancellation.
        The allowed word X_1+(X_2-X_2)+(X_3-X_3)+(X_4-X_4) recreates the original
        single-evaluator interface whenever its image passes the stated order check.
    - id: OBJ-RWCT-4
      severity: blocking_for_formal_correctness
      affected_obligations: [O2, O3, O6]
      statement: >-
        KeyGen declares sk=B, yet Dec needs the associated pp and pk to recover
        w_j, P_j, the transcript T, and validation domains. Dec(sk,ct) is therefore
        undefined as written.
    - id: OBJ-RWCT-5
      severity: blocking_for_unconditional_correctness
      affected_obligations: [O2, O3]
      statement: >-
        Uniform r_j includes zero. Correctness holds only if Dec accepts the
        identity as a member of the order-N_j subgroup; an exact-point-order
        test would reject an honestly generated ciphertext. The frozen parser
        language does not make this distinction explicit.
    - id: OBJ-RWCT-6
      severity: scope_correction
      affected_obligations: [O5]
      statement: >-
        The packet's exact factorization plus three missing maps supports an
        incomplete-route finding. It does not support refuted_scoped or a
        family-level obstruction because it supplies neither a collision pair
        nor a no-reduction theorem.

  required_controls:
    - leaked_plaintext_known_false
    - public_recovery_known_false
    - distribution_bridge
    - quotient
    - actual_message
    - malformed_and_wrong_key
    - prior_failure_regression

  control_results:
    leaked_plaintext_known_false:
      verdict: pass_detects_invalid_proof
      symbolic_execution: >-
        Modify ct to include m_b. The adversary reads the appended plaintext
        and guesses b with probability one in both the real-pad and uniform-pad
        worlds. Therefore a distinguisher that merely tests whether that
        adversary guessed b has the same output distribution in both worlds;
        the real-to-random hybrid gap is zero despite IND advantage 1/2. Any
        unchanged transcript-to-ring extraction fails at the extraction step.
    public_recovery_known_false:
      verdict: pass_detects_lost_asymmetry
      symbolic_execution: >-
        Publish an evaluator for q_j on each admitted R_j. Anyone computes all
        Z_j=q_j(R_j), reconstructs the exact domain-separated hash input, and
        unmasks C. Recipient-only functionality and HRT-RWCT both fail.
    distribution_bridge:
      verdict: fails_required_bridge
      symbolic_execution: >-
        The bare input supplies E only; the real pk supplies word descriptors
        and A_j values jointly correlated with an erased planted B. No exact or
        statistically close sampler for those fields from E is supplied.
    quotient:
      verdict: inconclusive_as_obstruction
      symbolic_execution: >-
        Dec's mathematical output depends only on the restrictions of w_j(B)
        to the admitted cyclic inputs, so the functional factorization holds.
        The packet does not prove this tuple has a smaller efficient
        representation or a nontrivial fiber, so complete-ring reconstruction
        remains open rather than impossible.
    actual_message:
      verdict: conditional_pass
      symbolic_execution: >-
        For a valid planted tuple and well-typed Dec context, endomorphism
        Z-linearity gives identical Z_j values and XOR recovers exactly m. This
        is PKE message recovery, not merely endpoint or KEM-key agreement.
    malformed_and_wrong_key:
      verdict: breaks_complete_specification
      symbolic_execution: >-
        Canonical malformed points can be rejected once pp and pk are present,
        but they are not inputs to Dec as declared. A wrong key from another
        curve makes evaluation ill-typed rather than necessarily returning an
        unrelated L-bit string. A same-curve misaligned key may return a string;
        the two cases need separate rules.
    prior_failure_regression:
      verdict: partial_pass_with_one_regression
      symbolic_execution: >-
        No C-star, SecretLift, EndpointLift, target-frame, admission decoder,
        digit-loop, or ER-McE oracle is silently assumed. The three new missing
        maps are named. However syntactic all-variable words can cancel to a
        single evaluator, replaying the original quotient failure on allowed syntax.

  counterexample_or_mutation:
    name: cancelling_all_variable_word
    construction: "w=X_1+(X_2-X_2)+(X_3-X_3)+(X_4-X_4)"
    validity_against_written_syntax: >-
      The descriptor contains every variable and has constant straight-line
      length. Whenever beta_1(P) has the required exact order, the KeyGen order
      check accepts the slot.
    effect: >-
      w(B)=beta_1, so the slot is exactly the prior single-evaluator transfer.
      Repeating it across slots makes the advertised use of all four basis
      elements purely syntactic.
    scope: >-
      This falsifies semantic diversity for the written word domain. It does
      not prove that every possible descriptor distribution or every EndRing
      PKE factors through one evaluator.

  baseline_comparison: >-
    RWCT-PKE's sender/recipient computation is a polynomial tuple of
    same-scalar transfers. Its only stated confidentiality object is HRT-RWCT;
    no improvement over, or reduction to, Bare-EndRing is established. No
    concrete parameter or cost comparison is claimed or reviewable.
  heuristic_challenges:
    - D_pair and the word-descriptor distribution are placeholders, not stated heuristics with falsification bounds.
    - No claim is made that random compiled words semantically depend on four independent ring directions.
  cost_model_challenges:
    - KeyGen retry probability and torsion-generation cost are unbounded.
    - Straight-line operation count does not bound integer-constant bit lengths.
    - A compact polynomial representation of the restricted evaluator tuple Q is not supplied.
  reduction_and_scope_challenges:
    - Missing exact real-key embedding from a bare curve-only EndRing challenge.
    - Missing black-box or non-black-box attacker-to-complete-ring extraction.
    - Missing alignment from an arbitrary EndRing basis to planted variables; this affects complete-ring sufficiency, not merely extraction.
    - HRT-RWCT and Aux-RWCT-EndRing must remain separate assumptions.
  proof_architecture_challenges:
    - >-
      Observation-fiber audit finds an exact factorization but no explicit
      cross-conclusion fiber; the claimed obstruction is therefore inconclusive.
    - >-
      Nearby-object leaked-plaintext control preserves the algebraic transfer
      transcript while making confidentiality false, locating the missing
      security-specific extraction step.
    - >-
      Compositional mutation by cancellation deletes three basis directions
      while preserving the written all-variable syntax.

  narrowest_supported_statement: >-
    For any supplied valid planted RWCT tuple, after augmenting decryption with
    its associated canonical pp and pk and accepting every subgroup member
    including the identity, the displayed scalar-transfer identity recovers
    the selected L-bit plaintext with conditional error zero. The frozen packet
    usefully exposes three missing maps and an exact functional factorization.
    It does not repair GAP-CEST-COMPLETE-RING-EXTRACTION, establish IND-CPA
    from EndRing, or prove a scoped impossibility for the whole compiled-word
    family.
  scoped_obstruction_verdict: inconclusive
  scoped_obstruction_reason: >-
    No strict efficient quotient, collision pair, meta-reduction, or
    reconstruction impossibility is proved. The evidence supports an
    incomplete proposed route, not a family-level no-go result.
  next_concrete_action: >-
    Before another wrapper, define one basis-independent Trap_E interface with
    an exact sampler from bare E, inversion from any complete evaluable basis,
    an explicit efficient quotient/non-factorization statement, and a
    correctly directed IND-adversary-to-complete-ring extraction. If RWCT is
    retained as a correctness shell, first type sk=(B,pp,pk), define the word
    distribution and semantic non-cancellation predicate, and specify identity
    acceptance and wrong-key domains.

