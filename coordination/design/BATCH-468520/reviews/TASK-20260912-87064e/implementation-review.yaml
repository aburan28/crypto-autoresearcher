      carried_conditions:
        - Planted normalization depends on the caller passing planted_sink (see C8 carried condition).
      breaking_artifact_found: false

    - joint: C11 EndpointTable.insert_if_absent
      verdict: PASSED
      spec_citation: >-
        specification.yaml line 276 (table.key: full canonical affine endpoint;
        linear probing; retain earliest on equality) and lines 258-262
        (distinguish full point equality from table-hash collision).
      source_citations:
        - 'rho.py:196  idx = self._probe_index(key_hash)'
        - 'rho.py:198  while idx in self.slots:'
        - 'rho.py:201-202  if occupant.x == slot.x and occupant.y == slot.y: return False, occupant'
        - 'rho.py:203-210  full-table guard, then idx = (idx + 1) % capacity; probes += 1'
        - 'rho.py:211-220  post-loop: load/resize guard, then insert into the empty idx; no `if idx in self.slots` dead branch remains'
      argument: >-
        On an occupied slot the stored 32-byte x and y are compared with the
        candidate's x and y. A match returns (False, occupant) immediately and
        keeps the earliest endpoint. A mismatch, meaning a real table-hash
        collision at a different endpoint, continues linear probing. The
        comparison uses stored coordinates, not key_hash, so a hash collision
        is never reported as an endpoint collision.
      observations_non_blocking:
        - >-
          The equality test does not compare `status`. The spec says identity
          is encoded by status with zero coordinates (spec line 278). An
          identity endpoint and a finite endpoint with x=y=0 would therefore
          compare equal. The order-two point (0,0) exists only on the reduced
          a=1 curves and is outside an odd prime-order rho subgroup, so this
          only matters if the future walk can store the identity or a
          2-torsion endpoint. It is recorded for the rho launcher review and
          does not match this joint's breaking_artifact.
        - >-
          Table doubling is not implemented; the method refuses rather than
          resizes (211-217). That behavior is outside C11 and is not silent
          data loss.
      breaking_artifact_found: false

    - joint: C12 cgroup cpu.max and exact pids.max==3
      verdict: PASSED
      spec_citation: >-
        specification.yaml lines 352-356: memory.max=8*2^30, memory.swap.max=0,
        "Freeze pids.max=3", "Set cpu.max to 300000 100000 for rho or 100000
        100000 for arithmetic"; line 360 missing delegation/readback refuses.
      source_citations:
        - 'driver.py:193  REQUIRED_PIDS_MAX = 3'
        - 'driver.py:194-197  REQUIRED_CPU_MAX_BY_JOB = {"arithmetic": "100000 100000", "rho": "300000 100000"}'
        - 'driver.py:236-247  _read_int_file returns None for missing file, "max", or parse error'
        - 'driver.py:278  if pids_max != REQUIRED_PIDS_MAX: refuse'
        - 'driver.py:288-298  unknown job_kind refuses'
        - 'driver.py:299  if cpu_max != required_cpu: refuse'
        - 'driver.py:223-225  job_type alias overrides job_kind when supplied'
      argument: >-
        The pids.max predicate is `!= 3`, so 1, 2, None ("max", missing, or
        unparseable) and any value above 3 all refuse. cpu.max is read as a
        stripped string and must exactly equal the per-job string, and an
        unknown job type refuses. memory.max and memory.swap.max are also
        exact-match readbacks.
      alias_behavior_as_coded: >-
        job_kind defaults to "arithmetic". The keyword-only job_type, when not
        None, replaces job_kind (job_type wins if both are given).
      observations_non_blocking:
        - >-
          Because job_kind defaults to "arithmetic", a future rho caller that
          omits the selector would require "100000 100000". That fails closed
          on a correctly configured rho cgroup (300000 100000). It admits a
          rho job only if the cgroup was itself misconfigured to the
          arithmetic quota. The launcher review should require an explicit
          selector.
      breaking_artifact_found: false

  proves_too_much:
    - object: Pre-repair Y3 using C-B for both products (Y3 = M(j, C-B) - M(V1, C-B))
      matching_argument: >-
        The first product's second operand must be bound by dataflow to
        B.sub(X3), where X3 = D-B-C and B = M(U1,A).
      result_on_object: FAILS
      detail: >-
        In the old form the first product's second operand is C.sub(B), not
        B.sub(X3). The argument rejects it. The algebraic check also rejects
        it: j*(C-B)-V1*(C-B) = (j-V1)*h^3 is not j*(U1*h^2-X3)-V1*h^3 in
        general. The argument does not prove too much.
    - object: Pre-repair insert_if_absent whose while-loop exits only on an empty slot
      matching_argument: >-
        The body of `while idx in self.slots` must contain a return path
        taken when the occupant's stored (x, y) equals the candidate's (x, y),
        and must advance idx only on mismatch.
      result_on_object: FAILS
      detail: >-
        The old loop has no in-loop return on equality. It always advances to
        an empty slot and inserts a duplicate, and its post-loop
        `if idx in self.slots` branch is unreachable. The argument rejects it.
        The argument does not prove too much.

