    spec_token_string: 'Y3=M(j,B-X3)-M(V1,C-B)  (specification.yaml line 158)'
    first_product: {op: M, operand_1: j, operand_2: 'B - X3'}
    second_product: {op: M, operand_1: V1, operand_2: 'C - B'}
    combination: first_product minus second_product
    token_definitions: >-
      h=U2-U1; j=V2-V1; A=S(h); B=M(U1,A)=U1*h^2; C=M(U2,A)=U2*h^2; D=S(j);
      X3=D-B-C (spec lines 157-158).
    consistency_check: >-
      C-B=(U2-U1)h^2=h^3, so X3=j^2-h^3-2*U1*h^2 and
      Y3=j*(U1*h^2-X3)-V1*h^3, which is the standard Jacobian common-Z
      addition. The first product's second operand is B-X3. Only the second
      product's second operand is C-B.
    agreement_with_implementation: >-
      Agrees. arithmetic.py lines 322-326 (point_add) and 548-552
      (point_add_planted) compute M(j, B-X3) - M(V1, C-B), with the operand
      order confirmed by FieldElement.sub returning self-other (line 195-197).
      No disagreement.

  joints:
    - joint: C6 generic ADD Y3
      verdict: PASSED
      spec_citation: 'specification.yaml line 158: Y3=M(j,B-X3)-M(V1,C-B)'
      source_citations:
        - 'arithmetic.py:320  X3 = D.sub(B, counters).sub(C, counters)'
        - 'arithmetic.py:322  BX3 = B.sub(X3, counters)'
        - 'arithmetic.py:323  CB = C.sub(B, counters)'
        - 'arithmetic.py:324-326  Y3 = _top_level_mul(j, BX3, ...).sub(_top_level_mul(V1, CB, ...), counters)'
        - 'arithmetic.py:548-552  point_add_planted, same dataflow through planted_mul'
      argument: >-
        Dataflow trace, not text match. BX3 and CB are each assigned exactly
        once in each function and are not rebound before use. BX3 is bound to
        B.sub(X3), where B=M(U1,A) (line 317) and X3=D-B-C (line 320). The
        first product's second operand is BX3=B-X3. The second product is
        M(V1, C-B). sub is self-other (lines 195-197), so the operand order
        matches. Per-call-site count: point_add has 12 top-level M call sites
        (lines 295-301, 317, 318, 324, 325, 327) and 4 S call sites (293, 294,
        316, 319), matching spec lines 159-160 (generic full ADD is twelve M
        and four S).
      breaking_artifact_found: false

    - joint: C8 scalar_multiply normalization ownership
      verdict: PASSED
      spec_citation: >-
        specification.yaml lines 140-144 (scalar_algorithm, "Normalize the final
        R once") and line 172 (normalization: zi=I(Z), z2=S(zi), z3=M(z2,zi),
        x=M(X,z2), y=M(Y,z3); three M, one S, one I).
      source_citations:
        - 'arithmetic.py:419-433  docstring: normalization is a deliberate caller responsibility; returns the raw unnormalized Jacobian point R'
        - 'arithmetic.py:442  return R  (no normalize call inside scalar_multiply)'
        - 'arithmetic.py:387-403  normalize(): inv 398, sqr 399, _top_level_mul 400/401/402, i.e. 3M+1S+1I; identity returns (None, None) with no inversion'
        - 'arithmetic.py:615-617  scalar_multiply_planted docstring inherits the same contract; 628 returns raw R'
      call_site_search: >-
        rg over driver.py, rho.py, fixture_generator.py, count_predictor.py and
        independent_checker.py found no call to scalar_multiply,
        scalar_multiply_planted, scalar_multiply_null or normalize outside
        arithmetic.py. The only hit is independent_checker.py:148
        affine_scalar_multiply, which is the checker's own affine routine and
        does not consume Jacobian output. No call site treats the raw return
        as affine.
      argument: >-
        Closed as a documented caller-responsibility contract, not a behavior
        change. This matches the coordinator prior. The docstring no longer
        claims in-routine normalization, and normalize() matches spec line 172
        exactly.
      carried_conditions:
        - >-
          The spec's scalar routine includes a single final normalization,
          and the planted exact_count_identity (spec line 179) compares whole
          routines. The future composing launcher must therefore call
          normalize() exactly once per scalar on the same counters object. For
          the planted routine it must pass planted_sink=sink_state; normalize
          accepts that argument at line 389. Otherwise M_planted=2*M_reference
          fails by 3 M per scalar. No composing call site exists yet, so this
          cannot be checked now and must be checked when the launcher is
          reviewed.
        - >-
          Wording inconsistency, not a defect: scalar_multiply calls the
          choice deliberate (line 419), while scalar_multiply_planted calls it
          "the same caller-composition gap C8 recorded" (lines 615-616). Both
          describe the same behavior.
      breaking_artifact_found: false

    - joint: C9 planted scalar composition
      verdict: PASSED
      spec_citation: >-
        specification.yaml lines 173-179: replace each top-level M(a,b) by two M
        evaluations, compare, sink, return first; do not duplicate inside S or
        I; M_planted=2*M_reference, S and I unchanged.
      source_citations:
        - 'arithmetic.py:257-265  _top_level_mul routes to planted_mul when planted_sink is not None, else FieldElement.mul'
        - 'arithmetic.py:456-481  planted_mul: two a.mul calls (470, 471), comparison 472, SHA-256 sink 477-480, returns r1'
        - 'arithmetic.py:606-628  scalar_multiply_planted: point_double(..., planted_sink=sink_state) 624, point_add(..., planted_sink=sink_state) 627'
        - 'arithmetic.py:507-555  point_add_planted: planted_mul at 527-533, 544, 545, 550, 551, 553 (12 sites), sqr at 525, 526, 543, 546'
        - 'arithmetic.py:558-598  point_double_planted: planted_mul at 593 (1 site)'
      ast_call_inventory: >-
        AST walk of arithmetic.py. FieldElement .mul is called only inside
        _top_level_mul (264, unplanted branch) and planted_mul (470, 471). In
        point_add, point_double and normalize, every M goes through
        _top_level_mul: 12, 1 and 3 sites. point_add's exceptional branch
        forwards planted_sink to point_double (307). point_add_planted and
        point_double_planted call planted_mul directly, 12 and 1 sites, and
        point_add_planted recurses to point_double_planted (538). S (sqr) and I
        (inv) never enter _top_level_mul or planted_mul.
      argument: >-
        All three planted routines exist. Every top-level M on the planted
        composition path (scalar_multiply_planted, then point_add/point_double
        with planted_sink) resolves to planted_mul, with no leftover
        FieldElement.mul. S and I are unchanged. The explicit mirror routines
