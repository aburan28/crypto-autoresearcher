    expectation: >-
      The v2 grammar and conservative fallback rules should close the prior
      nondeterminism, but may be too narrow to account for a supported schema
      shape or may leave an unrecognized generalization wrongly eligible for a
      verdict. The reviewer must identify an actual accepted counterexample,
      not rely on a possible future implementation choice.
