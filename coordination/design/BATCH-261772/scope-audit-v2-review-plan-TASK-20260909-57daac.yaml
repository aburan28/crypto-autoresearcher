  joints:
    - task_id: TASK-20260909-57daac
      assigned_to: TASK-20260909-57daac
      role: red-team
      joint: deterministic_selector_vector_and_nonduplication_repair_v2
      scope: >-
        Absolute selector grammar and exclusion accounting, three normalized
        comparison types, semantic-generalization handling, the exact widened
        control, and linkage/membership non-duplication gate.
      attack_plan: >-
        Try a negative outside every allowed path, a root-level statement with
        noncolocated citation, an invalid interval, an unmarked prose scope, a
        marked prose scope, a widened canonical set, and an L3-only linkage
        row with a vector comparison. For each, prove an exact v2 route to an
        exclusion, unauditable, inconclusive, overbroad, or non-duplication
        gate failure; otherwise report the admitted ambiguity. No live corpus
        traversal, code, fixture, or run is allowed.
      known_false_controls:
        - negative_outside_grammar_is_silent
        - missing_colocated_citation_is_overbroad
        - untyped_prose_is_clean_or_overbroad
        - widened_target_family_set_is_clean
        - l3_only_linkage_passes_nonduplication
  proves_too_much:
    objects:
      - A record whose negative token lies outside the allowed root-level statement grammar.
      - A resolved EXP-JINV-606dce linkage row with vector_comparison_present true.
    failure_signature: >-
      The first must be accounted for only as an exclusion, and the second
      must fail the non-duplication gate. If either can become clean,
      overbroad, or mechanically distinct, the repair breaks.
    assigned_to: TASK-20260909-57daac
  blind_rederivation:
    required: false
    rationale: This is a finite source-definition review without a numerical quantity.
  outcome_rule: >-
    A holds verdict supports only a later Coordinator decision on canonical
    proposed records. It cannot authorize a corpus audit, implementation, or execution.
