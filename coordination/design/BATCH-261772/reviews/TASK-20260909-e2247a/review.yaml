  joint:
    id: selector_taxonomy_control_and_duplicate_boundary
    verdict: breaks
    conclusion: >-
      The draft is not sufficiently specified to support canonical proposed
      records. Its claimed deterministic selector and typed comparator leave
      material choices unspecified, so the four controls and the JINV
      non-duplication gate cannot be mechanically replayed from the frozen
      contract.
  attack_results:
    missing_cited_binding_cannot_become_overbroad:
      result: holds
      evidence: >-
        The decision rule gives unauditable precedence over overbroad, and
        lines 141-146 of the frozen specification explicitly prohibit an
        absent, ambiguous, unreadable, or schema-missing cited binding from
        being relabeled overbroad. This is a source-level property only; no
        binding was resolved.
    prose_generalization_cannot_become_clean_or_overbroad_automatically:
      result: breaks
      counterexample: >-
        A selected statement may contain prose whose scope is a legitimate
        theorem-level generalization while otherwise exposing values that an
        implementer normalizes into equal or strict-superset typed fields. The
        inconclusive rule applies only when the record marks or documents the
        generalization, but neither frozen_corpus_selector nor
        extraction_schema defines a semantic-generalization marker, its
        permitted location, its required value, or a normalization rule. The
        clean rule likewise refers to a marker that has no defined extractor.
      consequence: >-
        One conforming implementation can fail to surface the prose and emit
        clean or overbroad, while another can surface it and emit inconclusive.
        The legitimate_generalization_control therefore has no source-level,
        mechanically decidable expected verdict.
    widened_typed_field_cannot_become_clean:
      result: breaks
      counterexample: >-
        The specification names field types and possible relation labels, but
        supplies neither canonical YAML paths and normalization rules for the
        ten conclusion and coverage fields nor a partial-order definition for
        each type. In particular, structured_descriptor and
        numeric_interval_or_structured_tuple have no declared encoding or
        strict-superset operation. A conclusion that widens one such field can
        therefore be represented as noncomparable, equal, or missing by
        different conforming extractors rather than deterministically as a
        strict superset.
      consequence: >-
        The widened_control's promise of exactly one predeclared recognized
        field does not identify the field or its comparator in the frozen
        contract. It cannot establish the required rejection of a widened
        field that would otherwise be classified clean.
    selected_negative_cannot_disappear_through_a_listed_schema_location:
      result: breaks
      counterexample: >-
        The tokens conclusions[], conclusion, findings[], findings, claims[],
        and claims are labels rather than an absolute YAML-path grammar. The
        contract does not state whether they are root-relative or recursive,
        whether the token and citation must share a statement node, or how a
        mapping/list wrapper is traversed. A negative token in a listed
        conclusion location whose citation is at the enclosing record or whose
        statement is wrapped by another listed location has no unique
        inclusion decision. One implementation can emit an exclusion row and
        another can select it.
      consequence: >-
        The complete-corpus selector and exclusion accounting are not
        deterministic. A selected negative can disappear as an exclusion or
        be counted in a different statement boundary without an anomaly that
        the frozen contract requires to be reported.
    jinv_l3_table_row_cannot_establish_separate_scope_audit:
      result: breaks
      source_level_positive: >-
        The duplication audit correctly says an L3-only row must fail its
        first predicate and that a table lookup alone cannot supply the second
        predicate's vector-to-cited-artifact comparison.
      defect: >-
        That safeguard is not represented in the frozen experiment schema.
        The extraction row identity and required outputs contain no
        goal/idea/experiment linkage, l3_curve_family_table membership flag,
        linkage-resolution state, or rule for deriving any of those fields.
        The duplication audit asks a future implementation to add them, but
        the frozen selector/extractor does not make their recording or failure
        mode mandatory.
      consequence: >-
        An implementation could produce otherwise valid scope-vector rows for
        an L3-only table record while omitting the information required to
        reject it as a duplicate. The asserted non-duplication predicates are
        therefore prose constraints rather than an enforceable frozen gate.
  proves_too_much_control:
    negative_with_absent_or_ambiguous_binding:
      expected: not_overbroad
      observed_source_rule: holds
      rationale: >-
        The unauditable precedence and explicit prohibition reject
        overbroadness for this construction.
    exp_jinv_606dce_l3_affected_vs_safe_row:
      expected: cannot_establish_non_duplication_without_non_l3_selected_statement_and_independent_vector_comparison
      observed_source_rule: breaks
      rationale: >-
        The prose duplication audit states the expected rejection, but the
        required linkage/membership evidence is not part of the selector or
        immutable comparison-row schema. The contract cannot demonstrate that
        the required rejection happened.
  required_additive_repair_before_re_review:
    - >-
      Define an absolute YAML-path grammar, statement boundary, token/citation
      co-location rule, and required selector-exclusion/anomaly disposition
      for every unsupported shape.
    - >-
      Bind each of the ten conclusion and coverage fields to extraction paths,
      canonical normalized encodings, and a decidable partial-order relation;
      name the exact comparable field used by widened_control.
    - >-
      Define a typed semantic-generalization marker with its source locations,
      normalization, required handling, and an anomaly rule when prose cannot
      be typed or marked.
    - >-
      Extend immutable row schema and custody requirements with resolved and
      unresolved goal/idea/experiment linkage plus l3_curve_family_table
      membership, and make absence of that evidence fail the non-duplication
      gate rather than silently passing it.
    - >-
      Re-run all four source-level controls and both proves-too-much objects
      under a new Coordinator-authored review plan. No corpus audit or
      implementation is authorized by this report.
  limitations:
    - >-
      This review did not traverse, classify, or read the live ledger corpus;
      it identifies definition defects in the frozen packet only.
    - >-
      No selector, extractor, comparator, fixture, run, manifest, receipt, or
      scientific observation was executed or validated.
    - >-
      The report does not establish that any existing conclusion is overbroad,
      unauditable, clean, duplicate, distinct, correct, or incorrect.
  authority_effect: >-
    The assigned joint breaks. The draft remains unapproved for canonical
    proposed-record creation on this review path until a narrow additive repair
    and fresh independent review address the stated definition defects.

