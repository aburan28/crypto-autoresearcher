  coordinator_prior:
    recorded_before_reviewers: true
    expectation: >-
      The fixed four-control taxonomy and precedence should prevent the most
      dangerous conflation of missing provenance with overbreadth. Remaining
      likely defects are a selector that cannot account for all schema forms,
      an unsupported partial-order comparison, or a duplicate boundary that
      cannot be mechanically established without broader corpus evidence.
    does_not_assume: >-
      Review of a source-only draft neither resolves a cited run, executes a
      corpus audit, approves a canonical experiment, nor supports a conclusion
      about any ECDLP mechanism.
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  blindness:
    reviewers_may_read: [the pinned source packet, this review plan, own task handoff]
    reviewers_may_not_read: [all sibling reports]
    lifted_for: []
  joints:
    - task_id: TASK-20260909-e2247a
      assigned_to: TASK-20260909-e2247a
      role: validator
      joint: selector_taxonomy_control_and_duplicate_boundary
      scope: >-
        Complete-corpus selector and exclusion accounting, typed extraction and
        precedence, all four controls, interpretation limits, and the asserted
        distinction from EXP-JINV-606dce.
      attack_plan: >-
        Attempt to make a missing cited binding become overbroad; a prose
        generalization become clean or overbroad automatically; a widened typed
        field become clean; and a selected negative disappear through a listed
        schema location. Then test whether a JINV-only L3 table row could
        satisfy the proposed non-duplication predicates without a separate
        vector-to-run comparison. Identify a source-level counterexample or the
        exact rule that rejects it. Do not traverse or classify the live corpus,
        implement the selector, or create a fixture.
      known_false_controls:
        - missing_binding_is_overbroad
        - prose_generalization_is_automatic_overbroad
        - widened_typed_field_is_clean
        - jinv_l3_table_lookup_claimed_as_separate_scope_audit
  proves_too_much:
    objects:
      - A negative statement with an absent or ambiguous cited artifact binding.
      - An L3 affected-versus-safe table row from EXP-JINV-606dce.
    failure_signature: >-
      The first object must not receive an overbroad verdict, and the second
      must not establish the draft's non-duplication predicate without a
      source-bound non-L3 selected statement and independent vector comparison.
      Acceptance of either construction breaks the draft.
    assigned_to: TASK-20260909-e2247a
  blind_rederivation:
    required: false
    rationale: This source-only design joint has no load-bearing numerical quantity.
  outcome_rule: >-
    A holds verdict supports only a later Coordinator decision on whether to
    create canonical proposed records. A breaks or inconclusive verdict keeps
    the draft unapproved and requires a narrow additive repair.
