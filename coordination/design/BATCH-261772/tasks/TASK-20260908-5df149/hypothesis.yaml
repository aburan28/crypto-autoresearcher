id: H-ECDLP-576e57
kind: hypothesis
status: proposed
title: Fieldwise scope-to-run-coverage reconciliation for scoped negative ledger conclusions
source_idea:
  id: IDEA-20260815-024cf2
  provenance: internal
  availability: parent-supplied input packet; independently unread in this role/runtime
claim:
  exact: >-
    For a source-bound corpus of ledger decision and evidence records with a
    declared scoped negative conclusion and a resolved citation to a run or
    manifest, a deterministic fieldwise comparison can classify the stated
    conclusion scope as clean, overbroad, unauditable, or inconclusive without
    treating a missing binding or an intentional prose generalization as an
    overstatement.
  claim_class: control-plane record-integrity hypothesis
  asserts_not: >-
    This makes no cryptanalytic, mathematical, implementation-correctness, or
    scientific claim about ECDLP, any curve, or the truth of any cited negative
    conclusion.
mechanism:
  summary: >-
    Normalize each conclusion's asserted scope and its cited run/manifest
    coverage into a common typed field vector. Compare only fields with a
    recognized partial-order comparand, preserving provenance and missingness.
    A strict widening in a comparable field is necessary for an overbroad
    verdict; missing identity or coverage is instead unauditable.
  required_scope_fields:
    - target_object_or_curve_family
    - concrete_curve_or_instance
    - field_and_parameter_set
    - subgroup_or_order_scope
    - solver_or_method
    - solver_version_or_configuration
    - input_or_sampling_distribution
    - budget_and_stopping_boundary
    - measured_metric_and_negative_threshold
    - randomness_seed_or_reproducibility_boundary
predictions:
  discriminating_control_predictions:
    - A same-shape control whose conclusion vector equals its manifest vector receives clean.
    - A same-shape control that widens one recognized comparable field receives overbroad.
    - A control with an absent or unresolvable run/manifest binding receives unauditable.
    - A documented prose generalization without a recognized field comparand receives inconclusive and human-review-required.
  falsification_criteria:
    - >-
      The classifier gives an overbroad verdict to the absent-binding control,
      or fails to give it unauditable.
    - >-
      The classifier gives a clean verdict to the deliberately widened control
      despite its declared strict widening in a recognized comparable field.
    - >-
      The classifier automatically treats the legitimate prose-generalization
      control as overbroad rather than inconclusive/human-review-required.
    - >-
      The frozen selector or comparison rule cannot be bound to a source tree,
      so that the same input paths and extraction schema cannot be replayed.
minimal_discriminating_experiment: EXP-ECDLP-df24c3
controls_and_confounders:
  controls:
    - clean same-shape scope/coverage fixture
    - deliberately widened comparable-field fixture
    - missing manifest or run-binding fixture
    - legitimate prose-generalization fixture
  confounders:
    - Schema versions may represent conclusion scope or run coverage at different paths.
    - A conclusion may cite several runs with non-uniform method or parameter coverage.
    - Natural-language scope may be a justified theorem-level generalization rather than a replay claim.
    - A record path alone does not prove a cited artifact is its evidentiary basis.
limits:
  - >-
    A clean verdict establishes only scope/coverage alignment under the frozen
    extractor; it does not validate the run, its implementation, its metric,
    or the negative conclusion's scientific interpretation.
  - >-
    An overbroad verdict is a record-level comparison finding subject to
    independent review; it does not falsify the underlying hypothesis.
  - >-
    Unauditable and inconclusive are distinct non-findings. Neither may be
    collapsed into overbroad or clean.
  - No selector, source commit, extraction, fixture, audit execution, or result is asserted by this draft.
assumptions:
  - >-
    A later source-bound implementation can identify ledger records and cited
    run/manifest artifacts using the frozen selector and path schema.
  - >-
    At least one stated scope field has a declared, typed comparison relation
    whenever an automatic overbreadth decision is contemplated.
  - >-
    Aggregating several cited runs is valid only after their shared metric,
    method, and negative criterion are explicitly confirmed.
literature_and_novelty:
  novelty_status: unverified
  non_rename_reasoning: >-
    The mechanism is record-to-run field reconciliation for ledger-wide scoped
    negative conclusions. It is not a curve-family classification audit. Its
    proposed distinction from EXP-JINV-606dce remains conditional on the
    source-bound duplication test recorded in duplication-audit.md.
  citations:
    - id: IDEA-20260815-024cf2
      provenance: internal
      use: supplied source of the proposed audit mechanism and boundaries
    - id: TASK-20260908-5df149
      provenance: internal
      use: parent-supplied handoff constraining this draft
  external_literature_review: not performed
cost_and_frontier:
  target_complexity: not applicable; no cryptanalytic complexity claim
  baseline: >-
    Manual record-by-record scope review has no source-bound measured cost in
    this draft and is represented only as an unmeasured comparison baseline.
  proposed_cost_model: >-
    For N selected negatives, R resolved cited artifacts, and F normalized
    fields, a future implementation records traversal, parsing, extraction,
    comparison, and reviewer time separately. No runtime, memory, or speedup
    value is claimed before a source-bound measurement.
  time_exponent_vs_baseline: not applicable
  memory_exponent_vs_baseline: not applicable
  quantitative_sota_delta: >-
    Unmeasured. This draft defines the required future quantities (N, R, F,
    parsed bytes, wall-clock time, peak memory, and reviewer dispositions) but
    reports no numerical delta.
  dominated_by: unassessed; no frontier inventory or source-bound cost observations are available at draft stage
proof_search_map:
  applies: true
  target_statement: >-
    A fieldwise scope comparison may label a selected record overbroad only
    when the cited coverage binding is identified and a stated scope field is
    a strict superset of a recognized comparable coverage field.
  exact_baseline_reproduction:
    audit: >-
      Reproduce the extraction and comparison by hand for each predeclared
      fixture, preserving every source path and normalized value.
    pass_condition: all fixture labels and field relations match their predeclared expectations
  observation_collision_search:
    audit: >-
      Search for two differently scoped source encodings that normalize to the
      same vector, and record the collision or a bounded absence claim for the
      tested schema version.
    nearby_object_control: legitimate prose-generalization fixture
  quantifier_order:
    statement: >-
      For each selected conclusion and each automatic verdict, establish its
      cited coverage bindings and typed field comparisons before asserting any
      verdict; do not infer coverage from an aggregate category count.
  method_ceiling:
    ceiling: >-
      The method decides only declared, typed field relations. It cannot decide
      semantic entailment, theorem-level generalization, run validity, or
      scientific truth.
    nearby_object_control: a prose generalization with no recognized typed comparand
inference_policy:
  heuristic_status: none; this is a deterministic control-plane proposal, not an asymptotic heuristic claim
  supporting_results: []
approval:
  approved_by: null
  implementation_authorized: false
  scientific_execution_authorized: false
