id: H-ECDLP-b4ec52
status: draft
area: ECDLP
title: Enumerated transport-chain cost accounting screen
proposal: IDEA-20260815-440ebb
task: TASK-20260909-e7391e
scope: >-
  This zero-run design asks whether a declared finite catalogue of transport
  implementations and a declared finite catalogue of their compositions can
  be cost-accounted without silently omitting a component. It does not ask for
  a universal lower bound, an isogeny theorem, a curve-specific transport
  cost, or an ECDLP security conclusion.
mechanism: >-
  A candidate chain is represented as an ordered finite sequence of catalogue
  implementation identifiers. A chain cost is the checked sum of the
  pre-registered component cost vectors, plus only separately declared chain
  overhead. An absent component, an unenumerated implementation, an unknown
  unit, or an unproved composition rule produces UNESTIMABLE rather than a
  numerical cost.
predictions:
  - >-
    For every fully enumerated synthetic chain, a verifier can reproduce the
    component sum and reject a missing, duplicate, reordered, or unit-mismatched
    component record.
  - >-
    The small-degree, composed-chain, and random-walk controls expose a
    missing composition, an undeclared overhead, or a cost transfer that does
    not follow the declared implementation inventory.
  - >-
    Any chain naming an implementation outside the finite catalogue is
    classified UNESTIMABLE and is not used for comparison or extrapolation.
falsification_criteria:
  - >-
    A valid-looking chain can include an unenumerated implementation without
    receiving UNESTIMABLE.
  - >-
    A verifier accepts a component sum with a missing, duplicated, or
    unit-incompatible component.
  - >-
    A control permits a numerical transport-cost assertion without a complete
    enumerated implementation and composition record.
evidence_boundary: >-
  A future holding result would concern only the declared finite catalogue,
  its recorded units, and its declared chain compositions. It would not prove
  a lower bound for all isogeny algorithms, establish a cryptographic cost,
  or support an ECDLP attack or security statement.
implementation_authorized: false
scientific_execution_authorized: false
maximum_runs: 0
approved_by: null
source_status: unread_sources_are_impediments
known_limitations:
  - No isogeny implementation, transport, curve, or benchmark has been read or run.
  - No cited theorem or algorithmic bound has been retrieved or source-bound.
  - The finite catalogue cannot represent unenumerated algorithms.
  - Cost vectors are design fields, not observed timings or mathematical lower bounds.
