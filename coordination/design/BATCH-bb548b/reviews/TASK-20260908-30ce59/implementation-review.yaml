  recommendations_for_revise:
    - >-
      Fix arithmetic.py's point_add Y3 computation (line 310) to use
      `B.sub(X3, counters)` (i.e. B-X3, matching X3 already computed at line
      308) as the first multiplicand of the first product, rather than
      reusing `C.sub(B, counters)` for both products, per
      specification.arithmetic.addition.common_z_formula's literal
      "Y3=M(j,B-X3)-M(V1,C-B)" (C6). This does not change the M/S counts
      already produced, only the Y-coordinate value.
    - >-
      Fix rho.py's EndpointTable.insert_if_absent to compare the occupant's
      stored endpoint (TableSlot.x/y, or an equivalent full-endpoint key) at
      each probed index against the endpoint being inserted, and return
      (False, existing_slot) exactly when they match, continuing to probe
      only on an actual mismatch (a genuine table-hash collision at a
      different endpoint) -- per spec.rho.table's "keyed by the full
      canonical affine endpoint" and "distinguish full point equality from
      table-hash collision" (C11). As written the function can never surface
      a real collision.
    - >-
      Either write a complete `scalar_multiply_planted` (or equivalent
      point_add_planted/point_double_planted composition) in arithmetic.py
      that threads planted_mul into every top-level M call site of a full
      256-bit scalar multiplication, mirroring scalar_multiply and
      scalar_multiply_null, or explicitly amend the artifact_contract/
      preparation-report.yaml gap note to name this as an outstanding
      completeness item before any "planted" routine cell is treated as
      implemented (C9).
    - >-
      Extend check_cgroup_admission to compare the cpu.max readback against
      the two spec-required values ("300000 100000" for rho, "100000 100000"
      for arithmetic, selected by an added job-type/process-count parameter)
      and to require pids_max == 3 exactly rather than merely <= 3 (C12).
    - >-
      Either add an explicit `normalize()` call inside scalar_multiply so the
      routine's own charged-count contract includes the mandated final
      3M+1S+1I normalization per spec.arithmetic.scalar_algorithm, or
      document explicitly (in arithmetic.py's docstring and the artifact_
      contract) that normalization is deliberately a separate caller
      responsibility (C8, minor).

  verdict: REVISE
  verdict_rationale: >-
    No invented provenance, no unauthorized execution, and no misleading
    independence claim was found anywhere in this delivery: the disclosed
    authorship gap for independent_checker.py/count_predictor.py is accurate,
    prominent in three separate files, and not contradicted anywhere (C14);
    admission-template.json leaves every actual-value field null with a
    concrete blocking reason and correctly separates two physical hosts from
    three guest environments (C13); the zero-scientific-execution attestation
    is independently confirmed by reading every guard function (C15); the
    40-job/9-cell/3-process/9-row structural scope is implemented exactly
    (C1-C3); most of the field-arithmetic formulas (doubling in both
    specializations, normalization, the M/S/I counting infrastructure, the
    rho partition/DP/branch/collision-resolution formulas) are correct and
    match the frozen specification term for term (C4, C5, C7, C10); and all
    six .py files compile cleanly (py_compile_results). However, this review
    independently confirmed two DEFECT-level findings that must be fixed
    before this implementation is trustworthy for any scientific
    measurement: (1) arithmetic.py's point_add computes a mathematically
    wrong Y3 coordinate for the generic (non-doubling) addition branch,
    reusing (C-B) where the frozen spec requires (B-X3) for the first product
    term (C6) -- this does not corrupt the GOE-ruler M/S counts but would
    corrupt virtually every real scalar multiplication and 2/3 of rho
    transitions were this code executed as-is; and (2) rho.py's
    EndpointTable.insert_if_absent contains unreachable dead code and can
    never actually detect a repeated endpoint, which is the single mechanism
    the entire rho experiment depends on to recover a discrete logarithm
    (C11). Two further partial-implementation gaps were found and disclosed
    beyond what the executor's own preparation-report.yaml gap notes
    identified: the "planted" scalar routine exists only as a low-level
    primitive with no complete scalar-multiplication composition (C9), and
    driver.py's cgroup admission guard does not enforce cpu.max or an exact
    pids.max=3 (C12). None of these four findings involves fabrication,
    invented provenance, or unauthorized execution -- they are implementation
    defects in code that, by design under this zero-run task, has not yet
    been run against real data -- so FAILED is not warranted. All four are
    concrete, localized, and actionable, so REVISE rather than PASSED is the
    correct verdict.

