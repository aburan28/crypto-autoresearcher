      verdict: confirmed

    - id: C3-nine-row-model-scope
      area: driver.py / specification.model_256.scenarios
      finding: >-
        driver.py:54-55 declares MODELED_WORKERS=[1,2,256],
        MODELED_DP_BITS=[104,112,120]; enumerate_model_rows (125-133) yields
        the cartesian product ordered by m then d (9 rows), matching
        model_256.scenarios "Cartesian product m=[1,2,256],d=[104,112,120],
