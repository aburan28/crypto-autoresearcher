    - id: C4-field-api-separate-counters
      area: arithmetic.py OperationCounters / specification.field_api
      finding: >-
        arithmetic.py:93-134 (OperationCounters) tallies M, S, I separately
        from linear_ops, integer_work, branch_copy_ops, hash_calls,
        sink_bytes, exactly matching field_api's distinction between the
        GOE-ruler-relevant M/S/I and the excluded-but-charged linear/
        integer/branch/hash bookkeeping (goe_ruler.
        excluded_from_scalar_ruler_but_charged). FieldElement.mul/sqr each
        increment exactly one of M/S per call (158-166); inv (168-187)
        increments I exactly once at the API boundary and logs three
        integer_work increments per Euclidean step (quotient, remainder
        update, coefficient update), never M/S, matching field_api.I's "Charge
        one I at the API boundary; internal integer multiplications/divisions
        are separately logged integer work, never additional field M/S
        counts." scale_small (203-221) implements the 2/3/8 constants via
        explicit repeated addition (linear_ops), never a counted M, matching
        field_api.linear_operations. No operand-is-one shortcut exists
        anywhere in FieldElement (confirmed by full read of mul/sqr/inv),
        matching field_api.validation.
      verdict: confirmed

    - id: C5-doubling-formula-and-specializations
      area: arithmetic.py point_double / specification.arithmetic.doubling
      finding: >-
        arithmetic.py:321-360 was hand-traced against
        specification.arithmetic.doubling.polynomial/specializations term by
        term. Exceptional branches (330-335): identity input and Y=0 both
        return O via branch_copy_ops only, before any field call, matching
        "finite Y=0 returns O before polynomial calls." Polynomial path
        (337-358): XX=S(X), YY=S(Y), YYYY=S(YY), ZZ=S(Z) are four S calls;
        V=2*(S(X+YY)-XX-YYYY) uses one more S call (for S(X+YY)) plus
        scale_small(2) (a linear op, not S), matching spec's V formula
        exactly; for a=0, W=3*XX via scale_small(3) (0 extra S/M, matching
        "omit only ZZ^2"); for a=1, an additional Z4=S(ZZ) (one more S) then
        W=3*XX+Z4 via a linear add. T=S(W)-2*V is one more S call (S(W)) plus
        scale_small(2) (linear). Y3=W.mul(V-T)-8*YYYY is exactly one M call
        (scale_small(8) for the 8*YYYY term is a linear op, not M). Z3=S(Y+Z)
        -YY-ZZ is one more S call. Total tally: a=0 gives 7 S
        (XX,YY,YYYY,ZZ,S(X+YY),S(W),S(Y+Z)) and 1 M -- matches spec's "one M
        and seven S" exactly; a=1 adds the Z4=S(ZZ) call for 8 S and the same
        1 M -- matches spec's "one M and eight S" exactly. No multiplication
        by the curve constant `a` is introduced in either specialization,
        matching the spec's explicit disclaimer.
      verdict: confirmed

    - id: C6-addition-rescale-and-common-z-formula
      area: arithmetic.py point_add / specification.arithmetic.addition (critical check)
      finding: >-
        THIS IS A CONFIRMED CORRECTNESS DEFECT, NOT MERELY A STYLE OR COUNT
        ISSUE. specification.yaml lines 156-160 (common_z_formula) state
        literally: "h=U2-U1; j=V2-V1; A=S(h); B=M(U1,A); C=M(U2,A); D=S(j);
        X3=D-B-C; Y3=M(j,B-X3)-M(V1,C-B); Z3=M(Z,h)." -- the first product of
        Y3 is j multiplied by (B-X3), and the second is V1 multiplied by
        (C-B); these are two DIFFERENT subtrahend expressions.
        arithmetic.py:302-311 instead computes:
            CB = C.sub(B, counters)                              # line 309
            Y3 = j.mul(CB, counters).sub(
                     V1.mul(C.sub(B, counters), counters), counters)  # line 310
        i.e. Y3 = j*(C-B) - V1*(C-B), using the SAME expression (C-B) for
        BOTH multiplications, where the spec requires (B-X3) for the first
        one. Since X3 = D-B-C (line 308, correctly matching spec), B-X3 =
        2B+C-D, which is algebraically a different value from C-B in general
        (equal only in the degenerate case D=3B). This is therefore a genuine
        formula-transcription error, not an equivalent rearrangement: every
        generic (non-doubling, non-identity) point addition computed by this
        module produces a mathematically WRONG Y-coordinate. The rescale
        block (280-289: z1sq,z2sq,z1cube,z2cube,U1,V1,U2,V2,Z -- 7 M + 2 S)
        and the U1==U2/V1==V2 exceptional-branch handling (291-298) were
        separately hand-checked and DO match spec exactly (see rescale_finite
        and exceptional_after_rescaling text). The bug is isolated to the Y3
        line of the generic (non-exceptional) branch only.
        Count impact: the M/S TALLY is unaffected (still exactly 12 M + 4 S
        for a generic full ADD, since the buggy line still performs exactly
        the same two M calls the correct formula would) -- so this defect
        would NOT be visible in the GOE-ruler count metrics themselves, only
        in output_correctness / the independent affine-checker cross-check.
        Scope impact: this generic branch is exercised by essentially every
        nonzero-bit ADD step of scalar_multiply and by branches 0 and 2 of
        every rho transition (2/3 of all rho steps), so if this code were run
        as-is under a future scientific-execution task, it would fail the
        spec's own required output-correctness/exceptional-control checks
        against independent_checker.py's (correct, independently re-derived)
        affine formulas on virtually the first non-trivial input.
      verdict: >-
        DEFECT -- confirmed spec-conformance failure. Drives the
        REVISE verdict below; must be fixed before this arithmetic is used
        for any scientific run.

    - id: C7-normalization
      area: arithmetic.py normalize / specification.arithmetic.normalization
      finding: >-
        arithmetic.py:368-383: zi=I(Z) [1 I], z2=S(zi) [1 S], z3=M(z2,zi)
        [1 M], x=M(X,z2) [1 M], y=M(Y,z3) [1 M] -- exactly 3 M, 1 S, 1 I in
        the same order the spec states them (zi,z2,z3,x,y); identity returns
        (None,None) via branch_copy_ops with no inversion, matching "O has no
        inversion."
      verdict: confirmed

    - id: C8-scalar-routine
      area: arithmetic.py scalar_multiply / specification.arithmetic.scalar_algorithm
      finding: >-
        arithmetic.py:391-406 implements exactly 256 iterations MSB-first
        (`for i in range(255,-1,-1)`), always doubling R then conditionally
        adding the base point when the bit is 1, matching "Start R=O; for
        every bit set R=DOUBLE(R), then if bit=1 set R=ADD(R,(Gx,Gy,1))" and
        the "not constant-time, not a co-Z ladder" disclaimer. However, the
        function RETURNS the raw Jacobian point without calling `normalize`;
        the spec's scalar_algorithm text explicitly states "Normalize the
        final R once" as part of this same routine's definition, and no
        caller composes normalize() with scalar_multiply anywhere in this
        delivery (driver.py does not import point-arithmetic functions at
        all yet, consistent with the zero-run scope). As written,
        scalar_multiply's own charged-count contract is incomplete relative
        to the spec's literal text: the mandated final 3M+1S+1I
        normalization charge is not part of this function's own behavior and
        must be added explicitly by whatever future caller invokes it.
      verdict: >-
        minor gap -- not a value-correctness defect (any caller can
        still call normalize() on the returned point), but the spec assigns
        normalization to the scalar routine itself and this implementation
        does not.

    - id: C9-planted-variant-completeness
      area: arithmetic.py planted_mul / specification.arithmetic.planted (critical check)
      finding: >-
        arithmetic.py:420-457 correctly implements the low-level planted_mul
        PRIMITIVE (two separate M evaluations of the same operands, a value
        comparison that raises on disagreement, and an ordered SHA-256
        integrity sink over both serialized products -- matching
        planted.definition exactly) and planted_expected_factor (an exact
        rational (2*M+S+100*I)/(M+S+100*I), matching planted.expected_factor
        verbatim). This primitive is correct in isolation. However, a grep
        for "planted" across the whole implementation/ directory (see
        static_analysis_performed) finds NO function anywhere named or
        shaped like `scalar_multiply_planted`, `point_add_planted`, or
        `point_double_planted` -- i.e. no complete "planted" scalar-
        multiplication routine that threads planted_mul into point_add's and
        point_double's M call sites exists, unlike the 'reference'
        (scalar_multiply) and 'null' (scalar_multiply_null) routines, which
        both DO exist as complete, ready-to-call functions mirroring each
        other (arithmetic.py:465-475). driver.py's SCALAR_ROUTINES = ["reference",
        "planted", "null"] (line 50) names all three symmetrically, but only
        two of the three have a corresponding complete callable in
        arithmetic.py today. Per specification.independent_variables,
        "planted" is one of the three required scalar_routines cells (spec:
        arithmetic_physical_routine_cells=90, one third of which is
        "planted"); a future scientific-execution task would need to WRITE a
        new function (not merely wire an existing one) to realize the
        planted routine's exact_count_identity (M_planted=2*M_reference) at
        the level of a full 256-bit scalar multiplication, since no such
        function exists yet. preparation-report.yaml's own gap note for this
        requirement ("Not benchmarked or run against any real scalar/operand
        in this task; no exact-count agreement with a predictor has been
        checked") does not mention this specific completeness gap.
      verdict: >-
        partial implementation -- the planted PRIMITIVE and its exact
        count-identity/expected-factor FORMULA are both correct and complete;
        the planted SCALAR ROUTINE required to actually populate the
        "planted" cells of the nine routine cells does not yet exist as a
        callable. Not previously disclosed by the executor's own
        preparation-report.yaml gap note.

    - id: C10-rho-partition-dp-branch-collision-formula
      area: rho.py / specification.rho.transition / endpoint_collision
      finding: >-
        partition_branch (rho.py:50-70) implements the exact rejection-
        sampled hash-mod-3 draw (threshold=(2**256//3)*3, domain
        "GOE9225/rho/partition", h mod 3), matching spec.rho.transition.
        partition verbatim, including rejection recording. is_distinguished_point
        (79-88) checks the first d bits of SHA256(domain||walk_key||point)
        are zero, matching spec.rho.transition.dp. apply_branch (106-130)
        implements the three coefficient-recurrence branches exactly:
        branch 0 -> (X+Q, a, b+1), branch 1 -> (2X, 2a, 2b), branch 2 ->
        (X+G, a+1, b), all coefficients reduced mod N -- matching
        spec.rho.transition.branches literally. resolve_endpoint_collision
        (217-231) computes diff=(d-b) mod N; if diff==0 returns None
        (useless collision, matching endpoint_collision's "if d=b, retain the
        useless collision"), else returns (a-c)*inverse(d-b) mod N -- matching
        the spec's stated "(a-c)/(d-b) mod N" exactly. long_trail_threshold
        (239-243) returns 20*2**d_bits, matching long_trails' "20*2^d". All
        four formulas independently hand-checked term by term against the
        frozen spec text with no deviation found.
      verdict: confirmed

    - id: C11-rho-endpoint-table-collision-detection
      area: rho.py EndpointTable.insert_if_absent / specification.rho.table (critical check)
      finding: >-
        THIS IS A CONFIRMED CORRECTNESS DEFECT IN THE CORE MECHANISM OF THE
        WHOLE RHO EXPERIMENT. rho.py:181-209:
            idx = self._probe_index(key_hash)
            probes = 0
            while idx in self.slots:
                if probes >= self.capacity: raise RuntimeError(...)
                idx = (idx + 1) % self.capacity
                probes += 1
            if idx in self.slots:
                return False, self.slots[idx]
            ...
            self.slots[idx] = slot
            self.count += 1
            return True, slot
        The `while idx in self.slots` loop only terminates once `idx` refers
        to an EMPTY slot (or the capacity guard fires), so the `if idx in
        self.slots: return False, self.slots[idx]` line immediately after the
        loop (line 198-199) is UNREACHABLE DEAD CODE -- it can never execute,
        because loop exit is defined exactly by that condition being false.
        Consequently, this function can never return (False, existing_slot):
        every call that reaches an occupied starting index (i.e. every case
        where the SAME key_hash -- meaning candidate SAME endpoint -- was
        already inserted, since `_probe_index` is a deterministic function of
        key_hash) is treated identically to an ordinary linear-probe
        collision at a DIFFERENT key, silently probed past to the next empty
        slot and inserted there as a brand-new entry (`return True, slot`).
        There is no code anywhere in this class that compares the actual
        endpoint bytes (TableSlot.x/y) of an occupied slot against the
        endpoint being inserted; occupancy alone drives probing. This means
        the table, as written, can NEVER report that "the same affine
        endpoint" (spec.rho.table's stated key) has been seen twice --
        which is precisely the mechanism the entire Pollard-rho distinguished-
        point method depends on to find a discrete-log-recovering collision
        (spec.rho.endpoint_collision's caller-side logic, which reads
        insert_if_absent's `inserted_new` flag, would never see it go False
        for a genuine repeat visit). This is not a hypothetical: it is a
        control-flow defect reachable on the very first repeated key_hash.
      verdict: >-
        DEFECT -- confirmed, severe. Drives the REVISE verdict below.
        No walk has been executed under this zero-run task (preparation-
        report.yaml correctly states EndpointTable "have not been exercised
        against real transitions"), so this defect has not yet produced a
        false scientific result, but it must be fixed (compare the occupant's
        stored endpoint to the candidate endpoint at each probed index, and
        only continue probing on an actual mismatch) before any rho job is
        authorized to run.

    - id: C12-cgroup-admission-guard-completeness
      area: driver.py check_cgroup_admission / specification.runtime.contract
      finding: >-
        driver.py:197-269 genuinely refuses (returns admitted=False with a
        specific refusal_reason, never a fabricated pass) when: no
        cgroup_path is supplied or it does not exist (205-213); memory.max
        readback != 8*2^30 exactly (243-249); memory.swap.max readback != 0
        (250-256); or pids.max readback is None or > 3 (257-263). This is
        real, reachable refusal logic, not a stub. Two gaps against
        spec.runtime.contract were found by tracing every field the function
        reads: (a) cpu_max is read (`_read_str_file("cpu.max")`, line 241)
        and stored in the returned CgroupAdmissionResult, but is NEVER
        compared against the spec's required "300000 100000" (rho) or
        "100000 100000" (arithmetic) values anywhere in this function -- any
        cpu.max string, including one belonging to the wrong job type or an
        arbitrary value, passes admission unexamined; the function also takes
        no job_type/process_count parameter that would let it choose which of
        the two required cpu.max values to check against. (b) the pids_max
        check (`pids_max is None or pids_max > REQUIRED_PIDS_MAX`) only
        rejects values ABOVE 3; it accepts any value <= 3, including 1 or 2,
        which would be insufficient to run the required three single-threaded
        processes (coordinator + two workers) concurrently. Spec.runtime.
        contract's "Freeze pids.max=3" reads as an exact fixed value, not a
        one-sided ceiling, so a delegated cgroup with pids.max=1 would pass
        this guard today despite being unable to run the declared workload.
      verdict: >-
        partial guard -- the refusal path is genuine and reachable for
        the fields it checks (memory.max, memory.swap.max, an upper bound on
        pids.max, and cgroup-path presence), but it is not a complete
        realization of spec.runtime.contract -- cpu.max is read but unchecked,
        and pids.max accepts values that are too low, not only values that
        are too high. Not itself invoked against any real cgroup in this
        task, so this gap has not fabricated a false admission anywhere yet.

    - id: C13-admission-template-null-and-host-guest-separation
      area: admission-template.json / specification.hosts.required
      finding: >-
        Every leaf value field in admission-template.json is null:
        physical_hosts.host_A/host_B (physical_host_id: null, each with a
        distinct, accurate blocking_reason), guest_environments.A_boot_1/
        B_boot_1/A_boot_2 (physical_host_id_ref/guest_boot_id: null, each with
        a blocking_reason), cgroup_delegation, image_and_executable,
        os_and_clock, source_and_dependency_hashes, fixture_certificate_hashes,
        measured_resources, preflight_results, and implementation_review_refs
        all null with an explicit blocking_reason string. physical_hosts (two
        entries: host_A, host_B) is a structurally separate top-level key
        from guest_environments (three entries: A_boot_1, B_boot_1, A_boot_2),
        with an explicit `_note` distinguishing them ("Two containers on the
        same physical host do not satisfy this... None of these is itself a
        physical host") -- matching spec.hosts.required and the artifact_
        contract's "distinguish two physical hosts from three guest
        environments." No boot ID, image digest, cgroup readback, or measured
        resource value anywhere in the file is non-null. The top-level
        `_disclosure` and `not_authorized_by_this_template` fields correctly
        state this is an unfilled template, not an admission record.
      verdict: confirmed

    - id: C14-independent-checker-authorship-disclosure
      area: independent_checker.py / count_predictor.py / specification.arithmetic.checker (the central check)
      finding: >-
        The disclosure is present, accurate, and prominent in three
        independent locations that this review read separately: (1)
        independent_checker.py's module docstring (lines 4-40, headed
        "AUTHORSHIP / INDEPENDENCE DISCLOSURE", stating "STATUS: NOT
        INDEPENDENT" in the first sentence of the substantive text) and its
        INDEPENDENT_CHECKER_PROVENANCE dict (72-90,
        genuinely_independent_author: False, with reason/what-this-provides/
