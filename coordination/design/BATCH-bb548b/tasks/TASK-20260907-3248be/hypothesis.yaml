hypothesis:
  id: H-CRYPTO-830d47
  question_id: RQ-CRYPTO-001
  status: specified
  proposed_by: coordinator
  derived_from_idea: IDEA-20260801-001
  supersedes_hypothesis: H-CRYPTO-b2c203
  successor_experiment: EXP-CRYPTO-9225d2
  decision_id: DEC-20260907-1ccb1a
  statement: >-
    The fixed (M+S+100I)/16 conventional GOE ruler can be made exactly
    reproducible for the specified input-bound arithmetic and can detect a
    planted top-level multiplication duplication. The separately specified
    unquotiented two-worker rho walk may satisfy a descriptive 20-percent
    mean-step window on the three fixed reduced-order subgroups. These are
    instrument and finite calibration targets, not a performance equivalence
    theorem or a 256-bit discrete-logarithm result.
  mechanism: >-
    Freeze field API boundaries, point formulas, branches, input streams and
    independent count predictions. A paired planted routine changes only
    top-level M calls, so its exact weighted factor is input-dependent and
    checkable. Separate logical costs from physical host/boot timings. Use
    exact coefficient-tracked rho recovery and a declared distinguished-point
    schedule to compare actual work with sqrt(pi*N/2)+2/theta, then retain
    memory, synchronization and setup in conditional resource vectors.
  assumptions:
    - Counts are at the declared field API boundary; inversion internals are not double tallied and non-field work remains separately charged.
    - The same exact input bytes and executable are used on two physical hosts and on two isolated guest boots of A.
    - Primitive timing ratios need not equal the fixed weights, and equal logical counts need not imply equal times.
    - Rho random-map, useful-collision and ideal-hash assumptions are heuristics whose finite calibration is tested, not imported as verified properties of these walks.
    - Reduced-order fixtures use the declared special supersingular family with no negation or automorphism quotient; generic-curve transfer is unproved.
    - Independent count and affine checking require an actual separate implementation/review boundary before admission; a file named checker does not establish independence.
  predictions:
    - metric: Independent per-input output and exact M/S/I agreement across routines and environments
      direction: different
      minimum_effect: Zero exact disagreement; null inputs match their own predictor. The inherited host/boot discrepancy window remains <=0.02 with min(G1,G2) denominator.
    - metric: Planted weighted overhead
      direction: higher
      minimum_effect: Exact factor (2M+S+100I)/(M+S+100I), with M>0 on the finite workload; inherited relative-error window <=0.10 is weaker than the exact gate.
    - metric: Each complete ten-seed rho rung mean divided by its frozen prediction
      direction: different
      minimum_effect: Ratio in [0.8,1.2] for each rung; this is a preregistered descriptive target, not a probability guarantee.
  test_boundary:
    instances: [secp256k1 arithmetic, first certified 40-bit reduced subgroup, first certified 48-bit reduced subgroup, first certified 56-bit reduced subgroup]
    parameters:
      seeds: [20260825, 20260826, 20260827, 20260828, 20260829, 20260830, 20260831, 20260901, 20260902, 20260903]
      logical_jobs: 40
      arithmetic_bundles: 10
      scalar_routine_environment_cells: 90
      primitive_environment_cells: 90
      rho_jobs: 30
      scalars_per_cell: 256
      operand_pairs_per_primitive_cell: 4096
      warmups: 1
      timed_repeats: 5
      modeled_rows: 9
    implementation: EXP-CRYPTO-9225d2 freezes all formulas, seed encodings, controls, point checks, parallel scheduling, artifacts and admission conditions; no implementation has been measured in this design.
    budget:
      maximum_runs: 40
      maximum_workers: 3
      maximum_memory_gb: 8
      wall_clock_seconds: null
      total_cpu_hours: null
      interpretation: One scientific job at a time; one arithmetic process or one rho coordinator plus two actual workers. Time/CPU estimates are advisory, memory/process limits are protective.
  falsification_criterion: >-
    Independently localized exact count/output disagreement refutes the tested
    instrument implementation. With valid complete data, failure of a fixed
    descriptive window is a negative result for that finite panel only.
    Missing hosts, incomplete recoveries, failed infrastructure or absent
    certificates are inconclusive; none refutes general rho theory or security.
  falsification_conditions:
    - Correctly bound inputs produce a certified discrepancy between independent formula-level prediction and observed logical counts.
    - An invalid planted or null control demonstrates that the instrument cannot distinguish its declared workload costs.
    - Valid complete data fall outside a retained per-panel reporting window, without deleting samples or changing quotient conventions.
  proof_search_map:
    bottleneck: Connect explicit instrumented field calls to a reproducible cost identity while keeping the random-map and machine-cost transfers visible.
    baseline_embedding:
      parameter_slice: The unplanted reference routine on secp256k1 and the no-quotient rho collision convention C=sqrt(pi*N/2).
      reproduction_check: Independently derive each branch's M/S/I counts and coefficient recovery identity; reproduce all named identity/inverse/doubling controls before interpretation. No baseline run is claimed now.
    observation_collision:
      observable: Weighted logical GOE, primitive wall/CPU times, and scalar stream summary.
      distinct_preimage_search: Compare identical counts across physical hosts/boots for different timings, and distinct scalar streams with their own Hamming weights/predictors. A common weighted total can hide different M/S/I vectors; retain all three counts.
    constructive_transforms:
      - transform: specialization_pack
        description: Specialize EFD doubling to a=0 and a=1 with omitted operations explicitly declared.
        proposed_object: Exact branch-level arithmetic recurrence and separately authored predictor
        predicted_gain: A checkable counting instrument; no attack improvement claimed.
      - transform: observable_fiber
        description: Hold weighted counts fixed while examining timing, memory and non-field work.
        proposed_object: Separate resource vector and matched input/environment records
        predicted_gain: Detect unsupported conversion of a count ruler into a time-equivalence claim.
    quantifier_order: Freeze algorithms, curves, seed list, environments, counts, weights and windows before fixture realization and measurement; check every specified input and retain every seed. Conditional model assumptions precede extrapolation; no post-observation reweighting or resampling.
    method_ceiling:
      strongest_certifiable_claim: Exact logical accounting and finite descriptive compatibility for these routines, inputs, hosts and special subgroup fixtures, plus explicitly conditional model rows.
      nearby_object_control: A duplicated-M routine has an input-dependent factor rather than factor two; a different scalar stream need not have equal counts. Negation-quotient constant 0.886 is the wrong comparator for an unquotiented walk. Identical GOE need not imply identical time.
    proof_obligations:
      - claim: Formula and exceptional-branch correctness and exact weighted duplication identity
        responsibility: correctness
        owner: Future independently reviewed implementation and count checker
      - claim: Prime/order certificates and subgroup-to-fixture binding
        responsibility: interface
        owner: Future fixture producer and independent checker
      - claim: All work, three-process scheduling, synchronization and non-field operations remain charged
        responsibility: runtime
        owner: Future executor and independent resource review
      - claim: Aggregate 8 GiB enforcement, endpoint bytes and conditional model feasibility
        responsibility: memory
        owner: Future admission and cost review
      - claim: Finite special-curve calibration does not establish a 256-bit or universal claim
        responsibility: scope
        owner: Coordinator at later evidence review
    not_applicable_reason: null
  formalization:
    smallest_obligation: For natural counts M,S,I, prove G(2M,S,I)/G(M,S,I)=(2M+S+100I)/(M+S+100I) over rationals when the denominator is positive, then bind actual API call traces to those counts.
    missing_binding: No experiment-specific formal event trace, branch semantics, implementation refinement or admitted count recurrence exists in this design. The cost identity alone does not establish the instrument, point formulas, random-map model or measured performance.
    revisit: After the executable representation and independent count recurrence are frozen, assign a precisely scoped formal binding audit before any claim that the instrument is formally verified. No assertion about global Mathlib availability.
  heuristic_assumptions:
    - id: H1
      statement: The specified reduced walks approximate a useful random mapping with the declared DP density for the finite comparison.
      supporting_results: []
      validation_plan: The complete 30-seed experiment, with individual trails, collision/restart counts and independent checks; no universal theorem inference.
  novelty_status: unverified
  asymptotic_claim: null
  dominated_by: Tooling rather than an attack frontier result. KN-TECH-001 and KN-TECH-006 are explicitly compared with their different quotient conventions; the full time/memory/data attack frontier is unresolved and no unchecked null is asserted.
  sota_delta: Unquantified; no attack performance measured or established improvement claimed. The deliverable is a reproducible conventional count ruler and a scoped finite calibration protocol.
