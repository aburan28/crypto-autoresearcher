coordinator_decision:
  id: DEC-20260907-1ccb1a
  context: >-
    The original GOE ruler experiment EXP-CRYPTO-3703fb was unapproved and
    lacked executable/admission details. Complete its finite scope through
    an additive successor, preserving the original records and separating
    a conventional logical-operation ruler from timing and conditional rho
    extrapolation. This decision approves a prospective contract and zero-run
    preparation only.
  decision: approve
  target_ids:
    - H-CRYPTO-830d47
    - EXP-CRYPTO-9225d2
    - TASK-20260907-ecd3a2
  task_id: TASK-20260907-3248be
  decided_by: coordinator
  decided_at: '2026-09-07'
  user_authorization: AGENTS.md standing authorization dated 2026-09-06 for ideas, complete experiment design and governed execution; no new user confirmation is needed.
  rationale:
    - A frozen instrument is ranked ahead of doing nothing because the pending proposal cannot support comparable cost claims while its formulas, counting boundary, null stream and rho normalization are ambiguous.
    - The successor retains secp256k1 arithmetic, ten original seeds, reference/planted/null routines, two actual physical hosts, a second isolated guest boot on A, 40/48/56-bit rho rungs, 40 logical jobs and nine conditional 256-bit resource rows.
    - The original 2-percent host/boot windows with min-denominator, 10-percent planted window and 20-percent complete per-rung mean windows remain; exact count/correctness checks are stricter instrument gates and ten rho samples remain descriptive.
    - Explicit EFD addition/rescaling/doubling and normalization make both scalar counts and rho point-step counts reviewable. The planted factor duplicates only M, and each null stream is checked against its own predictor.
    - Actual two-worker rho uses a third coordinator process, deterministic barriers, charged IPC and an aggregate 8 GiB admission boundary. Arithmetic remains one process; there is one scientific job at a time.
    - The model grid m=[1,2,256] by d=[104,112,120] is selected prospectively to expose memory/propagation tradeoffs; no modeled row or fixture was evaluated. Measured rho DP parameters are unchanged.
    - Missing host B, implementation independence, certificates, cgroup delegation or telemetry has a concrete admission/inconclusive branch. No funding veto, arbitrary CPU cap or renewed user approval gate substitutes for protocol readiness.
  prospective_supersession:
    original_hypothesis: H-CRYPTO-b2c203
    original_experiment: EXP-CRYPTO-3703fb
    successor_hypothesis: H-CRYPTO-830d47
    successor_experiment: EXP-CRYPTO-9225d2
    mechanism: This decision designates the successor for future work; original bytes and historical proposed/review_required metadata remain unchanged. No run-schema supersession registry is involved.
    no_claim_change: New hypothesis status specified denotes a complete testable contract, not supported/rejected/closed evidence. No goal, scientific result or security status is changed.
  approval_scope:
    protocol: The complete prospective EXP-CRYPTO-9225d2 version 1 contract.
    immediate_work: TASK-20260907-ecd3a2 prepares exactly ten implementation/schema/report files, with maximum_runs zero, one worker and 8 GiB machine protection.
    scientific_execution_authorized: false
    future_measurement: All 40 logical jobs remain behind exact archive, reviewed implementation/checkers, actual fixture and physical-host admission, a genuinely claimed execution handoff and frozen plan.
    evidence_review: Before any claim-changing review, preregister the independent review-adversarial plan, access limits, blinded count re-derivation and known-false controls. This decision is not that review and asserts no independent attestation.
  source_bindings:
