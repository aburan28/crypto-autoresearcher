    - Special supersingular reduced fixtures, ten fixed seeds and an idealized DP model do not establish generic-curve, asymptotic or 256-bit attack performance.
    - The failed knowledge-store query is a retrieval limit. Novelty and the full attack time/memory/data frontier remain unresolved.
