  artifact_contract:
    driver.py: Single coordinator/runner entry, exact jobs/cells, three-process barriers, timers, cgroup admission, resource accounting, exclusive output and checkpoint interfaces; no fixture or benchmark execution at import.
    arithmetic.py: Frozen field API, EFD co-Z rescaling/addition/doubling, normalization, scalar routine and planted variant; preserve separate non-field counters.
    independent_checker.py: Separate affine verification and certificate-check interface, source-dependency restrictions and explicit soundness limits; independently authored/reviewed status is recorded rather than inferred from its filename.
    count_predictor.py: Formula/branch recurrence interface from the frozen specification, separate from producer traces, with commitment/blinding interface. No predicted numerical fixture counts are evaluated now.
    fixture_generator.py: Deterministic seed serialization, prime/order-certificate and reduced curve construction source; no realized fixture bytes or certificates.
    rho.py: Two actual worker processes, coefficient-tracked branches, common partition/DP law, canonical endpoint table, restart and IPC/checkpoint accounting.
    schemas.json: Inputs, source/admission hashes, field counts, blind reports, fixtures/certificates, each job artifact, summary/model rows, checkpoints and incomplete/failure outcomes. Structural validation alone does not prove arithmetic, independence or scientific validity.
    admission-template.json: All required actual-value fields null/unverified with blocking reasons; distinguish two physical hosts from three guest environments. No invented boot/image/cgroup/measurement data.
    implementation-manifest.yaml: Exact prepared source/dependency hashes, author/access provenance, runtime requirements and unresolved review dependencies; no launch or measured run claim.
    preparation-report.yaml: Requirement-by-requirement mapping, static work actually performed, source limitations, checker independence status, no-run attestation and exact next admission tasks.
