  from: "coordinator"
  to: "idea-generator"
  objective: "Constructive search for one M2 transport lemma: from represented/evaluable full integral End(E) and public E,C,X=phi_s(P),P,Q,D,N/certificates, actually evaluate gamma(X)=phi_s alpha dual(phi_s)(X) with alpha(P)=Q, equivalently return phi_s(Q), and supply a costed actual-message decoder without the same public lift."
  uncertainty_reduced: "OBL-CSTAR-TRANSPORT-1: whether any of at most three concrete representation/algorithm formulations of this single transport mechanism realizes the missing target response without importing connecting data or an oracle. At most one finalist, no new M1/P2 mechanism search."
