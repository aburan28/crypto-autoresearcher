  constraints:
    - "Read declared scientific inputs completely; prior decision/checkpoint/composition are historical internal evidence, not a new outcome. Source notes are locators, three IDEA records remain proposed. Do not read/list/hash the NEW plan, reviewer cards, reviewer/composer outputs or scientific peer messages."
    - "Search ONLY M2 source-to-target operator transport. At most three concrete representations/algorithm formulations of that single mechanism; at most one finalist. Names, parameter tuning, masks and generic wrappers are not distinct mechanisms. Do not open M1 Hom-search, P2 EndpointLift, another PKE family, an implementation or an experimental lane."
    - "Freeze the prior exact conditional admission boundary in admission-encodings.yaml: unary lambda>=8,a=lambda,k=floor(lambda/2),D=2^lambda,N=5^b least >4D (N<=20D), represented F_{p^2}, prescribed congruent prime/source certification, E_star:y^2=x^3+x, L(lambda)=lambda^2 nonbacktracking degree-3 law, saturation/map realization, public/secret certificates and exact normalization/basis coins. Resolve L versus L+1 convention explicitly without pretending it was settled in prior evidence."
    - "Freeze all bad-key tests, short-path screen h=floor(log_3(lambda^2)), B_h=2*3^h-1, per-trial lambda^12 caps and lambda^3 trials. First accepted output is the complete single-trial law conditioned on acceptance, not uniform endpoints. Setup, (1-q)^(lambda^3), transport failure and decoder failure are separate. Discharge or explicitly RETAIN prime/source, q>=lambda^-2, saturation/division, support, certificate, global least-model normalization and evaluation gaps. Conditional q bound is not proved by O(lambda^15) capped termination; successful per-attempt cost times inverse acceptance is w/q."
    - "Any restricted encoding/prospective serialization formulation must be stated as a conditional admission variant with exact law/output changes and cost obligations; it cannot silently alter the frozen prior packet, discharge original admission, or smuggle a target response into a certificate. Every unproved property is a named, quantified assumption/gap with falsifier and claim consequence."
    - "Analyze public path/ring recovery under that SAME accepted law. Include L=1/four-neighbor, logarithmic-length/polynomial effectively enumerable support and certificate leakage controls. Larger L/word cardinality/short-ball rejection supplies neither endpoint entropy nor a public lower bound. Charge path transport, full-order saturation and evaluations, not just matching endpoints."
    - "Exact inputs: full integral O=End(E), four domain-labelled evaluable source maps plus multiplication table/rational coordinates/certificates, E,C,X,P,Q,D,N and explicit public U,V,k for actual-message decode. Source End(E) acts on E, not on C; smooth finite source algebra may select alpha(P)=Q. Returned object must actually compute gamma(X) on C or the equivalent Y=phi_s(Q), not merely define that symbol."
    - "Do not supply or call a connecting path/ideal, evaluated Hom(E,C) anchor, orientation, retained tau, target-ring correspondence, sender phi_s/dual(phi_s), extra secret, target-response oracle or named realization primitive. If a formulation needs one, show its precise missing arrow/type/equivalence and do not retain it as End(E)-only transport. Renaming connecting recovery, unique-map lookup or ideal realization does not discharge this requirement."
    - "For EACH formulation give one fixed uniform pseudocode program from only the declared inputs; type and label every operation/output, state quantified correctness and explicit failure, and separately charge bit-time, memory, output length, every field/map/circuit/DAG evaluation, preprocessing, normalization and representation conversion. Polynomial stored DAG/fixed lattice rank/small desired point output is not polynomial evaluated work. Finite enumeration in D=2^lambda or instance-specific advice is not the required polynomial program."
    - "Preserve and restate the independently reviewed CONDITIONAL N>4D singleton P1 fiber lemma: compatible degree-D maps into the same normalized C agreeing on order-N P are equal; F_z={s},q_k(z)=1. Re-derive if needed but do not weaken N>4D to N^2>4D, or convert uniqueness/existence into map/operator construction. Fiber failure zero on admitted honest inputs is not admission/runtime/secrecy."
    - "message-decoder.yaml must continue from the ACTUALLY RETURNED object to m=s mod 2^k with exact public U,V,k, all-message/admitted-key/coin quantifiers and separate uniform cost/failure. A point Y, abstract ideal, class, kernel name or possible map is not itself plaintext. Charge any full-action/kernel reconstruction if returning only Y; an evaluated f allows separately costed f(U),f(V) and smooth slope extraction."
    - "Apply public-Hom, full-action/Robert, finite-linear-algebra, fixed-rank lattice, public inverse, ring-free reencryption, finite-witness quotient Q_A, quotient-collision, label-transport, generic-wrapper and distribution-bridge controls. State exact factorization/rationality/basis/kernel-rank/model/output/preprocessing premises and expected signatures for known-false objects. Publicly supplied full target response/connection repeating the formula is a control, not an attack on undisclosed partial data; nonadmission of full-action theorem is not secrecy."
    - "Keep first hypothetical PKE game and actual oracle arrows separate. EndRing solver -> secret -> hypothetical correct transport/decode -> break is a conditional ATTACK upper bound, not semantic security. An adversary-to-EndRing arrow needs exact simulation/advantage/witness extraction or a separately named intermediate assumption. Audit exact augmented accepted-key law, support/distance/auxiliary-data simulation and witness pullback; a recipient lift alone implies no security."
    - "attack-gates.yaml contains proof_search_map: reproduce exact conditional M2/source-alpha/target-response baseline, complete observation-fiber audit, explicit algorithm/witness quantifier order, method ceiling and nearby-object controls, separate representation/cost/reduction obligations and Pareto/sota_delta with provenance. Normalize against SÉTA,FESTA,POKE,PIKE,SiGamal/C-SiGamal,LIT-SiGamal and the three proposed ideas; no invented quantitative comparison or unchecked dominated_by null."
    - "Record precise formalization impediment/revisit: there is no frozen executable target-response program or costed represented End(E)/isogeny evaluation definition/library boundary yet; an abstract singleton lemma alone is not formal verification of transport. Revisit Lean after a complete typed target program/lemma and assumptions exist under a separately approved formal task; do not write Lean or run a formalizer here."
    - "blind-statement.yaml must be standalone BARE definitions/parameters: exact Setup/admitted law/caps/rejection/certificates/encodings, O/E/C/X/P/Q/D/N/U/V/k types, undecorated algorithm for every retained or partial formulation, claimed correctness event/cost/failure and complete P1 fiber quantity. Exclude proofs, identities-as-derivations, rationale, source names, prior/producer verdicts, review priors and all previous reviews. The Validator receives only its card and this definition packet."
    - "Exactly eight declared outputs. transport-algorithm.yaml and correctness-and-cost.yaml contain every attempted typed formulation and exact algorithm/proof gaps, even with no finalist; message-decoder.yaml charges the actual output-to-message path. provenance.yaml is LAST, lists every actual read with provenance and honest native runtime identity, requested research-deep/high and null/unverified actual model/effort if unavailable."
    - "A finalist requires discharged applicable admission and representation gates, concrete uniform polynomial End(E)-only target response, actual-message correctness and scoped recipient/public control checks. Any retained assumption blocks its stronger corresponding claim. If none survives, name ONE exact mathematical continuation with condition/what_is_blocked/clears_when/recheck/owner/next_action/asserts_nothing_about; do not close any family/representation."
    - "Zero scientific runs, trials, implementation, source-state changes, external messages, agent/successor launch or extra record. Write only declared artifacts with apply_patch; no goal/ledger/queue/claim/lane/Git mutation. Preparation approves work, not a theorem/security/novelty/practicality/deployment or universal possibility/impossibility result."
