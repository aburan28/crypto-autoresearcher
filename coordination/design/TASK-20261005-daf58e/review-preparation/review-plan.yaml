      breaking_artifact: "Forbidden connection/extra secret or renamed oracle; polynomial public same response/message; asserted equivalence/theorem transfer without representation/premise/cost proof."
    -
      id: "J4"
      joint: "J4 -- Recipient/public asymmetry, oracle-arrow direction and distribution bridge."
      assigned_to: "TASK-20261005-519bc4"
      attack_plan: "Separate correctness/fiber from computational asymmetry; vary finite reachable Q_A/labels/quotient/wrapper and public support/certificate boundary. Draw exact first game/attack versus reverse reduction/advantage arrows; freeze auxiliary simulation/support distance and evaluated witness pullback, work message-revealing/structured-support controls."
      breaking_artifact: "Unsupported asymmetry/lower bound; solver-to-decrypt called security; quotient-only need with absent reverse bridge; missing augmented-law/challenge simulation/distance/pullback or extra-secret assumption."
    -
      id: "J5"
      joint: "J5 -- Primary-source/nonduplication and claim-language audit."
      assigned_to: "TASK-20261005-519bc4"
      attack_plan: "Fresh independently retrieve/hash-verify load-bearing source sections; normalize M2 formulation against SÉTA,FESTA,POKE,PIKE,SiGamal/C-SiGamal,LIT-SiGamal,Robert/Maino and all three proposed ideas. Check trapdoor/action/message/assumption arrows, source versions, true overlap and unverified delta, no security/novelty/practicality/deployment claims."
      breaking_artifact: "Primary contradiction, normalized duplication, unchecked claimed improvement/source provenance, proposal promoted as fact, or concrete scoped source impediment."
