  claim_under_review: "Constructive search for one M2 transport lemma: from represented/evaluable full integral End(E) and public E,C,X=phi_s(P),P,Q,D,N/certificates, actually evaluate gamma(X)=phi_s alpha dual(phi_s)(X) with alpha(P)=Q, equivalently return phi_s(Q), and supply a costed actual-message decoder without the same public lift. At most three formulations of ONE mechanism, no M1/P2 search; prospective conditional encoding restrictions must not rewrite prior admission."
  claim_binding_rule: "Exact scientific claim is the future verified nine-path snapshot. Validator gets only its handoff and snapshot-bound bare blind-statement; Red Team independently verifies full receipt and quotes exact claims."
  coordinator_prior: "Frozen before producer dispatch: source finite alpha algebra and the conditional N>4D singleton P1 fiber/transport identity are retained from the authorized checkpoint. The decision-changing gap is concrete response on C, not its existence. I expect hidden connecting data, uncharged target evaluation/model/DAG costs or incomplete admission/decoder to remain possible. A genuine fixed uniform target program could overturn this prior. Correctness/uniqueness alone and solver-to-decrypt do not prove public asymmetry or EndRing security. These are explicit priors, not this batch's findings."
