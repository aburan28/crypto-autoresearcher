      id: "J1"
      joint: "J1 -- Exact conditional admission, encodings, uniform costs and public-support boundary."
      assigned_to: "TASK-20261005-dce19a"
      attack_plan: "From bare law derive accepted mass q and w/q, Setup/capped versus successful generation; inspect certificate fields/normalization/evaluation and exponential DAG costs; vary L=1/log-support and all-bottom capped control. Retain or discharge prime/source,q, saturation and support gaps explicitly."
