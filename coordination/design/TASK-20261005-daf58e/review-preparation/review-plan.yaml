      breaking_artifact: "Unimplemented target response/connecting call, wrong-domain operation, uniqueness promoted to construction, missing actual-message path or nonuniform/exponential work."
    -
      id: "J3"
      joint: "J3 -- Hidden connecting data/equivalence and public-control attacks."
