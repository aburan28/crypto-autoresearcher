blind_rederivation:
  task_id: TASK-20261005-dce19a
  statement_id: TASK-20261005-32debd
  role: validator
  review_kind: independent_blind_symbolic_rederivation
  joints_owned: [J1, J2]
  scientific_sources_read:
    - coordination/design/TASK-20261005-daf58e/handoffs/TASK-20261005-dce19a.yaml
    - coordination/design/TASK-20261005-daf58e/tasks/TASK-20261005-32debd/blind-statement.yaml
  non_scientific_governance_read:
    - AGENTS.md
    - agents/validator.md
  provenance: internal
  experimental_runs: 0
  implementation_created: false
  external_sources_or_prior_proofs_used: false
  scope: >-
    Only the two assigned joints are assessed. Dispatch preconditions are
    dispatcher assertions, not independently inspected Git or snapshot facts.
    All results below are symbolic derivations from the bare statement.
    The report neither adjudicates a whole claim nor proves impossibility of
    another transport, normalization, admission, or public inversion algorithm.

  parameter_derivation:
    scalar_sizes: >-
      a=lambda, k=floor(lambda/2), D=2^a. Minimality of b gives
      5^(b-1)<=4D<5^b=N<=20D, so b=Theta(lambda), log_2(N)=lambda+O(1),
      gcd(D,N)=1, and N>4D. N>4D is a strict hypothesis, not an asymptotic
      approximation. Unary lambda permits polynomial work in these bit sizes.
    field_sizes: >-
      A defined p has n=ceil(log_2(p))<=lambda^2. The prescribed congruence
      implies 3DN divides p+1 and p=3 modulo 4. Thus the presented quadratic
      field is a field, p is not 2,3,5, and D,N and degree-3 torsion are prime
      to p. The certified scalar Frobenius [-p] makes E(F)=E[p+1] rational,
      hence all D- and N-torsion is rational on each certified retained curve.
      Transporting scalar Frobenius across an F-isogeny preserves it.
    genuine_degree: >-
      U,V are a rank-two D-basis. U+tV has exact order D for every t, since
      its first coordinate is 1. Its cyclic subgroup is finite etale of size D.
      Its quotient map is separable of genuine degree D; normalization adds
      degree-one isomorphisms and does not change that degree.

  J1:
    assessment: inconclusive
    assessment_scope: >-
      Exact conditional identities and capped termination follow. Concrete
      admission, polynomial Setup, the lower bound on q, the global normalizer,
      certificate schemas, evaluator bounds, and effective accepted support
      remain unestablished. These are missing facts, not negative evidence that
      no suitable implementation or parameter family exists.

    setup_and_failures:
      deterministic_setup: >-
        For fixed lambda and supplied source input, the specified prime search
        and verification either return a particular Setup output theta or
        bottom. No distribution over source inputs or absent primes is stated,
        so an unconditional numerical Setup-failure probability is undefined.
        A failure of prime existence, source validity, or efficient construction
        is distinct from subsequent KeyGen, transport, and decoder failure.
      prime_search: >-
        M0=12*D*N=Theta(2^(2lambda)). Searching the specified interval is finite
        if p is absent and terminates at its first qualifying prime otherwise.
        Finite search does not supply polynomial bit-time. Even a search only
        through the congruent candidates has a permitted interval containing
        order 2^(lambda^2-2lambda) candidates; testing each integer is larger.
        Polynomial primality verification for one candidate cannot bound the
        number of candidates searched. Neither a prime in this particular
        finite interval nor a polynomial stopping index is derived here.
      source_verification: >-
        Reading up to lambda^4 source bits, field construction, primality and
        congruence checks, scalar-Frobenius checks, four supplied evaluated maps,
        table identities, quaternion coordinates, integral-order membership and
        trace discriminant p^2 all contribute. A bit-length bound on the input
        alone is not a bound on expanded map identities or verification work.
        The statement has no explicit polynomial source-verifier program.

    exact_single_trial_law:
      definitions: |-
        Fix a successful Setup output theta and fixed serializer/verifier
        programs Sigma=(Sigma_pub,Sigma_sk). Let T(theta,Sigma;omega) be the
        entire single capped trial, and let A be the event that it accepts.
        omega comprises every fair bit actually used for subgroup selection,
        finite-range retries, point slots and later randomized subroutines.
        Rejecting or accepting terminal prefixes have probability 2^(-length).
        Let mu be their induced complete joint law, W their full trial cost,
        q=mu(A), and w=E_mu[W]. All rejection causes belong to A's complement.
        For a set B of output tuples, if q>0:
          Pr[T in B | A,theta,Sigma] = mu(B intersect A)/q.
        If q=0 this conditional law is undefined, not an empty usable key law.
      walk: >-
        Before identifications, there are 4*3^(L-1) length-L nonbacktracking
        words. Exact finite-range fair-bit rejection makes each complete
        untruncated word have probability 1/(4*3^(L-1)). The cap and all later
        costs and tests are part of the full tape law; they cannot be omitted
        when weighting accepted words. An endpoint's probability is the sum
        over all words and remaining tapes normalizing to it. Isomorphic
        endpoint multiplicities are added; no inverse-automorphism weighting
        appears. Conditioning changes endpoint, point-basis, order, and
        certificate correlations together, not merely the curve marginal.
      point_slots: >-
        The slot set has 1+2*p^2 elements. Infinity has one valid slot. A
        nonzero quadratic root pair contributes one slot per lexicographic
        root; a zero root contributes exactly one valid slot; a nonsquare
        contributes none. Thus every rational point has exactly one valid
        slot, and accepting a valid slot gives a uniform rational point.
        Scalar Frobenius gives #(E(F))=(p+1)^2, so the uncapped valid-slot
        probability is (p+1)^2/(1+2*p^2). Projection by (p+1)/M sends that
        uniform law uniformly onto E[M], for M=D,N. For two independent
        projected points, the uncapped rank-two basis probability is
        (1-l^(-2))*(1-l^(-1)): 3/8 for l=2, 96/125 for l=5.
        Primitive pairing is equivalent to being a basis over Z/l^e Z.
        These useful uncapped factors do not establish q, because caps,
        resampling policies, order realization and normalization intervene.
      range_sampler: >-
        Drawing ceil(log_2(M)) fair bits and retrying integers at least M is
        exact uniform finite-range sampling. Every rejected bit block counts.
        The per-block acceptance is greater than 1/2 except power-of-two
        ranges, where it is 1. Its random-bit count is unbounded before the
        cap; a capped sampler can return bottom. It is unsound to replace
        its cost or failure contribution by a free ideal random choice.
      schema_dependency: >-
        Sigma_pub and Sigma_sk are outstanding field-by-field programs, not
        specified constants. Consequently the statement defines a family of
        conditional laws parameterized by them, rather than one complete
        executable key distribution or a computable numerical q. A verifier
        accepting extra path or target-response data would change the input
        view and law; it is expressly outside the stated admission contract.

    repeated_trials_and_cost:
      exact_failure: |-
        Set n_trials=lambda^3 and u=1-q. Independent identical trials give
          Pr[KeyGen=bottom | theta,Sigma] = u^n_trials.
        For q>0 and any output set B:
          Pr[first accepted tuple in B | theta,Sigma]
            = (1-u^n_trials)*mu(B intersect A)/q.
        Conditioned on KeyGen succeeding, its complete tuple law is exactly
        the single-trial law conditioned on A. This says nothing about Setup.
      bounded_termination: >-
        At most lambda^3 trials each charge at most lambda^12 bit operations
        and random bits, yielding the advertised K0=O(lambda^15) KeyGen bound.
        A streaming implementation retains only the current trial or accepted
        tuple, with O(lambda^12) retained output/workspace provided intermediate
        bits are also checked. Source input and Setup work/storage are additional.
        Integer counters and control bookkeeping must be included in the cap.
        This termination bound exists even when every trial rejects.
      expected_cost_distinction: |-
        For q>0, the unconditional expected finite KeyGen work is
          E[C_cap] = w*(1-u^n_trials)/q;
        for q=0 it is n_trials*w.
        Unlimited independent retry-to-success has mean w/q.
        It is not generally the exact mean of the finite capped procedure
        conditioned on its succeeding. With w_A=E[W|A], w_R=E[W|not A],
        0<q<1 and w=q*w_A+u*w_R:
          E[C_cap | success]
            = w_A + w_R*(u/q - n_trials*u^n_trials/(1-u^n_trials))
            = w/q - n_trials*w_R*u^n_trials/(1-u^n_trials).
        Thus the bare phrase successful_expected_cost=w/q needs the
        unlimited-retry or amortized-per-success interpretation. At q=0
        successful expected cost is undefined, despite bounded termination.
      conditional_negligible_failure: >-
        If the separately required q>=lambda^(-2) holds for sufficiently large
        defined lambda, then (1-q)^(lambda^3)<=exp(-q*lambda^3)<=exp(-lambda).
        If w=O(lambda^12), unlimited mean w/q is O(lambda^14). Neither bound
        proves that q's lower bound holds. No prime, basis, graph-size, or
        finite-search count given in the statement supplies it.

    order_saturation_and_realization:
      typed_ring: >-
        tau:E_star->E and dual(tau):E->E_star. Therefore tau*beta*dual(tau)
        acts on E, not E_star. Writing d_tau=3^L and tau^(-1)=dual(tau)/d_tau
        in Hom^0, R=Z*1+d_tau*Ad_tau(End(E_star)). It is an integral order:
        products of transported terms acquire the middle factor
        dual(tau)*tau=[d_tau]. The domain-labelled maps and conversions are
        essential for this assertion.
      size_derivation: >-
        A full integral source order admits a Z-basis starting with 1.
        Conjugation preserves its rational trace pairing. In that basis, R
        scales the other three basis directions by d_tau, so its trace
        discriminant is d_tau^6*p^2. An integral full target order of trace
        discriminant p^2 then has index d_tau^3 over R. The trace-dual quotient
        has cardinality d_tau^6*p^2 under the stated discriminant convention.
        These objects have polynomial logarithmic size, but potentially an
        enormous number of subgroups; HNF subgroup enumeration is not thereby
        polynomial. This derivation is conditional on the certified source
        order really being the full rank-four order and the stated trace form.
      omitted_algorithmic_bounds: >-
        Compute R's rational basis and trace-dual lattice, denominator clearing,
        Smith/Hermite forms, enumerate candidate subgroups in the declared
        lexicographic order, test integrality, multiplicative closure and exact
        discriminant, and count every discarded candidate. Realizing a rational
        element beta/e as an integral map requires its denominator-kernel
        factorization and exact division identities, including subgroup-scheme
        issues if a denominator is not prime to p. Increasing-encoding-length
        coefficient search is only a finite/existence specification; it gives
        neither a polynomial first-witness length nor a polynomial search index.
        All root/field computations, coefficient bits, evaluations and expanded
        identities are charged. No supplied fact lower-bounds the mass completing
        these operations before the cap.

    encodings_certificates_and_erasure:
      explicit_sizes: >-
        Integers are signed length-delimited binary and lambda is unary.
        A field element uses two padded n-bit residues. A finite point uses
        two field elements plus a model label; curves retain coefficients and
        field labels. Order descriptions retain four complete evaluated maps,
        all rational-coordinate numerators/denominators and the integral
        rank-four table, not four abstract generator names. Map descriptions
        retain domains, coefficients, node bits and executable semantics.
        Scalar multiplications, rational-coordinate operations and exact field
        comparisons use actual bit sizes. Degree or node count alone is not a
        time, intermediate-bit or expanded-polynomial bound.
      certificate_view: >-
        Publicly specified categories are field/model/scalar-Frobenius/order/
        pairing/normalization; secret categories are the integral order, its
        evaluated maps, table, rational coordinates and discriminant. Exact
        byte layouts, permitted witnesses, field labels, parsers and verifier
        programs remain unspecified in Sigma_pub,Sigma_sk. Consequently neither
        the promised exact input view nor its verification cost is completely
        defined. Honest labels and simultaneous conversion of all retained
        bases, maps and slope/message coordinates must be checked, not assumed
        from equality of j-invariants.
      equivalence: >-
        A GL_4(Z) order-basis change must transform maps, table and coordinates
        together. Simultaneous curve conjugation also transforms every map and
        point. Arbitrary independent basis relabeling changes slopes and their
        residues unless the message-coordinate convention is transported.
      erased_information: >-
        Erasing tau, kernels, walk transcript, connecting ideals, orientations
        and temporary witnesses leaves exactly evaluated E-to-E order maps.
        It supplies no evaluated E-to-C Hom element. A serialized certificate
        silently retaining a path, a target orientation, or target-response
        information violates the advertised view and changes the mechanism.
        The unresolved schemas prevent a field-by-field erasure audit.
      bounded_circuit_variant: >-
        It is expressly unused. Adding a bounded-evaluation verifier would
        condition the full original trial law on a new predicate, producing
        a new q and new support law and adding interpreter/circuit certificates.
        Its verification, intermediate bounds and acceptance mass must be
        derived afresh; it cannot repair the original statement by projection.

    normalization_and_evaluation:
      orbit_and_conversion: >-
        In characteristic not 2 or 3, fixed short-model isomorphisms use
        nonzero u with A'=u^4*A, B'=u^6*B, x'=u^2*x, y'=u^3*y, up to reversing
        the isomorphism convention consistently. All permitted roots for fixed
        models must be returned and all point/map coordinates transported.
        Fixed-model equations have bounded degree, but their root algorithms,
        randomness and failure still count. Global least-model normalization
        minimizes across the whole F-star orbit, then minimizes the simultaneous
        retained tuple across the residual automorphisms. A single arbitrary
        isomorphic model is not that least representative.
      exhaustive_bound: >-
        Exhaustive u enumeration has p^2-1 trials, exponential in the unary
        security parameter, even though log(p)<=lambda^2. It provides a finite
        definition and a finite F3 program, not a uniform polynomial normalizer
        or least-model certificate verifier. An efficient alternative remains
        an outstanding requirement; no lower bound against alternatives follows.
      work_accounting: >-
        Charge prime/source preprocessing, field arithmetic, representations,
        roots/extensions, all subgroup choices, walk edges, denominator tests,
        saturation, division searches, pairings, smooth digits, normalization,
        every map evaluation, equality proof, expanded polynomial and output.
        A sequential a-step degree-2 chain can evaluate one point in polynomial
        field work despite degree D. Conversely a compact composition DAG can
        demand exponentially many recursive map evaluations, and expanding a
        degree-3^L map for equality can require enormous coefficient work.
        Actual semantics and intermediate bounds, rather than compactness,
        must discharge the map_evaluation requirement.

    screened_and_effective_support:
      exact_radius_bound: >-
        There is one length-zero word and 4*3^(j-1) words at length j>=1.
        Summing through h gives 1+2*(3^h-1)=B_h=2*3^h-1<=2*lambda^2-1.
        Curve collisions only decrease the enumerated normalized endpoint set.
        Exact screening of this set is polynomial in its word count, conditional
        on polynomial normalization/conversion and verification. Its work is
        still part of the capped trial.
      missing_effective_support_fact: >-
        Rejecting one small radius does not show that every polynomial publicly
        enumerable endpoint set has negligible accepted mass. A different
        enumerable set outside the radius could carry all accepted mass.
        Many long words can collide, and order-realization or cost conditioning
        can concentrate their accepted endpoints. Uniform word sampling,
        L=lambda^2 and q>=lambda^(-2) alone do not prove the required effective
        support statement, mixing, or any global public recovery lower bound.

  J2:
    assessment: breaks
    assessment_scope: >-
      The supplied formulations do not realize the desired uniform polynomial
      target-response-plus-actual-message program. F1 and F2 always return
      bottom. F3 returns the correct public map/Y/message under exact finite
      arithmetic, but has exponential worst-case iterations and possibly
      expensive normalization. The point-only decoder is a missing program.
      This breaks this specified construction/complexity conjunction, not the
      conditional identities, the honest fiber theorem, or all possible methods.

    typed_source_prefix:
      input_validation: >-
        O is End(E), each beta_i:E->E is integral and evaluated, P,Q are an
        ordered exact N-basis on E, U,V an exact D-basis on E, and X is an
        exact order-N point on C for honest inputs. Parsing, certificates,
        domains, field embeddings and orders are checked before evaluation.
        Tagged bottom is not a point or map and propagates through decoding.
      basis_evaluations: >-
        Eight actual calls beta_i(P),beta_i(Q) occur on E. With
        zeta=e_N(P,Q) primitive, coordinates of R=xP+yQ satisfy
        e_N(R,Q)=zeta^x and e_N(P,R)=zeta^y. Smooth 5-power digit extraction
        therefore determines both columns of every M_i in M_2(Z/NZ), charging
        pairing work, field operations, digit tables and conversions. This is
        source action only; none of these calls accepts X on C.
      surjectivity_rederivation: >-
        Restriction O->End(E[N]) has kernel N*O. Indeed an endomorphism killing
        all finite etale E[N] factors through the quotient [N]:E->E, hence is
        [N] times an integral endomorphism; the converse is immediate.
        O/N*O has N^4 elements because the full O has rank four.
        End(E[N])=M_2(Z/NZ) also has N^4 elements, so the injective restriction
        is bijective. This proves source-action surjectivity from full order
        and genuine rational N-torsion, without a producer implementation.
      modular_solution: >-
        The first-column projection M_2(Z/NZ)->(Z/NZ)^2 is surjective.
        Thus the two-coordinate system sum c_i*M_i*(1,0)^t=(0,1)^t has exactly
        N^2 solutions in (Z/NZ)^4. A modular SNF computation plus consistent
        least-representative selection can choose the lexicographically least
        c in [0,N)^4. The solve and its integer intermediates are charged.
        A non-full input order invalidates this argument and must be rejected.
      integral_alpha: >-
        alpha=sum [c_i]*beta_i is an integral evaluated E-to-E endomorphism.
        Its source matrix A has first column (0,1)^t, so alpha(P)=Q.
        The declared four additional source-map calls for checking alpha(P)
        make twelve prefix evaluations if previous evaluations are not reused;
        reuse can save calls but not erase the charged source action work.
        Scalars have O(log N) bits and addition/scalar work is on E.
        Algebraic correctness does not bound the probability of PREFIX_CAP,
        certificate failure, or expensive evaluators; no uniform negligible
        source-prefix failure bound is stated.

    conditional_target_identity:
      domains: |-
        phi_s:E -> C_s                 degree D
        dual(phi_s):C_s -> E           degree D
        alpha:E -> E                   integral source endomorphism
        gamma=phi_s*alpha*dual(phi_s):C_s -> C_s
        X=phi_s(P): point on C_s
        Y=phi_s(Q): point on C_s
      derivation: |-
        If these evaluated maps and normalized labels are available:
          dual(phi_s)*phi_s = [D]_E,
          alpha(P)=Q,
          gamma(X)=phi_s*alpha([D]P)
                  =phi_s([D]Q)=[D]phi_s(Q)=[D]Y.
        Since gcd(D,N)=1 and Y belongs to C_s[N], Y=[D^(-1) mod N]gamma(X).
        For f=i*phi_s to another normalized isomorphic target model, replace
        gamma by f*alpha*dual(f) and transport X,Y through i simultaneously.
        These are conditional identities, not algorithms obtaining phi_s,
        gamma, or gamma(X) from the actual declared input view.
      invariants_do_not_evaluate: >-
        Norm/trace coordinates of alpha and formal conjugation rules do not
        produce a C-to-C evaluator. For nonzero alpha, gamma has degree
        D^2*degree(alpha); its rational invariants still fail to specify the
        target embedding or its action at X. Applying an E-to-E beta_i to
        X on C is a domain error.

    formulation_diagnoses:
      F1:
        available_target_frame: >-
          Projection and primitive pairing yield a target N-basis X,T0,
          provided sampling and evaluation finish before the cap. Write
          e_N(X,T0)=zeta^a0 with a0 a unit modulo N. Then
          T=[D*a0^(-1)]T0 satisfies e_N(X,T)=zeta^D.
          For the honest unknown Y, the degree-D pairing identity gives
          e_N(X,Y)=zeta^D. Consequently Y=T+uX for a unique unknown u modulo N.
          Primitive pairings determine a compatible frame, not this u.
        formal_family: >-
          In bases (P,Q) and (X,T), phi_s on N-torsion has matrix
          B(u)=[[1,u],[0,1]], its dual has D*B(u)^(-1), and gamma has
          D*B(u)*A*B(u)^(-1). Because A*(1,0)^t=(0,1)^t, the formal gamma(X)
          is [D](T+uX). The unknown shear is exactly the missing Y coordinate;
          norm, trace and the pairing normalization do not determine it.
        actual_return: bottom(MISSING_TARGET_FRAME)
        actual_message_result: bottom(TRANSPORT_FAILED)
        point_and_message_failure: 1
        complexity: >-
          Prefix, target point slots/projection, primitive-pairing trials,
          smooth digits, scalar work and formal-family bits are charged under
          lambda^12 plus input storage. Small partial cost is not target success.
      F2:
        formal_syntax: >-
          Sandwich(UnknownMap(E,C,D,P,X),alpha,UnknownDual(C,E,D)) has a
          potential C-to-C type but neither unknown Hom arrow is an evaluated
          constant. Computing alpha's fixed-rank rational coordinates and
          norm/trace does not instantiate either arrow.
        actual_return: bottom(MISSING_TARGET_EVALUATOR)
        actual_message_result: bottom(TRANSPORT_FAILED)
        point_and_message_failure: 1
        complexity: >-
          Fixed-rank table/coordinate arithmetic and formal-word storage are
          charged with the prefix. Existence or successful symbolic typechecking
          does not turn this syntax into a target response.
      F3:
        actual_map_and_points: >-
          For every t, form the actual cyclic degree-D quotient chain, normalize
          and examine all permitted fixed-model isomorphisms against (C,X).
          The honest t=s is present. The independent fiber proof below shows
          that every match has t=s and its evaluated f equals the honest map
          into the observed model. Thus Y=f(Q) and the returned slope/map have
          exact honest meaning. The Y/f/t branch does not query O.
        optional_W: >-
          On successful source-prefix validation and evaluation, the actual
          typed composition f*alpha*dual(f) returns W=[D]Y. Prefix, certificate
          and evaluator cap failures propagate. No uniform negligible bound
          for those optional-W failures follows from full mathematical order
          action or from the correctness of the public Y branch.
        actual_message_result: >-
          The declared f-based decoder returns m under exact total arithmetic
          and valid honest inputs; equivalently returned t modulo 2^k is m.
          Mathematical Y/map/message failure is zero under those premises.
          There is no new capped polynomial F3 implementation in the statement.
        complexity: >-
          D=2^lambda candidate iterations are necessary in this program's worst
          case: m=2^k-1 and r=2^(a-k)-1 give s=D-1, with no earlier match by
          the fiber theorem. Even with polynomial candidate work, this loop is
          exponential. For fixed m and uniform r its mean iteration count is
          1+m+2^k*(2^(a-k)-1)/2, also order D. Exhaustive normalization can add
          p^2 work per candidate. Charge candidate kernel/chain construction,
          roots, normalization, conversions, checks, optional dual/source/
          forward evaluations and all preprocessing. Streaming one candidate
          reduces memory, not iteration count or evaluated work. This is a
          lower bound for this enumeration program only, not for public recovery.
      point_only_branch:
        actual_return: bottom(MISSING_FULL_ACTION_DECODER)
        diagnosis: >-
          Correct Y supplies the full labelled N-torsion action P->X,Q->Y.
          It is not an evaluated degree-D map or its D-kernel. A uniform map/
          kernel reconstruction program, with exact models, embedding, kernel
          ranks, preprocessing, work, memory and failure bounds, is missing.
          Smooth factorizations, a true existence statement or a unique map
          do not fill that program. A genuine point response must be followed
          through this missing arrow to an actually returned message.

    full_honest_fiber_rederivation:
      hypotheses: >-
        A successful Setup, accepted genuine D,N bases, exact normalized labels,
        genuine degree-D separable quotient maps, and a point P of exact order N
        with N>4D are required. Isomorphisms preserve the elliptic identity.
        Merely a nominal degree, approximate equality or a smaller-order point
        would not meet these hypotheses.
      existence: >-
        For z=(C_s,phi_s(P)), t=s belongs to F_z by the identity isomorphism
        in the represented normalized model. All model conversions transport
        the retained image simultaneously, so existence is exact.
      degree_bound: >-
        If t belongs to F_z, take an allowed isomorphism i:C_t->C_s and set
        f=i*phi_t, g=phi_s. Both are degree-D E-to-C_s homomorphisms. For
        delta=f-g, delta(P)=0. The degree quadratic form obeys
        degree(f+g)+degree(f-g)=2*degree(f)+2*degree(g)=4D. This identity follows
        by expanding dual(f+g)*(f+g) and dual(f-g)*(f-g): cross terms cancel
        and dual(f)*f and dual(g)*g are their scalar degrees. Nonnegative
        degree(f+g) therefore gives degree(delta)<=4D. A nonzero delta killing
        exact-order-N P has all N distinct points of <P> in its kernel, so
        degree(delta)>=N, including any inseparable multiplicity. N>4D rules
        that out. Hence delta=0 and f=g as actual maps.
      slope_equality: >-
        Equal maps have equal kernels. In the D-basis (U,V), equality of
        <(1,t)> and <(1,s)> gives (1,t)=c*(1,s) for a unit c modulo D.
        The first coordinate forces c=1, so t=s modulo D. This argument covers
        every target isomorphism and residual automorphism in the definition.
      exact_quantities: |-
        F_(C_s,phi_s(P))={s}.
        {t mod 2^k:t in F_(C_s,phi_s(P))}={m}.
        q_k=1, with mathematical honest-fiber failure 0 under the hypotheses.
      computational_limit: >-
        This proof tests equality of already existing maps; it computes neither
        one from X nor the matching slope. Uniqueness fixes the result of any
        successful reconstruction, but is not an executable lookup or its cost.
        The theorem supports the finite F3 match and correctness, not a
        polynomial target-response or public inversion assertion.

    actual_f_based_message_decoder:
      kernel_consequences: >-
        For the actual honest evaluated f, set A=f(U), B=f(V). A+[s]B=0.
        B has exact order D: if [d]V lies in <U+sV>, its U-coordinate forces
        the subgroup coefficient to be zero modulo D, then d=0 modulo D.
        This exact kernel argument is required for the order check.
      reduction_to_message: >-
        H=[2^(a-k)]B has order 2^k and
        G=-[2^(a-k)]A=[s]H=[m]H. J=[2^(k-1)]H is the nonzero point of order 2
        in <H>. The decoder works in this actual target group, with f's model
        conversions already applied to U and V images.
      digit_induction: >-
        Suppose t0 equals m modulo 2^j. Write m-t0=2^j*v. Then
        Z=[2^(k-1-j)](G-[t0]H)=[2^(k-1)*v]H is 0 for even v and J for odd v.
        The chosen d is exactly the next message bit. Updating t0 by d*2^j
        preserves the induction for j+1. After k rounds t0=m in [0,2^k), and
        the final group check holds. Inconsistent objects must yield bottom.
      charged_cost: >-
        Two actual f evaluations, exact point/model/order validation, initial
        scalar work, and repeated doubles/scalar sums cost O(k^2+a) group
        operations for the declared digit routine, with every field operation,
        extension, representation conversion and evaluator intermediate charged.
        A full smooth slope decode, if substituted, also costs actual group work;
        it is not a free consequence of uniqueness. The message output has k bits.
        With only X,Y and no f/kernel this routine cannot even form A and B.

    missing_typed_arrows:
      - arrow: evaluated_E_to_C_Hom_element
        diagnosis: >-
          No connecting path, ideal-to-Hom procedure or evaluated phi_s is an
          available constant. Source End(E) action is not target End(C) action.
      - arrow: source_to_target_order_embedding_or_orientation
        diagnosis: >-
          Abstract rational coordinates, norm/trace or an abstract ring
          correspondence do not give a compatible evaluated C-to-C embedding.
          Reconstructing one must charge its alignment and all arithmetic.
      - arrow: retained_tau_or_ideal_or_path
        diagnosis: >-
          tau:E_star->E and walk/ideal/orientation data are erased and not in
          sk. Reintroducing them changes the view. Even tau's direction is not
          E->C and requires an additional target connecting arrow.
      - arrow: unknown_target_frame_shear
        diagnosis: >-
          Choosing T with the correct pairing leaves Y=T+uX and u unknown.
          A target frame correspondence is the missing information, not a
          pairing normalization or integral matrix solve on E.
      - arrow: sender_map_or_target_response_oracle
        diagnosis: >-
          Supplying the sender's evaluated phi_s, its kernel/secret slope, an
          oracle for gamma(X), or an oracle for Y adds input. Count the oracle
          and its failure/work; do not attribute it to the undecorated recipient.
      - arrow: full_action_to_map_or_kernel_to_residue
        diagnosis: >-
          The point-only interface needs an actual reconstruction followed by
          smooth D-kernel/slope decoding. A theorem giving existence or a unique
          full action is not that algorithm, including preprocessing and output.

    uniform_program_audit:
      required_quantifiers: >-
        Fix one uniform polynomial recipient program first, then require every
        successful Setup, accepted key and honest m,r to have recipient-coin
        failure bounded by a single negligible epsilon_T(lambda), followed by
        an actual returned-object decoder producing m. A per-instance witness,
        finite search, conditional identity or compact formal output does not
        satisfy that order of quantifiers.
      actual_failures: >-
        F1/F2 have actual point/message failure 1. F3's public Y/map/message
        branch is mathematically total on honest admitted inputs with exact
        finite arithmetic, but has no uniform polynomial work bound. Its
        optional W inherits prefix/certificate/cap failures without a stated
        uniform negligible estimate. The point-only decoder returns bottom.
        Setup and KeyGen failures are separately conditioned away in these
        statements and must not be relabelled transport or decoder failures.
      outputs_and_memory: >-
        F1/F2 output only a tag, not their formal families as actual maps.
        F3 outputs one actual a-step chain, target point(s), an a-bit slope and
        a k-bit message after decoding. Store all chain/node/coefficient bits,
        validation data and interpreter workspaces. Polynomial output/storage
        does not imply polynomial work to discover or execute the output.

  known_false_controls:
    - id: L1_and_logarithmic_support
      expected_signature: >-
        A polynomial enumerable walk support cannot count as negligible
        effective support; with the stated screen L=1 is certainly rejected.
      independently_derived_actual_signature: >-
        For lambda>=8, h>=1. Every L=1 endpoint is one of the four enumerated
        length-one endpoints and fails the radius screen, so q=0. More generally
        L<=h is certainly screened out. An unscreened logarithmic-L walk has
        polynomially enumerable whole endpoint support and accepted mass 1
        there if any keys accept; normalization and any reconstruction work
        still require their own bounds. No claimed support-hiding or secret
        advantage follows merely from giving the path a secret name.
      result: expected_signature_obtained
    - id: all_bottom_cap
      expected_signature: small_termination_cost_without_usable_acceptance
      independently_derived_actual_signature: >-
        Set A empty. q=0, KeyGen always returns bottom, and its cost is at most
        K0=O(lambda^15). The accepted law and successful expected cost do not
        exist. Thus capped running time alone never demonstrates admission.
      result: expected_signature_obtained
    - id: constant_view
      expected_signature: q_k_at_least_2
      independently_derived_actual_signature: >-
        In the control view v(t)=z0 for all slopes, the fiber is all Z/DZ and
        its residue image has 2^k elements, hence q_k=2^k>=2. This control
        drops the genuine degree-D map/point observation hypotheses, so the
        degree-bound proof cannot pass unchanged. It exposes any inference
        that would claim identifiability merely from existence or true inclusion.
      result: expected_signature_obtained
    - id: supplied_public_inverse
      expected_signature: singleton_fiber_with_same_public_inversion
      independently_derived_actual_signature: >-
        For v(t)=t, or any injective view with its public inverse supplied,
        the fiber is {s} and q_k=1, while public inversion returns s and m.
        Fiber cardinality alone therefore shows neither hardness nor a secret
        advantage. This is a diagnostic control, not a claim about public
        inversion of the actual elliptic observation.
      result: expected_signature_obtained
    - id: exponential_enumeration_and_compact_DAG
      expected_signature: compact_descriptions_can_have_exponential_work
      independently_derived_actual_signature: >-
        The genuine F3 case s=D-1 forces D=2^lambda tested slopes. Separately,
        a composition DAG f_(j+1)=f_j composed with f_j has O(j) stored nodes
        while its recursive evaluation satisfies T_(j+1)=2*T_j+O(1), hence
        exponential calls at distinct arguments. No caching of one argument
        solves the general case. By contrast a sequential lambda-step quotient
        chain can evaluate one point in polynomial work; neither degree nor
        storage alone resolves the actual evaluator cost.
      result: expected_signature_obtained
    - id: supplied_connecting_or_response_oracle
      expected_signature: success_uses_extra_input
      independently_derived_actual_signature: >-
        Adding an evaluated f:E->C allows the actual sandwich and f-based
        message decoder, with all map calls charged. Adding only a Y oracle
        supplies a point but leaves the missing full-action-to-map decoder.
        In both cases the added constant/oracle is absent from the declared
        pk/sk/certificate view. Conditional algebra cannot conceal that change.
      result: expected_signature_obtained
    - id: uniqueness_only_lookup
      expected_signature: unique_existing_value_without_executable_polynomial_lookup
      independently_derived_actual_signature: >-
        The independent full honest fiber proof returns F_z={s} and q_k=1.
        The operation choose the unique compatible f or Y has no evaluation
        semantics or complexity by itself. The only supplied total finder F3
        has exponential worst-case search, while F1/F2 and the point-only
        decoder terminate with explicit missing-arrow failures.
      result: expected_signature_obtained

  remaining_facts_required:
    J1:
      - Fixed exact Sigma_pub/Sigma_sk byte fields and actual verifier programs.
      - Polynomial prescribed prime/source Setup and all input/intermediate bounds.
      - Polynomial global least-model normalizer and simultaneous conversion/verifier.
      - Saturation/division/evaluator/certificate completion on sufficient trial mass.
      - Independent proof of q>=lambda^(-2) for the original complete capped law.
      - Negligible accepted mass on every polynomial publicly enumerable endpoint support.
    J2:
      - A typed evaluated target operator or genuine response algorithm using only the declared view.
      - One uniform polynomial work/memory/preprocessing program with negligible uniform failure.
      - For point-only responses, an actual full-action-to-map/kernel reconstruction and residue decoder.
      - All connecting/orientation/ideal/path/oracle dependencies disclosed as inputs or fully constructed and charged.

  procedure_deviations:
    - >-
      The governance-mentioned /usr/local/bin/python3 was absent; one record
      parsing command failed before reading any file. The available native
      Codex Python at /opt/codex/runtimes/codex-primary-runtime/dependencies/
      python/bin/python3 was then used for record parsing. No Ubuntu
      /usr/bin/python3 fallback, scientific run, or implementation occurred.
  validation_method: >-
    Parse only the two allowed scientific inputs with duplicate-key rejection;
    compare their declared input/read/output scope, record their exact bytes
    and hashes, independently perform the symbolic derivations above, then
    parse and validate only this task's three declared artifacts. No repository
    scientific source, plan, history, snapshot, producer report or sibling review
    is opened to perform those checks. Runtime receipt is written last.
