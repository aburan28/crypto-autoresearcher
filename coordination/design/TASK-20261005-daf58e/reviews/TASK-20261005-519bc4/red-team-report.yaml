red_team_report:
  id: TASK-20261005-519bc4
  task_id: TASK-20261005-519bc4
  archive_owner: TASK-20261005-073b4b
  claim_under_review: >-
    The eight-file TASK-20261005-32debd M2 packet at verified snapshot
    91d86f10d0b6c79ec5f68b707011277f34a4eb2b: three typed formulations,
    no selected finalist, conditional source algebra and transport identity,
    F1/F2 unsuccessful target programs, and finite public F3 recovery with
    exponential enumeration. Only J3/J4/J5 are reviewed here.
  evidence_kind: independent symbolic adversarial review and primary-text verification
  scientific_runs: 0
  implementation_performed: false
  custody:
    snapshot_commit: 91d86f10d0b6c79ec5f68b707011277f34a4eb2b
    parent_commit: 7a543a3841a068175d4abdd86357253dcd1ca4f5
    exact_changed_path_count: 9
    producer_blob_count: 8
    working_and_commit_hashes_match_receipt: true
    required_ids_in_snapshot_message: [GOAL-SSI-2fa82a, RQ-SSI-1946c9, BATCH-535a62, TASK-20261005-32debd, TASK-20261005-ed2c6a]
    reachable_from_HEAD: true
    containing_local_remote_ref: refs/remotes/origin/goal/pke-supersingular-endomorphism-ring
    remote_evidence_limit: local remote-tracking reachability, not a new online fetch
    full_details: source-verification.yaml
  joint_assessments:
    J3:
      verdict: holds
      scoped_claim: >-
        The packet correctly identifies the missing calibrated target response
        and does not claim that any inspected formulation supplies a uniform
        polynomial End(E)-only recipient. This is not a positive transport verdict.
      exact_program_outputs:
        - formulation: F1_finite_target_frame
          quoted_output: tagged bottom, optional diagnostic matrices have no plaintext/point-output type
          type: failure tag, not C[N], evaluated map, or plaintext
          first_unavailable_arrow: actual calibration u with phi_s(Q)=T+[u]X
          actual_message_failure: 1
        - formulation: F2_quaternion_word_DAG
          quoted_output: tagged bottom; the formal word is not an arithmetic circuit, map, ideal witness or W
          type: failure tag plus unevaluated syntax
          first_unavailable_arrow: evaluated constants for UnknownMap and UnknownDual
          actual_message_failure: 1
        - formulation: F3_unique_public_map_lookup
          quoted_output: evaluated matching map, slope, Y and optional W on admitted honest observations; no extra supplied connecting witness
          type: domain-labelled f:E->C, t in Z/DZ, Y in C[N], optional W in C[N]
          construction: enumerate t=0,...,D-1, evaluate the cyclic quotient, and compare every compatible target isomorphism
          actual_message_failure: zero mathematical failure on admitted honest observations under exact total arithmetic
          failed_gate: D=2^lambda iterations in the worst case; finite global model enumeration adds unproved normalization cost
      source_order_erasure:
        - stage: parse and validate
          assessment: >-
            Full integral-order/map certificate checks are reachable secret
            calls. Merely substituting rho_N(beta_i) does not implement those checks.
        - stage: eight beta_i(P),beta_i(Q) evaluations on E and finite coordinate extraction
          assessment: >-
            After genuine validation, supplied public four action matrices
            reproduce precisely this finite source stage. No operation is on C.
        - stage: SNF, residue solution, alpha(P)=Q
          assessment: >-
            Matrices reproduce A=sum c_i M_i and the checked finite congruence.
            The evaluated alpha:E->E still requires source map evaluators if
            evaluation away from the checked module is requested.
        - stage: F1 target basis and shear family
          assessment: >-
            Public target sampling, pairings and scalar arithmetic reproduce
            T and all formal shears. They do not select the actual u. Substituting
            source matrices leaves the identical MISSING_TARGET_FRAME result.
        - stage: F2 quaternion diagnostics and sandwich nodes
          assessment: >-
            Finite rho_N alone need not determine rational coordinates or the
            integral table. Even supplying those diagnostics publicly does not
            instantiate either missing connecting evaluator; the result is bottom.
        - stage: F3 response and actual message
          assessment: >-
            Its Y/f/t branch has no order query. Public quotient-chain replay
            returns the same slope/message; optional source sandwich work is
            unnecessary to the actual-message branch.
      typed_identity:
        statement: >-
          alpha:E->E with alpha(P)=Q; dual(phi_s):C->E sends X=phi_s(P)
          to [D]P; phi_s alpha dual(phi_s):C->C therefore sends X to
          W=[D]phi_s(Q). Because gcd(D,N)=1, Y=[D^(-1) mod N]W on C[N].
        limit: the identity specifies a value, not an evaluator for any missing map
      exact_implications:
        - from: evaluated degree-D sender-compatible f:E->C with f(P)=X
          to: Y=f(Q), then W=[D]Y, and m from the evaluated-map decoder
          conditions: correct target normalization, certified degree/kernel and complete map-evaluation costs
        - from: actual W
          to: actual Y
          conditions: public modular inverse of D and C-point scalar multiplication
        - from: actual Y
          to: actual W
          conditions: public multiplication by D; no End(E) query needed
        - from: actual labelled (X,Y)
          to: evaluated sender map or D-kernel, then actual m
          conditions: >-
            Robert Theorem 1.1 on N_A=N=5^b>N_B=D=2^lambda, known
            coprime factorizations, rational full source N-basis and its two
            images, rational D-basis, four-square randomized preprocessing,
            and charged higher-dimensional theta/model/rank/output work.
          scope: >-
            A public polynomial theoretical recovery interface in this admitted
            slice; the packet has not frozen its implementation or complete bit-cost theorem.
        - from: returned actual m
          to: evaluated sender map or full target response
          conditions: no such reverse implication established; m is only s modulo 2^k
      renamed_query_audit:
        supplied_sender_map_dual_or_response: >-
          An extra calibrated evaluated map or W/Y executes the public downstream
          computation; it is not a source-order-only construction.
        realized_ideal_path_or_Hom_anchor: >-
          Sufficient only when it realizes the required degree-D correspondence
          with first image X and target labels, or an explicit algorithm derives
          that correspondence. An arbitrary Hom element or ideal name does not suffice.
        orientation_or_target_ring: >-
          An uncalibrated End(C) basis/orientation does not identify the actual
          phi_s-conjugate operator. No universal equivalence follows from the label.
        retained_tau: >-
          tau connects E_star to E, not automatically E to this ciphertext C.
          It is a forbidden additional retained secret here, but its name alone
          is not proof of polynomial sender-map recovery.
        prescribed_degree_realization: >-
          Maino et al. Theorem 2 under GRH realizes a prescribed degree from E
          to some endpoint; it does not force the prescribed C and X.
      full_action_boundary:
        primary_verified: true
        one_column_is_not_full_action: true
        squared_torsion_extension: Robert Remark 1.2 discusses N_A^2>N_B; here the stronger N_A>N_B already holds
        rank_boundary: >-
          Lemma 6.3 requires the specified kernel rank, both rational bases,
          known action and e dividing N. Example 6.4 does not license applying
          the same decomposition to every dimension-two unknown-codomain problem.
        practical_boundary: fixed dimension is asymptotic polynomial, not a small concrete constant or zero model-conversion cost
      actual_message_path:
        map_decoder: >-
          Set A=f(U), B=f(V), H=[2^(a-k)]B, G=-[2^(a-k)]A.
          The sender kernel gives f(U)=-[s]f(V), ord(B)=D and G=[m]H.
          The binary digit algorithm returns m, charging two complete evaluations,
          verification, O(k^2+a) group work and field/model overhead.
        point_decoder: >-
          Y is not m. It first completes the labelled N-action; the map/kernel
          recovery and the same smooth slope decoder remain required and costed.
        emitted_program_limit: F1/F2 do not emit a successful point; F3 emits a map but pays public exponential lookup
    J4:
      verdict: holds
      scoped_claim: >-
        The packet does not claim recipient-only inversion, secrecy, a public
        lower bound, an EndRing security reduction or a bare-to-augmented bridge.
        Its stated missing arrows and complete-law caveats survive this audit.
      uniqueness_vs_asymmetry: >-
        For same normalized C and equal image of order-N P, distinct degree-D
        maps would give nonzero f-g with deg(f-g)<=4D but kernel containing P,
        hence degree at least N>4D: contradiction. The honest singleton q_k=1
        supplies mathematical uniqueness, not efficient secret inversion or public hardness.
      complete_reachable_Q_A:
        domain: every reachable validated ciphertext and secret validation/evaluation/failure branch, modulo simultaneous basis/model equivalence
        source_quotient: the four rho_N matrices suffice for the finite source congruence after validation
        extra_reachable_answers: secret certificates, source evaluations off the checked module if queried, and every proposed target-response call
        F1_F2: no successful plaintext response; a table containing a future calibrated response would add precisely the missing answers
        F3: actual plaintext computation factors through public pk and observation, not the integral order
        compactness: a finite response table can have exponentially many entries; neither finiteness nor rank four proves compact executable sufficiency
        reverse_relation: recovering a sufficient quotient does not by itself recover a full evaluated integral End(E)
      labels_and_collisions:
        proposed_label_control: equal erased public state with two prescribed depth-two outputs contradicts deterministic composable evaluation
        actual_slope_interface: U,V and slope kernels are publicly evaluated and labelled; no accepted honest collision is exhibited by that hypothetical label mutation
        formal_shear_limit: N consistent target frames are not N honest degree-D maps
      public_effective_support:
        L_1: four-neighbour replay if screening is removed; current unchanged short-ball screen rejects this slice and gives q=0
        logarithmic_length: polynomial word count only when all path/map/normalization/order-realization costs are also controlled
        L_lambda_squared: enormous word count and short-ball exclusion supply no endpoint entropy or lower bound on all public algorithms
        certificate_leakage: exact Sigma_pub and verifier bytes are unresolved; a connecting transcript/calibrated response would be a public shortcut
      first_hypothetical_game:
        game: >-
          Successful Setup and first-accepted capped KeyGen produce the complete
          augmented pk. Separately record Setup/key abort probabilities. The
          adversary chooses m0,m1; choose a fresh uniform challenge bit and
          sender coins, give the corresponding one-column ciphertext, and ask
          for the bit. Advantage is abs(success conditional on key success - 1/2).
        law_boundary: >-
          This is a conditional syntax target. Sigma_pub,Sigma_sk and all
          verifiers have not been frozen, so no unique executable byte-level
          augmented game or complete polynomial finalist has been supplied.
        EndRingEval_relation: >-
          A separately specified source challenge must output full integral
          evaluated maps, coordinates/table and certificates up to declared
          equivalence. An abstract quaternion order is not automatically that output.
        forward_attack: exact-law EndRingEval solver -> represented secret -> hypothetical successful transport -> map/kernel/message -> challenge-bit guess
        forward_loss_bound: >-
          The printed max(0,(rho-epsilon-delta)/2) applies to a verified
          decrypt-or-random-guess attack only if unsuccessful transport/decode
          attempts are detected erasures and undetected wrong-message events
          are excluded or separately charged. It is an attack arrow, not security.
        loss_caveat_control: >-
          If epsilon instead allows undetected opposite-message outputs with
          rho=1 and delta=0, advantage may be 1/2-epsilon, not
          (1-epsilon)/2. The packet explicitly conditions its inequality on
          correct verification/abort behavior; no actual verifier/loss values
          are supplied, so the bound must not be transferred unconditionally.
        reverse_reduction_required: >-
          For this proposed route, construct R^A simulating the exact augmented
          challenge and extracting an evaluated EndRingEval witness with
          success >= f(Adv_A)-epsilon_R, with query/cost/equivalence bounds.
          A different, explicitly proved reduction is also possible; none is supplied.
        separate_assumption: AcceptedKey_OneColumn_IND_CPA may name a distinct unproved intermediate assumption, not plain EndRing hardness
      distribution_bridge:
        source_law: no precise bare EndRing challenge law has been instantiated by this packet
        target_law: accepted complete total-L joint law conditioned on every capped test, including bases, normalization and certificate coins
        necessary_obligations_for_this_route: public challenge conversion, complete auxiliary simulation, joint-law distance, support overlap and evaluated witness pullback
        public_event_bound: TV(T(D_ER),D_PK)>=abs(Pr[T(D_ER) in S]-Pr[D_PK in S])
        missing_values: simulator T, distance bound, overlap mass and pullback loss are all absent
        limit: within-structured-locus rerandomization does not establish cross-law simulation or witness extraction
    J5:
      verdict: holds
      scoped_claim: >-
        Independently checked primary text supports the packet's narrow source,
        version and non-promotion boundaries. There is no demonstrated new
        polynomial PKE or matched-parameter improvement. Exhaustive nonduplication
        and novelty outside the inspected sources remain unverified.
      independently_verified_primary_count: 8
      normalization_record: source-verification.yaml
      source_boundaries:
        - SÉTA gives a finite secret torsion-action and full-image historical control, with distinct TCSSI/oriented assumptions and later attack caveats
        - FESTA supplies a connecting isogeny plus unmasking matrix; circulant masks are already explicitly mentioned
        - Archived POKE Section 4 PKE is distinct from the corrected split-KEM/OPRF sections and from the later revised proceedings version
        - PIKE already supplies masked individual-point and pairing interfaces; its POKE/LIT comparison does not establish a plain-EndRing equivalence
        - SiGamal/C-SiGamal require an explicit commutative public oriented action on points and separate point-CDH/DDH assumptions
        - LIT-SiGamal supplies a horizontal/vertical product-isogeny diagram, structured masks and its own LIT-DDH game
        - Robert requires completed full labelled action, not the supplied one-column observation alone
        - Maino et al. do not convert prescribed-degree realization to prescribed-target recovery without an additional argument
      idea_audit:
        - id: IDEA-20261004-e4c461
          ledger_status_observed: proposed
          contribution_here: label-erasure and compositional API control, not an evaluated target map
          retained_gap: no actual accepted slope-interface conflicting-label example or universal PKE obstruction
        - id: IDEA-20261004-edbd24
          ledger_status_observed: proposed
          contribution_here: audit the complete reachable-call quotient
          retained_gap: no compact executable target quotient and no reverse recovery of full evaluated order
        - id: IDEA-20261004-a09dd4
          ledger_status_observed: proposed
          contribution_here: inspect complete support, auxiliary simulation, distance and pullback
          retained_gap: no compiler or bounded-loss reduction for the complete accepted law
      status_mutations: none
      novelty_status: unverified
  required_controls:
    - object: publicly supplied calibrated target response or sender-compatible Hom/map
      expected_signature: extra primitive; public sandwich/inverse/recovery repeats the same message computation
      actual_signature: calibrated W/Y or f enables the public downstream route under the stated recovery premises; F1/F2 otherwise halt
    - object: full labelled smooth action substituted for one column
      expected_signature: checked public Robert map/kernel recovery; no End(E) secrecy inference
      actual_signature: N=5^b>D=2^lambda meets the basic ratio/factorization slice; complete action and charged model/rank work are still required
    - object: finite matrices and rank-four norm enumeration
      expected_signature: source congruence alone leaves target calibration absent; bit/index/evaluation work remains charged
      actual_signature: alpha's finite source action reproduces, but no actual target evaluator follows; no fixed-rank polynomial norm theorem imported
    - object: singleton identity or public inverse
      expected_signature: correctness may hold while recipient-only inversion fails
      actual_signature: W-to-Y uses only public modular inverse and point arithmetic; singleton honest fiber supplies no asymmetry
    - object: D=2^lambda lookup and recursively doubled composition DAG
      expected_signature: exponential iterations/evaluations despite small output or storage
      actual_signature: F3 needs up to 2^lambda candidate chains; a linear-size doubling DAG may still require 2^lambda calls under recursive evaluation
    - object: erased depth-two conflicting labels
      expected_signature: deterministic API cannot produce both requested outputs from equal public state
      actual_signature: contradiction is immediate for that symbolic mutation; it is not an accepted slope-key counterexample
    - object: complete finite reachable response table
      expected_signature: neither compactness nor full-order reverse recovery follows; fresh target calls need defined answers
      actual_signature: source matrices answer only the validated source prefix; target entries and executable size/reverse relation remain separate obligations
    - object: EndRing-derived EC ElGamal wrapper
      expected_signature: native EC security assumption persists without EndRing witness extraction
      actual_signature: deriving a scalar/key from order data supplies no reduction from an IND adversary to evaluated EndRing; no wrapper used in these formulations
    - object: plaintext-revealing encryption with a solver-to-decrypt arrow
      expected_signature: forward attack arrow exists even though semantic security is false
      actual_signature: a solver can be ignored and plaintext read directly; no converse EndRing extraction follows
    - object: structured-support rerandomization without cross-law conversion
      expected_signature: public support-event distance lower bound or missing witness pullback
      actual_signature: within-locus mixing leaves the displayed TV obligation and all evaluated pullback/auxiliary obligations unresolved
  controls_kind: symbolic only; no experiments and no fabricated accepted-key counterexamples
  objections:
    - severity: retained_obligation
      scope: J3
      finding: no actual polynomial target-response program or complete point-only decoder is supplied
      packet_discloses_it: true
    - severity: retained_obligation
      scope: J4
      finding: exact certificate byte law, undetected-error accounting and all cross-law reverse-reduction machinery must be fixed before security claims
      packet_discloses_it: true
    - severity: verification_limit
      scope: J5
      finding: checked primary sections are not a full-paper proof audit or exhaustive novelty search
  counterexample_or_mutation: >-
    The listed known-false mutations expose the forbidden conclusions, but none
    refutes a claimed successful accepted-key polynomial finalist: there is no
    such finalist in this snapshot. Formal shear multiplicity is not an honest
    degree-D collision. No broader impossibility conclusion is drawn.
  baseline_comparison: >-
    F3 is a finite ring-free 2^lambda-candidate baseline, not a new EndRing
    attack exponent or a proved optimal public algorithm. Smooth slope decoding
    after a real f is inexpensive relative to that lookup. The structured PKE
    sources provide functionality absent here, but different parameters and
    assumptions prevent a numerical time/memory frontier or Pollard-rho/BSGS
    improvement claim.
  heuristic_challenges:
    - A_PRIME_SOURCE, A_ACCEPT, A_SAT_DIV, A_SUPPORT, A_CERT, A_NORM and A_EVAL are retained, not inferred from caps, finite rank or word counts
    - q>=lambda^-2 is unproved; capped termination does not establish successful generation or w/q
  cost_model_challenges:
    - Source evaluation, saturated-order realization, global model selection and all product/theta conversions must be charged
    - Small outputs, rank four and constant syntax-tree size do not imply polynomial evaluated work
  reduction_and_scope_challenges:
    - No blanket equivalence between an arbitrary orientation/Hom anchor/ideal name and the actual sender response
    - No security from excluded full-action input, singleton correctness, generic key derivation or the forward solver-to-decrypt arrow
    - No historical source security endorsement or promotion of proposed IDEA records
  proof_architecture_challenges:
    - Fixed uniform program precedes all accepted keys/messages/coins; instance-dependent unique witnesses are not uniform algorithms
    - Complete honest observation fiber includes all slopes and target isomorphisms; finite shears are a weaker observable only
    - The narrow negative finding closes only these inspected representations, not other transports or EndRing-PKE possibility
  narrowest_supported_statement: >-
    On this frozen conditional interface, F1 and F2 supply no target response,
    and F3 supplies finite public recovery at exponential cost. J3/J4/J5 source,
    control and non-overclaim boundaries hold in this sense only. Uniform
    polynomial transport, actual-message recipient asymmetry, successful
    admission, security, novelty and practicality are not established.
  next_concrete_action: >-
    Return to the existing OBL-CSTAR-TRANSPORT-1 specification obligation: a
    calibrated evaluated W/Y program, represented cost/failure theorem, and
    actual-message path on a frozen complete admission/encoding law. This
    report launches no successor, implementation, formalization or experiment.
