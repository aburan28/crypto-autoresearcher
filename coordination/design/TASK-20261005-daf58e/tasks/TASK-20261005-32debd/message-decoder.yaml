evaluated_map_decoder:
  fixed_program: |
    Parse f,U,V,k,D and all model labels; require degree D, f(P)=X and certified cyclic kernel.
    Evaluate A=f(U) and B=f(V), both points of C.
    Check B has exact order D and all claimed map/point/field certificates; otherwise bottom(INVALID_MAP).
    Set H=[2^(a-k)]B and G=-[2^(a-k)]A in C[2^k].
    Check H has order 2^k; set t0=0 and J=[2^(k-1)]H.
    For j=0,...,k-1:
      Set Z=[2^(k-1-j)](G-[t0]H).
      If Z=0 set d=0; if Z=J set d=1; otherwise return bottom(SLOPE_SHAPE).
      Set t0=t0+d*2^j.
    Check [t0]H=G; return t0 in [0,2^k), otherwise bottom(SLOPE_CHECK).
  types: A,B in C[D]; H,G in C[2^k]; t0 integer residue; all evaluations are E-to-C
  correctness: 'for kernel <U+sV>, f(U)=-[s]f(V), ord(f(V))=D; hence G=[m]H and unique t0=m'
  quantifiers: 'forall successful Setup,accepted keys,m,r,exact returned f with sender kernel and observation labels: Decode_f(f,U,V,k)=m'
  recipient_coins: none after a verified returned map
  bit_time: two complete f-chain evaluations, certificate/kernel validation, O(k^2+a) group scalar/doubling/addition work plus counted field/model overhead
  memory: represented f and field plus O(ell+a+k) point/scalar workspace, and each validation/evaluator intermediate workspace
  output_length: k bits with public tags
  preprocessing: factorizations D=2^a,N=5^b, pairing/order checks, exact labels and model conversion already charged and never omitted
