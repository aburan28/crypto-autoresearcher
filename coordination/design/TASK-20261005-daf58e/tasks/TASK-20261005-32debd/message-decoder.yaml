  condition_slice: smooth known coprime D,N; N>4D>D; rational full N-bases on both curves, rational D-torsion bases, required kernel rank, exact curve/product models and output preprocessing
  source_status: internal source notes report a full-action recovery interface in this slice, not an implementation supplied by this task
