statement_id: TASK-20261005-32debd
parameters:
  lambda: unary integer at least 8
  a: lambda
  k: floor(lambda/2)
  D: '2^a'
  b: 'min {j>=1:5^j>4D}'
  N: '5^b; 4D<N<=20D'
  L: lambda^2 total degree-3 edges
  h: floor(log_3(lambda^2))
  B_h: '2*3^h-1 including the length-zero word'
  M0: '3*2^(a+2)*5^b'
  p: least prime in '[2^lambda,2^(lambda^2))' congruent to -1 modulo M0; undefined if absent
  F: 'F_p[z]/(z^2+1)'
  E_star: 'y^2=x^3+x'
  supplied_source: four evaluated integral E_star-to-E_star maps, rational coordinates, multiplication table and certificates; at most lambda^4 bits
encodings:
  integer: signed length-delimited binary; lambda unary
  field: two canonical padded residues in [0,p)
  curve: nonsingular short Weierstrass coefficients and field labels
  point: infinity tag or coordinate pair and curve label
  order: four integral evaluated maps, rational quaternion coordinates, integral multiplication table, exact algebraic/map certificates
  map: domain-labelled arithmetic circuit or composition DAG with all coefficient/node bits and evaluation semantics counted
  equality: exact represented field and expanded polynomial map identities, charged under work cap
  normalization: least coefficient pair among all F-isomorphic short Weierstrass models; then least simultaneous retained-point tuple under residual automorphisms
  isomorphism: all F-isomorphisms between fixed models via u equations, with chosen roots and coordinate/map conversions charged
  basis_labels: sampled public U,V,P,Q, with every relabeling also transporting slope and message coordinates
  order_equivalence: integral GL_4(Z) basis change and simultaneous model conjugation
  public_certificate_fields: field/model/scalar-Frobenius/order/pairing/normalization encodings and certificates
  secret_certificate_fields: integral order, evaluated maps, multiplication table, rational coordinates and discriminant certificates
  certificate_serializer_parameters: Sigma_pub,Sigma_sk include exact byte schemas and public/secret verifier programs; their field-by-field definitions are outstanding parameters
Setup:
  steps:
    - Search the specified finite interval in increasing order, with congruence and primality verification.
    - Verify the field, source, supplied integral order, multiplication/map identities and trace discriminant p^2.
    - Publish source ring, field, parameters, smooth factorizations and arithmetic conventions; otherwise bottom.
  source_Frobenius: '[-p] over F, with 3DN dividing p+1'
  cost_quantity: all prime-search, field construction, source verification, input and intermediate bits
KeyGen:
  single_trial:
    - Start at E_star and choose uniformly one of four cyclic order-3 subgroup schemes, in encoding order modulo generator sign.
    - Perform exactly L-1 more edges; exclude the preceding map's dual subgroup and choose each remaining subgroup with probability 1/3.
    - Normalize after subgroup choice, adding isomorphic endpoint multiplicities without inverse-automorphism weights.
    - 'Retain domain-labelled tau of degree 3^L; form R=Z*1+tau End(E_star) dual(tau) in transported rational coordinates.'
    - Enumerate subgroups of trace-dual quotient Rsharp/R in lexicographic HNF order; keep integral multiplicatively closed overorders of trace discriminant p^2.
    - Realize maps by denominator-kernel checks and rational division using increasing-encoding-length coefficient search and exact division identities.
    - Retain the first certified evaluable full order before the cap, otherwise reject.
    - Sample rational points, project by (p+1)/D or (p+1)/N, and retain exact rank-two bases U,V and P,Q with primitive pairings.
    - Normalize and transport all retained points and ring maps simultaneously.
    - Apply every rejection test.
    - Erase tau,kernels,walk transcript,connecting ideals,orientations and temporary witnesses.
  coin_ranges: exact uniform fair-bit finite-range rejection; every random-bit read charged
  point_slots: 'uniform {infinity} union (F x {0,1}); reject nonexistent roots and duplicate zero-root slot; use lexicographically ordered roots'
  word_count: '4*3^(L-1) before identifications'
  caps: lambda^12 bit operations/random bits and lambda^12 total pk/sk/certificate bits/nodes per trial
  rejection_tests:
    - any cap exceeded
    - failed field/model/scalar-Frobenius/order/pairing/integral-order/map/table/discriminant/normalization certificate
    - normalized E lies in the public degree-3 nonbacktracking enumeration from E_star of lengths zero through h, modulo F-isomorphisms
  repeats: lambda^3 independent identical capped trials; output first accepted tuple, otherwise bottom
  q: Pr[single trial accepted | successful Setup], including every cap and certificate/basis/normalization coin
  accepted_law: complete single-trial joint law conditioned on acceptance, for fixed Sigma_pub,Sigma_sk; normalized E is its marginal
  pk: '(E,U,V,P,Q,p,F,D,N,k,encodings,public certificates)'
  sk: exactly E's four integral evaluable endomorphisms, table, rational coordinates and certificates
  key_failure: '(1-q)^(lambda^3), conditioned on successful Setup'
  capped_cost: 'O(lambda^15) bit-time, O(lambda^12) memory/output plus Setup inputs'
  successful_expected_cost: 'w/q, w the complete single-trial expected cost'
  conditional_requirement: 'q>=lambda^-2 for sufficiently large defined lambda; then key_failure<=exp(-lambda)'
  separate_failure_quantities: Setup failure, key failure, transport failure, decoder failure
admission_requirements:
  prime_source: prescribed progression/interval/source input and certificate success in polynomial bit-time
  saturation_division: full order and realized basis evaluations/identities within stated caps on required accepted mass
  certificate_schema: fixed Sigma_pub,Sigma_sk with exact byte fields and polynomial verifiers, without additional connecting or target-response data
  global_normalization: uniform polynomial globally least-model selection and simultaneous conversion
  map_evaluation: polynomial exact evaluated work and intermediate bits for every represented map/DAG/certificate
  effective_support: every polynomial publicly enumerable normalized endpoint support has negligible accepted mass
  bounded_circuit_variant:
    used: false
    additional_rejection: source circuits fail declared bounded-evaluation verifier
    law: original complete trial law conditioned on original acceptance and the additional predicate
    output_change: circuit bound certificate and interpreter/gate metadata
    required_quantities: new q, certificate verification cost, intermediate bounds and accepted-support mass
types:
  O: full integral End(E), basis beta_1,...,beta_4 of evaluated E-to-E maps with table/coordinates/certificates
  E_C: represented certified supersingular F-curves
  P_Q: ordered rational rank-two N-basis on E
  X: order-N point on C
  U_V: ordered rational rank-two D-basis on E
  alpha: integral E-to-E endomorphism
  W_Y: points of C[N]
  f: evaluated degree-D E-to-C map with labelled models
  bottom: tagged failure, not a point or map
observation:
  m: 'integer in [0,2^k)'
  r: 'integer in [0,2^(a-k)), uniformly sampled'
  s: 'm+2^k*r modulo D'
  kernel: '<U+sV>'
  sender_map: 'phi_s:E->E/<U+sV>, separable degree D, a degree-2 chain'
  Encrypt:
    - Validate public key,message and randomness encodings; otherwise bottom.
    - Form the cyclic slope kernel and its evaluated degree-2 chain.
    - Normalize target curve and retained first image simultaneously.
    - Return (C_s,X=phi_s(P)) with normalized labels.
  F_z: '{t in Z/DZ: exists F-isomorphism i:C_t->C with i(phi_t(P))=X}'
  q_k_z: 'cardinality {t mod 2^k:t in F_z}'
  claimed_fiber_quantity: 'forall successful Setup,accepted keys,m,r: F_(C_s,phi_s(P))={s}, q_k=1'
  claimed_fiber_failure: 0 on admitted honest observations
algorithm_prefix:
  steps:
    - Validate O,E,C,X,P,Q,U,V and certificates; otherwise bottom(INVALID).
    - Evaluate all four beta_i at P,Q on E.
    - Extract coordinates by pairings against P,Q and smooth 5-power digits; obtain M_i in M_2(Z/NZ).
    - Solve 'sum_i c_i M_i (1,0)^t=(0,1)^t' by modular SNF, choosing lexicographically least solution c in [0,N)^4.
    - Set alpha=sum_i [c_i]beta_i, evaluated by four map calls and scalar sums on E.
    - Check alpha(P)=Q; otherwise bottom(SOURCE_ACTION).
  cap: lambda^12 work/random bits, otherwise bottom(PREFIX_CAP)
partial_and_finite_programs:
  F1:
    - Run algorithm_prefix.
    - Sample projected target T0 until e_N(X,T0) is primitive, under the same cap.
    - Extract a0 with e_N(X,T0)=e_N(P,Q)^a0; set T=[D*a0^(-1)]T0.
    - Check e_N(X,T)=e_N(P,Q)^D; store B(u)=[[1,u],[0,1]] and M(u)=D B(u) A B(u)^(-1) as formal families.
    - Return bottom(MISSING_TARGET_FRAME).
  F2:
    - Run algorithm_prefix; compute alpha's rational coordinates and norm/trace with the supplied table.
    - Construct formal syntax Sandwich(UnknownMap(E,C,D,P,X),alpha,UnknownDual(C,E,D)).
    - Typecheck against available evaluated constants and return bottom(MISSING_TARGET_EVALUATOR).
  F3:
    - Validate public key/ciphertext inputs; the Y/f/t branch does not query O.
    - If W is requested run algorithm_prefix and propagate every bottom, including its cap failure.
    - Enumerate t=0,...,D-1; construct each degree-2 cyclic quotient chain and its P,Q images.
    - Normalize, enumerate fixed-model F-isomorphisms and test the observed (C,X).
    - For a match certify degree/kernel/labels and return evaluated f,Y=f(Q),t.
    - If requested, also evaluate dual(f)(X), alpha there, and f on the result to return W.
    - Return bottom(NO_MATCH) if enumeration ends without a match.
  finite_normalization: least-model selection can be defined by exhaustive u in F^*; fixed-model isomorphism equations use every permitted root
returned_object_decoder:
  F1_F2: propagate bottom(TRANSPORT_FAILED)
  F3:
    - Evaluate A=f(U),B=f(V) on C and verify exact order D for B.
    - 'Set H=[2^(a-k)]B, G=-[2^(a-k)]A, t0=0 and J=[2^(k-1)]H; verify H has order 2^k.'
    - 'For j=0,...,k-1 compute Z=[2^(k-1-j)](G-[t0]H); use d=0 if Z=0,d=1 if Z=J,otherwise bottom.'
    - Update t0=t0+d*2^j; verify [t0]H=G and return t0, otherwise bottom.
  point_only_operation_requirement: '(E,C,P,Q,X,Y,D,N,U,V) -> evaluated f or evaluated D-kernel -> residue'
  point_only_premises: smooth known coprime factorizations, full labelled rational N-bases, rational D-torsion, certified kernel ranks, exact models/embedding/output preprocessing
  point_only_current_program: return bottom(MISSING_FULL_ACTION_DECODER)
correctness_and_cost_quantities:
  desired_quantifiers: one uniform polynomial program fixed first; every successful Setup,accepted key,m,r; uniform recipient-coin failure epsilon_T(lambda)
  desired_event: 'W=phi_s alpha dual(phi_s)(X) or Y=phi_s(Q); then Dec=m'
  F1_F2: actual point/message-output failure 1; partial work capped by lambda^12 plus input storage
  F3: mathematical Y/map/message-output failure 0 on admitted honest inputs with exact total public arithmetic; optional W inherits source-prefix/certificate/cap failure with no uniform negligible bound; D public quotient iterations worst case
  source_cost: certificate checks,twelve source evaluations,pairings,smooth finite algebra,SNF,intermediate bits
  F1_cost: source cost plus target sampling,projection,pairing,digits,scalar work and formal-family storage
  F2_cost: source cost plus fixed-rank coordinate/table/norm/trace and formal-word storage
  F3_cost: sum of D quotient/normalization/conversion/check costs; optional dual/source/forward sandwich evaluations
  decoder_cost: two actual f evaluations, validation and O(k^2+a) group operations with charged field/model work
  output_lengths: F1/F2 tagged bottom; F3 one evaluated a-step chain,point(s),slope and k-bit message
  memory: input plus actual evaluator/validation workspaces; F3 streams one candidate, never equating storage and evaluated work
  preprocessing: prime/source,field,factorizations,roots/extensions,pairings,normalization,representation conversions and certificates counted
