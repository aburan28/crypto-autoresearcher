status: exact_conditional_definition_with_retained_admission_gaps
parameters:
  lambda: unary integer at least 8
  a: lambda
  k: floor(lambda/2)
  D: '2^lambda'
  b: 'min {j>=1: 5^j>4D}'
  N: '5^b; 4D<N<=20D'
  L: 'lambda^2 total edges'
  M0: '3*2^(a+2)*5^b'
  p: 'least prime in [2^lambda,2^(lambda^2)) with p=-1 modulo M0; bottom if absent'
  F: 'F_p[z]/(z^2+1), degree two'
  E_star: 'y^2=x^3+x'
  rationality: 'p=-1 mod M0; scalar F_p^2 Frobenius [-p]; 3DN divides p+1'
Setup:
  supplied_input: certified evaluable full integral End(E_star), four maps, coordinates and table
  source_input_bound: at most lambda^4 encoded bits including evaluation descriptions and certificates
  steps:
    - Search the prescribed finite ordered interval and congruence for the first prime; certify primality.
    - Verify represented field, nonsingular source, integral order, multiplication and evaluated-map identities and trace discriminant p^2.
    - Publish source ring, field, smooth factorizations, parameters and arithmetic conventions; bottom on any failure.
  secret_setup: none
  cost: all input bits, primality search, field construction and map/order certification charged separately
  polynomial_success_bound: unproved
encodings:
  integer: signed length-delimited binary, with lambda additionally unary
  field: two padded canonical residues in [0,p), O(lambda^2) bits per residue
  curve: two short Weierstrass coefficients with field/domain tags and nonsingularity check
  point: infinity tag or canonical coordinate pair with curve membership and exact order checks
  integral_order: four domain-labelled E-to-E maps, rational quaternion coordinates, integral multiplication table and certificates
  map: arithmetic circuit or composition DAG with domain, codomain and evaluation semantics; all bits/nodes and intermediate evaluations count
  basis_equivalence: simultaneous GL_4(Z) order basis change and curve-model conjugation
  model_normalization: least coefficient pair among F-isomorphic short Weierstrass models; then least simultaneous retained-point tuple over residual automorphisms
  target_normalization: same curve rule followed by least retained X tuple; all compatible F-isomorphisms included
  isomorphism_conversion: exact u equations of constant degree between fixed models, with root ordering/coins and coordinate transport charged
  global_selection: selecting the globally least model is an additional operation, not implied by fixed-model isomorphism testing
  public_basis_labels: sampled U,V,P,Q; no global least-basis search; source relabeling transports the slope/message definition
  public_certificate_boundary:
    declared: field/model/scalar-Frobenius, exact torsion orders and primitive pairings, encoding/normalization certificates
    not_resolved: exact public bytes and public verification procedures for all acceptance certificates were not frozen field by field
    rule: no ring maps, connecting data, target response or orientation may be smuggled into public certificates
    secret_only: integral order basis/table/coordinates and its evaluation certificates are sk, not an extra trapdoor
    schema_parameters: exact Sigma_pub,Sigma_sk byte serializers and verifier programs remain unspecified in the inherited definition
walk:
  length_convention: one first step followed by exactly L-1 continuation steps
  prior_ambiguity: prior bare statement's first-step plus continue-L wording also permits L+1; not historically resolved
  selected_reason: matches prior keygen walk's word_count and tau_degree; explicit convention for this packet
  first: four cyclic order-3 subgroup schemes, probability 1/4 each
  continuation: exclude precisely preceding map's dual subgroup; each other subgroup has probability 1/3
  ordering: subgroup encodings sorted by coordinates modulo generator sign
  coins: exact uniform finite-range fair-bit rejection; random bits charged under trial cap
  state: current normalized curve and preceding normalized map during trial only
  normalization_weight: choose subgroup first, normalize afterward; sum endpoint multiplicities without inverse-automorphism weighting
  longer_cycles: allowed
  word_count: '4*3^(L-1) before identifications'
  tau_degree: '3^L'
  alternate_L_plus_1_law: '4*3^L words, degree 3^(L+1), different complete trial law and q; not used'
  mixing_or_entropy_claim: none
single_trial:
  work_cap: lambda^12 bit operations and random-bit reads including verification and temporary representations
  output_cap: lambda^12 total encoded bits/nodes of pk,sk,certificates
  steps:
    - Sample the total-L walk and retain domain-labelled tau and its dual as DAGs only during this trial.
    - 'Form R=Z*1+tau End(E_star) dual(tau) in transported rational coordinates.'
    - Enumerate subgroups of trace-dual quotient Rsharp/R in lexicographic HNF order.
    - Retain integral multiplicatively closed overorders of trace discriminant p^2.
    - Realize basis maps by denominator-kernel tests and rational division.
    - 'Rational division searches coefficient tuples in increasing encoding length; test [n] composed with f equals numerator using exact identities.'
    - Retain first fully certified evaluable maximal order, otherwise reject on cap.
    - Sample rational points and project by (p+1)/D or (p+1)/N to select U,V and P,Q; check orders and primitive pairings.
    - Normalize model and simultaneously transport all four points and all ring maps.
    - Apply every bad-key test; accept only if all pass.
    - Erase tau, kernels, walk transcript, connecting ideals, orientations and temporary witnesses.
  point_sampler: 'uniform slots in {infinity} union (F x {0,1}); reject nonroot slots and duplicate zero-root slot, use lexicographically ordered roots'
  bad_key_tests:
    - work/random-bit/output cap exceeded
    - any field/model, scalar-Frobenius, order/pairing, integral-order, map/table/discriminant or stated normalization certificate fails
    - 'normalized E is reached from E_star by a degree-3 nonbacktracking word of length <=h=floor(log_3(lambda^2)), modulo F-isomorphisms'
  short_screen:
    h: 'floor(log_3(lambda^2))'
    B_h: '1+sum_(j=1)^h 4*3^(j-1)=2*3^h-1<=2lambda^2-1'
    meaning: labelled words including length zero; model identifications can only reduce distinct endpoints
    cost: charge paths, isomorphism checks, normalization and all validations under cap
    oracle: public short-word enumeration and ephemeral exact certificates, no EndRing/hardness oracle
accepted_law:
  trials: lambda^3 independent identically distributed capped trials
  output: first accepted complete trial tuple, bottom if none accepts
  q: Pr[all single-trial tests pass | successful Setup] for this total-L law
  distribution: complete single-trial joint law conditioned on acceptance, including walk, ring representation, bases, normalization and certificate coins
  byte_law_boundary: this conditional law is fixed for fixed serializers/verifiers; no unique complete byte-level augmented law is asserted before Sigma_pub,Sigma_sk are frozen
  curve_marginal: projection of that joint law to normalized E, not uniform endpoints
  pk: '(E,U,V,P,Q,p,F,D,N,k,encodings,public certificates)'
  sk: 'full integral End(E), four evaluable E-to-E maps, coordinates, table, secret certificates only'
  key_failure: '(1-q)^(lambda^3), conditional on successful Setup'
  conditional_target: 'q>=lambda^-2 implies key_failure<=exp(-lambda); q lower bound unproved'
  capped_termination: O(lambda^15) bit work and O(lambda^12) memory/output plus Setup input
  successful_uncapped_work: w/q, w the expected cost of one complete trial; does not follow from capped termination
  failures: Setup failure, key failure, transport failure and decoder failure are separate
admission_gaps:
  - id: A_PRIME_SOURCE
    quantified_statement: all sufficiently large defined lambda admit prescribed prime/source within uniform polynomial input and verification work
    falsifier: absent qualifying prime or a superpolynomial search/certification subsequence
    validation_route: prove exact progression/interval existence and source representation/verification theorem; no trials here
    consequence: no successful polynomial Setup claim
    retained: true
  - id: A_ACCEPT
    quantified_statement: 'for all sufficiently large defined lambda, complete capped-law q>=lambda^-2'
    falsifier: a subsequence with q below lambda^-2, including q=0
    validation_route: bound every rejection mass and all cost/output caps under the same coins
    consequence: no successful uniform polynomial KeyGen with exp(-lambda) failure claim
    retained: true
  - id: A_SAT_DIV
    quantified_statement: transported full-order saturation, denominator division and realized basis certificates fit caps on required accepted mass
    falsifier: superpolynomial index enumeration, realized map size, coefficient identities, extension or division work
    validation_route: explicit algorithms and bit-length/evaluation bounds for every stage
    consequence: full-order realization and acceptance remain conditional
    retained: true
  - id: A_SUPPORT
    quantified_statement: every uniformly polynomial publicly enumerable normalized endpoint support has negligible mass under this accepted law
    falsifier: such a support with nonnegligible accepted mass
    validation_route: analytic conditional support/concentration bound including all automorphism/certificate weights
    consequence: excludes no general public algorithm and proves no secrecy
    retained: true
  - id: A_CERT
    quantified_statement: exact public/secret certificate serialization and verification uses no hidden connection and polynomial work
    falsifier: leaked connection/response or unavailable/superpolynomial verifier
    validation_route: field-by-field serialization and executable verifier definitions before implementation
    consequence: augmented public distribution and its leakage remain unresolved
    retained: true
  - id: A_NORM
    quantified_statement: every normalization and simultaneous model conversion required by this law has polynomial bit-time
    falsifier: superpolynomial global least-model selection or uncounted transport search
    validation_route: global-selection algorithm, not merely constant-degree isomorphism equations
    consequence: encryption/keygen/transport normalization bounds conditional
    retained: true
  - id: A_EVAL
    quantified_statement: every admitted source DAG/circuit, division representation and certificate admits polynomial exact evaluation with charged intermediates
    falsifier: polynomial storage with superpolynomial evaluated/expanded work or intermediate bits
    validation_route: typed evaluator and per-node bit/field cost theorem
    consequence: even source-prefix cost remains parametrized by actual evaluation work
    retained: true
conditional_serialization_variant:
  used: false
  definition: prospectively add a source-map circuit typing/evaluation-bound verifier as an extra trial rejection test
  exact_law_change: 'q_prime=Pr[Accept and CircuitBound]; complete original trial law conditioned on both predicates; pk/sk carry the new evaluator certificate'
  outputs_change: circuit-bound certificate, declared gates and interpreter version added to representation metadata
  obligations: certify bounded intermediate bits/work without target response, account verifier cost/cap, prove q_prime bound and conditional support afresh
  consequence: cannot discharge original admission; cannot turn source circuits into target operators
public_path_ring_controls:
  L_1: four neighbours if screen removed; unchanged current screen rejects every such endpoint and gives q=0 in that control slice
  log_length: '4*3^(ell-1)=lambda^O(1) for ell=O(log lambda); replay is an effective public path support when arithmetic costs fit'
  length_L: enormous word count provides neither endpoint entropy nor exclusion of efficient recovery
  effective_endpoint_support: enumeration of models alone is insufficient; recovering/transporting a source ring still requires paths, saturation, realized maps and evaluations
  certificate_leakage: evaluate support conditioned on exact public bytes; connection certificates may supply a shortcut
  current_result: all target-law support and recovery assumptions retained; no public lower bound
