common_uniform_prefix:
  program: |
    Parse labels and verify declared public and secret certificates; otherwise return bottom(INVALID).
    For i=1,...,4 evaluate beta_i(P), beta_i(Q) as points of E, never points of C.
    Extract coordinates of these eight images in (P,Q) by smooth 5-power finite algebra.
    Form matrices M_i in M_2(Z/NZ).
    Solve sum_i c_i M_i (1,0)^t=(0,1)^t by integer Smith normal form modulo N.
    Choose the lexicographically least residue solution c in [0,N)^4 using the affine solution module.
    Define alpha=sum_i [c_i] beta_i, with an E-to-E evaluation procedure summing four images.
    Check alpha(P)=Q; otherwise return bottom(SOURCE_ACTION).
    Return (c,alpha,A=sum_i c_i M_i).
  primitive_operations: exact finite field arithmetic, point addition/scalar multiplication, source map evaluation, Weil pairing, smooth-power digit extraction and fixed-size integer SNF
  source_coordinates: 'e(R,Q)=e(P,Q)^x and e(P,R)=e(P,Q)^y; extract x,y modulo 5^b by power-5 digits'
  no_solution: explicitly tested; conditional full maximal-order action gives solvability when N is coprime to p
  prefix_cap: lambda^12 bit operations/random bits including actual source evaluations; cap returns bottom(PREFIX_CAP)
  correctness_boundary: full integral evaluated source order on a genuine rank-two prime-to-p module, not a merely abstract order table
F1_finite_target_frame:
  class: representation
  fixed_program: |
    Run the common prefix; propagate every bottom.
    Sample rational target points using the specified public slot sampler and projection [(p+1)/N].
    Retain T0 when e_N(X,T0) is primitive of order N; charge work under the same prefix cap.
    Extract a0 from e_N(X,T0)=e_N(P,Q)^a0 by smooth 5-power digits.
    Set T=[D*a0^(-1) mod N]T0 on C; check e_N(X,T)=e_N(P,Q)^D.
    Store the family B(u)=[[1,u],[0,1]], u in Z/NZ, as a symbolic family over (X,T).
    Store the formula M(u)=D*B(u)*A*B(u)^(-1), without evaluating a target map.
    Return bottom(MISSING_TARGET_FRAME).
  actual_output: tagged bottom, optional diagnostic matrices have no plaintext/point-output type
  missing_arrow: '(O,E,C,X,P,Q,D,N,T) -> u with phi_s(Q)=T+uX'
  corresponding_forbidden_datum: calibrated torsion-module identification induced by the sender map; source-target correspondence or missing Y
  hypothetical_continuation: if the actual u is independently supplied, compute W=[D*u]X+[D]T and Y=[D inverse mod N]W
  hypothesis_status: not an adopted primitive or assumed successful transport
  formal_frame_equations: all u satisfy basis/pairing requirements; honest degree-D compatibility imposes more than those finite equations
  failure: transport failure probability 1 for the actual program on all admitted honest inputs
  operations_labelled: target scalar/point operations use C; source matrices only use E; B(u) is formal until u calibrated
F2_quaternion_word_DAG:
  class: representation
  fixed_program: |
    Run the common prefix; propagate every bottom.
    Compute alpha's rational quaternion coordinates, reduced trace/norm and the four integral coefficients using O's supplied table.
    Form a syntax tree Sandwich(UnknownMap(E,C,D,P,X),alpha,UnknownDual(C,E,D)).
    Typecheck the syntax tree against available evaluated map constants.
    UnknownMap and UnknownDual have no evaluated constants in the input environment.
    Return bottom(MISSING_TARGET_EVALUATOR), retaining only a diagnostic formal tree.
  actual_output: tagged bottom; the formal word is not an arithmetic circuit, map, ideal witness or W
  missing_arrow: '(source algebra coordinates,C,X) -> evaluated calibrated C-to-C sandwich operator'
  distinction: abstract B_p algebra coordinates do not supply an embedding/calibration in End^0(C)
  corresponding_forbidden_datum: evaluated connecting map/dual, realized ideal, retained tau, orientation or target-ring correspondence
  hypothetical_degree: 'deg(gamma)=D^2*deg(alpha), when the actual maps exist'
  storage_vs_evaluation: constant-size symbolic sandwich nodes do not define their unknown evaluator or bound its work
  variant: bounded source-circuit serialization in admission-encodings.yaml is prospective only and does not fill these missing map nodes
  failure: transport failure probability 1 for the actual program on all admitted honest inputs
F3_unique_public_map_lookup:
  class: representation
  fixed_program: |
    Validate public key and ciphertext inputs; do not query O for the Y/f/t branch.
    If optional W is requested, run the source prefix and propagate its bottom, including PREFIX_CAP.
    For t=0,...,D-1 in increasing order:
      Form K_t=<U+tV> on E.
      Construct its cyclic quotient chain with exactly a degree-2 steps and evaluate the chain at P,Q.
      Normalize the target curve and first image by the declared least-model/retained-X rule.
      Determine all F-isomorphisms to C by the constant-degree u equations; retain the one giving first image X.
      If such a transport exists, label the transported chain f:E->C and check degree/kernel/first image.
      Let Y=f(Q) on C.
      If W is requested, evaluate dual(f)(X) on E, alpha at that E point, and f at its result on C.
      Return (Y,f,t,W if requested), preserving all domain labels.
    Return bottom(NO_MATCH).
  actual_output: evaluated matching map, slope, Y and optional W on admitted honest observations; no extra supplied connecting witness
  normalization_fallback: exhaustive u in F^* to select the least isomorphic coefficient pair makes normalization finite; no polynomial bound
  exact_failed_gate: exponential public enumeration reconstructs the sender connection; it is not the required uniform polynomial End(E)-only transport
  not_an_M1_or_P2_search: enumerates public cyclic slope encryptions only; no Hom-basis or endpoint-ideal algorithm launched
  failure: zero mathematical matching failure for Y/f/t on admitted honest inputs under exact total public arithmetic; optional W additionally inherits unbounded prefix/certificate/cap failure; malformed inputs return bottom
  runtime_cap: no polynomial cap claimed; the specified finite program is not run
  uniformity: a single fixed program for every lambda, no key-dependent advice, source ring unnecessary for Y/f/t
