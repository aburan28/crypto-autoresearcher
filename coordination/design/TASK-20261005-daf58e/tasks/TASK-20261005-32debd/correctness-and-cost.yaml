cost_model:
  B: total encoded public/secret input bits, including map representations and certificates
  ell: ceil(log_2(p)) less than lambda^2
  n: ceil(log_2(N)), O(lambda)
  field_operation: bit-time F(ell), memory G(ell), with exact degree-two arithmetic and charged roots/extensions
  group_operation: bounded field operations on correctly labelled curves
  J: actual certificate/validation bit-time and memory; no unproved verifier cost replaced by zero
  S_i_R: actual bit-time of evaluating source beta_i at point R, including every DAG/circuit node and intermediate expansion
  P_src: polynomial finite algebra overhead in B,ell,n plus pairing and smooth-digit extraction costs
  T_src: 'J+sum_i(S_i_P+S_i_Q+S_i_P)+P_src; third term is explicit alpha(P) check'
  M_src: input plus maximum evaluator workspace plus finite arithmetic workspace; every evaluator workspace charged
  prefix_cap: lambda^12 work/random bits; every exceeded budget is bottom rather than success
  E_D: actual cyclic quotient-chain construction/evaluation cost for a degree-2 steps
  H_norm: actual global least-model and simultaneous point normalization cost
  H_conv: fixed-model isomorphism/root/point/map conversion cost
  H_dual: reverse degree-2 dual-chain construction/evaluation cost with normalization transports
  p_preprocessing: field construction, primality/source certificates, factorizations, pairing setup, roots, extension degrees and model conversions charged
  map_storage: DAG node count and all coefficients/domain labels; not a bound on evaluation work
conditional_source_alpha:
  statement: 'for a genuine full integral maximal End(E), p coprime to N, its action modulo N covers M_2(Z/NZ); thus an integral alpha(P)=Q exists'
  provenance: internal
  support: prior declared composition reports independently derived full-order unramified torsion action; current algorithm checks the congruence and alpha(P)
  scope: true evaluated order and exact rank-two rational basis, not arbitrary abstract multiplication data
  implementation_boundary: no explicit library evaluator is supplied here; A_EVAL and A_CERT remain
  matrix_work: eight source point evaluations, sixteen coordinate pairings, smooth 5-power digit extraction, fixed-size SNF and four source evaluations for alpha(P)
  finite_algebra_bit_bound: polynomial in encoded inputs and n when field and supplied source evaluations have corresponding bounds
  alpha_encoding: four O(n)-bit integer coefficients plus source-map references; evaluation is four source evaluations plus scalar sums
conditional_identity:
  equation: 'gamma(X)=phi_s alpha dual(phi_s)(phi_s(P))=phi_s alpha([D]P)=[D]phi_s(Q)'
  premises: actual degree-D map and its dual, alpha(P)=Q, X=phi_s(P), correctly transported model labels
  conversion: 'Y=[D^(-1) mod N]gamma(X), since gcd(D,N)=1'
  gate: this identity does not construct/evaluate its phi_s or target gamma nodes
P1_complete_fiber:
  maps: 'phi_t:E->C_t quotient by <U+tV>, degree D, t in Z/DZ; all F-target transports included'
  F_z: '{t in Z/DZ: exists i:C_t->C F-isomorphism with i(phi_t(P))=X}'
  q_k_z: 'cardinality {t mod 2^k:t in F_z}'
  bound: N>4D, ord(P)=N, gcd(N,pD)=1
  derivation:
    - Compatible f,g into the same C satisfy (f-g)(P)=0.
    - 'If f-g is nonzero then <P> is in its kernel, N divides deg(f-g), and deg(f-g)>=N.'
    - 'Positive degree norm gives deg(f-g)<=2deg(f)+2deg(g)=4D.'
    - N>4D implies f=g; equality of <U+sV> and <U+tV> forces s=t modulo D.
    - 'If two target transports fix X, their quotient automorphism u has (u-1)(X)=0 and deg(u-1)<=4<N; hence u=1.'
  conclusion: 'forall successful Setup,accepted pk,m,r: F_(C_s,phi_s(P))={s}, q_k=1 and phi_s(Q) is unambiguous'
  fiber_failure: 0 on admitted honest inputs
  uniqueness_only: no construction, admission, evaluation complexity, decoding complexity or secrecy consequence
  excluded_weaker_bound: N^2>4D alone is not used
