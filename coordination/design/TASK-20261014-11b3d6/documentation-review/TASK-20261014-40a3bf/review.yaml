    location: PDF page 1 Figure 1; flow.svg text nodes for O1, normalized integrality and next batch.
    observation: Several long diagram labels reach or slightly cross the node borders.
    implication: Labels remain readable and complete; this is minor crowding, not a claim-language or content loss.
