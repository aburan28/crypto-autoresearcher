      arrow labels while retaining dashed arrows.
    implication: >-
      The rendered visual is a semantic summary rather than a literal Mermaid
      rendering. The omitted formulas/gates appear in the surrounding report
      and PDF text; no gate is promoted or mathematical formula contradicted.
  - id: D2
