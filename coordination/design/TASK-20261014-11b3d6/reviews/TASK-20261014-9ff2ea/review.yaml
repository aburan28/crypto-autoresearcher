exact_scope:
  owned: O3 circulation/fibers/actual-message correctness and O4 recipient asymmetry/full-ring necessity only.
  parameters: >-
    Valid pp=(p,ell,L,E0,W0,canonical_curve_encoding,ordered_actual_edges),
    p>3 prime, ell!=p prime, L>=1, E0/F_(p^2) supersingular with scalar
    p^2-Frobenius, rational selected ell-kernel lines, and public complete
    evaluable saturated rank-four W0. No concrete tuple was selected.
  graph: >-
    Canonical F_(p^2)-isomorphism classes, retaining actual subgroup/isogeny
    edge multiplicity. Equal canonical endpoints need not have equal paths,
    kernels or edge encodings; j-invariant equality alone is not this test.
  actual_supported_law: >-
    WalkSample starts at E0. There are N=(ell+1)*ell^(L-1) equally likely
    length-L coin strings: ell+1 first edges, then ell outgoing edges excluding
    the preceding dual after canonical transport. Endpoint probability is
    fiber cardinality/N. Encrypt is null; its intended walks from recipient E
    do not constitute an instantiated encryption sampler in this packet.
  excluded: >-
    J1 algebra, saturation and algorithm/cost adjudication; J3 reductions,
    adversarial-view/security, active notions, novelty, QPT/QROM and Category 5.
    No whole-scheme vote, repair, implementation, experiment or parameter choice.
  evidence_boundary: >-
    No concrete supported collision, sum or failure rate was computed.
    Conditional controls state their additional hypotheses. Missing objects
    remain dependencies, not fabricated oracles or universal impossibility.
findings:
  - id: J2-F1
    finding: >-
      public-statement.yaml has null EdgeLabel, RingPotential, Encrypt and
      Decrypt. G, messages and ciphertexts are undefined. label-potential.md
      and fiber-proof.md claim no concrete pair/theorem; honest-trace.md stops
      before complete KeyGen and any Encrypt line.
    effect: No instantiated O3/O4 correctness or functionality theorem exists.
    sources: [public-statement.yaml, label-potential.md, fiber-proof.md, honest-trace.md, scheme-contract.yaml]
  - id: J2-F2
    finding: >-
      The real joint (pp,E,W_E) depends on the absent CompleteBasisAtEndpoint
      and its failure/retry law. The exact mathematical endpoint marginal
      cannot be replaced by uniform curves/endpoints. 'None specified' for
      retries does not mean zero failure. Encryption/message/failure laws
      are missing, so no epsilon=0 or negligible-error conclusion follows.
    sources: [real-key-walk-law.yaml, public-statement.yaml, scheme-contract.yaml]
  - id: J2-F3
    finding: >-
      The admitted closed-walk relation domain is undefined. Nonbacktracking
      length-L support is not closed under reversal-and-concatenation. Vanishing
      only on supported length-L cycles would not automatically prove every
      supported fiber equality.
    sources: [real-key-walk-law.yaml, fiber-proof.md, label-potential.md]
  - id: J2-F4
    finding: >-
      Public W0 has the declared complete evaluable witness type. A global
      RingPotential usable at E0 would yield a public subtraction control.
      Its start/endpoint promise domains are absent. Choice of basis/evaluator
      encoding also needs a policy excluding hidden path advice and ensuring
      agreement for every W_E actually produced at each public E.
    sources: [public-statement.yaml, real-key-walk-law.yaml, label-potential.md, fiber-proof.md]
worked_attacks:
  - id: J2-A1
    target: Actual supported fibers and all canonical/edge relations
    derivation: |
      For an explicit a(e) in G, S(w)=sum_i a(e_i); the target is
      S(w)-S(w')=0 for supported same-canonical-endpoint w,w'.
      These values are undefined here. The standard closed walk
      w followed by reverse(w') requires a(hat(e))=-a(e), compatibility
      with canonical isomorphisms, and an admitted relation/closure proof.
      It has length 2L and may backtrack at the join; it is not automatically
      a supported length-L honest walk.
      For parallel e,e':U->V, the formal cycle e,hat(e') and the dual
      relation force a(e)=a(e') if that cycle is admitted. At L=1 both
      edges are supported from U; at larger L a prefix/suffix replacement
      counts only if both walks obey all preceding/next-dual exclusions.
      Immediate backtracks require a(e)+a(hat(e))=0 when admitted, though
      the sampler excludes them. Canonical automorphism identifications
      require equal sums on the corresponding admissible representatives;
      an admitted one-step self-loop requires a(e)=0. Every other admitted
      cycle z needs sum_z a(e)=0, or a proved generating-set theorem.
    result: Exact missing relation domain/formulas; no invented supported collision or all-cycle proof.
  - id: J2-A2
    target: Public coboundary and endpoint-hash controls
    derivation: |
      For explicit public polynomial h on canonical vertices, substitute
      a(e)=h(head(e))-h(tail(e)). Then S(w:X->C)=h(C)-h(X);
      every closed walk vanishes, including parallel/dual/automorphism
      relations compatible with canonical h. R_h(E,W_E,C)=h(C)-h(E)
      gives exact agreement and ignores W_E. Public pp,E,C suffice.
      A public endpoint hash used as h has the same signature.
      Mathematical existence of some graph potential from all-cycle
      vanishing does not establish efficient public evaluation of it.
    result: Formal fibers may hold, even with distinct-value witnesses, while recipient asymmetry fails.
  - id: J2-A3
    target: Zero and constant controls
    derivation: |
      a(e)=0 and constant R=b give S(w)=R(C)-R(E)=0.
      Two distinct sums cannot occur; the value is public.
      For constant a(e)=a, every length-L sum is L*a; nontriviality
      still fails. A closed length-k sum is k*a, so circulation
      requires k*a=0 for each admitted k. Nonzero torsion constants
      are not automatically excluded without the cycle-length domain.
      Constant R agrees with honest length-L sums only when L*a=0.
      A hypothetical XOR wrapper with fixed public pad H(0) still
      recovers each selected m exactly. Constant invariants therefore
      fail the required mechanism without universally refuting correctness
      of every wrapper; the actual packet has no wrapper.
    result: Nontrivial recipient-asymmetric conclusion breaks for these controls.
  - id: J2-A4
    target: Exact path hash and actual-message collision control
    hypotheses: Two distinct supported paths w,w' to C with distinct path values or derived pads.
    derivation: |
      Exact path encoding distinguishes w,w' despite endpoint equality.
      A hash does not prove endpoint factorization; its collision behavior
      needs a theorem. H(w)!=H(w') precludes a single common endpoint
      value. A whole-path hash is not an additive EdgeLabel by definition.
      For hypothetical full n-bit messages and ciphertext (C,m XOR k(w)),
      k(w)!=k(w') gives the identical ciphertext for distinct
      m and m'=m XOR k(w) XOR k(w'). No decoder is perfectly correct
      for every message and both supported choices. Restricted messages
      or colliding pads require their own argument.
      No concrete pair/hash/pad is supplied. N>|endpoint support|
      would force a pair for the specified key walk by counting, but
      that inequality is not asserted for an unselected pp or encryption law.
    result: Conditional fiber/correctness attack; exact collision-separation obligation remains open.
  - id: J2-A5
    target: Public base complete-ring witness
    hypotheses: >-
      A global common endpoint integral, and polynomial R(pp,E0,W0,X)
      valid at X=E,C with the same label, group and normalization.
    derivation: |
      P0(X)=R(pp,E0,W0,X)-R(pp,E0,W0,E0).
      For key path q:E0->E and sender path w:E->C, global
      path independence and the required concatenation relations imply
      P0(E)=S(q), P0(C)=S(q)+S(w). Hence S(w)=P0(C)-P0(E),
      computed from public W0,pp,E,C without W_E or either path.
      C can be reached by a 2L-step concatenation from E0, outside
      a length-L evaluation promise. E0 need not be a generated start.
      Neither global mathematical existence nor the missing R extends
      that promise domain. Those admissibility/exclusion checks stay open.
    result: Public recovery under the stated hypotheses; no unconditional legal call to an absent R.
  - id: J2-A6
    target: One evaluator and finite torsion-action table
    derivation: |
      If R=F(pp,E,C,Eval_f) for one f, Eval_f suffices for the endpoint
      value. If R=F(pp,E,C,T_N(W_E)) for declared torsion actions,
      that action representation supplies the same functionality.
      Charge construction, degree, evaluation, torsion working fields,
      size/storage and online cost. A table may be exponential in log(N)
      or may determine a full ring under extra bounds; cheapness and
      genuinely smaller information are not automatic.
    result: No R to factor/exclude; input W_E alone proves no complete-ring necessity.
  - id: J2-A7
    target: Path/cache substitutes
    derivation: |
      With public a(e), one sender path computes S(w). With fiber
      invariance, cached valid paths to relevant endpoints compute the
      same value without a complete basis. Charge finding, storage,
      coverage, advice and cold/online costs under the actual coin mass.
      Finite exhaustive enumeration proves no polynomial public algorithm.
      The erased KeyGen path is E0->E, not an available sender path E->C.
      Adding retained paths to sk changes the frozen interface.
    result: Neither cheap cache construction nor exclusion is supplied; erasure alone proves neither.
  - id: J2-A8
    target: Compressed and opaque decoders
    derivation: |
      A factorization D_E=Compress(pp,E,W_E), R=F(pp,E,D_E,C)
      would supply equivalent recovery; size, construction, cost,
      success and ring equivalence need explicit comparison.
      Q_E(C)=R(pp,E,W_E,C) can also package functionality as opaque
      advice. Embedding W_E in Q_E is not automatically smaller
      information or public access. A necessity claim must specify
      allowable advice, uniformity and representation/cost constraints.
      Complete-basis extraction from decoder access is a separate
      dependency owned by J3, not established by this observation.
    result: Precise missing factorization/exclusion; no cheap decoder or extraction theorem invented.
  - id: J2-A9
    target: Selected-message equality and failure quantifiers
    derivation: |
      For a defined raw-XOR control with accepted sender/receiver pads
      K_s,K_r, Dec returns m XOR K_s XOR K_r, equal to m iff K_s=K_r.
      Equal group values imply equal pads with identical deterministic
      encoding/KDF; unequal values need not imply unequal pads.
      CEFC-I must quantify actual valid generated keys, every allowed
      message and supported coins, specifying per-key versus averaged
      guarantees. Completion failures, encryption failures, honest
      parser/canonicalization rejections and decoder disagreement need
      their real joint law and explicit bounds. None is supplied.
    result: Conditional XOR algebra holds; CEFC-I correctness/failure theorem remains undefined.
