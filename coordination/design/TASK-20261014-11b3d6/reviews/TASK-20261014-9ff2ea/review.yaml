unblocking_conditions:
  - >-
    Supply and review the complete-key sampler on the exact valid parameter/
    supported-walk family, with representation, witness-equivalence and
    completion/failure/retry law; no hidden path advice in the permitted output.
  - >-
    Supply explicit G, EdgeLabel and RingPotential, including all promise
    domains, canonical/dual/automorphism relations, costs, normalization and
    failures; define encryption support and two supported distinct-sum witnesses.
  - >-
    Prove all supported endpoint fibers and potential agreement for every
    produced witness, plus every admitted closed relation or a sufficient
    generating-set/closure theorem. Unsupported concatenations need explicit
    handling rather than being called sampled paths.
  - >-
    Define messages/ciphertexts, Encrypt/Decrypt, coins and rejection; prove
    actual selected-message recovery under the stated per-key or averaged
    guarantee with every honest-operation/key-completion failure accounted for.
  - >-
    Resolve public W0 evaluation at E0 for E,C and the subtraction identity
    under the exact promise domains. Compare public coboundary/endpoint-hash/
    constant controls without conflating finite existence with efficient access.
  - >-
    Define full-ring necessity and admissible advice/representations. Give
    exact factorizations or exclusions for evaluator, finite action, cache,
    compressed and opaque decoders on the identical law, charging construction,
    cold setup, online work, storage, targets and success. Send any extraction
    claim to J3. Meeting O3/O4 does not establish separate security gates.
