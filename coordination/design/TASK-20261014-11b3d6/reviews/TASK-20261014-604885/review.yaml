verdict: holds
verdict_scope: >-
  The producer's scoped stopping diagnosis holds: integral transport returns
  a strict index-d^3 suborder and normalized conjugation is not uniformly
  integral for the supported cyclic-kernel walks. CompleteBasisAtEndpoint is
  unspecified in this packet. This validates neither O1/O2 discharge nor a
  theorem that polynomial completion is unavailable or impossible.
exact_scope:
  family: >-
    Conditional on valid pp, p>3 prime, ell!=p prime, L>=1,
    E0/F_(p^2) supersingular with scalar p^2-Frobenius and a complete
    evaluable geometric End(E0) basis W0 containing 1; actual cyclic
    ell-subgroup edges retain multiplicity and only the actual preceding
    dual kernel is excluded. d=ell^L.
  reviewed: [conditional_walk_law, map_typing, unital_order, exact_index,
    normalized_integrality, missing_key_completion, public_interface_stop,
    representation_and_cost_obligations]
  not_owned: [O3, O4, O5, O6]
  excluded_conclusions: [whole_scheme_vote, security_claim,
    universal_nonexistence, saturation_lower_bound, novelty,
    QPT_QROM_security, NIST_Category_5]
findings:
  - id: J1-F1
    subject: supported_walk_degree_and_kernel
    status: holds
    derivation: |
      Every step is separable of degree ell, so the composite has degree ell^L.
      Cyclicity needs the actual dual-kernel exclusion, not just a vertex rule.
      Inductively let psi_n have cyclic kernel of order ell^n. Its image of
      E0[ell] is the line D_n=ker(hat(phi_n)), where phi_n is the last edge.
      Indeed phi_n sends any line distinct from its kernel to its entire
      one-dimensional image on ell-torsion. For the next kernel H!=D_n,
      psi_n^(-1)(H) meets E0[ell] in ker(psi_n)[ell], a single line. Its order
      is ell^(n+1); an etale subgroup of an elliptic curve with one-dimensional
      ell-torsion is cyclic. Choosing H=D_n instead introduces full E0[ell]
      into the composite kernel and is precisely the excluded backtrack.
    condition: >-
      Under canonical model changes the preceding dual kernel must be
      transported by the actual chosen isomorphism. Excluding all edges to
      the previous vertex would change the law when parallel edges occur.
  - id: J1-F2
    subject: conditional_real_law_and_rationality
    status: partial_definition
    derivation: |
      With a fixed ordering of actual edges the number of coin strings is
      N=(ell+1)*ell^(L-1); each has mass 1/N. Therefore endpoint mass is
      #{strings with canonical endpoint C}/N, including multiplicities,
      loops and revisits. No uniform-vertex or mixing assertion follows.
      Scalar p^2-Frobenius is [+p] or [-p]. It preserves every geometric
      ell-torsion line, so these subgroup schemes are F_(p^2)-rational.
      Rational isogenies preserve this scalar Frobenius property. This does
      not mean individual torsion points are rational: full point rationality
      requires the scalar to be 1 modulo ell.
    missing: >-
      Setup supplies only a valid-tuple predicate, with no parameter family,
      selection algorithm, field encoding, W0 certification/encoding, or
      locally executable edge-ordering routine. The endpoint marginal is
      defined conditionally; the joint law of W_E is not instantiated without
      completion coins, output choices and failure/retry rules.
  - id: J1-F3
    subject: typed_transport_and_unital_order
    status: holds
    derivation: |
      Put O0=End(E0), O=End(E), and psi:E0->E_L. Canonicalization must return
      a model E and isomorphism kappa:E_L->E, not merely an encoding or j.
      Then phi=kappa psi and hat(phi)=hat(psi) kappa^(-1) are typed and
      hat(phi) phi=[d]. Thus F(alpha)=phi alpha hat(phi) belongs to O.
      Let tau(alpha)=phi alpha phi^(-1) in End^0(E), so F(alpha)=d tau(alpha)
      and F(1)=[d]. The displayed lattice is S=Z*1+d*tau(O0).
      F(alpha)F(beta)=d F(alpha beta). Since F(O0) is contained in S and
      F(1)=d*1, all products of its generators lie in S. Its four generators
      are independent over Q. Hence S is an integral rank-four unital order.
    missing: >-
      The mathematical canonical-isomorphism operation is well typed, but
      its model, automorphism tie-breaking, encoding, algorithm and costs are
      not specified. Equality of j alone cannot replace F_(p^2)-isomorphism.
  - id: J1-F4
    subject: exact_index
    status: holds
    derivation: |
      tau(O0) is a conjugate maximal quaternion order. Conjugation preserves
      the reduced trace pairing, and geometric supersingular endomorphism
      orders have the same reduced discriminant p. Hence O and tau(O0)
      have equal covolume in End^0(E). Relative to the conjugate basis
      (1,tau(alpha2),tau(alpha3),tau(alpha4)), S has diagonal change
      (1,d,d,d). Since S is contained in O, [O:S]=d^3>1.
      Independent local check: use Tate bases in which phi is
      g=diag(d,1), possible because ker(phi) is cyclic of order d.
      Both complete ell-adic endomorphism orders act as M2(Z_ell).
      Then S_ell=Z_ell*I+d*g*M2(Z_ell)*g^(-1) has basis
      (I,d*e11,d^2*e12,e21). Relative to M2(Z_ell), its index is
      ell^(L+2L)=ell^(3L). Away from ell, d is a unit and phi is an
      invertible localized isogeny, so S_q=O_q. This gives the same d^3.
    consequence: >-
      Returning (1,F(alpha2),F(alpha3),F(alpha4)) cannot meet the full-ring
      output predicate, even though each map is integral and evaluable with
      the ephemeral chain. The index proof itself does not require cyclicity.
  - id: J1-F5
    subject: normalized_conjugation_attack
    status: holds
    derivation: |
      If tau(alpha) is an integral endomorphism, tau(alpha) phi=phi alpha
      implies alpha(ker(phi)) subset ker(phi). Conversely that preservation
      permits descent through the separable quotient, giving integral tau.
      For a cyclic kernel, ker(phi)[ell] is one line. The complete rank-four
      order acts on E0[ell] as all M2(F_ell), which cannot preserve one line.
      To see surjectivity without assuming an orientation: reduction
      O0/ell O0 -> End(E0[ell]) is injective, since an endomorphism killing
      E0[ell] factors through [ell]; both sides have dimension four.
      Some global alpha therefore moves the kernel line, making tau(alpha)
      nonintegral. At least one of the three nonidentity basis elements fails
      integrality, since otherwise the entire order would preserve the line.
      In the local normal form, g e21 g^(-1)=d^(-1)e21 explicitly exhibits
      the denominator. For L=1, ell=2, S_2 has basis
      (I,2e11,4e12,e21), index 8, while normalized e21 becomes e21/2.
    limitation: >-
      The local matrix units illustrate the certificate, not a newly chosen
      global parameter or experiment. Division by d here is rational-algebra
      notation; it is not a global inverse scalar map or coordinate division.
  - id: J1-F6
    subject: first_missing_call_and_correct_stop
    status: missing_interface
    derivation: |
      From pp,E alone a sender has no supplied EdgeLabel formula or declared
      group G; it cannot execute an encryption label call. In KeyGen, the
      sampled phi and W0 permit F(alpha_i) and S, but the next line
      W_E <- CompleteBasisAtEndpoint(pp,phi,W0) has implementation=null.
      Its inputs are permitted ephemeral KeyGen data; its required output is
      a complete evaluable basis, which S does not provide. From pp,E,W_E,C,
      RingPotential likewise has implementation=null. Encrypt and Decrypt
      are null, with no message/ciphertext syntax, parser or failure law.
      honest-trace.md explicitly stops at completion and asserts no successful
      PKE trace. No orientation, Hom enumeration, path advice, constant label
      or public hash is actually inserted into these absent algorithms.
    distinction: >-
      This is an exact missing step in the supplied packet. The algebra
      refutes the two naive substitutions, not every saturation algorithm.
      An index d^3 has bit length 3L log2(ell); its size alone is not a
      polynomial-time lower bound or an output-size impossibility.
  - id: J1-F7
    subject: representation_runtime_output_and_retries
    status: open
    details: >-
      Polynomiality in numerical ell,L,log(p) is the declared model, but
      ell and L are not bounded relative to the stated security parameter
      log2(p). No worst-case/expected time, memory, setup, evaluator size,
      basis conversion, public verification or completion tail bound is
      supplied. A degree-d expanded rational map can be large while a
      length-L factored evaluator can be short; neither fact proves the
      required full-ring cost. Any evaluator circuit retaining the sampled
      phi/dual factorization must be audited against the no-retained-path
      output rule. 'Ordered actual edges' must be computed locally or its
      entire advice/table size and construction charged. An uncharged
      complete graph or Hom enumeration cannot supply a polynomial routine.
obligation_statuses:
  O1:
    status: open
    owned: true
    reason: >-
      Conditional endpoint law and strict-suborder certificate are supplied;
      efficient Setup, actual complete-key joint law, evaluable output
      representation, verification and CompleteBasisAtEndpoint are missing.
  O2:
    status: open
    owned: true
    reason: >-
      Mathematical walk/transport are partial definitions. Completion,
      EdgeLabel, RingPotential, Encrypt, Decrypt, validation and complete
      bit/runtime/memory/output/retry arguments remain unspecified.
dependency_notes:
  O3: {owned: false, reported_packet_status: open, dependency: "No label, potential, actual-message algorithms or failure law; J2 owns any correctness verdict."}
  O4: {owned: false, reported_packet_status: open, dependency: "Use of a full basis does not exclude a public or smaller-witness decoder; J2 owns functionality/necessity."}
  O5: {owned: false, reported_packet_status: open, dependency: "No full PKE or exact-law challenge simulator/extractor; J3 owns reduction direction and losses."}
  O6: {owned: false, reported_packet_status: open, dependency: "Ciphertext and full observable view are undefined; J3 owns adversarial/security gates."}
controls:
  execution: symbolic_only
  items:
    - {object: "d=1 identity transport, outside L>=1", expected: "S=O; no strict-index obstruction.", checked: "The formula gives index 1."}
    - {object: "phi=[ell], from an immediate dual backtrack", expected: "Noncyclic kernel E[ell]; normalized conjugation integral.", checked: "tau is identity but S=Z*1+ell^2 O0 still has index ell^6. Nonintegrality requires the cyclic-kernel scope."}
    - {object: "Public coboundary h(head)-h(tail)", expected: "Zero circulation can coexist with public endpoint recovery.", checked: "The sum telescopes to h(C)-h(E); this cannot fill the intended asymmetric label interface. O4 verdict reserved to J2."}
    - {object: "Zero label and constant potential", expected: "Failure of distinct-value nontriviality witnesses.", checked: "All supported sums coincide; no candidate label is supplied by this control."}
    - {object: "Full graph/Hom enumeration or an oracle named CompleteBasisAtEndpoint", expected: "Finite definition alone does not supply polynomial honest computation.", checked: "No enumeration algorithm or cost is imported; the interface stays open."}
    - {object: "Path/hash, one evaluator, finite action, cache, compressed or opaque decoder", expected: "Cannot infer full-ring necessity merely from use of W_E.", checked: "No substitute is supplied; comparison remains a J2 dependency, not a J1 discharge."}
unblocking_conditions:
  - >-
    Fix an efficient Setup family and finite-field/model/endomorphism encodings,
    local actual-edge ordering and canonicalization returning an explicit
    isomorphism, with certification and total charged sizes. State whether
    pp is generated or supplied and bound ell,L,input length relative to
    the claimed polynomial security parameter.
  - >-
    Supply CompleteBasisAtEndpoint for every declared valid pp and supported
    walk, including its coins, full-ring equality certificate, evaluators,
    public verification/conversion, exact failure/retry law, output size and
    polynomial bit time/memory. Charge all preprocessing. Its output must
    satisfy the declared no-path/advice condition rather than conceal phi
    inside an unexamined evaluator or oracle.
  - >-
    Then instantiate one group G and public nontrivial EdgeLabel together
    with RingPotential(pp,E,W_E,C), with full typing, parsing, normalization,
    field/bit/memory costs and failure handling. Provide complete Setup,
    KeyGen, Encrypt and Decrypt. This would enable further O2 review; it
    would not discharge O3-O6, secrecy, quantum or concrete-security gates.
