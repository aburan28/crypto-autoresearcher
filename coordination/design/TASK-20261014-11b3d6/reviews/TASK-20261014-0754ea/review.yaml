joint: J3
verdict: inconclusive
scope: >-
  J3 only: the literal statement's O5/O6 dependencies, independent symbolic
  rederivation, all named proves-too-much controls, and separate passive,
  active, novelty, quantum-model and concrete-security gates. No whole-scheme
  vote, repair, official status transition or security claim is made. The
  controls below refute implications for their specified objects, rather
  than establish an attack on an Encrypt interface whose implementation is null.
finding: >-
  The allowlisted literal statement does not specify an encryption or
  decryption algorithm. CompleteBasisAtEndpoint, EdgeLabel and RingPotential
  also have null implementations. Consequently there is no defined real
  ciphertext law, complete IND-CPA simulation or attacker-to-complete-basis
  extractor to rederive. The conditional fixed-pp walk law is reconstructible;
  its promotion to the successful key distribution and a security-parameter
  family is not. Missing data remains open, not zero error or zero loss.
earliest_owned_obstruction:
  obligations: [O5, O6]
  location: public-statement.yaml algorithms.Encrypt and algorithms.Decrypt
  exact_scope: >-
    For the stated family pp=(p,ell,L,E0,W0,canonical_curve_encoding,
    ordered_actual_edges), no literal message domain, encryption coins,
    ciphertext/payload encoding, pad derivation, parsing, validation or
    decryption rule is supplied. Thus for every such pp the statement lacks
    the data defining the claimed full-scheme security experiment. This is
    missing information, not a proof that an implementation cannot exist.
  downstream: >-
    Even conditional on supplying these algorithms, O5 additionally needs
    challenge-distribution matching and an extractor that returns the full
    evaluable saturated End(E) basis. Functionality from a ring witness does
    not provide that extractor. O6 needs the full public and oracle view.
  existing_problem_pointer: problems/eigenx-cest-endring-reduction-not-established.md
  problem_pointer_scope: >-
    Pointer authorized by opening.yaml only; the problem file was not read
    or modified in this blind session. No new problem record is authorized
    in this task's single-file write scope.

obligation_statuses:
  O1: open
  O2: open
  O3: open
  O4: open
  O5: open
  O6: open
obligation_status_scope:
  O1: >-
    Dependency observation, not a J1 verdict: a fixed-pp endpoint law and
    the required witness type are stated, but Setup, successful key
    completion/rejection law, lambda-family and representation bounds are
    absent. No complete hard-instance distribution is reviewed here.
  O2: >-
    Dependency observation, not a J1 verdict: named null interfaces do not
    supply complete algorithms or bit/runtime bounds.
  O3: >-
    Dependency observation, not a J2 verdict: a fiber/potential equality and
    actual selected-message recovery cannot be instantiated from the
    literal null label, potential, encryption and decryption interfaces.
  O4: >-
    Dependency observation, not a J2 verdict: declaring W_E as an input does
    not exclude public or smaller-witness factorization. The symbolic
    controls preserve that obligation rather than adjudicate its owner.
  O5: >-
    Owned: no correctly directed, distribution-matched IND-CPA-attacker to
    complete evaluable saturated End(E)-basis reduction, simulator,
    extractor, runtime or quantitative loss is supplied.
  O6: >-
    Owned: the visible pp and E are stated, but the complete ciphertext,
    query, parsing, failure and repeat-use view is absent. Named controls
    expose the required distinctions without discharging this obligation.

separate_gate_statuses:
  IND_CPA:
    status: open
    reason: >-
      The advantage convention is specified by opening.yaml and the
      construction contract, but the literal Encrypt and Decrypt interfaces
      do not define a PKE game. No numerical advantage is asserted for CEFC-I.
  active_security:
    status: open
    conditional_raw_XOR_CCA2: contradicted
    reason: >-
      Raw endpoint-plus-XOR without a payload-binding validity check has
      the one-query CCA2 attack below. This conditional control does not
      identify the unspecified CEFC-I Encrypt interface as raw XOR. The
      same transformation exhibits a plaintext relation; it alone supplies
      no post-challenge-oracle attack in CCA1 or plaintext recovery in CPA.
  complete_EndRing_reduction:
    status: open
    reason: >-
      A recovered potential, pad, path, one evaluator, finite action table,
      abstract order or opaque decoder is not the required complete
      evaluable saturated four-element basis. No conversion/extraction
      theorem and cost covering these substitutions is stated.
  novelty:
    status: open
    reason: >-
      source-ledger.yaml explicitly says primary_sources.status is
      not_retrieved_in_this_task and makes no primary-source novelty claim.
      The contract's external citation ledger records another session's
      reads, not this reviewer's inspection of their proofs. The allowed
      statement supplies no concrete label/evaluator to compare. Neither
      novelty nor duplication is established by these internal descriptions.
  QPT:
    status: open
    reason: >-
      No quantum hard-problem assumption on the exact public marginal,
      adversary/query interface, quantum simulator or extractor is supplied.
      Classical symbolic controls remain available to QPT adversaries, but
      their failure is not a quantum-security theorem for CEFC-I.
  QROM:
    status: open
    reason: >-
      No random-oracle input/output space, domain separation, query bound,
      reversible quantum-query interface, programming rule, rewinding
      theorem or quantitative quantum loss is specified. If a standard-model
      construction is intended, its model and proof must be stated explicitly;
      an absent hash interface is not a QROM proof or an automatic exemption.
  NIST_Category_5:
    status: open
    reason: >-
      No independently inspected normative category target, parameter set,
      classical/quantum attack portfolio, matching resource comparison,
      reduction loss or measured complete-scheme evidence is supplied.
      The KEM guidance cited in the contract is not evidence that this
      proposed PKE meets Category 5. No parameter choice or category claim
      is made in this zero-run review.

blind_rederivation:
  mode: literal_statement_only_symbolic
  fixed_parameter_space:
    derived: >-
      Fix a pp satisfying the declared predicates and assume its actual-edge
      ordering and exclusion of the previous actual dual are defined. The
      walk coin space is Omega_pp={0,...,ell} x
      {0,...,ell-1}^{L-1}. Its size is N=(ell+1)*ell^(L-1), every coin word
      has mass 1/N, and d=ell^L with log2(d)=L*log2(ell). For L=1 the
      second product is empty and N=ell+1. Choices concern actual edges,
      including multiplicity; they are not choices among distinct endpoint
      encodings. Canonical endpoint equality need not identify coin words.
    conditionality: >-
      This law is conditional on a valid fixed pp, with no retry term in
      the stated combinatorial law. It does not give a Setup sampler,
      implementation failure bound, key-completion success law or uniform
      endpoint distribution.
  endpoint_probability:
    derived: >-
      Let e(r) be the canonical codomain of the ordered composition phi(r).
      Then mu_pp(c)=Pr[e(r)=c]=sum_(r in Omega_pp) 1[e(r)=c]/N.
      Sum_c mu_pp(c)=1. Parallel actual edges and canonical automorphism
      identifications retain their coin-word multiplicities. A uniform
      curve law or a mixing approximation cannot replace mu_pp without a
      separate comparison theorem.
  joint_key_probability:
    conditional_formula: >-
      If completion has a specified conditional kernel
      K_pp,phi(r)(w)=Pr[CompleteBasisAtEndpoint(pp,phi(r),W0)=w], including
      an explicit failure symbol, then
      Pr[E=e,W_E=w | pp]=(1/N)*sum_(r:e(r)=e) K_pp,phi(r)(w).
      A deterministic total completion is the special case of a point mass.
      The statement does not specify either kernel or totality. If failed
      keys are retried, the successful E law is proportional to
      sum_(r:e(r)=e) Pr[completion succeeds | r]; it need not equal mu_pp.
    unresolved: >-
      Setup's law of pp, correlations with public W0 and edge advice,
      completion randomness, retry/rejection observables and successful-key
      marginal are absent. Mathematical existence of a complete basis does
      not establish its generation distribution or efficient evaluability.
  fiber_potential_equality:
    conditional_derivation: >-
      For a specified label a into an abelian additive G define
      S(P)=sum_j a(e_j). For two supported walks P,Q with common start E
      and canonical endpoint C, require a(hat(e))=-a(e), compatible
      canonical/automorphism identifications, and zero circulation for the
      closed walk P followed by Q in reverse, or a justified reduction of
      that walk including every cancelled backtrack. Then
      S(P)-S(Q)=S(P followed by reverse(Q))=0. Thus F_E(C)=S(P) is
      well-defined on reachable endpoint fibers. A further algorithmic
      equality RingPotential(pp,E,W_E,C)=F_E(C) is still required. If G
      is intended to be nonabelian, the operations, path order and inverse
      identities require a separate exact statement.
    unresolved: >-
      No a, G encoding/order, dual rule, admitted cycle family, normalization
      value, encryption walk law or RingPotential implementation is supplied.
      A concatenated P/reverse(Q) can contain backtracks and have length 2L;
      the fixed-length nonbacktracking sampler alone does not authorize its
      circulation identity. The conditional algebra is not a proof that
      the candidate label satisfies it. J2 owns its eventual correctness verdict.
  failure_terms:
    required_probability_space: >-
      Correctness must range over Setup coins, real key-walk coins,
      completion/retry coins, every allowed message, encryption coins and
      any potential/decryption coins, with the declared valid-key or
      averaged-key quantifier. These are not all defined by the statement.
    conditional_accounting: >-
      Once this space exists, define F_key, F_walk, F_label, F_potential,
      F_parse and F_agreement as the corresponding actual failure events.
      If recovery is guaranteed off their union, epsilon_corr is at most
      Pr[F_key union F_walk union F_label union F_potential union F_parse
      union F_agreement], hence at most the sum of their probabilities.
      Correlation cannot be replaced by independence. If correctness is
      conditional on a valid generated key, state that conditioning and
      account for key-generation retry/tail costs separately.
    numerical_bound: null
    reason: >-
      Absent interfaces do not define these event probabilities. No term
      is assigned zero, one, negligibility or independence from its absence.
  honest_cost:
    derived_cost_skeleton: >-
      T_Walk is the sum over L steps of unbiased edge-index sampling,
      kernel/edge access, isogeny construction, actual-dual exclusion and
      canonicalization/coordinate transport, plus the cost of representing
      phi. T_KeyGen=T_Walk+T_CompleteBasisAtEndpoint and includes pp
      generation/preprocessing, completion verification, retries and erasure
      when counting the entire honest workflow. T_Encrypt and T_Decrypt
      depend on the missing algorithms and their label/potential/KDF/validation
      calls. Peak memory includes public edge advice, W0, path or factored
      phi during key completion, W_E, and temporary conversion objects.
    bit_length_observation: >-
      The mathematical degree ell^L can be exponential in L*log(ell).
      A dense expanded degree-d map has representation cost linear in its
      degree, whereas a factored chain has L component maps; its actual
      bit size still depends on the component-map encoding. Neither
      composing symbols nor knowing log2(d) proves polynomial bit cost.
      The statement supplies no relation p(lambda), ell(lambda), L(lambda),
      W0/W_E size bounds, edge-access encoding or primitive weights.
    transport_identity: >-
      Since hat(phi) composed with phi=[d], phi^(-1)=hat(phi)/d in Hom tensor Q.
      Thus (phi composed with alpha composed with hat(phi))/d is rational
      conjugation phi composed with alpha composed with phi^(-1).
      IntegralPush gives genuine integral endomorphisms, but the stated
      rational normalization does not itself prove saturation or construct
      a complete evaluable basis. Its conversion cost remains unspecified.
    polynomial_bound: null
    measured_cost: null
    reason: No missing honest-party call is treated as a unit-cost oracle.
  IND_CPA_advantage:
    required_experiment: >-
      Sample the real successful (pp,E,W_E) key law; give pk=(pp,E) to A;
      obtain admissible equal-length m0,m1; draw b uniformly; return
      Enc(pk,m_b;rho) with rho from its actual law; receive b'. Include all
      public data and A's coins. The convention is
      epsilon_A=abs(Pr[b'=b]-1/2), with no decryption oracle in CPA.
    derived_bound: The conventional advantage lies between 0 and 1/2.
    candidate_advantage: null
    reason: >-
      Encryption coins, message space and ciphertext law are absent. The
      endpoint law for KeyGen from E0 is not an encryption law from E.
      Security cannot be inferred from a nonconstant endpoint value.
  attacker_to_complete_EndRing_extraction:
    challenge: >-
      Give B the challenge E together with the fixed public pp, or an exact
      public (pp,E) challenge distribution if Setup is random. Do not give
      B W_E, the original key-generation path, a completion oracle or hidden
      setup advice. The target is this E, not an independently regenerated
      curve for which B knows a secret.
    simulation_reconstruction: >-
      With a distribution-matched (pp,E), presenting pk=(pp,E) needs no
      secret basis. A genuinely public, specified Encrypt would also allow
      CPA encryption/challenge simulation without W_E; CPA requires no
      decryption oracle. The absent Encrypt, public Setup marginal and
      key-completion/retry law prevent verification of that real simulation
      here. Lack of W_E alone is not an impossibility of CPA simulation.
    required_output: >-
      Four evaluable endomorphisms on the challenged E generating its full
      geometric End(E) as a saturated rank-four Z-order, with declared
      encoding, completeness/saturation success predicate, verification and
      conversion costs. A transported unsaturated suborder, abstract order,
      one evaluator, recovered key/message, potential value or path is not
      accepted as that output without a proved efficient conversion.
    quantitative_requirement: >-
      Supply an explicit B and a bound epsilon_A <= kappa(lambda)*s_B +
      delta(lambda), where s_B is the probability of this complete-basis
      output, kappa is a specified polynomial loss and delta accounts for
      distribution/view differences, bad events and extraction errors.
      Equivalently s_B >= max(0,(epsilon_A-delta)/kappa) when kappa>0.
      Derive each term in the actual model and include B's setup, A calls,
      quantum/classical oracle simulation, extraction, conversion and
      output-verification runtime. Independent events are not presumed.
    success_probability: null
    loss: null
    additive_error: null
    extractor_runtime: null
    reason: >-
      No extractor is supplied. A distinction bit, recoverable pad or
      functionality using W_E need not encode the full ring. Random guessing
      has win probability 1/2 without solving EndRing, so the relevant
      premise is advantage, not raw win probability. If a value-evaluation
      assumption is needed, define its separate game and prove its transfer
      to complete EndRing instead of renaming it EndRing hardness.

worked_attacks:
  - id: J3-PUBLIC-COBOUNDARY
    object: Public coboundary EdgeLabel(e)=h(head(e))-h(tail(e)).
    exact_scope: >-
      Explicit publicly evaluable canonical h into abelian G, start E,
      compatible actual edges and a public pad function k. The conditional
      encryption is (C,u=m XOR k(h(C)-h(E))).
    calculation: >-
      Telescoping gives S(P)=h(C)-h(E) for every path and zero circulation
      for every closed walk. RingPotential can return this value using no
      ring witness. A computes z=k(h(C)-h(E)), obtains m=u XOR z, and
      distinguishes any two distinct equal-length challenge messages with
      Pr[b'=b]=1 and advantage 1/2 under perfect control correctness.
    conclusion: >-
      Honest agreement, zero circulation and nonconstant endpoint values
      do not imply confidential recipient-only evaluation or EndRing extraction.
  - id: J3-CONSTANT
    object: Zero/constant label and constant potential.
    exact_scope: >-
      Zero label yields S(P)=0 and a constant zero potential. A nonzero
      constant label g yields L*g for fixed-length L paths; it satisfies
      every admitted closed-walk condition only if each admitted cycle
      length t obeys t*g=0. This condition is not silently assumed.
    calculation: >-
      Whenever the control's constant potential matches the sender value,
      the pad is public and the preceding public-pad IND-CPA attack has
      advantage 1/2 under perfect correctness. No two supported sums are
      distinct, so the required nontriviality witness fails. A normalization
      at the empty path additionally constrains the constant to its specified
      neutral value.
    conclusion: >-
      Constant agreement supplies no key-bearing secrecy; a nonzero
      constant label is not automatically a valid zero-circulation control.
  - id: J3-PATH-HASH
    object: Exact path hash on two distinct same-endpoint supported walks.
    exact_scope: >-
      Supported P != Q beginning at the same E and ending at canonical C,
      with a path hash/encoding H satisfying H(P) != H(Q).
    calculation: >-
      Any single-valued endpoint evaluator R(pp,E,W_E,C) returns one value
      on C and cannot equal both H(P) and H(Q). The control fails endpoint
      invariance. Pigeonhole gives a same-endpoint pair when the number of
      supported words exceeds the endpoint-support size, but this statement
      supplies no concrete pair or such parameter inequality. A generic
      cryptographic hash is not asserted to separate all distinct paths.
    conclusion: >-
      Preserve the conditional collision counterexample and the missing
      separation/fiber premise; do not infer a collision for every p,ell,L.
  - id: J3-SMALLER-WITNESS
    object: One evaluator, torsion table, cached paths, compressed or opaque decoder.
    exact_scope: >-
      For a specified decoder D, suppose T=F(pp,E,W_E) and
      D(pp,E,W_E,c)=d(pp,E,T,c) throughout the declared ciphertext domain.
      This hypothesis must be proved for each proposed smaller object.
    calculation: >-
      Holding T suffices for that decoder, while D's invocation of W_E
      proves no reconstruction of the full ring. The public coboundary is
      an explicit factorization with empty T. Other possible T include one
      evaluator, its finite action table, a path/cache, compressed decoder
      or supplied advice. Charge T construction, advice source, bit size,
      memory, online evaluation, coverage and out-of-domain failures;
      a finite table is not automatically sufficient for all endpoints.
    conclusion: >-
      Necessity and conversion to a complete evaluable basis remain open
      absent an exclusion or reconstruction theorem. This symbolic audit
      does not assert that any unspecified CEFC-I potential factors this way.
  - id: J3-PUBLIC-PATH-SEARCH
    object: Public W0 and the exactly supported key-walk family.
    exact_scope: >-
      Conditional on public executable WalkSample and a total polynomial
      completion algorithm accepting any supported connecting phi, enumerate
      the N=(ell+1)*ell^(L-1) coin words and compare their canonical
      endpoints to the challenged E.
    calculation: >-
      Because E lies in this support, enumeration finds a path to this E.
      Applying the assumed completion to that path and public W0 returns
      a complete witness on E, whether or not the path equals the erased
      key-generation path. The worst-case symbolic time is at most
      N*T_Walk+T_Complete plus comparison costs. If these quantities are
      polynomial in the actual security-family/input length, that specific
      family has no hard EndRing challenge of the proposed kind.
    conclusion: >-
      This is a conditional public-discovery upper bound and distribution
      screen, not a measured attack or an assertion that N or completion is
      polynomial for the unstated family. The null completion cannot be
      granted as an available oracle.
  - id: J3-RAW-XOR-ACTIVE
    object: Endpoint-plus-XOR without payload-binding authentication.
    exact_scope: >-
      Accepted fixed-length ciphertexts are serialized pairs (C,u),
      Dec(W_E,(C,u))=u XOR z_E(C), and all payloads of the length are
      accepted with the same endpoint-derived pad. n>=1. Challenge
      ciphertext equality is byte equality, as in ordinary CCA2.
    attack: >-
      After c*=(C*,u*) choose any n-bit Delta != 0. Query
      c'=(C*,u* XOR Delta). Its canonical endpoint equals C* but its bytes
      differ from c*, so it is an allowed query. The reply is
      m_b XOR Delta; XOR Delta again recovers m_b and identifies b for
      distinct m0,m1. One post-challenge decryption query suffices.
    quantitative_result: >-
      With perfect control correctness and acceptance, Pr[b'=b]=1 and
      CCA2 advantage is 1/2. If the corresponding accepted-related-ciphertext
      correctness event fails with probability at most epsilon, the same
      strategy has win probability at least 1-epsilon and advantage at least
      max(0,1/2-epsilon); no such epsilon is given for CEFC-I.
    nonmalleability_relation: >-
      The public transformation itself produces a different ciphertext
      decrypting to m XOR Delta, giving the deterministic plaintext relation
      y=x XOR Delta under the control's correctness assumptions. A full NM
      game/distribution must be stated before quoting an NM advantage.
    boundary: >-
      Excluding every equal-endpoint query would weaken the ordinary CCA2
      game. This is not a CCA1 post-challenge query and does not by itself
      recover the plaintext in CPA. No transform or active-security repair
      is introduced in this task.
  - id: J3-REVERSE-ARROW
    object: Ring witness enables decryption without attacker-to-ring extraction.
    exact_scope: The logical implication used for an EndRing-only confidentiality claim.
    calculation: >-
      W_E -> decryption (or an EndRing solver -> scheme attacker) provides
      an attack using the ring. Security needs a solver using a successful
      scheme attacker to output the complete basis on the supplied E. The
      public coboundary control has a perfect distinguishing attacker that
      ignores W_E and returns no ring information. Its correctness/ring-use
      argument therefore cannot serve as the required extractor.
    conclusion: >-
      Reject the reverse implication as a proof. This does not prove that
      no separate extractor can ever exist; its algorithm, representation
      conversion and quantitative success remain absent.

proves_too_much_results:
  public_coboundary:
    result: known_false_conclusion_rejected
    worked_attack: J3-PUBLIC-COBOUNDARY
    preserved_signature: Zero circulation and agreement coexist with public recovery.
  zero_constant:
    result: known_false_conclusion_rejected
    worked_attack: J3-CONSTANT
    preserved_signature: Distinct-sum nontriviality fails and the control pad is public.
  exact_path_hash:
    result: conditional_counterexample_and_missing_premise_preserved
    worked_attack: J3-PATH-HASH
    preserved_signature: >-
      Same-endpoint separated path values cannot share an endpoint evaluator;
      a concrete collision/separation premise is not supplied for this family.
  one_evaluator:
    result: complete_ring_necessity_open
    worked_attack: J3-SMALLER-WITNESS
    preserved_signature: A factored decoder needs its evaluator, not a basis by assertion.
  finite_torsion_action_table:
    result: complete_ring_necessity_open
    worked_attack: J3-SMALLER-WITNESS
    preserved_signature: Table construction, coverage, size and conversion are charged obligations.
  cached_paths:
    result: complete_ring_necessity_open
    worked_attacks: [J3-SMALLER-WITNESS, J3-PUBLIC-PATH-SEARCH]
    preserved_signature: Path/cache availability and public discovery cost require exact bounds.
  compressed_endpoint_decoder:
    result: complete_ring_necessity_open
    worked_attack: J3-SMALLER-WITNESS
    preserved_signature: Compression does not establish decoder-to-full-ring reconstruction.
  opaque_decoder_advice:
    result: complete_ring_necessity_open
    worked_attack: J3-SMALLER-WITNESS
    preserved_signature: Unspecified advice is a separate secret or assumption, not a basis.
  raw_XOR:
    result: conditional_CCA2_break
    worked_attack: J3-RAW-XOR-ACTIVE
    preserved_signature: Same endpoint and nonzero payload flip yield an allowed byte-distinct query.
  reverse_reduction:
    result: wrong_direction_rejected_extraction_open
    worked_attack: J3-REVERSE-ARROW
    preserved_signature: Ring-to-decrypt functionality does not yield an attacker-to-complete-ring solver.

adversarial_view_audit:
  declared_public: >-
    pk=(pp,E), including p,ell,L,E0, public complete evaluable W0,
    canonical-curve encoding and ordered_actual_edges. The exact content,
    size and access cost of ordered_actual_edges must be fixed. It cannot
    silently stand for a polynomial-size global graph table or hidden advice.
  declared_secret: Complete evaluable saturated W_E; key-generation path is erased after completion.
  absent_view: >-
    Setup trust/coins/erasures, ciphertext bytes and payload domain, extra
    torsion or orientation hints, KDF/hash, randomness/nonce reuse, validation
    responses, alternative encodings, retry/failure observables, repeated
    key/ciphertext use, oracle/query bounds and implementation side-channel
    scope. No absence in this list is inferred to be a guarantee of omission.
  collisions_and_pad_reuse: >-
    Conditional on a deterministic endpoint-only pad z_E(C), two accepted
    raw ciphertexts with the same C disclose u1 XOR u2=m1 XOR m2. If
    independent encryption endpoint draws have law nu_E, their collision
    probability is sum_C nu_E(C)^2 and the expected number of equal-endpoint
    pairs among q draws is binomial(q,2)*sum_C nu_E(C)^2. The candidate
    supplies neither this encryption law nor independent draws, so mu_pp
    from KeyGen cannot be substituted. Predictable nonce/pad reuse and
    collisions need analysis in the actual chosen-plaintext view.

unblocking_conditions:
  - id: U-J3-LITERAL-GAME
    required: >-
      Supply a new self-contained blind-reviewable literal statement with
      executable public Encrypt and secret Decrypt, message/ciphertext
      domains, actual coins, encodings/equality, validation and failures,
      actual label/potential/KDF formulas and full pp/key generation law.
    acceptance: >-
      An independent reviewer can construct the real complete IND-CPA
      experiment and its public challenge using pp,E only, and can trace
      actual selected-message recovery and all defined failure events.
    remaining: This supplies the game and functionality inputs, not its security proof.
  - id: U-J3-EXTRACTION
    required: >-
      Give an explicit reduction receiving the real EndRing challenge E
      without W_E/path, matching the successful public-key distribution,
      simulating all allowed public/oracle interactions and extracting a
      complete evaluable saturated basis on that E from nonnegligible
      full-scheme IND-CPA advantage.
    acceptance: >-
      Quantify success, polynomial loss, abort/view-distance terms and total
      runtime; certify any path/order/value/evaluator-to-basis conversion;
      demonstrate why the same argument does not infer extraction from the
      public coboundary, constant, smaller-witness or reverse-arrow controls.
    remaining: Quantum-model, active and concrete-security obligations remain separate.
  - id: U-J3-VIEW-ACTIVE
    required: >-
      Specify the complete view and accepted ciphertext language, ordinary
      byte-distinct CCA query rule, repeat-use/nonce behavior, malformed and
      alternate encodings, and all smaller-witness/advice costs.
    acceptance: >-
      Analyze public recovery and exact related-ciphertext relations under
      those rules. If raw XOR is intended, retain its scoped CCA2 failure
      rather than infer active security from correctness or passive security.
    remaining: This review neither chooses nor authorizes an active-security transform.
  - id: U-J3-QUANTUM
    required: >-
      Declare QPT capabilities and every classical versus quantum oracle
      interface; if using a random oracle, define its reversible quantum
      query and allowed simulation/programming. Supply an applicable quantum
      reduction/extraction theorem with explicit loss on the exact distribution.
    acceptance: >-
      The proof states how extraction, rewinding and programming work in
      the chosen model and does not import a classical argument silently.
    remaining: Quantum asymptotics alone do not establish a NIST category.
