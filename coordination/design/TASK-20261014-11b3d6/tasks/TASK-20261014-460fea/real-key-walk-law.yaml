schema: cefc_i_real_key_walk_law_v1
task_id: TASK-20261014-460fea
scope: fixed_length_nonbacktracking_ell_isogeny_walk
parameters:
  p: "Odd prime greater than 3; family and selection algorithm not fixed."
  ell: "Prime different from p; rational ell-kernel lines and edge encodings required for each public parameter."
  L: "Positive integer; d=ell^L."
  E0: "Public supersingular curve over F_(p^2), with scalar p^2-Frobenius so geometric endomorphisms are defined over F_(p^2)."
  W0: "Public complete evaluable saturated rank-four Z-basis (1,alpha2,alpha3,alpha4) of End(E0)."
  graph: "Vertices are canonically encoded F_(p^2)-isomorphism classes; actual subgroup/isogeny edges retain multiplicity, including parallel edges."
mathematical_sampler:
  setup: "Take a valid parameter tuple satisfying the stated predicates; no uniform parameter-generation algorithm asserted."
  keygen_coins: "At step 1 choose uniformly among ell+1 cyclic ell-subgroups; at each later step choose uniformly among the ell outgoing edges other than the dual of the previous edge, after a fixed public ordering of actual edges."
  composite: "phi=phi_L o ... o phi_1:E0->E_L, degree d=ell^L; canonicalize E_L to E and compose the canonical isomorphism into phi."
  endpoint_marginal: "For canonical C, Pr[E=C]=number of supported coin strings ending at C divided by (ell+1)*ell^(L-1)."
  joint_law: "(pp,E,W_E) where W_E is the output of CompleteBasisAtEndpoint(pp,phi,W0), if that required interface is supplied."
  erasure: "Erase phi, intermediate curves, subgroup choices and all path data after producing W_E; no path or orientation is part of sk."
  retries: "None specified; invalid pp rejected before KeyGen. A completion algorithm's failure/retry/tail law is required."
hard_problem:
  adversary_input: "(pp,E) under the above endpoint marginal, with no W_E or walk advice."
  required_output: "A complete evaluable saturated rank-four Z-basis of End(E), with public verification/representation conversion and polynomial bit-size."
  success: "Basis generates all geometric End(E), all listed maps evaluate correctly, and all representation and complexity conditions hold."
  model: "Uniform bit complexity in log(p), ell, L and encoded input length; field work, torsion arithmetic, conversions, retries, memory and preprocessing charged."
first_missing_interface:
  name: CompleteBasisAtEndpoint
  inputs: [pp, phi, W0]
  outputs: "Complete evaluable saturated rank-four W_E of End(E), or a declared failure with bounded probability."
  requirement: "Uniform polynomial bit time and memory for the exact supported walk family; no full-Hom/graph enumeration or retained walk advice."
  status: undefined
  blocked_by: "Integral pushforward gives index d^3 strict suborder; normalized conjugates may be nonintegral."
