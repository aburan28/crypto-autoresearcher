schema: cefc_i_public_statement_v1
task_id: TASK-20261014-460fea
parameters:
  family: "pp=(p,ell,L,E0,W0,canonical_curve_encoding,ordered_actual_edges)"
  predicates: "p>3 prime; ell!=p prime; L>=1; E0/F_(p^2) supersingular with scalar p^2-Frobenius; all selected ell-kernel lines rational; W0=(1,alpha2,alpha3,alpha4) a complete evaluable saturated Z-basis of End(E0)."
  d: "ell^L"
  endpoint_encoding: "Canonical F_(p^2)-isomorphism-class encoding; each actual subgroup/isogeny edge retained with multiplicity."
distributions:
  walk: "First edge uniform on ell+1 actual cyclic ell-subgroups; each subsequent edge uniform on ell actual outgoing edges excluding the preceding dual."
  endpoint: "C=canonical(codomain(phi_L o ... o phi_1)); Pr[C=c]=#{supported coin strings with endpoint c}/((ell+1)*ell^(L-1))."
  key: "(pp,E,W_E), where E is the sampled endpoint and W_E=CompleteBasisAtEndpoint(pp,phi,W0)."
algorithms:
  WalkSample: "Sample the stated edge choices; form phi=phi_L o ... o phi_1 and canonical endpoint E; output (E,phi); erase the path after key completion."
  IntegralPush: "For alpha in End(E0), output phi o alpha o hat(phi) in End(E)."
  TransportSuborder: "For W0=(1,alpha2,alpha3,alpha4), output Z*1 + sum_(i=2)^4 Z*(phi o alpha_i o hat(phi))."
  CompleteBasisAtEndpoint:
    inputs: [pp, phi, W0]
    output_type: "Complete evaluable saturated rank-four Z-basis of End(E)."
    implementation: null
    required_interface: true
  KeyGen: "(E,phi)<-WalkSample(pp); W_E<-CompleteBasisAtEndpoint(pp,phi,W0); output (pk=(pp,E),sk=W_E)."
  EdgeLabel:
    inputs: [pp, actual_edge]
    output_type: "Element of a declared finite additive group G."
    implementation: null
    required_interface: true
  RingPotential:
    inputs: [pp, E, W_E, C]
    output_type: "Element of G."
    implementation: null
    required_interface: true
  Encrypt:
    inputs: [pk, message, coins]
    implementation: null
  Decrypt:
    inputs: [sk, ciphertext]
    implementation: null
representation:
  witness: "Four evaluable endomorphisms generating the full geometric End(E) as a saturated Z-order."
  scalar_normalization: "For alpha in End(E0), (phi o alpha o hat(phi))/d = phi o alpha o phi^(-1) in End(E) tensor Q."
