earliest_exact_obstruction:
  obligation: O1
  kind: missing_polynomial_complete_basis_saturation_and_evaluation_algorithm
  statement: >-
    Given public pp, a supported ephemeral cyclic isogeny phi:E0->E and the
    complete public basis W0 of End(E0), the supplied integral transport
    produces only an index-d^3 suborder, while unconditional normalized
    conjugation can be nonintegral. The next KeyGen call
    CompleteBasisAtEndpoint(pp,phi,W0) has no algorithm, representation,
    verification, polynomial cost or failure law.
  exact_scope: >-
    This is an obstruction to the frozen CEFC-I transport route and packet.
    It is not a lower bound, a proof that saturation cannot be polynomial,
    or a universal nonexistence theorem for EndRing PKE.
  immediate_downstream_blocker: >-
    Even after O1, O2 still needs one explicit nontrivial public zero-
    circulation EdgeLabel and a polynomial complete-ring RingPotential before
    an executable PKE trace or fiber theorem exists.

