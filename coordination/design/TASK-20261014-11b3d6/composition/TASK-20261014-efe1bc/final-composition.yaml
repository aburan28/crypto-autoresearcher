composition_rule:
  voting_used: false
  repair_used: false
  rule: >-
    Copy each frozen sole-owner joint verdict and its scope, normalize only
    enough to expose the O1--O6 conjunction, and never reinterpret a narrow
    obstruction verdict or a correctly open gate as scheme success.
  conjunction: >-
    A surviving PKE requires O1, O2, O3, O4, O5 and O6 all reviewed as
    discharged, followed by separate positive IND-CPA, requested active
    notion, complete-EndRing extraction, novelty, QPT/QROM and NIST
    Category-5 evidence gates.

sole_owner_verdicts:
  J1:
    owner_task_id: TASK-20261014-604885
    source: coordination/design/TASK-20261014-11b3d6/reviews/TASK-20261014-604885/review.yaml
    verdict: holds
    copied_scope: >-
      The scoped naive-transport obstruction holds. For a supported cyclic
      degree-d walk, S=Z*1+d*phi End(E0) phi^(-1) is an integral unital
      suborder of End(E) with exact index d^3, and normalized conjugation is
      not uniformly integral. Returning that transported basis is not a
      complete ring basis.
    open_status:
      O1: open
      O2: open
    vocabulary_guard: >-
      "Holds" validates only the algebraic certificate and the resulting
      missing-interface diagnosis. It does not prove that polynomial
      saturation/completion is unavailable, impossible or hard, and it does
      not discharge O1 or O2.
  J2:
    owner_task_id: TASK-20261014-9ff2ea
    source: coordination/design/TASK-20261014-11b3d6/reviews/TASK-20261014-9ff2ea/review.yaml
    verdict: inconclusive
    copied_scope: >-
      No concrete EdgeLabel, RingPotential, Encrypt or Decrypt exists, so no
      fiber/circulation theorem, actual-message correctness law, quantified
      failure bound, recipient asymmetry or full-ring-necessity theorem can be
      adjudicated. The public-coboundary, constant, path-hash, public-W0 and
      smaller-witness controls reject the known-false implications only under
      their recorded hypotheses.
    open_status:
      O3: open
      O4: open
  J3:
    owner_task_id: TASK-20261014-0754ea
    source: coordination/design/TASK-20261014-11b3d6/reviews/TASK-20261014-0754ea/review.yaml
    verdict: inconclusive
    copied_scope: >-
      The blind public statement has null completion, label, potential,
      encryption and decryption implementations. It therefore supplies no
      real ciphertext law, full adversarial view, IND-CPA advantage bound,
      same-distribution attacker-to-complete-EndRing extractor, quantum
      interface, novelty evidence or concrete security comparison.
    open_status:
      O5: open
      O6: open
    controls: >-
      Public coboundary/constant/smaller-witness/reverse-arrow implications
      are rejected. Raw endpoint-plus-XOR is conditionally IND-CCA2-broken by
      one byte-distinct same-endpoint payload-flip query, but CEFC-I defines no
      Encrypt interface and is not classified as that raw syntax.

normalized_obligation_vector:
  normalization_policy: >-
    Preserve every owner's status. The J1 certificate narrows the first
    missing step but does not promote O1; J2/J3 inconclusive verdicts remain
    open rather than being changed to failure, contradiction or discharge.
  O1:
    status: open
    owner_joint: J1
    basis: >-
      The exact conditional endpoint walk is defined, but no polynomial
      CompleteBasisAtEndpoint implementation, output law, verification,
      representation/cost bound, Setup family or retry/failure law is supplied.
  O2:
    status: open
    owner_joint: J1
    basis: >-
      Only WalkSample, IntegralPush and the strict transported suborder are
      defined. EdgeLabel, RingPotential, Encrypt and Decrypt are null.
  O3:
    status: open
    owner_joint: J2
    basis: >-
      No admitted relation domain, nontrivial label, endpoint-fiber theorem,
      message syntax or quantified correctness/failure statement exists.
  O4:
    status: open
    owner_joint: J2
    basis: >-
      Recipient asymmetry and complete-ring necessity are not established;
      public-base and smaller-witness factorizations are not excluded.
  O5:
    status: open
    owner_joint: J3
    basis: >-
      No exact-law security simulator or attacker-to-complete-evaluable-
      saturated-EndRing extractor, success probability, loss or runtime exists.
  O6:
    status: open
    owner_joint: J3
    basis: >-
      Ciphertext syntax, parsing, malformed/repeated/auxiliary view, oracle
      behavior and classical/quantum query interfaces are undefined.
  conjunctive_result: FAIL

