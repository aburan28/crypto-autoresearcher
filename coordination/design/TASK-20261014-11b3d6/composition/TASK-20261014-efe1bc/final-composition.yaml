  active_security:
    status: not_established
    conditional_control: >-
      Any raw endpoint-plus-XOR instantiation accepting same-endpoint payload
      flips would be IND-CCA2-broken; CEFC-I has no active-security syntax.
  complete_EndRing_basis_reduction:
    status: not_established
    reason: no_attacker_to_complete_basis_extractor_and_reverse_functionality_is_insufficient
  novelty:
