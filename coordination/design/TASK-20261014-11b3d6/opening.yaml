selected_mechanism:
  id: "CEFC-I"
  name: "Concrete conservative endpoint-fiber integral with complete-ring endpoint evaluation"
  scope: "Instantiate the prior fixed-length nonbacktracking public isogeny-walk route on a canonically encoded un-oriented supersingular F_{p^2} multigraph, with one real trapdoor key law, one public additive EdgeLabel, and one RingPotential normalized at the start curve. Auxiliary orientation or hidden walk advice cannot be introduced silently."
  required_pair: "Public EdgeLabel(pp,e) is nontrivial and has zero circulation on every admitted closed walk, including encoding/automorphism identifications. RingPotential(pp,E,W_E,C) computes the same normalized endpoint value in polynomial bit time using only the declared complete evaluable End(E) witness and public endpoint."
  nontriviality: "Provide two supported endpoint/walk witnesses giving distinct encoded sums. A constant/zero label, public endpoint hash, or public coboundary is a control rather than a recipient-asymmetric candidate."
  distribution: "Freeze one exact Setup/TrapCurveGen_ER public marginal, one walk length/edge law and full retry/rejection/failure distribution. Never replace it by uniform curves/endpoints without a separate theorem."
  trace: "Provide a concrete hand-worked executable pseudocode trace using the actual formulas and declared representations, no missing oracles. This is a zero-run proof artifact, not implementation or parameter selection."
frozen_obligations:
  O1:
    name: "Specify the exact hard problem"
    required: "Exact instance sampler, real joint (pp,E,W_E) key law and public marginal, admissible walk/endpoint law, auxiliary data, setup trust/erasure, adversary input, complete evaluable saturated rank-four End(E) output, success predicate, bit-complexity model, representation conversions and named assumptions."
  O2:
    name: "Write every honest-party algorithm"
    required: "Setup, KeyGen, Encrypt and Decrypt with domains, coins, encodings, validation, equality/rejection and failures; explicit WalkSample, public nontrivial EdgeLabel, CompleteEvalBasis and polynomial RingPotential; charge retries, preprocessing, field/bit work, memory and tail bounds. Mathematical existence or exponential graph/Hom enumeration is not a polynomial subroutine."
  O3:
    name: "Prove correctness under the actual distributions"
    required: "Quantify every valid key, allowed message and supported honest walk; prove the zero-circulation/fiber theorem and RingPotential agreement, then actual selected-message recovery under the real key/walk law with explicit failure bounds and exceptional-input handling."
  O4:
    name: "Identify the mechanism that supplies the functionality"
    required: "Identify public sender and exact complete-EndRing-dependent endpoint recovery; list every extra secret and missing lift. Compare the identical public data and all smaller witnesses; full-ring necessity requires an argument against equivalent public, one-evaluator, finite-action, path/cache, compressed and opaque decoder substitutes."
  O5:
    name: "Give the security reduction in the correct direction"
    required: "From a complete-EndRing challenge under the exact real marginal, use a successful IND-CPA attacker on the complete PKE to output a complete evaluable End(E) basis. Specify embedding, distribution match, oracles, extraction, aborts, loss, runtime and all intermediate assumptions; reverse ring-to-decrypt functionality is not this reduction."
  O6:
    name: "Evaluate the complete adversarial view"
    required: "List all public curves, torsion/orientation hints, setup, transcripts, encodings, validation/failure/retry observables and repeated/adaptive queries; evaluate malformed/equivalent ciphertexts, collisions, pad reuse and active malleability; public-data and known-false controls; separate asymptotic, QPT/QROM and concrete parameter security."
security_order:
  first: "PKE IND-CPA with advantage abs(Pr[b'=b]-1/2), exact equal-length message challenge, complete view, no decryption oracle."
  active_screen: "Analyze malformed/equivalent ciphertexts, endpoint-preserving payload transformations, pad reuse and raw CCA1/CCA2/NM boundaries. Do not repair by a transform in this batch."
  complete_EndRing_extraction: "Challenge E under the real key marginal -> successful full-scheme attacker -> complete evaluable saturated rank-four End(E) basis. W_E -> decryption is the reverse functionality direction."
  QPT_QROM: "Separate unestablished gate with declared query access, simulation, extraction/programming and quantitative quantum loss."
  NIST_Category_5: "Separate unestablished gate requiring inspected normative target, matched complete classical/quantum attack portfolio, reduction loss, preprocessing/online/memory/hardware/targets/failure accounting, parameters and measured evidence; no parameter selection in this batch."
stop_rule: "Stop after one concrete packet or the earliest exact distribution, typing, circulation/fiber, public/smaller-witness, correctness, simulator or extraction obstruction. Missing objects must be recorded as missing, not replaced by their names. No implementation, scientific trials, formalizer, benchmark, parameter-selection, security claim or automatic successor."
earliest_obstruction_requirements: "Name the first failed O1-O6 gate, exact family/quantifiers and proof or missing interface, downstream dependency and checkable unblocking condition. Reuse/link problems/eigenx-cest-endring-reduction-not-established.md when applicable; a new obstruction record requires a separately authorized disjoint task. No universal nonexistence inference."
nonduplication:
  - "No R_CER, external-XWE/DXWE, xO or Naor-Yung wrapper."
  - "No prescribed-path/torsion, CEST/EvalLine, complete-Hom enumeration or public-conjugation rewrap."
  - "Existing routes may appear only as exact nearby-object and method-ceiling controls."
