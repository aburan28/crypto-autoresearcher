joint_result:
  verdict: breaks
  breaking_step: >-
    The decryption-oracle simulation replaces real Dec, which decrypts both
    components and rejects on bottom, wrong length, or unequal plaintexts,
    with decryption under only the independently sampled known witness. The
    producer assumes only an epsilon_DX honest core correctness error and does
    not require pointwise or adversarial-coin correctness for every ciphertext
    admitted by L_EQ. A valid true-statement query can therefore make the
    simulator return the known component's message while real Dec returns
    bottom because the embedded unknown component fails or disagrees. The
    displayed IND-CCA2 bound has neither a robust-correctness game nor a
    q_D-scaled simulation-error term. Thus the asserted generic hybrid does
    not follow from the stated assumptions.
  evidence:
    - >-
      candidate.md section 6 defines real Dec to run both DX.Dec calls and
      compare their outputs byte-for-byte.
    - >-
      candidate.md section 7 and scheme-contract.yaml O5 say a true equality
      query is answered using W_(1-i), but do not reproduce the unknown-side
      bottom/length/equality decisions.
    - >-
      scheme-contract.yaml O3 gives only 2*epsilon_DX in honest round-trip
      correctness; it does not quantify over adversarially selected L_EQ
      witnesses (m,r_0,r_1), and the proposed CCA bound contains no q_D
      robustness loss.
  countermodel_shape: >-
    Start from an otherwise secure core and reserve a negligible subset of
    encryption coins on which a syntactically valid encryption decrypts to
    bottom for one accepted witness. Uniform honest encryption preserves a
    negligible epsilon_DX, while an adversary can choose those coins in an
    L_EQ witness. Pair that component with a normally decrypting encryption of
    the same message and prove the true L_EQ statement. Real Dec returns
    bottom; the one-witness simulator returns the message. This does not claim
    an implementation attack on an instantiated core; it shows that the
    assumptions as written are insufficient for the claimed transform proof.
  minimum_repair: >-
    Require perfect pointwise core correctness and witness-independent
    decryption for every valid setup, accepted R_CER witness, fixed-length
    message and encryption coin string whose Enc call returns a ciphertext;
    or define and prove an adversarial valid-ciphertext robustness game and
    add the exact q_D-scaled loss to the IND-CCA2 theorem. Then provide the
    complete hybrid sequence showing that simulated and real decryption
    responses coincide under that property.

transform_audit:
  independent_core_keys:
    status: conditionally_holds
    assessment: >-
      KeyGen calls TrapRingGen independently for x_0,W_0 and x_1,W_1 and
      independently samples ep_0 and ep_1. This is the required two-key
      structure: when x_i is externally embedded, W_(1-i) is available for
      oracle simulation. One x with two setup strings would not provide it.
    open_obligation: >-
      Any non-negligible collision or correlation in the concrete D_ER/K0 law
      must be included in the exact auxiliary distribution or charged as an
      abort; K0 and that law remain uninstantiated.
  equality_language:
    status: conditionally_holds
    assessment: >-
      L_EQ binds exact canonical pk_bytes, c_0 and c_1 and requires a single
      fixed-length m with explicit coins r_0,r_1 that reproduce both core
      ciphertext byte strings. This blocks cross-key and component splicing
      at the abstract relation level.
    limitation: >-
      The claim is conditional on DX.Enc being a total deterministic
      computation once its explicit coins are fixed and on all involved
      encodings having a unique parse.
  challenge_definition:
    status: holds_at_abstract_game_level
    assessment: >-
      The game excludes only the exact complete challenge ciphertext bytes.
      Same component bytes with a different proof, related components,
      alternate attempted encodings, malformed strings, and cross-key strings
      remain legal oracle queries. This is the strong exact-byte CCA2 boundary
      required by the repository contract.
  alternate_proof_bytes:
    status: conditional_on_exact_strong_property
    assessment: >-
      A query (pk_bytes,c_0*,c_1*,pi') with pi' different from the challenge
      proof is legal. If accepted, real Dec returns the challenge message. In
      the false-equality hybrid this is a new accepting proof for the same
      previously simulated false statement. Therefore ordinary soundness, or
      simulation soundness that excludes previously simulated statements, is
      insufficient. The producer correctly names strong unbounded simulation
      soundness with same-false-statement/new-proof resistance. That exact
      byte-level property, or simulation-sound extractability for every fresh
      proof, is load-bearing.
    open_obligation: >-
      Supply the formal NIZK game, exact proof-string freshness rule,
      auxiliary-input scope, query bound, advantage, SimSetup output, and
      reduction F. No concrete proof system or theorem providing this exact
      property for L_EQ is selected.
  component_splicing:
    status: conditional_on_L_EQ_and_sUSS
    assessment: >-
      A splice under another key fails the embedded pk_bytes comparison. A
      splice of unequal plaintexts is a false L_EQ statement and must be
      rejected except with sUSS advantage after the simulated challenge. A
      true same-plaintext splice is safe only when the decryption simulation
      reproduces real two-component failure behavior; that is exactly where
      the robust-correctness break occurs.
  decryption_equality_check:
    status: honest_correctness_feature_but_reduction_break
    assessment: >-
      Computing both plaintexts and requiring fixed length and byte equality
      is conservative for real decryption and prevents silently returning one
      malformed component. It creates a simulation obligation that the
      one-witness reduction does not discharge under average correctness.
  replay:
    status: conditionally_holds
    assessment: >-
      Exact challenge replay is excluded. Re-encoding is rejected only if the
      complete parser is canonical; a different proof on the same components
      is not treated as replay and is delegated to strong same-statement sUSS.

malformed_and_encoding_audit:
  outer_framing:
    status: specified_abstractly
    present:
      - versioned tags and fixed-width length prefixes
      - minimal signed integer encoding
      - fixed-width reduced field coefficients
      - canonical curve and point encodings
      - rejection of duplicates, inconsistent lengths, trailing bytes and over-cap inputs
      - exact ciphertext-byte equality
  parser_totality:
    status: not_established
    gap: >-
      No complete byte grammar or parser algorithm is supplied for ep_i,
      core ciphertexts c_i, crs, NIZK proofs pi, or every nested failure path.
      The packet asserts a public polynomial cap and deterministic rejection
      but does not define tag values, length ranges/cap formulae, NIZK/core
      canonicalization, overflow behavior, or total Verify/Dec behavior on
      every admitted byte string. Thus O6's malformed-input coverage remains
      open and cannot be upgraded from abstract syntax to an exact parser.
  required_behavior:
    - >-
      Parse and bound the outer frame before allocation or primitive calls;
      every parse/validation failure returns the single bottom symbol.
    - >-
      Require canonical re-encoding equality for pk, ep, crs, c_i and pi;
      verifier normalization must not create alternate accepted byte strings
      outside the sUSS proof-freshness game.
    - >-
      Make N.Verify and DX.Dec total on their bounded input domains and define
      wrong-version, truncated, duplicate, overlong and trailing-byte cases.
  formal_model_boundary: >-
    Timing, allocation, cache, power, fault, erasure and denial-of-service
    observables are explicitly excluded. Deterministic bottom in the abstract
    game does not establish constant-time or resource-safe implementation
    rejection.

setup_crs_and_erasure_audit:
  real_setup:
    status: conditionally_specified
    assessment: >-
      KeyGen samples one real CRS per public key, independently of the two K0
      and two DX setups, embeds it in canonical pk bytes, and requires erasure
      of setup coins plus all K0 auxiliary trapdoors. No simulator trapdoor is
      present in a real key.
  simulated_setup:
    status: not_formally_discharged
    gap: >-
      The artifacts do not give the exact RealSetup/SimSetup indistinguishability
      game, SimProve oracle syntax, trapdoor erasure boundary, or auxiliary
      distributions for the reduction. EI-DXWE says real- and simulated-CRS
      auxiliaries are covered, but the complete hybrid and its quantifiers are
      not written.
  trust_boundary: >-
    This is a CRS-model conditional claim, not a transparent-setup or
    subversion-resistant claim. Concrete CRS generation, validation and toxic
    waste handling remain open.

correctness_audit:
  honest_union_bound:
    status: conditionally_valid
    bound: 2*delta_K0 + 2*epsilon_DX + epsilon_N
    assessment: >-
      As an average honest round-trip union bound, the expression accounts for
      two K0 attempts, two core decryptions and proof completeness, assuming
      those primitive error variables are defined over the stated experiment.
  unsupported_strengthening: >-
    The claim that the same epsilon bound holds for every returned valid key
    is not justified unless primitive correctness is pointwise/per-key rather
    than average over setup. More importantly, honest random-coin correctness
    does not supply the adversarial valid-ciphertext robustness required for
    q_D decryption queries.
  effect_on_theorem: >-
    The current IND-CCA2 advantage display omits the resulting oracle-simulation
    error. Parser determinism contributes zero only after total canonical
    parsing is actually part of the formal algorithms.

primary_source_check:
  source: >-
    Ronald Cramer, Dennis Hofheinz and Eike Kiltz, A Twist on the Naor-Yung
    Paradigm and Its Application to Efficient CCA-Secure Encryption from Hard
    Search Problems, TCC 2010.
  local_copy: /tmp/cramer-hofheinz-kiltz-2010.pdf
  sha256: 6a6a1e1fda8deb6e7cda57ff8c40a7b8bbaf8801a853daba25bb9e36868a112c
  inspected_scope: Introduction, sections 2.2, 5 and 6, especially Theorem 3 and its decapsulation-query simulation.
  source_supports:
    - independent replication plus a consistency proof
    - exact challenge-ciphertext exclusion
    - rejection of malformed/non-language ciphertexts before decapsulation
    - simulation using an available independent secret/trapdoor
  source_does_not_support:
    - the generic EI-DXWE PKE theorem stated by this producer
    - the producer's strong unbounded-simulation-sound NIZK definition
    - the displayed multi-assumption advantage bound
    - average-error core correctness as sufficient for one-component oracle simulation
  relevant_delta: >-
    CHK's concrete construction uses a specialized trapdoor language and a
    unique hash proof; its proof derives equality with the challenge from
    c=c* and uniqueness of valid proofs. It is not a source-level discharge
    for arbitrary NIZK proof bytes or this two-DXWE-component Dec algorithm.

proves_too_much_control:
  id: PTM-J4-UNBOUND-DOUBLE-ENCRYPTION
  known_false_conclusion: Double encryption without a binding simulation-sound proof is IND-CCA2.
  result: known_false_conclusion_rejected
  control_status: passes
  worked_attack: >-
    Mutate the proof layer so Verify accepts proof bytes not strongly bound to
    exact (pk_bytes,c_0,c_1), or so a different accepted proof encoding can be
    generated for the challenge components. The adversary submits the exact
    challenge pk and component bytes with the alternate proof. This byte string
    is not the excluded challenge ciphertext, yet real Dec decrypts both
    components to m_b and returns it, giving the challenge bit with certainty.
  first_failure_in_unbound_argument: >-
    The oracle simulator cannot classify the alternate-proof query as an
    excluded replay or a true independently decryptable query. In the
    false-statement hybrid, only strong same-statement/new-proof simulation
    soundness (or extractability) can reject it.
  effect_on_joint: >-
    The producer correctly keeps this control from proving too much by naming
    full-key binding, canonical bytes and strong same-statement sUSS. Passing
    this control does not repair the separate robust-correctness break.

optional_kem_dem:
  status: not_claimed_and_not_established
  assessment: >-
    The frozen contract is PKE, sets key_space to null, and explicitly gives
    no KEM/DEM layer. No KEM real-or-random game, KDF, DEM authentication,
    implicit-rejection rule, or composition theorem may be inferred from this
    review. Any later layer needs a separately stated transform and assumptions.

established_vs_conditional:
  established_in_this_review:
    - the four reviewed producer artifact hashes match the frozen receipt
    - the exact-byte challenge rule permits same-components/different-proof queries
    - plain unbound double encryption fails the required CCA oracle simulation
    - the current one-witness simulation does not reproduce real two-component failure behavior under the stated correctness definition
  conditional_only:
    - two-key Naor--Yung architecture under independent K0/DX setup
    - L_EQ full-key and component binding
    - alternate-proof protection under a formally defined strong same-statement sUSS or extractable NIZK
    - deterministic canonical malformed-input rejection
    - real/simulated CRS hybrid and erasure
  not_established:
    - the displayed generic classical IND-CCA2 bound
    - a concrete total byte parser or concrete NIZK/core instantiation
    - optional KEM/DEM security
    - implementation, side-channel, multi-user, quantum, concrete-security, practicality or deployment claims

obligation_effects:
  O2: >-
    Remains open: exact primitive parsers, CRS validation and total failure
    behavior are not instantiated.
  O3: >-
    Honest correctness remains a proposed conditional union bound; pointwise
    per-key correctness and adversarial valid-ciphertext robustness are open.
  O5: >-
    The proposed IND-CCA2 transform reduction breaks at decryption-oracle
    simulation under the assumptions as written. This review does not assess
    EI-DXWE extraction or the EndRing arrow owned by J2.
  O6: >-
    Remains open: malformed primitive encodings, exact sUSS game, CRS setup
    details and implementation observables are not discharged.

narrowest_supported_statement: >-
  The frozen packet gives the recognizable abstract skeleton of a two-key
  Naor--Yung transform and correctly identifies full-key equality binding and
  strong same-statement simulation soundness as necessary for exact-byte
  CCA2. It does not yet establish its displayed classical IND-CCA2 theorem:
  a robust core-correctness condition needed to simulate valid adversarial
  decryption queries is missing, and primitive parser/CRS details remain
  abstract. This is a scoped break of J4, not an impossibility result for
  Naor--Yung, EI-DXWE, EndRing PKE, or the full candidate.

open_obligations:
  - >-
    State and prove perfect pointwise DX correctness, or an adversarial
    valid-ciphertext robustness game, across every accepted R_CER witness and
    every L_EQ coin string; revise the loss with q_D and all abort terms.
  - >-
    Write the complete real/simulated CRS and challenge hybrid sequence,
    including the exact handling of same-components/different-proof queries.
  - >-
    Formalize strong unbounded simulation soundness or simulation-sound
    extractability with byte-level proof freshness, auxiliary input, query
    bounds, runtime and advantage.
  - >-
    Supply total canonical parsers and validators for pp, pk, sk, ep, crs,
    core ciphertexts, proofs and outer ciphertexts, with every malformed path
    returning the single bottom symbol.
  - >-
    Define CRS trust, generation, validation, simulation-trapdoor custody and
    erasure for any concrete instantiation.
  - >-
    Keep optional KEM/DEM composition unclaimed until its own game,
    rejection behavior, DEM assumptions and composition theorem are supplied.

next_concrete_action: >-
  Amend the conditional transform statement with pointwise/robust DX
  correctness and a formal exact-byte sUSS game, then give a line-by-line
  hybrid that couples real two-component Dec to the one-witness simulator for
  all q_D queries. Re-review J4 against a complete parser/CRS specification;
  do not promote a CCA or KEM/DEM security label before that review.

