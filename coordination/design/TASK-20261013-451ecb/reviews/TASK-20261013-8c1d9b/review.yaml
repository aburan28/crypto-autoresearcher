  joint_assessments:
    - joint: J1
      title: R_CER algebra, certificate verification and correctness
      status: inconclusive
      no_vote_scope: >-
        This is the verdict on J1 alone. No whole-claim verdict, concurrence,
        majority assessment, or inference about J2--J5 is rendered.
      claim_tested: >-
        The frozen packet gives a polynomial-time verifier and decoder for a
        complete efficiently evaluable saturated rank-four basis of End(E),
        and the honest PKE algorithms recover the exact selected message with
        error at most 2*delta_K0+2*epsilon_DX+epsilon_N on the stated real-key
        distribution.
      decisive_result: >-
        Conditional on a fully specified gate verifier whose circuits are
        genuine homomorphisms, whose derived duals are correct, and whose
        DegUB values are certified upper bounds, the torsion-equality lemma,
        closure/trace argument, rank-four check, discriminant p^2 test, and
        index-one conclusion are sound. The abstract-order negative control is
        rejected at the first typing gate. The packet nevertheless leaves the
        primitive gate certificates, dual construction, coefficient-field and
        torsion-field embeddings, total extension-degree cap, and exact DegUB
        algorithms at descriptive rather than verifier-algorithm level. It
        also states a per-returned-key correctness bound without requiring
        pointwise correctness/completeness for each fixed EI-DXWE setup string
        and NIZK CRS. Therefore the complete polynomial verifier and that
        per-key quantifier are not established; J1 cannot be marked holds.

      typed_endomorphism_map_circuits:
        status: inconclusive
        established_conditionally:
          - >-
            Identity, negation, integer scalar multiplication, normalized
            isomorphisms, separable isogenies, Frobenius maps, composition,
            and pointwise addition/subtraction preserve the homomorphism type
            when their primitive gates and source/target fields are valid.
          - >-
            Requiring identical source and target for addition and matching
            intermediate curves for composition is the right typing rule.
          - >-
            An arbitrary program or abstract quaternion element is excluded
            from the circuit grammar.
        missing_verifier_definition:
          - >-
            No exact parser/checker is given for a normalized isomorphism and
            its inverse, a certified kernel and its claimed normalized Velu
            codomain, or the exceptional inputs of these gates.
          - >-
            A Frobenius gate carries a typed Verschiebung/dual descriptor, but
            the packet does not say what certificate proves that descriptor is
            the actual dual or how the verifier constructs and evaluates it.
          - >-
            The recursive dual operation is asserted, not specified gate by
            gate, including the concrete field/coefficient representation of
            dual isogenies and Verschiebung.
          - >-
            Circuits and torsion points may live over encoded extensions, but
            the packet does not define canonical embeddings into a common
            evaluation field or cap the total compositum/tower degree. Bounds
            on each separately written extension degree do not alone bound a
            tower product.
        consequence: >-
          Until these algorithms and bounds are fixed, type checking does not
          yet establish that every accepted C_i is an efficiently evaluable
          geometric endomorphism E->E on every point used by the verifier.

      dual_degree_and_equality_checks:
        status: holds_conditionally
        derivation:
          - >-
            For a genuine elliptic-curve homomorphism alpha, the canonical
            dual satisfies dual(alpha) compose alpha=[deg(alpha)]. Therefore
            an actual map equality to [d_i], together with d_i>=0, pins d_i to
            deg(C_i); the embedding Z->End(E) is injective even in
            characteristic p.
          - >-
            The degree norm obeys sqrt(deg(A+B)) <= sqrt(deg(A))+
            sqrt(deg(B)); hence the stated addition/subtraction recurrence is
            conservative if its children are conservative. Composition
            multiplies degrees and dual preserves degree.
        unresolved: >-
          The packet says primitive gates have their standard bounds but does
          not define the exact integer DegUB algorithm or certificates for
          every primitive and derived dual. The later torsion proof is sound
          only after this missing premise is made checkable.

      torsion_equality_certificate:
        status: holds_conditionally
        derivation: >-
          For an asserted A=B let delta=A-B. The recursive bound gives
          deg(delta)<=B_Q. Agreement on two independent order-ell points whose
          Weil pairing has order ell makes delta vanish on E[ell]. For the
          square-free product N_Q of the selected distinct primes, vanishing
          on every E[ell] implies vanishing on E[N_Q]. If delta is nonzero,
          the separable subgroup E[N_Q] lies in its kernel, so delta factors
          through [N_Q] and N_Q^2 divides deg(delta). This contradicts
          deg(delta)<=B_Q<N_Q^2. Thus delta=0.
        exact_checks_required:
          - reject ell=p and prove every enumerated ell prime
          - verify the extension field and the embedding of every map coefficient
          - verify both points lie on E, are nonzero, and are killed by ell
          - verify the Weil pairing is nontrivial; for prime ell this gives exact order ell
          - evaluate both sides on both points without exceptional or undefined branches
        boundary: >-
          The lemma certifies equality only because the maps are already
          certified homomorphisms and B_Q is already a valid degree bound. It
          cannot repair an invalid gate, dual descriptor, field embedding, or
          underestimated degree.

      bound_and_small_prime_suite:
        status: proposed_polynomial_not_fully_specified
        derivation: >-
          The primorial grows exponentially in its largest prime, so the first
          primes needed for N_Q^2>B_Q have largest ell and total count
          polynomial in log(B_Q). Full E[ell] is rational over an extension
          whose degree divides the order of Frobenius in GL_2(F_ell), at most
          |GL_2(F_ell)|, which is polynomial in ell. Irreducibility, point,
          scalar, pairing, and circuit evaluations are polynomial in the
          explicitly encoded field and circuit lengths.
        open_obligations:
          - >-
            Put the prime-size, common-extension degree, coefficient embedding,
            and total encoded-length caps into the actual instance grammar as
            computable functions, rather than stating that they are
            polynomially bounded.
          - >-
            Prove the concrete verifier never constructs an unencoded
            compositum or tower whose degree is the product of individually
            bounded gate-field degrees.
          - >-
            State deterministic failure behavior for invalid irreducibility,
            embedding, torsion, pairing, and gate-evaluation certificates.

      closure_trace_rank_and_discriminant:
        status: holds_conditionally
        derivation:
          - >-
            Exact closure C_i*C_j=sum_k a_ijk*C_k and C_0=id make
            O=sum_i Z*C_i a unital subring of End(E). The verified identities
            alpha+dual(alpha)=[t_ij] make T=(t_ij) the reduced-trace Gram
            matrix Trd(C_i*C_j).
          - >-
            det(T)!=0 proves the four C_i are Q-linearly independent, so O is
            a rank-four order. The separate rank test is redundant once
            abs(det(T))=p^2, but harmless.
          - >-
            For a supersingular E in characteristic p, the geometric End(E)
            is a maximal order in B_(p,infinity) and its trace discriminant has
            absolute value p^2. Since O is a full-rank suborder,
            disc(O)=[End(E):O]^2*disc(End(E)). The accepted determinant p^2
            forces index one, hence O=End(E).
        scope: >-
          This conclusion concerns the geometric endomorphism ring represented
          by the admitted extension-field maps. It depends on the verifier
          actually establishing the map equalities and the supersingularity of
          the nonsingular curve.

      supersingularity_and_curve_validation:
        status: holds_at_algorithmic_fact_level
        derivation: >-
          For E over F_(p^2), p>3, E is supersingular exactly when p divides
          its F_(p^2)-Frobenius trace. Deterministic polynomial-time primality,
          nonsingularity, finite-field validation, and Schoof-style point
          counting exist.
        limitation: >-
          The packet names but does not instantiate these subroutines or their
          canonical encodings; the producer also labels the supporting
          point-counting source as not newly inspected. This is not a
          mathematical counterexample, but it remains part of the missing
          executable verifier specification.

      certificate_decoder:
        status: holds_conditionally_by_projection
        decoder: >-
          Decode_CER(x,W) first runs Verify_CER(x,W); on rejection it returns
          bottom, and on acceptance it returns the ordered circuit basis
          (C_0,C_1,C_2,C_3) with the circuit evaluator. This is linear-time
          projection after verification.
        output_argument: >-
          The preceding closure, rank, trace-discriminant, and index-one proof
          makes this tuple a complete basis of End(E), not merely the abstract
          order or the torsion tables. Different accepted bases are equivalent
          solutions; canonical basis bytes are unnecessary.
        open_obligation: >-
          The producer never states this decoder as an algorithm with an exact
          output encoding and failure grammar, and its claimed polynomial
          evaluator inherits every unresolved primitive-gate, dual, and field-
          embedding issue above.

      honest_actual_message_correctness:
        status: conditional_average_bound_holds_per_key_bound_not_established
        rederivation: >-
          Condition on KeyGen returning two witnesses accepted by Verify_CER.
          For a fixed allowed message m, if both EI-DXWE correctness events
          hold and NIZK completeness holds, the proof verifies, each component
          decrypts to the exact bytes m, the length and equality tests pass,
          and Dec returns m. A union bound gives conditional failure at most
          2*epsilon_DX+epsilon_N. Counting either of two K0 failures as overall
          correctness failure adds at most 2*delta_K0, yielding the displayed
          average bound. The recovery target is the selected message itself,
          not an orbit, invariant, or confirmation bit.
        quantifier_defects:
          - >-
            The per-returned-key sentence fixes ep_0, ep_1, and crs. It follows
            only if epsilon_DX and epsilon_N are pointwise bounds for every
            setup string/CRS in the returned-key support. The packet states
            correctness/completeness errors without those pointwise
            quantifiers; ordinary correctness averaged over Setup does not
            imply the asserted per-key bound.
          - >-
            The unconditional probability expression uses pk and sk even when
            KeyGen returns failure. It must explicitly define that branch as a
            failed correctness event or state the theorem conditioned on
            successful KeyGen.
          - >-
            epsilon_DX must cover every Enc failure, Dec rejection, and wrong-
            message event under the exact setup/message/coin distribution; the
            abstract interface currently does not spell out that probability
            space.
        real_distribution_boundary: >-
          K0 is explicitly unresolved. Thus the displayed statement is a
          conditional theorem schema, not established correctness of a
          concretely generated real-key scheme.

      proves_too_much_control:
        id: PTM-J1-ABSTRACT-ORDER
        known_false_conclusion: >-
          An abstract quaternion order with no evaluable maps is a complete
          R_CER witness.
        result: rejects_as_required
        first_failure: >-
          Verify_CER step 2 cannot parse four typed E->E map circuits or derive
          their duals/evaluators. An abstract multiplication table, trace form,
          or maximal-order discriminant is not a circuit and therefore never
          reaches the torsion, closure, rank, or discriminant checks.
        control_interpretation: >-
          The control confirms that the relation syntax does not prove too
          much at this boundary. It does not fill the missing concrete gate
          verifier for witnesses that do carry circuit-like encodings.

      requirement_status:
        - requirement: typed endomorphism-map circuits and primitive certificates
          status: partial
          evidence: The grammar has the right abstract types but omits exact gate, dual, field-embedding, and exceptional-input verification.
        - requirement: dual/degree, closure, trace, and equality-on-torsion checks
          status: conditional
          evidence: The algebraic implications are valid once map semantics and conservative DegUB values are certified.
        - requirement: bound and small-prime torsion suite
          status: partial
          evidence: A polynomial suite exists in principle; the common-field and total-degree encoding contract is unfinished.
        - requirement: rank four, discriminant p^2, maximality and index one
          status: verified_conditional
          evidence: The trace-discriminant index formula gives End(E) exactly after the map equalities are established.
        - requirement: polynomial verifier and certificate decoder
          status: partial
          evidence: Projection is a decoder, but the executable verifier/evaluator specification and total field bounds are incomplete.
        - requirement: actual-message correctness on the real distribution
          status: conditional_with_quantifier_repair
          evidence: The average union bound and exact-message result rederive; K0 is unresolved and the claimed per-key bound needs pointwise primitive guarantees.

      narrowest_supported_statement: >-
        If the missing canonical gate/dual/field verifier is supplied with
        certified conservative degree bounds and polynomial total extension
        size, every accepted R_CER witness decodes to an efficiently evaluable
        rank-four basis of the geometric End(E). If K0 and the abstract
        primitives additionally satisfy the exact average correctness games,
        the honest PKE returns the selected message with average failure at
        most 2*delta_K0+2*epsilon_DX+epsilon_N. No concrete real-key sampler,
        per-fixed-key bound, or complete executable verifier is established by
        the frozen packet as written.

      exit_criteria:
        - >-
          Freeze the byte grammar and deterministic verifier for every
          primitive gate, dual circuit, degree bound, coefficient-field
          embedding, common evaluation field, exceptional input, and total
          extension/tower degree; prove its runtime polynomial in the encoded
          instance and witness lengths.
        - >-
          Add Decode_CER with exact output/failure encoding and show that each
          returned circuit evaluator meets the EndRing solution representation.
        - >-
          State EI-DXWE and NIZK completeness quantifiers precisely. Either
          require pointwise bounds for every returned setup/CRS and retain the
          per-key claim, or remove that claim and keep only the correctly
          averaged theorem.
        - >-
          Define the correctness experiment on KeyGen failure and instantiate
          or continue to label K0 and every primitive error as open.

