  primary_source_audit:
    - id: bellare_hoang_2015
      path: /tmp/bellare-hoang-2015.pdf
      revision: Springer conference version, DOI 10.1007/978-3-662-46447-2_14, 24 pages
      sha256: 2a31f72cccb5d8c671b995a771106db7fed6c85e36389878cfbe96a3936bace7
      inspected_scope: Section 3 NP/WE syntax, SS and AS definitions and Theorem 3; XS discussion, Figure 9, and Proposition 6 on pages 324-325
      finding: >-
        Ordinary SS/AS security concerns false statements. XS covers all instances but lets
        the adversary choose the instance and does not supply the producer's exact externally
        sampled auxiliary string. The conference version only points to the full version for
        the xO implication. It does not instantiate EI-DXWE or prove the required exact-auxiliary
        extractor theorem.
    - id: garg_gentry_halevi_wichs_2014
      path: /tmp/aux-ewe-implausibility.pdf
      revision: Springer version of record, DOI 10.1007/978-3-662-44371-2_29, 18 pages
      sha256: c2db9fde2d756c18d50f7141be4c2997b7c988e7f95e4ed695c3b2a61736058f
      inspected_scope: Section 2 Definitions 1-3, Section 6 Theorem 3, and Section 7
      finding: >-
        The sampled (x,aux) formulation is directly relevant. Theorem 3 rules out a
        general-purpose auxiliary-input EWE under its conjecture; it is not an unconditional
        impossibility for every restricted relation-specific exact distribution. It therefore
        raises a serious plausibility burden but neither refutes nor supplies EI-DXWE.
    - id: cramer_hofheinz_kiltz_2010
      path: /tmp/cramer-hofheinz-kiltz-2010.pdf
      revision: Springer conference version, DOI 10.1007/978-3-642-11799-2_10, 19 pages
      sha256: 6a6a1e1fda8deb6e7cda57ff8c40a7b8bbaf8801a853daba25bb9e36868a112c
      inspected_scope: introduction; Section 2 KEM syntax and exact C != C* oracle condition; Sections 5-6 specialized HPS/algebraic KEM theorem and simulation
      finding: >-
        This source supports the Naor-Yung-style architectural/oracle precedent only. It does
        not provide a generic EI-DXWE plus strong-USS-NIZK theorem, a concrete instantiation,
        or the claimed reduction loss.
    - id: panny_wesolowski_2024_vor
      path: /tmp/pw24-vor.pdf
      revision: Springer version of record, DOI 10.1007/978-3-031-58751-1_14, 30 pages
      sha256: 55c054a8b4e75041fc2aef62438ac1bd5071f34fec7dea298bafecd6a62280ff
      inspected_scope: Section 2.4 Definition 2.1 and Proposition 2.3; Section 2.5 Problems 2.4-2.6; Section 7 Algorithm 3 and Theorem 7.2; Section 8.3 Proposition 8.5 and Theorem 8.6; Section 8.4
      finding: >-
        The paper supports efficient representations and Divide for an already represented
        endomorphism, and gives EndRing/Isogeny reductions in the stated directions and
        conditions. It does not instantiate K0, R_CER sampling, EI-DXWE, or a PKE decoder.
        Consequently complete-EndRing search hardness alone is not the PKE theorem.
    - id: panny_wesolowski_2024_extended
      path: coordination/tasks/TASK-20260724-P13-REV-R1/evidence/pw24_published_hal.pdf
      revision: 54-page extended HAL copy; Proposition 8.4 and Theorem 8.5 numbering
      sha256: 97d80b8ef7cd6c5665944a9273c1cce3842213f21b1b28b377365d7cd1b70f28
      inspected_scope: corresponding EndRing/Isogeny and representation passages used to reconcile numbering with the version of record
      finding: >-
        The producer ledger documents the numbering reconciliation. The cited mathematical
        boundary is consistent, but VOR metadata must not be represented as the extended
        document's pagination or numbering.
    - id: seta
      path: /tmp/seta-hal-03471926v1.pdf
      revision: HAL v1 author manuscript, 33 pages
      sha256: e68fa5871be93bc031b5c68773b7bf1317c8033ebf917613c327aa73d6a309cd
      inspected_scope: Sections 2.4, 3.4-3.5, Section 4.2 and Algorithm 3
      finding: >-
        Seta's M=1 construction needs the action of theta on E[N]; its public-key/ciphertext
        objects and finite trapdoor differ materially from an R_CER witness consumed by
        DXWE. Algorithm 3 does not output the candidate's complete four-map evaluator basis.
    - id: festa
      path: /tmp/festa-vor.pdf
      revision: Springer version of record, DOI 10.1007/978-981-99-8739-9_4, 29 pages
      sha256: 99c978e4a9765e7b5d8213f5bfd1e2f1f5a6ed4ae131572766b0f2d1f8747491
      inspected_scope: introduction, Section 3 trapdoor, Section 5 PKE, and Section 7.3 costs
      finding: >-
        FESTA uses a secret isogeny/trapdoor, scaled torsion public key, and two-isogeny plus
        scaled-torsion ciphertext; its OAEP/QROM and separate standard-model transform differ
        materially from the candidate. Its concrete numbers cannot be transferred to an
        uninstantiated EigenX-v3. FESTA was omitted from the producer's comparison, so this
        review supplies only the scoped direct comparison, not a universal novelty result.
    - id: sigamal
      path: /tmp/sigamal-vor.pdf
      revision: Springer version of record, DOI 10.1007/978-3-030-64834-3_19, 30 pages
      sha256: b58a63807dc95cf63f36af671444889791920908020541bd82e315067b324061
      inspected_scope: Sections 3.2-3.3 and 4.1-4.2
      finding: >-
        SiGamal uses a class-group action plus a point, recovers plaintext with
        Pohlig-Hellman, and proves IND-CPA under P-CSSDDH; the source expressly notes
        malleability and lack of IND-CCA. It is materially different from the candidate.
    - id: supersingular_key_updatable_pke
      path: /tmp/upke-vor.pdf
      revision: Springer version of record, DOI 10.1007/978-3-030-99277-4_22, 22 pages
      sha256: 66c77e4fb4c82ce4adb0620ad835f68eaebc629b6ca9c11d394a5c2344af2f52
      inspected_scope: Sections 3-6, including the CSIDH construction, KDF/DEM, and key updates
      finding: >-
        This is a different primitive and mechanism. The DOI's actual title is "Towards
        Post-Quantum Key-Updatable Public-Key Encryption via Supersingular Isogenies"; the
        inherited record calling it unidirectional proxy re-encryption is bibliographically
        incorrect even though the DOI and content are the intended source.
    - id: lit_sigamal
      revision: ePrint 2024/521 landing metadata plus attempted Springer DOI 10.1007/978-981-95-5113-2_9
      inspected_scope: landing-page title, abstract, publication metadata, and response-content validation only
      impediment: >-
        Full text was not retrievable and was not inspected. /tmp/lit-landing.html is a
        15,241-byte landing page (sha256
        1028c93e418f8e358fe777f709396b24c301f814b8ef18cbabb732ac973dea2c), reporting
        ePrint publication year 2024 and modification 2025-09-03T01:53:57Z. The ePrint PDF
        endpoint repeatedly returned HTTP 403. The Springer PDF endpoint returned a
        332,101-byte HTML interstitial, not a PDF (sha256
        2254d0a4bb5500b0c19b7ec49cead304384c517e64aa17859b56ba2d2c1a09a3).
        Per coordination direction, retrieval was stopped and not retried. The abstract's
        large-horizontal/low-vertical LIT diagram combined with SiGamal gives no positive
        duplicate evidence, but cannot support an algorithm-, proof-, or cost-level
        nonduplication conclusion.

  prior_eigenx_comparison:
    sources:
      - coordination/design/TASK-20261013-0348f3/tasks/TASK-20261013-613c4e/candidate.md
      - coordination/design/TASK-20261013-0348f3/tasks/TASK-20261013-613c4e/source-overlap.yaml
    finding: >-
      EigenX-v2 uses a prescribed-path endpoint with full torsion images and a decoder
      factoring through a finite quotient Q_N. EigenX-v3 instead makes R_CER the recipient
      witness for DXWE and expressly excludes a path or finite-action decoder. That is a
      material syntax/mechanism change, but the open universal-decoder lower bound prevents
      a stronger impossibility or exclusivity claim.

  nonduplication_conclusion:
    status: inconclusive
    established_scope: >-
      Directly inspected Seta, FESTA, SiGamal, key-updatable supersingular PKE, and prior
      EigenX-v2 are materially different in keys, ciphertexts, recipient witness, decoder,
      transform, or security target.
    limits: >-
      LIT-SiGamal could not be compared beyond metadata/abstract. The local corpus and cited
      set are not an exhaustive literature search. No universal novelty or nonduplication
      claim is warranted.

  ptm_control:
    id: PTM-J5-HIDDEN-AUX-EWE
    result: holds
    mutation: set auxiliary input to W0 concatenated with the otherwise public auxiliary data
    analysis: >-
      Decryption and extraction then return W0 tautologically, independently of EndRing
      hardness. The candidate avoids this known-false inference: it discards W0, forbids
      W/path/ideal/orientation/ring/sampler/NIZK-trapdoor correlated advice in the exact
      auxiliary law, and labels EI-DXWE separately from EndRing. Passing this control checks
      assumption separation only; it does not establish that EI-DXWE exists or is plausible.

  assumption_and_setup_separation:
    - component: EndRing_D_ER
      status: named_but_conditional
      assessment: >-
        The external search game is separately named, but D_ER is the public marginal of
        unresolved K0. It is not interchangeable with standard complete-EndRing hardness.
    - component: K0_TrapRingGen
      status: named_open_obligation
      assessment: >-
        K0 is separate and must sample/validate the complete evaluator witness with bounded
        retries and tails. No construction, parameter set, or proof closes it.
    - component: EI_DXWE
      status: named_strong_uninstantiated_assumption
      assessment: >-
        The relation, distribution, exact auxiliary law, and exclusion of hidden witness
        advice are explicit. It is nevertheless a new strong auxiliary-input extraction
        assumption, not obtained from EndRing.
    - component: relation_specific_xO
      status: optional_named_stronger_uninstantiated_route
      assessment: >-
        xO is not silently substituted for EI-DXWE and is not claimed to follow from EndRing.
        No concrete realization or supporting theorem is supplied.
    - component: strong_USS_NIZK
      status: named_uninstantiated_assumption
      assessment: >-
        Adaptive multi-theorem zero knowledge and unbounded simulation soundness are explicit,
        but there is no concrete construction, theorem match, reduction, or cost.
    - component: CRS
      status: explicit_but_operationally_open
      assessment: >-
        Per-key N.Setup and proof-only SimSetup/SimProve are separated. Honest generation and
        the trust/model choice are named, while ceremony, validation, toxic-waste handling,
        serialization, and concrete size remain unresolved.
    - component: erasure
      status: explicit_but_unverified
      assessment: >-
        The contract requires erasure of K0 paths, ideals, orientations, kernels, seeds and
        transcripts, plus DX/NIZK setup coins. No implementation or leakage model verifies it.
    - component: KEM_DEM
      status: correctly_absent
      assessment: >-
        The artifact is explicitly pure PKE and claims no KEM/DEM. A later hybrid would need
        a separate transform theorem and KDF/DEM assumptions and costs; none may be imported
        into the current result.

  symbolic_cost_accounting:
    status: open
    definitions:
      T_pp: public-parameter and base-curve/order work
      T_K0_j: cost of K0 attempt j, including route/ideal sampling, right order, IdealToIsogeny/Divide, four-map circuits, torsion equality checks, and serialization candidates
      R_K0: random bounded retry count for K0
      V_CER: full R_CER witness validation cost
      T_DXSetup: one DX setup
      T_NSetup: NIZK CRS setup
      T_DXEnc: one DX encryption
      T_NProve: one NIZK proof
      T_NVerify: one NIZK verification
      T_DXDec: one DX decryption with R_CER witness
      T_ser: framing and serialization/deserialization cost
      T_erase: secure erasure cost
    equations:
      keygen_cold: T_KG = T_pp + 2*(sum_(j=1)^R_K0 T_K0_j + V_CER) + 2*T_DXSetup + T_NSetup + T_ser + T_erase
      encryption: T_Enc = T_parse(pk) + 2*T_DXEnc + T_NProve + T_ser
      decryption_cold: T_Dec_cold = T_parse(sk,c) + 2*V_CER + T_NVerify + 2*T_DXDec + T_compare
      public_key_bytes: '|pk| = frame + 2|x| + 2|ep| + |crs|'
      secret_key_bytes: '|sk| = frame + |pk| + 2|W|'
      ciphertext_bytes: '|ct| = frame + |pk_bytes| + 2|c_DX| + |pi|'
      correctness_failure: delta_total <= 2*delta_K0 + 2*epsilon_DX + epsilon_N
    required_charges:
      - W includes all four evaluation circuits, trace/degree/multiplication constants, and the complete torsion-validation suite.
      - Peak memory is the maximum overlapping K0/circuit/torsion/DX/NIZK workspace plus live serialized objects, not a sum of average component memories.
      - Cached decryption may move 2*V_CER into authenticated cache creation only for an explicit number of decryptions; cache integrity, storage, and amortization must be charged.
      - Reduction time includes the adversary, two extraction calls, q_D parsing/verification/known-component decryptions, one K0 per embedded challenge, SimSetup/SimProve, and transcript memory.
      - Tail behavior and failure probabilities for K0 retries, DX correctness, and NIZK completeness must be stated at concrete parameters.
    conclusion: >-
      The producer supplies only a category inventory. With K0, DXWE/xO, NIZK, CRS,
      serialization, parameters, retries, object sizes, and workspaces uninstantiated, neither
      a closed asymptotic total nor numeric bytes/operations/memory/tails can be derived.

  claims_gate:
    endring_only_security: rejected
    practical_or_deployable: rejected
    quantitative_performance: rejected
    universal_novelty: rejected
    reason: >-
      The security theorem necessarily depends on separate EI-DXWE, strong-USS-NIZK, setup,
      and erasure conditions; all material cost terms remain unbound. The producer correctly
      disclaims these stronger claims, and this review does not reinstate them.

  open_obligations:
    - Construct and prove K0, including the R_CER distribution, validation, retry tail, and erased-state guarantee.
    - Instantiate EI-DXWE or the separately stated relation-specific xO route under the exact auxiliary law without witness-bearing advice.
    - Instantiate the required adaptive multi-theorem ZK and unbounded simulation-sound NIZK in the stated CRS model.
    - Give concrete parameters, complete encodings, CRS/proof/DX object sizes, operations, peak memory, failures, and amortization policy.
    - Reconcile full LIT-SiGamal algorithms, proof assumptions, and costs from an inspectable primary full text.
    - Prove the universal decoder/representation claim if it is to support an exclusivity or impossibility statement.

  strongest_scoped_conclusion: >-
    The frozen EigenX-v3 design cleanly names a new relation-specific auxiliary-extractable
    encryption assumption, an optional stronger xO route, a strong NIZK, unresolved K0/CRS,
    and explicit erasure, and it is materially different from the directly inspected Seta,
    FESTA, SiGamal, key-updatable supersingular PKE, and prior EigenX-v2 constructions.
    However, this establishes neither construction security from EndRing alone nor universal
    novelty, practicality, or a total cost bound: the core primitives and parameters are
    uninstantiated, and full-text LIT-SiGamal comparison is blocked. Therefore J5 is
    inconclusive.

