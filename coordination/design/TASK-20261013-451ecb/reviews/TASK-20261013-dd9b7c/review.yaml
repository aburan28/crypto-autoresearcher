schema: crypto.autoresearch.eigenx_v3_joint_review.v1
review:
  task_id: TASK-20261013-dd9b7c
  batch_id: BATCH-5313dc
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  reviewed_snapshot_task_id: TASK-20261013-2b203f
  role: validator
  joint: J3 -- full-ring versus quotient necessity
  verdict: inconclusive
  scope_statement: >-
    This verdict is only on J3. It distinguishes the syntax of the declared
    secret-key/witness interface from intrinsic necessity for every decoder
    implementation or representation and renders no whole-claim vote.
  execution:
    scientific_runs: 0
    implementation_runs: 0
    formalizer_runs: 0
  snapshot_binding:
    status: matched
    detail: >-
      The four producer-artifact SHA-256 values recomputed from the reviewed
      files match the content-first snapshot receipt.

  result:
    established_in_scope: >-
      The declared EX3 Dec algorithm has witness-interface necessity. It
      reparses both W_i and runs Verify_CER(x_i,W_i) before either DX.Dec call.
      Under the producer's proposed R_CER soundness argument, every witness
      reaching a core decryption call encodes a complete evaluable saturated
      rank-four basis of End(E_i). Different bases of that same complete ring
      are intentionally equivalent and decrypt identically.
    not_established: >-
      The artifacts do not establish that the accepted decryption function,
      on fixed identical public data, cannot be implemented from a strict
      quotient, compressed evaluator, cached validation product, or opaque
      decoder circuit. EI-DXWE correctness quantifies over accepted W and its
      extraction property concerns privacy distinguishers; neither is a
      non-factorization theorem or a representation lower bound for honest
      decryption. Rejection of a substitute by Verify_CER shows only that the
      substitute is not an accepted R_CER witness.
    classification_reason: >-
      No strict-quotient decoder is constructed by the reviewed packet, so J3
      is not falsified by an exhibited functional collision. Conversely, the
      sole positive argument is the pre-decryption Verify_CER gate, which
      cannot discharge intrinsic or universal implementation/representation
      necessity. The owned verdict is therefore inconclusive.

  identical_public_data_test:
    fixed_data: >-
      Hold pp, x_i, ep_i, the complete pk bytes, core ciphertext bytes and
      proof bytes fixed. Mutate only the secret representation supplied to a
      prospective receiver or decoder.
    interface_observation: >-
      In the declared Dec syntax, every listed strict substitute is rejected
      during secret parsing or Verify_CER, before any evidence that DX.Dec's
      message function itself distinguishes that substitute from a full-ring
      witness can be observed.
    functional_observation: >-
      The packet specifies no experiment, reduction, injectivity statement,
      information lower bound, or circuit lower bound comparing the resulting
      accepted-ciphertext decryption function under full W with a decoder
      using a smaller derived object. Thus the identical-public-data control
      localizes the positive evidence to the witness gate.

  controls:
    - object: one_evaluator
      witness_interface_result: >-
        A single generic evaluator object is not the required tuple of four
        typed C_i circuits and is rejected unless it expands into that tuple
        and the remaining certificate.
      universal_decoder_result: open
      reason: >-
        No no-compression lemma excludes one selector-based evaluator or
        another compact program from reconstructing the four maps or directly
        implementing the same decryption function.
    - object: one_endomorphism
      witness_interface_result: >-
        One endomorphism cannot satisfy the four-circuit witness grammar and
        rank-four trace-matrix test, so the declared Dec rejects it.
      universal_decoder_result: open
      reason: >-
        The rejection does not exclude preprocessing or an alternative
        receiver algorithm that derives sufficient state from one map; no
        such derivation or impossibility result is supplied here.
    - object: abstract_order
      witness_interface_result: >-
        An abstract quaternion order without typed E-to-E map circuits fails
        parsing, evaluator typing and the certified equality checks.
      universal_decoder_result: open
      reason: >-
        This excludes an abstract order at the R_CER boundary only. A separate
        conversion algorithm or cached curve-specific advice is not modeled
        or ruled out.
    - object: full_rank_strict_suborder
      witness_interface_result: >-
        Assuming the proposed discriminant argument, a strict suborder has
        determinant [End(E):O]^2*p^2 rather than p^2 and fails Verify_CER.
      universal_decoder_result: open
      reason: >-
        The determinant check proves non-membership in the accepted witness
        language, not that DX.Dec cannot factor through that suborder or that
        saturation cannot be deferred or cached.
    - object: finite_torsion_image
      witness_interface_result: >-
        A finite torsion action or lookup table is not four complete typed map
        circuits with the rank, closure and discriminant data, and is rejected.
      universal_decoder_result: open
      reason: >-
        The packet gives no theorem that the ciphertext family probes more
        information than every finite image, nor a functional collision test
        for the unspecified EI-DXWE implementation.
    - object: rank_one_quotient
      witness_interface_result: >-
        A rank-one image cannot satisfy the rank-four trace-matrix condition
        and therefore cannot be an accepted R_CER witness.
      universal_decoder_result: open
      reason: >-
        Rank rejection does not establish that the receiver's message function
        fails to factor through a rank-one value derived from W.
    - object: opaque_or_cached_smaller_decoder
      witness_interface_result: >-
        Such an object is outside the declared secret-key grammar unless it
        reproduces W. The cost discussion nevertheless expressly permits an
        equivalently validated cached result without defining its retained
        contents.
      universal_decoder_result: open
      reason: >-
        Hardwiring, compilation or caching can hide rather than eliminate W,
        and size alone does not identify semantic information. The packet
        defines neither a representation measure nor a black-box lower-bound
        game capable of deciding whether a genuinely smaller decoder exists.

  proves_too_much_control:
    id: PTM-J3-STRICT-QUOTIENT
    known_false_conclusion: >-
      One endomorphism or a finite/rank-one quotient establishes full-ring
      necessity.
    outcome: passed_by_rejecting_the_inference
    first_unsupported_step: >-
      The implication from "this object fails Verify_CER as a witness" to
      "no functionally equivalent decoder on the same public data can use or
      derive only this object" has no supplied premise. The review stops at
      that implication and does not promote interface rejection into intrinsic
      necessity.
    verdict_effect: >-
      The control preserves witness-interface necessity but prevents a holds
      verdict on universal implementation or representation necessity.

  open_obligations:
    - id: J3-NONFACTOR-1
      obligation: >-
        Define the compared decoder class, preprocessing and cache model,
        accepted-ciphertext domain, representation-size/information measure,
        allowed failure probability, and whether reconstruction of W during
        decryption counts as full-ring use.
      exit_criterion: >-
        A precise game that distinguishes an invalid R_CER input from a
        functionally sufficient strict quotient without relying merely on the
        existing Verify_CER call.
    - id: J3-NONFACTOR-2
      obligation: >-
        Prove that for the selected concrete EI-DXWE construction the honest
        decryption function does not factor through one evaluator, one
        endomorphism, an abstract order with conversion advice, a strict
        suborder, finite torsion data, a rank-one quotient, or a smaller
        cached/opaque state; or exhibit and scope a factorization.
      exit_criterion: >-
        A reviewed non-factorization theorem under explicit assumptions, or a
        same-public-data decoder construction with correctness and complete
        preprocessing, online cost, memory and failure accounting.
    - id: J3-WORDING-1
      obligation: >-
        Until those criteria are met, retain the exact claim
        "accepted R_CER witness is a complete ring" and do not restate it as
        "every accepted decryption intrinsically requires storage or
        possession of a complete ring representation."
      exit_criterion: >-
        Claim text and composition preserve the interface-versus-universal
        distinction and the open quotient/cached-decoder obligation.

  claim_boundary: >-
    J3 supports only a conditional, syntactic complete-ring-witness recipient
    interface. It supplies no universal decoder lower bound, no proof that a
    complete ring must be stored rather than reconstructed or compiled, no
    strict-quotient impossibility theorem, and no conclusion about O1, O2, O3,
    O5, O6, IND-CCA2, practicality, novelty, or the whole candidate.

