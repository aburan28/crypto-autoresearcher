nonduplication:
  Seta: >-
    Uses endpoint plus full torsion images and one finite endomorphism action;
    EigenX-v3 instead invokes complete-witness DXWE on two ring statements.
    The v3 mechanism is materially different but rests on much stronger primitives.
  SiGamal_and_LIT_SiGamal: >-
    Use commutative action/LIT diagrams and paper-specific assumptions; no
    complete-ring witness decryption or EI-DXWE interface is recorded.
  UPKE: >-
    Different update/proxy primitive and recipient operation.
  Page_Wesolowski: >-
    Search-problem algorithms and reductions, not public encryption or the
    external extractable-encryption primitive.
  prior_EigenX_v2: >-
    Accepted decapsulation factored through a finite torsion quotient. R_CER
    rejects that object, though a universal lower bound against opaque decoder
    circuits remains open.

