    status: specified_abstractly_not_implemented

strongest_honest_claim: >-
  A polynomial-verifier design and conditional two-instance CCA PKE are
  specified. The correct attacker-to-complete-EndRing arrow exists only after
  assuming EI-DXWE and NIZK properties and resolving K0. This is not an
  EndRing-only, concrete, efficient, post-quantum or deployable construction.

