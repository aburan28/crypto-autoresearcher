relation:
  name: R_CER
  instance:
    syntax: CER-v1 || pp_curve || Enc(E)
    field: canonical F_(p^2), p>3
    requirements:
      - deterministic primality, field and curve validation
      - deterministic polynomial point count and supersingularity test
      - public polynomial limits on circuit size and log degree bounds
  witness:
    components:
      - four typed succinct circuits C_i:E->E with C_0=id
      - claimed degrees and product reduced traces
      - integral multiplication constants a_ijk
      - bounded small-prime full-torsion bases and extension certificates
    excluded_substitutes:
      - one endomorphism
      - isogeny path or kernel
      - finite torsion action or lookup table
      - abstract quaternion maximal order without curve-map evaluators
      - full-rank strict suborder
      - arbitrary executable program outside the typed circuit grammar
  typed_map_grammar:
    gates:
      - identity, negation and binary scalar multiplication
      - normalized isomorphism and inverse
      - certified polynomially bounded prime-degree Velu isogeny
      - explicitly typed relative or absolute Frobenius
      - composition
      - pointwise addition or subtraction with equal source and target
    derived_data:
      - source and target curve on every wire
      - derived dual circuit
      - conservative integer DegUB with polynomial bit length
    verifier_rejects:
      - ill-typed composition or addition
      - source or target mismatch
      - over-limit circuit, coefficient, extension, integer or degree bound
      - noncanonical or trailing bytes
  equality_certificate:
    asserted_equalities:
      - dual(C_i) compose C_i equals scalar degree map
      - C_i plus dual(C_i) equals scalar t_i0 map through the product pairs with C_0=id
      - C_i compose C_j equals sum_k a_ijk C_k
      - product plus product dual equals scalar t_ij map
    bound: >-
      For A=B, use B_eq=(ceil_sqrt(DegUB(A))+ceil_sqrt(DegUB(B)))^2,
      and B_Q=max B_eq over all assertions.
    prime_suite: >-
      Deterministically use first primes ell != p until N_Q=product ell has
      N_Q^2>B_Q. Witness gives a verified full E[ell] basis in a canonical
      extension for each ell.
    checks:
      - extension polynomial irreducibility and canonical field embedding
      - point membership and exact ell order
      - Weil pairing of exact order ell
      - both sides agree on both basis points for every assertion
    soundness_argument: >-
      If nonzero delta=A-B kills E[N_Q], the prime-to-p subgroup forces
      N_Q^2 to divide deg(delta), while deg(delta)<=B_Q<N_Q^2. Hence delta=0.
    complexity_boundary: >-
      The number and size of small primes are polynomial in log(B_Q); E[ell]
      is defined over an extension whose degree is bounded by the order of the
      Frobenius action in GL_2(F_ell), polynomial in ell. All coordinates and
      evaluations count toward witness length. No giant single torsion level
      with exponentially large extension representation is allowed.
  ring_equality:
    construction: O=sum_i Z C_i
    proved_properties:
      - C_i are actual endomorphisms of E
      - C_0 is identity
      - integral multiplication closure
      - rank four from nonzero trace determinant
    final_check: abs(det(t_ij))=p^2
    argument: >-
      For supersingular E/F_(p^2), End(E) is a maximal order in B_(p,infinity)
      of discriminant p^2. Since O is an order contained in End(E),
      disc(O)=[End(E):O]^2*p^2. The accepted determinant forces index one.
    output_semantics: >-
      Any accepted evaluator basis of the complete ring is a solution;
      canonical basis bytes are neither required nor claimed.
  verifier_complexity:
    status: proposed_polynomial
    charged_operations:
      - point counting and supersingularity decision
      - all circuit syntax, dual and degree-bound derivations
      - all finite-extension, torsion, pairing and equality evaluations
      - all integer multiplication, rank and determinant checks
    caveat: Independent J1 review must verify each degree and extension bound.

key_generation_boundary:
  id: K0
  required_algorithm: TrapRingGen
  outputs: one pair (x,W) with Verify_CER(x,W)=1
  scheme_use: two independent invocations
  requirements:
    - exact D_ER public-instance marginal
    - expected polynomial time and polynomial retry cap
    - negligible delta_K0 failure
    - complete typed evaluators, not only an abstract maximal order
    - erasure of path, ideal, orientation, kernels, seeds and conversion transcripts
  plausible_route_not_established:
    - fixed base supersingular curve with known evaluable maximal order
    - smooth-norm ideal and corresponding efficiently evaluable isogeny
    - quaternion right-order basis
    - target conjugation and Page--Wesolowski Divide for rational denominators
    - R_CER certificate production and erasure
  status: unresolved
  reason: >-
    The inspected sources do not supply an end-to-end algorithm proving that
    this route has the exact public distribution, succinct evaluator output,
    polynomial total cost, negligible tail and required erasure.

external_dxwe_boundary:
  name: EI-DXWE[R_CER,D_ER]
  algorithms: [DX.Setup, DX.Enc, DX.Dec]
  correctness: Every accepted W decrypts an encryption to the exact message.
  challenge_instance: >-
    x is externally supplied from D_ER; DX.Setup and the extractor may not
    replace it with a self-sampled instance.
  allowed_auxiliary_distributions:
    - exact real scheme public key and adversary state with independent other component
    - exact Naor--Yung hybrids using simulated CRS/proofs
  forbidden_extractor_inputs:
    - hidden R_CER witness for the challenge
    - challenge-correlated path, ideal, orientation, ring or sampler trapdoor
    - nonuniform advice depending on the particular challenge x
    - NIZK simulation trapdoor not explicitly accounted in the hybrid distribution
  uniform_extractor_bound: >-
    Adv_DX(D;x,aux) <= L_X(lambda)*
    Pr[Verify_CER(x,Ext[D](1^lambda,ep,x,aux))=1]+nu_X(lambda), with
    uniform PPT Ext[D], explicit polynomial L_X and negligible nu_X.
  ordinary_we_boundary:
    false_statement_WE: >-
      Inapplicable: every honest R_CER public instance has a witness, while
      ordinary soundness and adaptive soundness only guarantee privacy when
      x is not in the language.
    bellare_hoang_XS: >-
      Stronger than AS and extracts a witness in its own adaptive game, but the
      inspected definition has no general auxiliary input and does not state a
      uniform solver accepting a separately supplied external x. It is not
      silently upgraded to EI-DXWE.
    self_sampled_XS: >-
      Insufficient because an EndRing solver must embed the exact challenge
      it receives rather than use the primitive's instance sampler.
  conditional_xo_realization:
    circuit: F_(x,m)(w) returns m iff Verify_CER(x,w), otherwise bottom
    needed_primitive: >-
      Relation-specific externally instantiable extractable differing-input
      obfuscation under the exact allowed auxiliary distributions.
    implication: >-
      A distinguisher yields an input on which F_(x,m0) and F_(x,m1) differ;
      that input is an accepted complete EndRing witness for the same x.
    status: strong_separate_uninstantiated_assumption
    not_claimed:
      - general-purpose xO or EWE exists
      - xO follows from EndRing hardness
      - ordinary AS or XS gives the required external interface

nizk_and_transform_boundary:
  relation: L_EQ over exact pk,c_0,c_1 bytes and witness m,r_0,r_1
  properties:
    - perfect or quantified completeness
    - adaptive multi-theorem zero knowledge
    - strong unbounded simulation soundness
    - same-false-statement new-proof resistance after simulated proof
  key_independence: >-
    KeyGen uses two independent (x_i,W_i) samples, not one x with two setup
    strings. In the hybrid that embeds external x_i, the simulator honestly
    samples W_(1-i) and decrypts valid equality queries with that independent
    witness. One shared witness would not provide the standard oracle simulation.
  exact_challenge_exclusion: Only the complete challenge bytes are excluded.
  primary_source_limit: >-
    Cramer--Hofheinz--Kiltz describes the Naor--Yung replication/NIZK paradigm
    and gives exact CCA syntax, but its main theorem is a specialized algebraic
    KEM/HPS construction, not the generic theorem claimed here. The candidate's
    displayed hybrid therefore requires independent review.

