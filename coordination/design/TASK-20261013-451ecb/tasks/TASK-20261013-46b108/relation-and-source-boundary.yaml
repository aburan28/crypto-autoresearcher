    The deterministic point-counting/supersingularity subroutine is a standard
    recalled algorithmic fact in this producer packet, not discharged by a
    newly inspected primary point-counting source; J1 must verify its exact
    criterion and complexity.
  - >-
    No inspected source proves the packet's complete torsion-suite equality
    verifier as a packaged theorem; its degree/kernel argument is derived here
    and awaits independent algebra review.
  - >-
    No primary theorem inspected here is the exact generic Naor--Yung theorem
