    role: externally supplied search hardness
    not_enough_for: public encryption, CCA transform or efficient trapdoor sampling
  K0:
    role: efficient honest generation and erasure
    status: open
  EI_DXWE:
    role: public encryption and uniform attacker-to-witness extraction
    status: separate_strong_uninstantiated_assumption
  relation_specific_external_aux_xO:
    role: optional conditional realization of EI-DXWE
    status: separate_stronger_uninstantiated_assumption
  NIZK_ZK_and_sUSS:
    role: active-security consistency and oracle simulation
    status: separate_transform_assumption
