target_claim:
  quantifiers: >-
    For every classical PPT IND-CCA2 adversary A against keys generated by two
    independent K0 samples, there exist uniform PPT algorithms B_0,B_1,S_0,
    S_1,F such that the displayed multi-assumption loss holds; each B_i gets
    one external x_i sampled from exact D_ER without its witness and outputs W
    accepted by Verify_CER for that same x_i.
  output: Complete efficiently evaluable saturated rank-four End(E_i) basis.
  not_claimed:
    - EndRing hardness alone implies PKE
    - EI-DXWE or strong-USS NIZK follows from EndRing
    - efficient K0 exists
    - quantum, concrete, practical or deployment security
    - every possible decoder representation must contain a full ring witness

cheap_audits:
  baseline_reproduction:
    status: completed_symbolic
    baseline: >-
      Prior BATCH-be2a37 EigenX-v2 accepts endpoint plus full torsion images
      and factors through a finite torsion-action quotient.
    reproduction: >-
      candidate.md section 8 replaces an R_CER witness by the prior path,
      one endomorphism or finite action; Verify_CER rejects before core
      decryption. Ordinary false-statement WE is also reproduced and rejected
      because honest x is a true statement.
    limitation: No implementation or measured reproduction occurred.
  observation_collision:
    status: open
    observable: Complete PKE decryption function on all canonical ciphertexts.
    collisions_checked:
      - different bases of the same End(E) intentionally collide and are equivalent solutions
      - strict suborders collide on finitely many torsion levels but fail discriminant p^2
      - paths, one endomorphism and finite torsion images fail R_CER
    unresolved_collision: >-
      An opaque smaller decoder circuit may reproduce DX.Dec without exposing
      an R_CER witness. EI-DXWE extracts from privacy distinguishers, not from
      every correct decoder. Full representation-level necessity is unproved.
    falsification_effect: >-
      Such a decoder does not invalidate conditional correctness, but refutes
      the stronger claim that possession/storage of the complete ring is
      intrinsically necessary for every implementation.
  quantifier_order:
    status: completed_with_strong_assumption
    required_order: >-
      For all external x<-D_ER and all PPT distinguishers D under the exact
      allowed auxiliary law, there exists one uniform PPT transformation
      Ext[D] that receives that same x and outputs its witness with the stated
      bound; Ext may not choose x or receive witness-correlated advice.
    rejected_order: >-
      For instances self-sampled inside D or the primitive, there exists an
      extractor depending nonuniformly on that sampled instance.
    consequence: >-
      Ordinary AS/XS definitions inspected here do not by themselves satisfy
      the required order; EI-DXWE is a separate named assumption.
  method_ceiling_and_nearby_control:
    status: completed_symbolic
    ceiling: >-
      The Naor--Yung layer can at most turn core IND-CPA privacy into classical
      IND-CCA2 under ZK and strong sUSS; it cannot create EI-DXWE, K0, EndRing
      hardness, quantum security or a decoder lower bound.
    nearby_false_objects:
      - one x with two setup strings, for which the reduction knows no independent witness and cannot simulate Dec
      - double encryption without a binding equality proof
      - ordinary WE on a true statement
      - self-sampled extractability with no external challenge embedding
      - auxiliary-input extractor supplied challenge witness advice
    result: >-
      Candidate uses two independent (x_i,W_i), full-key-bound equality proof,
      strong same-statement sUSS, and explicit external extraction. The strong
      assumptions remain visible rather than being promoted as EndRing.

phases:
  P0:
    objective: normalize candidate and nearest work
    status: proposed_discharge
    artifacts: [candidate.md, relation-and-source-boundary.yaml]
    result: >-
      One mechanism only; different from Seta/EigenX-v2 finite torsion action,
      SiGamal commutative action and UPKE update mechanisms.
    open: Full LIT-SiGamal text remains unavailable in the inherited source record.
  P1:
    objective: type R_CER and its polynomial verifier
    status: proposed_discharge
    artifacts: [candidate.md, relation-and-source-boundary.yaml]
    result: >-
      Typed circuit grammar, torsion equality suite, closure, trace determinant
      and p^2 maximality imply exact End(E).
    open:
      - independent check of addition/composition degree bounds
      - independent check that all torsion extension and certificate sizes are polynomial
      - exact implementation grammar and costs
  P2:
    objective: type external-instance EI-DXWE and extraction
    status: proposed_discharge
    artifacts: [candidate.md, relation-and-source-boundary.yaml]
    result: >-
      Same-x uniform extractor game and exact real/simulated auxiliary laws are stated.
    open:
      - concrete realization
      - independent plausibility and circularity review
      - explicit numeric polynomial L_X for any realization
  P3:
    objective: prove or obstruct honest correctness
    status: proposed_discharge
    artifacts: [candidate.md, scheme-contract.yaml]
    result: >-
      Exact-message error at most 2*delta_K0+2*epsilon_DX+epsilon_N.
    open:
      - K0 tail
      - instantiated primitive errors
      - independent derivation
  P4:
    objective: test complete-ring necessity against quotients
    status: open
    artifacts: [candidate.md]
    result: >-
      Witness-interface necessity holds: all accepted witnesses are complete
      rings and named strict substitutes reject.
    open: Universal exclusion of an opaque smaller equivalent decoder circuit.
  P5:
    objective: instantiate Naor--Yung and strong-USS NIZK
    status: proposed_discharge
    artifacts: [candidate.md, scheme-contract.yaml]
    result: >-
      Two independent R_CER keys, independent component coins, full-key-bound
      equality language, canonical bytes and deterministic rejection specified.
    open:
      - no concrete strong-USS NIZK selected
      - generic hybrid not directly supplied by inspected CHK theorem
      - exact loss requires J4 review
  P6:
    objective: simulate exact IND-CCA2 game and extract complete witness
    status: proposed_discharge
    artifacts: [candidate.md, scheme-contract.yaml]
    result: >-
      Embed external x_i, sample independent witness W_(1-i), answer valid
      equality queries with W_(1-i), reject false statements by strong sUSS,
      and run uniform Ext[D_i] on the same x_i.
    open:
      - blind independent rederivation
      - exact abort and runtime polynomial
      - auxiliary distribution match in simulated CRS hybrids
  P7:
    objective: separate assumptions and assess EWE plausibility
    status: proposed_discharge
    artifacts: [relation-and-source-boundary.yaml, scheme-contract.yaml]
    result: >-
      EndRing, K0, EI-DXWE, optional relation-specific external-aux xO and
      NIZK are separate. GGHW conditional implausibility is recorded.
    open: Relation-specific assumption plausibility remains unestablished.
  P8:
    objective: account for setup, sizes, failures and costs
    status: open
    artifacts: [candidate.md, scheme-contract.yaml]
    result: Complete symbolic category inventory only.
    open:
      - K0 operation and retry costs
      - map/torsion certificate sizes
      - concrete DXWE and NIZK sizes/times/memory
      - cold versus amortized totals
      - implementation side channels
  P9:
    objective: classify outcome without promotion
    status: completed_producer_classification
    outcome: candidate
    strongest_claim: >-
      Fully typed conditional classical construction with K0/O1/O2/O6 and
      representation-necessity gaps; no EndRing-only or practical claim.
    next_gate: Frozen independent J1-J5 review and Coordinator composition.

reduction_graph:
  nodes:
    - classical IND-CCA2 attacker on complete EigenX-v3
    - two EI-DXWE distinguishers under Naor--Yung hybrids
    - uniform external-instance extractors on same x_i
    - accepted R_CER witness
    - complete evaluable End(E_i) basis
  arrows:
    - from: IND-CCA2 attacker
      to: EI-DXWE distinguishers
      condition: adaptive ZK, strong same-statement unbounded simulation soundness, canonical grammar
      status: proposed
    - from: EI-DXWE distinguisher
      to: accepted R_CER witness
      condition: EI-DXWE[R_CER,D_ER] with exact auxiliary distribution
      status: separately_assumed
    - from: accepted R_CER witness
      to: complete EndRing solution
      condition: R_CER soundness from torsion equality and discriminant p^2
      status: proposed_algebraic_proof
  reverse_arrows_not_security_proofs:
    - complete EndRing witness enables DX.Dec
    - public W breaks confidentiality

loss_accounting:
  proposed_bound: >-
    Adv_CCA(A) <= L_X*(Succ_ER(B_0)+Succ_ER(B_1)) + 2*nu_X +
    Adv_ZK(S_0)+Adv_ZK(S_1)+Adv_sUSS(F). Canonical parsing is deterministic.
  runtime_terms:
    - runtime of A and both core hybrid distinguishers
    - uniform extractor runtime for each component
    - one independent K0 sample in each external challenge reduction
    - q_D proof verifications and known-component decryptions
    - setup, parsing, serialization and transcript storage
  memory_terms:
    - A state and decryption-query transcript
    - one independently sampled complete ring witness
    - EI-DXWE and NIZK simulator/extractor state
    - canonical buffers and proof/ciphertext bytes
  unresolved:
    - instantiated L_X and nu_X
    - exact sUSS and ZK advantages
    - K0 retry/abort probability and costs
    - proof-system reduction constants

controls:
  PTM_J1_ABSTRACT_ORDER:
    known_false: Abstract quaternion maximal order alone is a complete R_CER witness.
    expected_failure: no typed curve-map evaluators; reject in circuit parsing/equality checks
  PTM_J2_SELF_SAMPLED_XSWE:
    known_false: Self-sampled XS-WE embeds an arbitrary external EndRing challenge.
    expected_failure: wrong quantifier order and no same-x uniform extractor
  PTM_J3_STRICT_QUOTIENT:
    known_false: One map, path, finite torsion image or strict suborder passes R_CER.
    expected_failure: rank, closure/evaluator or discriminant check
  PTM_J4_UNBOUND_DOUBLE_ENCRYPTION:
    known_false: Two core ciphertexts without strong full-key-bound equality proof are IND-CCA2.
    expected_failure: splicing or malformed proof query defeats oracle simulation
  PTM_J5_HIDDEN_AUX_EWE:
    known_false: Witness-correlated auxiliary EWE advice is EndRing hardness.
    expected_failure: extractor already receives solution information; circular reduction

outcome_matrix:
  if_all_review_joints_hold: >-
    Conditional construction only, under every named assumption; still no
    concrete efficiency or deployment claim until K0 and primitives are instantiated.
  if_R_CER_breaks: Scoped obstruction for this certificate relation; redesign relation.
  if_external_extraction_breaks: >-
    Scoped obstruction for this EI-DXWE reduction interface; do not fall back
    to ordinary or self-sampled WE.
  if_quotient_found: >-
    Remove full-ring necessity wording and assess whether the quotient defines
    a different non-EndRing scheme; do not relabel it EigenX.
  if_NY_breaks: >-
    Scoped active-security failure; core conditional CPA syntax may remain but
    receives no CCA or general-purpose security label.
  if_sources_or_cost_inconclusive: Preserve candidate status and exact open obligations.
