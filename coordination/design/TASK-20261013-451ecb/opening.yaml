schema: crypto.autoresearch.eigenx_v3_ring_witness_opening.v1
opening:
  task_id: TASK-20261013-451ecb
  batch_id: BATCH-5313dc
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  opening_decision_id: DEC-20261013-ef0ee8
  date: '2026-10-13'
  mode: goal
  kind: bounded_zero_run_theory_construction_or_obstruction
  selected_continuation: EIGENX-V3-RING-WITNESS-CCA-PKE
  candidate:
    user_name: EigenX-v3 Ring-Witness CCA PKE
    primitive: pke_with_optional_kem_dem
    mechanism: >-
      Define a polynomial-time complete-EndRing certificate relation R_CER and
      use relation-specific distributional extractable witness encryption
      (DXWE/XWE) as the public-sender/full-ring-witness decryption core. Wrap
      two core encryptions with a Naor--Yung consistency statement and a
      simulation-sound NIZK for IND-CCA2; an optional KEM/DEM layer may be
      specified only after the PKE core and its assumptions are explicit.
    material_difference_gate: >-
      The candidate must use a witness for the complete evaluable endomorphism
      ring through R_CER. One endomorphism, a path, an abstract quaternion
      order, a finite torsion image, a rank-one quotient, or ordinary
      external-instance-free XS-WE does not satisfy this gate.
  relation_gate:
    name: R_CER
    required_properties:
      - polynomial-time instance and witness parsing
      - polynomial-time verification of a complete evaluable saturated rank-four EndRing certificate
      - exact statement of the real KeyGen instance and witness distributions
      - completeness, soundness, representation conversions and failure behavior
      - explicit distinction between complete EndRing, strict quotients and auxiliary advice
    caveat: >-
      The batch must not assume that such a certificate relation is available;
      the producer must construct it or record the first exact obstruction.
  witness_encryption_gate:
    required_core: relation-specific distributional extractable witness encryption (DXWE/XWE)
    required_external_challenge: >-
      The security interface must accept externally supplied R_CER challenge
      instances from the complete-EndRing reduction and cover their actual
      auxiliary-input distribution.
    insufficient_interface: >-
      Ordinary XS-WE whose setup or sampler generates its own instances and
      offers no external challenge-instance embedding cannot discharge the
      attacker-to-EndRing reduction.
    implausibility_review: >-
      Review auxiliary-input extractable-witness-encryption assumptions for
      circularity, over-strength, black-box implausibility and whether they
      already encode the sought EndRing witness.
  active_security_target:
    game: classical IND-CCA2 in a precisely named standard/ROM model
    transform: Naor--Yung double encryption plus simulation-sound NIZK
    requirements:
      - exact KeyGen, Enc and Dec algorithms and byte grammar
      - two independently randomized core ciphertexts and a consistency statement
      - simulation-sound NIZK setup, prover, verifier, simulator and extraction obligations
      - exact decryption-oracle simulation and challenge-ciphertext exclusion
      - deterministic malformed-input rejection or explicitly analyzed implicit rejection
      - actual-message correctness with quantified failure probability
      - optional KEM/DEM only under separately stated composition and DEM assumptions
  assumption_separation:
    base_target: complete-EndRing on the exact real-key distribution
    separate_non_endring_assumptions:
      - distributional extractable witness encryption for R_CER
      - any auxiliary-input EWE or knowledge/extractability assumption
      - simulation-sound NIZK and its setup/model assumptions
      - Naor--Yung component-encryption hypotheses not reduced to EndRing
      - KDF, KEM/DEM and authenticated-encryption assumptions when used
    rule: >-
      Every non-EndRing assumption receives its own game, distribution,
      simulator/extractor obligation and reduction arrow. None may be renamed
      EndRing hardness or hidden inside setup.
  reduction_target:
    input: complete-EndRing challenge sampled from the stated R_CER/KeyGen distribution
    use: successful adversary in the complete EigenX-v3 IND-CCA2 game
    output: complete efficiently evaluable saturated rank-four basis of End(E)
    required_steps:
      - externally embed the exact challenge instance in the public key
      - match the real public-key and auxiliary-input distributions
      - simulate both encryption components, NIZK and every decryption query
      - extract an R_CER witness from attacker behavior rather than supplied setup advice
      - quantify aborts, loss, runtime, memory and representation conversions
  six_obligation_gate:
    O1: exact R_CER, EndRing problem, distributions, setup and auxiliary data
    O2: executable honest algorithms, encodings, validation, failures and costs
    O3: quantified actual-message correctness
    O4: public-sender DXWE/XWE functionality and complete-ring-witness decryption
    O5: correctly directed attacker-to-complete-EndRing reduction with every other assumption separate
    O6: complete adversarial view, malformed handling, setup and controls
    statuses: [open, proposed_discharge, reviewed_discharge, contradicted]
  proof_search_map:
    P0: normalize R_CER, the candidate and nearest prior work
    P1: type the complete certificate relation and polynomial verifier
    P2: type external-instance DXWE/XWE setup, encryption, decryption and extraction
    P3: prove or obstruct honest correctness on the real distributions
    P4: test complete-ring necessity against quotient and auxiliary-advice controls
    P5: instantiate Naor--Yung and simulation-sound NIZK with malformed handling
    P6: simulate the exact IND-CCA2 game and extract a complete R_CER witness
    P7: separate all non-EndRing assumptions and review auxiliary-input EWE plausibility
    P8: account for setup, algorithms, sizes, failures and optional KEM/DEM
    P9: return construction, scoped obstruction or named open obligations
  source_gate:
    required_primary_comparisons:
      - witness encryption and extractable witness encryption definitions used
      - distributional or auxiliary-input extractability result used
      - Naor--Yung double encryption theorem used
      - simulation-sound NIZK theorem used
      - complete-EndRing certificate and EndRing equivalence sources used
      - nearest supersingular PKE/KEM constructions in the goal record
    rule: >-
      Record revision, inspected sections and retrieved provenance. Recalled or
      metadata-only pointers cannot discharge a source, nonduplication or setup gate.
  outcome_rules:
    construction: Requires independent reviewed discharges for O1--O6 under every named assumption.
    scoped_obstruction: Names only the exact relation/core/transform interface and failed arrow.
    inconclusive: Preserves each missing algorithm, source, theorem or plausibility obligation with an exit criterion.
  visual_deliverables:
    report: research/ssi-endring-pke/2026-10-13-eigenx-v3-ring-witness/report.md
    editable_diagram: research/ssi-endring-pke/2026-10-13-eigenx-v3-ring-witness/flow.mmd
    svg: research/ssi-endring-pke/2026-10-13-eigenx-v3-ring-witness/flow.svg
    pdf: research/ssi-endring-pke/2026-10-13-eigenx-v3-ring-witness/report.pdf
    inspection: research/ssi-endring-pke/2026-10-13-eigenx-v3-ring-witness/visual-inspection.yaml
  scientific_runs: 0
  implementation_runs: 0
  automatic_success: false
  stop_rule: >-
    Exactly one theory producer, one immutable snapshot, independent J1--J5
    review, one composition, one report/flow/methodology/PDF package, one J6
    documentation review and one ledger archive/checkpoint followed by lane
    close. No scientific or implementation runs, parameter selection,
    automatic successor, assumption collapse or security label.
