    release_outcome: completed

conjunctive_obligation_gate:
  rule: >-
    O1--O6 require reviewed discharge conjunctively. An inconclusive owner
    result cannot be promoted to holds, and J4's break contradicts the exact
    proposed O5 transform even though the other joints remain independently open.
  O1:
    opening_name: exact R_CER, EndRing problem, distributions, setup and auxiliary data
    composed_review_result: inconclusive
    obligation_status: open
    basis:
      - J1 leaves primitive gate, dual, field-embedding, total extension-degree and exact DegUB verification unfinished.
      - J2 leaves the executable real-key/external-challenge sampler and exact component embedding unfinished.
      - J5 leaves K0 and D_ER uninstantiated.
  O2:
    opening_name: executable honest algorithms, encodings, validation, failures and costs
    composed_review_result: inconclusive
    obligation_status: open
    basis:
      - J1 does not find a complete executable R_CER verifier/evaluator or decoder grammar.
      - J4 leaves total primitive parsers, CRS validation and all malformed failure paths abstract.
      - J5 finds K0, EI-DXWE/xO, NIZK, parameters, sizes, memory and total costs uninstantiated.
  O3:
    opening_name: quantified actual-message correctness
    composed_review_result: inconclusive
    obligation_status: open
    basis:
      - J1 rederives only the conditional average union bound and rejects the unsupported per-returned-key strengthening.
      - J4 finds honest random-coin correctness insufficient for adversarial valid-ciphertext oracle simulation.
      - Primitive errors and the K0 retry tail remain symbolic.
  O4:
    opening_name: public-sender DXWE/XWE functionality and complete-ring-witness decryption
    composed_review_result: inconclusive
    obligation_status: open
    basis:
      - Witness-interface necessity is preserved conditionally on R_CER and EI-DXWE.
      - J3 finds no universal non-factorization or representation lower bound against strict quotients, cached state or opaque decoders.
      - EI-DXWE and its optional relation-specific xO route are uninstantiated.
  O5:
    opening_name: correctly directed attacker-to-complete-EndRing reduction with every other assumption separate
    composed_review_result: breaks
    obligation_status: contradicted
    basis:
      - J2 finds the direction coherent only under an uninstantiated exact external-instance adaptive auxiliary-input extractor, exact distribution matching, sound R_CER decoding and a sufficient NIZK property.
      - J4 breaks the proposed CCA hybrid because one-witness oracle simulation does not reproduce real two-component Dec on adversarially chosen valid ciphertexts under average correctness.
      - The displayed reduction omits the required robust-correctness or q_D-scaled simulation-error term.
  O6:
    opening_name: complete adversarial view, malformed handling, setup and controls
    composed_review_result: inconclusive
    obligation_status: open
    basis:
      - The abstract exact-byte game and principal controls are stated.
      - J4 leaves the exact sUSS game, total parsers, CRS setup/simulation and malformed primitive behavior open.
      - J5 leaves setup ceremony, validation, toxic-waste handling, erasure verification, side channels, multi-user and quantum views open.

assumption_and_boundary_separation:
  R_CER:
    status: conditionally_sound_algebra_incomplete_executable_verifier
    boundary: >-
      The trace-discriminant/index-one argument is supported only after genuine
      homomorphisms, duals, conservative degree bounds and common field
      embeddings are verified by algorithms not yet fully specified.
  EndRing_D_ER:
    status: named_external_search_assumption_not_a_complete_scheme_assumption
    boundary: Its exact distribution depends on unresolved K0 and is not interchangeable with generic EndRing hardness.
  K0_TrapRingGen:
    status: open_uninstantiated
    boundary: No exact efficient sampler, retry tail, evaluable-certificate construction or erasure guarantee is proved.
  EI_DXWE:
    status: separate_strong_uninstantiated_assumption
    boundary: >-
      Ordinary WE/AS/XS does not supply the same externally embedded instance
      and exact adaptive auxiliary view. EI-DXWE is not implied by EndRing.
  relation_specific_external_aux_xO:
    status: optional_stronger_uninstantiated_route
    boundary: General auxiliary-input EWE has a conditional implausibility boundary; no exact relation-specific realization is supplied.
  NIZK_ZK_and_strong_USS:
    status: separate_uninstantiated_transform_assumption
    boundary: Same-false-statement alternate proof bytes require the exact strong property; no matching concrete system or full game is supplied.
  CCA_transform:
    status: scoped_break_as_written
    boundary: >-
      The break is the exact oracle-simulation mismatch identified by J4. It is
      not an impossibility result for Naor--Yung, EI-DXWE, EndRing PKE, or a
      repaired candidate.
  setup_CRS_and_erasure:
    status: explicit_but_operationally_open
    boundary: CRS trust, generation, validation, simulator-trapdoor custody, toxic waste and erasure are not implemented or verified.
  encodings_and_robustness:
    status: abstractly_specified_not_executable
    boundary: Canonical outer framing is described, but total nested grammars, pointwise/robust DX correctness and malformed behavior are missing.
  costs_and_parameters:
    status: open_symbolic_inventory_only
    boundary: No closed asymptotic total, concrete bytes, operations, peak memory, retry tails, parameters, practicality or deployment claim exists.
  quantum_scope:
    status: not_claimed
    boundary: The reviewed target is classical CRS-model IND-CCA2 only; QPT extraction and post-quantum sUSS/ZK are absent.

source_and_retrieval_limits:
  - >-
    J5 could inspect LIT-SiGamal only through landing metadata and an abstract:
    the ePrint PDF returned HTTP 403 and the Springer PDF endpoint returned an
    HTML interstitial. Algorithm-, proof- and cost-level nonduplication against
    LIT-SiGamal therefore remains open.
  - >-
    J5's inspected comparison set is not an exhaustive literature search;
    direct nonduplication from Seta, FESTA, SiGamal, key-updatable supersingular
    PKE and EigenX-v2 does not establish universal novelty.
  - >-
    J2's recent WE/xO source additions were abstract- or limited-section reads
    and do not discharge the exact EI-DXWE theorem, sampler, auxiliary view or loss.
  - >-
    The producer did not newly inspect a primary point-counting source and no
    inspected primary theorem packages the exact R_CER torsion verifier or the
    generic EI-DXWE plus strong-USS Naor--Yung theorem.
  - >-
    J1 reports that the curve-algebra skill's linked math-contract resource was
    unavailable; its verdict relies on the frozen packet and committed contracts.

