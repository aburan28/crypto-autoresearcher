    Freeze one bounded transform amendment that requires either perfect
    pointwise witness-independent DX correctness for every valid setup,
    accepted R_CER witness, message and Enc coin string, or a formal
    adversarial-valid-ciphertext robustness game with its q_D-scaled loss;
    include the exact byte-level strong-sUSS game, total parser/CRS behavior,
