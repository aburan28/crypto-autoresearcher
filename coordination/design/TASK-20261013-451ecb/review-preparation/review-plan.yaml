schema: crypto.autoresearch.review_plan.v1
review_plan:
  id: RP-BATCH-5313dc
  batch_id: BATCH-5313dc
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  frozen_by_decision: DEC-20261013-ef0ee8
  frozen_at: '2026-10-13T15:00:14Z'
  subject: eigenx_v3_ring_witness_cca_pke
  coordinator_prior: >-
    R_CER verification, externally embedded distributional extraction, and
    complete-ring necessity are likely to require assumptions stronger than
    complete-EndRing; ordinary self-sampled XS-WE is expected not to support
    the required reduction. A fully typed separated construction would
    overturn this prior and must not be discounted.
  verdict_vocabulary: [holds, breaks, inconclusive]
  composition_rule: >-
    Copy each J1--J5 verdict from its sole owner and apply O1--O6
    conjunctively. Do not vote, merge assumptions, or let one joint dispose
    another. J6 reviews only the composed documentation package.
  joints:
    - joint: J1 -- R_CER algebra, certificate verification and correctness
      assigned_to: TASK-20261013-8c1d9b
      attack_plan: >-
        Type every instance/witness component, verify polynomial-time complete
        evaluable saturated-basis certification, and rederive honest-message
        correctness including exceptional keys, coins and failure probability.
    - joint: J2 -- extractor/reduction direction and oracle simulation
      assigned_to: TASK-20261013-172e43
      attack_plan: >-
        From the opening statement alone, build the solver from an external
        complete-EndRing challenge, simulate both Naor--Yung components, NIZK
        and decryption queries, and demand extraction of a complete R_CER
        witness with explicit loss and runtime.
    - joint: J3 -- full-ring versus quotient necessity
      assigned_to: TASK-20261013-dd9b7c
      attack_plan: >-
        Replace the witness by one evaluator, one endomorphism, an abstract
        order, torsion images and rank-one quotients; test identical public data
        and whether accepted decryption actually distinguishes the full ring.
    - joint: J4 -- CCA transform, malformed inputs and rejection behavior
      assigned_to: TASK-20261013-9117c2
      attack_plan: >-
        Re-derive ciphertext equality, consistency language, simulation-sound
        NIZK hypotheses, challenge exclusions, alternate encodings, malformed
        queries, replay and optional KEM/DEM composition.
    - joint: J5 -- sources, nonduplication, setup, assumptions and total cost
      assigned_to: TASK-20261013-7b385a
      attack_plan: >-
        Inspect the exact primary sources, normalize against nearest schemes,
        separate every non-EndRing assumption, review auxiliary-input EWE
        plausibility, and charge trusted setup, erasure, algorithms, sizes,
        retries, preprocessing, verification and memory.
  blindness:
    mutual: true
    lifted_for: [TASK-20261013-836352, TASK-20261013-a43ec4]
    rationale: >-
      Composition reads all owned verdicts and J6 reads the composed report;
      neither is an independent scientific vote.
  blind_rederivation:
    required: true
    assigned_to: TASK-20261013-172e43
    quantity: external challenge embedding, complete oracle simulation, R_CER witness extraction, advantage loss and runtime
    blind_from:
      - coordination/design/TASK-20261013-451ecb/tasks/TASK-20261013-46b108/
      - coordination/design/TASK-20261013-451ecb/reviews/
      - coordination/design/TASK-20261013-451ecb/composition/
  proves_too_much:
    failure_signature: >-
      A correct argument must reject each known-false conclusion at its first
      unsupported typing, distribution, necessity, transform, setup or source
      step; accepting one breaks the owning joint.
    objects:
      - id: PTM-J1-ABSTRACT-ORDER
        known_false_conclusion: An abstract quaternion order with no evaluable maps is a complete R_CER witness.
        owner: TASK-20261013-8c1d9b
      - id: PTM-J2-SELF-SAMPLED-XSWE
        known_false_conclusion: Ordinary self-sampled XS-WE with no external challenge instances yields an attacker-to-EndRing reduction.
        owner: TASK-20261013-172e43
      - id: PTM-J3-STRICT-QUOTIENT
        known_false_conclusion: One endomorphism or a finite/rank-one quotient establishes full-ring necessity.
        owner: TASK-20261013-dd9b7c
      - id: PTM-J4-UNBOUND-DOUBLE-ENCRYPTION
        known_false_conclusion: Double encryption without a binding simulation-sound proof is IND-CCA2.
        owner: TASK-20261013-9117c2
      - id: PTM-J5-HIDDEN-AUX-EWE
        known_false_conclusion: An auxiliary-input EWE assumption that supplies the witness is complete-EndRing hardness.
        owner: TASK-20261013-7b385a
  post_review:
    composition:
      task_id: TASK-20261013-836352
      single_owner: coordinator
      verdict: exact copy-and-gate fidelity, not an additional scientific vote
    documentation:
      task_id: TASK-20261013-a43ec4
      single_owner: reviewer
      joint: J6
      verdict: report, flow, PDF, sources and claim-boundary fidelity only
  review_execution:
    producer_snapshot_task_id: TASK-20261013-2b203f
    scientific_review_tasks:
      - TASK-20261013-8c1d9b
      - TASK-20261013-172e43
      - TASK-20261013-dd9b7c
      - TASK-20261013-9117c2
      - TASK-20261013-7b385a
    composition_task_id: TASK-20261013-836352
    documentation_task_id: TASK-20261013-a43ec4
    independence_check: >-
      Run tools/check_review_independence.py on the frozen batch after J1--J5
      and before treating composition as complete; record every deviation.
  procedure_deviations: []
  closure_gate: >-
    Composition waits for J1--J5. Ledger archive waits for the report and J6.
    Lane close follows a verified ledger archive and closes only BATCH-5313dc.
