    maximum_mechanisms: 1
    maximum_concrete_formulations: 3
    maximum_finalists: 1
    formulations:
      A: "A: ideal-transporter/left-order reconstruction uses secret represented O and public target C/degree D to construct a represented left O-ideal or map with codomain C and evaluate it. Charge norm equations, KLPT or enumeration, codomain matching, rational-map/kernel output and verification; distinguish a computed calibrated result from assuming the forbidden connecting map."
      B: "B: simultaneous torsion-conjugacy/module calibration uses the full labelled source O-action and single public column X; enforce quaternion relations, polarization/pairings, degree and codomain equations. Eliminate or expose residual centralizer/shear ambiguity; prove a computation, not only uniqueness. Do not repeat the prior finite target-frame reconstruction."
      C: "C: target-order/bimodule realization computes End(C) or an O-End(C) bimodule/Hom(E,C), then realizes gamma(X). State exact reduction direction and full costs; test whether each target-order/realization subroutine already solves the hidden connecting problem."
    nonduplication:
      source: "ledger/decisions/DEC-20261005-1393f9.yaml"
      provenance: "internal"
      finite_target_frame: "F1: requires the missing calibrated target frame"
      symbolic_sandwich_DAG: "F2: symbolic composition without target evaluator"
      exhaustive_public_lookup: "F3: public lookup with 2^lambda worst-case iterations"
      boundary: "These three disclosed prior formulations are exclusions for this search, not a universal impossibility statement. Normalize every new route against them and expose any dependency that repeats them."
    scientific_runs: 0
    implementation_runs: 0
    interface: "Secret integral represented/evaluable O=End(E); public E,C,X,P,Q,D,N and exact field/model/order/point/degree/certificate/evaluator encodings; U,V,k."
    output: "Actual W=phi_s alpha dual(phi_s)(X) or Y=phi_s(Q), plus executable costed decoder returning actual m."
    input_only_requirement: "No supplied Hom(E,C), calibrated ideal/bimodule, isogeny E->C, target O-action, private target frame, orientation, retained tau, sender map/dual, extra secret or target evaluator oracle; no exponential advice or preprocessing. A route may compute such data only from declared inputs, with executable steps, full costs and exact reduction arrows; a renamed hidden connecting subroutine is a missing obligation, not a positive candidate."
    admission_definition_lock: "Freeze the exact inherited conditional law before formulation analysis: unary lambda>=8, a=lambda, k=floor(lambda/2), D=2^lambda, N=5^b least >4D (N<=20D), represented F_{p^2}, prescribed congruent prime/source certification, E_star:y^2=x^3+x, L(lambda)=lambda^2 nonbacktracking degree-3 source law, saturation/division and map realization, public/secret certificate bytes, normalization/basis coins. Copy the prior exact admission record as declared input; explicitly freeze the unresolved L versus L+1 convention prospectively with before/after distinction. No silent law/encoding/evaluator change."
    retained_obligations: "Retain or discharge A_PRIME_SOURCE, A_ACCEPT (including q>=lambda^-2), A_SAT_DIV, A_SUPPORT, A_CERT, A_NORM and A_EVAL with exact quantifiers, falsifier, missing arrow and claim consequence. First accepted output is the complete single-trial law conditioned on acceptance; per-trial lambda^12 cap and lambda^3 trials give termination/failure accounting, not successful Setup. Separate capped conditional work from unlimited-retry mean w/q; q=0/all-bottom is not successful admission."
    quantifier_order: "One fixed uniform program, independent of the accepted instance and before every successful Setup/admitted key, every honest m and sender randomness; permitted recipient coins have an explicit uniform failure bound. Size variables include lambda, log p, log D, log N and total encoded input length; polynomial in D or N is not polynomial in their bit lengths. Setup/admission, transporter correctness, fiber and decoder failures are separate."
    cost_contract: "For every attempted route, report separate bit-time, memory, output length, preprocessing, field/rational-map/kernel evaluation, normalization, saturation/division, norm-equation/KLPT/enumeration and representation-conversion costs. Track intermediate coefficient/degree/modulus growth, factoring/smoothness assumptions and success amplification. D=2^lambda and N=Theta(D); small point output, fixed lattice rank, compact circuits/DAGs or exponential advice cannot hide evaluated work."
    decoder_contract: "Each route file must continue from its ACTUALLY RETURNED W/Y/map/kernel to actual m=s mod 2^k on exact U,V,k, with types, all-message correctness and separately costed failure. A point or abstract ideal is not plaintext; charge full labelled-action-to-map/kernel reconstruction, evaluations on U,V and smooth slope extraction if required. W=[D]Y requires exact invertibility/normalization conditions; give wrong-key, malformed point/certificate and adversarial input rejection behavior."
    retained_lemma: "Conditional alpha(P)=Q, W=[D]Y, strict N>4D normalized honest P1 singleton fiber/q_k=1; no construction/admission/secrecy inference."
