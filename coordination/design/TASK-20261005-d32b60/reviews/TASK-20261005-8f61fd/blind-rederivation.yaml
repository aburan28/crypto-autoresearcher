blind_rederivation:
  task_id: TASK-20261005-8f61fd
  goal_id: GOAL-SSI-2fa82a
  batch_id: BATCH-066c3b
  joints_owned: [J1, J2]
  scientific_runs: 0
  verdicts:
    J1: inconclusive
    J2: breaks
  scope: "Only the supplied admission/representation/cost joint and executable calibrated-response/message joint; no whole-claim or impossibility verdict."
  J1:
    accepted_law: |
      Let T be the complete capped single-trial tuple, including walk, point,
      representation, normalization and certificate coins, and A its acceptance
      event. For q=Pr(A)>0 and n=lambda^3, first acceptance has law
      Pr(output in S | some acceptance)=Pr(T in S | A). Unconditionally its
      mass is (1-(1-q)^n)Pr(T in S | A), with bottom mass (1-q)^n.
      If q=0, every output is bottom and the conditioned law is undefined.
      Endpoint weights sum all accepted word/coin preimages. They are not
      uniform endpoint weights and carry no inverse-automorphism correction.
      Under q>=lambda^-2, bottom probability <=exp(-lambda). This is a
      conditional bound, not evidence for the missing lower bound on q.
    setup_and_point_sampling: |
      p congruent to -1 modulo M0 implies p=3 mod 4, so z^2+1 is
      irreducible and F is F_(p^2). On the specified E_star, the stated
      scalar [-p] Frobenius supplies rational D,N torsion when certified;
      p is coprime to 2,3,5. Prime existence and uniform polynomial least-prime
      search/source construction are separate unproved A_PRIME_SOURCE premises.
      Uniform point slots give one accepted slot per actual point, including
      infinity, after discarding nonexistent roots and the duplicate zero slot.
      Hence accepted slots are uniform points. Projection and primitive pairing
      checks then define the retained ordered bases conditionally; all retries,
      roots and coins still count. Caps can reject the entire distribution.
    representation_and_certificates: |
      O must be the full integral End(E), represented by four actually evaluated
      labelled E-to-E maps, rational coordinates, integral multiplication table
      and complete certificates. A rational quaternion lattice alone is not O.
      Saturation must establish integrality, multiplicative closure and full
      discriminant p^2; rational division must provide denominator-kernel checks
      and exact evaluated-map identities. Increasing-length coefficient search
      has no stated uniform success or cost guarantee. Normalization requires
      global model selection plus simultaneous point/map transport, not merely
      selecting one convenient isomorphic model. Fixed serializers and semantic
      verifiers are explicitly unspecified: parse/certification completeness
      and polynomial work therefore cannot be independently instantiated.
      Missing verifier gives UNINSTANTIATED_CERTIFICATE_INTERFACE; invalid data
      gives INVALID. Plausibly incompatible wrong secrets have no universal
      rejection guarantee. Honest-domain claims cannot be extended to them.
    costs: |
      Write B for all input bytes/bits and H for Setup work. Each fully charged
      trial costs at most lambda^12, so n trials cost O(lambda^15)+H and have
      O(lambda^12) trial workspace/output, plus input storage and actual Setup
      workspace. Conditional on first acceptance, total trial work is still at
      most n*lambda^12; no q bound is needed for that deterministic ceiling.
      For iid complete trials of mean cost w, unlimited retry has expected
      cost w/q when q>0. The capped process has expected trial cost
      w*(1-(1-q)^n)/q. Neither formula proves efficient successful generation
      when q is unknown. Initial input reading and every verifier/evaluator
      operation must be included in the cap or separately charged.
      log D=lambda and log N=Theta(lambda); lambda<=log p<lambda^2.
      M0 has Theta(lambda) bits, but prime progression enumeration can have
      exponentially many candidates in these lengths. Degree-3^L dense walk
      maps are exponential in lambda^2, while a composition DAG can be compact;
      that does not make saturation, division or expanded polynomial identity
      checks polynomial. Every intermediate coefficient, evaluation, root,
      extension, factorization, map node, certificate, workspace and output bit
      must be charged. The cap forces rejection if these exceed it.
    support_and_admission: |
      Nonbacktracking words of positive length j number 4*3^(j-1).
      Lengths 0 through h give 1+sum_j 4*3^(j-1)=2*3^h-1=B_h words;
      endpoint identifications only reduce this count. Filtering this public
      polynomial set does not prove negligible mass on every other polynomial
      public support. A_SUPPORT, A_ACCEPT, A_SAT_DIV, A_CERT, A_NORM and A_EVAL
      remain assumptions about the same complete capped accepted law. J1 is
      inconclusive because its exact conditional distribution is specified,
      but existence, acceptance and uniformly efficient representations and
      interfaces are not established by the two authorized inputs.
  J2:
    source_action: |
      With genuine full maximal O and N prime to p, the torsion action
      O/NO -> End(E[N]) is the full matrix algebra: locally at 5 the maximal
      order is split. In the ordered P,Q basis, represent beta_i by M_i.
      Solve sum c_i*M_i*e1=e2 modulo N; SNF gives integral coefficients,
      and alpha=sum [c_i]beta_i is an integral E-to-E map with alpha(P)=Q.
      Pairings e(R,Q)=e(P,Q)^u and e(P,R)=e(P,Q)^v recover source coordinates.
      Five-power digit extraction and fixed-rank SNF are polynomial in bit
      lengths with implemented arithmetic; cap success needs actual evaluator
      and certificate costs. Dependent or incorrectly ordered bases invalidate
      this reasoning and must fail order/pairing/label checks.
    source_map_count: |
      The stated matrix extraction evaluates beta_i at P and Q: eight calls.
      A fresh direct evaluation of alpha(P) adds four beta_i(P) calls, totaling
      twelve in an uncached implementation. Reusing the eight evaluated points
      checks alpha(P)=Q with zero new source-map calls, so twelve is not an
      intrinsic exact count. Parser/certificate map checks add their own calls;
      optional W computation also incurs target/dual and alpha evaluations.
      Thus twelve is valid only for the uncached successful prefix convention,
      excluding all preprocessing and verification calls, not for total cost.
    conditional_identity: |
      For a compatible actual separable degree-D f:E->C, X=f(P), and its
      dual fdual:C->E, fdual(X)=[D]P. Endomorphism additivity gives
      alpha([D]P)=[D]Q. Applying f gives
      W=f(alpha(fdual(X)))=[D]f(Q)=[D]Y in C[N].
      Since gcd(D,N)=1, Y=[D^(-1) mod N]W. An E-to-E beta or alpha cannot
      be evaluated directly at X:C; a labelled C-to-C transport is essential.
    full_honest_fiber: |
      For any t in the declared fiber, transport phi_t through its witnessing
      F-isomorphism to g:E->C. Then deg(g)=deg(f)=D and (g-f)(P)=0.
      The positive definite degree quadratic form on Hom(E,C) gives
      deg(g-f)<= (sqrt(D)+sqrt(D))^2=4D. If g-f is nonzero, its kernel
      contains the cyclic subgroup of order N, forcing deg(g-f)>=N.
      Strict N>4D therefore forces g=f. Their cyclic D-kernels agree.
      In the ordered U,V basis equality of <U+tV> and <U+sV> forces t=s
      modulo D, by the first coordinate. Consequently the full honest
      normalized fiber is {s}, q_k=1 and fiber failure is zero on the stated
      domain. This proves uniqueness, not construction of the unique map.
    typed_programs:
      A: |
        HNF/SNF describe an integral primitive proper left O-ideal I_K with
        index D^2, reduced norm D and cyclic local type. Lattice checks do not
        produce its calibrated geometric f:E->C or f(P)=X. The supplied
        program returns MISSING_GEOMETRIC_IDEAL_SELECTOR. An extension must
        supply norm/degree selection, ideal-to-map realization, codomain
        isomorphism, column calibration and all verifications. KLPT is an
        uninstalled cost/interface here; an equivalent smooth ideal need not
        preserve prescribed degree D, target codomain or the P-to-X column.
        Charge T_norm,T_KLPT,T_enum,T_ideal_to_map and their success parameters.
      B: |
        Actual calibrated gamma_i=f beta_i fdual are C-to-C maps. They obey
        gamma_i gamma_j=[D]sum mu_ijl gamma_l, trace D*tr(beta_i), degree
        D^2*nrd(beta_i), and identity coordinates [D], plus involution data.
        The formal equations do not install integral simultaneous geometric
        realization. After full calibration, W=sum [c_i]gamma_i(X)=[D]Y;
        without it the supplied program returns
        MISSING_SIMULTANEOUS_GEOMETRIC_REALIZATION. Checking products alone
        permits abstract quaternion embeddings or conjugated actions unrelated
        to C. First-column calibration leaves matrix shears fixing e1;
        alternating-pairing/determinant constraints alone retain determinant-one
        shears. Centralizer/conjugacy ambiguity must be removed by actual
        common geometric f, exact curve/degree/polarization and column checks.
        Charge full quaternion realization, pairings, degree and codomain
        calibration, expanded identities, all four gamma evaluations and output.
      C: |
        TargetEndRingEval(C) would return full integral evaluated R=End(C),
        not a numeric abstract order. It is unavailable, so the supplied
        program returns MISSING_TARGET_ORDER_PROGRAM. Even an actual R does
        not provide the geometrically embedded left R/right O bimodule
        H=Hom(E,C), or a selected degree-D cyclic f with f(P)=X. The second
        stage also lacks GeometricHomRealizer and member selection and returns
        MISSING_CALIBRATED_HOM_REALIZATION. Charge target order construction,
        saturation/division, bimodule realization, exact norm/member selection,
        map output and target evaluation separately; existence is not a call.
    actual_message_path: |
      A or C can reach m only after a certified actual f (or evaluated kernel)
      is supplied. In map_decoder, A0=f(U), B0=f(V) satisfy A0+[s]B0=0.
      Cyclic kernel <U+sV> makes B0 order D. Thus H=[2^(a-k)]B0 has
      order 2^k and G=-[2^(a-k)]A0=[s]H=[m]H. At iteration j, already
      recovered low bits t make Z=[2^(k-1-j)](G-[t]H) either zero or
      J=[2^(k-1)]H according to bit j of m. Induction recovers m, and
      the final equality certifies it. Conditional failure is zero with total
      exact certified operations. Cost includes two full f evaluations,
      parser/map/degree/kernel/codomain checks and O(k^2+a) group operations,
      with their actual field bit costs, workspace and output lengths.
      A point-only W or Y is insufficient as a supplied program: inverse-D
      and basis/pairing checks yield a calibrated finite action but the stated
      FULL_LABELLED_ACTION_RECOVER call is unavailable. Charge T_full,M_full,
      B_full, embedding/model/kernel realization and then map decoding. The
      singleton fiber and smooth N do not implement this missing conversion.
    correctness_and_full_cost: |
      The fixed supplied A/B/C programs all return their explicit tagged
      missing-operation failures; response failure and actual-message failure
      are 1 on every admitted honest instance. J2 therefore breaks for those
      programs. No impossibility result follows for an implemented extension.
      Such an extension needs one uniform program fixed before all keys and
      messages, bounded epsilon_T, actual outputs, and bit bounds in lambda,
      log p,log D,log N,B. Charge preprocessing, verification, field/group/
      pairing/roots, source and target evaluation, global normalization,
      saturation/division, norm/KLPT/enumeration, all representation conversions,
      every degree/modulus/intermediate bit, workspace and output. Dense B maps
      of degree D^2*nrd(beta_i) can require exponential coefficient data.
      Enumerating D=2^lambda candidates costs exponential work even though
      log D is linear. Compact DAG size alone does not bound evaluation or
      expanded identity work. Per-attempt success eta requires T_attempt/eta
      and a uniform failure bound, not an unquantified solver label. Setup,
      admission, source evaluation, transport, conversion and decoding losses
      are separate from the zero conditional geometric fiber loss.
  symbolic_controls:
    execution: none
    cases:
      - control: all_bottom_capped_sampler
        expected: "q=0; bottom probability 1; accepted law undefined; A_ACCEPT fails."
        actual: "Same symbolic signature follows from the capped-law definition."
      - control: L_one_or_log_public_support
        expected: "Polynomial complete public endpoint support; support mass 1 if acceptance has positive mass."
        actual: "L=1 is fully rejected by the existing h filter; q=0. For L=O(log lambda), support has polynomial word count; if any survives, A_SUPPORT fails because its entire accepted mass lies there."
      - control: unique_but_unimplemented_lookup
        expected: "Singleton fiber with no algorithm still gives missing-operation bottom and message failure 1."
        actual: "A/B/C and the point-only decoder exhibit precisely this signature."
      - control: D_enumeration_or_doubled_DAG
        expected: "D enumeration exponential; compact output does not excuse node/evaluation/identity work."
        actual: "D=2^lambda gives 2^lambda candidate steps; DAG evaluation is charged by actual nodes and intermediates, and expanded identities may still be degree-sized."
      - control: wrong_codomain_operator
        expected: "Evaluating beta_i:E->E at X:C fails labels; no transported response."
        actual: "Typed evaluator rejects that operation; only calibrated gamma_i:C->C can act at X."
      - control: dependent_or_wrong_order_torsion
        expected: "Order/primitive-pairing failure, not a valid coordinate solver or decoder."
        actual: "Parser rejects; source SNF/fiber and map-decoder premises do not apply."
      - control: malformed_inconsistent_certificate_or_U_V_k
        expected: "INVALID or UNINSTANTIATED_CERTIFICATE_INTERFACE; do not claim honest-domain correctness."
        actual: "Exactly those branches are specified; plausible undetected wrong secrets lack universal rejection."
      - control: constant_two_message_view
        expected: "If one view admits two distinct low-bit messages, q_k>=2 and deterministic uniform decoding cannot be correct for both."
        actual: "Excluded on the proved honest strict-N domain; under that altered control, uniform two-message success <=1/2 and claimed singleton fiber breaks."
      - control: identity_or_public_inverse_view
        expected: "Actual public inverse or evaluated compatible kernel supplies a concrete message route; mere named inverse supplies none."
        actual: "Identity with D=1 is outside these D=2^lambda keys. Under an altered identity/public-inverse control with the necessary evaluated action, conversion is available and slope decoding works; this does not implement the present missing operations."
