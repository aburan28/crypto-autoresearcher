attack_matrix:
  task_id: TASK-20261005-b5fb7c
  scope: J3/J4/J5; symbolic adversarial audit, zero scientific/implementation/formal runs
  evidence_aliases:
    overview: transporter-formulations.md
    admission: admission-encodings.yaml
    A: ideal-transporter-algorithm.yaml
    B: torsion-calibration-algorithm.yaml
    C: target-order-realization.yaml
    statement: blind-statement.yaml
    gates: attack-gates.yaml
    provenance: provenance.yaml
  route_controls:
    - id: A-IDEAL
      route: A
      represented_premises: Actual full integral evaluable O=End(E),public labelled E,C,P,Q,X,U,V,D,N,k; no connecting ideal/map or geometric Hom
      expected_signature: Compute primitive cyclic norm-D left ideal with index D^2,realize exact degree-D E->C,calibrate f(P)=X,verify and evaluate
      actual_signature: MISSING_GEOMETRIC_IDEAL_SELECTOR after finite ideal/geometric constraints; candidate checks cannot select a candidate
      hidden_work: Geometric endpoint/column selector,ideal-to-kernel/chain conversion,division,saturation,global and fixed-model normalization,degree/kernel certification
      cost_and_message: T_select,T_norm,T_KLPT,T_real,T_sat,T_div and coefficient/output bounds absent; bottom -> TRANSPORT_FAILED -> no m
      evidence: A.construction,A.cost_table,A.decoder
    - id: A-KLPT
      route: A/C
      represented_premises: Supplied integral rank-four lattice,exact norm/cyclic type,known factors of D and N
      expected_signature: Any norm/KLPT substitution preserves exact degree D,normalized C and sender first column,with realized evaluators and success law
      actual_signature: No norm/KLPT program adopted; equivalent smooth ideals are expressly insufficient for these geometric conditions
      hidden_work: Auxiliary norm factoring/smoothness,coefficient growth,codomain matching,exact-degree recalibration and all attempt-cost/inverse-success factors
      cost_and_message: Fixed rank is no bit-time or evaluated-output certificate; ideal label alone has no m path
      evidence: A.construction.exact_norm,C.cost_table,gates.controls.fixed_rank_norms_KLPT
    - id: B-SHEAR
      route: B
      represented_premises: N=5^b coprime to D,rank-two rational N-bases,full source matrices M_i,unknown target action and T with first column X and det(T)=D
      expected_signature: Scaled quaternion/product/involution/pairing checks must not silently fix the missing target identification
      actual_signature: T'=T*S_u,S_u=[[1,u],[0,1]] preserves first column and determinant; gamma_i'=D*T'*M_i*T'^(-1) obeys scaled products. For A*e_1=e_2,W'=D*T'*e_2=W+D*u*X.
      hidden_work: Select and realize sender-compatible integral C maps with common geometric degree-D calibration; scalar centralizer applies only after both labelled actions are fixed
      cost_and_message: There are N formal shears; enumerating them is exponential in lambda. No claim all shears lift to honest maps. Actual B returns MISSING_SIMULTANEOUS_GEOMETRIC_REALIZATION,then no m.
      evidence: B.construction,B.ambiguity_audit,B.cost_table
    - id: B-LIFT
      route: B
      represented_premises: Scaled trace,norm,product,identity and involution equations plus exact curve/degree/polarization/common-codomain equations
      expected_signature: Produce actual integral C->C gamma_i with labelled evaluators,not only finite matrices or a unique abstract solution
      actual_signature: No integral geometric realization solver; dense parameterization uses degree D^2*nrd(beta_i) maps with degree-sized coefficient data
      hidden_work: Map identity verification,rational division/integrality,common embedding/calibration and circuit evaluation/intermediate bounds
      cost_and_message: Short equations or log-degree do not bound dense elimination or evaluated work; even W/Y needs missing full-action decoder
      evidence: B.construction.dense_elimination_attempt,B.cost_table,B.decoder.point_only_program
    - id: C-ARROWS
      route: C
      represented_premises: Only source evaluators on E and public C; Hom(E,C) has left End(C)/right O variance
      expected_signature: public C -> evaluated integral End(C) -> geometric labelled Hom(E,C) -> cyclic norm-D f with f(P)=X -> evaluations -> m
      actual_signature: First arrow returns MISSING_TARGET_ORDER_PROGRAM; even supplied R reaches MISSING_CALIBRATED_HOM_REALIZATION
      hidden_work: Target-order computation,geometric order embedding,integral Hom intersection/norm member selection,realization and exact sender calibration
      reduction_direction: Evaluated f/dual -> rational theta_f is forward; saturation/division is additionally needed for full integral End(C). No reverse equivalence is adopted from a name or existence theorem.
      cost_and_message: T_EndC,T_Hom,T_normD,T_realization,T_calibration and all success/output bounds absent; R alone -> MISSING_CALIBRATION -> no m
      evidence: C.construction,C.reduction_direction_audit,C.cost_table
    - id: ERASE-SECRETS
      route: A/B/C
      represented_premises: Erase tau,dual(tau),walk,ideals,orientation,Hom anchor,sender map/dual,target action/private frame and all target oracles
      expected_signature: No implicit map constants or per-instance advice survive erasure
      actual_signature: Only beta_i:E->E evaluate; attempting to apply them on C or introduce unknown Hom/target nodes returns tagged failure
      cost_and_message: Public End(E_star) needs its erased correspondence to E and C. No geometric target response or m follows from source algebra alone.
      evidence: admission.visibility,admission.evaluator_contract,A.input_types,B.input_types,C.input_types
  public_and_output_controls:
    - id: PUBLIC-CONNECTION
      expected_signature: Remove O; supply public evaluated calibrated f/dual of degree D with correct labels; same response/map-to-m task becomes public
      actual_signature: Y=f(Q) uses no alpha/O. f(U),f(V),certificate checks and binary digits recover m. W sandwich may use source alpha,but is unnecessary for the same message output.
      premises_cost: Exact f(P)=X,cyclic kernel,models,known D/N factors,full charged map/dual verification/evaluations and two map-decoder calls
      interpretation: Extra-input control exposes no recipient asymmetry and is not an attack on the original missing-connection interface
      evidence: gates.controls.public_Hom,A.decoder.conditional_map_program
    - id: PUBLIC-INVERSE
      expected_signature: Supplied actual W in C[N] and gcd(D,N)=1 yield public Y=[D^(-1) mod N]W
      actual_signature: Ordinary modular inversion/scalar multiplication; this does not construct W or implement full-action recovery
      premises_cost: Membership/order/model checks,integer/scalar costs and subsequent decoder work; invalid N/order rejects before inversion
      interpretation: Correct public inverse is no security or asymmetry result
      evidence: A.response_contract,gates.controls.public_inverse_reencryption
    - id: PUBLIC-FULL-ACTION
      expected_signature: Supplied true Y with X gives complete labelled (P,Q)->(X,Y),with pairing determinant D; recovery requires an exact implemented theorem/program
      actual_signature: All three point-only programs return MISSING_FULL_ACTION_DECODER even for genuine Y
      premises_cost: Smooth known coprime D,N,N>D,rational rank-two N/D torsion,kernel ranks,exact product/curve/embedding models,preprocessing,representation/output sizes,T_full/M_full/B_full
      interpretation: Robert/Maino-style source claims are not verified here; one-column nonadmission does not prove hardness
      evidence: A.decoder.point_only_program,B.decoder,C.decoder,gates.controls.full_labelled_action
    - id: PUBLIC-REENCRYPT
      expected_signature: Remove O; enumerate public s in [0,D),construct quotient maps,match normalized C,X and output low-k slope
      actual_signature: A finite public computation exists conditionally on public arithmetic/normalization,but costs D quotient constructions and conversions in the worst case
      premises_cost: U,V labelled basis,known 2-power factorization,degree-2 chains,normalization,isomorphisms,verification,map evaluations,streamed memory and output
      interpretation: Repeats F3; D=2^lambda is not polynomial bit-time and yields no successful recipient advantage
      evidence: gates.controls.public_inverse_reencryption,overview
    - id: MAP-TO-M
      expected_signature: Supplied actual certified sender f yields f(U)=-s*f(V),ord(f(V))=D,H=[2^(a-k)]f(V),G=-[2^(a-k)]f(U),then k binary digits of G=m*H
      actual_signature: The conditional bit loop has correct residual checks and returns m; no submitted route actually supplies f
      premises_cost: Exact degree/cyclic-kernel/codomain/column certification,two full f evaluations and O(k^2+a) group operations with field/intermediate work
      interpretation: A charged conditional decoder is not an end-to-end transporter; W/Y alone,ideal/order/Hom labels and symbolic DAGs fail the output gate
      evidence: A.decoder,B.decoder,C.decoder,statement.map_decoder
    - id: COMPACTNESS
      expected_signature: Small point output,rank-four lattice or compact DAG cannot substitute for evaluated operation semantics
      actual_signature: Target evaluators absent; unknown nodes fail; dense degree-D maps can require Theta(D) coefficient slots
      premises_cost: Charge input bits,node calls,identity expansions,extension fields,denominators,intermediate bits,memory,output and all conversions
      interpretation: No fixed-rank or output-size polynomial certificate is promoted
      evidence: admission.evaluator_contract,A.cost_table,B.cost_table,C.cost_table
  security_controls:
    - id: EXACT-LAW
      expected_signature: Challenge/public law includes selected total-L walk,acceptance caps,all representation/basis/normalization/certificate coins and frozen executable serializers
      actual_signature: Total L is explicit; Sigma_pub/Sigma_sk and semantic verifiers remain parameterized and uninstantiated; all seven admission obligations retained
      message_trace: Missing verifier -> UNINSTANTIATED_CERTIFICATE_INTERFACE -> bottom; q=0 -> key abort 1; no admitted positive response probability follows
      evidence: admission.prospective_freeze,admission.acceptance_bookkeeping,statement.KeyGen
    - id: SUPPORT-DISTANCE
      expected_signature: Witness-free EndRing challenge simulator gives exact auxiliaries or explicit distance delta,support overlap and evaluated witness pullback
      actual_signature: No simulator or values supplied. For public event S,TV(T(D_ER),D_PK)>=abs(Pr[T(D_ER) in S]-Pr[D_PK in S]); mixing and erasure alone do not discharge this.
      message_trace: Bare curve marginal cannot justify augmented-law decryption success or reverse extraction
      evidence: gates.controls.exact_augmented_law_bridge
    - id: REDUCTION-DIRECTION
      expected_signature: Separate EndRingEval solver -> completed transporter -> verified decrypt attack from IND adversary -> evaluated EndRing witness extraction
      actual_signature: Forward attack upper bound is conditional on missing transport/decoder,exact-law simulation,detected aborts and conversion losses; reverse security reduction is absent
      advantage: The conditional stated lower bound max(0,(rho-epsilon-delta)/2) requires verified successful decryption and charged losses; current transport supplies no positive rho
      message_trace: Message-revealing encryption can satisfy a solver-to-decrypt arrow without security; current arrow certifies neither secrecy nor an equivalence
      evidence: gates.reduction_map,C.reduction_direction_audit
    - id: REACHABLE-QUOTIENT
      expected_signature: Account every reachable secret-dependent validation/source/target/decoder call and recover an evaluated EndRing witness if claiming reverse security
      actual_signature: Finite source matrices support alpha only after verification; no compact transcript evaluator answers geometric selectors,End(C),Hom or all target calls
      message_trace: A sufficient decryption quotient does not imply recovery of full integral evaluated O; reverse arrow absent
      evidence: gates.controls.reachable_quotient
    - id: COLLISION-LABEL
      expected_signature: Correctness uses complete labels and all compatible normalized degree-D maps; no unlabelled object silently denotes two evaluated outputs
      actual_signature: Strict N>4D supports the disclosed honest singleton fiber conditionally; formal shears are not geometric collisions. Constant pairing alone identifies all messages and cannot support all-message decoding.
      message_trace: Fiber/uniqueness and quaternion coordinates do not compute calibrated target maps; inconsistent labels reject
      evidence: gates.proof_search_map.observation_collision,gates.controls.collision_label_transport
    - id: WRAPPER
      expected_signature: Native encryption wrapped around an EndRing-derived key still needs adversary-to-EndRing extraction
      actual_signature: No wrapper adopted and no native-game assumption silently transferred
      message_trace: Solver access or source-order secrecy alone supplies no security theorem
      evidence: gates.controls.generic_wrapper,gates.reduction_map
    - id: ADMISSION-SMALL-SUPPORT
      expected_signature: Count caps and rejection under the same law; distinguish public replay support from large word count
      actual_signature: q=0 aborts; L=1 control with current screen rejects all endpoints. Removing screen gives four public neighbors; logarithmic length gives polynomial word support only with charged realization costs. Target L word count/short-ball exclusion gives no entropy or public lower bound.
      message_trace: Conditional correctness can be vacuous; no successful Setup/KeyGen or asymmetry follows
      evidence: gates.controls.admission_all_bottom_small_support,admission.obligations
  malformed_controls:
    contract_status: Symbolic required rejection/failure contracts; no concrete complete serializers/verifiers or execution tests supplied
    common_trace: Detected failure -> tagged bottom -> transport/decoder failure -> no actual m; no certificate blob is trusted when its verifier is unavailable
    rows:
      - {control: wrong_field_or_encoding, expected: reject noncanonical residues,field tags,prime/arithmetic mismatch or truncation, actual: INVALID_ENCODING_OR_FIELD_OR_CURVE or unavailable-verifier failure}
      - {control: wrong_curve_or_codomain, expected: reject singular curve,off-curve X,mismatched E/C/map labels, actual: INVALID_TARGET or INVALID_ENCODING_OR_FIELD_OR_CURVE}
      - {control: invalid_order, expected: reject nonintegral table,multiplication/trace/norm/involution/map-identity discrepancy, actual: INVALID_ORDER_OR_CERTIFICATE or INCONSISTENT_ACTION}
      - {control: invalid_or_dependent_torsion, expected: verify exact known 2/5-power orders and primitive pairings of U,V,P,Q,X, actual: INVALID_BASIS or INVALID_TARGET; no slope decoder admitted}
      - {control: wrong_degree_D_or_N, expected: enforce D=2^a,N=5^b>4D,gcd(D,N)=1 and certified exact cyclic degree-D map, actual: INVALID_TARGET; absent degree verifier yields failure rather than admission}
      - {control: quaternion_or_pairing_violation, expected: reject scaled products,identity,involution,trace/norm or determinant-pairing mismatch, actual: INCONSISTENT_ACTION; satisfying finite equations alone still fails realization}
      - {control: forged_certificate, expected: use fixed semantic verifier and charge all checks, actual: invalid certificate rejects; missing verifier gives UNINSTANTIATED_CERTIFICATE_INTERFACE}
      - {control: connection_leaking_certificate, expected: exact public schema excludes ring maps,connections,orientation,frames and responses, actual: no concrete schema/nonleakage verifier exists; A_CERT retained; such bytes must not be called the original accepted law}
      - {control: wrong_secret_key, expected: reject detected domain/table/action mismatch, actual: detected mismatch rejects; plausible incompatible secret has no universal authenticated rejection guarantee}
      - {control: inconsistent_U_V_k, expected: enforce a=lambda,k=floor(a/2),ranges,D,bases and ord(H)=2^k, actual: INVALID_MESSAGE_INTERFACE or SLOPE_SHAPE/SLOPE_CHECK; no unchecked m}
      - {control: syntactically_valid_nonhonest_ciphertext, expected: do not infer X=phi_s(P) from syntax/order alone, actual: honest-domain theorem gives no correctness/negligible-failure or universal rejection outside that domain}
