      - {route: B, delta: simultaneous integral geometric target-map equations, F1_repetition: solve only finite target second column/shear, F2_repetition: formal gamma_i or symbolic unknown-target circuits, F3_repetition: enumerate slopes or N shears/frames, submitted_computation: finite source/scaled relations then bottom}
      - {route: C, delta: evaluated target-order/geometric Hom/member-selection interfaces, F1_repetition: unresolved final finite-frame calibration, F2_repetition: abstract embedding/bimodule/theta_f without evaluator, F3_repetition: replace EndC/Hom/norm operations with public D replay, submitted_computation: missing target-order call then bottom}
