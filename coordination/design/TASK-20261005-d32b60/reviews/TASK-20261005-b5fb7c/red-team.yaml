  scope: J3/J4/J5 adversarial review of the submitted zero-finalist packet only
  evidence_boundary: Ten isolated snapshot files; no repository scientific inputs, history, prior reviews or sibling reports opened
  packet_result: Three partial formulations, no evaluated transporter, no actual-m program on the admitted honest interface, one retained obligation
  verdict_meaning: holds below means the submitted negative accounting survives the owned audit; it does not certify a successful construction, security reduction or impossibility
  joint_findings:
    J3:
      scoped_result: holds
      finding: The packet exposes rather than executes the missing geometric connection work and does not convert uniqueness, finite relations or a subroutine name into a polynomial algorithm.
      A: A left ideal annihilating the cyclic kernel has index D^2 and reduced norm D, but O,E,C,X do not come with a represented selector for the endpoint-and-column calibrated ideal. Candidate lattice checks do not construct that ideal. Equivalent KLPT ideals or altered smooth norms require exact degree/codomain/column recalibration and evaluated realization.
      B: With source matrices M_i fixed and target action unknown, simultaneously conjugating the target representatives and identification preserves scaled product and involution constraints. T -> T*S_u preserves its first column and determinant, while the response changes by D*u*X. This is a finite-module control, not an exhibited second geometric degree-D sender map.
      C: An evaluated connecting f induces theta_f(u)=f*u*dual(f)/D. Obtaining integral evaluated End(C) also needs saturation/division. The reverse arrows public C -> evaluated End(C) -> geometric Hom(E,C) -> calibrated degree-D member are separate and absent. Abstract order or bimodule coordinates do not identify evaluators on the supplied curves.
      erased_input_audit: Removing tau,dual(tau),ideals,Hom anchors,orientations,target action,private frames,sender f/dual and target oracles leaves exactly the disclosed missing operations; none is available as a constant.
      actual_m: Every actual route returns bottom. Even a supplied genuine Y reaches MISSING_FULL_ACTION_DECODER in the point-only branch. A supplied certified sender-compatible f permits the conditional two-evaluation binary slope decoder; it is extra input.
      cost_boundary: Known 2/5-power factors and fixed-rank finite arithmetic do not bound geometric norm search, realization, coefficient growth, normalization, factoring auxiliary norms or inverse solver-success factors. D=2^lambda and N=Theta(D); enumeration or dense degree-sized maps is not bit-polynomial.
    J4:
      scoped_result: holds
      finding: Correctness and honest singleton fibers are consistently separated from asymmetry and security. The conditional solver-to-decrypt direction is an attack upper bound with an unavailable transporter, while adversary-to-EndRing extraction is absent.
      public_comparison: Without O, a public evaluated connection still computes f(Q) and the same map-to-m decoder. Public W -> Y is a scalar inverse. Exhaustive public slope replay computes a message with exponential worst-case work when its arithmetic and normalization are charged. No submitted successful recipient algorithm establishes an asymmetry.
      law_boundary: The selected walk has exactly lambda^2 total edges. The accepted law includes all representation,basis,normalization and certificate coins, but concrete Sigma_pub/Sigma_sk serializers and semantic verifiers are absent. q=0 gives abort 1; caps give termination rather than successful admitted mass.
      reduction_boundary: An exact-law challenge simulator must reproduce auxiliary public bytes, bound support/distance and costs, and pull back an evaluated EndRing witness. No such simulator, distance, extractor or positive success/advantage value is supplied.
      malformed_boundary: Detectable encoding/domain/order/basis/degree/algebra/pairing/certificate/message mismatches propagate to bottom and never m. An unavailable verifier also propagates to bottom. These are required contracts, not independently executable rejection procedures; plausible incompatible wrong keys and syntactically valid nonhonest ciphertexts have no universal rejection theorem.
      proves_too_much: Public connections,constant pairing observations,compact DAGs,finite centralizers,degree-incorrect ideals and generic encryption wrappers do not establish the claimed functionality or security. The packet does not promote these controls into positive results.
    J5:
      scoped_result: inconclusive
      finding: Internal provenance and nonduplication/claim hygiene can be checked, but independent version-bound primary-source verification cannot be completed from this snapshot.
      exact_impediment: No primary text bytes,primary SHA-256,URL or exact archived revision locator is supplied for the named literature. The POKE row discloses identifier 2024/624 and Section 4 PKE, but not the archived revision,hash or its retrievable location. A current revision would not verify that archived-versus-correction boundary. Internal note paths and their hashes are not authorized primary retrieval locators.
      affected_claims: SETA/FESTA/POKE/PIKE/SiGamal/C-SiGamal/LIT-SiGamal interfaces and assumption/version boundaries; Robert/Maino full-action and EndRing/path claims; any applicable norm/KLPT/target-order theorem
      nonduplication: A/B/C start from different geometric objects, but provide no new completed computation. Their F1/F2/F3 normalization is accurate relative to the disclosed summaries. This is an interface/accounting delta, not a demonstrated novel algorithm or exhaustive prior-art finding.
      claim_hygiene: The three IDEA controls stay proposed; inherited source-reader labels are not upgraded; novelty,Pareto improvement,practicality and security remain unverified; no universal failure claim is asserted.
  observations:
    - id: RT-SOURCE-1
