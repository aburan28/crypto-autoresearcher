      detail: Degree,maximality,map-identity,scalar-Frobenius and global-normalization verification cannot be accepted as executable solely because tags are listed. A_CERT/A_EVAL/A_NORM correctly retain this limitation.
    - id: RT-CUSTODY-1
      severity: limited_independent_binding
      detail: All eight producer hashes match SNAPSHOT-RECEIPT.json. The receipt has commit_sha null and a Git-resolution instruction; forbidden history reads prevent independent resolution of the pushed commit or its exact changed-path assertion. Parent and record-ID fields are packet bindings,not independently reverified Git facts.
