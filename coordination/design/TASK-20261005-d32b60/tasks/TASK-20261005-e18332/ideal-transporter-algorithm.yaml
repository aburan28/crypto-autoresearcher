mechanism: ONE_M2_calibrated_source_to_target_transport
input_types:
  secret: full integral represented O=End(E),four evaluable beta_i:E->E,rational coordinates,multiplication table,secret certificates
  public: represented F,E,C,X:C[N],P,Q:E[N],D=2^a,N=5^b>4D,U,V:E[D],k=floor(a/2),a=lambda>=8,public encodings/certificates
  excluded: Hom(E,C),connecting ideal/map/dual,calibrated target action/frame/orientation,retained tau,extra secret,target oracle,instance advice
source_prefix:
  pseudocode: |
    Parse all public/secret fields under fixed serializer/verifier parameters.
    Verify domain tags,field,curves,order/map certificates,orders and primitive pairings.
    If a verifier is unavailable return bottom(UNINSTANTIATED_CERTIFICATE_INTERFACE).
    Evaluate beta_i(P),beta_i(Q) on E for i=1..4, charging all source evaluator work.
    Let zeta=e_N(P,Q); extract x,y using e_N(R,Q)=zeta^x,e_N(P,R)=zeta^y by 5-power digits.
    Assemble M_i in M_2(Z/NZ).
    Solve sum c_i M_i e_1=e_2 modulo N using integer SNF.
    Select lexicographically least residue c by successive coordinate gcd/SNF restrictions, without enumeration.
    Define alpha=sum_i[c_i]beta_i:E->E; evaluate alpha(P) and require alpha(P)=Q.
    Return (alpha,c,M_i,A=sum_i c_i M_i).
  solvability: Conditional on genuine full maximal integral O,prime-to-p N and full evaluated action; the local unramified action modulo N is full M_2(Z/NZ).
  cap: lambda^12 bit operations/random-bit reads per partial route prefix; overflow returns bottom(PREFIX_CAP)
  source_cost: twelve complete source-map evaluations including alpha(P),pairings,smooth digits,fixed-size SNF and all certificate work
response_contract:
  requested: evaluated W=phi_s alpha dual(phi_s)(X) or Y=phi_s(Q),both points on the exact C model
  identity_premises: honest separable degree-D phi_s:E->C,its evaluated dual,alpha(P)=Q,X=phi_s(P),compatible model transports
  identity: W=[D]Y
  inverse: Y=[D^(-1) mod N]W only after verifying W in C[N],since gcd(D,N)=1
  identity_limitation: no target map/evaluator is constructed by the equation
decoder:
  actual_partial_output: bottom propagates to bottom(TRANSPORT_FAILED); message failure 1 on every admitted honest instance
  conditional_map_program: |
    Receive an actually evaluated certified f:E->C of degree D, f(P)=X, cyclic kernel <U+sV>.
    Check all labels,degree,kernel rank,point/order certificates; unavailable verification returns bottom.
    Set A0=f(U),B0=f(V) on C; require ord(B0)=D.
    Set H=[2^(a-k)]B0,G=-[2^(a-k)]A0 on C[2^k]; require ord(H)=2^k.
    Set t=0,J=[2^(k-1)]H.
    For j=0..k-1:
      Set Z=[2^(k-1-j)](G-[t]H).
      If Z=0 set d=0; else if Z=J set d=1; else return bottom(SLOPE_SHAPE).
      Set t=t+d*2^j.
    Require [t]H=G; return t in [0,2^k), otherwise bottom(SLOPE_CHECK).
  conditional_map_correctness: f(U)=-[s]f(V),ord(f(V))=D,so G=[s mod 2^k]H=[m]H; all honest m,r decode exactly after certified f.
  conditional_map_cost: two full evaluated f calls plus certificate/kernel verification and O(k^2+a) group operations,with all field/intermediate/model work charged
  point_only_program: |
    If output is W verify W in C[N], then set Y=[D inverse modulo N]W on C.
    If output is Y verify (X,Y) is a rank-two N-basis and its pairing matches e_N(P,Q)^D.
    Require an implemented FULL_LABELLED_ACTION_RECOVER(E,C,P,Q,X,Y,D,N,U,V) returning evaluated f or evaluated D-kernel.
    No such program is supplied in this route; return bottom(MISSING_FULL_ACTION_DECODER).
  point_only_premises: smooth known coprime D,N,N>D,full rational labelled N-bases,rational D-basis,verified kernel ranks,exact product/curve models,embedding/output preprocessing
  point_only_cost: T_full,M_full,B_full plus inverse-D,basis/pairing validation,two f evaluations and slope digits; none of T_full,M_full,B_full is assigned a polynomial bound here
  point_only_failure: epsilon_full+epsilon_model+epsilon_decode by union bound; unavailable program gives actual message failure 1 even for supplied genuine Y
  nonpoint_output: abstract ideal,bimodule,order,formal gamma or unevaluated kernel name is not plaintext; realize/evaluate/calibrate before decoder
quantifiers:
  desired: exists one fixed uniform program and polynomial bounds first; forall successful Setup,admitted complete keys,all honest m,r; recipient coins have uniform failure <=epsilon_T(lambda)
  sizes: lambda,ceil(log p),ceil(log D),ceil(log N),B=total encoded input bits; polynomial in D or N is not sufficient
  partial_failure: deterministic bottom on every admitted honest input; target-response and actual-message failure 1
  fiber: for complete normalized honest observation z=(C_s,phi_s(P)),F_z={s},q_k(z)=1 only with strict N>4D and all compatible degree-D maps/target isomorphisms
  separate_losses: no successful Setup/q bound; key abort (1-q)^(lambda^3); mathematical honest fiber failure 0; source,cost,transport,conversion and decoder failures separate
invalid_controls:
  invalid_field_curve_encoding: bottom(INVALID)
  invalid_order_certificate: bottom(INVALID_ORDER); missing certificate verifier returns UNINSTANTIATED_CERTIFICATE_INTERFACE
  dependent_wrong_order_bases: bottom(INVALID_BASIS)
  wrong_X_domain_order_modulus_degree: bottom(INVALID_TARGET)
  violated_quaternion_pairing_identities: bottom(INCONSISTENT_ACTION)
  inconsistent_U_V_k: bottom(INVALID_MESSAGE_INTERFACE)
  wrong_key: reject detected source/domain/action mismatch; no universal wrong-key detection is asserted for plausible but incompatible data
  syntactically_valid_nonhonest_input: no guaranteed inverse; return failure on failed checks and no correctness theorem otherwise
route_id: A
formulation: geometric_left_O_ideal_reconstruction_and_realization
attempt_status: ATTEMPTED_PARTIAL_CONSTRUCTION
selected_finalist: false
construction:
  ideal_convention: I_K={u in O:u(R)=0 for every R in K}; postcomposition makes this a left O-ideal.
  sought_object: integral proper primitive left O-ideal I with nrd(I)=D,[O:I]=D^2,geometric realization f_I:E->C of cyclic degree D and f_I(P)=X
  right_order: O_R(I) is a represented lattice in End^0(E); its geometric identification with End(C) requires the realized connection.
  exact_norm: Equivalent ideals of different smooth norm do not automatically preserve D,cyclic kernel,normalized C or first-column X.
  pseudocode: |
    Run source_prefix and propagate every failure.
    Record O's integral multiplication matrices and reduced norm form.
    Define the ideal constraints: left stability,integrality,index D^2,reduced norm D,primitive cyclic local type.
    Define the geometric constraints: realize I on E as f_I of degree D,then normalized codomain C and f_I(P)=X.
    Fixed-rank HNF/SNF checks verify a supplied candidate ideal, but no candidate is supplied.
    The geometric codomain/column constraints have no represented algebraic selector in the input.
    Return bottom(MISSING_GEOMETRIC_IDEAL_SELECTOR).
  actual_returned_object: tagged bottom; constraint description is diagnostic,not a computed ideal,map,W,Y or m
  conditional_continuation: |
    If a selector COMPUTED I from the declared inputs,verify its lattice/index/norm/cyclic type.
    Realize I via explicit kernel tests and division or a charged smooth chain,not an abstract ideal-class label.
    Enumerate all fixed-model isomorphisms into observed C and retain the one with f_I(P)=X.
    Verify f_I's degree,kernel and labels; otherwise bottom(NO_CALIBRATED_REALIZATION).
    Return (f_I,Y=f_I(Q)); optional W uses evaluated dual(f_I),alpha and f_I with every call labelled.
    Pass f_I to decoder.conditional_map_program to return actual m.
  missing_arrows:
    - (represented O,E,C,X,D) -> calibrated geometric norm-D ideal I without connection advice
    - represented I -> evaluated degree-D cyclic map/kernel on E with exact models,controlled division and output costs
    - right-order isomorphism or equivalent KLPT ideal -> exact sender-compatible f(P)=X,degree D
  not_assumed: no IdealForCurve(C),connecting isogeny,Hom anchor or target embedding oracle
nonduplication_normalization:
  finite_target_frame: geometric ideal selector is distinct; choosing a target torsion complement/shear to calibrate realization would fall back to F1
  symbolic_sandwich_DAG: ideal HNF and norm form are distinct; naming an unevaluated realization or sandwich falls back to F2
  exhaustive_public_lookup: looping over D slope kernels or candidate realizations to match C,X falls back to F3 and is excluded as finalist
  present_route: missing geometric selector is exposed; no excluded fallback is adopted
cost_table:
  bit_time: actual partial prefix <=lambda^12 plus charged input parsing; uncapped T_verify+T_source+poly(B,log p,log D,log N) for represented finite constraints
  memory: B+maximum verifier/source workspace+fixed-rank rational/HNF workspace; capped transient allocations <=lambda^12
  output_length: constant tagged bottom; a conditional HNF has four vectors whose integer bit lengths must be bounded,not four free words
  preprocessing: field,primality/source,roots,pairings,factorizations,quaternion coordinates and O representation/certificates all charged
  field_rational_map_kernel_evaluation: absent target evaluation; conditional realization cost T_real and map/dual/source evaluations remain explicit
  normalization: H_global for global least-model selection plus H_iso for all fixed-model isomorphisms and coordinate/map transports
  saturation_division: T_sat,T_div for ideal kernels/rational divisions and exact identities; inherited source saturation retained separately
  norm_equation_KLPT_enumeration: T_select+T_norm+T_KLPT,none supplied or bounded; fixed rank alone bounds no norm-representation,codomain-match or success probability
  representation_conversion: T_I_to_kernel+T_kernel_to_chain+T_order_embedding; an O_R lattice is not evaluated End(C)
  intermediate_growth: index D^2 gives O(log D) for that scalar,but selected basis coefficients,denominators,norm-solutions,smooth replacement degrees and realization coefficients need separate bounds
  dense_map_warning: degree-D rational map expansion can have Theta(D) coefficient slots; no polynomial output/evaluation claim in log D from such expansion
  factoring_smoothness: D=2^a,N=5^b have known factors; p+1 cofactors,auxiliary norms and KLPT smoothness are not granted efficient factoring or a distribution law
  amplification: no proved per-attempt success eta; if later eta>0,total work T_attempt/eta and rejection/amplification losses must be charged on this exact law
  conditional_decoder: T_real+H_global+H_iso+T_cert+2*Eval_f+O(k^2+a)*group_bit_cost; optional W adds Eval_dual+Eval_alpha+Eval_f
correctness_boundary:
  actual: no evaluated response is returned; target/message success 0 on admitted honest inputs
  conditional: a certified realized f with degree D and f(P)=X equals honest phi_s by strict N>4D; then Y and map decoder are correct for every m,r
  probability: no uniform ideal selection/realization failure bound; uniqueness of calibrated f is not a construction
admission: A_PRIME_SOURCE,A_ACCEPT,A_SAT_DIV,A_SUPPORT,A_CERT,A_NORM,A_EVAL all retained
