construction:
  objects: unknown domain-labelled evaluable integral gamma_i:C->C representing phi_s beta_i dual(phi_s),not just matrices on C[N]
  source_relations: beta_i beta_j=sum_l mu_ijl beta_l; dual involution determined by represented order and polarization
  target_relations:
    product: gamma_i gamma_j=[D] composed with sum_l[mu_ijl]gamma_l
    trace_norm: tr(gamma_i)=D*tr(beta_i),deg(gamma_i)=D^2*nrd(beta_i)
    identity: gamma_1=[D] only in a basis where beta_1=1; otherwise require the supplied integral identity coordinates
    involution: dual(gamma_i)=phi_s dual(beta_i) dual(phi_s),preserving the scaled pairing/polarization identities
    integrality: require each proposed gamma_i be an actual C-endomorphism; division by D is only rational and needs its kernel/division conditions
  pseudocode: |
    Run source_prefix and propagate every failure.
    Use O's table,identity coordinates,trace,norm and involution to write scaled target product/involution equations.
    Attach curve-map equations,exact degree bounds,polarization/pairing equations and common degree-D codomain/column calibration.
    Keep all unknown gamma_i labelled C->C; no source evaluator is installed on C.
    Finite ring-presentation equations can be recorded from source data, but contain no evaluated target map constants.
    A realization solver selecting integral C maps and a common E->C calibration is not implemented.
    Return bottom(MISSING_SIMULTANEOUS_GEOMETRIC_REALIZATION).
  actual_returned_object: tagged bottom; a ring-relation system or solution of its finite reduction is not W,Y or m
  conditional_continuation: |
    If an implemented solver COMPUTED calibrated evaluators gamma_i:C->C,verify all labelled map/product/degree/involution identities.
    Let gamma=sum_i[c_i]gamma_i; evaluate W=gamma(X) as an actual C point.
    Verify W in C[N]; set Y=[D inverse modulo N]W and check the complete target basis/pairing.
    If the solver also computed evaluated f:E->C of degree D with f(P)=X,run decoder.conditional_map_program.
    If it returned W/Y only,run decoder.point_only_program; its recovery operation is not implemented here.
  missing_arrows:
    - simultaneous abstract/finitely reduced source algebra relations -> integral evaluated C-endomorphism representatives
    - integral target representatives and one column -> sender-compatible geometric calibration with exact degree-D codomain equations
    - evaluated W/Y alone -> frozen implemented full-labelled-action recovery -> evaluated f/kernel -> actual m
  dense_elimination_attempt: Parameterize gamma_i by rational maps on C with degree D^2*nrd(beta_i),then impose exact identities; this gives finite algebraic constraints but no uniform polynomial solver.
  restriction: no target point-complement sampling,finite-frame reconstruction or public slope lookup is used as the attempted construction
ambiguity_audit:
  finite_coordinate_model: For analysis only choose any target N-basis; T in GL_2(Z/NZ) has first column coordinates of X and determinant D from pairings.
  consistency_family: rho_N(gamma_i)=D*T*M_i*T^(-1) satisfies every scaled multiplication/involution relation for all compatible T.
  shear: Holding the first column and determinant fixed permits T -> T*S_u with S_u=[[1,u],[0,1]],u in Z/NZ.
  first_response: A*e_1=e_2; hence rho_N(gamma)*X=D*T*e_2 depends on the undetermined second column.
  full_source_centralizer: Full M_2(Z/NZ) has scalar-unit centralizer; this is a uniqueness statement only after both labelled actions are fixed.
  simultaneous_unknowns: Here the target action is unknown too; conjugating that action and its module identification preserves the algebra constraints.
  integrality_and_degree: The shear family is a formal finite-module control,not a claim that all shears lift to integral geometric degree-D maps.
  honest_uniqueness: Degree-D compatibility plus strict N>4D selects at most one honest realization,but supplies no polynomial method to select/evaluate it.
  even_given_EndC: Knowing an arbitrary represented End(C) would still require solving its sender-compatible embedding/realization constraints; no universal sufficiency or impossibility assertion is made.
nonduplication_normalization:
  finite_target_frame: this route attempts simultaneous geometric C-map equations,not reconstruction of a finite complement; solving only a shear coordinate would repeat F1
  symbolic_sandwich_DAG: scaled integral map equations are distinct; outputting formal gamma_i or an unknown sandwich would repeat F2
  exhaustive_public_lookup: dense algebraic realization has no slope loop; enumerating s or all matching finite frames would repeat F3 or be polynomial in N rather than log N
  present_route: geometric realization gap and representation growth exposed; no repeated fallback admitted
cost_table:
  bit_time: capped partial work <=lambda^12 plus input reading; finite table/involution/congruence recording costs T_verify+T_source+poly(B,log p,log D,log N)
  memory: B+maximum verifier/source evaluator workspace+fixed-size source relation data; any dense realization workspace counted separately
  output_length: constant bottom; symbolic relations poly(B,log D) have no evaluator type
  preprocessing: field,point/order/pairing,source-map programs,quaternion coordinate/involution conversion and certificate work charged
  field_rational_map_kernel_evaluation: no actual C-map evaluations in partial route; hypothetical Eval_gamma_i and exact identity tests counted in T_realize
  normalization: H_global,H_iso for model selection and all map/point conversions; fixing public C does not construct unknown gamma_i
  saturation_division: integrality of transported rational action,division by D and denominators require kernel/image and identity checks,T_div; inherited source saturation unchanged
  norm_equation_KLPT_enumeration: not used in partial route; a later norm/KLPT solver replacing geometric equations must declare its exact norm,success law,degree and codomain-match costs
  representation_conversion: finite matrices -> actual C maps is T_lift,not a free basis change; map/kernel conversion and full-action recovery T_full separately
  intermediate_growth: g_i=D^2*nrd(beta_i); log g_i may be polynomial while dense coefficient count O(g_i) is exponential in lambda
  elimination_warning: dense simultaneous-map equations have O(sum g_i) coefficient variables and polynomial identities of growing degree; no polynomial-in-bit-input bound established by finite solvability
  compact_map_warning: replacing dense coefficients by short circuits requires evaluated operation definitions/intermediate bounds; arbitrary unknown-target circuit gates are unavailable
  modulus_growth: finite constraints use N=Theta(D),encoded in O(lambda) bits; iterating N shears or N^2 matrices is exponential
  factoring_smoothness: known powers 2 and 5 justify source and slope digit work only; no factoring/smoothness hypothesis for unknown target degrees/norms adopted
  amplification: no solver success eta or recipient-coin bound; success amplification cannot be costed as polynomial without these
  conditional_decoder: four Eval_gamma_i(X) plus scalar sums,one inverse-D multiplication,T_full and map/kernel-to-slope costs; direct f branch needs 2*Eval_f+O(k^2+a) group operations
correctness_boundary:
  actual: partial program returns no evaluated response; response/message failure 1
  conditional_response: if evaluated gamma_i really equal phi_s beta_i dual(phi_s) with all labels,then gamma(X)=[D]phi_s(Q)
  conditional_message: W/Y is not m; correctness to m requires the fully realized f/kernel path in decoder and its separate costs/failures
  geometric_not_finite: finite algebra,pairing and centralizer arguments discharge neither integral C-map realization nor uniform computation
