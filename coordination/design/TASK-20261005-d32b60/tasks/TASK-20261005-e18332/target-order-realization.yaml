construction:
  target_order_required: full integral R=End(C) with four actual evaluable C-to-C maps,multiplication,rational coordinates and certificates
  variance: H=Hom(E,C) is a left R/right O bimodule via postcomposition/precomposition; dual(H)=Hom(C,E) has opposite variance.
  abstract_versus_geometric: A rank-four quaternion connecting lattice between abstract O,R does not identify its elements with maps E->C on the given models.
  anchor: A degree-D f in calibrated H with f(P)=X gives theta_f(u)=f u dual(f)/D in End^0(C) and gamma=D*theta_f(alpha).
  pseudocode: |
    Run source_prefix and propagate every failure.
    Compute the requested target-order interface from public C, without borrowing End(E)'s evaluators.
    No implemented TargetEndRingEval(C) subroutine or verified cost/success theorem is supplied.
    Return bottom(MISSING_TARGET_ORDER_PROGRAM).
  next_partial_stage_if_R_computed: |
    Verify the full evaluated R and all curve/domain/table/discriminant certificates.
    Construct abstract compatible O,R local lattice constraints and norm/involution equations.
    Require a GEOMETRIC_HOM_REALIZER(O,E,R,C) returning maps on the exact labelled models,not only an abstract lattice.
    Require its degree-D cyclic member with f(P)=X and a verified kernel.
    No such calibrated realizer or member selector is supplied; return bottom(MISSING_CALIBRATED_HOM_REALIZATION).
  actual_returned_object: tagged bottom at unavailable target-order operation; no R,H,f,W,Y or m returned
  conditional_continuation: |
    If R and a calibrated geometric H are COMPUTED from the declared input,charge every construction and verifier call.
    Compute/select f in H with degree D,cyclic kernel and f(P)=X; verify exact codomain/model conversion.
    Return (f,Y=f(Q)); optionally W=f(alpha(dual(f)(X))) with all three evaluations charged.
    Run decoder.conditional_map_program to return actual m.
  missing_arrows:
    - represented public C -> full evaluated integral End(C) with a uniform bit-cost/failure theorem
    - represented O and evaluated R -> geometrically calibrated Hom(E,C) on exact E,C,not merely compatible quaternion modules
    - represented calibrated Hom -> exact norm-D cyclic sender member with f(P)=X,then evaluated map/kernel
  possible_target_order_only_output: If only R is returned,the defined decoder returns bottom(MISSING_CALIBRATION),not m.
reduction_direction_audit:
  forward_connection: an evaluated connecting f/dual induces a calibrated rational algebra embedding theta_f and scaled target sandwich evaluations
  forward_ring_transport_gap: obtaining ALL integral End(C) from that embedding additionally requires saturation/division/certificate/evaluation work
  target_order_to_connection: claimed EndRing/path equivalences require exact distribution,represented outputs,auxiliary data and conditional assumptions; no theorem or implemented reduction is adopted here
  connection_exposure: a TargetEndRingEval routine that internally outputs a path or calibrated Hom anchor has already solved a connecting problem; that cost cannot be hidden under the name target order
  abstract_algebra_isomorphism: quaternion algebra identification need not preserve actual integral maps or the sender column; a computed algebra conjugacy is not the theta_f interface
  two_orders: existence of compatible ideal/bimodule classes does not identify the geometric realization without anchors/model conversion
  no_security_arrow: Even a computed recipient f and decoder would be a decryption upper bound,not extraction of EndRing from any adversary.
nonduplication_normalization:
  finite_target_frame: route first requests a full evaluated integral target order and geometric Hom lattice; resolving its last calibration only by a finite missing shear repeats F1
  symbolic_sandwich_DAG: target order/Hom interface is distinct; an unevaluated embedding or symbolic theta_f repeats F2
  exhaustive_public_lookup: target-order,Hom,norm and realization operations are proposed distinct subroutines; replacing them with D slope replay repeats F3
  present_route: no target-order or calibrated realization oracle is adopted; both unavailable interfaces exposed
cost_table:
  bit_time: capped partial prefix <=lambda^12 plus input reading; requested T_EndC+T_Hom+T_normD+T_realization+T_calibration have no supplied bounds
  memory: B+source/verifier workspace plus M_EndC,M_Hom,M_realization if those routines become defined
  output_length: actual constant bottom; conditional R/H basis size and map program/kernel bytes B_R+B_H+B_f must be bounded separately
  preprocessing: input O representation,field,source verification,pairings,factorizations,target-order algebra coordinates and all local/rational arithmetic charged
  field_rational_map_kernel_evaluation: target-order certificates require actual C-map evaluations; Hom realization requires E-to-C,dual C-to-E calls with exact labels
  normalization: H_global+H_iso for target/source order basis equivalence,curve isomorphisms and simultaneous map/point conjugations
  saturation_division: source and target maximal-order saturation,denominator division,integral Hom intersection and exact map identities,T_satE+T_satC+T_div+T_Hom_integral
  norm_equation_KLPT_enumeration: exact degree-D norm search/member selection,T_normD; equivalent smooth ideals/path outputs require separately costed calibration back to the honest degree D
  representation_conversion: abstract R -> evaluated R; abstract bimodule -> geometric Hom maps; geometric map -> kernel/slope,all distinct and charged
  intermediate_growth: target-order denominators,Hom discriminant/index,norm-search coefficients,KLPT smooth degree,extension fields and realized map coefficients need polynomial bit bounds; rank four supplies none automatically
  dense_map_warning: degree-D coefficient expansion costs O(D) slots; storing a rank-four lattice or compact sandwich does not evaluate these maps
  factoring_smoothness: input D,N factors known; unknown norms,conductors,indices and auxiliary degrees require stated factoring algorithms/assumptions and measured/proved success before any cost theorem
  amplification: eta_EndC,eta_Hom,eta_norm,eta_realization unassigned; union-bound failure and each attempt-cost/inverse-success factor must be explicit
  conditional_decoder: Eval_f(Q)+2*Eval_f(U,V)+T_cert+O(k^2+a) group work; optional W adds Eval_dual(X)+Eval_alpha+Eval_f
correctness_boundary:
  actual: no target order/evaluated connection is returned; response/message failure 1
  conditional: actual calibrated degree-D f with f(P)=X equals honest phi_s under strict N>4D; f decoder yields actual m for every m,r
  limitation: computing abstract orders or proving Hom uniqueness does not provide an evaluated sender member or its bit-time bound
