      id: "J1"
      joint: "J1 -- Admission/representation/certificate/full asymptotic cost."
      assigned_to: "TASK-20261005-8f61fd"
      attack_plan: "From bare law rederive exact accepted mass/caps/q and successful work; inspect order/point/model/certificate encodings and evaluator costs in lambda/log p/log D/log N. Vary all-bottom, small public support, invalid certificate, fixed-rank norm and compact-but-expensive evaluation; expose conditional admission rather than counting capped termination."
      breaking_artifact: "Missing representation/certificate/evaluator, unjustified q or Setup success, hidden preprocessing/output/degree/modulus cost."
    -
      id: "J2"
      joint: "J2 -- Typed executable calibrated target algorithm + quantified correctness/fiber + decoder-to-actual-m."
      assigned_to: "TASK-20261005-8f61fd"
      attack_plan: "Type undecorated A/B/C calls source E versus target C; independently derive correctness/fiber/failure, test degree/codomain/pairing calibration and centralizer/shear residuals. Demand computation rather than unique symbol and follow actual W/Y through U,V,k to m, charging reconstruction/evaluation and malformed rejection."
      breaking_artifact: "Unimplemented calibrated target call, unresolved shear/codomain ambiguity, uniqueness-to-construction leap, nonpolynomial work or absent actual-m decoder."
    -
      id: "J3"
      joint: "J3 -- Hidden Hom/ideal/target-order work and equivalent hard subroutines."
      assigned_to: "TASK-20261005-b5fb7c"
      attack_plan: "For A expand ideal construction/norm/KLPT/codomain matching; for B expose calibrated-action ambiguity; for C expand target order/bimodule/Hom realization. Remove supplied connection/action/private frame, draw each reduction arrow with exact premises/costs, and test public source algebra/full-action substitutes."
      breaking_artifact: "Forbidden auxiliary data or hidden connecting primitive, unproved equivalence/reduction or uncharged realization."
    -
      id: "J4"
      joint: "J4 -- Security/asymmetry and malformed/proves-too-much controls."
      assigned_to: "TASK-20261005-b5fb7c"
      attack_plan: "Run symbolic wrong-order/codomain/degree/N/certificate/quaternion/pairing and U,V,k controls. Compare identical recipient/public response and actual-m path; distinguish attack upper bound from reverse extraction, audit augmented law/simulation/distance/witness pullback and inverse/reencryption/quotient/wrapper cases."
      breaking_artifact: "Malformed accepted case, public same computation, incorrect security arrow, absent distribution/extraction bridge or unsupported asymmetry."
    -
      id: "J5"
      joint: "J5 -- Source verification, nonduplication versus prior three formulations, and claim hygiene."
      assigned_to: "TASK-20261005-b5fb7c"
      attack_plan: "Independently verify exact snapshot-located primary sections/hashes or concrete impediment. Normalize A/B/C against prior finite-frame, symbolic sandwich DAG and exhaustive public lookup, then nearest PKE/action/ideal/target-order sources. Preserve source versions/assumptions, proposed ideas and scoped language."
      breaking_artifact: "Relabelled prior construction, unchecked load-bearing citation, claimed computational delta without source support or widened novelty/security/universal closure."
