    A: "A: ideal-transporter/left-order reconstruction uses secret represented O and public target C/degree D to construct a represented left O-ideal or map with codomain C and evaluate it. Charge norm equations, KLPT or enumeration, codomain matching, rational-map/kernel output and verification; distinguish a computed calibrated result from assuming the forbidden connecting map."
