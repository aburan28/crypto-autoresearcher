  constraints:
    - "Read all declared scientific inputs fully; prior final decision/next action are historical internal context. Prior producer artifacts supply exact law/encodings and the nonduplication comparison, not new evidence. Source notes are locators and IDEA records remain proposed. Do not read/list/hash the NEW plan, sibling cards/reports/composition or scientific messages."
    - "Only ONE M2 mechanism, at most the three explicit disjoint A/B/C formulations below and at most one finalist. No M1/P2/new family, generic wrapper, parameter/mask relabeling, or unlimited search."
    - "A: ideal-transporter/left-order reconstruction uses secret represented O and public target C/degree D to construct a represented left O-ideal or map with codomain C and evaluate it. Charge norm equations, KLPT or enumeration, codomain matching, rational-map/kernel output and verification; distinguish a computed calibrated result from assuming the forbidden connecting map."
    - "B: simultaneous torsion-conjugacy/module calibration uses the full labelled source O-action and single public column X; enforce quaternion relations, polarization/pairings, degree and codomain equations. Eliminate or expose residual centralizer/shear ambiguity; prove a computation, not only uniqueness. Do not repeat the prior finite target-frame reconstruction."
    - "C: target-order/bimodule realization computes End(C) or an O-End(C) bimodule/Hom(E,C), then realizes gamma(X). State exact reduction direction and full costs; test whether each target-order/realization subroutine already solves the hidden connecting problem."
    - "Do not relabel or repeat the prior finite target-frame reconstruction, symbolic sandwich DAG or exhaustive public lookup. Each attempted A/B/C file gives a normalization table against all three; any route falling back to one is recorded as repetition and cannot be the finalist."
    - "Freeze the exact inherited conditional law before formulation analysis: unary lambda>=8, a=lambda, k=floor(lambda/2), D=2^lambda, N=5^b least >4D (N<=20D), represented F_{p^2}, prescribed congruent prime/source certification, E_star:y^2=x^3+x, L(lambda)=lambda^2 nonbacktracking degree-3 source law, saturation/division and map realization, public/secret certificate bytes, normalization/basis coins. Copy the prior exact admission record as declared input; explicitly freeze the unresolved L versus L+1 convention prospectively with before/after distinction. No silent law/encoding/evaluator change."
    - "Retain or discharge A_PRIME_SOURCE, A_ACCEPT (including q>=lambda^-2), A_SAT_DIV, A_SUPPORT, A_CERT, A_NORM and A_EVAL with exact quantifiers, falsifier, missing arrow and claim consequence. First accepted output is the complete single-trial law conditioned on acceptance; per-trial lambda^12 cap and lambda^3 trials give termination/failure accounting, not successful Setup. Separate capped conditional work from unlimited-retry mean w/q; q=0/all-bottom is not successful admission."
    - "Exact executable input interface: secret O=End(E) as full integral represented order with multiplication table, rational coordinates, four domain-labelled evaluable source maps and certificates; public represented E,C,X=phi_s(P),P,Q,D,N and exact field/model/point/degree/certificate encodings; ciphertext/message-path U,V,k. Classify every value as public/secret, charge the O representation, and freeze a parser and evaluator contract."
    - "No supplied Hom(E,C), calibrated ideal/bimodule, isogeny E->C, target O-action, private target frame, orientation, retained tau, sender map/dual, extra secret or target evaluator oracle; no exponential advice or preprocessing. A route may compute such data only from declared inputs, with executable steps, full costs and exact reduction arrows; a renamed hidden connecting subroutine is a missing obligation, not a positive candidate."
    - "One fixed uniform program, independent of the accepted instance and before every successful Setup/admitted key, every honest m and sender randomness; permitted recipient coins have an explicit uniform failure bound. Size variables include lambda, log p, log D, log N and total encoded input length; polynomial in D or N is not polynomial in their bit lengths. Setup/admission, transporter correctness, fiber and decoder failures are separate."
    - "For every attempted route, report separate bit-time, memory, output length, preprocessing, field/rational-map/kernel evaluation, normalization, saturation/division, norm-equation/KLPT/enumeration and representation-conversion costs. Track intermediate coefficient/degree/modulus growth, factoring/smoothness assumptions and success amplification. D=2^lambda and N=Theta(D); small point output, fixed lattice rank, compact circuits/DAGs or exponential advice cannot hide evaluated work."
    - "Each route file must continue from its ACTUALLY RETURNED W/Y/map/kernel to actual m=s mod 2^k on exact U,V,k, with types, all-message correctness and separately costed failure. A point or abstract ideal is not plaintext; charge full labelled-action-to-map/kernel reconstruction, evaluations on U,V and smooth slope extraction if required. W=[D]Y requires exact invertibility/normalization conditions; give wrong-key, malformed point/certificate and adversarial input rejection behavior."
    - "Preserve conditional source alpha(P)=Q, W=[D]Y and strict N>4D complete normalized honest P1 fiber F_z={s}, q_k=1 only with their assumptions and evaluator costs. Do not substitute N^2>4D or infer construction, successful admission or asymmetry from uniqueness."
    - "Each A/B/C output includes uniform domain-labelled pseudocode, exact returned object, correctness/failure/fiber statement, actual-m decoder, asymptotic cost table and precise missing arrows even if no finalist. A route omitted from the bounded attempt still has a file with NOT_ATTEMPTED and a scoped reason; no nonexistent outputs."
    - "Audit malformed/adversarial inputs: invalid field/curve/order/certificate, dependent or wrong-order P,Q, wrong X/codomain/degree/modulus, violated quaternion/pairing relations, wrong key and inconsistent U,V,k. Specify rejection/failure on each rather than assuming honest syntax validates itself."
    - "attack-gates.yaml contains proof_search_map: exact conditional source-alpha/response baseline and prior three-formulation exclusions, observation/fiber and residual centralizer/shear audit, explicit uniform quantifier order, method ceiling/nearby-object controls, separate representation/cost/correctness/reduction obligations. Record Pareto dominated_by and sota_delta with provenance; no unchecked null or invented quantitative improvement."
    - "Work public-Hom/full-labelled-action/Robert, finite source algebra, fixed-rank norms/KLPT, public inverse/reencryption, reachable quotient/collision/label transport, generic-wrapper and exact augmented-law bridge controls. State exact premises and costs; all symbolic controls preserve zero-run scope. A full target response supplied publicly is an extra-input control, not an attack on a partial input."
    - "Separate solver-to-decrypt attack upper bound from adversary-to-EndRing extraction/reduction. No EndRing security or universal impossibility claim; missing simulation, support/distance, advantage accounting or witness pullback stays a named obligation. Source/primary-section claims carry actual read hashes/provenance or precise retrieval impediment."
    - "blind-statement.yaml contains BARE definitions only: exact admission/certificate/evaluator law and encodings, O,E,C,X,P,Q,D,N,U,V,k types, undecorated A/B/C pseudocode including partial calls, claimed quantified correctness/failure/fiber/cost and output-to-m interfaces. No proofs, source names, prior/producer verdicts, rationale, review priors or historical reviews. This producer-authored definition is not producer-free evidence."
    - "Exactly eight declared outputs. transporter-formulations.md states disjoint routes/nonduplication and selected finalist or none; admission-encodings.yaml freezes law; the three route YAMLs each include actual-m path and full cost; attack-gates.yaml owns proof_search_map and controls; provenance.yaml is LAST with all actual reads and honest runtime identity."
    - "Formalization remains deferred until a complete typed target program/lemma, exact assumptions and evaluated representation/library interface exist; record that missing definition and a concrete revisit trigger. No Lean or formalizer run."
    - "A positive finalist must be executable from declared inputs alone and satisfy required admission/representation/evaluator/actual-m gates under its expressly quantified conditions; unresolved assumptions prohibit their stronger claims. A negative result keeps only sharply scoped conditional lemmas and exactly one concrete continuing obligation. No universal closure or EndRing reduction claim."
    - "Zero scientific/implementation/formal runs; no experiment code, scientific state/goal/ledger/queue/lane/claim/Git mutation, extra H/EXP/EV/IDEA/KN record, external messages, untracked agents or successor launch. Write only exact declared artifacts with apply_patch; protocol approval asserts no outcome, security, novelty, practicality, deployment or universal possibility/impossibility."
