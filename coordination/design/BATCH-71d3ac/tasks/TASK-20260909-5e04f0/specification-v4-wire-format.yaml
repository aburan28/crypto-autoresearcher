draft_protocol_amendment:
  id: EXP-ECDLP-9d1966-draft-v4-wire-format
  replaces: [specification.yaml tree interface, specification-v2-tree-grammar.yaml, specification-v3-total-tree-interface.yaml]
  disposition: Additive zero-run closed wire format.
  canonical_bytes: RFC 8785 UTF-8 JSON with NFC strings
  top_level_exact_keys: [schema_version, threshold, nodes, edges, leaves, annotations]
  schema_version: windowed-tree-mock-v4
  threshold_exact_keys: [threshold_id, threshold_value_decimal, predicate]
  threshold_exact_value: {threshold_id: THRESHOLD-WT-01, threshold_value_decimal: '24', predicate: leaf_weight_decimal <= 24}
  node_exact_keys: [node_id, role]
  edge_exact_keys: [parent_id, child_id]
  leaf_exact_keys: [node_id, leaf_weight_decimal, threshold_id, threshold_value_decimal, classification]
  canonical_arrays:
    nodes: lexicographically sorted node_id records exactly [r,r0,r00,r000,r001,r01,r010,r011,r1,r10,r100,r101,r11,r110,r111]
    edges: lexicographically sorted parent_id/child_id records exactly the declared depth-three binary edges
    leaves: lexicographically sorted records exactly [r000,r001,r010,r011,r100,r101,r110,r111]
  recursive_refusal: any duplicate, missing/extra key, nested annotation, wrong type, wrong threshold, missing node/edge/leaf, or old field yields INVALID_INTERFACE
  does_not: [authorize_bound_derivation, authorize_solver, authorize_execution, create_canonical_records]
