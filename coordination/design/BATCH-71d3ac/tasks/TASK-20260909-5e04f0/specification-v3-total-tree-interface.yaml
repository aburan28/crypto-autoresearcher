draft_protocol_amendment:
  id: EXP-ECDLP-9d1966-draft-v3-total-tree
  replaces: [specification.yaml tree and leaf interfaces, specification-v2-tree-grammar.yaml]
  disposition: Additive zero-run total tree interface; prior tree fields or verdicts are INVALID_INTERFACE.
  envelope:
    exact_keys: [schema_version, threshold, nodes, edges, leaves, annotations]
    schema_version: windowed-tree-mock-v3
    annotations: empty array only
  tree:
    root: r
    depth: 3
    nodes: [r, r0, r1, r00, r01, r10, r11, r000, r001, r010, r011, r100, r101, r110, r111]
    edges: [[r,r0],[r,r1],[r0,r00],[r0,r01],[r1,r10],[r1,r11],[r00,r000],[r00,r001],[r01,r010],[r01,r011],[r10,r100],[r10,r101],[r11,r110],[r11,r111]]
    node_record_exact_keys: [node_id, role]
    leaf_record_exact_keys: [node_id, leaf_weight_decimal, threshold_id, threshold_value_decimal, classification]
    completeness: each listed node exactly once; edges exactly list above; leaves exactly r000 through r111
  threshold:
    id: THRESHOLD-WT-01
    value: '24'
    predicate: leaf_weight_decimal <= 24
    binding: every leaf threshold_id and threshold_value_decimal must equal id and value
  refusal:
    verdict: INVALID_INTERFACE
    triggers: [old_interface_field, duplicate_node, missing_node, extra_node, wrong_edge, missing_leaf, extra_leaf, alternate_threshold, nonempty_annotation, undeclared_field]
  does_not: [authorize_bound_derivation, authorize_solver, authorize_execution, create_canonical_records]
