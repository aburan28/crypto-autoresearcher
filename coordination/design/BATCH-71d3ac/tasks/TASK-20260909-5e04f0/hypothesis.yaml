id: H-ECDLP-5014e2
status: draft
area: ECDLP
title: Symbolic windowed-tree accounting for bounded point-decomposition proposals
origin:
  idea_id: IDEA-20260808-486ae2
  design_task: TASK-20260909-5e04f0
  batch: BATCH-71d3ac
claim_type: design_only
statement: >
  A finite, typed symbolic tree can account for a proposed decomposition of a
  formal target expression into bounded window variables and can classify every
  leaf by an explicit threshold predicate.  The accounting contract may be
  checked on synthetic symbolic inputs without asserting that a corresponding
  elliptic-curve relation exists, that a small-root method succeeds, or that an
  ECDLP instance becomes easier.
mechanism:
  description: >
    Expand only a declared abstract target token through a fixed-depth binary
    window tree.  Each internal node carries a bounded integer-window variable
    vector.  A leaf is admitted to the symbolic factor-base bucket only when
    its declared symbolic weight is at most the frozen threshold.  Other leaves
    remain explicit rejections.
  does_not_assert:
    - existence of a Semaev relation with this tree shape
    - validity or applicability of a small-root reduction
    - availability of a lattice basis or solver
    - a relation yield, success probability, time, memory, or data advantage
    - any attack, reduction, or security conclusion for ECDLP
predictions:
  - >
    For every synthetic tree satisfying the grammar and bounds, the accounting
    renderer produces one unique classified record for every leaf.
  - >
    A leaf whose symbolic weight exceeds the threshold is classified REJECTED,
    never silently admitted.
  - >
    A malformed node, out-of-range window value, duplicate node identifier, or
    undeclared variable is classified INVALID_INPUT.
falsification_criteria:
  - >
    A valid synthetic tree has a missing, duplicate, or multiply classified
    leaf.
  - >
    A synthetic leaf above threshold is admitted, or an in-range leaf is
    classified without its declared weight evidence.
  - >
    The contract is used to support an ECDLP, Semaev, lattice, small-root, or
    complexity claim without separately source-bound premises and a distinct
    approved experiment.
scope:
  included:
    - symbolic tree grammar
    - bounded variable accounting
    - threshold classification
    - synthetic control design
  excluded:
    - elliptic-curve arithmetic
    - curve selection
    - relation generation
    - factor-base construction
    - lattice reduction
    - small-root solving
    - ECDLP instances and security estimates
