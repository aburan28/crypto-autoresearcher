draft_protocol_amendment:
  id: EXP-ECDLP-9d1966-draft-v2-tree-grammar
  disposition: Additive zero-run finite-tree grammar repair.
  tree:
    root: r
    node_id_grammar: r followed by zero or more characters each in [0,1]
    child_rule: children of node n are n0 and n1; leaves have no children
    finite_depth: 3
    required_nodes: [r, r0, r1, r00, r01, r10, r11]
  threshold:
    id: THRESHOLD-WT-01
    value: '24'
    predicate: leaf_weight_decimal <= 24
    binding: every leaf record must carry threshold_id exactly THRESHOLD-WT-01; any other value refuses
  input_envelope:
    exact_keys: [schema_version, tree, leaf_records, annotations]
    schema_version: windowed-tree-mock-v2
    node_record_exact_keys: [node_id, role, child_ids]
    leaf_record_exact_keys: [node_id, leaf_weight_decimal, threshold_id, classification]
    duplicate_node_id: refuse
    annotations: empty array only; any annotation or undeclared field refuses
  controls: {duplicate_id: INVALID_INTERFACE, prohibited_annotation: INVALID_INTERFACE, alternate_threshold: INVALID_INTERFACE, missing_child: INVALID_INTERFACE}
  does_not: [authorize_bound_derivation, authorize_solver, authorize_execution, create_canonical_records]
