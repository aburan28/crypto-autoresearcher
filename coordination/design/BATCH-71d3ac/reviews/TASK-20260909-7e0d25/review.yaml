red_team_report:
  id: RT-20260909-7e0d25
  task_id: TASK-20260909-7e0d25
  claim_under_review: >
    The additive v2 grammar repair supplies a closed, constructible,
    depth-three symbolic windowed-tree interface and deterministically rejects
    bare aliases, alternate thresholds, duplicate nodes, annotations, and
    missing children.
  objections:
    - id: OBJ-V2-NO-REPLACEMENT-BOUNDARY
      verdict: breaks
      finding: >
        The packet gives no precedence rule saying that v2 replaces the base
        tree and leaf-record interfaces.  The base grammar accepts bare 0/1
        descendants and rejects r0/r1, while v2 accepts r0/r1.  The base
        required leaf record has eight named fields, but the v2 exact leaf
        record has four incompatible fields.  A single supplied record cannot
        satisfy both exact interfaces, and no parser can determine which one
        governs.
      counterexample_or_mutation: >
        Supply a bare child identifier 0.  It matches the base grammar and is
        excluded by v2.  Conversely r0 is required by v2 and rejected by the
        base grammar.  The additive amendment and decision do not select one
        result, so the bare-alias control has no deterministic disposition.
      required_repair: >
        State a total replacement relation for every superseded base field,
        including tree grammar, node records, leaf records, verdicts, and
        refusal outcome; reject every legacy field after replacement.
    - id: OBJ-V2-INCOMPLETE-TREE-WIRE-FORMAT
      verdict: breaks
      finding: >
        V2 fixes the intended names r, r0, and r1 but does not define a closed
        serialization for tree.nodes, role, child_ids, leaf membership, depth,
        or a parent-child edge.  required_nodes stops at depth two and omits
        r000 through r111 even though finite_depth is three.  child_ids has no
        required length, element grammar, or reverse binding to child records.
      counterexample_or_mutation: >
        A purported tree can supply r, r0, and r1, declare r0 with only child
        r00, and place r1 as a disconnected record.  No v2 rule gives a parser
        a typed node collection or an edge invariant that can reject it.
        Likewise a tree omitting all depth-three leaves is not excluded by the
        declared required_nodes list.
      required_repair: >
        Define one closed tree object with an ordered or canonically keyed
        node collection, a depth function, exact child pair [n0, n1] for each
        nonleaf, exactly eight depth-three leaves, and bijective bindings from
        leaf records to those leaves.
    - id: OBJ-V2-THRESHOLD-AND-OUTCOME-AMBIGUITY
      verdict: breaks
      finding: >
        Exact spelling of threshold_id is insufficient to bind a leaf result
        to the fixed value 24.  V2 provides no decimal grammar, recomputation
        rule, or closed classification alphabet for leaf_weight_decimal and
        classification.  It also calls malformed-interface controls
        INVALID_INTERFACE while the base exhaustive verdict alphabet uses
        INVALID_INPUT, without defining an outer parser-result layer.
      counterexample_or_mutation: >
        Retain threshold_id THRESHOLD-WT-01 but put an untyped tree-local
        threshold override of 25 and a leaf record with
        leaf_weight_decimal: 25 and classification: ADMITTED_SYMBOLIC.  The
        top-level exact-key rule does not close the tree object, and neither
        leaf value nor classification is typed or recomputed.  A checker also
        cannot choose between INVALID_INTERFACE and INVALID_INPUT for the
        alternate-threshold control.
      required_repair: >
        Bind threshold_id to a single typed immutable threshold object with
        value 24; define decimal syntax and recomputation; use one closed
        outer parse/refusal alphabet and state how it relates to any leaf
        classification.
    - id: OBJ-V2-DUPLICATE-ANNOTATION-MISSING-CHILD-CONTROLS-NOT-TESTABLE
      verdict: breaks
      finding: >
        The duplicate_id, prohibited_annotation, and missing_child controls
        are policy names rather than predicates over a closed object.  Only
        the top-level annotations field is constrained.  The untyped tree
        object can contain a duplicate node collection, a semantic annotation,
        or a one-element child_ids value without a specified parse outcome.
      counterexample_or_mutation: >
        Put a crypto-related annotation under tree.metadata, duplicate r in an
        undeclared tree.nodes collection, or use child_ids: [r0] on r.  Each
        mutation is outside the only closed top-level key list but the packet
        never states whether nested tree fields are rejected or how they are
        evaluated.  The required controls therefore cannot be replayed
        against a uniquely defined input.
      required_repair: >
        Specify recursive additionalProperties:false-style closure for tree,
        node, and leaf objects; canonicalize node identity; and attach each
        control to one complete serialized input and one exact outer refusal
        code.
  required_controls:
    - id: CTRL-BARE-ALIAS-PRECEDENCE
      status: required
      purpose: >
        A bare 0 and an r0 input must receive deterministic, mutually
        compatible parser results under the replacement grammar.
    - id: CTRL-COMPLETE-DEPTH-THREE-TREE
      status: required
      purpose: >
        Construct one complete r through r111 tree and show that deleting one
        exact required child rejects the entire outer envelope.
    - id: CTRL-THRESHOLD-IDENTITY-AND-VALUE
      status: required
      purpose: >
        Show that an unchanged threshold_id with a changed numerical value or
        admitted classification is refused before leaf classification.
    - id: CTRL-NESTED-ANNOTATION-AND-DUPLICATE
      status: required
      purpose: >
        Mutate a nested tree field with a prohibited annotation and duplicate
        a canonical node ID; both must yield the same declared outer refusal.
  counterexample_or_mutation: >
    The cheapest decisive mutation is an otherwise v2-shaped top-level object
    whose untyped tree member carries a one-child r node and a local threshold
    25, while leaf_records contains a 25-weight leaf labelled
    THRESHOLD-WT-01 as ADMITTED_SYMBOLIC.  The stated v2 clauses do not define
    a unique parser path that rejects it.
  baseline_comparison: null
  heuristic_challenges: []
  cost_model_challenges: []
  reduction_and_scope_challenges: []
  proof_architecture_challenges:
    - The source-only mock grammar makes no proof or cost claim to assess.
      The recalled small-root pointer was not retrieved and remains
      unavailable/unverified, which is the declared proves-too-much failure
      signature.
  narrowest_supported_statement: >
    V2 identifies the intended r-prefixed binary naming convention and the
    intended threshold identifier/value, but it does not yet establish a
    closed, constructible, or control-replayable BATCH-local tree grammar.
    It supports no small-root, Semaev, lattice, solver, ECDLP, or attack claim.
  next_concrete_action: >
    Issue one additive total-interface repair that explicitly replaces the
    conflicting base interfaces and defines recursive closed envelopes,
    complete depth-three node/edge invariants, threshold-value semantics, and
    a single outer refusal alphabet; then obtain a fresh independent review
    using serialized positive and negative controls.
  artifact_paths:
    - coordination/design/BATCH-71d3ac/reviews/TASK-20260909-7e0d25/review.yaml
