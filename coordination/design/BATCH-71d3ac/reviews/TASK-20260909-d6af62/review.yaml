validation_report:
  id: VAL-20260909-d6af62
  task_id: TASK-20260909-d6af62
  run_ids: []
  artifact_checks:
    - artifact: coordination/design/BATCH-71d3ac/tasks/TASK-20260909-5e04f0/specification-v3-total-tree-interface.yaml
      result: present_and_yaml_parseable
      scope: source-only interface review
    - artifact: ledger/decisions/DEC-20260909-853c1f.yaml
      result: present_and_matches_reviewed_v3_replacement_scope
      scope: source-only interface review
  metric_recomputations: []
  control_checks:
    - control: omitted_leaf
      result: incomplete
      observation: >-
        The prose states that leaves are exactly r000 through r111, but it does
        not specify an ordered leaf-array grammar, leaf-record type, or an
        exactly-once cardinality check over leaf node_id values.
    - control: wrong_edge
      result: holds_narrowly
      observation: >-
        The v3 packet gives one finite ordered edge list; a direct equality
        comparison could reject a changed edge if the surrounding envelope is
        otherwise defined.
    - control: old_field
      result: incomplete
      observation: >-
        envelope.exact_keys closes only the top level. The packet does not
        define the value grammar for nodes, edges, leaves, or threshold, so an
        old nested field cannot be mechanically distinguished from an
        unconstrained nested value.
    - control: duplicate
      result: incomplete
      observation: >-
        tree.completeness makes node identifiers exactly-once but does not
        define an exactly-once sequence rule for leaf records. A second r000
        leaf record has no declared canonical ordering or duplicate-resolution
        rule.
    - control: threshold
      result: breaks
      observation: >-
        The required top-level threshold member has no closed record schema or
        equality relation to threshold.id and threshold.value. An input can
        retain leaf threshold_id THRESHOLD-WT-01 and leaf
        threshold_value_decimal '24' while placing an alternate id or value in
        envelope.threshold; no declared rule rejects that divergent root
        threshold object.
    - control: annotation
      result: incomplete
      observation: >-
        The top-level annotations array is constrained to empty, but nodes are
        simultaneously enumerated as strings and assigned node_record keys.
        Without one declared node-record serialization, a nested annotation
        has no uniquely defined validation path.
  heuristic_validation_checks: []
  cost_model_checks: []
  proof_architecture_checks: []
  verdict: incomplete
  limitations:
    - >-
      This report validates only the assigned total-interface joint. It does
      not derive a small-root bound, test a solver, or assess an ECDLP claim.
    - >-
      The recalled small-root pointer remains unavailable and unverified, as
      required by the plan's proves-too-much control.
  artifact_paths:
    - coordination/design/BATCH-71d3ac/reviews/TASK-20260909-d6af62/review.yaml

