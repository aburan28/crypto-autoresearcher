review_report:
  id: TASK-20260909-17ef5a
  task_id: TASK-20260909-17ef5a
  review_plan_id: windowed_tree_mock_contract_review
  reviewed_snapshot:
    commit: ef3fb090b1edef60823e3151f9bac6350caa216d
    source_paths_match_snapshot: true
  joint: abstract_window_tree_threshold_and_controls
  joint_verdict: breaks
  scope:
    - finite tree, variable, and bound grammar
    - threshold labels and classifications
    - controls
    - custody and source-impediment boundary
  checks:
    - id: CHECK-YAML-PARSE
      result: holds
      evidence: hypothesis.yaml and specification.yaml parse as YAML mappings.
    - id: CHECK-PINNED-SOURCE-CONTENT
      result: holds
      evidence: The four declared draft paths have no diff from the review-plan source snapshot.
    - id: CHECK-TREE-GRAMMAR-CONSTRUCTIBILITY
      result: breaks
      finding: >
        The root is r and a non-leaf n must have children n0 and n1, so the
        mandatory children of r are r0 and r1.  The node-id grammar accepts
        only r or a bare binary string of length one through three; it rejects
        r0 and r1.  Replacing them with 0 and 1 would instead violate the
        stated child rule.  Therefore no complete valid tree containing the
        required root can satisfy both rules, including the clean-admission
        and above-threshold controls.
      required_repair: >
        Define one consistent, closed node-id grammar and child derivation,
        then provide a constructible complete depth-three control instance.
    - id: CHECK-THRESHOLD-LABEL-BINDING
      result: breaks
      finding: >
        required_leaf_record includes threshold_id, but no rule requires that
        field to equal THRESHOLD-WT-01 or binds it to the fixed value 24 and
        the stated admission predicate.  A record can therefore carry a
        measured or alternate threshold label while still presenting a
        recomputable weight and an otherwise expected verdict.  This does not
        meet the plan's threshold-label discipline.
      required_repair: >
        Close the leaf-record schema and require threshold_id to equal the
        unique frozen threshold identity, with rejection for missing or
        mismatched labels.
    - id: CHECK-CONTROL-CONSTRUCTIBILITY-AND-UNIQUE-OUTCOMES
      result: breaks
      finding: >
        The contract has no closed top-level input, node-record, or leaf-record
        serialization grammar.  Consequently a node set with a duplicate
        identifier is not a constructible object under the mathematical word
        set, and the false-cryptographic-interpretation control refers to
        undeclared annotations or meanings rather than a typed field that can
        be rejected.  The malformed-topology and cryptographic-interpretation
        controls therefore do not each identify one machine-checkable input
        and a unique required outcome.
      required_repair: >
        Define closed input and output envelopes, including the collection
        representation, exact permitted fields, duplicate detection, and a
        typed prohibited-annotation rejection rule for every control.
    - id: CHECK-SOURCE-IMPEDIMENT-BOUNDARY
      result: holds
      finding: >
        The recalled Semaev and Jochemsz-May pointers are marked unverified
        and non-load-bearing.  The draft records that no primary sources are
        retained or hash-bound and prohibits mathematical applicability,
        baseline, cost, novelty, and ECDLP claims until a separate retrieval
        and review path completes.
    - id: CHECK-CUSTODY-AND-ZERO-RUN-BOUNDARY
      result: holds
      finding: >
        The package is BATCH-local, source binding is absent, implementation
        and execution artifacts are forbidden, implementation authorization is
        false, and scientific execution has zero permitted runs.
  conclusion:
    supported_scope: >
      The reviewed source files preserve the source-impediment and zero-run
      boundaries, but they do not yet provide a constructible finite tree or
      uniquely executable threshold/control contract.
    not_supported:
      - BATCH-local design completeness
      - canonical proposed-record conversion
      - implementation authorization
      - scientific execution
      - any ECDLP, small-root, Semaev, factor-base, or attack conclusion
  required_next_action: >
    Add an immutable repair that closes the node identifier and child grammar,
    threshold-label binding, and typed control envelopes, then obtain a fresh
    independent review of the replacement contract.
