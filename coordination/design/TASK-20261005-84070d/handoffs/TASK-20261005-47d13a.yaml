  constraints:
    - >-
      Read every declared scientific input completely from the committed and
      pushed preparation base. Do not read the new review plan, blind statement,
      reviewer cards, review outputs, or messages about expected review results.
    - >-
      Consider at most three mathematically distinct public projection
      families. A renamed mask, parameter change, or wrapper is not a distinct
      family. Select at most one finalist, and only if all cheap syntax and
      symbolic gates pass; otherwise retain route-specific failed definitions
      and one exact continuation obligation.
    - >-
      For every attempted family specify Setup, KeyGen, Encrypt,
      SecretLift, and Decode; exact domains and encodings; key/randomness
      distributions; validation and failure behavior; and a quantified
      Dec(sk,Enc(pk,m;r))=m equation or the precise point where it fails.
    - >-
      SecretLift must be a concrete algorithm from the evaluable End(E) basis,
      with pseudocode, input/output representation, correctness condition,
      asymptotic time/memory, and failure behavior. A named oracle, existence
      of Hom/path/ideal, exhaustive exponential enumeration, retained tau,
      connecting ideal, orientation, setup trapdoor, or extra secret is not an
      EndRing-only operation unless explicitly charged and separated as an
      added assumption or secret.
    - >-
      Define the first security game and draw every hardness arrow in its actual
      direction. An EndRing solver that yields sk or decryption only shows an
      attack/upper-bound direction; it does not prove semantic security from
      EndRing. A security claim would require adversary-to-EndRing or a named
      intermediate assumption with an explicit unresolved bridge.
    - >-
      Reject wrappers where EndRing merely derives an otherwise standard
      ElGamal, LWE, or generic PKE secret. The wrapper's underlying assumption
      and syntax remain controlling unless a new reduction is actually given.
    - >-
      Apply endpoint/projection collision, constant projection, partial/full
      torsion, Robert, public finite-torsion linear algebra, fixed-rank lattice,
      public-Hom, public reencryption, and public-inverse controls to each
      attempt. State exact rationality, smoothness, factorization, rank, model,
      field-degree, preprocessing, and output-size conditions where relevant.
    - >-
      `attack-gates.yaml` contains a complete proof_search_map: exact prior-C
      baseline reproduction, observation-collision search, explicit quantifier
      order, method ceiling, and nearest known-false control for each family.
    - >-
      Compare normalized interfaces and assumptions with SÉTA, FESTA, POKE,
      PIKE, SiGamal/C-SiGamal, and LIT-SiGamal. Preserve the prior source
      caveats. Novelty remains unverified until independent review; do not
      report a novelty, security, post-quantum, practicality, or deployment claim.
    - >-
      Report asymptotic KeyGen, Encrypt, SecretLift, Decode, public-key size,
      ciphertext size, auxiliary-data, preprocessing, and failure costs for a
      finalist. Flag unproved polynomial bounds and representation costs.
    - >-
      If no family passes, do not claim EndRing-PKE impossible. State the
      narrowest common or route-specific obstruction and forward guidance.
    - Run zero experiments, write no implementation, create no ledger/status record, and use no Bedrock.
    - Create exactly the six declared artifacts; write provenance.yaml last and list every actual read.
