  role: red-team
  goal_id: GOAL-SSI-2fa82a
  batch_id: BATCH-576c9f
  review_plan_id: REVIEW-CSTAR-20261005-84070d
  claim_under_review: >-
    Only the exact three C-star projection definitions P1, P2, and P3 in the
    pushed producer snapshot, tested at joints J3-J5. This report gives no
    whole-candidate or whole-claim verdict.
  whole_claim_verdict: null
  snapshot_binding:
    snapshot_task: TASK-20261005-3a667c
    commit: c405c869deb51d21b1b1569c2fbc22e623ac46d8
    parent: dc8842a68abce1ac67b5a5e9400ec68f2d040cad
    remote_reachable: true
