      pdf_bytes: 636017
      sha256: 6921f7fb3ed409c9861c52011d9bf39c5e638e97af5f3859f6606367525ff536
      expected_sha256_match: true
      pdf_format_check: PDF 1.5
      section_reads:
        - Section 4.1 overview, masked LIT diagram, private horizontal-map reconstruction, dimension-two recovery, and the circulant-mask footnote boundary.
        - Section 4.2 exact public key/secret key, Encryption, Decryption, Theorem 1 correctness, message discrete log, and sign caveat.
        - Section 5.1, Definitions 5-7, Propositions 2-3, Theorem 2 and Corollary 1 for the Computational/Decisional LIT-SiGamal and LIT-DDH assumptions.
      verified_boundary: >-
        The secret matrix A and scalar alpha reconstruct the horizontal map and
        lead to a typed plaintext discrete log under explicit LIT assumptions.
        Adding analogous data to P2 changes both the secret and assumption; no
        EndRing equivalence follows.

  normalized_comparison:
    SÉTA:
      sender_data: endpoint plus full ordered smooth-torsion action
      recipient_secret: explicit trapdoor T, not merely the public curve
      message_arrow: kernel/walk index to actual message
      assumption: TCSSI in the archived paper
      C_star_delta: P1 deletes a column; P2 quotients labels; P3 is constant
    FESTA:
      sender_data: two correlated scaled full-action pairs
      recipient_secret: connecting isogeny and commuting mask
      message_arrow: trapdoor inversion then OAEP extraction
      assumption: DIST/CIST/CIST2 and hybrid
      C_star_delta: P2 has an independent mask but no recipient unmasking data
    POKE:
      sender_data: parallel higher-dimensional/isogeny data and masked torsion
      recipient_secret: degree and mask scalars
      message_arrow: recovered shared point through KDF/XOR
      assumption: C-POKE in ROM
      C_star_delta: P2 overlaps one masked-basis component only
    PIKE:
      sender_data: masked single-point data on three curves plus ciphertext mask
      recipient_secret: q and mask scalars
      message_arrow: secret-assisted nonconstant pairing value through hash/XOR
      assumption: C-PIKE in ROM
      C_star_delta: P1 has one unmasked point; P3's pairing determinant is constant
    SiGamal_C_SiGamal:
      sender_data: commutative action curve/point data
      recipient_secret: class-action exponent/scalar representation
      message_arrow: Pohlig-Hellman scalar recovery with sign handling
      assumption: P-CSSCDH/P-CSSDDH
      C_star_delta: no matching action or message arrow
    LIT_SiGamal:
      sender_data: parallel vertical maps, masked bases, and message-scaled point
      recipient_secret: matrix A and scalar alpha
      message_arrow: horizontal-map reconstruction then plaintext discrete log
      assumption: Computational/Decisional LIT-SiGamal and LIT-DDH
      C_star_delta: P2 omits the reconstructing secret

