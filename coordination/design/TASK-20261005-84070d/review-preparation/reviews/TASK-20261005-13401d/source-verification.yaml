  sources:
    - id: ROBERT-2022-1038
      title: Breaking SIDH in polynomial time
      author: Damien Robert
      canonical_url: https://eprint.iacr.org/2022/1038.pdf
      retrieval_url: https://web.archive.org/web/20260823023323id_/https://eprint.iacr.org/2022/1038.pdf
      archive_timestamp: '20260823023323'
      retrieved_at_UTC: '2026-10-05T03:36:29.879313878Z'
      pdf_bytes: 343979
      sha256: 52b371e245085709689e8c94aec0af2f287ad145fbaa170ac6f627bc88e5384e
      expected_sha256_match: true
      pdf_format_check: PDF 1.5
      section_reads:
        - Theorem 1.1 and Remark 1.2, including rational full-basis action, known coprime factorizations, smoothness cost, and the N_A^2>N_B extension.
        - Lemmas 2.1 and 2.2, proof of Theorem 1.1, and Remark 2.3 on the dimension-eight construction, kernel generation, models, and hidden dimension constants.
        - Section 6.4, Lemma 6.3 and Example 6.4, including rank, source/target bases, dual decomposition, and kernel/evaluation recovery.
        - Section 7 summary of recovery when N_A^2>=N_B and N_A is sufficiently smooth.
      exact_short_quote: 'it is also possible to directly reconstruct ϕ_B (with the same complexity) as long as N_A^2 > N_B.'
      quote_location: Remark 1.2
      verified_boundary: >-
        The public recovery requires a labeled full rational N_A-basis action,
        known coprime factorizations, sufficient smoothness, the stated kernel
        rank/model conditions, and represented-field arithmetic. With N_A=N
        and N_B=D, N^2>4D implies the size inequality for the prior full-action
        route. P1, masked P2, and P3 do not automatically meet the interface.
      excluded_inference: >-
        The paper does not itself recover an arbitrary missing second action
        image from P1 or remove P2's unknown mask.

    - id: FESTA-2023-660
      title: 'FESTA: Fast Encryption from Supersingular Torsion Attacks'
      authors: [Andrea Basso, Luciano Maino, Giacomo Pope]
      canonical_url: https://eprint.iacr.org/2023/660.pdf
      retrieval_url: https://web.archive.org/web/20260429140607id_/https://eprint.iacr.org/2023/660.pdf
      archive_timestamp: '20260429140607'
      retrieved_at_UTC: '2026-10-05T03:36:28.547285125Z'
      pdf_bytes: 520982
      sha256: cfa2c92cf8a40e6c27c5679c5468936c65a35dcbe77a1e9e791035f500c0d679
      expected_sha256_match: true
      pdf_format_check: PDF 1.5
      section_reads:
        - Section 3, Algorithms 1 and 2, Remark 5, and the mask-commutation footnote naming circulant matrices.
        - Section 4, Problems 6-8 and Theorem 9 with its decisional hybrid and CIST2 proof.
        - Section 5.1, Algorithms 3 and 4, including actual-message extraction with trapdoor A and phi_A.
      exact_short_quote: 'This is not the only option: for instance, circulant matrices'
      quote_location: Section 3, footnote 3
      verified_boundary: >-
        FESTA uses a secret connecting isogeny and commuting mask to invert
        correlated scaled torsion data. DIST/CIST/CIST2 and the hybrid, not
        bare EndRing, control the stated one-wayness. Circulant masks and
        cyclic kernels are explicit prior art. P2 supplies neither a recipient
        mask nor connecting isogeny.

    - id: POKE-2024-624-20241009
      title: 'POKE: A Framework for Efficient PKEs, Split KEMs, and OPRFs from Higher-dimensional Isogenies'
      author: Andrea Basso
      canonical_url: https://eprint.iacr.org/2024/624.pdf
      retrieval_url: https://web.archive.org/web/20241009051546id_/https://eprint.iacr.org/2024/624.pdf
      archive_timestamp: '20241009051546'
      retrieved_at_UTC: '2026-10-05T03:36:28.467283398Z'
      pdf_bytes: 741190
      sha256: 010faef9c893d1460c3a69fce256da86cedd1fd8b2c5f416821b65bd42b1b66b
      expected_sha256_match: true
      pdf_format_check: PDF 1.5
      section_reads:
        - Front-page correction and introduction.
        - Section 4, Algorithms 1 and 2, Protocol 2, Problems 3-5, Theorem 6 and its ROM reduction.
        - Appendix B alternative key generation from an unknown source ring.
        - Appendix C assumption/level-structure analysis.
      exact_short_quote: 'Note that the attack does not affect the PKE proposed in Section 4.'
      quote_location: front-page correction
      verified_boundary: >-
        Section 4 PKE uses secret degree/scalars, parallel isogenies,
        higher-dimensional reconstruction and a shared point, with IND-CPA
        stated under C-POKE in the ROM. The correction invalidates the split
        KEM/OPRF validation route only. P2's SL2-masked full-basis component
        overlaps a local C-POKE component but lacks the second diagram,
        private unmasking, and shared-point decoder.

    - id: PIKE-2026-473
      title: 'PIKE: Faster Isogeny-Based Public Key Encryption with Pairing-Assisted Decryption'
      canonical_url: https://eprint.iacr.org/2026/473.pdf
      retrieval_url: https://web.archive.org/web/20260525004010id_/https://eprint.iacr.org/2026/473.pdf
      archive_timestamp: '20260525004010'
      retrieved_at_UTC: '2026-10-05T03:36:29.099297041Z'
      pdf_bytes: 607094
      sha256: c46511f6f53db87a51b9229d92c03b35da68adc83123392e7adc7cf9d802e8aa
      expected_sha256_match: true
      pdf_format_check: PDF 1.5
      section_reads:
        - Sections 3.1-3.3, Algorithms 1-5 and Proposition 8, covering key material, public encryption, pairing-assisted actual-message decryption, and correctness.
        - Section 4.1, Problem 9 and Theorem 10 with the C-PIKE-to-IND-CPA ROM direction and advantage bound.
        - Section 5.1, Problems 11 and 12 and the C-PIKE/C-POKE/C-LIT-SiGamal comparison.
      exact_short_quote: 'we emphasize that this connection is only heuristic and assumptional at present.'
      quote_location: Section 5.1, comparison with C-LIT-SiGamal
      verified_boundary: >-
        PIKE reveals masked single-point data on three curves and derives a
        nonconstant shared pairing value using secret q and scalars. Section
        5.1 states that the information mismatch prevents an available
        one-sided C-PIKE/C-POKE reduction and treats the LIT connection as
        heuristic. P3's degree determinant is a different, constant value.

    - id: MAINO-ET-AL-2023-640
      title: A Direct Key Recovery Attack on SIDH
      authors: [Luca Maino, Chloe Martindale, Lorenz Panny, Giacomo Pope, Benjamin Wesolowski]
      canonical_url: https://eprint.iacr.org/2023/640.pdf
      retrieval_url: https://web.archive.org/web/20260920104024id_/https://eprint.iacr.org/2023/640.pdf
      archive_timestamp: '20260920104024'
      retrieved_at_UTC: '2026-10-05T03:36:29.479305245Z'
      pdf_bytes: 650273
      sha256: 8158a5a1f22f0b08ed07a42d11b99eacd623881f378460966e8c5115e003f581
      expected_sha256_match: true
      pdf_format_check: PDF 1.5
      section_reads:
        - Abstract and introduction, including SSI-T, SÉTA applicability, known/unknown source-ring distinctions, and the full-torsion limitation.
        - Section 4, Theorem 2 and Algorithm 3, including GRH, efficient End(E0) representations, and prescribed-degree isogeny construction.
      verified_boundary: >-
        The paper explicitly places SÉTA in the SSI-T/full-torsion scope.
        Theorem 2 constructs an efficiently represented isogeny of prescribed
        degree from a source with known EndRing under GRH; it does not by
        itself construct Hom(E,C) to an already specified arbitrary C.

    - id: SETA-2019-1291
      title: 'Séta: Supersingular Encryption from Torsion Attacks'
      canonical_url: https://eprint.iacr.org/2019/1291.pdf
      retrieval_url: https://web.archive.org/web/20210921115849id_/https://eprint.iacr.org/2019/1291.pdf
      archive_timestamp: '20210921115849'
      retrieved_at_UTC: '2026-10-05T03:36:31.455347860Z'
      pdf_bytes: 455052
      sha256: e68fa5871be93bc031b5c68773b7bf1317c8033ebf917613c327aa73d6a309cd
      expected_sha256_match: true
      pdf_format_check: PDF 1.5
      section_reads:
        - Section 3.1 generalized nonbacktracking/cyclic walks and the full ordered torsion images.
        - Section 3.2, Lemma 3.1, Problem 3.2 and Lemma 3.3.
        - Section 3.3, Algorithm 1 and Lemma 3.4, including the explicit trapdoor T and kernel-to-message inversion.
        - Section 3.4 PKE KeyGen/Enc/Dec and Theorem 3.5.
      exact_short_quote: 'Let N^2 > 4D. Then for any j_T in J_T,p, f_j_T is injective.'
      quote_location: Lemma 3.1, notation normalized
      verified_boundary: >-
        SÉTA already has the full-action triple, strict injectivity argument,
        typed message recovery, and a special trapdoor T. P1 is a deletion of
        one action image, P2 quotients source labels, and P3 retains only the
        determinant. The historical security theorem is not adopted as a
        current security endorsement.

    - id: SIGAMAL-C-SIGAMAL-ASIACRYPT2020
      title: 'SiGamal: A Supersingular Isogeny-Based PKE and Its Application to a PRF'
      authors: [Tomoki Moriya, Hiroshi Onuki, Tsuyoshi Takagi]
      canonical_url: https://doi.org/10.1007/978-3-030-64834-3_19
      retrieval_url: https://link.springer.com/content/pdf/10.1007/978-3-030-64834-3_19.pdf
      retrieved_at_UTC: '2026-10-05T03:36:30.023316985Z'
      pdf_bytes: 516038
      sha256: b58a63807dc95cf63f36af671444889791920908020541bd82e315067b324061
      expected_sha256_match: true
      pdf_format_check: PDF 1.6
      version: published ASIACRYPT 2020 chapter
      section_reads:
        - Sections 3.1 and 3.2, Algorithm 3, SiGamal KeyGen/Enc/Dec, Theorem 6, scalar message embedding, discrete-log decode and sign correction.
        - Section 4.1, C-SiGamal KeyGen/Enc/Dec and Theorem 9.
        - Security-assumption statements for P-CSSCDH and P-CSSDDH adjacent to the scheme sections.
      verified_boundary: >-
        SiGamal/C-SiGamal use a commutative class/ideal action, an auxiliary
        point, explicit point-to-message Pohlig-Hellman decoding and sign
        handling. Their P-CSSCDH/P-CSSDDH assumptions and syntax are not bare
        full-EndRing inversion and are not instantiated by P1-P3.

    - id: LIT-SIGAMAL-2024-521
      title: 'LIT-SiGamal: An efficient isogeny-based PKE based on a LIT diagram'
      authors: [Tomoki Moriya, Miha Stopar]
      canonical_url: https://eprint.iacr.org/2024/521.pdf
      retrieval_url: https://web.archive.org/web/20250907044415id_/https://eprint.iacr.org/2024/521.pdf
