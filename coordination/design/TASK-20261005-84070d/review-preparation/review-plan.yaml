review_plan:
  id: REVIEW-CSTAR-20261005-84070d
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  batch_id: BATCH-576c9f
  preparation_task: TASK-20261005-84070d
  preparation_archive: TASK-20261005-6f0685
  producer_task: TASK-20261005-47d13a
  producer_snapshot: TASK-20261005-3a667c
  reviewer_tasks:
    - TASK-20261005-873293
    - TASK-20261005-13401d
  composer_task: TASK-20261005-1d7487
  ledger_archive: TASK-20261005-b65ed2
  final_decision_reserved: DEC-20261005-5cf97a
  claim_under_review: >-
    The future producer packet's exact C-star definitions, once quoted and
    commit/hash bound by TASK-20261005-3a667c, either do or do not provide an
    ordinary public-sender PKE interface with actual-message correctness, one
    concrete recipient algorithm derived from evaluable End(E), and an honest
    hardness-arrow statement that separates EndRing from added assumptions and
    public recovery. The round does not ask whether EndRing-PKE is possible in
    general or whether any candidate is secure, novel, practical, or deployable.
  claim_binding_status: pending_producer_snapshot
  claim_binding_rule: >-
    No reviewer may launch until the pushed TASK-20261005-3a667c receipt binds
    the exact six producer files, parent, commit, and all non-self SHA-256
    values. Red Team quotes the exact producer statements before judging
    J3-J5. The blind Validator reads no producer byte and judges J1-J2 only
    from its standalone card and producer-free statement.
  coordinator_prior: >-
    Recorded before any C-star producer output exists: a constant or overly
    lossy projection is likely to fail message separation, while a projection
    retaining an efficiently invertible full public action is likely to admit
    the same public map-to-message route as prior C. A middle projection may
    survive only if the producer gives an explicit public Encrypt and a
    concrete End(E)-derived SecretLift whose essential input is absent from the
    public interface. Even then, EndRing-solver-to-decrypt is expected to be
    the wrong direction for a semantic-security reduction unless a separate
    intermediate assumption is stated. These are priors, not verdicts; a fully
    typed construction and valid adversary-to-hard-problem reduction can
    overturn them.
  written_before_producer_output: true
  producer_artifacts_read_for_this_plan: []
  messages_used_as_scientific_input: false
  joints:
    - id: J1
      joint: >-
        J1 -- Projection correctness and message separation: derive necessary
        and sufficient typed conditions on a public projection Pi, Encrypt,
        SecretLift, and Decode for every admitted message/randomness pair to
        return the actual message, including rejection behavior and whether
        distinct messages can share the recipient's entire decoder input.
      assigned_to: TASK-20261005-873293
      attack_plan: >-
        Work only from the blind statement. Model the full recipient view as a
        typed value Z_sk(ct). Derive totality and left-inverse requirements and
        search for m != m' with equal Z values. Apply the constant-projection
        collision and the identity/full-public-inverse control. Refuse to infer
        correctness from existence or uniqueness of a Hom map, path, ideal,
        kernel, witness, or branch.
      breaking_artifact: >-
        A typed cross-message collision, undefined sender/decoder arrow,
        missing validation condition, or proof that the same inverse is public.
    - id: J2
      joint: >-
        J2 -- Exact reduction-direction audit: distinguish an EndRing solver
        that yields sk or decryption from a reduction that turns a successful
        PKE adversary into an EndRing solver, and identify every separately
        assumed intermediate problem needed for a legitimate security claim.
      assigned_to: TASK-20261005-873293
      attack_plan: >-
        Write both algorithms with oracle direction and advantage inequalities.
        Show that EndRing-solver-to-decrypt only gives Break <= EndRing as an
        upper-bound relationship and cannot prove semantic security from
        EndRing hardness. Test standard EC ElGamal whose scalar secret is
        deterministically derived from an EndRing encoding: the wrapper remains
        ElGamal syntax/security and is not a novel EndRing-security reduction.
      breaking_artifact: >-
        A reversed oracle arrow, an invalid advantage implication, an omitted
        intermediate assumption, or the ElGamal control incorrectly classified
        as novel EndRing-based security.
    - id: J3
      joint: >-
        J3 -- Every producer attempt, including all considered projection
        families and any finalist, has public Setup/KeyGen/Encrypt inputs and a
        typed ciphertext-to-actual-message correctness chain with declared
        domains, encodings, randomness, validation, and failure behavior.
      assigned_to: TASK-20261005-13401d
      attack_plan: >-
        Quote each snapshotted definition and trace every value. Replace the
        recipient secret with an opaque token during public operations; then
        seek endpoint/projection collisions and cross-message decoder-view
        collisions. Reject outputs that stop at Hom, path, ideal, kernel,
        witness, branch, shared value, or list instead of the declared message.
      breaking_artifact: >-
        A route-by-route typed value-flow table containing a secret-dependent
        sender step, undefined operation, exact collision, non-message output,
        or missing correctness quantifier.
    - id: J4
      joint: >-
        J4 -- Every finalist SecretLift is a concrete algorithm derived from
        the evaluable End(E) basis, uses no hidden extra secret, and remains
        recipient-only after endpoint, partial/full torsion, Robert,
        fixed-rank lattice, public-Hom, public reencryption, and exact
        assumption/reduction-direction attacks.
      assigned_to: TASK-20261005-13401d
      attack_plan: >-
        Quote SecretLift line by line; type each input/output and erase End(E)
        or replace missing objects with public evaluated Hom. Try public
        reencryption, finite torsion linear algebra, Robert full-action
        recovery, fixed-rank optimization, and exhaustive-search substitutions.
        Identify retained tau, connecting ideal, orientation, setup trapdoor,
        or additional secret explicitly, and draw security arrows in the
        claimed direction.
      breaking_artifact: >-
        A named-oracle placeholder, existence witness, exponential decoder,
        hidden extra secret, public recovery chain, or reversed/missing
        hardness arrow reaching the same message.
    - id: J5
      joint: >-
        J5 -- Exact primary-source and nonduplication boundary: compare the
        snapshotted attempts and any finalist with SÉTA, FESTA, POKE, PIKE,
        SiGamal/C-SiGamal, and LIT-SiGamal using independently retrieved or
        hash-verified primary text, and scope every result without a novelty,
        security, or universal-impossibility overclaim.
      assigned_to: TASK-20261005-13401d
      attack_plan: >-
        Independently retrieve each load-bearing paper or verify a fresh copy
        against the recorded hash, read the cited scheme/assumption sections,
        normalize syntax, secrets, public level data, masks, message arrow, and
        assumption direction, then identify exact overlap or exact unresolved
        delta. Preserve the POKE correction boundary, FESTA circulant-mask
        prior art, PIKE's non-reduction caveat, and Robert's stated interface.
      breaking_artifact: >-
        A primary-source quotation/hash/section contradicting the producer, an
        exact normalized overlap, an unresolved retrieval/comparison
        impediment, or an overbroad scope statement with its correction.
  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Validator and Red Team own disjoint joints in fresh independent native
      sessions and may not read, list, receive, or summarize sibling reports.
      The Coordinator composer may read both only after both are terminal.
  proves_too_much:
    objects:
      - >-
        A constant projection Pi(ct)=c0, where recipient correctness for two
        distinct messages is known false even if End(E) is disclosed.
      - >-
        An identity/full-public-inverse projection, where correctness may hold
        but recipient-only inversion is known false because the public can run
        the same inverse.
      - >-
        Standard EC ElGamal with its scalar secret deterministically derived
        from an EndRing encoding, where calling the wrapper a novel
        EndRing-security construction is known false absent a new reduction.
      - >-
        A proof containing only EndRing-solver-to-secret-key/decrypt, where a
        semantic-security reduction from adversary to EndRing is known absent.
    failure_signature: >-
      Any argument that concludes message separation on the constant
      projection, recipient-only advantage on the public inverse, novel
      EndRing security for the ElGamal wrapper, or a security reduction from
      the solver-to-decrypt arrow has proved too much and must be rejected.
    assigned_to: TASK-20261005-13401d
  blind_rederivation:
    required: true
    quantity: >-
      Q1: the typed projection/recipient-view conditions needed for actual
      message correctness and separation, tested on constant and public-inverse
      projections. Q2: the two opposite reduction directions and the precise
      implication each supports, tested on EndRing-derived EC ElGamal. Neither
      quantity is a verdict on a producer candidate or on EndRing-PKE generally.
    parameters: >-
      Abstract finite or efficiently representable domains PP, SK, PK, M, R,
      CFull, CProj; algorithms Setup, KeyGen, FullEnc, Pi, Encrypt, SecretLift,
      Decode, Validate; adversaries A; EndRing solver S; success/advantage
      events; and the standard EC ElGamal algorithms stated in the immutable
      producer-free blind statement.
    blind_from:
      - coordination/design/TASK-20261005-84070d/tasks/TASK-20261005-47d13a/
      - coordination/design/TASK-20261005-84070d/archives/TASK-20261005-3a667c/
