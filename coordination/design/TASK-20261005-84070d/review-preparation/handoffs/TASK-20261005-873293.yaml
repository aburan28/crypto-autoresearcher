    - All five blind controls have expected refusal, observed reasoning result, and concrete next obligation.
    - Reduction direction and advantage implications are explicit and do not treat solver-to-decrypt as a security reduction.
    - The output separates actual-message correctness from recipient-only and security claims.
    - review_attestation reports only the two permitted reads, no sibling read, and blind_from_respected true.
    - Exactly three outputs exist and runtime-session-receipt.json is written last.
