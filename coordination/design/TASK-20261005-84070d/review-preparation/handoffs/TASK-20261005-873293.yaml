    - coordination/design/TASK-20261005-84070d/review-preparation/reviews/TASK-20261005-873293/review-attestation.yaml
    - coordination/design/TASK-20261005-84070d/review-preparation/reviews/TASK-20261005-873293/runtime-session-receipt.json
  write_scope:
