    reasoning_effort: xhigh
    fallback_allowed: true
    fallback_boundary: native binding must satisfy the full review-adversarial xhigh contract
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0
    experiment_maximum_runs: 0
  completion_gate:
