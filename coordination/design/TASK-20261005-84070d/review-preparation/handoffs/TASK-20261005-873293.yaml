handoff:
  id: TASK-20261005-873293
  from: coordinator
  to: validator
  objective: >-
    In a fresh blind session, re-derive the abstract C-star projection,
    actual-message correctness/separation, and security-reduction direction
    conditions from the producer-free statement only.
  uncertainty_reduced: >-
    Whether J1 and J2 can be evaluated independently of any producer wording:
    which projection/decoder conditions are logically necessary, and which
    direction of reduction could actually base a PKE claim on EndRing.
  inputs:
    - coordination/design/TASK-20261005-84070d/review-preparation/handoffs/TASK-20261005-873293.yaml
    - coordination/design/TASK-20261005-84070d/review-preparation/blind/projected-interface-statement.yaml
  constraints:
    - >-
      Read exactly the two declared scientific inputs. Do not read, list, hash,
      receive, or summarize the global review plan, producer artifacts or
      snapshot, prior packet/reviews/composition, source notes, source papers,
      Red-Team card/reports, sibling messages, or any scientific message.
    - Own J1 and J2 only and report one explicit holds, breaks, or inconclusive verdict per stable ID.
    - >-
      For J1 derive totality, validation, left-inverse, and entire-recipient-view
      separation conditions. Exercise constant-projection,
      identity/full-public-inverse, and unique-object-without-message-arrow
      controls, with expected refusal, observed reasoning, and next obligation.
    - >-
      For J2 draw both oracle directions and advantage inequalities. Refuse to
      infer semantic security from EndRing-solver-to-sk/decrypt. Exercise the
      EndRing-derived standard EC ElGamal wrapper and named-intermediate-oracle
      controls without importing a producer or source claim.
    - >-
      Distinguish correctness, public recovery, recipient-only advantage,
      attack upper bounds, and adversary-to-hard-problem reductions. Do not
      issue a producer-specific or whole-claim verdict.
    - >-
      Use a fresh independent native review-adversarial/xhigh session. No
      Bedrock, no degradation below xhigh, zero experiments, zero
      implementation, no ledger/status/Git mutation.
    - >-
      Create exactly three outputs. review-attestation.yaml enumerates every
      actual read, joints_owned [J1,J2], per-joint verdict mapping, false
      sibling read, and true blind_from_respected. Write the runtime receipt last.
  deliverables:
    - coordination/design/TASK-20261005-84070d/review-preparation/reviews/TASK-20261005-873293/blind-rederivation.yaml
    - coordination/design/TASK-20261005-84070d/review-preparation/reviews/TASK-20261005-873293/review-attestation.yaml
    - coordination/design/TASK-20261005-84070d/review-preparation/reviews/TASK-20261005-873293/runtime-session-receipt.json
  artifact_paths:
