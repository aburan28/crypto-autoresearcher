    - ledger/goals/GOAL-SSI-2fa82a/checkpoints/BATCH-f72362.yaml
    - ledger/decisions/DEC-20261005-dbb0d2.yaml
  constraints:
    - >-
      Before reading a producer byte, verify the pushed
      TASK-20261005-3a667c snapshot commit, parent, exact six producer paths,
      receipt, and every non-self SHA-256. A mismatch blocks review and says
      nothing scientific.
    - Own J3, J4, and J5 only; issue one holds, breaks, or inconclusive verdict per stable ID and no whole-claim verdict.
    - >-
      Quote each producer route/finalist statement before evaluating it. Cover
      every attempted family, not only the selected finalist, and preserve
      route-specific failures.
    - >-
      For J3 trace Setup, KeyGen, Encrypt, SecretLift, Validate, and Decode
      value-by-value. Replace sk with an opaque token in public operations;
      require actual message output and quantified correctness rather than
      Hom/path/ideal/kernel/witness/shared-value/list output.
    - >-
      For J4 inspect SecretLift as executable pseudocode with typed
      representations and costs. Apply constant/endpoint collisions,
      partial/full torsion, Robert, public torsion linear algebra, fixed-rank
      lattice/basis reduction, public evaluated Hom, public reencryption, and
      public-inverse attacks. Charge retained tau, connecting ideal,
      orientation, setup trapdoor, extra secret, named oracle, and exhaustive
      enumeration separately. Audit both hardness-arrow directions and reject
      generic ElGamal/LWE-secret wrappers as EndRing-only constructions.
    - >-
      For J5 independently retrieve every load-bearing primary paper or verify
      a fresh independently obtained PDF against the recorded hash, then read
      the exact scheme and assumption sections. Intake and prior verification
      are locators, not substitutes. Record URL/archive, hash, sections, and
      retrieval time or a precise source impediment.
    - >-
      Compare normalized syntax and assumptions with SÉTA, FESTA, POKE, PIKE,
      SiGamal/C-SiGamal, and LIT-SiGamal. Do not infer a break of POKE Section 4
      from its split-KEM/OPRF correction, claim a masking-family delta already
      contemplated by FESTA, or invent PIKE/POKE/EndRing equivalence.
    - >-
      Exercise every proves-too-much object from the plan. For each failed
      definition give one concrete forward obligation. Do not claim security,
      novelty, deployment fitness, EndRing hardness/easiness, or universal
      EndRing-PKE impossibility.
    - Do not read, list, receive, or summarize Validator outputs or messages.
    - >-
      Use a fresh independent native review-adversarial/xhigh session. No
      Bedrock, no degradation below xhigh, zero experiments, zero
      implementation, and no ledger/status/Git mutation.
    - Create exactly four outputs; runtime-session-receipt.json is written last.
