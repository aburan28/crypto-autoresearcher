comparisons:
  - family: SETA
    normalized_interface: full ordered torsion action, cyclic-slope kernel encoding, finite-level injectivity and kernel-to-message inversion
    relation:
      P1_one_column: deletes one action image; a polynomial private completion is absent
      P2_fresh_mask_orbit: hides source labeling but adds independent mask recovery
      P3_pairing_determinant: retains only the constant determinant invariant
    boundary: the prior exact N^2>4D uniqueness lemma already occurs in SETA; it is not a novelty delta
    provenance: internal record of independently retrieved source sections
    source_record: coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/source-verification.yaml
  - family: FESTA
    normalized_interface: connecting isogeny plus commuting torsion mask; CIST2/decisional hybrid and correlated scaled-action data
    relation: P2 resembles a masked torsion interface but lacks a recipient mask/connecting secret and cannot relabel those additions as End(E)
    boundary: circulant masks and cyclic kernels are already contemplated; changing mask family is no novelty argument
    provenance: internal record of independently retrieved source sections
    source_record: coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/source-verification.yaml
  - family: POKE
    normalized_interface: higher-dimensional masked parallel-isogeny PKE with secret unmasking/shared-point recovery; C-POKE in ROM
    relation: no attempted family reconstructs POKE's higher-dimensional object, and P1/P2 cannot borrow its secret-unmasking arrow
    boundary: an endomorphism used in KeyGen does not replace POKE's controlling assumption by bare EndRing
    provenance: internal record of independently retrieved source sections
    source_record: coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/source-verification.yaml
  - family: PIKE
    normalized_interface: masked single-point data and a pairing-derived shared value under its own assumption
    relation: P1's one-point shape and P3's pairing compression are within this comparison boundary, but neither supplies a shared-value or message decoder
    boundary: the cited PIKE/LIT relationship is heuristic and no PIKE-to-EndRing reduction is imported
    provenance: internal record of independently retrieved source sections
    source_record: coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/source-verification.yaml
  - family: SiGamal_and_C_SiGamal
    normalized_interface: commutative class/ideal action with auxiliary point, typed point-to-message discrete-log decoding and sign handling
    relation: none of P1/P2/P3 instantiates that action; none may borrow its message arrow or assumption
    boundary: these are not bare full-EndRing inversion interfaces
    provenance: internal record of independently retrieved source sections
    source_record: coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/source-verification.yaml
  - family: LIT_SiGamal
    normalized_interface: masked LIT diagram, public parallel vertical maps, secret horizontal-map reconstruction, typed plaintext log and LIT assumptions
    relation: P2 lacks the secret reconstruction datum; adding it changes the secret/assumption rather than completing an End(E)-only lift
    boundary: no EndRing equivalence or security transfer is imported
    provenance: internal record of independently retrieved source sections
    source_record: coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/source-verification.yaml
  - family: Robert_full_torsion_recovery
    normalized_interface: full rational basis action with known coprime smooth factorizations and fixed-dimensional reconstruction
    relation:
      P1_one_column: one required basis image is absent, so direct theorem admission fails
      P2_fresh_mask_orbit: hidden A blocks exact action; revealing/inverting A restores admission
      P3_pairing_determinant: action values and codomain are absent
    exact_conditions: >-
      For the prior full-action baseline N_A=N=5^b and N_B=D=2^a,
      N^2>4D>D, factorizations and smoothness are public, source/target
      N-bases are rational over represented F, the cyclic-kernel embedding has
      the required rank, and model conversions/field/preprocessing costs are charged.
    caveat: nonapplicability to a projection is not evidence that the projection is secret or EndRing-hard
    provenance: internal record of independently retrieved source sections
    source_record: coordination/design/TASK-20261005-638ca5/review-preparation/reviews/TASK-20261005-5cf08f/source-verification.yaml
