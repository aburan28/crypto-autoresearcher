task_id: TASK-20261005-47d13a
selected_finalist: null
gate: >-
  A named oracle, witness existence, exponential enumeration, retained path,
  connecting ideal, orientation, tau, setup trapdoor, or extra secret does not
  qualify as an EndRing-only polynomial SecretLift.
input_representation:
  EndE: >-
    Four evaluable integral endomorphisms of E, a multiplication table,
    rational coordinates, explicit map representations, and model-isomorphism
    transport, modulo GL_4(Z) basis change.
  public_common: '(E,U,V,P,Q,D,N,k,F,encodings,certificates)'
  cost_model: bit operations plus represented-field operations; charge '[F:F_p]', coordinate size, map output, preprocessing and canonicalization
attempts:
  P1_one_column:
    submitted_algorithm: LiftEnum_1
    pseudocode:
      - Parse and validate ct=(C,X); otherwise return bottom.
      - Initialize an empty streamed set S.
      - For each t in '[0,D)': compute K_t=<U+tV> and the normalized quotient phi_t:E->C_t.
      - If normalized '(C_t,phi_t(P))' equals ct, emit '(t,phi_t)' into S.
      - If S is empty return bottom; otherwise return S.
    EndE_operations_used: []
    output_representation: streamed coefficient plus evaluated degree-D quotient chain for each match
    correctness_condition: >-
      On every valid encryption, its true s is emitted. Actual-message decoding
      additionally requires all emitted coefficients to have the same residue modulo 2^k.
    correctness_status: true-s inclusion holds; message separation unproved
    time: 'Theta(D) quotient reenactments, each a degree-2 steps plus normalization'
    memory: streaming one chain and one coefficient, excluding public field tables
    failure_behavior: bottom on invalid/no match; AMBIGUOUS when matches have distinct low-k residues
    polynomial_status: fail; D=2^a is exponential in the parameter bit length
    public_substitution: identical algorithm runs without End(E)
    desired_replacement:
      name: Complete_2
      input: '(EndE,E,C,X=phi_s(P),P,Q,D,N)'
      output: 'phi_s(Q), or an equivalent fully evaluated degree-D phi_s'
      correctness: >-
        For every generated key and valid P1 ciphertext, output exactly the
        missing value/map belonging to the sender's phi_s, except with an
        explicitly bounded failure probability independent of the message.
      required_time_memory: polynomial in total encoded input and output length
      forbidden_hidden_inputs: [path, connecting ideal, orientation, tau, setup trapdoor, extra secret, exponential search]
      status: no algorithm supplied
      type_obstruction: >-
        End(E) acts on Hom(E,C) only after an element or evaluated basis of
        that connecting module is available; (C,X) supplies neither.
  P2_fresh_mask_orbit:
    submitted_algorithm: LiftEnum_mask
    pseudocode:
      - Parse ct=(C,Z_1,Z_2); verify it is an ordered N-torsion basis; otherwise return bottom.
      - For each t in '[0,D)', compute normalized Y_t=(phi_t(P),phi_t(Q)).
      - For each canonical B in 'SL_2(Z/NZ)', compare normalized '(C_t,Y_t*B)' with ct.
      - Emit every matching '(t,B,phi_t)'; return bottom if none.
    EndE_operations_used: []
    output_representation: streamed compatible coefficient, mask and quotient chain
    correctness_condition: the true '(s,A,phi_s)' is emitted for every valid encryption
    correctness_status: inclusion holds; uniqueness of message does not
    time: 'Theta(D*|SL_2(Z/NZ)|) comparisons plus D quotient constructions'
    memory: streaming one map, one matrix and one coefficient
    failure_behavior: bottom on invalid/no match; AMBIGUOUS on distinct low-k residues
    polynomial_status: fail
    public_substitution: identical algorithm runs without End(E)
    desired_replacement:
      name: Unmask_from_EndE
      input: '(EndE,C,Z_1,Z_2)'
      output: 'A^{-1} or the exact ordered pair (phi_s(P),phi_s(Q))'
      status: no algorithm supplied
      type_obstruction: fresh A is independent sender randomness and is not a function of End(E)
      charged_variants:
        - Publishing A gives a public inverse and restores the Robert/full-action route.
        - Sending A privately adds an undeclared channel/per-ciphertext secret.
        - A long-term mask or connecting isogeny is an added secret and assumption, not bare EndRing.
  P3_pairing_determinant:
    submitted_algorithm: ValidateInvariant
    pseudocode:
      - Parse c as an element of mu_N(F); otherwise return bottom.
      - Compute z=e_N(P,Q)^D from public data.
      - If c=z return z; otherwise return bottom.
    EndE_operations_used: []
    output_representation: one canonical element of mu_N(F)
    correctness_condition: every valid encryption returns z
    correctness_status: holds for invariant validation; cannot decode a message
    time: polynomial represented-field pairing/exponentiation cost
    memory: polynomial field-element storage
    failure_behavior: bottom on malformed or nonconstant input
    polynomial_status: pass only for a nondecoding constant
    public_substitution: identical
    impossibility_for_this_observation: >-
      Since every (m,r) maps to z, no deterministic or randomized decoder can
      return every original m with probability one from (sk,z); End(E) does not
      identify which preimage was sampled.
