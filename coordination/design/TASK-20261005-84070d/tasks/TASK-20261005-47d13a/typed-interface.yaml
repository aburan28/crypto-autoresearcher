  result: no wrapper proposed
remaining_obligation: >-
  Give a uniform polynomial Complete_2(O,E,C,X,P,Q,D,N) for every valid P1
  ciphertext, returning phi_s(Q) or an equivalent evaluated degree-D map from
  only evaluable End(E) and public inputs, with polynomial output and explicit
  failure, no connecting ideal/path/orientation/tau/trapdoor/extra secret; then
