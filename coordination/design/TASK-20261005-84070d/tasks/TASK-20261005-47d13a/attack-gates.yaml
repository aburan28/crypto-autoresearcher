selected_finalist: null
quantifier_preamble: >-
  Fix Setup, KeyGen and each projection algorithm before keys or ciphertexts
  are sampled. Correctness ranges over every certified parameter tuple, every
  key in KeyGen support, every message, and every allowed encryption coin.
  A polynomial SecretLift must be one uniform algorithm fixed before those
  universal quantifiers, with explicit failure probability and polynomial
  input/output representations.
common_controls:
  endpoint_projection_collision: applied per family
  constant_projection: applied per family
  partial_full_torsion: applied per family
  Robert: >-
    Check exact public full smooth action, rational source/target bases,
    known coprime factorizations, kernel rank, model conversion, field degree,
    preprocessing and output representation. N=5^b,D=2^a satisfy N^2>4D>D,
    but modified projections do not inherit full-action recovery automatically.
  public_finite_torsion_linear_algebra: applied per family
  fixed_rank_lattice: applied whenever evaluated Hom or four coordinates are exposed
  public_Hom: replace SecretLift output by publicly evaluated Hom and rerun decode
  public_reencryption: enumerate declared finite sender coins and compare exact normalized ciphertexts
  public_inverse: reveal omitted projection randomness and test whether inversion becomes public
  wrapper: reject generic ElGamal/LWE/KEM/PKE layers whose own assumption controls secrecy
  rationality: all declared torsion and ciphertext points represented over explicit F; '[F:F_p]' charged
  smoothness_and_factorization: 'D=2^a,N=5^b with known factorization; no generic-log cost substituted'
  rank: source torsion bases rank two; End/Hom lattices rank four; Robert embedding fixed dimension eight where applicable
  model: simultaneous canonical curve/point transport required; pairing and equality use the transported model
  preprocessing_and_output: field construction, torsion bases, four-squares/source preprocessing and evaluated-map output are separately charged
proof_search_map:
  P1_one_column:
    bottleneck: complete one action image to the exact degree-D quotient map using only evaluable End(E)
    baseline_embedding:
      parameter_slice: prior Route C with the second public image phi_s(Q) deleted
      reproduction_check: >-
        Restoring phi_s(Q) gives the exact full-action triple; under the audited
        rationality/smoothness/rank/model conditions Robert publicly recovers
        the map/message. Deleting both images leaves endpoint-only ambiguity.
    observation_collision:
      observable: normalized '(C_s,phi_s(P))'
      distinct_preimage_search: >-
        Compare all s,t symbolically. Equality kills only <P>; search for
        cross-message pairs and target automorphisms fixing the retained point.
        No universal collision or separation theorem is established.
      result: unresolved observation fiber; full-basis N^2 divisibility proof cannot be reused
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: one-column completion Complete_2 from End(E)
        predicted_gain: restore the second action value without publishing it
    quantifier_order: >-
      Exists one uniform polynomial Complete_2 such that for every setup, key,
      message and randomness in support it returns the sender's missing image,
      before any claim about decoding or public/private separation.
    method_ceiling:
      strongest_certifiable_claim: finite true-preimage inclusion by D-term public reencryption
      nearby_object_control: >-
        Give evaluated Hom(E,C) publicly. Fixed-rank lifting plus the one image
        may constrain candidates, but any successful identical computation is public.
    proof_obligations:
      - {claim: one-column observation separates low-k message classes, responsibility: correctness}
      - {claim: Complete_2 exists and is uniform polynomial time/output, responsibility: feasibility}
      - {claim: output enables exact s then m, responsibility: interface}
      - {claim: public controls cannot compute the same output, responsibility: scope}
    gates:
      endpoint_projection_collision: unresolved; endpoint plus one image may collide
      constant_projection: pass; retained point varies in general, but variation does not prove separation
      partial_full_torsion: fail full-action premise; only one cyclic subgroup action is known
      Robert: not directly admitted because a full target N-basis image is absent; this is an interface fact, not secrecy
      public_finite_torsion_linear_algebra: cannot manufacture the second image without an evaluated connecting map
      fixed_rank_lattice: public once an evaluated Hom basis is supplied; does not supply that basis
      public_Hom: defeats recipient-only inference for any continuation identical after Hom publication
      public_reencryption: exact but D-term exponential and public
      public_inverse: not applicable; no random mask, only deleted data
      verdict: fail
  P2_fresh_mask_orbit:
    bottleneck: recover the independently sampled mask or source-basis labeling from End(E)
    baseline_embedding:
      parameter_slice: set A=I or publish A
      reproduction_check: exact prior full-action Route C reappears and audited public recovery applies
    observation_collision:
      observable: normalized '(C_s,Y_s A)'
      distinct_preimage_search: compare '(s,A)' and '(t,B)' over the exact finite domains
      result: source labels are intentionally quotiented; no low-k message-separation theorem supplied
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: an End(E)-derived canonical representative of the masked orbit
        predicted_gain: select the sender's unmasked ordered action
    quantifier_order: >-
      Exists one uniform polynomial Unmask_from_EndE such that for every valid
      independently sampled A it returns A^{-1} or exact Y_s from End(E) and ct.
    method_ceiling:
      strongest_certifiable_claim: exhaustive public list recovery over D times G_N
      nearby_object_control: publish A; inversion and then full-action recovery are public
    proof_obligations:
      - {claim: compatible masked observations separate message classes, responsibility: correctness}
      - {claim: fresh A is recoverable from End(E) without extra secret, responsibility: feasibility}
      - {claim: masking interface is distinct from FESTA/LIT/POKE/PIKE structures, responsibility: scope}
    gates:
      endpoint_projection_collision: unresolved inside the masked observation fiber
      constant_projection: pass; not constant, but orbit loss remains
      partial_full_torsion: masked full rank is not exact labeled full action
      Robert: absent only while A is hidden; publishing/inverting A restores its hypotheses
      public_finite_torsion_linear_algebra: solves for public known masks, not an independent hidden A
      fixed_rank_lattice: public after unmasking/evaluated Hom; no private advantage follows
      public_Hom: does not reveal independent A by type alone
      public_reencryption: exact but D*|G_N| and public
      public_inverse: decisive; revealing A makes the intended lift public
      wrapper: a long-term secret mask/connecting isogeny is an added FESTA/LIT-style assumption
      verdict: fail
  P3_pairing_determinant:
    bottleneck: retain any message-dependent information after determinant projection
    baseline_embedding:
      parameter_slice: all valid degree-D Route-C maps
      reproduction_check: Weil pairing gives 'e_N(phi(P),phi(Q))=e_N(P,Q)^D'
    observation_collision:
      observable: one element of mu_N, equal to 'e_N(P,Q)^D'
      distinct_preimage_search: choose any two messages and any allowed randomness
      result: every pair collides exactly
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: full fiber of the constant determinant invariant
        predicted_gain: proves this projection cannot carry plaintext
    quantifier_order: >-
      For every key, every m,m' and every r,r', Enc_det(pk,m;r)=Enc_det(pk,m';r').
      Therefore no single-valued decoder returns every original message.
    method_ceiling:
      strongest_certifiable_claim: exact scoped correctness failure for this invariant-only projection
      nearby_object_control: full ordered action distinguishes maps under the strict bound but is publicly recoverable under audited conditions
    proof_obligations:
      - {claim: determinant projection is constant, responsibility: correctness}
      - {claim: constant observation cannot admit an all-message left inverse, responsibility: interface}
    gates:
      endpoint_projection_collision: endpoint is omitted; exact total collision
      constant_projection: fail decisively
      partial_full_torsion: only determinant retained; no action values
      Robert: not admitted because no curve/action basis is supplied; no secrecy inference follows
      public_finite_torsion_linear_algebra: computes the same public constant
      fixed_rank_lattice: extra Hom data cannot identify a sampled preimage of a constant observation
      public_Hom: still no ciphertext binding to one map
      public_reencryption: confirms every message maps to the same value
      public_inverse: no inverse exists on the multi-message fiber
      verdict: fail
security_reduction_directions:
  problem: 'EndRingEval on exact E distribution -> evaluable integral End(E) basis'
  available_if_decoder_existed: 'EndRingEval solver -> sk -> SecretLift/Decode -> break scheme'
  interpretation: attack/upper-bound direction only
  required_for_EndRing_based_security: 'scheme adversary -> EndRingEval solver'
  required_arrow_status: absent
  intermediate_assumptions: none proposed
method_ceiling_overall: >-
  Certify only three scoped failed definitions, their finite/public fallbacks,
  and one remaining construction obligation. This method cannot certify a PKE,
  semantic security, EndRing hardness transfer, novelty, efficiency,
  practicality, deployment fitness, or universal impossibility.
nearest_known_false_controls:
  - Publishing the missing P1 image must trigger the Robert full-action/public-recovery control.
  - Publishing P2's mask must make inversion public, not recipient-exclusive.
  - Adding Hom/path/ideal/orientation/tau to sk must be charged as a changed secret.
  - A constant invariant must be rejected even if End(E) is available.
  - A generic PKE wrapper must retain its original assumption and is not an EndRing construction.
remaining_obligation:
  id: OBL-CSTAR-COMPLETE2
  exact_statement: >-
    Construct the uniform polynomial P1 Complete_2 algorithm and prove both its
    typed correctness and its separation from every public-recovery control;
    otherwise retain P1 as failed without extrapolating to other projections.

