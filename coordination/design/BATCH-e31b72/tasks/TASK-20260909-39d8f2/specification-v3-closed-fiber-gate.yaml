draft_protocol_amendment:
  id: EXP-ECDLP-f52cb6-draft-v3-closed-fiber-gate
  disposition: Additive zero-run closed public/null/fiber/result envelopes.
  public_manifest:
    exact_keys: [source_commit, group_id, generator_digest, factor_base_digest, offset_set_digest, membership_unit]
    identity: SHA-256 canonical JSON
  null_manifest:
    exact_keys: [public_manifest_identity, null_id, cardinality_decimal, negation_symmetry, coordinate_bucket_digest, membership_unit, offset_set_digest]
    binding: public_manifest_identity and all shared shape fields must equal public manifest
  fiber_receipt:
    exact_keys: [public_manifest_identity, target_fingerprint_digest, scalar_domain_digest, scalar_domain_count_decimal, fiber_digest, fiber_count_decimal, omitted_digest, work_units_decimal, data_bytes_decimal]
    completeness: scalar_domain is fixed source-bound canonical array; every scalar maps exactly once to fiber or omitted array; omitted digest is SHA-256 canonical omitted array; counts/digests recompute
    charge: work_units_decimal equals scalar_domain_count_decimal and data_bytes_decimal equals canonical domain byte length
  resolver:
    exact_keys: [kind, manifest_identity, target_fingerprint_digest]
    kind_enum: [FIBER_RECEIPT_REFERENCE]
    allowed_artifacts: [fiber_receipt]
    forbidden: [scalar, scalar_map, target_index, lookup_table, candidate_scalar]
  result:
    exact_keys: [verdict, public_manifest_identity, null_manifest_identity, fiber_receipt_identity, interpretation]
    verdict_enum: [INFORMATION_GATE_INCONCLUSIVE, NULL_NOT_SEPARATED, BLINDING_FAILED, DECAY_FAILED]
    interpretation_exact: toy public overlap information gate only
    forbidden_fields: [decoder, scalar_recovery, speedup, complexity, online_inverse, ECDLP]
  refusal: any mismatch, undeclared artifact, incomplete/uncharged receipt, resolver violation, or forbidden field yields INVALID_INTERFACE
  does_not: [authorize_fiber_enumeration, authorize_execution, create_canonical_records, create_ECDLP_result]
