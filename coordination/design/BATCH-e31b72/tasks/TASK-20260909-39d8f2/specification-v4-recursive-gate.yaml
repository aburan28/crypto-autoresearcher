draft_protocol_amendment:
  id: EXP-ECDLP-f52cb6-draft-v4-recursive-gate
  disposition: Additive zero-run recursive identity/dependency gate.
  manifest_record:
    exact_keys: [schema_version, source_commit, group_id, generator_digest, factor_base_digest, offset_set_digest, membership_unit]
    schema_version: target-shift-manifest-v1
    identity: SHA-256 canonical JSON
  null_record:
    exact_keys: [schema_version, public_manifest_identity, group_id, generator_digest, factor_base_digest, offset_set_digest, cardinality_decimal, negation_symmetry, coordinate_bucket_digest, membership_unit]
    identity: SHA-256 canonical JSON
    equality: all public identity fields and membership_unit must equal referenced public manifest
  artifact_record:
    exact_keys: [kind, identity, dependencies]
    kind_enum: [SCALAR_DOMAIN, FIBER_ARRAY, OMITTED_ARRAY, FIBER_RECEIPT]
    dependencies: canonical sorted identity list; only declared kinds allowed
    scalar_nonidentifiability: scalar-domain and fiber arrays may contain only opaque SHA-256 transcript labels, never scalar encodings or preimages
  fiber_receipt:
    exact_keys: [schema_version, public_manifest_identity, target_fingerprint_digest, scalar_domain_artifact, fiber_artifact, omitted_artifact, work_units_decimal, data_bytes_decimal]
    exact_once: fiber and omitted labels are disjoint and their sorted union equals scalar-domain labels
    identity_binding: every referenced artifact identity must resolve in closed artifact graph
  resolver:
    exact_keys: [kind, public_manifest_identity, target_fingerprint_digest, fiber_receipt_identity]
    kind: FIBER_RECEIPT_REFERENCE
    dependency_closure: resolver may resolve only receipt then opaque artifact identities; target-indexed/scalar-bearing dependencies refuse
  result:
    exact_keys: [schema_version, verdict, public_manifest_identity, null_manifest_identity, fiber_receipt_identity, interpretation]
    schema_version: target-shift-result-v1
    verdict_enum: [INFORMATION_GATE_INCONCLUSIVE, NULL_NOT_SEPARATED, BLINDING_FAILED, DECAY_FAILED]
    interpretation: toy public overlap information gate only
    recursive_forbidden: [scalar, scalar_map, decoder, recovery, speedup, complexity, inverse, ECDLP]
  does_not: [authorize_fiber_enumeration, authorize_execution, create_canonical_records, create_ECDLP_result]
