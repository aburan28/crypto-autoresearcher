draft_protocol_amendment:
  id: EXP-ECDLP-f52cb6-draft-v2-total-interface
  disposition: Additive zero-run typed information-gate interface.
  public_inputs:
    exact_keys: [source_commit, group_id, generator_digest, factor_base_digest, offset_set_digest, membership_unit]
    identity: SHA-256 of canonical JSON; all values must be identical across targets
  null_relation:
    exact_keys: [null_id, cardinality, negation_symmetry, coordinate_bucket_digest, membership_unit, offset_set_digest]
    same_shape: cardinality, negation_symmetry, coordinate_bucket_digest, membership_unit, offset_set_digest equal public input manifest
  fiber_oracle:
    scalar_domain: canonical ordered array of every toy scalar exactly once
    relation: scalar is included iff its canonical fingerprint equals target fingerprint
    completeness: receipt contains domain_digest, included_digest, omitted_digest equal empty-array digest, work_units_decimal, data_bytes_decimal
    charge: work_units_decimal >= scalar_domain cardinality and data_bytes_decimal >= serialized domain bytes
  offline_online:
    offline_artifacts: [public_input_manifest, null_manifest, no target-indexed scalar map]
    online_output_exact_keys: [fingerprint, candidate_fiber_reference, verification_only]
    refusal: target_indexed_scalar_lookup or scalar output yields INVALID_INTERFACE
  interpretation:
    allowed_verdicts: [INFORMATION_GATE_INCONCLUSIVE, NULL_NOT_SEPARATED, BLINDING_FAILED, DECAY_FAILED]
    forbidden_terms: [decoder, scalar_recovery, speedup, sub_square_root, ECDLP_attack]
    any_forbidden_term: INVALID_INTERFACE
  does_not: [authorize_fiber_enumeration, authorize_execution, create_canonical_records, create_ECDLP_result]
