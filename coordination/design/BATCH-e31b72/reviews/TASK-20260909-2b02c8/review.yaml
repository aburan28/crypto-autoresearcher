  scope:
    kind: source_only_Batch_local_design_review
    scientific_executions: 0
    artifacts_created: 0
    conclusion_scope: The findings concern only whether the frozen mock interface enforces its stated information-gate and no-decoder boundaries.
  attack_results:
    - attack: target_dependent_base
      expected: The factor base and offsets must be immutable public objects whose identity is independently testable before targets are supplied.
      observed: The specification lists factor_base_predicate and offset_set as required names and asserts frozen_before_targets, but supplies no closed input schema, identity, hash, target-domain definition, or equality rule binding either object across target instances.
      result: breaks
      implication: A producer can choose a target-dependent factor base or offsets while still supplying fields with those names; the stated public-interface condition cannot detect it.
    - attack: null_shape
      expected: The null must have the same declared target, factor-base, offset, representation, and data-access shape as the tested object, differing only by the preregistered null-generating transformation.
      observed: same_shape_blinded_null and null_generator are labels only. No null object schema, shape vector, shared-field equality relation, blinded-target relation, or null-manifest validation rule is specified.
      result: breaks
      implication: A null with a different candidate universe or data representation can be called same-shape without an interface-level refusal.
    - attack: uncharged_or_incomplete_fiber
      expected: A toy fiber must bind a finite scalar domain, a complete enumerated candidate set, the target it belongs to, a completeness witness, and time/data accounting in declared units.
      observed: The draft says exact scalar-fiber enumeration is charged as N time/data, but N is undefined; neither the scalar domain nor the fiber relation, completeness predicate, receipt schema, time unit, data unit, or required enumeration coverage is defined. fiber-oracle-receipt.json is named but unconstrained.
      result: breaks
      implication: A truncated or selectively filtered fiber can be presented as complete, and an exhaustive toy enumeration can be reported without a meaningful charged cost.
    - attack: online_inverse
      expected: The information gate must define allowed offline artifacts and prohibit outputs, indexes, or queries that map a live target to a scalar or equivalent inverse information.
      observed: no online inversion appears only as a prose limit. The specification gives no target/query model, permitted-output schema, separation of offline and online data, or test that a fiber artifact is not used as a lookup inverse.
      result: breaks
      implication: A target-indexed scalar lookup can be described as a toy overlap artifact without violating a machine-checkable boundary.
    - attack: decoder_claim
      expected: The result and interpretation envelopes must be closed and must refuse scalar-recovery, decoder, speedup, and sub-square-root claim fields or semantic equivalents.
      observed: decoder wording yields INVALID_INTERFACE is a prose refusal condition, while the draft does not define a result schema, controlled vocabulary, required conclusion fields, or lexical/structural matcher for a decoder claim.
      result: breaks
      implication: "The stated no-decoder ceiling is not enforceable: a decoder claim can appear in an unconstrained report or through synonymous wording."
  positive_checks:
    - The four BATCH-local draft paths exist and match the source snapshot named in the review plan.
    - The hypothesis, specification, and readiness text explicitly state zero-run, no-decoder, no-online-inversion, and no-ECDLP-result intentions.
    - The readiness and duplication audit do not claim a source-bound factor base, a fiber enumeration, entropy evidence, novelty, dominance, or an ECDLP result.
  verdict: breaks
  required_repair:
    - Replace field-name assertions with closed, source-bound public input and target envelopes, including target-independent factor-base and offset identities.
    - Define a typed same-shape blinded-null relation with an exact equality/difference predicate and refusal behavior.
    - Define the toy scalar domain, fiber relation, exhaustive coverage proof, receipt schema, and time/data accounting units before any toy fiber work is admitted.
    - Define allowed artifacts, offline/online query separation, and a closed output schema that makes an inverse lookup structurally impossible within this gate.
    - Define a closed interpretation/result envelope with explicit prohibited claim classes; treat this draft as BATCH-local and unapproved until a fresh independent review holds.
  limitations:
    - This review did not enumerate a fiber, create a fixture, select a curve, retrieve sources, implement code, execute an experiment, or assess a mathematical ECDLP claim.
    - The breaks verdict applies only to the assigned public-interface and no-decoder joint.
  artifact_paths:
    - coordination/design/BATCH-e31b72/reviews/TASK-20260909-2b02c8/review.yaml
