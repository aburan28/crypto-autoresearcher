      result: holds
      detail: Parsed as a YAML mapping; SHA-256 is d7adc533845d0226d15058963b25cc1e6af22ed3c875012498fafd33d9ed2c77 and the current bytes match the pinned commit.
    - artifact: proposed public/null/fiber/resolver/result artifacts
      check: live evidence inventory
      result: not_applicable
      detail: The decision explicitly authorizes no manifest, fiber, code, canonical record, or execution. Their absence is not negative mathematical evidence and this review does not treat it as such.
  joint_checks:
    - control: manifest_mismatch
      result: breaks
      finding: The public and null declarations are not a closed or type-defined serialization. The null record omits group_id, generator_digest, and factor_base_digest, while its stated shared-shape binding has no comparator or equality relation for the two different key sets. public_manifest_identity is named but no canonical-JSON algorithm, field grammar, or manifest instance binds it to the declared public manifest. An unrelated group or factor base can therefore be hidden behind an arbitrary digest string without an interface-level refusal rule.
      impact: The same-shape null cannot be shown to correspond to the public object, so the null control is not structurally bound.
    - control: incomplete_receipt
      result: breaks
      finding: The receipt calls scalar_domain a fixed source-bound canonical array, but supplies neither a typed array artifact nor its identity, source binding, canonical encoding, array comparator, element grammar, duplicate policy, or verifier. fiber_digest and omitted_digest similarly name hashes without defining the preimages. Decimal counts and data_bytes have no grammar, and fiber_receipt_identity in the result has no specified derivation or equality binding to the receipt. Consequently exact-once coverage, charge, and count/digest recomputation are only prose requirements.
      impact: A partial or uncharged receipt cannot be mechanically distinguished from a complete receipt.
    - control: target_resolver
      result: breaks
      finding: Resolver manifest_identity is not required to equal fiber_receipt.public_manifest_identity, and resolver target_fingerprint_digest is not required to equal the receipt target fingerprint. allowed_artifacts is an untyped symbolic list, not a closed dependency graph with artifact identities. The field list also does not define a resolver evaluation relation. A target-indexed external artifact can therefore be substituted while presenting a syntactically named FIBER_RECEIPT_REFERENCE.
      impact: The contract does not structurally exclude target-indexed online resolution.
    - control: scalar_artifact
      result: breaks
      finding: The resolver-local forbidden-name list is not a recursively closed artifact schema. It does not constrain the contents or dependencies of the claimed fiber_receipt, scalar-domain array, digest preimage, or any artifact reachable from the resolver. The declared scalar-domain partition itself has no typed non-scalar representation. A scalar or scalar map can thus occur in an untyped nested or referenced artifact without violating a stated parser rule.
      impact: The proposed no-scalar boundary is lexical and local rather than structural.
    - control: forbidden_result
      result: breaks
      finding: 'result.exact_keys, verdict_enum, interpretation_exact, and forbidden_fields are declarations rather than a versioned closed result grammar with recursive value schemas and validation rules. A semantic claim can be placed in an untyped digest preimage, artifact dependency, or an unconstrained string value. More directly, the preregistered complete singleton toy-fiber control has no minimum ambiguity or non-identifiability condition: a one-element fiber whose underlying domain element is a scalar can expose that scalar while the top-level interpretation remains the fixed permitted string.'
      impact: The proves-too-much control fails; no interface rule prevents a singleton toy observation from functioning as scalar recovery outside the lexical result field list.
  control_checks:
    - control: complete_singleton_toy_fiber
      expected_failure_signature: It cannot produce scalar recovery or an ECDLP result.
      result: breaks
      detail: The v3 schema lacks a typed candidate representation, a non-identifiability requirement, and a recursive ban on scalar-bearing dependent artifacts. The required failure signature is therefore not enforced.
  metric_recomputations: []
  heuristic_validation_checks: []
  cost_model_checks: []
  proof_architecture_checks: []
  verdict: breaks
  limitations:
    - This verdict concerns only the assigned source-level closed-fiber-gate interface.
    - No manifest, fiber, curve, implementation, execution receipt, metric, or ECDLP result was available or evaluated.
    - The review does not establish any mathematical negative result about target shifts, factor bases, or ECDLP.
  required_repair:
    - Supply versioned, typed, recursively closed public and null manifest records with a fixed canonical encoding, field grammars, and an executable equality relation that binds group, generator, factor base, offsets, and membership shape.
    - Bind a typed source-pinned scalar-domain artifact, typed fiber and omitted arrays, exact-once partition verifier, hash preimages, decimal grammars, duplicate policy, and charge/data computations to a closed receipt identity.
    - Define a closed resolver dependency graph whose manifest and target identities must equal the receipt identities and whose reachable artifacts cannot contain scalar-bearing or target-indexed lookup data.
    - Define a versioned closed result and dependent-artifact grammar, including a typed non-identifiability condition that makes a singleton fiber unable to encode scalar recovery or an ECDLP claim.
  does_not_authorize:
    - fiber enumeration
    - implementation
    - execution
    - canonical record creation
    - hypothesis or experiment approval
    - ECDLP result or interpretation
