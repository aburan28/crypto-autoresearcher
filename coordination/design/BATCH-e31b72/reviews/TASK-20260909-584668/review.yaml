red_team_report:
  id: RT-20260909-584668
  task_id: TASK-20260909-584668
  claim_under_review: BATCH-local typed no-decoder interface for the target-shift information gate.
  review_joint: target_shift_typed_interface_v2
  verdict: breaks
  source_snapshot:
    commit: 6c8c7739f721c59b07a925756f48b21b95bf9b07
    paths:
      - coordination/design/BATCH-e31b72/tasks/TASK-20260909-39d8f2/specification-v2-total-interface.yaml
      - ledger/decisions/DEC-20260909-8f4163.yaml
    current_path_bytes_match_snapshot: true
  objections:
    - id: RT-1-public-null-cross-binding
      finding: >-
        public_inputs names exact keys and a canonical-JSON identity, but provides no
        typed manifest object, grammar, fixed digest, target-instance binding, or
        equality predicate that a reviewer or future runner can apply. null_relation
        requires cardinality, negation_symmetry, and coordinate_bucket_digest to equal
        a public manifest that has none of those fields, while it omits source_commit,
        group_id, generator_digest, and factor_base_digest. A null object may therefore
        use a different group, generator, or factor base without reaching a defined
        refusal.
      mutation: >-
        Supply a null manifest with a different factor base and generator digest, but
        reuse the stated membership_unit and offset_set_digest. No closed input schema
        or cross-manifest comparator in v2 identifies this as INVALID_INTERFACE.
      impact: The same-shape null control is not an enforceable control.
    - id: RT-2-fiber-completeness-and-charge
      finding: >-
        fiber_oracle specifies only prose labels for the scalar domain, fingerprint
        relation, receipt, and decimal charges. It fixes neither a scalar-domain
        serialization nor a domain cardinality, receipt grammar, included-fiber array,
        duplicate rule, relation witness, canonical byte encoding, or binding between
        the receipt digests and the target/fingerprint. omitted_digest is said to equal
        an empty-array digest, but that alone does not establish that every domain
        scalar was visited exactly once or that the included scalars satisfy the stated
        relation.
      mutation: >-
        Shrink the producer-defined scalar_domain to one element, set omitted_digest
        to the empty-array digest, and charge one work unit. The stated inequalities
        hold even if the intended toy domain has unvisited scalars; no typed fixture or
        independently pinned domain prevents the substitution.
      impact: Completeness and charged enumeration are assertions rather than
        independently checkable custody properties.
    - id: RT-3-target-indexed-lookup-hidden-by-reference
      finding: >-
        offline_artifacts lists "no target-indexed scalar map" without an artifact
        schema, inventory, hash, or exclusion proof. candidate_fiber_reference is
        allowed online but has no grammar, resolver, provenance, or prohibition on
        resolving to target-indexed candidate scalars. verification_only has no type or
        fixed value. The direct scalar-output refusal consequently leaves an equivalent
        lookup one level of indirection away.
      mutation: >-
        Let candidate_fiber_reference be an opaque target-fingerprint key in a
        precomputed map whose value is a singleton scalar candidate. Return only the
        key and a free-form verification_only member online. v2 has no rule that
        detects the target-indexed map or the scalar-bearing resolution.
      impact: The offline/online boundary does not rule out target-dependent lookup or
        scalar recovery via an allowed reference field.
    - id: RT-4-result-vocabulary-is-lexical-and-unbound
      finding: >-
        interpretation supplies a token list rather than a closed result schema,
        canonical tokenizer, case/Unicode rule, extension-field refusal, or binding to
        a result record. Forbidden content can be expressed as "decode", "recover the
        secret", "faster than rho", a numerical exponent, or a nested free-form field
        without containing one listed token. Conversely, no defined parser has an
        input against which to issue INVALID_INTERFACE.
      mutation: >-
        Emit an untyped report field saying "the unique candidate identifies the
        secret in less than square-root work". It avoids every exact forbidden token
        while asserting the prohibited conclusion.
      impact: The no-decoder and no-speedup interpretation boundary is bypassable.
    - id: RT-5-proves-too-much-control
      finding: >-
        A complete toy fiber may be a singleton. Because candidate_fiber_reference may
        resolve to that singleton and no result/output schema closes the indirection,
        the unchanged interface can be read as recovering the scalar for a toy target.
        This violates the review plan's required failure signature that a toy complete
        fiber cannot become scalar recovery or a sub-square-root result.
      mutation: >-
        Use a one-element complete toy domain and have the allowed candidate reference
        resolve to its sole scalar. The v2 interface contains no rule requiring the
        result to remain an information-gate observation only.
      impact: The proves-too-much control breaks at the candidate-reference/result
        boundary.
  required_controls:
    - Freeze a closed, hash-bound public manifest and a closed null manifest; include
      every source/group/generator/factor-base/offset and shape field in both, then
      define one exact equality comparator and a mismatch refusal.
    - Freeze an independently pinned typed toy-domain fixture, canonical serialization,
      complete included-fiber witness, no-duplicate rule, target/fingerprint binding,
      receipt grammar, and charge/data calculation.
    - Define a hash-bound offline artifact inventory and a closed candidate-reference
      resolver that cannot contain or resolve through target-indexed scalar maps.
    - Define a closed online-output and interpretation envelope with a finite allowed
      vocabulary, canonical text/token handling, no extension fields, and a direct
      refusal for any scalar-bearing candidate reference.
    - Run the declared toy-complete-fiber proves-too-much control against a singleton
      fiber and require it to refuse any scalar-recovery or sub-square-root reading.
  counterexample_or_mutation: >-
    A producer can choose a one-element scalar domain, record an empty omitted digest
    and one charged unit, return a fingerprint-keyed candidate_fiber_reference that
    resolves through an unlisted target-indexed scalar map, and write a synonym-based
    scalar-recovery statement. Each step avoids a v2 typed or lexical refusal because
    the relevant objects and comparison rules are not defined.
  baseline_comparison: >-
    No Pollard-rho, BSGS, or specialized-baseline comparison is warranted: v2 defines
    no measured cost, no complete run, and no valid no-decoder result envelope.
  heuristic_challenges: []
  cost_model_challenges:
    - >-
      The producer-defined domain can be shrunk before applying the stated work-unit
      lower bound, so the cost does not represent an independently fixed exhaustive
      enumeration.
    - >-
      data_bytes_decimal is not tied to one canonical serialization or to the candidate
      resolver, leaving lookup storage and target-indexed data absent from the charge.
  reduction_and_scope_challenges:
    - >-
      A candidate-fiber reference is not distinguished from scalar recovery when the
      fiber is singleton or its resolver exposes candidate scalars.
    - >-
      The current packet supports neither an ECDLP reduction nor an information result
      beyond the fact that a BATCH-local interface draft was reviewed.
  proof_architecture_challenges:
    - >-
      The observation-fiber separator is missing: the public/null manifests do not
      bind the group, generator, and factor base under one common, typed identity.
    - >-
      The quantifier boundary is missing: the scalar domain and referenced artifact may
      be chosen after seeing the target because neither is frozen before online input.
  narrowest_supported_statement: >-
    The coordinator decision correctly preserves zero-run status, but the v2 document
    is only an incomplete prose-to-schema repair. It does not establish an enforceable
    BATCH-local mock interface, a complete charged toy fiber, an information gate, a
    decoder boundary, any cost result, or any ECDLP conclusion.
  next_concrete_action: >-
    Add an additive total-interface repair that fixes the public/null manifests,
    complete charged fiber receipt, offline resolver inventory, scalar-bearing
    reference refusal, and closed result envelope; then submit that repaired snapshot
    to a fresh independent review plan.
  artifact_paths:
    - coordination/design/BATCH-e31b72/target-shift-v2-review-plan-TASK-20260909-584668.yaml
    - ledger/handoffs/TASK-20260909-584668.yaml
    - coordination/design/BATCH-e31b72/tasks/TASK-20260909-39d8f2/specification-v2-total-interface.yaml
    - ledger/decisions/DEC-20260909-8f4163.yaml
