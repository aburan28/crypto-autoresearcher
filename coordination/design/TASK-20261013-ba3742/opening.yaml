schema: crypto.autoresearch.eigenx_adaptive_oneend_opening.v1
opening:
  task_id: TASK-20261013-ba3742
  batch_id: BATCH-44a1ce
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  opening_decision_id: DEC-20261013-3f36a0
  date: '2026-10-13'
  mode: goal
  kind: bounded_zero_run_proof_and_construction_search
  selected_continuation: ENDRING-ADAPTIVE-ONEEND-COVERAGE
  alias_binding:
    user_name: EigenX
    canonical_name: CEST-PKE
    canonical_ids: [IDEA-20261007-560bcb, H-SSI-fbe68d, TASK-20261007-913665]
    rule: >-
      Use EigenX/CEST when communicating, but do not duplicate records or
      convert CEST-XFER-KI into an EndRing assumption.
  objective: >-
    Freeze the exact adaptive bounded-OneEnd oracle transcript used by the
    sourced EndRing reconstruction; propose at most three materially distinct
    public-only coverage interfaces; and audit whether any surviving bridge
    supplies the missing correctly directed EigenX reduction and the six PKE
    obligations. Stop before implementation or a new wrapper.
  source_boundary:
    frozen_primary_packet:
      - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-daf6ab/source-ledger.yaml
      - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-daf6ab/distribution-contract.yaml
      - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-daf6ab/source-report.md
    frozen_candidate_packet:
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/candidate.md
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/scheme-contract.yaml
      - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/proof-search-map.yaml
    provenance_rule: >-
      Internal records support only their declared scope. Any newly relied-on
      literature statement must carry source revision, inspected extent, and
      retrieved provenance or remain open.
  exact_adaptive_target:
    challenge: >-
      A supersingular curve input to the exact sourced EndRing reconstruction.
    oracle_relation: >-
      On every curve E_i chosen by the reduction after seeing all earlier
      answers, return an efficiently represented alpha_i in End(E_i) minus Z
      satisfying the sourced bounded-degree/representation relation.
    quantifiers: >-
      For every valid initial challenge and every transcript prefix reachable
      under the reduction's coins and prior valid answers, the bridge must
      supply the next answer with the declared conditional success. Total
      abort, retries, representation size, degree, time, and memory are charged
      over the whole adaptive transcript.
    forbidden_advice:
      - erased isogeny path or incoming-edge marker
      - orientation, ideal, tag, torsion basis or label
      - secret-correlated setup or complete EndRing witness
      - instance-specific non-uniform advice
  bridge_portfolio:
    maximum_interfaces: 3
    required_distinct_lenses:
      - pointwise-total public sampler on every valid adaptive query curve
      - transcript-conditional compiler from a declared sampler law
      - reduction-local query answering or rerandomization with a proved law identity
    admission_rule: >-
      An interface is admitted only if it gives algorithms, dependencies,
      exact probability, termination, representation, total cost, and honest
      support. Renaming a BATCH-12e6aa family or hiding query-specific advice is
      not a materially distinct interface.
  eigenx_reduction_target:
    desired_direction:
      input: exact EndRing challenge matching the claimed real-key distribution
      use: successful attacker in the complete declared EigenX security game
      output: complete efficiently evaluable rank-four End(E) basis
    required_steps:
      - exact challenge embedding and real public-key distribution argument
      - complete random-oracle and auxiliary-data simulation
      - extractor from attacker behavior, not from a supplied secret witness
      - abort, probability loss, time, memory, and representation bounds
      - explicit separation of CEST-XFER-KI and EndRing
    reverse_route_control: >-
      Deriving psi_E from a complete ring and evaluating psi_E(R) is an attack
      route, not a security reduction.
  six_obligation_gate:
    O1: exact EndRing challenge and real-key distribution
    O2: executable KeyGen, Enc, Dec, validation, retries, failure, and costs
    O3: quantified actual-message correctness and independent rederivation
    O4: recipient mechanism and complete-ring-versus-evaluator strictness
    O5: correctly directed reduction, simulation, extraction, and loss
    O6: complete adversarial view, parsing, pairings, repetitions, and controls
    statuses: [open, proposed_discharge, reviewed_discharge, contradicted]
    rule: >-
      All six are reviewed separately. A bridge survivor cannot discharge a
      scheme obligation by itself, and no item becomes reviewed_discharge
      without its assigned independent report.
  proof_search_map:
    P0: reproduce the exact sourced adaptive oracle interface
    P1: make all quantifiers and witness dependencies explicit
    P2: search for transcript-law or observable-fiber collisions
    P3: type public construction, representation, and non-scalarity
    P4: compose conditional success and cost across adaptive queries
    P5: distinguish one evaluator, OneEnd, and complete EndRing outputs
    P6: build or refute each arrow in the EigenX reduction chain
    P7: exercise nearby-object and proves-too-much controls
    P8: state the method ceiling and one next action
  controls:
    - single D_ER high-mass sampler substituted for an every-query oracle
    - non-uniform advice selecting one endomorphism per query curve
    - scalar-only psi_E=[s] slice reducing the algebra to hashed DH
    - full EndRing solver used to decrypt, testing reduction direction
    - evaluator-only secret reproducing all current decryption behavior
    - pairing-visible tuple checks and alternate valid-looking shared points
    - leaked path, orientation, ideal, torsion label, tag, or ring basis
    - malformed, wrong-key, repeated, and alternate-encoding ciphertexts
  outcome_rules:
    bridge_survivor: >-
      Record only a reviewed bridge candidate and open a separate construction
      or reduction batch; do not claim EigenX security automatically.
    scoped_obstruction: >-
      Name the exact interface, quantifiers, and counterexample or derivation;
      do not generalize beyond the frozen family.
    no_survivor: >-
      Preserve zero-run evidence, keep the goal and canonical problem open,
      and rerank a materially distinct recipient mechanism.
    inconclusive: Preserve the missing source or lemma and its checkable exit criterion.
  visual_deliverables:
    report: research/ssi-endring-pke/2026-10-13-eigenx-adaptive-oneend-bridge/report.md
    editable_diagram: research/ssi-endring-pke/2026-10-13-eigenx-adaptive-oneend-bridge/bridge-flow.mmd
    svg: research/ssi-endring-pke/2026-10-13-eigenx-adaptive-oneend-bridge/bridge-flow.svg
    pdf: research/ssi-endring-pke/2026-10-13-eigenx-adaptive-oneend-bridge/report.pdf
    inspection: research/ssi-endring-pke/2026-10-13-eigenx-adaptive-oneend-bridge/visual-inspection.yaml
  scientific_runs: 0
  automatic_success: false
  stop_rule: >-
    At most three interfaces, one CEST/EigenX candidate, one J1--J5 review
    round, one composition, and one J6 documentation review. No implementation,
    experiment, parameter selection, or automatic successor.
