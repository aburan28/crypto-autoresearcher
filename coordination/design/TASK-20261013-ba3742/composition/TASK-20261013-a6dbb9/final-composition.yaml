exactly_one_next_action:
  id: ENDRING-MATERIALLY-DISTINCT-RECIPIENT-MECHANISM
  owner: future_coordinator
  automatic_launch: false
  objective: >-
    Rerank and bound one construction-or-obstruction round for a materially
    different EndRing recipient mechanism whose exact challenge-simulatable
    transcript exposes ring-identifying behavior beyond the public-key-
    determined line evaluator, then audit O1--O6 and the correctly directed
    attacker-to-complete-ring extraction under the same frozen gates.
  acceptance: >-
    Advancement requires executable honest algorithms, an exact real-key
    distribution, actual-message correctness, a strict recipient mechanism,
    a complete simulation/extraction/loss/cost proof, a complete adversarial
    view, and independent review; a scoped obstruction must name its exact
    interface and leave universal existence open.
  exclusions:
    - no additional wrapper around the same EvalLine_(P,A) transcript
    - no hidden W-correlated path, orientation, ideal, torsion label, tag, or ring advice
    - no relabeling CEST-XFER-KI as EndRing
    - no automatic implementation, experiment, successor, or security claim

