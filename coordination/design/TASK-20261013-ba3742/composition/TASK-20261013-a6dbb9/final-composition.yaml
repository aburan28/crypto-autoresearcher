eigenx_obligations_from_independent_J5:
  O1:
    status: open
    finding: >-
      The symbolic auxiliary games are named, but TrapCurveGen and the exact
      real-key law are not executable, and no bare-EndRing-to-real-key bridge
      or full-ring witness pullback is supplied.
  O2:
    status: open
    finding: >-
      TrapCurveGen, complete-ring certification, CanonicalBoundedEnd,
      canonical byte grammar, accepted mass, retry tails, time, memory, and
      output-size bounds are incomplete.
  O3:
    status: reviewed_discharge
    finding: >-
      For every accepted valid key, every m in {0,1}^mu, and every nonzero r,
      psi_E([r]P)=[r]psi_E(P)=[r]A makes the canonical sender and recipient
      pad inputs identical, so decryption returns the selected message with
      conditional failure probability zero.
    limitation: >-
      This does not assert efficient KeyGen, unconditional termination, or
      confidentiality.
  O4:
    status: open
    finding: >-
      Functionality factors through the strict evaluator quotient on <P>.
      Replacing W by a psi_E evaluator preserves all accepted decryption
      outputs, while no evaluator-to-complete-ring extractor is provided.
  O5:
    status: open
    finding: >-
      The separately named single-challenge classical-ROM reduction to
      CEST-XFER-KI is directionally valid on its exact key law, but no exact
      EndRing challenge embedding, attacker-to-complete-basis extractor,
      adaptive OneEnd compiler, success loss, or total cost exists.
  O6:
    status: open
    finding: >-
      The symbolic single-user classical IND-CPA view is enumerated, but the
      byte grammar remains abstract; active, multi-user, QPT/QROM, side-
      channel, malicious-key/setup, concrete-parameter, and implementation
      security are not established, and IND-CCA2 is broken.
  reviewed_discharge_count: 1
  open_count: 5
  overall_J5_verdict: breaks

reviewed_intermediate_scalar_transfer_finding:
  scope: >-
    Prime q, exact-order-q points P and A with e_q(P,A)!=1, honest
    R=[r]P, and a supplied q-torsion candidate T.
  result: >-
    The single equation e_q(P,T)=e_q(R,A) accepts all q points
    T=[r]A+[x]P. Adding e_q(A,T)=1 uniquely forces x=0, so the two equations
    plus q-torsion membership uniquely recognize the supplied transfer point
    T=[r]A.
  consequence_at_reviewed_scope: >-
    The predicate can recognize a candidate transfer point in a classical
    random-oracle query stream. Recognition does not compute the point, prove
    CEST-XFER-KI hardness, yield a reusable evaluator, or extract End(E).
  producer_extension_not_promoted: >-
    The producer proposed a no-q_H-guessing-loss scalar-transfer extractor.
    J5 independently reviewed the unique-recognition algebra but did not
    discharge a complete scalar-transfer-to-EndRing chain; this composition
    promotes only the recognition result and the separately reviewed
    CEST-XFER-KI hybrid at their stated classical-ROM scopes.

cca2_break:
  status: exact_scoped_break
  model: standard IND-CCA2 with bytewise exact-challenge exclusion
  attack: >-
    Given c*=(pk_ser,R*,v*), choose nonzero Delta and query the decryption
    oracle on c'=(pk_ser,R*,v* XOR Delta). The ciphertext bytes differ from
    c*, every stated validation check still passes, and decryption returns
    m_beta XOR Delta. Removing Delta recovers m_beta and beta in one query.
  scope: >-
    The frozen unauthenticated EigenX/CEST syntax is not IND-CCA2 secure. The
    break does not contradict the narrower conditional IND-CPA proposal and
    does not establish an attack on a different authenticated construction.

