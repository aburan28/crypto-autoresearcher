      source ledger were absent in this workspace and were not read. No J1
      conclusion relies on either: the exact reduction was checked in the
      hash-matching Springer version of record.
    - >-
      The frozen 2026 transcript's source record certifies external fidelity
      only for ten unrelated Section 4.1 cost values. J1 uses that transcript
      only for non-load-bearing representation/typing cross-checks.
    - >-
      Algorithm 3's Require line mentions an unused parameter k>0. The actual
      transcript uses the internally computed k1 and state-dependent k2; this
      apparent editorial residue does not supply an additional query parameter.
    - >-
      No concrete oracle cost, memory, family sampler, distribution bridge,
      security reduction, or scheme claim is established here.

