scope:
  joints_owned: [J2, J3]
  interface_boundary:
    - I1-pointwise-total-direct
    - I2-transcript-conditional-law-compiler
    - I3-reduction-local-path-pushforward
  joints_not_judged: [J1, J4, J5, J6]
  scientific_runs: 0
  claim_boundary: >-
    This is a zero-run review of the frozen three-interface portfolio. It makes
    no PKE or security claim, no measured-performance claim, and no universal
    impossibility claim about public OneEnd or other bridge families.

owned_joint_verdicts:
  J2:
    verdict: breaks
    scope: >-
      The portfolio-wide proposition that every submitted interface supplies a
      public, uniform, correctly typed source-oracle construction breaks on I3.
      I1 and I2 remain inconclusive rather than broken. I3's individual maps
      are valid non-scalar self-maps, but its algorithm has type
      (E,alpha,phi)->End(C), not O(C), and its output is correlated with the
      very outer path whose randomization the source proof uses.
  J3:
    verdict: breaks
    scope: >-
      The portfolio-wide proposition that every submitted interface has a
      polynomial whole-transcript success/cost bound breaks on I3: an allowed
      deterministic or singleton-support base sampler makes the phase-1 ring
      stay of rank at most two forever. I1 and I2 remain inconclusive because
      their uniform success, conditional bad-prefix, stopping-tail, and memory
      premises are not supplied.

interface_reviews:
  - interface_id: I1-pointwise-total-direct
    admitted_by_producer: false
    producer_disposition: inconclusive_not_admitted
    J2:
      verdict: inconclusive
      public_uniform_construction: >-
        Unknown. I1 assumes a single public algorithm S(Pi,C;rho) with an
        inverse-polynomial success bound on every supersingular C; no such
        algorithm or circuit family is supplied.
      map_typing_and_non_scalarity: >-
        Supported only conditionally for accepted outputs by DER-ENDO-v1
        verification of source C, target C, degree, and a public
        non-scalarity certificate.
      honest_support: >-
        The stated first-success byte law is correct when the base byte law
        P_C and success s(C) exist. Semantic collisions are properly summed.
        Singleton per-curve support is not itself a defect because the source
        permits deterministic O(C); it does not supply the missing constructor.
      hidden_advice: >-
        The declared interface forbids advice, but the absence of a concrete S
        prevents dependency auditing. A per-curve choice of a_C is not a
        uniform instantiation.
      representation: >-
        Conditional DER-ENDO-v1 syntax is canonical at the byte-tree level;
        semantic uniqueness is neither claimed nor required. Concrete output
        length and verifier bounds are missing with S.
      reason: Missing evidence is not a refutation; the interface is a sufficient conditional specification, not an executable bridge.
    J3:
      verdict: inconclusive
      retry_check: >-
        If s(C)>=1/q, m=ceil(q*kappa*ln(2)) gives
        (1-s(C))^m<=2^(-kappa). Unbounded retry has expected at most q
        attempts only under the same pointwise premise.
      adaptive_success: >-
        With a deterministic Q_max, the bound
        Pr[Q>Q_max]+Q_max*2^(-kappa) is valid by conditional union bounds and
        needs no independence. No Q_max tail is instantiated.
      total_cost: >-
        The formula correctly charges retries, verification, walks, Reduce_N,
        composition, saturation, factoring, serialization, and retained state,
        but q,T_S,M_S,Lambda,Q_max and a source-compatible memory bound are absent.
      degree_and_scale: >-
        Conditional log-degree is Lambda(n)+2*k_j. No concrete or fully
        instantiated asymptotic scale certificate exists.
      reason: Whole-transcript polynomial time, memory, and non-negligible success are conditional on unsupplied uniform bounds.

  - interface_id: I2-transcript-conditional-law-compiler
    admitted_by_producer: false
    producer_disposition: inconclusive_not_admitted
    J2:
      verdict: inconclusive
      public_uniform_construction: >-
        Unknown. I2 adds a law certificate around the same uninstantiated
        public sampler S; it is not a new sampler construction.
      map_typing_and_non_scalarity: >-
        Conditional accepted outputs remain verified non-scalar C_j->C_j
        descriptors. The law compiler does not alter their algebraic type.
      honest_support: >-
        The first-success law on the actual C_j is honestly stated. Averaging
        over D_ER is correctly rejected as a substitute for the conditional
        mu_tau law.
      hidden_advice: >-
        No advice is declared, but no certificate proves the required law
        transfer between different starts, walk types, adaptive lengths,
        endpoint multiplicities, and exceptional weights.
      representation: Same conditional DER-ENDO-v1 boundary as I1.
      reason: Neither the base constructor nor the conditional-law certificate exists in the frozen evidence.
    J3:
      verdict: inconclusive
      conditional_bound_check: >-
        For B={C:s(C)<1/q}, mu_tau(B)<=epsilon_tau implies conditional abort
        at most epsilon_tau+2^(-kappa_tau). Summing suprema over reachable
        prefixes up to Q_max and adding Pr[Q>Q_max] is valid without
        independence.
      missing_inputs:
        - every-prefix bounds epsilon_tau or TV bounds delta_tau
        - an explicit stopping tail Pr[Q>Q_max]
        - instantiated sampler time, memory, representation, degree, and retry polynomials
      adaptive_failure_control: >-
        D_ER(B)<=nu is compatible with a reachable mu_tau concentrated
        entirely on B, so marginal independent-sample success cannot be
        amplified into the required adaptive guarantee.
      reason: The producer preserves the gap instead of assuming independence; the needed quantities remain unsupported.

  - interface_id: I3-reduction-local-path-pushforward
    admitted_by_producer: false
    producer_disposition: scoped_obstruction
    J2:
      verdict: breaks
      public_data: >-
        The fresh outer path phi is reduction-generated public state, not the
        erased challenge path. Nevertheless, the algorithm requires E, alpha,
        and the particular phi in addition to the oracle input C.
      exact_map_type: >-
        For phi:E->C of degree d and alpha in End(E),
        T_phi(alpha)=phi o alpha o dual(phi) is a total C->C endomorphism of
        degree d^2*deg(alpha). T_phi is additive and injective, with
        R_phi(T_phi(alpha))=[d^2]alpha for R_phi(beta)=dual(phi)o beta o phi;
        it is not an unscaled ring homomorphism because
        T_phi(a)T_phi(b)=[d]T_phi(ab).
      non_scalarity: >-
        Holds for a valid non-scalar alpha. If T_phi(alpha)=[m], then
        [d^2]alpha=[md]; torsion-freeness and End(E) intersect Q=Z force alpha
        to be scalar, a contradiction.
      representation: >-
        A canonical typed syntax can be formed from canonical phi, alpha,
        dual-path, and composition nodes, conditional on the still-missing
        base alpha sampler. Local descriptor length is polynomial when those
        inputs and k are bounded.
      honest_support_and_interface_break: >-
        Conditional on phi, the producer correctly gives the pushforward of
        the alpha law. But Page--Wesolowski Theorem 4.2 defines one
        endpoint-indexed law F(C,beta)=Pr[O(C)=beta]; I3 instead correlates beta
        with which path reached C. Therefore it is not the required O(C)
        interface and the theorem's conjugation argument cannot be applied.
      reason: The algebraic correspondence is valid, but the claimed bridge type breaks at the oracle interface.
    J3:
      verdict: breaks
      exact_failure: >-
        The surrounding pullback is
        dual(phi)o T_phi(alpha)o phi=[d^2]alpha. In phase 1, d=2^k1 is fixed.
        For a deterministic or singleton-support valid base sampler, every
        returned element lies in Z*alpha, so the ring generated with Z has
        Z-rank at most two and the rank-four loop never terminates.
      success_abort_retry: >-
        End-to-end success is zero and total time is unbounded for this allowed
        support control. Reusing or retrying alpha cannot repair it. Fresh
        alpha samples would require a new spanning-support theorem absent from
        the D_ER contract and from OneEnd.
      local_cost: >-
        Per-answer sampling, path/dual composition, verification, serialization,
        and cached-alpha storage can be polynomial, but local polynomial cost
        does not establish polynomial total reconstruction cost.
      degree_and_scale: >-
        beta has log-degree 2*k+log(deg(alpha)); the subsequent pullback has
        log-degree 4*k+log(deg(alpha)). These bounds do not repair the
        scale-independent rank collapse.
      reason: A valid allowed instantiation has infinite stopping time and zero whole-transcript success.

batch_12e6aa_renaming_check:
  I1-pointwise-total-direct: >-
    Not a new construction. F1 and F2 lacked general public path constructors;
    F3 and F4 had at most unresolved high-mass D_ER guarantees, not all-curve
    coverage. Calling any F1--F4 core S leaves its recorded failure unchanged.
  I2-transcript-conditional-law-compiler: >-
    Not a fifth sampler family. It inherits every base F1--F4 construction or
    mass/density gap and adds the unsupplied mu_tau-to-D_ER and stopping-tail
    certificates.
  I3-reduction-local-path-pushforward: >-
    This is a distinct composition, but it begins with the unestablished D_ER
    sampler and does not cure it. The deterministic/singleton outputs of the
    F1 core, F2 direct core, and F3 route instantiate the exact rank-collapse
    control; F4 has no spanning-support theorem.

controls:
  J2_exceptional_automorphism_positive:
    result: passes_typing_only
    evidence: >-
      The explicit j=1728 map (x,y)->(-x,i*y) and j=0 map
      (x,y)->(zeta*x,y) are degree-one non-+/-1 C->C maps on their exceptional
      models. They establish syntax/type positivity, not every-query coverage.
  J2_scalar_negative:
    result: rejected_as_required
    evidence: Scalars lie in Z and are not OneEnd outputs.
  J2_immediate_dual_backtrack:
    result: rejected_as_required
    evidence: dual(phi)o phi=[deg(phi)] is scalar.
  J2_leaked_witness_routes:
    result: rejected_as_required
    evidence: >-
      Erased paths, orientations, ideals, torsion labels, tags, and ring bases
      violate the public input contract. I3 uses only a fresh reduction path,
      but fails the endpoint-only oracle type for a different reason.
  J3_independent_D_ER_success:
    result: insufficient
    evidence: Marginal D_ER success does not bound the bad mass under every adaptive mu_tau.
  J3_deterministic_one_easy_curve:
    result: insufficient
    evidence: It neither covers actual endpoints nor prevents I3's exact rank collapse.

proves_too_much_controls:
  PTM-J2-NONUNIFORM-ADVICE:
    known_false_conclusion: Per-curve existence with instance-specific advice is one public uniform algorithm.
    result: control_rejects_argument
    failure_location: >-
      The implication stops at witness selection: a family {alpha_C} supplies
      no uniform public algorithm, finite circuit generator, or input-only
      descriptor construction. I1 explicitly keeps this as a missing premise.
  PTM-J3-INDEPENDENT-AMPLIFICATION:
    known_false_conclusion: Marginal success on independent samples gives the same success on adaptively selected curves.
    result: control_rejects_argument
    failure_location: >-
      Let D_ER(B)=nu, let S fail on B and succeed outside it, and let one
      reachable conditional law mu_tau satisfy mu_tau(B)=1. The marginal
      premise holds while the adaptive call aborts with probability one.
      I2's supremum-over-prefix bound retains exactly the missing epsilon_tau.

transfer_contract_summary:
  existence: I1 and I2 unknown; I3 algebraic transfer exists for supplied alpha and phi.
  executable_construction: I1 and I2 unknown; I3 local formula supported but full bridge refuted.
  map_correctness: I1 and I2 conditional on verification; I3 supported as an additive injective scaled conjugation.
  subgroup_scope: >-
    No designated ECDLP subgroup or unknown-scalar transfer is present, so
    subgroup preservation is not applicable. The relevant preserved property
    is non-scalarity/injectivity on End(E), which is explicit for I3.
  computational_advantage: unknown and unmeasured for I1/I2; I3 has no end-to-end advantage in the singleton control.
  scaling: I1/I2 unsupported; I3 local sizes scale polynomially conditionally but whole-transcript scaling breaks.

narrowest_supported_statement: >-
  I1 is a conditionally sufficient specification with no constructor; I2 has a
  correct conditional union-bound form with no law or tail certificate; and
  I3 is a correctly typed scaled-conjugation correspondence that fails as the
  Page--Wesolowski oracle and can force exact nontermination. No interface is
  established as an admitted adaptive OneEnd bridge.
open_obligations:
  - A concrete uniform I1 sampler with public input-only dependency and explicit output law.
  - For I2, a base sampler plus every-prefix mu_tau bad-mass bounds and a complete stopping tail.
  - Explicit total memory, degree, representation, verification, retry, failed-attempt, and serialization bounds.
  - Any replacement for I3 must prove an endpoint-indexed oracle law and rank growth rather than reuse the correlated outer path.
recommended_next_action: >-
  Independently review a concrete I1 constructor or a complete I2
  conditional-law/stopping-tail certificate; otherwise do not reuse I3 without
  a new source-compatible randomization and rank-growth proof.

