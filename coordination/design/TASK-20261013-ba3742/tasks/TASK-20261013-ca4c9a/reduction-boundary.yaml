schema: crypto.autoresearch.eigenx_reduction_boundary.v1
task_id: TASK-20261013-ca4c9a
batch_id: BATCH-44a1ce
goal_id: GOAL-SSI-2fa82a
candidate:
  user_name: EigenX
  canonical_name: CEST-PKE
  new_identity_created: false
analysis_class: zero_run_symbolic_reduction_audit
arrow_status_vocabulary:
  - derived_unreviewed
  - source_supported_conditional
  - proposed_unreviewed
  - open
  - contradicted_as_security_reduction
claim_boundary: >-
  This packet types reductions and controls for the frozen candidate. It makes
  no security, novelty, practicality, performance, deployment, or universal-
  impossibility claim. All new derivations await independent J4/J5 review.

objects:
  real_pk:
    type: canonical_public_key_bytes
    distribution: >-
      Intended output of TrapCurveGen, CanonicalBoundedEnd, all retries and
      basis rejection, including A=psi_E(P) and e_q(P,A)!=1.
    executable_status: open
  bare_endring:
    type: search_problem
    input: "a supersingular curve E in the advertised challenge distribution"
    output: >-
      Four efficiently represented endomorphisms forming a Z-lattice basis of
      exactly End(E).
    auxiliary_data: "none beyond the declared EndRing instance"
  aux_endring_cest:
    type: auxiliary_data_search_problem
    input: "real_pk sampled with W and then released without W"
    output: >-
      A complete evaluable rank-four End(E) basis satisfying the frozen
      compatibility predicate.
    distinction: "one endomorphism, a torsion matrix, or a line evaluator does not win"
  cest_xfer_ki:
    type: classical_rom_decisional_game
    input: >-
      real_pk, R=[r]P for uniform r in Z_q^*, and K equal to
      H_pad(real_pk,R,[r]A) or an independent uniform mu-bit string.
    output: "a real-versus-random decision bit"
  cest_xfer_comp:
    type: computational_search_problem
    input: "real_pk and R=[r]P for uniform r in Z_q^*"
    output: "the point S=[r]A"
    success_predicate: "the unique-transfer verifier below accepts S"
  eval_line:
    type: capability
    input: "R in <P>"
    output: "EvalLine_(P,A)([x]P)=[x]A"
    information_boundary: >-
      As a mathematical homomorphism it is completely determined by public
      P and A. Its efficient evaluation may be hard, but its graph contains no
      action outside <P>.
  one_end_initial:
    type: search_problem
    input: "the initial curve E"
    output: "one efficiently represented alpha in End(E) minus Z"
  adaptive_bounded_one_end:
    type: oracle_interface
    input: >-
      Every curve E_i selected by the sourced reconstruction after all earlier
      valid oracle answers.
    output: >-
      An efficiently represented non-scalar alpha_i with the sourced bounded-
      degree relation, on every reachable transcript prefix.
  complete_endring:
    type: search_output
    output: "a complete efficiently evaluable rank-four Z-basis of End(E)"

unique_transfer_verifier:
  assumptions:
    - "q is prime"
    - "P and A have exact order q"
    - "e_q(P,A)!=1, hence P,A form a basis of E[q]"
    - "R=[r]P for r in Z_q^*"
  algorithm: >-
    Parse T; require T in E[q]; accept exactly when
    e_q(P,T)=e_q(R,A) and e_q(A,T)=1.
  derivation: >-
    Write T=xP+yA. With g=e_q(P,A), the first equation is g^y=g^r,
    so y=r mod q. The second equation is g^(-x)=1, so x=0 mod q.
    Therefore T=[r]A. Conversely [r]A satisfies both equations.
  single_equation_warning: >-
    The first equation alone accepts every [r]A+xP, so it has q solutions and
    is not a unique verifier.
  status: derived_unreviewed

arrows:
  - id: RB-00
    label: "intended setup -> exact real EigenX public key"
    orientation: construction
    input_type: "1^lambda and private setup coins"
    input_distribution: "the as-yet-unspecified TrapCurveGen law"
    output_type: real_pk
    output_distribution: "the exact law declared in objects.real_pk"
    simulator: "not applicable; this is honest KeyGen"
    extractor: "not applicable"
    loss_or_success: "no accepted-mass, retry-tail, or termination bound supplied"
    runtime_and_memory: "required expected polynomial; not established"
    status: open
    earliest_gap: >-
      TrapCurveGen, complete-ring certification, canonical selection, and the
      aggregate retry law are not executable/proved.
    security_value: "none until O2 is discharged"

  - id: RB-01
    label: "bare EndRing challenge -> exact real public-key embedding"
    orientation: desired_security_reduction_prefix
    input_type: bare_endring
    input_distribution: "the advertised bare EndRing challenge distribution"
    output_type: "a simulated EigenX IND public view containing real_pk"
    output_distribution: "must equal or be quantified-close to objects.real_pk"
    simulator: >-
      Required to choose P and sample A with the conditional law
      A=CanonicalBoundedEnd(E,W,B)(P) without receiving W.
    extractor: "not reached"
    loss_or_success: "none established"
    runtime_and_memory: "none established"
    status: open
    earliest_gap: >-
      Challenge embedding is circular: producing A with the exact law uses W
      or an equivalent evaluator, which is the missing secret capability.
    security_value: "no bare-EndRing theorem"

  - id: RB-02
    label: "AuxEndRing_CEST challenge -> exact IND-CPA public view"
    orientation: desired_security_reduction_prefix
    input_type: aux_endring_cest
    input_distribution: "the exact intended real_pk distribution by definition"
    output_type: "EigenX IND-CPA view"
    output_distribution: "identity, conditional on the intended sampler existing"
    simulator: >-
      Give real_pk to A, forward/simulate classical H_pad consistently, and
      use public Enc syntax for challenge formation when the needed transfer
      pad is available through the selected hybrid.
    extractor: "no complete-ring extractor is supplied"
    loss_or_success: "public-view loss zero by definition; extraction loss undefined"
    runtime_and_memory: "polynomial simulation overhead; extractor absent"
    status: open
    earliest_gap: >-
      Defining the auxiliary challenge repairs distributional embedding only;
      it does not turn the attacker's output into a complete ring basis.
    security_value: "no AuxEndRing_CEST hardness implication"

  - id: RB-03
    label: "IND-CPA attacker -> CEST-XFER-KI distinguisher"
    orientation: correct_security_reduction_to_intermediate
    input_type: cest_xfer_ki
    input_distribution: "exact real_pk, honest R, and real-or-random K"
    output_type: "CEST-XFER-KI decision statistic"
    output_distribution: "the intermediate game's own output distribution"
    simulator: >-
      Run A to obtain m0,m1; choose beta uniformly; return
      c=(real_pk,R,m_beta XOR K); forward every classical H_pad query.
    extractor: "output 1 exactly when A outputs beta"
    loss_or_success: >-
      Adv_IND-CPA(A) <= Adv_CEST-XFER-KI(D), with equality under aligned
      absolute-bias conventions and zero honest parsing error.
    runtime_and_memory: "T_A plus polynomial parsing/XOR and oracle-forwarding overhead"
    status: proposed_unreviewed
    earliest_gap: "none inside this conditional intermediate reduction"
    security_value: >-
      Only conditional classical-ROM IND-CPA under CEST-XFER-KI; this is not an
      EndRing theorem.

  - id: RB-04
    label: "IND-CPA distinguishing advantage -> computational scalar transfer"
    orientation: correct_rom_query_extraction_to_intermediate
    input_type: cest_xfer_comp
    input_distribution: "exact real_pk and honest R=[r]P"
    output_type: "S=[r]A"
    output_distribution: "deterministic target for the supplied instance"
    simulator: >-
      Run A with a challenge masked by an independent uniform K and simulate
      H_pad lazily. Parse each query for the fixed (real_pk,R) and apply the
      unique-transfer verifier.
    extractor: >-
      Output the first query point T accepted by both pairing equations. Until
      the correct H_pad input is queried, the random-pad and real-pad games are
      identical and beta is hidden.
    loss_or_success: >-
      Succ_CEST-XFER-COMP(B) >= Adv_IND-CPA(A), modulo only declared parsing
      errors. There is no q_H guessing factor because a valid T is uniquely
      recognized; work grows linearly with q_H.
    runtime_and_memory: >-
      T_A plus O(q_H) canonical parses, subgroup checks and pairing checks;
      lazy-oracle storage O(q_H).
    status: proposed_unreviewed
    earliest_gap: "none for the stated classical-ROM extraction; review pending"
    security_value: >-
      Isolates scalar transfer as the strongest attacker-derived computational
      capability currently typed. It does not extract End(E).

  - id: RB-05
    label: "scalar-transfer solver -> reusable EvalLine representation"
    orientation: attempted_lift
    input_type: "black-box CEST-XFER-COMP solver on its honest challenge law"
    input_distribution: "random R=[r]P under one fixed real_pk"
    output_type: eval_line
    output_distribution: "a reusable evaluator on all valid R in <P>"
    simulator: >-
      One may rerun the solver on instances in its guaranteed distribution;
      arbitrary-point and persistent-representation guarantees are not given.
    extractor: "none supplied"
    loss_or_success: >-
      A one-shot solver gives one S. No coverage theorem upgrades average
      challenge success to all R or outputs evaluator code.
    runtime_and_memory: "undefined for a total reusable evaluator"
    status: open
    earliest_gap: "one-shot/average search output is not an evaluator representation"
    security_value: "no ring information or adaptive oracle obtained"

  - id: RB-06
    label: "reachable-line evaluator -> full canonical endomorphism psi_E"
    orientation: attempted_recipient_lift
    input_type: eval_line
    input_distribution: "all accepted R in <P> for one fixed public key"
    output_type: "an efficiently represented rational-map endomorphism psi_E:E->E"
    output_distribution: "the CanonicalBoundedEnd output for the hidden W"
    simulator: >-
      Black-box access gives [x]P |-> [x]A only. Ciphertext validation excludes
      independent q-torsion directions and all points outside <P>.
    extractor: "none supplied"
    loss_or_success: "none established"
    runtime_and_memory: "none established"
    status: open
    earliest_gap: >-
      The line homomorphism is fixed by public P,A and does not specify the
      action on a second torsion direction or a global rational map.
    security_value: >-
      This is the evaluator-quotient boundary. It is a scoped black-box gap,
      not a proof that every non-black-box/distribution-specific lift is impossible.

  - id: RB-07
    label: "full recovered psi_E -> OneEnd on the initial curve"
    orientation: conditional_type_conversion
    input_type: "an efficient global evaluator for the actual noncentral psi_E"
    input_distribution: "the initial real-key curve E"
    output_type: one_end_initial
    output_distribution: "one non-scalar endomorphism of E"
    simulator: "not applicable"
    extractor: "return psi_E with its efficient representation"
    loss_or_success: "success one, conditional on valid noncentral recovery"
    runtime_and_memory: "polynomial in the recovered representation size"
    status: derived_unreviewed
    earliest_gap: "its premise is not obtained by RB-06"
    security_value: "one initial-curve OneEnd output still is not complete EndRing"

  - id: RB-08
    label: "one initial-curve endomorphism -> adaptive bounded-OneEnd oracle"
    orientation: attempted_adaptive_coverage_lift
    input_type: one_end_initial
    input_distribution: "one endomorphism on the initial curve E"
    output_type: adaptive_bounded_one_end
    output_distribution: >-
      valid bounded non-scalar outputs on every adaptively generated E_i,
      conditioned on every reachable transcript prefix
    simulator: "none supplied"
    extractor: "none supplied"
    loss_or_success: "no pointwise or transcript-conditional bound"
    runtime_and_memory: "no total query, degree, representation, retry, time, or memory bound"
    status: open
    earliest_gap: >-
      The sourced reconstruction asks OneEnd on curves generated after prior
      answers; one endomorphism of E does not answer those queries.
    security_value: "Page--Wesolowski cannot be invoked from this premise"

  - id: RB-09
    label: "adaptive bounded-OneEnd oracle -> complete EndRing"
    orientation: sourced_problem_reduction
    input_type: adaptive_bounded_one_end
    input_distribution: >-
      Every internal query curve generated by Page--Wesolowski Algorithm 3
      under its coins and previous valid answers
    output_type: complete_endring
    output_distribution: "a valid complete ring basis for the initial curve"
    simulator: "the sourced reconstruction controls its own adaptive queries"
    extractor: "Page--Wesolowski Algorithm 3"
    loss_or_success: >-
      Source ledger records expected polynomial running time in log(p) and the
      bounded-degree function, conditional on the required oracle; this packet
      adds no sharper probability formula.
    runtime_and_memory: >-
      Source-supported expected polynomial time under the exact bounded
      OneEnd oracle. Whole-transcript costs of any proposed bridge remain open.
    status: source_supported_conditional
    earliest_gap: "the required adaptive oracle is not supplied by RB-08"
    security_value: "conditional final arrow only"

  - id: RB-10
    label: "complete EndRing solver -> EigenX decryption"
    orientation: reverse_attack_route
    input_type: complete_endring
    input_distribution: "a valid complete evaluator basis for the challenge E"
    output_type: "plaintext m from c=(pk_ser,R,v)"
    output_distribution: "the deterministic decryption output"
    simulator: "not applicable"
    extractor: >-
      Run CanonicalBoundedEnd to obtain psi_E, compute S=psi_E(R), query H_pad,
      and output v XOR the pad.
    loss_or_success: >-
      Conditional success one when the complete basis supports the declared
      selector/evaluation and the key/ciphertext are valid.
    runtime_and_memory: "selector plus evaluator, parsing, and one H_pad query"
    status: contradicted_as_security_reduction
    earliest_gap: >-
      The arrow begins with the problem solution instead of producing it from
      an attacker; it is reversed relative to the required security proof.
    security_value: "none; it is an attack route and sufficiency statement"

  - id: RB-11
    label: "source- or target-group discrete logarithm -> scalar transfer"
    orientation: public_attack_route
    input_type: "real_pk and R=[r]P"
    input_distribution: "the honest CEST-XFER-COMP distribution"
    output_type: "S=[r]A"
    output_distribution: "the unique transfer point"
    simulator: "not applicable"
    extractor: >-
      Either recover r from R relative to P, or set g=e_q(P,A),
      h=e_q(R,A)=g^r and recover r in <g>; then output [r]A.
    loss_or_success: "inherits the selected discrete-log solver's success exactly"
    runtime_and_memory: "one discrete logarithm plus public pairing/scalar operations"
    status: derived_unreviewed
    earliest_gap: "no concrete discrete-log algorithm or parameter cost was assessed"
    security_value: >-
      Shows scalar transfer need not expose or compute End(E). It does not by
      itself prove the transfer problem easy at any concrete parameter.

desired_chain_summary:
  chain: >-
    IND attacker -> CEST-XFER-KI distinguisher -> scalar-transfer point
    -> reusable EvalLine -> full psi_E -> adaptive bounded-OneEnd oracle
    -> complete EndRing basis
  established_prefix: "through scalar-transfer point only, proposed and unreviewed"
  earliest_bare_endring_gap: "RB-01: exact public-key challenge embedding"
  earliest_aux_endring_gap: "RB-02: complete-ring extraction"
  earliest_post_attacker_gap: "RB-05/RB-06: one-shot line transfer does not yield a global endomorphism evaluator"
  adaptive_gap: "RB-08: one endomorphism on E does not answer all adaptive internal queries"
  final_conditional_arrow: "RB-09"

controls:
  scalar_slice:
    mutation: "set psi=[s] on all of E[q], hence A=[s]P"
    result: >-
      The frozen basis predicate rejects this literal mutation because
      e_q(P,[s]P)=1. In an abstract cyclic group it reproduces hashed-DH
      algebra, so it is a method control, not an in-distribution EigenX key.
    implication: >-
      A proof using only scalar-linearity has not isolated an EndRing-specific
      mechanism, but this mutation alone is not a counterexample to real keys.
  evaluator_quotient:
    mutation: "replace W by EvalLine_(P,A) on the accepted ciphertext domain"
    result: "all accepted decryption outputs are identical"
    implication: >-
      Complete-ring necessity is unproved. Black-box transfer transcripts add
      no action outside the public-key-determined line homomorphism.
  pairing:
    single_equation: "e_q(P,T)=e_q(R,A) has q solutions T=[r]A+xP"
    unique_pair: >-
      adding e_q(A,T)=1 and q-torsion membership uniquely identifies T=[r]A
    target_dlp: "e_q(R,A)=e_q(P,A)^r gives the RB-11 attack route"
    implication: >-
      DDH-style decisional opacity of the transfer tuple is unavailable; the
      computational transfer target remains unmeasured.
  malformed_and_wrong_key:
    cases:
      - noncanonical bytes
      - embedded public-key mismatch
      - wrong v length
      - infinity or off-curve R
      - non-q-torsion R
      - R outside <P>
    expected: "one failure symbol before plaintext output"
    limitation: "constant-time and side-channel uniformity are not claimed"
  repeated_use:
    event: "r repeats under one key"
    result: "R and pad repeat, revealing the XOR of the two plaintexts"
    bound: "at most Q(Q-1)/(2(q-1)) for Q independent uniform nonzero nonces"
  cca2:
    mutation: "replace v by v XOR Delta in the challenge ciphertext"
    result: "one allowed Dec query returns m_beta XOR Delta"
    implication: "scoped deterministic IND-CCA2 break; no CCA claim survives"
  model:
    classical: "RB-03 and RB-04 use classical random-oracle forwarding/query inspection"
    quantum: >-
      No QROM simulation/extraction or QPT theorem is given. No classical
      argument is promoted to post-quantum security.
  reverse_arrow:
    mutation: "supply a complete EndRing solution to the algorithm"
    result: "decryption succeeds through psi_E(R)"
    implication: "attack sufficiency only; no security-reduction value"

scoped_obstruction:
  name: reachable_line_evaluator_does_not_supply_complete_ring_extraction
  affected_arrows: [RB-05, RB-06, RB-08]
  scope: >-
    Black-box reductions using only the frozen EigenX/CEST public view,
    accepted ciphertexts R in <P>, and attacker-derived transfer points.
  argument: >-
    Every accepted transfer response is a value of the unique homomorphism
    [x]P |-> [x]A, already mathematically fixed by public P,A. The transcript
    supplies neither action on an independent torsion direction nor a global
    rational map, and a discrete-log solver can implement the same capability
    without computing End(E). No supplied theorem lifts this quotient to one
    canonical endomorphism, much less an adaptive oracle or a rank-four basis.
  does_not_establish:
    - "universal impossibility of a non-black-box reduction"
    - "insecurity of CEST-XFER-KI for every parameter family"
    - "nonexistence of a different EndRing-based PKE"
    - "nonexistence of a public adaptive OneEnd bridge"
  exit_criterion: >-
    A reviewed polynomial Lift_XFER_to_AdaptiveOneEnd or direct extractor that
    starts from the exact challenge/view, uses no hidden W-correlated advice,
    outputs the required representations on the exact distributions, and
    quantifies whole-chain success, abort, time, memory, and loss.

