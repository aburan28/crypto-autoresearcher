schema: crypto.autoresearch.review_plan.v1
review_plan:
  id: RP-BATCH-44a1ce
  batch_id: BATCH-44a1ce
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  frozen_by_decision: DEC-20261013-3f36a0
  frozen_at: '2026-10-13T02:41:16Z'
  subject: eigenx_adaptive_oneend_coverage_and_endring_reduction
  prior: >-
    The Coordinator expects the adaptive-coverage producer to find no interface
    satisfying all transcript-conditional success and cost obligations, and
    expects the current EigenX/CEST transcript to remain insufficient for
    complete-ring extraction. A fully typed bridge or correct-direction
    extractor would overturn that prior and is not to be discounted.
  verdict_vocabulary: [holds, breaks, inconclusive]
  composition_rule: >-
    Copy every joint verdict from its sole owner. Do not vote, average, or let
    one reviewer dispose another joint. A bridge survives only if J1--J4 hold;
    EigenX is a construction only if each O1--O6 item in J5 has a reviewed
    discharge. Any other outcome preserves exact open obligations.
  joints:
    - id: J1
      title: exact adaptive OneEnd transcript and quantifiers
      owner_task_id: TASK-20261013-794750
      owner_role: validator_blind_rederivation
      question: >-
        What exact sequence of bounded-OneEnd queries, dependencies, output
        relations, degree bounds, and success assumptions does the sourced
        reconstruction require?
      worked_attack: >-
        Re-derive the transcript from the primary packet alone. Let each query
        depend on all prior valid answers; distinguish worst-case, per-query,
        distributional, and average success; and locate any step that assumes
        an always-answer oracle or reuses uncharged advice.
      breaking_artifact: >-
        A source mismatch, omitted transcript dependency, invalid amplification,
        or inability to state the full conditional probability and total cost.
      controls:
        - single D_ER endpoint sampler substituted for an every-query oracle
        - oracle that succeeds only on the initial curve
      blind_rederivation:
        quantity: exact adaptive query law, total success, and reconstruction cost
        allowed_inputs:
          - ledger/decisions/DEC-20261013-3f36a0.yaml
          - coordination/design/TASK-20261013-ba3742/opening.yaml
          - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-daf6ab/source-ledger.yaml
          - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-daf6ab/source-report.md
          - primary bytes identified by the frozen source ledger
        blind_from:
          - coordination/design/TASK-20261013-ba3742/tasks/TASK-20261013-a9f4e6/
          - coordination/design/TASK-20261013-ba3742/tasks/TASK-20261013-ca4c9a/
          - coordination/design/TASK-20261013-ba3742/reviews/TASK-20261013-f41a55/
          - coordination/design/TASK-20261013-ba3742/reviews/TASK-20261013-3e1698/
          - coordination/design/TASK-20261013-ba3742/composition/
    - id: J2
      title: public bridge construction, typing, and honest support
      owner_task_id: TASK-20261013-f41a55
      owner_role: reviewer
      question: >-
        Does each admitted interface construct a valid non-scalar self-
        endomorphism on every covered query using only public uniform inputs,
        with canonical efficient representation and honest output support?
      worked_attack: >-
        Trace every datum to public parameters and transcript bytes; remove
        instance-specific advice; test source/target and non-scalarity; enumerate
        proper witness families; and compare each route against BATCH-12e6aa to
        detect renamed failures.
      breaking_artifact: >-
        Hidden path/orientation/ideal/torsion/ring input, wrong codomain, scalar
        output, noncanonical representation, public finite-list collapse, or a
        route equivalent to an already broken family.
      controls:
        - explicit valid exceptional automorphism as a positive typing control
        - scalar, immediate dual backtrack, and leaked-witness routes as negatives
      blind_from:
        - coordination/design/TASK-20261013-ba3742/reviews/TASK-20261013-794750/
        - coordination/design/TASK-20261013-ba3742/reviews/TASK-20261013-3e1698/
        - coordination/design/TASK-20261013-ba3742/composition/
    - id: J3
      title: adaptive success, abort, and total cost
      owner_task_id: TASK-20261013-f41a55
      owner_role: reviewer
      question: >-
        Does an interface's per-query guarantee compose over the adaptive
        transcript with polynomial total time, memory, degree, representation,
        retries, and non-negligible end-to-end success?
      worked_attack: >-
        Replace independence by arbitrary transcript dependence; calculate a
        union or conditional bound from the declared query count; charge every
        retry, verification, serialization, duplicate, and failed attempt; and
        expose average-to-pointwise upgrades.
      breaking_artifact: >-
        Unbounded retries, negligible joint success, omitted bad-prefix mass,
        superpolynomial output or degree, or an unsupported independence claim.
      controls:
        - per-query success on independent D_ER samples
        - deterministic success on one easy curve
      blind_from:
        - coordination/design/TASK-20261013-ba3742/reviews/TASK-20261013-794750/
        - coordination/design/TASK-20261013-ba3742/reviews/TASK-20261013-3e1698/
        - coordination/design/TASK-20261013-ba3742/composition/
    - id: J4
      title: correctly directed reduction and complete-ring extraction
      owner_task_id: TASK-20261013-3e1698
      owner_role: red_team_blind_rederivation
      question: >-
        Does a successful EigenX attacker on the exact real view yield a
        complete EndRing solution with explicit embedding, simulation,
        extraction, loss, and runtime?
      worked_attack: >-
        Starting from the frozen original candidate rather than the producer's
        conclusion, build the solver in the required direction. Try the
        observable-fiber collision between a full ring witness and an
        evaluator-only witness, separate CEST-XFER-KI from EndRing, and reject
        every use of the complete ring supplied to the solver.
      breaking_artifact: >-
        A reversed implication, mismatched key distribution, simulator needing
        the hidden witness, transfer-only extraction, one-endomorphism output,
        unquantified abort, or absent complete-basis reconstruction.
      controls:
        - EndRing solver used to decrypt must be labeled an attack route
        - scalar-only psi_E=[s] slice must not prove an EndRing-specific theorem
        - evaluator-only secret must reproduce current decryption behavior
      blind_rederivation:
        quantity: complete reduction direction, extraction output, and loss
        allowed_inputs:
          - ledger/decisions/DEC-20261013-3f36a0.yaml
          - coordination/design/TASK-20261013-ba3742/opening.yaml
          - research/ssi-endring-pke/eigenx/README.md
          - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/candidate.md
          - coordination/design/TASK-20261007-9c36ba/tasks/TASK-20261007-913665/scheme-contract.yaml
          - coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-daf6ab/source-ledger.yaml
          - primary bytes identified by the frozen source ledger
        blind_from:
          - coordination/design/TASK-20261013-ba3742/tasks/TASK-20261013-a9f4e6/
          - coordination/design/TASK-20261013-ba3742/tasks/TASK-20261013-ca4c9a/
          - coordination/design/TASK-20261013-ba3742/reviews/TASK-20261013-794750/
          - coordination/design/TASK-20261013-ba3742/reviews/TASK-20261013-f41a55/
          - coordination/design/TASK-20261013-ba3742/composition/
    - id: J5
      title: EigenX six-obligation scheme contract and complete adversarial view
      owner_task_id: TASK-20261013-3e1698
      owner_role: red_team
      question: >-
        What is the independently supported status of O1--O6 for the frozen
        EigenX/CEST candidate after any bridge result, including pairings,
        rejection, repeated use, classical/quantum scope, and actual-message
        recovery?
      worked_attack: >-
        Audit each obligation separately. Test malformed and wrong-key inputs,
        repeated keys and ciphertexts, transcript encodings, the public pairing
        relations, CCA malleability, the evaluator-only secret, and all missing
        sampler/selector algorithms. Refuse to inherit one obligation from a
        differently typed interface.
      breaking_artifact: >-
        Any missing honest algorithm, distribution theorem, correctness scope,
        recipient strictness result, reduction, adversarial-view item, or
        independently reviewed source required by O1--O6.
      controls:
        - conditional accepted-key correctness is not complete KeyGen
        - public verification of a relation is not uniqueness or confidentiality
        - a classical-ROM statement is not QROM or post-quantum security
      blind_from:
        - coordination/design/TASK-20261013-ba3742/reviews/TASK-20261013-794750/
        - coordination/design/TASK-20261013-ba3742/reviews/TASK-20261013-f41a55/
        - coordination/design/TASK-20261013-ba3742/composition/
    - id: J6
      title: documentation, visuals, source traceability, and claim boundary
      owner_task_id: TASK-20261013-56cb4b
      owner_role: reviewer_documentation
      question: >-
        Do the report, editable diagram, SVG, PDF, obligation table, verdicts,
        sources, zero-run accounting, and problem update agree exactly?
      worked_attack: >-
        Trace every factual claim to a frozen source or reviewed artifact;
        compare verdicts and arrows across formats; inspect the SVG and every
        PDF page; and search for automatic-security, impossibility, novelty,
        performance, or deployment wording.
      breaking_artifact: >-
        Unsupported source language, stale or illegible rendering, mismatch
        between report and owned verdicts, absent negative/inconclusive result,
        or any claim broader than the reviewed scope.
      blindness:
        reads_after_composition: true
        not_a_vote_on_J1_through_J5: true
  review_execution:
    producer_snapshot_task_id: TASK-20261013-83d718
    scientific_review_tasks:
      - TASK-20261013-794750
      - TASK-20261013-f41a55
      - TASK-20261013-3e1698
    composition_task_id: TASK-20261013-a6dbb9
    documentation_task_id: TASK-20261013-56cb4b
    independence_check: >-
      Run tools/check_review_independence.py on the frozen batch before
      composition is treated as complete. Record every procedural deviation.
  proves_too_much:
    objects:
      - id: PTM-J1-SINGLE-LAW
        known_false_conclusion: Success under one endpoint law supplies an oracle on every adaptive internal query.
        owner_task_id: TASK-20261013-794750
      - id: PTM-J2-NONUNIFORM-ADVICE
        known_false_conclusion: Per-curve existence with instance-specific advice is one public uniform algorithm.
        owner_task_id: TASK-20261013-f41a55
      - id: PTM-J3-INDEPENDENT-AMPLIFICATION
        known_false_conclusion: Marginal success on independent samples gives the same success on adaptively selected curves.
        owner_task_id: TASK-20261013-f41a55
      - id: PTM-J4-REVERSE-ARROW
        known_false_conclusion: An EndRing solver that decrypts proves an attacker-to-EndRing security reduction.
        owner_task_id: TASK-20261013-3e1698
      - id: PTM-J5-ONE-EVALUATOR
        known_false_conclusion: Correct decryption from one evaluator proves that a complete rank-four ring is necessary.
        owner_task_id: TASK-20261013-3e1698
  procedure_deviations: []
  closure_gate: >-
    Composition waits for J1--J5. The ledger decision waits for the complete
    report set and J6. A scoped break closes only the named interface and no
    zero-survivor result proves universal nonexistence.
