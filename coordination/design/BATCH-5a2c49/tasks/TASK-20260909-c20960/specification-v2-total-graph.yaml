draft_protocol_amendment:
  id: EXP-ECDLP-08b7f5-draft-v2-total-graph
  disposition: Additive zero-run finite graph/range/output contract.
  graph:
    exact_keys: [schema_version, nodes, edges, terminal_conclusions]
    schema_version: tier-ladder-mock-v2
    nodes: canonical sorted typed records {node_id, range_kind} where range_kind in [BOUNDED, ABSENT, UNCONSTRAINED]
    edges: canonical sorted typed records {from_node, to_node}; exact finite edge inventory; duplicate/extra/missing edge refuses
    terminal_conclusions: canonical sorted node IDs
  classification:
    precedence: [UNCONSTRAINED_ROUTE, BOUNDED_ROUTE, ABSENT_ROUTE, NO_ROUTE]
    rule: any unconstrained route wins; else any fully bounded route wins; else any absent route; else no route
  output:
    exact_keys: [schema_version, classification, graph_identity, reachable_terminals, retired_terminals, no_state_change_witness]
    schema_version: tier-ladder-output-v2
    no_state_change_witness: {exact_keys: [effect], exact_value: EFFECTS_FORBIDDEN}
    forbidden_recursive: [live_record_path, lane, goal, claim, priority, retirement_action, archive_action, execution]
  nulls: {shuffled_graph: must change graph_identity, unconstrained_inputs: classification UNCONSTRAINED_ROUTE and retired_terminals empty}
  does_not: [authorize_live_graph_read, authorize_retirement, authorize_priority_change, create_canonical_records]
