id: H-ECDLP-ed4060
kind: hypothesis_draft
status: draft
title: Tier-ladder reachability mock contract
source_idea: IDEA-20260815-0253b6
area: ECDLP
mechanism: >
  A finite, synthetic, typed dependency graph can distinguish a declared
  range-constrained route, an unconstrained route, an absent route, and a
  no-state-change retirement-proof mock without reading any live goal,
  experiment, lane, queue, or priority record.
prediction:
  subject only to the frozen mock inputs in the accompanying specification,
  every classification is determined by closed node, edge, range, and witness
  fields; any missing, extra, conflicting, or undeclared field is refused.
test_boundary:
  This is a zero-run design hypothesis about a synthetic finite graph and its
  typed classifications. It does not model, inspect, classify, retire, rank,
  or change any actual research goal, lane, experiment, idea, or priority.
falsification_criteria:
  - A valid synthetic graph permits two different classifications for the same canonical input.
  - A malformed or undeclared synthetic input is accepted instead of refused.
  - The contract permits an output that changes a live research-state field.
  - The contract relies on an un-read goal, lane, queue, priority, or ledger source as evidence.
assumptions:
  - All graph vertices, edges, ranges, witnesses, and outputs are synthetic mock values.
  - No external or repository research-state record is read by this design task.
  - Any later use against live records requires a separately frozen source snapshot,
    a Coordinator decision, an implementation contract, and independent review.
