  role: validator
  joint: tier_ladder_literal_fixture_v4
  scope: Literal graph bytes and digest, mixed-route classification, shuffled and unconstrained nulls, and effect-free output in the BATCH-local v4 fixture only.
  source_snapshot:
    commit: ebc77803851297d9328366b8572ee1fdf0e7648d
    fixture_sha256: 8d874db9e7512cd637c7303f509efcb3c9cb6e6067d50e3fa478b1d0b6ffce9e
    decision_sha256: d403485945b5c58bce5e4efd77074bce423d4aa5ee2e15d131cdf8f07b9889a7
    binding: holds
  checks:
    - id: source_snapshot_binding
      result: holds
      evidence: The current v4 fixture and DEC-20260909-8b96f1 bytes match the two declared source-snapshot paths at ebc77803851297d9328366b8572ee1fdf0e7648d.
    - id: yaml_parse
      result: holds
      evidence: specification-v4-fixture-envelope.yaml parses as YAML.
    - id: literal_graph_digest
      result: breaks
      evidence: canonical_graph_bytes hashes to 6872d49aa37b7d400be62638a3aba3629752735e4b028ea2d3b0d5fff9ae7c2f, while graph_sha256 is the prose string SHA-256 of canonical_graph_bytes rather than a 64-hex digest. An edge mutation changes the computed digest, but no declared digest can bind either the frozen graph or the mutation refusal.
    - id: mixed_route_semantics
      result: breaks
      evidence: The sole declared N0-to-N2 path has labels BOUNDED, ABSENT, UNCONSTRAINED. The prose precedence selects UNCONSTRAINED_ROUTE whenever any route has UNCONSTRAINED, but does not define route construction, a root, or whether an ABSENT node makes that route unavailable. It therefore does not give a total, replayable mixed-route classifier.
    - id: shuffled_null_fixture
      result: breaks
      evidence: shuffled is a descriptive sentence, with no literal permuted graph bytes, declared digest, comparator, or expected result. It cannot be replayed or distinguished from a different graph mutation.
    - id: unconstrained_null_fixture
      result: breaks
      evidence: unconstrained is a descriptive sentence, with no literal graph bytes, digest, typed terminal array, or output fixture. The stated classification cannot be recomputed from a frozen null object.
    - id: recursive_effect_free_output
      result: breaks
      evidence: output_exact_keys and output_exact_values constrain only the top level. A reachable_terminals value containing a nested retirement field preserves all six declared keys plus schema_version, retired_terminals [], and effects [], because neither its type nor nested fields are closed. recursive_forbidden is only a word list, not a recursive schema or validator.
  control_outcomes:
    digest: breaks
    graph_mutation: breaks
    route: breaks
    shuffle: breaks
    unconstrained: breaks
    effect: breaks
  verdict: breaks
  limitations:
    - This review tested only the declared synthetic BATCH-local packet and no live goal, lane, queue, claim, priority, branch, or execution state.
    - These interface defects are not evidence for or against an ECDLP hypothesis, attack, bound, or research direction.
  required_repair:
    - Replace graph_sha256 prose with a literal digest over a declared canonical serialization.
    - Freeze literal shuffled and unconstrained graph/output fixtures with digests and typed comparators.
    - Define total root-to-terminal route construction and precedence for mixed ABSENT and UNCONSTRAINED labels.
    - Define a recursively closed typed output schema that forbids nested effects and live-action fields.
