  control_checks:
    - control: shuffled_graph_invariant
      result: breaks
      finding: >
        graph_id has only a format pattern and no content digest, canonical serialization,
        or comparator.  The same MOCK-GRAPH identifier can therefore name differently
        ordered, different, or duplicate-containing node and edge arrays.  No structural
        invariant proves that a shuffled graph is the same graph, or that the null differs
        only in its declared mutation.
    - control: unconstrained_route_and_retirement_boundary
      result: breaks
      finding: >
        The classification is not total for a valid mixed-route graph.  For example, with
        route request M1 to M3, edges M1->M2->M3 and M1->M4->M3, M2 UNCONSTRAINED, and
        M1, M3, and M4 BOUNDED, UNCONSTRAINED_ROUTE is false because not every candidate
        route contains an unconstrained node.  ABSENT_ROUTE and NO_ROUTE are false, while
        the lexicographically selected M1,M2,M3 route is not all BOUNDED, so
        RANGE_CONSTRAINED_ROUTE is false.  The precedence list does not create a verdict.
        Separately, no closed output schema binds a classification to the witness; a
        structurally unrecognized output/effect field could encode RETIRE_BRANCH or
        CHANGE_PRIORITY outside allowed_effects.
    - control: undocumented_edge
      result: breaks
      finding: >
        edge_schema permits any directed edge between declared distinct nodes and does not
        bind a finite edge inventory to graph_id.  An added M1->M3 edge between existing
        nodes satisfies the stated edge relation and is not an exact duplicate.  It can
        create or bypass a route without becoming INVALID_INTERFACE.
    - control: live_locator
      result: breaks
      finding: >
        The forbidden-field list is top-level and selected edge/route fields are not
        recursively closed.  A node or an otherwise undeclared nested object can carry a
        live path or identifier, for example metadata: {record_path:
        'ledger/goals/GOAL-example.yaml'}, without matching any listed forbidden key.
        Neither node_schema nor the top-level envelope declares an exact allowed-key set
        or a recursive live-locator rejection rule.
    - control: retirement_and_priority_action
      result: breaks
      finding: >
        CONTROL-NO-STATE-CHANGE only mutates allowed_effects in the input witness.  The
        specification has no closed result/effect envelope, so it does not prove that
        result data, nested annotations, or output-adjacent metadata cannot express a
        retirement or priority action.  The no-state-change guarantee remains prose plus
        a partial input check rather than a complete input-to-output invariant.
