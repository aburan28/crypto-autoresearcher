schema: crypto.autoresearch.review_plan.v1
review_plan:
  id: RP-BATCH-be2a37
  batch_id: BATCH-be2a37
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  frozen_by_decision: DEC-20261013-d487d5
  frozen_at: '2026-10-13T04:47:43Z'
  subject: eigenx_v2_prescribed_path_kem_and_endring_reduction
  coordinator_prior: >-
    The prescribed-path interface is likely to fail at efficient unique recovery,
    exact key-distribution embedding, auxiliary-data independence, overlap with
    Seta-like constructions, or complete-ring extraction. A full discharge of
    those obligations would overturn this prior and must not be discounted.
  verdict_vocabulary: [holds, breaks, inconclusive]
  composition_rule: >-
    Copy each J1--J5 verdict from its sole owner and apply all six obligations
    conjunctively. Do not vote or let one joint dispose another. J6 checks only
    documentation after composition.
  joints:
    - joint: J1 -- mechanism typing and complete-ring necessity
      assigned_to: TASK-20261013-460f4d
      attack_plan: >-
        Trace KeyGen, Encaps and Decaps; replace W by a path oracle, one map,
        one evaluator and finite torsion actions; test whether the public sender
        can perform the claimed recipient operation and whether prescribed-degree
        endpoints admit multiple accepted paths.
    - joint: J2 -- exact challenge simulation and reduction direction
      assigned_to: TASK-20261013-8361f9
      attack_plan: >-
        Blindly construct the solver from the exact EndRing challenge and source
        the IsogenyPath/OneEnd relations; simulate every IND-CCA oracle, then
        demand extraction of a complete saturated rank-four evaluable basis with
        explicit loss, abort and runtime.
    - joint: J3 -- complete IND-CCA syntax, correctness and failure behavior
      assigned_to: TASK-20261013-37ee89
      attack_plan: >-
        Re-derive canonical serialization, ciphertext equality, validation,
        implicit rejection and correctness; exercise malformed, alternate,
        repeated, wrong-key and challenge-related ciphertexts and verify every
        hypothesis of the invoked KEM/CCA and KEM-DEM theorem.
    - joint: J4 -- complete adversarial view and total cost
      assigned_to: TASK-20261013-8a6d75
      attack_plan: >-
        Enumerate public parameters, auxiliary data, oracle responses and failure
        observables; charge sampling failures, preprocessing, recovery, memory,
        bit sizes and verification; compare the identical public-data operation.
    - joint: J5 -- primary-source overlap and assumption separation
      assigned_to: TASK-20261013-5f8b99
      attack_plan: >-
        Normalize the candidate against Seta, SiGamal/C-SiGamal, key-updatable
        PKE and LIT-SiGamal, audit Page--Wesolowski and the CCA transform sources,
        and verify that authenticated CEST remains a non-EndRing control.
  blindness:
    mutual: true
    lifted_for: [TASK-20261013-a7be35, TASK-20261013-0ec69e]
    rationale: >-
      The Coordinator composition task must read all owned verdicts, and J6 must
      read the composed report set. Neither is an independent scientific vote.
  blind_rederivation:
    required: true
    assigned_to: TASK-20261013-8361f9
    quantity: complete challenge embedding, oracle simulation, extraction output, advantage loss and runtime
    blind_from:
      - coordination/design/TASK-20261013-0348f3/tasks/TASK-20261013-613c4e/
      - coordination/design/TASK-20261013-0348f3/tasks/TASK-20261013-311565/
      - coordination/design/TASK-20261013-0348f3/reviews/
      - coordination/design/TASK-20261013-0348f3/composition/
  proves_too_much:
    failure_signature: >-
      A correct argument must fail at its first unjustified embedding,
      simulation, uniqueness, quotient-necessity or extraction step on each
      known-false object; accepting any object as EndRing-secure breaks its joint.
    objects:
      - id: PTM-J1-PUBLIC-PATH-ORACLE
        known_false_conclusion: A publicly available prescribed-path inverter is a recipient-only trapdoor.
        owner: TASK-20261013-460f4d
      - id: PTM-J2-REVERSE-ARROW
        known_false_conclusion: EndRing-to-decryption or EndRing-to-path recovery is an attacker-to-EndRing reduction.
        owner: TASK-20261013-8361f9
      - id: PTM-J3-AUTH-ONLY
        known_false_conclusion: Authentication alone supplies confidentiality or validates an inapplicable transform theorem.
        owner: TASK-20261013-37ee89
      - id: PTM-J4-FREE-AUXILIARY
        known_false_conclusion: Path, orientation, ideal or torsion advice has zero public-view and cost effect.
        owner: TASK-20261013-8a6d75
      - id: PTM-J5-CEST-RELABEL
        known_false_conclusion: An authenticated EvalLine CEST shell under XFER/co-CDH is an EndRing construction.
        owner: TASK-20261013-5f8b99
  post_review:
    composition:
      task_id: TASK-20261013-a7be35
      single_owner: coordinator
      verdict: exact copy-and-gate fidelity, not an additional scientific vote
    documentation:
      task_id: TASK-20261013-0ec69e
      single_owner: reviewer
      joint: J6
      verdict: report, visual, PDF, sources and claim-boundary fidelity only
  review_execution:
    producer_snapshot_task_id: TASK-20261013-1dd311
    scientific_review_tasks:
      - TASK-20261013-460f4d
      - TASK-20261013-8361f9
      - TASK-20261013-37ee89
      - TASK-20261013-8a6d75
      - TASK-20261013-5f8b99
    composition_task_id: TASK-20261013-a7be35
    documentation_task_id: TASK-20261013-0ec69e
    independence_check: >-
      Run tools/check_review_independence.py on the frozen batch after J1--J5
      and before treating composition as complete. Record every deviation.
  procedure_deviations: []
  closure_gate: >-
    Composition waits for J1--J5. Ledger archive waits for the report and J6.
    A scoped break closes only the exact prescribed-path interface.
