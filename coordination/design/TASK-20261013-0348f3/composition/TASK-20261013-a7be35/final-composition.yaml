  disposition: scoped_obstruction
  admitted_as_EndRing_PKE_or_KEM: false
  complete_IND_CCA2_construction_established: false
  correctly_directed_EndRing_reduction_established: false
  novelty_or_material_difference_established: false
  implementation_design_eligible: false
  scope: >-
    The exact prescribed-degree M=1 endpoint-plus-torsion interface is
    obstructed: its recipient behavior factors through a finite action already
    represented by Seta, its complete algorithms and costs are unfinished, and
    its attacker-to-EndRing reduction is absent. This does not rule out all
    prescribed-path constructions, all EndRing-bound recipient mechanisms, or
    all EndRing PKE/KEM designs.

authenticated_cest_control:
  id: CTRL-CEST-AUTH-XFER
  disposition: conditional_accepted_key_classical_ROM_XFER_control
  candidate: false
  EndRing_bound: false
  satisfies_material_difference_gate: false
  satisfies_O5: false
  exact_boundary: >-
    The direct KEM recognition-table argument and optional one-time IND-CCA DEM
    composition survive only conditionally on the accepted legacy key law,
    canonical parsing, CEST-XFER-COMP secrecy and the stated classical-ROM
    access. This can close the old raw-XOR bit-flip at that conditional scope,
    but it factors through EvalLine_(P,A), does not require a complete ring and
    is not EigenX-v2.

