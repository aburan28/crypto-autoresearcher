joint_verdicts_copied_exactly:
  J1:
    owner_task_id: TASK-20261013-460f4d
    verdict: breaks
    source_field: review.verdict_scope
    verdict_scope: >-
      The recipient operation is conditionally well typed as a Seta-style
      prescribed-path inverter, and the public key alone does not provide that
      inverter. The joint nevertheless breaks because the complete evaluable
      rank-four witness W is not necessary for the declared mathematical
      Decaps operation. For every accepted key, all W-dependent recovery data
      can be cached as q_N=(d,e,theta(P_N),theta(Q_N)); complete KEM behavior
      then factors through (pk,q_N,z), where z is the independent implicit-
      rejection seed. This is a scoped result for this exact M=1 Seta-style
      endpoint-plus-torsion interface, not a universal result about EndRing PKE.
  J2:
    owner_task_id: TASK-20261013-8361f9
    verdict: breaks
    source_field: red_team_report.verdict_scope
    verdict_scope: >-
      J2 only. The allowed opening does not supply a typed reduction with the
      required direction. This is not a whole-candidate verdict and is not an
      impossibility result for every prescribed-path or EndRing-based KEM.
  J3:
    owner_task_id: TASK-20261013-37ee89
    verdict: breaks
    source_field: review.verdict_scope
    verdict_scope: >-
      The frozen EigenX-v2-Path-FO-KEM packet does not instantiate a complete
      IND-CCA KEM. HHK Theorem 4 supports the displayed OW-PCA-to-IND-CCA outer
      transform conditionally, but the base PathPKE is not a PPT PKE with a
      quantified correctness law: TrapCurveGen_ER, SelectTrap, canonical
      endpoint/point transport, validation, and total Dec0 recovery remain
      unavailable. The malformed and related-ciphertext rules are therefore a
      conditional interface rather than an executable complete syntax. This is
      a verdict only on J3, not on the other review joints or the whole claim.
      The separate authenticated CEST packet survives J3 as a coherent
      accepted-key, classical-ROM conditional control under CEST-XFER-COMP; it
      does not repair EigenX-v2 or supply an EndRing theorem.
  J4:
    owner_task_id: TASK-20261013-8a6d75
    verdict: breaks
    source_field: red_team_report.narrowest_supported_statement
    verdict_scope: >-
      On the frozen zero-run packet, the producer has a substantially complete
      symbolic checklist for a single-user classical-ROM cost/view audit and
      correctly rejects zero-cost or view-free auxiliary advice. It establishes
      no instantiated total cost or complete real-key adversarial view. All
      concrete, asymptotic, implementation and comparative cost claims remain
      open, and the conclusion is limited to this prescribed-path/torsion-binding
      interface.
  J5:
    owner_task_id: TASK-20261013-5f8b99
    verdict: breaks
    source_field: review.verdict_scope
    verdict_scope: >-
      J5 breaks any admission of EigenX-v2-Path-FO-KEM as a materially new,
      complete-EndRing-secure construction. This is a scoped source-overlap and
      assumption-separation verdict, not a universal impossibility theorem for
      all EndRing PKE or KEM designs.

conjunctive_gate_application:
  rule: >-
    A construction requires reviewed discharges for every O1--O6 obligation
    and must pass the material-difference gate. No joint substitutes for, votes
    against, or repairs another joint.
  joint_vector: {J1: breaks, J2: breaks, J3: breaks, J4: breaks, J5: breaks}
  O1:
    status: open
    owned_evidence: [J2]
    finding: >-
      CompleteEndRing-KG can be typed, but the exact real KeyGen public-key law,
      accepted-key conditioning, public auxiliary-data distribution and a
      distribution-equal or bounded challenge embedding are unavailable.
  O2:
    status: open
    owned_evidence: [J3, J4]
    finding: >-
      The shell names algorithms and failure branches, but TrapCurveGen_ER,
      SelectTrap, canonical endpoint/point transport, total Dec0, validation,
      exact costs and bounded retry behavior are not executable complete
      algorithms on the real law.
  O3:
    status: open
    owned_evidence: [J3]
    finding: >-
      Accepted-key/per-path correctness is conditional. No terminating exact
      KeyGen law or quantified delta_1 bound over the actual correctness
      experiment is established, so the producer's proposed discharge is not
      promoted to a reviewed discharge.
  O4:
    status: contradicted
    owned_evidence: [J1, J5]
    finding: >-
      For the exact M=1 endpoint-plus-full-N-torsion interface, Decaps factors
      through q_N=(d,e,theta(P_N),theta(Q_N)) and z. The complete saturated
      evaluable rank-four End(E) witness is not necessary for the declared
      recipient operation, and the algebraic core is Seta's finite-action
      prescribed-path mechanism.
  O5:
    status: contradicted
    owned_evidence: [J2, J3, J5]
    finding: >-
      No correct-direction attacker-to-complete-EndRing reduction exists in the
      packet. The EndRing challenge does not supply an unknown prescribed path;
      the decapsulation oracle cannot be simulated without the withheld W;
      and a recovered single path or distinguisher bit does not instantiate the
      arbitrary-input OneEnd/Isogeny oracle required for complete-ring recovery.
    qualification: >-
      This contradicts the tested reduction for this frozen interface. It is
      not an impossibility theorem for a new correctly directed reduction or a
      different EndRing PKE mechanism.
  O6:
    status: open
    owned_evidence: [J3, J4, J5]
    finding: >-
      The packet has a substantial symbolic classical-ROM inventory and rejects
      free auxiliary advice, but the real-law adversarial distribution,
      canonical malformed-input grammar, failure schedule, exact bit/operation/
      memory/preprocessing costs, source-complete comparison and implementation
      observables remain incomplete.
  reviewed_discharge_count: 0
  open_count: 4
  contradicted_count: 2
  all_six_reviewed_discharges: false
  material_difference_gate: breaks
  construction_gate: fails

