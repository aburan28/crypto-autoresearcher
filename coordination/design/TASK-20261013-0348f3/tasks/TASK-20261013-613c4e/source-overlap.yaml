final_overlap_verdict:
  dominated_by: "SETA21-HAL for the functional algebraic core"
  sota_delta: none
  security_admission: rejected_as_endring_secure
  scoped_conclusion: >-
    This packet specifies one conditional active KEM, but establishes neither
    its base OW-PCA assumption nor an EndRing reduction. For the precise
    Seta-style prescribed-path/torsion-binding family, the complete ring is
    unnecessary to accepted decapsulation, so O4 is contradicted. This is not
    a universal impossibility result for every differently typed EndRing PKE.
