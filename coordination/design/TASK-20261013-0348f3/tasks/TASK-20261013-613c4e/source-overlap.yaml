normalization:
  candidate_functional_core: >-
    A uniform canonical degree-D nonbacktracking path x from a recipient curve
    E is bound by the tuple (E_x, phi_x(P_N), phi_x(Q_N)); a recipient trapdoor
    recovers the exact path or kernel, re-encryption checks exact bytes, and an
    HHK implicit-rejection shell derives a KEM key.
  advertised_recipient_secret: >-
    A saturated rank-four evaluable basis W of the complete End(E), plus an
    independent implicit-rejection seed z.
  actual_decapsulation_quotient: >-
    For the inspected Seta M=1 recovery mechanism, all recipient-dependent
    accepted behavior factors through (d,e,theta(P_N),theta(Q_N)) and z. The
    unused remainder of W can be changed without changing decapsulation.
  comparison_rule: >-
    Mechanisms are compared by the exact public binding, recipient operation,
    security game and assumption, not by the presence of the word isogeny.

