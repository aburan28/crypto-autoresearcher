earliest_failed_arrow:
  attempted_chain:
    - "complete evaluable W <- TrapCurveGen_ER"
    - "finite prescribed-path recovery trapdoor <- SelectTrap(E,W,D,N)"
    - "exact path x <- endpoint and torsion images plus trapdoor"
    - "OW-PCA_PathPKE <- complete EndRing hardness"
    - "IND-CCA KEM <- HHK transformation U"
  first_unavailable_construction_arrow: >-
    The exact TrapCurveGen_ER and polynomial full-ring
    transport/selection interface is not constructed by the inspected source.
    Naive conjugation phi alpha phi_hat/deg(phi) raises integrality,
    saturation, representation-size and evaluator-cost obligations.
  first_decisive_design_obstruction: >-
    Even granting that interface, prescribed-path recovery uses only the
    finite quotient (d,e,theta(P_N),theta(Q_N)). Consequently the accepted
    recipient map does not bind security to possession of the complete W.
  endpoint_only_branch: >-
    Removing the torsion images avoids that particular quotient but loses the
    only retrieved injectivity and polynomial exact-recovery theorem.
    Collisions are forced whenever the number of admitted path codes exceeds
    the number of canonical endpoint curves.
  reduction_boundary: >-
    HHK reaches OW-PCA_PathPKE, not EndRing. Page--Wesolowski does not fill the
    gap because its Isogeny output need not equal the sender's accepted
    prescribed path or kernel.

