claim_boundary: >-
  This artifact types the desired reduction for only the opening's
  prescribed-degree unique-isogeny EigenX-v2 candidate. It does not construct
  the sibling producer's scheme, prove that every prescribed-path mechanism
  fails, or establish security, novelty, practicality, parameters, or
  deployment readiness. Conditional downstream arrows are recorded so that an
  early gap is not confused with an impossibility result.

