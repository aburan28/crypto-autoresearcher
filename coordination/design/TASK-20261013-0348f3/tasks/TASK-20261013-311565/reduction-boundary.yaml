  page_wesolowski_packet:
    path: coordination/design/TASK-20261009-1c8974/tasks/TASK-20261009-daf6ab/source-ledger.yaml
    source_id: PW24-VOR
    source_revision: Springer version of record, EUROCRYPT 2024
    source_sha256: 55c054a8b4e75041fc2aef62438ac1bd5071f34fec7dea298bafecd6a62280ff
    provenance: retrieved
    inspected_scope: >-
      Problems 2.4--2.5, Algorithm 3, Lemma 7.1 and Theorem 7.2 as recorded in
      the source packet; EndRing is solved with an adaptive bounded-OneEnd
      oracle on curves generated inside the reduction.
  hlmw_isogeny_endring_source:
    citation: >-
      Arthur Herledan Le Merdy and Benjamin Wesolowski, Unconditional
      foundations for supersingular isogeny-based cryptography,
      arXiv:2502.17010v2, 2 February 2026.
    url: https://arxiv.org/pdf/2502.17010
    retrieved_at_utc: '2026-10-13'
    byte_length: 450285
    sha256: b7bdee58ae9f10bc27498e5c64f81978839727f74943f7e91f4bad8b152f7094
    pdf_pages: 33
    provenance: retrieved
    inspected_scope:
      - abstract and Sections 1--1.1, including Theorems 1 and 2 and Figures 1--3
      - Section 2.5, Problems 1--5 and Definition 3
      - Section 6, Propositions 12--13
      - Section 7 through Definition 4 and the stated OneEnd-to-average-Isogeny interface
    supported_statements:
      - >-
        Problem 1 Isogeny accepts two arbitrary supersingular curves and asks
        for any efficiently represented isogeny; Problem 3 ell-IsogenyPath
        asks for an ell-power path and does not require a unique path or one
        exact prescribed length.
      - >-
        Definition 3's average-case two-curve instances draw the input curves
        from the stationary distribution. This is not the conditional endpoint
        law obtained by sampling one path from a fixed public-key curve.
      - >-
        Theorem 1 gives unconditional polynomial-time equivalence among
        Isogeny, EndRing, OneEnd, HomModule, MOER and the listed maximal-order
        problems. The theorem's list does not include ell-IsogenyPath.
      - >-
        Theorem 2 gives worst-case-to-average-case reductions among the listed
        problems, including ell-IsogenyPath, with its stated exceptions. This
        still requires an oracle for the source's exact average-case problem,
        not an inverter for a scheme-conditioned binding relation.
      - >-
        The source explicitly says the known reduction from ell-IsogenyPath
        to EndRing requires GRH. This is the reverse attack-direction control;
        it is not the attacker-to-EndRing direction required here.
    not_transferred:
      - No theorem identifies EigenX-v2's as-yet-unspecified path law with the source's average-case law.
      - No theorem upgrades a unique fixed-degree binding inverter to an oracle for arbitrary Isogeny or ell-IsogenyPath instances.
      - No IND-CCA challenge embedding, decapsulation simulation, or scheme-attacker extractor appears in this source.

problem_objects:
  complete_endring_challenge:
    input: >-
      A supersingular curve E over F_(p^2) sampled from the exact real KeyGen
      curve distribution, with only the auxiliary data explicitly declared by
      the EndRing game.
    output: >-
      Four efficiently represented endomorphisms forming a saturated
      Z-lattice basis of exactly End(E), including evaluators and the
      representation data required to verify and use them.
    excluded_outputs:
      - one path or kernel
      - one isogeny or one non-scalar endomorphism
      - an abstract quaternion order without evaluable maps on E
      - finite torsion action, orientation, ideal, line evaluator, or rank-one quotient
  complete_scheme_attacker:
    type: classical IND-CCA2 KEM or KEM-DEM adversary in the ROM
    required_view: >-
      The exact KeyGen law, canonical public key, exact challenge ciphertext,
      every public parameter and binding datum, classical random-oracle access,
      and adaptive decapsulation/decryption access on every byte string other
      than the exact challenge serialization.
    advantage: "abs(Pr[b'=b]-1/2)"
  prescribed_path_inversion:
    required_instance: >-
      A tuple (pp,pk,E_start,E_end,d,binding) sampled by the exact honest
      encapsulation law, where d is the prescribed degree or degree pattern.
    required_output: >-
      Canonical bytes x for the unique accepted path or kernel satisfying a
      public relation Rel_path(pp,pk,E_start,E_end,d,binding,x)=1.
    current_definition_status: open
    missing_fields:
      - exact TrapCurveGen and public-key distribution
      - exact degree family and path-sampling law
      - exact path equivalence and canonicalization
      - exact binding relation and collision rule
      - success predicate when several paths share an endpoint
      - malformed-input and no-solution behavior
  source_isogeny_interfaces:
    isogeny: "two arbitrary supersingular curves -> any efficiently represented connecting isogeny"
    ell_isogeny_path: "two arbitrary supersingular curves and ell -> an ell-power path of unspecified acceptable length"
    average_case: "each input curve follows the stationary distribution"
    bounded_one_end: >-
      on each curve queried by Page--Wesolowski, return one efficiently
      represented non-scalar endomorphism satisfying the declared degree bound
    mismatch_summary: >-
      A scheme-conditioned unique fixed-degree preimage is not, by definition,
      any of these source interfaces.

desired_solver:
  quantifiers: >-
    For every security parameter lambda and every PPT classical-ROM adversary
    A with IND-CCA2 advantage epsilon(lambda) against the complete scheme, a
    PPT solver B must, on an independently sampled complete-EndRing challenge
    from the exact real-key curve distribution, output a valid complete basis
    with non-negligible probability bounded explicitly in epsilon and all
    query, abort, collision and distribution terms.
  required_call_chain:
    - embed the EndRing challenge as an exactly or quantified-close real public key
    - simulate the complete IND-CCA2 and random-oracle view
    - turn A's behavior into a prescribed-path solution on a declared instance law
    - compile that inverter into the exact Isogeny or bounded-OneEnd oracle required by a sourced reconstruction
    - run the reconstruction and return a saturated evaluable rank-four basis on the original curve
  required_bound: >-
    Adv_IND-CCA2(A) <= L(lambda,q_D,q_H)*Succ_EndRing(B) +
    delta_distribution + delta_simulation + delta_abort + delta_collision,
    with polynomial L and negligible accumulated deltas.
  current_bound: none

earliest_exact_gaps:
  whole_security_reduction:
    id: XV2-G0
    location: complete EndRing challenge -> exact real EigenX-v2 public key
    reason: >-
      The opening says KeyGen samples E together with a complete witness W and
      uses W for path recovery, but supplies no TrapCurveGen law or algorithm
      that, given only an EndRing challenge curve E, samples all remaining
      public-key bytes with the identical conditional distribution. A solver
      cannot assume W, an orientation, a path, an ideal, or torsion advice.
    consequence: >-
      The complete attacker cannot yet be invoked on a correctly distributed
      challenge. This is the first gap in the correctly directed EndRing
      security reduction.
    exit_criterion: >-
      Give a polynomial public-key compiler from the exact EndRing challenge,
      prove equality or an explicit statistical/computational distance to the
      real KeyGen law, and give a polynomial pullback from any extracted basis
      to the original challenge representation.
  requested_post_attacker_chain:
    id: XV2-G1
    location: complete IND-CCA2 attacker -> prescribed-path inverter
    reason: >-
      The opening does not define Rel_path, the ciphertext grammar, the
      challenge KDF/transform, Decaps, implicit rejection, or a theorem whose
      hypotheses turn a distinguishing bit into the canonical path x.
      Therefore challenge embedding, decapsulation simulation, oracle
      programming and extraction cannot be instantiated or assigned a loss.
    consequence: >-
      Even granting a correctly distributed public key, the first requested
      post-attacker arrow remains open rather than false.
    exit_criterion: >-
      Freeze complete algorithms and encodings, a public relation with a
      unique accepted witness or quantified collision set, and a sourced or
      fully derived classical-ROM transform proof covering every oracle query.

reduction_arrows:
  - id: XV2-R0
    label: complete EndRing challenge to exact scheme view
    orientation: required_security_reduction_prefix
    input:
      type: complete_endring_challenge
      distribution: exact real KeyGen curve law, without W
      auxiliary_data: only the declared EndRing instance
    output:
      type: exact serialized public key and all public parameters
      distribution: exact real KeyGen law, or a law with proved distance delta_key
    quantifiers: "for every valid challenge in the support, over fresh compiler coins"
    challenge_embedding: "not constructed"
    oracle_simulation: "not reached"
    extraction: "not reached"
    success_and_loss: "undefined; delta_key is not bounded"
    abort_probability: "undefined"
    runtime: "undefined"
    memory: "undefined"
    status: open_first_global_gap
    gap: XV2-G0

  - id: XV2-R1
    label: complete-scheme IND-CCA2 attacker to prescribed-path inverter
    orientation: requested_post_attacker_extraction
    input:
      type: one prescribed-path inversion challenge
      distribution: exact honest Encaps path, endpoint and binding law
      auxiliary_data: exact public key, public algorithms, ROM and all binding bytes
    output:
      type: canonical accepted path or kernel x
      success_predicate: Rel_path accepts and x is the required canonical witness
    quantifiers: >-
      for every PPT attacker A and all polynomial q_D,q_H, under the exact
      challenge distribution and all accepted/malformed oracle inputs
    challenge_embedding: >-
      Required to form the complete real-or-random KEM challenge without x or
      W, while preserving the exact path-conditioned endpoint and binding law.
      No construction is supplied.
    decapsulation_simulation: >-
      Required for every non-challenge byte string, including the same endpoint
      with different binding bytes, alternate paths, malformed encodings,
      repeated queries and wrong-key inputs. No path relation, rejection secret,
      or simulator is supplied.
    random_oracle_simulation: >-
      Domains, programmed points, query recognizer, extraction event and
      collision policy are unspecified. No classical-ROM game hop can be
      instantiated.
    extraction: >-
      A's output is one bit. No theorem or query-recognition argument maps it
      to path bytes x, and uniqueness is not established.
    success_and_loss: "none established"
    abort_probability: "none established"
    runtime: "none established"
    memory: "none established"
    status: open_first_post_attacker_gap
    gap: XV2-G1

  - id: XV2-R2
    label: scheme prescribed-path inverter to sourced average-case ell-IsogenyPath oracle
    orientation: attempted_interface_compiler
    input:
      type: black-box inverter for valid EigenX-v2 ciphertext instances
      distribution: one public-key curve and an endpoint/binding produced by the scheme path sampler
      auxiliary_data: the complete scheme public view
    output:
      type: oracle solving HLMW Problem 3 instances
      distribution: two input curves drawn according to HLMW Definition 3 when average-case access is required
    quantifiers: >-
      every source-oracle query made by the selected OneEnd/EndRing reduction,
      including adaptively selected curves and fresh coins
    challenge_embedding: >-
      Must turn each arbitrary or stationary-pair source instance into an
      identically distributed valid scheme ciphertext without knowing a path.
      No such compiler is supplied.
    oracle_simulation: "not applicable beyond the missing instance compiler"
    extraction: >-
      Must translate the inverter's canonical fixed-degree witness into an
      accepted source ell-path; degree, length and equivalence must match.
    success_and_loss: >-
      Unbounded. The scheme endpoint is conditional on a sampled path from one
      key curve; the source average-case law samples its curve inputs from the
      stationary distribution and does not condition on one unique fixed path.
    abort_probability: "unbounded on off-support source queries"
    runtime: "undefined"
    memory: "undefined"
    status: open_distribution_and_relation_gap
    source_support: >-
      HLMW v2 Problems 1 and 3, Definition 3 and Theorem 2 support the source
      interfaces only; they do not support this compiler.

  - id: XV2-R3
    label: exact average-case Isogeny or ell-IsogenyPath oracle to bounded OneEnd
    orientation: conditional_source_reduction
    input:
      type: oracle for the exact source problem on every query distribution
      distribution: HLMW stationary average-case law with its theorem's hypotheses
      auxiliary_data: only data generated by the source reduction
    output:
      type: one efficiently represented non-scalar endomorphism on the requested curve
      distribution: the reduction's output law
    quantifiers: "all source-valid p and curves, over the reduction and oracle coins"
    challenge_embedding: >-
      HLMW Section 7 states a worst-case OneEnd reduction to average-case
      Isogeny and its network includes average-case ell-IsogenyPath.
    oracle_simulation: "the source oracle must be total on its prescribed query law"
    extraction: "the source reduction returns a OneEnd solution"
    success_and_loss: >-
      Expected polynomial and source-theorem success only if the exact oracle
      interface is supplied; no EigenX-v2-specific bound is inherited.
    abort_probability: "as in the source theorem; not instantiated for the scheme inverter"
    runtime: "source-stated expected polynomial in input and oracle-output lengths"
    memory: "not concretized by this packet"
    status: source_supported_conditional_not_instantiated
    blocked_by: XV2-R2

  - id: XV2-R4
    label: adaptive bounded-OneEnd oracle to complete EndRing basis
    orientation: conditional_source_reconstruction
    input:
      type: Page--Wesolowski bounded-OneEnd oracle
      distribution: every curve generated adaptively inside Algorithm 3
      auxiliary_data: no hidden scheme path, orientation, ideal, torsion tag or ring witness
    output:
      type: complete saturated evaluable rank-four basis of End(E)
      distribution: deterministic/random output of the sourced reconstruction on input E
    quantifiers: >-
      every reachable adaptive transcript prefix and every resulting oracle
      curve; every answer must meet the bounded efficient-representation relation
    challenge_embedding: "not a scheme embedding; this is a reconstruction subroutine"
    oracle_simulation: >-
      Page--Wesolowski Algorithm 3 requires valid answers on all adaptive query
      curves. One scheme path, one initial-curve endomorphism, or marginal
      success on one endpoint law is insufficient.
    extraction: "Algorithm 3 returns the complete EndRing basis"
    success_and_loss: >-
      Expected polynomial in log(p) and the OneEnd degree bound, conditional on
      a valid total oracle; exact whole-transcript abort and concrete query-tail
      bounds remain uninstantiated here.
    abort_probability: "undefined for an EigenX-v2-derived partial oracle"
    runtime: "source-stated expected polynomial, plus every oracle and representation cost"
    memory: "not explicitly quantified by the frozen PW24 theorem"
    status: source_supported_conditional_not_instantiated
    blocked_by: [XV2-R1, XV2-R2, XV2-R3]

  - id: XV2-R5
    label: composed complete-scheme attacker to complete EndRing basis
    orientation: desired_security_reduction
    input:
      type: exact complete-EndRing challenge plus black-box IND-CCA2 attacker
      distribution: exact real KeyGen curve law and exact complete scheme game
      auxiliary_data: no undeclared advice
    output:
      type: complete_endring_challenge solution
      distribution: any valid saturated evaluable basis
    quantifiers: desired_solver.quantifiers
    challenge_embedding: "fails at XV2-R0 before the attacker call"
    oracle_simulation: "also fails independently at XV2-R1"
    extraction: "no composed extractor"
    success_and_loss: "no inequality established"
    abort_probability: "undefined"
    runtime: "undefined"
    memory: "undefined"
    status: open
    earliest_gap: XV2-G0
    first_post_attacker_gap: XV2-G1

controls:
  - id: CTRL-PATH-ORACLE-QUOTIENT
    mutation: >-
      Replace the complete ring witness W by an oracle that returns exactly the
      canonical accepted path x for valid ciphertexts and the declared failure
      result otherwise.
    expected: >-
      Honest Decaps behavior is unchanged whenever it uses only x. Any proof of
      complete-ring necessity must fail unless it separately reduces this path
      oracle to complete EndRing on the exact distribution.
    observed_in_symbolic_audit: "the opening supplies no such reverse lift"
    scope: "strict witness-quotient control, not an impossibility proof"
  - id: CTRL-ONE-PATH-NOT-ONEEND
    mutation: "give the extractor one valid path between the challenge endpoint pair"
    expected: >-
      A connecting path E->E' is not an endomorphism E->E and does not answer
      the adaptive bounded-OneEnd queries required by PW24.
    observed_in_symbolic_audit: pass_control_rejected_as_complete_ring
  - id: CTRL-FINITE-TORSION
    mutation: "replace W by its action on one or finitely many declared torsion modules"
    expected: >-
      The finite action can preserve all declared ciphertext behavior without
      being an evaluable global rank-four basis unless a sourced lift is proved.
    observed_in_symbolic_audit: no_lift_supplied
  - id: CTRL-AUXILIARY-ADVICE
    mutation: "publish a path, kernel, orientation, ideal, incoming edge, torsion label or ring-correlated tag"
    expected: >-
      The datum enters the adversarial view, changes the hard-problem instance,
      and must be included in challenge simulation and costs. Publishing x or
      a directly usable recovery witness destroys recipient-only recovery.
    observed_in_symbolic_audit: rejected_as_free_advice
  - id: CTRL-MULTIPLE-PATHS
    mutation: >-
      permit two distinct nonbacktracking or dual/cycle-extended paths with the
      same endpoint and accepted binding data
    expected: >-
      Unique inversion and canonical correctness fail unless the relation
      specifies an equivalence class or a collision-resistant canonical binder.
    observed_in_symbolic_audit: "cannot be executed because Rel_path and binding are undefined"
  - id: CTRL-PUBLIC-RECOVERY
    mutation: "give the public sender the claimed path-recovery operation"
    expected: >-
      The recipient operation is not a trapdoor; a key derived only from its
      output is public and confidentiality fails.
    observed_in_symbolic_audit: pass_known_false_conclusion_rejected
  - id: CTRL-REVERSE-ARROW
    mutation: "use a complete EndRing solver to recover a path or decrypt"
    expected: >-
      This is an attack route EndRing-solver -> break-scheme, not a solver that
      uses a scheme attacker to output EndRing.
    observed_in_symbolic_audit: pass_known_false_conclusion_rejected
  - id: CTRL-LEAKED-PLAINTEXT
    mutation: "append the encapsulated key, recovered path, or DEM plaintext to the ciphertext"
    expected: >-
      The challenge becomes trivially distinguishable. Any transform argument
      that still proves confidentiality has failed its message-independence or
      challenge-simulation step.
    observed_in_symbolic_audit: pass_known_false_conclusion_rejected
  - id: CTRL-AUTH-ONLY
    mutation: "authenticate an otherwise public or leaked session value"
    expected: >-
      Authentication can prevent malleation but cannot create confidentiality
      or an EndRing extractor.
    observed_in_symbolic_audit: pass_known_false_conclusion_rejected

oracle_simulation_audit:
  public_key_and_challenge:
    status: open
    missing: [exact_key_law, exact_path_relation, exact_transform, exact_binding_law]
  decapsulation_queries:
    status: open
    required_cases:
      - valid nonchallenge ciphertexts
      - same endpoint with changed binding or DEM bytes
      - repeated and challenge-related ciphertexts
      - alternate path encodings and endpoint collisions
      - malformed, wrong-field, wrong-key and no-solution instances
    missing: >-
      A simulator without W, path advice or a decapsulation oracle, plus a proof
      that its response and failure distributions match the real game.
  random_oracles:
    status: open
    missing: >-
      Domain grammar, programmed inputs, public witness recognizer, collision
      handling, query bounds, extraction event and classical-ROM game hops.
  extraction:
    status: open
    missing: >-
      A map from an IND-CCA output bit or oracle query to canonical x, followed
      by an exact source-interface compiler and complete-ring reconstruction.
  total_abort_and_loss:
    status: open
    missing: >-
      delta_key, transform abort, path nonuniqueness/collision probability,
      decapsulation-simulation error, oracle-programming error, off-support
      source-query mass, reconstruction stopping tail and composed runtime.

reduction_verdict:
  state: scoped_inconclusive_at_first_exact_gaps
  whole_chain: >-
    No complete attacker-to-EndRing reduction is present. It stops first at
    exact public-key embedding (XV2-G0); even if that is granted, the requested
    post-attacker chain stops at the undefined IND-CCA-to-path extraction
    interface (XV2-G1).
  downstream_boundary: >-
    The retrieved HLMW and frozen PW24 sources provide conditional polynomial
    reconstruction routes only for their exact Isogeny/ell-IsogenyPath and
    adaptive bounded-OneEnd interfaces. The scheme-conditioned unique
    fixed-degree inverter has not been compiled to those interfaces.
  affected_obligations: [O1, O2, O4, O5, O6]
  unaffected_facts:
    - General source reductions remain as stated on their own problem distributions.
    - A later fully specified candidate may supply the missing embedding, transform and compiler.
    - This packet proves no universal impossibility for prescribed-path or EndRing PKE.
  exact_next_obligation: >-
    Freeze Rel_path, KeyGen, Encaps, Decaps, encodings and the classical-ROM
    transform; then construct the bare-EndRing public-key compiler and a
    distribution-preserving compiler from every sourced Isogeny/OneEnd query
    to the exact scheme inversion law, with explicit loss, abort, runtime and
    memory.
