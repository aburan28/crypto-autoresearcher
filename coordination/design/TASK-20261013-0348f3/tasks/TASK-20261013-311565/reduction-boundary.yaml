  opening: coordination/design/TASK-20261013-0348f3/opening.yaml
  handoff: ledger/handoffs/TASK-20261013-311565.yaml
  review_plan: coordination/design/TASK-20261013-0348f3/review-preparation/review-plan.yaml
  prior_composition: coordination/design/TASK-20261013-ba3742/composition/TASK-20261013-a6dbb9/final-composition.yaml
