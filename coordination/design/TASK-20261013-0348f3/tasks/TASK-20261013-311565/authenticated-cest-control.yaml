claim_boundary: >-
  This control replaces the old raw XOR payload by a canonical CEST transfer
  KEM and, optionally, a one-time IND-CCA DEM/AE composition. It closes the
  exact syntactic one-query bit-flip only under the separately named
  CEST-XFER-COMP and DEM assumptions in the classical ROM. It is not
  EigenX-v2, is not EndRing-bound, does not establish the old incomplete
  KeyGen, and cannot discharge O5 or the batch's material-difference gate.

