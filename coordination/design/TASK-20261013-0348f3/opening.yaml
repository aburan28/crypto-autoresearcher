schema: crypto.autoresearch.eigenx_v2_prescribed_path_opening.v1
opening:
  task_id: TASK-20261013-0348f3
  batch_id: BATCH-be2a37
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  opening_decision_id: DEC-20261013-d487d5
  date: '2026-10-13'
  mode: goal
  kind: bounded_zero_run_construction_or_obstruction
  selected_continuation: ENDRING-MATERIALLY-DISTINCT-RECIPIENT-MECHANISM
  candidate:
    user_name: EigenX-v2
    working_name: prescribed-degree unique-isogeny trapdoor KEM
    canonical_predecessor: CEST-PKE
    mechanism: >-
      KeyGen samples a curve E with a complete evaluable End(E) witness W.
      Encaps samples and canonically encodes one admissible nonbacktracking
      prescribed-degree isogeny path or kernel x, publishes its endpoint and
      binding data, and derives a key from x and the complete context. Decaps
      must use W to recover the unique accepted x or return one uniform implicit
      rejection result. The packet must construct these algorithms or identify
      the earliest exact obstruction.
    material_difference_gate: >-
      The recipient operation must be prescribed-path inversion tied to the
      complete ring, not EvalLine_(P,A), one endomorphism, one transfer value,
      finite torsion action, a rank-one quotient, or a renamed public path
      solver. Exactly this one candidate is in scope.
  active_security_target:
    primitive: kem_with_optional_kem_dem_pke
    game: classical IND-CCA2 in the ROM unless a stronger sourced theorem applies
    requirements:
      - complete KeyGen, Encaps, Decaps and optional Enc/Dec pseudocode
      - canonical key, path, endpoint, binding-data and ciphertext encodings
      - exact validation, ciphertext equality and challenge exclusion
      - implicit or distributionally uniform failure behavior
      - actual-key correctness with retries, exceptional cases and failure bound
      - exact transform theorem, hypotheses, random-oracle programming and loss
  endring_reduction_target:
    input: exact complete-EndRing challenge on the real KeyGen curve distribution
    use: successful attacker on the complete EigenX-v2 IND-CCA2 game
    output: complete efficiently evaluable saturated rank-four basis of End(E)
    required_steps:
      - exact challenge embedding and public-key distribution equality or bound
      - complete decapsulation-oracle and random-oracle simulation
      - extraction from attacker behavior, not from a supplied ring or path
      - explicit success loss, abort probability, runtime, memory and representations
      - correct treatment of any IsogenyPath-to-EndRing theorem and its direction
  quotient_and_auxiliary_controls:
    - replace W by a single evaluator or finite/rank-one quotient
    - expose torsion action, orientation, ideal, path, kernel or incoming-edge advice
    - give the public sender the claimed recipient path-recovery operation
    - vary complete ring witnesses while preserving accepted decapsulation behavior
    - test prescribed-degree nonuniqueness, dual/backtracking and endpoint collisions
  authenticated_cest_control:
    id: CTRL-CEST-AUTH-XFER
    purpose: >-
      Determine whether a sourced authenticated hash/KEM-DEM shell closes the
      known one-query bit-flip for the old EvalLine CEST core under a separately
      named CEST-XFER-KI or co-CDH-like assumption.
    exclusion: >-
      This control is not EigenX-v2, is not EndRing-bound, and cannot satisfy
      the batch objective, the material-difference gate, or O5.
  source_gate:
    required_primary_comparisons:
      - Seta
      - SiGamal and C-SiGamal
      - key-updatable supersingular PKE
      - LIT-SiGamal
      - Page-Wesolowski OneEnd-to-EndRing reconstruction
      - the exact KEM/CCA transform or composition theorem used
    rule: >-
      Record source revision, inspected sections and retrieved provenance. If a
      source cannot be obtained, record the retrieval routes and the comparison
      blocked; recalled or corpus metadata cannot discharge the gate.
  six_obligation_gate:
    O1: exact EndRing problem, real-key distribution and auxiliary data
    O2: executable honest algorithms, encodings, validation, failures and costs
    O3: quantified actual-key or actual-message correctness
    O4: prescribed-path recipient mechanism and complete-ring necessity
    O5: correctly directed attacker-to-complete-EndRing reduction
    O6: complete adversarial view and controls
    statuses: [open, proposed_discharge, reviewed_discharge, contradicted]
  proof_search_map:
    P0: normalize the one candidate and all nearest prior art
    P1: type TrapCurveGen and the prescribed-degree path relation
    P2: prove or refute injectivity and canonical recovery
    P3: separate public encapsulation from secret decapsulation
    P4: instantiate and audit the IND-CCA transform
    P5: embed the exact EndRing challenge and simulate every oracle
    P6: extract a complete ring and quantify loss and total cost
    P7: exercise quotient, auxiliary-data and proves-too-much controls
    P8: return construction, scoped obstruction or exact open obligation
  cost_model: >-
    Charge curve and ring generation, every failed path sample, endpoint and
    binding computation, validation, path recovery, transform/KDF/DEM work,
    key and ciphertext bits, memory, preprocessing and verification. Separate
    cold-start from genuinely reusable setup and modeled from measured costs.
  outcome_rules:
    construction: >-
      Requires independent reviewed discharges for O1--O6. Even then this batch
      records a candidate theorem scope, not deployment or parameter security.
    scoped_obstruction: >-
      Name the exact interface, distribution and failed arrow; do not generalize
      to all prescribed-path or EndRing PKE mechanisms.
    inconclusive: Preserve the missing algorithm, source or lemma and its checkable exit criterion.
  visual_deliverables:
    report: research/ssi-endring-pke/2026-10-13-eigenx-v2-prescribed-path/report.md
    editable_diagram: research/ssi-endring-pke/2026-10-13-eigenx-v2-prescribed-path/mechanism-flow.mmd
    svg: research/ssi-endring-pke/2026-10-13-eigenx-v2-prescribed-path/mechanism-flow.svg
    pdf: research/ssi-endring-pke/2026-10-13-eigenx-v2-prescribed-path/report.pdf
    inspection: research/ssi-endring-pke/2026-10-13-eigenx-v2-prescribed-path/visual-inspection.yaml
  scientific_runs: 0
  implementation_runs: 0
  automatic_success: false
  stop_rule: >-
    Exactly one candidate, two zero-run producers, one immutable producer
    snapshot, independent J1--J5 review, one composition, one report set, one
    J6 documentation review and one ledger archive. No implementation, trial,
    benchmark, parameter selection, automatic successor or security label.
