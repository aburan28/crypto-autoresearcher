  primary_source_check:
    source: >-
      De Feo et al., Seta: Supersingular Encryption from Torsion Attacks,
      ASIACRYPT 2021, HAL hal-03471926v1.
    url: https://inria.hal.science/hal-03471926v1/document
    retrieved_at_utc: '2026-10-13'
    temporary_paths:
      pdf: /tmp/eigenx-j1-seta.pdf
      text_extract: /tmp/eigenx-j1-seta.txt
    observed_sha256: e68fa5871be93bc031b5c68773b7bf1317c8033ebf917613c327aa73d6a309cd
    producer_recorded_sha256: e68fa5871be93bc031b5c68773b7bf1317c8033ebf917613c327aa73d6a309cd
    hash_matches: true
    bytes: 455052
    pages: 33
    provenance: retrieved
    inspected_scope:
      - Section 2.4, especially Theorem 2.7, the M=1 discussion, Definition 2.9, and Theorem 2.10.
      - Sections 3.1--3.4, especially Lemma 3.1 and inversion Algorithm 1.
      - Section 4.2 Algorithm 3 and Section 4.4 Algorithm 4.
    directly_supported:
      - >-
        In the M=1 case used by Algorithm 1, the source explicitly says that
        only the action of theta on E[N] is needed; theta is used to compute
        degree-N kernels through its finite torsion action.
      - >-
        Theorem 2.10 and Algorithm 3 output d,e,P,Q,theta(P),theta(Q), not a
        complete evaluable rank-four basis of End(E).
      - >-
        Algorithm 1 parses exactly that finite trapdoor, the ciphertext
        endpoint and transported torsion points, then recovers the kernel and
        message under the source's smoothness and discriminant conditions.
      - >-
        Lemma 3.1 proves injectivity of endpoint plus the images of a full
        N-torsion basis when N^2>4D; it is not an endpoint-only theorem.
    not_supported:
      - complete-ring necessity for recipient recovery
      - a finite-torsion-action-to-complete-EndRing lift
      - endpoint-only injectivity for the candidate's uninstantiated parameters
      - any security conclusion for EigenX-v2

  typed_mechanism_trace:
    KeyGen:
      producer_interface: >-
        TrapCurveGen_ER returns (pp,E,W,P_N,Q_N); deterministic
        SelectTrap(E,W,D,N) returns (theta,d,e); KeyGen retains W and z.
      J1_boundary: >-
        The generator, selector, saturation proof and their distributions are
        open, but J1 can condition on an accepted key and trace the declared
        recipient call graph without assuming those missing algorithms exist.
      cacheable_projection: >-
        At key generation, compute and retain
        q_N=(d,e,theta(P_N),theta(Q_N)); P_N,Q_N are already public in pk.
        The deterministic selector need never be invoked again.
    Encaps:
      public_inputs: [pk, uniform canonical path x]
      public_operation: >-
        PathEval follows x and emits the endpoint plus phi_x(P_N),phi_x(Q_N),
        then derives K from public context, ciphertext bytes and secret x.
      secret_dependency: none
      typing_result: >-
        The sender operation is public but does not itself invert a received
        ciphertext or compute x from its endpoint and binding data.
    Decaps:
      public_steps:
        - canonical parse and validation of pk and ciphertext
        - public reconstruction and exact-byte comparison by PathEval after x is recovered
        - random-oracle evaluation on the declared domains
      private_steps:
        - use d,e and the linear E[N] action determined by theta(P_N),theta(Q_N)
        - run the Seta M=1 kernel/path recovery procedure
        - use z only when parsing, recovery, or byte re-encryption rejects
      unused_secret_material: >-
        No later step evaluates an arbitrary basis element of W, uses W's
        multiplication table, proves saturation, or accesses a global
        evaluator after q_N has been cached.
      typing_result: >-
        The mathematical Decaps map has the factorization
        Decaps((pk,W,z),c)=Decaps_Q((pk,q_N,z),c) for every byte string c,
        conditional on the producer's deterministic SelectTrap and declared
        recovery procedure. For accepted c the z branch is unused; for every
        rejected c both forms use the same z branch.

  complete_ring_necessity:
    verdict: refuted_for_decaps_interface
    functional_factorization: established_by_call_graph_and_matching_primary_source
    quotient_type: >-
      q_N is finite torsion-action data and two integers. It is not, by its
      declared representation, a saturated rank-four Z-basis, a multiplication
      table, or an evaluator for arbitrary endomorphisms on arbitrary points.
    strictness_precision: >-
      The review establishes a proper functionality quotient: Decaps consumes
      q_N rather than W. It does not establish an information-theoretic or
      computational separation between q_N and End(E), because no theorem here
      proves that q_N cannot be lifted to W. That missing lift belongs to O5;
      it cannot restore the opening's claim that Decaps itself requires W.
    key_generation_boundary: >-
      The producer's original accepted-key procedure may use W to derive q_N,
      but W can then be erased without changing any mathematical Decaps result.
      Moreover, Seta's sourced generator outputs the finite trapdoor directly.
      Equality between Seta's generated public-key law and the candidate's
      unavailable TrapCurveGen_ER law is not claimed.
    basis_variation_control: >-
      Because SelectTrap is required to depend on the semantic ring rather than
      a basis accident, replacing one valid rank-four basis representation by
      another representation of the same End(E) preserves q_N and all Decaps
      behavior. This shows representation non-identifiability, not two different
      endomorphism rings on the same public curve.
    effect_on_material_difference_gate: >-
      The exact candidate falls into the opening's excluded finite-torsion-
      action recipient mechanism. Resolving sampler or encoding gaps would not
      make the full ring necessary for this Decaps algorithm.

  path_uniqueness_and_recovery:
    endpoint_plus_torsion_binding:
      result: conditionally_typed
      reason: >-
        Seta Lemma 3.1 rules out two distinct degree-D maps with the same
        endpoint and identical action on the full E[N] when N^2>4D. Section
        3.1 also gives the required message-to-cyclic-isogeny correspondence
        for its canonical nonbacktracking grammar. This supports only the
        source's conditions; the candidate still owes executable canonical
        model/isomorphism rules and its unavailable accepted-key interfaces.
    endpoint_only:
      result: not_injective_in_general_and_unproved_for_any_candidate_law
      counting_control: >-
        Let V be the number of canonical endpoint vertices available from a
        fixed start and let |X_D|=product_i((ell_i+1)*ell_i^(e_i-1)). Whenever
        |X_D|>V, two admitted path codes have the same endpoint by pigeonhole.
        The opening fixes no p,D relation excluding this regime. When
        |X_D|<=V, no inspected theorem supplies per-key endpoint-only
        injectivity or polynomial exact recovery.
      significance: >-
        Removing the torsion images avoids the particular public binding used
        by Seta, but also removes the inspected injectivity and recovery
        argument. It is an open replacement mechanism, not a repair.
    dual_and_backtracking:
      result: excluded_by_grammar_not_a_security_argument
      reason: >-
        An immediate isogeny/dual pair composes to scalar multiplication and
        defeats a one-code-per-cyclic-isogeny reading. The candidate and Seta
        exclude immediate backtracking. If the grammar later admits it, the
        injectivity and canonical recovery claims must be reproved.
    multiple_accepted_paths:
      result: >-
        Endpoint-only multiple paths are forced in the counting regime above.
        For the full endpoint-plus-torsion binding they are ruled out only
        conditionally by Seta Lemma 3.1 and the exact canonical path grammar;
        no broader prescribed-degree uniqueness claim is supported.

  public_operation_and_auxiliary_controls:
    public_key_only_recovery:
      result: not_supplied
      reason: >-
        The public sender can evaluate a chosen x but the frozen construction
        gives no public algorithm that inverts arbitrary binding data to x.
        This preserves a conditional secret/public functionality split under
        the separately named path/TCSSI assumption; it establishes no hardness.
    public_q_N:
      result: rejects_recipient_asymmetry
      reason: >-
        Publishing d,e,theta(P_N),theta(Q_N) lets any party run the same Seta
        kernel recovery, obtain x, and query H_K on the accepted KEM input.
    public_path_oracle:
      result: rejects_recipient_asymmetry
      reason: >-
        A public oracle returning the accepted x immediately lets any party
        compute the same K. Calling that oracle recipient-only proves too much.
    secret_path_oracle:
      result: exact_functionality_quotient_not_endring_witness
      reason: >-
        A secret total recovery oracle reproduces the algebraic role of W but
        is neither an implementation nor a complete ring. A reduction from
        that oracle to W would have to be separately proved.
    one_evaluator:
      result: sufficient_but_not_minimal
      reason: >-
        An evaluator for the selected theta is sufficient. The two images
        theta(P_N),theta(Q_N) are already enough because they determine its
        linear action on E[N].
    one_sender_path_or_kernel:
      result: insufficient_for_general_decaps_but_publicly_fatal_for_that_ciphertext
      reason: >-
        One stored sender path does not invert every possible ciphertext under
        a key. If attached to a ciphertext publicly, it exposes that x and K;
        if used as undeclared per-ciphertext advice, it changes the hard problem.
    orientation_ideal_or_incoming_edge:
      result: not_consumed_by_declared_decaps
      reason: >-
        These objects cannot be credited as complete-ring necessity. If a
        replacement uses one to derive q_N or x, it must type the construction,
        include the datum in the secret/public view as applicable, and prove
        the resulting assumption and cost.
    complete_witness_variation:
      result: accepted_behavior_invariant_at_fixed_q_N
      reason: >-
        Any W representation yielding the same deterministic q_N produces the
        same parse, recovery, re-encryption, acceptance and KEM output. The
        observable does not select a complete-basis representation.

  proves_too_much_control:
    id: PTM-J1-PUBLIC-PATH-ORACLE
    known_false_conclusion: A publicly available prescribed-path inverter is a recipient-only trapdoor.
    result: control_rejects_argument
    first_failure: >-
      Once the inverter is public, the adversary applies it to c0, recovers x,
      and evaluates the public random oracle on (Hash(pk),c0,x), so the KEM key
      is public. No EndRing fact or complete-ring witness is involved.
    implication: >-
      The valid narrow statement is that q_N can be a secret recovery trapdoor
      under a separate path-inversion assumption. It cannot be both public and
      recipient-only, and its secrecy does not turn it into a complete ring.

  obligation_effects:
    O4:
      producer_status: contradicted
      reviewed_status: contradicted
      reason: >-
        The prescribed-path mechanism is recoverable from the excluded finite
        torsion-action quotient. The complete ring is not necessary for Decaps.
    O1: not_judged_by_J1
    O2: not_judged_by_J1
    O3: not_judged_by_J1
    O5: not_judged_by_J1
    O6: not_judged_by_J1
    construction_status: not_judged_by_single_joint

  narrowest_supported_statement: >-
    For accepted keys of EigenX-v2-Path-FO-KEM as frozen, the public sender
    evaluates a selected path, while the recipient's entire mathematical
    decapsulation behavior can be implemented from the Seta finite trapdoor
    q_N plus the ordinary rejection seed z. Endpoint plus full N-torsion images
    is conditionally injective under Seta's restrictions, but endpoint-only
    recovery is not established. Therefore this exact mechanism is not a
    complete-ring-necessary recipient mechanism. Nothing here rules out a
    differently typed EndRing construction or proves that q_N cannot be used
    to compute End(E).

  open_obligations:
    - >-
      To revisit this exact binding as EndRing-based security, give a correctly
      directed, distribution-matched polynomial reduction from the finite
      trapdoor or complete scheme attacker to a saturated evaluable rank-four
      End(E) basis. This would address security typing, not make W necessary to Decaps.
    - >-
      For an endpoint-only successor, give a per-key injectivity theorem, a
      polynomial complete-ring-dependent exact recovery algorithm, canonical
      path/model rules, and a proof that no excluded smaller secret supplies
      the same recipient operation.
  recommended_next_action: >-
    Preserve the J1 break and do not label the frozen candidate EndRing-bound;
    any successor must change the recipient mechanism rather than retain the
    same Seta M=1 finite-torsion recovery path.
  procedure_deviations:
    - >-
      The handoff's suggested claimant eigenx_v2_j1 was rejected by
      goal_lanes.py because underscores are not valid bus addresses. The task
      was claimed as eigenx-v2-j1 with unchanged identity, scope and artifacts.

