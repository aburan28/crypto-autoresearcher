schema: crypto.autoresearch.independent_review.v1
review:
  id: TASK-20261013-5f8b99
  batch_id: BATCH-be2a37
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  joint: J5 -- primary-source overlap and assumption separation
  reviewer: reviewer-eigenx-j5-clean
  recorded_at: '2026-10-13'
  verdict: breaks
  verdict_scope: >-
    J5 breaks any admission of EigenX-v2-Path-FO-KEM as a materially new,
    complete-EndRing-secure construction. This is a scoped source-overlap and
    assumption-separation verdict, not a universal impossibility theorem for
    all EndRing PKE or KEM designs.

  requested_scope:
    - Normalize the candidate against Seta, SiGamal/C-SiGamal, supersingular key-updatable PKE, and LIT-SiGamal.
    - Audit Page--Wesolowski and the exact KEM/CCA transform.
    - Determine whether authenticated CEST is strictly a non-EndRing control.
    - Correct source metadata from primary sources.
    - Perform zero scientific and implementation runs.

  findings:
    - id: J5-F1-SETA-DOMINANCE
      status: verified
      finding: >-
        Seta already supplies the candidate's functional algebraic core: the
        ciphertext binds a degree-D isogeny by its endpoint and the images of a
        full N-torsion basis; Lemma 3.1 proves injectivity when N^2>4D; and
        Algorithm 1 recovers the path/kernel. Section 2.4 states that in the
        concrete M=1 case only the action of one endomorphism theta on E[N] is
        required. Algorithm 1 parses precisely (e,d,P,Q,theta(P),theta(Q)).
        Thus accepted decapsulation factors through the finite quotient
        (d,e,theta(P_N),theta(Q_N)); a saturated evaluable rank-four basis of
        End(E) is not necessary for this interface.
      consequence: >-
        The candidate adds an HHK KEM shell and an unused full-ring witness,
        but no new algebraic recipient mechanism. Removing the torsion images
        also removes the retrieved injectivity and polynomial inversion
        theorem, so endpoint-only recovery is not supplied by Seta.
      evidence:
        source: SETA21-HAL
        provenance: retrieved
        inspected: [Section 2.4, Lemma 3.1, Algorithm 1, Sections 3.4--3.5, Algorithm 3]
        sha256: e68fa5871be93bc031b5c68773b7bf1317c8033ebf917613c327aa73d6a309cd

    - id: J5-F2-ADJACENT-SCHEMES
      status: verified_with_full_text_limit
      finding: >-
        SiGamal and C-SiGamal use a commutative CSIDH-style action with
        auxiliary point data and obtain IND-CPA security under P-CSSDDH; the
        paper explicitly gives a ciphertext-malleability reason that SiGamal is
        not IND-CCA and says C-SiGamal fails for the same reason. The Eaton--Jao--
        Komlo--Mokrani work concerns SIDH/CSIDH key updates, hybrid encryption,
        and IND-CPA-U, not complete-EndRing prescribed-path inversion. The
        LIT-SiGamal landing-page abstract describes a commutative LIT diagram
        with large horizontal and low-degree vertical isogenies. LIT-SiGamal
        full-text comparison remains unavailable, so no positive non-overlap or
        theorem-level comparison is inferred from its abstract.
      consequence: >-
        These works are adjacent mechanisms under distinct assumptions; they
        neither supply nor validate the candidate's claimed EndRing binding.
        The LIT-SiGamal comparison remains source-limited rather than resolved.
      evidence:
        - source: SIGAMAL20-VOR
          provenance: retrieved
          inspected: [Sections 3.2--3.3, Sections 4.1--4.2]
          sha256: b58a63807dc95cf63f36af671444889791920908020541bd82e315067b324061
        - source: UPKE21-VOR
          provenance: retrieved
          inspected: [abstract, Sections 2 and 4--6, Appendix A]
          sha256: 66c77e4fb4c82ce4adb0620ad835f68eaebc629b6ca9c11d394a5c2344af2f52
        - source: LIT-SIGAMAL24-ABSTRACT
          provenance: retrieved
          inspected: [IACR ePrint landing-page metadata and abstract only]

    - id: J5-F3-PAGE-WESOLOWSKI
      status: verified
      finding: >-
        Proposition 8.4 says Isogeny_lambda reduces to EndRing under GRH for
        a lambda(log p)=O(log p); Theorem 8.5 gives the unconditional converse
        EndRing-to-Isogeny reduction. The Isogeny problem asks for any
        efficiently represented connecting isogeny between two supplied
        supersingular curves. Neither result returns the sender's exact
        prescribed degree-D path/kernel, proves endpoint-only injectivity, or
        embeds an IND-CCA attacker into the real EigenX-v2 key distribution.
      consequence: >-
        Page--Wesolowski supplies relevant attack/reconstruction directions but
        does not bridge OW-PCA_PathPKE to complete EndRing.
      evidence:
        source: PW24-VOR
        provenance: internal_primary_source_extract
        inspected: [Problem 8.3, Proposition 8.4, Theorem 8.5]
        source_pdf_sha256: 55c054a8b4e75041fc2aef62438ac1bd5071f34fec7dea298bafecd6a62280ff

    - id: J5-F4-HHK-TRANSFORM
      status: verified_conditional
      finding: >-
        HHK Theorem 4 is the correct selected outer transform: U with implicit
        rejection maps a delta_1-correct OW-PCA PKE with a uniform finite
        message space to a delta_1-correct IND-CCA KEM in the classical ROM.
        Honest decapsulation hashes the ciphertext and recovered message;
        invalid decapsulation hashes the ciphertext and an independent uniform
        secret message-space seed. For q_H hash queries the theorem gives
        Adv_IND-CCA(B) <= q_H/|M| + Adv_OW-PCA(A), with about the same running
        time. The candidate's canonical, domain-separated encoding and public-
        key binding are a syntactic instantiation of these hash inputs, not a
        new hardness theorem.
      consequence: >-
        The transform ends at OW-PCA_PathPKE on the exact real law. It does not
        establish that law, its correctness, or any reduction to EndRing. The
        optional KEM--DEM PKE correctly makes no security claim because no
        exact DEM composition theorem was selected for that candidate syntax.
      evidence:
        source: HHK17-VOR
        provenance: retrieved
        inspected: [Section 2.2, Section 3.2, Theorem 4]
        sha256: 5e31001a27427c1b5a5fefd2a65c9dc8e997c91d6f5b2512b114c0de508dc3e5

    - id: J5-F5-ASSUMPTION-SEPARATION
      status: breaks_endring_admission
      finding: >-
        The source-backed security chain is conditional OW-PCA_PathPKE plus HHK,
        where the base problem is a Seta/TCSSI-like path-inversion problem on
        the exact endpoint-and-torsion-action distribution. A complete End(E)
        witness is sufficient to derive the finite trap action only if the
        missing generation/selection interface exists; it is not shown
        necessary. No scheme-attacker-to-complete-ring extractor is supplied.
      consequence: >-
        OW-PCA path inversion, finite torsion action, one endomorphism, and a
        complete saturated evaluable ring basis must remain separate
        assumptions and outputs. Relabeling the first as EndRing is invalid.

    - id: J5-F6-AUTHENTICATED-CEST
      status: verified_non_endring_control
      finding: >-
        Authenticated CEST is strictly a non-EndRing control in the sense
        relevant to this batch. Its KEM claim is based on the separately named
        CEST-XFER-COMP search problem and public recognition of T=[r]A; its
        accepted behavior is unchanged when W is replaced by the line evaluator
        EvalLine_(P,A) on valid R. A complete ring is only a sufficient attack
        route to that evaluator. No transfer-solver-to-complete-ring reduction
        or complete-ring necessity result is provided.
      boundary: >-
        This verifies separation of the stated game, secret interface, and
        reduction target; it is not a formal oracle separation proving that
        CEST-XFER-COMP can never imply EndRing. Kiltz 2007 proves a different
        GHDH-based cyclic-group KEM and states the generic CCA KEM/CCA DEM
        composition; it does not prove the producer's CEST KEM. The CEST ROM
        proof remains a producer derivation outside J5's source-classification
        verdict.
      evidence:
        source: KILTZ07-VOR
        provenance: retrieved
        inspected: [Section 2, Sections 3.1--3.2, Sections 4.1--4.3, Appendix A]
        sha256: 9f4388df3d4b9a08aeb9bd96f336f3f9f8c31a53e405c8d1678f059a7f3f3b42

  proves_too_much_control:
    object: PTM-J5-CEST-RELABEL
    result: rejected_known_false_conclusion
    first_failure: >-
      The CEST security game asks the solver for one recognized transfer point
      T=[r]A and all accepted functionality factors through EvalLine_(P,A).
      Neither the game nor the reduction outputs a saturated evaluable rank-four
      basis of End(E). Therefore the inference from authenticated EvalLine CEST
      under XFER/co-CDH-like hardness to an EndRing construction fails at the
      assumption/output interface, before any EndRing conclusion.

  source_metadata_corrections:
    - producer_source_id: PW24-VOR
      producer_title: The Supersingular Isogeny Path and Endomorphism Ring Problems Are Equivalent
      corrected_citation: >-
        Aurel Page and Benjamin Wesolowski, "The Supersingular Endomorphism
        Ring and One Endomorphism Problems are Equivalent," EUROCRYPT 2024,
        LNCS 14656, pp. 388--417, DOI 10.1007/978-3-031-58751-1_14.
      verification: version-of-record text and repository source ledger agree
    - producer_source_id: UPKE21-VOR
      producer_title: Supersingular Isogeny-Based Unidirectional Proxy Re-Encryption
      corrected_citation: >-
        Edward Eaton, David Jao, Chelsea Komlo, and Youcef Mokrani, "Towards
        Post-Quantum Key-Updatable Public-Key Encryption via Supersingular
        Isogenies," SAC 2021, LNCS 13203, pp. 461--482, published 2022,
        DOI 10.1007/978-3-030-99277-4_22.
      verification: version-of-record title page, DOI, and recorded PDF hash agree
    - producer_source_id: UPKE25-EPRINT-ABSTRACT
      producer_title: Unidirectional Public-Key Encryption and KEMs
      corrected_citation: >-
        Pratima Jana and Ratna Dutta, "UPKE and UKEM Schemes from Supersingular
        Isogenies," IACR ePrint 2025/1010, 2025.
      verification: IACR ePrint landing-page metadata; PDF retrieval returned HTTP 403
    - producer_source_id: LIT-SIGAMAL24-ABSTRACT
      corrected_citation: >-
        Tomoki Moriya and Miha Stopar, "LIT-SiGamal: An efficient isogeny-based
        PKE based on a LIT diagram," IACR ePrint 2024/521, 2024; landing page
        identifies it as a minor revision of the ASIACRYPT 2025 publication.
      verification: IACR ePrint landing-page metadata and abstract only

  source_integrity:
    producer_hashes_reproduced:
      SETA21-HAL: true
      SIGAMAL20-VOR: true
      UPKE21-VOR: true
      HHK17-VOR: true
      KILTZ07-VOR: true
    full_text_unavailable:
      - source: LIT-SIGAMAL24-ABSTRACT
        result: ePrint PDF HTTP 403; Springer route returned HTML rather than an inspectable PDF
      - source: UPKE25-EPRINT-ABSTRACT
        result: ePrint PDF HTTP 403
    interpretation: >-
      Missing full text remains an explicit source limitation. It supplies no
      evidence of novelty, equivalence, non-overlap, or EndRing security.

  requirement_status:
    primary_source_overlap: verified_complete_with_stated_LIT_and_UPKE25_full_text_limits
    assumption_separation: verified_complete_for_J5
    page_wesolowski_direction: verified_complete
    hhk_transform_scope: verified_complete
    authenticated_cest_classification: verified_complete_with_no_formal_separation_claim
    source_metadata_correction: verified_complete_for_sources_named_by_the_packet
    scientific_runs: 0
    implementation_runs: 0
    experiment_runs: 0

  final_reason: >-
    Seta dominates the candidate's prescribed-path/torsion-binding core and
    exposes a strict finite-action quotient of the advertised full-ring secret.
    HHK conditionally upgrades only OW-PCA path inversion to a classical-ROM
    IND-CCA KEM, while Page--Wesolowski does not recover the exact accepted
    sender path or provide the missing attacker-to-EndRing extractor. The CEST
    repair remains correctly separated under XFER/EvalLine assumptions. Hence
    the EndRing/material-difference joint breaks.

