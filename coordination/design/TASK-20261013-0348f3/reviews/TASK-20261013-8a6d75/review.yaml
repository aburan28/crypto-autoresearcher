schema: crypto.autoresearch.independent_joint_review.v1
red_team_report:
  id: RT-20261013-8a6d75
  task_id: TASK-20261013-8a6d75
  batch_id: BATCH-be2a37
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  role: red-team
  joint: J4
  joint_name: complete adversarial view and total cost
  verdict: breaks
  claim_under_review: >-
    The prescribed-path EigenX-v2 packet supplies a complete adversarial view
    and a total cost accounting that charges public and auxiliary data, retry
    tails, preprocessing, generation, validation, recovery, symmetric work,
    bit sizes, memory, conversion and verification, and that survives the
    identical-public-data and free-auxiliary controls.

  scope:
    owned_joint_only: true
    whole_claim_verdict: none
    reviewed_candidate: EigenX-v2-Path-FO-KEM
    optional_control: CTRL-CEST-AUTH-XFER
    model: single-user single-challenge classical ROM
    exclusions_not_promoted_to_findings:
      - quantum and QROM security
      - multi-user and multi-challenge security
      - side-channel, fault and malicious-setup security
      - concrete parameter security and deployment readiness

  execution:
    scientific_runs: 0
    implementation_runs: 0
    formalizer_runs: 0
    benchmark_runs: 0
    parameter_selection_runs: 0
    measurements: none
    activity: read-only symbolic and artifact audit
    evidence_label: modeled_symbolic_only

  snapshot_integrity:
    receipt: coordination/design/TASK-20261013-0348f3/archives/TASK-20261013-1dd311/snapshot-receipt.json
    binding_mode: content_first
    producer_task_ids: [TASK-20261013-613c4e, TASK-20261013-311565]
    checked_paths: 9
    checked_scope: >-
      The opening, frozen review plan, six producer artifacts and round
      methodology were hashed individually against the receipt.
    all_checked_hashes_match: true
    receipt_claim_boundary_preserved: true

  verdict_basis: >-
    The producer correctly says that there are no measurements and that the
    cost and adversarial-view verdicts remain open. Its accounting is a useful
    category-complete symbolic checklist, but it is not a complete total cost
    for the frozen candidate: the real KeyGen distribution, ring generation
    and saturation, SelectTrap, torsion representation field, uniform-path
    sampling tail, recovery, validation schedule, bounded malformed-input
    grammar, operation counts, exact bit lengths, peak memory and failure
    probabilities remain unavailable. The mathematical black-box view is also
    only conditional because the public-key law and failure distributions are
    not defined. Thus J4 is not discharged. This break does not convert an
    unknown cost into an impossibility or claim an implementation weakness.

  adversarial_view_audit:
    overall_state: incomplete_real_law_view
    category_inventory_state: substantially_complete_symbolic_inventory
    public_parameters:
      included:
        - security parameter, p, the F_(p^2) representation and curve/model grammar
        - D and N, their factorizations, path length/order and the set X_D
        - canonical field, curve, point, tuple and ciphertext encodings
        - H_K, domain separators, version identifiers and validation algorithms
        - public torsion bases, pairings, tables or certificates if the algorithms use them
      unresolved:
        - exact parameter-generation and validation algorithms and their costs
        - field of definition and representation degree for the full N-torsion
        - exceptional-model rules for j=0 and j=1728
        - exact serialized sizes of factors, tables, certificates and algorithm identifiers
    public_key:
      included:
        - canonical E, P_N and Q_N and the complete validation interface
        - the exact output law of every KeyGen retry and rejection
        - any public path, kernel, orientation, ideal, incoming edge, torsion action or ring-correlated tag
      unresolved:
        - TrapCurveGen_ER and therefore the actual public-key distribution
        - rationality, full-basis generation and exact-order/independence verification for E[N]
        - whether generator advice is erased, retained, or reflected in the public distribution
    challenge_and_public_auxiliary_data:
      included:
        - exact challenge bytes, endpoint E_x and both transported N-torsion images
        - public-key digest, framing, degree family and all binding bytes
        - exact-byte challenge exclusion rather than endpoint equivalence
        - optional DEM nonce, ciphertext, tag and associated data if the unclaimed PKE is later used
      unresolved:
        - exact field/point byte lengths and the torsion-extension multiplier
        - exact collision/equivalence law for paths, kernels and exceptional isomorphisms
    oracle_view:
      included:
        - adaptive classical H_K queries and responses
        - adaptive Decaps queries before and after challenge except the exact challenge bytes
        - repeated, related, same-endpoint, changed-binding, alternate-encoding, wrong-key and malformed queries
        - cross-correlation between the H_K and Decaps transcripts
        - repeated invalid-ciphertext outputs correlated through the one retained rejection seed z
      unresolved:
        - the exact H_K input grammar for every malformed byte string
        - a maximum ciphertext/query length or an explicit cost parameter for adversarial input length
        - the exact simulation and storage cost per full query string
    failure_observables:
      mathematical_interface: >-
        Every Decaps call returns kappa bits, with invalid cases assigned
        H_K(context,c_bytes,z); the same invalid bytes must repeat the same
        value under one key and random-oracle transcript.
      required_cases_accounted_symbolically:
        - malformed and noncanonical bytes
        - off-curve, wrong-field, infinity, wrong-order or dependent torsion points
        - wrong key/context, path ambiguity, failed recovery and failed byte re-encryption
        - same endpoint with changed nonendpoint bytes and exact replay
      unresolved:
        - per-case validation order and distribution
        - accepted-versus-rejected timing, memory-access, allocation and fault behavior
        - parser denial-of-service and resource use as a function of input length
        - unconditional honest failure and setup/retry probabilities
      interpretation: >-
        The formal black-box exclusion of side channels is explicit and is not
        itself a contradiction. It prevents the artifact from being a complete
        implementation adversarial view.
    repeated_and_multi_instance_view:
      included_symbolically:
        - repeated encapsulations and path/binding collisions under one key
        - multiple keys under any reusable global setup
        - cross-key substitution, replay and state reset
      unresolved:
        - multi-user theorem and collision bounds
        - whether any curve, ring, orientation, ideal or torsion preprocessing is genuinely reusable

  total_cost_audit:
    status: not_established
    accounting_interval: >-
      Cold setup and one complete KeyGen, Encaps, Decaps and verification must
      be reported separately from a fixed-key N-ciphertext workload and an
      independent-N-key workload.
    measured_quantities: []
    modeled_quantities:
      - component: public parameter generation and validation
        required_charge: >-
          p/field selection, factorizations, curve grammar, torsion and pairing
          setup, certificates, canonicalizer tables and serialization metadata.
        packet_state: named but algorithms, units, bit sizes, memory and reuse law are open
      - component: KeyGen per attempt
        required_charge: >-
          curve sampling, complete End(E) basis generation, evaluator creation,
          multiplication/trace/norm data, saturation/equality certification,
          P_N,Q_N generation, exact-order and Weil-pairing basis checks,
          SelectTrap, public-key derivation, validation and serialization.
        packet_state: blocking unknown; TrapCurveGen_ER and SelectTrap do not exist as executable interfaces
      - component: KeyGen retry tail
        required_charge: >-
          Every failed attempt at its actual stopping point, plus a_key, N_key,
          dependence assumptions, terminal failure and the tail probability.
        packet_state: a_key, N_key and the tail law are unbounded
      - component: path and randomness sampling
        required_charge: >-
          Random-bit generation and exact uniform sampling of each coordinate
          of X_D, including integer-sampling rejection, invalid path samples,
          duplicate policy and terminal failure.
        packet_state: >-
          The candidate says exact uniform rejection sampling, while the cost
          artifact substitutes an uninstantiated generic a_path_E/N_path law;
          neither gives the sampler, random-bit cost or tail.
      - component: Encaps path evaluation
        required_charge: >-
          Every kernel and degree-ell step, construction and endpoint update,
          two point evaluations per step for P_N,Q_N, intermediate model
          normalization, explicit isomorphisms, endpoint validation, binding,
          canonical serialization and KDF work.
        packet_state: only symbolic; degree family, operation counts and weights are absent
      - component: Decaps and recovery
        required_charge: >-
          Parse/context checks, field/curve/torsion validation, SelectTrap or
          retained trap preprocessing, conversion of W to theta and its finite
          action, Seta recovery, smooth-order discrete-log subwork, path decode,
          re-encryption, byte comparison and the final H_K query.
        packet_state: >-
          Symbolically listed, but no exact operation, bit-complexity, memory,
          tail or accepted-key distribution bound is supplied.
      - component: invalid-input and recovery failures
        required_charge: >-
          Per-failure validation prefix or a padded common schedule, raw-byte
          hashing, z access, exceptional models, ambiguity/no-solution cases,
          repeat consistency and terminal behavior.
        packet_state: mathematical output is specified conditionally; schedule, cost and leakage are open
      - component: complete-ring representation conversion
        required_charge: >-
          Abstract-order-to-evaluable-map conversion, integral division,
          conductor/saturation work, evaluator tables, theta selection and
          finite-torsion evaluation, including failed conversions.
        packet_state: blocking unknown and may not be assigned zero cost
      - component: verification
        required_charge: >-
          Saturation/equality certificate, supersingularity, canonical model,
          exact torsion order and independence, recovered path/kernel,
          endpoint/binding recomputation and KDF/key agreement.
        packet_state: checks are named but algorithms and exact costs are unavailable
      - component: hashing, KDF and optional DEM
        required_charge: >-
          Every H_K call as a function of full input bits; optional AE/DEM key
          setup, AAD, nonce, encryption/decryption, tag and failure costs.
        packet_state: kappa, query-string lengths, primitive costs and message length are open
      - component: reduction overhead
        required_charge: >-
          Full lazy-oracle strings and outputs, plaintext-check records,
          challenge embedding, simulation, extraction, source-interface
          compilation, complete-ring reconstruction, conversion and verification.
        packet_state: >-
          q_H/q_D are named, but whole-string memory, losses, aborts, compiler
          costs and reconstruction tails are not bounded.
    bit_sizes:
      public_parameters: unknown
      public_key: unknown
      secret_key: unknown
      ciphertext: unknown
      path_witness_and_X_D_element: unknown
      random_oracle_state: unknown
      specific_gap: >-
        The packet counts E[N] points abstractly but does not instantiate their
        field of definition. A point encoding over F_(p^(2f)) cannot be charged
        as an F_(p^2) point without the extension degree f and conversion maps.
    memory:
      required_peak_components:
        - curve/ring generation and saturation workspace
        - complete evaluator W and any retained multiplication and precomputation tables
        - SelectTrap and finite-torsion evaluation workspace
        - path construction, recovery, recovered witness and re-encryption state
        - canonicalization/serialization buffers and H_K or DEM state
        - reduction transcript and full lazy-oracle table
      packet_state: symbolic maxima only; lifetimes, overlap, bytes and external storage are open
    cold_and_amortized:
      cold_start: correctly requires all global, per-key and one full per-ciphertext cost
      fixed_key_many_ciphertexts: >-
        Only retained key-dependent state may be divided by the ciphertext
        count; whether theta/Compress_N is stored or recomputed is unresolved.
      many_independent_keys: >-
        Secret curve/ring/orientation/ideal/trap work is per key unless a
        distribution-preserving transparent shared setup is proved.
      status: no amortized numerical or asymptotic claim is established
    comparison_baseline:
      required: >-
        Compare the W implementation and every proposed smaller witness on the
        identical pk, ciphertext, validation rules and query transcript, with
        equal preprocessing and verification work.
      packet_state: symbolic same-output comparisons exist; no implementation or measurement exists

  identical_public_data_controls:
    - id: J4-IDPD-COMPRESS-N
      public_data_held_fixed: >-
        pp, pk=(E,P_N,Q_N), c0=(E_x,phi_x(P_N),phi_x(Q_N)), canonical bytes,
        H_K interface and every Decaps query are identical.
      mutation: >-
        Replace the complete saturated evaluable W in the secret key by
        Compress_N(W)=(d,e,theta(P_N),theta(Q_N)), retaining z.
      operation_compared: accepted Decaps, including recovery, re-encryption and H_K input
      result: >-
        Conditional on the cited Seta M=1 recovery interface, every accepted
        output is identical. The finite action therefore carries a nonzero
        secret-key, generation, validation, conversion and memory cost; the
        unused remainder of W cannot be charged as necessary online work.
      evidence_kind: producer_source_grounded_conditional_argument
      measurement: none
    - id: J4-IDPD-ONE-EVALUATOR
      public_data_held_fixed: same as J4-IDPD-COMPRESS-N
      mutation: retain theta and a usable evaluator instead of an arbitrary complete basis W
      result: >-
        This is at least sufficient to derive the finite action if evaluator
        and torsion costs are paid. Its representation and conversion costs are
        unknown, so it is neither free nor evidence of a measured advantage.
      evidence_kind: conditional_symbolic
    - id: J4-IDPD-ORIENTATION-IDEAL
      public_data_held_fixed: same public key and ciphertext, if the advice is secret
      mutation: retain an orientation or ideal alleged to recover theta, its finite action, or the path
      result: >-
        Sufficiency is not established. If sufficient, advice generation,
        representation, validation, conversion, erasure and recovery must be
        charged per key; if exposed, public data is no longer identical and the
        hard-problem instance changes.
      evidence_kind: unresolved_conditional
    - id: J4-IDPD-PATH-KERNEL
      public_data_held_fixed: >-
        Impossible for public per-ciphertext path/kernel advice: adding it
        changes the ciphertext and challenge view. A hidden single stored path
        also does not implement Decaps for independently sampled ciphertexts.
      mutation: publish or retain a path, kernel or incoming-edge witness
      result: >-
        Public advice adds B_path and verification/evaluation cost and may
        expose x and hence K. Secret advice must cover the full ciphertext law
        or be modeled as a path-recovery oracle with its own representation,
        success, preprocessing, memory and query cost.
      evidence_kind: symbolic_type_and_cost_check
    - id: J4-IDPD-PUBLIC-RECOVERY
      public_data_held_fixed: original public data until the recovery interface is published
      mutation: make Compress_N(W) or an equally capable recovery interface public
      result: >-
        The adversary can perform the recipient recovery and derive the same
        accepted KEM hash input. Publication changes the public view and hard
        instance and must be counted in public-key bits and attacker work.
      evidence_kind: conditional_functional_control

  proves_too_much_control:
    id: PTM-J4-FREE-AUXILIARY
    known_false_conclusion: Path, orientation, ideal or torsion advice has zero public-view and cost effect.
    mutation: >-
      Add one of those advice objects while leaving the public/adversarial view,
      bit lengths, setup, conversion, validation, memory and recovery costs unchanged.
    required_failure_signature: >-
      The argument must stop either because exposed advice changes the instance
      and serialized view, or because hidden advice incurs generation,
      representation, preprocessing, validation, conversion, memory, erasure
      and per-query use; directly usable public recovery also destroys secrecy.
    observed_result: control_rejected_known_false_conclusion
    first_failure_location: >-
      Instance definition and serialization if advice is public; KeyGen/secret
      representation and preprocessing if retained; confidentiality if public
      advice reveals x or an equivalent recovery operation.
    survived_known_false_object: false
    producer_behavior: >-
      The producer explicitly places auxiliary advice in the public view when
      exposed and in forbidden_zero_costs when hidden. The control passes even
      though J4 breaks for missing instantiation.

  objections:
    - id: J4-F01
      severity: blocking
      title: No complete real-law total cost exists
      finding: >-
        TrapCurveGen_ER, complete-ring generation/certification, SelectTrap and
        the accepted-key retry law are unavailable, so cold-start, per-key and
        failure-weighted expected costs cannot be evaluated even asymptotically
        on the claimed distribution.
    - id: J4-F02
      severity: blocking
      title: Torsion representation and serialized sizes are uninstantiated
      finding: >-
        The field of definition for E[N], point representations, extension
        conversions, public-key/ciphertext bytes and their validation costs are
        open. Hence key, ciphertext, advice and memory sizes are unknown.
    - id: J4-F03
      severity: blocking
      title: Recovery and verification remain interfaces, not costed algorithms
      finding: >-
        Seta recovery is cited conditionally, but the candidate-law operation
        counts, smooth-order subwork, conversion from W, exceptional cases,
        re-encryption and peak workspace have no complete bound.
    - id: J4-F04
      severity: high
      title: Uniform path sampling and retry accounting do not match the frozen syntax
      finding: >-
        The candidate specifies exact uniform sampling from X_D, whereas the
        cost artifact uses an abstract accepted-path probability a_path_E.
        Random-bit sampling, integer rejections, invalid/duplicate policy and
        their tail must be derived for the actual X_D sampler.
    - id: J4-F05
      severity: high
      title: Malformed-input cost and failure observables lack an input-length law
      finding: >-
        Decaps accepts arbitrary byte strings and hashes malformed bytes in the
        rejection branch, but no maximum length or cost parameter is fixed.
        Parser, hashing, allocation and padding schedules therefore lack a
        total per-query bound and an implementation failure-view statement.
    - id: J4-F06
      severity: high
      title: Same-public-data quotient changes the honest cost baseline
      finding: >-
        Compress_N(W) conditionally reproduces accepted Decaps on identical
        public data. A fair baseline must charge the smaller retained quotient
        and its actual preprocessing rather than assume the complete W is an
        unavoidable online asset. This is a J4 accounting consequence and not
        a whole-claim or universal O4 verdict.
    - id: J4-F07
      severity: medium
      title: Hash/oracle memory is not sized by the complete strings retained
      finding: >-
        O(q_H+q_D) table entries is not a bit-memory bound. Full ciphertext and
        hash-query strings, canonical points, X_D witnesses, kappa-bit outputs,
        indexes and transcript overlap must be counted.
    - id: J4-F08
      severity: positive_control
      title: Free auxiliary advice is not silently accepted
      finding: >-
        The artifacts correctly classify exposed advice as public data that
        changes the hard instance and hidden advice as charged state. The
        assigned proves-too-much object fails at the required locations.

  required_controls:
    - Instantiate one accepted key law and report a_key, retry caps, failure mass and all rejected-attempt costs.
    - Fix the E[N] field of definition, encodings and exact public/secret/ciphertext bit formulas.
    - Give operation and peak-memory counts for W generation, saturation, SelectTrap, finite-action conversion, recovery and verification.
    - Specify exact uniform X_D sampling and its random-bit/rejection tail.
    - Bound adversarial ciphertext length and specify per-failure validation/hash schedules.
    - Compare W, theta evaluator and Compress_N(W) on identical public inputs with equal preprocessing and verification accounting.
    - Report cold start, fixed-key N-ciphertext and independent-N-key totals separately.

  counterexample_or_mutation: >-
    Keep pp, pk, all ciphertext bytes and the oracle transcript fixed and
    replace W by Compress_N(W). Under the packet's own Seta recovery premise,
    accepted Decaps outputs remain identical, but secret representation,
    generation, conversion and memory costs change. Conversely, publishing
    that quotient changes the adversarial instance and permits public recovery.
    Therefore auxiliary data cannot be cost-free or view-free, and complete-W
    cost cannot be called necessary without an additional separation result.

  baseline_comparison: >-
    No measured or concrete baseline comparison exists. The required fair
    comparison is W versus theta/evaluator versus Compress_N(W), holding the
    exact public key, ciphertexts, validation rules, query history, setup law
    and verification work fixed. Public advice is a separate changed-instance
    comparison, not the same baseline.

  heuristic_challenges: []
  cost_model_challenges:
    - exact accepted-key and path-sampling failure laws
    - torsion extension degree and representation conversions
    - retained-versus-recomputed trap preprocessing
    - failure-path parsing, padding and raw-byte hashing
    - full-string oracle-table memory
    - exact verification and erasure costs
  reduction_and_scope_challenges:
    - >-
      The symbolic complete-cost equation for a desired EndRing reduction has
      unknown embedding, simulation, extraction, source compiler,
      reconstruction, loss and tail terms; it is a requirement, not a bound.
    - >-
      The authenticated CEST control is a separate conditional classical-ROM
      transfer KEM. Its q_H/q_D pairing, parsing and table overhead is modeled
      but unmeasured and it cannot satisfy the EigenX-v2 EndRing objective.
  proof_architecture_challenges:
    - >-
      Observation-fiber: W and its strict finite quotient lie over the same
      public transcript and accepted Decaps behavior, so that transcript does
      not separate complete-ring use from finite-action use.
    - >-
      Method ceiling: a checklist of symbolic terms whose load-bearing values
      are all unknown can support only an open accounting obligation, not a
      polynomial, concrete or comparative total-cost claim.

  modeled_vs_measured:
    modeled: >-
      All operation classes, retry expressions, bit categories, memory maxima,
      cold/amortized formulas and oracle overhead in the packet are symbolic.
    measured: none
    prohibited_inference: >-
      No runtime, memory, bit size, speedup, practicality, parameter security or
      deployment claim follows from the zero-run artifacts.

  conditional_vs_complete:
    conditional: >-
      Accepted-ciphertext correctness, Seta recovery, the finite quotient and
      the classical-ROM transform are conditional on accepted keys, sourced
      theorem hypotheses and unavailable algorithms.
    complete: >-
      Only the enumeration of required accounting categories and the rejection
      of free auxiliary advice are complete within J4's symbolic audit.
    incomplete: >-
      The real-law adversarial distribution, exact failure view, total cost,
      bit sizes, memory and same-public-data measured comparison.

  narrowest_supported_statement: >-
    On the frozen zero-run packet, the producer has a substantially complete
    symbolic checklist for a single-user classical-ROM cost/view audit and
    correctly rejects zero-cost or view-free auxiliary advice. It establishes
    no instantiated total cost or complete real-key adversarial view. All
    concrete, asymptotic, implementation and comparative cost claims remain
    open, and the conclusion is limited to this prescribed-path/torsion-binding
    interface.

  next_concrete_action: >-
    Before J4 can hold, freeze executable or fully specified TrapCurveGen_ER,
    SelectTrap, X_D sampling, torsion representations, recovery, validation and
    malformed-input bounds; populate the cold/per-key/per-ciphertext operation,
    bit and memory ledger; prove retry/failure tails; then run the identical-
    public-data W/theta/Compress_N comparison under one fixed workload. Any
    measurements must be labeled separately from the symbolic model.

  artifact_paths:
    - coordination/design/TASK-20261013-0348f3/reviews/TASK-20261013-8a6d75/review.yaml

