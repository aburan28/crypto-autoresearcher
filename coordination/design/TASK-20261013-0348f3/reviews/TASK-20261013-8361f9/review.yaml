schema: crypto.autoresearch.eigenx_v2_j2_blind_review.v1
red_team_report:
  id: TASK-20261013-8361f9-J2
  task_id: TASK-20261013-8361f9
  batch_id: BATCH-be2a37
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  role: red-team
  joint: J2
  joint_statement: >-
    Exact complete-EndRing challenge embedding, full classical IND-CCA2/ROM
    simulation, and correctly directed extraction from an EigenX-v2 attacker
    to a complete efficiently evaluable saturated rank-four basis of End(E),
    with explicit loss, aborts, time, memory, and representations.
  verdict: breaks
  verdict_scope: >-
    J2 only. The allowed opening does not supply a typed reduction with the
    required direction. This is not a whole-candidate verdict and is not an
    impossibility result for every prescribed-path or EndRing-based KEM.
  requested_scope_and_execution:
    requested:
      - Type the exact complete-EndRing challenge on the real KeyGen distribution.
      - Embed that challenge as the real EigenX-v2 public key.
      - Simulate every IND-CCA2 decapsulation and random-oracle interface.
      - Extract a complete evaluable saturated rank-four End(E) basis from attacker behavior.
      - Quantify loss, aborts, runtime, memory, and representation conversions.
      - Check the direction and interface of OneEnd, Isogeny, and IsogenyPath reductions.
      - Exercise PTM-J2-REVERSE-ARROW.
    performed: >-
      Blind source-level re-derivation from the opening, the scheme-construction
      contract, and primary Page--Wesolowski/Wesolowski statements. No producer,
      sibling-review, composition, scientific-run, implementation-run, or
      parameter-selection artifact was read or executed.

  canonical_complete_endring_challenge:
    name: CompleteEndRing-KG
    security_parameter: lambda
    sampler: >-
      Run the exact real KeyGen sampler, including its public-parameter choice,
      curve-generation retries, validation, and accepted-key conditioning:
      (pk, sk, state) <- KeyGen(1^lambda; rho). Give the solver the complete
      public view pk = (p, enc(E), aux_public) and erase/withhold every secret
      component, in particular the complete-ring witness W and any implicit-
      rejection secret. Thus the challenge law is exactly the marginal
      mu_KG,lambda(pk) = Pr_rho[Pub(KeyGen(1^lambda;rho)) = pk | KeyGen accepts].
    input: >-
      The full real public key, not merely a bare curve if KeyGen discloses
      torsion data, orientations, ideals, bases, binding data, validation data,
      or other auxiliary values. The designated curve is a supersingular
      E/F_(p^2) under the actual parameter family p(lambda).
    required_output: >-
      Four descriptions D_1,...,D_4 and their declared evaluator such that each
      D_i is a polynomial-size efficient representation of an endomorphism
      alpha_i:E->E, and Z alpha_1 + ... + Z alpha_4 = End(E). Equality is exact:
      the output lattice has rank four and index one in the full geometric
      endomorphism ring. A full-rank proper suborder, an abstract maximal order,
      one non-scalar endomorphism, a path, an ideal, or a finite torsion action
      does not satisfy the predicate.
    efficient_representation: >-
      For each D_i, validity, domain/codomain, degree, and evaluation on points
      over finite extensions must be computable in time polynomial in the bit
      length of D_i, log(p), log(deg(alpha_i)), and the extension degree. The
      representations must be usable endomorphisms, not only quaternion
      coordinates with no evaluated isomorphism to End(E).
    saturation_predicate: >-
      End(E)/(sum_i Z alpha_i) is the zero group. Equivalently, the returned
      lattice is the complete maximal order attached to E, not merely a rank-
      four lattice or an order of unknown index.
    success_probability: >-
      Succ_CER^KG(B,lambda) is the probability, over the exact KeyGen marginal,
      B's coins, and any allowed oracle coins, that B returns such a basis.
    missing_instantiation_in_opening:
      - Exact p(lambda), public-parameter, curve, and complete-witness sampler.
      - Retry/acceptance distribution and whether the public curve law is uniform.
      - Complete pk and sk syntax and all public auxiliary data derived from W.
      - Efficient-representation algorithms and bit-length bounds used by KeyGen.
    finding: >-
      The challenge can be typed canonically as above, but the opening gives
      only the sentence that KeyGen samples E with W. It therefore does not
      establish equality, statistical closeness, or computational
      indistinguishability between an EndRing challenge and a real public key.

  real_keygen_public_key_law:
    required_equality_or_bound: >-
      The reduction must embed its input pk_ER verbatim as pk_A, or prove an
      explicit Delta_KG bound between the embedded and real KeyGen public views,
      including accepted-key conditioning and every public auxiliary field.
      Any resulting game hop contributes at least Delta_KG to the error term.
    status: open
    reason: >-
      TrapCurveGen, its coins, its output tuple, and its retry law are absent.
      In particular, generating a curve together with a known complete ring can
      bias the curve distribution; no uniformity claim follows merely from the
      existence of W.

  exact_target_game:
    name: classical IND-CCA2 KEM in the classical ROM
    game: >-
      (pk,sk) <- KeyGen(1^lambda); (c*,K_0) <- Encaps(pk); K_1 is uniform in
      the declared key space; b <- {0,1}; A receives (pk,c*,K_b), has classical
      adaptive access to each named random oracle and to Decaps(sk,c) both
      before and after the challenge, except for c whose canonical serialized
      byte string equals that of c*. A outputs b'. Advantage is
      |Pr[b'=b]-1/2|. Decapsulation uses the real secret in both worlds and
      malformed or invalid ciphertexts follow the scheme's exact implicit-
      rejection distribution.
    interfaces_that_must_be_fixed:
      - Names, domain separators, input encodings, output lengths, and query bounds of every random oracle.
      - Canonical pk, ciphertext, endpoint, path/kernel, binding-data, and key serialization.
      - Exact ciphertext equality and treatment of alternate encodings of the same mathematical object.
      - Decaps validation order, failure observables, implicit-rejection secret, and repeated-query behavior.
      - Key-space distribution and whether the real encapsulated key is exactly uniform or only close.
    status: open
    reason: >-
      None of KeyGen, Encaps, Decaps, the ciphertext syntax, the random-oracle
      list, query bounds, or an exact CCA transform is present in the opening.

  reduction_attempt:
    required_direction: >-
      Input a CompleteEndRing-KG challenge pk with W withheld; use a successful
      attacker A on the complete real EigenX-v2 IND-CCA2 game; output a complete
      efficiently evaluable saturated rank-four basis of End(E). In oracle-
      reduction notation this is CompleteEndRing-KG <= break-EigenX-v2.
    desired_bound: >-
      Adv_IND-CCA2(A,lambda) <= L(lambda,q_H,q_D) *
      Succ_CER^KG(B,lambda) + delta_dist + delta_sim + delta_extract, with
      polynomial L and negligible total delta for the advertised asymptotic
      implication.
    challenge_embedding:
      status: breaks
      analysis: >-
        An EndRing challenge supplies a public curve/view but no unknown
        prescribed path, kernel, or endpoint relation to embed into c*. If B
        runs the public Encaps algorithm itself, B necessarily samples and
        knows the encapsulation path/randomness and K_0; observing A or its
        random-oracle queries then reveals no new EndRing witness. If B instead
        tries to place an unknown path into c*, an additional IsogenyPath-style
        challenge is needed, but CompleteEndRing-KG does not provide one.
    random_oracle_simulation:
      status: open
      required_simulator: >-
        Maintain a consistent lazy-sampling table for each domain-separated
        oracle; identify which query, if any, contains a valid challenge path;
        specify every programmed entry and collision; and charge query guessing,
        programming, and bad-event probabilities. Classical query access alone
        does not identify the required preimage without a query-extraction
        lemma tied to the exact KDF/transform.
      gap: >-
        No oracle interface or transform theorem is selected. Even a successful
        query extractor would at most return a path/kernel witness from one
        ciphertext, not a complete ring basis.
    decapsulation_oracle_simulation:
      status: breaks
      required_simulator: >-
        Answer all non-challenge ciphertexts with a distribution identical or
        negligibly close to Decaps(W,c), including malformed encodings and
        implicit rejection, despite receiving no W. A Fujisaki--Okamoto-style
        table scan would need the exact deterministic re-encapsulation check,
        rejection secret, parsing rules, and a theorem bounding valid
        ciphertexts whose coins/path were never queried to the ROM.
      gap: >-
        None of those objects or a substitute simulation lemma is supplied.
        Calling real Decaps would require W and would make the reduction
        circular: W is part of the required EndRing output.
    extraction_from_attacker:
      status: breaks
      analysis:
        - >-
          An IND-CCA distinguisher outputs one bit. No proof forces its advantage
          to reveal a path, non-scalar endomorphism, or evaluator basis; the
          advantage could arise from parsing, rejection, collision, or binding
          behavior.
        - >-
          Recovering the one prescribed path x:E->C still yields only an
          isogeny on one KEM-generated pair. Composing it with its dual gives
          x-hat o x = [deg(x)], a scalar endomorphism, so this alone does not
          solve OneEnd.
        - >-
          A second distinct path to the same endpoint could create a non-scalar
          loop, but uniqueness is the candidate's intended property and no
          second-path algorithm or probability is given.
        - >-
          Neither Page--Wesolowski interface accepts a single key-distribution
          sample: OneEnd completion requires callable non-scalar-endomorphism
          access on arbitrary queried curves, and Isogeny completion requires
          callable isogeny access on arbitrary queried curve pairs.
        - >-
          No random-self-reduction transports A to those arbitrary inputs while
          preserving the complete public-key law, auxiliary data, CCA oracle,
          output degree bound, and success probability.
    complete_ring_completion:
      status: open
      analysis: >-
        Page--Wesolowski can turn a correctly typed bounded OneEnd oracle into
        a complete evaluable End(E) basis, including saturation by efficient
        division. The missing predecessor is a reduction from A to that oracle.
        The published theorem cannot be invoked directly on a one-shot path or
        a distinguisher bit.

  oracle_and_abort_ledger:
    aborts_requiring_explicit_probabilities:
      - Public-key distribution mismatch or KeyGen retry/validation mismatch.
      - Failure to generate a challenge ciphertext without W under the real law.
      - Guessing the wrong critical random-oracle query or programming collision.
      - A valid decapsulation query with no simulator-known preimage/path.
      - Malformed or alternate ciphertext encoding inconsistent with challenge exclusion.
      - Implicit-rejection output mismatch, collision, or repeated-query inconsistency.
      - Extracted path/kernel fails validation, degree, nonbacktracking, or uniqueness checks.
      - Endpoint collision, dual/backtracking path, or scalar-only endomorphism.
      - Extracted OneEnd value is scalar, non-evaluable, or exceeds lambda(log p).
      - Failure to lift a one-key extractor to the arbitrary-query OneEnd/Isogeny oracle interface.
    status: unquantified
    consequence: >-
      No value can be assigned to L, delta_dist, delta_sim, delta_extract, or
      the total abort probability from the allowed opening.

  cost_and_representation_accounting:
    required_runtime_form: >-
      T_B <= r_A*T_A + q_H*T_Hsim + q_D*T_Dsim + T_extract +
      T_interface_lift + T_complete + T_verify, with every repetition and
      inverse-success factor included and each term polynomial in lambda for an
      asymptotic security theorem.
    required_memory_form: >-
      M_B <= M_A + M_RO-tables + M_decapsulation-table + M_extract +
      M_complete, where the ROM tables charge all encoded queries/answers and
      completion charges its endomorphism/order bases and saturation state.
    required_representation_path:
      - Attacker transcript or extracted path/kernel.
      - Efficient isogeny/endomorphism evaluator with domain, codomain, and degree.
      - Bounded non-scalar OneEnd oracle output, if that route is used.
      - Four efficient endomorphism evaluators spanning a rank-four order.
      - Certified saturation/index one in End(E).
    observed_accounting: >-
      No q_H, q_D, r_A, output lengths, extraction probability, self-reduction
      cost, completion call count, concrete memory, or evaluator-conversion cost
      is supplied. Page--Wesolowski proves expected polynomial time for its own
      exact oracle interfaces; that qualitative bound does not instantiate this
      scheme reduction's loss or memory.
    status: open

  primary_source_direction_audit:
    - source_id: PW-2023-1399-v2
      source: >-
        Aurel Page and Benjamin Wesolowski, The Supersingular Endomorphism Ring
        and One Endomorphism Problems are Equivalent, arXiv:2309.10432v2,
        16 October 2023.
      provenance: retrieved
      retrieved_from: https://arxiv.org/pdf/2309.10432
      sha256_pdf: afa0ad19f2af4a418150648f9556cfc01c773d6d01672d526a1fc397db4541d9
      inspected_scope:
        - Definition 2.1 and Problems 2.4--2.6.
        - Algorithm 5 and Theorem 7.2.
        - Proposition 8.4 and Theorem 8.5.
      exact_interface_and_direction: >-
        Problem 2.4 EndRing outputs four efficiently represented
        endomorphisms forming a lattice basis of End(E). Theorem 7.2 is
        EndRing <= OneEnd_lambda: an oracle returning a bounded non-scalar
        endomorphism on queried supersingular curves is used to compute the
        complete ring in expected polynomial time in log(p) and lambda(log p).
        Theorem 8.5 is EndRing <= Isogeny_lambda: an oracle returning an
        efficiently represented isogeny for queried curve pairs is used to
        compute the complete ring, unconditionally. Proposition 8.4 is the
        converse Isogeny_lambda <= EndRing under GRH and therefore cannot
        replace the attacker-to-EndRing arrow.
      applicability: >-
        Useful only after a scheme attacker has been converted to the exact
        arbitrary-input OneEnd or Isogeny oracle. That conversion is absent.
    - source_id: WESO-2021-2111.01481-v1
      source: >-
        Benjamin Wesolowski, The Supersingular Isogeny Path and Endomorphism
        Ring Problems Are Equivalent, arXiv:2111.01481v1, 2 November 2021.
      provenance: retrieved
      retrieved_from: https://arxiv.org/pdf/2111.01481
      sha256_pdf: 7c6ff6f45568ec3289464ee4d790bde539951cfcfd1d3ac73a494f52a00ae4e3
      inspected_scope:
        - Problems 1.1--1.3 and efficient-representation definition.
        - Theorems 7.2 and 7.4.
        - Theorems 8.1 and 8.3.
      exact_interface_and_direction: >-
        Under GRH, an arbitrary-pair ell-IsogenyPath solver can be composed
        through MaxOrder to obtain an EndRing basis, and the converse also
        holds. The reductions preserve polynomial output-size bounds and have
        expected polynomial runtime. A solver for only the KEM-generated pair,
        or recovery of one challenge path, is not the stated oracle.
      applicability: >-
        This route additionally carries GRH and the exact fixed-ell path
        interface. Neither the arbitrary-pair lift nor GRH is supplied here.
    - source_id: WESO-2026-P13-FROZEN
      source: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      provenance: internal
      repository_commit: 3854d92bb85e37dc38eb1634c3c0a9209faf2212
      sha256: ca34a0f784351992df72458b2410ed92a137a1811d5401a24810121116c7a9cf
      inspected_scope:
        - Definition 2.1 and Problems 2.2--2.4.
        - Theorem 1.1 and Corollary 1.2.
      exact_interface_and_direction: >-
        The paper first constructs a non-scalar endomorphism, then invokes
        Page--Wesolowski Theorem 1/7.2 to obtain EndRing and Proposition 8.5
        to obtain Isogeny. This confirms the direction non-scalar-endomorphism
        solver -> complete EndRing solver; it is not a KEM security reduction.
  transform_source_gate:
    status: not_satisfied
    reason: >-
      The opening names no exact KEM/CCA transform or composition theorem.
      Consequently there is no theorem revision, hypothesis set, ROM
      programming rule, or advantage bound to inspect or instantiate.

  controls:
    - id: PTM-J2-REVERSE-ARROW
      type: proves_too_much
      object: >-
        A deliberately leaky KEM with the same EndRing-distributed public curve
        whose ciphertext serializes K in the clear (or whose KDF output is a
        public constant). Its IND-CCA confidentiality conclusion is known false
        independently of EndRing.
      tested_argument: >-
        Given a complete EndRing solver, recover W/path/decapsulation behavior
        and break the KEM; therefore EndRing hardness implies KEM security.
      outcome: argument_rejected
      failure_signature: >-
        The argument goes through unchanged for the deliberately leaky KEM:
        an EndRing solver is indeed one way to break it, while a trivial
        attacker breaks it without solving EndRing. It therefore proves too
        much and establishes only EndRing solver -> attack, not attacker ->
        complete EndRing solver.
      implication_for_J2: >-
        Every use of Isogeny <= EndRing, or of W to decrypt, is a reverse-arrow
        attack route unless accompanied by the separately proved converse
        reduction with the attacker's exact interface and distribution.
    - id: ONE-PATH-TO-ONEEND
      type: typed_interface_control
      object: A single recovered prescribed path x:E->C.
      outcome: fails_to_supply_OneEnd
      reason: >-
        x-hat o x is the scalar [deg(x)]; no second distinct path or non-scalar
        endomorphism extractor is given.
    - id: ONE-SAMPLE-TO-ORACLE
      type: quantifier_order_control
      object: One successful extraction on a real KeyGen/challenge sample.
      outcome: fails_to_supply_Page_Wesolowski_oracle
      reason: >-
        The cited completion theorems quantify over arbitrary queried curves or
        curve pairs. A one-sample average-case extractor cannot be substituted
        without a distribution-preserving self-reduction.

  objections:
    - id: J2-O1
      severity: fatal_to_joint
      statement: >-
        The real KeyGen public-key distribution is not defined, so exact
        EndRing-challenge embedding is unproved.
    - id: J2-O2
      severity: fatal_to_joint
      statement: >-
        The reduction receives no W and no CCA transform/simulation lemma, so
        it cannot answer the real decapsulation oracle without circularity.
    - id: J2-O3
      severity: fatal_to_joint
      statement: >-
        No extractor maps an IND-CCA distinguishing bit to a path or non-scalar
        endomorphism; one recovered path would still not be a complete ring.
    - id: J2-O4
      severity: fatal_to_joint
      statement: >-
        The Page--Wesolowski and IsogenyPath theorems require arbitrary-input
        solver oracles, not one KEM-generated instance, and their reverse
        directions do not prove security.
    - id: J2-O5
      severity: fatal_to_joint
      statement: >-
        No explicit loss, abort bound, time, memory, or representation chain is
        instantiated; expected-polynomial completion alone is insufficient.

  obligation_effect:
    O1_exact_hard_problem: open
    O5_correctly_directed_security_reduction: contradicted
    qualification: >-
      O5 is contradicted only for the reverse-arrow argument tested here; a new
      correctly directed reduction remains an open obligation, not an
      impossibility.

  narrowest_supported_statement: >-
    Primary sources establish that a correctly typed bounded OneEnd oracle, or
    an arbitrary-pair Isogeny oracle, can be completed to the full efficiently
    evaluable supersingular endomorphism ring in expected polynomial time under
    their stated hypotheses. The allowed EigenX-v2 opening does not construct
    either oracle from an IND-CCA2 attacker and does not instantiate a CCA/ROM
    simulation. Therefore no attacker-to-complete-EndRing theorem, advantage
    bound, or O5 discharge is established in J2 scope.

  next_concrete_action: >-
    Freeze TrapCurveGen/KeyGen, Encaps, Decaps, every encoding and ROM interface,
    and one exact CCA transform theorem. Then prove a quantitative extractor
    that, for arbitrary input curves or curve pairs with the required public-key
    law, converts A into a bounded efficient OneEnd or Isogeny oracle. State its
    success/loss, simulator aborts, degree/output bounds, runtime, and memory;
    only then compose it in the correct direction with Page--Wesolowski and
    re-run independent J2 review.

  resource_accounting:
    scientific_runs: 0
    implementation_runs: 0
    benchmarks: 0
    parameter_searches: 0
    source_retrievals_only: true

  artifact_paths:
    - coordination/design/TASK-20261013-0348f3/reviews/TASK-20261013-8361f9/review.yaml

