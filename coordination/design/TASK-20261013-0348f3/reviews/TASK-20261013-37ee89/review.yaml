  task_id: TASK-20261013-37ee89
  batch_id: BATCH-be2a37
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  role: validator
  recorded_at: '2026-10-13'
  joint:
    id: J3
    title: complete IND-CCA syntax, correctness and failure behavior
  verdict: breaks
  verdict_scope: >-
    The frozen EigenX-v2-Path-FO-KEM packet does not instantiate a complete
    IND-CCA KEM. HHK Theorem 4 supports the displayed OW-PCA-to-IND-CCA outer
    transform conditionally, but the base PathPKE is not a PPT PKE with a
    quantified correctness law: TrapCurveGen_ER, SelectTrap, canonical
    endpoint/point transport, validation, and total Dec0 recovery remain
    unavailable. The malformed and related-ciphertext rules are therefore a
    conditional interface rather than an executable complete syntax. This is
    a verdict only on J3, not on the other review joints or the whole claim.
    The separate authenticated CEST packet survives J3 as a coherent
    accepted-key, classical-ROM conditional control under CEST-XFER-COMP; it
    does not repair EigenX-v2 or supply an EndRing theorem.

  claim_under_review: >-
    Whether the frozen prescribed-path KEM supplies canonical complete
    IND-CCA2 syntax, actual-key correctness, and one defined response for
    malformed, alternate, repeated, wrong-key, and challenge-related
    ciphertexts while satisfying every hypothesis of the invoked HHK
    transform; and whether the expressly separate authenticated CEST control
    closes the old raw-XOR bit flip under its stated KEM and optional KEM-DEM
    assumptions without treating authentication as confidentiality.

  non_owned_joints_not_judged: [J1, J2, J4, J5, J6]
  execution:
    scientific_runs: 0
    implementation_runs: 0
    experiment_runs: 0
    formalizer_runs: 0
    benchmark_runs: 0
    parameter_selection_runs: 0
