  primary_source_checks:
    hhk_tcc_2017:
      local_copy: /tmp/eigenx-j3-hhk.pdf
      observed_sha256: 5e31001a27427c1b5a5fefd2a65c9dc8e997c91d6f5b2512b114c0de508dc3e5
      producer_sha256: 5e31001a27427c1b5a5fefd2a65c9dc8e997c91d6f5b2512b114c0de508dc3e5
      hash_matches: true
      inspected_scope:
        - Section 2.1 OW-PCA game and plaintext-checking oracle
        - Section 2.2 KEM syntax and IND-CCA game
        - Section 3.2 U implicit rejection and Theorem 4
      source_result: >-
        Theorem 4 states that a delta_1-correct OW-PCA PKE with finite message
        space M yields a delta_1-correct IND-CCA KEM in the classical ROM via
        U with implicit rejection, with
        Adv_IND-CCA(B) <= q_H/|M| + Adv_OW-PCA(A) and approximately equal
        running time. Valid decapsulation hashes the recovered message and
        ciphertext; invalid decapsulation hashes an independent uniform
        secret seed and the ciphertext. The theorem does not construct or
        prove OW-PCA security or PPT correctness for PathPKE.
    seta_asiacrypt_2021:
      local_copy: /tmp/eigenx-j3-seta.pdf
      observed_sha256: e68fa5871be93bc031b5c68773b7bf1317c8033ebf917613c327aa73d6a309cd
      producer_sha256: e68fa5871be93bc031b5c68773b7bf1317c8033ebf917613c327aa73d6a309cd
      hash_matches: true
      inspected_scope:
        - Sections 3.1--3.4, including Lemma 3.1 and Algorithm 1
        - Section 2.4 finite-torsion recovery boundary
        - Algorithm 3 output interface
      source_result: >-
        Lemma 3.1 supports injectivity of endpoint plus two full N-torsion
        images when N^2>4D. Algorithm 1 is stated for the paper's trapdoor
        family and recovers the message under its representability,
        discriminant, smoothness, and valid-input conditions. This does not
        supply the packet's TrapCurveGen_ER/full-evaluator law, a canonical
        byte parser, or a total expected-PPT Dec0 on arbitrary adversarial
        ciphertext bytes.
    kiltz_pkc_2007:
      local_copy: /tmp/eigenx-j3-kiltz.pdf
      observed_sha256: 9f4388df3d4b9a08aeb9bd96f336f3f9f8c31a53e405c8d1678f059a7f3f3b42
      producer_sha256: 9f4388df3d4b9a08aeb9bd96f336f3f9f8c31a53e405c8d1678f059a7f3f3b42
      hash_matches: true
      inspected_scope:
        - Section 2 KEM IND-CCA game
        - Sections 4.1--4.3 and Theorem 1
        - Appendix A reduction structure
      source_result: >-
        Section 4.3 supports the generic statement that an IND-CCA KEM with
        an appropriately IND-CCA DEM yields tightly CCA-secure hybrid
        encryption. Kiltz Theorem 1 concerns Kiltz's different GHDH KEM and
        does not prove CEST-XFER-KEM-v1. The CEST ROM recognition-table
        argument must stand as the producer's derivation and was rederived
        below.

  eigenx_path_kem_audit:
    sub_verdict: breaks_as_complete_ind_cca_construction
    security_game:
      status: conditionally_well_typed
      supported:
        - >-
          The packet states a single-user, single-challenge, classical-PPT
          IND-CCA2 KEM game in the classical ROM with half-bias advantage.
        - >-
          Only the exact challenge ciphertext bytes are excluded. Endpoint
          equivalence and related byte strings are not silently excluded.
        - >-
          H_K input binds a versioned domain, public-key context, the complete
          ciphertext bytes, and the recovered path code.
      limitations:
        - no QPT, QROM, multi-user, multi-challenge, side-channel, or concrete-security claim
        - >-
          Hash(pk), version lengths, parser limits, and the canonical
          field/curve/point grammar are named but not instantiated.

    hhk_hypothesis_matrix:
      - hypothesis: finite uniform internal message space
        finding: conditionally_satisfied
        reason: >-
          X_D is a finite product path-code set and Encaps requires exact
          uniform sampling. A sampling algorithm and bit/retry bounds are not
          instantiated, but the mathematical distribution is unambiguous.
      - hypothesis: complete PPT base PKE algorithms
        finding: breaks
        reason: >-
          TrapCurveGen_ER, full-ring evaluator generation/transport,
          semantic SelectTrap, complete validation, and total Dec0 recovery
          are unavailable. Naming them as required interfaces does not give
          HHK a PPT PKE.
      - hypothesis: delta_1 correctness on the exact real key law
        finding: breaks
        reason: >-
          Only conditional accepted-key correctness is derived. The terms
          epsilon_KG, epsilon_Select, epsilon_Recovery, and epsilon_Encoding
          have no defined events or distribution-matched bounds. If KeyGen
          fails to terminate, the correctness experiment itself has no
          output; an unbounded symbolic union is not delta_1.
      - hypothesis: OW-PCA on the exact PKE distribution
        finding: named_but_unproved
        reason: >-
          OW-PCA_PathPKE is stated on the desired auxiliary-data law but that
          law depends on the unavailable sampler. HHK may be read
          conditionally on this assumption; it does not establish it or
          relate it to EndRing.
      - hypothesis: uniform independent implicit-rejection seed
        finding: conditionally_satisfied
        reason: >-
          KeyGen samples z uniformly and independently from X_D, and both
          valid and invalid branches use the same injectively framed H_K
          domain. This remains conditional on a terminating correct KeyGen.
      - hypothesis: ciphertext equality and invalid-ciphertext behavior
        finding: specified_but_not_executable
        reason: >-
          Equality is exact raw-byte equality and the abstract API always
          returns kappa bits, but exhaustive canonical parsing, target-curve
          normalization, point transport, and total recovery are not algorithms.
      - hypothesis: theorem statement and quantitative loss
        finding: holds_conditionally
        reason: >-
          The stated q_H/|X_D| plus OW-PCA bound and delta_1 correctness match
          HHK Theorem 4 in the declared classical-ROM scope. This conditional
          arrow cannot be promoted through the broken hypotheses above.

    canonicalization_defect:
      status: breaks_complete_syntax
      finding: >-
        PathEval serializes CanCurve(E_x) together with phi_x(P_N) and
        phi_x(Q_N), but the packet supplies no canonical isomorphism from the
        computed codomain E_x to the serialized canonical model and no rule
        transporting the two image points through that isomorphism. A unique
        curve byte string alone does not put the point coordinates on that
        model. The packet also expressly leaves supersingularity/model
        validation and exceptional j=0,1728 handling to an unsupplied
        verifier/grammar. Consequently byte-for-byte re-encryption and
        challenge equality cannot yet be executed on the declared tuple.
      acceptance_criterion: >-
        Supply one total deterministic canonicalization algorithm returning
        the target model and canonical transport isomorphism; apply it to the
        endpoint and both points; specify unique encodings, length limits,
        exceptional automorphism handling, and a parser/verifier whose output
        is defined for every bounded byte string.

    honest_correctness_rederivation:
      conditional_result: holds
      exact_scope: >-
        For an already accepted valid key on which SelectTrap and Seta
        recovery terminate correctly, and for every canonical x in X_D,
        Seta injectivity plus exact recovery yields the same x; successful
        byte re-encryption then makes Encaps and Decaps query H_K on the same
        framed bytes, so the actual encapsulated key is returned.
      conditional_failure_probability: zero
      unconditional_result: not_established
      reasons:
        - no terminating expected-PPT real key sampler or retry tail
        - no SelectTrap availability or failure-mass bound
        - no total recovery theorem on the actual generated law
        - no complete canonical encoder/parser correctness theorem
        - the displayed epsilon terms are unbounded placeholders
      boundary: >-
        This accepted-key algebra is useful but does not make O3 a reviewed
        discharge and does not satisfy HHK's complete base-PKE premise.

    ciphertext_case_matrix:
      - case: honest canonical ciphertext
        abstract_response: valid H_K context with recovered x
        audit: conditionally_correct_only
      - case: malformed, truncated, trailing, off-curve, wrong-order, dependent-basis, or infinity bytes
        abstract_response: H_K(context,raw_bytes,z)
        audit: >-
          One kappa-bit mathematical response is declared. A complete parser,
          bound, and uniform implementation path are absent; timing and denial
          of service are outside the claim.
      - case: alternate encoding of the challenge object
        abstract_response: implicit-rejection key because only one encoding is accepted
        audit: >-
          The rule is correct if the missing canonical grammar exists. Until
          then, exhaustive alternate-encoding rejection is not established.
      - case: exact repeated valid ciphertext
        abstract_response: the same valid random-oracle key on every query
        audit: correct_for_a_deterministic_decapsulation_oracle
      - case: exact repeated invalid ciphertext
        abstract_response: the same H_K(context,raw_bytes,z) on every query
        audit: >-
          Correct implicit rejection is correlated by ciphertext; it is not a
          fresh independent uniform value per repeated query. The construction
          formula has the correct correlation even though the prose does not
          spell this case out.
      - case: wrong-key or changed public-key-context ciphertext
        abstract_response: implicit rejection
        audit: >-
          Conditional on an exact collision-safe or full-byte key binding and
          the missing parser. The packet does not specify the Hash(pk)
          primitive or analyze cross-key/multi-user collisions.
      - case: byte-different challenge-related ciphertext
        abstract_response: >-
          permitted query; either recover a different matching path and
          return its valid key, or take implicit rejection
        audit: >-
          This is the correct IND-CCA treatment and is covered by HHK only
          under the exact OW-PCA premise. It must not be replaced by excluding
          the whole endpoint class.
      - case: exact challenge bytes
        abstract_response: forbidden by the game
        audit: correct
      - case: recovery ambiguity, exception, or nontermination
        abstract_response: intended implicit rejection
        audit: breaks
        reason: >-
          The packet has no total recovery algorithm, exception taxonomy, or
          expected-PPT tail proving that every such input reaches that branch.

    earliest_break: >-
      Before an IND-CCA theorem can be instantiated, KeyGen0 must be a
      terminating PPT algorithm and Dec0 a total PPT function on arbitrary
      ciphertext bytes. Neither exists. The missing canonical endpoint/point
      transport is the first concrete byte-level defect inside PathEval itself.
    exact_exit_criteria:
      - implement and prove expected-PPT TrapCurveGen_ER and SelectTrap on an exact law
      - specify and prove total canonical endpoint, isomorphism, point, tuple, and parser algorithms
      - make Dec0 total and expected-PPT on every allowed adversarial input
      - prove a numeric or negligible delta_1 bound over the real correctness experiment
      - state OW-PCA_PathPKE on that identical law and retain HHK's exact classical-ROM scope

  authenticated_cest_control_audit:
    classification: separate_non_endring_control
    sub_verdict: holds_conditionally_as_a_symbolic_accepted_key_control
    direct_kem_reduction:
      result: holds
      derivation:
        - >-
          For prime q and a validated basis (P,A), write
          R=[r]P and T=[x]P+[y]A. The equations
          e_q(P,T)=e_q(R,A) and e_q(A,T)=1 force y=r and x=0, so exactly
          T=[r]A is recognized.
        - >-
          For every canonical valid nonchallenge R, the simulator may assign
          one lazy uniform ValidKey[R]. A later recognized H_K query is patched
          to that value. Repetition returns the same value, matching the real
          random oracle. Invalid ciphertext validity is publicly decidable and
          explicit rejection is simulated exactly.
        - >-
          Canonical encoding leaves no accepted byte-distinct ciphertext for
          the challenge R*. When the adversary queries H_K on a recognized
          (R*,T), the unique T is the CEST-XFER-COMP solution; every classical
          query can be tested, so no query-index guess is needed.
        - >-
          If p_real and p_random are the probabilities of one adversary output
          in the two KEM-key worlds, the half-bias definition gives
          2*Adv_KEM=|p_real-p_random|. The games agree until the recognized
          challenge query, so 2*Adv_KEM <= Pr[Ask*]=Succ_XFER and the stated
          Adv_KEM <= Succ_XFER/2 factor is correct.
      required_conditions:
        - exact accepted-key legacy CEST law and correct psi_E evaluator
        - canonical total pk, ciphertext, point, subgroup, and context parsing
        - public polynomial two-pairing recognition
        - classical PPT adversary with classical random-oracle queries
        - separately assumed hardness of CEST-XFER-COMP
      unresolved_scheme_defects:
        - legacy TrapCurveGen and CanonicalBoundedEnd remain unavailable
        - the accepted-key law and byte grammar are not executable samplers/parsers
        - explicit-rejection timing and side channels are outside scope
        - no QPT/QROM, multi-user, concrete, or EndRing theorem follows

    kem_failure_matrix:
      - case: malformed, noncanonical, wrong-context, off-curve, wrong-order, or outside-line R
        result: public explicit rejection
        simulation: exact_conditional_on_the_parser
      - case: repeated valid nonchallenge R
        result: the same H_K(pk,R,psi_E(R)) value
        simulation: the same ValidKey[R] table entry
      - case: exact challenge bytes
        result: forbidden
        simulation: no decapsulation query needed
      - case: alternate bytes for the challenge R
        result: reject because the only accepted encoding is canonical
        simulation: exact_conditional_on_the_parser
      - case: changed version or public-key digest with the same R
        result: reject before secret use or fall in a distinct domain
        simulation: exact_conditional_on_the_parser
      - case: different canonical valid R
        result: valid transfer-derived key
        simulation: independent ValidKey[R], patched on a recognized hash query

    optional_kem_dem:
      result: holds_as_a_generic_conditional_composition_not_a_complete_pke
      query_split: >-
        The first hybrid uses the KEM challenge key both for the challenge DEM
        encryption and for same-ct_K/different-ct_DEM decryption; different
        ct_K queries use the KEM decapsulation oracle. In the uniform-key
        hybrid, the DEM reduction forwards the former queries to its one-time
        decryption oracle and answers the latter with its locally generated
        KEM secret key. Exact full-pair challenge equality makes the split valid.
      bound_check: >-
        With half-bias conventions, the KEM hop costs 2*Adv_KEM and the DEM
        hop costs Adv_otIND-CCA_DEM, giving
        Adv_PKE <= 2*Adv_KEM + Adv_DEM <= Succ_XFER + Adv_DEM.
      incompleteness: >-
        No exact DEM/AE, nonce/randomness law, ciphertext grammar, message
        limits, or implementation is selected. This is a generic conditional
        construction recipe, not a complete PKE or deployment claim.

    exact_bit_flip_control:
      result: conditionally_closed
      reason: >-
        The KEM has no XOR-masked payload. In the optional hybrid, retaining
        ct_K* and modifying ct_DEM is exactly a nonchallenge one-time DEM
        decryption query; recovery of a related plaintext would break the
        stipulated one-time IND-CCA DEM. This conclusion depends on both the
        CEST-XFER-COMP confidentiality assumption and DEM confidentiality,
        not on authentication alone.

  proves_too_much_control:
    id: PTM-J3-AUTH-ONLY
    known_false_conclusion: >-
      Authentication alone supplies confidentiality or validates an
      inapplicable transform theorem.
    result: rejected
    attack: >-
      Remove CEST-XFER-COMP key secrecy and keep only a ciphertext/tag
      authenticator. A publicly known or computable session key lets the
      adversary recover the DEM plaintext even when every modified ciphertext
      is rejected. Unforgeability changes no challenge-key distribution.
    failure_signature: >-
      A valid argument must use the KEM real-or-random step under
      CEST-XFER-COMP and the one-time IND-CCA confidentiality of the DEM. The
      frozen control does so explicitly; therefore it does not prove the
      known-false authentication-only conclusion.

  obligation_effects_for_composition:
    O2: >-
      J3 breaks complete honest syntax: the KEM shell is typed but KeyGen0,
      canonicalization, validation, and total Dec0 are unavailable.
    O3: >-
      Accepted-key/per-path correctness holds conditionally; unconditional
      delta_1 correctness on a terminating exact key law is not established.
    O5_transform_only: >-
      The HHK outer arrow and its classical-ROM bound hold conditionally on
      the exact OW-PCA base PKE hypotheses. J3 makes no verdict on the separate
      EndRing reduction joint.
    O6_failure_surface: >-
      Exact byte challenge exclusion and abstract implicit rejection are
      correctly chosen, but absent byte grammars, total parser/recovery, and
      implementation observables keep the complete adversarial view open.
    authenticated_cest: >-
      The direct KEM ROM simulation and generic one-time IND-CCA DEM
      composition survive this joint only as a separate accepted-key XFER
      control. They do not satisfy the EigenX material-difference or EndRing gates.

  limitations:
    - >-
      No implementation or trial was authorized; no parser, timing path,
      parameter set, or side channel was measured.
    - >-
      This review verifies source theorem scope and symbolic games. It does
      not judge complete-ring necessity, EndRing challenge embedding, primary-
      source novelty overlap, or total cost, which belong to other joints.
    - >-
      Conditional correctness is not a security label. The legacy CEST and
      EigenX samplers remain missing even where the local algebra is correct.
    - >-
      The source PDFs were retrieved only for this read-only review and are
      recorded by hash; they are not repository artifacts.

