  id: AUDIT-ECDLP-1f1111-20261002
  hypothesis_id: H-ECDLP-1f1111
  experiment_id: EXP-ECDLP-7d2a86
  source_idea: IDEA-20260930-b26bbc
  question_id: RQ-ECDLP-f0a7b0
  recorded_at: '2026-10-02'
  recorded_by: coordinator
  zero_runs: true

  bottleneck: >-
    Whether the refuting degree of the unsatisfiable m = 2 inner S_3 object stays
    bounded (D <= 4) with rate near 1 as (n, l) grow along n = 3 l. Decision-
    changing: it is the single fact that would convert the per-attempt cost from
    2^{(m-1) l} to 2^{(m-2) l} poly(l); a negative closes the bounded-degree
    inner-theory route on this ray with a measured rung-versus-cell table.

  baseline_embedding:
    parameter_slice: >-
      The archived diagonal cells (17, 9) and (19, 10): C-BASE reproduces the
      archived W_4 record fields (iterations_to_fixpoint, dims, final_dim, one,
      one_first_iteration, dims_by_deg) and M_3 / M_4 flags on the 10 lowest-idx
      U62 and 5 lowest-idx S62 systems of RUN-CERTBIN-c417e0.
    reproduction_check: >-
      C-BASE (a) engine labels, (b) COORDINATOR ADDITION: the new inner-instance
      builder, given the archived target x_R as u, reproduces the pinned
      macaulay.descended_E equations on the 15 archived targets (the idea says the
      inner instance IS the archived object with the target replaced, so the
      builder must reproduce the archived object when the target is the archived
      one; the idea's C-BASE alone tested the engine, not the builder). C-FIX:
      2924 x 4048 at (18, 4, 17) and the idea's counts 3151 / 2517 and
      10535 / 12951 at the approved cells.
    hand_recomputation_by_coordinator: >-
      Row and column counts n C(nv, <= 2) and C(nv, <= 4) re-derived for
      (12,17) 1343/794, (14,19) 2014/1471, (16,23) 3151/2517, (20,29) 6119/6196,
      (24,35) 10535/12951, (28,41) 16687/24158, (32,47) 24863/41449, equal to the
      idea's figures. The D = 3 counts of the idea (221 rows vs 299 columns at
      (12,17)) also hold. D_reg from the series (1+z)^nv/(1+z^2)^neq: first
      non-positive coefficient at z^4 for (12,17), (16,23), (20,29); at z^5 for
      (24,35) and (28,41); at z^6 for (32,47); equal to the idea's table.
      Stage 0 is authoritative.
    status: >-
      declared_in_contract (C-FIX, C-BASE, S0-1..S0-3); no failed audit.
    note_on_29_10: >-
      At (20,29) the series gives D_reg 4 while rows 6119 < columns 6196, so plain
      M_4 cannot reach full rank; this is consistent with the idea's hedge
      '4 or 5' for the null rung at (29, 10). The cell is pre-registered, not
      authorized.

  observation_collision:
    observable: >-
      Per inner instance: exact sat flag and solution count, least refuting rung,
      first iteration containing 1, ops_to_1 and ops_to_fix, a degree-disciplined
      wdag-v1 certificate on refutation and an ann-v1 annihilator certificate on
      an adverse non-refutation.
    distinct_preimage_search: >-
      A high W_4 rate has three preimages: (i) structure of the S_3 descent, (ii)
      overdetermination (rows >= columns at degree 4, true at (23, 8)), (iii) an
      unsound instrument. (iii): Proposition S plus the PLANTED and SAT-NAT
      controls, any refutation voids the run, and every counted refutation is
      re-verified by separate-process code. (ii): the same-support null and the
      cell (35, 12) where rows < columns; a rate that tracks the null's is reading
      (ii) (EB-DR-11 blocks E-BOUNDED-PARTIAL then). (i) remains and is the only
      reading that carries an exponent. COORDINATOR ADDITIONS: (a) the flat
      (mu, k) certificate of EXP-CERTBIN-e94b27 certifies unsatisfiability but not
      W_4 membership unless max |mu| <= D - 2 (KN-FIND-5a8d3e section 3, an
      observation FIBER: the same flat observation fits instances outside W_4),
      so the contract counts W_D refutations only with wdag-v1; (b) the null's
      non-refutation, on which S_3-ABOVE-NULL leans, would be inflated by an
      engine that misses a refutation, so every counted W_4 non-refutation of the
      object and the null carries ann-v1 (or the worst-case rule); (c) the known
      structural collision of KN-FIND-c3a917, that the refutation is carried by
      the quadratic tensor's neighbourhood and is NOT S_3-specific at W_4, is
      carried into EB-DR-7's reading note.
    status: declared_in_contract

  quantifier_order: >-
    Soundness: FORALL inner instances, FORALL D, 1 in W_D implies unsatisfiable
    (exact). The idea's exponent claim: EXISTS D_0 (claimed 4) such that FORALL
    cells on the ray n = 3 l in the tested range the refuted fraction at W_{D_0}
    is >= 0.9; D_0 may not depend on the cell. This design measures two cells of
    the cell-quantifier (the dispatcher's scope) and pre-registers three more.
  quantifier_finding:
    id: QF-1
    summary: >-
      RATE IS NOT EXPONENT. The idea's own per-attempt cost is
      2^l (c_group + C_W) + (1 - r_D) 2^l 2^l c_A. The second term is
      (1 - r_D) 2^{2l} c_A, so the exponent l + O(log l) needs
      (1 - r_D) <= poly(l) 2^{-l} (a TAIL over the 2^l nodes of one attempt) or a
      bounded-degree fallback (a constant D_1 > D_0 refuting the remainder at
      polynomial cost). A constant non-refuted fraction, e.g. 0.10, leaves the
      per-attempt exponent at 2 l with a constant-factor gain. The idea words the
      requirement 'if r_D is near 1'; its E-BOUNDED threshold (rate >= 0.90 at
      60 instances) does not establish it, and H2 as worded does not state it.
    derived_by: coordinator, from the idea's cost formula; not in the idea.
    resolution_power_of_stage_1: >-
      95 percent exclusion of a non-refuted fraction 2^{-l} needs about 3 x 2^l
      zero-failure samples (rule of three; derived: 768 at l = 8, 12288 at
      l = 12; Stage 0 recomputes exactly). At 60 per cell the all-refuted CP95
      lower bound is 0.025^(1/60), about 0.9404 (derived). Stage 1 therefore
      cannot test the tail.
    disposition: >-
      Recorded as HEUR-ECDLP-1f1111-H2-TAIL and as the interpretation limit RATE
      IS NOT EXPONENT in H and EXP. No threshold of the idea is changed or
      re-read. A positive Stage-1 outcome (E-BOUNDED-PARTIAL) is NECESSARY, NOT
      SUFFICIENT, for the exponent; negative outcomes remain conclusive within the
      stated cells and certificates. A tail test and the rung distribution as a
      bounded-fallback reading are named for a later decision; not designed here.
    failed_audit: false
    note: >-
      The gap concerns the idea's exponent bookkeeping, not the validity of the
      Stage-1 measurement, which is a well-posed test of the rate-versus-cell
      quantifier. It is therefore a recorded limit and not a ground to withhold
      approval of Stages 0-1.

  method_ceiling:
    strongest_certifiable_claim: >-
      At (23,8) and (35,12) the unsatisfiable m = 2 inner objects are refuted at
      the rungs and rates stated, each counted refutation by a verified wdag-v1
      and each counted W_4 non-refutation of an object or null instance backed by
      an ann-v1 certificate or counted adversely; null rates and
      satisfiable-control counts as stated; the Stage-0 table, size law and l*
      under H2 as computed. Nothing beyond the tested cells, nothing about F4 step
      degree, nothing at n = 131, nothing about the m = 3 wrapper or any ECDLP
      cost.
    nearby_object_control: >-
      The same-support random inner system per cell (bilinear support
      U_template derived by the Coordinator from S_3: bilinear v_j w_k plus the
      linear terms and the constant; Stage 0 checks the union over the cell's
      kept instances lies inside it); the planted satisfiable instance
      (refutation must fail by theorem); the deliberately easy object (inner
      system plus l random affine relations; every rung that completes must
      refute); the random-u arm (transfer H1). NOT included, named as a candidate
      follow-up: N-CONV (S_3's exact quadratic tensor with random lower part,
      KN-FIND-c3a917), the object that would separate 'tensor neighbourhood' from
      'curve'; it is not needed for the E-BOUNDED / E-DRIFT discrimination.
    status: declared_in_contract

  instrument_and_ceiling_findings:
    - id: IF-1
      finding: >-
        The pinned closure.py allocates mask2col of 8 x 2^nv bytes: 128 MiB at
        nv = 24 (approved cells fine), 2 GiB at nv = 28 and 32 GiB at nv = 32. The
        extension cells (41,14) and (47,16) cannot run under the 3 GB cap with the
        pinned engine unchanged. Derived by the Coordinator from the module text.
      disposition: >-
        Recorded in the contract (cells.extension_memory_note) as an amendment
        matter (a derived instrument with an equivalence control), not a Stage-1
        matter; flagged to the dispatcher as an open item.
    - id: IF-2
      finding: >-
        The pinned closure.py keeps operation logs only while certificates are
        wanted and only until 1 is first seen, and exposes no ops counters;
        ops_to_1 / ops_to_fix therefore need an instrumenting subclass.
      disposition: >-
        The contract requires subclassing, forbids editing the pinned file and
        adds C-EQUIV (identical records on C-BASE and 10 object instances per
        cell).
    - id: IF-3
      finding: >-
        src/semaev_tree.py imports Sage at module level, so it cannot be the
        load-bearing builder in the pure-Python environment of the pinned engine.
      disposition: >-
        Pinned in the contract by sha256 e9f1681b4e422f7a67176fffd3e5f91ab7a95c9fddc1eb925c2bb0a93a9becef
        and git blob 2281d6368a8fe28f9b23609ad5925a39dfd4890f (computed by the
        dispatching session) as a Sage-only reference; used only for a
        secondary cross-check when Sage is available; the load-bearing builder is
        new code checked by C-BASE (b) and by the verifier's independent descent.

  proof_obligations_count: 8
  audits_applicable:
