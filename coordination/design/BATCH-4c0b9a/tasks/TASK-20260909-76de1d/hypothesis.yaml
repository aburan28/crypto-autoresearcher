schema_version: '1.0'
record_type: draft_hypothesis
id: H-ECDLP-d9b1f3
status: draft
area: ECDLP
title: Public embedding-degree calibration ladder for a transfer-gate instrument
source_idea: IDEA-20260805-cc4c2c
owner_handoff: TASK-20260909-76de1d
mechanism:
  statement: >-
    A source-bound, public-only calibration ladder can measure whether an
    embedding-degree transfer gate is correctly classified before any later
    transfer-cost comparison is considered. The ladder classifies each rung
    only from explicit public curve and subgroup parameters, verifies the
    embedding-degree predicate directly, and records forced, measured, and
    unavailable quantities in separate fields.
  scope: >-
    This is an instrument hypothesis about classification, custody, and cost
    accounting. It is not a claim that a transfer solves ECDLP on any deployed
    curve, that any named transfer applies to a selected family, or that a
    calibrated rung gives an asymptotic or concrete attack cost.
  recalled_background_unverified:
    - >-
      Recalled terms including MOV, Smart, anomalous curves, supersingular
      curves, L-functions, and curve-family characterizations are search
      pointers only. No primary source was retrieved for this draft, so none
      supplies evidence for a mechanism, a family classification, or a cost
      statement.
predictions:
  - id: P1-public-k-verification
    prediction: >-
      For every admitted rung, a verifier using only its pinned public inputs
      returns one canonical least-positive embedding degree k or a typed
      non-admission/refusal; it never accepts a producer-supplied k without
      recomputation.
    observation_boundary: >-
      Synthetic public parameter records only; this draft does not select,
      fetch, or inspect a live corpus or deployed curve.
  - id: P2-cost-label-separation
    prediction: >-
      A rung record can represent a forced cost, a measured cost, or an
      unavailable cost without treating one label as either of the others.
    observation_boundary: >-
      Static schema and synthetic controls only; no cryptanalytic benchmark,
      timing, memory measurement, or scientific sample is permitted.
  - id: P3-control-rejection
    prediction: >-
      The verifier rejects a known-false/proves-too-much control whose asserted
      k conflicts with direct public-input verification, and rejects any rung
      that turns missing cost inputs into a favorable transfer conclusion.
    observation_boundary: synthetic records only.
falsification_criteria:
  - id: F1
    condition: >-
      A source-bound implementation later accepts a synthetic rung whose
      asserted k differs from the directly verified least-positive k while all
      declared public inputs are unchanged.
    consequence: >-
      Falsifies the claimed gate soundness for the tested parser and verifier
      version only; it says nothing about transfer mathematics.
  - id: F2
    condition: >-
      A static control permits a forced, measured, or unavailable cost label
      to be silently reinterpreted as another label.
    consequence: >-
      Falsifies the tested accounting separation only.
  - id: F3
    condition: >-
      The known-false control is admitted or its rejection lacks a byte-bound
      explanation of the failing public predicate.
    consequence: >-
      Falsifies the tested proves-too-much control only.
assumptions:
  - id: A1
    statement: >-
      A later implementation can evaluate the declared finite arithmetic
      predicate exactly over the pinned public integers for synthetic records.
    status: untested
  - id: A2
    statement: >-
      A later source-retrieval task can obtain and preserve primary sources if
      any named transfer theorem or curve-family fact is needed to define a
      real-world rung.
    status: unverified
    impediment: >-
      No primary source has been retrieved or read in this design task; all
      recalled background remains unusable as support.
non_claims:
  - No deployed-attack claim.
  - No claim that MOV, Smart, or any named method applies to any curve family.
  - No claim about anomalous, supersingular, generic, or intermediate-rung prevalence.
  - No asymptotic, concrete-time, memory, or security-level result.
  - No scientific observation, implementation result, or execution result.
approval:
  approved_by: null
  implementation_authorized: false
  scientific_execution_authorized: false
  standing_authorization_reference: AGENTS.md#standing-user-authorization-for-ideas-and-experiments
source_retrieval:
  status: impeded
  exact_impediment: >-
    This task has no retrieved primary source artifact or source-reading
    receipt. Recalled method names and curve-family statements therefore have
    provenance recalled and may not support design admission, novelty, or
    applicability claims.
  clears_when: >-
    A separate source task stores primary-source identifiers, retrieval hashes,
    reading receipts, and citation provenance retrieved for each proposition
    that a future real-world rung relies on.
