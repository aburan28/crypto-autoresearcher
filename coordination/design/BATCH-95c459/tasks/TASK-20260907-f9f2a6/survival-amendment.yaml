protocol_amendment:
  experiment_id: EXP-PFDR-782085
  version: 2
  amendment_kind: additive_protocol_completion
  approved_by: coordinator
  approval_decision_id: DEC-20260907-b18b6f
  source_binding:
    path: experiments/EXP-PFDR-782085/specification.yaml
    sha256: 783f153c969e2d83b97ba913245a3f4ec04682e217e55525f48657e31be31138
    hypothesis_id: H-PFDR-232b3a
    hypothesis_sha256: 777f7759a48604ff98b071885af92b756b3242ff4641bc341284cbc6a6b41bb9
    idea_id: IDEA-20260905-e6e2e5
    packet: coordination/design/BATCH-95c459/source-packet.json
  resolution_rule: >-
    Verify the entire original specification hash, inherit every original
    field, and apply only the enumerated administrative replacements below.
    Add extensions as protocol_completion and conjoin all admission gates.
    Original tuples, formula, controls, ordering, metrics, predictions,
    scientific counts and success/falsification conditions are preserved.
    An unlisted conflict is a readiness defect, not permission to reinterpret
    the source or rewrite the historical specification.
  field_changes:
    - path: experiment.budget.wall_clock_seconds_per_run
      operation: replace_prospectively
      original_value: 1200
      effective_value: null
    - path: experiment.budget.total_cpu_hours
      operation: replace_prospectively
      original_value: 2
      effective_value: null
    - path: experiment.budget.stages[0].wall_clock_seconds
      operation: replace_prospectively
      original_value: 3600
      effective_value: null
    - path: experiment.budget.stages[1].wall_clock_seconds
      operation: replace_prospectively
      original_value: 3600
      effective_value: null
    - path: experiment.protocol_completion
      operation: add
      value_from: This amendment's extensions mapping.
  budget_interpretation: >-
    Current progress-first policy makes routine time/CPU estimates advisory.
    The historical 7200-second construction/checking estimate is not a campaign
    ceiling. Preserve six scientific groups, stages of three groups each,
    one worker and 8 GiB. The existing positive 1200-second process supervisor
    is retained separately as a runaway/cleanup checkpoint, not spending
    exhaustion; no implicit retry or changed group count follows its expiry.
  extensions:
    interfaces: coordination/design/BATCH-95c459/interfaces.md
    metric_ring: Boolean idempotent quotient over F_p; not native syzygy first-fall and not ordinary last-fall.
    canonical_targets:
      fixed_candidates:
        - {p: 13, a: 12, b: 3, xR: 11, s: 2}
        - {p: 19, a: 2, b: 15, xR: 9, s: 2}
      remaining: p in [257,263], s in [2,3,4], a=2, b=3; least x with a square RHS by exhaustive y including zero.
      order: The two fixed candidates first in listed order, then remaining targets by p,s.
      variants_in_order: [target, block_null, leading_only]
      formula: (x1-x2)^2*xR^2-2*((x1+x2)*(x1*x2+a)+2*b)*xR+(x1*x2-a)^2-4*b*(x1+x2)
      substitution: x_k=sum_i 2^i*z_(k,i); every positive digit exponent reduces to one.
      controls: Q_k=2*sum_(i<j)2^(i+j)*z_(k,i)*z_(k,j); block_null=(Q1+1)*(Q2+1); leading_only=Q1*Q2.
      admission: Prime p>3, nonsingular curve, 2^s<=p, exact reduced degree four; rational-target status recorded separately.
      failed_admission: Retain original tuple, reason and truth/rational flags where available; no replacement or rational counterexample from a nonsquare target.
    schedule:
      labeled_fixtures: 24
      scheduled_groups: 6
      group_rule: Consecutive groups of four labels in the frozen order; no rebalancing after seeing outcomes.
      stage_groups: [[1,2,3], [4,5,6]]
      maximum_runs: 6
      seed: 0
      independent_instances: 0
      alias_rule: Canonical mathematical-input hash deduplication is reporting/storage only; perform every required per-label computation/check and preserve per-label costs. Repeated inputs are not independent replications.
      degrees: Every integer D from 4 through 2*s+4, including all layers after first observed onset.
    exact_layer_algorithm:
      multiplier_basis: All n=2*s bitmasks of weight exactly D-4, ascending integer order.
      U_shape: 2^n rows indexed by all output masks, with one column per multiplier; entries are exact reduced product coefficients.
      T_shape: Select U rows of weight D; for D>n retain explicit zero rows and the same domain column count.
      arithmetic: Exact modular leftmost-pivot RREF and deterministic row operations; no floating rank.
      certificates: Reconstructed coefficients, U/T elimination and rank certificates, ker(T) basis, U images, intersection with ker(U), and independent rank-difference comparison.
      nonzero_fall_dimension: dim U(ker T), checked independently against rank(U)-rank(T).
      d_layer: Earliest scheduled D with positive nonzero fall dimension; null if none in the finite range.
      exhaustion_flag: D>2*s is top-degree exhaustion and cannot by itself be reported as structural early fall.
      truth_checks: Independent complete 2^(2*s) bit-assignment checks and exact degree-four coefficient equality for all three variants.
    prediction_preservation:
      target_onset: d_layer=4+floor(s/2), as an unverified finite prediction.
      candidate_dimension: Both fixed s=2 candidate tuples predict nonzero fall dimension 3 at D=5, compared separately with the proposed value 4.
      separate_outputs: DIM and ONSET verdicts remain separate; null behavior is fully reported and cannot be silently discarded.
      scope: A verified mismatch concerns only the precise finite prediction and admitted domain; no Wilson-universal or Semaev-asymptotic conclusion.
    proof_search_map:
      bottleneck: Distinguish genuine U-image fall dimension from kernel dimension, rank artifacts and top-degree exhaustion.
      baseline_embedding:
        parameter_slice: Every source tuple and exact target/block-null/leading-only top form, with source formula reconstructed independently.
        reproduction_check: Verify truth tables, shared top forms and independent matrix ranks before interpreting DIM or ONSET.
      observation_collision:
        observable: The same top-degree polynomial and possibly identical canonical fixture hash.
        distinct_preimage_search: Compare all labeled variants without conflating equal top form with equal full products or independent evidence.
      constructive_transforms:
        - {transform: specialization_pack, description: Retain only the shared top form, proposed_object: leading_only, predicted_gain: No assumed scientific gain; isolates lower-degree effects.}
      quantifier_order: For each fixed admitted tuple and every scheduled layer, certify the exact finite statistic; never exchange this enumeration for a statement over all curves or digit widths.
      method_ceiling:
        strongest_certifiable_claim: Exact finite layer dimensions/onsets for certified fixtures and their controls.
        nearby_object_control: D>2*s has an empty top layer; a positive image then must not be called structural early fall. Kernel vectors killed by U must not count as nonzero falls.
      proof_obligations:
        - {claim: T is the stated projection of the independently reconstructed U., responsibility: interface, owner: Independent coefficient checker.}
        - {claim: dim U(ker T)=rank(U)-rank(T), responsibility: correctness, owner: Interfaces derivation and independent rank/kernel certificates.}
        - {claim: Source tuple admission and rational flags preserve the counterexample domain., responsibility: scope, owner: Input checker and later independent review.}
      not_applicable_reason: null
    artifacts:
      run_directory: experiments/EXP-PFDR-782085/runs/<genuinely_allocated_RUN_ID>/
      root_filenames:
        - launch.json
        - terminal-receipt.json
        - manifest.yaml
        - command.txt
        - environment.json
        - stdout.log
        - stderr.log
        - input-bindings.json
        - execution-plan.json
        - fixture-index.json
        - raw-result.json
        - controls.json
        - verdicts.json
        - payload-resources.json
        - omission-receipts.jsonl
        - execution-report.yaml
        - artifact-sha256.json
      fixture_directory: fixtures/<fixed_label_01_through_24>/
      fixture_filenames: [input.json, admission.json, truth-table.jsonl, coefficient-check.json, profile.json, alias.json]
      layer_directory: fixtures/<fixed_label>/layers/D-<two_digit_D>/
      layer_filenames: [status.json, U.json, T.json, elimination-U.json, elimination-T.json, kernel-T.json, image-U-kernel-T.json, intersection-kernel.json, rank-certificate.json, rank-report.json, resources.json]
      exact_semantics: >-
        A root index lists every expected path and its completed/alias/censored/
        failed/omitted status. alias.json explicitly says null for a unique input;
        storage aliases bind identical independently computed artifact hashes and never skip per-label work. Noncompleted layers
        retain status and reason rather than fake matrices. An attempted run has
        a canonical manifest and terminal receipt when possible; abrupt kill may
        leave only launch.json, which is operationally incomplete. Hash every
        materialized artifact except artifact-sha256.json itself; archive binds
        that index. Keep all original required artifacts in addition to this list.
      omitted_group_layout: experiments/EXP-PFDR-782085/execution-plans/<actual_plan_id>/omissions/group-<01_through_06>.json
      omitted_group_rule: Only omitted groups get these receipts; bind original plan, fixed labels and exact blocking reason without fabricating a run ID or result.
    runtime:
      supervisor: tools/audit_process.py
      guide: docs/first-fall-audit-repair.md
      guide_sha256: 3b440b357d8021b7ed628fe2df7095a1bbe8301434dc40d16de6a70d9b3465b0
      seconds: 1200
      native_setup_payload_seconds: 1200
      native_cpu_limit_seconds: 1200
      native_kill_cleanup_additional_seconds: 5
      docker_setup_payload_seconds: 1190
      docker_cleanup_reserve_seconds: 10
      memory_bytes: 8589934592
      workers: 1
      backend: Must be actually selected, probed and source-bound before launch; none is asserted available now.
      requirements: All guard, early-launch receipt, immutable-container, payload telemetry and failure branches in interfaces.md bind.
      docker_artifact_transport: Chunked PFDR1 stdout protocol in interfaces.md; temporary files under /tmp, bounded verified host extraction even on failure. No writable output mount or shared supervisor modification.
    outcome_completion:
      success: Original blocking controls and decisive layers independently certified; report candidate DIM and ONSET outcomes separately.
      finite_negative: Exact independently certified mismatch refutes only that finite prediction/domain; preserve anomalous controls.
      inconclusive: Missing decisive certificates, incomplete run, resource censoring or unresolved independent disagreement; no mathematical negative inference.
      invalid: Wrong reduction, altered controls, unknown versions, inexact rank, missing undeclared certificates or disagreement between methods.
      progression: Preserve groups 1-3 then 4-6 and all original stage conditions; no unsupported interpretation of an omitted group.
    execution_admission:
      execution_authorized: false
      prior_decision: DEC-20260907-b608b8
      prior_decision_sha256: b60852c1c33cdd5d0c34e533b647d2dd8717acf63707ea4bf33419674ee7c4b5
      required_native_successor: Resolve Definition 1.3 zero-slot grading against source, freeze its successor, and actually measure native audit groups 1 and 3.
      separate_disposition: A subsequent committed Coordinator disposition must explicitly admit these panels after that measurement; this amendment does not do so.
      additional_gates: Approved implementation, archived code, independent review, portable failure-capture preflight, source/image/plan bindings, exclusive claim and genuine scientific launch lock.
  provenance:
    kind: internal
    verified_by: parent_control_plane/01a07d9c-ceb4-7892-ae01-260e4b5f0374
    access: Parent-transmitted original hashes, full panel fields, source-reading passages and runtime interface; no experiments or personal source readback by this Coordinator.
