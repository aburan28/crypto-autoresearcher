  rationale:
    - Both full original hash-bound protocols are inherited, with exact formulas, tuples, controls, predictions, ordering, degree/matrix bounds and scientific counts preserved.
    - Boolean U/T dimensions and ordinary V_F,D last-fall certificates now have deterministic, separately checkable algebra and complete failure/censoring branches.
    - Growth retains the full upper-bound mechanism, requiring same ideal, degree-compatible Groebner division, full closure and V-membership derivations; basis degree and plateaus cannot replace it.
    - Native ordinary q=3 and 5 controls use the exact Example 4.4 equations without the unrelated curve p>3 gate or added equations.
    - Portable runtime design matches the actual supervisor and Docker filesystem, with framed hash-checked stdout transport retaining partial degrees after failures.
    - Routine time/CPU estimates are advisory nulls while memory, worker, matrix/degree limits and the existing positive process checkpoint remain explicit.
    - Completing these metric definitions does not resolve native Definition 1.3 zero-slot grading or waive the subsequent actual native-measurement prerequisite.
