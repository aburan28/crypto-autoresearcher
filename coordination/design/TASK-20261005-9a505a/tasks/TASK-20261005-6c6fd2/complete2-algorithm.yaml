M1_connecting_module:
  class: representation
  pseudocode:
    - Parse O and ciphertext; verify declared certificates.
    - 'Attempt to obtain evaluated h1,...,h4 forming Hom(E,C); stop with MISSING_EVALUATED_ANCHOR because no operation from the supplied O and (C,X) has been defined.'
    - 'If such a basis were independently supplied, form norm(f)=D and f(P)=X constraints on f=sum zi*hi.'
    - Enumerate the finite norm-D candidates and select the unique compatible map, if any; output f(Q).
  exact_missing_arrow: 'evaluable End(E) plus (C,X) -> evaluated connecting Hom(E,C) anchor/basis'
  unproved_oracle: evaluated_Hom_anchor
  why_not_secret_rename: supplying the anchor is a connecting-map/Hom secret, not a basis change of source End(E)
  EndE_operations: ring multiplication/trace/norm and source evaluations only before the missing arrow
  time: 'finite candidate enumeration need not be polynomial even after anchor; coefficient ellipsoid/conditioning and bit lengths must be bounded'
  memory_and_output: evaluated anchor and candidate representations have no established polynomial bound
  failure: typed missing-arrow result; never substitute exponential fallback as polynomial success
  public_substitution: publishing the same evaluated Hom basis makes all defined remaining computations public
  correctness: uniqueness would identify the sender map, but existence/feasibility is not supplied
  heuristic_assumptions: none adopted; missing anchor is not renamed a validated heuristic
M2_transported_operator:
  class: mechanism
  pseudocode:
    - Evaluate every certified source basis alpha_i on P and Q.
    - Express those images in the public N-basis using smooth 5-power discrete logarithms; compute four 2x2 matrices M_i over Z/NZ.
    - Solve 'sum ci*M_i*(1,0)^T=(0,1)^T' by Smith/finite-ring linear algebra; choose least residues ci in [0,N).
    - 'Set alpha=sum ci*alpha_i and check alpha(P)=Q; bottom if no solution.'
    - 'Attempt to evaluate gamma=phi_s alpha dual(phi_s) on C; stop with MISSING_TARGET_TRANSPORT because phi_s and target evaluation data are not inputs.'
    - 'If that evaluated gamma were supplied, return [D^(-1) mod N]gamma(X).'
  exact_missing_arrow: 'O and one-column observation -> evaluation of phi_s alpha dual(phi_s) at X without constructing/supplying the connecting map'
  torsion_linear_algebra:
    equation_status: finite and explicit
    surjectivity: 'expected standard unramified full maximal-order action for N coprime p; not needed as an assumed completion theorem because the algorithm tests solvability'
    failure: no solution returns bottom; never assume source-action solvability proves target transport
  conditional_identity: 'dual(phi_s)(X)=[D]P, hence gamma(X)=phi_s(alpha([D]P))=[D]phi_s(Q)'
  EndE_operations: four basis-map evaluations at P,Q; finite matrix extraction; bounded integral linear combinations
  unproved_oracle: target_transport_evaluation
  extra_secret_if_supplied: connecting map/ideal, target evaluated ring with correspondence, or equivalent transported operator
  representation_charge:
    source_stage: O(log N)-bit coefficients plus four represented source maps; polynomial if supplied source evaluation bound holds
    transported_map: 'deg(gamma)=D^2*deg(alpha); expanded rational maps may be exponential; a polynomial DAG requires the unavailable connecting map'
    desired_output: one point O(log p) bits; small point output does not make obtaining gamma polynomial
  time_memory: source stage polynomial in encoded input, log N and source evaluation cost; target stage undefined
  failure: bottom for malformed/unsolvable source stage; typed missing-arrow at transport
  public_substitution: with evaluated gamma at X supplied publicly, the same inversion modulo N is public
  correctness: conditional identity is exact; no actual-message equation for an absent lift
  heuristic_assumptions: none adopted
