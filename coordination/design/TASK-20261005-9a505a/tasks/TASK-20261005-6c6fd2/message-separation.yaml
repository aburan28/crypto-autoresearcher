domains:
  message: 'm in {0,...,2^k-1}'
  randomness_P1: 'r in {0,...,2^(a-k)-1}, uniform'
  randomness_P2: independent uniform r and uniform A in SL_2(Z/NZ)
  coefficient: 's=m+2^k*r in Z/DZ, D=2^a'
  map: 'phi_s:E->E/<U+sV>, evaluated by a degree-2 chain of a steps'
  observation_P1: normalized curve and first image '(C_s,phi_s(P))'
  observation_P2: normalized curve and masked ordered pair '(C_s,(phi_s(P),phi_s(Q))*A)'
normalization:
  source: all basis changes transport slope coordinates and plaintext definition together; a new untransported source labeling is a different public key
  target: include all F-isomorphisms and residual automorphisms in compatibility
  masks: all determinant-one matrices and all valid encodings; never restrict to sender's true A
P1_fiber:
  definition: 'F1(C,X)={t: exists target isomorphism i:C_t->C with i(phi_t(P))=X}'
  restricted_parameters: 'N>4D, gcd(N,pD)=1, ord(P)=N, deg(phi_t)=D'
  proof:
    - 'Choose compatible s,t and transports i_s,i_t; set f=i_s phi_s and g=i_t phi_t in Hom(E,C).'
    - 'Then (f-g)(P)=0. If f-g is nonzero, its kernel contains the cyclic order-N subgroup <P>, hence N divides deg(f-g), and deg(f-g)>=N.'
    - 'The positive degree norm on Hom(E,C) gives deg(f-g)<=2deg(f)+2deg(g)=4D.'
    - 'N>4D rules out that nonzero map, so f=g.'
    - 'Their kernels <U+sV> and <U+tV> coincide. Comparing the U coefficient of primitive generators gives s=t modulo D.'
    - 'A target automorphism fixing X is unique because deg(u-1)<=4 and ord(X)=N>4; thus the completed Q image is unambiguous as well.'
  message_result: 'every t in F1(C_s,phi_s(P)) equals s, hence t mod 2^k=m'
  boundary: does not apply merely from N^2>4D; cannot replace N-torsion by an order-N^2 kernel
  algorithmic_result: finite public enumeration has exact actual-message correctness, but time is exponential
  quantified_enum_correctness: 'forall successful Setup,accepted pk,m,r: Dec_PublicEnum_P1(pk,Enc_P1(pk,m;r))=m'
  recipient_correctness: no fixed polynomial Complete_2 exists in this packet, so no analogous polynomial-recipient equation is asserted
P2_fiber:
  coefficient_set: 'H_C={t: C_t is F-isomorphic to C}'
  proof:
    - 'For every endpoint-compatible t and target transport i, Yt=(i phi_t(P),i phi_t(Q)) is an N-basis.'
    - 'Its pairing equals e_N(P,Q)^D because degree-D isogenies scale Weil pairing by D.'
    - The observed basis Z has that same pairing on every valid ciphertext.
    - 'The unique basis-transition B with Yt*B=Z has determinant 1 modulo N; therefore B belongs to the permitted mask group.'
    - Conversely, any compatible '(t,B,i)' has an endpoint isomorphic to C.
  equality: 'projection_t F2(C,Z)=H_C'
  necessary_and_sufficient_separation: 'forall t,tprime in H_C: t=tprime modulo 2^k'
  established_status: not proved for the frozen accepted distribution
  actual_message_condition: 'forall accepted keys,m,r,A: every t in H_(C_s) satisfies t mod 2^k=m'
  implication_if_supplied: a verified endpoint-compatible lift plus this condition yields actual-message decoding; either condition alone does not
  failure: decoder returns bottom if the full fiber has two residues
  collision_status: no universal P2 cross-message collision or separation is claimed
correctness_quantifier_order:
  - Fix public Setup, complete KeyGen law, normalization, observation and one uniform recipient routine before sampling.
  - Quantify over successful Setup and every accepted key, then every message and every permitted sender coin.
  - Only then average recipient internal coins with a uniform failure bound epsilon_lift(lambda).
  - Include KeyGen failure '(1-q)^(lambda^3)' and Setup failure separately; acceptance conditioning is not permission to omit failed keys.
failure_bookkeeping:
  honest_Encrypt: valid exact algebraic quotient definitions are total; invalid inputs return bottom
  public_P1_enum: no mathematical decoding failure on valid encryptions under the strict bound; work exponential
  hypothetical_P1_lift: epsilon_lift undefined until the missing routine is frozen
  hypothetical_P2_lift: realization failure and endpoint-residue ambiguity are separate, both unresolved
  key_generation: target exp(-lambda) only conditional on unproved q>=lambda^-2 and successful Setup
known_false_controls:
  constant_pairing: 'e_N(phi_s(P),phi_s(Q))=e_N(P,Q)^D for every s; with endpoint omitted every message collides'
  full_basis_publication: retaining both labeled images restores the audited public full-action recovery interface
  mask_publication: giving A enables public inversion; withholding A alone proves no endpoint residue separation
  true_preimage_only: returning s among a list containing other residues is not a left inverse to m
  endpoint_only: P1 degree-bound proof uses equality on P and cannot be applied after removing that point
assumptions:
  - exact point orders, models and degree certificates checked in the defined arithmetic representation
  - positive degree norm and separable prime-to-p torsion properties used in the explicit argument
  - no distributional/mixing heuristic is needed for the restricted P1 uniqueness lemma
limits:
