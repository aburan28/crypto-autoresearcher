review_plan:
  id: "REVIEW-RECIPIENT-LIFT-20261005-9a505a"
  goal_id: "GOAL-SSI-2fa82a"
  question_id: "RQ-SSI-1946c9"
  batch_id: "BATCH-6df412"
  preparation_task: "TASK-20261005-9a505a"
  preparation_archive: "TASK-20261005-3956b0"
  producer_task: "TASK-20261005-6c6fd2"
  producer_snapshot: "TASK-20261005-85b4c6"
  reviewer_tasks:
    - "TASK-20261005-c6f97b"
    - "TASK-20261005-f91bf6"
  composer_task: "TASK-20261005-c364e0"
  ledger_archive: "TASK-20261005-983fd4"
  final_decision_reserved: "DEC-20261005-262341"
  written_before_producer_dispatch: true
  claim_binding_status: "prospective_snapshot_bound"
  claim_under_review: "Test whether evaluable End(E), under a hardened admissible KeyGen law, yields a concrete uniform polynomial recipient-only Complete_2 or EndpointLift without the same public lift, with actual-message correctness and full low-k observation-fiber separation. Constructive search, not an impossibility proof; at most three mechanisms and at most one finalist."
  claim_binding_rule: "Exact scientific claim is the future verified nine-path snapshot. Validator gets only its handoff and snapshot-bound bare blind-statement; Red Team independently verifies full receipt and quotes exact claims."
  coordinator_prior: "Frozen before production: fixing short-walk enumeration may expose a difficult uniform KeyGen/saturation/distribution obligation. P1 may still lack a connecting-Hom input; P2 may still lose source-label/message information through fresh masks. Unique or complete lifts may become public under torsion/finite algebra controls. A genuine polynomial recipient-only algorithm could overturn these priors. Solver-to-decrypt alone does not close a security reduction. These are expectations, not findings or reasons to abandon constructive search."
  scientific_verdicts_inherited: false
  messages_used_as_scientific_input: false
  joints:
    -
      id: "J1"
      joint: "J1 -- Hardened KeyGen distribution, K0, bad-key failure, and public recovery bound including small-support control."
      assigned_to: "TASK-20261005-c6f97b"
      attack_plan: "From bare law, write accepted mass and inverse rejection cost, charge every ring transport/saturation/field/evaluation/output step; vary L and concentration. Reproduce L=1 four-neighbor public base-to-key path/ring transport and polynomial effective-support enumeration. Determine exact failure/event bounds and named assumptions without importing producer proof."
      breaking_artifact: "Explicit public recovery shortcut, uncharged superpolynomial KeyGen step, undefined bad-key test, missing failure bound or unproved mixing/distribution assumption."
    -
      id: "J2"
      joint: "J2 -- P1 Complete_2 typed algorithm, actual-message correctness, and blind re-derived lift/fiber quantity."
      assigned_to: "TASK-20261005-c6f97b"
      attack_plan: "Type every bare algorithm operation, remove undeclared Hom/path oracle, derive uniform time/memory/output; form full normalized observation fiber F_z and q_k(z). Exhibit m!=m' with equal recipient view or prove all compatible t share residue; true s inclusion alone fails. Run constant, public-inverse, exhaustive-search and connecting-Hom controls."
      breaking_artifact: "A missing input/step or cost, cross-message fiber q_k>=2, non-message output, exponential decoder or same public completion."
    -
      id: "J3"
      joint: "J3 -- P2 EndpointLift typed algorithm, actual-message correctness, and collision/label-transport controls."
      assigned_to: "TASK-20261005-f91bf6"
      attack_plan: "Quote snapshot P2 definition; trace endpoint-compatible lift through masks/model automorphisms to low-k actual message. Vary admissible hidden labeling with identical public state through a depth-two action; vary SL_2 mask and compatible coefficients. Seek exact quotient/cross-message collision or secret sender step."
      breaking_artifact: "Two admissible encodings/labels/masks with same public/recipient observation and different message, undefined public action, non-message output or hidden fresh-mask oracle."
    -
      id: "J4"
      joint: "J4 -- Recipient/public asymmetry, attack gates, and correctly directed reduction or separate assumption."
      assigned_to: "TASK-20261005-f91bf6"
      attack_plan: "Line-by-line erase End(E) for both interfaces and substitute public Hom/finite action; apply Robert/full-torsion N^2 boundary, finite linear algebra, fixed-rank lattice, public inverse, reencryption and weak-key support controls with exact scope/costs. Trace Q_A quotient and exact key-distribution bridge/distance/pullback. Draw solver-to-decrypt and adversary-to-EndRing as distinct oracle programs/advantage arrows."
      breaking_artifact: "Public same-message recovery, hidden connecting ideal/tau/orientation/Hom oracle or extra secret, quotient-only dependence without reverse bridge, unsupported distribution conversion or reversed security implication."
    -
      id: "J5"
      joint: "J5 -- Primary-source/nonduplication/claim-language audit including the three proposed ideas."
      assigned_to: "TASK-20261005-f91bf6"
      attack_plan: "Fresh retrieve/hash-verify relevant primary sections; normalize each candidate with SÉTA, FESTA, POKE, PIKE, SiGamal/C-SiGamal, LIT-SiGamal and all three proposed ideas. Quote exact syntax, trapdoor, masks, action, message and assumption arrows; audit claim language and source/version caveats."
      breaking_artifact: "Primary contradiction, normalized duplication, unsupported provenance/novelty/security word, or unresolved comparison clearly scoped as an impediment."
  blindness:
    mutual: true
    lifted_for: []
    rationale: "Fresh disjoint reviewer sessions read no sibling or prior reviews or messages; Validator reads no plan, source notes, producer proof or other outputs; composer sees both only after terminal receipts. Red Team may read plan/full snapshot and source locators."
  proves_too_much:
    objects:
      -
        object: "L=1 degree-3 walk from public known-ring base; four public neighbors or any polynomial effective support."
        known_false: "The key's ring/path is recipient-only solely because the sampler used a secret walk."
        expected_signature: "Public neighbor/support enumeration recovers admissible path and transports base ring; distribution is excluded or claim fails."
        assigned_to: "TASK-20261005-c6f97b"
      -
        object: "Constant/determinant observation with two distinct messages."
        known_false: "True-preimage inclusion alone gives actual-message decryption."
        expected_signature: "q_k(z)>=2, equal recipient views, no all-message left inverse."
        assigned_to: "TASK-20261005-c6f97b"
      -
        object: "Identity/full-public-inverse observation."
        known_false: "A unique publicly invertible message view provides recipient-only inversion."
        expected_signature: "Correctness/separation may hold; same message is recovered publicly."
        assigned_to: "TASK-20261005-f91bf6"
      -
        object: "Ring-free exhaustive reencryption across D=2^a for growing a."
        known_false: "An enumeration polynomial only in D is uniform polynomial in encoded security parameter."
        expected_signature: "Exponential time in a; sk unused; no surviving polynomial recipient lift."
        assigned_to: "TASK-20261005-c6f97b"
      -
        object: "Bare End(E) statement with supplied connecting-Hom basis, retained tau or orientation oracle."
        known_false: "An added recovery witness is an End(E)-only algorithm."
        expected_signature: "The missing oracle is a typed extra input/assumption, not a discharged lift step."
        assigned_to: "TASK-20261005-f91bf6"
      -
        object: "Independent fresh SL_2 full-basis mask orbit and erased labels with conflicting depth-two endpoints."
        known_false: "End(E) determines sender mask or unlabeled public state determines a composable labeled action."
        expected_signature: "Mask not determined or cross-message orbit collision; conflicting public-view fiber blocks deterministic label transport."
        assigned_to: "TASK-20261005-f91bf6"
      -
        object: "Standard EC ElGamal whose scalar secret is deterministically derived from EndRing encoding; solver-to-decrypt-only diagram."
        known_false: "Secret derivation or attack upper bound establishes novel EndRing IND security."
        expected_signature: "Wrapper still governed by ElGamal game/assumption; required adversary-to-EndRing arrow remains absent."
        assigned_to: "TASK-20261005-f91bf6"
      -
        object: "Compiler remaining on structured support with no bounded distribution distance or witness pullback."
        known_false: "Within-locus rerandomization alone identifies the PKE key distribution with plain EndRing."
        expected_signature: "Explicit support mismatch/distance/pullback gap and separately named structured assumption."
        assigned_to: "TASK-20261005-f91bf6"
    assigned_to: "TASK-20261005-f91bf6"
    failure_signature: "Any argument accepting the corresponding known-false conclusion fails its scoped control; report per-object expected and actual signatures. Validator independently runs its listed controls, Red Team owns combined controls audit under J3-J5."
  blind_rederivation:
    required: true
    quantity: "Q1: accepted KeyGen law, K0(lambda) including rejection overhead, bad-key/failure mass and scoped public enumeration cost. Q2: P1 lift relation correctness/failure/uniform complexity and q_k(z)=number of distinct low-k residues in complete recipient-observation fiber; true inclusion plus q_k=1 is required."
    parameters: "Bare future statement's lambda/p/L/walk/ideal distribution, rejection predicate, field/curve/ring representations, D,N,k, message/randomness/mask/model conventions, P1 algorithm definition and success/failure events; no proof, derivation, conclusion or source names."
    blind_from:
