  joint_reviews:
    J3:
      exact_claim_source: coordination/design/TASK-20261005-9a505a/tasks/TASK-20261005-6c6fd2/endpointlift-algorithm.yaml
      exact_quotes:
        - 'an evaluated cyclic degree-D map phi_t:E->C, with K_t=<U+tV>, compatible basis mask B in SL_2(Z/NZ), and a proved common low-k residue of the full compatible fiber'
        - 'source evaluated End(E),C -> polynomial evaluated endpoint-compatible ideal/map realization'
        - 'one endpoint-compatible coefficient t -> common residue for all endpoint-compatible coefficients'
      typed_interface:
        public_input: '(E,C,Z1,Z2,U,V,P,Q,D=2^lambda,N=5^b,k), field/model encodings and certificates'
        secret_input: 'O=End(E), exactly four integral evaluated source maps, multiplication table, rational coordinates and evaluation certificates'
        output: >-
          A domain-labelled evaluated cyclic degree-D map to the represented
          endpoint, its slope t, a compatible SL_2 mask B, and a justified
          common t mod 2^k over the complete fiber; otherwise bottom.
        actual_message: 'm=s mod 2^k, s=m+2^k r; returning an ideal, class, arbitrary slope or one true preimage is insufficient'
        forbidden_inputs: [connecting_path, connecting_ideal, evaluated_Hom_basis, orientation, retained_tau, target_ring_correspondence, sender_mask_oracle]
      step_audit:
        - step: Validate source order and endpoint/basis.
          result: Typed finite checks, conditional on charged representations and evaluation/normalization routines.
        - step: Enumerate cyclic norm-D source left ideals.
          result: >-
            Integral ideal arithmetic uses O, but the slope slice already has
            D candidates. Enumeration is finite and can be exponential in
            lambda. Rank four alone does not change this count.
        - step: Match an evaluated Deuring realization to C.
          result: >-
            No operation from the declared input implements this step. The
            pseudocode itself stops at MISSING_ENDPOINT_REALIZATION. An
            ideal-class equality or an arbitrary degree-D realization is not
            an evaluated map to this specified C.
        - step: Recover kernel slope and transition B from a supplied map.
          result: >-
            Public finite algebra once the evaluated map exists: use factored
            D and rational U,V for the kernel, and factored N and target
            N-bases for basis conversion. It does not recover the map.
        - step: Check endpoint, determinant and full-fiber residue.
          result: >-
            Individual compatibility is verifiable, but no full-fiber
            separation theorem or uniform recipient failure bound is supplied.
      independent_fiber_derivation: |
        Fix an accepted key, including its source ring and all public labels.
        Put R=Z/NZ and zeta=e_N(P,Q). Since gcd(D,N)=1, every
        Y_t=(i phi_t(P),i phi_t(Q)) for an endpoint-compatible t and
        F-isomorphism i:C_t->C is an ordered N-basis with pairing zeta^D.
        Every valid observed Z is another such basis. There is a unique
        B_t in GL_2(R) with Y_t B_t=Z, and
        e_N(Y_t B_t)=e_N(Y_t)^det(B_t) implies det(B_t)=1 mod N.
        Thus the projection to t of all compatible (t,B_t,i) is exactly
        H_C={t:C_t is F-isomorphic to C}. End(E) is fixed throughout this
        recipient-view fiber and does not remove any of its members.
        The all-message decoder condition is precisely
        q_k(C,Z)=|{t mod 2^k:t in H_C}|=1, with sender inclusion.
        If t,t' in H_C have different residues, choose their transported
        bases and the corresponding B_t,B_t'. They give the same serialized
        ciphertext and the same recipient secret with different messages.
        Hence no recipient, even one knowing End(E), can decode both.
      collision_extent: >-
        This is an exact conditional collision construction, not a exhibited
        cross-message endpoint collision for the frozen accepted key law.
        The snapshot supplies no such collision and no universal separation
        proof. The existence/frequency of collisions on that law is inconclusive.
      mask_and_sampler_audit: >-
        Source End(E) alone is independent of fresh sender A. Given an
        endpoint-compatible evaluated map, a compatible B is publicly
        computable and need not be the original A. If the original labelled
        map were uniquely known, its original A would also be computable;
        no stronger impossibility of recovering A is asserted. For the adopted
        sampler, each primitive first column has exactly N determinant-one
        complements, so the v,w0+h v procedure is exactly uniform. The
        rejected four-residue sampler has acceptance (24/25)/N and exponential
        expected attempts. The adopted sampler removes that particular defect.
      depth_two_label_control: >-
        Fix a public unlabeled graph state with the same first a-step v0->v1
        under hidden labelings L,L'. At v1 let b select non-isomorphic targets
        x under L and y under L'. A deterministic public evaluator receives
        identical input (state,a,b), so it cannot return both x and y. A
        randomized evaluator also cannot have pointwise perfect correctness
        for both. This is the erased-label known-false control, not an
        arithmetic collision certificate for an accepted key. Actual public
        Encrypt uses published U,V and evaluated slope kernels and does not
        require this hidden persistent-label API. Varying published U,V without
        transporting the message convention changes the public key and is not
        an admissible same-public-state counterexample.
      joint_result: breaks
      decisive_reason: >-
        The requested polynomial EndpointLift is absent at the specified
        endpoint-realization step, and compatibility does not discharge the
        separately missing all-fiber message condition.
      retained_statement: >-
        The exact endpoint-fiber quotient and the corrected polynomial mask
        sampler hold as mathematical definitions. No polynomial recipient lift
        or all-message P2 decoder has been established.
    J4:
      exact_claim_source: coordination/design/TASK-20261005-9a505a/tasks/TASK-20261005-6c6fd2/attack-gates.yaml
      exact_quotes:
        - 'conditional_attack_arrow: EndRingEval solver -> secret representation -> hypothetical correct polynomial lift/Decode -> IND-CPA break'
        - 'present_status: no T,no distance bound,no support-overlap bound,no pullback algorithm'
      erasure_audit:
        M1:
          source_order_use: Parse/arithmetic/norm/source evaluations before the missing evaluated Hom anchor.
          erased_EndE: >-
            Supply the same evaluated Hom basis publicly; all defined remaining
            constraints and norm-candidate computations are public. This is not
            proof that obtaining the basis or the remaining exact-norm search
            is polynomial, privately or publicly.
          extra_secret: Evaluated connecting-Hom basis, calibrated realization or connecting ideal.
        M2:
          source_order_use: >-
            Four basis actions on P,Q give four matrices M_i over Z/NZ. Smooth
            finite algebra selects coefficients c_i and tests alpha(P)=Q.
          identity: 'gamma=phi_s alpha dual(phi_s); gamma(X)=[D]phi_s(Q); Y=[D^-1 mod N]gamma(X)'
          erased_EndE: >-
            Public source action matrices reproduce the entire source stage.
            They do not evaluate gamma on C. Supply evaluated gamma at X or
            a connecting map publicly and the same inversion by D is public.
          extra_secret: >-
            A target evaluated ring without the source-to-target correspondence
            is not automatically sufficient; a connecting map/ideal or the
            specific transported operator response is an additional interface.
        M3:
          source_order_use: Integral ideal arithmetic and norm tests; matching/evaluation remains undefined.
          erased_EndE: >-
            Public quotient enumeration reaches the same endpoint relation;
            with any evaluated compatible map, t and B are public smooth
            computations. Publication does not fix a cross-residue fiber.
          extra_secret: Endpoint matching/realization oracle or connecting ideal/path.
      public_recovery_gates:
        Robert_full_action:
          primary: 'Robert, Theorem 1.1, Remark 1.2, Section 2, Lemma 6.3/Example 6.4 and Section 7; independently retrieved'
          admitted_slice: >-
            N>4D>D, N=5^b, D=2^lambda, known factorizations, rational
            source N-basis and rational source D-basis U,V, a separable cyclic
            D-isogeny and its two labelled N-images. Set N_A=N,N_B=D.
            The main theorem already applies on this slice; the N_A^2>N_B
            extension cannot create a safe sqrt-degree window. Its squared
            recovery lemma additionally states both-side bases and kernel-rank
            hypotheses. Section 7 summarizes N_A^2>=N_B, but that summary is
            not used to bypass those represented-interface conditions.
          public_message_path: >-
            Full labelled action gives public evaluation/kernel recovery;
            determine the slope in U,V and return its low-k residue. Publishing
            the P2 sender mask makes this full-action input public.
          nonadmission: >-
            P1 supplies one column, and P2 supplies an unlabeled masked pair.
            The direct full-action theorem does not construct their missing
            information. Nonadmission supplies no secrecy proof.
          cost: >-
            Charge randomized four-squares preprocessing, arithmetic over
            represented F_p^2, field/root work and any constant-degree theta
            extension, model and symplectic corrections, torsion/rank checks,
            smooth finite algebra and the output chain. Largest prime factors
            are 5 and 2; log p<=lambda^2. Dimension eight is fixed but its
            coordinate constants are large. No implementation timing, free
            preprocessing or general non-smooth/extension bound is asserted.
        prescribed_degree_source:
          primary: 'Maino et al., Section 4 Theorem 2 and Algorithm 3; independently retrieved'
          scope: >-
            Under GRH, an efficiently represented source ring supports an
            efficiently represented isogeny of a prescribed degree. The
            theorem does not prescribe this ciphertext endpoint C or its
            particular P-image. It cannot be substituted for either missing
            connecting-Hom or EndpointLift operation.
        finite_linear_algebra: >-
          Polynomial in log N and supplied point/evaluation encodings for
          source matrices or a known-map mask transition. It solves no
          source-to-ciphertext realization problem by itself.
        fixed_rank_lattice: >-
          Rank four fixes dimension, not the number of norm-D candidates,
          coefficient conditioning, the evaluated basis construction or its
          representation cost. Finite enumeration is not a uniform polynomial
          recipient algorithm. No impossibility of another specialized search
          algorithm follows.
        reencryption: >-
          P1 scans D=2^lambda quotient chains. P2 scans the same D endpoints
          and constructs one compatible mask per matching lift; it need not
          scan |SL_2| masks. Streamed memory can be polynomial, while time is
          exponential in lambda. End(E) is unused.
        support_control: >-
          L=1 without the new screen has four public neighbors; logarithmic
          walk length has polynomial word support. Once a compatible path is
          found, transport/saturation/evaluated realization are still charged.
          The actual L=lambda^2 law screens short paths, but its word count
          neither bounds endpoint concentration nor excludes every polynomial
          effective support. A-SUPPORT remains unproved. No J1 verdict is made.
      additional_representation_obligation: >-
        The specified globally least coefficient pair under all F-isomorphisms
        is not itself an algorithm. Constant-degree u-equations test/transport
        between given models; they do not by themselves give a uniform cost
        bound for finding that globally least representative. Either provide
        the costed canonicalization or amend the future serialization and its
        distribution contract. This is an additional unresolved cost gate,
        not a proved lower bound or an edit to the frozen packet.
      complete_cost_path: >-
        Successful Setup and inverse acceptance, field/rationality, all
        factorizations, saturated integral basis and division realization,
        point/action evaluation, connecting Hom/ideal conversion, normalization,
        smooth finite algebra, preprocessing, map/output size and memory must
        all have uniform bounds. A lambda^12 trial cap and O(lambda^15) capped
        routine do not establish polynomial successful generation. An expanded
        tau has degree 3^(lambda^2); an expanded gamma has degree
        D^2 deg(alpha). Neither is a free polynomial representation.
      reachable_witness_quotient:
        definition: >-
          For a fixed executable decryption oracle program A, Q_A contains
          every secret-operation answer on every reachable input, including
          secret-dependent validation. Equality of Q_A at the same public
          state gives equal transcripts and plaintext by induction on calls.
        witness_ladder: 'full evaluated order -> represented source operations -> finite source rho_N -> full reachable response function -> plaintext'
        M1_gap: Source norm data alone lacks the evaluated Hom and point-action responses.
        M2_gap: The four source N-matrices suffice only until gamma(X); the whole quotient must also answer target-transport calls.
        M3_gap: The whole quotient needs evaluated ideal-realization/matching responses for reachable endpoints.
        compactness: An exponential full response table is not a polynomial secret representation.
        reverse: >-
          No algorithm recovers full evaluable End(E) from the lowest sufficient
          quotient. Factorization does not imply that quotient recovery is easy
          or inequivalent to EndRing. A fixed rho_N cannot answer a fresh
          ideal-realization operation outside its domain.
      first_security_game:
        name: IND-CPA for a hypothetical total admitted PKE
        law: >-
          Run exact Setup/capped KeyGen, report abort mass separately; reveal
          augmented pk; adversary chooses two messages, receives encryption
          of a fair challenge bit with fresh declared coins, and guesses it.
        advantage_convention: '|Pr[correct guess | successful key]-1/2|'
        EndRing_challenge: >-
          Exact accepted normalized E marginal, distinguished from the augmented
          pk law with U,V,P,Q and public certificate/serialization metadata;
          output a full integral evaluated basis/table/certificates modulo
          declared GL_4(Z) and simultaneous model equivalence. A bare abstract
          quaternion order is a different output interface.
        actual_oracle_arrows: >-
          EndRingEval solver -> secret representation -> hypothetical valid
          lift -> decoder -> bit guess is an attack path. The lift arrow is
          absent here. An IND-CPA adversary -> EndRingEval solver requires a
          separate reduction R^A, a correctly distributed simulation, an
          extraction target and a witness pullback; none is supplied.
        checked_conditional_attack_bound: >-
          If a solver succeeds with probability rho, conversion/decoder errors
          are <=epsilon_c,epsilon_d and joint-law distance is <=delta, a
          verified decrypt-or-uniform-guess attack has advantage at least
          max(0,(rho-epsilon_c-epsilon_d-delta)/2), when successful decryptions
          identify the correct challenge message. This uses a union bound,
          not independence, and only bounds attack difficulty. No values or
          decoder satisfying its antecedents have been supplied here.
        needed_security_arrow: >-
          Pr[R^A outputs a valid exact EndRingEval witness] >=
          f(Adv_IND-CPA(A))-epsilon, with nonnegligible f and explicit calls,
          simulation, distributions, representation conversion and pullback.
        separate_intermediate_assumption: >-
          Observation_IND_CPA on the exact accepted augmented-key observation
          law is unresolved. OneColumnTransport and EndpointRealization are
          missing algorithm obligations, not established security assumptions.
      distribution_bridge:
        missing: [exact_bare_EndRing_source_sampler, challenge_to_pk_T, auxiliary_information_simulator, support_overlap_bound, distance_bound, evaluable_witness_pullback]
        exact_warning: >-
          The target law is conditioned on capped acceptance and short-path
          screening and includes subgroup-choice multiplicity, model weights
          and basis coins. Mere endpoint rerandomization or word entropy is
          not a bridge to a separately specified bare EndRing law. Generating
          accepted order/map certificates using an unknown challenge ring
          cannot be assumed possible by the reduction.
        quantitative_control: >-
          For any event B, TV(T(D_ER),D_PK)>=|Pr_T(B)-Pr_PK(B)|. If T is
          supported on S, this is at least Pr_PK(S^c). A projected structured
          law supported on S is at distance at least Pr_ER(S^c) from a bare
          challenge law with that mass. No such masses are measured here;
          they remain null, as does pullback failure. Even exact within-locus
          sampling alone proves no original-challenge witness pullback.
      joint_result: breaks
      decisive_reason: >-
        Both recipient interfaces contain undefined target operations, and
        even a supplied recipient lift would leave the adversary-to-EndRing,
        quotient necessity and exact-distribution bridge arrows absent.
    J5:
      source_verification: source-verification.yaml
      primary_texts_independently_retrieved_and_hashed: [SETA, FESTA, POKE_archived, PIKE_archived, SiGamal_C_SiGamal, LIT_SiGamal, Robert, Maino_et_al, UPKE]
      exact_packet_quotes:
        - 'Exactly three mechanisms were considered. No finalist is retained.'
        - 'This is a definition checkpoint, not a construction, security, novelty, or universal impossibility result.'
        - 'no complete literature search or primary-source novelty verification in this task'
      source_findings: >-
        The inspected primary sections confirm the named distinct secrets,
        public evaluators, plaintext arrows and structured assumptions. POKE's
        archived correction excludes its split-KEM/OPRF validation while
        expressly preserving Section 4 PKE. FESTA already mentions circulant
        masks, and LIT-SiGamal does too. PIKE's Section 5.1 does not provide
        a formal one-sided POKE reduction and explicitly labels its LIT link
        heuristic. Robert's full-action interface requires the represented
        hypotheses; it does not cover arbitrary partial or masked action.
        SÉTA is a historical correctness/interface control, not a current
        security endorsement: the retrieved historical attack includes SÉTA
        and Robert explicitly notes the TCSSI break.
      proposed_idea_audit:
        IDEA-20261004-e4c461:
          retained_status: proposed
          verified_core: >-
            Equal public input plus different required labelled endpoints
            precludes a deterministic evaluator. The UPKE primary explains
            the public-domain homomorphism/group-action distinction specifically
            for Asymmetric UPKE dagger; it does not prove this ordinary-PKE
            collision theorem or a general no-evaluator result.
          unresolved: >-
            Admissible arithmetic hidden-label collisions, their frequency,
            minimal separating bits and any general novelty claim are untested.
            Published slope kernels in this packet avoid its particular API.
        IDEA-20261004-edbd24:
          retained_status: proposed
          verified_core: >-
            The fixed-program Q_A factorization lemma is sound with a complete
            reachable-call set and consistent public state. SÉTA's finite
            torsion trapdoor is an exact prior interface example.
          unresolved: >-
            Toy witness collisions, compact sufficient state, malformed-input
            completeness and quotient-to-EndRing reverse reductions are not
            established. Four source matrices cannot replace missing target
            operations in M2/M3.
        IDEA-20261004-a09dd4:
          retained_status: proposed
          verified_core: >-
            An embedding-style reduction must account for its simulated
            public-key law and recovered-witness pullback. LIT's random walks
            retain a level/Borel-structured pair, and POKE already includes
            source-ring-hiding rerandomization. Neither is the requested new
            plain-EndRing compiler theorem.
          unresolved: >-
            No bridge T, measured support/distance, hidden-witness-free auxiliary
            sampler or evaluated full-ring pullback is supplied. Other reduction
            shapes remain outside this scoped necessary-condition audit.
      overlap_or_delta: >-
        M1 is a missing connecting-module interface, M2 a conditional transported
        operator identity, and M3 an endpoint realization/fiber obligation.
        None instantiates the cited functioning structured schemes. These
        operations are not proved new by naming End(E), one point, an ideal
        or an SL_2 mask. Exact functional overlaps and unresolved deltas are
        listed in source-verification.yaml; no global nonduplication result
        or matched-assumption performance improvement follows.
      joint_result: holds
      retained_statement: >-
        The packet's bounded no-finalist and unverified-novelty language is
        consistent with the independent section reads. Provenance remains
        internal for the producer's own reads; this new verification does not
        retroactively convert them into producer primary-text retrieval.
  required_controls:
    - id: C1_constant_determinant
      expected_signature: 'same constant pairing/determinant observation for m=0 and m=1; q_k>=2'
      actual_signature: 'e_N(phi_s(P),phi_s(Q))=e_N(P,Q)^D for every s; det(A)=1 for every mask; if the endpoint is omitted, every message lies in one fiber'
      extent: symbolic known-false control; not a frozen endpoint collision
    - id: C2_full_SL2_orbit
      expected_signature: 'End(E) alone cannot select independent sender coins or prove cross-message separation'
      actual_signature: 'equal-pairing target bases form one SL_2 orbit; projection of the complete fiber is H_C; compatible B need not be original A'
      extent: exact algebraic orbit control; accepted-law cross-residue membership unresolved
    - id: C3_erased_depth_two_labels
      expected_signature: identical public state with conflicting required depth-two endpoints defeats deterministic composition
      actual_signature: 'same (state,a,b) must produce one output; it cannot equal both non-isomorphic x and y'
      extent: formal API mutation; no toy elliptic-curve enumeration performed
    - id: C4_public_inverse
      expected_signature: correctness and separation coexist with same-message public recovery
      actual_signature: 'identity observation exposes m; published P2 A restores labelled full action and the checked public kernel/slope decoder'
      extent: identity and full-action mutations, not an attack on unpublished partial/masked observations
    - id: C5_extra_connecting_witness
      expected_signature: supplied Hom/path/tau/orientation is an extra input, not bare End(E)
      actual_signature: public connecting datum reproduces defined downstream operations; target matching/evaluation was the undefined step
      extent: typed interface substitution
    - id: C6_EndRing_derived_ElGamal
      expected_signature: secret derivation does not create a novel EndRing security reduction
      actual_signature: 'x=H(w) used as an ordinary EC ElGamal scalar retains the ElGamal game and its native assumption; obtaining w is sufficient, not necessary, for decrypting'
      extent: formal wrapper control; consistent witness encoding/canonicalization must also be specified
    - id: C7_solver_to_decrypt_direction
      expected_signature: attack upper bound does not imply security from hard EndRing
      actual_signature: 'a scheme exposing m can still admit a solver-to-decrypt program that ignores the solver; its IND advantage is 1/2 while no EndRing extraction is furnished'
      extent: known-false logical control, no real-target exploitation
    - id: C8_structured_compiler
      expected_signature: within-locus randomization cannot replace distribution distance and witness pullback
      actual_signature: support-event TV lower bound and absent pullback remain even when internal rerandomization is exact
      extent: symbolic compiler mutation; actual distance and support masses unmeasured
    - id: C9_public_support
      expected_signature: four-neighbor or polynomial effective-support enumeration is public
      actual_signature: four initial degree-3 subgroups and polynomial logarithmic-length words; path transport/saturation costs remain charged
      extent: nearby L=1/log-length mutation; no J1 conclusion about the accepted lambda-squared law
    - id: C10_ring_free_reencryption
      expected_signature: polynomial in D is exponential in unary lambda
      actual_signature: 'D=2^lambda public quotient constructions; no secret use; P2 does not need a mask-group loop'
      extent: symbolic complexity control; no execution
  objections:
    - joint: J3
      object: Missing evaluated endpoint realization and full low-k separation.
      evidence: endpointlift-algorithm.yaml M3/complete_fiber and independent orbit derivation above.
    - joint: J4
      object: Missing target evaluation, reverse security arrows and distribution pullback; globally least model normalization also lacks a supplied costed algorithm.
      evidence: complete2-algorithm.yaml, attack-gates.yaml and independently read recovery interfaces.
  counterexample_or_mutation: Known-false controls C1-C10 above; no unreported scientific experiment or accepted-key arithmetic collision.
  baseline_comparison: >-
    The relevant baselines are public slope enumeration, publicly labelled
    smooth full-action recovery, and the explicitly structured PKEs in the
    source verification. Pollard-rho/BSGS solve a different ECDLP interface and
    are not substituted as a matched cost baseline. No numerical PKE or
    EndRing algorithm table was measured, and no cross-assumption ordering is
    certified.
  heuristic_challenges:
    - Endpoint support/separation and successful admission are unproved; neither is repaired by word count or finite existence.
    - LIT's cited within-level mixing and PIKE's heuristic source relationships are not a bare-EndRing distribution theorem.
  cost_model_challenges:
    - Charge every item in complete_cost_path, including canonicalization and successful acceptance, not just the capped all-bottom runtime.
    - Fixed dimension, a small desired point output and a finite ideal search do not establish uniform polynomial time/memory/output.
  reduction_and_scope_challenges:
    - Retain the separate EndRingEval output relation, augmented public level information, witness quotient and exact accepted law.
    - Preserve solver-to-decrypt as an attack direction; require an independently defined reverse reduction before any EndRing security language.
  proof_architecture_challenges:
    - Complete observation fibers include all target isomorphisms and fresh compatible masks; true-preimage inclusion is insufficient.
    - Missing transport is a typed operation, not a semantic label or a renamed oracle.
    - No bounded failure here closes any representation, lane, PKE family or general mathematical possibility.
  narrowest_supported_statement: >-
    On J3-J5 only: P2's masks quotient its coefficient fiber to endpoint
    compatibility; its evaluated realization and low-k separation are missing.
    Source finite algebra supplies the conditional M2 identity but not target
    evaluation. The checked public mutations recover the same plaintext when
    their additional data are exposed. The requested recipient algorithms and
    reverse EndRing security bridge remain unconstructed, while the snapshot's
    limited no-finalist/source-caveat language survives the primary-section
    audit. No universal collision or impossibility has been proved.
  next_concrete_action: >-
    Retain the snapshot's single OBL-CSTAR-TRANSPORT-1 as an unlaunched lemma
    obligation: supply the admitted exact sampler and a costed source-to-target
    evaluation algorithm with the named public controls. For a future P2
    finalist, additionally prove its complete endpoint-fiber message theorem.
    No successor, run, amendment or state change is authorized by this report.
  procedure_deviations: []
  scientific_runs: 0
