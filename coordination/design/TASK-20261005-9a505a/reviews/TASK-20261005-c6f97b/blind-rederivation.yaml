blind_rederivation:
  task_id: "TASK-20261005-c6f97b"
  role: "validator"
  joints_owned: ["J1", "J2"]
  scientific_sources_read:
    - "coordination/design/TASK-20261005-9a505a/handoffs/TASK-20261005-c6f97b.yaml"
    - "coordination/design/TASK-20261005-9a505a/tasks/TASK-20261005-6c6fd2/blind-statement.yaml"
  method: "Independent symbolic derivation from the bare statement; no implementation, experiment, producer proof, source retrieval or sibling review."
  scope: "Only J1 and J2. No conclusion about P2, security of every public algorithm, or the whole claim."
  parameter_derivations:
    - "D=2^lambda, k=floor(lambda/2), and the permitted (m,r) pairs bijectively enumerate s in [0,D)."
    - "Minimality of b gives 4D<N=5^b<=20D. Hence b=Theta(lambda), gcd(D,N)=1, and N is strictly greater than 4D."
    - "Defined p satisfies p=-1 modulo M0, so p is coprime to 2,3,5 and to D,N; its binary length is at most lambda^2."
    - "An accepted key certifies U,V as an order-D basis and P,Q as an order-N basis. These exact basis properties, not an assumed sampling distribution, are used below."
  joint_reports:
    J1:
      verdict: "inconclusive"
      supported_part: "The accepted-trial law, capped batch bounds, conditional failure inequality and polynomial short-word enumeration follow. The required lower bound on q and exclusion of other efficiently enumerable support or public certificate leaks are not established by the bare definitions."
      accepted_law:
        definitions:
          mu: "The complete single-trial probability law, conditional on successful Setup, including all random-bit rejections, path choices, point choices, caps, normalization and certificate checks."
          A: "The event that this trial accepts."
          q: "mu(A)."
          n: "lambda^3 independent trials."
        derivation: |
          For any measurable accepted-output set B and q>0,
          Pr(output in B) = sum_{i=1}^n (1-q)^(i-1) mu(B intersect A)
                          = [1-(1-q)^n] mu(B | A).
          Therefore the first accepted output, conditional on any acceptance,
          has exactly the single-trial joint law conditioned on A. There is no
          additional first-success bias among accepted outputs. Bottom has
          probability (1-q)^n. If q=0, bottom is certain and an accepted-output
          conditional law is undefined.
        nonuniformity: |
          For a specified total of ell labelled edges, each raw nonbacktracking
          word has probability 1/[4*3^(ell-1)]. The raw endpoint mass is its
          labelled-word multiplicity divided by this count, with isomorphic
          multiplicities added as the statement requires. It is not uniform
          over endpoint models, isomorphism classes or orders. Acceptance and
          cap-dependent point/certificate work can further change endpoint
          weights. No mixing, endpoint entropy or effective-support bound is
          provided. The phrases first edge and continue L steps leave whether
          ell=L or L+1 implicit; neither convention affects the short-word
          count or the conclusions here.
        sampler_check: |
          There is one successful slot for infinity and one for each actual
          affine point: two ordered roots give two distinct slots, and a zero
          root gives one after rejecting its duplicate. Uniform successful
          slots therefore give uniform rational points before projection and
          further rejection. This does not make the final accepted key uniform.
      inverse_acceptance_and_caps:
        notation: "W is single-trial charged work, w=E[W], w_A=E[W|A], w_R=E[W|not A], and T is the first-acceptance index. Setup is excluded from these quantities."
        exact_formulas:
          - "E[min(T,n)]=sum_{j=0}^{n-1}(1-q)^j=[1-(1-q)^n]/q for q>0; it is n for q=0."
          - "E[batch work]=w*[1-(1-q)^n]/q for q>0. Each trial's work is independent of earlier trials' acceptance events; work need not be independent of its own acceptance."
          - "Repeated independent capped trials until an accepted output cost w/q in expectation for q>0. Equivalently, capped-batch expected work divided by capped-batch success probability is w/q."
          - "E[T|T<=n]=1/q - n*(1-q)^n/[1-(1-q)^n]."
          - "E[batch work|success]=w_A+w_R*(E[T|T<=n]-1), when the conditioning quantities exist. It need not equal w times the conditional trial count."
        bounds:
          - "The statement's per-trial work cap gives worst-case capped-batch work O(lambda^15), and memory/output O(lambda^12) plus encoded Setup inputs."
          - "If q>=lambda^-2 is proved, expected capped work and the inverse-acceptance quantity w/q are O(lambda^14), while the worst capped batch remains O(lambda^15)."
          - "Without a positive lower bound on q, the capped-batch bound is not a bound on the expected cost of producing an accepted key. q can be zero or too small to meet the requested acceptance requirement."
        K0_interpretation: "O(lambda^15) is an unconditional upper bound on terminating the capped KeyGen batch. A successful-key inverse-acceptance interpretation additionally needs q; an unbounded retry process has cost w/q rather than merely the batch cap."
      failure:
        exact: "key_failure=(1-q)^(lambda^3), conditional on successful Setup."
        conditional_bound: "If q>=lambda^-2, (1-q)^(lambda^3)<=exp(-lambda^3*q)<=exp(-lambda)."
        unproved_requirement: |
          q>=lambda^-2 is stated as an acceptance requirement, not derived.
          Existence of the required overorders and maps does not establish that
          trace-dual subgroup enumeration, increasing-length map search,
          normalization, sampling and certificate checking finish within the
          cap with this probability. Nothing in the two permitted inputs
          proves the acceptance probability. Missing this proof does not prove
          that q is small, zero, or that the proposed construction is impossible.
        Setup_separation: |
          The prime interval may have no qualifying prime, and the supplied
          source may fail certification. Those are Setup failures. No uniform
          polynomial prime-search/certification bound or prime-existence
          theorem is supplied here. Setup cost and failure cannot be absorbed
          into the conditional KeyGen bound or recipient epsilon_1.
      scoped_public_path_and_ring_recovery:
        h: "floor(log_3(lambda^2))."
        enumeration_derivation: |
          For j>=1 there are at most 4*3^(j-1) labelled nonbacktracking words
          of length j. Including the empty word gives
          B_h=1+4*(3^h-1)/2=2*3^h-1<=2*lambda^2-1.
          Isomorphic endpoint collisions reduce the number of distinct
          endpoints but do not increase this word bound. The number of edges
          processed by reconstructing these words separately is at most h*B_h.
          A discovered path has degree 3^j<=lambda^2. Field arithmetic,
          normalization and every source-map evaluation must still be charged
          separately; this count is not a proof of their missing time bounds.
        rejection_effect: |
          The exact public bad test excludes every endpoint reached by one
          of these short words, regardless of the producer's actual longer
          path. This removes the enumerated short-path route from accepted
          keys. It is not a lower bound on all public algorithms and does not
          exclude efficiently enumerable support lying outside this ball.
        ring_transport: |
          A public connecting path tau:E_star->E makes
          Z*1+tau*End(E_star)*dual(tau) a publicly constructible represented
          suborder. Obtaining the full order still requires certified integral
          overorder and map-realization work; merely writing this suborder is
          not full ring recovery. If a candidate path is the actual path of an
          accepted KeyGen trial, the statement's deterministic order-building
          steps can be replayed before the independent point sampling. That
          replay succeeds within the accepted trial's cap and yields a full
          order equivalent under the declared basis/model equivalences.
          Thus an effectively enumerable set of M actual-path candidates
          allows capped order replay with O(M*lambda^12) charged work, plus
          path construction, normalization and comparisons. For M=B_h this
          replay budget is O(lambda^14), on precisely this scope. A different
          short path to the same endpoint need not have the accepted long
          path's capped realization time; no such general guarantee is used.
        four_neighbor_signature: |
          With total walk length one, only four source kernels occur. Public
          endpoint matching and replay of their deterministic capped order
          stages recover a full endpoint order for every otherwise accepted
          trial, with at most four capped replays. Retaining the stated bad
          predicate instead rejects all four, since h>=1 for lambda>=8, so the
          L=1 control has q=0. A claim of recipient-only hidden-ring recovery
          for an accepting L=1/four-neighbor variant is therefore detected.
        remaining_public_scope_gaps:
          - "Long walk length and short-word rejection do not prove that accepted endpoints or actual paths have non-polynomial effectively enumerable support. Cardinality alone also does not establish efficient enumerability."
          - "The contents of public certificates are not specified field by field. The statement does not prove that they omit the full secret order, a connecting map, orientation or other inversion aid. This is an interface-definition gap, not a claim that such a leak occurs."
          - "Erasure is a declared KeyGen step, not an independently observed runtime property. It does not defeat a path that is publicly enumerable."
      required_next_evidence: "A candidate-specific acceptance-probability argument including all capped subroutines, an explicit public/secret certificate boundary, and separately charged evaluation/normalization bounds. No unrestricted public-algorithm lower bound is demanded or inferred."
    J2:
      verdict: "inconclusive"
      supported_part: "P1 has exact true-s inclusion, a unique normalized degree-D lift, F_z={s}, q_k(z)=1 and a unique Q image. The two supplied partial recipes do not give a complete uniformly polynomial recipient algorithm or an actual-message decoder."
      typing:
        source_ring: "Each represented alpha_i in O is an evaluated map E->E. It acts on P,Q in E[N], not on X in C[N]."
        connecting_maps: "A Hom(E,C) basis has maps h_i:E->C. It is a different type from an End(E) basis."
        sender_map: "After the actual target normalization, write f_s=i_s*phi_s:E->C, X=f_s(P), and Y=f_s(Q). Its dual is C->E."
        gamma: "gamma=f_s*alpha*dual(f_s) is a map C->C. Its type is valid when f_s and its dual are actually supplied or constructed."
        Complete_2_definition_gap: |
          The bare statement supplies A1, A2 and their operation domains as
          partial_algorithm_definitions. It does not supply a further complete
          algorithm called Complete_2. Naming an operation domain specifies
          its desired input/output types; it does not implement the operation
          or establish its resource bound. No missing definition is repaired
          using producer files or assumptions.
      observation_fiber_derivation:
        definition: |
          For a fixed accepted key and normalized honest observation z=(C,X),
          F_z={t in [0,D): there are admitted sender coins and normalization
          isomorphisms giving t and recipient view z}.
          q_k(z)=|{t mod 2^k:t in F_z}|. Each t in [0,D) corresponds to a
          permitted message/coin pair. Only actual admitted target
          normalizations are included, and all their multiplicities are allowed.
        true_inclusion: "The actual sender coins and normalization witness s in F_z. This establishes inclusion, not uniqueness by itself."
        independent_uniqueness_proof: |
          Let t be in F_z, and put f_t=i_t*phi_t:E->C with f_t(P)=X.
          Both f_t and f_s have degree D. The elliptic-homomorphism degree
          quadratic identity gives
            deg(f_t-f_s)+deg(f_t+f_s)=2*deg(f_t)+2*deg(f_s)=4D.
          Hence deg(f_t-f_s)<=4D. If f_t-f_s is nonzero, its kernel has at
          most its degree many geometric points, even if it is inseparable.
          But it kills P, hence all N distinct multiples of this order-N
          point, forcing N<=deg(f_t-f_s)<=4D. This contradicts N>4D.
          Thus f_t=f_s as represented maps on the fixed normalized target.
          Their kernels coincide. In the order-D basis U,V,
          <U+tV>=<U+sV> implies U+tV=[c](U+sV) for a unit c modulo D.
          Comparing U coefficients gives c=1 modulo D; comparing V
          coefficients then gives t=s modulo D. Since both are in [0,D),
          t=s. Therefore F_z={s} and q_k(z)=1.
        lift_and_completion_quantities:
          - "The normalized degree-D homomorphism E->C taking P to X is unique, even among homomorphisms beyond the stated cyclic family. Honest encryption supplies its existence."
          - "The normalized Q image is exactly one point Y=f_s(Q); any genuinely degree-D candidate f with f(P)=X equals f_s and has this same Q image."
          - "The P1 fiber property has failure zero on every admitted honest encryption, conditional on successful Setup and an accepted certified key. This is a mathematical statement, not a recipient runtime measurement."
          - "Invalid observations can have F_z empty and q_k(z)=0; the proof does not assign them a plaintext."
        assumptions_used: "Exact order-N P, genuinely degree-D group homomorphisms to the same target model, and N>4D. No End(E) oracle, Hom computation, retained tau, empirical collision search or polynomial inversion assumption is used in this fiber proof."
      A1_check:
        algebraic_correctness: |
          If an evaluated Hom(E,C) basis is available and an exact complete
          solver finds a genuinely degree-D f with f(P)=X, the preceding
          uniqueness proof forces f=f_s. Thus f(Q) is the actual Y. Existence
          holds for honest inputs. A norm-D solution count or a convenient
          representative need not be used to infer message uniqueness.
        missing_operations:
          - "Obtain evaluated h1,...,h4 spanning Hom(E,C) is a connecting-map operation, not supplied by the represented source End(E) basis."
          - "There is no complete coefficient-solver algorithm, uniform norm-equation search bound, connecting-map output bound or separate evaluation bound in the bare recipe."
          - "An evaluated f must have its target labels, exact degree and field/map identities checked. A symbolic ideal or rational coordinates alone do not meet the evaluated-map output type."
        result: "Correct conditional relation; no established complete recipient implementation or epsilon_1/time/memory/output bound."
      A2_check:
        source_linear_algebra: |
          Assuming O is the certified full integral End(E), its action on
          E[N] is onto M_2(Z/NZ). Indeed an endomorphism killing E[N] factors
          through [N]:E->E, so the kernel of the action O->End(E[N]) is N*O.
          Both O/N*O and End(E[N]) have N^4 elements, using the certified
          rank-four order and the P,Q basis; injectivity gives surjectivity.
          Consequently the equation alpha(P)=Q has an integral source-order
          solution. Matrix extraction uses smooth order-5^b finite algebra;
          the linear congruences are finite polynomial-size algebra. This
          existence argument does not construct an E->C connection.
        exact_completion_identity: |
          For any such alpha and the actual normalized f_s,
            gamma(X)=f_s*alpha*dual(f_s)*f_s(P)
                    =f_s*alpha([D]P)
                    =[D]*f_s(alpha(P))=[D]*f_s(Q).
          Since X,Y are N-torsion and gcd(D,N)=1, delta=D^(-1) modulo N
          gives [delta]gamma(X)=Y. The asserted identity is exact, conditional
          on actually evaluating this gamma rather than substituting a map
          that merely has the desired name or action type.
        unavailable_step: |
          evaluate_gamma(O,E,C,X,alpha,D,N) is required to evaluate a
          C-endomorphism whose definition uses the unknown f_s and its dual.
          The input End(E) maps cannot be applied to X on C. A connecting
          Hom map, a path/connecting ideal with effective realization, target
          orientation sufficient to transfer the action, the sender quotient
          map or an extra secret/oracle would supply additional information
          or a new algorithmic primitive. None is supplied by this operation
          signature. The erased KeyGen tau connects E_star to E, not E to C,
          and retaining it would in any event violate the stated sk boundary.
        result: "The source alpha and the conditional gamma identity are valid. The hidden target evaluation is not a defined uniform recipient algorithm."
      actual_message_check:
        necessity: |
          With fixed sk and recipient view z, a decoder cannot know which of
          two compatible sender residues was used. If q_k(z)>=2, a
          deterministic decoder fails for at least one of them; for a
          randomized decoder the maximum failure over two distinct residues
          is at least 1/2. True inclusion alone does not resolve this. P1's
          independent proof above does resolve it: q_k(z)=1 for every admitted
          honest P1 observation.
        if_evaluated_f_is_returned: |
          The decoder must also have the public U,V,k convention from pk;
          those fields are absent from the P1_relation argument list although
          they occur in pk. With that full public input and f=f_s, f(V) has
          exact order D because <V> intersects <U+sV> trivially. The equation
          f(U)=[-s]f(V) recovers s by smooth order-2^a discrete logarithm,
          using polynomially many group operations in a, plus separately
          charged f(U), f(V) evaluations. Return s modulo 2^k=m. No source
          Hom oracle is needed after an evaluated f has actually been given.
        if_only_Y_is_returned: |
          A correct unique Y completes the point relation. It is not itself
          the message. A further algorithm recovering the sender kernel or
          slope from X,Y must be stated with its own uniform cost and failure
          bound. Uniqueness of that kernel is not a construction of this
          algorithm. No unprovided map-reconstruction step is inferred.
        decoder_failure: "epsilon_1 for a complete actual-message decoder is unspecified, because that decoder and the missing operations are unspecified. It is distinct from the proved zero fiber failure, Setup failure and (1-q)^(lambda^3)."
      time_memory_output_and_evaluations:
        uniformity: "One fixed algorithm and one polynomial must cover every successful Setup, accepted key, message and admitted randomness, in unary lambda and total encoded inputs. An instance-specific successful search or preprocessing table is not this bound."
        sender_map_representation: |
          A known slope gives an a-step degree-2 quotient chain. A composition
          of these explicit local maps admits polynomial-size output and
          streaming storage in a and log(p), and evaluation takes a local-map
          evaluations rather than expansion of a degree-D rational function.
          This shows that degree D alone is not an output-size impossibility.
          It does not find the unknown slope or bound target normalization.
        ring_evaluation_accounting: |
          Matrix extraction must charge evaluations of each of the four
          source maps on P and Q separately, then the smooth-torsion coordinate
          extractions and linear algebra. Source-alpha evaluation at a new
          point, output f evaluations and any gamma evaluation must each be
          charged again. Polynomial node/bit counts and the word evaluable
          alone do not establish polynomial evaluation of a composition DAG:
          a recursively doubled composition can have small stored DAG size
          but require exponentially many applications on distinct intermediate
          points. No oracle or such evaluation cost is hidden in a field-op
          count. Explicit ordinary arithmetic circuits can be charged node by
          node with polynomial finite-field bit costs; the statement permits
          both encodings and supplies no bound covering all permitted DAGs.
        finite_public_enumeration: |
          The ring-free enumeration performs D=2^a quotient constructions.
          Reconstructing each chain separately uses a*D local degree-2 steps,
          plus separately charged normalization and comparisons. Even the
          D loop iterations alone are exponential in unary lambda=a, while
          accepted input/output caps and log(p)<=lambda^2 keep the stated
          encoded key lengths polynomial. Streaming one chain can have
          polynomial memory and one-point or one-chain output, but this does
          not make its exhaustive time polynomial. For honest P1 views it
          eventually finds the unique f_s, Y and residue; it supplies a finite
          public solution, not the requested uniform polynomial algorithm.
        unresolved_bounds: "A1 Hom production/solver costs, A2 target evaluation, source-DAG evaluations where compressed, normalization and any Y-to-message reconstruction lack uniform time bounds. Their memory, output, preprocessing and failure bounds must be explicit rather than inferred from existence."
      required_next_evidence: "A complete candidate-specific recipient algorithm using only the declared sk and pk, with implemented or proved connecting/target operations, separately bounded evaluations, actual-message output and uniform failure/time/memory/output accounting. Missing definitions establish incompleteness of this supplied candidate, not universal impossibility."
  known_false_controls:
    - name: "L=1 / four-neighbor public recovery"
      mode: "Logical control; no run."
      expected_signature: "Only four actual source paths; public endpoint/order recovery if otherwise accepted, or certain rejection under the hardened short-word predicate."
      derived_signature: "Detected: four source kernels permit capped deterministic order replay on the actual accepted path. The unchanged short-word predicate gives q=0 for this L=1 control."
    - name: "Constant observation with two messages"
      mode: "Logical control; no run."
      expected_signature: "q_k(z)>=2 despite true-s inclusion; uniform small recipient failure is impossible."
      derived_signature: "Choose two permitted distinct message residues and map their encryptions to the same constant z. Both scalars are in F_z, so q_k(z)>=2. At least one deterministic decoding fails, or worst-message randomized failure is at least 1/2. The P1 uniqueness proof cannot be reused: this control's constant view is not the required degree-D image of P in a common target."
    - name: "Identity / public inverse"
      mode: "Logical control; no run."
      expected_signature: "Messages may separate perfectly while inversion is available publicly."
      derived_signature: "A view exposing s, m, or a publicly invertible encoding can have q_k(z)=1 and correct decryption. The public inverse already yields m with no sk. Thus fiber uniqueness/correctness does not establish recipient-only inversion. This is a control on that distinction, not an instantiation of the fixed D=2^lambda sender map."
    - name: "Ring-free D=2^a exhaustive reencryption"
      mode: "Logical control; no run."
      expected_signature: "Finite correctness/fiber detection can coexist with failure of uniform polynomial time."
      derived_signature: "The exhaustive algorithm includes the true s and, for honest P1, finds the unique residue. D iterations and a*D explicitly rebuilt quotient steps are exponential in growing a=lambda. Streaming memory and output can remain small; the time requirement fails."
    - name: "Connecting-Hom oracle"
      mode: "Logical control; no run."
      expected_signature: "A connecting Hom basis or evaluated connecting map is an extra input/operation, not a represented source-ring map."
      derived_signature: "A1's obtain_Hom_basis produces maps E->C from an input providing only End(E) maps E->E. Naming an oracle makes the missing operation explicit; its construction, output/evaluation costs and failures remain charged extra requirements. A2's target gamma evaluation has the same missing connection. Conditional algebra after supplying it does not discharge the original recipient interface."
  limitations:
    - "These are independent symbolic derivations, not measured metrics or executed tests. There are zero scientific runs."
    - "The committed snapshot and dispatcher preconditions were not inspected: the card assigns those checks to the dispatcher and excludes their evidence from this blind read scope."
    - "No producer comparison, sibling composition or conclusion outside J1/J2 was attempted."
    - "Exact native model identifier and effective effort verification are not exposed to this validator; requested policy/effort and unverified runtime identity are recorded separately in the final receipt."
