  objective: "Test whether evaluable End(E), under a hardened admissible KeyGen distribution, yields a concrete uniform polynomial recipient-only lift without yielding the same public lift. Inspect at most three mathematically distinct lift mechanisms and retain at most one finalist."
  uncertainty_reduced: "OBL-CSTAR-RECIPIENT-LIFT-1: a constructive search for a genuine recipient/public asymmetry for P1 Complete_2 or P2 EndpointLift, not an impossibility proof."
