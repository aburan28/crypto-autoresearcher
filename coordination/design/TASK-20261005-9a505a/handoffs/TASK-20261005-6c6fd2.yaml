  constraints:
    - "Read every declared scientific input completely. The three IDEA inputs remain proposed controls and audits, not accepted findings; do not alter or adopt their status."
    - "Do not read/list/hash the new review plan, reviewer cards, review outputs, composer artifacts, or review messages. This card alone states the producer contract."
    - "Freeze L(lambda), p(lambda), degree/torsion/message parameters, exact walk or ideal distribution including backtracking and automorphism weights, finite-field/model encodings, public auxiliary data, secret evaluable End(E) representation, and erasure of paths/ideals/orientation/tau."
    - "Freeze bad-key predicate, how it is tested without circular unavailable information, rejection sampler, acceptance/failure bound and uniform polynomial KeyGen K0(lambda), including inverse acceptance rate, ring transport/saturation, field degree, coordinate size, evaluation cost, output size, preprocessing and memory. Any unproved distribution, mixing, rejection or cost property is a named assumption with scope/falsifier."
    - "Give the known public path/ring-recovery cost under that same accepted distribution. Explicitly exclude the prior L=1/four-neighbor and any polynomial effective-support enumeration shortcut, including logarithmic-length or concentrated walks. A larger L alone proves no hardness; do not invent a lower bound on all public algorithms."
    - "Keep P1 Complete_2 and P2 EndpointLift distinct. P1 takes represented/evaluable End(E), public E,C,X=phi_s(P),P,Q,D,N and returns the matching phi_s(Q) or an equivalent evaluated degree-D map. P2 takes End(E), public E,C and its masked-orbit/basis observation plus declared parameters and returns an admissible endpoint-compatible evaluated lift with a proved common low-k message. Never assume fresh mask recovery or original-map uniqueness from End(E)."
    - "For every attempted mechanism give public Setup, KeyGen, Encrypt and recipient lift/Decode with exact input/output representations, explicit pseudocode from evaluable End(E), correctness/failure rules and uniform polynomial time, memory and output bounds in lambda and encoded inputs; do not hide exponential preprocessing/output in a polynomial-in-output statement."
    - "For a retained route prove that the operation is not merely Hom/path/connecting-ideal/orientation/retained-tau/extra-secret recovery under another name; identify and charge every unproved oracle and extra secret. A named oracle or exponential public fallback is not a surviving polynomial recipient algorithm."
    - "Prove actual-message correctness Dec(sk,Enc(pk,m;r))=m with exact key/message/randomness quantifiers and failure probability. Analyze the complete low-k observation fiber: all compatible t must share t mod 2^k, not just include the true s=m+2^k*r. Work modulo automorphisms, normalized models and all permitted masks/labelings."
    - "Apply public-Hom, Robert/full-torsion, public finite linear algebra, fixed-rank lattice, public inverse, reencryption, quotient-collision, label-transport and generic wrapper controls, with rationality, smoothness, factorization, kernel rank, field/model, degree, preprocessing and output-size conditions explicit."
    - "Define the first security game and exact actual oracle arrows/advantage inequalities. EndRing-solver-to-secret/decrypt gives only an attack upper bound. Prove adversary-to-EndRing with exact distribution/output/auxiliary-data conversion, or name every intermediate assumption and unresolved bridge separately. No security inference follows from a recipient lift alone."
    - "Audit finite-witness quotient Q_A of every secret operation and distribution-bridge distance/support/pullback requirements from IDEA-edbd24 and IDEA-a09dd4; normalize public-label transport using IDEA-e4c461. All three are proposed inputs, not new authoritative obstructions."
    - "Normalize each attempted route against primary SÉTA, FESTA, POKE, PIKE, SiGamal/C-SiGamal, LIT-SiGamal and the three ideas. Distinguish recalled/retrieved/kb/internal provenance, preserve source caveats, and give exact overlap/unresolved delta and quantitative sota_delta; do not set dominated_by null without comparison."
    - "attack-gates.yaml contains a complete proof_search_map: exact prior P1/P2 baseline slice, observation-fiber/collision audit, quantifier order, method ceiling, nearby known-false controls, separate representation/cost/reduction obligations. Record the missing finite algorithm/distribution definitions blocking useful Lean formalization and revisit when the exact lemma is frozen; no Lean implementation/task launch here."
    - "blind-statement.yaml is a standalone bare mathematical statement: exact parameters, KeyGen law/rejection predicate and asserted cost/failure bounds, P1 typed relation and undecorated algorithm definition, encodings, message observation map, correctness event and uniform cost quantities. Exclude proofs, derivations, rationale, source names, verdicts, reviewer prior, producer conclusions and previous reviews. The Validator receives this statement, not complete2-algorithm.yaml or keygen-hardening.yaml."
    - "Create exactly eight outputs. complete2-algorithm.yaml and endpointlift-algorithm.yaml each contain either a concrete algorithm with obligations or an exact route-specific missing/failed arrow; omission is not allowed. provenance.yaml is last and lists every actual read and honest native runtime provenance."
    - "At most one finalist only after all cheap syntax/cost/fiber/asymmetry gates; if none survives, preserve route-specific definitions and one exact continuation obligation, without universal closure."
    - "Zero scientific runs, no implementation, no successor launch, no external messages, and no changes outside the exact declared write scope."
    - "Record requested policy/effort and honest runtime provenance; actual resolved_model_id is null/unverified if unavailable, never invented."
    - "No candidate, security, novelty, practicality, deployment, or universal possibility/impossibility claim is authorized by preparation."
