    - "Known-false controls: constant/determinant observation gives cross-message collision; full SL_2 orbit cannot recover sender mask or imply separation from End(E); erased labels with conflicting depth-two endpoints fail composable public evaluation; public inverse gives same-message public recovery; connecting-Hom/retained-tau oracle is extra secret; EndRing-derived EC ElGamal is a wrapper; solver-to-decrypt fails semantic-security reduction direction; structured compiler without distance/pullback fails plain-EndRing labeling. Record each expected signature explicitly."
    - "review-attestation.yaml has a top-level review_attestation block with task_id, joints_owned [J3,J4,J5], sources_read, read_sibling_reports false, blind_from_respected true, independent_session true and directly contained canonical verdicts mapping for exactly those J labels with values holds|breaks|inconclusive. MUST NOT use per_joint_verdict or per_joint_verdicts, a whole-claim scalar verdict, projection or repair."
