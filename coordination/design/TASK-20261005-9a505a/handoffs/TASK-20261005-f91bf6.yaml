    - "Fresh xhigh, no degradation; full-policy native fallback permitted; no runs, implementation, external messages, Git/control-plane/ledger/status mutation. Exactly four outputs."
    - "Runtime receipt is last and records fresh independent session identity, requested policy/effort, resolved_model_id null/unverified if unavailable, all actual reads, zero runs and no degraded inference. Never invent exact model verification."
