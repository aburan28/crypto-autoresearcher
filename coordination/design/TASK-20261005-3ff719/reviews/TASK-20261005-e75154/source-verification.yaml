      sha256: 010faef9c893d1460c3a69fce256da86cedd1fd8b2c5f416821b65bd42b1b66b
      bytes: 741190
      hash_matches_locator_intake: true
      sections_read:
        - Front-page correction and introduction
        - Section 4, Algorithms 1-2, Protocol 2, Problems 3-5, and Theorem 6
        - Appendix B and Appendix C
      verified_boundary: >-
        The correction invalidates the Section 5 split-KEM and Section 6 OPRF
        validation assumption but explicitly leaves the Section 4 PKE
        unaffected. The PKE uses secret masks, a higher-dimensional
        representation, parallel isogenies, shared-point recovery, and C-POKE.
    - id: PIKE-2026-473
      title: PIKE
      primary_url: https://eprint.iacr.org/2026/473.pdf
      retrieved_url: https://web.archive.org/web/20260525004010id_/https://eprint.iacr.org/2026/473.pdf
