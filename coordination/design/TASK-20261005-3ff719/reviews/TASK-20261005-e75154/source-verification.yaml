      verified_boundary: >-
        The construction uses parallel vertical maps, a secret matrix and
        scalar, Kani-based reconstruction, a typed plaintext discrete log, and
        LIT-specific assumptions. Circulant masks are explicitly allowed. This
        supports the packet's claim that adding such reconstruction data to P2
        changes its secret and assumption.
