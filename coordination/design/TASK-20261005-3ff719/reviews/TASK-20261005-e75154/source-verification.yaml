      hash_matches_locator_intake: true
      sections_read:
        - Introduction through Theorem 1.1 and Remark 1.2
        - Section 2 proof and representation/model caveats
        - Section 6.4, Lemma 6.3, and Example 6.4
        - Section 7
      verified_boundary: >-
        Full rational basis action, known factorization, smoothness, model
        conversion, kernel-rank, and target torsion conditions are material.
        Remark 1.2/Section 6.4 reaches the N_A^2>N_B regime. This supports the
        public full-action recovery control, not arbitrary partial or masked data.
    - id: FESTA-2023-660
      title: 'FESTA: Fast Encryption from Supersingular Torsion Attacks'
      authors: Andrea Basso, Luciano Maino, and Giacomo Pope
      primary_url: https://eprint.iacr.org/2023/660.pdf
      retrieved_url: https://web.archive.org/web/20260429140607id_/https://eprint.iacr.org/2023/660.pdf
      retrieval: fresh_archived_primary_pdf
      sha256: cfa2c92cf8a40e6c27c5679c5468936c65a35dcbe77a1e9e791035f500c0d679
      bytes: 520982
      hash_matches_locator_intake: true
      sections_read:
        - Section 3 and Algorithms 1-2
        - Section 4, Problems 6-8, and Theorem 9
        - Section 6.3
      verified_boundary: >-
        The trapdoor is a connecting isogeny plus a commuting unmasking matrix;
        CIST2 and a decisional hybrid are explicit. The text explicitly permits
        circulant rather than diagonal matrices, so changing only the commuting
        mask family is not a novelty delta.
    - id: POKE-2024-624
      title: 'POKE: A Framework for Efficient PKEs, Split KEMs, and OPRFs from Higher-dimensional Isogenies'
      authors: Andrea Basso
      primary_url: https://eprint.iacr.org/2024/624.pdf
      retrieved_url: https://web.archive.org/web/20241009051546id_/https://eprint.iacr.org/2024/624.pdf
