      sections_read:
        - Section 3, Algorithms 1-5, and Proposition 8
        - Section 4.1, Problem 9, and Theorem 10
        - Section 5.1, Problems 11-12, and both comparison subsections
      verified_boundary: >-
        PIKE derives a nonconstant shared pairing value from masked individual
        torsion points. Section 5.1 rejects a one-sided C-PIKE/C-POKE reduction
        and labels the C-PIKE/C-LIT-SiGamal relationship heuristic with a
        rigorous reduction still unclear.
    - id: Maino-et-al-2023-640
      title: A Direct Key Recovery Attack on SIDH
      authors: Luciano Maino, Chloe Martindale, Lorenz Panny, Giacomo Pope, and Benjamin Wesolowski
      primary_url: https://eprint.iacr.org/2023/640.pdf
      retrieved_url: https://web.archive.org/web/20260920104024id_/https://eprint.iacr.org/2023/640.pdf
      retrieval: fresh_archived_primary_pdf
      sha256: 8158a5a1f22f0b08ed07a42d11b99eacd623881f378460966e8c5115e003f581
      bytes: 650273
      hash_matches_locator_intake: true
      sections_read:
        - Introduction and SSI-T definition
        - Section 2 through the B>A core interface
        - Section 4 and Theorem 2
      verified_boundary: >-
        The paper explicitly includes SÉTA in the scope of systems publishing
        full secret-isogeny torsion images. With known End(E0), its Section 4
        route is polynomial under GRH for the stated SSI-T interface. That does
        not automatically cover partial, masked, or invariant-only projections.
