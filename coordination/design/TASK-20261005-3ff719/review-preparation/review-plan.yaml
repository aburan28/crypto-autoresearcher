review_plan:
  id: REVIEW-CSTAR-CORR-20261005-9cc4c3
  goal_id: GOAL-SSI-2fa82a
  question_id: RQ-SSI-1946c9
  batch_id: BATCH-65a9e0
  correction_id: CORR-20261005-9cc4c3
  preparation_task: TASK-20261005-3ff719
  preparation_archive: TASK-20261005-4a9241
  producer_task: TASK-20261005-47d13a
  producer_snapshot: TASK-20261005-3a667c
  reviewer_tasks: [TASK-20261005-9ebe89, TASK-20261005-e75154]
  composer_task: TASK-20261005-0a08f5
  ledger_archive: TASK-20261005-24f42d
  final_decision_reserved: DEC-20261005-5cf97a
  supersedes_for_protocol_only:
    plan: coordination/design/TASK-20261005-84070d/review-preparation/review-plan.yaml
    failed_composer: TASK-20261005-1d7487
    correction: CORR-20261005-9cc4c3
    scope: >-
      Replaces only the review-attestation serialization protocol and reviewer
      ownership for a fresh round. No scientific statement, derivation,
      verdict, source reading, or conclusion from the invalid round is changed
      or inherited.
  temporal_independence_limit: >-
    Original findings are known to the Coordinator but are not disclosed to
    either fresh reviewer. This additive rerun cannot restore temporal
    blindness before the original results existed and does not create extra
    scientific corroboration; it supplies a fresh procedurally independent
    evaluation whose purpose is a checker-valid composition.
  claim_under_review: >-
    The immutable TASK-20261005-3a667c C-star packet's exact definitions
    either do or do not provide an ordinary public-sender PKE interface with
    actual-message correctness, one concrete recipient algorithm derived from
    evaluable End(E), and an honest hardness-arrow statement separating
    EndRing from added assumptions and public recovery. The round does not ask
    whether EndRing-PKE is possible in general or whether any candidate is
    secure, novel, practical, or deployable.
  claim_binding_status: snapshot_bound
  claim_binding_rule: >-
    Red Team independently verifies the pushed TASK-20261005-3a667c receipt
    and quotes the exact producer statements before judging J3-J5. The blind
    Validator reads no producer byte and judges J1-J2 only from its new card
    and the original producer-free blind statement.
  coordinator_prior: >-
    Recorded before the correction reviewers run and unchanged in substance
    from the original prior: a constant or overly lossy projection is likely
    to fail message separation, while a projection retaining an efficiently
    invertible full public action is likely to admit the prior public
    map-to-message route. A middle projection survives only with explicit
    public Encrypt and a concrete End(E)-derived SecretLift whose essential
    input is absent publicly. EndRing-solver-to-decrypt is the wrong direction
    for semantic security absent a separate intermediate assumption. These are
    priors, not inherited verdicts.
  scientific_verdicts_inherited: false
  messages_used_as_scientific_input: false
  joints:
    - id: J1
      joint: >-
        J1 -- Projection correctness and message separation: derive necessary
        and sufficient typed conditions on a public projection Pi, Encrypt,
        SecretLift, and Decode for every admitted message/randomness pair to
        return the actual message, including rejection behavior and whether
        distinct messages can share the recipient's entire decoder input.
      assigned_to: TASK-20261005-9ebe89
      attack_plan: >-
        Work only from the blind statement. Model the full recipient view as a
        typed value Z_sk(ct). Derive totality and left-inverse requirements and
        search for m != m' with equal Z values. Apply the constant-projection
        collision and the identity/full-public-inverse control. Refuse to infer
        correctness from existence or uniqueness of a Hom map, path, ideal,
        kernel, witness, or branch.
      breaking_artifact: >-
        A typed cross-message collision, undefined sender/decoder arrow,
        missing validation condition, or proof that the same inverse is public.
    - id: J2
      joint: >-
        J2 -- Exact reduction-direction audit: distinguish an EndRing solver
        that yields sk or decryption from a reduction that turns a successful
        PKE adversary into an EndRing solver, and identify every separately
        assumed intermediate problem needed for a legitimate security claim.
      assigned_to: TASK-20261005-9ebe89
      attack_plan: >-
        Write both algorithms with oracle direction and advantage inequalities.
        Show that EndRing-solver-to-decrypt only gives Break <= EndRing as an
        upper-bound relationship and cannot prove semantic security from
        EndRing hardness. Test standard EC ElGamal whose scalar secret is
        deterministically derived from an EndRing encoding: the wrapper remains
        ElGamal syntax/security and is not a novel EndRing-security reduction.
      breaking_artifact: >-
        A reversed oracle arrow, invalid advantage implication, omitted
        intermediate assumption, or the ElGamal control misclassified as novel.
    - id: J3
      joint: >-
        J3 -- Every producer attempt, including all considered projection
        families and any finalist, has public Setup/KeyGen/Encrypt inputs and a
        typed ciphertext-to-actual-message correctness chain with declared
        domains, encodings, randomness, validation, and failure behavior.
      assigned_to: TASK-20261005-e75154
      attack_plan: >-
        Quote each snapshotted definition and trace every value. Replace the
        recipient secret with an opaque token during public operations; then
        seek endpoint/projection collisions and cross-message decoder-view
        collisions. Reject outputs that stop at Hom, path, ideal, kernel,
        witness, branch, shared value, or list instead of the declared message.
      breaking_artifact: >-
        A route-by-route typed value-flow table containing a secret-dependent
        sender step, undefined operation, exact collision, non-message output,
        or missing correctness quantifier.
    - id: J4
      joint: >-
        J4 -- Every finalist SecretLift is a concrete algorithm derived from
        the evaluable End(E) basis, uses no hidden extra secret, and remains
        recipient-only after endpoint, partial/full torsion, Robert,
        fixed-rank lattice, public-Hom, public reencryption, and exact
        assumption/reduction-direction attacks.
      assigned_to: TASK-20261005-e75154
      attack_plan: >-
        Quote SecretLift line by line; type each input/output and erase End(E)
        or replace missing objects with public evaluated Hom. Try public
        reencryption, finite torsion linear algebra, Robert full-action
        recovery, fixed-rank optimization, and exhaustive-search substitutions.
        Identify retained tau, connecting ideal, orientation, setup trapdoor,
        or additional secret explicitly, and draw security arrows in the
        claimed direction.
      breaking_artifact: >-
        A named-oracle placeholder, existence witness, exponential decoder,
        hidden extra secret, public recovery chain, or reversed/missing
        hardness arrow reaching the same message.
    - id: J5
      joint: >-
        J5 -- Exact primary-source and nonduplication boundary: compare the
        snapshotted attempts and any finalist with SÉTA, FESTA, POKE, PIKE,
        SiGamal/C-SiGamal, and LIT-SiGamal using independently retrieved or
        hash-verified primary text, and scope every result without a novelty,
        security, or universal-impossibility overclaim.
      assigned_to: TASK-20261005-e75154
      attack_plan: >-
        Independently retrieve each load-bearing paper or verify a fresh copy
        against the recorded hash, read the cited scheme/assumption sections,
        normalize syntax, secrets, public level data, masks, message arrow, and
        assumption direction, then identify exact overlap or exact unresolved
        delta. Preserve the POKE correction boundary, FESTA circulant-mask
        prior art, PIKE's non-reduction caveat, and Robert's stated interface.
      breaking_artifact: >-
        A primary-source quotation/hash/section contradicting the producer, an
        exact normalized overlap, unresolved retrieval/comparison impediment,
        or an overbroad scope statement with its correction.
  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      The fresh Validator and Red Team own disjoint joints in independent
      native sessions and may not read, list, receive, or summarize either the
      sibling or any prior-round review. The composer reads both only after
      both are terminal.
  proves_too_much:
    objects:
      - A constant projection Pi(ct)=c0, where recipient correctness for two distinct messages is known false even if End(E) is disclosed.
      - An identity/full-public-inverse projection, where correctness may hold but recipient-only inversion is known false because the public can run the same inverse.
      - Standard EC ElGamal with its scalar secret deterministically derived from an EndRing encoding, where calling the wrapper a novel EndRing-security construction is known false absent a new reduction.
      - A proof containing only EndRing-solver-to-secret-key/decrypt, where a semantic-security reduction from adversary to EndRing is known absent.
    failure_signature: >-
      Any argument concluding message separation on the constant projection,
      recipient-only advantage on the public inverse, novel EndRing security
      for the wrapper, or a security reduction from solver-to-decrypt has
      proved too much and must be rejected.
    assigned_to: TASK-20261005-e75154
  blind_rederivation:
    required: true
    quantity: >-
      Q1: typed projection/recipient-view conditions for actual-message
      correctness and separation, tested on constant and public-inverse
      projections. Q2: the opposite reduction directions and the implication
      each supports, tested on EndRing-derived EC ElGamal. Neither quantity is
      a candidate or general EndRing-PKE verdict.
    parameters: >-
      Abstract domains PP, SK, PK, M, R, CFull, CProj; algorithms Setup,
      KeyGen, FullEnc, Pi, Encrypt, SecretLift, Decode, Validate; adversaries,
      EndRing solvers, success events, and the standard EC ElGamal algorithms
      stated in the immutable producer-free blind statement.
    blind_from:
      - coordination/design/TASK-20261005-84070d/tasks/TASK-20261005-47d13a/
      - coordination/design/TASK-20261005-84070d/archives/TASK-20261005-3a667c/
      - coordination/design/TASK-20261005-3ff719/review-preparation/review-plan.yaml
      - coordination/design/TASK-20261005-3ff719/handoffs/TASK-20261005-e75154.yaml
      - coordination/design/TASK-20261005-3ff719/reviews/TASK-20261005-e75154/
      - coordination/design/TASK-20261005-3ff719/composition/
      - coordination/design/TASK-20261005-84070d/review-preparation/reviews/
      - coordination/design/TASK-20261005-638ca5/tasks/
      - coordination/design/TASK-20261005-638ca5/review-preparation/
      - analysis/ideation-RQ-SSI-1946c9-20261005/
      - producer, Red-Team, prior-review, or inter-agent messages
    assigned_to: TASK-20261005-9ebe89
  source_review:
    assigned_to: TASK-20261005-e75154
    intake_is_locator_not_evidence: true
    independent_retrieval_or_hash_verification_required: true
    boundaries:
      - POKE's split-KEM/OPRF correction does not break its Section 4 PKE.
      - FESTA already contemplates circulant masks.
      - PIKE Section 5.1 supplies no PIKE/POKE/EndRing equivalence.
      - Robert applicability requires exact interface and represented-cost audit.
  procedure_deviations: []
  expected_composition:
    raw_checker: tools/check_review_independence.py
    command_shape: >-
      python tools/check_review_independence.py --plan
      coordination/design/TASK-20261005-3ff719/review-preparation/review-plan.yaml --reports
      <new-validator-directory> <new-red-team-directory> --no-addenda
    stable_labels: [J1, J2, J3, J4, J5]
    required_attestation_field: verdicts
    metadata_projection_permitted: false
    whole_claim_verdict_from_individual_reviewer: forbidden
