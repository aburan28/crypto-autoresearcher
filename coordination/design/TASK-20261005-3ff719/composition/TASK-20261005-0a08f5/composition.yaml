  joint_composition:
    J1:
      owner: TASK-20261005-9ebe89
      verdict: holds
      composed_scope: >-
        The producer-free typed conditions are valid: honest totality,
        validation, a single-valued left inverse to the actual message, and
        cross-message separation of the complete recipient view are necessary.
        This says nothing about whether P1-P3 satisfy them.
      controls: >-
        Constant projection fails message separation; a public inverse defeats
        recipient-only advantage; uniqueness of an intermediate object does
        not supply a typed object-to-message arrow.
    J2:
      owner: TASK-20261005-9ebe89
      verdict: holds
      composed_scope: >-
        EndRing-solver-to-secret/decrypt is an attack upper-bound direction,
        not a semantic-security reduction. A valid EndRing-based claim needs
        an arbitrary PKE adversary transformed into an EndRing solver, with
        exact distributions and advantage loss, or a separately named and
        reduced intermediate assumption.
      controls: >-
        EndRing-derived ordinary EC ElGamal remains controlled by its native
        group assumption absent a new adversary-to-EndRing reduction.
    J3:
      owner: TASK-20261005-e75154
      verdict: breaks
      composed_scope: >-
        For the exact immutable P1-P3 definitions only: public sender syntax
        exists, but P1 and P2 have only true-preimage inclusion and lack a
        proof that all compatible coefficients share the message residue; P3
        is an exact constant-observation collision and always decodes to bottom.
      limitation: >-
        No universal P1/P2 cross-message collision was proved; their failure is
        the missing all-message separation/correctness theorem and decoder.
    J4:
      owner: TASK-20261005-e75154
      verdict: breaks
      composed_scope: >-
        For the exact immutable packet: P1 and P2 provide only public
        exponential enumeration, P3 provides public nondecoding validation,
        and no polynomial End(E)-only recipient SecretLift or
        adversary-to-EndRing reduction is supplied.
      route_distinctions:
        P1_Complete_2: >-
          Complete_2 is a named obligation, not an algorithm. It must derive
          the missing action/map information from the exact evaluable End(E)
          secret and P1 ciphertext while resisting public Hom, Robert,
          finite-torsion, fixed-rank, reencryption, and public-inverse routes.
        P2_EndpointLift: >-
          P2 is not merely P1 with a hidden mask. Its SL_2 quotient leaves an
          endpoint-to-coefficient/message lift: once an endpoint path or s is
          known, Y_s and the mask A are public computations. Any successor
          must type and analyze this distinct EndpointLift arrow rather than
          treating recovery of fresh A as the sole obligation.
        key_distribution_public_recovery: >-
          L has no security-parameter lower bound or distribution. Admitted
          short walks permit public path enumeration to the endpoint and
          transport of the known source endomorphism data. Recipient-only
          claims are therefore blocked until KeyGen's L distribution, walk
          rule, bad-key rejection/failure, PPT cost K0, and public enumeration
          bound are frozen and analyzed.
    J5:
      owner: TASK-20261005-e75154
      verdict: holds
      composed_scope: >-
        Holds only for the named primary-source comparisons and the exact
        P1-P3 scope: the POKE correction, FESTA circulant prior art, PIKE
        non-reduction caveat, Robert/Maino interface limits, and the separate
        SÉTA/SiGamal/LIT secrets and assumptions are preserved.
      limitation: >-
        This is not a complete literature search or a novelty, security,
        equivalence, practicality, or deployment conclusion.
  candidate_gate:
    fully_typed_candidate_survives: false
    reason: J3 and J4 both break for every submitted P1-P3 definition.
    implementation_design_eligible: false
  composed_result: >-
    No P1-P3 definition is eligible for implementation design. The packet
    supplies useful public-sender scaffolds and correctly scoped source
    boundaries, but not an actual-message-correct polynomial recipient
    SecretLift or a security reduction. This bounded result leaves other
    EndRing-PKE constructions open.
