review_plan:
  id: "REVIEW-SSI-EVALUATOR-CORR-20261006-476d84"
  goal_id: "GOAL-SSI-2fa82a"
  question_id: "RQ-SSI-1946c9"
  batch_id: "BATCH-6f7b59"
  original_batch_id: "BATCH-bad7f5"
  correction_id: "CORR-20261006-476d84"
  preparation_task: "TASK-20261006-d4ec12"
  preparation_archive: "TASK-20261006-37b90b"
  producer_task: "TASK-20261006-fa5bac"
  producer_snapshot: "TASK-20261006-268d1f"
  reviewer_tasks: ["TASK-20261006-d6eb27", "TASK-20261006-455ff3"]
  composer_task: "TASK-20261006-97107d"
  ledger_archive: "TASK-20261006-93fc33"
  final_decision_reserved: "DEC-20261006-3025de"
  supersedes_for_protocol_only:
    plan: "coordination/design/TASK-20261006-9b6db4/review-preparation/review-plan.yaml"
    failed_composer: "TASK-20261006-7c9a40"
    correction: "CORR-20261006-476d84"
    scope: >-
      Replaces only the review-plan joint labels, fresh reviewer ownership, and
      attestation serialization for a new round. No scientific statement,
      derivation, source reading, verdict, or conclusion from the invalid
      round is changed or inherited.
  temporal_independence_limit: >-
    The original review outputs already exist and are known to the Coordinator.
    They are not disclosed to the fresh fork-none reviewers, who remain mutually
    blind and read only their new cards plus declared immutable producer inputs.
    This later rerun cannot restore a time before those outputs existed and must
    not be counted as extra scientific corroboration merely because it repeats
    J1-J5. It supplies one fresh procedurally independent, checker-valid round.
  claim_under_review: >-
    The immutable TASK-20261006-268d1f snapshot either does or does not supply a
    uniform bit-polynomial algorithm that, from exactly O=End(E), E,C,P,X,D,N
    with D=2^a and N>4D, computes f(U),f(V) for the unique normalized degree-D
    map f:E->C satisfying f(P)=X and reaches the actual message without hidden
    Hom/connection/target-frame/action/orientation/advice or exponential
    preprocessing. Dense interpolation, recursive chain lifting, exact
    calibrated ideal realization, and the evaluator-only escape hatch are
    reviewed only at the submitted scope; no universal EndRing-PKE conclusion
    is requested.
  claim_binding_status: "snapshot_bound"
  claim_binding_rule: >-
    The Red Team checks the pushed TASK-20261006-268d1f snapshot and quotes the
    exact submitted routes before judging J3-J5. The blind Validator reads no
    producer byte except the immutable producer-authored blind-statement.yaml
    and judges J1-J2 only from its new standalone card and that statement.
  coordinator_prior: >-
    Recorded before correction reviewers run and unchanged in substance from
    the original pre-review prior: N>4D plausibly identifies one normalized
    map but does not construct it; the submitted dense interpolation appears
    numeric-D, recursive chain lifting appears exponential without a local
    predicate, and ideal-class data appears insufficient without an exact
    calibrated evaluated realization. None of those observations rules out a
    transposed evaluator returning only f(U),f(V). The likely corrected result
    is one localized missing theorem/interface rather than a finalist, but a
    complete uniform evaluator would overturn this prior. These are priors,
    never inherited reviewer verdicts.
  scientific_verdicts_inherited: false
  messages_used_as_scientific_input: false
  canonical_attestation_schema:
    top_level: "review_attestation"
    required_fields: ["task_id", "joints_owned", "verdicts"]
    blind_validator_additional_required: ["sources_read", "blind_from_respected", "read_sibling_reports", "independent_session"]
    red_team_additional_required: ["sources_read", "read_sibling_reports", "independent_session"]
    verdict_mapping_keys: ["J1", "J2", "J3", "J4", "J5"]
    verdict_values: ["holds", "breaks", "inconclusive"]
    forbidden_aliases: ["canonical_verdicts", "per_joint_verdict", "per_joint_verdicts", "review_id", "jurisdiction"]
  joints:
    - id: "J1"
      joint: "J1 -- Uniqueness, quantifier order, observable collisions, and representation-scoped lower-bound logic."
      assigned_to: "TASK-20261006-d6eb27"
      attack_plan: >-
        From the immutable bare statement rederive the N>4D singleton argument
        with exact-order, normalization, degree, and codomain premises. Search
        relaxed N<=4D, zero/non-generator P, automorphism, wrong-degree, and
        equivalent-codomain collisions. State the one-program-for-all-instances
        quantifier order and reject hidden per-instance witnesses. Derive dense
        output cost only for the named representation and refuse to transfer it
        to two-point evaluation without a charged reduction.
      breaking_artifact: >-
        A collision in the claimed exact fiber, a missing admission premise,
        nonuniform advice, or a lower-bound inference whose premises do not
        cover evaluator-only output.
    - id: "J2"
      joint: "J2 -- Typed transposed/sublinear evaluator and returned-object-to-actual-message path."
      assigned_to: "TASK-20261006-d6eb27"
      attack_plan: >-
        Type PreEval, Eval2, certificate checking, and Decode from only
        O,E,C,P,X,D,N,U,V,k. Charge construction, preprocessing, output, bit
        time, space, randomness, and failure. Exclude Hom/connection/target
        action/frame/orientation/advice. Follow exact f(U),f(V) through order
        checks, normalization, scalar inversion or slope extraction, and the
        power-of-two decoder to actual m on every admitted honest message.
      breaking_artifact: >-
        No executable uniform two-point evaluator, hidden target/Hom input,
        superpolynomial cost, incomplete admission, or failure to recover the
        actual message.
    - id: "J3"
      joint: "J3 -- Orbit rational/Padé interpolation, dense output/data bounds, and compression escape hatch."
      assigned_to: "TASK-20261006-455ff3"
      attack_plan: >-
        Reconstruct every orbit sample, equation, rational degree bound,
        degeneracy check, signed calibration step, field/bit cost, memory, and
        output. Attempt streaming, fast multipoint, rational reconstruction,
        modular-composition, circuit, and supplied-chain countermodels. Keep
        every Omega/Theta(D) statement scoped to the submitted dense/structured
        representation unless an explicit evaluator-to-dense reduction exists.
      breaking_artifact: >-
        Uncharged numeric-D data/work, insufficient independent equations,
        missing calibration/certificate, or a representation-bound cost used
        as a universal evaluator lower bound.
    - id: "J4"
      joint: "J4 -- Recursive forward/backward 2-isogeny lifting, typed point transport, branch collisions, and local pruning."
      assigned_to: "TASK-20261006-455ff3"
      attack_plan: >-
        Type every forward and backward edge map and point update before using
        the midpoint join. Count initial and nonbacktracking paths, cycles,
        mergers, endpoint collisions, boundary dual edges, and meet-in-the-
        middle storage. At each prefix require an actually available, sound,
        complete, and costed pruning predicate; endpoint/full-path checks do
        not count as local pruning.
      breaking_artifact: >-
        An ill-typed recurrence, exponential search hidden as recursion, an
        unsound/incomplete local predicate, collision-blind branch count, or
        an unsupported universal lower bound.
    - id: "J5"
      joint: "J5 -- Quaternion/ideal selection, exact calibration/evaluation, PKE obligations, sources, visuals, and claim hygiene."
      assigned_to: "TASK-20261006-455ff3"
      attack_plan: >-
        Expand norm/index/cyclicity, saturation, KLPT/enumeration, right order,
        effective Deuring realization, exact public codomain C, every
        isomorphism/automorphism, signed P->X calibration, evaluation on U,V,
        certificate, and full bit costs. Remove each forbidden auxiliary input.
        Check O1-O6, reduction direction, source provenance, snapshot/report/
        diagram/PDF consistency, and route-scoped wording.
      breaking_artifact: >-
        Only an ideal class/right order/equivalent codomain, a hidden connecting
        object, uncharged realization, wrong security arrow, unchecked source,
        stale visual claim, or widened novelty/impossibility/PKE conclusion.
  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      The corrected Validator and Red Team own disjoint joints in fresh
      fork-none independent sessions. Neither may read, list, receive, or be
      summarized the sibling report, either original BATCH-bad7f5 review
      directory, the failed composer release's scientific summary, the new
      plan, composition, messages, Git history, or conversation context except
      where its standalone card explicitly lists an immutable input. The
      composer reads both corrected reports only after both are terminal.
  proves_too_much:
    objects:
      - object: "A dense degree-D rational-map serialization versus a supplied succinct chain/oracle/circuit returning only f(U),f(V)."
        known_false: "A dense output-size bound alone rules out every two-point evaluator."
        expected_signature: "The bound remains representation-scoped unless a charged reconstruction reduction is proved."
        assigned_to: "TASK-20261006-d6eb27"
      - object: "A unique marked map in an exponentially described family."
        known_false: "Uniqueness alone supplies a uniform polynomial construction or evaluator."
        expected_signature: "Identifiability and algorithmic access remain separate obligations."
        assigned_to: "TASK-20261006-d6eb27"
      - object: "N<=4D, zero/non-generator P, x-only normalization, target automorphisms, relaxed degree, or equivalent codomain."
        known_false: "The exact N>4D normalized singleton proof survives every relaxation."
        expected_signature: "A collision or explicit failed premise appears without contaminating the exact admitted case."
        assigned_to: "TASK-20261006-d6eb27"
      - object: "A known degree-two chain supplied as input."
        known_false: "Fast evaluation of a supplied chain proves fast discovery from the declared public interface."
        expected_signature: "Construction/search and evaluation remain separately charged."
        assigned_to: "TASK-20261006-455ff3"
      - object: "Endpoint or full-composition verification presented as a prefix-local pruning predicate."
        known_false: "A property available only after full composition prunes every local branch."
        expected_signature: "Predicate timing, soundness, completeness, and cost are explicit; absent these, no pruning credit is given."
        assigned_to: "TASK-20261006-455ff3"
      - object: "An ideal class, right order, equivalent codomain, or abstract Hom module without a calibrated evaluated representative."
        known_false: "Class-level data automatically yields exact f(U),f(V) on public C with P mapped to X."
        expected_signature: "Realization, exact-C isomorphism, automorphism calibration, and evaluation remain visible."
        assigned_to: "TASK-20261006-455ff3"
      - object: "A solver-to-decrypt attack path."
        known_false: "An attack upper bound is an IND-CPA adversary-to-EndRing reduction."
        expected_signature: "Security reduction direction and the exact public distribution remain open unless separately proved."
        assigned_to: "TASK-20261006-455ff3"
    failure_signature: >-
      Any argument that rules out every evaluator from dense output size,
      constructs from uniqueness, credits full-path work as local pruning,
      equates ideal-class data with the exact evaluated map, or reverses the
      security arrow has proved too much and receives a scoped break.
    assigned_to: "TASK-20261006-455ff3"
  blind_rederivation:
    required: true
    quantity: >-
      Q1: normalized degree-D uniqueness and its collision/admission boundary
      under N>4D. Q2: dense representation size versus two-point evaluator
      output size. Q3: nonbacktracking and balanced-table scale with collision
      caveats. Q4: exact typed f(U),f(V)-to-m derivation and its admission,
      evaluation, and decoder failure partition.
    parameters: >-
      E,C,D=2^a,N>4D,P,X,U,V,k; standard homomorphism degree inequalities;
      bare representations and evaluator signatures supplied only by the
      immutable producer-authored blind statement.
    blind_from:
      - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/evaluator-reconstruction-search.md"
      - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/interpolation-route.yaml"
      - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/chain-lifting-route.yaml"
      - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/calibrated-ideal-route.yaml"
      - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/transposed-evaluator.yaml"
      - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/proof-search-map.yaml"
      - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/scheme-obligation-delta.yaml"
      - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/attack-gates.yaml"
      - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/provenance.yaml"
      - "research/ssi-endring-pke/2026-10-06-low-degree-evaluator-search/"
      - "coordination/design/TASK-20261006-9b6db4/review-preparation/review-plan.yaml"
      - "coordination/design/TASK-20261006-9b6db4/reviews/"
      - "coordination/design/TASK-20261006-d4ec12/review-preparation/review-plan.yaml"
      - "coordination/design/TASK-20261006-d4ec12/handoffs/TASK-20261006-455ff3.yaml"
      - "coordination/design/TASK-20261006-d4ec12/reviews/TASK-20261006-455ff3/"
      - "coordination/design/TASK-20261006-d4ec12/composition/"
      - "coordination/goals/GOAL-SSI-2fa82a/batches/BATCH-bad7f5/claims/TASK-20261006-7c9a40.1.release.json"
      - "producer, Coordinator, sibling, original-review, composition, and scientific inter-agent messages"
    assigned_to: "TASK-20261006-d6eb27"
    allowed_sources:
      - "coordination/design/TASK-20261006-d4ec12/handoffs/TASK-20261006-d6eb27.yaml"
      - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/blind-statement.yaml"
  source_review:
    assigned_to: "TASK-20261006-455ff3"
    intake_is_locator_not_evidence: true
    independent_retrieval_or_hash_verification_required: true
    boundaries:
      - "No recalled citation supports a theorem, complexity claim, or novelty label; unavailable source records a precise impediment."
      - "Preserve source version, locator/hash, exact theorem/interface, assumptions, output representation, and reduction direction."
      - "The original red-team source findings are not inputs and supply no inherited verdict."
  expected_composition:
    raw_checker: "tools/check_review_independence.py"
    command: "python3 tools/check_review_independence.py --plan coordination/design/TASK-20261006-d4ec12/review-preparation/review-plan.yaml --reports coordination/design/TASK-20261006-d4ec12/reviews/TASK-20261006-d6eb27 coordination/design/TASK-20261006-d4ec12/reviews/TASK-20261006-455ff3 --no-addenda"
    stable_labels: ["J1", "J2", "J3", "J4", "J5"]
    required_attestation_field: "verdicts"
    required_task_field: "task_id"
    required_ownership_field: "joints_owned"
    verdict_values: ["holds", "breaks", "inconclusive"]
    metadata_projection_permitted: false
    review_or_plan_repair_permitted: false
    original_verdict_import_permitted: false
    whole_claim_verdict_from_individual_reviewer: "forbidden"
  inference:
