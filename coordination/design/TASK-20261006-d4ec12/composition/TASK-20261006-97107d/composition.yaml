  corrected_owner_verdicts:
    J1:
      owner: TASK-20261006-d6eb27
      verdict: breaks
      composition: >-
        The frozen admitted interface does not require P to have exact order N.
        P=0 permits the signed f versus -f collision, so the claimed singleton
        is false at the submitted quantifier scope.  Singleton uniqueness under
        exact ord(P)=N, fixed exact models, and exact degree remains only a
        conditional lemma; it is neither a constructor nor a universal
        evaluator lower bound.
    J2:
      owner: TASK-20261006-d6eb27
      verdict: breaks
      composition: >-
        Bare U,V in E[D] do not ensure a basis or nondegenerate decoder input.
        For example V=0 makes f(V)=0 and destroys the required order check, so
        distinct messages can share the admitted public relation.  The digit
        decoder is correct only after explicit basis, order, admission, and
        certified-evaluator preconditions; actual-message recovery is not
        established for the frozen claim.
    J3:
      owner: TASK-20261006-455ff3
      verdict: holds
      composition: >-
        On the stronger honest exact-order assumptions stated by the route,
        2D orbit samples give the checked dense rational reconstruction and
        signed calibration.  The resulting sample, representation, solve, and
        evaluation costs are numeric-D scale, hence exponential in a=log2(D).
        This is a route-specific accounting result and not an impossibility
        theorem for a compact or transposed evaluator.
    J4:
      owner: TASK-20261006-455ff3
      verdict: holds
      composition: >-
        The submitted forward/backward point transport and labelled midpoint
        join are type-correct for enumerated nonbacktracking chains.  The
        balanced search still has exponential state scale and no supplied
        locally checkable predicate has a proved polynomial survivor bound.
        Cycles, mergers, or curve-only joins do not supply that missing bound.
    J5:
      owner: TASK-20261006-455ff3
      verdict: holds
      composition: >-
        The ideal route correctly distinguishes an ideal class or right order
        from the exact calibrated degree-D map on the published models.  The
        required CALIBRATED_IDEAL_REALIZE selector and evaluator on U,V is not
        instantiated, and no polynomial success, preprocessing, memory, or
        failure bound is supplied.
  route_synthesis:
    dense_orbit_route: >-
      A finite checked construction exists only with explicit O(D)-scale data
      and work under stronger honest assumptions.  No universal evaluator
      lower bound follows.
    chain_route: >-
      The typed meet-in-the-middle construction remains exponential without a
      sound, complete, locally checkable pruning theorem with a polynomial
      survivor bound.
    ideal_route: >-
      Exact public-C and signed-X calibration plus an executable evaluator are
      still missing; an equivalent class is not an acceptable output.
    evaluator_only_route: >-
      A query-only or transposed polynomial evaluator is not ruled out, but no
      such uniform construction is supplied.
  finalist_gate:
    requirements:
      uniform_executable_two_point_evaluator_or_exact_calibrated_map: not_met
      actual_message_recovery_on_every_admitted_honest_instance: not_met
      polynomial_bit_time_memory_preprocessing_output_and_failure_bounds: not_met
      no_hidden_hom_connection_target_frame_action_or_instance_advice: not_demonstrated_by_any_candidate
    passed: false
    finalists: []
    reason: >-
      J1 and J2 break the frozen interface and message claim, while the three
      route audits that hold identify only exponential constructions or a
      missing exact-realization interface.  None satisfies every conjunct of
      the explicit finalist gate.
  claim_boundary:
    established: >-
      The corrected round validates scoped diagnostics for the dense, chain,
      and ideal routes and identifies two concrete admission defects.
    not_established:
      - a bit-polynomial EndRing-based public-key encryption scheme
      - a universal lower bound or impossibility of succinct evaluation
      - confidentiality or IND-CPA security
      - novelty
      - practicality, deployment readiness, or family closure
  temporal_independence_limit: >-
    The corrected reviewers were fresh and mutually blind, but the earlier
    invalid outputs already existed.  This correction cannot restore the
    earlier temporal boundary and does not count as an additional independent
    corroboration round.
