    role: idea-generator
    mode: bounded_zero_run_design
    objective: >-
      Repair and test the public admission and decoder interface before any
      further evaluator claim: require and efficiently check exact ord(P)=N,
      specify U,V as an admissible ordered D-torsion basis with the necessary
      nondegeneracy and image-order conditions, fix exact curve/model tags,
      and prove that the ciphertext relation is injective in the message and
      that the digit decoder returns the actual message for every admitted
      honest instance.
    input_boundary:
      allowed:
        - the frozen producer blind statement and typed public interface
        - the corrected J1 and J2 counterexamples and conditional lemmas
        - the corrected J3-J5 route boundaries as non-finalist controls
      forbidden:
        - original invalid review content or verdicts
        - hidden Hom(E,C), connection maps, target frames, target actions, orientations, sender maps, duals, or per-instance advice
        - exponential per-instance preprocessing presented as polynomial online work
    required_output:
      - one explicit efficiently decidable admission predicate
      - a complete key-generation compatibility argument for that predicate
      - an injectivity and actual-message decoder theorem with all failure cases
      - an updated statement that keeps exact-map construction or two-point evaluation as a separate unsolved obligation
      - a cost and failure ledger with no scientific runs
    branches:
      positive: >-
        If the predicate is efficiently checkable, honest key generation
        satisfies it, and injectivity plus actual-message recovery are proved,
        preserve the repaired interface and separately re-rank the still-open
        uniform two-point evaluator obligation; do not call the scheme a
