      negative: >-
        If honest key generation cannot guarantee the predicate or a
        cross-message collision remains, record the scoped interface failure
        and redesign the encoding before spending a new batch on evaluator
        construction; infer no EndRing impossibility.
      inconclusive: >-
        Freeze the smallest unresolved admission, key-generation, or decoder
