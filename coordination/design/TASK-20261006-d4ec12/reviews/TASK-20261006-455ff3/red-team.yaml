red_team_review:
  task_id: TASK-20261006-455ff3
  role: red-team
  objective: corrected-round adversarial review of J3, J4, and J5 only
  joints_owned: [J3, J4, J5]
  review_round:
    kind: fresh_corrected_round
    earlier_round_status: invalid
    earlier_round_material_read: false
    temporal_corroboration_added: false
    disclosure: >-
      This is one fresh corrected round after an invalid earlier round.  The
      earlier findings were neither sought nor guessed, so this review is one
      independent assessment and not temporal corroboration.
  scoped_verdicts:
    J3:
      verdict: holds
      proposition: >-
        Under the stated honest exact-model assumptions, the 2D orbit samples
        reconstruct a unique dense degree-D rational map and its signed y
        action; the producer correctly confines the resulting Omega(D)-scale
        cost to this dense construction and does not claim a universal
        evaluator lower bound.
      reconstruction:
        parameters: "D=2^a, N=5^b, ord(P)=ord(X)=N, N>4D"
        samples: "u_i=x([i]P), v_i=x([i]X), 1<=i<=2D"
        distinctness: >-
          If u_i=u_j then [i]P=+/-[j]P.  For 1<=i<j<=2D,
          0<j-i<N and 0<i+j<=4D<N, so neither congruence is possible.
        pade_unknowns: >-
          A has D+1 coefficient slots and B has D slots, for 2D+1
          homogeneous unknowns against 2D equations
          A(u_i)-v_i B(u_i)=0, with deg(A)<=D and deg(B)<=D-1.
        uniqueness: >-
          For two solutions representing reduced candidates, A1*B2-A2*B1
          has degree at most 2D-1 and all 2D distinct u_i as roots; it is zero.
          Exact degree D removes representation slack, and canonical scaling
          plus gcd reduction fixes the dense representative.
        signed_calibration: >-
          On short Weierstrass models, writing f(x,y)=(R(x),y*S(x)) gives
          S=R'/c.  Since N is odd, y(P) and y(X) are nonzero, and the signed
          sample fixes c=R'(x(P))*y(P)/y(X).  Replacing X by x(X) would leave
          the f versus -f ambiguity.
        checked_output: >-
          Coprimality, sample poles, kernel rank, exact degree, separability,
          the cleared E-to-C identity, exact model tags, and f(P)=X must be
          checked before evaluating U and V.
        message_path: >-
          With A0=f(U), B0=f(V), H=[2^(a-k)]B0 and
          G=-[2^(a-k)]A0, the cyclic kernel relation gives G=[m]H.  Checking
          ord(B0)=D, ord(H)=2^k, the digit loop, and [m]H=G returns the actual
          m=s mod 2^k.
      cost_audit:
        sample_generation: "2D point multiples/group operations"
        structured_solve: "degree-D polynomial arithmetic, at best softly linear in numeric D for this representation"
        dense_output: "Theta(D log p) bits, including A/B data and signed calibration up to constant-size metadata"
        dense_evaluation: "representation-scoped numeric-D work on each of U and V"
        encoded_bit_consequence: "D=2^a, so these dense-route costs are exponential in encoded a"
        universal_lower_bound: false
      evaluator_countermodels:
        - >-
          A transposed query algorithm could in principle return only f(U),f(V)
          with small output; dense output size alone therefore cannot rule it
          out.  The producer preserves this possibility as
          MISSING_SUBLINEAR_ORBIT_EVALUATOR.
        - >-
          A compact length-a degree-two circuit would also evade dense output,
          but constructing it from the allowed input is Route B and remains an
          exponential search in the submitted analysis.
        - >-
          A compact ideal label could be succinct, but without an evaluator it
          does not answer either query; this is kept separate in Route C.
      controls:
        nearby_false_observation: "x(X) alone retains f/-f"
        construction_from_uniqueness: rejected
        numeric_D_called_bit_polynomial: rejected
        dense_output_called_universal_lower_bound: rejected
      assumptions:
        - exact labelled short-Weierstrass models over the represented odd-characteristic field
        - an admitted honest separable homomorphism of exact degree D
        - exact odd order N for P and X and strict N>4D
        - exact arithmetic and successful certificate verification
      limitations:
        - no bit-polynomial evaluator is proved impossible
        - workspace lower bounds are representation-specific and not a theorem about every evaluator
        - malformed and plausible wrong-key inputs have only the stated local rejection behavior
      next_falsifier: >-
        Give a uniform poly(a,log p,B)-time and polynomial-memory evaluator for
        f(U),f(V) from only the allowed inputs, or exhibit an honest admitted
        instance on which the Padé rank, calibration formula, or checked curve
        identity fails despite exact degree D and N>4D.
    J4:
      verdict: holds
      proposition: >-
        The forward/backward degree-two search is type-correct and the labelled
        midpoint predicate is sound and complete for enumerated nonbacktracking
        cyclic chains.  Its balanced tables remain exponential, and no
        uncosted prefix-pruning claim is made.
      typed_transport:
        forward_edge: "phi:A->B with q_B=phi(q_A)"
        backward_edge: >-
          For a forward-oriented degree-two edge psi:M->T and q_T in T[N],
          set q_M=[2^(-1) mod N]*dual(psi)(q_T).  Then
          psi(q_M)=[2^(-1)]*[2]q_T=q_T, so the update is well typed and unique
          because gcd(2,N)=1.
        forward_state: "exact midpoint model, composed E->mid evaluator, image of P, and forbidden dual-edge label"
        backward_state: "exact midpoint model, composed mid->C evaluator, preimage of X, and forbidden dual-edge label"
        meet: >-
          Enumerate an explicit midpoint-model isomorphism, transport the
          forward P-image through it, compare with the backward X-preimage,
          and check that the two boundary edge labels are not dual.  A
          curve-only collision is not enough.
      branch_audit:
        depth_zero: 1
        positive_depth: "3*2^(d-1) path-labelled states before mergers"
        split: "t=floor(a/2), a-t=ceil(a/2)"
        table_scale: "Theta(2^(a/2)) up to constant and polynomial field/a factors"
        memory: "the same exponential state scale for a balanced stored table"
        cycles: >-
          Cycles do not remove path obligations.  State identity retains the
          transported point and forbidden edge, so revisiting a normalized
          curve alone is not a valid deduplication.
        mergers: >-
          Normalized-curve mergers are useful only when the full typed state
          agrees.  No uniform polynomial compression follows from
          instance-specific mergers.
        boundary_duals: >-
          A last prefix edge followed by its dual would introduce a [2]
          factor and a noncyclic local kernel; explicit edge labels must reject
          it even for self-loops or multiple edges with the same endpoint.
        endpoint_collisions: >-
          Equal endpoint curves or j-invariants do not suffice.  Exact model
          isomorphism, transported signed point equality, degree, composition,
          and final f(P)=X are required.
      pruning_audit:
        credited_prefix_predicates:
          - parser and domain validity
          - nonsingularity and exact degree-two kernel validity
          - point-order preservation
          - exact model isomorphism checks
          - immediate nonbacktracking by labelled dual edge
        not_credited: >-
          Endpoint C and f(P)=X are full-path checks.  No additional
          prefix-available, sound, complete, and costed extendability predicate
          is supplied or credited.
      controls:
        curve_only_join: rejected
        endpoint_only_pruning: rejected
        unlabelled_boundary_edge: rejected
        merger_as_uniform_bound: rejected
      assumptions:
        - the inherited fully rational two-power setting supplies the three labelled degree-two kernels at each step
        - exact model normalization and all relevant isomorphisms are enumerable and charged
        - chain states retain evaluators or complete edge descriptions rather than curve names alone
      limitations:
        - no polynomial bound is derived from cycles, automorphisms, or join-bucket multiplicities
        - resource truncation would be an infrastructure failure, not evidence of no matching chain
        - no authenticated universal rejection theorem is given for plausible nonhonest inputs
      next_falsifier: >-
        Supply a prefix-available predicate with proved soundness,
        completeness, polynomial evaluation cost, and a uniform polynomial
        survivor bound, or show a labelled boundary/self-loop case in which
        the stated dual update or meet accepts a noncyclic or uncalibrated map.
    J5:
      verdict: holds
      proposition: >-
        The ideal route does not confuse an ideal class, right order, or
        equivalent codomain with the required exact evaluated output.  It
        correctly stops at an uninstantiated calibrated-realization interface
        and supplies no polynomial success claim.
      exact_object_audit:
        ideal: "proper primitive left O-ideal I with nrd(I)=D and [O:I]=D^2"
        local_condition: "cyclic 2^a local type, not merely equivalent ideal class"
        right_order: "O_R(I) with a certified geometric identification to End(C)"
        exact_map: "separable cyclic f_I:E->C of exact degree D on the published models"
        calibration: "all codomain isomorphisms and residual automorphisms searched and checked against the full signed f_I(P)=X"
        evaluator: "an executable chain/map acting on U and V, with certificates"
      charged_operations:
        - integral lattice representation, left stability, HNF/SNF index, norm, primitivity, and cyclicity
        - saturation, denominator removal, exact divisions, and intermediate coefficient growth
        - ideal selection or enumeration and every KLPT attempt, auxiliary norm, smoothness condition, and inverse-success amplification
        - right-order basis, multiplication/discriminant certificates, and effective Deuring realization
        - exact public-C isomorphisms, residual automorphisms, global normalization, and signed P-to-X calibration
        - ideal-to-kernel, kernel-to-chain/map conversion, evaluation on U and V, memory, output, and failures
      decisive_boundary: >-
        HNF/SNF can verify a supplied candidate but cannot select the target
        class.  KLPT can return an equivalent smoother ideal without preserving
        norm D, cyclic type, exact C, or X.  A right order or ideal class has no
        well-typed action on U,V until CALIBRATED_IDEAL_REALIZE returns an exact
        evaluated map and complete certificate.
      controls:
        equivalent_class_equals_exact_output: rejected
        isomorphic_codomain_equals_exact_C: rejected
        right_order_equals_evaluator: rejected
        uncharged_KLPT_or_Deuring_oracle: rejected
        ideal_name_feeds_decoder: rejected
      assumptions:
        - represented O has valid multiplication, reduced-norm, and evaluator certificates
        - any future realization theorem is uniform over every admitted honest instance
        - exact norm, model, column, runtime, memory, output, preprocessing, and failure guarantees are mandatory
      limitations:
        - no target ideal selector or calibrated realization algorithm is instantiated
        - no success probability or amplification cost is established
        - no theorem rules out a future compact exact realizer
      next_falsifier: >-
        Instantiate CALIBRATED_IDEAL_REALIZE from the allowed input alone with
        exact norm-D cyclic output, exact public C and signed X calibration,
        an executable map on U,V, and uniform polynomial bit-time, memory,
        preprocessing, output, success, and failure bounds.
  cross_joint_dependency_removals:
    Hom_anchor:
      present_in_allowed_input: false
      first_unavailable_operation: "identify a selected left-ideal class with an exact element of Hom(E,C)"
      consequence: "an ideal/right-order relation cannot be used as f or evaluated on U,V"
    connection_map:
      present_in_allowed_input: false
      first_unavailable_operation: "seed the E-to-C path or transport source structures directly to C"
      consequence: "Route B must enumerate paths and Route C must solve exact realization instead of looking up a connection"
    target_action_or_frame:
      present_in_allowed_input: false
      first_ill_typed_operation: "apply an abstract right-order element to a point of exact C"
      consequence: "codomain equality and f(U),f(V) are unavailable"
    orientation:
      present_in_allowed_input: false
      first_unavailable_operation: "choose a compatible algebra-to-geometry embedding at the target"
      consequence: "effective Deuring output is not calibrated to the published C and signed X"
    sender_map_or_dual:
      present_in_allowed_input: false
      first_unavailable_operation: "directly evaluate f or pull points back with the retained sender dual"
      consequence: "A0 and B0 cannot be supplied without reconstructing an evaluator"
    per_instance_advice:
      present_in_allowed_input: false
      first_unavailable_operation: "select the correct path/ideal from an advised index"
      consequence: "the submitted alternatives revert to charged exponential enumeration"
    exponential_preprocessing:
      permitted: false
      first_unavailable_operation: "query a precomputed per-instance path, orbit basis, or ideal table"
      consequence: "dense, chain, and ideal-table work cannot be relabelled polynomial online evaluation"
  obligation_and_claim_boundary:
    O1: "open; no exact EndRing challenge distribution and output relation is reduced to the full admitted key distribution"
    O2: "open; no efficient honest recipient algorithm is supplied"
    O3: "open; actual-message recovery is conditional on admission and an exact evaluated f"
    O4: "open; finite public reconstruction gives no recipient-only polynomial advantage"
    O5: "open; an EndRing solver followed by decoding is solver-to-decrypt only, not an IND-CPA-adversary-to-EndRing reduction"
    O6: "open; serializers, rejection leakage, accepted-law support, repeated ciphertext behavior, and side channels remain incomplete"
    prohibited_inferences:
      - confidentiality or IND-CPA security
      - novelty
      - practicality or deployment readiness
      - family closure
      - universal impossibility of succinct evaluation
  source_audit:
    immutable_hash_manifest: >-
      All fourteen producer artifact SHA-256 values recomputed from the
      declared snapshot match snapshot-receipt.json exactly.
    archive_binding_limit: >-
      The receipt has commit_sha=null and describes a Git-history resolution
      procedure.  Git history is forbidden by this handoff, so pushed
      reachability and the unique archive commit were not independently
      resolved.
    primary_source_limit: >-
      The immutable inputs contain producer KB-tier citations and provenance,
      but not the underlying literature records or primary papers.  The exact
      read scope forbids opening them, so theorem-level source verification is
      unavailable; the producer's reported/abstract/first-pages tiers and
      unverified novelty status must remain unchanged.
    external_retrievals: 0
    source_based_break: false
  visual_audit:
    scientific_alignment: >-
      Markdown, Mermaid, SVG, and PDF agree on one mechanism, Routes A/B/C,
      the two named missing interfaces, the exact decoder, zero finalists,
      and zero measured scientific results.
    presentation_findings:
      - >-
        The editable Mermaid has separate certified-evaluator and decoder
        nodes and direct outcome edges from both cost/missing-interface nodes;
        the authored SVG/PDF collapses evaluator and decoder into one box and
        routes the outcome only through message output.  This is source/render
        structural drift, not a scientific contradiction.
      - >-
        Several SVG edge labels overlap node text or borders (notably orbit
        samples, dense accounting, branch count, exact realization, and the
        two if-instantiated labels).  The PDF embeds the same cramped diagram
        at smaller scale.  This is a legibility defect only.
    scientific_evidence_from_visual_defects: false
  accounting:
    scientific_runs: 0
    implementation_runs: 0
    formalizer_runs: 0
    experiment_runs: 0
    commits: 0
    pushes: 0
    claims_or_releases: 0
    state_transitions: 0
