attack_matrix:
  task_id: TASK-20261006-455ff3
  joints_owned: [J3, J4, J5]
  canonical_verdict_location: review-attestation.yaml
  attacks:
    - id: J3-A1
      joint: J3
      target: orbit sample distinctness
      attack: "force x([i]P)=x([j]P) among 1<=i<j<=2D"
      derivation: "equality implies i congruent to +/-j mod N; both |i-j| and i+j are positive and strictly below N because N>4D"
      outcome: survived
      consequence: "the 2D interpolation abscissae remain distinct on honest input"
    - id: J3-A2
      joint: J3
      target: Padé underdetermination
      attack: "construct two reduced functions with deg(A)<=D and deg(B)<=D-1 satisfying all samples"
      derivation: "their cross-difference has degree <=2D-1 and 2D roots, hence vanishes identically"
      outcome: survived_under_exact_degree_and_reduction_checks
      consequence: "only projective scaling remains; malformed rank/gcd/pole cases are rejected"
    - id: J3-A3
      joint: J3
      target: y-sign calibration
      attack: "replace the full signed sample by x(X) or make the calibration denominator vanish"
      derivation: "x(X) admits f/-f, but exact odd order N makes y(P),y(X) nonzero and the full signed X fixes c"
      outcome: control_separates_the_relaxed_case
      consequence: "the claimed exact-input construction remains calibrated; the relaxed observable does not"
    - id: J3-A4
      joint: J3
      target: hidden numeric-D work
      attack: "count 2D samples, polynomial solve dimensions, coefficient bits, evaluation work, and certificate work in encoded-bit complexity"
      derivation: "D=2^a, so every numeric-D term is exponential in encoded a"
      outcome: producer_charges_the_work
      consequence: "Route A is a finite public upper bound, not a bit-polynomial finalist"
    - id: J3-A5
      joint: J3
      target: representation lower bound overreach
      attack: "posit a compact/transposed evaluator returning only f(U),f(V)"
      derivation: "small output evades the dense-output argument; no impossibility theorem follows from dense coefficient count"
      outcome: producer_scopes_the_claim_and_leaves_the_interface_open
      consequence: "no universal lower bound is credited"
    - id: J3-A6
      joint: J3
      target: actual-message recovery
      attack: "show that returned objects stop at W, Y, an ideal, or an unevaluated map name"
      derivation: "the accepted path explicitly evaluates f(U),f(V), checks the two-power orders, recovers m, and verifies [m]H=G"
      outcome: survived_conditionally_on_a_certified_f
      consequence: "the output is actual m, not a proxy, while evaluator failure remains separate"
    - id: J4-A1
      joint: J4
      target: backward-map typing
      attack: "apply a forward edge to X on the wrong curve or omit division by two on N-torsion"
      derivation: "for psi:M->T, [2^(-1) mod N]*dual(psi)(q_T) lies on M and maps back to q_T"
      outcome: survived
      consequence: "the backward transported point is unique and type correct"
    - id: J4-A2
      joint: J4
      target: branch count
      attack: "include all labelled degree-two kernels and prohibit only the immediately dual edge"
      derivation: "there are 3 choices at positive depth one and 2 thereafter, yielding 3*2^(d-1)"
      outcome: survived
      consequence: "balanced prefix/suffix state scale is exponential in a"
    - id: J4-A3
      joint: J4
      target: curve-only midpoint collision
      attack: "join equal normalized midpoint curves with unequal transported points"
      derivation: "such a join need not send P to X; the submitted predicate also transports through an explicit isomorphism and compares labelled points"
      outcome: rejected_by_submitted_predicate
      consequence: "soundness is not inferred from a j-invariant or endpoint alone"
    - id: J4-A4
      joint: J4
      target: cycles and mergers
      attack: "deduplicate every revisit of a normalized curve"
      derivation: "the transported point, forbidden dual edge, model isomorphism, and evaluator/path description are part of the state"
      outcome: invalid_compression_not_credited
      consequence: "instance mergers supply no uniform polynomial bound"
    - id: J4-A5
      joint: J4
      target: boundary dual and multiple-edge cases
      attack: "join halves whose adjacent labelled edges are dual, including a self-loop or common-codomain collision"
      derivation: "the boundary edge labels, not just endpoint curves, must be compared; a dual pair creates a [2] factor and violates the cyclic-chain condition"
      outcome: rejected_by_consistency_check
      consequence: "the path family remains nonbacktracking across the split"
    - id: J4-A6
      joint: J4
      target: uncharged local pruning
      attack: "relabel final endpoint/column verification as a cheap prefix test"
      derivation: "C and f(P)=X are available only after compatible halves meet; no additional sound/complete local predicate is supplied"
      outcome: no_pruning_credit_awarded
      consequence: "the exponential table bound remains"
    - id: J4-A7
      joint: J4
      target: meet-in-the-middle memory
      attack: "hide the forward table or all composed maps as free preprocessing"
      derivation: "the producer charges Theta(2^(a/2)) state memory up to polynomial factors and forbids external preprocessing"
      outcome: producer_charges_the_memory
      consequence: "Route B does not meet the encoded-bit gate"
    - id: J5-A1
      joint: J5
      target: ideal norm and index
      attack: "substitute an equivalent ideal with smoother auxiliary norm"
      derivation: "equivalence does not preserve exact nrd(I)=D, [O:I]=D^2, or cyclic local type"
      outcome: rejected
      consequence: "norm/index/primitivity/cyclicity must be re-certified"
    - id: J5-A2
      joint: J5
      target: class-to-codomain confusion
      attack: "accept an isomorphic codomain or matching right order as exact public C"
      derivation: "effective realization, every C-isomorphism, residual automorphism, model transport, and signed f(P)=X check remain necessary"
      outcome: rejected
      consequence: "equivalent class/codomain is not exact output"
    - id: J5-A3
      joint: J5
      target: unevaluated ideal
      attack: "feed I or O_R(I) directly to the U,V decoder"
      derivation: "neither object has a typed point-action interface on exact C"
      outcome: rejected_at_CALIBRATED_IDEAL_REALIZE
      consequence: "f(U),f(V) and hence m remain unavailable"
    - id: J5-A4
      joint: J5
      target: hidden KLPT/enumeration work
      attack: "omit attempt counts, smoothness assumptions, success probability, amplification, or path enumeration"
      derivation: "the submitted route names each charge and supplies no polynomial bound or success claim"
      outcome: missing_algorithm_remains_explicit
      consequence: "Route C is not a finalist"
    - id: J5-A5
      joint: J5
      target: saturation and coefficient growth
      attack: "treat denominator removal, saturation, and exact division as free fixed-rank algebra"
      derivation: "the route explicitly requires their bit costs, intermediate growth, and certificates"
      outcome: uncharged_oracle_not_accepted
      consequence: "a future implementation must supply full bit complexity"
    - id: J5-A6
      joint: J5
      target: calibration failure partition
      attack: "collapse selection, right-order, realization, isomorphism, automorphism, evaluator, and decoder failures"
      derivation: "the route keeps these stages distinct and leaves success parameters unassigned"
      outcome: survived_as_an_explicit_missing_interface
      consequence: "no correctness or amplification theorem is inferred"
  dependency_removal_attacks:
    - removed: Hom(E,C) anchor
      first_unavailable_or_ill_typed_operation: "turn a source ideal/class into an exact E-to-C homomorphism"
      exact_consequence: "no executable f and no U,V images"
    - removed: connection map
      first_unavailable_or_ill_typed_operation: "choose a path/class by transporting along a known E-to-C arrow"
      exact_consequence: "chain/ideal selection reverts to enumeration or the named missing interface"
    - removed: target action/frame
      first_unavailable_or_ill_typed_operation: "evaluate the computed right order on points of C"
      exact_consequence: "right-order equality cannot establish exact codomain action or calibration"
    - removed: orientation
      first_unavailable_or_ill_typed_operation: "bind the algebraic realization to the target geometric embedding"
      exact_consequence: "the returned class may realize the wrong target identification"
    - removed: sender map or dual
      first_unavailable_or_ill_typed_operation: "evaluate f(U), f(V), or pull X back directly"
      exact_consequence: "the message decoder has no A0/B0 inputs"
    - removed: per-instance advice
      first_unavailable_or_ill_typed_operation: "select the matching path/ideal without search"
      exact_consequence: "3-then-2 branching remains exponential"
    - removed: exponential preprocessing
      first_unavailable_or_ill_typed_operation: "look up a D-size orbit basis, path table, or ideal table"
      exact_consequence: "small online output cannot conceal non-polynomial construction"
  source_and_visual_attacks:
    hashes:
      outcome: survived
      detail: "all fourteen receipt-bound producer artifact hashes match the current immutable files"
    archive_commit:
      outcome: not_independently_resolved
      impediment: "receipt commit_sha is null and the resolution procedure requires forbidden Git-history access"
    primary_literature:
      outcome: not_independently_verified
      impediment: "underlying KB records and primary texts are outside the exact immutable read scope"
    markdown_mermaid_svg_pdf:
      outcome: scientific_labels_consistent_with_presentation_defects
      detail: "SVG/PDF collapse Mermaid nodes/edges and contain overlapping edge labels; these defects do not support or refute a scientific claim"
  run_accounting:
    scientific_runs: 0
    implementation_runs: 0
    formalizer_runs: 0
    experiment_runs: 0
