blind_rederivation:
  task_id: "TASK-20261006-d6eb27"
  scope:
    joints_owned: [J1, J2]
    source_basis:
      - "coordination/design/TASK-20261006-d4ec12/handoffs/TASK-20261006-d6eb27.yaml"
      - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/blind-statement.yaml"
    corrected_round_disclosure: >-
      This is one fresh corrected round after an invalid earlier round. It adds
      no temporal corroboration, and no earlier finding was sought or guessed.
    run_basis: "Static blind derivation only; no scientific, implementation, formalizer, or experiment runs."

  Q1:
    joint: J1
    question: >-
      Do the declared data force a unique degree-D map from f(P)=X, with the
      required quantifier order and collision resistance?
    verdict: breaks
    assumptions:
      declared:
        - "D=2^a, N=5^b, and N>4D."
        - "The target is a separable degree-D homomorphism f:E->C with f(P)=X."
        - "The point declaration is only P in E[N]; it does not say ord(P)=N."
      required_for_the_conditional_singleton_theorem:
        - "P has exact geometric order N."
        - "Every candidate is a homomorphism E->C to the same exact encoded codomain C and sends P to the same exact encoded X."
        - "Candidate degrees are exactly D; N>4D is strict."
        - "A canonical scaling/model convention is additionally required only when uniqueness of an A/B representation, rather than uniqueness of the homomorphism, is claimed."
    blind_derivation:
      degree_bound:
        - >-
          For distinct homomorphisms f,g:E->C of degree D, h=f-g is nonzero.
          The degree norm on Hom(E,C) gives sqrt(deg(h)) <=
          sqrt(deg(f))+sqrt(deg(g)), hence deg(h)<=4D.
        - >-
          If f(P)=g(P) and ord(P)=N exactly, the N distinct points generated by
          P lie in ker(h), so N<=deg(h). This contradicts N>4D. Therefore, under
          the required premises, the compatible map is a singleton.
        - >-
          Separability of the target maps is part of the declared target type.
          The kernel count for h only needs the N distinct geometric points;
          h itself need not be assumed separable.
      literal_collision_under_the_declared_scope:
        - >-
          Membership P in E[N] permits P=0. Then X=f(P)=0, and f and -f are
          distinct degree-D homomorphisms E->C satisfying the same literal
          public condition. Thus N>4D alone does not imply a singleton on the
          submitted parameter space.
        - >-
          More generally, for a non-generator P the proof can use only ord(P),
          not the ambient integer N. If ord(P)<=4D, the displayed contradiction
          is unavailable.
      relaxed_collisions:
        - >-
          If codomains are identified only up to an uncharged isomorphism, the
          maps cannot first be subtracted as elements of the same Hom(E,C).
          The isomorphism and exact model must be fixed and charged.
        - >-
          Without canonical scaling, (A,B) and (lambda*A,lambda*B) encode the
          same rational function. This is a representation collision, not a
          second homomorphism.
        - >-
          The x-map is shared by f and -f. The condition f(P)=X normally fixes
          the y-coordinate scalar/sign, but it does not do so in the allowed
          P=X=0 control, and the displayed affine calibration is then undefined.
      quantifier_order:
        valid_conditional_statement: >-
          For every instance I satisfying the exact-order, exact-codomain, and
          exact-degree premises, there exists at most one compatible map f_I.
        required_algorithmic_statement: >-
          There exists one uniform program A such that, for every admitted I
          and every admitted evaluator query (U,V), A uses only the declared
          interface, charges all construction/preprocessing, and returns
          (f_I(U),f_I(V)) or a sound tagged failure.
        non_implication: >-
          The statement forall I exists-unique f_I does not imply exists A
          forall I. A unique marked object need not be accessible from its
          uniqueness proof, and a nonuniform lookup table would be excluded
          advice or exponential preprocessing.
    controls:
      zero_or_non_generator_P: >-
        Fails the exact-order premise; P=0 gives the literal f versus -f
        collision above.
      N_at_most_4D: >-
        The bounds N<=deg(f-g)<=4D become consistent, so this argument proves
        no uniqueness.
      relaxed_normalization: >-
        Produces scalar duplicates of A/B and may leave a codomain automorphism
        or y-sign unresolved.
      unique_marked_item_without_access: >-
        Confirms the quantifier gap: singleton existence is not a uniform
        evaluator.
      one_orbit_versus_off_orbit_queries: >-
        Values on multiples of P justify values at U,V only after a global map
        has actually been reconstructed and checked; mere orbit agreement does
        not evaluate off-orbit points.
    limitations:
      - >-
        This finding is confined to J1 as submitted. It does not say that map
        reconstruction, any listed route, or EndRing PKE is impossible after
        stronger admission premises are supplied.
      - >-
        The conditional singleton proof is valid; the break is its application
        to a declaration that lacks exact order and exact normalization/model
        premises.
    next_falsifier: >-
      Supply an admission rule proving ord(P)=N and fixing the exact codomain
      and representation, then exhibit two distinct degree-D maps satisfying
      those strengthened premises; such a collision would falsify the
      conditional singleton derivation.

  Q2:
    joint: J1
    question: >-
      What size follows for the exact dense Route-A representation, and does it
      transfer to a two-point evaluator?
    assumptions:
      - "Use exactly R=A/B with deg(A)<=D and deg(B)<=D-1 over F_p2."
      - "A and B are coprime and canonically scaled, and the coordinate/model encoding is fixed."
      - "For the interpolation argument, the 2D abscissae x([i]P), 1<=i<=2D, must be distinct and finite."
    blind_derivation:
      dense_representation:
        - >-
          A has D+1 coefficient slots and B has D, for 2D+1 field-element
          slots. Quotienting by one common nonzero projective scale leaves 2D
          field elements after normalization, plus constant-size metadata and
          the y-coordinate scalar.
        - >-
          Consequently this exact dense representation and a materialized list
          of 2D sample pairs each have Theta(D log|F_p2|) bit scale (equivalently
          Theta(D log p)); D=2^a makes that exponential in a.
        - >-
          Under ord(P)=N, x([i]P)=x([j]P) implies iP=plus-or-minus jP. For
          1<=i,j<=2D, the negative case would give i+j=N, impossible because
          i+j<=4D<N; hence the abscissae are distinct. Cross-multiplying two
          candidates gives a polynomial of degree at most 2D-1 with 2D roots,
          so the reduced rational function is unique.
      evaluator_only_non_extension:
        - >-
          Eval2 returns only two C-points, so its output has only a constant
          number of field coordinates. The dense output-size bound therefore
          does not establish an Omega(D) lower bound for two-point evaluation,
          DS size, or online time.
        - >-
          A valid transfer needs a charged reconstruction reduction: specify
          admissible chosen queries that yield 2D distinct usable samples,
          handle poles, signs, and model conversions, reconstruct and normalize
          A/B, and charge PreEval, DS, every Eval2 call, and all interpolation.
          With two returned points per call this naturally uses Omega(D) point
          outputs/calls in the straightforward reduction, so it cannot isolate
          an Omega(D) lower bound for one Eval2 call. A fixed single (U,V) query
          cannot perform this reconstruction.
    controls:
      dense_map_versus_evaluator_only_output: >-
        Confirms the claimed dense size only for A/B and rejects its transfer to
        a constant-output evaluator without the charged reduction.
      supplied_evaluator_or_chain: >-
        Supplying either object changes the resource statement; its generation,
        storage, and any advice must remain charged.
      relaxed_samples: >-
        Repeated x([i]P), poles, or an unnormalized common factor invalidate the
        slot-to-unique-map interpolation argument until explicitly handled.
    limitations:
      - >-
        No general evaluator lower bound follows here. The conclusion concerns
        only the declared dense rational-function representation.
    next_falsifier: >-
      Give a reduction that reconstructs the canonical dense map from the exact
      Eval2 interface while accounting for DS construction, all queries, and
      output bits; only the resulting aggregate bound may then be transferred.

  Q3:
    joint: J2
    question: >-
      Can PreEval, Eval2, Check, and Decode be typed as one uniform program using
      only the declared public interface and no hidden connection data?
    verdict: breaks
    assumptions:
      declared_only:
        - "Public parameters are O,E,C,P,X,D,N,U,V,k and frozen encodings."
        - "Excluded data include Hom(E,C), a connecting isogeny, action frames, orientations, sender maps or duals, retained walks, advice, and exponential preprocessing."
      required_but_missing_for_total_honest_input_correctness:
        - "ord(P)=N and an exact supported curve/model encoding."
        - "U,V form a D-torsion basis, or an equivalent condition proving ord(f(V))=D and injectivity of the message parameter modulo 2^k."
        - "A complete checked reconstruction branch, including every exceptional coordinate case and its charged cost."
    blind_derivation:
      typed_program:
        public_type: "Public=(O,E,C,P,X,D,N,frozen_encodings)"
        preeval: >-
          PreEval(Public) -> Result<DS, AdmissionFailure|ReconstructionFailure>,
          where DS contains only data uniformly derived and charged from Public.
        eval2: >-
          Eval2(DS,U,V) -> Result<(A0,B0), EvaluationFailure>, with A0,B0 in C
          and A0=f(U), B0=f(V) certified relative to the reconstructed DS.
        check: >-
          Check(Public,U,V,k,DS,A0,B0) ->
          Result<CheckedEvaluation, AdmissionFailure|EvaluationFailure>.
          Here a=log2(D) is derived after checking D is a power of two; Check
          validates k=floor(a/2), point membership/orders, reconstruction
          certificates, and the exact evaluations. It accepts no Hom/connection,
          frame, orientation, advice, retained walk, or preprocessing input.
        decode: >-
          Decode(D,k,A0,B0) -> Result<m, DecoderFailure>; it receives neither
          s, r, m, a sender map, nor any hidden witness.
      route_A_normalization_and_scalar:
        - >-
          Conditional on exact-order P and a supported affine model, the 2D
          samples determine R=A/B after canonical projective scaling. The
          y-coordinate scalar must then be fixed, not guessed. In the displayed
          convention c=R'(x(P))*y(P)/y(X) and
          f(x,y)=(R(x),y*R'(x)/c), so substituting P gives y(X).
        - >-
          This uses inversion of y(X) and a nonzero derivative/scalar in the
          chosen model. P=0, exceptional affine points, unsupported
          characteristic/model formulas, or a zero denominator require explicit
          alternative handling or a sound tagged failure. Frozen encodings alone
          do not state those missing admission facts.
      decisive_interface_counterexample:
        - >-
          Let W generate the cyclic kernel of an admitted separable degree-D
          map, set U=W, and set V=0. Then U,V are both in E[D], and
          ker(f)=<U+sV>=<W> for every allowed s. Thus the same public input is
          compatible with multiple messages whenever k>=1. Eval2 returns B0=0,
          so the submitted decoder rejects rather than returning the actual
          message. No program on this public interface can distinguish the
          constant two-message view.
        - >-
          Declaring this tuple malformed would be a sensible repair, but it is
          not licensed by the bare condition U,V in E[D]. It requires a new
          basis/nondegeneracy admission rule.
    controls:
      zero_or_non_generator_P: >-
        Route A cannot form the declared affine sample sequence at P=0 and the
        compatible target map is not unique; an admission failure is necessary,
        but the bare definition currently admits the point.
      unique_marked_item_without_access: >-
        Even after uniqueness is repaired, PreEval still needs an explicit,
        uniform, fully charged reconstruction algorithm.
      one_orbit_versus_off_orbit_UV: >-
        A checked global R and y-scalar can evaluate off-orbit U,V; a table of
        values only on <P> cannot.
      supplied_evaluator_or_chain: >-
        Makes decoding conditional but does not satisfy PreEval unless the
        object is reconstructed from Public and its cost is charged.
      constant_public_two_message_view: >-
        U=W,V=0 makes s invisible and supplies the direct indistinguishability
        counterexample for k>=1.
    limitations:
      - >-
        This break is caused by the admitted interface and incomplete admission
        conditions. It is not an impossibility claim for the three proposed
        reconstruction routes or for EndRing PKE under repaired parameters.
    next_falsifier: >-
      Derive from the existing bare definition, without adding a premise, that
      U,V are a D-torsion basis and ord(f(V))=D. Otherwise add and check that
      premise, then retest the program on exceptional models and coordinates.

  Q4:
    joint: J2
    question: >-
      Assuming exact evaluations are available, does the order reduction and
      power-of-two decoder return the actual admitted message, and where do
      failures belong?
    assumptions:
      - "A0=f(U), B0=f(V), D=2^a, k=floor(a/2), and ker(f)=<U+sV>."
      - "s=m+2^k*r with 0<=m<2^k and 0<=r<2^(a-k)."
      - "The decoder additionally needs ord(B0)=D; this is not implied by U,V in E[D]."
    blind_derivation:
      conditional_message_trace:
        - "Kernel membership gives A0+[s]B0=0, hence A0=-[s]B0."
        - "Let q=2^(a-k), H=[q]B0, and G=-[q]A0. Then G=[s]H."
        - >-
          If ord(B0)=2^a, then ord(H)=2^k. Since
          s=m+2^k*r, [s]H=[m]H+[2^k*r]H=[m]H.
        - >-
          The interval 0<=m<2^k supplies the unique representative. A standard
          digit-lifting discrete logarithm in the cyclic power-of-two group
          recovers its k checked bits in O(k^2) group work; the final equality
          [t]H=G prevents an unchecked return. Under these assumptions t=m.
      failure_partition:
        admission_failures:
          - "D is not a power of two, k is inconsistent, or N/D inequalities and encodings fail."
          - "P lacks exact order N or U,V fail the added D-basis/nondegeneracy rule."
          - "The public curves, points, order representation, or frozen models are malformed."
        evaluation_failures:
          - "PreEval cannot uniquely reconstruct and normalize a certified map from the public data."
          - "Scalar/slope calibration is undefined, a certificate fails, or Eval2 does not certify points A0,B0 on C with the required torsion relations."
        decoder_failures:
          - "ord(B0) is not D, ord(H) is not 2^k, digit lifting fails, or [t]H is not G."
        current_scope_problem: >-
          The bare definition categorizes only U,V in E[D]. Therefore the
          U=W,V=0 case is presently an admitted honest relation, not a malformed
          key that Check may silently exclude. The failure partition becomes
          sound only after the missing admission rule is made normative.
    controls:
      off_orbit_UV: >-
        The algebra needs actual evaluations, not inferred orbit labels; with a
        certified global map the trace is unchanged.
      malformed_B0_order: >-
        The explicit ord(B0)=D check correctly prevents an incorrect message,
        but rejection is not correctness for a syntactically admitted honest
        input.
      constant_public_two_message_view: >-
        For U=W,V=0, choose two different m values when k>=1. Both give the
        identical public tuple and kernel relation, so actual-message recovery
        is information-theoretically undefined on the declared scope.
    limitations:
      - >-
        The conditional decoder algebra holds exactly once ord(B0)=D and exact
        evaluation are established. The J2 finding does not challenge that
        conditional calculation.
      - >-
        No claim is made here that reconstruction or decryption is impossible
        after enforcing a D-torsion basis and exact-order/model checks.
    next_falsifier: >-
      After adding a checked basis/nondegeneracy condition, produce an admitted
      tuple for which the exact relation A0=-[s]B0 and ord(B0)=D both hold but
      the checked power-of-two digit lift returns t different from m.
