draft_protocol_amendment:
  id: EXP-ECDLP-2e2332-draft-v2-oracle-grammar
  triggering_review: TASK-20260909-e49972
  disposition: Additive zero-run grammar repair; no simulator, theorem, canonical record, or execution.
  label_schema:
    encoding: lowercase base16 SHA-256 of canonical opaque transcript bytes
    length: 64
    forbidden: [coordinates, point encodings, lattice entries, free-text labels]
  query_schema:
    exact_keys: [operation, ordered_input_labels]
    operation_enum: [add, negate, equality]
    ordered_input_labels: array of 0, 1, or 2 label_schema values as required by operation
    dictionary_key: canonical JSON of query_schema
  response_schema:
    exact_keys: [result_kind, output_label, operation_cost]
    result_kind_enum: [GROUP_LABEL, EQUALITY_BOOLEAN, REFUSAL]
    output_label: label_schema or null exactly as result_kind requires
    operation_cost: nonnegative decimal integer string
    extra_keys: refuse
  verdict_precedence: [OUTSIDE_GENERIC_TRANSCRIPT, INVALID_INTERFACE, REFUSAL, NOT_SIMULABLE, NONCONSTANT_OVERHEAD, CONSTANT_OVERHEAD]
  control_resolution:
    coordinate_or_fixed_basis: OUTSIDE_GENERIC_TRANSCRIPT
    undeclared_response: INVALID_INTERFACE
    trivial_fixed_basis: CONSTANT_OVERHEAD only when response meets response_schema
    nonconstant_scan: NONCONSTANT_OVERHEAD
  does_not: [authorize_simulator_run, authorize_theorem, authorize_execution, create_canonical_records]
