draft_protocol_amendment:
  id: EXP-ECDLP-2e2332-draft-v3-total-interface
  replaces: [specification.yaml Oracle-L interface, specification-v2-grammar-repair.yaml interface clauses]
  disposition: Additive zero-run total interface; old query/response/verdict fields are refused, never merged.
  canonical_bytes: RFC 8785 UTF-8 JSON with NFC strings
  label:
    preimage: canonical JSON {domain: oracle-l-label-v1, transcript_index: nonnegative decimal string, transcript_digest: lowercase 64-hex}
    value: lowercase SHA-256 of label preimage
    uniqueness: one transcript preimage maps to one label; duplicate label with unequal preimage refuses
  query:
    exact_keys: [operation, ordered_input_labels]
    operation_enum: [add, negate, equality]
    key: SHA-256 of canonical query bytes
    response_invariant: one query key maps to one byte-identical response or refuses
  response:
    exact_keys: [result_kind, output_label, equality_value, operation_cost]
    result_kind_enum: [GROUP_LABEL, EQUALITY_BOOLEAN, REFUSAL]
    equality_value: boolean only for EQUALITY_BOOLEAN, null otherwise
    output_label: valid label only for GROUP_LABEL, null otherwise
    operation_cost: decimal string equal to 1 for direct dictionary lookup; scan or unspecified algorithm refuses
  verdict:
    exhaustive_precedence: [OUTSIDE_GENERIC_TRANSCRIPT, INVALID_INTERFACE, REFUSAL, NOT_SIMULABLE, NONCONSTANT_OVERHEAD, CONSTANT_OVERHEAD]
    controls: {coordinate_or_fixed_basis: OUTSIDE_GENERIC_TRANSCRIPT, undeclared_response: INVALID_INTERFACE, trivial_fixed_basis: CONSTANT_OVERHEAD, scan: NONCONSTANT_OVERHEAD}
  does_not: [authorize_simulator_run, authorize_theorem, authorize_execution, create_canonical_records]
