id: H-ECDLP-759690
schema_version: hypothesis-draft-v1
title: Oracle-L transcript simulability screen for a lattice-embedding oracle claim
status: draft
area: ECDLP
source_idea: IDEA-20260807-0f49b6
approved_by: null
implementation_authorized: false
scientific_execution_authorized: false
maximum_scientific_runs: 0
mechanism: >-
  A candidate lattice-embedding oracle is relevant to a declared generic
  transcript boundary only if its public response is representation independent
  and cannot be simulated from the permitted public transcript at the stated
  cost. This finite mock-only screen classifies a closed Oracle-L interface as
  O1_SIMULABLE, NONCONSTANT_SIMULABLE, NOT_SIMULABLE_UNDER_DECLARED_MODEL,
  OUTSIDE_GENERIC_TRANSCRIPT, or INVALID_INTERFACE. It makes no reduction,
  attack, asymptotic, leakage, or security claim.
prediction:
  - A transcript-only Oracle-L response has an O(1)-per-query table simulator under the fixed cost model.
  - A response requiring coordinates, encodings, scalars, relations, or basis-dependent data is outside the generic transcript boundary.
  - A response unavailable from the closed permitted transcript is not simulable under the declared model only; this does not imply cryptanalytic value.
test_boundary: >-
  Only finite synthetic transcripts and prospective mock response declarations
  may be evaluated after a future authorization. No real curve, target point,
  ECDLP instance, DLP solver, lattice reducer, Coppersmith routine, or index
  calculus routine is in scope.
falsification_criteria:
  - A generic verdict assigned to a response containing representation-dependent data invalidates the classifier.
  - A declared transcript-only control that the stated table simulator cannot answer in its fixed cost model falsifies the O(1) prediction for that interface.
  - Any open or ambiguous Oracle-L grammar, cost unit, or permitted-input boundary invalidates the screen.
assumptions:
  - No generic-group theorem or named historical model is asserted here.
  - Future mock transcripts use opaque labels only and contain no real group representations.
inference_policy: >-
  Outputs describe only a declared mock interface under the frozen simulator
  model. They cannot support claims about ECDLP hardness, an attack exponent,
  a deployed system, information leakage, or a representation-dependent method.
source_status:
