      result: present
    - path: coordination/design/BATCH-97a1e0/tasks/TASK-20260909-0d20ac/specification-v3-total-interface.yaml
      check: YAML parses; reviewed as a source-only draft amendment.
      result: present
    - path: ledger/decisions/DEC-20260909-301174.yaml
      check: YAML parses and continues to disable implementation and scientific execution.
      result: present
  metric_recomputations: []
  control_checks:
    - id: old_field
      result: breaks
      finding: >-
        V3 says old query, response, and verdict fields are refused, but supplies no
        versioned top-level envelope or total input-schema rule that identifies a
        candidate object as V3 before its query and response subobjects are read.
        The exact_keys clauses cover only those two subobjects, and the precedence
        list is a list of verdict strings rather than a closed verdict-record schema.
        A consumer therefore has no specified mechanical rule for refusing an old
        interface object or for rejecting old fields outside those two subobjects.
    - id: label_collision
      result: breaks
      finding: >-
        label.preimage contains a caller-provided transcript_digest but does not
        define the bytes whose digest is taken, a transcript-record locator, or a
        registry binding that resolves the digest to one transcript. It also calls
        transcript_index a nonnegative decimal string without a canonical grammar
        that rejects alternate spellings such as leading-zero forms. RFC 8785
        canonicalizes the surrounding string values, not their semantic integer
        meanings. The stated duplicate-label refusal has no specified registry or
        observation point, so unequal preimages mapping to the same label are not
        deterministically detected by the interface.
    - id: conflicting_key
      result: breaks
      finding: >-
        The one-query-key-to-byte-identical-response sentence is an invariant but
        the amendment defines neither a canonical response-map artifact nor an
        append, lookup, conflict, or audit procedure. It therefore cannot force a
        later evaluation of the same SHA-256 query key to compare against an
        existing canonical response before returning another response. The global
        canonical_bytes sentence does not supply that durable mapping protocol.
    - id: equality
      result: breaks
      finding: >-
        response constraints are keyed only by result_kind. Nothing requires an
        equality query to have exactly two valid input labels and an
        EQUALITY_BOOLEAN response, or requires add and negate to return GROUP_LABEL.
        Thus an equality query with an arbitrary input-label count may satisfy the
        written interface with GROUP_LABEL or REFUSAL. In addition, the controls
        assign coordinate_or_fixed_basis to OUTSIDE_GENERIC_TRANSCRIPT while
        trivial_fixed_basis is assigned CONSTANT_OVERHEAD; no predicate or
        precedence rule resolves their overlap when the latter is a fixed-basis
        object.
    - id: scan_cost
      result: breaks
      finding: >-
        operation_cost equal to decimal string 1 for a direct dictionary lookup
        does not define a lookup data structure, key-comparison model, unit of
        cost, transcript-size parameter, or bound as that size grows. The word
        direct does not distinguish a bounded lookup from a hidden scan. The draft
        consequently has no checkable rule that connects a returned cost string to
        an algorithm or rejects a growing lookup path beyond producer assertion.
    - id: recalled_ggm_proves_too_much
      result: holds
      finding: >-
        The reviewed packet does not use the recalled GGM reference as support for
        a theorem, simulator result, attack, or ECDLP conclusion; the decision
        retains the no-theorem and no-execution limitation.
  heuristic_validation_checks: []
  cost_model_checks: []
  proof_architecture_checks: []
