# Proof-search-map audit for H-ECDLP-4d92ee / EXP-ECDLP-ff0559
# Design archive TASK-20261002-70c7e2. Zero runs. Inventor-protocol section 8
# (KN-TECH-080). The Coordinator re-checks the four audits of the idea
# proof_search_map against the frozen contract and records what it found by hand.
# Hand derivations below are UNREVIEWED and are not evidence; Stage 0 re-derives
# them and later independent review attacks them.
audit:
  id: AUDIT-ECDLP-4d92ee-20261002
  hypothesis_id: H-ECDLP-4d92ee
  experiment_id: EXP-ECDLP-ff0559
  source_idea: IDEA-20260930-8e3b75
  question_id: RQ-ECDLP-c1b7b1
  recorded_at: '2026-10-02'
  recorded_by: coordinator
  zero_runs: true

  bottleneck: >-
    Whether the defect of the coordinate-defined reference section relative to the
    unique equicharacteristic torsion lift correlates with any character of G
    beyond the white level (Stage 2, not approved). At the approved scope the
    bottleneck is instrument and derivation validity before any spectrum exists.

  baseline_embedding:
    parameter_slice: >-
      Trivial direction lambda (4a, 6b): delta_triv = lambda x/y. Anomalous case
      n = p: Sigma additive, scalar recovered (Belding 2007 abstract, Smart
      analogue). Witt direction: (C2).
    reproduction_check: >-
      Declared in the contract as gates G1 (every point, 5 curves, 3 lambda values,
      zero tolerance), G2 (all ordered pairs at 12 bits) with the non-homomorphic
      ref control G2c, G3 (50 anomalous with certificates), G4 (C2 at 3 x 10^3
      points).
    coordinator_hand_check:
      C1_rederived: >-
        Done by hand in this session: with mu = 1 + lambda eps the map (x, y) ->
        (mu^2 x, mu^3 y) sends E to y^2 = x^3 + (a + 4 a lambda eps) x + (b + 6 b
        lambda eps); the section s(P) = ((1 + 2 lambda eps) x, (1 + 3 lambda eps) y)
        is an exact homomorphism; ref has v = lambda (2 a x + 3 b)/y; the
        difference has components (2 lambda x, lambda (3 y^2 - 2 a x - 3 b)/y) and
        3 y^2 - 2 a x - 3 b = 3 x^3 + a x = x (3 x^2 + a) on the curve, giving
        t = lambda x/y. The idea statement of (C1) is reproduced.
      recipe_rederived: >-
        Closed form delta(P) = alpha/(2 n y_P), alpha the eps-coefficient of
        x([n-1] ref(P)) - x_P, derived from A + ref(P) = K_t, t = -alpha/(2 y_P),
        delta = -n^{-1} t, and checked against the trivial direction (alpha = 2 n
        lambda x_P gives lambda x/y). The recipe avoids the point-at-infinity chart
        at the final addition. UNREVIEWED; required to be re-derived at S0.7.
      C2_plausibility: >-
        A homomorphism Phi from points of E2(Z/p^2) near t_1(P) to E_eps(F_p[eps])
        exists because F(t_1(P1), t_1(P2); A, B) = t_1(P1 + P2) exactly and the
        first-order expansion in p equals that in eps; this gives (C2) with the
        normalisation 2 y_P delta of the idea. Residual obligation: kernel
        (above-O) points. UNREVIEWED sketch; Stage 0 may confirm or refute.
      oddness: >-
        delta(-P) = -delta(P) (ref(-P) = -ref(P), s(-P) = -s(P), negation acts as
        -1 on K). Used in the observation-collision finding below.

  observation_collision:
    observable: >-
      Stage 1: exact values and equalities and certificates. Stage 2 (frozen):
      DL-spectrum magnitudes |delta^(a)| and statistics.
    distinct_preimage_search:
      idea_collisions_carried: >-
        delta versus translates (phases only, harmless); delta_KS versus delta_KS
        + lambda x/y (different direction normalisations; fixed by freezing
        direction (1, 0) and the reference before any spectrum); white spectrum
        versus structure invisible to single characters (adaptive combinations
        are the stated gap of IDEA-20260905-b6154d).
      coordinator_finding_symmetry_collision: >-
        delta_KS is odd under P -> -P, so on the log ordering delta(P_{-i}) =
        -delta(P_i) and the DFT is purely imaginary with |delta^(a)| = |delta^(-a)|.
        The idea null (a seeded uniformly random function G -> F_p with the same
        marginals) is NOT odd. For an odd real random function the squared
        coefficient is a chi-square-1 variable rather than an exponential, so the
        maximum over the independent frequency pairs is higher by roughly a factor
        sqrt(2) in amplitude (hand derivation from the extreme-value law; to be
        re-derived in the Stage 2 design). A ratio of the member spike to the idea
        null would therefore be biased upward by about that factor, which eats
        into the E-LEAD margin (ratio >= 4) and shifts the E-WHITE interval [0.5, 2]
        toward its upper end without any structure present. The thresholds are
        copied verbatim and NOT altered; the remedy is a parity-matched null
        (random odd function through the identical post-function code path) added
        beside the idea null at Stage 2 design, and the post-functions must be
        read for parity too (delta mod 2 and Legendre(delta) change under P -> -P
        in different ways, e(delta/p) is Hermitian-symmetric, [delta < p/2] is
        not odd or even). For the sibling census, x-based members are even
        functions with the mirror issue under a value-permutation null; that is
        the sibling contract concern and is only pointed at here.
      stage_1_collisions_checked: >-
        G1 cannot be passed by a pipeline that returns zero or a constant (the
        sentinel G1s requires disagreement with lambda x/y + 1 everywhere);
        G2 cannot be passed vacuously (G2c requires failures for ref); G3 cannot
        be passed by a pipeline that ignores the dual part (Sigma would vanish).
    status: checked

  quantifier_order: >-
    Idea statement carried. Stage 1: FOR the declared curves (all points), the
    declared 12-bit curve (all ordered pairs), the first 50 admissible anomalous
    curves in generator order with no replacement after a failure, and 10^3
    seeded points on each of three curves; direction, reference, library and
    seeds frozen before any value is computed; no witness depends on the target.
    The weaker reading (agreement at other scales or sizes, white at crypto scale)
    is not claimed.
  status_quantifier: declared_in_contract

  method_ceiling:
    strongest_certifiable_claim: >-
      For the declared curves, direction, reference and panel rule: delta_triv =
      lambda x/y, s(P + Q) = s(P) + s(Q), certified recovery on 50 anomalous
      toy curves, and (C2) agreement or recorded deferral. Never anything about
      spectra under this contract, nor higher precision, nor adaptive
      combinations, nor cryptographic scale.
    nearby_object_control: >-
      Anomalous curve (G3), trivial direction (G1), non-homomorphic ref (G2c).
      PROVES-TOO-MUCH objects for the argument chain: (a) the splitting argument
      must NOT go through for n = p (no unique section), and Stage 0 must show
      where coprimality is used; (b) the degree lemma (D) must NOT conclude for the
      trivial direction, where the extension splits and delta_triv has degree 2
      far below p; Stage 0 must show exactly where non-splitness is used; (c) the
      identity (C2) must not be asserted for a lift pair differing by p times the
      trivial direction without checking it is consistent (delta_triv = lambda
      x/y). A pipeline that cannot see these has not identified the load-bearing
      structure.
    status: declared_in_contract

  derivation_obligations_audit:
    C2: >-
      Predicted exact; hand sketch exists (see coordinator_hand_check); not
      assumed. Failure does not void the instrument.
    C3_criterion: >-
      Coordinator finding: the idea criterion "Sigma != 0 iff a_p == 1 mod p" is
      not literally correct for the trivial direction, where Sigma_triv = 0 on
      every anomalous curve although a_p = 1 (s is an exact homomorphism and [p]
      kills the central kernel). The criterion needs the qualifier "for a
      non-trivial direction" or a statement in terms of the Kodaira-Spencer
      class. The gate G3 uses direction (1, 0) and passes on certified recovery,
      so no gate changes. A risk the contract carries verbatim: if Sigma_(1,0) = 0
      identically on some panel curve, that instance fails the idea 50-of-50
      threshold although the instrument may be correct; the threshold is not
      loosened, the failing curve is archived, and any change would need a
      versioned amendment.
    D_lemma: >-
      Sketch is plausible but depends on two recalled inputs (non-split G_a
      extension class of the Weil restriction; Bezout / Lang-Weil bound on a
      degree O(d) curve in E x E) that no agent has opened. It is carried as an
      obligation; it may not be cited as proved.
    Hasse_recalled_inputs: provenance recalled, verified_by null; pointers only.

  contract_gaps_found_and_resolved_by_design:
    - >-
      The idea names delta_2 for its precision-3 equicharacteristic digit and
      says only "defined analogously". The contract freezes a default definition
      (t^2 coefficient of the formal logarithm of the kernel element, zero
      x-displacement reference) to be confirmed at Stage 0 before Stage 1 begins.
    - >-
      The census instrument (EXP-ECDLP-184fc4) is a definition-level contract at
      the base commit with implementation_dispatch_authorized false. Stages 0-1
      do not depend on it; Stage 2 does and is therefore deferred.
    - >-
      Name clash delta_2 with the Witt-direction delta_2 of H-ECDLP-f1e714;
      resolved by the label delta_2_KS.
    - >-
      Wording difference in the idea between minimal_test (E-WHITE falsified iff
      ratio >= 4 at every size) and falsification_conditions (adds a
      non-decreasing trend clause): carried verbatim and flagged for amendment
      before Stage 2.
    - >-
      No GOAL-ECDLP-001 record exists on the tree; goal_id is null.

  proof_obligations_count: 6
  audits_applicable:
    - baseline_embedding
    - observation_collision
    - quantifier_order
    - method_ceiling
  audits_not_applicable: []
  failed_audits: []
  note: >-
    Passing these cheap pre-compute audits asserts nothing beyond AGENTS.md rules
