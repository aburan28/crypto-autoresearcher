    checked by hand by the Coordinator only; (C2), (C3) criterion and (D) are
    open obligations; Stage 0 re-derives and independent review follows.

  pareto_honesty:
    dominated_by: >-
      n/a (no result claimed; the record proposes a measurement and instrument
      calibration whose predicted Stage 2 outcome is a controlled null). Frontier
      rows checked as listed in the hypothesis: parallel rho with negation, BSGS,
      automorphism quotients, multi-target, precomputation, prime-field index
      calculus, lifting approaches inheriting the xedni obstruction, anomalous
      and small-embedding-degree transfers on special curves.
    sota_delta: >-
      Zero on every ECDLP axis. No exponent moves.
    checked: true

  stage_authorization:
    authorized: [0, 1]
    deferred:
      - Stage 2 census at 2^16 to 2^24 with library, null, parity-matched null, 2-torsion control and meter (designed after Stage 1)
      - Replication at a fourth seed and one further size (only if E-LEAD)
      - Medium-scale rung 2^32 with sampled frequencies
      - Any independent review-breakthrough round (owed before any E-LEAD statement)
