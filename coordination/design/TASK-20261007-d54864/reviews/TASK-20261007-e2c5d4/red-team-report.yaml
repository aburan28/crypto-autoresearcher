joints:
  T3:
    name: complete-ring necessity
    verdict: inconclusive
    attacks:
      original_selector: >-
        If an admissible inverter recovers the sampled path, dual(x) composed
        with x is the degree scalar, so successful inversion need not yield a
        non-scalar generator.
      deterministic_selector: >-
        Repeating a deterministic selector on the same challenge adds no new
        outputs; however the packet does not instantiate a concrete efficient
        canonical selector for the exact Walk_L endpoint-and-degree-word map.
      padded_selector: >-
        Padding is not shown to preserve fixed length and exact degree-word
        equality. A padding witness therefore cannot by itself certify zero
        useful-saturation probability for the frozen concrete syntax.
      rank_deficient_and_proper_suborder: >-
        Ordinary endpoint validity contains no rank, discriminant, or index
        condition, so it does not logically certify rank four or maximal-order
        saturation. This supports a missing-theorem obstruction, not the
        stronger concrete assertion that a zero-saturation selector exists.
    decisive_gap: >-
      The stated equality epsilon^q*u_I is unjustified without independence
      and a precise definition of q successful calls. The valid accounting is
      Pr[all required outputs valid] times the corresponding conditional
      saturation probability. Moreover, the claimed infimum zero for the
      concrete interface needs an admissible zero-saturation selector or a
      theorem; absence of a positive theorem establishes only that the desired
      lower bound has not been derived.
    survives: >-
      The packet correctly separates four returned loops, rank-four generation,
      and full maximal-order saturation, and it identifies the hidden-original
      dependence that prevents SatFull from being an ordinary public inversion
      predicate.
  T4:
    name: correctly directed reduction
    verdict: holds
    arrows:
      ind_to_inverter: >-
        A fiber-dependent h makes decryption depend on which valid inverse is
        returned. Making h fiber-constant restores inverse-independent
        correctness but supplies only bit prediction; no decision-to-search
        compiler, embedding, or extraction of an endpoint preimage is given.
        The earliest arrow is therefore explicitly and correctly missing.
      inverter_to_complete_ring: >-
        Endpoint validity alone supplies neither non-scalarity, independence,
        rank growth, nor maximal-order saturation. The arrow has no established
        positive success bound, even though the packet's epsilon^q expression
        must be corrected as noted under T3.
      direction: >-
        The packet does not reverse an EndRing-solver-to-inverter construction
        into a security reduction. It follows attacker to inverter to complete
        ring and stops at the missing arrows.
      accounting: >-
        No finite loss, polynomial runtime, or retry/abort bound is claimed once
        A1 is missing and Inv runtime and sampler abort mass are uninstantiated.
        That is an honest scoped obstruction rather than a completed reduction.
controls:
  leaked_output:
    result: rejected_as_known_false
    reason: >-
      Revealing sampled x exposes h(x); if x is also used as the inverse, the
      resulting loop is scalar and does not recover a complete ring.
  public_inversion:
    result: rejected_as_known_false
    reason: >-
      For fiber-constant h, a public valid inverse reveals the mask and makes
      decryption public, while a deterministic output still carries no
      selector-robust saturation guarantee.
conclusion: >-
  The saturation filter does not repair ordinary RWER into a complete-ring
  extraction theorem. The T4 typed obstruction survives. T3 cannot receive a
  clean holds verdict until the probability formula is corrected and the
  concrete zero-bound claim is weakened to no-derived-positive-bound or is
  backed by an admissible selector preserving the frozen syntax.
required_correction:
  - Replace epsilon^q*u_I by an explicitly defined joint-validity event times its conditional saturation probability.
  - Distinguish no proved positive lower bound from a proved infimum of zero.
  - Instantiate a canonical or padded selector only if it preserves the exact endpoint, length, and degree-word rules.
