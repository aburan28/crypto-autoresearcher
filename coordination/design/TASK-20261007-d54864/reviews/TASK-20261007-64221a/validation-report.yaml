joints:
  T1:
    title: bare-curve public sampling and exact distribution
    verdict: breaks
    findings:
      - >-
        The challenge input is a canonically encoded bare supersingular curve
        E, and the allowed auxiliary information is limited to a public
        degree alphabet and validation parameters. No hidden or
        secret-correlated public datum is introduced in the frozen interface.
      - >-
        The EndRing challenge law is only named as the "exact" distribution.
        The interface gives no concrete curve law or compiler from that law
        to its repeated public view, so equality of distributions cannot be
        checked from the allowed record.
      - >-
        Sample_from_bare_E is prose, not an exact sampler: the random-coin
        law, degree-word law, kernel/edge choice law, rejection behavior,
        retry-cap value, tuple dependence, and repeated-use state are absent.
        X_E, Y_E, encoding, and validation entries describe shapes but do not
        close those distributional choices.
      - >-
        The only sampler failure statement says abort mass is
        parameter-dependent and uninstantiated. Consequently there is no
        numerical or symbolic bound to include in a distribution comparison.
      - >-
        "Polynomial in lambda, k, and L" omits retry-cap dependence, input and
        encoding bit lengths, and per-attempt arithmetic cost. It therefore
        does not establish a polynomial-cost distribution compiler.
    adversarial_conclusion: >-
      Public sampling and sequential evaluation from bare E remain plausible
      algorithms, but the exact law, abort mass, and cost required by T1 are
      not typed tightly enough to validate them.
    gap_repair_effect: >-
      No repair is supplied. The gap packet requires an exact sampler law,
      retry/abort mass, encodings, and repeated-use view; the frozen interface
      instead leaves the abort mass uninstantiated and the law at prose level.
  T2:
    title: typed any-basis inversion
    verdict: breaks
    findings:
      - >-
        The universal quantifier is preserved: correctness is demanded for
        every E, every complete evaluable maximal-order basis, and every
        admitted y. The revision does not silently restrict to a planted
        basis.
      - >-
        Inv_from_complete_basis is explicitly MISSING. No input/output
        algorithm, correctness relation, success probability, failure bound,
        or runtime is provided; the interface itself records unbounded
        failure and no established runtime.
      - >-
        For any U in GL_4(Z), replacing B by B U preserves a complete
        Z-basis of the same maximal order. A valid every-basis Inv must be
        invariant under this presentation change and polynomial in the bit
        length of the transformed basis. The interface supplies neither a
        basis-independent construction nor coefficient-growth accounting.
      - >-
        The stated GL_4(Z) audit correctly observes that arbitrary basis
        changes destroy planted-coordinate routing. That observation is a
        sound obstruction, not an inversion construction.
    adversarial_conclusion: >-
      T2 fails as a positive interface obligation. It holds only as an honest,
      correctly typed obstruction to planted-basis routing.
    gap_repair_effect: >-
      The gap packet permits a typed obstruction at this arrow, and the frozen
      interface provides one. It preserves rather than weakens the any-basis
      quantifier, but it does not repair inversion or establish its costs and
      failures.
