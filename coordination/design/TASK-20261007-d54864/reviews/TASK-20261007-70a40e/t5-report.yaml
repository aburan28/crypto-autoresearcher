candidate_verdicts:
  - candidate_id: IDEA-20261007-c5a097
    name: UTTK
    verdict: breaks
    scope: T5 only
    findings:
      - dimension: complete_encoding_and_malformed_inputs
        verdict: breaks
        reason: >-
          The packet validates curve membership, exact order, pairing, and
          point membership, but it does not define a decidable validity check
          tying an adversarial tuple (E',P,Q,P',Q') to one degree-n normalized
          isogeny from E, nor an exact encoding for the codomain isomorphism
          used by output equivalence. Arbitrary well-formed points can therefore
          pass the stated parser checks without being an honest transport.
      - dimension: repeated_use
        verdict: breaks
        reason: >-
          The one-transcript OW-UTTK precursor has no multi-instance or
          chosen-transcript view for reuse of the same E or complete basis.
          This omission is disclosed by O6 remaining open, but T5 coverage is
          still absent.
      - dimension: collisions
        verdict: inconclusive
        reason: >-
          Unit-generator equivalence is declared and distinct-kernel pointed
          transcript collisions are explicitly left open. This is honest
          scoping, not a collision theorem.
      - dimension: controls
        verdict: holds
        reason: >-
          Publishing R is a valid known-false control: inversion becomes
          public while the wrong-direction EndRing-solver implication remains.
          P=O and lower-order points are correctly classified as invalid-input
          controls after weakening exact-order premises, not valid attacks.
      - dimension: prior_art
        verdict: inconclusive
        reason: >-
          KN-LIT-6572 reports a Seta torsion-attack trapdoor family at abstract
          scope, so substantial overlap is plausible. The packet states this
          and withholds distinctness; pointer scope cannot establish identity
          or novelty.
      - dimension: sources_and_claim_language
        verdict: holds
        reason: >-
          All four literature items are identified as internal abstract-level
          pointers, primary papers are not claimed read, and no security,
          novelty, practicality, finalist, or impossibility claim is made.

  - candidate_id: IDEA-20261007-7625cc
    name: RWER-Trap
    verdict: breaks
    scope: T5 only
    findings:
      - dimension: complete_encoding_and_malformed_inputs
        verdict: breaks
        reason: >-
          The endpoint encoding is only "initially j(E_t) plus tags" and does
          not define the exceptional tags, the base-field versus geometric
          isomorphism relation, canonical splitting-field embeddings, or a
          single certificate grammar for the rational-map/kernel-polynomial
          alternatives. Consequently equality and rejection of all malformed
          paths are not determined by the frozen packet.
      - dimension: repeated_use
        verdict: breaks
        reason: >-
          Repetition is mentioned only as a possible extraction lead. No
          repeated/chosen-endpoint interface game, state model, or leakage view
          is specified for reuse of E or B. The absence is appropriately
          disclosed but leaves T5 uncovered.
      - dimension: collisions
        verdict: holds
        reason: >-
          The packet correctly treats endpoint inversion as a relation and
          exhibits the path followed by an edge/dual-edge pair as a same-output
          collision when two path slots remain. It does not infer security or
          exact-preimage recovery from this fact.
      - dimension: controls
        verdict: holds
        reason: >-
          Returning the full path is a valid publicly invertible control and
          correctly defeats any trapdoor inference based only on KeyGen
          provenance.
      - dimension: prior_art
        verdict: inconclusive
        reason: >-
          The four pointers describe different high-level auxiliary mechanisms,
          but they are abstract-level records only. The packet therefore
          correctly leaves distinctness, dominance, and novelty unverified.
      - dimension: sources_and_claim_language
        verdict: holds
        reason: >-
          Source scope and the zero-run boundary are explicit; the packet makes
          no PKE, security, EndRing-hardness, novelty, efficiency, or
          impossibility claim.

