schema: crypto.autoresearch.red_team_report.v1
red_team_report:
  id: RT-20261007-df7b77
  task_id: TASK-20261007-df7b77
  batch_id: BATCH-cb7b9a
  role: red-team
  claim_under_review: >-
    The two frozen packets define basis-independent Trap_E interfaces or typed
    obstructions and accurately scope their possible use in a later EndRing
    PKE.
  scope:
    joints_owned:
      - "T3: complete-ring necessity"
      - "T4: correctly directed reduction"
    scientific_runs: 0
    whole_claim_vote: not_performed
    novelty_security_or_impossibility_verdict: not_performed
  snapshot_verification:
    authoritative_archive_commit: f37c0cca6f6ae0de6e7f090b85b0803220b75586
    commit_reachable_from_head: true
    declared_packet_hashes_match: true
    mismatches: []
  candidate_verdicts:
    - candidate_id: IDEA-20261007-c5a097
      short_name: UTTK
      T3:
        verdict: breaks
        narrow_scope: >-
          Breaks only the proposed complete-ring-necessity route; it does not
          establish public inversion or a family-level impossibility.
        smallest_reusable_witness: >-
          In the packet's only proposed inverse architecture, B is first
          compiled to one attack-suitable evaluable endomorphism theta and all
          later transcript inversion uses theta, not the remaining basis.
        factorization: "Inv(B,T) = AttackTT(Compile(B),T), with theta = Compile(B)"
        strictness_and_gap: >-
          No reconstruction of a complete evaluable rank-four basis from
          theta is supplied. Compile and AttackTT are themselves missing or
          unverified, so this verdict rejects necessity for that architecture
          rather than asserting that theta is an available trapdoor.
        observable_collision_search:
          admitted: "R and [u]R for u in (Z/nZ)^* encode the same kernel."
          distinct_kernel_result: inconclusive
          detail: >-
            If two normalized degree-n maps agree on the disclosed N-torsion
            basis, their difference kills E[N]. Under the degree-norm triangle
            bound, a nonzero difference has degree at most 4n but divisibility
            through [N] forces degree at least N^2. Thus N^2>4n would rule out
            such a collision; the packet imposes no relation between N and n,
            so neither collision nor injectivity follows in its full scope.
        narrowest_supported_statement: >-
          UTTK has no demonstrated complete-ring necessity. Its proposed
          recipient route, if completed as written, is mediated by theta.
      T4:
        verdict: breaks
        embedding: >-
          No selected-message PKE game or attacker-to-UTTK embedding is
          defined. The public sampler can create an OW-UTTK challenge from
          bare E, but the simulator then already knows the sampled kernel R.
        simulation: >-
          There are no scheme oracles to simulate. A black-box UTTK inverter
          returns a generator of the same known kernel, so its output supplies
          no new End(E) information to the bare-E reduction.
        one_bit_and_repetitions: >-
          There is no IND attacker, no conversion from a one-bit advantage to
          a kernel witness, and no repetition argument producing independent
          endomorphisms.
        extraction: >-
          No kernel-inverter-to-complete-basis extractor is specified. Any
          extractor that succeeds after inlining a public inverter must contain
          an independent EndRing solution; the inversion implication alone
          does not provide it.
        accounting:
          advantage_loss: undefined
          queries_or_repetitions: undefined
          abort_probability: undefined
          total_runtime: undefined
          basis_completeness_and_saturation: undefined
        narrowest_supported_statement: >-
          The packet gives only the reverse capability outline complete ring
          to theta to inversion; no correctly directed attacker-to-complete-
          ring reduction is present.
    - candidate_id: IDEA-20261007-7625cc
      short_name: RWER-Trap
      T3:
        verdict: inconclusive
        narrow_scope: >-
          Complete-ring necessity is not established, but this review did not
          find a polynomial-size reusable smaller witness that inverts every
          honest-support endpoint.
        smallest_confirmed_witness: >-
          For one target y, any validated connecting path pi_y is an exact
          sufficient witness. It is target-specific and is the relation-
          inversion output itself, so it is not a reusable trapdoor theorem.
        candidate_smaller_witnesses:
          - "a source-rooted routing oracle or data structure"
          - "endpoint order data plus a connecting ideal and evaluation data"
          - "a canonical path selector"
        gap: >-
          Polynomial size, public computability, sufficiency over the whole
          support, and reconstruction of End(E) are unproved for all three.
        observable_collision_search:
          verdict: holds
          collision: >-
            Whenever two slots remain, pi and pi followed by an ell-edge e and
            its dual have distinct valid encodings and the same endpoint.
          extraction_effect: >-
            This cheapest collision is useless for full-ring extraction:
            dual(pi followed by e and dual(e)) composed with pi is a scalar
            multiplication. An inverter may systematically return the original
            or a backtracking-padded path, so inversion success alone supplies
            no non-scalar or independent loop probability.
        narrowest_supported_statement: >-
          RWER is explicitly many-to-one and lacks a non-factorization or
          reconstruction theorem; necessity remains open rather than broken
          by a demonstrated reusable witness.
      T4:
        verdict: breaks
        embedding: >-
          No selected-message IND compiler embeds a one-bit attacker into the
          endpoint relation. Multiple preimages prevent reading a path-bound
          predicate from an arbitrary successful inverse without a new
          invariant or selector.
        simulation: >-
          The bare-E reduction can publicly sample pi and y and call a relation
          inverter, but a perfect inverter is allowed to return a canonical,
          identical, or backtracking-padded path. The relation game supplies no
          collision-diversity guarantee.
        extraction: >-
          For a genuinely different pi', dual(pi') composed with pi is an
          evaluable endomorphism, but relation-inversion success gives no lower
          bound on it being non-scalar, Q-linearly new, or sufficient to
          generate and saturate the full order. A rank-four suborder would
          still not certify End(E).
        quantitative_accounting: >-
          A valid proof would need an explicit attacker-to-inverter success
          delta(epsilon), then for m calls lower bounds on useful non-scalar
          loops, rank growth, saturation, and all aborts, with total time for
          path validation, dual/composition, repetition, saturation and basis
          certification. Every one of these quantities is absent.
        accounting:
          attacker_bit_advantage: undefined
          inverter_success: undefined
          useful_collision_probability: undefined
          rank_four_probability: undefined
          full_order_saturation_probability: undefined
          repetitions: undefined
          abort_probability: undefined
          total_runtime: undefined
        narrowest_supported_statement: >-
          The collision-loop idea is a proof-search lead only. Endpoint-
          relation inversion does not currently imply a complete evaluable
          End(E) basis.
  proves_too_much_controls:
    - object: "Leaked-output control: Y_E contains x or a public inverse."
      result: expected_failure_detected
      symbolic_run: >-
        The public algorithm reads x from Y_E and inverts with success one.
        For UTTK this returns the already sampled kernel; for RWER it returns
        the disclosed path and the resulting self-loop is scalar. Neither
        yields a complete ring basis. A reduction that nevertheless does so
        can inline the public algorithm and is independently solving EndRing.
      T3_effect: "Public inversion disproves any confidentiality inference from KeyGen provenance."
      T4_effect: "Inversion-to-EndRing extraction does not follow from inversion success."
    - object: "Public-inversion control: Inv is copied into public parameters."
      result: expected_failure_detected
      symbolic_run: >-
        Anyone can invoke Inv. The statement that a complete ring basis can
        also implement Inv remains true but is irrelevant; without a separate
        extractor, public Inv gives no rank-four basis. Thus the unchanged
        forward provenance argument proves too much and is rejected.
      T3_effect: "Possession of B is not shown necessary for the public operation."
      T4_effect: "Any successful extractor must add EndRing-solving content not supplied by Inv."
  objections:
    - id: O-UTTK-ROUTE-FACTORS
      candidate: IDEA-20261007-c5a097
      joint: T3
      severity: decisive_for_joint
      statement: "The only proposed inverse architecture factors through theta."
    - id: O-UTTK-KNOWN-PREIMAGE
      candidate: IDEA-20261007-c5a097
      joint: T4
      severity: decisive_for_joint
      statement: "The bare-E reduction samples R itself, so the inverter returns already-known data."
    - id: O-RWER-SCALAR-COLLISIONS
      candidate: IDEA-20261007-7625cc
      joint: T4
      severity: decisive_for_joint
      statement: "Guaranteed edge/dual-edge collisions produce scalar loops, not a ring basis."
    - id: O-RWER-ADVERSARIAL-INVERTER
      candidate: IDEA-20261007-7625cc
      joint: T4
      severity: decisive_for_joint
      statement: "A valid inverter may return outputs with zero useful rank growth."
  required_controls: []
  counterexample_or_mutation: >-
    Give the RWER inverter a canonical-path policy, or pad its answer by
    adjacent edge/dual-edge pairs. It remains a correct relation inverter
    while the proposed loop extractor receives only scalar or otherwise
    uncontrolled endomorphisms.
  baseline_comparison: null
  heuristic_challenges: []
  cost_model_challenges:
    - "Neither candidate supplies repetitions, abort bounds, extraction loss, saturation cost, or total runtime."
  reduction_and_scope_challenges:
    - "A one-bit IND output is not a relation witness; the first reduction arrow is absent for both packets."
    - "Successful relation inversion is weaker than complete-order extraction for both packets."
  proof_architecture_challenges:
    - "UTTK factors through theta in its only proposed inverse architecture."
    - "RWER's guaranteed observation-fiber collisions preserve the endpoint but yield scalar loops."
  narrowest_supported_statement: >-
    UTTK's proposed recipient architecture does not demonstrate complete-ring
    necessity, and neither UTTK nor RWER has a correctly directed quantitative
    route from a PKE attacker to a complete evaluable rank-four End(E) basis.
    RWER complete-ring necessity remains inconclusive in this packet.
  next_concrete_action: >-
    For UTTK, do not wrap the interface before supplying a non-circular
    inverter-to-full-ring extractor. For RWER, first state and prove an oracle
    property stronger than relation inversion that forces non-scalar,
    independent loops and full-order saturation against canonical and padded
    adversarial outputs, with explicit loss and runtime.
  requirement_status:
    - requirement: "T3 verdict per candidate"
      status: verified_complete
      evidence: "UTTK breaks for its proposed route; RWER is inconclusive."
    - requirement: "T4 verdict per candidate"
      status: verified_complete
      evidence: "Both break at embedding/extraction with quantitative fields absent."
    - requirement: "Known-false symbolic controls"
      status: verified_complete
      evidence: "Both leaked-output and public-Inv variants trigger the required failure signature."
    - requirement: "Experiments"
      status: not_attempted_by_design
      evidence: "The frozen contract requires zero scientific runs."
  artifact_paths:
    - coordination/design/TASK-20261007-d54864/reviews/TASK-20261007-df7b77/red-team-report.yaml
    - coordination/design/TASK-20261007-d54864/reviews/TASK-20261007-df7b77/review-attestation.yaml
