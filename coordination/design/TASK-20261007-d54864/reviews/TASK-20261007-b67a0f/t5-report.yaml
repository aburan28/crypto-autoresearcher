breaking_finding:
  id: T5-UNSPECIFIED-PARSE-AND-REPEATED-USE-VIEW
  evidence:
    - >-
      candidate.md and trap-interface.yaml name canonical curve, kernel,
      incidence, degree-word, tag, and tuple encodings, but provide neither a
      byte grammar nor concrete validation algorithms. Listing malformed
      categories does not define exact accepted encodings or rejection
      behavior.
    - >-
      candidate.md describes ordinary inversion using both exact byte parsing
      and mathematical endpoint equality, while trap-interface.yaml states
      exact tuple equality after canonical endpoint serialization. The packet
      does not resolve how degree words and validation tags participate in
      equality.
    - >-
      The q-use expression epsilon^q*u_I mentions outputs y_j and x_j without
      defining whether challenges are identical or fresh, whether calls are
      adaptive or stateful, how inverter randomness is coupled, or how invalid
      outputs, retry caps, and aborts compose. Correlated selectors are
      discussed, but the repeated-use game that quantifies them is absent.
  consequence: >-
    The full parser and repeated-use adversarial view required by the gap
    packet is not covered, so T5 does not hold even though the obstruction is
    candid about other missing arrows.
