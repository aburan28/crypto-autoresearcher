schema: crypto.autoresearch.proof_search_map.v1
id: PSM-IDEA-20261007-7625cc
candidate_id: IDEA-20261007-7625cc
producer_task_id: TASK-20261007-61dd3f
claim_boundary: >-
  Search map for a typed interface only. No node is a security, novelty,
  efficiency, or impossibility claim.
nodes:
  - id: N0
    statement: Exact bare-curve EndRing challenge E and output basis type
    status: specified_not_proved
  - id: N1
    statement: Public Sample and Eval of constant-degree paths from bare E
    status: proposed_discharge
  - id: N2
    statement: Polynomial Route(E,B,y) for every complete evaluable basis B
    status: missing_definition
  - id: N3
    statement: Route output is a valid endpoint preimage with explicit failure bound
    status: blocked_by_N2
  - id: N4
    statement: >-
      Inversion does not factor through a declared polynomial smaller-witness
      class, or that witness reconstructs a complete evaluable ring basis
    status: missing_theorem
  - id: N5
    statement: Endpoint-relation inverter yields a complete evaluable End(E) basis
    status: proof_lead_only
  - id: N6
    statement: Selected-message IND attacker yields an endpoint-relation inverter
    status: missing_reduction
  - id: N7
    statement: Quantitative attacker-to-EndRing theorem
    status: blocked
edges:
  - from: N0
    to: N1
    obligation: >-
      Prove fixed-ell edge enumeration, normalization, retry, and encoding
      bounds uniformly over the exact challenge support.
  - from: N1
    to: N2
    obligation: >-
      Construct a source-ring-only router; use no endpoint ring, orientation,
      planted labels, or undeclared connecting ideal.
  - from: N2
    to: N3
    obligation: >-
      Prove universal any-basis correctness and polynomial runtime under every
      GL_4(Z) basis change.
  - from: N3
    to: N4
    obligation: >-
      Define polynomial-size smaller witnesses, then prove non-factorization or
      full-ring reconstruction.
  - from: N1
    to: N5
    obligation: >-
      From sampled pi and returned pi', form dual(pi') composed with pi; prove
      nontrivial collision probability, four-dimensional generation, full-order
      saturation, evaluability, runtime, and resistance to biased outputs.
  - from: N6
    to: N5
    obligation: >-
      Supply a selected-message-correct compiler despite multiple path
      preimages, with exact game embedding and simulation.
  - from: N5
    to: N7
    obligation: >-
      State polynomial loss, query count, abort probability, and total runtime.
cheap_audits:
  - id: A1_CEST_RWCT_regression
    performed: true
    outcome: >-
      Different public object, but the same provenance-versus-necessity error
      would recur if End(E) were used only during KeyGen.
  - id: A2_collision_and_quotient
    performed: true
    outcome: >-
      pi and pi followed by an edge/dual-edge pair have the same output. Exact
      preimage recovery is ill-posed; only relation inversion is typed.
  - id: A3_any_basis_quantifiers
    performed: true
    outcome: >-
      Earliest break at N2: no router accepts every valid complete basis and no
      invariant normalization-to-route algorithm is supplied.
  - id: A4_known_false_control
    performed: true
    outcome: >-
      Leaking the full path makes inversion public while preserving superficial
      EndRing provenance. The proposed necessity argument correctly fails.
proves_too_much_control:
  object: full-path-output variant
  known_false_conclusion: recipient-only inversion
  result: >-
    Public inversion is immediate, so KeyGen provenance cannot support the
    trapdoor conclusion.
smallest_formalizable_lemma: >-
  Conditional on a typed Route oracle, prove that its output validates and has
  the requested endpoint for every admitted y. This lemma is not useful until
  Route itself is defined.
missing_definition_blocking_formalization: >-
  A polynomial source-ring-only Route(E,B,y) algorithm with an arbitrary-basis
  input contract and explicit failure bound.
dominated_by: unresolved
sota_delta:
  target_time: polynomial in lambda and L for fixed ell
  target_memory: polynomial in lambda and L
  achieved_time: null
  achieved_memory: null
  reason: Inv is unavailable
scientific_runs: 0
