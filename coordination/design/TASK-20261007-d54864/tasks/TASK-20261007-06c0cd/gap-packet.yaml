schema: crypto.autoresearch.trap_interface_gap.v1
id: RWER-ADVERSARIAL-COLLISION-LOOP-EXTRACTION
source_composition_task: TASK-20261007-06c0cd
source_candidate: IDEA-20261007-7625cc
selected_because: >-
  RWER T3 remains inconclusive, while T4 breaks at a concrete adversarial-
  inverter gap: successful endpoint relation inversion does not force useful
  non-scalar or independent loops, rank four, or full-order saturation.
preserved_subclaims:
  - A bare curve can prospectively sample and evaluate explicit fixed-degree isogeny walks without a secret ring, subject to exact distribution and encoding completion.
  - Given sampled pi:E->E_y and a different returned pi':E->E_y, dual(pi') composed with pi is an evaluable endomorphism of E.
  - The endpoint map is many-to-one; exact-preimage recovery is not justified.
failed_joint_inputs:
  - No polynomial Route(E,B,y) works from every complete basis.
  - The guaranteed edge/dual-edge collision gives a scalar loop.
  - A valid inverter may return the sampled, canonical, or padded path.
  - No lower bound exists for useful non-scalar loops, rank growth, saturation, or total extraction success.
  - No selected-message attacker-to-relation-inverter compiler exists.
single_gap_objective: >-
  Propose one revised or replacement Trap_E interface whose exact inversion
  game makes every successful adversarial inverter output, or a quantitatively
  bounded transformation of it, yield enough non-scalar independent
  endomorphisms to reconstruct and saturate a complete evaluable End(E) basis.
  The interface must remain publicly sampleable/evaluable from bare E and must
  state a minimal selected-message adapter rather than assuming one.
required_repairs:
  - Define exact X_E, Y_E, encodings, equality, validation, sampler law, retry/abort mass, and repeated-use view.
  - Define Inv for every complete evaluable basis or return a typed obstruction at that arrow.
  - Quantify useful-collision probability against original/canonical/padded adversarial outputs.
  - Give rank-four generation and full-order saturation criteria, not merely four returned loops.
  - State the IND-attacker-to-interface and interface-to-complete-ring arrows with explicit loss, runtime, queries, and aborts.
  - Re-run CEST/RWCT factorization, GL_4(Z), leaked-output, public-inversion, and malformed-input controls.
forbidden_repairs:
  - Assume a canonical path selector, endpoint ring, connecting ideal, orientation, routing table, or planted basis alignment as a free oracle.
  - Require the inverter to return a different or random preimage without enforcing that property in the game.
  - Treat scalar or proper-suborder loops as a complete ring basis.
  - Replace relation inversion by exact-preimage recovery without a public binding mechanism and proof.
  - Relabel EndRing-solver-to-inverter as a security reduction.
  - Weaken every-basis quantification, the selected-message target, or the complete adversarial view.
allowed_outcomes:
  - revised_candidate_with_all_arrows_explicit
  - materially_distinct_replacement_interface
  - typed_obstruction_naming_earliest_failed_arrow
review_standard: >-
  The unchanged revision review plan owns T1-T5. Survival establishes only a
  candidate interface; failure remains scoped to the exact syntax.
scientific_runs: 0
