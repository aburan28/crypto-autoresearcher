  - candidate_id: IDEA-20261007-c5a097
    name: UTTK
    owner_verdicts:
      T1: inconclusive
      T2: breaks
      T3: breaks
      T4: breaks
      T5: breaks
    disposition: typed_obstruction_no_continuation_selected
    preserved:
      - Public torsion-transport dependency typing names no hidden orientation or planted basis.
      - The packet correctly exposes its missing any-basis compiler and withholds security and novelty claims.
      - The additive locator and weakened-premise controls are respected.
    decisive_failures:
      - Exact sampler law and abort tails are not quantified.
      - Inv is unavailable for arbitrary complete bases and GL_4(Z) changes.
      - The only proposed inverse factors through one theta without ring reconstruction.
      - No selected-message embedding or inverter-to-complete-ring extractor exists.
      - Adversarial transcript validity, codomain-isomorphism encoding, and repeated-use view are incomplete.
    continuation_reason: >-
      Not selected: the proposed route has a demonstrated smaller-witness
      factorization and likely pointer-level overlap with the Seta trapdoor
      family, while its reduction output is already-known kernel data.
  - candidate_id: IDEA-20261007-7625cc
    name: RWER-Trap
    owner_verdicts:
      T1: inconclusive
      T2: breaks
      T3: inconclusive
      T4: breaks
      T5: breaks
    disposition: typed_obstruction_selected_for_one_gap_fed_attempt
    preserved:
      - Public path sampling and endpoint evaluation name no hidden ring, orientation, or planted basis.
      - Endpoint inversion is correctly treated as a many-to-one relation.
      - A returned different path can be composed with the sampled path to form an evaluable source endomorphism.
      - Controls, source scoping, and claim boundaries are honest.
    decisive_failures:
      - Exact edge law, normalization, field/model encodings, retry tails, and endpoint tags are incomplete.
      - No any-basis polynomial router exists.
      - Guaranteed edge/dual-edge collisions yield scalar loops.
      - A correct inverter may return the original, canonical, or padded path, providing no useful rank growth.
      - No IND-to-inverter compiler, non-scalar-loop probability, rank-four generation, saturation, or quantitative extraction bound exists.
      - Repeated-use and malformed-input views are incomplete.
    continuation_reason: >-
      Selected only because T3 remains inconclusive and the red team identified
      one concrete proof-search lead: an interface or oracle property strong
      enough to force useful non-scalar, independent collision loops and full-
      order saturation against adversarial valid inverter outputs.
