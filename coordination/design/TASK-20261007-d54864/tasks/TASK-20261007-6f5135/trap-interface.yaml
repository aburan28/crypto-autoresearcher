schema: crypto.autoresearch.endring_trap_interface.v1
identity:
  name: unoriented-torsion-transport-kernel-interface
  candidate_id: IDEA-20261007-c5a097
  producer_task_id: TASK-20261007-6f5135
  status: typed_obstruction
endring_problem:
  field_and_curve_distribution: >-
    p>3; E/F_{p^2} is the canonical endpoint of a declared-length uniform
    nonbacktracking small-degree walk from public E0 with Frobenius [-p]. The
    walk is erased and the challenge contains only E and public parameters.
  challenge_input: "a bare encoded curve E over F_{p^2}; no walk, orientation, torsion basis, or connecting isogeny"
  allowed_auxiliary_information: "p, E0, walk length/law, and factored coprime smooth n,N dividing p+1"
  required_output_representation: "any complete evaluable rank-four Z-basis of End(E), with arithmetic and map evaluation"
  conditional_dependencies:
    - "the distribution-to-EndRing hardness connection is open"
    - "the reported torsion-attack route is not verified from a primary source here"
    - "no GRH-based equivalence is invoked as a discharge"
domains:
  X_E: "triples (R,P,Q): ord(R)=n and (P,Q) is a basis of E[N], modulo R~[u]R for units u mod n"
  Y_E: "pointed transport transcripts (E',P,Q,P',Q') with E'=E/<R>, P'=phi_R(P), Q'=phi_R(Q)"
  encodings: "affine/projective point encodings with an infinity tag; explicit curve models; deterministic factor order for the smooth isogeny chain"
  equality_or_equivalence: "input equality is kernel equality; output equivalence requires an explicit codomain isomorphism transporting P',Q'"
  validation: "curve membership, exact n/N order using public factorizations, primitive Weil pairing, and transcript curve membership"
  failure_symbols: [INVALID_ENCODING, WRONG_ORDER, DEPENDENT_TORSION, INV_ANY_BASIS_COMPILER_UNDEFINED]
algorithms:
  Sample_from_bare_E: >-
    Rejection-sample R,P,Q from the known E(F_{p^2}) group, cofactor to the
    required torsion, verify exact orders and e_N(P,Q) primitive, then call Eval.
  Eval_from_bare_E: >-
    From R and the public factorization of n, build phi_R as a fixed-order
    chain of small-degree Velu quotients and evaluate P,Q along the chain.
  Inv_from_complete_basis: >-
    UNAVAILABLE. Required algorithm would compile every valid basis B to an
    attack-suitable endomorphism theta and recover <R> from the torsion
    transport. No such compiler or verified recovery theorem is supplied.
  runtimes: "Sample/Eval are conditionally polynomial when prime factors and rejection tails are polynomially bounded; Inv has no polynomial runtime"
  failure_bounds: "public retry/failure tails are not quantified; Inv fails by definition in this packet"
any_basis_statement:
  basis_representation: "four evaluable endomorphisms forming a Z-basis, with exact ring arithmetic"
  quantified_correctness: "required for every supported E, every valid complete basis B, and every valid transcript; not established"
  change_of_basis_audit: "B and BU for arbitrary U in GL_4(Z) define the same ring, but bounded coordinate search for theta is not invariant and supplies no uniform bound"
necessity:
  smallest_known_sufficient_witness: "conditionally, one attack-suitable evaluable non-scalar theta plus a verified torsion-attack procedure"
  factorization_search: "candidate inverse factors as B -> theta -> kernel whenever those two missing algorithms exist; replacing B by theta preserves the transcript operation"
  non_factorization_or_reconstruction_theorem: "none; no theorem reconstructs a complete evaluable ring basis from theta on this distribution"
reduction:
  first_security_game: "OW-UTTK: given E and Trap_E(x) for random valid x, output an equivalent kernel generator"
  challenge_embedding: "no PKE exists and no selected-message challenge embedding is defined"
  oracle_simulation: "none"
  attacker_to_interface_step: "missing"
  interface_to_complete_ring_step: "missing; the available outline is complete ring -> theta -> inversion, the wrong direction"
  loss_runtime_abort: "undefined because both reduction arrows are absent"
audits:
  CEST_RWCT_regression: "breaks complete-ring necessity: one theta would replace B without changing inversion"
  observation_collisions: "unit-generator collisions are admitted; distinct-kernel pointed-transcript collisions remain open"
  quantifier_order: "fails at the every-valid-basis compiler; a planted helpful basis is insufficient"
  known_false_control: "publishing R makes inversion public while EndRing-solver-to-inverter remains true"
  method_ceiling: "static typing/obstruction only; no impossibility, security, novelty, or practicality inference"
obligations:
  O1: open
  O2: open
  O3: open
  O4: open
  O5: open
  O6: open
provenance:
  sources_read:
    - "KN-LIT-6572 repository pointer only; its primary paper was not read"
    - "KN-LIT-6628, KN-LIT-827, and KN-LIT-1260 repository pointers only"
    - "docs/scheme-construction-contract.md"
  prior_art_delta: "The normalized public transcript and torsion-attack inversion outline likely overlap Seta; only the any-basis audit is sharpened here, so distinctness is not established."
  novelty_status: unverified

