smallest_formalizable_lemma: >-
  Define and prove a basis-change-invariant polynomial compiler which outputs
  an attack-suitable theta from every valid complete evaluable basis, with
  explicit degree and success bounds; absent that definition, formalization
  should stop at the typed missing arrow.
method_ceiling: "These audits can reject this packet's claimed route but cannot prove no EndRing trapdoor interface exists."

