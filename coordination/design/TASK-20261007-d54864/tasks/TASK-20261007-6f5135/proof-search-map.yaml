    argument: "R~[u]R is declared; no proof excludes distinct kernels with equivalent pointed transport transcripts."
  - id: A3-QUANTIFIERS
    result: break
    argument: "No basis-change-invariant polynomial compiler B->theta is defined for all B and E."
  - id: A4-KNOWN-FALSE
