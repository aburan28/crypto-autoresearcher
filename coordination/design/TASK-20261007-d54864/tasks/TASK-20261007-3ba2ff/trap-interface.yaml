schema: crypto.autoresearch.endring_trap_interface.v1
identity:
  name: saturation_filtered_rwer
  candidate_id: IDEA-20261007-0024cc
  producer_task_id: TASK-20261007-3ba2ff
  status: typed_obstruction
endring_problem:
  field_and_curve_distribution: exact supersingular EndRing challenge distribution; not otherwise strengthened here
  challenge_input: bare supersingular curve E with canonical public encoding
  allowed_auxiliary_information: public path-degree alphabet and validation parameters only
  required_output_representation: complete evaluable rank-four Z-basis of End(E), saturated to the maximal order
  conditional_dependencies: []
domains:
  X_E: k-tuples of validated length-L explicit small-degree isogeny walks starting at E
  Y_E: canonical endpoint tuple, degree words, and public validation tags
  encodings: canonical curve, kernel, edge-incidence, degree-word, and tuple encodings
  equality_or_equivalence: exact tuple equality after canonical endpoint serialization
  validation: reject malformed curves, kernels, incidence, lengths, degrees, or noncanonical bytes
  failure_symbols: [abort_retry_cap, invalid_encoding, no_route, unsaturated]
algorithms:
  Sample_from_bare_E: public random validated walk sampling with a declared retry cap
  Eval_from_bare_E: public sequential isogeny evaluation from E
  Inv_from_complete_basis: "MISSING: no polynomial Route(E,B,y) for every complete evaluable basis"
  runtimes: Sample and Eval are polynomial in lambda, k, and L; Inv has no established runtime
  failure_bounds: sampler abort mass is parameter-dependent and uninstantiated; Inv failure is unbounded
any_basis_statement:
  basis_representation: four evaluable endomorphisms with multiplication/trace data sufficient to certify a maximal order
  quantified_correctness: fails because no algorithm is supplied for every valid basis and admitted y
  change_of_basis_audit: arbitrary GL_4(Z) change destroys any planted-coordinate routing assumption
necessity:
  smallest_known_sufficient_witness: an endpoint-preimage selector suffices for ordinary inversion but not for complete-ring extraction
  factorization_search: deterministic canonical or padded selectors can factor inversion through endpoint data
  non_factorization_or_reconstruction_theorem: "MISSING: ordinary inversion success gives saturation probability lower bound zero"
reduction:
  first_security_game: one-bit selected-message IND-CPA adapter using ciphertext (y, m xor h(x))
  challenge_embedding: "MISSING: fiber-dependent h breaks correctness; fiber-constant h lacks decision-to-search embedding"
  oracle_simulation: no decryption oracle in IND-CPA; public sampling and evaluation are simulable
  attacker_to_interface_step: "MISSING: bit prediction does not yield a relation preimage"
  interface_to_complete_ring_step: "For q valid inversions, success is epsilon^q*u_I; no positive lower bound on u_I"
  loss_runtime_abort: "No finite positive two-hop bound; A1 missing and A2 lower bound is zero"
audits:
  CEST_RWCT_regression: finite endpoint observables do not enforce hidden-preimage diversity
  observation_collisions: canonical, original, padded, scalar-loop, repeated-loop, and proper-suborder outputs remain admissible
  quantifier_order: every E, every complete evaluable basis, every admitted y; requirement is not met
  known_false_control: public inversion makes the adapter public but still need not generate a full ring
  method_ceiling: scoped only to endpoint-preimage RWER without public binding or a proved conditional-fiber theorem
obligations:
  O1: open
  O2: contradicted
  O3: contradicted
  O4: open
  O5: contradicted
  O6: proposed_discharge
provenance:
  sources_read:
    - docs/scheme-construction-contract.md
    - research/ssi-endring-pke/2026-10-07-trapdoor-interface/methodology.md
    - research/ssi-endring-pke/2026-10-07-trapdoor-interface/legacy-correction-addendum.md
  prior_art_delta: no novelty claim; this packet isolates a reduction obstruction in the selected RWER syntax
  novelty_status: unverified
typed_obstruction:
  id: RWER-PUBLIC-RELATION-CANNOT-FORCE-SATURATION
  earliest_failed_arrow: selected-message IND attacker to endpoint-relation inverter
  second_failed_arrow: ordinary endpoint-relation inverter to complete-ring extraction
  quantitative_statement: infimum of useful saturation probability over successful valid selectors is zero
  clears_when: public binding plus every-basis inversion and a selected-message theorem, or a selector-robust conditional-fiber saturation theorem

