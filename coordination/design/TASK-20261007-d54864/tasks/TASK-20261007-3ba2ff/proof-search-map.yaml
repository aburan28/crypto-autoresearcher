schema: crypto.autoresearch.proof_search_map.v1
id: PSM-TASK-20261007-3ba2ff
candidate_id: IDEA-20261007-0024cc
outcome: typed_obstruction
target_statement: >-
  A selected-message attacker with advantage delta yields, through RWER,
  a complete evaluable basis of End(E) with polynomial loss.
arrows:
  - id: A0
    statement: public bare-E sampling and endpoint evaluation
    status: prospective
    missing: exact challenge distribution and retry-mass instantiation
  - id: A1
    statement: selected-message IND attacker yields an endpoint-relation inverter
    status: missing
    witness: >-
      The minimal mask adapter needs h constant on Eval fibers for correctness,
      while bit prediction supplies no relation preimage without a separate
      decision-to-search theorem.
  - id: A2
    statement: q successful endpoint inversions yield a full maximal-order basis
    status: contradicted_for_exact_syntax
    witness: >-
      Ordinary validity permits deterministic canonical or padded selectors;
      the uniform lower bound on non-scalar independent saturated loops is zero.
  - id: A3
    statement: Inv routes from every complete evaluable basis to every admitted endpoint tuple
    status: missing
    witness: no basis-independent polynomial Route(E,B,y) is supplied
cheap_audits:
  factorization:
    result: breaks
    detail: inversion may factor through a deterministic endpoint selector
  collision:
    result: breaks
    detail: valid collisions may be exact, scalar, repeated, rank-deficient, or proper-suborder
  quantifier_order:
    result: breaks
    detail: a planted or aligned basis cannot establish the every-basis statement
  proves_too_much_control:
    result: passes_as_negative_control
    detail: public inversion reveals the message but still need not yield a saturated full ring
smallest_formalizable_lemma: >-
  In the abstract many-to-one map model, ordinary inversion success alone
  implies no positive lower bound on a hidden-original-dependent saturation
  predicate over all valid deterministic selectors.
formalization_blocker: >-
  Concrete Walk_L encodings, exact endpoint equality, and an End(E)-order
  saturation verifier remain uninstantiated; the abstract zero-bound does not
  establish an impossibility for richer interfaces.
successor_proof_obligations:
  - prove a public binding mechanism compatible with every-basis inversion
  - prove an IND-to-search compiler for the exact adapter distribution
  - prove selector-robust rank-four generation and maximal-order saturation
  - account explicitly for q, epsilon, runtime, retry abort, and malformed inputs

