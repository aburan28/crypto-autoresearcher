exactly_one_next_action:
  id: ENDRING-PUBLIC-BINDING-INTERFACE
  owner: future_coordinator
  automatic_launch: false
  objective: >-
    Before another PKE wrapper or RWER variant, define and audit a publicly
    checkable binding relation whose honest output has a unique or publicly
    equivalent preimage, while public Sample/Eval use only bare E and Inv works
    from every complete evaluable End(E) basis. State the exact parser and
    repeated-use game, then prove either attacker-to-preimage-to-complete-ring
    extraction with quantitative bounds or a scoped obstruction at the first
    missing arrow.
  acceptance: >-
    The binding predicate is public and polynomial, does not encode an
    orientation/selector/connecting ideal/ring witness, is compatible with all
    valid basis presentations, and closes fiber-correctness before reduction
    analysis.
  exclusions:
    - no canonical selector or exact-preimage oracle by definition
    - no hidden endpoint order, orientation, or planted alignment
    - no inference that provenance proves complete-ring necessity
    - no automatic successor launch
