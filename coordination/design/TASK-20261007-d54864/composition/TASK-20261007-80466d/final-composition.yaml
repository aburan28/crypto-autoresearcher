  - candidate_id: IDEA-20261007-0024cc
    name: saturation-filtered-RWER
    status: typed_obstruction_with_review_correction
    joints: {T1: breaks, T2: breaks, T3: inconclusive, T4: holds_as_scoped_missing_arrow_obstruction, T5: breaks}
    earliest_failed_arrow: selected_message_attacker_to_endpoint_relation_inverter
    second_failed_arrow: endpoint_relation_inverter_to_complete_ring
    preserved_result: >-
      The minimal mask adapter exposes the fiber-correctness problem and the
      packet correctly stops at missing reduction arrows. Ordinary endpoint
      validity supplies no proved positive saturation bound.
    reviewer_correction: >-
      The producer's equality epsilon^q*u_I is not justified without an
      independence and call model. The exact concrete infimum-zero claim also
      needs an admissible selector preserving fixed length, degree words, and
      endpoint equality. The reviewed statement is only that no positive bound
      is derived; a proved zero-bound theorem remains open.
    complete_view_failure: >-
      Exact byte grammar, equality participation of degree words/tags,
      repeated-use state/adaptivity/randomness coupling, and composed abort
      semantics are not defined.
