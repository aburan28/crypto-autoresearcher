review_plan:
  batch_id: BATCH-cb7b9a
  claim_under_review: >-
    Each frozen packet defines a basis-independent Trap_E interface or a typed
    obstruction and accurately scopes its possible use in a later EndRing PKE.
  coordinator_prior: >-
    Expect most interfaces to factor through a smaller witness or fail bare-
    curve sampling. A useful negative identifies the earliest failed arrow; a
    survivor remains an interface candidate, never a secure scheme.
  joints:
    - joint: "T1: bare-curve public sampling and exact distribution"
      assigned_to: TASK-20261007-ab8d2f
      attack_plan: "Trace every dependency of Sample and Eval and compare the real view with a bare EndRing challenge."
      breaking_artifact: "Hidden ring/orientation/torsion/alignment data or an unembedded real-public-view field."
    - joint: "T2: typed any-basis inversion"
      assigned_to: TASK-20261007-ab8d2f
      attack_plan: "Blindly derive domains, correctness, failure and cost; apply alternative valid bases and unimodular basis changes."
      breaking_artifact: "Ill-typed call, planted-basis-only proof, unbounded retry, or non-polynomial subroutine."
    - joint: "T3: complete-ring necessity"
      assigned_to: TASK-20261007-df7b77
      attack_plan: "Find the smallest evaluator or witness through which Inv factors; seek observable collisions."
      breaking_artifact: "Strict smaller witness without a complete-ring reconstruction theorem."
    - joint: "T4: correctly directed reduction"
      assigned_to: TASK-20261007-df7b77
      attack_plan: "Start from bare E, build the exact view, simulate access, use the attacker, and output a complete basis with quantitative accounting."
      breaking_artifact: "Failed embedding/simulation/extraction, one-bit-to-basis gap, or only the reverse attack implication."
    - joint: "T5: complete view, controls, sources, prior art, and visual consistency"
      assigned_to: TASK-20261007-70a40e
      attack_plan: "Audit encodings, malformed inputs, repetition, auxiliary data, known-false controls, cited source scope, prior-art normalization, and identical Markdown/Mermaid/SVG/PDF routing."
      breaking_artifact: "Uncovered view, control that falsely passes, source/locator defect, prior-art identity, or divergent rendering."
  proves_too_much:
    objects:
      - "Leaked-output control: Y_E contains x or a public inverse."
      - "Public-inversion control: Inv is copied into public parameters."
    failure_signature: "T3/T4 must fail to infer confidentiality or EndRing extraction for both controls."
    assigned_to: TASK-20261007-df7b77
  inherited_controls:
    source: research/ssi-endring-pke/2026-10-07-trapdoor-interface/methodology.md
    correction: research/ssi-endring-pke/2026-10-07-trapdoor-interface/legacy-correction-addendum.md
  blindness:
    mutual: true
    validator_blind_from: [candidate.md, proof-search-map.yaml, red-team output, T5 output]
    red_team_blind_from: [validator output, T5 output]
    t5_blind_from: [validator output, red-team output]
  verdicts: [holds, breaks, inconclusive]
  whole_claim_vote: forbidden
  procedure_deviations: []
