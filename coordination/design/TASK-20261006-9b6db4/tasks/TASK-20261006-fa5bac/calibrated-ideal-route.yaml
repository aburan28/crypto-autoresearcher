input:
  exact: [O, E, C, P, X, D, N, U, V, k, frozen_encodings]
  excluded: [Hom_E_C, connecting_ideal, target_order, target_embedding, orientation, sender_map, sender_dual, per_instance_advice]
sought_object:
  ideal: "proper primitive left O-ideal I with nrd(I)=D and [O:I]=D^2"
  local_type: cyclic 2^a-kernel, not merely an ideal of equivalent class or smooth auxiliary norm
  right_order: "O_R(I), with an evaluated geometric identification to End(C)"
  map: "evaluated separable cyclic f_I:E->C of exact degree D, f_I(P)=X"
  certificate: "integrality, left stability, HNF/index, norm, primitivity, cyclicity, right order, kernel, degree, codomain, model, column and evaluation"
program: |
  Parse O and validate its represented multiplication, norm and evaluator certificates.
  Enumerate or select primitive norm-D left-ideal candidates without instance advice.
  Verify integrality, left stability, index D^2, reduced norm D and cyclic local type.
  Invoke CALIBRATED_IDEAL_REALIZE(O,E,C,P,X,D,I).
  Verify the returned right order, kernel/map, exact model, degree and f(P)=X.
  Evaluate f(U),f(V), run the checked slope decoder, and return (I,f,m,certificate).
missing_interface:
  name: CALIBRATED_IDEAL_REALIZE
  signature: "(represented O, labelled E,C,P,X,D, candidate I) -> evaluated f:E->C plus complete certificate or tagged failure"
  must_not_hide: [connecting_path, target_EndC_evaluators, Hom_anchor, target_frame, orientation, sender_map, instance_advice]
  theorem_required: uniform correctness, bit-time, memory, output, preprocessing and failure bounds for every admitted honest instance
selection_and_enumeration:
  local_branching: "primitive local norm-2 chains have the same three initial and two nonbacktracking choices as degree-two isogeny chains"
  exhaustive_bound: exponential in a before cycles/mergers
  finite_lattice_checks: fixed-rank HNF/SNF verifies a supplied candidate but does not select the target ideal class
charges:
  norm_index_cyclicity: exact reduced-norm form, HNF/SNF index D^2, local primitivity and cyclic quotient/kernel tests
  saturation_division: source/ideal saturation, denominator removal, exact division identities and intermediate coefficient growth
  KLPT_enumeration: "attempt cost, auxiliary norms, factoring/smoothness assumptions, success eta and inverse-success amplification"
  exact_norm_limit: an equivalent smooth ideal need not preserve norm D, cyclic type, C or X
  right_order: computation of O_R(I), its integral basis, discriminant and certificates
  codomain_isomorphism: effective Deuring realization followed by all F-isomorphisms to exact public C
  automorphism_calibration: enumerate residual automorphisms and retain only the signed f(P)=X match
  evaluation: ideal-to-kernel, kernel-to-chain/map, dual if used, f(U), f(V), and certificate evaluators
  normalization: global curve/model selection and simultaneous map/point transport
  memory_output: every lattice coefficient, denominator, kernel point, chain node, map node and certificate bit
  failure: separate selection, norm, KLPT, realization, codomain, calibration, evaluator and decoder failures
cost:
  bit_time: "T_select+T_norm+T_sat+T_KLPT+T_right+T_realize+T_iso+T_aut+T_cert+2*Eval_f+decoder; no polynomial bound supplied"
  memory: "M_select+M_KLPT+M_realize+M_cert; no polynomial bound supplied"
  output: "B_I+B_f+B_cert; dense degree-D f may require Theta(D log p) bits unless a verified compact evaluator is returned"
  preprocessing: none uncharged; exponential class/path tables are forbidden as hidden advice
  success: "eta_select, eta_KLPT and eta_realize unassigned; amplification cannot be called polynomial"
correctness_boundary:
  conditional: exact certified f with f(P)=X equals the honest map under N>4D, then the U,V decoder returns m
  current: no instantiated CALIBRATED_IDEAL_REALIZE and no bit-polynomial selected ideal
  universal_impossibility: false
decoder:
  map_required: true
  ideal_only: bottom(UNEVALUATED_IDEAL)
  right_order_only: bottom(UNEVALUATED_TARGET_ORDER)
  path: "f(U),f(V) -> checked power-of-two slope -> m=s mod 2^k"
