task_id: TASK-20261006-fa5bac
mechanism: unique_calibrated_map_reconstruction
finalist_count: 0
proof_search_map:
  bottleneck: >-
    Convert the unique one-column observation (C,X=f(P)) and represented
    source O into either a polynomial-size evaluated f:E->C or directly
    f(U),f(V), in bit time and memory polynomial in encoded input length.
  baseline_embedding:
    exact_parameter_slice: >-
      Inherited total-L admitted interface with D=2^a, N=5^b>4D,
      exact labelled E,C,P,X,U,V, represented/evaluable O, and no connection,
      target order/action, orientation or advice.
    reproduction_check: >-
      Re-derive alpha(P)=Q and W=[D]f(Q) only as inherited conditional
      identities; reproduce the charged decoder from an actually evaluated f.
      Embed the prior BATCH-066c3b boundary by requiring that an ideal, target
      relation system or target order without an evaluator is rejected.
    new_exact_baseline: >-
      Route A uses exactly 2D distinct orbit samples to reconstruct the dense
      x-map by Padé interpolation, fixes the y sign from P->X, verifies the
      curve identity, evaluates U,V and decodes m.
    nonduplication: >-
      BATCH-066c3b supplied no map.  This search adds an explicit exponential
      interpolation baseline, an exact two-sided point-labelled chain join,
      and a single charged calibrated-ideal-realization interface; it does not
      reuse F1, F2 or F3 as a finalist.
  observation_collision:
    observable: "exact normalized labelled C and full signed X=f(P), for homomorphisms of degree <=D"
    distinct_preimage_search:
      exact_observable: >-
        If f(P)=g(P), then P lies in ker(f-g); N<=deg(f-g)<=4D for f!=g,
        contradicting N>4D.  No exact honest collision is exhibited.
      relaxed_x_only: "f and -f have the same x-coordinate observation; full signed X separates them"
      relaxed_pairing_only: "the invariant pairing value forgets the slope; a full labelled second column separates it"
      relaxed_model: "unrecorded codomain isomorphisms preserve j but change point coordinates; exact normalized C,X separate them"
      relaxed_bound: "N<=4D removes this degree separator but is not itself an exhibited collision"
    additional_condition: >-
      exact signed X, exact labelled normalized models, homomorphism semantics,
      degree <=D, exact ord(P)=N and strict N>4D.
  quantifier_order: >-
    There exists one fixed uniform program and one polynomial q before, for
    every successful Setup, admitted key, honest m and sender randomness r,
    the program returns f(U),f(V) and m within q; only recipient coins are
    averaged, under a uniform declared failure bound.  The weaker statement
    forall instance exists a dense map/ideal/chain is insufficient.
  constructive_transforms:
    - transform: representation_reduction
      route: A
      proposed_object: "degree-bounded rational map reconstructed from its orbit graph"
      predicted_gain: "turn uniqueness into a finite evaluator and expose the exact Theta(D) representation cost"
      result_scope: finite dense construction, not bit-polynomial
    - transform: stronger_invariant
      route: B
      proposed_object: "midpoint curve plus transported labelled N-torsion point and forbidden dual edge"
      predicted_gain: "make the forward/backward collision sound and complete for chain factorizations"
      result_scope: balanced Theta(2^(a/2)) time and memory
    - transform: representation_reduction
      route: C
      proposed_object: "primitive cyclic norm-D left ideal with exact calibrated geometric realization"
      predicted_gain: "separate ideal verification from target class selection and effective evaluation"
      result_scope: stops at CALIBRATED_IDEAL_REALIZE or exponential enumeration
    - transform: observable_fiber
      route: evaluator_only
      proposed_object: "transposed Padé functionals at U,V without dense output"
      predicted_gain: "small evaluator output if construction can avoid dimension D"
      result_scope: stops at MISSING_SUBLINEAR_ORBIT_EVALUATOR
  method_ceiling:
    strongest_certifiable_claim: >-
      A finite public dense reconstruction with exact message decoding and
      explicit exponential cost; exact exponential chain/ideal baselines; and
      named interfaces required for a bit-polynomial evaluator.
    nearby_object_control:
      - "x(X)-only observation admits the sign pair f,-f"
      - "pairing-only observation is constant across slopes"
      - "a supplied evaluated connection makes the same decoder public"
      - "a dense map of degree D is finite but violates the encoded-bit gate"
      - "a compact ideal/right-order label without evaluation returns no point"
    cannot_certify: [uniform_bit_polynomial_reconstruction, recipient_only_advantage, EndRing_security_reduction, universal_impossibility]
  proof_obligations:
    interface:
      - exact typed parsers and semantic verifiers for all inherited encodings
      - "CALIBRATED_IDEAL_REALIZE or MISSING_SUBLINEAR_ORBIT_EVALUATOR must be instantiated without forbidden inputs"
      - every returned object must evaluate on U,V on exact C
    runtime:
      - bound samples, field/group operations, intermediate bits, memory, output and preprocessing by a polynomial in encoded length
      - charge branch tables, cycles/mergers, norm/KLPT attempts and inverse success probabilities
      - distinguish numeric-D from bit-length complexity
    correctness:
      - verify degree, separability, curve identity, codomain, f(P)=X and kernel shape
      - prove sound/complete chain join and ideal-to-map conversion
      - prove two returned evaluations feed the checked decoder to actual m
    scope:
      - retain all seven admission obligations and source-tier limits
      - separate malformed, wrong-key, admission, evaluator and decoder failures
      - make no security, practicality, deployment, novelty or universal-impossibility claim
  not_applicable_reason: null
controls:
  proves_too_much: >-
    Any reasoning that also calls an unevaluated ideal a map, decodes from a
    constant pairing observation, or declares a dense D-size solve
    bit-polynomial is rejected.
  exact_baseline_control: Route A must reproduce f(P)=X and the cleared curve identity before its output is used.
  nearby_false_control: x-only observation must retain the f/-f ambiguity.
  public_connection_control: publishing f lets any party run the same U,V decoder.
claim_boundary:
  novelty_status: unverified
  measured_results: none
  scientific_runs: 0
  implementation_runs: 0
  formalizer_runs: 0

