task_id: TASK-20261006-fa5bac
statement_type: producer_authored_bare_definition
definitions:
  field: F_p2
  curves: "E,C over F_p2"
  order: "O=End(E), represented by four domain-labelled evaluable maps and an integral multiplication table"
  parameters: "D=2^a, N=5^b, N>4D, k=floor(a/2)"
  points: "P in E[N], X in C[N], U,V in E[D]"
  target_map: "a separable degree-D homomorphism f:E->C with f(P)=X"
  message_relation: "ker(f)=<U+sV>, s=m+2^k*r, 0<=m<2^k, 0<=r<2^(a-k)"
  allowed_input: [O, E, C, P, X, D, N, U, V, k, frozen_encodings]
  excluded_input: [Hom_E_C, connecting_isogeny, target_order_action_frame, orientation, sender_map_or_dual, retained_walk, instance_advice, exponential_preprocessing]
route_A_pseudocode: |
  For i=1..2D set u_i=x([i]P), v_i=x([i]X).
  Solve A(u_i)=v_i*B(u_i) with deg(A)<=D and deg(B)<=D-1.
  Canonically scale A,B and set R=A/B.
  Set c=R'(x(P))*y(P)/y(X).
  Define f(x,y)=(R(x),y*R'(x)/c).
  Check field, model, degree, curve identity, f(P)=X and certificates.
  Evaluate f(U),f(V), then call Decode.
route_B_pseudocode: |
  Enumerate forward nonbacktracking degree-two chains from E to depth floor(a/2).
  Enumerate backward nonbacktracking degree-two chains from C to depth ceil(a/2).
  Transport P forward and X backward on N-torsion.
  Join equal labelled midpoint states under explicit model isomorphisms.
  Compose and check each joined degree-D map.
  Evaluate f(U),f(V), then call Decode.
route_C_pseudocode: |
  Construct a proper primitive left O-ideal I of reduced norm D and index D^2.
  Check cyclic local type and compute its right order.
  Realize I as an evaluated degree-D map f:E->C.
  Calibrate the codomain isomorphism and automorphism by f(P)=X.
  Check all ideal, map, model and evaluation certificates.
  Evaluate f(U),f(V), then call Decode.
evaluator_only_pseudocode: |
  PreEval(O,E,C,P,X,D,N,encodings) returns a data structure DS.
  Eval2(DS,U,V) returns f(U),f(V) or a tagged failure.
decode_pseudocode: |
  A0=f(U); B0=f(V).
  H=[2^(a-k)]B0; G=-[2^(a-k)]A0.
  Check ord(B0)=D and ord(H)=2^k.
  Recover t from G=[t]H with k checked binary digits.
  Check [t]H=G and return t.
claimed_quantities:
  route_A_samples: 2D
  route_A_dense_coefficient_slots: "2D+1 up to one projective scaling"
  route_B_initial_branching: 3
  route_B_nonbacktracking_branching: 2
  route_B_balanced_state_scale: "2^(a/2) up to polynomial factors"
  ideal_index: "D^2"
  decoder_map_evaluations: 2
  decoder_group_work: "O(k^2+a)"
  scientific_runs: 0
  implementation_runs: 0
  formalizer_runs: 0
  experiment_runs: 0

