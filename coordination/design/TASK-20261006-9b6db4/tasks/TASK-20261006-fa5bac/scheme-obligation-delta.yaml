format: scheme-construction-contract/v1-delta
task_id: TASK-20261006-fa5bac
goal_id: GOAL-SSI-2fa82a
primitive: pke
scope: one recipient evaluator/reconstruction obligation on the frozen conditional interface
security_claims: []
obligations:
  O1:
    name: exact_hard_problem
    status: open
    delta: >-
      The task fixes the recipient input as represented/evaluable O=End(E)
      plus the complete public E,C,P,X,D,N,U,V,k interface, and distinguishes
      evaluated maps, abstract orders, ideals and target action.  It does not
      define or reduce the complete real key distribution to a bare EndRing
      challenge.
    retained_gaps: [A_PRIME_SOURCE, A_ACCEPT, A_SAT_DIV, A_SUPPORT, A_CERT, A_NORM, A_EVAL, exact_EndRing_sampler_and_output_relation]
    next_action: freeze the exact augmented EndRing problem and representation conversion only if a bit-polynomial recipient program exists
  O2:
    name: honest_party_algorithms
    status: open
    delta: >-
      Route A supplies a finite deterministic dense reconstruction and actual
      message decoder, with Theta(D) samples/output.  Route B is an
      exponential meet-in-the-middle.  Route C lacks
      CALIBRATED_IDEAL_REALIZE.  No efficient recipient algorithm is supplied;
      KeyGen/Encrypt admission remains inherited and conditional.
    unavailable_subroutines: [MISSING_SUBLINEAR_ORBIT_EVALUATOR, CALIBRATED_IDEAL_REALIZE]
    complexity_guarantee: no uniform polynomial encoded-bit guarantee
    next_action: instantiate one missing interface with full bit-time/memory/output/preprocessing/failure bounds
  O3:
    name: quantified_correctness
    status: open
    delta: >-
      Conditional on an admitted honest instance and a certified actual f,
      N>4D makes f unique and the two-evaluation binary decoder returns the
      actual m=s mod 2^k for every m,r.  Admission probability, efficient
      evaluator success and nonhonest-input behavior remain unresolved, and
      no independent review is claimed.
    probability_space: separate Setup, key admission, route/evaluator, decoder and malformed/wrong-key events
    failure_probability_bound: "Route A finite reconstruction is deterministic after admission but exponential; efficient route failure is undefined"
    actual_message_or_key_recovery: conditional actual message, not merely W/Y or an orbit
    next_action: prove the full per-valid-key efficient correctness theorem after an evaluator is instantiated
  O4:
    name: functionality_mechanism
    status: open
    delta: >-
      The required private operation is now typed exactly as a calibrated map
      evaluator returning f(U),f(V), followed by the charged slope decoder.
      Dense interpolation shows finite functionality publicly in exponential
      work, so it does not establish a recipient-only efficient advantage.
    public_operation: sender constructs C and X=f(P) under the inherited admitted law
    private_operation: "PreEval/Eval2 from O,E,C,P,X,D,N to f(U),f(V), then binary slope decode"
    extra_recipient_secrets: [represented_evaluable_O_only]
    recipient_lift:
      applicability: true
      interface: "MISSING_SUBLINEAR_ORBIT_EVALUATOR or CALIBRATED_IDEAL_REALIZE"
      inputs: "O,E,C,P,X,D,N,U,V and frozen encodings"
      output_representation_and_equivalence: "two exact C points or a certified evaluated f/kernel"
      uniqueness_or_acceptance_condition: "exact signed column and N>4D"
      polynomial_algorithm_and_cost: open
      failure_bound: open
      recovery_of_actual_message_or_key: "f(U),f(V) -> m=s mod 2^k"
      identical_public_data_control: dense public interpolation also recovers f and m in Theta(D)-scale work
    next_action: supply and review one uniform polynomial recipient lift without hidden connection data
  O5:
    name: correctly_directed_security_reduction
    status: open
    delta: >-
      None.  An EndRing/evaluated-order solver followed by a future recipient
      evaluator and decoder is only a solver-to-decrypt attack upper bound.
      No IND-CPA adversary is converted into an EndRing solution, and no
      challenge embedding, oracle simulation, extraction, advantage loss or
      witness pullback is supplied.
    reductions: []
    intermediate_assumptions: []
    next_action: only after complete functionality, state an IND-CPA game and construct the reverse adversary-to-EndRing reduction or name a distinct intermediate assumption
  O6:
    name: complete_adversarial_view
    status: open
    delta: >-
      The task adds dense-interpolation, two-sided-chain, ideal-equivalence,
      public-connection, x-only sign, pairing-only, malformed/wrong-key and
      evaluator-only controls.  Exact certificate serializers, validation
      leakage, accepted-law support, repeated ciphertexts and side channels
      remain open.
    public_disclosures: [E, C, P, X, D, N, U, V, k, frozen_public_encodings_and_certificates]
    validation_rejection_and_failure_observables: tagged failures are specified per route but complete leakage analysis is absent
    malformed_inputs_and_alternate_encodings: detectable parse/domain/order/degree/certificate mismatch is rejected; plausible nonhonest inputs have no universal guarantee
    public_data_and_known_false_controls: [public_dense_interpolation, supplied_connection, x_only_sign_collision, constant_pairing_observable, unevaluated_ideal]
    concrete_parameter_security: not assessed
    next_action: complete the adversarial-view artifact only after exact serializers and a complete candidate exist
