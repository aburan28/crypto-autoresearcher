blind_rederivation:
  task_id: "TASK-20261006-a9050f"
  producer_task_id: "TASK-20261006-fa5bac"
  scope: ["J1", "J2"]
  sources_read:
    - "coordination/design/TASK-20261006-9b6db4/handoffs/TASK-20261006-a9050f.yaml"
    - "coordination/design/TASK-20261006-9b6db4/tasks/TASK-20261006-fa5bac/blind-statement.yaml"
  canonical_verdicts:
    J1: "breaks"
    J2: "breaks"
  blind_quantities:
    Q1:
      result: "2D samples"
      derivation: >-
        There are D+1 numerator coefficients and D denominator coefficients.
        The 2D homogeneous interpolation equations leave at least the common
        scaling.  If P has exact order N, X has exact order N, N>4D, and the
        x-coordinates use i=1,...,2D, then x([i]P)=x([j]P) would imply
        i congruent to plus or minus j modulo N; the strict bound rules this
        out for distinct i,j in that range.  For reduced coprime pairs of the
        stated exact degree bounds, a cross-product difference has degree at
        most 2D-1, so these 2D distinct finite samples determine the rational
        function.  None of exact order, finiteness, coprimality, or full-rank
        normalization is explicit in the bare statement.
    Q2:
      result: "2D+1 dense coefficient slots, or 2D projective parameters"
      derivation: >-
        deg(A)<=D contributes D+1 field slots and deg(B)<=D-1 contributes D,
        for 2D+1 stored slots.  Quotienting by one nonzero common scalar leaves
        2D projective degrees of freedom.  A literal dense serialization over
        F_(p^2) is Theta(D log p) bits and takes that much output space/time,
        subject to the fixed encoding.  This is a representation cost, not an
        information-theoretic lower bound for every way of naming or evaluating
        the map.
    Q3:
      result: "3 initial choices, then 2; balanced enumeration Theta(2^(a/2)) up to polynomial factors"
      derivation: >-
        A depth-d nonbacktracking binary-isogeny tree has 3*2^(d-1) paths for
        d>=1.  The two depths floor(a/2) and ceil(a/2) therefore have maximum
        path count Theta(2^(ceil(a/2)))=Theta(sqrt(D)) up to a constant and the
        stated polynomial labelling, transport, isomorphism, join, and
        verification costs.  Path merging can reduce distinct states, whereas
        storing or sorting all enumerated records can retain the path count.
    Q4:
      result: "ideal index D^2 under the standard rank-four reduced-norm convention"
      derivation: >-
        For a proper integral left ideal in a quaternion order, the determinant
        norm of the underlying rank-four lattice is the square of its reduced
        norm, hence [O:I]=nrd(I)^2=D^2.  This conclusion depends on properness,
        integrality, full rank, and that standard normalization; merely calling
        an arbitrary module's size parameter D would not establish the index.
  joints:
    J1:
      canonical_verdict: "breaks"
      assumptions_required_for_conditional_result:
        - "E and C are fixed smooth elliptic curves over the stated field with fixed origins and fixed models/encodings."
        - "f and g are origin-preserving homomorphisms E->C of degree D; equality is as maps into that exact codomain, not modulo target isomorphism, sign, automorphism, frame, or orientation."
        - "P has exact order N, not merely P in E[N], and f(P)=g(P)=X."
        - "N is prime to the characteristic so the N points generated by P are distinct geometric points; D and N are positive and N>4D."
        - "For Route A, X also has exact order N, all sampled images are finite, A/B is reduced with the stated degree bounds, and canonical scaling does not replace coprime reduction."
        - "The y-coordinate normalization is defined: y(P), y(X), and c are nonzero in the chosen models, and the curve identity and anchor are checked after normalization."
      derivation:
        degree_and_singleton: >-
          Put h=f-g in Hom(E,C).  The degree norm on Hom(E,C) obeys the
          triangle inequality for its square root, so sqrt(deg(h)) is at most
          sqrt(deg(f))+sqrt(deg(g))=2sqrt(D), and deg(h)<=4D.  If h is nonzero
          and h(P)=0 with P of exact order N prime to the characteristic, then
          the N distinct points <P> lie in the geometric kernel of h.  Thus
          N<=deg_sep(h)<=deg(h)<=4D, contradicting N>4D.  Hence h=0 and f=g.
          Separability of f and g alone does not supply exact order for P;
          h itself need not be separable, but the inequality using its
          separable kernel still suffices.
        normalization: >-
          The x-rational function determines an isogeny only up to its
          y-coordinate sign/normalization.  In the displayed Route A formula,
          c=R'(x(P))*y(P)/y(X) and y'=y*R'(x)/c force the selected lift to send
          P to X when every denominator is nonzero.  This inversion and the
          final curve, degree, separability, model, and anchor checks are part
          of construction.  An x-only anchor, an isomorphic but uncalibrated
          codomain, or equality modulo a target automorphism does not give the
          singleton above.
        literal_collision: >-
          The bare notation P in E[N] permits P=O_E.  Choose an odd
          characteristic instance with a cyclic separable degree-D isogeny
          f:E->C and put g=-f, P=O_E, and X=O_C.  Then f and g are distinct
          origin-preserving degree-D maps into the same codomain, have the same
          cyclic kernel, and both meet the anchor, even when N>4D.  Their
          difference is 2f of degree 4D.  This is a collision under the literal
          statement and disappears only after imposing exact order N on P.
        threshold_boundary: >-
          With exact order P, N<=4D removes the contradiction but does not by
          itself construct f and g.  A collision then requires an actual
          nonzero h=f-g whose kernel contains <P>, with f and g also satisfying
          the equal-degree and codomain constraints.  Identifiability therefore
          follows above the bound, while construction of a collision at or
          below it is a separate instance-dependent problem.
        quantifier_order: >-
          A uniform claim must read: there exists one finite bit program A and
          one resource bound polynomial q such that for every valid frozen
          encoding and every admitted tuple (O,E,C,P,X,D,N,U,V,k), A receives
          exactly those bits, uses at most q of the declared input/security
          measures, and returns the specified result or a specified failure
          with the declared probability.  It may not read an instance-specific
          map, Hom(E,C), chain, frame, orientation, advice, or uncharged
          preprocessing.  The order 'for every instance there exists a program
          or DS' is nonuniform and does not establish that claim.
        representation_boundary: >-
          A dense reduced pair (A,B) has Theta(D log p) serialized bits in the
          exact representation above.  Eval2 returns only two C-points, hence
          Theta(log p) output bits under fixed encodings (plus a constant-size
          tag), while its message result has k bits.  No dense-output lower
          bound transfers to Eval2 without a reduction that reconstructs the
          dense pair from the evaluator using a charged number of queries and
          that also charges DS construction, DS size, and preprocessing.
      controls:
        - name: "N<=4D or relaxed normalization"
          expected_signature: "Either a concrete pair f!=g meeting all typed conditions, or an explicit statement that the degree argument is only nonidentifying at this boundary."
          actual_signature: "The threshold supplies no contradiction but no collision construction; relaxed/x-only normalization admits sign or target-automorphism ambiguity."
        - name: "unique marked item without efficient access"
          expected_signature: "Uniqueness is separated from a uniform algorithm that finds or evaluates the item."
          actual_signature: "The 4D proof identifies at most one normalized map but supplies no construction, runtime, or evaluator."
        - name: "dense map versus evaluator-only output"
          expected_signature: "dense_out has length Theta(D log p); Eval2_out has length Theta(log p); any transfer names a reconstruction reduction."
          actual_signature: "The dense slot count holds conditionally, but no such reduction is present, so transfer is invalid."
      limitations:
        - "No concrete p, curve models, exact point orders, or admitted-instance predicate is supplied, so no claim of existence or frequency of boundary collisions is made."
        - "No route is declared impossible; the verdict is about what follows from the submitted interface and premises."
      next_falsifier: >-
        Add and verify an admission predicate giving exact order N for P and X,
        fixed codomain/model normalization, reduced dense representation, and a
        fully uniform construction.  Then exhibit either a valid normalized
        collision despite N>4D or a charged reduction from two-point evaluation
        to dense reconstruction if the broader lower bound is retained.
    J2:
      canonical_verdict: "breaks"
      typed_program_required:
        PreEval: >-
          PreEval(O,E,C,P,X,D,N,frozen_encodings) -> DS or
          fail_admission/fail_construction, where DS is computed only from
          those arguments and carries the exact codomain/model normalization.
        Eval2: >-
          Eval2(DS,U:E[D],V:E[D]) -> (A0:C[D],B0:C[D],certificate) or
          fail_evaluation.  The certificate/check must bind both points to the
          same separable degree-D homomorphism E->C satisfying f(P)=X.
        Decode: >-
          Decode(C,D,k,A0:C[D],B0:C[D]) -> m in [0,2^k) or fail_decoder,
          with a=log2(D) checked and no undeclared frame, orientation, advice,
          target action, Hom set, retained chain, or sender map.
        Recover: >-
          Recover(O,E,C,P,X,D,N,U,V,k,frozen_encodings) composes the preceding
          calls and returns m or a failure tagged by admission, construction,
          evaluation, or decoding stage.
      assumptions_required_for_completeness:
        - "D=2^a, k=floor(a/2), the characteristic is prime to D, and all point/curve/model membership and exact orders are checked."
        - "U,V are an ordered basis of E[D], or an equivalent explicit admission condition proves that B0=f(V) has exact order D for every admitted message."
        - "There exists one actual normalized separable degree-D f:E->C with f(P)=X and ker(f)=<U+sV>, where s=m+2^k*r and the kernel generator has exact order D."
        - "PreEval constructs that f uniformly from only allowed_input; Eval2 is total on the admitted U,V and returns evaluations of that same f."
        - "The deterministic 2-power discrete-log digit routine, equality tests, encodings, and all failure behavior are specified."
      message_derivation:
        - "Let A0=f(U) and B0=f(V).  The kernel relation gives A0+[s]B0=0, hence A0=-[s]B0."
        - "Let q=2^(a-k).  Then H=[q]B0 and G=-[q]A0=[s]H."
        - "If ord(B0)=D, then ord(H)=2^k.  Since s=m+2^k*r, [s]H=[m]H."
        - "A checked k-bit discrete log of G to base H therefore returns the actual m, not merely a congruence representative."
        - "The coefficient of U was already normalized to one in the stated kernel relation.  Any implementation that instead starts from alpha*U+beta*V must check alpha is a unit and charge the scalar inversion used to recover the normalized slope; that operation is not licensed as hidden advice."
        - "Route A must perform and charge its field inversions in c and R'/c before Eval2.  Routes B and C must likewise apply and verify all midpoint/codomain isomorphism and automorphism calibrations before their points can be called actual f(U),f(V)."
      literal_completeness_counterexample: >-
        The statement admits V=O_E.  Take a cyclic separable degree-D quotient
        f with kernel <U>, where U has exact order D, and choose any allowed
        s=m+2^k*r.  Then ker(f)=<U+sV> exactly, so this is an honest message
        under the written relation, but B0=f(V)=O_C.  The decoder rejects at
        ord(B0)=D.  Distinct m values can use the same f,U,V and produce the
        same two-point view.  Thus the submitted admission relation does not
        imply decoder completeness or message identifiability.
      failure_partition:
        admission: >-
          Reject malformed encodings, nonsmooth/wrong models, wrong parameter
          forms, nonexact P/X orders, invalid O representation, nonbasis U,V,
          absent/nonunique normalized f, and a kernel relation that does not
          define one admitted message.  The bare statement supplies no such
          complete admission predicate.
        evaluator: >-
          Reject inability to construct DS, denominator or normalization
          failures, uncalibrated codomain maps, off-domain U,V, invalid output
          points, outputs not in C[D], certificate failure, or a mismatch
          between the constructed map, anchor, and both evaluations.
        decoder: >-
          Reject ord(B0)!=D, ord(H)!=2^k, digit-extraction failure, or the final
          equality [t]H!=G.  These tags must remain distinct from admission and
          evaluation failures.
        malformed_or_wrong_key: >-
          Decode alone is not sound authentication: arbitrary points with B0
          of order D and A0=-[t]B0 pass and return t.  A wrong-key or malformed
          tuple may therefore return a value unless Recover first binds the
          points to a certified evaluation of the admitted normalized map.
          The submitted pseudocode specifies neither that binding nor a
          wrong-key guarantee.
      accounting:
        construction: >-
          PreEval time and space are part of the algorithm.  Route A includes
          2D scalar-multiple samples, a 2D-by-(2D+1) structured or dense solve,
          reduction/normalization, curve and degree checks, and DS output.
          Route B includes all enumerated records, torsion transports, joins,
          isomorphisms, compositions, and verification.  Route C supplies no
          costed algorithm for ideal search, right order, realization, or
          calibration.  The evaluator-only pseudocode is a signature, not a
          construction or polynomial bound.
        evaluation: >-
          Exactly two final map calls are made, one on U and one on V, but their
          field/bit cost depends on DS representation and cannot be inferred
          from the call count.  An orbit table for [i]P does not evaluate
          off-orbit D-torsion inputs.
        decoder_group_work: >-
          Computing H and G costs O(a) doublings.  Standard checked successive
          extraction of k binary digits costs O(k^2) group operations, so the
          claimed O(k^2+a) group-work scale is conditionally consistent.  Its
          bit time is that count times the cost of arithmetic/equality in
          F_(p^2); it is not O(k^2+a) bit operations.
        memory_and_output: >-
          Streaming digit extraction can use O(1) group elements plus k output
          bits, while DS and construction memory remain route-dependent.  The
          two C-points occupy Theta(log p) bits under fixed encodings and m
          occupies k bits.  Dense DS occupies Theta(D log p) bits only if that
          exact representation is selected.
        coefficient_growth: >-
          Group coordinates remain in the fixed field, but dense polynomial
          composition, resultants, model isomorphisms, ideals, certificates,
          and integer/lattice intermediates need explicit size and reduction
          bounds.  None are supplied.
        randomness_and_failure: >-
          The displayed decoder is deterministic once points are valid.  Any
          randomized interpolation, factoring, ideal, isomorphism, or join
          subroutine must expose its coins, repetition, failure probability,
          and verification cost.  Tagged evaluator failure alone gives no
          success probability or completeness guarantee.
      controls:
        - name: "one cyclic orbit versus off-orbit U,V"
          expected_signature: "Eval2(DS,U,V) is defined for arbitrary admitted E[D] points and returns C[D] points."
          actual_signature: "Samples on the N-torsion orbit of P do not themselves type or implement evaluation on U,V; a full reconstructed map or another charged evaluator is needed."
        - name: "supplied evaluator or retained chain"
          expected_signature: "Such data is rejected as excluded input unless uniformly reconstructed and charged inside PreEval."
          actual_signature: "If supplied it makes Eval2 easy, but changes the interface and reverses the required quantifiers."
        - name: "constant or public two-message view"
          expected_signature: "For admitted m0!=m1, the checked view/relations must not force Decode(view)=m0 and Decode(view)=m1 simultaneously."
          actual_signature: "With V=O_E, the same (f(U),f(V)) and public tuple satisfy the written relation for multiple s and messages, so the view is constant while required outputs differ."
        - name: "honest basis instance"
          expected_signature: "A0=-[s]B0, ord(B0)=D, ord(H)=2^k, G=[m]H, and the final check succeeds."
          actual_signature: "This symbolic chain holds after adding the basis/order and actual-evaluator assumptions; it is not implied by U,V in E[D] alone."
      limitations:
        - "No execution was performed and no route is declared impossible."
        - "The sources give no concrete encodings, algorithms for field/group primitives, security parameter, resource polynomial, or success probabilities, so only symbolic cost scales are assessed."
      next_falsifier: >-
        Supply a complete admitted-instance predicate including an ordered
        E[D] basis (or prove ord(f(V))=D from weaker checks), a uniform PreEval
        implementation over exactly allowed_input with full bit-time/space and
        failure accounting, and a certified Eval2-to-Decode binding.  Then an
        admitted honest tuple for which the checked derivation does not return
        m would falsify the repaired J2 claim.
  run_accounting:
    scientific_runs: 0
    implementation_runs: 0
    formalizer_runs: 0
    experiment_runs: 0
