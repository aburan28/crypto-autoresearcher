review:
  id: TASK-20261006-7f90d3
  role: red-team
  producer_task: TASK-20261006-fa5bac
  scope: [J3, J4, J5]
  whole_claim_vote: not_cast
  status_transition: not_authorized
  run_count: 0
  canonical_scoped_verdicts:
    J3: PASS
    J4: FAIL
    J5: PASS
  headline: >-
    J3 is a sound finite dense reconstruction once every cost statement is
    kept representation-scoped, and J5 correctly stops at an uninstantiated
    exact-calibration interface. J4's counts are credible, but its submitted
    backward point update applies a dual isogeny to a point outside its
    domain, so the claimed sound/complete join is not an executable algorithm
    as written.

J3:
  canonical_scoped_verdict: PASS
  object_reviewed: orbit rational/Padé reconstruction and evaluator-only challenge
  equation_reconstruction:
    sample_range: "1 <= i <= 2D"
    samples: "u_i=x([i]P), v_i=x([i]X)"
    distinctness: >-
      If u_i=u_j then i is congruent to plus or minus j modulo N. For
      1<=i<j<=2D, both 0<j-i<N and 0<i+j<=4D<N, so neither congruence holds.
    unknown_slots: "(D+1) coefficients of A plus D coefficients of B = 2D+1"
    equations: "2D homogeneous equations A(u_i)-v_i B(u_i)=0"
    degree_bounds: "deg(A)<=D and deg(B)<=D-1"
    uniqueness: >-
      For two admissible pairs, A1*B2-A2*B1 has degree at most 2D-1 and
      vanishes at 2D distinct u_i. Exact degree D of the honest separable map
      forces a reduced full-bound pair, so remaining kernel freedom is only
      projective scaling.
    signed_y_action: >-
      From f(x,y)=(R(x),y*S(x)) and pullback of the invariant differential,
      S=R'/c. Since P and X have odd order greater than one, y(P),y(X) are
      nonzero, and c=R'(x(P))*y(P)/y(X) binds the sign.
  degeneracy_audit:
    covered:
      - duplicate orbit abscissae
      - non-one-dimensional Padé kernel
      - a denominator root at a sample
      - non-coprime A and B
      - zero differential scalar or inseparability
      - failed cleared curve identity
      - wrong degree, codomain, model tag, or f(P) != X
    limitation: >-
      The certificate formats and their parsers are not instantiated; this is
      consistent with O6 remaining open and does not invalidate the symbolic
      finite construction on admitted honest inputs.
  exact_cost_audit:
    orbit_generation: "Theta(D) sequential point additions can emit all 2D samples"
    solve: >-
      Structured rational interpolation is soft-linear in numeric D under
      suitable field-arithmetic algorithms; a dense fallback is polynomial in
      D. Both are exponential in encoded a because D=2^a.
    dense_output: >-
      A and B occupy 2D+1 field slots before one projective normalization;
      the scalar c restores one field element. Thus an explicitly returned
      dense map has Theta(D log p) bits.
    memory: >-
      Theta(D log p) storage is valid for the submitted reusable dense or
      structured representation, but it is not an unconditional workspace
      lower bound because coefficients may be streamed and a different compact
      circuit can exist.
    evaluation: >-
      Direct evaluation of the submitted dense representation has numeric-D
      dependence. This does not prove an Omega(D) lower bound for every
      evaluator representation.
  succinct_evaluator_countermodel: >-
    A supplied length-a degree-two chain is a polynomial-size evaluator for
    the same degree-D map. It is excluded as an input here and Route B does not
    construct it efficiently, but its existence refutes any inference from
    dense coefficient count to a universal evaluator-size or evaluator-time
    lower bound.
  scoped_correction_required: >-
    Read interpolation-route.yaml's phrase "or equivalent reusable structured
    data" and the report's workspace language only as describing the proposed
    Padé representation. No proof covers all equivalent evaluator data
    structures. The transposed-evaluator artifact and the main conclusion do
    preserve this boundary, so this wording issue does not change the PASS.
  controls:
    dense_map_vs_evaluator_only: passed
    signed_X_vs_x_only: passed
    supplied_connection: >-
      If an evaluated connection is supplied, the same decoder becomes public;
      this is correctly excluded and not evidence of recipient asymmetry.
    public_decoder: passed
    malformed_certificate: symbolic checks named; serializer-level guarantee absent
  assumptions:
    - admitted exact labelled models over an odd-characteristic field
    - exact ord(P)=ord(X)=N and strict N>4D
    - an honest separable degree-D homomorphism exists
    - the short-Weierstrass rational-map and exact field arithmetic interfaces are valid
  limitations:
    - no sublinear evaluator theorem is established
    - no universal lower bound is established
    - no public-versus-recipient polynomial-time separation is established
  next_falsifier: >-
    Give a uniform PreEval/Eval2 using only the declared inputs, polynomial in
    (B,a,log p), or exhibit an admitted honest instance on which the reduced
    Padé system plus signed differential recovery does not return the unique f.

J4:
  canonical_scoped_verdict: FAIL
  object_reviewed: forward/backward nonbacktracking degree-two chain lifting
  branch_and_resource_audit:
    depth_d_paths: "1 at d=0; 3*2^(d-1) at every positive depth d"
    balanced_split: "t=floor(a/2), a-t=ceil(a/2)"
    balanced_scale: >-
      The two tables contain 3*2^(t-1) and 3*2^(a-t-1) path states at positive
      depths, with the evident depth-zero exception. Their sum is
      Theta(2^(a/2)) up to polynomial field, evaluator, and certificate factors.
    memory: >-
      Storing a balanced table, transported point, boundary-edge label, model
      transport, and composed evaluator is Theta(2^(a/2))*poly(a,log p) bits.
    cycles_and_mergers: >-
      Cycles do not alter the pre-deduplication path count. A normalized curve
      collision alone cannot be deduplicated. Deduplication is safe only after
      transported signed point, model isomorphism, forbidden boundary edge,
      and evaluator/path identity are retained or equality is proved.
  blocking_type_error:
    submitted_call: "[2^(-1) mod N] * dual(psi)(X)"
    orientation: "the enumerated outgoing edge from the current backward curve is psi:C_j->C_(j+1)"
    first_ill_typed_operation: "dual(psi)(X_j)"
    reason: "dual(psi) has domain C_(j+1), while X_j lies on C_j"
    corrected_update: "X_(j+1)=[2^(-1) mod N] psi(X_j)"
    check: "dual(psi)(X_(j+1))=[2^(-1)]dual(psi)psi(X_j)=X_j"
    alternative_orientation_consequence: >-
      If psi is instead declared C_(j+1)->C_j so dual(psi)(X_j) is typed, psi
      cannot be enumerated by choosing a kernel from the current curve C_j;
      the edge-enumeration statement must then be rewritten around dual(psi).
    exact_consequence: >-
      Backward states are undefined as submitted, hence the midpoint equality,
      soundness/completeness statement, and executable meet-in-the-middle
      program do not follow as written. Correct branch counts do not repair a
      point living on the wrong curve.
  meet_predicate_audit:
    required: >-
      An explicit midpoint isomorphism must transport the forward P-image to
      the correctly constructed backward preimage; the two boundary edges must
      not be dual; all curve and point labels must agree; the composed map must
      then pass exact endpoint, degree, cyclic-kernel, and f(P)=X checks.
    endpoint_only_control: >-
      A curve collision or a completed endpoint check is not a prefix-local
      pruning predicate. The producer correctly refuses to credit either one.
    local_predicate_status: >-
      Only parser, curve, kernel, order, model-isomorphism, and immediate
      nonbacktracking checks are available before a compatible suffix. No
      additional prefix-available sound-and-complete pruning theorem is given.
    small_cycle_control: >-
      Retaining the path/evaluator and forbidden edge avoids treating merged
      vertices as merged maps. Instance-specific reductions do not prove a
      uniform polynomial bound.
  controls:
    known_chain_supplied: >-
      A supplied chain makes evaluation polynomial but changes the input and is
      correctly excluded.
    endpoint_full_path_as_local: rejected
    curve_only_collision: rejected
    meet_in_the_middle_memory_charged: passed
    public_decoder: passed after an actual evaluator exists
  assumptions:
    - every honest cyclic degree-2^a map admits a nonbacktracking degree-two factorization
    - all three rational 2-isogeny choices and their exact model transports are enumerable
    - N is odd, so 2 has an inverse modulo N
  limitations:
    - the submitted backward recurrence is ill-typed
    - no extra sound-and-complete local pruning predicate is supplied
    - no merger theorem yields a uniform polynomial state count
  next_falsifier: >-
    Rewrite the edge orientation and backward point recurrence, then prove by
    induction that every suffix state is on the stated curve and maps to X;
    prove the boundary nonbacktracking condition and re-establish join
    soundness/completeness with the corrected state type.

J5:
  canonical_scoped_verdict: PASS
  object_reviewed: primitive cyclic norm-D ideal selection, exact realization, and map-to-message use
  exact_object_required:
    ideal: "proper primitive left O-ideal I, nrd(I)=D, [O:I]=D^2"
    local_type: "cyclic 2^a kernel, not merely the same class or a smooth auxiliary norm"
    target: "right order effectively and geometrically identified with End(C)"
    map: "certified evaluated f_I:E->C on the exact public model, with f_I(P)=X"
  charged_pipeline:
    - candidate selection or exhaustive local enumeration
    - integrality, left stability, HNF/SNF index, exact norm, primitivity, and cyclicity
    - saturation, denominator removal, exact division, and coefficient growth
    - KLPT or equivalent-ideal attempts, auxiliary norms, success probability, and amplification
    - right-order computation and certificates
    - effective Deuring ideal-to-kernel and kernel-to-map realization
    - all exact-C isomorphisms and residual target automorphisms
    - signed P-to-X calibration and global normalization
    - evaluation on U and V plus certificate, memory, output, and failure costs
  attack_result: >-
    The producer does not confuse an ideal, ideal class, right order, equivalent
    codomain, or smooth-norm representative with the required exact output.
    CALIBRATED_IDEAL_REALIZE remains explicitly uninstantiated, so Route C is
    not credited as a construction or finalist.
  first_unavailable_operation_without_hidden_data:
    operation: "CALIBRATED_IDEAL_REALIZE(O,E,C,P,X,D,I)"
    status: named_but_unimplemented
    consequence: >-
      No evaluated point f(U) or f(V), certificate, message, polynomial bound,
      or success probability follows from a candidate ideal or right order.
  equivalence_and_calibration_controls:
    equivalent_ideal: rejected unless exact norm, cyclic type, C, and X are re-established
    equivalent_codomain: rejected until an explicit isomorphism to exact C is applied
    target_automorphism: enumerate and retain only a signed f(P)=X match
    orientation_or_frame: forbidden as hidden input
    evaluator_certificate: required before the decoder
  map_to_message_audit:
    relation: "f(U)=-[s]f(V), s=m+2^k r"
    steps: "H=[2^(a-k)]f(V), G=-[2^(a-k)]f(U)=[m]H"
    checks: "ord(f(V))=D, ord(H)=2^k, digit-shape checks, and final [m]H=G"
    cost: "two full map evaluations plus certificates and O(k^2+a) group work"
    result: conditional_actual_message_not_proxy
  controls:
    ideal_only: rejected
    right_order_only: rejected
    supplied_connection: changes the interface and makes decoding public
    malformed_certificate: failures named, exact serializers still open under O6
    public_decoder: acknowledged
  assumptions:
    - exact source order O is validly represented and evaluable
    - a matching primitive cyclic norm-D ideal exists for the honest map
    - exact arithmetic and certificate verifiers are eventually instantiated
  limitations:
    - no selector or calibrated realizer is provided
    - no polynomial cost or nonzero uniform success theorem is provided
    - source literature supports only pointer-level boundaries in this snapshot
  next_falsifier: >-
    Instantiate CALIBRATED_IDEAL_REALIZE without a Hom anchor, connection,
    target action/frame, orientation, sender map, advice, or exponential table,
    and prove exact D/C/X/evaluation correctness plus polynomial bit bounds.

