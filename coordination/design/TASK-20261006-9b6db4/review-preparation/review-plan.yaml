review_plan:
  id: "REVIEW-SSI-EVALUATOR-20261006-9b6db4"
  goal_id: "GOAL-SSI-2fa82a"
  question_id: "RQ-SSI-1946c9"
  batch_id: "BATCH-bad7f5"
  preparation_task: "TASK-20261006-9b6db4"
  preparation_archive: "TASK-20261006-42c246"
  producer_task: "TASK-20261006-fa5bac"
  producer_snapshot: "TASK-20261006-268d1f"
  reviewer_tasks: ["TASK-20261006-a9050f", "TASK-20261006-7f90d3"]
  composer_task: "TASK-20261006-7c9a40"
  ledger_archive: "TASK-20261006-62a17f"
  final_decision_reserved: "DEC-20261006-105910"
  written_before_producer_dispatch: true
  claim_binding_status: "prospective_snapshot_bound"
  claim_under_review: >-
    One bounded attempt to construct a uniform bit-polynomial algorithm that,
    from exactly O=End(E), E,C,P,X,D,N with D=2^a and N>4D, returns f(U),f(V)
    for the unique normalized degree-D map f:E->C satisfying f(P)=X, or an
    exactly equivalent evaluated object, and then reaches the actual message.
    Mandatory routes are dense/orbit interpolation, recursive 2-isogeny-chain
    lifting, and exact calibrated ideal realization, with an explicit
    evaluator-only challenge. At most one finalist; zero scientific runs.
  coordinator_prior: >-
    Frozen before production: uniqueness under N>4D is plausible and the
    retained f(U),f(V)-to-message decoder is conditional progress, but neither
    computes f. Standard dense interpolation appears to require O(D)-scale
    representation/work; blind chain lifting appears to branch exponentially
    absent a local predicate; an ideal class appears insufficient without an
    exact evaluated calibrated realization. None of those observations rules
    out a transposed evaluator returning only two points. The expected outcome
    is a sharply localized missing theorem rather than a finalist, but a full
    uniform evaluator would overturn this prior.
  scientific_verdicts_inherited: false
  messages_used_as_scientific_input: false
  joints:
    - id: "J1"
      joint: "Uniqueness, quantifier order, observable collisions, and representation-scoped lower-bound logic."
      assigned_to: "TASK-20261006-a9050f"
      attack_plan: >-
        From the bare statement rederive the N>4D singleton argument with all
        normalization/degree hypotheses. Search relaxed N<=4D, automorphism,
        wrong-degree, and equivalent-codomain collisions. Write the forall/exists
        order and test whether any advice/witness depends on hidden f. Reject
        any dense-output argument that silently extends to two-point output.
      breaking_artifact: "A collision in the claimed exact fiber, hidden per-instance witness/advice, or a lower-bound inference whose premises do not cover evaluator-only output."
    - id: "J2"
      joint: "Typed transposed/sublinear evaluator and returned-object-to-actual-message path."
      assigned_to: "TASK-20261006-a9050f"
      attack_plan: >-
        Type every operation of the proposed evaluator using only declared
        inputs. Independently derive its runtime, memory, output, preprocessing,
        failure, and evaluations on U,V. Follow the exact returned values
        through the charged slope/normalization decoder to m; expose an analogy,
        oracle, dense preprocessing, or off-orbit extrapolation.
      breaking_artifact: "No executable two-point evaluator, hidden target/Hom input, superpolynomial cost, or failure to return actual m."
    - id: "J3"
      joint: "Orbit rational/Padé interpolation, dense output/data bounds, and compression escape hatch."
      assigned_to: "TASK-20261006-7f90d3"
      attack_plan: >-
        Expand the exact rational representation, degrees, scalar-orbit samples,
        equations, field costs, and degeneracies. Verify any Omega(D) statement
        only for the declared dense representation. Attempt fast multipoint,
        rational reconstruction, modular composition, and succinct-circuit
        countermodels; demand a reduction before transferring the bound.
      breaking_artifact: "Uncharged O(D) data/output/work, insufficient independent equations, or an overbroad lower bound contradicted by evaluator-only/succinct output."
    - id: "J4"
      joint: "Recursive forward/backward 2-isogeny lifting, branch collisions, and local pruning."
      assigned_to: "TASK-20261006-7f90d3"
      attack_plan: >-
        Count initial and non-backtracking choices, explicitly handle graph
        cycles/mergers and endpoint collisions, and price meet-in-the-middle
        tables. At each prefix ask what data is actually known and whether
        P->X induces a sound and complete local predicate. Test paths already
        supplied, repeated-edge/backtracking, small-cycle, and endpoint-only
        controls.
      breaking_artifact: "An exponential search hidden as recursion, a false local predicate, collision-blind branch count, or an unsupported universal lower bound."
    - id: "J5"
      joint: "Quaternion/ideal selection, exact calibration/evaluation, PKE-obligation boundary, sources, and claim hygiene."
      assigned_to: "TASK-20261006-7f90d3"
      attack_plan: >-
        Expand norm/index/cyclicity, saturation, KLPT, right-order/codomain,
        isomorphism/automorphism calibration, and evaluation costs. Remove any
        Hom anchor, connection, target action/frame, orientation, advice, and
        uncharged preprocessing. Verify source locators independently; check
        O1-O6 statuses, reverse reduction direction, active hypotheses, visual
        labels, and nonduplication against BATCH-066c3b.
      breaking_artifact: "Only an equivalent class/codomain, hidden connecting data, uncharged realization, incorrect security arrow, unchecked source, or widened novelty/impossibility/PKE claim."
  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Fresh fork-none reviewers receive their own standalone handoff and an
      immutable snapshot only. The blind validator reads exactly its handoff
      and producer-authored blind-statement.yaml. The red team reads the
      producer snapshot and its own handoff but not the plan, sibling report,
      prior review messages, composition, or conversation context.
  proves_too_much:
    objects:
      - object: "Dense degree-D rational-map representation versus an oracle/circuit that returns only two target points."
        known_false: "An Omega(D) dense output-size bound by itself rules out every evaluator-only algorithm."
        expected_signature: "Bound retained only for dense output unless an explicit evaluator-to-dense-map reduction is proved."
        assigned_to: "TASK-20261006-a9050f"
      - object: "Unique normalized degree-D map versus a unique marked item in an unsorted exponential family."
        known_false: "Uniqueness alone supplies a polynomial construction."
        expected_signature: "Identifiability and algorithmic access remain separate obligations."
        assigned_to: "TASK-20261006-a9050f"
      - object: "N<=4D, post-composed target automorphisms, relaxed degree, or equivalent codomain."
        known_false: "The exact N>4D normalized singleton proof survives every relaxation."
        expected_signature: "Collision or explicit proof-premise failure appears without contaminating the honest exact case."
        assigned_to: "TASK-20261006-a9050f"
      - object: "A chain supplied as input."
        known_false: "Fast evaluation of a known O(lambda)-edge chain proves fast discovery of the hidden chain."
        expected_signature: "Construction/search cost remains separately charged."
        assigned_to: "TASK-20261006-7f90d3"
      - object: "Endpoint-only or one-column-full-path check used as a prefix predicate."
        known_false: "A property checkable only after full composition prunes each local branch."
        expected_signature: "Predicate timing, soundness, completeness, and cost are explicit; absent predicate leaves branching unpruned."
        assigned_to: "TASK-20261006-7f90d3"
      - object: "Ideal class, right order, equivalent codomain, or abstract Hom module without a calibrated evaluated member."
        known_false: "Class-level data automatically returns exact f(U),f(V) on public C."
        expected_signature: "Realization/isomorphism/automorphism calibration and evaluation remain visible."
        assigned_to: "TASK-20261006-7f90d3"
      - object: "Supplied connecting isogeny, target frame/action, Hom anchor, or per-instance advice."
        known_false: "An algorithm with forbidden auxiliary data is source-End(E)-only."
        expected_signature: "Extra input is removed or the route is marked conditional/incomplete."
        assigned_to: "TASK-20261006-7f90d3"
      - object: "Solver-to-decrypt attack path."
        known_false: "An attack upper bound is an IND-CPA reduction from an adversary to EndRing."
        expected_signature: "Reduction direction and exact public distribution remain open unless separately proved."
        assigned_to: "TASK-20261006-7f90d3"
    assigned_to: "TASK-20261006-7f90d3"
    failure_signature: "Owned reports state expected and actual symbolic signatures; controls yield route-scoped verdicts only, never universal impossibility."
  blind_rederivation:
    required: true
    quantity: >-
      Q1: the normalized degree-D uniqueness/collision boundary from N>4D.
      Q2: dense-map coefficient/data scale versus evaluator-only output size.
      Q3: non-backtracking branch and meet-in-the-middle scale with collision caveats.
      Q4: exact typing and cost of any f(U),f(V)-to-m evaluator path.
    parameters: "E,C,D=2^a,N>4D,P,X,U,V,k; standard degree inequalities; bare route pseudocode and representations; no producer derivations or verdicts."
    blind_from:
