  ranking:
    exact_uncertainty: >-
      Given represented/evaluable O=End(E), curves E,C, public torsion points
      P in E[N], X in C[N], degree D=2^a, and N>4D, can one fixed uniform
      algorithm compute f(U),f(V) for the unique normalized degree-D isogeny
      f:E->C satisfying f(P)=X in poly(lambda,log p) bit time and memory, where
      lambda=log_2 D, without supplied Hom(E,C), connecting isogeny, target
      action/frame, orientation, per-instance advice, or exponential
      preprocessing? If it returns another object, can that object be evaluated
      and carried through the retained charged decoder to the actual message?
    admitted_mechanisms: 1
    mandatory_formulations: 3
    maximum_finalists: 1
    formulation_A: >-
      Orbit rational/Padé interpolation from the homomorphism samples
      [k]P -> [k]X. State exactly which affine/projective coordinates and
      rational functions are reconstructed. A dense degree-D map has
      O(D)-scale representation/data/work unless a precise compression or
      transposed evaluation theorem is proved. Do not apply a dense-output
      lower bound to a two-point evaluator without a reduction.
    formulation_B: >-
      Recursive forward/backward 2-isogeny-chain lifting. Count root choices,
      non-backtracking branches, graph mergers/cycles, endpoint collisions,
      meet-in-the-middle time/memory, and every predicate that can be checked
      before a full chain is known. The one-column condition may prune only
      through an explicitly typed local test. No unconditional exponential
      lower bound is authorized.
    formulation_C: >-
      Quaternion/ideal selector and realizer. Construct a primitive cyclic
      norm-D represented ideal, realize its exact map to C, fix any target
      isomorphism/automorphism so P maps to X, and evaluate on U,V. An ideal
      class, right order, equivalent codomain, Hom module, or norm solution
      without this calibration does not satisfy the interface.
    transposed_challenge: >-
      Search explicitly for an evaluator-only algorithm that returns just
      f(U),f(V), possibly through transposition, modular composition, linear
      functionals, division-polynomial recurrences, or a succinct isogeny
      circuit. Its O(log p)-bit output evades dense-map output size. Require a
      complete algorithm and bit-cost proof; a name or analogy is not a route.
    baseline_controls:
      - "A standard dense rational map of degree D requires Theta(D) field coefficients up to representation conventions; scope the output-size statement to that representation."
      - "A known non-backtracking 2-isogeny chain has O(lambda) edges, but finding an unknown chain is a different task; branch counts must account for collisions and endpoint constraints."
      - "The N>4D degree argument may establish uniqueness among normalized degree-D maps, but uniqueness does not imply efficient reconstruction."
      - "The actual public column [k]P->[k]X is group-linearity data on one cyclic subgroup; show the theorem that extends it to U,V rather than assuming an off-orbit evaluator."
  proof_search_map_contract:
    bottleneck: "Uniform bit-polynomial reconstruction or evaluator-only computation of the exact calibrated f on U,V."
    baseline_embedding:
      parameter_slice: "D=2^a, lambda=a, N=5^b least N>4D, normalized degree-D separable cyclic map, exact E,C,P,X."
      reproduction_check: "Re-derive deg(f-g)<=4D and the N>4D singleton consequence with every hypothesis visible; reproduce dense interpolation and non-backtracking branch accounting only in their stated models."
    observation_collision:
      observable: "(E,C,D,N,P,X) and the transcript [k]P->[k]X; separately the proposed route certificate/evaluator output."
      distinct_preimage_search: >-
        Search exact-degree normalized maps and nearby relaxed objects for the
        same observable but different f(U) or f(V). If N>4D excludes exact
        collisions, retain N<=4D, non-normalized/automorphism, wrong-degree,
        equivalent-codomain, and abstract-ideal controls to test whether a
        proposed argument is using the exclusion correctly.
    constructive_transforms:
      - transform: "representation_reduction"
        proposed_object: "A succinct evaluator/circuit or linear functional for f(U),f(V) that never emits dense rational-map coefficients."
        predicted_gain: "Replace O(D)-scale dense construction by poly(lambda,log p) work if, and only if, a complete transfer theorem is supplied."
      - transform: "observable_fiber"
        proposed_object: "Hold the one-column public observation fixed while varying relaxed degree/normalization/codomain data."
        predicted_gain: "Localize which extra condition makes evaluation identifiable without claiming a lower bound."
      - transform: "baseline_boundary_lift"
        proposed_object: "A locally checkable chain predicate or calibrated ideal certificate that prunes before full path realization."
        predicted_gain: "Turn exhaustive branch search into a bounded constructive algorithm if predicate soundness/completeness and cost are proved."
    quantifier_order: >-
      Exists one fixed uniform program A and polynomial q such that for every
      lambda, every admitted honest instance produced by the frozen Setup law,
      every valid U,V and message/randomness, A on exactly the declared input
      returns the required evaluated points/actual message within q(total input
      bits) except with a declared uniform failure probability. No witness,
      advice, preprocessing table, or algorithm choice may depend on the
      individual hidden f unless generated from the declared input and charged.
    method_ceiling:
      strongest_certifiable_claim: "A complete program establishes this exact evaluator interface and cost; a scoped route analysis can only classify that route's missing step or representation cost."
      nearby_object_control: "N<=4D or relaxed normalization/codomain where two maps/certificates can share the public column; plus evaluator-only output where dense-output size is known not to apply."
    proof_obligations:
      - {claim: "Normalized degree-D uniqueness from N>4D", responsibility: "correctness"}
      - {claim: "Dense interpolation data/output/work bound in the exact representation", responsibility: "size"}
      - {claim: "Chain enumeration/pruning and collision-aware cost", responsibility: "runtime"}
      - {claim: "Ideal selector returns the exact calibrated evaluated map", responsibility: "interface"}
      - {claim: "Two-point evaluator has uniform bit-polynomial runtime/memory/failure", responsibility: "runtime"}
      - {claim: "Returned values feed the retained decoder to actual m", responsibility: "correctness"}
      - {claim: "No hidden Hom/connection/target frame/action/advice", responsibility: "scope"}
