claim_assessed: >-
  O1/O2 and the exact public forward map, endpoint law, encodings, and
  honest-party algorithms are complete and efficient.

verdict:
  result: REJECT
  exact_scope: >-
    The J1 completeness-and-efficiency claim is false for the frozen CEFC-PKE
    packet. The packet is a well-labeled conditional interface, but it does not
    instantiate an exact public-key distribution, a concrete public walk law,
    a nontrivial EdgeLabel, TrapCurveGen_ER, CompleteEvalBasis, or
    RingPotential. Consequently neither KeyGen nor Enc nor Dec can be executed
    from the declared inputs, and no polynomial-time or negligible-failure
    statement follows.
  obligation_dispositions:
    O1: open
    O2: contradicted_for_the_submitted_complete_and_efficient_claim
  public_forward_map: abstractly_typed_but_not_concretely_executable
  endpoint_law: undefined
  encoding_status: requirements_only_not_a_complete_serialization
  honest_sender_status: not_executable
  honest_recipient_status: not_executable_with_only_declared_W_E
  efficiency_status: not_established
  failure_tail_status: unbounded_and_not_established_negligible
  scope_limit: >-
    This rejects only J1 for CEFC-PKE as frozen. It proves neither that a
    suitable sampler/label/evaluator cannot exist nor that every EndRing-based
    PKE is impossible. J2 and J3 are not adjudicated here.

earliest_exact_failures:
  - id: J1-F1
    obligation: O1
    kind: missing_exact_distribution
    statement: >-
      TrapCurveGen_ER and its public marginal D_ER are not supplied. The
      phrase "exact declared EndRing-challenge public marginal" is therefore
      circular: there is no sampler, probability mass function, auxiliary-data
      law, retry rule, or distribution-matching theorem against which a real
      key or endpoint can be checked.
    consequence: >-
      The hard-problem instance distribution, real KeyGen distribution, and
      derived endpoint distribution are undefined.
  - id: J1-F2
    obligation: O2
    kind: missing_sender_subroutine
    statement: >-
      EdgeLabel is declared `supplied: false`; WalkSample is only an abstract
      sampler with unselected edge degrees, normalization, probabilities,
      rejection, and failure behavior. Enc cannot compute its required x from
      pk, m, and rho under the frozen packet.
    consequence: honest_sender_cannot_be_executed_without_an_oracle_or_hidden_instantiation
  - id: J1-F3
    obligation: O2
    kind: missing_recipient_lift
    statement: >-
      RingPotential is declared `supplied: false`. No algorithm maps the
      supplied complete evaluable basis W_E and endpoint C to x, and the packet
      supplies no path, orientation, ideal, cache, or other declared bridge
      from End(E) to C.
    consequence: >-
      Dec cannot be executed with only the declared W_E. Treating
      RingPotential as an oracle would be hidden setup, not an honest-party
      algorithm.
  - id: J1-F4
    obligation: O2
    kind: missing_key_and_basis_algorithms
    statement: >-
      TrapCurveGen_ER and CompleteEvalBasis are both absent, including the
      saturated-basis representation, conversion algorithms, coefficient-size
      bounds, verification procedure, and generator retry tail.
    consequence: KeyGen_is_not_an_algorithm_and_secret_key_size_and_cost_are_undefined
  - id: J1-F5
    obligation: O1/O2
    kind: inconsistent_or_implicit_signatures
    statement: >-
      The relation types TrapCurveGen_ER on (1^lambda,pp) and WalkSample on
      (pp,E;rho), while the candidate pseudocode calls TrapCurveGen_ER(pp) and
      WalkSample(E;rho). The O3 contract also writes RingPotential(pp,W_E,C),
      whereas the typed interface and Dec use RingPotential(pp,E,W_E,C).
      These may be repairable implicit-parameter conventions, but the frozen
      exact interface does not declare such a convention.
    consequence: exact_algorithm_typing_does_not_pass
  - id: J1-F6
    obligation: O1/O2
    kind: incomplete_encoding_and_domain_definition
    statement: >-
      Canonical encodings are required but not constructed for pp, curves,
      normalized isogenies, A_lambda, complete bases, or lengths. The accepted
      curve predicate, edge predicate, normalization across isomorphic
      codomains, group operations, self-delimiting concatenation, and concrete
      representation of len(m) are unspecified.
    consequence: >-
      Byte equality and the H_pad input are not fully defined, and the endpoint
      of a purported encoded walk cannot be checked by a concrete parser.
  - id: J1-F7
    obligation: O2
    kind: unproved_efficiency_and_failure_law
    statement: >-
      p(lambda), L(lambda), degrees, kappa(lambda), basis bit lengths, and key
      generation costs are unselected or unbounded. KeyGen has an unbounded
      resampling tail, and epsilon_key, epsilon_walk, epsilon_parse, and
      epsilon_potential are all open.
    consequence: >-
      Neither worst-case nor expected polynomial time and neither negligible
      correctness failure nor even termination with a quantified probability
      has been established.

worked_attacks:
  - id: J1-A1-public-forward-execution
    target: public_forward_map_and_endpoint_law
    inputs_attempted: "(pp,E;rho), exactly as the sender is supposed to receive them"
    trace:
      - >-
        WalkSample cannot be run because its edge-degree family, transition
        probabilities, canonical neighbor selection, rejection conditions,
        retry cap, and fail probability are absent.
      - >-
        If an already valid encoded walk w is supplied as extra advice,
        Endpoint can be described as successive public edge evaluation, but
        the edge parser, normalization, and evaluation bounds remain absent.
      - >-
        EdgeLabel then halts the trace because it has no construction.
    endpoint_law_rederived: >-
      The intended law would be
      Pr[C=c | E]=sum_{w in W_L(E):F_E(w)=c} Pr[WalkSample(pp,E)=w],
      with explicit conditioning if retries occur. Neither the support nor the
      summand probabilities nor retry conditioning is defined, so this is only
      a symbolic formula and not an exact law.
    result: failed_at_missing_sampler_and_label
  - id: J1-A2-sender-with-no-ring-advice
    target: Enc
    inputs_attempted: "canonical pk=enc(E), allowed m, and coins rho; no W_E or hidden orientation"
    trace:
      - public-key acceptance cannot be evaluated because the predicate is absent
      - WalkSample has no executable instantiation
      - I_E requires the absent EdgeLabel
      - H_pad can be called only after an x and unambiguous serialization exist
    result: Enc_not_executable
    hidden_setup_rejected:
      - a precomputed path table
      - a secret orientation used by EdgeLabel
      - a per-key potential oracle
  - id: J1-A3-recipient-with-only-W_E
    target: Dec
    inputs_attempted: "sk=(enc(E),W_E) and c=(enc(C),v), with no sender walk"
    trace:
      - endpoint-domain validation has no concrete predicate
      - RingPotential has no algorithm, runtime, output law, or failure bound
      - >-
        A saturated rank-four basis plus abstract representation conversions
        does not itself specify a map from an unrelated endpoint encoding C to
        the sender's accumulated label
      - without x, the recipient cannot reproduce the H_pad query
    result: Dec_not_executable_from_the_declared_secret_key
  - id: J1-A4-key-generation
    target: KeyGen
    inputs_attempted: "1^lambda and pp"
    trace:
      - Setup has no parameter-generation algorithm or accepted-parameter parser
      - TrapCurveGen_ER is absent
      - CompleteEvalBasis is absent
      - resampling is specified with no bound
    result: KeyGen_not_executable_and_no_real_key_distribution_exists
  - id: J1-A5-byte-level-serialization
    target: canonical_encodings_and_H_pad_domain
    method: >-
      Attempt to parse the concatenation of a domain tag, pp, E, C, x, and a
      length using only frozen definitions.
    result: >-
      No concrete byte encodings or length-prefix/self-delimiting rule are
      supplied. "Canonical" excludes multiple representations only after an
      encoding is defined; it does not by itself make concatenation uniquely
      decodable.
  - id: J1-A6-runtime-bound
    target: polynomial_time_claim
    method: >-
      Charge parameter generation, isogeny-edge evaluation, L label calls,
      complete-basis generation/verification/conversion, RingPotential, memory,
      and every retry against lambda.
    result: >-
      The charge cannot be completed because the controlling sizes, algorithms,
      and tails are absent. The conditional O(L) label-sum statement does not
      establish polynomial time when L and the label/evaluation costs are open.

known_false_and_boundary_controls:
  - id: zero_label
    construction: "EdgeLabel(e)=0 and RingPotential(E,W_E,C)=0"
    J1_observation: >-
      This makes the missing calls superficially executable after domains are
      supplied, but uses no ring and yields a public constant pad input. It
      demonstrates that typed method names do not enforce the intended
      nontrivial or secret functionality.
    use: proves_too_much_control_only
  - id: public_coboundary
    construction: "EdgeLabel(U->V)=h(V)-h(U) for a public canonical h"
    J1_observation: >-
      The sender and recipient can compute h(C)-h(E) publicly once encodings
      are concrete. This is a viable forward-map shape but not the submitted
      missing construction and requires no W_E.
    use: boundary_control_not_a_repair
  - id: opaque_RingPotential
    construction: "Declare black-box oracle access to RingPotential"
    J1_observation: >-
      This would allow Dec to run but introduces exactly the undeclared
      endpoint decoder that J1 was required to reject as hidden setup.
    use: rejected_hidden_algorithm
  - id: supplied_exact_walk
    construction: "Give w directly to Enc and evaluate every declared edge"
    J1_observation: >-
      It conditionally exposes the symbolic map F_E(w), but w is extra advice
      until WalkSample and edge encodings are supplied; it does not define the
      real endpoint law or help Dec without the path.
    use: typing_probe_only

positive_findings:
  - >-
    The producer does not overclaim J1: public-statement.yaml,
    endpoint-fiber-relation.yaml, candidate.md, and scheme-contract.yaml all
    disclose the absent subroutines and open cost/failure terms.
  - >-
    Conditional on concrete accepted edge encodings, the terminal-curve loop
    and additive label sum have coherent abstract input/output types.
  - >-
    Conditional on both parties obtaining the same x and on an unambiguous
    H_pad serialization, the XOR step itself is an exact actual-message
    recovery calculation. This is not a discharge of O1, O2, or O3.

required_unblocking_certificate_for_J1:
  - >-
    A concrete Setup and TrapCurveGen_ER with a fully specified D_ER marginal,
    auxiliary data, validation, retries, and a proved polynomial tail.
  - >-
    Canonical byte encodings and public parsers for all parameters, curves,
    edges, group elements, basis objects, lengths, and hash transcripts.
  - >-
    A concrete public WalkSample with exact transition/endpoint distribution,
    admissibility rules, failure law, and polynomial cost.
  - >-
    A concrete nontrivial public EdgeLabel and executable group law with
    polynomial bit complexity.
  - >-
    Concrete TrapCurveGen_ER, CompleteEvalBasis, and RingPotential algorithms,
    including representation conversions, total memory, bit lengths, and
    failure probabilities.
  - >-
    One reconciled function signature for every call, followed by a complete
    end-to-end honest execution trace using no advice outside pk, sk, pp,
    message, ciphertext, and declared coins.
  - >-
    A total correctness-failure bound and proof of worst-case or expected
    polynomial time under the selected parameter growth.

preserved_open_objects:
  - exact TrapCurveGen_ER and D_ER
  - exact WalkSample and endpoint distribution
  - concrete admissible curve and edge domains
  - concrete canonical encodings and parsers
  - nontrivial public EdgeLabel
  - complete evaluable-basis generator and verifier
  - RingPotential using only the declared W_E and C
  - all size, runtime, memory, retry, and failure bounds

not_reviewed_here:
  - O3 endpoint-fiber invariance and correctness proof
  - O4 complete-ring necessity and smaller-witness exclusions
  - O5 security-reduction direction, embedding, extraction, and loss
  - O6 complete adaptive QPT/QROM adversarial view
  - novelty
  - NIST_Category_5
  - IND_CPA_or_IND_CCA2_security_as_a_whole

