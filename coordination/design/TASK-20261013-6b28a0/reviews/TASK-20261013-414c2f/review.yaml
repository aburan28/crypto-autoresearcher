claim_reviewed: >-
  O3/O4 hold: the sender value is invariant on every admitted endpoint fiber,
  decryption recovers the actual message with a bounded failure law, and the
  recipient functionality genuinely requires a complete evaluable End(E)
  witness rather than public computation or a smaller substitute.

exact_verdict:
  joint_gate: FAIL
  scientific_disposition: unresolved_construction_gap_not_a_nonexistence_result
  O3:
    producer_status_reviewed: proposed_discharge
    reviewer_status: open
    verdict: conditional_tautology_only_not_an_instantiated_correctness_theorem
    reason: >-
      If RingPotential returns exactly the sender's value under exactly the
      same encodings, the XOR calculation recovers the actual message. But the
      quantified fiber theorem, the RingPotential agreement theorem, the real
      probability space, and every failure term are absent. The conditional
      identity therefore does not discharge O3.
  O4:
    producer_status_reviewed: open
    reviewer_status: open
    verdict: complete_ring_necessity_not_established
    reason: >-
      No RingPotential algorithm is supplied and none of the public, partial,
      cached, compressed, finite-action, evaluator-only, or opaque-decoder
      controls is excluded. Extentionally, Dec uses W_E only through the
      endpoint-decoder function C |-> RingPotential(pp,E,W_E,C); the packet
      supplies no theorem that an implementation of that function yields, or
      must contain, a complete ring basis.
  accepted_claims:
    - >-
      Conditional actual-message identity: for identical pad inputs x_s=x_r,
      (m XOR H(x_s)) XOR H(x_r)=m.
    - >-
      Set-theoretic factorization: a value constant on every F_E-fiber defines
      a function g_E on image(F_E).
  rejected_promotions:
    - instantiated_endpoint_fiber_invariance
    - bounded_correctness_for_the_real_scheme_law
    - polynomial_complete_EndRing_assisted_endpoint_evaluation
    - public_hardness_of_the_endpoint_potential
    - necessity_of_a_complete_ring_over_any_smaller_decoder
  scope: >-
    This verdict fails the frozen J2 evidence gate for the CEFC interface. It
    does not prove that no conservative label, ring-assisted potential, or
    other EndRing-based PKE can exist.

correctness_audit:
  sender_value: "x_s=I_E(w) for w sampled by WalkSample and C=F_E(w)"
  recipient_value: "x_r=RingPotential(pp,E,W_E,C)"
  actual_message_derivation:
    - "v=m XOR H_pad(pp,enc(E),enc(C),enc(x_s),len(m))"
    - "Dec=v XOR H_pad(pp,enc(E),enc(C),enc(x_r),len(v))"
    - "If x_r=x_s and all serialized inputs agree byte-for-byte, then Dec=m."
  conclusion: conditional_identity_valid
  missing_for_O3:
    - a concrete accepted-parameter and key distribution
    - a concrete public EdgeLabel and its canonical reversal rule
    - a proof of equality on every fiber in support, or an exact statistical relaxation
    - a polynomial RingPotential algorithm on the identical endpoint law
    - a bound covering rejection, nontermination, explicit fail, and undetected wrong output
    - numerical or asymptotic bounds for epsilon_key, epsilon_walk, epsilon_parse, and epsilon_potential
  failure_bound_audit: >-
    The displayed sum of epsilons is only a placeholder union-bound shape.
    The events, conditioning on accepted keys, retry tails, and treatment of an
    incorrect non-fail RingPotential output are not defined, and every term is
    explicitly unbounded.

fiber_collision_case_split:
  collision_case:
    statement: >-
      Suppose support(WalkSample(E)) contains w0=a||P||b and w1=a||Q||b,
      where P and Q are distinct admissible nonbacktracking subwalks of equal
      length from U to V. Then F_E(w0)=F_E(w1), and correctness requires
      sum(delta(e),e in P)=sum(delta(e),e in Q).
    falsifier: >-
      Any unequal branch sums give the exact event
      F_E(w0)=F_E(w1) and I_E(w0)!=I_E(w1), so no endpoint-only recipient can
      agree with both honest senders.
    packet_result: >-
      The sampler support, edge family, and delta are uninstantiated, so the
      packet provides neither a concrete pair nor a proof excluding all such
      pairs. This is a symbolic test, not an observed curve collision.
  cycle_case:
    statement: >-
      More generally, if equal-length admitted closed subwalks Z0 and Z1 based
      at the same vertex can replace one another inside an honest length-L
      walk, fiber invariance requires I(Z0)=I(Z1). A single unequal cycle pair
      is a correctness counterexample.
    packet_result: untested_because_admissibility_and_labels_are_abstract
  injective_support_case:
    statement: >-
      If F_E happens to be injective on the entire sampled support, the fiber
      condition is vacuous. The recipient must then evaluate the unique-path
      value from C, but the packet gives no algorithm and no reason that this
      task requires a complete ring instead of path inversion or another
      trapdoor.
    consequence: neither_O3_efficiency_nor_O4_necessity_follows
  reverse_walk_equivalence_gap:
    finding: >-
      The claimed equivalence between fiber constancy and zero sum on
      w0||reverse(w1) additionally needs reverse-edge admissibility and the
      explicit antisymmetry law delta(reverse(e))=-delta(e). The typed
      EdgeLabel law says only "compatible with ... reversal" and does not
      state this equation. Fixed-length nonbacktracking support also need not
      contain the concatenated closed walk. The direct fiber statement remains
      meaningful, but the advertised closed-walk equivalence is not yet typed
      as a theorem.
    effect: O3_remains_open

worked_attacks_and_controls:
  - id: J2-A1-public-coboundary
    control: public_endpoint
    construction: >-
      For any public canonical h:V_lambda->A_lambda, define
      delta(U->V)=h(V)-h(U). Then I_E(w)=h(C)-h(E) telescopes for every walk.
    result: >-
      Perfect fiber invariance and actual-message correctness coexist with a
      fully public endpoint potential. This proves that the cocycle condition
      alone cannot establish O4.
    status: worked_symbolic_negative_control
  - id: J2-A2-exact-path-collision
    control: exact_path
    construction: >-
      On the symbolic diamond w0=a||P||b, w1=a||Q||b, an exact path encoding
      or collision-resistant path hash distinguishes the two walks although
      their endpoint is identical.
    result: >-
      The sender can compute the value, but an endpoint-only Dec cannot choose
      both values. The control fails O3 whenever the admitted support contains
      such a collision.
    qualification: >-
      A whole-path hash is not itself the packet's additive local EdgeLabel;
      it is used only as the frozen proves-too-much control.
    status: worked_conditional_negative_control
  - id: J2-A3-opaque-decoder-factorization
    control: opaque_decoder
    construction: >-
      Replace the semantic input W_E to Dec by oracle or circuit access to the
      single function D_E(C)=RingPotential(pp,E,W_E,C). The remainder of Dec is
      unchanged and never inspects a multiplication table or ring basis.
    result: >-
      The decryption interface factors through endpoint decoding. Without a
      reconstruction or representation theorem, correct decryption does not
      demonstrate possession of a complete ring and a black-box decoder is an
      undealt-with substitute.
    status: structural_control_not_excluded
  - id: J2-A4-EvalLine
    control: EvalLine
    construction: >-
      Attempt to realize D_E only on the reachable endpoint/ciphertext line
      using one endomorphism evaluator.
    result: >-
      Success would defeat O4, but no concrete D_E, reachable line, or action
      is supplied, so the control cannot be run or excluded.
    status: open_not_testable_on_abstract_packet
  - id: J2-A5-finite-action
    control: finite_action
    construction: >-
      Attempt to tabulate only the finite torsion/module action sufficient to
      compute D_E(C) on honest endpoints.
    result: >-
      Success would be a smaller secret than a complete evaluable rank-four
      basis. The packet supplies no representation from which to prove or
      refute this factorization.
    status: open_not_excluded
  - id: J2-A6-cached-preimage-or-potential
    control: cached
    construction: >-
      Cache sampled endpoint/path pairs or endpoint/potential pairs and use a
      polynomial-sized advice table on its covered support.
    result: >-
      The endpoint-domain size, distribution, preprocessing law, and coverage
      are unselected, so the packet cannot show that useful polynomial advice
      has negligible coverage or must encode a full ring.
    status: open_not_excluded
  - id: J2-A7-compressed-secret
    control: compressed
    construction: >-
      Use a retained path, ideal, orientation, potential seed, or specialized
      circuit that evaluates D_E without exposing a ring basis.
    result: >-
      No lower bound or extraction theorem excludes these representations.
      Calling the KeyGen output W_E does not establish minimality or necessity.
    status: open_not_excluded
  - id: J2-A8-public-conjugation
    control: public_conjugation
    construction: >-
      If a later instantiation publishes conjugated action matrices, solve the
      resulting public intertwiner equations before attributing secrecy to the
      conjugator.
    result: >-
      The current packet contains no matrices or conjugation syntax, so this
      control is presently inapplicable rather than passed.
    status: inapplicable_to_uninstantiated_interface_not_a_pass

full_ring_necessity_audit:
  sufficient_for_decryption: not_established_because_RingPotential_is_missing
  functionally_observed_by_scheme: endpoint_decoder_D_E_only
  complete_basis_used_outside_decoder: false
  public_computation_excluded: false
  exact_path_or_pathfinder_excluded: false
  one_evaluator_excluded: false
  finite_action_excluded: false
  polynomial_cache_excluded: false
  compressed_witness_excluded: false
  opaque_decoder_excluded: false
  public_conjugation_excluded_if_later_instantiated: false
  conclusion: >-
    O4 cannot be promoted. The public coboundary is a worked control showing
    that O3-style invariance can hold while O4 is false, and every
    secret-dependent control remains uninstantiated or unexcluded.

earliest_obstructions:
  - id: J2-G1
    obligation: O3
    kind: missing_concrete_fiber_theorem
    statement: >-
      No concrete delta, sampler support, or proof establishes equality of
      label sums for all same-endpoint honest walks.
    unblock: >-
      Supply exact parameters, edges, sampler support, and delta; prove the
      quantified fiber statement including normalization, isomorphisms,
      reversal, and all exceptional cases, or state and bound the exact
      statistical failure event.
  - id: J2-G2
    obligation: O3
    kind: missing_actual_probability_law
    statement: >-
      Correctness failure is written as four unbounded epsilon symbols without
      defined events, conditioning, retry tails, or an undetected-error term.
    unblock: >-
      Give the real key/walk/decoder coin spaces and a negligible total bound
      that includes wrong non-fail outputs and parsing/serialization agreement.
  - id: J2-G3
    obligation: O4
    kind: missing_ring_endpoint_algorithm_and_necessity_theorem
    statement: >-
      RingPotential is an unavailable interface and the decryption
      functionality factors through its output function; no proof excludes a
      public or smaller equivalent decoder.
    unblock: >-
      Supply a polynomial complete-ring evaluator on the exact honest law and
      a checked theorem or reductions showing that every successful decoder in
      each frozen control class yields the required complete evaluable ring
      representation with explicit costs and success loss.

conditional_tautology_boundary:
  proved_from_definitions: >-
    Fiber constancy plus a recipient that returns that same value implies pad
    equality and therefore actual-message recovery.
  not_proved: >-
    That any concrete public local label has the property, that the complete
    ring efficiently evaluates it, that failures are negligible, or that a
    complete ring is necessary.
  promotion_rule: >-
    Do not record O3 as discharged or O4 as anything but open on this packet.

