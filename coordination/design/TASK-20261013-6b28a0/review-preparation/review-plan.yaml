prior: >-
  The Coordinator expects the earliest gap to be the coexistence of public
  forward computability, endpoint-fiber invariance, and a polynomial-time
  complete-EndRing-assisted decoder. If those type, the next expected gaps are
  a smaller-witness/public factorization or an incorrectly directed reduction.
  This is a prior, not a verdict.
joints:
  J1:
    owner_task_id: TASK-20261013-47054b
    claim: O1/O2 and the exact public forward map, endpoint law, encodings, and algorithms are complete and efficient.
    attack: Type every input/output and attempt to execute the sender without ring advice and the recipient with only declared ring advice; reject placeholders and hidden setup.
  J2:
    owner_task_id: TASK-20261013-414c2f
    claim: >-
      O3/O4 hold: the value is fiber-invariant and decryption genuinely
      requires a complete ring rather than public or smaller substitutes.
    attack: Construct same-endpoint distinct-walk collisions and try public endpoint, exact-path, EvalLine, finite-action, cached, compressed, and opaque-decoder controls.
  J3:
    owner_task_id: TASK-20261013-883a47
    claim: O5/O6, novelty, QPT/QROM treatment, and Category-5 evidence obligations are correctly stated and discharged or left explicitly open.
    attack: Reverse every implication, require a same-distribution challenge embedding and complete view simulation, and audit source/cost/parameter claims separately.
blindness:
  reviewers_read_each_other: false
  lifted_for: []
proves_too_much_controls:
  - Public endpoint hash, which is fiber-invariant but gives no recipient asymmetry.
  - Exact path encoding, which sender and recipient may not agree on from an endpoint alone.
  - CEST one-evaluator and finite-torsion-action decoders, which do not require a complete ring.
  - Simultaneous public conjugation, whose secret is recovered by linear equations.
