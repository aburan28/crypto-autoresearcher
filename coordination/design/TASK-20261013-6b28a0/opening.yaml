question: >-
  Does there exist a typed public endpoint map and endpoint-fiber invariant
  such that a sender can compute the invariant from a sampled public isogeny
  walk, a holder of a complete evaluable End(E) witness can recover the same
  invariant from the endpoint, and the public endpoint/transcript alone does
  not provide an equivalent decoder?
success_gate:
  - Exact KeyGen, Encaps/Encrypt, Decaps/Decrypt, domains, encodings, randomness, rejection, and failure law.
  - A quantified endpoint-fiber invariant: every admissible honest walk in the declared fiber yields the same key input, or an exact distribution-matched equivalence relation says why.
  - A polynomial-time complete-EndRing-assisted decoder on the exact public distribution.
  - Full-ring necessity against public endpoint computation, one evaluator, cached preimage, finite torsion action, and compressed/opaque substitute controls.
  - Correctly directed attacker-to-complete-evaluable-EndRing extraction on the same challenge distribution, with complete adversarial view and explicit loss.
  - Separate, source-grounded novelty, QPT/QROM, and NIST Category-5 evidence gates.
failure_gate:
  - Exhibit the earliest exact typing failure, path-dependence/fiber collision, public recovery, smaller-witness factorization, simulator failure, or incorrectly directed reduction.
  - Scope any obstruction to the frozen interface; do not infer universal nonexistence.
nonduplication:
  LABELLED_NORM_HOM_LIFT: No complete Hom(E,C) enumeration or labeled-residue assumption.
  simultaneous_conjugation: Public linear/intertwiner recovery is a required negative control.
  EigenX_v2_or_Seta: No prescribed-path or finite-torsion-action recovery.
  CEST: No one-line evaluator or scalar-transfer functionality.
  EigenX_v3: No R_CER witness encryption, external-instance DXWE/XWE, xO, or Naor--Yung transform.
frozen_obligations:
  O1: Exact setup, EndRing/key distribution, walk law, endpoint encoding, and auxiliary data.
  O2: Typed polynomial-time public sampler/forward map, invariant, recipient decoder, and complete PKE algorithms.
  O3: Actual-message correctness from a proved endpoint-fiber invariant, including failure probability.
  O4: Complete-ring necessity against public, partial, cached, compressed, finite-action, and evaluator-only alternatives.
  O5: Same-distribution attacker-to-complete-EndRing extraction with game, oracles, loss, runtime, and quantum compatibility.
  O6: Complete malformed/repeated/auxiliary/adaptive QPT/QROM view and total cost accounting.
stop_rule: >-
  Stop after one packet and the frozen review/report/archive chain. No
  implementation, benchmark, parameter selection, automatic successor, or
  security claim is authorized.
