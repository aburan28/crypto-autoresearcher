  normalization_policy: >-
    Preserve each owner status. "Contradicted" applies only to the submitted
    complete-and-efficient O2 claim; "open" is not changed to failed or
    discharged; J3's documentation verdict is not promoted into a scientific
    gate pass.
  O1:
    status: open
    owner_joint: J1
    basis: missing_exact_TrapCurveGen_ER_and_real_public_key_endpoint_law
  O2:
    status: contradicted_for_the_submitted_complete_and_efficient_claim
    owner_joint: J1
    basis: honest_algorithms_not_executable_from_declared_inputs
  O3:
    status: open
    owner_joint: J2
    basis: conditional_XOR_identity_without_instantiated_fiber_or_failure_theorem
  O4:
    status: open
    owner_joint: J2
    basis: complete_ring_necessity_not_established_and_smaller_decoders_not_excluded
