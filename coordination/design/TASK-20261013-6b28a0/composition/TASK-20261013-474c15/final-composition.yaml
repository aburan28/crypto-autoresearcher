earliest_exact_obstruction:
  obligation: O1
  kind: missing_exact_real_distribution
  statement: >-
    The first conjunctive gate has no concrete TrapCurveGen_ER, joint (pp,E)
    public marginal, auxiliary-data law, retry law, or distribution-matching
    theorem. Therefore real KeyGen and the honest endpoint law are undefined.
  immediate_downstream_blocker: >-
    Even if that law were supplied, O2 still has no concrete nontrivial public
    EdgeLabel, executable WalkSample, CompleteEvalBasis, or polynomial
    RingPotential, so Enc and Dec cannot be run from the declared inputs.
  why_decision_changing: >-
    Security games, correctness probabilities, reductions, and concrete
    Category-5 accounting cannot be instantiated before the real distribution
    and honest algorithms exist.

