category5_claim: not_established

normative_target:
  source: unavailable_in_declared_read_scope
  status: open
  requirement: >-
    Retrieve and inspect the current normative NIST security-category
    definition and applicable PKE/KEM submission requirements before assigning
    any numeric work-factor target. A remembered equivalence is not evidence.
  no_inference: "This packet does not assert a Category-5 bit threshold."

prerequisites_before_parameter_selection:
  - "Concrete TrapCurveGen_ER and exact real public-key distribution."
  - "Concrete EdgeLabel and a proof of endpoint-fiber invariance."
  - "Polynomial RingPotential with complete bit/runtime/memory/failure costs."
  - "Proof that public, exact-path, EvalLine, finite-action, cached, compressed, and opaque decoders do not replace the complete ring."
  - "Same-distribution QPT attacker-to-complete-EndRing reduction with an explicit QROM loss."
  - "A CCA-secure construction or an explicit decision that only passive IND-CPA is targeted; the raw CEFC syntax is not CCA secure."
  - "Primary-source novelty audit and complete scheme specification."

parameter_variables:
  field:
    variables: [p, bitlength_p, field_representation]
    required_evidence: "Exact curve count/domain, arithmetic costs, and all known classical/quantum attacks."
  walk:
    variables: [edge_degree_family, L, branching_factor, rejection_rules, endpoint_distribution]
    required_evidence: "Entropy, mixing, collisions, path multiplicity, retries, and endpoint bias."
  label:
    variables: [A_lambda, kappa, EdgeLabel_representation]
    required_evidence: "Nontriviality, zero circulation, conditional distribution, and prediction advantage."
  ring:
    variables: [basis_encoding_bits, evaluation_cost, verification_cost, conversion_cost]
    required_evidence: "Complete evaluable-basis certificate and costs, not an abstract quaternion order alone."
  random_oracle:
    variables: [H_pad_output, q_H, domain_separation]
    required_evidence: "Exact QROM theorem, programming/extraction loss, and quantum-query limits."
  messages_and_ciphertexts:
    variables: [mu, public_key_bytes, secret_key_bytes, ciphertext_bytes]
    required_evidence: "Worst-case sizes including certificates, hints, and canonical encodings."

attack_portfolio:
  - id: generic_endpoint_search
    threat: "Classical pathfinding, collision, bidirectional, and time-memory tradeoff attacks on F_E."
    required_accounting: "Operation unit, success probability, memory, preprocessing, parallelism, and multi-target amortization."
  - id: quantum_endpoint_search
    threat: "Quantum walk, collision, claw, hidden-shift, and amplitude-amplified inversion strategies."
    required_accounting: "Logical depth/gates, qubits, QRAM assumptions, success, and reduction to the exact endpoint law."
  - id: complete_EndRing_algorithms
    threat: "Best known classical and quantum EndRing recovery on the exact D_ER marginal."
    required_accounting: "Distribution dependence, output representation, preprocessing, memory, and verification."
  - id: smaller_witness
    threat: "Recover only g_E, one path, one evaluator, finite torsion action, ideal/orientation, cache, or compressed decoder."
    required_accounting: "Compare the cost of every equivalent decoder with full ring recovery."
  - id: fiber_and_collision
    threat: "Same endpoint with unequal labels, endpoint/potential collision, or pad reuse."
    required_accounting: "Exact probabilities over real keys/walks and total multi-query accumulation."
  - id: public_algebra
    threat: "Linear intertwiner/conjugation recovery, torsion leakage, pairing-visible relations, and canonical-model leakage."
    required_accounting: "Worked public-data attacks and known-false fixtures."
  - id: chosen_ciphertext
    threat: "Raw XOR malleation, alternate encoding, related endpoint, rejection, and replay attacks."
    required_accounting: "A complete IND-CCA2 game and transform proof if active security is claimed."
  - id: qrom
    threat: "Quantum queries to H_pad and any hash-defined sampler/label, including reprogramming loss."
    required_accounting: "Exact q_H dependence and all additive failure terms."
  - id: multi_user_auxiliary
    threat: "Repeated keys, endpoints, related public keys, auxiliary torsion/hints, and cross-user preprocessing."
    required_accounting: "Tight or explicitly loose multi-user/multi-target reduction."
  - id: implementation
    threat: "Validation timing, exceptional curves, fault behavior, memory access, and retry leakage."
    required_accounting: "Scope-specific constant-time/fault evidence; no implementation claim otherwise."

reduction_and_cost_table_required:
  rows:
    - EndRing_challenge_to_real_public_key_embedding
    - PKE_attacker_to_CEFC_POT_PR
    - CEFC_POT_PR_to_complete_EndRing
    - QROM_programming_or_extraction
    - endpoint_and_label_collision_accumulation
    - correctness_and_rejection_failure
    - classical_best_attack
    - quantum_best_attack
    - smaller_witness_best_attack
    - keygen_enc_dec_total_costs
  columns:
    - exact_distribution
    - success_or_advantage
    - loss_or_abort
    - operation_unit
    - runtime
    - memory_or_qubits
    - preprocessing
    - targets_amortized
    - source_and_provenance
    - independent_review_artifact
  current_rows_completed: 0

acceptance_gate:
  security_theorem: "Every O1-O6 obligation has independently reviewed discharge in the claimed model."
  normative_comparison: "All attack costs after reduction losses meet the inspected current Category-5 target."
  conservative_minimum: "The lowest-cost credible classical, quantum, or smaller-witness attack controls the category."
  implementation: "Measured performance is reported separately and cannot substitute for security evidence."
  no_extrapolation: "Toy or asymptotic evidence does not establish Category 5 without a justified concrete bridge."

current_blockers:
  - exact sampler absent
  - label and fiber theorem absent
  - RingPotential absent
  - complete-ring necessity absent
  - attacker-to-complete-EndRing reduction absent
  - QPT/QROM proof absent
  - raw syntax IND-CCA2 attack
  - normative source unavailable
  - no parameters, implementation, benchmarks, or measured bounds

next_action: >-
  Do not select parameters. First instantiate and independently review the
  algebraic relation and correctly directed reduction; only then freeze a
  separate parameter-search protocol against the inspected normative target.

