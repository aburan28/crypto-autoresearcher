candidate_comparison:
  CEFC_vs_LABELLED_NORM_HOM_LIFT: >-
    CEFC asks for a conservative local edge label and endpoint potential; it
    does not assume enumeration of Hom(E,C) or labeled norm fibers.
  CEFC_vs_simultaneous_conjugation: >-
    CEFC publishes no conjugated matrix tuple; linear intertwiner recovery is
    retained as a negative control.
  CEFC_vs_EigenX_v2_or_Seta: >-
    CEFC does not prescribe a secret path or recover from a finite torsion
    action; any such factorization fails its full-ring-necessity gate.
  CEFC_vs_CEST: >-
    CEFC is not defined through one reachable-line evaluator; an EvalLine
    factorization is a rejection control.
  CEFC_vs_EigenX_v3: >-
    CEFC uses no R_CER witness encryption, external XWE/DXWE instance, xO, or
    Naor--Yung wrapper, based only on the frozen opening's nonduplication note.
  novelty_conclusion: open_not_established

