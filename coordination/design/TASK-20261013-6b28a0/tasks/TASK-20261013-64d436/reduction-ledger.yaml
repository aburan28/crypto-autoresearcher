claim_target:
  primitive: pke
  notion: IND-CPA
  adversary: QPT
  oracle_model: QROM
  advantage: "Adv_IND_CPA(A)=abs(Pr[b'=b]-1/2)"
  active_security: "The exact raw syntax is IND-CCA2-malleable and is not claimed active-secure."

target_hard_problem:
  name: CompleteEval-EndRing
  input: "(pp,E,aux_ER) sampled from the exact public marginal used by KeyGen"
  output: >-
    A complete efficiently evaluable saturated rank-four Z-basis of End(E),
    including multiplication/norm data and representation conversions accepted
    by CompleteEvalBasis.
  success: "CompleteEvalBasis(pp,E,W_E)=1"
  quantum_hardness_status: unestablished
  distribution_status: uninstantiated

required_direction:
  input_to_solver: CompleteEval-EndRing_challenge
  oracle_or_subroutine: successful_CEFC_PKE_IND_CPA_attacker
  output_from_solver: complete_evaluable_EndRing_basis
  schematic: "EndRing challenge E -> B^A(E) -> W_E"
  status: absent

arrows:
  - id: R0
    from: CEFC-PKE_IND-CPA_attacker
    to: CEFC-POT-PR_adversary
    status: proposed_not_proved
    challenge_distribution: exact_real_key_and_honest_endpoint_required
    embedding: >-
      Use the CEFC-POT-PR value as the endpoint potential from which H_pad is
      derived in the challenge ciphertext.
    simulation: >-
      Must answer QROM H_pad queries and preserve the real message/ciphertext
      distribution without knowing the hidden endpoint potential.
    loss: absent
    runtime: absent
    quantum_scope: "No measure-and-reprogram, one-way-to-hiding, or other QROM theorem is supplied."
    blocker: "The QROM embedding/programming and collision/failure terms are not derived."
  - id: R1
    from: CEFC-POT-PR_adversary
    to: CompleteEval-EndRing_solver
    status: missing_load_bearing_arrow
    challenge_distribution: exact_real_key_and_honest_endpoint_required
    embedding: absent
    simulation: absent
    extraction: >-
      Must output a complete evaluable rank-four basis, not one predicted
      potential, one walk, one pathfinder, one endomorphism, one torsion action,
      one ideal, or an opaque decoder.
    loss: absent
    runtime: absent
    quantum_scope: absent
    blocker: >-
      No reconstruction theorem shows that predicting endpoint potentials on
      the scheme distribution identifies the complete ring.
  - id: R2
    from: CompleteEval-EndRing_witness
    to: RingPotential_and_decryption
    status: required_functionality_interface_uninstantiated
    direction_value: reverse_attack_or_functionality_only
    note: >-
      Even a proof of this arrow would show how a ring holder decrypts. It does
      not prove that a scheme attacker computes the ring.

same_distribution_checklist:
  public_key_marginal: open
  endpoint_law: open
  auxiliary_public_data: open
  message_and_ciphertext_law: typed_but_uninstantiated
  malformed_and_repeated_queries: open
  qrom_transcript: open
  multi_user_and_multi_target: open
  hidden_advice_prohibited:
    - sender walk
    - retained key-generation path
    - quaternion orientation or ideal not in the public scheme
    - complete ring or one evaluator
    - endpoint potential table

extractor_obligations:
  challenge_embedding: "Embed the supplied E as a byte-identical real public key without knowing W_E."
  attacker_view: "Simulate pp,E,challenge endpoint,payload,QROM,and every claimed oracle/observable."
  output_representation: "CompleteEval-EndRing witness accepted by the declared verifier."
  success_bound: "A non-negligible explicit function of Adv_IND_CPA, q_H, aborts, collisions, and failures."
  runtime_memory: "Polynomial total bit complexity and memory, including ring conversion and verification."
  quantum_compatibility: "No classical rewinding or transcript inspection unless justified for the QPT/QROM model."

intermediate_assumption:
  name: CEFC-POT-PR
  exact_game: endpoint-fiber-relation.yaml
  status: independently_named_but_unsupported
  logical_dependency: >-
    Any conditional CEFC theorem would be based on CEFC-POT-PR plus a QROM
    theorem and failure/collision bounds unless R1 is proved. Those are multiple
    assumptions, not EndRing alone.
  EndRing_gap: R1

reverse_arrow_and_proves_too_much_controls:
  - "Complete EndRing -> decrypt does not imply attacker -> Complete EndRing."
  - "One recovered path -> endpoint potential does not imply a complete ring."
  - "One evaluator or finite action -> decrypt refutes necessity rather than supporting extraction."
  - "An opaque RingPotential oracle can decrypt every ciphertext while revealing no basis representation."
  - "A public endpoint hash satisfies fiber invariance on objects where confidentiality is known false."

quantitative_bound:
  desired_form: >-
    Adv_IND_CPA(A) <= L0(lambda,q_H)*Succ_CompleteEval-EndRing(B)
    + delta_qrom + delta_collision + delta_failure
  L0: absent
  delta_qrom: absent
  delta_collision: absent
  delta_failure: absent
  solver_runtime: absent
  conclusion: no_quantitative_or_asymptotic_EndRing_implication

