    - polynomial complete-EndRing RingPotential
    - CEFC-POT-PR on the exact public distribution
    - attacker-to-complete-EndRing extraction
    - QPT/QROM proof and complete failure/collision accounting
  open_obligations: [O1, O2, O4, O5, O6]
  obstruction:
    affected_obligation: O2/O4/O5
    exact_family_and_parameter_scope: "The CEFC edge-cocycle endpoint-potential interface at all presently unselected parameters."
    counterexample_or_argument_artifact: candidate.md
    what_remains_open: >-
      Existence of another label, evaluator, reduction, or a materially
      different EndRing PKE; no universal nonexistence is claimed.
  independent_review_artifacts: []
  next_action: >-
    Independently test the fiber theorem and smaller-witness controls, then
    require the correctly directed same-distribution extractor before any
    construction label.
  official_state_transition_record: null

