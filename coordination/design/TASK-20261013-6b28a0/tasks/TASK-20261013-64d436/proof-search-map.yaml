  statement: >-
    The packet has no concrete public nontrivial zero-circulation label and no
    polynomial complete-ring endpoint evaluator. Security/reduction search
    cannot honestly promote the relation beyond a conditional candidate.
  compute_would_discriminate_now: false
  formalization_ready: false
  formalization_revisit: >-
    Revisit only after EdgeLabel, admissible fibers, and RingPotential are
    concrete enough to state without oracle placeholders.

