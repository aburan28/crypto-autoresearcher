  dominated_by: "n/a (no result claimed)"
  frontier_check_scope: >-
    Only the declared internal sources were permitted. They suffice for named
    nonduplication controls, not a global literature frontier or novelty claim.
  sota_delta: "No construction or attack; conceptual endpoint-cocycle relation and exact gap map only."
  enumerated_closures: []
  open_directions:
