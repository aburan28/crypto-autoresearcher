tracked_object:
  name: endpoint_fiber_cocycle_holonomy
  description: >-
    The additive sum of public local edge labels along an isogeny walk. It
    descends to an endpoint potential exactly when every admissible same-
    endpoint path collision has zero label difference.
  verified_depth: symbolic_definition_and_conditional_correctness_identity
  unverified:
    - existence of a nontrivial public conservative label
    - efficient complete-ring endpoint evaluation
    - public hardness and complete-ring necessity
    - attacker-to-complete-EndRing extraction

cheap_audits:
  baseline_reproduction:
    status: completed_symbolically
    exact_bottleneck: >-
      Earlier admitted functionality either factors through one reachable-line
      evaluator, a finite torsion action, an exact path, or a public conjugator;
      none yields a same-distribution attacker-to-complete-ring extractor.
    baseline_fixtures:
      - id: public_endpoint_hash
        fixture: "delta(U->V)=h(V)-h(U), so I(w)=h(C)-h(E)"
        expected: "Fiber-invariant and publicly computable; confidentiality/full-ring necessity false."
      - id: exact_path_hash
        fixture: "I(w)=H(enc(w))"
        expected: "Sender-computable but not fiber-invariant on any collision."
      - id: EvalLine
        fixture: "Endpoint decoding through one endomorphism evaluator on a reachable line."
        expected: "Smaller witness; full-ring necessity false."
      - id: finite_action
        fixture: "Endpoint decoding from a finite torsion-action table."
        expected: "Smaller witness; full-ring necessity false."
      - id: public_conjugation
        fixture: "Potential encoded by publicly conjugated matrices."
        expected: "Recover normalized conjugator through linear intertwiner equations."
    result: >-
      CEFC is syntactically disjoint only if its label/evaluator does not reduce
      to any fixture. No such concrete instantiation is supplied.
  observation_collision:
    status: unresolved_load_bearing
    observable: "The endpoint C=F_E(w)."
    ground_truth: "The sender value I_E(w)."
    search: >-
      Hold C fixed and choose two admissible walks w0,w1. Any unequal sums are
      a direct correctness falsifier. Equality for sampled paths is not enough;
      the declared quantified fiber or exact statistical law must be covered.
    known_false_control: exact_path_hash
    pass_condition: "A proof that every admitted same-endpoint pair has equal label, with all normalization/isomorphism cases."
    current_result: no_proof_and_no_concrete_label
  quantifier_order:
    status: completed_specification_only
    frozen_order:
      - "for all accepted pp and real keys (E,W_E)"
      - "for all allowed messages m"
      - "for all honest w in support(WalkSample(E)) and C=F_E(w)"
      - "RingPotential may use fresh internal coins but no sender path"
      - "correctness and failure bounds are then taken over declared coins"
    forbidden_dependencies:
      - "EdgeLabel depending on W_E or a hidden orientation"
      - "Extractor advice depending on the withheld sender walk"
      - "A per-endpoint nonuniform decoder omitted from the secret-key size"
      - "A chosen endpoint law different from honest WalkSample"
    current_result: "The order is typed; no construction meets it."
  method_ceiling_and_nearby_control:
    status: completed
    ceiling: >-
      An endpoint potential gives at most the secret-dependent value needed for
      decapsulation. Without a reconstruction theorem it cannot establish a
      complete rank-four EndRing basis. Any smaller equivalent evaluator caps
      O4 below complete-ring necessity.
    nearby_false_object: >-
      The public coboundary delta(U->V)=h(V)-h(U) has perfect zero circulation
      and correctness while providing no secrecy. Therefore fiber invariance
      alone proves too much.
    current_result: "O4/O5 cannot be inferred from the cocycle property."

constructive_transforms:
  baseline_as_boundary_lift:
    applicable: true
    proposal: >-
      Require a label/evaluator whose decoding cannot be represented by the
      public endpoint, one evaluator, finite action, cache, compressed witness,
      or opaque decoder.
    status: open_no_instantiation
  stronger_compositional_invariant:
    applicable: true
    proposal: "Use exact zero circulation, not pairwise sampled agreement, so composition over walks is well-defined."
    status: formal_requirement_only
  telescoping_potential:
    applicable: true
    proposal: "Interpret EdgeLabel as a discrete gradient whose telescoping sum is the hidden endpoint potential."
    status: conceptual_object_only
  specialize_measure_pack:
    applicable: false
    reason: "No compute or measured resource claim is authorized; the algebraic interface fails first."
  representation_reduction_chain:
    applicable: true
    chain:
      - public edge and walk representation
      - endpoint-fiber quotient
      - secret RingPotential evaluation
      - CEFC-POT-PR game
      - complete EndRing extraction
    status: "First three load-bearing instantiations and final extraction are open."
  observable_fiber_counterexample:
    applicable: true
    proposal: "Find same-endpoint paths with unequal label, or a smaller witness computing every endpoint potential."
    status: mandatory_for_independent_review

controls:
  public_endpoint: required
  exact_path: required
  EvalLine: required
  finite_action: required
  cached_preimage_or_table: required
  compressed_witness: required
  opaque_decoder: required
  public_linear_conjugator: required
  alternate_encoding_and_CCA: required

