review:
  task_id: TASK-20260909-fbb81b
  joint: synthetic_null_fixture_closure
  scope: BATCH-local source-only review of the synthetic-null replay draft; no screen was replayed and no result was generated.
  verdict: breaks
  conclusion: The draft does not define a finite fixture or a closed result/control interface, so no receipt can be bound to a synthetic null and claim-bearing output cannot be mechanically refused.
  findings:
    - id: BRK-FIXTURE-IDENTITY
      finding: The specification requires literal-fixture and fixture-digest before any run, but names neither literal bytes nor a canonical serialization nor a digest.
      consequence: A purported result cannot be tested for membership in the declared synthetic fixture, and source_digest_mismatch_reject has no declared expected digest to test.
    - id: BRK-PREDICATE-AND-CONTROLS
      finding: The contract names matched_null and positive_shape controls but defines neither the predicate version nor typed structure-bearing and structure-free descriptors, expected outcomes, or the flag-count calculation.
      consequence: The declared null-control outcomes cannot be independently re-derived, and a flag count cannot be classified as passing or failing a control.
    - id: BRK-RESULT-CLOSURE
      finding: The contract says output is a typed flag count and control disposition, but supplies no result key set, type grammar, allowed values, or equality predicate.
      consequence: A receipt may omit controls or introduce fields such as live_screen_replay, scheduling_decision, approval, execution, or scientific_claim without a mechanical rejection rule.
  mutation_checks:
    - mutation: Substitute a different synthetic fixture while retaining the stated draft.
      expected_rejection: No digest comparison is defined; the substitution is not mechanically rejectable.
    - mutation: Emit a result with an empty controls object or an arbitrary flag count.
      expected_rejection: No typed control entries, expected values, or flag-count domain is defined; the output is not mechanically rejectable.
    - mutation: Add a live-screen or scientific-claim field to an otherwise plausible synthetic receipt.
      expected_rejection: The forbidden list is prose-only because no closed result schema rejects the added field.
  limits:
    - This finding concerns only fixture/control/result-envelope closure for the BATCH-local design.
    - It provides no result about a live mechanism screen, false-positive rate, ECDLP, or cryptanalytic performance.
    - No implementation, approval, scheduling, execution, or status transition follows from this report.
