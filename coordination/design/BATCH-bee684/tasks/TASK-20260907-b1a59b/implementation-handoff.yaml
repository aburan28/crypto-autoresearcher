  artifact_contract:
    corpus.py: Source for fixed-commit blob inventory, payload/route checking, view extraction and direct-reference candidates; no census performed in this task.
    queries.py: Program-specific non-shell argv parser, supported Boolean compiler, fidelity/leakage interfaces, stable filters and sparse lexical query construction; no recorded query executed now.
    evaluate.py: Offline source-pinned sparse adapter, deterministic samplers, exact fraction/delta/cluster summaries, stage ordering and protected exclusive-output/checkpoint interfaces; no index writes or scoring now.
    controls.py: Source definitions of the fixed 27-document mechanical panel and six obligation oracles; no fixtures materialized or evaluated now.
    independent_checker.py: Separate set-membership, count, null-expectation, rank/tie and hash-binding interfaces, with no producer imports and explicit actual authorship limitations. Structural validity is not relevance truth or a proof of evaluator correctness.
    schemas.json: Exact admission, candidate, route, query, blind-label, null-slot, control, arm, rank, metric, bootstrap, resource and failure/NA schemas with denominator checks.
    admission-template.json: Required real corpus/labels/query/code/config/executable/version/resource hashes and independent access/review fields remain null or unverified; no invented values.
    label-rubric.md: Frozen two-pass relevance rubric, third-adjudicator procedure, masking/read scope, unresolved/exclusion rules and access-attestation templates; no actual labels.
    implementation-manifest.yaml: Hashes of the other nine exact prepared files and dependency bindings, actual model identity if exposed and unverified status otherwise, source authorship and remaining admission dependencies; no self-hash or launch receipt. The external Coordinator snapshot binds this manifest's own bytes.
    preparation-report.yaml: Requirement mapping, actual source-only work, independence/read limitations, unresolved interfaces, no-run attestation and exact next admission needs. Identify implementation-manifest.yaml by path without its digest, so the manifest can hash the report without a recursive dependency.
