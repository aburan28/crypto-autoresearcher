  constraints:
    - You are not alone. Own exactly the ten declared files; preserve all other edits, original records, effective schema corrections, source corpus and indexes.
    - Begin only with the canonical committed/archived contract, a valid genuine task claim and the declared inference policy. No fallback, degradation or Bedrock.
    - Maximum runs is zero. Do not perform a census, create realized corpus/label/query manifests, label or adjudicate candidates, run grep/rg queries, score recall, generate/control-evaluate fixtures, sample nulls, bootstrap, execute scientific tests/proofs, or write an index.
    - Do not call save/stage/ingest/reindex/Qdrant/network, mutate configured indexes, or execute arbitrary shell commands from recorded proposal text. No import-time corpus traversal or query work.
    - Implement the full known-reference protocol rather than replacing it with synthetic controls. Preserve the full-body all-match arm, three title/abstract arms, K20, all three null seeds, 20 replacement draws, 2000 shared cluster slots and every reporting stratum.
    - Preserve study-level at-least-50 adjudicated relevant candidate pairs; do not transfer this threshold to the narrower matched-delta subset. Missing queries/unknown refs are reported strata, and unavailable searchable payloads are distinct admission defects.
    - Keep the independent checker separate from producer code and clearly record actual author/access boundaries. No module filename establishes independent authorship or a successful review.
    - Schemas and templates remain unfilled where actual source/corpus/labels/environment/runtime hashes or outcomes are required. Do not fabricate model verification, successful resource admission or review attestations.
    - Source-only static inspection is permitted within the genuine implementation task; no execution of evaluator/fixture/scientific code. Record incomplete dependencies or unsupported semantics explicitly instead of silently weakening the contract.
    - Later labeling/adjudication must use independent sessions and the frozen access policy. Later claims require a preregistered independent review plan; this preparation handoff opens no claim-changing round.
    - Future scientific execution requires separately admitted corpus/labels/queries/code, actual resource guards, genuine execution/archival handoffs and a locked three-invocation plan. This handoff cannot launch them.
