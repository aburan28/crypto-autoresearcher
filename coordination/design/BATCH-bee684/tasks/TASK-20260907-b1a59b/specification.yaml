experiment:
  id: EXP-CRYPTO-3759c6
  hypothesis_id: H-CRYPTO-1d65d5
  question_id: RQ-CRYPTO-001
  version: 1
  title: Full known-reference recall calibration with recorded-query replay and an offline sparse comparator
  status: approved
  frozen: true
  approved_by: coordinator
  approval_decision_id: DEC-20260907-b8bd3e
  scientific_execution_authorized: false
  evidence_eligible_before_review: false
  supersedes_experiment: EXP-CRYPTO-79832d
  derived_from_idea: IDEA-20260807-fa706a
  objective: >-
    Enumerate every direct proposal-to-KN-LIT source-reference candidate in
    the pinned corpus, independently adjudicate its relevance, and evaluate
    the recorded search terms without access to the author reference. Retain
    full-body all-match hit rates while separating field and return-budget
    effects through title/abstract Boolean and offline sparse top-20 arms.
    Compare signed paired differences and random-entry baselines without
    claiming recall of unknown relevant literature or validating novelty.
  inputs:
    source_commit: 5401431c1576bf0e75fac70df1cc54f409ed7c85
    source_packet: coordination/design/BATCH-bee684/source-packet.json
    source_paths:
      - ledger/proposals/IDEA-20260807-fa706a.yaml
      - ledger/hypotheses/H-CRYPTO-7dd003.yaml
      - ledger/corrections/schema-supersessions/20260905/ledger__hypotheses__H-CRYPTO-7dd003.v2.yaml
      - experiments/EXP-CRYPTO-79832d/specification.yaml
      - kb/config/retrieval.yaml
      - kb/README.md
    corpus_rule: All committed knowledge/literature/KN-LIT-*.md and ledger/proposals/IDEA-*.yaml blobs at the exact source commit, not working-tree files or moving HEAD. No corpus census is performed in this design.
    dependencies: Exact source-packet hashes for sparse.py, text.py, hybrid.py, corpus.py, incumbent evaluator, manifest, questions, tests and config; no code or config replacement after labels are seen.
    provenance: Parent-transmitted actual source reads and hash checks. This Coordinator did not read filesystem blobs, run a query or inspect labels in this task.
  scale_relevance:
    tier: toy
    justification: Finite whole-program retrieval instrumentation on the complete pinned record corpus; noncryptographic tooling, not a small synthetic substitute for the production corpus.
    correspondence: null
    cryptographic_parameter_scope: Not applicable; no curve, key, attack, asymptotic exponent or cryptographic experiment is measured.
  execution_gate:
    - Exact design, canonical decision and zero-run preparation artifacts are committed, archived and validated before their task is dispatched.
    - Corpus extraction/census, query extraction, null sampling, independent labeling and measurement are future admitted scientific work; none is authorized by the zero-run preparation handoff.
    - A separately claimed execution plan allocates corpus/adjudication preparation, the three seed invocations, summary artifacts and genuine archive ownership without changing this protocol.
    - Realized corpus, exclusions, labels, queries, incumbent modules/config, executable and environment hashes are frozen in admission.json before retrieval scoring. They are outputs of the frozen procedures, not permission to tune.
    - Independent label authors and a third disagreement adjudicator work in genuinely independent sessions with the stated access boundaries; an independently authored evaluator checker and preregistered claim-review plan are required before evidence promotion.
    - At least 50 adjudicated relevant unique direct-reference candidate pairs are required for study-level sample adequacy; report distinct proposal count separately. Exact/uncontaminated/BM25-representable matched pairs have their own N and P, with matched delta NA if empty. Do not strengthen the 50-pair threshold to that narrower subset or confuse it with 50 independent information needs.
  corpus:
    ordering: UTF-8 bytewise lexical repository path, then canonical record ID; deterministic Unicode decoding as UTF-8 with strict errors.
    manifest_fields: [path, git_blob_id, byte_length, sha256, filename_ID, declared_ID, route_chain, parse_status, payload_status, view_hashes, eligibility_reason]
    inclusion: Every matching committed path is inventoried, including malformed, superseded, missing-payload and unresolved records. Historical counts in IDEA-20260807-fa706a are recounted, never treated as current totals.
    identity: Filename stem is the candidate ID. If a declared ID is present it must agree or have an explicit hash-verified correction route. Duplicate canonical IDs or conflicting route targets are admission defects, never last-write-wins.
    payloads: Git LFS pointer text is not a paper/record payload. Retrieve only an already available hash-verified local payload under a separately admitted preparation step; absent payloads and decoding errors remain missing. No retrieval/index network request in the scoring pipeline.
    routes: >-
      Resolve only explicit committed supersession/schema registry bindings
      present in the pinned source packet/commit, validating every source and
      target hash and detecting cycles. Retain original bytes, route chain and
      effective view. A proposal successor is a separate proposal and remains
      inventoried; scientific supersession is not an automatic exclusion.
      Source-reference aliases that resolve to the same effective KN-LIT ID
      are deduplicated within a proposal, with all original locators retained.
      Never infer a route from a similar title, date or numerical suffix.
    malformed: YAML duplicate keys, malformed frontmatter, ambiguous title/abstract structure, unresolved required routes or missing blobs produce explicit unresolved rows. No silent parser repair or deletion from the corpus denominator.
    complete_corpus_gate: >-
      Every inventoried literature path must have a resolved unique searchable
      effective record before full-corpus scoring is admitted. Every proposal
      is inventoried; missing/unsupported queries and unresolved direct
      references remain reported strata, not generic whole-corpus vetoes.
      Unreadable proposal blobs or indeterminate identity/source structure
      prevent a complete candidate census, while a readable unresolved
      reference is an explicit census outcome. Literature identity/payload/view
      defects prevent complete searchable-corpus scoring; a partial diagnostic
      cannot be relabeled the complete study.
    denominators: Report raw paths, distinct raw IDs, effective IDs, routes, duplicates, missing payloads, malformed records, reference occurrences, unique candidate pairs, unresolved references and all exclusion categories; reconcile totals by explicit row IDs.
  candidates:
    definition: Unique (proposal_ID, effective_KN-LIT_ID) pairs from direct source_refs fields only, at the effective proposal root; retain source field/path/line locators and original tokens.
    reference_grammar: Accept a literal KN-LIT ID, a repository path naming that record, or a structured source_refs entry with an explicit id/record_id/path field. Conflicting explicit fields are unresolved. A prose mention, bibliography occurrence or transitive reference is not a direct pair.
    provenance: Author-known/source-linked relevance candidates are a selected set. They are not all relevant literature and need not be an upper bound on any unknown recall.
    exhaustive_rule: Keep all candidates irrespective of proposal status, later scientific supersession, query availability or expected retrieval success. Report ineligible strata; do not stop collecting once 50 pairs are reached.
  corpus_views:
    full_body: Complete effective KN-LIT UTF-8 record, including frontmatter and body, with line-ending bytes preserved for the admitted grep engine. Explain this field scope in every full-body metric.
    title_abstract: >-
      One document per effective KN-LIT ID: actual frontmatter title if a
      nonempty scalar, else the first literal level-one Markdown heading,
      else empty title. Abstract precedence is a scalar frontmatter abstract;
      otherwise a unique literal Markdown section heading Abstract, case
      insensitive, whose body ends at the next heading of the same or higher
      level. Multiple conflicting candidates are unresolved, not selected
      after results. Missing abstract is empty. Concatenate title, one newline,
      abstract. Never substitute Contribution, summary or an inferred abstract.
    metadata: Preserve separate title/abstract presence flags and their source locators; label title-only, abstract-only, both or neither. Missing fields are not hallucinated.
  labels:
    information_need: Proposal question/claim/mechanism and the named local technical need; exclude source_refs, recorded queries, novelty verdicts, later outcomes and retrieval results from annotator packets.
    candidate_record: The effective corpus record with stable opaque document label, all technical text needed for relevance judgment, and excerpt locators. Mask pair-selection origin, query tokens supplied outside that record, scores, ranks and baseline assignments.
    passes: Two independent assessors assign relevant, not_relevant or unresolved to every unique candidate pair and every unique sampled null proposal/document pair; duplicate sampled slots reuse that pair label while retaining sampling multiplicity.
    rubric_relevant: Explicit shared technical problem/mechanism, or a material named baseline/obstruction for that proposal need, supported by a local excerpt and locator. A shared incidental word or bibliography mention alone is insufficient.
    rubric_unresolved: Insufficient corpus content, ambiguous technical relation, or missing information need. Do not equate missing full-paper access with irrelevant, or local record relevance with external-paper truth/full reading.
    disagreement: Matching relevant/not_relevant labels become final. Any disagreement or unresolved pass goes to a third independent adjudicator, blind to queries/results and the assessors' identities; preserve both original labels, rationale and the adjudicator's excerpt-supported decision. Persisting uncertainty remains unresolved.
    exclusion: Only final relevant direct-source pairs enter positive denominators; not_relevant and unresolved candidates are separately counted and retained. Random draws are never removed merely because their label is relevant or unresolved.
    freeze: Commit/hash all label packets, read-access attestations, first/second/adjudicated labels and exclusions before scoring joins labels to returned sets. No relabeling because an arm missed a target.
    agreement_reporting: Exact two-pass agreement counts and cross-tabulation, disagreement and unresolved rates by proposal and metadata stratum; no uncalibrated inter-rater claim.
  query_extraction:
    unit: A proposal's complete recorded corpus-search expression, not a query constructed for each target pair. The same proposal query is used for all its reference and random-entry pairs.
    provenance_record: Preserve exact proposal byte locators, raw strings/structured fields, declared command/terms, search scope and query-fidelity rationale. Independent extraction review occurs without target IDs/titles or retrieval outcomes.
    precedence: >-
      Use all explicitly recorded corpus-search commands/structured expressions
      in their recorded order, preserving Boolean composition. If multiple
      independent recorded searches have no declared composition, define their
      proposal result as the union of the individually compiled returned sets,
      flag multi_search_union and retain constituent results; this is an
      inherited search reconstruction, not a union of competing retrieval arms.
      Explicit summary term lists with no command are a separate reconstructed
      stratum compiled as case-insensitive fixed-string OR. Prose with no
      unambiguous term list or command is missing/UNREPLAYABLE.
    exact_stratum: A recorded allowlisted command or structured expression fully specifies terms, Boolean logic, flags and corpus-relative filters and can be replayed with equivalent file-predicate semantics on the pinned snapshot.
    reconstructed_stratum: Summary-term OR default, missing explicit scope/flag defaults, multiple-command union convention, or another disclosed loss of historical command fidelity; never pool into primary exact replay.
    unsupported_stratum: Pipes, shell expansion/substitution, unsupported flags/regex dialect, external paths, unknown working-directory semantics, ambiguous AND/OR composition, missing terms or an unrecoverable command are UNREPLAYABLE, not misses.
    no_target_advice: Never obtain terms from source_refs, target title, target abstract, DOI, target record ID or later relevance labels.
    contamination: >-
      Before scoring, a separate leakage checker compares the extracted query
      with each referenced target's literal ID, DOI and normalized complete
      title. A query containing an exact target ID/DOI or full title is a
      shortcut-contaminated pair; record the matching bytes. These pairs are
      excluded from primary mechanism recall but reported in a separate stratum.
      Annotators/query extractors do not receive this target-derived diagnostic.
    contamination_normalization: For full-title/DOI diagnostic comparison only, apply Unicode NFC, casefold and collapse whitespace runs to one ASCII space, stripping outer whitespace. ID matching is literal case-sensitive token equality. Do not alter actual replay corpus/query bytes with this diagnostic normalization.
  query_compiler:
    engine: rg 15.2.0 default Rust regex engine, with exact executable hash and build/Unicode version pinned at admission; no PCRE2 and no shell execution.
    parser: Parse argv as data with POSIX quoting rules only; no eval, shell, pipes, redirections, variable expansion, glob expansion or command substitution. Reject shell metacharacter operations instead of running them.
    allowlist: >-
      Program rg or grep; shared flags -e/--regexp, -F/--fixed-strings,
      -i/--ignore-case, -w/--word-regexp, -x/--line-regexp,
      -l/--files-with-matches, -n/--line-number and --. For rg only additionally
      allow -s/--case-sensitive and --glob/-g. Reject grep -s and --no-messages;
      they are not case-sensitive switches. Treat -l/-n as output formatting only. For grep,
      fixed-string mode or explicitly recorded -E extended regex may be
      translated only after an independent syntax/equivalence check; default
      basic regex is unsupported. Unsupported flags are not silently ignored.
    regex_rule: Only syntax accepted by rg default regex and the source command's admitted dialect; lookaround/backreferences/locale-dependent constructs outside that intersection are UNREPLAYABLE. Empty patterns are handled by their explicit Boolean semantics and flagged, never silently replaced.
    defaults: Exact rg commands retain rg case-sensitive Unicode default semantics unless explicit flags override them; do not Unicode-normalize or lowercase corpus bytes before matching. Summary-term reconstruction uses the separately declared fixed-string case-insensitive OR rule.
    logic: Repeated -e patterns are OR. A structured all_of list is AND across file predicates, any_of is OR; nested lists are permitted only when explicitly recorded. For AND each component must match the document, not necessarily the same line. Negative expressions require explicit supported syntax or are unreplayable.
    paths: Match only an explicit sorted list of admitted corpus-relative paths; apply recorded corpus-local path/glob filters with rg 15.2.0 glob semantics, retaining the resulting universe. Reject paths outside the corpus. Report target excluded by path filter separately, as a real failure of an otherwise replayable query.
    files: Generate no production files. rg reads a private ephemeral snapshot or stdin view with controlled relative-path mapping; original files, corpus and configured index remain read-only.
    empty_query: A truly absent/empty structured query returns the empty set and is flagged separately. An explicitly recorded empty regex has its own flagged exact semantics and cannot be mistaken for an informative search.
    bm25_query: >-
      Concatenate positive literal term texts from the same compiled query,
      preserving term multiplicity. Fixed-string terms are literal; for regex
      terms accept only an entire unescaped literal or alternation of entire
      literals with no metacharacters other than the alternation separators.
      More complex admitted Boolean regex may remain replayable for grep but
      BM25-unrepresentable; retain its stratum rather than inventing words.
      AND/OR constraints filter Boolean results but are not added as BM25
      operators; the sparse arm receives the identical positive lexical terms.
    ranking_union: If a proposal has multiple recorded searches, Boolean sets union before stable ordering; sparse scores sum across constituent query vectors before ranking, with the reconstruction stratum declared. No mixture of Boolean and sparse returns is a primary remedy.
  arms:
    full_all:
      view: full_body
      return_set: All documents satisfying the admitted recorded Boolean predicate and path filters, no top-K truncation.
      meaning: Full-record all-match known-reference hit rate; report cardinality and returned source bytes separately from matched-budget comparisons.
    title_abstract_all:
      view: title_abstract
      return_set: All documents satisfying the same admitted Boolean expression and path filters.
      meaning: Field-effect diagnostic with no return-budget truncation.
    title_abstract_boolean20:
      view: title_abstract
      return_set: First 20 matching documents in UTF-8 bytewise lexical canonical path order, or all when fewer; stable path order is not relevance ranking.
      meaning: Matched-view, matched-budget Boolean comparator.
    title_abstract_sparse20:
      view: title_abstract
      return_set: First 20 strictly positive sparse-score documents in descending score order, ties by the same lexical canonical path; apply the identical admitted path filters.
      meaning: Offline incumbent sparse-model evaluation, not deployed hybrid/Qdrant service performance.
  sparse_model:
    implementation: Use the source-packet-pinned existing sparse/tokenizer components in memory with one title/abstract document per effective KN-LIT ID. No save/stage/ingest/reindex/index mutation/Qdrant/network calls.
    k1: 1.2
    b: 0.75
    identifier_parts_weight: 0.3
    tokenization: Preserve whole identifiers at weight 1 and ASCII word parts at weight 0.3; ordinary ASCII words lowercased with the exact pinned stoplist and search_terms/weighted_terms functions. No vocabulary or parameter tuning against labels.
    statistics: Source-level document frequency, D equal to the full admitted literature document count, length=len(search_terms(text)), average=max(total_length/D,1); one document/chunk per source. Path filters restrict return eligibility, not global statistics.
    idf: max(log(1+(D-df+0.5)/(df+0.5)),0.01)
    query_weight: idf*(1+log(w) if w>1 else w), with pinned weighted-term aggregation.
    document_weight: tf*2.2/(tf+1.2*(0.25+0.75*sum(weighted_terms)/average_length))
    numeric_and_hash: Preserve pinned blake2b four-byte indices, collision accumulation, six-decimal individual vector rounding and sparse dot product. Pin Python/dependency versions and score serialization; these incumbent conventions differ from an ideal un-hashed BM25 formula.
    zero_scores: No positive score means empty return set; never fill K with zero-score ties. Report positive ranks beyond K, zero/not-ranked and excluded-by-filter distinctly.
    incumbent_boundary: The older curated-question hybrid/sparse evaluation has different labels, questions and corpus. Reuse of code is not a comparable old-study result; exact corpus/query/label/view/cutoff/config/source-hash equivalence is required for any future replacement claim.
  nulls:
    seeds: [20260904, 20260905, 20260906]
    draws_per_proposal_per_seed: 20
    proposal_universe: Every inventoried proposal with at least one direct KN-LIT source-reference candidate occurrence, including unresolved-reference or missing-query strata. Those with no scoreable query retain their draws and labels with retrieval membership NA, not a forced miss.
    distribution: Uniform over all D admitted effective KN-LIT IDs, with replacement. Do not exclude source references, relevant entries, duplicate draws, filtered-out paths or metadata-poor records.
    sampling: >-
      Sort IDs by their canonical path order. For proposal ID, seed, slot
      j=0..19 and rejection counter c=0,1,..., compute SHA256 of a length-prefixed
      UTF-8 domain RECALL3759/null, length-prefixed proposal ID, u64 big-endian
      seed, u32 j and u64 c. Interpret as h in [0,2^256-1], reject
      h>=floor(2^256/D)*D, and choose index h mod D. Retain counters and slots.
    byte_encoding: Prefix every domain/proposal UTF-8 string by its u32 big-endian byte length; concatenate fields in the sampling order. All u32/u64 values are unsigned big-endian. Corpus D=0 prevents scoring/sampling; never take modulus zero.
    semantic_labels: Blindly adjudicate unique sampled proposal/document pairs with the same rubric. Keep accidental relevant and unresolved draws in the random-entry baseline; additionally report irrelevant-only, relevant and unresolved strata with their actual denominators. Off-topic text may still word-match.
    exact_expectation: For each proposal/arm the exact uniform-entry hit probability is returned_set_size/D. Verify the denominator includes filtered-out documents and that every sampled slot's hit agrees with set membership.
    micro_weighting: If proposal p has m_p eligible known-reference pairs, use R=sum_p hits_p/sum_p m_p and q_seed=sum_p m_p*(null_hits_p_seed/20)/sum_p m_p. The macro averages proposal rates without m_p weighting and is reported separately.
    margin: For each seed, R>=3*q_seed AND R-q_seed>=0.20, using exact rational comparisons. Also report the same margin against exact q_expected=sum_p m_p*size(S_p)/D/sum_p m_p. Never divide by q, and never interpret failure as proof of chance.
  controls:
    scope: A separate synthetic minicorpus, never inserted into the production corpus/index, tests mechanical evaluation only and never substitutes for the full study.
    fixtures:
      - 'c00: title alpha; abstract beta'
      - 'c01: title ALPHA; abstract gamma'
      - 'c02: title alphabet; abstract beta'
      - 'c03: title delta; abstract epsilon'
      - 'c04: title delta; abstract epsilon (byte-identical searchable text to c03, distinct ID)'
      - 'c05: empty title and abstract'
    obligations:
      - Fixed-string case-sensitive alpha matches c00,c02; case-insensitive also c01; word-boundary alpha excludes alphabet.
      - AND(alpha,beta) in case-sensitive fixed mode matches c00,c02; OR(alpha,epsilon) matches c00,c02,c03,c04. A single word does not discharge AND.
      - A nonexistent fixed token omega and a truly empty structured query return no documents; all-empty/no-overlap sparse inputs return no positive-score documents.
      - The sparse query delta gives positive equal scores to the identical c03/c04 texts, with c03 before c04; assert this mechanically from equal vectors and positive overlap, not by guessing a semantic rank.
      - A synthetic explicit target ID/DOI/title query triggers the leakage flag before scoring; a query assembled from target metadata is rejected.
      - Full-body and title/abstract routing, path exclusion and stable K cutoff are checked against an independently constructed finite-set oracle; a separate 21-document identical-token tie fixture returns the first 20 lexical IDs.
    control_documents: 27
    tie_fixture: IDs t00 through t20, each title tieprobe and empty abstract. This is separate from c00..c05.
    obligations_count: 6
    report_order: Each seed invocation writes and hashes control-results first. Failure invalidates the evaluator and prevents null/treatment interpretation. Semantic off-topic draws are a separate null stratum, not mechanically guaranteed misses.
  pipeline:
    preparation: Freeze complete inventory, candidate provenance, query/compiler manifests, all three null slot sets, independent labels, code and admission data; these are later admitted work, not this design or zero-run implementation.
    invocation: >-
      For each fixed seed, run all six mechanical obligations first and write
      their report. Then construct label-blind returned sets and write/hash
      the null membership/semantic-stratum report before joining positive
      reference labels or writing treatment results. The returned sets are
      deterministic query outputs needed by the null; do not tune them from
      null or positive outcomes. Then write positive arm metrics, paired
      deltas, failed terms and ranks. Preserve this order in one invocation.
    equality: Three seed invocations must produce byte-identical canonical retrieval-output bundles for all deterministic arms; only null slots and seed-specific receipts may differ. Any mismatch is an evaluator/configuration defect, not retrieval variability.
    summary: After all three invocations, aggregate exact fractions and the fixed shared bootstrap once; no additional retrieval arm, null seed or adaptive query is introduced.
  metrics:
    primary: [known_reference_micro_hit_rate_full_all, known_reference_micro_hit_rate_boolean20, known_reference_micro_hit_rate_sparse20, signed_paired_delta_sparse20_minus_boolean20, null_weighted_hit_rates, exact_null_expectation, margin_factor3_and_absolute_0_20]
    secondary: [macro_proposal_hit_rates, title_abstract_all_hit_rate, returned_document_counts, returned_bytes, per_pair_ranks, per_proposal_rates, failed_recorded_terms, query_fidelity_strata, metadata_strata, label_agreement, exclusions, construction_work, scoring_work, checking_work, peak_RSS_bytes, serialized_bytes]
    paired_comparison: Same eligible proposal/reference pairs, queries, title/abstract documents, path filters and K=20; delta is sparse minus Boolean, not a union. Report per-pair four-way hit table and per-proposal deltas.
    denominator_policy: Primary matched delta uses available relevant/adjudicated exact-uncontaminated-BM25-representable pairs and reports separate N/P; it is NA if empty. Study adequacy uses at least 50 relevant adjudicated candidate pairs across fidelity strata. Full-body replay, summary reconstruction, contamination and other strata retain their own denominators. Never mix comparison denominators or silently drop summary replay. Empty strata are NA, not zero.
    strata: Title-only/abstract-only/both/neither; exact/reconstructed/unreplayable; contaminated/uncontaminated; source/correction route and metadata quality; per-proposal rank/failure; query filtered target; known relevant/null irrelevant/null relevant/null unresolved.
    historical_order: Git entry postdate alone does not prove a reference was unknown to an author. Only an explicit ancestry/history relation with adequate provenance supports a chronological stratum; ambiguous or unavailable history is NA, never inferred from an ID or timestamp alone.
    failed_terms: Preserve the recorded term, compiled predicate, term-level match counts, target-level match flags, Boolean composition and failure reason; do not propose successful replacement terms using labels in this evaluation.
  bootstrap:
    resamples: 2000
    seed: 20260904
    unit: Proposal clusters in the primary common comparison set, P distinct proposals; sample P proposal indices with replacement per resample and carry all their admitted pairs and per-seed null slots together.
    sampler: SHA256 input is u32 big-endian UTF-8 byte length of RECALL3759/bootstrap, those domain bytes, u64 seed, u32 resample_index, u32 draw_index and u64 rejection counter, in exactly that order. Use the same 256-bit rejection rule with modulus P. No proposal-ID field. Indices start at zero, proposal order is lexical ID order, all integers unsigned big-endian. Identical resample indices serve all arms, seed margins and paired deltas.
    statistic: Recompute micro rates and signed paired delta with pair counts repeated according to cluster multiplicity; macro summaries are separately named. Use exact fractions until rendering.
    percentile_rule: Sort the 2000 statistic values nondecreasing, retain ties; the sensitivity interval endpoints are one-based order statistics 50 and 1950 (nearest-rank 2.5th and 97.5th percentiles). No interpolation or significance-based stopping.
    interpretation: Conditional proposal-cluster resampling sensitivity, not a calibrated population confidence interval. If P<2, report all 2000 planned slots NA without random draws and the interval undefined; if 2<=P<10, label limited_cluster_sensitivity. Always report P and the 50-pair distinction; no naive pair-iid binomial interval.
  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 3
    interpretation: Three deterministic random-entry null draws; retrieval arms are identical replays, not three independent retrieval samples. Actual proposal and pair counts are frozen admission outputs.
  experimental_unit:
    scientific_invocations: 3
    deterministic_arms: 4
    null_slots: 3*20*P_source_reference_proposals, with exact P and all per-stratum counts frozen by the admission procedure
    known_reference_pairs: Every relevant adjudicated direct-source candidate; study-level count must be at least 50, never truncated to 50. The narrower common exact/uncontaminated/representable comparison reports its own count and is NA when empty.
    pair_measurements: Each admitted pair is scored once per arm per invocation; deduplicate deterministic results across seeds only in reporting, never skip their equality check.
    controls: Six named obligations per seed invocation on the fixed 27-document separate control corpus, 18 obligation executions total.
    bootstrap_samples: 2000 shared cluster resamples once in the summary
    reconciliation: Original maximum_runs 8 was a budget estimate; this successor fixes exactly three complete seed invocations and a deterministic summary. Corpus/label preparation and checkpoint attempts are separately recorded work, not extra or replacement scientific samples.
  independent_variables:
    arms: [full_all, title_abstract_all, title_abstract_boolean20, title_abstract_sparse20]
    null_seeds: [20260904, 20260905, 20260906]
    strata: Fixed query fidelity, contamination, metadata, relevance and proposal strata defined above; no data-selected bins.
  controlled_variables:
    K: 20
    corpus_commit: 5401431c1576bf0e75fac70df1cc54f409ed7c85
    sparse_k1: 1.2
    sparse_b: 0.75
    query_and_label_policy: Frozen before scoring; no tuning, retokenizing, term invention or relevance revision after observed results.
  preregistered_prediction:
    recall_direction: Full all-match known-reference hit rate below 0.5 versus at least 0.5 is the retained motivating directional split, not a required success threshold or global recall bound.
    null_margin: Exact finite factor-three AND absolute-0.20 separation from the weighted random-entry rate is the retained descriptive target; report each seed and exact expected null separately.
    remedy: Sparse20 minus Boolean20 on the identical primary pair set is strictly positive. Zero or negative delta is an admissible scoped negative outcome; no union remedy masks it.
  heuristic_under_test:
    - statement: Recorded search expressions recover a substantial part of their selected known-reference corpus and sparse ranking may improve matched-budget recovery.
      status: Prospective finite evaluation target, not a theorem or unknown-relevance completeness assumption.
      supporting_results: []
      validation_plan: Exhaustive pinned candidate/relevance audit and all four arms with controls, fixed null draws, matched denominators and independent checking.
  tail_checks:
    - Report every proposal and every known-reference miss, positive rank beyond K, zero-score/unranked record, missing field and query-fidelity failure; do not hide difficult strata in a micro average.
    - Preserve all duplicate/accidental relevant null draws and all three seed-specific margin outcomes.
    - Cluster sensitivity does not authorize exclusions, added proposals, alternative K or extra seeds.
  budget:
    enforcement: advisory
    advisory_scope: Wall/CPU estimates only; fixed samples, one scientific invocation at a time, maximum two processes and aggregate 8 GiB protection remain binding.
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_workers: 2
    maximum_runs: 3
    process_checkpoint_seconds: 3600
    justification: A one-hour unattended wall watchdog preserves completed stages and bounds process cleanup; it is not campaign exhaustion or a scientific spending cap.
  runtime:
    processes: One runner with at most one rg child, no additional parallel evaluator, tokenizer or numerical threads; one invocation at a time.
    protection: Later admission verifies a Linux delegated cgroup-v2 aggregate memory.max=8*2^30 and memory.swap.max=0, reads memory.peak/events and CPU telemetry, and bounds the actual runner/child tree. If unavailable, retain an admission defect; do not pretend per-process RSS is aggregate enforcement.
    failure_capture: Exclusive attempt directory, launch.json before setup, stdout.log/stderr.log, and receipt.json on catchable exit. A wall watchdog checkpoints at 3600 seconds; cleanup may take five further seconds. No CPU-time cap. Missing receipt after SIGKILL remains incomplete.
    resume: Persist hashes, completed inventory/control/null/treatment stage boundaries and counters to checkpoint.json. Resume the same frozen seed and query order in a new exclusive attempt; retain all prior bytes and a remaining-work disposition. No favorable restart, seed replacement or index write.
    costs: Charge blob/payload extraction, parsing, labels/adjudication labor or inference, query compilation, private view construction, in-memory indexing, all scoring/rg calls, null/positive joins, bootstrap, checking, serialization, storage and peak memory. Human/inference work is separately reported from CPU; missing telemetry is unknown, never zero.
  stopping_rules:
    - Finish the complete frozen candidate/adjudication scope, three seed invocations and 2000 shared summary resamples; no adaptive added corpus, queries, null draws or tuning.
    - Corpus payload/admission failure or fewer than 50 adjudicated relevant candidate pairs produces insufficient-data/inconclusive study reporting with exact exclusions, not hypothesis rejection or a parked goal. Missing/unreplayable queries and unresolved references remain census strata; an empty matched subset makes only that comparison NA.
    - A failed mechanical control, unauthorized label/query access, deterministic-output mismatch or corrupted binding invalidates the evaluator; retain prior outputs and mark all omitted stages explicitly until additive repair/readmission.
    - Watchdog or memory protection preserves partial work and requires a concrete next disposition; it is not a mathematical or security conclusion and never requires renewed routine user budget approval.
  invalidation_rules:
    - Test-set parameter/query tuning, target-derived query terms, hidden schema repairs, wrong corpus bytes, index mutation, arbitrary shell execution, unreported exclusions or failed mechanical controls invalidate the affected comparison.
    - Missing or disputed relevance labels, incomplete corpus, unavailable command semantics or fewer than 50 adjudicated relevant candidate pairs are incomplete-data outcomes, not retrieval misses or evidence against cryptography; report the precise affected study/comparison scope.
    - Failure of a descriptive null margin does not invalidate raw measured recall; nonpositive sparse delta does not invalidate a sound evaluator.
  success_criterion: >-
    A valid complete study inventories the whole pinned corpus, adjudicates all
    direct-reference candidates and sampled null pairs, admits at least 50
    adjudicated relevant candidate pairs with proposal count disclosed, passes every mechanical and
    integrity control, completes all three invocations with identical
    deterministic retrieval bytes, and reports every frozen metric/stratum.
    Finite positive signal requires the declared null margins and a strictly
    positive matched-pair sparse delta; valid completion does not require a
    favorable result. Recall below 0.5 remains a directional report only.
  falsification_criterion: >-
    With controls and complete bindings valid, nonpositive matched sparse
    delta refutes the finite remedy prediction on this pair set; failure of
    either null-margin inequality fails that descriptive separation target.
    Neither implies chance retrieval, a global recall bound, an acquisition
    bottleneck, a novelty verdict or permission to rewrite other proposals.
    Data/control/infrastructure defects have their separate outcomes.
  outcomes:
    positive: Complete valid data meet the specified finite null separation and positive matched sparse delta; any claim awaits independent review.
    negative: Complete valid data fail one or more finite predictions; publish the exact signed delta/margins and all raw recall rather than a global verdict.
    mixed: Report directional recall, every seed margin, exact-null margin and sparse delta independently; no averaging away a failed or missing condition.
    inconclusive: Insufficient pairs, corpus/label/query incompleteness, unavailable runtime or unresolved numeric/binding question; record exact remaining work.
    invalid: Mechanical evaluator, leakage, access, corpus-binding or deterministic-integrity failure; preserve artifacts and localize the defect.
