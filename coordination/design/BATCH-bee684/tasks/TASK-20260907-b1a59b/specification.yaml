  interpretation_limits:
    - Known-reference corpus hit rate is not recall of all truly relevant literature; author-known selection can be optimistic without being an upper-bound theorem.
    - Corpus record relevance does not certify external paper truth, full source reading or novelty_status.
    - A failed null margin is a finite descriptive separation failure, not proof of chance or invalidation of raw recall; high recall does not isolate acquisition as the sole constraint.
    - The historical incumbent benchmark and historical corpus counts are reported context, not current rerun observations or a replacement for this different-label study.
    - No cryptographic performance, security, asymptotic, goal-closure or global proposal-rewrite conclusion follows from this tooling calibration.
