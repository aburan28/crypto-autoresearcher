    physical resource or schedule target.
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  joints:
    - joint: canonical_locator_and_target_resolution_v2_4
      assigned_to: TASK-20260908-0a9470
      scope: >-
        Typed CPU/IO locator normalization, trace/representation alias closure,
        registry-hash target resolution, and retention of direct timeout,
        launch-owner, and sealed-slot protections.
      attack_plan: >-
        Construct two spellings for one cpu.stat usage_usec counter; two device
        or field spellings for one io.stat counter; two trace/source labels for
        one locator; and two separately published target_id spellings for one
        schedule node without a sum. Also test the direct root-B timeout,
        different-launch owner, sealed-slot omission, and overlapping wall
        split constructions. Identify exact typed-schema, hash, resolver,
        inventory, or equality rules that reject each, or give an accepted
        source-level mutation and the missing separator.
      breaking_artifact: >-
        A source-level construction accepted by all stated v2.4 rules that maps
        one physical counter or one sealed target to different accounting
        identities, or defeats a retained direct control.
  blindness:
    mutual: true
    lifted_for: []
    rationale: The fresh reviewer reads only the pinned source packet, own handoff, and this plan.
  proves_too_much:
    objects:
      - V2.3, whose tuple identity permits unnormalized counter_namespace values.
      - V2.3, whose textual target_id lacks a sealed schedule-target resolver.
    failure_signature: >-
      The spelling-alias mutations must remain admitted by v2.3 and be rejected
      by v2.4. A v2.3 rejection proves too much; a v2.4 acceptance is breaks.
    assigned_to: TASK-20260908-0a9470
  blind_rederivation:
    required: false
    rationale: This joint has no load-bearing numerical quantity; it tests typed identity and resolver definitions.
  outcome_rule: >-
    Any holds verdict is limited to prospective source definitions and cannot
    approve implementation or execution. A breaks or inconclusive verdict
    requires another additive correction and keeps both authorities off.
