review_plan:
  id: sdeg_counter_v2_3_custody_alias_closure
  experiment_id: EXP-ECDLP-ac7e8b
  claim_under_review: >-
    The prospective v2.3 custody definitions reject the two v2.2 alias
    constructions while retaining the direct timeout, launch-owner, and sealed
    slot protections. This is neither implementation nor execution evidence and
    makes no correctness, cost, or cryptanalytic claim.
  amendment: experiments/EXP-ECDLP-ac7e8b/amendments/v2_3_custody_alias_closure.yaml
  amendment_sha256: 8028fb8f49825f71414a7e2a58519264182f5582cb7856228777cc7e984ebcb5
  correction_record: ledger/corrections/CORR-20260908-f973b3.yaml
  source_snapshot:
    commit: 4917987f51ff3df4251de6304e8351fa1df7834c
    paths:
      - experiments/EXP-ECDLP-ac7e8b/amendments/v1_to_v2_hardening_protocol.yaml
      - experiments/EXP-ECDLP-ac7e8b/amendments/v2_1_lifecycle_custody.yaml
      - experiments/EXP-ECDLP-ac7e8b/amendments/v2_2_custody_replay_closure.yaml
      - experiments/EXP-ECDLP-ac7e8b/amendments/v2_3_custody_alias_closure.yaml
      - coordination/design/BATCH-28dddb/protocol-appendix.yaml
      - ledger/corrections/CORR-20260908-f973b3.yaml
  coordinator_prior: >-
    V2.3 appears to close the omitted canonical-identity bindings, but a fresh
    review may find an alias path through trace encoding, a scope-target
    mismatch, an incomplete inventory, or a sum rule that only rejects the
    supplied example rather than the mutation family.
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  joints:
    - joint: custody_alias_and_replay_closure_v2_3
      assigned_to: TASK-20260908-b2abee
      scope: >-
        Canonical physical CPU/IO counter identity, complete interval partition,
        canonical stage/campaign reporting-scope identity, complete common-clock
        wall inventory, and retention of the three direct v2.2 protections.
      attack_plan: >-
        First run a root-B timeout receipt against root-A authority, reuse a
        rank-owner label from another launch, and omit a sealed accepted EC
        slot. Then represent one physical launch/cgroup counter by two source
        IDs and two differently serialized trace digests; finally put two
        overlapping common-clock intervals for one target under two scope IDs
        and try to sum their local unions. For every construction, identify the
        exact v2.3 binding/equality/complete-inventory rule that rejects it, or
        provide a source-level accepting construction and the missing rule.
      breaking_artifact: >-
        A concrete source-level mutation accepted by every stated v2.3 rule,
        including the exact noncanonical identity, inventory, or sum path.
  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      The reviewer reads the pinned source packet, own handoff, and this plan;
      it must not read any prior review report.
  proves_too_much:
    objects:
      - The v2.2 CPU/IO rule, which treats two unbound counter_source_id labels as separate local partitions.
      - The v2.2 wall rule, which permits two unbound reporting_scope_id local unions to be added at a higher layer.
    failure_signature: >-
      Each alias mutation must remain admitted by the v2.2 definitions yet be
      rejected by v2.3. A claimed v2.2 rejection proves too much; a v2.3
      acceptance requires a breaks verdict.
    assigned_to: TASK-20260908-b2abee
  blind_rederivation:
    required: false
    rationale: >-
      The joint contains no numerical result. Independent construction of the
      adversarial source records tests the defined identity and set rules.
  outcome_rule: >-
    A holds verdict is limited to the prospective source definitions and cannot
    approve implementation or execution. A breaks or inconclusive verdict keeps
    both authorities off and requires a further additive correction.
