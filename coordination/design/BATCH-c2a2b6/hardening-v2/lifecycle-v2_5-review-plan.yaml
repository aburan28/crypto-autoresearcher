  coordinator_prior:
    recorded_before_reviewers: true
    expectation: >-
      Fixing the schema version, exact key sets, and duplicate semantic keys
      should reject the two v2.4 constructions. The main residual risk is that
      the schedule inventory permits an underspecified component/phase tuple,
      a campaign/root alias, or a duplicate resolver path; the review must
      either find a concrete admitted construction or identify the rule that
      rejects it.
    does_not_assume: >-
      A written amendment, a successful schema parse, or a reviewer agreement
      is not an implementation pass, measurement, resource result,
      cryptanalytic conclusion, or authorization.
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  blindness:
    reviewers_may_read: [the pinned source packet, this review plan, own task handoff]
    reviewers_may_not_read: [all earlier review reports, all sibling reports]
    lifted_for: []
  joints:
    - task_id: TASK-20260908-5f236e
      assigned_to: TASK-20260908-5f236e
      role: red-team
      joint: semantic_counter_and_schedule_registry_closure_v2_5
      scope: >-
        Closed CPU/IO locator schemas, physical-counter semantic-key registry
        uniqueness, closed schedule-node keys, complete schedule inventory,
        and bijective stage-target resolution; also retain the direct v2.4
        display-alias protections.
      attack_plan: >-
        Construct (1) two CPU locator entries differing only in schema_version,
        (2) two entries where one adds a nonsemantic metadata member, (3) two
        distinct entry byte strings that derive one physical-counter semantic
        key, (4) two stage entries whose textual node aliases point to one
        campaign/root/component/phase tuple, and (5) two stage entries that
        resolve to one declared inventory key without adding their totals.
        Check the exact validation/rejection path for each. Then re-run the
        v2.4 CPU/IO display and target_id display constructions and determine
        whether they remain non-identities. Test an invalid component ordinal,
        a noncanonical campaign form, and an inventory row whose appendix hash
        differs, since acceptance of any one would leave the resolver open.
      known_false_controls:
        - v2_4_schema_version_alias_admitted
        - v2_4_schedule_node_textual_alias_admitted
        - direct_cpu_or_io_display_alias
        - direct_target_id_display_alias_without_sum
        - missing_schedule_inventory_key
  proves_too_much:
    objects:
      - V2.4 locator registry, which admits a different schema_version byte string for the same physical counter.
      - V2.4 stage registry, which has no source-defined resolver for a schedule-node identifier.
    failure_signature: >-
      The two semantic-alias constructions must remain possible under the v2.4
      text but must be rejected by the exact v2.5 source rules. A v2.4
      rejection proves too much; a v2.5 acceptance breaks this joint.
    assigned_to: TASK-20260908-5f236e
  blind_rederivation:
    required: false
    rationale: This joint has no load-bearing numerical quantity; it checks identity and resolver definitions.
  outcome_rule: >-
    Any holds verdict is limited to prospective source definitions and cannot
    approve implementation or execution. A breaks or inconclusive verdict
    requires another additive correction and keeps both authorities off.
