  coordinator_prior:
    recorded_before_reviewers: true
    expectation: >-
      The explicit 0..24 calibrator table and fixed one- and two-item family
      maps should remove the alternative ordinal-base construction. The main
      residual risk is a phase rule that is not actually tied to a root's mode,
      a component map whose named calibration row does not match the appendix,
      or a validator that can accept an extra inventory tuple.
    does_not_assume: >-
      A written amendment, schema parse, or review agreement is not an
      implementation pass, measurement, resource result, cryptanalytic
      conclusion, or authorization.
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  blindness:
    reviewers_may_read: [the pinned source packet, this review plan, own task handoff]
    reviewers_may_not_read: [all earlier review reports, all sibling reports]
    lifted_for: []
  joints:
    - task_id: TASK-20260908-875528
      assigned_to: TASK-20260908-875528
      role: validator
      joint: component_ordinal_and_phase_inventory_closure_v2_6
      scope: >-
        The component family-to-ordinal map, calibrator program/multiplier
        bindings, root-mode phase eligibility, and exact inventory construction
        required before v2.5 schedule-node/target hashes.
      attack_plan: >-
        Derive all 25 calibrator entries from the appendix's program and
        multiplier order, then try ordinal 25, an alternate 1..25 base, a
        program/multiplier mismatch, a duplicate descriptor, an omitted or
        extra tuple, profile for a counting root, and admission as a
        relation_collection node. For each, identify the exact v2.6 rule that
        rejects it or supply an admitted construction. Check that a legitimate
        timing-root profile and all 30 mapped components retain a unique route.
      known_false_controls:
        - alternate_calibrator_ordinal_base
        - ordinal_25_calibrator
        - program_multiplier_map_mismatch
        - profile_for_counting_root
        - admission_phase_schedule_node
        - omitted_or_extra_component_tuple
  proves_too_much:
    objects:
      - V2.5 component inventory, which specifies family counts but not ordinal sets or calibration-row mappings.
    failure_signature: >-
      The alternate ordinal-base construction must remain possible under v2.5
      but be rejected by v2.6. A v2.5 rejection proves too much; a v2.6
      acceptance breaks this joint.
    assigned_to: TASK-20260908-875528
  blind_rederivation:
    required: false
    rationale: The load-bearing content is a finite identity map, not a numerical result.
  outcome_rule: >-
    Any holds verdict is limited to prospective source definitions and cannot
    approve implementation or execution. A breaks or inconclusive verdict
    requires another additive correction and keeps both authorities off.
