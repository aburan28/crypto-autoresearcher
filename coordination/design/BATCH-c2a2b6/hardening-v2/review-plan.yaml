review_plan:
  id: sdeg_counter_v2_hardening
  experiment_id: EXP-ECDLP-ac7e8b
  amendment: experiments/EXP-ECDLP-ac7e8b/amendments/v1_to_v2_hardening_protocol.yaml
  amendment_sha256: 955d260b9264f98b0439b9a28fa844644fa2f372c8ddb8d75b2803ea581db66a
  source_snapshot:
    commit: df391d3a02
    paths:
      - experiments/EXP-ECDLP-ac7e8b/specification.yaml
      - experiments/EXP-ECDLP-ac7e8b/amendments/v1_to_v2_hardening_protocol.yaml
      - coordination/design/BATCH-28dddb/protocol-appendix.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-012/certificate_contract.yaml
      - ledger/decisions/DEC-20260908-ec4a02.yaml
    sha256:
      protocol_appendix: ac0b4b83fe32bd949d710a203bf1dd4248557f64dcdd381edcec65cd236e37b0
      certificate_contract: 1ca204a0e16e88012892a0867aab5ea82d388fdfa1b0474938a0e2c8cffd8d9f
  purpose: >-
    Fresh joint-scoped hardening review of the v2 repair contract before any
    implementation decision. This round reviews prospective definitions only.
  coordinator_prior:
    recorded_before_reviewers: true
    expectation: >-
      The amendment addresses each named v1 break, but likely residual failures
      are a hidden cross-mode pairing field, a receipt-state transition that
      permits a fork, or a certificate row that does not match its declared alias.
    does_not_assume: >-
      A complete-looking amendment, an admission fixture, or reviewer agreement
      is not a run, implementation pass, scientific conclusion, or authorization.
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  blindness:
    reviewers_may_read: [the pinned source packet, their own task handoff]
    reviewers_may_not_read: sibling reports or prior reports except DEC-20260908-ec4a02's summarized defects
    lifted_for: []
  joints:
    - task_id: TASK-20260908-8c30c7
      role: validator
      joint: paired_measurement_and_statistics_v2
      scope: pair/profile IDs, T_primary/W_primary, exact tau, completeness, retained edges, bootstrap, load inventory and drift.
      attack_plan: >-
        Try to construct duplicate or cross-hash joins, an undefined bootstrap
        survivor interval, a missing-size survivor fit, and an equality decided by
        binary64. Re-derive the v2 target inventories and examine whether a profile
        can enter a primary estimator.
      known_false_controls: [tiny_significant_practical_agreement, equality_at_tau, missing_profile, one_undefined_bootstrap]
    - task_id: TASK-20260908-b528ba
      role: red-team
      joint: lifecycle_cost_and_terminal_authority_v2
      scope: worker/reap topology, receipt chains, failure matrix, terminal mapping, rank state and shared ownership.
      attack_plan: >-
        Trace a normal timing root, a checkpoint/resume, and a failed-first-
        calibration campaign. Attempt to create a seventh process, fork a segment,
        double-count a shared object, or convert a machine checkpoint into a campaign
        cancellation.
      known_false_controls: [duplicate_final, checkpoint_as_final, changed_attempt_on_resume, unowned_rank_state, false_not_activated]
    - task_id: TASK-20260908-2523d5
      role: validator
      joint: certificate_contract_and_alias_controls_v2
      scope: complete imported certificate contract and deterministic F5 signed/alias/cancellation controls.
      attack_plan: >-
        Read the entire pinned contract, derive each listed F5 row modulo 7 from
        point encodings, and challenge every mutation's specified failure route.
        Check that the amendment does not represent the controls as measurements.
      known_false_controls: [negative_signed_id_replaced, duplicate_target_encoding, omitted_alias_subtraction]
  outcome_rules:
    - Each reviewer reports holds, breaks, or inconclusive only for its assigned joint.
    - Any breaks requires an additive correction; no reviewer approves implementation.
    - A holds result is usable only with an independently verifiable task/session provenance record.
    - Coordinator alone may later synthesize the reports and change an experiment state.
