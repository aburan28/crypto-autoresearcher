red_team_report:
  task_id: TASK-20260908-77c865
  scope:
    experiment_id: EXP-ECDLP-ac7e8b
    joint_owned: lifecycle_and_cost_custody
    review_question: >-
      Whether the prospective v2.1 registry, terminal-authority, rank-state,
      and shared-cost definitions make the specified lifecycle and cost-custody
      mutations mechanically observable before any implementation or execution.
    boundary: >-
      This is a source-definition review of the committed packet. It assesses
      only the named prospective acceptance rules and does not assess an
      implementation, runtime, fixture, receipt, experiment result, or
      cryptanalytic claim.
  source_snapshot_commit:
    review_packet: 0c319e0c1c95aeee4cc3b0d763fc382d780c2480
    plan_declared_technical_source_snapshot: 9c61f35aea
    technical_source_comparison: >-
      The three permitted technical sources have no name-status diff between
      the plan-declared snapshot and the committed review packet.
