  independent_derivation:
    appendix_calibration_order:
      programs: [schoolbook, square, inverse, add, division_neg_power]
      multipliers: [1, 2, 4, 8, 16]
      formula: 'ordinal = 5 * program_index + multiplier_index'
    calibrator_map:
      - {ordinal: 0, program_id: schoolbook, multiplier: 1}
      - {ordinal: 1, program_id: schoolbook, multiplier: 2}
      - {ordinal: 2, program_id: schoolbook, multiplier: 4}
