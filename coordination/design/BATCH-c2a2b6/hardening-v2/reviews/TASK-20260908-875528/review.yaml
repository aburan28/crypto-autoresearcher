    - name: inventory_target_bijection_preservation
      result: passed
      evidence: >-
        The v2.5 preserved validation requires a complete, duplicate-free,
        canonical inventory and exactly one target-registry resolution for a
        schedule-node key; v2.6 supplies the previously missing finite domain.
  verdict: holds
  conclusion: >-
