      - {ordinal: 11, program_id: inverse, multiplier: 2}
      - {ordinal: 12, program_id: inverse, multiplier: 4}
      - {ordinal: 13, program_id: inverse, multiplier: 8}
      - {ordinal: 14, program_id: inverse, multiplier: 16}
      - {ordinal: 15, program_id: add, multiplier: 1}
      - {ordinal: 16, program_id: add, multiplier: 2}
      - {ordinal: 17, program_id: add, multiplier: 4}
      - {ordinal: 18, program_id: add, multiplier: 8}
      - {ordinal: 19, program_id: add, multiplier: 16}
      - {ordinal: 20, program_id: division_neg_power, multiplier: 1}
      - {ordinal: 21, program_id: division_neg_power, multiplier: 2}
      - {ordinal: 22, program_id: division_neg_power, multiplier: 4}
      - {ordinal: 23, program_id: division_neg_power, multiplier: 8}
      - {ordinal: 24, program_id: division_neg_power, multiplier: 16}
    comparison_with_v2_6: >-
      All 25 independently derived entries agree with the v2.6 map, including
      its zero base, program order, and multiplier order. The other mapped
      families contribute exactly one planted-positive descriptor, two main
      decomposition descriptors, and two baseline descriptors. Thus the
      component universe has 25 + 1 + 2 + 2 = 30 descriptors.
    root_mode_derivation: >-
      For each of the 200 sealed (cell,j) campaigns, the appendix rotates
      [0,1,2,4] left by j mod 4 and places COUNTING then TIMING at each load.
      Therefore root ordinals 0,2,4,6 are counting and 1,3,5,7 are timing;
      the associated load is the corresponding rotated-list item. This is a
      unique mode and load for every root ordinal in every campaign.
    permitted_route_counts: >-
      A counting root has all 30 descriptors in warmup and primary only, hence
      60 source-defined schedule tuples. A timing root has those 60 tuples plus
      its 30 profile tuples, hence 90. With four roots of each mode in a
      campaign, the complete inventory has 4*60 + 4*90 = 600 tuples per
      campaign and 200*600 = 120000 tuples overall. Every tuple has a unique
      route through campaign_id, root_ordinal, stage_id, closed {family,
      ordinal} descriptor, and phase.
  construction_attacks:
    - name: alternate_calibrator_ordinal_base
      construction: >-
        Enumerate calibrators as ordinals 1 through 25, preserving the same
        program and multiplier order.
      rejection_path: >-
        V2.6 fixes the calibrator range to 0 through 24 and requires the exact
        Cartesian inventory over every permitted descriptor. Ordinal 25 is
        outside the map, while required descriptor {family: calibrator,
        ordinal: 0} is missing. The required inventory validation rejects both
        conditions before inventory_sha256 or a target-registry hash.
      result: rejected
    - name: ordinal_25_calibrator
      construction: >-
        Submit canonical descriptor {family: calibrator, ordinal: 25} for any
        otherwise valid campaign, root, and warmup phase.
      rejection_path: >-
        The descriptor is outside v2.6 family_to_ordinal_map.calibrator's
        declared 0..24 map. The required validation explicitly rejects an
        ordinal outside that map before hashing.
      result: rejected
    - name: program_multiplier_map_mismatch
      construction: >-
        Claim schoolbook with multiplier 1 for calibrator descriptor
        {family: calibrator, ordinal: 5}, whose source-defined map entry is
        square with multiplier 1.
      rejection_path: >-
        The closed descriptor may carry only family and ordinal, so inserting
        program_id or multiplier into it violates its exact-key rule. Where
        family-specific named values are presented for validation, the required
        v2.6 rule resolves ordinal 5 to the unique square/multiplier-1 map row
        and requires equality to that row. A schoolbook claim cannot be a
        second identity for descriptor 5 or an accepted matching row.
      result: rejected
    - name: duplicate_component_descriptor
      construction: >-
        Insert two inventory rows with the same campaign, root, stage,
        {family: baseline, ordinal: 0} descriptor, and primary phase.
      rejection_path: >-
        The rows have the same normalized schedule_node_key and canonical hash.
        V2.5's preserved sealed inventory validation rejects duplicate key
        hashes and duplicate normalized tuples; v2.6 also requires exactly one
        row for every permitted Cartesian tuple.
      result: rejected
    - name: omitted_or_extra_component_tuple
      construction: >-
        Omit the timing-root profile tuple for {family: main_decomposition,
        ordinal: 1}, then separately add an otherwise unmatched tuple such as
        {family: baseline, ordinal: 2}.
      rejection_path: >-
        The first construction violates exact Cartesian completeness. The
        second is outside the two-entry baseline map and is an extra tuple.
        Required inventory validation rejects each before hashing; no target
        registry may resolve either construction.
      result: rejected
    - name: profile_for_counting_root
      construction: >-
        Place any valid descriptor, for example {family: planted_positive,
        ordinal: 0}, in profile phase on a counting root such as ordinal 0.
      rejection_path: >-
        The appendix's rotated COUNTING-then-TIMING schedule resolves root 0
        to counting, and v2.6 permits profile if and only if the resolved root
        mode is timing. It expressly forbids a profile node for a counting root.
      result: rejected
    - name: admission_phase_schedule_node
      construction: >-
        Add phase admission to a relation_collection schedule node with an
        otherwise valid component and root.
      rejection_path: >-
        V2.6 fixes relation_collection phases to warmup, primary, and profile,
        declares admission outside this node class, and forbids admission rows
        in both sealed_schedule_inventory and target-registry stage entries.
      result: rejected
    - name: legitimate_timing_profile_and_full_component_family
      construction: >-
        For a timing root, construct all 25 calibrators, planted_positive-0,
        main_decomposition-0 and -1, and baseline-0 and -1 in each of warmup,
        primary, and profile.
      rejection_path: >-
        No rejection applies. The root resolves to timing, every mapped
        descriptor is eligible for all three phases, and the 30 descriptors
        are unique because family participates in the closed descriptor. Each
        of the 90 tuples has one canonical schedule-node route.
      result: admitted_once
  proves_too_much_control:
    object: v2_5_component_inventory
    construction: >-
      Use the alternate 1..25 calibrator ordinal base while leaving the v2.5
      family count of 25 intact.
    v2_5_result: >-
      Not rejected by source definition: v2.5 required a family-specific
      inventory supposedly declared by appendix components_per_job, but that
      appendix specified only counts, not ordinal sets or the calibrator
      program/multiplier map. This is the documented ambiguity in
      CORR-20260908-e3815f.
    v2_6_result: >-
      Rejected by the fixed 0..24 map and exact Cartesian construction, as in
      alternate_calibrator_ordinal_base above.
    result: passed
  control_checks:
    - name: component_descriptor_closure
