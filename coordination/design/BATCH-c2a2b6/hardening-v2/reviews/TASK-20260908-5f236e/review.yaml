  verdict: breaks
  verdict_scope: >-
    The v2.5 counter-locator definitions source-reject the specified v2.4
    counter and display aliases. The schedule definition still cannot reject
    an invalid component ordinal or choose one unique complete component
    inventory from the frozen appendix. This is a prospective source-contract
    finding only; it is not an implementation, execution, measurement,
    resource, cryptanalytic, or authorization result.

