        sha256: e3c5cc9f212c70fc87156f243c13919e68dbd96955b47092cc59ae5eff391eb8
      - path: experiments/EXP-ECDLP-ac7e8b/amendments/v2_2_custody_replay_closure.yaml
        sha256: 256b92d1df1b74058f553f42024f34654c066da6ee8709024cae8fb80a0a1933
      - path: experiments/EXP-ECDLP-ac7e8b/amendments/v2_3_custody_alias_closure.yaml
        sha256: 8028fb8f49825f71414a7e2a58519264182f5582cb7856228777cc7e984ebcb5
      - path: experiments/EXP-ECDLP-ac7e8b/amendments/v2_4_canonical_locator_closure.yaml
        sha256: 0d10e48fb6719fe8c9ec823f4eae2366ef64686e7fd182ab90057b68b50d1aa6
