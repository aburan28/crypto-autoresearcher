red_team_report:
  task_id: TASK-20260908-0a9470
  review_plan: sdeg_counter_v2_4_canonical_locator_closure
  experiment_id: EXP-ECDLP-ac7e8b
  claim_under_review: >-
    The prospective v2.4 source definitions canonically resolve CPU/IO counters
    and schedule/campaign targets, reject textual spelling aliases, and retain
    the listed direct custody protections. This review concerns source text
    only; it makes no implementation, execution, resource, or scientific claim.
  scientific_runs: 0
  scope:
    joint: canonical_locator_and_target_resolution_v2_4
    joint_verdict: breaks
    verdict_meaning: >-
      The prescribed direct spelling and retained-custody constructions are
      rejected by stated v2.4 or inherited v2.2/v2.3 rules. However, the v2.4
      counter-locator and schedule-target registry objects are not closed typed
      schemas and do not specify a source-checkable semantic uniqueness
      projection. Consequently, two registry-entry byte strings can denote the
      same physical counter or schedule node while producing different hashes.
      The claim that the source definitions themselves reject every textual
      alias therefore breaks at this prospective source boundary.
  source_integrity:
    result: holds
    source_snapshot_commit: 2a67e9f58a93a3ba9dbc131408d261726b4bfe86
    worktree_head_at_read: 9d91ce1c0db70d9cb9ec39af436a0266db758783
    working_tree_clean_before_report_write: true
    amendment_sha256_declared_and_recomputed: 0d10e48fb6719fe8c9ec823f4eae2366ef64686e7fd182ab90057b68b50d1aa6
    pinned_paths_byte_match_snapshot:
