worked_derivations:
  group_and_coefficient_field:
    statement: >-
      The listed affine points are consistent with E/F5: y^2 = x^3 + 2x + 1.
      P=(0,1) doubles to 2P=(1,3), which doubles to 4P=(3,2); negation gives
      -P=(0,4), -2P=(1,2), and -4P=(3,3). Counting the affine points gives
      six affine points plus O, so E(F5) has order 7 and P is a generator.
      Thus the row coefficients are correctly reduced in F7.
    coordinate_checks:
      - '2P: lambda=(3*0^2+2)/(2*1)=1 mod 5, hence (1,3).'
      - '4P: lambda=(3*1^2+2)/(2*3)=0 mod 5, hence (3,2).'
      - 'Negation preserves x and maps y to -y mod 5, yielding C001, C002, and C005.'
    column_scalar_map:
      C000: P
      C001: 6P
      C002: 5P
      C003: 2P
      C004: 4P
      C005: 3P
  f5_rows_mod_7:
    derivation_rule: >-
      For ordered column j, derive a_j as the multiplicity of j in the
      summand IDs minus one if j is the target ID, then reduce modulo 7. This
      is the exact rule in the imported contract; the resulting point-weighted
      sum must be O independently of the declared row.
    cases:
    - id: negative_summand_positive_target_alias
      relation: 'P = 2P + (-P)'
      target_and_summands: 'target C000; summands C003,C001'
      coefficient_calculation: 'C000: -1=6; C001: 1; C003: 1; all other columns: 0.'
      independently_derived_row_mod_7: [6, 1, 0, 1, 0, 0]
      group_sum_check: '6P + (-P) + 2P = 6P + 6P + 2P = 14P = O.'
    - id: negative_target_alias
      relation: '-P = 2P + 4P'
      target_and_summands: 'target C001; summands C003,C004'
      coefficient_calculation: 'C001: -1=6; C003: 1; C004: 1; all other columns: 0.'
      independently_derived_row_mod_7: [0, 6, 0, 1, 1, 0]
      group_sum_check: '6(-P) + 2P + 4P = P + 6P = O.'
    - id: target_summand_cancellation
      relation: '2P = 2P + P + (-P)'
      target_and_summands: 'target C003; summands C003,C000,C001'
      coefficient_calculation: 'C003: 1-1=0; C000: 1; C001: 1; all other columns: 0.'
      independently_derived_row_mod_7: [1, 1, 0, 0, 0, 0]
      group_sum_check: 'P + (-P) = O; the target/summand C003 occurrence cancels exactly.'
  mutation_challenges:
    - mutation: replace_negative_signed_ID_with_positive_partner
      challenge: >-
        Replacing C001=-P with C000=P in the positive-target case makes the
        purported right side 2P+P=3P rather than P. If the old row is retained,
        the point-weighted sum is 6P+P+2P=2P, not O; if a row is recomputed,
        it differs from the declared signed-column relation. The specified
        SIGNED_COLUMN_OR_GROUP_SUM_MISMATCH route is therefore decisive.
    - mutation: add_duplicate_target_encoding_under_new_ID
      challenge: >-
        A new column ID carrying P duplicates C000's canonical target encoding.
        It changes the ordered column schema and can otherwise create an alias
        that splits one group element across matrix coordinates. The imported
        v1 contract binds schema bytes, while the v2 amendment expressly adds
        the stronger admission requirement COLUMN_SCHEMA_DUPLICATE_ENCODING.
        A post-seal insertion also fails the sealed schema binding; a pre-seal
        duplicate is rejected by the stated v2 deterministic control.
    - mutation: omit_aliased_target_subtraction
      challenge: >-
        In the cancellation case, omission leaves the summand multiplicities
        [1,1,0,1,0,0], whose group sum is 2P rather than O, instead of the
        independently derived [1,1,0,0,0,0]. The contract's independent
        row/equation comparison forces the certificate invalid with zero rank
        credit; v2 names the early failure route CERTIFICATE_ROW_MISMATCH.
findings:
  - id: full_contract_binding_holds
    result: >-
      holds. The review plan's certificate SHA equals the hash of the complete
      imported contract. The appendix makes that full byte-bound contract
      normative, and the v2 amendment repeats the exact path and SHA and
      expressly imports literal hash domains, required fields, JCS/decimal
      canonicalization, terminal vocabulary, ownership fields, and all nine
      inherited mutation gates. This is a full-contract binding, not a digest-only reference.
  - id: deterministic_f5_rows_hold
    result: >-
      holds. Each independently derived row and its point-weighted group sum
      matches the corresponding v2 declared F5 row modulo 7. The third case
      specifically exercises cancellation of a target that is also a summand.
  - id: deterministic_mutation_routes_hold
    result: >-
      holds at the prospective contract level. The negative-ID substitution,
      duplicate encoding, and omitted target subtraction each have a stated
      deterministic rejection route. Duplicate encoding is a v2-added
      admission condition in addition to the imported schema hash binding.
  - id: controls_are_not_measurements
    result: >-
      holds. The amendment labels the F5 controls admission-only, says they do
      not alter the 20 random instances or create a scientific observation, and
      places them in future implementation admission. The specification and
      Coordinator decision preserve the same separation.
