  target_ids: [H-ECDLP-004445, EXP-ECDLP-ac7e8b, EV-ECDLP-2484b5, TASK-20260908-ece27b, TASK-20260908-40e722, TASK-20260908-020fc1, TASK-20260908-69a17c, TASK-20260908-ab0e84]
  rationale:
    - The arithmetic/counter joint holds on the complete source-bound protocol, and the blind report remains preserved with its narrower packet boundary.
    - The statistics joint has blocking pre-implementation ambiguities around pair identities, estimator composition, exact comparisons, panel eligibility, undefined resamples, load inventory, and drift missingness.
    - The resource/lifecycle joint has blocking gaps in worker multiplicity, receipt chains, stop-gate outputs, rank ownership, shared cost ownership, and terminal authority.
    - The algebra joint requires exact imported certificate-contract bytes in a fresh hardening packet and deterministic negative/aliased target-column controls.
    - Standing user authorization permits future design and execution once the contract is complete, but it does not waive these review and amendment gates.
  official_state_changes: []
  official_state_change_note: >-
    H-ECDLP-004445 remains proposed; EXP-ECDLP-ac7e8b remains review_required,
    approved_by null, implementation_authorized false, and scientific_execution_authorized
    false. GOAL-SDEG-001 remains active. This decision changes no scientific,
    hypothesis, goal-completion, or execution state.
  amendment_required:
    version_from: reviewed frozen successor at ecc80e8b915bc4b1acf1bac58d138a1a190eb275
    scope:
      - Define immutable pair_id/profile_audit_id, exact T_primary/W_primary stage and ownership interfaces, tau=1/20 rational comparisons, profile and missingness taxonomy, retained-edge semantics, bootstrap undefined disposition, exact load targets, and drift eligibility.
      - Define worker-spawn/reap units, receipt-kind and segment-chain schema, terminal authority mapping, administrative start-and-abort matrix, rank-state ownership, and unique shared setup/burner/supervisor/analysis cost owners.
      - Bind full certificate_contract.yaml bytes in the hardening packet and add fixed signed, target-alias, cancellation, duplicate-encoding, and negative-ID admission controls.
    constraints:
      - Preserve the reviewed frozen records and every report byte-identically; use an additive versioned amendment/successor.
      - Do not alter the 20 random scientific instances or recast admission controls as scientific observations.
      - Obtain fresh independent review of every changed joint before implementation approval.
  evidence_refs:
