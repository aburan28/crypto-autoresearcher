    - TASK-20260908-020fc1 returned breaks for paired_measurement_and_statistics. The complete schedule reconciles to 1600 roots, 48000 primary components, 48000 warmups, 24000 profiles, 32000 copied-log checks, 18 conservation cases, and 38 adapter evaluations, but canonical pair identity, estimator numerator/denominator, exact tolerance serialization, completeness/edge/undefined-bootstrap semantics, load-target inventory, and drift eligibility remain underdetermined.
