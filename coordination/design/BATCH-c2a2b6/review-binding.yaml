review_plan:
  id: sdeg_counter_full_protocol_v1_bound
  identifier_scope: Local review-plan label; concrete task IDs below are the allocated dispatch identities.
  status: bound_pending_runtime_and_blind_gates
  binding_task_id: TASK-20260908-f2c006
  binding_decision_id: DEC-20260908-3a33d8
  experiment_id: EXP-ECDLP-ac7e8b
  purpose: Independent protocol review required by RQ-SDEG-001 before implementation, not scientific measurement, hypothesis promotion or experiment execution approval.
  claim_under_review: Whether this exact frozen full S3/S4 counter protocol has coherent source-backed arithmetic, calibration, certificate/conservation, statistical and runtime definitions sufficient to permit later implementation under its specified gates.
  producer_snapshot:
    commit: ecc80e8b915bc4b1acf1bac58d138a1a190eb275
    original_plan: coordination/design/BATCH-28dddb/review-plan.yaml
    source_packet: coordination/design/BATCH-28dddb/source-packet.json
    original_design_decision: ledger/decisions/DEC-20260908-5f38fb.yaml
    paths:
      - ledger/hypotheses/H-ECDLP-004445.yaml
      - experiments/EXP-ECDLP-ac7e8b/specification.yaml
      - ledger/decisions/DEC-20260908-5f38fb.yaml
      - coordination/design/BATCH-28dddb/source-coverage.yaml
      - coordination/design/BATCH-28dddb/protocol-appendix.yaml
      - coordination/design/BATCH-28dddb/review-plan.yaml
      - coordination/design/BATCH-28dddb/readiness-map.md
    binding_scope: Parent verified these archived bytes remain unchanged. Review the snapshot and hash-bound source scope, not a moving branch or unrelated later scientific results.
  coordinator_prior:
    recorded_before_reviewers: This plan is written before any reviewer is assigned or run; actual snapshot chronology must be bound at dispatch, not fabricated here.
    expectation: The full design appears reviewable after repairing earlier omissions, but private-domain coverage, provenance-DAG equivalence, legal conservation witnesses and profile/count pairing are the likeliest places for a concrete revision. No expected scientific slope/drift outcome is asserted.
    does_not_assume: A design-ready document, source trace, named verifier or same-session readback is not independent PASS, implemented coverage, activated authority or a true hypothesis.
    preservation_note: The three preceding fields preserve the original archived prior verbatim. The original statement predates concrete task assignment; this later binding assigns tasks but supplies no retrospective runtime/review attestation. Parent reports no independent review has run.
  joints:
    - joint: arithmetic_and_counter_coverage
      assigned_to: TASK-20260908-40e722
      scope: Coefficient kernel, selected SymPy callgraph/backend, mixed-int/power/division routes, all calibrators and19adapter admission cases.
      attack_plan: First independently derive typed counts from the blind definitions below. Then trace every known source bypass and new/from_dict path, test the proposed event semantics on paper against actual method dispatch, and identify any conversion/inherited method that can escape the kernel or change solver behavior.
      where_coordinator_thinks_it_breaks: A direct integer or native-domain operation bypasses declared methods, reverse division is double charged, or exact ring.rem/monic expectations omit a call.
      sequencing: The blind first phase is TASK-20260908-ece27b. This full joint resumes that same verified session only after the blind report is archived and a task-specific continuation receipt binds this task to it.
    - joint: algebra_and_legal_certificates
      assigned_to: TASK-20260908-ab0e84
      scope: Ordinary fixtures, subgroup/lifts, full S3/S4/Bareiss construction, tracked Gröbner derivations, independent checking, signed columns, planted/random controls and legal wrong-field rank.
      attack_plan: Independently derive the small F5/ell7 point relations and row ranks from public definitions; check simultaneous S4 binding and Bareiss divisions, then challenge DAG ideal-inclusion logic and every signed/duplicate target-column case. Verify both S3 and S4 have genuine planted-positive solver controls.
      where_coordinator_thinks_it_breaks: A remainder term is falsely treated as an ideal element, a signed point is absent from columns, or a wrong-field matrix is not realizable by the supplied legal certificates.
    - joint: paired_measurement_and_statistics
      assigned_to: TASK-20260908-020fc1
      scope: Seed/count schedule,1600roots,48000primary/48000warmup/24000profile components, mode pairing, timing-mode boundary attribution, load/drift targets and2000paired resamples.
      attack_plan: Reconstruct cell/component totals independently and map each primary time to its paired count and separate profile audit. Derive mutually exclusive delta categories from bare tolerances, then challenge missing-size, undefined-bootstrap and sign-unspecified drift cases. Demonstrate why a tiny significant delta can be practical agreement.
      where_coordinator_thinks_it_breaks: A profile clock leaks into primary timing, a seeded pair is duplicated/resampled inconsistently, or an incomplete size enters a survivor-only fit.
    - joint: resources_lifecycle_and_authority
      assigned_to: TASK-20260908-69a17c
      role: red-team
      scope: Full resource stages, unique shared ownership, actual six-process topology, sealed schedules/receipts, calibration stop gate, checkpoints/terminal adapter and independent-review-before-implementation authority.
      attack_plan: Trace one full job and a failed-first-calibration campaign, accounting for every process, relation, shared object and receipt. Verify producer/verifier never overlap with four burners, rank costs are owned once, roots are not mislabeled unactivated, and inherited timeout/degree semantics are explicitly amended without goal cancellation.
      where_coordinator_thinks_it_breaks: A seventh process or duplicate rank/setup cost appears, a root lacks a final receipt, or a design output hash is mistaken for a completed activation gate.
  blindness:
    within_round: true
    mutual: true
    lifted_for: [TASK-20260908-40e722]
    rationale: Only the arithmetic full-joint continuation may read its own already archived blind derivation report. This permits no sibling report access and does not relax the blind phase's source restrictions. The other three joints remain mutually blind to every sibling report.
    access_attestation: Each task records exact source/report reads. Underspecification is a finding, not permission to expand the read packet or inspect another task's work.
  blind_rederivation:
    required: true
    assigned_to: TASK-20260908-ece27b
    archive_owner: TASK-20260908-1ca5e8
    quantity: Five calibration vector formulas and19adapter operation traces from the supplied bare definitions, parameters and upstream source excerpts, without producer expectations.
    packet: coordination/design/BATCH-c2a2b6/blind-packet.json
    permitted_reads:
      - coordination/design/BATCH-c2a2b6/blind-packet.json
      - ledger/handoffs/TASK-20260908-ece27b.yaml
      - AGENTS.md
      - agents/validator.md
    packet_scope: Kernel definitions, five program statements without expected totals,19adapter input operations without expected outputs/vectors, and actual upstream SymPy excerpts. Upstream library code is not producer instrumentation.
    blind_from:
      - ledger/hypotheses/H-ECDLP-004445.yaml
      - experiments/EXP-ECDLP-ac7e8b/specification.yaml
      - coordination/design/BATCH-28dddb/
      - experiments/EXP-ECDLP-ac7e8b/implementation/
      - coordination/design/BATCH-c2a2b6/reviews/
    additional_read_exclusions: Parent temporary expected tables, expected totals and control answers are excluded. During blind derivation, the reviews prefix excludes all sibling reports and any reading back of an already written own report. No external paths, producer history, tests or tools may expand the declared read scope.
    release_gate: TASK-20260908-1ca5e8 must complete the exact blind-report snapshot/archive and hash binding before TASK-20260908-40e722 sees full protocol expectations or continues. Preserve the original blind report immutably; later comparison adds a new report.
    unavailable_detail: A missing mathematical or source definition is recorded as a bounded finding without speculative completion or unauthorized reading.
  blind_transport:
    receipt_path: coordination/design/BATCH-c2a2b6/blind-transport.json
    receipt_publication_commit: 0ba2f6035f
    packet_directory: /Volumes/SSD990/autolab/.review-packets/BATCH-c2a2b6/TASK-20260908-ece27b
    packet_commit: f0dfa3bf6e97134c73b92b42d65aaabe8fb75656
    file_count: 4
    contents: Exact copies of the four permitted_reads paths, with their individual transport hashes bound by blind-transport.json; no complete producer tree or producer Git history.
    provenance: Parent control plane created the minimal packet repository and its neutral initial commit, verified the copied files and published the transport receipt. This Coordinator records that transmitted evidence without claiming independent inspection.
    verified_by: parent_control_plane/01a07d9c-ceb4-7892-ae01-260e4b5f0374
    runtime_workdir: The fresh native probe and blind review use the packet directory as workdir. The runtime-binding checker may read the canonical repository through config_module.REPO_ROOT; that control-plane check does not authorize the reviewer to read producer sources.
    access_boundary: The read-only sandbox and declared packet/role read policy do not establish strong operating-system filesystem isolation. Record actual accessed paths and tools, compare them with the permitted scope and exact blind_from prefixes, and fail the blindness gate on unauthorized access. Do not infer protected-number history validation from individual-token hashes.
    access_receipt: Bind the actual session, packet commit, receipt hash, each copied path and hash, and the reviewer's actual read/access attestation before accepting the blind report. No such future session or access receipt is fabricated here.
    continuation: Only after TASK-20260908-1ca5e8 archives the blind report may the same verified session receive a separately hash-bound full arithmetic packet for TASK-20260908-40e722; preserve the original packet and report bindings and record the task-specific continuation receipt.
    authentication_status: Parent read-only native login check reports Logged in using ChatGPT. Authentication alone does not verify the requested model, reasoning level, provider or actual review session.
    native_model_session_probe: pending
  proves_too_much:
    objects:
      - A counter sees only __mul__ and passes schoolbookM/A while missing DIV/POW/S/I routes.
      - Arbitrary rows are offered as decomposition certificates without legal point sums.
      - A precise0.01 paired delta is assigned both primary agreement and disagreement.
      - A profiled timing component is substituted for the unprofiled primary clock.
      - After first calibration failure, always-activated roots are falsely given NOT_ACTIVATED or omitted.
    failure_signature: Any argument accepting one of these objects without the declared rejection or scoped limitation fails its joint; no global protocol PASS from a partial joint report.
