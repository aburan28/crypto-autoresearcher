    final_archive: TASK-20260908-686ab3 owns actual ledger EV/DEC publication after exact snapshot and required checks; preserve every original report and binding.
    task_envelopes: The ten committed handoffs and dispatch_queue.json define exact task write scopes, receipts and gates; this arrangement does not enlarge them or supply unobserved completion.
