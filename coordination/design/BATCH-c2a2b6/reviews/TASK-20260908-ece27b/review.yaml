{"review_report":{"task_id":"TASK-20260908-ece27b","scope":"Blind, source-only re-derivation of the five calibration-program count formulas and the nineteen adapter-input count/output quantities. This report uses only the four supplied source documents, performs no program execution or scientific experiment, and judges only whether the requested quantities are derivable from those supplied definitions.","derivations":[{"id":"schoolbook","M":"64u","S":"0","I":"0","A":"64u","value":"For repetition t and output degree k in {0,...,14}, c[t,k] = sum over i=max(0,k-7),...,min(7,k) of a[t,i]*b[t,k-i] modulo 131. The consumed value is the resulting 15-coefficient vector for each of the u repetitions. A numeric vector or final sink hash is underdefined because the sealed operand streams and their work_seed values are not supplied.","derivation":"Each repetition executes an 8-by-8 nested coefficient loop, hence 8*8=64 coefficient pairs. The definition requires exactly one direct MUL and one direct ADD for every pair, including pairs whose values or current accumulator happen to be 0 or 1. Therefore one repetition emits (M,S,I,A)=(64,0,0,64), and u repetitions emit (64u,0,0,64u). For u in {1,2,4,8,16}, the vectors are respectively (64,0,0,64), (128,0,0,128), (256,0,0,256), (512,0,0,512), and (1024,0,0,1024).","ambiguities":["The count formula is fully determined. Only the numeric coefficients and sink hash are unavailable because the sealed operands and work_seed-derived streams are absent."]},{"id":"square","M":"0","S":"64u","I":"0","A":"0","value":"The consumed values are the 64u residues SQUARE(a[j]) = a[j]^2 modulo 131. Their numeric sequence and sink hash are underdefined because the sealed nonzero operand stream is not supplied.","derivation":"The program makes exactly 64u direct SQUARE calls. The kernel expressly states that SQUARE emits one S and does not call the public MUL emitter. Thus the vector is (0,64u,0,0). For u in {1,2,4,8,16}, S is 64, 128, 256, 512, and 1024 respectively.","ambiguities":["The count formula is fully determined. Numeric squared residues and their sink hash require the omitted sealed operand stream."]},{"id":"inverse","M":"0","S":"0","I":"8u","A":"0","value":"The consumed values are the 8u residues INV(a[j]) = a[j]^-1 modulo 131. They exist because every sealed operand is declared nonzero. Their numeric sequence and sink hash are underdefined because the operand stream is not supplied.","derivation":"There are exactly 8u direct INV calls. Each nonzero INV emits one I. Extended-Euclidean quotient, remainder, and integer-coefficient work is declared boundary work and emits no recursive Fp M, S, or A events. Hence the vector is (0,0,8u,0). For u in {1,2,4,8,16}, I is 8, 16, 32, 64, and 128 respectively.","ambiguities":["The count formula is fully determined. Numeric inverse residues and their sink hash require the omitted sealed operand stream."]},{"id":"add","M":"0","S":"0","I":"0","A":"64u","value":"The consumed values are the 64u residues ADD(a[j],b[j]) = a[j]+b[j] modulo 131. Their numeric sequence and sink hash are underdefined because the sealed operand-pair stream is not supplied.","derivation":"The program performs exactly 64u direct ADD calls, and each ADD emits one A. No multiplication, square, or inverse is called. Thus the vector is (0,0,0,64u). For u in {1,2,4,8,16}, A is 64, 128, 256, 512, and 1024 respectively.","ambiguities":["The count formula is fully determined. Numeric sums and their sink hash require the omitted sealed operand pairs."]},{"id":"division_neg_power","M":"6u","S":"4u","I":"2u","A":"2u","value":"For each repetition with sealed nonzero a,b, the five consumed residues are (a*b^-1, -a, a-b, a^13, a^-3) modulo 131. Their numeric values and aggregate sink hash are underdefined because the sealed a,b stream is not supplied.","derivation":"DIV(a,b) is MUL(a,INV(b)), contributing (1M,0S,1I,0A). NEG(a) and SUB(a,b) each emit one A, contributing 2A total. For POW(a,13), binary 13 is 1101: odd states 13,3,1 cause three MUL calls, while the positive post-shift states 6,3,1 cause three SQUARE calls, so it contributes 3M+3S. For POW(a,-3), initialization contributes one INV; odd states 3 and 1 contribute two MUL calls; and the positive post-shift state 1 contributes one SQUARE, so it contributes 2M+1S+1I. Summing gives one repetition (6M,4S,2I,2A), hence (6u,4u,2u,2u). For u in {1,2,4,8,16}, the vectors are (6,4,2,2), (12,8,4,4), (24,16,8,8), (48,32,16,16), and (96,64,32,32).","ambiguities":["The event formula is fully determined. Numeric residues and the sink hash require the omitted sealed operands."]},{"id":"quo","M":"underdefined: 1 if domain.quo first coerces 6 and 3 to adapter coefficients; 0 if the supplied inherited Field.quo receives the literal host integers unchanged","S":"0","I":"underdefined: 1 on the field-coercing route; 0 on the literal host-integer route","A":"0","value":"Underdefined between canonical field residue 2 on a coefficient/DIV route and host-language value 2.0 on the literal Python-integer route shown by the inherited Field.quo excerpt.","derivation":"The supplied Field.quo definition is exactly return a / b. If the operation's literal arguments 6 and 3 are passed unchanged as Python integers, their / operation is host integer true division, so it emits no Fp event and returns 2.0. If the adapter domain coerces the arguments to its coefficient type before or inside quo, coefficient division invokes DIV(6,3)=MUL(6,INV(3)), emitting 1I+1M and returning residue 2. No supplied excerpt or packet definition states that coercion occurs or supplies an overriding domain.quo method, so the two traces cannot be distinguished from the allowed sources.","ambiguities":["Missing definition: whether domain.quo coerces raw integer arguments to adapter coefficients, or overrides the inherited Field.quo method to do so. The inherited upstream excerpt alone does not perform conversion."]},{"id":"exquo","M":"underdefined: 1 if domain.exquo first coerces 6 and 3 to adapter coefficients; 0 if the supplied inherited Field.exquo receives the literal host integers unchanged","S":"0","I":"underdefined: 1 on the field-coercing route; 0 on the literal host-integer route","A":"0","value":"Underdefined between canonical field residue 2 on a coefficient/DIV route and host-language value 2.0 on the literal Python-integer route shown by the inherited Field.exquo excerpt.","derivation":"The supplied Field.exquo definition, like Field.quo, is exactly return a / b. Coerced coefficient operands cause DIV and therefore 1I+1M with residue output 2. Literal Python integer operands perform host true division with no Fp events and return 2.0. The allowed sources do not define an exquo override or an argument-coercion step.","ambiguities":["Missing definition: whether domain.exquo coerces its literal integer arguments to adapter coefficients, or overrides inherited Field.exquo."]},{"id":"rsub","M":"0","S":"0","I":"0","A":"1","value":"4","derivation":"The operation is the reverse subtraction 7-coeff(3). The kernel explicitly states that reverse subtraction calls direct SUB once, rather than implementing subtraction as NEG followed by ADD. SUB(7,3) emits exactly one A and returns 7-3=4 modulo 131.","ambiguities":[]},{"id":"rdiv","M":"1","S":"0","I":"1","A":"0","value":"2","derivation":"The coefficient reverse-division route evaluates field DIV(6,3). By definition DIV(a,b)=MUL(a,INV(b)), so it emits one I and one M. Since 3^-1 modulo 131 is 44, the result is 6*44=264 congruent to 2 modulo 131.","ambiguities":[]},{"id":"pow0","M":"0","S":"0","I":"0","A":"0","value":"1","derivation":"The declared POW algorithm returns ONE immediately for exponent n=0. It performs no initialization multiplication, square, inverse, or addition event. Therefore coeff(3)^0 returns canonical residue 1 with the zero vector.","ambiguities":[]},{"id":"pow1","M":"1","S":"0","I":"0","A":"0","value":"3","derivation":"For n=1, initialize r=ONE and b=3. The sole loop state is odd, so r=MUL(ONE,3), emitting one M even though an operand is 1. The shift makes n=0, so no SQUARE follows. The result is residue 3.","ambiguities":[]},{"id":"pow2","M":"1","S":"1","I":"0","A":"0","value":"9","derivation":"At n=2 the odd branch is skipped, then n becomes 1 and b=SQUARE(3), emitting one S and producing 9. At n=1, r=MUL(ONE,9), emitting one M; the following shift reaches zero and no further square occurs. The result is 9.","ambiguities":[]},{"id":"pow_negative","M":"2","S":"1","I":"1","A":"0","value":"34","derivation":"For n=-3, initialization replaces b by INV(3), emitting one I; INV(3)=44 modulo 131. With absolute exponent 3, the odd states 3 and 1 cause two MUL events and the positive post-shift state 1 causes one SQUARE event. Thus the vector is (2,1,1,0). The result is 3^-3=(27)^-1 modulo 131. Extended Euclid gives 1=34*27-7*131, hence the canonical result is 34.","ambiguities":[]},{"id":"equal_mul","M":"1","S":"0","I":"0","A":"0","value":"9","derivation":"The named operation directly multiplies coeff(3) by coeff(3). MUL emits one M even when the two operands are numerically equal; equality does not redirect the operation to SQUARE. The result is 3*3=9 modulo 131.","ambiguities":[]},{"id":"mixed_mul","M":"1","S":"0","I":"0","A":"0","value":"6","derivation":"The kernel explicitly declares that small constants become field multiplications when multiplied and are not implemented as free repeated addition. Therefore coeff(3)*2 invokes one MUL and returns 6 modulo 131.","ambiguities":[]},{"id":"mixed_rmul","M":"1","S":"0","I":"0","A":"0","value":"6","derivation":"The reverse mixed multiplication 2*coeff(3) is still one field multiplication by the small constant. MUL emits exactly one M and returns 6 modulo 131.","ambiguities":[]},{"id":"sub","M":"0","S":"0","I":"0","A":"1","value":"0","derivation":"Direct SUB(coeff(3),coeff(3)) emits exactly one A, even though its result is zero. The canonical result is 0.","ambiguities":[]},{"id":"neg","M":"0","S":"0","I":"0","A":"1","value":"128","derivation":"Direct NEG(coeff(3)) emits exactly one A. The canonical residue representing -3 modulo 131 is 131-3=128.","ambiguities":[]},{"id":"rem","M":"3","S":"0","I":"1","A":"2","value":"124","derivation":"For f=2X+3 and g=X+5, both inputs are constructed before reset. In the first rem loop, _term_div compares leading terms 2X and X. Their monomials divide, so domain_quo(2,1) is called. There is no divisor-one shortcut in _term_div; DIV(2,1) therefore contributes 1I+1M and gives quotient coefficient c=2. The inner loop visits both terms of g. For X it evaluates 2-c*1, contributing 1M+1A and producing zero. For the constant it evaluates 3-c*5, contributing another 1M+1A and producing 3-10=-7 congruent to 124. The remaining constant monomial cannot be divided by X, so _term_div returns None before any coefficient quotient; moving that term to r uses no declared Fp event. Total: 3M, 0S, 1I, 2A, and remainder 124.","ambiguities":[]},{"id":"monic","M":"2","S":"0","I":"2","A":"0","value":"X+67","derivation":"The nonzero polynomial f=2X+3 has leading coefficient 2, so monic calls quo_ground(f,2). The early exits do not apply: f is nonzero and 2 is not domain.one. For a field, quo_ground invokes domain.quo once for each of the two coefficients. Each quotient is DIV and emits 1I+1M, giving 2I+2M total. The leading coefficient becomes 2/2=1. Since 2^-1 modulo 131 is 66, the constant becomes 3*66=198 congruent to 67. The output is X+67.","ambiguities":[]},{"id":"monic_one","M":"0","S":"0","I":"0","A":"0","value":"X+5","derivation":"The polynomial X+5 is nonzero and has leading coefficient domain.one. monic calls quo_ground(f,1), whose explicit condition if not f or x == domain.one returns f before any domain.quo call. Thus no events are emitted and the polynomial is unchanged.","ambiguities":[]},{"id":"monic_zero","M":"0","S":"0","I":"0","A":"0","value":"0","derivation":"monic first tests if not f. For the zero polynomial this branch returns f immediately, before reading a leading coefficient or calling quo_ground. Input construction occurred before reset, so the named operation emits no events and returns zero.","ambiguities":[]},{"id":"shift","M":"0","S":"0","I":"0","A":"0","value":"2X^3+3X^2","derivation":"The supplied mul_monom implementation changes each monomial through monomial_mul and passes each coefficient through unchanged. It performs no coefficient multiplication, addition, square, inverse, or division. Multiplying the monomials of 2X+3 by X^2 therefore gives 2X^3+3X^2 with the zero field-event vector.","ambiguities":[]},{"id":"imul_num","M":"underdefined; conditional value is 2 if imul_num performs one field multiplication on each of the two nonzero coefficients","S":"underdefined; conditional coefficientwise-multiplication trace is 0","I":"underdefined; conditional coefficientwise-multiplication trace is 0","A":"underdefined; conditional coefficientwise-multiplication trace is 0","value":"Underdefined from the supplied sources. If imul_num means coefficientwise multiplication of 2X+3 by field element 2, its algebraic output is 4X+6 and the natural trace is (2,0,0,0). The supplied sources do not establish that behavior or even the method's return/mutation convention.","derivation":"The upstream excerpt defines mul_ground, for which the two terms of 2X+3 would each evaluate coeff*2 and therefore emit two M events, returning 4X+6. The named operation, however, is imul_num, and no supplied excerpt defines imul_num or states that it aliases, delegates to, or is observationally equivalent to mul_ground. It could use coefficient __imul__, __mul__, a domain-specific primitive, mutation without a returned value, or an unavailable method. Equating it with mul_ground would therefore import a producer/implementation assumption that is absent from the blind packet.","ambiguities":["Missing definition: the implementation or abstract event semantics of imul_num, including whether it delegates to mul_ground, how it coerces the numeric operand, and whether it mutates and/or returns the polynomial. The presence of a mul_ground excerpt does not itself establish an alias."]}],"findings":["All five calibration count formulas are uniquely derivable for every declared multiplier u in {1,2,4,8,16}. Their numerical result streams and sink hashes are intentionally not recoverable because the sealed operands and work_seed-derived streams were not supplied; this does not make their count formulas unknown.","Sixteen of the nineteen adapter cases have unique count vectors and algebraic outputs under the supplied kernel and upstream excerpts.","The quo and exquo cases are not uniquely derivable because their operations show literal integer arguments while the supplied inherited Field methods merely evaluate a/b. The missing adapter-domain coercion or override decides between a zero-event host-integer trace returning 2.0 and a field DIV trace returning canonical residue 2 with 1M+1I.","The imul_num case is not uniquely derivable. The supplied mul_ground body would imply 2M and output 4X+6, but no supplied definition connects the named imul_num operation to mul_ground or otherwise defines its event, coercion, mutation, and return semantics.","The rem trace includes domain_quo(2,1) and therefore charges 1I+1M despite the divisor being one; the explicit divisor-one skip exists in quo_ground and applies to monic_one, not to _term_div. The remainder update contributes two further M events and two A events.","No scientific run, calibration, test, solver, fixture, proof test, source exploration, or producer-value comparison was performed. The verdict is confined to derivability from the supplied source material."],"known_false_controls":["Known-false counter: instrument coefficient __mul__ and the schoolbook accumulation path sufficiently to report the correct schoolbook M/A totals, but omit direct SQUARE and INV sinks and omit DIV/POW/domain-alias arithmetic routes. Such a counter can appear calibrated on schoolbook while systematically missing arithmetic used elsewhere.","Defined controls that would expose that counter on paper are: square, which requires 64u direct S events that must not appear as M; inverse, which requires 8u I events; division_neg_power, which jointly requires 6u M, 4u S, 2u I, and 2u A; rdiv, which requires 1I+1M; pow1, pow2, and pow_negative, which distinguish multiplication by ONE, direct square, and negative-exponent inversion; rem, which requires the hidden _term_div domain quotient plus coefficient multiplications and subtractions; and monic, which requires two domain quotients. rsub, sub, and neg separately expose missing A routes. pow0, monic_one, monic_zero, and shift are zero-event controls that expose indiscriminate overcounting.","quo and exquo could expose a missed domain-alias route only after their raw-integer coercion/override semantics are specified. As presently supplied, accepting either an assumed counted route or an assumed bypass would beg the missing definition.","None of these controls was run; the statements above are source-level consequences of their definitions, not empirical control results."],"limitations":["Only AGENTS.md, agents/validator.md, ledger/handoffs/TASK-20260908-ece27b.yaml, and coordination/design/BATCH-c2a2b6/blind-packet.json were considered. The SymPy excerpts were considered only as content embedded in the blind packet; their repository files were not separately opened.","Producer implementation, producer expected vectors, producer notes, complete protocol materials, sibling reviews, and every blind_from path were not read.","The sealed calibration operands and work_seed-generated streams were not supplied, so calibration outputs can be given symbolically but not as numeric streams or hashes.","The missing raw-integer coercion rules for domain.quo/domain.exquo and the missing imul_num definition prevent a unique answer for all nineteen adapter cases. This is a source-sufficiency finding, not evidence that any implementation is incorrect.","This blind re-derivation does not validate an implementation, run receipt, experimental result, hypothesis, or entire protocol and supplies no authority for a research-state transition."],"scientific_runs":0,"review_attestation":{"task_id":"TASK-20260908-ece27b","joints_owned":["blind_calibration_quantities"],"sources_read":["AGENTS.md","agents/validator.md","ledger/handoffs/TASK-20260908-ece27b.yaml","coordination/design/BATCH-c2a2b6/blind-packet.json"],"read_sibling_reports":false,"blind_from_respected":true,"independent_session":true,"verdict":"breaks"}}}