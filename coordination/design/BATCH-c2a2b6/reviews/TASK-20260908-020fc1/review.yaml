{"review_report":{"task_id":"TASK-20260908-020fc1","scope":"Independent, joint-scoped protocol/source review of only `paired_measurement_and_statistics` for `EXP-ECDLP-ac7e8b`: the seed and root schedule, planned component accounting, timing/counting/profile pairing, boundary-based eligibility, load and drift targets, paired local-slope deltas, and the 2000-resample procedure. The attested `breaks` verdict applies only to this owned joint's sufficiency for later implementation. It is not a whole-protocol verdict, a run-validity verdict, an experiment-approval decision, a hypothesis verdict, or a scientific conclusion.","comparison":["Root schedule re-derivation: `coordination/design/BATCH-28dddb/protocol-appendix.yaml::protocol_appendix.panel` defines 10 size cells, comprising 6 S3 cells and 4 S4 cells. At 20 fixture indices per cell, that is 10*20=200 `(cell_id,j)` instance groups: 120 S3 groups and 80 S4 groups. `protocol_appendix.schedule.instance_groups` assigns 4 loads and 2 modes to each group, so each group has 4*2=8 roots and the complete sealed schedule has 200*8=1600 roots. Equivalently, S3 contributes 120*8=960 roots and S4 contributes 80*8=640 roots; each mode has 800 roots and each load has 400 roots. Warmup evaluations, profile audits, rho restarts, and watchdog-resume segments do not create additional roots.","Primary-component re-derivation: `protocol_appendix.schedule.components_per_job` gives 25 calibrators, 1 planted-positive decomposition, 2 main decompositions, and 2 baselines per root, hence 25+1+2+2=30 primary components. Across 1600 roots this gives 48000 primaries: 1600*25=40000 calibrators, 1600*1=1600 planted-positive components, 1600*2=3200 main components, and 1600*2=3200 baseline components. The category sum is 40000+1600+3200+3200=48000. S3 contributes 960*30=28800 primaries and S4 contributes 640*30=19200.","Phase-total re-derivation: every root receives one complete 30-component warmup and one 30-component primary, giving 48000 warmups and 48000 primaries. Only the 800 timing roots receive a third 30-component profiled audit, giving 800*30=24000 profile components. Thus the planned complete schedule contains 48000+48000+24000=120000 component evaluations. A counting root contains 30 warmups plus 30 primaries, or 60 evaluations; a timing root contains 30 warmups, 30 primaries, and 30 profiles, or 90 evaluations. Therefore 800*60+800*90=48000+72000=120000. These are complete-schedule planned totals; after a frozen stop gate fires, omitted components must not be reported as executed even though all 1600 roots must eventually receive honest final receipts.","Per-cell and per-instance accounting: each size cell has 20 groups*8 roots=160 roots, split into 80 counting and 80 timing roots. It consequently has 160*30=4800 primary, 4800 warmup, and 80*30=2400 profile evaluations, for 12000 evaluations in a complete cell. Each `(cell_id,j)` group has 8 roots, 8*30=240 primaries, 240 warmups, and 4 timing roots*30=120 profiles, for 600 component evaluations. Across all phases, the 25 calibrator identities each occur 1600 primary+1600 warmup+800 profile=4000 times, so calibrators account for 25*4000=100000 evaluations; planted-positive components account for 1600+1600+800=4000, the two main arms for 2*4000=8000, and the two baselines for 2*4000=8000, again totaling 120000.","Auxiliary-count re-derivation: `protocol_appendix.schedule.calibration_faults` applies 4 copied-log mutations to the measured `u=1` instance of each of 5 programs in every root, giving 5*4*1600=32000 fault checks, split as 19200 over the 960 S3 roots and 12800 over the 640 S4 roots. `protocol_appendix.schedule.conservation_controls` has 9 cases before measurement and the same 9 after aggregation, giving 18 case evaluations. `protocol_appendix.adapter_admission_matrix` has 19 cases in 2 modes, giving 38 later admission evaluations. These fault, conservation, and adapter-admission checks are explicitly outside the 120000 component total. There are 200 local conservation campaigns, one per `(cell_id,j)`, not 1600 independent conservation campaigns.","Seed and mode-pair derivation: `protocol_appendix.bytes_and_seeds.fixture_seed` and `work_seed` exclude load and mode, so corresponding conditions use the same fixture and component input. `attempt_seed` includes `(cell_id,j,load,mode)`, so the counting and timing roots are separate sealed attempts even though their scientific inputs are paired. For one main observation, the intended primary pair is the unprofiled timing-mode primary wall value and the counting-mode primary `W` for the same `(cell_id,j,load,arm,component,stage,input/source binding)`. The corresponding timing profile is a third, fresh-state audit attached to that pair for boundary eligibility and perturbation reporting; its clock is not an estimator input. The documents describe this relationship in prose but do not specify the exact row-level pair identifier or total key used to enforce it.","Timing/profile separation comparison: `protocol_appendix.schedule.timing_profile_audits`, `protocol_appendix.resources.boundary_fraction`, and `protocol_appendix.statistics.x_coordinate` consistently require primary timing to be unprofiled and count-disabled; warmup is also unprofiled; boundary attribution comes only from a separate profiled, count-disabled timing audit. Profile order is balanced within every cell because even `j` places primary before profile and odd `j` places profile before primary, yielding 10 instances in each order. The protocol correctly forbids an overhead subtraction and requires the perturbation and chronological order to be published. However, the exact aggregation of the two named primary stages and their producer/verifier `W` vectors is not reduced to one normative statistical formula or schema key.","Finite median and local-slope derivation: for a complete 20-instance size, `protocol_appendix.statistics.median_rule` selects the arithmetic mean of the 10th and 11th ordered values using one-based order-statistic language. The specified coordinates are `x_s=median_i(log(p_i))`, `yT_s=log(median_i(T_i))`, and `yW_s=log(median_i(W_i))`; these are not interchangeable with `log(median(p_i))`, `median(log(T_i))`, or `median(log(W_i))`. For a retained adjacent size edge `(a,b)`, the intended values are `sT=(yT_b-yT_a)/(x_b-x_a)`, `sW=(yW_b-yW_a)/(x_b-x_a)`, and `delta=sT-sW`, using the same complete paired instance sets and the same retained endpoint cells. Under a fully eligible panel, S3 contributes 5 edges and S4 contributes 3 edges for each arm/load. Across 2 arms and 4 loads this is `5*2*4 + 3*2*4 = 64` local timing slopes, 64 local operation slopes, and 64 paired deltas. Exclusions reduce the number of defined edges; they must never be silently presented as the original full-ladder edge set.","Bootstrap-unit re-derivation: the resampling unit is the entire fixture index `j` within a size cell, not an individual timing value, mode, load, arm, component, or profiler row. For each resample number `r`, each cell independently draws 20 indices with replacement from `0..19`; the resulting cell-specific index vector is reused across timing/counting, all loads, EC/null, and corresponding baselines. Thus exactly 10 cells*2000 resamples*20 selections=400000 base index selections are needed, with no separate index generation for each downstream condition. A local edge at resample `r` uses the two cell-specific 20-index vectors for its endpoints; within each endpoint, the identical selected indices must feed `p`, unprofiled timing, counting `W`, and any paired condition comparison. The cell ID in the sampling domain makes draws distinct between size cells, while the common resample number preserves the declared shared bootstrap organization.","Bootstrap-interval re-derivation: each local statistic has exactly 2000 attempted paired bootstrap values. Finite results are sorted, and the interval uses the one-based 50th and 1950th order statistics with no interpolation. `protocol_appendix.statistics.bootstrap` explicitly states that even one undefined resample makes the primary interval undefined and forbids trimming undefined tails. Therefore an implementation must retain 2000 statuses, not merely up to 2000 finite values. If the point estimate, either endpoint-cell slope, or any one of the 2000 resampled deltas is undefined, an agreement/disagreement category requiring an entire interval cannot be established.","Mutually exclusive category derivation: write the practical tolerance as `tau=0.05`. For an ordered interval `[L,U]`, agreement is exactly `-tau <= estimate <= tau` and `-tau <= L <= U <= tau`. Positive disagreement is exactly `estimate > tau` and `L > tau`; negative disagreement is exactly `estimate < -tau` and `U < -tau`. Everything else, including any undefined quantity or equality at a disagreement boundary, is inconclusive. The three cases are mutually exclusive because agreement constrains the estimate to the closed band, whereas either disagreement case requires the estimate strictly outside it, and positive and negative disagreement cannot both hold for an ordered interval. The prose rule has this coherent logical reading, but the bare YAML decimal `0.05` is not normatively declared to mean the exact rational `1/20`, despite the later requirement that platform rounding not decide equality.","Tiny-significant-yet-practical-agreement demonstration: take a paired estimate `0.010` with a paired interval `[0.009,0.011]`. The interval excludes zero, so a conventional interval-based test of the point null `delta=0` would call the difference statistically nonzero at the interval's nominal level. Nevertheless, the estimate and the entire interval lie inside `[-0.05,0.05]`, so this protocol must classify the result as practical agreement. Statistical detectability of a small nonzero delta and practical equivalence within a predeclared tolerance are different questions. No p-value or scientific observation is asserted by this paper example.","Boundary and missing-size comparison: a size is boundary-excluded only if the median of 20 corresponding per-instance profile fractions is strictly greater than `0.5`; exact equality remains eligible. A primary size also requires 20 complete, valid timing/counting pairs, positive time and `W`, and a defined `x`. The bootstrap freezes original eligibility and reports profile-threshold crossing frequency only as sensitivity. With exactly 4 S4 sizes, one boundary exclusion leaves only 3 and makes S4 scaling inference unavailable. S3 can retain at least 4 of its 6 sizes, but the documents do not consistently distinguish a preregistered profile exclusion from a size lost to missing/censored scientific data: `experiments/EXP-ECDLP-ac7e8b/specification.yaml::experiment.stopping_rules` says incomplete fixture admission blocks the affected full-panel inference, while `protocol_appendix.statistics.eligibility` can be read as permitting any remaining set of at least 4 sizes. That ambiguity can authorize an outcome-selected survivor panel unless corrected.","Retained-edge comparison: `protocol_appendix.statistics.local_slopes` says adjacent retained size cells, which naturally makes a formerly nonadjacent pair such as S3-b10/S3-b16 an edge if S3-b12 is preregisteredly boundary-excluded. That is a different finite estimand from the original b10/b12 and b12/b16 edges and must be labeled by exact endpoints and exclusion reason. The protocol does not say whether missing/censored sizes may create the same gap-spanning edge, even though its tail and stopping rules warn against survivor-only inference.","Load-target comparison: count invariance is well scoped at the component/input level because only counting roots emit observed counts and the same component input is repeated under loads 0,1,2,4. Timing roots merely recheck the hash-bound counting log and must not be described as an independent timing-mode count observation. The timing target requires nondecreasing medians and a load4/load0 factor of at least 1.5, but `protocol_appendix.statistics.load_targets` says this is evaluated by `size/arm/program` without defining `program` or enumerating whether the target applies to main EC/null components only, calibrators, planted controls, baselines, or every component identity. The number and identity of load-target panels are therefore not reproducibly fixed.","Drift-target comparison: the intended primary quantity is, at load 0, the per-instance ratio of an unprofiled timing primary wall value to its matched counting `W`, followed by the median of 20 ratios at each size. Four sequences then exist: S3/EC, S3/curve-free, S4/EC, and S4/curve-free. A target holds only when a complete sequence is weakly nondecreasing or weakly nonincreasing and `max/min > 2`; no direction is selected in advance. The rule correctly avoids a one-sided sign claim, but it does not explicitly bind which producer/verifier `W` aggregate is the denominator, whether profile-based size exclusions apply despite `experiment.invalidation_rules` saying they affect slope fits only, or what exact panel verdict follows from a missing, censored, nonpositive, or incomplete size. Those choices cannot be left to observed data."],"findings":["Scoped verdict: the planned arithmetic totals, resampling unit, paired-bootstrap logic, and profile-versus-primary separation are largely coherent, but the `paired_measurement_and_statistics` joint breaks as an implementation-ready frozen contract because several load-bearing row identities and decision-boundary semantics remain underdetermined. This verdict is confined to this joint.","The complete planned schedule reconciles exactly to 1600 roots, 48000 primaries, 48000 warmups, 24000 profiles, and 120000 component evaluations. The component-category totals, 32000 copied-log fault checks, 18 conservation cases, and 38 later adapter evaluations also reconcile without double counting. These totals describe a fully completed schedule; the stop policy can legitimately produce fewer executed components while still requiring 1600 terminal root receipts.","The schedule establishes scientific-input pairing but not an enforceable canonical pairing key. `experiments/EXP-ECDLP-ac7e8b/specification.yaml::experiment.artifacts.schema_binding` promises pair identity, yet `protocol_appendix.outputs.table_schema.common_row_keys` does not include a pair ID, and no derivation for one is given. Counting and timing attempts intentionally have different attempt seeds and IDs, so matching only on attempt identity is impossible; matching loosely on cell/load/component is insufficient to detect duplicate or cross-bound input rows.","The statistical numerator and denominator are not defined at one exact interface. `protocol_appendix.resources.timing_scope` says primary slopes use relation collection plus independent verification and both labeled Fp vectors, while `protocol_appendix.statistics.x_coordinate` refers only to `primary-stage timing-mode wall_ns` and matching counting-mode `W`. The protocol must specify whether primary wall is a sum or union of exact interval sets, which startup/gap/serialization intervals are excluded, and whether `W` is producer-only, verifier-only, or the labeled producer-plus-verifier sum. The surrounding prose favors the producer-plus-verifier matched-stage sum, but an implementation must not infer a load-bearing formula from that prose.","Primary/profile separation holds at the protocol level: an unprofiled primary clock is the only permitted timing estimator; a separate count-disabled profile supplies only boundary eligibility and perturbation diagnostics. A profiled clock cannot substitute for a primary clock, and a profile-derived library fraction is neither a missing-arithmetic count nor an overhead correction. Later implementation evidence is still required to prove that phase labels, clocks, and sinks actually obey this separation.","The category logic is mutually exclusive only after `0.05` is bound as an exact mathematical threshold. The documents provide an exact-rational log-enclosure procedure but leave `0.05` as a bare YAML number. A binary floating parse can make exact equality at `+/-0.05` platform- or serializer-dependent, contradicting `protocol_appendix.outputs.table_schema.numeric_pin`. The threshold must be represented as the exact rational `1/20`, and unresolved interval comparisons at the 512-bit enclosure ceiling must produce inconclusive rather than a rounded decision.","A precise delta of `0.01` cannot receive both primary labels. If its entire paired interval is also inside the practical band, it is agreement; if the interval crosses or leaves the band, it is inconclusive; it cannot be disagreement because the point estimate is not strictly outside either tolerance boundary. The paper example `0.010 [0.009,0.011]` also proves that a small interval excluding zero can remain practical agreement.","The bootstrap organization preserves pairing when the cell-level 20-index vector is reused across modalities and conditions. Exactly 400000 base index selections are sufficient. Regenerating indices by mode, load, arm, statistic, or component would violate the paired design; duplicating the same flattened index record as if it were a new resample unit would overstate the resample count.","The missing-size rules are internally ambiguous. A preregistered boundary exclusion may intentionally define a retained panel of at least 4 sizes, but an unplanned missing/censored size is not equivalent to that exclusion. The current combination of `experiment.stopping_rules`, `experiment.tail_checks`, and `protocol_appendix.statistics.eligibility` does not uniquely say whether S3 may continue on at least 4 complete sizes after a scientific-data loss or whether the affected full-panel inference is unavailable. This must be decided before implementation to prevent survivor-only fits.","The protocol properly forbids a 19-of-20 survivor median within a size: every primary size needs all 20 complete pairs. It does not explicitly state whether profile completeness is part of that gate. Because the boundary median requires 20 profile fractions, a missing or invalid profile audit must make eligibility undefined; it cannot be silently treated as a boundary fraction at or below 0.5.","`protocol_appendix.statistics.bootstrap` properly refuses a trimmed interval when any resample is undefined. The reporting schema does not, however, explicitly bind the downstream primary label to `inconclusive`/`undefined` in that case or require an undefined-count and reason histogram. Without those fields, an implementation could retain null rows yet still calculate an interval over the finite survivors.","The local-edge count is determinable only for the fully eligible design: at most 64 paired deltas. After exclusions, `adjacent retained` permits gap-spanning edges, but their endpoint identities and changed estimands must be explicit. An edge created by a preregistered profile exclusion must not be conflated with an original adjacent edge, and an edge created by unplanned data loss must not be admitted unless the corrected protocol explicitly authorizes that estimand.","The load response is not reproducibly enumerable because `protocol_appendix.statistics.load_targets::size/arm/program` leaves `program` undefined. A complete implementation cannot know the expected number of load-series rows, which component identities share a target, or whether failure/missingness in an auxiliary calibrator or baseline affects a main EC/null load conclusion.","The sign-unspecified drift rule is logically coherent as a finite two-direction monotonicity target, but its input and completeness gates are incomplete. It needs a named paired denominator, a clear relationship to boundary exclusions, all-size/all-20 completeness requirements, positive-ratio requirements, and an explicit result for missing/censored/nonpositive values. Selecting whichever direction the complete sequence actually follows is allowed; selecting a subset of sizes until one direction appears is not.","All local bootstrap intervals are per-edge intervals. Neither `protocol_appendix.statistics.bootstrap` nor the specification supplies familywise or false-discovery control across the maximum 64 edges. That is acceptable for separately labeled finite descriptive classifications, but no downstream synthesis may call interval exclusion of zero a portfolio-wide significance result or a global family-level test without an additive multiplicity rule.","Counting always precedes timing at each load. Load rotation and fresh workers mitigate ordering structure, and the protocol discloses the fixed mode order, but it remains a temporal/system-state confounder. It does not invalidate the logical count-versus-time pairing; it limits causal interpretation and must remain visible in the later summary."],"required_corrections":["Protocol correction — canonical pair identity: add an immutable `pair_id` derivation to `coordination/design/BATCH-28dddb/protocol-appendix.yaml::protocol_appendix.outputs.table_schema`, based on experiment/version, cell ID, instance index, load, component identity, stage set, fixture/work input binding, and source/algorithm binding while excluding mode. Require exactly one valid counting primary and one valid unprofiled timing primary per primary pair; attach exactly one corresponding timing profile audit by a separate `profile_audit_id`. Include these keys in raw component, typed-count, resource, profile, and statistical rows, and reject duplicate, missing, or cross-hash joins.","Protocol correction — exact estimator interface: define normatively `T_primary` as the union length, or another explicitly selected operation, of the exact unprofiled phase=`primary` interval sets for producer relation collection and independent verification. Define `W_primary` as the exact matching counting-mode weighted sum of the labeled producer-Fp and verifier-Fp vectors over those same stages. State whether worker startup, inter-process gap, serialization, and unrelated verification/control intervals are inside or outside both quantities. Do not allow producer-only time to be paired with producer-plus-verifier `W`, or full-workflow time with a partial-operation vector.","Protocol correction — profile attachment: state that the boundary fraction for a family/arm/load/size is taken from the corresponding main arm component's fresh profiled audit over the same named stage set as `T_primary`; the profile is count-disabled and never contributes a timing estimator. Require 20 valid profile fractions to decide the size's boundary eligibility. A missing/invalid profile makes eligibility undefined and the affected slope inference unavailable, rather than implicitly eligible.","Protocol correction — exact tolerance: replace every load-bearing bare `0.05` with a normative exact rational `tau=1/20`, serialized as numerator/denominator decimal strings. Apply the outward rational log-interval procedure to the point estimate and bootstrap endpoints. Agreement uses closed comparisons to `+/-tau`; disagreement uses strict comparisons. If a required comparison cannot be established by the declared 512-bit ceiling, record inconclusive. No binary64 parse, epsilon, or rounded display value may decide equality.","Protocol correction — completeness taxonomy: distinguish at least three cases before observing data: `(a)` a complete eligible size with 20 valid primary pairs and 20 valid profile audits; `(b)` a complete size excluded solely by the preregistered median-profile-fraction rule; and `(c)` a size incomplete because of fixture, count, timing, profile, censoring, or validity loss. Reconcile `experiment.stopping_rules` with `protocol_appendix.statistics.eligibility` by stating whether case `(c)` blocks the whole family/arm/load inference. To prevent survivor-only fitting, the recommended binding is that only case `(b)` may be removed under the at-least-four-size retained-panel rule, while case `(c)` makes the affected panel inference unavailable.","Protocol correction — retained edges: specify whether local slopes after a valid profile exclusion use adjacent cells in the retained ordered set or only originally adjacent cells. If retained adjacency is intended, require every result row to carry both exact endpoint cell IDs, their original bit sizes, all intervening exclusions and reasons, and a label that the estimand spans a gap. Do not let an unplanned missing/censored size manufacture a new retained edge unless the corrected completeness rule explicitly preregisters that behavior.","Protocol correction — undefined bootstrap disposition: require exactly 2000 bootstrap status rows per cell/edge statistic, an `undefined_count`, reason counts, and references to every underlying index vector. If any resample is undefined, set interval endpoints to null and the primary delta category to inconclusive/undefined with its reason; do not sort only finite values, renumber ranks, impute values, or calculate the 50th/1950th endpoints from survivors.","Protocol correction — load-target inventory: replace `protocol_appendix.statistics.load_targets::size/arm/program` with an exact list of target component classes and row keys. State separately whether load monotonicity/factor targets apply to each main EC/null component, each calibration program/multiplier, planted-positive controls, and each baseline. For each declared series, require the same 20 valid fixture indices at all four loads; a missing load or incomplete size yields unavailable/inconclusive, not a numerical target failure. Keep counting-vector invariance restricted to actual counting-root observations.","Protocol correction — drift estimator and missingness: define the per-instance load-0 ratio as the same `T_primary/W_primary` pair used by slopes; require both values positive and all 20 pairs at every intended family size. State explicitly whether profile-excluded sizes remain in drift, as suggested by `experiment.invalidation_rules` saying the boundary threshold excludes slope fits only. Require all intended sizes unless a separate preregistered drift eligibility rule says otherwise. Missing, censored, nonpositive, or incomplete sizes must yield inconclusive rather than a survivor sequence. Bind weak monotonicity, strict `max/min > 2`, and exact rational comparisons, and report increasing, decreasing, flat/both, or nonmonotone without selecting a favorable subset.","Protocol correction — inference scope: label the 2000-resample intervals and any zero-exclusion statement as per-edge descriptive intervals with no multiplicity adjustment. Prohibit familywide, portfolio-wide, or global statistical-significance wording unless a later additive protocol preregisters a multiple-comparison procedure. Preserve the practical-equivalence category as the primary delta interpretation.","Later implementation-only gate — sealed pair cardinality: after implementation is authorized, verify the sealed schedule contains exactly 1600 unique roots, 800 per mode, with unique attempt seeds; verify each planned primary pair resolves to one counting root and one timing root with identical fixture/work/component input hashes and the expected distinct attempt identities. Detect duplicate realized fixture bytes without deleting or replacing them, and preserve the deterministic index identity.","Later implementation-only gate — phase and clock separation: verify from raw rows and interval references that counting roots contain warmup and primary but no profile, timing roots contain warmup, unprofiled primary, and profile, and no profiled or warmup clock enters `T_primary`. Verify that timing and profile count payloads are null with `not_recorded`, not copied predictions; the timing calibration gate may reference the paired counting log only as an audit.","Later implementation-only gate — component reconciliation: on a fully completed schedule, independently recompute 48000 primary, 48000 warmup, and 24000 profile evaluations and the 40000/1600/3200/3200 primary component split. When a stop gate fires, verify omitted component rows and final root receipts instead of enforcing completed-component totals. Recompute 32000 fault-check statuses, 18 conservation cases, and 38 admission evaluations separately and ensure they are not included in the 120000 component count.","Later implementation-only gate — boundary profiler conservation: for every profile row, verify a positive `audited_stage_ns`, exclusive priority classification, and exact conservation `kernel_ns + library_boundary_ns + other_ns = audited_stage_ns` or an explicitly declared unclassified defect. Recompute each exact rational boundary fraction and every 20-instance median; verify strict `>1/2` exclusion and retain exact `=1/2` as eligible. Check that profile order is 10 primary-before-profile and 10 profile-before-primary per cell.","Later implementation-only gate — raw paired recomputation: independently recompute every size median, `x`, `y_time`, `y_ops`, local slope, paired delta, load series, and drift sequence from raw component/resource/count rows. Verify the operation order `median(log p)`, `log(median time)`, and `log(median W)` exactly. Reject summaries that use lower medians, median logs for time/operations, pooled S3/S4 fits, mismatched stages, mismatched instance sets, or marginal rather than paired delta resampling.","Later implementation-only gate — bootstrap index audit: verify exactly 400000 base index selections organized as 10 cells*2000 resamples*20 draws, including deterministic rejection counters from the sampling routine. For each cell and `r`, verify the same index vector is reused across time/count, loads, arms, and corresponding baselines and is not regenerated per statistic. Recompute the one-based 50th/1950th endpoints from all 2000 defined values only when none is undefined; otherwise require the frozen undefined disposition.","Later implementation-only gate — known-false statistical fixture: include summary-level implementation tests showing that `estimate=0.01, interval=[0.009,0.011]` yields agreement only; `estimate=0.01` with an interval not wholly inside the band yields inconclusive; exact boundary equality cannot yield disagreement; and positive/negative disagreement require both the estimate and whole interval strictly beyond the same boundary. These are implementation tests only and must not be presented as scientific runs.","Later implementation-only gate — known-false clock fixture: inject or construct a non-scientific summary fixture in which the profile duration differs materially from the unprofiled primary duration and verify that the primary estimator still uses only the unprofiled clock, while the profile affects only eligibility and perturbation reporting. Any summary that substitutes or subtracts the profile clock must fail admission."],"known_false_controls":["Relevant known-false control from `coordination/design/BATCH-c2a2b6/review-binding.yaml::review_plan.proves_too_much.objects`: `A precise 0.01 paired delta is assigned both primary agreement and disagreement.` On paper this object is rejected. With exact `tau=1/20`, estimate `0.01` lies in the closed practical band and therefore fails the strict point-estimate condition for both positive and negative disagreement. If its whole interval lies in the band it is agreement; otherwise it is inconclusive. It can never carry both primary labels.","Relevant known-false control from `coordination/design/BATCH-c2a2b6/review-binding.yaml::review_plan.proves_too_much.objects`: `A profiled timing component is substituted for the unprofiled primary clock.` On paper this object is rejected by `protocol_appendix.schedule.timing_profile_audits`, `protocol_appendix.resources.boundary_fraction`, and `protocol_appendix.statistics.x_coordinate`. The profile clock is a separate count-disabled audit used for boundary fraction and perturbation sensitivity; substitution, overhead subtraction, or warmup substitution changes the estimator and must fail implementation admission. The remaining proves-too-much objects concern other assigned joints and were not adjudicated here."],"limitations":["No code, tests, fixtures, solvers, profilers, bootstrap program, calibration, conservation check, or scientific experiment was executed. All arithmetic here is protocol-level derivation from the supplied inline records; `scientific_runs` is 0.","No raw timing, count, profile, seed, bootstrap, resource, or receipt artifact exists in the supplied packet. Consequently, this report establishes neither observed pair integrity nor any empirical load, drift, slope, calibration, or significance outcome.","`coordination/design/BATCH-c2a2b6/source-bindings.json::model_verified` is false, and `coordination/design/BATCH-c2a2b6/review-binding.yaml::review_plan.inference.verification_status` remains `pending_actual_native_session_probe`. No runtime-session receipt was supplied inline. The required provider/model/reasoning/session verification must therefore be resolved by the control plane before treating this response as a fully admitted durable review artifact. This operational limitation says nothing about the science.","The supplied source hashes and snapshot commit were read as declarations in `source-bindings.json`; no filesystem or Git verification was permitted. This report does not independently establish that the inline bytes equal the archived commit or that all source paths were durably published.","The review was mutually blind. No sibling report was supplied or read, and no inference is made about arithmetic coverage, algebra/certificate legality, resource lifecycle, or the other reviewers' conclusions.","The fixed counting-before-timing order is a disclosed temporal confounder. Fresh workers, disabled SymPy cache, load rotation, and balanced profile order reduce some risks but do not prove unique causation for a time/count difference.","The exact statistical distribution or coverage of the percentile bootstrap interval is not proved here. The report audits only the preregistered resampling mechanics and classification logic; it does not claim IID sampling, nominal frequentist coverage, or a global significance test.","The `breaks` verdict is strictly the verdict on the owned `paired_measurement_and_statistics` joint's current implementation readiness. It does not approve or reject `EXP-ECDLP-ac7e8b`, change `H-ECDLP-004445`, authorize implementation or execution, or adjudicate any cryptographic claim."],"scientific_runs":0,"review_attestation":{"task_id":"TASK-20260908-020fc1","joints_owned":["paired_measurement_and_statistics"],"sources_read":["AGENTS.md","agents/validator.md","ledger/handoffs/TASK-20260908-020fc1.yaml","coordination/design/BATCH-c2a2b6/review-binding.yaml","agents/coordinator.md","docs/task-lifecycle.md","docs/dynamic-subagent-dispatch.md","ledger/hypotheses/H-ECDLP-004445.yaml","experiments/EXP-ECDLP-ac7e8b/specification.yaml","coordination/design/BATCH-28dddb/source-coverage.yaml","coordination/design/BATCH-28dddb/protocol-appendix.yaml","ledger/decisions/DEC-20260908-5f38fb.yaml","coordination/design/BATCH-28dddb/readiness-map.md","coordination/design/BATCH-28dddb/review-plan.yaml","coordination/design/BATCH-28dddb/source-packet.json","coordination/design/BATCH-c2a2b6/source-bindings.json"],"read_sibling_reports":false,"independent_session":true,"verdict":"breaks"}}}