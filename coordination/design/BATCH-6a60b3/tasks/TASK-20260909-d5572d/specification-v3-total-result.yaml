amendment:
  supersedes_for_review: coordination/design/BATCH-6a60b3/tasks/TASK-20260909-d5572d/specification-v2-finite-fixture.yaml
  scope: BATCH-local finite fixture result validation only
  execution_authorized: false
  maximum_runs: 0
  fixture_sha256: 906c904fed6e3b0d868dfa0bbae67b9e3b82067c86f7e2e07933b9c41d5d4f4c
  declared_records:
    A: {normalized_tokens: [alpha, one], explicit_refs: []}
    B: {normalized_tokens: [beta, two], explicit_refs: [A]}
    C: {normalized_tokens: [alpha, one], explicit_refs: [B]}
  derived_graph:
    edges: [[B, A], [C, B]]
    allowed_cycles: []
    required_topological_order: [C, B, A]
  controls:
    self: {pair: [A, A], numerator: 2, denominator: 2}
    known_different: {pair: [A, B], numerator: 0, denominator: 4}
    empty_union: {pair: [EMPTY, EMPTY], numerator: 1, denominator: 1, synthetic_only: true}
  result_envelope:
    exact_keys: [fixture_sha256, controls, pair_scores, candidate_flags, explicit_dependency_edges, cycle_list, topological_order]
    controls_exact_keys: [self, known_different, empty_union]
    control_values_must_equal_declared: true
    pair_scores: Every entry is [left,right,numerator,denominator] with left and right declared records, numerator and denominator nonnegative integers, denominator positive, numerator no greater than denominator, and exact equality to the set-intersection and set-union counts of declared normalized tokens.
    candidate_flags: Each pair uses two distinct declared records and is present iff its recomputed rational score is at least 4 over 5.
    explicit_dependency_edges_must_equal: [[B, A], [C, B]]
    cycle_list_must_equal: []
    topological_order_must_equal: [C, B, A]
    reject: Any absent key, extra key, unknown identifier, wrong type, failed equality, invented edge or cycle, null order, or claim-bearing field rejects the envelope.
  interpretation: Valid envelopes are fixture-local test receipts only; no duplicate adjudication, scheduling, approval, implementation, execution, scientific, or cryptanalytic conclusion is expressible.
