experiment:
  reserved_id: EXP-ECDLP-6039c2
  status: batch_local_draft
  source_hypothesis: H-ECDLP-51d69e
  execution_authorized: false
  maximum_runs: 0
  fixture_contract:
    record_array: literal finite fixture only with unique record_id, mechanism_tokens, tracked_object_tokens, and explicit_refs.
    canonicalization: UTF-8 canonical JSON array with declared SHA-256 before interpretation.
    similarity: Jaccard similarity over normalized token-set union.
    threshold: 0.8
    dependency_edges: Ordered pairs extracted only from explicit_refs that resolve to a distinct fixture record_id.
    outputs: [similarity_matrix, candidate_flags, explicit_dependency_edges, cycle_list, topological_order_or_cycle]
  controls: [self scores 1, known-different scores below 0.8, unknown record or reference rejected, cycle yields no topological order]
  interpretation:
    candidate_flags_are: adjudication inputs only
    dependency_order_is: fixture-local descriptive output only
    forbidden_conclusions: [duplicate merge, scheduling approval, implementation approval, execution approval, scientific or cryptanalytic claim]
  custody_required_before_any_run: [fixture.json, fixture.sha256, normalization.json, result.json, environment-manifest.yaml, immutable-receipt]
