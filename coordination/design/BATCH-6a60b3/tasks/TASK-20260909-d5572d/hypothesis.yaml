hypothesis:
  reserved_id: H-ECDLP-51d69e
  status: batch_local_draft
  source_idea: IDEA-20260815-634cb9
  statement: A finite, source-bound batch fixture can emit similarity flags and explicit-reference dependency relations without asserting that flagged records are duplicates or that any ordering is an approved schedule.
  mechanism: Canonical record digests bind a fixed fixture array; typed feature vectors support self and known-different controls; only explicit identifiers in declared fields form dependency edges.
  falsification: [self_control_not_maximal, known_different_control_flagged, unbound_record_or_edge_admitted, flag_or_order_interpreted_as_approval]
  scope_limits: No live corpus, duplicate adjudication, lane scheduling, implementation, execution, or ECDLP conclusion.
