review:
  task_id: TASK-20260909-326dbc
  joint: total_key_map_v5
  scope: >-
    Static, zero-run validation of whether specification-v5-key-map.yaml maps
    every permitted receipt key to one unique required value in the v4
    complete-receipt amendment, and whether its stated acceptance rule rejects
    unequal values and non-exact receipt shapes.
  checks:
    - name: fixture_sha256_mapping
      observed: >-
        receipt key fixture_sha256 maps uniquely to fixture.sha256, whose v4
        value is 906c904fed6e3b0d868dfa0bbae67b9e3b82067c86f7e2e07933b9c41d5d4f4c.
      mutation_result: Any unequal scalar value rejects under structural and value equality.
    - name: controls_mapping
      observed: >-
        receipt key controls maps uniquely to required_receipt.controls:
        self [A,A,2,2], known_different [A,B,0,4], and
        empty_union [EMPTY,EMPTY,1,1].
      mutation_result: Omission, reordering, alteration, or an empty controls mapping rejects.
    - name: pair_scores_mapping
      observed: >-
        receipt key pair_scores maps uniquely to
        required_receipt.pair_scores_exact_order, including all six ordered
        entries.
      mutation_result: Altering, omitting, appending, or reordering any score entry rejects.
    - name: candidate_flags_mapping
      observed: >-
        receipt key candidate_flags maps uniquely to
        required_receipt.candidate_flags_exact_order, [[A,C]].
      mutation_result: An empty, altered, appended, or reordered flag list rejects.
    - name: explicit_dependency_edges_mapping
      observed: >-
        receipt key explicit_dependency_edges maps uniquely to
        required_receipt.explicit_dependency_edges_exact_order, [[B,A],[C,B]].
      mutation_result: Altering, omitting, appending, or reordering an edge rejects.
    - name: cycle_list_mapping
      observed: >-
        receipt key cycle_list maps uniquely to required_receipt.cycle_list_exact, [].
      mutation_result: Any nonempty or structurally unequal cycle list rejects.
    - name: topological_order_mapping
      observed: >-
        receipt key topological_order maps uniquely to
        required_receipt.topological_order_exact, [C,B,A].
      mutation_result: Any altered, omitted, appended, or reordered order rejects.
    - name: shape_and_proves_too_much_control
      observed: >-
        The seven map keys are exactly the seven v4 receipt keys, each appears
        once, and the v5 rule accepts only a receipt mapping with exactly that
        key set and equality on every mapped value.
      mutation_result: >-
        A missing key, unknown key, or extra claim-bearing field such as
        scheduling_decision: approve rejects because the receipt key set is not exact.
  verdict: holds
  limitations:
    - >-
      This verdict concerns only the static v5 key map and equality predicate
      over the literal v4 fixture values. It does not validate a live
      duplicate-screen implementation, a corpus, scheduling, implementation
      admission, execution, or any scientific or cryptanalytic claim.
  artifact_paths:
    - coordination/design/BATCH-6a60b3/reviews/TASK-20260909-326dbc/review.yaml
review_attestation:
  task_id: TASK-20260909-326dbc
  joints_owned: [total_key_map_v5]
  sources_read:
