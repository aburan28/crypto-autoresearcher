review:
  id: TASK-20260909-55e4ee
  subject:
    hypothesis_reserved_id: H-ECDLP-51d69e
    experiment_reserved_id: EXP-ECDLP-6039c2
    scope: BATCH-local duplicate-screen source contract only
  verdict: breaks
  verdict_scope: >-
    The declared source interface does not yet mechanically close its finite
    fixture, control predicates, or result interpretation. This is not a
    duplicate finding, an administrative decision, an implementation result,
    an execution result, or a scientific conclusion.
  assigned_joint: fixture_and_control_closure
  attacks:
    - id: BRK-FIXTURE-UNBOUND
      condition: >-
        The specification requires a literal fixture and a declared SHA-256,
        but supplies neither a fixture value nor a digest, a binding field in
        a result, or a rejection rule for a result referring to another array.
      finite_counterexample:
        undeclared_record_array:
          - record_id: U
            mechanism_tokens: [alpha]
            tracked_object_tokens: [beta]
            explicit_refs: []
        claimed_output:
          candidate_flags: []
          explicit_dependency_edges: []
      consequence: >-
        Nothing in the source contract distinguishes this undeclared one-record
        array from the intended fixture before interpretation, so fixture
        membership and the fixture/result relationship are not mechanically
        testable.
      required_repair: >-
        Supply one literal fixture array, a specified canonical-JSON algorithm,
        its declared SHA-256, a typed result envelope carrying that digest, and
        a reject rule for every unequal digest or malformed record.
    - id: BRK-CONTROLS-NOT-IDENTIFIED
      condition: >-
        The self and known-different controls are prose predicates without
        record identifiers, token sets, expected score values, normalization
        output, or a result path that binds an observed score to a declared
        control pair.
      finite_counterexample:
        record_a:
          record_id: A
          mechanism_tokens: [alpha]
          tracked_object_tokens: []
          explicit_refs: []
        record_b:
          record_id: B
          mechanism_tokens: [ALPHA]
          tracked_object_tokens: []
          explicit_refs: []
        ambiguity: >-
          Because normalized is undefined, an implementation may either retain
          case and score the pair below 0.8 or case-fold it and score 1. The
          contract contains no declared known-different control whose expected
          outcome can reject either treatment.
      consequence: >-
        The stated control conditions cannot distinguish an implementation
        defect from a conforming result.
      required_repair: >-
        Declare typed control record identities within the literal fixture,
        their exact pre-normalized and normalized token sets, expected rational
        scores, a total normalization function, and failure-closed comparison
        rules.
    - id: BRK-PARTIAL-SIMILARITY-AND-RESULT-SCHEMA
      condition: >-
        The Jaccard denominator is unspecified for two empty normalized token
        sets, and the outputs list has no typed, digest-bound schema for scores,
        flags, edges, cycles, errors, or the no-topological-order condition.
      finite_counterexample:
        record_c:
          record_id: C
          mechanism_tokens: []
          tracked_object_tokens: []
          explicit_refs: []
        record_d:
          record_id: D
          mechanism_tokens: []
          tracked_object_tokens: []
          explicit_refs: []
        ambiguity: >-
          The required Jaccard score is 0/0. The contract does not prescribe
          reject, zero, one, or another error value, yet a matrix and threshold
          flag are required outputs.
      consequence: >-
        A malformed or partial output can be relabelled as a candidate flag or
        control result, preventing the planned fixture/control test from
        checking the interface.
      required_repair: >-
        Specify total token-set and Jaccard semantics including the empty-union
        case, plus a closed result schema that binds all output records to the
        fixture digest and makes malformed, unknown, or partial outcomes reject.
    - id: BRK-OVERCLAIM-GUARD-NONMECHANICAL
      condition: >-
        The interpretation section labels outputs as descriptive and lists
        forbidden conclusions, but no typed result envelope carries a fixed
        interpretation class or rejects administrative/scientific conclusion
        fields.
      finite_counterexample:
        claimed_output:
          candidate_flags:
            - [A, B]
          duplicate_merge: [A, B]
      consequence: >-
        A consumer can append a duplicate_merge field without violating a
        declared result schema because no result schema exists. The prose
        boundary therefore cannot be enforced by the proposed interface.
      required_repair: >-
        Define a closed, recursively typed result envelope with only the listed
        descriptive outputs and an explicit rejection rule for all extra fields,
        including merge, schedule, authorization, execution, and claim fields.
  control_rederivation:
    method: Derived directly from the draft specification without producer implementation or report.
    self_control: >-
      The intended self score is 1 only if the normalized set is defined and
      nonempty; the specification has no empty-set rule.
    known_different_control: >-
      No declared fixture record pair is identified as known-different, so the
      below-0.8 predicate has no reproducible input or expected output.
    cycle_control: >-
      The draft requires no topological order for a cycle but provides no
      fixture cycle, cycle representation, or typed no-order result.
  conclusion: >-
    The review breaks the source contract at the declared fixture-and-control
    joint. A repaired BATCH-local design may be reviewed again only after it
    supplies the finite, digest-bound and failure-closed artifacts named above.
    This report grants no approval of a canonical hypothesis or experiment and
    no authorization to implement or execute a screen.
  review_attestation:
    independent_session: true
    role: validator
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    assigned_joint: fixture_and_control_closure
    sources_read:
      - coordination/design/BATCH-6a60b3/review-plan-TASK-20260909-55e4ee.yaml
      - ledger/handoffs/TASK-20260909-55e4ee.yaml
      - coordination/design/BATCH-6a60b3/tasks/TASK-20260909-d5572d/hypothesis.yaml
      - coordination/design/BATCH-6a60b3/tasks/TASK-20260909-d5572d/specification.yaml
      - coordination/design/BATCH-6a60b3/tasks/TASK-20260909-d5572d/readiness.md
      - coordination/design/BATCH-6a60b3/tasks/TASK-20260909-d5572d/duplication-audit.md
    read_sibling_reports: false
    verdict: breaks
