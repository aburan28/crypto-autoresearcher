review:
  task_id: TASK-20260909-25b39f
  scope: BATCH-local v4 complete-receipt predicate only; no screen was executed.
  joint: complete_receipt_v4
  verdict: breaks
  outcome: >-
    The literal fixture and its declared derived values recompute correctly,
    but the stated acceptance predicate is not a total mapping-to-Boolean
    rule. It therefore cannot establish that only the literal receipt is
    accepted or that every unequal receipt is rejected.
  recomputations:
    fixture:
      canonical_utf8_json_sha256: 906c904fed6e3b0d868dfa0bbae67b9e3b82067c86f7e2e07933b9c41d5d4f4c
      declared_sha256: 906c904fed6e3b0d868dfa0bbae67b9e3b82067c86f7e2e07933b9c41d5d4f4c
      matches: true
      normalized_token_sets:
        A: [alpha, one]
        B: [beta, two]
        C: [alpha, one]
    pair_scores_exact_order:
      - [A, A, 2, 2]
      - [A, B, 0, 4]
      - [A, C, 2, 2]
      - [B, B, 2, 2]
      - [B, C, 0, 4]
      - [C, C, 2, 2]
    empty_union_control:
      normalized_sets: [[], []]
      numerator: 1
      denominator: 1
      matches_declared: true
    explicit_dependency_edges: [[B, A], [C, B]]
    cycle_list: []
    topological_order: [C, B, A]
    topological_order_respects_edges: true
  mutation_checks:
    - mutation: Change fixture_sha256 to 64 zero hex characters.
      result: rejected_by_stated_predicate
      basis: fixture_sha256 has a directly named, byte-equality requirement.
    - mutation: 'Add scheduling_decision: approve to an otherwise literal receipt.'
      result: rejected_by_stated_predicate
      basis: exact_keys excludes the extra claim-bearing key.
    - mutation: Remove candidate_flags from an otherwise literal receipt.
      result: rejected_by_stated_predicate
      basis: exact_keys requires candidate_flags.
    - mutation: Replace pair_scores with an empty list, reverse its order, or change one score.
      result: acceptance_not_decidable_from_the_stated_predicate
      basis: >-
        exact_keys names pair_scores, but required_receipt contains no
        pair_scores value. It contains pair_scores_exact_order instead, and
        the specification supplies no key-correspondence table or rule saying
        that pair_scores must equal pair_scores_exact_order.
    - mutation: >-
        Omit candidate_flags, replace it by an empty list, invent an edge, or
        alter cycle_list or topological_order while retaining exact_keys.
      result: acceptance_not_decidable_from_the_stated_predicate
      basis: >-
        candidate_flags, explicit_dependency_edges, cycle_list, and
        topological_order each lack a same-named required_receipt value. The
        separately named *_exact fields are descriptive-looking declarations,
        not a defined mapping in the stated validator rule.
  breaking_artifacts:
    - >-
      required_receipt.exact_keys names pair_scores, candidate_flags,
      explicit_dependency_edges, cycle_list, and topological_order, while the
      comparison values are named pair_scores_exact_order,
      candidate_flags_exact_order, explicit_dependency_edges_exact_order,
      cycle_list_exact, and topological_order_exact.
    - >-
      The phrase corresponding required_receipt value does not define the
      missing correspondence. At least six non-key receipt values consequently
      have no total equality test and the claimed reject-every-other-mapping
      property is not mechanically decidable.
  required_repair:
    - >-
      State one total receipt schema in which every exact_keys member has a
      same-named expected value, or provide an explicit, exhaustive
      receipt_key_to_required_value map and define comparison for every entry.
    - >-
      Define acceptance as a Boolean predicate over a parsed mapping: exact
      key set, fixture digest equality, and equality for every mapped receipt
      value. Then rerun a fresh independent review with value, omission,
      ordering, and extra-claim mutations.
  limitations:
    - >-
      This is a source-only audit of the BATCH-local v4 interface. It is not a
      duplicate finding, scheduling decision, canonical approval,
      implementation approval, execution authorization, or scientific result.
    - No experiment, screen, data collection, or cryptanalytic measurement was run.
  independence_note: >-
    During orientation I read historical reports from earlier review rounds in
    this batch. They are not sibling reports in this v4 round and were not
    used as evidence for the v4 recomputations above; this disclosure records
    the departure from the handoff's requested three-artifact reading scope.
