material_distinctness:
  syntactic: Full two-dimensional module algebra and simultaneous conjugation replace a single line evaluator
  recipient_requirement: Not satisfied; secret W is unnecessary for the complete finite decoding behavior
  novelty_status: unverified
exact_control:
  inputs: Public U,V,X,Y with rank(vec(I),vec(U),vec(V),vec(UV))=4
  public_operation: Solve X T=T U and Y T=T V over F_ell; normalize invertible kernel generator T by its first nonzero row-major entry
  derivation:
    - Honest X=SUS^-1,Y=SVS^-1 imply T=S C for C commuting with U,V
    - The rank predicate implies U,V generate all M2(F_ell), whose centralizer is F_ell*I
    - Hence the intertwiner kernel is F_ell*S, has dimension one, and N(T)=N(S)
    - The public H input equals the sender and finite recipient H input; XOR returns the actual chosen mu-bit message
  quantifiers: For every accepted valid key, every selected message m and every S in GL2(F_ell)
  success_probability: 1 conditional on accepted honest inputs
  secret_inputs: none
  cost: Constant-size Gaussian elimination plus one H query and serialization; polynomial bit-time in log ell and mu
  conclusion: GAP-MOD-PUBLIC-INTERTWINER; a declared complete-ring secret creates no recipient advantage for this exact pad
controls:
  - id: W-DELETION
    substitution: Replace Dec(sk,c) by the identical public-data operation; omit W entirely
    derived_result: Every accepted decryption output and rejection agrees; no smaller secret witness is required
  - id: NONCOMMUTING-IS-NOT-ENOUGH
    substitution: Require merely UV!=VU, while allowing the algebra generated by U,V to be proper
    derived_result: Mere noncommutation does not imply the full-algebra rank predicate or the uniqueness theorem. The packet uses the stronger rank test explicitly.
  - id: SCALAR-ONLY
    substitution: U=aI,V=bI
    derived_result: Rank at most one; ciphertext conjugates do not encode S; finite decoder rejects because kernel dimension is four. This control is outside the admitted rank-four key domain.
  - id: ONE-EVALUATOR
    substitution: Replace the complete ring by any mechanism furnishing the same finite U,V
    derived_result: Ciphertext and pad behavior are unchanged. More evaluation points do not repair complete-ring necessity.
  - id: FINITE-ACTION-FIBER
    substitution: theta -> theta+ell*eta for integral endomorphisms theta,eta
    derived_result: Identical action on E[ell]; a finite action does not select an integral evaluator or degree bound
    limitation: This is an element fiber, not two distinct complete rings on the same curve.
  - id: SATURATION-FIBER
    substitution: In a rank-four order O compare O with proper suborder R=Z+dO, d>1 coprime to ell
    derived_result: R and O have the same action image modulo ell, because multiplication by d is invertible modulo ell; R has smaller integral lattice and does not certify saturation
    limitation: R is deliberately not a complete End(E). This is the nearby false object showing that local action algebra alone cannot certify a complete integral ring.
  - id: COMPLETE-RING-SEPARATOR
    substitution: Hold admissible public transcript fixed and vary full-ring witnesses across admissible instances
    derived_result: No verified cross-complete-ring separator or complete-basis reconstruction supplied
    status: open GAP-MOD-INTEGRAL-SEPARATOR
  - id: PUBLIC-ENDPOINT-HASH
    substitution: Pad computed from a publicly computable endpoint or invariant
    derived_result: Public pad recovery defeats confidentiality; any proof pronouncing this recipient-only proves too much
  - id: LEAKED-WITNESS
    substitution: Reveal N(S)
    derived_result: Actual message recovers; the public solver already supplies exactly this value without a reveal
  - id: REPEATED-PROJECTIVE-COINS
    substitution: S -> aS for nonzero a in F_ell
    derived_result: Same X,Y,N(S) and pad. For independent uniform GL2 coins, same projective class probability is 1/(ell*(ell^2-1)); no security follows from rarity.
private_lift_gap:
  name: ModuleLift
  inputs: Complete evaluable W, torsion basis P,Q, U,V,X,Y
  requested_output: Normalized S plus an evaluable integral endomorphism lift gamma of projective S
  acceptance: Output action agrees projectively, descriptor and degree polynomially bounded, failure/tails quantified, pad agreement holds for every actual selected message
  status: No algorithm, selector, size bound or runtime supplied
  exact_ceiling: An integral lift cannot help the present pad because the finite normalized S is public. A pad depending on additional lift information needs a new public sender agreement interface, which is not supplied or attempted here.
obstruction:
  id: GAP-MOD-PUBLIC-INTERTWINER
  kind: Internal algebraic scoped failure; not measured closure
  quantity: Required recipient-only operation is reproduced by a public finite decoder
  measured_value: unavailable; zero runs
  resource_check:
    examined: true
    reading: Full algebra generation supplies public identifiability. It is useful for correctness and canonical transcript verification but defeats concealment of this project's conjugator pad.
  what_would_unblock: A different public sender relation with recipient-only recovery and a complete-ring separator; adding an integral label or more actions to this same normalized pad does not meet that criterion
