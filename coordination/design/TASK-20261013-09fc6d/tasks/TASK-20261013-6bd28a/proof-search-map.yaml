schema: crypto.autoresearch.proof_search_map.v1
task_id: TASK-20261013-6bd28a
candidate: simultaneous_full_module_conjugation
status: scoped_construction_gap_with_public_inverse
bottleneck: >-
  Make a public sender transcript depend on a complete ring in a way available
  to the intended recipient but not publicly recoverable, and lift any finite
  torsion action to a complete saturated evaluable End(E) basis.
baseline_embedding:
  parameter_slice: CEST line evaluator and scalar-supported BDEB controls
  reproduction_check: >-
    The changed operation uses two noncommuting matrices U,V generating
    M2(F_ell), not more samples of a scalar line action.
observation_collision:
  observable: (U,V,X=SUS^-1,Y=SVS^-1)
  distinct_preimage_search: >-
    Solve XT=TU and YT=TV. Since the centralizer of generated M2(F_ell) is the
    scalars, the solution space is F_ell*S and canonical projective
    normalization publicly recovers N(S).
  result: public inverse; recipient confidentiality contradicted for this syntax
quantifier_order:
  scoped_break: >-
    For every accepted honest key, every selected message, and every
    S in GL2(F_ell), public Gaussian elimination recovers N(S) and the message.
  endring_requirement: >-
    A successful adversary would still have to be transformed into a complete
    saturated evaluable rank-four basis; no such extractor is supplied.
constructive_transforms:
  - transform: stronger_invariant
    target: integral ring-dependent pad computable publicly by sender but not from finite transcript
    status: open_and_interface_missing
  - transform: observable_fiber
    target: separate complete integral orders sharing the same finite action
    status: open; Z+dO and O motivate the saturation ambiguity
  - transform: representation_reduction
    target: finite module action -> saturated evaluable complete EndRing
    status: open
method_ceiling: >-
  The exact normalized-conjugator mask is classically broken. Removing
  normalization or choosing additional noncommuting matrices does not restore
  secrecy when the intertwiner is recoverable. Finite action alone cannot
  certify integral saturation or an evaluable ring representation.
nearby_false_objects:
  - object: public normalized intertwiner
    expected_failure: exact public decryption
  - object: one torsion-prime action table
    expected_failure: cannot distinguish an order from a proper suborder with the same reduction
  - object: private integral lift used in the pad
    expected_failure: sender lacks that value without a new agreement primitive
formalization:
  status: deferred
  first_target: centralizer/public-intertwiner lemma over F_ell
  revisit: only after a new sender/recipient interface changes the public inverse
scientific_runs: 0
claim_boundary: break applies only to the frozen normalized-conjugator syntax; no universal module or EndRing-PKE impossibility
