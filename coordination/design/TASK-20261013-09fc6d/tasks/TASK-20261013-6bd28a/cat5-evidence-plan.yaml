schema: crypto.autoresearch.cat5_evidence_plan.v1
task_id: TASK-20261013-6bd28a
target: NIST security strength category 5
status: contradicted_for_frozen_syntax
normative_reference:
  source: NIST Post-Quantum Cryptography evaluation criteria and call for proposals
  criterion: compare all applicable attack resources against AES-256 key search using named classical and quantum metrics
immediate_disposition: >-
  No parameter choice can give Category 5 to this exact syntax because a
  polynomial-time classical public decoder wins IND-CPA with advantage 1/2.
future_variant_requirements:
  - remove the public-intertwiner recovery without making Enc require a hidden ring operation
  - supply an efficient exact EndRing key sampler and complete representation
  - prove QPT/QROM security with explicit query bounds and losses
  - enumerate classical/quantum EndRing, isogeny, finite-module, linear-algebra, multi-target and preprocessing attacks
  - count logical gates, depth, qubits, memory, data, retries, success probabilities and time-memory tradeoffs
  - include reduction loss and cold/amortized honest-party costs
acceptance_gate: >-
  First eliminate and independently review the polynomial public attack. Only
  then select parameters and compare every remaining attack after reduction
  losses against the normative Category-5 reference with explicit margin.
forbidden_shortcut: p, ell, ciphertext, or secret-key bit lengths do not imply a NIST category
scientific_runs: 0
