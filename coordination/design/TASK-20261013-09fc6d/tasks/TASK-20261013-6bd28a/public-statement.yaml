algorithms:
  KeyGen: >-
    Missing ERGen_D samples (E,W). Reduce W on P,Q; sample U,V from its span
    until I,U,V,UV span M2(F_ell). The exact finite law is stated, but no
    efficient distribution-matched sampler/certificate is supplied.
  Enc: >-
    Sample S uniformly in GL2(F_ell), compute X=SUS^-1 and Y=SVS^-1, normalize
    S projectively as N(S), and output (X,Y,m xor H(pk||X||Y||N(S))).
  Dec_reference: >-
    Solve XT=TU and YT=TV, require a one-dimensional solution space with an
    invertible representative, normalize T, and unmask. This is public.
  Dec_intended: >-
    A private ModuleLift(W,X,Y) was intended, but is unnecessary for this
    syntax and no integral lift algorithm is supplied.
