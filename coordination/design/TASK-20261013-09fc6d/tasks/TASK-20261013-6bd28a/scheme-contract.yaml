        inputs: pp; rho=(rho_ER,rho_B,rho_1,...,rho_K)
        outputs: (pk,sk) or bottom
        pseudocode: Call missing ERGen_D for (E,W). Obtain uniform ordered basis P,Q of E[ell]. Evaluate each W_i at P,Q and enumerate ell^2 linear combinations per image to find its matrix M_i. For j=1..K sample u,v uniformly in F_ell^4; U=sum u_i M_i,V=sum v_i M_i. Accept first rank(I,U,V,UV)=4 and return pk with sk=(pk,W); else bottom.
        validation: ERGen complete-basis validity is a missing certificate; verify field, curve, order/independence and rank predicates; do not treat W declaration as certification
        failure_behavior: ERGen failure, invalid W or basis returns bottom; no unbounded retry; K failed pairs return bottom
        time: T_ER+T_basis+8 evaluations+at most 8 ell^2 point combinations+K constant-size matrix rank computations; sampler/certification times unknown
        memory: M_ER+B_W+point-evaluation workspace+O(log p+log ell); streaming enumeration permitted
      - name: Enc
        inputs: valid pk; m in {0,1}^mu; random r
        outputs: c or bottom
        randomness: S uniform GL2(F_ell), obtained by uniform matrices rejected on determinant zero; r is the resulting exact finite matrix coin
        pseudocode: X=S U S^-1; Y=S V S^-1; v=m XOR H(EncodeContext(pk,X,Y,N(S))); output canonical (X,Y,v)
        validation: Canonical pk; curve/basis scope; rank(I,U,V,UV)=4; exact message length
        failure_behavior: Invalid input bottom; matrix sampling is expected terminating with explicit tail below
        time: Public-key validation+constant matrix arithmetic+one H call+serialization; no hidden action evaluation
        memory: O(log p+log ell+mu)
      - name: Dec
        inputs: sk=(pk,W); c
        outputs: m or bottom
        randomness: none
        pseudocode: Parse c; solve eight homogeneous equations X T=T U,Y T=T V in four variables. Reject unless kernel dimension one with invertible nonzero generator T. Normalize N(T) by its first nonzero row-major entry; return v XOR H(EncodeContext(pk,X,Y,N(T))).
        validation: Canonical bytes and exact lengths; matrix residues in range; invertibility and kernel dimension; invalid inputs bottom
        failure_behavior: Deterministic rejection; W is unused by this finite decoder
        time: Constant-size Gaussian elimination+one H call+O(ciphertext length) parsing
        memory: O(log ell+mu+pk length)
