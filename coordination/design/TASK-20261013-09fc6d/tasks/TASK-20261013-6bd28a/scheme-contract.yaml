    name: honest_party_algorithms
    status: open
    algorithms:
      - name: Setup
        inputs: 1^lambda and proposed pp family
        outputs: pp or bottom
        randomness: none
        validation: p and ell primes; p>3; ell odd; ell|(p+1); mu,K positive; fixed field and encoding
