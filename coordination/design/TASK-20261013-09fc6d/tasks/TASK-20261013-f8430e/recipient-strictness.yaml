schema: crypto.autoresearch.recipient_strictness.v1
task_id: TASK-20261013-f8430e
mechanism: LABELLED-NORM-HOM-LIFT
author: idea-generator-ideal-hom
classification: named_construction_gap
status: open
scope: one direct labelled smooth cyclic quotient mechanism; symbolic controls only
recipient_relation:
  public_input: pk=(E,P,Q), p,L=2^e,M=2^mu, c=canonical j endpoint
  secret_input: complete evaluable rank-four B for End(E); no other secret
  sender: a=m+Mr; K_a=<P+[a]Q>; c=j(E/K_a)
  private_operation: >-
    Construct complete Hom(E,C), a rank-four Z lattice and right End(E)-module
    by precomposition. Enumerate all separable degree-L maps with geometric
    cyclic kernel K_a for some a in [0,L). Return the complete residue set.
  ideal_operation: >-
    I_K={alpha in End(E): alpha(K)=0} is a left ideal, because beta composed
    after alpha still kills K. Constructing I_K from a supplied K differs
    from finding I_K from the quotient endpoint. No principalization oracle
    or ciphertext ideal is assumed available.
  norm: degree on Hom(E,C); positive-definite quadratic form after a complete basis and normalization are supplied
  acceptance: singleton residue set {m}; map existence or arbitrary kernel recovery does not imply actual-message recovery
  unavailable_operations: [CompleteHom_from_EndE_only, complete_degree_L_enumeration, target_twist_and_isomorphism_normalization, efficient_exact_kernel_label_recovery]
  extra_recipient_secrets: []
  known_smaller_interface: finite public endpoint-fiber enumeration
  intended_strictness_claim: source ring permits efficient exact residue recovery that identical public data do not permit
  claim_status: not_established
material_distinctness:
  baseline: A=psi(P), R=[r]P; Dec obtains psi(R)=[r]A; behavior factors through EvalLine_(P,A)
  first_changed_operation: invert j(E/K_a) to a complete message-labelled norm-L kernel fiber
  normalized_difference: no evaluation of one retained endomorphism on R; no transfer point, endpoint hash, or ciphertext-mask rewrap
  ceiling: changing operation type does not establish a construction, secrecy, full-ring necessity or novelty
controls:
  - id: PUBLIC-DATA
    substitution: delete B; retain identical p,E,P,Q,L,M,c
    derivation: >-
      For every a in [0,L), compute K_a, its degree-L quotient, and compare j
      bytes with c. Collect a mod M. This gives exactly the finite reference
      decoder and uses O(L) sender evaluations, independently of End(E).
    interpretation: a polynomial-size L makes this control polynomial; a large L leaves efficient source-ring advantage unestablished
    failed_claim_step: ring declaration alone cannot justify recipient-only functionality
    measured: false
  - id: SMALLER-HOM-WITNESS
    substitution: supply one evaluable degree-L phi:E->C with kernel K_a
    derivation: >-
      Compute phi(P),phi(Q). Since K_a intersects <Q> trivially, phi(Q) has
      order L; solve phi(P)+[a]phi(Q)=0 in the smooth cyclic group to recover
      a and its residue. Digit recovery is available once this smaller map
      is supplied; it does not require complete End(E).
    interpretation: one map can recover a label; it cannot certify that every endpoint-compatible label has the same message residue
    failed_claim_step: successful one-challenge decoding is not complete-ring identification
    missing_separator: proof that every efficient complete-fiber decoder yields a full evaluable End(E) basis on the same challenge
    measured: false
  - id: SCALAR-ONLY
    substitution: replace the private operation with scalar multiplication maps
    derivation: >-
      Scalar multiplication [d] is public and degree d^2. For d>1 coprime to p,
      its geometric kernel is E[d], not a cyclic order-d^2 K_a. Hence scalars
      do not implement the proposed cyclic quotient decoder. On the CEST
      scalar slice psi=[s], psi([r]P)=[r]psi(P) is public scalar transfer.
    interpretation: scalar nonapplicability establishes neither non-scalar hardness nor a Hom decoder
    failed_claim_step: a proof declaring the scalar CEST slice confidential has ignored the public substitute
    measured: false
  - id: OBSERVATION-FIBER
    substitution: hold pk and exact c bytes fixed; vary all a with j(E/K_a)=c
    derivation: >-
      The secret B is independent of sender m,r. If two such a,a' have
      different residues modulo M, deterministic Dec receives the same
      (sk,c) for both messages and cannot return both. Randomized Dec likewise
      cannot achieve perfect correctness for both identical-input cases.
    interpretation: a cross-message collision refutes perfect correctness for those exact coins; rare collisions need a quantified error bound
    failed_claim_step: selecting one norm-L witness instead of the complete fiber can return the wrong selected message
    separator_status: no general message-fiber separation theorem or negligible bound supplied
    measured: false
  - id: RING-REPRESENTATION-FIBER
    substitution: vary complete certified bases B,Bprime for the same End(E) and fixed public transcript
    derivation: >-
      A semantically correct exact decoder must return the same residue set
      for every complete basis. Distinct bases of the same ring are not
      distinct mathematical rings and do not provide a ring-identifying
      separator. The fiber is already determined by public pk and c.
    interpretation: secret representation independence is correctness, not an extractor for an unknown complete basis
    missing_separator: a typed algorithm converting attacker behavior to a complete ring, not an observation of basis dependence
    measured: false
  - id: LEAKED-LABEL
    substitution: disclose a or kernel generator to the observer
    derivation: a mod M is the selected message; confidentiality fails immediately
    failed_claim_step: a proof whose simulation includes secret-correlated label advice proves a weakened game
    measured: false
  - id: NONCOMMUTING-MODULE
    substitution: ask whether this endpoint transcript determines noncommuting ring actions or a full right-module basis
    derivation: >-
      The ciphertext contains one canonical j, without action matrices,
      orientation or multiplication constraints. No such determination is
      supplied. Adding these objects would change the proposed mechanism
      and adversarial view, and is outside this single-attempt packet.
    interpretation: Hom terminology does not establish full-module observability
    measured: false
strictness_acceptance:
  - polynomial source-ring-only decoder with exact completeness and failure laws
  - no connecting map, target ring, kernel label, ideal, or secret-correlated advice hidden in its inputs
  - identical public-data and smaller-witness controls quantified under the same key distribution
  - full-ring extractor or an explicit acknowledgement that the assumption remains smaller
  - actual-message fiber bound for every admissible selected message
cost_axes:
  public_reference: L quotient evaluations; streaming memory one map, endpoint and residue accumulator
  supplied_one_map: two point evaluations plus smooth discrete-log digit recovery and verification
  intended_recipient: Hom construction, complete norm search, target-model conversions and all kernel checks unbounded
  setup: finite certified-key enumeration has no polynomial bound; cost cannot be hidden in reusable preprocessing
  targets: one; amortization over additional targets unclaimed
outcome:
  strict_recipient_established: false
  complete_ring_necessity_established: false
  actual_message_correctness_established: false
  universal_obstruction_established: false
  earliest_named_gap: LABELLED-NORM-HOM-LIFT plus exact message-fiber completeness
  next_discriminating_obligation: one complete source-ring-only decoder and smaller-witness separator, with per-message correctness bound
scientific_runs: 0
dominated_by: n/a (no result claimed)
sota_delta: no attack/performance advantage claimed; symbolic interface/control contribution only
