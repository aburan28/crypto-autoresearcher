schema: crypto.autoresearch.proof_search_map.v1
task_id: TASK-20261013-f8430e
candidate: LABELLED-NORM-HOM-LIFT
status: scoped_construction_gap
bottleneck: >-
  Construct, from a complete evaluable End(E) basis and a quotient endpoint C,
  the complete Hom(E,C) module and every degree-L kernel label, then prove that
  the endpoint fiber has one message residue and extract a complete EndRing
  solution from any QPT message distinguisher.
baseline_embedding:
  parameter_slice: CEST public-line transfer psi([r]P)=[r]psi(P)
  reproduction_check: >-
    The attempted quotient sender uses K_a=<P+[a]Q> and publishes j(E/K_a);
    it does not invoke EvalLine, an endpoint hash, or a hidden sender ring.
observation_collision:
  observable: canonical j(E/K_a)
  distinct_preimage_search: >-
    Hold the endpoint fixed and enumerate all a in [0,L). Any a,a' with
    distinct residues modulo M and equal endpoints refute correctness for
    those coins. No negligible collision bound is established.
quantifier_order:
  desired: >-
    For every accepted key and every admissible m, over uniform r, Dec must
    return that m except with negligible probability. A reduction receives a
    bare EndRing challenge before choosing public coins and may use only the
    adversary transcript to output a complete evaluable saturated rank-four
    basis.
  current_failure: >-
    The Hom lift, fiber bound, and adversary-to-EndRing extractor are absent;
    an EndRing solver enabling decryption is the reverse direction.
constructive_transforms:
  - transform: stronger_invariant
    target: a canonical complete degree-L kernel-fiber invariant recoverable only from End(E)
    status: open
  - transform: observable_fiber
    target: exhibit or exclude cross-message endpoint collisions under the exact key law
    status: open
  - transform: representation_reduction
    target: typed polynomial conversion End(E),C -> complete Hom(E,C) -> labels -> complete EndRing extractor
    status: open
method_ceiling: >-
  Public O(L) enumeration solves the finite syntax when L is polynomial. One
  Hom map, one quotient preimage, or message recovery does not identify a
  complete saturated End(E) basis. A proof stopping there supports only a
  smaller intermediate assumption.
nearby_false_objects:
  - object: public exhaustive endpoint-fiber enumeration
    expected_failure: no recipient asymmetry
  - object: challenge-specific degree-L Hom witness
    expected_failure: smaller witness than complete EndRing
  - object: scalar-only endomorphism basis
    expected_failure: cannot provide the missing connecting Hom module
formalization:
  status: deferred_missing_definition
  first_target: LabelledNormHomLift functionality and singleton-residue lemma
  revisit: after exact efficient algorithm and distribution-matched sampler exist
scientific_runs: 0
claim_boundary: no theorem, PKE, novelty, quantum-security, Cat-5, or impossibility result
