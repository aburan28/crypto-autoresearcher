schema: crypto.autoresearch.cat5_evidence_plan.v1
task_id: TASK-20261013-f8430e
target: NIST security strength category 5
status: unestablished
normative_reference:
  source: NIST Post-Quantum Cryptography evaluation criteria and 2016 call for proposals
  inspected_local_captures:
    - nist-security-criteria.html
    - nist-evaluation-criteria.html
    - nist-call-for-proposals-2016.pdf
  criterion: >-
    Any attack must require computational resources comparable to or greater
    than those required for key search on a block cipher with a 256-bit key;
    comparisons must name classical and quantum resource metrics.
  preliminary_reference_values: >-
    The current criteria page provides 2^272 classical gates and
    2^298/MAXDEPTH quantum gates as preliminary comparison guidance; these are
    reference accounting inputs, not a category certification.
required_attack_portfolio:
  - best classical and quantum supersingular EndRing/OneEnd/isogeny attacks under the exact key law
  - public O(L) endpoint enumeration and all time-memory tradeoffs
  - endpoint-fiber and exceptional-automorphism attacks
  - multi-target, preprocessing, batch, and amortized attacks
  - attacks exploiting public torsion bases, validation, retries, or malformed encodings
  - reduction loss from PKE advantage to the exact hard problem
required_resources:
  - logical gate count and circuit depth
  - qubits/quantum memory and classical memory
  - success probability and repetitions
  - data/query counts, targets, preprocessing, and wall-clock assumptions
  - cold and amortized keygen/encryption/decryption costs
acceptance_gate: >-
  Select no parameters until algorithms and the correct reduction exist. Then
  independently reproduce every dominant attack, include reduction and
  multi-target losses, and show all applicable classical and quantum metrics
  meet the normative category-5 comparison with an explicit margin.
current_blockers:
  - no complete efficient PKE
  - no hardness distribution theorem
  - no attacker-to-EndRing reduction or loss
  - public enumeration dominates when L is polynomial
  - no concrete parameter or attack-resource estimate
forbidden_shortcut: field or key bit length alone does not establish Category 5
scientific_runs: 0
