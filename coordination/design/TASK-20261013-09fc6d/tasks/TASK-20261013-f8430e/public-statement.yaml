schema: crypto.autoresearch.public_statement.v1
task_id: TASK-20261013-f8430e
name: LABELLED-NORM-HOM-LIFT
status: construction_gap
parameters:
  field: F_(p^2), p>3
  torsion: L=2^e divides p+1; M=2^mu divides L
  public_key: canonical supersingular E and ordered basis P,Q of E[L]
  secret_key_target: complete efficiently evaluable saturated rank-four basis of End(E)
  message_space: integers m in [0,M)
algorithms:
  KeyGen: >-
    Finite reference sampler enumerates certified (E,End(E),P,Q) tuples and
    samples one by capped unbiased indexing. No polynomial sampler or hardness
    equivalence is established.
  Enc: >-
    Sample r uniformly in [0,L/M), set a=m+M*r, K_a=<P+[a]Q>, compute the
    degree-L quotient, and output the canonical bytes of j(E/K_a).
  Dec_reference: >-
    Enumerate all a' in [0,L), recompute the endpoint, collect a' mod M for
    exact matches, and return the unique residue or bottom. This is public and
    costs O(L) quotient evaluations.
  Dec_intended: >-
    Missing LabelledNormHomLift(E,End(E),P,Q,L,C): construct complete Hom(E,C),
    enumerate all norm-L maps/kernels, and return the unique label residue.
correctness:
  exact_condition: >-
    For every accepted key and message m, success probability over r is the
    mass of endpoint fibers whose labels all have residue m modulo M.
  bound: unestablished
  failure: any cross-message endpoint collision for the sampled a
security_games:
  base: QPT IND-CPA in the standard model; q_H=0
  active_target: QPT IND-CCA2 with classical Dec queries and exact canonical-byte challenge exclusion
  theorem: none
  named_intermediate: LABELLED-QUOTIENT-IND
  missing_arrow: successful QPT distinguisher -> complete evaluable EndRing(E)
complete_view:
  - p,L,M,E,P,Q and all canonical encodings
  - every ciphertext endpoint and repetition/equality relation
  - validation, rejection, retry, timing, and exceptional-automorphism behavior
  - no orientation, ideal, connecting path, target ring, or Hom witness is hidden in the public key
costs:
  encryption: e degree-two quotient steps plus representation conversion
  public_reference_decryption: O(L*e) degree-two steps
  intended_decryption: unknown; complete Hom construction and norm enumeration unpriced
  key_generation: finite but not polynomially bounded
  memory_and_output: endpoint O(log p) bits; complete ring descriptors and preprocessing unknown
obligations: {O1: open, O2: open, O3: open, O4: open, O5: open, O6: open}
inference:
  requested: anthropic:claude-sonnet-5-5 high via research-deep, unverified
  actual: gpt-6.1-sol high native fallback
  fallback_used: true
  model_verified: false
scientific_runs: 0
