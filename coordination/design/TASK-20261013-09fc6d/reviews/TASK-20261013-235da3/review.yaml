verdict_semantics: >-
  Verdicts apply only to the assigned positive simulation/extraction joints in
  the frozen packets. Inconclusive means an exact efficient simulator is not
  established. Breaks on J4 means the submitted security implication has no
  typed attacker-to-complete-ring reduction. It is not a nonexistence theorem.
  Both producers explicitly returned gaps; this review does not attribute a
  positive EndRing security theorem to either producer.
joint_verdicts:
  J3:
    verdict: inconclusive
    scope: Neither packet supplies the complete efficient exact-law simulator; public conditional pieces can be checked.
  J4:
    verdict: breaks
    scope: Neither submitted packet supplies the required attacker-to-complete-evaluable-saturated-EndRing implication.
per_candidate:
  TASK-20261013-f8430e:
    name: LABELLED-NORM-HOM-LIFT
    producer_gap_boundary_supported: true
    J3:
      verdict: inconclusive
      earliest_gap: M1-J3-EXACT-KEY-LAW
      location: coordination/design/TASK-20261013-09fc6d/tasks/TASK-20261013-f8430e/public-statement.yaml:12
      finding: >-
        The public statement says to enumerate certified (E,End(E),P,Q)
        tuples and sample one. The scheme contract at line 43 instead calls
        D_cert uniform certified E followed by uniform ordered torsion basis,
        and attributes its exact definition to that statement. The referenced
        statement contains no certificate grammar, table construction,
        deduplication rule, canonical certificate selector, or precise index
        sampler. Uniform tuples and uniform curves need not agree when the
        number of admissible ring certificates varies. The three-index cap
        and abort bound in scheme-contract.yaml:63 do not resolve this law.
      simulator_input: Bare E from the declared D_cert marginal and independent public coins; no B or connecting-map advice.
      available_piece: >-
        Given correctly distributed E,P,Q, m0,m1 and public b,r, the simulator
        can compute a=m_b+M*r and j(E/<P+[a]Q>) exactly as Enc does. Public
        pairings and repeated encryption are functions of the same public
        data. No secret ring input is needed for this conditional piece.
      unavailable_piece: >-
        Exact efficient conditional torsion-basis sampling, accepted-key mass
        and cap/abort law, and polynomial real-key sampling are not supplied.
        In the active game the public exhaustive reference decoder can define
        answers in O(L) quotient evaluations, but this is not polynomial in
        log L in general and is not an efficient simulator for the missing
        intended Hom decoder and its errors.
      auxiliary_data_audit: >-
        The frozen public tuple discloses field, E,P,Q,L,M, pairings,
        endpoints and equality information. Adding a kernel label, ideal,
        connecting path, target ring or complete Hom basis changes this view.
        Sender-known a is not public advice; a mod M reveals the message.
      adaptive_repeated_malformed_views: >-
        Noncanonical j residues, alternate lengths and trailing bytes reject
        under the stated grammar. Accepted j has one encoding, so a second
        accepted spelling is not silently excluded. Repeated equal endpoints
        must yield the same complete residue-fiber response; cross-message
        fibers cannot be resolved by choosing a convenient preimage. The
        intended decoder's failures, timing and adaptive responses remain
        unspecified. No timing/physical security claim is discharged.
      acceptance: >-
        Supply one unambiguous exact D_cert law and polynomial public
        conditional sampler, then a complete simulator with matching parser,
        accepted-key conditioning, aborts and every allowed adaptive reply.
    J4:
      verdict: breaks
      earliest_gap: M1-J4-IND-TO-SEARCH
      location: coordination/design/TASK-20261013-09fc6d/tasks/TASK-20261013-f8430e/reduction-ledger.yaml:40
      attacker_output: One IND guess bit; advantage is absolute success probability minus one half.
      required_output: Four efficiently evaluable endomorphisms forming the complete saturated End(E) lattice on that same E.
      finding: >-
        R2 has no algorithm converting a successful message-partition
        distinguisher into a label, kernel or Hom map. R3 independently lacks
        a conversion from any such smaller witness to a complete ring.
        EndRing-to-intended-decryption is explicitly the reverse attack
        direction, and is itself conditional on the missing Hom lift.
      representation_and_rank: >-
        A degree-L map E->C is not an endomorphism of E merely because C has
        the challenge ciphertext j. Its dual composite is [L], a scalar.
        Recovering one label, one map, or the full message-residue fiber gives
        no rank-four independence, integral multiplication, saturation or
        evaluator serialization certificate. A discriminant-p^2 certificate
        can establish maximality only after an actual integral order embedded
        in End(E), with identity, closure and correct trace pairing, is proved.
      loss: >-
        No L_red, delta, extraction probability, accepted-key coverage,
        abort/tail bound, conversion cost or polynomial output bound is
        supplied. Writing the desired inequality at reduction-ledger.yaml:93
        does not prove it. No numerical loss is inferred.
      acceptance: >-
        Give a uniform solver on the exact bare challenge law using the IND
        adversary, prove each search/conversion hop and its probability, and
        verify a complete evaluable saturated basis for that same curve.
  TASK-20261013-6bd28a:
    name: simultaneous_full_module_conjugation
    producer_gap_boundary_supported: true
    J3:
      verdict: inconclusive
      earliest_gap: M2-J3-EXACT-PUBLIC-TORSION-SAMPLER
      location: coordination/design/TASK-20261013-09fc6d/tasks/TASK-20261013-6bd28a/scheme-contract.yaml:99
      simulator_input: Bare (p,E) under the stated model law and independent public coins; no W.
      finding: >-
        An efficient exact public ordered torsion-basis sampler and its
        acceptance/cost certificate are absent. ERGen_D is an earlier honest
        KeyGen gap, but the simulator already receives E and need not recover
        W just to sample finite public matrices. That distinction prevents
        treating secret key generation as a necessary simulation operation.
      conditional_action_law_derivation: >-
        Under the stated premise that W is a complete geometric End(E)
        basis and ell differs from p, restriction to E[ell] has kernel
        ell*End(E): an endomorphism killing E[ell] factors through the
        separable quotient [ell]. Thus End(E)/ell*End(E) injects into
        End_Fell(E[ell]); both have ell^4 elements, so it is an isomorphism.
        Consequently W's four action matrices form a basis. Independent
        uniform coefficient vectors give independent uniform U,V. Publicly
        sampling those matrices and applying the same rank test, attempt cap
        and first-success rule matches that finite law without W. This is a
        conditional algebraic derivation, not a sampler implementation or a
        certificate that ERGen actually outputs valid W.
      available_piece: >-
        Once the exact public basis law is supplied, challenge conjugation,
        matrix rejection and every classical finite Dec reply use public
        data. A consistent externally provided H yields the same pad and
        replies. This does not supply a standalone QROM simulation theorem;
        J5 owns that model question.
      adaptive_repeated_malformed_views: >-
        Finite Dec ignores W on honest and malformed inputs alike. The same
        parser, linear-system dimension test and invertibility test therefore
        reproduce every classical adaptive reply, including bottom. Exact
        challenge bytes alone are excluded. Noncanonical residues, lengths,
        tags, padding and trailing bytes reject. Replacing S by a nonzero
        scalar multiple preserves X,Y,N(S) and the pad; repeated projective
        coins retain that equality. Pairing-visible data follow the public
        torsion basis and are not an omitted private channel.
      scope_limit: >-
        These finite conditional checks do not discharge O1/O6 globally or
        prove a positive security theorem. Accepted-key probability, precise
        efficient sampling and implementation observables remain open.
    J4:
      verdict: breaks
      earliest_gap: M2-J4-FINITE-ACTION-TO-INTEGRAL-EVALUATOR
      location: coordination/design/TASK-20261013-09fc6d/tasks/TASK-20261013-6bd28a/reduction-ledger.yaml:53
      attacker_output: An IND guess bit; the explicitly public intermediate solver returns only N(S) over F_ell.
      required_output: A complete polynomial-size evaluable saturated rank-four End(E) basis on the input E.
      finding: >-
        MOD-CONJ-REC has a public finite solver and is not a hardness
        assumption. Its normalized conjugator is not an integral
        endomorphism descriptor. The packet supplies neither a bounded
        evaluable lift nor an attacker-to-OneEnd or complete-ring extractor.
        Public recovery of the frozen pad does not itself solve EndRing.
      saturation_control: >-
        For a rank-four order O and d>1 coprime to ell, R=Z+dO is a unital
        proper suborder with the same finite action image: choose k with
        kd=1 mod ell, so kd*x in R agrees with x on E[ell]. The integral
        lattices differ even though their finite action images agree.
        Also theta and theta+ell*eta have the same action. These controls
        invalidate certification of integral saturation or an evaluator
        from the finite image alone. R is not a second complete End(E) on
        the fixed curve; this is not a universal impossibility proof.
      loss: >-
        The finite solver succeeds on every accepted honest instance, but
        that probability cannot be substituted for complete-ring extraction
        probability. Integral lift, rank, saturation, representation, challenge
        coverage and total conversion/output costs all lack bounds.
      acceptance: >-
        Provide a correctly directed same-challenge extractor with explicit
        success/loss and complete representation certificates. The finite
        pad's public recoverability cannot serve as that missing theorem.
extraction_contract:
  quantifiers: For every allowed successful scheme attacker A, construct a uniform solver B receiving the exact bare EndRing challenge first.
  permitted_inputs: Challenge, independent public coins and allowed attacker/oracle interaction only.
  required_verification:
    - Actual self-maps of the same challenge curve, with valid extension-field evaluators.
    - Four Z-independent outputs, identity and integral multiplication closure.
    - Saturation/maximality and equality to the full geometric End(E), not only a full-rank suborder.
    - Polynomial descriptor, degree-logarithm, evaluation, conversion, verification and output bounds.
  probability_accounting: >-
    A valid bound must include accepted-key mass and challenge coverage,
    simulation error, aborts, attacker-to-witness losses and every subsequent
    conversion. Conditional success cannot be multiplied as independent
    success without justification; condition on the actual transcript. An
    inequality Adv(A)<=L*Succ(B)+delta requires proved L and delta.
  adaptive_OneEnd_boundary: >-
    Neither packet invokes a supplied adaptive bounded-OneEnd compiler. The
    declared predecessor source ledger reports an EndRing reduction using
    polynomially many internally generated bounded-OneEnd instances, not a
    theorem from one action matrix or one endpoint-specific preimage. Every
    reached query curve, degree/representation bound, prefix-dependent law,
    failure accumulation and stopping cost would need coverage. The primary
    article was not newly retrieved in this fixed-input review.
proves_too_much:
  method: Symbolic application of the same claimed implication; no execution or parameter search.
  controls:
    - object: Scalar-only CEST/hashed-DH slice with public line evaluator
      result: holds
      worked_check: >-
        Fix A=psi(P), R=[r]P and publicly supply the line evaluator. It
        supplies psi(R)=[r]A, hence the mask input without a complete ring.
        The scalar subcase has public multiplication when the scalar is
        public. A hidden scalar is not assumed recoverable merely from A.
      exact_failure_step: Recipient-only secrecy and evaluator-to-complete-ring extraction; a correctness identity supplies neither.
      candidate_application: M1's different quotient operation is not refuted by this control; M2's finite public decoder already exhibits the same smaller-interface ceiling.
    - object: Public endpoint-hash mask where anyone computes recovery
      result: holds
      worked_check: Anyone with the ciphertext endpoint and public context computes the identical hash pad; actual-message recovery contains no ring witness.
      exact_failure_step: Public pad knowledge cannot imply recipient-only confidentiality or be promoted to a full-ring extractor.
      candidate_application: M1 does not use this mask. M2's pad similarly factors through the public normalized conjugator.
    - object: Complete ring secret declared but Dec factors through one evaluator
      result: holds
      worked_check: Replace the ring by an oracle implementing exactly that evaluator, including its domain and errors; every reachable decryption transcript is unchanged.
      exact_failure_step: The undeclared evaluator-to-saturated-basis conversion; success at decryption does not provide it.
      candidate_application: M1 requires a separate Hom/preimage-to-ring proof. M2 is stronger as a null control because its finite Dec ignores the ring altogether.
    - object: An unauthenticated mask syntax with the predecessor's scoped CCA2 malleability
      result: holds
      worked_check: >-
        For the frozen predecessor c=(R,v), replacing v by v XOR a nonzero
        Delta preserves its stated validation and gives different bytes.
        Its decryption result changes by the same Delta, contradicting the
        claimed active implication under exact-byte challenge exclusion.
      exact_failure_step: IND-CCA2 implication and simulation of permitted related-ciphertext replies; excluding the whole endpoint class changes the game.
      candidate_application: This predecessor control does not transfer to M1's unmasked j syntax. M2 also has an unauthenticated XOR component, though its passive public decoder already suffices.
    - object: Leaked label, evaluator or secret-correlated advice
      result: holds
      worked_check: M1 disclosure of a exposes a mod M; M2 disclosure of N(S) gives the pad, which is already public. Giving W, a Hom witness or a hidden connecting path is not independent public randomness.
      exact_failure_step: Challenge-simulation input law; a reduction may not assume the answer or alter the auxiliary distribution.
proof_architecture_challenges:
  observation_fiber: >-
    M1 identical endpoints may have distinct message residues; no collision
    existence is claimed here, and no negligible fiber-error bound is supplied.
    Different bases of the same End(E) are not different complete rings.
    M2's finite action/suborder control is an explicit saturation test with
    that same limitation stated.
  quantifier_order: The challenge is supplied before public coins and extractor witnesses; neither unknown W nor a successful-label adviser may be selected after observing the challenge.
  method_ceiling: A finite residue, label, conjugator, evaluator or Hom map is the stopping output unless its next typed conversion is actually proved.
  resource_reversal: >-
    M2's full action algebra can support finite transcript identification
    under its stated hypotheses, even though it does not certify an integral
    ring. M1's exact public fiber definition specifies what a future decoder
    would have to recover. Neither observation is a new construction, spawned
    task or scientific transition.
  spawned_ids: []
