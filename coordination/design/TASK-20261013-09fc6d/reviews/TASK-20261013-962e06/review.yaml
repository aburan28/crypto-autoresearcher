    abstracts are attributed to those abstracts, not independently audited
    proofs. No live retrieval or knowledge-MCP search was performed because
    this review was restricted to declared committed inputs and the decision
    was complete with source gaps left open.
  sources:
    - source: Seta, ePrint 2019/1291
      provenance: retrieved
      verified_by: validator-correctness-novelty
      inspected_extent: Retained primary-site title-search result and truncated abstract only.
      normalized_interface: Abstract describes a trapdoor one-way-function family using a starting-curve endomorphism and torsion images to recover an isogeny.
      limit: Exact public/secret inputs, encodings, algorithms and assumptions were not read. M1 is adjacent to trapdoor quotient inversion; neither sameness nor nonduplication is established.
    - source: SiGamal/C-SiGamal, ePrint 2020/613
      provenance: retrieved
      verified_by: validator-correctness-novelty
      inspected_extent: Retained primary-site metadata and full abstract.
      normalized_interface: CSIDH with an auxiliary order-2^r point; ElGamal-like and compressed variants; abstract attributes IND-CPA without hashes to P-CSSDDH, an image-point distinguishing assumption.
      limit: This identifies an assumption/interface comparison target, not an EndRing equivalence. Full algorithm normalization is absent.
    - source: LIT-SiGamal, ePrint 2024/521
      provenance: retrieved
      verified_by: validator-correctness-novelty
      inspected_extent: Retained primary-site metadata and full abstract.
      normalized_interface: Replaces the CSIDH-based auxiliary-point diagram by a commutative LIT diagram with large horizontal and lower-degree vertical isogenies.
      limit: Diagram description alone cannot compare exact decoding, secret representation, reductions or duplication for either candidate.
    - source: Updatable PKE, ePrint 2020/1593
      provenance: retrieved
      verified_by: validator-correctness-novelty
      inspected_extent: Retained primary-site metadata and full abstract.
      normalized_interface: Distinguishes symmetric/asymmetric key updates; describes a partial SIDH construction and a CSIDH symmetric construction requiring known class-group structure.
      limit: Update functionality and source limitations do not identify an EndRing PKE reduction or prove either candidate novel.
  internal_controls:
    CEST: Public A=psi(P), R=[r]P; recipient psi(R)=[r]A. Decryption depends on EvalLine, not a demonstrated complete-ring separator. Prior accepted-key O3 discharge remains scoped.
    scalar_BDEB: Public bounded scalar enumeration recovers the sampled map while ignoring the complete ring. Binding one map through many points does not establish complete-ring necessity.
  provenance_discrepancies:
    - M2 candidate.md claims SiGamal/C-SiGamal fulltext inspection, but its committed source-ledger says abstract-level only and contains no corresponding fulltext capture. This review does not inherit that unsupported fulltext extent.
    - M1 and M2 source-ledger kb/retrieved entries omit per-entry verified_by; named producer authorship is not a substitute for a source-level verification record. Their entries cannot independently discharge novelty.
    - Primary PDF HTTP-403 failures are producer-reported; this reviewer made no retrieval attempt and does not report them as personal observations.
