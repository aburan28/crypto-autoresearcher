per_candidate:
  - task_id: TASK-20261013-f8430e
    name: LABELLED-NORM-HOM-LIFT
    joints:
      J1:
        verdict: inconclusive
        earliest_gap: >-
          O2 Setup/KeyGen precedes the missing recipient lift. The packet calls
          D_cert an exact finite certified-key distribution and repeatedly
          points to public-statement.yaml for its definition, but that file
          supplies only an enumeration outline. The certified table, descriptor
          language, certificate verifier, exact indexing law and nonempty
          support are not specified there. No polynomial distribution-matched
          key sampler or accepted-key failure bound is established.
        public_secret_trace: >-
          Public p,L,M,E,P,Q and sender m,r suffice for a=m+Mr,
          K_a=<P+[a]Q> and c=j(E/K_a). The generator has order L since its P
          coefficient is one. Enc needs no End(E) witness. The only declared
          recipient secret is a complete evaluable basis B of End(E).
        correctness_derivation: >-
          Define F(c)={a in [0,L):j(E/K_a)=c} and R(c)={a mod M:a in F(c)}.
          An honest a belongs to F(c). The reference decoder returns the
          actual m exactly when R(c)={m}; otherwise it returns bottom. For
          fixed accepted pk and selected m, success equals
          (M/L)*sum_{r=0}^{L/M-1} 1[R(j(E/K_(m+Mr)))={m}]. This identity
          holds for every admissible message but is not a negligible-error
          bound. No collision witness was constructed and no universal
          collision assertion is made.
        failure_parser_and_retry: >-
          Fixed-width field coefficients outside [0,p), wrong lengths and
          trailing bytes are rejected. Honest quotient endpoints have valid
          field encodings. Empty or multiple-residue fibers reject. No
          encryption retry is declared; repeating encryption cannot repair
          an unrecognized collision. Same j includes isomorphic targets and
          possible model/twist ambiguity; these are part of the endpoint
          fiber and must also be covered by any Hom decoder. The asserted
          capped-index KeyGen abort bound is not independently discharged
          without the missing detailed sampler.
        honest_efficiency: >-
          The supplied kernel permits an e-step degree-two quotient chain.
          The public reference decoder performs L such quotient evaluations,
          hence is not polynomial in log L in general. Constructing complete
          Hom(E,C) from only End(E), selecting target models, enumerating the
          complete norm-L fiber and bounding output/time remain missing.
          Naming LabelledNormHomLift does not supply these algorithms.
        full_ring_strictness: >-
          Deleting B leaves the finite reference behavior unchanged; when L
          is polynomially bounded, this identical public operation is already
          polynomial. A supplied degree-L map with kernel K_a permits recovery
          of a from phi(P)+[a]phi(Q)=0: phi(Q) has order L because K_a meets
          <Q> trivially, and L is smooth. One map recovers one label, not a
          complete fiber or complete End(E). Distinct bases of the same ring
          do not constitute a separator across complete rings. No efficient
          recipient-only advantage or complete-ring necessity is established.
        obligation_statuses: {O2: open, O3: open, O4: open}
        next_checkable_obligation: >-
          Specify the actual key law and sampler, then a polynomial
          source-ring-only decoder agreeing with the complete residue fiber
          and a per-message error bound. Supply a smaller-witness separator;
          a single recovered isogeny is insufficient evidence of full-ring
          necessity. No run or successor is authorized by this review.
      J2:
        verdict: inconclusive
        material_distinctness: >-
          The changed operation is inversion of a message-labelled cyclic
          quotient endpoint. CEST evaluates one retained map on a scalar line;
          scalar BDEB binds a bounded self-map through public evaluations.
          Neither is the same sender/recipient syntax. A missing Hom inversion
          algorithm prevents this operation change from establishing a new
          recipient mechanism. Scalar maps have degree d^2 and noncyclic
          kernel E[d] for d>1 prime to p, so they do not instantiate this
          cyclic quotient decoder; this excludes only that control.
        novelty: unverified
        earliest_gap: Complete normalized primary constructions for Seta, SiGamal/C-SiGamal, LIT-SiGamal and UPKE were not supplied/read; metadata cannot establish nonduplication.
  - task_id: TASK-20261013-6bd28a
    name: simultaneous_full_module_conjugation
    joints:
      J1:
        verdict: breaks
        earliest_gap: >-
          O2 first calls the missing distribution-matched ERGen_D. Its
          canonical descriptor selector, efficient ring certificate, torsion
          sampler and acceptance guarantees are not supplied. Independently,
          the claimed private recovery is contradicted by the public
          intertwiner computation on every accepted key.
        public_secret_trace: >-
          Enc uses public U,V and sampled invertible S to form X=SUS^-1,
          Y=SVS^-1 and a pad depending on N(S). It uses no hidden ring action.
          W is never accessed by the specified finite decoder and can be
          removed without changing any output or rejection.
        correctness_derivation: >-
          For honest X,Y write T=SC. Then XT=TU and YT=TV are equivalent to
          UC=CU and VC=CV. The independence of I,U,V,UV implies the algebra
          generated by U,V is M2(F_ell), whose centralizer is the scalar
          matrices. The complete solution space is therefore F_ell*S.
          Every nonzero generator is invertible and its first-nonzero-entry
          normalization equals N(S). Identical canonical context and H then
          give Dec(sk,Enc(pk,m;S))=m for every accepted key, every message and
          every S in GL2. This is conditional zero-error actual-message
          correctness, independent of any security assumption.
        failure_parser_and_retry: >-
          Honest ciphertexts pass the canonical parser, dimension-one check
          and invertibility check. Malformed inputs and other solution-space
          dimensions reject as declared. Uniform matrix rejection sampling
          accepts with g=(1-1/ell)(1-1/ell^2), has expected draws 1/g and tail
          (1-g)^t. Correctness does not assert unconditional KeyGen success.
          Exact encoding constants remain an implementation specification
          obligation; the symbolic theorem assumes the same injective
          canonical context in Enc and Dec.
        honest_efficiency: >-
          The matrix sender and finite decoder use constant-dimension linear
          algebra and one hash, polynomial in their input lengths. KeyGen
          remains incomplete; its stated ell^2 enumeration for action
          coordinates is not polynomial in log ell for unrestricted growing
          ell. No replacement efficient algorithm is inferred.
        full_ring_strictness: >-
          The same public equations yield exactly the pad input. Thus no
          secret witness is required for this recipient behavior. An extra
          integral ModuleLift cannot confer confidentiality on a pad already
          determined by the public projective matrix. This is a scoped O4
          contradiction, not an impossibility result for other module PKEs.
          Equality of finite actions for theta and theta+ell*eta, or for an
          order O and proper suborder Z+dO with gcd(d,ell)=1, does not exhibit
          two different complete rings on the same curve; these are valid
          nearby-object controls only. No full-ring separator follows.
        obligation_statuses: {O2: open, O3: reviewed_discharge, O4: contradicted}
        O3_review_scope: Accepted valid keys, all messages, all invertible sender matrices and matching canonical context/H; no unconditional key-generation claim.
        O3_review_artifact: coordination/design/TASK-20261013-09fc6d/reviews/TASK-20261013-962e06/review.yaml
        next_checkable_obligation: A different public sender/recovery relation would be needed; adding integral output to the current public pad does not fix recipient strictness. No redesign is undertaken.
      J2:
        verdict: inconclusive
        material_distinctness: >-
          Simultaneous conjugation of a generating matrix pair is an operation
          change from CEST line evaluation and scalar BDEB. It nevertheless
          factors entirely through public finite matrices. Therefore neither
          extra points nor noncommutation establishes complete-ring recipient
          strictness; merely UV!=VU is weaker than the actual rank-four
          condition used in the correctness proof. No exact duplicate with
          the named primary schemes is established from the available text.
        novelty: unverified
        earliest_gap: Missing normalized primary construction comparison; a syntactically different but publicly decoded mask is not a novelty discharge.
