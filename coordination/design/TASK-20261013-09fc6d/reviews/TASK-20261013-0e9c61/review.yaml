per_candidate_verdicts:
  - candidate: TASK-20261013-f8430e
    name: LABELLED-NORM-HOM-LIFT
    J5:
      verdict: inconclusive
      established: The base statement explicitly chooses a QPT IND-CPA standard-model game with q_H=0; no QROM transform is present.
      game_rederivation: >-
        Conditional on a completed KeyGen, give classical pk to a QPT adversary;
        receive two admissible messages m0,m1 in [0,M); choose a uniform bit b
        and classical fresh r in [0,L/M); return canonical endpoint bytes for
        Enc(pk,mb;r); measure the final guess. Advantage is abs(Pr[guess=b]-1/2).
        CPA grants no private-key oracle. Public encryption computation can be
        compiled coherently by the adversary and is charged to its resources.
      active_interface: >-
        The intended CCA2 game gives classical adaptive decryption queries before
        and after the challenge and excludes exactly the challenge byte string.
        The parser must reject noncanonical encodings or account for their use;
        equivalence of mathematical endpoints cannot silently enlarge exclusion.
        Intended Dec is undefined, so the actual CCA2 oracle is not yet specified.
      missing_quantities:
        - lambda-to-(p,e,mu) map and uniform versus nonuniform QPT convention
        - finite sampler table, exact distribution, certificate rule, indexing cap, abort probability and polynomial time guarantee
        - q_D, total QPT gates, depth, qubits, classical workspace, input-length and timing-observation limits
        - canonical byte parser, malformed-input behavior and exact total private Dec
        - theorem, challenge embedding, quantum-compatible simulation/extraction, loss L_red, additive error delta_red and solver resources
      rewinding_and_programming: No proof is supplied; no classical rewinding or programming argument can be inspected or promoted. q_H=0 removes random-oracle programming, not the need for QPT-compatible extraction.
    J6:
      verdict: inconclusive
      notation: >-
        n=ceil(log2(p)), e=log2(L), mu=log2(M). All C_* symbols denote bit costs,
        not unit-cost field operations. B_* denotes bits of representation or
        workspace. Nothing below is a measured value or security lower bound.
      sender_total: >-
        T_Enc=T_validate+T_random(e-mu)+T_scalar(e,n)+T_chain(e,n)+T_canonical+T_output.
        The random string uses e-mu bits without rejection for the stated power-of-two
        interval. T_scalar includes constructing P+[a]Q. T_chain includes e
        degree-two quotient constructions, evaluations of carried points, kernel
        extraction, field arithmetic, inversions and representation conversions.
        Counting e quotient constructions alone is not total bit-time. A direct
        sequential implementation can recompute order-two kernels with
        sum(i=0..e-1,i)=e(e-1)/2 point doublings; this is an illustrative symbolic
        strategy, not a bound on the unspecified optimized implementation.
      public_reference_total: >-
        T_DecRef=T_parse+sum(a=0..L-1, T_scalar(a)+T_chain(a)+T_canonical+T_compare)
        +T_residue_selection+T_output. A streaming implementation needs only one
        candidate quotient workspace, a residue and ambiguity flag, plus public
        input; materializing all matches instead requires their full output space.
        L=2^e, so this finite public decoder need not be polynomial in input length.
      intended_recipient_total: >-
        T_Dec=T_parse+T_endpoint_model+T_Hom(E,C,W)+T_norm_enumeration
        +T_label_recovery+T_uniqueness_check+T_output. Hom conversion, enumerated
        map count K_C, descriptor size B_map, kernel extraction and ring evaluation
        are unpriced. Explicitly outputting all maps alone costs Omega(K_C*B_map)
        bits of output work; streaming can reduce storage but does not eliminate
        enumeration time or uniqueness checking.
      key_generation_total: >-
        T_KeyGen=T_enumerate_certified_tuples+T_index_sample+T_copy_key+T_verify
        with unknown table size, ring descriptor size, certification work and
        capped sampling law. Existence of a finite enumeration is not an efficient
        hardness-distribution-matched sampler.
      lengths_and_memory: >-
        In an ordinary fixed field encoding, j in F_(p^2) needs two n-bit field
        coordinates plus framing; this gives O(n) endpoint size, not a fixed byte
        format. Public curve and two torsion points are O(n) bits plus parameters.
        Ciphertext parsing and output cost at least their actual lengths. Secret
        ring basis length B_W, Hom workspace, map descriptors, preprocessing
        storage and evaluation memory remain unknown.
      public_reference_security_ceiling: >-
        Let epsilon_bar be the average probability, for the two chosen messages,
        that the endpoint fiber includes more than one message residue. The
        complete public reference decoder returns the actual message on every
        unambiguous fiber. Guessing randomly on bottom gives advantage
        (1-epsilon_bar)/2 at its full enumeration cost. This is a finite cost
        ceiling conditional on the stated endpoint computation and correctness
        law; it is not automatically a polynomial-time break. It does preclude
        deriving confidentiality merely from possession of a full ring.
      exact_missing_quantities:
        - T_setup, tuple-table size, sampler acceptance alpha_K, cap K_K, abort delta_K and real-key distribution distance
        - T_validate, point multiplication counts, quotient strategy, field-operation bit costs and exceptional-automorphism handling
        - complete evaluable ring B_W, evaluation cost, saturation certification and conversion costs
        - C model recovery, T_Hom, B_Hom, K_C, B_map, norm enumeration delay and completeness certificate
        - per-key/per-message endpoint-fiber ambiguity epsilon(E,m) and average/worst-case failure bounds
        - private recovery retry law, observable aborts, reusable preprocessing and actual reuse count
        - all quantum resource rows, success probabilities, reduction losses and parameter margins
      category_5: not established; exact costs, secure functionality, applicable attacks and reduction are underdetermined
  - candidate: TASK-20261013-6bd28a
    name: simultaneous_full_module_conjugation
    J5:
      verdict: breaks
      game_rederivation: >-
        A single random function H must be shared by classical honest encryption
        and the QPT adversary. For the mu-bit mask the intended interface is
        U_H|z,t>=|z,t xor H(z)> with mu output bits and injectively encoded input
        pk||X||Y||N(S). The statement says QROM but does not instantiate q_H,
        encoding length, domain separation or the hash-output convention. Its
        active target uses classical Dec queries and exact challenge-byte exclusion.
      independent_argument: >-
        Since I,U,V,UV span M2(F_ell), a matrix commuting with U,V commutes with
        all of M2(F_ell) and hence is scalar. For an honest ciphertext, XT=TU
        and YT=TV imply that S^-1*T commutes with U,V. Thus the solution space
        is exactly {a*S:a in F_ell}. Every nonzero solution is invertible and
        has the same projective normalization as S. The public linear system
        therefore determines the exact hash input used by encryption. This
        argument is derived from the public equations, not the producer's proof.
      consequence: >-
        Under the normalization and serialization needed for the claimed honest
        correctness, one ordinary H evaluation recovers the mask and selected
        message with probability one on every accepted key and honest ciphertext.
        For mu>=1 and distinct challenge messages, success is one and advantage
        is 1/2 under abs(Pr[correct]-1/2). A classical computation is allowed
        within QPT/QROM. q_H=1 and q_D=0 suffice; the challenger separately makes
        its one honest hash evaluation. No quantum rewinding, programming,
        superposition decryption, alternate encoding or CCA query is used.
      scope: >-
        Conditional on generation of an accepted key and completion of stated
        canonical normalization. KeyGen aborts must be accounted for separately.
        An ambiguous normalization leaves honest correctness undefined rather
        than repairing confidentiality. mu=0 has no distinct-message game.
      transform_status: No transform theorem is supplied or needed for this negative result. A QROM label cannot protect an already publicly determined mask input.
      missing_interface_quantities: [lambda-to-(p,ell,mu), q_H_max, q_D_max, hash domain/output specification, canonical projective normalization, parser and abort law, uniformity convention]
    J6:
      verdict: breaks
      notation: k=ceil(log2(ell)); A(k), M(k), I(k) are field-addition, multiplication and inversion bit costs; h is the serialized hash input length.
      sender_total: >-
        T_Enc=T_validate+T_GL2_sample+O(A(k)+M(k)+I(k))+T_normalize
        +T_H(h,mu)+Theta(mu)+T_serialize. Constant-size matrices do not imply
        constant bit-time. Hashing all of pk also charges the curve/point encoding.
      sampler_law: >-
        If S is sampled by drawing four independent uniform field entries and
        rejecting singular matrices, acceptance is
        alpha_GL2=(1-ell^-1)*(1-ell^-2), so expected trials are 1/alpha_GL2.
        A cap K has abort probability (1-alpha_GL2)^K under independent trials.
        The field-element sampler and cap are not specified; this is an explicit
        conditional accounting alternative, not a claimed implemented sampler.
      public_recipient_total: >-
        The paired equations give at most eight scalar linear equations in four
        unknown entries. Solving this fixed-size system, testing invertibility
        and projective normalization take O(A(k)+M(k)+I(k)) bit cost with
        constant-dimensional storage. Add full input parsing, T_H(h,mu), the
        mu-bit xor and output. No W, integral lift, isogeny or EndRing recovery
        is needed. This supplies a public polynomial-time cost ceiling whenever
        the public encodings and hash are efficient.
      lengths_and_memory: >-
        With fixed k-bit field elements, X,Y occupy 8*k bits and v occupies mu
        bits, before framing. Public U,V also occupy 8*k bits; E,P,Q and p add
        O(n) bits under standard field encodings. A nonzero projectively normalized
        S can be serialized in 4*k bits plus framing, with one fixed normalized
        entry. Actual canonical formats are unspecified. Matrix workspace is
        O(k); total storage must include public inputs, mu-bit output and hash
        workspace. Secret B_W and KeyGen workspace remain unknown.
      key_generation_total: >-
        T_KeyGen=T_ERGen_D+T_ring_validation+T_torsion_basis
        +T_ring_action_reduction+T_pair_sampling+T_rank_check+T_output.
        Reducing four ring generators on P,Q requires the charged evaluation
        and coordinate-extraction procedures; obtaining action matrices is not
        automatically one constant field operation. Matrix-pair sampling success,
        its cap, retries and conditioning on accepted keys are not quantified.
      exact_missing_quantities:
        - ERGen_D distribution, time, bit-memory, B_W, validation and abort probability
        - torsion-basis generation, ring evaluations and action-coordinate extraction costs
        - matrix-pair proposal law, acceptance alpha_UV, cap K_UV and resulting key law
        - field sampler, canonical parser/normalizer, h, T_H(h,mu), hash workspace and all concrete constants
        - setup/reuse scope and total cold/amortized honest-party costs
      category_5: >-
        Rejected as a defensible confidentiality claim for this submitted syntax:
        the public polynomial-time recovery works on every accepted key. No
        parameter selection can establish asymptotic QPT IND-CPA security for
        this efficient family. No exact wall-time or gate measurement is asserted.
shared_accounting:
  cold: T_cold=T_setup+T_KeyGen+T_preprocess+T_Enc+T_Dec+all_validation_and_output_not_already_counted
  repeated_use: >-
    For t actual sessions using the same permitted setup/key, total is
    T_setup+T_KeyGen+T_preprocess+sum(i=1..t,T_Enc_i+T_Dec_i+T_extra_i).
    A per-session average divides this total by the documented t. Separate keys
    require their own KeyGen costs. Key-specific tables cannot be amortized over
    unrelated keys; no reuse count is supplied here.
  retries: >-
    For independent attempts with common acceptance alpha, expected trials are
    1/alpha and cap K fails with probability (1-alpha)^K. Apply this only after
    proving that sampling model. Variable costs or correlated rejection require
    the actual expectation and tail law. Include failed-attempt work and the
    conditioning-induced distribution change.
  memory: >-
    Report persistent setup/key/preprocessing plus peak simultaneous workspace
    and all retained outputs in bits. Parallel processing adds concurrent
    workspaces; quantum width, depth, gates and classical memory remain separate.
  reduction_accounting: >-
    A future applicable theorem must specify Adv_game(A)<=L_red*Succ_EndRing(B)
    +delta_red with the stated advantage convention and
    T_B<=c_A*T_A+T_sim+T_extract+T_verify, plus quantum width/depth/query overhead.
    For epsilon>delta_red this would require solver success at least
    (epsilon-delta_red)/L_red. L_red may depend on query counts, targets and
    aborts. Neither packet gives these functions. Repetition cost and success
    amplification cannot be assumed without a compatible oracle/state model.
category_5_evidence:
  normative_source: NIST-SECURITY
  definition: Relevant-security-game attacks must cost at least comparable AES-256 key-search resources across NIST's relevant metrics; neither p bitlength nor an unlabeled 128-quantum-bit estimate establishes this.
  reference_guidance:
    source_section: 4.A.5
    published_classical: 2^272 classical gates
    published_quantum: 2^298/MAXDEPTH logical quantum gates
    illustrative_depths: ['2^40', '2^64', '2^96']
    qualification: Posted preliminary estimates, not immutable exact thresholds or proof of latest optimal AES resource costs.
  application_scope: NIST 4.A.2 considers IND-CCA2 for general-use encryption and primarily classical private-key queries; 4.A.3 treats purely ephemeral CPA separately. The listed 2^64 decryption-query guidance does not instantiate these candidates' games.
  independently_retrieved_resource_example:
    source: JNRV-2019
    scope: Table 13(a), full logical-depth metric, single-target AES-256, inner parallelization
    depth: '2^64'
    plaintext_ciphertext_pairs_in_oracle: 1
    parallel_subsets: '1.12*2^149'
    total_width_qubits: '1.08*2^161'
    gate_cost: '1.39*2^221'
    depth_times_width: '1.08*2^225'
    log2_spurious_key_probability: '-21.16'
    qualification: >-
      Published estimates, not measurements here or a latest-optimum assertion.
      The source adds classical candidate verification; its conclusion leaves
      multi-target quantum resource estimates open. Physical overhead and failure
      probability require a separately specified architecture and model.
  acceptance_evidence_required:
    - Exact viable algorithms, key distribution, parser, correctness/error law and a nontrivial message space; no Category-5 acceptance for an undefined PKE.
    - Exact claimed CPA or CCA2 game, QPT/RO access, query limits, public auxiliaries and applicable quantum reduction with losses and simulation costs.
    - Parameter functions and eventually concrete values with evidence-backed conservative margins; no parameter-selection run authorized here.
    - Independently cost every applicable attack route, including public recovery, message/randomness enumeration, endpoint-fiber distinguishers, key-distribution leakage, ring/isogeny recovery, and active/failure-channel attacks; prove source-to-instance applicability.
    - Quantum resources must include reversible arithmetic, oracle construction, state preparation, uncomputation, verification, success probability, gates, depth, width, classical memory, parallelism and any QRAM assumptions.
    - Compare matched AES-256 reference and candidate resource metrics, successes, depth caps, setup, preprocessing, targets and time-memory tradeoffs; retain classical attacks and mixed classical/quantum costs.
    - Obtain a current scheme-specific literature/resource audit before acceptance; the three external sources read here are not an exhaustive EndRing/isogeny attack survey.
  acceptance_status: Neither candidate accepted. M1 is underdetermined; M2 has a scoped public confidentiality failure.
