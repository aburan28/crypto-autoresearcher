revision_selection:
  selected_gap: null
  revision_count: 0
  disposition: skipped_no_single_decision_changing_gap
  rationale:
    - >-
      RCF-Bind's first missing sampler is only one of four broken joints and
      one unresolved joint; adding it would leave inversion, smaller-witness,
      extraction, syntax, and message-recovery obligations open.
    - >-
      BDEB's scalar-support collapse is the mechanism that makes its public
      inverse work. Replacing that support requires a new sampler, inverse,
      extraction theorem, and view specification rather than one bounded repair.
    - >-
      The shared requirement—public noncentral generation outside a publicly
      enumerable proper witness together with accepted-preimage-to-complete-ring
      reconstruction—is a new mechanism family, not one smallest repair.
  stop_rule_application: >-
    Methodology step 6 permits skipping the optional revision when no
    decision-changing repair is specifiable. No gap-fed candidate is dispatched.
