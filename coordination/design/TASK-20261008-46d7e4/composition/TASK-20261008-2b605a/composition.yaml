candidate_outcomes:
  - candidate_id: IDEA-20261008-305a07
    hypothesis_id: H-SSI-0e38a2
    name: RCF-Bind
    status: typed_obstruction
    joints:
      T1: breaks
      T2: inconclusive
      T3: breaks
      T4: breaks
      T5: breaks
    owner_sources:
      T1: coordination/design/TASK-20261008-46d7e4/reviews/TASK-20261008-417e47/candidate-a-review.yaml
      T2: coordination/design/TASK-20261008-46d7e4/reviews/TASK-20261008-417e47/candidate-a-review.yaml
      T3: coordination/design/TASK-20261008-46d7e4/reviews/TASK-20261008-5b590b/candidate-a-review.yaml
      T4: coordination/design/TASK-20261008-46d7e4/reviews/TASK-20261008-5b590b/candidate-a-review.yaml
      T5: coordination/design/TASK-20261008-46d7e4/reviews/TASK-20261008-f0f824/candidate-a-review.yaml
    earliest_failed_arrow: bare_E_to_public_noncentral_endomorphism_sample
    decisive_findings:
      - No public SampleNoncentralEnd algorithm, sampling law, runtime, or success bound is supplied.
      - A preimage is one evaluable quadratic embedding, not a complete rank-four saturated endomorphism ring.
      - No attacker-output-to-complete-ring reconstruction, rank-growth theorem, saturation bound, or quantitative reduction is supplied.
      - Exact byte grammar, function-field normal form, recovery algorithm, repeated-use semantics, and primary-source novelty remain incomplete.
    preserved_result: >-
      Accepted maps with the same irreducible trace/norm polynomial are
      rationally conjugate in the stated definite quaternion-algebra model.
      This conditional algebraic observation supplies neither public generation,
      message-recovery invariance, nor complete-ring extraction.
    scope: >-
      The findings reject this submitted interface. They do not prove that a
      public noncentral sampler or a different EndRing-based interface is impossible.
  - candidate_id: IDEA-20261008-71a5ca
    hypothesis_id: H-SSI-68351d
    name: BDEB
    status: typed_obstruction
    joints:
      T1: inconclusive
      T2: breaks
      T3: breaks
      T4: breaks
      T5: breaks
    owner_sources:
      T1: coordination/design/TASK-20261008-46d7e4/reviews/TASK-20261008-417e47/candidate-b-review.yaml
      T2: coordination/design/TASK-20261008-46d7e4/reviews/TASK-20261008-417e47/candidate-b-review.yaml
      T3: coordination/design/TASK-20261008-46d7e4/reviews/TASK-20261008-5b590b/candidate-b-review.yaml
      T4: coordination/design/TASK-20261008-46d7e4/reviews/TASK-20261008-5b590b/candidate-b-review.yaml
      T5: coordination/design/TASK-20261008-46d7e4/reviews/TASK-20261008-f0f824/candidate-b-review.yaml
    earliest_failed_arrow: accepted_scalar_preimage_to_noncentral_rank_growth
    decisive_findings:
      - Honest support consists of publicly enumerable scalar maps, and the inverse ignores the supplied complete basis.
      - Repeated accepted witnesses span only the scalar line, so they do not yield noncentral generators, rank four, or saturation.
      - Literal runtime invariance fails because validating an arbitrarily encoded basis necessarily reads its encoding; point-generation bounds also remain incomplete.
      - Exact canonical map bytes, attempted-call accounting, failure semantics, and primary-source novelty remain incomplete.
    preserved_result: >-
      The degree bound plus 4D+1 full point evaluations can bind genuine
      degree-at-most-D maps at the stated semantic level. On the submitted
      honest distribution, however, this binds a publicly invertible scalar witness.
    scope: >-
      The findings reject this submitted scalar-supported interface. They do
      not prove that every finite evaluation relation or EndRing-based PKE is impossible.
