exactly_one_next_action:
  id: ENDRING-PUBLIC-NONCENTRAL-SAMPLER-FEASIBILITY
  owner: future_coordinator
  automatic_launch: false
  objective: >-
    On the exact bare-E EndRing challenge distribution, determine whether a
    polynomial public sampler can output a canonically encoded noncentral
    evaluable endomorphism with inverse-polynomial success without making the
    witness publicly enumerable from a proper witness family. Either supply
    the algorithm, exact law, runtime, retry bound, and controls, or record a
    scoped obstruction at the first missing arrow.
  acceptance: >-
    Exact D_ER, inputs, output grammar, public coins, success probability,
    retries, and runtime are fixed; scalar/backtrack, leaked-witness,
    orientation/torsion-aided, and public-enumeration controls are run
    analytically; no complete-ring necessity is inferred from provenance.
  exclusions:
    - no automatic PKE wrapper or security claim
    - no secret-correlated orientation, ideal, tag, or complete basis in public setup
    - no combination with the separate preimage-to-complete-ring reconstruction problem
    - no automatic successor launch
