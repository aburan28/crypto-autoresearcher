    earliest_failed_arrow: bare_E_to_public_noncentral_endomorphism_sample
    decisive_result: >-
      The packet supplies no public noncentral sampler. Even conditional on
      one accepted map, the preimage is only an evaluable quadratic embedding;
      no fiber-invariant message recovery or quantitative reconstruction of a
      saturated rank-four End(E) is supplied.
    preserved_result: >-
      Same irreducible trace/norm accepted maps are rationally conjugate in the
      stated definite quaternion-algebra model, subject to the packet's scope.
  - candidate_id: IDEA-20261008-71a5ca
    hypothesis_id: H-SSI-68351d
    name: BDEB
    status: typed_obstruction
    joints: {T1: inconclusive, T2: breaks, T3: breaks, T4: breaks, T5: breaks}
    earliest_failed_arrow: accepted_scalar_preimage_to_noncentral_rank_growth
    decisive_result: >-
      Honest support is a publicly enumerable scalar family, so public
      inversion ignores the complete basis and repeated witnesses span rank
      one. No route supplies noncentral generators, rank four, saturation, or
      a complete End(E) basis.
    preserved_result: >-
      At the semantic level, 4D+1 full evaluation pairs can bind genuine
      degree-at-most-D maps under the reviewed point/kernel argument.
