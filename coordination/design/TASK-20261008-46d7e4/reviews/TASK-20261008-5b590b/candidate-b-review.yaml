red_team_review:
  candidate_name: bounded-degree endomorphism evaluation binding (BDEB)
  evidence_kind: analytical review of supplied definitions; no experimental evidence
  joint_verdict_semantics: >-
    T3 breaks complete-ring necessity on the exact scalar honest support; T4
    breaks the submitted attacker-to-complete-ring chain. These are not
    whole-claim votes. The explicit public inverse supports the producer's
    typed-obstruction diagnosis. No verdict is issued on T1, T2, or T5.
  requirements_to_evidence:
    - {requirement: T3 smaller-witness attack, status: complete, evidence: public_scalar_factorization}
    - {requirement: T4 exact directed reduction audit, status: complete, evidence: typed_reduction_and_quantitative_obligations}
    - {requirement: five frozen controls, status: complete_analytically, evidence: worked_controls}
    - {requirement: repeated-call rank/index/saturation audit, status: complete, evidence: scalar_rank_certificate_and_correlated_calls}
    - {requirement: zero runs and exclusive outputs, status: complete, evidence: execution_boundary}
    - {requirement: raw checker, status: owned_file_parsed_round_coverage_pending, evidence: mechanical_validation}

  frozen_evidence:
    receipt: coordination/design/TASK-20261008-46d7e4/archives/TASK-20261008-eb1230/snapshot-receipt.json
    binding_mode: content_first
    hash_verification:
      command: >-
        jq -r '.path_sha256 | to_entries[] | "\(.value)  \(.key)"'
        coordination/design/TASK-20261008-46d7e4/archives/TASK-20261008-eb1230/snapshot-receipt.json
        | sha256sum --check --strict
      exit_code: 0
      result: all twelve snapshot-bound producer paths matched
    load_bearing_sources:
      - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/binding-interface.yaml
        sections: [algorithms, necessity, reduction, repeated_use]
        proposition_used: honest support is [a], a^2<=D, and Inv enumerates scalars without using B
      - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/candidate.md
        sections: [Algorithms from bare E, Repeated-use semantics, Smaller-witness and correctly directed reduction audits]
        proposition_used: success conditioned on accepted honest y is one, with an absent scalar-to-ring arrow
      - path: ledger/hypotheses/H-SSI-68351d.yaml
        sections: [reduction_chain, interpretation_limits]
        proposition_used: rank-one obstruction is scoped to scalar-supported BDEB
    source_boundary: >-
      Both four-file task packets and both proposal/hypothesis pairs were read
      fully. No primary literature, predecessor review, exact remote CEST/RWCT
      record, validator output, or T5 output was opened. The checker source was
      read at lines 1-220, 340-540, and 609-700 only. Controls below instantiate
      the frozen control descriptions and make no prior-art equivalence claim.

  public_scalar_factorization:
    joint: T3
    finding: public scalar enumeration inverts every accepted honest transcript without any secret
    exact_scope:
      D: polynomial in lambda, with nonempty scalar support
      A_D: floor(sqrt(D))
      M: 4D+1
      support: nonzero a with |a|<=A_D
      conditioning: accepted honest y after public parameter and point-list success
    public_algorithm: >-
      Enumerate a=-A_D,...,-1,1,...,A_D. Construct the canonical multiplication
      map [a] and return the first map passing R_E([a],y). The honest a is in
      this list, so an accepted preimage is found. Delete B and the unnecessary
      complete-basis validation step entirely. OW inversion does not require
      the uniqueness/binding proof: existence of the honest candidate suffices.
    typed_chain:
      - {from: public_E_and_honest_y, to: finite_scalar_enumeration, status: explicit}
      - {from: finite_scalar_enumeration, to: accepted_map_a, status: guaranteed_on_accepted_honest_support}
      - {from: accepted_map_a, to: actual_message, status: conditional_on_frozen_equal_map_fiber_statement}
      - {from: accepted_map_a, to: complete_evaluable_EndRing_basis, status: not_supplied}
    complexity:
      tested_candidates: 2*floor(sqrt(D))
      time: O(A_D*M*C_mul(D,log(q))) with construction, evaluation, and canonicalization charged
      memory: polynomial in D,M,log(q); streaming enumeration needs no complete-ring basis
      complete_basis_validation: omitted by the public attacker; any cost of validating arbitrary B is a separate T2 issue
    witness_table:
      - witness: one small integer a
        suffices_for: construct an accepted honest map [a] and the frozen message mask
        ring_content: scalar subring only
      - witness: one canonical scalar map [a]
        suffices_for: corresponding inversion transcript
        ring_content: scalar subring only
      - witness: no secret witness
        suffices_for: run the public polynomial enumerator from E,y
        ring_content: none beyond public computation
      - witness: table of accepted scalar maps indexed by covered y
        suffices_for: covered repeated transcript only
        ring_content: rank-one generated subring
      - witness: a proper order containing 1
        suffices_for: all scalar honest challenges, if scalar maps are evaluable
        ring_content: no maximal-order or saturation information is needed
      - witness: finite point/image or torsion-action signature
        suffices_for: an action-based mask; the exact BDEB mask additionally uses the canonical map
        ring_content: public scalar enumeration supplies that map on honest support
    distinction: >-
      Map-equality binding can identify one endomorphism. It cannot increase
      the amount of ring information in that endomorphism. Even perfect
      binding and actual-message invariance would leave this public inverse.

  scalar_rank_certificate_and_correlated_calls:
    exact_rank_derivation: >-
      Every honest sampled map and every map returned by the explicit public
      scalar enumerator is alpha_i=[a_i]=a_i*1. Its dual is the same scalar
      map; trace is 2a_i and norm is a_i^2. Every sum, composition, dual,
      and integer polynomial in these maps remains in Z[1]. The unital order
      they generate is exactly Z[1], of rank one, for every accepted transcript
      and every positive number of calls. Without adjoining 1 their Z-span
      is g Z[1], with g=gcd(a_1,...,a_k), still of rank one.
    scalar_loop_derivation: >-
      Public scalar loops and immediate isogeny/dual backtracks are scalar
      multiples of 1. Repeating them, including fresh independent scalar
      choices, never leaves the central Q-line. Unlike RCF, the supplied BDEB
      sampler intentionally uses this line.
    trace_discriminant_derivation: >-
      The trace Gram matrix for scalar outputs is G_ij=Trd([a_i][a_j])=2a_i a_j.
      It has rank at most one. Any four-output determinant is zero, so these
      outputs do not form a finite-index rank-four order. There is no valid
      four-dimensional index or saturation certificate to infer from them.
    saturation_obligation: >-
      Saturating a rank-one lattice in its Q-span produces only a scalar
      lattice. It does not create three missing quaternion directions. If a
      separate construction supplies a rank-four Lambda inside End(E), it
      must certify disc(Lambda)=I^2 disc(End(E)), prove I=1 after saturation,
      and produce evaluable maps for the resulting basis. Under the assumed
      full geometric maximal-order model the target absolute trace
      discriminant is p^2; an abstract maximal order alone is insufficient.
    full_rank_control: >-
      A generic order Z+mO inside a rank-four maximal order O, m>1, has rank
      four but index m^3 and discriminant m^6 disc(O). Thus even future rank
      growth would not by itself certify saturation. This is a generic order
      control, not a BDEB sampling claim.
    adaptive_calls: >-
      Independent honest scalar and point-list coins do not imply independent
      adversarial outputs. Here the stronger deterministic statement applies:
      public scalar inversion succeeds on each accepted honest transcript, yet
      its outputs remain scalar. Adaptive message choices, transcript reuse,
      and arbitrarily many polynomial calls cannot raise the generated rank
      in this explicit public-attacker transcript.
    simulator_already_knows_witnesses: >-
      The public simulator samples a_i itself and already knows every [a_i]
      before invoking A. A_pub therefore supplies no new secret algebraic
      information. A reconstruction may still use a separate algorithm on E;
      such an algorithm is not provided by scalar inversion.
    probability_scope: >-
      For an extractor restricted to generating an order from the recovered
      scalar maps, the rank-four event has probability zero by the exact
      rank-one calculation. This is a statement about that specific extraction
      route, not an infimum-zero claim about arbitrary EndRing solvers using
      E, nor a proof that public EndRing computation is impossible.

  typed_reduction_and_quantitative_obligations:
    joint: T4
    input: bare canonical E from exact declared D_ER, without B or auxiliary orientation
    required_output: complete evaluable saturated rank-four basis of exactly End(E)
    arrows:
      - arrow: bare_E_to_honest_joint_challenge_view
        status: publicly_specified_subject_to_generation_and_cap_hypotheses
        evidence: >-
          Use the given E verbatim; sample a and the capped public point list;
          produce y and all public rejection/failure responses. No secret B is
          needed for this interface-level challenge. This is not a supplied
          exact-distribution trapdoor key generator for (E,B).
      - arrow: oracle_and_adaptive_view_simulation
        status: public_at_the_abstract_interface
        evidence: >-
          Encryption, relation tests, the specified XOF, and parse/failure
          responses use only public algorithms and fresh public coins. A
          reducer must preserve the full ordered law including SAMPLE_FAIL
          rather than conditioning it away. No decryption or random oracle is
          declared; an unspecified ideal XOF model cannot be silently inserted.
      - arrow: successful_OW_attacker_to_accepted_preimage
        status: direct
        evidence: A_pub returns an accepted scalar map on every accepted honest y
      - arrow: general_selected_message_attacker_to_map_preimage
        status: not_supplied_for_arbitrary_attacker
        evidence: >-
          An IND distinguisher need only return a guess, not a map. The frozen
          public adversary can additionally compute the map, but no generic
          extraction from every distinguisher is established. The explicit
          public inverse lets the reducer compute a map independently; this
          still supplies only a scalar.
      - arrow: accepted_map_or_class_to_complete_evaluable_ring
        status: missing
        first_failed_step: scalar_line_to_three_additional_independent_evaluable_endomorphisms
        evidence: >-
          Rank, full-order identification, index, saturation, multiplication
          tables, and evaluable realization are not furnished by [a].
    advantage_accounting:
      ow_success_conditioned_on_accepted_honest_y: 1
      ind_success_conditioned_on_accepted_challenge: 1 under the frozen message-equality hypothesis
      ind_advantage_conditioned_on_accepted_challenge: 1/2 under the stated repository convention
      unconditional_note: >-
        If an IND experiment guesses randomly on abort and the challenge is
        accepted with probability h, its advantage is h/2. An OW experiment
        that counts abort as failure has public-attacker success h. No
        numerical or negligible-abort value of h is established here.
    desired_bound: Adv_IND-CPA(A) <= L(lambda)*Succ_EndRing(S_A) + delta(lambda)
    quantitative_audit:
      actual_established_L: none
      actual_established_delta: none
      actual_established_EndRing_solver: none
      public_attacker_test: >-
        Applying that inequality to accepted-game A_pub with advantage 1/2
        would require Succ_EndRing(S_Apub)>=(1/2-delta)/L. This is an
        unsupported EndRing algorithmic conclusion, not evidence that EndRing
        is easy or a contradiction of a verified hardness theorem.
      conditional_factorization: >-
        For a specified extraction route, let F be accepted preimage recovery,
        R be rank four, S be exact saturation, and C be verified evaluable
        completion within the cap. Their joint success equals
        Pr(F)*Pr(R|F)*Pr(S|F,R)*Pr(C|F,R,S). For the observed-scalar-generated
        route R never occurs. An unrestricted solver may add other inputs and
        computations, but must specify and bound them separately.
      repeated_calls: >-
        Marginal successes do not license epsilon^k or 1-(1-epsilon)^k for
        adaptive attackers. Here F succeeds on accepted calls, but its success
        is not a rank-and-saturation multiplier. Fresh coins cannot convert
        the rank-one certificate into a complete basis.
      simulation_distance: >-
        A stated total-variation error eta for the full unconditioned view
        bounds changes in success events by eta. If accepted-game advantage
        is used, multiply by acceptance probability before deriving an
        unconditioned EndRing bound. Do not omit or double-count abort mass.
      generation_and_abort_audit: >-
        The advertised point bound rho_E>=1/2-1/p-M/q must be a valid positive
        lower probability before its binomial tail is used. T must be chosen
        polynomially and the tail made negligible if a negligible additive
        term is claimed. Neither a concrete T nor this asymptotic choice is
        instantiated. The parameter inequality alone is not a negligible-abort
        theorem. Exact point sampling/parser validity is left to its owners.
      advertised_tail: delta_pts <= sum_(j=0)^(M-1) binom(T,j)*rho_E^j*(1-rho_E)^(T-j)
      total_abort_scope: >-
        k sampler attempts give at most k*delta_pts by union bound if each
        conditional per-attempt bound holds. k must count all attempts,
        including failures, not merely q_S accepted encryptions. Waiting for
        q_S accepted ciphertexts requires a retry cap or a tail/runtime theorem.
        No independence is needed for the union bound.
      remaining_abort_terms:
        - public PARAM_FAIL and invalid-instance rejection must have exact challenge scope
        - malformed or nonaccepted attacker outputs must be counted
        - any new noncentral-generator routine can fail or exceed its cap
        - rank deficiency, wrong order, nonsaturation, and map-realization failures must be counted
      runtime_terms:
        - all point-list trials and failed/retried sampling attempts
        - O(A_D*M*C_mul(D,log(q))) public inversion per accepted challenge
        - scalar-map construction and O(D*log(q)) explicit output lengths
        - O(M*log(q)) transcript storage or streaming plus message/XOF work
        - k attacker invocations and all full-view simulation responses
        - separate noncentral generation, rank/index/saturation, evaluable conversion, and verification
    wrong_direction_check: >-
      Giving B to a recipient and showing that its inverse returns [a] is an
      attack/functionality direction, not a solver reduction. The public
      inverse ignores B; no reverse arrow to B follows from its success.

  worked_controls:
    - object: leaked_preimage_or_secret_tag
      construction: append the honest small scalar a, or the canonical [a], to y
      unchanged_argument_run: >-
        A reads a, constructs [a], and passes every point relation. Under the
        frozen equal-map mask statement it recovers the selected message.
        The output is still in Z[1] and has no rank-four certificate.
      failure_location: scalar_preimage_to_complete_ring
      conclusion: >-
        The alleged extraction must reject this inference. The original
        honest support already permits the same recovery by public enumeration.
    - object: public_inverse
      construction: delete B and its validator, retaining the scalar enumerator
      unchanged_argument_run: >-
        The honest a remains among the 2*A_D candidates, so an accepted map is
        returned in polynomial time. OW success is one conditioned on accepted
        y. Calling this public attacker repeatedly yields only scalar maps.
      failure_location: accepted_map_to_rank_four_and_saturation
      conclusion: >-
        This control triggers in BDEB itself. Binding and invariance cannot
        establish confidentiality or complete-ring necessity.
    - object: ordinary_many_to_one_endpoint_mask
      construction: replace the full map transcript by an endpoint shared by paths w0,w1
      unchanged_argument_run: >-
        If H(w0)!=H(w1), decrypting a ciphertext made from w0 with accepted
        preimage w1 gives another message. If the mask is made a function H(e)
        of the endpoint alone, it is public. Neither accepted path supplies a
        complete ring. Removing the M-point identification theorem cannot
        transfer its uniqueness or EndRing implications to this endpoint.
      failure_location: endpoint_witness_to_message_or_complete_ring
      conclusion: no confidentiality or complete-EndRing extraction is inferred
    - object: CEST_RWCT_finite_witness_quotient
      construction: retain only a finite action quotient or the covered point/image table
      unchanged_argument_run: >-
        For a mask defined on that quotient, its finite signature suffices.
        For the exact BDEB mask, which uses CanMap, the public scalar enumerator
        supplies CanMap from E,y. Even if the M-point degree theorem faithfully
        identifies one complete map, that map is [a] and generates rank one.
        Faithfulness of a map witness does not imply faithfulness for End(E).
      failure_location: finite_action_or_one_map_to_complete_ring
      conclusion: >-
        The finite-witness regression triggers. Exact historical CEST/RWCT
        contents were not opened; no prior-art identity is asserted.
    - object: oriented_or_torsion_aided_nearby_object
      construction: give an orientation generator or a torsion-action basis as extra public advice
      unchanged_argument_run: >-
        Original scalar-supported BDEB already ignores this advice. In a
        changed sampler supported on a supplied orientation generator, that
        generator may invert its matching challenge without the rest of the
        ring. A finite torsion action requires a separate faithful map lift if
        the exact canonical-map mask is retained. Bare E cannot simulate
        ring-correlated advice without a distribution-preserving public theorem.
      failure_location: bare_E_to_auxiliary_view_and_auxiliary_witness_to_complete_ring
      conclusion: >-
        This is a different auxiliary-data problem. It does not repair the
        exact scalar family or establish bare-EndRing extraction.
    - object: weakened_evaluation_count
      construction: reduce M to at most 4D
      unchanged_argument_run: >-
        The inequality deg(alpha-alpha')<=4D no longer contradicts a kernel
        with M killed points. This removes that uniqueness guarantee; it does
        not by itself prove a collision exists for every parameter instance.
        The honest scalar enumerator still finds an accepted scalar preimage.
      failure_location: uniqueness_premise_cannot_be_carried_into_message_or_ring_claims
      conclusion: no complete-ring implication is obtained at either evaluation count

  open_obligations:
    - {obligation: exact-distribution trapdoor key generation, status: unknown, scope: no T1/T2 vote}
    - {obligation: exact binding and parser proof, status: assigned_elsewhere, scope: used only conditionally for message conclusions}
    - {obligation: non-scalar bare-E sampler escaping the public scalar inverse, status: not_supplied}
    - {obligation: generic distinguisher-to-preimage extraction, status: not_supplied}
    - {obligation: any-preimage-to-complete-evaluable-ring theorem, status: not_supplied}
    - {obligation: uniform rank/index/saturation/loss/runtime bounds, status: not_supplied}
    - {obligation: polynomial retry cap and negligible total abort choice, status: not_instantiated}
  narrowest_supported_statement: >-
    On accepted honest scalar-supported BDEB transcripts, public polynomial
    enumeration outputs an accepted map without B. Its generated unital order
    is rank-one Z[1] for every repeated transcript. The submitted chain has no
    generic IND-to-preimage theorem or preimage-to-complete-evaluable-ring
    theorem. This supports the exact typed obstruction and closes no other
    public-binding relation.
  next_concrete_obligation: >-
    Specify an independently justified non-scalar bare-E sampler and a
    source-verified reconstruction theorem with evaluable maps, correlated-call
    rank, exact-order saturation, loss, runtime, and abort accounting before
    proposing complete-ring necessity for a changed family.
  dominated_by: n/a (no attack or construction improvement claimed)
  sota_delta: no measured improvement; analytical T3/T4 public-factorization and extraction audit only

