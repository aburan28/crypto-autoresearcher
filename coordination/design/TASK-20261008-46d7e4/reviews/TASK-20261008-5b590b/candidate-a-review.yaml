        - "blind_rederivation is assigned to TASK-20261008-417e47, which filed no review_attestation"
      scope: owned file only; no sibling report supplied or read
      whole_round_pass_claimed: false
    unavailable_interpreter_attempt:
      interpreter: /usr/local/bin/python3
      exit_code: 127
      output: /bin/bash reported that /usr/local/bin/python3 does not exist
      correction: used the available Codex Python runtime for the mechanical checker only
    round_coverage_boundary: >-
