red_team_review:
  candidate_name: RCF-Bind
  evidence_kind: analytical review of supplied definitions; no experimental evidence
  joint_verdict_semantics: >-
    T3 breaks complete-ring necessity for the submitted inversion architecture;
    T4 breaks the submitted quantitative attacker-to-complete-ring chain. These
    are not whole-claim votes, and they preserve the packet's explicitly scoped
    typed-obstruction diagnosis. No verdict is issued on T1, T2, or T5.
  requirements_to_evidence:
    - {requirement: T3 smaller-witness attack, status: complete, evidence: quadratic_embedding_factorization}
    - {requirement: T4 exact directed reduction audit, status: complete, evidence: typed_reduction_and_quantitative_obligations}
    - {requirement: five frozen controls, status: complete_analytically, evidence: worked_controls}
    - {requirement: repeated-call rank/index/saturation audit, status: complete, evidence: algebraic_certificate_and_correlated_calls}
    - {requirement: zero runs and exclusive outputs, status: complete, evidence: execution_boundary}
    - {requirement: raw checker, status: owned_file_parsed_round_coverage_pending, evidence: mechanical_validation}

  frozen_evidence:
    receipt: coordination/design/TASK-20261008-46d7e4/archives/TASK-20261008-eb1230/snapshot-receipt.json
    binding_mode: content_first
    hash_verification:
      command: >-
        jq -r '.path_sha256 | to_entries[] | "\(.value)  \(.key)"'
        coordination/design/TASK-20261008-46d7e4/archives/TASK-20261008-eb1230/snapshot-receipt.json
        | sha256sum --check --strict
      exit_code: 0
      result: all twelve snapshot-bound producer paths matched
    load_bearing_sources:
      - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/binding-interface.yaml
        sections: [endring_problem, necessity, reduction, repeated_use]
        proposition_used: >-
          Accepted output is one explicit noncentral map and dual; complete
          output is four evaluable saturated generators; sampler and
          reconstruction are expressly missing.
      - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/candidate.md
        sections: [Smaller-witness audit, Correct security direction, Controls]
        proposition_used: the producer claims no positive repeated-call saturation bound
      - path: ledger/hypotheses/H-SSI-0e38a2.yaml
        sections: [reduction_chain, interpretation_limits]
        proposition_used: obstruction concerns the packet and asserts no algorithmic impossibility
    source_boundary: >-
      Both four-file task packets and both proposal/hypothesis pairs were read
      fully. No primary literature, predecessor review, exact remote CEST/RWCT
      record, validator output, or T5 output was opened. The checker source was
      read at lines 1-220, 340-540, and 609-700 only. Controls below instantiate
      the frozen control descriptions and make no prior-art equivalence claim.

  quadratic_embedding_factorization:
    joint: T3
    finding: one accepted evaluable quadratic embedding suffices for its challenge
    typed_chain:
      - {from: complete_evaluable_basis_B, to: trace_norm_representation_solver, status: proposed_but_not_polynomially_supplied}
      - {from: trace_norm_solution, to: evaluable_alpha, status: map_conversion_bound_missing}
      - {from: evaluable_alpha_and_public_t_n, to: accepted_x, status: direct_relation_check}
    worked_derivation: >-
      Given an accepted alpha, the relation gives alpha_dual=[t]-alpha and
      alpha^2-[t]alpha+[n]=0. Thus the supplied pair carries one quadratic
      embedding, not two independent generators. Returning this pair and
      checking R_E solves that y without consulting any complete ring basis.
      Abstract quadratic-order coordinates alone are insufficient: the
      smaller witness must include the evaluable embedding into this E.
    witness_table:
      - witness: one accepted alpha with dual, or an evaluable embedding of Z[z]/(z^2-tz+n)
        suffices_for: this exact RCF preimage
        missing_for_EndRing: rank-four basis, index, saturation, evaluable reconstruction
      - witness: a proper evaluable suborder containing the accepted alpha
        suffices_for: this y when its embedded alpha and dual can be returned
        missing_for_EndRing: extension to the exact full order with a certificate
      - witness: table of accepted rational-map pairs indexed by queried y
        suffices_for: the covered finite transcript only
        missing_for_EndRing: unseen challenges and a reconstruction theorem
      - witness: torsion action or a finite point/image table
        suffices_for: a finite-action replacement, not automatically the exact symbolic RCF relation
        missing_for_EndRing: faithful map reconstruction and complete-order reconstruction are separate
    limited_conclusion: >-
      The smaller witness is strictly less output than the declared complete
      basis. This establishes factorization, not an unconditional complexity
      separation between OneEnd-like problems and EndRing. A valid external
      reconstruction theorem could change the reduction assessment; none is
      supplied or verified in the frozen packet.

  algebraic_certificate_and_correlated_calls:
    quadratic_rank_certificate: >-
      K=Q(alpha) has dimension two over Q because alpha is noncentral and
      satisfies its quadratic reduced polynomial. Every integer polynomial in
      alpha and alpha_dual reduces to u+v alpha. Addition, composition, duals,
      and scalar multiplication therefore stay in K. Their Z-span has rank at
      most two, versus the required rank four.
    quadratic_discriminant_certificate: >-
      For the embedded order Z[alpha], the reduced-trace Gram matrix on
      (1,alpha) is [[2,t],[t,t^2-2n]], whose determinant is t^2-4n=Delta.
      This is a quadratic-order discriminant. It is not the four-dimensional
      discriminant or a maximal-order saturation certificate for End(E).
    scalar_and_backtrack_control: >-
      [a] has t=2a,n=a^2,Delta=0. An immediate isogeny/dual backtrack is [d]
      and also has Delta=0. These paths are rejected by the actual RCF domain;
      they cannot repair the absent noncentral sampler.
    repeated_call_attack: >-
      For repeated occurrences of a fixed accepted y, a deterministic
      successful attacker can always return the same alpha. More generally,
      whenever all represented y values admit outputs in one embedded K,
      successful outputs may all commute and remain in K. These are
      countermodels to an inference based only on relation checks and fresh
      coins, not assertions about the undefined sampler's probability law.
    sampler_witnesses_also_counted: >-
      A reducer implementing public Sample would already possess its own
      honest alpha values before invoking A. Any proposed reconstruction must
      audit the joint algebra generated by those values and A's outputs.
      Calling the attacker is not itself a source of new rank. No such
      sampling/reconstruction law is provided here.
    rank_growth_obligation: >-
      Supply a theorem forcing noncommuting outputs and an evaluable rational
      rank-four lattice with a uniform lower probability bound over the
      declared E distribution and every successful adaptive attacker. Repeated
      honest randomness does not imply independent attacker outputs.
    full_rank_is_not_saturation: >-
      If a rank-four order Lambda is eventually constructed inside End(E),
      its finite index I satisfies disc(Lambda)=I^2 disc(End(E)) for the same
      trace pairing. In the assumed full geometric maximal quaternion-order
      setting the target absolute discriminant is p^2. Nonzero determinant,
      noncommutation, or even an abstract maximal order do not identify the
      exact evaluable End(E). Required saturation must preserve the embedding
      and produce evaluable rational maps for all recovered generators.
    saturation_example: >-
      Starting with any maximal rank-four order O and integer m>1, the proper
      unital order Z+mO has rank four. When 1 is extended to an integral basis,
      its index is m^3 and its discriminant is m^6 disc(O). This demonstrates
      why observing rank four alone is insufficient; it is a generic order
      control, not a claimed accepted RCF sampling distribution.
    probability_scope: >-
      No uniform positive rank-and-saturation bound is derived. Its absence
      does not establish that the infimum of reconstruction success is zero,
      or that a polynomial EndRing solver from an accepted alpha is impossible.

  typed_reduction_and_quantitative_obligations:
    joint: T4
    input: bare canonical E from the declared D_ER, without ring-correlated advice
    required_output: four evaluable maps forming the exact saturated End(E) basis
    arrows:
      - arrow: bare_E_to_honest_joint_challenge_view
        status: missing
        first_failed_step: SampleNoncentralEnd(E,D)
        evidence: >-
          Eval requires an already supplied alpha. Choosing arbitrary (t,n)
          does not sample the prescribed law or certify a nonempty honest
          fiber. Secret alpha, orientation, ideal, or planted B is not a bare-E
          simulation.
      - arrow: public_verification_and_Eval_simulation
        status: conditional_only
        evidence: >-
          With explicit maps, public symbolic checks are specified. This does
          not generate honest challenges or establish a polynomial joint-view
          simulator. The complete ordered responses and failure symbols must
          have the actual adaptive law.
      - arrow: successful_OW_attacker_to_accepted_preimage
        status: direct_given_an_instantiated_game
        evidence: >-
          OW success is already an accepted x. A class label or conjugacy
          assertion does not output an evaluable representative, conjugator,
          basis, or multiplication table. No selected-message attacker-to-OW
          theorem is supplied because no RCF message adapter is specified.
      - arrow: accepted_preimage_or_class_to_complete_evaluable_ring
        status: missing
        first_failed_step: quadratic_embedding_to_saturated_rank_four_order
        evidence: >-
          The pair (alpha,[t]-alpha) supplies at most a quadratic algebra.
          Rank growth, full-order identification, index, saturation, and
          rational-map realization remain additional obligations.
    desired_bound: Adv_OW-RCF(A) <= L(lambda)*Succ_EndRing(S) + delta(lambda)
    quantitative_audit:
      actual_established_L: none
      actual_established_delta: none
      actual_established_solver_runtime: none
      exact_conditional_accounting: >-
        Let F be extraction of at least one accepted preimage in the full
        simulated transcript; R be certified rank four; S be exact saturation;
        C be completion of evaluable output and verification within the cap.
        Pr(F and R and S and C)=Pr(F)*Pr(R|F)*Pr(S|F,R)*Pr(C|F,R,S).
        These are conditional factors, not independent-call assumptions. No
        positive lower bound on their product is available from this packet.
      simulation_distance: >-
        Total-variation distance eta of the entire unconditioned real and
        simulated views would give Pr_sim(F)>=Pr_real(F)-eta. If epsilon is
        conditioned on successful generation, multiply it by that generation
        probability before using this inequality. Never charge the same
        sampler abort twice.
      repeated_calls: >-
        No epsilon^q or 1-(1-epsilon)^q is justified from a marginal success
        rate. Any amplification must bound conditional success under every
        prior adaptive history or prove the appropriate independence law.
      loss_obligation: >-
        A polynomial L requires a uniform inverse-polynomial conversion from
        attacker advantage to Pr(F and R and S and C), and all simulation,
        generation, rank, saturation, and output failures must fit an explicitly
        bounded additive term. Here those bounds are unprovided.
      abort_terms:
        - missing-sampler abort and retry tail are undefined
        - empty or out-of-support characteristic fibers must be counted
        - invalid attacker outputs and parse/relation failures must be counted
        - rank-deficient and nonsaturated outputs must be counted separately
        - lattice search, map-conversion, and verification timeouts must be counted
      runtime_terms:
        - q times actual challenge-generation and public-view simulation cost
        - q attacker invocations, including failed invocations
        - explicit map composition, normalization, and byte lengths
        - rank/trace/multiplication-table construction
        - index certification and saturation with evaluable map realization
        - final exact verification and all retries
    wrong_direction_check: >-
      Complete B -> finite trace/norm search -> alpha is an attack direction.
      It is not A -> complete B, and the finite search is not proved polynomial
      in all declared inputs. No security conclusion follows by reversing it.

  worked_controls:
    - object: leaked_preimage_or_secret_tag
      construction: append canonical (alpha,alpha_dual) to an otherwise honest y
      unchanged_argument_run: >-
        A reads the tag and returns its contents, so conditional OW success is
        one without EndRing. All characteristic checks can still accept.
      failure_location: accepted_preimage_to_complete_ring
      smaller_witness: the leaked evaluable quadratic embedding
      conclusion: >-
        Relation acceptance and conjugacy binding cannot infer confidentiality
        or complete-ring extraction. RCF has no supplied confidential message
        adapter to rescue this control.
    - object: public_inverse
      construction: stipulate a public polynomial I(E,y) returning an accepted x
      unchanged_argument_run: >-
        Invoke I and return x. OW success is one; x still consists of one alpha
        and its dependent dual. An asserted extractor must separately supply
        the same absent reconstruction theorem even on this public attacker.
      failure_location: preimage_to_rank_four_and_saturation
      conclusion: >-
        The control is rejected at the intended extraction arrow. It does not
        prove that EndRing is hard, easy, or impossible from this oracle.
    - object: ordinary_many_to_one_endpoint_mask
      construction: two witness paths w0,w1 terminate at the same endpoint e
      unchanged_argument_run: >-
        If the mask values H(w0) and H(w1) differ, encrypting with w0 and
        inverting to w1 recovers the wrong selected message. If the mask is
        made endpoint-invariant as H(e), anyone can compute it. An accepted
        endpoint witness is just a path, with no rank-four ring certificate.
      failure_location: endpoint_witness_to_message_or_complete_ring
      conclusion: >-
        No confidentiality or EndRing extraction is inferred. This substituted
        relation is a control outside the exact RCF rational-map domain.
    - object: CEST_RWCT_finite_witness_quotient
      construction: replace global map identities by a finite action signature s(alpha)
      unchanged_argument_run: >-
        A mask depending only on s(alpha) is recoverable from that signature or
        a finite transcript table. For torsion modulus N, adding N beta to a
        map leaves its E[N] action unchanged whenever both maps meet the
        replacement's bounds. Such agreement alone is not symbolic equality.
        If a separate degree/faithfulness theorem reconstructs alpha, it still
        reconstructs only one map, not a saturated rank-four order.
      failure_location: finite_signature_to_global_map_to_complete_ring
      conclusion: >-
        The smaller-witness regression triggers. The named prior candidates'
        exact records were not read, so this is the frozen quotient control,
        not an asserted identification with a historical construction.
    - object: oriented_or_torsion_aided_nearby_object
      construction: provide an evaluable orientation generator or its finite torsion action as extra advice
      unchanged_argument_run: >-
        For a represented matching (t,n), the orientation generator and its
        dual invert without a complete basis. A finite action may instead
        suffice only for the finite-action replacement. The bare-E reducer
        cannot insert ring-correlated advice without a public-generation
        theorem or a distribution-preserving simulation.
      failure_location: bare_E_embedding_and_smaller_witness_to_complete_ring
      conclusion: >-
        Any result has auxiliary-data scope. Advice enabling a quadratic
        inverse is neither confidentiality evidence nor bare-EndRing
        extraction evidence.
    - object: scalar_repeated_root_slice
      construction: relax Delta<0 and allow alpha=[a], y=(2a,a^2)
      unchanged_argument_run: >-
        The equation (alpha-[a])^2=0 in the definite division algebra forces
        alpha=[a]. Binding is unique, yet a=t/2 is public. Returning [a]
        supplies only the scalar subring.
      failure_location: binding_to_asymmetric_functionality_or_complete_ring
      conclusion: the actual noncentral restriction excludes this control, as required

  open_obligations:
    - {obligation: exact bare-E public sampler and joint output law, status: unknown}
    - {obligation: every-basis polynomial inverse, status: unknown, scope: no T2 vote}
    - {obligation: reconstruction from any successful accepted embedding, status: unknown}
    - {obligation: uniform correlated-call rank/saturation probability, status: unknown}
    - {obligation: complete evaluable maximal-order certification and cost, status: unknown}
    - {obligation: quantitative correctly directed reduction, status: not_supplied}
  narrowest_supported_statement: >-
    The exact RCF inverse factors through an evaluable quadratic embedding.
    The submitted bare-E reduction cannot generate its honest challenge and
    has no quantitative embedding-to-complete-evaluable-ring theorem. These
    failures preserve the typed obstruction without closing the family.
  next_concrete_obligation: >-
    Provide an explicit bare-E sampler or a source-verified reconstruction
    theorem with the exact evaluable output, distribution, rank, saturation,
    runtime, loss, and abort hypotheses; audit these arrows separately.
  dominated_by: n/a (no attack or construction improvement claimed)
  sota_delta: no measured improvement; analytical T3/T4 factorization and extraction audit only

