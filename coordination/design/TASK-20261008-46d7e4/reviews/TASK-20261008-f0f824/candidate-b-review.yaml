review:
  name: bounded-degree endomorphism evaluation binding (BDEB)
  scope: >-
    T5 only: byte grammar, canonicalization, duplicate encodings, degree/tag
    checks, malformed inputs, failure/view/history semantics, controls,
    sources, normalized overlap, and documentation routing. No T1-T4 or whole
    claim verdict is issued. This is a read-only zero-run audit.
  conclusion: >-
    The public-inverse obstruction is clearly disclosed, but the packet does
    not supply the exact canonical parser and mask serialization it claims.
    Reduced fractions alone do not specify a unique curve-function normal
    form. The query budget counts accepted encryptions while failure accounting
    leaves attempted calls and terminal behavior unspecified. These defects
    break T5 completeness without establishing a parser exploit, contradicting
    the unowned algebraic joints, or implying any broader impossibility.
  role_contract:
    requested_path: agents/reviewer.md
    observed: absent_at_requested_path
    governing_inputs: AGENTS.md_and_exact_task_handoff
  requirement_status:
    - {requirement: exact_byte_grammar, status: incomplete, finding: B-GRAMMAR}
    - {requirement: duplicate_encoding_and_normal_form, status: incomplete, finding: B-NORMAL-FORM}
    - {requirement: degree_and_tag_participation, status: specified_at_semantic_scope, finding: B-DEGREE-TAG}
    - {requirement: malformed_inputs_and_failure_symbols, status: partial, finding: B-FAILURES}
    - {requirement: repeated_use_and_complete_public_view, status: partial, finding: B-HISTORY}
    - {requirement: conditional_assumption_scope, status: partial, finding: B-CONDITIONS}
    - {requirement: controls, status: specified_not_executed, finding: B-CONTROLS}
    - {requirement: primary_source_novelty, status: unverified, finding: B-PRIOR-ART}
    - {requirement: normalized_overlap_screen, status: partial, finding: B-PRIOR-ART}
    - {requirement: documentation_routing, status: open_coordinator_obligation, finding: B-DOCUMENTATION}

  findings:
    - id: B-GRAMMAR
      disposition: specification_defect
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/binding-interface.yaml
          locator: byte_grammar, lines 35-38; message mask, lines 76-80
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/candidate.md
          locator: domains, lines 45-60; adapter, lines 159-171
      observation: >-
        "Fixed version and integer widths" does not specify either value or
        width. The field polynomial/basis and coefficient encoding, curve and
        point formats, infinity marker, coefficient-array ordering, zero/trailing
        coefficient rules, and length caps are unspecified. The adapter names
        "BDEB-mask" but does not freeze a concrete XOF, framing of its
        concatenated inputs, message-length units, or partial-byte treatment.
      consequence: >-
        A reader cannot produce a unique Encode/Decode algorithm or mask input
        from this packet. The intended trailing-byte/noncanonical rejection
        policy is useful, but is not the required exact byte language. No
        actual accepted malformed bytes are claimed without an implementation.
      smallest_missing_item: >-
        One normative byte grammar for E,x,y and ciphertexts plus an exact
        framed XOF invocation, deterministic decoder, and explicit limits.

    - id: B-NORMAL-FORM
      disposition: specification_defect
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/binding-interface.yaml
          locator: equality/public_equivalence, lines 39-46; accepted_preimage_collisions, lines 184-187
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/candidate.md
          locator: CanMap, lines 79-81; equivalent-encoding control, lines 259-260
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/proof-search-map.yaml
          locator: rational-map equality obligation and formalization blocker, lines 76-79, 92-103
      observation: >-
        Cross multiplication modulo the curve equation can describe geometric
        equality, but gcd reduction, monic denominators, and fixed coefficient
        order do not specify a unique representative in that quotient function
        field. For E: v^2=u^3+A*u+B, the two sides are different polynomial
        numerator arrays for the same function, both with denominator one.
        A quotient/function-field reduction rule is missing. CanMap uniqueness
        is expressly an open obligation, yet the mask requires its exact bytes.
      duplicate_families_to_resolve:
        - common fraction factors or scalar rescalings
        - numerators differing by the curve equation
        - coefficient representatives modulo the field polynomial
        - zero polynomial and redundant array padding
        - affine/projective rescalings and infinity at denominator zeros
      policy_distinction: >-
        Strict external parsing rejects noncanonical encodings, whereas a
        mathematical equivalence or internal normalization may accept alternate
        representatives. The control saying unreduced fractions normalize and
        noncanonical bytes reject needs to identify which API is being called.
      consequence: >-
        Map-equality fibers do not by themselves settle deterministic mask bytes.
        These are missing canonicalization rules, not an exhibited pair of
        accepted maps violating binding. The named formalization blocker remains
        open; T5 does not promote it to a proof.
      smallest_missing_item: >-
        Deterministic CanMap pseudocode in one fixed function-field normal form,
        with strict-parser versus internal-normalizer behavior and a uniqueness
        proof obligation covering poles and zero maps.

    - id: B-DEGREE-TAG
      disposition: consistent_at_declared_semantic_scope
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/candidate.md
          locator: public relation, lines 64-77; mask, lines 163-166
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/binding-interface.yaml
          locator: domains.Y_E/validation, lines 32-38, 47-51
      observation: >-
        The transcript includes version,D and ordered Q/Z lists. The prose
        requires transcript D to equal public D, exact M=4D+1 list lengths,
        distinct nonzero Q_i, and a validated map of degree at most D. The mask
        includes E, CanMap(x), and the full y, rather than a separate hidden
        binding tag. The exact version and encoding checks are missing under
        B-GRAMMAR. No finite-point theorem or degree computation is certified
        by this syntactic observation.

    - id: B-FAILURES
      disposition: partially_specified_failure_api
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/binding-interface.yaml
          locator: failure_symbols, lines 52-57; repeated_use.abort_behavior, lines 134-136
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/candidate.md
          locator: relation malformed behavior, lines 75-77; PointList/Sample, lines 104-133; Inv, lines 144-148
      observation: >-
        R_E returns 0 for malformed inputs. PointList exhaustion returns
        POINT_FAIL and Sample explicitly wraps it as SAMPLE_FAIL before
        ciphertext output. PARAM_FAIL, PARSE_FAIL, and NO_PREIMAGE are also
        named. Eval/Inv failure precedence for malformed parameters, invalid
        maps, ill-defined projective evaluation, and malformed transcripts is
        not specified; nor is a failure return for an invalid supplied B.
      malformed_cases:
        - wrong version, width, D, or list length; truncated or trailing data
        - invalid coefficient, nonsingular-model failure, off-curve point, repeated Q, or Q=O
        - zero denominator, nonreduced fractions, redundant coefficient padding
        - true affine pole representing O versus genuinely ill-defined map
        - valid non-honest transcript with no scalar preimage
      smallest_missing_item: >-
        A per-algorithm Boolean/failure adapter and precedence table, preserving
        the already stated POINT_FAIL-to-SAMPLE_FAIL mapping.

    - id: B-HISTORY
      disposition: specification_and_accounting_gap
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/binding-interface.yaml
          locator: repeated_use, lines 123-140; failure_bounds, lines 105-108
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/candidate.md
          locator: PointList, lines 104-121; repeated-use semantics, lines 179-188
      observation: >-
        The view contains parameters, full Q/Z lists, masked message z, parser
        outcomes, public failures, and hash/XOF specifications. Messages may
        adapt to history; scalar and point coins are fresh per call. Physical
        side channels are excluded. However, q_S is explicitly a bound on
        accepted encryptions, while q_S*delta_pts is used as a total abort bound
        without an attempted-call budget or a terminal/retry state machine.
        Counting the challenge call, parameter failures, parser rejections, and
        capped point-sampler failures is not frozen. The public transcript also
        lacks an explicit statement of whether raw sampler coins are revealed.
      exact_law_gap: >-
        PointList uses uniform x coordinates and a canonical square root, not
        uniform sampling of all curve points. The root-selection rule is not
        fixed at the byte level. Distinct-point rejection creates an ordered
        joint law that must be used as stated; it cannot be replaced silently
        by independent uniform curve points.
      consequence: >-
        The per-call-to-repeated-use accounting cannot be checked from the
        present oracle semantics. A union bound with N*delta_pts is justified
        for at most N attempted sampler calls under a uniform conditional
        per-call bound; an accepted-call cap requires its own stopping/counting
        argument. This report does not declare the numerical tail false, and
        does not perform the separate blind bound rederivation.
      smallest_missing_item: >-
        Freeze a state machine and cap over attempted calls, or prove the stated
        accepted-call accounting under an explicit stop/retry policy; specify
        challenge inclusion, root choice, and coin visibility.

    - id: B-CONDITIONS
      disposition: incomplete_conditional_evidence
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/binding-interface.yaml
          locator: endring_problem, lines 9-25; retries, lines 101-108
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/proof-search-map.yaml
          locator: FORMAL-BDEB-1, lines 92-103
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/candidate.md
          locator: result opening, lines 10-14; derivation qualifications, lines 97-100
      observation: >-
        p>3 and a fixed short-Weierstrass model are explicit. No GRH, QPT, or
        QROM theorem is asserted. D_ER is named but no probability law or
        sampler is supplied; it remains an assumed exact input. The degree-norm
        and kernel-cardinality ingredients are internally derived/unformalized,
        not supported by the four PKE KB summaries. The canonicalization lemma
        is also open. The PointList lower bound needs a declared parameter
        slice where its rho value is a usable probability; no concrete T or
        negligible tail is claimed. Unqualified opening "genuinely binding"
        language should retain the later formalization/independent-proof caveat.
      consequence: >-
        The packet is conditional and incomplete at this evidence scope. No
        theorem or quantitative bound is independently verified by T5, and no
        sampler-distribution replacement or new hardness assumption is inferred.
      smallest_missing_item: >-
        A single conditional-premise manifest tying each claimed result to its
        exact distribution, parser/normal-form, and mathematical proof obligation.

    - id: B-CONTROLS
      disposition: specified_controls_with_limited_inference
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/binding-interface.yaml
          locator: known_false_controls, lines 194-204
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/candidate.md
          locator: controls, lines 253-267
        - path: coordination/design/TASK-20261008-46d7e4/review-preparation/review-plan.yaml
          locator: proves_too_much
      observation: >-
        Basis deletion, leaked a, public inversion, finite-witness factorization,
        and added orientation/torsion objects are explicitly identified; the
        packet does not infer complete-ring extraction from them. They are
        specified controls, not executed controls. M<=4D withdraws the given
        kernel-count guarantee; it does not by itself exhibit two distinct
        accepted maps or establish an ordinary many-to-one object. Equivalent
        encoding controls must distinguish strict parsing from normalization.
      inherited_control_scope: >-
        Q=O violates the frozen nonzero-point predicate and is not a valid-input
        counterexample here. The inherited normalized x(X) theorem separately
        requires fixed model, simultaneous normalization, p>3, and both
        exact-order premises with N>4D. Weakening those controls cannot silently
        change this M-distinct-full-point derivation or validate an excluded input.
      smallest_missing_item: >-
        A control matrix specifying changed domains, expected signatures, and
        which controls are actual known-false objects versus loss-of-proof
        thresholds. Their assigned execution/reduction review is not a T5 vote.

    - id: B-PRIOR-ART
      disposition: limited_scope_unverified_novelty
      provenance: kb
      evidence:
        - {path: knowledge/literature/KN-LIT-6572.md, locator: Contribution and Not verified here, lines 23-36}
        - {path: knowledge/literature/KN-LIT-6628.md, locator: Contribution and Not verified here, lines 23-36}
        - {path: knowledge/literature/KN-LIT-827.md, locator: Contribution and Not verified here, lines 24-37}
        - {path: knowledge/literature/KN-LIT-1260.md, locator: Contribution and Not verified here, lines 22-35}
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/provenance.yaml
          locator: source_limits/frontier_match/overlap_screen, lines 50-86
      observation: >-
        KB summaries report Seta's torsion-attack trapdoor, SiGamal's auxiliary
        public-point hidden-isogeny action, UPKE's update semantics, and the
        LIT-SiGamal diagram. They do not provide complete syntax, reductions,
        or normalized interfaces for comparison. Each explicitly disclaims
        independent verification despite citation_verified:read metadata.
        The reported frontier-match vocabulary hits do not establish novelty
        or absence of overlap; this reviewer did not rerun the matcher.
      normalized_candidate_comparison:
        candidate_b: scalar_supported_bounded_degree_map_bound_by_M_full_point_pairs_with_map_equality
        candidate_a: primitive_noncentral_map_and_dual_bound_by_trace_norm_with_rational_conjugacy
        observation: >-
          The frozen objects differ in domains, public relation, equivalence,
          and inverse mechanism. Their shared one-endomorphism witness issue
          does not establish a normalized identity of the two constructions.
      named_overlap_scope: >-
        Full CEST, ER-McE, UTTK, RWER, RWCT, and remote
        IDEA-20261007-{20f660,cd446e,81e7ef,670f01} records were not read and are
        outside this task's declared source scope. Comparisons such as a source
        self-map versus an endpoint/quotient are producer descriptions available
        through the supplied packets, not independently inspected prior-art
        specifications. Exact identity and non-overlap remain unverified.
      primary_sources_read: []
      novelty_status: unverified
      smallest_missing_item: >-
        A separately authorized comparison against the complete primary and
        named remote specifications, normalized by domain/relation/inverse/view.

    - id: B-DOCUMENTATION
      disposition: open_routing_and_source_obligation
      provenance: internal
      evidence:
        - path: research/ssi-endring-pke/2026-10-07-trapdoor-interface/legacy-correction-addendum.md
          locator: full additive correction
        - path: research/ssi-endring-pke/2026-10-08-public-binding-interface/methodology.md
          locator: Cursor reconciliation and Inherited correction controls
        - path: AGENTS.md
          locator: Visual research record
      observation: >-
        Preserve the additive Milne mapping printed 69-70 -> PDF 74-75,
        printed 74 -> PDF 79, and printed 75/Lemma 6.12 -> PDF 80 for the
        addendum's SHA-256
        646c0c4f193cdaa35f32c7d60fbd46a75e2f5187db4301810e8613726e3ebbee.
        No obsolete offset was repeated in the new packet. The PDF and cited
        historical review were not read here, so no new primary source or
        locator verification is attested. This correction strengthens neither
        categorical quotient claims nor degree/norm theorem scope, and leaves
        C6 digit-loop tie handling and general custody obligations unchanged.
      visual_routing: >-
        Only prose/YAML is supplied in the frozen packet and the scoped
        public-binding directory. No Mermaid, SVG, or PDF route is available
        for comparison. A Coordinator round report, source-linked diagram,
        PDF, and a recorded assessment of affected canonical graph dependencies
        remain necessary; arrows and theorem labels must agree with the
        conditional/obstruction text. Visual agreement would not supply a proof.
      older_locator_only_fresh_review_completed: false
      fresh_primary_pdf_locator_verification: not_performed
      smallest_missing_item: >-
        A Coordinator routing record binding the same conditional statements
        and missing arrows across the round's prose and visual artifacts.

  smallest_missing_item:
    id: B-GRAMMAR
    description: >-
      Freeze one exact canonical grammar and CanMap/mask serialization contract.
      This is the first T5 defect and can be repaired without changing the
