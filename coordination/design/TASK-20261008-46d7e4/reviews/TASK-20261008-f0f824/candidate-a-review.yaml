review:
  name: RCF-Bind
  scope: >-
    T5 only: exact syntax, normalization, malformed-input and public-view
    semantics, controls, source scope, overlap, and documentation routing.
    No verdict is issued on T1-T4, any whole claim, EndRing hardness, or a
    family-level impossibility. This is a read-only zero-run audit.
  conclusion: >-
    The packet is appropriately presented as a typed obstruction, but its T5
    completeness claim fails at the required exact byte grammar and unique
    map normal form. Failure propagation and coin visibility are also not
    frozen. A scalar control changes too few stated premises, and the recalled
    conjugacy provenance does not match the rational theorem being used.
    These are specification and evidence defects, not an exhibited attack
    against an implemented parser or a mathematical impossibility theorem.
  role_contract:
    requested_path: agents/reviewer.md
    observed: absent_at_requested_path
    governing_inputs: AGENTS.md_and_exact_task_handoff
  requirement_status:
    - {requirement: exact_byte_grammar, status: incomplete, finding: A-GRAMMAR}
    - {requirement: duplicate_encoding_and_normal_form, status: incomplete, finding: A-NORMAL-FORM}
    - {requirement: degree_and_tag_participation, status: specified_at_semantic_scope, finding: A-DEGREE-TAG}
    - {requirement: malformed_inputs_and_failure_symbols, status: incomplete, finding: A-FAILURES}
    - {requirement: repeated_use_and_complete_public_view, status: partial, finding: A-VIEW}
    - {requirement: conditional_assumption_scope, status: partial, finding: A-SOURCE-SCOPE}
    - {requirement: controls, status: specified_but_not_fully_typed, finding: A-CONTROLS}
    - {requirement: primary_source_novelty, status: unverified, finding: A-PRIOR-ART}
    - {requirement: normalized_overlap_screen, status: partial, finding: A-PRIOR-ART}
    - {requirement: documentation_routing, status: open_coordinator_obligation, finding: A-DOCUMENTATION}

  findings:
    - id: A-GRAMMAR
      disposition: specification_defect
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/binding-interface.yaml
          locator: domains.byte_grammar, lines 43-48; endring_problem, lines 9-20
        - path: research/ssi-endring-pke/2026-10-08-public-binding-interface/methodology.md
          locator: Frozen definitions 1-2
      observation: >-
        The only grammar is "versioned length-prefixed tuple bytes" with
        "minimal signed big-endian" integers and canonical field/map bytes.
        It specifies no version value, framing widths, tuple field order and
        type tags, sign convention, zero encoding, field modulus/basis,
        extension descriptor or embedding, coefficient ordering, or concrete
        length cap. "Polynomial length" does not define a parser predicate.
        The map field is a "declared extension" with no frozen representation.
      consequence: >-
        Independently written parsers cannot derive the same accepted byte
        language from this packet. The exactness requirement fails even though
        the intended rejection policy is stated. No actually accepted malformed
        byte string is claimed because there is no executable parser here.
      smallest_missing_item: >-
        One normative typed byte grammar fixing all field/framing choices and
        length bounds, with deterministic decoding and rejection pseudocode.

    - id: A-NORMAL-FORM
      disposition: specification_defect
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/binding-interface.yaml
          locator: domains.byte_grammar/equality/validation, lines 43-62
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/proof-search-map.yaml
          locator: formalization_blocker.prerequisite, lines 179-188
      observation: >-
        Coprime fractions and monic denominators do not by themselves specify
        a unique element of the curve function field. Polynomial representatives
        can differ by a multiple of the curve equation; for a short-Weierstrass
        model, v^2 and u^3+A*u+B represent the same function with denominator
        one. The packet does not choose a quotient-ring/function-field normal
        form, extension-field normalization, or an encoding of the dual map
        and infinity exceptions. It also names "primitivity" without defining
        its exact public validation predicate.
      duplicate_families_to_resolve:
        - common numerator/denominator scaling and common polynomial factors
        - coefficient representatives modulo the field modulus
        - numerator changes by the curve equation
        - extension-field presentations and embeddings
        - alternative pole/infinity representations
      consequence: >-
        Map equality is intended to be geometric, but canonical byte equality
        and duplicate rejection are not established by an actual normal-form
        specification. The examples are symbolic ambiguity families, not
        claimed accepted endomorphism counterexamples.
      smallest_missing_item: >-
        A deterministic function-field CanMap specification, including the
        underlying field/model and exceptional cases, with a uniqueness lemma
        or an explicit obligation for that lemma.

    - id: A-DEGREE-TAG
      disposition: consistent_at_declared_semantic_scope
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/binding-interface.yaml
          locator: domains.Y_E/validation and relation.R_E, lines 40-42, 58-62, 70-79
      observation: >-
        y contains t and n; n is recomputed as deg(alpha), and the dual
        composition/addition identities connect n and t to the supplied maps.
        The bound D and Delta<0 participate in acceptance. There is no separate
        secret-derived binding tag in the stated relation. Version/domain tags
        and their rejection rules remain unresolved under A-GRAMMAR. This
        observation does not certify the algebraic decision algorithm.

    - id: A-FAILURES
      disposition: specification_defect
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/binding-interface.yaml
          locator: failure_symbols, lines 63-68; algorithm interfaces, lines 104-126; abort_behavior, lines 185-188
      observation: >-
        FAIL_PARSE, FAIL_MAP, FAIL_REL, FAIL_EMPTY, and FAIL_UNAVAILABLE are
        named, but no per-algorithm dispatch/precedence table is given. Sample
        and Inv signatures advertise FAIL_EMPTY while their missing-algorithm
        state is separately supposed to abort as unavailability. R_E is Boolean,
        whereas Eval may emit a failure symbol; the conversion between these
        interfaces is not frozen.
      malformed_cases:
        - truncated tuple or length prefix; overflow; super-limit length; trailing bytes
        - nonminimal integer; ambiguous zero/sign; invalid field or extension coefficient
        - zero denominator; nonreduced fraction; off-model or non-morphism coordinate pair
        - invalid dual, degree mismatch, invalid discriminant, or undefined primitivity
        - overlapping parse, map, and relation failures
      consequence: >-
        Rejecting all malformed inputs is stated as a policy, but observable
        failure classes, precedence, and unavailable-versus-empty behavior are
        not an exact API. An unavailable algorithm must not be reported as
        evidence that a valid fiber is empty.
      smallest_missing_item: >-
        A per-algorithm return and failure table, including the Boolean
        relation adapter and precedence for overlapping failures.

    - id: A-VIEW
      disposition: partially_specified
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/binding-interface.yaml
          locator: repeated_use, lines 166-193; reduction.first_security_game/oracle_simulation, lines 212-224
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/candidate.md
          locator: Repeated-use game, lines 155-168
      observation: >-
        The packet names classical PPT, polynomial lengths and q, adaptive
        history, stateless intended sampling, public rejection responses, query
        order, and the full transcript. It correctly avoids inferring attacker
        independence from fresh coins and uses no epsilon^q multiplier. Physical
        timing is outside the present claim. However, "public coins" is not
        resolved into either published coin values or randomness of a publicly
        executable algorithm; the enumerated view omits rho. The budget also
        groups challenges and evaluation calls without specifying accounting
        for malformed requests, retries, or terminal unavailability.
      consequence: >-
        The intended history is broad, but its event law and oracle state
        machine are not frozen. Since Sample is missing, no instantiated honest
        joint law is available. No positive saturation bound or zero infimum
        is inferred in this review.
      smallest_missing_item: >-
        A typed oracle/history specification identifying coin visibility,
        counted events, abort transitions, and exact public responses.

    - id: A-CONTROLS
      disposition: incomplete_control_recipe
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/proof-search-map.yaml
          locator: baseline_embedding, lines 16-24; controls, lines 152-160
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/binding-interface.yaml
          locator: X_E, lines 34-39; known_false_controls, lines 256-262
        - path: coordination/design/TASK-20261008-46d7e4/review-preparation/review-plan.yaml
          locator: proves_too_much
      observation: >-
        Leaked witness, public inverse, endpoint mask, finite-action witness,
        and oriented/torsion nearby objects are identified with the appropriate
        caution against inferring confidentiality or complete EndRing. They are
        specified controls, not executed controls. The scalar reproduction
        says to relax only Delta<0, although X_E independently requires
        noncentrality and primitivity. Scalars still fail noncentrality; general
        [a] may also fail primitivity, separability, or the degree bound.
      consequence: >-
        The stated scalar recipe cannot be treated as a passing nearby-object
        control after only its listed premise change. For example, [1] avoids
        degree/separability/primitivity issues but still requires relaxing both
        noncentrality and Delta<0. Control execution and extraction conclusions
        remain with their assigned reviewer; this report does not vote on them.
      smallest_missing_item: >-
        An explicit control-domain diff naming every changed premise, with
        scalar [1] or another fully checked parameter slice.

    - id: A-SOURCE-SCOPE
      disposition: provenance_scope_mismatch
      provenance: internal
      evidence:
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/provenance.yaml
          locator: source_provenance.recalled_claims, lines 64-70
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/binding-interface.yaml
          locator: conditional_dependencies/binding_statement, lines 26-31, 89-94; obligations, lines 269-274
      observation: >-
        The binding statement requires conjugacy by B_(p,infinity)^* over the
        rational quaternion algebra. The provenance instead recalls conjugacy
        "over the algebraic closure"; that weaker field scope does not by itself
        support the stated rational conjugacy conclusion. The record correctly
        labels the recollection as not support. No primary text or proof was
        read here. In addition, O4 says no nonpublic Rec "exists" and O2 says
        Inv "is not polynomial", while the supporting text only establishes
        that this packet supplies neither the required Rec nor a polynomial
        inverse. Those categorical phrases exceed the supplied evidence.
      smallest_missing_item: >-
        Restate the exact rational conjugacy obligation as unverified, correct
        the provenance field scope, and replace absence-as-nonexistence wording
        by "not supplied/not established". A primary-source theorem or proof
        would be needed for any later promotion, outside this review's scope.

    - id: A-PRIOR-ART
      disposition: limited_scope_unverified_novelty
      provenance: kb
      evidence:
        - {path: knowledge/literature/KN-LIT-6572.md, locator: Contribution and Not verified here, lines 23-36}
        - {path: knowledge/literature/KN-LIT-6628.md, locator: Contribution and Not verified here, lines 23-36}
        - {path: knowledge/literature/KN-LIT-827.md, locator: Contribution and Not verified here, lines 24-37}
        - {path: knowledge/literature/KN-LIT-1260.md, locator: Contribution and Not verified here, lines 22-35}
        - path: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/provenance.yaml
          locator: frontier_match, lines 73-91
      observation: >-
        The four records relay abstract/first-two-page summaries. They report,
        respectively, torsion-attack inversion from an endomorphism and torsion
        images; a public-point hidden-isogeny action; key-updatable SIDH/CSIDH
        constructions; and a LIT diagram replacing a CSIDH diagram. Their
        citation_verified:read metadata does not override their explicit
        unverified-claims caveats. Local PDF paths are pointers, not primary
        texts read in this task.
      normalized_candidate_comparison:
        candidate_a: global_trace_norm_fiber_of_noncentral_map_and_dual_with_quaternion_conjugacy_equivalence
        candidate_b: bounded_degree_full_point_evaluation_transcript_with_map_equality_and_scalar_enumeration
        observation: >-
          The supplied definitions differ in domains, output relation,
          equivalence, and inverse mechanism; no normalized identity between
          the two frozen packets is established. Both describe a single-map
          witness bottleneck, which is not sufficient to identify the entire
          constructions as duplicates.
      named_overlap_scope: >-
        CEST, ER-McE, UTTK, RWER, RWCT, and remote
        IDEA-20261007-{20f660,cd446e,81e7ef,670f01} were not opened. Their full
        constructions are outside the declared source scope; only methodology
        names and producer descriptions were available. Frontier-match rows are
        reported producer pointers, not independently rechecked search results.
        Exact normalized identity or non-overlap with any of these remains open.
      primary_sources_read: []
      novelty_status: unverified
      smallest_missing_item: >-
        A separately authorized primary-specification and normalized-overlap
        comparison; it cannot be discharged by these four KB abstracts.

    - id: A-DOCUMENTATION
      disposition: open_routing_and_source_obligation
      provenance: internal
      evidence:
        - path: research/ssi-endring-pke/2026-10-07-trapdoor-interface/legacy-correction-addendum.md
          locator: full additive correction
        - path: research/ssi-endring-pke/2026-10-08-public-binding-interface/methodology.md
          locator: Cursor reconciliation and Inherited correction controls
        - path: AGENTS.md
          locator: Visual research record
      observation: >-
        The metadata mapping is printed 69-70 -> PDF 74-75, printed 74 -> PDF
        79, and printed 75/Lemma 6.12 -> PDF 80, for the addendum's SHA-256
        646c0c4f193cdaa35f32c7d60fbd46a75e2f5187db4301810e8613726e3ebbee.
        This review read the addendum, not Milne's PDF or the historical audit
        it references. The new packet does not repeat the erroneous offsets.
        It neither closes the general quotient-source/custody gap nor supplies
        missing C6 digit-loop tie handling. No normalized x(X) theorem is
        used to justify this global-map relation; the inherited fixed-model,
        simultaneous-normalization, p>3, ord(P)=N>4D restrictions therefore
        must not be silently repurposed or weakened into valid-input attacks.
      visual_routing: >-
        The declared frozen packet supplies prose/YAML only; the scoped
        public-binding directory contains methodology and schema only. No
        Mermaid/SVG/PDF route was supplied for T5 to compare. The required
        source-linked round report, diagram, PDF, and any justified canonical
        graph update remain Coordinator synthesis obligations. This review's
        write scope permits only its two review files.
      older_locator_only_fresh_review_completed: false
      fresh_primary_pdf_locator_verification: not_performed
      smallest_missing_item: >-
        A Coordinator routing record binding prose and diagram/PDF outputs to
        the same qualified arrows and recording checked graph dependencies.

  smallest_missing_item:
    id: A-GRAMMAR
    description: >-
      Freeze one typed canonical byte grammar and CanMap normal form. This is
      the earliest T5 defect and can be addressed without supplying the missing
      mathematical algorithms or expanding this reviewer into T1-T4.
    limitation: >-
      Repairing this item alone would not discharge the other recorded T5
