review_details:
  candidate_name: bounded-degree endomorphism evaluation binding (BDEB)
  packet_status_preserved: typed_obstruction
  source_interface: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-896b35/binding-interface.yaml
  scientific_runs: 0
