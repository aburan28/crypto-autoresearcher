  network_commands: []
  scope: >-
    T1's semantic map-equality binding and public scalar construction are derived
    below. The complete T1 generation contract is inconclusive because PointDraw,
    the common conditional success bound, and parameter/runtime regime are not
    completely fixed. T2 breaks the literal runtime-invariance claim for the stated
    inverse, which first validates an arbitrarily encoded basis. The basis-ignoring
    enumeration itself has correct semantic inversion on honest accepted transcripts.
    Canonical bytes and mask invariance still require a precise map normalizer.
    These are T1/T2 verdicts only; the typed-obstruction status is preserved.
  snapshot_check:
    expected_sha256: 3ca8b8d1670e672a900b54d07a210b5c2d3c1ea28dd1e71eebd33d264fbcbf00
    observed_sha256: 3ca8b8d1670e672a900b54d07a210b5c2d3c1ea28dd1e71eebd33d264fbcbf00
    matches: true
    method: sha256sum of the permitted interface only, compared with the permitted snapshot receipt
    limitation: No forbidden artifact was opened or hashed; commit reachability and other receipt entries were not checked.

  requirement_to_evidence:
    - requirement: Public generation from bare E
      status: partial
      evidence: Scalar construction and evaluation need public data only; exact PointDraw and successful polynomial parameter regime are not fixed.
    - requirement: Binding of every accepted fixed-y fiber
      status: independently_derived
      evidence: The degree parallelogram identity and finite-kernel bound give the exact argument below for genuine endomorphisms.
    - requirement: Parser equivalence and canonical recovery
      status: not_established_at_byte_level
      evidence: Function-field map equality is specified, but gcd/monic denominators/order alone do not define a unique function-field representative.
    - requirement: Every-basis inversion correctness
      status: independently_derived_for_enumeration_core
      evidence: The finite public scalar list contains the honest a and any accepted map equals the honest map.
    - requirement: Complete inverse runtime independent of arbitrary valid basis changes
      status: breaks
      evidence: The stated Validate B step has basis-size-dependent cost, omitted from the runtime table and change-of-basis claim.
    - requirement: Sampling retry and repeated-call failure bounds
      status: conditional
      evidence: The binomial bound holds for a common conditional lower bound rho in [0,1]; the displayed inequality alone need not supply a positive such bound.

  T1_evidence:
    public_field_trace:
      - field: p, F_q, E, D, M, T, version and parsing rules
        origin: Bare E and public parameters; no auxiliary orientation or endomorphism witness is needed.
      - field: a and the map [a]
        origin: Public sampler coins; a lies in {-k,...,-1,1,...,k}, k=floor(sqrt(D)).
      - field: Q_i
        origin: Public point-draw coins and duplicate rejection; the precise root/sign convention and cap semantics need definition.
      - field: Z_i
        origin: Exact projective evaluation of the public-constructed scalar map at each Q_i.
    scalar_construction: >-
      For D>=1, the integer choice has exactly 2*floor(sqrt(D)) possibilities.
      Multiplication [a] has degree a^2<=D. Division-polynomial construction and
      dense map output must be charged. Construction, full-point evaluation, and
      rejection do not read B or a secret-correlated public selector. Sampling E
      from D_ER is an external input, not a distribution established by this packet.
    accepted_fiber_derivation: >-
      Work with genuine O-preserving endomorphisms, including inseparable ones.
      For endomorphisms alpha,beta, the symmetric degree form obeys
      deg(alpha-beta)+deg(alpha+beta)=2*deg(alpha)+2*deg(beta).
      This follows by pulling the symmetric divisor identity for addition and
      subtraction on E times E back along P -> (alpha(P),beta(P)). Nonnegativity
      gives deg(delta)<=4D for delta=alpha-beta. If delta is nonzero, it is a
      finite isogeny of degree d; its kernel scheme has length d and therefore
      at most d distinct geometric points, also in inseparable characteristic.
      Accepted alpha and beta agree on M=4D+1 distinct Q_i, so a nonzero delta
      would have at least M>d kernel points. Hence delta=0 as a rational map.
      No random-position or point independence assumption is used for binding.
    threshold_note: >-
      M=4D+1 is sufficient, not shown sharp. Since every endomorphism also kills
      O and Q_i are nonzero, M=4D distinct nonzero points already give at least
      4D+1 kernel points and the same argument. Thus the M<=4D control cannot
      be read as a proof of failure at equality; it merely withdraws the packet's
      stated conservative threshold.
    validation_limits: >-
      The binding proof requires actual endomorphisms, genuine degrees, and
      distinct geometric points. Curve-equation substitution alone does not prove
      preservation of O, exclude a constant map, or specify extension through
      apparent poles. These semantic checks appear in domain/validation language
      and must be made precise in Decide. Polynomial-time point counting or a
      certified sufficient cardinality inequality is also needed for PARAM_FAIL.
      This review does not audit the whole parser view assigned to T5.

  T2_evidence:
    inverse_correctness: >-
      Fix an honest accepted transcript made with a_0, and let k=floor(sqrt(D)).
      Enumerate the 2k nonzero integers a with |a|<=k and check the complete
      relation. The entry a_0 passes, so this core cannot return NO_PREIMAGE.
      Binding makes every passing map equal to [a_0]. The embedding of Z into
      End(E) is injective, so distinct integers give distinct scalar maps, even
      when p divides a difference; [p] is not the zero morphism. The precise
      enumeration order is immaterial to accepted honest output, once CanMap is
      unique. This is semantic correctness for every valid B because the core
      does not use B, rather than a planted-basis argument.
    basis_change_derivation: >-
      For B'=B*U, U in GL_4(Z), the saturated Z-span remains End(E). The public
      scalar list and relation do not change, so the core output and online work
      do not change. This does not establish the same claim for the preceding
      Validate B step, which must process the changed maps/tables and has no
      supplied maximal-order/saturation validator or complexity bound.
    runtime_break: >-
      The interface expressly says 'Validate B, then ignore it' and later claims
      that every U changes neither runtime nor failures. Use a valid shear with
      beta'_2=N*beta_1+beta_2, beta'_1=beta_1, and other maps unchanged.
      deg(beta'_2)=N^2*deg(beta_1)+N*c+deg(beta_2) for an integral cross term c,
      with deg(beta_1)>0. Thus canonical dense rational-map data can grow without
      bound at fixed p,D,lambda as N grows. A validation that reads and checks
      all coefficients costs at least their input size; even exact trace/norm
      tables contain N-dependent integers. The claimed O(sqrt(D)*M*C_mul) omits
      this work. Runtime invariance of the full stated algorithm is false.
      Removing validation under a valid-basis promise, or charging |B| and
      imposing an encoding bound, would be an explicit corrected specification.
    corrected_cost_accounting_obligation: >-
      A conservative enumeration cost is
      C_parse + C_validate_B + 2*floor(sqrt(D))*(C_construct(D,log(q))
      + M*C_evaluate(D,log(q)) + C_map_validate(D,log(q))).
      C_validate_B cannot be silently deleted from the current algorithm.
      The other terms are polynomial for fixed polynomial-size map grammar,
      D and M polynomial in lambda, and polynomial field arithmetic. A Sample
      bound polynomial in T is not a PPT-in-lambda claim unless T is bounded
      polynomially in lambda too.
    recovery_derivation: >-
      If CanMap is a deterministic unique normal form for rational-map equality,
      binding gives CanMap(x)=CanMap(x') for all accepted preimages at fixed y.
      A fixed unambiguous serialization of domain,E,CanMap(x),y and the same
      requested length therefore gives the same deterministic XOF output.
      For encryption z=m xor mask, recovery z xor the same mask is exactly the
      originally selected m. Hash collision resistance or XOF pseudorandomness
      is not required for this correctness identity. The identity is conditional
      on the unique normalizer and framing, neither of which is fixed fully.
    map_normalization_gap: >-
      Cross multiplication modulo the curve equation can test rational-map
      equality. It does not, by itself, select unique bytes. Polynomial gcd,
      monic denominators, and coefficient order do not provide that selector
      for general multivariate curve-function expressions. A grammar restricting
      x-coordinate functions and y-coordinate functions to a unique function-field
      normal form, plus canonical infinity and length framing, is the smallest
      missing definition for unconditional mask invariance.

  retry_and_failure_rederivation:
    point_draw_assumptions: >-
      The following bound needs one fresh uniform x draw per attempt and a stated
      square-root/sign rule; duplicate acceptance events may depend on history.
      Let N_E=#E(F_q), f be the square-free cubic, and z be the number of its
      F_q roots, 0<=z<=3. The number of x with f(x) a square, including zero,
      is (N_E-1+z)/2. The Hasse inequality N_E>=q+1-2p gives an initial
      eligible-x fraction at least 1/2-1/p. At most M previously selected
      points can remove at most M further x choices in the conservative count.
      Hence every attempt has conditional new-point probability at least
      b=1/2-1/p-M/q, for the stated style of rejection draw. With randomized
      signs the same conservative duplicate loss holds. This estimate is not
      the exact point distribution, which the root/sign rule must determine.
    binomial_tail: >-
      Choose a common rho in [0,1] that lower-bounds the conditional probability
      of adding a new distinct point at every unfinished history. Coupling each
      such trial with a fresh Bernoulli(rho) trial proves that the number of
      collected points stochastically dominates Bin(T,rho), until M are reached.
      Therefore failure is at most sum from j=0 to M-1 of
      binom(T,j)*rho^j*(1-rho)^(T-j), with zero terms for j>T.
      Independence of accepted-point events is unnecessary. A state-dependent
      success probability cannot simply be substituted for a common rho.
    positive_bound_regime: >-
      If b>0, rho=b is valid for a specified draw obeying the assumptions.
      Otherwise max(0,b) supplies only the trivial failure bound 1. The parameter
      condition M<N_E-1 does not imply b>0 or inverse-polynomial b. For example,
      p=5, q=25, E:Y^2=X^3+1 over F_25 has N_E=36, and D=8 gives M=33<35,
      while b=1/2-1/5-33/25=-1.02. A negative lower estimate is not a binomial
      probability and cannot justify a nontrivial retry guarantee.
      The count is derived by enumerating the five F_5 x values symbolically:
      their affine point counts are 2,0,2,0,1, giving #E(F_5)=6 and trace 0.
      Squaring Frobenius gives trace -10 over F_25, hence 25+1+10=36.
      This is a permitted nearby curve calculation, not a claim that the
      unspecified D_ER places positive mass on this curve.
    concrete_cap_obligation: >-
      When rho>0, one sufficient quantitative choice for failure<=delta is
      T*rho>=max(2*M,8*ln(1/delta)); the usual lower-tail exponential bound
      then gives exp(-T*rho/8)<=delta. No such T or target delta is selected.
      T<M gives failure 1. A polynomial runtime and a nontrivial success bound
      therefore remain conditional, rather than measured or instantiated.
    repeated_calls: >-
      If every adaptive history has per-call failure at most the same delta_pts,
      the union bound gives at most min(1,q_S*delta_pts) for q_S calls. No
      independence across calls is needed. For varying bounds use their sum.
      No repeated-call product or saturation probability is evaluated here.
    inverse_failures: >-
      On an accepted honest transcript, the enumeration core is deterministic
      and has failure probability zero. Malformed transcripts, non-honest y,
      invalid bases, and parameter failures are outside that assertion. The
      current wrapper's basis validation and unspecified normalization prevent
      an unconditional full-algorithm failure guarantee.

  worked_attacks:
    - name: Unimodular input-size attack on complete inverse runtime
      construction: >-
        U_N has upper-left block [[1,N],[0,1]], identity elsewhere, and
        determinant 1. It is a valid full-basis change for every integer N.
        Dense rational maps for N*beta_1+beta_2 have degree growing quadratically
        in N. Keep E,D,y fixed and increase N beyond any polynomial in lambda.
      result: >-
        The enumerator still returns the same honest scalar, but the stated
        validation cannot have N-independent input-reading and algebraic cost.
        This breaks the literal complete-runtime statement, not semantic inversion.
    - name: Equivalent identity-map encodings and mask ambiguity
      construction: >-
        On Y^2=f(X), compare (X,Y) with (X,f(X)/Y). Polynomial gcd over
        F_q[X,Y] can leave f(X)/Y reduced, with monic denominator Y, while
        cross multiplication modulo Y^2-f(X) proves equality to Y/1. Both
        rational functions extend to the identity morphism. For honest a=1,
        both have the same degree-one evaluation transcript wherever properly
        projectively evaluated, but ordinary fraction normalization leaves
        different arrays to feed a mask.
      result: >-
        A grammar admitting both expressions defeats that proposed normalizer.
        A grammar restricted to a unique R(X),Y*S(X) form could reject the
        duplicate and discharge this attack. The actual grammar is unspecified,
        so byte-level message invariance is inconclusive rather than refuted.
    - name: Root-choice and small-domain retry attack
      construction: >-
        In the p=5,D=8,N_E=36 example, f has three roots in F_25 and only
        (35+3)/2=19 x values can return a point. A deterministic square-root
        sign convention returns at most 19 distinct affine points, fewer than
        M=33, so it exhausts every finite cap. Randomizing signs accesses both
        points over nonzero squares. The phrase uniform-x/square-root rejection
        does not distinguish these algorithms or set a valid positive rho.
      result: >-
        Exposes the missing exact PointDraw definition. It does not refute the
        conditional binomial bound with a genuine common lower probability,
        nor assert that a randomly signed sampler cannot succeed.

  smallest_missing_definition:
    T1: >-
      An exact PointDraw and PointList law, including root/sign choice, duplicate
      rejection, total-cap semantics, public point-count validation, and a
      polynomial parameter regime supplying a uniform positive rho and T.
    T2: >-
      A unique CanMap over the curve function field and exact mask framing;
      an explicit decision whether B is promised valid and ignored, or validated
      with basis-size cost and a stated complete-ring validation algorithm.
  load_bearing_numerical_bounds:
    - quantity: Number of scalar inverse trials
      finding: Exactly 2*floor(sqrt(D)); an honest passing scalar exists and is unique as a map.
    - quantity: Degree of a difference
      finding: At most 2*D+2*D=4D by the degree parallelogram identity.
    - quantity: Number of geometric kernel points
      finding: At most the degree for every nonzero endomorphism, including inseparable maps.
    - quantity: M-point binding
      finding: M=4D+1 is sufficient; M=4D nonzero points is sufficient too after counting O.
    - quantity: Point-draw success and cap tail
      finding: The displayed b can be nonpositive; a binomial tail requires an explicit common rho in [0,1].
    - quantity: Adaptive-call failure bound
      finding: min(1,q_S*delta_pts), conditional on a uniform per-history delta_pts; no independence product is used.
