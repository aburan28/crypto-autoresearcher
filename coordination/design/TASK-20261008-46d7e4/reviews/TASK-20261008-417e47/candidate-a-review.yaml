review_details:
  candidate_name: RCF-Bind
  packet_status_preserved: typed_obstruction
  source_interface: coordination/design/TASK-20261008-46d7e4/tasks/TASK-20261008-ba8247/binding-interface.yaml
  scientific_runs: 0
  implementation_work: false
  formalizer_used: false
  external_source_retrieval: false
  network_commands: []
  scope: >-
    These verdicts concern T1 and T2 only. T1 breaks the delivered public-generation
    obligation because Sample is absent; it does not refute the narrower conditional
    conjugacy statement. T2 is inconclusive because no inverse or recovery rule is
    defined sufficiently to check the required uniform guarantee. This is a scoped
    review of a typed obstruction, not an impossibility theorem or a whole-claim vote.
  snapshot_check:
    expected_sha256: fbad7c990b28b3129f73887f25ed68024ff05bbf586350e189ff52c73927f312
    observed_sha256: fbad7c990b28b3129f73887f25ed68024ff05bbf586350e189ff52c73927f312
    matches: true
    method: sha256sum of the permitted interface only, compared with the permitted snapshot receipt
    limitation: No forbidden artifact was opened or hashed; commit reachability and other receipt entries were not checked.

  requirement_to_evidence:
    - requirement: Public generation from bare E with polynomial runtime and inverse-polynomial success
      status: not_supplied
      evidence: algorithms.Sample_from_bare_E explicitly names a missing first public algorithm.
    - requirement: Binding of every accepted fixed-y fiber
      status: independently_derived_conditional
      evidence: The quaternion calculation below establishes rational conjugacy, under the stated definite quaternion algebra model.
    - requirement: Parser equivalence and an executable relation
      status: partial
      evidence: Strict integer parsing and map equality are specified semantically; primitivity and extension/function-field normal forms are not fully defined.
    - requirement: One polynomial inverse for every complete basis
      status: not_established
      evidence: A trace/norm equation is specified, but its solver, bit complexity, output conversion, and basis-input accounting are absent.
    - requirement: Message recovery on every accepted representative
      status: not_supplied
      evidence: relation.message_recovery_invariance supplies a requirement and no Rec algorithm.
    - requirement: Retry and failure bounds
      status: not_established
      evidence: Sample and Inv probabilities are expressly undefined; no numerical value can be rederived.

  T1_evidence:
    public_field_trace:
      - field: p, E, lambda, D
        origin: Bare challenge bytes and public bounds; D_ER remains symbolic.
      - field: t, n
        origin: Degree and trace of an explicitly supplied accepted endomorphism; no orientation or secret tag is required once x is available.
      - field: alpha, alpha_dual
        origin: Not public-generated by the packet; the missing sampler is the first failed arrow.
      - field: extension and normalization data
        origin: Must be public encoding data; no complete extension descriptor or comparison rule across extensions is fixed.
    accepted_fiber_derivation: >-
      Assume End(E) tensor Q is the definite quaternion division algebra stated by
      the packet. An accepted alpha obeys alpha_dual=t-alpha and
      alpha*(t-alpha)=n, hence alpha^2-t*alpha+n=0. Delta<0 makes the polynomial
      irreducible over Q and alpha noncentral. For accepted alpha and beta with the
      same y, put v=alpha-t/2, w=beta-t/2, and c=Delta/4. Then v^2=w^2=c.
      If r=w+v is nonzero, w*r=r*v. If w=-v, choose s that does not commute with
      v and put r=v*s-s*v; r is nonzero and v*r+r*v=0, again giving w*r=r*v.
      Every nonzero r in the division algebra is invertible, so beta=r*alpha*r^-1.
      This proves rational quaternion conjugacy directly. It supplies neither
      map equality nor an integral/automorphism conjugator nor an efficient one.
    public_equivalence_derivation: >-
      On the accepted fiber for a fixed y, the proposed public equivalence is the
      universal relation: run R on both inputs. It is an equivalence on that fiber,
      not on all possibly invalid tuples. Its efficient decidability still depends
      on making every domain check executable. The conjugacy proof does not require
      finding a conjugator to run this equivalence test.
    generation_failure: >-
      Scalar alpha=[a] has t=2a and n=a^2, so Delta=0 and is rejected. A walk
      immediately followed by its dual also produces scalar multiplication. These
      public constructions do not discharge Sample. No missing sampler is inferred
      to be impossible merely because this packet does not supply one.
    parser_and_validation_limits: >-
      Bytewise equality of canonical (t,n), exact symbolic map equality, both
      composition identities, preservation of O, and rejection of trailing bytes
      are appropriate semantic requirements. However, 'primitive' has no definition
      or decision rule. Polynomial gcd and monic denominators alone do not specify
      a unique normal form in the curve's function field. A declared extension also
      needs canonical field data, embedding/comparison rules, and a size bound.
      Consequently a complete byte-level decision algorithm is not established.

  T2_evidence:
    eval_derivation: >-
      For a validated tuple, n is the degree and the trace is unique: [t]=[t']
      implies [t-t']=0, which forces t=t' as an integer; characteristic p does not
      make [p] the zero morphism. A concrete finite procedure is to compare
      alpha+alpha_dual against [t] for each integer |t|<=floor(2*sqrt(n)). There are
      at most 2*floor(2*sqrt(D))+1 possibilities, and the scalar maps have degree
      at most 4D. This is polynomial in D and explicit map/field size for a fixed
      exact representation, rather than a need for an unknown integer-trace oracle.
      It does not resolve the undefined primitive check or extension grammar.
    basis_change_derivation: >-
      Write B as a row of four maps, alpha=B*z, trace vector h, and reduced-norm
      Gram matrix G. For B'=B*U with U in GL_4(Z), z'=U^-1*z,
      h'=U^T*h, and G'=U^T*G*U. Thus h'^T*z'=h^T*z and
      z'^T*G'*z'=z^T*G*z. Determinant +/-1 preserves the full saturated Z-span.
      The trace/norm equation and existence of an honest preimage are intrinsic.
      This algebraic fact alone bounds neither coordinate search nor map conversion.
    inverse_typing_gap: >-
      Solving trace=t and norm=n does not by itself check the X_E requirements of
      primitivity, separability, declared field, and polynomial output length.
      Honest support guarantees at least one such solution only if Sample exists.
      A solver that selects an arbitrary trace/norm solution must run these domain
      checks and must specify how it continues when the selected solution fails.
      No resulting runtime or failure guarantee is supplied.
    recovery_gap: >-
      Rational conjugacy can change the actual evaluable map. A mask depending on
      its encoding or point action can therefore change across the accepted fiber.
      A function of (t,n) is invariant and public, but that observation proves
      neither the existence nor the nonexistence of every possible nonpublic Rec.
      The smallest correctness obligation remains an actual Rec and its fiber law.
    finite_enumeration_bound: >-
      The reduced norm is a positive definite Euclidean square norm on the
      four-dimensional real quaternion space. Distinct integral endomorphisms have
      nonzero difference of integral degree at least 1. Disjoint radius-1/2 balls
      around elements of norm<=D fit inside a radius-(sqrt(D)+1/2) ball. Therefore
      their number is at most (2*sqrt(D)+1)^4, which is O(D^2). This bounds the
      number of candidates, not the running time of an unspecified enumeration
      algorithm, normalization, or map conversion. In particular, a cost polynomial
      in D may be exponential in log(n) but polynomial in lambda when D=poly(lambda).
      The packet's log(n) objection is not a proof of super-polynomial lambda cost.
    runtime_and_failure: >-
      Every-basis runtime must include the actual basis, multiplication/trace/norm
      tables, field extensions, arithmetic, intermediate and output map sizes.
      Arbitrary GL_4(Z) changes can give arbitrarily large encodings at fixed lambda.
      Either an input-size bound or a complexity dependence on |B| is required.
      Finite search in a finite fiber establishes no uniform retry tail. The packet
      establishes no Sample or Inv success probability; multiplying hypothetical
      successes across calls would not repair this. No rank/saturation probability
      is evaluated here, because those claims belong to other joints.

  worked_attacks:
    - name: Fixed trace-norm fiber with different map representatives
      construction: >-
        As an algebraic nearby object, take p>3 with p=3 mod 4 and
        E:Y^2=X^3-X over F_(p^2). Let i^2=-1 and
        alpha(X,Y)=(-X,i*Y), beta(X,Y)=(-X,-i*Y)=-alpha.
        Both are separable degree-one primitive automorphisms; their duals are
        beta and alpha respectively. Each ordered tuple satisfies y=(0,1),
        Delta=-4, composition [1], and sum [0]. The tuples are different maps.
        Frobenius pi satisfies pi*alpha=-alpha*pi, displaying their rational
        quaternion conjugacy. A recovery rule reading the sign of i in the map
        representation or using its point action need not agree on these tuples.
      result: >-
        Refutes any inference of map equality or arbitrary representative-based
        recovery from trace/norm conjugacy. No fixed D_ER sampler was supplied,
        so this nearby object is not asserted to be an honest sampled instance.
    - name: Valid unimodular shear
      construction: >-
        Use U_N with upper-left block [[1,N],[0,1]] and identity on the other
        coordinates. Its determinant is 1. Then beta'_1=beta_1 and
        beta'_2=N*beta_1+beta_2. An element with old vector (0,1,0,0) has new
        vector (-N,1,0,0), with exactly the same trace, norm, and evaluable map.
      result: >-
        A coefficient box tied only to D or a planted short basis can omit this
        honest map for large N. This is an attack on that proposed enumeration
        strategy, not a proof that every trace/norm inverse fails. No actual
        algorithm was supplied to determine whether it passes this test.
    - name: Equivalent function-field expressions
      construction: >-
        On Y^2=f(X), the Y coordinate can be written Y/1 or f(X)/Y. They define
        the same rational function and extend to the same identity morphism.
        Ordinary polynomial gcd can leave each fraction reduced and monic, even
        though their arrays differ. Cross multiplication modulo Y^2-f(X) detects
        equality. A grammar restricted to R(X),Y*S(X), or another unique normal
        form may exclude this duplicate, but such a restriction is not stated.
      result: >-
        The parser/normalizer needs a precise function-field grammar. This is a
        conditional encoding attack, not a claim that an unspecified parser
        certainly accepts both bytes.

  smallest_missing_definition:
    T1: >-
      A single executable SampleNoncentralEnd(E,D;rho), with its exact public
      sampling law, input/output sizes, runtime, and success bound. Independently,
      define primitive and the exact extension/function-field encoding.
    T2: >-
      A single trace/norm inverse with basis-input accounting and all X_E checks,
      plus an actual Rec that is proved invariant on every accepted fiber.
  load_bearing_numerical_bounds:
    - quantity: "|t|<=2*sqrt(n), Delta<0"
      finding: The inequalities are exact integer conditions; Delta<0 gives the irreducible negative-discriminant polynomial used above.
    - quantity: Trace recovery candidates
      finding: At most 2*floor(2*sqrt(D))+1 exact comparisons; no point-sampling approximation is involved.
    - quantity: Norm-bounded lattice elements
      finding: At most (2*sqrt(D)+1)^4 by the packing argument; algorithmic enumeration cost remains open.
    - quantity: Sample/Inv success, retries, repeated-call product
      finding: Undefined in the packet; no value, independence product, or negligible failure claim is established.
