findings:
  - id: DOC-MATRIX-TERMINOLOGY
    severity: required_documentation_correction
    affected:
      - research/ssi-endring-pke/2026-10-08-public-binding-interface/interface-flow.mmd
      - research/ssi-endring-pke/2026-10-08-public-binding-interface/interface-flow.svg
      - research/ssi-endring-pke/2026-10-08-public-binding-interface/report.pdf
    observation: >-
      The RCF-Bind result node says "T2 open" and the BDEB result node says
      "T1 open." The frozen joint vocabulary and all owner/composition records
      use "inconclusive." Although the prose matrix is correct, the diagram is
      not an exact rendering of the T1--T5 matrix requested by this audit.
    required_correction: >-
      Replace both instances of "open" with "inconclusive" in the Mermaid source,
      then regenerate the SVG and PDF without changing the topology or verdicts.
    mathematical_effect: none
  - id: DOC-PDF-CAPTION-COLLISION
    severity: required_visual_correction
    affected:
      - research/ssi-endring-pke/2026-10-08-public-binding-interface/report.pdf
    observation: >-
      On rendered PDF page 2, the centered footer page number "2" overlaps the
      two-line Figure 1 caption between "proposals" and the second caption line.
      Text extraction likewise inserts the page number inside the caption.
    required_correction: >-
      Reflow or resize the figure/caption, or adjust the footer clearance, and
      regenerate the PDF so that the caption and page number do not overlap.
      Reinspect all regenerated pages.
    mathematical_effect: none

