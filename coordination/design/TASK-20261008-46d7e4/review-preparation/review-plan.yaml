review_plan:
  batch_id: BATCH-fc23a6
  round: initial
  claim_under_review: >-
    Each frozen packet defines a public-binding EndRing interface or a typed
    obstruction and accurately scopes its possible use in a later PKE.
  coordinator_prior: >-
    Expect many relations to move ambiguity into an unavailable public selector,
    fail every-basis inversion, or extract only a smaller witness. A useful
    negative identifies the earliest failed arrow; a survivor remains an
    interface candidate, never a secure scheme.
  joints:
    - joint: T1
      title: public generation and binding
      assigned_to: TASK-20261008-417e47
      attack_plan: Trace every public field to bare E; hold y fixed and vary accepted witnesses.
      breaking_artifact: Secret-derived tag, hidden orientation/ideal/selector, or non-message-preserving accepted fiber.
    - joint: T2
      title: every-basis inversion and fiber correctness
      assigned_to: TASK-20261008-417e47
      attack_plan: Blindly rederive typing/correctness; apply valid basis changes and equivalent encodings.
      breaking_artifact: Representative dependence, planted-basis dependence, unbounded enumeration, or non-polynomial subroutine.
    - joint: T3
      title: smaller-witness factorization
      assigned_to: TASK-20261008-5b590b
      attack_plan: Attempt inversion with one endomorphism, torsion action, transcript table, or proper suborder.
      breaking_artifact: Strictly smaller sufficient witness without a reconstruction theorem.
    - joint: T4
      title: quantitative attacker-to-complete-ring extraction
      assigned_to: TASK-20261008-5b590b
      attack_plan: Start from the bare challenge and audit view simulation, calls, extraction, loss, runtime, abort, rank, and saturation.
      breaking_artifact: Failed embedding/simulation/extraction or only the reverse attack implication.
    - joint: T5
      title: complete view, parser, controls, sources, and prior art
      assigned_to: TASK-20261008-f0f824
      attack_plan: Audit bytes, duplicates, malformed inputs, repetition, assumptions, controls, sources, overlap, and rendering routes.
      breaking_artifact: Uncovered view, parser ambiguity, false-passing control, source defect, or normalized prior-art identity.
  proves_too_much:
    objects:
      - leaked-preimage object whose public tag contains the witness
      - public-inverse object
      - ordinary many-to-one endpoint mask
      - CEST/RWCT finite-witness quotient
      - oriented or torsion-aided nearby object
    failure_signature: T3/T4 must not infer confidentiality or complete-EndRing extraction from these controls.
    assigned_to: TASK-20261008-5b590b
  blind_rederivation:
    required: true
    assigned_to: TASK-20261008-417e47
    numerical_bounds: all load-bearing bounds, including any repeated-call product or saturation probability
  blindness:
    mutual: true
    validator_blind_from: [candidate.md, proof-search-map.yaml, red-team output, T5 output]
    red_team_blind_from: [validator output, T5 output]
    t5_blind_from: [validator output, red-team output]
  required_attestation:
    top_level_key: review_attestation
    fields: [task_id, candidate_id, round, joints_owned, verdicts, sources_read, blindness, producer_independence]
    verdict_shape: flat_per_joint
    raw_checker_required: true
  verdicts: [holds, breaks, inconclusive]
  whole_claim_vote: forbidden
  procedure_deviations: []
