proof_search_map:
  id: PSM-TASK-20261008-896b35
  candidate: bounded-degree endomorphism evaluation binding (BDEB)
  disposition: typed_obstruction
  bottleneck: >-
    Replace the public scalar honest support by a polynomial bare-E sampler
    whose outputs do not lie in a publicly generated proper subring, while
    retaining transcript binding, every-basis inversion, and a polynomial
    reconstruction from any accepted preimage to a complete End(E) basis.
  baseline_embedding:
    parameter_slice: >-
      Honest x=[a], 1<=|a|<=floor(sqrt(D)); M=4D+1 full point evaluations;
      message mask XOF(CanMap_E(x),y). This reproduces a binding transcript
      and actual-message correctness but also the public-inverse control.
    reproduction_check: >-
      Symbolically verify deg([a])=a^2<=D, R_E([a],y)=1, public scalar
      enumeration returns [a], and every accepted x' is map-equal under the
      degree/kernel argument. No code or experiment was run.
  observation_collision:
    observable: >-
      The M full point pairs (Q_i,x(Q_i)) together with D. They identify one
      degree<=D rational endomorphism under FORMAL-BDEB-1.
    distinct_preimage_search: >-
      Search separately for (i) distinct encodings of the same map, which must
      canonicalize and preserve the message, and (ii) distinct maps with the
      same transcript. The latter is excluded only when M=4D+1 and the
      degree/kernel derivation holds; M<=4D is the nearby collision control.
  constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Full point images rather than an endpoint or x-coordinate-only trace.
      predicted_gain: >-
        Makes accepted representatives equal as maps and therefore makes the
        actual-message mask representation invariant.
    - transform: representation_reduction
      proposed_object: >-
        A future bare-E sampler outside every publicly generated proper
        subring plus a theorem reconstructing a saturated rank-four order from
        any accepted inverse.
      predicted_gain: >-
        Would target the missing smaller-witness and preimage-to-ring arrows;
        neither object is supplied by BDEB.
    - transform: observable_fiber
      proposed_object: >-
        Delete B while holding y fixed and compare the public scalar inverse
        with Inv(E,B,y).
      predicted_gain: >-
        Certifies that the current interface factors through one scalar map
        and cannot support a complete-ring necessity claim.
  quantifier_order: >-
    For every E sampled before all other choices, for every valid complete
    evaluable basis B (including every GL_4(Z) change), for every honest
    Sample coin string producing y, and for every x' accepted for y, require
    x'~_E x and identical message recovery. Only afterward quantify over PPT
    attackers. A reduction receives bare E, not B, and must output a complete
    basis from the attacker's output with a stated loss.
  method_ceiling:
    strongest_certifiable_claim: >-
      Subject to FORMAL-BDEB-1, BDEB certifies bounded-degree map binding and
      actual-message invariance. It cannot certify confidentiality,
      complete-ring necessity, or an EndRing reduction because its honest
      support has a public inverse in Z[1].
    nearby_object_control: >-
      With M<=4D the kernel count no longer forces equality. With leaked a or
      deleted B, behavior is identical to the honest interface. Adding an
      orientation/torsion basis creates a different auxiliary problem.
  proof_obligations:
    - claim: deg(alpha-beta)<=4D for degree<=D endomorphisms
      responsibility: correctness
      status: open_formalization
      blocker: FORMAL-BDEB-1
    - claim: more than 4D distinct killed points force alpha=beta in characteristic p
      responsibility: correctness
      status: open_formalization
      blocker: FORMAL-BDEB-1
    - claim: rational-map byte equality matches map equality and canonical mask input
      responsibility: interface
      status: open_formalization
      blocker: FORMAL-BDEB-1
    - claim: PointList has the declared failure bound
      responsibility: success_probability
      status: proposed_derivation
    - claim: every complete basis yields the same honest inverse
      responsibility: correctness
      status: proposed_discharge_by_basis_deletion
    - claim: an accepted preimage reconstructs a complete End(E) basis
      responsibility: feasibility
      status: contradicted_for_scalar_support
    - claim: an IND attacker yields EndRing with polynomial loss
      responsibility: scope
      status: contradicted_for_proposed_chain
  formalization_blocker:
    id: FORMAL-BDEB-1
    statement: >-
      No machine-checked artifact binds the rational-map parser to the
      degree-norm triangle inequality, geometric-kernel cardinality for
      separable/inseparable endomorphisms, and uniqueness of CanMap_E.
    effect: >-
      Binding and actual-message invariance remain proposed internal
      derivations; they may not be called reviewed theorems.
    clears_when: >-
      One formal or independently reviewed proof covers the exact byte grammar,
      p>3 scope, exceptional curves, denominator failures, and M=4D+1 bound.
  quantitative_reduction_audit:
    public_attacker:
      ow_success_conditioned_on_accepted_y: 1
      ind_win_probability_conditioned_on_accepted_ciphertext: 1
      ind_advantage: 1/2
      runtime: O(sqrt(D)*M*C_mul(D,log(q)))
    required_bound: Adv_IND(A) <= L(lambda)*Succ_EndRing(B_A)+delta(lambda)
    current_bound: none
    abort_term: at most q_S(lambda)*delta_pts
    missing_arrow: scalar preimage or canonical map -> saturated rank-four evaluable End(E) basis
    proves_too_much_control: >-
      Applying a claimed extractor to the public scalar enumerator would
      assert a nonnegligible standalone EndRing solver; no such solver is
      constructed, so the reduction stops rather than reclassifying EndRing.
  no_run_accounting:
    scientific_runs: 0
    implementation_runs: 0
    benchmark_runs: 0
    formalizer_runs: 0
    parameter_selection_runs: 0
  not_applicable_reason: null

