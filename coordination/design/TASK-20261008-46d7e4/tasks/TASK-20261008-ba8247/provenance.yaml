frontier_match:
  command: >-
    python3 tools/build_frontier_map.py --match 'For a bare supersingular
    curve E, bind a normalized noncentral endomorphism alpha by its reduced
    characteristic polynomial (trace alpha, norm alpha); Sample must publicly
    generate alpha from E, Eval verifies rational-map identities, every-basis
    Inv solves the trace-norm equation in End(E), and accepted preimages are
    equivalent by quaternion conjugacy, but one quadratic-order embedding is
    a smaller witness and does not reconstruct a complete ring.'
  exit_code: 0
  top_results:
    - {id: KR-RHO-53c89f, score: 17, displayed_title: "Transfer attacks apply only to special curves"}
    - {id: KR-IC-f5c584, score: 15, displayed_title: "The trace morphism forces a linear equation (first fall degree 2 for S_3)"}
    - {id: KR-IC-f3da82, score: 10, displayed_title: "F4 trace reuse across many similar systems"}
    - {id: KR-IC-cd159a, score: 8, displayed_title: "Xedni calculus and lifting to characteristic zero fail"}
  interpretation: >-
    Displayed hits are ECDLP transfer/index-calculus items rather than this
    public-binding interface. The command is a local overlap screen, not a
    complete PKE or quaternion literature search.

