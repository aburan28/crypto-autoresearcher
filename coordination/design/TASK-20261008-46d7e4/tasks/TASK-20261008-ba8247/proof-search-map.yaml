format: proof-search-map/v1
task_id: TASK-20261008-ba8247
candidate: RCF-Bind
proposal_id: IDEA-20261008-305a07
hypothesis_id: H-SSI-0e38a2
status: typed_obstruction
claim_boundary: >-
  Zero-run symbolic map. No sampler, PKE, security theorem, novelty result,
  implementation, formalization, or parameter claim is established.

bottleneck: >-
  Produce a primitive noncentral endomorphism in polynomial time from bare E,
  then convert any accepted trace/norm preimage into a complete saturated
  evaluable End(E) basis. These are distinct missing arrows.

baseline_embedding:
  parameter_slice: >-
    Admit scalar alpha=[a]. Then y=(2a,a^2), the fiber is unique, Sample and
    Inv are public, and every fiber-invariant recovery value is public.
  reproduction_check: >-
    Symbolically verify R_E(([a],[a]),(2a,a^2)) after relaxing Delta<0. Any
    proof that infers EndRing or confidentiality from binding alone must also
    accept this known-false scalar slice and therefore proves too much.
  result: "specified control only; not executed"

observation_collision:
  observable: >-
    The reduced characteristic pair (t,n), equivalently Z^2-tZ+n, plus the
    public accept/reject bit under exact rational-map identities.
  distinct_preimage_search: >-
    Hold (E,t,n) fixed and seek two distinct normalized endomorphisms alpha and
    alpha'. Check quaternion conjugacy and evaluate any proposed message
    recovery on both.
  conclusions:
    - "nonconjugate accepted maps refute the binding lemma or its scope"
    - "conjugate maps with different Rec outputs refute message-recovery invariance"
    - "conjugate maps with equal Rec do not imply complete-ring extraction"

constructive_transforms:
  - transform: stronger_invariant
    proposed_object: >-
      Add joint reduced-trace pairings among several noncommuting accepted
      endomorphisms so that the observable records a rank-four Gram object.
    predicted_gain: >-
      Could force rank/saturation, but public bare-E sampling would then need
      several noncommuting endomorphisms and appears strictly harder. It is a
      successor question, not a repair silently assumed here.
  - transform: representation_reduction
    proposed_object: >-
      Separate SampleNoncentralEnd, trace/norm inversion, quadratic-embedding
      recovery, maximal-order reconstruction, and rational-map conversion as
      individual typed reductions.
    predicted_gain: >-
      Prevents OneEnd, a quadratic suborder, and complete EndRing from being
      conflated and localizes the first broken arrow.
  - transform: observable_fiber
    proposed_object: >-
      The fiber of complete maximal orders/evaluable bases compatible with one
      accepted quadratic embedding and its rational-map action.
    predicted_gain: >-
      A collision of non-equivalent complete rings/bases over the same smaller
      witness blocks black-box reconstruction from that witness alone; an
      injectivity theorem would supply a needed premise.

quantifier_order: >-
  Fix lambda, then E from the exact bare distribution. Quantify over every
  honest sampler output y, every accepted preimage of y, every complete
  evaluable basis B, every U in GL_4(Z), every polynomial query bound q, and
  every adaptive classical PPT transcript. Only then quantify the reduction
  coins. A solver may depend on the attacker but not on the hidden honest
  preimage, a planted basis, orientation, ideal, or selector.

method_ceiling:
  strongest_certifiable_claim: >-
    Conditional public binding of an already supplied noncentral rational map
    up to B_(p,infinity)^* conjugacy, and deterministic public relation
    checking polynomial in explicit map length.
  nearby_object_control: >-
    The scalar repeated-root slice is more strongly binding and fully public;
    it distinguishes binding from asymmetric trapdoor functionality.
  cannot_certify:
    - "a polynomial bare-E sampler"
    - "a polynomial every-basis inverse"
    - "nonpublic message-recovery invariance"
    - "complete-ring necessity or saturation"
    - "IND-CPA or any attacker-to-EndRing theorem"

proof_obligations:
  - id: P1
    claim: "RCF.Decide is polynomial in canonical explicit rational-map size."
    responsibility: runtime
    status: proposed_unreviewed
  - id: P2
    claim: "Same noncentral reduced characteristic polynomial implies the declared public conjugacy equivalence."
    responsibility: correctness
    status: open_source_and_formalization
  - id: P3
    claim: "SampleNoncentralEnd runs in polynomial time from bare E with inverse-polynomial success."
    responsibility: feasibility
    status: missing_first_algorithm
  - id: P4
    claim: "Inv solves every honest trace/norm fiber in polynomial time from every complete basis."
    responsibility: feasibility
    status: missing_algorithm
  - id: P5
    claim: "A nonpublic selected-message Rec is invariant on every accepted conjugacy fiber."
    responsibility: interface
    status: missing
  - id: P6
    claim: "Accepted preimages reconstruct a complete saturated End(E) basis with quantified loss."
    responsibility: security_reduction
    status: missing
  - id: P7
    claim: "Repeated adaptive successes force rank four and maximal-order saturation."
    responsibility: success_probability
    status: missing_no_independence_assumption

smaller_witness_search:
  candidate_witnesses:
    - "one accepted alpha and alpha_dual"
    - "one embedding of Z[Z]/(Z^2-tZ+n) into End(E)"
    - "one proper quadratic suborder containing alpha"
    - "a table of accepted preimages for queried (t,n) values"
  result: >-
    Each is sufficient for the corresponding inversion transcript and is
    strictly less than the required complete rank-four saturated output absent
    a reconstruction theorem.
  reconstruction_status: "none supplied"

reduction_map:
  desired_direction:
    input: "bare E from D_ER"
    use: "OW-RCF attacker with advantage epsilon"
    output: "complete evaluable saturated basis of End(E)"
    quantitative_form: "Adv_OW-RCF(A) <= L*Succ_EndRing(S)+delta"
    required_bounds: "L polynomial, delta negligible, S polynomial"
    status: missing
  stop_1:
    interface: "bare E -> honest y"
    blocker: "SampleNoncentralEnd unavailable"
  stop_2:
    interface: "accepted alpha -> complete End(E)"
    blocker: "quadratic embedding does not supply rank, index, or saturation"
  wrong_direction:
    statement: "complete B permits finite trace/norm enumeration"
    status: "attack route only and not shown polynomial"
  repeated_calls:
    statement: >-
      No epsilon^q, independence product, or positive saturation factor is
      asserted. Adversary outputs may be arbitrarily correlated.

controls:
  leaked_witness: "Publishing alpha makes inversion trivial but not EndRing."
  public_inverse: "A public inverse gives OW success one; extraction must still fail at stop_2."
  scalar_slice: "Unique binding with public recovery exposes the missing asymmetry."
  endpoint_mask: "Replacing y by an endpoint reintroduces many-to-one ambiguity and is out of scope."
  finite_evaluation: "Replacing map identities by finite point tuples triggers the CEST/RWCT factorization control."
  auxiliary_structure: "Orientation, torsion basis, connecting ideal, or secret tag changes the challenge distribution."
  basis_change: "Apply arbitrary U in GL_4(Z); runtime and success may not depend on planted alignment."
  message_invariance: "Run Rec on every accepted conjugate; one disagreement refutes the adapter."

prior_art_screen:
  frontier_command: >-
    python3 tools/build_frontier_map.py --match 'For a bare supersingular
    curve E, bind a normalized noncentral endomorphism alpha by its reduced
    characteristic polynomial (trace alpha, norm alpha); Sample must publicly
    generate alpha from E, Eval verifies rational-map identities, every-basis
    Inv solves the trace-norm equation in End(E), and accepted preimages are
    equivalent by quaternion conjugacy, but one quadratic-order embedding is
    a smaller witness and does not reconstruct a complete ring.'
  top_hits:
    - {id: KR-RHO-53c89f, score: 17, relation: "displayed claim concerns transfer attacks on special curves; no direct match"}
    - {id: KR-IC-f5c584, score: 15, relation: "displayed claim concerns trace morphisms in index calculus; no direct match"}
    - {id: KR-IC-f3da82, score: 10, relation: "displayed claim concerns F4 trace reuse; no direct match"}
    - {id: KR-IC-cd159a, score: 8, relation: "displayed claim concerns Xedni/lifting failure; no direct match"}
  novelty_status: unverified
  limit: "Frontier matching is not an exhaustive PKE literature search."

formalization_blocker:
  id: FORMAL-BLOCK-RCF-CONJUGACY-INVARIANCE
  statement: >-
    Formalize that the exact accepted rational-map trace/norm fiber is one
    B_(p,infinity)^* conjugacy class and decide whether any nonpublic Rec can be
    constant on that class while supporting selected-message recovery.
  prerequisite: >-
    Exact quaternion source/theorem scope, rational-map normalization semantics,
    dual identities, and the distinction between rational conjugacy and
    automorphism conjugacy.
  blocks: "binding promotion and any PKE correctness adapter"

target_complexity:
  Sample: "desired poly(lambda); no algorithm"
  Decide_Eval: "proposed polynomial in explicit map size; unreviewed"
  Inv: "finite enumeration only; potentially exponential in log n"
  extraction: "no algorithm or exponent"
  best_known_comparison: >-
    The predecessor interfaces also lacked a bare-E sampler/every-basis inverse
    or complete-ring extractor. RCF changes the relation, not those barriers.
  time_memory_tradeoff: "not applicable because no viable algorithm is claimed"

execution:
  scientific_runs: 0
  implementation_runs: 0
  benchmark_runs: 0
  formalizer_runs: 0
  parameter_selection_runs: 0
  network_retrievals: 0
  next_action: >-
    Proof-level audit of whether polynomial bare-E noncentral-endomorphism
    sampling is possible without assuming a OneEnd-like solution; do not
    implement the undefined sampler.
