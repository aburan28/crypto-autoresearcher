    - ledger/questions/RQ-SSI-1946c9.yaml
    - docs/scheme-construction-contract.md
    - docs/target-result-profile.md
    - knowledge/literature/KN-LIT-6572.md
    - knowledge/literature/KN-LIT-6628.md
    - knowledge/literature/KN-LIT-827.md
    - knowledge/literature/KN-LIT-1260.md
  prior_art_delta: >-
    The KB pointers describe torsion-attack, public-point/action,
    key-updatable, and LIT-diagram PKE at abstract/first-pages scope. RCF-Bind
    instead studies a global rational-map reduced-characteristic fiber. This
    does not establish novelty, and no primary specification was read.
  novelty_status: unverified
  overlap_screen: >-
    Required local frontier match returned KR-RHO-53c89f (score 17),
    KR-IC-f5c584 (15), KR-IC-f3da82 (10), KR-IC-cd159a (8), and lower hits;
    their displayed claims concern transfer attacks, trace equations in index
    calculus, or unrelated ECDLP mechanisms, not this interface. CEST, ER-McE,
    UTTK, RWER and remote IDEA-20261007-{20f660,cd446e,81e7ef,670f01} were
    screened only through the frozen methodology/predecessor report; their
    full records were outside this blind task's read scope, so overlap remains
    unverified rather than absent.
