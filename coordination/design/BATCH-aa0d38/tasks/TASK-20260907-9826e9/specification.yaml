experiment:
  id: EXP-CRYPTO-6505c6
  hypothesis_id: H-CRYPTO-fde1f1
  version: 1
  status: approved
  approved_by: coordinator
  approval_decision_id: DEC-20260907-d42056
  frozen: true
  scientific_execution_authorized: false
  kind: prerequisite_symbolic_theorem_transfer_audit
  objective: Produce or precisely delimit the certificates needed for the fixed elliptic-addition trace-transfer target; no numerical correlation table or attack experiment.
  inputs:
    source_paths:
      - ledger/proposals/IDEA-20260905-3e4bf0.yaml
      - ledger/hypotheses/H-CRYPTO-fde1f1.yaml
      - coordination/design/BATCH-aa0d38/source-packet.json
      - coordination/design/BATCH-aa0d38/design-note.md
    corrected_proposal_sha256: a57f1cef4e48c014cdbee69abb62a90865868f05e46b9ece75b4342ece7aa10b
    primary_source: https://arxiv.org/html/2511.09459v1
  frozen_symbolic_domain:
    base: E/F_p given by y^2=x^3+a*x+b, p>=5 prime, Delta=4*a^3+27*b^2!=0; O is the projective identity.
    main_base: b!=0 and c1=1+a+b!=0, fixed prospectively for both nonconstant families.
    degeneration_strata:
      D0: b=0,c1!=0,Delta!=0.
      D1: b!=0,c1=0,Delta!=0.
      D01: b=0,c1=0,Delta!=0.
    rationale: Exclude branch coincidences at x=0 and x=1 from the main theorem target before audit, while retaining all three pairwise-disjoint excluded strata as diagnostics; no obstruction is asserted proved.
    quantifiers: For every allowed p and base instance, fix sheaf/normalization and n-independent complexity data before requiring the target for every n>=1 and all(Q,R) in E(F_(p^n))^2.
    embedding: Projective Weierstrass E in P2 and E_Q times E_R in P8 by Segre; actual embedded-degree/complexity conventions and bounds must be source-matched and certified, not inferred from conductor alone.
    coefficient_field: Qbar_2 with a fixed embedding into C; p is odd.
  families:
    K:
      definition: Quadratic Kummer sheaf L_chi on Gm, extended by zero at0 and infinity; compatible quadratic norm characters over finite extensions.
      rank_expected: 1
      trace: Quadratic character on nonzero arguments, zero at the declared boundary.
      source_boundary: Definition, purity, trace normalization and pullback behavior must be checked from authoritative sources or certified derivations during the audit.
    L:
      definition: R1 of the Legendre family v^2=z*(z-1)*(z-u) over u!=0,1,infinity, normalized by a compatible unramified Weil twist.
      rank_expected: 2
      normalization: Fix sqrt(p) mapping to the positive real root; at extension n use p^(-n/2) times the H1 Frobenius trace, with one consistent geometric-Frobenius convention.
      boundary: Extend by zero at0,1,infinity.
      source_boundary: Rank, lissity, purity, geometric constituents, gallantry and conductor values are obligations; none is presumed proved.
    C1: Constant rank1 sheaf with trace1 and full lisse domain on P1; negative cancellation control.
    C2: Constant rank2 direct sum with trace2 and full lisse domain on P1; negative cancellation control.
  correlation:
    parameter_space: X=E_Q times E_R.
    total_space: E_P times E_Q times E_R with projection pi to(Q,R).
    maps: f_Q=x(P+Q), f_R=x(P+R), using global addition followed by x:E->P1.
    domain: P in E(F_(p^n)) for which both arguments lie in the family's lisse domain; zero-extension convention elsewhere. Constants use all P.
    target_sum: S_F,n(Q,R)=sum_P t_F(f_Q(P);F_(p^n))*conj(t_F(f_R(P);F_(p^n))).
    candidate_complex: Unshifted R pi_! of f_Q^*(j_!F) tensor-derived with f_R^*(j_!(F^dagger)); F^dagger must have the conjugate trace under the chosen normalization.
    required_verifications: Trace formula, dagger/dual identification, zero-extension at boundaries, cohomological shifts/signs and mixed integral weights all require certificates; do not silently replace j_! by a different extension.
  addition_charts:
    local_pair: (P,S), used once with S=Q and once with S=R.
    precedence_order:
      - {tag: P_identity, condition: P=O, value: S}
      - {tag: S_identity, condition: 'P!=O and S=O', value: P}
      - {tag: secant, condition: 'P,S affine and xP!=xS', slope: '(yS-yP)/(xS-xP)', x_sum: slope^2-xP-xS}
      - {tag: tangent, condition: 'P,S affine,xP=xS,yP=yS,2*yP!=0', slope: '(3*xP^2+a)/(2*yP)', x_sum: slope^2-2*xP}
      - {tag: inverse, condition: 'P,S affine,xP=xS,yS=-yP, after prior cases', value: O}
    boundary_semantics: P=S=O belongs only to P_identity; affine two-torsion belongs to inverse, not tangent. Verify disjointness/exhaustiveness and compatibility with global addition; formulas are prospective audit inputs, not verified here.
    ordered_pairs: Cartesian product of the five tags, left tag for(P,Q), right for(P,R); include all25 pairs for every case.
    empty_cells: Certify incompatibility/emptiness explicitly, including impossible combinations due to the shared P. N/A requires a proof/certificate and cannot mean an omitted boundary.
    lisse_boundary: Within each compatible chart also identify preimages of every sheaf boundary point and verify the global zero convention without overlap or omission.
  main_transfer_target:
    complexity_C: A positive integer bound, fixed before n, for the exact source embedded-complex complexity of X and the correlation complex and any additional source-required bounded input data. Audit must identify the actual source definitions and construction bounds.
    conductor_separation: Curve Artin/Swan conductors, rank, embedding degree, tensor/dual/pullback/pushforward costs and derived-complex complexity are separate ledger fields; none substitutes automatically for another.
    moment: sum_(Q,R in X(F_(p^n))) |S_F,n(Q,R)|^4 <= B(C)*|F_(p^n)|^5 for every n>=1.
    moment_parameters: {m: 2, A: 5}
    effective_B: Explicit computable uniform function/formula or independently checked effective bound with dependencies; a finite observed maximum, n-dependent C, or ineffective existence does not discharge this target.
    stratification: Verify every hypothesis of source Theorem2.4 for this specific embedded X and complex. If applicable, certify a closed exceptional Sigma in X of dimension<=1, effective degree bound D(C), and |S|<=K(C)*sqrt(q_n) off Sigma.
    shared_locus: Identify geometric shared constituents/coinvariants of the two translated pullbacks, including diagonal and off-diagonal translation-stabilizer loci. Do not assume this locus is small or omit it to force the target.
    no_free_constants: D(C),K(C),B(C),weights and all source dependence remain explicit obligations; general complexity dependence is not assumed polynomial.
  symbolic_cases:
    - {id: case-01, family: K, base: main, parameter_scope: Full X including exceptional parameters., role: main_target}
    - {id: case-02, family: L, base: main, parameter_scope: Full X including exceptional parameters., role: main_target}
    - {id: case-03, family: K, base: main, parameter_scope: Diagonal Q=R., role: exceptional_geometry}
    - {id: case-04, family: L, base: main, parameter_scope: Diagonal Q=R., role: exceptional_geometry}
    - {id: case-05, family: K, base: main, parameter_scope: Off-diagonal shared-constituent/translation-stabilizer locus; size unknown., role: exceptional_geometry}
    - {id: case-06, family: L, base: main, parameter_scope: Off-diagonal shared-constituent/translation-stabilizer locus; size unknown., role: exceptional_geometry}
    - {id: case-07, family: K, base: main, parameter_scope: Independently algebraically generic(Q0,R0) in a separate symbolic copy of X over the same base., role: matched_null}
    - {id: case-08, family: L, base: main, parameter_scope: Independently algebraically generic(Q0,R0) in a separate symbolic copy of X over the same base., role: matched_null}
    - {id: case-09, family: K, base: D0, parameter_scope: Full X., role: excluded_base_diagnostic}
    - {id: case-10, family: L, base: D0, parameter_scope: Full X., role: excluded_base_diagnostic}
    - {id: case-11, family: K, base: D1, parameter_scope: Full X., role: excluded_base_diagnostic}
    - {id: case-12, family: L, base: D1, parameter_scope: Full X., role: excluded_base_diagnostic}
    - {id: case-13, family: K, base: D01, parameter_scope: Full X., role: excluded_base_diagnostic}
    - {id: case-14, family: L, base: D01, parameter_scope: Full X., role: excluded_base_diagnostic}
    - {id: case-15, family: C1, base: main, parameter_scope: Full X., role: known_false_cancellation_control}
    - {id: case-16, family: C2, base: main, parameter_scope: Full X., role: known_false_cancellation_control}
  obligation_matrix:
    columns:
      O01: Exact family/base/domain, extension compatibility, normalization and source obligations.
      O02: All25 ordered chart-pair compatibility/emptiness, global map coverage and zero-boundary certificates.
      O03: Exact correlation-to-pushforward trace, dagger/dual and integral-weight conventions.
      O04: Separate rank/Artin/Swan and embedded-derived complexity, operation costs and n-independent uniform bounds.
      O05: Geometric constituents/coinvariants, diagonal and residual shared loci, with source or proof for each inference.
      O06: All-extension fourth-moment statement and effective B(C), or exact counterexample/open obligation at its proper scope.
      O07: Source theorem hypothesis-by-hypothesis match; no unproved monomial-to-addition identification.
      O08: Exceptional dimension/degree, off-locus residual correlation and effective constants, with exact scope.
      O09: Matched rank/ramification null validity, coarse-observable collisions and known-false/control classification.
      O10: Certificate dependency/soundness audit, quantifier closure, measured work/resources and open-obligation ledger.
    fixed_cells: 160
    chart_cells: 400
    local_ids: case-01 through case-16 and O01 through O10 are local table keys, not globally allocated ledger record IDs.
    phase_order: [O01,O02,O03,O04,O05,O09,O06,O07,O08,O10]
    case_order: [case-15,case-16,case-03,case-04,case-05,case-06,case-07,case-08,case-09,case-10,case-11,case-12,case-13,case-14,case-01,case-02]
    statuses: [CERTIFIED,REFUTED,OPEN,OUTSIDE_MAIN_SCOPE_CLASSIFIED,NOT_APPLICABLE_WITH_CERTIFICATE,NOT_ATTEMPTED_AFTER_STOP]
    reuse: Reuse a certificate only through an explicit matching statement/scope/dependency binding; no copied unsupported verdict. Supporting lemmas may discharge fixed obligations but may not change the target or panel.
    diagnostic_rule: Degeneration cases must have exact disjoint-base classification, chart status and an explicit shared-geometry/cancellation outcome or open obligation. They need not cancel to permit a main-scope result and cannot refute the main target alone.
  controls:
    constants: Both constant ranks must expose full-support correlation/exceptional behavior and be rejected by the cancellation argument; source/proof certificates required, not an asserted heuristic.
    matched_nulls: Same family with independently generic symbolic shift parameters; compare each translated pullback separately with its corresponding generic-main pullback. Certify equal lisse rank, translated ramification support and local inertia/tame/Swan data, with derived Artin/Swan totals, under explicit source-curve identifications. Tensor/coinvariant structure is recorded separately and need not match. Never force matching to a diagonal tensor. Missing required matching certificate means OPEN and overall inconclusive, not N/A; NONMATCH or exceptional null is retained without replacement or favorable resampling.
    chart_boundaries: Identity, inverse, tangent/two-torsion and all incompatible ordered pairs remain in the400-cell coverage record.
    forgotten_structure: Compare shared constituents/coinvariants at certified equal coarse rank/conductor wherever available; equality of coarse invariants alone is not a cancellation hypothesis.
    source_nonembedding: Exact multiplicative/monomial baseline identification is explicitly N/A; no known source slice is claimed to equal x(P+Q).
  independent_checker_plan:
    input: Immutable claim statements, symbolic case predicates, source passages, certificate text/formal artifacts, dependency DAG, complexity ledger and all quantifier/normalization declarations.
    structural_output: Schema/path/hash/coverage/dependency checks with precise missing-cell or unbound-source findings.
    semantic_output: Independently reasoned per-claim verdict with actual verified sources, checked proof premises and counterexamples; requires an independent qualified review task, not this preparation Executor.
    soundness_boundary: Schema-valid or hash-consistent is not theorem-proved. A source citation without an actual reading/matching record cannot discharge a mathematical premise. Open moment/uniformity/effectiveness premises remain OPEN.
  replication:
    mode: Fixed symbolic universal-quantifier audit.
    seeds: []
    seeds_reason: No random draws or numerical samples.
    numerical_primes_or_extensions: []
    independent_instances: 0
    symbolic_audit_passes: 1
  independent_variables: [fixed_family, base_stratum, parameter_locus, addition_chart_pair, obligation_column]
  controlled_variables: [quantifier_order, normalization, zero_boundary, fixed_embedding, source_version, main_scope, certificate_rules]
  metrics:
    primary: [per_family_transfer_status, shared_locus_dimension_and_degree, effective_complexity_C, all_extension_moment_certificate_status, effective_B, exceptional_dimension_and_degree, effective_off_locus_K, control_classification]
    secondary: [Artin_conductor, Swan_conductor, rank, operation_complexity_bounds, construction_and_check_work, actual_peak_bytes, certificate_bytes, source_reading_coverage, open_obligations, unattempted_cells]
    pending_values: Unknown/unproved/unmeasured fields are null with exact reasons, not zero or fabricated numeric bounds.
  budget:
    enforcement: Advisory time/CPU only; one fixed symbolic audit pass, zero numerical runs,4GiB and one worker remain binding.
    maximum_runs: 1
    run_kind: symbolic_proof_audit_pass
    maximum_numerical_runs: 0
    maximum_workers: 1
    maximum_memory_gb: 4
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
  stopping_rule:
    - Stop at the first independently checkable exact contradiction in the main target or a false acceptance of a known-false control; preserve all earlier work and explicitly mark unattempted cells.
    - Otherwise finish the fixed obligation panel, recording missing source/proof/effectiveness prerequisites as OPEN rather than silently assuming them.
    - Supporting proof work cannot introduce numerical sampling, new families or changed base exclusions; those require a separate approved protocol.
    - Missing capabilities, unavailable sources, memory limits or watchdog interruption yield an incomplete/inconclusive audit, never a mathematical negative by themselves.
  success_criterion: >-
    Both main families have complete source-matched, independently checkable
    certificates for the all-extension effective moment and its valid
    stratification consequences; all required chart/control/null premises pass.
    Degeneration cases are correctly scoped and explicitly classified, with
    outside-scope unknowns disclosed. No shared-locus size or uniform constant
    may remain an assumed main premise. Later independent semantic review is
    required before any scientific status change.
  falsification_criterion: >-
    A checked exact counterexample to the fixed main-family quantified target
    is scope-limited negative evidence for that target only. An argument that
    accepts constant controls is invalid, not proof that the target is false.
    Degeneration-only failure and absence of proof cannot refute the main
    target. Missing all-extension, source, effective-constant or checker
    certificates produce inconclusive outcomes with exact remaining obligations.
  outcomes:
    per_family: [CERTIFIED_MAIN_SCOPE,EXACT_MAIN_COUNTEREXAMPLE,INCONCLUSIVE,INVALID_ARGUMENT]
    overall_positive: Both main families certified and every required control/domain obligation checked; outside-main diagnostic unknowns explicitly retained.
    partial: One family can be certified while the other remains open; do not convert that into overall success.
    negative: Exact in-main-scope counterexample with its certified violated statement; no wider closure.
  artifacts:
    directory: experiments/EXP-CRYPTO-6505c6/audits/<genuinely_allocated_future_audit_TASK_ID>/
    root_filenames: [audit-manifest.yaml, source-readings.yaml, source-hypothesis-matrix.yaml, case-index.yaml, obligation-results.yaml, chart-coverage.yaml, normalization-and-weights.yaml, complexity-ledger.yaml, shared-constituents.yaml, moment-certificates.yaml, stratification-application.yaml, control-results.yaml, counterexamples.yaml, open-obligations.yaml, work-and-resources.yaml, audit-report.md, certificate-bundle.md, dependency-dag.yaml, checker-results.yaml, artifact-sha256.json]
    exact_root_file_count: 20
    obligation_rows: obligation-results.yaml has all160(case_id,obligation_id) keys with exact statement, scope, status, certificate anchor and dependency IDs; no per-cell directories.
    chart_rows: chart-coverage.yaml has all400(case_id,left_tag,right_tag) keys with domain predicates, compatibility/emptiness status and certificate anchor; no per-chart directories.
    certificate_binding: certificate-bundle.md uses unique explicit cert-ID markers; dependency-dag.yaml and checker-results.yaml bind those exact IDs and statements. Reuse a global chart lemma only with a checked parameter/scope substitution for each row. Hash the whole bundles and reject duplicate or dangling anchors.
    completion_semantics: Every cell has a status; unattempted/open cells contain reasons and dependency gaps, never fabricated proofs. Emptiness/N/A needs a certificate. An absent independent semantic review is explicitly pending, not a checker PASS.
    binding: Actual source/spec/preparation/audit-task/claim/runtime and review-plan hashes/provenance; hash every materialized artifact except hash index itself, which archive binds.
    audit_receipt: Proof-producing task provenance and actual actions/resources, not a fake numerical command, subprocess receipt or simulation result. No future audit ID is allocated by this protocol.
  launch_gate: Exact approval archive/publication, zero-run preparation and its snapshot, separate ranked proof-audit task with actual source-reading/runtime capabilities and genuine claim, frozen scope and preregistered independent review. No audit is launched by this specification alone.
