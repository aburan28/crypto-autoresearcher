red_team_report:
  id: RT-20260907-46731e
  id_note: >-
    Derived from the task token for traceability. This is NOT a minted ledger
    identifier; no allocate_id draw was made and no ledger record was created.
  task_id: TASK-20260907-46731e
  claim_under_review: >-
    The Executor OBSERVATIONS for EXP-ECRANK-73275e version 1 exactly as
    recorded in experiments/EXP-ECRANK-73275e/execution-report.yaml at snapshot
    03c6e3181bc54b67ab3904b5f6187dbe4e6cb3ad, restricted to joints J5, J6 and
    J7 and to the proves_too_much control. The producer interpreted nothing and
    this review changes nothing.
  objections:
  - 'BLOCK-1: IV-1 at n = 6 is unsatisfiable as frozen. deg(g^2 - p) <= n/2 - 1 gives deg s <= 2 at n = 6, and build_instance accepts only deg in {3,4} (ecrank_engine.py:380-391, 806-808), so the recorded degenerate_deg_s_2 on 8 of 8 was fixed before any seed was drawn. The filter behaved CORRECTLY; the control is uninformative.'
  - 'BLOCK-2: IV-1 at n = 8 tests completeness of a rank LOWER bound (certify76.py:56-60), not soundness. Totals [5,6,7,7,7,7,6,7] never exceed n-1 = 7, so the soundness direction EV-ECRANK-8b35bb records for the predecessor ("never exceeding n-1") PASSED.'
  - 'BLOCK-3: the R6 null object is vacuous. At d = (1..1) the interpolant delta is the constant 1, so the n = 6 ellipticity quadratic is identically zero: (A,B,C) = (0,0,0) on all 64 tuples. R6 decided "1 = 0" by two integer comparisons and the infeasibility proof frozen in null_family.py is false of the object that ran.'
  - 'BLOCK-4: IV-3 was not run and could not have passed. 0 of 9 plants built, recovered is the empty list, and by the same degeneracy construct.solve_n6(E, b, [1]*6, H) returns [] for every b, so the recovery step was unfalsifiable even had the plants built. iv9_distinct_h0 true is 0 == 0.'
  - 'BLOCK-5: the counted path stages S2 sample_dpat, S3 _n6_quad, S5 r-construction and height filter, the multi-class S7 certify_instance and S8 counting are traversed by NO control. construct._n6_quad, which produced every counted instance, is executed only by R3 and its bit-for-bit replay R4. The counted arm and the known-false control run over DISJOINT cosets (R3 members {+-22, +-286, +-2310, +-30030}, 1 absent; R7 selects a coset containing 1).'
  - 'BLOCK-6: R5 did not measure the contracted quantity independently of PD-2. Bbox = min(H,20) = 20 at both declared H levels; 1681 integer points against ~1.1e-5 (H=100) and ~1.1e-9 (H=1000) of the declared rational box; and the true solution variety is generically non-integral, so the yield is ~0 whatever the budget.'
  - 'BLOCK-7: the P4 comparison compares n = 6 against n = 8. The 3e-4 of EV-ECRANK-8b35bb is per b-tuple at n = 8, not per draw as the frozen contract says (per draw is 3.75e-5). At the same n = 6 and unit, R3 measures 2.8e-3 against the predecessor n = 6 arm 95% upper bound of 3.0e-3 (0 of 10^3), which does not separate.'
  - 'BLOCK-8: implementation.md IC-732-3 states the n = 8 box restriction is "Recorded in every R5 raw result". grep returns 0 occurrences of coeff_box_B or scope_note anywhere under runs/.'
  - 'NOTE N-1: the primary metric requires distinct-minimal-model and certified-rank-above-trivial filters; construct_arm applies neither and "above trivial" is undefined. Latent only: all 28 verdicts are PASS and all 28 base-class j-invariants are distinct.'
  - 'NOTE N-2: the near-miss ledger cannot record per-root rejections on productive tuples; 6 rejected roots (5 height, 1 r_zero) are absent from the record.'
  - 'NOTE N-3: peak_rss_bytes is a process high-water mark reported per run (six runs share 30867456; all eight ran in one process); command.txt is synthesised from argv in code.'
  - 'NOTE N-4: solve_n6 silently switches quadratic derivations on the all-ones pattern (construct.py:74-75); the solve_n8 docstring claims a full rational-height enumeration the code does not perform.'
  - 'NOTE N-5: the R3 iv8_untested_statement labels 3-class instances as "single-class coverage"; the true state is that the multi-class path is exercised here for the first time in the program and is uncontrolled.'
  - 'NOTE N-6: SR-11 as discharged ("exclusions reported") is weaker than DEC-20260906-7448cf requires ("counted or explicitly bounded"), and IC-732-5 omits the two exclusions that decision named.'
  required_controls:
  - Every control object must be drawn from the SAME coset and the SAME mixed-sign multi-class d-pattern distribution as the counted arm; the all-ones family is inert at n = 6 by two independent theorems.
  - A positive control built BY the counted path - take a recorded R3 instance, perturb one r_i to violate ellipticity provably (negative) and re-inject an unperturbed one (positive).
  - Persist ainv_d and the exhibited image points per class in the instance record so an independent Weierstrass and Mazur re-verification becomes computable from committed bytes.
  - A null object for the n = 8 arm; there is none in the package.
  - Instrument _n6_quad and the multi-class branch of certify_instance with call counters and re-run R6, R7, R8; expected counts are 0 and 0.
  counterexample_or_mutation: >-
    The decisive mutation is the cheapest one and it is not aimed at the 28: set
    the control d-pattern to all ones and the ellipticity quadratic collapses to
    (0,0,0) identically, which is exactly what every control in this package
    did. The mutation that would restore discrimination is to draw the control
    pattern from the counted arm's own coset. Attempts to find a counterexample
    to the 28 themselves (C-B, C-C) found none.
  baseline_comparison: >-
    The only in-scope baseline is the predecessor draw route recorded in
    EV-ECRANK-8b35bb. At the SAME n = 6 and the same per-b-tuple unit, R3's
    2.8e-3 does not separate from that route's own 95% upper bound of 3.0e-3
    (0 instances from 10^3 b-tuples). The 3e-4 figure the frozen contract
    compares against is the n = 8 per-b-tuple bound, and the contract mislabels
    it as per draw. No Pollard-rho, BSGS or specialized-baseline comparison
    applies: this is a toy-tier rank-construction measurement with no cost path
    to any discrete-log problem, and none is claimed.
  heuristic_challenges:
  - HEUR-1 is neither supported nor refuted by anything in this package and no artifact claims otherwise; the executor's language is clean on this point.
  - The frozen +2 exponent prediction (factor 100 per H decade) is contradicted by the observed decade ratios 1.467 and 1.273; the count is governed by how often the discriminant is a rational square, which is independent of H.
  - The IV-1 anchor "certified totals must equal n - 1" is stated as a closed form but is instantiated against a rank LOWER bound, and at n = 6 against an object that is not elliptic.
  cost_model_challenges:
  - counted_ops is a LOWER bound of unbounded looseness - Fraction construction and its gcd, comparisons, negation and integer work are all uncounted - and R1 and R2 record counted_exact_ops 0 while consuming 0.324303 s and 0.313583 s.
  - ops_cap_respected is computed after the run as counted_ops < 1.0e8 while the stop rule fires at >= 1.0e8, so any capped run necessarily records false. R5's false means the stop rule worked with a 2120-op overshoot, not a budget breach.
  - The 1.0e8 cap and the declared 10^4 n = 8 sample are mutually inconsistent: 149928 ops per tuple implies ~1.50e9 counted ops, 15.0x the cap, at only ~1135 s of wall against a 7200 s budget. The binding constraint was the op cap and this was determinable at design time.
  - wall_seconds_monotonic and wall_seconds_timestamp_span are two clocks over ONE interval sampled one statement apart; they differ by 1e-6 in R4 and R5 and agree in the other six. SR-10 is literally satisfied and purposively empty. cpu_seconds is null in all eight runs by design and peak_rss_bytes is a process, not a run, quantity.
  reduction_and_scope_challenges:
  - No published reduction is cited or instantiated in this package; there is no corollary chain to audit.
  - Scope inflation - none found in the producer's artifacts. The scope defects are in the frozen contract (the per-draw mislabel in metrics.secondary) and in one summary field (the iv8 single-class wording), both upstream of or beside the executor.
  - Every negative outcome here closes only its exact tested scope; the R5 exhaustion and every degenerate_deg_s_2 rejection are instrument facts, never negative mathematical evidence (AGENTS.md core rule 3).
  proof_architecture_challenges:
  - 'Nearby-object attack: the closest object for which the conclusion is false - the all-ones family - is exactly where all three controls live, and the pipeline correctly refuses it. But it refuses it for a reason (deg s <= n/2 - 1) that the counted path cannot realise, so the refusal separates nothing.'
  - 'Observation-fiber attack: holding the recorded certificate fixed (verdict PASS, n_classes 3) and varying the object is not possible from the record, because no a-invariants or points are persisted. That is itself the finding, and the successor requirement is stated.'
  - 'Method-ceiling attack: the n = 8 enumeration''s ceiling under ideal tuning is the number of INTEGER points in [-20,20]^2 at which two resultants vanish simultaneously, which is generically 0. The headline "exhaustive Bezout enumeration within the coefficient box" cannot be reached by this method at either declared H.'
  narrowest_supported_statement: >-
    Scoped to n in {6, 8}, H <= 10^4 at n = 6 and <= 10^3 at n = 8, the seeded
    10^4 b-tuple sample, exact stdlib Fraction arithmetic, the 1.0e8 counted-op
    cap and toy tier: the 28 objects recorded by R3 are, on independent
    recomputation from the committed bytes, 28 structurally valid and pairwise
    non-isomorphic n = 6 prescribed-square instances, and counts_per_H
    {15, 22, 28} reproduces from the recorded r-heights; and NO control in this
    package constrains them, the count is not H-driven, and at fixed n = 6 it
    does not separate from the predecessor draw route's own 95% upper bound.
    Nothing here supports or refutes HEUR-1, moves H-ECRANK-36d8d7, touches C1,
    or extends beyond the tested scope.
  next_concrete_action: >-
    Design (do not yet approve) a controls-repair amendment to EXP-ECRANK-73275e
    whose single required property is that every control object be drawn from
    the same coset and the same mixed-sign multi-class d-pattern distribution as
    the counted arm, replacing the all-ones family with a plant built BY the
    counted path, and persisting ainv_d plus the exhibited points per class so
    an independent Weierstrass and Mazur re-verification becomes computable.
    Queue beside it the predecessor n = 6 draw arm at 10^4 b-tuples, which is
    the cheapest artifact that would make the P4 comparison mean anything.
  artifact_paths:
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e15a65/tasks/TASK-20260907-46731e/redteam-report.md
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e15a65/tasks/TASK-20260907-46731e/review_attestation.yaml
