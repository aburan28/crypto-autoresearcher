  blind_rederivation:
    required: true
    quantity: >-
      N_6(H), the construct_count of specification.yaml metrics.primary, at
      nested H in {10^2, 10^3, 10^4} for the n = 6 arm, together with the
      feasibility fraction over the declared 10^4 b-tuple sample.
    performed_before_producer_records_opened: true
    written_to_disk_before_comparison: true
    written_to_disk_note: >-
      Part A of validation-report.md was written to the deliverable file in
      full - including the definitional-gap list, the candidate b-tuple streams
