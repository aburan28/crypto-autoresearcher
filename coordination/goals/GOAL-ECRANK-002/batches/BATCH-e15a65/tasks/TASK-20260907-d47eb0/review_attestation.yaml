    - joint: J3
      verdict: breaks
      note: >-
        IV-1, whose frozen consequence is that ALL runs are void, is NOT
        SATISFIED - n = 6 branch NOT EVALUATED (no certified total produced,
        so no left-hand side for the required equality with 5), n = 8 branch
        NOT SATISFIED (3 of 8 totals are 5, 6, 6 against 7). Decided from the
        frozen text: 'degeneration is the control behaving correctly' is
        REFUTED, because specification.yaml IV-1, H-ECRANK-36d8d7
        structural_ingredients and proof_search_map.baseline_reproduction all
        name 5 as the expected n = 6 certified total; and the universal reading
        is the only one with operational content, since the contract defines no
        aggregation over b-tuples anywhere. NEW: every n = 8 deviation is
        DOWNWARD, so the plan's proves_too_much failure signature (a) is NOT
        triggered and the certifier fails in its conservative direction. IV-2
        satisfied; IV-3 NOT EVALUATED (0 of 9 plants built, recovered 0/0 is an
        empty denominator); IV-4 conjunct 1 satisfied and conjunct 2 not in the
        record; IV-5 satisfied; IV-6 satisfied on the ceiling; IV-7 satisfied
        for R3/R4 and R2 only; IV-8 NOT SATISFIED with a downgrade (not a
        voiding) as its frozen consequence; IV-9 satisfied for R2 and for R8's
        (b, pattern) clause, with R8's h0 clause a vacuous true over an empty
        set. The frozen invalidation_rules branch on control FAILURE and have
        NO branch for a control that never evaluated - a gap in the contract.
        This reports frozen consequences; it decides no disposition and asserts
        nothing about the mathematics (AGENTS.md rule 3, F4_controls).
    - joint: J4
      verdict: breaks
      note: >-
        BREAKS in one precise sense - N_6(H) and the feasibility fraction are
        NOT independently re-derivable from the frozen contract, so 28 has no
        independent check behind it. It was NOT shown to be wrong, and every
        internal-consistency check on it passed. Overturns coordinator_prior
        item (8), the prior the Coordinator recorded as the one it would most
        like overturned.

