  plan_copy_integrity:
    checked: true
    method: >-
      Parsed the review_plan block from the authoritative
      ledger/decisions/DEC-20260907-9953c0.yaml and compared it field by field,
      whitespace-normalised, against the copy embedded in
      ledger/handoffs/TASK-20260907-d47eb0.yaml, which is the copy this task
      was actually worked against.
    result: >-
      IDENTICAL on every field binding on this reviewer - claim_under_review,
      coordinator_prior, blindness (mutual true, lifted_for empty),
      blind_rederivation.quantity, .parameters, .blind_from and
      .blindness_limits, procedure_deviations (empty in both), and the
      attack_plan and breaking_artifact of J2, J3 and J4.
    divergences_found:
      - field: joints[J1].attack_plan
        nature: >-
          The HANDOFF copy adds a clause the decision omits - 'the predecessor
          practice of deriving a seed from seed times 1000 plus an index is
          forbidden by this contract'. The handoff is a strict superset; no
          requirement was dropped. The stricter check was performed and is
          reported (no derived seed exists anywhere in the package).
      - field: blind_rederivation.read_order_requirement
        nature: >-
          The DECISION copy adds a closing sentence the handoff omits,
          explaining why the re-derivation was not split onto a third reviewer.
          Explanatory only; it imposes no requirement.
      - field: joints[J5,J6,J7].attack_plan and .breaking_artifact
        nature: >-
          The handoff copy abbreviates the three joints this reviewer does not
          own and points to the decision, exactly as the decision's own
          binding_copies_note prescribes. Not a divergence in substance.
      - field: authoritative, authoritative_copy, binding_copies, binding_copies_note, coordinator_prior_earlier_frozen_record, procedure_deviations_note
        nature: >-
          Present in the decision, absent from the handoff copy. Provenance
          metadata about which copy is authoritative; imposes no requirement on
          this reviewer.
    conclusion: >-
      No binding requirement differs between the two copies, and every
      requirement in the union of the two was satisfied. The verdicts in this
      attestation stand against the authoritative plan.

