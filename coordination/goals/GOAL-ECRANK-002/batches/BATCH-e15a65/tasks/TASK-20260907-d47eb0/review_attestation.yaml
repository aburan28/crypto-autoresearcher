      NOT DERIVABLE table - before experiments/EXP-ECRANK-73275e/execution-report.yaml
      or ANY runs/*/raw-result.json was opened. Part B was appended afterwards.
    outcome: NOT DERIVABLE
    outcome_detail: >-
      The frozen contract does not define g, the ellipticity condition, the
      square pattern's enumeration, the height-H coefficient box, 'certified
      rank above the trivial', 'twist class populated', or the
      distinct-minimal-model dedup key (gaps G1-G7), and it does not fix the
      random.Random(760806) call sequence among the four consumers it names.
      375 sampling conventions (3 pool orders x 5 stdlib generators x 25 burn-in
      offsets) all fail to reproduce the recorded b-tuple at b_index 579. Four
      structural predicates committed blind were all confirmed against the
      record, one of them exactly (the <=2-roots ceiling predicted at least 8
      tuples contributing two instances; the record shows exactly 8). The
      value 28 was NOT shown to be wrong; it was shown to have no independent
      check behind it.
    blindness_limit_disclosed: >-
      Implementation-blind, NOT value-blind. The mandatory handoff embeds the
      frozen plan, which quotes 15 / 22 / 28, feasible_tuples 20 and
      feasibility_fraction 0.002 before any reviewer can begin. Disclosed in
      Part A section A.1 rather than discovered afterwards.

