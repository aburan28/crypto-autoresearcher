    DEC-20260903-9c3e26 ruling_1 -- the stamp duty is CAPABILITY-CONDITIONAL. A
    toolless role discharges it by (a) null values with the capability reason
    named in the same block, (b) budget charged at declaration, (c) an explicit
    capability statement, (d) naming who owes each unfilled value. All four are
    discharged here, and the application of that ruling to this task was directed
    by the orchestrating session's task card rather than extended unilaterally by
    this role.

