  reason: >-
    THIS ROLE HOLDS NO COMMAND-EXECUTION TOOL. It cannot run git, sha256sum, a
    clock, or a YAML parser. SC-10 forbids asserting a value it did not obtain: a
    guessed digest is indistinguishable from a computed one and would corrupt
    exactly the binding this receipt exists to create, so each is declared null
    and its owner named. A commit's own sha may not appear inside that commit in
    any case (templates/research-records.md).
  owed_by: >-
    the orchestrating session, at the moment it stages and commits this archive.
    It fills path_sha256 in the dispatch queue's archive block and the dispatcher's
    post-commit verifier binds the commit back to those values.
