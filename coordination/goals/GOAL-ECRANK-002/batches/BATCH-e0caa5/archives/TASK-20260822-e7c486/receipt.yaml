  plain_statement: >-
    THIS ARCHIVE BINDS CONTENT. IT DOES NOT PROVE THAT ONE COMMIT ATOMICALLY
    INTRODUCED THESE BYTES, AND IT MUST NOT BE DESCRIBED AS A
    SNAPSHOT-BEFORE-ANYTHING-WAS-READ. Some of the bytes it binds were already
    in this branch's history before this archive commit exists, placed there by
    in-flight preservation commits made by the orchestrating session while a
    producer was still running.
  authority: >-
    CLAUDE.md, "Archive receipts bind to CONTENT first": research_dispatch.py
    verifies path_sha256 and treats commit reachability as advisory. A content
    mismatch on any declared path is still fatal to this archive.
  what_this_archive_does_establish: >-
    That the six declared paths, as they stand at the commit named in
    context.commit_to_read, are the exact bytes the review round is to read, and
    that the staged set was declared before the commit existed.
  what_it_does_not_establish:
