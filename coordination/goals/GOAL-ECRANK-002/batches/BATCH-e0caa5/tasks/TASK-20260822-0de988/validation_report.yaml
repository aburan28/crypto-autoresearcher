    what_is_re_verified_versus_what_is_claimed:
      claimed_by_a7a9e8: "rank 13 maximum; 11,499 independent points across 1206 curves; independence by non-singular height pairing matrix"
      re_verified_by_the_producer: "on-curve, distinctness, curve non-singular, rank == point count, s reproducible from A - by verify_pool.py, which its own docstring says does NOT re-check the height regulator and which contains NO torsion check"
      re_verified_by_me: "all of the above independently, PLUS the Mazur non-torsion check on all 11,499 points, PLUS the height regulator on 14 of the 31 top curves without PARI"
      residual: "the height regulator for 17 of 31 rank>=12 curves and for all 1175 curves of rank <= 11 has been re-verified by nobody outside the producer's own PARI path"

  # ----------------------------------------------------------------------
  # 8. EXTRAPOLATIONS
  # ----------------------------------------------------------------------
  extrapolation_checks:
    verdict: honestly_reported
    labelled_modeled_not_measured: true
    evidence: >-
      Every one of the four "required" figures carries an explicit MODELED
      label, in the report's own table header ("Every 'required' figure here is
      MODELED extrapolation, not a measured value") AND independently in
      coset_structure.json, where relations 1, 1b and 2 each carry a `label`
