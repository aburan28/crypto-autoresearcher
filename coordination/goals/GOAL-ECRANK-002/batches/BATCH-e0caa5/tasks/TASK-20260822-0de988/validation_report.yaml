      correct
    agrees: true

  # ----------------------------------------------------------------------
  # 4. BLIND RE-DERIVATION (review_plan.blind_rederivation, assigned to me)
  # ----------------------------------------------------------------------
  blind_rederivation:
    required: true
    blind_from_respected: true
    frozen_before_reading_blind_from: true
    sequencing_evidence: >-
      The derivation below was completed and written to a frozen scratch note
      before I opened ANY of the four blind_from paths or any file under
      tasks/TASK-20260822-8df232. Only afterwards did I read 8df232's report,
      coset_structure.json, src/coset_structure.py, subspace_scan.json,
      scan_pool.py and twist_family.py, and the section-3 recomputations above
      that reference them were performed after that point.
    quantity: >-
      the k=3 optimum: the maximum over all cosets of all 3-dimensional
      subgroups V of the support group, of the sum over the 8 classes of the
      number of exhibited independent non-torsion points on the corresponding
      quadratic twist, on the committed pool with support [-1,2,3,5,7,11,13]
    result:
      enumeration_space: DERIVED
      enumeration_space_value: "188976 affine 3-subspaces (11811 subspaces of F_2^7, 16 cosets each); k=4 94488, k=5 10668, k=6 254"
      achieved_lower_bound: DERIVED
      achieved_lower_bound_value: 20
      achieved_lower_bound_basis: >-
        experiments/EXP-ECRANK-e1e30e/certificates/cert_deg8_control.json, which
        is NOT in blind_from. Base curve y^2 = x^3 + 9936x - 2200176, which I
        confirmed is the short model of the declared minimal model
        [0,-1,1,8,-50] via c4 = -368, c6 = 40744. V = {1, -5, 21, -105, -66,
        330, -154, 770}: I verified it is closed under multiplication modulo
        squares, contains the trivial class, has order exactly 8, and every
        class is supported on the declared support. Coset representative 1, so
        the coset is V itself. Per class 3+3+2+2+3+3+2+2 = 20. All 20 points lie
        exactly on their twists; all 20 are non-torsion by Mazur; the
        within-class height regulators are non-singular with smallest
        eigenvalues 0.92, 3.98, 6.20, 10.64, 2.82, 8.35, 4.17, 21.31.
      maximality: NOT_DERIVED
      maximality_reason: >-
        Establishing that 20 is the MAXIMUM, rather than merely attained,
        requires the 497 x 128 (in the scan's own indexing, 502 x 128) matrix of
        per-twist exhibited-point counts. That matrix is not in pool.json, which
        carries only {ai, rank, j}; it is not in the run's raw-result.json,
        which carries only 13 summary metrics; and the only committed copies are
        inside blind_from. Recomputing it needs 63,616 quadratic-twist descents,
        and PARI, cypari, cypari2, gp and Sage are ALL ABSENT in this validator
        session with network access forbidden. So the maximality half of the
        blind statement is not discharged, and I leave it null rather than
        estimate it.
      value: 20
      value_semantics: ">= 20, verified as attained and exactly certified. NOT verified as an upper bound."
    structural_finding_about_the_task_design: >-
      A blind re-deriver of this quantity, in a session without PARI, can
      discharge the enumeration and the attainment but can never discharge
      maximality, because the only artifact carrying the per-twist data is on
      the blind_from list. That is a property of how the blind task was scoped,
      not a producer defect, and it is worth carrying forward: to make the
      maximality half blind-derivable, the per-twist profile table would have to
      be committed as an artifact separate from the scan implementation and its
      output.

  # ----------------------------------------------------------------------
  # 5. JOINT VERDICTS - only the joints review_plan assigns to this task
  # ----------------------------------------------------------------------
  joints:
  - joint: >-
      Every rank attributed to a Mestre-constructed curve is a certified LOWER
      BOUND from exhibited points, never an analytic rank, a Selmer bound, or an
      ellrank r_high.
    assigned_to: TASK-20260822-0de988
    verdict: holds
    breaking_artifact_sought: a claimed rank with fewer exhibited independent points than claimed
    breaking_artifact_found: none
    supporting_evidence:
    - "1206 curves, 13,980 exhibited points: every one satisfies its Weierstrass equation in exact Fraction arithmetic under my own code."
    - "All 11,499 independent points are non-torsion by Mazur under my own code. NO PRODUCER VERIFIER CHECKED THIS; I closed the gap."
    - "certified_rank == len(independent_points) == len(independent_indices) on all 1206; indices valid and non-duplicated; independent points pairwise distinct as group elements."
    - "Height pairing matrices independently recomputed without PARI for 14 of the 31 rank>=12 curves including both rank-13 curves: determinants agree to 0.03-0.81 percent (one-sided, my truncation), smallest eigenvalue in [0.578, 4.424], none near zero."
    - "The Mestre construction re-derives exactly from the recorded A on all 1206 curves, including the 2k simultaneous square conditions."
    - "The headline rank distribution reproduces exactly from the UNTRIMMED RUN-004 raw output recovered from commit 78584ab8c."
    ellrank_provenance_check: >-
      Joint 2's warning that GOAL-ECRANK-001 saw ellrank return [1,1,0,[]] - a
      proven bound with no point, which must contribute zero - is answered. A
      content search of a7a9e8's entire src/ tree finds `ellrank` in exactly one
      module, src/crosscheck_upper.py, whose own header says it is used ONLY as
      a falsification test for an UPPER bound. Its single run, RUN-008, returned
      31/31 alarm timeouts and 0 informative results. No r_high, no r_low, no
      analytic rank and no Selmer bound enters any certified rank anywhere in
      this task. The report states this and it is true.
    scope_of_the_verdict: >-
      Holds for the 1206 curves in the committed pool, at the ranks they claim,
      as LOWER bounds from exhibited points with NUMERICAL independence. It says
      nothing about the true rank of any curve, nothing about an upper bound
      (RUN-008 obtained none), and nothing about any curve outside the pool.
    residual_risk: >-
      Independence rests on a height regulator, which is numerical for the
      producer and numerical for me. An exact independence witness exists for
      none of these curves. Two independent numerical computations agreeing is
      strong but is not an exact certificate, and this should not be reported as
      one.

  - joint: >-
      The reported k = 3 optimum is the true maximum over the enumerated space,
      i.e. the subspace enumeration is complete and the scoring indexes the
      curve it says it does.
    assigned_to: TASK-20260822-0de988
    verdict: inconclusive
    verdict_decomposition:
      enumeration_completeness: holds
      scoring_and_indexing: holds
      maximality: inconclusive
    breaking_artifact_sought: a coset whose recomputed score differs from the reported one
    breaking_artifact_found: none
    why_inconclusive_and_not_broken: >-
      NOTHING IN THIS BATCH CLAIMS MAXIMALITY. 8df232 splits the fixture into
      three levels of different evidentiary force and reports them apart, which
      is exactly right and is the single best thing in this batch. Level A
      (re-derivation from the committed scan table) = 20, reproduced. Level B
      (certificate recomputation with every point re-verified) = 20, reproduced.
      Level C - "the only level that would confirm 20 is a maximum" in the
      report's own words - is recorded as BLOCKED_INFRASTRUCTURE, value null,
      OPEN AND UNATTEMPTED. My blind re-derivation independently reaches the
      same boundary: >= 20 certified, maximality not derivable without a descent
      engine. So the joint as literally stated is not established by this batch,
      and no record asserts that it is. The three levels are NOT silently
      merged: the JSON keeps them as separate keys with separate values, and the
      report's "What level A is and is not" paragraph states the independence
      limits of each.
    scoring_and_indexing_evidence:
    - "Enumeration space sizes derived from Gaussian binomials match the committed scan log exactly at k=3,4,5,6."
    - "All 12,431 sub-coset rows recompute exactly; the (max, total) multiset is identical to mine per source; all cosets are distinct as class sets."
    - "All five certificates pass C1-C6 under my own implementation, including the transport-factor identity on cert_deg16_multiplicity where the coset representative 5 shares a prime with six of the sixteen classes."
    - "Every certificate point lies on the correctly twisted model, so the GOAL-ECRANK-001 XOR-cancellation bug does not recur."
    indexing_weakness_found:
      severity: minor_overstated_corroboration
      detail: >-
        The report's level-A/level-B cross-check ("the argmax curve of level A,
        [0,-1,1,8,-50], is the same base curve as the degree-8 control
        certificate; the two levels agree") rests on an argmax that is NOT
        unique. SIX of the 502 scanned curves attain k3_mult = 20:
        [0,-1,1,8,-50], [1,-1,1,-1,-40], [1,0,0,-7,48], [1,0,1,1,30],
        [1,1,0,-7,25], [1,1,1,17,42]. "The argmax curve" is therefore a
        first-tie artifact of iteration order, and agreement with the
        certificate's base curve is a weaker corroboration than the singular
        phrasing implies. The measured value 20 is unaffected; the strength of
        the cross-check is.
    scope_of_the_verdict: >-
      Scoped to the committed 502-row scan (497 distinct-j pool curves plus 5
      prepended seeds; see the duplicate-row finding below) and the committed
      support [-1,2,3,5,7,11,13]. Says nothing about any extended support and
      nothing about any curve outside that pool.

  joints_not_owned_by_this_task:
    note: >-
      review_plan assigns the separability joint and the degree-8-versus-
      degree-32 certificate-downgrade joint to TASK-20260822-de2fa2. I return NO
      VERDICT on either. Where my recomputations touch the same artifacts I
