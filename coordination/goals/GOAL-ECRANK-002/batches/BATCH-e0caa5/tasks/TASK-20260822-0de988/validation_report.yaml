        observation I can also state as a measurement: 9,145 of the 12,431 rows
        occupy the single cell (max 1, total 8), and 11,780 of 12,431 come from
        n_classes-objective certificates whose classes carry one point by
        construction, which is what makes the tight R^2 = 0.940 fit tight. The
        producer states this itself in O4 item 3 and limitation 5 and reports
        the objectives apart. Weighing it is de2fa2's joint, not mine.
    - joint: "Any degree-8 result is reported as WEAKER IN KIND than the held degree-32 exact certificate"
      assigned_to: TASK-20260822-de2fa2
      my_verdict: none_returned

  # ----------------------------------------------------------------------
  # 6. CONTROL CHECKS - review_plan.proves_too_much, assigned to this task
  # ----------------------------------------------------------------------
  control_checks:
  - control: >-
      OBJECT 1. The committed GOAL-ECRANK-001 pool at k = 3, whose optimum is
      KNOWN to be 20. A pipeline returning more on unchanged inputs has a
      scoring bug, not a discovery.
    known_value: 20
    pipeline_returns: 20
    my_independent_recomputation: 20
    result: PASS
    detail: >-
      The producer's level A returns 20 and my own max over the committed
      502-row table returns 20. Nothing above 20 appears anywhere on unchanged
      inputs and unchanged support. The sibling optima k4 32, k5 52, k6 88 also
      return their committed values under my recomputation, so the failure would
      have shown at four independent points and did not.
  - control: >-
      OBJECT 2. A configuration built only from twists whose exhibited point
      sets are EMPTY (ellrank proved a bound but found no point), whose
      certified total is known to be 0.
    known_value: 0
    pipeline_returns: 0
    result: PASS
    method: >-
      I built a synthetic certificate from cert_deg8_control by emptying every
      class's point list while LEAVING r_low at its proven value of 2 or 3 -
      i.e. exactly the [1,1,0,[]] failure mode the review plan names - and ran
      it through the producer's own src/coset_structure.py verify_cert
      unmodified. recomputed_sum_mult = 0, recomputed_n_classes = 0,
      points_verified = 0, and all six checks still pass (correctly: an empty
      certificate is vacuously well-formed and worth zero).
    corroborating_real_data: >-
      The case occurs in committed data too. cert_deg16_multiplicity has one
      class with zero points and cert_deg32_multiplicity has two; under my own
      recomputation each contributes 0, and the certificates' declared scores
      (32 and 52) are the sums WITHOUT them. In the committed instances r_low is
      also 0 on those classes, so the real data does not exercise the harder
      "proven bound, no point" case - which is why the synthetic version above
      matters, and it passes.
  - control: >-
      OBJECT 3. A configuration whose exhibited points are torsion, e.g. a
      2-torsion point (x,0), whose certified contribution is known to be 0 under
      the Mazur check.
    known_value: 0
    pipeline_returns: 8
    result: FAIL_ON_THE_SCORE_FIELD
    severity: real_defect_narrow_blast_radius
    method: >-
      I built a synthetic certificate on the base curve y^2 = x^3 - 1296x (the
      short model of a-invariants [0,0,0,-1,0]), on which the point (0,0) is
      2-torsion on EVERY quadratic twist, and gave each of the 8 classes that
      single point with r_low = 1. Run through the producer's own verify_cert
      unmodified.
    what_happened: >-
      C3_points_non_torsion_mazur returns False and all_checks_passed returns
      False, so the certificate IS rejected - the Mazur check works and I
      confirmed independently that 2*(0,0) = O on each twist. BUT
      recomputed_sum_mult returns 8 and recomputed_n_classes returns 8, not 0.
      The scoring function is certified = min(r_low, len(points)) and does not
      consult the non-torsion result at all. Repeating with r_low inflated to 3
      still returns 8, so the score is bounded by the point count and by nothing
      about the points' validity.
    against_the_declared_failure_signature: >-
      review_plan.proves_too_much.failure_signature reads "Any nonzero certified
      rank on the second or third object ... means the scorer is measuring
      itself." On object 3 the pipeline returns a nonzero certified rank. The
      signature fires.
    what_this_does_and_does_not_touch: >-
      DOES NOT touch any committed number. C3 passes on all five real
      certificates - I verified that with my own arithmetic, not by reading the
      producer's flag - so no score in coset_structure.json, no row of the
      12,431, and no figure in either report is affected. DOES mean the scorer
      is not itself gated on validity: a reader who takes recomputed_sum_mult
      without also reading all_checks_passed would read a rank off an invalid
      certificate. The two fields are adjacent in the JSON and the report always
      shows them together, so the disclosure is present; the gating is not.
    remedy_for_a_successor: >-
      Set certified := 0 for any class whose points fail C2 or C3, so the score
      cannot be nonzero on an object known to be worth zero. This is a
      four-line change in verify_cert and it should be made in a NEW module in a
      new task, never as an edit to the committed src/coset_structure.py.

