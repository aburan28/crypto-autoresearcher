  metric_recomputations:
  - metric: every exhibited point lies on its curve (a7a9e8)
    scope: all 1206 curves, all 13,980 points in `all_points`
    method: >-
      my own general-Weierstrass evaluation y^2 + a1*x*y + a3*y = x^3 + a2*x^2
      + a4*x + a6 over fractions.Fraction, no floating point
    reported: "exact_check_all_points true on every curve; 'pass, all curves'"
