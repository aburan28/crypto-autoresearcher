    reported: "all pass; sums 20 / 32 / 52 / 32(n_classes) / 64(n_classes); classes with a point 8 / 15 / 30 / 32 / 64; deg64 multiplicity sum 68"
    recomputed: "all six checks pass on all five under my implementation; sums 20 / 32 / 52 / 32 / 68; classes with a point 8 / 15 / 30 / 32 / 64; every class supported on the declared support"
    agrees: true
    transport_note: >-
      cert_deg16_multiplicity is the one with a NON-TRIVIAL coset
