      value modeled). A JSON consumer that never reads the prose still cannot
      mistake them for measurements.
    do_the_fits_agree: NO, AND THE REPORT SAYS SO
    spread_reported_rather_than_a_single_number: true
    detail: >-
      The four values are base rank 11.72 (relation 1), base rank 7.86
      (relation 1b), max single class 17.87 (relation 2) and max single class
      23.80 (relation 2'). The report states plainly "These fits do not agree on
      an answer, and the range they span (base rank ~8 to ~12; max single class
      ~18 to ~24) is the honest width of what was measured", and notes that
      relation 2 and 2' "disagree with each other by 6 units". No single number
      is quoted as the answer anywhere I could find, including in the JSON.
    fit_quality_disclosed: >-
      R^2 = 0.023 for relation 1 is stated in the body text as "base rank
      explains ~2% of the variance", not buried; relation 1b's 4-point support
      and its non-monotone top two points (20 at r0 = 3, 19 at r0 = 4) are
      stated; the degenerate predictor coverage (497 of 502 curves at a single
      value) is stated twice, in O5 and in limitation 7.
    arithmetic_floor_offered_instead: >-
      The report also gives the one fit-free statement available: a k = 3 coset
      has 8 classes, so total 31 requires mean certified rank 3.875 per class
      and at least one class of certified rank >= 4. I confirm the arithmetic
      and confirm from my own enumeration that the largest single-class
      certified rank anywhere in the measured cosets is 4 (15 cosets, all inside
      deg16_multiplicity) and the largest k = 3 total anywhere is 20.
    defect_i_found_that_the_reports_do_not_disclose:
      id: D3
      finding: >-
        The 502 scan rows contain a DUPLICATE CURVE. The conductor-5077 seed
        [0,0,1,-7,6] is prepended as a seed by the committed scan_pool.py AND is
        independently a member of the 497-curve pool (its coefficients satisfy
        |a4| <= 20, |a6| <= 50), so it is scanned twice. The 502 rows cover 501
        distinct curves. Consequently the "n = 497" at base rank 3 in relation
        1's support table double-counts one curve.
      effect_on_the_numbers: >-
        Negligible - one duplicated rank-3 row among 502 - and I did not
        recompute the fits with it removed, so I state the defect and not a
        corrected coefficient. The defect is inherited from the committed
        scan_pool.py, not created by 8df232, and 8df232's transcription of the
        seed table into its SEED_CURVES constant is faithful: I compared it
        line for line against scan_pool.py lines 25-27 and it matches exactly,
        including all five ranks.

  # ----------------------------------------------------------------------
  # 9. INDEPENDENCE AND SCOPE
  # ----------------------------------------------------------------------
  scope_checks:
