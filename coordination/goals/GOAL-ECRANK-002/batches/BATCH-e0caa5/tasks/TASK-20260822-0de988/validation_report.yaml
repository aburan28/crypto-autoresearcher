      That disclosure is correct and complete.
    the_augmented_pool_gap:
      severity: MATERIAL_FOR_THE_CLAIM_AS_FRAMED
      finding: >-
        review_plan.claim_under_review item (b) reads "the k = 3 and k = 4
        twist-family optima on the AUGMENTED POOL". NO SUCH MEASUREMENT EXISTS
        IN THIS BATCH. 8df232's handoff scopes it to "the committed
        GOAL-ECRANK-001 pool", its inputs list names pool.json,
        twist_family.py and analysis.md and nothing of a7a9e8's, and its report
        states the pool it used. a7a9e8's 1206 constructed curves - including
        the two of rank 13 - were never entered into any twist-family scan at
        any k. The two producers did not exchange artifacts at all.
      consequence: >-
        H-ECRANK-f2a2f7's prediction P2 ("the k = 3 optimum rises above the
        committed 20 when a higher-rank base curve enters the pool") is
        UNTESTED by this batch, in either direction. Neither producer claims
        otherwise; the gap is in the claim as the review plan frames it, not in
        anything a producer wrote. No record should read the batch's 13 and its
        20 as the two halves of one measurement - they are measurements on
        disjoint object sets.
      a_measured_obstacle_a_successor_should_know: >-
        RUN-a7a9e8-008 measured 31/31 ellrank timeouts at a 25 s alarm on the
        rank>=12 BASE curves, whose coefficients are a4 ~ 1e19 and a6 ~ 1e28.
        Twisting by d up to 30030 scales them to a4*d^2 ~ 1e28 and a6*d^3 ~ 1e41,
        so the 128 descents per curve that the twist-family scan needs are
        strictly harder than the ones already measured to time out. This is an
        INFRASTRUCTURE observation about a tool at a coefficient size, recorded
        so a successor does not budget for it as if it were the committed pool's
        1.5 s per curve. Under AGENTS.md rule 3 it is NOT evidence that P2 is
        false and NOT evidence that the construction fails; it says only that
        this descent engine at these sizes is the wrong instrument.
    scale_binding:
      tier_declared_by_the_experiment: toy
      producers_scale_statements: >-
        8df232 limitation 9 states "Toy scale ... Nothing here transfers to
        cryptographic scale, and no number here is offered as a
        cryptographic-scale claim." a7a9e8 makes no scale claim at all and
        states its measurements as measurements.
      my_check: >-
        I searched both reports and both JSON deliverables for any statement
        that leaves the tested scope. I found none. No ECDLP claim, no speedup
        claim, no asymptotic claim, no cryptographic-parameter claim, and no
        statement about rank over Q beyond the exhibited certificates. The
        experiment's own specification records asymptotic_claim as explicitly
        null with the reason. This is correct and I record it as a pass rather
        than as an absence.
    conclusion_exceeds_tested_scope_anywhere: false

  # ----------------------------------------------------------------------
  # 10. THE THREE THINGS THE ARCHIVE ITSELF DISCLOSES
  # ----------------------------------------------------------------------
  environment_split_finding:
    fact: >-
      a7a9e8 ran with cypari 2.5.6 / PARI 2.15.4 on Linux-6.18.44-fc-v21.
      8df232 ran with no PARI, no cypari, no cypari2, no gp and no Sage on
      Linux-6.18.44-fc-v24. I verified both from the committed environment.json
      and report text, and I verified the absence a third time in my own
      session, which is also fc-v24 and also has no PARI.
    effect_on_batch_completeness: >-
      ONE OF FOUR DELIVERABLES WAS NOT PRODUCED. 8df232's handoff deliverable 2
      (extended twist support beyond 7 primes, with k = 3 and k = 4
      re-optimisation) is entirely absent, and level C of the regression fixture
      - the only level that could establish maximality - is absent for the same
      reason. Deliverables 1, 3 and 4 were produced in full and all reproduce
      under my independent implementation.
    is_any_record_treating_it_as_negative_evidence: NO
    evidence_for_that_answer: >-
      I checked every place it could have leaked. 8df232's report gives it a
      dedicated section headed as an infrastructure fact and says "It is not
      mathematical evidence of any kind, in any direction"; O3 marks the
      unattempted deliverable "not tried, not screened, not a negative
      observation"; limitation 1 repeats it; coset_structure.json's level C
      carries status BLOCKED_INFRASTRUCTURE, value null and the note "NOT
      evidence for or against anything mathematical"; and the JSON has an
      `open_and_unattempted` key rather than a zero or an estimate. a7a9e8's
      RUN-008 does the same for its 31/31 timeouts: "Per the handoff this is an
      infrastructure outcome and decides nothing in either direction; it is
      neither evidence for nor against the rank claims." The receipt's
      claim_boundaries repeats it. AGENTS.md rule 3 is satisfied everywhere,
      including in the JSON where a machine reader looks.
    cost_of_the_re_run:
      basis: >-
        The committed scan log records the full pass at roughly 1.5 s per curve
        for 128 twists ([175/502 265s]), so 502 curves took about 760 s of
        descent-plus-scan on a PARI-equipped host.
      descent_half_at_8_primes: "roughly 1500 s, since 256 twists is twice 128 and the per-descent cost is unchanged"
      producers_own_worst_case: >-
        8df232 states the pass as "~502 curves x 256 twists at a 3 s descent
        alarm", which if every descent hit its alarm would be 128,512 x 3 s ~
        107 CPU-hours. That is the ceiling, not the expectation; the measured
        rate above is the expectation and it is about 25 minutes.
      enumeration_half_grows_faster: >-
        Not costed by either producer, and it should be. At 8 primes the k = 3
        affine-subspace count rises from 188,976 to 97,155 x 32 = 3,108,960 (a
        factor of 16.4) and k = 4 from 94,488 to 200,787 x 16 = 3,212,592 (a
        factor of 34). The scan, not the descent, becomes the binding cost.
        Memory should be reported beside time for that pass; the committed run
        recorded neither for the enumeration.
      conclusion: >-
        Cheap and clearly re-runnable on a provisioned session. It is a live
        next action, not a dead end, and it stays OPEN AND UNATTEMPTED until
        someone runs it.

  double_binding_finding:
    fact: >-
      Two of the six bound producer paths - highrank_pool.json and a7a9e8's
      report.md - are also bound by the completed archive TASK-20260822-66bacf
      under GOAL-ECQ-001 (BATCH-7e06d3). I read that receipt and confirmed it
      names both paths with digests 3d8620ea...1a24 and 00cd7dd5...440,
      identical to this archive's. It additionally binds a third a7a9e8 path,
      runs/RUN-a7a9e8-002-m10-main/raw-result.json.gz at 7c8d7df4...728e, which
      this archive does not bind.
    is_it_independent_corroboration: NO
    reasoning: >-
      Identical digests on identical paths are ONE CONTENT BINDING RECORDED
      TWICE. Both receipts bind content_first with commit_sha null, so neither
      adds an independent commit witness either. No downstream record may cite
      the two archives as two independent bindings, and none may cite this
      archive as the origin of those bytes. e7c486's receipt says all of this
      itself in its `prior_archive_of_overlapping_bytes` block, correctly and
      unprompted; I confirm it against the ECQ-001 receipt and add nothing.
    a_consequence_worth_carrying: >-
      The .gz that carries RUN-a7a9e8-002's 112 MB raw output is bound ONLY by
      66bacf. A consumer resolving only this archive's declared set does not
      receive it. I exercised its recovery path and it is sound (see
      metric_recomputations), so this is a routing fact, not a loss.
    an_error_that_has_already_propagated: >-
      66bacf's receipt repeats, as a carried-forward deviation, the claim that
      "RUN-a7a9e8-007-independent-verify/raw-result.json (same treatment)" was
      trimmed. That claim is FALSE (see defect D2), and it is now in two
      committed records. A superseding record should correct both by reference,
      and neither may be edited.

  attribution_adjudication:
    disputed_statement: >-
      a7a9e8's report.md section 6.1 attributes the concurrent external write
      into its own run directory to "evidently the archiving task
      TASK-20260822-e7c486". The committed
      CORRECTION-anomaly-A1-attribution.md, in the same directory, attributes it
      to the orchestrating session. The archive deliberately did not adjudicate.
    i_adjudicate: THE REPORT IS WRONG; THE CORRECTION IS RIGHT
    evidence:
    - "The two files, raw-result.json.gz and RAW-RESULT-STORAGE.md, were committed at 4df65c1c2 on 2026-08-22 14:36:56 +0000."
    - "RUN-a7a9e8-004's manifest gives its window as 2026-08-22 14:34:12Z to 14:45:56Z. The write lands inside it, which is exactly what the producer observed."
    - "TASK-20260822-e7c486's lane claim was acquired 2026-09-04T19:24:50Z and released 2026-09-04T19:33:25Z - THIRTEEN DAYS after the write. It could not have made it."
    - "e7c486's declared write_scope in that claim is [.../archives/TASK-20260822-e7c486, ledger] and has never included the a7a9e8 task directory, so it was never authorised to write there even now."
    - "The RAW-RESULT-STORAGE.md content is written in the orchestrator's voice ('The Coordinator snapshot archive must hash raw-result.json.gz'), i.e. it instructs the archive rather than being written by it."
    a_detail_that_does_not_disturb_the_adjudication: >-
      The CORRECTION's incidental sentence "TASK-20260822-e7c486 has never run.
      It is still blocked in the dispatch queue" was true when written and is
      now superseded - e7c486 ran on 2026-09-04 and produced the receipt I am
      validating. That does not touch the finding, because the write predates
      e7c486's claim by thirteen days on the timestamps above.
    consequence_for_the_rank_claims: NONE
    reasoning: >-
      The interference was purely additive - a compressed copy plus a note plus
      a local .git/info/exclude entry. No result file was modified by it, and I
      verified the .gz roundtrips byte-exactly to the producer's original. The
      write-scope violation is real and belongs to the orchestrating session,
      which recorded it against itself; nothing about it casts doubt on any
      certified rank.
    remedy: >-
      Both documents are committed and immutable. The CORRECTION already IS the
      superseding record and it is correct. Nothing needs repair; the ledger
