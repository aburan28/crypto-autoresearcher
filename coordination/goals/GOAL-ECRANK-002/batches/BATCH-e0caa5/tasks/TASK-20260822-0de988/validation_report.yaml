    joints:
    - joint: "The claimed base rank needed for 31 at k = 3 is MEASURED, not assumed"
      assigned_to: TASK-20260822-de2fa2
      my_verdict: none_returned
      measurements_i_can_offer_without_concluding: >-
        The full (max_single_class, total) contingency table recomputes exactly,
        including the cells that bear on separability: at max = 3 within
        deg32_multiplicity the total takes 10, 12, 14, 16 and 18; over the 651
        sum_mult cosets `others` spans 6 to 17 on a mean of 10.41; the
        conditional mean of `others` rises 9.4945 -> 10.6954 -> 13.0667 as max
        goes 2 -> 3 -> 4. All of these are the producer's own numbers and all
