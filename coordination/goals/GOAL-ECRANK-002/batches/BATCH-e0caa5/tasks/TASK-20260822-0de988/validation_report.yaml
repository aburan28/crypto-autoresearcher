      exactly these seven primes under my own factorisation, and no
      extended-support number exists in coset_structure.json
      (provenance.support_extended is null).
    base_curves_actually_carrying_the_coset_statistics: >-
      FIVE, not 502. The 12,431 cosets are all the k = 3 sub-cosets of five
      certified cosets on the base curves [0,-1,1,8,-50], [1,-1,1,-1,-40]
      (twice, at coset representatives 5 and 1), [1,-1,1,0,0] and [1,0,1,4,21].
      I confirmed this by reading the seed a-invariants out of the five
      certificates. 8df232 states it as limitation 4 and adds the selection
      caveat - those curves were chosen as certificate carriers, i.e. for being
