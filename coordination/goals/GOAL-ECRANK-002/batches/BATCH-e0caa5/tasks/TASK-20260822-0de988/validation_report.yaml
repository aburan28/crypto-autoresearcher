  # ----------------------------------------------------------------------
  # 11. DEFECTS THAT REQUIRE A SUPERSEDING RECORD
  # ----------------------------------------------------------------------
  defects_requiring_a_superseding_record:
  - id: D1
    severity: metric_recomputation_failure
    where: "TASK-20260822-a7a9e8/report.md, section 3 (Singular-determinant handling) and section 5 item 3"
    claim: >-
      "in RUN-004, 24 660 of the 34 740 augmented curves gained nothing from
      their extra points" and "9 885 curves yielded 30 831 extra points; 71% of
      curves with extras gained no rank at all"
    measured_against_the_untrimmed_original: >-
      The figure 24,660 does not reproduce under any reading. Curves with zero
      extras: 24,855. Curves with zero extras and base rank 9: 24,620. Curves
      with extras that gained no rank: 5,552. Curves that gained no rank at all:
      30,407. Total gainers: 4,333. None is 24,660, and 24,660 lies between two
      of them. The "71%" is 24660/34740 = 0.7098, i.e. it is the same
      unreproducible figure re-expressed as a fraction of ALL 34,740 curves,
      while the sentence attaches it to "curves with extras". The correct
      measured values are 5,552 of 9,885 = 56.2% of curves with extras, or
      30,407 of 34,740 = 87.5% of all curves.
    what_still_holds: >-
      The surrounding claims are all TRUE on the measured data - 9,885 and
      30,831 reproduce exactly, and the qualitative point ("extra points are
      usually dependent"; "the detector discriminates; it does not
      rubber-stamp") is supported by 56.2% and 87.5% just as it would have been
      by 71%. What fails is the specific figure, not the conclusion it decorates.
    classification: >-
      A recomputation mismatch on a derived descriptive statistic, NOT a
      fabricated run and NOT a fabricated measurement. The run is real, its raw
      output is recoverable, and its headline table reproduces exactly. Calling
      this fabrication would be wrong and I do not.
    remedy: a new correction record giving the measured values; report.md is immutable and must not be edited
  - id: D2
    severity: provenance_record_inaccuracy
    where: "TASK-20260822-a7a9e8/DEVIATION-immutability-trim.md, and carried into TASK-20260822-66bacf's receipt"
    claim: >-
      that RUN-a7a9e8-007-independent-verify/raw-result.json received the "same
      treatment" as RUN-004's - 2,361,552 lines deleted, 34,740 records reduced
      to the first 300
    measured: >-
      RUN-007's raw-result.json went from 58 bytes at commit e278a3446 to 289
      bytes at commit 1e9452fdb. It GREW. The 58-byte version was the raw stdout
      text "curves=1206 points_checked=11499 failures=0 / VERDICT: PASS"; the
      289-byte version is the same three numbers wrapped in JSON. It was
      reformatted, never trimmed, and it never held records to delete. It also
      carries no _trim_note.
    the_real_breach_measured: >-
      RUN-004's raw-result.json: 35,039,973 bytes at 78584ab8c to 277,063 bytes
      at 1e9452fdb, 34,740 records to 300. That one is exactly as described and
      is a genuine in-place overwrite of a completed run record. Plus: the line
      `raw_result_trimmed_for_storage: see _trim_note in raw-result.json` was
      appended to the manifests of ALL SEVEN runs 001-007, but only RUN-004's
      raw-result.json contains a _trim_note. Five manifests now point a reader
      at a marker that does not exist, and RUN-005 has no raw-result.json at all
      to point at.
    consequence: >-
      AGENTS.md rule 2 was breached (once, on RUN-004's raw result, plus seven
      manifest edits), and the deviation note that records the breach overstates
      its extent by one run while understating it by five inaccurate manifest
      lines. Nothing was lost: I rebuilt both originals and verified them.
    remedy: a new correction record; three committed files are involved and none may be edited
  - id: D3
    severity: minor_undisclosed_data_property
    where: the committed 502-row scan, inherited by both 8df232 relations that use it
    detail: see extrapolation_checks.defect_i_found_that_the_reports_do_not_disclose
  - id: D4
    severity: control_gap
    where: "TASK-20260822-8df232/src/coset_structure.py, verify_cert"
    detail: see control_checks OBJECT 3 - the score is not gated on the non-torsion check
  - id: D5
    severity: manifest_field_contradiction
    where: "RUN-8df232-001/002/003 manifests, and all eight a7a9e8 manifests"
    detail: >-
      8df232's runs 001-003 declare the final script_sha256 for runs that used an
      unrecorded intermediate revision, contradicting their own note field.
      a7a9e8's manifests record no code commit, no dirty flag, no command and no
      inference block, and its report declares a single implementation commit
      that is correct for only two of its eight runs. Neither defect touches a
      measured value; both weaken re-execution.

  # ----------------------------------------------------------------------
  # 12. THINGS THIS BATCH GOT RIGHT, RECORDED BECAUSE THEY CONSTRAIN READERS
  # ----------------------------------------------------------------------
  commendations:
  - >-
      THE THREE-LEVEL FIXTURE IS THE MODEL. 8df232 separates artifact
      re-derivation, certificate recomputation and search reproduction, gives
      each its own value and status, states in one paragraph what each level is
      and is not, and refuses to let the two that succeeded stand in for the one
      that could not run. My independent path reached the same boundary from the
      other side. Nothing here is silently merged.
  - >-
      Every blocked quantity is named OPEN AND UNATTEMPTED in both the prose and
      the machine-readable artifact, with an explicit "not tried, not screened,
      not negative" and a stated unblocking condition. That is rule 3 honoured
      where a machine reader will see it, not only where a human will.
  - >-
      The producer's own limitations section pre-empts most of what an adversary
      would raise: the five-curve base, the objective mixing, the selection
      conditioning, the degenerate base-rank coverage, and the "distrust the
      pooled row" warning printed next to the pooled row.
  - >-
      a7a9e8's structural ceilings are stated as predictions and then measured
      against: M8 hit exactly 7 on 1,751 of 2,985 curves and never 8; M10 hit
      exactly 9 on 32,805 of 39,876 and never 10. A construction that saturated
      at its own function-theoretic bound and was reported as doing so is a
      negative result reported at full strength.
  - >-
      RUN-008 is a falsification attempt that returned nothing and was reported
      anyway, correctly classified as an infrastructure outcome contributing to
      neither side.

  heuristic_validation_checks:
  - check: pre-registered prediction
    applicable: false
    reason: >-
      The experiment's own specification records preregistered_prediction as
      "NOT APPLICABLE AS A STATISTICAL PREDICTION", with the reason stated
      rather than left null: this work exhibits a witness rather than inferring
      from a sample, so search order cannot inflate the result. I checked that
      reasoning and it is sound for the certificate, and the specification is
      careful to add that search order DOES affect the OPTIMALITY claim, which
      is why the smallest degree reached is reported as achieved-by-this-
      pipeline and explicitly not as a proof of minimality. That distinction is
      exactly the one at issue in joint 2 and the specification already drew it.
  - check: heuristic_assumptions
    applicable: false
    reason: "H-ECRANK-f2a2f7 records heuristic_assumptions as an empty list with the reason: the deliverable is a finite exact certificate or a measured number, neither resting on a heuristic. Confirmed - no numbered heuristic appears anywhere in the batch."
  - check: null-object control before belief (inventor protocol section 3)
    applicable: true
    result: see control_checks; two of three pass, object 3 fails on the score field
    decay_question: >-
      The protocol asks what a reported quantity SHOULD do as the parameter
      meant to destroy it increases. Here the destroying parameter is the
      objective: on n_classes-objective certificates, where classes carry one
      point by construction, the `others` spread SHOULD collapse - and it does,
      from 11 down to 2, with R^2 rising from 0.315 to 0.940. The quantity
      behaves as it should, and the producer reports the two regimes apart
      rather than pooling them. That is the artifact tell coming back clean,
      and I record it as a pass.
  cost_model_checks:
  - check: concrete cost table with declared unit
    applicable: partially
    finding: >-
      a7a9e8 reports per-unit costs with units declared (M10 construction plus
      9x9 regulator ~9.4 ms/curve; augmentation scan plus regulator ~20
      ms/curve; ~2.2e8 integer square tests in RUN-004) and reports wall clock
      per run against a stated cap. NEITHER PRODUCER REPORTS MEMORY BESIDE TIME:
      a7a9e8 records a 4 GB cap and that no cap was hit but no peak, and 8df232
      records peak memory qualitatively as "under 1 GB" rather than measuring
      it. For a re-run whose enumeration half grows 16-34x (see
      environment_split_finding.cost_of_the_re_run) memory is the axis most
      likely to bind, and it is the axis neither report measures.
  - check: expected cost as per-attempt cost times inverse success probability
    applicable: true
    finding: >-
      a7a9e8 gives the success side honestly as measured yields - 84.6% stay at
      9, 9.9% reach 10, 1.22% reach 11, 0.083% reach 12, 0.0058% reach 13, all
      of which I reproduced exactly from the untrimmed raw - and states "each
      further step costs roughly a 10x larger sample than the last". It does not
      multiply that out into an expected cost for rank 14, which is the honest
      choice given that the 13 row rests on 2 curves. No optimistic assumption
      is smuggled in.
  proof_architecture_checks:
  - check: baseline fixture reproduces the cited baseline exactly
    result: pass_at_two_of_three_levels
    detail: >-
      H-ECRANK-f2a2f7's proof_search_map requires "The new scan must reproduce
      20 on the committed pool with the committed support before any
      extended-support number is believed. A frozen regression fixture, not a
      re-derivation." Levels A and B reproduce 20 exactly, confirmed
      independently by me. Level C did not run. Critically, the gate did its
      job: NO extended-support number was produced, so nothing was believed on
      an unreproduced fixture. The producer records both reasons for that -
      the fixture's level C and the PARI absence - and says neither is used to
      hide the other. I confirm both reasons are real and independent.
  - check: strictness witness for an improvement claim
    result: not_applicable_no_improvement_claimed
    detail: "Neither producer claims an improvement over the committed 20 or over the held certificates. a7a9e8's 13 is a measurement on a different object set; see scope_checks.the_augmented_pool_gap."
  - check: observation collisions bound to their enumerated scope
    result: pass
    detail: >-
      The 12,431 cosets are bound to the five certificates they come from, the
      binding is recorded per row in k3_coset_rows.json, and the producer states
      that a bounded search over five selected curves certifies nothing globally
      (limitations 4 and 6). The 188,976-subspace enumeration is complete for
      its stated space and I verified the count from first principles.
  - check: method ceiling stated from the method's own resource measure
    result: not_owned_by_this_task
    detail: "The degree-8-versus-degree-32 certificate-downgrade joint is assigned to TASK-20260822-de2fa2. I note only, as a fact I verified, that the eigenspace argument at k = 3 covers 8 of the 20 exhibited points and the other 12 rest on within-class multiplicities whose regulators I recomputed."
  - check: quantifier fidelity
    result: pass
    detail: >-
      H-ECRANK-f2a2f7 states EXISTS E, EXISTS V, FOR ALL 8 classes. The
      certificate exhibits one E, one V and all 8 classes explicitly, so the
      witness dependency order in the artifact matches the claim. No per-instance
      witness is presented as uniform anywhere.

  limitations:
  - >-
      I could run NO new descent. PARI, cypari, cypari2, gp and Sage are absent
      in this session and the network is closed. Every per-class r_low in this
      report is PARI's, taken from committed certificates, exactly as it is for
      8df232. Independent re-derivation of any r_low is OPEN AND UNATTEMPTED.
  - >-
      The maximality of the k = 3 optimum is not established by this batch and is
      not established by me. I verified >= 20 and nothing about <= 20.
  - >-
      My independence checks on the height regulator are NUMERICAL and cover 14
      of the 31 curves of certified rank >= 12. The other 17, and all 1,175
      curves of rank <= 11, have had their regulators re-verified by nobody
      outside the producer's own PARI path. My canonical heights carry a
      truncation error of order 1e-2 absolute at n = 6 (measured by comparing
      n = 4, 5 and 6), which is far below the smallest eigenvalue observed but
      is not zero.
  - >-
      I did not reproduce the producer's 120-digit and 250-digit regulator
      determinants, only its 60-digit values to within my own truncation. Its
      claim that the three precisions agree is unchecked by me.
  - >-
      Everything here is scoped to: the 1206 curves of highrank_pool.json; the
      committed 502-row scan over 501 distinct curves; the five certificates of
      EXP-ECRANK-e1e30e; the support [-1,2,3,5,7,11,13]; and the budgets the
      producers recorded. It is toy scale by the experiment's own declaration and
      supports no cryptographic claim of any kind.
  - >-
      A passed or partially-passed check here means a receipt is admissible
      evidence. It supports no ECDLP claim, demonstrates no speedup, and
      authorises no promotion of H-ECRANK-f2a2f7 or of GOAL-ECRANK-002.

