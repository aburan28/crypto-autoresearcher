  Q1_n6_ellipticity_quadratic:
    mechanism_statement: >
      Let b = (b_1, ..., b_n) be n distinct rationals and d = (d_1, ..., d_n)
      prescribed values. Define p(x) = prod_i (x - b_i) (monic, degree n) and
      delta(x) = the unique polynomial of degree <= n - 1 with delta(b_i) = d_i
      (Lagrange interpolant). For a monic polynomial g, define
      s(x) := delta(x) * g(x)^2 mod p(x)  (the remainder on division by p, so
      deg s <= n - 1). The identity s(b_i) = d_i * g(b_i)^2 holds for every i
      and every g. The ELLIPTICITY condition is deg s <= 4: since the remainder
      has degree <= n - 1, this is the vanishing of the top n - 5 coefficients
      of delta*g^2 mod p. At n = 6 this is a SINGLE condition: the coefficient
      of x^5 in the remainder vanishes. The NONDEGENERACY conditions are:
      g(b_i) != 0 for every i; deg s in {3, 4}; and s nonsingular (for
      deg s = 4: disc(s) != 0 treating v^2 = s(u); for deg s = 3: s cubic with
      nonzero discriminant).
    frozen_parameters:
      n: 6
      b: [0, 1, 7, -14, 16, -2]
      d: [-2310, 30030, 30030, -286, -286, -2310]
      g_convention: >
        g is monic with exactly ONE free coefficient (the frozen contract's
        'single univariate quadratic' at n = 6): g(x) = x + c, c in Q. If the
        derivation shows this convention makes the ellipticity condition
        degenerate or not quadratic in c, RECORD THAT AS THE FINDING — do not
        silently switch conventions.
      box: >
        Enumerate ALL exact rational roots c of the derived quadratic; for each
        root report numerator, denominator, |c|, and max(|num|, |den|) in
        lowest terms, and whether max(|num|, |den|) <= 10^4 and whether
        |c| <= 10^4 (both conventions reported; the mapping to the producer's
        height convention happens in the comparison step, not here).
    derivation_required:
      - Compute delta(x) exactly (degree <= 5, delta(b_i) = d_i).
      - Compute delta(x)*(x + c)^2 mod p(x) symbolically in c.
      - Extract the x^5 coefficient as a polynomial in c; verify it is quadratic in c; give its exact coefficients.
      - Solve exactly over Q; report every rational root with the normal forms above.
      - For each root: check g(b_i) != 0 for all i, compute s exactly, report deg s, disc(s), and whether the nondegeneracy conditions hold.
      - Verify the identity s(b_i) = d_i * g(b_i)^2 symbolically (it must hold identically).

  Q2_expected_meets_arithmetic:
    statement: >
      A draw stream takes N_a independent uniform draws on a finite set S with
      |S| = S_abs. One distinguished element (the plant) lies in S. A 'meet' is
      a draw that equals the plant. Under declared uniformity the meet count is
      Binomial(N_a, 1/S_abs).
    frozen_parameters:
      N_a: 8000
      S_abs: 1600
    derivation_required:
      - Derive E[meets] = N_a / S_abs exactly.
      - Derive the exact variance and standard deviation of the meet count.
      - Compute P(meets <= 3) under the null (exact rational binomial sum, or an exact-arithmetic-verified closed form; state the method).
      - State, as a derivation-only conclusion, whether an observed count of 3 would be an outlier under this null (it is NOT: do not assume any observed value here; the comparison step supplies observations).

