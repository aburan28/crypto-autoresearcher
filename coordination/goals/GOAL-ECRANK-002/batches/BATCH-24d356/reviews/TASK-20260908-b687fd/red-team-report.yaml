verdict_j1: holds
verdict_j1_rationale: >
  The contract-design-defect reading HOLDS. At n=6, the d=(1..1) control
  objects are conics (deg s = 2 for all 8 R7 tuples), so the pipeline's
  degenerate_deg_s_2 rejection is mathematically CORRECT, and the
  contract's expected certified total n-1 = 5 is UNSATISFIABLE through
  any pipeline enforcing deg s in {3,4}. This is a CONTRACT-DESIGN
  DEFECT in the control expectation, not an implementation defect. At
  n=8, the control objects are elliptic (deg s = 3 for all 8 tuples),
  and the recorded shortfalls (5, 6, 6) are F_l certifier lower-bound
  limitations (finite prime bound 1500), NOT contradictions of the
  closed form (true rank = 7). The pipeline is working correctly in all
  cases. The control failures are contract-design defects, not
  implementation defects. The invalidation cascade is mapped
  clause-by-clause; the recommended reading is C (no runs voided; all
  runs survive as measurements), with the warrant that the IV-1/IV-3
  "failures" are contract-design defects, not pipeline/solver defects.

verdict_j4: breaks
verdict_j4_rationale: >
  The J4 joint is "proves_too_much." Of the four objects: (a) the
  solver-validation inference BREAKS at the R8 control (the plants are
  non-elliptic, so the control does not validate the solver's detection
  path for elliptic instances); (b) the blanket P4 inference SURVIVES
  (the R6 null correctly reports 0 solutions); (c) the literal IV-1
  reading PROVES TOO MUCH (it voids passing runs without textual
  warrant); (d) the P4 unit alignment SURVIVES (the comparison is valid
  at the per-tuple scale). Since at least one of the proves-too-much
  objects breaks (a) and one proves too much (c), the overall J4
  verdict is "breaks."

