invalidation_map:
  textual_conflict: >
    The frozen contract carries a TEXTUAL CONFLICT between two clauses:
    (1) specification.yaml invalidation_rules[0]: "IV-1 failure voids ALL
    runs of this experiment (known-false control)."
    (2) specification.yaml falsification_criterion F4_controls (carried
    verbatim from H-ECRANK-36d8d7): "Any of R1 (smoke), R4 (replay), R6
    (null object), R7 (known-false), R8 (planted yield) fails its
    pre-registered check. closes: nothing about the mathematics; the
    AFFECTED runs are VOID (failed_infrastructure / invalid), per core
    rule 3."
    Clause (1) says ALL runs are voided; clause (2) says only the
    AFFECTED runs are voided. These are different. The resolution is
    Coordinator work; I name the conflict and map the consequences under
    each coherent reading, but I do NOT resolve it.

  clause_by_clause:
    - control: IV-1 (known-false d=(1..1), R7)
      contract_text: "certified totals must equal n - 1 (5 and 7); failure voids ALL runs."
      recorded_outcome: >
        n=6: all 8 tuples built=False (degenerate_deg_s_2). n=8: totals
        [5,6,7,7,7,7,6,7] vs expected 7 (n8_all_match=false).
      fired: true
      nature_of_failure: >
        CONTRACT-DESIGN DEFECT, not a pipeline defect. At n=6 the control
        objects are conics (deg s = 2), so the pipeline's rejection is
        mathematically correct and the expected total 5 is unsatisfiable.
        At n=8 the control objects are elliptic (deg s = 3), but the F_l
        certifier's finite prime bound (1500) certifies only 5 or 6 for 3
        of 8 tuples (a lower-bound limitation, not a pipeline defect).
        The pipeline is working correctly in both cases.
      invalidation_text: "voids ALL runs"
    - control: IV-2 (arm replay R4)
      contract_text: "R4 must reproduce R3's instance list, counts, and op ledger bit-for-bit; failure voids R3 and R5 readings."
      recorded_outcome: "R4 instance list identical to R3; ops 9191003 == 9191003; counts_per_H equal after JSON."
      fired: false
      note: "IV-2 did NOT fire. R4 passed its pre-registered check."
    - control: IV-3 (planted yield R8)
      contract_text: "instances planted from the R7 family must be detected by the construction solver with the exponent gate; failure voids R3/R5 readings."
      recorded_outcome: "0 of 9 plants built (degenerate_deg_s_2); recovered 0/0; slope null."
      fired: true
      nature_of_failure: >
        CONTRACT-DESIGN DEFECT, not a solver defect. The R8 plants are the
        d=(1..1) family at n=6, which is non-elliptic by nature (conics,
        deg s = 2). The solver's rejection (degenerate_deg_s_2) is
        mathematically correct. The plants were never valid elliptic
        instances to detect, so the solver did not "miss" anything. The
        IV-3 control is based on a false premise (that the R7 family at
        n=6 is elliptic).
      invalidation_text: "voids R3/R5 readings"
    - control: IV-4 (null object R6)
      contract_text: "the solver on the null_family must return exactly 0 solutions and the audit code must flag the infeasibility; a nonzero result voids the solver for all counts."
      recorded_outcome: "R6 found exactly [] (0 solutions); feasible_tuples 0; n_b_done 64/64."
      fired: false
      note: >
        IV-4 did NOT fire. R6 found exactly 0 solutions, as the null
        family requires. The PD-1 recording gap (null_proof_first is null
        because construct_arm overwrote the b_index-0 proof on later
        tuples) is a RECORDING gap, not a control failure: the frozen
        infeasibility proof remains in source/null_family.py (written
        before any R6 step), and the null family's infeasibility is a
        mathematical fact (discriminant < 0), not an empirical scan. The
        IV-4 invalidation ("a nonzero result voids the solver for all
        counts") is NOT triggered because the result is zero.
