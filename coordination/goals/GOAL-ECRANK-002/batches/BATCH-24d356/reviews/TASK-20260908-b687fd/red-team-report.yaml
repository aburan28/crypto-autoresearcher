  - id: d
    name: "P4 unit alignment per-tuple vs per-draw"
    inference: >
      The P4 prediction: "incidence > 3e-4 per draw (EV-ECRANK-8b35bb)
      read at the same per-tuple scale."
    analysis: >
      The measured n=6 per-tuple incidence is 28 instances / 10^4
      b-tuples = 2.8e-3 per b-tuple. The draw-route bound from
      EV-ECRANK-8b35bb's obstruction block is explicitly stated as
      "rule-of-three 95% upper bound < 3e-4 instances per b-tuple at
      n=8 (3/10^4)." So the bound is per b-tuple, NOT per draw. The
      comparison is: 2.8e-3 per b-tuple (measured) > 3e-4 per b-tuple
      (draw-route bound). This is a valid comparison (same units: per
      b-tuple).
    units_made_explicit:
      measured_incidence: "28 instances / 10^4 b-tuples = 2.8e-3 per b-tuple (n=6 construction)"
      draw_route_bound: "3e-4 per b-tuple (n=8 draw-route, rule-of-three 3/10^4, as stated in EV-ECRANK-8b35bb obstruction block)"
      comparison: "2.8e-3 per b-tuple > 3e-4 per b-tuple (valid, same units)"
    outcome: survives
    surviving_step: >
      The comparison SURVIVES. There IS a stated per-tuple reading of the
      draw-route bound (3e-4 per b-tuple, as stated in the obstruction
      block). The measured incidence is 2.8e-3 per b-tuple. So the
      comparison is valid (same units: per b-tuple). The comparison does
      NOT survive only under mixed units.
    caveat: >
      The comparison is at different n values (n=6 construction vs n=8
      draw-route). The P4 prediction says "read at the same per-tuple
      scale," so the comparison is at the per-tuple scale. But the n
      values differ, so the comparison is a qualitative
      construction-over-draw claim, not a directly valid same-n
      comparison. This is a disclosed limitation, not a break.

