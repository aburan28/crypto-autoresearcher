      The F4_controls text ("the affected runs are VOID") is more
      conservative and more correct: only the runs that are actually
      affected by the control failure are voided. Since the pipeline is
      not broken, NO runs are actually affected.
    outcome: proves_too_much
    broken_step: >
      The literal reading PROVES TOO MUCH. It voids passing runs (R1, R2,
      R4, R6) without textual warrant. The F4_controls text supports a
      narrower reading (only the affected runs are voided). The literal
