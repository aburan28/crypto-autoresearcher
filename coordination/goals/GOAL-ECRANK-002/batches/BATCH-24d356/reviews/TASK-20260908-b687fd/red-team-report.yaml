j4_objects:
  - id: a
    name: "solver-validation inference vs R8 known-false 0/9 plants"
    inference: >
      H-ECRANK-36d8d7 proof_search_map.baseline_reproduction: "the
      construction solver is validated against the planted controls R2/R8
      before any count is read."
    known_false_conclusion: >
      The R8 planted family: solver built 0 of 9 plants
      (degenerate_deg_s_2). The inference's conclusion (the solver is
      validated against planted controls) is KNOWN FALSE at R8.
    analysis: >
      The R8 plants are the d=(1..1) family at n=6. My independent
      derivation (scratch/j4a_r8_plants.py) confirms all 9 plants have
      deg s = 2 (conic, non-elliptic). The b-tuples match the R8
      raw-result.json exactly. The solver's rejection
      (degenerate_deg_s_2) is mathematically CORRECT: the plants are
      conics, not elliptic curves, so they were never valid elliptic
      instances to detect. The R8 control could NOT validate the n=6
      solver's detection path for elliptic instances, because the plants
      are non-elliptic. The R2 planted audit points (7,8), (11,12),
      (13,14) are for the DRAW-SUPPORT audit (M-A), not the construction
      solver (M-B), so they do not exercise the construction solver's
      detection path either.
    what_r8_could_validate: >
      The R8 control could validate that the solver correctly REJECTS
      non-elliptic (conic) inputs (the degenerate_deg_s_2 filter works).
      It could NOT validate the solver's detection path for ELLIPTIC
      instances.
    what_r8_could_not_validate: >
      The R8 control could NOT validate that the solver can FIND elliptic
      instances (its detection path for elliptic n=6 instances). The
      plants are non-elliptic, so they do not exercise this path.
    what_remains_unvalidated: >
      The n=6 construction solver's detection path for ELLIPTIC
      instances remains unvalidated by any planted elliptic control. R3's
      28 instances passed certification independently (verdict=PASS), so
      they are valid measurements. But the solver's ABILITY TO FIND
      elliptic instances was not validated by a planted elliptic control.
    any_planted_elliptic_control: >
      NO. No planted elliptic control ever exercised the n=6 construction
      solver's detection path. The R8 plants are all non-elliptic
      (conics). The R2 planted audit points are for the draw-support
      audit, not the construction solver.
    outcome: breaks
    broken_step: >
      The inference BREAKS at the R8 control. The R8 plants are
      non-elliptic (conics, deg s = 2), so the solver's rejection is
      correct, and the control does NOT validate the solver's detection
      path for elliptic instances. The inference "the construction solver
      is validated against planted controls before counts are read" is
      not supported by the R8 control. The solver's detection path for
      elliptic n=6 instances remains unvalidated.

  - id: b
    name: "blanket P4 inference vs R6 null"
    inference: >
      Any blanket construction-over-draw incidence inference (P4): the
      measured n=6 per-tuple incidence exceeds the random-draw 95% upper
      bound, establishing construction-over-draw at the tested scope.
    known_false_conclusion: >
      The R6 null object: the solver on the null_family must return
      exactly 0 solutions. The correct outcome is that the comparison
      reports NOTHING (the null has 0 solutions, so the incidence is 0).
    analysis: >
      The R6 null found exactly 0 solutions (found=[], feasible_tuples=0,
      n_b_done 64/64). The incidence on the null is 0. The P4 inference
      (incidence > 3e-4) is NOT satisfied on the null (0 < 3e-4). So the
      inference does NOT produce a positive reading on the null. The R6
      null correctly reports 0 solutions, so the inference does not
      produce an artifactual positive reading.
    outcome: survives
    surviving_step: >
      The inference SURVIVES. The R6 null correctly reports 0 solutions,
      so the inference does not produce an artifactual positive reading
      on the null. The null object is a valid control: it confirms the
      solver does not produce false positives on a known-infeasible
      family.

  - id: c
    name: "literal IV-1 reading vs the runs whose checks passed"
    inference: >
      The invalidation argument itself: "IV-1 voids ALL runs" read
      literally.
    known_false_conclusion: >
      The runs whose pre-registered checks PASSED (R1, R2, R4, R6) are
      voided by the literal reading, but they passed their checks. The
      F4_controls text says "the affected runs are VOID," not "ALL runs."
    analysis: >
      The literal reading of IV-1 ("voids ALL runs") would void ALL runs,
      including the passing runs R1, R2, R4, R6. But the IV-1 "failure"
      is a contract-design defect (the expectations are too strong), not
