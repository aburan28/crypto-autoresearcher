# =====================================================================
# Q1 — n=6 ellipticity quadratic
# =====================================================================
derivation_q1:
  frozen_parameters:
    n: 6
    b: [0, 1, 7, -14, 16, -2]
    d: [-2310, 30030, 30030, -286, -286, -2310]
    g_convention: "g(x) = x + c, c in Q (monic, single free coefficient)"

  # p(x) = prod_i (x - b_i), monic degree 6.
  # Coefficients listed low-to-high (index = power of x).
  p_coeffs_low_to_high: [0, -3136, 1988, 1376, -221, -8, 1]
  p_polynomial: "x^6 - 8 x^5 - 221 x^4 + 1376 x^3 + 1988 x^2 - 3136 x"
  p_check:
    sum_of_roots: 8            # 0+1+7-14+16-2 = 8  -> x^5 coeff = -8  (matches)
    pairwise_sum: -221         # -> x^4 coeff = -221 (matches)

  # delta(x) = Lagrange interpolant, deg <= 5, delta(b_i) = d_i.
  # Coefficients low-to-high (index = power of x). EXACT rationals.
  delta_coeffs_low_to_high:
    - -2310
    - 6337764763/255150
    - 8274935119/893025
    - -4090494199/2381400
    - -49475096/893025
    - 53817049/7144200
  delta_interpolation_verified: true   # delta(b_i) == d_i for all i (exact)

  # s(x) = delta(x) * (x + c)^2 mod p(x), as a bivariate polynomial in (x, c).
  # Entry "x^i c^j : value" means the exact coefficient of x^i c^j in the
  # remainder (deg in x <= 5). This is the full intermediate object.
  s_bivariate:
    "x^0 c^2": -2310
    "x^1 c^0": 277884992/18225
    "x^1 c^1": 776873284/18225
    "x^1 c^2": 6337764763/255150
    "x^2 c^0": 212277406/18225
    "x^2 c^1": 2516754284/127575
    "x^2 c^2": 8274935119/893025
    "x^3 c^0": 19279678/6075
    "x^3 c^1": -93485458/42525
    "x^3 c^2": -4090494199/2381400
    "x^4 c^0": -449504/18225
    "x^4 c^1": -13496956/127575
    "x^4 c^2": -49475096/893025
    "x^5 c^0": -255178/18225
    "x^5 c^1": 1240558/127575
    "x^5 c^2": 53817049/7144200

  # The ELLIPTICITY condition at n=6 is the vanishing of the x^5 coefficient
  # of the remainder. That coefficient, as a polynomial in c, is:
  x5_coefficient_quadratic:
    # f(c) = A c^2 + B c + C
    A_c2: 53817049/7144200
    B_c: 1240558/127575
    C: -255178/18225
    is_quadratic_in_c: true        # A != 0, so genuinely quadratic (not degenerate)
    closed_form_cross_check: >
      f(c) = d5 c^2 + (2 d4 + 16 d5) c + (d3 + 8 d4 + 285 d5), where d3,d4,d5
      are the x^3,x^4,x^5 coefficients of delta. Substituting the exact delta
      coefficients reproduces A,B,C above exactly (independently verified).

  # Solve A c^2 + B c + C = 0 over Q.
  solve:
    discriminant_D: 4150838329/8037225
    D_is_perfect_square_in_Q: true
    sqrt_D: 64427/2835
    # c = (-B +/- sqrt(D)) / (2A)
    roots:
      - c: 324772/376343
        numerator: 324772
        denominator: 376343
        abs_c: 324772/376343
        abs_c_approx: 0.862963
        height_max_abs_num_den: 376343
        height_max_abs_num_den_le_1e4: false
        abs_c_le_1e4: true
        f_of_c: 0                  # verified exactly
      - c: -28/13
        numerator: -28
        denominator: 13
        abs_c: 28/13
        abs_c_approx: 2.153846
        height_max_abs_num_den: 28
        height_max_abs_num_den_le_1e4: true
        abs_c_le_1e4: true
        f_of_c: 0                  # verified exactly
    all_rational_roots_count: 2    # the quadratic has exactly these two roots

  # Per-root nondegeneracy checks (exact).
  per_root_checks:
    - c: 324772/376343
      g_bi_values: [324772/376343, 701115/376343, 2959173/376343, -4944030/376343, 6346260/376343, -427914/376343]
      g_bi_all_nonzero: true
      s_coeffs_low_to_high:
        - -22150138916640/12875823059
        - 2724443546386520/38627469177
        - 458026238867130/12875823059
        - -34670613080/12875823059
        - -6073062386000/38627469177
      deg_s: 4
      disc_s: 593479019722898118191023137695685965331349334629471515265616388203179882853382912000000/4556695412411889979103038217172508475694573098800177653995641
      disc_s_nonzero: true
      deg_s_in_3_4: true
      nonsingular: true
      nondegenerate: true
      identity_s_bi_eq_d_i_g_bi_sq: true
    - c: -28/13
      g_bi_values: [-28/13, -15/13, 63/13, -210/13, 180/13, -54/13]
      g_bi_all_nonzero: true
      s_coeffs_low_to_high:
        - -1811040/169
        - 19604200/507
        - 2052270/169
        - -10120/169
        - -27280/507
      deg_s: 4
      disc_s: 13338113665625129698328863805184000000/23298085122481
      disc_s_nonzero: true
      deg_s_in_3_4: true
      nonsingular: true
      nondegenerate: true
      identity_s_bi_eq_d_i_g_bi_sq: true

  # The identity s(b_i) = d_i * g(b_i)^2, verified SYMBOLICALLY in c
  # (i.e. as a polynomial identity in c, for each i), not just at the roots.
  symbolic_identity_s_bi_eq_d_i_g_bi_sq: true

  # Ambiguity / convention notes (recorded, not filled from producer artifacts):
  convention_notes:
    - >
      The g_convention text calls g the frozen contract's "single univariate
      quadratic" but then states the explicit form g(x) = x + c, which is
      LINEAR (degree 1). The explicit form g(x) = x + c was used, as it is the
      unambiguous instruction. The word "quadratic" in "ellipticity quadratic"
      refers to the x^5-coefficient condition being quadratic in the single
      free coefficient c, which the derivation confirms (A != 0).
    - >
      Under the stated convention g(x) = x + c the ellipticity condition is
      genuinely quadratic in c (not degenerate), so no convention switch was
      needed or made.

# =====================================================================
# Q2 — expected-meets arithmetic
# =====================================================================
derivation_q2:
  frozen_parameters:
    N_a: 8000
    S_abs: 1600
    model: "meet count ~ Binomial(N_a, 1/S_abs) under declared uniformity"

  expected_meets:
    formula: "E[meets] = N_a / S_abs"
    value: 5
    exact: true

  variance:
    formula: "Var[meets] = N_a * p * (1-p), p = 1/S_abs"
    value: 1599/320
    exact: true

  standard_deviation:
    formula: "sd = sqrt(Var) = sqrt(1599/320)"
    value: "sqrt(7995)/40"
    approx: 2.235369097039681
    exact: true

  P_meets_le_3:
    method: >
      Exact rational binomial sum, factored for exactness:
      P(meets <= 3) = sum_{k=0}^3 C(8000,k) (1/1600)^k (1599/1600)^(8000-k)
      = (1599/1600)^8000 * sum_{k=0}^3 C(8000,k) / 1599^k.
      The bracket is an exact rational; the whole product is an exact rational
      (computed with integer arithmetic, no floating point).
    bracket_sum_k0_to_3: 161005672799/4088324799
    exact_factored: "(1599/1600)^8000 * 161005672799/4088324799"
    exact_rational_size: "numerator and denominator each 25633 decimal digits"
    approx: 0.2649381560144011840678148441045033175855
    per_term_approx:
      P_meets_eq_0: 0.006727422795762106
      P_meets_eq_1: 0.03365815032276225
      P_meets_eq_2: 0.08418747480668395
      P_meets_eq_3: 0.14036510808919286

  observed_3_outlier_derivation_only:
    # Derivation-only statement; NO observed value is assumed here.
    # The comparison step supplies the actual observation.
    z_score_of_3: "-0.8947068305849882 (approx; (3 - 5)/sd)"
    P_meets_le_3_approx: 0.2649381560144012
    conclusion: >
      Under this null, an observed count of 3 is NOT an outlier: it lies within
      one standard deviation of the mean (z ~ -0.89), and the one-sided
      probability of seeing 3 or fewer is ~0.265, far above any conventional
      outlier threshold. (Stated as a property of the null distribution only.)

