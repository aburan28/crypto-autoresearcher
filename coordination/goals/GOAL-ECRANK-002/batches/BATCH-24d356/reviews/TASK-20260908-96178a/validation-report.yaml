  - id: J3.2d
    check: "near_miss_ledger semantics vs near_miss_total=0 with 9980 zero-solution tuples"
    producer_path: experiments/EXP-ECRANK-73275e/runs/RUN-ECRANK-73275e-R3-construct-n6/raw-result.json (near_miss_ledger, near_miss_total); experiments/EXP-ECRANK-73275e/source/construct.py (construct_arm near_miss logic); experiments/EXP-ECRANK-73275e/specification.yaml (metrics.primary.construct_count)
    recomputed:
      near_miss_ledger: []
      near_miss_total: 0
      zero_solution_tuples: 9980            # 10000 - 20 feasible
      impl_semantics: >
        construct.py appends to near_miss ONLY when a b-tuple has NO kept
        instance but DOES have a rejected rational-root candidate (reason
        r_zero / r_height_<h> / build_instance failure). A b-tuple whose
        n-5 quadratic has NO rational root contributes nothing to near_miss.
    result: PASS_WITH_FINDING
    finding: >
      The ledger is EMPTY (near_miss_total=0) while 9980 b-tuples have 0
      solutions. Under the implementation's semantics this is consistent:
      near_miss_total=0 means every zero-solution tuple's quadratic had no
      rational root (no near-miss candidate to record). But the spec's
      construct_count metric defines the near-miss ledger as "tuples with 0
      solutions, recorded with the failing condition" — a literal reading would
      expect 9980 entries. The implementation records a NARROWER set (only
      tuples with a rejected rational-root candidate). This is a
      semantics/labeling gap between the spec's metric wording and the
      implementation, not a data-integrity failure: the ledger is present,
      internally consistent, and the primary metrics (counts, feasibility
      fraction) are correct. Flagged for the Coordinator; it does not break J3.

