  verdict: inconclusive
  verdict_rationale: >-
    Inconclusive, and only because of J3-B1: the raw R7 record carries
    IV1_fired true while its own recorded iv1_binding ('total == n at
    d=(1..1) voids ALL runs') never occurred, and the frozen text (C1, the
    IV-1 antecedent, and the KNOWN-FALSE TAILS) keys the void to total = n,
    so until the Coordinator explicitly adjudicates that flag against the
    frozen wording, no record may state 'IV-1..IV-7 untriggered' and the
    negative branch cannot be mapped to F1. Every attack I ran failed to
    break the record — J4 carries no blocking item, the proves-too-much
    control did not fire on either object, and my independent exact
    recomputation corroborates the executor's mathematics — so on the
    frozen void-trigger reading the owned joints hold as recorded; the
    single open question is the Coordinator's adjudication of J3-B1, which
    is why the honest single word is inconclusive rather than holds or
    breaks.
  per_joint_verdicts:
    'J3 controls, invalidations, and scope honesty': >-
      BLOCK on the single item J3-B1 (IV-1 flag/reading conflict: raw
      IV1_fired true versus the frozen total = n void trigger that never
      occurred; Coordinator adjudication required before 'IV-1..IV-7
      untriggered' or any F1 mapping; worked falsification routes in the
      report). All other sub-items PASS or WARN with findings J3-F1..F6:
      F1 driver exponent window [0.5,2.0] wider than the frozen factor-2
      window (outcome-immateral; recorded slope 0.9048 passes the frozen
      window anyway); F2 'identical sampler' operationalized as the plant's
      own S-coordinates through the identical chain (draw-stage encounter
      path uncovered by any executed control); F3 single-class certificates
      only — the multi-class certification path was exercised nowhere; F4
      planted instance independence weakened by affine D-variants at level
      10^4; F5 IV-7 instance-list hashes are sha256 of the empty list —
      formally satisfied, informationally empty; F6 required-artifact gaps
      (per-b/per-draw search logs, R6 scan yield table and Fisher
      inputs/outputs, c_e tables) as disclosed. IV-3 recorded as
      owned-elsewhere / not-readable-within-this-round: it did not run in
      the executor's task (executor is inside blind_from), its inputs exist
      (blind_rederivation_inputs_C3, 9 per arm), and per the recorded
      procedure deviation it is owned by validator J2 in TASK-20260906-369b8d;
      I make no guess about its outcome.
    'J4 cost model and exhaustion inertness': >-
      WARN, no blocking item. Finalized-run total 38,791,749 counted ops
      recomputed from the 39 committed checkpoints and the 8 manifests/raws;
      max cap utilization 13.94% of 1.0e8 ops, 36.288 s of 7200 s, 0.049 GB
      of 8 GB; measured throughput ~3.85e5 counted ops/s (~19x above the
      design's 2e4 floor); exhaustion absent and inert in both directions
      (no exhaustion event; no silently shortened cap; no truncated sample —
      streams b_done = b_total, draws = 8 x b_done, solves_ok = draws,
      uniform per-interval ops/b, replay byte-identical). Findings J4-F1..F6:
      execution report mislabels low consumption as low throughput; per-draw
      audit impossible from the record (aggregate granularity only, worked
      falsification routes given); reported wall_seconds understates elapsed
      by 1.4-3.4 s per run; ops_cap_respected flag carries a 1% tolerance
      (stop rule itself exact); counting-convention exclusions (RNG,
      Fraction-constructor gcd) can only under-count, immaterial at 7-11x
      headroom. Slot-(8)/maximum_runs tension attacked: no cap breach, no
      seed/parameter drift, no outcome-selected retry; the executor's reading
      (run = finalized record; crashed attempts are in-run iterations) is the
      only one on which the gate-required planted control fits within
      maximum_runs 8, and the frozen enumeration is internally inconsistent;
      ruling deferred to the Coordinator, with a suggested per-run attempt
      ceiling for successor contracts.
  proves_too_much:
    objects_run:
      - 'known-false vector d=(1..1) (RUN-ECRANK-76a70d-R7-known-false, seed 760712)'
      - 'scan-stage null objects (seed 760711, RUN-ECRANK-76a70d-R6-scan-null)'
    failure_signature_fired: false
    outcome: >-
      Object 1 (known-false d=(1..1)) NOT FIRED: total = n never occurred
      (n=8 seeded totals max 7 < 8; n=10 max 9 = the committed ceiling,
      never 10; anchors exactly 7 and 9); all 40 control certificates are
      single-class, so 'from forced classes' is structurally unreachable on
      this object; my independent exact recomputation (Fraction group law on
      the recorded certificate points) shows the certified total equals the
      exact true rank of the forced-point span in 16/16 below-ceiling cases,
      so the pipeline's argument nowhere overcounts where its conclusion is
      known false. Object 2 (scan-stage null objects, seed 760711) NOT FIRED,
      vacuously: R6 ran no scan because zero constructed instances existed
      (counted_exact_ops 0), so no density metric ever reported any signal on
      a null object and nothing failed to decay; C2 is UNMEASURED this round
      and no one may claim the null-object control was demonstrated.
      failure_signature as a whole: neither disjunct fires; the round does
      not fail on the proves-too-much control regardless of arm B's result.
