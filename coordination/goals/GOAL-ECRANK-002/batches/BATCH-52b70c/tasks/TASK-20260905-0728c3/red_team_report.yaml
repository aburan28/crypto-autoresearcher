  # ===================================================================
  # (iv) PROVES-TOO-MUCH ON THE ARGUMENT
  # ===================================================================
  proves_too_much:
    method: >-
      Argument-side objects built by this review (script
      /Volumes/SSD990/llm/tmp/opencode/redteam_jn1b/verify_identity_and_objects.py,
      run 1) and passed through the COMMITTED verify() imported read-only
      from experiments/EXP-ECRANK-e1e30e/source/verify_certificate.py, and
      through the committed regulator_check.py computation path (ellinit /
      ellheightmatrix / matdet at realprecision 64) via cypari. Declared
      WITHOUT reading J-N1a's report, per mutual blindness; the mechanical
      negative control (perturbed archived bytes) is J-N1a's joint and was
      not duplicated beyond the launder probes B5a/B5b, which are
      argument-side identity objects, not byte perturbations.
    objects:
    - id: O1
      name: torsion-only list on a rank-0 curve
      construction: >-
        31 entries (cycling five torsion points of y^2 = x^3 + 1: orders
        3,3,6,6,2) as a k = 0 certificate. The conclusion "rank >= 31" is
        known false (rank 0); moreover 31 DISTINCT torsion points over Q
        cannot exist (Mazur: |E(Q)_tors| <= 16).
      result: >-
        KILLED by verify_certificate.py: 31 errors ("point ... is TORSION"),
        rank_bound 0, exit 1 (B1). The premise set excludes the object:
        every torsion point over Q has order in {1,...,10,12} and the
        committed Mazur loop covers all of them. No step smuggles it.
    - id: O2
      name: duplicate points (31 copies of one non-torsion point, rank-1 curve)
      construction: '31 copies of (3,5) on y^2 = x^3 - 2 (rank 1) as a k = 0 certificate.'
      result: >-
        HOLE IN verify_certificate.py ALONE: all 31 copies pass on-curve and
        non-torsion; errors 0, rank_bound 1, EXIT 0 (B2). The script never
        deduplicates within a class. KILLED by the conjunction:
        regulator_check.py on the same object returns det =
        -2.837e-94 < 1e-20 -> singular -> exit 1 (C1). The argument's
        premise "verify accepted" alone does NOT exclude duplicates; the
        licensed sentence must cite both exits (F-3).
    - id: O3
      name: linearly dependent set (the strongest known-false object)
      construction: >-
        P, 2P, ..., 31P on y^2 = x^3 - 2 (rank 1): 31 DISTINCT points, all
        exactly on-curve, all non-torsion, all with a true linear
        dependence; "rank >= 31" is known false.
      result: >-
        HOLE IN verify_certificate.py ALONE: errors 0, EXIT 0 (B3) -- every
        per-point premise of the naive argument holds. KILLED by the
        conjunction: det = -1.086e-94 < 1e-20 -> singular -> exit 1 (C2).
        This object proves the nonzero determinant is THE load-bearing
        exclusion in "31 accepted points => rank >= 31", and it is why the
        argument is not proves-too-much only because regulator_check.py is
        part of the acceptance.
    - id: O4
      name: singular model (points on a non-elliptic cubic)
      construction: >-
        y^2 = x^3 (CUSPIDAL, Delta = 0) with the 31 points (t^2, t^3),
        t = 1..31. "rank E(Q) >= 31 for an elliptic curve" is false -- the
        object is not an elliptic curve.
      result: >-
        HOLE IN verify_certificate.py ALONE: on-curve passes (t^6 = t^6),
        the chord-tangent law on the cuspidal cubic transports to t -> m*t
        so no m <= 12 gives O, errors 0, EXIT 0 (B4) -- the committed exact
        verifier ACCEPTS a certificate on a non-elliptic curve because
        NEITHER script checks Delta != 0. KILLED by the conjunction only
        via a PARI EXCEPTION in ellheightmatrix ("incorrect type in
        checkell", C3) -- a crash, not a designed check; uncaught, it exits
        nonzero, so the conjunction rejects. For the ACTUAL package the
        Delta != 0 fact HOLDS and was checked exactly at byte level (A2,
        A7: record discriminant == recomputed, nonzero; scales exactly to
        the short model), so the licensed sentence is safe -- but it must
        CARRY that fact, because the verifiers alone do not supply it
        (F-3). For future external-witness reuse, a Delta != 0 check inside
        the verifier is named hardening (N1-SR-3).
    - id: O5
      name: isomorphism/laundering probes on the real certificate
      construction: >-
        (a) base A' incremented by 1 with the real 31 transformed points
        kept; (b) twist d flipped 1 -> 5 with V = [1].
      result: >-
        BOTH REJECTED: (a) all 31 points fail on-curve, errors 31, exit 1
        (B5a); (b) 'd=5 not in V', exit 1 (B5b). An exact isomorphism
        CANNOT launder points onto a curve they were not exhibited for
        inside this pipeline: the on-curve check binds the points to the
        exact model, and this review's independent re-derivation (B-6)
        binds the model and the point map to the archived ainvs. The only
        way to make the verifier accept "bytes about curve A as evidence
        about curve B" is to supply a fully self-consistent DIFFERENT
        record -- which would be a different record, with different
        provenance, and would not carry curve #302's identity chain
        (curve_key = (c4,c6), discriminant field, regulator field matching
        the recomputed determinant to 40 dp). Additionally, rank over Q is
        an isomorphism invariant, so the legitimate general->short change of
        variables preserves every licensed quantity (group structure,
        non-torsion, independence, Néron-Tate pairing).
    - id: O6
      name: off-curve point inside the regulator path alone
      construction: 'the real certificate with one point replaced by (3,5) (a point of y^2 = x^3 - 2, not of the certificate curve).'
      result: >-
        regulator_check.py's path raises PariError "domain error in
        ellheight: point not on E" (C6) -- rejected by exception. Recorded
        to show neither script alone is a complete acceptance mechanism in
        either direction.
    threshold_scale_finding: >-
      regulator_check.py's independence test is the ABSOLUTE threshold
      |det| > 1e-20, which is not scale-invariant: for a Gram matrix with
      entry scale E and n points, a pessimistic perturbation bound scales as
      ~n^(n+1)/2 * E^n * 10^-64, so for large-E dependent configurations the
      rounding floor could in principle exceed 1e-20 without any
      independence. No such object was constructed within budget (the
      dependent objects built here, entries up to ~400, returned |det| ~
      1e-94, 74 orders below the threshold), and for THIS certificate the
      discrimination is sound by measurement: det = 5.520367e+39 identical
      at realprecision 64 and 128 (rel diff 0.000e+00, C4), max entry 78.04
      (C5), pessimistic error bound ~3e18, margin >= 20 orders even under
      that bound. The defect is a general-reuse hardening item, not a defect
      of this acceptance (F-5, N1-SR-5).

