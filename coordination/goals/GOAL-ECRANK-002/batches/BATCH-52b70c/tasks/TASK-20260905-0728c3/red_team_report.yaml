  # ===================================================================
  # FINDINGS
  # ===================================================================
  findings:
  - id: F-1
    severity: 'medium (composition-relevant; the error UNDERSTATES the corroboration)'
    title: The executor's "regulator coincidence modulo an exact factor 10^10" is a digit-counting error; the true relation is exact agreement.
    finding: >-
      run_record.yaml (RUN-cfce83-REG-1 observation) and observations.md
      section 5 state the page's regulator is "5.5203673748218935...e49" and
      that it agrees with the committed check's det 5.52037e+39 "modulo an
      exact factor 10^10". MEASURED BY THIS REVIEW: the archived page/JSON
      regulator field has a 40-digit integer part -- it is
      5.520367374821893536678475926502746956624...e39, NOT e49 -- and its
      ratio to this review's independently computed Néron-Tate determinant
      at realprecision 128 is 1 to 40 decimal places (run 1, C7/C8). There
      is NO factor 10^10. The correct statement is materially STRONGER than
      the recorded one: the external record's regulator field and this
      program's recomputed height determinant are THE SAME NUMBER to every
      comparable digit, which is an independent-computation corroboration of
      the identity chain (B-8). The executor framed its note as "recorded
      coincidence (NOT interpreted)", so nothing in the package's validity
      rests on the error; but the record is immutable and the composition
      must not carry the false factor claim.
  - id: F-2
    severity: low
    title: The curve_key binding claim is digit-for-digit true but sign-flipped; the exact relation is curve_key = (c4, c6).
    finding: >-
      observations.md section 3 and run_record.yaml claim the curve_key
      components "equal, digit for digit, the numerators of the pre-scaling
      short-model invariants A and B". MEASURED: numerator(A_pre) = -k1 and
      numerator(B_pre) = -k2 (A4) -- the digits match, BOTH SIGNS are
      flipped -- while curve_key equals (c4, c6) of the record's ainvs
      EXACTLY, with signs (A3). The exact relation is the stronger and
      cleaner binding ((c4,c6) pins the Q-isomorphism class with u^4 = 1);
      any composition sentence citing the key should cite (c4, c6), not the
      loose "numerators" phrasing.
  - id: F-3
    severity: high (license structure; no defect in THIS acceptance)
    title: Neither committed verifier alone excludes the known-false objects; the license is the CONJUNCTION plus a Delta != 0 fact neither script checks.
    finding: >-
      verify_certificate.py exits 0 on: 31 duplicates of one point (B2),
      31 linearly dependent points P..31P on a rank-1 curve (B3), and a
      certificate on the CUSPIDAL cubic y^2 = x^3 (B4). regulator_check.py
      rejects non-members and singular curves only via PARI exceptions
      (C6, C3), i.e. by crash, and never checks Delta != 0 or membership as
      designed checks. For THIS package every needed fact holds and was
      measured (both exit-0 runs rerun-identical; Delta != 0 exact at byte
      level, A2/A7), so the ACCEPT sentence is safe -- but ONLY as a
      conjunction sentence that explicitly carries the Delta != 0 fact. A
      composition that cites "verify_certificate.py errors: 0" alone, or
      omits Delta != 0, proves too much.
  - id: F-4
    severity: low
    title: Record version gap - updated_at 20:16:24 UTC has no field-level history in the archived bytes.
    finding: >-
      created_at 2026-08-23 20:02:58 UTC; updated_at 20:16:24 UTC; JSON
      "history": []; commentary history shows one edit at 20:02:58. What
      changed at 20:16:24 is not in the bytes. Internal consistency of the
      FETCHED tuple (ainvs/points/discriminant/regulator) holds regardless
      (B-3, B-5, B-8), so the gap does not block; it forbids exactly one
      sentence: "these bytes are identical to what was originally
      submitted." All licensed sentences are scoped to the fetched snapshot
      (URL + sha256 + timestamp).
  - id: F-5
    severity: medium (general reuse; not this acceptance)
    title: The independence step is numerical, and the committed threshold 1e-20 is absolute rather than scale-aware.
    finding: >-
      The 31-within-class bound rests on a PARI numerical determinant (the
      committed script's own epistemic-status note: "a strictly weaker
      artifact than the eigenspace argument"). For this certificate the
      margin is measured and enormous (det 5.520367e+39, identical at
      realprecision 64 and 128; max entry 78.04; pessimistic perturbation
      bound ~3e18; dependent/duplicate controls <= 1.1e-94). But the
      absolute threshold would be unsafe for hypothetical future
      certificates with sufficiently large height entries, and an exact
      (certified-interval) height computation was not run. Sentences must
      say "non-singular NUMERICAL regulator", carry the certificate-kind
      split (1 exact eigenspace class + 31 regulator-dependent points), and
      not imply an exact-algebra proof of independence.
  - id: F-6
    severity: low
    title: Attribution and conditioning scope.
    finding: >-
      The credit line ("found by Claude, Levent Alpöge, and Ava Howell") and
      the Dujella/MathWorld corroborations are retrieved provenance pointers;
      this program verified bytes, not authorship, and asserts nothing about
      the credited parties' work beyond the bytes. The BSD+GRH language
      concerns the upper/exact-rank claim on the reading supported by the
      retrieved package itself; the licensed lower bound cites the record
      for no mathematics and so inherits no conditioning from it either way.

