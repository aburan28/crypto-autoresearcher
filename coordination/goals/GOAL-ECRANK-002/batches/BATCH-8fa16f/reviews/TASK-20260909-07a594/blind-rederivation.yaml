    algebraic_consequence:
      statement: >-
        A control certified as degenerate_deg_s_2 is not an elliptic curve under the declared convention: its defining object is degenerate or has degree at most two, whereas an elliptic curve requires a nonsingular genus-one cubic together with the convention's rational base point. A nonzero x^2 coefficient establishes that the tested equation has a nontrivial quadratic part; it does not, by itself, establish nonsingularity or ellipticity.
      consequence_for_gate: The classifier's degenerate_deg_s_2 certificate is the required structural discriminator. A certified total solution count of zero adds the stated domain-level control result, but a finite-domain zero alone does not prove the geometric classification.
      derivation_limit: blind-input.yaml gives no defining polynomial, discriminant, singularity calculation, field, or map from d=(1,...,1) to the tested object. Therefore the expected conic-or-degenerate status of that specialization cannot be independently derived from the supplied statement alone.
    exact_truth_table:
      iv_1r:
        passes_if_and_only_if: For every sampled d=(1,...,1) control, the receipt records rejection as degenerate_deg_s_2, a nonzero x^2 coefficient, and a certified total solution count of zero.
        fails_or_voids_if: Any sampled control is accepted; lacks degenerate_deg_s_2 classification; has a zero or absent x^2 coefficient; lacks a certified total-zero result; or records a nonzero solution.
      iv_4r:
        passes_if_and_only_if: The null object records zero solutions and an infeasibility flag.
        fails_or_voids_if: The null object records a nonzero solution, lacks a zero-solution record, or lacks the infeasibility flag.
      v2_count_gate:
        admissible_if_and_only_if: IV-1R and IV-4R both pass under the two conditions above.
        mandatory_void_conditions: A nonzero solution in a sampled d=(1,...,1) control or an elliptic classification for such a control voids the v2 count gate.
    pre_receipt_verdict: holds
    pre_receipt_rationale: The gate logic and its required algebraic consequence are derivable from the statement. The stated information is insufficient to derive the d=(1,...,1) object's defining geometry independently, so receipt comparison can test only whether the declared observations satisfy the conditional gate; it cannot supply the omitted specialization derivation.
