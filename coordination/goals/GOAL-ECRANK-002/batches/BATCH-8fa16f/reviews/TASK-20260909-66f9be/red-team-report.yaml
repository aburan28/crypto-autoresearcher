red_team_report:
  id: RT-20260909-78cce1
  task_id: TASK-20260909-66f9be
  claim_under_review: >-
    The snapshot-bound v2 replication observations in TASK-20260908-5291f8
    record R9 and R15 control admission as passed, R10 recovery of 9/9 planted
    elliptic instances, R12's 33 certified n=6 instances, R13's bit-for-bit
    replay, R14's completed zero in its stated integer box, and CERTIFIER_LIMITED
    outcomes for R9 and R11, as observations only without changing status.
  review_scope:
    joint: J3_scope_and_proves_too_much
    batch_id: BATCH-8fa16f
    review_plan_id: REVIEW-PLAN-BATCH-8fa16f
    objective: >-
      Attack the R14 box boundary, the R9/R11 certifier boundary, and the
      limits of the R10 planted detection control without reviewing any other
      joint or sibling report.
  objections:
    - id: J3-R14-BOX
      object: >-
        Treating R14's completed zero over the declared integer (a,b) box as
        a zero over the full rational-height-H lattice.
      outcome: holds
      evidence: >-
        The execution report states that R14 completed all 10^4 b-tuples with
        found=0 inside the integer box
        [-min(H,20),min(H,20)]^2, solving c exactly. The amendment explicitly
        says that non-integer (a,b) values and the full rational height-H
        lattice were not enumerated and are not claimed empty; H is reported
        at 10^2 and 10^3 for n=8.
      scope_boundary: >-
        The supported observation is only a completed zero for the finite,
        integer coefficient box and declared b-tuple sample at the stated
        n=8 heights. It is not a statement about rational coefficients,
        unrestricted height, other boxes, or an asymptotic lattice.
      exact_breaking_step: >-
        The scope is broken if a synthesis replaces "integer (a,b) in
        [-min(H,20),min(H,20)]^2, c solved exactly" by "all rational (a,b)
        of height at most H" or drops the box qualifier. No declared artifact
        measures the added rational points, so the broadened conclusion is
        unsupported rather than a negative result.
      required_preservation: >-
        Keep the integer-box and n=8 height qualifiers verbatim in every
        summary. Any rational-height or larger-box claim requires a new
        additive protocol and a fresh exhaustive enumeration.
    - id: J3-CERTIFIER-LIMIT
      object: >-
        Treating an R9 or R11 CERTIFIER_LIMITED outcome as a top-rung
        certificate pass or as an exact total.
      outcome: holds
      evidence: >-
        R9's top-rung bound 100000 totals are [6,6,7,7,7,7,7,6], not 7 on
        every tuple. R11's top-rung totals are [5,7,7,7,7,7,5,6,6], not 7 on
        every plant. The amendment defines PASS only when every tuple reaches
        7 at the top rung and defines CERTIFIER_LIMITED otherwise, with totals
        retained as lower bounds. The execution report also records that the
        three ladder rungs were a no-op for the tested tuples because the
        committed certifier's good-prime list is capped at 60 primes below
        the nominal bound; this is recorded as an instrument boundary.
      scope_boundary: >-
        CERTIFIER_LIMITED supports only that the listed lower-bound counts
        were obtained under the committed certifier and ladder. It does not
        certify that the missing tuples fail, and it does not satisfy the
        all-tuples exact-total assertion.
      exact_breaking_step: >-
        The review boundary is broken if either label is changed to PASS, if
        a shortfall is treated as an exact zero or exact total, or if the
        no-op ladder is presented as evidence that increasing the mathematical
        prime bound was actually exercised. The recorded totals and labels
        themselves do not support any of those readings.
      required_preservation: >-
        Preserve CERTIFIER_LIMITED, the per-tuple totals, the lower-bound
        interpretation, and the 60-prime cap/no-op disclosure. Keep the R9
        n=6 IV-1R PASS separate from the R9 n=8 IV-1C limited outcome.
    - id: J3-R10-GENERALIZATION
      object: >-
        Treating R10's recovery of 9/9 planted elliptic n=6 instances as
        evidence of general completeness, machine independence, or
        asymptotic behavior.
      outcome: holds
      evidence: >-
        R10 recovered 9/9 plants, all elliptic and within h_A <= 10000, with
        distinct (b,pattern) pairs and distinct h0 values. The amendment binds
        the plants to the R3-family shape and the stated n=6 solver path, and
        the execution report says the detection result upgrades R12 counts
        only at the tested scope. The same report explicitly discloses that
        the v2 round used the same machine as v1, so it tests fresh-seed
        sensitivity and pipeline determinism but not machine-dependent
        behavior. Its exponent-window check failed for all plants as a
        calibration reading, and its per-decade ratios [2.25, 1.0] were
        outside [5,20]; those failures void the planted-height calibration
        reading, not the bounded detection observation.
      scope_boundary: >-
        The supported observation is 9/9 recovery for the named planted
        R3-family shape, nine distinct plants, the recorded injection stream,
        n=6, and h_A <= 10000 on the disclosed same-machine/runtime setup.
        It does not test arbitrary unplanted solutions, another construction
        family, another machine or runtime, larger n or H, or an asymptotic
        detection/completeness law.
      exact_breaking_step: >-
        The scope is broken if the 9/9 ratio is restated as solver completeness
        outside the planted family, as machine-independent reliability, or as
        an asymptotic result; if the failed exponent/per-decade checks are
        omitted while retaining their calibration interpretation; or if the
        same-machine limitation is removed. No declared artifact supports any
        of those extensions.
      required_preservation: >-
        Retain the planted-family, n=6, h_A, seed/injection, same-machine, and
        failed-calibration qualifiers. A broader completeness claim needs
        independent controls over other solution families and an independent
        machine/runtime where available, plus a separately pre-registered
        scale test.
  required_controls:
    - >-
      Keep R14's exact integer coefficient-box definition, c-solving rule,
      n=8 H values, and explicit unmeasured rational-lattice scope in every
      interpretation.
    - >-
      Keep R9 IV-1C and R11 as CERTIFIER_LIMITED where their top-rung
      per-tuple totals are short; treat them as lower bounds and retain the
      no-op 60-prime certifier disclosure.
    - >-
      Keep R10 detection separate from its failed exponent and per-decade
      calibration checks, and state that 9/9 is a planted R3-family n=6
      control on one machine/runtime.
    - >-
      Do not convert any of these controls into an asymptotic, machine-
      independent, full-lattice, or general completeness claim without a new
      frozen protocol.
  counterexample_or_mutation:
    status: no_observed_counterexample_within_declared_scope
    mutations:
      - mutation: >-
          Replace the R14 integer (a,b) enumeration by all rational
          coefficient pairs inside the r-height-H lattice.
        expected_failure_signature: >-
          The zero remains asserted despite no rational points having been
          enumerated; the assertion therefore exceeds the snapshot.
        observed: not_tested_by_declared_artifacts
      - mutation: >-
          Replace either CERTIFIER_LIMITED label with PASS or treat all
          shortfalls as exact nonexistence.
        expected_failure_signature: >-
          The label contradicts the amendment's PASS predicate and the
          recorded shortfall vectors.
        observed: not_present_in_execution_report
      - mutation: >-
          Replace R10's planted-control denominator with arbitrary solver
          instances, a different plant family, another machine/runtime, or an
          asymptotic claim.
        expected_failure_signature: >-
          The 9/9 numerator and denominator no longer cover the asserted
          population; the same-machine disclosure also makes independence
          unavailable.
        observed: not_tested_by_declared_artifacts
  baseline_comparison:
    status: bounded_scope_comparison_only
    comparison: >-
      Within J3 the relevant baseline is the pre-registered scope itself: the
      integer-box zero, lower-bound certifier readings, and planted detection
      control. No Pollard-rho, BSGS, cryptanalytic, or performance baseline is
      claimed by the reviewed report, so none can be inferred from these
      controls.
    limitation: >-
      The control outcomes cannot establish a gain, a full-lattice exclusion,
      exact n=8 totals, general solver completeness, or asymptotic behavior.
  heuristic_challenges:
    - >-
      The 9/9 planted ratio is a finite detection control, not a random-model
      estimate of the prevalence or recovery probability of arbitrary
      solutions. The failed height calibration further prevents using R10 as
      support for the frozen exponent window.
    - >-
      The same-machine disclosure leaves machine/runtime transfer untested;
      fresh seeds do not supply that missing independence.
  cost_model_challenges:
    - >-
      The reviewed records do not turn R10's nine successful plants into an
      expected cost for arbitrary instance recovery, and do not provide a
      cost model for the unenumerated rational lattice. Any such multiplication
      or extrapolation would exceed J3 evidence.
    - >-
      R14's completion within the counted-ops cap establishes only completion
      of its declared finite enumeration, not the cost of a rational-height
      enumeration or an asymptotic search.
  reduction_and_scope_challenges:
    - >-
      No reduction from the integer-box n=8 problem to the full rational-height
      lattice is present in the declared source set. The box qualifier is a
      hard scope boundary.
    - >-
      No transfer argument from planted R3-family detection to arbitrary
      n=6 solutions, other families, machines, or asymptotic parameters is
      present in the declared source set.
  proof_architecture_challenges:
    - >-
      The proves-too-much mutation succeeds at the missing quantifier: the
      observed zero quantifies only over the declared finite integer box and
      sampled b-tuples, while the full rational-lattice statement quantifies
      over additional rational coefficients. Those objects are unmeasured.
    - >-
      The R10 mutation changes the population quantified by the 9/9 ratio
      from nine named planted R3-family instances to an unrestricted solver
      population; the denominator does not follow that change.
    - >-
      The CERTIFIER_LIMITED mutation changes a lower-bound instrument result
      into an exact certificate result, contrary to the amendment's explicit
      graded outcome predicate.
  narrowest_supported_statement: >-
    On the disclosed same-machine/runtime setup and fresh v2 seeds, R9's n=6
    known-false conic rejection and R15's null-object zero pass their stated
    gates. R10 recovered the nine named elliptic plants from the frozen
    R3-family shape at the tested n=6 and h_A <= 10000 scope, while its height
    and per-decade calibration checks failed. R9's n=8 ladder and R11's
    planted n=8 ladder remain CERTIFIER_LIMITED lower-bound observations with
    the recorded per-tuple totals and certifier no-op disclosure. R12/R13
    readings may be described only at their own declared tested scope. R14
    completed the declared 10^4 b-tuples with zero found in the integer
    (a,b) box [-min(H,20),min(H,20)]^2 with c solved exactly at its stated
    n=8 heights; the full rational-height lattice remains unmeasured. These
    observations support no full-lattice zero, exact n=8 total, general
    completeness, machine-independent result, or asymptotic claim.
  next_concrete_action: >-
    Coordinator synthesis should preserve every stated qualifier and reject
    the three scope-removing mutations above as unsupported. If a broader
    statement is required, open an additive protocol that enumerates the
    rational-height lattice, separately tests other solution families and an
    independent machine/runtime, and defines an exact certifier whose ladder
    is not capped below its advertised bounds.
  artifact_paths:
    - coordination/goals/GOAL-ECRANK-002/batches/BATCH-8fa16f/reviews/TASK-20260909-66f9be/red-team-report.yaml
  sources_read:
