      exactly ONE free coefficient (the frozen contract's 'single univariate
      quadratic' at n = 6): g(x) = x + c". A general monic quadratic x^2 + u*x
      + v has two free coefficients; the frozen convention explicitly fixes
      u = 0 and leaves v = c. The explicit formula g(x) = x + c is
      unambiguous and was used exactly as given; the parenthetical is a label,
      not a different formula. Not a blocker.
    - >
      FINDING (not a statement ambiguity): for b_index 649 the x^5 coefficient
      of the remainder is LINEAR in c (A = 0), not quadratic, because the x^5
      coefficient of delta vanishes (delta has degree 4). The statement's
