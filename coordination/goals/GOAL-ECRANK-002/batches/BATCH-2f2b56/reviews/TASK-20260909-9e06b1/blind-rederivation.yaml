  derivation_q2:
    power_law_statement: "N(H) = C * H^k, C > 0 constant, k the exponent"
    R_derivation: >
      N(10H) = C * (10H)^k = C * 10^k * H^k = 10^k * (C * H^k) = 10^k * N(H).
      Therefore the per-decade growth ratio R = N(10H)/N(H) = 10^k, independent
      of C (C cancels exactly).
    R_pred_at_k2: 100
    R_pred_derivation: "At the frozen prediction exponent k = 2: R_pred = 10^2 = 100 exactly (a factor of exactly 100 per decade)."
    implied_exponent_formula: "k = log10(R)"
    implied_exponent_derivation: >
      From R = 10^k, take log10 of both sides: log10(R) = log10(10^k) = k, so
      the implied exponent of an observed ratio R is k = log10(R).
    comparison_method:
      inequality_tests: >
        Exact rational/integer cross-multiplication only (no floating point):
        for positive integers, a ratio b/a compared to an integer T is decided
        by the integer inequality b < T*a (resp. b <= T*a for <=). This is the
        machinery the comparison step applies against 100 and 10000.
      implied_k_decimals: >
        Implied-exponent values k = log10(R) are reported as high-precision
        decimals with >= 30 significant digits. Stated method: Python
        'decimal' module with getcontext().prec = 50 (50 significant digits,
        exceeding the 30 required), using Decimal(R).log10() which is
        correctly rounded at the context precision; equivalently mpmath at 50
        digits. No binary floating point is used for the exact inequality
        tests; the decimal method is used only to REPORT implied-k values.
    exact_inequality_tests:
      - "b/a < 100    iff  b < 100*a      (a > 0)"
      - "c/b < 100    iff  c < 100*b      (b > 0)"
      - "c/a < 10000  iff  c < 10000*a    (a > 0)"
    derivation_only_conclusion: >
      Any count triple (a, b, c) of positive integers with c < 10000*a has
      two-decade growth c/a strictly below 10000 = 10^4, i.e. implied
      two-decade exponent log10(c/a) < 2: strictly below the exponent-+2
      prediction (R_pred = 100 per decade, 10000 over two decades). No observed
      count is assumed or used here; the comparison step supplies the recorded
      counts.

  ambiguities:
    - >
      SCOPE NOTE (non-blocking): the Q2 inequality tests are stated "for
      positive integers a <= b". The tests c/b < 100 iff c < 100*b and
      c/a < 10000 iff c < 10000*a require b > 0 and a > 0 respectively. If a
      recorded count had b = 0 (N(H2) = 0), the ratio c/b would be undefined
      and the test would not apply; the statement's positive-integer scope
      excludes that case. The comparison step should treat b = 0 (or a = 0) as
      out of scope for the ratio test, not as a test failure. Recorded as a
      scope note; it does not block the derivation.
    - >
      LABEL NOTE (non-blocking): the g_convention describes g as "monic with
      exactly ONE free coefficient (the frozen contract's 'single univariate
      quadratic' at n = 6): g(x) = x + c". A general monic quadratic x^2 + u*x
      + v has two free coefficients; the frozen convention explicitly fixes
      u = 0 and leaves v = c. The explicit formula g(x) = x + c is
      unambiguous and was used exactly as given; the parenthetical is a label,
      not a different formula. Not a blocker.
    - >
      FINDING (not a statement ambiguity): for b_index 649 the x^5 coefficient
      of the remainder is LINEAR in c (A = 0), not quadratic, because the x^5
