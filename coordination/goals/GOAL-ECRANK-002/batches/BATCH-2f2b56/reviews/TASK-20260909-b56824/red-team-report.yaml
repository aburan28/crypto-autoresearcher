      n=8 d=(1..1) b-tuple I derived the Mestre trunc-sqrt g (deg 4, monic),
      s = delta*g^2 mod p (deg s = 3), the forcing identity s(b_i) = g(b_i)^2,
      the Weierstrass model (ainv), the 8 Weierstrass points, and the Mestre
      relation (sum of the 8 points == O). I then re-executed the committed
      F_l certifier (exact_certify, sha256
      1bc7c05954fdf9531c41eb942e91f918e401098971b2211501a9628ae011ea8e, pinned
      match True) at the default window (max_prime=1500, max_good_primes=60)
      and at enlarged windows (max_prime=100000, max_good_primes in {200, 400}).
      All scripts and JSON outputs are in scratch/ (n8_algebra.py/json,
      prime_bound.py/json, certify_windows.py/json); all three were re-executed
      in the final session and match the prior verified values.
