  proves_too_much:
    objects:
      - inference: "the planted controls validate the construct pipeline's height calibration"
        tested_against: >
          R10's recorded FAILED gates (b) and (c): exponent gate all_in_window
          false; per-decade ratios [2.25, 1.0] outside [5,20].
        outcome: breaks
        exact_broken_step: >
          The calibration conclusion is KNOWN FALSE on the recorded data (the
          gates failed). The broken step is the one that treats the planted
          controls as validating height calibration despite the recorded FAILED
          gates (b) and (c); an argument that still asserts calibrated
          validation after those gates have failed proves too much.
      - inference: "the R14 completed in-cap zero evidences the absence of n=8 construct instances"
        tested_against: >
          The disclosed enumeration scope (integer (a,b) box only; non-integer
          coefficients not enumerated, not claimed empty) and HEUR-1's own H^1
          abundance prediction at n=8.
        outcome: breaks
        exact_broken_step: >
          A zero on a sub-lattice (the integer box) where the prediction says
          abundant does not evidence absence on the full rational lattice. The
          broken step is the transfer from the integer box to the full lattice.
          Symmetrically, reading the completed zero as evidence of nothing at
          all inside the tested box also breaks: it is a completed measurement,
          not a non-observation.
      - inference: "decade ratios more than an order of magnitude below x100 REFUTE HEUR-1"
        tested_against: >
          The toy-tier boundary (H <= 10^4; count points of 20-33 instances;
          the law's asymptotic regime unmeasured).
        outcome: breaks
        exact_broken_step: >
          A refutation reading that still goes through at the toy tier (where
          the asymptotic regime is unmeasured) proves too much. The broken step
          is the transfer from the toy tier to the asymptotic regime.
      - inference: "the tension is a height-convention artifact (CONV-RESOLVED)"
        tested_against: >
          The recorded convention-B ratios [1.2692, 1.0], where its conclusion
          is KNOWN FALSE.
        outcome: breaks
        exact_broken_step: >
          An argument that still resolves the tension by convention, where the
          conclusion is known false (convention-B ratios [1.2692, 1.0]), breaks.
          The broken step is the one that attributes the tension to the height
          convention.
      - inference: "IV-1C adjudication: 'certifier-limited, control survives'"
        tested_against: >
          The alternative that the certifier correctly detected genuine
          dependence at the shortfall tuples.
        outcome: breaks
        exact_broken_step: >
          An adjudication that cannot distinguish an instrument boundary from a
          genuine shortfall without the prime-set computation proves too much in
          the permissive direction. My prime-set computation (certify_windows.py)
          shows the shortfall survives a 400-prime enlargement, so it is a
          genuine shortfall, not an instrument boundary. The permissive reading
          'certifier-limited, control survives' is broken.
      - inference: "IV-1C adjudication: 'CERTIFIER_LIMITED = voiding control failure'"
        tested_against: "the amendment's graded-outcome text"
        outcome: breaks
        exact_broken_step: >
          An adjudication that treats the graded CERTIFIER_LIMITED outcome as a
          voiding control failure proves too much in the strict direction
          against the amendment's graded-outcome text, which defines
          CERTIFIER_LIMITED as a distinct graded outcome (recorded in the R9
          raw result as iv1c_graded_outcome: CERTIFIER_LIMITED with
          iv1r_pass: true), not a voiding failure.

  scope_falsification:
    inference: "the same-machine fresh-seed replication is an independent replication"
    tested_against: >
      The recorded disclosure that the replication was run on the same machine
      (fresh seed, same machine).
    outcome: breaks
    exact_broken_step: >
      A same-machine fresh-seed replication tests seed sensitivity and
      determinism, but it cannot test machine-dependent behavior (because it is
      on the same machine). Reading it as independent of machine-dependent
      effects is a scope overreach; the broken step is the transfer from
      'same-machine fresh seed' to 'independent replication'.

  joint_verdict:
    verdict: breaks
    grounds: >
      The candidate readings do not survive the attack at the stated scopes.
      (1) The n=8 shortfalls at b_index 0/1/7 are genuine (they survive a
      400-prime enlargement for every l in {2,3,5,7,11,13}), so the
      instrument-boundary reading breaks and the control-failure reading
      revives. (2) Each of the four declared proves-too-much objects breaks at
      a named step. (3) The same-machine fresh-seed replication is not an
      independent replication in the sense of being independent of
      machine-dependent effects.

