  Q1_n6_ellipticity_quadratic_three_pairs:
    mechanism_statement: >
      Let b = (b_1, ..., b_n) be n distinct rationals and d = (d_1, ..., d_n)
      prescribed values. Define p(x) = prod_i (x - b_i) (monic, degree n) and
      delta(x) = the unique polynomial of degree <= n - 1 with delta(b_i) = d_i
      (Lagrange interpolant). For a monic polynomial g, define
      s(x) := delta(x) * g(x)^2 mod p(x)  (the remainder on division by p, so
      deg s <= n - 1). The identity s(b_i) = d_i * g(b_i)^2 holds for every i
      and every g. The ELLIPTICITY condition is deg s <= 4: since the remainder
      has degree <= n - 1, this is the vanishing of the top n - 5 coefficients
      of delta*g^2 mod p. At n = 6 this is a SINGLE condition: the coefficient
      of x^5 in the remainder vanishes. The NONDEGENERACY conditions are:
      g(b_i) != 0 for every i; deg s in {3, 4}; and s nonsingular (for
      deg s = 4: disc(s) != 0 treating v^2 = s(u); for deg s = 3: s cubic with
      nonzero discriminant). R-VECTOR CONVENTION: a solution g determines the
      rational-point coordinates r_i := g(b_i), so that s(b_i) = d_i * r_i^2
      (the forcing identity). The two height conventions to report per root
      are: h_B = max(|num|, |den|) of the free coefficient c in lowest terms,
      and h_A = max_i max(|num|, |den|) of r_i in lowest terms, where
      rat_height(q) = max(|num|, |den|) for q = num/den in lowest terms
      (rat_height of an integer z is |z|).
    frozen_parameters:
      n: 6
      g_convention: >
        g is monic with exactly ONE free coefficient (the frozen contract's
        'single univariate quadratic' at n = 6): g(x) = x + c, c in Q. If the
        derivation shows this convention makes the ellipticity condition
        degenerate or not quadratic in c at any pair, RECORD THAT AS THE
        FINDING — do not silently switch conventions.
      pairs:
        - b_index: 649
          b: [0, 1, 13, 8, 7, -5]
          d: [22, 3, -3, 22, 3, -3]
        - b_index: 1299
          b: [0, 1, -14, -2, 4, -20]
          d: [165, 165, -165, 3, 3, -165]
        - b_index: 4995
          b: [0, 1, -5, 16, -9, 12]
          d: [10, 22, 10, -22, 22, -22]
      box: >
        Enumerate ALL exact rational roots c of the derived quadratic per
        pair; for each root report numerator and denominator in lowest terms,
        h_B, the derived r vector, h_A, and membership under both conventions
        at each threshold in {10^2, 10^3, 10^4} (h_A <= threshold; h_B <=
        threshold). The mapping to the producer's recorded instance data
        happens in the comparison step, not here.
    derivation_required:
      - Per pair, compute delta(x) exactly (degree <= 5, delta(b_i) = d_i).
      - Per pair, compute delta(x)*(x + c)^2 mod p(x) symbolically in c.
      - Per pair, extract the x^5 coefficient as a polynomial in c; verify it is quadratic in c; give its exact coefficients.
      - Per pair, solve exactly over Q; report every rational root with the normal forms above.
      - Per root, check g(b_i) != 0 for all i, compute s exactly, report deg s, disc(s), and whether the nondegeneracy conditions hold; report the r vector, h_A, and h_B.
      - Per pair, verify the identity s(b_i) = d_i * g(b_i)^2 symbolically (it must hold identically).

  Q2_decade_ratio_arithmetic:
    statement: >
      Under the power-law count statement N(H) = C * H^k (C > 0 constant, k
      the exponent), the per-decade growth ratio between nested thresholds H
      and 10H is R = N(10H)/N(H) = 10^k, independent of C. The implied
      exponent of an observed ratio R is k = log10(R). For integer cumulative
      counts a = N(H1) <= b = N(H2) <= c = N(H3) across two decades, the
      decade ratios are R1 = b/a and R2 = c/b (exact rationals) and the
      two-decade total is c/a.
    frozen_parameters:
      prediction_exponent: 2
      prediction_note: >
        The frozen prediction to test against is exponent +2: a factor of
        exactly 100 per decade. Do NOT assume any observed count here; the
        comparison step supplies the recorded counts.
    derivation_required:
      - Derive R_pred = 10^2 = 100 exactly from the power-law statement.
      - Derive the implied-exponent formula k = log10(R) and state the comparison method (exact rational comparisons for the inequality tests against 100/10000; a high-precision decimal method, stated, for implied-k values).
      - Give the exact integer inequality tests as the machinery the comparison step will use: for positive integers a <= b, b/a < 100 iff b < 100a; c/b < 100 iff c < 100b; c/a < 10000 iff c < 10000a.
      - State, as a derivation-only conclusion, that any count triple with c < 10000a has two-decade growth strictly below the exponent-+2 prediction; do not assume any observed value here.

