review_plan:
  id: REVIEW-PLAN-BATCH-523fe1
  recorded_at: '2026-09-06'
  goal_id: GOAL-ECRANK-002
  experiment_id: EXP-ECRANK-73275e
  hypothesis_id: H-ECRANK-36d8d7
  batch_id: BATCH-523fe1
  written_by: coordinator
  written_before_any_reviewer_runs: true
  scope: >
    Claim-changing round on the EXP-ECRANK-73275e run package: the verdicts can
    move H-ECRANK-36d8d7 (M-A / M-B) between specified, running, analyzed,
    supported-scoped, weakened-scoped, or falsified-scoped, and can void runs
    under IV-1..IV-6. The Coordinator composes the joint-level verdicts into
    the disposition under the ledger archive TASK-20260906-dfd0f0.

  coordinator_prior: >
    Recorded BEFORE any reviewer runs. (1) I expect R2 (the draw-support audit)
    to PASS: the predecessor draw stream is deterministic, its sub-box
    construction is declared in the committed source, and the R1 self-test
    should confirm the reconstruction. (2) I expect R3 (construct-n6) to find
    certified elliptic instances: at n = 6 ellipticity is a single univariate
    quadratic and no local obstruction was measured. (3) I am UNSURE about R5
    (n = 8): a 3-diagonal-quadratic system with Bezout <= 8 may be sparse at
    the toy caps; a zero there is a first-class F3_n8 outcome, not a failure.
    (4) I expect the validator to find the run package HOLDABLE: the executor
    discipline (SR-3 schema, SR-9 exact cap flag, SR-10 dual wall) was
    designed specifically because the predecessor's package needed a
    pre-archive repair, so the main audit risk is arithmetic honesty, not
    schema. (5) I expect the red team to press the ATTRIBUTION LOGIC: whether
    (audit passes AND n=6 yields instances) actually resolves the
    artifact-versus-mathematics ambiguity, whether F1_audit's re-attribution
    is correct if the audit fails, and the toy-scale transfer limits. A prior
    the round overturns is one of the most informative results this program
    can produce.

  joints:
  - id: J1
    owner: validator
    task_id: TASK-20260906-db4ada
    claim_step: Run integrity, control completeness, and metric honesty.
    attack_plan: >
      Re-parse all eight manifests against the nested run: record schema and
      the artifact policy; re-check seeds against replication.seeds exactly;
      recompute the counted-op total from the raw op ledger of at least R3
      and R8 and confirm the EXACT ops_cap_respected boolean (no 1% band);
      verify checkpoints every 1e7; verify control comparability (R6 null
      object vs R3/R5 same-shape; R7 known-false vs the solver; R4 replay vs
      R3 determinism); verify the IV-1..IV-6 control outputs are present and
      unvoided-or-voided exactly as the rules state; verify the execution
      report's pre-analysis checks and the frozen-prediction-only comparison
      (frozen slope window [0.699, 1.301], per-decade [5, 20]) with no
      post-hoc re-scoring anywhere.

  - id: J2
    owner: red-team
    task_id: TASK-20260906-1dad98
    claim_step: Interpretation, attribution logic, cost model, and scope.
    attack_plan: >
      (a) Attribution: given each of the four outcome cells (audit pass/fail
      x n6 yield/no-yield), check that the pre-registered F/G clauses close
      EXACTLY their declared scopes and nothing more; in particular whether
      F1_audit's re-attribution of the predecessor zero is forced or merely
      consistent. (b) Proves-too-much: the audit logic must REJECT the
      known-false objects -- verify R7's known-false n=6/n=8 results and the
      IV-5 corrupted-reconstruction self-test both fail as designed; an audit
      that passes its known-false control is a broken audit. (c) Cost model:
      re-derive the counted-op accounting against the IC-1 exclusions
      [SR-11] and the dual wall semantics [SR-10]; flag any counted quantity
      whose definition moved between the contract and the run records.
      (d) Blind re-derivation (blind_rederivation below): re-derive the
      expected planted-meet count N_a from |S| and the draw count stated in
      the contract and inputs alone, without reading the executor source.
      (e) Scope: toy-scale transfer limits for any supported-scoped reading;
      the n=8 arm is secondary and descriptive at this scale and must not be
      loaded with more weight than the contract grants it.

  blindness:
    within_round: blinded
    rule: Reviewers may not read each other's reports; each attests to exactly what it read.
    lifted_for: null
    attestation_required: true

  proves_too_much_control: >
    Known-false objects, declared in the frozen contract: R7 (known-false at
    n = 6 and n = 8) for the construction solver, and the IV-5
    corrupted-reconstruction self-test for the audit. A control that does not
    fail as designed voids its dependent readings per invalidation_rules
    (IV-1, IV-4 for solver; IV-5 for audit).

  blind_rederivation:
    quantity: expected planted-meet count N_a (the P2 expected-meets arithmetic)
    rederived_by: red-team (TASK-20260906-1dad98, joint J2 item d)
    blind_from:
    - experiments/EXP-ECRANK-73275e/source/
    - experiments/EXP-ECRANK-73275e/runs/
    permitted_sources:
    - experiments/EXP-ECRANK-73275e/specification.yaml (inputs, metrics, preregistered prediction)
    - ledger/hypotheses/H-ECRANK-36d8d7.yaml (the d = 1 closed form statement)
    - ledger/evidence/EV-ECRANK-8b35bb.yaml (predecessor measurement anchors)
    note: >
      This is not replication: recomputing from the executor's artifacts
      reproduces a wrong-but-self-consistent implementation faithfully.
      Agreement is evidence about the quantity; disagreement localises to one
      of two named implementations.

  procedure_deviations: []
