review_plan:
  claim_under_review: "Prospective single CEFC-I packet: one exact real key/walk law, nontrivial public zero-circulation label, polynomial complete-EndRing RingPotential, executable honest pseudocode trace and proved fiber theorem, or its earliest exact obstruction. The producer's literal claim and commit will be bound in the snapshot receipt without rewriting this plan."
  coordinator_prior: "The expected earliest gap is the exact trapdoor key/walk distribution or a concrete public zero-circulation label paired with a polynomial complete-ring endpoint evaluator. If these are supplied, public coboundary/smaller-witness factorization and attacker-to-complete-ring extraction are the next expected gaps. This expectation is not a verdict."
  joints:
    -
      joint: "J1 -- O1/O2: exact real law, typed algorithms, public label and polynomial ring evaluator"
      assigned_to: "TASK-20261014-604885"
      attack_plan: "Start with pp and E only; trace the fixed-length nonbacktracking public walk sampler and every EdgeLabel call, then with declared W_E only trace RingPotential(E,C). Expand each hidden subroutine, basis conversion and retry law; check whether an orientation, Hom enumeration, retained path or secret advice slipped into the public sender. Produce the first ill-typed call or missing explicit sampler/cost bound."
      breaking_artifact: "Exact missing input/subroutine/distribution or superpolynomial operation with its quantifiers."
    -
      joint: "J2 -- O3/O4: zero circulation, endpoint fibers, actual-message correctness and full-ring asymmetry"
      assigned_to: "TASK-20261014-9ff2ea"
      attack_plan: "Use the actual supported walks, canonical endpoint equality, parallel edges/automorphisms, dual/backtrack relations and all admitted cycles. Derive two same-endpoint walk sums, compare them with RingPotential, and check the stated failure law. Substitute a public coboundary, constant value, one evaluator, finite torsion action, path/cache, compressed or opaque decoder; show a factorization or preserve the exact missing exclusion."
      breaking_artifact: "A supported fiber collision, incorrect trace/failure quantifier, public recovery algorithm, smaller-witness factorization, or exact open lemma."
    -
      joint: "J3 -- O5/O6 and separate IND-CPA, active, novelty, QPT/QROM and Category-5 gates"
      assigned_to: "TASK-20261014-0754ea"
      attack_plan: "From the statement and literal algorithms only, reconstruct the probability spaces, fiber/potential equality, failure terms, honest cost, IND-CPA advantage and extractor success/loss. Give the solver the EndRing challenge E without W_E; require real public-key simulation and a complete evaluable basis as output, rejecting a potential/path/evaluator substitute. For raw XOR give the related-ciphertext active attack. Check quantum query interfaces, rewinding/programming assumptions, normative Category-5 target and primary-source novelty comparisons separately; every unsupported lift remains open."
      breaking_artifact: "Reverse-arrow or distribution/extraction counterexample, missing view/simulator/query interface, exact malleability attack, unestablished source/quantum/concrete gate, or re-derivation discrepancy."
  blindness:
    mutual: true
    lifted_for: []
    rationale: "All J1-J3 reviewers run in fresh sessions with explicit source allowlists and no sibling reads, despite serial max_concurrent=1. Composition alone reads their union after custody archive."
  proves_too_much:
    objects:
      -
        object: "Public coboundary EdgeLabel(e)=h(head(e))-h(tail(e)) for explicit public h"
        known_false_conclusion: "Recipient-only recovery / confidentiality"
        expected_signature: "Zero circulation and honest agreement may hold, but public endpoint evaluation exposes the value and the asymmetry/security gate must fail."
      -
        object: "Zero/constant EdgeLabel and constant RingPotential"
        known_false_conclusion: "Nontrivial confidential key-bearing invariant"
        expected_signature: "Nontriviality witnesses fail; public recovery succeeds."
      -
        object: "Exact path hash on two distinct supported walks with the same canonical endpoint"
        known_false_conclusion: "Endpoint-fiber invariance without additional structure"
        expected_signature: "Different sender values or an exact missing collision-separation obligation."
      -
        object: "One evaluator, finite torsion-action table, cached paths, compressed endpoint decoder and opaque decoder advice"
        known_false_conclusion: "Complete-ring necessity inferred merely from use of W_E"
        expected_signature: "Expose any factorization through the smaller object and charge its construction/advice; absent exclusion leaves necessity open."
      -
        object: "Raw endpoint-plus-XOR ciphertext with endpoint-preserving nonzero payload flip"
        known_false_conclusion: "IND-CCA2 or non-malleability from correctness/IND-CPA"
        expected_signature: "Give the byte-distinct accepted related ciphertext and one-query recovery relation; do not exclude all equal-endpoint queries."
      -
        object: "Ring witness enables decryption but no attacker-to-ring extractor is supplied"
        known_false_conclusion: "EndRing-only confidentiality reduction"
        expected_signature: "Reject the reverse implication and mark complete-basis extraction open."
    failure_signature: "For each named object, preserve its stated failure signature. A correct argument cannot turn public agreement into recipient secrecy, smaller advice into complete-ring necessity, reverse functionality into extraction, or raw XOR into active security."
    assigned_to: "TASK-20261014-0754ea"
    execution_mode: "symbolic_zero_run_controls_with_J2_owning_correctness_and_necessity_verdicts"
  blind_rederivation:
    required: true
    assigned_to: "TASK-20261014-0754ea"
    quantity: "All load-bearing fiber/potential equalities, distribution/failure probabilities, bit/runtime bounds, IND-CPA advantage and attacker-to-complete-EndRing extractor success/loss. Reconstruct from literal statement, definitions and declared parameters alone; absence is open, not zero loss."
    parameters: "Exact literal family and real-law definitions in coordination/design/TASK-20261014-11b3d6/tasks/TASK-20261014-460fea/public-statement.yaml; no Category-5 parameter selection."
