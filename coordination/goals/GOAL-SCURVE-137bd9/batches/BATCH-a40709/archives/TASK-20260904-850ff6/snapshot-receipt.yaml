content_verified_not_bound:
- path: coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/dispatch_queue.json
  sha256_at_b012132b2: 0327241331a3935a7d4cd0a964b8b7e40325febdabb209ef8924d362809e55ac
  digest_provenance: >-
    Recomputed by the driving session from the blob as committed at
    b012132b234bd4bcc5d6ef774c548528a5a7294c. Not computed by this role.
  status: CONTENT-VERIFIED AT b012132b2, NOT IN THE BINDING SET
  why_it_is_not_bound: >-
    BINDING IT WOULD MAKE THIS RECEIPT GO STALE ON THE NEXT ORDINARY QUEUE
    ADVANCE — the queue is edited on every task transition, and it already has
    been: commit 7a7c87866, after b012132b2, set TASK-20260904-f0a889 to
    `completed` and TASK-20260904-850ff6 to `queued`, so the digest above is
    already historical and a bound value would already fail a fresh content
    check on a queue that is doing nothing but working correctly.
  authority: >-
    CLAUDE.md's concurrency contract excludes the queue from archive commits for
    the same reason it excludes generated and per-transition state: an archive
    receipt binds CONTENT, and content that changes on every ordinary transition
    cannot be bound without manufacturing a false integrity failure. The
    committed, dispatcher-accepted exemplar this receipt is modelled on
    (GOAL-ECRANK-002/BATCH-e0caa5/archives/TASK-20260822-e7c486/receipt.yaml)
    binds NO queue file either.
  tension_recorded_rather_than_smoothed: >-
    ON THE BATCH DESIGN THE QUEUE IS S0 OUTPUT — S0's committed `artifact_paths`
    names it, S0 edited it (three keys inside S13's handoff envelope, its report
    section 4), and every non-archive slot is assigned to exactly one archive.
    The two rules therefore genuinely pull opposite ways here, and this receipt
    resolves the pull by DISCLOSING rather than by binding or by pretending the
    pull does not exist. The disclosure preserves what binding was for: the
    exact bytes of the queue at the archive commit are recorded, so any later
    reader can reconstruct what S0 left and compare it against what the queue
    says now.
  what_this_costs_stated_plainly: >-
    A consumer of this archive does NOT receive a content binding on the queue.
    If the queue were altered in a way that is not an ordinary state transition
    — a re-scoped slot, a changed budget, a renumbered task — this receipt would
    not detect it. What it does give is a fixed digest at a fixed commit, which
    is the strongest thing available for a file whose whole function is to
    change.
  not_a_defect_in_s0: >-
    S0 declared the queue in artifact_paths because the batch design put it
    there. That is a design/contract tension, not an S0 error, and nothing here
    is charged to S0.

