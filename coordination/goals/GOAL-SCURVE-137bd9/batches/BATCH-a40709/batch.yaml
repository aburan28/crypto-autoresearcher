# ===========================================================================
# 5. ARCHIVE ASSIGNMENTS AND DEPENDENCY DISCIPLINE
# ===========================================================================
archive_assignments:
  S0: S1
  S2: S4
  S3: S4
  S5: S6
  S7: S8
  S9: S10
  S11: S13
  S12: S13
archive_assignment_rule: >-
  EVERY NON-ARCHIVE SLOT IS ASSIGNED EXACTLY ONCE TO AN IN-QUEUE ARCHIVE SLOT,
  and every archive slot here IS a task in the queue rather than a bare ledger
  commit. A batch whose archive is only a ledger commit is not representable in
  dispatch_queue.v1 and is undispatchable -- the dispatcher rejects it with
  "non-archive task must be assigned exactly once to an archive task" -- which
  is exactly why GOAL-PATH-001 BATCH-002 cannot be dispatched. If the rendered
  queue for this batch is rejected for that reason, the defect is in the
  rendering, not in this design, and the fix is never to invent an
  unauthorized archive task.
snapshot_dependency_rule: >-
  NO SNAPSHOT ARCHIVE'S depends_on NAMES A READER OF WHAT IT ARCHIVES. Each
  archive depends only on its own sources; readers depend on the ARCHIVE. This
  is the reason for five snapshots instead of one and the cost is stated
  plainly -- five commits and five receipts, paid to keep every review and
  every downstream read bound to sealed content.
archives_run_alone: >-
  Snapshot archives run alone before independent review; the ledger archive
  runs alone after it. Concurrent workers never commit into one shared
  worktree.

# ===========================================================================
# 6. BUDGET
# ===========================================================================
budget_accounting:
  campaign_budget_as_committed: >-
    maximum_batches null (UNBOUNDED) and total_wall_clock_seconds null
    (UNBOUNDED) by BUDGET-AMEND-20260828-750d51 on the user's explicit
    2026-08-28 instruction to fund every goal, recorded in DEC-20260828-750d51.
    max_concurrent is 2 and is NOT raised here.
  no_budget_stop_available: >-
    The budget clause of the goal's pause conditions cannot fire, and no budget
    amendment is required to admit this batch or the next one.
  declared_batch_total_seconds: 15000
  split_across_slots:
    S0: 900
    S1: 900
    S2: 1800
    S3: 1200
    S4: 900
    S5: 1800
    S6: 900
    S7: 1200
    S8: 900
    S9: 600
    S10: 900
    S11: 900
    S12: 900
    S13: 1200
  arithmetic: >-
    900 + 900 + 1800 + 1200 + 900 + 1800 + 900 + 1200 + 900 + 600 + 900 + 900 +
    900 + 1200 = 15000 exactly.
  memory_ceilings: >-
    Every slot carries a non-null memory ceiling; the largest is 4 GB at S5,
    where the reduced-scale null family lives. With max_concurrent 2 the
    declared peak is 6 GB.
  basis: >-
    DECLARATIONS, NOT MEASUREMENTS. No run has occurred under this goal. Every
    number here is a ceiling fixed before acquisition, and a slot that halts at
    its ceiling halts truthfully with the ceiling named -- which is an
    operational observation, never a result.
  unlimited_does_not_mean_unranked: >-
    The batch admits ranks 1 through 6 of the archived plan's own ordering and
    stops. An unlimited budget removes the ceiling, never the duty to rank, and
    it is the strongest invitation to make-work this program has.

max_concurrent: 2
max_concurrent_basis: >-
  THE GOAL HEAD'S COMMITTED CEILING IS 2 AND IT IS NOT RAISED. The dependency
  graph agrees with it independently -- the widest stage is 2, twice -- S2 with
  S3 (the L0 carve-out in operation, retrieval concurrent with measurement) and
  S11 with S12 (the sibling-blind review pair). Every archive runs alone by
  rule. Sizing concurrency to what the environment can actually run is the
  dispatching Coordinator's responsibility; no hardware measurement was made by
  this session and none is asserted.

# ===========================================================================
# 7. COORDINATOR PRIOR, RECORDED AT OPENING
# ===========================================================================
coordinator_prior_recorded_at_opening: >-
  RECORDED BEFORE ANY PRODUCER RUNS AND BEFORE THE REVIEW PLAN EXISTS, so that
  a review overturning it is legible as a result rather than absorbed. THE
  LATER REVIEW-PLAN SLOT MUST CARRY THIS BLOCK FORWARD VERBATIM; any revision
  is a procedure_deviations entry, never an edit.
  P-1 (STRONG). L0 closes -- all ten targets retrieve and the eleven thresholds
  transcribe with direct quotations. Basis is the capability finding's ten
  responses. FALSIFICATION TRIGGER is any target failing at dispatch, which is
  an impediment and not a finding about any curve.
  P-2 (STRONG). L-EQ's exact equality holds and no source conflict exists.
  Basis is the capsule's advisory mod-9, mod-11 and magnitude agreement, plus
  the capability finding's arithmetic against the same committed capsule. IF IT
  FAILS that is a major result about intake and provenance, not about the
  curve, and I want it discovered in millisecond-cost work rather than after
  expensive lanes.
  P-3 (MODERATE-STRONG). L-BASE closes by the Hasse-interval uniqueness
  argument and the DERIVED cofactor agrees with the single retrieved witness.
  The load-bearing step is the uniqueness argument, which silently fails for
  curves with a small n or a large cofactor, and I expect the report to write
  it out rather than assert it.
  P-4 (MODERATE, AND THE ONE I EXPECT TO BE MOST INFORMATIVE IF WRONG). At
  least one of the ladder, complete and ind cells adjudicates as reproduced
  UNDER THE RETRIEVED DEFINITION WITH A SCOPE DIFFERENCE RECORDED, rather than
  as a clean agreement. If all three adjudicate cleanly, my flagging was
  over-cautious and that is the finding.
  P-5 (WEAK, AND ABOUT THIS PROGRAM RATHER THAN THE MATHEMATICS). After this
  batch the binding constraint on this goal will be PROVENANCE and
  CERTIFICATES -- primary-clause readability, primality certificates,
  factorisation -- and not arithmetic capability. If that is right, the batch
  after next is a provisioning question rather than a research one.
  P-6 (STRONG, AND IT IS A CONSTRAINT ON MYSELF). No cell adjudicated here will
  support any statement about any curve's security. Every adjudication is about
  a definition and a measurement. A report that reads otherwise has overclaimed
  and the reviewers should say so.

# ===========================================================================
# 8. REVIEW ARCHITECTURE
# ===========================================================================
review_architecture:
  plan_written_by: slot S9, after the snapshot at S8 and before either reviewer runs
  already_fixed_so_that_writing_it_later_is_not_writing_it_conveniently:
  - the prior above is carried into the plan VERBATIM
  - >-
    blindness is MUTUAL within the round -- S11 and S12 may not read each
    other's reports and each attests what it read
  - every joint gets EXACTLY ONE owner, and an unowned joint is visible before the round rather than after
  - >-
    the proves-too-much control is REQUIRED, and its known-false objects are
    named in advance here -- the anomalous curve and the pairing-friendly curve
    the plan's control bank lists, for which a criterion argument that still
    goes through has proved too much
  - >-
    a BLIND RE-DERIVATION is required of one load-bearing quantity, and the
    natural one is the derived group order and cofactor from L-BASE, re-derived
    from the STATEMENT of the quantity and the parameters alone, with the
    producer's implementation and report in blind_from
  no_escalation_to_review_breakthrough: >-
    This is an ordinary claim-changing round -- no claimed breakthrough, no
    proposed goal closure, no contradiction between validated evidence records.
    If a lane's falsifier fires (a degenerate transfer flag, an unreproduced
    generation transcript, an intake decimal that does not equal the retrieved
    hex), THAT routes to review-breakthrough at max in an independent session
    BEFORE any statement leaves this repository, and that tier may never be
    degraded.

knowledge_retrieval: >-
  Every producer MUST attempt search_knowledge before asserting that a quantity
  for this curve has or has not already been computed in this program, and MUST
  record its query strings and outcomes verbatim. ABSENCE OF A HIT LICENSES NO
  INFERENCE. The index is DERIVED AND MAY BE EMPTY; if it answers nothing that
  is a fact about the index, recorded as such, and is not evidence that nothing
  was tried.

nonduplication: >-
  L-TRANSFER, when it is dispatched in a later batch, is a SPECIALISATION of
  IDEA-20260807-98a970 to one curve and mints no new mechanism proposal, per
  RQ-SCURVE-960dbd's nonduplication rule. Nothing in this batch duplicates that
  record either.

claim_ceiling: >-
  analyzed AT BEST, NEVER supported, for every record this batch produces. NO
  STATEMENT THAT ANY CURVE IS SAFE OR UNSAFE IS PERMITTED FROM ANY SLOT.
  Arithmetic verification of a published parameter set is a transcription
  check, not a security evaluation. No asymptotic claim is proposed, so the
  four promotion gates are not engaged and are certainly not met. Every
  conclusion is scoped to NIST P-224, to the parameters in the committed
  capsule, to pure-Python arithmetic, to this runtime and to the declared
  budget, and transfers to no other curve without re-running.

closure_note: >-
  NO LANE, DIRECTION OR OBJECT IS DECLARED CLOSED BY THIS BATCH AND NOTHING IS
  DECLARED IMPOSSIBLE. Every item in out_of_scope is OPEN AND UNATTEMPTED with
  the capability it waits on named and a concrete route to it. A count of
  unreachable retrievals or an exhausted factoring budget is an operational
  observation and would be a fatigue report if presented as a closure.

durability_note: >-
  NOTHING IN THIS FILE IS DURABLE RESEARCH STATE UNTIL COMMITTED, PUSHED AND
  ACCEPTED BY THE POST-COMMIT VERIFIER, AND THE AUTHORING SESSION PERFORMED
  NONE OF THOSE. The driving session merges origin/main into the working branch
  before the archive (MERGE, NEVER REBASE), stages only the declared paths,
  pushes, and opens or refreshes a PR against main naming DEC-20260904-c42007
  and BATCH-a40709. A sync conflict inside an immutable record is never
  resolved by picking a side; it is a new superseding record under a new id.

next_action: >-
  OPEN AND UNSTARTED. NO SLOT IS DISPATCHABLE YET, because no identifier is
  minted, no queue is rendered and no frozen contract exists. THE SINGLE NEXT
  ACTION is the driving session's -- commit and push DEC-20260904-c42007
  together with this file as one isolated ledger archive staging only those two
  paths, refresh the PR, and only then mint the fifteen identifiers and author
  slot S0.

