# ===========================================================================
# 1. OBJECTIVE AND SCOPE
# ===========================================================================
objective: >-
  EXECUTE THE ARCHIVED AUDIT PLAN'S OWN RANKS 1 THROUGH 6 FOR NIST P-224, AND
  ADJUDICATE ONLY WHAT THOSE RANKS CAN HONESTLY ADJUDICATE. Concretely, four
  things. (a) CLOSE GATE L0 -- retrieve the eleven SafeCurves criterion pages
  and verify.html, store each retrieved page with its fetch timestamp, and
  transcribe a threshold table carrying a DIRECT QUOTATION for each of the
  eleven thresholds. (b) CERTIFY THE BASIC PARAMETER LANES -- L-EQ, L-FIELD and
  L-BASE, with their controls, on exact integer arithmetic, closing the
  capsule's one open reconciliation (the intake decimal for b against the
  retrieved hex) and DERIVING the group order via the Hasse-interval
  uniqueness argument rather than trusting the single retrieved cofactor
  witness. (c) CONVERT ONE CERTIFIED INTEGER INTO FIVE MEASUREMENTS -- the
  near-free block L-LADDER, L-COMPLETE, L-IND, D3 and D6, with their retrieved
  positive controls and same-shape nulls, plus L-RHO as one formula evaluation.
  (d) PERFORM THE GATED COMPARISON EXACTLY ONCE, in one task, after L0 closes,
  and adjudicate only those intake cells for which BOTH a retrieved definition
  and a certified measurement exist -- recording every other cell as OPEN AND
  UNATTEMPTED.
  A FAILED CONTROL IS A COMPLETE AND VALUABLE OUTCOME, not a batch failure. AN
  UNREACHABLE RETRIEVAL TARGET IS AN OPERATIONAL OBSERVATION, not a finding.
  A BUDGET STOP IS A PARTIAL CERTIFICATE, never a negative result.

in_scope_lanes:
  rank_1:
    lane: L0
    what: retrieve and transcribe the eleven criterion definitions and thresholds
    blocking: >-
      BLOCKING FOR COMPARISON ONLY. The plan states it twice and this batch is
      built on it -- no lane may be compared against any intake cell until L0
      closes, BUT measurement lanes MAY run before L0; only the COMPARISON step
      is gated.
  rank_2: {lane: L-EQ, what: exact coefficient equalities and nonsingularity}
  rank_3: {lane: L-FIELD, what: p as an exact identity, bit length, residues, probable primality}
  rank_4: {lane: L-BASE, what: G on curve, order of G, derived group order and cofactor, trace}
  rank_5:
    lanes: [L-LADDER, L-COMPLETE, L-IND, D3, D6]
    what: >-
      the five near-free lanes L-BASE unlocks. NEAR-FREE ON THE TARGET AND NOT
      NEAR-FREE ON THEIR CONTROLS, which is stated here rather than inherited
      as shorthand -- the retrieved positive-control curves and the same-shape
      null families are the real spend and are hard gates, not optional extras.
  rank_6:
    lane: L-RHO
    what: >-
      one cost-formula evaluation at n, reported with every idealisation of the
      model listed. NO SOLVER IS RUN. A number from a formula is not evidence
      about how long any real attack takes.

out_of_scope:
  rule: >-
    EVERY ITEM BELOW IS OPEN AND UNATTEMPTED. None is tried, screened,
    negative, closed, deprioritized or ruled out. Each names the capability it
    waits on, so a session that HAS that capability can pick it up without
    re-deriving why it was left.
  items:
  - id: OOS-1
    what: L-TRANSFER, rank 7, the embedding-degree lane
    status: OPEN AND UNATTEMPTED
    why_not_here: >-
      RANKED NEXT, NOT DEPRIORITIZED. Its bounded form -- 10^6 modular
      multiplications certifying k greater than K -- is stdlib-reachable and
      this runtime can serve it. It is held out because it carries its own
      mandatory planted-positive instrument (a toy k equals 12, a toy k equals
      1 and a toy k equals 2, which must return exactly those values before any
      P-224 row is interpretable) and because its falsifier routes to
      independent review-breakthrough scrutiny before any statement leaves this
      repository. That is a lane, not an addendum.
    successor: heads the queue of the batch after this one
    note: >-
      The capability finding's observation that no k at most 100 satisfies p^k
      congruent 1 mod n is a probe, NOT this lane, and does not discharge it.
  - id: OOS-2
    what: primality CERTIFICATES for p and for n (ECPP or Pocklington)
    status: OPEN AND UNATTEMPTED
    why_not_here: >-
      Every primality statement this batch may make is PROBABLE-PRIME with a
      stated round count and witness list, never prime. A certificate needs a
      producer and an independent verifier this runtime has not been shown to
      have.
    separately_provisioned_capability: a certificate-producing toolchain plus a third-party re-verifier
  - id: OOS-3
    what: exact embedding degree k
    status: OPEN AND UNATTEMPTED
    why_not_here: requires the complete factorisation of n - 1
    separately_provisioned_capability: a factoring toolchain (ECM or PARI class)
  - id: OOS-4
    what: L-DISC and D5 (rank 9), L-TWIST, D1 and D2 (rank 10)
    status: OPEN AND UNATTEMPTED
    why_not_here: >-
      These are the two budget-dominating factorisation lanes. The batch is
      scoped to what this runtime DEMONSTRABLY supports, and factorisation of
      224-bit integers is not that. Their bounded trial-division fallbacks are
      stdlib-reachable and are deliberately NOT admitted here, so that a
      partial result does not arrive wearing a lane's name.
    separately_provisioned_capability: ECM or PARI-class factorisation, checked at dispatch
    honest_note: >-
      The capability finding reports small factors of the twist order below
      200000 as 3^2 times 11 times 47 with a 64-digit cofactor unfactored, and
      reports t^2 - 4p as negative. Those are measured observations about a
      transcription, they are NOT lane outputs, and twist security is NOT
      adjudicated by them or by anything in this batch.
  - id: OOS-5
    what: L-RIGID part (a) and D8, the FIPS 186 generation-transcript audit
    status: OPEN AND UNATTEMPTED
    why_not_here: >-
      Blocked on a retrieval this runtime has NOT been shown to serve. The
      producer of BATCH-ef5b1e fetched FIPS 186-4, NIST SP 800-186 and SEC 2
      with HTTP 200 and could not extract their parameter or procedure text; no
      PDF text extraction was demonstrated by the capability finding, which
      probed HTML targets only. Running part (a) from a recalled procedure
      would manufacture a false negative, which the plan forbids.
    separately_provisioned_capability: >-
      a session with working PDF text extraction, or an authoritative rendering
      of the generation procedure in a retrievable non-PDF form
  - id: OOS-6
    what: primary-clause reconciliation of the parameter tuple (the capsule's OPEN-2)
    status: OPEN AND UNATTEMPTED
    why_not_here: same capability gap as OOS-5
    consequence_stated_plainly: >-
      THE TUPLE THIS BATCH MEASURES STILL RESTS ON RFC 5114 Section 2.5 (an
      authoritative restatement) PLUS ONE AGGREGATOR. Goal completion criterion
      1 is met only in its authoritative reading, not its primary reading.
      Arithmetic against the committed capsule cannot repair provenance, and
      nothing in this batch says the capsule transcribed the right curve.
  - id: OOS-7
    what: D7, the formula exceptional-case search (rank 11)
    status: OPEN AND UNATTEMPTED
    why_not_here: independent of every other lane and blocks nothing; ranked later on information per second
  - id: OOS-8
    what: the three-field-size null-distribution study that produces the H3 drift error bar
    status: OPEN AND UNATTEMPTED
    why_not_here: >-
      H3 is consumed by L-TWIST, L-DISC, D1, D2 and D5, all of which are out of
      scope here. This batch admits only single-scale reachability-rate nulls,
      which are hard gates for the rank-5 block, and it does NOT use them to
      place any P-224 statistic in a distribution.

# ===========================================================================
# 2. THE GATE, RESTATED AS A BINDING RULE
# ===========================================================================
comparison_gate:
  rule: >-
    EXACTLY ONE TASK IN THIS BATCH MAY COMPARE A MEASURED QUANTITY AGAINST A
    THRESHOLD, AND IT IS SLOT S7. Every measurement task is forbidden from
    comparing, from rendering a cell, and from writing the words safe, unsafe,
    vulnerable or secure about any curve. A measurement task that finds itself
    wanting to compare has found a design error and stops.
  why: >-
    Reproducing a measured quantity and then comparing it against a REMEMBERED
    threshold is a recalled claim wearing a certificate. Retrieval is what
    makes the threshold stop being remembered, which is the whole content of
    gate L0.
  no_recall_substitution: >-
    A threshold that cannot be retrieved stays UNRETRIEVED and its cell stays
    OPEN AND UNATTEMPTED. No recalled threshold may enter a comparison under
    any circumstances, including a partial L0 in which some pages retrieved and
    others did not.
  adjudication_scope: >-
    An adjudicated cell is a claim about a RETRIEVED DEFINITION and a CERTIFIED
    MEASUREMENT, scoped to both. Agreement with an intake cell REPRODUCES A
    PREREGISTERED COMPARISON TARGET and confirms no authority; the intake row
    is user-supplied unverified intake and is not evidence. Disagreement is
    recorded as a disagreement with a preregistered target and is routed to
    review, never published from this batch.
  cells_reachable_in_this_batch:
    potentially_adjudicable: [field, equation, base, rho, ladder, complete, ind]
    open_and_unattempted: [transfer, disc, rigid, twist]
    caveat: >-
      POTENTIALLY, NOT PREDICTED. A cell is adjudicated only if BOTH its
      retrieved definition and its certified measurement exist at S7. If L0
      returns a definition that differs from the recalled definition a lane was
      drafted against, that INVALIDATES THAT LANE'S COMPARISON STEP (not its
      measurement) and must supersede the plan in a new record rather than be
      patched into one.
  definition_sensitive_cells_flagged_in_advance:
    cells: [ladder, complete, ind]
    why: >-
      The plan flags all three as turning on the definition rather than on any
      measurement -- an x-only Weierstrass ladder is not a Montgomery model,
      complete formulas for prime-order short Weierstrass curves are recalled
      to exist, and general encodings for arbitrary curves are recalled to
      exist. Each of those recollections is RECALLED, NOT RETRIEVED, and may
      not discharge anything. Flagged here so that a scope difference is not
      later mistaken for a disagreement or for a discovery.

# ===========================================================================
# 3. CAPABILITY CONTRACT
#    Declared per task, CHECKED AT DISPATCH, never discovered mid-run.
# ===========================================================================
capability_contract:
  why_this_block_exists: >-
    CAPABILITY IS PER-SESSION, NOT PER-REPOSITORY. On 2026-09-04 two producer
    tasks in ONE batch of GOAL-ECRANK-002 reported different toolchains -- one
    with cypari 2.5.6 and PARI 2.15.4, one with none -- and the second could
    not attempt half its protocol. A handoff that needs PARI or the network
    must SAY SO and be CHECKED AT DISPATCH.
  pari_requirement_for_this_batch: >-
    NONE. No task here requires gp, PARI, cypari, cypari2 or Sage. Every
    arithmetic lane in scope is pure-Python integer arithmetic plus the affine
    elliptic-curve group law. A task that finds itself needing PARI has left
    the batch's scope and stops rather than improvising.
  network_requirement_for_this_batch: >-
    ONE PRODUCER SLOT ONLY (S2) requires external HTTP retrieval. The archive
    slots require repository transport for fetch and push, which is not source
    retrieval. Every other producer slot must run with NO external retrieval
    and reads only sealed committed artifacts.
  dispatch_time_checks:
  - id: CAP-1
    before_slot: S2
    check: >-
      each of the ten L0 targets responds -- the SafeCurves index plus
      rho, transfer, disc, rigid, ladder, twist, complete, ind and verify.
    on_failure: >-
      S2 HALTS AS AN IMPEDIMENT on a still-active goal, recorded with its
      condition, what is blocked (the comparison step of slot S7, never the
      goal), what clears it and what to re-run. The measurement slots stay
      dispatchable and the batch still returns certified measurements. This is
      an operational observation and is NEVER negative mathematical evidence.
  - id: CAP-2
    before_slots: [S3, S5, S7]
    check: >-
      arbitrary-precision integer arithmetic and a command-execution tool are
      available in the dispatched session.
    on_failure: >-
      the slot is NOT run and NOT reported as attempted. A session without
      arithmetic can only transcribe, and a transcription reported as a
      measurement is exactly the defect this batch exists to remove.
  - id: CAP-3
    before_slots: [S11, S12]
    check: >-
      the review-adversarial tier at xhigh is servable in an independent
      session by an allowed non-Bedrock backend.
    on_failure: >-
      the CLAIM is blocked, not the campaign. No substitution of a lower tier,
      no silent downgrade, and the goal stays active with the impediment
      recorded.
  - id: CAP-4
    before_slot: S2
    check_note: >-
      A LABEL GOTCHA RECORDED SO A SUCCESSOR DOES NOT REPEAT IT. The SafeCurves
      index carries the P-224 row under a NIST P-224 style label and does not
      contain the lowercase token nistp224; a successor searching for the
      lowercase token would wrongly conclude the row is absent.
  bedrock: >-
    PROHIBITED IN EVERY SLOT. No provider, backend, endpoint, fallback or probe
    may select an identifier containing bedrock, case-insensitively. Refuse
    before making a request.

# ===========================================================================
# 4. TASK SLOTS
#    IDENTIFIERS ARE NOT MINTED HERE. Each slot names the role, the
#    capability, the budget, the archive that owns it and its deliverables.
#    A successor mints one TASK id per slot with
#    `python3 tools/allocate_id.py --next task --date YYYYMMDD --check`
#    and one EXP id for the frozen contract, and writes the queue and cards.
# ===========================================================================
identifier_minting_note: >-
  FIFTEEN IDENTIFIERS ARE NEEDED AND NONE IS MINTED BY THIS FILE -- fourteen
  TASK ids, one per slot S0 through S13, and one EXP id for the frozen
  contract authored in S0. Two more (one EV and one DEC) are needed at the
  close and are minted by whoever runs S13. Do NOT grep for the next free
  number; draw each token without scanning state and confirm it with --check
  before use.

task_slots:

- slot: S0
  role: coordinator
  title: Open the control plane and freeze the experiment contract
  deliverables:
  - >-
    a frozen experiment contract at experiments/EXP-SCURVE-<tok>/specification.yaml
    carrying metrics, controls, budgets, stopping rules, invalidation rules and
    required artifacts for the in-scope lanes, with approved_by null until a
    committed Coordinator decision approves it
  - the dispatch queue for this batch
  - one task card per slot
  depends_on: []
  archived_by: S1
  network_required: false
  pari_required: false
  budget: {wall_clock_seconds: 900, memory_gb: 2}
  artifact_ownership_note: >-
    THE GOAL HEAD IS WRITTEN TWICE IN THIS BATCH AND OWNED ONCE, following the
    BATCH-f8bf86 convention. S0 updates the head's current_batch_id and
    dispatch_queue_path so the batch is findable -- a stale pointer is exactly
    what made GOAL-PATH-001 BATCH-002 invisible to the portfolio tool -- and
    carries the head in write_scope but NOT in artifact_paths, disclosing the
    write in S1's snapshot receipt under staged_not_in_binding_set. PATH
    OWNERSHIP BELONGS TO S13, whose ledger archive binds the durable transition
    by path_sha256.

- slot: S1
  role: coordinator
  title: Snapshot archive of the opening control plane
  kind: snapshot
  source_slots: [S0]
  depends_on: [S0]
  archived_by: null
  archived_by_note: an archive task is not itself assigned to an archive
  network_required: true
  network_note: repository transport for fetch and push only; NO external source retrieval
  pari_required: false
  budget: {wall_clock_seconds: 900, memory_gb: 2}
  runs_alone: true

- slot: S2
  role: executor
  title: Close gate L0 and retrieve the control-curve parameter tuples
  deliverables:
  - >-
    a stored copy of each of the ten retrieved pages with its fetch timestamp
    and the retrieved byte length
  - >-
    a transcribed threshold table with a DIRECT QUOTATION for each of the
    eleven thresholds and a per-threshold retrieval provenance entry
  - >-
    a control-curve capsule carrying retrieved parameter tuples, with per-field
    provenance and two-source agreement where obtainable, for the curves the
    rank-5 controls need -- NIST P-256 and NIST P-192 as the parameter-matched
    negatives, secp256k1 as the D3 positive, and the Montgomery and Edwards
    positive-control curves the plan names
  - a retrieval log recording every failure as an operational observation
  prohibitions: >-
    NO ARITHMETIC, NO COMPARISON, NO CELL RENDERED. This slot transcribes what
    it retrieved and nothing else. An unretrievable target is recorded
    unretrieved and is never paraphrased from memory.
  depends_on: [S1]
  archived_by: S4
  network_required: true
  pari_required: false
  budget: {wall_clock_seconds: 1800, memory_gb: 2}
  concurrency: runs concurrently with S3; this is the L0 carve-out in operation

- slot: S3
  role: executor
  title: Measurement block A -- L-EQ, L-FIELD, L-BASE with constructed controls
  deliverables:
  - >-
    per-lane certificates for L-EQ (the exact equality of the intake decimal
    for b with the retrieved hex, a equals p - 3, nonsingularity witness,
    j-invariant neither 0 nor 1728), L-FIELD (p as an exact identity, bit
    length, the residues later lanes consume, probable primality with its
    round count and witness list) and L-BASE (G on the curve, n times G equals
    the identity with (n-1) times G finite, the Hasse-interval uniqueness
    argument WRITTEN OUT, the derived group order and cofactor, the trace with
    Hasse checked)
  - >-
    the constructed controls run on the IDENTICAL code path BEFORE any P-224
    output is interpreted -- a by-construction composite of the same bit length
    (the primality checker must reject it), a singular curve over the same p
    (the nonsingularity check must reject it), and a random point (the on-curve
    check must reject it)
  prohibitions: >-
    NO NETWORK. NO COMPARISON AGAINST ANY INTAKE CELL. Primality is reported as
    PROBABLE PRIME with its parameters, never as prime.
  depends_on: [S1]
  archived_by: S4
  network_required: false
  pari_required: false
  budget: {wall_clock_seconds: 1200, memory_gb: 2}
  note_on_the_open_reconciliation: >-
    L-EQ closes the capsule's one open reconciliation. The capsule's mod-9,
    mod-11 and magnitude agreement is ADVISORY and proves nothing; only the
    exact integer equality does. If it FAILS, that is a real conflict between
    user intake and retrieved sources, it fires the goal's third pause
    condition as an IMPEDIMENT on a still-active goal, and it voids every
    downstream lane until resolved -- it is not silently fixed.

- slot: S4
  role: coordinator
  title: Snapshot archive of L0 and measurement block A
  kind: snapshot
  source_slots: [S2, S3]
  depends_on: [S2, S3]
  depends_on_constraint: >-
    ITS depends_on NAMES ONLY ITS OWN SOURCES AND NO READER OF THEM. S5 and S7
    read what this archive archives and are therefore NOT named here; they
    depend on this archive instead. This is why the batch carries several small
    archives rather than one large one.
  archived_by: null
  network_required: true
  network_note: repository transport only
  pari_required: false
  budget: {wall_clock_seconds: 900, memory_gb: 2}
  runs_alone: true

- slot: S5
  role: executor
  title: Measurement block B -- the near-free five plus L-RHO, with retrieved controls
  deliverables:
  - >-
    per-lane outputs for L-LADDER (two independent routes to the same fact),
    L-COMPLETE (the certified residues plus the Lagrange argument), L-IND (two
    independently certified residues, each derived separately), D3 (the
    j-invariant, the automorphism count and the discounted cost, disclosed as a
    CONSTANT-FACTOR diagnostic that can never move an exponent) and D6 (the
    three gcds plus the symbolic exceptional sets of the Weierstrass coordinate
    conversions)
  - >-
    L-RHO as one formula evaluation at n, reported as an exact integer and a
    log2 figure with its rounding stated, and with every idealisation of the
    cost model listed -- unit-cost group operations, no memory or communication
    cost, no cross-target amortisation, no quantum adversary
  - >-
    the retrieved positive controls exhibited on the identical code path -- the
    Montgomery model produced for the curve that has one, the Edwards model for
    the curve that has one, the automorphism count of 6 for secp256k1 -- and
    the parameter-matched negatives run
  - >-
    the same-shape null family at ONE reduced field size, with its size, its
    sample count and its measured reachability rates reported. A checker that
    reports zero percent reachability on the null is BROKEN and voids the
    lanes that depend on it.
  seal_declaration: >-
    THIS SLOT HAS A PRE-READ SEAL AND MUST DECLARE IT IN artifact_paths. It may
    not read S2's or S3's outputs until they are sealed, i.e. committed and
    bound by path_sha256 in S4's snapshot receipt. The receipt path is declared
    in this slot's artifact_paths as a READ-BOUND SEAL -- an entry that already
    exists and that this slot does not write.
  depends_on: [S4]
  archived_by: S6
  network_required: false
  pari_required: false
  budget: {wall_clock_seconds: 1800, memory_gb: 4}
  honest_cost_note: >-
    THE NAME NEAR-FREE APPLIES TO THE TARGET, NOT TO THE CONTROLS. The P-224
    arithmetic here is microseconds; the controls and the null family are the
    budget, and they are hard gates rather than extras.

- slot: S6
  role: coordinator
  title: Snapshot archive of measurement block B
  kind: snapshot
  source_slots: [S5]
  depends_on: [S5]
  archived_by: null
  network_required: true
  network_note: repository transport only
  pari_required: false
  budget: {wall_clock_seconds: 900, memory_gb: 2}
  runs_alone: true

- slot: S7
  role: executor
  title: The gated comparison -- adjudicate only what is adjudicable
  deliverables:
  - >-
    a comparison dossier pairing each retrieved threshold with the certified
    measurement it governs, per cell, with the direct quotation of the
    threshold beside the measured quantity
  - >-
    a per-cell disposition -- adjudicated (with the retrieved definition
    quoted), or OPEN AND UNATTEMPTED with the reason, which is either no
    retrieved definition or no certified measurement
  - >-
    an explicit list of every cell where the retrieved definition DIFFERS from
    the recalled definition the plan's lane was drafted against, which
    invalidates that lane's comparison step and requires a superseding record
    rather than a patch
  seal_declaration: >-
    PRE-READ SEALS DECLARED IN artifact_paths -- S4's snapshot receipt (which
    binds the L0 threshold table and measurement block A) and S6's snapshot
    receipt (which binds measurement block B). This slot may not read any
    measurement or threshold that is not bound by one of those two receipts,
    which is what makes the ordering checkable rather than promised.
  prohibitions: >-
    ADJUDICATES CELLS, NEVER CURVES. It may not state or imply that NIST P-224
    or any other curve is safe, unsafe, vulnerable or free of vulnerabilities.
    A failure of rigidity, ladder availability, completeness or
    indistinguishability is not by itself an ECDLP break, and none of those is
    even measured for the first of those four here.
  depends_on: [S6]
  archived_by: S8
  network_required: false
  pari_required: false
  budget: {wall_clock_seconds: 1200, memory_gb: 2}
  review_required: true

- slot: S8
  role: coordinator
  title: Snapshot archive of the comparison dossier
  kind: snapshot
  source_slots: [S7]
  depends_on: [S7]
  archived_by: null
  network_required: true
  network_note: repository transport only
  pari_required: false
  budget: {wall_clock_seconds: 900, memory_gb: 2}
  runs_alone: true

- slot: S9
  role: coordinator
  title: Write the review plan for the comparison dossier
  deliverables:
  - >-
    a review plan naming the claim under review AS ITS PRODUCER STATED IT,
    carrying this file's coordinator_prior_recorded_at_opening forward VERBATIM,
    enumerating the joints and giving each EXACTLY ONE owner with a worked
    attack, declaring mutual blindness, requiring the proves-too-much control
    with its known-false objects named, and requiring a blind re-derivation of
    one load-bearing quantity with its blind_from paths listed
  seal_declaration: >-
    PRE-READ SEAL DECLARED IN artifact_paths -- S8's snapshot receipt. The plan
    is written against the COMMITTED dossier, never against a working-tree one.
  depends_on: [S8]
  archived_by: S10
  network_required: false
  pari_required: false
  budget: {wall_clock_seconds: 600, memory_gb: 1}
  why_not_written_now: >-
    DELIBERATELY DEFERRED, AND THAT IS A DECISION RATHER THAN AN OMISSION. A
    plan written now would be written against an imagined artifact. What is
    already FIXED, so that writing it later cannot become writing it
    conveniently, is listed under review_architecture below.

- slot: S10
  role: coordinator
  title: Snapshot archive of the review plan
  kind: snapshot
  source_slots: [S9]
  depends_on: [S9]
  archived_by: null
  network_required: true
  network_note: repository transport only
  pari_required: false
  budget: {wall_clock_seconds: 900, memory_gb: 2}
  runs_alone: true
  why_separate: >-
    The review plan must be DURABLE BEFORE ANY REVIEWER RUNS. Independence is a
    property of how a review was set up and it is spent the moment the setup
    stops being declared, so the plan cannot wait for the ledger archive. It
    cannot ride in S8 either, because S9 reads what S8 archives and a snapshot
    archive's depends_on may not name a reader of what it archives.

- slot: S11
  role: validator
