# ---------------------------------------------------------------------------
- slot: S2
  task_id: TASK-20260904-8e3d66
  title: Close gate L0 and retrieve the control-curve parameter tuples
  role: executor
  requested_policy: executor-implementation
  independent_session_required: false
  depends_on: [TASK-20260904-850ff6]
  archived_by: TASK-20260904-fa10f7 (S4, snapshot)
  review_required: false
  concurrency: runs concurrently with S3; this is the L0 carve-out in operation
  capability_declarations:
    network_required: true
    network_note: external HTTP retrieval of the named L0 targets and the control-curve sources
    pari_required: false
    arithmetic_required: false
    arithmetic_note: >-
      NO ARITHMETIC IS PERFORMED BY THIS SLOT AT ALL. It transcribes what it
      retrieved and nothing else.
    command_execution_required: true
    dispatch_time_check_owed_before_this_slot: >-
      CAP-1 (each of the ten L0 targets responds). Its outcome is recorded. A
      failure HALTS THIS SLOT AS AN IMPEDIMENT on a still-active goal and leaves
      the measurement slots dispatchable. CAP-4 is a recorded label gotcha, not a
      check.
    bedrock: *BEDROCK
  budget: {wall_clock_seconds: 1800, memory_gb: 2, maximum_runs: 12}
  objective: >-
    Close gate L0 by RETRIEVAL, and retrieve the parameter tuples the rank-5
    controls need. Fetch the ten L0 targets named in batch.yaml (the SafeCurves
    index plus the rho, transfer, disc, rigid, ladder, twist, complete and ind
    criterion pages and verify.html), store each retrieved page with its fetch
    timestamp and retrieved byte length, and transcribe a threshold table that
    carries a DIRECT QUOTATION for each of the eleven thresholds with a
    per-threshold retrieval provenance entry. Separately retrieve, with
    per-field provenance and two-source agreement where obtainable, the
    parameter tuples for the control curves the plan names: the two
    parameter-matched negatives, the D3 positive, and the Montgomery and Edwards
    positive-control curves.
  constraints:
  - *CLAIM_CEILING
  - *KNOWLEDGE_RETRIEVAL
  - >-
    NO ARITHMETIC, NO COMPARISON, NO CELL RENDERED. This slot transcribes what it
    retrieved and nothing else. You may not compare any measured or transcribed
    quantity against any threshold; slot S7 is the only slot in this batch that
    may compare.
  - You may not write the words safe, unsafe, vulnerable or secure about any curve.
  - >-
    AN UNRETRIEVABLE TARGET IS RECORDED UNRETRIEVED AND IS NEVER PARAPHRASED
    FROM MEMORY. No recalled threshold may enter the record under any
    circumstances, including a partial close in which some pages retrieved and
    others did not. A threshold that cannot be retrieved stays UNRETRIEVED and
    its cell stays OPEN AND UNATTEMPTED.
  - >-
    CAPABILITY DECLARATION: this slot REQUIRES external HTTP retrieval and
    requires NO PARI, gp, cypari, cypari2 or Sage. The dispatch-time check CAP-1
    is run before you start and its outcome is recorded. If a target fails, HALT
    AS AN IMPEDIMENT on a still-active goal: record the condition, what is
    blocked (the comparison step of slot S7, never the goal), what clears it and
    what to re-run. The measurement slots stay dispatchable. This is an
    operational observation and is NEVER negative mathematical evidence.
  - >-
    LABEL GOTCHA RECORDED IN batch.yaml SO YOU DO NOT REPEAT IT: the SafeCurves
    index carries the target row under a NIST P-224 style label and does not
    contain the lowercase token nistp224; searching for the lowercase token
    would wrongly conclude the row is absent.
  - >-
    Store each retrieved page BYTE-FOR-BYTE with its fetch timestamp, retrieved
    byte length and sha256 in the manifest. A quotation that cannot be located in
    a stored page is not a quotation.
  - *BEDROCK
  - *OPERATIONAL
  - >-
    Write ONLY inside your declared write_scope. Never commit and never stage;
    the Coordinator archive slot S4 commits.
  deliverables:
  - >-
    a stored copy of each retrieved page under retrieved-pages/, with a manifest
    recording per page the URL, the fetch timestamp, the retrieved byte length
    and the sha256
  - >-
    a transcribed threshold table with a DIRECT QUOTATION for each of the eleven
    thresholds and a per-threshold retrieval provenance entry naming the stored
    page it was quoted from
  - >-
    a control-curve capsule carrying retrieved parameter tuples with per-field
    provenance and two-source agreement where obtainable, for the control curves
    batch.yaml names
  - >-
    a retrieval log recording every attempt and every failure as an operational
    observation, with the HTTP status and the time of the attempt
  artifact_paths:
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-8e3d66/retrieved-pages/manifest.yaml
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-8e3d66/threshold-table.yaml
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-8e3d66/control-curve-capsule.yaml
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-8e3d66/retrieval-log.yaml
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-8e3d66/report.md
  write_scope:
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-8e3d66
  completion_gate:
  - >-
    every one of the ten targets has either a stored page with timestamp, byte
    length and sha256, or a retrieval-log entry recording it as unretrieved with
    its status
  - >-
    every threshold in the table carries a direct quotation and names the stored
    page it was quoted from, or is marked UNRETRIEVED
  - >-
    the control-curve capsule records per-field provenance and states, per field,
    whether two-source agreement was obtained
  - no arithmetic was performed, no comparison was made, and no cell was rendered
  return_format: >-
    executor execution report: what was retrieved, what was transcribed, what
    failed and with what status, no interpretation of significance

# ---------------------------------------------------------------------------
- slot: S3
  task_id: TASK-20260904-90ac09
  title: 'Measurement block A: L-EQ, L-FIELD, L-BASE with constructed controls'
  role: executor
  requested_policy: executor-implementation
  independent_session_required: false
  depends_on: [TASK-20260904-850ff6]
  archived_by: TASK-20260904-fa10f7 (S4, snapshot)
  review_required: false
  concurrency: runs concurrently with S2
  capability_declarations:
    network_required: false
    pari_required: false
    arithmetic_required: true
    arithmetic_note: arbitrary-precision integer arithmetic and the affine elliptic-curve group law
    command_execution_required: true
    dispatch_time_check_owed_before_this_slot: >-
      CAP-2 (arbitrary-precision integer arithmetic and a command-execution tool
      are available). On failure the slot is NOT run and NOT reported as
      attempted.
    bedrock: *BEDROCK
  budget: {wall_clock_seconds: 1200, memory_gb: 2, maximum_runs: 20}
  objective: >-
    Certify measurement lanes L-EQ, L-FIELD and L-BASE on exact integer
    arithmetic against the committed parameter capsule, and run the constructed
    controls on the identical code path FIRST. L-EQ: compute and report the exact
    integer relation between the intake decimal for the curve coefficient and the
    retrieved hexadecimal, the relation between the linear coefficient and the
    field prime, a nonsingularity witness and the j-invariant, each REPORTED AS
    COMPUTED and never as assumed. L-FIELD: the prime as an exact identity, its
    bit length, the residues later lanes consume, and probable primality with its
    round count and witness list. L-BASE: the base point on the curve, the order
    of the base point established by the two-sided check batch.yaml names, the
    Hasse-interval uniqueness argument WRITTEN OUT rather than asserted, the
    DERIVED group order and cofactor, and the trace with Hasse checked.
  constraints:
  - *CLAIM_CEILING
  - *KNOWLEDGE_RETRIEVAL
  - >-
    NO COMPARISON AGAINST ANY INTAKE CELL AND NO CELL RENDERED. You measure; slot
    S7 is the only slot in this batch that may compare a measured quantity
    against a threshold. A measurement task that finds itself wanting to compare
    has found a design error and stops.
  - You may not write the words safe, unsafe, vulnerable or secure about any curve.
  - >-
    READ THE PARAMETERS FROM THE COMMITTED CAPSULE AT THE PATH IN inputs. Do not
    type a parameter from memory, do not carry a value in from any other record
    or from this handoff, and record the sha256 of the capsule you read. Every
    quantity you report is one YOUR code computed in this run.
  - >-
    THE CONSTRUCTED CONTROLS RUN ON THE IDENTICAL CODE PATH BEFORE ANY TARGET
    OUTPUT IS INTERPRETED, and they are hard gates: a by-construction composite
    of the same bit length that the primality checker MUST reject, a singular
    curve over the same prime that the nonsingularity check MUST reject, and a
    random point that the on-curve check MUST accept only if it is on the curve.
    A control that does not fire voids the lane it guards.
  - >-
    PRIMALITY IS REPORTED AS PROBABLE PRIME WITH ITS ROUND COUNT AND WITNESS
    LIST, NEVER AS PRIME. A primality certificate is OPEN AND UNATTEMPTED and out
    of scope here.
  - >-
    IF L-EQ's EXACT EQUALITY FAILS, that is a real conflict between user intake
    and retrieved sources: report it plainly, do NOT silently fix it, do not
    proceed to interpret downstream lanes, and record it as an IMPEDIMENT on a
    still-active goal. It fires the goal's third pause condition as an
    impediment; it is a result about intake and provenance and about NO curve's
    security.
  - >-
    CAPABILITY DECLARATION: this slot requires arbitrary-precision integer
    arithmetic and a command-execution tool, and requires NO network and NO PARI,
    gp, cypari, cypari2 or Sage. Dispatch-time check CAP-2 is run before you
    start. If arithmetic or command execution is unavailable, the slot is NOT run
    and NOT reported as attempted -- a transcription reported as a measurement is
    exactly the defect this batch exists to remove.
  - *BEDROCK
  - *OPERATIONAL
  - >-
    Write ONLY inside your declared write_scope. Never commit and never stage;
    the Coordinator archive slot S4 commits.
  deliverables:
  - >-
    per-lane certificates for L-EQ, L-FIELD and L-BASE, each recording the input
    read, the exact integers computed, the code path used and the check that
    would have failed
  - >-
    the Hasse-interval uniqueness argument written out in full, with the
    conditions under which it silently fails stated
  - >-
    the constructed-control results on the identical code path, recorded BEFORE
    the target results are interpreted, each with the rejection or acceptance it
    produced
  - >-
    the exact source code that produced every number, plus a report stating what
    was measured, what was not, and every value left null with its reason
  artifact_paths:
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-90ac09/measurements-block-a.yaml
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-90ac09/controls-block-a.yaml
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-90ac09/src/measure_block_a.py
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-90ac09/report.md
  write_scope:
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-90ac09
  completion_gate:
  - >-
    every reported quantity is reproducible by re-running the committed source
    against the capsule whose sha256 is recorded
