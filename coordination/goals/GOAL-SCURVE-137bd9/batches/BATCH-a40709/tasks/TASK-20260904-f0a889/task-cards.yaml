goal_id: GOAL-SCURVE-137bd9
question_id: RQ-SCURVE-960dbd
experiment_id: EXP-SCURVE-3f87f6
authored_by_task: TASK-20260904-f0a889
authored_by_slot: S0
opening_decision: DEC-20260904-c42007
queue: coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/dispatch_queue.json
batch_design: coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/batch.yaml

authority_note: >-
  THESE CARDS ARE POINTERS, NOT PERMISSIONS. A card cannot approve an
  experiment, move a status, or serve as evidence. The binding contract for a
  slot is its handoff envelope inside the committed dispatch queue; the binding
  design is batch.yaml, which GOVERNS if the two ever disagree. A card that
  disagrees with either is wrong and the disagreement is a superseding record,
  never an edit to an immutable one. NO CARD APPROVES EXP-SCURVE-3f87f6: its
  approved_by is null and only a separate committed Coordinator decision can
  change that.

no_leak_rule: >-
  NO CARD RESTATES A PARAMETER VALUE, A PRIOR VERDICT, A MARGINAL, A COUNT OR AN
  EXPECTED VALUE FOR THE AUDITED CURVE, AND THAT IS THE POINT OF THE FILE'S
  SHAPE. Some readers of these cards are blinded readers. A dispatch card that
  leaks a prior answer destroys the cell it was meant to discriminate. Where a
  slot needs a value it reads the committed capsule, the retrieved pages or the
  sealed producer output BY PATH, and records the sha256 of what it read.

completeness_note: >-
  Fourteen cards, one per slot S0 through S13, in queue order. Each carries its
  queue entry's objective, constraints, deliverables, budget, capability
  declarations and completion gate. Constraints that are identical across slots
  are carried by YAML anchor, which a parser expands in place: the card
  literally contains the text, and there is exactly one copy to drift.

common_constraints:
  claim_ceiling: &CLAIM_CEILING >-
    CLAIM CEILING, CARRIED VERBATIM FROM batch.yaml: analyzed AT BEST, NEVER
    supported, for every record this batch produces. NO STATEMENT THAT ANY CURVE
    IS SAFE OR UNSAFE IS PERMITTED FROM ANY SLOT. Arithmetic verification of a
    published parameter set is a transcription check, not a security evaluation.
    No asymptotic claim is proposed, so the four promotion gates are not engaged
    and are certainly not met. Every conclusion is scoped to NIST P-224, to the
    parameters in the committed capsule, to pure-Python arithmetic, to this
    runtime and to the declared budget, and transfers to no other curve without
    re-running.
  knowledge_retrieval: &KNOWLEDGE_RETRIEVAL >-
    KNOWLEDGE RETRIEVAL OBLIGATION, CARRIED VERBATIM FROM batch.yaml: Every
    producer MUST attempt search_knowledge before asserting that a quantity for
    this curve has or has not already been computed in this program, and MUST
    record its query strings and outcomes verbatim. ABSENCE OF A HIT LICENSES NO
    INFERENCE. The index is DERIVED AND MAY BE EMPTY; if it answers nothing that
    is a fact about the index, recorded as such, and is not evidence that
    nothing was tried.
  bedrock: &BEDROCK >-
    Bedrock is PROHIBITED IN EVERY SLOT: no provider, backend, endpoint,
    fallback or probe may select an identifier containing bedrock,
    case-insensitively. Refuse before making a request.
  operational_observation: &OPERATIONAL >-
    A timeout, crash, unreachable target, missing tool or budget stop is an
    OPERATIONAL OBSERVATION and is NEVER negative mathematical evidence. Record
    it with what is blocked, what clears it and what to re-run.
  archive_operational_observation: &ARCHIVE_OPERATIONAL >-
    A push failure, transport error or verifier rejection is an OPERATIONAL
    OBSERVATION, never negative mathematical evidence.
  archive_verbatim: &ARCHIVE_VERBATIM >-
    Archive VERBATIM. Do not edit, summarise, repair or improve a source
    artifact; a defect found here is a superseding record, never a patch.
  archive_runs_alone: &ARCHIVE_RUNS_ALONE >-
    RUNS ALONE. No other agent runs concurrently with an archive task, and no
    snapshot archive changes hypothesis, goal or evidence status.
  archive_merge_and_push: &ARCHIVE_MERGE_AND_PUSH >-
    Before committing, fetch origin/main and MERGE it into the working branch
    (merge, never rebase); record the base commit checked and the merge outcome
    in the receipt. Push and open or refresh the PR naming BATCH-a40709 and the
    records added.
  archive_recompute_hashes: &ARCHIVE_RECOMPUTE_HASHES >-
    Record path_sha256 recomputed from the committed blobs with
    `git show <sha>:<path>`, never copied from a producer's self-report.

capability_contract_reference:
  source: batch.yaml capability_contract
  pari_requirement_for_this_batch: >-
    NONE. No task in this batch requires gp, PARI, cypari, cypari2 or Sage. A
    task that finds itself needing PARI has left the batch's scope and stops
    rather than improvising.
  network_requirement_for_this_batch: >-
    ONE PRODUCER SLOT ONLY (S2) requires external HTTP retrieval. The archive
    slots require repository transport for fetch and push, which is not source
    retrieval. Every other producer slot must run with NO external retrieval and
    reads only sealed committed artifacts.
  dispatch_time_checks:
    CAP-1: {before_slots: [S2], check: 'each of the ten L0 targets responds'}
    CAP-2:
      before_slots: [S3, S5, S7]
      check: >-
        arbitrary-precision integer arithmetic and a command-execution tool are
        available in the dispatched session
    CAP-3:
      before_slots: [S11, S12]
      check: >-
        the review-adversarial tier at xhigh is servable in an independent
        session by an allowed non-Bedrock backend
    CAP-4: {before_slots: [S2], kind: 'recorded label gotcha, not a check'}
  none_owed_before_S0_or_S1: >-
    NO DISPATCH-TIME CAPABILITY CHECK IS OWED BEFORE S0 OR S1, NONE HAS BEEN RUN,
    AND NONE IS RECORDED AS RUN. CAP-1 is owed before S2 and CAP-2 before S3, S5
    and S7; the card for each names the check it waits on.
  bedrock: *BEDROCK

cards:

# ---------------------------------------------------------------------------
- slot: S0
  task_id: TASK-20260904-f0a889
  title: Open the control plane and freeze the experiment contract
  role: coordinator
  requested_policy: coordinator-orchestration-code
  independent_session_required: false
  depends_on: []
  archived_by: TASK-20260904-850ff6 (S1, snapshot)
  review_required: false
  capability_declarations:
    network_required: false
    pari_required: false
    arithmetic_required: false
    command_execution_required: false
    dispatch_time_check_owed_before_this_slot: none
    bedrock: *BEDROCK
  budget: {wall_clock_seconds: 900, memory_gb: 2, maximum_runs: 1}
  objective: >-
    Author the control plane for BATCH-a40709. Freeze one experiment contract at
    experiments/EXP-SCURVE-3f87f6/specification.yaml carrying metrics, controls,
    budgets, stopping rules, invalidation rules and required artifacts for the
    in-scope lanes named in batch.yaml, with approved_by null until a committed
    Coordinator decision approves it. Write one task card per slot S0 through
    S13 into task-cards.yaml, each card reproducing its queue entry's objective,
    constraints, deliverables, budget, capability declarations and completion
    gate. Update the goal head's current_batch_id and dispatch_queue_path so
    this batch is findable. Finalise this dispatch_queue.json, including the
    ledger-archive repair recorded in the constraints below.
  constraints:
  - *CLAIM_CEILING
  - *KNOWLEDGE_RETRIEVAL
  - >-
    THE FROZEN CONTRACT DECIDES NOTHING batch.yaml ALREADY DECIDED. Do not
    re-scope the lanes, do not re-rank them, do not admit an out_of_scope item,
    and do not raise max_concurrent above 2. If batch.yaml and this queue
    disagree, batch.yaml governs and the disagreement is a superseding record,
    never an edit.
  - >-
    approved_by MUST be null in the frozen contract. DEC-20260904-c42007
    approves OPENING this batch and approves NO experiment contract and NO run;
    approving this contract is a separate committed Coordinator decision.
  - >-
    DEFECT REPAIRED 2026-09-04 BY THE DRIVING SESSION, BEFORE FIRST DISPATCH.
    tools/research_dispatch.py requires a ledger archive to own at least one
    artifact under ledger/decisions/; the rendering session was forbidden to
    mint, so S13 owned none and the dispatcher rejected the whole queue.
    EV-SCURVE-b52b57 and DEC-20260904-8578cc were minted and verified free by
    the driving session and are already in S13's artifact_paths and
    archive.record_ids. DO NOT MINT AGAIN and do NOT grep for a next free
    number.
  - >-
    One task card per slot, fourteen cards, each naming its exact artifact
    paths, its capability declarations (network_required, pari_required), its
    budget and its completion gate. A card may not restate any parameter value,
    prior verdict, marginal, count or expected value for NIST P-224: a dispatch
    card that leaks a prior answer destroys the cell it was meant to
    discriminate. Point at the committed capsule and the retrieved pages by path
    instead.
  - *BEDROCK
  - >-
    The goal head is written twice in this batch and OWNED ONCE. You update ONLY
    current_batch_id and dispatch_queue_path; the head path is owned by S13 and
    the durable transition is bound there. Carry the head in write_scope, NOT in
    artifact_paths, and disclose the write in S1's snapshot receipt under
    staged_not_in_binding_set.
  - *OPERATIONAL
  - >-
    Write ONLY inside your declared write_scope. Never commit and never stage;
    the snapshot archive slot S1 commits.
  deliverables:
  - >-
    a frozen experiment contract at experiments/EXP-SCURVE-3f87f6/specification.yaml
    carrying metrics, controls, budgets, stopping rules, invalidation rules and
    required artifacts for the in-scope lanes, with approved_by null
  - the finalised dispatch queue for this batch, including the S13 ledger-archive repair
  - one task card per slot S0 through S13 in task-cards.yaml
  - >-
    a control-plane report recording the goal head pointer update, the
    capability declarations per slot, and every value left null with its reason
  artifact_paths:
  - experiments/EXP-SCURVE-3f87f6/specification.yaml
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/dispatch_queue.json
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-f0a889/task-cards.yaml
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-f0a889/report.md
  write_scope:
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/tasks/TASK-20260904-f0a889
  - coordination/goals/GOAL-SCURVE-137bd9/batches/BATCH-a40709/dispatch_queue.json
  - experiments/EXP-SCURVE-3f87f6
  - ledger/goals/GOAL-SCURVE-137bd9/goal.yaml
  completion_gate:
  - >-
    experiments/EXP-SCURVE-3f87f6/specification.yaml exists, parses, and carries
    approved_by null with metrics, controls, budgets, stopping rules,
    invalidation rules and required artifacts for every in-scope lane
  - >-
    fourteen task cards exist, one per slot, each with exact artifact paths,
    capability declarations, a non-null wall-clock and memory budget, and a
    completion gate
  - >-
    the S13 ledger-archive repair is applied and tools/research_dispatch.py
    accepts this queue
  - >-
    the goal head's current_batch_id and dispatch_queue_path point at
    BATCH-a40709 and no other goal field is touched
  return_format: >-
    coordinator control-plane report: what was authored, what was left null and
    why, and the dispatcher acceptance result quoted

