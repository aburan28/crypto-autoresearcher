what_this_is: Parameter tuples for the control curves the rank-5 controls need, RETRIEVED IN THIS SESSION,
  with per-field provenance (stored page, source URL, section, fetch timestamp, sha256) and a per-field
  statement of whether two-source agreement was obtained.
what_this_is_not:
- NOT a verification of any parameter. Nothing here was recomputed and no arithmetic was performed.
- NOT an adjudication of any criterion cell for any curve.
- NOT a statement about the suitability of any curve for any purpose.
agreement_method_note: 'Two-source agreement is decided by TEXTUAL comparison only: whitespace and RFC
  table-border pipes removed, lower-cased, and for hexadecimal an 0x prefix and leading zeros stripped.
  Where two sources publish a field in different bases or different curve models, agreement is recorded
  as NOT ESTABLISHED IN THIS SLOT with both values verbatim, because settling it would require base conversion
  or a model conversion, both of which are arithmetic and forbidden to this slot.'
integrity_check: Every value recorded below was verified present in its named stored page by automated
  substring match after removing whitespace and RFC table-border pipes. A value that could not be located
  was not recorded. Four RFC 8032 values initially failed this check because that table wraps values across
  cells with pipe borders; the normaliser was widened to strip pipes and all four then located. No value
  was recorded on a failed check.
unusable_source_note: https://www.secg.org/sec2-v2.pdf was retrieved (HTTP 200, 306784 bytes, sha256 in
  the page manifest) and is stored, but NO text extractor (pdftotext, pypdf, PyPDF2) exists in this session,
  so it was NOT transcribed and is quoted nowhere. Recorded as operational observation OBS-2 in retrieval-log.yaml.
  It remains available to a session that has a PDF extractor.
