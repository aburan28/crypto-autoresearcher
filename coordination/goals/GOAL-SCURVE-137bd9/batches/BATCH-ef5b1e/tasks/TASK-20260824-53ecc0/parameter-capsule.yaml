# ---------------------------------------------------------------------------
# 4. RECONCILIATION OF INTAKE AGAINST RETRIEVED SOURCES
# ---------------------------------------------------------------------------
reconciliation:
  - item: modulus_expression
    intake: 2^224 - 2^96 + 1
    retrieved: p (hex) = FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF000000000000000000000001
    status: reconciled_by_exact_word_arithmetic
    argument: >-
      2^224 - 2^96 = 2^96*(2^128 - 1), i.e. 128 one-bits followed by 96 zero-bits.
      In 32-bit big-endian words that is exactly four words FFFFFFFF followed by three
      words 00000000. Adding 1 sets the least significant word to 00000001. The result
      is FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFF 00000000 00000000 00000001, which is the
      retrieved p digit for digit.
    certificate_deferred_to: L-FIELD (exact integer equality, machine-checked)
    conflict: none
  - item: coefficient_a
    intake: implied by the string "-3x" in the intake equation
    retrieved: a (hex) = FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEFFFFFFFFFFFFFFFFFFFFFFFE
    status: reconciled_by_exact_word_arithmetic
    argument: >-
      p - 3 in 32-bit words: the least significant word 00000001 minus 3 is FFFFFFFE
      with a borrow; the borrow propagates through the two zero words 00000000 ->
      FFFFFFFF (each re-borrowing) and is absorbed by the fourth word FFFFFFFF ->
      FFFFFFFE. The result FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFE FFFFFFFF FFFFFFFF
      FFFFFFFE equals the retrieved a exactly. Hence a = p - 3 = -3 mod p.
    certificate_deferred_to: L-EQ (exact integer equality, machine-checked)
    conflict: none
  - item: coefficient_b
    intake_decimal: 18958286285566608000408668544493926415504680968679321075787234672564
    retrieved_hex: B4050A850C04B3ABF54132565044B0B7D7BFD8BA270B39432355FFB4
    status: NOT_YET_EXACTLY_RECONCILED
    checks_performed_this_session:
      character: advisory hand computations, NOT certificates
      digit_count: >-
        The intake decimal has 68 digits, consistent with a 224-bit integer whose top
        hex digits are B4 (b/2^224 ~ 0.7032, 2^224 ~ 2.6959947e67, product ~ 1.89582e67).
        The intake decimal begins 1.8958286...e67. Agreement to 7 significant figures.
      residue_mod_9: >-
        Both the retrieved hex (evaluated by Horner over its seven 32-bit words with
        2^32 = 4 mod 9) and the intake decimal (digit sum 328) reduce to 4 mod 9.
      residue_mod_11: >-
        Both reduce to 7 mod 11 (hex by the same Horner scheme with 2^32 = 4 mod 11;
        decimal by summing its 34 two-digit groups, total 2020 = 7 mod 11).
      combined_strength: >-
        Consistent modulo 99 plus a 7-significant-figure magnitude match. This makes a
        transcription error unlikely but PROVES NOTHING. It is recorded so a reviewer
        can see what was and was not done.
    certificate_deferred_to: >-
      L-EQ. The certificate is a single exact integer equality
      int(intake_decimal) == int(retrieved_hex, 16), machine-checked, plus the
      nonsingularity witness 4a^3 + 27b^2 != 0 mod p.
    conflict: >-
      UNRESOLVED PENDING ARITHMETIC. Not a detected disagreement: no source seen this
      session contradicts any other. The honest status is that exact equality has not
      been established, because this session had no arbitrary-precision arithmetic tool
      and a hand-typed 68-digit conversion would be a fabricated computation.
  - item: provenance_string
    intake: '2000 NIST; also in SEC 2'
    retrieved: >-
      RFC 5114 states its groups are taken from NIST publications; RFC 5114 associates
      the group with the SECG name secp224r1; SRC-WEIS-SEEDS reports the seeds entered
      the September 1998 ANSI X9.62 specification and were adopted by NIST in FIPS 186-2
      in 2000.
    status: consistent_but_primary_clause_not_retrieved
    conflict: >-
      NONE DETECTED. But the primary clauses (FIPS 186-4 Appendix D.1.2.2, NIST SP
      800-186 Section 3.2.1, SEC 2 Section 2.5) were fetched and could not be read in
      this environment, so "primary-source reconciliation" in the goal's completion
      criterion 1 is NOT yet met. See successor handoff S1.
  - item: safecurves_criterion_definitions
    intake: eleven True/False cells
    retrieved: NOTHING - cr.yp.to returned HTTP 502 on every attempt
    status: UNRETRIEVED
    conflict: >-
      Cannot be assessed. No comparison against any intake cell is authorized until the
      criterion DEFINITIONS and THRESHOLDS are retrieved, because a reproduction that
      compares a measured quantity against a remembered threshold is a recalled claim
      wearing a certificate. Audit lane L0 is a blocking gate for exactly this reason.

