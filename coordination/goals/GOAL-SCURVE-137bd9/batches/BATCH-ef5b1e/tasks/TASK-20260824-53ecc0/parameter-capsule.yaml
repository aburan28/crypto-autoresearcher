# ---------------------------------------------------------------------------
# 5. DERIVED QUANTITIES THAT LATER LANES WILL NEED (stated, not yet certified)
# ---------------------------------------------------------------------------
derived_quantities_to_be_certified:
  - symbol: '#E'
    definition: n * h, i.e. the order of E(F_p)
    to_be_established_in: L-BASE
  - symbol: t
    definition: p + 1 - '#E'  (trace of Frobenius)
    to_be_established_in: L-BASE
  - symbol: "#E'"
    definition: 2p + 2 - '#E' = p + 1 + t (order of the quadratic twist)
    to_be_established_in: L-TWIST
    note: >-
      Computable exactly from p and n by integer arithmetic alone. NO POINT COUNTING IS
      REQUIRED for P-224 itself. Point counting is required only for the synthetic null
      controls, which is why those are specified at reduced field size with an explicit
      transfer assumption.
  - symbol: D, f
    definition: "t^2 - 4p = f^2 * D with D the fundamental CM discriminant"
    to_be_established_in: L-DISC
  - symbol: k
    definition: multiplicative order of p modulo n (embedding degree)
    to_be_established_in: L-TRANSFER, by reusing IDEA-20260807-98a970
  - symbol: p mod 4
    value_from_retrieved_hex: >-
      The least significant 32-bit word of p is 00000001, so p = 1 mod 2^32 and in
      particular p = 1 mod 4. Recorded here because lanes L-IND and L-COMPLETE depend
      on it; still to be machine-checked in L-FIELD.

