# ---------------------------------------------------------------------------
# COMPLETION GATE
# ---------------------------------------------------------------------------
completion_gate:
- item: >-
    The parameter capsule distinguishes user intake from retrieved primary or
    authoritative sources and records provenance and unresolved conflicts.
  status: met
  where: >-
    parameter-capsule.yaml sections 1 (intake, labelled user_supplied_unverified and
    is_evidence: false), 2 (retrieval_log with successes, per-source authority tier and
    caveats, and nine recorded failures), 3 (reconciled_tuple with per-field
    agreeing_sources and provenance), 4 (reconciliation) and
    unresolved_conflicts_summary.
  qualification: >-
    "Primary" is NOT claimed. The tuple rests on one authoritative restatement
    (RFC 5114 Section 2.5, which states its groups are taken from NIST publications) and
    one independent aggregator (std.neuromancer.sk), which agree digit-for-digit on
    p, a, b, Gx, Gy, n. The primary clauses (FIPS 186-4 Appendix D.1.2.2, NIST SP
    800-186, SEC 2 Section 2.5) were fetched successfully but could not be read: the
    fetch tool could not extract their compressed PDF object streams and the container
    lacks poppler-utils, so local page rendering failed. This is recorded as
    fetched_but_not_readable, an operational observation, not a finding.
- item: >-
    The audit plan covers every one of the eleven criteria in the declared category,
    with a certificate or explicit bound, controls, falsifier, budget, and stopping rule.
  status: met
  coverage_check:
    basic_parameter_requirements: {field: L-FIELD, equation: L-EQ, base: L-BASE}
    ecdlp_security_requirements: {rho: L-RHO, transfer: L-TRANSFER, disc: L-DISC}
    ecc_security_beyond_ecdlp: {rigid: L-RIGID, ladder: L-LADDER, twist: L-TWIST, complete: L-COMPLETE, ind: L-IND}
  per_lane_fields_present: [mechanism, quantitative_prediction, certificate_or_bound, controls, budget, stopping_rule, falsifier, honest_limitation]
  qualification: >-
    Two lanes carry explicit blocking preconditions rather than being runnable today:
    L-RIGID part (a) needs the FIPS 186 / X9.62 generation procedure retrieved
    (successor S1), and the COMPARISON step of every lane needs gate L0. The MEASUREMENT
    step of nine lanes is runnable now.
- item: >-
    The plan covers every declared additional diagnostic, or records a concrete reason
    and successor condition for a deferred diagnostic.
  status: met
  coverage_check:
    complete curve and twist order factorization with checkable certificates: D1 (merged into L-BASE + L-TWIST)
    subgroup, cofactor, and invalid-curve confinement costs: D2
    automorphism- and endomorphism-adjusted rho cost: D3
    embedding-degree certificate or explicit search bound: D4 (merged into L-TRANSFER, reusing IDEA-20260807-98a970)
    CM discriminant and conductor structure: D5 (planned, with one declared partial scope)
    model-conversion exceptional sets: D6
    scalar and multiscalar formula exceptional-case search: D7 (planned, with a declared transfer assumption)
    deterministic parameter-generation transcript audit: D8 (merged into L-RIGID part (a))
  deferrals_with_reason_and_successor:
  - component: 'D5: the class number h(D) and class-group structure'
    reason: >-
      For |D| of order 2^224 the computation is subexponential at best and unavailable in
      a pure-Python environment; it does not fit the campaign's 18000 s total budget, and
      stating h(D) without computing it would be fabrication.
    successor_condition: >-
      Revisit if L-DISC returns a small |D| (making h(D) both computable and materially
      relevant), or if a Sage/PARI-class environment becomes available to the program.
  - component: 'D1: complete factorisation of the twist order'
    reason: >-
      A 224-bit factorisation may not complete inside the lane budget in this environment.
    successor_condition: >-
      The lane already degrades to a partial factorisation with a labelled unfactored
      cofactor and an interval for the largest prime factor; a complete factorisation
      becomes a scoped follow-up if the residual is small enough to be worth a dedicated
      budget.
- item: >-
    Positive, parameter-matched negative, and same-shape null controls are explicit and
    run before belief in any later task.
  status: met
  where: audit-plan.yaml section 2 (control_bank) and the per-lane controls blocks
  summary:
    positives: 8 (POS-ANOM, POS-BN254, POS-SMALLD, POS-TOYK, POS-COMPOSITE, POS-SINGULAR, POS-SMOOTHTWIST, POS-BADSEED)
    parameter_matched_negatives: 2 (NEG-P256, NEG-P192), each with its matching assumptions stated and its non-matching axes named
    same_shape_nulls: 3 (NULL-RANDB, NULL-SHUFSEED, NULL-PERMFORMULA), plus an explicit null_scale_policy
  ordering_rule_recorded: >-
    Yes, as a hard gate: for every lane the positive control must fire and the null must
    not, on the identical code path, BEFORE any P-224 output from that lane is
    interpreted. A lane whose positive control does not fire produces no interpretable
    output (AGENTS.md rule 5 instrument failure).
  qualification: >-
    POS-ANOM and POS-BN254 are positive-control CANDIDATES whose own parameters are
    currently only unverified intake; the plan requires they be sourced and self-verified
    before use, exactly as the goal's claim_boundaries demand, and it does not treat them
    as discovered attacks.
- item: >-
    The report states that no curve attack ran and makes no safety or vulnerability
    conclusion.
  status: met
  where: claim_statement block at the top of this record

# ---------------------------------------------------------------------------
# UNRESOLVED CONFLICTS BETWEEN INTAKE AND RETRIEVED SOURCES
# ---------------------------------------------------------------------------
intake_vs_retrieved:
  detected_disagreements: 0
  statement: >-
    No retrieved source seen in this session contradicts the intake, and no retrieved
    source contradicts another. What follows are OPEN RECONCILIATIONS, not detected
    conflicts, and the distinction is deliberate.
  open_items:
  - id: OPEN-1
    item: coefficient b, intake decimal vs retrieved hex
    status: not yet proved equal
    what_was_done: >-
      Advisory hand checks only: 68-digit length and 7-significant-figure magnitude
      agreement; residue 4 mod 9 from both representations; residue 7 mod 11 from both
      representations (hence agreement mod 99). These are recorded in the capsule as
      ADVISORY and explicitly not as certificates.
    why_not_closed: >-
      This session has no arbitrary-precision arithmetic tool available. Typing a
      hand-computed 68-digit conversion as if it were a machine result would violate
      AGENTS.md rule 5.
    closes_in: audit lane L-EQ (one exact integer equality, microseconds)
    escalation_if_it_fails: >-
      A genuine intake/source conflict in the named curve's parameter tuple, which is
      goal pause_condition 3 and a Coordinator decision, not a silent correction.
  - id: OPEN-2
    item: primary-clause reconciliation
    status: not achieved
    detail: >-
      FIPS 186-4, NIST SP 800-186 and SEC 2 were all fetched (HTTP 200) but none was
      readable in this environment. The tuple therefore rests on RFC 5114 Section 2.5
      (authoritative restatement, self-declared as taken from NIST publications) plus
      std.neuromancer.sk (aggregator). Goal completion criterion 1 ("reconcile the exact
      parameter tuple to retrieved PRIMARY or authoritative sources") is met only in its
      "authoritative" reading, not its "primary" reading.
    closes_in: successor handoff S1
  - id: OPEN-3
    item: cofactor h = 1
    status: single retrieved witness (aggregator only)
    mitigation: >-
      Lane L-BASE does not trust it: it derives #E from n, primality, n*G = O and the
      Hasse-interval uniqueness argument, then checks the derived cofactor against the
      retrieved value.
    closes_in: audit lane L-BASE
  - id: OPEN-4
    item: all eleven SafeCurves criterion definitions and thresholds
    status: entirely unretrieved
    detail: >-
      safecurves.cr.yp.to returned HTTP 502 through the session egress proxy on every
      one of six attempts across index.html, rigid.html, twist.html and the http variant,
      the cr.yp.to safecurves PDF likewise, and the runtime refuses web.archive.org. This
      is an operational observation about reachability. It is NOT evidence, and it does
      not license comparing measured quantities against remembered thresholds.
    consequence: >-
      Gate L0 blocks the COMPARISON step of every lane. Measurements may proceed; the
      adjudication of the eleven intake cells (goal completion criterion 4) cannot.
    closes_in: gate L0 / successor handoff S1
  definition_sensitive_cells_flagged_in_advance:
    why_recorded_here: >-
      Three intake cells are recorded now as likely to turn on the DEFINITION rather than
      on any measurement, so that a later reader cannot mistake a scope difference for a
      disagreement or for a discovery.
    cells:
    - cell: complete
      note: >-
        The plan's certified facts will be torsion facts (no Edwards/Montgomery model over
        F_p when #E is an odd prime). Complete addition formulas for prime-order short
        Weierstrass curves are RECALLED to exist in the literature
        (Renes-Costello-Batina; recalled, not retrieved, not verified this session). If
        that recollection holds, the cell is a statement about a model-based route as the
        criterion defines it, not about a mathematical impossibility.
    - cell: ladder
      note: >-
        The plan certifies the absence of a MONTGOMERY MODEL over F_p. Constant-time
        x-only ladders on Weierstrass curves are RECALLED to exist (Brier-Joye style;
        recalled, not retrieved). Whether the criterion means the Montgomery model
        specifically is what L0 must settle.
    - cell: ind
      note: >-
        The plan tests the preconditions of two NAMED constructions (Elligator 1 and 2,
        both recalled). General encodings for arbitrary curves are RECALLED to exist
        (Shallue-van de Woestijne; later SwiftEC). The cell is scoped to the named
        constructions unless L0 says otherwise.

# ---------------------------------------------------------------------------
# HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
# ---------------------------------------------------------------------------
honest_accounting:
  objects_considered:
  - O1 the reduced parameter tuple - NOT lossy (a change of representation); recorded as such
  - O2 the trace of Frobenius / order pair - lossy, constant on F_p-isogeny classes
  - O3 the CM discriminant and conductor (D, f) - lossy, invariant of the endomorphism algebra
  - O4 the embedding degree k = ord_n(p) - lossy, reused from IDEA-20260807-98a970, not re-invented
  - O5 the abstract rational torsion structure - lossy, and compatible with model conversion
  - O6 the SHA-1 generation transcript - lossy in one direction only, which is why rigidity is not computable
  - O7 the exceptional set of a formula - lossy, propagates by union of pullbacks under composition
  novelty_status: known
  novelty_justification: >-
    Every object and every lane above is standard curve-parameter validation. The
    embedding-degree object is explicitly a specialisation of an existing internal record
    (IDEA-20260807-98a970), and the eleven criteria are a published third-party
    framework. Nothing here is proposed as new mathematics.
  novelty_screen_performed: partial
  novelty_screen_limitation: >-
    The knowledge corpus (knowledge/) and the hypothesis ledger (ledger/hypotheses/) were
    NOT grepped for prior art or duplicates in this task, because the handoff's
    authoritative read_scope is three ledger files plus the named inputs and does not
    include them. Under the role contract's novelty discipline, any statement in these
    artifacts about what the corpus does or does not already contain is therefore
    UNVERIFIED and is labelled so where it appears (audit-plan.yaml sota_delta).
  dominated_by:
    as_attack: >-
      n/a in the strict sense - no attack, no algorithm and no complexity claim is made,
      so there is no frontier row this work sits on. Stated the other way for
      completeness: everything here is dominated on time by rho at 0.886*sqrt(n) and on
      memory by rho's O(1), because it mounts nothing.
    as_audit_instrument: >-
      Dominated by the parameter-validation procedures already mandated inside the
      standards themselves (ANSI X9.62-style and SEC-style validation), on authority and
      on decades of use; and dominated on breadth by the SafeCurves project, which
      already published verdicts for this curve and supplies verification scripts. Every
      row of both frontiers was considered before this field was filled; it is not null.
    what_this_plan_dominates_them_on: >-
      Nothing mathematical. Only this: if executed, the outputs would sit in this
      program's ledger with independently re-verifiable certificates, explicit
      positive/negative/null controls, named heuristics, and an intake row treated as a
      preregistered target rather than as truth.
  sota_delta: >-
    Zero speedup against any attack baseline on time, memory and data/queries. As a
    planning delta: 1 blocking gate, 11 criterion lanes and 8 diagnostics specified for
    one curve, of which 9 lanes are runnable today and 2 are blocked on retrieval; 4
    numbered heuristics with sampling scales and comparison distributions; 13 named
    controls. As a sourcing delta: the parameter tuple moved from 1 unverified
    user-supplied source to 2 independent retrieved sources agreeing on 6 of 8 fields,
    plus a second independent witness for the SEED, with 9 retrieval failures recorded
    rather than papered over.
  closures_enumerated:
    count: 0
    statement: >-
      NO LANE, DIRECTION OR OBJECT IS DECLARED CLOSED, and nothing is declared impossible.
      The three deferrals recorded above (D5's class number, D1's complete twist
      factorisation, L-RIGID part (a) pending retrieval) each carry a mechanism, a
      concrete reason and a named successor condition, per docs/inventor-protocol.md
      section 4. None is a saturation claim.
  premature_closure_check: >-
    The temptation in a task like this is to declare the SafeCurves audit of a NIST curve
    exhaustively studied and therefore not worth instrumenting. That would be a
    hypothesis about the search, not a theorem about the problem (KN-LIT-7594,
    KN-TECH-056), and it is not asserted. What IS asserted is the weaker and honest
    claim in dominated_by: this work is dominated as an audit instrument and claims no
    novelty.
  open_directions_for_next_session:
  - >-
    Close L0. Everything evidential about the eleven cells depends on it, and the block
    is purely a reachability problem, not a research problem.
  - >-
    Close OPEN-1 in ninety seconds of arithmetic (lane L-EQ). It is the highest
    information-per-second item in the whole campaign.
  - >-
    The one place in this plan with a genuine open QUESTION rather than a lookup is
    L-TWIST's null comparison: is P-224's twist order unusually smooth for a curve of its
    shape, or typical? Both readings are preregistered and they mean different things -
    the first would be a structural observation about this curve, the second would mean
    the twist cell reflects the absence of a design requirement rather than an anomaly.
    That is the only lane in the plan whose outcome is not already strongly expected.
  - >-
    H3 (small-to-large scale transfer) is the weakest link in the plan and is the natural
    target for a cheap dedicated measurement: run the three-field-size drift study on its
    own and publish the empirical extrapolation error bar, which several later lanes would
    then be able to cite instead of assuming.

