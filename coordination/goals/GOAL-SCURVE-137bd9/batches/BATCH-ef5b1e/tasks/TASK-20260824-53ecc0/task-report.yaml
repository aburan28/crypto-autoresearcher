    (b) the primary parameter clauses FIPS 186-4 Appendix D.1.2.2, NIST SP 800-186
    Section 3.2.1 and SEC 2 Section 2.5, closing OPEN-2; (c) the FIPS 186 / ANSI X9.62
    pseudorandom curve generation procedure and its acceptance relation, unblocking
    L-RIGID part (a) and D8; (d) the Elligator paper's stated preconditions, unblocking
    L-IND's interpretation step.
  environment_requirement: >-
    Either a session whose egress can reach cr.yp.to (this one could not: HTTP 502 on all
    six attempts) or a container with poppler-utils installed so that the already-fetched
    NIST and SECG PDFs can be rendered and read locally.
  constraint: >-
    Recalled stays recalled. A source that cannot be fetched is recorded as unretrieved,
    never paraphrased into the record.
- id: S2
  title: Run the cheap certified lanes
  role_suggested: executor
  objective: >-
    Execute L-EQ, L-FIELD, L-BASE and then the near-free block (L-LADDER, L-COMPLETE,
    L-IND, D3, D6) with their controls, emitting one certificate per lane. Measurement
    only; every comparison against an intake cell stays gated on L0.
  estimated_budget: {wall_clock_seconds: 1500, memory_gb: 2}
  precondition: Coordinator approval and a frozen experiment contract; this plan is not one.
- id: S3
  title: Run the embedding-degree lane by specialising the existing internal record
  role_suggested: executor
  objective: >-
    Execute L-TRANSFER as a single-curve specialisation of IDEA-20260807-98a970,
    including that record's mandatory planted-positive gate and its K-decay check.
  nonduplication_note: >-
    No new mechanism proposal is to be minted for this; the RQ's nonduplication_rule
    binds here.
- id: S4
  title: The two factoring lanes, budgeted to degrade gracefully
  role_suggested: executor
  objective: Execute L-DISC/D5 and L-TWIST/D1/D2 with the stated bounds and partial-result contract.
  warning: >-
    A budget stop is an operational observation. A partial factorisation with a labelled
    unfactored cofactor is the correct deliverable, and the largest FOUND prime factor
    must never be reported as if it were the largest prime factor.
- id: S5
  title: The null-distribution study
  role_suggested: executor
  objective: >-
    Instantiate NULL-RANDB at three small field sizes (about 32, 44 and 56 bits, N = 10^3
    each), measure twist smoothness and conductor distributions against H1 and H2, and
    produce the H3 drift error bar that later lanes need.
  why_separable: >-
    It is the only compute in the plan that is a genuine measurement of a distribution
    rather than a certificate of a fact, and it blocks nothing else.

