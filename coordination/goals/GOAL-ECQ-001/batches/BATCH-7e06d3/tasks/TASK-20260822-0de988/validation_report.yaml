  proof_architecture_checks:
  - check: baseline fixture reproduces exactly
    result: pass
    detail: >-
      The proof_search_map names the Alpoge-Howell rank-30 curve as its frozen
      baseline fixture. My harness returns exactly 30 on it, with a least
      eigenvalue matching the recorded 0.294. The determinant matches to 17
