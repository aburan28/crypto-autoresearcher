  - check: no claim under review reaches rank >= 31 over Q (routing rule)
    result: pass
    detail: >-
      Maximum over everything I verified: 12 (over-Q pipeline, t = -65/22) and 13
      (Mestre pool, 2 curves). Nothing at or above 31, so this round correctly
