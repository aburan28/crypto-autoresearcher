  # =====================================================================
  # 5. PROVES-TOO-MUCH CONTROL SET
  # =====================================================================
  control_checks:
  - control: rank-30 Alpoge-Howell fixture, harness must return EXACTLY 30
    input: experiments/EXP-ECRANK-e1e30e/runs/RUN-ECRANK-e1e30e-003/record_curve_input.json
    expected: 30
    my_harness_returned: 30
    result: pass
    detail: >-
      30 points supplied, all 30 on the curve in exact Fractions and by PARI
      ellisoncurve. My eigenvalue count is 30 at BOTH 38 and 115 digits; my greedy
      Gram-Schmidt subset is 30. Least eigenvalue 0.2940657535759725168805...,
      no rejected eigenvalue at all. Not 29, not 31, not 24.
  - control: the producer's REPLACED independence criterion
    result: pass, and I formed my own view as instructed
    detail: >-
      The producer's first criterion was relative (det / prod(diag)) and returned
      24 on this fixture; it was replaced, before any family number was produced,
      by an incremental one -- accept a point iff it multiplies the Gram
      determinant by more than tol = 1e-6. MY VIEW: the replacement is sound and
      the diagnosis of the original is correct. det/prod(diag) is the squared
      Hadamard ratio, which decays geometrically in the dimension for ANY matrix
      that is not near-diagonal, so a fixed threshold on it necessarily
      under-counts as r grows -- exactly the 30 -> 24 failure observed, and a
      failure that gets WORSE at higher rank, i.e. in the direction of the claim.
      The incremental quantity det(G_{k+1})/det(G_k) is the squared distance from
      the new height vector to the span of the accepted ones: an absolute,
      dimension-free quantity. That is the right shape of test. I did not read
      src/, so I am judging the criterion as described in report.md, not the code
      that implements it; I built my own version of the same idea independently
      and it returns 30 here and reproduces every rank in section 3.
      RESIDUAL CONCERN, RECORDED: tol = 1e-6 is absolute and is only two to three
      orders of magnitude below the smallest genuine eigenvalues seen in this
      package (0.29 on the fixture, 0.346 on the best curve). My own threshold is
      1e-20 at 38 digits and 1e-60 at 115, and the observed gap between accepted
      and rejected is ~115 orders of magnitude, so the split is not close in any
      case I checked. The producer's margin is comfortable but is thinner than the
      evidence allows, and nothing in the package would detect a genuine
      eigenvalue below 1e-6 if one ever occurred.
  - control: known rank-1 curve, a-invariants [0,0,1,-1,0] (conductor 37)
    expected: 1
    my_harness_returned: 1
    result: pass
    detail: >-
      18 points from ellratpoints(50), all on curve; rank 1 at both precisions.
      Smallest accepted eigenvalue 29.13, largest rejected 2.77e-115 -- a split of
      116 orders of magnitude. The 17 dependent points are correctly absorbed.
  - control: configuration whose exhibited point set is EMPTY
    expected: 0
    my_harness_returned: 0
    result: pass
    detail: run on the best over-Q curve itself, so the 0 comes from the empty
      support and not from a weak curve.
  - control: configuration whose exhibited point is TORSION
    expected: 0
    my_harness_returned: 0
    result: pass
    detail: >-
      Two forms. (i) y^2 = x^3 - x with all three 2-torsion points (x,0): Gram
      matrix identically 0, rank 0. (ii) the 2-torsion point (0,0) on
      y^2 = x^3 - 2x, which is a POSITIVE-rank curve, so the 0 cannot be an
      artefact of the curve having no rank: still 0. A torsion point has canonical
      height 0 and cannot inflate a rank in my harness.
  - control: linearly DEPENDENT non-torsion points (mine, added beyond the plan)
    expected: 1
    my_harness_returned: 1
    result: pass
    detail: >-
      A dependent set on the conductor-37 curve returns 1, not 3. Added because
      the plan's controls test torsion and emptiness but not the dependence
      failure mode that the 30 -> 24 incident was actually about.
  proves_too_much_conclusion: >-
    My harness returns the known value on every object for which the answer is
    known, and in particular NEVER MORE. The plan's failure signature -- a harness
    reporting more than 30 on the record curve or more than 1 on the rank-1 curve
    -- does not occur, so the numbers I report in sections 2 and 3 are not the
    scorer measuring itself.

