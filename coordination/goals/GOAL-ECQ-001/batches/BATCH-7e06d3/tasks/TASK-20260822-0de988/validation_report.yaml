  - check: quantifier fidelity
    result: pass
    detail: >-
      H-ECQ-cec3c4 states "EXISTS 8 rational points such that FOR ALL
      specialisations outside a finite bad set the sections stay independent, and
      EXISTS t0 among those searched whose certified rank is >= 11", and claims
