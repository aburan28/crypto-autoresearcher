      ellrank_effort_2: "[12, 12, 0, L'] with #L' = 12, and L' is a DIFFERENT point set from L"
      my_certification_of_L:  {rank: 12, all_on_curve_exact: true, det_115: 472515331001.063,   least_eigenvalue: 1.1768}
      my_certification_of_Lp: {rank: 12, all_on_curve_exact: true, det_115: 12165487308036.973, least_eigenvalue: 0.8366}
      producer_value: 12
