  # =====================================================================
  # 2. JOINT 1 -- are the 8 sections genuinely independent?
  # =====================================================================
  joint_verdicts:
  - joint: 1
    statement: >-
      The 8 sections are genuinely independent, i.e. the 8 base points were in
      general position and the surface really has rank 8 over Q(t); the 9th base
      point was computed and verified, not assumed; the pencil is not degenerate.
    verdict: holds
    strength: strong -- the claim survives the plan's attack and an upper-bound
      cross-check the plan did not ask for
    what_i_recomputed_myself:
    - id: J1-a
      item: general-position audit, exact
      result: >-
        Recomputed from the 8 points in qt_family.json with my own exact
        Fraction linear algebra. No 3 of the 8 collinear (all 56 triples,
        3x3 determinants), no 6 on a conic (all 28 sextuples, rank of the 6x6
        conic matrix = 6 in every case), all 8 distinct. Matches the producer's
        audit exactly.
    - id: J1-b
      item: the pencil is a genuine pencil
      result: >-
        The 8x10 exact system of cubics through the 8 points has rank 8, kernel
        dimension 2. The stated C1 and C2 both vanish at all 8 points and are
        linearly independent. So C_t = C1 + t*C2 is the full space, not a
        sub-family.
    - id: J1-c
      item: 9th base point COMPUTED, not assumed
      result: >-
        (197684347 : -60668562 : -45807609) substituted exactly into C1 and C2
        gives 0 and 0. It is distinct from all 8. Independently, I formed the
        Sylvester resultant Res_y(C1, C2) with my own polynomial arithmetic: it
        has degree exactly 9 in x, the product of (x - x_i) over the NINE base
        points divides it exactly (remainder 0, cofactor degree 0), and the nine
        x-coordinates are distinct. The base locus is exactly those nine points,
        so nothing was assumed and nothing is missing.
    - id: J1-d
      item: the pencil is not degenerate
      result: >-
        deg c4 = 4, deg c6 = 6, deg disc = 12 as claimed. The discriminant
        polynomial is SQUAREFREE (gcd(D, D') has degree 0), so all 12 singular
        fibres are I_1 and therefore irreducible; the surface is not isotrivial
        (c4^3 is not proportional to the discriminant). Squarefree disc of degree
        12 plus Shioda-Tate forces the geometric Mordell-Weil rank to be EXACTLY
        8 = 8 - sum(m_v - 1) with every m_v = 1. So 8 is simultaneously the
        producer's floor and the construction's ceiling, exactly as H-ECQ-cec3c4
        states, and it is now measured rather than asserted.
    - id: J1-e
      item: the 8 sections satisfy the family identically over Q(t)
      result: >-
        For each of the 8 sections I checked Y(t)^2 - X(t)^3 + 27*c4(t)*X(t) +
        54*c6(t) == 0 as an identity of polynomials over Q, with exact rational
        arithmetic. All 8 vanish identically. These are sections, not near-misses.
    - id: J1-f
      item: THE PLAN'S ACTUAL ATTACK -- regulators at specialisations OF MY OWN CHOOSING
      result: >-
        I picked ten t values the producer never tested, specialised the family
        and the sections myself, verified every specialised point on the
        specialised curve in exact Fractions, and computed the 8x8 Neron-Tate
        height-pairing matrix at 38 AND 115 decimal digits with eigenvalues from
        qfjacobi at the same precision. NINE OF TEN GIVE FULL RANK 8 with healthy,
        well-separated spectra:
          t = -2      rank 8   det 1.058457e6     least eigenvalue 1.533
          t = 6       rank 8   det 1.057535e7     least eigenvalue 2.394
          t = -11     rank 8   det 9.285476e5     least eigenvalue 1.303
          t = -3/7    rank 8   det 2.517495e6     least eigenvalue 1.765
          t = 13/9    rank 8   det 2.970704e6     least eigenvalue 2.105
          t = 101/3   rank 8   det 1.206298e8     least eigenvalue 4.881
          t = 1000/7  rank 8   det 1.031914e9     least eigenvalue 5.741
          t = 17/13   rank 8   det 3.505872e6     least eigenvalue 1.665
          t = -23/5   rank 8   det 8.728105e6     least eigenvalue 2.262
          t = 4       rank 6   (see J1-h)
        The plan's breaking artifact was "a singular or near-singular 8x8
        regulator at MULTIPLE independent specialisations". Nine independent
        validator-chosen t give a nonsingular regulator with least eigenvalue
        between 1.3 and 5.7 -- three to four orders of magnitude above anything a
        tolerance argument could reach, at two precisions. A dependent section set
        cannot do this. Joint 1 does not break.
    - id: J1-g
      item: the producer's own nine specialisations, recomputed independently
      result: >-
        I re-derived each of the producer's nine curves from the c4/c6 family
        myself and confirmed each of their reported a-invariants is a genuine
        (u^4, u^6) rescaling of mine -- i.e. the curve they scored IS the
        specialisation they say it is. My rank agrees with theirs at all nine t:
        8 at t in {-1, -7, 7/5, 11/3, 3} and 4, 7, 7, 7 at t in {1, 2, 1/2, 5}.
        My determinants agree with theirs to ~17 significant digits (see the
        precision finding below).
    - id: J1-h
      item: >-
        THE RANK DROPS ARE REAL -- checked against an upper bound, which the plan
        did not require and which is the only way to tell a genuine exceptional
        fibre from a tolerance artefact
      result: >-
        A zero eigenvalue is evidence of dependence only if the ambient curve
        cannot support 8 independent points. I therefore ran PARI's ellrank (an
        implementation the producer did not write) on the drop fibres:
          t = 1     ellrank [4, 4]  -- curve rank is EXACTLY 4, so 8 sections CANNOT be independent
          t = 2     ellrank [7, 7]  -- EXACTLY 7
          t = 5     ellrank [7, 7]  -- EXACTLY 7
          t = -1    ellrank [8, 8]  -- EXACTLY 8, consistent with full-rank sections
          t = 3     ellrank [8, 8]  -- EXACTLY 8
          t = 1/2   ellrank [8, 8]  -- curve rank 8 while the SECTION IMAGES span only 7
        The first three are decisive: the drop is forced by an unconditional upper
        bound on the fibre, not by numerics. t = 1/2 is the subtler and more
        interesting case: the fibre has rank 8 but the specialisation map is not
        injective there, so the producer's wording ("genuine exceptional
        specialisations") is right while "rank drops" would be wrong if read as a
        statement about the fibre. I also confirmed the zero eigenvalues are zero
        to working precision, not merely small: at t = 1 the four smallest
        eigenvalues at 115 digits are -7.34e-115, -4.80e-115, -2.23e-115,
        4.15e-115 against nonzero eigenvalues 2.23, 4.61, 11.11, 23.82.
        NEW DATUM THE PRODUCER DOES NOT REPORT: at t = 4 -- my choice, untested by
        them -- the sections span only rank 6, and ellrank returns [6, 6], so the
        fibre itself has rank exactly 6. This is a FIFTH exceptional value. It is
        not a defect (they tested nine t and reported all nine honestly), but the
        report's table should not be read as enumerating the exceptional set.
    artifacts_supporting:
    - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/qt_family.json
      (sha256 464619426bf4a97604c37e8b5d4e7e9c6be5990bf7d0621783992398453f919b)
    - my recomputation scripts and outputs, listed under artifact_paths

  # =====================================================================
  # 3. JOINT 2 -- is every rank backed by that many exhibited independent points?
  # =====================================================================
  - joint: 2
    statement: >-
      Every rank reported over Q is backed by that many exhibited independent
      points ON THAT EXACT CURVE -- not an analytic rank, not a Selmer bound, not
      an ellrank r_high, not a rank inherited from the generic fibre by
      Silverman specialisation.
    verdict: holds
    strength: strong -- exhaustive on (a), and on (b) exhaustive at the ranks that
      carry the claim
    part_a_over_Q_pipeline:
      scope: ALL 137 certified fibres in certified_curves.json, none sampled
      what_i_recomputed_myself:
      - Every one of the exhibited points (8 sections plus descent points, up to
        20 per curve) re-verified ON THAT CURVE in exact Python Fractions by my
        own code, and cross-checked with PARI ellisoncurve. 137/137 curves,
        0 points off curve. Every discriminant nonzero.
      - For every curve, the r x r height-pairing matrix on the producer's OWN
        declared independent_point_indices, recomputed at 38 and 115 digits with
        my own eigenvalue count and my own greedy Gram-Schmidt subset selection.
        My rank equals the claimed rank on all 137 -- (8,8) x93, (9,9) x14,
        (10,10) x17, (11,11) x12, (12,12) x1. No curve where my rank is below the
        claim; none where it is above either, so the claims are also not
        understated.
      - >-
        Structural checks: claimed rank == number of independent indices on all
        137; no index out of range; no curve claims more than it exhibits.
      - >-
        THE SILVERMAN-INHERITANCE ATTACK, which is the one the plan singles out:
        for each of the 137 curves I recomputed the specialisation of all eight
        Q(t) sections at that t, recovered the scaling u from the a-invariants,
        and checked the producer's first eight exhibited points ARE those
        specialised sections, exactly. True on 137/137. Combined with the
        preceding item, the rank-8 floor is re-certified on the specialised curve
        by exhibited points every time; it is never inherited. certified_curves.json
        also states this in its own not_claimed list, and the artifact backs the
        statement.
      - >-
        THE POINT-FREE-BOUND ATTACK: 83 of the 137 curves have descent_status
        "timeout" and n_descent_points = 0. Every one of those 83 claims rank
        EXACTLY 8 -- the section floor -- and not one point more. Of the 54 with
        descent points, ranks are 8 x10, 9 x14, 10 x17, 11 x12, 12 x1. No curve
        anywhere claims a rank above the ellrank r_high recorded beside it, and
        no curve turns a bound into a rank. The GOAL-ECRANK-001 failure mode
        (ellrank returning [1,1,0,[]] -- a proven bound with NO point) does not
        occur here: the field is named ellrank_bounds_NOT_A_CLAIM and it is in
        fact not a claim anywhere in the file.
      best_curve_independently_confirmed:
        t: -65/22
        a_invariants: [0, 0, 0, -518228207838672723, 141005837549331272675978478]
        exhibited: 20 points, 12 declared independent
        my_certified_rank: 12
        my_12x12_regulator_at_115_digits: 5833522604.9513962075901839955742636927
        my_least_eigenvalue: 0.3462478885838063
        producer_reported: 5833522604.9513962265934478696931388274 (38 digits)
        agreement: 17 significant digits (see precision finding PF-1)
    part_b_mestre_producer:
      scope: >-
        156 of the 1,206 pool curves: ALL 2 at rank 13, ALL 29 at rank 12, and 25
        drawn at each of ranks 7, 8, 9, 10, 11 with a recorded seed (20260822).
        The rank-13 and rank-12 claims -- the ones that carry claim (b) -- are
        checked exhaustively; the lower ranks are sampled and I say so.
      commissioning_goal_named: >-
        GOAL-ECRANK-002 (paused by DEC-20260822-d9bf63); these artifacts are an
        INPUT carried into GOAL-ECQ-001, not this batch's production, and keep
        their BATCH-e0caa5 path.
      results:
      - >-
        Every point of every checked curve lies on that curve in exact Fractions:
        0 failures.
      - >-
        My independent r x r regulator reproduces the claimed rank on all 156
        checked curves. Maximum certified rank I could reproduce: 13, on both
        rank-13 curves, matching max_certified_rank in highrank_pool.json.
      - No checked curve claims a rank it cannot exhibit; no claim reaches 31.
      - The pool's claim_kind states in terms "no analytic rank, no ellrank
        r_high, no point-free bound is included anywhere" and the artifact is
        consistent with that on everything I checked.
      limitation_stated_plainly: >-
        1,050 of the 1,206 pool curves (ranks 7-11) were NOT individually
        re-certified by me. My verdict on part (b) is therefore: the rank-13
        headline and the entire rank-12 tier are independently confirmed; the
        lower tiers are confirmed on a seeded sample of 25 each with zero
        failures. That is a sampling statement, not an exhaustive one.
    artifacts_supporting:
    - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/certified_curves.json
      (sha256 a342ff9c7c93424e1f6dbb886bd70dba85c2ce754ba54ec4f0bf06cc83d15aee)
    - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8/highrank_pool.json
      (sha256 3d8620ea993436880fc4a70d4028cc92c087481fd6c2c46b391f2d667f5e1a24)
    - git show 78584ab8:.../RUN-a7a9e8-004-augment-full/raw-result.json  (see BC1)

  # =====================================================================
  # 4. BINDING CONDITION BC1 (and what BC2/BC3/BC4 look like from here)
  # =====================================================================
  binding_condition_checks:
  - id: BC1
    obligation: >-
      Verification of a rank claim resting on RUN-a7a9e8-004 or RUN-a7a9e8-007
      raw output must be performed against the UNTRIMMED originals recovered from
      history, never against the trimmed files in the working tree.
    verdict: DISCHARGED for RUN-004; NOT DISCHARGEABLE AS WRITTEN for RUN-007, and
      it does not need to be -- see below
    run_004:
      commit_78584ab8_reachable: true
      detail: >-
        git cat-file confirms 78584ab8 is a commit and git merge-base
        --is-ancestor confirms it is an ancestor of HEAD. The untrimmed
        raw-result.json is present there at 35,039,973 bytes.
      recovered_bytes: 35039973
      recorded__original_bytes: 35039973
      bytes_match: true
      recovered_record_count: 34740
      recorded__original_record_count: 34740
      record_count_match: true
      recovered_sha256: 7855699d259275644b4d8ed56e6636c8cae6f838b88357287b1d1daaab8eb560
      note_for_BC2: >-
        That sha256 is the content hash BC2 asks the ledger archive to record. I
        computed it from the recovered blob; recording it is the archive's act,
        not mine.
      retained_300_is_an_exact_prefix_of_the_untrimmed_results: true
      aggregates_verbatim: >-
        source, nmax, dmax and wall_clock_s are byte-identical between the trimmed
        and untrimmed files. The trim truncated the results list and added nothing
        else; it did not strip fields, reorder, or alter an aggregate.
      BC3_triggered: false
      why_this_check_was_not_ceremonial: >-
        BOTH rank-13 curves are ABSENT from the retained first 300 records and
        PRESENT in the untrimmed file. Verifying the rank-13 claim against the
        working-tree file was therefore literally impossible; BC1 is the reason
        this check could be done at all.
      cross_check_against_untrimmed:
      - curve_id: m10+extra#-20_-16_-14_-13_-7_-6_2_3_14_19
        found_in_untrimmed_RUN004: true
        found_in_trimmed_first_300: false
        untrimmed_base_rank: 9
        untrimmed_n_extra_found: 6
        untrimmed_extra_u: ["5/1", "-199/5", "-337/7", "-109/7", "138/7", "-101/11"]
        matches_pool_extra_quartic_u: true
      - curve_id: m10+extra#-12_5_6_7_9_10_11_13_14_17
        found_in_untrimmed_RUN004: true
        found_in_trimmed_first_300: false
        untrimmed_base_rank: 9
        untrimmed_n_extra_found: 5
        untrimmed_extra_u: ["-112/1", "-28/1", "70/3", "-35/11", "256/11"]
        matches_pool_extra_quartic_u: true
      what_this_establishes: >-
        The two rank-13 curves in highrank_pool.json correspond to trials actually
        performed in the untrimmed RUN-004, with the same parameter vector, the
        same base rank 9, and the same set of extra quartic parameters u. The
        untrimmed records additionally carry augmented_rank / augmented_det /
        augmented_curve, which the trimmed prefix records do not. Independently of
        all that, I re-certified rank 13 on both curves from the a-invariants and
        points, so the claim does not rest on the run record's own arithmetic.
    run_007:
      finding: >-
        THERE IS NO UNTRIMMED RUN-007 raw-result.json ANYWHERE IN HISTORY. The
        path has exactly two committed versions: 58 bytes at e278a344 (the WIP
        stub, plain text) and 289 bytes at 1e9452fd, which is byte-identical to the
        working-tree file. The working-tree file contains NO _trim_note, NO
        _original_bytes and NO _original_record_count.
      consequence_1: >-
        DEVIATION-immutability-trim.md states RUN-007's raw-result received "the
        same treatment" as RUN-004 and that "every other run" was committed
        untrimmed before the trim. Neither is supported by the artifact for
        RUN-007: there is no pre-trim version, and the post-trim file carries none
        of the trim bookkeeping the note credits it with. Report this as a defect
        in the deviation note, not as evidence of tampering -- the file is a
        four-number verification summary and there is nothing in it to hide.
      consequence_2: >-
        Its manifest.yaml asserts "raw_result_trimmed_for_storage: see _trim_note
        in raw-result.json" and raw-result.json has no _trim_note. That is an
        internally inconsistent record and, per BC4, a defect to REPORT rather than
        reconcile. I have not touched it.
      BC3_assessment: >-
        NOT TRIGGERED. BC3's pre-declared trigger is 78584ab8 unreachable OR
        recovered content disagreeing with a recorded _original_bytes /
        _original_record_count. 78584ab8 is reachable and RUN-004 agrees exactly.
        For RUN-007 there is no recorded _original_* value for anything to
        disagree with, so the trigger as written does not fire. I am reporting
        this rather than construing the trigger, because BC3 says explicitly that
        it is a pre-declared trigger and not a criterion to be revisited after
        seeing the outcome -- which cuts both ways.
      why_no_claim_is_at_risk: >-
        RUN-007's raw output is {curves: 1206, points_checked: 11499, failures: 0,
        verdict: PASS}. It carries no rank certificate. The rank-13 claim rests on
        highrank_pool.json (a hashed, declared snapshot path) and on RUN-004, both
        of which I verified. My own re-certification of 156 pool curves is a
        strictly stronger check than RUN-007 performed, and it is independent of it.
  - id: BC4
    obligation: the seven trimmed manifests are archived as overwritten records;
      any discrepancy beyond the single appended key is a defect to report
    verdict: satisfied, with two factual corrections to the surrounding notes
    detail: >-
