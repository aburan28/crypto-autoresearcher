  # =====================================================================
  # 7. METRIC RECOMPUTATIONS AND A PRECISION FINDING
  # =====================================================================
  metric_recomputations:
  - metric: 8x8 Neron-Tate regulator at the producer's five nonsingular t
    producer: [1019096.0496458863642178 (t=-1), 3184383.1949423770424494 (t=-7),
      2499514.0527064824909733 (t=7/5), 9151811.9638615550600239 (t=11/3),
      1010027.3568478395566152 (t=3)]
    mine_at_115_digits: [1019096.0496458863636398, 3184383.1949423770429677,
      2499514.0527064824907316, 9151811.9638615550712829, 1010027.3568478395568351]
    agreement: rank identical (8 everywhere); determinants agree to ~17 significant digits
  - metric: r x r regulator at the producer's four exceptional t
    finding: >-
      MISLABELLED FIELD. At t in {1, 2, 1/2, 5} the value stored under
      "regulator_det_8x8" is NOT the 8x8 determinant -- I measure that determinant
      to be zero to 113 digits -- it is the determinant of the r x r submatrix on
      the declared independent_indices. I recomputed those submatrix determinants
      and they match: 1.9789060284963339980 vs 1.9789060284963340212 (t=1),
      114827.00374834295892 vs 114827.00374834295915 (t=2), 22381.336433958323203
      vs 22381.336433958323237 (t=1/2), 14713.072270161947941 vs
      14713.072270161948004 (t=5). The numbers are right; the field name is wrong,
      and a reader who takes it at face value would conclude the 8x8 regulator is
      nonsingular at a fibre where it is exactly singular.
  - metric: 12x12 regulator of the best over-Q curve
    producer: 5833522604.9513962265934478696931388274 (38 digits)
    mine: 5833522604.9513962075901839955742636927 (115 digits)
    rank_agreement: 12 = 12
    least_eigenvalue: 0.3462478885838063 -- identical to the producer's
  - metric: 30x30 regulator of the rank-30 fixture
    producer: 1.0720686604115654970290884760953064158e37
    mine: 1.0720686604115654188358042985326663938e37
    rank_agreement: 30 = 30
  precision_findings:
  - id: PF-1
    severity: methodological; changes NO rank in this package
    finding: >-
      Every regulator determinant I recomputed agrees with the producer's to about
      17 significant digits and then diverges -- on the rank-30 fixture, on the
      12x12 best curve, on all five nonsingular specialisations, and on all four
      exceptional ones. The pattern is uniform, which makes it systematic rather
      than incidental.
    my_computation_is_internally_stable: >-
      My 38-digit and 115-digit determinants, each computed from a height matrix
      REBUILT at that precision, agree with each other to ~33-34 digits
      (e.g. fixture: ...654188358042985326664045 vs ...654188358042985326663938).
    the_producer_s_is_internally_stable_too: >-
      Their 38-digit and 77-digit values agree to ~35 digits. Two internally
      stable computations that disagree at digit 17 are not both measuring the
      same matrix at the stated precision.
    hypothesis_i_tested_and_did_not_confirm: >-
      I rounded my 115-digit height matrix entrywise through IEEE double and
      recomputed the determinant at 115 digits: 1.07206866041155723715...e37,
      which agrees with the true value to only 15 digits and does NOT reproduce
      the producer's 1.07206866041156549702...e37. So a simple float64 round-trip
      of the final matrix is NOT the mechanism. I do not know what is, and I am
      not going to guess -- diagnosing it requires reading src/, which I am
      forbidden to do.
    corroborating_observation: >-
      The reported least_eigenvalue values are IEEE doubles and are byte-identical
      at "38" and "77" (e.g. 0.29406575357597253 twice, 0.09377026388685054 twice).
      A quantity stored as a double is identical at any two precisions by
      construction, so for that field the report's "computed at 38 and 77 digits
      and required to agree" test is VACUOUS -- it cannot fail. The determinants
      are stored as full-precision strings and are not vacuous in the same way,
      but their 38-vs-77 agreement to 35 digits is what one would see if a matrix
      fixed once at some working precision were passed to the determinant routine
      twice, in which case that check tests the determinant routine and not the
      height computation.
    what_this_does_and_does_not_affect: >-
      DOES NOT AFFECT: any rank in this package. Ranks are integers read off an
      eigenvalue split of ~115 orders of magnitude; a 17th-digit discrepancy
      cannot move one, and I reproduced all 137 + 156 + 9 of them independently.
      DOES AFFECT: the number of digits any downstream record may quote for a
      regulator determinant, and the weight the phrase "computed at 38 and 77
      digits and required to agree" can bear. An evidence record should quote
      these determinants to no more than ~16 significant digits, or re-derive them.

  # =====================================================================
  # 8. OTHER DEFECTS FOUND (reported, not repaired)
  # =====================================================================
  defects_reported_not_repaired:
  - id: D-DISC-LABEL
    where: qt_family.json -> weierstrass_family_over_Qt.discriminant
    finding: >-
      The stated model is y^2 = x^3 - 27*c4(t)*x - 54*c6(t), whose discriminant is
      1259712*(c4^3 - c6^2). The polynomial stored under "discriminant" is
      (c4^3 - c6^2)/1728 -- I verified the ratio is exactly 1728 on every one of
      the 13 coefficients. That is the discriminant of the curve with INVARIANTS
      (c4, c6), i.e. the stated model rescaled by u = 6, and it differs from the
      stated model's discriminant by the constant factor 6^12 = 2176782336.
    impact: >-
      None on the mathematics: degree 12, squarefreeness and the Shioda-Tate
      argument are all invariant under a nonzero constant factor, and I verified
      squarefreeness on the stored polynomial. It is a labelling error that would
      mislead a reader who used the field to check the model.
  - id: D-REGDET-LABEL
    where: qt_family.json -> regulators_at_specialisations[*].regulator_det_8x8
    finding: at the four exceptional t this field holds the r x r sub-determinant,
      not the 8x8 determinant, which is zero there. See metric_recomputations.
  - id: D-RUN007
    where: RUN-a7a9e8-007 manifest.yaml and raw-result.json, and DEVIATION-immutability-trim.md
    finding: >-
      manifest points at a _trim_note that does not exist; no untrimmed original
      exists in history; the deviation note describes a trim of this run that the
      artifacts do not evidence. Reported under BC1/BC4 above.
  - id: D-RUNCOUNT
    where: the archive receipt and the deviation note ("all seven runs", "runs 001-007")
    finding: eight run directories exist; RUN-008-upper-crosscheck is untouched by
      the trim. Reported under BC4 above.

  # =====================================================================
  # 9. SCOPE, LIMITATIONS, AND WHAT THIS REPORT DOES NOT SAY
  # =====================================================================
  limitations:
  - I own joints 1 and 2 only. Joints 3 (Mestre-Nagao used for ordering only) and
    4 (two-axis gap framing) belong to the red-team task and I did not review
    them, did not read its report, and express no view on them. A whole-claim
    verdict from me would be an opinion built from half the evidence.
  - 1,050 of the 1,206 Mestre pool curves (ranks 7-11) were not individually
    re-certified; the rank-13 and rank-12 tiers were checked exhaustively and the
    rest on a seeded sample of 25 per rank.
  - I did not audit the sieve accounting, the matched-arm MN-vs-random comparison,
    the timeout confound, or the gap analysis. Those are joints 3 and 4.
  - The rank-8 ceiling of the construction is established by Shioda-Tate from a
    measured squarefree degree-12 discriminant. That is a statement about THIS
    pencil, from THESE 8 base points, and does not bound any other construction.
  - >-
    Everything here is scoped to the tested objects: 137 specialisations of one
    rational elliptic surface with |p| <= 2000, q <= 40; 156 curves of one
    1,206-curve Mestre pool; PARI/GP 2.15.4 under python 3.11; no Sage. Certified
    ranks are LOWER BOUNDS from exhibited points, except where I explicitly cite
    ellrank's r_high, which is an unconditional upper bound.
  - This report validates evidence admissibility. It supports no ECDLP claim,
    demonstrates no speedup, moves no hypothesis status, and authorizes no
    promotion. A passed verdict means the receipt may be used as evidence, and
    nothing further.
  - PF-1 is an unexplained systematic discrepancy. I established it, bounded its
    consequences and falsified my own first hypothesis for its cause; I did not
    find the cause, because doing so requires reading src/, which the blind
    re-derivation forbids. Naming it is the honest stopping point.

  heuristic_validation_checks:
  - status: not_applicable_as_a_distribution_validation
    detail: >-
      H-ECQ-cec3c4 carries one heuristic, HEUR-1 (the Mestre-Nagao sum orders
      specialisations by likely rank well enough to be worth certifying). It is
      declared ordering-only and is explicitly excluded from every certified
      rank. Auditing whether the ordering earns its keep -- the matched MN-arm
      versus random-arm comparison and the timeout confound -- is joint 3, which
      is not mine. What I can and do confirm from my own joint: HEUR-1 contributes
      nothing to any rank I verified, because every rank is reproduced from
      exhibited points with no reference to any score.
  - check: null-object control for a reported statistical signal (inventor protocol section 3)
    status: satisfied within my joints, and I note where it is not mine to judge
    detail: >-
      The load-bearing quantities in my joints are ranks and regulators, not
      correlations, and each was measured against objects whose value is known
      (rank-30 fixture, rank-1 curve, empty support, torsion support, dependent
      support). The one genuinely statistical claim in the package -- the MN arm's
      46.7%/40.0%/20.0% hit rates versus the random control's 26.7%/10.0%/0% -- IS
      accompanied by a same-shape null object (a random control arm of the same
      size drawn from the same 1,548-specialisation sub-domain with a recorded
      seed) and the producer records the timeout confound (31 vs 35) rather than
      hiding it. Whether that control is sufficient is joint 3's question.

  cost_model_checks:
  - status: not_applicable
    detail: >-
      No asymptotic-complexity claim and no concrete-cost table is made
      (hypothesis field asymptotic_claim is explicitly null). The cost numbers in
      the package are measured wall-clock and per-specialisation timings with
      declared units (1.028 ms per specialisation over 97,640; 1,993.0 s total
      across seven runs; 1.22 GB peak RSS), and memory is reported alongside time.
      Scaled-instance and cheat-classification checks under inventor-protocol
      section 6 do not bind here because no improvement at an unreachable scale is
      claimed -- the deliverable is an explicit measurement of a SHORTFALL (12 vs
