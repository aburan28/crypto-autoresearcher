  # =====================================================================
  # 0. CONTRACT INTEGRITY -- read this before the verdicts
  # =====================================================================
  contract_integrity_findings:
  - id: CI-1
    severity: blocking for the ROUND's independence audit, not for the joints below
    finding: >-
      IDENTIFIER REUSE. My task card dispatches TASK-20260822-0de988 against
      GOAL-ECQ-001 / BATCH-7e06d3. The committed handoff of that identifier,
      ledger/handoffs/TASK-20260822-0de988.yaml (introduced at commit f5fb41f5),
      is a DIFFERENT task: goal GOAL-ECRANK-002, batch BATCH-e0caa5, write_scope
      coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-0de988,
      with a review_plan about a Mestre construction and a k=3 twist-family
      optimum. One identifier now names two tasks in two goals. AGENTS.md rule 14
      forbids this; rule 15 says the remedy is a superseding record, not a rename,
      because completed archives bind these strings.
    evidence:
    - ledger/handoffs/TASK-20260822-0de988.yaml   (GOAL-ECRANK-002 / BATCH-e0caa5)
    - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/dispatch_queue.json
    consequence: >-
      tools/check_review_independence.py reads the review_plan from the ledger
      handoff. Run today it would compose my report against the BATCH-e0caa5 plan,
      whose joints I did not work, and would report an unowned joint and an
      unattested reviewer for this batch. The Coordinator must reconcile this
      before composing the round.
  - id: CI-2
    severity: blocking for the round's independence audit
    finding: >-
      The committed dispatch queue for BATCH-7e06d3 names the validator task of
      this batch as TASK-20260822-0a0041, deliverable
      .../tasks/TASK-20260822-0a0041/validation_report.yaml, archived_by
      TASK-20260822-2fa82a. Its review_plan joints 1 and 2 are, word for word in
      substance, the joints my task card assigned me, and its proves_too_much and
      blind_rederivation are also assigned to 0a0041. So the SUBSTANTIVE contract
      I executed is committed; only the identifier and the write path are not.
    action_taken: >-
      I wrote to the path my task card assigned (TASK-20260822-0de988) and to
      nothing else, because exceeding an assigned write_scope is the one failure
      this program's concurrency rules exist to prevent, and 0a0041's scope may
      belong to another dispatched agent. The Coordinator's ledger archive must
      decide which path binds; the report content is identical either way and is
      recomputable from committed artifacts alone.
  - id: CI-3
    severity: recorded
    finding: >-
      The review_plan I executed exists only in my task card (an in-session
      message) for this goal/batch under the identifier I was given. AGENTS.md is
      explicit that a message is never a record. The committed plan under
      TASK-20260822-0a0041 covers the same joints, so the round is recoverable;
      but as dispatched, the plan-of-record and the plan-executed are bound by
      different identifiers.
  - id: CI-4
    severity: recorded; affects how my blind re-derivation must be read
    finding: >-
      The two contracts disagree on blind_from. My task card forbids only
      .../TASK-20260822-81141a/src/. The committed handoff TASK-20260822-0a0041
      lists the WHOLE producer directory .../TASK-20260822-81141a as blind_from --
      which is unsatisfiable for a reviewer who is simultaneously assigned joints
      1 and 2, since those joints are attacks on qt_family.json and
      certified_curves.json inside that directory. See blind_rederivation below
      for exactly what I read and when. This is a defect in the plan, not a
      dodge: one agent cannot be blind to a directory and be required to audit it.

