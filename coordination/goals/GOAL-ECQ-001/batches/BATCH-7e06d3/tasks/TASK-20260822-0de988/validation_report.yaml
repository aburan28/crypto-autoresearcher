  - check: method ceiling derived from the method's own resource measure
    result: pass
    detail: >-
      The ceiling of 8 over Q(t) is not an estimate. It follows from
      deg c4 = 4, deg c6 = 6, deg disc = 12 with disc squarefree, which I verified
