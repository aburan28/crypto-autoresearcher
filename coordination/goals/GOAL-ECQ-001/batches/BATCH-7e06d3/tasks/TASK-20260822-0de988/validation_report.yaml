      141005837549331272675978478], as supplied in my task card.
    method: >-
      Before opening ANY file under .../TASK-20260822-81141a/, I ran PARI/GP
      2.15.4's own ellrank on those a-invariants at efforts 0, 1 and 2. PARI's
      2-descent is an implementation the producer did not write. I then certified
      PARI's OWN returned points with my own toolkit: exact on-curve check in
      Fractions, height-pairing Gram matrix at 38 and 115 digits, my own
