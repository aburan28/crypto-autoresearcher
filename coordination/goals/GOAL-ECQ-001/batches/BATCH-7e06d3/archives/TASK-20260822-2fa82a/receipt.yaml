review_round_composition:
  independence: >-
    Two reviewers, disjoint owned joints, mutual blindness declared, both at
    review-adversarial with reasoning_effort xhigh and resolved model
    claude-opus-5, both independent_session true, neither downgraded and neither
    needed to. Neither read the other's report. Both verified the snapshot's
    content binding themselves before reviewing, and both recorded the
    review-breakthrough routing check and its negative result before proceeding.
  identifier_correction: >-
    THE VALIDATOR REPORT IS CITED AT ITS ACTUAL PATH,
    coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-0de988/validation_report.yaml,
    AND IT DISCHARGES TASK-20260822-0a0041. The orchestrating session dispatched
    this batch's validator under TASK-20260822-0de988, an identifier belonging
    to BATCH-e0caa5 of the PAUSED GOAL-ECRANK-002. The work is correct -- the
    joints, controls and blind re-derivation match 0a0041's committed plan, as
    the validator itself verified -- but the label and the filing path are
    wrong. The file was deliberately NOT MOVED: renaming a committed artifact to
    hide a dispatch error is the overwrite habit AGENTS.md rule 2 forbids.
    Consequences carried, not absorbed: tools/check_review_independence.py would
    compose this report against BATCH-e0caa5's plan and report an unowned joint
    and an unattested reviewer, and TASK-20260822-0de988 in BATCH-e0caa5 REMAINS
    UNDISCHARGED under the paused goal. Full account:
    coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/CORRECTION-review-dispatch-errors.md
  blindness_incident: >-
    PARTIAL BREAK, DISCLOSED BY THE VALIDATOR ITSELF. A routine `git status` /
    `git log` during a write-scope check exposed the red team's commit subject
    and message body, which summarised its joint-3/4 findings. The validator
    never opened the sibling's report. The ordering is CHECKABLE rather than
    asserted: the copy of the validation report committed inside the exposing
    commit b4cce6d1 already carries joint_1_verdict holds, joint_2_verdict
    holds, blind_rederivation agrees and verdict passed. The one overlapping
    measurement (137/137 ranks re-traced, 0 off curve) was computed with a
    toolkit sharing no code with the red team's, so the agreement is coverage
    and not correlation. Cause: orchestrator commit messages summarising one
    reviewer while the other worked. Rule adopted (DEC-20260822-564044 N4):
    while a blind round is live, a commit message says THAT an artifact landed,
    never WHAT it found.
  reviewer_file_committed_by_another_process: >-
    Twice, once bundled into the red team's return commit b4cce6d1 and once as a
    WIP supersede in b8c544fc. The validator made no commit and staged nothing.
    THE DELIVERABLE IS THE FINAL CONTENT AT THE VALIDATOR'S PATH; b4cce6d1 and
    b8c544fc contain SUPERSEDED PARTIALS and neither is the validator's return.
    Third occurrence of the orchestration-layer pattern, first to touch a
    reviewer.

