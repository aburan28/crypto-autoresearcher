  run_007: >-
    NOT DISCHARGEABLE, and no claim is at risk. There is NO untrimmed RUN-007
    raw-result.json anywhere in history: the path has exactly two committed
    versions, 58 bytes at e278a344 and 289 bytes at 1e9452fd, the latter
