write_scope:
  declared_in_task_card:
  - ledger/evidence
  - ledger/decisions
  - ledger/goals/GOAL-ECQ-001
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/archives/TASK-20260822-2fa82a
  declared_in_committed_dispatch_queue:
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/archives/TASK-20260822-2fa82a
  - ledger
  - ledger/decisions
  - ledger/evidence
  - ledger/goals/GOAL-ECQ-001
  writes_outside_the_task_card_scope:
  - path: ledger/hypotheses/H-ECQ-cec3c4.yaml
    covered_by: the committed queue's broader `ledger` entry
    why_it_had_to_happen: >-
      The task card's own constraint is "Only this task changes hypothesis or
      goal status", which cannot be honoured without touching the hypothesis
      record. The edit is the minimum that carries a status transition: `status`
      and an appended `status_note` naming the deciding decision and the
      narrowing, exactly as the sibling transition H-ECRANK-28dba7 records. No
      other field of the hypothesis was altered.
  - path: knowledge/findings/KN-FIND-6b3e17.md
    covered_by: NOTHING -- THIS IS A GENUINE SCOPE EXTENSION AND IT IS DECLARED
      AS ONE, NOT ABSORBED
    why_it_had_to_happen: >-
      The Coordinator role contract and the /curate-knowledge conventions
      require that a `support` decision on evidence of strength `replicated` or
      `strong` either promote a KN-FIND in THE SAME ledger archive commit or
      record a concrete `not_warranted` reason. This decision is `support` on
      `strong` evidence carrying a PROVEN BOUNDARY, so `not_warranted` would
      have been false. Neither write_scope list names `knowledge/`, which is a
      gap in the dispatch envelope of the same kind as the validator's
      wrong-identifier dispatch -- not a licence, and not something to fix by
      writing a dishonest field.
    why_it_is_safe: >-
      The path is a NEW file under a token minted at random and verified absent
      from ledger/ and knowledge/ before authoring. No other process can be
      writing it, so the failure mode write-scope discipline exists to prevent
      -- two writers on one path -- is structurally absent here. Contrast
      D-WRITE-SCOPE in the snapshot receipt, where the orchestrator wrote inside
      a LIVE producer's directory.
    required_of_the_orchestrating_session: >-
      Before staging, confirm the identifier is free
      (`ls knowledge/*/KN-*6b3e17*` returns nothing; `tools/allocate_id.py`
      does not carry a KN prefix in PREFIX_TYPE, so the check is the collision
      listing rather than the tool). If it is NOT free, the file is uncommitted
      and may still be renamed -- rename it and update the three references in
      DEC-20260822-564044, the batch checkpoint and this receipt BEFORE the
      commit. After the commit it is immutable.
    if_the_extension_is_refused: >-
      Then this archive is INCOMPLETE, not merely smaller: DEC-20260822-564044
      names KN-FIND-6b3e17 in `knowledge_promotion.promoted`, and committing a
      decision that points at a record which does not exist would fail the
      task's own completion gate ("every new record id resolves"). Refusing the
      extension therefore requires sending this task back, not dropping the file.

runtime_split:
  declared_in: ledger/goals/GOAL-ECQ-001/goal.yaml (runtime_constraint_note)
  authored_by: >-
    coordinator subagent -- every record in `paths_to_stage`, and every
    archival and adjudicative judgement in them, including the hypothesis
    transition, the goal closure and the knowledge promotion.
  committed_by: orchestrating session
  rationale: >-
    Under this runtime the coordinator subagent has no shell. It AUTHORS; the
    orchestrating session executes only the mechanical `git add` / `git commit`
    of exactly the paths declared above. This is a tooling split, NOT a worker
    committing into shared state: no producer or reviewer stages anything, the
    staged set is fixed by this record before the commit exists, and the
    dispatcher's post-commit verifier binds the commit back afterwards.
  coordinator_could_not_execute:
  - sha256sum over the staged paths (hence path_sha256 is empty and declared so)
  - git fetch / merge / push / commit; gh pr create / edit
  - python3 tools/validate_ledger.py, tools/check_review_independence.py,
    tools/allocate_id.py --check
  - regeneration of knowledge/INDEX.md

