- id: BC2
  status: DISCHARGED
  detail: >-
    Commit 78584ab8 is a real commit and an ancestor of HEAD (git cat-file, git
    merge-base --is-ancestor). The recovered untrimmed
    RUN-a7a9e8-004-augment-full/raw-result.json is 35,039,973 bytes with 34,740
