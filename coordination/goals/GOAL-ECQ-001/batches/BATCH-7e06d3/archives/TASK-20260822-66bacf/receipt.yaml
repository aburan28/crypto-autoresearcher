    DEVIATION/CORRECTION notes) entered git through the orchestrating session's
    in-flight durability commits documented in
    coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/IN-FLIGHT-LOG-NOTE.md,
    not through an archival task. AGENTS.md requires every run receipt and task
    report to be assigned to exactly one archival task.
  disposition: >-
    RECORDED. This receipt's content binding covers only the seven declared paths;
    it asserts nothing about the integrity of the durability-committed artifacts,
    which this role could not hash. The ledger archive must either bind those
    paths with hashes or record explicitly that they rest on durability commits
