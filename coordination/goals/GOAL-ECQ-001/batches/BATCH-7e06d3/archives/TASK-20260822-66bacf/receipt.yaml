    between them every required field (objective, inputs, controls, metrics,
    budget, stopping rules, artifact list, completion gate, and the frozen
    predictions P1-P3) was present. It FLAGGED this rather than refusing.
  disposition: >-
    RECORDED, NOT RESOLVED. Whether a handoff plus a hypothesis constitutes a
    frozen approved protocol for the purposes of an evidence record is a question
    for the review round and the ledger archive. A snapshot archive neither
    ratifies nor rejects it. Flagged prominently because a reviewer reading
    committed state must know which document it is reviewing against.

- id: O2
  raised_by: this archival task
  item: >-
    ARCHIVAL-ASSIGNMENT GAP. This receipt binds seven terminal deliverable paths -
    the ones whose hashes were supplied. The producers' remaining artifacts (src/
    implementations, runs/RUN-ECQ-81141a-001..007/ and runs/RUN-a7a9e8-*/ with
