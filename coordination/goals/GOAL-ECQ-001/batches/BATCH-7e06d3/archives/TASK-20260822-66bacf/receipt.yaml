    whose hashes were not supplied - which is exactly the scope expansion an
    isolated archive commit forbids.

- id: O3
  raised_by: this archival task
  item: >-
    BRANCH SYNC NOT PERFORMED BY THIS ROLE. AGENTS.md requires fetching
    origin/main and recording the base commit checked and the merge outcome in the
    task receipt before a snapshot commit. This role has no shell.
  disposition: >-
    DELEGATED to the orchestrating session, which must fetch origin/main, merge
    (never rebase) it into the working branch before generating this commit, and
    record the base commit and merge outcome. Repo HEAD supplied to this role at
