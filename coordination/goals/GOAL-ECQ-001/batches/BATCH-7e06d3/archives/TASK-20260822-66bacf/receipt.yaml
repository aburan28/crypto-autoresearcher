- id: D-IMMUTABILITY
  kind: immutability_violation
  severity: real violation of AGENTS.md rule 2 (results are immutable; corrections supersede, never overwrite)
  origin: producer TASK-20260822-a7a9e8 (self-reported as its deviations D1/D2/D3)
  what: >-
    AFTER runs 001-007 had completed and been committed, the producer wrote
    src/trim_raw.py and used it to overwrite already-finished run records in
    place: RUN-a7a9e8-004-augment-full/raw-result.json (2,361,552 lines deleted,
    34,740 result records reduced to the first 300 in search order);
    RUN-a7a9e8-007-independent-verify/raw-result.json (same treatment); and the
    manifest.yaml of ALL SEVEN runs, each gaining an appended
    `raw_result_trimmed_for_storage` line. Editing a completed run's manifest and
    raw result in place is exactly the operation rule 2 forbids, regardless of
    intent.
  scope_note: >-
    The dispatch envelope for this archival task named RUN-004 only. The
    producer's own DEVIATION-immutability-trim.md records RUN-007 and all seven
    manifests as well. Recorded here in full rather than narrowed to the
    envelope's wording.
  nothing_lost: >-
    Every untrimmed original is recoverable. RUN-004's untrimmed raw-result.json
    (35,039,973 bytes) is committed at 78584ab8; RUN-002's is the .gz above,
    roundtrip-verified; the other runs were committed untrimmed in branch history
    before the trim. Recover with `git show <sha>:<path>`.
  mitigating_facts_recorded_not_weighed_as_exoneration:
  - aggregate statistics over all trials including failures are kept verbatim
  - the first 300 records are retained, with _original_bytes and _original_record_count
  - per-trial lines survive in the untrimmed stdout
  - a _regeneration_command is supplied and the run is deterministic given its recorded seed
  reference: coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8/DEVIATION-immutability-trim.md

- id: D-WRITE-SCOPE
  kind: write_scope_violation
  severity: real violation
  origin: ORCHESTRATING SESSION
  attribution_correction: >-
    The producer logged this as anomaly A1 and attributed it to "archiving task
    TASK-20260822-e7c486". THAT ATTRIBUTION IS WRONG and the producer had no way
    to know: TASK-20260822-e7c486 has never run and is still blocked in the
    dispatch queue. The writes were the orchestrating session's.
  what: >-
    While TASK-20260822-a7a9e8 was RUNNING, the orchestrating session wrote
    raw-result.json.gz and RAW-RESULT-STORAGE.md into the producer's write_scope
    (runs/RUN-a7a9e8-002-m10-main/), plus a local .git/info/exclude entry, in
    order to preserve the oversized artifact past the GH001 push rejection.
  why_it_is_a_fault_and_not_a_footnote: >-
    Write-scope discipline exists so that exactly one process writes a path. The
    orchestrator wrote inside a live producer's scope; the producer detected the
    collision, correctly logged it against its own run, and then had to reason
    about files it did not create while deciding what to trim - its own D1/D2
    notes say the collision interacted with that decision. The correct handling
    was to hold the oversized artifact OUTSIDE the producer's scope until it
    terminated, and place it only then.
  effect_on_results: >-
    None. The interference was additive - a compressed copy and a note - and
    modified no result file. Nothing in it casts doubt on any rank claim. That is
    a statement about impact, not a downgrade of the violation.
  reference: coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8/CORRECTION-anomaly-A1-attribution.md

- id: D-CONCURRENCY-NOISE
  kind: orchestration_noise_in_producer_report
  severity: recorded; not a defect in the producer or its numbers
  origin: ORCHESTRATING SESSION
  what: >-
    TASK-20260822-81141a reported that repo HEAD moved (79019cf -> f7d9716)
    during its runs, that its files became tracked, and that "another session
    appears to have committed while runs were in flight". The observation is
    correct and the inference was the only one available to it. The "another
    session" was the orchestrating session making durability commits, because the
    container is ephemeral and a session Stop hook requires a clean tree.
  effect_on_results: >-
    None. Nothing was written into that producer's directory - contrast
    D-WRITE-SCOPE, where the orchestrator did write into a running producer's
    scope. Commit timing touches no computation, and the producer recorded its own
    implementation_sha256 for src/pipeline.py covering runs 001-004.
  cost_priced_in: >-
    This is the SECOND producer report in which an orchestrator action surfaced
    as an unexplained external event. The durability-commit pattern is not free:
    it injects events into every producer's field of view. Two independent
    producers' anomaly sections must not be read as evidence of a concurrency
    problem in the repository.
  reference: coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/CORRECTION-concurrency-anomaly.md

decisions:

  immutability_deviation:
    subject: D-IMMUTABILITY
    authority: >-
      Explicitly delegated to this archival task by its dispatch envelope; a
      snapshot archive may decide the disposition of a producer artifact it is
      asked to freeze. It may not decide anything about the research claims.
    decision: >-
      ACCEPT the trimmed artifacts into the snapshot AS THEY STAND, with the
      recovery path recorded and binding. RUN-a7a9e8-004 is NOT ordered re-run at
      this time. The violation is recorded as a violation and is NOT cured by this
      acceptance.
    reasoning:
    - >-
      A snapshot archive freezes producer output verbatim. Substituting a
      reconstructed or re-run artifact for what the producer actually left behind
      would itself be an edit of the producer's record, and would defeat the
      purpose of the freeze.
    - >-
      The remedy AGENTS.md rule 2 prescribes for an overwrite is a SUPERSEDING
      RECORD, not a re-execution. The untrimmed bytes already exist in committed
      history (RUN-004 at 78584ab8; RUN-002 as the roundtrip-verified .gz; the
      remaining runs committed untrimmed before the trim). The information a
      supersede would have preserved is therefore preserved, by history rather
      than by method.
    - >-
      A re-run would not restore immutability of a record already overwritten -
      it would mint a new run id with new bytes, and the trimmed record would
      remain in history exactly as it is now. It buys re-verifiability that the
      recovery path already supplies, at the cost of budget under a goal
      (GOAL-ECRANK-002) that DEC-20260822-d9bf63 paused.
    - >-
      The producer self-reported the deviation before any archive touched it,
      retained the aggregate statistics, the first 300 records, _original_bytes,
      _original_record_count and a deterministic _regeneration_command. That is
      the behaviour that makes the deviation checkable; it is why acceptance is
      available at all, and it is not a licence for the next producer to do the
      same.
    binding_conditions_on_the_review_round_and_the_ledger_archive:
    - id: BC1
      condition: >-
        Any verification of a rank claim that rests on RUN-a7a9e8-004 or
        RUN-a7a9e8-007 raw output - in particular the validator's joint that every
        claimed rank is backed by that many exhibited independent points, against
        max_certified_rank 13 over 1,206 curves - MUST be performed against the
        UNTRIMMED originals recovered from history, not against the trimmed files
        in the working tree. Recovery for RUN-004: `git show 78584ab8:<path>`.
    - id: BC2
      condition: >-
        The ledger archive must verify and record that commit 78584ab8 is
        reachable and that the recovered untrimmed RUN-004 raw-result.json has a
        recorded sha256, so the recovery path becomes a content binding rather than
        a commit-reachability binding. CLAUDE.md warns that recorded shas can be
        made unreachable by a squash merge; a recovery path bound only to a sha is
        advisory until its content is hashed.
    - id: BC3
      condition: >-
        IF 78584ab8 proves unreachable, OR the recovered content does not match
        the trimmed file's recorded _original_bytes / _original_record_count, THEN
        this acceptance lapses automatically: RUN-a7a9e8-004 (and RUN-007 on the
        same test) is OWED A RE-RUN UNDER A NEW RUN ID, and no evidence record may
        rest on that run's raw output until the re-run exists. This is a
        pre-declared trigger, not a criterion to be revisited after seeing the
        outcome.
    - id: BC4
      condition: >-
        The seven manifests carrying the appended raw_result_trimmed_for_storage
        line are archived as-is and are to be read as overwritten manifests. A
        reviewer comparing a manifest against its pre-trim committed form is
        comparing two states of one record, and any discrepancy beyond that single
        appended key is a defect to report, not to reconcile.
    what_this_decision_is_not:
    - It is not a finding that the trim was acceptable practice. It was not.
    - It does not adjudicate rank 12, rank 13, P1, P2, P3, or any claim.
    - It does not clear the producer's over-collection question (see D-STORAGE).

  storage_deviation:
    subject: D-STORAGE
    decision: >-
      ACCEPT. Both hashes are carried in this receipt so the producer's exact
      bytes are verifiable without the 108 MB file entering git history. Any
      downstream record citing RUN-a7a9e8-002 raw output must cite the ORIGINAL
      sha256 ff0935a0...5ccb47 as the artifact identity and the .gz as its storage
      form, and must say that verbatim holds in content and not in file layout.

  orchestrator_faults:
    subject: [D-WRITE-SCOPE, D-CONCURRENCY-NOISE]
    decision: >-
      RECORDED AS ORCHESTRATOR-CAUSED, not as producer defects and not as evidence
      of a repository concurrency problem. D-WRITE-SCOPE is logged as a genuine
      write-scope violation by the orchestrating session against a running
      producer's scope; D-CONCURRENCY-NOISE is logged as the cost of the
      durability-commit pattern. Neither modified a result. Both are handed to the
      review round as context so that neither is re-derived as a defect in the work
      under review, and both stand as findings against the orchestration layer.
    process_obligation_recorded_not_imposed: >-
      An oversized or in-flight artifact belonging to a live producer is to be held
      outside that producer's write_scope until it terminates. Recorded here for the
      goal record; a standing process change is a separate coordinator decision,
      not a snapshot archive's to make.

