    bytes and exceeds GitHub's 100 MB limit (GH001). It is archived as a
    lossless compressed copy, raw-result.json.gz, under a different name.
  archived_object: runs/RUN-a7a9e8-002-m10-main/raw-result.json.gz
  archived_object_sha256: 7c8d7df49c686d99c45f417d81cf43b4c5367d7a8c9e664ecbb06694f375728e
  original_artifact_sha256: ff0935a0c68c58da7da3fdb861f36d80e33f72365fb2ecb57d8196b0af5ccb47
  original_artifact_bytes: 112301654
  roundtrip_verification: >-
    Byte-identity verified by `gunzip -c raw-result.json.gz | sha256sum`
    against the original sha256 above, by the orchestrating session at the time
    of writing. Recorded, not re-executed by this role.
  verbatim_status: >-
    ARCHIVE-VERBATIM HOLDS IN CONTENT BUT NOT IN FILE LAYOUT. The producer's
