review_plan:
  round_id: TASK-20260828-cc566d
  goal_id: GOAL-DREG-001
  batch_id: BATCH-ca5f66
  recorded_at: '2026-08-28'
  recorded_by: coordinator
  recorded_by_session: opencode-launch-harness-20260828 (opencode runtime, branch goal-dreg-001-batch007-repair-20260828)
  recorded_by_decision: >-
    No separate decision record: this plan rides the BATCH-ca5f66 opening
    snapshot (TASK-20260828-90936d) and is written BEFORE any reviewer
    runs, which is the property the requirement protects. The review
    obligation itself is the standing requirement on the repair named by
    DEC-20260812-f56a44 `scoped_repair.review_requirement_on_the_repair`,
    dispatched under DC-3..DC-8 of DEC-20260822-badc59 as they stand.

  status_note: >-
    PRE-REGISTERED BEFORE ANY REVIEWER RUNS. As of this writing no review
    report for TASK-20260828-cc566d exists and the producer task
    TASK-20260828-b74d55 has not run; the artifacts it will produce do not
    yet exist on this branch. Nothing below was written from a producer
    output.

  why_this_plan_exists: >-
    AGENTS.md "Review architecture" requires a review_plan written by the
    Coordinator BEFORE any reviewer runs, on every claim-changing review
    round. The committed handoff
    ledger/handoffs/TASK-20260828-cc566d.yaml carries review_plan null and
    IS IMMUTABLE and IS NOT EDITED; the plan is recorded in this new
    artifact, which is what the contract requires. The round is
    claim-changing under a conservative reading: the verdict licenses or
    blocks a LANE (the repaired winner becomes dispatchable only on a
    PASS), and "close a lane" is in the trigger list. If a later reader
    judges the round non-claim-changing, this plan is harmless surplus.

  round_shape_disclosed_rather_than_glossed: >-
    THIS IS A SINGLE-REVIEWER ROUND. One validator owns every joint. Two
    consequences, both recorded rather than assumed away. (1)
    `blindness.mutual` is VACUOUS -- there are no sibling reports in this
    round. (2) The whole-claim verdict the committed completion gate
    demands (PASS/REVISE/REJECT on the superseding contract) IS coherent
    here, because the sole reviewer sees every joint by construction.
    THE COVERAGE LIMITATION IS REAL AND IS THE PRICE -- one reviewer's
    coverage is one reviewer's taste, and no cross-reviewer corroboration
    exists or may be claimed for this round under any name (DC-8).

  claim_under_review: >-
    The SUPERSEDING ranking and lane contract produced by
    TASK-20260828-b74d55 (paths in the queue), which supersedes the frozen
    BATCH-006 artifacts for future dispatch. The claim is that the
    superseding pair discharges RR-1..RR-10 of DEC-20260812-f56a44: the
    winner's FORM is genuinely re-decided, the regime and its parameters
    are fixed in writing with an honest expected delta that disposes of
    the null-object certificate, a null-object arm with its own predicted
    value exists, the binding predicate is stated once and correctly, the
    falsifier list no longer swallows "no drop", the budgets are derived
    and the instrument named, the frontier is re-ranked quantitatively,
    the C2 reference is content-bound, no sentence licenses an unreviewed
    run, and the headroom figure is reconciled or the discrepancy
    recorded.

  coordinator_prior:
    do_not_transmit: >-
      THIS FIELD MUST NOT REACH THE REVIEWER (DEC-20260822-badc59 DC-3).
      It is a pre-commitment recorded so that "the validator concurred"
      and "the validator concurred with what the Coordinator already
      believed" remain distinguishable after the fact. EVERY LINE OF IT
      MAY BE OVERTURNED, and an overturned prior is one of the most
      informative outcomes this round can produce.
    what_the_coordinator_actually_read_before_writing_this: >-
      DISCLOSED SO THE PRIOR IS CHECKABLE -- DEC-20260812-f56a44 in full
      (the block, the refutation artifact, RR-1..RR-10, the review
      requirement, the goal-head disposition); the frozen ranking.yaml
      and lane-contract.yaml in full; the VAL-20260822-001 report's
      verdict, calibration, and finding summaries; DEC-20260822-badc59's
      dispatch conditions DC-1..DC-8; and the BATCH-ca5f66 opening
      control plane this plan rides. The producer's superseding artifacts
      DO NOT EXIST YET and were not read -- they cannot have been.
    expected_findings:
      - >-
        P-1 (HIGHEST CONFIDENCE) THE LOAD-BEARING RISK IS RR-2, THE
        REGIME. The null-object certificate (the pivot-accounting oracle
        I(M) := ncols(M) passing the FROZEN contract by construction) is
        the whole blocking core, and the producer has no shell, so its
        disposition of the certificate is read-only arithmetic on the
        committed chunk-coverage trail. I EXPECT THE REVIEW TO SCRUTINIZE
        WHETHER THE FIXED REGIME (unit index, stopping column j1, trail
        row, deleted column) genuinely takes the oracle out of scope --
        e.g. by fixing the deleted column to one the trail shows to
        contribute exactly one independent row -- or merely RENAMES the
        oracle's regime. A regime whose parameters are anchored to the
        committed trail rather than picked after seeing a new run is the
        line between pre-registered and fitted.
      - >-
        P-2 I EXPECT RR-7 TO MOVE THE WINNER. Item B's
        `evidence_value: high` rested on discriminating OBJ-013-4, which
        it does not; the decision names row C's runnable n=15 rung at
        `evidence_value: very_high`. If the producer retains the cheap
        mutation form with its credit restated as pivot-accounting-only,
        the restated frontier may well select a different winner than the
        frozen ranking did. I EXPECT THE REVIEW TO CHECK THAT THE
        NAMED WINNER IS THE WINNER OF THE RESTATED FRONTIER, not of the
        frozen one.
      - >-
        P-3 I EXPECT A FINDING ON THE FALSIFIER LIST IF THE PRODUCER
        RETAINS "no drop" UNCONDITIONED. RR-5 requires removing "no drop"
        from the falsifier list or conditioning it on the declared
        regime, and routing an unexpected delta to re-examination rather
        than to an automatic instrument verdict. The frozen contract
        falsified on "no drop"; a superseding contract that keeps that
        limb unconditioned inherits the tautology the verdict blocked.
      - >-
        P-4 I EXPECT THE RR-6 MEMORY BUDGET TO BE THE WEAKEST DERIVED
        FIELD. It must derive from the measured peak RSS of the same cell
        and instrument (the BATCH-005 run manifest is the cited source)
        or justify the difference explicitly. A number the producer cannot
        trace to a committed record is a finding, and a producer without
        a shell cannot have measured one.
      - >-
        P-5 I DO NOT EXPECT A REJECT OF THE REPAIR'S FORM. Both RR-1
        forms (end-to-end re-rank; cheap mutation with restated credit)
        are legitimate dispositions. A REJECT would mean neither form can
        be honestly specified -- which is itself the useful result and
        would route to the next scoped repair. I HOLD THIS PRIOR LOOSELY
        AND IT IS NOT AN INSTRUCTION.

  joints:
    - joint: >-
        J1 SOURCE FIDELITY AND REQUIREMENT FIDELITY. Every reviewed byte
        is read from the FROZEN SNAPSHOT of TASK-20260828-c11e06, and
        every RR-1..RR-10 obligation is read from the FROZEN DECISION
        DEC-20260812-f56a44, not from the producer's summary of either.
      derived_from_committed_card: SC-1
      assigned_to: TASK-20260828-cc566d
      attack_plan: >-
        Read the snapshot receipt from the queue's archive block, verify
        the commit is reachable, and read the superseding artifacts via
        `git show <snapshot-commit>:<path>` rather than the working tree;
        a byte divergence between the snapshot and the tree is itself a
        finding. Then quote RR-1..RR-10 from the decision file and check
        the artifacts against the decision's text, not against any
        paraphrase in the task card or the producer's own preamble.
      breaking_artifact: >-
        A byte or digest divergence between the snapshot commit and the
        paths being reviewed, or an artifact that discharges a paraphrase
        of an RR requirement while the decision's own text is unmet.
    - joint: >-
        J2 THE FORM IS RE-DECIDED (RR-1) AND THE FRONTIER IS RE-RANKED,
        NOT RE-DRESSED (RR-7). The winner's form is one of the two RR-1
        dispositions, stated in the artifact; if the cheap mutation is
        retained, its credit is restated as PIVOT-ACCOUNTING-ONLY with
        OBJ-013-4 left open; every frontier row carries a QUANTITATIVE
        sota_delta from numbers in the cited records; each
        `dominated_by: null` is licensed by a recorded frontier check;
        and row C's runnable n=15 rung is re-evaluated against the
        restated item B, with the winner stated on the corrected
        frontier.
      derived_from_committed_card: SC-2 (RR adjudication limb)
      assigned_to: TASK-20260828-cc566d
      attack_plan: >-
        Reconstruct the frontier from the cited records (the frozen
        ranking's rows, the decision's CF-1/CF-2, the goal head's
        standing holds) and attempt to construct a dominating row for
        the named winner. Check each quantitative sota_delta against the
        numbers it claims to come from. WHERE THE COORDINATOR THINKS IT
        BREAKS -- a restated item B that keeps its old
        `evidence_value` wording, or a winner chosen on the frozen
        frontier rather than the restated one (prior P-2).
      breaking_artifact: >-
        A winner that is not the winner of the restated frontier; a
        null sota_delta or a dominated_by: null no recorded check
        licenses; or a restated credit that still inherits the
        end-to-end form's OBJ-013-4 wording.
    - joint: >-
        J3 THE REGIME IS FIXED IN WRITING AND THE NULL-OBJECT
        CERTIFICATE IS DISPOSED OF (RR-2). The unit index, the exact
        stopping column j1, the exact committed trail row, and the
        deleted column index are named; the honest expected delta in
        that regime is stated WITH its derivation; and the derivation
        disposes of the certificate -- re-verifying it independently
        against the committed chunk-coverage trail, or showing exactly
        where it fails in the fixed regime.
      derived_from_committed_card: SC-2 (certificate limb)
      assigned_to: TASK-20260828-cc566d
      attack_plan: >-
        Take the regime as stated and re-verify the certificate's
        arithmetic field by field against
        coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/
        TASK-20260731-016/chunk-coverage.log with the shell this role
        carries: the identity the certificate rests on, the units it
        spans, and the delta the oracle produces under the stated
        deletion. Check that the regime's parameters are anchored to
        committed trail rows (pre-registered) rather than left free to
        be picked after a new run. WHERE THE COORDINATOR THINKS IT
        BREAKS -- a parameter that is free in the regime statement and
        fixed only by the producer's reading of the trail (prior P-1).
      breaking_artifact: >-
        A regime with a free parameter; an expected delta whose
        derivation does not dispose of the oracle; or a trail value the
        re-verification does not reproduce.
    - joint: >-
        J4 THE NULL-OBJECT ARM EXISTS WITH ITS OWN PREDICTED VALUE AND A
        DECAY EXPECTATION (RR-3). A dependent-column deletion arm
        predicts delta 0; the decay expectation as the prefix lengthens
        past the deficient boundary is stated.
      derived_from_committed_card: SC-2 (control limb) and the proves-too-much objects below
      assigned_to: TASK-20260828-cc566d
      attack_plan: >-
        Apply the superseding contract's full procedure to the
        dependent-column object and to the pivot-accounting oracle, and
        ask what the contract would record in each case. One arm and one
        integer is not a discrimination (docs/inventor-protocol.md
        Section 3, "Controls before belief"); the arm must be
        executable under the contract's own budget and failure modes.
        WHERE THE COORDINATOR THINKS IT BREAKS -- an arm that is
        declared but not bound to the same instrument, chunked mode,
        and trail, so that it could be waived at run time.
      breaking_artifact: >-
        The contract recording CONFIRMED (or unrecordable failure) for
        an object whose honesty is false by construction, or a null arm
        with no stated predicted value.
    - joint: >-
        J5 THE BINDING PREDICATE IS STATED ONCE, CORRECTLY, AND THE
        FALSIFIER LIST NO LONGER SWALLOWS "NO DROP" (RR-4, RR-5). k is
        that unit's width, not the matrix width; the ranking and the
        contract agree by construction; "no drop" is removed or
        conditioned on the declared regime; an unexpected delta routes
        to re-examination of the trial; limb (i)'s obstruction routing
        and the infrastructure routing are preserved.
      derived_from_committed_card: SC-1 and SC-2 (falsification rigor limb)
      assigned_to: TASK-20260828-cc566d
      attack_plan: >-
        Read the predicate in both artifacts and diff them literally.
        Take the falsification statement and enumerate the observations
        it would and would NOT treat as falsifying; check each routing
        (obstruction, infrastructure, re-examination) against the
        decision's requirement. WHERE THE COORDINATOR THINKS IT BREAKS
        -- a predicate that still says "k = the matrix width" in either
        artifact, or a falsifier list where "no change in rank_acc" is
        still an unconditioned falsification (prior P-3).
      breaking_artifact: >-
        A predicate stated differently in the two artifacts; a
        matrix-width k anywhere operative; or a falsifier limb the
        decision required removed or conditioned that stands
        unconditioned.
    - joint: >-
        J6 THE BUDGETS ARE DERIVED, THE INSTRUMENT NAMED, AND THE
        HEADROOM RECONCILED (RR-6, RR-10). The memory budget derives
        from the measured peak RSS of the same cell and instrument or
        the difference is justified; the instrument, its chunked mode,
        and the D6 un-chunked forbid are named; the adjacency input, its
        regeneration procedure from the pinned system hashes, and its
        budget are named; an `input_unavailable` failure mode routes to
        failed_infrastructure and never to evidence; the
        host-headroom figure is reconciled with the commissioning
        record or the discrepancy is recorded as such.
      derived_from_committed_card: SC-2 (budget and honesty limb)
      assigned_to: TASK-20260828-cc566d
      attack_plan: >-
        Trace every budget number to the record it claims to come from
        (the BATCH-005 run manifest for peak RSS; the frozen contract's
        host_headroom_check for the 2026-08-15 load figure). A
        2026-08-15 host load is not re-measurable now and MUST NOT be
        replaced by a current reading; an unreconciled discrepancy must
        be recorded, not smoothed. WHERE THE COORDINATOR THINKS IT
        BREAKS -- an RSS number with no committed source (prior P-4),
        or a current load reading substituted for the frozen figure.
      breaking_artifact: >-
        An untraceable budget number; a missing instrument name or
        chunked-mode declaration; a missing input_unavailable routing;
        or a replaced headroom figure.
    - joint: >-
        J7 THE C2 REFERENCE IS CONTENT-BOUND AND NO SENTENCE LICENSES AN
        UNREVIEWED RUN (RR-8, RR-9). The C2 archive is bound to content
        on the official line, with the PREREG-20260727-N21-C2
        independent-validation durability limb either honoured or
        recorded as KNOWINGLY WAIVED with reason; the blob hash the
        earlier reviewer computed is treated as a starting point to be
        re-verified, not copied; and no clause of the superseding
        contract has the effect that a run proceeds when its required
        review has not returned.
      derived_from_committed_card: SC-4 (the correction goes in the contract text itself) and SC-5
      assigned_to: TASK-20260828-cc566d
      attack_plan: >-
        Read the C2 reference in the superseding artifacts and check
        the binding target (content on the official line vs the
        never-pushed ref coordinator/goal-dreg-001-b3c2-b4); read the
        independence clause and ask, literally, what it licenses when
        the review is pending. WHERE THE COORDINATOR THINKS IT BREAKS
        -- a copy of the earlier reviewer's blob hash presented as
        verified, or an independence clause whose premise was true of
        the 2026-08-15 session and whose operative effect survived the
        supersession (the CF-4 sentence pattern).
      breaking_artifact: >-
        A content binding to a ref that is not on the official line; a
        copied-unverified hash; a waived durability limb without a
        recorded reason; or any clause whose effect is that the run
        proceeds while its reviewer does not.

  proves_too_much:
    objects:
      - >-
        KNOWN-FALSE OBJECT 1 - THE PIVOT-ACCOUNTING ORACLE I(M) :=
        ncols(M). This is the decision's refutation artifact re-run
        against the SUPERSEDING contract. If the superseding
        contract's required_prediction, applied in its declared regime,
        is still satisfied by an oracle that performs no linear
        algebra, the tautology has been moved, not removed, and the
        repair fails on its blocking core.
      - >-
        KNOWN-FALSE OBJECT 2 - A LINEARLY DEPENDENT COLUMN. Apply the
        superseding contract's procedure to the deletion of a column
        that contributes ZERO to the rank. The null-object arm must
        predict delta 0 there; if the main prediction would be recorded
        as CONFIRMING for this object, the discrimination still does
        not discriminate.
      - >-
        KNOWN-FALSE OBJECT 3 - THE INFRA-LIMITED RUNG. Apply the
        superseding ranking's selection criteria to row C's n=18 rung,
        which the goal record declares NOT EXECUTABLE on this host. The
        conclusion "this rung is the executable winner" is KNOWN FALSE;
        if the stated criteria would select it, the criteria are not
        tracking executability.
    failure_signature: >-
      OBJECT 1 - if the oracle still passes the superseding contract,
      the repair is a re-dressing, and the verdict on that limb is
      blocking. OBJECT 2 - if the contract cannot distinguish the
      dependent-column case from a genuine contribution, the
      discrimination carries no information. OBJECT 3 - if the
      criteria select an infeasible rung, the winner was chosen on
      something other than the stated axes. AN ARGUMENT THAT STILL GOES
      THROUGH WHERE ITS CONCLUSION IS FALSE IS WRONG SOMEWHERE NOBODY
      HAS READ CLOSELY ENOUGH YET.
    assigned_to: TASK-20260828-cc566d

  blind_rederivation:
    required: false
    not_required_reason: >-
      RECORDED RATHER THAN SILENTLY OMITTED, AND THE HONEST ANSWER IS
      THAT THIS ROUND CANNOT CARRY ONE. A blind re-derivation starts
      from the STATEMENT of a quantity and its parameters and reads
      nothing of the producer's. The load-bearing quantity here (the
      expected delta in the fixed regime) is stated IN the producer's
      artifact, and the sole reviewer must read that artifact to
      adjudicate anything - there is no agent left to keep blind.
      Manufacturing a `blind_from` list the reviewer is required to
      read anyway would be a declared independence the setup does not
      have, which is worse than none.
    closest_available_check_and_it_is_assigned: >-
      J3's trail re-verification is an INDEPENDENT-SOURCE CHECK -- the
      certificate's arithmetic is re-read from the committed
      chunk-coverage.log rather than from the producer's derivation.
      IT IS NOT A BLIND RE-DERIVATION and must not be reported as one,
      because the reviewer will have read the derivation first.
    quantity: null
    parameters: null
    blind_from: []
    assigned_to: null

  blindness:
    mutual: true
    mutual_is_vacuous_here: >-
      Single-reviewer round - no sibling reports exist in it. The
      reviewer must still declare `sources_read` honestly and must set
      `read_sibling_reports: false`.
    lifted_for: []
    rationale: null
    additional_constraint: >-
      The reviewer MUST NOT be given, and MUST NOT read,
      `review_plan.coordinator_prior` or this file, before rendering
      its verdict (DEC-20260822-badc59 DC-3, carried by
      DEC-20260812-f56a44 `scoped_repair.review_requirement_on_the_repair`).
      Neither this file nor DEC-20260822-badc59.yaml appears in the
      task's committed read_scope. WHAT MAY BE TRANSMITTED IN THE
      DISPATCH PROMPT - the joint labels J1..J7 and their statements as
      one-to-one restatements of the committed card's constraints
      SC-1..SC-6, which add NO obligation the frozen contract does not
      already carry. The dispatch prompt is GENERATED FROM THE COMMITTED
      CARD (the PD-C4 root cause, carried forward by
      DEC-20260812-f56a44, is not repeated).

  expected_attestation_from_the_reviewer: >-
    The report carries a `review_attestation` block - task id
    TASK-20260828-cc566d, joints_owned [J1, J2, J3, J4, J5, J6, J7],
    sources_read listed honestly and completely, read_sibling_reports
    false, blind_from_respected null (no re-derivation assigned), and a
    terminal verdict. Because this reviewer owns every joint, the
    terminal PASS/REVISE/REJECT its committed completion gate demands
    is a whole-claim verdict it is entitled to give.

  procedure_deviations:
    - >-
      PD-1 SINGLE REVIEWER, ALL JOINTS. The contract's preference is
      one owner per joint across several reviewers, which buys coverage
      instead of correlation. This round has one reviewer because that
      is what the committed repair requirement commissions ("an
      independent review at review-adversarial / xhigh in an
      independent session" - one). NO SECOND REVIEWER IS ADDED HERE -
      adding one would be a new task with a new identifier, which the
      repair requirement does not commission. The resulting coverage
      limit is disclosed in
      `round_shape_disclosed_rather_than_glossed`.
    - >-
      PD-2 THE PLAN RIDES THE OPENING SNAPSHOT. It is committed in the
      same act as the queue and the cards it governs, BEFORE the
      producer runs and BEFORE any reviewer runs. The property the
      requirement protects - a prior recorded before any verdict -
      holds in full.
