handoff:
  id: TASK-20260721-DREG-N12D6-P1
  from: coordinator
  to: executor
  objective: >-
    Produce the first admissible full-column d_reg datum past the D=5 wall: the
    D=6 rank deficit at n=12 (sem and T11 support-matched null arms, same cell),
    which is now VALID because d_reg(12)=7 > 6 -- no D6-null instrument repair is
    needed (the n=9 D6 failure was the degeneracy D6=d_reg(9)=6). Also produce the
    gap(n)=d_reg-d_ff ladder at n=12,15,18 with >=3 seeds each.
  uncertainty_reduced: >-
    Converts the degree axis from "unmeasured past D=5" (DEC-20260720-002) into a
    committed full-column measurement, testing H-DREG-001's support clauses
    (d_reg(sem)<d_reg(null); deficit grows super-linearly; gap bounded) directly.
  inputs:
    - experiments/EXP-DREG-001/ (block-m4ri instrument; DREG_harness.py; DREG_dff.sage)
    - experiments/EXP-SIG-005/src/ (build_boolean_semaev, boolean_null, ic_first_fall_fast)
    - research/dreg-linear-law/FINDING_v2.md (validated d_reg law: d_reg(12)=7, d_reg(15)=8, d_reg(18)=9)
    - ledger/H-DREG-001.yaml (predictions + admissibility)
  constraints:
    - Full-column exact rank ONLY; subset-column corank is invalid for sem (h012 finding iv).
    - Timeout/OOM = failed_infrastructure (AGENTS rule 5), never evidence.
    - Sage TMPDIR/SAGE_TMP on /Volumes/Volume (root disk ~full); do not fill root.
    - Deterministic seeds; both arms in the same cell for comparability.
  deliverables:
    - Immutable run receipt(s) with command, revision, environment, per-arm per-degree
      full-column rank, sr_pred, deficit, d_ff, and (where d_reg is attained) d_reg.
    - A raw-result.json summarizing sem vs null deficit at n=12 D6 and the gap(n) ladder.
  artifact_paths:
    - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/manifest.yaml
    - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/raw-result.json
  archived_by: TASK-20260721-DREG-N12D6-SNAP-C1
  inference:
    policy: executor-terra
    fallback_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 40
    maximum_runs: 12
  completion_gate:
    - n=12 D6 full-column rank produced for BOTH arms (or the cell recorded as
      failed_infrastructure with the exact cap hit).
    - gap(n) ladder recorded at every n where d_reg is attained; unreached n reported as such.
  return_format: immutable run receipt + raw-result.json (observations only; no interpretation)
