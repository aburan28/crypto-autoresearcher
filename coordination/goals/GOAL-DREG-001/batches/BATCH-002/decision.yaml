# Goal-scoped batch decision (isolated branch). NOT an official shared-ledger
# DEC-* record: no DEC-YYYYMMDD id is minted here, to avoid colliding with the
# co-driver's shared numbering on main. This SHARPENS the co-driver's
# DEC-20260720-002 and this goal's DEC-GOAL-DREG-001-B001 (H-DREG-001 weaken,
# trending reject_scoped of the polynomial-solve WIN scenario).
coordinator_decision:
  id: DEC-GOAL-DREG-001-B002            # goal/batch-scoped id (isolated), not a shared DEC-YYYYMMDD
  context: >-
    GOAL-DREG-001 BATCH-002: the degree-axis crux DEC-20260720-002 left open --
    the D6-at-n=12 full-column exact GF(2) rank of the boolean Semaev m=3 (t=3)
    system vs its degree-matched null, plus a first-fall gap(n) ladder. Producer
    run RUN-DREG-001-MEASURE-N12-D6 independently reviewed: Validator
    PASS-WITH-CAVEATS (VAL-N12D6.md), Red Team CONFOUNDED-BUT-NOT-EMPTY
    (RT-N12D6.md, with a bounded support-audit control it ran). Builds directly on
    DEC-GOAL-DREG-001-B001.
  decision: weaken            # scoped: continues trending reject_scoped of the degree-axis WIN sub-scenario; the D6 data ADD to the record but open no attack -- if anything they reinforce the negative control
  target_ids: [H-DREG-001]
  rationale:
    - >-
      The D6-at-n=12 measurement completed cleanly and admissibly, discharging the
      DEC-20260720-002 prerequisite ("degree axis unmeasured past D=5") at n=12.
      Validator PASS: FULL-column exact GF(2) rank (not subset corank), certificate.kind=none
      (pure rank; no solve/relation), checkpoint-resume verified with no column
      double-count or drop. Null arm rank = 156520 = sr_pred EXACTLY (deficit 0):
      the semi-regular baseline is well-defined and calibrated at D=6 < d_reg(12)=7.
      Sem arm rank = 138573.
    - >-
      CRITICAL -- the raw sem-null D6 deficit 17947 is CONFOUNDED and is QUARANTINED
      from any structural reading. sr_pred=156520 is support-INDEPENDENT (a function
      of the generator degree multiset {2:12,3:12} and nb=24 only), yet it was applied
      to two DIFFERENT column spaces: null ncols=190051 = the FULL squarefree monomial
      space, sem ncols=174035, i.e. 16016 monomials absent -- and the Red Team's audit
      shows ALL 16016 are DEGREE 6 (the probe degree); degrees 0-5 are identically
      supported. Column-deletion bound => rank(null | restricted to sem's support)
      >= 156520 - 16016 = 140504 > 138573, so the support-INDEPENDENT (genuine) deficit
      is >= 1931, and <= 16016 (~89%) of the 17947 is a degree-6 support/sparsity gap,
      NOT extra syzygies. "support-matched null" is a misnomer over GF(2): a boolean
      polynomial is just a monomial set (all coefficients 1), so boolean_null can only
      randomize WHICH monomials appear, not hold the support fixed -- H-DREG-001's
      "identical support" assumption is false for this null.
    - >-
      The honest, genuinely support-matched degree-axis observable already exists and
      is unchanged: the committed D=5 support-matched deficit is 1322 at n=12
      (VALIDATE-N12-A vs VALIDATE-NULL-N12-D5-B; shared 55455-column support), and the
      cross-n D5 series (~909/1322/1862/1999) is DECELERATING -- consistent with
      DEC-GOAL-DREG-001-B001, not a growing WIN. The genuine signal is O(10^3), not the
      O(1.8x10^4) headline.
    - >-
      Direction is unchanged and WRONG-SIGN for an attack: a larger sem quotient =>
      d_reg(sem) >= d_reg(null) = 7. The Semaev cascade RAISES the solving degree; the
      degree axis makes Grobner MORE expensive, not less. This reinforces the negative
      control (t=3/t=7 binary Weil-descent for the prime-field target). No sub-rho signal;
      closest baseline (FINDING_v2 generic t=7 n=161) loses >1100 bits to rho.
    - >-
      The first-fall axis is a non-opening: sem d_ff=2-3 with ff_s=0.0 is the trivial
      boolean field-relation (x^2=x) fall, non-operative; it is not the solving degree.
      The gap(n)=d_reg-d_ff clause is untestable here -- the null first-fall was never
      measured (infra-limited), so no cross-arm gap exists.
  evidence_refs:
    - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6           # producer receipts (snapshot commit bedd64c)
    - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/raw-result.json
    - coordination/goals/GOAL-DREG-001/batches/BATCH-002/reviews/VAL-N12D6.md
    - coordination/goals/GOAL-DREG-001/batches/BATCH-002/reviews/RT-N12D6.md
    - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/rt-control/support_confound_probe.json
    - RUN-DREG-001-VALIDATE-N12-A            # committed D5 support-matched sem cell (deficit source)
    - RUN-DREG-001-VALIDATE-NULL-N12-D5-B    # committed D5 support-matched null cell
  measured_this_batch:
    d6_n12_full_column_rank:
      seed: 2026
      target: {n: 12, t: 3, ti: 0, D: 6}
      certificate_kind: none
      sem:  {nrows: 183312, ncols: 174035, sr_pred: 156520, rank: 138573, deficit_vs_sr_pred: 17947}
      null: {nrows: 183312, ncols: 190051, sr_pred: 156520, rank: 156520, deficit_vs_sr_pred: 0}
      genuine_support_independent_deficit_lower_bound: 1931   # >= ; exact value in [1931, 17947] pending CTRL-B
      support_gap_at_degree_6: 16016                          # ~89% of the 17947 headline; NOT syzygies
      raw_headline_status: quarantined_confounded             # 17947 must NOT enter any EV/DEC as structural
    first_fall_ladder_partial:
      sem_n12_d_ff: [3, 2]     # ti0, ti1 ; ti2 infra-limited
      sem_n15_d_ff: [2, 2]     # ti1, ti2 ; ti0 infra-limited
      null_d_ff: not_measured  # infra-limited (un-chunked instrument swaps onto near-full root)
      status: non_operative    # trivial field-relation fall; gap(n) untestable
  limitations:
    - >-
      TOY SCALE, single cell: one seed / one target / one degree / n=12 for the D6 rank.
      No CIs, no seed ladder, no cross-arm gap -- RQ-DREG-001's decision_target
      (gap(n) CIs, deficit growth) is NOT yet fully evaluable. The genuine deficit is a
      LOWER BOUND (>= 1931); its exact value is unpinned pending CTRL-B. The n=18 gap
      rung is infrastructure-infeasible with the un-chunked DREG_dff.sage (RAM/root-swap);
      not evidence (AGENTS rule 5).
    - >-
      The D6 rank is internally consistent, hash-pinned, and resume-verified, but NOT
      confirmed by a distinct engine (Validator CAVEAT-2) -- it is NOT asserted as
      "independently reproduced". t=3/t=7 binary Weil-descent remains a NEGATIVE CONTROL
      for the prime-field target: no prime-field or crypto-scale positive claim; no break
      (AGENTS 4-7).
    - >-
      Goal-scoped PROPOSAL on the isolated branch; does NOT change the official
      shared-ledger status of H-DREG-001 (co-driver / merge owns that). It sharpens
      DEC-20260720-002 and DEC-GOAL-DREG-001-B001 by adding the admissible D6-at-n=12
      full-column datum and the support-confound correction.
  process_notes:
    - >-
      CAVEAT-4 (Validator) reconciled: the frozen queue declares the validator write_scope
      as reviews/VAL-N12D6.md; the report was renamed from validator-report.md to that path
      before this ledger commit.
    - >-
      Red Team wrote its bounded support-audit control under
      experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/rt-control/ (inside the
      coordinator-owned SNAP-C1 run-dir scope), which is outside RT-R1's reviews-only
      declared write_scope. The Coordinator archives it here as review evidence and records
      the deviation; it did NOT mutate any producer cell.
  next_actions:
