winner_item: "C1"
winner_name: "n=15 completion-criterion ladder rung: >=3 seeds, sem + semi-regular-null-matched control, full-column exact rank"
winner_rationale_pointer: >-
  See sibling ranking.yaml `winner_rationale`. Item B (CTRL-013-OPTIONAL-RERANK)
  is NOT this batch's winner; its restated (non-dispatched) specification is
  carried forward below at `item_b_non_winning_carried_forward` solely so that
  RR-4's "ranking and contract agree by construction" requirement is satisfied
  even though B is not operative this batch.

mechanism: >-
  Measure the exact GF(2) Macaulay rank of the boolean chained Semaev m=3
  system at n=15, t=3, ti=0, for each of 3 pre-registered seeds, for BOTH the
  "sem" system and its T11-support-matched semi-regular-null control, using
  the SAME instrument, mode, and protocol that produced the admitted n=12 D6
  CTRL-B cell (src/h012c_block_m4ri.py, mode chunked_block_m4ri, protocol
  TASK-20260725-701 / DEC-20260725-026, per run_manifest.yaml of
  TASK-20260731-016). This is a completion-criterion rung, not a rank-honesty
  discrimination of OBJ-013-4 -- it targets ledger/goals/GOAL-DREG-001.yaml's
  own `completion_criteria` directly. Evidence is admissible ONLY from
  full-column exact ranks (never a subset-column corank), per that same
  goal record's own admissibility rule (h012 finding iv).

binding_predicate: >-
  RR-4 discharged for the OPERATIVE winning lane, stated IDENTICALLY here and
  in sibling ranking.yaml `one_winner_name` / `pareto_frontier` row C: "A rung
  of the n-ladder completion criterion is SATISFIED for n=15 only when (a) a
  FULL-COLUMN EXACT RANK (never a subset-column corank, per GOAL-DREG-001's
  own admissibility rule and h012 finding iv) is obtained for the 'sem'
  (boolean chained Semaev m=3) system AND for its semi-regular-null-matched
  control, (b) at each of at least 3 independent, pre-registered seeds, (c) at
  the pre-registered degree D (see `open_items` OI-1 in the sibling ranking),
  with (d) validity=completed_valid (never `in_progress_checkpointed`,
  `failed_infrastructure`, or `invalid`) for every one of the 6 required runs,
  and (e) the two-partition consistency control (re-run with a different chunk
  size, requiring identical rank + system_hash, per EXP-DREG-004 `controls`)
  passing for at least the sem arm before any rank is claimed."

required_prediction: >-
  No specific numeric deficit is pre-registered as a required outcome --
  unlike CTRL-013-OPTIONAL-RERANK, this is a MEASUREMENT cell, not a
  discrimination with a predicted delta (matching EXP-DREG-004's own
  `success_criterion: n/a (measurement cell; hypothesis status decisions
  belong to the Coordinator)`). What IS pre-registered is the ADMISSIBILITY
  predicate above: a rung counts toward the completion criterion only if all
  six runs reach validity=completed_valid with the two-partition control
  passing. The measured deficit values themselves (whatever they are) feed
  the existing series 1322/1862/1823/1999 at n=12/15/17/18 and are reported
  as observations, not as a pass/fail verdict on d_reg.

falsification_statement: >-
  This is a measurement cell, not a discrimination, so "falsification" here
  means the rung FAILS TO COUNT toward the completion criterion, never a
  verdict about d_reg or H-DREG-001 in either direction (AGENTS.md rule 5;
  CLAUDE.md rule 3). The rung does not count if: (i) any of the 6 required
  runs (3 seeds x {sem, null}) does not reach validity=completed_valid within
  budget -- a censored/incomplete run is failed_infrastructure for that
  invocation only, per EXP-DREG-004's own invalidation_rules, and the cell
  resumes from its last verified checkpoint rather than being scored a
  negative; (ii) the two-partition consistency control disagrees (rank or
  system_hash mismatch) -- invalidates the cell per EXP-DREG-004 `controls`,
  routes to re-examination of the instrument run, never to a d_reg verdict;
  (iii) a checkpoint-resume identity or per-carry sha256 check fails --
  STOP the cell, mark invalid, report; do not delete state (verbatim from
  EXP-DREG-004 `stopping_rules`). None of (i)-(iii) is evidence against or for
  H-DREG-001; they are validity gates that must clear before any observation
  is interpreted at all (agents/coordinator.md responsibility 6).

exact_budget:
  form: >-
    HANDOFF-ENVELOPE / CHECKPOINTED PATTERN, following EXP-DREG-004's own
    established convention for this instrument at larger n, rather than a
    single-shot total. n=15's true per-seed-arm cost is UNMEASURED within any
    record this task read (sibling ranking.yaml `pareto_frontier` row C,
    `cost_quantitative`); a single-shot budget sized only to the n=12 measured
    cost risks under-budgeting if n=15 is materially larger, exactly as
    happened at n=21 (EXP-DREG-004, 25,000-32,000 s total vs a 2298 s n=12
    baseline).
  maximum_runs: 6 primary cell-runs (3 pre-registered seeds x 2 arms {sem, null}); each primary run may consume multiple checkpointed invocations per EXP-DREG-004 Section 1's pattern (per-invocation cap distinct from the primary-run count).
  wall_clock_seconds_per_turn: 3300   # handoff-envelope convention, matching EXP-DREG-004 specification.yaml `budget.wall_clock_seconds`
  per_invocation_cap_seconds: 300     # matches this execution surface's foreground command cap, per EXP-DREG-004 `budget.per_invocation_cap_seconds` and its D1 deviation note
  wall_clock_floor_total_seconds: 13789.26   # derived lower bound: 6 runs x 2298.21 s (n=12 measured wall_seconds_aggregate, run_manifest.yaml); n=15 is a strictly larger system so TRUE cost is >= this floor, not predicted by it
  memory_gb: 8   # matches the n=12 measured/declared budget (run_manifest.yaml budgets.memory_gb: 8, peak_rss_gb 6.67 for the smaller n=12 system); n=15's larger system makes this a floor, not a ceiling guaranteed sufficient -- if RSS approaches 8 GB during dispatch, the executor must checkpoint and escalate rather than let the process OOM
  max_concurrent: 1
  host_headroom_check: >-
    UNRESOLVED FIGURE -- see sibling ranking.yaml `host_headroom_reconciliation`
    (RR-10). Neither the frozen "load ~5.8" nor the commissioning handoff's
    "load-average ~37" (both dated 2026-08-15) is re-measurable now
    (2026-08-27) or substitutable with an invented current reading. THE
    DISPATCHING SESSION MUST INDEPENDENTLY RE-CHECK current host headroom
    (cores, load average, free disk) AT DISPATCH TIME, sized to
    max_concurrent=1, before launching any invocation of this lane.

deterministic_seeds:
  seeds:
    - seed: 2026
      note: "continuity seed: the same seed used at n=12 (EV-DREG-008), n=17/n=18 (EXP-DREG-004 spec 'validation_status' anchors), and n=21 (EXP-DREG-004). Pre-registered, not chosen after any n=15 trail is seen."
    - seed: 2027
      note: "second pre-registered seed for the >=3-seed replication the completion criterion requires. Not previously used anywhere in the records this task read."
    - seed: 2028
      note: "third pre-registered seed. Not previously used anywhere in the records this task read."
  each_seed_runs: "both the 'sem' system and its semi-regular-null-matched control ('null' arm), per GOAL-DREG-001's own completion_criteria wording."

failure_modes:
  - name: stall
    handling: "if a single invocation does not terminate within its 300 s per-invocation cap, treat as an infrastructure timeout for that invocation only, resume from the last verified checkpoint; never evidence (AGENTS.md rule 5)."
  - name: crash
    handling: "record stderr + resource measurement; failed_infrastructure for that invocation; resume from checkpoint; never evidence."
  - name: enospc
    handling: "if the full-volume ENOSPC pause condition fires, record failed_infrastructure and pause per GOAL-DREG-001 `pause_conditions`; never evidence."
  - name: checkpoint-resume-mismatch
    handling: "if a resume identity check (n,t,ti,D,seed,which) or a per-carry sha256 check fails, STOP the cell, mark invalid, report; do NOT delete state (EXP-DREG-004 stopping_rules, verbatim). Not a d_reg finding."
  - name: input_unavailable
    handling: >-
      RR-6 discharged for this lane. If the n=15 restricted-adjacency
      construction step (or its degree-6 default per OI-1) cannot proceed
      because a required prior artifact (e.g. an n=15 null-adjacency pickle
      analogous to the n=12 one) is absent on the executing host AND cannot
      be regenerated from the pinned protocol within the per-turn budget, OR a
      regenerated matrix's support/system hash does not match a previously
      pinned value, record failed_infrastructure and stop; never evidence.
      This mirrors the n=12 cell's own known residual (run_manifest.yaml
      `instrument.reuse.null_adjacency_pickle` is an absolute path on
      /Volumes/Volume in a different worktree, not tracked in git; VAL-20260822-001
      F-8) -- n=15 has no pre-built adjacency yet at all, so this failure
      mode is MORE likely to fire here than it was for the n=12 rerun, and
      the dispatching session must budget for a from-scratch adjacency build,
      not assume reuse.

output_contracts:
  - "one run record per (seed, arm) pair -- 6 total -- each with: validity status, exact rank (if completed) or checkpoint progress (if in_progress_checkpointed), peak RSS, wall-clock consumed, and the two-partition consistency control result for the sem arm."
  - "a raw machine-readable result file per run under the task's write scope."
  - "an explicit statement, per run, of whether it counts toward the completion criterion per `binding_predicate` above, and why."
  - "an aggregate ladder-rung summary: does n=15 now satisfy the completion criterion's per-n admissibility, pending only n=18?"

claim_boundary: >-
  claim_ceiling (carried forward from DEC-20260812-f56a44, UNCHANGED, NOT
  LOWERED, per this task's own binding constraint):
  rank_honesty_instrument_verification_toy_scale. This label is restated here
  VERBATIM rather than re-derived or relabeled, even though its wording was
  coined for item B's instrument-verification claim; this act does not
  narrow, widen, or relabel it. Item C1's OWN claim, stated separately and
  remaining WITHIN (never above) that ceiling: a completion-criterion ladder
  rung at toy scale, strength preliminary, claim_tier toy. Does NOT by itself
  complete GOAL-DREG-001's completion criterion (which additionally needs
  n=18, currently INFRA-LIMITED). Does NOT move H-DREG-001. Does NOT cite the
  raw 17947 headline except via structural_metric_id `deficit_genuine`
  (quarantined_confounded retained) for whichever n=12-adjacent citations are
  relevant. Admissible ONLY from full-column exact ranks, never subset-column
  coranks (h012 finding iv).

independence_note: >-
  RR-9 DISCHARGED (discharges F-13 of VAL-20260822-001 / CF-4 of
  DEC-20260812-f56a44). REWRITTEN TO REMOVE THE LICENSING SENTENCE ENTIRELY.
  This lane's evidence, when it lands, requires independent review at
  review-adversarial/xhigh, in an independent session, before the lane's run
  is treated as authorized to have happened as evidence. THE RUN DOES NOT
  PROCEED, AND IS NOT AUTHORIZED TO PROCEED, UNTIL (a) this superseding
  ranking and lane contract have themselves cleared their own required
  independent review (per ledger/goals/GOAL-DREG-001.yaml `next_action` step
  (5), TASK-20260827-be6fc9) with a verdict that supports dispatch, AND (b) a
  Coordinator ledger decision has been filed on that verdict authorizing wave
  3. If no distinct or servable xhigh review backend is available at the time
  this lane would otherwise dispatch, THAT IS AN INFRASTRUCTURE STOP ON THE
  RUN, never a license to proceed without review and never a negative result
  about d_reg. NO SENTENCE IN THIS CONTRACT MAY BE READ AS AUTHORIZING
  EXECUTION BEFORE THAT REVIEW RETURNS A SUPPORTING VERDICT. This lane
  contract, by itself, execution_authorized: false.

execution_authorized: false

