pareto_frontier:
  axes:
    - evidence_value:  "how much this action resolves the GOAL completion criterion"
    - cost:             "wall_clock_seconds / trials / host headroom consumed (numbers, not adjectives, per RR-7)"
    - infra_honesty:    "can it be executed cleanly on this host, or is it infra-limited / blocked?"
    - review_history:   "red-team / validator coverage already in place"
  frontier_check_performed: >-
    Every row was checked against every other row on all four axes before any
    `dominated_by` was set. Method: for rows X, Y, X is `dominated_by: Y` only
    if Y is at least as good as X on every axis and strictly better on at
    least one, using the QUANTITATIVE cost figures below (not the ordinal
    words the frozen ranking used). The result of that check is recorded
    per-row in `dominance_check` rather than asserted.
  rows:
    - id: "A"
      name: "Finish or supersede the C2 chain"
      sub_actions:
        - "A1: finish C2 via re-dispatch (fresh write_scope, fresh commit)"
        - "A2: supersede C2 outright with recorded reason, content-first bound"
      evidence_value: "low-to-moderate -- unarchives an EXISTING n=21 D5 partial datum; does not itself move H-DREG-001 or complete the n-ladder criterion (n=21 is past the ladder's {12,15,18} set)"
      cost_quantitative:
        A1: ">= 25,000-32,000 s of further executor wall-clock (EXP-DREG-004 specification.yaml `budget.expected_total_cell_work`, measured cost model, same cell), i.e. re-running or resuming the destroyed/rebuilt checkpoint chain to completion"
        A2: "~0 s additional executor wall-clock; one Coordinator-only content-first archive act plus one independent validator verification of the receipt (RR-8)"
      infra_honesty: "A1 requires executor work and repeats a cell that has already suffered two EXFAT carry-loss incidents (INC-20260725-EXFAT-01, -02) on this host; A2 is a recorded decision over data already produced and content-hash-verified by an independent reviewer"
      review_history: "C2 terminal-state claim independently REPRODUCED FIELD BY FIELD by TASK-20260812-963ec3 (review-report.yaml `c2_reproduction`); zero review of A1 (nothing to review, it has not run)"
      dominated_by: null
      dominance_check: >-
        Checked against B and C. B does not dominate A (B's cost, once
        corrected below, is NOT lower than A2's ~0 s, and B's evidence_value
        does not exceed A's on the C2-relevant axis -- different objects
        entirely). C does not dominate A (C's cost is far higher than A2's and
        C targets a different rung of the ladder). Within row A, A2 dominates
        A1 on both cost and infra_honesty at no loss of evidence_value; THAT
        COMPARISON IS RECORDED HERE, NOT IN `dominated_by` (RR-7 -- a
        sub-action cannot be named in a field that is defined over frontier
        rows).
      sota_delta: >-
        A2 saves >= 25,000-32,000 s of executor wall-clock relative to A1
        (EXP-DREG-004 specification.yaml `budget.expected_total_cell_work`),
        at the cost of one archive act plus one independent verification.
      recommended_sub_action: A2, WITH THE RR-8 REPAIR (see `c2_disposition`).

    - id: "B"
      name: "CTRL-013-OPTIONAL-RERANK: one-column deletion, RESTATED as a pivot-accounting-only bookkeeping check (RR-1)"
      evidence_value: >-
        LOW. Downgraded from the frozen `high`. RE-VERIFIED INDEPENDENTLY IN
        THIS ACT (not merely accepted from the reviewer): the positive arm's
        required prediction is a TAUTOLOGY in the only regime the cheap
        mutation can cheaply reach (see `ctrl013_rerank.positive_arm.derivation`),
        so it cannot discriminate OBJ-013-4 (rank not independently
        re-executed at the sr_pred ceiling). It retains value only as a
        harness/bookkeeping smoke test.
      cost_quantitative: >-
        NOT LOW, contrary to the frozen ranking. The positive arm alone
        (unit 1 only, columns 0-12000) is cheap: 103.72 s observed for that
        exact unit in the source trail
        (coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/chunk-coverage.log,
        line 2, `unit_wall_s: 103.72`). But the required null-object arm (RR-3)
        needs the FULL 174,035-column restricted adjacency loaded and
        processed through unit 15 to be comparable to the committed trail, and
        that is the full pass: wall_seconds_aggregate 2298.21 s
        (run_manifest.yaml `resource_measurements`), the same order as the
        n=12 cell's original measurement. Total realistic cost for BOTH arms
        together is therefore ~2400 s, not the "low" the frozen ranking
        claimed.
      infra_honesty: "cheap for the positive arm alone; the negative arm needs the full adjacency and the same memory profile as the original run (RR-6)"
      review_history: "TASK-20260812-963ec3 (VAL-20260822-001) findings F-1..F-9 BLOCKING/MAJOR on this item as previously specified; all discharged below by ID"
      dominated_by: null
      dominance_check: >-
        Checked against A and C. Neither A nor C dominates B: A operates on a
        different cell/question (n=21 C2 chain) and C targets the n-ladder
        directly at much higher cost, so cost does not make either a strict
        dominator once axes that are not comparable (different objects) are
        held aside. B is not eliminated from the frontier; it is DOWNRANKED by
        its own restated evidence_value and cost, which is what moves the
        overall winner (see `dominance_check_against_the_winner` under item C).
      sota_delta: >-
        Relative to the FROZEN row B (evidence_value high, cost low,
        dominated_by null): evidence_value drops from high to low (loses its
        claimed 100% discriminating credit on OBJ-013-4, which CF-1/CF-2 of
        DEC-20260812-f56a44 and F-1 of VAL-20260822-001 both establish it never
        had); cost rises from an implied "cheap" to ~2400 s once the required
        null arm is priced honestly.

    - id: "C"
      name: "Completion-criterion ladder rungs (n=15, n=18, >=3 seeds, semi-regular null control)"
      sub_actions:
        - "C1: n=15 >=3 seeds + null control  [THIS RANKING'S WINNER, sub-action C1 only]"
        - "C2-ladder: n=18 >=3 seeds + null control (INFRA-LIMITED on this host)"
        - "C3: 12-15-18 ladder completion-criterion decision"
      evidence_value: "very_high -- directly instantiates GOAL-DREG-001's own completion criterion (n in {12,15,18}, >=3 seeds, semi-regular null control), unchanged from the frozen ranking's own (accurate) characterisation"
      cost_quantitative: >-
        NOT MEASURED AT n=15 within any record this agent read; therefore
        stated as a derived LOWER BOUND, not a fabricated point estimate. The
        n=12 D6 cell (smaller system: nb smaller, 174,035 restricted columns)
        measured wall_seconds_aggregate=2298.21 s and peak_rss_gb=6.67 per
        seed-arm (run_manifest.yaml). n=15 has a strictly larger system
        (larger nb, more columns per the sem/null pair), so per-seed-arm cost
        is >= 2298.21 s; the GOAL criterion requires 3 seeds x 2 arms (sem +
        null) = 6 runs, so total cost is >= 6 x 2298.21 s = 13,789.26 s (~3.8
        h) as a FLOOR, not a prediction of the true cost. See `open_items`
        (OI-1) for what remains unresolved before dispatch.
      infra_honesty: >-
        n=15 sem/null is NOT the n=18 un-chunked-first-fall rung that is
        INFRA-LIMITED on this host (DEC-20260810-da7513 NA-5); it uses the
        SAME chunked_block_m4ri instrument and mode that completed cleanly at
        n=12 (run_manifest.yaml `instrument.mode: chunked_block_m4ri`,
        `forbid_honored: [unchunked DREG_dff.sage at D6]`) and, per EXP-DREG-004
        Section 1, is checkpoint-resumable if a single invocation cannot
        finish it. Runnable on this host under max_concurrent=1.
      review_history: "no independent review yet -- this would be the FIRST rung of the ladder to be measured with the full >=3-seed + null-control protocol the completion criterion actually requires"
      dominated_by: null
      dominance_check_against_the_winner: >-
        C is now checked against the RESTATED row B (the only check the
        frozen ranking's reviewer could not perform, because B's restated
        numbers did not exist when it ran -- VAL-20260822-001 F-10). C's
        evidence_value (very_high, directly satisfies a ladder rung of the
        completion criterion) exceeds B's restated evidence_value (low,
        bookkeeping-only, does not touch the completion criterion or OBJ-013-4
        decisively). C's cost is higher in absolute wall-clock terms (>=13,789 s
        floor vs B's ~2400 s), so C does NOT dominate B in the strict
        Pareto sense (B remains cheaper) -- but cost alone does not make B the
        winner: see `winner_rationale`.
      sota_delta: >-
        Completing C1 (n=15, >=3 seeds, null control) is the FIRST rung
        anywhere in this goal's history to satisfy the completion criterion's
        exact wording for one n; nothing else on this frontier does. Relative
        to spending the same budget order on B (~2400 s) for a bookkeeping
        check that does not move the completion criterion at all, C1 spends
        roughly 6x the wall-clock (13,789 s floor) for evidence that
        DIRECTLY counts toward GOAL-DREG-001's stated criterion, which B (in
        its restated form) cannot do at any cost within the cheap-mutation
        family (see `ctrl013_rerank.positive_arm.derivation` -- the tautology
        is structural, not a matter of more budget).

one_winner: "C1"
one_winner_name: "n=15 completion-criterion ladder rung: >=3 seeds, sem + semi-regular-null-matched control, full-column exact rank"
winner_rationale: >-
  RR-7 REQUIRES RE-EVALUATING ROW C'S n=15 RUNG AGAINST THE RESTATED ITEM B AND
  STATING THE WINNER ON THE CORRECTED FRONTIER, WHICHEVER ROW THAT IS -- NOT
  ASSUMING IT STAYS ITEM B. It does not stay item B. Once item B's
  evidence_value is honestly restated (RR-1, discharging F-1/F-2 of
  VAL-20260822-001 and CF-1/CF-2 of DEC-20260812-f56a44), item B provides ZERO
  evidence toward OBJ-013-4 or toward GOAL-DREG-001's completion criterion at
  any achievable cost within the "cheap mutation" family -- the tautology in
  the full-pivot regime is a STRUCTURAL property of that regime
  (`ctrl013_rerank.positive_arm.derivation`), not a defect that more budget
  repairs. Item A (C2) is cheap but resolves a datum outside the n-ladder
  (n=21) and does not move H-DREG-001 or the completion criterion either. Item
  C1 is the ONLY row on this frontier whose completion moves GOAL-DREG-001's
  own stated completion criterion at all, and it is executable on this host
  under the same instrument and mode that already completed cleanly at n=12.
  WINNER: C1. This is a re-decision, not a re-dressing: the frozen ranking's
  `one_winner: "B"` rested on a misattributed discrimination credit
  (DEC-20260812-f56a44 CF-1, CF-2; VAL-20260822-001 F-1), and correcting that
  credit changes which row the objective and cost axes jointly favour.
  ITEM B REMAINS ON THE TABLE FOR A LATER BATCH, restated honestly, and
  OBJ-013-4 remains OPEN -- winning C1 this batch does not close it.

c2_disposition:
  decision: "A2: supersede, WITH THE RR-8 CONTENT-FIRST REPAIR"
  rationale: >-
    Unchanged from the frozen ranking's substance (independently re-confirmed
    by VAL-20260822-001's `c2_reproduction`, which matched every
    PREREG-20260727-N21-C2 field): the terminal state exists, is complete
    (done=true), and its only defect is that it was never archived through a
    SNAP/VAL/LEDGER-C2 chain. What changes here is the BINDING MECHANISM
    (RR-8), not the disposition.
  archive_binding:
    frozen_defect: >-
      The superseded ranking bound the archive "with the branch reference as
      its binding" (`coordinator/goal-dreg-001-b3c2-b4:<path>`). VAL-20260822-001
      F-12 established that branch tip f459d902f60bc711e2e54ac029a7a1ee811de928
      is NOT an ancestor of origin/main and the path does not exist at HEAD --
      a receipt bound to that ref is unverifiable from any clone lacking it,
      which CLAUDE.md's "Archive receipts bind to CONTENT first" doctrine
      exists to prevent.
    the_repair: >-
      Bind to the blob's CONTENT HASH, and bring the bytes onto the official
      line (commit the state.json content into a tracked path under the
      archiving task's write_scope), not to the branch ref. The starting-point
      hash the reviewer computed is
      sha256:74e9e5217e299d3d8b8e2f3cd5e80bdb9ae8dfd46ae4981986dffe567c2dd90f
      (VAL-20260822-001 `c2_reproduction.blob_sha256_computed_by_this_reviewer`
      / F-12 `the_available_repair_this_reviewer_computed`). THIS VALUE IS NOT
      COPIED UNCRITICALLY: the session that performs the archive MUST
      INDEPENDENTLY RE-VERIFY it (`git show
      coordinator/goal-dreg-001-b3c2-b4:experiments/EXP-DREG-004/runs/RUN-DREG-004-REBUILD-A/work/h012c_rebuild_a_sem_n21_t0/state.json
      | shasum -a 256`, or equivalent) before treating it as binding. A hash
      this agent could not itself recompute (no shell) is a POINTER for the
      next session, never a verified fact of this record.
    prereg_durability_limb: >-
      PREREG-20260727-N21-C2.md states its own condition: "The terminal datum
      is durable only after TASK-20260727-N21-SNAP-C2 commits it AND AN
      INDEPENDENT VALIDATOR VERIFIES THE RECEIPT." This ranking does NOT waive
      that limb. The archiving successor task MUST be followed by an
      independent validator verification of the receipt before the C2 datum is
      treated as durable evidence; if that is not feasible in the batch that
      performs the archive, the reason must be recorded there as KNOWINGLY
      WAIVED, never dropped silently. This requirement is independent of
      whether A2 or C1 executes first in this batch.
  what_this_disposition_is_not: >-
    Not evidence about d_reg in either direction (the n=21 D5 cell is not on
    the {12,15,18} ladder and does not by itself move H-DREG-001). Not an
    authorization to execute anything -- the archive, when it runs, is a
    Coordinator-only ledger act on data already produced, exactly as the
    frozen ranking intended, corrected only in HOW it binds.

ctrl013_rerank:
  item_id: "B"
  status: RESTATED AND CARRIED FORWARD, NOT DISPATCHED THIS BATCH.
  form_redecision: >-
    RR-1 DISCHARGED. Two forms exist (DEC-20260810-da7513 NA-4): (i) re-rank
    the restricted adjacency END TO END WITH A SECOND, INDEPENDENTLY-CODED RANK
    ENGINE -- the only form that puts a genuinely independent computation
    against the sr_pred ceiling, which is what OBJ-013-4 is actually about
    (DEC-20260812-f56a44 CF-1); or (ii) retain the cheap one-column-deletion
    mutation, explicitly restated to test PIVOT-ACCOUNTING BOOKKEEPING ONLY and
    explicitly leaving OBJ-013-4's sr_pred-saturation concern OPEN. THIS ACT
    CHOOSES (ii): NO SECOND RANK ENGINE EXISTS IN THIS REPOSITORY AS FAR AS
    THIS AGENT'S READS ESTABLISH (src/h012c_block_m4ri.py is the only rank
    instrument cited anywhere in the records this task read), so building one
    is executor-scale implementation work this Coordinator act neither performs
    nor authorizes (see `open_items` OI-2). The cheap mutation is retained
    ONLY under the restated evidence_value (`pareto_frontier` row B) --
    it may NOT inherit form (i)'s discriminating credit under any wording,
    per RR-1's own terms.
  positive_arm:
    regime: "unit 1 of the committed n=12,t=3,ti=0,seed=2026,D=6 CTRL-B chunk-coverage trail (coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/chunk-coverage.log, line 2)."
    unit_index: 1
    stopping_column_j1: 12000
    trail_row_compared_against: '{"j0": 0, "j1": 12000, "c": 12000, "k": 12000, "rank_acc": 12000}'
    deleted_column_index: 0
    required_prediction: "rank_acc after re-processing columns [0,12000) minus column 0 = 11999, i.e. a drop of exactly 1 relative to the committed row's rank_acc=12000."
    derivation: >-
      RR-2 DISCHARGED. Independently re-verified in this act, from the trail
      bytes directly (not accepted on the reviewer's word): units 1-13 of the
      committed trail each have k = c = 12000 (chunk-coverage.log lines 2-14),
      i.e. EVERY column processed in units 1-13 became a pivot, and rank_acc
      equals j1 exactly at every boundary (12000, 24000, ..., 156000 -- 13 x
      12000 = 156000, matching line 14's rank_acc=156000). This is a
      FULL-PIVOT PREFIX: there are zero non-pivot (redundant) columns present
      anywhere in columns [0,156000). In a full-pivot prefix, deleting ANY
      single column necessarily reduces the accepted-pivot count for that
      prefix by exactly 1, for a STRUCTURAL reason that holds regardless of
      whether the instrument computes rank correctly at all: there is no
      other column present in the prefix that is NOT already a pivot, so
      nothing can "absorb" the vacated slot. THIS DISPOSES OF THE REVIEW'S
      NULL-OBJECT CERTIFICATE BY INDEPENDENTLY RE-DERIVING IT RATHER THAN
      MERELY CITING IT: the maximally dishonest oracle I(M) := ncols(M) passes
      this exact predicate (VAL-20260822-001 F-2), and this act confirms that
      NO CHOICE of unit or column index within units 1-13 can restore
      discriminating power, because the tautology is a property of the WHOLE
      full-pivot regime, not of the particular column chosen. Consequence:
      this arm is retained ONLY as a mechanical bookkeeping / harness-fidelity
      smoke test (does the prefix-rerun tooling correctly reproduce rank_acc
      when re-run with one fewer column), and is explicitly NOT counted as
      evidence toward OBJ-013-4 or toward instrument rank-honesty at the
      sr_pred ceiling.
  negative_arm:
    regime: "unit 15 of the same committed trail (chunk-coverage.log, line 16) -- the fully deficient final unit."
    unit_index: 15
    stopping_column_j1: 174035
    trail_row_compared_against: '{"j0": 168000, "j1": 174035, "c": 6035, "k": 0, "rank_acc": 156520}'
    deleted_column_index: 168000
    required_prediction: "rank_acc after re-processing the full 174,035-column restricted adjacency minus column 168000 = 156520, i.e. a drop of exactly 0."
    derivation: >-
      RR-3 DISCHARGED (null-object arm added, with its own predicted value).
      Unit 15 as originally processed contributed k=0 pivots across all 6035
      of its columns (chunk-coverage.log line 16): column 168000, like every
      other column in that unit, was found linearly dependent on the
      already-accepted basis of rank 156520. Deleting column 168000 from the
      input before reprocessing does not change the accepted-pivot basis
      established by columns [0,168000) (that basis is determined entirely by
      columns strictly BEFORE 168000, none of which are affected by removing
      a column that comes after them), and every OTHER column of unit 15 is
      evaluated against that SAME fixed basis whether or not column 168000 is
      present, because column 168000 itself never became a pivot and so was
      never part of any later column's predecessor basis either. The process
      therefore ends at the identical rank_acc=156520: delta EXACTLY 0. This
      is a checkable consequence of k=0 for that unit, not an assumption.
    decay_statement: >-
      RR-3's second requirement. As the comparison point is pushed PAST the
      deficient boundary (past unit 13's j1=156000) into units 14-15, the
      POSITIVE arm's tautological "-1" no longer holds automatically once
      genuinely redundant columns exist in the prefix. For a column that WAS
      one of unit 14's 520 pivots, the honest expected delta is NOT
      guaranteed to stay at -1 as the prefix is extended further: the
      restricted matrix's total rank deficiency is 174035-156520=17515
      (independently recomputed in this act from `ncols_restricted=174035`,
      admission metric `restricted_ncols_equals_174035=True`, and
      `rank_null_restricted=156520`), so there is ample redundancy in the
      remaining columns for a later column to become independent and take
      over a vacated pivot role once the original pivot is removed. The
      expected delta therefore DECAYS from a possible transient -1 (measured
      immediately after removal, before any later column can compensate)
      toward 0 as the measurement point is pushed further into the tail.
      Because the exact decay trajectory would require re-running the entire
      remaining prefix per candidate column -- effectively the full re-rank,
      form (i) of RR-1 -- it is NOT specified further within the cheap
      mutation's scope, and NO positive discrimination in the deficient region
      is claimed by this restated item.
  binding_predicate: >-
    RR-4 DISCHARGED, STATED ONCE, CORRECTLY: "k, the number of pivots gained
    while processing a unit, equals THAT UNIT's own width (i.e. every column
    of that unit became a pivot -- a 'full-pivot unit'). It does NOT mean k
    equals the width of the whole restricted matrix (174,035 columns), which
    no unit in the committed trail ever reaches." This exact sentence appears
    IDENTICALLY in lane-contract.yaml `item_b_non_winning_carried_forward.binding_predicate`,
    so the two artifacts agree by construction rather than by coincidence
    (discharging VAL-20260822-001 F-5 / DEC-20260812-f56a44 CF-3).
  falsification_statement: >-
    RR-5 DISCHARGED. Positive (bookkeeping) arm: FALSIFIED if (i) no early
    full-pivot unit can be bound by the trial -- recorded as a named
    OBSTRUCTION on the mechanism, never a null on d_reg (this limb is
    UNCHANGED from the frozen contract; VAL-20260822-001 credits it as
