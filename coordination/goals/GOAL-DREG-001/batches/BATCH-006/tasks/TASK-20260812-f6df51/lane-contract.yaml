winner_item: "B"
winner_name: "CTRL-013-OPTIONAL-RERANK one-column deletion rank-honesty mutation"
mechanism: >-
   Take the restricted-adjacency matrix for the admitted CTRL-B cell
   (n=12, t=3, ti=0, seed=2026, D=6, the cell of EV-DREG-008), pick an
   early unit whose width k equals the matrix width (k=width, e.g.
    column 0 of the earliest unit), delete that one column, and re-run a
   short prefix rank pass against the committed rank trail.

required_prediction: >-
   The accumulated rank rank_acc must drop by exactly 1 relative to the
   committed trail (i.e. the deleted column contributed exactly one
    independent row). This is the falsifiable prediction of the rank-
    honesty discrimination OBJ-013-4.

falsification_statement: >-
   FALSIFIED if any of: (i) no early unit with k=width can be bound by
   the trial — recorded as an OBSTRUCTION on the mechanism, not a null
   on d_reg; (ii) rank_acc does not drop by exactly 1 when the column
    is deleted; (iii) the deletion cannot be reproduced at the committed
   trail. A drop != 1, or no drop, or an unbindable unit, falsifies the
   discrimination.

exact_budget:
   maximum_runs: 1
   wall_clock_seconds: 3600
   memory_gb: 2
   max_concurrent: 1
   host_headroom_check: "14 cores; load ~5.8 (opening, 10 users earlier); root / free 70Gi; chunked D6 completes (EV-DREG-008). Sized to max_concurrent=1."

deterministic_seeds:
   - seed: 2026
     note: "the seed of EV-DREG-008's admitted CTRL-B cell; the prefix-rank trail is the committed trail of that cell"

failure_modes:
   - name: "stall"
     handling: "if the prefix rank does not terminate within 3600 s, record it as an infrastructure timeout (failed_infrastructure, never evidence) and stop; no d_reg conclusion."
   - name: "crash"
     handling: "record stderr + resource measurement; failed_infrastructure; no evidence."
   - name: "enospc"
     handling: "root / is 70Gi free; if it hits the full-volume ENOSPC pause condition, record failed_infrastructure and pause per GOAL-DREG-001 pause_conditions; never evidence."
   - name: "no-bindable-unit"
     handling: "if no k=width early unit binds, report the obstruction (k values tried, why none bound); the mechanism is falsified, not d_reg."

output_contracts:
   - "a single run record with: cells tried, units bound, rank_acc before/after the deletion, the observed delta, and a verdict against the 'drop exactly 1' prediction."
   - "a raw machine-readable result file under the task's write scope."
   - "an explicit statement that this is a rank-honesty discrimination at toy scale, NOT a d_reg measurement, NOT a completion-criterion ladder rung, and NOT a crypto-scale claim."

claim_boundary: >-
   rank-honesty instrument verification at toy scale. Strength
