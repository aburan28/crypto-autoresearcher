ctrl013_rerank:
   item_id: "B"
   mechanism: "delete one column from an early unit with k=width, re-run short prefix rank"
   required_prediction: "rank_acc drops by exactly 1 against the committed trail"
   obstruction_if_none_bound:
     name: "no-such-unit"
     description: >-
        If no k=width early unit can be bound by the trial, the mechanism
        fails. In that case record it as a named OBSTRUCTION (not a null
        result), state which k values were tried and why none bound, and
        the failure is on the mechanism, not on d_reg.
   falsification_statement: "a short prefix-rank pass over the
        restricted adjacency with one early unit's column
        0 deleted; rank_acc must drop by exactly 1. The
        mutation is falsified by a run that does not drop by exactly
        1; by a trial that cannot find a k=width early unit to bind;
        or by no change in rank_acc under the deletion."

