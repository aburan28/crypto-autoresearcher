pareto_frontier:
   axes:
     - evidence_value:   "how much this action resolves the GOAL completion criterion"
     - cost:             "wall_clock_seconds / trials / host headroom consumed"
     - infra_honesty:    "can it be executed cleanly on this host, or is it infra-limited / blocked?"
     - review_history:   "red-team / validator coverage already in place"
   rows:
     - id: "A"
       name: "Finish or supersede the C2 chain"
       sub_actions:
         - "A1: finish  C2 via re-dispatch (fresh write_scope, fresh commit)"
         - "A2: supersede  C2 outright with recorded reason"
       evidence_value: high
       cost: medium
       infra_honesty: "A1 requires executor work; A2 is a recorded decision, very cheap"
       review_history: "none yet"
       dominated_by: "A2"
       sota_delta: "A2 is cheaper and does not leave evidence unarchived"
       rationale: >-
         C2's terminal state IS already on a never-pushed local branch
         (coordinator/goal-dreg-001-b3c2-b4), done=true,
         rank_acc=265950, pred=268674, next_col=778394, EXFAT-recovered,
         hash-verified. Its only defect is that it never got a SNAPSHOT /
         VAL-C2 / LEDGER-C2 chain. That is fixable by a fresh coordinator
         ledger act, not by re-running it. Re-dispatching the executor
         portion (A1) is more expensive, and the data is already in
         hand for the snapshot + ledger chain.

     - id: "B"
       name: "CTRL-013-OPTIONAL-RERANK: one-column deletion rank-honesty mutation"
       evidence_value: high
       cost: low
       infra_honesty: "cheap; prefix rank is not host-unsafe"
       review_history: "OBJ-013-4 disposition is NOT FALSIFIED; the discrimination
                       was never run"
       dominated_by: null
       sota_delta: null
       rationale: >-
         Cheapest remaining discrimination on rank honesty; addresses
         OBJ-013-4. It's a new measurement with a falsifiable prediction
         (rank_acc drops by exactly 1 when column 0 is deleted from an
         early unit with k=width). No evidence against it exists.
         Pareto-optimal on (evidence_value / cost) axis.

     - id: "C"
       name: "Completion-criterion ladder rungs (n=15, n=18, >=3 seeds,
                semi-reg null control)"
       sub_actions:
         - "C1: n=15 >=3 seeds + null control"
         - "C2-ladder: n=18 >=3 seeds + null control   (INFRA-LIMITED on this host)"
         - "C3: 12-15-18 ladder completion-criterion decision"
       evidence_value: very_high
       cost: high
       infra_honesty: "n=15 is runnable; n=18 first-fall is INFRA-LIMITED
                       (un-chunked instrument host-unsafe at D6, DEC-20260810-da7513
                       record). n=18 gap rung cannot be measured this session."
       review_history: "no independent review"
       dominated_by: null
       sota_delta: "completing C would satisfy the completion criterion;
                    no single batch on this host can do it all"
       rationale: >-
         C is the completion criterion proper. But C-ladder rung n=18 is
         INFRA-LIMITED, and even without that constraint a full
         18x3 + null-control ladder exceeds one batch's host budget under
         max_concurrent=1. C is therefore ranked last for the final-batch
         spend on this host: it is what we most want, but the one batch
         we have cannot deliver it. It becomes the target when n=18
         infra is fixed.

one_winner: "B"
