  blind_rederivation_j1:
    quantity: >-
      Whether "k = width for an early unit" (the positive arm's binding
      predicate) FORCES the accumulated-rank prefix to drop by exactly 1 upon
      deleting any single column of that unit, as a structural tautology
      independent of the deleted column's identity and independent of whether
      the rank instrument computes genuine linear algebra at all.
    derivation_performed_before_reading_any_producer_text: >-
      Worked purely from the mutation's own definition as stated in the
      assigning task (delete one column from an early unit with k=width;
      re-run a short prefix rank), before opening ranking.yaml,
      lane-contract.yaml, or the sibling review-report.yaml. k=width for a
      unit means every column processed in that unit was accepted as a pivot
      in sequence; this is the standard equivalence to the unit's w columns
      being JOINTLY linearly independent modulo the prior accumulated column
      space (sequential-pivot-at-every-step iff joint linear independence).
      Deleting any one column leaves a (w-1)-subset of a linearly independent
      set, which remains linearly independent (subsets of independent sets are
      independent) -- so all w-1 survivors are still accepted as pivots when
      reprocessed, and the prefix rank measured at the SAME stopping point
      (the end of that unit; no other unit's data changes) is forced to
      (prior rank) + (w-1), a drop of exactly 1 FROM THE ORIGINAL VALUE. This
      is a pure dimension-counting fact -- it holds for ANY column-acceptance
      rule that satisfies "accepted count = width iff jointly independent",
      including a maximally dishonest oracle that just counts columns, which
      is exactly why the predicted "-1" cannot by itself discriminate a
      genuine rank engine from one that computes nothing. No additional
      assumption beyond k=width and a fixed stopping point at the unit's own
      boundary is needed; the conclusion is invariant to WHICH column is
      deleted within a full-pivot unit.
      Known-false-object check performed as part of this same derivation
      (before reading the producer's text): applying the identical reasoning
      to a unit where k != width (some columns are non-pivots) does NOT force
      a drop of exactly 1 -- deleting a non-pivot column forces a drop of
      exactly 0 (a separate, equally-forced tautology, shown below), while
      deleting one of the k pivot columns from a deficient unit leaves the
      outcome UNDETERMINED by k and width alone (it depends on whether a
      previously-redundant column becomes independent once the specific pivot
      is removed, which is additional information the mutation's own
      definition does not supply). The derivation therefore correctly refuses
      to force an answer outside the full-pivot regime -- it does not prove
      too much.
    producer_text_read_after: >-
      ranking.yaml `ctrl013_rerank.positive_arm.derivation` was then read.
      AGREEMENT: the producer's derivation states the identical structural
      argument ("a FULL-PIVOT PREFIX ... deleting ANY single column
      necessarily reduces the accepted-pivot count ... for a STRUCTURAL
      REASON that holds regardless of whether the instrument computes rank
      correctly at all") and explicitly re-derives, rather than merely cites,
      the null-object certificate (I(M):=ncols(M) passes the predicate),
      matching this reviewer's independent conclusion exactly.
    adversarial_extension_this_reviewer_performed: >-
      Checked whether the "subset of independent set" argument secretly
      depends on the M4RI-style instrument's internal column-processing ORDER
      (it does not need to: the fact "rank(prior UNION block) increases by
      exactly width" is a pure column-space/dimension statement, order-
      independent, so the tautology is even more robust than a purely
      sequential framing would suggest -- no internal-algorithm assumption is
      smuggled in).
    result: HOLDS. Independent re-derivation agrees with the producer's text.

  blind_rederivation_j2:
    quantity: >-
      The claimed 13,789.26 s floor for a full n=15 completion-criterion rung
      (3 seeds x 2 arms, at the per-run cost measured for the admitted n=12,
      D=6 cell).
    ordering_performed: >-
      `experiments/EXP-DREG-004`'s own directory was searched FIRST for a
      run_manifest carrying `resource_measurements.wall_seconds_aggregate` for
      an n=12/D6 cell, per the assigning task's pointer -- NONE EXISTS THERE
