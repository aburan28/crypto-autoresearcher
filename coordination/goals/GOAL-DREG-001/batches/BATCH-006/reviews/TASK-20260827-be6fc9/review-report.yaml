  pareto_adjudication:
    axes_declared: [evidence_value, cost, infra_honesty, review_history]
    method: >-
      For rows X, Y (of {A, B, C}), X is dominated_by Y only if Y is at least
      as good as X on every declared axis and strictly better on at least one,
      using the QUANTITATIVE cost figures the v2 artifact supplies (A2 ~0 s;
      B (restated) ~2400 s total for both arms; C1 >=13,789.26 s floor) rather
      than ordinal words alone. Attempted independently, without reading the
      producer's own `dominance_check` text first, then compared.
    row_A_ic_no_dominator_found: >-
      A2's cost (~0 s) is lower than any other row's; nothing can dominate A
      on cost while being "at least as good" elsewhere, since dominance
      requires being at least as good on EVERY axis. `dominated_by: null`
      CONFIRMED CORRECT.
    row_B_no_dominator_found: >-
      C's evidence_value (very_high) exceeds B's restated evidence_value
      (low), but C's cost (>=13,789 s) is far worse than B's (~2400 s), so C
      is not "at least as good on every axis" and does not dominate. A's cost
      is lower than B's, but A's evidence_value and B's operate on different
      objects (the n=21 C2 chain vs. the n=12 rank-honesty pivot-accounting
      check), so a strict ordering across incommensurable objects is not
      forced either way; no dominating row is constructed. `dominated_by:
      null` CONFIRMED CORRECT, matching the prior round's own P4 finding on
      the frozen row.
    row_C_no_dominator_found: >-
      A's cost is far lower but A's evidence_value is worse (low-to-moderate
      vs very_high) -- fails "at least as good on every axis". B's cost is
      lower but B's evidence_value is worse (low vs very_high) -- same
      failure. `dominated_by: null` CONFIRMED CORRECT.
    quantitative_sota_delta_check: >-
      Row A: quantitative (>= 25,000-32,000 s saved, cited to
      specification.yaml). Row C: quantitative ("roughly 6x the wall-clock
      (13,789 s floor)" relative to B, an internally consistent ratio given
      13789.26 / 2298.21 = 6.0 exactly by construction). Row B: PARTIALLY
      quantitative -- the cost component of its delta is a genuine number
      (~2400 s), but the evidence_value component is stated in ordinal words
      ("drops from high to low") rather than as a number. This is a real,
      if minor, incomplete discharge of RR-7's "quantitatively" instruction
      on one row out of three; the load-bearing (decision-relevant) figure on
      that row IS quantified, and the qualitative language is accompanied by
      a specific mechanistic justification (loss of OBJ-013-4 discrimination
      credit, cited to CF-1/CF-2 and F-1) rather than a bare adjective.
      Recorded as a limitation, not a joint break.
    known_false_object_3_n18_check: >-
      Applied the ranking's own winner-selection reasoning to the n=18 gap
      rung, which the goal record has declared INFRA-LIMITED since BATCH-003
      (DEC-20260810-da7513 NA-5). The reasoning that selects C1 explicitly
      turns on INSTRUMENT/MODE identity with the already-proven-safe n=12
      cell ("uses the SAME chunked_block_m4ri instrument and mode that
      completed cleanly at n=12" -- lane-contract.yaml `mechanism`;
      ranking.yaml `pareto_frontier` row C `infra_honesty`), whereas n=18's
      gap rung specifically requires "the un-chunked first-fall instrument",
      which DEC-20260810-da7513 names as the host-unsafe one. Applying the
      SAME test to n=18 does NOT select it: n=18 fails the instrument-match
      criterion that n=15 passes. `ladder_rungs.infra_limited` in ranking.yaml
      correctly keeps n=18 out of `winner_this_batch`, unchanged from the
      frozen v1 characterisation, and the v1 report's own P7 finding (that
      this control does not fire) is independently reconfirmed here for v2.
      FAILURE SIGNATURE: the control correctly does NOT fire, i.e. the
      selection logic is shown to track genuine instrument-level
      executability rather than mechanically crediting every ladder rung.
    result: HOLDS.

