    clause_examined: lane-contract.yaml `independence_note` (v2, RR-9 discharge)
    the_defect_it_replaces: >-
      The v1 clause closed with "The lane's executor run proceeds; its review
      does not fabricate" -- a licensing sentence that permitted the run to
      proceed independent of review outcome (F-13 / CF-4). That sentence is
      ABSENT from v2; confirmed by direct text inspection of the extracted
      git-show bytes.
    adversarial_reading_performed: >-
      Attempted to construct any sequence of events -- a partial review, a
      timeout, an infrastructure stop, a differently-worded verdict -- under
      which the v2 clause could be read as permitting C1 to run without a
      supporting review having already landed.
        (a) Missing verdict (timeout / infra stop on the review itself): the
            clause requires "(a) ... a verdict that supports dispatch, AND
            (b) a Coordinator ledger decision ... " as a conjunction; absent
            any verdict, condition (a) is unmet by construction, and the
            clause separately states "If no distinct or servable xhigh review
            backend is available ... THAT IS AN INFRASTRUCTURE STOP ON THE
            RUN, never a license to proceed without review." No gap found.
        (b) A REVISE-class verdict: this program's own precedent
            (DEC-20260812-f56a44's SC-6/DC-7 handling of the prior round's
            REVISE) already establishes institutionally that REVISE is
            block-and-repair, never dispatch-supporting; nothing in v2's
            clause contradicts or weakens that.
        (c) A categorical backstop clause is also present and independently
            sufficient: "NO SENTENCE IN THIS CONTRACT MAY BE READ AS
            AUTHORIZING EXECUTION BEFORE THAT REVIEW RETURNS A SUPPORTING
            VERDICT," plus the document-level field `execution_authorized:
            false`, independently confirmed as a literal YAML boolean via
            `yaml.safe_load` (not a string, not omitted).
      NO CONSTRUCTION SUCCEEDED. No reading was found under which an
      unreviewed run could proceed.
    residual_wording_gap_disclosed: >-
      "a verdict that supports dispatch" is not pinned to the literal token
      `PASS`; a bad-faith or careless future reader could in principle invent
      an intermediate verdict label and claim it "supports dispatch" without
      it being the clean PASS this program's schema anticipates. This
      reviewer could not construct an actual exploit of this gap given the
      categorical backstop clause and the explicit `execution_authorized:
      false` field, but records the wording imprecision as a minor,
      non-blocking limitation rather than silently closing it.
    result: HOLDS.

  proves_too_much_controls:
    - object: "KNOWN-FALSE OBJECT 1 -- a column at k != width (RR-4's binding predicate's excluded condition)."
      conclusion_that_would_be_known_false_if_forced: "The prefix rank is forced to drop by exactly 1 upon deletion, regardless of which column is deleted."
      does_this_reviewers_own_rederivation_force_that_conclusion_here: >-
        NO -- CORRECTLY DOES NOT FIRE. Deleting a genuinely non-pivot column
        from a k<width unit is ALSO forced, but to a drop of exactly 0 (shown
        independently: removing an already-dependent vector does not change
        the span available to any later column, so no other column's
        pivot/non-pivot status changes). Deleting one of the k pivot columns
        from a k<width unit is NOT forced to any single value by k and width
        alone -- it depends on whether a previously-redundant column becomes
        independent once that specific pivot is removed, information the
        mutation's own parameters (k, width) do not supply. This reviewer's
        derivation logic therefore correctly distinguishes the full-pivot
        (k=width) regime, where the drop-of-1 conclusion IS forced, from the
        deficient (k!=width) regime, where no single value is forced by k and
        width alone. Consistent with the producer's own `decay_statement`,
        which makes the identical distinction.
      failure_signature_stated: >-
        The argument does NOT go through where its conclusion would be known
        false -- it correctly returns "not forced by k, width alone" instead
        of a spurious "-1". This is the expected, correct behaviour of a
        sound derivation applied to a known-false object.
    - object: "KNOWN-FALSE OBJECT 2 -- the n=18 sibling rung, declared INFRA-LIMITED on this host since BATCH-003."
      conclusion_that_would_be_known_false_if_selected: "This lane is the executable winner."
      does_the_rankings_own_selection_logic_select_it: "NO -- see `pareto_adjudication.known_false_object_3_n18_check` above."
      failure_signature_stated: >-
        The control correctly does NOT fire: the selection logic explicitly
        turns on instrument/mode identity with the proven-safe n=12
        chunked_block_m4ri cell, which n=18's un-chunked first-fall
        requirement fails to satisfy. The selection is shown to track genuine
        executability rather than mechanically crediting every rung of the
        stated completion criterion.

