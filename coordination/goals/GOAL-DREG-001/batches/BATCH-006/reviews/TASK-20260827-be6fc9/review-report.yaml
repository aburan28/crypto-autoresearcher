      performed and recorded at that point, before the producer's own
      `cost_quantitative` / `wall_clock_floor_total_seconds` text was read.
    task_card_pointer_discrepancy_disclosed: >-
      The assigning task's read_scope named `experiments/EXP-DREG-004/` as
      where this figure should be found ("wherever it lives under this
      experiment's run directories"). `experiments/EXP-DREG-004` contains no
      file with `wall_seconds_aggregate` anywhere in its tree (confirmed by
      grep across the full experiment directory); it is an n=21/D5 cell whose
      own measured cost is a DIFFERENT figure entirely (25,000-32,000 s,
      per specification.yaml `budget.expected_total_cell_work`). The n=12/D6
      figure the task and both ranking artifacts actually cite lives under
      EXP-DREG-001 / the BATCH-005 TASK-20260731-016 task directory. This is a
      pointer error in the task card, not in the reviewed artifacts (both
      ranking.yaml and lane-contract.yaml correctly cite
      `run_manifest.yaml` under TASK-20260731-016, not EXP-DREG-004). Recorded
      as a limitation of the assigning task, not a defect of the reviewed
      artifacts.
    producer_text_read_after: >-
      ranking.yaml `pareto_frontier` row C `cost_quantitative` and
      lane-contract.yaml `exact_budget.wall_clock_floor_total_seconds:
      13789.26` were then read. EXACT MATCH to this reviewer's independently
      computed figure and independently located source, both in the cited
      value (2298.21) and in the run-count arithmetic (6 = 3 seeds x 2 arms,
      grounded in `ledger/goals/GOAL-DREG-001.yaml` `completion_criteria`'s own
      wording, ">=3 seeds ... with the semi-regular null control").
    scaling_assumption_scrutinised: >-
      The "n=15 has a strictly larger system, so this is a floor" framing
      rests on nb(15) > nb(12). This reviewer confirmed nb(12)=24 (raw-result.json)
      and nb(21)=42 (EXP-DREG-004 specification.yaml), consistent with an
      nb=2n pattern that would put nb(15) at 30 -- but NEITHER ranking.yaml nor
      lane-contract.yaml SHOWS this arithmetic; "larger nb, more columns" is
      asserted rather than derived from a cited nb(15) value, because no
      record either artifact or this reviewer read states nb(15) directly.
      This is a genuine, disclosed-below gap in derivation rigor (the
      underlying claim is very likely true -- more variables at a fixed
      degree D generically yields a same-or-larger monomial/column count, and
      GF(2) block-elimination cost is monotone in matrix size -- but it is an
      UNSTATED extrapolation from two data points, not a cited measurement).
      This reviewer attempted, per the assigned breaking-artifact test, to
      construct a scenario where n=15's true cost is LOWER than n=12's: no
      such construction succeeds, because the one confirmed uncertainty (the
      degree D used for the pre-existing single-seed n=15 anchor, OI-1) does
      not bear on THIS floor's validity -- the floor compares n=15 AT THE SAME
      D=6 the winning lane pre-registers, not at whatever D the old anchor
      used, so the D-uncertainty does not license a lower-cost scenario for
      this specific comparison.
    result: >-
      HOLDS. No mismatch between the cited number and the source file, no
      run-count arithmetic error, and no successful construction of a
      lower-cost scenario. One documentation-rigor gap recorded as a
