      coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/run_manifest.yaml
      (also mirrored in results.json and raw-result.json), which is EXP-DREG-001's
      cell, not EXP-DREG-004's, and `resource_measurements.wall_seconds_aggregate:
      2298.21` was read there DIRECTLY, before ranking.yaml or lane-contract.yaml
      (the v2 or v1 artifacts) were opened at all. The independent computation
