      claim_examined: >-
        ranking.yaml lines 56-61: item B is the "Cheapest remaining discrimination
        on rank honesty; addresses OBJ-013-4"; and lines 52-53 record its
        review_history as "OBJ-013-4 disposition is NOT FALSIFIED; the
