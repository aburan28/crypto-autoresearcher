        coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/red_team_report.yaml,
        objection OBJ-013-4, title "Rank not independently re-executed", claim:
        "Without a second engine/re-rank, rank_null_restricted=156520 could still
        be an instrument bug THAT SATURATES AT sr_pred."
      why_the_selected_mechanism_cannot_reach_it: >-
        THE OBJECTION IS ABOUT A CEILING, AND THE MECHANISM NEVER APPROACHES THE
        CEILING. The committed trail for the cell
        (coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/chunk-coverage.log,
        15 units, read in full by this reviewer) shows the alleged saturation
        appearing ONLY in unit 14: units 1-13 each have k = 12000 = unit width and
