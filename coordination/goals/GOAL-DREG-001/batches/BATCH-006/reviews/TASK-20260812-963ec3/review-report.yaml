    - >-
      IT IS NOT EVIDENCE ABOUT d_reg IN EITHER DIRECTION. Nothing here supports,
      weakens or bears on H-DREG-001, the deficit_genuine number, or any
      cryptographic-scale statement. H-DREG-001 stays `inconclusive`; raw 17947
