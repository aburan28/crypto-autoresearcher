  verdict_calibration:
    why_not_pass: >-
      Four BLOCKING findings (F-1..F-4) sit on the ranking's operative conclusion
      `one_winner: "B"` and on the lane contract's `required_prediction`. A PASS
      would license spending a batch on a measurement that, as specified, cannot
