      the_correct_predicate_is_recorded_elsewhere: >-
        ranking.yaml line 129 has "delete one column from an early unit with
        k=width", and the upstream red_team_report.yaml has "dropping one early
        FULL-PIVOT kept column" -- i.e. k, the pivots gained in the unit, equals
