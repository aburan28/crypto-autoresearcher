        rank_acc=156520; unit 15 (j0=168000, c=6035) has k=0. sr_pred = 156520 =
        rank_null_full = rank_null_restricted. ALL of the information that could
        distinguish an honest saturation from an sr_pred ceiling lives in units 14
        and 15. A "short prefix rank" over an EARLY unit terminates at rank_acc <=
        156000 and never touches that regime.
      the_credit_being_inherited: >-
        DEC-20260810-da7513 NA-4 names TWO forms of CTRL-013-OPTIONAL-RERANK:
        "re-rank the restricted adjacency END TO END, or run the cheaper
        discriminating mutation". Only the first puts a second engine against the
        ceiling, which is what OBJ-013-4 asks for; the red team's own gloss of the
        mutation is narrower -- "Failure would indicate PIVOT ACCOUNTING artifact".
        The ranking selects the cheap form and claims the expensive form's
        discriminating credit for it.
      consequence: >-
        The ranking's central conclusion `one_winner: "B"` rests on a
        misattribution of what the winner tests. This is not repaired by editing
        the contract; it requires re-deciding the form.
    - id: F-2
      severity: BLOCKING
      title: >-
        IN THE REGIME THE MECHANISM'S OWN BINDING PREDICATE SELECTS, THE REQUIRED
        PREDICTION IS A TAUTOLOGY. A NULL-OBJECT ORACLE THAT COMPUTES NO RANK AT
        ALL PASSES IT.
      derivation_from_the_committed_trail: >-
        The binding predicate is "an early unit with k=width" (ranking.yaml line
        129; red_team_report.yaml "one early FULL-PIVOT kept column"). In the
        committed trail, every unit satisfying it is one of units 1-13, and across
        exactly those units rank_acc IS NUMERICALLY IDENTICAL TO THE NUMBER OF
        COLUMNS PROCESSED: rank_acc = j1 at every boundary from 12000 through
        156000. Recomputed by this reviewer: 13 x 12000 = 156000, and 13 x 12000 +
        520 + 0 = 156520 = the reported rank_null_restricted.
      the_null_object: >-
        Let I be the maximally dishonest oracle I(M) := ncols(M) -- it performs no
        linear algebra whatsoever and is precisely the pivot-accounting artifact
        OBJ-013-4 posits. Apply the lane contract's procedure to I: delete one
        column from an early unit, re-run the short prefix pass. I returns exactly
        one less than before. The contract's `required_prediction` -- "rank_acc
        must drop by exactly 1 relative to the committed trail" -- IS SATISFIED,
        and the contract records CONFIRMED.
      failure_signature: >-
        AN ARGUMENT THAT STILL GOES THROUGH WHERE ITS CONCLUSION IS FALSE IS WRONG
        SOMEWHERE. Here the conclusion ("the instrument's rank accounting is
        honest") is KNOWN FALSE for I by construction, and the procedure confirms
        it anyway. The measurement has no discriminating power in the regime it
        operates in.
      the_other_horn: >-
        Extending the pass out of that regime does not save it, it inverts it. On
        the full restricted matrix the rank deficiency is 174035 - 156520 = 17515,
        and units 14-15 alone supply 18035 columns that contributed only 520
        pivots. Deleting one early pivot column there is very likely to be
        absorbed by a later column becoming independent, so the honest answer
        becomes a drop of 0 -- which limbs (ii) and (iii) of the
        `falsification_statement` record as FALSIFYING the discrimination. THE
        CONTRACT DOES NOT SAY WHICH REGIME IT IS IN. In one it cannot fail; in the
        other a correct instrument fails it.
    - id: F-3
      severity: BLOCKING
      title: THE PREFIX LENGTH IS UNSPECIFIED, SO THE FREE PARAMETER IS CHOSEN AFTER THE FACT.
      detail: >-
        "a short prefix rank pass" (lane-contract.yaml line 26-32, ranking.yaml
        lines 138-143) fixes no stopping column, no unit index, and no comparison
        point on the committed trail. Which unit is "early" and how short is
        "short" are exactly the choices that decide whether F-2's first horn or
        second horn applies. A pre-registered prediction whose truth value is set
        by a parameter the executor picks after seeing the trail is not
        pre-registered in the sense that matters.
      what_would_repair_it: >-
        Name the unit index, the exact stopping column j1, the exact committed
        trail row being compared against, and the deleted column index, BEFORE the
        run.
    - id: F-4
      severity: BLOCKING
      title: NO NULL-OBJECT CONTROL. A ONE-ARM DISCRIMINATION IS NOT A DISCRIMINATION.
      governing_requirement: >-
        docs/inventor-protocol.md Section 3, "Controls before belief": "Run the
        identical measurement against a null object -- a random function, a random
        bijection, a random instance of the same shape. If the numbers match,
        record a controlled null, not a finding." And its first move: "Ask what
        the measured quantity SHOULD do as the parameter that is supposed to
        destroy it increases; if it does not do that, suspect the measurement."
      what_is_missing:
        - >-
          NEGATIVE ARM. The obvious control is to apply the identical deletion to
          a column KNOWN to contribute no pivot, with the predicted result NO
          DROP. Without it, "drop = 1" is uninterpretable: the contract cannot
          distinguish a dishonest instrument from an honestly-chosen dependent
          column, and in fact its `falsification_statement` limb (ii)/(iii)
          records "no drop" as falsifying the DISCRIMINATION, i.e. it would blame
          the instrument for the reviewer's column choice.
        - >-
          DECAY STATEMENT. The parameter meant to destroy the effect is the prefix
          length: past unit 13 the deletion should stop moving rank_acc. The
          contract states no such expectation and, as written, would record the
          expected decay to 0 as a falsification.
        - >-
          SAME-SHAPE NULL INSTANCE. No random or shuffled matrix of the same
          dimensions is run through the identical pass to show the procedure
          discriminates anything at all.
      note: >-
        `output_contracts` asks for "rank_acc before/after the deletion, the
        observed delta, and a verdict" -- a single integer and a verdict, with no
        control number beside it.
    - id: F-5
      severity: MAJOR
