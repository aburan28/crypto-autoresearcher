    why_not_reject: >-
      REJECT is not warranted and would be dishonest in the other direction. The
      ranking's item A recital REPRODUCES FIELD BY FIELD against an independent
      source, its item C infra disposition is ACCURATE and correctly framed as a
      budget fact rather than a result, and its ranking structure and standing
      holds are sound. The defects are repairable by a SUPERSEDING LANE CONTRACT
      (SC-4's own named remedy) plus a re-decision of the winner's form. They are
      not editorial: F-1..F-4 require changing WHAT is measured, not filling in
      fields.
    two_scales_stated_so_neither_is_misread: >-
      This file carries two verdict tokens on two different scales, and they must
      not be conflated. `review_report.verdict: REVISE` is the committed card's
      scale (SC-3: PASS/REVISE/REJECT) and is the TERMINAL VERDICT the completion
      gate asks for. `validation_report.verdict: failed` is agents/validator.md's
      scale and answers a different question -- whether this artifact package is
      ADMISSIBLE AS IT STANDS. It is not. `failed` there does not mean REJECT
      here, and `REVISE` here does not mean the package is currently admissible.

  what_this_verdict_does_not_do:
    - >-
      IT AUTHORIZES NOTHING. execution_authorized: false. No experiment was run,
      no run was authorized, no hypothesis status moved, no lane was opened.
    - >-
      IT IS NOT A DECISION. DEC-20260812-f56a44 is not filed and this report does
      not file it. Per TASK-20260812-4177ac's own committed constraint, a REVISE
      means that task records the block and a scoped repair next_action INSTEAD
