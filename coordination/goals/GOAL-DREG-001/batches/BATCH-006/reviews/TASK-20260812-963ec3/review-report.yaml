        YES. This is the failure mode this class of disposition usually exhibits
        and it is NOT present here. Nowhere does the ranking convert the
        unavailability of the n=18 rung into a null, a screening, or any statement
        about d_reg. `resume_condition` names the concrete unblocking condition
