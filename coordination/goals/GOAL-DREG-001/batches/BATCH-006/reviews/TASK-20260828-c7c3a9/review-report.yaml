  limitations:
  - 'L-1 (non-blocking, minor). The execution-report''s "Anomalies and deviations" item 1 characterizes
    the n=12 reference cell''s rank phase as needing "a further 6.67 GiB peak on top of its own prepare
    phase." The n=12 manifest (TASK-20260731-016/run_manifest.yaml) actually records only ONE peak_rss_bytes/peak_rss_gb
    figure for the entire run (prepare_seconds: 23.75 and secs_total_rank_work: 1623.8 are reported separately
    by wall-clock, but resource_measurements carries a single combined peak_rss_gb: 6.67, not a prepare-only
    and a rank-only figure). Read literally, "a further 6.67 GiB ... on top of" could be misconstrued
    as additive (prepare-phase RSS + 6.67 GiB), when the more defensible reading of the cited manifest
    is that 6.67 GiB IS the combined peak for that entire run. The report itself already hedges this whole
    comparison as "analysis, not measurement... a scale this task did not attempt to measure and is not
    claiming," so this does not change the verdict or the disposition (which rests on J4''s mechanical
    validity check, not on this comparison), but a future citation of this figure should say "n=12''s
    overall run peak was 6.67 GiB, combined prepare+rank" rather than "a further 6.67 GiB on top of prepare."'
  - L-2 (non-blocking, disclosure). command.txt for RUN-DREG-001-MEASURE-N15-SEM-2026 notes an unexplained
