  joints:
  - joint: J1
    description: The measured peak-RSS figures (sem=11.73 GiB, null=12.22 GiB, seed 2026) are real, not
      fabricated or extrapolated.
    result: HOLDS
    evidence: 'Located the figures in THREE places independent of the manifest''s own prose summary of
      itself: (1) raw process stdout captured live during the run, experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N15-PROBE/prepare_probe_stdout.log
      ("[t=27.7s] sem macaulay_rows: nrows=546855 ncols=690690 gen_s=27.5 rss=11.73GiB") and prepare_probe_null_stdout.log
      ("[t=29.5s] null macaulay_rows: nrows=546855 ncols=768212 gen_s=29.3 rss=12.22GiB"); (2) the scripts''
      own raw JSON side-channel, .../work/prepare_probe_sem_result.json (peak_rss_gb_after_sem: 11.732)
      and .../work/prepare_probe_null_result.json (peak_rss_gb: 12.224); (3) read the executed source,
      prepare_probe.py and prepare_probe_null.py, and confirmed the measurement method is `resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
      / 2**30` — correct units for this host (`environment.json` hostname_os "macOS-26.6-arm64 (Darwin
      25.6.0)"; on Darwin ru_maxrss is bytes-denominated, so dividing by 2**30 yields GiB directly; on
      Linux this same code would silently be off by 1024x, but that is not this host). All three sources
      agree with each other and with the run_manifest.yaml / execution-report.md prose to 3 significant
      figures (11.73 vs 11.732, 12.22 vs 12.224 — pure rounding).'
    order_of_magnitude_sanity_check: 'n=12 reference (TASK-20260731-016/run_manifest.yaml): nb=24, cumulative
      degree<=6 monomial count sum_{d=0}^{6} C(24,d) = 190,051 (independently recomputed: 1+24+276+2024+10626+42504+134596
      = 190,051 — MATCH), overall run peak_rss_gb: 6.67 (prepare+rank combined, single figure, no separate
      prepare-only RSS in that manifest). n=15 cell: nb=30, sum_{d=0}^{6} C(30,d) = 768,212 (independently
      recomputed: 1+30+435+4060+27405+142506+593775 = 768,212 — MATCH, and this equals the probe''s own
      null_ncols=768212 exactly, confirming the null arm''s column space is indeed the full degree<=6
      monomial space on 30 variables as claimed). Monomial-space ratio 768212/190051 = 4.041x, matching
      the report''s "~4.04x" claim exactly. A ~12 GiB prepare-phase-only peak against a ~6.67 GiB combined
      (prepare+rank) peak on a system with a ~4x larger monomial space is not an implausible order of
      magnitude; if anything it is a conservative (lower) ratio than a naive linear-in-ncols scaling would
      predict, which is unsurprising since RSS tracks sparse nnz/row structure, not ncols alone. No red
      flag.'
    breaking_artifact_search: 'Searched for a disagreeing RSS value in stderr.log (empty, both 2026 runs),
      environment.json (no RSS field, consistent), and raw-result.json ("peak_rss_gb_at_this_point": 11.732
      / 12.224, matching). Found none. J1 does not break.'
  - joint: J2
    description: Seeds 2027/2028 are honestly disclosed as structural inference, not silently upgraded
      to measurement.
    result: HOLDS
    evidence: 'Read all 4 manifests'' own `attempt` blocks in full (SEM-2027, SEM-2028, NULL-2027, NULL-2028).
      Each independently states, in its own text: `attempted: false`, a `reason_not_attempted` paragraph
      that names the specific structural basis (nb=30 and eq_degs_hist identical across all 3 seeds, confirmed
      by the cheap probe.py run for that exact seed), and an explicit disclaimer inside `structural_basis.note`:
      "This IS an independent measurement (the cheap build_system-only probe WAS run for seed 202X)...
      but it stops before macaulay_rows and therefore does NOT independently confirm this seed''s exact
      ncols/nrows/RSS — only the seed-independent inputs ... that make the seed=2026 arm measurement''s
      applicability a structural inference rather than a fabrication." The corresponding raw-result.json
      for each of the 4 carries "attempted": false and "structural_basis_not_independently_measured_for_ncols_nrows_rss":
      true as a machine-readable flag, not just prose. The `probe_result.json` underlying the structural
      claim was independently read and confirms nb=30 and eq_degs_hist={"2":15,"3":15} for all three seeds
      2026/2027/2028, with distinct sem_hash/null_hash per seed (as expected: same shape, different concrete
      system). No manifest presents the seed=2026 measurement as if it were itself a seed=2027/2028 measurement.
      J2 does not break.'
  - joint: J3
    description: No rank value appears anywhere as a claimed result for n=15 at this cell.
    result: HOLDS
    evidence: 'Grepped `validity:` in all 6 run_manifest.yaml files: all six read `failed_infrastructure`.
      Grepped the `observations:` block in all six manifests: all six read `rank: null` / `deficit_genuine:
      null`. Read all 6 raw-result.json files directly: all six carry `"rank": null, "deficit_genuine":
      null`, and the 4 not-independently-attempted ones omit a `measured` block entirely (the 2 attempted
      ones carry only prepare-phase scale fields — nrows, ncols, gen_seconds, peak_rss — never a rank
      field). `certificate.kind: none` is set uniformly. No numeric rank, deficit, or corank value appears
      anywhere in the 6 committed run records or in the supporting probe artifacts for this cell.'
    proves_too_much_self_assessment: 'REQUIRED DISCLOSURE. The literal grep-based check (query declared
      fields for a populated rank) by itself would NOT catch a withheld positive result: a producer could
      compute a rank in an undisclosed process and simply leave these fields null, and a field-level grep
      cannot detect an omission. This validator went further than the plan''s literal instruction and
      read the actual executed source (prepare_probe.py, prepare_probe_null.py, probe.py) for the two
      attempted (seed=2026) runs: neither script imports or calls the m4ri rank kernel (h012c_block_m4ri''s
      chunked_block_m4ri / process_subchunk) at all — they call only build_system, boolean_null, semireg_rank_pred
      (a THEORETICAL prediction formula, not a rank computation), and macaulay_rows (row/column construction
      only). prepare_probe.py''s own stdout log ends at "SEM_PHASE_DONE" with no later "ALL_DONE" print
      that the script''s own source shows would follow a completed null-phase run — consistent with command.txt''s
      account that the process was SIGTERM''d shortly after that point. prepare_probe_null.py explicitly
      `del sem_monosets` and only ever builds the null arm, printing "NULL_PHASE_DONE" as its terminal
      state, matching its own stdout log exactly. This is source-level and process-log-level evidence,
      not merely a field-level absence, that a rank was not computed BY THE PROCESSES THAT ACTUALLY RAN.
      It does NOT and cannot rule out a rank computed by some entirely separate, wholly unrecorded process
      outside every artifact this review can see — that is a limit of any documentary audit and is not
      specific to this check. Within that limit, the check is stronger than the plan''s literal grep and
      does distinguish "never computed" from "computed and withheld" for the two processes that were actually
      shown to run; it cannot make that distinction for a hypothetical process with zero footprint in
      any artifact.'
  - joint: J4
    description: The completion-criterion disposition (n=15 rung does NOT count) is mechanically correct
      under lane-contract.yaml's binding_predicate.
    result: HOLDS
    evidence: 'lane-contract.yaml `binding_predicate` clause (d) reads verbatim: "validity=completed_valid
      (never in_progress_checkpointed, failed_infrastructure, or invalid) for every one of the 6 required
      runs". All 6 run_manifest.yaml files (grepped directly, see J3 evidence) read `validity: failed_infrastructure`.
      Zero of the 6 satisfy clause (d), so the conjunctive binding_predicate fails mechanically regardless
      of clauses (a)/(b)/(c)/(e); each manifest''s own `counts_toward_completion_criterion: value: false`
      cites exactly this clause. The report''s "does not count" conclusion is a direct, checkable readout
      of the frozen contract''s own text against the manifests'' own validity field — not a judgement
      call, an extrapolation, or reasoning that departs from the contract. DEC-20260827-b588e7 (read directly)
      confirms the completion criterion was "NOT YET MET" as of authorization and that item C1''s "EVENTUAL
      EXECUTION... WOULD supply the n=15 rung" only "if authorized and run to completion with all six
      required (seed, arm) pairs at validity=completed_valid" — the authorizing decision itself already
      states the counterfactual this run failed to reach.'
  - joint: J5
    description: The report does not smuggle in a d_reg conclusion it is not entitled to, in either direction.
    result: HOLDS
    evidence: 'Read execution-report.md in full, sentence by sentence, for the summary and conclusion
      sections. Every place a d_reg-adjacent statement could appear is explicitly hedged: "This is an
      infrastructure/resource stop, not a negative result about d_reg (AGENTS.md rule 5...)"; each of
      the 6 manifests'' own `observations.note`: "NO RANK WAS COMPUTED for this (seed, arm). Not evidence
      for or against d_reg (AGENTS.md rule 5)"; the executor assessment''s `observations` list states
      explicitly "No deficit_genuine, rank, or comparison statistic is reported because no rank was measured
      for any (seed, arm) pair"; the closing "What this report is not" section states outright "Not a
      d_reg result in either direction (AGENTS.md rule 5)... Not a hypothesis-status change (H-DREG-001
      untouched)... Not a completion-criterion determination (that is a Coordinator act on this record,
      not this record itself)". The report also correctly declines to claim the n=15 rung is "permanently
      unreachable," scoping its negative claim to "unreached at this budget, on this host, with this instrument''s
      prepare-phase memory profile, as measured here" — matching AGENTS.md rule 6/7 (negative evidence
      and scale disclosure). No sentence found that is assertable as evidence for or against H-DREG-001,
      or as a measurement of d_reg, from a run that never computed a rank. J5 does not break.'
