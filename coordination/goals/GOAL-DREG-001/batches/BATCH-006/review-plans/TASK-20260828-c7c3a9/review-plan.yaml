review_plan:
  round_id: TASK-20260828-c7c3a9
  goal_id: GOAL-DREG-001
  batch_id: BATCH-006
  recorded_at: '2026-08-28'
  recorded_by: coordinator (driving session)

  status_note: >-
    PRE-REGISTERED BEFORE ANY REVIEWER RUNS. As of this writing no review report
    exists for TASK-20260828-c7c3a9; the artifacts under review
    (coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260828-955d56/execution-report.md
    and its 6 run directories under experiments/EXP-DREG-001/runs/) were frozen
    by the TASK-20260828-ca8095 snapshot at commit b46cf30e3, receipt content_verified.

  round_shape_disclosed_rather_than_glossed: >-
    SINGLE-REVIEWER ROUND, same shape as the two rounds preceding it on this
    goal. `blindness.mutual` is vacuous (no sibling reports). No blind
    re-derivation is required this round (unlike the ranking round): the claim
    under review is narrower and does not turn on a load-bearing derived
    quantity a reviewer could independently recompute from a different source
    -- it turns on whether SIX REAL PROCESSES WERE ACTUALLY RUN AND HONESTLY
    REPORTED, which is a verification-against-logs task, not a re-derivation
    task. This is recorded as a deliberate scoping choice, not an oversight.

  claim_under_review: >-
    QUOTED FROM THE PRODUCER'S OWN FROZEN BYTES. execution-report.md: "None of
    the 6 required (seed, arm) runs reached validity=completed_valid. All 6 are
    classified failed_infrastructure / resource_exhaustion... The root cause is
    a measured one, not a guess: the prepare phase alone... already exceeds the
    lane-contract's declared memory_gb: 8 budget floor, for both arms, before
    the chunked_block_m4ri rank-loop kernel... is ever invoked." Measured
    figures claimed: sem peak RSS 11.73 GiB, null peak RSS 12.22 GiB (both at
    seed 2026); nb=30 and eq_degs_hist identical across all 3 seeds (cheap
    structural probe, not independently measured to the same depth for seeds
    2027/2028). The claim under review is that this report is an honest,
    accurately-measured account of an infrastructure stop -- not a fabricated,
    exaggerated, or under-tried non-attempt, and not a report that smuggles in
    a d_reg conclusion it is not entitled to.

  coordinator_prior:
    do_not_transmit: >-
      THIS FIELD MUST NOT REACH THE REVIEWER. Recorded so "the validator
      concurred" and "the validator concurred with what the Coordinator already
      believed" remain distinguishable. EVERY LINE MAY BE OVERTURNED.
    what_the_coordinator_actually_read_before_writing_this: >-
      execution-report.md in full; one run_manifest.yaml (SEM-2026) spot-checked
      for structural sanity; the file list of all 45 committed files (git show
      --stat); the TASK-20260827-765027 lane-contract.yaml's exact_budget and
      failure_modes sections (already read during this session's earlier
      dispatch of this task). NOT independently read: the other 5
      run_manifest.yaml files, the raw stdout/stderr logs, or the probe scripts'
      source code -- the prior below about those is an expectation from the
      summary, not a verification.
    expected_findings:
      - >-
        P-1 (HIGH CONFIDENCE) THE MEMORY FIGURES WILL BE INTERNALLY CONSISTENT
        WITH THE LOGGED PROCESS OUTPUT. Peak RSS 11.73/12.22 GiB should be
        directly readable from environment.json or stderr.log for the SEM-2026
        and NULL-2026 runs specifically (the two the report says were actually
        measured to this depth). If the reviewer cannot find the raw number in
        a log and only in the summary prose, that is a finding.
      - >-
        P-2 I EXPECT THE SEEDS 2027/2028 "NOT INDEPENDENTLY MEASURED" DISCLOSURE
        TO BE HONEST, NOT A SHORTCUT DRESSED UP. The report explicitly labels
        this a structural inference from a cheap probe (nb, eq_degs_hist
        identical across seeds), not independent measurement. I expect the
        run_manifest.yaml files for the 2027/2028 runs to say the same thing
        in their own `attempt` blocks, consistent with the summary -- not
        silently claim a measurement that was not taken.
      - >-
        P-3 I EXPECT NO RANK VALUE TO APPEAR ANYWHERE AS A MEASURED RESULT. The
        report says the rank-loop kernel was never invoked. If any manifest or
        raw-result.json contains a numeric rank for n=15 at this cell, that
        would directly contradict the summary and is the single highest-value
        possible finding this round could produce.
      - >-
        P-4 I EXPECT THE binding_predicate ADMISSIBILITY LOGIC TO BE APPLIED
        CORRECTLY: the report concludes the n=15 rung does not count. Given 0 of
        6 required runs reached completed_valid, this conclusion should be
        mechanically forced by lane-contract.yaml's own binding_predicate
        (condition (d) requires validity=completed_valid for every one of the
        6 required runs). I expect the reviewer to confirm this is applied
        correctly rather than independently re-argue it.
      - >-
        P-5 I DO NOT EXPECT A REJECT. My prior is PASS, possibly with a minor
        finding on documentation completeness (e.g. whether every one of the 6
        manifests individually and correctly states failed_infrastructure, or
        whether some field is inconsistent between manifests). I hold this
        loosely.

  joints:
    - joint: >-
        J1 (highest priority) THE MEASURED PEAK-RSS FIGURES ARE REAL, NOT
        FABRICATED OR EXTRAPOLATED. sem_peak_rss=11.73 GiB and
        null_peak_rss=12.22 GiB (seed 2026) must be independently locatable in
        the actual process output (stderr.log, environment.json, or
        raw-result.json for RUN-DREG-001-MEASURE-N15-SEM-2026 and
        RUN-DREG-001-MEASURE-N15-NULL-2026), not merely asserted in
        execution-report.md's prose or in run_manifest.yaml's own summary of
        itself.
      assigned_to: TASK-20260828-c7c3a9
      attack_plan: >-
        Open the raw logs/JSON for both 2026 runs directly and locate the RSS
        measurement independent of the manifest's own claim about it. Compare
        against the n=12 reference (peak_rss_gb: 6.67,
        coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/run_manifest.yaml)
        for a sanity check on ORDER OF MAGNITUDE: is ~12 GiB for a
        combinatorially larger n=15/nb=30 D6 system a priori plausible relative
        to 6.67 GiB for n=12/nb=24? (It is expected to be larger, given
        C(30,d) > C(24,d) at fixed d -- the reviewer should check the actual
        ratio is not absurd, not re-derive it exactly.)
      breaking_artifact: >-
        A logged RSS value that disagrees with the report's claimed figures, or
        no independent measurement locatable anywhere except the report's own
        prose (i.e., the number cannot be traced to a real process
        measurement).
    - joint: >-
        J2 SEEDS 2027/2028 ARE HONESTLY DISCLOSED AS STRUCTURAL INFERENCE, NOT
        SILENTLY UPGRADED TO MEASUREMENT.
      assigned_to: TASK-20260828-c7c3a9
      attack_plan: >-
        Read all 4 remaining manifests (SEM/NULL x 2027/2028) and confirm each
        one's own `attempt` or `validity_reason` field says, in its own words,
        that it was not independently run to the prepare-phase-measurement
        depth and why (nb/eq_degs_hist identical across seeds via the cheap
        probe). A manifest that reports failed_infrastructure without
        disclosing this is technically not-independently-measured is a finding.
      breaking_artifact: >-
        Any of the 4 manifests presenting the structural inference as if it
        were an independent measurement of THAT SPECIFIC (seed, arm) run.
    - joint: >-
        J3 NO RANK VALUE APPEARS ANYWHERE AS A CLAIMED RESULT FOR n=15 AT THIS
        CELL.
      assigned_to: TASK-20260828-c7c3a9
      attack_plan: >-
        Grep all 6 run_manifest.yaml files and raw-result.json files for any
        populated rank/deficit field. Confirm every `observations`-equivalent
        block is empty or explicitly null for this cell.
      breaking_artifact: >-
        Any numeric rank, deficit, or admitted observation value present
        anywhere in the committed run records for this cell.
    - joint: >-
        J4 THE COMPLETION-CRITERION DISPOSITION (n=15 rung does NOT count) IS
        MECHANICALLY CORRECT UNDER lane-contract.yaml's binding_predicate.
      assigned_to: TASK-20260828-c7c3a9
      attack_plan: >-
        Re-read binding_predicate condition (d) (validity=completed_valid
        required for every one of the 6 required runs) against the actual
        validity field of all 6 manifests. Confirm the "does not count"
        conclusion follows mechanically and is not an independent (and
        possibly wrong) judgment call layered on top.
      breaking_artifact: >-
        Any of the 6 manifests actually showing validity=completed_valid
        (which would mean the "does not count" conclusion is wrong), or the
        report's disposition resting on reasoning other than the contract's
        own predicate.
    - joint: >-
        J5 THE REPORT DOES NOT SMUGGLE IN A d_reg CONCLUSION IT IS NOT ENTITLED
        TO, IN EITHER DIRECTION.
      assigned_to: TASK-20260828-c7c3a9
      attack_plan: >-
        Read every sentence of execution-report.md's summary and conclusion
        sections for any phrasing that could be read as a positive or negative
        claim about d_reg, H-DREG-001, or the completion criterion beyond "this
        rung does not count because of an infrastructure stop."
      breaking_artifact: >-
        Any sentence assertable as evidence for or against H-DREG-001, or as a
        measurement of d_reg, from a run that never computed a rank.

  proves_too_much:
    objects:
      - >-
        KNOWN-FALSE OBJECT -- A COMPLETED RUN MISREPORTED AS INFRASTRUCTURE-
        FAILED. If the reviewer's logic for accepting "failed_infrastructure"
        would ALSO accept a run that in fact reached validity=completed_valid
        with a real rank (i.e., the review checklist doesn't actually
        distinguish "genuinely never computed a rank" from "computed one and
        chose not to report it"), the review has proved too much: it would
        pass a report that actually withheld a positive result.
    failure_signature: >-
      If J3 (no rank value anywhere) is satisfied only by the report's own
      say-so and not by an independent grep of the raw files, the review
      cannot actually distinguish the true case from the known-false one.
    assigned_to: TASK-20260828-c7c3a9

  blind_rederivation:
    required: false
    not_required_reason: >-
      No load-bearing NUMERIC CONCLUSION rests on a derivation this round
      could independently recompute from raw parameters the way the ranking
      round's cost-floor and tautology claims did. The claim under review is
      "did these processes run and were they honestly reported," which is a
      verification-against-logs task; manufacturing a blind_from list here
      would not buy independence the setup does not have. See PD-Q2 below.
    quantity: null
    parameters: null
    blind_from: []
    assigned_to: null

  blindness:
    mutual: true
    mutual_is_vacuous_here: Single-reviewer round; no sibling reports exist.
    lifted_for: []
    rationale: null
    additional_constraint: >-
      The reviewer MUST NOT be given, and must not read, this file or
      `review_plan.coordinator_prior`, before rendering its verdict -- same
      discipline as the prior two rounds on this goal. The dispatch prompt is
      generated from the committed handoff in dispatch_queue.v3.json.

  expected_attestation_from_the_reviewer: >-
    review_attestation block: task_id TASK-20260828-c7c3a9, joints_owned
    [J1, J2, J3, J4, J5], sources_read listed honestly and completely,
    read_sibling_reports false, blind_from_respected null (no re-derivation
    assigned), and a terminal verdict (PASS/REVISE/REJECT).

  procedure_deviations:
    - >-
      PD-Q2 NO BLIND RE-DERIVATION THIS ROUND, BY DESIGN, UNLIKE THE PRIOR
      ROUND. Recorded so the omission reads as a deliberate scoping decision
      (the claim under review does not turn on a re-derivable quantity) rather
      than an inconsistency with the ranking round's plan.
