  status_note: >-
    PRE-REGISTERED BEFORE ANY REVIEWER RUNS. As of this writing no review report
    exists - a glob of
    coordination/goals/GOAL-DREG-001/batches/BATCH-006/** performed by this
    Coordinator returns nine files and no `reviews/` directory at all, matching
    the 2026-08-19 finding recorded in the batch control plane.

  why_this_plan_exists: >-
    AGENTS.md "Review architecture" requires a `review_plan` on the handoff
    opening a CLAIM-CHANGING review round. The committed handoff
    ledger/handoffs/TASK-20260812-963ec3.yaml carries none, and it is IMMUTABLE
    and IS NOT EDITED. This plan is recorded in a new artifact under a
    CONSERVATIVE READING of the trigger - the round cannot move a hypothesis
    status and supports no headline claim, but the artifact under review contains
    LANE DISPOSITIONS (item A superseded, item C declared infra-limited, item B
    selected as the winner) and "close a lane" is in the trigger list. If a later
    reader judges the round non-claim-changing, this plan is harmless surplus; if
    the reader judges it claim-changing, the obligation is met.

  round_shape_disclosed_rather_than_glossed: >-
    THIS IS A SINGLE-REVIEWER ROUND. One validator owns every joint. Two
    consequences, both recorded rather than assumed away. (1) `blindness.mutual`
    is VACUOUS - there are no sibling reports in this round to be blind from.
    (2) The whole-claim verdict that the committed completion gate demands
    (PASS/REVISE/REJECT on the lane contract) IS coherent here, because the sole
    reviewer sees every joint by construction; the template's warning against a
    whole-claim verdict from a blinded reviewer addresses multi-reviewer rounds
    and does not apply. THE COVERAGE LIMITATION IS REAL AND IS THE PRICE - one
    reviewer's coverage is one reviewer's taste, and no cross-reviewer
    corroboration exists or may be claimed for this round under any name.

  claim_under_review: >-
    QUOTED FROM THE PRODUCER'S OWN FROZEN BYTES, not restated by the Coordinator.
    From lane-contract.yaml - winner_item "B", winner_name
    "CTRL-013-OPTIONAL-RERANK one-column deletion rank-honesty mutation", with
    required_prediction "The accumulated rank rank_acc must drop by exactly 1
    relative to the committed trail (i.e. the deleted column contributed exactly
    one independent row). This is the falsifiable prediction of the rank-honesty
    discrimination OBJ-013-4." From ranking.yaml - row A "Finish or supersede the
    C2 chain" with dominated_by "A2"; row B with dominated_by null and sota_delta
    null; and the (C) ladder-rung disposition. The claim under review is that
    this ranking and this lane contract are evidence-backed, Pareto-honest,
    infra-accurate, and would not waste the batch.

  coordinator_prior:
    do_not_transmit: >-
      THIS FIELD MUST NOT REACH THE REVIEWER (DEC-20260822-badc59 DC-3). It is a
      pre-commitment recorded so that "the validator concurred" and "the
      validator concurred with what the Coordinator already believed" remain
      distinguishable after the fact. EVERY LINE OF IT MAY BE OVERTURNED, and an
      overturned prior is one of the most informative outcomes this round can
      produce.
    what_the_coordinator_actually_read_before_writing_this: >-
      DISCLOSED SO THE PRIOR IS CHECKABLE - lane-contract.yaml IN FULL, and
      ranking.yaml lines 1-60 only (header, `inference`, `objective`,
      `pareto_frontier.axes`, and rows A and B up to row B's rationale). Row C,
      the infra disclosure, and everything after line 60 of ranking.yaml WERE NOT
      READ by this Coordinator, and the prior about item C below is therefore an
      expectation formed from the goal record and the batch control plane, not
      from the artifact.
    expected_findings:
      - >-
        P-1 (HIGHEST CONFIDENCE) THE PARETO ROW FOR THE WINNER IS FACIALLY
        INCOMPLETE. Row B carries `dominated_by: null` AND `sota_delta: null`.
        The inventor protocol requires a QUANTITATIVE `sota_delta` on every row
        and permits `dominated_by: null` only after every row of the frontier has
        been checked. A null `sota_delta` is not a checked value, it is an
        unfilled field. I EXPECT A FINDING HERE, at REVISE severity or above. I
        may be wrong if a later section of ranking.yaml supplies the quantity or
        states why the axis is inapplicable - which is exactly why the reviewer
        reads the whole file and I did not.
      - >-
        P-2 THE C2 GIT REPRODUCTION IS THE HIGHEST-VARIANCE ITEM AND I EXPECT
        ABSENCE AT LEAST AS OFTEN AS REPRODUCTION. The target branch
        coordinator/goal-dreg-001-b3c2-b4 was NEVER PUSHED, and
        DEC-20260815-6b806c's own merge_note says "later sessions lacking the
        branch cannot reproduce the cited state". If it is absent, that is an
        infrastructure observation and NEVER evidence about C2, about d_reg, or
        about the producer's honesty.
      - >-
        P-3 I EXPECT ITEM A's DISPOSITION TO SURVIVE. Ranking row A's A2
        supersede was in fact realized as DEC-20260815-6b806c on EV-DREG-4500cd,
        so the disposition is consistent with a committed decision independent of
        the ranking.
      - >-
        P-4 I EXPECT ITEM C's INFRA-LIMITED DISPOSITION TO SURVIVE, because the
        goal record has carried the same infra fact since BATCH-003 (the
        un-chunked first-fall instrument is host-unsafe at D6, so the n=18 gap
        rung and the null first-fall are INFRA-LIMITED, NEVER MEASURED). I EXPECT
        THE REVIEWER TO CHECK THAT IT IS STATED AS A BUDGET FACT AND NOT AS A
        RESULT, which is where this class of disposition usually goes wrong.
      - >-
        P-5 I EXPECT A FINDING ON lane-contract.yaml's `independence_note`. It
        reads, in the frozen bytes, "The lane's executor run proceeds; its review
        does not fabricate" - i.e. it contemplates the executor lane running
        while its own independent review is unservable. That is in tension with
        the goal record and the batch control plane, both of which state that
        item B is NOT AUTHORIZED TO RUN. I expect the reviewer to say whether the
        contract, as written, would license an unreviewed run.
      - >-
        P-6 I EXPECT THE PRODUCER'S OWN `inference` BLOCK TO BE FLAGGED. Both
        frozen artifacts self-declare resolved_model_id qwen3.6:27b with no probe
        behind it. That is a provenance disclosure to note, not a defect in the
        ranking's content, and I expect the reviewer to keep those two separate.
      - >-
        P-7 I DO NOT EXPECT A REJECT. My prior is REVISE - a ranking whose
        substantive dispositions largely hold, with at least one unfilled
        Pareto-honesty field and one contract clause that needs narrowing. I HOLD
        THIS PRIOR LOOSELY AND IT IS NOT AN INSTRUCTION.

  joints:
    - joint: >-
        J1 SOURCE FIDELITY. Every quantity adjudicated is read from the FROZEN
        SNAPSHOT BYTES (commit 1aa90d9c08d0b0ddb78f84283a6099942dffa85a, receipt
        verification_status content_verified) and recomputed rather than taken
        from a producer summary.
      derived_from_committed_card: SC-1 and the completion gate's "binds the snapshot commit"
      assigned_to: TASK-20260812-963ec3
      attack_plan: >-
        Re-read ranking.yaml and lane-contract.yaml through read-only git at the
        named commit and diff them against the working tree. If the working tree
        differs from the snapshot, the working-tree bytes are not the reviewed
        object and the divergence is itself the finding.
      breaking_artifact: >-
        A byte or digest divergence between the snapshot commit and the paths
        being reviewed.
    - joint: >-
        J2 THE C2 TERMINAL-STATE CLAIM REPRODUCES, OR IS REPORTED ABSENT. The
        values done=true, rank_acc=265950, pred=268674, next_col=778394 are
        checked against PREREG-20260727-N21-C2.md from the named branch, not from
        the ranking's recital of them.
      derived_from_committed_card: SC-2
      assigned_to: TASK-20260812-963ec3
      attack_plan: >-
        Run exactly the command the card names - `git show
        coordinator/goal-dreg-001-b3c2-b4:experiments/EXP-DREG-004/runs/RUN-DREG-004-REBUILD-A/work/h012c_rebuild_a_sem_n21_t0/state.json`
        - and record its exact output or its exact failure. Compare each of the
        three numbers field by field against the prereg. WHERE THE COORDINATOR
        THINKS IT BREAKS - the branch is never-pushed and may simply not exist in
        this worktree; report that plainly with the command and its output. AN
        ABSENT BRANCH IS AN INFRASTRUCTURE OBSERVATION AND NEVER A NEGATIVE
        RESULT.
      breaking_artifact: >-
        A mismatch in any of the three values against the prereg, or a
        reproducible demonstration that the cited state does not exist where the
        record says it does.
    - joint: >-
        J3 PARETO HONESTY. `dominated_by` and `sota_delta` are filled on every
        row, `sota_delta` is QUANTITATIVE, and `dominated_by: null` appears only
        where every row of the frontier was actually checked.
      derived_from_committed_card: SC-3 (Pareto honesty limb)
      assigned_to: TASK-20260812-963ec3
      attack_plan: >-
        Tabulate all rows against all four declared axes and attempt to construct
        a dominating row for the winner. An unchecked `null` is a fabrication
        under the core rules, so treat each null as a claim requiring the check
        that licenses it.
      breaking_artifact: >-
        A constructed dominating row, or a null that no check in the artifact
        supports.
    - joint: >-
        J4 PER-ITEM DISPOSITIONS (A)/(B)/(C) ARE SUPPORTED BY THE CITED EVIDENCE,
        AND THE INFRA DISCLOSURE IS ACCURATE.
      derived_from_committed_card: SC-3 (per-ID adjudication limb) and the completion gate
      assigned_to: TASK-20260812-963ec3
      attack_plan: >-
        For each item, follow the citation to the record it names and check that
        the record says what the ranking says it says - item A against
        DEC-20260815-6b806c and EV-DREG-4500cd, item B against EV-DREG-008,
        DEC-20260810-da7513 and the OBJ-013-4 disposition, item C against the
        goal record's standing infra note. WHERE THE COORDINATOR THINKS IT BREAKS
        - an infra limitation restated anywhere as a RESULT rather than as a
        budget fact.
      breaking_artifact: >-
        A cited record that does not support the disposition drawn from it, or an
        infra limitation presented as a measurement.
    - joint: >-
        J5 THE LANE CONTRACT NAMES EXACTLY ONE EXECUTABLE WINNER WITH A RIGOROUS
        FALSIFICATION STATEMENT AND A COMPLETE, NON-NULL BUDGET.
      derived_from_committed_card: the objective's final limb and the completion gate's terminal verdict
      assigned_to: TASK-20260812-963ec3
      attack_plan: >-
        Take the falsification statement literally and ask what observation would
        NOT falsify it. Check that the budget has no null field, that the seeds
        are deterministic, that every failure mode routes to
        `failed_infrastructure` rather than to a result, and that the claim
        boundary forbids a d_reg reading. WHERE THE COORDINATOR THINKS IT BREAKS
        - see `proves_too_much` below, and the `independence_note` clause.
      breaking_artifact: >-
        An outcome the contract would record as confirming its prediction that in
        fact carries no information about rank honesty, or a clause licensing an
        unreviewed run.

  proves_too_much:
    objects:
      - >-
        KNOWN-FALSE OBJECT 1 - A LINEARLY DEPENDENT COLUMN. Apply the lane
        contract's required_prediction to the deletion of a column that
        contributes ZERO to the rank. There the conclusion "rank_acc drops by
        exactly 1" is KNOWN FALSE by construction - a dependent column's removal
        must leave rank_acc unchanged.
      - >-
        KNOWN-FALSE OBJECT 2 - AN INFRA-LIMITED LANE. Apply the ranking's own
        selection argument to item C's n=18 rung, which the batch itself declares
        NOT EXECUTABLE on this host. There the conclusion "this lane is the
        executable winner" is KNOWN FALSE.
    failure_signature: >-
      OBJECT 1 - if the contract's procedure, as written, would record the
      dependent-column deletion as CONFIRMING its prediction, or cannot
      distinguish that case from a genuine drop of 1, then the discrimination
      does not discriminate and the mutation is not a rank-honesty test. OBJECT 2
      - if the ranking's stated criteria would also select the infra-limited
      rung, then the criteria are not tracking executability and the winner was
      chosen on something other than the stated axes. AN ARGUMENT THAT STILL GOES
      THROUGH WHERE ITS CONCLUSION IS FALSE IS WRONG SOMEWHERE NOBODY HAS READ
      CLOSELY ENOUGH YET.
    assigned_to: TASK-20260812-963ec3

  blind_rederivation:
    required: false
    not_required_reason: >-
      RECORDED RATHER THAN SILENTLY OMITTED, AND THE HONEST ANSWER IS THAT THIS
      ROUND CANNOT CARRY ONE. A blind re-derivation starts from the STATEMENT of
      a quantity and its parameters and reads nothing of the producer's. This is
      a single-reviewer round whose whole object is the producer's two artifacts,
      so the sole reviewer must read them to adjudicate anything - there is no
      agent left to keep blind. Manufacturing a `blind_from` list the reviewer is
      required to read anyway would be a declared independence the setup does not
      have, which is worse than none.
    closest_available_check_and_it_is_assigned: >-
      J2's git reproduction is an INDEPENDENT-SOURCE CHECK - the C2 numbers are
      re-read from the branch blob rather than from the ranking's recital. IT IS
      NOT A BLIND RE-DERIVATION and must not be reported as one, because the
      reviewer will have read the recital first.
    quantity: null
    parameters: null
    blind_from: []
    assigned_to: null

  blindness:
    mutual: true
    mutual_is_vacuous_here: >-
      Single-reviewer round - no sibling reports exist in it. The reviewer must
      still declare `sources_read` honestly and must set
      `read_sibling_reports: false`.
    lifted_for: []
    rationale: null
    additional_constraint: >-
      The reviewer MUST NOT be given, and SHOULD NOT read,
      `review_plan.coordinator_prior` or this file, before rendering its verdict
      (DEC-20260822-badc59 DC-3). The joint statements J1..J5 restate the
      committed card and carry no expectation of the outcome.

  expected_attestation_from_the_reviewer: >-
    The report carries a `review_attestation` block - task_id
    TASK-20260812-963ec3, joints_owned [J1, J2, J3, J4, J5], sources_read listed
    honestly and completely, read_sibling_reports false, blind_from_respected
    null (no re-derivation assigned), and a verdict. Because this reviewer owns
    every joint, the terminal PASS/REVISE/REJECT its committed completion gate
    demands is a whole-claim verdict it is entitled to give.

  procedure_deviations:
    - >-
      PD-A RECORDED AT THE OUTSET, NOT DISCOVERED LATER. This plan is written
      2026-08-22, AFTER the handoff it governs was committed on 2026-08-12 and
      after the artifacts under review were frozen on 2026-08-15. The contract
      asks for the plan on the opening handoff. IT IS STILL BEFORE ANY REVIEWER
      RUNS, which is the property the requirement protects, and no report exists
      to have influenced it. The lateness is the deviation and it is recorded
      rather than absorbed.
    - >-
      PD-B SINGLE REVIEWER, ALL JOINTS. The contract's preference is one owner
      per joint across several reviewers, which buys coverage instead of
      correlation. This round has one reviewer because that is what the committed
      handoff commissions. NO SECOND REVIEWER IS ADDED HERE - adding one would be
      a new task with a new identifier, which this act has no authority to mint.
      The resulting coverage limit is disclosed in `round_shape_disclosed_rather_than_glossed`.
