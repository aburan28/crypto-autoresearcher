review_plan:
  round_id: TASK-20260827-be6fc9
  goal_id: GOAL-DREG-001
  batch_id: BATCH-006
  recorded_at: '2026-08-27'
  recorded_by: coordinator (driving session)

  status_note: >-
    PRE-REGISTERED BEFORE ANY REVIEWER RUNS. As of this writing no review report
    exists for TASK-20260827-be6fc9; the artifacts under review
    (coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260827-765027/{ranking.yaml,lane-contract.yaml})
    were frozen by the TASK-20260827-b7cd34 snapshot at commit e47484e67,
    receipt content_verified.

  round_shape_disclosed_rather_than_glossed: >-
    THIS IS A SINGLE-REVIEWER ROUND, same as the round it supersedes
    (TASK-20260812-963ec3). One validator owns every joint. `blindness.mutual`
    is vacuous (no sibling reports exist to be blind from), and the whole-claim
    verdict the committed completion gate demands (PASS/REVISE/REJECT) is
    coherent because the sole reviewer sees every joint by construction. Unlike
    the prior round, THIS PLAN DOES REQUIRE A BLIND RE-DERIVATION from the same
    reviewer, made possible by ORDERING rather than by a second agent: the
    reviewer computes the load-bearing quantity from the cited SOURCE records
    before reading the producer's own derivation of it, and records both. This
    is weaker than a truly independent second implementation (PD-Q1, below,
    disclosed rather than glossed) but is not vacuous the way a same-reviewer
    "blind" check usually is, because order genuinely controls what the
    reviewer has seen when it computes.

  claim_under_review: >-
    QUOTED FROM THE PRODUCER'S OWN FROZEN BYTES. From ranking.yaml -
    `one_winner_name`: "n=15 completion-criterion ladder rung: >=3 seeds, sem +
    semi-regular-null-matched control, full-column exact rank" (item C1),
    superseding the frozen TASK-20260812-f6df51 ranking's winner (item B,
    CTRL-013-OPTIONAL-RERANK), whose `pareto_frontier` row is now restated with
    evidence_value "LOW" and `dominance_check_against_the_winner` concluding "C
    does NOT dominate B in the strict Pareto sense... but cost alone does not
    make B the winner." From lane-contract.yaml - `winner_item`: the n=15 rung,
    `execution_authorized: false`, and an `independence_note` claimed to forbid
    dispatch before an independent review returns a supporting verdict. The
    claim under review is that this ranking and lane contract fully discharge
    RR-1 through RR-10 of DEC-20260812-f56a44, and that the corrected frontier's
    winner is honestly and correctly item C1, not a restatement chosen to reach
    a predetermined answer.

  coordinator_prior:
    do_not_transmit: >-
      THIS FIELD MUST NOT REACH THE REVIEWER. It is a pre-commitment recorded so
      that "the validator concurred" and "the validator concurred with what the
      Coordinator already believed" remain distinguishable after the fact. EVERY
      LINE OF IT MAY BE OVERTURNED.
    what_the_coordinator_actually_read_before_writing_this: >-
      DISCLOSED SO THE PRIOR IS CHECKABLE. Both new artifacts in full (ranking.yaml,
      lane-contract.yaml), the producing subagent's own return summary, and DEC-20260812-f56a44
      in full (the source of RR-1..RR-10). NOT independently read by this Coordinator: the
      underlying source files the producer cites (experiments/EXP-DREG-004/*, the BATCH-005
      chunk-coverage.log) were not re-opened by this act -- the prior below about those
      citations is therefore an expectation, not a verification.
    expected_findings:
      - >-
        P-1 (HIGHEST CONFIDENCE) THE RR-1..RR-10 MECHANICAL DISCHARGE IS STRUCTURALLY
        COMPLETE. `rr_discharge_index` names all ten and each points to a real field this
        Coordinator located. I expect the reviewer to CONFIRM structural completeness and
        spend its budget on whether each discharge is SUBSTANTIVELY correct, not on whether
        it exists.
      - >-
        P-2 I EXPECT THE "TAUTOLOGY" CLAIM IN RR-1's positive_arm.derivation TO SURVIVE
        RE-DERIVATION, BUT I HOLD THIS WEAKLY. It is the single most load-bearing claim in
        the whole round -- it is what downgrades item B and is the proximate cause of the
        winner changing from B to C1. I have NOT independently verified it myself. If the
        reviewer's blind re-derivation contradicts it, that is the single highest-value
        possible finding this round can produce, because it would mean the winner change
        itself needs to be re-examined.
      - >-
        P-3 I EXPECT THE n=15 COST FLOOR (13,789.26 s = 6 x 2298.21 s) TO BE CORRECTLY
        SOURCED FROM run_manifest.yaml, but I have not opened that file myself in this
        act and cannot rule out a transcription or unit error. This is the second joint I
        weight highest.
      - >-
        P-4 I EXPECT dominated_by: null TO HOLD FOR ALL THREE PARETO ROWS under the stated
        axes, because the producer's own dominance_check narrative is internally consistent
        on its face and cites specific comparisons rather than asserting the conclusion. I
        hold this more weakly than P-1/P-3 because I have not tried to construct a
        counter-dominating row myself.
      - >-
        P-5 I EXPECT RR-9's independence_note TO ACTUALLY FORECLOSE UNREVIEWED DISPATCH,
        because this exact defect (P-5 in the prior round's plan) was the one substantive
        contract-language finding the prior review made, and this producer was explicitly
        instructed to fix it by name. I expect the reviewer to check the clause reads as a
        hard gate, not a softened restatement of the old permissive language.
      - >-
        P-6 I DO NOT EXPECT A REJECT. My prior is PASS-with-minor-findings or REVISE on a
        narrow point (most likely P-2 or P-3 if either breaks). I hold this loosely; a
        REVISE here is not a negative result about d_reg in any direction, exactly as the
        prior REVISE was not.

  joints:
    - joint: >-
        J1 (highest priority) THE POSITIVE-ARM TAUTOLOGY CLAIM. RR-1's downgrade of item B's
        evidence_value rests on ranking.yaml `ctrl013_rerank.positive_arm.derivation` proving
        that, for a one-column deletion at k=width in the specified unit, the required
        rank_acc drop of exactly 1 is a structural tautology rather than a genuine
        discrimination of OBJ-013-4.
      assigned_to: TASK-20260827-be6fc9
      attack_plan: >-
        Work the linear-algebra argument through independently from the mutation's own
        definition (delete one column from an early unit with k=width; re-run a short prefix
        rank) BEFORE reading the producer's derivation text. State whether a forced
        rank_acc-drop-of-1 actually follows from k=width alone, or whether it depends on
        additional unstated assumptions about the deleted column's linear independence from
        the rest of the unit. Then read the producer's derivation and compare.
      breaking_artifact: >-
        A demonstration that the drop is NOT forced by k=width alone (i.e., a column at
        k=width whose deletion could, under the stated setup, produce a drop other than
        exactly 1), which would mean B's downgrade is unjustified and the winner must be
        re-examined.
    - joint: >-
        J2 THE n=15 COST FLOOR. The claimed 13,789.26 s floor (6 runs x n=12's measured
        wall_seconds_aggregate 2298.21 s) is the numeric basis for weighing item C1 against
        item B in the final ranking.
      assigned_to: TASK-20260827-be6fc9
      attack_plan: >-
        Open experiments/EXP-DREG-004's run_manifest.yaml (the n=12 cell) directly and read
        `resource_measurements.wall_seconds_aggregate` for yourself, before reading
        ranking.yaml's citation of it. Confirm the number, confirm 3 seeds x 2 arms = 6 is
        the correct run count under GOAL-DREG-001's completion_criteria wording, and confirm
        the "n=15 has a strictly larger system, so this is a floor not a prediction" framing
        is not smuggling in an unstated assumption about how cost actually scales.
      breaking_artifact: >-
        A mismatch between the cited number and the source file, a wrong run-count
        arithmetic, or a demonstration that n=15's cost could plausibly be LOWER than n=12's
        (which would break the "floor" framing entirely).
    - joint: >-
        J3 PARETO HONESTY ON THE CORRECTED FRONTIER. `dominated_by: null` on all three rows
        (A, B, C) and the `dominance_check`/`dominance_check_against_the_winner` narratives
        that license each.
      assigned_to: TASK-20260827-be6fc9
      attack_plan: >-
        Attempt to construct a dominating row for item C1 using the four axes as declared
        (evidence_value, cost, infra_honesty, review_history) and the QUANTITATIVE cost/value
        figures given. If no row is uncovered that beats C1 on every axis and strictly on
        one, `dominated_by: null` for C holds; do the same check for rows A and B.
      breaking_artifact: >-
        A constructed row that dominates the declared winner, or a `dominated_by: null` that
        the artifact's own narrative does not actually support once checked.
    - joint: >-
        J4 RR-4 BINDING-PREDICATE IDENTITY. The binding predicate (k = pivots gained in the
        unit = that unit's width) must be stated IDENTICALLY in ranking.yaml
        `ctrl013_rerank.binding_predicate` and lane-contract.yaml
        `item_b_non_winning_carried_forward.binding_predicate`.
      assigned_to: TASK-20260827-be6fc9
      attack_plan: Direct string comparison of the two fields, verbatim.
      breaking_artifact: Any textual divergence between the two statements of the predicate.
    - joint: >-
        J5 RR-9 INDEPENDENCE-CLAUSE HARDENING. lane-contract.yaml `independence_note` must
        foreclose every path by which the lane could dispatch before its own required review
        returns a supporting verdict.
      assigned_to: TASK-20260827-be6fc9
      attack_plan: >-
        Read the clause literally and ask: is there any sequence of events (partial reviews,
        timeouts, a differently-worded verdict) under which this contract, as written, would
        permit dispatch without a PASS-equivalent verdict already recorded? Compare against
        the prior round's flagged defect (P-5 of the TASK-20260812-963ec3 review plan) to
        confirm the SAME defect was not merely reworded.
      breaking_artifact: >-
        Any reading of the clause under which an unreviewed run could proceed.

  proves_too_much:
    objects:
      - >-
        KNOWN-FALSE OBJECT 1 - A COLUMN AT k != width. Apply J1's tautology argument to a
        deletion where the pivots gained in the unit do NOT equal that unit's width (k !=
        width, the exact condition RR-4's binding predicate excludes). There the conclusion
        "the rank_acc drop is forced to be exactly 1" is KNOWN FALSE by the mutation's own
        construction -- if k != width, the drop is not guaranteed to be forced at all, which
        is the entire reason the binding predicate exists.
      - >-
        KNOWN-FALSE OBJECT 2 - THE n=18 RUNG. Apply the ranking's own selection logic
        (evidence_value / cost / infra_honesty / review_history) to item C's n=18 sibling
        rung, which the goal record has declared INFRA-LIMITED on this host since BATCH-003.
        There the conclusion "this is an executable winner" is KNOWN FALSE.
    failure_signature: >-
      OBJECT 1 - if the reviewer's re-derivation from J1 "succeeds" (shows a forced drop of
      exactly 1) even when applied to a k != width column, the derivation logic itself is
      broken, not just its application, and every conclusion drawn from it is suspect. OBJECT
      2 - if the winner-selection reasoning used for C1 would also select the n=18 rung, the
      selection is not actually tracking infra-executability and needs re-examination.
    assigned_to: TASK-20260827-be6fc9

  blind_rederivation:
    required: true
    quantity: >-
      The n=15 completion-criterion lane's wall-clock cost floor: 3 seeds x 2 arms (sem +
      semi-regular-null-matched control) x the n=12 cell's measured per-run wall-clock cost.
    parameters: >-
      n=12 D6 cell measurement (claimed source: experiments/EXP-DREG-004's run_manifest.yaml,
      field `resource_measurements.wall_seconds_aggregate`); GOAL-DREG-001's own
      completion_criteria wording (n in {12,15,18}, >=3 seeds, semi-regular null control,
      full-column exact rank).
    blind_from:
      - coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260827-765027/ranking.yaml
      - coordination/goals/GOAL-DREG-001/batches/BATCH-006/tasks/TASK-20260827-765027/lane-contract.yaml
    ordering_note: >-
      TRUE ONLY BY ORDER, disclosed rather than glossed (PD-Q1 below). The reviewer must open
      and record the source run_manifest.yaml's measured value and compute the floor BEFORE
      opening either file listed in `blind_from` for the cost/derivation sections. It must
      then read those files normally for the rest of the round. This is weaker than a second
      agent's genuine ignorance of the producer's work, but the sequencing is a real
      constraint the reviewer's report must demonstrate it honoured (state the independently
      computed figure BEFORE quoting the producer's).
    assigned_to: TASK-20260827-be6fc9

  blindness:
    mutual: true
    mutual_is_vacuous_here: >-
      Single-reviewer round; no sibling reports exist to be blind from. The reviewer must
      still declare `sources_read` honestly and set `read_sibling_reports: false`.
    lifted_for: []
    rationale: null
    additional_constraint: >-
      The reviewer MUST NOT be given, and must not read, this file or
      `review_plan.coordinator_prior`, before rendering its verdict -- the same discipline
      DEC-20260822-badc59 DC-3 established for the round this supersedes (PD-V1/PD-V2 of
      DEC-20260812-f56a44 recorded what happens when that discipline is not followed: it must
      not recur). The dispatch prompt for TASK-20260827-be6fc9 is generated from the
      COMMITTED HANDOFF in dispatch_queue.v2.json, not from this plan and not from any
      subagent's return summary (the PD-C4 root cause from the same decision).

  expected_attestation_from_the_reviewer: >-
    The report carries a `review_attestation` block: task_id TASK-20260827-be6fc9,
    joints_owned [J1, J2, J3, J4, J5], sources_read listed honestly and completely,
    read_sibling_reports false, blind_from_respected stating whether the ordering constraint
    on the blind re-derivation was actually honoured, and a terminal verdict
    (PASS/REVISE/REJECT).

  procedure_deviations:
    - >-
      PD-Q1 SINGLE-REVIEWER "BLIND" RE-DERIVATION IS ORDER-DEPENDENT, NOT AGENT-INDEPENDENT.
      The prior round's plan declined to require one on exactly this ground (manufacturing a
      blind_from list the sole reviewer must read anyway is worse than none). This plan
      requires one anyway, on the theory that sequencing (compute from source before reading
      the producer's derivation) is a real, checkable constraint even for one agent, and the
      quantity it protects (the n=15 cost floor) is load-bearing enough to be worth the
      weaker guarantee. If the reviewer's report cannot demonstrate the ordering was honoured,
      that is recorded as a limitation of this round, not silently credited as a full blind
      re-derivation.
