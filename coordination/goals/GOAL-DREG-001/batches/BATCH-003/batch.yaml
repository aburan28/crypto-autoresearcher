batch:
  id: BATCH-003
  goal_id: GOAL-DREG-001
  question_id: RQ-DREG-001
  hypothesis_ids: [H-DREG-001]        # referenced only; this batch changes NO status
  opened_at: "2026-07-26"
  status: queued
  batch_index: 3
  campaign_budget_context: >-
    GOAL-DREG-001 campaign_budget.maximum_batches is 6; this is batch 3. max_concurrent 3,
    but only the validator and red-team tasks may actually run concurrently.
  dispatch_queue_path: coordination/goals/GOAL-DREG-001/batches/BATCH-003/dispatch_queue.yaml
  handoff_paths:
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/handoffs/TASK-20260726-DREG-CTRLB-P1.yaml
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/handoffs/TASK-20260726-DREG-CTRLB-VAL.yaml
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/handoffs/TASK-20260726-DREG-CTRLB-RT.yaml
  task_ids:
    - TASK-20260726-DREG-CTRLB-P1        # executor: the CTRL-B measurement
    - TASK-20260726-DREG-CTRLB-SNAP      # coordinator: snapshot archive, runs alone
    - TASK-20260726-DREG-CTRLB-VAL       # validator: independent integrity review
    - TASK-20260726-DREG-CTRLB-RT        # red team: independent interpretation challenge
    - TASK-20260726-DREG-CTRLB-LEDGER    # coordinator: ledger archive, runs alone

  title: >-
    CTRL-B: replace the [1931, 17947] interval on the genuine degree-6 rank deficit with a
    single exact, support-independent integer at n=12

  decisive_uncertainty: >-
    What is the EXACT genuine (support-independent) degree-6 rank deficit of the boolean
    chained Semaev m=3 system at the single committed cell n=12, t=3, ti=0, seed=2026,
    D=6, nb=24? BATCH-002 measured sem full-column exact GF(2) rank 138573 over a
    174035-column support and null rank 156520 = sr_pred over a 190051-column support
    (the full squarefree space), but those two ranks live in DIFFERENT column spaces: sem's
    support is a strict subset of the null's, short by exactly 16016 columns, ALL of degree
    6. The raw headline deficit 17947 is therefore QUARANTINED as ~89% support confound.
    Column deletion bounds the honest quantity to
    rank(null|_sem-support) in [140504, 156520], i.e. deficit_genuine in [1931, 17947] --
    a factor-9 interval that is too wide for the degree axis to be reported honestly.
    BATCH-003 collapses that interval to one measured number by ranking the NULL matrix on
    sem's OWN 174035-column support, which is the only apples-to-apples comparison space.
  why_this_and_not_something_else: >-
    It is the single cheapest measurement that changes what may be SAID about the degree
    axis. It reuses a committed adjacency pickle and a committed instrument, needs no new
    system build, is bounded by a MEASURED baseline (the full null cell cost 2284.76 s and
    7.68 GB), and is disk-safe. Every alternative rung -- more seeds, n=15/18, D>=7, the
    null first-fall -- is either infrastructure-blocked (the un-chunked DREG_dff.sage is
    host-unsafe) or cannot be interpreted until the support confound is resolved.
  not_in_scope:
    - Any change to H-DREG-001's official status.
    - Any shared-ledger EV-DREG-* or DEC-YYYYMMDD-* id (isolation; deferred to merge).
    - Recomputing or restricting the SEM arm (its 138573 is committed and full-column).
    - The n=15 / n=18 rungs, additional seeds, D>=7 cells, and the null first-fall.
    - The "third arm" genuinely support-matched null construction (a BATCH-004 candidate).
    - Any prime-field, crypto-scale, or attack claim from a toy n=12 cell.

  entry_state_from_batch_002:
    decision: DEC-GOAL-DREG-001-B002        # weaken; goal-scoped proposal, not a shared DEC
    reviews: {validator: PASS-WITH-CAVEATS, red_team: CONFOUNDED-BUT-NOT-EMPTY}
    producer_run: RUN-DREG-001-MEASURE-N12-D6
    committed_numbers:
      cell: {n: 12, t: 3, ti: 0, seed: 2026, D: 6, nb: 24}
      nrows: 183312
      sem: {ncols: 174035, rank: 138573}
      null: {ncols: 190051, sr_pred: 156520, rank: 156520, deficit_vs_sr_pred: 0}
      support_gap_null_minus_sem: 16016      # all degree 6; degrees 0..5 identical
      raw_headline_deficit: 17947            # QUARANTINED as confounded
      deficit_genuine_interval: [1931, 17947]
    standing_caveats:
      - >-
        Validator CAVEAT-2 (inherited): the D6 rank is internally consistent, hash-pinned,
        and resume-verified, but NOT confirmed by a distinct engine. It is not asserted as
        independently reproduced.
      - >-
        "Support-matched null" is a misnomer over GF(2): a boolean polynomial is a monomial
        set, so boolean_null randomizes WHICH monomials appear and cannot hold support fixed.
      - >-
        Direction is wrong-sign for an attack: a larger sem quotient implies
        d_reg(sem) >= d_reg(null) = 7. The degree axis makes Groebner MORE expensive.
      - >-
        The committed support-matched D5 series (~909/1322/1862/1999) is DECELERATING and
        remains the admissible degree-axis observable until CTRL-B lands.

  preregistered_bracket:
    declared_at: "2026-07-26"
    declared_before_execution: true
    restricted_null_rank: [140504, 156520]
    deficit_genuine: [1931, 17947]
    derivation: >-
      Deleting 16016 columns cannot drop the rank by more than 16016:
      rank(null|_sem-support) >= 156520 - 16016 = 140504, so
      deficit_genuine >= 140504 - 138573 = 1931. Deleting columns cannot raise the rank:
      rank(null|_sem-support) <= 156520, so deficit_genuine <= 156520 - 138573 = 17947.
    out_of_bracket_rule: >-
      Out of bracket is an INTEGRITY FAILURE of the instrument or of the BATCH-002
      receipts, never a mathematical finding. It blocks the batch pending a
      Coordinator-scoped repair task and carries no interpretation.

  admissibility_rule: >-
    ONLY full-column exact rank, graded pivot-degree Hilbert function, or q->s collapse is
    evidence. Subset-column corank is INVALID for the sem arm (h012 finding iv). CTRL-B is
    not that: it restricts the NULL arm to sem's own full column support to obtain an
    apples-to-apples comparison space, while sem's 138573 remains its committed
    full-column rank. Timeout, OOM, ENOSPC, or crash is failed_infrastructure (AGENTS rule
    5), never evidence. Sage MUST run with TMPDIR=SAGE_TMP=/Volumes/Volume/sage-scratch-dreg.

  rerank_trigger: >-
    The first in-bracket, snapshot-committed, independently reviewed value of
    deficit_genuine at n=12 / D=6. On that value the coordinator rewrites the degree-axis
    observable and picks the BATCH-004 rung: a value near the 1931 floor makes the genuine
    signal O(10^3), consistent with the decelerating support-matched D5 series, and points
    BATCH-004 at a second seed or a support-corrected D5 rung to test deceleration; a value
    near the 17947 ceiling makes the support correction near-vacuous, restores the D6
    datum's magnitude, and points BATCH-004 at the genuinely support-matched "third arm"
    null to test whether the magnitude survives a null built inside sem's own monomial
    universe. The SIGN is expected to be magnitude-invariant, so no value of
    deficit_genuine may promote an attack path. Secondary triggers: an INVALID or
    INCOMPLETE validator verdict (returns CTRL-B to the executor with a defect list, which
    ends the TASK, not the goal), or a red-team ruling that a fixed-degree-6 deficit
    licenses no degree-axis claim at all (which reranks the whole axis toward the graded-HF
    / q->s route instead of more rank cells).

  exit_criteria:
    - >-
      A snapshot-committed RUN-DREG-001-CTRLB-N12-D6 receipt with an in-bracket rank, OR a
      recorded failed_infrastructure / integrity_failure with the exact cap or defect.
    - Terminal verdicts from both the independent validator and the independent red team.
    - >-
      A ledger-committed goal-scoped decision DEC-GOAL-DREG-001-B003 that states
      deficit_genuine as measured, retires or retains the quarantine on the 17947 headline,
      scopes every statement to the tested cell (toy tier, certificate.kind=none), fills
      knowledge_promotion, and leaves GOAL-DREG-001 with exactly one next_action.
  knowledge_promotion_expectation: >-
    NOT warranted on this batch as designed: a single unreplicated toy cell at one seed,
    one degree, one n, with no distinct-engine confirmation, is not replicated/strong
    evidence. The ledger task must still write the concrete not_warranted reason rather
    than leave the field blank.

  isolation_note: >-
    Isolated branch claude/dreg-linear-law. A live GPT-5.6 co-driver owns the shared main
    ledger and H-DREG-001's official status (GOAL-DREG-001 notes[0]). BATCH-003 mints no
    shared-ledger EV/DEC id and flips no status; its decision is a goal-scoped proposal
    building on DEC-20260720-002, DEC-GOAL-DREG-001-B001, and DEC-GOAL-DREG-001-B002.
  host_note: >-
    48 GB RAM (~14.8 GB free), root volume 57 Gi free, /Volumes/Volume 228 Gi free,
    SageMath 10.9. The 2026-07-20 root-volume ENOSPC event is why the Sage scratch path is
    mandatory; that event was failed_infrastructure, never evidence.
  results: >-
    NONE. BATCH-003 has produced no measurements, reviews, or decisions at authoring time.
    Every number recorded in this batch's coordination artifacts is either a carried-forward
    committed BATCH-002 measurement with its receipt path, or a bound derived arithmetically
    from those measurements and pre-registered before execution.
  owner: coordinator
  authored_at: "2026-07-26"
  updated_at: "2026-07-26"

# The Coordinator decision that OPENS this batch. Goal-scoped and embedded here on
# purpose: the isolation note forbids minting a shared-ledger DEC-YYYYMMDD id on this
# branch, and the batch's own terminal record (DEC-GOAL-DREG-001-B003) belongs to
# TASK-20260726-DREG-CTRLB-LEDGER at the END of the batch. This record approves the
# queue only; it decides nothing about H-DREG-001.
queue_decision:
  coordinator_decision:
    id: DEC-GOAL-DREG-001-B003-QUEUE
    context: >-
      GOAL-DREG-001 BATCH-003 opening. DEC-GOAL-DREG-001-B002 left the genuine,
      support-independent degree-6 rank deficit at n=12 bounded only to [1931, 17947] and
      quarantined the raw 17947 headline as ~89% degree-6 column-support confound. The
      BATCH-002 red-team report specified CTRL-B (RT-N12D6.md, CTRL-B-specified) as the
      cheapest exact route to collapse that interval, and the goal record's next_action
      names it. This decision approves the BATCH-003 dispatch queue that executes it.
    decision: approve
    target_ids: [GOAL-DREG-001, RQ-DREG-001, BATCH-003, TASK-20260726-DREG-CTRLB-P1]
    rationale:
      - >-
        The interval [1931, 17947] is a factor of 9 wide. No honest degree-axis statement
        can be written on it, so the campaign cannot advance without collapsing it.
      - >-
        CTRL-B is bounded by a MEASURED baseline rather than an estimate: the committed
        full-support null cell (190051 columns, same 183312 rows) cost 2284.76 s wall,
        1692.1 s of reduce over 16 units, and 7677116416 B peak RSS at chunk_force 12000.
        The restricted problem is 174035 columns (91.6%), reuses the committed adjacency
        pickle, and rebuilds the unpersisted colidx maps in-process the way the CTRL-A
        probe did in 12.8 s.
      - >-
        The bracket [140504, 156520] on the rank (hence [1931, 17947] on deficit_genuine)
        is pre-registered BEFORE execution and is pure arithmetic from committed numbers,
        so the run is falsifiable as an instrument even though its outcome is not a
        hypothesis test: out-of-bracket means the instrument or the BATCH-002 receipts are
        wrong, and is recorded as an integrity failure with no interpretation attached.
      - >-
        Both independent reviews are reserved up front (validator for integrity, red team
        for interpretation), and both archival tasks run alone, so no result becomes
        durable or official without a verified isolated commit.
    evidence_refs:
      - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/d6-sem/manifest.yaml
      - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/d6-null/manifest.yaml
      - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/rt-control/support_confound_probe.json
      - coordination/goals/GOAL-DREG-001/batches/BATCH-002/reviews/RT-N12D6.md
      - coordination/goals/GOAL-DREG-001/batches/BATCH-002/reviews/VAL-N12D6.md
      - coordination/goals/GOAL-DREG-001/batches/BATCH-002/decision.yaml
      - ledger/goals/GOAL-DREG-001.yaml
    limitations:
      - >-
        This approves a QUEUE, not a result. BATCH-003 has no measurements; nothing here
        supports, weakens, or rejects H-DREG-001, and no status changes.
      - >-
        Even a perfect CTRL-B yields ONE cell: n=12, t=3, ti=0, seed=2026, D=6, one
        instrument, no replication, no distinct-engine confirmation (BATCH-002 Validator
        CAVEAT-2 is inherited until someone discharges it). Toy tier;
        certificate.kind=none; no prime-field or crypto-scale reading is available from it.
      - >-
        A fixed-degree-6 deficit is a graded statement below d_reg(12)=7; whether it
        licenses any d_reg-axis claim is itself referred to the red team (RTQ-1) and is
        NOT assumed by this approval.
      - >-
        Aggregate wall budget 2700 s gives only about 18% headroom over the comparable
        committed run (2284.76 s). If the restricted cell behaves like the full one, the
        maximum_runs 3 checkpoint-resume allowance is what absorbs the overrun; hitting the
        cap is failed_infrastructure and must be recorded as such, never as a bound.
    knowledge_promotion:
      status: not_warranted
      reason: >-
        No new evidence exists at queue-opening time. This is a dispatch approval, not an
        evidence review, so there is nothing to promote to knowledge/findings/. The
        knowledge-promotion gate is evaluated by TASK-20260726-DREG-CTRLB-LEDGER against
        the reviewed CTRL-B result, where a single unreplicated toy cell is expected to be
        not_warranted for a KN-FIND regardless of outcome.
    next_actions:
      - >-
        Coordinator snapshot-commit the BATCH-003 coordination artifacts (this batch.yaml,
        dispatch_queue.yaml, and the three handoff files) as a single isolated commit
        naming BATCH-003, then dispatch TASK-20260726-DREG-CTRLB-P1 to the executor.
    decided_by: coordinator
    decided_at: "2026-07-26"
