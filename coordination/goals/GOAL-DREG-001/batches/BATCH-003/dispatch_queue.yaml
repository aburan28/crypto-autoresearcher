          headroom over a MEASURED baseline, not an estimate of an unmeasured cell.
          Host has ~14.8 GB free of 48 GB.
        sharding_plan: >-
          None (single process). Parallelism is inside m4ri only; the checkpointed
          column loop is sequential by construction and resumes from state.json.
        stop_rule: >-
          At the aggregate 2700 s wall cap or the 12 GB memory cap, stop and record
          failed_infrastructure with the exact cap hit. Never treat a cap as evidence
          (AGENTS rule 5). maximum_runs 3 covers one initial invocation plus at most two
          checkpoint-resume continuations, all counted against the same aggregate cap.
        dominant_stage_id: rank
        stages:
          - id: prepare
            purpose: >-
              Rebuild sem and null colidx maps in-process via macaulay_rows(...); verify
              both system hashes against the committed receipts; verify the sha256 and
              embedded system_hash of the reused null adjacency pickle; compute the keep
              set (174035) and delete set (16016, all degree 6); emit column-audit.json.
            wall_clock_seconds: 300
            cpu_hours: 0.08
            maximum_memory_gb: 6
            parallel_shards: 1
            dominant_operation: macaulay_rows + set difference + degree histogram
            stop_rule: >-
              Abort before any rank work if a hash mismatches, if the kept count != 174035,
              if the deleted count != 16016, or if any deleted monomial has degree != 6.
              Record status: integrity_failure.
          - id: rank
            purpose: chunked exact GF(2) rank over the restricted 174035-column adjacency
            wall_clock_seconds: 2280
            cpu_hours: 0.64
            maximum_memory_gb: 12
            parallel_shards: 1
            dominant_operation: block-m4ri reduce + echelonize per column chunk
            stop_rule: cap -> failed_infrastructure with last completed column index
          - id: receipt
            purpose: manifest.yaml, raw-result.json, logs, hashes, inference block
            wall_clock_seconds: 120
            cpu_hours: 0.03
            maximum_memory_gb: 2
            parallel_shards: 1
            dominant_operation: sha256 + YAML/JSON emit
            stop_rule: >-
              An incomplete receipt (missing any required artifact or inference field)
              blocks the snapshot; it is an integrity failure, not a result.
      budget:
        wall_clock_seconds: 2700
        memory_gb: 12
        maximum_runs: 3

