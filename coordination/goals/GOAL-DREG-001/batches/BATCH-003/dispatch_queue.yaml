dispatch_queue:
  goal_id: GOAL-DREG-001
  batch_id: BATCH-003
  question_id: RQ-DREG-001
  title: >-
    CTRL-B: pin the GENUINE (support-independent) degree-6 rank deficit at n=12 by
    computing the full-column exact GF(2) rank of the NULL Macaulay matrix restricted
    to sem's exact 174035-column support, replacing the quarantined 17947 headline with
    an apples-to-apples number inside the pre-registered bracket [1931, 17947]
  status: queued
  max_concurrent: 3
  opened_at: "2026-07-26"
  supersedes_nothing: true          # BATCH-003 ADDS a control; it does not revise BATCH-002 receipts

  # ------------------------------------------------------------------ #
  # Admissibility (carried forward from BATCH-002 verbatim in spirit,
  # plus the CTRL-B clarification and the mandatory Sage scratch path).
  # ------------------------------------------------------------------ #
  admissibility_rule: >-
    ONLY full-column exact rank, graded pivot-degree Hilbert function, or q->s
    (solution-count) collapse is evidence. Subset-column corank is INVALID for the
    sem arm (h012 finding iv) and may never be reported as sem's rank. A timeout,
    OOM, ENOSPC, or crash is failed_infrastructure (AGENTS rule 5), never evidence
    for or against a mathematical hypothesis. Sage MUST run with
    TMPDIR=SAGE_TMP=/Volumes/Volume/sage-scratch-dreg (never the root volume, which
    has a documented 2026-07-20 ENOSPC incident); the repository volume
    /Volumes/Volume has 228 Gi free, the root volume 57 Gi.
  admissibility_clarification_ctrlb: >-
    CTRL-B is NOT a prohibited subset-column measurement. The h012 finding-iv ban
    applies to the SEM arm: restricting sem's columns understates sem's rank and
    manufactures corank. CTRL-B restricts the NULL arm to the column space sem
    actually spans (sem's FULL 174035-monomial support), which is exactly the
    apples-to-apples comparison space. The sem number it is compared against
    (rank 138573, RUN-DREG-001-MEASURE-N12-D6/d6-sem) remains sem's own FULL-column
    exact rank over sem's full support; it is not recomputed or restricted here.
    A reviewer must check this distinction rather than reject CTRL-B on the ban.

  # ------------------------------------------------------------------ #
  # Model policy (CLAUDE.md "Model policy note"; AGENTS rules 11 and 12).
  # ------------------------------------------------------------------ #
  inference_policy_note: >-
    orchestration/model-policies.yaml routes roles to GPT-5.6 family policy aliases
    (executor-terra, review-xhigh, coordinator-ultra-code). Claude Code CANNOT
    resolve those identifiers: .claude/agents/ subagent frontmatter accepts only
    Claude models and all subagents run with model: inherit. Therefore EVERY artifact
    produced in this batch (run manifest, validation report, red-team report, archive
    receipt, decision) MUST carry an inference block recording requested_policy (the
    alias from its handoff), resolved_model (the exact model identifier that actually
    ran), reasoning_effort, and fallback_used: true. This is an EXPLICIT, declared,
    non-silent fallback, permitted only because it is recorded. Silent substitution,
    an omitted inference block, or a fallback_used flag that contradicts the resolved
    model is an evidence-integrity failure that blocks the archive (AGENTS rule 11).

  isolation_note: >-
    Isolated branch claude/dreg-linear-law. Per GOAL-DREG-001 notes[0], a live
    GPT-5.6 co-driver owns the SHARED main ledger and H-DREG-001's official status.
    BATCH-003 mints NO shared-ledger EV-DREG-* or DEC-YYYYMMDD-* ids and changes NO
    hypothesis status. Its terminal record is a goal-scoped proposal
    (DEC-GOAL-DREG-001-B003) written to this batch's decision.yaml; official minting
    and any status flip are deferred to the Coordinator-of-record / merge. NOTE: the
    machine-readable dispatch schema (tools/research_dispatch.py,
    crypto.autoresearch.dispatch_queue.v1) requires a ledger archive to own artifacts
    under ledger/evidence/ and ledger/decisions/. That requirement is deliberately NOT
    met here and the deviation is recorded, exactly as in BATCH-002, because the
    isolation constraint outranks the schema convenience; if a v1 JSON queue is
    generated for the dispatcher it must carry this same recorded deviation.

  entry_state:
    committed_inputs:
      - id: RUN-DREG-001-MEASURE-N12-D6/d6-sem
        cell: {n: 12, t: 3, ti: 0, seed: 2026, D: 6, nb: 24}
        nrows: 183312
        ncols: 174035
        rank: 138573                 # sem FULL-column exact GF(2) rank
        system_hash: c47d17c3fd70d5d81127e8d37e21441883f720ca10187f57a3aeb47bfe3ba818
      - id: RUN-DREG-001-MEASURE-N12-D6/d6-null
        cell: {n: 12, t: 3, ti: 0, seed: 2026, D: 6, nb: 24}
        nrows: 183312
        ncols: 190051                # = sum_{d<=6} C(24,d): full squarefree space
        sr_pred: 156520
        rank: 156520                 # deficit 0 => null baseline calibrated
        system_hash: f2f610730a7155933be2afe2d979c8535e1f35f5c0c5ddb246fabe717b147344
        measured_wall_seconds: 2284.76
        measured_peak_rss_bytes: 7677116416
      - id: RUN-DREG-001-MEASURE-N12-D6/rt-control/support_confound_probe.json
        support_gap_null_minus_sem: 16016      # ALL at degree 6; degrees 0..5 identical
        sem_subset_of_null: true
        null_is_full_support: true
        elapsed_s: 12.8
    quarantined:
      raw_headline_deficit: 17947
      status: quarantined_confounded
      reason: >-
        sr_pred is support-INDEPENDENT but was applied to two different column spaces;
        <=16016 (~89%) of 17947 is a degree-6 column-support gap, not syzygies.
    open_interval:
      restricted_null_rank: [140504, 156520]   # column-deletion lower bound, rank-monotone upper bound
      deficit_genuine: [1931, 17947]

  tasks:
    # ---------------------------------------------------------------- #
    - id: TASK-20260726-DREG-CTRLB-P1
      role: executor
      status: queued
      review_required: true
      priority: 95
      depends_on: []
      handoff_path: coordination/goals/GOAL-DREG-001/batches/BATCH-003/handoffs/TASK-20260726-DREG-CTRLB-P1.yaml
      read_scope:
        - src/
        - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/
        - coordination/goals/GOAL-DREG-001/batches/BATCH-002/reviews/RT-N12D6.md
      write_scope:
        - experiments/EXP-DREG-001/runs/RUN-DREG-001-CTRLB-N12-D6/
      artifact_paths:
        - experiments/EXP-DREG-001/runs/RUN-DREG-001-CTRLB-N12-D6/manifest.yaml
        - experiments/EXP-DREG-001/runs/RUN-DREG-001-CTRLB-N12-D6/raw-result.json
        - experiments/EXP-DREG-001/runs/RUN-DREG-001-CTRLB-N12-D6/column-audit.json
        - experiments/EXP-DREG-001/runs/RUN-DREG-001-CTRLB-N12-D6/command.txt
        - experiments/EXP-DREG-001/runs/RUN-DREG-001-CTRLB-N12-D6/environment.json
        - experiments/EXP-DREG-001/runs/RUN-DREG-001-CTRLB-N12-D6/stdout.log
        - experiments/EXP-DREG-001/runs/RUN-DREG-001-CTRLB-N12-D6/stderr.log
        - experiments/EXP-DREG-001/runs/RUN-DREG-001-CTRLB-N12-D6/code/ctrlb_restricted_rank.py
      objective: >-
        Compute the FULL-column exact GF(2) rank of the NULL degree-6 Macaulay matrix
        RESTRICTED to sem's exact 174035-column support -- i.e. delete exactly the 16016
        degree-6 columns present in the null support and absent from the sem support --
        for the single committed cell n=12, t=3, ti=0, seed=2026, D=6, nb=24, using the
        column-chunked memory-safe instrument src/h012c_block_m4ri.py and REUSING the
        committed null adjacency pickle
        experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/d6-null/work/h012c_adj_null_n12_t3_i0_D6_s2026_f2f610730a715593.pkl.
        The two colidx maps are NOT persisted on disk and MUST be rebuilt in-process via
        macaulay_rows(...) exactly as in
        experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/rt-control/support_confound_probe.py
        (that whole probe ran in 12.8 s). Report
        deficit_genuine = rank(null|_sem-support) - 138573. Observations only: no
        interpretation, no status language, no comparison to rho or any attack baseline.
      preregistered_bracket:
        declared_at: "2026-07-26"
        declared_before_execution: true
        restricted_null_rank_must_lie_in: [140504, 156520]
        deficit_genuine_must_lie_in: [1931, 17947]
        derivation: >-
          Lower bound: column deletion cannot drop rank by more than the number of deleted
          columns, so rank(null|_sem-support) >= 156520 - 16016 = 140504, giving
          deficit_genuine >= 140504 - 138573 = 1931. Upper bound: deleting columns cannot
          INCREASE rank, so rank(null|_sem-support) <= 156520, giving
          deficit_genuine <= 156520 - 138573 = 17947.
        out_of_bracket_rule: >-
          A value outside [140504, 156520] does NOT falsify H-DREG-001 and is NOT a
          finding. It falsifies either the instrument (restriction implemented wrongly,
          identity mismatch, chunk double-count or drop) or the committed BATCH-002
          receipts (rank 156520 / 138573, support gap 16016). It MUST be reported as
          status: integrity_failure with the offending numbers and the diagnostics run,
          and it blocks the batch pending a Coordinator-scoped repair task. No
          interpretation may be attached to an out-of-bracket value by any agent.
      inference:
        policy: executor-terra
        fallback_allowed: true
        independent_session_required: true    # matches BATCH-002 precedent (TASK-20260721-DREG-N12D6-P1); producer runs in its own executor session, distinct from the Coordinator and from both reviewers
        requires_recorded_resolution: true
      attention_contract:
        decisive_evidence: >-
          The single integer rank(null restricted to sem's 174035-column support) at
          n=12/D=6/seed=2026, and the derived deficit_genuine = rank - 138573, together
          with the column-audit receipt proving the restricted column set is exactly
          sem's support (174035 kept, 16016 deleted, all deleted of degree 6).
        inconclusive_decision: >-
          If the chunked rank does not reach the final column within the aggregate budget
          even with checkpoint-resume, record status: failed_infrastructure with the exact
          cap hit, the last completed column index, the partial rank_acc, and the resume
          state path. A partial rank_acc is NOT a rank and MUST NOT be reported as
          deficit_genuine, a lower bound, or evidence of any kind; the interval
          [1931, 17947] then stands unchanged from BATCH-002.
        local_ambiguity_rule: >-
          Prefer completing this one cell exactly over adding seeds, degrees, or n-rungs.
          Nothing in this batch is worth trading against the exactness of this integer.
        peripheral_exclusions:
          - Any recomputation or re-restriction of the SEM arm (its 138573 is committed and full-column).
          - The un-chunked DREG_dff.sage first-fall instrument (host-unsafe at D6; RAM -> root swap).
          - The n=15 / n=18 rungs, extra seeds, D>=7 cells, and the null first-fall (all deferred).
          - The alternative "third arm" support-matched null construction (RT CTRL-B alternative); not this batch.
        rerank_trigger: >-
          The first in-bracket committed value of deficit_genuine. If it lands near 1931
          the genuine signal is O(10^3) and consistent with the decelerating D5 series
          (~909/1322/1862/1999); if it lands near 17947 the support correction is
          near-vacuous and the degree-6 datum regains magnitude. Either way the SIGN is
          unchanged (larger sem quotient => d_reg(sem) >= d_reg(null) = 7), so no rerank
          may promote an attack path; the rerank governs only how the degree-axis
          observable is reported and what BATCH-004 measures.
      resource_estimate:
        wall_clock_seconds: 2700
        cpu_hours: 0.75
        maximum_memory_gb: 12
        maximum_runs: 3
        dominant_cost: >-
          Column-chunked exact GF(2) rank of a 183312 x 174035 boolean Macaulay matrix
          (block-m4ri, checkpointed carries).
        complexity_hypothesis: >-
          The committed FULL null cell (190051 columns) measured 2284.76 s wall,
          1692.1 s of reduce work over 16 units, peak RSS 7677116416 bytes
          (~7.68 GB) at chunk_force 12000. The restricted problem has 174035 columns
