red_team_report:
  id: RT-20260725-691
  task_id: TASK-20260725-691
  goal_id: GOAL-DREG-001
  batch_id: BATCH-003
  claim_under_review: >-
    Frozen CTRL-B (TASK-20260725-689) pins the genuine support-independent D6
    deficit via full-column exact GF(2) rank of the null Macaulay matrix
    restricted to sem's exact 174035-column support, without reintroducing the
    BATCH-002 support-gap confound; quarantine predicates Q1–Q4 are
    machine-checkable; and the freeze does not authorize rank measurement in
    BATCH-003.
  verdict: REVISE
  verdict_basis: >-
    The CTRL-B mathematical definition and report metric correctly implement the
    BATCH-002 Red Team control and do not, as written, reintroduce the
    support-gap confound or authorize measurement in this batch. However, the
    stated machine_check strings for Q1/Q3/Q4 are not closed executable
    predicates, and after_pass_admissible / design-note "After PASS" wording
    ambiguously ties structural admissibility to protocol-review PASS rather
    than to a later admitted CTRL-B execution receipt. Tighten those gates
    before any executor batch.
  breakthrough_claimed: false
  official_state_transition: none

  inference:
    requested_policy: review-xhigh
    resolved_model_id: cursor-grok-4.5-high-fast
    reasoning_effort: high
    fallback_used: true
    authorization_ref: AMEND-PATH-001-001
    adapter_version: cursor-subagent-2026-07
    independent_session: true
    note: >-
      Preferred review-xhigh unavailable in this harness; fallback authorized by
      AMEND-PATH-001-001. fallback_used is infrastructure/policy, not evidence.

  snapshot_review:
    producer_task_id: TASK-20260725-689
    archive_task_id: TASK-20260725-690
    reviewed_commit: 57adc3cf4afbc956d520d3ffbfd84cf07d3ca9ad
    reachable_from_review_head: true
    parent_commit: ca42cbeb1c7648d0b8991b8dd3748c497c97ee9c
    changed_paths_exact:
      - coordination/goals/GOAL-DREG-001/batches/BATCH-003/archives/TASK-20260725-690/snapshot-receipt.json
      - coordination/goals/GOAL-DREG-001/batches/BATCH-003/tasks/TASK-20260725-689/ctrl_b_protocol.yaml
      - coordination/goals/GOAL-DREG-001/batches/BATCH-003/tasks/TASK-20260725-689/protocol_design_note.md
    artifact_hashes_match_receipt: true
    verified_hashes:
      ctrl_b_protocol.yaml: 0c5a7b4eded01117264797429b0f5ef2aa92b627c8b042894dc7a7cb91db86d0
      protocol_design_note.md: 2b9586d8e8c91309d1711acd71901e14b7b3cfa47f2785954ae2d699e3150e91
    receipt_metadata_limit: >-
      Archive receipt retains verification.status=pending_post_commit and null
      commit_sha/parent_sha. Durable binding used here is Git: commit 57adc3c is
      reachable from HEAD, changes exactly the three declared paths, and producer
      SHA-256 values match the receipt. Working-tree-only producer edits were not
      treated as durable evidence.
    durable_evidence_used: committed_snapshot_only
    supporting_context_read_only:
      - coordination/goals/GOAL-DREG-001/batches/BATCH-002/reviews/RT-N12D6.md
      - coordination/goals/GOAL-DREG-001/batches/BATCH-002/decision.yaml
      - ledger/goals/GOAL-DREG-001.yaml
      - coordination/goals/GOAL-PATH-001/batches/BATCH-001/amendments/AMEND-001/fallback_authorization.yaml

  falsification_axes:
    support_gap_confound_reintroduced:
      result: NOT_FALSIFIED
      assessment: >-
        As frozen, CTRL-B ranks null on sem's exact support and reports
        deficit_genuine = rank(null|sem_support) - 138573, explicitly refusing
        to treat sr_pred as support-matched. That is the correct
        support-aligned quantity named in RT-N12D6 CTRL-B / DEC-GOAL-DREG-001-B002.
        Residual implementation risks (wrong deletion set; paraphrasing 17947)
        are admission-gate issues, not a redefinition of the confound.
    quarantine_predicates_not_machine_checkable:
      result: FALSIFIED
      assessment: >-
        Q1's "as a structural claim", Q3's open ">=1931 / clean D5 series"
        language, and Q4's unbound field equality are not closed
        machine-checkable predicates. No checker script or schema path is
        named. admission_metrics.quarantine_predicates_Q1_Q4_hold therefore
        cannot presently be evaluated by a deterministic harness.
    illicit_measurement_authorization:
      result: NOT_FALSIFIED_WITH_WORDING_RISK
      assessment: >-
        status=review_only_freeze and authorization text explicitly forbid rank
        measurement in BATCH-003 and require independent review PASS before
        execution. Budgets/write_root are preparatory. However,
        after_pass_admissible and the design note's "After PASS /
        deficit_genuine becomes the admissible D6 structural number" can be
        misread as minting a structural number at protocol-review PASS without
        a measured receipt — revise wording, do not treat as current authorization
        of measurement.

  objections:
    - id: OBJ-691-1
      severity: high
      category: machine_checkability
      target: quarantine.predicates Q1, Q3, Q4 and admission_metrics.quarantine_predicates_Q1_Q4_hold
      finding: >-
        Q1 mixes a regex with an uncheckable semantic rider ("as a structural
        claim") and misses paraphrases ("raw deficit 17947", "17947 vs 0") while
        risking false positives on quarantine prose that must mention 17947.
        Q3 is prose set-membership ("{>=1931 lower bound} or clean D5 series;
        not 17947") without pinned D5 tuple/paths and without a pre-/post-CTRL-B
        branch; it also conflicts with expected_interval's upper endpoint 17947
        being a possible later deficit_genuine. Q4 asserts
        structural_d6_number == deficit_genuine with no schema location and is
        undefined before measurement. These are not machine-checkable as frozen.
      consequence: >-
        REVISE required: replace Q1–Q4 machine_check strings with closed boolean
        checks on named YAML/JSON fields (and/or a named checker), including an
        allowlist for quarantine documentation mentions of 17947.

    - id: OBJ-691-2
      severity: medium
      category: authorization_wording
      target: after_pass_admissible; protocol_design_note.md "After PASS"
      finding: >-
        "After PASS" is overloaded: protocol-review PASS vs execution-admission
        PASS. The design note sentence that deficit_genuine "becomes the
        admissible D6 structural number" after PASS can be read as structural
        admission without a CTRL-B receipt. The authorization block correctly
        forbids measurement now; the ambiguity is about when the structural
        number may be cited later.
      consequence: >-
        Split labels: after_protocol_review_pass_allows_execution_only vs
        after_ctrl_b_execution_admitted_allows_deficit_genuine_citation.

    - id: OBJ-691-3
      severity: medium
      category: admission_completeness
      target: support_restriction.reuse / admission_metrics
      finding: >-
        Admission requires restricted_ncols_equals_174035 but not an explicit
        identity check that the deleted column set equals null_support \\
        sem_support (CTRL-A gap of 16016 degree-6 monomials), nor a hash pin of
        the sem column set / colidx maps reused from CTRL-A. A wrong 174035-subset
        could pass a ncols-only gate and silently reintroduce a cross-support
        comparison.
      consequence: >-
        Add admission predicates: deleted_ncols==16016,
        deleted_set_hash==CTRL-A_gap_hash (or equivalent),
        restricted_support_hash==sem_support_hash; keep full_column_coverage_loop.

    - id: OBJ-691-4
      severity: low
      category: scope_guard
      target: after_pass_still_not_claimed / claim boundary
      finding: >-
        Protocol correctly refuses d_reg asymptotics, sub-rho, and rehabilitation
        of raw 17947. Red Team adds: protocol PASS is not a d_reg result, not a
        pin of deficit_genuine, and not a shared-ledger H-DREG-001 status change.
      consequence: >-
        Preserve claim boundary in any later executor/EV/DEC drafting.

  fatal_objections: []

  required_controls:
    - id: CTRL-Q-MACHINE
      status: REQUIRED_BEFORE_EXECUTOR
      what: >-
        Rewrite quarantine predicates as closed checks, e.g.:
        (Q2) raw_headline_status field == quarantined_confounded on any EV/DEC
        citing D6;
        (Q1') forbid structural_metric_id in {deficit_vs_sr_pred, raw_deficit}
        with value 17947; allow quarantine_note mentions;
        (Q3') before CTRL-B admission: only
        genuine_support_independent_deficit_lower_bound>=1931 or the pinned
        committed D5 support-matched series (exact tuple + run IDs from
        DEC-GOAL-DREG-001-B002 / VALIDATE receipts) may be cited as structural;
        (Q4') after CTRL-B admission: structural_d6_number must equal measured
        deficit_genuine from the admitted receipt and must not equal the
        quarantined raw headline unless measured deficit_genuine itself equals
        that value AND metric_id==deficit_genuine.
    - id: CTRL-SUPPORT-HASH
      status: REQUIRED_IN_EXECUTOR_CARD
      what: >-
        Pin sem support / deletion-set hashes from committed CTRL-A
        support_confound_probe.json (or regenerate from seed and match
        system hashes) as hard admission metrics alongside ncols==174035.
    - id: CTRL-AUTH-SPLIT
      status: REQUIRED_DOC_FIX
      what: >-
        Relabel after_pass_* so protocol-review PASS only unlocks a later
        executor task; structural citation of deficit_genuine requires an
        admitted CTRL-B run receipt.

  counterexample_or_mutation: >-
    Cheapest discriminating mutation against a false "ncols-only" admission:
    delete any 16016 null columns that are NOT exactly null\\sem (e.g. random
    degree-6 pivots). Restricted ncols can still be 174035, but
    rank(null|wrong_support) - 138573 is not the BATCH-002 genuine deficit and
    can invent or erase the >=1931 signal. A support-set hash gate kills this;
    a ncols-only gate does not.

  baseline_comparison: >-
    certificate.kind=none pure rank control; no Pollard-rho / BSGS end-to-end
    path is authorized or implied. Closest specialized baseline remains the
    semi-regular d_reg / last-fall cost model (FINDING_v2 / BATCH-001 crypto
    generic baseline): direction of any positive genuine deficit remains
    wrong-sign for H-DREG-001 WIN (larger sem quotient => d_reg(sem) >=
    d_reg(null)=7). Protocol PASS does not move that comparison.

  narrowest_supported_statement: >-
    At committed snapshot 57adc3c, the frozen CTRL-B card correctly specifies the
    support-aligned D6 control named by RT-N12D6 (rank null on sem's 174035
    columns; report deficit_genuine in [1931, 17947]; keep raw 17947
    quarantined) and does not authorize measurement in BATCH-003. It is not yet
    executor-ready because quarantine machine-checks and after_pass structural
    wording must be revised, and support-set identity must be an admission
    metric. No exact deficit_genuine, d_reg, growth, gap, or sub-rho claim is
    supported by this review.

  next_concrete_action: >-
    Coordinator (or a scoped repair producer) revises ctrl_b_protocol.yaml
    quarantine.predicates and after_pass_* labels plus support-hash admission
    metrics; re-snapshot; then re-run a thin Red Team check. Only after that
    PASS may an executor batch run chunked block-m4ri CTRL-B under a fresh
    write_scope. Until then, keep raw 17947 quarantined and treat the committed
    support-matched D5 series as the honest degree-axis observable.

  scope_limits:
    - Review-only protocol falsification; no rank measurement performed.
    - Single-cell toy scope inherited from BATCH-002 (n=12,t=3,ti=0,seed=2026,D=6).
    - Does not flip H-DREG-001 shared-ledger status; does not mint EV/DEC.
    - Receipt metadata pending_post_commit noted; Git binding 57adc3c used.
    - Protocol PASS (even after revise) is not a mathematical d_reg result.

  artifact_paths:
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/tasks/TASK-20260725-691/red_team_report.yaml
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/tasks/TASK-20260725-691/falsification_review.md
