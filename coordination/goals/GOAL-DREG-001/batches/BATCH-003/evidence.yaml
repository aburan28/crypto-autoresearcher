evidence:
  id: EV-GOAL-DREG-001-B003
  hypothesis_id: H-DREG-001
  experiment_ids: [EXP-DREG-001]
  run_ids:
    - RUN-DREG-001-CTRLB-N12-D6
  type: empirical
  direction: against
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  scope: >-
    ONE cell: n=12, t=3, target_index=0, seed=2026, D=6, nb=24, boolean chained
    Semaev m=3. Single seed, single target, single degree. Not d_reg itself
    (d_reg(12)=7 > 6). No confidence intervals. No growth-in-n content.
    Toy scale; carries no cryptographic implication of any kind.

  observations:
    - >-
      Observation: the exact GF(2) rank of the T11 support-matched NULL degree-6
      Macaulay matrix RESTRICTED to sem's exact 174035-column support is 156520
      (RUN-DREG-001-CTRLB-N12-D6, raw-result.json rank_null_restricted;
      matrix 183312 x 174035, 15 chunks, coverage of [0,174035) exactly once).
    - >-
      Observation: 156520 equals the committed UNRESTRICTED null rank 156520
      (RUN-DREG-001-MEASURE-N12-D6/d6-null/manifest.yaml). Deleting the 16016
      degree-6 columns present in the null support and absent from sem's support
      therefore cost zero rank.
    - >-
      Observation: deficit_genuine = 156520 - 138573 = 17947, where 138573 is
      sem's committed full-column degree-6 rank
      (RUN-DREG-001-MEASURE-N12-D6/d6-sem). This is numerically identical to the
      raw headline BATCH-002 quarantined, because
      rank(null|_sem-support) = rank(null_full) = sr_pred = 156520.
    - >-
      Observation: on the identical 174035-column space, sem's degree-<=6 ideal
      has dimension 138573 against the null's 156520; sem's quotient is 35462
      against the null's 17515, a factor of 2.02 (RT-CTRLB.md).
    - >-
      Observation (independent validation): 0 of 174035 restricted columns
      differ from a true sem-support restriction, while 118580 differ from a
      first-174035 truncation; nonzeros over kept columns 5468179 against
      5454177 for the truncation counterfactual; restriction_sha256
      d409bc62a4874ad4f328cdd286a51c9cbadbe64324bff4b92d18536181632e2d
      independently recomputed and matched (VAL-CTRLB.md VC-1..VC-8).
    - >-
      Observation (no overshoot): across 27 carrier checkpoints the pivot-row
      union has cardinality 156520 with 0 duplicates, and rank_acc is restored
      rather than re-added across the DEV-1 resume boundary (VAL-CTRLB.md).

  interpretation_boundaries:
    licenses: >-
      A graded Hilbert-function statement at degree 6 for this single cell, on a
      common column space: the boolean chained Semaev system's degree-6 quotient
      is 2.02x the support-matched semi-regular null's.
    does_not_license: >-
      d_reg(sem) itself (D=6 < d_reg=7; a larger degree-6 quotient does not
      entail HF_sem[7] > 0); any growth-in-n claim; the gap(n)=d_reg-d_ff
      clause; any CI-backed separation; attribution of the 17947 to
      Semaev-specific syzygies (see RT-CAV-B3-5); anything cryptanalytic
      (certificate_kind none, toy tier, 1 seed, 1 target).

  direction_rationale: >-
    Recorded as AGAINST the WIN scenario. deficit = sr_pred - rank, so a larger
    deficit means a SMALLER Semaev ideal, a LARGER quotient, and a LATER
    collapse: d_reg(sem) >= d_reg(null) = 7, i.e. Groebner solving is further
    from rho, not closer. The direction is unchanged from BATCH-002 and the
    magnitude is roughly nine times larger. A bigger number here is worse news
    for the attack, not better.

  supersedes_interpretation_of:
    - id: EV-context-BATCH-002-quarantine
      what: >-
        The BATCH-002 red-team assertion that ">= ~89% of 17947 is a degree-6
        support gap, not syzygies", and the derived bound "genuine
        support-independent deficit >= 1931 (exact value in [1931, 17947])".
      why: >-
        Measured directly: 0 of 17947 is support gap. The predecessor's
        column-deletion inequality rank >= null_rank - support_gap was sound as
        a WORST-CASE BOUND, but its verdict and narrowest_supported_statement
        collapsed that bound to a point estimate at its unfavourable endpoint.
        RT-N12D6's own OBJ-1 quantification block was stated correctly ("at most
        16016 ... genuine >= 1931"); the inversion entered at the verdict and
        was inherited by the ledger.

  reviews:
    validator:
      report: coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/VAL-CTRLB.md
      verdict: PASS-WITH-CAVEATS
    red_team:
      report: coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/RT-CTRLB.md
      verdict: QUARANTINE-LIFTS, NEGATIVE-STRENGTHENS

  binding_caveats:
    - id: VAL-CAVEAT-2-inherited
      detail: >-
        NO distinct-engine re-rank was performed. This integer is internally
        consistent, hash-bound, coverage-audited, carrier-audited and
        resume-verified; it is NOT independently reproduced.
    - id: RT-CAV-B3-2
      detail: >-
        The endpoint landing was a PREDICTION, not a coincidence. Rank is
        preserved under the deletion iff the null's row space contains no
        nonzero vector supported inside the 16016 deleted columns; general
        position gives dimension 0 with slack 17515. The pre-registered bracket
        was therefore close to a theorem and "in bracket" was near-vacuous. The
        Validator independently narrowed the genuinely open window to
        [153863, 156520] (width 2658) against the pre-registered
        [140504, 156520] (width 16017), since 153863 kept columns lie inside the
        committed already-independent full-null prefix.
    - id: RT-CAV-B3-3
      blocking_for: any citation of the D5 series as a clean support-matched observable
      detail: >-
        The BATCH-002 fallback observable is NOT support-matched either. The
        committed receipts give sem D5 ncols 46717 against null 55455, a gap of
        8738 ({5: 8736, 4: 2}), growing to 17.8% and 19.2% at n=15 and n=18. The
        predecessor's own bound at D5 yields deficit_genuine(D5) in
        [-7416, +1322] and cannot establish positivity. The fallback is more
        confounded than the datum it replaced.
    - id: RT-CAV-B3-4
      detail: >-
        H-DREG-001's primary metric is anti-aligned with its own mechanism: the
        statement's "equivalently" (deficit grows <=> d_reg falls) is false.
        17947, at 53.5% of the semi-regular quotient, would "confirm"
        predictions[0] while being evidence AGAINST the WIN scenario.
    - id: RT-CAV-B3-5
      detail: >-
        CTRL-B compares sem against a PROJECTION of the null, not against a
        support-confined system. A per-equation variable-support-matched null
        reaches 190049 of 190051 degree-6 columns, so a genuinely
        support-matched null appears not constructible by randomization. This
        vindicates CTRL-B's design and de-prioritises the predecessor's proposed
        "third arm", but blocks attributing the 17947 to Semaev-specific
        syzygies.
    - id: D5-deceleration-fragile
      detail: >-
        The "decelerating 909/1322/1862/1999" pillar is fragile: d_reg is
        6/7/8/9 at n=9/12/15/18, so that fixed-D=5 series sits at offsets
        1/2/3/4 below collapse and normalizes to 0.2921/0.0508/0.0180/0.0067.
        The negative verdict does not depend on it; the sign carries it at any
        magnitude.

  inference:
    requested_policy: coordinator-ultra-code
    resolved_model: claude-opus-5
    fallback_used: true
    reasoning_effort: "unavailable - not exposed by this runtime; recorded as unavailable rather than guessed"

