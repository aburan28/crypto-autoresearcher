handoff:
  id: TASK-20260726-DREG-CTRLB-RT
  from: coordinator
  to: red-team
  goal_id: GOAL-DREG-001
  batch_id: BATCH-003
  question_id: RQ-DREG-001
  objective: >-
    Try to falsify the INTERPRETATION of the CTRL-B result, not its arithmetic (the
    validator owns integrity). Answer three questions explicitly and separately:
    (Q1) Does a now support-INDEPENDENT rank deficit at one cell license ANY degree-axis
    claim at all? The probe degree is FIXED at D=6 while d_reg(12)=7, so a deficit is a
    statement about the graded Hilbert function at degree 6, not about d_reg itself.
    State the narrowest supported statement in one sentence.
    (Q2) What is the CHEAPEST falsification of that statement? Name a concrete control,
    its cost in wall seconds and GB on this host, and the outcome that would kill the
    reading.
    (Q3) Does the SIGN of the residual still reinforce the negative control -- a larger
    sem quotient implies d_reg(sem) >= d_reg(null) = 7, so the Semaev cascade RAISES the
    solving degree and moves Groebner FURTHER from Pollard-rho, not closer?
  uncertainty_reduced: >-
    Whether the corrected, apples-to-apples deficit changes the standing reading at all.
    BATCH-002 quarantined the 17947 headline as ~89% support confound and left the genuine
    value in [1931, 17947]. Once that interval collapses to a number, the open question is
    no longer "is it confounded" but "does an unconfounded fixed-degree deficit at one toy
    cell mean anything for RQ-DREG-001" -- and if the answer is little or nothing, the
    coordinator must know that before writing a decision on it.
  inputs:
    - experiments/EXP-DREG-001/runs/RUN-DREG-001-CTRLB-N12-D6/
      # review the COMMITTED snapshot, not the working tree.
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/snapshot/snapshot_commit_receipt.json
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/dispatch_queue.yaml
    - coordination/goals/GOAL-DREG-001/batches/BATCH-002/reviews/RT-N12D6.md
      # your own predecessor's CTRL-A audit, CTRL-B specification, and the
      # CONFOUNDED-BUT-NOT-EMPTY verdict this task follows up.
    - coordination/goals/GOAL-DREG-001/batches/BATCH-002/reviews/VAL-N12D6.md
    - coordination/goals/GOAL-DREG-001/batches/BATCH-002/decision.yaml
      # DEC-GOAL-DREG-001-B002 (weaken), the quarantine, and the D5 series framing.
    - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/
    - ledger/goals/GOAL-DREG-001.yaml
    - research/dreg-linear-law/FINDING_v2.md
      # linear d_reg law c*=0.2374790709; crypto-scale generic baseline t=7 n=161 ->
      # d_reg=150, Groebner 2^1194 vs rho 2^80.5; Part E first-fall relation-count analysis.
  required_lines_of_attack:
    - id: RTQ-1-degree-axis-license
      what: >-
        Rule on whether a deficit measured at a FIXED degree below d_reg supports any
        claim about d_reg, about deficit GROWTH, or about the gap(n)=d_reg-d_ff clause of
        H-DREG-001. If it supports only a graded-HF statement at degree 6 for this cell,
        say exactly that and say what H-DREG-001 clause remains untouched.
    - id: RTQ-2-cheapest-falsification
      what: >-
        Name the single cheapest control that could overturn the reading, with its cost on
        this host (48 GB RAM, ~14.8 GB free; the committed D6 cell cost 2284.76 s and
        7.68 GB). Candidates to weigh explicitly: the RT CTRL-B "third arm" (a random
        boolean system drawn ONLY from sem's monomial universe with the same per-equation
        degree histogram -- a genuinely support-matched null); a second seed at the same
        cell; the D=5 rung recomputed under the same restriction to test whether the
        support-corrected series is decelerating; a graded pivot-degree Hilbert function
        readout. Rank them by information per second.
    - id: RTQ-3-sign-and-baseline
      what: >-
        Confirm or refute that the residual's sign still points the wrong way for an
        attack, and audit the honesty of the baseline framing (certificate.kind=none, no
        end-to-end cost path, so no direct rho/BSGS comparison is instantiated). Say
        plainly if the batch's honest reading is "no attack, negative control reinforced".
    - id: RTQ-4-residual-asymmetry
      what: >-
        Audit whether the comparison is NOW genuinely apples-to-apples. Both arms share
        the identical 174035-column space, the same 183312 rows, the same seed and cell.
        Look for any REMAINING asymmetry that could manufacture or mask a deficit: row
        multiset / per-equation degree histogram differences between sem and the boolean
        null, the fact that over GF(2) a boolean polynomial is just a monomial set so a
        null can randomize WHICH monomials appear but not hold support fixed, and whether
        restricting the null's columns changes what "semi-regular" means for the restricted
        matrix (sr_pred 156520 is support-independent and is NOT the right predictor for
        the restricted matrix -- say so if true).
    - id: RTQ-5-magnitude-sensitivity
      what: >-
        State whether the CONCLUSION changes anywhere in the bracket. If deficit_genuine
        lands near 1931 the genuine signal is O(10^3) and consistent with the committed,
        decelerating support-matched D5 series (~909/1322/1862/1999); if it lands near
        17947 the support correction is near-vacuous and the D6 datum regains magnitude.
        Say which parts of the reading are magnitude-invariant (e.g. the sign) and which
        are not.
  constraints:
    - >-
      Independent session, and an agent that did not originate the CTRL-B claim
      (AGENTS rule 12; review-xhigh policy class).
    - >-
      Write ONLY coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/RT-CTRLB.md.
      This task owns NO run directory and commissions NO new compute. Do NOT write controls
      into the producer run directory: in BATCH-002 the red team wrote rt-control/ inside
      the coordinator-owned run scope and it had to be recorded as a scope deviation in the
      batch decision. If a bounded control is genuinely needed, PROPOSE it in the report as
      a named successor task with its cost and write_scope; the coordinator will scope it.
      Any scratch you use lives outside the repository under
      /Volumes/Volume/sage-scratch-dreg/ (never the root volume), with the exact command and
      genuine output inlined in the report.
    - >-
      Do not re-litigate integrity: the validator owns receipts, hashes, column sets, and
      the bracket. If you believe the number is wrong, say so as a referral to the
      validator, not as an independent finding.
    - >-
      Do not convert a scoped objection into an impossibility result, and do not convert a
      negative direction into a proof of security. Negative evidence closes only the exact
      tested scope (AGENTS rule 6).
    - >-
      Scope everything to n=12, t=3, ti=0, seed=2026, D=6, this solver and this budget.
      Toy tier only; never present toy evidence as crypto-scale validation (AGENTS rule 7).
    - >-
      Never fabricate a command, output, timing, statistic, or citation. If you cannot
      check something, list it as unchecked.
    - >-
      You may not change any hypothesis or experiment status; H-DREG-001 stays where the
      coordinator put it.
  deliverables:
    - >-
      coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/RT-CTRLB.md containing a
      machine-readable YAML red_team_report block with: id, task_id, claim under review,
      the snapshot commit reviewed, a terminal verdict, enumerated objections with severity
      and target, an explicit answer to RTQ-1..RTQ-5, a counterexample or mutation where
      one exists, a baseline_comparison, a one-sentence narrowest_supported_statement, a
      next_concrete_action, scope_limits, and an inference block (requested_policy:
      review-xhigh, resolved_model, reasoning_effort, fallback_used: true).
  artifact_paths:
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/RT-CTRLB.md
  write_scope:
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/RT-CTRLB.md
  archived_by: TASK-20260726-DREG-CTRLB-LEDGER
  inference:
    policy: review-xhigh
    fallback_allowed: true
    independent_session_required: true
    requires_recorded_resolution: true
    note: >-
      Claude Code cannot resolve GPT-5.6 policy aliases (CLAUDE.md model policy note).
      Record requested_policy: review-xhigh, the exact resolved_model, reasoning_effort,
      and fallback_used: true in RT-CTRLB.md. Never silently substitute.
  budget:
    wall_clock_seconds: 3600
    memory_gb: 8
    maximum_runs: 2
    note: >-
      Analysis and authoring over committed artifacts; no heavy computation is funded. If
      the cheapest falsification you identify needs compute, propose it rather than run it.
  completion_gate:
    - RT-CTRLB.md exists at the declared path with a terminal verdict.
    - RTQ-1..RTQ-5 are each answered explicitly, including a plain INCONCLUSIVE where warranted.
    - >-
      The report contains exactly one narrowest_supported_statement, scoped to the tested
      cell, parameters, solver, and budget, with its claim tier and certificate kind stated.
    - >-
      The report names ONE cheapest falsification with a cost estimate grounded in the
      committed measurements (2284.76 s, 7.68 GB for the full D6 null cell; 12.8 s, 3.6 GB
      for the CTRL-A support probe) and does not invent timings.
    - >-
      The report states whether the conclusion is magnitude-invariant across [1931, 17947]
      and whether the sign still reinforces the negative control.
    - The report carries its inference block with fallback_used: true.
  return_format: >-
    A single markdown file with an embedded YAML red_team_report block. Objections,
    falsification routes, and scope limits; no status change and no new committed compute.
  assigned_at: "2026-07-26"
  assigned_by: coordinator
