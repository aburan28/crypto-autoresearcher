handoff:
  id: TASK-20260727-N21-VAL-C2
  from: coordinator
  to: validator
  objective: >-
    Independently verify, from Git object content at the snapshot commit,
    the EXP-DREG-004 sem n=21 D5 rank completion: archive integrity, state
    self-consistency, identity, mirror coverage, and final deficit arithmetic.
  inputs:
    - snapshot commit receipt: coordination/goals/GOAL-DREG-001/batches/BATCH-003/archives/TASK-20260727-N21-SNAP-C2/snapshot_commit_receipt.json
    - experiments/EXP-DREG-004/runs/RUN-DREG-004-REBUILD-A/work/h012c_rebuild_a_sem_n21_t0/state.json (at the snapshot commit)
    - experiments/EXP-DREG-004/checkpoint-summary.json and mirror-log.json (at the snapshot commit)
  checks:
    - Snapshot commit: resolves, reachable from HEAD, expected parent, exactly the declared paths, every SHA-256 matches commit content, message contains TASK-20260727-N21-SNAP-C2 and the record IDs.
    - state.json: done=true, next_col == ncols == 778394, identity fields n=21, t=3, ti=0, d=5, seed=2026, which=sem, system_hash prefix 0da7ff6aa40007e8, pred == 268674.
    - sum(npiv over carries) == rank_acc; every carry sha256 matches committed blob content; every carry has a mirror entry with in-object-store blob.
    - deficit arithmetic: pred - rank == reported deficit; no intermediate value altered.
    - Report PASS/FAIL per check with exact values; no verdict on H-DREG-001.
  constraints:
    - Compute every hash yourself from Git object content; never from the working tree.
    - Do not modify any file; your only write is your report.
    - State plainly that this is receipt/integrity validation, not evidence for or against any mathematical claim.
  deliverables:
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/TASK-20260727-N21-VAL-C2/validation_report.yaml
  artifact_paths:
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/TASK-20260727-N21-VAL-C2/validation_report.yaml
  archived_by: TASK-20260727-N21-LEDGER-C2
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - every check has an explicit PASS/FAIL with exact observed values
    - every hash computed in-session from Git object content
    - no repository file modified
