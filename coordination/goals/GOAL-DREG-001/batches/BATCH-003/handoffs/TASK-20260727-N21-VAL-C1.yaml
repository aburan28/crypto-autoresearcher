handoff:
  id: TASK-20260727-N21-VAL-C1
  from: coordinator
  to: validator
  objective: >-
    Independently verify, from Git object content at the snapshot commit
    (never the working tree), that the EXP-SIG-007 two-partition control is
    complete and that its frozen pass criterion holds. You did not originate
    any of this work; challenge everything.
  inputs:
    - snapshot commit receipt: coordination/goals/GOAL-DREG-001/batches/BATCH-003/archives/TASK-20260727-N21-SNAP-C1/snapshot_commit_receipt.json
    - experiments/EXP-SIG-007/analysis.md COMPLETION SECTION (pass criterion and expected values)
    - experiments/EXP-SIG-007/control_fwd/rank5/state.json and control_rev/rank5/state.json (at the snapshot commit)
  checks:
    - Snapshot commit: resolves, reachable from HEAD, expected parent, exactly the declared paths (no extras, no deletions), every SHA-256 matches commit content (git show <commit>:<path> | shasum -a 256), message contains TASK-20260727-N21-SNAP-C1 and the record IDs.
    - Both legs: done=true, next_col == ncols == 778394, rank_acc == 265950.
    - Each leg: sum(npiv over carries) == rank_acc; every carry's state.json sha256 matches the committed blob content.
    - fires_rev receipts: raw.json parses; args match sanctioned mechanism (n=21, seed=1, chunk_force=5000, work=control_rev, driver runtime/SIG7_run.sage); stdout.txt non-empty; fire_009 is an empty directory and is recorded, not counted.
    - Carry-over check: the committed control_fwd completion (rank 265,950, done) is consistent with the reverse leg.
  constraints:
    - Compute every hash yourself from Git object content; copy nothing from unverified sources.
    - Do not modify any file; your only write is your report.
    - Report PASS/FAIL per check with exact values; no verdict on H-SIG-001 (Coordinator's call).
    - State plainly that this is receipt/integrity validation, not evidence for or against any mathematical claim.
  deliverables:
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/TASK-20260727-N21-VAL-C1/validation_report.yaml
  artifact_paths:
    - coordination/goals/GOAL-DREG-001/batches/BATCH-003/reviews/TASK-20260727-N21-VAL-C1/validation_report.yaml
  archived_by: TASK-20260727-N21-LEDGER-C1
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - every check above has an explicit PASS/FAIL with exact observed values
    - every hash was computed in-session from Git object content
    - no repository file modified
