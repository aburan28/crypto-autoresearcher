ctrl_b_protocol:
  task_id: TASK-20260725-701
  goal_id: GOAL-DREG-001
  batch_id: BATCH-004
  status: review_only_freeze
  repairs: RT-20260725-691
  supersedes_protocol_task: TASK-20260725-689
  supersedes_failed_card: TASK-20260725-621
  authorization: >-
    Review-only repair freeze. No rank measurement is authorized in this batch
    or by this artifact. Protocol-review PASS (if granted later) only unlocks
    scheduling of a later executor task under a fresh write_scope. It does not
    mint deficit_genuine, does not change H-DREG-001 status, and is not a d_reg
    mathematical result. Structural citation of deficit_genuine requires an
    admitted CTRL-B run receipt that passes all admission_metrics.
  inference:
    requested_policy: research-sol-max
    resolved_model_id: cursor-grok-4.5-high-fast
    fallback_used: true
    authorization_ref: AMEND-PATH-001-001
    note: >-
      Preferred research-sol-max unavailable in this harness; model is authorized
      fallback under AMEND-PATH-001-001. fallback_used is infrastructure/policy,
      not mathematical evidence.
  cell:
    n: 12
    t: 3
    ti: 0
    seed: 2026
    D: 6
    field: GF(2)
  definition:
    name: CTRL-B
    statement: >-
      Full-column exact GF(2) rank of the null Macaulay matrix restricted to
      sem's exact 174035-column support (delete exactly the 16016 degree-6
      columns in null_support \\ sem_support), via chunked block-m4ri.
    report_metric: deficit_genuine
    formula: rank(null|sem_support) - 138573
    expected_interval: [1931, 17947]
  support_restriction:
    null_ncols_full: 190051
    sem_ncols: 174035
    deleted_deg6_columns: 16016
    rule: >-
      Restrict null columns to exactly the sem column set before ranking so
      comparison is support-aligned. sr_pred=156520 is support-independent and
      must not be applied as if null were support-matched. A ncols-only gate
      is insufficient: the deleted set must be exactly null_support \\ sem_support.
    anchors:
      rank_sem: 138573
      sr_pred: 156520
      rank_null_full: 156520
      raw_deficit_vs_sr_pred_quarantined: 17947
      column_deletion_lower_bound_genuine: 1931
    identity_pins:
      ctrl_a_probe_path: >-
        experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N12-D6/rt-control/support_confound_probe.json
      sem_system_hash: c47d17c3fd70d5d81127e8d37e21441883f720ca10187f57a3aeb47bfe3ba818
      null_system_hash: f2f610730a7155933be2afe2d979c8535e1f35f5c0c5ddb246fabe717b147344
      restricted_ncols: 174035
      deleted_ncols: 16016
      deleted_degree_histogram:
        "6": 16016
      set_hash_algorithm_id: sha256_sorted_monomial_canonical_v1
      set_hash_procedure: >-
        Rebuild sem/null from (n=12,t=3,ti=0,seed=2026) exactly as
        support_confound_probe.py (build_system → boolean_null → macaulay_rows).
        Abort unless monosets_hash(sem)==sem_system_hash and
        monosets_hash(null)==null_system_hash. Let sem_cols /
        null_cols be the colidx key sets. Let deleted = null_cols \\ sem_cols.
        Canonical monomial line: comma-joined sorted variable indices
        (empty monomial → empty string). Sort monomials by
        (mono_deg(m), tuple(sorted(m))). Then
        restricted_support_hash = SHA-256(utf-8 newlines of canonical sem_cols
        lines).hexdigest(); deleted_set_hash = same over deleted. CTRL-A probe
        does not store set digests; these digests are uniquely determined by the
        pinned system hashes + this algorithm (regenerate-and-match path).
      note: >-
        Executor receipt MUST publish restricted_support_hash and
        deleted_set_hash. Independent checker recomputes both from the
        algorithm against the hash-matched rebuild; admission fails on mismatch
        or if deleted_set != null_cols \\ sem_cols.
  instrument:
    path: src/h012c_block_m4ri.py
    mode: chunked_block_m4ri
    forbid:
      - unchunked DREG_dff.sage at D6  # host-unsafe (RAM/swap)
    reuse:
      - null adjacency pickle under d6-null/work/
      - CTRL-A colidx maps selecting the exact 16016 columns in null\\sem
  budgets:
    wall_clock_seconds_estimate: 2100
    peak_rss_gb_estimate: 7
    disk_safety:
      TMPDIR: /Volumes/Volume/sage-scratch-dreg
      SAGE_TMP: /Volumes/Volume/sage-scratch-dreg
      note: Keep scratch off full root volume; ENOSPC/OOM => failed_infrastructure, never evidence.
    write_root: rt-control-b/  # later executor task write_scope only
  quarantine:
    raw_headline_status: quarantined_confounded
    raw_headline_value: 17947
    checker_id: CTRL-B-Q-MACHINE-v1
    pinned_d5_support_matched_series:
      source_decision: DEC-GOAL-DREG-001-B002
      cells:
        - n: 12
          D: 5
          deficit: 1322
          shared_ncols: 55455
          sem_run_id: RUN-DREG-001-VALIDATE-N12-A
          null_run_id: RUN-DREG-001-VALIDATE-NULL-N12-D5-B
        - n: 15
          D: 5
          deficit: 1862
          sem_run_id: RUN-DREG-001-VALIDATE-N15-A
          null_run_id: RUN-DREG-001-VALIDATE-NULL-N15-D5-A
        - n: 18
          D: 5
          deficit: 1999
          sem_run_id: RUN-DREG-001-VALIDATE-N18-A
          null_run_id: RUN-DREG-001-VALIDATE-N18-NULL
    predicates:
      - id: Q1
        rule: never_cite_17947_as_structural_syzygy_signal
        machine_check:
          type: closed_boolean
          checker_id: CTRL-B-Q-MACHINE-v1
          applies_to: any_EV_DEC_or_goal_decision_citing_D6
          pass_iff_all:
            - >-
              NOT exists field path ending in structural_metric_id with value in
              {deficit_vs_sr_pred, raw_deficit} AND sibling/value field
              structural_metric_value == 17947
            - >-
              NOT (structural_d6_number == 17947 AND structural_metric_id !=
              deficit_genuine)
          allowlist_17947_mentions_only_when:
            - field_path_suffix_in:
                - raw_headline_status
                - quarantine_note
                - raw_deficit_vs_sr_pred_quarantined
                - expected_interval
                - quarantined_confounded
                - raw_headline_value
            - OR: raw_headline_status == quarantined_confounded
      - id: Q2
        rule: raw_headline_labeled_quarantined_confounded
        machine_check:
          type: closed_boolean
          checker_id: CTRL-B-Q-MACHINE-v1
          applies_to: any_EV_DEC_or_goal_decision_citing_D6
          pass_iff: >-
            every such record has field raw_headline_status ==
            quarantined_confounded
      - id: Q3
        rule: before_ctrl_b_admission_only_lower_bound_or_pinned_d5_structural
        machine_check:
          type: closed_boolean
          checker_id: CTRL-B-Q-MACHINE-v1
          mode_field: ctrl_b_admission_status
          when: ctrl_b_admission_status != admitted
          pass_iff: >-
            every structural citation S in the record satisfies exactly one of:
            (A) S.structural_metric_id ==
            genuine_support_independent_deficit_lower_bound AND
            S.lower_bound_only == true AND
            S.structural_metric_value >= 1931 AND
            S.structural_metric_value != 17947;
            (B) S.structural_metric_id == d5_support_matched_deficit AND
            (S.n, S.D, S.structural_metric_value, S.sem_run_id, S.null_run_id)
            is an exact member of pinned_d5_support_matched_series.cells.
            Forbidden before admission: structural_metric_id in
            {deficit_vs_sr_pred, raw_deficit, deficit_genuine}; any
            structural_d6_number == 17947; any structural use of 17947 outside
            Q1 allowlist fields.
      - id: Q4
        rule: after_ctrl_b_admission_structural_d6_equals_measured_deficit_genuine
        machine_check:
          type: closed_boolean
          checker_id: CTRL-B-Q-MACHINE-v1
          when: ctrl_b_admission_status == admitted
          pass_iff: >-
            structural_d6_number equals
            admitted_ctrl_b_receipt.metrics.deficit_genuine AND
            structural_metric_id == deficit_genuine AND
            (structural_d6_number != 17947 OR
             (admitted_ctrl_b_receipt.metrics.deficit_genuine == 17947 AND
              structural_metric_id == deficit_genuine)).
            Before admission this predicate is N/A (not evaluated as fail).
  admission_metrics:
    - cell_identity_matches_n12_t3_ti0_seed2026_D6
    - sem_system_hash_equals_ctrl_a_pin
    - null_system_hash_equals_ctrl_a_pin
    - restricted_ncols_equals_174035
    - deleted_ncols_equals_16016
    - deleted_set_equals_null_minus_sem
    - deleted_degree_histogram_equals_6_16016
    - restricted_support_hash_equals_rebuild_digest
    - deleted_set_hash_equals_rebuild_digest
    - full_column_coverage_loop_to_ncols
    - rank_sem_anchor_138573_unchanged
    - deficit_genuine_in_closed_interval_1931_17947
    - certificate_kind_none_pure_rank
    - quarantine_predicates_Q1_Q4_hold
  after_protocol_review_pass_allows_execution_only:
    - schedule_later_executor_task_under_fresh_write_scope
    - does_not_mint_deficit_genuine
    - does_not_change_H-DREG-001_shared_ledger_status
    - is_not_a_d_reg_mathematical_result
    - is_not_a_pin_of_deficit_genuine
  after_ctrl_b_execution_admitted_allows_deficit_genuine_citation:
    requires:
      - admitted_ctrl_b_run_receipt
      - all_admission_metrics_pass_including_support_hashes
    then_allows:
      - exact_deficit_genuine_as_D6_structural_number_from_that_receipt
      - D5_support_matched_series_remains_honest_degree_axis_observable
  always_not_claimed:
    - d_reg(sem) asymptotics beyond this cell
    - sub-rho / crypto-scale conclusions
    - rehabilitation of raw 17947 as structural
    - protocol_PASS_is_not_d_reg_result
    - protocol_PASS_is_not_pin_of_deficit_genuine
    - protocol_PASS_is_not_H-DREG-001_status_change
