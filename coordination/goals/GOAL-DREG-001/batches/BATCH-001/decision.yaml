# Goal-scoped batch decision (isolated branch). NOT an official shared-ledger
# DEC-* record: no DEC-YYYYMMDD id is minted here to avoid colliding with the
# co-driver's shared numbering on main. This is a PROPOSED transition building on
# the co-driver's DEC-20260720-002 (H-DREG-001 inconclusive, trending weakened).
coordinator_decision:
  id: DEC-GOAL-DREG-001-B001            # goal/batch-scoped id (isolated), not a shared DEC-YYYYMMDD
  context: >-
    GOAL-DREG-001 BATCH-001: degree-axis characterization of the boolean Semaev
    m=3 (t=3) system, plus the crypto-scale generic baseline (t=7 n=161). Producer
    results independently reviewed (Validator PASS; Red Team refuted then work
    corrected). Builds directly on DEC-20260720-002, which left the degree axis
    "unmeasured past D=5" and flagged the D6 null as a suspected instrument defect.
  decision: weaken            # scoped: trends toward reject_scoped of the polynomial-solve scenario; NOT yet earned as a full KILL
  target_ids: [H-DREG-001]
  rationale:
    - >-
      The D6-null "miscalibration" that blocked the degree axis is NOT an instrument
      defect: it is the degeneracy D6 = d_reg(9) = 6, where the random semi-regular
      null reaches full rank so the pre-collapse sr_pred necessarily under-shoots.
      The instrument/series is sound (the null tracks sr_pred exactly for all D <
      d_reg at n=6 and n=9). The baseline is well-defined iff D < d_reg(n); since
      d_reg(12)=7, the D6-at-n=12 measurement is VALID with no code repair. This
      discharges the DEC-20260720-002 prerequisite conceptually (a D<d_reg guard is
      a small optional hardening).
    - >-
      The semi-regular (null) d_reg grows LINEARLY, theorem-grade: analytic density
      c* = 0.2374790709146819 (interior max of psi=zB'/B, unique (0,1) root of a
      self-reciprocal octic, coalescing-saddle/Airy asymptotics of B(z)^n). d_reg =
      Theta(n), not O(sqrt n). So H-DREG-001's "bounded d_reg" branch is excluded for
      the null model; the sub-rho / polynomial-solve scenario requires a NON-generic
      departure of the sem arm below this.
    - >-
      No such departure is seen by any admissible measure. Using full-column exact
      rank, the graded pivot-degree Hilbert function, and the q->s collapse (enumerated
      s=1 for both arms), d_reg(sem) > d_reg(null): the null solves exactly at its
      d_reg while the sem quotient is 95 (n=6) / 2034-2040 (n=9) >> 1 there. The Semaev
      cascade syzygies RAISE the solving degree -- the wrong direction for an attack.
      (H-DREG-001's support clause "any cell d_reg(sem) < d_reg(null)" is contradicted;
      its "deficit grows super-linearly" clause also fails -- DEC-20260720-002's
      909/1322/1862/1999 is decelerating.)
    - >-
      The first-fall axis is a non-opening: a low first-fall exists (d_ff=3-4) but the
      relation supply there is only O(1)-O(n) (linear ideal elements < nb), the quotient
      stays exponential until ~d_reg, and usable linear relations only materialize at
      Macaulay degree ~d_reg. A hybrid/last-fall solver still pays ~d_reg -> Grobner
      2^{Theta(n)} >> rho 2^{n/2}. At the real t=7 n=161 config the generic baseline is
      d_reg=150 -> 2^1194 vs rho 2^80.5.
  evidence_refs:
    - research/dreg-linear-law/EV-DREG-DRAFT.yaml     # draft, awaiting official minting
    - research/dreg-linear-law/FINDING_v2.md
    - research/dreg-linear-law/VALIDATION.md
    - research/dreg-linear-law/RED-TEAM.md
    - research/dreg-linear-law/ADJUDICATION_solcount.txt
    - RUN-EXP-SIG-005-h
    - RUN-EXP-SIG-005-k
  limitations:
    - >-
      TOY SCALE (direct linear-algebra at n in {6,9}; series/analytic to n=20000).
      d_reg is the semi-regular proxy; the true sem solving degree is >= this. The
      "relation supply O(n) while quotient exponential" separation rests on two sizes
      plus the closed form, not an asymptotic impossibility proof. t=3/t=7 binary
      Weil-descent is a NEGATIVE CONTROL for the generic prime-field target -- no
      prime-field or crypto-scale positive claim (AGENTS 4-7). No break.
    - >-
      This is a goal-scoped PROPOSAL on the isolated branch; it does NOT change the
      official shared-ledger status of H-DREG-001 (co-driver / merge owns that). It
      SHARPENS DEC-20260720-002 from "inconclusive, degree axis unmeasured" toward a
      scoped KILL, but the decision_target's full-column past-wall measurement +
      gap(n) CIs across the seed ladder (BATCH-002) is not yet committed.
  next_actions:
    - >-
      Run BATCH-002: D6-at-n=12 full-column rank (block-m4ri) + gap(n)=d_reg-d_ff
      ladder at n=12,15,18 (>=3 seeds), Validator + Red Team review, then the
      Coordinator decision that RQ-DREG-001's decision_target requires.
  decided_by: coordinator
  decided_at: "2026-07-20"
