  counterexample_or_mutation:
    id: MUT-J3-THREE-DECK-COMPLEMENT-TABLE
    type: nearby_object_and_method_ceiling_mutation
    status: unverified_successor_candidate
    input_interface: >-
      Exact canonical dyadic subset stability in F_0,F_1,F_2 and public, full,
      occurrence-labelled, reconstructible, target-independent F_3 and F_4.
    construction:
      - Isolate one labelled occurrence in each of F_0,F_1,F_2.
      - Compute W=R-encoding(e_0)-encoding(e_1)-encoding(e_2).
      - Reconstruct all labelled F_3 encodings and key them by generic encoding.
      - For each labelled e_4, compute W-encoding(e_4) and query the F_3 table.
      - On a match, decode all five labelled coefficients modulo N and verify [xhat]P=Q.
    predicted_cost: B^(1+o(1)) interactions and B^(1+o(1)) bits
    falsification_conditions:
      - The exact MPZ interface does not expose group subtraction or stable equality for these reconstructed handles.
      - Complete serialization of the table or handle lineage exceeds the declared ell bound.
      - A matching pair can fail the frozen labelled modulo-N decoder or final verification.
      - The composed complete-transcript success event is not covered by the applicable MPZ inequality.

