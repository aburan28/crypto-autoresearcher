  objections:
    - id: J3-O1-THREE-DECK-MITM
      severity: material_joint_break
      title: The claimed two-full-deck B-squared steering obstruction is not the cheapest generic continuation
      finding: >-
        Removing restriction support from F_3 does make the unchanged fourth
        bisection unavailable, so the literal four-isolation argument stops at
        A2. It does not follow that the residual pair search costs
        Theta(B^2). Under the nearby object's own public, full, labelled, and
        reconstructible assumptions, isolate F_0,F_1,F_2, set
        W=R-sum_{i=0}^2 e_i, store the 2m encodings of F_3 with their labels,
        and for each labelled e_4 compute W-encoding(e_4) and look it up in the
        F_3 table. This is the ordinary two-list complement meet-in-the-middle
        transform, not Cartesian pair enumeration.
      quantitative_effect:
        restriction_calls: 3*log2(2m)
        public_entries_reconstructed: 4m
        group_subtractions: 2m
        lookup_bound: O(m) expected with canonical generic encodings, or O(m*log(m)) with comparison-based lookup
        main_interactions: B^(1+o(1))
        local_or_serialized_table_bits: O(B*log(N))=B^(1+o(1))
        frozen_caps: ell=B^(9/4+o(1)) bits and k=B^(5/4+o(1)) interactions
        cap_comparison: Both candidate costs are asymptotically below the frozen caps.
      collision_and_decoder_note: >-
        An equality match supplies one labelled F_3 occurrence and one labelled
        F_4 occurrence whose encodings sum to W. The frozen modulo-N collision
        and final-verification reasoning would then apply to both labels. This
        observation does not re-review J1; it identifies the missing separator
        in the asserted method ceiling.
      epistemic_status: >-
        Unverified proof mutation, not accepted evidence. A separately frozen
        theorem, complete MPZ interface/accounting check, and independent review
        are required before any scientific use.
      effect_on_j3: >-
        Breaks the handoff's proposed steering boundary that two public decks
        require a B^2 scan. It does not by itself falsify the weaker exact
        four-plus-one theorem.
      refs:
        - path: coordination/goals/GOAL-ECDLP-001/proposals/P1553-MIXED-RADIX-FOUR-DECK-CORRECTION-20260824-ae00db/tasks/TASK-20260824-ae00db/proof-search-map.yaml
          provenance: internal
          relevant_fields:
            - audits.method_ceiling_and_nearby_object_control.method_ceiling
        - path: coordination/goals/GOAL-ECDLP-001/proposals/P1553-MIXED-RADIX-FOUR-DECK-CORRECTION-20260824-ae00db/tasks/TASK-20260824-ae00db/proof-theorem.yaml
          provenance: internal
          relevant_fields:
            - controls_and_confounders.C1
            - scope_boundaries.expressly_open

    - id: J3-O2-ANONYMITY-CONTROL
      severity: control_specification_break
      title: Hiding supplied labels alone does not stop a deck whose known scalar lineage remains reconstructible
      finding: >-
        The frozen control treats anonymous fifth occurrences and
        nonreconstructible fifth handles as though either mutation necessarily
        stops decoding. They differ. If F_4 remains public and reconstructible
        from the declared coefficients sigma(d+1)m^4, the reduction can
        regenerate each encoding while attaching its known (d,sigma) label;
        hiding labels on separately supplied handles does not remove that
        mapping. The decoder stops only when anonymity also removes any usable
        coefficient lineage, or when handles are genuinely nonreconstructible
        or incomparable.
      effect_on_j3: >-
        The anonymous-only object does not exhibit its declared failure
        signature as frozen and therefore is not a discriminating
        proves-too-much control. The genuinely anonymous/no-lineage and opaque
        nonreconstructible variants do stop at A3, with A5/A6 additionally
        absent for uncharged persistent handles.
      required_repair: >-
        Split the object into two explicit variants: anonymous supplied handles
        with public reconstructible lineage, which the proof may survive, and a
        no-lineage or nonreconstructible object, which must stop. Do not count
        the former as a known-false control.
      refs:
        - path: coordination/goals/GOAL-ECDLP-001/proposals/P1553-MIXED-RADIX-FOUR-DECK-CORRECTION-20260824-ae00db/tasks/TASK-20260824-ae00db/proof-theorem.yaml
          provenance: internal
          relevant_fields:
            - mechanism.fifth_deck_scan.reconstruction
            - assumptions.A3
            - controls_and_confounders.C2
            - controls_and_confounders.C3

