  schema: crypto.autoresearch.blind_rederivation.v1
  task_id: TASK-20260824-660a30
  goal_id: GOAL-ECDLP-001
  statement_id: BLIND-P1553-MIXED-RADIX-FOUR-DECK-ae00db
  role: validator
  mode: independent_blind_rederivation
