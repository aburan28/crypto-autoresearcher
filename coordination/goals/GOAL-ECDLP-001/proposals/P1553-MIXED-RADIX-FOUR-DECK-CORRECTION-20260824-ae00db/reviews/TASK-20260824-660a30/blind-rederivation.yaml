  scientific_sources:
    - coordination/goals/GOAL-ECDLP-001/proposals/P1553-MIXED-RADIX-FOUR-DECK-CORRECTION-20260824-ae00db/blind-statement.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/P1553-MIXED-RADIX-FOUR-DECK-CORRECTION-20260824-ae00db/handoffs/TASK-20260824-660a30.yaml
  blind_from_respected: true
  joints_owned: []
  joint_verdicts: []
  whole_claim_verdict: null
  frozen_quantity_outcome: >-
    Conditional on the frozen exact, subset-stable, target-independent predicate
    object and the frozen aggregate resource accounting, four deck bisections
    followed by one complete public fifth-deck scan give a deterministic verified
    extractor for x modulo N.  Its exact predicate-query count is
    4*(ceil(log2(B))+1).  Combining the stated advice and aggregate-interaction
    caps with the supplied theorem bounds success by B^(-1/4+o(1)) =
    N^(-1/20+o(1)), so the exact-object extractor and that resource rectangle
    cannot simultaneously satisfy the supplied theorem for asymptotically large
    N.  This is only the frozen reduction and exponent, not a whole-claim verdict.
  notation:
    s: "ceil(log2(B))"
    m: "2^s"
    deck_cardinality: "2*m labelled occurrences"
    C: "sum(i=0..4, m^i)"
    labelled_scalar: "a(i,d,sigma) = sigma*(d+1)*m^i"
    predicate: >-
      E_R(S0,S1,S2,S3) holds exactly when there are labelled occurrences
      f_i in S_i for i=0..3 and f_4 in F_4 whose five group handles sum to R.
  canonical_witness:
    derivation:
      - "Since 0 <= x < N = B^5 <= m^5, x has five base-m digits d_i with 0 <= d_i < m."
      - "For sigma_i=+1, sum(i=0..4, (d_i+1)*m^i) = x + C as an integer."
      - "Therefore those five labelled occurrences sum in G to Q+[C]P=R."
    conclusion: "E_R(F_0,F_1,F_2,F_3) is true without an initial predicate call."
  four_deck_bisection:
    invariant: >-
      Before every restriction, E_R(S0,S1,S2,S3) is true.  To restrict S_j,
      partition its labelled occurrences into the two disjoint canonical dyadic
      halves L and U and query with L.  If the exact answer is true, keep L.  If
      it is false, the pre-existing witness must use an occurrence in U, so keep
      U.  Exactness preserves the invariant in either branch.
    collision_handling: >-
      The partition and witness are over labelled occurrences, not distinct group
      encodings.  Equal handles in different halves therefore do not invalidate
      the argument: a witness occurrence has a definite label and hence belongs
      to at least one queried half, while exact existential answers remain valid.
    per_deck_depth: "log2(2*m) = s+1"
    decks_restricted: 4
    initial_full_predicate_call: false
    exact_predicate_query_count: "4*(s+1) = 4*(ceil(log2(B))+1)"
    terminal_state: >-
      Each S_0 through S_3 is a singleton labelled occurrence, and the invariant
      still certifies that those four occurrences extend by some occurrence in
      the whole fifth deck F_4.
  public_fifth_deck_scan:
    residual: "T = R - h_0 - h_1 - h_2 - h_3"
    reconstruction: >-
      Construct H_4=[m^4]P and enumerate every labelled fifth-deck handle
      +(d+1)H_4 and -(d+1)H_4 for 0<=d<m, retaining (4,d,sigma) beside each
      handle.
    completeness: >-
      The terminal bisection invariant supplies an f_4 in the full F_4 whose
      handle equals T.  A scan of all 2m labelled occurrences must encounter it.
      When several labels have the same encoding, selecting any matching label
      is sufficient for the modular decoder.
  labelled_decoder:
    formula: "x_hat = (sum(i=0..4, sigma_i*(d_i+1)*m^i) - C) mod N"
    proof:
      - "The matched handles give [sum_i sigma_i*(d_i+1)*m^i]P = R = [x+C]P."
      - "Hence [x_hat]P=Q."
      - "Because G has prime order N and P generates G, scalar equality at P is equality modulo N, so x_hat=x mod N."
    final_verification: "Compute [x_hat]P independently and accept only if its handle equals Q."
    modular_and_sign_collisions: >-
      Every selected occurrence keeps its own (i,d,sigma) label.  If two signed
      labels collide as group handles, their labelled scalars are congruent
      modulo N.  Replacing one by another matching label therefore changes the
      decoded integer sum only by a multiple of N; reduction modulo N and the
      final group verification remain correct.  No uniqueness of the signed
      representation is used.
  interaction_accounting:
    conventions:
      - "Let L=ceil(log2(N))."
      - "Charge every exact-predicate interface call, generic-group addition, subtraction, negation, and even every encoding comparison as a main interaction for a conservative public-work bound."
      - "The frozen B^(5/4+o(1)) cap is aggregate: any internal interactions used by the exact object across all predicate calls must also be included."
    logical_predicate_calls: "q=4*(s+1)"
    public_work_upper_bound:
      power_handles: "4*s doublings construct H_i=[m^i]P for i=1..4 from H_0=P"
      target_construction: "5 additions construct [C]P=sum(i=0..4,H_i) and R=Q+[C]P when R is not already supplied as a handle"
      isolated_handle_reconstruction: "at most 8*(s+1)+4 interactions for four coefficient multiplications and four possible sign negations"
      residual: "4 subtractions"
      fifth_deck_reconstruction: "2*m-1 interactions: m-1 positive additions, one negation, and m-1 negative additions"
      fifth_deck_scan: "2*m charged comparisons"
      decoding: "ordinary labelled-integer arithmetic; zero generic-group interactions"
      final_verification: "at most 2*L generic-group operations plus one charged comparison"
      conservative_total_including_predicate_calls: "at most 4*m + 16*s + 2*L + 25"
    asymptotic_public_work: >-
      Since B <= m < 2B and s,L=O(log N), the displayed public work is
      B^(1+o(1)), strictly inside B^(5/4+o(1)).  If a predicate call consumes
      more than one underlying interaction, its actual internal cost replaces
      the unit logical-call charge and remains governed by the frozen aggregate
      cap; it is not silently omitted.
    aggregate_main_cap_used_for_theorem: "k <= B^(5/4+o(1))"
  success_exponents:
    advice_words: "W <= B^(9/4+o(1)) ordinary O(log N)-bit words"
    advice_bits: "ell <= W*O(log N) = B^(9/4+o(1))"
    aggregate_interactions: "k <= B^(5/4+o(1))"
    supplied_bound_substitution: >-
      3*ell*(k+1)^2/N <=
      3*B^(9/4+o(1))*B^(5/2+o(1))/B^5 =
      3*B^(-1/4+o(1)) = 3*N^(-1/20+o(1)).
    B_success_exponent: "-1/4"
    N_success_exponent: "-1/20"
    extractor_success_under_exact_premises: "1 for every fresh Q=[x]P"
    scoped_consequence: >-
      For sufficiently large N the supplied upper bound tends to zero and is
      below one, whereas the derived exact-predicate extractor succeeds for
      every x.  Thus at least one of exactness, target independence, the stated
      advice/main resource bounds, or applicability of the supplied theorem
      must fail.  No broader P1553 or coordinate-aware conclusion is drawn.
  nonapplicability_boundaries:
    - case: only_three_restrictable_decks
      boundary: >-
        With two full decks and a required Cartesian scan, the remaining
        labelled search has (2m)^2=4m^2=B^(2+o(1)) pairs, outside the
        B^(5/4+o(1)) main cap.  The one-deck scan derivation does not transfer.
    - case: hidden_or_anonymous_fifth_deck_occurrences
      boundary: >-
        A matching handle without its (d,sigma) label does not supply the scalar
        needed by the decoder; completeness of handle search alone is insufficient.
    - case: target_conditioned_advice
      boundary: >-
        Advice depending on Q or x violates the target-independent premise and
        is outside the stated theorem substitution.
    - case: nonreconstructible_opaque_fifth_deck_handles
      boundary: >-
        If the fifth-deck encodings cannot be publicly generated from P and their
        labels, the complete scan used here is unavailable.
    - case: marginal_per_query_success
      boundary: >-
        Adaptive bisection needs exact, transcript-consistent existential answers.
        Marginal correctness of individual answers does not preserve the invariant.
    - case: coordinate_aware_oracle
      boundary: >-
        P1553 coordinates, Semaev polynomials, resultants, and field arithmetic
        expose structure absent from the frozen prime-order generic-group model;
        neither the supplied theorem nor this generic reduction automatically applies.
    - case: resource_or_interface_drift
      boundary: >-
        The conclusion does not apply if word size is superlogarithmic, internal
        object work is omitted from k, restrictions are not exact labelled-set
        predicates, F_4 is not kept whole, or the group/order/fresh-target premises
        differ from the frozen statement.
  limitations:
    - "No producer artifact was read, so this record does not assert agreement or disagreement with any producer implementation or report."
    - "No J1-J3 joint was assigned or decided, and no whole-claim, state-transition, closure, B71-admission, or breakthrough verdict is issued."
    - "No experiment, implementation, empirical observation, external citation, or coordinate-aware computation was used."
