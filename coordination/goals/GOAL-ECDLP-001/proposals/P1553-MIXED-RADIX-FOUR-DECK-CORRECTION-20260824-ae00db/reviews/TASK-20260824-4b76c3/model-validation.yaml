  joint:
    id: J2-MPZ-binding-and-complete-four-plus-one-resource-accounting
    verdict: holds
    whole_claim_verdict: null
    conclusion: >-
      The frozen four-plus-one construction can be compiled into the cited MPZ
      preprocessing extraction game without changing the declared exponents,
      provided every predicate evaluation is inlined into one S.main transcript,
      the only cross-phase solver state is an ordinary bit string, and no opaque
      handle or extra oracle survives register clearing. Retaining public deck
      representations costs B^(1+o(1)) advice bits; reconstructing all five
      decks and scanning the fifth costs B^(1+o(1)) main interactions. Both are
      strictly below the declared ell=B^(9/4+o(1)) and k=B^(5/4+o(1)) scales.

