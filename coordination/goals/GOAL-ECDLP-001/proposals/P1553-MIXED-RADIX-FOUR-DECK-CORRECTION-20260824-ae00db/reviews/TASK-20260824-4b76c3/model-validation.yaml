  control_checks:
    - control: retained_fifth_deck
      status: pass
      result: >-
        Serializing 2m labels and dense representations requires
        O(m*log(N))=B^(1+o(1)) bits, strictly below ell's 9/4 exponent.
    - control: reconstructed_fifth_deck
      status: pass
      result: >-
        Reconstructing 2m signed public scalar multiples, exposing each with
        dense, and scanning all entries requires O(m*log(N))=B^(1+o(1))
        allowed interactions, strictly below k's 5/4 exponent.
    - control: opaque_persistent_handles
      status: stops_as_required
      result: >-
        Unserialized handles cannot survive MPZ register clearing. If the
        object needs them and cannot reconstruct them, the source binding fails
        rather than receiving a free resource.
    - control: marginal_success_only
      status: stops_as_required
      result: >-
        The MPZ reduction is applied to one complete transcript. Independent or
        constant marginal predicate accuracy does not establish nonvanishing
        success of that transcript.
    - control: extra_predicate_or_coordinate_oracle
      status: stops_as_required
      result: >-
        An external predicate oracle, coordinate interface, or target-local
        random oracle is not in {+,1,dense,ro}; the validated mapping stops.

