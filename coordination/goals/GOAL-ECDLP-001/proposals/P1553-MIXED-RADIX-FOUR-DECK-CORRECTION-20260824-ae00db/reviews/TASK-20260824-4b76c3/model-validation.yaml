  mpz_model_binding_checks:
    - check: setup_target_separation
      status: pass
      detail: >-
        The frozen setup and all decks are target-independent; Q=[x]P enters
        only after the MPZ clear. Target-conditioned preprocessing is outside
        the validated statement.
    - check: clearing_and_handle_lifecycle
      status: pass_conditional
      detail: >-
        MPZ clears every game register before S.main. Thus a generic register
        index cannot survive as an opaque handle. The statement explicitly
        requires ordinary-bit serialization or reconstruction from public
        scalar lineage; either allowed alternative is fully charged below.
    - check: one_main_transcript
      status: pass_conditional
      detail: >-
        All four adaptive bisection paths, predicate work, fifth scan, replay,
        decoding, and verification must be one S.main random system with at
        most k total allowed interactions. A predicate call is an inlined
        subroutine, not an additional oracle and not a fresh MPZ game.
    - check: dense_equality
      status: pass
      detail: >-
        dense returns the injective value pi(v) in Z_N. One dense query per
        reconstructed occurrence permits exact local equality against dense(W).
        Counting each local comparison again as an interaction is conservative.
    - check: shared_random_oracle
      status: pass
      detail: >-
        The exact ro(v)=RO(pi(v)) interface is covered by Corollary 3, and every
        ro query in every phase of the online transcript remains inside k.
        No different or target-local oracle is covered.
    - check: average_case_quantifier
      status: pass
      detail: >-
        The reduction samples uniform x and the MPZ dense representation.
        A universal solver that has complete-transcript success bounded away
        from zero on every frozen instance also has nonvanishing average success,
        which the vanishing MPZ upper bound contradicts.

