      - Theorem 3
      - Corollary 3
      - Appendix F.6
    findings:
      - >-
        Section 5.1 defines ell as |z|, the bit length of the sole advice
        string passed from S.pre to the independent S.main after all game
        registers are cleared.
      - >-
        Definitions 5-7 count one shared total of computation operations and
        function queries; Theorem 3 specializes the main phase to at most k
        interactions from {+,1,dense} with unlimited preprocessing and registers.
      - >-
        Definition 12 and Corollary 3 add ro(v)=RO(pi(v)) while retaining dense;
        Appendix F.6 replaces each ro call by one dense call plus a fixed local
        function and states that the query count is unchanged.
      - >-
        Theorem 3 and Corollary 3 state the average-case extraction bound
        3*ell*(k+1)^2/N for prime N. The distribution is uniform in the dense
        representation parameter and extracted value.

