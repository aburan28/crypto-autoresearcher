    rationale: >-
      Under the frozen J1 premises of exact adaptive existential answers in
      four named decks and a public full occurrence-labelled reconstructible
      fifth deck, every exact path preserves a witness, performs exactly
      4*log2(2m) predicate calls, finds a fifth label within exactly 2m full-scan
      comparisons, and decodes a candidate that verifies modulo N. The stated
      collision classes do not alter the decoded residue.
    limitations:
      - This verdict is conditional on the exact, label-preserving, reconstructible interface stated in the frozen theorem.
      - It does not validate the MPZ source, complete interaction accounting, success exponent, three-deck ceiling, or any transfer beyond this joint.
      - The two non-blocking wording clarifications above remain for any later formal restatement.

