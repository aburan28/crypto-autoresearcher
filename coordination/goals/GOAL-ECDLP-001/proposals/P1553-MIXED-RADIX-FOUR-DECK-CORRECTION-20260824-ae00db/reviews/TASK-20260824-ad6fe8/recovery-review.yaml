  independent_rederivation:
    initial_witness:
      derivation: >-
        For a target x modulo N choose its least residue r in [0,N-1]. Since
        m=2^ceil(log2(N^(1/5))) gives m^5>=N, r has five base-m digits
        a_i in [0,m-1]. The positive labelled occurrences
        e_i=(i,a_i,+1,[(a_i+1)m^i]P) are all present, and their encodings sum
        to [r+C]P=[x+C]P=R. Thus the initial restricted-set invariant is
        nonempty without an initial predicate query.
      result: holds

    four_deck_isolation:
      invariant: >-
        The current subsets S_0,S_1,S_2,S_3 together with full F_4 contain a
        five-tuple summing to R.
      induction_step: >-
        Split the active block S_i=L disjoint_union U. If the exact predicate
        on L is true, its witness establishes the invariant for L. If it is
        false, every incoming witness must use an occurrence in U, because an
        incoming witness using L would make the exact existential predicate
        true. Retaining L on true and U on false therefore preserves at least
        one witness with one predicate call per level.
      ordering_requirement: >-
        Any fixed public total order of the 2m occurrence labels suffices; the
        proof is independent of whether signs or digits are ordered first.
        The frozen text calls this order canonical but does not spell out the
        tie convention, a presentation detail that should be fixed in any
        later formal statement.
      result: holds

    exact_census:
      m_power_of_two: true
      occurrences_per_deck: 2m
      levels_per_restricted_deck: log2(2m)=1+ceil(log2(B))
      restricted_decks: 4
      exact_predicate_calls: 4*log2(2m)=4*(1+ceil(log2(B)))
      full_fifth_deck_occurrence_visits: 2m
      full_fifth_deck_equality_tests: 2m
      early_stopping_scan_if_allowed: between_1_and_2m_equality_tests
      asymptotic_occurrence_scan: >-
        B<=m<2B, so 2B<=2m<4B and the full scan has Theta(B)
        occurrence visits. Reconstructing each declared public entry with at
        most a polylogarithmic generic-operation cost remains B^(1+o(1)); the
        completeness of the aggregate interaction charge is outside J1.

    residual_and_labelled_decoder:
      construction: W=R-sum_i_0_to_3 encoding(e_i)
      match_existence: >-
        At the four-singleton endpoint the invariant supplies an occurrence
        e_4 in full F_4 with encoding(e_4)=W. Scanning all 2m public labelled
        occurrences therefore finds at least one match on every exact path.
      formula: xhat=(sum_i_0_to_4 sigma_i*(d_i+1)*m^i-C) mod N
      correctness: >-
        A selected matching F_4 label names a scalar c_4 whose encoding is W.
        Hence the five selected encodings sum to R=Q+[C]P, so
        [xhat]P=Q. Because P generates a prime-order group, the explicit final
        equality check accepts only xhat=x modulo N.
      result: holds

    collision_analysis:
      same_deck_multiple_matches: >-
        If two F_4 labels with coefficients c_4 and c_4' both match W, then
        [(c_4-c_4')]P=0 and therefore c_4=c_4' modulo N. Substituting either
        label changes xhat by zero modulo N. Multiplicity cannot create a
        wrong accepted candidate.
      sign_collisions: >-
        The sign is part of each occurrence label and therefore part of the
        decoded coefficient. A positive and negative label that share an
        encoding are covered by the same congruence argument.
      cross_deck_collisions: >-
        Deck identity is part of the label. The fifth scan selects only labels
        from F_4, while the four isolated labels retain their own deck indices;
        equality with an encoding in another deck cannot relabel a coefficient.
      result: holds

    identity_and_scalar_size:
      identity_avoidance: >-
        For sufficiently large prime N, m<N, 1<=d+1<=m<N, and N does not
        divide m. Thus no declared deck occurrence has zero coefficient modulo
        N. R itself may be the identity without harming the invariant. On an
        exact successful path W cannot be the identity because it must equal an
        F_4 occurrence; on a corrupted witness-free path an identity W simply
        produces no fifth-deck match.
      overflow_bound: >-
        Since m<2*N^(1/5), m^5<32N. For m>=2, the absolute pre-reduction
        decoder integer is less than 3m^5<96N, so only O(log N) exact bits are
        required. The theorem is mathematical and uses exact ordinary-bit
        serialization; fixed-width wraparound is neither needed nor permitted.
      result: holds

    corrupted_branch_behavior:
      witness_losing_case: >-
        If a corrupted predicate answer selects a complement with no witness,
        then after isolation no F_4 encoding can equal W; otherwise that match
        itself would be a witness. The scan stops without a candidate.
      witness_preserving_case: >-
        A corrupted answer can accidentally retain a different witness. In
        that case the scan and decoder may still return a genuinely correct
        discrete logarithm. This is not a false acceptance, but it is a third
        branch omitted by the shorthand no-match-or-reject wording.
      false_match_or_arithmetic_corruption_case: >-
        If an incorrect scan equality or corrupted arithmetic produces a
        nonmatching label, the mandatory [xhat]P=Q check rejects it.
      result: holds_with_control_wording_clarification

  findings:
    blocking: []
    non_blocking:
      - id: J1-NB-01
        finding: >-
          The word canonical does not define a concrete total order on the
          public occurrence labels. Any fixed order makes the proof and exact
          count work, so this is a formalization clarification rather than a
          semantic break.
      - id: J1-NB-02
        finding: >-
          The corrupted-answer control should state three outcomes: loss of all
          witnesses gives no match; an accidentally preserved witness gives a
          correct verified result; a separately corrupted candidate is rejected
          by final verification. The narrower shorthand does not invalidate the
          exact-transcript recovery implication.

  joint_verdict:
