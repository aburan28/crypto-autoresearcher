  id: P1553-MIXED-RADIX-FOUR-DECK-CORRECTION-20260824-ae00db
  goal_id: GOAL-ECDLP-001
  batch_id: null
  recorded_at: "2026-08-24T23:41:40Z"
  opened_by: coordinator
  classification: non_batch_proof_correction
  objective: >-
    Independently verify or falsify the concrete strengthening of the reviewed
    mixed-radix reduction from five restrictable decks to four restrictable
    decks plus one public full-deck scan, without changing P1553, B70, B71, or
    any scientific status.
  correction_target:
    evidence: EV-ECDLP-e60f3a
    decision: DEC-20260824-8ab7e3
    issue: >-
      The accepted correction left one non-restrictable deck as an open escape.
      A direct four-deck isolation followed by an exact public scan of the fifth
      mixed-radix deck appears to remove that escape within the inherited
      aggregate interaction cap.
    immutable_history: true
    repair_mode: additive_evidence_and_decision_only
  proposed_theorem:
    group: prime_order_dense_generic_group_G_equal_angle_P_angle_of_order_N
    scale: B_equals_N_to_the_one_fifth
    radix: m_equals_2_to_the_ceiling_log2_B
    offset: C_equals_sum_i_0_to_4_m_to_i
    decks: >-
      For i=0,...,4, F_i contains independently occurrence-labelled signed
      elements (i,d,sigma,[sigma(d+1)m^i]P), 0<=d<m and sigma in {+1,-1}.
    target: R_equals_Q_plus_bracket_C_bracket_P
    restricted_interface: >-
      One target-independent object answers the exact existential predicate for
      every canonical dyadic restriction of F_0,...,F_3 while F_4 remains whole.
    recovery: >-
      Isolate labels in F_0,...,F_3 using exactly 4 log2(2m) predicate calls.
      Compute W=R-sum_i_0_to_3 e_i and reconstruct or read every public labelled
      F_4 occurrence; scan for a point encoding equal to W. Any matching labelled
      occurrence completes a verified tuple and decodes x modulo N.
    proposed_conclusion: >-
      Under the exact MPZ model, complete ordinary-bit advice serialization,
      target-independent preprocessing, one hard aggregate cap on every main
      interaction, and nonvanishing success for the complete adaptive transcript,
      no universal arbitrary-deck generic solver with four-deck subset stability
      can simultaneously use at most B^(9/4+o(1)) crossing state and
      B^(5/4+o(1)) total online/replay interactions.
  resource_accounting:
    advice_bits: ell_equals_B_to_9_over_4_plus_o_1
    restriction_calls: 4_times_log2_2m
    fifth_reconstruction_and_scan: B_to_1_plus_o_1
    total_main_interactions: k_equals_B_to_5_over_4_plus_o_1
    mpz_success: B_to_minus_1_over_4_plus_o_1_equals_N_to_minus_1_over_20_plus_o_1
  mandatory_assumptions:
    - universal arbitrary public signed occurrence-labelled decks of the declared size
    - exact canonical dyadic subset stability in the same four named decks
    - the fifth deck remains public, full, labelled, and reconstructible from target-independent known scalar lineage
    - complete transcript success, not marginal per-query success
    - all phase-crossing data charged by serialized bit length
    - all target construction, restrictions, handle reconstruction, fifth scan, decoding, and verification included in one hard MPZ main-interaction cap
    - no persistent opaque handles, target-conditioned advice, extra oracle, or representation leakage outside the cited MPZ model
  controls:
    - remove restriction support from a second deck and require the proof to stop because a two-deck scan costs Theta(B^2)
    - hide fifth-deck occurrence labels and require labelled decoding to stop
    - make fifth-deck handles opaque and nonreconstructible after preprocessing and require accounting to stop
    - replace complete-transcript success by independent marginal correctness and require the reduction to stop
    - allow target-conditioned advice or unbounded words and require MPZ applicability to stop
    - apply the proof to a coordinate-aware P1553 remainder or Semaev oracle and require nonapplicability
    - include modular, sign, and cross-deck collisions and verify any matching fifth occurrence decodes modulo N
    - force no matching fifth occurrence after an intentionally corrupted restriction answer and require final verification to reject
  scientific_custody:
