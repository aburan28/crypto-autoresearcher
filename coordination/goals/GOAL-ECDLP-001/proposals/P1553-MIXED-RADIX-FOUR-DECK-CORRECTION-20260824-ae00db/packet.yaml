  claim_ceiling: >-
    At most an independently reviewed additive generic-model correction for one
    universal arbitrary-deck interface with exactly four subset-stable decks and
    one public scanned deck. It is not a P1553-specific or coordinate-aware lower
    bound, not a generic ECDLP lower bound, not B71, not SOTA movement, not an
    algorithm, attack, speedup, closure, or breakthrough.
