  claim_ceiling: >-
    A conditional, additive generic-interface correction for exactly four
    exact subset-stable arbitrary signed occurrence-labelled decks and one
    public, full, labelled, reconstructible fifth-deck scan. It is not a
    P1553 result, a coordinate-model result, a generic-ECDLP lower bound, a
    B71 batch, a state transition, a SOTA claim, an algorithmic speedup, an
    attack, a closure result, or a breakthrough.
  
  theorem:
    title: Four exact subset-stable decks plus one public fifth-deck scan
    kind: conditional_generic_interface_correction
    statement: >-
      Let G=<P> have prime order N, put B=N^(1/5),
      m=2^ceil(log2(B)), and C=sum_{i=0}^4 m^i.  For each i in
      {0,1,2,3,4}, let F_i contain the 2m independently labelled signed
      occurrences (i,d,sigma,[sigma(d+1)m^i]P), where 0<=d<m and
      sigma is +1 or -1.  Given Q=[x]P, set R=Q+[C]P.  Suppose one
      target-independent, fully serialized object answers the exact
      existential five-sum predicate for every adaptive canonical dyadic
      restriction of F_0,F_1,F_2,F_3 while F_4 remains whole, with total
      cross-phase advice length ell=B^(9/4+o(1)) bits and one aggregate hard
      main-phase interaction count k=B^(5/4+o(1)).  The count k includes all
      restriction, target, reconstruction, handle, equality, scan, decoding,
      verification, and replay interactions, and the success event is success
      of the complete adaptive transcript.  If F_4 is public, full, labelled,
      reconstructible, and target-independent, then four labels can be
      isolated in exactly 4*log2(2m) predicate calls, after which an exhaustive
      labelled scan of F_4 costs B^(1+o(1)) interactions and recovers a
      verifiable discrete logarithm whenever the complete transcript succeeds.
      Under the Maurer-Portmann-Zhu generic-model interface used by the
      predecessor evidence, the resulting success probability is at most
      3*ell*(k+1)^2/N=B^(-1/4+o(1))=N^(-1/20+o(1)).  Consequently an object
      satisfying all stated interface and resource assumptions cannot yield a
      nonvanishing-success exact solver through this reduction.
    logical_form:
      setup_quantifiers: >-
        For every sufficiently large prime N, every prime-order generic group
        G=<P>, and the five public arbitrary signed occurrence-labelled decks
        defined above, the setup/advice is fixed and serialized without Q.
      target_quantifiers: >-
        For every target Q and every adaptive path consisting only of canonical
        dyadic restrictions in the same four named decks F_0 through F_3, every
        predicate answer equals the truth of existence of a five-tuple whose
        encoded group elements sum to R; F_4 is never restricted.
      probability_quantifiers: >-
        Probability is over a uniform target x modulo N and all allowed setup
        and online randomness, and the counted success event is one complete,
        mutually consistent transcript ending in a candidate that passes
        [xhat]P=Q.  No claim is made from marginal per-query success.
      conclusion: >-
        Every successful complete transcript induces the explicit decoder
        below, so the MPZ success bound applies after all advice and interactions
        have been charged.
  
  mechanism:
    baseline:
      B: N^(1/5)
      m: 2^ceil(log2(B))
      C: sum_{i=0}^4 m^i
      decks: >-
        F_i={(i,d,sigma,[sigma(d+1)m^i]P): 0<=d<m,
        sigma in {-1,+1}}, with an independent occurrence label retained even
        when two encodings coincide.
      target: R=Q+[C]P
    exact_predicate: >-
      For current subsets S_i subseteq F_i in i=0,1,2,3, return true exactly
      when there exist e_i in S_i and e_4 in F_4 whose five encoded group
      elements sum to R.
    isolation:
      invariant: >-
        Before and after every restriction step, the current four restricted
        sets together with full F_4 contain at least one witness for R.
      step: >-
        Split the current canonical dyadic block in deck i into equal canonical
        halves L and U. Query the predicate with L. If true retain L; if false
        retain U. Exactness plus the incoming witness invariant proves that the
        retained half contains a witness, so the complement requires no second
        query.
      count: >-
        Each F_i has 2m occurrences and 2m is a power of two. Therefore exactly
        log2(2m) bisections isolate one labelled occurrence in a deck, and the
        four named decks require exactly 4*log2(2m) predicate calls.
      isolated_elements: >-
        Write the isolated occurrences as e_i=(i,d_i,sigma_i,
        [sigma_i(d_i+1)m^i]P), i=0,1,2,3.
    fifth_deck_scan:
      residual: W=R-sum_{i=0}^3 encoding(e_i)
      reconstruction: >-
        Reconstruct or read all 2m public labelled occurrences of the unchanged
        target-independent deck F_4. This creates no target-conditioned setup
        state and exposes both each occurrence label and its generic encoding.
      scan: >-
        Compare W with every reconstructed F_4 encoding. The witness invariant
        guarantees at least one match on a successful exact transcript. Select
        any matching labelled occurrence e_4=(4,d_4,sigma_4,
        [sigma_4(d_4+1)m^4]P).
      collision_handling: >-
        A modular, sign, or cross-deck collision can provide several labelled
        occurrences with the same generic encoding. Any selected matching
        occurrence has exactly the group element W. Its own label supplies its
        coefficient, and the decoder is modulo N, so every matching occurrence
        yields the same required group equality even if integer coefficients
        differ by a multiple of N.
    decoder:
      formula: >-
        xhat=(sum_{i=0}^4 sigma_i(d_i+1)m^i-C) mod N
      correctness: >-
        The isolated four encodings plus the scanned fifth encoding sum to
        R=Q+[C]P. Subtracting [C]P gives [xhat]P=Q. The reduction returns xhat
        only after explicitly checking this equality.
      corruption_behavior: >-
        A false restriction answer can destroy the witness invariant. Then the
        fifth scan has no match, or a resulting candidate fails [xhat]P=Q; it
        never becomes a silently accepted success.
  
  resource_accounting:
    advice_bits:
      symbol: ell
      bound: B^(9/4+o(1))
      inclusions: >-
        Every bit crossing setup, target, replay, or phase boundaries, including
        serialized tables, indices, labels, handles, randomness needed for
        replay, and auxiliary state.
    restriction_calls:
      exact: 4*log2(2m)
      asymptotic: B^(o(1))
    fifth_reconstruction_and_scan:
      occurrences: 2m
      asymptotic_interactions: B^(1+o(1))
    remaining_interactions: >-
      Target admission, all predicate work, restrictions, equality tests,
      handles, decoding, final verification, replay, and every other online
      interaction are aggregated rather than charged per query or in expectation.
    aggregate_interactions:
      symbol: k
      bound: B^(5/4+o(1))
      domination_check: >-
        B^(1+o(1)) fifth-deck reconstruction and scan plus logarithmic
        restriction paths are strictly below the allowed B^(5/4+o(1)) hard cap.
    mpz_substitution:
      bound: 3*ell*(k+1)^2/N
      exponent_calculation: 9/4+2*(5/4)-5=-1/4
      result: B^(-1/4+o(1))=N^(-1/20+o(1))
      interpretation: >-
        The bound vanishes for the complete reduction transcript. It contradicts
        only a claimed nonvanishing-success exact solver satisfying this exact
        generic interface and complete accounting.
    time_memory_profile:
      setup_memory_bits: B^(9/4+o(1))
      online_interactions: B^(5/4+o(1))
      public_scan_interactions: B^(1+o(1))
      hidden_factors: >-
        The o(1) terms may hide polylogarithmic serialization, indexing, and
        replay costs; no unbounded word or opaque unit-cost handle is allowed.
  
  assumptions:
    - id: A1
      text: The construction is accepted by an interface universal over arbitrary signed occurrence-labelled decks.
    - id: A2
      text: Exact canonical dyadic subset stability holds adaptively in the same four named decks F_0 through F_3.
    - id: A3
      text: F_4 remains public, full, labelled, reconstructible, and target-independent.
    - id: A4
      text: Success means a single complete consistent transcript, not constant or independent marginal success for individual queries.
    - id: A5
      text: All cross-phase state is serialized into ell bits and all online, replay, scan, handle, decoding, and verification work is charged to one hard k bound.
    - id: A6
      text: The representation supplies no coordinates, target-conditioned advice, extra oracle, representation leakage, or persistent opaque handles outside the MPZ interface.
  
  predictions:
    - id: P1
      prediction: Exactness preserves the witness invariant through precisely four logarithmic restriction paths.
      falsification: Exhibit an exact predicate transcript beginning with a witness in which the stated retain-left-else-right rule loses every witness.
    - id: P2
      prediction: The residual W matches at least one public labelled F_4 occurrence on every successful transcript.
      falsification: Exhibit a successful exact transcript whose isolated four occurrences leave W outside the encoded multiset F_4.
    - id: P3
      prediction: Any labelled F_4 occurrence matching W yields an xhat that verifies modulo N despite encoding collisions.
      falsification: Exhibit a matching labelled occurrence for which the stated modulo-N decoder fails [xhat]P=Q.
    - id: P4
      prediction: Charging the B^(1+o(1)) fifth scan does not exceed k=B^(5/4+o(1)).
      falsification: Show a required target-dependent or persistent resource omitted from ell or k, or show that reconstructing the declared public deck intrinsically exceeds its explicit 2m occurrences.
    - id: P5
      prediction: With the stated complete accounting the MPZ substitution has exponent -1/4 in B.
      falsification: Retrieve a different applicable bound, invalidate its interface mapping, or identify a missing resource term that changes ell or k.
  
  controls_and_confounders:
    - id: C1
      change: Remove subset stability from a second deck, leaving only three restrictable decks.
      expected: The same construction stops at a two-deck Cartesian scan of Theta(B^2), which exceeds k=B^(5/4+o(1)); no theorem about smarter methods follows.
    - id: C2
      change: Hide fifth-deck occurrence labels.
      expected: Encoding equality alone does not supply the coefficient label required by this decoder, so the reduction stops.
    - id: C3
      change: Replace reconstructible fifth entries with opaque persistent handles not charged to ell or k.
      expected: The resource accounting and MPZ interface mapping stop.
    - id: C4
      change: Promise only constant marginal correctness independently for each predicate call.
      expected: Adaptive success does not compose; the reduction makes no success claim.
    - id: C5
      change: Permit target-conditioned advice or unbounded unit-cost words.
      expected: The stated ell/k substitution into MPZ is invalid.
    - id: C6
      change: Supply coordinate-aware P1553, Semaev, resultant, or field-oracle operations.
      expected: This generic representation proof is nonapplicable and makes no transfer claim.
    - id: C7
      change: Introduce modular, sign, or cross-deck duplicate encodings in F_4.
      expected: Multiple labels may match, but every matching labelled coefficient decodes to the required group equality modulo N.
    - id: C8
      change: Corrupt a restriction response.
      expected: The scan finds no match or final verification rejects; corrupted responses do not count as successful transcripts.
  
  falsification_criteria:
    theorem_falsified_if:
      - The isolation invariant or exact 4*log2(2m) count fails under the stated exact predicate.
      - A successful isolated tuple leaves no matching labelled public fifth occurrence.
      - A matching labelled occurrence can make the modulo-N decoder fail final group verification.
      - The required fifth scan or any omitted mandatory interaction cannot fit the declared hard k bound.
      - The predecessor MPZ inequality is inapplicable after exact interface mapping and full resource serialization.
    not_falsification:
      - An infrastructure, parser, runtime, or review failure.
      - Failure of a coordinate-aware, target-local, representation-sensitive, or random-deck-only route outside the theorem assumptions.
      - The Theta(B^2) cost of the explicit two-full-deck control, which only marks this proof method's ceiling.
  
  scope_boundaries:
    covered: >-
      Universal arbitrary signed occurrence-labelled deck interfaces with exact
      canonical dyadic restrictions in F_0 through F_3, a public/full/labelled/
      reconstructible target-independent F_4, complete-transcript success, and
      fully serialized MPZ accounting.
    expressly_open:
      - Coordinate-aware P1553 and Semaev/resultant/field-operation mechanisms.
      - Random-deck-only or distribution-specific objects that reject adversarial mixed-radix decks.
      - Target-dependent preprocessing or state under a separately specified model.
      - Representation-sensitive equality or leakage not modeled by the generic interface.
      - Methods with only three restrictable decks that avoid the explicit Cartesian two-deck scan.
      - Any claim beyond the exact ell and k regime stated here.
  
