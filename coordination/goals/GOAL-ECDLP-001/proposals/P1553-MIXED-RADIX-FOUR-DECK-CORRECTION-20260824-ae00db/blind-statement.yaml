  recorded_at: "2026-08-24T23:41:40Z"
  quantity: >-
    Decide from the statement alone whether four exact subset-stable mixed-radix
    decks plus a full public scan of the fifth deck yield a verified DLP extractor
    inside the supplied preprocessing generic-group resource rectangle.
  frozen_statement:
    - G=<P> is a prime-order generic group of order N and Q=[x]P is fresh
    - B=N^(1/5), m=2^ceil(log2 B), and C=sum_i_0_to_4 m^i
    - F_i contains labelled signed occurrences (i,d,sigma,[sigma(d+1)m^i]P) for 0<=d<m
    - target R=Q+[C]P
    - one target-independent object answers the exact existence predicate after canonical dyadic restrictions of F_0 through F_3 while F_4 stays whole
    - phase-crossing advice is at most B^(9/4+o(1)) ordinary O(log N)-bit words
    - every main interaction, including fifth-deck reconstruction and scan, is included in one B^(5/4+o(1)) cap
    - supplied theorem bound is success <=3 ell (k+1)^2/N for ell advice bits and k aggregate main interactions
  required_derivation:
    - prove or refute the four-deck bisection invariant and exact query count
    - prove or refute existence and completeness of the public fifth-deck scan
    - derive the labelled decoder and final verification under all modular/sign collisions
    - count handle reconstruction, scan, decoding, and verification interactions
    - derive the B and N success exponents
    - state exact nonapplicability boundaries
  known_false_transfers:
    - only three restrictable decks with two full decks requiring a Cartesian scan
    - hidden or anonymous fifth-deck occurrences
    - target-conditioned advice
    - nonreconstructible opaque fifth-deck handles
    - marginal per-query rather than complete-transcript success
    - coordinate-aware P1553, Semaev, resultant, or field-arithmetic oracle
