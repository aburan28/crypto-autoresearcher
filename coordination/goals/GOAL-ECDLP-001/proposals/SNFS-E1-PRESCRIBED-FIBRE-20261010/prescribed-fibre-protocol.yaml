# Bounded design artifact. This file is not an approval, experiment record,
# execution authorization, or scientific result.
schema: crypto.autoresearch.prescribed_fibre_protocol.v1
protocol:
  id: PROTO-SNFS-E1-20261011-b01e42
  idea_id: IDEA-20261009-b01e42
  hypothesis_id: H-ECDLP-bd1572
  goal_id: GOAL-ECDLP-001
  title: Prescribed ordinary fibre realization over F_p(t)
  design_status: review_required
  approval_status: withheld
  execution_state: not_ready
  approved_by: null
  dispatch_authorized: false
  scientific_status_change: none
  claim_ceiling: >-
    A finite realization and rank census over the twelve declared cells and
    declared source families only. It makes no asymptotic density claim,
    universal nonexistence claim, ECDLP improvement claim, or transfer to
    cryptographic-size parameters.
  lineage:
    design_audit: coordination/goals/GOAL-ECDLP-001/proposals/SNFS-E1-PRESCRIBED-FIBRE-20261010/design-audit.md
    proposal: ledger/proposals/IDEA-20261009-b01e42.yaml
    intake_manifest: coordination/intakes/20261009-snfs-ecdlp-ledger/manifest.yaml
    intake_source: coordination/intakes/20261009-snfs-ecdlp-ledger/source.yaml

  target_panel:
    generation_rule: >-
      The four rows below are the lexicographically first short-Weierstrass
      coefficients (A,B) with nonzero discriminant, ordinary trace, and
      j not in {0,1728} under the stated finite-field enumeration. They are
      frozen before any surface coefficient is sampled.
    curve_model: y^2 = x^3 + A*x + B over F_p
    fibre_parameter: 0
    point_encoding: >-
      Encode O as the single byte 00 and affine points as the fixed-width
      big-endian pair (x,y), each width ceil(log2(p)/8) bytes. Within a panel
      use the lexicographically least encoded affine point as the canonical
      sample point; this encoding is for certificates and is not a DLP input.
    rows:
      - cell_key: p7
        p: 7
        A: 1
        B: 1
        discriminant_factor_mod_p: 3
        discriminant_mod_p: 1
        trace: 3
        group_order: 5
        j_mod_p: 1
        twist:
          d: 3
          d_is_nonsquare: true
          A: 2
          B: 6
          trace: -3
          group_order: 11
      - cell_key: p13
        p: 13
        A: 1
        B: 1
        discriminant_factor_mod_p: 5
        discriminant_mod_p: 11
        trace: -4
        group_order: 18
        j_mod_p: 7
        twist:
          d: 2
          d_is_nonsquare: true
          A: 4
          B: 8
          trace: 4
          group_order: 10
      - cell_key: p19
        p: 19
        A: 1
        B: 1
        discriminant_factor_mod_p: 12
        discriminant_mod_p: 17
        trace: -1
        group_order: 21
        j_mod_p: 6
        twist:
          d: 2
          d_is_nonsquare: true
          A: 4
          B: 8
          trace: 1
          group_order: 19
      - cell_key: p31
        p: 31
        A: 1
        B: 2
        discriminant_factor_mod_p: 19
        discriminant_mod_p: 6
        trace: 8
        group_order: 24
        j_mod_p: 13
        twist:
          d: 3
          d_is_nonsquare: true
          A: 9
          B: 23
          trace: -8
          group_order: 40
    certificate_requirements:
      - primality_certificate_for_p
      - nonsingularity_and_discriminant_certificate
      - point_count_and_trace_recomputation
      - explicit_Fp_isomorphism_or_exact_twist_certificate
      - fixed_panel_hash_before_sampling

  cells:
    chi_values: [1, 2, 3]
    prime_values: [7, 13, 19, 31]
    count: 12
    definition:
      - cell_key: chi1_p7
        chi: 1
        p: 7
        target_panel: [p7]
      - cell_key: chi1_p13
        chi: 1
        p: 13
        target_panel: [p13]
      - cell_key: chi1_p19
        chi: 1
        p: 19
        target_panel: [p19]
      - cell_key: chi1_p31
        chi: 1
        p: 31
        target_panel: [p31]
      - cell_key: chi2_p7
        chi: 2
        p: 7
        target_panel: [p7]
      - cell_key: chi2_p13
        chi: 2
        p: 13
        target_panel: [p13]
      - cell_key: chi2_p19
        chi: 2
        p: 19
        target_panel: [p19]
      - cell_key: chi2_p31
        chi: 2
        p: 31
        target_panel: [p31]
      - cell_key: chi3_p7
        chi: 3
        p: 7
        target_panel: [p7]
      - cell_key: chi3_p13
        chi: 3
        p: 13
        target_panel: [p13]
      - cell_key: chi3_p19
        chi: 3
        p: 19
        target_panel: [p19]
      - cell_key: chi3_p31
        chi: 3
        p: 31
        target_panel: [p31]

  surface_families:
    constrained_null:
      id: C
      purpose: prescribed_fibre realization under a fixed target
      equation: y^2 = x^3 + A(t)*x + B(t)
      constraints_at_t0: [A(0)=target.A, B(0)=target.B]
      degree_bounds: [deg(A)<=4*chi, deg(B)<=6*chi]
      coefficient_form: >-
        A(t)=a0+t*A1(t), B(t)=b0+t*B1(t), with a0 and b0 fixed by the
        target row and all free coefficients sampled from the frozen law.
      attempts_per_target_cell: 1000
      seeds: campaign-unique-derived-from-protocol-hash-and-cell-key
      rejection_before_measurement:
        - coefficient-law-or-seed-invalid
        - nonminimal-model
        - singular-total-space-or-undefined-fibre
        - certificate-construction-failure
      retain_all_rows: true
    unconstrained_matched_control:
      id: U
      purpose: constraint-effect control, never prescribed-fibre success
      equation: y^2 = x^3 + A(t)*x + B(t)
      degree_bounds: [deg(A)<=4*chi, deg(B)<=6*chi]
      coefficient_form: same-law-and-filter-as-C-without-specialization-equations
      attempts_per_cell: 1000
      seed_separation: disjoint-from-C
      retain_all_rows: true
    source_pinned_high_rank:
      id: H
      purpose: finite named-family search with fixed twist candidates
      families:
        - id: ulmer_linear_xy
          source_locator: intake-source-Ulmer-Annals-2002
          equation_template: y^2 + x*y = x^3 - t^d
          base_field: F_p(t)
          d_values_by_p:
            p7: [2, 4]
            p13: [2]
            p19: [2, 4, 5]
            p31: [2, 4]
          admissibility_rule: d divides p+1 for the F_p(t) specialization
          source_reference: https://library.slmath.org/books/Book49/files/11ulmer.pdf
          source_verification: retrieved_primary_equation_and_divisibility_scope
          prescribed_fibre_compatibility: >-
            The source family specializes at t0=0 to y^2+x*y=x^3, which is
            singular. It therefore cannot realize any declared ordinary
            target at the frozen fibre without a separately certified change
            of parameter, equation, or target panel.
        - id: shioda_fermat_quotient
          source_locator: intake-source-Shioda-Fermat-family
          equation_template: source-pinned-equation-required-before-execution
          parameter_values: source-pinned-finite-list-required-before-execution
          source_verification: pending_read_and_bind_exact_applicability
      twist_rule: A_d=d(t)^2*A, B_d=d(t)^3*B
      twist_candidates_per_family_cell: 1000
      twist_at_t0_square_class_recorded: true
      candidate_classification:
        - success
        - checked_no_match
        - censored_timeout
        - invalid_infrastructure

  rank_and_fibre_certificates:
    rank_fields:
      - rank_over_Fp_t
      - rank_over_algebraic_closure
    zeta_point_count_ladder: >-
      For each accepted surface retain #S(F_(p^k)) for every integer k from 1
      through 12*chi-2, the raw point-count receipts, hashes, reconstruction,
      field-operation counts, bit-operation counts, memory, and per-surface
      point-count cost.
    independent_section_certificate:
      required: true
      contents:
        - exact_rational_functions
        - section_identity_checker_output
        - specialization_at_t0
        - canonical_height_and_regulator_data
        - independent_upper_bound_or_source_validated_rank_bound
    fibre_certificate:
      required: true
      contents:
        - smooth_fibre_check
        - explicit_Fp_isomorphism
        - exact_twist_class
        - discriminant_and_minimality
    invalid_certificate_policy: >-
      A failed certificate is invalid or infrastructure evidence and is never
      counted as a checked_no_match observation.

  controls:
    - id: U
      description: matched unconstrained coefficient law and degree bounds
    - id: constant_j
      description: constant-j surfaces at the same cells, not ordinary success
    - id: supersingular
      description: supersingular high-rank controls, not ordinary success
    - id: reducible_fibre
      description: nearby reducible-fibre controls, not ordinary success
    - id: planted_rank
      description: planted section and rank certificate control
    - id: zeta_section_agreement
      description: independent agreement check on every control where feasible

  metrics:
    primary:
      - confirmed_prescribed_fibre_count_by_cell_and_family
      - rank_Fp_t_histogram
      - rank_geometric_histogram
      - max_rank_through_prescribed_ordinary_fibre
    secondary:
      - N_confirmed_over_N_attempted_valid
      - target_coverage_cardinality_over_declared_target_panel
      - realized_j_density_by_rank_threshold
      - twist_match_rate_by_family_and_cell
      - point_count_cost_and_peak_memory
      - censoring_table
    denominators:
      attempted_valid: all attempted rows retained, including low-rank and failed-certificate rows
      target_coverage: fixed target panel cardinality, never shrunk after observing outcomes
      distinct_statistics: [j_values, fibre_occurrences, target_pairs]

  stopping_and_budget:
    fixed_work:
      constrained_null_rows: 12000
      unconstrained_control_rows: 12000
      high_rank_twist_candidates: 24000
    hard_stop:
      condition: fixed rows complete or declared infrastructure limit reached
      favorable_hit_extension: forbidden
      retry_after_timeout: forbidden unless predeclared retry budget is unused
    resource_budget:
      cpu_hours_max: 800
      wall_clock_hours_max: 336
      peak_memory_gb_max: 64
      estimate_status: advisory
    outcome_labels:
      - success
      - checked_no_match
      - censored_timeout
      - invalid_infrastructure
      - low_rank_valid
      - failed_certificate

  decision_impact:
    success: >-
      Keep the route alive only for the exact cell, target panel, family, and
      rank certificate scope; schedule independent validation before any claim
      expansion.
    checked_no_match: >-
      Weakens only the exact tested family/cell/search-cap route and triggers a
      Coordinator rerank; it does not establish universal unrealizability.
    censored_timeout: >-
      Records right-censored infrastructure evidence and leaves the hypothesis
      unchanged.
    invalid_infrastructure: >-
      Repairs or reruns the producer path; it changes no mathematical status.

  review_and_archival:
    required_before_approval:
      - source-binding review for all recalled references
      - target-panel certificate and fixed-panel hash
      - protocol schema and completeness validation
      - independent validator for certificates and control separation
      - red-team review of rank quantifiers, denominators, twist handling, and costs
    producer_artifacts:
      - protocol.yaml
      - frozen-target-panel.yaml
      - source-family-manifest.yaml
      - implementation-and-checker
      - raw-count-and-rank-receipts
    review_plan: >-
      A future claim-changing round must name the prior, assign the fibre
      identity, rank quantifier, certificate, cost, and interpretation joints
      to distinct reviewers, require a proves-too-much control, and require a
      blind re-derivation from the statement and parameters alone.
    archival_owner: coordinator-only snapshot-then-ledger tasks
    run_report: research-visuals-required-if-and-when-executed

  readiness_gate:
    required_artifacts_before_experiment_mint: [source-family-manifest.yaml, frozen-target-panel.yaml]
    required_artifacts_before_approval:
      - experiment specification with implementation launcher
      - exact inference manifest and model probe receipt
      - completed source verification
      - approval capacity headroom
    command: python3 tools/newest_experiments.py --experiment <minted-EXP-SNFS-E1-ID> --json
    required_result: 'execution_state: ready'
    current_result: not_run_no_experiment_minted
    current_reason: >-
      The protocol is deliberately unapproved and undispatched: the goal has
      seven approved-but-unrun experiments against a capacity cap of three,
      and the source-pinned H family equations still require binding before an
      execution launcher can be minted.
