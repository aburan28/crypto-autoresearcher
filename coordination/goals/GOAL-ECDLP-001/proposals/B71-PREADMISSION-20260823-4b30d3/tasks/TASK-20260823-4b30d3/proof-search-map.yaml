schema_version: "1.0"
record_kind: "proof_search_map"
task_id: "TASK-20260823-4b30d3"
goal_id: "GOAL-ECDLP-001"
disposition: "scoped_no_admission"
candidate: null
claim_ceiling: "unverified_zero_run_formula_level_public_input_identity_or_exact_declared_representation_scoped_counterexample_only"
scope_statement: >-
  This map audits why no positive mechanism is admitted from the frozen source
  set. It does not prove that the open ECDLP lane lacks such a mechanism.

baseline_reproduction:
  audit_status: "completed_from_internal_static_records"
  pollard_rho:
    problem: "prime-order generic ECDLP"
    time: "ell^(1/2+o(1)) group operations"
    memory: "O(1) distinguished algorithm state apart from parallel coordination"
    setup: "no ell-scale quotient or H table"
    data_queries: "one public target; no auxiliary oracle or target corpus"
  b70_probability_algebra:
    signed_support_parameter: "r=D/s"
    membership_probability: "2D/(s ell)"
    identity_probability: "1/ell"
    total_terminal_probability: "(1+2D/s)/ell"
    expected_terminal_attempts: "ell/(1+2D/s)"
    scope: "uniform-shift model with explicit identity semantics"
  b70_conditional_online_balance:
    premise: "complete per-query D^beta evaluator"
    balance: "alpha=2/(3-2 beta)"
    exponent: "1/(3-2 beta)"
    strict_online_improvement_iff: "beta<1/2"
    limitation: >-
      The premise is unproved and setup, state, traffic, memory, target
      preprocessing, divisor families, recovery, verification, and
      amortization are not certified.
  b70_realized_representation_ceiling:
    dense_quotient: "Theta(ell) represented setup/state"
    leaf_explicit: "Theta(D/s) represented leaves or queries without recompression"
    exact_generic_cycle: "D/s deterministic exact worst-case point-indicator queries"
  reproduction_result: >-
    The realized B70 families do not beat Pollard rho, and the desired implicit
    row is not a constructed public-input mechanism.

observation_collision_audit:
  audit_status: "fails_candidate_precondition"
  proposed_observable: null
  exact_collision_condition: >-
    For a proposed observable O, search for ordinary public inputs with
    O(P,Q_1)=O(P,Q_2) but distinct correctly oriented signed witnesses; also
    search for the same observable value on member, nonmember, identity,
    positive-sign, negative-sign, and denominator cases.
  frozen_collision_or_aliasing_signal: >-
    Boolean signed-orbit support does not distinguish the signed scalar, and
    B70's labelled descent maps leaf j to the class of m^(-j) while returning
    m^j.
  same_shape_nulls:
    - "random cyclic permutation"
    - "same-shape random map"
  falsification_condition: >-
    Any cross-witness collision not resolved by a public, costed recovery map,
    or any comparable signal on the null objects, falsifies the proposed
    observable as a signed-witness interface.
  result: "No candidate observable exists to test; positive admission is withheld."

quantifier_order_audit:
  audit_status: "completed_as_required_statement; existential_witness_absent"
  required_order:
    - "There exist fixed uniform public algorithms Pre, Eval, Recover, Verify and constants epsilon_axis>0."
    - "For every sufficiently large prime ell and every admissible declared group or curve family and public base P of order ell."
    - "Pre receives only the declared public group data and P, is independent of the later target Q, and produces fully charged state S."
    - "For every independently chosen public target Q in the subgroup generated by P."
    - "Over only the algorithms' declared randomness, Eval and Recover return a correctly oriented signed scalar or index witness with the stated success probability, and Verify checks it publicly."
    - "For every charged axis, including setup amortized over the declared target count, the base-field or bit cost is o(ell^(1/2)) with no hidden Theta(r) state or target-specific advice."
  symbolic_form: >-
    exists (Pre,Eval,Recover,Verify,epsilon_axis) forall sufficiently_large ell
    forall admissible (E_or_G,P) let S=Pre(E_or_G,P) forall independent Q
    in <P>: probability_randomness[Verify(P,Q,Recover(Eval(S,Q)))]=1-o(1),
    with every charged axis <= ell^(1/2-epsilon_axis+o(1)).
  forbidden_reordering:
    - "choosing preprocessing or advice after seeing Q"
    - "choosing the representation separately for each successful target"
    - "existentially selecting a good orbit after observing the witness"
    - "amortizing over an undeclared or unbounded target corpus"
  result: "No source in scope supplies the existential algorithms or axis constants."

method_ceiling_audit:
  audit_status: "completed_for_frozen_methods"
  ceilings:
    - method: "dense quotient"
      ceiling: "Theta(ell) represented setup/state"
      scope: "dense represented quotient only"
    - method: "leaf-explicit trace"
      ceiling: "Theta(D/s) represented labelled leaves or queries"
      scope: "frozen leaf-explicit representation only"
    - method: "deterministic exact generic-cycle point-oracle membership"
      ceiling: "D/s worst-case point-indicator queries"
      scope: "declared exact forward-action plus point-indicator access only"
  nontransfer_statement: >-
    These ceilings do not transfer to structured, randomized, bounded-error,
    transposed, modular-composition, power-projection, batched,
    witness-carrying, or correctly typed extension-field representations.
  nearest_known_false_controls:
    - object: "random cyclic permutation"
      known_false_conclusion: >-
        A generic cyclic permutation alone does not provide the claimed
        public algebraic signed-witness map or a free implicit evaluator.
    - object: "same-shape random map"
      known_false_conclusion: >-
        Shape agreement alone does not provide ECDLP witness semantics.
  proves_too_much_failure_signature: >-
    The proof syntax continues unchanged on either control and still concludes
    correctly oriented signed recovery or strict all-axis sub-rho performance.
  result: >-
    Frozen ceilings are scoped; there is no candidate method whose broader
    ceiling or improvement can be audited.

obligations:
  mathematical_improvement:
    - obligation: "display a mechanism-new identity, recurrence, or observable"
      status: "open"
      falsification: "it is only a renamed missing interface or fails exact algebraic typing"
    - obligation: "prove completeness and soundness for signed witness recovery"
      status: "open"
      falsification: "distinct signed witnesses collide without public disambiguation"
    - obligation: "prove success probability and all-in per-target cost"
      status: "open"
      falsification: "any charged axis is not strictly o(ell^(1/2))"
    - obligation: "state transfer assumptions and exact family scope"
      status: "open"
      falsification: "a representation-scoped result is asserted for an excluded model"
  public_input_interface:
    - obligation: "construct every representation from ordinary public ECDLP inputs"
      status: "open"
      falsification: "construction needs target-specific advice or an undeclared oracle"
    - obligation: "give a lossless, correctly oriented witness map"
      status: "open"
      falsification: "the map repeats the m^(-j) versus m^j failure or returns Boolean membership only"
    - obligation: "charge setup, state, memory, queries, coefficient/rank traffic, rerandomization, recovery, verification, and amortization"
      status: "open"
      falsification: "any term is omitted or moved outside the declared access model"
    - obligation: "freeze preprocessing before independent targets"
      status: "open"
      falsification: "preprocessing depends on Q or target count is undeclared"

proof_architecture_if_a_candidate_is_later_supplied:
  - lemma: "typing_and_representation_size"
    responsibility: "define bases, maps, exceptional strata, extension degree, and represented size"
  - lemma: "public_construction_and_evaluation_runtime"
    responsibility: "construct and evaluate from ordinary public inputs with every traffic term"
  - lemma: "signed_recovery_correctness"
    responsibility: "prove orientation, completeness, soundness, and public verification"
  - lemma: "success_probability"
    responsibility: "separate member, identity, denominator, and both-sign events"
  - lemma: "all_in_cost"
    responsibility: "multiply per-attempt cost by inverse success and charge setup amortization"
  - lemma: "scope_and_transfer"
    responsibility: "state exactly which curve, group, divisor, representation, and access families are affected"

controls:
  status: "specified_not_run"
  experiment_runs: 0
  command_activity: 0
  cases:
    - "Pollard rho"
    - "B70 dense quotient"
    - "B70 leaf-explicit trace"
    - "B70 exact generic-cycle point-oracle"
    - "random cyclic permutation"
    - "same-shape random map"
    - "member"
    - "nonmember"
    - "identity"
    - "denominator"
    - "positive sign"
    - "negative sign"
    - "B70 orientation failure"
    - "explicit state"
    - "implicit state"
    - "frozen preprocessing with independent targets"

conclusion:
  exact_result: >-
    The proof-search audits expose unresolved improvement and interface
    obligations and therefore support only the single scoped no-admission
    disposition.
  scientific_transition: false
  automatic_successor_batch: false
  open_directions_preserved: true

