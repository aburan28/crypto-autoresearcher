  candidate_row: null
  dominated_by: "Pollard rho for every realized B70 row; no candidate exists to rank"
  sota_delta: >-
    No realized candidate delta exists. For the uninstantiated desired B70
    evaluator only, the conditional online time-exponent delta is
    1/(3-2 beta)-1/2, negative exactly when beta<1/2; memory, setup, data-query,
    traffic, recovery, verification, state, and amortization deltas are unknown.
  realized_rows:
    - row: "B70 dense quotient"
      time: "Omega(ell) setup output and Omega(ell) dense query work before retries"
      memory: "Omega(ell) field words"
      dominated_by: "Pollard rho"
      sota_delta: "time exponent at least +1/2 and memory exponent at least +1 relative to low-memory rho, before retry/recovery terms"
    - row: "B70 leaf explicit"
      time: "expected search work Omega((ell/D)*(D/s))=Omega(ell/s), plus setup"
      memory: "Omega(D/s) labels/backpointers"
      dominated_by: "Pollard rho"
      sota_delta: "time exponent at least +1/2 for polynomial-size D, with no memory advantage over rho"
    - row: "B70 exact generic-cycle point-oracle"
      time: "expected membership search Omega((ell/D)*(D/s))=Omega(ell/s)"
      memory: "can be O(1) aside from cycle state"
      data_queries: "D/s point-oracle queries per exact worst-case membership evaluation"
      dominated_by: "Pollard rho"
      sota_delta: "time exponent at least +1/2; memory is comparable but not better"
    - row: "desired implicit evaluator"
      time: "conditional ell^(1/(3-2 beta)+o(1)) only if an uninstantiated beta<1/2 evaluator and all charged terms exist"
      remaining_axes: "unknown"
      dominated_by: "n/a_not_comparable_uninstantiated"
      sota_delta: "conditional time delta only; no realized speedup"

