schema_version: "1.0"
record_kind: "preadmission_mechanism_card"
task_id: "TASK-20260823-4b30d3"
goal_id: "GOAL-ECDLP-001"
result_count: 1
disposition: "scoped_no_admission"
uncertainty: >-
  Whether any surviving ECDLP frontier route now has a concrete public-input
  mechanism with signed witness recovery and strict all-axis sub-rho accounting
  sufficient to justify a later Coordinator decision about at most one B71
  zero-run batch.
claim_ceiling: "unverified_zero_run_formula_level_public_input_identity_or_exact_declared_representation_scoped_counterexample_only"
claim_boundary:
  positive_mechanism_claimed: false
  attack_claimed: false
  speedup_claimed: false
  cryptographic_scale_result_claimed: false
  scientific_promotion_claimed: false
  closure_claimed: false
  novelty_claimed: false
  breakthrough_claimed: false
  experiment_runs: 0
  command_activity: 0
  implementation_activity: 0
  statement: >-
    This card records only that the mandatory positive admission conjunction
    was not discharged within the frozen internal source scope. It is not
    evidence that no qualifying mechanism exists outside that scope, and it
    does not close or weaken any surviving route.

mechanism_delta:
  status: "not_supplied"
  symbolic_identity_recurrence_or_observable: null
  displayed_delta: "none; fabricating or renaming a missing interface is forbidden"
  mandatory_obligation_not_met: >-
    No mechanism in the committed read scope simultaneously supplies an
    explicit mechanism-new public-input identity, recurrence, or observable;
    a correctly oriented signed scalar or index witness map; and a complete
    strict all-axis o(ell^(1/2)) certificate in one declared cost model.
  decisive_components:
    - obligation: "explicit mechanism-new public-input identity, recurrence, or observable"
      status: "not_met"
      boundary: >-
        B70-DER-7 reports no public-input implicit finite-quotient evaluator,
        and merely naming an implicit evaluator, recompression, modular
        composition, power projection, elliptic-net recurrence, target-labelled
        factor, or witness representation is not a mechanism delta.
    - obligation: "correctly oriented signed scalar or index witness"
      status: "not_met"
      boundary: >-
        B70-DER-2 fixes the frozen mismatch: leaf j identifies the signed class
        of m^(-j), while the packet returns m^j. Boolean support does not repair
        this signed-orientation failure.
    - obligation: "strict all-axis sub-rho accounting"
      status: "not_met"
      boundary: >-
        B70-DER-4 is conditional online exponent algebra only. Setup, state,
        traffic, memory, target preprocessing, admissible divisor families,
        recovery, verification, and amortization are uncertified.

ordinary_public_input_interface:
  required_inputs:
    - "a declared prime-order ECDLP group or curve instance"
    - "public base point P of order ell"
    - "public target Q in the subgroup generated by P"
  forbidden_hidden_inputs:
    - "target-specific advice"
    - "an undeclared implicit-evaluation oracle"
    - "an undeclared modular-composition or power-projection oracle"
    - "an ell-scale quotient or H table hidden outside setup accounting"
    - "Theta(r) instance state hidden outside memory or traffic accounting"
  candidate_interface: null
  status: "not_met"

signed_witness_map:
  required_output: >-
    A correctly oriented signed scalar or signed index witness that can be
    checked against Q using ordinary public operations.
  candidate_map: null
  frozen_failure_control: >-
    Under sigma_m(f)(alpha_v)=f(alpha_(m v)), frozen leaf j identifies the
    signed class of m^(-j), while the B70 packet returns m^j.
  boolean_support_suffices: false
  status: "not_met"

declared_representation_and_access_model:
  candidate_representation: null
  candidate_access_model: null
  frozen_scoped_families:
    - family: "B70 dense quotient"
      represented_obstruction: "Theta(ell) field words of setup or state"
    - family: "B70 leaf-explicit trace"
      represented_obstruction: "Theta(D/s) labelled leaves or queries without recompression"
    - family: "B70 deterministic exact generic-cycle point-oracle"
      represented_obstruction: "D/s worst-case point-indicator queries"
  transfer_exclusions:
    - "structured or randomized representations"
    - "normal or Fourier bases"
    - "modular composition or power projection"
    - "transposed or batched evaluation"
    - "bounded-error access"
    - "witness-carrying observables"
    - "properly typed extension-field or Frobenius structure"
    - "declared multi-target amortization"
  status: "no_candidate_model_declared"

all_axis_cost_inequality:
  asymptotic_parameter: "ell"
  required_model: "one declared base-field-operation or bit-cost model"
  realized_baseline:
    name: "Pollard rho for prime-order generic ECDLP"
    time: "ell^(1/2+o(1)) group operations"
    memory: "O(1) distinguished algorithm state apart from parallel coordination"
    setup: "no ell-scale quotient or H table"
    data_queries: "one public target; no auxiliary oracle or target corpus"
  required_positive_inequalities:
    setup: "o(ell^(1/2))"
    online_time: "o(ell^(1/2))"
    memory_and_state: "o(ell^(1/2)) with no hidden Theta(r) instance state"
    data_query_and_coefficient_rank_traffic: "o(ell^(1/2))"
    target_rerandomization: "o(ell^(1/2))"
    recovery: "o(ell^(1/2))"
    verification: "o(ell^(1/2))"
    preprocessing_and_amortization: >-
      o(ell^(1/2)) per independently sampled target under an explicit target
      count, with frozen preprocessing charged and no target-specific advice
  candidate_charges:
    setup: null
    online_time: null
    memory_and_state: null
    data_queries: null
    coefficient_traffic: null
    rank_traffic: null
    target_rerandomization: null
    recovery: null
    verification: null
    preprocessing: null
    amortization: null
    target_count: null
  conditional_b70_online_relation:
    premise: "a complete per-query D^beta evaluator, not produced"
    balance: "alpha=2/(3-2 beta)"
    online_exponent: "1/(3-2 beta)"
    strict_online_improvement_condition: "beta<1/2"
    admission_value: "insufficient; all other axes and the evaluator are unknown"
  status: "not_demonstrated"

admission_gates:
  positive:
    - gate: "explicit mechanism-new symbolic identity, recurrence, or observable"
      passed: false
    - gate: "ordinary public-input construction"
      passed: false
    - gate: "correctly oriented signed witness recovery"
      passed: false
    - gate: "complete representation and access model"
      passed: false
    - gate: "strict all-axis sub-rho certificate"
      passed: false
    - gate: "source-backed novelty sufficient for admission"
      passed: false
  negative:
    - gate: "scoped representation obstruction for B70 dense quotient"
      passed: true
      scope: "Theta(ell) represented dense quotient state only"
    - gate: "scoped representation obstruction for B70 leaf-explicit trace"
      passed: true
      scope: "Theta(D/s) represented labelled leaves only"
    - gate: "scoped query obstruction for exact generic-cycle point-oracle access"
      passed: true
      scope: "D/s deterministic exact worst-case point-indicator queries only"
    - gate: "positive admission conjunction"
      passed: false
      effect: "select no candidate"
  inconclusive:
    - gate: "existence of a public-input implicit evaluator with beta<1/2"
      status: "unresolved"
    - gate: "lossless recompression with oriented witness descent"
      status: "unresolved"
    - gate: "all-in structured, randomized, transposed, or batched accounting"
      status: "unresolved"
    - gate: "novelty outside the internal read scope"
      status: "unverified"

controls:
  execution_status: "preregistered_or_static_only; no control was run"
  required:
    - "Pollard rho"
    - "B70 dense quotient family"
    - "B70 leaf-explicit family"
    - "B70 exact generic-cycle point-oracle family"
    - "random cyclic permutation"
    - "same-shape random map"
    - "member case"
    - "nonmember case"
    - "identity case"
    - "denominator case"
    - "positive-sign case"
    - "negative-sign case"
    - "B70 m^(-j) versus m^j orientation failure"
    - "explicit versus implicit state"
    - "frozen preprocessing followed by independent targets"

proposed_review_plan:
  status: "proposed_only_not_dispatched"
  claim_under_review: >-
    The scoped pre-admission record selects no candidate because the frozen
    sources do not exhibit the required conjunction; it makes no nonexistence,
    novelty, speedup, closure, or transition claim.
  coordinator_prior: >-
    Expect J1 to preserve the split-root Boolean identity, J2 to confirm that
    the frozen witness orientation is broken and no replacement public
    interface is supplied, J3 to find all-axis admission unproved, J4 to keep
    every obstruction representation-scoped, and J5 to preserve all open
    resources and novelty as unverified.
  joints:
    - joint: "J1_typed_algebra"
      assigned_to: "proposed_reviewer_J1"
      attack_plan: >-
        Re-type the split-root quotient, unit-denominator, primitive-idempotent
        trace, and signed Boolean support; try member, nonmember, identity,
        denominator, nonsplit-coordinate, and both-sign cases.
      breaking_artifact: >-
        A public input for which the claimed typed Boolean support or unit
        condition fails inside its declared split-root scope.
    - joint: "J2_public_interface_and_witness"
      assigned_to: "proposed_reviewer_J2"
      attack_plan: >-
        Derive the action of sigma_m on alpha_v from first principles and trace
        a labelled leaf to its returned scalar; require construction solely
        from ordinary public inputs and reject any hidden target-labelled
        factor or evaluator oracle.
      breaking_artifact: >-
        A worked transcript showing either that m^j is correctly oriented or
        that a concrete replacement map returns and verifies the signed witness.
    - joint: "J3_blind_all_axis_rederivation"
      assigned_to: "proposed_reviewer_J3"
      attack_plan: >-
        From ell, D, s, beta, success probability, and declared target count
        alone, rederive setup times online cost times inverse success,
        recovery, verification, state, memory, traffic, and amortization.
      breaking_artifact: >-
        Any charged axis at or above ell^(1/2-o(1)), any omitted term, or any
        hidden Theta(r) instance state or target-specific advice.
    - joint: "J4_proves_too_much_and_access_model"
      assigned_to: "proposed_reviewer_J4"
      attack_plan: >-
        Apply the same reasoning to a random cyclic permutation and a
        same-shape random map, contrast explicit and implicit state, and freeze
        preprocessing before independent targets.
      breaking_artifact: >-
        The derivation still claims signed recovery or sub-rho performance for
        the known-false controls, or moves representation cost outside the model.
    - joint: "J5_scope_pareto_novelty_and_resources"
      assigned_to: "proposed_reviewer_J5"
      attack_plan: >-
        Compare every realized axis with Pollard rho and B64-B70, audit citation
        provenance, refuse novelty from unretrieved sources, and verify that
        structured bases, modular composition, power projection, transposition,
        batching, richer observables, and typed Frobenius routes remain open.
      breaking_artifact: >-
        An uncharged dominated axis, an unsupported novelty statement, an
        overbroad lower-bound transfer, or an omitted unresolved resource.
  blindness:
    mutual: true
    lifted_for: []
    rationale: "Each proposed owner assesses only its preregistered joint without sibling reports."
  proves_too_much:
    objects:
      - "random cyclic permutation"
      - "same-shape random map"
    failure_signature: >-
      The argument returns a signed ECDLP witness or strict sub-rho certificate
      when the control supplies no corresponding public algebraic interface.
    assigned_to: "proposed_reviewer_J4"
  blind_rederivation:
    required: true
    quantity: >-
      all-in exponent and resource vector after per-attempt cost is multiplied
      by inverse terminal success probability
    parameters:
      - "ell"
      - "D"
      - "s"
      - "beta"
      - "terminal success probability"
      - "target count"
    blind_from:
      - "producer implementation"
      - "producer private derivation notes"
      - "producer cost spreadsheet"
    assigned_to: "proposed_reviewer_J3"
  procedure_deviations: []

pareto_and_resource_preservation:
  dominated_by: "Pollard rho for every realized B70 representation row; no candidate row exists"
  sota_delta: >-
    No realized delta is claimed. B70's desired implicit row has conditional
    time-exponent delta 1/(3-2 beta)-1/2, negative exactly for beta<1/2, while
    every realized non-time axis is unknown.
  open_directions:
    - "oracle-free gauge-invariant structured or nonlinear elliptic-net or division-polynomial operations"
    - "certified implicit annihilators or low-rank recurrences with jet-sensitive multifunctionals"
    - "Semaev-specific separators or contractions with named bases, maps, counts, and replay"
    - "structured normal or Fourier bases"
    - "modular composition and power projection"
    - "transposed or batched evaluation with explicit target count"
    - "richer moments, characters, or witness-carrying observables"
    - "correctly typed extension-field and Frobenius structure"

