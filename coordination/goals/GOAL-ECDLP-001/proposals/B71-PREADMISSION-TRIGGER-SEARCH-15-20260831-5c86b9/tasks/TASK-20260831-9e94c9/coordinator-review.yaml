verified_claims:
  - id: A
    claim: >-
      knowledge/techniques/KN-TECH-73630e.md proves the canonical prime-to-p
      torsion lift is a group isomorphism carrying zero additional
      group-theoretic information, and the producer's application of it to
      the P1553 g_I/r_R object (candidate C6) is a genuinely new application,
      not already present in the source file.
    finding: confirmed
    files_checked:
      - 'knowledge/techniques/KN-TECH-73630e.md (full file: "Derivation" and "Consequences" sections)'
      - 'coordination/goals/GOAL-ECDLP-001/proposals/B71-PREADMISSION-TRIGGER-SEARCH-15-20260831-5c86b9/tasks/TASK-20260831-5c86b9/mechanism-card.yaml (candidate C6, lines ~749-807; screened_family_overlap note)'
    detail: >-
      KN-TECH-73630e.md's Derivation section states, word for word, that
      `red : E(Q_p) -> E(F_p)` restricted to prime-to-p torsion is a group
      isomorphism, that "the lift is information-theoretically empty," and
      that "nothing is learned that was not already available." This is
      exactly what mechanism-card.yaml's C6 gate_discharge and
      lossy_projection_test cite, without amplification: the producer's G2
      note explicitly scopes the finding to "no exact public computation
      from E, P, Q built on this lift alone," matching the source's own
      Scope labels section ("Sharpens one cell of one attack family; it is
      not a statement about ECDLP hardness and not a lower bound"). The
      source file never mentions g_I, r_R, P1553, labels, or a resultant
      anywhere; it is written entirely about the raw E, S, T ECDLP object.
      Applying its group-isomorphism argument to r_R (on the premise that a
      resultant/matching-based construction is itself a group-theoretic
      invariant) is therefore a genuinely new argument supplied by this
      round, correctly disclosed as such in mechanism-card.yaml's
      screened_family_overlap field for C6 ("applied here for the first time
      to this specific object").

