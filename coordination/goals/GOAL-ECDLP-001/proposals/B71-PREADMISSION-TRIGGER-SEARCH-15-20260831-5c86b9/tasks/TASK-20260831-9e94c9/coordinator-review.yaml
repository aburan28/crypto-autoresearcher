  - id: C
    claim: >-
      This round's tropical/ultrametric candidate C3 (arXiv:1107.1162)
      mirrors round 14's C6 (scalar count, wrong output type) via a
      genuinely distinct non-archimedean mechanism, not a relabeling.
    finding: confirmed
    files_checked:
      - 'coordination/goals/GOAL-ECDLP-001/proposals/B71-PREADMISSION-TRIGGER-SEARCH-14-20260830-d7bdeb/tasks/TASK-20260830-d7bdeb/mechanism-card.yaml (C6_PROBABILISTIC_SATURATION_FINITE_FIELD_COUNTING, lines 902-941)'
      - 'coordination/.../TASK-20260831-5c86b9/mechanism-card.yaml (C3_PADIC_TROPICAL_HENSEL_ROOT_COUNTING, lines ~637-673)'
      - 'coordination/.../TASK-20260831-5c86b9/proof-search-map.yaml (observation_collision_search.current_result)'
    detail: >-
      Round 14's C6 is probabilistic ideal saturation over finite fields
      (Hauenstein-Helmer, arXiv:1908.06020): a randomized, Schwartz-Zippel-
      style saturation test for counting solutions outside a base locus.
      This round's C3 is a deterministic tropical reformulation of Hensel's
      lemma (Rojas et al., arXiv:1107.1162): a first-digit-map bijection
      argument over the residue field giving an explicit count formula via
      Newton-polytope combinatorics. Both fail G1 on the identical
      output-type ground (a scalar count of solutions, not a remainder
      transducer or labelled correspondence), but the mechanisms
      (randomized numerical saturation vs. deterministic non-archimedean
      valuation/tropical geometry) are genuinely different fields of
      mathematics with no shared machinery. This is a same-failure-mode,
      different-mechanism finding, confirmed by direct side-by-side reading
      of both source files, not a relabeling of round 14's candidate.

