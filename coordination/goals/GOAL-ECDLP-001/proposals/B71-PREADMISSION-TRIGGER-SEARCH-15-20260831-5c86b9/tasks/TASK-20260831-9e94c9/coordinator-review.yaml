  - id: H
    claim: >-
      The refinement-not-discovery categorical argument (obstruction a) --
      that Hensel-Newton lifting requires an already-known approximate root
      as its seed, and z_R's construction is a discovery problem with no
      known root to refine -- holds up as a genuine, checkable claim about
      how Hensel lifting works, on its own mathematical merits, independent
      of the citation.
    finding: confirmed
    detail: >-
      This is standard, well-established mathematics and does not overreach.
      Hensel's lemma, in every classical and generalized (multivariate,
      relaxed, triangular-set) form, is a local implicit-function-theorem-
      style statement: given a point a with f(a) ~= 0 mod p^k and a
      non-degenerate (invertible Jacobian mod p) linearization at a, there
      is a unique refinement to precision p^(k+1), p^(k+2), etc. It contains
      no mechanism for producing a itself when none is known -- it is a
      contraction/refinement map on an already-populated neighbourhood, not
      a global root-enumeration procedure, exactly as the retrieved lirmm.fr
      source states in its own words. The one gap worth naming explicitly
      (not raised by the producer in this exact form, but checked here as
      part of this sanity check): one could imagine using Hensel lifting as
      a discovery aid by brute-force testing each of the Theta(B) public
      labels as a candidate seed. This does not rescue the method, because
      constructing a valid seed for the complete-chart intersection system
      at a specific label requires already knowing that label extends to a
      genuine intersection point mod p -- exactly the discovery question
      z_R's construction is trying to answer, so seed construction is
      circular with the target question itself, not merely expensive. The
      producer's categorical argument therefore holds under this additional
      stress-test and does not overreach.

citation_precision_flags:
  - id: CPF-1
    severity: informational
    subject: 'eprint.iacr.org/2026/137 quote attribution'
    finding: >-
      This review's own task brief (item 2a) stated that the quote "not a
      root-finding algorithm... it assumes you already possess an initial
      approximate solution modulo p" was confirmed from eprint.iacr.org/2026/137.
      On independent reading of the producer's actual artifacts, this is
      not accurate: mechanism-card.yaml (component_b, RELAXED_PADIC_HENSEL_ALGEBRAIC_SYSTEMS,
      lines ~310-332) attributes that exact quote to a different retrieved
      source, the lirmm.fr PDF ("Relaxed p-adic Hensel lifting for algebraic
      systems," Berthomieu/Lebreton/Mourrain lineage), used to close
      candidate C2 (refinement-not-discovery). eprint.iacr.org/2026/137 is
      used only for candidate C1 (black-box Hensel lifting of an
      elliptic-curve-endomorphism trace), which is closed on an unrelated
      ground (an unestablished evaluation circuit plus a Hasse-bound-vs-
      Theta(B)-object scale mismatch, G2/G3/G8). This is a briefing-level
      imprecision in the review instructions, not a producer citation
      error; the producer's own artifacts attribute the quote correctly and
      consistently across mechanism-card.yaml, proof-search-map.yaml, and
      source-novelty-audit.yaml. Recorded so future citations of this round
      attribute the quote to its correct source.
  - id: CPF-2
    severity: informational
    subject: 'eprint.iacr.org/2026/137 live-URL verifiability'
    finding: >-
      eprint.iacr.org/2026/137 is consistently labeled provenance: retrieved
      (never recalled) across all three producer YAML files, and
      runtime-session-receipt.json's activity log records an actual WebFetch
      call against it ("eprint.iacr.org/2026/137 (full mechanism summary)").
      This review has no Bash or web-browsing tool and cannot independently
      confirm the URL resolves to the described 2026 content on the live
      internet; per the task's own instruction this is checked for internal
      consistency and provenance discipline only, both of which pass (label
      correctly retrieved rather than recalled, corroborated by the
      session's own logged tool call). This round's overall
      scoped_no_candidate disposition does not depend on this citation
      alone: even disregarding it entirely, C1 would still fail on round
      13's independently-already-open small-circuit-complexity question,
      and C2 through C6 close on independent grounds citing different
      sources. Flagged as a disclosed verification limit of this review,
      not a finding against the producer.
  - id: CPF-3
    severity: informational
    subject: 'candidate C4 provenance granularity'
    finding: >-
      mechanism-card.yaml labels candidate C4 (classical modular Hensel
      lifting) provenance: retrieved at the candidate level, but its
      source_refs mix one genuinely retrieved item this round
      (arXiv:1801.03161, WebFetch abstract) with two textbook/well-
      established references (von zur Gathen and Gerhard; Gao) that were
      not independently fetched this round. source-novelty-audit.yaml's
      provenance_policy paragraph discloses this practice at the audit
      level ("recalled-flavoured items... alongside at least one retrieved
      primary source corroborating each"), consistent with AGENTS.md's rule
      that a recalled fact may stand only when an agent that actually
      opened a source corroborates it in the same record. The load-bearing
      conclusion (classical Hensel lifting's cheap-mod-p-to-expensive-Z/Q
      direction) is itself elementary, uncontroversial computer algebra and
      is independently corroborated by the genuinely retrieved
      arXiv:1801.03161 abstract, so C4's disposition does not rest on an
      undisclosed recalled source alone. Recommend future rounds record
      provenance per source_ref rather than one blanket label per
      candidate, to remove this ambiguity at the point of reading rather
      than requiring a cross-reference to the audit-level policy note.
  - id: CPF-4
    severity: informational
    subject: 'scope of the "p-adic exactness bridges cleanly" positive finding'
    finding: >-
      The round's headline positive finding -- that p-adic exactness
      "cleanly" avoids round 14's archimedean field-mismatch obstruction --
      is demonstrated only for candidates C1 and C6 specifically (a
      Hasse-bounded scalar with an evaluation circuit, and a canonical
      torsion-point lift, respectively), not established as a general
      property of p-adic methods for polynomial system solving in general.
      mechanism-card.yaml's own decision_summary scopes this reasonably
      ("confirming that p-adic machinery is a genuinely different... in
      this one specific respect strictly better, paradigm"), but a future
      citation of this round's "exactness bridges" finding should preserve
      the C1/C6-specific scope rather than generalize it, since C2-C4 are
      closed on grounds unrelated to exactness (seed circularity, wrong
      cost direction) and do not themselves confirm or refute the general
      claim.

