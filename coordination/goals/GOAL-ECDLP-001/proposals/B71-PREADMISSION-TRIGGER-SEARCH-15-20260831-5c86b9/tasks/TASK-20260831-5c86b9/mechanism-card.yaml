trigger_shapes:
  shape_a_remainder_transducer: >-
    A typed public P1553 target-local remainder transducer for r_R mod g_I:
    an exact computation, from E, P, and Q alone, of the remainder of the
    complete-chart intersection resultant r_R upon division by the
    squarefree label polynomial g_I, with no roots, factors, witnesses, or
    Groebner bases of r_R or the underlying system, inside the B^(5/4)
    interface budget.
  shape_b_dyadic_unit_product: >-
    The exact dyadic subinterval unit-product interface: a public
    construction over the frozen mixed-radix deck/interval geometry that
    supplies the unit-product step the two-restriction and three-deck
    corrections leave as the surviving coordinate-aware interface. Not
    reached by any candidate this round: no p-adic Hensel-lifting,
    tropical-counting, modular-reconstruction, rigid-analytic, or
    torsion-lift construction found below references, is typed to, or bears
    on the deck/interval geometry at all; recorded as unsupplied rather than
    searched against a specific match, exactly as in rounds eleven through
    fourteen.

scope_components:
  component_a_blackbox_padic_hensel_lifting_implicit_systems:
    what_was_searched: >-
      Bounded retrieval over Hensel lifting for implicitly-given (black-box,
      arithmetic-circuit-evaluable) p-adic-analytic systems, aimed at whether
      a public evaluation oracle for some quantity tied to r_R could be
      Hensel-lifted at bounded precision the way an elliptic-curve
      endomorphism's trace is lifted and exactly recovered.
    searches_performed:
      - query: 'p-adic homotopy continuation polynomial system solving'
        instrument: WebSearch
        results: 10 links surfaced; general complex-continuation literature dominant, no p-adic-specific hit beyond passing mentions
      - query: 'Hensel lifting resultant computation modular algorithm'
        instrument: WebSearch
        results: 10 links surfaced, including a genuinely new (2026) elliptic-curve-specific hit, eprint.iacr.org/2026/137
      - query: 'full-text fetch of eprint.iacr.org/2026/137'
        instrument: WebFetch
        results: 1 (mechanism, seed, precision, and reduction summary read in full)
    objects_read:
      - id: HENSEL_BLACKBOX_EC_TRACE
        name: >-
          Hensel-lifting black-box algorithms and fast trace computation for
          elliptic-curve endomorphisms (eprint.iacr.org/2026/137)
        source_refs: [eprint.iacr.org/2026/137]
        assessment: >-
          A genuinely new (2026), on-topic, elliptic-curve-specific
          p-adic-Hensel-lifting result. Mechanism: given an endomorphism
          represented as a composition of Velu, sqrt-elu, modular, or radical
          isogenies (an efficiently evaluable arithmetic circuit, needing no
          explicit closed-form equation), Hensel-lift an approximate value of
          its trace to Z_q via a p-adic Newton-type corrector using ONLY the
          circuit as an evaluation oracle, to precision bounded by the Hasse
          interval (O(log q) p-adic digits suffice because the true trace is
          one of only O(sqrt(q)) integers), then reduce EXACTLY back to F_q.
          This is the sharpest possible confirmation available this round
          that p-adic exactness genuinely bridges to F_p/F_q for a BOUNDED
          scalar quantity with a public, efficiently evaluable circuit.
          Instantiated to the frozen setting, it would require (a) an
          efficient black-box circuit evaluating some quantity tied to r_R at
          a candidate label or aggregate of labels, and (b) that quantity
          being bounded to O(polylog B) p-adic digits the way the trace is
          bounded by Hasse. Neither holds: (a) no such circuit for r_R or the
          complete-chart system is established -- this is exactly round
          thirteen's still-open small-circuit-complexity question, preserved
          as an open resource, not solved or assumed here; (b) r_R mod g_I is
          a degree-less-than-B polynomial (equivalently the full
          Theta(B)-length extendibility vector over all labels), not a single
          Hasse-bounded scalar, so even granting a hypothetical circuit, the
          O(1)-extraction trick that makes trace computation cheap does not
          transfer -- reconstructing the full object would need on the order
          of B independent bounded extractions, not one.
    resource_check_answer:
      examined: true
      reading_found: true
      what_was_examined: >-
        knowledge/ and inputs/ grepped (case-insensitive) for "Hensel",
        "p-adic", "padic", "Z_p", "Q_p"; every on-topic hit opened; H-CREP-001
        and EXP-CREP-001/specification.yaml re-read for the exact g_I/r_R/z_R
        definitions and ROUTE-08's declared exponent.
      answer: >-
        knowledge/techniques/KN-TECH-033.md (anomalous/trace-one curves and
        the Satoh-Araki Fermat-quotient/p-adic route) and
        knowledge/techniques/KN-TECH-73630e.md (canonical prime-to-p torsion
        lifting) are genuinely on-topic internal records; the latter is
        promoted to its own candidate below (C6) because it bears directly
        and decisively on this round's question. Neither internal record
        is typed to the P1553 g_I/r_R construction specifically; both concern
        the raw ECDLP-lifting question (a different, though related, object).

  component_b_multivariate_relaxed_padic_hensel_newton_lifting:
    what_was_searched: >-
      Bounded retrieval over multivariate and relaxed p-adic Hensel-Newton
      lifting for algebraic and triangular systems, aimed at whether the
      complete-chart intersection system's solutions (the intersection points
      whose existence determines label extendibility) could be discovered
      via, rather than merely refined by, a p-adic lifting process.
    searches_performed:
      - query: 'multivariate Hensel lifting triangular sets p-adic precision Caruso Vaccon'
        instrument: WebSearch
        results: 10 links surfaced, including 'Relaxed p-adic Hensel lifting for algebraic systems' (Berthomieu et al.) and 'Relaxed Hensel lifting of triangular sets'
      - query: 'full-text fetch of a relaxed-p-adic-Hensel-lifting-for-algebraic-systems PDF (lirmm.fr)'
        instrument: WebFetch
        results: 1 (input/output/complexity summary read)
      - query: 'abstract fetch of the ScienceDirect record for Relaxed Hensel lifting of triangular sets'
        instrument: WebFetch
        results: 0 (HTTP 403; recorded as an infrastructure limitation, not evidence -- see retrieval_instrument note)
    objects_read:
      - id: RELAXED_PADIC_HENSEL_ALGEBRAIC_SYSTEMS
        name: >-
          Relaxed p-adic Hensel lifting for algebraic systems, and the
          closely related Relaxed Hensel lifting of triangular sets
          (Berthomieu, Lebreton, Mourrain and coauthors)
        source_refs: ['lirmm.fr/~lebreton PDF: RelaxedAlgebraicHenselLifting.pdf', 'sciencedirect.com/science/article/pii/S0747717114000807 (403, unread)']
        assessment: >-
          Confirms, directly and explicitly from the retrieved PDF, that the
          method REQUIRES an existing root of the target algebraic system
          modulo p as its starting input, and progressively refines that
          root's precision to p^2, p^3, and so on. The retrieved summary
          states this without ambiguity: 'This is not a root-finding
          algorithm in the traditional sense -- it assumes you already
          possess an initial approximate solution modulo p and iteratively
          enhances its accuracy.' Applied to the frozen setting, the required
          seed is an actual point of the complete-chart intersection system
          near a candidate label -- precisely a structural witness that the
          label already extends, which is exactly what the amended G2 clause
          excludes and exactly what has not been publicly constructed. This
          is the source of this round's obstruction (iii)
          (refinement-not-discovery), stated in full under
          critical_directional_fact_established_this_round above.
    resource_check_answer:
      examined: true
      reading_found: false
      what_was_examined: >-
        knowledge/ and inputs/ grepped for "triangular set", "relaxed
        lifting", "Newton-Hensel", "Berthomieu", "Lebreton", "Mourrain";
        H-CREP-001.yaml re-read to confirm the complete-chart intersection
        system is the object any seed would need to solve mod p.
      answer: No corpus record references relaxed p-adic algebraic-system lifting or multivariate triangular-set Hensel lifting specifically.

  component_c_tropical_hensel_ultrametric_root_counting:
    what_was_searched: >-
      Bounded retrieval over tropical/ultrametric reformulations of Hensel's
      lemma for multivariate root counting, aimed at a genuinely
      finite-field/p-adic-native (non-archimedean) alternative that might
      supply a compact object bearing on z_R's support without floating-point
      structure, matching the dispatch's own honesty mandate to check p-adic
      exactness carefully rather than assume it helps.
    searches_performed:
      - query: 'tropical Newton polygon p-adic root counting polynomial system Rojas Bihan'
        instrument: WebSearch
        results: 9 links surfaced, including 'Multivariate ultrametric root counting' (Rojas et al., arXiv:1107.1162)
      - query: 'abstract fetch of arxiv.org/abs/1107.1162'
        instrument: WebFetch
        results: 1 (abstract and method summary read)
    objects_read:
      - id: MULTIVARIATE_ULTRAMETRIC_ROOT_COUNTING
        name: Multivariate ultrametric root counting (arXiv:1107.1162)
        source_refs: [arXiv:1107.1162]
        assessment: >-
          A genuinely on-topic, non-archimedean-native technique: the paper
          reformulates Hensel's lemma in the language of tropical geometry
          and gives an explicit FORMULA FOR THE NUMBER of solutions of
          prescribed valuation for a 'regular' system, via a first-digit map
          from (K*)^n to (residue field*)^n that is a bijection under stated
          genericity conditions. This is genuinely non-archimedean by design
          (working with a discrete valuation and its residue field, which for
          our setting is exactly F_p), so it escapes round fourteen's
          exactness/field-mismatch obstruction entirely, for a p-adic reason
          distinct from round fourteen's C6's finite-field-native reason. Its
          OUTPUT, however, is a COUNT of solutions with a given valuation
          profile -- not the actual remainder polynomial r_R mod g_I, not a
          per-label residue value, and not a labelled correspondence. Many
          distinct remainder polynomials share the same support-count, so
          even a free, exact count of extendible labels (deg(z_R)) would not
          determine r_R mod g_I, mirroring round fourteen's C6 verdict via a
          structurally different, non-duplicate mechanism (tropical Hensel
          reformulation and Newton-polytope combinatorics, not randomized
          ideal saturation).
    resource_check_answer:
      examined: true
      reading_found: false
      what_was_examined: >-
        knowledge/ and inputs/ grepped for "tropical", "Newton polygon",
        "ultrametric", "Rojas", "Bihan"; H-CREP-001.yaml re-read to confirm
        deg(z_R) is a count that this technique's output type could in
        principle supply, and that a count alone does not determine r_R mod
        g_I.
      answer: No corpus record references tropical/ultrametric root counting or Rojas-Bihan's line of work.

  component_d_classical_modular_hensel_lifting_reconstruction:
    what_was_searched: >-
      Bounded retrieval over classical computer-algebra Hensel lifting for
      exact GCD, resultant, and factorization reconstruction from modular
      (mod-p) images, aimed at whether the standard direction of this
      machinery (mod-p cheap, lift to Z/Q expensive) has any bearing, direct
      or inverted, on a setting whose target answer is ALREADY an F_p object.
    searches_performed:
      - query: 'Hensel lifting resultant computation modular algorithm'
        instrument: WebSearch
        results: 10 links surfaced, dominated by classical CAS references (von zur Gathen-Gerhard, Kluesner-Monagan, Gao)
      - query: 'Hensel lifting factorization polynomials over finite field complexity cost bound'
        instrument: WebSearch
        results: 9 links surfaced, confirming the standard modular-to-integer lifting direction and its known complexity form
      - query: 'abstract fetch of arxiv.org/abs/1801.03161'
        instrument: WebFetch
        results: 1 (problem statement and direction read)
    objects_read:
      - id: CLASSICAL_MODULAR_HENSEL_RECONSTRUCTION
        name: >-
          Classical modular Hensel lifting for exact GCD/resultant/
          factorization reconstruction (von zur Gathen and Gerhard, Modern
          Computer Algebra, ch. on Hensel lifting and factoring polynomials;
          Gao, bivariate Hensel lifting and factorisation over finite fields;
          Kluesner and Monagan, Resolving zero-divisors using Hensel lifting,
          arXiv:1801.03161)
        source_refs: [arXiv:1801.03161, 'von zur Gathen and Gerhard, Modern Computer Algebra (textbook, ch. 15)', 'Gao, Hensel lifting and bivariate polynomial factorisation over finite fields']
        assessment: >-
          Every retrieved and recalled-but-textbook-established source
          confirms the same standard direction: these algorithms take a
          CHEAP factorization or GCD computation modulo one (or several)
          small primes as their INPUT and use Hensel lifting (single-prime,
          increasing precision) or Chinese remaindering (multiple primes) to
          reconstruct an EXPENSIVE exact answer over Z or Q that would
          otherwise require prohibitively large integer coefficient
          arithmetic. Kluesner-Monagan's specific contribution is resolving
          zero-divisor obstructions in this lifting process for GCDs modulo a
          radical triangular set over Q. This is the WRONG DIRECTION for the
          frozen setting: H-CREP-001's own cost model is already a generic
          prime-field family, so the sought answer r_R mod g_I is already an
          F_p object, not an integer or rational one awaiting reconstruction.
          The bottleneck this machinery exists to avoid (huge exact integer
          coefficients) is not our bottleneck; our bottleneck is that the
          SINGLE mod-p computation is itself expensive (Theta(B^3), ROUTE-01/
          ROUTE-08's own materialization), and this machinery takes that
          single mod-p step's cost entirely for granted. Applying it here
          adds a reconstruction step we do not need on top of the very
          computation whose cost is the open question.
    resource_check_answer:
      examined: true
      reading_found: false
      what_was_examined: >-
        knowledge/ and inputs/ grepped for "modular GCD", "Chinese
        remainder", "Hensel lifting" jointly with "resultant"; H-CREP-001's
        cost-model assumption re-read to confirm the frozen ring is already a
        prime field, not Z or Q.
      answer: No corpus record applies classical modular Hensel lifting to the P1553 g_I/r_R object specifically.

  component_e_rigid_analytic_berkovich_continuation:
    what_was_searched: >-
      Bounded retrieval over rigid-analytic (Tate) and Berkovich-space
      continuation or potential-theory techniques, aimed squarely at the
      dispatch's named scope item (a p-adic analogue of the geometric
      machinery underlying complex numerical algebraic geometry).
    searches_performed:
      - query: '"p-adic numerical algebraic geometry" witness set Berkovich rigid analytic continuation'
        instrument: WebSearch
        results: 9 links surfaced, all foundational pure-mathematics references (Berkovich's own work, p-adic potential theory on Berkovich curves, radius of convergence of p-adic connections); no computational algorithm retrieved
    objects_read:
      - id: BERKOVICH_RIGID_ANALYTIC_FOUNDATIONS
        name: >-
          Foundational rigid-analytic and Berkovich-space theory (Berkovich's
          own theory; Baker's notes on Berkovich analytic spaces and p-adic
          potential theory; work on the radius of convergence of p-adic
