research_question: >-
  Does any actual recurrence, circuit identity, or retrieved theorem from
  p-adic methods for polynomial system solving -- Hensel's lemma and its
  multivariate/simultaneous generalizations, p-adic Newton iteration, a p-adic
  analogue of numerical algebraic geometry, rigid-analytic or Berkovich-space
  continuation, or a p-adic analogue of witness-set or monodromy methods --
  instantiate to the frozen P1553 elliptic setting as (a) a typed public
  target-local remainder transducer for r_R mod g_I, or (b) the exact dyadic
  subinterval unit-product interface, passing every item of the frozen
  pre-admission gate? This round's paradigm is the EXACT analogue of round
  fourteen's continuous/floating-point one: Z_p and Q_p are p-adically
  complete but arithmetic in them is exact, not approximate, and the residue
  field of Z_p is literally F_p, so the round's mandatory question is whether
  round fourteen's exactness/field-mismatch obstruction genuinely dissolves
  here, and if so what obstruction (if any) replaces it.

search_scope:
  frozen_gate_source: >-
    The live next_action of ledger/goals/GOAL-ECDLP-001/goal.yaml (read in
    full, including next_action_superseded_20260828_standing_directive, which
    states the frozen gate verbatim) as amended by
    preadmission_gate_g2_g8_wording_amendment_20260830 (read in full,
    including its scope-and-limits block), whose corrected G2/G8 wording is
    used for this round's itemization per the dispatch handoff's explicit
    instruction. G1 and G3 through G7 are unchanged from the original wording
    per the amendment's own scope note.
  frozen_gate_items:
    - id: G1_ACTUAL_TRIGGER_OBJECT
      text: >-
        The trigger must be an actual recurrence, circuit identity, or
        retrieved theorem, not the assertion that a specialized circuit may
        exist.
    - id: G2_FROZEN_SETTING_AND_PUBLIC_CONSTRUCTION_AMENDED
      text: >-
        Before any queue opens it must freeze rings, bases, CRT components,
        interval geometry, and the public g_I and r_R construction, and
        supply an exact computation from E, P, and Q that imports no root,
        factor, Groebner basis, or other structural witness of r_R or of the
        underlying complete-chart intersection system (g_I's own
        already-public defining roots -- the fifth-occurrence labels -- are
        exempt); any internal data structure, cache, or table used by the
        construction is permitted provided its full construction and storage
        cost is declared and counted within the same B^(9/4)
        preprocessing / B^(5/4) online budget the frozen verifier already
        checks (V1, V3, V6); an artifact is excluded by what it COSTS and
        what SECRET-DERIVED information it carries, never by what it is
        conventionally named.
      note: >-
        This round's own contribution is that the amended clause's EXACTNESS
        sub-clause, which was the dispositive failure point for every round-14
        candidate, is genuinely satisfiable by a p-adic construction (Z_p
        reduces to F_p canonically and exactly, unlike C or R); the WITNESS
        sub-clause is therefore the operative failure point for most
        candidates below, in one of several distinct forms.
    - id: G3_FULL_COST_ENUMERATION
      text: >-
        Enumerate state, update maps, degrees, ranks, nonzeros, coefficient
        growth, live storage, traffic, build/query split, and amortization
        within the inherited B^(5/4) interface budget and strict end-to-end
        o(ell^(1/2)) time, memory, and data.
    - id: G4_LINEAGE_AND_MULTIPLICITY
      text: Preserve lineage and multiplicity on coalesced and nonreduced fibres.
    - id: G5_Q_VS_MINUS_Q
      text: Distinguish Q from -Q.
    - id: G6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
      text: Yield known P and Q coefficients with invertible Q coefficient.
    - id: G7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
      text: Support output-sensitive source unranking.
    - id: G8_NOT_ALREADY_COSTED_ROUTE_AMENDED
      text: >-
        For each already-costed norm, resultant, quotient, full
        power-projection, represented-table, or witness-conditioned route
        named in the frozen route set (EXP-CREP-001), state the candidate's
        declared cost exponent for the same construction step; a candidate
        sharing a route's algorithmic family or backend is excluded under
        this item ONLY IF its own declared cost is dominated by (greater
        than or equal to) that route's already-measured exponent -- sharing
        a family name is not itself disqualifying, and a candidate that
        independently argues and cost-certifies a strictly smaller exponent
        within an already-named family must be evaluated on that certificate
        under G3, not rejected by category alone under G8.
  p1553_object_source: >-
    H-CREP-001 (internal, read in full this round): g_I is the squarefree
    label polynomial whose roots are the public fifth-occurrence labels
    (degree Theta(B)); r_R is the complete-chart intersection resultant
    (degree Theta(B^3) by ROUTE-08's own declared representation convention;
    see round fourteen's own qualification of this figure, which this round
    inherits unchanged); z_R = gcd(g_I, r_R) is the target-label support
    factor. EXP-CREP-001's frozen_route_set names ROUTE-01 through ROUTE-08;
    ROUTE-08's package.json node n2 (materialize_resultant_coefficients)
    declares cost_exponent_in_B 3, the numerical anchor every route
    comparison below reuses, exactly as rounds twelve through fourteen did.
    H-CREP-001's own cost-model assumption fixes the frozen ring as a generic
    ordinary prime-field elliptic curve family: the target answer r_R mod g_I
    is ALREADY an F_p-valued object, not an integer or rational one awaiting
    reconstruction from modular images -- a fact load-bearing for candidate C4
    below.
  critical_directional_fact_established_this_round: >-
    Round fourteen established two obstructions for complex/real numerical
    continuation: (i) a degree-floor obstruction (witness-set path counts
    lower-bounded by the ambient variety's degree, Theta(B^3)) and (ii) an
    exactness/field-mismatch obstruction (complex continuation, even certified
    by Smale's alpha theory, bridges only to characteristic-zero exactness,
    never to F_p). This round's mandatory question was whether p-adic
    machinery, being exact rather than approximate, genuinely escapes (ii).
    THE ANSWER IS YES, CLEANLY, FOR THE FIRST TIME THIS ROUND: Z_p's residue
    field is literally F_p, so reduction mod p is a canonical, cost-free,
    information-preserving exact map with no non-canonical
    characteristic-zero-lift choice and no open bit-precision blow-up -- every
    candidate below that reaches a reduction step reaches it for free and
    exactly. But every candidate this round instead fails on one of THREE
    further obstructions, one of which is genuinely new and, on inspection,
    sharper than anything rounds seven through fourteen produced. (iii) THE
    REFINEMENT-NOT-DISCOVERY OBSTRUCTION, new this round: every retrieved
    multivariate p-adic Hensel/Newton-lifting technique for algebraic systems
    is, by construction, a LOCAL PRECISION-REFINEMENT operator -- it takes an
    ALREADY-IDENTIFIED approximate root of the target system modulo p and
    extends its precision -- and is definitionally NOT a global
    search/enumeration operator. Complex numerical continuation (round
    fourteen's C1-C4) can enumerate every root of a system from a GENERIC
    start system with zero prior knowledge of any specific root, which is what
    a witness set supplies; multivariate Hensel lifting has no such
    capability at all. Constructing z_R is fundamentally a DISCOVERY problem
    (which of Theta(B) candidate labels extend to a genuine relation), not a
    refinement problem, so this method CLASS is a category mismatch for the
    required trigger shape independent of any cost analysis -- a structurally
    cleaner, more decisive negative than round fourteen's cost-based degree
    floor. (iv) THE WRONG-DIRECTION MISMATCH, new this round: classical
    computer-algebra Hensel lifting (used for exact GCD, resultant, and
    factorization computation) takes a CHEAP mod-p computation as its base
    case and lifts UPWARD to reconstruct an EXPENSIVE exact integer or
    rational answer; the frozen setting already wants only the mod-p answer
    (the ring is already a prime field), so this machinery targets the
    opposite bottleneck from the one that makes r_R mod g_I hard. (v) an
    INFORMATION-THEORETIC-EMPTINESS obstruction supplied by this program's own
    internal corpus (KN-TECH-73630e): the one candidate this round that is
    genuinely public, witness-free, AND exact (the canonical prime-to-p
    torsion lift of E, P, Q, and every label into E(Q_p)) is independently,
    rigorously PROVEN to carry zero additional group-theoretic information --
    the lift is an isomorphic copy of the same finite structure -- so even
    this cleanest-possible p-adic construction cannot ease the combinatorial
    matching question z_R's construction actually requires, leaving only a
    named, still-open, non-group-theoretic coordinate/valuation question
    (KN-OPEN-3417fc) that this round did not resolve or even test.
  post_screen_revisit_condition: >-
    A concrete typed public P1553 remainder or dyadic unit-product
    transducer (updated_at_note_frobenius_fourier_terminal_rerank_20260824).
    No candidate below is specific to any of the six terminal pre-admission
    packets in the sense the revisit condition requires; none is re-run.
  disjoint_scope_statement: >-
    Rounds seven through thirteen searched exact/symbolic coefficient
    arithmetic across six literatures (see round fourteen's own
    disjoint_scope_statement for the itemization, unchanged and not repeated
    here). Round fourteen searched CONTINUOUS, floating-point (or
    fixed-precision) path tracking over C or R -- witness sets, monodromy
    breakup, coefficient-parameter continuation, pseudo-witness-set
    elimination, alpha-theory certification, and probabilistic saturation.
    This round searches a genuinely third paradigm: EXACT, non-archimedean
    p-adic computation over Z_p/Q_p -- black-box Hensel lifting of implicitly
    given p-adic-analytic systems, multivariate/relaxed p-adic Hensel-Newton
    lifting of algebraic (triangular) systems, a tropical reformulation of
    Hensel's lemma for ultrametric root counting, classical modular Hensel
    lifting for exact GCD/resultant/factorization reconstruction, rigid-
    analytic/Berkovich-space continuation, and the canonical prime-to-p
    torsion lift already derived internally by this program for the raw
    ECDLP-lifting question. No candidate below re-derives any round
    seven-through-fourteen candidate; the explicit collision check against
    round fourteen's six candidates is recorded in proof-search-map.yaml's
    observation_collision_search.
  retrieval_instrument: >-
    Bounded network retrieval via the WebSearch tool (general web search) and
