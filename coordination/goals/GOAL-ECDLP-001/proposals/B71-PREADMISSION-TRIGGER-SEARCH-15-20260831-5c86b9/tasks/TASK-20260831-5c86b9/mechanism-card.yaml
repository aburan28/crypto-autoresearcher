title: >-
  Round-15 bounded pre-admission trigger search: p-adic (Hensel-lifting)
  reinterpretation of continuation over Z_p/Q_p (black-box Hensel lifting of
  implicit systems, multivariate/relaxed p-adic Hensel-Newton lifting of
  algebraic systems, tropical/ultrametric Hensel-lemma root counting, classical
  modular Hensel lifting for exact reconstruction, rigid-analytic/Berkovich
  continuation, and the internal canonical prime-to-p torsion lift) for a
