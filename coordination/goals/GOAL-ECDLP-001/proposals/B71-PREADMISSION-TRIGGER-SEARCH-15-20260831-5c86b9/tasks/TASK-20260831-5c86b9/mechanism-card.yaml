controls_before_belief:
  screen_is_its_own_control: >-
    For every candidate carrying G1, the screen checked (i) that the
    computation is genuinely public and that no ECDLP-equivalent information
    is hidden behind p-adic vocabulary -- C2's seed-equals-witness identity
    and C6's information-theoretic-emptiness were both checked against the
    retrieved/derived source text directly, not accepted at face value; (ii)
    the quantifier order (all frozen objects fixed before any witness or
    presupposed root is observed); and (iii) the already-costed-route
    exclusion as a named, route-specific, cost-quantified check per the
    amended G8 wording.
  public_computation_check: >-
    C1's and C4's seeds import no external witness in the literal sense (no
    root/factor/Groebner basis of g_I/r_R), but C1's prerequisite circuit is
    unestablished and C4's premise (cheap mod-p base case) is inapplicable.
    C2's seed IS, definitionally, a structural witness of the complete-chart
    system. C3 and C5 supply no construction of the required shape at all
    (C3 on output type, C5 on total absence of a retrieved algorithm). C6's
    computation is genuinely public, witness-free, and exact -- the cleanest
    result this round -- but is independently proven unable to carry the
    needed information.
  quantifier_order_check: >-
    Required order: freeze the P1553 rings, bases, CRT components, and
    interval geometry; fix the public g_I and r_R construction; name the
    trigger object T; receive public E, P, Q; construct T's p-adic
    representation from E, P, Q alone at declared, bounded cost; recover an
    EXACT value in F_p from it; compute r_R mod g_I (or the dyadic
    unit-product step) from that exact value; enumerate the full cost and
    verify the B^(5/4)/o(ell^(1/2)) bounds. Forbidden order: assume an
    unestablished evaluation circuit and only then ask whether Hensel lifting
    can cheaply extract a bounded scalar from it (C1); require an
    already-known root of the target system as the lifting seed, i.e. solve
    the discovery problem before the method can even start (C2); treat a
    mod-p computation as a free base case for a reconstruction the frozen
    setting does not need (C4); or compute a scalar count and treat it as if
    it were the remainder transducer itself (C3). Every candidate this round
    violates the required order in one of these ways; C5 never reaches an
    algorithm to check the order against; C6 satisfies the order fully up to
    the recovery step but the recovered object is proven information-free
    for the required purpose.
  already_costed_route_exclusion: >-
    Named, route-specific, cost-quantified check per the amended G8 wording:
    C1's hypothetical circuit-based extraction, even granted, is not
    certified below ROUTE-05's or ROUTE-08's declared exponents; C2 never
    reaches a cost comparison because it never reaches a construction; C3
    does not reach G8 because G1's output-type failure is dispositive; C4
    exactly reduces to ROUTE-01/ROUTE-08's declared exponent 3, with a strict
    cost increase if performed at all; C5 does not reach G8 because no
    algorithm was retrieved; C6 has no construction to compare. This
    discharges the dispatch's mandatory G8 comparison, under the amended
    cost-dominance wording, for every candidate this round.

lossy_projection_test_summary: >-
  C1's tracked object (a hypothetical bounded p-adic digit-string for some
  r_R-related scalar) would, if the prerequisite circuit existed, be lossy
  relative to r_R's full coefficient data for a SINGLE query, but the
  candidate cannot even reach the domain-of-definition question because the
  circuit itself is not established -- the test cannot be completed, only
  gated on an open prerequisite. C2's tracked object (a Hensel-refined p-adic
  approximate root) is NOT lossy at all relative to what must already be
  known to construct it: the seed already IS a full witness of the exact
  point being refined, so there is nothing to discard -- mirroring round
  fourteen's C3 (nothing discarded) but for a definitional rather than a
  cost reason. C3's tracked object (a tropical/valuation-based solution
  count) is genuinely, extremely lossy and IS reachable compatibly with F_p
  operations -- the one candidate this round to clear that half of the test,
  exactly as round fourteen's C6 did via a different mechanism -- but it
  discards precisely the information the trigger shape needs, so this is a
  lossy projection to the WRONG target object, not the right one. C4's
  tracked object (a lifted integer/rational coefficient vector) is not lossy
  relative to the mod-p data it is built from -- it is a strictly LARGER
  representation of the same information, the opposite of a projection,
  reflecting that this technique moves information in the wrong direction
  for this problem entirely. C5 supplies no tracked object to test (no
  algorithm was retrieved). C6's tracked object (the canonical torsion lift
  Ŝ) is lossy relative to nothing -- by the source's own theorem it is an
  ISOMORPHIC copy of S, i.e. a change of coordinates preserving every
  group-theoretic bit of information, which by this program's own
  lossy-projection-test standard is definitionally NOT a new projection at
  all (a change of coordinates, not a discard). This is the same verdict the
  inventor protocol names explicitly as disqualifying on its own, independent
  of cost: C6 fails the lossy-projection test at the most basic level, before
  any cost or witness question is even asked.

