provenance_policy: >-
  Every entry is labeled recalled, retrieved, kb, or internal. Retrieved
  means the source was surfaced and read (at least at search-snippet or
  abstract level, with construction-critical items opened via a direct
  WebFetch) in this task. kb means the source was resolved through grep to a
  committed knowledge/ corpus record and read in full. internal means a
  committed repository record (goal head, dispatch queue, frozen H-CREP-001
  hypothesis, EXP-CREP-001 specification, prior-round packets) read in this
  task. Recalled means no source was opened and the entry cannot support a
  coordinator decision, a known/adaptation novelty status, or a mathematical
  conclusion; the sole recalled-flavoured items this round are two textbook/
  well-established facts (the standard direction of classical modular Hensel
  lifting, and the Hasse bound) stated as general algebra/number-theory
  knowledge alongside at least one retrieved primary source corroborating
  each, per this program's discipline that no trigger-carrying statement
  rests on a recalled source alone. Every trigger-carrying statement in
  mechanism-card.yaml and proof-search-map.yaml rests on a retrieved, kb, or
  internal object actually opened this round.

retrieval_instrument_note: >-
  This round used WebSearch (general web search, returning titles, links,
  and an AI-synthesized summary of surfaced content) as the primary discovery
  instrument, and WebFetch (direct page/PDF retrieval and summarization) to
  open specific items for construction-critical detail, per the dispatch
  constraint's explicit permission of "your available web search/fetch
  tools" in addition to the arXiv export API. One WebFetch call
  (sciencedirect.com/science/article/pii/S0747717114000807) returned an HTTP
  403 and was not read; this is disclosed as an infrastructure limitation,
  not evidence, and its core claim (that the method requires a mod-p seed)
  is independently corroborated by the successfully fetched, closely related
  lirmm.fr PDF by an overlapping author lineage. No other transient error
  occurred this round.

