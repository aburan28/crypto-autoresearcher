novelty_dimensions:
  p1553_remainder_transducer_via_blackbox_padic_hensel_lifting:
    nearest_retrieved_work: 'Hensel-lifting black-box algorithms and fast trace computation for elliptic-curve endomorphisms (eprint.iacr.org/2026/137)'
    nearest_internal_work: 'Round thirteen''s own preserved_routes entry naming a genuinely new small-circuit-complexity argument for r_R mod g_I as an open resource.'
    proposed_delta: A cheap p-adic extraction of some r_R-related quantity via a black-box circuit evaluator, once such a circuit is exhibited.
    novelty_status: adaptation
    evidence: >-
      eprint.iacr.org/2026/137 is a genuinely new (2026), non-duplicate
      primary source establishing a real capability (bounded-precision
      black-box Hensel-lifting extraction of a Hasse-bounded scalar); its
      application to r_R/g_I is a direct adaptation that inherits round
      thirteen's still-open circuit prerequisite unchanged and additionally
      requires the target quantity to be similarly bounded, which r_R mod
      g_I is not, so no novel delta toward this round's required trigger is
      established.
  p1553_remainder_transducer_via_multivariate_padic_hensel_newton_lifting:
    nearest_retrieved_work: 'Relaxed p-adic Hensel lifting for algebraic systems; Relaxed Hensel lifting of triangular sets'
    nearest_internal_work: none found.
    proposed_delta: Discovery, via p-adic lifting, of which public labels extend to genuine intersection points.
    novelty_status: known
    evidence: >-
      The retrieved source states directly and unambiguously that the method
      requires an already-known mod-p root as its input and is a refinement,
      not a discovery, operator; this is the method's own well-established
      defining property (a direct restatement of Hensel's lemma itself:
      simple roots persist, they are not created), so no delta toward a
      discovery capability is or could be established by this literature.
