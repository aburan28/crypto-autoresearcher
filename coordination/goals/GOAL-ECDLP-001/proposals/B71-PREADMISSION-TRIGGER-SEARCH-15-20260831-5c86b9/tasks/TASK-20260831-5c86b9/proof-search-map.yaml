cheap_audits:
  exact_baseline_reproduction:
    applies: true
    baseline: >-
      The frozen gate items G1-G8 (amended G2/G8 wording) read from the goal
      head, the g_I/r_R/z_R definitions from H-CREP-001, and the eight frozen
      already-costed routes with ROUTE-08's exact declared exponent
      (cost_exponent_in_B 3, node materialize_resultant_coefficients) from
      EXP-CREP-001/specification.yaml.
    attack_plan:
      - restate each gate item G1-G8 verbatim, using the amended G2/G8 text
      - restate g_I, r_R, z_R and ROUTE-08's exact exponent certificate from H-CREP-001 and EXP-CREP-001/specification.yaml
      - for each of C1-C6, identify the exact lifting seed, precision requirement, exactness-recovery mechanism, and per-query cost, and mark each gate item present/absent with a named reason
      - confirm no candidate is admitted by assertion of a possibly-existing sub-Theta(B^3) construction, and confirm the exactness bridge is checked rather than assumed for every candidate
    expected_break: >-
      A candidate whose seed is definitionally a solution/witness of the
      target system, whose precision requirement is unbounded or itself
      as expensive as the sought object, or whose lifted output carries no
      information beyond an isomorphic copy of the base data.
    pass_condition: >-
      Every gate item is explicitly present for a candidate, with the exact
      construction, seed-independence story, exactness bridge, and full cost
      enumeration; otherwise the candidate is recorded not intake-ready with
      its absent items named.
    current_result: >-
      Performed statically, reproducing mechanism-card.yaml's own C1-C6
      verdicts. C1 (black-box Hensel lifting, EC trace analogue) carries G1
      but fails G2 (unestablished prerequisite circuit) and G3/G8 (bounded-
      precision trick does not transfer to a Theta(B)-sized object). C2
      (multivariate/relaxed p-adic Hensel-Newton lifting) carries G1 but
      fails G2 by construction: the retrieved source states directly that
      the method requires an already-known mod-p root as its seed. C3
      (tropical ultrametric root counting) fails G1 on output type (a count,
      not a transducer). C4 (classical modular Hensel lifting) carries G1
      but fails G2/G3/G8 because its premise (cheap mod-p base case) is
      inapplicable to a setting whose target answer is already an F_p
      object. C5 (rigid-analytic/Berkovich continuation) fails G1: no
      computational algorithm was retrieved, only foundational theory. C6
      (canonical prime-to-p torsion lift, internal derivation) carries G1 as
      a real derived theorem but fails G2: it is independently proven
      information-theoretically empty for group-theoretic invariants, and
      resultant-based constructions like r_R are exactly such invariants. No
      candidate is intake-ready. No experiment was run.
  observation_collision_search:
    applies: true
    collision_object: >-
      A retrieved or internal object that is the same observable as a
      trigger already screened in one of the six terminal pre-admission
      packets, in any of the seventh- through fourteenth-round candidate
      sets, or an internal idea-generation-corpus candidate that already
      proposed the identical mechanism for a different setting -- with
      particular emphasis this round on confirming no candidate here
      restates round fourteen's complex/real continuation candidates in
      p-adic dress.
    attack_plan:
      - compare each candidate against the six screened families and their scoped negative boundaries
      - compare each candidate against round fourteen's six candidates (C1-C6) specifically, item by item, to confirm the p-adic mechanism is genuinely distinct and not a relabelling
      - compare each candidate against the seventh- through thirteenth-round candidate sets and record which, if any, is a re-derivation
      - grep inputs/ and knowledge/ for the exact mechanism names (Hensel, p-adic, padic, Z_p, Q_p, tropical, Berkovich, rigid analytic) and read any on-topic hit in full
      - confirm this round does not reopen round ten's closed mixed-radix/CRT sub-avenue, round eleven's ROUTE-04 collapse, round twelve's four route collapses, round thirteen's five verdicts, or round fourteen's six verdicts
      - record which candidate, if any, falls inside a screened family, duplicates a prior-round candidate, or duplicates an internal prior candidate
    expected_break: >-
      A candidate that re-runs a screened family, re-derives a prior-round
      candidate (in particular, one of round fourteen's complex/real
      continuation candidates restated over Z_p/Q_p without a genuinely
      distinct mechanism), reopens a closed sub-avenue, or silently restates
      an internal prior candidate without crediting its disclosed
      obstruction.
    pass_condition: >-
      No candidate re-runs a frozen screen, re-derives a prior-round
      candidate, reopens a prior closure, or silently restates an internal
      prior candidate without crediting its disclosed obstruction.
    current_result: >-
      Performed statically, item by item against round fourteen's six
      candidates specifically, per the dispatch's explicit requirement.
      Round 14 C1 (witness sets over C, path-tracking discovery of ALL
      roots from a generic start system) vs. this round's C2 (p-adic
      Hensel-Newton lifting, precision refinement of an ALREADY-KNOWN root):
      these are near-opposite mechanisms -- C1 discovers without a known
      seed, C2 requires one -- confirmed genuinely distinct, not a
      relabelling. Round 14 C3 (coefficient-parameter continuation, all
      paths per fresh target) vs. this round's C1 (bounded-precision
      extraction from a black-box circuit): distinct, since C1's mechanism
      has no path-tracking analogue at all and instead depends on Hasse-style
      boundedness. Round 14 C4 (pseudo-witness-set elimination, per-query
      cheap leg once a Theta(B^3) seed exists) vs. this round's C1 (per-query
      cheap extraction once a circuit exists): structurally analogous in
      SHAPE (a cheap leg gated on an expensive/unestablished prerequisite)
      but mechanistically distinct (p-adic Newton-corrector extraction from a
      circuit oracle, not complex path-tracking from a witness set) and
      gated on a DIFFERENT prerequisite (an evaluation circuit, not a
      witness set) -- disclosed as a structurally analogous but non-duplicate
      finding, not a re-run. Round 14 C6 (probabilistic saturation, scalar
      count, finite-field-native via randomized evaluation) vs. this round's
      C3 (tropical ultrametric root counting, scalar count, finite-field/
      p-adic-native via Newton-polytope combinatorics): same OUTPUT-TYPE
      failure mode, different MECHANISM entirely (randomized Schwartz-
      Zippel-style saturation testing vs. a deterministic tropical
      reformulation of Hensel's lemma) -- confirmed non-duplicate, exactly as
      round fourteen itself distinguished its C4 from round twelve's
      u-resultant screen on the same kind of mechanism-vs-vocabulary
      grounds. Round 14 C5 (alpha-theory certification of characteristic-zero
      exactness) has no p-adic analogue in this round's candidate set because
      no analogous certification gap exists here (p-adic exactness needs no
      separate certification layer, per this round's own critical
      directional finding); this is itself the clearest evidence the two
      rounds are not the same search restated. This round's C4 and C6 and
      the internal KN-TECH-73630e/KN-OPEN-3417fc material have no round-14
      counterpart at all. No candidate this round is a re-run of any
      screened family, prior-round candidate set, or internal prior
      candidate targeting this specific P1553 construction.
  quantifier_order_statement:
    applies: true
    required_order:
      - freeze the P1553 rings, bases, CRT components, and interval geometry
      - fix the public g_I and r_R construction
      - name the trigger object T (recurrence, circuit identity, or theorem)
      - receive public E, P, Q
      - construct T's p-adic lifting seed from E, P, Q alone at declared, bounded cost, WITHOUT presupposing a solution of the target system
      - lift and recover an EXACT value in F_p from it, with the recovery mechanism and its cost stated
      - compute r_R mod g_I (or the dyadic unit-product step) from that exact value
      - enumerate the full cost and verify the B^(5/4)/o(ell^(1/2)) bounds
      - verify lineage/multiplicity, Q vs -Q, invertible Q coefficient, and source unranking
    forbidden_order: >-
      Assume an unestablished evaluation circuit exists and only then ask
      whether Hensel lifting can cheaply extract a bounded scalar from it
      (C1); require an already-known root of the target system as the
      lifting seed, i.e. solve the discovery problem before the method can
      even start (C2); treat a mod-p computation as a free base case for a
      reconstruction the frozen setting does not need (C4); or compute a
      scalar count and treat it as if it were the remainder transducer
      itself (C3).
    expected_break: >-
      A candidate whose construction presupposes exactly the object the
      frozen setting has not yet publicly constructed (a solved discovery
      instance, or an unestablished circuit), or that silently substitutes a
      different output object (a count, or an isomorphic copy carrying no
      new information) for the one the quantifier order requires (an exact
      F_p remainder).
    pass_condition: >-
      All frozen objects are fixed before any witness or presupposed root is
      observed, T's seed is built from public data (E, P, Q) alone at
      declared bounded cost without presupposing a solution, and the
      recovered value is exact in F_p with its recovery cost disclosed.
    current_result: >-
      Statement only, checked per candidate. C1 violates the required order
      by presupposing an unestablished circuit. C2 violates it definitionally
      by requiring an already-known root as its seed -- the sharpest
      violation this round, since the method's own literature states this
      directly rather than leaving it implicit. C3 violates it by
      substituting a scalar count for the required remainder object. C4
      violates it by applying a reconstruction step to a problem that
      already has the answer it needs (an F_p value) without reconstruction.
      C5 never reaches an algorithm to check the order against. C6 satisfies
      every step of the order up to and including exact recovery, but the
      recovered object is proven (by this program's own KN-TECH-73630e) to
      carry zero information beyond what public data (E, P, Q, and the
      labels) already supply, so the final step (computing r_R mod g_I from
      it) has nothing new to work with.
  method_ceiling_nearby_object_control:
    applies: true
    nearby_object: >-
      A generic ambient polynomial system of the same variable count, degree
      profile, and total degree as the frozen setting's complete-chart
      intersection system, with no elliptic-curve provenance, group law,
      Weierstrass structure, or complete-chart intersection origin at all,
      whose elimination/projection produces a generic hypersurface of the
      same degree Theta(B^3) as r_R and a generic squarefree divisor of the
      same degree Theta(B) as g_I; separately, for C6 specifically, a nearby
      GENERIC (non-canonical, non-torsion) point lift with no order
      condition, to isolate whether the canonical torsion condition itself
      is what forces the isomorphism.
    attack_plan:
      - apply the identical candidate construction (black-box Hensel lifting, multivariate p-adic Hensel-Newton lifting, tropical root counting, classical modular Hensel lifting, rigid-analytic continuation) to the planted generic ambient system
      - prohibit use of any elliptic-curve-specific fact absent from the claimed lemmas
      - for C6, separately check that a GENERIC (non-canonical) p-adic lift of a point, without the prime-to-p order condition, does NOT enjoy the same isomorphism guarantee -- confirming the obstruction is specific to the canonical torsion construction, not to p-adic lifting as such
      - identify the first lemma that would need to distinguish the genuine P1553 (g_I, r_R) pair from the generic control
      - reject the argument if it still returns a purported P1553 remainder/witness certificate on the planted generic instance at the same claimed cost
    expected_break: >-
      Every retrieved candidate this round (C1-C5) is a general statement
      about p-adic lifting, tropical root counting, or classical modular
      reconstruction applicable to ANY polynomial system, hypersurface, or
      projection of the given degree profile, with no P1553-structure
      lemma; each would apply identically, and at the identical cost, to the
      planted generic non-elliptic ambient system. C6 is different in kind:
      it IS elliptic-curve-specific (it uses the group law and the order
      condition explicitly), but its obstruction (information-theoretic
      emptiness) is also general -- ANY canonical, order-preserving p-adic
      torsion lift of ANY finite cyclic group embedded in a p-adically
      completable ambient group would enjoy the same isomorphism guarantee,
      so C6's failure is not specific to elliptic curves either, confirming
      it proves too much in the opposite direction (it would equally
      "fail to help" for any such group, which is exactly what the source
      theorem states).
    pass_condition: >-
      A named P1553-structure lemma would need to reject the generic control
      before granting a P1553 remainder/witness at sub-Theta(B^3) cost, or
      before granting an exact F_p answer at no extra certification cost; no
      candidate this round supplies such a lemma, so none passes.
    current_result: >-
      Not run as an experiment (no experiment authorized). Stated
      analytically: black-box Hensel lifting of implicit systems is stated
      for any efficiently evaluable system; multivariate/relaxed p-adic
      Hensel-Newton lifting is stated for any algebraic or triangular
      system given a mod-p root; tropical ultrametric root counting is
      stated for any regular system over a valued field; classical modular
      Hensel lifting is stated for any polynomial GCD/resultant/
      factorization problem. Every technique read this round (C1-C5) would
      apply, at the identical declared cost, to the planted generic
      non-elliptic ambient system, confirming none of C1-C5 ever used any
      fact about E, P, or Q beyond treating the ambient system as an opaque
      polynomial system of given degree. C6 does use elliptic-curve-specific
      structure (the group law, the order-n condition), but its own
      obstruction generalizes to any finite-order point in any p-adically
      completable group, so it proves the SAME negative result on the
      generic control that it proves on the genuine P1553 setting -- the
      candidate does not distinguish the two cases in the direction that
      would matter (it would need to find a positive result on P1553 that
      fails on the generic control; instead it finds the same negative
      result on both). No computation was executed; this is a stated
      control, not a run result.
  lossy_projection_test:
    applies: true
    tracked_object_c1: '"A hypothetical bounded p-adic digit-string extracted from an r_R-related evaluation circuit," proposed as the tracked object for C1.'
    tracked_object_c2: '"A Hensel-refined p-adic approximate root of the complete-chart intersection system," proposed as the tracked object for C2.'
    tracked_object_c3: '"A tropical/valuation-based count of solutions of prescribed valuation," proposed as the tracked object for C3.'
    tracked_object_c4: '"A lifted integer/rational coefficient vector reconstructed from mod-p data," proposed as the tracked object for C4.'
    tracked_object_c6: '"The canonical prime-to-p torsion lift Ŝ of a public point S," proposed as the tracked object for C6.'
    test_result_c1: >-
      Cannot be completed: the domain of definition (the prerequisite
      evaluation circuit) is not established to exist, so whether the
      projection is lossy or reachable cannot even be assessed; gated on an
      open prerequisite, not a pass or a clean fail.
    test_result_c2: >-
      FAILS the "genuinely lossy" clause outright: the tracked object already
      IS a full witness of the exact point being refined (that is what the
      seed requirement means), so nothing is discarded at all, mirroring
      round fourteen's C3 (nothing discarded) for a definitional rather than
      a cost reason.
    test_result_c3: >-
      Genuinely, extremely lossy, and the discard IS reachable compatibly
      with F_p/valued-field operations -- but the retained information (a
      solution count) does not propagate deterministically to the required
      output (a remainder polynomial or labelled correspondence) at all: a
      lossy projection to the wrong target object, exactly as round
      fourteen's C6 found via a different mechanism.
    test_result_c4: >-
      FAILS in the opposite direction from every other candidate: the
      tracked object (a lifted integer/rational coefficient vector) is a
      strictly LARGER representation of the same mod-p information, not a
      discard at all -- the technique adds information/precision rather than
      removing it, confirming it targets the wrong problem direction
      entirely.
    test_result_c6: >-
      FAILS the "genuinely lossy" clause at the most basic level: by the
      source theorem's own statement, Ŝ's generated group is abstractly
      ISOMORPHIC to S's, so the lift is a change of coordinates that
      preserves every bit of group-theoretic information, not a discard of
      any of it. This is, in this program's own terms, definitionally NOT a
      new projection.
    conclusion: >-
      No tracked object this round survives the lossy-projection test intact
      for the required trigger shape: C2's and C6's projections are not
      genuinely lossy at all (C2 because the seed already is the answer's
      witness; C6 because the lift is an isomorphism, i.e. mere relabelling);
      C4's "projection" moves in the wrong direction (adding, not
      discarding, information); C3's discard is compatible but destroys
      exactly the information needed; C1's test cannot be completed pending
      an unresolved prerequisite; C5 supplies no tracked object at all. This
      is an algebraic, zero-compute audit performed before any experiment
      was proposed; no experiment is proposed as a result.

