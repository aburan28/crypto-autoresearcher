  - symptom: no computational algorithm was retrieved at all, only foundational theory
    localizes_to: L1_NAMED_TRIGGER_OBJECT
    interpretation: G1's own text excludes the assertion that a specialized technique may exist; G1 fails (C5 this round)
  - symptom: the lifting seed is definitionally a solution/witness of the target system
    localizes_to: L2_FROZEN_SETTING_TYPING_AND_SEED_INDEPENDENCE
