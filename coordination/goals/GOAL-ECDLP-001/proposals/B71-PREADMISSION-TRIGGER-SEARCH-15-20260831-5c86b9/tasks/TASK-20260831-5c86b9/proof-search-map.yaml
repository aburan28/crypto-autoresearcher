target_statement:
  informal: >-
    An actual recurrence, circuit identity, or retrieved theorem from p-adic
    methods for polynomial system solving -- black-box Hensel lifting of
    implicit systems, multivariate/relaxed p-adic Hensel-Newton lifting of
    algebraic systems, tropical ultrametric root counting, classical modular
    Hensel lifting, rigid-analytic/Berkovich continuation, or the canonical
    prime-to-p torsion lift -- instantiates to the frozen elliptic setting as
    a typed public P1553 target-local remainder transducer for r_R mod g_I or
    the exact dyadic subinterval unit-product interface, and passes every
    item of the frozen pre-admission gate (G1-G8, amended G2/G8 wording).
  quantifiers: >-
    There exists one named public object T (a recurrence, circuit identity,
    or theorem) and one fully specified public construction rule C such
    that, for the frozen P1553 setting fixed before any witness is observed,
    C computes r_R mod g_I (or the dyadic unit-product step) from E, P, Q
    alone, EXACTLY, without importing a root, factor, or Groebner basis of
    r_R or the underlying complete-chart intersection system; the full
    state/update-map/degree/rank/nonzero/coefficient-growth/live-storage/
    traffic/build-query/amortization enumeration lies within the inherited
    B^(5/4) interface budget and strict end-to-end o(ell^(1/2)) time,
    memory, and data; lineage and multiplicity are preserved on coalesced
    and nonreduced fibres; Q is distinguished from -Q; known P and Q
    coefficients are yielded with invertible Q coefficient; output-sensitive
    source unranking is supported; and T is shown not to be dominated in
    declared cost by an already-costed norm, resultant, quotient, full
    power-projection, represented-table, or witness-conditioned route. For a
    p-adic-lifting candidate, an additional quantifier constraint binds: the
    construction of the LIFTING SEED itself (whatever quantity is Hensel-
    lifted, and from what starting precision) must be public and must not
    presuppose a solution, root, or witness of the target system that is
    itself the sought information; a seed that IS such a solution is not
    typed to this quantifier order at all, and is G2-absent by definition,
    not merely cost-deficient.
  present_support: none

lemma_decomposition:
  - id: L1_NAMED_TRIGGER_OBJECT
    responsibility: >-
      Name the actual recurrence, circuit identity, or retrieved theorem T,
      with its exact statement and source, and verify it is not merely the
      assertion that a specialized construction may exist, and, for a
      p-adic-lifting candidate, verify T's output type is a value or
      correspondence of the shape the trigger requires (a remainder or a
      labelled correspondence), not merely a count or a bit.
    status: open
    falsifier: >-
      T is only an existence assertion, a theory with no computational
      algorithm, or a technique whose output is a scalar count or a
      membership bit, not an object of the shape r_R mod g_I requires.
  - id: L2_FROZEN_SETTING_TYPING_AND_SEED_INDEPENDENCE
    responsibility: >-
      Type T into the frozen P1553 setting: rings, bases, CRT components,
      interval geometry, public g_I and r_R construction, and an EXACT
      computation from E, P, Q without importing a root, factor, or Groebner
      basis of r_R or the underlying system. For a p-adic-lifting T, this
      includes identifying exactly what serves as the LIFTING SEED (a
      solution mod p, mod p^k, or an evaluation-circuit description), whether
      that seed is genuinely public and cheaply computable without already
      solving the discovery problem the trigger is meant to solve, and
      separately whether and how the method's p-adic output is reduced to an
      EXACT element of F_p, and at what disclosed cost.
    status: open
    falsifier: >-
      The seed silently requires an equivalent witness (a root, factor,
      Groebner basis, or approximate solution of r_R/g_I or the underlying
      system that is itself the sought discovery); or the seed requires an
      unestablished evaluation circuit; or the method's output remains
      information-theoretically equivalent (an isomorphic copy) to the base
      F_p data with no new leverage on the required construction.
  - id: L3_FULL_COST_ENUMERATION
    responsibility: >-
      Enumerate state, update maps, degrees, ranks, nonzeros, coefficient
      growth, live storage, traffic, build/query split, and amortization,
      and bound every axis within the B^(5/4) interface budget and strict
      end-to-end o(ell^(1/2)) time, memory, and data. For a p-adic-lifting
      candidate, this includes the number of p-adic digits/precision needed
      (preprocessing and per-fresh-target), and whether that count is itself
      bounded by a classical theorem (as Hasse bounds the trace) or is
      open-ended and possibly as expensive as the object sought.
    status: open
    falsifier: >-
      The precision or seed-construction cost for any single query matches
      or exceeds an already-costed route's declared exponent; or the number
      of independent lifting operations needed to reconstruct the full
      Theta(B)-sized object scales with B in a way that exceeds the B^(5/4)
      online cap; or no cost enumeration is possible because the method has
      no search/discovery step at all (a pure refinement operator applied to
      an unavailable seed).
  - id: L4_LINEAGE_MULTIPLICITY_FIBRES
    responsibility: Preserve lineage and multiplicity on coalesced and nonreduced fibres.
    status: open
    falsifier: A coalesced or nonreduced fibre loses its occurrence label or multiplicity under T.
  - id: L5_Q_VS_MINUS_Q
    responsibility: Distinguish Q from -Q in the transducer output.
    status: open
    falsifier: The output is invariant under Q mapped to -Q with no separately proved orientation channel.
  - id: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    responsibility: Yield known P and Q coefficients with invertible Q coefficient.
    status: open
    falsifier: The Q coefficient is not known a priori or is not invertible on the declared strata.
  - id: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    responsibility: Support output-sensitive source unranking.
    status: open
    falsifier: Unranking requires enumerating the full source or a support table.
  - id: L8_NOT_ALREADY_COSTED_ROUTE
    responsibility: >-
      Show T's declared cost exponent for the same construction step is not
      dominated by (i.e. is strictly smaller than) any already-costed
      route's declared exponent, specifically ROUTE-01 (component
      resultants) or ROUTE-08 (displacement representation, node n2,
      cost_exponent_in_B 3), under the amended G8 wording's cost-comparison
      standard rather than a shared-family-name exclusion alone.
    status: open
    falsifier: >-
      T's declared exponent for building its seed, circuit, or per-target
      lifted value is greater than or equal to 3 (ROUTE-08's own declared
      exponent), or no construction stage is reached at which a cost
      comparison could even be attempted.
lemma_decomposition_present_support: none

dependency_order:
  - [L1_NAMED_TRIGGER_OBJECT, L2_FROZEN_SETTING_TYPING_AND_SEED_INDEPENDENCE]
  - [L2_FROZEN_SETTING_TYPING_AND_SEED_INDEPENDENCE, L3_FULL_COST_ENUMERATION]
