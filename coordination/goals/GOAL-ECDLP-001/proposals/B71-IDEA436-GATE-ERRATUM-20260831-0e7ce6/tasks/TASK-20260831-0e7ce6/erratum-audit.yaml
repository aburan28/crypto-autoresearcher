  blocking_repairs:

    - id: R-F1
      severity: substantive_quantifier_fidelity_fail
      source: 'validator TASK-20260831-c6ceb9, finding F-1, repair R1'
      status: discharged
      where_in_erratum: 'section C.1, with the scope consequence carried into section B'
      what_changed: >-
        Four changes. (1) The frozen setting of memo section 1.1 is amended from a
        Weierstrass model whose coefficients lie in Z_p to a Weierstrass model over Z_p
        REALISING the good reduction, that is with v_p of the discriminant equal to 0,
        equivalently a minimal model up to a unit. (2) Model non-minimality is added to
        the section 10 exclusion list, whose repaired form is written out in full.
        (3) The Proposition quantifier list is extended from (j, k, E, p, n) to
        (j, k, E, p, n, model), which is where the defect bites, since the model was
        absent from both the Proposition and the proof-search-map quantifier_order.
        (4) The proof-search-map dependency_audit sentence asserting that no hidden
        dependence of the D1 witness on the instance was found is corrected, because on
        the loose hypothesis the simulator return constant 0 is itself a model-dependent
        constant. The validator alternative repair R2, a covariant restatement with c a
        public model constant, is recorded as considered and declined with its reason,
        and its content is preserved as the robustness observation that Proposition E of
        section C.2 holds on every admissible integral model.
      counterexample_reproduced_in_erratum: >-
        Yes, in full and explicitly. The substitution x equal to u squared X and y equal
        to u cubed Y with u equal to 1 over p sends y squared equal to x cubed plus Ax
        plus B to Y squared equal to X cubed plus p to the fourth AX plus p to the sixth
        B, whose coefficients lie in Z_p and whose discriminant is p to the twelfth times
        the original, so it satisfies section 1.1 as literally written; since X equals p
        squared x, the valuation of the coordinate difference off the plus-or-minus locus
        is exactly 2, finite and at least 1, contradicting the Proposition literal
        non-existence sentence.
      discharging_evidence:
        - ref: 'coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-GGM-SIMULABILITY-GATE-20260831-c7c3ef/reviews/TASK-20260831-c6ceb9/validation-report.yaml'
          provenance: internal
          claim: >-
            Finding F-1 in full, including what_the_memo_states,
            concrete_counterexample_to_the_literal_statement,
            why_the_quantifier_list_is_where_it_bites, what_survives_untouched,
            secondary_consequences_to_repair_together, repair_action_preferred R1 and
            repair_action_alternative R2.
          verified_by: >-
            This session, TASK-20260831-0e7ce6, opened the findings block F-1 through F-5
            of that report and read it in full. The remainder of the report was not read
            and is disclosed as unread in erratum section J.
        - ref: DEC-20260831-a9716f
          provenance: internal
          claim: 'repairs_required_before_any_disposition_is_recorded items, item R-F1, read verbatim.'
          verified_by: 'This session, opened the decision record in full.'

    - id: R-OBJ1
      severity: major
      source: 'red-team TASK-20260831-62019a, OBJ-1'
      status: discharged
      where_in_erratum: 'section C.2, with the re-issued verdict at section B'
      what_changed: >-
        The section 0 verdict is re-founded on the model-free Corollary 4.3 ground and
        restated as Proposition E, which says that under the repaired setting the D1
        functional equals the truncation cap r when the two reduced points share an F_p
        x-coordinate and 0 otherwise, so it is computed from F_p coordinates by a single
        F_p equality test with no lifting, no p-adic arithmetic and no precision.
        Consequences are stated as zero information, in the sense that the conditional
        entropy of the oracle answer given the querying party view is exactly 0, and no
        computational leverage beyond the quotient of the group by plus-or-minus one that
        Pollard rho negation map already exploits. The strict-GGM simulator, Shoup,
        KN-TECH-005 and the phrase closed at exponent 1/2 are demoted to CORROBORATION,
        and the KN-TECH-005 barrier caveat is carried forward VERBATIM in section B
        wherever the corroboration appears, together with the KN-LIT-7606 sentence and
        that record own disclosure that its full text was never read. Four independences
        are recorded as the content of the re-founding - independence of Fork A, of the
        primality hypothesis, of the query interface, and applicability to non-generic
        adversaries.
      honesty_correction_made_beyond_the_repair_text: >-
        The unqualified phrase literally nothing, which appears in the OBJ-1 body, is NOT
        used. On the integer-indexed interface a querying party must materialise the two
        points at O(log n) group operations each, so the oracle saves at most two scalar
        multiplications per query. The erratum states the qualified form - no leverage
        beyond the free quotient, at a saving of at most O(log n) group operations per
        query - and records why the qualification is needed. This is a tightening against
        the producer favour and is recorded rather than absorbed.
      terminology_clarification_added: >-
        The erratum distinguishes Weierstrass model from generic-group model and states
        that model-free means free of the GENERIC-GROUP model, since R-F1 in the same
        document is about Weierstrass models. Without that sentence the two repairs read
        as contradicting each other.
      discharging_evidence:
        - ref: 'coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-GGM-SIMULABILITY-GATE-20260831-c7c3ef/reviews/TASK-20260831-62019a/red-team-report.yaml'
          provenance: internal
          claim: >-
            OBJ-1 in full - the three-part evidence block, the_defect,
            why_the_verdict_nevertheless_survives, repair_action and
            status_if_unrepaired - together with the top-level review_attestation blocks
            what_breaks_and_what_does_not and reason_for_breaks.
          verified_by: 'This session, opened the report in full and quoted it.'
        - ref: KN-TECH-005
          provenance: internal
          claim: >-
            The barrier caveat carried forward verbatim - the bound is a barrier, NOT a
            proof that no non-generic attack exists - and the applicability-limits
            sentence naming anomalous curves and extension-field index calculus as living
            in the model blind spot.
          verified_by: 'This session, opened knowledge/techniques/KN-TECH-005.md in full and quoted both passages verbatim.'
        - ref: KN-LIT-7606
          provenance: internal
          claim: >-
            That a plain-GGM simulability argument cannot close a candidate for real
            elliptic curves, because index calculus over small-degree extension fields is
            a genuine non-generic algorithm; and the record own disclosure that the full
            text was not read because the fetched PDF did not yield extractable text.
          verified_by: 'This session, opened knowledge/literature/KN-LIT-7606.md in full and quoted both passages verbatim.'
        - ref: KN-TECH-73630e
          provenance: internal
          claim: >-
            That the lift is information-theoretically empty because the lifted point is a
            deterministic function of the base point, computable to any precision from
            E(F_p) data alone by Hensel lifting plus the order condition.
          verified_by: 'This session, opened knowledge/techniques/KN-TECH-73630e.md in full and quoted it verbatim.'
        - ref: KN-TECH-006
          provenance: internal
          claim: >-
            That negation and other cheap automorphisms give a further constant-factor
            speedup inside the standard parallel rho baseline - which is the record that
            makes the phrase already exploited by rho a citation rather than folklore.
          verified_by: 'This session, opened knowledge/techniques/KN-TECH-006.md in full and quoted it verbatim.'

    - id: R-OBJ2
      severity: major
      source: 'red-team TASK-20260831-62019a, OBJ-2'
      status: discharged
      where_in_erratum: 'section C.3, with the hypothesis carried into the scope block of section B'
      what_changed: >-
        BOTH halves the decision permits are applied, not one. (1) n prime is added to the
        scope of the CORROBORATION in section B. (2) For general n coprime to p the
        corroboration is restated as exponent 1/2 in the LARGEST PRIME FACTOR of n, and
