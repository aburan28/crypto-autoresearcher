    - id: R-OBJ6
      severity: major
      source: 'red-team TASK-20260831-62019a, OBJ-6, and control RC-2'
      status: discharged_with_two_adverse_consequences_reported
      where_in_erratum: 'section C.4, with the downstream consequences in section E'
      what_changed: >-
        M2 is restated CONSTRUCTIVELY with its cost bound - M2 fires if and only if there
        is an EXPLICIT simulator answering each query with O(1) group operations,
        inversions and equality tests on handles and no other access. Firing becomes a
        burden of construction rather than an information-theoretic determination
        criterion. Control A half 2 is then RE-RUN against the repaired statement and its
        outcome recorded at two separately labelled levels.
      control_a_half_2_rerun_outcome: >-
        M2 DOES NOT FIRE on the additive transfer on anomalous curves. The control PASSES
        and the exponent-1/2 corroboration is NOT broken by it. Level 1, the operative and
        unconditional mechanism check - the repaired firing condition is the exhibition of
        an explicit O(1) simulator, no such simulator is exhibited for the additive
        transfer, so the antecedent is never discharged and the implication chain never
        starts, invoking no theorem that M2 is supposed to license. Level 2, labelled a
        CONSISTENCY check and not an independent mechanism check - the stronger statement
        that no such simulator CAN exist follows from KN-TECH-005, since composing a
        hypothetical O(1) simulator with one field division would give a generic DLP
        algorithm in O(1) group operations in a group of prime order p; that invokes the
        same theorem M2 licenses, so the negative direction of the repaired M2 remains not
        independently checkable, which is a residual weakness inherited in weaker form
        from the statement it replaces and is recorded rather than smoothed over.
      adverse_consequence_1: >-
        The repaired M2 does NOT fire on D1 under the integer-indexed interface, because
        the simulator must first materialise handles at O(log n) group operations, which is
        not O(1). The corroboration therefore NARROWS to the handle branch. It does not
        vanish - on the integer branch D1 lands in the KN-FIND-002 non-constant-overhead
        tier, which that record words as not closed at 1/2 by the constant-overhead bound
        but with no sub-birthday advantage. The model-free ground of section C.2 is
        indifferent to the interface and is unaffected.
      adverse_consequence_2: >-
        The repaired M2 does NOT fire on the endomorphism oracle either, at O(log l) group
        operations under the corrected eigenvalue argument, so the memo section 6.2 M2
        check mark is WITHDRAWN as a reproduction. Combined with the jet, elliptic-net and
        incidence oracles, the repaired M2 fires on NONE of the four corpus-recorded
        oracles, leaving it with exactly one firing instance anywhere in this program
        corpus, namely D1 itself. OBJ-5 is therefore SHARPENED rather than resolved, and
        RC-3 remains required and is not discharged here.
      discharging_evidence:
        - ref: 'coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-GGM-SIMULABILITY-GATE-20260831-c7c3ef/reviews/TASK-20260831-62019a/red-team-report.yaml'
          provenance: internal
          claim: >-
            OBJ-6 in full including the verbatim M2 statement and its repair_action; the
            controls block half_1_M1_proves_too_much, half_2_M2_does_not_fire and
            half_2_my_own_derivation; and RC-2.
          verified_by: 'This session, opened the report in full.'
        - ref: KN-TECH-033
          provenance: internal
          claim: >-
            That on a curve of cardinality p there is an explicit isomorphism onto the
            additive group, that the ECDLP is linear time, and that the cost is O(log p)
            field operations - which is what makes the conclusion known false on this
            control object.
          verified_by: 'This session, opened knowledge/techniques/KN-TECH-033.md in full and quoted it verbatim.'
        - ref: KN-TECH-005
          provenance: internal
          claim: >-
            The Omega of the square root bound in the strict opaque-label model, which is
            the theorem the Level 2 non-existence argument invokes and which the erratum
            therefore labels as a consistency check rather than a mechanism check.
          verified_by: 'This session, opened the file in full.'
        - ref: KN-FIND-002
          provenance: internal
          claim: >-
            The non-constant-overhead tier wording used for adverse consequence 1 - not
            closed at 1/2 by the constant-overhead bound, but O(log N) much less than the
            square root of N, so no sub-birthday advantage.
          verified_by: 'This session, opened knowledge/findings/KN-FIND-002.md in full and quoted it verbatim.'

    - id: R-OBJ7
      severity: medium
      source: 'red-team TASK-20260831-62019a, OBJ-7'
      status: discharged
      where_in_erratum: 'section C.5'
      what_changed: >-
        The query interface is promoted to an explicit FOURTH FORK, named Fork D, and
        answered on BOTH branches. Branch D-handle - the adversary presents handles, the
        simulator costs one inversion and two equality tests plus one identity test for the
        degenerate case, O(1) group operations independent of r, n and p, the repaired M2
        fires, and the branch is closed by the constant-overhead bound at exponent 1/2 in
        the largest prime factor of n subject to the section B caveats. Branch D-integer -
        the adversary presents the integers as the frozen family is literally written, the
        simulator must materialise handles at O(log n) group operations each by
        double-and-add, the overhead is NON-CONSTANT, the repaired M2 does not fire, the
        branch is NOT closed by the constant-overhead bound, and it lands in the tier
        KN-FIND-002 words for the elliptic-net oracle with still no sub-birthday advantage.
        Fork D is left OPEN as a formalization question, exactly as OFQ-1 is; the erratum
        answers on both branches and adjudicates neither, and records that the two branches
        differ ONLY in the corroboration and never in the disposition.
      profile_vector_cost_line_charged: >-
        On branch D-integer the reference-handle materialisation is charged explicitly -
        one-off setup of O(|J| log n) group operations for |J| reference handles; per
        queried k, O(log n) group operations to materialise the queried handle plus |J|
        inversions and 2|J| equality tests emitting |J| values; hence O(1) plus O(log n
        divided by |J|) per emitted value, which amortises to O(1) once |J| is at least of
        order log n and is O(log n) for |J| of constant size. On branch D-handle the setup
        term is zero and the per-emitted-value cost is O(1) outright. The memo line
        omitting this cost is identified as running in the producer-favouring direction.
      discharging_evidence:
        - ref: 'coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-GGM-SIMULABILITY-GATE-20260831-c7c3ef/reviews/TASK-20260831-62019a/red-team-report.yaml'
