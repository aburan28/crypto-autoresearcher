disposition_confirmed_note: >-
  The erratum discharges all six blocking repairs (R-F1, R-OBJ1, R-OBJ2,
  R-OBJ6, R-OBJ7, R-OBJ8) and the nine lower-severity items DEC-20260831-a9716f
  required, with specific, checkable evidence for each rather than bare
  assertion. Its central re-founding (Proposition E: D1 collapses to a single
  F_p equality test deciding k = +/-j mod n, needing no oracle model, no
  primality hypothesis, and no query-interface convention) is independently
  confirmed sound and is a strictly cleaner, more defensible closure than the
  strict-GGM-simulability route the superseded memo used and this session's
  own earlier (inadequately verified) review confirmed only for one specific
  convention. The erratum correctly declines to overclaim: it withdraws the
  superseded memo's record-level scoped-rejection recommendation once the
  disjunction is recognized, correctly labels its own Level-2 non-existence
  argument as a consistency check rather than an independent mechanism check,
  and discloses every partial read and every not-yet-executed control (RC-1,
  RC-3, RC-4) rather than treating silence as passing. The two-part
  disposition (D1 disposed in scope on the model-free ground; D2 not gated,
  returned open) is the correct, non-overreaching Coordinator-facing
  recommendation.

