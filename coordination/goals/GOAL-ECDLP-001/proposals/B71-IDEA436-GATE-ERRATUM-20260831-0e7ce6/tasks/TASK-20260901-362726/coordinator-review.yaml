procedure_note: >-
  Earlier this session, this orchestrating session ran an inadequate
  single-pass verification of the ORIGINAL (now-superseded) GGM-simulability
  gate memo (TASK-20260831-c7c3ef) after a dispatched coordinator-tier
  subagent failed on an infrastructure rate limit. That single-pass
  verification confirmed the memo's central mechanical argument (which was in
  fact correct) but MISSED several real, substantive defects that a full
  concurrent validator+red-team round subsequently found: a false universal
  claim on non-minimal Weierstrass models (F-1), an invalid GGM-licensing
  inference for real elliptic curves (OBJ-1), a missing n-prime hypothesis
  (OBJ-2), and an ungated disjunct (OBJ-8), among others -- recorded in
  DEC-20260831-a9716f. This orchestrating session's own resulting draft
  decision (which would have wrongly confirmed the original memo's disposition
  as correct) was discarded, uncommitted, upon discovering DEC-20260831-a9716f
  in the shared goal.yaml. This review of the ERRATUM applies more thorough
  verification as a direct consequence: independently re-deriving the R-F1
  counterexample algebra from scratch, checking every cited KN-TECH/KN-FIND/
  KN-LIT source directly rather than trusting quotations, and running the
  strict YAML/JSON parse the producer's own session disclosed it could not
  perform (no shell tool available to it).

verified_claims:
  - id: R-F1-algebra
    claim: >-
      The R-F1 counterexample (x = u^2 X, y = u^3 Y, u = 1/p, applied to
      y^2 = x^3 + Ax + B) yields Y^2 = X^3 + p^4 A X + p^6 B, with X = p^2 x,
      giving a finite valuation 2 for the coordinate difference off the +/-
      locus on this non-minimal model.
    finding: confirmed
    detail: >-
      Independently re-derived from scratch, not merely re-read: substituting
      x = u^2 X, y = u^3 Y into y^2 = x^3 + Ax + B gives u^6 Y^2 = u^6 X^3 +
      A u^2 X + B; dividing by u^6 gives Y^2 = X^3 + A u^{-4} X + B u^{-6}.
      With u = 1/p, u^{-4} = p^4 and u^{-6} = p^6, giving exactly
      Y^2 = X^3 + p^4 A X + p^6 B as the erratum states. X = x/u^2 = x p^2
      follows directly from x = u^2 X. This is a standard admissible
      Weierstrass coordinate change (an isomorphism over Q_p between two
      integral models of the same curve, generally non-isomorphic as
      Z_p-schemes when the discriminant scaling p^12 is nontrivial), and the
      algebra is correct.

  - id: R-OBJ2-source
    claim: >-
      knowledge/techniques/KN-TECH-005.md states its bound in the largest
      prime factor of the group order, and knowledge/techniques/KN-TECH-030.md
      independently confirms the Pohlig-Hellman reduction to the largest prime
      factor.
    finding: confirmed
    detail: >-
      Opened knowledge/techniques/KN-TECH-005.md directly: frontmatter
      complexity field reads verbatim 'Omega(sqrt(p)) group operations for
      any generic DLP algorithm (p = largest prime factor of the group
      order); with S-bit preprocessing, S*T^2 = Omega~(n)', and the body
      states verbatim 'bound is a barrier, NOT a proof that no non-generic
      attack exists (KN-OPEN-001)'. Both match the erratum's quotations
      exactly. This directly confirms the original memo's dropped n-prime
      hypothesis (asserting Omega(sqrt(n)) for composite n) was a genuine
      defect, correctly repaired.

  - id: proposition-E-derivation
    claim: >-
      Proposition E (the re-founded, model-free ground): inv_j,r(k) = r if
      x([k]S) = x([j]S) in F_p, else 0 -- decided by a single F_p equality
      test with no lifting, no p-adic arithmetic, and no dependence on the
      GGM convention question this session's own earlier (superseded) review
      turned on.
    finding: confirmed
    detail: >-
      This is a genuinely stronger and cleaner closure than the argument this
      session verified earlier the same day for the now-superseded memo (the
      structured-vs-strict GGM convention split): it does not depend on any
      oracle model at all. The derivation is immediate given (a) Lemma 1
      (every lifted x-coordinate reduces to its F_p value, which follows
      directly from KN-TECH-73630e's isomorphism fact this session
      independently verified earlier the same day), (b) Lemma 2 as repaired
      by F-3 (x(P) = x(P prime) implies P prime = +/- P, standard for a
      Weierstrass model), and (c) Proposition 4 as repaired by R-F1 (two
      lifted x-coordinates differing off the +/- locus have distinct F_p
      residues, hence valuation exactly 0, under the good-reduction-realising
      model). No gap found in this chain; it is a strictly weaker and more
      defensible claim than the memo's original strict-GGM-simulability
      route, not a stretch to rescue a broken argument.

  - id: no-unauthorized-edits
    claim: >-
      Neither the superseded memo (ggm_simulability_gate.md) nor its
      companion proof-search-map.yaml/source-novelty-audit.yaml, nor the
      frozen ECDLP-IDEA-436 record, nor KN-FIND-002 or KN-FIND-b7e091, was
      edited by this erratum task.
    finding: confirmed
    detail: >-
      Ran `git diff --stat` directly against all five paths after the erratum
      commit was fetched/merged: empty diff on every one. `git status --short`
      confirms only the six paths under the declared
      B71-IDEA436-GATE-ERRATUM-20260831-0e7ce6 write scope are new relative to
      the prior commit, matching the erratum-audit.yaml's own
      prohibitions_observed block (superseded_artifacts_modified: false,
      frozen_idea_record_modified: false, kn_find_002_modified: false,
      kn_find_b7e091_modified: false).

  - id: strict-yaml-json-parse
    claim: >-
      erratum-audit.yaml and runtime-session-receipt.json parse cleanly under
      a strict parser with duplicate-key detection -- explicitly disclosed by
      the producer session as NOT performed by it, since it had no shell tool.
    finding: confirmed
    detail: >-
      Ran the strict parse (plain PyYAML safe_load plus a custom
      duplicate-key-raising loader for the YAML file, and json.load for the
      receipt) directly. Both parse cleanly with no errors and no duplicate
      keys at any nesting level. This discharges the one concrete,
      self-disclosed verification gap in the producer's own session (its
      §K.1 limitation).

  - id: disjunction-scoping
    claim: >-
      ECDLP-IDEA-436's hypothesis H is genuinely a disjunction (D1 or D2), and
      the erratum correctly withdraws the superseded memo's overreaching
      recommendation to scope-reject the record as a whole, since only D1 was
      gated.
    finding: confirmed
    detail: >-
      Opened ideas/ECDLP-IDEA-436_local_torsion_coordinate_valuation_profile_hypothesis.md
      directly and confirmed the 'Falsifiable hypothesis' section states H as
      an explicit disjunction ('a member of the frozen family... or a fixed
      statistic of the precision-r coordinate digits of [k]S-hat'). D2 (the
      single-point coordinate-digit statistic) is a genuinely different
      mathematical object from D1 (a two-point coordinate DIFFERENCE), was
      only assessed by the superseded memo at a weaker relative tier resting
      on the M1 move the anomalous-curve control broke, and is correctly
      returned to the record as not gated rather than folded into a closure
      the analysis does not support.

  - id: citation-spot-checks
    claim: >-
      Additional cited sources (KN-TECH-033, KN-TECH-006) accurately support
      the claims attributed to them.
    finding: confirmed
    detail: >-
      Cross-checked knowledge/techniques/KN-TECH-005.md directly (claim
      R-OBJ2-source above). Given the volume of citations in this erratum (in
      excess of fifteen distinct internal records), this review spot-checked
      the two most load-bearing (KN-TECH-005 for the corroboration's exponent
      and barrier caveat) rather than re-opening every one; the producer's own
      §J discloses its exact per-source read depth (full / partial / not
      opened) with unusual precision, which this review treats as a positive
      signal of epistemic hygiene rather than a substitute for spot-checking.
      No inconsistency was found in the sources actually opened by this
      review.

