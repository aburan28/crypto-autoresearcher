  result: 'PASS'
  result_note: >-
    Stated precisely, because a procedure detail is a claim like any other. Run
    1 was executed on the complete file immediately after it was first written,
    with this block already present, and PASSED. This note was then corrected,
    because as first drafted it described a two-run procedure that had not yet
    happened. Run 2 was executed on the corrected bytes, that is on the file
    exactly as delivered, and also PASSED. Both runs used a SafeLoader subclass
    whose mapping constructor raises ConstructorError on a repeated key, so a
    duplicate would have been an error rather than a silent last-wins overwrite.
    Both runs additionally checked for tab characters, carriage returns, and
    UTF-8 decodability, all clean. The commands and their outputs are recorded in
    the session receipt.
