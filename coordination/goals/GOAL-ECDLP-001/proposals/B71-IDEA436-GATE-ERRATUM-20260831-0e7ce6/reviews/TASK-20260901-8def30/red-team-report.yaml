red_team_report:
  id: 'RT-20260901-8def30'
  id_note: >-
    This is a report label derived from the task identifier, not a minted ledger
    identifier. tools/allocate_id.py does not allocate an RT type, so nothing
    was minted and no identifier space was consumed. Reject this label if the
    Coordinator prefers a different one; it binds nothing.
  task_id: TASK-20260901-8def30
  goal_id: GOAL-ECDLP-001
  joint: 'J2'
  role: 'red-team'
  date: '2026-09-01'
  runs_executed: 0
  experiments_executed: 0
  implementations_written: 0
  code_executed: >-
    Bash was used only to read files, compute sha256 digests, inspect git
    ancestry, grep for verbatim quotations, and run one strict YAML parse of
    this report. No experiment, no p-adic arithmetic, no timing, no network
    request. Amazon Bedrock was not used or contacted.

  claim_under_review: >-
    That the ECDLP-IDEA-436 gate erratum re-founds the D1 disposition on a
    model-free ground (Proposition E, promoted from Corollary 4.3 of the
    superseded memo) which is sound and strictly stronger than the plain-GGM
    ground it replaces, and that the resulting two-part disposition -- D1
    disposed in scope, D2 not gated and returned to the record -- claims only
    what that ground supports.

  verdict: 'breaks'
  verdict_scope: >-
    BREAKS on joint J2 as a conjunction, on the SECOND half of the joint. It is
    important that the Coordinator not over-read this. Proposition E itself is
    SOUND -- I re-derived it from the two lemmas and the repaired frozen setting
    and found no error -- and the D1 disposition is recoverable in full on a
    narrowed statement that costs zero compute to write. The break is that the
    erratum asserts three things its ground does not support, one of which is a
    factual claim about the corpus that I refute below on a pre-registered break
    condition the review plan itself declared, and one of which is a FALSE
    universal sentence of exactly the class R-F1 was commissioned to repair,
    reintroduced one paragraph after the repair. See
    narrowest_supported_statement for what survives intact.

  joint_j2_attack_results:

    - attack: 'Attack 1 -- Proposition E itself'
      result: 'holds_with_findings'
      soundness_of_proposition_e: 'SOUND, independently re-derived'
      independent_derivation: >-
        I re-derived Proposition E from its stated ingredients rather than
        accepting the erratum reading of them. Lemma 2 over F_p is correct: on a
        Weierstrass model the fibre of x over a point is the root set of a
        quadratic in y, so it is exactly {P, -P}, and since <S> is cyclic of
        order n, x([k]S) = x([j]S) is equivalent to k congruent to plus or minus
        j mod n. The same argument runs verbatim over Q_p, and the identification
        of the two fibre conditions is the reduction isomorphism on prime-to-p
        torsion. Lemma 1 is correct on a model realising the good reduction:
        [k]S-hat has order dividing n with gcd(n,p) = 1, so it lies outside the
        pro-p kernel of reduction and its coordinates are integral and reduce
        coordinatewise. Off the plus-minus locus the two lifted x-coordinates
        have distinct residues, so the valuation of the difference is 0. On the
        locus the two lifted points are equal or negatives, so the x-coordinates
        agree EXACTLY in Q_p and the difference is the zero element, valuation
        infinite, truncated to the cap r. Both branches are exhaustive and no
        intermediate value is attained. I find no error and no gap. Proposition E
        is true as stated under the repaired frozen setting.
      is_the_equality_test_really_free: >-
        On the interface where it is stated, essentially yes -- but the erratum
        states it on the wrong interface, states it inconsistently, and claims a
        model-independence for it that is false. Three separate defects, all in
        the cost qualification rather than in the proposition.
      findings_raised: ['F-RT1', 'F-RT2', 'F-RT3', 'F-RT4', 'F-RT9']
      was_the_qualification_correct: >-
        It is CORRECT AS AN UPPER BOUND and NOT TIGHT. The erratum says the
        oracle saves at most two scalar multiplications per query, O(log n) group
        operations. As an upper bound on the saving that is true, so it is not a
        false statement. But it is not the sharp statement, and the sharp
        statement is strictly better for the erratum. See F-RT3.
      was_the_qualification_consistently_applied: >-
        NO. It is stated correctly once, at line 343, and is CONTRADICTED at line
        561 in the very section that discharges the interface repair R-OBJ7. The
        review plan asked me to check exactly this and the check fails. See
        F-RT2. It is also referenced but not restated in the re-issued section 0
        at section B, which is this artifact abstract-equivalent -- that
        reference is a pointer plus an explicit repudiation of the unqualified
        phrase, so section B is better than silent, but a reader of section B
        alone still leaves with the unqualified reading.
      anything_moved_off_book: >-
        YES, one item, and it is F-RT1. On a non-minimal integral model the
        single F_p comparison does not decide the plus-minus locus at all,
        because reduction on such a model is degenerate; recovering the test
        requires normalising the coordinates by the public model constant, which
        is a step the erratum never charges while simultaneously claiming the
        proposition is independent of which admissible model is chosen. Two
        smaller off-book items, neither load-bearing: the phrase one F_p equality
        test presumes AFFINE coordinates, whereas in the projective or Jacobian
        representation any real implementation and any rho walk actually uses,
        comparing x-coordinates costs a small fixed number of F_p
        multiplications before the equality test; and the identity case is
        excluded by the proposition hypothesis j, k not congruent to 0 mod n
        rather than charged, which is correct but is not carried into the scope
        block.

    - attack: 'Attack 2 -- the M2-fires-on-nothing consequence'
      result: 'breaks'
      headline_under_attack: >-
        Erratum line 857, verbatim -- 'So the repaired M2 fires on none of the
        four corpus-recorded oracles.' And line 862, verbatim -- 'M2 now has
        exactly one firing instance anywhere in this program corpus, namely D1
        itself, and zero independent ones.'
      finding: >-
        BOTH SENTENCES ARE WRONG, and they are wrong in the direction that makes
        M2 stand up BETTER than the erratum reports, not worse. The repaired
        constructive M2 fires on the incidence oracle as that oracle is recorded
        in KN-FIND-b7e091 and its evidence record EV-GGM-79e710. See F-RT5.
        Independently of that refutation, the O(1) threshold that produces the
        census was chosen to fit D1 and is strictly stronger than the
        mathematics requires. See F-RT6.
      is_a_criterion_that_fires_once_still_a_criterion: >-
        The premise does not survive -- it fires at least twice, once
        independently of D1. But the underlying question deserves a direct
        answer, because the erratum will be read by someone who repairs the
        census and then still wants to know what M2 is worth. My answer: even
        with an independent firing instance, the repaired M2 is a DEFINITION and
        not an empirical criterion, and the erratum overstates what it
        contributes. Firing is by construction the exhibition of an O(1)
        handle-only simulator. For D1 that simulator is exhibited outright in
        section 5.1 of the superseded memo, and Shoup theorem applies to the
        exhibited simulator directly. M2 is therefore not a second route to the
        corroboration -- it is a NAME for the first route. Calling it 'a second,
        weaker, model-bound route' (erratum, what is demoted paragraph)
        overstates it by one route.
      is_the_corroboration_circular: >-
        NOT CIRCULAR, but weaker than presented, and for a reason the erratum
        half-states. It is not circular because D1 corroboration does not depend
        on M2 having been validated on other objects -- the simulator is
        exhibited, so Shoup applies whatever M2 does elsewhere. It IS weaker than
        presented because any weight drawn from Control B is a fit statistic on
        the training set, M1 and M2 having been abstracted from KN-FIND-002 four
        classifications and then validated by reproducing them. The erratum says
        this itself and deserves credit for it. What the erratum does NOT say is
        that the O(1) threshold was set after seeing D1 simulator -- the
        commissioning decision states the motive verbatim, 'D1 is unaffected
        because the memo exhibits exactly such a simulator' -- so the criterion
        boundary is fitted to the single instance it is then reported as
        classifying. That is a quantifier-order defect: the witness threshold is
        chosen after seeing the instance. It is recorded here as F-RT6.
      findings_raised: ['F-RT5', 'F-RT6', 'F-RT10']

    - attack: 'Attack 3 -- tier leakage across the split'
      result: 'breaks'
      finding: >-
        D1 disposal DOES still leak onto the record as a whole, in the Pareto
        section, which is the section a Coordinator composing a decision reads
        for the headline numbers. Erratum line 1010, verbatim and bolded in the
        source -- 'The record own promotion gate fails, by a different term than
        the record predicted.' And line 785, verbatim and bolded -- 'Under either
        reading lambda at least 1/2 which exceeds 0.45, so the record own
        promotion gate fails'. Neither sentence is scoped to D1. Both are
        record-level negative conclusions derived from a D1-only quantity,
        Corollary 4.2 informative-query density for the D1 oracle. Part 3
        withdraws exactly this class of conclusion, verbatim -- 'this erratum
        does not recommend a scoped rejection of ECDLP-IDEA-436 as a record'.
        The two cannot both stand. The record promotion gate lambda, mu at most
        0.45 is a gate on the RECORD, so asserting it fails asserts the record
        cannot be promoted, which is a record-level disposition. See F-RT7.
      where_the_split_is_clean: >-
        Section A does-not item 5, section B Part 2 and Part 3, section H items 1
        and 8, and section I item 3 are all correctly scoped and I could not
        break them. Section G opening line does scope the object studied to
        disjunct D1. The leak is not everywhere; it is in two bolded sentences
        that survived the repair because they were inherited verbatim from
        section 8 of the superseded memo, where the disposition WAS record-level
        and the sentence was therefore in scope. The repair changed the
        disposition and did not re-scope the inherited sentence.
      second_defect: >-
        A coherence defect running the other way, recorded as F-RT8. Section B
        Part 1 cites the frozen record own contractual gate as authority for
        disposing D1 -- verbatim, 'The GGM-simulability check is a gate, not a
        step: if the functional family is simulable, this record is rejected
        without running anything' -- and then Part 3 declines that same gate own
        stated consequence, which is record-level rejection. I verified against
        the frozen record that the gate says what the erratum quotes, and that
        the record separately lists 'simulability' and 'any exponent at or above
        0.5' among the conditions that 'falsifies this version'. The erratum is
        probably RIGHT that the gate is over-broad, because H is a disjunction
        and the frozen family named in the gate is D1. But it never says so. It
        borrows the gate authority for the half it wants and drops the half it
        does not, which leaves a downstream reader to resolve the conflict in
        favour of whichever sentence is more legible -- and the record own gate
        is far more legible than a three-part disposition.
      findings_raised: ['F-RT7', 'F-RT8']

  mandatory_controls:

    - control: 'Control A -- anomalous curves (KN-TECH-033) under the repaired constructive M2'
      independent_confirmation: 'CONFIRMED'
      what_i_did: >-
        I ran the repaired constructive M2 against psi, the Smart / Satoh-Araki
        / Semaev additive transfer on a curve with #E(F_p) = p, from the
        criterion statement and KN-TECH-033 alone. The criterion fires if and
        only if an EXPLICIT simulator answers each query in O(1) group
        operations, inversions and equality tests on handles and no other access.
        A psi-query must return an element of F_p that determines the discrete
        logarithm. No such simulator is exhibited anywhere in the erratum, the
        superseded memo, or KN-TECH-033. The antecedent is not discharged, so M2
        does not fire, so the chain M2 fires implies A-strict implies Shoup
        implies Omega(sqrt p) never starts, and the known-false conclusion is
        never reached. I independently confirm the erratum outcome: M2 does NOT
        fire on anomalous curves and the exponent-1/2 corroboration is NOT broken
        by this control.
      i_also_checked_the_level_2_argument: >-
        The non-existence direction is sound as stated: an O(1)-group-operation
        handle-only psi-simulator composed with one field division would be a
        generic DLP algorithm using O(1) group operations in a group of prime
        order p, contradicting KN-TECH-005. I verified KN-TECH-005 states the
        bound the argument needs, verbatim from its complexity frontmatter --
        'Omega(sqrt(p)) group operations for any generic DLP algorithm (p =
        largest prime factor of the group order)'.
      is_the_consistency_label_sufficient_honesty: >-
        The LABEL is sufficient and is better practice than the superseded memo,
        which reached the same outcome by invoking the absurdity of the
        conclusion without saying so. But the label does NOT discharge the
        weakness it names, and the erratum stops one step short of the
        consequence that actually matters. THE CONSEQUENCE: by converting M2 from
        an information-theoretic determination criterion into a burden-of-
        construction criterion, the repair makes M2 unable to fire on ANY object
        for which nobody has yet built a simulator. The Level 1 'mechanism check'
        is therefore not a check about psi at all -- it is a report that no
        simulator was built in this session, which under
        docs/inventor-protocol.md section 4 is the shape of a fatigue report
        about the search, not a statement about the object. And since the
        proves-too-much control fires only when the argument GOES THROUGH on a
        known-false object, and the repaired argument can no longer go through on
        anything unbuilt, the anomalous-curve control can no longer FAIL for M2
        under any object whatsoever. A control that cannot fail carries no
        information. So: the control PASSES, the pass is real, and the pass is
        very close to VACUOUS. The erratum labels the conditional half honestly
        and does not report that the unconditional half is unfailable. Recorded
        as F-RT10.
      does_it_hollow_out_the_control: >-
        For M2, yes, substantially. For M1 it does not -- M1 remains an
        information-theoretic rule, the control still fires on it, and that
        firing is the most valuable single result in this whole lane and is
        untouched by anything I found. The correct forward statement, which the
        erratum should carry, is that after the R-OBJ6 repair the anomalous-curve
        object is a discriminating control for M1 only, and that a discriminating
        control for the constructive M2 must be an object in the FIRING direction
        -- one where a simulator IS exhibited and the conclusion is false. That
        is RC-3, which is undischarged. The entire discriminating value of
        Control A for M2 has migrated onto an undischarged control, and that
        migration is not reported.

    - control: 'Control B -- the four corpus-recorded oracles'
      independent_confirmation: 'REFUTED, conditionally but on the plain reading'
      confirm_or_refute: 'REFUTE'
      what_i_did: >-
        The review plan states this control object as 'the four corpus-recorded
        oracles of KN-FIND-002 AND KN-FIND-b7e091'. I therefore ran the repaired
        M2 against the oracle definitions in BOTH records rather than only
        against KN-FIND-002. Jet: output is a rational function of coordinates,
        needs coordinate access, no handle-only simulator, does not fire --
        agrees with the erratum and with KN-FIND-002 own scope note that under
        the strictest GGM jet is non-simulable. Endomorphism: does not fire at
        O(log ell) under the erratum corrected eigenvalue argument, and would
        not have fired at KN-FIND-b7e091 own figure of m group operations
        either, since m group operations is not O(1) -- agrees with the erratum.
        Elliptic-net: O(log N), does not fire -- agrees. Incidence: THE ERRATUM
        USES ONLY KN-FIND-002 DEFINITION, and its own superseded memo section
        6.3 already recorded that the two records disagree here.
      the_refutation: >-
        KN-FIND-b7e091 records the incidence oracle, Oracle C, verbatim -- 'This
        is simulable in O(m) group operations per query -- the oracle output is
        determined by group operations and equality tests alone.' Its evidence
        record EV-GGM-79e710, observation O-2, is sharper still, verbatim --
        'Oracle C (incidence): SIMULABLE. The incidence check (does
        P_{i1}+...+P_{ir}=Q?) is fully checkable via group operations and
        equality tests (at most m group ops per query).' That is not a
        description of a hoped-for simulator; it is an exhibited one -- add the
        m factor-base points with the group law, compare the sum to Q with one
        equality test -- using group operations and equality tests on handles and
        no other access, at a cost of at most m group operations per query, where
        m is the fixed decomposition size of the index-calculus relation.
        KN-FIND-002 itself treats m as fixed, verbatim -- 'For fixed B, m this is
        constant, but B grows with problem size'. At fixed m that cost is O(1),
        and every clause of the repaired M2 firing condition is satisfied. THE
        REPAIRED M2 FIRES ON KN-FIND-b7e091 ORACLE C. Therefore the erratum
        headline consequence at line 857 is wrong, and its line-862 statement
        that M2 has exactly one firing instance anywhere and zero independent
        ones is wrong: it has at least two, and at least one of them is
        independent of D1 and is recorded in the corpus.
      conditionality_stated_honestly: >-
        The refutation holds if m is a fixed decomposition size, which is how
        both records use it and how index calculus uses it. If m is instead
        allowed to grow with problem size, O(m) is non-constant and M2 does not
        fire on Oracle C either. I cannot settle which reading BATCH-060 intended
        without opening records outside my read scope, so I report the refutation
        with its condition attached rather than as unconditional. What is NOT
        conditional is that the erratum ran the census against only one of two
        conflicting corpus definitions of the same oracle, did not disclose that
        it had done so, and reproduced the superseded memo dismissal of the
        disagreement -- 'The disagreement does not bear on this gate' -- which was
        true for the gate and is NOT true for a firing census under a new
        criterion. That is a methodological defect regardless of how m is read.
      what_if_it_truly_fires_on_none: >-
        Answering the plan question on its own terms, in case the Coordinator
        resolves m against me. If the census really were empty, M2 would not have
        collapsed into a restatement of its single instance -- it would be worse
        than that. It would be a rule that (a) cannot be shown not to fire on any
        object, by F-RT10, and (b) has never been shown to fire on any object
        other than the one whose simulator set its threshold. Such a rule has no
        content in either direction and supplies ZERO corroborative weight, not
        weak weight. The erratum would then be overstating the corroboration by
        calling it a second route. But the D1 corroboration itself would still
        stand, because it does not need M2 -- the simulator is exhibited and
        Shoup applies to it directly.

  findings:

    - id: 'F-RT1'
      severity: 'major'
      attack: 'Attack 1'
      title: >-
        The model-independence strengthening in section C.1 is FALSE as stated,
        and it is a false universal sentence of exactly the class R-F1 was
        commissioned to repair
      evidence: >-
        Erratum lines 255-265, verbatim in part -- 'Consequently Proposition E of
        section C.2 holds on every admissible integral model, with the single F_p
        comparison joined by the public model constant c; the re-founded ground
        of section B is not merely repaired by R-F1 but is independent of which
        admissible model is chosen.'
      why_it_is_false: >-
        Take the erratum own counterexample model from the paragraph immediately
        above, E-prime : Y^2 = X^3 + p^4 A X + p^6 B, obtained by x = u^2 X with
        u = 1/p. Its discriminant has valuation 12, so its reduction mod p is the
        singular cubic Y^2 = X^3 and coordinatewise reduction lands on the
        singular point (0,0) for EVERY point of the group. The erratum says this
        itself, three paragraphs earlier, as the defect it is repairing.
        Consequently on E-prime the F_p test in Proposition E -- compare the
        reduced X-coordinates -- returns EQUAL for every pair (j,k), while the
        correct value of the functional is min(c,r) = min(2,r) off the plus-minus
        locus and r on it. Proposition E, as stated, therefore returns r for every
        pair on E-prime and is FALSE there for every off-locus pair with r > 2.
        Adding 'the public model constant c' does not save it, because c fixes the
        VALUE and the failure is in the TEST: the reduced coordinates on E-prime
        carry no information about the locus at all. The correct repair is to
        normalise the coordinates by u^2 before comparing, i.e. to run the test on
        the minimal model, which is precisely the hypothesis R-F1 added and which
        this sentence claims to be able to drop.
      what_does_survive: >-
        Everything in the same paragraph EXCEPT the final sentence. That D1
        remains two-valued, remains constant in k off the locus, and that its
        separating predicate remains the group-theoretic k congruent to plus or
        minus j mod n -- all true on any admissible model, and that is what
        carries zero information and no leverage. The degeneracy really does move
        monotonically toward more degeneracy, never less. So the DISPOSITION is
        model-independent; the EVALUATION ROUTE stated in Proposition E is not.
      repair_action: >-
        Replace the final sentence of that paragraph with: 'Consequently the
        two-valuedness of D1 and its group-theoretic separating predicate hold on
        every admissible integral model, so the zero-information and no-leverage
        conclusion of section B is model-independent. Proposition E EVALUATION
        ROUTE is not: on a model that does not realise the good reduction the
        reduced coordinates are all equal and the single F_p comparison decides
        nothing, so the comparison must be performed on coordinates normalised by
        the public constant u, equivalently on the minimal model. That is the
        hypothesis R-F1 added and it is not removable.'
      does_it_change_the_disposition: 'No.'

    - id: 'F-RT2'
      severity: 'major'
      attack: 'Attack 1'
      title: >-
        The cost qualification is stated correctly once and CONTRADICTED in the
        section that discharges the interface repair
      evidence: >-
        Erratum line 343, verbatim -- 'so the oracle saves at most two scalar
        multiplications per query, O(log n) group operations, and nothing else.'
        Erratum line 561, verbatim -- 'and the O(log n) materialisation is a cost
        the adversary pays with or without the oracle.'
      why_they_conflict: >-
        On branch D-integer the adversary presents the integers j, k and receives
        the answer. It therefore does NOT materialise [j]S and [k]S when it uses
        the oracle, and DOES materialise them on the erratum own account of the
        self-computation route when it does not. The materialisation is a cost
        paid only WITHOUT the oracle. Line 561 asserts the opposite, and in
        asserting it restores exactly the unqualified 'literally nothing' claim
        that line 343 explicitly declines. This is the failure mode the review
        plan named -- a qualification that appears once and is dropped elsewhere
        -- and it is worse here than a drop, because line 561 is inside section
        C.5, which IS the repair of the interface question R-OBJ7, and because it
        is the sentence the erratum uses to argue that the model-free ground is
        indifferent to Fork D.
      repair_action: >-
        Replace line 561 clause with the sharp statement of F-RT3, which makes
        the Fork-D indifference claim TRUE rather than merely asserted: on branch
        D-integer the adversary can decide the predicate from j, k and n alone by
        two reductions mod n and one comparison, so the materialisation is not
        needed on either side and the oracle saves O(log n) BIT operations, not
        O(log n) group operations. The Fork-D indifference conclusion then stands
        on a correct premise.
      does_it_change_the_disposition: 'No. It strengthens it.'

    - id: 'F-RT3'
      severity: 'medium'
      attack: 'Attack 1'
      title: >-
        The stated cost qualification is not tight, and it is stated for an
        interface the frozen family is not written in
      evidence: >-
        Proposition E chain establishes, through Lemma 2, that inv_{j,r}(k) is
        the indicator of k congruent to plus or minus j mod n. Erratum section
        C.2 nonetheless routes the self-computation through the curve -- 'it
        materialises [j]S and [k]S in O(log n) group operations each by
        double-and-add and then does the one comparison'.
      the_sharper_fact: >-
        On the D-integer branch the adversary already holds j and k as integers
        and n is public, so it decides the predicate by reducing j and k mod n
        and comparing against plus and minus. That is O(log n) BIT operations,
        not two scalar multiplications, and no point is ever materialised and no
        F_p element is ever touched. The erratum own qualification is a valid
        UPPER bound on the saving and is therefore not a false statement, but it
        overcharges the self-computation route by routing it through the elliptic
        curve when a purely arithmetic route is available, and it thereby
        UNDERSTATES its own conclusion. The consequence for the framing is not
        cosmetic: R-OBJ7 own finding is that the frozen family is written
        integer-indexed, so D-integer is the branch the family is literally
        written in, and on that branch the headline sentence 'computed from the
        F_p coordinates of [k]S and [j]S by a single F_p equality test' names a
        route the adversary has no reason to take.
      correct_three_way_cost_statement: >-
        The erratum should state three cases, not two. (i) Integer interface --
        two reductions mod n and one integer comparison, O(log n) bit operations,
        no group element and no field element touched. (ii) Coordinate-bearing
        points, which includes a rho walk state and the structured GGM -- one F_p
        x-coordinate comparison, plus a small fixed number of F_p multiplications
        first if points are held projectively or in Jacobian coordinates. (iii)
        Opaque Shoup handles -- one inversion and two equality tests on the group
        oracle, because the adversary has no coordinates at all. The oracle
        supplies no leverage in any of the three, which is the claim, and the
        claim is strongest in case (i).
      repair_action: >-
        Add the three-case statement to section C.2 consequences and cross-
        reference it from section B, so the qualification is stated where the
        disposition is stated and not only where the limitation is admitted.
      does_it_change_the_disposition: 'No. It strengthens it.'

    - id: 'F-RT4'
      severity: 'medium'
      attack: 'Attack 1'
      title: >-
        'The handle interface' is used with two incompatible meanings, one of
        which makes the stated route unavailable
      evidence: >-
        Erratum line 339, verbatim -- 'If the party already holds the two points
        -- the handle interface, or a rho walk state -- the direct computation is
        one F_p comparison'. But the D-handle branch simulator of section C.5 is
        section 5.1 of the superseded memo, which is explicitly the A-STRICT
        Shoup simulator on OPAQUE LABELS -- INV(B), EQ(A,B), EQ(A,B-prime) -- and
        in that model the adversary holds no coordinates whatsoever and cannot
        perform any F_p comparison.
      why_it_matters: >-
        The conclusion survives on both readings, because in the opaque-handle
        case the oracle is simulable in O(1) group operations and so still
        supplies no leverage. What does not survive is the stated REASON. A
        reader checking the model-free ground against the strict branch will find
        that the sentence asserting the party 'already holds the two points'
        contradicts the model that branch is defined in. Given that the whole
        point of the re-founding is to be free of the generic-group model, having
        its central cost sentence silently assume the structured model is a
        defect worth one line to fix.
      repair_action: >-
        Say 'coordinate-bearing points -- a rho walk state, the structured GGM,
        or any real adversary on a real curve' rather than 'the handle
        interface', and add the opaque-handle case explicitly as case (iii) of
        F-RT3.
      does_it_change_the_disposition: 'No.'

    - id: 'F-RT5'
      severity: 'major'
      attack: 'Attack 2 / Control B'
      title: >-
        The headline consequence is refuted -- the repaired M2 fires on the
        corpus incidence oracle as KN-FIND-b7e091 and EV-GGM-79e710 record it
      evidence: >-
        EV-GGM-79e710 observation O-2, verbatim -- 'Oracle C (incidence):
        SIMULABLE. The incidence check (does P_{i1}+...+P_{ir}=Q?) is fully
        checkable via group operations and equality tests (at most m group ops
        per query).' KN-FIND-b7e091, verbatim -- 'This is simulable in O(m) group
        operations per query -- the oracle output is determined by group
        operations and equality tests alone.' KN-FIND-002, verbatim -- 'For fixed
        B, m this is constant, but B grows with problem size.' Repaired M2
        firing condition, erratum line 428, verbatim -- an explicit simulator
        answering each query using 'O(1) group operations, inversions and
        equality tests on handles, and no other access'.
      the_argument: >-
        Every clause of the firing condition is met by the incidence CHECK oracle
        at fixed m. The simulator is explicit and one line: add the m factor-base
        handles with the group law and compare the sum to the target handle with
        one equality test. It uses group operations and equality tests on handles
        and no other access -- no coordinate access, no field arithmetic, no local
        bit-work growing with the instance. Its cost is at most m group
        operations, which is O(1) for fixed decomposition size m. The repaired M2
        fires. This is a corpus-recorded oracle, it is named in the review plan
        Control B object, and it is INDEPENDENT of D1.
      the_erratum_error_in_one_sentence: >-
        The erratum census scored the incidence row using KN-FIND-002 SEARCH
        oracle, which reports WHICH subsets sum to Q at O(B^m), and did not score
        KN-FIND-b7e091 CHECK oracle, which verifies whether a GIVEN subset sums
        to Q at O(m) -- two different oracles that the corpus records under one
        name and that the superseded memo section 6.3 had already flagged as
        disagreeing, with the dismissal 'The disagreement does not bear on this
        gate'. True for the gate. Not true for a firing census under a criterion
        the gate did not have.
      consequences: >-
        Line 857 'fires on none of the four corpus-recorded oracles' is wrong.
        Line 862 'exactly one firing instance anywhere in this program corpus,
        namely D1 itself, and zero independent ones' is wrong. Section E.2 'its
        M2 score drops to zero' is wrong. The sharpest adverse consequence the
        erratum reports about itself therefore does not hold as stated, and the
        weight it lends to the routed KN-FIND question is correspondingly less
        than the routing decision was told.
      repair_action: >-
        Re-run the Control B census over BOTH records oracle definitions, score
        the incidence row on each definition separately, disclose the split, and
        restate the consequence as: the repaired M2 fires on the incidence CHECK
        oracle of KN-FIND-b7e091 at fixed m and on D1 on the handle branch, and
        does not fire on jet, endomorphism, elliptic-net, or KN-FIND-002
        incidence SEARCH oracle. Then restate section E.3 accordingly -- M2 has
        one corpus firing instance independent of D1, so OBJ-5 is partly
        discharged rather than sharpened, and RC-3 remains wanted but is no
        longer the only thing standing between M2 and an empty column.
      does_it_change_the_disposition: >-
        No. It changes a reported consequence and it improves M2 standing. It
        does not touch Proposition E or the D1 disposition. It DOES bear on the
        routed round, which is why it is reported and not acted on.

    - id: 'F-RT6'
      severity: 'major'
      attack: 'Attack 2'
      title: >-
        The O(1) threshold in the repaired M2 was chosen after seeing D1
        simulator and is strictly stronger than the mathematics requires; the
        adverse consequences the erratum reports are artifacts of that choice
      evidence: >-
        DEC-20260831-a9716f, R-OBJ6 repair text, verbatim -- 'Restate M2
        constructively with its O(1) cost bound - M2 fires if and only if there
        is an EXPLICIT simulator answering each query with O(1) group operations,
        inversions and equality tests on handles - and re-run Control A half 2
        against the repaired statement, recording the outcome. D1 is unaffected
        because the memo exhibits exactly such a simulator.'
      the_quantifier_order_defect: >-
        The final clause states the motive for the threshold: D1 exhibits an O(1)
        simulator, so O(1) is where the boundary goes. The witness threshold is
        chosen after seeing the instance. The erratum applies this faithfully and
        then reports the resulting census as a finding about the corpus, without
        recording that the boundary was fitted to the object being classified.
        That is not a repair to the erratum credit -- it inherited the threshold
        -- but the erratum is where the claim now lives and it is the artifact a
        later reader will open.
      why_the_threshold_is_too_strong: >-
        The purpose of the cost bound is to stop M2 from proving too much on
        psi. An n^{o(1)} bound does that just as well, by the erratum own Level 2
        argument: an n^{o(1)}-group-operation handle-only psi-simulator composed
        with one field division would be a generic DLP algorithm in n^{o(1)}
        group operations in a group of prime order, contradicting KN-TECH-005
        Omega(sqrt) bound exactly as an O(1) one would. And an n^{o(1)} bound
        preserves the conclusion the criterion exists to license: if an oracle is
        simulable with overhead c(n) = n^{o(1)}, an algorithm making T queries
        becomes a generic algorithm using T times c(n) group operations, so T is
        Omega(n^{1/2 - o(1)}) and the exponent-1/2 closure survives. KN-FIND-002
        concedes this in its own words about the elliptic-net oracle, verbatim --
        'Not closed at 1/2 by the constant-overhead bound, but O(log N) <<
        sqrt(N), so no sub-birthday advantage.' The O(1) boundary is therefore
        stricter than any mathematics in play requires, and the excess strictness
        is exactly what empties the census.
      what_it_would_change: >-
        Under an n^{o(1)} or polylog threshold, and independently of F-RT5:
        endomorphism fires at O(log ell); elliptic-net fires at O(log N); D1
        fires on BOTH Fork-D branches, so the corroboration does not narrow to
        the handle branch; the withdrawal of the section 6.2 M2 check-mark does
        not follow; Control A still passes on psi; and the two consequences the
        erratum reports as running against the superseded memo largely dissolve.
        The routed KN-FIND question would then be substantially smaller than the
        routing decision was told, because much of what looks like a
        contradiction with the corpus is produced by this lane own threshold
        choice rather than by the corpus.
      repair_action: >-
        Record the threshold as a DECLARED MODELLING CHOICE with its motive
        disclosed, not as a neutral repair. Then run the one-paragraph
        sensitivity check: restate M2 with an n^{o(1)} overhead bound, verify
        Control A still passes by the same Level 2 argument, re-run the Control B
        census, and report both censuses side by side. Zero compute. Whichever
        threshold the program adopts, the census must not be reported as a fact
        about the objects while the boundary that produced it is undeclared.
      does_it_change_the_disposition: >-
        No. The model-free ground uses neither M1 nor M2. It changes the reported
        consequences and it substantially reduces what is routed.

    - id: 'F-RT7'
      severity: 'major'
      attack: 'Attack 3'
      title: >-
        D1 disposal leaks onto the record in two bolded, unscoped sentences, one
        of them in the Pareto section
      evidence: >-
        Erratum line 1010, verbatim -- 'The record own promotion gate fails, by a
        different term than the record predicted.' Erratum line 785, verbatim --
        'Under either reading lambda at least 1/2 exceeds 0.45, so the record own
        promotion gate fails'. Erratum line 778 carries the same conclusion in
        weaker form. Compare erratum section B Part 3, verbatim -- 'this erratum
        does not recommend a scoped rejection of ECDLP-IDEA-436 as a record'.
        Compare the frozen record, verbatim -- 'Promotion requires lambda, mu <=
        0.45.'
      why_it_is_leakage: >-
        Both sentences derive from Corollary 4.2, which is a statement about the
        D1 oracle informative-query density. Nothing in the erratum computes
        lambda for a D2 functional, and D2 is by construction a different
        functional with a different density. The gate lambda, mu at most 0.45 is
        a gate on the RECORD, whose hypothesis H is D1 or D2, so 'the record own
        promotion gate fails' asserts that the record cannot be promoted, which
        is precisely the record-level disposition Part 3 withdraws. The
        provenance is visible: both sentences are inherited nearly verbatim from
        section 8 of the superseded memo, where the disposition WAS record-level
        and the sentence was in scope. The repair changed the disposition and did
        not re-scope the inherited sentence.
      why_it_is_dangerous_specifically: >-
        Line 1010 sits in section G, the Pareto and cost-accounting section, next
        to dominated_by and sota_delta. That is the section a Coordinator
        composing a decision reads for the headline quantities, and it is bolded
        there. This is the exact mechanism the erratum own OBJ-9 repair
        identifies, verbatim -- 'the mechanical route by which correctly-labelled
        tiers leak downstream'.
      repair_action: >-
        Rewrite both sentences to read: 'The record promotion gate fails AS
        INSTANTIATED BY D1, by a different term than the record predicted.
        Whether any D2 functional could meet the gate is not addressed by this
        erratum and is returned to the record with Part 2.' Also add a single
        line to section G stating that dominated_by and sota_delta are computed
        for D1 only and that D2 has no Pareto entry because it is not gated.
      does_it_change_the_disposition: >-
        It is the disposition. Left standing, the erratum simultaneously
        withdraws and reasserts the record-level negative conclusion.

    - id: 'F-RT8'
      severity: 'medium'
      attack: 'Attack 3'
      title: >-
        The frozen record own gate is cited as authority for Part 1 and its
        stated record-level consequence is declined in Part 3, without argument
      evidence: >-
        Erratum section B Part 1 quotes the record gate, verbatim -- 'The
        GGM-simulability check is a gate, not a step: if the functional family is
        simulable, this record is rejected without running anything'. I confirmed
        against the frozen record that the quotation is exact, and that the same
        record separately lists among its falsification conditions, verbatim --
        'Constancy, simulability, rho_r >= 1/2, orientation advice, or any
        exponent at or above 0.5 falsifies this version.'
      the_conflict: >-
        Read literally, the record own contract says that D1 simulability plus an
        exponent at or above 0.5 rejects and falsifies THE RECORD. Part 3 says it
        does not. The erratum is probably right on the merits -- H is explicitly
        a disjunction, and 'the frozen family' named in the gate is D1 -- but it
        never makes that argument. It borrows the gate authority for Part 1 and
        drops its consequence in Part 3 silently. A downstream reader who checks
        the gate will find the record contract on one side and a three-part
        disposition on the other, with nothing in the erratum telling them which
        governs.
      repair_action: >-
        Add one paragraph to Part 3: state that the record own gate, read
        literally, would reject the record on D1 simulability alone; state that
        this erratum declines that reading because H is written as a disjunction
        and only the first disjunct is the frozen family the gate names; and flag
        the over-broad gate wording as a defect of the frozen record for the
        Coordinator to consider separately, since the record is frozen and cannot
        be edited here.
      does_it_change_the_disposition: 'No, but it is what makes Part 3 defensible rather than asserted.'

    - id: 'F-RT9'
      severity: 'medium'
      attack: 'Attack 1 / scope sufficiency'
      title: >-
        A hypothesis Proposition E needs is not in the Scope of Part 1 block --
        the truncation and cap convention
      evidence: >-
        Proposition E returns the cap value r on the plus-minus locus. That value
        exists only under the convention 'report min(v_p, r), with the cap value r
        standing for valuation at least r, including the exactly-zero
        difference', which is stated in section 1.2 of the SUPERSEDED memo. The
        erratum Scope of Part 1 block says only 'D1 exactly as written'. But the
        frozen record does NOT write the convention -- the superseded memo says so
        itself in section 5.3, verbatim -- 'the frozen family in ECDLP-IDEA-436
        does not state the convention'. So 'D1 exactly as written' is
        under-determined at precisely the point Proposition E value depends on.
      second_smaller_item: >-
        The nonidentity hypothesis j, k not congruent to 0 mod n is stated in
        Part 1 prose and in Proposition E, but is NOT in the Scope of Part 1
        bullet list, which is the block a later record will copy. R-F1 was
        commissioned because a hypothesis lived outside the quantifier list; the
        same shape recurs here at lower severity.
      repair_action: >-
        Add to the Scope of Part 1 block, as two further bullets: the truncation
        convention min(v_p, r) with cap r meaning at least r; and j, k not
        congruent to 0 mod n. Note in one clause that the convention is supplied
        by this lane and not by the frozen record, and that section 5.3 of the
        superseded memo shows the disposition is independent of which convention
        is chosen -- which makes the addition cheap and honest rather than a new
        restriction.
      does_it_change_the_disposition: 'No.'

    - id: 'F-RT10'
      severity: 'medium'
      attack: 'Control A'
      title: >-
        The constructive repair makes the proves-too-much control unable to fail
        for M2 on any object, and that consequence is not reported
      evidence: >-
        Repaired M2 fires if and only if an explicit simulator is EXHIBITED.
        Erratum Level 1, verbatim -- 'No such simulator is exhibited for psi, and
        the repaired criterion supplies no other route to firing.'
      the_objection: >-
        Non-exhibition is a fact about the search, not about psi. The
        proves-too-much control fires when the argument GOES THROUGH on a
        known-false object; under a burden-of-construction criterion the argument
        can never go through on an object nobody has built a simulator for, so
        the control can never fail for M2, for psi or for anything else. Under
        docs/inventor-protocol.md section 4 that is the shape of a fatigue report
        wearing the label of a mechanism check. The erratum correctly labels the
        conditional Level 2 step and correctly records that the negative direction
        is not independently checkable. It does not record that the
        UNCONDITIONAL step is unfailable, which is the stronger and more useful
        statement.
      assessment_the_task_asked_for: >-
        Is the consistency label sufficient honesty, or does it hollow out the
        control? The LABEL is sufficient. The CONTROL is substantially hollowed
        out for M2, though not for M1, where it still fires and where its firing
        remains the most valuable result in the lane. The honest forward
        statement is that the discriminating value of Control A for M2 has
        migrated entirely onto RC-3, an undischarged control in the FIRING
        direction, and that migration should be stated where the control outcome
        is stated.
      repair_action: >-
        Add to section C.4 Level 1: 'Note that non-exhibition is a statement
        about this search, not about psi. Under a burden-of-construction
        criterion the proves-too-much control cannot fail for M2 on any object,
        so its pass here carries little information about M2 and the
        discriminating burden moves entirely to RC-3, a held-out object in the
        FIRING direction. The control remains fully discriminating for M1, where
        it fires.'
      does_it_change_the_disposition: 'No.'

    - id: 'F-RT11'
      severity: 'low'
      attack: 'Pareto and baseline honesty'
      title: 'Three completeness gaps in section G, none of which change a number'
      items:
        - >-
          The frontier table has time and memory columns but no data/query
          column; that axis is handled in prose only. Since the claim is
          sota_delta +0 on the data/query exponent, the axis should appear in the
          table it is claimed on.
        - >-
          The closest SPECIALIZED baseline for a p-adic lifting proposal is
          KN-TECH-033, the anomalous additive transfer at O(log p) field
          operations, and it is correctly excluded from scope. But section G never
          says that the reason no specialized baseline appears as a frontier row
          is the scope exclusion. A reader checking the Pareto block against my
          role contract requirement to compare against the closest specialized
          baseline will find it absent with no stated reason.
        - >-
          dominated_by and sota_delta are computed for D1 only. Section G opening
          line does scope the object studied to D1, so this is not leakage in the
          F-RT7 sense, but the block should say in one clause that D2 has no
          Pareto entry because it is not gated.
      repair_action: >-
        Add a data/query column to the table; add one sentence naming
        KN-TECH-033 as the closest specialized baseline and the scope exclusion
        as the reason it is not a comparison row; add one clause scoping
        dominated_by and sota_delta to D1.
      does_it_change_the_disposition: 'No.'

  cost_model_challenges:
    - >-
      END-TO-END COST HONESTY OF THE MODEL-FREE CLAIM: adequate in structure,
      wrong in one number, inconsistent in one place, and untight in a third.
      Structure is good -- memory is stated beside time at section D.8, the
      profile-vector setup cost is charged, the reference-handle materialisation
      is charged as R-OBJ7 directed, the amortisation is stated with its
      crossover at |J| = Omega(log n), and nothing hides in an o(1) because the
      O(1) is literally one inversion and two equality tests. The defects are
      F-RT2, F-RT3 and F-RT4. None of them makes the oracle useful.
    - >-
      NO PER-ATTEMPT VERSUS TOTAL-EXPECTED CONFUSION. There is no success
      probability in this claim to divide by. The relevant bookkeeping analogue
      is Corollary 4.2 -- one query returns at most one bit and against a fixed
      reference that bit is 1 with probability 2/n -- and the erratum does carry
      the inverse-density term through into lambda rather than costing a query in
      isolation. That is the right shape and I could not break it.
    - >-
      THE VAN OORSCHOT-WIENER INTERPOLATION IS PERFORMED, not omitted, and its
      conclusion is correct for the reason given: D1 supplies no memory axis and
      no parallelism axis, so there is no point at which it interpolates along
      the vOW curve. I verified the KN-TECH-006 figures the row rests on --
      'expected ~0.886*sqrt(n) group operations serial; ~sqrt(n)/m wall-clock on
      m processors; small per-processor memory' -- verbatim from that record
      complexity frontmatter.
    - >-
      ONE OFF-BOOK CONSTANT: 'a single F_p equality test' presumes affine
      coordinates. In the projective or Jacobian representation used by any real
      implementation and by any fast rho walk, comparing x-coordinates costs a
      small fixed number of F_p multiplications before the equality test. This is
      O(1) field operations and cannot change any exponent, so it is reported as
      a disclosure item rather than a defect. It is named because the review plan
      asked whether anything was moved off-book to make the test free, and this
      is the honest small answer alongside the large one at F-RT1.
    - >-
      NO ELIMINATED-DIMENSION ACCOUNTING ERROR. The KN-LIT-7593 pattern -- an
      invariance that removes a search dimension without charging the cost of
      computing the invariant -- does not arise here, because the erratum is
      arguing that a candidate supplies no advantage rather than claiming one.
      The direction of the accounting is safe: any uncharged cost would make the
      candidate look BETTER than it is, and it still supplies nothing.

  scope_challenges:
    - >-
      IS THE STATED SCOPE SUFFICIENT FOR EVERY STEP? Almost. The additions the
      erratum made are the right ones: v_p(Delta) = 0 fixes the model, which
      Lemma 1 genuinely needs and which the superseded memo genuinely lacked; and
      n prime, confined to the corroboration, is exactly where the imported
      exponent needs it and nowhere else. I checked each step against the block.
      Lemma 1 needs good reduction, an integral model realising it, gcd(n,p) = 1
      and k not congruent to 0 -- covered. Lemma 2 needs a Weierstrass model, a
      cyclic group of order n and both indices nonzero -- covered except for the
      nonzero indices not appearing in the bullet list. Proposition 4 needs both
      -- covered. Proposition E additionally needs the truncation and cap
      convention, which is NOT in the block and is not in the frozen record
      either. That is F-RT9, and it is the one hypothesis a step needs that is
      still not listed.
    - >-
      THE SCOPE EXCLUSIONS ARE CORRECT AND WELL PLACED. Carrying 'any point whose
      order is divisible by p, which includes every generator of an anomalous
      curve' up into section B rather than leaving it in a section 10 block is
      the single most important scope sentence in the round and it is now where a
      reader will hit it. I confirmed the underlying reason independently: an
      anomalous curve has #E(F_p) = p, so a generator has n = p and gcd(n,p) = p,
      violating Assumption 1 of the frozen record; there is no canonical
      order-n prime-to-p lift of a point of order p, so the functional is
      undefined rather than merely uninformative, and the record own declared
      positive control is not executable. That is right, and the erratum is
      right to say the lane says nothing about the additive transfer.
    - >-
      NO SCOPE INFLATION IN EITHER DIRECTION. I looked specifically for a
      widened negative -- an out-of-scope impossibility claim dressed as a
      scoped one -- and did not find one. Section H items 1, 2, 3, 7 and 8 hold
      the line, including the explicit refusal to close KN-OPEN-3417fc, which I
      verified is correct: that record quantifies over any computable functional
