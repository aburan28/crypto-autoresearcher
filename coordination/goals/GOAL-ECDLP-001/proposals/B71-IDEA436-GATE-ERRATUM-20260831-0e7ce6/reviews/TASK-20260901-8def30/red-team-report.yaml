  heuristic_challenges:
    - >-
      This is a derivation-tier negative disposition, not an exponent-first
      heuristic-conditional claim in the target-result-profile sense, so the
      numbered-heuristic apparatus does not apply as written. What DOES apply is
      the demand that every conditionality be declared, and on that the erratum
      is mostly good and has one gap.
    - >-
      DECLARED AND CORRECTLY CARRIED: the corroboration is conditional on
      KN-TECH-005, and the barrier caveat is quoted forward verbatim wherever the
      corroboration appears. I verified the quotation against KN-TECH-005 lines
      37 and 40-43 and it is accurate, including the sentence naming anomalous
      curves and extension-field index calculus as living in the model blind
      spot. The KN-LIT-7606 scoping sentence is likewise accurate, and its own
      disclosure -- 'Full text was not read; the fetched PDF did not yield
      extractable text' -- is carried, which is exactly right for a load-bearing
      pointer that nobody has read.
    - >-
      DECLARED: Fork A and Fork D are both left open as formalization parameters
      rather than adjudicated, and the erratum says which conclusions depend on
      which. That is the correct treatment of an unresolved model parameter.
    - >-
      THE GAP: the O(1) overhead boundary in the repaired M2 is an UNDECLARED
      modelling choice with a fitted motive, and it is load-bearing for three
      reported consequences. It is not labelled as a choice anywhere. See F-RT6.
      A modelling parameter that determines a reported census must be declared
      with the same discipline as Fork A and Fork D, and this one is not.

  proof_architecture_challenges:
    - attack: 'quantifier-order'
      result: 'FIRES, twice'
      detail: >-
        First on the M2 threshold: the boundary O(1) is chosen after seeing D1
        simulator, per the commissioning decision own words. That is a witness
        selected after seeing the instance. Second, in weaker form, on the
        Weierstrass model: R-F1 correctly added the model to the quantifier list,
        and then section C.1 final sentence quantifies Proposition E over 'every
        admissible integral model' where it is false. The erratum fixed a
        quantifier slip and introduced a smaller one in the same section.
    - attack: 'nearby-object'
      result: 'passes for the disposition, fires for the evaluation route'
      detail: >-
        The nearest object on which the conclusion is false for the evaluation
        route is the erratum own non-minimal model E-prime, and Proposition E
        stated test fails there. See F-RT1. For the DISPOSITION -- zero
        information, no leverage -- I could not find a nearby object that breaks
        it: the two-valuedness and the group-theoretic separating predicate
        genuinely survive every admissible model change.
    - attack: 'method-ceiling'
      result: 'passes'
      detail: >-
        The largest claim the model-free ground can support is exactly what it
        claims -- D1 supplies no information and no leverage beyond a quotient
        already free in E(F_p). It cannot and does not reach any statement about
        ECDLP hardness, about D2, or about any other functional, and the erratum
        says so in section H. The ceiling reaches the headline with nothing to
        spare, which is the honest position.
    - attack: 'boundary-and-strictness'
      result: 'passes'
      detail: >-
        The old method -- Pollard rho with the negation map -- is genuinely
        embedded as the boundary, and D1 is not strictly better anywhere: +0 on
        every axis, strictly worse once the per-query cost is charged. The
        erratum does not claim otherwise.
    - attack: 'compositional-invariant'
      result: 'passes'
      detail: >-
        I deleted each hypothesis in turn and located the first step that fails.
        Drop good reduction, Lemma 1 fails at integrality. Drop the minimal model,
        Lemma 1 reduction is degenerate and Proposition E test fails, which is
        F-RT1. Drop gcd(n,p) = 1, the point can lie in the formal group and Lemma
        1 fails. Drop the Weierstrass form, Lemma 2 plus-minus fibre structure
        fails. Drop nonzero indices, x is undefined at the identity. Each
        deletion breaks a named step and the strong invariant does imply the
        final target. The decomposition is sound.
    - attack: 'observation-fiber'
      result: 'passes and is in fact the erratum own best content'
      detail: >-
        Holding inv_{j,r} fixed and varying the underlying object cannot place
        two preimages on opposite sides of the conclusion, because the fibre of
        the functional IS the plus-minus fibre, which is a group-theoretic object
        the target operations respect. That is Corollary 4.3 and it is what makes
        the re-founding work. The section F resource reading -- that the collapse
        is RIGIDITY, and that the first genuinely untried object is a multi-point
        functional whose mod-p vanishing locus is neither a union of plus-minus
        fibres nor a group-law relation -- is the sharpest transferable statement
        in the artifact and it is correctly labelled as a candidate for ranking
        and never as evidence.

  reduction_and_scope_challenges:
    - >-
      NO CITED REDUCTION IS MIS-INSTANTIATED. The one imported theorem is Shoup
      via KN-TECH-005, and its hypotheses are correctly checked: the largest-
      prime-factor form is respected by R-OBJ2, the Omega(sqrt n) form is
      withdrawn for composite n and asserted nowhere in the erratum, and I
      confirmed the withdrawal by searching the artifact. KN-TECH-030 is
      correctly used as the reason the withdrawal is an error rather than a
      pedantry.
    - >-
      THE AFFECTED-VERSUS-SAFE SCOPE IS NOT INFLATED. What is disposed is one
      disjunct of one functional family; what is explicitly not disposed is D2,
      KN-OPEN-3417fc, face F2, and anything about anomalous curves. I checked
      each of those claims against the record it names and each is correct.
    - >-
      ONE ROUTING CLAIM I CHECKED AND ACCEPT: the erratum says no downstream
      record may cite it as having retiered KN-FIND-002 or KN-FIND-b7e091. That
      matches DEC-20260831-a9716f routed_separately_not_this_lane, which states
      that until the separate round runs both records stand as committed. The
      erratum honours this. My own F-RT5 bears on that routed round and is
      reported here for the Coordinator to feed into its plan; I take no action
      on either record and edited neither.

  counterexample_or_mutation: >-
    The decisive counterexample is the erratum own non-minimal model. Take E over
    Z_p with v_p(Delta) = 0 and apply x = u^2 X with u = 1/p to obtain E-prime :
    Y^2 = X^3 + p^4 A X + p^6 B. On E-prime every point reduces to the singular
    point (0,0), so the F_p test in Proposition E returns EQUAL for every pair
    (j,k), while the correct functional value is min(2,r) off the plus-minus locus
    and r on it. For r > 2 Proposition E is therefore FALSE on E-prime, which
    refutes the section C.1 claim that it 'holds on every admissible integral
    model'. This is a mutation of a single hypothesis in the erratum own text,
    costs nothing to check, and localises the defect to one sentence.

  cheapest_falsification_control:
    for_what_i_find_most_doubtful: >-
      The most doubtful thing in the erratum is not Proposition E, which is
      sound. It is the M2 firing census and the adverse consequences drawn from
      it, because the census threshold was fitted to the single object it then
      classifies and the census was run against only one of two conflicting
      corpus definitions of the same oracle.
    control: >-
      A ZERO-COMPUTE THRESHOLD SENSITIVITY RE-CENSUS. Restate the repaired M2
      once with the O(1) bound and once with an n^{o(1)} bound. For each, (i)
      re-run Control A on psi -- both pass, by the same Level 2 argument, so the
      proves-too-much control does not distinguish them; and (ii) re-run the
      Control B census over the oracle definitions of BOTH KN-FIND-002 and
      KN-FIND-b7e091, scoring the incidence row separately under the SEARCH
      definition (O(B^m)) and the CHECK definition (at most m group ops). Report
      the two censuses side by side. Cost: one paragraph, no compute, no new
      records, no status change.
    what_it_would_falsify: >-
      If the two censuses agree, the O(1) threshold is not load-bearing and the
      erratum reported consequences stand as facts about the objects. If they
      disagree -- which my own reading says they will, on at least the
      endomorphism, elliptic-net and incidence rows and on D1 own integer branch
      -- then 'M2 fires on nothing', the narrowing of the corroboration to the
      handle branch, and the withdrawal of the section 6.2 check-mark are all
      artifacts of a fitted threshold rather than findings, and the routed
      KN-FIND question is substantially smaller than the routing decision was
      told. Either outcome is decisive and neither costs anything.
    why_this_is_the_cheapest: >-
      It is pure text against records already open in this lane. The one control
      that is cheaper still -- open EV-GGM-79e710 O-2 and check the incidence
      CHECK oracle against the repaired M2 firing condition -- I have already run,
      and it refutes the headline outright. See F-RT5.
    cheapest_compute_bearing_control_second: >-
      If the Coordinator wants one measurement rather than one paragraph, the
      cheapest useful one is a two-model toy tabulation, and it is a strict
      subset of RC-1. Tabulate inv_{j,r}(k) at small p over all j, k for r in
      {1,2,3,4} on (a) a minimal good-reduction model and (b) the explicit
      E-prime above. The derivation makes fully determined and DIFFERENT
      predictions: on (a) values {0, r} with image size 2, flat in r; on (b)
      values {min(2,r), r}, so image size 1 for r at most 2 and image size 2 with
      values {2, r} for r at least 3. This is the null-object control the lane
      lacks, and it is better than the record own declared negative control
      because the parameter that is SUPPOSED to move the quantity actually moves
      it: the flat-in-r artifact tell that docs/inventor-protocol.md section 3
      flags is discharged by exhibiting a parameter (the model constant c) under
      which the quantity provably does move. An implementation returning the same
      thing on both models is measuring its own truncation convention rather than
      the curve, and that is exactly the failure validation cannot otherwise see.

  escalation_determination:
    unrecoverable_result_review_fires: false
    does_the_erratum_itself_contradict_prior_validated_evidence: 'No.'
    reasoning: >-
      I assessed this directly rather than absorbing it, as the task card
      requires, and I considered the three candidates. FIRST, the End_{F_p}(E) =
      Z premise. The erratum is mathematically RIGHT that the premise is false --
      the p-power Frobenius lies in End_{F_p}(E) and has degree p, while [m] has
      degree m squared, and p prime is not a square -- and KN-FIND-b7e091 and
      EV-GGM-79e710 O-3 do both state that premise. But this is not new with the
      erratum. It was raised in the prior round, is recorded as CC-2 by
      DEC-20260831-a9716f, and is already routed to a review-breakthrough round.
      The erratum reproduces it, confines the correction to this lane own
      reproduction, and acts on neither record. It is the separately routed
      question, not a contradiction originating here. SECOND, the corrected
      endomorphism cost. The eigenvalue argument gives O(log ell) group
      operations where b7e091 stated m, which is Omega(ell) as literally written.
      That correction makes the endomorphism oracle CHEAPER to simulate and so
      STRENGTHENS b7e091 conclusion while repairing its premise. Strengthening a
      record conclusion on a repaired proof is not contradicting it. THIRD, and
      this was the live candidate the review plan singled out, the
      M2-fires-on-nothing finding. Had it held, it would have said that a
      criterion the corpus tiers rest on classifies none of the corpus oracles,
      which is close to falsifying a committed closure rather than bearing on it.
      IT DOES NOT HOLD. My Control B refutes it: the repaired M2 fires on the
      corpus incidence CHECK oracle at fixed m, independently of D1. The
      corrected census is therefore MORE consistent with the corpus than the
      erratum reported, not less, and the sharpest escalation candidate is
      removed by the refutation rather than by a judgement call.
    therefore: >-
      This round does NOT re-run at review-breakthrough. It stays at
      review-adversarial, and the correct disposal of my report is a bounded,
      zero-compute correction round on the erratum text, not a tier escalation.
    what_i_am_routing_rather_than_acting_on: >-
      F-RT5 and F-RT6 are new inputs to the SEPARATE review-breakthrough round on
      KN-FIND-002 and KN-FIND-b7e091, and they cut in the direction of that round
      finding LESS wrong with the corpus than DEC-20260831-a9716f was told. That
      round should be told, before its prior is written, that (i) the incidence
      row of the census was scored against only one of two conflicting corpus
      definitions, and (ii) the O(1) threshold that produced the census was
      fitted to D1 and is stricter than the exponent-1/2 conclusion requires. I
      have edited neither KN-FIND record, retiered neither, and changed no status.
    scope_compliance: >-
      No status changed. No raw artifact altered. ECDLP-IDEA-436 untouched and
      still frozen. KN-FIND-002 and KN-FIND-b7e091 not edited, not corrected, not
      retiered, and not opened for modification. Nothing written outside the
      declared write_scope. No git add, commit or push was performed.

  narrowest_supported_statement: >-
    What the erratum has actually earned, stated at the narrowest scope it
    supports. Under the repaired frozen setting -- E over F_p with good
    reduction, S of order n with gcd(n,p) = 1, a Weierstrass model over Z_p with
    v_p(Delta) = 0, the canonical order-n prime-to-p lift, the truncation
    convention min(v_p, r) with cap r, and j, k not congruent to 0 mod n --
    Proposition E is TRUE: inv_{j,r}(k) equals r when [k]S and [j]S have the same
    x-coordinate and 0 otherwise, so D1 is exactly the indicator of the fibre k
    congruent to plus or minus j mod n, that is equality in the quotient
    <S>/{plus-minus 1}. That quotient is available free in E(F_p) and is already
    exploited by Pollard rho negation map, so D1 supplies zero information to any
    adversary -- generic or not, at any scale -- and no computational leverage
    beyond it. The saving is at most O(log n) bit operations per query on the
    integer interface where the frozen family is written, at most one F_p
    comparison where the adversary holds coordinate-bearing points, and one
    inversion plus two equality tests where it holds only opaque Shoup handles.
    In all three cases the saving is negligible against n^{1/2}. This ground
    needs no generic-group model, no Fork-A adjudication, no Fork-D
    adjudication, and no primality hypothesis, and it reaches non-generic
    adversaries that a GGM argument cannot. THAT MUCH IS SOUND AND SURVIVES EVERY
    ATTACK I RAN. What is NOT supported, and is what breaks the joint: that
    Proposition E holds on every admissible integral model (it does not -- F-RT1;
    only its two-valuedness and its separating predicate are model-independent);
    that the repaired M2 fires on none of the four corpus-recorded oracles (it
    fires on at least one independently of D1 -- F-RT5); and that the record own
    promotion gate fails, stated unscoped (only its D1 instantiation fails --
    F-RT7). Also unsupported as presented: that the O(1)-bounded M2 census is a
    fact about the objects rather than about a fitted threshold (F-RT6), and that
    the anomalous-curve control still discriminates for M2 (F-RT10). D2 remains
    correctly not gated. KN-OPEN-3417fc remains correctly open. Nothing here
    supports any statement about anomalous curves, and nothing here is evidence
    about ECDLP hardness in any direction.

  what_i_could_not_break: >-
    Recorded because a red team that reports only defects is not reporting a
    review. Proposition E survived a full independent re-derivation. The
    two-part split of a disjunctive hypothesis is substantively correct and is
    the most important structural repair in the erratum. The demotion of Shoup
    and 'closed at exponent 1/2' to corroboration is correct and is exactly what
