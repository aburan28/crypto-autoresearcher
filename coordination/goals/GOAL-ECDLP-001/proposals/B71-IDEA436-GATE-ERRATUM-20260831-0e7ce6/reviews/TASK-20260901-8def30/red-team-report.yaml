    in-r artifact tell named against the lane own interest, the withdrawal of the
    section 6.2 check-mark, the reviewer-favourable reading of Assumption 3
    adopted as operative. Every verbatim quotation I checked, and I checked
    eleven of them across seven records, was accurate. The provenance ledger in
    section J is unusually honest, including the disclosure that three records
    were read only in part and that the strict YAML parse could not be run by
    that session.

