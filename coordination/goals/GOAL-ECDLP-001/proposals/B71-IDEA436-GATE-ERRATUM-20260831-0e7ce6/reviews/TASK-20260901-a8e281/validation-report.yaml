    O(log l), non-constant, where KN-FIND-002 records SIMULABLE with O(1) overhead,
    closed at exponent 1/2. That is NOT a contradiction of KN-FIND-002. The two
    verdicts are reached under DIFFERENT CRITERIA - KN-FIND-002 classifies in the
    STRUCTURED GGM, where the curve equation is public and coordinate arithmetic is
    free, and its C = 0 for the endomorphism oracle is correct in that model; the
    repaired M2 explicitly forbids coordinate access and field arithmetic, so it is a
    strictly stronger criterion and naturally yields a different tier. A stricter
    criterion returning a different answer on the same object is a scoping
    observation about branch-dependence, which is exactly OFQ-1, and the Coordinator
    already determined in DEC-20260831-a9716f that OFQ-1 is a scoping observation and
    not a contradiction. The erratum is also careful in the right place - it corrects
    only THIS LANE'S OWN REPRODUCTION of the record (the superseded memo's section
    6.2 check-mark), states in section A item 3 and section H item 7 that it does not
    edit, correct, retier, supersede or contradict either finding record, and states
    that no downstream record may cite it as having retiered either.
  latent_tension_i_am_NOT_adjudicating: >-
    There IS a real tension inside KN-FIND-002 itself - it records jet and
    endomorphism as closed at exponent 1/2 by KN-TECH-005 while its own scope block
    says they would be NON-SIMULABLE under the strictest GGM, which is the only model
    where Shoup's theorem holds. That is CC-3 and it is routed to a separate
    review-breakthrough, max, degradable false round which has not been opened. I did
    not act on it, did not edit either record, and confirm both are byte-identical to
