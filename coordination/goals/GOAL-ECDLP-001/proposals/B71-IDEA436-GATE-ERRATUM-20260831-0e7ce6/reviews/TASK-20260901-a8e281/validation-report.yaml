  declined_sub_option:
    what_was_declined: 'The F-2 offer to DROP the p >= 3 hypothesis (and remove p = 2 from the section 10 exclusion list), on the ground that the argument runs unchanged at p = 2 on a general Weierstrass form.'
    scope_of_the_decline: 'A SUB-OPTION inside item OBJ-15 / F-2, not the item. The item itself - record that ordinary and p >= 3 are inherited and unused - is fully addressed at section D.7(a).'
    reason_given: >-
      Section D.7 records the decision and its reason - the erratum KEEPS ordinary
      and p >= 3 for consistency with the frozen ECDLP-IDEA-436 Assumption 1 and
