# FINDINGS
# =====================================================================
findings:
  - id: 'F-V1'
    severity: 'low, non-blocking, wording'
    title: 'The section C.1 robustness sentence overstates the covariant form of Proposition E, and the correct form is already elsewhere in the same document.'
    where: 'erratum section C.1, the paragraph headed what survives, and why the erratum re-founded ground is robust to this'
    what_it_says: >-
      Consequently Proposition E of section C.2 holds on every admissible integral
      model, with the single F_p comparison joined by the public model constant c.
    why_that_is_imprecise: >-
      Proposition E as boxed returns 0 off the plus-or-minus locus. On the very
      counterexample the same section constructs, E-prime with X = p^2 x, the correct
      value off the locus is min(2, r), not 0, so the BOXED statement does not hold
      there. Worse for the sentence as written, the F_p comparison cannot be
      performed on E-prime's own reduction at all - every prime-to-p torsion point
      has X = p^2 x congruent to 0 mod p, so all of them reduce to the singular point
      (0,0) of Y^2 = X^3 and the comparison is VACUOUSLY TRUE for every pair, giving
      r always, where the correct answer off the locus is min(2, r). The comparison
      must be performed on the good-reduction model; c is a correction constant, not
      a companion to a comparison done on the non-minimal model.
    why_it_is_only_low_severity: >-
      Three reasons. R-F1 was discharged by ADOPTING option R1, which pins
      v_p(Delta) = 0, so the operative statement is never evaluated on a non-minimal
      model. The paragraph is explicitly labelled a strengthening that follows from
      the validator's finding, not as a claim beyond it, so it is not load-bearing.
      And the CORRECT covariant form is already stated, by the same erratum, at
      section F - on a non-minimal integral model with c = -2 v_p(u) > 0 the image is
      {min(c,r), r}, degenerating to size 1 when r <= c. So this is an internal
      wording inconsistency between two sections, not an error in the mathematics,
      which the document gets right where it states it carefully.
    repair_action: >-
      Replace holds on every admissible integral model with - the COVARIANT FORM of
      Proposition E holds on every admissible integral model, with the F_p comparison
      performed on the good-reduction model and the value off the locus reading
      min(c, r) rather than 0, as section F states. Zero compute. Not blocking on any
      repair, any disposition, or this validation.
  - id: 'F-V2'
    severity: 'low, non-blocking, presentational'
    title: 'The section D summary sentence says none declined while the audit table records a declined_component, and section A promises addressed or explicitly declined.'
    where: 'erratum end of section D - Nine items, nine addressed, none declined - against erratum-audit.yaml lower_severity_items LS-7 declined_component, and against erratum section A'
    why_it_matters: >-
      Both statements are defensible on their own reading - the ITEM is addressed and
      the declined thing is a SUB-OPTION inside it - and section D.7 states the
      decline in full, so nothing is hidden and this is not a Gate 4 silence. But a
      reader who reads only the section D summary comes away believing nothing was
      declined, which is the mechanical route by which a correctly-recorded decline
      stops being visible downstream. That is the same failure mode the erratum
      itself repairs under OBJ-9, so it is worth fixing on its own terms.
    repair_action: >-
      Replace with - Nine items, nine addressed; one SUB-OPTION within OBJ-15 / F-2
      declined with its reason recorded at section D.7. Zero compute.
  - id: 'F-V3'
    severity: 'medium as a statement about evidential weight, non-blocking on J1'
    title: 'Control A passes at the antecedent level; its discriminating power in the non-firing direction is not measured, and the word PASSES conveys more than was established.'
    where: 'erratum section C.4 Control A half 2 re-run, and section E item 1'
    the_point: >-
      The repaired M2 fires only on the exhibition of an explicit simulator, so it is
      trivially non-firing on every object for which nobody has tried to build one -
      including objects where firing would be correct. Level 1, which the erratum
      calls the operative and unconditional check, therefore establishes only that
      the antecedent was not discharged for psi, which is a very weak thing to
      establish. The control's real evidential content is Level 2, no such simulator
      CAN exist, and that is precisely the half the producer correctly labels
      conditional on KN-TECH-005 and not independently checkable.
    what_i_am_NOT_saying: >-
      I am not saying the control is hollow and I am not saying R-OBJ6 is
      undischarged. The repaired M2 IS a better rule than the one it replaces,
      because the superseded memo blocked psi by the absurdity of the conclusion,
      which is the exact failure a proves-too-much control exists to catch. The
      producer identified that defect itself, repaired it, ran the re-run, recorded
      the outcome INCLUDING two outcomes that hurt its own memo, and disclosed the
      residual weakness in its own words. That is the behaviour the protocol wants.
    repair_action: >-
      In section C.4 and section E item 1, replace the bare the control PASSES with -
      the control passes AT THE ANTECEDENT LEVEL; the repaired M2's discriminating
      power in the non-firing direction is not measured and is discharged only by
      RC-3 on a held-out oracle class. That wording already exists in substance at
      section E.3 and should be carried to where the PASS is announced. Zero compute.
  - id: 'F-V4'
    severity: 'observation, not a defect - recorded because the plan asks for it plainly'
    title: 'A criterion with exactly one firing instance and zero held-out ones is a restatement of its instance, and the erratum says so itself.'
    detail: >-
      Confirmed under Control B above. M2 fires on D1 and on nothing else in the
      corpus, and only on the D-handle branch. Its corroborative value for D1 is
      therefore close to nil. This does NOT damage section B Part 1, because
      Proposition E uses neither M1 nor M2, and the erratum draws exactly that
      conclusion at section E.3. Recorded here so that a later reader composing this
      round does not treat M2 fires on D1 as an independent second line of support.
      RC-3 is the measurement that would change this, and it is correctly recorded as
      required and undischarged.
    repair_action: 'None required of the erratum, which already states it. The Coordinator composing this round should not count the corroboration as independent support.'
  - id: 'F-V5'
    severity: 'observation about the COMMISSIONING DECISION, not about the erratum'
    title: 'DEC-20260831-a9716f R-OBJ6 asserts D1 is unaffected; the erratum found that false on the integer branch and reported it.'
    detail: >-
      The decision's R-OBJ6 repair text ends - D1 is unaffected because the memo
      exhibits exactly such a simulator. Under the repaired constructive M2 that is
      false on the D-integer branch, because the exhibited simulator is O(1) on
      handles only and integer indices force O(log n) materialisation first. The
      erratum reports this as adverse consequence 1 rather than conforming to its
      task card. I record it for two reasons - the decision text now carries a
      superseded assertion that a later reader may cite, and the producer's
      willingness to contradict its own commissioning decision is the single
      strongest indicator I found that the six discharges are real rather than
