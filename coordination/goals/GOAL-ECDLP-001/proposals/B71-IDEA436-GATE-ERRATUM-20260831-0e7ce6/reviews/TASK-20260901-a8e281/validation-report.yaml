    conjunct_3_required: 'Carry KN-TECH-005 own barrier caveat forward VERBATIM.'
    conjunct_3_result: 'PERFORMED, and I checked the quotations byte-for-byte'
    conjunct_3_evidence: >-
      Section B quotes two KN-TECH-005 passages and one KN-LIT-7606 passage as
      block quotes. I opened all three source records and compared. KN-TECH-005
      line 37 reads - bound is a barrier, NOT a proof that no non-generic attack
