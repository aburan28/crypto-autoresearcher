# =====================================================================
# PHASE 1 - BLIND RE-DERIVATION OF PROPOSITION E
# =====================================================================
blind_rederivation:
  quantity: >-
    Proposition E - that inv_{j,r}(k) equals the truncation cap r when
    x([k]S) = x([j]S) in F_p and 0 otherwise, hence is computable from F_p
    coordinates alone by one equality test, with no lift and no p-adic arithmetic.
  performed: true
  blind: true
  blind_from_respected: true
  ordering_attestation: >-
    I derived Proposition E in full BEFORE opening either blind_from path. The
    derivation was written to a scratchpad file and hashed at
    2026-09-01T16:56:50Z, sha256
    1df2e97b01f31430b9f6539fec54b8db49dfc740cc0f545afcf5426bb804944c, and only
    after that hash was taken did I open
    ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate_erratum_20260831.md and
    the erratum-audit.yaml. The text reproduced below is that sealed file
    verbatim; nothing in it was revised after the comparison. During the blind
    phase I read ONLY the three permitted sources - the superseded memo
    ggm_simulability_gate.md, knowledge/techniques/KN-TECH-73630e.md, and
    standard formal-group and reduction theory from my own knowledge, which is
    marked recalled below. I did not open the snapshot receipt, the commissioning
    decision, or any review report during the blind phase.
  sealed_pre_read_sha256: '1df2e97b01f31430b9f6539fec54b8db49dfc740cc0f545afcf5426bb804944c'
  sealed_at_utc: '2026-09-01T16:56:50Z'
  sealed_file_note: >-
    The sealed file lives in this session scratchpad, which is outside the
    repository and outside my write_scope, so it is not committable. The hash
    above binds it and the verbatim text is carried into this committed report
    below, which is the durable record.
  derivation_verbatim: |-
    SETTING. W a Weierstrass model of E over Z_p,
    y^2 + a1 x y + a3 y = x^3 + a2 x^2 + a4 x + a6, with v_p(Delta_W) = 0.
    p >= 3. S in E(F_p) of prime order n, gcd(n,p) = 1. Shat in E(Q_p) the unique
    point of order n with red(Shat) = S. j, k /= 0 mod n.
    CONVENTION: inv_{j,r}(k) = min( v_p( x([k]Shat) - x([j]Shat) ), r ),
    with min(+inf, r) = r.

    STEP 1 (reduction is a homomorphism with pro-p kernel).
    v_p(Delta_W) = 0 makes W a good-reduction, hence minimal, model; its reduction
    Wbar/F_p is nonsingular and equals E/F_p. red : E(Q_p) -> E(F_p) is then a
    SURJECTIVE GROUP HOMOMORPHISM with kernel Ehat(pZ_p), the formal group of W on
    pZ_p. Ehat(pZ_p) is filtered by Ehat(p^i Z_p) with successive quotients
    isomorphic to (F_p, +), hence is PRO-p, hence contains no non-identity element
    of order dividing n when gcd(n,p) = 1. Therefore red restricted to E(Q_p)[n]
    is INJECTIVE, and red : <Shat> -> <S> is an isomorphism of cyclic groups of
    order n. [This is KN-TECH-73630e, re-derived rather than quoted.]

    STEP 2 (integrality and coordinatewise reduction).
    Let k /= 0 mod n. Shat has order n so [k]Shat has order n/gcd(k,n) > 1, so
    [k]Shat /= Ohat; by Step 1 [k]Shat is n-torsion and non-identity, so [k]Shat is
    NOT in ker(red). On W every point outside Ehat(pZ_p) has x, y in Z_p (points of
    the kernel have v(x) <= -2, v(y) <= -3), and red is coordinatewise reduction
    mod p. Hence x([k]Shat) is in Z_p and x([k]Shat) = x([k]S) mod p.

    STEP 3 (x-fibres are exactly the plus-or-minus pairs, over ANY field).
    Fix x = x0. The Weierstrass equation becomes a MONIC QUADRATIC in y:
      y^2 + (a1 x0 + a3) y - (x0^3 + a2 x0^2 + a4 x0 + a6) = 0,
    so at most two affine points share x0, and they are P and
    -P = (x0, -y0 - a1 x0 - a3). Hence for affine P, Q in E(K):
    x(P) = x(Q) <=> Q = +/- P. Valid over F_p and over Q_p, and in char 2 as well
    (see CAVEAT C3).

    STEP 4 (the predicate transports across the lift).
    For j, k /= 0 mod n:
      x([k]S) = x([j]S) in F_p
      <=> [k]S = +/- [j]S                 (Step 3 over F_p)
      <=> n | (k-j) or n | (k+j)          (S has order n)
      <=> [k]Shat = +/- [j]Shat           (Step 1: red is an isomorphism
                                           <Shat> -> <S>, and a group isomorphism
                                           commutes with negation)
      <=> x([k]Shat) = x([j]Shat) in Q_p  (Step 3 over Q_p)

    STEP 5 (the two-valued dichotomy).
    (a) If x([k]S) = x([j]S): by Step 4 the two Q_p x-coordinates are EXACTLY
        equal, the difference is the zero element, v_p = +inf, so
        inv_{j,r}(k) = min(+inf, r) = r.
    (b) If x([k]S) /= x([j]S): by Step 2 both x([k]Shat) and x([j]Shat) lie in Z_p
        with DISTINCT residues mod p, so the reduction of their difference is
        nonzero, hence v_p(difference) = 0, so inv_{j,r}(k) = 0.
    (a) and (b) are exhaustive and mutually exclusive, so NO intermediate value
    1 <= v <= r-1 is ever attained. QED Proposition E.

    STEP 6 (computability corollary).
    inv_{j,r}(k) is a function of the single F_p predicate x([k]S) == x([j]S).
    GIVEN the F_p coordinates of [k]S and [j]S, evaluating inv costs ONE F_p
    equality test (O(log p) bit operations), ZERO group operations, NO Hensel lift,
    NO p-adic arithmetic, and is independent of r.

    === CAVEATS THE DERIVATION SURFACES ===

    C1. v_p(Delta_W) = 0 IS LOAD-BEARING and Proposition E is FALSE without it.
        Take W' obtained by x = u^-2 X, y = u^-3 Y with v_p(u) < 0, i.e. X = u^2 x
        with v_p(u^2) = 2c > 0: W' is still integral, but v_p(Delta_W') = 12c > 0
        and W' is NON-MINIMAL. Then
        X([k]Shat) - X([j]Shat) = u^2 ( x([k]Shat) - x([j]Shat) ), so in case (b)
        v_p = 2c, NOT 0, and inv = min(2c, r). If r <= 2c the functional is
        CONSTANT = r and carries ZERO bits; if r > 2c it is two-valued with values
        {2c, r} not {0, r}. Also Wbar' is SINGULAR, so x(...) in F_p on that model
        is not the E(F_p) x-coordinate at all.
        => R-F1's demand is CORRECT AND NECESSARY.
        => The simulability VERDICT survives non-minimality (still O(1), indeed
           more trivially so); it is the STATEMENT of Proposition E that fails.

    C2. n PRIME IS NOT NEEDED FOR PROPOSITION E. Steps 1-6 use only gcd(n,p) = 1
        and ord(S) = n. n prime is needed for the Omega(sqrt n) GENERIC LOWER
        BOUND: the generic bound is Omega(sqrt q) with q the LARGEST PRIME FACTOR
        of n, and Pohlig-Hellman makes that tight. So R-OBJ2's two halves are
        correct, but the reason belongs to the imported lower bound, not to
        Proposition E.

    C3. p >= 3 IS NOT NEEDED FOR PROPOSITION E EITHER. Step 1's pro-p kernel
        argument holds for p = 2 on a good-reduction model over the unramified
        base Z_p, and Step 3 is stated on a GENERAL Weierstrass equation so it
        holds in char 2. Keeping p >= 3 is a CONSERVATIVE NARROWING, not a
        necessity. Declining to drop it is acceptable IF the decline says that; a
        decline claiming p >= 3 is NEEDED would be wrong.

    C4. 'ONE EQUALITY TEST' IS CONDITIONAL ON ALREADY HOLDING THE F_p COORDINATES.
        If j, k arrive as INTEGERS the evaluator must first materialise [k]S and
        [j]S: two scalar multiplications, O(log n) group operations. If they arrive
        as HANDLES the reference handle for [j]S must still be materialised once
        per j, so a profile vector over a reference set J costs |J|
        materialisations. The cost line must charge this; 'literally nothing' is
        the wrong formulation.

    C5. Ordinariness of E/F_p is NOT used anywhere in Steps 1-6.
    C6. Proposition E presumes r >= 1 and the min-truncation convention; r = 0 is
        degenerate.
  comparison_with_producer_statement: 'AGREES, exactly, including the caveats'
  agreement_detail:
    proposition_statement: >-
      IDENTICAL. The erratum boxes Proposition E at section C.2 as inv_{j,r}(k) = r
      if x([k]S) = x([j]S) in F_p, = 0 otherwise, for all j,k not congruent to 0
      mod n and all r >= 1, computed by a single F_p equality test with no lifting,
      no p-adic arithmetic and no precision. That is my Step 5 plus Step 6.
    derivation_route: >-
      IDENTICAL IN STRUCTURE. The erratum routes through the superseded memo's
      Lemma 1 (integrality and coordinatewise reduction), Lemma 2 as repaired by
      F-3 (the plus-or-minus fibre structure of the x-map on both sides), and
      Proposition 4 as repaired by R-F1. Those are my Steps 2, 3 and 4-5
      respectively. I derived the pro-p kernel and injectivity step myself rather
      than importing it, and it agrees with KN-TECH-73630e.
    caveat_c1_v_p_delta: >-
      AGREES, and the erratum's counterexample is the same one. It takes
      x = u^2 X, y = u^3 Y with u = 1/p, giving Y^2 = X^3 + p^4 A X + p^6 B with
      X = p^2 x and valuation 2 off the plus-or-minus locus. That is my C1 with
      2c = 2. The erratum also reaches my further observation independently, at
      section F - on a non-minimal model the image is {min(c,r), r} and degenerates
      to size 1 when r <= c, so Corollary 4.2's one bit becomes zero bits.
    caveat_c2_n_prime: >-
      AGREES. Section C.3 states that Proposition E, the two lemmas, the simulator
      and the whole section B Part 1 ground are unaffected by primality, and that
      primality is needed only by the imported exponent. That is my C2 exactly.
    caveat_c3_p_ge_3: >-
      AGREES, with the same two reasons I gave independently. Section D.7(a):
      the formal group is pro-p for every p so reduction stays injective on
      prime-to-p torsion, and negation is (x,y) -> (x, -y - a1 x - a3) so the
      x-fibre is {P, -P} in every characteristic; p >= 3 is needed only for the
      SHORT form y^2 = x^3 + Ax + B, which section 1.1 does not use. The erratum
      then keeps p >= 3 as deliberate under-claiming, which is the disposition my
      C3 says is acceptable.
    caveat_c4_cost_qualification: >-
      AGREES. Section C.2 declines the unqualified phrase literally nothing and
      substitutes the qualified form - at most two scalar multiplications,
      O(log n) group operations, per query on the integer interface - and section
      C.5 charges reference-handle materialisation in the profile-vector cost line.
      That is my C4.
    caveat_c5_ordinariness: >-
      AGREES. Section D.7(a) records ordinariness as inherited and unused and notes
      the Proposition therefore also covers supersingular curves.
  disagreement_detail: 'NONE ON THE MATHEMATICS. One wording imprecision is recorded as finding F-V1 below; it concerns a robustness remark appended to the repair, not Proposition E itself.'
  what_this_agreement_does_and_does_not_establish: >-
    It establishes that Proposition E is not an artifact of the producer's own
    write-up - a second agent, holding only the statement, the frozen setting and
    the permitted sources, reached the same statement, the same route and the same
    five caveats. It does NOT establish anything about ECDLP, about the disposition
    of ECDLP-IDEA-436, or about the cost claims that sit on top of Proposition E;
    those are joint J2 and are not mine. It also does not make Proposition E a new
    theorem - it is elementary textbook formal-group and Weierstrass theory
    composed for this object, and both the erratum and I say so.

