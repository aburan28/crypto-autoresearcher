# JOINT J1 - PER-REPAIR DISCHARGE TABLE
# =====================================================================
j1_method: >-
  For each repair I took the verbatim repair text out of
  DEC-20260831-a9716f repairs_required_before_any_disposition_is_recorded.items,
  located the erratum body text the producer's audit table points at, and checked
  the body PERFORMS the repair. Where a repair had two conjuncts I checked each
  separately and recorded them separately. I read the producer's
  erratum-audit.yaml only AFTER checking the body, and used it as a claim to
  falsify, never as a source. Three of the six conjunct checks were additionally
  run mechanically by grep over the erratum bytes, so they do not rest on my
  reading.

j1_per_repair_discharge:
  - id: 'R-F1'
    severity: 'substantive, quantifier-fidelity'
    producer_claim: 'discharged'
    my_finding: 'DISCHARGED, both conjuncts, PERFORMED not named'
    conjunct_1_required: 'Amend the frozen setting to require a Weierstrass model over Z_p realising the good reduction, that is with v_p of the discriminant equal to 0.'
    conjunct_1_result: 'PERFORMED'
    conjunct_1_evidence: >-
      Erratum section C.1 repair item 1 writes the amended sentence out in full -
      a Weierstrass model over Z_p realising the good reduction, that is with
      v_p(discriminant) = 0, equivalently a minimal model up to a unit u. The
      hypothesis is then CARRIED INTO the operative re-issued verdict at section B
      Scope of Part 1, which repeats v_p(Delta) = 0 with the R-F1 tag. Mechanical
      check - the string appears at erratum lines 148 (section B scope block) and
      237 (the amendment itself), so it reaches both the repair and the verdict,
      not only the repair. I verify independently that v_p(Delta) = 0 is the right
      condition - for a curve with good reduction it is exactly minimality, and my
      blind caveat C1 shows the Proposition is FALSE without it.
    conjunct_2_required: 'Add model non-minimality to the section 10 exclusion list.'
    conjunct_2_result: 'PERFORMED'
    conjunct_2_evidence: >-
      Erratum section C.1 repair item 2 does not merely say the list gains the
      item - it REWRITES THE WHOLE LIST as repaired - bad or additive reduction;
      p = 2 (inherited); a non-Weierstrass model whose distinguished coordinate
      does not have plus-or-minus fibres; a point whose order is divisible by p; a
      functional on the formal group; and a non-minimal integral Weierstrass model.
      Mechanical check - non-minimal appears at lines 152, 206, 239, 242 and 902,
      including at line 152 inside section B, so the exclusion is also carried up
      into the verdict.
    beyond_specification: >-
      Two additions I did not require and that strengthen the repair - the
      Proposition's quantifier list gains the MODEL, which is precisely where the
      defect bit and is a proof-architecture quantifier-fidelity repair; and the
      superseded proof-search-map dependency_audit sentence is corrected, because
      Sim line 4 returns the literal constant 0 and 0 is a model-dependent constant.
    independent_confirmation: >-
      My blind caveat C1, written before I opened the erratum, reaches the same
      counterexample by the same substitution and adds that on the non-minimal
      model every prime-to-p torsion point reduces to the singular point, so the
      image degenerates to size 1 when r <= c. The erratum reaches the size-1
      degeneracy independently at section F. Full agreement.

