      re-founding of the operative verdict, not a note appended to it.
    conjunct_2_required: 'Demote the strict-GGM simulator, Shoup and the phrase closed at exponent 1/2 to corroboration.'
    conjunct_2_result: 'PERFORMED'
    conjunct_2_evidence: >-
      Section C.2 has an explicit block headed what is demoted, and to what, naming
