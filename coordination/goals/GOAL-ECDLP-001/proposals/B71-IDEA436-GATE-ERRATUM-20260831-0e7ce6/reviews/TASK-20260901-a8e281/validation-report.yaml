      how the decline is summarised.
  gate_4_result: 'PASS. Nine bullets, nine erratum sections, nine audit rows, zero silent items, and the single declined sub-option is declared in both the body and the audit table with a reason I independently verified.'

# =====================================================================
# MANDATORY CONTROLS
# =====================================================================
control_checks:
  - id: 'CONTROL A'
    name: 'proves-too-much on anomalous curves (KN-TECH-033) under the REPAIRED constructive M2'
    producer_reported: 'M2 does NOT fire; the control PASSES; the exponent-1/2 corroboration is not broken'
    my_result: 'CONFIRMED, with a qualification about the control strength'
    my_independent_check: >-
      I opened KN-TECH-033 and confirmed the object really is one where the
      conclusion is known false - line 7 gives O(log p) field operations, linear
      time, and lines 15 to 18 give the explicit isomorphism onto the additive group
      (F_p, +) with the ECDLP linear time. So an argument rule that fired here would
      prove something false. I then applied the repaired M2 myself. Its firing
      condition is the EXHIBITION of an explicit simulator answering each query in
      O(1) group operations, inversions and equality tests on handles, with no
      coordinate access, no field arithmetic and no instance-growing local bit-work.
      A psi-query must return an element of F_p. A procedure restricted to handle
      operations produces handles and boolean equality outcomes and cannot emit a
      field element at all, so no such simulator is exhibited and none is exhibitable
      in the stated interface. The antecedent is not discharged, so the implication
      chain never starts and the false conclusion is never reached. M2 does not fire.
      CONFIRMED.
    on_the_producer_consistency_labelling: >-
      The producer labels its Level 2 non-existence step a CONSISTENCY check rather
      than a mechanism check, because composing a hypothetical O(1) psi-simulator
      with one field division would give a generic DLP algorithm in O(1) group
      operations, contradicting KN-TECH-005 - the same theorem M2 licenses. It
      records that the negative direction remains not independently checkable.
      ASSESSMENT - THE HONESTY IS SUFFICIENT AND DOES NOT HOLLOW OUT THE CONTROL,
      but it does not fully describe the situation either, in BOTH directions.
    direction_1_the_producer_is_too_hard_on_itself: >-
      The non-existence at O(1) does not actually need the full Omega(sqrt p)
      theorem. A simulator making O(1) queries sees O(1) opaque labels, and in the
      Shoup model the probability that O(1) label comparisons determine k among p
      possibilities is O(1/p) by an elementary counting argument. That is the
      degenerate case of KN-TECH-005's proof rather than its statement, and it is
      checkable in a line. Calling it the same theorem is defensible and
      conservative; it is not the only reading.
    direction_2_the_producer_is_too_easy_on_itself: >-
      This is the more important direction and it is the answer to the plan's
      question. Level 1, the operative and unconditional check, establishes only
      that the ANTECEDENT was not discharged - nobody exhibited a simulator for psi.
      A criterion whose firing is a burden of construction is trivially non-firing
      on every object nobody has tried, INCLUDING objects where firing would be
      correct. So Level 1 alone has near-zero discriminating power as a control - it
      would pass on almost anything. The control's real evidential content sits in
      Level 2, no such simulator CAN exist, and that is precisely the half the
      producer correctly labels conditional and not independently checkable. So the
      phrase the control PASSES is true at the antecedent level and overstates what
      was established at the mechanism level.
    net_assessment: >-
      NOT HOLLOWED OUT, because the repaired M2 is genuinely a better rule than the
      one it replaces - the superseded memo blocked psi by the ABSURDITY OF THE
      CONCLUSION, which is the failure a proves-too-much control exists to catch,
      and the repaired statement blocks it at the antecedent instead. That is real
      progress and the producer identified the defect correctly. But the control is
      weaker evidence than the word PASSES conveys, and the producer's own section
      E.3 says something even sharper - see Control B. Recorded as finding F-V3 with
      a concrete repair; NOT a J1 failure, because R-OBJ6 required the re-run and the
      recording of its outcome, and both were done, including the outcomes that hurt.
    control_outcome: 'PASSES at the antecedent level, CONFIRMED independently; discriminating power in the non-firing direction is NOT measured and the erratum should say so in those words.'

  - id: 'CONTROL B'
    name: 'the repaired M2 against all four corpus-recorded oracles'
    producer_reported: 'the repaired M2 fires on NONE of the four'
    my_result: 'CONFIRMED on all four, and two of the four are confirmed from KN-FIND-002 own recorded figures with no interpretation needed'
    oracle_1_jet:
      producer: 'does not fire'
      my_check: 'CONFIRMED'
      my_reasoning: >-
        KN-FIND-002 lines 50 to 55 record the jet simulator as computing P+Q at one
        group operation and THEN EVALUATING A RATIONAL FUNCTION of the coordinates.
        The repaired M2 forbids coordinate access and field arithmetic outright, so
        that simulator is inadmissible under the repaired criterion regardless of its
        group-operation count. KN-FIND-002's own scope block at lines 81 to 84 says
        the same thing in its own words - under the strictest GGM, jet and
        endomorphism would be NON-SIMULABLE because they require coordinate access.
        Does not fire.
    oracle_2_endomorphism:
      producer: 'does not fire, at O(log l) under the corrected eigenvalue argument'
      my_check: 'CONFIRMED, by two independent routes'
      my_reasoning: >-
        Route one, the structured route - KN-FIND-002 line 58 to 62 records C = 0
        because phi is a public deterministic map from the curve parameters, i.e.
        computed by COORDINATE ARITHMETIC. The repaired M2 forbids coordinate access,
        so it does not fire on that simulator. Route two, the group-theoretic route -
        on a prime-order-l subgroup phi acts as a Frobenius eigenvalue scalar so
        phi(Q) = [lambda]Q at O(log l) group operations by double-and-add, which is
        not O(1), so it does not fire on that simulator either. Both routes give does
        not fire, so the outcome does not depend on which one a reader prefers. I also
        confirm the erratum is right that KN-FIND-b7e091's literal m group operations
        (lines 27 to 28) is Omega(l) by repeated addition and is therefore neither a
        constant- nor a log-overhead simulation as written.
    oracle_3_elliptic_net:
      producer: 'does not fire, at O(log N)'
      my_check: 'CONFIRMED directly from the source record, no interpretation required'
      my_reasoning: 'KN-FIND-002 lines 67 to 72 record O(log N) and place the oracle under the heading SIMULABLE with non-constant overhead (NOT closed at 1/2). Non-constant, so the repaired M2 does not fire.'
