# MECHANICAL RE-EXPRESSION, NOT A NEW PLAN.
# The binding plan is review-plan.yaml, committed in the same commit and BEFORE
# either reviewer was launched. tools/check_review_independence.py reads a
# different schema; last round the plan was unreadable by it and it PASSED BY
# NOT RUNNING. This restates the same content in the checker's field names and
# adds nothing. Prior and attack plans are built verbatim from review-plan.yaml.
review_plan:
  restates_committed_plan: review-plan.yaml
  authored_by: coordinator-ecdlp-2
  coordinator_prior: 'My prior is that the six blocking repairs ARE discharged and
    that the model-free re-founding is SOUND and strictly stronger than the GGM
    ground it replaces. I hold this partly because the re-founding was my own framing
    of the red team''s OBJ-1 when I commissioned the task, which is exactly the
    bias a reviewer should attack - I am marking my own homework at one remove.
    WHAT WOULD CHANGE MY MIND: A demonstration that Proposition E is false or that
    its ''one F_p equality test'' claim smuggles in a cost the erratum does not
    charge; or a repair that is named in the audit table but not actually performed
    in the erratum body; or a showing that the two-part disposition still lets D2
    ride on D1''s disposal. KNOWN WEAKNESS OF MY OWN CHECK: I commissioned this
    erratum, I wrote the repair list into its task card, and I am the session reporting
    the outcome. My agreement carries no independence weight whatsoever.'
  joints:
  - joint: J1
    assigned_to: TASK-20260901-a8e281
    owner_role: validator
    attack_plan: Take the exact repair text of R-F1, R-OBJ1, R-OBJ2, R-OBJ6, R-OBJ7
      and R-OBJ8 from the commissioning decision, and for EACH one check the erratum
      body performs it rather than merely naming it. The erratum ships its own erratum-audit.yaml
      claiming a per-repair discharge; that table is the PRODUCER's claim and is
      exactly what you must not take on trust - verify each row against the erratum
      text it points at. Specifically - does R-F1 actually add v_p(Delta) = 0 to
      the frozen setting AND add model non-minimality to the section 10 exclusion
      list; does R-OBJ2 add n prime to the scope block AND withdraw the Omega(sqrt(n))
      statement for composite n; does R-OBJ7 answer on BOTH branches of the query
      interface and charge reference-handle materialisation in the profile-vector
      cost line. Also verify all nine lower-severity items are addressed or explicitly
      declined with a reason - silence on one is a gate failure by the task card's
      own Gate 4.
  - joint: J2
    assigned_to: TASK-20260901-8def30
    owner_role: red-team
    attack_plan: Attack 1 - PROPOSITION E ITSELF. The erratum claims inv_{j,r}(k)
      equals the cap r when x([k]S) = x([j]S) in F_p and 0 otherwise, computed by
      ONE F_p equality test with no lift and no p-adic arithmetic. Attack whether
      that equality test is really free in the setting the claim is stated in, and
      whether anything was moved off-book to make it so. The producer itself DECLINED
      the unqualified 'literally nothing' formulation and substituted a qualified
      one (the oracle saves at most two scalar multiplications, O(log n) group operations,
      on the integer interface) - check that qualification is correct and consistently
      applied everywhere the erratum states the result, not only where it admits
      the limitation. Attack 2 - THE M2-FIRES-ON-NOTHING CONSEQUENCE. The erratum
      reports the repaired constructive M2 fires on none of the four corpus-recorded
      oracles, leaving D1 as the only firing instance anywhere. Attack whether a
      criterion that fires exactly once is still a criterion or has become a restatement
      of its single instance, and whether that makes the corroboration circular.
      Attack 3 - TIER LEAKAGE ACROSS THE SPLIT. Part 3 withdraws the recommendation
      to reject ECDLP-IDEA-436 as a record. Check that D1's disposal does not still
      leak onto D2 anywhere in the abstract, the section 0 verdict, or the conclusion.
  proves_too_much:
    objects:
    - anomalous curves (trace one), KN-TECH-033
    - the four corpus-recorded oracles of KN-FIND-002 and KN-FIND-b7e091
    failure_signature: The erratum re-ran Control A half 2 under the repaired constructive
      M2 and reports M2 does NOT fire there, so the control PASSES and the exponent-1/2
      corroboration is not broken. Confirm independently. The producer labelled
      its Level 2 non-existence step a CONSISTENCY check rather than a mechanism
      check and recorded that the negative direction remains not independently checkable
      - assess whether that honesty is sufficient or whether it hollows out the
      control. | The repaired M2 is reported to fire on none of them. Confirm or
      refute. If it fires on one, the erratum's headline consequence is wrong. If
      it truly fires on none, say plainly what that does to M2's standing as a criterion.
  blind_rederivation:
    required: true
    quantity: Proposition E - the model-free restatement that inv_{j,r}(k) equals
      the cap r when x([k]S) = x([j]S) in F_p and 0 otherwise, and is therefore
      computed from F_p coordinates alone by one equality test.
    assigned_to: TASK-20260901-a8e281
    blind_from:
    - ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate_erratum_20260831.md
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-GATE-ERRATUM-20260831-0e7ce6/tasks/TASK-20260831-0e7ce6/erratum-audit.yaml
    phase_note: tools/check_review_independence.py reads joints[].joint, joints[].assigned_to
      and joints[].attack_plan, proves_too_much.objects and .failure_signature,
      and gates the blind check on blind_rederivation.required. A plan not using
      those exact names is NOT checked - the tool passes by not running and prints
      no warning that it skipped. That defect was found by the validator of the
      prior round. A checker-schema restatement of THIS plan is committed alongside
      it as review-plan.checker.yaml so the mechanical check actually runs this
      time. The tool also has no notion of review phases, so a two-phase blind protocol
      is reported as a blind_from leak - that flag is a FALSE POSITIVE and must
      NOT be resolved by shortening any reviewer's sources_read list.
  blindness:
    mutual: true
    lifted_for: []
    rationale: Blindness was not lifted for anyone. Both reviewers are FRESH agent
      calls launched in a single message; neither can read the other's report. The
      validator additionally runs blind from the erratum and its audit table for
      its Phase-1 re-derivation, with a required ordering attestation.
