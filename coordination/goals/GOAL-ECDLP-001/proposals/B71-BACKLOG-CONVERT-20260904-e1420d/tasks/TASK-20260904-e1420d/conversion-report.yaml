      experiment_maximum_runs of 0 was respected.
    source_proposal_field: >-
      Set on all eight new records (four hypotheses, four experiments).
      `derived_from_idea` is set alongside it on every one, so the records are
      visible to both the current audit query and the existing house convention.
    question_binding: 'All four new hypotheses carry question_id RQ-CRYPTO-001; all four new experiments carry their paired hypothesis_id.'

  yaml_hygiene:
    strict_parse_run: false
    strict_parse_blocker: >-
      THIS SESSION HAS NO SHELL. The available tools are file read, file write,
      file edit, glob and grep; there is no Bash or command-execution tool, so
      neither `python3 -c 'import yaml; yaml.safe_load(...)'` nor
      `python3 tools/validate_ledger.py` could be run. Stating this plainly rather
      than claiming a parse that did not happen, as the brief requires.
    manual_measures_taken:
      - >-
        Every free-text value that could contain a colon-space or a double quote is
        written as a folded block scalar (`>-`), where YAML applies no quoting rules
        to the content at all. This is the systematic defence rather than a
