  root_cause_of_the_miscount:
    finding: >-
      The backlog audit reads `source_proposal`. NO existing hypothesis or
      experiment in the RQ-CRYPTO-001 family carries that field. Two of the four
      already-converted pairs record provenance under `derived_from_idea`; the
      other two record it only as a path string inside `source_refs`. All four are
      therefore invisible to the audit and were reported as open.
    scale_of_the_problem: >-
      This task's sample is four out of eight, i.e. HALF the batch. If that rate is
      representative, a substantial fraction of the campaign's stated 151 open
      ECDLP/CRYPTO proposals may already be converted. THE RATE IS NOT MEASURED
      HERE and must not be extrapolated -- one batch of eight is not a sample of
      151, and this record asserts only what it checked.
    recommended_next_action_for_the_coordinator: >-
      BEFORE dispatching batch 2, re-run the backlog audit with a provenance query
      that accepts `source_proposal`, `derived_from_idea`, and an IDEA id appearing
      anywhere in `source_refs`, and re-derive the open count. Dispatching further
      conversion batches against the current query risks minting duplicate
      hypotheses for already-converted proposals across the whole campaign, and a
      duplicate is immutable once committed.
    what_must_not_be_done: >-
      DO NOT retrofit `source_proposal` onto the four existing records. They are
      immutable (AGENTS.md rule 2 and CLAUDE.md rule 2) and a correction supersedes
      rather than overwrites. If a structured provenance field is wanted on them,
      it is a superseding record or an audit-side query change, and the query change
      is plainly the cheaper and more honest of the two.

