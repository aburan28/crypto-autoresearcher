      approved_by null, execution_authorized false, evidence_eligible false, and
      frozen false. All four new hypotheses carry status proposed. NOTHING WAS
      APPROVED.
    hypothesis_status_choice: >-
      `proposed` rather than `specified`. These were authored by the Coordinator
      under a conversion task and have had NO independent review, so `specified`
      would assert a certification that has not happened. It also matches the
      status carried by all four already-converted sibling records under
      RQ-CRYPTO-001, which keeps the family uniform for any audit.
    proposals_edited: 'NONE. No proposal file was opened for writing.'
    existing_records_edited: 'NONE. No existing hypothesis, experiment, goal, decision or evidence record was modified.'
    records_created_outside_the_assigned_kinds: >-
      NONE. No DEC, EV, KN, CORR or GOAL record was created, and no existing
      record's status was changed.
    identifiers_minted: >-
      NONE beyond the assigned list, and only four of the eight assigned pairs were
      used.
    compute_used: >-
