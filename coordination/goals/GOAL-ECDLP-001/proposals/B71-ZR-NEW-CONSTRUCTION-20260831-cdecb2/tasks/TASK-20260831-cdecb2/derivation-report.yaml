  interpretation: >-
    Every recursive/alternative decomposition attempted either exactly
    reproduces the already-known Theta(B^3) (two-pairs) / Theta(B^2)
    (one-pair) bound, via a genuinely different derivation, or is strictly
    worse. No route in parts 1-3 reaches the 1.25 online cap under either
    reading. Preprocessing objects used by every non-worse variant (raw
    decks B, pair-decks B^2, hash sets over their roots) remain comfortably
    within the 2.25 preprocessing cap, matching TASK-20260830-53a818's own
    finding; this was not re-litigated as it was not in question.

honest_limitations: |-
  (1) Zero-compute symbolic derivation; no construction here was executed
  against the frozen verifier or recorded instances, so none of these
  bounds are machine-checked in the EXP-CREP-001 sense. (2) The
  class-ceiling claim in part_1 is scoped to GENERIC decks (H-CREP-001's own
  stated cost-model assumption) and to the family of fixed-degree-relation,
  point-test-via-analytic-inversion constructions actually enumerated here
  (five decompositions plus one structural argument); it is not a claim
  that covers every conceivable construction of any kind. (3) The Wagner
  closure in part_2 is scoped to 'Wagner-style generalized-birthday via a
  coordinate-splitting match condition' specifically, drawing on this
  program's own already-validated KN-FIND-ffe1df Theorem C and round 10's
  P1553 closure for the prime-order leg, plus an original non-additive-
  separability argument (leg_i) and two corrected proves-too-much controls;
  it is likewise not a universal impossibility claim. (4) KN-LIT-1188 and
  KN-LIT-1280 (leg_iii) are cited at the ABSTRACT-LEVEL verification their
  own corpus entries disclose ('claims are relayed from the paper's
  abstract without independent verification') -- this session did not
  fetch or read the primary sources beyond what the existing corpus record
  already summarizes; the underlying Zp-generalization claim is corroborated
  but not independently re-verified against the primary text by this
  session. (5) An arithmetic error made mid-derivation (variant 1f's first-
  pass 'GCD rescue' estimate) was caught and corrected within this same
  report, per this task's explicit constraint to check every load-bearing
  step; the corrected figure (Theta(B^4), not a rescue to Theta(B^3)) is
  what is reported in the cost_summary_table. (6) One un-exploited,
  explicitly flagged, non-generic possibility is noted but not pursued:
  proves-too-much-control-results.yaml's own PRE-3-new finding that the
  worked example's SPECIFIC deck choice happens to satisfy an exact
  algebraic relation (P1 = -2*P2) among its points; whether SOME non-generic
  deck configurations admit a smaller pair-deck (breaking the Theta(B^2)
  genericity floor part_1's class-ceiling assumes) is not examined here and
  is named as an open direction.

