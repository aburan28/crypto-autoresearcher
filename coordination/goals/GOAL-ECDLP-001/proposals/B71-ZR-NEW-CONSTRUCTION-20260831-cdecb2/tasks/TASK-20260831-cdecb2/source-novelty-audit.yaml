overall_novelty_status: unverified
overall_novelty_status_reasoning: >-
  Per AGENTS.md and agents/idea-generator.md, an idea whose supporting
  citations include ANY recalled-and-unverified-by-this-session entries
  (the primary Wagner 2002 paper; the Sylvester resultant bound;
  Lagrange's theorem -- all standard, uncontroversial, but not independently
  re-verified against a primary source by this session beyond internal
  cross-checking) is novelty_status: unverified, not known or adaptation,
  regardless of how much internal derivation supports it. The two most
  load-bearing NEW claims of this task -- leg_i's non-additive-
  separability argument and the E/F eliminant degree computations in
  part_1 -- are ORIGINAL to this session (not found stated anywhere in the
  searched corpus), but 'original derivation, unverified against external
  literature for possible prior statement of the same fact' is exactly the
  unverified label's intended meaning, not a defect to be smoothed over.

