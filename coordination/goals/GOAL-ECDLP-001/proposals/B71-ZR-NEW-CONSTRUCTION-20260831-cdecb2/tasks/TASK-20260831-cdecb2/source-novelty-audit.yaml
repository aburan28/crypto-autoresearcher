      claim was separately WITHDRAWN by the entry's own red-team pass
      (RT-20260803-be45a8) for a reason (conflating an averaged with a
      worst-case quantity) unrelated to Theorem C's validity.
    already_cited_by: >-
      Not previously cited anywhere in the H-CREP-001/r_R/z_R derivation
      chain (TASK-20260830-53a818, DEC-20260830-69fb4d, DEC-20260830-d7b846,
      KN-OPEN-f008ae, KN-OPEN-701adf) -- none of those records mention
      KN-FIND-ffe1df, Wagner, or the quotient-homomorphism mechanism.
    overlap_finding: >-
      GENUINELY NEW to this specific chain: this is the first time this
      goal's r_R/z_R investigation has drawn on this internal finding. The
      finding itself is about a DIFFERENT object (E(F_p), the curve's point
      group, in service of a bucket-averaged character-sum barrier for
      j-level Wagner trees on ECDLP directly) than this task's object
      (F_p's additive group, and the S_3/S_5 relation among x-coordinates,
      in service of z_R's construction cost) -- this task RE-DERIVES the
      group-theoretic mechanism (Lagrange's theorem, prime order implies
      simple, implies no nontrivial quotient) independently for its own
      object rather than merely importing KN-FIND-ffe1df's conclusion by
      analogy, and states this explicitly in
      leg_ii_exact_quotient_homomorphism_blocked_by_prime_order.
