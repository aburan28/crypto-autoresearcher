schema: 'crypto.autoresearch.proof_search_map.v1'
id: PSM-20260831-cdecb2
task_id: TASK-20260831-cdecb2
goal_id: GOAL-ECDLP-001
applies_to: >-
  docs/inventor-protocol.md Section 8's four audits, applied to (a) the
  recursive-meet-in-the-middle method-class ceiling and (b) the Wagner-style
  generalized-birthday narrow closure, both reported in derivation-report.yaml
  and outcome-card.yaml. Because the overall disposition is inconclusive
  (no within-cap construction, no universal impossibility), these audits
  are run as sanity checks on the two SCOPED findings actually claimed, not
  as a discharge of any claim beyond outcome-card.yaml's stated scope.

audit_1_baseline_reproduction:
  bottleneck: >-
    Identical to TASK-20260830-53a818's own audit_1: the online cost of
    determining, for the whole B-sized target label set, which labels are
    extendible (equivalently, z_R's root set) without materializing r_R's
    own coefficient vector (degree Theta(B^2) one-pair, Theta(B^4)
    two-pairs).
  parameter_slice: >-
    The naive baseline (direct materialization, Theta(B^2)/Theta(B^4)) and
    the already-improved flat meet-in-the-middle baseline (Theta(B^3)/
    Theta(B^2), TASK-20260830-53a818, DEC-20260830-69fb4d) are both
    reproduced exactly in derivation-report.yaml's scope_and_inputs_recap
    and variant_1a, without alteration, before any new variant is attempted.
  reproduction_check: >-
    Symbolic reproduction only (zero-compute task). Variant 1a's figure is
    read directly from the two prior, independently-verified sources
    (TASK-20260830-53a818's derivation-report.yaml; DEC-20260830-69fb4d's
    independent re-derivation) rather than re-asserted from memory. This
    session adds no baseline-reproduction risk since every new variant
    (1b-1f) is measured against this SAME reproduced baseline, and the
    Wagner analysis in part_2 does not depend on the baseline figure at all
    (it is a structural non-applicability argument, not a cost comparison).

audit_2_observation_collision:
  observable_recursive_mitm: >-
    The observable is the online-cost exponent of each recursive
    decomposition attempted. DISTINCT-PREIMAGE SEARCH: searched for other
    decompositions producing the IDENTICAL Theta(B^3) observable via a
    DIFFERENT mechanism than 'S_3's fixed degree enables an O(1) solve
    given two fixed slots' -- found none; every variant that reaches
    Theta(B^3) (1a, 1d) does so via exactly this same mechanism (confirmed
    directly in variant 1d's own derivation, which explicitly reuses the
    fixed-degree-<=4 property of the derived eliminant E). Variants that
    depart from this mechanism (1c: flatten away the pair-deck; 1e/1f:
    eliminate rather than sweep a further variable) do NOT collide on
    Theta(B^3) -- they land on a WORSE exponent, which is the correct,
    non-collision outcome confirming the mechanism is load-bearing, not an
    artifact of loop-counting that would apply regardless of it.
  observation_collision_flagged_against_prior_round: >-
    Explicit check required by this task's brief: does variant 1d (or any
    other variant here) collide with -- i.e. merely restate -- TASK-
    20260830-53a818's own method-ceiling audit (its audit_4)? FINDING:
    NO. TASK-20260830-53a818's audit_4 checked ONE nearby object (replacing
    S_3 with a hypothetical growing-degree relation, holding the flat
    two-list decomposition fixed). This task's part_1 instead holds S_3
    FIXED and varies the DECOMPOSITION STRUCTURE itself (five distinct
    decompositions plus one structural tree-shape argument), which is a
    genuinely different axis of variation. The two audits are complementary,
    not duplicative: TASK-20260830-53a818 showed the ceiling holds
    'because S_3 has fixed degree, not because of loop-counting
    coincidence'; this task shows the ceiling holds 'across every
    recursion depth and tree shape this session could construct, not just
    the flat two-list arrangement'. Together they cover two orthogonal
    directions of the same claim's robustness, satisfying this task's Gate
    2/observation-collision requirement without restating the prior finding.
  observable_wagner: >-
    The observable is 'a Wagner-style construction exists reaching cap'.
    DISTINCT-PREIMAGE SEARCH: searched for a DISTINCT relation (other than
    S_3/S_5) that would produce a positive result (Wagner genuinely
    applies) under the SAME field/group structure, to confirm the
    obstruction is about the RELATION's shape and not a blanket claim about
    F_p or E(F_p). Found one directly (proves_too_much_control_A in
    derivation-report.yaml): a hypothetical additive relation x1+x2+x3=0
    over the SAME prime field DOES NOT collide with the obstruction --
    Wagner's known Zp-generalization would apply to it. This is the
    correct, non-collision (in fact, deliberately constructed
    non-collision) outcome: it confirms leg_i (non-additivity), not the
    prime field itself, is what is doing the work.

audit_3_quantifier_order:
  recursive_mitm_statement: >-
    FOR ALL fresh-target label sets of size B (uniformly over which B
    labels of deck I are designated 'the target', matching V2's
    target-independence requirement), and FOR ALL five recursive
    decompositions enumerated in part_1 (1a,1b,1c,1d,1e,1f), THE BEST
    ACHIEVABLE online cost among them is Theta(B^3) (two-pairs) / Theta(B^2)
    (one-pair) -- i.e. an EXISTENTIAL claim over decompositions (at least
    one, namely 1a or 1d, achieves this) composed with a UNIVERSAL claim
    over the same enumerated set (none achieves better). No witness (which
    decomposition, or which (rho,sigma) pair within it) is allowed to
    depend on anything the online phase lacks access to. Because the class-
    ceiling claim is scoped to 'the decompositions enumerated in this
    session, under the generic-deck assumption', it is NOT a claim that
    quantifies over EVERY conceivable construction -- that broader
    universal ('for all constructions of any kind, cost >= B^3') is
    explicitly NOT asserted anywhere in this task's records.
  wagner_statement: >-
    FOR ALL coordinate-splitting filters h (exact quotient homomorphism, or
    Zp-style interval near-collision filter, the two classes this corpus's
    literature substantiates as rigorously analyzed), applied to the joint
    relation S_3 or S_5 AS CURRENTLY FORMULATED, NO SUCH h achieves a
    nontrivial, correctness-preserving coordinate split -- this is a
    genuine universal claim, but its scope is explicitly restricted to (a)
    the two named filter classes and (b) the relation as currently
    formulated (not any future reformulation). The witness for
    non-existence in the exact case is a clean disjunction (Lagrange's
    theorem leaves no candidate group of the required order); the witness
    for the additive-separability failure is the direct degree
    contradiction shown in leg_i, which holds for ALL generic parameter
    choices (the leading coefficient (x1-x2)^2 is the zero polynomial only
    on the measure-zero locus x1=x2, already handled separately as the
    VERTICAL exceptional stratum in rcrep-candidate-definition.yaml's own
    strata_and_saturation).

audit_4_method_ceiling_and_nearby_object_control:
  strongest_certifiable_claim_recursive_mitm: >-
    The fixed-degree-relation, point-test-via-analytic-inversion method
    class, applied via any of the six variants checked, can certify at most:
    online cost = Theta(B) [mandatory target sweep, per V2] times Theta(B^2)
    [the smallest achievable hashable/preprocessable auxiliary object,
    generically forced by pairing two independent B-size decks through a
    fixed-degree-2 relation] = Theta(B^3) for two-pairs; Theta(B)*Theta(B)
    = Theta(B^2) for one-pair (where the 'auxiliary object' and the 'target
    sweep' are the SAME size, by symmetry of the three base objects). This
    matches part_1's class_ceiling_conclusion and is NOT claimed to be a
    proof that NO other method class could do better.
  nearby_object_control_recursive_mitm: >-
    Already performed independently by TASK-20260830-53a818's own audit_4
    (hypothetical growing-degree relation, degrading to naive cost) and
    extended here by variant_1e/1f's DIFFERENT mechanism (eliminating an
    additional deck via resultant reinstates a degree-Theta(B) dependency,
    also degrading, this time to Theta(B^{3+epsilon}) or Theta(B^4)
    depending on the completion subroutine chosen). Two independent nearby-
    object mechanisms, both showing degradation away from the fixed-degree
    structural fact, is stronger corroboration than either alone.
  strongest_certifiable_claim_wagner: >-
    The strongest claim this session's Wagner analysis certifies: no
    construction fitting the description 'a k-list tree merging via a
    coordinate-splitting filter (exact-homomorphism or Zp-interval-style)'
    can be built for the S_3/S_5-based joint relation as currently
    formulated. It does NOT certify that no OTHER kind of generalized-
    birthday-flavored idea (e.g. one operating on a wholly different
    tracked object than the raw field elements) could ever apply -- that is
    explicitly left open as a direction for a future session, per
    outcome-card.yaml's falsification_conditions.
  nearby_object_control_wagner: >-
    GENUINELY DERIVED, two independent controls, per proves_too_much_control
    in derivation-report.yaml: CONTROL A (a hypothetical additive relation,
    for which the obstruction correctly does NOT fire, confirming the
    argument is about non-additivity specifically, not primality alone or
    the field in general); CONTROL B (a hypothetical composite-order group,
    for which leg_ii's specific mechanism correctly does NOT fire, while
    leg_i still blocks Wagner, confirming leg_ii's mechanism is genuinely
    about primality and that removing it alone would not be sufficient).
    Both are genuinely computed (not merely asserted) and both show the
    CORRECT differential behavior (obstruction present for the real object,
    absent for the appropriately-modified nearby object on the specific
    axis each control targets) -- the discipline DEC-20260830-69fb4d's
    review of the prior round's control explicitly required.

not_applicable_sections: none

conclusion: >-
  All four audits were run against both scoped findings (the broadened
  recursive-MITM method-class ceiling, and the narrow Wagner-style closure)
  rather than skipped. Audit_2's required observation-collision check
  against TASK-20260830-53a818's own prior audit found the two audits
  complementary (different axis of variation), not duplicative, satisfying
  this task's explicit non-restatement requirement. Audit_4's nearby-object
  controls for the Wagner closure both exhibit the correct differential
  behavior demanded by the corrected proves-too-much discipline
  DEC-20260830-69fb4d established. Neither finding is elevated beyond its
  stated scope: the overall task disposition remains
  no_construction_found_inconclusive, per outcome-card.yaml.
