failure_localization:
  - symptom: candidate's output is a scalar count or membership bit, not a remainder or labeled correspondence
    localizes_to: L1_NAMED_TRIGGER_OBJECT
    interpretation: not a trigger of the required shape; G1 fails (C6 this round)
  - symptom: seed/start-system construction cost matches or exceeds the ambient variety's degree
    localizes_to: L2_FROZEN_SETTING_TYPING_AND_EXACTNESS
    interpretation: seed silently equivalent to the full intersection structure; G2/G3 fail (C1, C2, C4 this round)
  - symptom: method's output remains a floating-point or fixed-precision approximation with no costed exact-recovery route
    localizes_to: L2_FROZEN_SETTING_TYPING_AND_EXACTNESS
    interpretation: exactness sub-clause of amended G2 fails independently of the witness sub-clause (C1-C4 this round)
  - symptom: certification bridges float to an exact object in the wrong field
    localizes_to: L2_FROZEN_SETTING_TYPING_AND_EXACTNESS
    interpretation: characteristic-zero exactness is not F_p exactness; G2 fails (C5 this round)
  - symptom: per-fresh-target online path count equals the full generic path count with no a-priori selection mechanism
    localizes_to: L3_FULL_COST_ENUMERATION
    interpretation: online leg, not merely preprocessing, exceeds its cap; G3 fails (C3 this round)
  - symptom: coalesced or nonreduced fibre loses label or multiplicity
    localizes_to: L4_LINEAGE_MULTIPLICITY_FIBRES
    interpretation: G4 fails
  - symptom: output invariant under Q to -Q
    localizes_to: L5_Q_VS_MINUS_Q
    interpretation: sign channel absent; G5 fails
  - symptom: Q coefficient unknown or non-invertible
    localizes_to: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    interpretation: G6 fails
  - symptom: unranking needs full source or support enumeration
    localizes_to: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    interpretation: G7 fails
  - symptom: declared cost exponent for the construction step is greater than or equal to an already-costed route's declared exponent
    localizes_to: L8_NOT_ALREADY_COSTED_ROUTE
    interpretation: 'already-costed route under the amended cost-dominance standard; G8 fails (C1, C2, C3, C4 all match or exceed ROUTE-08''s declared exponent 3; C5 and C6 do not reach a route comparison because they fail earlier gate items first)'
  - symptom: candidate proves too much on a planted generic non-elliptic polynomial system
    localizes_to: first purported P1553-structure lemma that fails to distinguish it
    interpretation: proof proves too much (method-ceiling nearby-object control); confirms none of C1-C6 typed the elliptic-specific structure
  - symptom: tracked object's construction cost equals or exceeds the object it is meant to compress, or is not discarded at all
    localizes_to: lossy_projection_test, C1/C2/C3
    interpretation: not a genuinely lossy projection; disqualifies the candidate before any cost question arises
  - symptom: tracked object is lossy but its domain of definition requires paying an already-disqualifying cost, or lands in the wrong field
    localizes_to: lossy_projection_test, C4/C5
    interpretation: discarded incompatibly with the target's operations; disqualifies the candidate
  - symptom: tracked object is lossy and compatible but destroys exactly the retained information the target requires
    localizes_to: lossy_projection_test, C6
    interpretation: lossy projection to the wrong target object; disqualifies the candidate independent of cost

stopping_rules:
  - Stop before implementation or experiment execution because this role has no approval to run either.
  - Stop admission if any of G1 through G8 remains undisclosed or false for a candidate.
  - Treat crashes, timeouts, missing dependencies, unavailable backends, rate-limited or error-status retrieval endpoints, and zero-result queries as infrastructure or literature-absence outcomes only, never as mathematical evidence.
  - Preserve all untested variants and the coordinate-aware P1553 remainder and dyadic unit-product routes when reporting a scoped failure.
  - A demonstrated cost, exactness, or output-type obstruction within one reading of a literature area (C1-C6 this round) is scoped exactly to the specific constructions read, not generalized to a claim about numerical algebraic geometry or homotopy continuation in general.

