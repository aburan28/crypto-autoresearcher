title: Proof-search map for the round-14 P1553 remainder / dyadic unit-product trigger search (numerical algebraic geometry and homotopy continuation methods)
record_kind: proof_search_map
result_count: 1
status: proposed
disposition: scoped_no_candidate
claim_ceiling: unverified_zero_run_formula_level_p1553_remainder_or_dyadic_unit_product_typed_trigger_and_gate_discharge_only

target_statement:
  informal: >-
    An actual recurrence, circuit identity, or retrieved theorem from
    numerical algebraic geometry or polynomial homotopy continuation --
    witness-set computation, monodromy-based numerical irreducible
    decomposition, parameter or coefficient-parameter homotopy continuation,
    or numerical resultant/elimination via random linear slicing --
    instantiates to the frozen elliptic setting as a typed public P1553
    target-local remainder transducer for r_R mod g_I or the exact dyadic
    subinterval unit-product interface, and passes every item of the frozen
    pre-admission gate (G1-G8, amended G2/G8 wording).
  quantifiers: >-
    There exists one named public object T (a recurrence, circuit identity,
    or theorem) and one fully specified public construction rule C such
    that, for the frozen P1553 setting fixed before any witness is observed,
    C computes r_R mod g_I (or the dyadic unit-product step) from E, P, Q
    alone, EXACTLY (not merely up to a floating-point or fixed-precision
    approximation), without importing a root, factor, or Groebner basis of
    r_R or the underlying complete-chart intersection system; the full
    state/update-map/degree/rank/nonzero/coefficient-growth/live-storage/
    traffic/build-query/amortization enumeration lies within the inherited
    B^(5/4) interface budget and strict end-to-end o(ell^(1/2)) time,
    memory, and data; lineage and multiplicity are preserved on coalesced
    and nonreduced fibres; Q is distinguished from -Q; known P and Q
    coefficients are yielded with invertible Q coefficient; output-sensitive
    source unranking is supported; and T is shown not to be dominated in
    declared cost by an already-costed norm, resultant, quotient, full
    power-projection, represented-table, or witness-conditioned route. For a
    numerical/continuation candidate, an additional quantifier constraint
    binds: the recovered value must be an EXACT element of F_p (or the
    frozen ring), with the exact recovery mechanism and its cost stated; a
    candidate whose output remains a floating-point or fixed-precision
    approximation, uncertified as exactly equal to a specific F_p element,
    is not typed to this quantifier order at all and is G2-absent by
    definition, not merely cost-deficient.
  present_support: none

lemma_decomposition:
  - id: L1_NAMED_TRIGGER_OBJECT
    responsibility: >-
      Name the actual recurrence, circuit identity, or retrieved theorem T,
      with its exact statement and source, and verify it is not merely the
      assertion that a specialized construction may exist, and, for a
      numerical/continuation candidate, verify T's output type is a value or
      correspondence of the shape the trigger requires (a remainder or a
      labeled correspondence), not merely a count, a membership bit, or a
      verification of an externally supplied claim.
    status: open
    falsifier: >-
      T is only an existence assertion, a heuristic, or a technique whose
      output is a scalar count, a membership bit, or some other object not
      of the shape r_R mod g_I requires.
  - id: L2_FROZEN_SETTING_TYPING_AND_EXACTNESS
    responsibility: >-
      Type T into the frozen P1553 setting: rings, bases, CRT components,
      interval geometry, public g_I and r_R construction, and an EXACT
      computation from E, P, Q without importing a root, factor, or Groebner
      basis of r_R or the underlying system. For a numerical/continuation T,
      this includes identifying exactly what serves as the "start system" or
      "seed" for the continuation, whether that seed is genuinely public and
      cheaply computable, and -- separately -- whether and how the method's
      floating-point or fixed-precision output is converted into an EXACT
      element of F_p, and at what disclosed cost.
    status: open
    falsifier: >-
      The seed silently requires an equivalent witness (a root, factor, or
      Groebner basis of r_R/g_I, or a Theta(B^3)-cost witness set
      constructed from public data alone but already encoding the full
      intersection structure); or the method's output remains an
      uncertified or characteristic-zero-only-certified approximation with
      no disclosed, costed route to an exact F_p value.
  - id: L3_FULL_COST_ENUMERATION
    responsibility: >-
      Enumerate state, update maps, degrees, ranks, nonzeros, coefficient
      growth, live storage, traffic, build/query split, and amortization,
      and bound every axis within the B^(5/4) interface budget and strict
      end-to-end o(ell^(1/2)) time, memory, and data. For a numerical
      candidate, this includes the number of continuation/monodromy paths
      tracked (preprocessing and per-fresh-target), and, if a
      characteristic-zero-to-F_p exact-recovery step is invoked, its bit-
      precision cost.
    status: open
    falsifier: >-
      The path count for building any witness set or pseudo-witness set
      matches or exceeds the ambient variety's degree (Theta(B^3) in this
      setting) -- a structural floor of the method, not an implementation
      choice; or the per-fresh-target online path count is also Theta(B^3)
      because no mechanism exists to select in advance which paths land on
      the target label; or an exact-recovery step's bit-precision cost is
      undisclosed or unbounded.
  - id: L4_LINEAGE_MULTIPLICITY_FIBRES
    responsibility: Preserve lineage and multiplicity on coalesced and nonreduced fibres.
    status: open
    falsifier: A coalesced or nonreduced fibre loses its occurrence label or multiplicity under T.
  - id: L5_Q_VS_MINUS_Q
    responsibility: Distinguish Q from -Q in the transducer output.
    status: open
    falsifier: The output is invariant under Q mapped to -Q with no separately proved orientation channel.
  - id: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    responsibility: Yield known P and Q coefficients with invertible Q coefficient.
    status: open
    falsifier: The Q coefficient is not known a priori or is not invertible on the declared strata.
  - id: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    responsibility: Support output-sensitive source unranking.
    status: open
    falsifier: Unranking requires enumerating the full source or a support table.
  - id: L8_NOT_ALREADY_COSTED_ROUTE
    responsibility: >-
      Show T's declared cost exponent for the same construction step is not
      dominated by (i.e. is strictly smaller than) any already-costed
      route's declared exponent, specifically ROUTE-01 (component
      resultants) or ROUTE-08 (displacement representation, node n2,
      cost_exponent_in_B 3), under the amended G8 wording's cost-comparison
      standard rather than a shared-family-name exclusion alone.
    status: open
    falsifier: >-
      T's declared exponent for building its seed, witness set, or
      per-target path set is greater than or equal to 3 (ROUTE-08's own
      declared exponent), or T is a certification or refinement layer on top
      of another candidate that already fails this comparison.

dependency_order:
  - [L1_NAMED_TRIGGER_OBJECT, L2_FROZEN_SETTING_TYPING_AND_EXACTNESS]
  - [L2_FROZEN_SETTING_TYPING_AND_EXACTNESS, L3_FULL_COST_ENUMERATION]
  - [L2_FROZEN_SETTING_TYPING_AND_EXACTNESS, L4_LINEAGE_MULTIPLICITY_FIBRES]
  - [L2_FROZEN_SETTING_TYPING_AND_EXACTNESS, L5_Q_VS_MINUS_Q]
  - [L2_FROZEN_SETTING_TYPING_AND_EXACTNESS, L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q]
  - [L2_FROZEN_SETTING_TYPING_AND_EXACTNESS, L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING]
  - [L1_NAMED_TRIGGER_OBJECT, L8_NOT_ALREADY_COSTED_ROUTE]
  - [L3_FULL_COST_ENUMERATION, L8_NOT_ALREADY_COSTED_ROUTE]

cheap_audits:
  exact_baseline_reproduction:
    applies: true
    baseline: >-
      The frozen gate items G1-G8 (amended G2/G8 wording) read from the
      goal head, the g_I/r_R/z_R definitions from H-CREP-001, and the eight
      frozen already-costed routes with ROUTE-08's exact declared exponent
      (cost_exponent_in_B 3, node materialize_resultant_coefficients) from
      EXP-CREP-001/specification.yaml.
    attack_plan:
      - restate each gate item G1-G8 verbatim, using the amended G2/G8 text
      - restate g_I, r_R, z_R and ROUTE-08's exact exponent certificate from H-CREP-001 and EXP-CREP-001/specification.yaml
      - for each of C1-C6, identify the exact seed/start-system, the exact per-query cost, and the exact exactness-recovery mechanism (if any), and mark each gate item present/absent with a named reason
      - confirm no candidate is admitted by assertion of a possibly-existing sub-Theta(B^3) construction, and confirm no scalar-count or approximate-value output is conflated with an exact remainder transducer
    expected_break: >-
      A candidate whose seed/start-system construction cost matches or
      exceeds the ambient variety's degree (Theta(B^3), matching ROUTE-08's
      own declared exponent), or whose output is an uncertified or
      characteristic-zero-only-certified floating-point value with no costed
      route to an exact F_p answer.
    pass_condition: >-
      Every gate item is explicitly present for a candidate, with the exact
      construction, exactness story, and full cost enumeration; otherwise
      the candidate is recorded not intake-ready with its absent items
      named.
    current_result: >-
      Performed statically, reproducing mechanism-card.yaml's own C1-C6
      verdicts. C1 (witness sets) carries G1 but fails G2 (exactness) and
      G3/G8 (Theta(B^3) degree floor, dominated by ROUTE-08's exponent 3).
      C2 (monodromy breakup) inherits C1's failures and adds a
      given-witness-set circularity. C3 (parameter/coefficient-parameter
      continuation) carries G1 but fails G3/G8 on BOTH its preprocessing and
      its per-fresh-target online leg (both exponent 3). C4 (pseudo-witness-
      set numerical elimination) carries G1 as the sharpest scope match but
      fails G2/G3/G8 because its seed cost equals the same Theta(B^3) floor,
      even though its disclosed per-query leg (once the seed exists) is
      genuinely cheap. C5 (alpha-theory certification) carries G1 as a real
      technique but fails G2: it certifies exactness in characteristic zero
      only, never bridging to F_p. C6 (probabilistic saturation) is
      finite-field-native (escaping the exactness/field-mismatch failure
      mode entirely) but fails G1 on output type: it computes a scalar
      count, not a remainder transducer. No candidate is intake-ready. No
      experiment was run.
  observation_collision_search:
    applies: true
    collision_object: >-
      A retrieved or internal object that is the same observable as a
      trigger already screened in one of the six terminal pre-admission
      packets, or in the seventh- through thirteenth-round candidate sets,
      or an internal idea-generation-corpus candidate that already proposed
      the identical mechanism for a different setting.
    attack_plan:
      - compare each candidate against the six screened families and their scoped negative boundaries
      - compare each candidate against the seventh- through thirteenth-round candidate sets and record which, if any, is a re-derivation
      - grep inputs/ and knowledge/ for the exact mechanism names (witness set, numerical algebraic geometry, homotopy continuation, monodromy breakup, pseudo-witness, Bertini, coefficient-parameter, Sommese, Verschelde, Hauenstein) and read any on-topic hit in full
      - confirm this round does not reopen round ten's closed mixed-radix/CRT sub-avenue, round eleven's ROUTE-04 collapse, round twelve's four route collapses, or round thirteen's five verdicts
      - record which candidate, if any, falls inside a screened family, duplicates a prior-round candidate, or duplicates an internal prior candidate
    expected_break: >-
      A candidate that re-runs a screened family, re-derives a prior-round
      candidate, reopens a closed sub-avenue, or silently restates an
      internal prior candidate without crediting its disclosed obstruction.
    pass_condition: >-
      No candidate re-runs a frozen screen, re-derives a prior-round
      candidate, reopens a prior closure, or silently restates an internal
      prior candidate without crediting its disclosed obstruction.
    current_result: >-
      Performed statically. This round does not re-derive the seventh-
      through thirteenth-round candidate sets and does not reopen any prior
      round's closure. Numerical algebraic geometry and homotopy
      continuation is a genuinely distinct area from all six screened
      families and from rounds seven through thirteen's exact/symbolic
      searched areas. Two internal prior-art hits were found and disclosed,
      not re-screened, because they concern a DIFFERENT target/hypothesis
      line (Semaev factor-base membership, RQ-BKK-001) rather than this
      task's P1553 g_I/r_R object: KN-LIT-015 (a knowledge-corpus annotation
      on polyhedral homotopy continuation stating the archimedean/F_p
      mismatch) and inputs/idea_generation_20260719_batch4.md's internal
      heuristic candidate HOMOTOPY-MONODROMY-C2 / ECFG-P1593 (never
      promoted, recorded LITERATURE-ADJACENT / likely reject-tier, citing
      the identical field-mismatch obstruction for the Semaev-membership
      target). Round twelve's u-resultant component is adjacent in classical
      lineage to this round's C4 (pseudo-witness-set elimination) but
      screened a strictly EXACT symbolic sense of the idea; C4's numerical,
      path-tracking sense is disclosed as a distinct, non-duplicate
      treatment. No candidate this round is a re-run of any screened family,
      prior-round candidate set, or internal prior candidate targeting this
      specific P1553 construction.
  quantifier_order_statement:
    applies: true
    required_order:
      - freeze the P1553 rings, bases, CRT components, and interval geometry
      - fix the public g_I and r_R construction
      - name the trigger object T (recurrence, circuit identity, or theorem)
      - receive public E, P, Q
      - construct T's numerical or continuation object from E, P, Q alone at declared, bounded cost
      - recover an EXACT value in F_p from it, with the recovery mechanism and its cost stated
      - compute r_R mod g_I (or the dyadic unit-product step) from that exact value
      - enumerate the full cost and verify the B^(5/4)/o(ell^(1/2)) bounds
      - verify lineage/multiplicity, Q vs -Q, invertible Q coefficient, and source unranking
    forbidden_order: >-
      Build a Theta(B^3)-path witness set or pseudo-witness set first, and
      only then ask whether a cheap per-query step exists on top of it (C1,
      C2, C4); track all Theta(B^3) generic paths per fresh target with no
      a-priori selection mechanism (C3); certify exactness over C via alpha
      theory and silently treat that as exactness over F_p without a costed
      lift-and-reduce step (C5); or compute a scalar count and treat it as
      if it were the remainder transducer itself (C6).
    expected_break: >-
      A candidate whose construction presupposes exactly the object the
      frozen setting has not yet publicly constructed (a Theta(B^3)-cost
      witness set), or that silently substitutes a different exactness claim
      (characteristic zero) or a different output object (a count) for the
      one the quantifier order requires (an exact F_p remainder).
    pass_condition: >-
      All frozen objects are fixed before any witness or presupposed circuit
      is observed, T's construction is built from public data (E, P, Q)
      alone at declared bounded cost, and the recovered value is exact in
      F_p with its recovery cost disclosed.
    current_result: >-
      Statement only, checked per candidate. C1, C2, and C4 all violate the
      required order by presupposing a Theta(B^3)-cost seed before any
      per-query saving is asked about. C3 violates it by having no
      a-priori path-selection mechanism at all, so its "per fresh target"
      leg is the full generic path count. C5 violates it by substituting
      characteristic-zero exactness for F_p exactness without a costed
      bridge. C6 violates it by substituting a scalar count for the required
      remainder object.
  method_ceiling_nearby_object_control:
    applies: true
    nearby_object: >-
      A generic ambient polynomial system of the same variable count, degree
      profile, and total degree as the frozen setting's complete-chart
      intersection system, with no elliptic-curve provenance, group law,
      Weierstrass structure, or complete-chart intersection origin at all,
      whose elimination/projection produces a generic hypersurface of the
      same degree Theta(B^3) as r_R and a generic squarefree divisor of the
      same degree Theta(B) as g_I.
    attack_plan:
      - apply the identical candidate construction (witness-set computation, monodromy breakup, parameter/coefficient-parameter continuation, pseudo-witness-set elimination, alpha-theory certification, probabilistic saturation) to the planted generic ambient system
      - prohibit use of any elliptic-curve-specific fact absent from the claimed lemmas
      - identify the first lemma that would need to distinguish the genuine P1553 (g_I, r_R) pair from the generic control
      - reject the argument if it still returns a purported P1553 remainder/witness certificate on the planted generic instance at the same claimed cost
    expected_break: >-
      Every candidate this round is a general statement about numerical
      algebraic geometry, homotopy continuation, or randomized ideal
      saturation applicable to ANY polynomial system, hypersurface, or
      projection of the given degree profile, with no P1553-structure
      lemma; each would apply identically, and at the identical cost, to the
      planted generic non-elliptic ambient system, confirming that none of
      C1-C6 ever typed the frozen P1553 setting's elliptic-curve-specific
      structure.
    pass_condition: >-
      A named P1553-structure lemma would need to reject the generic control
      before granting a P1553 remainder/witness at sub-Theta(B^3) cost, or
      before granting an exact F_p answer at no extra certification cost; no
      candidate this round supplies such a lemma, so none passes.
    current_result: >-
      Not run as an experiment (no experiment authorized). Stated
      analytically: witness-set and monodromy-breakup theory is stated for
      "a variety" or "a parametrized family" generically, with no
      elliptic-curve-specific input; the Morgan-Sommese coefficient-parameter
      theorem applies to any family of the given degree; the pseudo-witness-
      set elimination technique is stated for "a hypersurface arising as a
      projection", again generically; alpha theory certifies convergence for
      any polynomial system over C; probabilistic saturation counts
      solutions outside a base locus for any system. Every technique read
      this round would apply, at the identical declared cost, to the planted
      generic non-elliptic ambient system, confirming none of C1-C6 ever
      used any fact about E, P, or Q beyond treating the ambient system as an
      opaque polynomial system of given degree. No computation was executed;
      this is a stated control, not a run result.
  lossy_projection_test:
    applies: true
    tracked_object_c1: '"The Theta(B^3) floating-point witness points of the ambient complete-chart intersection system," proposed as the tracked object for C1.'
    tracked_object_c2: '"The monodromy-orbit representative labels," proposed as the tracked object for C2.'
    tracked_object_c3: '"The per-target retracked path endpoints," proposed as the tracked object for C3.'
    tracked_object_c4: '"The pseudo-witness fiber over a generic line plus interpolated univariate data," proposed as the tracked object for C4.'
    tracked_object_c5: '"The alpha-theory-certified true complex root," proposed as the tracked object for C5.'
    tracked_object_c6: '"The scalar intersection count outside the base locus," proposed as the tracked object for C6.'
    test_result_c1: >-
      FAILS the "genuinely lossy" clause: the tracked object IS the full
      Theta(B^3)-size point set in a different arithmetic representation
      (floating point instead of polynomial coefficients) -- a change of
      arithmetic model, not a new projection.
    test_result_c2: >-
      FAILS the "genuinely lossy before the full cost is paid" clause: any
      compaction (orbit representatives) happens only after C1's full
      Theta(B^3) cost is already incurred, the same failure mode round
      thirteen's C3 and round twelve's Bezoutian exhibited.
    test_result_c3: >-
      FAILS the "genuinely lossy" clause outright: every one of the
      Theta(B^3) generic paths must be individually retracked per fresh
      target, so nothing is discarded at all.
    test_result_c4: >-
      Genuinely lossy in its own paper's stated sense for the per-query leg
      (avoids materializing the full eliminant per additional query), but
      FAILS the "discarded compatibly with the target's operations" clause:
      the projection's domain of definition (the initial pseudo-witness set)
      requires first paying the same Theta(B^3) cost the projection was
      meant to avoid -- the same failure mode round thirteen's C5 exhibited,
      here for a cost reason rather than a witness reason.
    test_result_c5: >-
      Lossy relative to an infinite floating-point history, but FAILS the
      "discarded compatibly with the target's operations" clause: the
      target space (exact characteristic-zero algebraic numbers) is not the
      same field as the frozen setting's target (F_p); reduction modulo p is
      not among the operations alpha-theory certification defines or costs.
    test_result_c6: >-
      Genuinely, extremely lossy, and the discard IS reachable compatibly
      with F_p operations (the one candidate this round to clear that half
      of the test) -- but the retained information (a scalar count) does not
      propagate deterministically to the required output (a remainder
      polynomial or labeled correspondence) at all: a lossy projection to
      the wrong target object.
    conclusion: >-
      No tracked object this round survives the lossy-projection test intact
      for the required trigger shape: C1's and C3's projections are not
      genuinely lossy at all; C2's and C4's discards happen only after an
      already-disqualifying cost is paid; C5's discard lands in the wrong
      field; C6's discard is compatible but destroys exactly the information
      needed. This is an algebraic, zero-compute audit performed before any
      experiment was proposed; no experiment is proposed as a result.

