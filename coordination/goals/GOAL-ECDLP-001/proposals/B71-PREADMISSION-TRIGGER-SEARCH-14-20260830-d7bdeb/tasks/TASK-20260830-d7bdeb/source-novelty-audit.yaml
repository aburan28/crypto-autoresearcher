  round; all nine distinct queries and two direct abstract-page fetches
  returned on the first attempt. commands_or_searches_performed is recorded
  false because no shell command, program, or algebra computation was
  executed by this role; all "searches" performed were WebFetch network
  requests or Grep/Read calls against the committed repository, itemized
