    nearest_retrieved_work: Witness-set and numerical irreducible decomposition literature (arXiv:0810.2983 and the six adjacent sources listed in objects_read above).
    nearest_internal_work: 'EXP-CREP-001''s own ROUTE-01/ROUTE-08 frozen routes; KN-LIT-015''s annotation on the archimedean/F_p gap for a related technique.'
