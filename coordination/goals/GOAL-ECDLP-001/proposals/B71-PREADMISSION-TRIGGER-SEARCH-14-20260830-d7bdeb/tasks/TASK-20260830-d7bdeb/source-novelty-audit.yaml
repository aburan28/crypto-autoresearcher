objects_read:
  - id: WITNESS_SET_LITERATURE
    provenance: retrieved
    source_refs:
      - arXiv:0810.2983
      - arXiv:2002.00180
      - arXiv:1507.07069
      - arXiv:1608.00540
      - arXiv:0801.3105
      - arXiv:1908.00899
      - arXiv:1503.02038
    read_for: >-
      To confirm the exact structural cost (path count) of building a
      witness set for a variety, and whether any variant could supply
      r_R mod g_I at sub-Theta(B^3) cost.
    supplied: >-
      Confirmation that a witness set for a pure-dimensional degree-D
      variety consists of exactly D points, requiring at least D
      homotopy-path tracks to build.
    limitations: >-
      None supplies a sub-Theta(B^3) construction for the frozen setting's
      ambient variety, whose degree is exactly deg(r_R) = Theta(B^3).
  - id: MONODROMY_BREAKUP_LITERATURE
    provenance: retrieved
    source_refs: [arXiv:cs/0509067, arXiv:2412.17952]
    read_for: Whether monodromy structure could supply a compact decoding without a full witness set.
    supplied: Confirmation that monodromy breakup operates ON an already-built witness set, not independently of one.
    limitations: Inherits the witness-set prerequisite in full; no independent construction found.
  - id: PARAMETER_HOMOTOPY_LITERATURE
    provenance: retrieved
    source_refs: [arXiv:2010.03069, arXiv:1301.0946]
    read_for: Whether a one-time generic solve could be reused at cheap per-target cost via coefficient-parameter continuation.
    supplied: >-
      Confirmation of the standard Morgan-Sommese guarantee: every family
      member's full solution set requires tracking the family's full path
      count from the generic solution, with no a-priori path-selection
      mechanism for a specific target.
    limitations: >-
      Neither source addresses output-sensitive tracking to a single target
      label; the per-target cost is the full generic path count in both.
  - id: PSEUDO_WITNESS_SET_ELIMINATION
    provenance: retrieved
    source_refs: [arXiv:2601.04383]
    read_for: >-
      To find a 2026-era numerical-elimination technique matching the
      dispatch's named scope item (random linear slicing) that might supply
      a public sub-Theta(B^3) construction bearing on r_R mod g_I.
    supplied: >-
      A genuinely new, non-withdrawn, two-version theorem/method: computing
      complements of a projected hypersurface via pseudo-witness sets and
      line intersections, without materializing the eliminant.
    limitations: >-
      The seed (a witness set for the ambient variety) costs Theta(B^3);
      the per-query output is a floating-point zero/nonzero test, not an
      exact F_p value.
  - id: ALPHA_THEORY_CERTIFICATION_LITERATURE
    provenance: retrieved
    source_refs:
      - arXiv:0912.0920
      - arXiv:2402.07053
      - arXiv:1406.5523
      - arXiv:1505.03432
      - arXiv:2604.15562
    read_for: >-
      To discharge the dispatch's mandatory exactness/certification honesty
      requirement for every numerical candidate this round.
    supplied: >-
      Confirmation that Smale's alpha theory and Krawczyk-interval methods
      rigorously certify convergence of Newton's method to a true, exact
      root over C (or R); this is a real, well-established capability.
    limitations: >-
      Certification is characteristic-zero only; none of the five sources
      addresses, or claims to address, reduction of the certified value
      modulo a prime p.
  - id: PROBABILISTIC_SATURATION_FINITE_FIELD_COUNTING
    provenance: retrieved
    source_refs: [arXiv:1908.06020]
    read_for: >-
      To check, per the dispatch's exactness mandate, whether any retrieved
      numerical-algebraic-geometry-adjacent technique is genuinely finite-
      field-native rather than archimedean.
    supplied: >-
      Confirmation that probabilistic ideal saturation for counting
      solutions outside a base locus can be run natively over a finite
      field, with declared bounds on the field size needed for a target
      confidence level -- genuinely escaping the archimedean/field-mismatch
      obstruction.
    limitations: >-
      Only the abstract was read; the paper's precise cost formula is not
      established here. The method's output (a scalar count) does not
      match the shape of object the trigger requires (a remainder or
      labeled correspondence).

