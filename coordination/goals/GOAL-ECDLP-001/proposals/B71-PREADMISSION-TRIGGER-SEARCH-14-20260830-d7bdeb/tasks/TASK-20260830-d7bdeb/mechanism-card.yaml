    presupposed circuit is observed); and (iii) the already-costed-route
    exclusion as a named, route-specific, cost-quantified check per the
    amended G8 wording.
  public_computation_check: >-
    C1-C4's seeds are genuinely public in the narrow sense the amended G2
    requires (no root, factor, or Groebner basis of g_I/r_R is imported to
    build a generic start system); the failure in every case is COST (the
    seed's construction already pays the Theta(B^3) degree floor) and
    EXACTNESS (the output is a floating-point complex approximation), not a
    hidden witness. C5 supplies no construction of its own to check. C6's
    computation is genuinely public and, uniquely this round, genuinely
    exact-capable over F_p, but computes the wrong shape of object.
  quantifier_order_check: >-
    Required order: freeze the P1553 rings, bases, CRT components, and
    interval geometry; fix the public g_I and r_R construction; name the
    trigger object T; receive public E, P, Q; construct T's numerical
    representation from E, P, Q alone at declared, bounded cost; recover an
    EXACT value in F_p from it; compute r_R mod g_I (or the dyadic
    unit-product step) from that exact value; enumerate the full cost and
    verify the B^(5/4)/o(ell^(1/2)) bounds. Forbidden order: build a
    Theta(B^3)-path witness set or pseudo-witness set first, THEN ask whether
    a cheap per-query step exists on top of it (C1-C4); or certify exactness
    over C and silently treat that as exactness over F_p without a costed
    lift-and-reduce step (C5). Every candidate this round violates the
    required order in one of these two ways; C6 violates it by never
    reaching the required output shape at all.
  already_costed_route_exclusion: >-
    Named, route-specific, cost-quantified check per the amended G8 wording:
    C1's declared preprocessing exponent (3) is dominated by (equal to)
    ROUTE-08's declared exponent (cost_exponent_in_B 3, node
    materialize_resultant_coefficients); C2 inherits C1's exponent plus its
    own monodromy-loop overhead; C3's declared preprocessing AND online
    exponents (3 and 3) are both dominated by ROUTE-08's exponent; C4's
    declared seed exponent (3) is dominated by ROUTE-08's exponent; C5 is a
    certification layer on C1-C4's own undischarged exponents; C6 does not
    reach a route comparison because it fails G1 on output type first. This
    discharges the dispatch's mandatory G8 comparison, under the amended
    cost-dominance wording, for every candidate this round.

lossy_projection_test_summary: >-
  C1's tracked object (the Theta(B^3) floating-point witness points) is NOT
  genuinely lossy relative to the exact resultant's full root/coefficient
  data: it is the SAME full Theta(B^3)-size object in a different
  representation (floating-point points instead of polynomial coefficients)
  -- a change of arithmetic model, not a new projection, mirroring round
  thirteen's verdict on C2's vocabulary change. C2's tracked object (monodromy
  orbit representatives) could in principle be more compact than the full
  point set, but the discard happens only AFTER C1's full Theta(B^3) cost is
  already paid -- the same "not genuinely lossy before the full cost is
  incurred" failure mode round thirteen's C3 and round twelve's Bezoutian
  exhibited. C3's tracked object (the per-target retracked path endpoints) is
  not lossy at all: every one of the Theta(B^3) generic paths must be
  individually retracked per fresh target, with nothing discarded, mirroring
  round thirteen's C4 (identical in value to the base object). C4's tracked
  object (the pseudo-witness fiber plus interpolated univariate data) IS
  genuinely lossy in its own paper's stated sense for the PER-QUERY leg (it
  avoids materializing the full eliminant for each additional query), but its
  domain of definition (the initial pseudo-witness set) is not reachable
  compatibly with the frozen budget without first paying the same Theta(B^3)
  cost the projection was meant to avoid -- the same "discarded incompatibly"
  failure mode round thirteen's C5 exhibited, here for a cost reason (an
  expensive but genuinely public precomputation) rather than a witness
  reason. C5's tracked object (the alpha-theory-certified true complex root)
  is lossy relative to an infinite-precision floating-point history, but its
  target space (exact characteristic-zero algebraic numbers) is not even the
  same field as the frozen setting's target (F_p); the discard is not
  compatible with the target's operations because reduction modulo p is not
  among the operations alpha-theory certification defines or costs. C6's
  tracked object (a scalar intersection count) is genuinely, extremely lossy
  and IS reachable compatibly with F_p operations (the one candidate this
  round to clear that half of the test) -- but it discards precisely the
  information the trigger shape needs, so the retained part does not
  propagate deterministically to the required output at all: this is a
  lossy projection to the WRONG target object, not a lossy projection to the
  right one.

