          suppressed per the inventor protocol's no-premature-closure
          instruction: ONCE that Theta(B^3) seed exists, this paper's own
          selling point is that FURTHER per-query membership/evaluation
          questions (e.g., "is this specific label a root of r_R") can be
          answered by O(1) additional path-tracks each via the trace test and
          monodromy reuse, rather than by re-deriving or re-expanding the
          eliminant -- a genuine separation of preprocessing cost from
          per-query cost that is structurally cleaner, on its per-query leg
          alone, than component (c)'s coefficient-parameter approach (whose
          per-target leg is ALSO Theta(B^3)). This does not rescue the
          candidate: the preprocessing leg alone (Theta(B^3)) already exceeds
          the B^(9/4) cap regardless of how cheap the per-query leg becomes,
          and even a hypothetically free preprocessing leg would still face
          the exactness gap below. A further, distinct and decisive honesty
          finding specific to this round's mandatory disclosure: the
          per-query answer this method supplies is a NEARNESS-to-zero test
          on a floating-point residual (is a specific complex point
          approximately on the hypersurface), not a VALUE. Even with perfect
          zero/nonzero discrimination (itself requiring problem-specific
          condition-number bounds this round did not establish), a floating-
          point evaluation of a nonzero residual carries no information about
          which element of F_p that residue equals -- recovering the actual
          remainder r_R mod g_I (a polynomial of degree less than B encoding
