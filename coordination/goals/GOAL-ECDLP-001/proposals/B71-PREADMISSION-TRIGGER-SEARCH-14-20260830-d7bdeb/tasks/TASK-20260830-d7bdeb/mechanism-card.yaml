          the same object component (a) analyzed. That seed is genuinely
          public (no root, factor, or Groebner basis of g_I/r_R is imported
          to build it) but its CONSTRUCTION COST is exactly component (a)'s
          Theta(B^3) path-track floor, because the ambient variety's degree
          IS what makes deg(r_R) = Theta(B^3) in the first place: the seed
          silently already contains information equivalent to the full
          Theta(B^3) intersection structure, matching the "represented-table"
