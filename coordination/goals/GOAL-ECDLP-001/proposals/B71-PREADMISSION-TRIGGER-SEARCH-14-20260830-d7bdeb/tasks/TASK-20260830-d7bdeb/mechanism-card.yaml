route_preservation:
  closure_statement: >-
    This is a scoped no-candidate result for the exact searched scope. It
    does not close, weaken, or falsify any route, family, or broader
    approach. The route-identity findings established this round (C1's
    witness-set cost IS ROUTE-08's materialization performed via path
    tracking; C2 is a refinement layered on C1; C3's per-target cost is
    ROUTE-01/08's own cost repeated per fresh target; C4's seed IS the same
    materialization under a different numerical technique; C5 certifies
    C1-C4 without touching their cost or field-mismatch failures; C6 computes
    a different, insufficient object) are named and argued per the inventor
    protocol's closure standard, but are scoped exactly to the specific
    literature read this round -- not a claim that no future numerical,
    randomized, or p-adic construction could ever supply a trigger.

decision_summary: >-
  The fourteenth trigger search was performed over a scope explicitly
  disjoint from rounds seven through thirteen: witness-set computation and
  numerical irreducible decomposition (C1), monodromy-based decomposition
  (C2), parameter and coefficient-parameter homotopy continuation (C3),
  numerical resultant/elimination via random linear slicing using
  pseudo-witness sets (C4), certification via Smale's alpha theory (C5), and
  a genuinely finite-field-native probabilistic saturation technique (C6),
  via the arXiv export API and the internal knowledge corpus. This round
  established two structurally distinct obstructions applying across the
  numerical/continuation paradigm: a degree-floor obstruction (every
  witness-set-based method's path count is lower-bounded by the ambient
  variety's degree, Theta(B^3), matching ROUTE-01/08's own already-costed
  materialization) and an exactness/field-mismatch obstruction genuinely new
  to this round (complex/real homotopy continuation, even under the
  strongest available certification technique, Smale's alpha theory,
  certifies exactness in characteristic zero only, and bridging that to an
  exact F_p answer requires an uncosted, unverified lift-and-reduce step
  outside the frozen exponent framework). C1 fails on both the degree floor
  and the exactness gap. C2 inherits C1's failures and adds a circularity (it
  needs an already-computed witness set as input). C3 is the sharpest
  negative finding: its per-target ONLINE cost, not merely its preprocessing
  cost, is Theta(B^3), because coefficient-parameter continuation offers no
  way to select in advance which generic path lands on the target label. C4
  is the round's most interesting near miss, matching the dispatch's named
  scope item precisely and offering a genuinely cheap per-query leg once its
  Theta(B^3) seed is built, but the seed cost alone already exceeds the
  preprocessing cap, and its output (a zero/nonzero floating-point test) is
  the wrong TYPE of exactness to supply an actual remainder value. C5 shows
  precisely, and honestly, why certification does not close the exactness
  gap for this problem: it certifies the wrong field. C6 is disclosed as a
  genuine structural finding -- not every numerical-algebraic-geometry-
  labeled technique carries the archimedean field-mismatch obstruction --
  but it computes a scalar count, not the required transducer, so it fails
  on output type. Every candidate considered (C1-C6) is judged item-by-item
  against the frozen gate (G1-G8, amended G2/G8 wording); none passes every
  item. The honest disposition is scoped_no_candidate, with every broader
  route preserved (including an explicitly named, unsearched p-adic
  Hensel-lifting alternative for a future round), the mandatory G8 comparison
  against the eight named routes discharged with a specific, cost-quantified
  match for every candidate, and no B71, experiment, evidence, attack, SOTA,
  or breakthrough claimed.
