  p1553_object_source: >-
    H-CREP-001 (internal, read in full this round): g_I is the squarefree
    label polynomial whose roots are the public fifth-occurrence labels
    (degree Theta(B)); r_R is the complete-chart intersection resultant
    (degree Theta(B^3)); z_R = gcd(g_I, r_R) is the target-label support
    factor. EXP-CREP-001's specification.yaml names the eight frozen routes;
    ROUTE-08's package.json node n2 (materialize_resultant_coefficients)
    declares cost_exponent_in_B 3 -- the numerical anchor every route
    comparison below reuses, exactly as rounds twelve and thirteen did.
  critical_directional_fact_established_this_round: >-
    Two structurally independent obstructions apply to every numerical
    algebraic geometry / homotopy continuation candidate searched this round,
    and they are of genuinely different character from anything rounds seven
    through thirteen established. (i) THE DEGREE-FLOOR OBSTRUCTION: every
    retrieved witness-set, monodromy, or pseudo-witness-set source defines a
    witness set as EXACTLY deg(V) points for a variety V, obtained by tracking
    at least deg(V) continuation paths (arXiv:0810.2983, arXiv:2002.00180,
    arXiv:1908.00899 all state this construction directly); in the frozen
    setting the relevant ambient variety's degree is exactly deg(r_R) =
    Theta(B^3) by H-CREP-001's own construction, so ANY witness-set-based
    numerical method costs at least Theta(B^3) path-tracks to build its
    initial representation -- a STRUCTURAL lower bound of the method itself,
    not an incidental inefficiency, and numerically identical in exponent to
    ROUTE-01's componentwise resultant and ROUTE-08's node n2 materialization
    cost. This is the numerical-paradigm counterpart of every prior round's
    recurring Theta(B^3) pattern. (ii) THE EXACTNESS/FIELD-MISMATCH
    OBSTRUCTION, genuinely new to this round: polynomial homotopy
    continuation is, without exception in the retrieved literature, a method
    for tracking solution PATHS through the COMPLEX (or real) numbers via
    continuous deformation; correctness (no path crossings for generic
    choices, properness, convergence) is proved using the topology of C or R.
    F_p has no such structure -- there is no continuous parameter t in [0,1]
    or path in C along which two F_p systems can be "continued" into one
    another. Every candidate below therefore either (a) never leaves C/R at
    all, so its raw output is a floating-point or fixed-precision complex
    approximation with no defined relationship to a specific element of F_p,
    or (b) would require an uncosted, unverified detour through a
    characteristic-zero lift of E, P, Q followed by an exact reduction of the
    resulting algebraic number back to F_p -- a step whose own cost (bit
    precision, minimal-polynomial degree) is not measured by the frozen
    element-count exponent framework at all and is not established to be
    cheap, or even generically correct at the specific prime p, by anything
    retrieved this round. The single retrieved candidate that is genuinely
    finite-field-native (C6, probabilistic saturation) escapes obstruction
    (ii) but computes only a scalar count, not the remainder transducer the
    trigger shape requires, so it fails on output-type instead. This
    exactness finding is independently corroborated, for a different
    hypothesis line (Semaev factor-base membership, not this task's P1553
    g_I/r_R object), by this program's own internal corpus: an internal
    heuristic candidate (ECFG-P1593, inputs/idea_generation_20260719_batch4.md)
    already flagged "no archimedean path to continue along" over F_p as the
    likely fatal obstruction for numerical continuation applied to ECDLP-index-
    calculus problems, and a knowledge-corpus annotation (KN-LIT-015) already
    states that for a related numerical-continuation technique (polyhedral
    homotopy) "the method is numerical (continuation over C); the program
    works over F_p, so the relevant transferable content is the mixed-volume
    path/complexity count... not the floating-point path tracker itself."
    This round's contribution is instantiating this obstruction, in full
    detail and against the strongest available certification technique
    (Smale's alpha theory), specifically to the P1553 g_I/r_R remainder
    object; the underlying mathematical obstruction itself is known internal
    prior art, not newly discovered here.
