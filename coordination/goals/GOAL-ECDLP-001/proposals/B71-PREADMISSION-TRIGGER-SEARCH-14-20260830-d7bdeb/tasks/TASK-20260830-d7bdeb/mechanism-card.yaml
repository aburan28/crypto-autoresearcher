  component_b_monodromy_based_decomposition:
    what_was_searched: >-
      Bounded network retrieval over monodromy-based numerical irreducible
      decomposition and the monodromy breakup algorithm, aimed at whether
      monodromy structure could supply a compact (sub-Theta(B^3)) decoding
      of the extendible-label support without first building a full witness
      set.
    searches_performed:
      - query: 'all:"monodromy" AND all:"irreducible decomposition"'
        instrument: webfetch arXiv export API
        results: 3 (all read at abstract level)
    objects_read:
      - id: MONODROMY_BREAKUP_LITERATURE
        name: >-
          Monodromy-based numerical irreducible decomposition (Leykin-
          Verschelde, Decomposing Solution Sets of Polynomial Systems: A New
          Parallel Monodromy Breakup Algorithm, arXiv:cs/0509067;
          Edwards-Hauenstein, On computing local monodromy and the numerical
          local irreducible decomposition, arXiv:2412.17952).
        source_refs: [arXiv:cs/0509067, arXiv:2412.17952]
        assessment: >-
          Both sources confirm the monodromy breakup algorithm's input is an
          ALREADY-COMPUTED witness set (or local witness set): the algorithm
          repeatedly picks a random loop in parameter space, tracks the
          witness points around it, and merges points found to lie on the
          same irreducible component via the induced permutation. It
          supplies a FACTORIZATION of a witness set into irreducible
          components, not an independent construction of one. Instantiated
          to the frozen setting this is a strict refinement layered ON TOP
          of component (a)'s Theta(B^3)-path witness set, plus its own
          additional monodromy-loop path-tracks (each loop retraces the full
          point set once); it inherits component (a)'s degree-floor cost in
          full and adds to it, and it still outputs floating-point orbit
          data over C, not an exact F_p value.
    resource_check_answer:
      examined: true
      reading_found: true
      what_was_examined: >-
        knowledge/ and inputs/ grepped for "monodromy breakup", "local
        monodromy", "Leykin", "Edwards"; H-CREP-001.yaml re-read to confirm
        no monodromy-group axis is separately tracked by the frozen gate.
      answer: >-
        Same two internal hits as component (a) (KN-LIT-015, ECFG-P1593);
        no additional on-topic hit specific to monodromy breakup. Neither
        internal object supplies a P1553-typed construction.

  component_c_parameter_coefficient_homotopy_continuation:
    what_was_searched: >-
      Bounded network retrieval over parameter homotopy continuation and
      coefficient-parameter continuation (the Morgan-Sommese theorem: paths
      tracked once for a generic member of a parametrized family transfer to
      any other member), aimed at whether a one-time expensive generic solve
      could be reused across many fresh targets Q at genuinely cheap
      per-target online cost.
    searches_performed:
      - query: 'all:"parameter homotopy continuation"'
        instrument: webfetch arXiv export API
        results: 1 (read at abstract level)
      - query: 'all:"coefficient-parameter homotopy"'
        instrument: webfetch arXiv export API
        results: 0
      - query: 'all:"coefficient-parameter" AND all:"polynomial system"'
        instrument: webfetch arXiv export API
        results: 1 (read at abstract level)
    objects_read:
      - id: PARAMETER_HOMOTOPY_LITERATURE
        name: >-
          Parameter and coefficient-parameter homotopy continuation
          (Lindberg-Zachariah-Boston-Lesieutre, The Distribution of the
          Number of Real Solutions to the Power Flow Equations,
          arXiv:2010.03069, combining monodromy and parameter homotopy
          continuation; He-Mehta-Niemerg-Rummel-Valeanu, Exploring the
          Potential Energy Landscape Over a Large Parameter-Space,
          arXiv:1301.0946, using coefficient-parameter cheater's-homotopy
          methods).
        source_refs: [arXiv:2010.03069, arXiv:1301.0946]
        assessment: >-
          Both confirm the standard coefficient-parameter (Morgan-Sommese)
          guarantee: solving ONE generic member of a parametrized family
          (cost = the family's total path count, i.e. its Bezout or BKK
          degree) lets EVERY OTHER member's FULL solution set be obtained by
          tracking the SAME NUMBER of paths from the generic solution to that
          member's specific parameter values -- the saving is in avoiding a
          fresh start-system/Bezout derivation per instance, not in reducing
          the PER-INSTANCE path count below the family's degree. Applied to
          the frozen setting, the ambient family's degree is Theta(B^3), so
          both the one-time generic preprocessing AND every fresh target Q's
          online decoding cost Theta(B^3) tracked paths -- worse for the
          frozen budget than a pure witness-set framing (component a), since
          there both legs are at least concentrated on the ONE preprocessing
          side; here the fresh-target ONLINE leg itself is Theta(B^3),
          directly violating the B^(5/4) online cap by a much larger margin,
          because coefficient-parameter continuation gives no mechanism to
          select in advance which of the Theta(B^3) generic paths will land
          on the specific target label without already knowing the answer.
    resource_check_answer:
      examined: true
      reading_found: false
      what_was_examined: >-
        knowledge/ and inputs/ grepped for "coefficient-parameter", "Morgan-
        Sommese", "cheater's homotopy", "parameter homotopy"; H-CREP-001.yaml
        re-read to confirm the frozen preprocessing/online split (B^(9/4) /
        B^(5/4)) is the exact axis this candidate's per-target cost is
        measured against.
      answer: >-
