  disjoint_scope_statement: >-
    This round's scope is explicitly disjoint from rounds seven through
    thirteen. Round seven searched subresultant/PRS recurrences, modular-
    composition circuit borders, fast-remainder/Kedlaya-Umans arithmetic,
    Semaev/Weil-descent index calculus, combinatorial unranking, and
    transposed/multipoint evaluation. Round eight read the withdrawn round-
    seven near-miss in full text and searched function-field, algebraic-
    geometry, and transfer-theoretic circuit identities. Round nine searched
    structured, sparse, triangular, and black-box multivariate-resultant
    theory and explicit intersection-theoretic computation. Round ten
    searched normal-form computation for triangular structures and closed
    the deck-local mixed-radix identity sub-avenue (not reopened here).
    Round eleven searched algebraic coding theory and sparse-interpolation
    reconstruction and collapsed both onto ROUTE-04 (not reopened here).
    Round twelve searched the spectral structure of fixed matrices
    (Bezoutian, companion, Sylvester, multiplication-operator eigenstructure)
    and u-resultants, and collapsed its four candidates onto ROUTE-01,
    ROUTE-02, ROUTE-05, and ROUTE-08 (not reopened here). Round thirteen
    searched algebraic complexity theory and interactive-proof methods
    (VP/VNP, Berkowitz's NC^2 circuit, a 2025 constant-depth GCD circuit,
    VSBR depth reduction, sumcheck/GKR) and found none passed the gate. Every
    one of rounds seven through thirteen was an EXACT/SYMBOLIC technique: a
    coefficient-arithmetic algorithm operating natively over the same ring or
    field as the frozen setting. This round asks a genuinely different
    QUESTION TYPE, matching the dispatch's own framing: whether abandoning
    exact coefficient arithmetic for CONTINUOUS, floating-point (or
    fixed-precision) path tracking over C -- witness-set computation,
    monodromy-based numerical irreducible decomposition, parameter and
    coefficient-parameter homotopy continuation, and numerical
    resultant/elimination via random linear slicing (pseudo-witness sets) --
    could sidestep the Theta(B^3) materialization / equivalent-witness-
    circularity pattern every prior round converged on. One item retrieved
    this round (the classical notion of a u-resultant, used here strictly in
    its NUMERICAL, random-linear-slicing, witness-point sense) is adjacent in
    NAME to round twelve's u-resultant component, which screened it strictly
    as an EXACT multivariate-elimination construction (reducing elimination
    to a single linear form, still requiring symbolic resultant expansion);
    this round's pseudo-witness-set candidate (C4) is a different
    computational paradigm -- it numerically samples intersection points via
    path tracking rather than symbolically expanding any resultant -- and is
    recorded as a disjoint, non-duplicate treatment of a related classical
    idea, not a re-run of round twelve's screen.
