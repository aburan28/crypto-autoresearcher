research_question: >-
  Does any actual recurrence, circuit identity, or retrieved theorem from
  numerical algebraic geometry or polynomial homotopy continuation -- witness
  sets and numerical irreducible decomposition, monodromy-based decomposition
  and monodromy breakup, parameter and coefficient-parameter homotopy
  continuation, or numerical resultant/elimination via random linear slicing
  (pseudo-witness sets) -- instantiate to the frozen P1553 elliptic setting as
  (a) a typed public target-local remainder transducer for r_R mod g_I, or (b)
  the exact dyadic subinterval unit-product interface, passing every item of
  the frozen pre-admission gate? This round's paradigm is genuinely different
  from rounds seven through thirteen's exact/symbolic techniques: it is
  continuous, floating-point (or fixed-precision) path tracking rather than
  exact coefficient arithmetic. The dispatch's mandatory honesty requirement
  binds throughout: a candidate that computes only an approximate value must
  state explicitly how, or whether, it recovers an EXACT finite-field answer,
  and at what precision/certification cost -- an uncertified numerical answer
  is not a typed trigger.

