trigger_shapes:
  shape_a_remainder_transducer: >-
    A typed public P1553 target-local remainder transducer for r_R mod g_I:
    an exact computation, from E, P, and Q alone, of the remainder of the
    complete-chart intersection resultant r_R upon division by the
    squarefree label polynomial g_I, with no roots, factors, witnesses, or
    Groebner bases of r_R or the underlying system, inside the B^(5/4)
    interface budget.
  shape_b_dyadic_unit_product: >-
    The exact dyadic subinterval unit-product interface: a public
    construction over the frozen mixed-radix deck/interval geometry that
    supplies the unit-product step the two-restriction and three-deck
    corrections leave as the surviving coordinate-aware interface. Not
    reached by any candidate this round: no witness-set, monodromy,
    parameter-homotopy, or numerical-elimination construction found below
    references, is typed to, or bears on the deck/interval geometry at all;
    this trigger shape is recorded as unsupplied rather than searched
    against a specific literature match, exactly as in rounds eleven through
    thirteen.

scope_components:
  component_a_witness_sets_numerical_irreducible_decomposition:
    what_was_searched: >-
      Bounded network retrieval over witness-set representations of
      algebraic varieties and numerical irreducible decomposition (Sommese-
      Verschelde-Wampler framework), aimed at whether a witness set for the
      complete-chart intersection system could supply r_R mod g_I at
      sub-Theta(B^3) construction cost.
    searches_performed:
      - query: 'all:"numerical algebraic geometry" AND all:"witness set"'
        instrument: webfetch arXiv export API
        results: 7 (all read at abstract level)
      - query: 'all:"numerical algebraic geometry" AND all:"elimination"'
        instrument: webfetch arXiv export API
        results: 3 (all read at abstract level)
    objects_read:
      - id: WITNESS_SET_LITERATURE
        name: >-
          Witness-set representation and numerical irreducible decomposition
          literature (Verschelde, Polyhedral Methods in Numerical Algebraic
          Geometry, arXiv:0810.2983; Sottile, General witness sets for
          numerical algebraic geometry, arXiv:2002.00180; Hauenstein-
          Rodriguez, Multiprojective witness sets and a trace test,
          arXiv:1507.07069; Leykin-Rodriguez-Sottile, Trace test,
          arXiv:1608.00540; Leykin, Numerical primary decomposition,
          arXiv:0801.3105; Hauenstein-Leykin-Rodriguez-Sottile, A numerical
          toolkit for multiprojective varieties, arXiv:1908.00899;
          Krone-Leykin, Eliminating dual spaces, arXiv:1503.02038).
        source_refs:
          - arXiv:0810.2983
          - arXiv:2002.00180
          - arXiv:1507.07069
          - arXiv:1608.00540
          - arXiv:0801.3105
          - arXiv:1908.00899
          - arXiv:1503.02038
        assessment: >-
          Every source states or uses the same defining fact: a witness set
          for a pure-dimensional variety V of degree D consists of exactly D
          points, obtained as the intersection of V with a generic linear
          space of complementary dimension, and computing it requires
          tracking (at least) D homotopy paths from a start system of the
          same degree. Applied to the frozen setting, the relevant ambient
          variety (the complete-chart intersection system whose elimination
          produces r_R) has degree Theta(B^3) by H-CREP-001's own
          construction, so a witness set for it costs at least Theta(B^3)
          path-tracks -- the numerical-paradigm counterpart of ROUTE-01's
          componentwise resultant and ROUTE-08's Theta(B^3) materialization
          node. This is a structural degree-floor of the method, not an
          implementation inefficiency: no witness-set method can certify
          completeness with fewer than deg(V) points without already
          possessing extra structural knowledge of V (e.g. its exact
          decomposition), which is precisely the information the frozen
          setting has not yet publicly constructed.
