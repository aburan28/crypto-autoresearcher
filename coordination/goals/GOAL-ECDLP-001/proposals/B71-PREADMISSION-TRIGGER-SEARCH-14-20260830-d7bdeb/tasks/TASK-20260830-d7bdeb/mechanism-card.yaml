    objects_read:
      - id: PSEUDO_WITNESS_SET_ELIMINATION
        name: >-
          Elimination Without Eliminating: Computing Complements of Real
          Hypersurfaces Using Pseudo-Witness Sets (arXiv:2601.04383;
          Breiding, Cobb, Englander, Farnsworth, Hauenstein, Henriksson,
          Johnson, Lopez Garcia, Mundayur; v1 2026-01-07, v2 2026-04-04).
        source_refs: [arXiv:2601.04383]
        assessment: >-
          A genuinely new (2026), on-topic, non-withdrawn (two versions, the
          second correcting errors, no retraction) paper that is the
          sharpest match to this round's named scope item. Mechanism: a
          hypersurface that arises as the projection of an ambient variety
          (exactly r_R's own construction as the complete-chart intersection
          system's elimination) is intersected with a generic LINE, using a
          pseudo-witness set built once from a witness set of the AMBIENT
          variety, and subsequent queries along that line (or nearby lines,
          via monodromy/trace-test reuse) are answered by cheap additional
          path-tracks plus univariate interpolation, without ever writing
          down the eliminant polynomial's coefficients. Instantiated to the
