  component_e_certification_exactness_alpha_theory:
    what_was_searched: >-
      Bounded network retrieval over certification of numerical homotopy
      continuation output (Smale's alpha theory and its algorithmic
      realizations), performed specifically to discharge the dispatch's
      mandatory exactness/certification honesty requirement for every
      numerical candidate above.
    searches_performed:
      - query: 'all:"certified" AND all:"homotopy continuation"'
        instrument: webfetch arXiv export API
        results: 10 (all read at abstract level)
    objects_read:
      - id: ALPHA_THEORY_CERTIFICATION_LITERATURE
        name: >-
          Certification of numerical homotopy tracking via Smale's alpha
          theory and interval methods (Beltran-Leykin, Certified numerical
          homotopy tracking, arXiv:0912.0920; Duff-Lee, Certified homotopy
          tracking using the Krawczyk method, arXiv:2402.07053; Hauenstein-
          Lerario-Lundberg-Mehta, Experiments on the zeros of harmonic
          polynomials using certified counting, arXiv:1406.5523; Kranich, An
          epsilon-delta bound for plane algebraic curves..., arXiv:1505.03432;
          Guillemot-Voight, Belyi map verification using certified path
          tracking, arXiv:2604.15562).
        source_refs:
          - arXiv:0912.0920
          - arXiv:2402.07053
          - arXiv:1406.5523
          - arXiv:1505.03432
          - arXiv:2604.15562
        assessment: >-
          Every source confirms the same precise capability and its exact
          limit. Given a floating-point approximation z of a solution to a
          polynomial system over C, alpha theory (via Smale's
          gamma/alpha invariants) or an equivalent Krawczyk interval
          computation RIGOROUSLY CERTIFIES that Newton's method started at z
          converges quadratically to a UNIQUE, EXACT root of that COMPLEX (or
          real) system -- a genuine, well-established, machine-checkable
          bridge from "approximate" to "exact algebraic number over C". This
          is the honest, best-case answer to the dispatch's certification
          question for the C1-C4 candidates above: certification exists and
          is real, but it certifies exactness IN CHARACTERISTIC ZERO ONLY. It
          establishes nothing about that exact complex algebraic number's
          class modulo p. Bridging that remaining gap to the frozen F_p
          setting requires two further, uncosted, unverified steps: (1)
          choosing a specific characteristic-zero lift of E, P, Q and the
          complete-chart system (not canonically supplied by data defined
          only mod p, and generically producing a DIFFERENT complex root
          structure for different lifts, unless reduction at the specific
          prime p is "good" -- a condition not checked or checkable cheaply
          here); and (2) reducing the certified exact complex algebraic
          number back to F_p, whose cost (minimal-polynomial degree, bit
          precision) is a BIT-COMPLEXITY quantity outside the frozen
          element-count-in-B exponent framework entirely, and is exactly the
          kind of exact symbolic computation the numerical approach was
          invoked to avoid re-materializing. Alpha theory therefore converts
          one exactness gap (float vs. true complex root) into a different,
          unresolved exactness gap (true complex root vs. its class mod p),
          without touching the Theta(B^3) degree-floor of component (a)-(d)
          at all.
    resource_check_answer:
      examined: true
      reading_found: false
      what_was_examined: >-
        knowledge/ and inputs/ grepped for "alpha theory", "Smale", "Krawczyk",
        "certified homotopy", "Beltran-Leykin"; H-CREP-001.yaml re-read to
        confirm the frozen gate's exactness requirement (the amended G2's
        "exact computation from E, P, and Q" clause) is the precise item this
        candidate is judged against.
      answer: >-
        No corpus record references alpha theory, Smale's certification, the
        Krawczyk method, or any P1553-typed certification discussion. None
        found beyond the general landscape already surfaced in components
        (a)-(d).

