          number of solutions of a system OUTSIDE a base locus (an
          intersection-theoretic invariant closely related to a variety's
          degree) via a randomized saturation test that the paper states
          explicitly "can be employed using both finite fields and
          floating-point computations", with declared bounds on the finite
