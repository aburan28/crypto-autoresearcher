          retrieved technique this round that is genuinely FINITE-FIELD-
          NATIVE by the authors' own design -- it escapes obstruction (ii)
          (the archimedean/field-mismatch gap) entirely, because it is a
          randomized generic-evaluation test (in the spirit of polynomial
          identity testing / Schwartz-Zippel), not a continuous path-tracking
          method, despite being described in the same numerical-algebraic-
          geometry literature and toolset. This is disclosed as the round's
          most structurally interesting finding, not suppressed: not every
          technique carrying the "numerical algebraic geometry" label shares
