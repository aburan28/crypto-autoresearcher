schema: 'crypto.autoresearch.red_team_report.v1'

red_team_report:
  id: RT-20260830-031380
  task_id: TASK-20260830-031380

  claim_under_review: |-
    decision-record-among-alternatives.yaml's justification for choosing the
    two_pairs_theta_b4 reading of H-CREP-001's mechanism sentence over the
    corpus-declared-matching one_pair_theta_b2 reading, specifically whether
    that justification is circular (would it flip to favor whichever reading
    happened to match the pre-existing declared figure), per the exact bias
    named in DEC-20260830-69bbf7.

  circularity_swap_test:
    swap_definition: |-
      Per dispatch_queue.json's own wording for this joint (the authoritative
      task specification): for each stated reason in the justification, ask
      whether it would read equally well, unchanged, if the corpus's declared
      figure had been Theta(B^4) instead of the actual Theta(B^2). A reason
      that never references, and is not shaped by, which numeric figure was
      already on record survives the swap. A reason that only makes sense, or
      only reads as compelling, given prior knowledge of the actual declared
      figure does not survive and is named as circular.
    method_note: |-
      This is run sentence by sentence against decision-record-among-
      alternatives.yaml's full justification text, not as a single holistic
      impression, per completion_gate 1. The producer's own
      honesty_check_against_circularity section re-examines only the three
      primary_justification points and does not re-examine
      why_the_one_pair_reading_is_rejected's own citation chain; this
      independent pass covers both, plus the producer's own preemption of
      this exact review joint.

    sentences_examined:
      - id: PJ-1-subscript-arithmetic
        source: 'primary_justification, point (1) SUBSCRIPT ARITHMETIC'
        quoted_reason: |-
          'D_12' and 'D_34' use compound two-index subscripts, the standard
          notational convention for the object obtained by combining raw
          decks 1 and 2 (respectively 3 and 4) -- not for relabelling a
          single deck. Combined with H-CREP-001.yaml's own assumption text
          stating there are exactly FIVE primitive decks, the arithmetic
          2+2+1=5 is exact.
        swap_result: survives
        reasoning: |-
          This argument is a pure counting-and-notation argument on two fixed
          texts (the mechanism_note.md subscript spelling and H-CREP-001's
          five-deck assumption). Nowhere does it invoke, compare to, or
          require knowledge of Theta(B^2) or Theta(B^4). Under the swap
          (imagine the corpus had instead declared Theta(B^4)), the sentence
          is verbatim assertable and reaches the identical conclusion. This
          specific reason is figure-independent.
        residual_concern_not_a_circularity_finding: |-
          The premise that compound two-index subscripts are 'the standard
          notational convention' for combination, rather than an arbitrary
          two-digit deck name, is asserted, not independently sourced against
          any other occurrence of a similar naming pattern elsewhere in the
          pinned corpus (e.g. build_packages.py, generate_instances.py, or
          other route notes), and this session's read_scope does not include
          those files. This is a strength-of-evidence gap, not a
          figure-matching circularity; recorded under objections (OBJ-3).

      - id: PJ-2-pair-pair-wording
        source: "primary_justification, point (2) 'PAIR-PAIR RELATION' WORD STRUCTURE"
        quoted_reason: |-
          The mechanism sentence names the tested relation a 'pair-PAIR
          relation', not merely a 'pair relation'... 'Pair-pair' most
          naturally denotes a relation between two objects that are
          THEMSELVES pairs.
        swap_result: survives
        reasoning: |-
          A purely lexical/structural reading of one fixed phrase in
          mechanism_note.md. It does not reference, and its force does not
          change under, which numeric degree figure the corpus happens to
          have declared elsewhere. Under the swap this sentence is verbatim
          assertable with the identical conclusion. Figure-independent.
        residual_concern_not_a_circularity_finding: |-
          The argument does not test, and so cannot rule out, the null
          hypothesis that 'pair-pair' is informal emphatic doubling (compare
          common doubled phrasing such as 'one-on-one' or 'peer-to-peer'),
          which would be compatible with either reading and would carry zero
          discriminating weight rather than favoring two-pairs. This is a
          discriminating-power gap, not a figure-matching circularity;
          recorded under objections (OBJ-4).

      - id: PJ-3-robustness-under-rederivation
        source: 'primary_justification, point (3) ROBUSTNESS UNDER RE-DERIVATION'
        quoted_reason: |-
          Building r_R via ANY construction that genuinely eliminates all
          FOUR degree-B factor-base decks (1,2,3,4) against a fixed,
          B-independent joint relation... gives the SAME leading-order bound,
          Theta(B^4)... This means the Theta(B^4) conclusion is not an
          artefact contingent on guessing the exact D_12/D_34 grouping
          correctly.
        swap_result: survives
        reasoning: |-
          The sentence's own wording never cites the corpus's declared
          figure; it is a Sylvester-resultant degree computation that would
          produce the identical number under the counterfactual corpus state.
          On the narrow figure-dependence axis this test is checking, it is
          not circular.
        separate_and_more_serious_finding_not_a_circularity_finding: |-
          This reason passes the figure-independence swap test but fails a
          different and more important test: it does not discriminate
          between the one-pair and two-pairs readings at all. As shown in
          full in proves-too-much-control-results.yaml (Object 3, point-3
          analysis), applying the identical Sylvester-degree-bookkeeping
          method to the REJECTED one-pair reading produces an equally
          'robust', equally internally-consistent derivation, landing on
          Theta(B^2) instead of Theta(B^4) by the same logic. 'Robustness to
          re-sequencing the elimination order' is a generic property of
          iterated Sylvester resultants and holds for BOTH readings; it is
          therefore not independent evidence for CHOOSING between them, only
          for the internal stability of whichever reading has already been
          assumed. Presenting it as one of 'three independent textual facts'
          overstates the independent support to two facts where there are
          really only two candidate discriminators (points 1 and 2), each of
          which itself carries the residual concerns noted above. This is a
          proves-too-much finding, filed as OBJ-1 and detailed in the
          companion control file; it is reported here because it directly
          bears on how much weight primary_justification's headline framing
          ('three independent textual facts jointly point to the two-pairs
          reading') can carry.

      - id: WOR-1-citation-of-prior-decision
        source: 'why_the_one_pair_reading_is_rejected'
        quoted_reason: |-
          [the one-pair reading] requires treating the compound subscripts
          '12' and '34' as arbitrary two-digit deck NAMES rather than as
          denoting a combination of decks 1-and-2, respectively 3-and-4 -- a
          reading DEC-20260830-69bbf7 itself already flagged as 'if anything,
          the LESS literal fit to the primary source's symmetric naming of
          both named decks'... This draft's decision agrees with, and acts
          on, that prior finding rather than re-litigating it.
        swap_result: does_not_survive_cleanly
        reasoning: |-
          This is the one sentence in the whole justification that does not
          pass cleanly, and it is a different kind of dependency than points
          1-3: it is circular by IMPORTED CITATION rather than by direct
          argument. DEC-20260830-69bbf7's own 'less literal fit' finding was
          asserted (its own text: 'this Coordinator additionally finds...')
          in the very same breath, and the very same document, as its
          explicit flag that 'the one-pair reading was partly selected
          because it matches the pre-existing declared figure rather than
          from an independent derivation excluding the two-pairs case' --
          i.e. DEC-20260830-69bbf7's literalness call was made by a reader
          who was, at that moment, actively reasoning about figure-matching
          bias in the opposite direction, and who did not supply anything
          resembling the subscript-arithmetic or word-structure derivation
          this draft's own points (1)-(2) supply. There is no way to run the
          literal swap on DEC-20260830-69bbf7 itself (it is a fixed, already
          -written historical artifact, not a re-derivable argument), so this
          draft cannot show that an analogous prior finding would have
          favored the SAME direction (more-literal = two-pairs) in the
          counterfactual world where the declared figure was Theta(B^4).
          Citing it as though it were independent corroboration therefore
          re-imports, at one remove, exactly the kind of figure-reactive
          judgment this round exists to rule out. This is graded a genuine,
          if secondary, circularity finding (OBJ-2), not a fatal one: it
          affects only the WOR-1 citation, not primary_justification's three
          points, which stand or fall on their own textual grounds.

      - id: RTP-1-producer-preemption
        source: red_team_joint_preempted
        quoted_reason: |-
          Answered directly, in advance: YES, and that is exactly the
          point... an argument optimised to match the declared figure would
          have selected the one-pair reading, not this one.
        swap_result: not_a_swap_test_target_process_note
        reasoning: |-
          The producer pre-answers exactly this review's assigned joint and
          declares victory before independent review runs. This is disclosed
          by the producer, not concealed, so it is not itself a fabrication;
          but a producer's own answer to the question its reviewer was
          assigned cannot substitute for that reviewer's independent check,
          and per this task's constraints it was not treated as
          dispositive here: the actual sentence-by-sentence pass above was
          performed from the source texts, reaching a more differentiated
          verdict (points 1-2 survive cleanly with residual strength
          caveats; point 3 survives the figure-swap but is non-
          discriminating; WOR-1 does not cleanly survive) than the
          producer's own blanket 'not circular' conclusion.

      - id: HCC-1-scope-of-self-audit
        source: honesty_check_against_circularity
        quoted_reason: |-
          Re-reading primary_justification's three points independently of
          this session's own awareness of the declared Theta(B^2) figure...
          None of the three routes through the declared figure at any step.
        swap_result: accurate_but_incomplete_scope
        reasoning: |-
          This self-audit's claim about points (1)-(3) is, on independent
          re-derivation above, correct as far as it goes. But it audits only
          primary_justification's three numbered points and does not extend
          to why_the_one_pair_reading_is_rejected's own citation of
          DEC-20260830-69bbf7 (WOR-1 above), which is exactly where this
          independent pass finds the residual circularity risk actually
          lives. A self-audit that checks the headline points and omits the
          adjoining citation is not dishonest, but it is incomplete, and its
          'not circular' framing should not be read as covering the full
          justification text this task's handoff asked to be checked.

    overall_verdict: 'not circular on the three headline reasons; circular by imported citation on one adjoining sentence; one headline reason is figure-independent but non-discriminating'
    overall_verdict_statement: |-
      Primary_justification's three numbered points, taken as the producer's
      own direct arguments, do NOT depend on which numeric figure the corpus
      had declared: points (1) and (2) are genuinely figure-independent
      textual arguments (with their own separate, non-circularity strength
      caveats, OBJ-3 and OBJ-4), and point (3) is also figure-independent but
      -- as the Object 3 proves-too-much control shows directly -- fails to
      discriminate between the two readings at all, since it produces an
      equally 'robust' derivation for the rejected one-pair reading. Separate
      from the three headline points, the adjoining
      why_the_one_pair_reading_is_rejected section imports, as supporting
      authority, DEC-20260830-69bbf7's own bare literalness assertion, which
      was itself made in the same breath as, and possibly shaped by, the
      exact figure-matching concern this round exists to test for; that
      specific citation (WOR-1) does not survive the swap test cleanly and is
      named explicitly as the one place genuine residual circularity risk
      remains. The producer's own 'not circular' self-audit is accurate for
      the scope it checked but did not check that citation, and its use of
      point (3) as a third 'independent' pillar overstates the discriminating
      support the justification actually supplies.

  objections:
    - id: OBJ-1
      severity: moderate
      statement: |-
        primary_justification's point (3) ('robustness under re-derivation')
        does not discriminate between the one-pair and two-pairs readings: it
        is a generic property of iterated Sylvester resultants that holds
        equally for both readings (Theta(B^4) under two-pairs, Theta(B^2)
        under one-pair, by the identical method), so calling it one of
        'three independent textual facts' overstates the case to two. Full
        derivation in proves-too-much-control-results.yaml, Object 3.
    - id: OBJ-2
      severity: moderate
      statement: |-
        why_the_one_pair_reading_is_rejected cites DEC-20260830-69bbf7's own
        un-rederived 'less literal fit' assertion as corroborating authority.
        That prior assertion was made in the same document, and the same
        reasoning pass, as DEC-20260830-69bbf7's explicit flag of
        figure-matching bias in the opposite direction, and was not
        accompanied there by any subscript-arithmetic or word-structure
        derivation comparable to this draft's own points (1)-(2). Relying on
        it imports, at one remove, exactly the figure-reactive judgment this
        round is meant to test for.
    - id: OBJ-3
      severity: minor
      statement: |-
        Point (1)'s premise that compound two-index subscripts are 'the
        standard notational convention' for deck combination is asserted,
        not sourced against any other instance of similar naming elsewhere in
        the pinned corpus, and this task's read_scope does not include
        TASK-20260830-06afa2's own derivation-report.yaml, so the claim that
        the one-pair reading is 'a strictly less economical reading of the
        same text' could not be independently checked against the actual
        alternative construction, only against the decision record's own
        characterization of it.
    - id: OBJ-4
      severity: minor
      statement: |-
        Point (2)'s 'pair-pair' word-structure argument does not test the
        null hypothesis that the doubled word is informal/emphatic phrasing
        compatible with either reading, in which case it would carry
        approximately zero discriminating weight rather than favoring
        two-pairs.
    - id: OBJ-5
      severity: major
      statement: |-
        Independent of which reading is correct, the candidate definition
        answers 'what is r_R' as a mathematical object but not 'how is r_R
        constructed within H-CREP-001's own stated exponent caps', which is
        the actual obligation named by RT103-C1's parent hypothesis and by
        mechanism_note.md's 'Cheapest decisive gate' (name every
        target-dependent update and PROVE ITS CONSTRUCTION COST). r_R is
        stated by this draft to be an ONLINE, target-dependent object
        ('r_R(T) itself is the online, target-dependent construction'), with
        degree Theta(B^4) under the chosen reading or Theta(B^2) under the
        rejected one (degree_bookkeeping and the Object 3 rederivation
        respectively). Materializing a degree-Theta(B^2) or degree-
        Theta(B^4) polynomial's coefficients already costs at least B^2 or
        B^4 field elements of online workspace, which exceeds H-CREP-001's
        own fresh_target_online_exponent_cap_in_B of 1.25 by a wide margin
        under EITHER reading, and exceeds even the preprocessing cap of 2.25
        under the two-pairs reading. The draft does not claim, attempt, or
        flag a compact/implicit representation of r_R avoiding full
        materialization, nor does it connect its own degree finding back to
        H-CREP-001's own numeric caps at all; relationship_to_frozen_engine
        discusses only the Theta(B^2)-vs-Theta(B^4) DEGREE tension against
        the corpus's declared figure, never the exponent-cap tension against
        H-CREP-001's own predictions. If anything, fixing the degree at
        Theta(B^4) (rather than leaving it at the previously assumed
        Theta(B^2)) makes the gap between the compact final answer z_R
        (degree at most B) and the naively-represented intermediate object
        WIDER, which is a direct instance of exactly the Theta(B^3)-style
        representation failure mode mechanism_note.md's fact 5 and 'future
        construction must operate on compact generators' passage warn
        against, not evidence that the gap has narrowed. This is not a
        claim that a compact constructor is impossible; it is a claim that
        this draft supplies a definition and a degree bound, not a
        constructor, and RT103-C1's discharge should not be read as having
        closed the cost obligation.
    - id: OBJ-6
      severity: minor
      statement: |-
        The named heuristic H-RCREP-1 (non-degeneracy at a label's leading
        coefficients) is stated as 'explicit and checkable' but is not given
        a random-model justification in the sense of
        docs/claims-and-verification.md's heuristic record template (a
        proven bound on the object's size paired with a classical
        distribution theorem): no argument is given for how LARGE the
        finite exceptional set can be as a function of B, nor for why a
        uniformly-random-integer-style model should transfer to the roots of
        an iterated resultant of structured, curve-arithmetic-derived
        polynomials rather than an arbitrary polynomial. This is filed as an
        adjacent objection, not an adjudication of the validator's assigned
        biconditional-proof joint.
    - id: OBJ-7
      severity: minor
      statement: |-
        The sole worked numeric instance is highly non-generic: independent
        re-derivation (shown in proves-too-much-control-results.yaml) finds
        P1 = -2*P2 exactly, and P1-P2 = P3+P4 = (10,0) exactly, both
        coincidences of the specific small-field point choice, not generic
        features of a random configuration. A single hand-workable B=1
        instance over F_11 is necessarily drawn from a very small pool of
        available points and cannot by itself establish how often
        H-RCREP-1's non-degeneracy condition holds at larger, generic B.

  required_controls:
    - |-
      Run a genuinely blind check: hand a fresh reader ONLY the primary
      source sentence (mechanism_note.md fact 4) and H-CREP-001.yaml's
      assumptions block, withholding DEC-20260830-69bbf7, the corpus's
      declared Theta(B^2) figure, and this draft's own conclusion, and see
      whether they independently reconstruct two-pairs or one-pair. The
      current draft's strongest self-defense ('an argument optimised to
      match the declared figure would have selected the one-pair reading,
      not this one') rules out simple figure-matching but cannot rule out
      the symmetric risk of a reader who already knows the prior round was
      criticized for matching, and reaches for the non-matching answer
      partly to avoid that appearance; only a reader blind to both figures
      and both prior rounds discriminates between these two possibilities.
    - |-
      Obtain and read TASK-20260830-06afa2/derivation-report.yaml's actual
      one-pair deck-naming scheme (outside this task's read_scope) before
      relying on point (1)'s 'less economical' comparison, to confirm the
      comparison is against the real alternative construction and not a
      simplified characterization of it.
    - |-
      Before treating RT103-C1 as discharged on the cost dimension (as
      opposed to the definitional dimension), require a construction-cost
      argument for r_R against H-CREP-001's own 1.25/2.25 exponent caps
      (OBJ-5), or an explicit statement that this draft addresses only the
      definitional half of RT103-C1 and leaves the construction-cost half
      open.
    - |-
      Search the pinned corpus (build_packages.py, generate_instances.py,
      other route notes -- outside this task's read_scope) for any other use
      of compound two-index subscript naming, to test point (1)'s 'standard
      notational convention' premise against actual corpus usage rather than
      general mathematical practice.

  counterexample_or_mutation: |-
    See proves-too-much-control-results.yaml for the three constructed
    adversarial objects (a non-extendible label, a vacuous deck-pairing null
    object, and the opposite one-pair reading), each checked by independent
    hand computation rather than by trusting the producer's arithmetic.

  baseline_comparison: |-
    Not directly applicable: this draft is a candidate mathematical
    definition, not an algorithm or complexity claim, and H-CREP-001 itself
    states it 'claims no new algorithm and no achieved complexity exponent'.
    The relevant baseline comparison is instead H-CREP-001's own declared
    exponent rectangle (preprocessing at most B^2.25, online at most B^1.25),
    defined relative to the Pollard-rho reference N^(1/2+o(1)) = B^(5/2+o(1))
    named in H-CREP-001's structural_ingredients. OBJ-5 shows that comparison
    is where the candidate definition's own numbers (a degree-Theta(B^2) or
    degree-Theta(B^4) r_R, explicitly named an ONLINE object) currently fail
    by a wide margin if materialized directly, under either reading.

  heuristic_challenges:
    - |-
      H-RCREP-1 (OBJ-6): named and checkable in the sense of being a finite
      root-membership test at a single label, but not accompanied by a
      rigorous-bound-plus-classical-distribution-theorem justification of how
      large its exceptional set can be as a function of B, nor by an
      argument for why a random-model transfer is appropriate for the roots
      of a curve-arithmetic-derived iterated resultant rather than an
      arbitrary polynomial of the same degree.

  cost_model_challenges:
    - |-
      OBJ-5: r_R is explicitly named an online, target-dependent object by
      this draft, with degree Theta(B^4) (chosen reading) or Theta(B^2)
      (rejected reading); either figure, if materialized as an explicit
      polynomial, requires far more workspace than H-CREP-001's own
      fresh-target online exponent cap of B^1.25, and the two-pairs figure
      also exceeds the B^2.25 preprocessing cap. No compact/implicit
      representation avoiding materialization is proposed or flagged as an
      open requirement by this draft.

  reduction_and_scope_challenges: []

  proof_architecture_challenges:
    - |-
      Quantifier-order note on main_theorem Part 2: the converse is proved
      'for the specific label a and t_a under consideration' conditional on
      H-RCREP-1 holding AT THAT LABEL, which is the correct quantifier order
      (the exceptional set may depend on the instance) and is not, on its
      face, a hidden universal-to-existential swap. This is recorded as a
      pass on the quantifier-order check specifically, distinct from OBJ-6's
      separate objection that the heuristic itself lacks a random-model
      justification.

  narrowest_supported_statement: |-
    Decision-record-among-alternatives.yaml's three headline reasons for
    preferring the two-pairs/Theta(B^4) reading are not shown to be driven by
    matching (or avoiding a match with) the corpus's pre-existing declared
    figure; two of the three (subscript arithmetic, pair-pair wording) are
    genuine, if individually modest-strength, textual arguments, and the
    third (robustness under re-derivation) is figure-independent but does not
    discriminate between the two readings at all, since it is equally
    derivable for the rejected reading. A separate, narrower citation
    (why_the_one_pair_reading_is_rejected's reliance on DEC-20260830-69bbf7's
    own un-rederived literalness assertion) carries a genuine, secondary
    circularity risk that this draft does not close. Independent of the
    circularity question, the candidate definition supplies a mathematical
    definition and degree bound for r_R but not a construction meeting
    H-CREP-001's own stated cost caps under either reading (OBJ-5), so
    RT103-C1's construction-cost content should not be read as discharged by
    this draft even where its purely definitional content is accepted.

  next_concrete_action: |-
    Before composing a discharge verdict for RT103-C1, the Coordinator should
    separate the definitional question (is r_R well-defined) from the
    construction-cost question (can it be built within the stated exponent
    caps), record OBJ-5 as a named, currently-open gap on the latter
    regardless of how the circularity and proves-too-much findings above
    resolve on the former, and commission the blind figure-withheld
    re-derivation named in required_controls before treating the two-pairs
    choice as more than a disclosed, textually-argued, not-yet-adjudicated
    preference among two coherent readings.

  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-RCREP-DEFINITION-REVIEW-20260830-495939/tasks/TASK-20260830-031380/proves-too-much-control-results.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-RCREP-DEFINITION-REVIEW-20260830-495939/tasks/TASK-20260830-031380/attestation.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-RCREP-DEFINITION-REVIEW-20260830-495939/tasks/TASK-20260830-031380/runtime-session-receipt.json

review_attestation:
  task_id: TASK-20260830-031380
  joints_owned:
    - 'Is the choice between the one-pair/Theta(B^2) and two-pairs/Theta(B^4) alternatives (or the parametric statement, if no choice was made) actually justified by something in H-CREP-001.yaml, EXP-CREP-001/specification.yaml, or the original TASK-20260722-101 source text -- or is it selected because it matches the pre-existing declared Theta(B^2) figure, repeating the exact bias this Coordinator flagged in DEC-20260830-69bbf7?'
  joints_owned_slugs:
    - circularity_of_the_two_pairs_vs_one_pair_choice
    - proves_too_much_control_against_three_named_adversarial_objects
  sources_read:
    - AGENTS.md
    - agents/red-team.md
    - docs/inventor-protocol.md
    - docs/claims-and-verification.md
    - templates/research-records.md
    - ledger/decisions/DEC-20260830-69bbf7.yaml
    - ledger/hypotheses/H-CREP-001.yaml
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-101/mechanism_note.md
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-RCREP-DEFINITION-DRAFT-20260830-351be7/tasks/TASK-20260830-351be7/rcrep-candidate-definition.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-RCREP-DEFINITION-DRAFT-20260830-351be7/tasks/TASK-20260830-351be7/decision-record-among-alternatives.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-RCREP-DEFINITION-REVIEW-20260830-495939/dispatch_queue.json
  read_sibling_reports: false
  blind_from_respected: null
  verdict: breaks
  verdict_note: |-
    breaks (partial), on the joints owned: the circularity attack finds one
    genuine, secondary circularity finding (OBJ-2, WOR-1's citation) and one
    non-discriminating headline reason (OBJ-1, point 3) that the producer's
    own 'three independent facts' framing does not disclose as such; the
    three-object proves-too-much control finds the construction correctly
    refuses on Objects 1 and 1b (non-extendible label; chart-excluded label)
    and correctly produces no spurious vanishing on Object 2 (vacuous
    pairing), but finds a genuine failure on Object 3 (point 3 of the
    justification equally supports the rejected one-pair reading). Full
    detail and shown computation in proves-too-much-control-results.yaml.
