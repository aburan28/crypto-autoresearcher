composite_verdict_for_coordinator: |-
  The candidate definition's CONSTRUCTION METHOD itself is well-behaved under
  adversarial stress in the two ways this control probes most directly for a
  false positive (Objects 1, 1b, 2): it does not spuriously vanish at a
  genuinely non-extendible label, it correctly excludes chart-inadmissible
  labels rather than silently misjudging them, and it does not manufacture a
  relation out of a vacuous pairing. These three passes support treating
  main_theorem's PART 1 (the unconditional forward direction) as sound in
  this worked instance, independently re-verified rather than merely
  accepted. Separately and independently of that, Object 3 finds that the
  DECISION to prefer the two-pairs reading over the one-pair reading rests on
  fewer independent legs than claimed: point (3) of the justification is
  confirmation-symmetric and does not discriminate at all. This does not
  mean the two-pairs reading is wrong -- points (1) and (2) may still be
  right -- but it means the record should not describe the choice as
  resting on three independent facts, and per redteam-report.yaml's OBJ-1/
  OBJ-2, the remaining two legs each carry their own unresolved strength
