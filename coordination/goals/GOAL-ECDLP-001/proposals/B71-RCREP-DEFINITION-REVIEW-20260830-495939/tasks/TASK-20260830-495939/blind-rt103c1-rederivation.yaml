decomposition_method: >-
  RT103-C1's requirement field is one sentence, not a pre-numbered list of
  ten items: 'Define g_I, r_R, z_R, all source occurrence maps, projective
  charts, saturations, multiplicities, and exceptional strata, then prove
  exact extendible-label support.' Read literally this names eight objects
  to define (g_I, r_R, z_R, source occurrence maps, projective charts,
  saturations, multiplicities, exceptional strata) plus one proof
  obligation. RT103-O1, the objection RT103-C1 operationalizes, states the
  proof obligation as an explicit biconditional -- 'r_R(t_a)=0 iff label a
  extends to a valid relation' -- which has two logically independent
  directions, each separately vulnerable to a different failure mode
  (forward: could be true by fiat if the definition of r_R secretly
  encodes the answer; backward: could fail on a positive-measure set of
  degenerate inputs even if the forward direction is fine). I therefore
  split the proof obligation into its two directions to reach exactly ten
  discrete, separately-checkable requirements. This is a stated
  decomposition choice, not a count copied from any producer artifact
  (none was read before writing this file); if the producer's own
  discharge map decomposes RT103-C1 differently, that is a divergence in
  method, not necessarily in substance, and is called out as such in
  validator-report.yaml rather than silently reconciled here.

ten_requirements:
  - req_id: R1
    text: 'Define g_I: the squarefree polynomial whose roots are the distinct public fifth-occurrence (deck I) labels.'
    verdict: discharged
    reasoning: >-
      deck_defining_polynomials defines g_I(T) := product over occurrences a
      in deck I of (T - t_a), degree exactly B, and states it is squarefree
      by construction because deck I's labels are required distinct
      (matching H-CREP-001's own mechanism field). This is a complete,
      self-contained, checkable definition with no free parameters left
      unspecified.

  - req_id: R2
    text: 'Define r_R: the complete-chart intersection resultant.'
    verdict: discharged
    reasoning: >-
      final_pair_pair_relation_and_r_R gives an exact, constructive,
      two-stage nested-resultant definition: R_1(x_12,T) :=
      Res_x34(g_34(x_34), S_3(x_12,x_34,T)), then r_R(T) :=
      Res_x12(g_12(x_12), R_1(x_12,T)), with g_12, g_34, S_3 all
      independently defined upstream (pair_deck_construction,
      joint_relation_S3). This is a fully explicit algebraic object, not an
      untyped macro -- it directly answers RT103-O1's naming of
      'complete-chart intersection resultant' as an untyped macro.

  - req_id: R3
    text: 'Define z_R: the target-label support factor.'
    verdict: discharged
    reasoning: >-
      z_R_definition gives z_R(T) := gcd(g_I(T), r_R(T)) in F_p[T], and
      correctly argues this gcd is automatically squarefree because g_I is
      squarefree (a true, elementary fact: any divisor of a squarefree
      polynomial in a UFD is itself squarefree). Complete and self-contained.

  - req_id: R4
    text: 'Define all source occurrence maps: how a label ties to underlying source/curve data.'
    verdict: discharged
    reasoning: >-
      occurrence_record_semantics defines each occurrence as a tuple
      (label, x, sign, colour, marker) with an explicit algebraic meaning
      for every field (x as an x-coordinate, sign disambiguating the
      two points sharing that x-coordinate via y -> -y, marker as one of
      six named strata), and deck_defining_polynomials/pair_deck_construction
      show exactly how these records are consumed to build g_k, g_12, g_34.
      The map from a public label to a specific curve point (up to sign) is
      explicit and checkable.

  - req_id: R5
    text: 'Define projective charts.'
    verdict: partially_discharged
    reasoning: >-
      strata_and_saturation's CHART paragraph names the affine Weierstrass
      chart plus the projective closure in P^2 with the point at infinity
      O=[0:1:0], plus a 'sign chart'. This is a real definition in prose,
      a genuine improvement over RT103-O1's 'untyped macro' complaint, but
      it stops short of writing an explicit homogeneous coordinate ring or
      an explicit homogenized form of the resultant construction. No
      homogeneous Weierstrass equation or explicit chart-transition map is
      written down anywhere in the draft. The concept is named and roughly
      specified; the machinery is not fully built.

  - req_id: R6
    text: 'Define saturations.'
    verdict: partially_discharged
    reasoning: >-
      The VERTICAL-marker paragraph names a 'SATURATION CONVENTION':
      working in the homogenised (projective) resultant at any vertical
      pair, so the point-at-infinity root is tracked rather than silently
      lost through degree drop. This is a real, stated convention, but the
      draft's own text says it 'does NOT exhaustively verify it
      symbolically for every possible vertical configuration' -- no
      explicit saturation ideal or homogeneous polynomial computation is
      actually carried out anywhere in the draft (including the worked
      example, which contains no vertical-marker case at all). A
      convention is named; it is not demonstrated to work.

  - req_id: R7
    text: 'Define multiplicities.'
    verdict: discharged
    reasoning: >-
      The REPEATED-marker paragraph correctly uses the true, standard fact
      Res(f1*f2,h) = Res(f1,h)*Res(f2,h) to show a label repeated m times
      in one deck multiplies through the construction. The
      NONREDUCED paragraph then explicitly narrows the claim actually made:
      the exact-support claim (main_theorem) is a SET claim about z_R's
      roots, and z_R is squarefree regardless of r_R's own multiplicity
      structure (by the same squarefree-gcd argument as R3), so
      multiplicities never have to be pinned down exactly for the
      biconditional itself to hold. This narrowing is mathematically valid
      (independently checked: gcd with a squarefree polynomial cannot
      reintroduce a repeated root) and is an honest, explicit scope
      statement rather than an evasion, so the requirement is discharged
      for the claim actually made.

  - req_id: R8
    text: 'Define exceptional strata.'
    verdict: partially_discharged
    reasoning: >-
      All six markers named in the frozen toy engine (NORMAL, VERTICAL,
      IDENTITY, INFINITY, TANGENT, REPEATED, plus the umbrella NONREDUCED)
      are given a stated real-mathematical-mechanism meaning in
      strata_and_saturation -- a genuine response to RT103-O1's complaint
      that these were previously untyped. But defining a mechanism is not
      the same as verifying it, and the draft itself discloses
      (named_residual_gaps items 3-4) that the IDENTITY/INFINITY
      degenerate-specialization rule (S_3 -> S_2) and the VERTICAL
      saturation convention are stated but not checked on any worked case.
      Independently confirmed below (support_biconditional_check): the
      worked example's one degenerate case is NOT the literal TANGENT
      marker as strata_and_saturation itself defines it (P_i = P_j exactly);
      it is a distinct, if related, 2-torsion self-negation degeneracy that
      the draft itself only ever calls 'TANGENT-type' (hedged), never
      unqualified TANGENT. So of six named strata, only NORMAL and one
      non-TANGENT degenerate case receive any numeric check at all; four
      (VERTICAL, IDENTITY, INFINITY, and literal TANGENT) are named but
      wholly unverified.

  - req_id: R9
    text: 'Prove the forward direction of extendible-label support: label a extendible implies r_R(t_a) = 0.'
    verdict: discharged
    reasoning: >-
      main_theorem PART 1 gives an unconditional argument: if a is
      extendible, x_12 is by construction a common root of g_12 and
      S_3(.,x_34,t_a), and x_34 is a common root of g_34 and
      S_3(x_12,.,t_a); a Sylvester resultant vanishes whenever the two
      polynomials it is built from share a root, unconditionally (no
      genericity needed), and applying this twice gives r_R(t_a)=0. This
      is a true, standard, elementary fact about resultants and the
      argument correctly applies it twice in the right order. Independently
      re-verified end to end on the worked example in this file's
      support_biconditional_check section below, via two separate
      computational routes that agree with each other and with the draft.

  - req_id: R10
    text: 'Prove the converse direction of extendible-label support: r_R(t_a) = 0 implies label a is extendible.'
    verdict: partially_discharged
    reasoning: >-
      main_theorem PART 2 gives a real argument, not a restatement: it
      correctly identifies the actual failure mode of the naive converse
      (a resultant can vanish at a point either because the specialized
      polynomials share a root, or because a leading coefficient in the
      eliminated variable vanishes there, collapsing the Sylvester matrix)
      and reduces correctness to an explicit, finite, checkable condition
      per instance (named heuristic H-RCREP-1: no such leading coefficient
      vanishes at t_a). This is mathematically the right structure and the
      cited resultant-specialization fact is standard and correct
      (independently confirmed against my own knowledge of resultant
      theory, and directly exemplified in the worked-example recomputation
      below). But RT103-C1's requirement is to 'prove exact
      extendible-label support' without a stated allowance for
      conditionality, and what is actually delivered is (a) a PROOF SKETCH,
      by the producer's own label, not a fully worked proof, and (b) an
      argument that only becomes unconditional after H-RCREP-1 is granted,
      and H-RCREP-1 is neither proved nor given a full heuristic record
      (formal_statement / random_model_justification /
      falsification_condition per docs/claims-and-verification.md's
      heuristic-record schema) -- it is a one-paragraph named hypothesis
      inline in this draft. A conditional, sketch-level argument for the
      harder direction is genuine partial progress and not a restatement,
      but it does not meet a flat 'prove' requirement unconditionally.

support_biconditional_check: |-
  Independent recomputation of the worked example (E: y^2 = x^3 - x over
  F_11), performed by hand from the candidate definition's own stated
  formulas alone, without accepting any of the producer's intermediate
  numbers on trust. Every step below was computed independently and only
  then compared to the draft's stated results.

  POINT TABLE. RHS(x) = x^3 - x mod 11 for x=0..10: RHS(0)=0, RHS(1)=0,
  RHS(4)=60 mod 11=5, RHS(6)=210 mod 11=1, RHS(8)=504 mod 11=9,
  RHS(9)=720 mod 11=5, RHS(10)=990 mod 11=0. Squares mod 11:
  1,4,9,5,3,3,5,9,4,1 for 1..10. So sqrt(5)={4,7}, sqrt(1)={1,10},
  sqrt(9)={3,8}. This reproduces exactly the eleven affine points the
  draft lists, independently confirmed, and #E(F_11)=1+3+8=12=11+1,
  consistent with the p=3 mod 4 supersingular fact (non-load-bearing
  sanity check only).

  STEP 1, P1+P2 = (4,4)+(6,1): lambda=(1-4)/(6-4)=(-3)*2^-1 mod 11.
  2^-1=6 (2*6=12=1). lambda=(-3)*6=-18 mod 11=4. x3=4^2-4-6=6.
  y3=4*(4-6)-4=-12 mod 11=10. Result (6,10). Independently matches the
  draft's Step 1 exactly (x_12=6).

  STEP 2, P3+P4 = (0,0)+(1,0): lambda=(0-0)/(1-0)=0. x3=0-0-1=-1 mod
  11=10. y3=0. Result (10,0). Independently matches the draft's Step 2
  exactly (x_34=10).

  STEP 3, (6,10)+(10,0): lambda=(0-10)/(10-6)=1*4^-1. 4^-1=3 (4*3=12=1).
  lambda=3. x3=9-6-10=-7 mod 11=4. y3=3*(6-4)-10=6-10=-4 mod 11=7.
  Result (4,7); negating gives (4,4), so P1+P2+P3+P4+(4,4)=O exactly, with
  T=4 the tested candidate label. Independently matches the draft's Step 3
  exactly.

  S_3 FORMULA CHECK. With a=-1,b=0, S_3(x1,x2,x3) reduces to
  (x1-x2)^2*x3^2 - 2*(x1+x2)*(x1*x2-1)*x3 + (x1*x2+1)^2, exactly as
  stated. Independently confirmed this is a symmetric function of its
  three arguments (a required property of a genuine summation polynomial,
  not verified by the draft itself): computed S_3(4,6,6) and S_3(6,6,4)
  by direct substitution and got 0 in both cases, consistent with
  symmetry (if the draft's formula were not genuinely the symmetric
  Semaev S_3, using it asymmetrically across pairing stages as this draft
  does would be unsound; the symmetry check, which the draft omits, is a
  real independent addition to its verification).

  g_12 AND g_34 CHECK. S_3(4,6,x_12) = 4*x_12^2+2*x_12+9 (mod 11),
  independently expanded from the formula (matches draft). Verified
  g_12(6)=4*36+2*6+9 mod 11 = 1+1+9 = 11 = 0 independently (draft's
  arithmetic path differed slightly in presentation but reached the same
  0). Independently found the SECOND root of g_12 by factoring
  4x_12^2+2x_12+9 = 4*(x_12-6)*(x_12-10) mod 11 (checked by direct
  expansion: 4*(x_12-6)(x_12-10)=4x_12^2-64x_12+240 mod 11 = 4x_12^2+2x_12+9,
  matches), giving x_12=10 as the second root, corresponding
  geometrically to P1-P2=(10,0) (independently computed via the chord
  law: lambda=(-1-4)/(6-4)=6*6=3 mod 11 -- recomputed directly, giving
  x3=9-4-6=-1=10, y3=3*(4-10)-4=-22 mod 11=0). THE DRAFT NEVER MENTIONS OR
  CHECKS THIS SECOND ROOT (x_12=10) AT ALL -- see gaps_found below.

  S_3(0,1,x_34) = x_34^2+2*x_34+1 = (x_34+1)^2 (mod 11), independently
  reproduced from the formula. This is a perfect square, giving a double
  root at x_34=10, independently confirmed. THE MECHANISM BEHIND THIS
  DOUBLE ROOT WAS CHECKED INDEPENDENTLY: P3=(0,0) and P4=(1,0) are both
  2-torsion (order exactly 2, since y=0), so -P4=P4, hence P3+P4 and
  P3-P4 denote the SAME point, and the two sign-branches of the summation
  polynomial (which generically give two distinct x_34 roots) collapse to
  one double root. This is NOT the literal TANGENT marker as
  strata_and_saturation itself defines it ('the two points being combined
  ... are EQUAL, P_i=P_j ... the doubling case'): here P3=(0,0) and
  P4=(1,0) are two DIFFERENT points, neither equal to the other, so no
  doubling/tangent-line step of the group law is ever invoked in this
  computation. The double root arises from a distinct mechanism (one
  addend being self-inverse), not from adding a point to itself. The
  draft's own wording ('TANGENT-type degeneracy', 'a structurally
  analogous degeneracy') hedges this correctly and does not claim to have
  exercised the literal TANGENT marker; the finding here is that the
  worked example therefore verifies NEITHER a true tangent-doubling case
  NOR (independently) any VERTICAL, IDENTITY, or INFINITY case -- of six
  named strata, only NORMAL and this one distinct 2-torsion degeneracy
  receive a numeric check.

  R_1(x_12=6, T) CHECK, DONE FROM SCRATCH. Wrote S_3(6,v,T) as a
  polynomial in v with coefficients in T by direct substitution into the
  a=-1,b=0 formula: A(T)=T^2+10T+3, B(T)=10T^2+7T+1, C(T)=3T^2+T+1 where
  S_3(6,v,T)=A*v^2+B*v+C (independently expanded, not copied from the
  draft). Since g_34(v)=(v+1)^2 has a double root at v=-1, used the
  standard fact Res_v((v-r)^2*lc, q(v)) = lc^2 * q(r)^2 for a degree-2
  q(v)=A*v^2+B*v+C: R_1(6,T) = q(-1)^2 = (A-B+C)^2. Computed
  A-B+C = (T^2+10T+3)-(10T^2+7T+1)+(3T^2+T+1) = 5T^2+4T+3 (mod 11), so
  R_1(6,T) = (5T^2+4T+3)^2. Cross-checked this same value by directly
  building and expanding the 4x4 Sylvester determinant of g_34 and
  S_3(6,v,T) as polynomials in v; both methods gave the identical
  polynomial (A-B+C)^2, confirming the computation via two independent
  algebraic routes before any comparison to the draft. Expanding
  (5T^2+4T+3)^2 mod 11 gives 3T^4+7T^3+2T^2+2T+9 -- THIS MATCHES THE
  DRAFT'S STATED R_1(6,T) EXACTLY, independently confirmed, not merely
  copied.

  FACTORIZATION CHECK. Independently verified 5T^2+4T+3 = 5*(T-4)^2 mod
  11 by direct expansion (5*(T^2-8T+16) = 5T^2-40T+80, mod 11:
  -40 mod 11=4, 80 mod 11=3, giving 5T^2+4T+3, exact match), so
  R_1(6,T) = 25*(T-4)^4 = 3*(T-4)^4 mod 11 (25 mod 11=3), confirming T=4
  is the UNIQUE root of R_1(6,.) in F_11, with multiplicity 4 --
  independently reproduces the draft's claim exactly via a from-scratch
  derivation, not a re-check of the draft's own arithmetic steps.

  gaps_found:
    - >-
      The draft verifies PART 2 (converse) only on the x_12=6 fiber. It
      never computes or discusses R_1(10,T) (the x_12=10 fiber,
      corresponding to P1-P2 rather than P1+P2), which independently
      exists and is needed for a full account of r_R(T) = (up to a
      constant) Res_x12(g_12,R_1) ~ R_1(6,T)*R_1(10,T), since g_12 has
      TWO roots, 6 and 10, not one. This is consistent with the draft's
      own disclosed limitation ('does NOT claim to have computed the full
      degree-8 polynomial r_R(T) ... for all its roots') but is worth
      stating precisely: the check covers one of (at least) two branches
      that jointly determine r_R.
    - >-
      The worked example's degenerate case is a 2-torsion self-negation
      collapse, not the literal TANGENT marker (P_i=P_j) defined in
      strata_and_saturation. No VERTICAL, IDENTITY, INFINITY, or literal
      TANGENT case is exercised numerically anywhere in the draft.

  independent_conclusion: >-
    Every number the draft reports for this worked example was
    independently reproduced from the stated definitions alone, via
    computational routes that in the R_1(6,T) case differed from the
    draft's own presentation (symbolic A/B/C expansion plus the
    q(-1)^2 double-root resultant identity, cross-checked against a
    direct 4x4 Sylvester determinant, rather than the draft's synthetic-
    division-by-hand narrative) and still agreed exactly. This is real,
    independent corroboration of PART 1 (unconditional) and of PART 2 on
    the one fiber checked, not a restatement of the producer's own
    arithmetic. It does not extend to the two named gaps above.

overall_blind_verdict: >-
  Of RT103-C1's ten requirements as decomposed above: six fully discharged
  (g_I, r_R, z_R, source occurrence maps, multiplicities, forward-direction
  proof), four partially discharged (projective charts, saturations,
  exceptional strata, converse-direction proof) -- in every partial case
  because the draft itself names the gap rather than concealing it, and the
  gap is either (a) a stated but symbolically unverified convention, or (b)
  an explicitly conditional argument rather than an unconditional proof.
  None of the ten is assessed as fully 'open' (i.e. simply absent or an
  untyped macro): RT103-O1's specific complaint that 'complete-chart
  intersection resultant' is an untyped macro is answered for every named
  object, even where the mechanism attached to that object is not fully
  verified.
