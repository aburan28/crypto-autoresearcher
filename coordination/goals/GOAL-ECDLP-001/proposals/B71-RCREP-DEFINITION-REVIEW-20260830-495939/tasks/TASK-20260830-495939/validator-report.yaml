      present: true
      path: coordination/goals/GOAL-ECDLP-001/proposals/B71-RCREP-DEFINITION-DRAFT-20260830-351be7/tasks/TASK-20260830-351be7/rt103-c1-discharge-map.yaml
      note: read only after blind-rt103c1-rederivation.yaml was written and committed to this task's write_scope, per the mandatory ordering constraint.
    - artifact: decision-record-among-alternatives.yaml
      present: true
      path: coordination/goals/GOAL-ECDLP-001/proposals/B71-RCREP-DEFINITION-DRAFT-20260830-351be7/tasks/TASK-20260830-351be7/decision-record-among-alternatives.yaml
      note: >-
