validation_report:
  id: VAL-20260830-495939
  task_id: TASK-20260830-495939
  role: validator
  joint_owned: >-
    Whether rcrep-candidate-definition.yaml genuinely PROVES the support
    biconditional (r_R vanishes at a label iff it extends to a labelled
    pair-pair relation), or merely restates it; and an independent, blind
    re-derivation of RT103-C1's discharge status from RT103-C1's own text and
