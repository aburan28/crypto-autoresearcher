      - coordination/goals/GOAL-ECDLP-001/proposals/B71-RCREP-DEFINITION-DRAFT-20260830-351be7/tasks/TASK-20260830-351be7/decision-record-among-alternatives.yaml
    explicitly_not_read:
      - coordination/goals/GOAL-ECDLP-001/proposals/B71-RCREP-DEFINITION-REVIEW-20260830-495939/tasks/TASK-20260830-031380/ (red-team's task directory; did not exist to read at the time of this review's own work in any case, and was never sought out)
