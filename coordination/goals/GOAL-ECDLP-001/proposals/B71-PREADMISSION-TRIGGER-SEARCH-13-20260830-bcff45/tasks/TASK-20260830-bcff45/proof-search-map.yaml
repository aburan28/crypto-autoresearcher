failure_localization:
  - symptom: candidate classifies a different named polynomial family and supplies no construction for this specific problem
    localizes_to: L1_NAMED_TRIGGER_OBJECT
    interpretation: not a trigger; G1 fails (C1 this round)
  - symptom: candidate only verifies a claimed value supplied by an external, already-informed prover
    localizes_to: L1_NAMED_TRIGGER_OBJECT
    interpretation: verification protocol, not a public constructor; G1 fails explicitly, not conflated with a constructor (C5 this round)
  - symptom: circuit construction requires the full Theta(B^3) coefficient vector of r_R as an input wire count
    localizes_to: L2_FROZEN_SETTING_TYPING
    interpretation: matches an already-costed materialization; G2 partial, G3 fails (C2, C3 this round)
  - symptom: protocol requires an external claimed value as an input
    localizes_to: L2_FROZEN_SETTING_TYPING
    interpretation: excluded witness dependency; G2 fails (C5 this round)
  - symptom: transformation presupposes an already-existing small circuit whose existence is unestablished
    localizes_to: L2_FROZEN_SETTING_TYPING
    interpretation: G2 partial; the presupposed object is not itself constructed (C4 this round)
  - symptom: candidate changes circuit depth but not size
    localizes_to: L3_FULL_COST_ENUMERATION
    interpretation: size, not depth, is the frozen gate's binding cost axis; G3 fails (C4 this round)
  - symptom: prover-side cost to produce the claimed value is at least the cost of an already-costed route
    localizes_to: L3_FULL_COST_ENUMERATION
    interpretation: no constructive-side saving; G3 fails (C5 this round, corroborated by KN-LIT-4716's O(C) prover time)
  - symptom: coalesced or nonreduced fibre loses label or multiplicity
    localizes_to: L4_LINEAGE_MULTIPLICITY_FIBRES
    interpretation: G4 fails
  - symptom: output invariant under Q to -Q
    localizes_to: L5_Q_VS_MINUS_Q
    interpretation: sign channel absent; G5 fails
  - symptom: Q coefficient unknown or non-invertible
    localizes_to: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    interpretation: G6 fails
  - symptom: unranking needs full source or support enumeration
    localizes_to: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    interpretation: G7 fails
  - symptom: candidate's operation IS an already-costed route restated in different vocabulary
    localizes_to: L8_NOT_ALREADY_COSTED_ROUTE
