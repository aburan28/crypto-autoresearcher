target_statement:
  informal: >-
    An actual recurrence, circuit identity, or retrieved theorem from
    algebraic complexity theory or interactive-proof methods -- Valiant's
    VP/VNP completeness framework, Buergisser-Clausen-Shokrollahi-style
    explicit algebraic circuit bound techniques (Berkowitz's NC^2
    determinant algorithm and the 2025 constant-depth polynomial-size
    polynomial-GCD circuit), the Valiant-Skyum-Berkowitz-Rackoff
    depth-reduction theorem, or sumcheck/GKR-style interactive-proof
    argument systems -- instantiates to the frozen elliptic setting as a
    typed public P1553 target-local remainder transducer for r_R mod g_I
    or the exact dyadic subinterval unit-product interface, and passes
    every item of the frozen pre-admission gate (G1-G8).
  quantifiers: >-
    There exists one named public object T (a recurrence, circuit identity,
    or theorem) and one fully specified public construction rule C such
    that, for the frozen P1553 setting (rings, bases, CRT components,
    interval geometry, public g_I and r_R construction fixed before any
    witness is observed), C computes r_R mod g_I (or the dyadic unit-
    product step) from E, P, Q alone, without roots, factors, witnesses,
    support tables, or source enumeration; the full state/update-map/
    degree/rank/nonzero/coefficient-growth/live-storage/traffic/build-
    query/amortization enumeration lies within the inherited B^(5/4)
    interface budget and strict end-to-end o(ell^(1/2)) time, memory, and
    data; lineage and multiplicity are preserved on coalesced and
    nonreduced fibres; Q is distinguished from -Q; known P and Q
    coefficients are yielded with invertible Q coefficient; output-
    sensitive source unranking is supported; and T is shown not to be an
    already-costed norm, resultant, quotient, full power-projection,
    represented-table, or witness-conditioned route. For a proposed
    interactive-proof/verification-protocol candidate, an additional
    quantifier constraint binds: the party supplying the claimed value to
    the protocol must itself be the public party (E, P, Q alone), not an
    external, already-informed prover -- otherwise the candidate is not
    typed to this quantifier order at all and is G1/G2-absent by
    definition, not merely cost-deficient.
  present_support: none

lemma_decomposition:
  - id: L1_NAMED_TRIGGER_OBJECT
    responsibility: >-
      Name the actual recurrence, circuit identity, or retrieved theorem T,
      with its exact statement and source, and verify it is not merely the
      assertion that a specialized circuit may exist, and, for an
      interactive-proof candidate, verify T is a public constructor and not
      merely a verifier of an externally supplied claim.
    status: open
    falsifier: >-
      T is only an existence assertion, a heuristic, a classification
      result about a different named polynomial family, or a protocol that
      verifies a claim supplied by an external, already-informed prover.
  - id: L2_FROZEN_SETTING_TYPING
    responsibility: >-
      Type T into the frozen P1553 setting: rings, bases, CRT components,
      interval geometry, public g_I and r_R construction, and an exact
      computation from E, P, Q without roots, factors, witnesses, support
      tables, or source enumeration. For a circuit-complexity T, this
      includes identifying exactly what data must be supplied as a circuit
      INPUT (coefficients of g_I only, or also the full coefficient vector
      of r_R) before any circuit-complexity or depth argument can even
      begin. For an interactive-proof T, this includes identifying who
      plays the prover role and whether that party's claimed value is
      itself reachable from E, P, Q alone.
    status: open
    falsifier: >-
      Any of the frozen objects is left implicit; the circuit construction
      requires the full Theta(B^3) coefficient vector of r_R as an input
      wire count; or the protocol's prover role requires an externally
      supplied, already-computed claimed value not reachable from E, P, Q
      alone.
  - id: L3_FULL_COST_ENUMERATION
    responsibility: >-
      Enumerate state, update maps, degrees, ranks, nonzeros, coefficient
      growth, live storage, traffic, build/query split, and amortization,
      and bound every axis within the B^(5/4) interface budget and strict
      end-to-end o(ell^(1/2)) time, memory, and data.
    status: open
    falsifier: >-
      Any charged axis is unbounded, at or above ell^(1/2), the circuit's
      input-wire count or internal size is poly(Theta(B^3)) (matching
      ROUTE-01/07/08's own materialization cost), or a depth-reduction
      transformation is applied to that same size-Theta(B^3) circuit
      (changing depth only, not size).
    id_note: L3 also carries the prover-cost obligation for interactive-proof candidates, i.e. that the prover's own cost to produce a claimed value is itself bounded within the cap, not merely the verifier's cost.
  - id: L4_LINEAGE_MULTIPLICITY_FIBRES
    responsibility: Preserve lineage and multiplicity on coalesced and nonreduced fibres.
    status: open
    falsifier: A coalesced or nonreduced fibre loses its occurrence label or multiplicity under T.
  - id: L5_Q_VS_MINUS_Q
    responsibility: Distinguish Q from -Q in the transducer output.
    status: open
    falsifier: The output is invariant under Q mapped to -Q with no separately proved orientation channel.
  - id: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    responsibility: Yield known P and Q coefficients with invertible Q coefficient.
    status: open
    falsifier: The Q coefficient is not known a priori or is not invertible on the declared strata.
  - id: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    responsibility: Support output-sensitive source unranking.
    status: open
    falsifier: Unranking requires enumerating the full source or a support table.
  - id: L8_NOT_ALREADY_COSTED_ROUTE
    responsibility: >-
      Show T is not an already-costed norm, resultant, quotient, full
      power-projection, represented-table, or witness-conditioned route;
      specifically, show the candidate is not ROUTE-01 (component
      resultants) restated as a Sylvester-matrix determinant circuit,
      ROUTE-08 (displacement representation) restated as a materialization
      input requirement, or the explicit "witness-conditioned route" the
      gate text itself names.
    status: open
    falsifier: >-
      T's construction requires the same Theta(B^3) materialization as
      ROUTE-01/ROUTE-08, T is a depth-only transform of that same circuit,
      or T is by definition conditioned on an externally supplied witness
      (an interactive-proof prover's claimed value).

dependency_order:
  - [L1_NAMED_TRIGGER_OBJECT, L2_FROZEN_SETTING_TYPING]
  - [L2_FROZEN_SETTING_TYPING, L3_FULL_COST_ENUMERATION]
  - [L2_FROZEN_SETTING_TYPING, L4_LINEAGE_MULTIPLICITY_FIBRES]
  - [L2_FROZEN_SETTING_TYPING, L5_Q_VS_MINUS_Q]
  - [L2_FROZEN_SETTING_TYPING, L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q]
  - [L2_FROZEN_SETTING_TYPING, L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING]
  - [L1_NAMED_TRIGGER_OBJECT, L8_NOT_ALREADY_COSTED_ROUTE]
  - [L3_FULL_COST_ENUMERATION, L8_NOT_ALREADY_COSTED_ROUTE]

cheap_audits:
  exact_baseline_reproduction:
    applies: true
    baseline: >-
      The frozen gate items G1-G8 read from the live next_action, the
      g_I/r_R/z_R definitions from H-CREP-001, and the eight frozen
      already-costed routes with their exact descriptions and backend
      citations from EXP-CREP-001/specification.yaml (ROUTE-01-component-
      resultants; ROUTE-02-quotient-ring-resultants, described exactly as
      resultant construction in the quotient-ring direction, r_R mod g_I;
      ROUTE-03-split-norms; ROUTE-04-multipoint-evaluation; ROUTE-05-
      modular-composition, Brent-Kung / Kedlaya-Umans lineage;
      ROUTE-06-power-projection; ROUTE-07-subresultant-hgcd;
      ROUTE-08-displacement-representation with its dependency-graph node
      n2 (materialize_resultant_coefficients) declaring cost_exponent_in_B
      3).
    attack_plan:
      - restate each gate item G1-G8 verbatim from the live next_action
      - restate g_I, r_R, z_R, the eight frozen routes and ROUTE-08's exact exponent certificate from H-CREP-001 and EXP-CREP-001/specification.yaml
      - for each of C1-C5, identify the exact data required as a circuit input, or the exact prover/verifier role split, and mark each gate item present/absent with a named reason
      - confirm no candidate is admitted by assertion of a possibly existing specialized circuit, and confirm no verification-only protocol is conflated with a public constructor
    expected_break: >-
      A candidate that carries G1 (an actual named theorem) but whose
      circuit construction requires the full Theta(B^3) coefficient vector
      of r_R as an input wire count (matching ROUTE-01/ROUTE-08's own
      materialization node), or a candidate that is by construction a
      verification protocol requiring an externally informed prover
      (failing G1/G2 outright, not merely G3).
    pass_condition: >-
      Every gate item is explicitly present for a candidate, with the exact
      construction and full cost enumeration; otherwise the candidate is
      recorded not intake-ready with its absent items named.
    current_result: >-
      Performed statically, reproducing mechanism-card.yaml's own C1-C5
      verdicts. C1 (VP/VNP completeness framework) supplies no construction
      for this specific problem at all (G1 absent; every retrieved instance
      classifies a different named polynomial family). C2 (Berkowitz's NC^2
      determinant algorithm applied to the g_I/r_R Sylvester matrix) carries
      G1 but is dominated by a Theta(B^3)-dimensional matrix (G3, G8
      absent; this IS ROUTE-01 restated as an explicit NC^2 result). C3
      (the 2025 constant-depth polynomial-size GCD circuit, instantiated to
      z_R = gcd(g_I, r_R)) carries G1 as a genuinely new, non-withdrawn
      retrieved theorem, but its input-wire count alone is Theta(B^3)
      independent of its constant depth (G3, G8 absent; matches
      ROUTE-01/ROUTE-08's materialization requirement), and it computes
      gcd(g_I, r_R) rather than the remainder r_R mod g_I this round's
      primary trigger shape targets. C4 (Valiant-Skyum-Berkowitz-Rackoff
      depth reduction and its modern limits) carries G1 via independently
      retrieved mechanism/limits literature but presupposes an
      unestablished sub-Theta(B^3)-size circuit and changes depth, not size
      (G3, G8 absent; this is ROUTE-01/07/08 with an added parallel-depth
      property). C5 (sumcheck/GKR doubly-efficient interactive-proof
      lineage) is EXPLICITLY G1-absent per the dispatch's mandated
      distinction: it verifies a claimed value supplied by an external,
      already-informed prover rather than constructing one from E, P, Q
      alone, and independently fails G2 and G8 (the witness-conditioned
      route the gate text itself excludes). No candidate is intake-ready.
      No experiment was run.
  observation_collision_search:
    applies: true
    collision_object: >-
      A retrieved or internal object that is the same observable as a
      trigger already screened in one of the six terminal pre-admission
      packets, or in the seventh- through twelfth-round candidate sets, or
      an internal idea-generation-corpus candidate that already proposed
      the identical mechanism for a different setting.
    attack_plan:
      - compare each candidate against the six screened families and their scoped negative boundaries
      - compare each candidate against the seventh- through twelfth-round candidate sets and record which, if any, is a re-derivation
      - grep inputs/ and knowledge/ for the exact mechanism names (Valiant-Skyum, VSBR, VP/VNP, VNP-complete, Berkowitz-Rackoff, GKR protocol, sum-check protocol, sumcheck protocol, Buergisser-Clausen-Shokrollahi) and read any on-topic hit in full
      - confirm this round does not reopen round ten's closed mixed-radix/CRT sub-avenue, round eleven's ROUTE-04 collapse, or round twelve's four route collapses (ROUTE-01/02/05/08)
      - record which candidate, if any, falls inside a screened family, duplicates a prior-round candidate, or duplicates an internal prior candidate
    expected_break: >-
      A candidate that re-runs a screened family, re-derives a prior-round
      candidate, reopens a closed sub-avenue, or re-surfaces a paper already
      screened under a different query.
    pass_condition: >-
      No candidate re-runs a frozen screen, re-derives a prior-round
      candidate, reopens a prior closure, or silently restates an internal
      prior candidate without crediting its disclosed obstruction.
    current_result: >-
      Performed statically. This round does not re-derive the seventh-
      through twelfth-round candidate sets and does not reopen round ten's,
      eleven's, or twelve's closures; the algebraic-complexity-theory and
      interactive-proof literature is a genuinely distinct area from all six
      screened families and from rounds seven through twelve's searched
      areas. One re-encounter was found and disclosed, not re-screened:
      arXiv:2511.05035 (modular composition and polynomial GCD in the
      border of small shallow circuits, Andrews-Kumar-Rai) surfaced again
      under this round's "algebraic circuit" AND "gcd" query; it is the
      SAME withdrawn paper round seven's near-miss and round eight's
      full-text reading already assessed (withdrawn by its author, v2,
      2026-01-27, referee-noted proof gap in Theorems 6.2 and 6.4), and its
      round seven/eight verdict stands unchanged, distinguished explicitly
      from the non-withdrawn arXiv:2506.23220 (C3) which shares two
      overlapping authors (Kumar, Rai) but is a distinct, differently-scoped
      paper. The internal-corpus grep surfaced three genuine on-topic
      sumcheck/GKR hits (KN-LIT-929, KN-LIT-6720, KN-LIT-4716) and one
      title-only off-target hit (KN-LIT-1754), all tagged for an unrelated
      pairing/endomorphism-speedup curve-safety area of this program, none
      typed to the P1553 g_I/r_R object; and one on-topic inputs/ hit
      (idea_generation_20260718.md, citing Buergisser-Clausen-Shokrollahi's
      Algebraic Complexity Theory as nearest literature for an unrelated
      border-rank question about the Semaev summation tensor T_{S_m}, a
      different hypothesis line from this task's P1553 g_I/r_R object). No
      candidate this round is a re-run of any screened family, prior-round
      candidate set, or internal prior candidate targeting this specific
      P1553 construction.
  quantifier_order_statement:
    applies: true
    required_order:
      - freeze the P1553 rings, bases, CRT components, and interval geometry
      - fix the public g_I and r_R construction
      - name the trigger object T (recurrence, circuit identity, or theorem)
      - receive public E, P, Q
      - construct T's circuit or protocol object from E, P, Q alone
      - compute r_R mod g_I (or the dyadic unit-product step) from it
      - enumerate the full cost and verify the B^(5/4)/o(ell^(1/2)) bounds
      - verify lineage/multiplicity, Q vs -Q, invertible Q coefficient, and source unranking
    forbidden_order: >-
      Assume a small circuit for r_R mod g_I already exists and then invoke
      a classification theorem (C1) or a depth-reduction theorem (C4) on
      it; materialize the full Theta(B^3) coefficient vector of r_R first
      and then apply a determinant circuit (C2) or a GCD circuit (C3) to
      it; or require an external prover who already knows the answer before
      an interactive-proof protocol begins (C5).
    expected_break: >-
      A candidate whose construction presupposes exactly the object the
      frozen setting has not yet publicly constructed, moving witness-
      equivalent or materialization-equivalent work before any circuit or
      protocol step.
    pass_condition: >-
      All frozen objects are fixed before any witness or presupposed
      circuit is observed, and T's construction is built from public data
      (E, P, Q) alone.
    current_result: >-
      Statement only, checked per candidate. Every candidate this round
      violates the required order in exactly one of the three forbidden
      ways named above: C1 supplies no construction to check the order
      against at all; C2 and C3 both require the Theta(B^3) coefficient
      vector of r_R to be materialized before their circuit-complexity
      argument can even begin; C4 presupposes an unestablished small
      circuit before depth-reducing it; C5 requires an external,
      already-informed prover before the protocol begins, per nine
      independently retrieved sources and the internal Libra record
      (KN-LIT-4716, prover time O(C)).
  method_ceiling_nearby_object_control:
    applies: true
    nearby_object: >-
      A generic pair of univariate polynomials (g, r) over the same field,
      of the same degree profile as g_I (degree Theta(B), squarefree) and
      r_R (degree Theta(B^3)), with no elliptic-curve provenance, group
      law, Weierstrass structure, or complete-chart intersection origin at
      all.
    attack_plan:
      - apply the identical candidate construction (VP/VNP classification test, Berkowitz NC^2 determinant circuit, constant-depth GCD circuit, VSBR depth reduction, sumcheck/GKR protocol) to the planted generic (g, r) pair
      - prohibit use of any elliptic-curve-specific fact absent from the claimed lemmas
      - identify the first lemma that would need to distinguish the genuine P1553 (g_I, r_R) pair from the generic control
      - reject the argument if it still returns a purported P1553 remainder/witness certificate on the planted generic instance at the same claimed cost
    expected_break: >-
      Every candidate this round is a general statement about arithmetic
      circuits, algebraic complexity classes, or interactive-proof systems
      applicable to ANY named polynomial or ANY arithmetic circuit of the
      given size and degree, with no P1553-structure lemma; each would
      apply identically, and at the identical cost, to the planted generic
      non-elliptic (g, r) pair, confirming that none of C1-C5 ever typed
      the frozen P1553 setting's elliptic-curve-specific structure.
    pass_condition: >-
      A named P1553-structure lemma would need to reject the generic
      control before granting a P1553 remainder/witness at sub-Theta(B^3)
      cost, or before granting a verifier-side saving without an external
      prover; no candidate this round supplies such a lemma, so none
      passes.
    current_result: >-
      Not run as an experiment (no experiment authorized). Stated
      analytically: C1's classification theorems apply to any named
      polynomial family (permanent, immanants, and the rest), not
      specifically to (g_I, r_R), and supply no construction to test
      against the control at all. C2's Berkowitz-algorithm circuit applies
      to the Sylvester matrix of ANY two polynomials of the given degrees,
      elliptic or not -- the algorithm has no elliptic-curve-specific input.
      C3's constant-depth GCD circuit is stated for "two univariate
      polynomials" generically and applies identically to the generic (g,
      r) pair at the identical Theta(B^3)-input-wire cost. C4's
      depth-reduction theorem applies to any poly(s)-size circuit
      regardless of what polynomial it computes. C5's sumcheck/GKR protocol
      verifies a claim about the evaluation of ANY arithmetic circuit,
      elliptic-curve-derived or not; the verifier's cost and the protocol's
      structure are entirely agnostic to whether the circuit being checked
      computes r_R mod g_I or an arbitrary generic polynomial's remainder.
      This confirms none of C1-C5 ever used any fact about E, P, or Q
      beyond treating g_I and r_R (or a generic stand-in pair) as opaque
      polynomials or an opaque arithmetic circuit of given size and degree.
      No computation was executed; this is a stated control, not a run
      result.
  lossy_projection_test:
    applies: true
    tracked_object_c1: >-
      No tracked object exists for C1: the VP/VNP framework classifies
      already-named polynomial families and supplies no construction rule
      to project through the P1553 computation at all.
    tracked_object_c2: >-
      "The Berkowitz-circuit output (the characteristic-polynomial
      coefficients of the g_I/r_R Sylvester matrix)," proposed as the
      tracked object for C2.
    tracked_object_c3: >-
      "The constant-depth GCD circuit's output, gcd(g_I, r_R) = z_R
      itself," proposed as the tracked object for C3.
    tracked_object_c4: >-
      "The depth-reduced circuit's output," identical in value to whatever
      base circuit it depth-reduces, proposed as the tracked object for C4.
    tracked_object_c5: >-
      "The sumcheck transcript / verifier's view," O(log(circuit size))
      field elements exchanged instead of the full circuit trace, proposed
      as the tracked object for C5.
    test_result_c1: >-
      Not applicable: no tracked object exists to test, since no
      construction rule is supplied.
    test_result_c2: >-
      FAILS the novelty clause, not the algebraic-validity clause: the
      Berkowitz-circuit output IS the literal ROUTE-01 Sylvester-matrix
      determinant output under circuit-complexity vocabulary, so nothing
      new is projected -- a change of vocabulary, not a new projection.
    test_result_c3: >-
      FAILS the "genuinely lossy" clause: the tracked object gcd(g_I, r_R)
      IS z_R itself, not a projection of it, and constructing it requires
      the full Theta(B^3) r_R coefficient vector as input -- nothing is
      discarded before the full cost is already paid, the same failure
      mode round twelve's C1/C3 exhibited for the Bezoutian/u-resultant
      matrix.
    test_result_c4: >-
      FAILS the "genuinely lossy" clause outright: the depth-reduction
      transformation changes parallel depth, not retained data: the
      depth-reduced circuit's output is IDENTICAL in value and information
      content to the base circuit's output, so nothing is discarded at all.
    test_result_c5: >-
      Genuinely lossy in the information-theoretic sense (O(log(circuit
      size)) field elements versus the full circuit trace), but FAILS the
      "discarded compatibly with the target's operations" clause: the
      transcript's soundness depends entirely on an external,
      already-informed prover who has independently computed the true
      value of r_R mod g_I through some OTHER (already-costed or excluded)
      means before the protocol begins; the projection's domain of
      definition ("a prover holding the correct value") is not reachable
      from E, P, Q alone without first solving an equivalent problem or
      importing an excluded witness -- the same failure mode round twelve's
      C4 (Auzinger-Stetter, needing an unreachable Groebner basis) exhibited
      for a different reason.
    conclusion: >-
      No tracked object this round survives the lossy-projection test: C1
      supplies no tracked object at all; C2's projection is a vocabulary
      change, not a new projection; C3's and C4's projections are not
      genuinely lossy in this size regime or at all; C5's projection is
      genuinely lossy but its discard is not reachable compatibly from the
      frozen setting's public data. This is an algebraic, zero-compute
      audit performed before any experiment was proposed; no experiment is
      proposed as a result.

