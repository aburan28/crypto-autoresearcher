    four candidates onto ROUTE-01, ROUTE-02, ROUTE-05, and ROUTE-08 (not
    reopened here). This round searches a genuinely different QUESTION
    TYPE: whether the map E, P, Q -> r_R mod g_I has small circuit
    complexity via a classification-theoretic or depth-structural argument
