controls_before_belief:
  screen_is_its_own_control: >-
    For every candidate carrying G1, the screen checked (i) that the
    computation is genuinely public (no ECDLP-equivalent information hidden
    behind circuit-complexity or interactive-proof language -- the
    prover/verifier asymmetry underlying C5 is exactly this kind of hidden
    dependency, made explicit by nine independent retrieved sources plus
    the internal Libra record rather than accepted at face value), (ii) the
    quantifier order (all objects fixed before any witness is observed),
    and (iii) the already-costed-route exclusion as a named, route-specific
    check (not a generic "shares lineage" gesture).
  public_computation_check: >-
    C2's and C3's constructions are genuinely public in the narrow sense
    that neither requires roots or factors, but both require the full
    Theta(B^3) coefficient vector of r_R -- neither hides a witness so
    subtly it would pass a first read; the dependency is a direct
    input-wire-count fact stated in this round's own analysis. C1 supplies
    no construction at all to check. C4 presupposes an unestablished small
    circuit rather than hiding a witness. C5's dependency is stated
    directly in its own retrieved sources ("delegates expensive... public
    evaluations to an assigned computation worker") and corroborated by the
    internal Libra record (prover time O(C)) -- an explicit already-known-
    witness statement, not an inference.
  quantifier_order_check: >-
    Required order: freeze the P1553 rings, bases, CRT components, and
    interval geometry; fix the public g_I and r_R construction; name the
    trigger object T; receive public E, P, Q; construct T's circuit/protocol
    object from E, P, Q alone; compute r_R mod g_I (or the dyadic
    unit-product step) from it; enumerate the full cost and verify the
    B^(5/4)/o(ell^(1/2)) bounds; verify lineage/multiplicity, Q vs -Q,
    invertible Q coefficient, and source unranking. Forbidden order:
    assume a small circuit already exists and then invoke a classification
    (C1) or depth-reduction (C4) theorem on it; materialize the full
    Theta(B^3) object first and then apply a determinant or GCD circuit
