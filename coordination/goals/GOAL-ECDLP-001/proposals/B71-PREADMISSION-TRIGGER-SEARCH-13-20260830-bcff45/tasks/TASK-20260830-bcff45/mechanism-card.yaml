        assessment: >-
          Every retrieved paper is a CLASSIFICATION result: it places a
          named family of polynomials (permanents, immanants,
          hyperpfaffians, homomorphism polynomials, symmetrized
          determinants) into VP or proves it VNP-complete under
          p-projections, or studies the topology/density of the VNP-complete
          set. None constructs, or bears on constructing, a resultant-
          remainder object of the frozen setting's exact degree profile
          (a degree-Theta(B) modulus applied to a degree-Theta(B^3)
