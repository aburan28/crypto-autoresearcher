      - id: DOUBLY_EFFICIENT_IP_AND_DELEGATION_LINEAGE
        name: >-
          Doubly-efficient interactive-proof and delegation-of-computation
          papers (AI-safety debate protocols arXiv:2607.03561;
          pseudo-deterministic doubly-efficient proofs arXiv:1910.00994;
          doubly-efficient IP=PSPACE arXiv:2606.21799; batched unambiguous
          interactive proofs arXiv:2510.19075; interactive proofs for
          learning arXiv:2404.08158; GKR protocols for transformer-inference
          delegation arXiv:2607.21162; streaming zero-knowledge sumcheck and
          polynomial-evaluation proofs arXiv:2301.02161; survey of
          interactive verifiable computing naming the sumcheck and GKR
          protocols explicitly arXiv:2501.05500; proof-complexity-to-
          circuit-complexity via sumcheck soundness arXiv:2405.02232).
        source_refs:
          - arXiv:2607.03561
          - arXiv:1910.00994
          - arXiv:2606.21799
          - arXiv:2510.19075
          - arXiv:2404.08158
          - arXiv:2607.21162
          - arXiv:2301.02161
          - arXiv:2501.05500
          - arXiv:2405.02232
        assessment: >-
          Every retrieved source confirms the same structural fact: the
          sumcheck protocol and its GKR/doubly-efficient descendants exist
          to let a RESOURCE-BOUNDED VERIFIER check a claim supplied by a
          COMPUTATIONALLY STRONGER, UNTRUSTED PROVER, faster than
          recomputing the claim from scratch. arXiv:2607.21162's own
          framing is explicit: the protocol "delegates expensive... public
          evaluations to an assigned computation worker" and then verifies
          that worker's output; arXiv:2607.03561, 2606.21799, and 2510.19075
          confirm the identical prover/verifier asymmetry for general
          PSPACE-hard and debate-style verification tasks. The internal
          corpus independently corroborates the prover-side cost: KN-LIT-4716
