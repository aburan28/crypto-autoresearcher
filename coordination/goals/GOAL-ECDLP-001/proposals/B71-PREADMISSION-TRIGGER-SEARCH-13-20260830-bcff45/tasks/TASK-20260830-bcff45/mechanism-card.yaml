  critical_directional_fact_established_this_round: >-
    Every candidate family searched this round falls into one of three
    shapes, none of which is new relative to the twelve prior rounds'
    recurring failure pattern: (i) an explicit circuit-complexity
    construction (Berkowitz's NC^2 determinant algorithm; the new
