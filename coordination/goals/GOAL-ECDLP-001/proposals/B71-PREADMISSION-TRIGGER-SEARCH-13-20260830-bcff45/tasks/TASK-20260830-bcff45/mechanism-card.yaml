    objects_read:
      - id: VNP_COMPLETENESS_LITERATURE
        name: >-
          VNP-completeness and border-complexity results for permanent-like
          polynomials (topological density of VNP-complete polynomials
          arXiv:2102.07173; immanant VNP-completeness arXiv:2608.24045,
          cs/0301024; p-projection vs c-reduction separations
          arXiv:1609.05942; fermionant/determinant-permanent generalization
          arXiv:1309.2156; symmetric determinantal representations
          arXiv:1007.3804; hyperpfaffian VNP-completeness arXiv:1912.09389;
          homomorphism-polynomial dichotomy arXiv:1210.7641; planar
          perfect-matching expressive power arXiv:0705.3751; polynomial-
          evaluation dichotomy arXiv:0902.2300; Kronecker-product
          hypercomputant arXiv:2606.08363; Hamiltonian-cycle-polynomial
