lossy_projection_test_summary: >-
  C1 supplies no tracked object (no construction exists to project). C2's
  tracked object (the Berkowitz-circuit determinant output) is the literal
  ROUTE-01 output under circuit-complexity vocabulary -- it fails the
  novelty clause, not the algebraic-validity clause: a change of vocabulary,
  not a new projection. C3's tracked object (the constant-depth GCD
  circuit's output, gcd(g_I, r_R)) IS z_R itself, not a projection of it,
  and its construction requires the full Theta(B^3) r_R coefficient vector
  as input -- it fails the "genuinely lossy" clause exactly as round
  twelve's C1/C3 did. C4's tracked object (the depth-reduced circuit's
  output) is IDENTICAL to whatever base circuit it depth-reduces; the
  transformation changes depth, not retained data, so nothing is discarded
  at all -- it fails the "genuinely lossy" clause outright. C5's tracked
  object (the sumcheck transcript) is genuinely lossy in the
  information-theoretic sense but is not discarded compatibly with the
  frozen setting's operations, because its domain of definition requires an
  externally informed prover unreachable from E, P, Q alone -- it fails the
  "discarded compatibly with the target's operations" clause, the same
  failure mode round twelve's C4 exhibited for a different (Groebner-basis)
  reason.

