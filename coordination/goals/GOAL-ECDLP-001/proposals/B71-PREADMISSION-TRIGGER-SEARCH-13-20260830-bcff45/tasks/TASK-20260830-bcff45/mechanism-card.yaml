  already_costed_route_exclusion: >-
    Named, route-specific check run per candidate: C1 supplies no
    construction beyond ROUTE-01's own Sylvester-determinant witness; C2 IS
    ROUTE-01 (Sylvester-matrix determinant) restated via Berkowitz's
    algorithm; C3 matches ROUTE-01/ROUTE-08's materialization requirement
