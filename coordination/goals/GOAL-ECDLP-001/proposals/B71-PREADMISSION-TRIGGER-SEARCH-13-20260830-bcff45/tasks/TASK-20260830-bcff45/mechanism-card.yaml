          mod g_I specifically, at any size smaller than the size of the
          only concretely known circuit for it (ROUTE-01/07/08's
          Theta(B^3)-size construction), is neither established nor
          addressed by any source. Invoking "VP/VNP theory" as a trigger for
          this specific problem would therefore be exactly the assertion
          that a specialized circuit may exist, which G1 explicitly
          excludes.
