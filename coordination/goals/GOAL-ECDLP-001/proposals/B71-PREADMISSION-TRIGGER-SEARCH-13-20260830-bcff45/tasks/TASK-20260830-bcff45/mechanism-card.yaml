  component_b_bcs_algebraic_circuit_bound_techniques:
    what_was_searched: >-
      Bounded network retrieval over Buergisser-Clausen-Shokrollahi-style
      explicit algebraic circuit bound techniques for determinant, GCD, and
      resultant computation: Berkowitz's division-free NC^2 algorithm for
      the characteristic polynomial/determinant of a matrix (the classical
      route by which a resultant, as the determinant of a Sylvester matrix,
      is placed in an explicit polynomial-size circuit class), and any 2025
      -era refinement of circuit-size or circuit-depth bounds for
      polynomial GCD computation.
    searches_performed:
      - query: 'all:"Berkowitz algorithm"'
        instrument: webfetch arXiv export API
        results: 2 (both read at abstract level)
      - query: 'all:"resultant" AND all:"arithmetic circuit"'
        instrument: webfetch arXiv export API
        results: 20 (all read at abstract level; none on-topic beyond general arithmetic-circuit-complexity survey material)
      - query: 'all:"Buergisser" AND all:"resultant"'
        instrument: webfetch arXiv export API
        results: 20 (all read at abstract level; all off-topic -- condition numbers, geometric complexity theory, Smale's 17th problem)
      - query: 'all:"algebraic circuit" AND all:"gcd"'
        instrument: webfetch arXiv export API
        results: 2 (both read at abstract level; one construction-critical, see objects_read)
      - query: 'abstract fetch of arXiv:2506.23220'
        instrument: webfetch arxiv.org/abs page
        results: 1 (full abstract and submission history read)
      - query: 'all:"half-gcd" AND all:"parallel"'
        instrument: webfetch arXiv export API
        results: 0
      - query: 'all:"polynomial gcd" AND all:"NC"'
        instrument: webfetch arXiv export API
        results: 0
    objects_read:
      - id: BERKOWITZ_NC2_DETERMINANT
        name: >-
          Berkowitz's Algorithm and Clow Sequences (arXiv:math/0201315); the
          classical division-free NC^2 algorithm for computing the
          characteristic polynomial (hence determinant) of an n x n matrix
          via loop-cover/clow-sequence combinatorics.
        source_refs: [arXiv:math/0201315]
        assessment: >-
          Confirms the algorithm computes an n x n matrix's characteristic
          polynomial (and determinant as a coefficient of it) with a
          division-free circuit of size polynomial in n and depth
          O(log^2 n). Applied to the frozen setting via the Sylvester matrix
          of g_I and r_R (or of the complete-chart intersection system that
          produces r_R), n is dominated by deg(r_R) = Theta(B^3), so the
          resulting circuit's size is polynomial in Theta(B^3) -- an
          explicit, retrieved, and confirmed NC^2 construction, but at
          exactly the already-costed materialization size. G1 present; G2
          partial (only matrix coefficients needed, no roots, but the
          matrix itself is Theta(B^3)-dimensional); G3 absent (size
          poly(Theta(B^3)) exceeds the B^(5/4)/B^(9/4) caps); G8 absent
          (this IS ROUTE-01-component-resultants -- the Sylvester-matrix
          determinant construction -- restated as an explicit NC^2
          circuit-complexity result, not a new route).
      - id: CONSTANT_DEPTH_POLY_SIZE_GCD_CIRCUIT
        name: >-
          Constant-depth circuits for polynomial GCD over any characteristic
          (arXiv:2506.23220; Bhattacharjee, Kumar, Rai, Ramanathan,
          Saptharishi, Saraf, submitted 2025-06-29, cs.CC, single version,
          no withdrawal or errata notice).
        source_refs: [arXiv:2506.23220]
        assessment: >-
          A genuinely new (2025), on-topic, retrieved theorem: the GCD of
          two univariate polynomials is computable by (piecewise) algebraic
          circuits of CONSTANT depth and polynomial size over any
          sufficiently large field, regardless of characteristic --
          extending Andrews-Wigderson's characteristic-restricted result and
          a companion closure-under-factorization result by an overlapping
          author set. This is a real structural advance in depth (constant,
          not O(log n) as in the classical Euclidean-algorithm-based NC^2
          gcd/resultant results the BCS book presents), and it is the
          precise circuit family that could, in principle, compute
          z_R = gcd(g_I, r_R) directly. But instantiated to the frozen
          setting it requires the coefficients of BOTH g_I (degree Theta(B))
          AND r_R (degree Theta(B^3)) as circuit inputs; a circuit's input-
          wire count for a degree-Theta(B^3) polynomial is at least
          Theta(B^3) by construction, independent of how shallow or how
          polynomial-in-size the internal gates are -- constant DEPTH does
          not relax the INPUT SIZE requirement. G1 present (an actual,
          named, retrieved, non-withdrawn 2025 theorem); G2 partial (no
          roots needed, coefficients only, satisfying the "no witness"
          clause); G3 absent (Theta(B^3) input-wire count alone exceeds the
          caps, before any internal gate is counted); G8 absent
          (instantiated to gcd(g_I, r_R), this matches exactly the
          already-costed ROUTE-01/ROUTE-08 materialization requirement of
          needing r_R's full coefficient vector). A further, distinct
          honest finding: this circuit computes gcd(g_I, r_R) directly, not
          the remainder r_R mod g_I this round's primary trigger shape
          targets; by the Euclidean identity gcd(g_I, r_R) =
          gcd(g_I, r_R mod g_I), this circuit WOULD be cheap
          (poly(B)-size, constant depth) if r_R mod g_I were already known
          (both operands then have degree Theta(B)) -- but that is
          conditional on the unresolved remainder-transducer bottleneck
          being solved by some OTHER route first, so this result supplies a
          useful downstream tool for a POST-bottleneck step, not an attack
          on the bottleneck itself. Recorded honestly as a real, on-topic,
          non-duplicate new result that does not clear G3 or G8 for the
          PRE-bottleneck construction this round's trigger shape (a)
          requires.
      - id: MODULAR_COMPOSITION_GCD_SHALLOW_CIRCUITS_WITHDRAWN
        name: >-
          Modular composition and polynomial GCD in the border of small,
          shallow circuits (arXiv:2511.05035; Andrews, Kumar, Rai).
        source_refs: [arXiv:2511.05035]
        assessment: >-
          Re-encountered this round under the "algebraic circuit" + "gcd"
          query. This is the SAME paper round seven's near-miss and round
          eight's full-text reading already assessed: WITHDRAWN by its
          author (v2, 2026-01-27) with a referee-noted proof gap in
          Theorems 6.2 and 6.4 (round eight terminal note,
          preadmission_dispatch_queue_path_trigger_search_8_terminal_note_20260828).
          Not re-screened; its round seven/eight verdict (G1 present but
          weakened by withdrawal, all other gate items absent) stands
          unchanged. Noted here only to disclose the re-encounter and to
          distinguish it explicitly from arXiv:2506.23220 above, which
          shares two overlapping authors (Kumar, Rai) but is a distinct,
