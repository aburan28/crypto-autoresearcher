research_question: >-
  Does any actual recurrence, circuit identity, or retrieved theorem from
  algebraic complexity theory or interactive-proof methods -- Valiant's
  VP/VNP completeness framework, Buergisser-Clausen-Shokrollahi-style
  algebraic circuit bound techniques (explicit NC^2 division-free circuits
  for determinants/resultants, and constant-depth polynomial-size circuits
  for polynomial GCD), the Valiant-Skyum-Berkowitz-Rackoff depth-reduction
  theorem, or sumcheck/GKR-style interactive-proof argument systems for
  polynomial evaluation verification -- instantiate to the frozen P1553
  elliptic setting as (a) a typed public target-local remainder transducer
  for r_R mod g_I, or (b) the exact dyadic subinterval unit-product
  interface, passing every item of the frozen pre-admission gate, either by
  exhibiting a genuinely new small-circuit-complexity argument for the map
  E, P, Q -> r_R mod g_I, or by showing an interactive-proof/verification
  protocol could substitute for a direct public constructor? A protocol
  that only VERIFIES a claimed value of r_R mod g_I is explicitly not the
  same as a PUBLIC CONSTRUCTOR of that value and must be recorded as
  G1-absent, not conflated with a constructor, if that is all a candidate
  supplies.

