decision_summary: >-
  The thirteenth trigger search was performed over a scope explicitly
  disjoint from rounds seven through twelve: algebraic complexity theory
  and interactive-proof methods -- Valiant's VP/VNP completeness framework
  (C1), Berkowitz's NC^2 determinant algorithm applied to the g_I/r_R
  Sylvester matrix (C2), a genuinely new (2025, non-withdrawn)
  constant-depth polynomial-size algebraic circuit for polynomial GCD
  instantiated to z_R = gcd(g_I, r_R) (C3), the Valiant-Skyum-Berkowitz-
  Rackoff depth-reduction theorem and its modern limits (C4), and the
  sumcheck/GKR doubly-efficient interactive-proof/argument-system lineage
  (C5) -- via the arXiv export API (which recovered fully after three
  transient rate-limit/service errors on the first round of requests) and
  the internal knowledge corpus. C1 supplies no actual construction for
  this specific problem and is G1-absent. C2 is shown to BE
  ROUTE-01-component-resultants (the Sylvester-matrix determinant
  construction) restated as an explicit NC^2 circuit-complexity result. C3
  is a real, on-topic, non-duplicate 2025 theorem that nonetheless requires
  the full Theta(B^3) coefficient vector of r_R as a circuit input and,
  even where it succeeds, computes gcd(g_I, r_R) rather than the remainder
  r_R mod g_I this round's primary trigger shape targets -- useful only
  downstream of an already-solved bottleneck, not an attack on it. C4 is a
  depth (parallel-time) normal-form theorem that presupposes, and does not
  establish, a sub-Theta(B^3)-size circuit, and independently-retrieved
  literature (arXiv:1311.6716) confirms fundamental limits on further depth
  reduction. C5 is EXPLICITLY marked G1-absent per the dispatch's mandated
  distinction: sumcheck/GKR is a verification protocol for a value supplied
  by an external, already-informed, untrusted prover, not a public
  constructor, and its G8 failure matches the "witness-conditioned route"
  exclusion named in the gate's own text; the internal Libra record
  (KN-LIT-4716, prover time O(C)) independently corroborates that no
  constructive-side saving exists. Every candidate considered (C1-C5) is
  judged item-by-item against the frozen gate (G1-G8); none passes every
  item. The honest disposition is scoped_no_candidate, with every broader
  route preserved, the mandatory G8 comparison against the eight named
  routes discharged with a specific match for every candidate, and no B71,
  experiment, evidence, attack, SOTA, or breakthrough claimed.
