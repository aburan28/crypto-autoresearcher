objects_read:
  - id: VNP_COMPLETENESS_LITERATURE
    provenance: retrieved
    source_refs:
      - arXiv:2102.07173
      - arXiv:2608.24045
      - arXiv:cs/0301024
      - arXiv:1609.05942
      - arXiv:1309.2156
      - arXiv:1007.3804
      - arXiv:1912.09389
      - arXiv:1210.7641
      - arXiv:0705.3751
      - arXiv:0902.2300
      - arXiv:2606.08363
      - arXiv:2606.26653
      - arXiv:2604.28019
      - arXiv:2601.09343
      - arXiv:2502.02442
      - arXiv:0801.3408
    read_for: >-
      To find a VP/VNP classification result that places r_R mod g_I, or a
      construction of it, into a circuit-complexity class smaller than the
      already-costed Theta(B^3) materialization.
    supplied: >-
      Confirmation that every retrieved paper classifies a different named
      polynomial family (permanent, immanants, hyperpfaffians, homomorphism
      polynomials, symmetrized determinants) as VP-membership or
      VNP-completeness under p-projections, or studies the density/topology
      of the VNP-complete set.
    limitations: >-
      None addresses r_R mod g_I specifically, or supplies a
      circuit-complexity bound for it at any size smaller than the only
      concretely known circuit (the Theta(B^3)-size Sylvester-matrix
      determinant construction).
  - id: BERKOWITZ_NC2_DETERMINANT
    provenance: retrieved
    source_refs: [arXiv:math/0201315]
    read_for: To confirm the exact statement and cost profile of Berkowitz's division-free NC^2 determinant algorithm.
    supplied: >-
      Confirmation that the algorithm computes an n x n matrix's
      characteristic polynomial (hence determinant) with a division-free
      circuit of size polynomial in n and depth O(log^2 n).
    limitations: >-
      Applied to the g_I/r_R Sylvester matrix, n is dominated by
      deg(r_R) = Theta(B^3), so the resulting circuit size is
      poly(Theta(B^3)), exceeding the caps.
  - id: CONSTANT_DEPTH_POLY_SIZE_GCD_CIRCUIT
    provenance: retrieved
    source_refs: [arXiv:2506.23220]
    read_for: >-
      To find a 2025-era circuit-complexity result for polynomial GCD that
      might supply a public sub-Theta(B^3) construction of z_R = gcd(g_I, r_R).
    supplied: >-
      A genuinely new (2025, non-withdrawn, single-version) theorem: the
      GCD of two univariate polynomials is computable by piecewise algebraic
      circuits of constant depth and polynomial size over any sufficiently
      large field, regardless of characteristic.
    limitations: >-
      Requires the coefficients of both g_I and r_R as circuit inputs; a
      circuit's input-wire count for a degree-Theta(B^3) polynomial is at
      least Theta(B^3) regardless of internal depth or gate count. Computes
      gcd(g_I, r_R), not the remainder r_R mod g_I this round's primary
      trigger shape targets.
  - id: MODULAR_COMPOSITION_GCD_SHALLOW_CIRCUITS_WITHDRAWN
    provenance: retrieved
    source_refs: [arXiv:2511.05035]
    read_for: Disclosure of a re-encountered paper under this round's queries.
    supplied: >-
      Confirmation this is the SAME paper round seven's near-miss and round
      eight's full-text reading already assessed (withdrawn by its author,
      v2, 2026-01-27, referee-noted proof gap in Theorems 6.2 and 6.4).
    limitations: >-
      Not re-screened this round; its round seven/eight verdict stands
      unchanged. Distinguished explicitly from arXiv:2506.23220, a distinct,
      non-withdrawn, differently-scoped paper sharing two overlapping
      authors (Kumar, Rai).
  - id: DEPTH_REDUCTION_AND_CHASM_AT_DEPTH_FOUR
    provenance: retrieved
    source_refs:
      - arXiv:1804.03303
      - arXiv:1311.6716
      - arXiv:1404.1950
      - arXiv:1606.04200
      - arXiv:1511.02308
      - arXiv:1912.03824
    read_for: >-
      To independently confirm the mechanism and current limits of the
      Valiant-Skyum-Berkowitz-Rackoff depth-reduction theorem, whose exact
      name and statement predate arXiv and returned zero hits.
    supplied: >-
      Confirmation that depth reduction transforms an EXISTING poly(s)-size,
      degree-d circuit into an equivalent circuit of depth O(log s log d)
      with a declared polynomial size blowup, and that arXiv:1311.6716
      establishes fundamental limits on further depth reduction beyond a
      logarithmic top-fan-in threshold for general circuits.
    limitations: >-
      Confirms the mechanism (depth, not size, is reduced) and its limits;
      none of the six sources itself supplies a sub-Theta(B^3)-size circuit
      for r_R mod g_I to depth-reduce.
  - id: DOUBLY_EFFICIENT_IP_AND_DELEGATION_LINEAGE
    provenance: retrieved
    source_refs:
      - arXiv:2607.03561
      - arXiv:1910.00994
      - arXiv:2606.21799
      - arXiv:2510.19075
      - arXiv:2404.08158
      - arXiv:2607.21162
      - arXiv:2301.02161
      - arXiv:2501.05500
      - arXiv:2405.02232
    read_for: >-
      To determine squarely whether the sumcheck/GKR lineage supplies a
      public CONSTRUCTOR of r_R mod g_I, or only a VERIFIER of a value
      supplied by another party.
    supplied: >-
      Confirmation across all nine sources that the sumcheck protocol and
      its GKR/doubly-efficient descendants let a resource-bounded verifier
      check a claim supplied by a computationally stronger, untrusted
      prover, faster than recomputing the claim from scratch;
      arXiv:2607.21162's own framing states the protocol "delegates
      expensive... public evaluations to an assigned computation worker."
    limitations: >-
      None confers any ability to construct r_R mod g_I from E, P, Q alone;
      supplying a second, computationally unbounded party already holding
      the value would itself be the external witness the frozen gate
      excludes.

