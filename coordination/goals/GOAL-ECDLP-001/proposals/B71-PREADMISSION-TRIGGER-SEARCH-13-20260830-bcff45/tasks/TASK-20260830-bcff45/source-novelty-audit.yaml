provenance_policy: >-
  Every entry is labeled recalled, retrieved, kb, or internal. Retrieved
  means the source was fetched and read in this task (arXiv export API
  query responses and arXiv abstract pages via webfetch). kb means the
  source was resolved through grep to a committed knowledge/ corpus record
  and read. internal means a committed repository record (goal head,
  dispatch queue, frozen H-CREP-001 hypothesis, EXP-CREP-001 specification
  and packages, prior-round packets, or the idea-generation corpus under
  inputs/) read in this task. Recalled means no source was opened and the
  entry cannot support a coordinator decision, a known/adaptation novelty
  status, or a mathematical conclusion. No trigger-carrying statement in
  this task rests on a recalled source alone; every trigger-carrying
  statement rests on a retrieved, kb, or internal object actually read. One
  specific fact is flagged recalled rather than retrieved and is marked as
  such wherever used: the exact 1983 Valiant-Skyum-Berkowitz-Rackoff
  theorem statement and name (an arXiv query for its exact name returned
  zero hits, since it predates arXiv); its mechanism and current limits are
  independently retrieved and confirmed via six other sources
  (arXiv:1804.03303, arXiv:1311.6716, arXiv:1404.1950, arXiv:1606.04200,
  arXiv:1511.02308, arXiv:1912.03824), mirroring round twelve's identical
  treatment of the recalled Stetter-Moller theorem name.

retrieval_instrument_note: >-
