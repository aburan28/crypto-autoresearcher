  export API (http://export.arxiv.org/api/query) and arxiv.org abstract
  pages, per the dispatch constraint's stated instrument, consistent with
  rounds seven through twelve. The arXiv export API returned one transient
  HTTP 503 and two transient HTTP 429 responses on the first three
  concurrent requests of the session; all three recovered on a subsequent
  sequential retry with zero data loss, recorded as an infrastructure event
  and not a mathematical boundary. commands_or_searches_performed is
  recorded false because no shell command, program, or algebra computation
  was executed by this role; all "searches" performed were webfetch network
  requests or Grep/Read calls against the committed repository, itemized
  below.

