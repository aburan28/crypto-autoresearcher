  interactive-proof/argument-system lineage (sumcheck/GKR), but none
  instantiates to the frozen P1553 elliptic setting as a typed public
  remainder transducer, and none passes the frozen gate. This round
  establishes, rather than merely fails to find, three named structural
  reasons: (i) VP/VNP classifies only other named polynomial families and
  supplies no construction for r_R mod g_I; (ii) every circuit-complexity
  candidate (Berkowitz, the constant-depth GCD circuit, VSBR depth
  reduction) either requires the already-costed Theta(B^3) materialization
  as an input, or presupposes it, or merely changes its depth; (iii) the
  sumcheck/GKR lineage is, by its own well-documented design, a
  verification protocol for an externally supplied claim, not a public
  constructor, and is recorded G1-absent per the dispatch's explicit
  instruction, corroborated by the internal Libra record. The
  lossy-projection test independently disqualifies every tracked object
