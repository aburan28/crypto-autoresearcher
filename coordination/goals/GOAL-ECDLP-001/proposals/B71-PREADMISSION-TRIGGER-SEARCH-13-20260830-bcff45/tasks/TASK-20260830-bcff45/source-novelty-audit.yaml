  Novelty is unverified to known/adaptation across C1-C5: retrieved sources
  supply a real classification framework (VP/VNP), a classical explicit
  circuit construction (Berkowitz), a genuinely new 2025 structural result
  (the constant-depth GCD circuit), a classical depth-normalization theorem
