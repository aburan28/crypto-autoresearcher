    "theorem_statement": {
      "name": "Conditional mixed-radix generic extraction obstruction for universal subset-stable Query2P1",
      "statement": "Let G=<P> have prime order N, put B=N^(1/5), m=2^ceil(log2 B), and C=sum_{i=0}^4 m^i. Suppose one target-independent generic preprocessing data structure, occupying at most B^(9/4+o(1)) ordinary O(log N)-bit words across the preprocessing/online boundary, supports every canonical dyadic restriction of every one of five arbitrary public occurrence-labelled signed decks. Suppose that for a fresh target it returns the exact all-five-deck existence predicate with constant success, and that all online and replay work together uses at most B^(5/4+o(1)) main generic interactions. Suppose further that all crossing information is bit-charged, the advice is independent of the fresh target, cleared handles can be reconstructed only from retained known scalar lineage, and every construction, restriction, reconstruction, decoder, and verification interaction is charged. Then, conditional on the parent-relayed MPZ preprocessing generic-group bound success <= 3 ell (k+1)^2/N applying to this composed algorithm, no such universal solver exists for all sufficiently large N.",
      "logical_form": "For every solver A satisfying assumptions A1-A12 and the stated resource caps, there exists a family of five public labelled decks and a fresh generic DLP challenge Q=[x]P for which the composed extractor has MPZ-bounded success o(1), contradicting A's required constant success on every such deck/challenge pair.",
      "status": "candidate_pending_independent_review"
    },
    "definitions": {
      "group": "A cyclic generic group G=<P> of prime order N.",
      "scale": "B=N^(1/5).",
      "radix": "m=2^ceil(log2 B), hence B<=m<2B and N<=m^5<32N.",
      "offset": "C=sum_{i=0}^4 m^i.",
      "decks": "For i in {0,1,2,3,4}, F_i={(i,d,sigma,[sigma(d+1)m^i]P): 0<=d<m, sigma in {+1,-1}}. The occurrence label (i,d,sigma) is retained independently of the group encoding. If sign closure is not required, the positive occurrences alone suffice for existence.",
      "challenge": "A fresh Q=[x]P with x uniform in Z_N and target R=Q+[C]P, formed after preprocessing.",
      "query_predicate": "For restrictions S_i subseteq F_i, the exact bit says whether there are labelled occurrences e_i in S_i whose five group elements sum to R.",
      "canonical_dyadic_restrictions": "The binary interval tree on the fixed public ordering of the 2m occurrence labels of each F_i, including nodes reached by repeatedly retaining either half.",
      "subset_stable": "The same target-independent preprocessed object answers the exact predicate for all canonical dyadic restrictions, not merely for each whole deck.",
      "main_generic_interactions": "All group-oracle or shared-random-oracle interactions made by preprocessing reconstruction, target formation, every subset query execution, returned-handle reconstruction, decoding checks, and final verification, aggregated over the entire fresh-target session."
    },
    "assumptions": [
      {"id": "A1", "statement": "The solver is universal over arbitrary public occurrence-labelled signed decks of the declared size, rather than promised only random decks or the P1553 distribution."},
      {"id": "A2", "statement": "One target-independent data structure answers every canonical dyadic restriction of all five decks exactly with constant success over the fresh target session."},
      {"id": "A3", "statement": "The advice crossing from preprocessing to the online phase is independent of the fresh Q and R."},
      {"id": "A4", "statement": "Every crossing word contains O(log N) bits, or is charged by its serialized bit length."},
      {"id": "A5", "statement": "At most B^(9/4+o(1)) such ordinary words cross the phase boundary."},
      {"id": "A6", "statement": "At most B^(5/4+o(1)) main generic interactions occur in total across target construction and all replay/subset calls, not per call."},
      {"id": "A7", "statement": "Every construction, restriction, decoder, reconstruction, and verification interaction is included in A6."},
      {"id": "A8", "statement": "Any generic handles cleared between phases can be reconstructed only from retained information, and retained known scalar coefficients supply the claimed reconstruction without target-dependent hidden state."},
      {"id": "A9", "statement": "The solver's required constant or exact success includes the explicitly constructed mixed-radix decks."},
      {"id": "A10", "statement": "The parent-relayed MPZ Theorem 3/Corollary 3 bound applies to the complete composed extractor in the chosen preprocessing generic-group/shared-random-oracle model."},
      {"id": "A11", "statement": "Occurrence labels survive equal group encodings, modular wraparound, and opposite-sign or cross-deck collisions, so the decoder receives the selected labels rather than only anonymous points."},
      {"id": "A12", "statement": "The existence interface permits adaptive canonical dyadic restriction queries against the same fresh target, and its constant-success guarantee composes across the complete isolation transcript as specified by the reviewed model."}
    ],
    "lemmas": [
      {
        "id": "L1",
        "statement": "Each constructed deck has Theta(B) labelled occurrences and m^5 lies in [N,32N).",
        "proof": "By definition m is the least power of two not below B, so B<=m<2B. Each signed deck has 2m occurrences. Raising the radix inequalities to the fifth power gives N=B^5<=m^5<32B^5=32N.",
        "scope": "Size and radix only; this says nothing about a P1553 deck distribution."
      },
      {
        "id": "L2",
        "statement": "For every x in {0,...,N-1}, the full decks contain a positive-sign labelled tuple summing to R=Q+[C]P.",
        "proof": "Because x<N<=m^5, write x=sum_{i=0}^4 d_i m^i with 0<=d_i<m. Selecting (i,d_i,+1) contributes [(d_i+1)m^i]P. The sum is [x+C]P=R.",
        "scope": "Existence on the constructed decks; it does not require or imply that arbitrary P1553 decks have this form."
      },
      {
        "id": "L3",
        "statement": "An exact all-five-deck subset-stable existence predicate isolates one complete labelled witness using at most 5*ceil(log2(2m)) canonical dyadic queries after the initial guaranteed existence.",
        "proof": "Maintain five current dyadic label sets whose Cartesian product contains a witness. For one deck, query the left child while fixing the other four current sets. If true retain the left child; otherwise exactness and the invariant imply a witness uses the right child, which is retained. Repeat to a singleton, then process the next deck. There are at most ceil(log2(2m)) splits per deck and the invariant survives every split.",
        "scope": "Requires exact adaptive restriction access and a transcript-level success guarantee; a whole-deck-only bit or a fifth-deck-interval output is insufficient."
      },
      {
        "id": "L4",
        "statement": "Every returned labelled signed witness decodes the fresh discrete logarithm modulo N.",
        "proof": "If selected labels are (i,d_i,sigma_i), their point sum equalling R gives [sum_i sigma_i(d_i+1)m^i]P=[x+C]P. Prime-order cyclicity implies x'=sum_i sigma_i(d_i+1)m^i-C mod N equals x mod N. Computing [x']P and comparing it with Q verifies the result.",
        "scope": "Labels, not uniqueness of point encodings or integer lifts, drive decoding. The conclusion is modulo N."
      },
      {
        "id": "L5",
        "statement": "Under assumptions A3-A10, the composed extractor has MPZ success at most B^(-1/4+o(1))=N^(-1/20+o(1)).",
        "proof": "The crossing state is ell=B^(9/4+o(1)) bits because an O(log N) factor is absorbed in the o(1) exponent. The total main interaction count is k=B^(5/4+o(1)). Substitution in the parent-relayed bound 3 ell (k+1)^2/N gives B^(9/4+2*5/4-5+o(1))=B^(-1/4+o(1))=N^(-1/20+o(1)).",
        "scope": "Conditional on exact MPZ theorem/model applicability and complete interaction/advice accounting; both are assigned to independent review."
      },
      {
        "id": "L6",
        "statement": "The universal solver assumptions and caps contradict L2-L5 for sufficiently large N.",
        "proof": "Universality and subset-stable exactness give a constant-success extractor on the constructed decks by L2-L4, while L5 makes success o(1). These cannot both hold for sufficiently large N.",
        "scope": "Only the solver class in the theorem statement; no conclusion transfers to a solver outside any mandatory assumption."
      }
    ],
    "decoder": {
      "input": "Five isolated occurrence labels (i,d_i,sigma_i), the public radix m and offset C, P, and fresh Q.",
