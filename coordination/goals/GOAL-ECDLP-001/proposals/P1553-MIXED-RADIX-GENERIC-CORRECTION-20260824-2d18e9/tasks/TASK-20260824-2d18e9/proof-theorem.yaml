    "claim_ceiling": "A conditional impossibility result only for a universal exact target-fresh, target-independent-advice, arbitrary-deck, all-five-deck subset-stable generic Query2P1 solver under the enumerated MPZ-model and bit-accounting assumptions. It is not a coordinate-aware lower bound, a P1553-specific closure result, a generic ECDLP lower bound, an attack, a speedup, a SOTA claim, B71, or a breakthrough.",
