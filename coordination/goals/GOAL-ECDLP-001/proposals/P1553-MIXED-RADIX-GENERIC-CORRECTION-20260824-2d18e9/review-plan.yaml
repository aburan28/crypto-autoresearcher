  coordinator_prior: >-
    The mixed-radix deck construction likely repairs the missing reduction for a
    universal exact subset-stable generic predicate. The most likely break is
    model accounting: the MPZ theorem may not permit identifying S ordinary
    words with ell=S polylog(N) advice bits, or the adaptive subset queries may
    require more main interactions than the inherited T cap. Even if all joints
    hold, the result must stop at the arbitrary-deck generic interface and must
    not close the coordinate-aware or P1553-specific lane. This prior is recorded
    before any reviewer runs and is not evidence.
  claim_under_review: >-
    Whether the mixed-radix construction gives an exact reduction from a
    universal arbitrary-deck all-five-deck subset-stable Query2P1 predicate to
    DLP and, under the exact MPZ preprocessing generic-group theorem with
    bit-charged target-independent advice, rules out the frozen
    S=B^(9/4+o(1)), T=B^(5/4+o(1)) rectangle at constant success. The review
    cannot establish a coordinate-aware EC lower bound, a lower bound for
    P1553-specific decks or target-local remainders, B71, SOTA movement, attack,
    speedup, or breakthrough.
  joints:
    - joint: J1-mixed-radix-relation-decoding-and-subset-recovery
      assigned_to: TASK-20260824-fb8b1d
      role: reviewer
      attack_plan: >-
        Re-derive the construction from integers and group relations; check deck
        sizes, O avoidance, signs, labels, overflow m^5>N, modular collisions,
        cross-deck collisions, uniqueness assumptions, exact dyadic interval
        restriction, the false-branch invariant in adaptive bisection, and final
        verification. Construct minimal counterexamples for any omitted endpoint
        or orientation case.
      expected_break: >-
        A returned signed tuple or a false half-query may not preserve a surviving
        solution, or overflow and collisions may make the label decoder ambiguous.
    - joint: J2-MPZ-theorem-model-binding-and-exponent-accounting
      assigned_to: TASK-20260824-77a495
      role: validator
      attack_plan: >-
        Retrieve and bind the exact MPZ theorem and corollary; type every model
        parameter; distinguish advice bits, group handles, random oracle access,
        and main interactions; charge word serialization, deck construction,
        target formation, O(log N) adaptive calls, handle reconstruction,
        decoding, and verification; independently recompute the B and N exponents;
        and identify any theorem premise the packet fails.
      expected_break: >-
        The theorem's ell or k parameter differs from the packet substitution, or
        uncharged preprocessing/online information invalidates B^(-1/4+o(1)).
    - joint: J3-scope-proves-too-much-and-steering-boundary
      assigned_to: TASK-20260824-6a9318
      role: red-team
      attack_plan: >-
        Apply the argument to every known-false transfer; search for covert moves
        from universal arbitrary decks to random or P1553 decks, from subset
        stability to whole-deck existence, from bit-charged generic advice to
        coordinate representations, and from a narrow generic obstruction to a
        lane closure. Audit whether the correction honestly preserves the
        target-local transducer revisit condition and whether any open route is
        improperly deprioritized.
      expected_break: >-
        The theorem may be sound but the stated conclusion or successor guidance
        may overreach into coordinate-aware or distribution-restricted routes.
