    exact_bound_verified: "success <= 3 * ell * (k + 1)^2 / N"
    exact_bound_result: pass
  model_binding:
    theorem_3:
      model: "pG_dense = <Z_N, {+,1}, {dense}, (infinity,k), infinity, P_N>"
      order_condition: N is prime
      advice_parameter: "ell is the bit length |z| of the sole advice string from S.pre to S.main"
      main_parameter: >-
        k is the hard total number of main-phase interactions answered by the
        game, aggregating computation operations and function queries.
      preprocessing_parameter: "k.pre is infinity and is not charged to k"
      register_parameter: "the model permits infinitely many registers, but clears every register at the phase boundary"
      probability: >-
        The theorem is for the average-case extraction game with uniform
        permutation pi in P_N and uniform x in Z_N, including solver randomness.
      result: pass
    corollary_3:
      model: "pG_dense,ro = <Z_N, {+,1}, {dense,ro}, (infinity,k), infinity, P_N>"
      random_oracle: >-
        The source's ro query on a registered value v returns RO(pi(v)) for one
        random function RO from Z_N to Z_N shared by the two phases. Appendix
        F.6 fixes that function, applies Theorem 3, and averages over it without
        changing the query count.
      result: pass
    clearing_and_handles:
      result: pass_with_required_condition
      detail: >-
        No group register or opaque handle survives preprocessing. Every
        pi-dependent or preprocessing-dependent persistent datum must be in z,
        hence bit-charged. A main-phase handle is admissible only if reconstructed
        through charged interactions from retained serialized data and known
        scalar lineage. The packet states exactly this condition in A4, A7, and A8.
    solver_interface:
      result: pass_with_scope_boundary
      detail: >-
        The mapping is valid for a solver simulable using the paper's group
        operations and dense or shared-ro queries. The source does not cover a
        coordinate-aware oracle, an arbitrary representation-sensitive primitive,
        a persistent external handle store, or a different shared oracle. The
        packet explicitly excludes those transfers.
    average_case_quantifiers:
      result: pass_with_scope_boundary
      detail: >-
        Uniform fresh x and uniform generic permutation pi are load-bearing. The
        bound is not a pointwise theorem for a fixed special representation. A
        constant-success guarantee over the complete fresh generic session, or a
        stronger guarantee for every pi and x, contradicts the average bound;
        success only for one fixed representation does not.
  metric_recomputations:
    - metric: advice bits from ordinary words
      inputs:
        advice_words: "W = B^(9/4+o(1))"
        serialized_word_bits: "O(log N)"
      derivation: >-
        ell <= O(W log N), including framing, pointer topology, retained random
        state, representations, and lineage metadata. Since log N=B^o(1),
        ell=B^(9/4+o(1))=N^(9/20+o(1)). This is an upper bound after complete
        serialization, not an identification of one word with one bit.
      result: pass
    - metric: aggregate main interactions
      inputs:
        declared_cap: "T = B^(5/4+o(1))"
        radix: "m in [B,2B)"
      derivation: >-
        A conservative reconstruction of all 10m signed deck occurrences by
        binary scalar multiplication costs O(B log N)=B^(1+o(1)) interactions.
        Target formation and final group verification each cost O(log N).
        There are q=5*ceil(log2(2m))=O(log B) adaptive predicate calls. Every
        dense query, ro query, replay, restriction, data-structure handle
        reconstruction, returned-handle reconstruction, and verification
        interaction must be included in one hard total k. Under the packet's
        aggregate cap, k=B^(5/4+o(1)); a per-call cap would acquire only a
        polylogarithmic factor if every call obeyed it, but replaying S handles
        could exceed the cap and is not inferred away.
      result: pass_with_explicit_aggregate_assumption
    - metric: success exponent in B
      derivation: >-
        3*ell*(k+1)^2/N = B^(9/4+2*(5/4)-5+o(1))
        = B^(-1/4+o(1)).
      arithmetic: "9/4 + 10/4 - 20/4 = -1/4"
      result: pass
    - metric: success exponent in N
      derivation: >-
        B=N^(1/5), so ell=N^(9/20+o(1)), k=N^(1/4+o(1)), and
        9/20+2*(1/4)-1=-1/20. Hence the bound is N^(-1/20+o(1)).
      arithmetic: "9/20 + 10/20 - 20/20 = -1/20"
      result: pass
    - metric: transcript success lower bound
      derivation: >-
        A transcript-level success probability c>0 for all adaptive answers gives
        the composed extractor success at least c, conditional on the J1 decoder.
        Marginal constant success for each query alone gives no positive lower
        bound for the whole adaptive transcript. Amplification is admissible only
        with a uniform conditional error guarantee and fresh rerunnable coins,
        and all repetitions must be charged to k. A12 states the required joint
        transcript guarantee, so the frozen conditional theorem survives this
        check; deleting A12 breaks the application.
      result: pass_with_load_bearing_A12
