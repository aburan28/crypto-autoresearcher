  claim_under_review: >-
    Whether the mixed-radix correction stays confined to a universal exact,
    arbitrary-deck, all-five-deck subset-stable generic Query2P1 interface with
    target-independent bit-charged advice and aggregate online interactions,
    and whether it avoids closing or steering away from P1553-specific,
    coordinate-aware, distribution-restricted, target-conditioned,
    representation-sensitive, or target-local routes.
  snapshot_binding:
