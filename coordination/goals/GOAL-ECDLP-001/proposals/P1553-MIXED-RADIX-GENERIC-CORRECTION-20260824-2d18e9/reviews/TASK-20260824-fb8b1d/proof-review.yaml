  independent_derivation:
    radix_and_size:
      status: holds
      derivation:
        - >-
          Put t=ceil(log2(B)) and m=2^t.  For B>1,
          2^(t-1)<B<=m<2B.  Consequently N=B^5<=m^5<32N.
        - >-
          The signed occurrence-label set in each deck is
          {i} x {0,...,m-1} x {+1,-1}, so it contains exactly 2m labels;
          the positive-only version contains exactly m.  Thus both sizes are
          Theta(B), even if two labels carry equal group encodings.
        - >-
          For every odd prime N, m<N.  Since N is prime, N does not divide the
          power of two m, and 1<=d+1<=m<N.  Therefore
          N does not divide (d+1)m^i for 0<=i<=4: no constructed deck
          occurrence is the identity.  N=2 is an irrelevant finite exception
          to the asymptotic theorem and is recorded in the control artifact.
      boundary: >-
        Cardinality is cardinality of labelled occurrences, not cardinality of
        the set obtained after forgetting labels and collapsing equal encodings.

    positive_witness_and_offset:
      status: holds
      derivation:
        - >-
          For 0<=x<N<=m^5, the unique length-five base-m expansion
          x=sum_{i=0}^4 d_i m^i has 0<=d_i<m.  Selecting the positive label
          (i,d_i,+1) in every deck contributes
          sum_i (d_i+1)m^i=x+C, where C=sum_i m^i, exactly over the integers.
        - >-
          Thus the selected points sum to [x+C]P=Q+[C]P=R.  The d+1 shift is
          paired exactly with the target shift C; subtracting C in the decoder
          is necessary and sufficient.  No assumption that m^5=N is used.
      endpoints_checked:
        - x=0 uses d_i=0 for every i and has integer coefficient sum C.
        - x=N-1 remains below m^5 and therefore has five legal digits.

    signed_relation_and_decoder:
      status: holds
      derivation:
        - >-
          Let a returned labelled tuple be (i,d_i,sigma_i) and put
          A=sum_i sigma_i(d_i+1)m^i.  Its asserted relation is [A]P=R=[x+C]P.
          Because P has exact order N, A is congruent to x+C modulo N.
        - >-
          Hence x'=(A-C) mod N is congruent to x modulo N.  This argument
          covers arbitrary signs and all integer lifts; it neither assumes a
          positive tuple nor uniqueness of the tuple.
        - >-
          Computing and comparing [x']P with Q is a total final check.  A
          singleton tuple created from a faulty transcript may fail this check;
          verification turns that event into extractor failure and does not
          manufacture success.
      formula: "x'=(sum_i sigma_i(d_i+1)m^i-C) mod N"

    overflow_and_collisions:
      status: holds
      derivation:
        - >-
          The base-m expansion only requires x<m^5.  Values A and C may exceed
          N, and distinct labels may have coefficients differing by a multiple
          of N.  The group relation and decoder are both modulo N, so every
          valid labelled tuple still decodes to x.
        - >-
          Adjacent decks already have deterministic collisions:
          ((m-1)+1)m^i=m^(i+1)=(0+1)m^(i+1).  Additional wraparound and signed
          collisions are harmless to the stated decoder because the selected
          occurrence labels, rather than a guessed integer lift of an encoding,
          determine A.
      premise_that_cannot_be_dropped: >-
        Restrictions must address occurrence labels.  If the interface first
        collapses equal encodings and cannot restrict the occurrences
        separately, it is not the A1/A11 interface reviewed here.

    dyadic_subset_recovery:
      status: holds
      invariant: >-
        For current dyadic nodes S_0,...,S_4, let W(S_0,...,S_4) be the set of
        labelled tuples in their Cartesian product whose points sum to R.  The
        invariant is W nonempty.
      induction:
        - >-
          Initially W is nonempty by the positive base-m witness.  To split a
          current node S_j=L disjoint-union R_j, query W with L in coordinate j
          and every other current node fixed.
        - >-
          A true exact answer gives W(...,L,...) nonempty, so retaining L
          preserves the invariant.  A false exact answer says that set is
          empty.  Since the old W is the union of its L and R_j parts and is
          nonempty, W(...,R_j,...) is nonempty, so retaining R_j also preserves
          the invariant.
        - >-
          Repeating for all five coordinates leaves a Cartesian product of five
          singletons.  Its sole tuple is a relation witness.  Multiple witnesses
          at earlier nodes cause no ambiguity and no uniqueness premise is used.
      exact_interface_needed: >-
        The allowed query family must contain simultaneous five-way Cartesian
        products of current dyadic nodes.  Five unrelated one-coordinate
        restriction interfaces are not enough once an earlier coordinate has
        already been narrowed.

    exact_query_count:
      status: holds
      derivation:
        - >-
          Since m=2^t, every signed deck has 2m=2^(t+1) leaves and exact depth
          log2(2m)=t+1.  One left-child predicate call suffices per level; a
          false answer selects the right child without a second call.
        - >-
          Isolating all five signed decks therefore makes exactly
          5*log2(2m)=5*ceil(log2(2m)) calls.  The full-deck existence statement
          is proved by the embedding and need not be queried.  An implementation
          that gratuitously queries the full product would use one additional
          call, but that call is not part of the reduction.
        - >-
          For the positive-only m-leaf variant the corresponding exact count is
          5*log2(m).  In either case the count is O(log N).

    transcript_success:
      status: holds_only_under_explicit_joint_assumption
      required_event: >-
        One event E for the fresh-target session on which every adaptively chosen
        predicate answer equals the exact Cartesian existence bit, with
        Pr[E] bounded below by the promised positive constant.
      non_implication: >-
        A constant marginal success probability for each query does not imply a
        constant probability for E.  For example, independent per-query
        correctness p<1 gives p^(5 log2(2m)), which decays polynomially in m.
        A single false negative on a left half containing all surviving
        witnesses selects an empty right half and destroys the invariant.
      frozen_assumption: >-
        A2 and A12 explicitly require transcript-level exactness/constant
        success, so this is not a J1 break.  Whether that assumption is faithful
        to the candidate solver and the cited model belongs to J2.

    target_identity_edge:
      status: holds
      derivation: >-
        The constructed deck occurrences are nonidentity for odd prime N, but
        the translated uniform target R can equal the identity for the unique
        challenge x=-C mod N.  If an external interface excludes identity
        targets, the extractor can detect this case and return -C mod N
        directly (charging the comparison), or lose only probability 1/N.
        The algebraic relation itself accepts R=O without modification.

