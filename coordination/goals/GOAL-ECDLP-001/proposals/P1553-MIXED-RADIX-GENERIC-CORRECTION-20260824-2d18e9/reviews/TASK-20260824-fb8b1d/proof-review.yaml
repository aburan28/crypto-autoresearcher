      status: no_J1_counterexample
      statement: >-
        No endpoint, sign, offset, overflow, collision, false-branch, decoder,
        or verification counterexample survives the frozen occurrence-labelled
        exact-transcript assumptions.
    - severity: boundary
      status: assumption_not_derived
      statement: >-
        Transcript-level constant exactness is load-bearing.  It must remain an
        explicit premise and may not be replaced by a per-query marginal
        guarantee.
    - severity: boundary
      status: interface_not_derived
      statement: >-
        The bisection needs restrictions of the full current five-way Cartesian
        product and labels that remain independently addressable after encoding
        collisions.  A marginal-only or encoding-collapsed interface is outside
        J1.
    - severity: boundary
      status: no_impossibility_from_stop_control
      statement: >-
        When one deck lacks the declared subset interface, the frozen dyadic
        decoder stops.  This is not a proof that every alternative recovery is
        impossible: for example, a charged O(m) scan after four labels are fixed
        may deserve a separately frozen construction and accounting review.
        This review does not expand the theorem to that interface.

