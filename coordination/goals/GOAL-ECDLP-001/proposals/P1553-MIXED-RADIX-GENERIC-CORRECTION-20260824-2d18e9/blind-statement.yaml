  id: BLIND-P1553-MIXED-RADIX-2d18e9
  goal_id: GOAL-ECDLP-001
  recorded_at: "2026-08-24T22:31:41Z"
  quantity: >-
    Decide whether the stated special-deck construction and preprocessing bound
    imply vanishing success for the declared universal generic predicate, and
    derive the exact exponent without reading any producer or sibling artifact.
  frozen_statement:
    - G is a prime-order generic group of order N generated by P and Q=[x]P is a fresh target
    - B=N^(1/5), m=2^ceil(log2 B), and C=sum_i_0_to_4 m^i
    - deck i contains labelled signed occurrences (i,d,sigma,[sigma(d+1)m^i]P) for 0<=d<m
    - the target queried is R=Q+[C]P
    - one target-independent data structure answers the exact existential predicate after any canonical dyadic restriction of each deck
    - crossing advice is at most S=B^(9/4+o(1)) ordinary O(log N)-bit words
    - total charged main-group interactions, including adaptive recovery and verification, are at most T=B^(5/4+o(1))
    - the preprocessing generic-group theorem supplied for this derivation states success <= 3 ell (k+1)^2/N for ell advice bits and k main interactions, including its shared-random-oracle corollary
  required_derivation:
    - prove or refute existence of a relation for every x in [0,N)
    - prove or refute correct decoding of every returned labelled signed tuple modulo N
    - handle m^5>N, cross-deck collisions, signs, occurrence labels, and exact dyadic isolation
    - translate word state into advice bits and count every online interaction
    - derive the final N or B exponent and state the success contradiction if any
    - enumerate exact nonapplicability boundaries
  known_false_transfers:
    - a solver promised only random decks
    - a predicate that cannot answer restrictions in one deck
    - target-conditioned preprocessing
    - unit-cost words of unbounded serialized length
    - a coordinate-aware elliptic-curve oracle
    - a fifth-interval-only output without recovery of the other four labels
  sources_allowed:
