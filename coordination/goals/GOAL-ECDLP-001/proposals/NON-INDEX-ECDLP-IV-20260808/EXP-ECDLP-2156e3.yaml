experiment:
  id: EXP-ECDLP-2156e3
  hypothesis_id: H-ECDLP-68bb5a
  version: 1
  title: Charged isogeny-class transfer to special prime-field targets
  status: review_required
  objective: >-
    Test whether a bounded-degree, invertible F_p-rational isogeny can transfer
    an ECDLP instance to a target with a verified quotient advantage at lower
    end-to-end charged cost than direct rho.
  inputs:
    source_scope: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-IV-20260808
    prerequisite_experiment: EXP-ECDLP-51921d
    prior_artifacts:
      - coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-III-20260807/artifacts/isogeny_class_manifest.yaml
      - coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-III-20260807/artifacts/endo_transfer_table.csv
  controls:
    - id: C-DIRECT
      description: direct source-curve rho with the Arm-A baseline policies
    - id: C-RANDMAP
      description: same-degree random map with matched serialization and evaluation budget
    - id: C-NONSPECIAL
      description: same-order non-special isogeny neighbor under the same degree budget
    - id: C-IDENTITY
      description: identity transfer with all serialization and certificate costs retained
    - id: C-POS
      description: deliberately anomalous or small-embedding-degree target, excluded from ordinary primary claims
  independent_variables:
    - source curve and target curve
    - isogeny degree and chain length
    - one-shot versus amortized target count
    - quotient policy on target
    - deterministic seed
  metrics:
    primary:
      - end-to-end charged solve cost divided by sqrt(ell)
      - forward/inverse certificate success
      - transfer failure rate
    secondary:
      - map construction and failed-candidate cost
      - forward and inverse field/group operations
      - target quotient walk cost
      - serialization size and memory
      - one-shot and amortized-many-target break-even count
  heuristic_under_test: HEUR-68bb5a-01
  preregistered_prediction:
    quantity: end-to-end charged transfer cost
    formula: >-
      total = candidate construction + map construction + forward transfer +
      target solve + inverse transfer + certificate replay; no term may be set
      to zero because it is a one-time preprocessing step.
    source: frozen cost model in this experiment specification
  scale_relevance:
    tier: toy
    justification: >-
      Direct low-bit runs validate transfer correctness and cost accounting;
      they cannot support an asymptotic or cryptographic-scale claim.
    correspondence: null
  tail_checks:
    - compare the best target against same-degree random-map and non-special controls
    - report one-shot and amortized-many-target costs separately
    - check whether target selection cost dominates any apparent gain
  replication:
    seeds:
      - 101
      - 103
      - 107
      - 109
      - 113
      - 127
      - 131
      - 137
    independent_instances: 12
  budget:
    wall_clock_seconds_per_run: 1200
    total_cpu_hours: 5
    maximum_memory_gb: 12
    maximum_runs: 12
  stopping_rules:
    - do not test Arm B until Arm A baseline and quotient receipts are snapshotted
    - stop and mark invalid on any subgroup non-invertibility or certificate failure
    - stop candidate enumeration at degree budget [2,3,4,5,7,11]
    - stop at the run budget without selecting targets from observed solve outcomes
  invalidation_rules:
    - isogeny kernel intersects the measured prime subgroup
    - target map is not explicitly F_p-rational
    - source/target order or twist checks are missing
    - transfer or serialization costs are omitted from the receipt
  success_criterion: >-
    A replicated, control-corrected end-to-end reduction relative to direct rho
    and same-degree null maps, with all forward/inverse certificates valid.
  falsification_criterion: >-
    All target gains disappear after charged transfer costs, or same-degree null
    maps reproduce the signal, or the map is not invertible on the subgroup.
  required_artifacts:
    - candidate and seed manifest
    - raw source/target map and rho receipts
    - forward/inverse certificate records
    - one-shot and amortized cost table
    - independent validation and red-team reports
  assigned_to: executor
  approved_by: null
