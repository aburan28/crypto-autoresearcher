experiment:
  id: EXP-ECDLP-51921d
  hypothesis_id: H-ECDLP-1853dc
  version: 1
  title: Automorphism-quotiented Pollard-rho census on prime-field curves
  status: review_required
  objective: >-
    Measure whether verified F_p-defined automorphism quotients reduce complete
    charged Pollard-rho solve cost relative to ordinary and negation-only controls.
  inputs:
    source_scope: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-IV-20260808
    prior_artifacts:
      - coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-III-20260807/artifacts/isogeny_class_manifest.yaml
      - coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-III-20260807/artifacts/control_baseline_report.json
    curve_generation: deterministic seeded prime-field generator with independent order certificate
  controls:
    - id: C-BASE
      description: ordinary Pollard rho without quotient canonicalization
    - id: C-NEG
      description: Pollard rho modulo verified negation only
    - id: C-RAND
      description: same-order random ordinary curve with no selected special structure
    - id: C-RELABEL
      description: same-shape random relabelling that destroys the candidate automorphism action
    - id: C-POS
      description: anomalous or small-embedding-degree calibration, excluded from primary ordinary sample
  independent_variables:
    - field size and subgroup size
    - curve family and j/CM category
    - quotient subgroup and orbit size
    - deterministic seed
  metrics:
    primary:
      - normalized charged rho work divided by sqrt(ell)
      - recovered-scalar certificate success
      - fitted log-log slope over held-out subgroup sizes
    secondary:
      - group additions
      - field operations by type
      - automorphism evaluations and canonicalization operations
      - fruitless-cycle and retry counts
      - wall time, memory, and serialized precomputation size
      - effective orbit size and stabilizer count
  heuristic_under_test: HEUR-1853dc-01
  preregistered_prediction:
    quantity: normalized charged work
    formula: >-
      idealized quotient baseline is proportional to sqrt(ell / m), where m is
      the verified effective orbit size; measured cost adds declared map and
      cycle-retry overhead.
    source: >-
      Standard birthday-collision model and negation-map calibration; no
      asymptotic claim is inferred from the toy runs.
  scale_relevance:
    tier: toy
    justification: >-
      Direct rho runs at these sizes validate correctness, controls, and finite-
      size scaling only; they do not establish cryptographic-scale security.
    correspondence: null
  tail_checks:
    - compare fruitless-cycle tail by quotient size
    - compare collision certificate failures by curve family
    - compare the strongest observed gain with its pre-registered orbit-size ceiling
  replication:
    seeds:
      - 101
      - 103
      - 107
      - 109
      - 113
      - 127
      - 131
      - 137
    independent_instances: 12
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 3
    maximum_memory_gb: 8
    maximum_runs: 12
  stopping_rules:
    - stop and mark invalid if curve, subgroup, automorphism, or certificate checks fail
    - stop the family after two consecutive non-random quotient-cycle failures
    - stop at the run budget; do not tune the candidate family after observing gains
  invalidation_rules:
    - missing exact command, seed, version, or raw walk receipt
    - non-F_p-defined automorphism admitted to the primary arm
    - unverified subgroup eigenvalue or stabilizer handling
    - baseline and quotient runs use different success criteria
  success_criterion: >-
    A replicated, control-corrected reduction in normalized charged work for at
    least one held-out ordinary family, with all scalar certificates valid.
  falsification_criterion: >-
    The quotient is invalid, the normalized gain is absent versus negation and
    same-order controls, or the gain is fully explained by overhead/cycle artifacts.
  required_artifacts:
    - deterministic instance manifest and seed register
    - raw per-walk machine-readable receipts
    - baseline/negation/full-quotient comparison table
    - automorphism field-of-definition and eigenvalue certificates
    - validation report with finite-size and scope limits
  assigned_to: executor
  approved_by: null
