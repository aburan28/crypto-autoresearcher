schema: crypto.autoresearch.ecdlp.cm_endomorphism_certificate.v1
status: draft_not_dispatchable
goal_id: GOAL-ECDLP-001
scope: S2-non-unit-CM-endomorphism

objective: >-
  Freeze one exact, source-hash-bound certificate for a publicly constructed
  non-unit CM endomorphism on a prime-field curve before any S2 implementation
  or solve.  The certificate must distinguish a usable subgroup action from a
  j label, a CM label, a small-integer artifact, or an unreconciled historical
  run.  It is a protocol contract only and does not assert that any row exists
  or improves ECDLP.

claim_boundary:
  no_experiment: true
  no_run_receipt: true
  no_evidence_record: true
  no_hypothesis_transition: true
  no_exponent_claim: true
  no_speedup_claim: true
  toy_rows_are_not_crypto_scale: true
  historical_exp_endo_001_not_admitted: true

source_binding:
  exact_inputs:
    - path: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-IV-20260808/proof_search_map/S2-CM-ENDO-20260809.yaml
      sha256: 81c107405f539ada443a9ffb4a227282b26cf8ac1f940635d3b184a3294601c6
    - path: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-IV-20260808/amendments/S2-CM-ENDO-20260809-v3.yaml
      sha256: 13fd408ddb453e2eb3f250bae9531e2da65a081e11a129c4c0f51c237e018287
    - path: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-IV-20260808/protocol_inputs/implementation_boundary.yaml
      sha256: 3c8a4bfa5207c4ed3656f2f33b8dada233e407c384d0522e7ca3fcb38e808bb9
    - path: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-IV-20260808/protocol_inputs/curve_selection_scope.yaml
      sha256: aace19255cb13bf4e87b25a694276b0d07a9270013dd7f5f0a1ff2ed1cadb736
    - path: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-IV-20260808/protocol_inputs/automorphism_census/cost_schema.yaml
      sha256: e6ca9da13bb5d501358fc8c6eaa81b7363135793f9ec62b837614d8f22f99ea0
  historical_inputs:
    - experiments/EXP-ENDO-001
    - experiments/EXP-ENDO-001/amendments/v1_withdrawn_before_execution.yaml
  historical_policy: >-
    The visible EXP-ENDO-001 execution artifacts and the immutable withdrawal
    record are inconsistent.  Neither is used as an S2 baseline or result;
    only a fresh source-hash-bound fixture may enter a later approved queue.

stratum:
  finite_discriminants: [-7, -8, -11, -19, -43, -67, -163]
  class_polynomial_required: true
  class_polynomial_encoding: >-
    Exact signed integer coefficients in descending degree, canonical JSON
    array, SHA-256 bound to the candidate row; H_D(j) = 0 mod p is necessary
    but never sufficient for admission.
  exclude_unit_special: [j=0, j=1728]
  field: F_p_only
  extension_field_kernels: unsupported_refusal
  ordinary_only: true
  candidate_degree_cap:
    allowed_prime_degrees: [2, 3, 5, 7, 11]
    unsupported_degree_status: unsupported_degree_refusal
  coverage_boundary: >-
    The finite discriminant and degree lists are a measured protocol boundary,
    not a completeness claim about CM curves or endomorphisms.

instance_contract:
  required_public_fields:
    - instance_id
    - p
    - a
    - b
    - j
    - discriminant_D
    - class_polynomial_digest
    - N_subgroup
    - P
    - Q
    - candidate_id
    - seed
  curve_digest: >-
    SHA-256 of canonical JSON with sorted keys {p,a,b}; no alternate model or
    curve relabeling is accepted without a separately verified isomorphism.
  point_encoding: >-
    Infinity is 00; affine points are 01 || x_bytes || y_bytes, with fixed
    width ceil(bit_length(p)/8) unsigned big-endian coordinates.
  subgroup_gate:
    N_must_be_prime: true
    exact_order_P: true
    exact_order_Q: true
    P_and_Q_in_subgroup: true
    gcd_degree_N: 1
    planted_scalar_fixture_only: true
  scalar_boundary: >-
    A known k may appear only in a fixture that checks [k]P=Q and is never
    available to candidate selection, map construction, eigenvalue recovery,
    rho state generation, or a solver path.

cm_label_gate:
  required:
    - j_is_nonzero_and_not_1728
    - H_D_j_mod_p_equals_zero
    - discriminant_is_in_declared_finite_list
    - class_polynomial_digest_matches_coefficients
  refusal_if:
    - label_only_without_class_polynomial
    - class_polynomial_or_j_mutation
    - unit_special_label_reused_as_nonunit_cm
  interpretation: >-
    Passing this gate admits a CM candidate for certificate construction only;
    it does not admit an endomorphism, an eigenvalue, or a solve.

endomorphism_certificate:
  target_curve_digest_must_equal_source: true
  representation:
    map_kind: explicit_rational_map_over_F_p
    coordinate_functions: [f_x, f_y]
    coefficients_canonical_json: true
    denominator_zero_policy: >-
      The map must provide an explicit exceptional-value rule for every kernel
      point (mapping to infinity); any unhandled pole or hidden black-box map
      is a refusal.
  degree:
    declared_prime: true
    allowed: [2, 3, 5, 7, 11]
    exact_degree_certificate: true
    degree_inference_from_kernel_length: forbidden
  kernel:
    full_points_including_identity: true
    identity_encoding: 00
    exact_cardinality: degree
    exact_point_orders: true
    subgroup_closure: true
    negation_pairs: true
    canonical_digest: true
    x_only: invalid
    incomplete: invalid
    duplicate: invalid
    non_Fp_point: unsupported_extension_field_refusal
  map_checks:
    source_curve_membership: true
    target_curve_membership: true
    map_identity: true
    kernel_maps_to_identity: true
    nonkernel_denominators_nonzero: true
    point_replay_on_P_Q_and_public_basis: true
    subgroup_preservation: true
    no_forward_driver_import: true
    no_solver_secret_access: true

dual_and_cm_relation:
  dual_map_required: true
  dual_map_independent_coefficients: true
  dual_degree_equals_degree: true
  compositions:
    phi_dual_equals_degree_multiplication: true
    dual_phi_equals_degree_multiplication: true
  trace_norm_certificate:
    public_trace_alpha_t: true
    public_norm_alpha_n: true
    characteristic_polynomial: X^2 - t*X + n
    norm_must_equal_declared_degree: true
    addition_relation_phi_plus_dual_equals_t_multiplication: true
  eigenvalue:
    public_derivation_only: true
    polynomial_root_mod_N: X^2 - t*X + n
    deterministic_root_selection: least_encoded_root
    root_must_be_verified_on_P_and_Q: true
    lambda_map_equation: phi(R) = [lambda]R for R in {P,Q,public_basis}
    dlp_recovery_forbidden: true
    no_root_refusal: no_subgroup_eigenvalue_refusal
  decomposition_boundary: >-
    A verified scalar action may support only the declared orbit/decomposition
    accounting.  No exponent change is admitted without a new proof map,
    success-probability argument, and independent review.

independent_replay:
  verifier_must_not_import:
    - producer_curve_order
    - producer_class_polynomial_evaluation
    - producer_forward_map
    - producer_dual_map
    - producer_eigenvalue
    - producer_solve_output
  verifier_recomputes:
    - curve_digest
    - H_D_j_mod_p
    - exact_curve_order_or_declared_trace
    - exact_subgroup_orders
    - kernel_digest_and_closure
    - map_and_dual_evaluations
    - degree_and_gcd
    - trace_norm_relations
    - eigenvalue_polynomial_and_point_equations
  known_answer_fixture:
    required: true
    equations: ['[k]P = Q', '[k]phi(P) = phi(Q)', 'dual(phi(P)) = [degree]P']
    secret_k_visibility: fixture_verifier_only

controls:
  required_before_any_score:
    - id: C-CM-BASELINE
      meaning: ordinary direct rho on the identical valid source instance
    - id: C-CM-NEGATION
      meaning: negation-only quotient on the identical source instance
    - id: C-CM-ORDINARY-NEIGHBOR
      meaning: same-order ordinary curve with no admitted CM map
    - id: C-CM-RELABEL
      meaning: same curve with j/CM label or certificate-field mutation
    - id: C-CM-NULL-HASSE
      meaning: primary curve-free Hasse-window null from the v3 amendment
    - id: C-CM-NULL-INTEGER
      meaning: secondary matched small-integer same-modulus null
    - id: C-CM-NULL-UNIT
      meaning: uniform-unit calibration reference
    - id: C-CM-MAP-MUTATION
      meaning: altered map, dual, kernel, degree, or lambda must refuse
  null_ordering: >-
    Materialize every draw, rejection, observable, and refusal for all three
    null arms before any statistic, threshold, family pooling, or solve output
    is inspected.  Sparse trace or stratum cells refuse or remain inconclusive.
  refusal_semantics: >-
    A missing map, unavailable root, non-rational kernel, failed relation,
    unsupported degree, or sparse null is a charged refusal/unresolved cell,
    never a zero cost and never evidence against CM or ECDLP.

cost_accounting:
  raw_before_normalized: true
  normalization: sqrt(N_subgroup)
  target_counts: [1, 8, 64]
  raw_components:
    - candidate_inventory
    - class_polynomial_and_j_gate
    - map_construction
    - kernel_enumeration_and_digest
    - dual_construction
    - map_and_dual_evaluation
    - trace_norm_and_eigenvalue_derivation
    - subgroup_and_scalar_replay
    - rho_state_canonicalization
    - retries_and_success_probability
    - serialization
    - peak_memory
    - wall_time
  forbidden:
    - zero_filled_refusal_vector
    - unapproved_scalar_price_table
    - setup_cost_hidden_from_amortized_rows
    - producer_only_cost

proof_search_audits:
  exact_baseline_reproduction: required_before_approval
  observation_collision_search: required_before_approval
  quantifier_order_statement: required_before_approval
  method_ceiling_with_nearby_object: required_before_approval
  status: pending
  dominated_by: pending_frontier_audit
  sota_delta:
    status: no_measurement
    time_exponent_delta: 0
    memory_exponent_delta: 0
    data_query_exponent_delta: 0

conformance_controls:
  - C-CM-REPLAY
  - C-CM-CM-LABEL-MUTATION
  - C-CM-KERNEL-MUTATION
  - C-CM-MAP-MUTATION
  - C-CM-DEGREE-MUTATION
  - C-CM-DUAL-COMPOSITION
  - C-CM-EIGENVALUE
  - C-CM-NULL-ORDERING
  - C-CM-NO-FORWARD-REUSE
  - C-CM-SOLVER-SECRET

dispatch_gate:
  not_dispatchable: true
  required_before_approval:
    - independent review of S2 map v2, null correction v3, and this contract
    - all four proof-search audits have explicit pass/fail/not-applicable records
    - source-hash-bound implementation and the complete known-answer fixture suite
    - harness backend preflight passes without prohibited fallback
    - Coordinator decision admits a successor task
  current_blockers:
    - s2_v3_independent_review_pending
    - exact_implementation_not_built
    - proof_search_audits_pending
    - harness_preflight_no_usable_backend
  permitted_next_action: >-
    Keep this contract, the v3 null correction, and the Arm-A/Arm-B packages as
    immutable draft artifacts.  Do not dispatch S2, select a target from solve
    outcomes, or promote a mathematical result.
