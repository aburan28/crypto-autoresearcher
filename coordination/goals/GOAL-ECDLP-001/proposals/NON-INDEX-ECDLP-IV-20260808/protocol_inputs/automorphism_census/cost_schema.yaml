schema: crypto.autoresearch.ecdlp.endo_cost_vector.v2
status: frozen_cost_schema
normalization_denominator: sqrt(N_subgroup)
scalar_aggregate: forbidden_without_separately_approved_price_table
fields:
  point_additions: {type: integer, unit: group_operation}
  point_doublings: {type: integer, unit: group_operation}
  scalar_precompute_ops: {type: integer, unit: group_operation}
  field_additions: {type: integer, unit: field_operation}
  field_multiplications: {type: integer, unit: field_operation}
  field_squarings: {type: integer, unit: field_operation}
  field_inversions: {type: integer, unit: field_operation}
  canonicalization_comparisons: {type: integer, unit: comparison}
  automorphism_evaluations: {type: integer, unit: map_evaluation}
  fruitless_collisions: {type: integer, unit: event}
  deterministic_restarts: {type: integer, unit: event}
  certificate_replay_ops: {type: integer, unit: group_operation}
  serialized_bytes: {type: integer, unit: byte}
  peak_memory_bytes: {type: integer, unit: byte}
  wall_time_ms: {type: integer, unit: millisecond}
aggregation:
  charged_vector: setup_vector + walk_vector + retry_vector + certificate_vector
  failed_attempts: include_observed_vector_and_restart_event
  omitted_or_zeroed_cost: invalid_receipt
receipt_requirements:
  - raw_vector_and_normalized_vector
  - mode_and_control
  - N_subgroup
  - trial_and_restart_indices
  - source_manifest_sha256
