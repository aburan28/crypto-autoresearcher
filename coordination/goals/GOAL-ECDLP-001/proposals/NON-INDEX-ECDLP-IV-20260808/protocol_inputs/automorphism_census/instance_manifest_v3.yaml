pre_run_checks:
  - row_count_equals_declared_count
  - rows_are_lexicographically_ordered
  - each_seed_occurs_once_per_field_bits
  - seed_to_family_schedule_matches_every_row
  - each_field_bits_has_j0_j1728_and_ordinary_rows
  - calibration_and_held_out_partitions_are_frozen
  - no_extra_rows
  - generator_version_matches_amendment
  - special_field_predicate_is_checked_after_p_is_generated
  - failed_special_predicate_is_refusal_not_negative_evidence
claim_boundary: >-
  This successor input makes the special and ordinary strata observable and
  held out before execution. It does not establish that any row has an
  admissible action, and it is not an ECDLP measurement or conclusion.

