schema: crypto.autoresearch.ecdlp.endo_instance_schedule.v4
status: successor_input_draft_pending_independent_review
manifest_version: ecdlp-endo-census-v4
supersedes:
  path: protocol_inputs/automorphism_census/instance_manifest_v3.yaml
  sha256: 065d000b06064b3f1dfa3fef3c50ebe8790ed730059152d9194815b1c32fe298
  treatment: immutable_prior_successor_input_remains_unchanged
run_unit: one field_bits/seed/family row with twelve trials for every declared mode and constructible control
field_bits: [14, 16, 18]
seeds: [101, 103, 107, 109, 113, 127, 131, 137]
trials_per_row: 12
max_steps_per_trial: 400000
max_restarts_per_trial: 4
policies: [ordinary, negation, full]
subgroup_order_symbol: N_subgroup
row_order: lexicographic(field_bits, seed)
row_count: 24
family_schedule:
  seed_to_family:
    101: j0_unit
    103: j1728_unit
    107: ordinary
    109: ordinary
    113: j0_unit
    127: j1728_unit
    131: ordinary
    137: ordinary
  per_field_bits:
    j0_unit: 2
    j1728_unit: 2
    ordinary: 4
  no_unlabelled_family_rows: true
prime_selection:
  candidate_seed: sha256(seed || field_bits || curve_family || "prime_candidate")
  candidate_order: ascending_candidate_rank
  rejection_cap: 64
  record_every_rejected_candidate: true
  cost_fields:
    - prime_candidate_rank
    - prime_candidate_rejections
    - prime_predicate_checks
    - prime_selection_status
  exhaustion_status: family_unavailable_refusal
  no_fallback_between_families: true
  selection_before_curve_coefficients: true
family_construction:
  j0_unit:
    prime_predicate: p > 3 and p mod 3 = 1
    coefficient_shape: a=0 and b != 0
    intended_action: verified_Fp_defined_order_3
    prime_stream_tag: j0_unit
    exhausted_or_certificate_missing: refusal_before_full_walk
  j1728_unit:
    prime_predicate: p > 3 and p mod 4 = 1
    coefficient_shape: a != 0 and b=0
    intended_action: verified_Fp_defined_order_4
    prime_stream_tag: j1728_unit
    exhausted_or_certificate_missing: refusal_before_full_walk
  ordinary:
    prime_predicate: prime_field_only
    coefficient_shape: nonsingular and j not in {0, 1728}
    intended_action: verified_negation_only_or_explicit_refusal
    prime_stream_tag: ordinary
    special_j_after_construction: reject_and_continue_within_same_family_cap
    exhausted_or_certificate_missing: family_unavailable_refusal
partition:
  calibration_seeds: [101, 103, 107, 109]
  held_out_seeds: [113, 127, 131, 137]
  same_family_schedule_in_each_partition: true
  held_out_required: true
  no_partition_selection_after_observation: true
rows:
  - {row_id: A-0001, field_bits: 14, seed: 101, curve_family: j0_unit, partition: calibration}
  - {row_id: A-0002, field_bits: 14, seed: 103, curve_family: j1728_unit, partition: calibration}
  - {row_id: A-0003, field_bits: 14, seed: 107, curve_family: ordinary, partition: calibration}
  - {row_id: A-0004, field_bits: 14, seed: 109, curve_family: ordinary, partition: calibration}
  - {row_id: A-0005, field_bits: 14, seed: 113, curve_family: j0_unit, partition: held_out}
  - {row_id: A-0006, field_bits: 14, seed: 127, curve_family: j1728_unit, partition: held_out}
  - {row_id: A-0007, field_bits: 14, seed: 131, curve_family: ordinary, partition: held_out}
  - {row_id: A-0008, field_bits: 14, seed: 137, curve_family: ordinary, partition: held_out}
  - {row_id: A-0009, field_bits: 16, seed: 101, curve_family: j0_unit, partition: calibration}
  - {row_id: A-0010, field_bits: 16, seed: 103, curve_family: j1728_unit, partition: calibration}
  - {row_id: A-0011, field_bits: 16, seed: 107, curve_family: ordinary, partition: calibration}
  - {row_id: A-0012, field_bits: 16, seed: 109, curve_family: ordinary, partition: calibration}
  - {row_id: A-0013, field_bits: 16, seed: 113, curve_family: j0_unit, partition: held_out}
  - {row_id: A-0014, field_bits: 16, seed: 127, curve_family: j1728_unit, partition: held_out}
  - {row_id: A-0015, field_bits: 16, seed: 131, curve_family: ordinary, partition: held_out}
  - {row_id: A-0016, field_bits: 16, seed: 137, curve_family: ordinary, partition: held_out}
  - {row_id: A-0017, field_bits: 18, seed: 101, curve_family: j0_unit, partition: calibration}
  - {row_id: A-0018, field_bits: 18, seed: 103, curve_family: j1728_unit, partition: calibration}
  - {row_id: A-0019, field_bits: 18, seed: 107, curve_family: ordinary, partition: calibration}
  - {row_id: A-0020, field_bits: 18, seed: 109, curve_family: ordinary, partition: calibration}
  - {row_id: A-0021, field_bits: 18, seed: 113, curve_family: j0_unit, partition: held_out}
  - {row_id: A-0022, field_bits: 18, seed: 127, curve_family: j1728_unit, partition: held_out}
  - {row_id: A-0023, field_bits: 18, seed: 131, curve_family: ordinary, partition: held_out}
  - {row_id: A-0024, field_bits: 18, seed: 137, curve_family: ordinary, partition: held_out}
pre_run_checks:
  - row_count_equals_declared_count
  - rows_are_lexicographically_ordered
  - each_seed_occurs_once_per_field_bits
  - seed_to_family_schedule_matches_every_row
  - each_field_bits_has_j0_j1728_and_ordinary_rows
  - calibration_and_held_out_partitions_are_frozen
  - prime_candidate_stream_is_deterministic
  - every_rejected_prime_candidate_is_serialized
  - special_prime_predicate_is_satisfied_before_coefficients
  - ordinary_special_j_candidates_are_rejected_without_family_fallback
  - rejection_cap_exhaustion_is_family_unavailable_refusal
  - no_extra_rows
claim_boundary: >-
  This successor input makes prime-field family coverage executable rather than
  merely labeled. It does not establish that any action is admissible, and it
  is not an ECDLP measurement or conclusion.

