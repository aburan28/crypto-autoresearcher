schema: crypto.autoresearch.ecdlp.isogeny_control_schedule.v2
status: frozen_control_schedule
controls:
  C-DIRECT:
    map: none
    solver_policy: Arm-A-full
    retain_transfer_costs: false
  C-RANDMAP:
    map_seed: sha256(seed || "C-RANDMAP" || source_instance_id || degree || candidate_rank)
    preserve: [evaluation_shape, serialization_shape]
    end_to_end_transport: forbidden_without_homomorphism_certificate
  C-NONSPECIAL:
    selection: same_order_non_special_neighbor_under_same_degree_budget
    target_selection: precommitted_before_target_solve
  C-IDENTITY:
    map: identity
    retain: [construction, serialization, certificate, replay_costs]
  C-POS:
    selection: anomalous_or_small_embedding_target
    primary_table: excluded
matching_keys: [source_instance_id, degree, seed, candidate_rank, N_subgroup, target_count]
missing_control: refusal_table_entry_before_comparison
post_observation_rule: no_target_selection_or_control_changes
