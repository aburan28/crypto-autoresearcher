schema: crypto.autoresearch.ecdlp.isogeny_control_schedule.v3
status: successor_input_draft_pending_independent_review
policy_version: arm-b-v9
supersedes:
  path: protocol_inputs/isogeny_transfer/control_manifest.yaml
  sha256: a60fe1a9210952e0800ebdc254d4510e11ebe3e475c3d8d55ee6167020a3f997
  treatment: immutable_archived_input_remains_unchanged
controls:
  C-DIRECT:
    map: none
    solver_policy: ordinary
    baseline_policy_id: C-DIRECT
    canonicalization: forbidden
    retain_transfer_costs: false
    purpose: primary_direct_ordinary_source_rho_baseline
  C-DIRECT-NEG:
    map: verified_identity_negation_pair
    solver_policy: negation
    baseline_policy_id: C-DIRECT-NEG
    canonicalization: verified_negation_only
    admission: refusal_if_negation_certificate_missing
  C-DIRECT-FULL:
    map: verified_Fp_defined_automorphism
    solver_policy: full
    baseline_policy_id: C-DIRECT-FULL
    canonicalization: verified_full_action
    admission: refusal_if_automorphism_certificate_missing
  C-RANDMAP:
    map: deterministic_random_map_null
    map_seed: sha256(seed || "C-RANDMAP" || source_instance_id || degree || candidate_rank)
    preserve: [evaluation_shape, serialization_shape]
    end_to_end_transport: forbidden_without_homomorphism_certificate
  C-NONSPECIAL:
    selection: same_order_non_special_neighbor_under_same_degree_budget
    target_selection: precommitted_before_target_solve
  C-IDENTITY:
    map: identity
    retain: [construction, serialization, certificate, replay_costs]
  C-POS:
    selection: anomalous_or_small_embedding_target
    primary_table: excluded
matching_keys:
  - source_instance_id
  - degree
  - seed
  - candidate_rank
  - N_subgroup
  - target_count
  - baseline_policy_id
  - target_policy_id
  - policy_pair_cell
comparison_contract:
  primary_cell: target_policy_full_vs_C-DIRECT-ordinary
  matched_secondary:
    - target_policy_ordinary_vs_C-DIRECT-ordinary
    - target_policy_negation_vs_C-DIRECT-NEG
    - target_policy_full_vs_C-DIRECT-FULL
  report_cells_separately: true
  no_cross_policy_substitution: true
  no_cross_policy_pooling: true
missing_control: refusal_table_entry_before_comparison
post_observation_rule: no_target_selection_or_control_definition_changes
claim_boundary: >-
  This overlay repairs direct-policy labels and comparison-cell identity only.
  It does not approve Arm B, establish target availability, or assert an ECDLP
  result.

