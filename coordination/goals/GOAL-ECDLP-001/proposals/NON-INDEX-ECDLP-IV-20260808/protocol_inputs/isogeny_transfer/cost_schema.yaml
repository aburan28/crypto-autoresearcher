schema: crypto.autoresearch.ecdlp.isogeny_cost_vector.v2
status: frozen_cost_schema
normalization_denominator: sqrt(N_subgroup)
scalar_aggregate: forbidden_without_separately_approved_price_table
amortization_targets: [1, 8, 64]
fields:
  candidate_enumeration: {type: integer, unit: event}
  rejected_candidate_work: {type: integer, unit: event}
  kernel_construction_ops: {type: integer, unit: group_operation}
  map_construction_ops: {type: integer, unit: field_operation}
  forward_map_ops: {type: integer, unit: field_operation}
  inverse_or_dual_map_ops: {type: integer, unit: field_operation}
  serialization_bytes: {type: integer, unit: byte}
  deserialization_bytes: {type: integer, unit: byte}
  target_rho_ops: {type: integer, unit: group_operation}
  certificate_replay_ops: {type: integer, unit: group_operation}
  retries_and_failures: {type: integer, unit: event}
  peak_memory_bytes: {type: integer, unit: byte}
  wall_time_ms: {type: integer, unit: millisecond}
formulas:
  one_shot: C_enumeration + C_rejected + C_construct + C_forward + C_serialize + C_target_rho + C_inverse_or_dual + C_replay
  amortized_k: C_enumeration + C_rejected + C_construct + k * (C_forward + C_serialize + C_target_rho + C_inverse_or_dual + C_replay)
  allowed_k: [1, 8, 64]
no_free_preprocessing: true
receipt_requirements:
  - raw_vector_and_normalized_vector
  - source_and_target_digests
  - target_count
  - candidate_manifest_sha256
  - arm_a_snapshot_sha256
