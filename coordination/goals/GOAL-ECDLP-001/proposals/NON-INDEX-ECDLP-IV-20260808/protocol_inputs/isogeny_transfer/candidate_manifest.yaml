schema: crypto.autoresearch.ecdlp.isogeny_candidate_policy.v2
status: pre_run_materialization_required
role: >-
  This file freezes the candidate enumeration policy. The Executor must
  materialize the complete candidate/rejection/null table into
  artifacts/isogeny_transfer/candidate_manifest.yaml and hash it before any
  target-side solve; this policy file is not itself evidence.
prior_structural_audit_boundary:
  experiment_id: EXP-ECDLP-3c1bc0
  run_id: RUN-ECDLP-3c1bc0-001
  source_paths:
    - experiments/EXP-ECDLP-3c1bc0/specification.yaml
    - experiments/EXP-ECDLP-3c1bc0/runs/RUN-ECDLP-3c1bc0-001/raw-result.json
  reuse: >-
    Reuse only as deterministic curve/degree candidate provenance and fixture
    seed material. The prior audit measured structural odd-degree closure, not
    end-to-end ECDLP transfer cost, target-side rho, or source scalar replay;
    its review/ledger chain is not complete in this v2 package.
  non_duplication_rule: >-
    Arm B must not spend primary candidate rows or budget re-running the prior
    closure statistic. Every admitted row must add a fresh source P,Q,
    N_subgroup, scalar-replay certificate, independent transfer certificate,
    and complete construction-to-replay cost vector. A structural-only row is
    recorded as provenance or refusal, never as a transfer result.
  new_decision_uncertainty: >-
    Whether any precommitted special or nonspecial isogeny target changes the
    fully charged source-to-target ECDLP cost after map construction,
    evaluation, retries, memory, serialization, and replay.
source_instance_manifest: artifacts/automorphism_census/instance_manifest.yaml
degrees: [2, 3, 4, 5, 7, 11]
seeds: [101, 103, 107, 109, 113, 127, 131, 137]
max_candidates_per_degree: 12
candidate_order: bytewise(source_instance_id, degree, target_j, target_coefficients_digest, kernel_digest, map_digest)
truncation: first_12_constructible_per_degree; record_all_later_rows_as_truncated
manifest_hash: sha256(canonical_utf8_yaml_with_lf_endings)
freeze_before: first_target_side_rho_solve
required_row_kinds: [candidate, rejected, truncated, C-RANDMAP, C-NONSPECIAL, C-IDENTITY, C-POS, unsupported]
random_map_seed: sha256(seed || "C-RANDMAP" || source_instance_id || degree || candidate_rank)
even_degree_rule: dedicated_formula_or_explicit_unsupported_receipt
target_strata:
  unit-special: j in {0, 1728} with verified F_p-defined automorphism
  cm-nonunit: verified non-unit CM endomorphism with subgroup eigenvalue
  ordinary-other: ordinary target with no admitted special action
  control-nonspecial: same-order non-special neighbor
  excluded-positive: anomalous or small-embedding calibration
stratum_gate: >-
  A row may be labeled cm-nonunit only after a separate endomorphism
  construction/eigenvalue certificate; a j-invariant label alone is insufficient.
current_arm_admission:
  unit-special: admitted_if_Arm-A_certificate_valid
  cm-nonunit: refusal_until_separate_S2_protocol_approval
  ordinary-other: admitted_as_baseline_or_control
  control-nonspecial: admitted_as_control
  excluded-positive: retained_only_as_excluded_calibration
