protocol_amendment:
  experiment_id: EXP-ECDLP-51921d
  version_from: 5
  version_to: 6
  kind: exact_prime_stream_reproducibility_superseding_amendment
  filed_at: '2026-08-09'
  filed_by: coordinator
  status: draft_pending_independent_review
  approved_by: null
  approved_by_decision: null
  affected_runs: []
  confirmatory_status: preserved
  supersedes:
    path: amendments/EXP-ECDLP-51921d-v5.yaml
    snapshot_commit: 685f83ee3
    treatment: immutable_prior_amendment_remains_unchanged
  scope_statement: >-
    This amendment freezes the exact byte-to-prime candidate algorithm for the
    v5 family-selection contract. It changes no family schedule, rho mode,
    cost normalization, hypothesis, or claim tier and authorizes no run.
  defect: >-
    The v5 manifest names a SHA-256 candidate seed and ascending rank but does
    not define field encoding, rank encoding, digest-to-integer conversion,
    odd clamping, exact prime search, bit-length rejection, duplicate handling,
    or the serialized candidate transcript. Different implementations could
    therefore select different primes while claiming the same seed and family.
  successor_input_binding:
    canonical_path: protocol_inputs/automorphism_census/prime_stream_contract_v1.yaml
    companion_manifest: protocol_inputs/automorphism_census/instance_manifest_v4.yaml
    required_source_hashes:
      - protocol_inputs/automorphism_census/prime_stream_contract_v1.yaml
      - protocol_inputs/automorphism_census/instance_manifest_v4.yaml
    invocation_boundary: >-
      A future Executor must bind both the v4 family manifest and this prime
      stream contract in source_manifest.json before selecting a prime. A
      candidate selected by an unspecified library prime function is a
      pre-walk refusal.
  algorithm_contract:
    root_message: seed_decimal || 0x1f || field_bits_decimal || 0x1f || curve_family || 0x1f || prime_candidate
    rank_encoding: unsigned_64_bit_big_endian
    rank_message: root_digest_bytes || rank_bytes
    candidate_integer: >-
      Set the high bit and low odd bit of the unsigned big-endian rank digest,
      retaining exactly field_bits bits.
    prime_search: >-
      Search the candidate integer and successive integers for the least prime
      using exact deterministic trial division; reject a resulting prime whose
      bit length differs from field_bits.
    transcript: >-
      Serialize every rank, digest, candidate integer, selected prime or null,
      predicate, primality method, decision, and rejection reason in row/rank
      order and bind its canonical JSONL digest.
    duplicate_rule: >-
      A prime already accepted for the same row is a duplicate rejection and
      cannot be silently reused or relabeled.
  verifier_contract:
    independent_entrypoint: harness/run_ecdlp_endo_census_v2.py
    required_checks:
      - prime_stream_contract_path_and_hash_bound
      - root_and_rank_encoding_recomputed
      - candidate_integer_recomputed
      - exact_prime_search_recomputed
      - bit_length_and_family_predicates_recomputed
      - duplicate_candidates_recorded
      - transcript_digest_recomputed
      - cap_exhaustion_is_family_unavailable_refusal
      - no_cross_family_fallback
  controls_added:
    - id: C-PRIME-REPLAY
      kind: independent-prime-stream-replay
      expected: byte-identical candidate transcript and digest
    - id: C-PRIME-MUTATION
      kind: rank-family-input-mutation
      expected: any changed rank or family changes source and transcript digests
  falsification_conditions_added:
    - >-
      Two conforming implementations produce different transcripts for the same
      row; the stream contract is underspecified or implementation-invalid.
    - >-
      A probable-prime oracle, backend-specific next-prime function, or implicit
      bit-length correction is used; the candidate row is invalid.
    - >-
      A duplicate, wrong-bit-length, or family-predicate rejection is omitted
      or not charged; the coverage receipt is invalid.
    - >-
      A changed rank or family leaves the root/transcript digest unchanged; the
      source binding is defective.
  interpretation_gate:
    input_only: >-
      This repair makes prime selection reproducible. It does not establish
      special-curve availability, an automorphism speedup, exponent movement,
      or a cryptographic-scale conclusion.
  dispatch_gate:
    not_dispatchable: true
    required_before_approval:
      - independent review of v5 and this v6 amendment together
      - source-hash-bound prime-stream implementation and transcript fixtures
      - backend preflight passes without prohibited fallback
      - Coordinator decision explicitly admits or rejects the correction

