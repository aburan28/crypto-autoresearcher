protocol_amendment:
  experiment_id: EXP-ECDLP-51921d
  version_from: 6
  version_to: 7
  kind: exact_automorphism_certificate_superseding_amendment
  filed_at: '2026-08-09'
  filed_by: coordinator
  status: draft_pending_independent_review
  approved_by: null
  approved_by_decision: null
  affected_runs: []
  confirmatory_status: preserved
  supersedes:
    path: amendments/EXP-ECDLP-51921d-v6.yaml
    snapshot_commit: 3db24841772f8f2d95d5c9327461b3b2381da7a7
    treatment: immutable_prior_amendment_remains_unchanged
  scope_statement: >-
    This amendment freezes the exact prime-field automorphism certificate and
    event-level m_eff/stabilizer transcript required by the Arm-A v3 prediction
    repair. It changes no prime stream, family schedule, rho budget, control
    definition, cost normalization, hypothesis, or claim tier, and authorizes
    no run.
  defect: >-
    The v3 amendment requires an exact m_eff/stabilizer certificate schema, but
    the v4-v6 successor inputs do not define the canonical root choice, point
    encoding, map composition, curve identities, subgroup-preservation checks,
    event transcript, or the no-secret-oracle boundary. A future implementation
    could therefore report the same family and action labels with different
    maps, orbit sizes, or stabilizer summaries.
  successor_input_binding:
    canonical_path: protocol_inputs/automorphism_census/automorphism_certificate_contract_v1.yaml
    companion_paths:
      - protocol_inputs/automorphism_census/instance_manifest_v4.yaml
      - protocol_inputs/automorphism_census/prime_stream_contract_v1.yaml
    required_source_hashes:
      - protocol_inputs/automorphism_census/automorphism_certificate_contract_v1.yaml
      - protocol_inputs/automorphism_census/instance_manifest_v4.yaml
      - protocol_inputs/automorphism_census/prime_stream_contract_v1.yaml
    invocation_boundary: >-
      A future Executor must bind all three source paths and hashes before curve
      coefficients, points, or rho state are generated. An unspecified root,
      map, point encoding, composition table, or stabilizer calculation is a
      refusal before the full walk.
  certificate_contract:
    root_selection: >-
      Select the least integer nontrivial cube root for j=0 or the least
      integer square root of -1 for j=1728 in the fixed interval; no conjugate
      root may be substituted or relabeled.
    maps: >-
      Use the exact declared affine formulas for negation, j=0 order-3 phi,
      and j=1728 order-4 psi, with full action elements and composition table
      serialized in declared order.
    m_eff: >-
      For every nonidentity walk state, serialize all action images, the exact
      stabilizer set, action order, and m_eff = action_order / stabilizer_size;
      derive the summary only from the event-level table.
    no_oracle: >-
      The certificate and replay verifier may not call a secret scalar, solve a
      DLP, or use a post-solve collision to construct an action or stabilizer.
  verifier_contract:
    independent_entrypoint: harness/run_ecdlp_endo_census_v2.py
    required_checks:
      - all_three_source_paths_and_hashes_bound
      - canonical_point_encoding_recomputed
      - field_root_selection_recomputed
      - curve_identity_and_composition_table_recomputed
      - subgroup_preservation_recomputed
      - map_order_and_action_closure_recomputed
      - replay_fixture_recomputed_without_secret_oracle
      - event_images_stabilizers_and_m_eff_recomputed
      - transcript_and_frequency_digest_recomputed
      - omitted_map_or_comparison_cost_rejected
  controls_added:
    - id: C-AUT-REPLAY
      kind: independent-automorphism-certificate-replay
      expected: byte-identical certificate and event transcript
    - id: C-AUT-MUTATION
      kind: root-family-order-mutation
      expected: every changed root, family, or action order changes the binding or refuses
  falsification_conditions_added:
    - >-
      Two conforming implementations produce different map or stabilizer
      transcripts for the same source hashes; the certificate contract is
      underspecified or implementation-invalid.
    - >-
      A map passes by label but fails the exact curve identity, order,
      composition, subgroup, or replay check; the affected row is refused.
    - >-
      Any certificate uses a secret scalar, DLP oracle, post-solve collision,
      omitted image, omitted comparison, or unstated root; the receipt is
      invalid and no quotient measurement is admitted.
  interpretation_gate:
    input_only: >-
      This repair makes the action and m_eff certificate reproducible. It does
      not establish a speedup, a favorable special target, exponent movement,
      or a cryptographic-scale conclusion.
  dispatch_gate:
    not_dispatchable: true
    required_before_approval:
      - independent review of EXP-ECDLP-51921d-v6 and this v7 amendment together
      - source-hash-bound certificate implementation and replay fixtures
      - backend preflight passes without prohibited fallback
      - Coordinator decision explicitly admits or rejects the correction
