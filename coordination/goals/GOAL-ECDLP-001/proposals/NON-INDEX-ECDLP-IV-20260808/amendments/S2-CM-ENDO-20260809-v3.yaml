protocol_amendment:
  id: S2-CM-ENDO-20260809-v3
  kind: proof_search_map_superseding_amendment
  map_name: S2-CM-ENDO
  version_from: 2
  version_to: 3
  filed_at: '2026-08-09'
  filed_by: coordinator
  status: draft_pending_independent_review
  supersedes:
    path: proof_search_map/S2-CM-ENDO-20260809.yaml
    snapshot_commit: f199139ee7ebc942883c3aa6dea628fbfcde19fc
    treatment: immutable_prior_map_remains_unchanged
  scope_statement: >-
    This amendment repairs only the S2 null-design gate. It does not approve
    S2, change Arm-A or Arm-B, import a red-team observation as evidence, or
    authorize an experiment. The prior version remains the immutable baseline;
    this version is not dispatchable until independently reviewed and admitted
    by a new Coordinator decision.
  design_input_records:
    - path: experiments/EXP-ICINV-fcb497/red-team-report.md
      use: >-
        RT-1 and RT-2 are protocol-design objections indicating that a
        small-integer-only discriminator can be insufficient and that a
        curve-free Hasse-window null must be considered. No reported statistic
        is imported as S2 evidence.
    - path: knowledge/open-problems/KN-OPEN-2c095b.md
      use: >-
        Earlier matched-small-integer confound statement; retained as a
        secondary control requirement and not treated as the primary CM
        discriminator until the curve-free arm is specified.
  correction:
    field: method_ceiling.null_design
    prior_value: >-
      A matched small-integer null was the required discriminator for any
      curve-derived eigenvalue or kernel-field-order signal.
    corrected_value: >-
      Use a three-arm null suite: a curve-free Hasse-window null is primary, a
      same-modulus small-integer null is secondary, and a uniform-unit null is
      the reference calibration. A j/CM attribution is forbidden unless the
      primary curve-free arm is materialized and its result is separated from
      both secondary controls.
    reason: >-
      The committed red-team design audit identifies a missing curve-free
      object as the cheaper falsification control. The repair prevents a
      modular-order artifact from being promoted as CM structure, while
      preserving the prior small-integer question as a named control.
  null_suite:
    status: frozen_design_required_before_approval
    common:
      source_instance_keys: [p, source_trace, N_subgroup, candidate_id, seed]
      draw_count_per_instance: 3
      seed_derivation: sha256(canonical_source_keys || null_arm || draw_index)
      materialization_order: >-
        Serialize every null draw, rejection, derived observable, and refusal
        before any order statistic, threshold, family pooling, or solve outcome
        is inspected.
      exact_arithmetic: true
      post_observation_changes: forbidden
    primary_curve_free_hasse_window:
      label: curve-free-Hasse-window
      elliptic_curve_constructed: false
      support: >-
        Draw a signed lambda_null from the predeclared nonzero Hasse window
        2 <= abs(lambda_null) <= floor(sqrt(p)); retain sign and magnitude in
        the receipt. When the candidate's public derivation supplies an epsilon
        in { -1, 0, 1 }, derive d_null = p - lambda_null^2 -
        epsilon*lambda_null using that same public formula. Otherwise emit
        not_applicable rather than inventing a degree or modulus.
      acceptance: >-
        Require positive d_null and every downstream arithmetic predicate used
        by the curve-derived observable; record all rejected draws. No curve,
        endomorphism map, DLP oracle, or target solve may be used.
      interpretation: >-
        If the curve-derived signal is reproduced by this arm, the CM/j-only
        attribution is falsified on the tested scope. If this arm is
        unavailable, the S2 attribution gate remains unresolved.
    secondary_small_integer_same_modulus:
      label: small-integer-same-modulus
      elliptic_curve_constructed: false
      support: >-
        For the same declared d and matched bound B, draw a signed integer a
        with 2 <= abs(a) <= B and gcd(a,d)=1 through the identical order and
        cost path. B and the signed-magnitude rule must be frozen per stratum.
      interpretation: >-
        This arm diagnoses modular-order and small-integer effects. It cannot
        by itself establish a CM-specific signal.
    reference_uniform_unit_same_modulus:
      label: uniform-unit-reference
      elliptic_curve_constructed: false
      support: >-
        Draw the declared reference uniformly from the accepted units of the
        same modulus through the identical order and cost path; preserve the
        existing calibration definition.
      interpretation: >-
        This arm is a calibration reference only. A difference from it is not
        a CM conclusion without the primary curve-free comparison.
    stratification:
      required_keys: [p_bits, source_trace, candidate_stratum]
      pooling: >-
        No cross-trace or cross-stratum pooling is allowed before the declared
        per-stratum statistic and coverage calculation. A sparse stratum emits
        a refusal or inconclusive status rather than being silently merged.
  interpretation_gate:
    primary_comparison: curve-derived_vs_curve-free-Hasse-window
    secondary_comparisons:
      - curve-derived_vs_small-integer-same-modulus
      - curve-derived_vs_uniform-unit-reference
    outcomes:
      curve_free_reproduces: >-
        Record an artifact/null explanation for the tested scope; do not admit
        CM or j-only steering.
      curve_free_differs_and_controls_valid: >-
        Retain as a bounded observation requiring independent review; no
        support or exponent claim follows from this amendment.
      curve_free_unavailable: >-
        Record unresolved identifiability and refuse S2 admission.
      small_integer_only_differs: >-
        Treat as modular-order evidence, not CM evidence.
  proof_obligations_added:
    - claim: curve-free null has identical public observable transform
      responsibility: identifiability
    - claim: null draws and all rejections are serialized before scoring
      responsibility: preregistration
    - claim: trace/stratum sparsity is reported without hidden pooling
      responsibility: statistics
    - claim: no CM attribution is made from the secondary small-integer arm
      responsibility: scope
  falsification_conditions_added:
    - >-
      A curve-free Hasse-window object reproduces the candidate signal under
      the frozen statistic; j/CM steering is falsified on that scope.
    - >-
      The curve-free transform cannot be defined for an admitted candidate;
      that candidate is refused, not counted as a positive or negative.
    - >-
      A post-observation null draw, pooling choice, or threshold change occurs;
      the affected comparison is invalid.
  dispatch_gate:
    not_dispatchable: true
    required_before_approval:
      - independent review of this amendment and the v2 map together
      - deterministic null sampler and exact observable transform frozen
      - source-hash-bound implementation and fixture suite
      - backend preflight passes without prohibited fallback
      - Coordinator decision explicitly admits or rejects this correction
