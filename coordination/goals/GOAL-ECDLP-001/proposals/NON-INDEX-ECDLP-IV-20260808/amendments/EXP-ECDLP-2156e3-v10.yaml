protocol_amendment:
  experiment_id: EXP-ECDLP-2156e3
  version_from: 9
  version_to: 10
  kind: exact_isogeny_transfer_certificate_superseding_amendment
  filed_at: '2026-08-09'
  filed_by: coordinator
  status: draft_pending_independent_review
  approved_by: null
  approved_by_decision: null
  affected_runs: []
  confirmatory_status: preserved
  supersedes:
    path: amendments/EXP-ECDLP-2156e3-v9.yaml
    snapshot_commit: 7fc8a83c0
    treatment: immutable_prior_amendment_remains_unchanged
  scope_statement: >-
    This amendment freezes the independent transfer-certificate boundary for
    Arm B. It changes no candidate window, direct-policy matrix, normalization,
    degree list, hypothesis, or claim tier, and authorizes no run. It makes the
    previously planned verifier contract concrete before any target-side rho.
  defect: >-
    The v3-v9 lineage names map, kernel, subgroup, twist, inverse/dual, and
    scalar-replay checks, but it does not provide one exact certificate schema
    that binds full kernel points, target coefficients, map equations, dual
    composition, source scalar fixture boundaries, trace/order recomputation,
    and complete charged vectors. The existing verify_transport helper reuses
    the forward path, infers degree from kernel-list length, and accepts a
    known-answer scalar; it is not an independent verifier.
  successor_input_binding:
    canonical_path: protocol_inputs/isogeny_transfer/transfer_certificate_contract_v1.yaml
    companion_paths:
      - protocol_inputs/isogeny_transfer/candidate_manifest_v3.yaml
      - protocol_inputs/isogeny_transfer/control_manifest_v3.yaml
      - protocol_inputs/automorphism_census/instance_manifest_v4.yaml
      - protocol_inputs/automorphism_census/prime_stream_contract_v1.yaml
    required_source_hashes:
      - protocol_inputs/isogeny_transfer/transfer_certificate_contract_v1.yaml
      - protocol_inputs/isogeny_transfer/candidate_manifest_v3.yaml
      - protocol_inputs/isogeny_transfer/control_manifest_v3.yaml
      - protocol_inputs/automorphism_census/instance_manifest_v4.yaml
      - protocol_inputs/automorphism_census/prime_stream_contract_v1.yaml
    invocation_boundary: >-
      A future Executor must bind all five source paths and hashes before the
      candidate window, kernel construction, target construction, or target
      solve. A verifier that imports the producer's forward map or infers the
      degree from the kernel list is a pre-target refusal.
  certificate_contract:
    reachability: >-
      Independently recompute source/target field, trace, order, degree, and
      gcd(N_subgroup, ell) before any transfer cost is admitted. Trace mismatch
      is an unreachable refusal, never a negative result.
    kernel: >-
      Serialize the complete full-point kernel, identity, generator, exact
      order, closure, negation pairs, and kernel digest. X-coordinate-only,
      duplicate, incomplete, or degree-inferred kernels are invalid.
    map: >-
      For odd prime ell in {3,5,7,11}, independently recompute the Velu pair
      representatives, target coefficients, forward images, target membership,
      and source/target digests. Even ell=2 or 4 remains an explicit unsupported
      refusal until a separate formula is approved.
    dual_and_scalar: >-
      Independently recompute a dual/inverse map and require composition equal
      to [ell] on both P and Q images. The known-answer scalar is confined to a
      verifier fixture and never enters candidate selection or solver code.
    cost: >-
      Charge candidate, class, kernel, map, dual, subgroup, scalar-replay,
      serialization, memory, and wall-time components in raw and normalized
      one-shot/amortized vectors; refusal rows cannot be zero-filled.
  verifier_contract:
    independent_verifier: harness/verify_isogeny_transfer_v2.py
    required_checks:
      - all_companion_paths_and_hashes_bound
      - trace_and_order_recomputed_independently
      - degree_and_gcd_recomputed
      - complete_full_point_kernel_and_closure_recomputed
      - target_coefficients_and_forward_map_recomputed_without_producer_import
      - target_membership_and_subgroup_order_recomputed
      - dual_or_inverse_map_recomputed_independently
      - dual_composition_equals_ell_on_P_and_Q
      - scalar_fixture_boundary_and_source_replay_checked
      - twist_and_orientation_certificate_checked
      - raw_and_normalized_cost_vectors_checked
      - refusal_rows_not_zero_filled_or_reclassified
  controls_added:
    - id: C-ISO-REPLAY
      kind: independent-transfer-certificate-replay
      expected: byte-identical transfer transcript and digest
    - id: C-ISO-MUTATION
      kind: kernel-point-degree-trace-dual-mutation
      expected: every mutation changes the binding or produces refusal
  falsification_conditions_added:
    - >-
      A same-trace candidate is counted without an independently recomputed
      complete kernel, map, target membership, subgroup, dual, and scalar
      replay certificate; the row is invalid, not negative evidence.
    - >-
      A verifier imports producer target coefficients, forward images, or
      degree inference; the independent-certificate claim is invalid.
    - >-
      A dual replay fails, P/Q intersects the kernel, or source scalar replay
      fails; the row is refused before target-side rho.
    - >-
      A raw cost component is omitted or a refused cell is zero-filled; no
      transfer comparison is admitted.
    - >-
      An even degree is routed through the odd-degree formula; the affected
      row is unsupported/refused and no result is interpreted.
  interpretation_gate:
    input_only: >-
      This repair makes Arm-B transfer certificates and costs independently
      reproducible. It does not establish target availability, a transfer
      advantage, exponent movement, or a cryptographic-scale conclusion.
  dispatch_gate:
    not_dispatchable: true
    required_before_approval:
      - independent review of EXP-ECDLP-2156e3-v9 and this v10 amendment together
      - source-hash-bound independent verifier and ten-case fixture suite
      - dedicated even-degree refusal fixtures
      - backend preflight passes without prohibited fallback
      - Coordinator decision explicitly admits or rejects the correction
