protocol_amendment:
  experiment_id: EXP-ECDLP-51921d
  version_from: 2
  version_to: 3
  kind: quantitative_prediction_and_normalization_superseding_amendment
  filed_at: '2026-08-09'
  filed_by: coordinator
  status: draft_pending_independent_review
  approved_by: null
  approved_by_decision: null
  affected_runs: []
  confirmatory_status: preserved
  supersedes:
    path: amendments/EXP-ECDLP-51921d-v2.yaml
    snapshot_commit: f199139ee7ebc942883c3aa6dea628fbfcde19fc
    treatment: immutable_prior_amendment_remains_unchanged
  scope_statement: >-
    This amendment repairs only the stale Arm-A normalization symbol and the
    missing explicit effective-orbit prediction. It does not change the curve
    schedule, modes, controls, budget, hypothesis, or claim tier; it does not
    authorize a run. In this Arm-A record, N_subgroup is the only DLP-size
    denominator and ell is reserved for Arm-B isogeny degree. The prediction is
    a conditional ideal group-operation ratio, not a claim about total charged
    wall time or an exponent improvement.
  design_input_records:
    - path: amendments/EXP-ECDLP-51921d-v2.yaml
      use: >-
        Immutable v2 cost and mode repair. The new amendment preserves its
        source-hash, control, and artifact requirements while superseding the
        stale inherited normalization/prediction fields.
    - path: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-IV-20260808/EXP-ECDLP-51921d.yaml
      use: >-
        Immutable v1 source of the stale sqrt(ell) metric and sqrt(ell/m)
        prediction. No v1 result is imported as evidence.
    - path: knowledge/techniques/KN-TECH-018.md
      use: >-
        Established design reference for the conditional sqrt(|Aut|) rho
        discount. It supplies no Arm-A measurement and no cryptographic-scale
        conclusion.
  correction:
    stale_fields:
      - path: metrics.primary[0]
        prior_value: normalized charged rho work divided by sqrt(ell)
        problem: >-
          ell is the reserved Arm-B isogeny-degree symbol and is not the
          measured subgroup order for an Arm-A ECDLP walk.
      - path: preregistered_prediction.formula
        prior_value: idealized quotient baseline proportional to sqrt(ell / m)
        problem: >-
          The formula is dimensionally ambiguous for Arm A and does not define
          the effective orbit size or its stabilizer correction.
    corrected_fields:
      primary_normalization: sqrt(N_subgroup)
      baseline_mode: ordinary
      ideal_comparison_quantity: >-
        For every valid mode receipt, compare the raw group-operation collision
        work G_mode after division by sqrt(N_subgroup) with the matched
        ordinary receipt from the same source instance, seed, trial, retry
        budget, and success definition.
      arm_a_symbol_binding: >-
        N_subgroup is the sole DLP-size symbol in Arm A. The symbol ell is not
        used by this amendment and remains reserved for Arm-B isogeny degree.
  effective_orbit_prediction:
    status: frozen_design_required_before_approval
    baseline: ordinary
    certificate_definition:
      admitted_action_size: >-
        Let A be the verified automorphism action admitted for the mode on the
        measured prime-order subgroup and let Stab_A(R) be the stabilizer of
        the current non-identity walk state R under that action. Record
        m_eff(R) = |A| / |Stab_A(R)| from the certificate, not from an observed
        collision or a post-solve choice.
      trial_summary: >-
        Preserve m_eff(R) at every canonicalization event and report the
        predeclared trial summary (event count, minimum, maximum, and exact
        frequency table). No unannounced average or pooled summary may replace
        the event-level receipt.
      negation_special_case: >-
        On a certified odd prime-order subgroup, non-identity states have
        m_eff=2 for the negation action. If the certificate cannot establish
        that condition, the affected row is refusal/inconclusive rather than a
        forced m_eff=2 calibration.
    ideal_prediction:
      quantity: group_operation_ratio_to_ordinary
      formula: R_ideal(mode) = 1 / sqrt(m_eff)
      comparison: >-
        R_ideal is a conditional birthday-model reference for group-operation
        collision work only. It excludes canonicalization, automorphism-map,
        fruitless-cycle, retry, certificate, serialization, memory, and wall
        time overhead, all of which remain charged in the full vector.
      full_mode_rule: >-
        For a full action with varying stabilizer, report the exact receipt-level
        prediction distribution induced by m_eff and compare it with the
        observed group-operation ratio. Do not substitute |Aut(E)| for the
        measured effective action when stabilizers are nontrivial.
    charged_comparison:
      required_vectors:
        - raw_group_operation_vector
        - normalized_group_operation_vector
        - raw_field_operation_vector
        - canonicalization_comparisons
        - automorphism_evaluations
        - fruitless_collisions
        - deterministic_restarts
        - certificate_replay_ops
        - serialized_bytes
        - peak_memory_bytes
        - wall_time_ms
      scalar_aggregate: >-
        Forbidden without a separately approved operation-price table. A mode
        may match R_ideal in group operations while losing on fully charged
        wall time or memory; those are separate outcomes, not a hidden score.
      denominator_binding: >-
        Every raw and normalized vector row carries the exact N_subgroup and
        source-instance digest. A row with a missing or changed denominator is
        invalid.
  quantitative_falsification:
    required_comparisons:
      - ordinary_vs_negation_on_same_instance
      - ordinary_vs_full_on_same_instance
      - full_vs_C-RAND
      - full_vs_C-RELABEL
      - ideal_ratio_vs_observed_group_operation_ratio
    invalidation_conditions:
      - >-
        Any successor artifact still uses sqrt(ell) as the Arm-A DLP
        normalization denominator.
      - >-
        A prediction uses ell, an unverified automorphism order, or a pooled
        orbit-size statistic instead of the receipt-bound m_eff.
      - >-
        A wall-time or scalar cost advantage is presented as confirmation of
        R_ideal without the full vector and its overhead components.
      - >-
        Ordinary and quotient rows do not share the exact source instance,
        subgroup, seed, trial, retry, success, and replay bindings.
    interpretation:
      ideal_ratio_matches: >-
        A bounded toy-scale consistency observation for the group-operation
        component only; no asymptotic or cryptographic-scale claim follows.
      ideal_ratio_fails: >-
        A protocol/implementation discrepancy or a weakened finite-scope
        prediction, to be reviewed with the receipt-level stabilizer table; it
        is not automatically evidence against all endomorphism methods.
      full_vector_overhead_dominates: >-
        The charged quotient does not improve total cost on the tested scope,
        even if the ideal group-operation ratio is observed.
  artifact_requirements_added:
    comparison_table_fields:
      - normalization_denominator
      - baseline_mode
      - m_eff_frequency_table_digest
      - ideal_group_operation_ratio
      - observed_group_operation_ratio
      - full_vector_overhead_status
    validation_report_fields:
      - stale_symbol_scan
      - denominator_binding_check
      - per_event_stabilizer_check
      - ideal_ratio_comparison
      - finite_scope_and_no_exponent_claim
  dispatch_gate:
    not_dispatchable: true
    required_before_approval:
      - independent review of EXP-ECDLP-51921d-v2 and this v3 amendment together
      - exact m_eff/stabilizer certificate schema frozen
      - source-hash-bound implementation and fixture suite
      - backend preflight passes without prohibited fallback
      - Coordinator decision explicitly admits or rejects the repair
