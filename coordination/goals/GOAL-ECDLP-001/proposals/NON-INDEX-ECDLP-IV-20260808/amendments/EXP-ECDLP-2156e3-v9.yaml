protocol_amendment:
  experiment_id: EXP-ECDLP-2156e3
  version_from: 8
  version_to: 9
  kind: frozen_successor_input_binding_superseding_amendment
  filed_at: '2026-08-09'
  filed_by: coordinator
  status: draft_pending_independent_review
  approved_by: null
  approved_by_decision: null
  affected_runs: []
  confirmatory_status: preserved
  supersedes:
    path: amendments/EXP-ECDLP-2156e3-v8.yaml
    snapshot_commit: a433f4a0508c003deb5cfe3bd4bd5aa1c2db7cab
    treatment: immutable_prior_amendment_remains_unchanged
  scope_statement: >-
    This amendment binds future Arm-B execution to versioned successor input
    overlays because the original candidate and control manifests are already
    named by completed archives and cannot be edited. The candidate overlay
    makes the v5/v6 pre-action key and no-refill window executable; the control
    overlay makes the v7 ordinary/negation/full direct-policy matrix executable.
    This is a protocol-input repair only and does not approve Arm B or assert a
    mathematical result.
  immutable_input_defects:
    candidate_manifest: >-
      The archived candidate policy still says candidate_order includes
      kernel_digest and map_digest and still describes the cap as
      first_12_constructible_per_degree. Those fields can require post-window
      construction and allow refusals to be refilled by later candidates.
    control_manifest: >-
      The archived control policy labels C-DIRECT with solver_policy Arm-A-full
      despite map: none. This conflicts with the v7 primary ordinary baseline
      and leaves direct negation/full cells implicit.
  successor_input_binding:
    candidate_policy:
      canonical_path: protocol_inputs/isogeny_transfer/candidate_manifest_v3.yaml
      superseded_path: protocol_inputs/isogeny_transfer/candidate_manifest.yaml
      required_fields:
        - pre_action_candidate_key
        - candidate_order_excludes_kernel_and_map_digests
        - fixed_window_before_classification
        - no_dynamic_refill
        - truncation_rows
        - post_window_digest_fields
    control_policy:
      canonical_path: protocol_inputs/isogeny_transfer/control_manifest_v3.yaml
      superseded_path: protocol_inputs/isogeny_transfer/control_manifest.yaml
      required_fields:
        - C-DIRECT-ordinary
        - C-DIRECT-NEG
        - C-DIRECT-FULL
        - explicit_baseline_policy_id
        - explicit_target_policy_id
        - no_cross_policy_substitution
        - no_cross_policy_pooling
    invocation_boundary: >-
      A future Executor command must pass both canonical successor paths and
      record their SHA-256 digests in source_manifest.json before candidate
      enumeration. Passing either archived path alone is a pre-target refusal.
  verifier_contract:
    independent_verifier: harness/verify_isogeny_transfer_v2.py
    required_checks:
      - successor_candidate_policy_path_and_hash_bound
      - successor_control_policy_path_and_hash_bound
      - candidate_order_excludes_kernel_and_map_digests
      - first_12_candidate_keys_per_source_and_degree_without_refill
      - C-DIRECT_recomputed_as_ordinary
      - C-DIRECT-NEG_and_C-DIRECT-FULL_separate
      - baseline_and_target_policy_ids_present
      - refused_cells_not_substituted_or_zero_filled
      - no_target_selection_after_observation
  controls_added:
    - id: C-INPUT-CANDIDATE-ORDER
      kind: stale-input-ordering-mutation
      construction: >-
        Run conformance parsing once with the archived candidate policy and
        once with the successor overlay while holding the source, degree, seed,
        and target labels fixed.
      expected: >-
        The archived policy is refused for post-window ordering; the successor
        stream is ordered only by pre-action fields and has no refill.
    - id: C-INPUT-DIRECT-POLICY
      kind: stale-direct-policy-mutation
      construction: >-
        Parse a direct row under the archived Arm-A-full label and under the
        successor ordinary/negation/full matrix.
      expected: >-
        The archived label is refused as inconsistent with map:none; successor
        cells retain explicit policy IDs and no substitution is allowed.
  falsification_conditions_added:
    - >-
      A future source manifest hashes an archived input path instead of both
      successor overlays; pre-target dispatch is invalid.
    - >-
      Candidate ordering reads kernel_digest or map_digest, or a refusal causes
      a later candidate to refill the fixed window; candidate inventory is
      invalid.
    - >-
      C-DIRECT is labeled full while map:none, or direct negation/full refusal
      is replaced by ordinary output; comparison cells are invalid.
    - >-
      A target policy or baseline policy is chosen after target solve outcome;
      no transfer interpretation is admitted.
  interpretation_gate:
    input_only: >-
      The successor overlays make the frozen protocol internally executable;
      they do not establish target availability, a quotient gain, exponent
      movement, or any cryptographic-scale conclusion.
    scope: >-
      Any future observation remains limited to the declared source rows,
      subgroup certificates, degree budget, policy cells, and target counts.
  dispatch_gate:
    not_dispatchable: true
    required_before_approval:
      - independent review of v8 and v9 together
      - source-hash-bound successor overlays and invocation update
      - stale-input conformance fixtures
      - backend preflight passes without prohibited fallback
      - Coordinator decision explicitly admits or rejects the correction

