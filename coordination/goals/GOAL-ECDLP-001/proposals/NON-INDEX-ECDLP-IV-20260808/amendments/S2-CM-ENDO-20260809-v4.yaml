protocol_amendment:
  id: S2-CM-ENDO-20260809-v4
  kind: exact_nonunit_cm_endomorphism_certificate_superseding_amendment
  map_name: S2-CM-ENDO
  version_from: 3
  version_to: 4
  filed_at: '2026-08-09'
  filed_by: coordinator
  status: draft_pending_independent_review
  supersedes:
    path: amendments/S2-CM-ENDO-20260809-v3.yaml
    snapshot_commit: e86e1cfb34fd2ed8612ee344a6f2f16eab2bf42e
    treatment: immutable_prior_amendment_remains_unchanged
  scope_statement: >-
    This amendment freezes the exact S2 non-unit-CM endomorphism certificate
    that was missing from the v2 map and v3 null correction.  It does not
    approve S2, change Arm-A or Arm-B, import historical EXP-ENDO-001 output as
    evidence, or authorize an experiment.  All prior records remain immutable.
  defect_repaired: >-
    The v2/v3 lineage required public construction, field and subgroup checks,
    eigenvalue separation, matched nulls, and charged costs, but did not bind
    one exact map/dual/kernel/CM-polynomial/eigenvalue/replay schema.  A j or CM
    label could therefore be mistaken for a usable endomorphism certificate.
  source_binding:
    - path: proof_search_map/S2-CM-ENDO-20260809.yaml
      sha256: 81c107405f539ada443a9ffb4a227282b26cf8ac1f940635d3b184a3294601c6
    - path: amendments/S2-CM-ENDO-20260809-v3.yaml
      sha256: 13fd408ddb453e2eb3f250bae9531e2da65a081e11a129c4c0f51c237e018287
    - path: protocol_inputs/implementation_boundary.yaml
      sha256: 3c8a4bfa5207c4ed3656f2f33b8dada233e407c384d0522e7ca3fcb38e808bb9
    - path: protocol_inputs/curve_selection_scope.yaml
      sha256: aace19255cb13bf4e87b25a694276b0d07a9270013dd7f5f0a1ff2ed1cadb736
    - path: protocol_inputs/automorphism_census/cost_schema.yaml
      sha256: e6ca9da13bb5d501358fc8c6eaa81b7363135793f9ec62b837614d8f22f99ea0
    - path: protocol_inputs/cm_endomorphism/endomorphism_certificate_contract_v1.yaml
      bind: this_amendment_contract
  exact_contract:
    path: protocol_inputs/cm_endomorphism/endomorphism_certificate_contract_v1.yaml
    schema: crypto.autoresearch.ecdlp.cm_endomorphism_certificate.v1
    source_hash_bound: true
    finite_discriminants: [-7, -8, -11, -19, -43, -67, -163]
    field_scope: F_p_only
    supported_degrees: [2, 3, 5, 7, 11]
    extension_field_kernel_rows: refusal
    unit_special_rows: refusal
    no_degree_inference: true
    no_j_only_admission: true
    full_kernel_and_dual_required: true
    public_eigenvalue_derivation_required: true
    known_answer_scalar_fixture_only: true
    raw_before_normalized_costs: true
    target_counts: [1, 8, 64]
  proof_search_map_binding:
    map_path: proof_search_map/S2-CM-ENDO-20260809.yaml
    required_audits:
      - exact_baseline_reproduction
      - observation_collision_search
      - quantifier_order_statement
      - method_ceiling_with_nearby_object
    dominated_by: pending_frontier_audit
    sota_delta: no_measurement
  controls:
    primary_curve_free_null: C-CM-NULL-HASSE
    secondary_small_integer_null: C-CM-NULL-INTEGER
    calibration: C-CM-NULL-UNIT
    matched_controls: [C-CM-BASELINE, C-CM-NEGATION, C-CM-ORDINARY-NEIGHBOR]
    mutation_controls: [C-CM-RELABEL, C-CM-MAP-MUTATION]
  falsification_conditions:
    - >-
      A curve-free Hasse-window null reproduces the candidate observable; any
      CM/j-only attribution is falsified on that tested scope.
    - >-
      A same-observable collision has different map admission or usability;
      j-only steering is refused unless the additional public certificate is
      included in the input key.
    - >-
      The map, dual, kernel, CM polynomial, or eigenvalue requires k, a DLP
      oracle, or target-side outcome selection; the row is circular and refuses.
    - >-
      The complete charged action does not distinguish the admitted CM stratum
      from the same-order ordinary neighbor; no structure-specific speedup is
      admitted.
    - >-
      Any exponent decrease lacks a separately reviewed search-state invariant
      and success-probability argument; the claim is outside this contract.
  dispatch_gate:
    not_dispatchable: true
    required_before_approval:
      - independent review of the v2 map, v3 null correction, and v4 contract
      - all four proof-search audits have explicit outcomes
      - source-hash-bound implementation and ten-case fixture suite exist
      - backend preflight passes without prohibited fallback
      - Coordinator decision explicitly admits or rejects the successor
  claim_boundary: >-
    This is a certificate/provenance repair only.  It creates no run receipt,
    evidence record, hypothesis transition, speedup, exponent claim, or ECDLP
    conclusion.  The prior v3 correction and all historical EXP-ENDO-001
    artifacts remain immutable and are not silently reconciled here.
