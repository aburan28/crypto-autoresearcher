hypothesis:
  id: H-ECDLP-68bb5a
  question_id: RQ-ECDLP-165d4b
  statement: >-
    Some ordinary prime-field curves have a bounded-degree F_p-rational isogeny
    to an isogenous target whose verified automorphism or endomorphism quotient
    yields a lower end-to-end charged ECDLP cost after forward, inverse,
    construction, and failed-path costs are included.
  mechanism: >-
    Move the public DLP instance through a short invertible isogeny to a target
    with a stronger quotient policy, solve there, and pull the scalar solution
    back through the verified subgroup map.
  assumptions:
    - The isogeny degree is coprime to the measured subgroup order.
    - The kernel intersection and inverse-on-subgroup map are explicitly checked.
    - A target-side quotient advantage is real under the Arm-A controls.
  proof_search_map:
    bottleneck: >-
      Establish whether an isogeny-class move can change the usable quotient
      structure enough to beat the charged baseline after all transfer costs.
    baseline_embedding:
      parameter_slice: >-
        Same-order ordinary prime-field curves with identity and random-target
        controls.
      reproduction_check: >-
        Reproduce Arm-A baseline, negation, and full-quotient results before any
        target is selected for transfer.
    observation_collision:
      observable: end-to-end solve cost and recovered scalar certificate
      distinct_preimage_search: >-
        Compare real isogeny maps against same-degree random maps and non-special
        isogeny neighbors with identical serialization and degree budgets.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: low-degree isogeny to an endomorphism-rich target
        predicted_gain: charged constant-factor gain if the map is cheap enough
    quantifier_order: >-
      For every selected source curve, enumerate candidates under the frozen
      degree budget before seeing solve outcomes; then run each target policy and
      both null controls. A family claim requires held-out source curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        A bounded end-to-end target-transfer advantage, or an explicit transfer
        cost obstruction, in the tested ordinary prime-field scope.
      nearby_object_control: >-
        Same-degree random map, random non-special isogeny neighbor, and direct
        source-curve rho baseline.
    proof_obligations:
      - claim: subgroup map is invertible and certificate-preserving
        responsibility: correctness
      - claim: candidate generation is frozen and not target-selected after outcomes
        responsibility: interface
      - claim: transfer and target search cost is fully charged
        responsibility: runtime
      - claim: scope does not import extension-field descent
        responsibility: scope
  rerandomization: null
  asymptotic_claim:
    problem: prime-order ECDLP on E(F_p)
    prior_best: ell^(1/2) generic Pollard-rho operations
    time_exponent: 1/2 unless an independently replicated slope change is observed
    memory_exponent: 0
    hidden_cofactor: map construction, serialization, inverse map, retries, and target precomputation
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-68bb5a-01
      formal_statement: >-
        A bounded-degree isogeny candidate selected without observing solve
        outcomes has a target quotient policy whose measured cost is comparable
        to its declared structural certificate.
      random_model_justification: >-
        Same-degree random-map and non-special-neighbor controls estimate the
        null distribution of transfer overhead and accidental quotient gains.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-2156e3
      falsification_condition: >-
        Every target-side gain vanishes after map construction and inverse costs,
        or the apparent gain is reproduced by the same-degree null map.
  structural_ingredients:
    - description: explicit low-degree F_p-rational isogeny and subgroup transfer
      citation: >-
        Standard isogeny arithmetic; no new theorem is claimed by this design.
      role: representation_reduction
  reduction_chain:
    core_problem: prime-order ECDLP on E(F_p)
    corollaries: []
  predictions:
    - metric: end-to-end normalized solve cost
      direction: lower
      minimum_effect: >-
        A replicated reduction relative to direct rho and same-degree null maps,
        with a separate one-shot versus amortized-many-target report.
    - metric: transfer failure rate
      direction: lower
      minimum_effect: zero invalid or non-invertible transfers among admitted runs
  test_boundary:
    instances:
      - Arm-A-admitted ordinary prime-field source curves
      - bounded-degree F_p-rational isogeny neighbors
      - same-order random and non-special target controls
    parameters:
      degree_budget: [2, 3, 4, 5, 7, 11]
      seeds: 8
      amortization_targets: [1, 8, 64]
      subgroup_checks: [prime_order, kernel_intersection, inverse_map, twist, anomalous, embedding_degree]
    implementation: >-
      Reuse the frozen curve certificates and Arm-A rho harness; add explicit
      map construction, serialization, forward/inverse transfer, and target
      quotient receipts.
    budget:
      wall_clock_seconds: 18000
      memory_gb: 12
      maximum_runs: 12
  falsification_conditions:
    - Any admitted map is non-invertible on the subgroup or fails certificate replay.
    - Transfer plus target solve cost is not lower than the direct baseline.
    - Same-degree null maps reproduce the signal.
    - Any advantage depends on uncharged target selection or graph preprocessing.
  interpretation_limits:
    - A null result closes only the declared degree budget and candidate families.
    - A constant-factor result is not an exponent improvement.
    - An apparent exponent change requires a new protocol amendment and stronger review.
  status: proposed
  proposed_by: coordinator
