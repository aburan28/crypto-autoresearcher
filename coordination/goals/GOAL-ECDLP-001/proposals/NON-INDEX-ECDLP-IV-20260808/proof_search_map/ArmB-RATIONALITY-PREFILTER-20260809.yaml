proof_search_map:
  map_name: ArmB-RATIONALITY-PREFILTER
  version: 1
  filed_at: '2026-08-09'
  filed_by: coordinator
  status: draft_gate_only
  proposal_scope: >-
    This map audits the necessary characteristic-congruence predicates used by
    the Arm-B v4 special-action inventory prefilter. It is a proof and protocol
    audit, not an experiment specification, run receipt, evidence record, or
    claim that any special target is easier to solve. It must be reviewed and
    reconciled before implementation or expensive target search.
  parent_amendment:
    path: amendments/EXP-ECDLP-2156e3-v4.yaml
    experiment_id: EXP-ECDLP-2156e3
    version: 4
    role: >-
      The amendment supplies the executable refusal and cost boundary; this
      map supplies the proof obligations for treating the congruences as
      necessary filters only.
  claim_boundary: >-
    For p>3, the intended order-3 unit action on a j=0 target requires a
    nontrivial cube root of unity in F_p, and the intended order-4 unit action
    on a j=1728 target requires a fourth root of unity in F_p. The converse is
    deliberately not claimed: passing a congruence does not construct a map,
    prove its field of definition on the chosen twist, prove subgroup action,
    prove same-isogeny-class reachability, or improve ECDLP cost.
  source_records:
    - path: amendments/EXP-ECDLP-2156e3-v4.yaml
      use: frozen prefilter, refusal, and cost contract
    - path: amendments/EXP-ECDLP-2156e3-v3.yaml
      use: frozen same-field/same-trace reachability and transfer-certificate gate
    - path: protocol_inputs/isogeny_transfer/candidate_manifest.yaml
      use: prior candidate enumeration and target-stratum boundary
    - path: ledger/hypotheses/H-ENDO-001.yaml
      use: baseline distinction between unit automorphisms and non-unit CM actions
    - path: knowledge/techniques/KN-TECH-018.md
      use: prior constant-factor automorphism quotient context, not measurement
  audits:
    exact_baseline_reproduction:
      status: pending
      object: >-
        Over primes p>3, reproduce the two finite-field predicates without a
        curve or DLP oracle: x^2+x+1 has a root in F_p iff p mod 3 = 1, and
        x^2+1 has a root in F_p iff p mod 4 = 1. Separately verify that p=2,3
        are routed to the explicit unsupported-characteristic refusal.
      required_artifacts:
        - exact_prime_list_and_seed
        - polynomial_and_root_test_command
        - serialized_predicate_table
        - independent_recomputation_digest
      pass_condition: >-
        Both equivalences and the small-characteristic refusal agree under
        exact arithmetic; this only validates the arithmetic prefilter.
      fail_condition: >-
        Any disagreement invalidates the amendment classification and blocks
        target inventory until the characteristic boundary is repaired.
    observation_collision:
      status: pending
      observable: >-
        Reduced target-selection observable (p, target_j, source_trace,
        target_trace, target_curve_digest, and congruence decision), with the
        exact map certificate intentionally omitted from the reduced tuple.
      search: >-
        Construct distinct same-field, same-trace j=0 or j=1728 target rows
        whose congruence decision agrees but whose exact F_p-defined map order,
        twist/orientation, subgroup action, or certificate decision differs.
        Preserve every pair and its full certificate fields.
      interpretation: >-
        A collision demonstrates that the congruence is not an acceptance
        certificate and makes the omitted certificate field mandatory. It is
        not evidence for or against a special-target speedup.
      pass_condition: >-
        Any surviving collision is explicitly represented in the protocol and
        forces exact certificate verification after the prefilter.
      fail_condition: >-
        Treating a congruence-only label as a complete action certificate is a
        protocol failure, not a negative mathematical result.
    quantifier_order:
      status: pending
      statement: >-
        For every prime p>3 and every declared j=0 (respectively j=1728)
        target, if an F_p-defined automorphism of the intended non-negation
        order exists, then p mod 3=1 (respectively p mod 4=1). The predicate
        is evaluated before target construction and before any solve outcome.
        The converse is not quantified: when the predicate passes, existence,
        order, subgroup action, and transfer reachability remain separate
        obligations.
      forbidden_reordering:
        - select target after a successful target-side solve
        - infer a map from j alone
        - infer same-isogeny-class membership from congruence
        - replace an exact certificate with the predicate
      pass_condition: >-
        Every implementation and review artifact preserves the one-way
        implication and pre-solve evaluation order.
    method_ceiling:
      status: pending
      strongest_certifiable_claim: >-
        The prefilter can reduce downstream target-inventory or construction
        work for the declared full-action search. By itself it changes neither
        Pollard-rho state-space exponent nor total charged ECDLP solve cost.
      nearby_object_control: >-
        Compare a passing-congruence special candidate, a failing-congruence
        special candidate, a same-trace ordinary target, and the direct source
        plus negation baselines under the identical inventory, classification,
        serialization, and refusal accounting. No target-side solve is needed
        for a prefilter conformance pass.
      ceiling_boundary: >-
        A measured end-to-end gain would require a separate accepted transfer
        certificate, charged construction/evaluation/replay vector, and
        independent review. A prefilter timing difference alone cannot refute
        the generic-method ceiling.
  controls:
    - id: C-RATIONALITY-POS
      purpose: >-
        Exercise a congruence-passing j=0 or j=1728 row and require exact
        certificate verification before any admission.
    - id: C-RATIONALITY-NEG
      purpose: >-
        Exercise a congruence-failing row and verify serialized refusal with no
        target-side rho, while retaining the row and charging classification.
    - id: C-SAME-TRACE-ORDINARY
      purpose: >-
        Ensure the prefilter is not confused with same-trace reachability or a
        special-target advantage by preserving an ordinary control.
    - id: C-IDENTITY
      purpose: >-
        Charge identity/no-transfer costs so a prefilter cannot hide an
        unfavorable transfer path.
  falsification_conditions:
    - >-
      A valid intended non-negation F_p action is found on a p>3 row rejected
      by the corresponding predicate; the arithmetic boundary or action
      interpretation is defective and the affected classifications are
      invalidated.
    - >-
      A passing predicate is accepted without an independently recomputed map,
      order, field-of-definition, subgroup, twist, and replay certificate.
    - >-
      A prefilter refusal is omitted from the candidate manifest or charged
      vector, making the inventory incomplete.
    - >-
      A trace-mismatch or congruence-failing row is interpreted as negative
      evidence against another isogeny class or another field.
    - >-
      Target selection depends on solve success, target cost, retries, or
      observed action behavior.
  pareto_frontier:
    dominated_by: pending_frontier_audit
    frontier_check: >-
      Compare the direct source baseline, negation quotient, verified
      automorphism quotient, and charged isogeny transfer across time, memory,
      and data or query count. This map has no end-to-end measurement, so null
      would be premature.
    sota_delta:
      status: no_measurement
      time_exponent_delta: 0
      memory_exponent_delta: 0
      data_query_exponent_delta: 0
      constant_factor_delta: unquantified
      note: >-
        Zero exponent entries are a method ceiling and claim boundary, not a
        measured improvement from the prefilter.
  dispatch_gate:
    not_dispatchable: true
    required_before_approval:
      - exact baseline audit with serialized arithmetic table
      - collision audit with explicit certificate fields
      - quantifier-order review
      - method-ceiling and nearby-object control review
      - independent review-adversarial xhigh session
      - backend preflight without prohibited fallback
      - Coordinator decision preserving all refusal and collision artifacts
