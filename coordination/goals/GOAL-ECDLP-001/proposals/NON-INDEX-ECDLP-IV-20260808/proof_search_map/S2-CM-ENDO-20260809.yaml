proof_search_map:
  map_name: S2-CM-ENDO
  version: 2
  amends_version: 1
  filed_at: '2026-08-09'
  status: draft_gate_only
  proposal_scope: >-
    This map covers the gated follow-on question for publicly constructible
    non-unit CM endomorphisms on ordinary prime-field curves. It is a proof and
    protocol audit, not an experiment specification, run receipt, or claim
    about an observed speedup. It must not be used to admit cm-nonunit rows to
    Arm A or Arm B without a later Coordinator decision.
  parent_question: RQ-ECDLP-165d4b
  related_hypothesis: H-ENDO-001
  source_records:
    - path: ledger/hypotheses/H-ENDO-001.yaml
      use: >-
        Baseline statement and algebraic claims to be re-derived, not accepted
        as a measurement or as a proof of an executable attack.
    - path: experiments/EXP-ENDO-001/specification.yaml
      use: >-
        Historical contract, controls, and declared endomorphism boundaries;
        not reused as a source-hash or run baseline until its lineage is
        independently reconciled.
    - path: experiments/EXP-ENDO-001/amendments/v1_withdrawn_before_execution.yaml
      use: >-
        Immutable withdrawal record that conflicts with visible execution
        artifacts and therefore requires explicit correction-lineage handling.
        It is not silently resolved here.
    - path: ledger/decisions/DEC-20260728-005.yaml
      use: >-
        Narrow prior decision boundary: one eigenvalue prediction was scoped,
        while H-ENDO-001 and the endomorphism lane were not closed.
    - path: harness/endomorphism_la.py
      use: >-
        Existing j=0 instrument pointer for implementation and certificate
        review; it is not a non-unit-CM solver or evidence for S2.
    - path: >-
        coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-III-20260807/INPUT-CAPSULE.md
      use: >-
        Prior decomposition into isogeny-class, invariant, steering, transfer,
        and control subproblems; synthetic expected-rho fields remain
        scaffolding only.
    - path: knowledge/open-problems/KN-OPEN-2c095b.md
      use: >-
        Unresolved CM-versus-small-integer null design: a curve-derived
        eigenvalue/order signal must be separated from a matched small-integer
        null before it can be attributed to CM structure.
  historical_lineage_guard:
    state: unresolved_immutable_inconsistency
    conflict: >-
      The visible EXP-ENDO-001 execution report and run directories describe
      completed toy artifacts, while the immutable withdrawal amendment and
      DEC-20260728-005 describe version 1 as withdrawn before execution with
      zero runs. No prior run is admitted as S2 evidence until a separately
      scoped correction or superseding record reconciles those statements.
    required_action: >-
      Reproduce the needed baseline with a fresh source-hashed implementation
      and cite any later correction record explicitly; do not edit either
      historical record in place.
  bottleneck: >-
    Determine whether a non-unit CM endomorphism can be converted into a
    publicly checkable subgroup decomposition or search-state quotient whose
    complete end-to-end cost is better than the matched ordinary/negation rho
    baseline after construction, evaluation, retries, memory, and replay.
  baseline_embedding:
    parameter_slice: >-
      Ordinary prime-field curves with a certified prime-order subgroup, known
      P and Q, and a public scalar-replay fixture at field sizes small enough
      for exact verification. The baseline is ordinary rho plus the explicit
      negation-only quotient on the identical instance, not a synthetic
      expected_rho field and not an unreconciled EXP-ENDO run.
    reproduction_check: >-
      Before any S2 code is dispatched, build a fresh implementation under a
      new source hash and verify (i) curve/order/subgroup membership, (ii)
      kP=Q for a planted known scalar, (iii) ordinary and negation walk
      receipts on the same seed and retry schedule, and (iv) the cost-vector
      schema used by Arm A. A mismatch is an infrastructure or protocol
      failure, not evidence against CM structure. This audit is pending.
    exact_fixture_required:
      - source_curve_digest
      - subgroup_order_N
      - P_digest
      - planted_scalar_digest
      - Q_digest
      - scalar_replay_certificate
      - source_manifest_sha256
  observation_collision:
    observable: >-
      The proposed public decision observable is the tuple (p, j, subgroup
      order, target stratum label, and any supplied endomorphism certificate).
      A j label alone is not an endomorphism certificate; the map, degree or
      kernel data, field of definition, subgroup action, and eigenvalue are
      separate observables.
    distinct_preimage_search: >-
      Search for distinct ground-truth inputs with the same reduced observable
      (at minimum p, j, and N_subgroup, and separately j alone) but different
      endomorphism-admission outcomes: an explicit public map/eigenvalue on one
      input versus an unavailable, non-F_p-defined, unusable, or refused map on
      the other. Preserve twists and supplied orientation as distinct inputs
      where applicable. A collision that survives all declared observables
      falsifies any j-only admission rule; if the full certificate tuple
      separates the pair, that extra certificate becomes a mandatory input.
      This audit is pending and no collision count is implied.
  constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        A certified endomorphism action on the prime subgroup, represented by
        an explicit map phi and a public eigenvalue or invariant decomposition.
      predicted_gain: >-
        Conditional constant-factor reduction in walk states or scalar work;
        no exponent gain is asserted. Any claimed exponent change requires a
        separate proof and a costed algorithm, not an eigenvalue observation.
      prerequisites:
        - public map construction independent of k
        - field-of-definition and degree/kernel certificate
        - subgroup preservation and eigenvalue certificate
        - matched ordinary, negation, and non-special controls
    - transform: observable_fiber
      proposed_object: >-
        A certificate-bound fiber of curves/maps that share the same charged
        special action and can be compared without selecting a target from
        solve outcomes.
      predicted_gain: >-
        May expose a reproducible constant-factor stratum effect; it cannot
        establish identifiability or an asymptotic improvement by itself.
      prerequisites:
        - complete pre-solve candidate and rejection manifest
        - collision audit passed or the collision condition is explicitly
          narrowed by an additional public certificate
        - construction, transfer, evaluation, retry, memory, and replay costs
          charged in one vector
  quantifier_order:
    statement: >-
      For every admitted input tuple (E/F_p, P, Q, N_subgroup, phi, lambda)
      whose certificates are fixed before any solve outcome, if phi is a
      publicly computable endomorphism defined over F_p, preserves the declared
      subgroup, and acts as [lambda] on that subgroup, then there exists a
      verifier and a bounded charged solver procedure whose correctness is
      stated for every Q in the subgroup. The witness map and lambda may depend
      on E, phi, p, and N_subgroup, but may not depend on the unknown scalar k,
      on the target-side solve result, or on an uncharged oracle. A statement
      quantified only over j is rejected unless every input in the j-fiber has
      the same admitted action under the declared public certificate.
    forbidden_reordering:
      - selecting phi after observing a successful solve
      - recovering an eigenvalue by solving a discrete logarithm
      - treating a CM label or j value as proof that a usable map exists
      - charging a map construction only after it yields a favorable target
  method_ceiling:
    strongest_certifiable_claim: >-
      On a prime-order subgroup, a verified endomorphism acting as a scalar can
      support a decomposition or orbit quotient and therefore at most a
      constant-factor generic-group improvement under this method family. A
      change in the rho exponent is outside the method ceiling unless a new
      search-state invariant, success-probability argument, and complete
      algorithm are supplied and independently reviewed.
    nearby_object_control: >-
      Apply the same implementation and accounting to a same-order
      ordinary-other target and a control-nonspecial isogeny neighbor with no
      admitted special action. Include the direct source curve, negation-only
      quotient, random-map null, identity-transfer cost, and an excluded
      positive calibration where admitted by the surrounding protocol. If the
      method cannot distinguish the special target from the nearby controls,
      the proposed structure has not been isolated.
    small_integer_null: >-
      If a candidate exposes a curve-derived lambda or kernel-field order,
      freeze a second null by drawing a coprime integer with matched signed
      magnitude on the same modulus and running the identical order and cost
      path. A signal that matches this null is an integer-size artifact until
      a later certificate or derivation separates it from CM structure. This
      null is required for S2 admission and is not part of the current Arm-B
      queue while cm-nonunit rows remain refused.
    ceiling_boundary: >-
      The ceiling does not prove that every non-unit CM action is useless. It
      only limits what this proposed certificate-and-rho method could establish
      without a new mechanism. A refutation of the ceiling is a new research
      result requiring a separate proof map and review.
  proof_obligations:
    - claim: public endomorphism construction is available on the declared input
      responsibility: feasibility
    - claim: map is defined over F_p and preserves the measured subgroup
      responsibility: correctness
    - claim: subgroup eigenvalue/decomposition is independently verified
      responsibility: interface
    - claim: the solver recovers k and replays Q on the source curve
      responsibility: correctness
    - claim: construction, evaluation, retries, memory, and replay are charged
      responsibility: runtime
    - claim: >-
        One-shot and multi-target costs are reported without scalar price
        weights not approved in advance.
      responsibility: memory
    - claim: >-
        Success probability and restart cost are bounded for every admitted
        input in the declared stratum.
      responsibility: success_probability
    - claim: no exponent improvement is inferred from a constant-factor signal
      responsibility: scope
    - claim: >-
        Any curve-derived eigenvalue or kernel-field-order signal is separated
        from the matched small-integer null before being attributed to CM.
      responsibility: identifiability
    - claim: >-
        The result remains toy/observation-only absent a separate scale
        correspondence.
      responsibility: scope
  falsification_conditions:
    - >-
      A same-observable collision has different ground-truth admission or
      usability and no additional public certificate separates it; the j-only
      steering claim is falsified.
    - >-
      Fresh baseline reproduction fails scalar replay, subgroup checks, or
      matched ordinary/negation cost binding; the S2 measurement is invalid
      until repaired.
    - >-
      Any proposed map or eigenvalue requires k, a solved DLP, target-side
      outcome selection, or an uncharged oracle; the candidate is refused as
      circular rather than counted as a negative.
    - >-
      The complete charged method does not distinguish the admitted CM stratum
      from the nearby same-order ordinary-other/control-nonspecial object; the
      structure-specific speedup claim is not supported.
    - >-
      A measured exponent decrease is not reproducible under an independent
      implementation and matched nulls; the observation is an artifact or
      inconclusive until the discrepancy is explained.
    - >-
      A curve-derived lambda/order distribution is indistinguishable from the
      matched small-integer null; the CM-attribution limb is unresolved or
      falsified on that scope, and no special-target steering is admitted.
  pareto_frontier:
    dominated_by: pending_frontier_audit
    frontier_check: >-
      Compare ordinary rho, negation quotient, verified unit-automorphism
      quotient, and charged isogeny transfer across time, memory, and data or
      query count at the declared target counts. No row has been adjudicated in
      this draft, so null would be premature.
    sota_delta:
      status: no_measurement
      time_exponent_delta: 0
      memory_exponent_delta: 0
      data_query_exponent_delta: 0
      constant_factor_delta: unquantified
      note: >-
        The zero exponent entries are a protocol ceiling/claim boundary, not a
        measured improvement. A later experiment must populate the vector from
        immutable receipts before any Pareto statement.
  dispatch_gate:
    not_dispatchable: true
    required_before_approval:
      - all four audits have explicit pass, fail, or not-applicable decisions
      - fresh source-hash-bound implementation and exact command exist
      - independent review at review-adversarial/xhigh completes
      - backend preflight passes without prohibited provider fallback
      - Coordinator decision admits a successor task and preserves all refusal
        and collision artifacts
    current_blockers:
      - proof-search audits are pending
      - implementation is planned_not_yet_built
      - harness backend preflight is failed
      - official goal remains active, while the immutable version-1 queue is unchanged
    permitted_next_action: >-
      Keep this map and the Arm-A/Arm-B package as draft artifacts; do not
      dispatch S2, alter the official ledger, or promote a mathematical result.
