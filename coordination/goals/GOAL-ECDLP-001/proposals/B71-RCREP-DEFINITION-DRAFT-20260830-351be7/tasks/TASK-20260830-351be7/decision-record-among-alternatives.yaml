is_parametric: false
note_on_parametric_option: >-
  This task's constraints permit a parametric statement (both alternatives,
  named reason) only when no principled basis for choosing can be found.
  A principled, textually-grounded basis WAS found (below); a parametric
  statement is therefore not used, per the task's own instruction that
  cataloguing the ambiguity a fourth time without choosing would repeat
  the exact pattern this task was dispatched to break.

primary_justification: |-
  The ONLY sentence of algebraic content in the entire pinned corpus
  (coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-101/mechanism_note.md,
  fact 4; retrieved, independently confirmed as the sole such sentence by
  DEC-20260830-69bbf7 and DEC-20260830-680f6d) reads: 'With two labelled
  pair decks D_12,D_34, a squarefree fifth-label polynomial g_I, and a
  fresh target R, the complete-chart intersection resultant satisfies
  r_R(t_a)=0 iff the labelled fifth occurrence a extends to a pair-pair
  relation...'.
  Three independent textual facts jointly point to the two-pairs reading,
  NONE of which depends on which numeric figure (Theta(B^2) or Theta(B^4))
  happened to be declared elsewhere in the corpus:
  (1) SUBSCRIPT ARITHMETIC. 'D_12' and 'D_34' use compound two-index
  subscripts, the standard notational convention for 'the object obtained
  by combining raw decks 1 and 2' (respectively 3 and 4) -- not for
  relabelling a single deck. Combined with H-CREP-001.yaml's own assumption
  text stating there are exactly FIVE primitive decks, the arithmetic
  2+2+1=5 is exact: decks 1,2 pair into D_12, decks 3,4 pair into D_34, and
  deck 5 (deck I) is the 'fifth' deck named separately. Reading 'D_12' as
  simply naming ONE of the five primitive decks (the rejected one-pair
  reading's implicit assumption, treating D_12 as 'deck A' and D_34 as
  'deck B') is compatible with the count only if two of the five named
  decks are simply relabelled with double subscripts for no stated reason,
  which is a strictly less economical reading of the same text.
  (2) 'PAIR-PAIR RELATION' WORD STRUCTURE. The mechanism sentence names the
  tested relation a 'pair-PAIR relation', not merely a 'pair relation'.
  A relation between two decks would naturally be called a 'pair relation'
  (a relation on a pair of decks). 'Pair-pair' most naturally denotes a
  relation between two objects that are THEMSELVES pairs (i.e. a relation
  between D_12, already a pair-combination, and D_34, likewise) -- an
  object-of-objects structure the one-pair reading has no place for (under
  the one-pair reading, D_12 and D_34 are simply 'deck A' and 'deck B', and
  the tested relation would be an ordinary 'pair relation' between them,
  with no second level of pairing to justify doubling the word).
  (3) ROBUSTNESS UNDER RE-DERIVATION. rcrep-candidate-definition.yaml's
  degree_bookkeeping section shows that building r_R via ANY construction
  that genuinely eliminates all FOUR degree-B factor-base decks (1,2,3,4)
  against a fixed, B-independent joint relation -- whether via this
  draft's two-stage D_12/D_34 hierarchy, or via the single canonical
  Semaev polynomial S_5 eliminated four times directly -- gives the SAME
  leading-order bound, Theta(B^4) (exactly 8*B^4 in both computations).
  This means the Theta(B^4) conclusion is not an artefact contingent on
  guessing the exact D_12/D_34 grouping correctly; it is a structural
  consequence of any construction that folds in all four auxiliary decks'
  worth of degree-B data, which the primary source's plain reading (four
  named primitive decks contributing to the fifth-label test) requires
  regardless of the precise pairing hierarchy chosen.

why_the_one_pair_reading_is_rejected: |-
  The one-pair/Theta(B^2) reading (the reconstruction independently
  verified by DEC-20260830-69bbf7, TASK-20260830-06afa2's part_3-4) treats
  'D_12' and 'D_34' as bare names for TWO of the five primitive decks
  (i.e. as if the assumption text's 'five decks' meant D_12, D_34, and
  three other unnamed decks, with g_I contributing the fifth), and reads
  the 'pair-pair relation' as an ordinary relation between these two
  decks. This is a COHERENT reading (TASK-20260830-06afa2's own derivation
  is mathematically careful and independently re-verified by
  DEC-20260830-69bbf7) but requires treating the compound subscripts
  '12' and '34' as arbitrary two-digit deck NAMES rather than as denoting
  a combination of decks 1-and-2, respectively 3-and-4 -- a reading DEC-
  20260830-69bbf7 itself already flagged as 'if anything, the LESS literal
  fit to the primary source's symmetric naming of both named decks'. This
  draft's decision agrees with, and acts on, that prior finding rather
  than re-litigating it: the one-pair reading is not rejected as
  mathematically wrong (no such proof exists or is claimed), only as the
  reading this task's own required choice does not select, on the stated
  textual grounds above.

red_team_joint_preempted: |-
  This task's own review_plan (dispatch_queue.json, joint 2, owner
  red-team) asks: 'if the declared figure in this corpus had instead been
  Theta(B^4), would this same justification have favoured the two-pairs
  reading instead?' Answered directly, in advance: YES, and that is
  exactly the point -- the justification given above (subscript
  arithmetic 2+2+1=5, the 'pair-PAIR' word structure, and the
  construction-independent Theta(B^4) robustness check) makes no reference
  anywhere to which numeric figure is declared elsewhere in the corpus. It
  is derived purely from parsing 'D_12,D_34' against the stated FIVE-deck
  count and the literal 'pair-pair' wording, and would have produced the
  IDENTICAL two-pairs conclusion whether the corpus's pre-existing declared
  figure had been Theta(B^2) (as it in fact is) or Theta(B^4) or anything
  else. That the conclusion CONTRADICTS the corpus's own declared
  Theta(B^2) figure (recorded explicitly in
  rcrep-candidate-definition.yaml's explicit_choice_made and
  relationship_to_frozen_engine sections, not concealed) is itself the
  strongest available evidence that this choice was not made by pattern-
  matching to an expected answer: an argument optimised to match the
  declared figure would have selected the one-pair reading, not this one.

other_reconstructions_considered_and_rejected:
  - name: one_pair_theta_b2
    description: >-
      D_12 and D_34 are two of the five primitive decks directly (bare
      relabelling); the pair-pair relation is an ordinary relation between
      them; matches TASK-20260830-06afa2's preferred reading.
    rejected_because: >-
      Requires reading compound two-index subscripts as arbitrary deck
      names rather than as denoting a combination of two primitive decks,
      which is a less economical fit to H-CREP-001's own stated five-deck
      count and to the doubled word 'pair-pair' (see
      why_the_one_pair_reading_is_rejected above). Not rejected as
      mathematically impossible.

  - name: three_named_decks_only
    description: >-
      D_12, D_34, and deck I are the only THREE decks that matter; the
      other two of the stated five decks play no role in the mechanism
      sentence and are simply unused padding.
    rejected_because: >-
      Directly contradicts H-CREP-001.yaml's own assumption text, which
      states 'each of five signed, coloured, source-labelled decks has
      Theta(B) occurrences' as a load-bearing assumption of the
      hypothesis, not an incidental detail; a reading that discards two of
      the five decks as unused is incompatible with the one sentence of
      mechanism this task is required not to contradict (this task's own
      constraint 4).

  - name: parallel_copies_not_combination
    description: >-
      D_12 and D_34 denote two PARALLEL, structurally identical copies of
      some deck-pairing template (e.g. a naming convention distinguishing
      instance 1 from instance 2 of the same construction), not decks
      built by literally combining raw decks 1-2 and 3-4.
    rejected_because: >-
      Does not explain the doubled word 'pair-pair' any better than the
      one-pair reading does (a relation between two parallel copies is
      still naturally a single 'pair' relation, not a 'pair-pair'
      relation), and offers no account of why the subscripts specifically
      use the digits 1,2 and 3,4 (matching the four numbered primitive
      decks exactly) rather than arbitrary instance labels like D_A, D_B.
      This reading was considered specifically to check whether the
      subscript-arithmetic argument in primary_justification point (1)
      was the only route to a two-pairs-shaped reading, and found not to
      independently support it as well as the combination reading does.

  - name: direct_S5_construction_no_hierarchy
    description: >-
      Skip the D_12/D_34 intermediate objects entirely and construct r_R
      directly as the iterated elimination of the canonical 5-variable
      Semaev polynomial S_5(x1,x2,x3,x4,T) against g_1,g_2,g_3,g_4.
    rejected_because: >-
      NOT rejected as an alternative degree prediction (degree_bookkeeping
      in rcrep-candidate-definition.yaml shows it gives the identical
      Theta(B^4)/8*B^4 bound, used deliberately as a robustness check
      strengthening the choice made). Rejected only as the PRIMARY
      construction presented in rcrep-candidate-definition.yaml, because it
      does not use or explain the D_12/D_34 naming the primary source
      itself uses, and because a two-variable-at-a-time S_3-based
      construction is more directly checkable by hand (as the
      worked_example demonstrates) than a five-variable S_5 elimination
      would be. Retained explicitly as corroborating evidence for the
      chosen exponent, not as a discarded dead end.

honesty_check_against_circularity: |-
  Re-reading primary_justification's three points independently of this
  session's own awareness of the declared Theta(B^2) figure: point (1)
  (subscript arithmetic against the five-deck count) is a pure counting
  argument on H-CREP-001.yaml's own assumption text; point (2) (the
  'pair-pair' word structure) is a pure lexical/structural argument on the
  mechanism sentence's wording; point (3) (construction-independent
  Theta(B^4) robustness) is a mathematical derivation (Sylvester resultant
  degree bookkeeping) that would produce the same number regardless of
  what figure the corpus declared elsewhere. None of the three routes
  through the declared figure at any step. This is offered as the
  strongest available check against the exact bias DEC-20260830-69bbf7
  flagged in the prior round (a reading selected partly because it matched
  the pre-existing declared figure); an independent reviewer is invited to
  re-run points (1)-(3) without reading this session's conclusion first,
  per this task's own review_plan blindness declaration.

what_this_choice_does_not_claim: |-
  This choice is a candidate mathematical reconstruction for independent
  review, not a proof that it is the ONLY reading consistent with
  H-CREP-001's one sentence of mechanism, and not a claim that the
  rejected one-pair reading is mathematically false. It does not change
  H-CREP-001's status or EXP-CREP-001's specification. If independent
  review finds the subscript-arithmetic or word-structure argument
  unpersuasive, or finds a textual anchor this session missed that favours
  the one-pair reading on grounds equally independent of the declared
  figure, that is a legitimate outcome of the review this task exists to
  invite, not a failure of this record.

