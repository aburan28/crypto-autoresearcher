purpose: >-
  A self-contained candidate mathematical definition of H-CREP-001's
  'complete-chart intersection resultant' r_R, for the REAL (non-toy)
  elliptic-curve mechanism, addressing RT103-C1 (coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-103/red_team_report.yaml).
  This is a draft candidate submitted for independent validator/red-team
  review. It does not amend H-CREP-001.yaml or EXP-CREP-001/specification.yaml,
  is not an experiment, and asserts no ECDLP advantage, speedup, or
  breakthrough (AGENTS.md core rules 4-6, docs/claims-and-verification.md).

