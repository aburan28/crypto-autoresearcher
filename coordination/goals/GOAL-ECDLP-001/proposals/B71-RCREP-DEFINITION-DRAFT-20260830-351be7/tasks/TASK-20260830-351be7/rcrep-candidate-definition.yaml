primary_source_anchor: >-
  coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-101/mechanism_note.md
  (retrieved), fact 4, is the only sentence of algebraic content anywhere in
  the pinned corpus (independently confirmed absent elsewhere by
  DEC-20260830-69bbf7 and DEC-20260830-680f6d): 'With two labelled pair
  decks D_12,D_34, a squarefree fifth-label polynomial g_I, and a fresh
  target R, the complete-chart intersection resultant satisfies r_R(t_a)=0
  iff the labelled fifth occurrence a extends to a pair-pair relation,
  z_R(T)=gcd(g_I(T),r_R(T)) = product over extendible fifth labels a of
  (T-t_a).' H-CREP-001.yaml's own mechanism field (retrieved) is a
  paraphrase of exactly this sentence and adds nothing further.

cost_model_and_curve_assumptions: >-
  Per H-CREP-001.yaml's own stated assumptions (retrieved): a generic
  ordinary elliptic curve E over a prime field F_p in short Weierstrass form
  y^2 = x^3 + a*x + b (char p not 2 or 3), with a public prime-order
  subgroup of order N = p^(1+o(1)). No standardized curve or real target is
  instantiated anywhere in this draft (safety scope preserved, per
  H-CREP-001's assumptions and AGENTS.md's non-operational classification).
  N = B^5. Five signed, coloured, source-labelled decks, indexed k = 1,2,3,4,I
  (I is 'the fifth' deck), each with Theta(B) occurrence records. This
  numbering (four numbered decks plus one distinguished 'fifth' deck I)
  reproduces H-CREP-001.yaml's own assumption text verbatim in structure.

occurrence_record_semantics: >-
  Each deck-k occurrence record is a tuple (label, x, sign, colour, marker).
  label is the public source label (an element of a finite label universe,
  matching the toy engine's integer labels). x is an element of the
  algebraic closure of F_p intended as the x-coordinate of a curve point P
  associated with this occurrence. Because x alone determines P only up to
  the hyperelliptic involution y -> -y, sign in {+1,-1} disambiguates which
  of the (at most two) points with that x-coordinate the occurrence denotes
  (this gives the deck record's 'sign' field, present verbatim in the toy
  engine's make_occ function, real mathematical content it did not
  previously carry). colour is a purely cosmetic deck tag (matches
  DECK_COLOURS = [red,blue,green,gold,white] in
  experiments/EXP-CREP-001/instances/generate_instances.py, internal,
  retrieved) and carries no algebraic role in this definition. marker is
  one of {normal, tangent, vertical, repeated, identity, infinity},
  matching ADMISSIBLE_MARKERS/INADMISSIBLE_MARKERS in
  experiments/EXP-CREP-001/instances/generate_instances.py exactly
  (internal, retrieved); each marker's real mathematical meaning is fixed
  precisely in section strata_and_saturation below.

deck_defining_polynomials: |-
  For k in {1,2,3,4}, let deck k have occurrences with distinct labels and
  x-coordinates x_{k,1},...,x_{k,B} (occurrences sharing a label within one
  deck are the 'repeated' stratum, handled in strata_and_saturation; here
  the distinct-x case is described first). Define
    g_k(x_k) := product over j of (x_k - x_{k,j}),  degree exactly B,
  the factor-base-defining polynomial for deck k, built ONLY from deck k's
  own public occurrence data (target-independent, a preprocessing object in
  EXP-CREP-001's V2 sense).
  Deck I (the fifth deck) is defined identically:
    g_I(T) := product over occurrences a in deck I of (T - t_a),  degree
    exactly B, squarefree by construction because 'distinct public
    fifth-occurrence labels are the roots of the squarefree polynomial g_I'
    is stated directly in H-CREP-001.yaml's mechanism field (retrieved) --
    deck I's labels are required distinct, unlike decks 1-4 which may
    repeat (repeated_source stratum).

joint_relation_S3: |-
  The fixed, B-independent joint relation Phi/Psi/Chi named informally by
  the task handoff is instantiated concretely as the classical Semaev
  3rd summation polynomial (KN-TECH-002, kb, confidence established):
    S_3(x1,x2,x3) = (x1-x2)^2*x3^2 - 2*((x1+x2)*(x1*x2+a)+2*b)*x3
                    + ((x1*x2-a)^2 - 4*b*(x1+x2))
  which vanishes, over the algebraic closure of F_p, exactly when there
  exist points P_i = (x_i, y_i) on E with P_1 + P_2 + P_3 = O for SOME
  choice of the y_i signs (KN-TECH-002, kb, established; this sign
  quotienting is the standard, well-known property of summation
  polynomials, not a new claim of this draft). S_3 has degree exactly 2 in
  EACH of its three variables (verified directly by term-by-term expansion
  of the stated formula: the x3^2 coefficient (x1-x2)^2 is degree 2 in x1
  and x2, and no term has degree 3 or higher in any single variable).

pair_deck_construction: |-
  The primary source names TWO 'pair decks', D_12 and D_34, distinct from
  the four PRIMITIVE decks 1,2,3,4 (see decision-record-among-alternatives.yaml
  for why this compound-subscript notation is read as 'D_12 is built by
  pairing primitive decks 1 and 2' rather than as a bare relabelling of a
  single deck). Concretely:
    g_12(x_12) := Res_{x2}( g_2(x2), Res_{x1}( g_1(x1), S_3(x1,x2,x_12) ) )
    g_34(x_34) := Res_{x4}( g_4(x4), Res_{x3}( g_3(x3), S_3(x3,x4,x_34) ) )
  Res_y(f,g) denotes the Sylvester resultant of f,g viewed as polynomials
  in y, computed over the ring of polynomials in the remaining variables
  (recalled, standard commutative algebra; e.g. van der Waerden, Modern
  Algebra, or Cox-Little-O'Shea, Using Algebraic Geometry, ch.3 -- recalled,
  not independently retrieved this session).
  MATHEMATICAL MEANING: a root x_12 of g_12 is, up to the standard
  degree-drop/saturation caveats named in strata_and_saturation, exactly
  the x-coordinate of P_1 + P_2 (or P_1 - P_2) for SOME pair of occurrences
  (one from deck 1, one from deck 2) -- i.e. g_12 is the REAL-mechanism
  analogue of the toy engine's compact pair-product generator object
  load_pair_product_generators (experiments/EXP-CREP-001/instances/generate_instances.py,
  build_generators; internal, retrieved), generalised from the toy model's
  Boolean label-matching rule to the genuine elliptic-curve addition law.
  This is the concrete link required by this task's Gate 4 (compatibility
  with the frozen EXP-CREP-001 engine); see relationship_to_frozen_engine
  below for what it implies.

final_pair_pair_relation_and_r_R: |-
  The 'pair-pair relation' named by H-CREP-001's mechanism sentence is the
  SAME fixed joint relation S_3, applied one level up to the two
  already-combined pair-deck variables x_12, x_34, plus the fifth-deck
  variable T:
    Chi(x_12, x_34, T) := S_3(x_12, x_34, T)
  which vanishes exactly when (P_1+P_2) + (P_3+P_4) + P_I = O for some sign
  choice -- i.e. exactly a genuine, signed, FIVE-term relation
  P_1 +- P_2 +- P_3 +- P_4 +- P_I = O, matching H-CREP-001's phrase 'the
  labelled fifth occurrence a extends to a pair-pair relation' precisely:
  the fifth occurrence extends the pair-pair relation between D_12 and D_34
  into a complete five-source relation.
  Define, by the same two-stage elimination pattern used to build g_12/g_34:
    R_1(x_12, T) := Res_{x34}( g_34(x_34), S_3(x_12, x_34, T) )
    r_R(T)       := Res_{x12}( g_12(x_12), R_1(x_12, T) )
  r_R(T) is a univariate polynomial in T, built entirely from the four
  target-independent preprocessing objects g_1,g_2,g_3,g_4 (via g_12, g_34)
  and the single fixed joint relation S_3 applied twice more; T (equivalently
  the fresh target R via t_a) enters ONLY in the two final elimination
  steps, matching EXP-CREP-001's V2 target-independence convention: g_12,
  g_34 (and g_1..g_4) are preprocessing objects that never read the target;
  r_R(T) itself is the online, target-dependent construction.

z_R_definition: >-
  z_R(T) := gcd(g_I(T), r_R(T)), computed in F_p[T] (both g_I and r_R are
  polynomials over the base field, since all coefficients of S_3 and of the
  g_k are in F_p and resultants of polynomials over F_p remain in F_p).
  Because g_I is squarefree by construction (deck I's labels are required
  distinct), gcd(g_I, r_R) is automatically squarefree regardless of any
  multiplicity r_R itself carries (a standard, elementary fact: the gcd of
  a squarefree polynomial with any polynomial divides the squarefree one,
  hence is itself squarefree) -- this is exactly how z_R = gcd(g_I,r_R) is
  preserved as an EXACT, multiplicity-free SUPPORT polynomial regardless of
  whatever multiplicities the strata in strata_and_saturation impose on
  r_R's own roots. z_R's root set equals the extendible-label set proved in
  main_theorem below (restricted to the finite exceptional set named
  there).

degree_bookkeeping: |-
  Using the classical Sylvester-resultant degree bound (recalled, standard:
  for f(x) of degree m in x alone and h(x,y) of degree n in x with
  coefficients of degree at most d in y, deg_y(Res_x(f,h)) <= m*d, and
  symmetrically when both f and h depend on y):
    Stage 1 (build g_12): Res_{x1}(g_1, S_3(x1,x2,x12)) has degree <= B*2 = 2B
      in x2 and <= B*2 = 2B in x_12. Then g_12(x_12) = Res_{x2}(g_2, that
      intermediate) has degree <= B*(2B) = 2*B^2 in x_12.
    (identically, g_34 has degree <= 2*B^2 in x_34.)
    Stage 2 (build R_1): R_1(x_12,T) = Res_{x34}(g_34, S_3(x12,x34,T)) has
      degree <= deg(g_34)*deg_{x12}(S_3) = 2*B^2*2 = 4*B^2 in x_12, and
      <= deg(g_34)*deg_T(S_3) = 2*B^2*2 = 4*B^2 in T.
    Stage 3 (build r_R): r_R(T) = Res_{x12}(g_12, R_1) has degree
      <= deg(g_12)*deg_T(R_1) = 2*B^2 * 4*B^2 = 8*B^4 in T (the cross term
      deg_{x12}(R_1)*deg_T(g_12) vanishes because g_12 does not depend on
      T).
  CONCLUSION: deg_T(r_R) <= 8*B^4 = Theta(B^4).
  ROBUSTNESS CHECK (not required by the task, offered as independent
  corroboration): building r_R instead via the single canonical Semaev
  polynomial S_5(x1,x2,x3,x4,T) (degree exactly 2^(5-2)=8 in EACH variable,
  KN-TECH-002, kb) and eliminating x1,x2,x3,x4 sequentially against
  g_1,g_2,g_3,g_4 gives, by the identical bound applied four times
  (each elimination multiplies the remaining degree by B, starting from 8):
  8*B, 8*B^2, 8*B^3, 8*B^4 -- the SAME leading bound 8*B^4, independently of
  whether the elimination is sequenced as two pair-decks then a final fold
  (this draft's construction) or as one direct S_5 elimination. This
  indicates Theta(B^4) is a property of 'genuinely eliminate four
  independent degree-B decks against a B-independent joint relation', not
  an artifact of the specific D_12/D_34 grouping chosen.

strata_and_saturation: |-
  RT103-C1 requires charts, saturations, multiplicities, and strata. Each
  named toy-engine marker (experiments/EXP-CREP-001/instances/generate_instances.py,
  ADMISSIBLE_MARKERS/INADMISSIBLE_MARKERS; internal, retrieved) is given
  the following real mathematical meaning:

  CHART: the standard affine Weierstrass chart (x,y) for 'normal' markers,
  extended to the projective closure of E in P^2 with the single point at
  infinity O = [0:1:0] for degenerate cases. This IS the object H-CREP-001
  names 'complete signed projective group-law chart': the affine chart plus
  the point-at-infinity chart, together with the SIGN CHART (the
  y -> -y involution quotiented out by S_3's own symmetry, recalled,
  standard property of summation polynomials).

  NORMAL marker: an occurrence with an ordinary affine point, no
  coincidence with another occurrence in the same pairing step. Contributes
  a simple (multiplicity-1) factor to the relevant g_k or intermediate
  polynomial.

  VERTICAL marker: occurs when two occurrences being combined in a single
  Res_{x1}(g_1, S_3(x1,x2,x12)) or analogous step have x1 = x2 (a 'vertical
  line' pair, P_2 = -P_1, sum = O). This is DIRECTLY visible in the S_3
  formula's own leading coefficient: as a polynomial in x_12 (respectively
  x_34, T), S_3(x1,x2,x3)'s leading coefficient is (x1-x2)^2, which
  vanishes identically exactly at x1=x2. This is a genuine DEGREE DROP in
  the resultant construction (the naive affine Sylvester resultant becomes
  degenerate) corresponding, in the projective closure, to a root at
  x_12 = infinity (the sum point IS O). SATURATION CONVENTION: at any
  occurrence pair marked 'vertical', the affine construction is
  saturated by working in the homogenised (projective) resultant, which
  tracks the point-at-infinity root explicitly rather than silently
  losing degree; this draft states the convention but does NOT
  exhaustively verify it symbolically for every possible vertical
  configuration (see rt103-c1-discharge-map.yaml, item 'saturations').

  IDENTITY / INFINITY markers: an occurrence marked 'identity' or
  'infinity' denotes the occurrence O itself (the curve's identity point,
  which has no affine x-coordinate). Such an occurrence is EXCLUDED from
  the affine deck-defining polynomial g_k (O contributes no root to a
  polynomial in the affine coordinate x_k) and is instead tracked as a
  Boolean flag on the deck: if deck k's occurrence for label ell is marked
  identity/infinity, the corresponding term in the joint relation
  degenerates from S_3(x_i,x_j,x_ij) to the lower-degree relation
  S_2(x_j,x_ij) = x_j - x_ij (KN-TECH-002, kb: 'S_2(x1,x2)=x1-x2', the
  correct degenerate specialisation of S_3 when one summand is O, since
  O + P_j = P_j forces x_ij = x_j directly). This mirrors the toy engine's
  own rule (INADMISSIBLE_MARKERS = [identity, infinity] means such a tuple
  is EXCLUDED from label_tuples entirely) at the level of admissible-tuple
  counting, but at the polynomial level it is a degree-dropping
  specialisation of S_3 rather than a simple exclusion; this draft names
  the correspondence and does not verify it on a worked numeric case
  (see discharge map).

  TANGENT marker: occurs when the two points being combined in one S_3
  application are EQUAL (P_i = P_j, not merely x_i = x_j with opposite
  sign) -- the doubling case, requiring the tangent line rather than a
  chord. This produces a REPEATED ROOT of the relevant g_k or intermediate
  polynomial in the combined variable (verified concretely below in
  worked_example: g_34 in the hand-worked case has a genuine repeated root
  arising from adding two 2-torsion points, a structurally analogous
  degeneracy).

  REPEATED marker (deck-level multiplicity, not tangency): when a single
  deck k in {1,2,3,4} has TWO OR MORE occurrences sharing the same label
  (H-CREP-001's 'repeated' assumption, matching the toy engine's
  repeated_source stratum), g_k simply carries that label's root with the
  corresponding multiplicity by definition (g_k is defined as a PRODUCT
  over ALL occurrence records, not over distinct labels); this multiplicity
  propagates multiplicatively through every subsequent resultant stage
  (a standard, elementary resultant fact: Res(f1*f2, h) = Res(f1,h)*Res(f2,h)),
  so a label repeated m times in one deck contributes an m-fold-larger
  contribution to the relevant intermediate polynomial's degree and root
  multiplicity, but -- per z_R_definition above -- NEVER changes z_R's root
  SET, since gcd with the squarefree g_I always yields a squarefree z_R.

  NONREDUCED (general convention): the umbrella term for any of the above
  multiplicity phenomena (tangent, repeated, or a vertical/infinity
  degeneracy at the boundary) read SCHEME-THEORETICALLY, i.e. r_R's
  multiplicity at a root is defined as its INTERSECTION MULTIPLICITY in
  the iterated-resultant (Sylvester-determinant) sense, not merely as a
  count of geometrically distinct witnessing tuples. The exact-support
  claim (main_theorem below) concerns the ROOT SET of z_R, which is
  insensitive to this multiplicity structure by the squarefree-gcd
  argument in z_R_definition; RT103-C1's 'multiplicities' item is
  therefore DISCHARGED for the claim actually made (exact support, a SET
  claim) and explicitly marked NOT extended to any claim about r_R's own
  multiplicities matching a specific combinatorial count (no such claim is
  made -- see rt103-c1-discharge-map.yaml).

main_theorem: |-
  THEOREM (support biconditional). Let a be a label of deck I with
  x-coordinate t_a (a root of g_I). Say a is EXTENDIBLE if there exist
  admissible (normal-marker, for this statement) occurrences x1 in deck 1,
  x2 in deck 2, x3 in deck 3, x4 in deck 4, and a choice of signs, such
  that, writing x_12 for a root of S_3(x1,x2,.) and x_34 for a root of
  S_3(x3,x4,.), we have S_3(x_12,x_34,t_a) = 0 -- i.e. the five points
  P1,...,P4,P_a (with the chosen sign lifts) satisfy
  P1 +- P2 +- P3 +- P4 +- P_a = O.

  PART 1 (forward direction, UNCONDITIONAL, no genericity needed): if a is
  extendible, then r_R(t_a) = 0.
  PROOF: by hypothesis, x_12 is a common root of g_12(.) and S_3(.,x_34,t_a)
  as a function of its first argument (since x_12 is a root of S_3(x1,x2,.)
  for some deck-1/deck-2 pair, hence a root of g_12 by g_12's own resultant
  definition), and x_34 is similarly a common root of g_34(.) and
  S_3(x_12,.,t_a). A polynomial resultant Res_y(f,g) vanishes WHENEVER f
  and g share a common root y0 in the algebraic closure -- this is
  unconditional (the Sylvester matrix of f(y),g(y) is singular whenever
  they share a root, regardless of any degree-drop degeneracy elsewhere;
  recalled, standard resultant theory). Applying this twice (once for the
  x_34-elimination giving R_1(x_12,t_a)=0 because g_34 and S_3(x_12,.,t_a)
  share the root x_34, then once for the x_12-elimination giving
  r_R(t_a)=Res_{x12}(g_12,R_1(.,t_a))=0 because g_12 and R_1(.,t_a) share
  the root x_12) gives r_R(t_a) = 0. QED (unconditional).

  PART 2 (converse direction, CONDITIONAL on an explicit, checkable
  non-degeneracy hypothesis, named H-RCREP-1 below): if r_R(t_a) = 0 and
  t_a avoids the finite exceptional set where the elimination's leading
  coefficients (in the eliminated variable) vanish -- i.e. t_a is not a
  root of the (explicitly computable, finite-degree) 'vertical/infinity
  obstruction polynomial' associated with each elimination stage -- then a
  is extendible.
  PROOF SKETCH: the classical converse of the resultant-vanishing fact
  (recalled, standard: Cox-Little-O'Shea, Using Algebraic Geometry, sec 3.5,
  or van der Waerden) states that Res_y(f,g)(y0) = 0 implies EITHER f(.,y0)
  and g(.,y0) share a common root, OR the leading coefficient (in the
  eliminated variable) of f or g, viewed as a polynomial in y, vanishes at
  y0. H-RCREP-1 (named, numbered heuristic/genericity hypothesis) excludes
  the second case by hypothesis at t_a, forcing the first: g_12 and
  R_1(.,t_a) share a common root x_12, and (applying the theorem's premise
  again one level down) g_34 and S_3(x_12,.,t_a) share a common root x_34,
  which unwinds to an explicit admissible occurrence quadruple witnessing
  extendibility. This is stated as a proof SKETCH, not a fully worked
  symbolic verification for arbitrary B: the worked_example below verifies
  it concretely at B=1 including one genuinely degenerate (tangent-type)
  sub-case, but this draft does NOT claim to have exhaustively checked
  every combination of the six named strata for general B (see
  rt103-c1-discharge-map.yaml for the precise discharge status).

  NAMED HEURISTIC H-RCREP-1 (non-degeneracy / genericity hypothesis): for
  the specific label a and t_a under consideration, no leading-coefficient
  (in the relevant eliminated variable) of any resultant stage used to
  build r_R vanishes at t_a. This is EXPLICIT and CHECKABLE for any given
  concrete instance (it is a finite polynomial-root-membership test, not
  an unbounded search) -- it is not asserted to hold universally; on its
  failure locus (the finite exceptional set), extendibility must be
  checked directly via the degenerate-case rules in strata_and_saturation
  rather than via r_R(t_a)=0 alone. This mirrors, at the level of a
  precise mathematical hypothesis, the toy engine's own INADMISSIBLE_MARKERS
  exclusion rule and H-CREP-001's own enumeration of exceptional strata --
  it is not a new complication invented by this draft, but the exact
  formal content RT103-O1 asked to have named.

worked_example: |-
  A fully hand-worked, concrete numeric instance (B=1 per deck 1-4;
  computed entirely by hand, no computer algebra system, per this task's
  constraints), checking BOTH directions of main_theorem on one genuine
  witnessing tuple, and exhibiting one genuine 'tangent-type' degeneracy.

  CURVE: E: y^2 = x^3 - x over F_11 (a=-1, b=0; this is a standard,
  well-known curve, p=11 is prime, char not 2 or 3). Direct enumeration
  (recalled arithmetic, computed by hand) gives the affine points:
  (0,0),(1,0),(10,0) [2-torsion], (4,4),(4,7),(6,1),(6,10),(8,3),(8,8),
  (9,4),(9,7). (Standard fact used only as a sanity check, not load-bearing:
  for y^2=x^3-x over F_p with p = 3 mod 4, #E(F_p) = p+1 = 12 here,
  matching 1(identity)+3(2-torsion)+8(the remaining 8 listed) = 12.)

  DECK ASSIGNMENT (B=1, one occurrence per deck):
    deck 1: P1 = (4,4)      [label 'a1', x1=4]
    deck 2: P2 = (6,1)      [label 'a2', x2=6]
    deck 3: P3 = (0,0)      [label 'a3', x3=0]
    deck 4: P4 = (1,0)      [label 'a4', x4=1]
    deck I: candidate label 'a' with x-coordinate T; we test T=4.

  STEP 1 -- compute P1+P2 via the standard chord addition law (recalled,
  standard: for distinct x-coordinates, slope lambda=(y2-y1)/(x2-x1),
  x3=lambda^2-x1-x2, y3=lambda*(x1-x3)-y1, all mod 11):
    lambda = (1-4)/(6-4) = (-3)*2^-1 = 8*6 = 48 = 4 (mod 11; 2^-1=6 since
    2*6=12=1 mod 11).
    x3 = 4^2 - 4 - 6 = 16-10 = 6 (mod 11).
    y3 = 4*(4-6) - 4 = -8-4 = -12 = 10 (mod 11).
    So P1+P2 = (6,10), a genuine point on E (listed above). x_12 = 6.

  STEP 2 -- compute P3+P4 (both 2-torsion, same chord formula applies for
  distinct x-coordinates):
    lambda = (0-0)/(1-0) = 0.
    x3 = 0 - 0 - 1 = -1 = 10 (mod 11).
    y3 = 0*(0-10) - 0 = 0.
    So P3+P4 = (10,0), a genuine point on E. x_34 = 10.

  STEP 3 -- compute (P1+P2)+(P3+P4) = (6,10)+(10,0):
    lambda = (0-10)/(10-6) = (1)*4^-1 = 1*3 = 3 (mod 11; 4^-1=3 since
    4*3=12=1).
    x3 = 9 - 6 - 10 = -7 = 4 (mod 11).
    y3 = 3*(6-4) - 10 = 6-10 = -4 = 7 (mod 11).
    So (P1+P2)+(P3+P4) = (4,7). Hence P5 := -(4,7) = (4,4) satisfies
    (P1+P2)+(P3+P4)+P5 = O exactly. Note (4,4) = P1 numerically (a
    coincidence of this small example, not a general requirement -- decks
    are formally disjoint label sets even when x-coordinates coincide
    numerically across decks). Set T := 4 (deck I's candidate label a has
    x-coordinate 4).

  VERIFY VIA S_3 DIRECTLY (independent check of the same fact using the
  polynomial rather than the geometric addition law): S_3(x1,x2,x3) for
  a=-1,b=0 simplifies to S_3(x1,x2,x3) = (x1-x2)^2*x3^2 -
  2*(x1+x2)*(x1*x2-1)*x3 + (x1*x2+1)^2.
    S_3(4,6,x_12): (4-6)^2=4; (4+6)=10, (4*6-1)=23=1 (mod11), so middle
    coeff = -2*10*1=-20=2; (4*6+1)^2=25^2... (4*6+1)=25=3 (mod11), 3^2=9.
    So S_3(4,6,x_12) = 4*x_12^2 + 2*x_12 + 9 (mod 11). At x_12=6:
    4*36+2*6+9 = 4*3+12+9 (36 mod11=3) = 12+12+9=33=0 (mod 11). Confirms
    g_12(6)=0 (g_12(x_12)=S_3(4,6,x_12) exactly here since g_1,g_2 are
    linear).
    S_3(0,1,x_34): (0-1)^2=1; (0+1)=1,(0*1-1)=-1=10, middle coeff=
    -2*1*10=-20=2; (0*1+1)^2=1. So S_3(0,1,x_34)=x_34^2+2*x_34+1=
    (x_34+1)^2 (mod 11). This is a PERFECT SQUARE -- a genuine repeated
    (double) root at x_34=-1=10. This is the TANGENT-type degeneracy named
    in strata_and_saturation, arising here because P3,P4 are both
    2-torsion points (so P3+P4 and P3-P4 coincide, since -P4=P4). At
    x_34=10: (10+1)^2=121=0 (mod 11, 121=11^2). Confirms g_34(10)=0 with
    multiplicity 2.
    S_3(6,10,4): (6-10)^2=16=5; (6+10)=16=5, (6*10-1)=59=4 (mod11),
    middle coeff=-2*5*4=-40=4 (mod11, -40+44=4); (6*10+1)^2=61^2,
    61=6(mod11), 6^2=3(mod11)... let's recompute directly:
    (6*10+1)=61=6 (mod11), 6^2=36=3 (mod11). So S_3(6,10,x3)=
    5*x3^2+4*x3+3 (mod11). At x3=4: 5*16+4*4+3=5*5+16+3 (16mod11=5)=
    25+16+3=44=0 (mod 11). Confirms the final relation
    S_3(x_12,x_34,T)=S_3(6,10,4)=0.

  FORWARD DIRECTION CHECK (main_theorem Part 1): g_12(6)=0 and
  S_3(6,x_34,4) has x_34=10 as a root (just verified: S_3(6,10,4)=0, and
  viewing this as a polynomial in x_34 for fixed x1=6,T=4, its value at
  x_34=10 is zero), and g_34(10)=0. Since g_34 and S_3(6,.,4) SHARE the
  root x_34=10, R_1(6,4) := Res_{x34}(g_34, S_3(6,.,4)) = 0 (unconditional
  resultant fact -- Part 1's proof). Since g_12 and R_1(.,4) then share the
  root x_12=6 (verified: R_1(6,4)=0, just shown), r_R(4) :=
  Res_{x12}(g_12, R_1(.,4)) = 0. CONFIRMED: T=4 is a root of r_R, matching
  the genuine witnessing relation constructed above. This is a direct,
  concrete instance of main_theorem Part 1.

  CONVERSE DIRECTION CHECK (main_theorem Part 2, partial): computed R_1(6,T)
  explicitly as a polynomial in T by taking the resultant of g_34(v)=
  v^2+2v+1 and S_3(6,v,T) (rewritten as a quadratic in v; full symbolic
  expansion carried out by hand, mod 11), obtaining
    R_1(6,T) = 3*T^4 + 7*T^3 + 2*T^2 + 2*T + 9  (mod 11).
  Evaluating at T=4 gives 3*3+7*9+2*5+2*4+9 = 9+8+10+8+9 = 44 = 0 (mod 11;
  using 4^2=5,4^3=9,4^4=3 mod 11), confirming R_1(6,4)=0 independently of
  the common-root argument above (a genuine cross-check by direct
  polynomial evaluation, not merely restating the same computation).
  Factoring R_1(6,T) by hand (synthetic division mod 11, repeatedly testing
  T=4) finds T=4 is a ROOT OF MULTIPLICITY 4 -- i.e. R_1(6,T) = 3*(T-4)^4
  (mod 11) exactly, and T=4 is the ONLY root of R_1(6,.) in F_11. This is
  a genuine, non-trivial partial verification of Part 2's converse at
  x_12=6: no OTHER value of T is spuriously witnessed by x_12=6, despite
  the tangent-type degeneracy in g_34. This draft does NOT claim to have
  computed the full degree-8 polynomial r_R(T) = Res_{x12}(g_12,R_1) by
  hand for all its roots (an honest, disclosed limitation -- see discharge
  map); the check above covers one fibre (x_12=6) of the two-stage
  construction exactly, in both directions, including a genuine
  degenerate sub-case.

relationship_to_frozen_engine: |-
  This section is required by this task's Gate 4 (compatibility with, and
  consequences for, EXP-CREP-001's frozen engine).
  (1) g_12 above is the direct real-mechanism analogue of
  load_pair_product_generators (experiments/EXP-CREP-001/instances/generate_instances.py,
  build_generators, and PREPROCESSING_KINDS in
  experiments/EXP-CREP-001/verifier/check_representation.py; internal,
  retrieved), which is built from EXACTLY decks 0 and 1 (0-indexed,
  matching this draft's decks 1 and 2, 1-indexed) in the frozen toy model.
  This draft's g_34 has NO analogue anywhere in the eight frozen routes
  (independently confirmed absent by DEC-20260830-680f6d and
  DEC-20260830-6f28e0: PREPROCESSING_KINDS contains exactly one
  dedicated pairwise-combination kind, and build_chart_index bundles
  decks 2,3,4's raw occurrence lists into one flat, undifferentiated
  node). If this draft's two-pairs mechanism is the correct real-mechanism
  reading, a genuinely decomposed constructor mirroring g_34's role IS
  mathematically well-defined and could in principle be attempted -- this
  reopens, rather than forecloses, the 'interleaved combination rule for
  decks 2-4' direction DEC-20260830-680f6d's next_actions named as the
  most promising unexplored direction, and gives it a candidate concrete
  target (build an analogue of g_34, i.e. a decks-3/4 pair-deck object, on
  the REAL curve, not the toy combinatorial engine where DEC-20260830-680f6d
  found the analogous decks-2/3 toy construction structurally mismatched).
  (2) CONSEQUENCE FOR THE DECLARED THETA(B^3)/THETA(B^2) FIGURES: this
  draft's r_R has degree Theta(B^4) in T, NOT Theta(B^2) as declared
  (undischarged, per DEC-20260830-680f6d) throughout the corpus. This means
  EITHER (a) the corpus-wide Theta(B^2) figure describes a DIFFERENT real
  quantity than the r_R this draft defines (e.g. possibly g_12 alone,
  which genuinely IS degree Theta(B^2) in this draft's own construction --
  a plausible reconciliation this draft flags but does not resolve), OR
  (b) the real mechanism is NOT the two-pairs construction chosen here
  (i.e. the one-pair/Theta(B^2) alternative, or some other construction, is
  the intended one). This draft does not adjudicate between (a) and (b);
  it names the tension explicitly as a testable consequence of the choice
  made, per this task's constraints, rather than silently absorbing it.
  The frozen EXP-CREP-001 toy engine's own measured Theta(B^3) online cost
  (execution-report.yaml, per DEC-20260830-6f28e0) is a fact about the
  EIGHT AS-BUILT ROUTES' combinatorial engine, independently and
  mechanically explained by their shared atomic fold-in edge
  (materialize_resultant_coefficients, exponent 3) regardless of this
  draft's real-mechanism reconstruction; this draft does not change that
  finding and is not in tension with it, since the toy engine's Theta(B^3)
  concerns a DIFFERENT (combinatorial, not curve-algebraic) object, a
  distinction already established and disclaimed by
  CAL-PASS-CREP-001's own docstring (internal, retrieved) and reaffirmed
  independently by all three prior derivation rounds cited in this task's
  read_scope.

named_residual_gaps: |-
  (1) The choice between this draft's two-pairs/Theta(B^4) reconstruction
  and the rejected one-pair/Theta(B^2) alternative is a textually-grounded
  CHOICE, not a proof that the one-pair reading is mathematically
  impossible; see decision-record-among-alternatives.yaml for the full
  argument and its honestly-disclosed limits.
  (2) main_theorem's converse direction (Part 2) is proved conditionally on
  a named, explicit, checkable non-degeneracy hypothesis (H-RCREP-1), not
  unconditionally for every stratum combination; the worked example checks
  it concretely for ONE fibre (x_12=6) including one genuine tangent-type
  degeneracy, not exhaustively for every combination of the six named
  strata at general B.
  (3) The 'identity' and 'infinity' marker degeneracy rules
  (strata_and_saturation) are stated as a mechanism (degenerate
  specialisation of S_3 to S_2) but not verified on a worked numeric case
  in this draft.
  (4) The 'vertical' marker's saturation convention (projective/homogenised
  resultant tracking a root at infinity) is stated but not symbolically
  worked through in full generality.
  (5) This draft does not determine whether the frozen EXP-CREP-001
  engine's declared Theta(B^2) figure for r_R should be reinterpreted as
  referring to g_12 alone, or whether the real mechanism differs from this
  draft's reconstruction entirely (relationship_to_frozen_engine, point 2).
  These are named explicitly, not left as silent gaps, per this task's
  honesty requirement.

