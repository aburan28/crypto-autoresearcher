discharge_note_purpose: >-
  Item-by-item check of rcrep-candidate-definition.yaml against every named
  element of RT103-C1, with an explicit discharged / partially_discharged /
  open status and a reason for each. No item is silently omitted, per this
  task's constraints. This map itself is written to be checkable
  independently of the producer's own prose (an independent reader is
  expected to re-derive each verdict from rcrep-candidate-definition.yaml
  alone, not from this file, per the review_plan's blind_rederivation
  requirement).

items:
  - item_id: RT103-C1-01
    name: definition_of_g_I
    status: discharged
    reason: >-
      deck_defining_polynomials in rcrep-candidate-definition.yaml gives an
      explicit closed-form definition g_I(T) = product over deck-I
      occurrences of (T - t_a), squarefree by the stated distinct-label
      convention on deck I (matching H-CREP-001.yaml's own statement that
      distinct public fifth-occurrence labels are the roots of squarefree
      g_I). This is fully self-contained (no external lookup, no oracle)
      and checkable by direct inspection of any concrete deck-I occurrence
      list.

  - item_id: RT103-C1-02
    name: definition_of_r_R
    status: discharged
    reason: >-
      pair_deck_construction and final_pair_pair_relation_and_r_R give an
      explicit closed-form construction of r_R(T) as a two-stage iterated
      Sylvester resultant of the four deck-defining polynomials g_1..g_4
      against the fixed joint relation S_3, with every intermediate object
      (g_12, g_34, R_1) named and defined. This is the single largest gap
      RT103-O1 identified ('complete-chart intersection resultant is an
      untyped macro here') and this draft directly supplies the missing
      formula. The choice among the disclosed one-pair/two-pairs ambiguity
      is made explicitly (two-pairs/Theta(B^4)), not left open; see
      decision-record-among-alternatives.yaml for the justification, which
      this discharge status depends on being accepted by independent
      review as principled rather than circular.

  - item_id: RT103-C1-03
    name: definition_of_z_R
    status: discharged
    reason: >-
      z_R_definition gives z_R(T) := gcd(g_I(T), r_R(T)) in F_p[T], with an
      explicit, elementary argument (gcd of a squarefree polynomial with
      anything is squarefree) for why z_R is automatically the exact,
      multiplicity-free support polynomial regardless of r_R's own
      multiplicity structure. This directly matches H-CREP-001.yaml's
      stated z_R = gcd(g_I, r_R) without modification.

  - item_id: RT103-C1-04
    name: source_occurrence_maps
    status: discharged
    reason: >-
      occurrence_record_semantics gives an explicit real-mechanism meaning
      for every field of a deck occurrence record (label, x-coordinate,
      sign as the y -> -y disambiguation, colour as a cosmetic tag, marker
      as one of the six named degeneracy classes), each tied to the
      corresponding field already present in the frozen toy engine
      (experiments/EXP-CREP-001/instances/generate_instances.py,
      make_occ), giving genuine algebraic content to fields the toy engine
      only used combinatorially.

  - item_id: RT103-C1-05
    name: projective_charts
    status: partially_discharged
    reason: >-
      strata_and_saturation's CHART paragraph names the chart explicitly
      (affine Weierstrass chart plus the point at infinity in the
      projective closure P^2, plus the sign chart from the hyperelliptic
      involution) and ties it to H-CREP-001's own phrase 'complete signed
      projective group-law chart'. This is a genuine, specific answer, not
      a restatement of the phrase in different words. It is marked
      PARTIALLY discharged rather than fully discharged because the draft
      does not carry out the full homogeneous/projective coordinate
      computation for r_R (it states the chart but computes r_R only in
      the affine chart, with the projective closure invoked only as the
      target of the saturation convention for degenerate strata, not as
      the primary computational setting throughout).

  - item_id: RT103-C1-06
    name: saturations
    status: partially_discharged
    reason: >-
      strata_and_saturation's VERTICAL paragraph gives an explicit,
      checkable saturation trigger (the leading coefficient (x1-x2)^2 of
      S_3, as a polynomial in the eliminated variable, vanishing exactly
      at x1=x2) and states the correct general principle (homogenise to
      track the resulting point-at-infinity root rather than losing
      degree silently). This is a real, specific saturation criterion, not
      a placeholder. It is NOT fully discharged because this draft does
      not carry out the homogenised resultant computation symbolically for
      a concrete vertical-degeneracy case (worked_example's degeneracy is
      a TANGENT case, i.e. a repeated root, not a VERTICAL case, i.e. a
      leading-coefficient vanishing / degree-drop); the vertical/vanishing-
      leading-coefficient saturation mechanism is stated but not
      numerically exercised in this draft.

  - item_id: RT103-C1-07
    name: multiplicities
    status: discharged
    reason: >-
      strata_and_saturation's REPEATED and NONREDUCED paragraphs give an
      explicit account of how deck-level label repetition and
      tangent/degenerate root-doubling propagate multiplicatively through
      the iterated-resultant construction (citing the elementary fact
      Res(f1*f2,h) = Res(f1,h)*Res(f2,h)), and z_R_definition explains
      precisely why this multiplicity structure never affects z_R's ROOT
      SET (the only claim H-CREP-001 actually makes -- an exact SUPPORT
      claim, not a multiplicity-matching claim). The scope of this
      discharge is explicitly bounded: it discharges 'multiplicities do
      not threaten the exact-support claim', not 'r_R's multiplicity at
      every root has been computed and matches a specific expected count'
      -- no such stronger claim is made by H-CREP-001 or by this draft.

  - item_id: RT103-C1-08
    name: exceptional_strata_definitions
    status: partially_discharged
    reason: >-
      All six markers named in the frozen toy engine (normal, tangent,
      vertical, repeated, identity, infinity) are given an explicit real-
      mechanism definition in strata_and_saturation, each tied to a
      specific, checkable algebraic condition (equal points for tangent,
      equal x-coordinates with opposite sign for vertical, the identity
      point O for identity/infinity, deck-level label repetition for
      repeated). This is a complete NAMING and MECHANISM for every stratum
      RT103-C1 lists. It is marked partially rather than fully discharged
      because two of the six strata (identity/infinity) are given a stated
      mechanism (degeneration of S_3 to S_2) that is NOT verified on a
      worked numeric case anywhere in this draft (named explicitly in
      named_residual_gaps item 3); only the tangent stratum is both defined
      and numerically exercised (worked_example's g_34 double root).

  - item_id: RT103-C1-09
    name: proof_of_exact_support
    status: partially_discharged
    reason: >-
      main_theorem states and proves the support biconditional in two
      parts. Part 1 (extendible implies r_R(t_a)=0) is proved
      UNCONDITIONALLY, with a general argument (shared common roots force
      resultant vanishing, an unconditional fact of resultant theory) that
      holds for every stratum, not merely the generic one -- this half of
      the biconditional is fully discharged, generally, not just on the
      worked example. Part 2 (r_R(t_a)=0 implies extendible) is proved
      CONDITIONALLY on an explicit, named, checkable non-degeneracy
      hypothesis (H-RCREP-1: no relevant leading coefficient vanishes at
      t_a), which is the honest, standard form such a converse takes in
      resultant theory (the alternative to this hypothesis is not an
      unbounded unknown; it is a finite, explicitly computable exceptional
      locus). This is NOT the same as an unconditional general proof, and
      is not presented as one: the discharge status is PARTIAL because (a)
      the general argument sketch for Part 2 is not a fully worked,
      line-by-line symbolic derivation for arbitrary B and arbitrary
      stratum combinations, and (b) the worked_example verifies both
      directions concretely only on ONE fibre (x_12=6, T=4) of one B=1
      instance, including one genuine tangent-type degeneracy, not an
      exhaustive check across the six named strata. The honesty
      requirement of this task's handoff (check the biconditional
      explicitly on a small concrete example, both directions) is met by
      worked_example; the stronger requirement (prove the biconditional
      unconditionally for every stratum at every B) is NOT met and is not
      claimed to be met.

  - item_id: RT103-C1-10
    name: exact_source_replay_beyond_support
    status: open
    reason: >-
      RT103-C1's requirement is scoped to the support biconditional (item
      09) and the objects named above; it does not itself require a full
      replay-transcript construction (that is RT103-C6, a distinct control
      in the same red-team report, not named in this task's handoff or
      write_scope). This draft does not attempt RT103-C6 and this item is
      recorded OPEN rather than silently assumed satisfied, since
      main_theorem's extendibility witness (an explicit occurrence
      quadruple x1,x2,x3,x4) is a NECESSARY ingredient for replay but this
      draft does not construct the full positive/negative dyadic replay
      transcript RT103-C6 demands. Named here for completeness, not
      claimed discharged, and explicitly out of this task's scope per its
      own handoff (which names only RT103-C1's items).

summary_counts:
  discharged: 5
  partially_discharged: 4
  open: 1
  total_items: 10

overall_assessment: >-
  RT103-C1's core demand -- a self-contained formula for r_R plus a proved
  support biconditional, rather than an untyped macro -- is substantively
  met for the first time since 2026-07-22: g_I, r_R, and z_R now have
  explicit closed-form definitions, the projective/chart/saturation
  vocabulary is given real mathematical content rather than being restated
  in different words, and the support biconditional is proved
  unconditionally in one direction and conditionally (on an explicit, named,
  checkable hypothesis) in the other, verified concretely on a genuine
  hand-worked numeric example including one real degeneracy. What remains
  open is exhaustive verification across every named stratum combination at
  general B (a substantially larger undertaking than this bounded drafting
  task), and adjudication between this draft's construction and the
  rejected one-pair alternative by means other than textual reading of the
  primary source (which would require either an authoritative external
  specification or a further, different kind of mathematical argument this
  draft does not supply). This is reported plainly rather than smoothed
  into either 'fully discharged' or 'no progress'.
