note_on_reading_discipline: >-
  This session deliberately did not re-open build_packages.py,
  check_representation.py, or generate_instances.py (the toy engine),
  since DEC-20260830-680f6d already independently confirmed these declare
  Theta(B^2) verbatim without deriving it, and the toy engine's own
  witness rule is disclaimed as non-transferable syntactic Boolean-OR
  semantics (CAL-PASS-CREP-001's own docstring; part_8 of the decks23
  report). Instead this session opened the one primary source that
  actually contains algebraic content about the REAL, non-toy mechanism --
  the 2026-07-22 TASK-20260722-101 candidate_report.yaml and
  mechanism_note.md -- and reconstructed the underlying group-law
  construction from those sentences plus classical, kb-verified
  elimination theory (KN-TECH-002/007/013), since H-CREP-001 itself
  supplies only one sentence of mechanism and no formula.

part_1_the_only_algebraic_content_in_the_primary_source: >-
  mechanism_note.md (TASK-20260722-101, fact 4) states the exact relation
  H-CREP-001.yaml's own mechanism field paraphrases: 'With two labelled
  pair decks D_12, D_34, a squarefree fifth-label polynomial g_I, and a
  fresh target R, the complete-chart intersection resultant satisfies
  r_R(t_a)=0 iff the labelled fifth occurrence a extends to a pair-pair
  relation, z_R(T) = gcd(g_I(T), r_R(T)) = product over extendible fifth
  labels a of (T - t_a).' The same file's Derivations section adds:
  'Componentwise computation performs B degree-B^2 tests. Representing
  one degree-B^2 polynomial over a width-B split label algebra also gives
  B^3 base-field coordinates.' These two sentences are the ONLY places in
  the entire pinned corpus (traced end to end by DEC-20260830-680f6d) that
  say anything beyond the bare headline number. Neither sentence contains
  a formula, an elimination step, or a variable count. Everything below
  this point is this session's own first-principles reconstruction of
  what algebraic system these sentences must describe, not a quotation.

part_2_reconstruction_of_the_real_mechanism: >-
  g_I(T) is squarefree of degree Theta(B) with roots equal to the labels
  of one deck (H-CREP-001's 'fifth' deck, deck I) -- structurally this is
  exactly a FACTOR-BASE DEFINING POLYNOMIAL: T ranges over B candidate
  x-coordinates, one per admissible occurrence in deck I. 'Complete signed
  projective group-law chart' plus 'identity, infinity, tangent, vertical,
  repeated, and nonreduced strata' (H-CREP-001.yaml assumptions) is
  standard vocabulary for the chord-tangent elliptic-curve ADDITION LAW
  and its degeneracies -- exactly the setting Semaev's summation
  polynomials were built to encode (KN-TECH-002, KN-LIT-001, established/
  reported confidence, kb). 'D_12, D_34' paired with 'pair-pair relation'
  and a 'fifth' occurrence is the standard index-calculus decomposition
  shape: test whether a fresh point/label extends a partial sum built
  from two auxiliary 'combined' quantities, each itself built by pairing
  two factor-base elements. This session therefore reconstructs the
  minimal concrete system consistent with every stated property: two
  disjoint decks, call them deck A and deck B, each with a squarefree
  degree-Theta(B) factor-base-defining polynomial G_A(x_A), G_B(x_B)
  (the same TYPE of object as g_I, one level down); a fixed,
  B-INDEPENDENT joint relation Phi(x_A, x_B, x_AB) encoding 'points with
  these x-coordinates combine to give combined x-coordinate x_AB', for
  which the concrete, kb-verified instance is Semaev's S_3(x_A,x_B,x_AB)
  (degree exactly 2 in EACH of its three variables, KN-TECH-002); and a
  second fixed, B-independent relation Psi(x_AB, T) connecting the
  combined-pair variable to the fifth-occurrence variable T (the
  'pair-pair relation' r_R is declared to test against T). This
  reconstruction is FLAGGED explicitly as an inference, not a quoted
  fact: H-CREP-001 does not itself name Semaev, resultants, or any joint
  relation anywhere (confirmed absent by DEC-20260830-680f6d/6f28e0), and
  it is offered as the most standard, well-established real-world
  technique consistent with every stated property, per the task's own
  instruction to reconstruct 'from mathematical first principles' rather
  than default to the toy engine.

part_3_the_two_degree_b_objects_and_the_elimination: >-
  The two degree-B algebraic objects are G_A(x_A) and G_B(x_B): squarefree
  polynomials of degree exactly Theta(B) (one root per admissible
  occurrence in deck A, respectively deck B), independently varying in
  the sense that deck A's and deck B's occurrence sets carry no shared
  algebraic structure (they are disjoint, independently generated source
  decks per H-CREP-001's assumptions). The elimination: F_AB(x_AB) :=
  Res_{x_A}( G_A(x_A), Res_{x_B}( G_B(x_B), S_3(x_A, x_B, x_AB) ) ).
  Step 1 (eliminate x_B): treat S_3 as a polynomial in x_B of degree 2,
  with coefficients of degree <=2 in x_A and <=2 in x_AB (KN-TECH-002's
  explicit S_3 formula, degree 2 in each variable, independently
  confirmed by direct term-by-term inspection of the formula quoted
  there: (x1-x2)^2*x3^2 - 2*((x1+x2)*(x1*x2+a)+2b)*x3 + ((x1*x2-a)^2 -
  4b(x1+x2)), which is degree 2 in x1, degree 2 in x2, and degree 2 in x3
  by direct expansion). The classical Sylvester resultant degree bound
  (recalled, standard: for F(x) of degree m depending only on x, and H(x)
  of degree n in x with coefficients of degree <= d_t in an external
  parameter t, deg_t(Res_x(F,H)) <= m*d_t) gives deg_{x_A}(Res_{x_B}(G_B,
  S_3)) <= B*2 = 2B and deg_{x_AB}(Res_{x_B}(G_B,S_3)) <= B*2 = 2B. Call
  this intermediate object R_1(x_A, x_AB).
  Step 2 (eliminate x_A): applying the same bound to Res_{x_A}(G_A(x_A)
  [degree B], R_1(x_A,x_AB) [degree 2B in x_A, degree 2B in x_AB]) gives
  deg_{x_AB}(F_AB) <= B*(2B) = 2*B^2. So F_AB(x_AB) is a genuine,
  directly-computed, degree-Theta(B^2) polynomial: eliminating TWO
  independently-varying degree-B factor-base polynomials against a FIXED
  (B-independent) low-degree joint relation multiplies the degree, it
  does not add it -- this is the textbook Bezout/resultant-degree
  behaviour the dispatch handoff names, verified here with an explicit
  degree bound derived from a kb-sourced, explicit formula (KN-TECH-002),
  not asserted from memory alone.

part_4_from_x_ab_to_r_r_of_t_without_a_second_b_squared_factor: >-
  r_R is declared as a polynomial in T (the SAME variable g_I is a
  polynomial in), not in x_AB. The second, fixed relation Psi(x_AB, T)
  (part_2) connects them. Applying the SAME resultant bound to
  r_R(T) := Res_{x_AB}( F_AB(x_AB) [[degree ~2B^2 in x_AB, degree 0 in T]],
  Psi(x_AB,T) [[degree d_1=O(1) in x_AB, degree d_2=O(1) in T]] ) gives
  deg_T(r_R) <= deg_{x_AB}(F_AB)*deg_T(Psi) + deg_{x_AB}(Psi)*deg_T(F_AB)
  = (2B^2)*d_2 + d_1*0 = 2*d_2*B^2. Because Psi is a FIXED, B-independent
  relation (its degree in x_AB and in T does not grow with B -- it only
  encodes a single further group-law addition/negation test, e.g. another
  instance of a Semaev-type S_2 or S_3 relation), this second elimination
  step does NOT compound the exponent: it multiplies F_AB's ALREADY-
  Theta(B^2) degree by only a CONSTANT (d_2), leaving r_R at
  Theta(B^2) overall, matching H-CREP-001's declared figure exactly, not
  merely in order of magnitude by coincidence but as a directly-computed
  consequence of the two-stage elimination structure. This is the key
  fact that makes a Theta(B^2) r_R mathematically coherent with a
  five-deck construction: the SECOND stage (folding x_AB against T) costs
  only a constant multiplicative factor precisely because T is not itself
  drawn from an independent degree-growing elimination at that stage --
  it is the single free search variable the whole construction solves for.

part_5_why_this_is_not_reducible_no_known_redundancy_found: >-
  Two independent checks, neither assumed: (i) COLLISION HEURISTIC (named,
  numbered H1 below): with N = B^5 (H-CREP-001's own scaling), the ~2B^2
  candidate x_AB roots of F_AB behave, under the standard heuristic that
  models algebraically-generated field elements as approximately uniform
  in a field of size ~N (the same heuristic class underlying Pollard rho
  and the generic-group model H-CREP-001 itself cites, KN-LIT-011/
  KN-TECH-005), like ~2B^2 draws from a size-N population; expected
  coincidental collisions ~ (2B^2)^2 / N = 4*B^4/B^5 = 4/B, vanishing as B
  grows -- i.e. no systematic root-sharing is expected to collapse F_AB's
  degree below Theta(B^2) for generic/random factor-base and curve data.
  (ii) SPARSE-ELIMINATION CHECK (kb, not this session's own finding): this
  exact program has already investigated whether Semaev-summation-
  polynomial systems admit a BKK/mixed-volume degree reduction below the
  dense Bezout/resultant bound (KN-TECH-007, established confidence,
  citing RQ-BKK-001/RQ-BKKMV-001/KN-OPEN-004) and recorded that the
  relevant Newton polytopes were found SATURATED (full box support), so
  MV = Bezout and sparse elimination 'gives nothing' -- i.e. no already-
  discovered structural sparsity in this exact family of systems permits
  beating the dense B^2 count. Both checks are consistent with the B^2
  degree being genuine (a real count of generically-distinct roots) and
  not an artifact hiding a smaller true count underneath.

part_6_degenerate_case_check_b_equals_1: >-
  At B=1, deck A has exactly one occurrence with x-coordinate a
  (G_A(x)=x-a, degree 1=B) and deck B has exactly one occurrence with
  x-coordinate b (G_B(x)=x-b, degree 1=B). Because G_A, G_B are LINEAR,
  eliminating them is literal substitution, not an approximation:
  Res_{x_B}(x_B-b, S_3(x_A,x_B,x_AB)) = S_3(x_A,b,x_AB) exactly (degree 2
  in x_AB, matching the formula's prediction 2B=2 exactly); then
  Res_{x_A}(x_A-a, S_3(x_A,b,x_AB)) = S_3(a,b,x_AB) exactly (degree 2 in
  x_AB, matching 2*B^2=2 exactly). S_3(a,b,x_AB)=0 is literally the
  defining equation for the (up to) two x-coordinates x_AB of P_A+P_B and
  P_A-P_B, for the two fixed points with x-coordinates a and b -- this is
  independently, geometrically meaningful (not merely a formula output):
  with exactly one choice each for P_A and P_B there are genuinely, by
  the group law itself, exactly two candidate combined x-coordinates
  (the plus-sum and the minus-sum, since x-coordinates cannot distinguish
  a point from its negation), and both are real, non-redundant roots for
  generic a, b. This confirms the degree-2*B^2 prediction exactly at the
  smallest exercisable size, by an independent geometric argument, not
  only by symbolic substitution -- satisfying the task's required
  degenerate-case control.

part_7_nearby_object_method_ceiling_control_two_conics: >-
  Classical control (recalled, standard algebraic geometry, cross-checked
  against KN-TECH-007's kb-recorded definition of 'the Bezout number
  (product of total degrees)'): two plane conics C1(x,y)=0, C2(x,y)=0,
  each of total degree 2, intersect (with multiplicity, over an
  algebraically closed field, in general position with no shared
  component) in EXACTLY deg(C1)*deg(C2) = 2*2 = 4 points -- the textbook
  tight Bezout number. Applying THIS session's own crude Sylvester-
  resultant bound to the SAME pair (eliminate y between C1 and C2, each
  of degree <=2 in y with coefficients of degree <=2 in x):
  deg_x(Res_y(C1,C2)) <= deg_y(C1)*deg_x(C2) + deg_y(C2)*deg_x(C1) =
  2*2 + 2*2 = 8 -- a factor of 2 LOOSER than the true tight number (4),
  because the crude per-variable Sylvester bound does not exploit that
  C1, C2 have bounded TOTAL degree (it treats the x-degree and y-degree
  parts as independently worst-case). METHOD-CEILING CONCLUSION, honestly
  disclosed: the degree-multiplication argument used in parts 3-4 is a
  sound, textbook-consistent UPPER BOUND that correctly identifies the
  EXPONENT (Theta(B^2), just as the crude bound correctly identified
  'order 4' for the conics, i.e. within a constant factor of the tight
  Bezout number) but is not guaranteed to produce the tightest possible
  LEADING CONSTANT. This session's central claim is therefore made and
  should be read at the Theta()/exponent level, not as an exact constant
  claim -- consistent with H-CREP-001's own predictions field, which
  states exponents in B, not constants.

part_8_named_residual_scope_boundary_not_resolved_here: >-
  The reconstruction in parts 2-4 accounts for r_R via exactly ONE
  genuine two-object elimination (decks A, B) plus one constant-degree
  fold against the free variable T. H-CREP-001's own wording, 'pair-PAIR
  relation' together with its five-deck count, is also compatible with a
  LITERALLY SYMMETRIC reading in which BOTH named pairs (D_12 AND D_34,
  i.e. four decks, not two) are independently, fully eliminated via their
  own resultant machinery before being jointly folded together. This
  session computed that alternative explicitly as a check: eliminating a
  SECOND independently-varying degree-B^2 combined object (F_CD, built
  from decks C, D exactly as F_AB was built from A, B) against F_AB via a
  further FIXED-degree joint relation gives, by the SAME resultant-degree
  bound applied twice more (deg <= deg(F_CD)*deg(intermediate) then
  deg(F_AB)*deg(that)): Theta(B^2)*Theta(B^2) = Theta(B^4) in T -- TWO
  exponents higher than the declared Theta(B^2). H-CREP-001.yaml does not
  specify which of these two structurally different readings (one pair
  eliminated, versus two pairs jointly eliminated) describes the intended
  real construction, and this session cannot resolve that choice from the
  pinned corpus (the only two sentences of mechanism text, quoted in
  part_1, are compatible with either). This is disclosed as a named,
  precise, forward-facing scope boundary on the confirmation below, not
  swept aside: the confirmed derivation is for the ONE-PAIR reading,
  which is the reading that (a) matches H-CREP-001's own declared figure
  exactly, (b) matches the task handoff's own framing verbatim
  ('eliminating a shared variable between two independently-varying
  degree-B algebraic objects'), and (c) is independently corroborated by
  part_9's reconciliation with the corpus's separately-declared Theta(B^3)
  'componentwise' baseline. It is NOT a claim that the two-pairs / B^4
  reading is false; only that this session's positive confirmation is
  scoped to the reading it can verify matches the declared figure.

part_9_reconciliation_with_the_declared_theta_b_cubed_componentwise_baseline: >-
  mechanism_note.md's Derivations section separately states: 'Componentwise
  computation performs B degree-B^2 tests', i.e. B * B^2 = B^3 total,
  matching the corpus-wide baseline that all eight frozen EXP-CREP-001
  routes are said to exceed. Under the one-pair reconstruction (parts 3-4),
  this is INTERNALLY CONSISTENT, not competing evidence for a different
  r_R degree: r_R itself (Theta(B^2), a SINGLE global object, as derived)
  is exactly the 'degree-B^2 test' named in that sentence; the outer
  factor of B is a SEPARATE, naive per-candidate loop (e.g. iterating the
  naive/componentwise strategy once per candidate T value or per some
  other non-eliminated quantity, rather than computing r_R symbolically
  once as a compact object and extracting its roots via one fast gcd
  against g_I). This reconciliation is offered as a consistency check
  supporting the one-pair reading (part_8): it requires no additional,
  unstated multiplicative factor beyond 'r_R has degree B^2, and the
  naive approach evaluates an equivalent test B times over' -- exactly
  the sentence's own arithmetic (B times B^2 equals B^3), with no need to
  invoke a further B^4-scale object anywhere in the naive baseline.

