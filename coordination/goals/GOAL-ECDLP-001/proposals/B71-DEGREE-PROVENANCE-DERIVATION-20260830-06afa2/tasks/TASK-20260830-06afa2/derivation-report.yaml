  H-CREP-001.yaml does not specify (i) an explicit formula for r_R in
  terms of any joint relation, resultant, or elimination step -- the
  entire algebraic reconstruction in parts 2-4 is this session's own
  first-principles inference from two sentences in a different pinned
  document (TASK-20260722-101), not a quotation; (ii) whether the real
  construction eliminates one pair of decks (predicting genuine
  Theta(B^2), part_3-4, matching the declared figure) or two pairs
  jointly (predicting genuine Theta(B^4), part_8, a derived mismatch with
  the declared figure); (iii) the exact identity of the 'fixed, low-degree
  joint relation(s)' Phi and Psi this session modelled via Semaev's S_3 --
  H-CREP-001 never names Semaev polynomials, resultants, or any specific
  elliptic-curve addition-law formula anywhere. This is the precise,
  named gap a future round would need to close (most directly, by
  locating or authoring an explicit formula for r_R in terms of g_I and
  the deck occurrence data, e.g. by extending IDEA-20260723-001's own
  underlying construction notes if any exist beyond what TASK-20260722-101
  already discloses) to move from 'the declared figure matches one
  coherent, checked reconstruction out of at least two' to a fully closed
  answer.

confidence_statement: >-
  High confidence (kb-verified degree formula, degenerate-case check, and
  nearby-object control all agree) that a genuine, non-artifactual
  Theta(B^2) DOES arise from eliminating two independently-varying
  degree-B factor-base polynomials against a fixed low-degree elliptic-
  curve joint relation, and that no known redundancy (collision heuristic,
  BKK/sparse elimination per this program's own KN-TECH-007 finding)
  reduces it. Moderate-to-low confidence that this ONE-PAIR construction,
  rather than the TWO-PAIRS construction of part_8 (which this session's
  own arithmetic shows would predict Theta(B^4) instead), is what
  H-CREP-001's real, non-toy r_R actually is, because H-CREP-001 supplies
  no formula distinguishing the two and this session's preference for the
  one-pair reading rests on matching the declared figure and the task's
  own wording, not on an independent derivation ruling out the two-pairs
  reading. This confidence split is carried into outcome-card.yaml
  verbatim, not smoothed into a single unqualified number.
