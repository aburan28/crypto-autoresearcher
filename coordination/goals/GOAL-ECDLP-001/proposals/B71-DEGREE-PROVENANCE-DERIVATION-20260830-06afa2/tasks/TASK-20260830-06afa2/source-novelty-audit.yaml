external_sources_consulted:
  - id: sylvester-resultant-degree-bound
    description: >-
      Classical resultant-degree fact: for F(x) of degree m (independent
      of an external parameter t) and G(x) of degree n in x with
      coefficients of degree <=d_t in t, deg_t(Res_x(F,G)) <= m*d_t.
      Standard computational-algebra result (e.g. von zur Gathen and
      Gerhard, Modern Computer Algebra, resultant chapters); the same
      general class of fact the prior e30c67 round flagged as recalled
      and excluded from its own load-bearing claims.
    provenance: recalled
    provenance_caveat: >-
      Not independently retrieved via WebSearch/WebFetch this session.
      UNLIKE the prior round's treatment of the analogous fact, THIS
      claim IS load-bearing here, so it was verified indirectly rather
      than left as a bare recollection: it was applied to Semaev's
      EXPLICIT, kb-sourced S_3 formula (KN-TECH-002) and its output was
      independently checked against a fully worked degenerate case (B=1,
      derivation-report.yaml part_6, where the resultant computation
      reduces to literal polynomial substitution and its result is
      cross-checked against an independent geometric fact about point
      addition/negation, not just symbolic re-application of the same
      recalled formula) and against a classical nearby object (two
      conics, part_7, where the TRUE answer, Bezout's theorem giving
      exactly 4 points, is itself a textbook fact independent of the
      resultant formula and used to bound the resultant formula's own
      looseness). This two-sided check (kb-sourced base case plus an
      independently-derivable degenerate case and an independently-known
      nearby answer) is the verification route this recalled fact was
      given, in place of a live retrieval, consistent with the dispatch
      handoff's instruction to verify load-bearing recalled claims via
      the internal corpus or bounded retrieval.
  - id: bezout-two-conics-four-points
    description: >-
      Classical fact: two plane conics (degree 2 each) intersect, over an
      algebraically closed field, with multiplicity, in general position
      with no shared component, in exactly deg(C1)*deg(C2)=4 points.
      Textbook algebraic geometry (Bezout's theorem for plane curves).
    provenance: recalled
    provenance_caveat: >-
      Not independently retrieved this session; used only as the nearby-
      object method-ceiling control (proof-search-map.yaml
      method_ceiling), cross-checked against KN-TECH-007's own kb-recorded
      definition of 'the Bezout number (product of total degrees)', which
      independently corroborates the general shape of this fact (though
      KN-TECH-007 does not itself state the specific '4' for two conics).

reconstruction_dependency_disclosure: >-
  The single largest interpretive step in this session is NOT a classical-
  theory citation but an INFERENCE: that H-CREP-001's one-sentence
  mechanism ('two labelled pair decks D_12, D_34 ... pair-pair relation')
  is best modelled as an index-calculus-style Semaev-summation-polynomial
  decomposition system. H-CREP-001.yaml itself never names Semaev,
  summation polynomials, resultants, or any specific elliptic-curve
  addition-law formula anywhere in its mechanism, assumptions, or
  structural_ingredients fields (independently re-confirmed this session
  by a full read, not merely a keyword grep). This reconstruction is
  offered as the standard, well-established real-world realisation
  consistent with every stated property of H-CREP-001's construction
  (chord-tangent group-law strata, single-variable g_I/r_R/z_R structure,
  pair-based decomposition language), per the task's explicit instruction
  to reason from first principles about the real elliptic-curve
  construction rather than default to the toy engine or re-read files
  already confirmed to declare the figure without deriving it. It is
  disclosed here, plainly, as an inference this session made, not a fact
  retrieved from any pinned record.

overlap_and_duplication_audit:
  against_prior_two_rounds_e30c67_and_789280: >-
    Both prior rounds (pairproduct-telescoping and decks23-interleaved)
    explicitly named the Bezout/non-dedup-accounting ambiguity as an open
    question they did NOT resolve, and both flagged the classical
    Bezout-elimination-degree fact as recalled-only, excluded from any
    load-bearing claim. This session is the first to (a) retrieve and use
    the program's OWN kb-recorded, explicit Semaev degree formula
    (KN-TECH-002) and BKK/sparse-elimination finding (KN-TECH-007) as
    load-bearing evidence rather than leaving the classical fact
    unverified, and (b) carry the computation through to an explicit,
    checked numerical prediction (Theta(B^2) for one reading,
    Theta(B^4) for another), rather than stating the ambiguity in
    qualitative terms only. This is a genuinely different method from
    both prior rounds, not a restatement.
  against_the_toy_model_and_dedup_lists: >-
    This session makes no construction claim and proposes no route
    package, so it cannot be a renamed BATCH-002 forbidden payload or a
    P1553/P1513 duplicate-owner match; it is a structural fact about the
    REAL (non-toy) elliptic-curve construction's degree, explicitly
    distinguished throughout from the toy engine's own semantics (which
    the decks23 report already showed implies a DIFFERENT, O(B) natural
    degree, a tension named but not resolved in this record's part_8/
    named_missing_specification).

novelty_status: adaptation
novelty_status_reasoning: >-
  The underlying mathematical technique (Semaev summation-polynomial
  resultant elimination and its degree theory) is well-established and
  already recorded in this program's own knowledge corpus (KN-TECH-002,
  KN-TECH-007, KN-TECH-013, KN-LIT-001, KN-LIT-004) with confidence levels
  ranging from established to reported. This session's contribution is
  APPLYING that already-known theory as a first-principles reconstruction
  lens for an internally under-specified construction (H-CREP-001's r_R),
  and computing an explicit, checked numerical consequence
  (Theta(B^2) versus Theta(B^4) depending on a named specification
  choice) that neither of the two prior analytical rounds on this exact
  question produced. This is therefore recorded as adaptation, not known
  (the specific application to H-CREP-001/KN-OPEN-73f0f4 has no exact
  precedent in the pinned corpus, confirmed by the overlap audit above)
  and not speculative/novel (the underlying mathematics is textbook and
  already catalogued in this program's own knowledge base, not new math).
