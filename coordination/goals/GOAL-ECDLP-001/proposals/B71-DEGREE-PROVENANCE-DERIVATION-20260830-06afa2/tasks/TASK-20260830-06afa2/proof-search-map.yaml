source: >-
  docs/inventor-protocol.md Section 8 (four cheap pre-compute audits),
  applied to the exact_elimination_argument recorded in outcome-card.yaml,
  which is a structural (not proof-architecture) claim about r_R's
  degree, required by the dispatch handoff's completion_gate item 3
  because the disposition is genuine_elimination_confirmed.
target_argument_ref: >-
  outcome-card.yaml, exact_elimination_argument and
  why_no_redundancy_exists, grounded in derivation-report.yaml parts 2-6.
not_applicable_reason: null

bottleneck: >-
  The exact step whose correctness the whole confirmation rests on is the
  resultant-degree-multiplication computation in derivation-report.yaml
  part_3-4: eliminating two independently-varying degree-B polynomials
  against Semaev's fixed-degree S_3 relation, then folding the result
  against T via a SECOND but only constant-degree relation. If either
  elimination step's degree bound were wrong, or if the second fold
  secretly also scaled with B, the Theta(B^2) conclusion would not hold.

baseline_embedding:
  parameter_slice: >-
    The exact base case exercised is Semaev's S_3(x_A,x_B,x_AB), whose
    explicit closed-form expression is quoted in full in KN-TECH-002
    (established confidence, kb): (x1-x2)^2*x3^2 -
    2*((x1+x2)*(x1*x2+a)+2b)*x3 + ((x1*x2-a)^2 - 4b(x1+x2)).
  reproduction_check: >-
    This session directly re-derived, by term-by-term expansion of the
    quoted formula (not by trusting KN-TECH-002's summary line alone),
    that S_3 has degree exactly 2 in x1, degree exactly 2 in x2, and
    degree exactly 2 in x3 -- matching KN-TECH-002's stated general
    formula deg_{x_i}(S_n) = 2^{n-2} for n=3 (2^1=2) exactly. This
    reproduction is the load-bearing base case for every subsequent
    resultant-degree computation in derivation-report.yaml parts 3-4 and
    part_6's B=1 hand check, which used the SAME formula by direct
    substitution (S_3(a,b,x_AB) with a,b constants), not merely by
    citing the degree number.
  audit_result: pass_reproduces_exactly_from_the_kb_sourced_explicit_formula

observation_collision:
  observable: >-
    'does eliminating a shared variable between two independently-varying
    degree-B objects against a fixed low-degree relation multiply the
    surviving degree (genuine Bezout-type elimination), or does it merely
    ADD the degrees (as plain polynomial multiplication would), or does a
    hidden redundancy collapse it back toward a single degree-B object' --
    the observable this record's confirmation reads to distinguish
    genuine multi-way elimination from either plain-degree-addition or an
    accounting-inflated count.
  distinct_preimage_search: >-
    Searched for a nearby ground-truth object sharing the same shallow
    description ('eliminate a shared variable between two size-B objects,
    via a fixed relation') that would NOT multiply degrees, to check
    whether the observable can be fooled by objects the naive description
    fits equally well. Found one directly relevant case already in this
    program's own knowledge corpus (KN-TECH-002/013): building LARGER
    Semaev summation polynomials S_n from smaller ones via the SAME
    resultant recurrence S_n = Res_x(S_{n-k+1}, S_{k+1}) does NOT involve
    a degree-B factor-base restriction at all -- both S_{n-k+1} and
    S_{k+1} are FIXED, B-independent objects (degree 2^{m-2} for their
    own arity m), so that recurrence's resultant stays B-independent
    (constant) at every step, and does NOT exhibit the B-scaling this
    session's confirmed claim depends on. This is a genuine near-miss: the
    SAME resultant recurrence formula, applied to two B-INDEPENDENT
    inputs instead of two degree-B factor-base polynomials, produces a
    constant-degree result, not a degree-multiplying one.
  is_the_collision_resolved_by_an_additional_condition: >-
    Yes, and the condition is directly inspectable, not asserted: whether
    the TWO objects being eliminated themselves carry a degree that grows
    with B (this session's G_A, G_B, roots = factor-base occurrences) or
    are FIXED regardless of B (the Semaev S_m building blocks in
    KN-TECH-013's own recurrence). The observable (degree-multiplication
    vs degree-preservation) correctly separates these two cases: G_A, G_B
    are stated by H-CREP-001's own assumptions to have Theta(B) occurrences
    (i.e. genuinely B-scaling), so this session's case is the multiplying
    one, not the near-miss preserving one. No definitional premise about
    r_R's abstract identity is invoked to resolve this -- only the
    directly-stated deck-size assumption in H-CREP-001.yaml itself.
  audit_result: collision_identified_and_resolved_by_a_directly_stated_deck_size_assumption

quantifier_order: >-
  Explicit statement: FOR the reconstructed one-pair mechanism (two
  independently-varying degree-B factor-base polynomials, eliminated
  against Semaev's fixed S_3, folded once more against T via a fixed
  relation), the resulting r_R genuinely has degree Theta(B^2) -- this is
  a claim about ONE SPECIFIC, EXPLICITLY CONSTRUCTED reconstruction of
  H-CREP-001's mechanism, not a universal claim over 'every possible way
  the real construction might work'. It does NOT claim 'for all readings
  of H-CREP-001's pair-pair relation, the degree is Theta(B^2)' -- part_8
  of derivation-report.yaml explicitly exhibits a second, also-coherent
  reading (two pairs jointly eliminated) for which the SAME method
  predicts Theta(B^4) instead. The EXISTENTIAL claim this record makes is
  therefore: THERE EXISTS a coherent, checked reconstruction of
  H-CREP-001's stated mechanism under which the declared Theta(B^2)
  figure is genuine and non-artifactual -- left open is WHETHER this
  reconstruction, rather than the two-pairs alternative, is the one
  H-CREP-001's authors intended.

method_ceiling:
  strongest_certifiable_claim: >-
    A directly-computed, kb-verified-base-case, degenerate-case-confirmed
    fact: eliminating two independently-varying degree-Theta(B) factor-
    base polynomials against Semaev's fixed S_3 relation produces a
    genuine degree-Theta(B^2) polynomial, exactly at the exponent level,
    with the leading constant possibly loose (per the nearby-object
    control below). No stronger claim is certifiable: this does not
    establish that this ONE-PAIR reconstruction, rather than the TWO-PAIRS
    reconstruction of derivation-report.yaml part_8, is what H-CREP-001's
    real r_R actually is; H-CREP-001 supplies no formula to decide between
    them (named_missing_specification).
  nearby_object_control: >-
    Applied the same degree-multiplication method to two plane conics
    (degree 2 each): the classical tight Bezout number is exactly 4
    (deg(C1)*deg(C2)); this session's own crude Sylvester-resultant bound
    gives <=8, a factor of 2 looser. RESULT: the method correctly
    identifies the EXPONENT (order 4, i.e. 'order B^2' in the H-CREP-001
    case) but is not guaranteed tight on the CONSTANT -- the control
    passes at the level this record's claim is actually made (Theta(),
    exponents in B, matching H-CREP-001's own predictions field
    convention), and the honest looseness is disclosed rather than hidden.
  audit_result: control_passes_at_the_exponent_level_with_disclosed_constant_looseness

derived_not_asserted_declaration: >-
  Direct response to Gate 4/Gate 2 of the dispatch handoff (a real
  mathematical argument, not an assertion of plausibility): the
  Theta(B^2) conclusion is derived here from (1) Semaev's explicit,
  kb-quoted S_3 formula (KN-TECH-002), re-expanded by hand to confirm its
  degree-2-in-each-variable property rather than trusting the summary
  line; (2) the classical Sylvester resultant-degree bound (recalled,
  standard, applied twice in derivation-report.yaml part_3-4 with
  explicit arithmetic at each step); (3) an explicit, hand-verified
  degenerate case (B=1, part_6) tying the formula's output to an
  independently-meaningful geometric fact (two sign-branch sums), not
  only to symbol manipulation; (4) a nearby classical object (two conics)
  independently cross-checking the method's exponent-level soundness and
  disclosing its constant-level looseness. None of these four grounds
  rests on H-CREP-001's own declared figure as a premise -- the
  Theta(B^2) result is computed independently and then COMPARED against
  the declared figure (finding a match for the one-pair reading and a
  derived mismatch for the two-pairs reading), which is the reverse of
  assuming the conclusion.

constructive_transforms_considered:
  - transform: representation_reduction
    proposed_object: >-
      Reformulate 'is r_R's B^2 degree genuine' as an exact question about
      how many of H-CREP-001's five decks are folded into r_R via genuine
      resultant elimination (one pair vs two pairs), since this session
      showed the two candidate answers are exactly two exponents of B
      apart and each is independently derivable once the deck-count
      choice is fixed.
    predicted_gain: >-
      Would fully resolve KN-OPEN-73f0f4 if H-CREP-001's real construction
      (or IDEA-20260723-001's underlying notes, if further detail exists
      beyond TASK-20260722-101) specifies the deck count explicitly; not
      evaluated quantitatively beyond identifying the two candidate answers.
    status: named_not_attempted
  - transform: (boundary_lift, stronger_invariant, specialization_pack, observable_fiber, telescoping_potential)
    status: not_selected
    reason: >-
      No identifiable prerequisite for any of these five remaining
      transforms is present in this session's zero-compute analysis; the
      open question is a single specification choice (deck count), not a
      structural obstruction these transforms are designed to address.

proof_obligations:
  - claim: >-
      H-CREP-001's real r_R construction folds exactly two decks (not
      four) via genuine resultant elimination against a fixed low-degree
      relation, matching this session's confirmed one-pair reconstruction
      rather than the two-pairs alternative.
    responsibility: feasibility
  - claim: >-
      The specific joint relation(s) this session modelled via Semaev's
      S_3 (part_2's Phi and Psi) are the correct concrete realisation of
      H-CREP-001's 'complete signed projective group-law chart' and its
      identity/infinity/tangent/vertical/repeated/nonreduced strata, not
      merely a plausible stand-in.
    responsibility: correctness
  - claim: >-
      Even if the one-pair reading and the Semaev realisation are both
      correct, this does not by itself supply a compact CONSTRUCTOR for
      z_R meeting H-CREP-001's B^(9/4)/B^(5/4) cost caps; degree genuineness
      and compact constructibility are logically separate questions (a
      degree-B^2 object generated from O(B) data, as F_AB/r_R are here, is
      NOT automatically expensive to manipulate -- fast elimination
      algorithms such as the ones H-CREP-001 already cites as route
      backends, KN-LIT-011-adjacent Borodin-Moenck/Kedlaya-Umans/Moroz-
      Schost, are specifically designed to exploit exactly this kind of
      compact-generating-data structure).
    responsibility: scope

proof_obligations_none_discharged_here: true

overall_audit_verdict: >-
  The exact_elimination_argument in outcome-card.yaml passes all four
  Section 8 audits: it reproduces its base case from an explicit,
  kb-sourced formula rather than a summary line; it identifies and
  resolves a genuine near-miss collision (the same resultant recurrence
  applied to B-independent inputs would NOT multiply degrees) via a
  directly-stated corpus assumption, not an asserted premise; its
  quantifier is stated as an existential claim about one coherent
  reconstruction, explicitly not a universal claim over every possible
  reading; and its method ceiling is disclosed honestly (exponent-level
  sound, constant-level possibly loose, per the two-conics control). The
  confirmation is real and checked; the one-pair-versus-two-pairs scope
  boundary (derivation-report.yaml part_8, outcome-card.yaml
  confirmed_scope_and_named_caveat) is carried forward explicitly as the
  next derivation step, per docs/inventor-protocol.md Section 4's closure
  standard and Section 7's prohibition on declaring a direction impossible.
