blind_statement:
  schema: crypto.autoresearch.blind_statement.v1
  id: BLIND-P1553-TARGET-SHIFT-SUCCESSOR-20260827-6b69e4
  goal_id: GOAL-ECDLP-001
  packet_id: P1553-MIXED-RADIX-TARGET-SHIFT-SUCCESSOR-20260827-6b69e4
  recorded_at: "2026-08-27"
  quantity: >-
    Re-derive the signed four-deck interval, large-stratum F0 value
    injectivity, correlated-target threshold, exact query cap, decoder, and
    conditional MPZ exponent from this statement alone.
  setting:
    group: A prime-order ordinary generic group G=<P> of order N.
    target: Q=[x]P for fresh uniform canonical x in {0,...,N-1}.
    parameters:
      B: N^(1/5)
      r: ceil(log2(B))
      m: 2^r
      D: "{-m,...,-1,1,...,m}"
      C: sum_i=0^4 m^i
      L: m+m^2+m^3+m^4
      stratum: N>4L+1 and m>=2
    decks: >-
      For i=0,...,4, F_i contains labelled occurrences
      (i,d,sigma,[sigma*(d+1)*m^i]P) for 0<=d<m and
      sigma in {+1,-1}. The public map from each occurrence to its known
      signed integer coefficient is part of the construction.
    initial_target: R=Q+[C]P
    universal_witness: >-
      If x=sum_i=0^4 a_i*m^i is its canonical base-m expansion, the five
      all-positive occurrences d_i=a_i sum to [x+C]P=R.
  object_premise:
    - One target-independent universal exact ordinary-generic object accepts arbitrary public signed occurrence-labelled decks.
    - Its predicate is exactly stable under every canonical cumulative dyadic restriction of F0.
    - One advice string of at most ell=B^(9/4+o(1)) ordinary bits is fixed before Q; no live or opaque group handle crosses phases.
    - In one main phase, the F0 restrictions and every later correlated target query form one jointly correct adaptive transcript with nonvanishing complete-transcript success.
    - Every ordinary-generic operation, representation query, target construction, predicate internal, replay, decode, and verification step is included in one aggregate k=B^(5/4+o(1)); k never resets between target shifts.
    - No free Query2P1 oracle, target-conditioned advice, or extra oracle is available.
  reduction_statement:
    isolation: >-
      Canonical cumulative dyadic restriction isolates one F0 generic
      encoding in at most ceil(log2(2m))=r+1 predicate calls.
    injectivity_obligation: >-
      Prove that on N>4L+1 the isolated encoding uniquely determines its
      signed coefficient c0 in D from the public deck map, without assuming a
      separately returned occurrence label. State why this fails in collision
      strata such as m=2,N=3.
    residual_relation: >-
      The successful relation implies x+C-c0 is congruent to m*z modulo N for
      some z in [-L,L].
    correlated_targets: >-
      For t=0,...,2L+1 define R_t=R+[m*t]P and let q(t) be the exact predicate
      on singleton F0 and full F1,F2,F3,F4 at target R_t, inside the same
      jointly correct transcript.
    threshold_obligation: >-
      Prove q(t)=1 iff t<=L-z, including q(0)=1 and q(2L+1)=0, and show why
      N>4L+1 is the sharp uniform no-wrap threshold for the full shift range.
    query_obligation: >-
      Derive the exact worst-case shifted-predicate binary-search count using
      the promised sentinels and the conservative combined cap
      5*r+3 including F0 isolation.
    decoder: >-
      Recover z and output x_hat=(m*z+c0-C) mod N; require final verification
      [x_hat]P=Q.
  source_bound_supplied_for_arithmetic_only:
    statement: >-
      Under the MPZ dense prime-order preprocessing generic-group model, one
      complete adaptive main-phase execution with ell advice bits and k
      interactions has average success at most 3*ell*(k+1)^2/N.
    citation: Maurer, Portmann, and Zhu, Unifying Generic Group Models, IACR ePrint 2020/996, Theorem 3 and Corollary 3
    provenance: internal_statement_for_blind_arithmetic_not_independent_source_verification
    exponent_obligation: >-
      Substitute ell=B^(9/4+o(1)), k=B^(5/4+o(1)), and N=B^5; state the exact
      B and N exponents and every applicability premise.
  required_distinctions:
    - The premise is joint correctness of one adaptive correlated-target transcript, not independent or marginal per-target success.
    - The accepted fixed-target one-restriction interface does not imply the correlated-target premise.
    - The signed alphabet excludes zero even though the resulting multi-deck sumset may contain zero.
    - The theorem is conditional on the object premise and does not construct the object.
