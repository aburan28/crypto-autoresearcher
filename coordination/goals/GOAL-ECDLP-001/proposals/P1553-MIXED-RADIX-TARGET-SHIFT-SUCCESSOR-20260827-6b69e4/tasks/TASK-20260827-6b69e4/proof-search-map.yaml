      decoder: "T=L-z; z=L-T; x_hat=(mz+c0-C) mod N; verify [x_hat]P=Q"
      call_cap: "r+1+(4r+2)=5r+3"
      resource_bound: "Pr[success] <= 3*ell*(k+1)^2/N = B^(-1/4+o(1)) = N^(-1/20+o(1))"
