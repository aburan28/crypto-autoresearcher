  claim_ceiling: >-
    At most an independently reviewed correction of the conditional target-shift obstruction for the stronger universal ordinary-generic interface. It is not a construction of that interface, the accepted fixed-target theorem, a P1553 or coordinate result, a generic ECDLP lower bound, an algorithm, attack, speedup, SOTA movement, B71 admission, lane closure, goal completion, or breakthrough.
  exact_claim: >-
    Conditionally, in a prime-order ordinary generic group, one target-independent universal exact arbitrary-deck generic Query2P1 object whose complete adaptive transcript remains jointly correct across the declared correlated public target shifts, with complete serialization and aggregate interaction accounting and with no excluded capability, is incompatible with nonvanishing complete-transcript success when ell = B^(9/4+o(1)) boundary bits and k = B^(5/4+o(1)) aggregate main-phase operations/queries, where B = N^(1/5). The conclusion depends on the numbered assumptions below and asserts neither that such an object exists nor any result for weaker interfaces.
  parameters:
    group:
      description: "ordinary generic cyclic group G=<P> of prime order N"
      order: N
      generator: P
      challenge: "fresh uniform Q=[x]P"
      canonical_scalar: "x in {0,...,N-1}"
    radix:
      B: "N^(1/5)"
      r: "ceil(log2(B))"
      m: "2^r"
      digit_alphabet: "D={-m,...,-1,1,...,m}"
      digit_count: "|D|=2m=2^(r+1)"
      C: "sum_{i=0}^4 m^i = 1+m+m^2+m^3+m^4"
      L: "m+m^2+m^3+m^4"
      size_premise: "N>4L+1"
    resources:
      ell: "B^(9/4+o(1)) ordinary bits crossing the preprocessing/main boundary after group registers are cleared"
      k: "B^(5/4+o(1)) one aggregate adaptive main-phase operation/query count"
      required_success: "nonvanishing complete-transcript success probability"
  decks:
    public_construction:
      - "For i in {0,1,2,3,4}, deck F_i has one public labelled entry for every c in D, carrying the exact generic group value [c*m^i]P."
      - "The occurrence labels remain part of the public deck description and can matter in collision strata, but the corrected large-stratum F_0 recovery below does not require a predicate to return an occurrence label."
    target:
      original: "R=Q+[C]P"
      shifted: "R_t=R+[m*t]P for public t in {0,...,2L+1}"
    selected_relation: "Choose exactly one entry from each F_i whose group-value sum equals the current target."
  predicate_contract:
    object: "one target-independent universal exact arbitrary-deck generic Query2P1 object"
    exactness: "For every admitted public deck-subset node and public target, the returned bit is 1 exactly when a valid one-entry-per-deck completion exists."
    cumulative_subset_stability: "After any positive answer, restricting a deck to a child subset that still contains a completion yields the exact answer for that child; all restrictions and later shifts remain in one jointly correct adaptive transcript."
    correlated_target_jointness: "The complete transcript, not merely each marginal call, is jointly correct for the adaptively selected sequence R_t derived from the same Q, advice, public decks, and prior answers."
    target_independence: "Preprocessing advice and retained state are independent of Q, x, R, every R_t, and the adaptive path."
    ordinary_interface: "Only ordinary generic group operations/equality, public ordinary bits, and the exact declared predicate are available."
    complete_charge: "Advice serialization, target construction, predicate internals, generic equality, replay, threshold search, decoding, and final verification are included in ell or the single aggregate k as appropriate; no per-call reset occurs."
  mechanism:
    transcript:
      - step: universal_witness
        statement: "Write canonical x=sum_{i=0}^4 a_i*m^i with 0<=a_i<m, possible because m^5>=N. Put c_i=a_i+1 in {1,...,m} subset D. Then sum c_i*m^i=x+C, so the full public decks have an all-positive witness for R=Q+[C]P without a predicate call."
      - step: isolate_F0
        statement: "Canonically bisect the exactly 2m=2^(r+1) public signed labelled F_0 entries. Exact cumulative subset stability guarantees that one queried half containing a live completion is retained at every level. Exactly r+1 existence calls leave a singleton generic group value."
      - step: recover_c0_by_value
        statement: "Compare the isolated exact generic encoding with the public map c-> [c]P for c in D. On N>4L+1>2m, that map is injective on D, so its value uniquely determines c0 even if no occurrence label is returned."
      - step: define_residual
        statement: "Define the integer z by x+C-c0=m*z. The live relation gives z=sum_{i=1}^4 c_i*m^(i-1), so z belongs to D+mD+m^2D+m^3D=[-L,L]. Since m<N and N is prime, m is invertible modulo N as well."
      - step: correlated_target_shift
        statement: "For t in {0,...,2L+1}, keep the isolated F_0 singleton c0 and query the same object on R_t=R+[m*t]P. Let q(t) be the exact answer. Then q(t)=1 iff z+t modulo N has a representative in [-L,L]."
      - step: threshold_decode
        statement: "Because z+t lies in [-L,3L+1] and N>4L+1, no value above L can alias modulo N into [-L,L]. Hence q(t)=1 iff t<=L-z. The sentinels are q(0)=1 and q(2L+1)=0. Binary search returns T=L-z and z=L-T using exactly ceil(log2(2L+2))=4r+2 shifted-target calls."
      - step: recover_and_verify
        statement: "Compute x_hat=(m*z+c0-C) mod N and charge the ordinary generic verification [x_hat]P=Q to the same aggregate k. On the joint-success event, x_hat=x."
    top_level_predicate_cap:
      isolation_calls: "r+1"
      threshold_calls: "ceil(log2(2L+2))=4r+2"
      total: "5r+3"
      accounting: "All 5r+3 calls, their internals, adaptive replay, equality tests, decode, and verification are in one transcript and one aggregate k; neither success probability nor k is reset or multiplied per call."
  lemmas:
    - id: local-L1-universal-witness
      claim: "The full decks always contain an all-positive witness for R."
      proof: "m=2^r>=B implies m^5>=B^5=N. The five base-m digits of canonical x satisfy 0<=a_i<m. With c_i=a_i+1 in {1,...,m} subset D, sum c_i*m^i=x+C, and therefore the corresponding public group values sum to Q+[C]P=R."
    - id: local-L2-nonzero-two-deck-interval
      claim: "For m>=2 and D={-m,...,-1,1,...,m}, D+mD=[-(m^2+m),m^2+m] as an exact integer set."
      proof: >-
        For each e in D, the translate em+D contains [em-m,em-1] and [em+1,em+m], missing only em. Consecutive nonzero e translates otherwise touch or overlap. For e>=2 the missing point em equals (e-1)m+m with e-1 in D; the exceptional positive point m equals 2m-m. Negative missing points follow by symmetry. The central point is 0=m+(-m). The outer endpoints are plus or minus (m^2+m); m^2=(m-1)m+m (with the m=2 case also given by 2=2*2-2 inside the direct translates), and its negative is symmetric. Thus every integer between the endpoints is covered, while the triangle bound excludes every integer outside them. This proof never adjoins zero to D.
    - id: local-L3-full-nonzero-interval
      claim: "D+mD+m^2D+m^3D=[-L,L], with L=m+m^2+m^3+m^4."
      proof: >-
        Local-L2 gives A_1=D+mD=[-S_1,S_1] with S_1=m+m^2. For j=2,3, assume A_(j-1)=[-S_(j-1),S_(j-1)] where S_(j-1)=m+...+m^j. Adding m^j D gives intervals centered at e*m^j, e in D, of radius S_(j-1). Since S_(j-1)>=m^j, consecutive signed nonzero centers overlap, the positive and negative central intervals overlap across zero, and the union has endpoints plus or minus (m^(j+1)+S_(j-1))=plus or minus S_j. The reverse inclusion is the triangle bound. At j=3 this is exactly [-L,L].
    - id: local-L4-large-stratum-F0-value-injectivity
      claim: "On N>4L+1, an isolated F_0 group value uniquely identifies c0 in D through the public deck map, without a returned occurrence label."
      proof: >-
        If [c]P=[c']P for c,c' in D, prime-order equality gives N divides c-c'. But |c-c'|<=2m. Because L=m+m^2+m^3+m^4>=m, N>4L+1>2m. Hence |c-c'|<N, so divisibility forces c-c'=0 and c=c'. Exact generic equality against the public deck values therefore recovers the unique c0. Labels remain necessary only in separately admitted collision strata; no broader label-necessity statement is made.
    - id: local-L5-threshold
      claim: "For the correlated shifts, q(t)=1 iff t<=L-z on t in {0,...,2L+1}."
      proof: >-
        Local-L3 makes q(t)=1 exactly when z+t modulo N is representable in [-L,L]. Here z+t lies in [-L,3L+1]. It never falls below -L. If z+t>L and were congruent to s in [-L,L], then 0<z+t-s<=4L+1<N, contradicting N divisibility. Thus representability is equivalent to z+t<=L, or t<=L-z. Because z lies in [-L,L], q(0)=1, q(2L+1)=0, and T=L-z lies in [0,2L].
    - id: local-L6-decoder-and-call-cap
      claim: "The complete adaptive procedure recovers and verifies x with 5r+3 top-level predicate calls on its joint-success event."
      proof: "F_0 isolation costs r+1 calls. Since 2L+2 lies strictly above 2m^4=2^(4r+1) and at most 2(m+m^2+m^3+m^4)+2 <= 4m^4=2^(4r+2) for m>=2, ceil(log2(2L+2))=4r+2. Threshold decoding yields z=L-T, and x_hat=(m*z+c0-C) mod N. Final generic verification distinguishes a correct decode from corruption."
    - id: local-L7-conditional-MPZ-contradiction
      claim: "Under the complete dense-preprocessing generic-model mapping, the stated ell and k make nonvanishing complete-transcript success impossible."
      proof: "The frozen MPZ bound is Pr[success] <= 3*ell*(k+1)^2/N. Substituting ell=B^(9/4+o(1)), k=B^(5/4+o(1)), and N=B^5 gives B^(-1/4+o(1))=N^(-1/20+o(1))=o(1). This contradicts the assumed nonvanishing joint success of the complete transcript, conditional on every mapping and resource assumption below."
  proof_decomposition:
    correctness:
      depends_on: [local-L1-universal-witness, local-L2-nonzero-two-deck-interval, local-L3-full-nonzero-interval, local-L4-large-stratum-F0-value-injectivity, local-L5-threshold, local-L6-decoder-and-call-cap]
      boundary: "Exact only for the declared universal jointly correct correlated-target interface and N>4L+1."
    success_probability:
      depends_on: [local-L7-conditional-MPZ-contradiction]
      bookkeeping: "One complete-transcript success event; no product of marginal probabilities and no independent-amplification claim."
    time_and_queries:
      top_level_predicate_calls: "5r+3"
      aggregate_bound_assumed: "k=B^(5/4+o(1)) including every charged operation"
    memory_and_data:
      boundary_bits_assumed: "ell=B^(9/4+o(1))"
      excluded_interpretation: "ell is not total preprocessing time or total memory."
  resource_ledger:
    preprocessing_main_boundary:
      quantity: ell
      meaning: "ordinary serialized bits crossing the boundary after generic group registers are cleared"
      value: "B^(9/4+o(1))"
      charged_items: [complete_target_independent_advice, serialized_state, any_public_replay_data_crossing_boundary]
    main_phase:
      quantity: k
      meaning: "one aggregate adaptive main-phase operation/query count"
      value: "B^(5/4+o(1))"
      charged_items: [target_construction, all_predicate_internals, all_generic_group_operations, all_generic_equalities, all_5r_plus_3_top_level_calls, adaptive_replay, threshold_decode, scalar_decode, final_verification]
      resets: 0
    mpz_bound:
      exact: "Pr[success] <= 3*ell*(k+1)^2/N"
      substitution: "3*B^(9/4+o(1))*(B^(5/4+o(1))+1)^2/B^5 = B^(-1/4+o(1)) = N^(-1/20+o(1)) = o(1)"
      interpretation: "conditional upper bound on complete-transcript success in the stated prime-order dense-preprocessing generic model"
      not_claimed: [total_preprocessing_time_lower_bound, total_memory_lower_bound, unconditional_generic_ECDLP_lower_bound]
  assumptions:
    - id: A1
      formal: "G=<P> is an ordinary generic cyclic group of prime order N, and Q=[x]P for fresh uniform x in {0,...,N-1}."
      validation_route: "Independent model audit against the frozen statement."
    - id: A2
      formal: "B=N^(1/5), r=ceil(log2 B), m=2^r, D excludes zero exactly, C=sum_{i=0}^4 m^i, L=m+m^2+m^3+m^4, and N>4L+1."
      validation_route: "Blind algebraic re-derivation of interval, inequalities, and call cap."
    - id: A3
      formal: "A target-independent universal exact arbitrary-deck generic Query2P1 object exists for every declared deck subset and correlated public target used by the adaptive transcript."
      validation_route: "This is not established here; any later construction must be separately specified and reviewed."
    - id: A4
      formal: "Exact cumulative subset stability holds during canonical F_0 restriction, and one complete transcript is jointly correct over all adaptively selected correlated shifts R_t."
      validation_route: "Adversarial review must reject any replacement by fixed-target or marginal per-call correctness."
    - id: A5
      formal: "Preprocessing advice is ordinary-bit, target-independent, fully serialized, and leaves no generic group register, opaque crossing handle, free predicate, target-conditioned state, or undeclared oracle across the boundary."
      validation_route: "Independent resource-boundary audit against the MPZ model."
    - id: A6
      formal: "Every predicate internal, target construction, generic equality, group operation, replay, decode, and verification is charged to one aggregate adaptive k with no reset."
      validation_route: "Blind ledger reconstruction from only the frozen interface and transcript."
    - id: A7
      formal: "The MPZ dense-preprocessing generic-model bound applies to this fully serialized construction with ell boundary bits and aggregate k operations/queries: Pr[success] <= 3*ell*(k+1)^2/N."
      validation_route: "Independent source review of ePrint 2020/996 Sections 5.1 and 5.3, Definition 12, Theorem 3, Corollary 3, and Appendix F.6."
    - id: A8
      formal: "ell=B^(9/4+o(1)) and k=B^(5/4+o(1)) bound the complete construction in precisely the meanings in the resource ledger."
      validation_route: "A future concrete object must supply complete serialization and aggregate accounting; this packet supplies neither object nor measurement."
    - id: A9
      formal: "The assumed complete-transcript success is nonvanishing as N grows."
      validation_route: "Future object specification must state a joint, not marginal, success probability and its quantifiers."
  excluded_assumptions:
    - "No coordinate access, representation leakage, P1553-specific semantics, or non-generic arithmetic."
    - "No target-conditioned preprocessing/advice/state."
    - "No opaque group handles or group registers crossing the preprocessing boundary."
    - "No extra oracle; the MPZ shared-random-oracle corollary covers only exact ro(v)=RO(pi(v))."
    - "No free predicate internals, target construction, replay, decoding, or verification."
    - "No per-query reset of k and no multiplication or amplification from marginal success."
    - "No zero digit silently added to D."
  controls:
    - id: C-D-no-zero
      object: "D={-m,...,-1,1,...,m}"
      expected: "Local-L2 and Local-L3 prove exact contiguity without adjoining zero."
      falsifies_if: "Any proof step requires a zero digit or leaves an uncovered integer."
    - id: C-alphabet-with-zero
      object: "D union {0}"
      expected: "The easier interval proof for this different alphabet must not be substituted for the stated theorem."
      first_absent_premise: "exact declared nonzero alphabet"
    - id: C-large-F0-injectivity
      object: "N>4L+1"
      expected: "c-> [c]P is injective on D by N>4L+1>2m."
      falsifies_if: "Distinct c,c' in D have equal generic encodings in an admitted large stratum."
    - id: C-small-collision-stratum
      object: "m=2,N=3"
      expected: "The public value buckets are {-2,1} and {-1,2}; occurrence labels distinguish coefficients, but this stratum violates N>4L+1 and is not a counterexample to Local-L4."
      first_absent_premise: "N>4L+1"
    - id: C-threshold-endpoints
      object: "z in {-L,0,L} and t in {0,2L+1}"
      expected: "T is respectively 2L,L,0; q(0)=1 and q(2L+1)=0 in every case."
      falsifies_if: "Threshold location, endpoint sentinel, or monotonicity differs."
    - id: C-paired-challenges
      object: "Q and -Q with canonical scalars x and (-x mod N)"
      expected: "The same public construction and decoder verify each challenge separately without target-conditioned advice."
      falsifies_if: "A hidden sign convention or target-conditioned state is needed."
    - id: C-wrong-shift-step
      object: "replace R_t=R+[mt]P by R+[t]P"
      expected: "The divisibility-defined residual no longer advances by integer t; the threshold proof stops."
      first_absent_premise: "public shift formula R_t=R+[mt]P"
    - id: C-one-bit-decode-corruption
      object: "flip one recovered threshold bit before computing x_hat"
      expected: "The final equality [x_hat]P=Q rejects unless the corrupted scalar happens to be congruent to x."
      falsifies_if: "The stated verification accepts a distinct scalar."
    - id: C-wrap-sharp
      object: "2L+1<N<=4L+1, z=L, t*=N-2L"
      expected: "q(1)=false but q(t*)=true, so monotonicity fails. Exact instance N=10009,m=8,L=4680,t*=649."
      first_absent_premise: "N>4L+1"
    - id: C-deep-wrap
      object: "N<=2L+1"
      expected: "Membership may be constant or otherwise circular; no threshold claim is made."
      first_absent_premise: "N>4L+1"
    - id: C-fixed-target-only
      object: "an object correct only for one frozen target R"
      expected: "The proof stops before the first R_t query."
      first_absent_premise: "joint correctness across correlated public shifts"
    - id: C-marginal-success
      object: "per-query marginal success without a joint transcript guarantee"
      expected: "No complete threshold transcript success follows and no independent amplification is assumed."
      first_absent_premise: "nonvanishing joint complete-transcript success"
    - id: C-random-only
      object: "object guaranteed only for random decks or independent random targets"
      expected: "The structured signed decks and correlated shifts are outside its guarantee."
      first_absent_premise: "universal arbitrary-deck and correlated-target exactness"
    - id: C-coordinate-P1553
      object: "coordinate-aware or P1553-specific interface"
      expected: "The ordinary generic MPZ mapping is unavailable."
      first_absent_premise: "ordinary generic interface"
    - id: C-target-conditioned
      object: "target-conditioned advice/state or opaque crossing group handles"
      expected: "The dense-preprocessing serialization premise fails."
      first_absent_premise: "target-independent ordinary-bit complete boundary"
    - id: C-extra-oracle
      object: "an oracle beyond exact ro(v)=RO(pi(v))"
      expected: "The cited MPZ corollary does not cover the interface."
      first_absent_premise: "declared ordinary generic/RO model"
    - id: C-zero-restriction
      object: "mechanism whose correctness depends on zero being forbidden rather than only handling the stated decks"
      expected: "It remains an open nearby route unless all universal and resource premises are independently established."
      first_absent_premise: "no theorem here for distinct zero-restriction mechanisms"
  falsification:
    mathematical:
      - "An integer in the claimed nonzero-digit interval lacks a representation."
      - "A distinct admitted c,c' in D collide under c-> [c]P despite N>4L+1."
      - "The shifted membership predicate is not the asserted threshold under N>4L+1."
      - "The exact threshold query count is not 4r+2 or the total is not 5r+3."
      - "The decoder or final verification is incorrect on a jointly correct transcript."
    model_mapping:
      - "The universal object cannot be fully serialized into ordinary ell bits after clearing group registers."
      - "Some target/predicate/replay/decode/verification work is not charged to the single aggregate k."
      - "MPZ's theorem does not apply to the declared adaptive construction or its success event."
      - "Only fixed-target or marginal correctness is available."
    interpretation:
      - "Any assertion exceeds the exact claim ceiling or treats a conditional assumption as an established construction."
  scope:
    affected: "Only the stronger assumed universal, exact, target-independent, ordinary-generic arbitrary-deck interface with one jointly correct correlated-target transcript, complete serialization, N>4L+1, and the stated ell/k bounds."
    safe_or_open:
      - fixed-target objects
      - marginal guarantees paired with a separately proved independent-amplification theorem
      - random or distribution-specific objects
      - coordinate-aware or P1553-specific objects
      - target-conditioned advice
      - extra-oracle or non-generic methods
      - zero-restriction mechanisms
      - wrapped finite strata
      - any object exceeding ell or k
    finite_boundary: "For 2L+1<N<=4L+1 the sharp wrap control invalidates threshold monotonicity; for N<=2L+1 membership may be constant."
    no_transfer: "No transfer to accepted fixed-target results, P1553, coordinates, generic ECDLP as a whole, or SOTA is asserted."
  pareto:
    dominated_by: unverified_full_frontier
    sota_delta: unknown_not_evaluated
    obtained_delta: none
    frontier_check: "No full time-memory-data/query frontier was available to this producer through the parent relay."
    pollard_rho_comparison: "not earned; this is a conditional obstruction theorem about an assumed interface, not an algorithm"
  conclusion:
    status: correction_candidate_only
    statement: "The additive candidate removes the predecessor's false broad label-necessity claim by proving exact large-stratum F_0 value injectivity, preserves the small collision control, and fully freezes the target-shift transcript and conditional MPZ ledger. Independent review is required before any use as evidence."
    construction_established: false
    experimental_evidence: none
    official_effect: none
