    exact_residual_relation: "m*z congruent x+C-c0 (mod N) for the unique z in [-L,L]"
    integer_equality: false
    divisibility: false
    construction: false
    p1553_transfer: false
    fixed_target_result: false
    novelty: "unverified"
  exact_baseline_reproduction:
