  disposition: "correction_candidate"
  result_count: 1
  novelty_status: "unverified"
  official_state_change: "none"
  scientific_transition: "none"
  claim_ceiling: >-
    At most the independently reviewed corrected conditional target-shift ordinary-generic obstruction. No construction, fixed-target conclusion, P1553 or coordinate result, generic ECDLP lower bound, algorithm, attack, speedup, SOTA movement, B71 admission, closure, completion, or breakthrough.
  exact_claim:
    statement: >-
      Conditional on one universal exact arbitrary-signed-labelled-deck subset-stable ordinary-generic Query2P1 object with target-independent serialized advice and one jointly correct adaptive transcript, the admitted sufficiently-large stratum N > 4L+1 permits recovery and mandatory verification of the fresh uniformly random discrete logarithm x with at most 5r+3 top-level predicate calls. When every online generic operation, restriction, target shift, public-handle reconstruction, finite F0-label recovery, replay, decoding, verification, and handle clearing is charged inside aggregate k = B^(5/4+o(1)) and ell = B^(9/4+o(1)), MPZ Theorem 3 gives success probability at most 3*ell*(k+1)^2/N = B^(-1/4+o(1)) = N^(-1/20+o(1)) = o(1), contradicting the assumed nonvanishing complete-transcript success.
    conditional: true
    ordinary_generic_only: true
    fresh_uniform_target_only: true
    complete_transcript_success_required: true
    integer_equality_claimed: false
    divisibility_claimed: false
    construction_claimed: false
    fixed_target_claimed: false
    p1553_transfer_claimed: false
    coordinate_model_claimed: false
    generic_ecdlp_lower_bound_claimed: false
    attack_or_algorithm_claimed: false
    sota_movement_claimed: false
    breakthrough_claimed: false
  parameters:
    group:
      notation: "G=<P>"
      order: "N"
      order_property: "prime"
      target: "Q=[x]P"
      target_scalar: "x is fresh uniform in the canonical interval [0,N-1]"
    asymptotic:
      B: "N^(1/5)"
      r: "ceil(log2 B)"
      m: "2^r"
      coefficient_alphabet: "D={-m,...,-1,1,...,m}"
      C: "sum_{i=0}^4 m^i"
      L: "m+m^2+m^3+m^4"
      admitted_stratum: "N>4L+1"
      consequences:
        - "m<N"
        - "gcd(m,N)=1"
        - "2m<N"
        - "2L<N"
    advice_and_online_budget:
      ell: "B^(9/4+o(1)) ordinary serialized bits"
      aggregate_k: "B^(5/4+o(1)) generic operations/queries with all named online work included"
      added_public_reconstruction: "O(m polylog N)=B^(1+o(1)), dominated by but included in aggregate k"
  decks:
    public_signed_labelled_definition: "F_i={(i,d,sigma,[sigma(d+1)m^i]P): 0<=d<m, sigma in {+1,-1}}"
    indices: [0, 1, 2, 3, 4]
    coefficient_interpretation: "c_i=sigma_i(d_i+1) in D"
    labels_are_public: true
    values_are_publicly_reconstructible: true
    target: "R=Q+[C]P"
    universal_witness:
      base_m_expansion: "x=sum_{i=0}^4 a_i*m^i with 0<=a_i<m"
      selected_labels: "d_i=a_i and sigma_i=+1"
      scalar_identity: "sum_{i=0}^4 (d_i+1)m^i=x+C"
      role: "proves at least one initial witness for every canonical x"
    interval:
      exact_four_digit_identity: "D+mD+m^2D+m^3D=[-L,L]"
      residual_decks: "F_1,F_2,F_3,F_4"
      residual_scalar_set: "m[-L,L]"
    f0_injectivity:
      applies_on: "N>4L+1"
      same_sign_argument: "distinct same-sign labels differ by a nonzero integer of absolute value <m<N"
      opposite_sign_argument: "an equality would require N to divide d+d'+2, but 2<=d+d'+2<=2m<N"
      conclusion: "the 2m labelled public F0 values are pairwise distinct on the admitted stratum"
      collision_representation_still_charged: true
  predicate_contract:
    object_count: 1
    object: "universal exact arbitrary-signed-labelled-deck subset-stable ordinary-generic Query2P1 object"
    universality: "all allowed deck restrictions and all correlated target shifts used by the one adaptive transcript"
    advice:
      fixed_before_target: true
      target_independent: true
      form: "ordinary serialized bits only"
      live_generic_handles_allowed: false
      target_conditioning_allowed: false
    transcript:
      count: 1
      adaptive: true
      jointly_correct_required: true
      per_query_marginals_sufficient: false
      k_reset_between_calls: false
      opaque_handle_carryover: false
    exactness: "each predicate answer exactly reports existence of a witness under the supplied restrictions and target"
    subset_stability: "a witness using an F0 item remains meaningful under cumulative restrictions that retain that item"
  mechanism:
    phase_boundary:
      before_target: "only target-independent ordinary serialized advice may persist"
      after_target: "all needed generic encodings are created or reconstructed within the aggregate online ledger"
      forbidden_crossing: "no live, cached, or opaque generic handle crosses preprocessing"
    public_handle_reconstruction:
      rule: >-
        After the phase boundary, reconstruct every public F_i encoding that is needed from its known scalar lineage sigma(d+1)m^i and P; similarly form R, every R_t, Q-derived verification handles, and any replay handles inside the measured transcript.
      includes_f0: true
      includes_other_public_decks: true
      includes_targets_and_shifts: true
      includes_verification: true
      scalar_lineage_retained_as_bits_only: true
      aggregate_k_charged: true
    f0_isolation:
      starting_population: "the 2m signed labelled F0 entries"
      initial_full_deck_call: false
      partition: "canonical deterministic dyadic partition of the current candidate label set"
      rule: >-
        At each level query the predicate with one canonical half as the F0 restriction and the other decks unchanged. If the answer is true, retain the queried half; otherwise retain its complement. Existence for the current set ensures that one retained half contains a witness.
      calls: "r+1 exactly, because 2m=2^(r+1)"
      output: "one isolated F0 public value with coefficient c0 in D"
    finite_f0_label_recovery:
      direct_mode: "if the predicate exposes the singleton's public label, retain c0 directly"
      encoding_only_mode: >-
        If only the isolated public generic encoding is exposed, reconstruct all 2m labelled F0 encodings after the advice boundary from coefficients c in D and compare the isolated encoding against them using at most 2m labelled equality tests.
      equivalent_dictionary_mode: >-
        An encoding-to-label multimap or equivalent dictionary may replace the linear scan only if its reconstruction, build, serialization, storage, collision-list representation, memory traffic, equality/hash work, lookup, retained labels, and teardown are all charged.
      maximum_labelled_equalities: "2m"
      collisions_on_admitted_stratum: "none, by F0 injectivity"
      collision_handling_required_anyway: true
      output: "the unique labelled coefficient c0"
      online_not_advice: true
      aggregate_k_charged: true
    residual_definition:
      existence: "a surviving witness gives some z in [-L,L]"
      definition: "z is the unique integer in [-L,L] satisfying m*z congruent x+C-c0 (mod N)"
      forbidden_strengthening: "do not assert x+C-c0=m*z over the integers and do not assert divisibility by m"
    correlated_threshold:
      targets: "R_t=R+[m*t]P for integer t in [0,2L+1]"
      restriction: "reuse the same isolated F0 choice and leave F1 through F4 available"
      predicate: "q(t)=1 iff that restricted instance has a four-deck witness"
      equivalent_interval_test: "q(t)=1 iff z+t has an integer representative in [-L,L]"
      no_wrap_basis: "N>4L+1"
      threshold_form: "q(t)=1 iff t<=T, where T=L-z"
      sentinels:
        q0: "q(0)=1, proved from the surviving witness and not charged as a call"
        q_end: "q(2L+1)=0, proved from the interval and not charged as a call"
      binary_search_calls: "ceil(log2(2L+1))<=4r+2"
      recovered_residual: "z=L-T"
    decoding:
      formula: "x_hat=(m*z+c0-C) mod N"
      mandatory_verification: "[x_hat]P=Q"
      verification_failure: "falsifies correctness of that transcript; it is not silently discarded"
    call_count:
      isolation: "r+1"
      shifted_threshold: "at most 4r+2"
      total: "at most 5r+3"
  lemmas:
    - name: "universal_positive_witness"
      statement: "Every canonical x has an all-positive five-deck witness for R via its five base-m digits."
      dependency: "m^5>=B^5=N and 0<=x<N"
    - name: "exact_nonzero_digit_interval"
      statement: "D+mD+m^2D+m^3D equals every integer in [-L,L], despite zero being absent from each digit alphabet."
      proof_boundary: "requires a dedicated induction or interval-overlap argument; inclusion alone is insufficient"
    - name: "f0_public_value_injectivity"
      statement: "All 2m public F0 values are distinct on N>4L+1."
      proof_boundary: "separate same-sign and opposite-sign cases"
    - name: "dyadic_singleton_isolation"
      statement: "Cumulative canonical restrictions isolate a witness-bearing F0 singleton in exactly r+1 predicate calls without an initial full-deck call."
      dependency: "exact subset-stable predicate and an initial universal witness"
    - name: "finite_public_label_recovery"
      statement: "The isolated c0 is recovered from a direct public label or at most 2m labelled equality tests/equivalent fully charged dictionary built from post-boundary reconstructed F0 encodings."
      dependency: "known scalar lineage, admitted-stratum injectivity, and explicit collision representation"
    - name: "modular_residual_existence_and_uniqueness"
      statement: "There is a unique z in [-L,L] with m*z congruent x+C-c0 (mod N)."
      existence: "the surviving four-deck witness"
      uniqueness: "gcd(m,N)=1 and 2L<N"
    - name: "correlated_monotone_threshold"
      statement: "For the one jointly correct adaptive transcript, q(t)=1 exactly on 0<=t<=L-z."
      dependency: "same F0 singleton, exact interval lemma, and N>4L+1 no-wrap regime"
    - name: "call_bound_and_decoder"
      statement: "The threshold and residual are recovered within 5r+3 top-level calls and x_hat=(m*z+c0-C) mod N verifies against Q."
    - name: "mpz_budget_contradiction"
      statement: "With ell=B^(9/4+o(1)), k=B^(5/4+o(1)), and N=B^5, MPZ bounds complete-transcript success by B^(-1/4+o(1))=o(1)."
      conditionality: "MPZ supplies a bound for the ordinary generic execution; it does not construct the assumed deck predicate object"
  proof_decomposition:
    size_and_coverage:
      obligations:
        - "prove m^5>=N and the universal positive witness"
        - "prove D+mD+m^2D+m^3D=[-L,L]"
        - "derive N>4L+1 consequences without extending beyond the admitted stratum"
    correctness:
      obligations:
        - "prove F0 injectivity and singleton isolation"
        - "give the finite direct-label or <=2m equality/dictionary recovery algorithm"
        - "prove modular, not integer, residual existence and uniqueness"
        - "prove the correlated threshold and decoder"
        - "perform mandatory final group verification"
    runtime_and_memory:
      obligations:
        - "charge all public reconstruction, recovery, lookup, replay, verification, and teardown"
        - "show O(m polylog N)=B^(1+o(1)) is included in, and asymptotically dominated by, k=B^(5/4+o(1))"
        - "keep ell as serialized advice bits and prohibit generic handles in advice"
    success_probability:
      obligations:
        - "quantify one complete adaptive transcript, not independent per-call successes"
        - "apply MPZ conditionally with the exact ell and aggregate k exponents"
        - "state that operational failure and invalid predecessor drafts are not mathematical evidence"
  resource_ledger:
    advice:
      charged_quantity: "ell"
      bound: "B^(9/4+o(1)) bits"
      allowed_contents: "target-independent ordinary serialized bits"
      generic_handles: 0
    predicate_calls:
      isolation_calls: "r+1"
      threshold_calls: "at most 4r+2"
      total_top_level_calls: "at most 5r+3"
      charged_inside_aggregate_k: true
    public_f0_recovery_and_handle_reconstruction:
      population: "2m labelled F0 entries"
      algorithms:
        - "direct singleton label recovery when the public label is exposed"
        - "otherwise at most 2m labelled equality tests against reconstructed F0 encodings"
        - "or an equivalent encoding-to-label multimap/dictionary with the same complete ledger"
      charged_components:
        - "scalar multiplication and generic encoding reconstruction from every known F0 scalar lineage"
        - "dictionary or scan-structure build"
        - "serialization of keys, labels, and collision-list structure"
        - "storage allocation for encodings, labels, buckets, and collision lists"
        - "collision-list representation and collision resolution, even though the admitted stratum proves injectivity"
        - "memory traffic for build, scan, comparison, and lookup"
        - "generic equality tests and any encoding hash computation"
        - "dictionary lookup or linear labelled scan"
        - "label retention needed to return c0"
        - "teardown and final handle clearing"
      equality_test_cap: "2m"
      time: "O(m polylog N)=B^(1+o(1))"
      memory: "O(m polylog N) bits under explicit encoding/label serialization"
      traffic: "O(m polylog N) bit traffic up to representation-dependent polylogarithmic factors"
      online_phase: true
      treated_as_advice: false
      included_in_aggregate_k: true
      asymptotically_dominated_by: "k=B^(5/4+o(1))"
    all_public_handle_reconstruction:
      charged_components:
        - "reconstruct needed F1 through F4 public-deck encodings from known scalar lineage"
        - "form R=Q+[C]P and every R_t=R+[mt]P"
        - "reconstruct any replay encoding instead of retaining an opaque handle"
        - "construct the decoder-verification handle [x_hat]P"
        - "clear all generic handles at the end of the transcript"
      included_in_aggregate_k: true
      preprocessing_handle_carryover: 0
    predicate_internal_work:
      restriction_processing_charged: true
      target_formation_charged: true
      replay_charged: true
      aggregate: "k=B^(5/4+o(1))"
    decode_and_verify:
      modular_arithmetic_charged: true
      scalar_multiplication_charged: true
      equality_verification_charged: true
      handle_clearing_charged: true
      included_in_aggregate_k: true
    hidden_free_operations: []
    reset_between_queries: false
    total_online_bound: "k=B^(5/4+o(1)), inclusive of every component above"
    mpz_arithmetic:
      theorem_bound: "Pr[success] <= 3*ell*(k+1)^2/N"
      exponent_substitution: "B^(9/4+o(1))*B^(5/2+o(1))/B^5=B^(-1/4+o(1))"
      in_N: "N^(-1/20+o(1))"
      limit: "o(1)"
  assumptions:
    - id: "A1"
      statement: "G is cyclic of prime order N with public generator P."
    - id: "A2"
      statement: "Q=[x]P has fresh uniform canonical x in [0,N-1]."
    - id: "A3"
      statement: "The instance lies in the sufficiently-large stratum N>4L+1."
    - id: "A4"
      statement: "One universal exact arbitrary-signed-labelled-deck subset-stable ordinary-generic Query2P1 object exists."
      status: "unverified"
      construction_supplied: false
    - id: "A5"
      statement: "Its advice is target-independent, fixed before Q, and consists only of ell ordinary serialized bits."
    - id: "A6"
      statement: "One jointly correct stateful adaptive transcript covers every cumulative restriction and correlated shift."
      per_query_marginals_do_not_discharge: true
    - id: "A7"
      statement: "All online operations are counted in one aggregate k with no reset."
    - id: "A8"
      statement: "The relayed MPZ Theorem 3 statement and its applicability to the declared ordinary-generic transcript are correct; independent review must freshly retrieve and check it."
      source_access: "parent_relay"
  excluded_assumptions:
    - "target-conditioned preprocessing or advice"
    - "an extra oracle beyond the declared ordinary-generic object"
    - "opaque or live generic handles surviving the preprocessing boundary"
    - "a fresh k budget for each restriction or correlated target"
    - "composition from per-query marginal success probabilities"
    - "random-only decks substituted for arbitrary signed labelled decks"
    - "coordinate access or P1553 transfer"
    - "fixed-target advice or a fixed-target conclusion"
    - "zero-valued coefficient symbols in D"
    - "wrapped or circular interval behavior outside N>4L+1"
    - "free F0-label recovery, free dictionary construction, or free public-handle reconstruction"
  controls:
    - id: "C1-congruence-not-equality"
      object: "N=18731,m=8,L=4680,C=4681,c_i=8,z=4680,x=14036,c0=8"
      expected: "m*z congruent x+C-c0 (mod N), while x+C-c0=18709 is congruent to 5 mod 8 and is neither equal to m*z nor divisible by m"
      falsifies: "any proof step replacing the modular residual with integer equality or divisibility"
    - id: "C2-omitted-f0-cost"
      object: "delete the finite label-recovery and dictionary/scan ledger"
      expected: "proof is rejected as computationally untyped at the advice boundary"
    - id: "C3-retained-opaque-handle"
      object: "let a preprocessed generic encoding cross into the online phase"
      expected: "proof is out of scope for ordinary serialized advice and is rejected"
    - id: "C4-fixed-target-only"
      object: "object correct only for one target rather than correlated R_t"
      expected: "threshold transcript cannot be inferred"
    - id: "C5-marginal-successes"
      object: "separate per-query success statements without joint transcript correctness"
      expected: "adaptive recovery claim is unsupported"
    - id: "C6-small-stratum"
      object: "N<=4L+1"
      expected: "no-wrap and uniqueness arguments are unavailable; no conclusion transfers"
    - id: "C7-small-collision"
      object: "m=2,N=3"
      expected: "F0 public values collide, demonstrating why the admitted-stratum injectivity proof and collision lists are necessary"
    - id: "C8-zero-alphabet"
      object: "replace D by an alphabet that includes zero"
      expected: "this is a nearby but different interval problem and cannot validate the nonzero-digit lemma"
    - id: "C9-random-only-decks"
      object: "replace the arbitrary signed labelled deck requirement with random decks"
      expected: "does not establish the target claim"
    - id: "C10-coordinate-p1553"
      object: "grant coordinate information or assume a P1553 correspondence"
      expected: "outside the ordinary-generic theorem and separately open"
    - id: "C11-target-conditioned-advice"
      object: "allow advice to depend on Q or x"
      expected: "violates the quantifier order and MPZ accounting boundary"
    - id: "C12-extra-oracle"
      object: "answer restrictions or label recovery with an undeclared oracle"
      expected: "invalidates the ordinary-generic cost model"
    - id: "C13-zero-restricted-decks"
      object: "permit restricted decks to contain a zero coefficient not present in D"
      expected: "changes the witness language and cannot support the theorem"
  falsification:
    mathematical:
      - "a counterexample to D+mD+m^2D+m^3D=[-L,L] on the declared m"
      - "a collision among admitted-stratum F0 public values"
      - "failure of dyadic isolation for an exact subset-stable predicate with an initial witness"
      - "two distinct z,z' in [-L,L] satisfying the declared congruence on N>4L+1"
      - "a t in [0,2L+1] for which the exact correlated predicate disagrees with t<=L-z"
      - "a verified transcript whose decoded x_hat does not satisfy [x_hat]P=Q"
    accounting:
      - "any required public encoding cannot be reconstructed from declared scalar lineage"
      - "the finite c0 recovery requires more than 2m labelled equality tests without a fully charged equivalent"
      - "dictionary build, serialization, storage, collision handling, traffic, hash/equality, lookup, retention, or teardown is omitted"
      - "the added O(m polylog N) work is treated as free, as advice, or outside aggregate k"
      - "a live generic handle crosses preprocessing or k resets between calls"
    probabilistic:
      - "the assumed object offers only marginal per-call success rather than nonvanishing jointly correct complete-transcript success"
      - "fresh source review shows the relayed MPZ statement or its applicability was misstated"
    non_evidence:
      - "timeout, crash, missing backend, invalid predecessor artifact, parse failure, or implementation failure"
  scope:
    established_if_independently_reviewed:
      - "a corrected conditional target-shift ordinary-generic obstruction in the admitted stratum"
      - "explicit online recovery of the isolated public F0 label"
      - "explicit reconstruction and accounting for every cleared public-deck handle needed after the phase boundary"
    remains_open:
      - "existence or construction of the universal exact Query2P1 object"
      - "fixed-target conclusions"
      - "coordinate-model or P1553 transfer"
      - "random-deck variants"
      - "target-conditioned advice models"
      - "extra-oracle models"
      - "wrapped or circular regimes outside N>4L+1"
      - "zero-restriction variants"
      - "generic ECDLP lower bounds beyond the exact conditional object"
    prohibited_labels:
      - "construction"
      - "P1553 result"
      - "attack"
      - "algorithm"
      - "speedup"
      - "SOTA movement"
      - "B71 admission"
      - "closure"
      - "completion"
      - "breakthrough"
  pareto:
    dominated_by: "unverified_full_frontier"
    frontier_check_completed: false
    obtained_delta: "none"
    sota_delta: "unknown_not_evaluated"
    realized_frontier: "Pollard rho unchanged"
    comparison_scope: "no full time-memory-data/query frontier evaluation was performed"
  conclusion:
    status: "correction_candidate"
    observation: >-
      The frozen congruence argument can be stated with an explicit finite online procedure for recovering c0 and reconstructing every public generic encoding from scalar lineage after the advice boundary. The added O(m polylog N)=B^(1+o(1)) work is below but inside aggregate k=B^(5/4+o(1)); it is neither free nor advice.
    interpretation: >-
      This artifact proposes a theorem packet for independent review. It records no experiment, construction, implementation, state transition, SOTA change, P1553 transfer, attack, closure, completion, or breakthrough.
    commands_run: 0
    experiments_run: 0
