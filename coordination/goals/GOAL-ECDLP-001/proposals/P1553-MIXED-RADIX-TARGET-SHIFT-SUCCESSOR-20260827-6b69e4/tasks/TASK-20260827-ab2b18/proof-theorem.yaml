  claim_ceiling: "At most an independently reviewed correction of the conditional target-shift obstruction for the stronger universal ordinary-generic interface. It is not a construction of that interface, the accepted fixed-target theorem, a P1553 or coordinate result, a generic ECDLP lower bound, an algorithm, attack, speedup, SOTA movement, B71 admission, lane closure, goal completion, or breakthrough."
  exact_claim:
    statement: "Conditioned on the stated universal exact arbitrary-deck ordinary-generic predicate interface, cumulative subset stability, one jointly correct complete adaptive transcript, admitted stratum N > 4L + 1, and the stated aggregate resource accounting, the returned F0 coefficient determines a unique z in [-L,L] through m*z congruent to x+C-c0 modulo N. Correlated target shifts expose the exact threshold T=L-z, decode x modulo N, and thereby contradict the relayed MPZ success bound if the complete transcript has nonvanishing success."
    status: proof_correction_candidate_pending_independent_review
    conditional: true
    integer_equality_claimed: false
    divisibility_claimed: false
    construction_claimed: false
  parameters:
    group: "G=<P>, an ordinary generic prime-order group"
    order: "|G|=N, with N prime"
    target: "Q=[x]P for fresh uniform canonical x in {0,...,N-1}"
    B: "N^(1/5)"
    r: "ceil(log2(B))"
    m: "2^r"
    digit_alphabet: "D={-m,...,-1,1,...,m}"
    C: "sum_{i=0}^4 m^i"
    L: "m+m^2+m^3+m^4"
    initial_target: "R=Q+[C]P"
    admitted_stratum:
      - "N > 4L + 1"
      - "m >= 2"
  decks:
    count: 5
    indices: [0, 1, 2, 3, 4]
    occurrence: "(i,d,sigma,[sigma(d+1)m^i]P)"
    occurrence_domain:
      d: "0 <= d < m"
      sigma: ["+1", "-1"]
    signed_coefficient: "c_i=sigma(d+1) in D"
    labels_public: true
    scalar_coefficients_public: true
    zero_digit_present: false
  predicate_contract:
    object: target_independent_universal_exact_arbitrary_deck_ordinary_generic_Query2P1
    target_independent: true
    arbitrary_deck: true
    exact: true
    cumulative_subset_stability: "At every F0 half-deck restriction, an exact surviving completion exists whenever the predicate answers true."
    advice:
      length: "ell=B^(9/4+o(1)) ordinary bits"
      timing: fixed_before_fresh_Q
      live_group_handle_across_phases: false
      opaque_group_handle_across_phases: false
    transcript:
      requirement: "One jointly correct adaptive complete transcript covering every F0 restriction and every correlated shifted-target predicate call."
      assumed_success: nonvanishing_complete_transcript_success
      marginal_success_substitution_allowed: false
    accounting:
      aggregate_main_phase_count: "k=B^(5/4+o(1))"
      charged_operations: "All target construction, predicate internals, group operations, equality tests, replay, decoding, and final verification."
      reset_allowed: false
      free_predicate_allowed: false
      target_conditioned_state_allowed: false
      extra_oracle_allowed: false
  mechanism:
    summary: "Isolate an F0 value with subset-stable exact predicate calls, recover its signed coefficient by public value injectivity, define the remaining four-deck residual only as the unique short representative of a modular congruence, and recover that representative from a monotone correlated-target threshold."
    f0_isolation: "Binary half restrictions isolate one F0 encoding in exactly r+1 paid predicate calls while retaining a surviving completion."
    modular_residual: "Define z as the unique integer in [-L,L] satisfying m*z congruent to x+C-c0 modulo N."
    shifts: "For t=0,...,2L+1, use R_t=R+[m*t]P and let q(t) be the exact predicate value with singleton c0 and full F1 through F4 decks."
    threshold: "q(t)=1 exactly when t <= T, where T=L-z."
    decoder: "Recover z=L-T, compute x_hat=(m*z+c0-C) mod N, and accept only after [x_hat]P=Q."
  lemmas:
    - id: universal_initial_witness
      claim: "Because m^5 >= N, canonical base-m digits x=sum_{i=0}^4 a_i*m^i with 0<=a_i<m yield all-positive occurrences c_i=a_i+1 and a five-deck sum congruent to x+C modulo N, hence a witness for R."
      boundary: "This establishes full-deck existence without a paid predicate query; it does not construct the assumed predicate interface."
    - id: exact_nonzero_interval
      claim: "For D={-m,...,-1,1,...,m}, D+mD is exactly [-(m+m^2),m+m^2], including every central integer despite the absence of zero from D; induction over overlapping shifted intervals gives D+mD+m^2D+m^3D=[-L,L]."
      proof_note: "The two-deck base is checked with the nonzero alphabet. At each later place, adjacent nonzero-digit translates overlap, and the -1/+1 central bridge overlaps because the accumulated lower-place radius is at least the new place value."
    - id: f0_value_injectivity
      claim: "For c,c' in D, [c]P=[c']P implies N divides c-c'. Since N>4L+1>2m and |c-c'|<=2m, c=c'; therefore the isolated generic value and public deck map uniquely recover c0."
      excluded_stratum: "Collision strata such as m=2,N=3 are not admitted and remain explicit controls."
    - id: modular_residual_existence
      claim: "A surviving completion supplies c1,c2,c3,c4 and z_wit=c1+c2*m+c3*m^2+c4*m^3 in [-L,L]. Its group relation gives c0+m*z_wit congruent to x+C modulo N, so at least one z in [-L,L] satisfies m*z congruent to x+C-c0 modulo N."
      witness_source: surviving_four_deck_witness
    - id: modular_residual_uniqueness
      claim: "The admitted stratum gives m<N, gcd(m,N)=1, and 2L<N. If z,z' in [-L,L] both satisfy the residual congruence, then N divides m(z-z'), hence N divides z-z'; because |z-z'|<=2L<N, z=z'."
      prohibited_inference: "No integer divisibility of x+C-c0 by m is inferred."
    - id: threshold_and_no_wrap
      claim: "For t in {0,...,2L+1}, q(t)=1 iff some z' in [-L,L] satisfies z' congruent to z+t modulo N. Here z+t lies in [-L,3L+1]; N>4L+1 prevents a nonzero modular wrap from returning to [-L,L]. Thus q(t)=1 iff z+t<=L iff t<=L-z."
      sentinels:
        q_0: "q(0)=1, proved and unpaid"
        q_2L_plus_1: "q(2L+1)=0, proved and unpaid"
    - id: decoder_and_query_cap
      claim: "The threshold T is one of 2L+1 integers in {0,...,2L}; it needs exactly ceil(log2(2L+1)) shifted-predicate calls in the optimal worst case and at most 4r+2 because 2L+1<4m^4=2^(4r+2). With r+1 F0 restrictions, the top-level call cap is 5r+3. The decoder returns x_hat=(m*(L-T)+c0-C) mod N and verifies [x_hat]P=Q."
      final_verification_required: true
    - id: conditional_mpz_contradiction
      claim: "Under the relayed dense prime-order preprocessing generic-model bound Pr[success] <= 3*ell*(k+1)^2/N, substituting ell=B^(9/4+o(1)), k=B^(5/4+o(1)), and N=B^5 gives B^(-1/4+o(1))=N^(-1/20+o(1))=o(1), contradicting only the assumed nonvanishing success of the jointly correct complete transcript."
      source_status: internal_parent_relay_not_independently_opened
      independent_verification_required: TASK-20260827-c8609e
  proof_decomposition:
    size:
      claim: "The residual search interval has 2L+1 candidates, and the public F0 deck has 2m labelled occurrences."
      responsibility: producer_then_J1_review
    runtime:
      claim: "Top-level predicate calls are at most 5r+3; every lower-level operation is included in aggregate k without reset."
      responsibility: producer_then_J2_review
    correctness:
      claim: "Witness existence, modular uniqueness, no-wrap monotonicity, threshold decoding, and final group verification establish conditional decoder correctness on the admitted stratum."
      responsibility: producer_then_blind_rederivation
    success_probability:
      claim: "Only one jointly correct complete adaptive transcript is assumed nonvanishing; no product, union, or substitution of marginal successes is used."
      responsibility: producer_then_J2_review
    cost_times_inverse_success:
      claim: "The theorem candidate asserts a contradiction with the stated MPZ upper bound under nonvanishing complete-transcript success; it makes no algorithmic expected-cost or speedup claim."
      responsibility: J2_independent_source_and_accounting_review
  resource_ledger:
    preprocessing_advice_bits: "ell=B^(9/4+o(1))"
    aggregate_main_phase_operations: "k=B^(5/4+o(1))"
    f0_paid_calls: "r+1"
    shifted_paid_calls_exact_worst_case: "ceil(log2(2L+1))"
    shifted_paid_calls_conservative_cap: "4r+2"
    total_top_level_call_cap: "5r+3"
    proved_unpaid_sentinels: 2
    full_deck_existence_query_cost: 0
    experiments: 0
    implementation: 0
    commands: 0
    hidden_free_operations: none
  assumptions:
    - id: A1_universal_exact_interface
      statement: "A target-independent universal exact arbitrary-deck ordinary-generic Query2P1 object exists for the specified decks and shifted targets."
      validation_route: "Independent scope review must stop the proof immediately for fixed-target-only, random-only, coordinate-sensitive, P1553-specific, target-conditioned, or extra-oracle objects."
    - id: A2_subset_stability
      statement: "Exact cumulative subset stability retains at least one completion through every adaptive F0 half restriction."
      validation_route: "J1 replays the restriction invariant symbolically against every branch, including zero restricted decks."
    - id: A3_advice_boundary
      statement: "One advice string of ell=B^(9/4+o(1)) ordinary bits is fixed before fresh Q, with all group registers clear and no live or opaque group handle across phases."
      validation_route: "J2 maps each cross-phase object to the independently retrieved MPZ model."
    - id: A4_complete_transcript_success
      statement: "The single adaptive transcript containing all restrictions and correlated shifts is jointly correct with nonvanishing probability."
      validation_route: "J2 rejects any replacement by marginal per-query or per-target success."
    - id: A5_aggregate_accounting
      statement: "Every main-phase target construction, predicate internal operation, group operation, equality test, replay, decode, and verification is charged to one aggregate k=B^(5/4+o(1)) without reset."
      validation_route: "J2 performs a complete operation-ledger audit against the retrieved theorem premises."
  excluded_assumptions:
    - "Integer equality between the residual and a multiple of m"
    - "Integer divisibility of x+C-c0 by m"
    - "A zero digit in D"
    - "Free predicate evaluation"
    - "Target-conditioned preprocessing or retained opaque group state"
    - "Independent or composable marginal successes"
    - "An extra oracle"
    - "A coordinate-sensitive or P1553 interface"
  controls:
    - id: nonzero_digit_alphabet
      object: "D versus an alphabet that includes zero"
      expected: "The exact interval lemma must be proved from nonzero digits, not inherited from a zero-containing alphabet."
      failure_action: falsify_interval_argument
    - id: f0_collision_stratum
      object: "m=2,N=3"
      expected: "Public value injectivity fails, so the admitted-stratum proof must stop."
      failure_action: retain_as_open_collision_stratum
    - id: residual_endpoints
      object: "z=-L, z=0, z=L"
      expected: "Thresholds are respectively 2L, L, and 0, with both proved sentinels preserved."
      failure_action: falsify_threshold_or_decoder
    - id: sign_symmetry
      object: "Q and -Q"
      expected: "Canonical modular decoding and final verification handle both signs without changing the congruence argument."
      failure_action: expose_sign_or_canonicalization_defect
    - id: threshold_sentinels
      object: "q(0) and q(2L+1)"
      expected: "They are respectively true and false under the admitted stratum and are not charged as paid calls."
      failure_action: falsify_no_wrap_or_call_count
    - id: wrong_shift_step
      object: "Replace [m*t]P by an incorrectly scaled shift"
      expected: "The threshold correspondence fails."
      failure_action: reject_shift_mechanism
    - id: decoder_corruption
      object: "Flip one recovered threshold bit"
      expected: "The final check [x_hat]P=Q rejects the corrupted decoder output."
      failure_action: reject_any_unverified_output
    - id: equality_mutant_known_false
      object:
        N: 18731
        m: 8
        coefficients: [8, 8, 8, 8, 8]
        L: 4680
        C: 4681
        S: 37448
        x: 14036
        c0: 8
      rejected_mutant: "x+C-c0=m*z as an integer equality, or equivalently integer divisibility by m"
      arithmetic: "S=x+C+N and x+C-c0=18709 is congruent to 5 modulo 8, while z=4680 still satisfies 8*z congruent to x+C-c0 modulo 18731."
      expected: "The equality and divisibility mutant fails while the congruence formulation passes."
      failure_action: invalidate_correction_if_mutant_is_not_rejected
    - id: wrapped_nearby_object
      object: "N=10009,m=8,L=4680,z=L,t*=649"
      expected: "Outside N>4L+1, q(1)=false and q(649)=true, demonstrating false-then-true modular wrap."
      failure_action: preserve_strict_stratum_and_leave_wrapped_case_open
    - id: fixed_target_only
      object: fixed_target_one_restriction_interface
      expected: "Universal correlated-shift premise is absent; stop before the theorem."
      failure_action: out_of_scope_open
    - id: marginal_success
      object: separate_per_query_success_guarantees
      expected: "Joint complete-transcript premise is absent; stop before MPZ contradiction."
      failure_action: out_of_scope_open
    - id: random_only
      object: random_or_distributional_deck_predicate
      expected: "Exact arbitrary-deck premise is absent; stop before isolation."
      failure_action: out_of_scope_open
    - id: coordinate_or_p1553
      object: coordinate_sensitive_or_P1553_specific_interface
      expected: "Ordinary-generic premise is absent; stop without transferring the claim."
      failure_action: out_of_scope_open
    - id: target_conditioned_or_opaque
      object: target_conditioned_state_or_cross_phase_opaque_handle
      expected: "Advice-boundary premise is absent; stop before MPZ accounting."
      failure_action: out_of_scope_open
    - id: extra_oracle
      object: predicate_with_undeclared_oracle_access
      expected: "Universal ordinary-generic object premise is absent; stop."
      failure_action: out_of_scope_open
    - id: zero_restricted_deck
      object: empty_F0_subset_during_restriction
      expected: "Exact predicate is false and the surviving branch invariant selects the nonempty half."
      failure_action: falsify_subset_stability_replay
  falsification:
    mathematical:
      - "A surviving four-deck witness does not yield a coefficient z_wit in [-L,L]."
      - "Two distinct z,z' in [-L,L] satisfy the same residual congruence on the admitted stratum."
      - "The shifted predicate is not monotone at any admitted parameter tuple."
      - "The N=18731 equality mutant is not rejected by the written proof."
      - "The decoder or final verification fails for z=-L,0,L under the premises."
    interface:
