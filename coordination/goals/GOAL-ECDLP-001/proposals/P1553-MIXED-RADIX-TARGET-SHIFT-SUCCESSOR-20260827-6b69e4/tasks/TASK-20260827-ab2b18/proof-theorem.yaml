      - "Independent retrieval does not support the exact relayed MPZ bound and model mapping."
  scope:
    admitted: "Only the stronger universal exact arbitrary-deck ordinary-generic interface on prime-order strata with m>=2 and N>4L+1, under all named advice, transcript, and accounting premises."
    remains_open:
