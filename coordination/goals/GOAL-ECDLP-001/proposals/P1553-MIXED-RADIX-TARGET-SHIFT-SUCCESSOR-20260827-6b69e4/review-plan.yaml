        preserve fixed-target, wrap, random/coordinate, P1553, target-
        conditioned, extra-oracle, and zero-restriction routes.
      expected_break: >-
        The correction may overstate label removal outside the large stratum
        or transfer the cross-target theorem to the accepted fixed-target one.
