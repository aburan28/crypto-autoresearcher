  coordinator_prior: >-
    The congruence repair remains algebraically plausible. The new risk is
    computational typing at the advice boundary: c0 recovery and public-deck
    handle reconstruction must be explicit finite main-phase work rather than
    being hidden behind injectivity or a public-map abstraction. The expected
    charge is O(m polylog N)=B^(1+o(1)), below but inside aggregate
    k=B^(5/4+o(1)).
  claim_under_review: >-
    A universal exact arbitrary-deck ordinary-generic Query2P1 object with one
    jointly correct adaptive transcript across the declared correlated target
    shifts, target-independent serialized advice ell=B^(9/4+o(1)), explicit
    reconstruction and F0 recovery, and complete aggregate
    k=B^(5/4+o(1)) accounting cannot have nonvanishing success, where the
    residual is the unique z in [-L,L] satisfying
    m*z congruent to x+C-c0 modulo N.
  joints:
    - joint: J1-corrected-nonzero-interval-injectivity-congruence-threshold-decoder
      assigned_to: TASK-20260827-25ef1f
      role: reviewer
      attack_plan: >-
        Re-derive the nonzero D interval, universal witness, cumulative
        isolation, F0 injectivity, modular residual existence and uniqueness,
        shifted threshold, endpoints, exact calls, decoder, and verification.
        Run the N=18731 integer-equality mutant and independently adjudicate
        the first invalid producer defect.
      expected_break: >-
        A proof line may again lift a congruence to integer equality, or a
        wrapped witness may invalidate the threshold or decoder.
    - joint: J2-complete-correlated-transcript-reconstruction-and-mpz-accounting
      assigned_to: TASK-20260827-c8609e
      role: validator
      attack_plan: >-
        Independently retrieve MPZ; verify one complete correlated transcript;
        reconstruct every post-boundary deck handle from known scalar lineage;
        reproduce direct singleton-label recovery and value-only recovery by
        at most 2m equality tests or an equivalently charged dictionary; and
        charge build, serialization, collision handling, targets, predicates,
        replay, decode, and verification without resetting k. Independently
        adjudicate the second invalid producer's accounting omission.
      expected_break: >-
        The isolated value may need an uncharged dictionary or retained handle,
        reconstruction may exceed the rectangle, or target calls may be
        separate success events rather than one MPZ execution.
    - joint: J3-scope-controls-and-preserved-routes
      assigned_to: TASK-20260827-2e2dc4
      role: red-team
      attack_plan: >-
        Run every nearby-object control, demand the first missing premise, and
        preserve fixed-target, wrap, random/coordinate, P1553,
        target-conditioned, extra-oracle, zero-restriction, invalid equality,
        and hidden-handle routes.
      expected_break: >-
        The repair may overstate finite reconstruction, smuggle a group handle
        across phases, or transfer the cross-target theorem to fixed target.
