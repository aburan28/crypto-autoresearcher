blind_statement:
  schema: crypto.autoresearch.blind_statement.v1
  id: BLIND-P1553-TARGET-SHIFT-SUCCESSOR-20260827-6b69e4-V2
  goal_id: GOAL-ECDLP-001
  packet_id: P1553-MIXED-RADIX-TARGET-SHIFT-SUCCESSOR-20260827-6b69e4
  recorded_at: "2026-08-27"
  supersedes: BLIND-P1553-TARGET-SHIFT-SUCCESSOR-20260827-6b69e4
  quantity: >-
    Re-derive the nonzero signed four-deck interval, large-stratum F0 value
    injectivity and finite recovery cost, public-deck handle reconstruction,
    unique modular residual, correlated-target threshold, exact query cap,
    decoder, and conditional MPZ exponent from this statement alone.
  setting:
    group: "A prime-order ordinary generic group G=<P> of order N."
    target: "Q=[x]P for fresh uniform canonical x in {0,...,N-1}."
    parameters:
      B: "N^(1/5)"
      r: "ceil(log2(B))"
      m: "2^r"
      D: "{-m,...,-1,1,...,m}"
      C: "sum_i=0^4 m^i"
      L: "m+m^2+m^3+m^4"
      stratum: "N>4L+1 and m>=2"
    decks: >-
      For i=0,...,4, F_i contains labelled occurrences
      (i,d,sigma,[sigma*(d+1)*m^i]P) for 0<=d<m and sigma in
      {+1,-1}. Each public label has known signed integer coefficient
      c_i=sigma*(d+1) in D. The labels and scalar lineage are public ordinary
      data; generic encodings are not permitted to cross preprocessing.
    initial_target: "R=Q+[C]P"
    universal_witness: >-
      If x=sum_i=0^4 a_i*m^i is its canonical base-m expansion, the five
      all-positive occurrences d_i=a_i sum to [x+C]P=R.
  object_premise:
    - One target-independent universal exact ordinary-generic object accepts arbitrary public signed occurrence-labelled decks.
    - Its predicate is exactly stable under every canonical cumulative dyadic restriction of F0.
    - One advice string of at most ell=B^(9/4+o(1)) ordinary bits is fixed before Q; no live or opaque group handle crosses phases.
    - In one main phase, F0 restrictions and every correlated target query form one jointly correct adaptive transcript with nonvanishing complete-transcript success.
    - Every ordinary-generic operation, representation query, public-deck reconstruction, target construction, predicate internal, equality test, dictionary operation, replay, decode, and verification step is included in one aggregate k=B^(5/4+o(1)); k never resets.
    - No free Query2P1 oracle, target-conditioned advice, retained generic handle, or extra oracle is available.
  reduction_statement:
    isolation: >-
      Canonical cumulative dyadic restriction isolates one F0 singleton in
      exactly log2(2m)=r+1 predicate calls. Full-deck existence is proved by
      the universal witness and is not a paid predicate call.
    interval_obligation: >-
      Prove D+mD=[-(m+m^2),m+m^2] with zero absent from D, then prove
      D+mD+m^2D+m^3D=[-L,L].
    injectivity_and_recovery_obligation: >-
      Prove that on N>4L+1 the isolated encoding uniquely determines c0 in D.
      If the singleton restriction interface exposes its public label, charge
      the ordinary label lookup. If it exposes only a generic value,
      reconstruct the 2m public F0 encodings from known scalar lineage inside
      the main phase and use at most 2m labelled equality tests, or a dictionary
      whose construction, serialization, storage, collisions, and lookup are
      charged explicitly. Prove this costs O(m polylog N)=B^(1+o(1)) and lies
      inside aggregate k. State why injectivity fails in collision strata such
      as m=2,N=3.
    handle_reconstruction_obligation: >-
      Reconstruct every required public-deck generic handle after the advice
      boundary from its known scalar coefficient, charge all generic
      operations and storage/traffic, and retain no opaque or live group handle
      across phases. Bound the full public reconstruction by
      O(m polylog N)=B^(1+o(1)) inside aggregate k.
    residual_relation: >-
      A surviving four-deck completion supplies at least one z in [-L,L] with
      m*z congruent to x+C-c0 modulo N. Prove it is unique using m<N,
      gcd(m,N)=1, and 2L<N. Do not assert integer equality or divisibility.
    correlated_targets: >-
      For t=0,...,2L+1 define R_t=R+[m*t]P and let q(t) be the exact predicate
      on singleton F0 and full F1,F2,F3,F4 inside the same jointly correct
      transcript. Then q(t)=1 iff z+t modulo N has a representative in [-L,L].
    threshold_obligation: >-
      Prove q(t)=1 iff t<=L-z, including unpaid logical sentinels q(0)=1 and
      q(2L+1)=0, and show why N>4L+1 is the sharp uniform no-wrap threshold for
      the full shift range.
    query_obligation: >-
      The threshold T=L-z is one of 2L+1 values. Derive exact optimal worst-case
      shifted-predicate count ceil(log2(2L+1)), its upper bound 4r+2, and the
      conservative combined cap 5r+3 including F0 isolation.
    decoder: >-
      Recover z=L-T and output x_hat=(m*z+c0-C) mod N; require final
      verification [x_hat]P=Q.
  known_false_controls:
    residual_equality:
      statement: >-
        N=18731, m=8, L=4680, C=4681, all c_i=8, x=14036, c0=8 gives
        x+C-c0=18709 congruent to 5 modulo 8, while z=4680 satisfies the
        required congruence. Any integer-equality/divisibility proof must fail.
    omitted_recovery_cost: >-
      An argument that invokes value injectivity but supplies no finite public
      recovery algorithm or omits its build/equality/lookup charge is
      incomplete.
    retained_handle: >-
      An argument that carries a generic deck encoding across preprocessing
      violates the ordinary-bit advice premise.
  source_bound_supplied_for_arithmetic_only:
    statement: >-
      Under the MPZ dense prime-order preprocessing generic-group model, one
      complete adaptive main-phase execution with ell advice bits and k
      interactions has average success at most 3*ell*(k+1)^2/N.
    citation: "Maurer, Portmann, and Zhu, Unifying Generic Group Models, IACR ePrint 2020/996, Theorem 3 and Corollary 3"
    provenance: internal_statement_for_blind_arithmetic_not_independent_source_verification
    exponent_obligation: >-
      Substitute ell=B^(9/4+o(1)), k=B^(5/4+o(1)), and N=B^5; state the exact
      B and N exponents and every applicability premise.
  required_distinctions:
    - The premise is joint correctness of one adaptive correlated-target transcript, not independent or marginal per-target success.
    - The accepted fixed-target one-restriction interface does not imply the correlated-target premise.
    - The signed alphabet excludes zero even though the multi-deck sumset contains zero.
    - Value injectivity is not a free decoder; finite recovery and public-handle reconstruction must be charged.
    - The theorem is conditional on the object premise and does not construct the object.
