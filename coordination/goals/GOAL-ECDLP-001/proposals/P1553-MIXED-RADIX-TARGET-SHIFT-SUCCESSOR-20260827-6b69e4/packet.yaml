  objective: >-
    Produce and independently review one additive corrected target-shift
    generic-interface theorem: preserve the verified interval, threshold,
    decoder, and MPZ accounting; replace the false large-stratum label
    necessity with exact F0 value injectivity; and supply a complete frozen
    statement for a fresh blind derivation.
  exact_corrections:
    producer_record:
      prior_defect: >-
        The predecessor incorrectly excluded value-only F0 isolation on the
        admitted N>4L+1 stratum by asserting that an occurrence label was
        necessary to recover c0.
      corrected_statement: >-
        For c,c' in D={-m,...,-1,1,...,m}, [c]P=[c']P implies N divides
        c-c'. Since N>4L+1>2m and |c-c'|<=2m, c=c'. Thus an exact isolated
        generic encoding uniquely identifies c0 through the public deck map;
        labels are required only on separately admitted collision strata.
    blind_statement:
      prior_defect: >-
        The predecessor blind statement omitted D, C, the x-to-z relation,
        the public shift formula, ell, k, and the exact MPZ bound.
      corrected_statement: >-
        Freeze all definitions and quantifiers before dispatch so a blind
        rederiver can reconstruct the exact theorem without producer access.
  theorem_target: >-
    Under one target-independent universal exact arbitrary-deck generic
    Query2P1 object whose complete transcript remains jointly correct across
    the declared correlated public target shifts, complete serialization and
    aggregate interaction accounting are incompatible with nonvanishing
    success at ell=B^(9/4+o(1)), k=B^(5/4+o(1)).
  mandatory_assumptions:
    - Prime-order ordinary generic group G=<P> of order N and fresh uniform Q=[x]P.
    - B=N^(1/5), r=ceil(log2 B), m=2^r, D={-m,...,-1,1,...,m}, C=sum_i=0^4 m^i, and L=m+m^2+m^3+m^4.
    - Strict large stratum N>4L+1; small or wrapped strata are outside the linear-threshold theorem.
    - Exact cumulative subset stability for F0 and one jointly correct adaptive transcript for every correlated target queried by the reduction.
    - Target-independent ordinary-bit advice; no opaque crossing handles, free predicate, target-conditioned state, or extra oracle.
    - Every predicate internal, target construction, replay, decode, and verification interaction is charged to one aggregate k without reset.
  required_controls:
    - Exact nonzero signed alphabet D versus the incorrectly broadened interval alphabet including zero.
    - Large-stratum F0 value injectivity versus the m=2,N=3 collision control.
    - z=-L,0,L; Q and -Q; endpoint sentinels; wrong shift step; and one-bit decoder corruption.
    - N<=4L+1 wrap control exhibiting false-then-true membership.
    - Fixed-target-only, marginal-success, random-only, coordinate/P1553, target-conditioned, extra-oracle, and zero-restriction controls.
    - Complete blind-statement audit with no producer or sibling reads.
