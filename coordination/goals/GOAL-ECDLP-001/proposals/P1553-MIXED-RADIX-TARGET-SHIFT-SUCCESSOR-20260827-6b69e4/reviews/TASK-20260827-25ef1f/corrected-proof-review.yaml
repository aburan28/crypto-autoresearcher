  independent_derivation:
    universal_witness:
      verdict: holds
      derivation:
        - >-
          Since r=ceil(log2 B) and m=2^r, m is at least B, hence
          m^5 is at least B^5=N.
        - >-
          Every canonical x in [0,N-1] therefore has five base-m digits
          a_i in [0,m-1], with leading zero digits allowed.
        - >-
          Choosing the public positive coefficient c_i=a_i+1 in
          D={-m,...,-1,1,...,m} gives sum_i c_i*m^i=x+C, so the five
          public deck values sum to R=Q+[C]P. No predicate call is needed.
      quantifier_fidelity: universal_for_every_canonical_x
    exact_nonzero_interval:
      verdict: holds
      alphabet: "D={-m,...,-1,1,...,m}"
      zero_adjoined: false
      base_case: >-
        For D+mD, each high digit e in D contributes the two integer
        intervals [em-m,em-1] and [em+1,em+m]. The missing center em is
        supplied by an adjacent nonzero high digit: em=(e-1)m+m for e>=2,
        m=2m-m, and negative centers follow by symmetry. Also 0=m-m.
        These translates cover exactly [-(m^2+m),m^2+m]; the triangle
        bound gives the reverse inclusion.
      induction: >-
        If the first j nonzero digits give [-S,S] with S at least m^j,
        then adding m^j D gives radius-S intervals centered at the signed
        nonzero multiples e*m^j. Adjacent intervals and the two central
        signed intervals overlap because S>=m^j. Their outer endpoints are
        exactly plus or minus (S+m^(j+1)). Applying this for the third and
        fourth digits proves D+mD+m^2D+m^3D=[-L,L].
      control_enumeration: "m=2,4,8 all exact; zero absent from D"
    admitted_stratum_implications:
      verdict: holds
      premise: "N>4L+1"
      consequences:
        m_lt_N: true
        gcd_m_N_eq_1: true
        two_m_lt_N: true
        two_L_lt_N: true
      derivation: >-
        L>=m, so N>4L+1 implies N>4m+1 and hence m<N and 2m<N.
        Prime N with m<N gives gcd(m,N)=1. The same premise directly gives
        2L<N.
    f0_value_injectivity:
      verdict: holds
      derivation: >-
        If [c]P=[c']P, then N divides c-c'. For distinct same-sign c,c'
        the nonzero difference has absolute value at most m-1<N. For
        opposite signs its absolute value is between 2 and 2m<N. Neither can
        be a nonzero multiple of N, so all 2m admitted F0 values are distinct.
      nearby_collision_control: >-
        At m=2,N=3 the residue buckets are {-2,1} and {-1,2}; injectivity
        fails exactly where the admitted-stratum premise is absent.
    r_plus_1_singleton_isolation:
      verdict: holds
      derivation: >-
        The current candidate set begins with 2m=2^(r+1) public labels and
        has a witness by the universal construction. At each level, query one
        canonical half. A true answer retains a witness-bearing half. A false
        answer proves the previously surviving witness uses the complement,
        which is therefore witness-bearing. Exactly r+1 halvings leave one
        F0 singleton; no initial full-deck call is required.
      coefficient_recovery_boundary: >-
        J1 establishes uniqueness of c0 from the admitted public value map.
        The finite recovery procedure and its complete charge remain J2-owned.
    modular_residual:
      verdict: holds
      exact_relation: "m*z congruent x+C-c0 (mod N)"
      integer_equality_used: false
      divisibility_used: false
      existence: >-
        The witness surviving singleton isolation has F1-through-F4 weighted
        scalar m*z for some z in D+mD+m^2D+m^3D=[-L,L], so the declared
        congruence has an interval solution.
      uniqueness: >-
        If z and z' are interval solutions, then m(z-z') is 0 modulo N.
        Since gcd(m,N)=1, N divides z-z'. But |z-z'|<=2L<N, hence z=z'.
    no_wrap_threshold:
      verdict: holds
      shifted_target: "R_t=R+[m*t]P"
      domain: "0<=t<=2L+1"
      derivation: >-
        With F0 fixed, exact residual-deck coverage gives q(t)=1 exactly
        when some s in [-L,L] satisfies s congruent z+t modulo N. Here
        z+t lies in [-L,3L+1]. If z+t>L and were congruent to such an s,
        then 0<z+t-s<=4L+1<N, impossible for a multiple of N. Thus
        q(t)=1 iff z+t<=L, equivalently t<=T=L-z.
      sentinels:
        q_0: true
        q_2L_plus_1: false
        charged_as_calls: false
      edge_residuals:
        z_minus_L_threshold: "T=2L"
        z_zero_threshold: "T=L"
        z_plus_L_threshold: "T=0"
    exact_calls:
      verdict: holds
      isolation_calls: "r+1"
      threshold_candidates: "2L+1 values for T in [0,2L]"
      threshold_calls: "ceil(log2(2L+1))"
      bound_derivation: >-
        For m>=2, 2L+1=2(m+m^2+m^3+m^4)+1 is at most
        4m^4=2^(4r+2), so the threshold search costs at most 4r+2 calls.
      total_bound: "(r+1)+(4r+2)=5r+3"
    decoder_and_verification:
      verdict: holds
      decoder: "x_hat=(m*z+c0-C) mod N"
      derivation: >-
        The modular residual relation makes x_hat congruent to x modulo N;
        both are canonical residues, so x_hat=x. The mandatory generic test
        [x_hat]P=Q rejects every distinct canonical scalar because P has
        prime order N. A verification failure is a transcript failure, not a
        sample to discard.
    equality_mutant_N_18731:
      verdict: rejects_integer_equality_and_preserves_congruence
      parameters:
        N: 18731
        prime: true
        r: 3
        m: 8
        L: 4680
        C: 4681
        x: 14036
        c0: 8
        z: 4680
        coefficients: [8, 8, 8, 8, 8]
      admitted_check: "18731>4*4680+1=18721"
      tuple_scalar_sum: 37448
      canonical_x_plus_C: 18717
      wrap_identity: "37448=14036+4681+18731"
      m_times_z: 37440
      x_plus_C_minus_c0: 18709
      numerator_mod_m: 5
      congruence_holds: true
      integer_equality_holds: false
      integer_divisibility_holds: false
      decoded_x: 14036
