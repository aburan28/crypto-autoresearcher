        theorem_3: >-
          For prime N, positive integer k and advice length ell, every
          ell-bit two-phase solver in pG_dense with unlimited preprocessing,
          at most k main-phase interactions, unbounded registers, and dense
          representation access has average-case extraction success at most
          3*ell*(k+1)^2/N.
        preprocessing_boundary: >-
