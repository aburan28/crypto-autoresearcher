    exact_command: |-
      python3 - <<'PY'
      import json
      from fractions import Fraction
      from math import ceil, log2

      N = 18731
      r = 3
      m = 2**r
      D = list(range(-m, 0)) + list(range(1, m + 1))
      C = sum(m**i for i in range(5))
      L = sum(m**i for i in range(1, 5))
      x = 14036
      assert (N, m, C, L) == (18731, 8, 4681, 4680)
      assert N > 4 * L + 1
      inv_m = pow(m, -1, N)

      def short_residual(c):
          residue = ((x + C - c) * inv_m) % N
          candidates = [residue, residue - N]
          matches = [z for z in candidates if -L <= z <= L]
          assert len(matches) <= 1
          return matches[0] if matches else None

      def q_from_residual(z, t):
          residue = (z + t) % N
          return any(-L <= z2 <= L for z2 in (residue, residue - N))

      eligible = {c: short_residual(c) for c in D if short_residual(c) is not None}
      candidates = D[:]
      isolation = []
      while len(candidates) > 1:
          half = candidates[:len(candidates)//2]
          answer = any(c in eligible for c in half)
          retained = half if answer else candidates[len(candidates)//2:]
          isolation.append({
              "queried_half": half,
              "answer": answer,
              "retained": retained,
          })
          candidates = retained
      c0 = candidates[0]
      z = short_residual(c0)
      assert (c0, z) == (8, L)
      assert len(isolation) == r + 1

      f0_values = {c: c % N for c in D}
      assert len(set(f0_values.values())) == 2*m
      isolated_value = f0_values[c0]
      comparison_trace = []
      for c in D:
          equal = f0_values[c] == isolated_value
          comparison_trace.append({"label": c, "equal": equal})
          if equal:
              break
      assert comparison_trace[-1] == {"label": 8, "equal": True}
      assert len(comparison_trace) == 2*m

      lo, hi = 0, 2*L + 1
      assert q_from_residual(z, lo) is True
      assert q_from_residual(z, hi) is False
      threshold_queries = []
      while hi - lo > 1:
          t = (lo + hi) // 2
          answer = q_from_residual(z, t)
          threshold_queries.append({"t": t, "answer": answer})
          if answer:
              lo = t
          else:
              hi = t
      T = lo
      recovered_z = L - T
      x_hat = (m*recovered_z + c0 - C) % N
      assert (T, recovered_z, x_hat) == (0, z, x)
      assert (x_hat - x) % N == 0

      all_lineages = []
      for i in range(5):
          for c in D:
              all_lineages.append({"deck": i, "coefficient": c, "scalar_mod_N": (c * m**i) % N})
      assert len(all_lineages) == 5 * 2 * m
      assert all(isinstance(item["coefficient"], int) for item in all_lineages)

      worst_shifted = ceil(log2(2*L + 1))
      worst_top_level = (r + 1) + worst_shifted
      assert worst_shifted <= 4*r + 2
      assert worst_top_level <= 5*r + 3
      assert Fraction(9,4) + 2*Fraction(5,4) - 5 == Fraction(-1,4)
      assert Fraction(-1,4) * Fraction(1,5) == Fraction(-1,20)

      out = {
          "kind": "single_deterministic_validation_transcript",
          "scientific_experiment": False,
          "parameters": {"N": N, "r": r, "m": m, "D_size": len(D), "C": C, "L": L, "x": x},
          "eligible_F0_coefficients": eligible,
          "isolation": {
              "queries": isolation,
              "call_count": len(isolation),
              "direct_singleton_label_c0": c0,
          },
          "value_only_recovery": {
              "isolated_scalar_encoding_mod_N": isolated_value,
              "comparison_count": len(comparison_trace),
              "cap_2m": 2*m,
              "match_label": comparison_trace[-1]["label"],
              "f0_injective": True,
          },
          "correlated_threshold": {
              "same_transcript": True,
              "queries": threshold_queries,
              "shifted_call_count_this_branch": len(threshold_queries),
              "worst_case_bound": worst_shifted,
              "T": T,
              "recovered_z": recovered_z,
          },
          "decoder": {"x_hat": x_hat, "verified_equal_to_x_mod_N": True},
          "public_handle_lineage": {
              "deck_handle_count": len(all_lineages),
              "all_coefficients_known_after_boundary": True,
              "opaque_preprocessing_handles": 0,
              "targets_from_Q_and_known_P_scalars": True,
          },
          "call_accounting": {
              "top_level_calls_this_branch": len(isolation) + len(threshold_queries),
              "worst_case_top_level_bound": worst_top_level,
              "declared_cap_5r_plus_3": 5*r + 3,
              "k_reset": False,
          },
          "mpz_exponents": {
              "B_exponent": "-1/4",
              "N_exponent": "-1/20",
          },
      }
      print(json.dumps(out, indent=2, sort_keys=True))
      PY
