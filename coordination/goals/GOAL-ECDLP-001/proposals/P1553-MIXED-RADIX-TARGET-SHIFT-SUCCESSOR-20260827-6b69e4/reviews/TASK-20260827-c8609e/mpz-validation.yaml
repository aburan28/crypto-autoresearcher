  mpz_model_mapping:
    status: holds_conditionally
    scalar_model: >-
      Identify P with the model constant 1, Q=[x]P with the main-phase x
      register, public group addition with +, and an ordinary generic encoding
      or equality query with information no stronger than the dense output.
    object_boundary: >-
      Query2P1 is not admitted as an extra oracle. The claimed implication is
