  objections:
    - id: J3-O1-TYPE-BOUNDARY-IS-A-PREMISE
      severity: nonblocking_scope_limitation
      disposition: scoped_not_break
      statement: >-
        A generic encoding is physically representable by bits, so the phrase
        ordinary serialized bits would be insufficient by itself to exclude a
        serialized opaque group handle. The frozen candidate avoids that
        ambiguity by separately requiring zero generic handles in advice,
        zero opaque carryover, scalar-lineage descriptors only, and
        post-target reconstruction. The exclusion is a theorem premise, not a
        derived fact about every serializer or preprocessing model.
      consequence: >-
        The candidate does not apply to models that permit preprocessed group
        handles, opaque cache keys, or handle-equivalent serialized state.
        Those models remain open and must not be described as obstructed.
    - id: J3-O2-ASYMPTOTIC-NOT-CONCRETE-COST
      severity: nonblocking_scope_limitation
      disposition: scoped_not_break
      statement: >-
        J3 can type the declared reconstruction at the asymptotic interface
        level, but it does not independently validate representation-specific
        constants, MPZ model applicability, or the producer's complete-k
        arithmetic. Those are owned by J2 and cannot be inferred from this
        report.
      consequence: >-
        No whole-claim or source-bound verdict follows from J3 holding.
    - id: J3-O3-CONTROL-HARNESS-STRING-PREDICATE
      severity: operational_only
      disposition: procedure_deviation_recorded
      statement: >-
        The sole deterministic bundled control run executed all thirteen
        controls and then exited nonzero because its C13 harness predicate
        searched for the exact phrase zero-valued coefficient while the
        frozen record says a zero coefficient not present in D. The run's own
        C13 observations show both substantive conditions true: zero is
        excluded and restrictions are subset-only.
      consequence: >-
        No rerun was made because maximum_runs is one. The nonzero exit is an
        implementation-only observation and no mathematical evidence. C13 is
        adjudicated below by direct static reading of the already-opened
        frozen statement, with the machine failure preserved in
        controls-results.json.
  required_controls:
    - id: C1
      object: N=18731 integer-equality and divisibility mutant
      result: rejected_mutant_congruence_survives
      first_missing_premise: >-
        No premise forces the congruence quotient to zero. A3 gives uniqueness
        of z modulo N inside [-L,L], not the integer equality
        x+C-c0=m*z or divisibility of x+C-c0 by m.
      exact_observation: >-
        With m=8, L=4680, C=4681, x=14036, c0=8, and z=4680,
        m*z=37440 and x+C-c0=18709 differ by exactly N=18731;
        the congruence holds, integer equality fails, and 18709 mod 8 is 5.
    - id: C2
      object: omitted-F0-lookup-cost mutant
      result: rejected_at_finite_recovery_and_inclusive_k_gate
      first_missing_premise: >-
        A7 and the finite-public-label-recovery obligation require a direct
        label or at most 2m labelled equality tests, or an equivalent fully
        charged dictionary, inside one aggregate k.
      exact_observation: >-
        The current candidate names reconstruction, build, serialization,
        storage, collision lists, memory traffic, equality/hash work, lookup,
        label retention, teardown, and handle clearing. Deleting that ledger
        makes the computation untyped and prevents the claimed k substitution.
    - id: C3
      object: retained opaque public-deck handle mutant
      result: rejected_at_advice_boundary
      first_missing_premise: >-
        A5 plus the explicit phase boundary allow only target-independent
        scalar-lineage descriptors as ordinary bits and require zero live,
        cached, serialized-as-opaque, or otherwise usable generic handles.
      exact_observation: >-
        The frozen ledger sets advice generic_handles to zero and
        preprocessing_handle_carryover to zero; every needed generic encoding
        is declared reconstructed after Q inside k.
    - id: C4
      object: fixed-target-only object
      result: outside_scope
      first_missing_premise: >-
        A4 and A6 require the same universal object and one jointly correct
        adaptive transcript across every correlated R_t. Correctness only at
        R supplies no threshold predicate q(t).
    - id: C5
      object: marginal per-query success
      result: outside_scope
      first_missing_premise: >-
        A6 requires one jointly correct adaptive event. Separate marginal
        successes cannot be composed into nonvanishing decoder success.
    - id: C6
      object: N<=4L+1 wrapped stratum
      result: linear_threshold_rejected_wrap_demonstrated
      first_missing_premise: >-
        A3, N>4L+1, is absent, so the interval image can wrap and q(t) need not
        be a single true-then-false threshold.
      exact_observation: >-
        For N=10009, m=8, L=4680, and z=4680, q(1) is false but
        q(649) is true because 4680+649=5329 is congruent to -4680 modulo
        10009. The false-then-true sequence directly defeats linear binary
        search outside the admitted stratum.
    - id: C7
      object: m=2,N=3 F0 collision stratum
      result: collision_detected_outside_injective_stratum
      first_missing_premise: >-
        A3's consequence 2m<N is absent. The admitted-stratum F0 injectivity
        lemma is unavailable and collision labels/lists become semantically
        necessary.
      exact_observation: >-
        D={-2,-1,1,2} maps modulo 3 into two collision buckets:
        {-2,1} at residue 1 and {-1,2} at residue 2.
    - id: C8
      object: alphabet including zero instead of D
      result: different_object_outside_scope
      first_missing_premise: >-
        The frozen parameter and deck definition uses
        D={-m,...,-1,1,...,m} and c=sigma(d+1). Adding zero changes the
        witness language before the nonzero interval lemma is invoked.
    - id: C9
      object: random-deck-only object
      result: outside_scope
      first_missing_premise: >-
        A4 quantifies over the declared structured arbitrary signed labelled
        restrictions and correlated targets. A guarantee only for random
        decks supplies no premise for those deterministic decks.
    - id: C10
      object: coordinate-aware or P1553 object
      result: outside_scope
      first_missing_premise: >-
        A4 and A8 are ordinary-generic. Coordinate observables or a P1553
        correspondence change the model and no transfer lemma is supplied.
    - id: C11
      object: target-conditioned advice
      result: outside_scope
      first_missing_premise: >-
        A5 fixes target-independent advice before fresh Q. Advice chosen after
        Q or x reverses the theorem's quantifier order.
    - id: C12
      object: extra-oracle object
      result: outside_scope
      first_missing_premise: >-
        The declared A4 object and A7 ledger contain no auxiliary restriction,
        label, coordinate, or decoding oracle. Using one invalidates both the
        ordinary-generic model mapping and the complete-k premise.
    - id: C13
      object: zero restricted decks
      result: different_witness_language_outside_scope
      adjudication: direct_static_after_recorded_harness_string_mismatch
      first_missing_premise: >-
        A4 permits subset restrictions of the frozen F_i entries. Inserting a
        zero coefficient that is absent from D is not a subset restriction and
        changes the witness language.
  counterexample_or_mutation:
    decisive_controls:
      - >-
        C1 preserves the corrected modular congruence while falsifying the
        predecessor's integer equality and divisibility by a one-modulus wrap.
      - >-
        C6 exhibits false-then-true wrapped membership, so the strict large
        stratum is load-bearing rather than decorative.
      - >-
        C7 exhibits explicit F0 value collisions, so large-stratum
        injectivity cannot be transferred to small collision strata.
  reconstruction_typing:
    verdict: declaration_level_fully_typed_no_smuggled_handle_or_advice
    derivation:
      public_deck_population: >-
        Five frozen decks each have 2m labelled entries, hence at most 10m
        public deck encodings are needed if all are materialized once.
      public_encoding_work: >-
        Each encoding has a known public scalar lineage and can be rebuilt
        after Q with polylog(N) generic work; 10m such entries remain
        O(m polylog N).
      f0_recovery_work: >-
        Direct singleton-label recovery needs no search; encoding-only recovery
        uses at most 2m labelled equality tests, or a dictionary whose build,
        representation, collisions, traffic, lookup, retention, and teardown
        are all explicitly charged.
      target_and_verification_work: >-
        R, the at most 4r+2 adaptively chosen R_t values, replay handles, and
        [x_hat]P are all named as online reconstructions and charged without a
        reset. Their polylogarithmic count does not exceed the stated
        O(m polylog N) envelope.
      advice_boundary: >-
        Only target-independent public scalar descriptors may persist as
        ordinary bits; the ledger declares zero generic handles and zero
        preprocessing handle carryover. Treating an encoding bitstring as
        ordinary advice is expressly C3, not a permitted implementation.
      aggregate: >-
        The candidate places this B^(1+o(1)) work inside, rather than beside or
        after, k=B^(5/4+o(1)).
    limitations:
      - This is a J3 interface/scope typing result, not J2 cost validation.
      - No representation-specific constant, concrete byte count, or MPZ model mapping is independently established here.
      - The no-opaque-handle rule is an explicit premise; models that relax it remain open.
  baseline_comparison: >-
    No realized ECDLP algorithm is supplied, so there is no time-memory-data
    point to compare against Pollard rho or BSGS. The packet honestly records
    Pollard rho unchanged, obtained_delta none, and the full frontier and SOTA
    delta unverified. J3 finds no scope text that promotes the conditional
    obstruction into an attack, speedup, lower bound, or frontier movement.
  heuristic_challenges:
    - >-
      The universal exact arbitrary-deck object and one jointly correct
      correlated-target transcript are explicit unverified premises, not
      experimentally validated heuristics or constructions. J3 does not
      convert them into existence evidence.
  cost_model_challenges:
    - >-
      The omitted-cost mutant fails before MPZ because no finite c0 recovery or
      inclusive k can be instantiated. The current candidate repairs that
      declaration-level defect.
    - >-
      The retained-handle mutant fails at the advice type boundary. Allowing
      opaque group state would define a different model and remains open.
    - >-
      J2 still owns independent verification that the exact external theorem
      accepts this resource ledger and that no representation-dependent cost
      exceeds the declared rectangle.
  reduction_and_scope_challenges:
    preserved_open_routes:
      - existence or construction of the universal exact Query2P1 object
      - fixed-target-only and accepted fixed-target restriction interfaces
      - marginal-success models lacking a jointly correct adaptive event
      - wrapped or circular N<=4L+1 regimes
      - small collision strata requiring labels or collision-aware recovery
      - zero-inclusive alphabets and zero-restriction witness languages
      - random-deck-only objects
      - coordinate-aware objects and P1553 target-local transducers or dyadic-unit-product routes
      - target-conditioned preprocessing or advice
      - extra-oracle models
      - opaque-handle or handle-equivalent advice models
      - generic ECDLP conclusions beyond the exact conditional object
    rejected_formulations_preserved_as_controls:
      - integer equality or divisibility substituted for the modular residual
      - finite F0 recovery or lookup treated as free
      - preprocessed generic handles silently relabelled as ordinary advice
  proof_architecture_challenges:
    observation_fiber: >-
      C3 holds the serialized-bit surface fixed while changing whether the bits
      are inert public scalar descriptors or usable opaque group handles. The
      candidate distinguishes the fiber only through its explicit typed
      premise; without that premise the claimed model is not identifiable.
    quantifier_order: >-
      C4, C5, and C11 stop respectively at correlated-target universality,
      joint transcript success, and advice-before-Q. No witness or advice is
      silently chosen after the target within the frozen statement.
    nearby_object: >-
      C6 and C7 demonstrate concrete boundary failures; C8-C13 identify
      changed languages or stronger models rather than transferring the
      conclusion.
    method_ceiling: >-
      The strongest J3-permitted conclusion is a scope-safe conditional
      ordinary-generic obstruction candidate. It cannot establish object
      existence, fixed-target behavior, coordinates, P1553, a generic ECDLP
      lower bound, an algorithm, attack, SOTA change, closure, completion, or
      breakthrough.
  narrowest_supported_statement: >-
    For J3 only, the frozen successor explicitly distinguishes all thirteen
    preregistered nearby objects at a named premise, preserves every unaffected
    route, and declares a complete asymptotic type path for public F0 recovery
    and post-boundary public-handle reconstruction without permitting opaque
    handles or uncharged advice. This statement does not adjudicate J1, J2,
    the blind re-derivation, MPZ applicability, or the whole claim.
  next_concrete_action: >-
    The Coordinator should compose this J3-only holds verdict with the still
    independent J1, J2, and blind outputs. Preserve the one-run C13 harness
    string-predicate deviation exactly as recorded; do not rerun it under this
    task or treat it as mathematical evidence. No research-state transition is
    authorized by this report.
