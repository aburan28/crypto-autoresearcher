  joint_verdict: holds
  whole_claim_verdict: null
  claim_under_review: >-
    Whether the corrected candidate is confined to the sufficiently-large
    N>4L+1, correlated-target, one-joint-transcript, target-independent
    ordinary-generic interface; whether every known-false nearby object stops
    at a named missing premise; and whether the declared O(m polylog N)
    recovery/reconstruction path crosses the advice boundary without an
    uncharged or opaque generic handle.
  snapshot:
    binding_mode: content_first
    commit: c0441a2edb50ccff7c807f6a0140ea82627cb81b
    parent: 319cbe34a33fd418f261ad6a35fa50fdf15329f1
    receipt: coordination/goals/GOAL-ECDLP-001/proposals/P1553-MIXED-RADIX-TARGET-SHIFT-SUCCESSOR-20260827-6b69e4/archives/TASK-20260827-4eefbd/snapshot-receipt.json
