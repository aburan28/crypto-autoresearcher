review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-QEC-COHERENT-QROM-aca034
  goal_id: GOAL-ECDLP-001
  batch_id: null
  packet_id: QEC-COHERENT-QROM-PREADMISSION-20260824-aca034
  recorded_at: "2026-08-24"
  coordinator_prior: >-
    A concrete coherent qROM circuit is likely to cure the predecessor packet's
    missing interface and implementation defect, but the first implementation
    is likely to fail at qROM coordinate or exceptional-mask target cleanliness,
    to clean an exceptional predicate before its arithmetic use, to mishandle a
    negative-control sandwich, or to omit the added forward/inverse pass costs
    from the conditional leading-cost statement. This prior is recorded before
    any reviewer runs and is not evidence.
  claim_under_review: >-
    Whether the archived producer artifacts justify only a validated exact
    fixed-base signed-window correction within the frozen reversible circuit IR,
    with any leading 3n+O(log n) statement explicitly conditional on the pinned
    upstream arithmetic primitive bounds. The round cannot establish an exact
    835, logarithmic, or Toffoli coefficient without a complete proof; practical
    speedup; an ECDLP algorithmic advance; a P1553 or B71 result; novelty;
    supported status; breakthrough status; or any scientific transition.
  joints:
    - joint: J1-coherent-semantic-action-and-integration
      assigned_to: TASK-20260824-7a6b70
      role: reviewer
      attack_plan: >-
        Inspect the emitted reversible operation list rather than type signatures
        or backend labels; trace coherent address, sign, zero-digit, effective
        enable, coordinate, mask, exceptional arithmetic, inverse unload, and
        cleanup behavior for every basis block; check O, A, -A, and -2A branches;
        compare the sparse-amplitude action to the frozen circuit specification;
        confirm that the concrete patch integrates against exact upstream commit
        b5e4c664de212bdb0981d93d70964a1dca1a0ec9; and apply the same semantic
        acceptance method to all six known-false backends.
      expected_break: >-
        The qROM coordinate or exceptional-mask target remains live, an
        exceptional predicate is cleaned before use, or a classical address
        selection is presented as coherent compilation.
    - joint: J2-artifact-reproduction-cleanup-and-accounting
      assigned_to: TASK-20260824-4105e3
      role: validator
      attack_plan: >-
        Verify the content-first snapshot binding and every source, tree, patch,
        command, stdout, stderr, result, provenance, and receipt hash; reproduce
        the single deterministic implementation/control run at most once while
        keeping the scientific-experiment count at zero; independently recompute
        register liveness, final cleanup, added X/CX/MCX counts, positive and
        negative control arities, qROM load/unload/total accesses, arithmetic
        primitive invocations, and peak clean and dirty ancilla counts.
      expected_break: >-
        The inverse qROM pass, negative-control X sandwich, exceptional-mask
        lifetime, or decomposed-equivalent gate cost is absent from the recorded
        accounting or cannot be reproduced from the archived operation list.
    - joint: J3-proves-too-much-scope-and-end-to-end-cost
      assigned_to: TASK-20260824-01b12b
      role: red-team
      attack_plan: >-
        Attempt to make the acceptance argument approve each known-false backend;
        test whether a no-op, classical address loop, missing unload, pre-use flag
        cleanup, zero-digit omission, or partial exceptional arithmetic can mimic
        the recorded checks; account for all forward, inverse, exception,
        negative-control, and decomposition passes; challenge every transfer from
        the fixed frozen IR to a leading-cost coefficient, practical performance,
        P1553, B71, novelty, support, breakthrough, or ECDLP-advance claim; and name
        the cheapest additional falsification control if the bounded claim survives.
      expected_break: >-
        The interpretation omits the inverse qROM and exceptional-control passes
        from its end-to-end cost or transfers a fixed-IR correction beyond the
        declared conditional claim ceiling.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - no-op Protocol or interface whose emitted reversible operation list is empty
      - run-time classical address loop or branch substituted for coherent address controls
      - qROM backend that loads coordinates or masks but omits the inverse unload
      - backend that cleans an exceptional pre-map flag before its arithmetic use
      - backend that omits the zero-digit negative control from effective enable
      - partial arithmetic backend missing at least one O, A, -A, or -2A exceptional branch
    failure_signature: >-
      The acceptance method must reject each known-false object for its declared
      structural reason; accepting any one invalidates the method regardless of
      whether it accepts the producer implementation.
  blind_rederivation:
    required: true
    quantity: >-
      Independently derive the abstract block-diagonal unitary over unchanged
      address, sign, enable, and zero-digit labels; the load-use-unload cleanup and
      exact liveness obligations for qROM coordinates, exceptional masks,
      arithmetic workspace, and effective enable; and the symbolic correction-layer
      X, CX, MCX, qROM load/unload, and ancilla count relations, without consulting
      producer-specific artifacts or sibling reports.
    assigned_to: TASK-20260824-caf255
    blind_from:
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-COHERENT-QROM-PREADMISSION-20260824-aca034/tasks/TASK-20260824-aca034
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-COHERENT-QROM-PREADMISSION-20260824-aca034/archives/TASK-20260824-74edc9/snapshot-receipt.json
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-COHERENT-QROM-PREADMISSION-20260824-aca034/review-plan.yaml
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-COHERENT-QROM-PREADMISSION-20260824-aca034/dispatch_queue.json
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-COHERENT-QROM-PREADMISSION-20260824-aca034/tasks/TASK-20260824-7a6b70
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-COHERENT-QROM-PREADMISSION-20260824-aca034/tasks/TASK-20260824-4105e3
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-COHERENT-QROM-PREADMISSION-20260824-aca034/tasks/TASK-20260824-01b12b
  procedure_deviations: []
  claim_ceiling: >-
    At most a validated exact fixed-base signed-window correction within the
    frozen circuit IR, with leading 3n+O(log n) only conditionally on pinned
    upstream arithmetic primitive bounds. Exact 835/log/Toffoli coefficients
