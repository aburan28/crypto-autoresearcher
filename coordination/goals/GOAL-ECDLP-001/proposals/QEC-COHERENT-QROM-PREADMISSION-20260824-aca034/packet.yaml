circuit_contract:
  circuit_ir:
    requirement: actual reversible operation list
    forbidden_substitutes:
      - typing.Protocol-only backend
      - interface-only facade
      - no-op implementation
      - classical branch or loop over a run-time quantum address
    allowed_gate_set:
      - X
      - CX
      - MCX
    decomposition_rule: >-
      An explicitly materialized equivalent decomposition is allowed only when
      every elementary gate, control polarity, target, ancilla, and cleanup
      obligation remains represented and countable in the IR.
  registers:
    address:
      width: "w-1"
      basis_order: little-endian
      coherent: true
    sign:
      width: 1
      coherent: true
    zero_digit:
      width: 1
      semantics: "1 iff the recoded digit is zero"
    effective_enable:
      width: 1
      semantics: "external enable AND NOT zero_digit"
      negative_control_required: true
    point_accumulator:
      encoding: >-
        Frozen upstream point encoding extended with the explicit off-curve O
        representation; no implicit Python None or host-language sentinel.
      exceptional_points:
        - O
        - A
        - -A
        - -2A
    qrom_coordinates:
      semantics: reversible load targets for the selected signed table point
      initial_state: all-zero
      final_state: all-zero
    qrom_masks:
      semantics: reversible exceptional-case mask targets
      initial_state: all-zero
      final_state: all-zero
      required_masks:
        - O
        - A
        - -A
        - -2A
  table_layout:
    address_domain: "0 <= address < 2^(w-1)"
    signed_entries: >-
      Each address row stores coordinate bits and masks for +A and -A selection
      under the coherent sign bit, including explicit rows/masks for O, A, -A,
      and -2A exceptional arithmetic cases.
    sign_selection: gate-level coherent controls only
    host_address_enumeration: >-
      Host-side enumeration may compile a fixed truth table into MCX terms;
      generated operations must still act block-diagonally on a superposed
      address/sign register. No address measurement or run-time classical loop
      is permitted.
  operation_order:
    - derive_effective_enable_with_negative_zero_digit_control
    - qrom_load_coordinates_and_masks
    - apply_exception_aware_controlled_point_addition
    - qrom_unload_masks_and_coordinates_by_exact_inverse
    - uncompute_effective_enable
    - assert_all_work_and_qrom_targets_clean
  negative_controls:
    representation: explicit in IR or explicit X-sandwich decomposition
    cleanup: every X-sandwich must be closed before return
  cleanup_assertions:
    required:
      - qrom coordinate targets return to zero
      - qrom mask targets return to zero
      - effective-enable work bit returns to zero
      - arithmetic work registers return to zero
      - address register is unchanged
      - sign register is unchanged
      - zero-digit register is unchanged
      - external enable is unchanged
    assertion_phase: after unload and all uncomputation
  sparse_amplitude_simulator:
    required: true
    representation: sparse map from computational basis states to exact amplitudes
    amplitude_domain: exact integers/rationals or symbolic exact values
    required_superpositions:
      - at least two address values with both sign values
      - enabled and disabled branches
      - zero-digit and nonzero-digit branches
      - branches exercising O, A, -A, and -2A masks
    proof_obligation: >-
      Simulated action is block-diagonal in unchanged address/sign/enable/zero
      labels, equals the corresponding signed table addition on every enabled
      nonzero branch, is identity on disabled or zero-digit branches, and leaves
      every declared work/qROM target clean with no cross-branch leakage.

known_false_backends:
  - id: KF-NOOP-PROTOCOL
    description: Protocol or interface object whose emitted operation list is empty
    expected_detection:
      - semantic reviewer rejects implementation status
      - sparse simulator detects identity on enabled nonzero branches
  - id: KF-CLASSICAL-ADDRESS-LOOP
    description: run-time classical branching or looping on the address value
    expected_detection:
      - IR inspection finds no coherent address controls
      - address/sign superposition control fails
  - id: KF-MISSING-UNLOAD
    description: loaded qROM coordinates or masks remain live after arithmetic
    expected_detection:
      - cleanup assertion fails
      - sparse state retains entanglement with qROM targets
  - id: KF-PREMAP-FLAG-CLEANUP
    description: exceptional flags are uncomputed before the arithmetic use site
    expected_detection:
      - liveness interval check fails
      - exceptional-point control fails
  - id: KF-ZERO-DIGIT-OMISSION
    description: zero digit does not negatively control effective enable
    expected_detection:
      - zero-digit branch changes accumulator
      - negative-control audit fails
  - id: KF-PARTIAL-ARITHMETIC
    description: ordinary additions work but one or more O/A/-A/-2A cases are absent
    expected_detection:
      - exceptional control matrix fails
      - known-false sparse branches mismatch

