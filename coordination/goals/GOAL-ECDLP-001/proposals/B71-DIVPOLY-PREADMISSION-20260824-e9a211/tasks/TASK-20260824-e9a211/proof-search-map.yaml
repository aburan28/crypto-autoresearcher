scope_statement: >-
  This map explains why the positive proof architecture is not yet complete in
  the exact relayed source scope. It is not a proof that the structured
  recurrence lane lacks a mechanism and it makes no transfer beyond the
  explicitly bounded representation results.
bottleneck: >-
  Construct, from ordinary public ECDLP inputs and a compact target-independent
  description of H and a, a finite gauge-invariant recurrence DAG for the
  signed coset kernel product or a lossless jet-sensitive equivalent; then
  derive a correctly oriented scalar and a complete expected per-success
  all-axis cost strictly below rho without hidden linear-width advice.
baseline_embedding:
  parameter_slice: >-
    Prime-order public subgroup <P> of order ell, one independently sampled
    public target Q=[k]P, compact public H and a, preprocessing frozen before Q,
    and no supplied roots, coefficients, target table, or evaluator oracle.
  reproduction_check:
    realized_baseline: "Pollard rho uses ell^(1/2+o(1)) group operations and O(1) distinguished state without an ell-scale table."
    signed_orbit_membership_hit: "2D/(s ell)"
    identity_hit: "1/ell"
    total_termination: "(1+2D/s)/ell"
    expected_attempts: "ell/(1+2D/s)"
    conditional_evaluator_balance: "For a complete D^beta evaluator, D=ell^(2/(3-2 beta)) gives time exponent 1/(3-2 beta), strictly below 1/2 only for beta<1/2."
    exact_internal_boundaries:
      - "B65 formal ST-EVR table: Theta(B^3)=Theta(N^(3/5)) in its exact independent-table model."
      - "B66 dense declared recurrence: Theta(B^5)=Theta(N) retained state, exceeding the N^(9/20) state cap."
      - "B67 explicit occurrence evaluator: Theta(B^5 log p) target work and Theta(B^5) traffic."
      - "B68 generic repaired scalar pullback: Omega(D) scalar-circuit size only in the typed generic-C model; special and richer models remain open."
      - "B69 explicit roots, dense coefficients, leaf products, and per-coset tables: Omega(D/s) represented width."
      - "B70 dense quotient Theta(ell), explicit leaf Theta(D/s), and exact generic-cycle D/s-query families; no implicit evaluator."
    result: "The rho baseline and exact prior boundaries are reproduced; no new candidate row exists."
observation_collision:
  observable: >-
    A future candidate's complete target-local output, including all jets,
    branch labels, and recovery data claimed sufficient to return w with
    [w]P=Q.
  distinct_preimage_search:
    required_pairs:
      - "Q1 and Q2 with distinct correctly oriented scalars but equal candidate observable"
      - "Q and -Q under an x-only or signed-orbit observable"
      - "member and nonmember targets"
      - "identity and nonidentity targets"
      - "regular and denominator-zero branches"
    frozen_collision: "Boolean signed-orbit support does not distinguish orientation; B70's m^(-j) leaf versus m^j return is the explicit orientation alias."
    null_objects:
      - "random cyclic permutation with matched orbit shape"
      - "same-shape random recurrence with matched arity, dimensions, and access pattern"
      - "explicit table with advice, labels, and traffic fully exposed"
    falsification_condition: >-
      A cross-witness collision without a public, costed disambiguation path,
      or a signal of comparable strength on a same-shape null, falsifies the
      proposed observable for admission.
    current_result: "No candidate observable was supplied, so the collision audit cannot pass; the frozen orientation collision remains load-bearing."
gauge_invariance_audit:
  semantic_target: "K_(a,H,P)(T)=product_[h] (T-x([a h]P)) is independent of recurrence-state normalization."
  required_candidate_data:
    - "Exact gauge action on every initial value and recurrence node."
    - "Base cases and characteristic assumptions."
    - "Branchwise cancellation equations for outputs, comparisons, jets, and witness labels."
    - "Typed denominator set, identity handling, zero-denominator behavior, and exceptional branches."
  current_result: "No recurrence-state gauge action or finite DAG exists in the relayed packet; semantic output invariance alone does not discharge the audit."
quantifier_order:
  formal_order: >-
    There exists one fixed uniform public Pre, Eval, Recover, Verify and one
    declared vector of axis bounds epsilon_axis such that, for every
    sufficiently large prime ell, for every admissible public curve family and
    generator P, S=Pre(public parameters,P,H,a) is constructed independently
    of the later target Q; then for every independently sampled Q in <P>, over
    only the declared randomness, Eval and Recover return a correctly oriented
    w with [w]P=Q at the stated probability, Verify accepts it publicly, and
    every charged expected per-success axis including amortized setup is
    strictly o(ell^(1/2)), with no hidden Theta(|H|), Theta(D/s), Theta(ell),
    or target-specific advice.
  forbidden_reorderings:
    - "Choosing preprocessing after seeing Q."
    - "Choosing a representation, orbit, gauge, or recurrence after learning the successful witness."
    - "Conditioning on a good orbit or denominator branch after the fact."
    - "Amortizing over an undeclared or unbounded target corpus."
    - "Supplying roots, coefficients, factors, or labels as if they were public inputs."
  current_result: "The quantifier order is explicit, but no candidate functions or bounds witness its existential prefix."
