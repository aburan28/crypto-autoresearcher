falsification_conditions:
  positive_gate: >-
    A future candidate is positively admissible only if all displayed-algebra,
    public-construction, gauge, oriented-descent, collision, control, success,
    and all-axis obligations pass simultaneously.
  negative_gate: >-
    Failure of any mandatory conjunction component produces only a scoped
    no-admission for the candidate and representation tested, never broad
    closure.
  inconclusive_gate: >-
    Missing equations, untyped branches, unknown traffic, undeclared target
    count, or a model-specific lower bound leaves the corresponding structured
    route open and unverified.
  current_gate: "The missing finite evaluator, gauge proof, oriented descent, and all-axis vector trigger scoped_no_admission."
