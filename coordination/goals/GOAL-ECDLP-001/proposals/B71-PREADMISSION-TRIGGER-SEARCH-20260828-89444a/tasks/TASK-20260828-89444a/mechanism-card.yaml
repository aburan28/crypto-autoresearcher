trigger_shapes:
  shape_a_remainder_transducer: >-
    A typed public P1553 target-local remainder transducer for r_R mod g_I: an
    exact computation, from E, P, and Q alone, of the remainder of the
    complete-chart intersection resultant r_R upon division by the squarefree
    label polynomial g_I, with no roots, factors, witnesses, support tables, or
    source enumeration, inside the B^(5/4) interface budget.
  shape_b_dyadic_unit_product: >-
    The exact dyadic subinterval unit-product interface: a public construction
    over the frozen mixed-radix deck/interval geometry (per-sign-vector
    intervals [A_sigma, A_sigma + m^3 - 1] with exact base-m labelled
    unranking) that supplies the unit-product step the two-restriction and
    three-deck corrections leave as the surviving coordinate-aware interface.

candidates_considered:
  - id: C1_SUBRESULTANT_PRS_RECURRENCE
    name: >-
      Subresultant / recursive polynomial remainder sequence recurrences
      (Habicht relations; Terui recursive PRS; Wang-Yang and Hong-Meng-Yang
      multi-polynomial and general-basis subresultants).
    provenance: retrieved
    source_refs:
      - arXiv:0806.0488 (Terui, Recursive PRS and Nested Subresultants)
      - arXiv:0806.0495 (Terui, Recursive PRS and its Subresultants)
      - arXiv:2409.12727 (Hong-Meng-Yang, Generalization of Habicht's Theorem)
      - arXiv:2112.15370 (Hong-Yang, Subresultant of several univariate polynomials)
      - arXiv:2304.00262 (Wang-Yang, Two Variants of Bezout Subresultants)
    gate_discharge:
      G1_ACTUAL_TRIGGER_OBJECT: present
      G1_note: >-
        These are actual, named recurrences (Habicht-type relations among
        subresultants; recursive PRS recurrences). G1 is satisfied in the
        abstract.
      G2_FROZEN_SETTING_AND_PUBLIC_CONSTRUCTION: absent
      G2_note: >-
        The recurrence is for an arbitrary pair (or set) of univariate
        polynomials over a coefficient domain. It does not freeze the P1553
        rings, bases, CRT components, or interval geometry; it does not supply
        the public g_I and r_R construction; and it does not give an exact
        computation of r_R mod g_I from E, P, Q without roots, factors,
        witnesses, support tables, or source enumeration. Computing r_R (the
        complete-chart intersection resultant) from E, P, Q is precisely the
        missing public constructor the recurrence presupposes as already given.
      G3_FULL_COST_ENUMERATION: absent
      G3_note: >-
        No enumeration of state, update maps, degrees, ranks, nonzeros,
        coefficient growth, live storage, traffic, build/query split, or
        amortization is provided for the frozen P1553 setting, and no bound
        within the B^(5/4) interface budget or strict o(ell^(1/2)) end-to-end
        is established.
      G4_LINEAGE_AND_MULTIPLICITY: absent
      G5_Q_VS_MINUS_Q: absent
      G5_note: >-
        Subresultants are functions of the polynomial pair, not of point
        orientation; they do not distinguish Q from -Q.
      G6_KNOWN_COEFFICIENTS_INVERTIBLE_Q: absent
      G7_OUTPUT_SENSITIVE_SOURCE_UNRANKING: absent
      G8_NOT_ALREADY_COSTED_ROUTE: absent
      G8_note: >-
        The subresultant/PRS route is itself an already-costed resultant and
        quotient route, which G8 explicitly excludes.
    screened_family_overlap: >-
        This is the SUBRES-COFACTOR screened family
        (B71-SUBRES-COFACTOR-PREADMISSION-20260824-2ee18e). Re-running its
        frozen screen is prohibited; a revisit requires a new trigger specific
        to that family satisfying the post-screen revisit condition (a concrete
        typed public P1553 remainder or dyadic unit-product transducer), which
        this general recurrence does not supply.
    verdict: not_intake_ready
    absent_items: [G2, G3, G4, G5, G6, G7, G8]

  - id: C2_MODULAR_COMPOSITION_CIRCUIT
    name: >-
      Modular composition and polynomial GCD in the border of small, shallow
      circuits (Andrews-Kumar-Rai, arXiv:2511.05035, 2026).
    provenance: retrieved
    source_refs:
      - arXiv:2511.05035 (Andrews-Kumar-Rai, Modular composition & polynomial GCD in the border of small, shallow circuits)
    gate_discharge:
      G1_ACTUAL_TRIGGER_OBJECT: present
      G1_note: >-
        This is an actual circuit-complexity theorem: modular composition
        f(g(x)) mod h(x) and univariate GCD lie in the border of algebraic
        circuits with division gates of nearly-linear size and polylogarithmic
        depth, over any infinite field, with the circuit family constructible
        in near-linear time.
      G2_FROZEN_SETTING_AND_PUBLIC_CONSTRUCTION: absent
      G2_note: >-
        The theorem is about modular composition for arbitrary univariate
        polynomials over an infinite field. It does not freeze the P1553 rings,
        bases, CRT components, or interval geometry; it does not supply the
        public g_I and r_R construction; and it does not give an exact
        computation of r_R mod g_I from E, P, Q. The P1553 setting is over a
        prime/finite field, not an infinite field.
      G3_FULL_COST_ENUMERATION: absent
      G3_note: >-
        It is a border-complexity (non-uniform, limit) statement, not a uniform
        typed public construction with the required state/update-map/degree/
        rank/nonzero/coefficient-growth/live-storage/traffic/build-query/
        amortization enumeration within the B^(5/4) budget and strict
        o(ell^(1/2)) end-to-end. The paper also carries a referee-noted gap in
        the proofs of Theorems 6.2 and 6.4.
      G4_LINEAGE_AND_MULTIPLICITY: absent
      G5_Q_VS_MINUS_Q: absent
      G6_KNOWN_COEFFICIENTS_INVERTIBLE_Q: absent
      G7_OUTPUT_SENSITIVE_SOURCE_UNRANKING: absent
      G8_NOT_ALREADY_COSTED_ROUTE: absent
      G8_note: >-
        Modular composition is the full power-projection / quotient route that
        G8 explicitly excludes.
    screened_family_overlap: none (new circuit-complexity object, but not a P1553 trigger)
    verdict: not_intake_ready
    absent_items: [G2, G3, G4, G5, G6, G7, G8]

