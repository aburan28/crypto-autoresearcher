controls_before_belief:
  screen_is_its_own_control: >-
    For every candidate that superficially carried G1 (an actual recurrence or
    circuit identity), the screen re-checked (i) that the computation is
    genuinely public (no ECDLP-equivalent information hidden behind
    transducer/recurrence/identity language) and (ii) the quantifier order
    (all objects fixed before any witness observed), and ran the already-
    costed-route exclusion as a named check.
  public_computation_check: >-
    Every candidate's G1 object is a general polynomial/combinatorial result
    whose inputs (the two polynomials, the deck encodings, the combinatorial
    family) are not the frozen public E, P, Q. Instantiating any of them to the
    P1553 setting requires the public g_I and r_R constructor, which is exactly
    the missing object; no candidate hides the witness or the resultant behind
    the recurrence/identity language, because none of them reaches r_R mod g_I
    from E, P, Q at all.
  quantifier_order_check: >-
    In every candidate the general object (polynomial pair, circuit family,
    combinatorial family) is fixed independently of the ECDLP witness; but none
    fixes the P1553 rings, bases, CRT components, interval geometry, or public
    g_I and r_R construction before any witness is observed, because it never
    types them. The constructor-before-witness quantifier is therefore not
    discharged for the frozen setting.
  already_costed_route_exclusion: >-
    Named check run per candidate: C1 is a resultant/quotient route; C2 and C3
    are quotient/full power-projection routes; C4 is a resultant/quotient
    route; C6 is a represented-table/power-projection-adjacent route. Each is
    excluded by G8. C5 is not a P1553 route at all. No candidate survives the
    exclusion.

