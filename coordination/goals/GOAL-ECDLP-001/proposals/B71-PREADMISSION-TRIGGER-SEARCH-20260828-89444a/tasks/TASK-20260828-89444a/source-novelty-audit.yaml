source_entries:
  # --- Retrieved (fetched and read at abstract level via the arXiv API) ---
  - key: subresultant_prs_recurrences
    citation: >-
      Terui (arXiv:0806.0478, 0806.0488, 0806.0495); Hong-Meng-Yang
      (arXiv:2409.12727, generalization of Habicht's theorem); Hong-Yang
      (arXiv:2112.15370); Wang-Yang (arXiv:2304.00262, 2212.03422); Yang-Yang
      (arXiv:2305.03906); Glotov (arXiv:math/0609831); Perrucci-Roy
      (arXiv:1812.02470).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find an actual recurrence that could serve as a typed public P1553
      target-local remainder transducer for r_R mod g_I.
    supplied: >-
      Actual Habicht-type and recursive-PRS recurrences for subresultants of
      arbitrary univariate polynomial pairs/sets. None freezes the P1553
      setting, supplies the public g_I and r_R construction, or computes r_R
      mod g_I from E, P, Q; all are already-costed resultant/quotient routes.
    supports: []
    limitations: >-
      Read at abstract level. General polynomial theory; no P1553 typing, no
      B^(5/4)/o(ell^(1/2)) cost enumeration, sign-insensitive.
  - key: modular_composition_circuit
    citation: Andrews-Kumar-Rai, arXiv:2511.05035 (2026), Modular composition & polynomial GCD in the border of small, shallow circuits.
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find an actual circuit identity that could serve as a typed public
      P1553 remainder transducer.
    supplied: >-
      A circuit-complexity theorem: modular composition f(g(x)) mod h(x) and
      univariate GCD lie in the border of algebraic circuits with division
      gates of nearly-linear size and polylog depth over any infinite field,
      with the circuit family constructible in near-linear time.
    supports: []
    limitations: >-
      Read at abstract level. Border (non-uniform) complexity over infinite
      fields, not a uniform typed public construction; the P1553 setting is
      over a prime/finite field; the paper carries a referee-noted gap in the
      proofs of Theorems 6.2 and 6.4; modular composition is an already-costed
      quotient/full power-projection route.
  - key: fast_remainder_kedlaya_umans
    citation: >-
      Poteaux-Schost (arXiv:1109.4323); Guo-Narayanan-Umans (arXiv:1606.04592);
      Hubrechts (arXiv:0906.5510, via Kedlaya-Umans).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a retrieved fast-remainder theorem that could serve as a typed
      public P1553 remainder transducer.
    supplied: >-
      Near-linear modular composition / fast GCD over finite fields and the
      exponent-3/2 equivalence web. General fast-arithmetic theorems for
      arbitrary polynomial pairs.
    supports: []
    limitations: >-
      Read at abstract level. No P1553 typing, no public g_I and r_R
      construction, no B^(5/4)/o(ell^(1/2)) enumeration; already-costed
      quotient/power-projection routes.
  - key: semaev_weil_descent
    citation: >-
      Kousidis-Wiemers (arXiv:1906.05594); Kosters-Yeo (arXiv:1503.08001);
      Karabina (arXiv:1504.02347); Semaev (arXiv:1504.01175); Gorla-Massierer
      (arXiv:1403.0126); Huang-Kosters-Yang-Yeo (arXiv:1505.02532); Di
      Tullio-Pal (arXiv:1909.08901).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find an actual recurrence or theorem in the ECDLP index-calculus
      literature that could serve as a typed public P1553 remainder transducer
      or dyadic unit-product interface.
    supplied: >-
      Summation-polynomial recurrences, fall-degree bounds, NP-completeness of
      zero-testing, point-decomposition and trace-zero compression results for
      the ECDLP in general.
    supports: []
    limitations: >-
      Read at abstract level. Concerns the summation-polynomial / Weil-descent
      systems, not the frozen P1553 r_R mod g_I or dyadic unit-product
      interface; x-coordinate relations are sign-symmetric; already-costed
      resultant/quotient routes.
  - key: combinatorial_unranking
    citation: >-
      Gabric-Imam-Jones-Sawada (arXiv:2603.11934); Tarau (arXiv:0808.0554,
      0808.0754, 0808.0760, 0808.2953, 1507.06944); Shablya-Kruchinin
      (arXiv:2301.11890); Satake (arXiv:1902.10204); Palacios et al
      (arXiv:2108.04849); Mueller et al (arXiv:1607.04552).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a retrieved unranking theorem that could serve as the exact
      dyadic subinterval unit-product interface.
    supplied: >-
      General combinatorial ranking/unranking and universal-cycle decoding
      algorithms for de Bruijn sequences, BDDs, RNA structures, hereditarily
