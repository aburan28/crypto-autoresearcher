provenance_policy: >-
  Every entry is labeled recalled, retrieved, kb, or internal. Retrieved means
  the source was fetched and read in this task (here, at abstract level via the
  arXiv export API). Recalled means no source was opened and the entry cannot
  support a coordinator decision, a known/adaptation novelty status, or a
  mathematical conclusion. No trigger-carrying statement in this task rests on
  a recalled source; every trigger-carrying statement rests on a retrieved or
  internal-corpus object.

