internal_overlap_audit:
  b66_batch_cb2660:
    boundary: >-
      Exact reduced occurrence-algebra projector identity, but the displayed
      construction materializes D = Theta(B^5), lacks mu_R and lossless
      recompression, lacks a faithful source inverse, and ordinary trace loses
      jets.
    overlap_with_this_search: >-
      None of the retrieved candidates is the B66 reduced projector or its
      dense d_R-prefix ordinary-trace representation. No candidate re-runs the
      B66 screen.
  b67_batch_f612f1:
    boundary: >-
      Conditional square-free occurrence-coordinate Semaev projector with
      injective base-B code moments, q<=64 sparse recovery, and a topology-
      derived support-only contraction certificate; lacks an evaluator
      schedule, traffic certificate, typed Semaev interface, and oriented
      replay; explicit work and traffic remain Theta(B^5) up to logarithms.
    overlap_with_this_search: >-
      Candidate C4 (Semaev/Weil descent) is the general literature behind the
      B67 Semaev projector but is not the B67 typed Semaev interface and does
      not re-run the B67 screen.
  b70_batch_4e7dcf:
    boundary: >-
      Finite-quotient mixed-radix cyclic trace orbit projector evaluator with
      a split-root Boolean identity; orientation failure (leaf j identifies
      m^(-j) while the packet returns m^j); dense quotient Theta(ell), leaf-
      explicit Theta(D/s), exact generic-cycle D/s queries; strict online
      improvement over rho only for beta < 1/2.
    overlap_with_this_search: >-
      The frozen elliptic setting read for this search is the B70 mixed-radix
      interface (the two P1553 correction packets extend the B70 decks). No
      retrieved candidate is the B70 evaluator or re-runs the B70 screen; the
