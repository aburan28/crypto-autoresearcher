packet:
  schema: crypto.autoresearch.proof_correction_packet.v1
  id: P1553-MIXED-RADIX-TWO-RESTRICTION-CORRECTION-20260827-0fbb54
  goal_id: GOAL-ECDLP-001
  batch_id: null
  recorded_at: "2026-08-27T01:16:46Z"
  opened_by: coordinator
  classification: non_batch_proof_correction
  control_plane_parent_commit: 15c6cbce3cac5527421779ad295e1c1b9d680352
  objective: >-
    Independently prove or falsify whether the reviewed special-deck mixed-radix
    reduction needs subset stability in only F_0 and F_1: after two exact
    restrictions, the three remaining signed decks form at most eight explicit
    length-m^3 intervals that may be solved by one target-independent serialized
    baby-step table and exact giant-step scans inside the inherited MPZ rectangle.
  predecessor:
    evidence: EV-ECDLP-68dd1c
    decision: DEC-20260825-fd969e
    source_joint: J3-scope-proves-too-much-and-two-restriction-boundary
    immutable_history: true
    issue: >-
      The accepted three-restriction correction deliberately stopped when F_2
      restriction was removed. Its independent J3 review observed that the
      residual signed three-deck coefficient set is not an arbitrary 3SUM set:
      each fixed sign vector is a contiguous interval of exactly m^3 integers.
  proposed_theorem:
    group: prime_order_dense_generic_group_G_equal_angle_P_angle_of_order_N
    scale: B_equals_N_to_the_one_fifth
    radix: m_equals_2_to_the_ceiling_log2_B
    offset: C_equals_sum_i_0_to_4_m_to_i
    decks: >-
      For i=0,...,4, F_i contains occurrence-labelled signed elements
      (i,d,sigma,[sigma(d+1)m^i]P), 0<=d<m and sigma in {+1,-1}.
    target: R_equals_Q_plus_bracket_C_bracket_P
    restricted_interface: >-
      One target-independent exact universal generic object supports every
      canonical dyadic restriction of only F_0 and F_1; F_2,F_3,F_4 remain
      full, public, occurrence-labelled, and reconstructible.
    residual_identity: >-
      After isolating e_0,e_1, write H=R-e_0-e_1 and P'=[m^2]P. For a fixed
      sign vector sigma=(sigma_2,sigma_3,sigma_4), the remaining scalar is
      t=sigma_2*a+m*sigma_3*b+m^2*sigma_4*c with a,b,c in [1,m]. Choosing
      A_sigma by replacing a signed-positive digit with 1 and a signed-negative
      digit with -m gives t=A_sigma+r_0+m*r_1+m^2*r_2, uniquely for
      r_0,r_1,r_2 in [0,m-1]. Thus each sign vector gives exactly the integer
      interval [A_sigma,A_sigma+m^3-1] with exact base-m labelled unranking.
    interval_solver: >-
      Preprocessing, before Q, serializes a dictionary of [j]P' for
      0<=j<S with S=ceil(m^(7/4)), retaining j. Online, for each of eight sign
      vectors, normalize H_sigma=H-[A_sigma]P' and test
      H_sigma-[iS]P' against the dictionary for 0<=i<ceil(m^3/S). A hit gives
      r=iS+j<m^3, hence one exact labelled (e_2,e_3,e_4); decode x_hat and
      finally verify [x_hat]P=Q.
    proposed_conclusion: >-
      Conditional on the exact MPZ model and every frozen premise, no exact
      universal arbitrary-deck generic solver with subset stability in only
      F_0,F_1 can simultaneously use at most B^(9/4+o(1)) serialized crossing
      advice and B^(5/4+o(1)) aggregate main interactions with nonvanishing
      complete-transcript success.
  resource_accounting:
    predicate_advice_bits: ell_pred_equals_B_to_9_over_4_plus_o_1
    added_baby_table_entries: S_equals_B_to_7_over_4_plus_o_1
    added_baby_table_bits: B_to_7_over_4_plus_o_1
    restriction_calls: 2_times_log2_2m
    sign_intervals: at_most_8
    giant_steps_per_interval: ceiling_m_cubed_over_S_equals_B_to_5_over_4_plus_o_1
    added_main_interactions: B_to_5_over_4_plus_o_1
    total_advice_bits: ell_equals_B_to_9_over_4_plus_o_1
    total_main_interactions: k_equals_B_to_5_over_4_plus_o_1
    mpz_success: B_to_minus_1_over_4_plus_o_1_equals_N_to_minus_1_over_20_plus_o_1
  mandatory_assumptions:
    - universal arbitrary public signed occurrence-labelled decks
    - exact canonical subset stability in the same two named decks
    - complete transcript success rather than marginal per-query success
    - target-independent preprocessing and a fresh target Q
    - every stored generic representation and coefficient serialized into advice bits
    - every predicate, giant-step, lookup, replay, decode, and verification interaction charged to one aggregate k
    - exact generic encodings with no coordinate leakage or unbounded words
    - no opaque cross-phase handles, target-conditioned advice, extra oracle, or witness-conditioned preprocessing
  controls:
    - independently enumerate all eight sign intervals and verify exact length m^3 and unique base-m unranking
    - test negative endpoints, modular wraparound, overlapping sign intervals, identity, duplicate encodings, and final verification
    - replace the serialized baby table by opaque handles and require MPZ applicability to stop
    - choose the baby table after Q and require the target-independent reduction to stop
    - count baby-table construction in the main phase and require the claimed k bound to fail
    - remove F_1 restriction and require the proof to stop at a four-deck residual; do not replace N by m^4 in a full-group ST^2/N theorem
    - replace universal decks by random-deck-only or P1553 coordinate decks and require nonapplicability
    - replace complete-transcript success by independent marginal answers and require the proof to stop
    - run the argument on a known-false coordinate-aware target-local remainder oracle and require the first absent premise to be named
  one_restriction_boundary: >-
    The constructive full-group preprocessing attack has success proportional
    to S*T^2/N. With S=B^(9/4), constant success over the full order-N group
    requires T=B^(11/8), above B^(5/4). Its theorem does not license replacing
    N by the m^4 residual interval. Direct interval BSGS with the same S costs
    B^(7/4). Therefore the one-restriction route is open and unverified, not a
    consequence or negative result of this packet.
