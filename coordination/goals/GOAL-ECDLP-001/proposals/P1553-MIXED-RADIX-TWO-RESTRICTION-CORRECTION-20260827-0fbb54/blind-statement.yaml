blind_statement:
  schema: crypto.autoresearch.blind_statement.v1
  id: BLIND-P1553-TWO-RESTRICTION-0fbb54
  task_id: TASK-20260827-f27514
  statement: >-
    Let N be prime, B=N^(1/5), m=2^ceil(log2 B), C=sum_{i=0}^4 m^i,
    G=<P> have order N, Q=[x]P, and R=Q+[C]P. Deck F_i contains independently
    labelled (i,d,sigma,[sigma(d+1)m^i]P), 0<=d<m, sigma in {+1,-1}.
    Assume an exact target-independent universal generic predicate supports all
    canonical dyadic restrictions of only F_0,F_1 with complete-transcript
    success, serialized crossing advice ell<=B^(9/4+o(1)), and aggregate main
    interactions k<=B^(5/4+o(1)). After exact isolation of e_0,e_1, derive or
    refute a target-independent interval-table extractor for F_2,F_3,F_4,
    including exact signed interval endpoints, bijective unranking, advice and
    online exponents, replay, decoder, verification, and the MPZ success bound.
    State explicitly whether any one-restriction conclusion follows.
  frozen_parameters:
    baby_table_size: S_equals_ceiling_m_to_7_over_4
    residual_interval_length: m_cubed
    sign_vectors: 8
    full_group_order: N_equals_B_to_5
  required_controls:
    - all eight sign vectors and exact unranking
    - negative endpoints, wraparound, overlap, identity, and duplicate encodings
    - target-conditioned and opaque-handle tables
    - a noncontiguous weighted-digit mutant
    - removal of F_1 restriction
    - full-group ST2_over_N versus unproved interval substitution
  scientific_inputs:
    - coordination/goals/GOAL-ECDLP-001/proposals/P1553-MIXED-RADIX-TWO-RESTRICTION-CORRECTION-20260827-0fbb54/blind-statement.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/P1553-MIXED-RADIX-TWO-RESTRICTION-CORRECTION-20260827-0fbb54/handoffs/TASK-20260827-f27514.yaml
  forbidden:
    - packet, review plan, queue, producer, snapshot, sibling reports, sibling messages, and predecessor interpretations
  verdict_scope: statement_only_no_joint_no_whole_claim
  claim_ceiling: >-
    Agreement or disagreement on the stated algebra and accounting only; no
    P1553 result, generic lower bound, one-restriction theorem, status change,
    B71, SOTA, attack, closure, or breakthrough.
