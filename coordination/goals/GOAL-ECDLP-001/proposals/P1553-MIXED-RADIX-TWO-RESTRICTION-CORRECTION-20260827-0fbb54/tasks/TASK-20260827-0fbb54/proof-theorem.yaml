proof_theorem:
  schema: crypto.autoresearch.proof_theorem.v1
  id: P1553-MIXED-RADIX-TWO-RESTRICTION-CORRECTION-20260827-0fbb54
  packet_id: P1553-MIXED-RADIX-TWO-RESTRICTION-CORRECTION-20260827-0fbb54
  task_id: TASK-20260827-0fbb54
  goal_id: GOAL-ECDLP-001
  recorded_at: 2026-08-27
  basis: coordinator_relay_of_committed_frozen_packet
  opening_commit: 3b21f7e122690428c58227ef36aa0fcb6428d344
  producer_role: idea-generator
  classification: non_batch_proof_correction
  disposition: correction_candidate_pending_independent_review
  result_count: 1
  novelty_status: unverified
  official_state_change: false
  scientific_transition: none
  claim_ceiling: >-
    Scoped two-restriction generic-interface correction candidate only. This
    record does not establish a P1553 or coordinate-deck result, a generic-ECDLP
    lower bound, a one-restriction theorem, B71, SOTA movement, an algorithm,
    an attack, a speedup, closure, completion, or a breakthrough.
  exact_claim:
    status: candidate_conditional_theorem
    statement: >-
      Let N be prime, let G=<P> have order N, let Q=[x]P, set
      B=N^(1/5), m=2^ceil(log2 B), C=sum_{i=0}^4 m^i, and R=Q+[C]P.
      For the five independently occurrence-labelled signed decks
      F_i={(i,d,sigma,[sigma(d+1)m^i]P): 0<=d<m and sigma in {+1,-1}},
      assume one target-independent exact universal generic object that,
      with a complete-transcript success guarantee, supports every canonical
      dyadic restriction of F_0 and F_1 while F_2,F_3,F_4 remain full,
      public, labelled, and reconstructible. Assume fresh Q, target-independent
      preprocessing, serialized generic encodings and coefficients, and full
      charging of all predicate, giant-step, lookup, replay, decode, and
      verification interactions. Then the frozen construction below is a
      candidate exact reduction from the two restricted deck occurrences to
      eight signed intervals of length m^3. With a pre-Q dictionary of
      [j]P' for 0<=j<S, P'=[m^2]P and S=ceil(m^(7/4)), its claimed resource
      targets are S*O(log N)=B^(7/4+o(1)) added advice bits,
      2*log2(2m) predicate calls, 8*ceil(m^3/S)=B^(5/4+o(1)) giant steps,
      aggregate ell=B^(9/4+o(1)), aggregate k=B^(5/4+o(1)), and the
      conditional MPZ success-bound target B^(-1/4+o(1))=N^(-1/20+o(1)).
      The claim is conditional on every listed interface premise and proof
      obligation; no transfer to coordinate decks or P1553 is asserted.
    quantifiers:
      order:
        - "for every prime N and every cyclic generic group G=<P> of order N"
        - "for B=N^(1/5), m=2^ceil(log2 B), and the fixed public decks F_0,...,F_4"
        - "there exists target-independent preprocessing fixed before Q"
        - "for every fresh target Q=[x]P"
        - "conditional on one exact universal generic object satisfying the full interface for every canonical dyadic restriction of F_0 and F_1"
        - "for every complete successful transcript returned under that same object"
        - "the labelled occurrences isolated from F_0 and F_1 determine H and one of eight exact residual interval searches"
      forbidden_reorderings:
        - target_before_preprocessing
        - witness_before_advice
        - separate_object_per_restriction
        - marginal_success_in_place_of_complete_transcript_success
    test_boundary: >-
      Only the abstract universal arbitrary-signed labelled-deck interface,
      restricted canonically on F_0 and F_1 and complete on F_2,F_3,F_4, is
      covered. The one-restriction, random-only, coordinate-deck, target-local,
      marginal-answer, and noncontiguous weighted-digit settings are outside
      the claimed boundary.
  parameters:
    N: "prime group order"
    B: "N^(1/5)"
    m: "2^ceil(log2 B)"
    C: "sum_{i=0}^4 m^i"
    S: "ceil(m^(7/4))"
    P_prime: "[m^2]P"
    target: "Q=[x]P"
    shifted_target: "R=Q+[C]P"
  decks:
    definition: "F_i={(i,d,sigma,[sigma(d+1)m^i]P): 0<=d<m, sigma in {+1,-1}}"
    occurrence_labels:
      required: true
      fields: [deck_index, digit_index, sign]
      independence: "Equal group encodings do not merge or erase distinct occurrence labels."
    restricted_decks: [F_0, F_1]
    full_public_labelled_reconstructible_decks: [F_2, F_3, F_4]
  predicate_contract:
    object_count: 1
    object_scope: target_independent_exact_universal_generic
    allowed_restrictions: canonical_dyadic_restrictions_of_F0_and_F1_only
    transcript_requirement: complete_successful_transcript
    label_requirement: preserve_deck_sign_and_occurrence
    representation_requirement: exact_generic_encodings
    forbidden_features:
      - coordinate_leakage
      - unbounded_words
      - opaque_cross_phase_handles
      - target_conditioned_advice
      - witness_conditioned_preprocessing
      - extra_oracle
    accounting_requirement: >-
      Every predicate call, generic-group step, dictionary lookup, transcript
      replay, decoding action, and final verification interaction is charged
      to the declared aggregate resource ledgers.
  mechanism:
    isolation: >-
      Use the same universal object across canonical dyadic restrictions to
      isolate labelled occurrences e_0 in F_0 and e_1 in F_1. Set
      H=R-e_0-e_1 and P'=[m^2]P.
    residual_signed_digits:
      sign_tuple: "tau=(s_2,s_3,s_4) in {+1,-1}^3"
      expression: "t=s_2*a + m*s_3*b + m^2*s_4*c, with a,b,c in [1,m]"
      bases:
        positive: 1
        negative: "-m"
      offset: "A_tau=sum_{j=0}^2 alpha(s_{j+2})m^j, alpha(+1)=1, alpha(-1)=-m"
      residual: "t=A_tau+r_0+m*r_1+m^2*r_2, uniquely with each r_j in [0,m-1]"
      exact_interval: "[A_tau,A_tau+m^3-1]"
    unranking:
      positive_sign: "signed digit 1+r; recover d=r"
      negative_sign: "signed digit -m+r=-(m-r); recover d=m-r-1"
      preserved_fields: [deck_index, sign, digit_index, occurrence_label]
    precomputation: >-
      Before Q is available, serialize the dictionary mapping exact generic
      encodings of [j]P' to retained coefficient j for every 0<=j<S.
    interval_search: >-
      For each of the eight sign tuples tau set H_tau=H-[A_tau]P'. For
      i=0,...,ceil(m^3/S)-1, test the exact encoding of H_tau-[iS]P'
      against the serialized dictionary. A hit retaining j yields r=iS+j;
      discard it if r>=m^3, then base-m unrank r into r_0,r_1,r_2.
    decoding: >-
      Reconstruct all five labelled signed deck occurrences and set
      x_hat=(sum_{i=0}^4 sigma_i(d_i+1)m^i-C) mod N. Accept only after the
      exact generic verification [x_hat]P=Q.
  lemmas:
    - id: L1-two-deck-labelled-isolation
      claim: >-
        Under the exact universal-object and complete-transcript premises,
        canonical dyadic restriction of F_0 and F_1 isolates labelled
        occurrences e_0 and e_1 using 2*log2(2m) predicate calls.
      status: proof_obligation_pending_review
      falsified_by: >-
        Any need for different objects per restriction, loss of labels,
        marginal-only success, or an uncharged replay or interaction.
    - id: L2-eight-exact-intervals
      claim: >-
        For each of the eight sign tuples, the residual signed three-digit
        set is exactly one contiguous integer interval of length m^3.
      status: candidate_elementary_lemma_pending_independent_enumeration
      falsified_by: >-
        A missing integer, duplicate base-m rank, endpoint mismatch, or
        failure of the sign-dependent unranking map for any m>=1.
    - id: L3-target-independent-serialized-dictionary
      claim: >-
        The pre-Q table contains all and only serialized pairs needed for the
        baby-step membership test, including the retained coefficient j, and
        consumes S*O(log N) advice bits under exact generic encodings.
      status: proof_obligation_pending_source_and_accounting_review
      falsified_by: >-
        Target dependence, opaque handles, omitted coefficients or labels,
        unbounded representation words, or an advice-bit undercount.
    - id: L4-covered-interval-search
      claim: >-
        The giant-step loop covers every rank r in [0,m^3-1], rejects only
        the padded final-block ranks, and reconstructs any hit exactly.
      status: proof_obligation_pending_edge_case_review
      falsified_by: >-
        A gap, an accepted r>=m^3, an encoding collision not resolved by
        exact equality and replay, or modular wrap yielding an unverified hit.
    - id: L5-decode-and-verify
      claim: >-
        A correctly reconstructed five-deck labelled representation of R
        yields x_hat by subtracting C, and final verification rejects every
        incorrect or collision-induced candidate.
      status: candidate_exact_identity_pending_review
      falsified_by: "A reconstructed accepted candidate with [x_hat]P != Q."
    - id: L6-resource-and-success-transfer
      claim: >-
        Only if the cited MPZ interface and success theorem apply to the
        serialized complete-transcript construction do the stated ell, k,
        and B^(-1/4+o(1)) targets follow.
      status: unverified_source_dependent_obligation
      falsified_by: >-
        A missing premise, a different resource definition, omitted online
        work, failure of complete-transcript success, or inability to charge
        serialized advice and every interaction in the required measures.
  proof_decomposition:
    correctness:
      depends_on: [L1-two-deck-labelled-isolation, L2-eight-exact-intervals, L4-covered-interval-search, L5-decode-and-verify]
      status: pending_independent_review
    advice_size:
      depends_on: [L3-target-independent-serialized-dictionary]
      status: pending_independent_review
    online_cost:
      depends_on: [L1-two-deck-labelled-isolation, L4-covered-interval-search, L6-resource-and-success-transfer]
      status: pending_independent_review
    success_probability:
      depends_on: [L1-two-deck-labelled-isolation, L6-resource-and-success-transfer]
      status: unverified_source_dependent
  resource_ledger:
    observed_runs: 0
    implementation_runs: 0
    experiment_runs: 0
    advice:
      entries: "S=ceil(m^(7/4))"
      serialized_bits_target: "S*O(log N)=B^(7/4+o(1))"
      included_payload: [exact_generic_encoding, coefficient_j]
    predicate_calls_target: "2*log2(2m)"
    giant_steps_target: "8*ceil(m^3/S)=B^(5/4+o(1))"
    ell_target: "B^(9/4+o(1))"
    k_target: "B^(5/4+o(1))"
    success_bound_target: "B^(-1/4+o(1))=N^(-1/20+o(1))"
    charging_rule: >-
      Charge all preprocessing representation bits and all predicate,
      giant-step, lookup, replay, decoding, and verification interactions;
      no action is free merely because it crosses phases.
    status: candidate_targets_not_observations
  assumptions:
    - universal_arbitrary_signed_labelled_decks
    - exact_two_deck_subset_stability
    - complete_transcript_success
    - fresh_Q
    - target_independent_preprocessing
    - all_stored_representations_and_coefficients_serialized_in_advice_bits
    - all_interactions_charged_to_aggregate_k
    - exact_generic_encodings
  excluded_assumptions:
    - coordinate_leakage
    - unbounded_words
    - opaque_cross_phase_handles
    - target_conditioned_advice
    - extra_oracle
    - witness_conditioned_preprocessing
  controls:
    - id: C1-eight-sign-enumeration
      check: "Independently enumerate all eight sign intervals, prove exact length m^3, and prove unique base-m unranking."
    - id: C2-edge-and-collision
      check: "Exercise negative endpoints, modular wrap, overlapping integer intervals, identity, duplicate encodings, padded ranks, replay, and final verification."
    - id: C3-opaque-handle-stop
      expected: "The MPZ premise fails when advice uses opaque cross-phase handles rather than serialized representations."
    - id: C4-post-target-table-stop
      expected: "A table selected after Q fails target independence."
    - id: C5-online-table-accounting-stop
      expected: "A table built online must be charged and invalidates the frozen k target."
    - id: C6-one-restriction-boundary
      expected: >-
        Removing the F_1 restriction leaves a four-deck residual. The CGK
        full-group relation remains proportional to S*T^2/N; N must not be
        replaced by m^4. With S=B^(9/4), constant full-group success requires
        T=B^(11/8), above B^(5/4), while direct interval BSGS costs B^(7/4).
        The one-restriction case remains open and unverified.
    - id: C7-random-coordinate-stop
      expected: "Random-only or P1553 coordinate decks fail the signed labelled universal-interface premise."
    - id: C8-marginal-answer-stop
      expected: "Marginal per-query answers do not imply complete-transcript success."
    - id: C9-known-false-target-local-oracle
      expected: "The argument stops at the first absent target-independence or generic-interface premise."
    - id: C10-noncontiguous-weighted-digit-mutant
      expected: "The exact-interval lemma fails or is re-proved from scratch; it is not transferred by analogy."
  falsification:
    criteria:
      - any_counterexample_to_unique_signed_interval_unranking
      - any_uncovered_rank_or_accepted_padding_rank
      - any_label_loss_that_prevents_exact_reconstruction
      - any_target_dependent_or_unserialized_preprocessing
      - any_uncharged_generic_interaction
      - any_failure_of_complete_transcript_success
      - any_cited_source_whose_formal_premises_or_resources_do_not_match
      - any_known_false_control_on_which_the_argument_still_reaches_the_conclusion
    interpretation: >-
      A failed proof obligation weakens or falsifies only this scoped candidate.
      A source-access, tooling, implementation, or runtime failure is not
      mathematical evidence.
  scope:
    supported_if_all_obligations_pass: two_restriction_abstract_generic_interface_only
    explicitly_not_supported:
      - P1553_coordinate_decks
      - random_only_decks
      - generic_ECDLP_lower_bound
      - one_restriction_case
      - B71
      - SOTA_movement
      - algorithm_or_attack
      - speedup
      - closure_or_completion
      - breakthrough
  pareto:
    dominated_by: unverified_full_frontier
    sota_delta: unknown_not_evaluated
    unchecked_axes: [time, memory, data, preprocessing, replay, target_dependence]
  conclusion:
    statement: >-
      The interval algebra supplies a concrete, falsifiable route for a
      two-restriction correction candidate, but its universal-object,
      serialization, complete-transcript, accounting, and source-transfer
      obligations remain unverified. Independent review is required before
      any use beyond this candidate record. The one-restriction boundary is
      deliberately left open and unverified.
    status: correction_candidate_pending_independent_review
  references:
    - key: MPZ-2020-996
      citation: "MPZ, IACR ePrint 2020/996"
      provenance: internal
      access: parent_relay
      independently_opened_by_producer: false
      use: "Interface and conditional success-bound target; requires independent source verification."
    - key: CGK-2017-1113
      citation: "CGK, IACR ePrint 2017/1113"
      provenance: internal
      access: parent_relay
      coordinator_access: retrieved
      independently_opened_by_producer: false
      use: "Full-group S*T^2/N boundary control only."
    - key: ROTEM-SEGEV-ITC-2022-12
      citation: "Rotem-Segev, DOI 10.4230/LIPIcs.ITC.2022.12"
      provenance: internal
