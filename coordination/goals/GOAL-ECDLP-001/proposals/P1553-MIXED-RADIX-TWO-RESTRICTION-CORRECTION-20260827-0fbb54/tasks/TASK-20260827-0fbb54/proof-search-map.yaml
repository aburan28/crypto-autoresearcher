  target_claim: >-
    Conditional on the exact universal signed-labelled-deck interface and
    complete resource accounting, restricting F_0 and F_1 leaves an exactly
    searchable union of eight length-m^3 signed intervals with the frozen
    candidate resource and success targets.
  exact_baseline_reproduction:
    baseline: >-
      Reproduce R=Q+[C]P with C=sum_{i=0}^4 m^i, isolate labelled e_0,e_1,
      factor the remaining terms by P'=[m^2]P, and retain the full-group
      denominator N in every cited constructive relation.
    derivation_steps:
      - "R-e_0-e_1=[t]P' for t=s_2*a+m*s_3*b+m^2*s_4*c and a,b,c in [1,m]."
      - "For alpha(+1)=1 and alpha(-1)=-m, set A_tau=sum alpha(s_{j+2})m^j."
      - "Write each signed digit as alpha(sign)+r_j with 0<=r_j<m."
      - "Conclude t=A_tau+r_0+m*r_1+m^2*r_2 with rank range [0,m^3-1]."
      - "Decode x_hat=(sum sigma_i(d_i+1)m^i-C) mod N and verify [x_hat]P=Q."
    exact_costs_to_reproduce:
      advice_bits: "ceil(m^(7/4))*O(log N), including exact encodings and coefficients"
      predicate_calls: "2*log2(2m)"
      giant_steps: "8*ceil(m^3/ceil(m^(7/4)))"
      aggregate_ell: "B^(9/4+o(1)) target"
      aggregate_k: "B^(5/4+o(1)) target"
      success: "B^(-1/4+o(1)) target, conditional on exact MPZ source match"
    failure_conditions:
      - baseline_uses_N_replaced_by_residual_interval_size
      - baseline_omits_occurrence_labels_or_serialized_coefficients
      - baseline_charges_only_marginal_queries_not_complete_transcript
      - baseline_uses_post_target_preprocessing
    status: producer_derivation_recorded_independent_reproduction_pending
  observation_collision_search:
    observations_under_test:
      - "A group-encoding membership hit corresponds to a retained coefficient j."
      - "Eight integer intervals may overlap after reduction modulo N."
      - "Distinct labelled deck occurrences may share a group encoding."
      - "Identity or wraparound may create multiple reconstruction candidates."
    collision_routes:
      - route: duplicate_exact_encodings
        response: "Retain all necessary coefficient/label candidates or replay them; accept only a finally verified x_hat."
      - route: overlapping_sign_intervals
        response: "Treat sign tuple as part of reconstruction provenance; do not infer unique sign from group equality."
      - route: modular_wrap
        response: "Preserve integer rank bounds before modular group comparison and verify decoded x_hat."
      - route: padded_final_block
        response: "Discard every recovered r>=m^3 before unranking."
      - route: identity_hit
        response: "Apply the same retained-coefficient, replay, decode, and final-verification path."
      - route: transcript_marginalization
        response: "Stop: marginal predicate correctness does not establish a complete successful transcript."
    known_artifact_tell: >-
      A candidate that continues to accept when labels are erased, advice is
      target-conditioned, or complete-transcript success is replaced by
      marginal answers is detecting an interface artifact rather than the
      claimed mechanism.
    status: collision_routes_specified_not_experimentally_run
  quantifier_order_audit:
    required_order:
      - "Choose public parameters and signed labelled decks from N before the target."
      - "Construct and serialize the baby-step dictionary before Q."
      - "Receive a fresh Q and use the same universal object across all canonical dyadic restrictions."
      - "Condition on a complete successful transcript, not separately successful marginal queries."
      - "Reconstruct, decode, and verify each candidate."
    adversarial_swaps:
      - swap: target_before_dictionary
        verdict: invalidates_target_independence
      - swap: witness_before_preprocessing
        verdict: invalidates_preprocessing_premise
      - swap: choose_new_object_per_restriction
        verdict: invalidates_universal_object_premise
      - swap: aggregate_marginal_success_after_queries
