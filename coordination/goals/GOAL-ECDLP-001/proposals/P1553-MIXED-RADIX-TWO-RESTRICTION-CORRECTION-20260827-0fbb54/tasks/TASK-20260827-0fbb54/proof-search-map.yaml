    status: explicit_order_recorded_pending_blind_rederivation
  constructive_transform:
    input: >-
      A complete successful transcript from the one exact target-independent
      universal generic object, yielding labelled e_0 and e_1, plus the
      serialized pre-Q baby-step dictionary.
    transform:
      - "Compute H=R-e_0-e_1 and P'=[m^2]P."
      - "For each tau in {+1,-1}^3 compute A_tau and H_tau=H-[A_tau]P'."
      - "Enumerate giant blocks i and query dictionary membership for H_tau-[iS]P'."
      - "For every retained j form r=iS+j and discard r>=m^3."
      - "Base-m unrank r and apply the sign-dependent digit inverse."
      - "Restore all five labelled occurrences, decode x_hat, and verify [x_hat]P=Q."
    output: "A verified x_hat if a valid reconstruction exists; otherwise no candidate conclusion."
    exactness_dependencies:
      - unique_base_m_rank
      - exact_generic_encoding_equality
      - retained_coefficients_and_occurrence_labels
      - exhaustive_collision_replay
      - final_group_verification
    status: constructive_candidate_not_implemented
