  definitions:
    signed_digit: "e_i = sigma_i (d_i + 1), with 0 <= d_i < m and sigma_i in {+1,-1}"
    full_deck_scalar: "W = sum_{i=0}^4 e_i m^i"
    shifted_target: "R = Q + [C]P, where C = sum_{i=0}^4 m^i"
    decoder_identity: "if [W]P = R, then x_hat = (W-C) mod N satisfies [x_hat]P = Q"
    residual_after_isolation: "Y = R - [e_0 + e_1 m]P"
    residual_generator: "D = [m^2]P"
    normalized_residual: "T = e_2 + m e_3 + m^2 e_4, so Y = [T]D for a consistent five-deck witness"

  exact_interval_identity:
    sign_vector_order: [sigma_2, sigma_3, sigma_4]
    offset_digit: "b_i(sigma_i) = 1 when sigma_i=+1, and b_i(sigma_i) = -m when sigma_i=-1"
    transformed_digit: "u_i = d_i when sigma_i=+1, and u_i = m-1-d_i when sigma_i=-1"
    transformed_digit_range: "0 <= u_i < m"
    per_digit_identity: "sigma_i(d_i+1) = b_i(sigma_i) + u_i"
    lower_endpoint: "L_sigma = b_2 + m b_3 + m^2 b_4"
    upper_endpoint: "U_sigma = L_sigma + m^3 - 1"
    normalized_set_identity: >-
      {sigma_2(d_2+1) + m sigma_3(d_3+1) + m^2 sigma_4(d_4+1)}
      = {L_sigma + r : 0 <= r < m^3}.
    raw_set_identity: >-
      {sum_{i=2}^4 sigma_i(d_i+1)m^i}
      = {m^2 t : L_sigma <= t <= U_sigma}; this is an arithmetic
      progression of step m^2, not every integer between the raw endpoints.
    endpoint_table:
      - signs: "+++"
        L_sigma: "m^2 + m + 1"
        U_sigma: "m^3 + m^2 + m"
        raw_low: "m^4 + m^3 + m^2"
        raw_high: "m^5 + m^4 + m^3"
      - signs: "++-"
        L_sigma: "1 + m - m^3"
        U_sigma: "m"
        raw_low: "m^2 + m^3 - m^5"
        raw_high: "m^3"
      - signs: "+-+"
        L_sigma: "1"
        U_sigma: "m^3"
        raw_low: "m^2"
        raw_high: "m^5"
      - signs: "+--"
        L_sigma: "1 - m^2 - m^3"
        U_sigma: "-m^2"
        raw_low: "m^2 - m^4 - m^5"
        raw_high: "-m^4"
      - signs: "-++"
        L_sigma: "m^2"
        U_sigma: "m^3 + m^2 - 1"
        raw_low: "m^4"
        raw_high: "m^5 + m^4 - m^2"
      - signs: "-+-"
        L_sigma: "-m^3"
        U_sigma: "-1"
        raw_low: "-m^5"
        raw_high: "-m^2"
      - signs: "--+"
        L_sigma: "-m"
        U_sigma: "m^3 - m - 1"
        raw_low: "-m^3"
        raw_high: "m^5 - m^3 - m^2"
      - signs: "---"
        L_sigma: "-m^3 - m^2 - m"
        U_sigma: "-m^2 - m - 1"
        raw_low: "-m^5 - m^4 - m^3"
        raw_high: "-m^4 - m^3 - m^2"

  bijective_unranking:
    rank: "r = u_2 + m u_3 + m^2 u_4"
    rank_range: "0 <= r < m^3"
    unrank:
      u_2: "r mod m"
      u_3: "floor(r/m) mod m"
      u_4: "floor(r/m^2)"
    recover_original_digits: >-
      d_i=u_i for sigma_i=+1; d_i=m-1-u_i for sigma_i=-1.
    proof: >-
      Base-m expansion is a bijection from {0,...,m^3-1} to
      {0,...,m-1}^3. Each sign-dependent map d_i <-> u_i is either the
      identity or the involution d_i -> m-1-d_i, hence is bijective.
    separation_from_group_encoding: >-
      This is an integer bijection. Reduction modulo N may identify different
      integer encodings or different sign intervals; it does not invalidate
      the rank/unrank bijection and must be handled by candidate verification.

  target_independent_interval_extractor:
    parameters:
      baby_table_size: "S_b = ceil(m^(7/4))"
      interval_length: "L = m^3"
      giant_step_count_per_sign: "H = ceil(m^3/S_b)"
      sign_count: 8
    preprocessing:
      generator: "D = [m^2]P"
      table: "B[a] = [a]D for 0 <= a < S_b, keyed by equality-comparable group handle and labelled by a"
      target_dependencies: []
      permitted_dependencies: [P, m, N, generic_group_encoding]
      collision_policy: store_all_labels_for_each_handle
    online_search:
      - "Obtain the exactly isolated e_0,e_1 supplied by the assumed restriction replay."
      - "Compute Y = R - [e_0 + e_1 m]P."
      - "For each of the eight sign vectors, compute Z_sigma = Y - [L_sigma]D."
      - "For q=0,...,H-1, compute W_q = Z_sigma - [q S_b]D and look up W_q in B."
      - "For every returned label a, set r=q S_b+a and retain it only when r<m^3."
      - "Unrank r, recover d_2,d_3,d_4, decode x_hat, and perform full verification."
    correctness: >-
      For a consistent sign vector, Z_sigma=[r]D. Writing r=qS_b+a with
      q=floor(r/S_b) and 0<=a<S_b makes W_q=[a]D, so the table reports the
      candidate. Conversely, the range check and exact unranking produce only
      a tuple in the declared sign interval; full verification rejects any
      group-level alias not consistent with Q.
    target_independence_boundary: >-
      The baby table and sign offsets depend only on public group data and m.
      Any table containing Y, Q, R, e_0, e_1, or online equality outcomes is
      target-conditioned and cannot be charged as target-independent advice.
    opaque_handle_boundary: >-
      Opaque handles suffice for equality lookup when preprocessing and online
      search use the same generic-oracle encoding; the known scalar label a is
      stored beside each handle. The frozen statement does not itself grant
      that handles serialized in one oracle instance remain meaningful in a
      distinct oracle instance. Cross-instance reuse therefore requires an
      explicit reusable-handle/canonical-encoding premise. Otherwise the table
      must be regenerated and its S_b group operations charged online.

  replay_decoder_and_verification:
    replay: >-
      Replay the assumed complete canonical-dyadic restriction procedure for
      F_0 and F_1 using its target-independent crossing advice, charging its
      aggregate k interactions, and consume only its exact e_0,e_1 output.
      No isolation mechanism beyond the frozen assumption is inferred here.
    residual_replay: >-
      Compute Y from the replayed e_0,e_1, then run the eight deterministic
      interval searches using the target-independent table. Preserve every
      equality match until range and full-target verification are applied.
    decoder:
      candidate_scalar: "W_hat = e_0 + e_1 m + e_2 m^2 + e_3 m^3 + e_4 m^4"
      discrete_log: "x_hat = (W_hat - C) mod N"
    verification:
      primary: "[x_hat]P == Q"
      equivalent: "[W_hat]P == R"
      requirement: >-
        Verification is mandatory because sign intervals overlap and raw
        exponents can wrap modulo N. If a deck witness is required, enumerate
        all verified candidates or apply a declared deterministic tie-break;
        do not silently overwrite duplicates.
    existence_check: >-
      For the representative 0<=x<N, m^5>=N gives a five-digit base-m
      expansion x=sum d_i m^i. Choosing all sigma_i=+1 yields
      x+C=sum(d_i+1)m^i, so a full positive witness exists. Extractor success
      still depends on the assumed exact isolation returning e_0,e_1 from a
      witness consistent with R.

  resource_accounting:
    radix_relation: "B <= m < 2B, hence m = B^(1+o(1)) for exponent accounting"
    baby_preprocessing:
      entries: "S_b = ceil(m^(7/4))"
      exponent_in_B: "7/4 + o(1)"
    residual_online:
      exact_bound: "8 ceil(m^3/S_b) plus O(log m) setup and O(1) verification per reported candidate"
      exponent_in_B: "5/4 + o(1)"
    combined_advice:
      expression: "A = ell + O(S_b)"
      bound: "A <= B^(9/4+o(1))"
      reason: "ell has exponent 9/4 and dominates the table exponent 7/4"
    combined_online_interactions:
      expression: "T_online = k + O(8 ceil(m^3/S_b) + log m)"
      bound: "T_online <= B^(5/4+o(1))"
    online_working_memory: >-
      O(1) group handles beyond the read-only table for a streaming giant-step
      walk, or O(number of verified candidates) if every duplicate witness is
      retained. Counting advice-resident storage gives exponent 9/4 overall.
    serialization_condition: >-
      The 9/4 advice and 5/4 online bounds require the S_b table handles to be
      reusable in the online oracle instance. Regenerating opaque handles
      online raises the online exponent to at least 7/4.

  mpz_success_substitution:
    theorem_input_not_reproved: >-
      The frozen statement names the full-group MPZ form S*T^2/N but does not
      include the theorem, constants, additive terms, or its precise advice
      encoding premises. This task therefore checks only the requested
      substitution, conditional on that form applying to A and T_online.
    full_group_form: "p_success <= O(A * T_online^2 / N)"
    substitution: >-
      A*T_online^2/N <=
      B^(9/4+o(1)) * B^(2*5/4+o(1)) / B^5
      = B^(-1/4+o(1)).
    extractor_only_term: >-
      S_b*H^2/N = B^(7/4 + 2*5/4 - 5 + o(1))
      = B^(-3/4+o(1)); the complete construction is instead dominated by ell.
    correct_distribution_boundary: >-
      The denominator N belongs to a bound applied to the complete algorithm
      on a full-group target Q=[x]P (for uniform x, or by averaging an
      all-target success guarantee). Conditioning on isolated low digits does
      not license changing the theorem's denominator.
    rejected_interval_substitution: >-
      Replacing N by the residual interval length m^3 is not justified by any
      theorem in the frozen inputs. It would give A*T_online^2/m^3 =
      B^(7/4+o(1)), a vacuous expression, but neither that expression nor its
      converse is an MPZ conclusion without a separately proved
      interval-target theorem.
    success_premise_limitation: >-
      The statement does not explicitly specify a distribution for x. The
      full-group probability comparison is justified only if
      complete-transcript success means success for every x, or if x is
      separately taken uniform in Z_N.

  required_controls:
    all_eight_sign_vectors:
      outcome: holds
      evidence: exact endpoint table and common base-m unranking above
    negative_endpoints:
      outcome: holds_with_signed_arithmetic
      evidence: >-
        Five sign intervals have a negative lower or upper endpoint. Signed
        scalars are retained as integers and reduced modulo N only for group
        operations; no endpoint is clamped to zero.
    wraparound:
      outcome: handled_by_group_arithmetic_and_full_verification
      evidence: >-
        Raw endpoints can be negative or outside [0,N). Search uses group
        operations modulo N while range checks use the unreduced r.
    overlap_and_duplicate_encodings:
      outcome: present_and_must_not_be_deduplicated_by_handle_only
      witness: >-
        Normalized T=1 has at least two integer encodings for m>=2:
        (+,-,+) with (e_2,e_3,e_4)=(1,-m,1), and (+,+,-) with
        (e_2,e_3,e_4)=(1,m,-1). Both evaluate to 1.
    identity:
      outcome: present_and_supported
      witness: >-
        For signs (++-), (e_2,e_3,e_4)=(m,m-1,-1) gives T=0.
        The baby table must contain a=0 and must not discard the identity.
    target_conditioned_table:
      outcome: rejected_as_preprocessing_advice
      evidence: >-
        A table keyed by Z_sigma, Y, Q, R, or replay outcomes depends on the
        target. Only the table {[a]D} is target-independent.
    opaque_handle_table:
      outcome: conditional
      evidence: >-
        Equality lookup works with opaque handles in one persistent oracle;
        serialization across a fresh encoding is not established by the two
        frozen inputs and must be added as a premise or charged online.
    noncontiguous_weighted_digit_mutant:
      outcome: correctly_breaks_the_interval_identity
      mutant: "replace normalized weights (1,m,m^2) by (1,m,m^3)"
      evidence: >-
        For fixed signs, u_2+m u_3+m^3 u_4 forms m blocks of length m^2.
        Consecutive blocks are separated by a gap of m^3-m^2, so there is no
        length-m^3 contiguous rank interval and the stated base-m unranking
        does not apply.
    remove_F1_restriction:
      outcome: no_one_restriction_conclusion
      evidence: >-
        Isolating only e_0 leaves four consecutive normalized digits and
        sign intervals of length m^4. Keeping S_b=m^(7/4) costs
        m^(9/4+o(1)) online giant steps. Even spending the entire stated
        B^(9/4+o(1)) advice exponent on a table leaves online exponent 7/4,
        and the full-group product exponent is 9/4+2*(7/4)-5=3/4 rather than
        a negative exponent. The frozen statement also supplies no separate
        one-restriction transcript bound.
    full_group_MPZ_versus_interval_substitution:
      outcome: full_group_substitution_only
      evidence: >-
        The statement-supported substitution is A*T_online^2/N =
        B^(-1/4+o(1)); an m^3 denominator requires an absent interval theorem.

  edge_conditions:
    - >-
      For prime N>2, m is a power of two not divisible by N, so D=[m^2]P
      has order N. At the degenerate prime N=2, D is the identity and the
      interval extractor as stated is not an injective DLP routine; that
      constant-size case can be solved directly but is not excluded by the
      literal frozen statement.
    - >-
      For asymptotically large N, m^3<N, so each fixed sign interval maps
      injectively through D. For smaller N, table keys must be multimaps and
      all congruent candidates must be range-checked and verified.

  statement_only_result:
    agreements:
      - The normalized interval identity, all eight exact endpoints, and bijective unranking hold.
      - A baby-step/giant-step extractor with table exponent 7/4 and online exponent 5/4 follows for the three residual decks.
      - With reusable target-independent table handles, combined advice and online exponents are 9/4 and 5/4.
      - The decoder x_hat=(W_hat-C) mod N and full verification are exact.
      - The conditional full-group MPZ exponent substitution is -1/4.
      - No one-restriction conclusion follows from the frozen bounds.
    disagreements_or_unproved_steps:
      - Treating the raw residual scalars as an ordinary contiguous interval is false; they have step m^2.
      - Cross-oracle serialization of opaque baby-table handles is not established by the frozen statement.
      - Replacing the full-group MPZ denominator N by m^3 is unproved.
      - Exact MPZ constants, additive terms, and applicability premises cannot be recovered from the two frozen inputs.
    claim_ceiling: >-
      These are agreements and disagreements on the frozen algebra and
      accounting only. They are not a P1553 result, generic lower bound,
      one-restriction theorem, B71/SOTA assessment, attack, closure,
      breakthrough, scientific verdict, or research-state recommendation.

