  restriction_invariants:
    premise_boundary: >-
      J1 assumes, without deciding the J2 source/interface question, the frozen
      one-object subset-stability and complete-transcript predicate contract.
    labelled_domain_size: "|F_i|=2m, and m is a power of two"
    bisection_depth_per_deck: "log2(2m)"
    total_bisection_calls: "2*log2(2m)"
    invariant_1: >-
      After each canonical half restriction, the currently restricted F_0 and
      F_1 domains still admit at least one complete successful transcript under
      the same universal object. The surviving witness may differ from a prior
      witness; the algebra needs only a surviving legal labelled occurrence.
    invariant_2: >-
      Each chosen half has exactly half the current labelled occurrences. After
      log2(2m) steps it is a singleton, so the complete transcript supplies one
      exact occurrence label (deck_index,digit_index,sign). F_0 is kept at its
      singleton while F_1 is bisected; F_2,F_3,F_4 stay full.
    combinatorial_control: passed_126_singleton_paths_and_642_bisection_steps

  interval_derivation:
    setup: >-
      Put a=d_2+1, b=d_3+1, c=d_4+1 in [1,m], let
      tau=(s_2,s_3,s_4), and factor P'=[m^2]P. Then
      H=[t]P' with t=s_2*a+m*s_3*b+m^2*s_4*c.
    sign_base: "alpha(+)=1; alpha(-)=-m"
    offset: "A_tau=alpha(s_2)+m*alpha(s_3)+m^2*alpha(s_4)"
    digit_change: >-
      For a positive signed digit, +a=1+r with r=d. For a negative
      signed digit, -a=-m+r with r=m-a=m-d-1. In both cases
      0<=r<m and the inverse digit is unique.
    rank_identity: "t=A_tau+r_0+m*r_1+m^2*r_2"
    rank_range: "0<=r_0+m*r_1+m^2*r_2<=m^3-1"
    exact_offset_and_endpoint_table:
      - signs: "+++"
        A_tau: "m^2+m+1"
        interval: "[m^2+m+1, m^3+m^2+m]"
      - signs: "++-"
        A_tau: "1+m-m^3"
        interval: "[1+m-m^3, m]"
      - signs: "+-+"
        A_tau: "1"
        interval: "[1, m^3]"
      - signs: "+--"
        A_tau: "1-m^2-m^3"
        interval: "[1-m^2-m^3, -m^2]"
      - signs: "-++"
        A_tau: "m^2"
        interval: "[m^2, m^3+m^2-1]"
      - signs: "-+-"
        A_tau: "-m^3"
        interval: "[-m^3, -1]"
      - signs: "--+"
        A_tau: "-m"
        interval: "[-m, m^3-m-1]"
      - signs: "---"
        A_tau: "-m-m^2-m^3"
        interval: "[-m-m^2-m^3, -m-m^2-1]"
    endpoint_check: >-
      In every row the upper endpoint equals A_tau+m^3-1, so every fixed
      sign interval has exactly m^3 integers, including rows with negative
      lower or upper endpoints.

  bijective_unranking:
    base_m_digits: >-
      For an in-range rank r, Euclidean division gives the unique tuple
      (r_0,r_1,r_2) in [0,m-1]^3 with r=r_0+m*r_1+m^2*r_2.
    inverse_per_sign:
      positive: "d_j=r_j"
      negative: "d_j=m-r_j-1"
    label_reconstruction: >-
      The sign tuple supplies s_2,s_3,s_4, the inverse supplies d_2,d_3,d_4,
      and the fixed positions supply deck indices 2,3,4. Thus each accepted
      (tau,r) reconstructs exactly one legal occurrence-labelled residual
      transcript. Equal group encodings never erase these labels.
    global_nonuniqueness_handling: >-
      Distinct sign intervals may overlap as integer sets, and modular group
      reduction creates further aliases. No global uniqueness is assumed:
      tau and each retained coefficient occurrence stay in replay provenance.

  bsgs_coverage:
    S: "ceil(m^(7/4))"
    blocks: "ceil(m^3/S)"
    exact_tiling_proof: >-
      Every r in [0,m^3-1] has the unique Euclidean decomposition
      i=floor(r/S), j=r mod S. Hence 0<=j<S and
      0<=i<ceil(m^3/S), so the giant-step loop reaches the exact baby entry j.
    padding_rule: >-
      The final rectangular block may contain m^3<=iS+j<ceil(m^3/S)S.
      These ranks are rejected before base-m unranking; therefore no padded
      rank becomes a deck label.
    hit_to_candidate_bijection: >-
      Treat the table as a serialized multimap of every pair
      (exact_encoding([j]P'),j), not as a single-value map that overwrites
      duplicate keys. Each retained in-range hit occurrence (tau,i,j) maps to
      r=iS+j and one labelled residual transcript. Conversely its Euclidean
      (i,j) is unique for that tau.

  collision_wrap_and_replay:
    integer_interval_overlap: >-
      Search all eight tau values independently. When two intervals contain
      the same integer, their sign tuples and reconstructed occurrence labels
      remain distinct candidates; neither is silently deduplicated by scalar.
    modular_wrap: >-
      A group hit establishes [A_tau+r]P'=H, not an integer equality with the
      producer's original residual scalar. Every in-range modular alias is
      nevertheless a legal labelled residual transcript and must be replayed.
    duplicate_baby_encodings: >-
      All coefficients j sharing an exact group encoding are retained in that
      encoding's bucket. The controls exercised this at N=2 and N=3. Collapsing
      such a bucket is outside the frozen all-pairs/replay requirement.
    duplicate_occurrence_encodings: >-
      Occurrences are keyed by (deck_index,digit_index,sign), not by group
      encoding. The controls preserved 10m labels per modular test even when
      several labels encoded the same group element.
    identity: >-
      H=0 and baby-step identity hits follow the identical bucket replay,
      in-range check, labelled unranking, decode, and verification path.
    exact_encoding_boundary: >-
      The argument uses exact generic equality. Any implementation using a
      fallible truncated hash must replay equality and final verification; a
      hash collision alone is not an exact table hit.

  decoder_and_final_verification:
    candidate_sum: >-
      For reconstructed e_2,e_3,e_4, the hit gives
      e_2+e_3+e_4=H=R-e_0-e_1 in G. Therefore the five reconstructed labelled
      occurrences sum to R.
    decoder: "x_hat=(sum_{i=0}^4 s_i(d_i+1)m^i-C) mod N"
    verification_proof: >-
      Since R=Q+[C]P, subtracting C from the reconstructed scalar gives
      [x_hat]P=Q. A modular alias may change the integer transcript but cannot
      change the decoded residue x_hat in the prime-order cyclic group. The
      explicit final group check rejects any implementation-induced candidate
      that did not actually satisfy the exact hit identity.

