  limitations:
    - >-
      This is a conditional J2 hold. MPZ supplies the enclosing generic
      extraction lower bound, not the packet's universal deck object, deck
      labels, subset-stability premise, or complete-transcript guarantee.
    - >-
      The restriction mechanism must remain an inlined allowed generic solver;
      a custom predicate oracle, opaque handle, or uncharged internal query
      would invalidate MPZ applicability immediately.
    - >-
      The MPZ theorem is average-case over a uniform dense representation and
      uniform exponent. The frozen per-fresh-target premise is stronger and
      therefore sufficient, but no pointwise MPZ bound is claimed.
    - >-
      Preprocessing time is separately disclosed but is unbounded by the MPZ
      theorem. Rotem-Segev is only a full-group contextual control.
    - >-
