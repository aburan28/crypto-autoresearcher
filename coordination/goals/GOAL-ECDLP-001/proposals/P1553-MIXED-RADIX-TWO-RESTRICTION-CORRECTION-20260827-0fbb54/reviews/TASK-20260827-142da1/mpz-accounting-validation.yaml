      adaptive_interactions_covered: true
      allowed_operations: [group_addition, generator_insertion]
      allowed_function_queries: [dense_representation, shared_random_oracle]
      one_final_exponent_guess: true
    deck_interface_boundary: >-
      MPZ does not itself provide a signed-deck restriction oracle. The packet's
      theorem fits MPZ only under its frozen premise that every restriction is
      an inlined execution of the same allowed generic solver, with no extra
      oracle and with all of that execution's internal interactions included in
      aggregate k. Interpreting a predicate call as a new primitive would make
      the packet inapplicable; that interpretation is expressly excluded by the
      packet's no-extra-oracle and full-charging premises.
  target_independence_check:
    status: passed
    findings:
      - "The baby dictionary depends only on N, P, m, and P'=[m^2]P and is fixed before Q."
      - "The same serialized dictionary serves all eight normalized intervals; no sign- or target-specific table is needed."
      - "The shifted target R=Q+[C]P is formed only in the main phase."
  handle_lifecycle_check:
    status: passed
    findings:
      - >-
        Each baby entry crosses as an exact dense-representation bit string
        together with coefficient j and dictionary framing; no register handle
        or opaque pointer crosses the phase boundary.
      - >-
        P', the giant-step increment, public deck elements, and any needed
        signed multiples are rebuilt as live main-phase registers from public
        coefficients and charged as O(m+log N) generic interactions.
      - >-
        A giant-step candidate is serialized by one dense query and compared
        internally with the exact stored key; bit-string search is not a free
        generic query, while ordinary local comparison is outside MPZ's k
        metric. The accompanying RAM-time check remains B^(5/4+o(1)).
  complete_transcript_success_check:
    status: passed_with_explicit_assumption
    findings:
      - >-
        MPZ bounds the probability that one complete adaptive main-phase solver
        outputs the final correct exponent. Its proof permits later operations
        to depend on earlier representation-query answers.
      - >-
        The reduction therefore uses the packet's complete-transcript premise
        for the entire adaptive restriction sequence. Separate marginal
        per-restriction guarantees would not compose and are not accepted.
      - >-
        Conditional on a complete successful restriction transcript, exact
        replay, interval scan, decoding, and final verification introduce no
        additional probabilistic loss.
  metric_recomputations:
    - metric: baby_table_entries
      derivation: "S_tab=ceil(m^(7/4))=B^(7/4+o(1)) because B<=m<2B"
