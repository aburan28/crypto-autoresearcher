  exact_model_check:
    status: passed_with_frozen_premises
    source_model: "pG_dense,ro=<Z_N,{+,1},{dense,ro},(infinity,k),infinity,P_N>"
    source_bound: "success <= 3*ell*(k+1)^2/N"
    target_distribution: uniform_independent_permutation_and_exponent
    phase_boundary:
