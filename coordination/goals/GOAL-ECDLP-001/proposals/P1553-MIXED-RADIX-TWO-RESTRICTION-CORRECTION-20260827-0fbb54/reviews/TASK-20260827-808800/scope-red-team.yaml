  observations:
    - id: J3-O1-target-independent-table
      disposition: holds
      statement: >-
        The frozen table consists of encodings of [j][m^2]P and retained j for
        0<=j<S. Its generator, range, and payload depend on N, P, and m but not
        on Q, the isolated occurrences, a witness, or the sign interval. One
        table is reused for all eight fixed offsets. Choosing any part after Q
        is received is therefore a first-premise failure, not an admissible
        implementation of the statement.
    - id: J3-O2-serialization-and-handle-lifecycle
      disposition: holds_conditionally_on_explicit_premise
      statement: >-
        The statement requires advice to contain the exact generic encoding and
        coefficient j and forbids opaque cross-phase handles. An admissible
        dictionary must also serialize its local lookup representation,
        including any ordering, index, hash-family description, seed, buckets,
        and collision lists that are actually retained. Bitstring equality and
        a fully serialized local search are allowed; an external handle resolver,
        coordinate decoder, or unpriced membership oracle is not.
      boundary: >-
        J3 checks that the premise is explicit and that mutated objects stop.
        Exact source-definition and bit accounting remain outside this joint.
    - id: J3-O3-complete-transcript
      disposition: holds_conditionally_on_explicit_premise
      statement: >-
        The two adaptive dyadic searches use one object and require success of
        their complete joint transcript. Per-query marginal correctness cannot
        be multiplied, unioned, or treated as joint success without a dependence
        theorem. Replacing the transcript event by marginal answer events stops
        before either labelled occurrence is certified.
    - id: J3-O4-no-extra-oracle
      disposition: holds
      statement: >-
        The stated construction permits generic-group operations plus local
        operations on serialized bits. It explicitly charges predicate calls,
        giant steps, lookups, replay, decoding, and verification. Any service
        that resolves opaque labels, exposes coordinates, performs target-local
        remainder recovery, or supplies witness-conditioned advice is an extra
        oracle and fails the frozen interface before the reduction starts.
    - id: J3-O5-one-restriction-full-group-boundary
      disposition: holds_with_surviving_routes_named
      statement: >-
        Removing the F_1 restriction leaves the four-deck residual and destroys
        the frozen deterministic three-digit interval finish. Retaining the
        full group denominator N=B^5, preprocessing space S=B^(9/4+o(1)), and
        online time T=B^(5/4+o(1)) gives full-group success
        S*T^2/N=B^(-1/4+o(1)), not constant success. Constant residual success
        requires T=B^((5-9/4)/2+o(1))=B^(11/8+o(1)), which exceeds the frozen
        B^(5/4+o(1)) online bound. Direct deterministic interval BSGS over a
        length-m^4 residual costs m^4/S=B^(7/4+o(1)), also above the bound.
      composition_boundary: >-
        The committed outer MPZ success target is B^(-1/4+o(1)). Composing it
        with an independently randomized full-group residual solver at the
        frozen online budget yields only B^(-1/2+o(1)); the full-group route
        therefore does not preserve the required outer target. A constant-
        success interval-preprocessing theorem, or a proved composition that
        avoids this multiplicative loss, would reopen the boundary. Neither is
        supplied, so no one-restriction theorem follows here.
    - id: J3-O6-forbidden-transfer
      disposition: holds
      statement: >-
        Every producer artifact keeps random-only decks, coordinate-aware decks,
        P1553, generic-ECDLP lower bounds, the one-restriction case, SOTA
        movement, B71, algorithms, attacks, speedups, closure, completion, and
        breakthrough outside its ceiling. No occurrence of the packet name is
        used as a mathematical transfer.
  objections: []
  nonblocking_hardening:
    - id: J3-H1-name-subconstant-full-group-route
      action: >-
        Any Coordinator synthesis should retain the explicit same-budget
        full-group route with residual success B^(-1/4+o(1)) and state why its
        independent composition loses another B^(-1/4+o(1)). Reporting only
        the constant-success B^(11/8) row hides a real but insufficient route.
    - id: J3-H2-serialize-lookup-structure
      action: >-
        Keep the lookup structure itself within the serialized-advice premise;
        do not let dictionary mean an opaque API whose encodings and j values
        are serialized while its index, hash seed, or collision state is not.
