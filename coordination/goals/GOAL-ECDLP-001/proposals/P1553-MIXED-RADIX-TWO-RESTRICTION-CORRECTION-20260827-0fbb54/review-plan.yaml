review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-P1553-MIXED-RADIX-TWO-RESTRICTION-0fbb54
  goal_id: GOAL-ECDLP-001
  batch_id: null
  packet_id: P1553-MIXED-RADIX-TWO-RESTRICTION-CORRECTION-20260827-0fbb54
  recorded_at: "2026-08-27T01:16:46Z"
  coordinator_prior: >-
    The two-restriction theorem appears plausible because each of the eight
    signed three-digit residuals is exactly a length-m^3 mixed-radix interval,
    one target-independent baby table of B^(7/4+o(1)) serialized encodings can
    serve all intervals, and each interval then needs B^(5/4+o(1)) giant steps.
    The load-bearing risks are exact interval/unranking algebra, generic-label
    serialization across phases, hidden reconstruction or lookup interactions,
    modular wrap/collision/replay, and accidental use of a full-group
    preprocessing theorem as an interval theorem in the one-restriction control.
  claim_under_review: >-
    Whether exact subset stability in only F_0,F_1 plus one target-independent
    serialized baby-step table yields a complete verified generic DLP extractor
    within ell=B^(9/4+o(1)) and k=B^(5/4+o(1)), under the exact frozen premises.
  joints:
    - joint: J1-two-restriction-interval-algebra-unranking-and-replay
      assigned_to: TASK-20260827-0a5c7f
      role: reviewer
      attack_plan: >-
        Re-derive both restriction invariants, all eight signed interval
        endpoints, exact interval length, bijective base-m unranking, BSGS hit
        reconstruction, labels, negative endpoints, wraparound, overlapping
        intervals, decoder, and final group verification. Build small exact
        controls and a deliberately noncontiguous weighted-digit mutant.
      expected_break: >-
        A mixed sign may create a gap or duplicate, modular reduction may make
        unranking ambiguous, or a BSGS hit may fail to recover a legal labelled
        occurrence transcript.
    - joint: J2-MPZ-serialized-advice-and-complete-two-restriction-accounting
      assigned_to: TASK-20260827-142da1
      role: validator
      attack_plan: >-
        Independently retrieve MPZ and the primary preprocessing sources;
        verify that serialized generic representations may cross only as bits,
        charge table size, build phase, giant-step state, exact lookups, all
        predicate internals, replay, and verification, and recompute every B/N
        exponent for the complete transcript.
      expected_break: >-
        The baby table may require live handles or online reconstruction, its
        serialized bit length may exceed ell, or a lookup/build interaction may
        push k above B^(5/4+o(1)).
    - joint: J3-scope-proves-too-much-and-one-restriction-boundary
      assigned_to: TASK-20260827-808800
      role: red-team
      attack_plan: >-
        Attack target independence, universal-deck typing, handle lifecycle,
        full-group versus interval preprocessing, overlapping signs, coordinate
        leakage, marginal success, and every packet control. Remove F_1
        restriction and require the proof to stop without asserting an interval
        ST^2/m^4 theorem, P1553 result, or closure.
      expected_break: >-
        The reduction may hide target-specific table entries, silently replace
        N by interval length in a source theorem, or transfer its special-deck
        generic result to coordinate-aware P1553.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - target-conditioned baby-step advice
      - opaque preprocessed handles not serialized into advice bits
      - one-restrictable-deck solver with no proved interval preprocessing theorem
      - random-deck-only or coordinate-aware P1553 solver
      - non-subset-stable predicate or marginal per-query success
      - noncontiguous weighted-digit mutant with the same cardinalities
    failure_signature: >-
      The proof must stop at the first absent premise for every object. If it
      derives the two-restriction theorem or a one-restriction consequence for
      any known-false control, the argument or scope is invalid.
  blind_rederivation:
    required: true
    quantity: >-
      From the frozen statement only, derive exact two-deck isolation, the eight
      interval endpoint formulae, unique unranking, B^(7/4) advice,
      B^(5/4) scan, complete replay, and the MPZ exponent, while stating why the
      one-restriction conclusion does not follow.
