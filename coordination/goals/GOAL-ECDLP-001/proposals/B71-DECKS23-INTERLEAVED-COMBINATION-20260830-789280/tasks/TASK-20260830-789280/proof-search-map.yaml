why_this_differs_from_the_prior_rounds_attempts: >-
  TASK-20260830-e30c67's obstruction rested on a directly-inspectable
  ABSENCE (zero decomposition levels in the 8 frozen route packages) --
  it never constructed anything. The earlier gate-framing-review's
  dichotomy rested on an ASSERTED premise about r_R's abstract freeness.
  This record differs from both: it starts from a SUCCESSFUL, hand-
  verified CONSTRUCTION (derivation-report.yaml parts 2-6), and the
  obstruction is not about whether a decomposition can be built (it can,
  and was) but about whether THIS ONE, as built, transfers -- argued from
  two directly-stated quantities (label_tuples' independent-per-occurrence
  code structure, and r_R's declared degree Theta(B^2)), with the
  argument's own residual uncertainty (the non-dedup-accounting
  alternative) disclosed rather than smoothed over, which is a stronger
  disclosure standard than either prior round applied to its own central
  premise.

bottleneck: >-
  The exact fact whose truth would flip the argument's conclusion is
  WHICH of two explanations accounts for r_R's declared degree Theta(B^2):
  (i) genuine multi-way elimination across the five decks (Bezout-type,
  degrees multiply), which is incompatible with an independent per-deck
  conjunction mechanism achieving the same root set, versus (ii)
  non-deduplicated accounting over the B^2 pair-product generators (a
  bookkeeping convention, not an elimination-degree fact), which would be
  compatible with an independent per-deck mechanism. H-CREP-001 and
  EXP-CREP-001 do not state which; this is the single fact the argument's
  strength turns on, named explicitly rather than left implicit.

baseline_embedding:
  parameter_slice: >-
    The frozen EXP-CREP-001 instance model exactly as specified: deck
    sizes B in {2,3}, six strata, twelve recorded instances; the
    constructed candidate is G01_local, G23_local, Adm4, and the
    existence/replay combination rules of derivation-report.yaml parts
    2-3, evaluated against this exact parameter slice.
  reproduction_check: >-
    Verified by full manual hand-trace (no code execution) on four of the
    twelve recorded instances -- INST-2-single_hit, INST-2-repeated_
    source, INST-3-repeated_source, INST-2-no_relation_unit -- rebuilding
    each instance's decks field-by-field from generate_instances.py's
    mandated_decks/fill_decks rules, then comparing my construction's
    output against the instance's own recorded reference.E and
    reference.replay_table (equivalently, against a hand re-derivation of
    label_tuples/extendible_map, since the recorded JSON files were not
    executed either). All four traces match exactly, field for field,
    including the exact replay tuple lists (derivation-report.yaml parts
    4a-4d). Two further strata (collision_duplicate_endpoints, multi_hit)
    were checked by direct structural argument from the code's own field
    usage rather than full numeric replay, disclosed at that lower depth
    in part_4e/4f.
  audit_result: pass_reproduces_exactly_on_all_numerically_traced_instances

observation_collision:
  observable: >-
    whether the object under test achieves its extendibility/root-
    membership test via independent per-item flags (decomposable, cheap)
    or via a genuinely joint, multi-way elimination (Bezout-multiplicative
    degree, generically not decomposable into independent flags) -- the
    observable the part_8 argument reads to distinguish the toy model's
    admissibility test from a real resultant's vanishing condition.
  distinct_preimage_search: >-
    Applied the SAME observable to the classical subproduct-tree/known-
    linear-factors nearby object used in both prior rounds' controls:
    testing whether a candidate x equals one of D known, PUBLIC, FREELY
    GIVEN scalars a_1..a_D (i.e. whether x is a root of the explicit
    product polynomial prod(x - a_i)) is exactly an OR of D independent,
    mutually unrelated equality tests -- each a_i is given data, not
    itself the output of a further elimination. This is precisely the
    'roots are free/public data' case named as the exception clause in
    this record's own argument (derivation-report.yaml part_8: 'unless
    the underlying elimination degenerates because one side's roots are
    free/independent public data'). The classical control's own
    degree (D, the number of known factors) does not signal a hidden
    joint elimination the way r_R's Theta(B^2)-versus-Theta(B) gap does,
    because there IS no elimination in the classical control at all --
    the known factors are simply given.
  is_the_collision_resolved_by_an_additional_condition: >-
    Yes: whether the object's defining roots/values are FREELY GIVEN
    input data (classical control: yes, by construction) or are
    themselves the output of an elimination the argument is trying to
    reason about (r_R: yes, per H-CREP-001's own framing and the amended
    gate's own asymmetric treatment of g_I's roots as exempt/public versus
    r_R's roots as not). This is the SAME free-versus-not-free distinction
    the amended gate already encodes operationally; this record's
    contribution is an independent DERIVATION of why that distinction
    matters (the classical resultant/elimination degree-multiplication
    fact, plus the directly-stated Theta(B^2) figure), not a restatement
    of the gate's own wording, and not the same route to the distinction
    the earlier, rejected coefficient-space-versus-ideal/root-space
    dichotomy used (that attempt asserted non-freeness by definition of
    'the sought witness'; this record instead reads a stated DEGREE
    number and a classical degree-counting fact).
  audit_result: collision_resolved_by_a_directly_stated_quantity_not_by_definitional_assertion

quantifier_order: >-
  Explicit statement: FOR THE ONE constructed candidate named in this
  session (G01_local, G23_local, Adm4, existence/replay rules), its
  correctness mechanism implies a natural construction degree of O(B);
  r_R is DECLARED (build_packages.py docstring, all seven non-oracle
  route packages' certificates) to have degree Theta(B^2); THEREFORE this
  specific candidate's mechanism does not, without further justification,
  match r_R's stated scale. This is NOT the claim 'no possible decks-2-4
  decomposition of any kind can ever match r_R's scale' -- a different,
  wider, unproven claim this record does not make. The witness that would
  falsify the open, forward-looking question (whether SOME other
  decomposition strategy could succeed) is explicitly named as forward
  guidance (a joint, Bezout-compatible elimination-style rule not
  attempted by this or the prior session) and is left genuinely open, not
  foreclosed.

method_ceiling:
  strongest_certifiable_claim: >-
    Two independent, directly-checkable facts: (1) a decks-2/3 compact
    pairwise object and three-way combination rule is constructed and
    verified, by full hand-trace, to exactly reproduce V4/V5 on four
    numerically-traced and two structurally-checked recorded instances,
    at additive existence cost and empirically-additive replay cost,
    within all H-CREP-001 preprocessing/online caps -- a genuine,
    verified toy-level positive result the prior round did not attempt.
    (2) this specific candidate cannot be gate-discharged, for a fully
    certain procedural reason (part_7, the vocabulary gap) and a
    directly-checkable but explicitly NOT airtight substantive reason
    (part_8, the degree mismatch, which depends on which of two named
    explanations for r_R's Theta(B^2) figure is correct -- a fact this
    session does not and cannot resolve from the corpus as it stands). No
    stronger claim is certifiable: this session does not establish
    whether a DIFFERENT decomposition strategy (joint elimination,
    Bezout-compatible) could succeed, and does not resolve which
    explanation of r_R's degree is correct.
  nearby_object_control: >-
    Applied the same free-versus-not-free observable used to classify
    this session's own argument to the classical subproduct-tree/known-
    linear-factors control (observation_collision above). RESULT: the
    control's known factors are free/public data with no elimination
    behind them, so the argument's exception clause applies to it exactly
    and correctly -- the argument does not fire on (does not falsely
    predict impossibility for) the classical control, consistent with the
    classical remainder-tree technique's genuine, well-established
    efficiency.
  audit_result: control_passes_for_this_narrower_degree_based_claim

derived_not_asserted_declaration: >-
  Direct response to Gate 4 (completion_gate item 4 of the dispatch
  handoff): the degree-mismatch argument (part_8) is derived from (1) a
  direct reading of label_tuples' code (independent per-occurrence
  admissibility, no cross-deck relational test, verified by inspection),
  (2) a direct reading of build_packages.py's docstring and every route
  package's declared exponents (r_R degree Theta(B^2), verified by
  inspection, not restated from a prior round's summary), (3) a classical,
  recalled fact about GCDs and elimination degree (a GCD of degree-B
  objects has degree at most B; eliminating several independently-varying
  auxiliary choices generically multiplies rather than bounds degrees,
  the same Bezout-type fact both prior rounds already named), and (4) an
  explicit, disclosed acknowledgment that an alternative, unconfirmed
  explanation for r_R's stated degree (non-deduplicated accounting) would
  weaken the argument if true. None of these four grounds asserts, by
  definition, that r_R's roots are 'not free' -- ground (2) is a stated
  number read from the corpus, and ground (3) is a general mathematical
  fact about degree-counting, not a claim about r_R's specific identity.
  This differs from the prior round's rejected argument, which asserted
  non-freeness by definition of what a sought witness is.

proof_obligations:
  - claim: >-
      A decomposed, interleaved combination rule for decks 2-4's fold-in
      (analogous to pair-product generators for decks 0-1) exists and
      matches the complete-chart intersection system's actual semantics.
    responsibility: feasibility
    discharge_status: partially_discharged
    reasoning: >-
      Discharged for the TOY model's semantics: G01_local/G23_local/Adm4
      exist, are explicitly constructed, and exactly match generate_
      instances.py's own extendibility/replay semantics (derivation-
      report.yaml parts 2-4). NOT discharged for the real, non-toy
      system's actual semantics, which H-CREP-001 does not specify beyond
      one sentence, and which part_8 argues (with disclosed uncertainty)
      is unlikely to match this construction's independent-per-deck
      mechanism given r_R's stated degree.
  - claim: >-
      Such a rule, if it exists, preserves exact support and replay
      correctness across all six frozen strata (V4, V5) including
      exceptional markers, collisions, and the no-relation-unit case.
    responsibility: correctness
    discharge_status: discharged_for_the_toy_model
    reasoning: >-
      Verified exactly on four of six strata by full numeric hand-trace
      (single_hit, repeated_source at B=2 and B=3, no_relation_unit) and
      on the remaining two (collision_duplicate_endpoints, multi_hit) by
      direct structural argument from the code's own field usage
      (derivation-report.yaml parts 4a-4f). This is a stronger toy-level
      discharge than the prior round achieved, since the prior round
      never constructed an object to test correctness against. Not
      applicable to the real system since feasibility (item 1) is not
      established there.
  - claim: >-
      Such a rule stays target-independent in its preprocessing phase
      (V2, the fresh-target mutation control).
    responsibility: interface
    discharge_status: discharged_for_the_toy_model
    reasoning: >-
      G01_local, G23_local, and Adm4 are built purely from decks (never
      from inst['target'] or any per-instance target field), exactly
      mirroring the existing frozen load_pair_product_generators' own
      target-independence structure; only the final existence-
      intersection and replay-combination steps read the fresh target,
      matching V2's preprocessing/online split exactly. Verified by
      inspection of the construction rule's own inputs (derivation-
      report.yaml part_2), not executed.
  - claim: >-
      Such a rule's combination cost is additive/telescoping rather than
      multiplicative, i.e. genuinely achieves the B^{5/4} online cap
      rather than merely improving on B^3 without reaching the target.
    responsibility: runtime
    discharge_status: discharged_with_a_named_caveat_for_the_toy_model
    reasoning: >-
      The existence sub-computation is unconditionally additive
      (derivation-report.yaml part_3, part_5). The replay sub-computation
      is structurally a bounded Cartesian product (multiplicative in
      three local counts), verified to stay O(1) per label ONLY because
      the frozen 12-instance family never stresses multiplicity in more
      than one deck simultaneously (part_6's degenerate-case check, which
      also exhibits a hypothetical instance where this would blow up to
      Theta(B^5)). This is an honest, checked caveat, not a full
      unconditional discharge of the runtime obligation even at the toy
      level.
  - claim: >-
      The toy combinatorial model's own cheap solvability (CAL-PASS,
      Theta(B) online) does not licence transferring any conclusion to
      the real, non-toy elliptic-curve construction without an
      independent argument, since it is explicitly disclaimed in the
      corpus as an artifact of the synthetic Boolean-OR semantics.
    responsibility: scope
    discharge_status: addressed_with_a_new_named_negative_argument_not_merely_left_open
    reasoning: >-
      This is the central contribution of this session relative to the
      prior round, which left this obligation entirely untouched. Rather
      than merely restating the CAL-PASS disclaimer, this session supplies
      an independent, directly-checkable (though explicitly not airtight)
      reason -- the r_R degree-Theta(B^2)-versus-natural-construction-
      degree-O(B) mismatch (part_8) -- for why THIS SPECIFIC construction
      strategy (independent per-deck admissibility decomposition) is
      unlikely to transfer, going beyond the generic 'toy models can be
      artifacts' caution to a concrete, falsifiable-in-principle reason
      tied to a stated quantity in the corpus.

proof_obligations_none_discharged_here: false

overall_audit_verdict: >-
  The substantive obstruction claim (item b) passes all four Section 8
  audits on directly-inspectable or classically-recalled grounds (label_
  tuples' code structure; r_R's declared degree; a classical elimination-
  degree fact; the same free-versus-not-free distinction the amended gate
  already encodes, now independently derived rather than asserted), while
  explicitly disclosing its own residual uncertainty (the non-dedup-
  accounting alternative for r_R's degree) rather than presenting the
  argument as airtight. Combined with the fully certain procedural
  obstruction (item a, the vocabulary gap) and a genuinely successful,
  hand-verified toy-level construction (parts 2-6), this session both
  closes the specific toy-level constructibility question left open by
  DEC-20260830-6f28e0/KN-OPEN-7f424d (yes, decks-2/3 decomposition can be
  built and verified at the toy level) and supplies the first concrete,
  checkable reason across all prior rounds to doubt that this particular
  construction strategy transfers to the real target -- without declaring
  the broader decks-2-4 decomposition question closed, per docs/inventor-
  protocol.md Section 4 and Section 7's standing prohibition on declaring
  a direction impossible.
