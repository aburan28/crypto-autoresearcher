external_sources_consulted:
  - id: resultant-and-gcd-degree-classical-facts
    description: >-
      Standard computer-algebra facts used in derivation-report.yaml
      part_8: (i) the resultant of two polynomials of degree m, n is a
      product over all m*n cross-pairs of roots (Res(f,g) = a^n b^m
      prod_(i,j) (alpha_i - beta_j)), so a resultant's vanishing is
      generically a joint, not independently-decomposable, function of
      the eliminated data; (ii) a GCD of several degree-B polynomials has
      degree at most B, not larger; (iii) eliminating several
      independently-varying auxiliary unknowns from a system of
      polynomial constraints generically multiplies degrees (Bezout-type
      growth) rather than bounding the result by the largest single input
      degree. Standard textbook material (e.g. von zur Gathen and
      Gerhard, Modern Computer Algebra, resultant and elimination
      chapters), the same lineage both prior rounds already cited for the
      Bezout-type growth fact.
    provenance: recalled
    provenance_caveat: >-
      Not independently retrieved or re-verified this session (no
      WebSearch/WebFetch performed, consistent with the prior round's own
      choice and for the same reason: this task is an internal derivation
      from already-frozen artifacts, not a literature trigger search).
      This is the same Bezout-elimination-degree-bound fact the prior
      round's own source-novelty-audit.yaml already flagged as recalled
      and as one of at least two plausible, unconfirmed explanations for
      r_R's declared degree; this session reuses that same caveat rather
      than treating the fact as newly established.

overlap_and_duplication_audit:
  against_EV_CRYPTO_002_dedup_list: >-
    This record's constructed candidate (G01_local, G23_local, Adm4) is
    not a renamed instance of any BATCH-002 forbidden payload or any
    P1553/P1513 duplicate-owner pattern in check_representation.py's
    DEDUP_SIGNATURES list: it supplies no oracle node (no supplied_input),
    no untyped macro, and does not match any of the D1-D3 named
    signatures, because it proposes only preprocessing-style compact
    generator objects and a label-set combination step, checked against
    the dedup list's exact kind sequences by inspection.
  against_DEC_20260830_6f28e0_and_TASK_20260830_e30c67: >-
    DEC-20260830-6f28e0 established that no decomposition for decks 2-4's
    fold-in is attempted anywhere in the eight frozen routes; it explicitly
    left open whether one COULD be constructed. This task is the named
    direct follow-up and does not restate that finding as its own; it
    goes further by actually attempting and verifying a construction, then
    reporting a differently-shaped result (a successful toy-level
    construction paired with two named transfer obstructions) rather than
    a simple extension of the prior absence-based finding.
  against_gate_framing_review: >-
    The prior gate-framing-review round's rejected dichotomy asserted
    r_R's non-freeness by definition of what a sought witness is. This
    task's part_8 argument is a different claim resting on a directly
    stated number (r_R's declared degree Theta(B^2)) and a classical
    degree-counting fact, not a definitional assertion about r_R's
    identity; the two arguments are not the same claim and this task does
    not repeat the rejected one, though both point toward the same
    free-versus-not-free distinction the amended gate already encodes.
  against_CAL_PASS_CREP_001: >-
    This task's constructed candidate achieves an online exponent
    comparable to CAL-PASS-CREP-001's own already-disclaimed toy-only
    result (Theta(B), well under the 5/4 cap) via a structurally similar
    mechanism (cheap, target-independent per-item lookups). This overlap
    is treated as informative, not concerning: it is precisely the
    evidence used in part_8 to argue that the toy model's own combinatorial
    ease is a general property of independent-per-item decompositions on
    this instance model, not an idiosyncrasy of CAL-PASS's specific
    dyadic-index design, strengthening rather than duplicating the
    existing CAL-PASS disclaimer.

