repair_contract:
  unitary: "U = sum_l |l><l| tensor T_A(l)"
  label_register:
    components: [address, sign]
    unchanged: true
    measured: false
    canonicalized: false
    phase_preserved: true
  per_label_block:
    qrom_lookups: 1
    selected_record: "A(l), derived once from the unchanged label"
    arithmetic_dispatch: exactly one generic core or one exceptional mux
    exceptional_flags: derived only from the single selected A(l)
    cleanup: performed inside the same label block
    unload: exact inverse using the same selected record
    second_application_for_equal_payloads: forbidden
  alias_semantics: >-
    Distinct labels are distinct direct-sum blocks even when their selected
    payload values are equal. Equal payloads are legal and never justify a
    second translation, cross-label iteration, label rewriting, or irreversible
    label canonicalization.
  allowed_gate_set: [X, CX, MCX]
  decomposition: >-
    Every negative control, comparison, qROM target toggle, exceptional mux,
    generic-core invocation, ancilla, and uncomputation must be explicit and
    mechanically countable. Any decomposition must preserve the stated
    label-block permutation exactly.
  clean_exit:
    - address and sign labels unchanged
    - relative amplitudes and phases unchanged
    - qROM payload targets zero
    - comparison flags zero
    - exceptional flags zero
    - mux and arithmetic work zero
    - no hidden n-bit register remains live

mandatory_alias_superposition_controls:
  positive:
    branches:
      - [2, 0]
      - [3, 1]
    equal_selected_payload: "+3A"
    expected_action: exactly one +3A translation per branch
  mirror_negative:
    branches:
      - [2, 1]
      - [3, 0]
    equal_selected_payload: "-3A"
    expected_action: exactly one -3A translation per branch
  assertions:
    - both distinct labels remain unchanged
    - branch amplitudes and relative phase remain unchanged
    - each branch receives exactly one signed translation
    - all qROM, comparison, exceptional, mux, and arithmetic work is zero
    - no cross-label interference or second application occurs
  known_false:
    id: KF-PAYLOAD-ROW-ITERATED
    construction: iterates over payload rows after label selection
    required_failure: equal-payload alias branches are translated twice

mandatory_positive_gates:
  exhaustive_code_space:
    tested: 4096
    required_failures: 0
  valid_code_space:
    tested: 224
    required_failures: 0
  exceptional_code_space:
    tested: 32
    required_failures: 0
  qrom:
    actual_load: required
    actual_use: required
    actual_inverse_unload_same_record: required
  cleanup: all declared work registers must be zero
  alias_superpositions: both mandatory controls must pass exactly
  implementation_controls:
    - payload-row-iterated known-false must double translate
    - no-op or Protocol-only backend must fail
    - classical label loop must fail coherent-action checks
    - missing unload must fail cleanup
    - irreversible label canonicalization must fail label/phase preservation
    - partial generic or exceptional arithmetic must fail exhaustive domains

resource_accounting:
  exact_required:
    - 272 MCX operations with 18 controls, or an explicit proved-equivalent decomposition
    - all comparison gate counts and control polarities
    - qROM load, use, and unload access counts
    - generic-core and exceptional-mux invocation counts
    - X, CX, and remaining MCX counts grouped by control arity
    - peak clean and dirty ancillae
    - per-register liveness intervals through cleanup
    - scalable symbolic liveness in n and w
    - proof that no hidden n-bit register is introduced or retained
  interpretation: >-
    Counts are correction-layer implementation facts. Preservation of a leading
    3n+O(log n) composition is admissible only if the independent J3 review
    accepts the complete decomposition and scalable-liveness derivation.

