        the blind quantity to a fresh independent task whose envelope permits
        separately enumerated non-evidentiary operating contracts while keeping
        exactly two scientific inputs and every original blind_from exclusion.
  claim_ceiling: >-
    Exact complete fixed/window affine translation on the stated secp256k1 code
    space, plus leading 3n+O(log n) preservation only if J3 accepts the full
    decomposition and scalable liveness. Exact 835, exact 6log, constant-factor
    improvement, speedup, attack, general-curve transfer, P1553, B71, novelty,
    supported status, and breakthrough are forbidden.
  scientific_transition: none
