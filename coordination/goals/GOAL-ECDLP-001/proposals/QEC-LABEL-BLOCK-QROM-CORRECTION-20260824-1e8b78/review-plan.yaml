review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-QEC-LABEL-BLOCK-QROM-1e8b78
  goal_id: GOAL-ECDLP-001
  batch_id: null
  packet_id: QEC-LABEL-BLOCK-QROM-CORRECTION-20260824-1e8b78
  recorded_at: "2026-08-24"
  coordinator_prior: >-
    Recasting the correction as a direct sum over unchanged address/sign labels
    and selecting exactly one A(l) record is likely to repair the predecessor's
    alias double-translation and unload-structure failures. The likely remaining
    break is that the concrete 272 18-control-MCX decomposition or comparison
    workspace hides an additional n-bit live register, or that exceptional mux
    cleanup does not remain in the same label block. This prior is recorded
    before any reviewer runs and is not evidence.
  claim_under_review: >-
    Whether the archived implementation realizes exact complete fixed/window
    affine translation on the explicitly tested secp256k1 code space with the
    direct-sum label semantics, exhaustive gates, cleanup, and alias controls
    declared in the packet. Preservation of leading 3n+O(log n) is within scope
    only if J3 accepts the full decomposition and scalable liveness. The review
    cannot establish exact 835 or 6log coefficients, a constant-factor
    improvement, practical speedup, an attack, a general-curve result, P1553,
    B71, novelty, supported status, breakthrough, or a scientific transition.
  joints:
    - joint: J1-label-block-semantics-exceptions-and-alias-controls
      assigned_to: TASK-20260824-cf794b
      role: reviewer
      attack_plan: >-
        Inspect the emitted circuit IR and upstream patch; trace the direct-sum
        action for unchanged address/sign labels; verify one coherent qROM lookup,
        one generic core or exceptional mux, same-record unload, and in-block
        cleanup; check ordinary and exceptional affine translations; independently
        exercise the positive (2,0)+(3,1) and mirror-negative (2,1)+(3,0) alias
        superpositions for unchanged labels, amplitudes, phases, one signed 3A
        translation, and zero work; and require the payload-row-iterated
        known-false implementation to double translate.
      expected_break: >-
        Equal payloads are still processed by payload row rather than label block,
        or exceptional flags and inverse unload do not use the single selected
        record within the unchanged label block.
    - joint: J2-deterministic-reproduction-exhaustive-domains-and-qrom-cleanup
      assigned_to: TASK-20260824-15217b
      role: validator
      attack_plan: >-
        Verify snapshot, source, tree, patch, command, raw-output, result, and
        receipt bindings; reproduce the sole deterministic implementation/control
        run at most once with zero scientific experiments and no producer rerun;
        independently check 4096 exhaustive, 224 valid, and 32 exceptional cases
        with zero failures; confirm actual qROM load/use/same-record inverse unload;
        and recompute final cleanliness of every declared work register.
      expected_break: >-
        Exhaustive-domain enumeration omits an alias or exceptional block, or the
        recorded qROM cleanup passes only because the loaded record, flag lifetime,
        or final work registers are not independently checked.
    - joint: J3-concrete-decomposition-scalable-liveness-and-proves-too-much
      assigned_to: TASK-20260824-a19a05
      role: red-team
      attack_plan: >-
        Reconstruct the concrete decomposition of the 272 18-control MCXs,
        comparisons, qROM accesses, generic and exceptional primitives, and all
        negative controls; derive live register widths as functions of n and w;
        search for hidden n-bit storage and omitted uncomputation or traffic;
        apply the acceptance argument to every known-false object, especially the
        payload-row iterator; and reject any transfer to leading 3n+O(log n) unless
        the full end-to-end decomposition and scalable-liveness proof preserves it.
      expected_break: >-
        The decomposed comparisons, qROM, or exceptional mux introduce a hidden
        n-bit register or omitted pass, so the implementation may be exact while
        the conditional leading 3n+O(log n) preservation does not follow.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - payload-row-iterated backend that double-translates equal-payload alias labels
      - no-op or Protocol-only backend with no reversible operations
      - run-time classical label loop substituted for coherent direct-sum controls
      - backend that omits same-record inverse qROM unload
      - backend that irreversibly canonicalizes equal-payload labels
      - partial backend missing a generic or exceptional affine-translation block
    failure_signature: >-
      The acceptance method must reject every known-false object for its declared
      structural reason, and the payload-row-iterated object must visibly double
      translate both equal-payload alias superpositions. Acceptance of any object
      invalidates the method regardless of producer results.
  blind_rederivation:
    required: true
    quantity: >-
      Independently derive U=sum_l |l><l| tensor T_A(l), label and phase
      preservation, exactly-one-use behavior under equal-payload aliases,
      same-record qROM cleanup, the positive and mirror-negative alias controls,
      the concrete symbolic cost relations including 272 18-control MCXs, and
      scalable liveness sufficient to detect any hidden n-bit register.
    assigned_to: TASK-20260824-5ec63f
    blind_from:
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-LABEL-BLOCK-QROM-CORRECTION-20260824-1e8b78/tasks/TASK-20260824-1e8b78
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-LABEL-BLOCK-QROM-CORRECTION-20260824-1e8b78/archives/TASK-20260824-9db64e/snapshot-receipt.json
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-LABEL-BLOCK-QROM-CORRECTION-20260824-1e8b78/review-plan.yaml
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-LABEL-BLOCK-QROM-CORRECTION-20260824-1e8b78/dispatch_queue.json
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-LABEL-BLOCK-QROM-CORRECTION-20260824-1e8b78/tasks/TASK-20260824-cf794b
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-LABEL-BLOCK-QROM-CORRECTION-20260824-1e8b78/tasks/TASK-20260824-15217b
      - coordination/goals/GOAL-ECDLP-001/proposals/QEC-LABEL-BLOCK-QROM-CORRECTION-20260824-1e8b78/tasks/TASK-20260824-a19a05
  procedure_deviations:
