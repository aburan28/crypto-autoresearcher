      affected_task: TASK-20260824-710a97
      replacement_task: TASK-20260824-5ec63f
      effect: none_scientific
      detail: >-
        The first blind run read exactly the two declared scientific inputs and
        no blind_from path, but also consulted a mandatory ambient role contract
        that its literal envelope prohibited. Its bytes are preserved as a
        procedure-deviation record and are not counted as the required blind
