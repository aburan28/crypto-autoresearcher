  what_was_wrong: >-
    The content-first ledger commit changes exactly the declared 23 paths and
    every archived blob hash matches, but its immutable message names only
    TASK-20260824-31c9f4, EV-ECDLP-7190c8, and DEC-20260824-84daef. It omits
    the five source task identifiers declared in archive.record_ids:
    TASK-20260824-cf794b, TASK-20260824-15217b,
    TASK-20260824-a19a05, TASK-20260824-710a97, and
    TASK-20260824-5ec63f. tools/research_dispatch.py therefore rejects the
    archive envelope even though its bytes, parent, reachability, and content
    hashes are correct.
  additional_hygiene_deviation: >-
    The staged diff check also reported one trailing blank line in the immutable
    J3 Markdown. The shell sequence did not stop on that nonzero check and
    created the commit. The reviewer byte is already receipt-bound and is not
    rewritten. This has no parsing, binding, or scientific effect, but the
    original ledger commit must not be described as having a clean staged-diff
    gate.
  why_not_repaired_by_rewrite: >-
    The commit is pushed and carries immutable review, evidence, decision, and
    receipt records. Amending or force-pushing would rewrite durable research
    history. The repository contract requires an additive correction and a
    forward superseding content-first binding instead.
  remedy: >-
    The commit containing this correction is a forward superseding archival
    metadata commit. Its message names TASK-20260824-31c9f4 and every declared
    archive.record_ids identifier. The queue will repoint only
    archive.commit_sha and archive.parent_sha to that reachable commit. Under
    binding_mode content_first, tools/research_dispatch.py verifies the exact
    hash-bound 23 artifacts in the tree while retaining the original
    cf35ed2f0 commit unchanged in ancestry.
  substantive_effect: >-
    NONE. No review artifact, evidence record, decision, receipt, hypothesis,
    experiment, goal, batch, or scientific status is changed. REVISE and every
    claim boundary remain exactly as recorded. No B71 admission, P1553 change,
    speedup, attack, knowledge promotion, or breakthrough is authorized.
  prevention: >-
    Before every future archive commit, mechanically require staged diff-check
    success and assert that the drafted message contains the archive task id
    plus every archive.record_ids value; stop the shell on either failure.
