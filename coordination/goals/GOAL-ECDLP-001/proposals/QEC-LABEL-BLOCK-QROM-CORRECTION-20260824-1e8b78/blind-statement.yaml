statement:
  label: "l = (address, sign)"
  label_register_unchanged: true
  unitary: "U = sum_l |l><l| tensor T_A(l)"
  selected_record: >-
    A single qROM lookup computes one record A(l) coherently from l. The same
    record controls exactly one generic translation core or exactly one
    exceptional mux, remains live through that use, and is unloaded by the
    exact inverse inside the same label block.
  equal_payload_rule: >-
    Distinct labels may select equal payload values. Equality of payload does
    not merge blocks, authorize label canonicalization, or authorize a second
    application of the translation.
  cleanup: >-
    Address and sign labels, branch amplitudes, and relative phases are
    preserved; qROM payload, comparison, exceptional, mux, arithmetic, and
    effective-control work registers return to zero in each label block.
  gate_basis: [X, CX, MCX]

required_derivation:
  - Prove the computational-basis action is a permutation and extends linearly to a unitary.
  - Derive the direct-sum decomposition over unchanged address/sign labels.
  - Prove that one load, one generic-core-or-exceptional-mux use, and the inverse unload apply exactly one T_A(l).
  - Prove that equal payloads across distinct labels do not create a second translation.
  - Prove cleanup within every label block and preservation of relative phase under label superposition.
  - Derive exact liveness intervals for qROM, comparison, exceptional, mux, and arithmetic work.
  - Derive symbolic X/CX/MCX, qROM, primitive, and ancilla accounting, including the stated 272 18-control MCX layer.
  - Determine the condition under which no hidden n-bit register appears and leading 3n+O(log n) is preserved.

mandatory_alias_controls:
  positive:
    state: "alpha|2,0,R> + beta|3,1,R>"
    equal_payload: "+3A"
    expected: "alpha|2,0,R+3A> + beta|3,1,R+3A>"
  mirror_negative:
    state: "alpha|2,1,R> + beta|3,0,R>"
    equal_payload: "-3A"
    expected: "alpha|2,1,R-3A> + beta|3,0,R-3A>"
  assertions:
    - labels unchanged
    - alpha and beta including relative phase unchanged
    - exactly one signed 3A translation per branch
    - all work registers zero

known_false_reasoning_controls:
  - payload-row iteration double-translates equal-payload alias labels
  - no-op or Protocol-only backend leaves nonidentity blocks unchanged
  - classical label iteration fails to define the coherent direct-sum permutation
  - missing inverse unload leaves qROM work correlated with labels
  - irreversible label canonicalization changes labels or destroys relative phase
  - partial generic or exceptional arithmetic fails at least one code-space block

counting_quantity:
  exact_layer:
    - 272 MCX operations with 18 controls or a proved explicit equivalent
    - comparisons with all control polarities
    - one qROM load and its exact inverse unload
    - exactly one generic core or exceptional mux per enabled label block
    - X/CX/remaining-MCX counts by arity
    - peak clean and dirty ancillae
  scalable_liveness: >-
    Give all live register widths as functions of n and w and prove whether any
    extra n-bit register is hidden by the description. The blind derivation may
    state conditions for leading 3n+O(log n), but may not validate producer code
    or assert that those conditions were met empirically.

claim_ceiling: >-
  Independent abstract derivation only. No producer validation, numeric 835 or
  6log coefficient, constant-factor improvement, speedup, attack, general-curve
  claim, P1553/B71 result, novelty, support, breakthrough, or scientific transition.
