  findings:
    - id: J3-FIXED-TARGET-BOUNDARY
      kind: scope_guard
      result: holds
      statement: >-
        Exactness at the original fixed target supplies q(0) only. An object may be
        exact at R and undefined, refusing, or adversarial at every R+[mt]P for
        t>0 while still satisfying the accepted fixed-target contract. The first
        missing premise is A5, joint cross-target complete-transcript exactness.
      producer_treatment: >-
        The theorem, search map, source audit, and claim ceiling all state that A5
        is new, mandatory, and not implied by the accepted fixed-target interface.
      effect: >-
        No transfer to the accepted fixed-target one-restriction interface or to
        the predecessor two-restriction decision is supported.
    - id: J3-JOINT-SUCCESS-BOUNDARY
      kind: probability_quantifier_guard
      result: holds
      statement: >-
        Marginal correctness for each shifted query cannot support the adaptive
        decoder. For h required calls, let a hidden outcome select one call index
        to fail. Each marginal succeeds with probability 1-1/h, while the joint
        success event is empty. The first missing premise is the single joint A5
        success event over the actual adaptive path.
      producer_treatment: >-
        The artifacts explicitly forbid replacing the joint transcript event with
        independent-target or marginal per-call success.
    - id: J3-STRICT-WRAP-BOUNDARY
      kind: boundary_counterexample
      result: holds_only_with_declared_strict_inequality
      statement: >-
        The strict N>4L+1 assumption is load-bearing and sharp for the claimed
        uniform one-switch transcript over all z in [-L,L] and t in [0,2L+1]. If
        N<=2L+1, [-L,L] covers every residue and q is identically true. If
        2L+1<N<=4L+1, choose z=L and t_star=N-2L. Then 2<=t_star<=2L+1,
        q(1)=false, but L+t_star=N-L is congruent to -L, so q(t_star)=true.
        At N=4L+1 this alias occurs at the declared false endpoint 2L+1.
        A linked prime-order instance is N=10009, m=8, L=4680, and
        t_star=649: q(1)=false while q(649)=true.
      producer_treatment: >-
        Every N<=4L+1 is excluded from the admitted theorem scope; no finite-stratum
        evidence or conclusion is drawn.
    - id: J3-ZERO-RESTRICTION-BOUNDARY
      kind: nearby_object_control
      result: holds
      statement: >-
        With no restricted deck the five-deck scalar sumset is the complete
        interval [-T,T], T=m+m^2+m^3+m^4+m^5. Since m>=B=N^(1/5), m^5>=N,
        this interval contains a representative of every residue modulo N. Every
        shifted membership answer is therefore true, there is no first-false
        boundary, and the decoder cannot start.
      producer_treatment: >-
        The claim requires one labelled F0 isolation and expressly preserves
        zero-restriction interfaces outside its conclusion.
    - id: J3-TYPED-INTERFACE-BOUNDARIES
      kind: scope_guard
      result: holds
      statement: >-
        Random-only promises do not cover the deterministic mixed-radix decks or
        their adaptive dyadic subsets. Coordinate-aware P1553 objects are not typed
        as ordinary-generic arbitrary labelled-deck objects. Target-conditioned
        advice violates target independence, and an extra discrete-log or coordinate
        oracle violates the generic interface and complete interaction ledger.
      producer_treatment: >-
        Each substitute is excluded explicitly; no reduction or transfer is claimed.
    - id: J3-PARETO-BOUNDARY
      kind: pareto_scope
      result: no_claim_to_validate
      statement: >-
        The producer records dominated_by as unverified_full_frontier and sota_delta
        as unknown_not_evaluated. It does not compare concrete constants, complete
        time-memory-data tradeoffs, serialization overhead, P1553 typing, or
        target-conditioned alternatives.
      effect: >-
        No Pareto, SOTA, attack, speedup, B71, closure, completion, or breakthrough
        inference may be composed from J3.
  objections:
    - id: J3-O1
      status: guarded_by_current_claim_ceiling
      objection: >-
        Any wording that drops the cross-target joint-success premise would make the
        fixed-target-only and marginal-success controls survive the argument.
    - id: J3-O2
      status: guarded_by_current_claim_ceiling
      objection: >-
        Any wording that weakens N>4L+1 without a separate circular-interval analysis
        would be false on the explicit wrap counterexamples.
    - id: J3-O3
      status: guarded_by_current_claim_ceiling
      objection: >-
        Any P1553, coordinate, random-deck, target-conditioned, extra-oracle, or
        zero-restriction transfer would lack a typed reduction at the first named
        missing premise.
    - id: J3-O4
      status: unresolved_outside_j3
      objection: >-
        J3 does not establish that the stronger cross-target object exists or that
        the parent-relayed MPZ bound applies to its aggregate adaptive transcript.
        Those are construction and J2 questions, respectively.
