  source_retrieval:
    title: Unifying Generic Group Models
    authors:
      - Ueli Maurer
      - Christopher Portmann
      - Jiamin Zhu
    archive: IACR Cryptology ePrint Archive
    eprint_id: "2020/996"
    landing_page: https://eprint.iacr.org/2020/996
    pdf_url: https://eprint.iacr.org/2020/996.pdf
    provenance: retrieved
    verified_by: TASK-20260827-341dab
    retrieved_at: "2026-08-27T03:03:09Z"
    http_status: 200
    last_modified: "2020-08-26T17:11:46Z"
    pdf_bytes: 503272
    pdf_sha256: bb606950ee7ccc6dfb909c592b0975641211bdadb85c8ed5dcbf8739f71ba794
    pdf_pages: 33
    pdf_version: "1.5"
    relevant_pages:
      - page: 11
        support: >-
          Section 5.1 and Definition 11 split preprocessing from one main phase,
          clear all group registers before the fresh value is exposed, define ell
          as the bit length of the advice string, and count main-phase interactions.
      - page: 16
        support: >-
          Theorem 3 gives, for prime N in the average-case preprocessing dense
          representation model with unlimited preprocessing and k main-phase
          interactions, success at most 3*ell*(k+1)^2/N for every ell-bit-advice
          solver.
      - page: 17
        support: >-
          Corollary 3 gives the same bound when dense representation and a shared
          random oracle are both available.
      - page: 33
        support: >-
          The proof of Corollary 3 fixes the random function, applies Theorem 3 to
          the resulting solver, and averages over that function without changing k.
    exact_bound: "success <= 3*ell*(k+1)^2/N"
    mnemonic_in_candidate: "O(ell*k^2/N)"
    mnemonic_status: asymptotically_correct_but_not_the_exact_source_statement
  mpz_model_fit:
    preprocessing_phase:
      status: holds_under_declared_premise
      mapping: >-
        The target-independent universal object is preprocessing state. Every bit
        needed after the fresh Q is exposed, including representations, duplicate
        entries, occurrence lineage, tables, random seeds, and cross-phase handle
        descriptions, must be in the single ell-bit advice string. Preprocessing
        group interactions are unlimited in Theorem 3 and therefore do not support
        a total preprocessing-time claim.
      hard_stop: >-
        Target-conditioned advice, an opaque group handle surviving the register
        clear, or advice exceeding ell bits leaves the claimed rectangle or model.
    main_phase:
      status: holds_under_declared_premise
      mapping: >-
        One invocation receives the single fresh Q, retains one fixed advice string
        and one main-phase random tape, adaptively isolates F0, constructs every
        public R_t from Q and P, executes every predicate internally through generic
        interactions, decodes, verifies, and outputs x_hat. MPZ permits later
        operations and queries to depend on earlier replies, so correlated adaptive
        targets do not by themselves create a new game or solver session.
      hard_stop: >-
        A membership predicate supplied as a new black-box oracle is not one of the
        MPZ operations or function queries. Applicability therefore requires the
        candidate's explicit no-extra-oracle premise and a complete accounting of
        the predicate implementation's ordinary generic interactions.
    success_event:
      status: holds_for_joint_event_only
      mapping: >-
        MPZ bounds the actual probability that the one composed solver outputs the
        fresh scalar. The candidate may condition its deterministic decoder on one
        jointly correct transcript only if the object's claimed constant success is
        itself the probability of that complete event.
      excluded_composition: >-
        Per-target marginal guarantees or separate fresh randomized solver sessions
        do not imply one transcript correct on all adaptively chosen targets. If
        separate subroutines are embedded into one MPZ main phase, their actual joint
        success and the sum of all their interactions are charged; k never resets.
    distribution:
      status: holds_under_A1
      mapping: >-
        Theorem 3 is average-case over uniform representation permutation and fresh
        scalar. Assumption A1 explicitly invokes the MPZ distribution. A per-instance
        or nonuniform-target conclusion would require an additional reduction and is
        not validated here.
  metric_recomputations:
    - metric: mpz_success_exponent
      inputs:
        B_definition: "B=N^(1/5)"
        N_in_B: "B^5"
        ell: "B^(9/4+o(1)) bits"
        k: "B^(5/4+o(1)) aggregate main interactions"
      exact_source_bound: "3*ell*(k+1)^2/N"
      recomputation: "9/4 + 2*(5/4) - 5 = -1/4"
      result_B: "B^(-1/4+o(1))"
      result_N: "N^(-1/20+o(1))"
      status: passed_conditional_on_model_fit_and_aggregate_bounds
    - metric: exact_top_level_call_cap
      definitions:
        r: "ceil(log2(B))"
        m: "2^r"
        L: "m+m^2+m^3+m^4"
      derivation: >-
        ceil(log2(2m))=r+1. For m>=2, 2*m^4 < 2L+2 < 4*m^4,
        so ceil(log2(2L+2))=4r+2. The total cap is exactly 5r+3.
      result: "O(log B) top-level predicates"
      status: passed
    - metric: public_target_construction_overhead
      derivation: >-
        The largest public shift scalar m(2L+1) is below 4m^5. Constructing each
        R_t from P by binary double-and-add therefore uses O(log N) generic group
        operations; across 4r+2 shifted predicates this is O((log N)^2).
        Constructing R and the final [x_hat]P verification each use O(log N)
        additional interactions. These terms are B^o(1).
      result: does_not_change_the_5_over_4_exponent
      status: passed
  control_checks:
    - id: J2-CONTROL-SINGLE-ADAPTIVE
      mutation: keep one advice string, one fresh Q, and one adaptive main transcript
      expected: admissible_as_one_MPZ_solver_execution
      observed: expected
      status: passed
    - id: J2-CONTROL-MARGINAL-ONLY
      mutation: retain only a separate marginal correctness guarantee for each target
      exact_counterexample: >-
        On random tape space {0,1}, let target 0 be answered correctly only on tape
        0 and target 1 only on tape 1. Each marginal success is 1/2 and the joint
        success is 0.
      expected: no_joint_transcript_success_can_be_inferred
      observed: expected
      status: passed
    - id: J2-CONTROL-SEPARATE-SESSIONS
      mutation: restart the randomized predicate solver and its interaction budget at every t
      expected: unsupported_composition_and_illegal_k_reset
      observed: expected
      status: passed
    - id: J2-CONTROL-TARGET-CONDITIONED-ADVICE
      mutation: allow preprocessing advice to depend on Q or t
      expected: leaves_MPZ_preprocessing_quantifier_order
      observed: expected
      status: passed
    - id: J2-CONTROL-OPAQUE-CROSS-PHASE-HANDLE
      mutation: preserve a group handle across the mandatory register clear without serializing it
      expected: leaves_declared_ell_bit_advice_model
      observed: expected
      status: passed
    - id: J2-CONTROL-EXTRA-PREDICATE-ORACLE
      mutation: treat exact membership as a free primitive rather than an implemented generic algorithm
      expected: MPZ_Theorem_3_does_not_apply
      observed: expected
      status: passed
  heuristic_validation_checks: []
  cost_model_checks:
    - item: preprocessing_advice
      charge: "ell bits total"
      included:
        - target-independent serialized object state
        - duplicate encodings and occurrence lineage
        - random seeds and replay state needed after Q arrives
        - every cross-phase handle description
      finding: holds_as_a_declared_bound_not_as_a_measured_serialization
    - item: predicate_interactions
      charge: >-
        Sum every ordinary generic operation and function query across all F0 and
        shifted calls. A per-call bound K(B) becomes O(K(B) log B); no call resets k.
      finding: holds_because_candidate_defines_k_as_aggregate
    - item: target_formation
      charge: "O((log N)^2) aggregate generic operations"
      finding: polylogarithmic_and_absorbed
    - item: handles_and_replay
      charge: >-
        Main-phase registers may persist inside the one transcript, but all operations
        creating or updating group handles and every replayed query are counted. No
        pre/main group handle survives except through ell-bit serialization.
      finding: holds_under_explicit_no_opaque_handle_and_no_free_replay_premises
    - item: decode
      charge: >-
        Classical scalar arithmetic is outside MPZ's generic-interaction count;
        group elements created during decoding remain charged.
      finding: correctly_separated
    - item: verification
      charge: "O(log N) additions plus the final comparison or representation query"
      finding: polylogarithmic_and_explicitly_required
    - item: preprocessing_time
      charge: unbounded_in_MPZ_Theorem_3
      finding: no_total_preprocessing_time_or_memory_claim_validated
  proof_architecture_checks:
    - check: interface_preservation
      result: holds_conditionally
      detail: >-
        The reduction remains in the MPZ model only when the membership procedures
        compile to ordinary generic interactions; an extra predicate oracle is an
        explicit stop.
    - check: quantifier_fidelity
      result: holds
      detail: >-
        The artifact states the required joint event before the adaptive target
        sequence and explicitly forbids exchanging it for per-target existential or
        marginal success.
    - check: resource_interface
      result: holds_as_universal_conditional_statement
      detail: >-
        Target shifting adds no preprocessing advice and only polylogarithmic online
        overhead. The artifact does not construct or measure an object satisfying
        the ell and aggregate-k hypotheses.
  findings:
    - id: J2-F1-MPZ-SOURCE
      severity: load_bearing
      result: holds
      statement: >-
        The retrieved MPZ source supports the asymptotic bound used by the candidate,
        with the exact statement 3*ell*(k+1)^2/N, ell measured in bits, prime N,
        average-case fresh scalar and representation, unlimited preprocessing, and
        one k-interaction main phase.
    - id: J2-F2-ADAPTIVE-TRANSCRIPT
      severity: load_bearing
      result: holds
      statement: >-
        One adaptive transcript over correlated public shifts is admissible as one
        MPZ main execution when all predicates are implemented internally, all
        generic interactions are aggregated, and advice is fixed before Q.
    - id: J2-F3-MARGINAL-COMPOSITION
      severity: load_bearing
      result: breaks
      statement: >-
        Replacing the joint complete-transcript event by marginal success for
        separately randomized target sessions breaks the reduction. Neither MPZ nor
        probability theory licenses that composition.
    - id: J2-F4-RECTANGLE
      severity: load_bearing
      result: holds_conditionally
      statement: >-
        The target-shift layer adds no advice and only polylogarithmic main-phase
        overhead, so it preserves ell=B^(9/4+o(1)) and k=B^(5/4+o(1)) if those are
        bounds on the fully serialized object and the complete aggregate transcript.
        Their satisfaction by any concrete object is not established here.
  scoped_joint_verdict: holds
  verdict: passed
  verdict_scope: >-
    J2 only. The conditional MPZ substitution and cross-target transcript mapping
    hold under the candidate's explicitly stronger joint-success, target-independent
    advice, no-extra-oracle, complete-serialization, and aggregate-k premises.
  limitations:
    - No universal object satisfying the stronger cross-target premise was constructed or shown to exist.
    - No byte-level serialization census independently establishes the absolute ell bound.
    - No internal predicate implementation or trace independently establishes the absolute aggregate k bound.
    - MPZ Theorem 3 bounds average-case extraction success and permits unlimited preprocessing; it is not a total-time lower bound.
    - The accepted fixed-target one-restriction interface does not inherit the new premise.
    - Separately randomized or merely marginally correct target sessions remain unsupported.
    - No P1553, coordinate, lower-bound, attack, speedup, SOTA, B71, closure, completion, or breakthrough conclusion was reviewed.
  procedure_deviations:
