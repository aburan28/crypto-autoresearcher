  claim_ceiling: >-
    Conditional obstruction candidate only for a universal exact arbitrary-deck
    generic Query2P1 object whose one-deck restriction transcript also remains
    correct across the declared correlated public target shifts, with
    target-independent serialized advice and complete MPZ accounting. It is not
    the previously reviewed fixed-target one-restriction theorem, a P1553 or
    coordinate-deck result, a generic ECDLP lower bound, an attack, speedup, SOTA
    movement, B71, closure, completion, or breakthrough.
