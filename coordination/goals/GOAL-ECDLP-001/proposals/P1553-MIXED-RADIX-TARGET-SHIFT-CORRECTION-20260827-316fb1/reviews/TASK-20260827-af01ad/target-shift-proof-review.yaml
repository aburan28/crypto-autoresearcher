  control_execution:
    exact_program_binding: >-
      The exact process argv was ["python3","-"]. The complete stdin program is
      recorded below. It emitted the structured values normalized into
      controls-results.json, exited 0, and emitted no stderr.
    python_stdin_bytes: 9764
    python_stdin_lines: 298
    python_stdin_sha256: 65a06fc4f2205cb995f1586ff5a9f75d166593753ef61764bf82f61ad490a17b
    python_stdin: |-
      import json
      import platform

      TASK_ID = "TASK-20260827-af01ad"
      PACKET_ID = "P1553-MIXED-RADIX-TARGET-SHIFT-CORRECTION-20260827-316fb1"

      def digits(m):
          return tuple(range(-m, 0)) + tuple(range(1, m + 1))

      def is_prime(n):
          if n < 2:
              return False
          if n % 2 == 0:
              return n == 2
          d = 3
          while d * d <= n:
              if n % d == 0:
                  return False
              d += 2
          return True

      def next_prime(n):
          candidate = n + 1
          while not is_prime(candidate):
              candidate += 1
          return candidate

      def previous_prime(n):
          candidate = n - 1
          while not is_prime(candidate):
              candidate -= 1
          return candidate

      def interval_sumset(m, max_k):
          current = {0}
          out = {}
          ds = digits(m)
          for j in range(max_k):
              weight = m ** j
              current = {a + d * weight for a in current for d in ds}
              out[j + 1] = current
          return out

      def modular_interval_member(value, N, L):
          residue = value % N
          return residue <= L or residue >= N - L

      def scaled_predicate(z, t, step, m, N, L):
          normalized_residue = ((m * z + step * t) * pow(m, -1, N)) % N
          return normalized_residue <= L or normalized_residue >= N - L

      def decode_threshold(z, m, N, L):
          lo = 0
          hi = 2 * L + 1
          queries = 0
          assert scaled_predicate(z, lo, m, m, N, L)
          assert not scaled_predicate(z, hi, m, m, N, L)
          while hi - lo > 1:
              mid = (lo + hi) // 2
              queries += 1
              if scaled_predicate(z, mid, m, m, N, L):
                  lo = mid
              else:
                  hi = mid
          return L - hi + 1, hi, queries

      sumset_rows = []
      threshold_rows = []
      wrong_shift_rows = []
      wrap_rows = []
      label_rows = []
      sign_rows = []
      total_residuals = 0
      total_endpoint_label_cases = 0
      total_final_rejection_checks = 0

      for m in range(2, 17):
          ds = digits(m)
          sets = interval_sumset(m, 4)
          sizes = {}
          for k in (2, 3, 4):
              radius = sum(m ** i for i in range(1, k + 1))
              actual = sets[k]
              assert len(actual) == 2 * radius + 1
              assert min(actual) == -radius and max(actual) == radius
              assert all(y in actual for y in range(-radius, radius + 1))
              sizes[f"A{k}"] = len(actual)
          L = m + m**2 + m**3 + m**4
          direct_four_decks = {0}
          for i in range(1, 5):
              direct_four_decks = {
                  a + d * (m ** i) for a in direct_four_decks for d in ds
              }
          expected_four_decks = {m * u for u in range(-L, L + 1)}
          assert direct_four_decks == expected_four_decks
          sumset_rows.append({
              "m": m,
              "A2_radius": m + m**2,
              "A2_size": sizes["A2"],
              "A3_radius": m + m**2 + m**3,
              "A3_size": sizes["A3"],
              "A4_radius_L": L,
              "A4_size": sizes["A4"],
              "four_deck_min": min(direct_four_decks),
              "four_deck_max": max(direct_four_decks),
              "four_deck_step": m,
              "holes": 0,
          })

          N = next_prime(4 * L + 1)
          assert N > 4 * L + 1 and N > m and is_prime(N)
          query_cap = (2 * L + 1).bit_length()
          max_queries = 0
          final_checks = 0
          rejection_checks = 0
          for z in range(-L, L + 1):
              tau_expected = L - z + 1
              assert scaled_predicate(z, 0, m, m, N, L)
              assert scaled_predicate(z, tau_expected - 1, m, m, N, L)
              assert not scaled_predicate(z, tau_expected, m, m, N, L)
              assert not scaled_predicate(z, 2 * L + 1, m, m, N, L)
              z_hat, tau, queries = decode_threshold(z, m, N, L)
              assert tau == tau_expected and z_hat == z and queries <= query_cap
              max_queries = max(max_queries, queries)
              c0 = 1 if (z + L) % 2 == 0 else -1
              C = 1 + L
              x = (m * z + c0 - C) % N
              x_hat = (m * z_hat + c0 - C) % N
              assert x_hat == x
              final_checks += 1
              x_bad = (m * (z_hat + 1) + c0 - C) % N
              assert x_bad != x
              rejection_checks += 1
          total_residuals += 2 * L + 1
          total_final_rejection_checks += rejection_checks

          endpoint_label_checks = 0
          for z in (-L, 0, L):
              z_hat, tau, _ = decode_threshold(z, m, N, L)
              assert tau == L - z + 1 and z_hat == z
              for c0 in ds:
                  C = 1 + L
                  x = (m * z + c0 - C) % N
                  x_hat = (m * z_hat + c0 - C) % N
                  assert x_hat == x
                  endpoint_label_checks += 1
          total_endpoint_label_cases += endpoint_label_checks
          threshold_rows.append({
              "m": m,
              "L": L,
              "N_large_prime": N,
              "N_minus_4L_plus_1": N - (4 * L + 1),
              "tested_all_z_count": 2 * L + 1,
              "query_cap": query_cap,
              "max_queries_observed": max_queries,
              "endpoint_first_false": {"z=-L": 2 * L + 1, "z=0": L + 1, "z=L": 1},
              "final_verification_accepts": final_checks,
              "one_step_decoder_errors_rejected": rejection_checks,
              "all_c0_signs_at_three_endpoints": endpoint_label_checks,
          })

          inv_m = pow(m, -1, N)
          first_mismatch = None
          transitions = 0
          previous = None
          for t in range(0, 2 * L + 2):
              observed = scaled_predicate(0, t, 1, m, N, L)
              expected = t <= L
              if first_mismatch is None and observed != expected:
                  first_mismatch = t
              if previous is not None and observed != previous:
                  transitions += 1
              previous = observed
          assert first_mismatch is not None
          sample_start = max(0, first_mismatch - 2)
          sample_end = min(2 * L + 1, first_mismatch + 2)
          wrong_shift_rows.append({
              "m": m,
              "N": N,
              "inverse_m_mod_N": inv_m,
              "first_mismatch_t_for_z0": first_mismatch,
              "boolean_transitions": transitions,
              "sample": [
                  {
                      "t": t,
                      "wrong_step_member": scaled_predicate(0, t, 1, m, N, L),
                      "claimed_m_step_threshold": t <= L,
                  }
                  for t in range(sample_start, sample_end + 1)
              ],
          })

          N_wrap = previous_prime(4 * L + 2)
          assert 2 * L + 1 < N_wrap <= 4 * L + 1
          assert is_prime(N_wrap) and N_wrap > m
          q0 = scaled_predicate(L, 0, m, m, N_wrap, L)
          q1 = scaled_predicate(L, 1, m, m, N_wrap, L)
          qend = scaled_predicate(L, 2 * L + 1, m, m, N_wrap, L)
          wrapped_residue = (3 * L + 1) % N_wrap
          wrapped_lift = wrapped_residue if wrapped_residue <= N_wrap // 2 else wrapped_residue - N_wrap
          assert q0 and not q1 and qend
          assert -L <= wrapped_lift <= L
          wrap_rows.append({
              "m": m,
              "L": L,
              "N_wrap_prime": N_wrap,
              "4L_plus_1_minus_N": 4 * L + 1 - N_wrap,
              "z": L,
              "q0": q0,
              "q1": q1,
              "q_2L_plus_1": qend,
              "wrapped_endpoint_lift": wrapped_lift,
              "threshold_destroyed": True,
          })

          encoding_to_c0 = {c % N: c for c in ds}
          assert len(encoding_to_c0) == len(ds)
          assert all(encoding_to_c0[c % N] == c for c in ds)
          label_rows.append({
              "m": m,
              "N_large_prime": N,
              "F0_occurrences": len(ds),
              "distinct_F0_group_values": len(encoding_to_c0),
              "encoding_equality_lookup_recovers_c0": True,
              "labels_required_for_recovery_on_admitted_stratum": False,
          })

          C = 1 + L
          x_q = (1 - C) % N
          z_q = 0
          x_minus_q = (-x_q) % N
          z_minus_q = 2 * (1 + m + m**2 + m**3)
          assert -L <= z_minus_q <= L
          assert (m * z_minus_q + 1 - C) % N == x_minus_q
          z_q_hat, _, _ = decode_threshold(z_q, m, N, L)
          z_minus_q_hat, _, _ = decode_threshold(z_minus_q, m, N, L)
          assert (m * z_q_hat + 1 - C) % N == x_q
          assert (m * z_minus_q_hat + 1 - C) % N == x_minus_q
          sign_rows.append({
              "m": m,
              "N": N,
              "Q_scalar": x_q,
              "Q_residual_z": z_q,
              "minus_Q_scalar": x_minus_q,
              "minus_Q_residual_z": z_minus_q,
              "both_final_verifications": True,
          })

      small_collision_m = 2
      small_collision_N = 3
      small_buckets = {}
      for c in digits(small_collision_m):
          small_buckets.setdefault(c % small_collision_N, []).append(c)
      small_ambiguous = {str(k): v for k, v in small_buckets.items() if len(v) > 1}
      assert small_ambiguous

      output = {
          "schema": "crypto.autoresearch.j1_controls.v1",
          "task_id": TASK_ID,
          "packet_id": PACKET_ID,
          "run_kind": "deterministic_validation_control_not_experiment",
          "python_version": platform.python_version(),
          "range": {"m_min": 2, "m_max": 16},
          "summary": {
              "core_interval_rows_passed": len(sumset_rows),
              "all_residuals_decoded_and_verified": total_residuals,
              "all_endpoint_c0_sign_cases_verified": total_endpoint_label_cases,
              "one_step_decoder_errors_rejected": total_final_rejection_checks,
              "wrong_shift_mutants_discriminated": len(wrong_shift_rows),
              "wrap_mutants_discriminated": len(wrap_rows),
              "Q_and_minus_Q_pairs_verified": len(sign_rows),
              "core_assertions_passed": True,
              "frozen_label_necessity_discriminator_passed_on_admitted_stratum": False,
          },
          "sumset_rows": sumset_rows,
          "no_wrap_decoder_rows": threshold_rows,
          "wrong_shift_rows": wrong_shift_rows,
          "wrap_rows": wrap_rows,
          "label_rows": label_rows,
          "excluded_small_stratum_label_collision": {
              "m": small_collision_m,
              "N": small_collision_N,
              "ambiguous_encoding_buckets": small_ambiguous,
              "labels_needed_there": True,
              "admitted_by_N_gt_4L_plus_1": False,
          },
          "sign_and_final_verification_rows": sign_rows,
          "control_verdicts": {
              "C1_exact_sumsets_m_2_through_16": "PASS",
              "C2_wrong_shift_step": "PASS",
              "C3_wrap_boundary": "PASS",
              "C6_remove_f0_labels": "FAIL_AS_ADMITTED_STRATUM_DISCRIMINATOR",
              "C9_sign_symmetry": "PASS",
              "C10_endpoint_residuals": "PASS",
              "decoder_and_final_verification": "PASS",
          },
      }
      print(json.dumps(output, indent=2, sort_keys=True))
