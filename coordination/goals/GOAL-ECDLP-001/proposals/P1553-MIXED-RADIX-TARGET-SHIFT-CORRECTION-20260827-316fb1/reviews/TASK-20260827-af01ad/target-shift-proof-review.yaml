  scoped_verdict:
    joint: J1-signed-sumset-threshold-and-decoder
    verdict: breaks
    boundary: >-
      The interval identity, modular no-wrap threshold, binary decoder, query cap,
      signed endpoints, Q/-Q symmetry, and final verification all hold under the
      stated large-stratum and exact shifted-predicate premises. J1 breaks only at
      the producer's broadened claim that occurrence labels are necessary on the
      admitted stratum, and at the corresponding broadened C6 discriminator. The
      frozen packet's narrower collision-specific C6 does pass, but only on a small
      stratum already excluded by N>4L+1.
    whole_claim_verdict: null
    scientific_state_verdict: null
  findings:
    - id: J1-F1-label-necessity-overstated
      classification: required_additive_correction
      joint_effect: breaks
      statement_under_review: >-
        proof-theorem.yaml C6 and excluded_assumptions assert that value-only F0
        isolation without an occurrence label leaves c0 undetermined and stops the
        decoder on the admitted stratum.
      counterargument: >-
        Let c,c' lie in D={-m,...,-1,1,...,m}. If their F0 group values agree,
        then N divides c-c'. The large-stratum premise gives N>4L+1>2m, while
        |c-c'|<=2m, so c=c'. Therefore all 2m F0 values are distinct. Because the
        solver constructed the F0 deck and exact generic encodings support equality,
        the isolated encoding uniquely indexes its known c0 even if the queried
        object does not separately return (d0,sigma0).
      machine_control: >-
        For every m=2,...,16 at the selected N>4L+1, the 2m F0 occurrences had 2m
        distinct group values and equality lookup recovered c0. At m=2,N=3 the
        buckets {-2,1} and {-1,2} collide, so the frozen collision-specific mutant
        does stop, but N=3 is outside the theorem's admitted stratum.
      impact: >-
        This does not falsify the positive boundary decoder with labelled inputs and
        does not weaken the mandatory cross-target premise. It falsifies only the
        producer's necessity claim/control broadening and makes the stated assumption
        set non-minimal.
      required_correction: >-
        In a fresh immutable successor, restore C6 to the frozen collision-specific
        wording or replace the excluded assumption by absence of any recoverable
        binding from the isolated F0 encoding/restriction path to c0. Do not edit the
        committed producer artifacts in place.
  analytic_checks:
    - id: J1-P1-two-digit-base
      verdict: holds
      derivation: >-
        Symmetry reduces to y>=0. For y=qm+r, 0<=r<m, the producer's cases give
        elements a,b in D with y=a+mb: y=0 uses (m,-1); r>0,q=0 uses (r-m,1);
        r>0,q>=1 uses (r,q); r=0,1<=q<=m-1 uses (-m,q+1); q=m uses
        (m,m-1); and q=m+1 uses (m,m). The triangle bound gives the exact endpoints.
    - id: J1-P2-interval-induction
      verdict: holds
      derivation: >-
        If A_{k-1}=[-S,S], S=m+...+m^(k-1), then A_k is the union of radius-S
        integer intervals centered at d*m^(k-1), d in D. Same-sign centers differ
        by m^(k-1)<=2S+1. The central centers differ by 2m^(k-1) and overlap because
        S>=m^(k-1). The extreme centers add m^k, giving exactly
        [-(S+m^k),S+m^k].
    - id: J1-P3-four-deck-identity
      verdict: holds
      derivation: >-
        F1+F2+F3+F4 factors as m(D+mD+m^2D+m^3D)=mA4, hence equals m[-L,L].
        Exact enumeration for m=2,...,16 found both endpoints and zero holes for A2,
        A3, A4, and the directly accumulated four-deck scalar set.
    - id: J1-P4-invertibility-and-unique-lift
      verdict: holds
      derivation: >-
        N>4L+1 and L>=m imply 0<m<N. Prime N therefore gives gcd(m,N)=1. If two
        z,z' in [-L,L] satisfy the residual congruence, then z=z' mod N and
        |z-z'|<=2L<N, so the lift is unique.
    - id: J1-P5-no-wrap-threshold
      verdict: holds
      derivation: >-
        At shift mt, exact membership is z+t congruent to u mod N for u in [-L,L].
        For t in [0,2L+1], z+t lies in [-L,3L+1]. Values at most L are members.
        Above L, every positive difference (z+t)-u is at most 4L+1<N, so no modular
        alias exists. Thus q(t)=1 iff t<=L-z. The strict boundary is necessary for
        this uniform proof: at m=8,L=4680,N=18719 (a compatible prime with
        N<=4L+1), z=L gives q(0)=1,q(1)=0,q(2L+1)=1.
    - id: J1-P6-threshold-decoder-and-query-cap
      verdict: holds
      derivation: >-
        The first false index is tau=L-z+1 in [1,2L+1], so z=L-tau+1. Binary search
        maintains a known-true low endpoint and mathematically known-false high
        endpoint. A midpoint query at least halves the gap; the conservative cap
        ceil(log2(2L+2)) holds. The deterministic control reached but never exceeded
        the cap for every one of 527959 residuals.
    - id: J1-P7-decoder-and-final-verification
      verdict: holds
      derivation: >-
        Substitution into x_hat=(m*z+c0-C) mod N recovers the residual congruence.
        The final equality [x_hat]P=Q accepts the correct residue and rejects an
        off-by-one z because m is nonzero modulo N. The control accepted all 527959
        correct decodes, rejected all 527959 one-step corruptions, covered every c0
        sign at z=-L,0,L (810 cases), and verified one Q/-Q pair for every m.
