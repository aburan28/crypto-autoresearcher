  schema: crypto.autoresearch.proof_theorem.v1
  id: P1553-MIXED-RADIX-TARGET-SHIFT-CORRECTION-20260827-316fb1
  packet_id: P1553-MIXED-RADIX-TARGET-SHIFT-CORRECTION-20260827-316fb1
  task_id: TASK-20260827-316fb1
  goal_id: GOAL-ECDLP-001
  recorded_at: "2026-08-27"
  basis: coordinator_relay_of_committed_frozen_packet
  opening_commit: e8f9f70c33d42bb89801fc1c90f8cf80f61764e2
  producer_role: idea-generator
  classification: non_batch_proof_correction
  disposition: correction_candidate_pending_independent_review
  result_count: 1
  novelty_status: unverified
  official_state_change: false
  scientific_transition: none
  claim_ceiling: "Conditional obstruction candidate only for a universal exact arbitrary-deck generic Query2P1 object whose one-deck restriction transcript also remains correct across the declared correlated public target shifts, with target-independent serialized advice and complete MPZ accounting. It is not the previously reviewed fixed-target one-restriction theorem, a P1553 or coordinate-deck result, a generic ECDLP lower bound, an attack, speedup, SOTA movement, B71, closure, completion, or breakthrough."
  exact_claim:
    statement: >-
      Let G=<P> be a prime-order generic group of order N, let Q=[x]P be fresh,
      let B=N^(1/5), m=2^ceil(log2(B)), C=sum_{i=0}^4 m^i, R=Q+[C]P,
      and let F_i contain the labelled occurrences
      (i,d,sigma,[sigma(d+1)m^i]P) for 0<=d<m and sigma in {+1,-1}.
      Assume a target-independent, exactly serialized universal object whose one-deck
      restriction interaction is correct not merely for the accepted fixed target,
      but for one complete successful adaptive online transcript at the correlated
      public targets R_t=R+[mt]P selected from the single fresh Q, while F_1,...,F_4
      remain full. On the sufficiently-large stratum N>4L+1, L=m+m^2+m^3+m^4,
      transcript success yields x by one F_0 isolation followed by at most
      ceil(log2(2L+2)) shifted predicates, decoding, and final group verification.
      Consequently, conditional on the parent-relayed MPZ preprocessing bound and
      after charging every generic interaction in the complete transcript, advice
      ell=B^(9/4+o(1)) and aggregate online interactions k=B^(5/4+o(1)) imply
      success at most B^(-1/4+o(1))=N^(-1/20+o(1)).
    status: conditional_obstruction_candidate
    fixed_target_boundary: >-
      The cross-target complete-transcript premise is new and mandatory. It is not
      supplied, implied, or retroactively attributed to the previously reviewed
      fixed-target one-restriction interface.
    success_event: >-
      One joint event: a single target-independent serialized object and its one
      complete adaptive online transcript are correct for the F_0 restriction path
      and every correlated shifted target actually selected on that path. Marginal
      per-call success probabilities are insufficient.
  parameters:
    group: "prime-order generic G=<P>"
    order: N
    fresh_target: "Q=[x]P"
    B: "N^(1/5)"
    m: "2^ceil(log2(B))"
    C: "sum_{i=0}^4 m^i"
    R: "Q+[C]P"
    L: "m+m^2+m^3+m^4"
    large_stratum: "N>4L+1"
    shift_range: "0<=t<=2L+1"
  decks:
    definition: "F_i={(i,d,sigma,[sigma(d+1)m^i]P): 0<=d<m, sigma in {+1,-1}}"
    occurrence_semantics: >-
      Occurrence labels (i,d,sigma) are retained even when two generic encodings or
      group values coincide. Isolating F_0 identifies the integer
      c_0=sigma_0(d_0+1), not only an encoding.
    normalized_digit_set: "D={-m,...,-1,1,...,m}"
    remaining_sumset: "F_1+F_2+F_3+F_4 = m[-L,L] at the scalar level"
  predicate_contract:
    accepted_component: >-
      A canonical dyadic restriction path may isolate one labelled occurrence of F_0.
    new_mandatory_premise: >-
      After F_0 is isolated, the same target-independent universal object and the
      same complete successful adaptive online transcript answer the membership
      predicate at each adaptively chosen correlated public target
      R_t=R+[mt]P, all derived from the single fresh Q, with F_1,...,F_4 full.
    target_sequence: >-
      The shifts are not independent fresh-target sessions. Each next t may depend
      on prior predicate answers, and correctness is required jointly across that
      adaptive sequence.
    exactness: >-
      A true answer has a complete labelled witness and a false answer is exact
      non-membership for the declared decks and target. No random-only,
      target-conditioned, coordinate, or extra-oracle substitute is admitted.
    serialization: >-
      Advice, all duplicate (encoding,j) entries, occurrence lineage, restrictions,
      queries, answers, and replay information are complete and target independent.
  mechanism:
    name: correlated_target_shift_boundary_lift
    steps:
      - >-
        Isolate a labelled e_0 in F_0 using canonical dyadic restrictions, retaining
        c_0=sigma_0(d_0+1).
      - >-
        Use the exact four-deck interval identity to write the successful original
        witness as x+C-c_0 congruent to mz (mod N) for z in [-L,L].
      - >-
        Query the same adaptive transcript at R_t=R+[mt]P. Exactness and invertibility
        of m reduce the answer to whether z+t modulo N has a representative in
        [-L,L].
      - >-
        Under N>4L+1, no wrap is possible over the queried range, so q(t)=1 exactly
        when t<=L-z. Binary search the first false answer tau=L-z+1 and set
        z=L-tau+1.
      - >-
        Decode x_hat=(mz+c_0-C) mod N and accept only if [x_hat]P=Q.
  lemmas:
    - name: two_digit_base_case
      statement: >-
        For m>=2 and D={-m,...,-1,1,...,m}, D+mD is the complete integer interval
        [-(m+m^2),m+m^2].
      proof: >-
        Symmetry reduces to 0<=y<=m^2+m. First, 0=m+m(-1). For 1<=y and
        y=qm+r with 0<=r<m: if 1<=r<m and q=0, take a=y-m in D and b=1;
        if 1<=r<m and q>=1, take a=r and b=q, where q<=m. If r=0 and
        1<=q<=m-1, take a=-m and b=q+1. If r=0 and q=m, take a=m and
        b=m-1; if q=m+1, take a=m and b=m. Every displayed a,b lies in D,
        proving coverage without enumeration. The triangle bound proves no value
        outside the stated interval occurs.
    - name: interval_induction
      statement: >-
        For A_k=D+mD+...+m^(k-1)D and every k>=2,
        A_k=[-(m+m^2+...+m^k),m+m^2+...+m^k].
      proof: >-
        The base k=2 is the preceding lemma. If A_{k-1}=[-S,S] with
        S=m+...+m^(k-1), then A_k is the union, over d in D, of integer
        intervals [d m^(k-1)-S,d m^(k-1)+S]. Adjacent same-sign centers differ
        by m^(k-1)<=2S+1, so those intervals overlap. The intervals centered at
        -m^(k-1) and +m^(k-1) also overlap because S-m^(k-1)=m+...+m^(k-2)>=0.
        The two extreme endpoints are plus or minus (S+m^k). Thus the union is
        exactly the stated interval.
    - name: four_deck_interval
      statement: "F_1+F_2+F_3+F_4=m[-L,L], where L=m+m^2+m^3+m^4."
      proof: >-
        Factoring m from the scalar contributions gives
        m(D+mD+m^2D+m^3D)=mA_4; apply interval induction with k=4.
    - name: invertibility_on_large_stratum
      statement: "N>4L+1 implies m<N and gcd(m,N)=1."
      proof: >-
        L>=m>=1, hence N>4L+1>m. Because N is prime and 0<m<N, N does not
        divide m, so gcd(m,N)=1. Division by m modulo N is therefore valid only
        after this sufficiently-large-stratum argument.
    - name: witness_residual
      statement: >-
        A successful labelled witness with isolated c_0 gives
        x+C-c_0 congruent to mz (mod N) for a unique z in [-L,L].
      proof: >-
        The four-deck interval supplies existence. If z,z' in [-L,L] give the same
        congruence, invertibility of m gives z congruent to z' mod N. But
        |z-z'|<=2L<N under N>4L+1, hence z=z'.
    - name: no_wrap_monotone_boundary
      statement: >-
        For 0<=t<=2L+1, q(t)=1 if and only if t<=L-z; in particular q(0)=1 and
        q(2L+1)=0.
      proof: >-
        Exact shifted membership is equivalent to z+t congruent to u (mod N) for
        some u in [-L,L], because m is invertible. Since z>=-L and t>=0,
        z+t>=-L. If z+t<=L, choose u=z+t. Otherwise L<z+t<=3L+1. For every
        u in [-L,L], 0<(z+t)-u<=4L+1<N, so the difference cannot be a nonzero
        multiple of N. This proves the equivalence. The original witness proves
        q(0)=1; z+2L+1>=L+1 proves q(2L+1)=0.
    - name: threshold_decoder
      statement: >-
        The first false index tau determines z=L-tau+1 and can be found with at
        most ceil(log2(2L+2)) shifted predicate calls.
      proof: >-
        The previous lemma gives tau=L-z+1 in {1,...,2L+1}. Binary search the
        monotone Boolean sequence on {0,...,2L+1}, using the proved true and false
        endpoints as invariants. Its candidate interval is halved per queried
        midpoint, so the conservative bound is ceil(log2(2L+2)). The displayed
        identity then recovers z. If an exact fixed-length transcript is required,
        repeat the already proved q(0) query after recovery until that conservative
        cap is reached; these calls remain charged.
    - name: final_verification
      statement: >-
        x_hat=(mz+c_0-C) mod N is the only accepted output, and only after
        [x_hat]P=Q.
      proof: >-
        The witness congruence gives x_hat congruent to x mod N. The explicit group
        equality rejects any transcript, decoder, or arithmetic failure.
  proof_decomposition:
    - obligation: P1_exact_digit_sumset
      responsibility: Prove the base case constructively and the interval induction.
      depends_on: []
    - obligation: P2_labelled_isolation
      responsibility: Preserve the F_0 occurrence label and the exact integer c_0.
      depends_on: []
    - obligation: P3_modular_preconditions
      responsibility: Establish m<N, gcd(m,N)=1, and uniqueness before division.
      depends_on: [P1_exact_digit_sumset]
    - obligation: P4_correlated_transcript
      responsibility: State and verify joint exactness across adaptively selected R_t.
      depends_on: [P2_labelled_isolation]
    - obligation: P5_no_wrap_boundary
      responsibility: Prove q(t)'s threshold including both endpoints.
      depends_on: [P1_exact_digit_sumset, P3_modular_preconditions, P4_correlated_transcript]
    - obligation: P6_decoder_and_verification
      responsibility: Recover tau, z, and x_hat and perform the final group check.
      depends_on: [P5_no_wrap_boundary]
    - obligation: P7_complete_cost_and_probability
      responsibility: Aggregate all interactions and apply only a retrieved and verified MPZ statement.
      depends_on: [P4_correlated_transcript, P6_decoder_and_verification]
  resource_ledger:
    preprocessing_advice:
      symbol: ell
      charged_bound: "B^(9/4+o(1))"
      requirements:
        - target-independent serialized advice
        - every duplicate encoding and occurrence lineage
        - construction and storage interactions
    online_interactions:
      symbol: k
      charged_bound: "B^(5/4+o(1))"
      aggregation_rule: >-
        k is the total over the one adaptive transcript, including F_0 restriction,
        every shifted predicate's internals, target construction, replay, decoding
        interactions, and final verification. No per-call reset is allowed.
    top_level_predicate_calls:
      f0_isolation_cap: "ceil(log2(2m))"
      shifted_cap: "ceil(log2(2L+2))"
      charged_total: "ceil(log2(2m))+ceil(log2(2L+2))"
      accounting: >-
        These caps are charged in full; optional padding with already established
        true restrictions/predicates makes the charged transcript length exact.
        Polylogarithms are absorbed only after all generic interactions are summed.
    decode_and_verify:
      charged: true
      operations:
        - construct every R_t from R and [mt]P
        - recover threshold and z
        - compute x_hat
        - compute and compare [x_hat]P with Q
    conditional_mpz_substitution:
      source_status: parent_relay_pending_independent_retrieval
      form_to_verify: "success <= O(ell*k^2/N) in the applicable preprocessing generic model"
      substitution: "B^(9/4+o(1))*B^(5/2+o(1))/B^5 = B^(-1/4+o(1))"
      N_form: "N^(-1/20+o(1))"
      caution: >-
        The arithmetic is audited here, but applicability and the exact theorem
        statement require independent retrieval before any claim promotion.
  assumptions:
    - id: A1
      statement: G is a prime-order generic group and Q=[x]P is fresh under the MPZ distribution.
    - id: A2
      statement: N>4L+1; smaller N is excluded or directly solved and supplies no evidence.
    - id: A3
      statement: The universal object's advice is target independent and completely serialized.
    - id: A4
      statement: F_0 restrictions retain every labelled occurrence and its integer c_0.
    - id: A5
      statement: >-
        One complete successful adaptive transcript is jointly exact at all correlated
        public shifts R_t selected from the single Q; fixed-target exactness alone
        does not imply this assumption.
    - id: A6
      statement: False answers are exact non-membership, not failure to find a witness.
    - id: A7
      statement: The total ell and k include all construction, query, replay, decode, and verification interactions.
    - id: A8
      statement: The parent-relayed MPZ bound has the stated form and applies to this fully serialized preprocessing interface.
  excluded_assumptions:
    - independent fresh-target sessions for different t
    - multiplication of marginal per-call success probabilities
    - target-conditioned preprocessing
    - random-only correctness
    - coordinate-deck or P1553 transfer
    - unrecorded extra oracle or free replay
    - uniqueness without the N>4L+1 and gcd(m,N)=1 proof
    - value-only F_0 isolation without occurrence labels
  controls:
    - id: C1_exact_sumsets_m_2_through_16
      test: Independently compare the algebraic interval identity for every m from 2 through 16.
      expected_discriminator: Any hole falsifies P1 and the candidate.
      status: required_not_executed_by_idea_generator
    - id: C2_wrong_shift_step
      test: Replace R_t=R+[mt]P by R+[t]P.
      expected_discriminator: Division no longer yields z+t, so the claimed threshold decoder must fail.
      status: analytically_discriminated
    - id: C3_wrap_boundary
      test: Use N<=4L+1.
      expected_discriminator: Values above L may wrap into [-L,L], destroying monotonicity.
      status: analytically_discriminated
    - id: C4_remove_cross_target_correctness
      test: Retain only accepted fixed-target correctness.
      expected_discriminator: Shifted answers are unsupported; the theorem cannot start.
      status: analytically_discriminated
    - id: C5_marginal_success_only
      test: Give each shift a separate marginal guarantee with no joint transcript event.
      expected_discriminator: Adaptive binary-search success cannot be inferred.
      status: analytically_discriminated
    - id: C6_remove_f0_labels
      test: Return only the isolated encoding, not (d_0,sigma_0).
      expected_discriminator: c_0 and therefore x_hat are not determined.
      status: analytically_discriminated
    - id: C7_zero_restricted_decks
      test: Leave all five decks full.
      expected_discriminator: The full five-deck sum covers every residue in the intended regime and supplies no target-shift boundary.
      status: required_nearby_object_control
    - id: C8_interface_substitutes
      test: Substitute random-only, coordinate-only, target-conditioned, or extra-oracle access.
      expected_discriminator: The candidate stops because it is no longer the declared generic universal object.
      status: analytically_discriminated
    - id: C9_sign_symmetry
      test: Repeat the transcript reasoning for Q and -Q.
      expected_discriminator: Any asymmetric success or accounting reveals a hidden sign convention.
      status: required_not_executed_by_idea_generator
    - id: C10_endpoint_residuals
      test: Check z=-L, z=0, and z=L.
      expected_discriminator: Thresholds must be 2L+1, L+1, and 1 respectively.
      status: analytically_verified_from_formula
  falsification:
    theorem_falsifiers:
      - A counterexample to D+mD being the stated full interval for any m>=2.
      - Two distinct z in [-L,L] producing the same complete q transcript under N>4L+1.
      - A shifted query sequence that is permitted by the premise but not jointly correct.
      - A missing generic interaction that changes the ell or k exponent.
      - Failure of the retrieved MPZ theorem to apply to the declared preprocessing/transcript model.
    interpretation_falsifiers:
      - Evidence that the accepted fixed-target theorem already entailed cross-target adaptive correctness.
      - Any use of independent-target or marginal success as though it were the joint event.
      - Any claimed P1553 or coordinate transfer without a separate typed construction.
  scope:
    admitted: >-
      An elementary conditional reduction on the sufficiently-large ordinary-generic
      stratum, for the exact signed mixed-radix decks and the explicitly stronger
      cross-target complete-transcript interface.
    excluded:
      - finite small N and every N<=4L+1, except as direct-solvable excluded strata
      - the accepted fixed-target one-restriction interface by itself
      - P1553, coordinate decks, B71, attacks, speedups, SOTA, lower bounds, closure, completion, breakthroughs
    transfer_status: unverified
  pareto:
    dominated_by: unverified_full_frontier
    sota_delta: unknown_not_evaluated
    checked_axes:
      time: conditional_asymptotic_accounting_only
      memory: conditional_asymptotic_accounting_only
      data_queries: aggregate_transcript_accounting_required
    unchecked_axes:
      - concrete constants
      - serialization overhead constants
      - complete literature frontier
      - coordinate or P1553 transfer
      - target-conditioned alternatives
    honesty: No Pareto or SOTA conclusion is drawn.
  conclusion:
    result: correction_candidate_pending_independent_review
    text: >-
      The exact four-deck interval has a monotone boundary under public shifts by m,
      and that boundary conditionally recovers the residual scalar in logarithmically
      many top-level calls. The result depends load-bearingly on a new joint
      cross-target complete-transcript premise. It neither strengthens the already
      accepted fixed-target interface nor establishes such an object exists.
  references:
