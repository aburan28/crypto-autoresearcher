  novelty_status: unverified
  official_state_change: false
  scientific_transition: none
  claim_ceiling: "Conditional obstruction candidate only for a universal exact arbitrary-deck generic Query2P1 object whose one-deck restriction transcript also remains correct across the declared correlated public target shifts, with target-independent serialized advice and complete MPZ accounting. It is not the previously reviewed fixed-target one-restriction theorem, a P1553 or coordinate-deck result, a generic ECDLP lower bound, an attack, speedup, SOTA movement, B71, closure, completion, or breakthrough."
  target_claim:
    statement: >-
      A new cross-target exactness premise turns the one-restriction four-deck
      residual interval into a monotone shifted-membership boundary and hence a
      conditional ordinary-generic DLP decoder with the declared complete costs.
    claim_ceiling: "Conditional obstruction candidate only for a universal exact arbitrary-deck generic Query2P1 object whose one-deck restriction transcript also remains correct across the declared correlated public target shifts, with target-independent serialized advice and complete MPZ accounting. It is not the previously reviewed fixed-target one-restriction theorem, a P1553 or coordinate-deck result, a generic ECDLP lower bound, an attack, speedup, SOTA movement, B71, closure, completion, or breakthrough."
    novelty_status: unverified
  exact_baseline_reproduction:
    baseline: >-
      The reviewed predecessor isolates F_0 and F_1 at one fixed target. The three
      remaining decks form an exact interval of length m^3, yielding the accepted
      conditional fixed-target theorem and MPZ accounting.
    reproduced_boundary: >-
      With only F_0 isolated, the predecessor leaves four signed decks and a residual
      interval m[-L,L]. Its accepted interface gives no answers at R+[mt]P and leaves
      the one-restriction case open.
    changed_joint: >-
      This candidate adds one mandatory joint: the same target-independent object
      and one successful adaptive transcript remain exactly correct across all
      correlated public shifts chosen from the single fresh Q.
    status: reproduced_from_parent_relay_not_independently_opened
  observation_collision_search:
    observation: "The complete Boolean transcript q(t) for adaptively selected t in [0,2L+1]."
    collision_question: >-
      Can two distinct z,z' in [-L,L] give identical answers for every possible
      boundary-search transcript under N>4L+1?
    derivation: >-
      No. q_z(t)=1 iff t<=L-z, so its first false index is tau_z=L-z+1.
      Equality of complete transcripts forces tau_z=tau_z' and therefore z=z'.
    adversarial_controls:
      - Under N<=4L+1, wrap may create non-threshold behavior and the proof stops.
      - With shift step 1 rather than m, the normalized residual does not change by t.
      - With marginal rather than joint correctness, an identical-looking transcript is not guaranteed to be valid.
    status: no_collision_under_declared_premises
  quantifier_order_audit:
    formal_order: >-
      For every sufficiently large prime N satisfying N>4L+1, for every fresh x
      and Q=[x]P, and for every target-independent serialized object satisfying the
      declared universal exactness contract, if there exists one complete successful
      adaptive transcript for the F_0 path and its correlated shifts, then there
      exists a deterministic decoder which, from that transcript, returns the unique
      x_hat verified by [x_hat]P=Q.
    probability_order: >-
      Probability is taken over the fresh MPZ instance and any declared object or
      transcript randomness before observing success. The theorem conditions on one
      joint successful transcript; it does not choose a new success event after each t.
    forbidden_swap: >-
      It is invalid to assert that because for every t there exists a separately
      successful fixed-target run, there exists one run successful for all adaptively
      selected t.
    status: explicit
  constructive_transform:
    name: boundary_lift
    input: >-
      A labelled isolated F_0 occurrence, one jointly correct adaptive shifted-target
      transcript, and complete target-independent serialized advice.
    output: "x_hat in Z_N with explicit verification [x_hat]P=Q"
    construction:
      - derive the unique z in [-L,L] represented by the original witness
      - binary-search q(t) at R+[mt]P for the first false index
      - set z=L-tau+1
      - set x_hat=(mz+c_0-C) mod N
      - verify [x_hat]P=Q
    interaction_bound: "charged cap ceil(log2(2m))+ceil(log2(2L+2)), with all internals aggregated"
    status: algebraically_specified_not_executed
  method_ceiling:
    ceiling: >-
      The boundary lift proves only that an already-existing cross-target exact object
      would expose z. It does not construct that object, extend fixed-target exactness,
      establish a lower bound for arbitrary generic algorithms, or type into P1553.
    nearby_fixed_target_only_object:
      construction: >-
        An object is correct for the original R and the selected F_0 restriction but
        has no contract at any R+[mt]P with t>0.
      known_false_conclusion: >-
        The target-shift decoder cannot claim any q(t) beyond q(0), so no boundary or
        residual recovery follows.
      purpose: proves_too_much_control
    zero_restriction_control:
      construction: Leave all five decks full.
      known_false_conclusion: >-
        In the intended regime the full scalar sum covers all residues, so shifted
        membership has no informative boundary even if exact.
      purpose: nearby_object_control
    status: ceiling_explicit
  proof_obligations:
    - id: O1
      statement: Constructively prove D+mD=[-(m+m^2),m+m^2] without enumeration.
      dependency: []
      falsifier: one uncovered integer or one out-of-range representation
    - id: O2
      statement: Inductively prove A_k=[-(m+...+m^k),m+...+m^k] and the four-deck identity.
      dependency: [O1]
      falsifier: a gap between shifted induction intervals
    - id: O3
      statement: Retain the F_0 occurrence label and c_0 through isolation.
      dependency: []
      falsifier: value-only output unable to distinguish occurrence lineage
    - id: O4
      statement: Prove m<N and gcd(m,N)=1 from N>4L+1 before modular division.
      dependency: [O2]
      falsifier: any admitted N for which m is noninvertible
    - id: O5
      statement: State joint adaptive cross-target transcript exactness as a new premise.
      dependency: [O3]
      falsifier: reliance on independent or marginal fixed-target runs
    - id: O6
      statement: Prove q(t)=1 iff t<=L-z, including q(0)=1 and q(2L+1)=0.
      dependency: [O2, O4, O5]
      falsifier: modular wrap or an endpoint mismatch
    - id: O7
      statement: Prove the conservative shifted-query cap and exact decoder.
      dependency: [O6]
      falsifier: two residuals with one transcript or an off-by-one threshold
    - id: O8
      statement: Charge all generic interactions and independently verify MPZ applicability.
      dependency: [O5, O7]
      falsifier: an omitted interaction or inapplicable preprocessing theorem
  controls:
    exact_sumsets:
      domain: "m=2,...,16"
      required: true
      execution_status: not_executed_by_idea_generator
    wrong_shift_step:
      value: 1
      expected: normalized boundary relation fails
    wrap:
      condition: "N<=4L+1"
      expected: monotonicity is not guaranteed
    fixed_target_only:
      remove: cross-target complete-transcript correctness
      expected: no shifted predicate is supported
    marginal_only:
      remove: joint adaptive success event
      expected: decoder success cannot be composed
    labels_removed:
      remove: F_0 occurrence labels
      expected: c_0 and x_hat are undetermined
    zero_restricted_decks:
      expected: every residue covered and no boundary
    interface_stops:
      - random-only
      - coordinate-only
      - target-conditioned
      - extra-oracle
    sign_symmetry:
      instances: [Q, "-Q"]
      expected: identical accounting and sign-correct decoding
    endpoints:
      cases:
        - z: "-L"
          first_false: "2L+1"
        - z: 0
          first_false: "L+1"
        - z: L
          first_false: 1
  review_plan:
