sources_verified_this_session:
  - ref: 'knowledge/techniques/KN-TECH-002.md'
    claim: 'S_n has degree exactly 2^(n-2) in each variable; S_3 has degree exactly 2 in each variable, independent of B.'
    provenance: kb
    load_bearing: true
    verified_by: direct read this session
  - ref: 'knowledge/techniques/KN-TECH-003.md'
    claim: 'Point-decomposition index calculus: for prime fields, no good structured factor base is known; decomposition probability and Groebner cost make it uncompetitive with rho.'
    provenance: kb
    load_bearing: true
    verified_by: direct read this session
    note: |-
      This is the corpus's own existing statement of exactly why a cheap
      DECOMPOSITION-TEST is not, by itself, an ECDLP break -- it is the
      decomposition PROBABILITY, not the test cost, that is the known
      obstruction for prime fields. This session's finding is scoped
      entirely to the test-cost side (matching H-CREP-001's own explicit
      disclaimer that relation density is a separate, unproved, not-granted
      assumption) and does not contradict or reopen KN-TECH-003's claim.
  - ref: 'web search: Semaev summation polynomial S3 decomposition factor base solve quadratic membership test index calculus elliptic curve'
    claim: |-
      Point decomposition via Semaev polynomials is standard practice
      (Semaev 2004 lineage); the m=2 case (S_3) is the special low-degree
      case where the decomposition test is solvable directly, versus the
      general m>=3 case requiring Groebner basis methods over a
      multivariate system.
    provenance: retrieved
    load_bearing: true
    urls:
      - https://link.springer.com/content/pdf/10.1007/s00145-011-9116-z.pdf
      - https://eprint.iacr.org/2011/020.pdf
      - https://www.degruyterbrill.com/document/doi/10.1515/jmc-2019-0029/html
    limitation: |-
      Abstracts/summaries only were read via the search tool, not full text
      of any single paper; the specific "solve the quadratic in x2 given x1
      and the target, then test factor-base membership" procedure for the
      m=2 case was not found spelled out verbatim in the retrieved snippets,
      though it follows immediately and elementarily from S_3's degree-2
      structure (already independently confirmed via KN-TECH-002) and from
      the general point-decomposition framework these sources describe. The
      procedure itself is therefore classified recalled (elementary
      consequence of an established fact) rather than retrieved as a
      verbatim citation.

