novelty_status_assignment: adaptation
novelty_status_reasoning: |-
  The core mechanism -- for one side of a two-list decomposition search,
  analytically solve a fixed-low-degree relation for the partner variable
  (via the quadratic formula) instead of enumerating and testing candidates,
  then check factor-base membership by hashing -- is a KNOWN, standard
  technique in Semaev-polynomial-based point-decomposition search (KN-TECH-002,
  KN-TECH-003, and the retrieved web corroboration above); it is not being
  claimed as a new cryptanalytic idea. What this session contributes is the
  APPLICATION of that known technique to a question it had not been applied
  to in this chain: recognizing that "materialize r_R then compute
  gcd(g_I,r_R)" is exactly equivalent, via the resultant root-product
  identity, to "run the standard 2-term decomposition test against the
  candidate label set," and then deriving the resulting exponent (Theta(B^3)
  two-pairs, Theta(B^2) one-pair) as new, previously-unrecorded upper bounds
  for this specific H-CREP-001 construction-cost question. Honest label:
  adaptation, not a novel algorithmic idea, and not verified against the
  full external literature (only abstracts/summaries retrieved).

