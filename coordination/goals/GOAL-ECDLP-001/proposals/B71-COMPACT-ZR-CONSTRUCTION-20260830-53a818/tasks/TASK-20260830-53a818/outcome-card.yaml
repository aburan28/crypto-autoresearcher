disposition_statement: |-
  After genuinely attempting all three named strategy families under both
  candidate readings (derivation-report.yaml), no construction reaching
  H-CREP-001's declared caps (fresh_target_online_exponent_cap_in_B: 1.25,
  preprocessing_exponent_cap_in_B: 2.25) was found under either reading.
  This is an honest report of what was tried and why none reached cap. It
  is explicitly NOT framed as an impossibility claim: no derivation was
  produced showing that no within-cap construction CAN exist, only that
  the constructions actually attempted (including a genuinely improved one)
  do not reach it. Per this task's own instruction, the distinction between
  "tried and failed" (this outcome) and "proved impossible" (which would
  require a genuine derivation with a proves-too-much control, not
  attempted or claimed here) is maintained throughout.

what_was_tried:
  - strategy: point_evaluation_without_expansion
    result: |-
      Genuine derivation via the resultant root-product identity, combined
      with a meet-in-the-middle decomposition exploiting Semaev's S_3 having
      fixed (B-independent) degree 2. Two-pairs reading: Theta(B^3) online
      (whole target set), improving on naive Theta(B^4) materialization by
      one full exponent. One-pair reading: Theta(B^2) online, matching
      naive materialization's own exponent but genuinely avoiding ever
      writing r_R''s coefficient vector.
  - strategy: structure_exploiting_gcd_via_gI_roots
    result: |-
      Found to collapse into the point-evaluation strategy: g_I's roots
      being explicit is exactly the precondition enabling that strategy, not
      an independently different method. No separate cost figure obtained.
  - strategy: deferred_materialization_of_larger_operand
    result: |-
      Shown via the Chinese Remainder Theorem (g_I squarefree, degree B) to
      carry the same information as point-evaluation's target; the
      genuinely different "reduce modulo g_I inside each elimination stage"
      variant was checked explicitly and found to cost no less than the
      point-evaluation strategy's bound (matches EXP-CREP-001's own frozen
      ROUTE-02, which assumes rather than constructs this object).

why_none_reached_cap: |-
  Under the operationally-correct whole-target-set accounting (established
  in derivation-report.yaml's cost_accounting_convention_established_first,
  from CAL-PASS-CREP-001's own declared exponent), the best online exponents
  found are 3 (two-pairs) and 2 (one-pair), against a cap of 1.25. The gap
  is 1.75 and 0.75 respectively -- neither is a near miss in raw exponent
  terms, though the two-pairs result is a genuine, derived, one-full-power
  improvement over the naive Theta(B^4) baseline, and the one-pair result
  is a genuinely different (coefficient-vector-free) but same-exponent
  construction. Reported honestly per this task's explicit instruction:
  "better than naive but still over cap must be reported honestly as still
  over cap, not as a partial success."

explicitly_not_an_impossibility_claim: |-
  No lower bound on the cost of constructing z_R was derived or attempted.
  No argument was made that a further, smarter decomposition (e.g. a deeper
  recursive meet-in-the-middle, a Wagner-style generalized-birthday
  extension, or an entirely different algebraic route) cannot exist and
  reach cap. The gap between the best-found upper bound (B^3 two-pairs,
  B^2 one-pair) and the cap (1.25) remains open. This session explored one
  further nesting attempt (splitting the two-pairs elimination at a deeper
  level, eliminating x12 between S_3(x1,x2,x12) and S_3(x12,x34,T) to get a
  fixed-low-degree relation among x1,x2,x34,T directly) and found it
  reproduces the same B^2-per-fixed-rho1 loop cost with no net improvement,
  but this does not exhaust the space of possible further decompositions
  (e.g. Wagner-style k-list algorithms were considered but not pursued
  because their efficiency crucially depends on a coordinate-splittable
  match condition such as binary XOR, which plain F_p equality does not
  straightforwardly provide -- this is a plausible-but-unconfirmed
  obstruction to that specific further avenue, not a derivation).

