    two-pairs reading (4 -> 3), and a genuinely different but same-exponent
    implicit construction was found for the one-pair reading (2 -> 2,
    coefficient-vector-free but not smaller). Neither reaches the 1.25
    online cap under the operationally-correct whole-target-set accounting
    established at the top of this report.

honest_limitations: |-
  (1) This is zero-compute symbolic derivation; no construction here was
  executed against the frozen verifier or the recorded instances, so none
  of these bounds are machine-checked in the EXP-CREP-001 sense -- they are
  exponent-in-B claims about a hand-derived algorithm, not verified typed
  representation packages. (2) The one-pair/two-pairs reading ambiguity is
  not resolved here, per this task's explicit instruction; both readings'
  costs are reported side by side. (3) The "fresh-target online exponent"
  accounting-model ambiguity (per-single-query vs whole-target-set) is a
  genuine open question this session surfaced and partially resolved
  (favoring whole-target-set on the strength of the calibration fixture's
  own declared-exponent description), but this session did not have
  authority to definitively settle it, and flags it as forward guidance.
  (4) The meet-in-the-middle bound for two-pairs (B^3) and the
  implicit-but-same-exponent bound for one-pair (B^2) are NEW BEST-KNOWN
  UPPER BOUNDS for this specific construction question as far as this
  session's novelty search found (source-novelty-audit.yaml); they are not
  claimed to be optimal, and no lower bound is derived or claimed anywhere
  in this report.

