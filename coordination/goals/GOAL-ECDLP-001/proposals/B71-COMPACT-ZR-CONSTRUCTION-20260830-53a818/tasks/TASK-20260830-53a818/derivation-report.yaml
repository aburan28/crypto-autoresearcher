    Every preprocessing object used by the best-found constructions (raw
    decks, pair-decks g_12/g_34, and the hash sets over their roots) sits
    comfortably within the 2.25 preprocessing cap under both readings (the
    largest is exponent 2, two-pairs' pair-decks). The ENTIRE gap is in the
