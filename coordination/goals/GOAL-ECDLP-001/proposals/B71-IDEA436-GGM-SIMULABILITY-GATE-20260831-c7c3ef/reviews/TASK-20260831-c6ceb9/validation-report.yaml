cost_model_checks:
  - check: cost_unit_declared
    result: PASS
    detail: >-
      The unit is group operations, declared in Fork C and anchored to
      KN-TECH-005 and to the C = 1 / C = 0 bookkeeping of KN-FIND-002. Local bit
      work is reported separately and is NOT silently folded into the group-
      operation count.
  - check: optimistic_assumption_flagged
    result: PASS_AND_UNUSUALLY_WELL
    detail: >-
      The optimistic assumption in a group-operation-counted simulability
      argument is that uncounted local bit work is harmless. Section 5.4 names
      this as exactly where a relative closure can hide a real attack, and
      section 6.4 exhibits the object where it does - the anomalous transfer,
      which does all its damage in local bit work and is therefore invisible to a
      group-operation count. Flagging the optimistic assumption AND supplying the
      object that realises it is stronger than the check requires.
  - check: memory_reported_alongside_time
    result: PASS
    detail: >-
      Section 8 reports rho at n^(1/2+o(1)) time with O(1) memory, BSGS at
      n^(1/2) time and n^(1/2) memory, and the generic preprocessing tradeoff
      S times T^2 = Omega-tilde(n). The idea record own accounting carries both a
      time exponent lambda and a peak-memory exponent mu, and the memo evaluates
      against both. Memory is not omitted anywhere it is binding.
  - check: 'total expected cost as per-attempt cost times inverse success probability'
    result: PASS
    detail: >-
      This is the bookkeeping the check demands and the memo does it correctly.
      The per-attempt cost is one query at cost N^q; the success probability per
      attempt is 2/n for a fixed reference, giving inverse success probability
      N^delta with delta = 1; the product enters lambda as the delta + q term
      rather than being recomputed as if a single query succeeded. Under adaptive
      references the birthday improvement to delta = 1/2 is taken, which is the
      honest and less favourable-to-the-memo choice, and lambda >= 1/2 still
      follows. I recomputed both delta values independently and they match.
  - check: hidden_cofactor_disclosure
    result: PASS
    detail: >-
      The O(1) in this memo is literal - one inversion and two equality tests -
      not an o(1) exponent hiding polylog factors, and section 8 says so
      explicitly. There is no asymptotic cofactor to disclose.
  - check: pareto_honesty
    result: PASS
    detail: >-
      dominated_by is NOT null: it names Pollard rho with the negation map on the
      x-line, and records which frontier rows were checked - rho, BSGS, and the
      preprocessing tradeoff - read off KN-TECH-005, which the producer opened.
      sota_delta is quantitative and is zero on all three axes, time, memory and
      query, with the constant-factor claim separately marked recalled and
      explicitly declared not load-bearing. An unchecked null here would have been
      a fabrication under core rule 5; this is the opposite.

