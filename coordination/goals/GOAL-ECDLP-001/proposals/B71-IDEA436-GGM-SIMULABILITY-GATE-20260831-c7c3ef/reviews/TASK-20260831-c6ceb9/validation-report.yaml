findings:
  - id: F-1
    severity: substantive_but_not_verdict_bearing
    title: 'Section 1.1 model hypothesis is ambiguous, and on the weaker admissible reading the Proposition literal non-existence claim is FALSE'
    joint: J1
    what_the_memo_states: >-
      Section 1.1 states, verbatim: E/Q_p the good-reduction lift with a
      Weierstrass model whose coefficients lie in Z_p. Lemma 1 proof then argues,
      verbatim: A point of E(Q_p) outside the kernel of reduction has
      non-negative valuation coordinates on an integral model and reduces
      coordinatewise to its image in E(F_p).
    the_defect: >-
      Coefficients in Z_p is strictly weaker than a model that REALISES the good
      reduction, that is, an integral model with v_p of the discriminant equal to
      0. An elliptic curve with good reduction has many integral Weierstrass
      models, all but the minimal ones having positive discriminant valuation,
      and on a non-minimal one the quoted sentence of the Lemma 1 proof is FALSE:
      coordinatewise reduction lands on the singular point of a singular plane
      cubic, not on the image in E(F_p).
    concrete_counterexample_to_the_literal_statement: >-
      Let E be y^2 = x^3 + Ax + B over Z_p with v_p(discriminant) = 0, so E has
      good reduction, and let S, n, S-hat be as in section 1.1. Apply the
      admissible substitution x = u^2 X, y = u^3 Y with u = 1/p. The result
      E-prime : Y^2 = X^3 + p^4 A X + p^6 B
      is a Weierstrass model of the SAME curve whose coefficients lie in Z_p, so
      it satisfies section 1.1 as literally written. Its discriminant is p^12
      times that of E. On this model X = p^2 x, so for every j, k with k not
      +/- j mod n,
      v_p( X([k]S-hat) - X([j]S-hat) ) = 2 + 0 = 2,
      which is FINITE and at least 1, while [k]S-hat is not +/- [j]S-hat.
      This directly contradicts the Proposition sentence: There is no j, k, E, p,
      n for which the valuation takes a finite value >= 1.
    why_the_quantifier_list_is_where_it_bites: >-
      The Proposition quantifies over j, k, E, p, n. The MODEL is not in that
      list, and the proof-search-map quantifier_order.claim_d1 does not carry it
      either: it reads forall p >= 3, forall E/F_p ordinary with good reduction,
      forall S in E(F_p) of order n with gcd(n,p) = 1, forall r >= 1, forall j.
      Worse, the map dependency_audit asserts, verbatim: Checked for a hidden
      dependence of the D1 witness on the instance: none found. Sim code is three
      lines and mentions no curve parameter. But Sim line 4 returns the literal
      constant 0, and 0 IS a model-dependent constant: on E-prime the correct
      return value is 2, or min(2, r) after truncation. So there is a hidden
      dependence on the instance, of exactly the kind the audit went looking for
      and reported absent. This is a quantifier-fidelity failure in the sense of
      the Validator proof-architecture check 6.
    what_survives_untouched: >-
      Everything the verdict rests on. Under any admissible model change
      x = u^2 X + s the difference scales by u^(-2) and the PARTITION of index
      pairs into the two branches is exactly preserved, so the functional remains
      two-valued, remains constant in k off the +/- locus, and its separating
      predicate remains the group-theoretic k = +/- j mod n. The strict-GGM
      simulator still runs in one inversion and two equality tests; it returns
      the public constant c = -2 v_p(u) instead of 0, and c depends on the public
      model data alone, never on k, j, or the secret scalar. So D1 remains
      GGM-simulable with O(1) overhead and remains closed at exponent 1/2. THE
      VERDICT scoped_rejection_simulable IS NOT AFFECTED.
    secondary_consequences_to_repair_together: >-
      Corollary 4.1 states inv = 0 when k is not +/- j and = r otherwise. On a
      model with c > 0 the correct values are min(c, r) and r, and when r <= c
      the two coincide, so the functional becomes CONSTANT and Corollary 4.2 1
      bit becomes 0 bits and the image size 2 becomes 1. All of these move
      strictly in the direction of MORE closure, never less, which is why this
      finding cannot rescue the idea record.
    repair_action_preferred: >-
      R1, the one-clause fix. Amend section 1.1 to read: a Weierstrass model over
      Z_p realising the good reduction, that is with v_p(discriminant) = 0
      (equivalently a minimal model, up to a unit u). Add the same clause to the
      section 10 scope block, whose exclusion list currently names bad or
      additive reduction, p = 2, non-Weierstrass models, order divisible by p and
      functionals on the formal group, but not model non-minimality. With R1,
      Proposition 4 is TRUE exactly as written, the uniform-witness quantifier
      order of the proof-search-map stands, and the dependency_audit becomes
      correct.
    repair_action_alternative: >-
      R2, keep the loose hypothesis and state the result covariantly: Proposition
      4 becomes v_p = c on the non-collision branch with c = -2 v_p(u) a public
      model constant and c = 0 on the good-reduction model; Corollary 4.1 becomes
      min(c,r) versus r; Sim gains c as an input; and the quantifier list gains
      forall integral Weierstrass models. R2 is strictly more work and buys
      nothing, since the good-reduction model is the natural one. R1 is
      recommended.
    who_should_apply_it: >-
      The producer, in a SUPERSEDING artifact under a new task. Not me: I may not
      repair a producer artifact in place, and ECDLP-IDEA-436 stays frozen.

  - id: F-2
    severity: informational
    title: 'The p >= 3 hypothesis is not needed by the memo own argument, and section 10 excludes p = 2 unnecessarily'
    joint: J1
    detail: >-
      Section 10 scope block lists p = 2 among the cases where Proposition 4 does
      not apply. On the general Weierstrass form with a_1 through a_6 the
      argument runs unchanged at p = 2 and p = 3: the formal group is pro-p for
      every p, so reduction stays injective on prime-to-p torsion; and negation
      is (x,y) -> (x, -y - a_1 x - a_3), so the x-fibre is {P,-P} in every
      characteristic. p >= 3 is needed only for the SHORT form
      y^2 = x^3 + Ax + B. The memo section 1.1 does not use the short form, so
      the restriction is inherited from KN-TECH-73630e and ECDLP-IDEA-436 rather
      than required here.
    why_this_is_not_a_defect: >-
      Under-claiming is safe and this exclusion is stated rather than silent, so
      the plan test - each excluded case must be excluded by a stated hypothesis
      of section 1.1, not by silence - PASSES. I record it because a later reader
      may want the sharper statement and should not have to rediscover that the
      restriction is free to drop.
    repair_action: >-
      Optional. If the producer wants the sharper form, replace p >= 3 in section
      1.1 with any p, on a general Weierstrass model, and remove p = 2 from the
      section 10 exclusion list. If it prefers to keep the inherited hypothesis
      for consistency with KN-TECH-73630e, add one sentence to section 10 saying
      the p >= 3 restriction is inherited and is not required by Lemmas 1 and 2.

  - id: F-3
    severity: minor
    title: 'Lemma 2 as stated omits the nonidentity hypothesis that its own forward direction needs'
    joint: J1
    detail: >-
      Lemma 1 correctly carries its hypothesis, stating For k not congruent to 0
      mod n. Lemma 2 does not: it asserts x([k]S) = x([j]S) if and only if
      k = +/- j mod n with no restriction on j and k, yet the forward direction
      needs both points to be different from the identity, since x is undefined
      at the identity in the affine chart. The Proposition does carry k, j not 0
      mod n, so nothing downstream is wrong; this is hypothesis hygiene in an
      intermediate lemma.
    mitigating_context: >-
      The memo handles the degenerate case better than most: section 1.2 names
      the missing convention in the frozen family explicitly, and section 5.3
      shows the verdict is independent of which convention is chosen and that the
      simulator detects the case with one further equality test against the
      identity handle. I verified the underlying claim about the frozen record:
      ideas/ECDLP-IDEA-436_local_torsion_coordinate_valuation_profile_hypothesis.md
      does state the family with no convention at k = 0 mod n. So this is a
      wording slip, not a coverage gap.
    repair_action: >-
      Add for j, k not congruent to 0 mod n to the statement of Lemma 2, matching
      the hypothesis already carried by Lemma 1.

  - id: F-4
    severity: forward_guidance
    title: 'ECDLP-IDEA-436 declared POSITIVE control is not executable, because D1 is undefined on anomalous curves'
    joint: 'adjacent to J1; a defect of the idea record, not of the memo'
    detail: >-
      ECDLP-IDEA-436 declares as its positive control: a curve and n where a
      known p-adic separation exists (e.g. anomalous #E(F_p) = p, where the
      Smart/SSSA attack applies) - the instrument must detect it. But an
      anomalous curve has #E(F_p) = p, so a generator has n = p and
      gcd(n,p) = p, violating the record own Assumption 1. There is no canonical
      order-n prime-to-p lift of a point of order p, so inv is not merely
      uninformative there - it is UNDEFINED. The instrument therefore cannot be
      run on its own declared positive control.
    why_it_matters: >-
      Per inventor-protocol, controls come before belief, and a positive control
      that cannot be executed is not a control. Had this family reached an
      experimental round, the calibration step would have failed at setup rather
      than producing a calibration. This does not change the gate outcome, since
      the gate closes the family before any run; it matters for the NEXT record
      in this lane that copies the control design.
    repair_action: >-
      Record this in the Coordinator decision as a scoped observation about
      ECDLP-IDEA-436 control design, and require any successor record in this
      lane to name a positive control that satisfies its own assumptions. A
      workable substitute would be a non-generator S of prime-to-p order on an
      anomalous curve, where D1 IS defined while the transfer still applies to
      the full group; whether that is a useful calibration is a design question
      for the successor, not a claim of mine.

  - id: F-5
    severity: observational
    title: 'KN-FIND-b7e091 endomorphism closure rests on an overhead of m group operations, which is not constant'
    joint: 'adjacent to J1, relevant to OFQ-1'
    detail: >-
      KN-FIND-b7e091 closes the endomorphism oracle at exponent 1/2 on the
      strength of, verbatim, phi(Q) = [m]Q is computable in m group operations
      from Q alone. But m group operations is not O(1), and KN-FIND-002 declines
      to close the elliptic-net and incidence oracles for precisely the reason
      that their overhead is non-constant. So the two records apply the
      constant-overhead criterion inconsistently, independently of the Fork-A
      branch question.
    scope_of_this_observation: >-
      This is a PRE-EXISTING corpus item. The memo neither creates it nor relies
      on it: D1 closure rests on a simulator whose overhead is genuinely one
      inversion and two equality tests, so nothing in this round inherits the
      looseness. The memo reproduction of b7e091 verdict is faithful, which is
      what Control B asked of it.
    repair_action: >-
      Open a separate zero-compute successor task to reconcile the
      constant-overhead criterion across KN-FIND-002 and KN-FIND-b7e091, together
      with the incidence-oracle disagreement noted under the escalation
      assessment below. It should NOT be folded into this round, which is scoped
      to one functional family.

