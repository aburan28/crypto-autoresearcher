blind_rederivation:
  required_by_plan: true
  performed_by: TASK-20260831-c6ceb9
  quantity: >-
    The value set of inv_{j,r}(k) = v_p(x([k]S-hat) - x([j]S-hat)) truncated at
    precision r; specifically whether it is two-valued (0 and plus infinity) or
    can take a finite value of at least 1.

  ordering_attestation:
    phase_1_completed_before_any_blind_from_path_was_opened: true
    attestation: >-
      I attest that the derivation reproduced verbatim below was written out in
      full and sealed BEFORE I opened either blind_from path. The ordering is
      not merely asserted. I wrote the derivation to a file outside the
      repository and hashed it before my first read of the memo, and the hash
      and timestamp are recorded here. Nothing in the derivation was revised
      after the memo was opened; the comparison section is separate and
      additive.
    sealed_artifact: '$TMPDIR/val-c6ceb9/phase1-blind-derivation.md (session-local scratch, outside the repository and outside write_scope)'
    sealed_sha256: 14b80674828ce3ff91d4d636e3ce494f61d9fb32a252264db13fdd25ad9630fc
    sealed_at_utc: '2026-08-31T18:29:22Z'
    sealed_lines: 107
    non_blind_disclosure_if_any: >-
      None required. Phase 1 genuinely preceded Phase 2. Had it not, this field
      would say so plainly and the re-derivation would be reported as non-blind,
      per the task card and the plan ordering_requirement.

  blind_from_respected: true
  blind_from_paths_not_opened_during_phase_1:
    - ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate.md
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-GGM-SIMULABILITY-GATE-20260831-c7c3ef/tasks/TASK-20260831-c7c3ef/proof-search-map.yaml
  sources_read_during_phase_1:
    - knowledge/techniques/KN-TECH-73630e.md
    - ideas/ECDLP-IDEA-436_local_torsion_coordinate_valuation_profile_hypothesis.md
    - 'standard formal-group and reduction theory (recalled, not a file)'
  sources_read_during_phase_1_note: >-
    All three are on the plan permitted_during_blind_phase list. My declared
    Phase-1 sources have empty intersection with blind_from, which is the
    condition tools/check_review_independence.py checks.

  derivation: |-
      STEP 0 - the coordinates are defined and integral.
      Good reduction gives E(Q_p) = E_0(Q_p), and the kernel of
      red : E(Q_p) -> E(F_p) is the formal group E-hat(pZ_p). That group is the
      inverse limit of E-hat(pZ_p)/E-hat(p^i Z_p), whose graded pieces are
      (p^i Z_p / p^(i+1) Z_p, +), elementary abelian p-groups. So E-hat(pZ_p) is
      PRO-p and therefore has no torsion of order prime to p.
      S-hat has order exactly n with gcd(n,p) = 1, and k is not 0 mod n, so
      [k]S-hat is a nontrivial prime-to-p torsion point, hence is NOT in
      E-hat(pZ_p), hence is not the identity. Therefore x([k]S-hat) lies in Z_p
      and reduces mod p to x(red([k]S-hat)) = x([k]S). Same for j. So the
      difference lies in Z_p and its valuation is at least 0, and both terms are
      defined.

      STEP 1 - the mod p test.
      v_p(x([k]S-hat) - x([j]S-hat)) >= 1
        iff x([k]S-hat) = x([j]S-hat) mod p
        iff x([k]S) = x([j]S) in F_p, by Step 0 reduction compatibility.

      STEP 2 - the x-fibre over F_p.
      On a Weierstrass model the map x from E to P^1 has degree 2 and its deck
      involution is negation, since -(x,y) = (x, -y - a_1 x - a_3). So the fibre
      of x over any value is exactly the set {P, -P}, which has size 2 when P is
      not equal to -P and size 1 at a 2-torsion point, where x ramifies. Hence
      for P and Q both different from the identity, x(P) = x(Q) iff Q = +/- P.
      Applying this with P = [j]S and Q = [k]S, both nonidentity because j and k
      are not 0 mod n, gives
        x([k]S) = x([j]S) iff [k]S = +/- [j]S iff k = +/- j mod n,
      the last step because S has order exactly n.

      STEP 3 - lifting the equality, and the GAP.
      Suppose k = +/- j mod n. S-hat has order exactly n, since red restricted to
      prime-to-p torsion is a group isomorphism from <S-hat> onto <S>
      (KN-TECH-73630e). So [k]S-hat = +/- [j]S-hat ALREADY in E(Q_p). And x is an
      even function: x(-P) = x(P) EXACTLY, not merely mod p. Therefore
      x([k]S-hat) - x([j]S-hat) = 0 exactly and the valuation is +infinity.

      CHAINING THEM - the whole content of the result.
        v_p >= 1  ==(Steps 1,2)==>  k = +/- j mod n  ==(Step 3)==>  v_p = +infinity.
      So there is NO j, k, E, p, n giving 1 <= v_p < infinity. The mod p test
      already decides EXACT equality; nothing can live in between. The dichotomy
      is not an accident of the two cases being exhaustive - it is a genuine gap,
      produced by the fact that the only way to be congruent mod p is to be equal
      on the nose.

      ANSWER.
      Untruncated value set: {0, +infinity}. TWO-VALUED.
        v_p = 0         iff k is not +/- j mod n
        v_p = +infinity iff k is     +/- j mod n
      Truncated at precision r, taking the value min(v_p, r): value set {0, r}.
      Still two-valued.

      HYPOTHESES MY DERIVATION ACTUALLY USED, and what breaks without each.
      (A) GOOD REDUCTION - load-bearing twice: integrality in Step 0, and
          injectivity of red on prime-to-p torsion in Step 3. Under bad reduction
          both fail. Analytic sketch only, NOT a verified computation: on a Tate
          curve E_q(Q_p) = Q_p^* / q^Z with v(q) = N, n dividing N, and
          w = q^(1/n) in Q_p, the leading term of the Tate x-series gives
          v(x(w^k)) = k for small k, so v(x(w^k) - x(w^j)) = min(k,j), FINITE and
          at least 1. That is outside the stated hypotheses, so it is not a
          counterexample; it shows hypothesis (A) is load-bearing rather than
          decorative.
      (B) gcd(n,p) = 1 - load-bearing at the level of DEFINEDNESS. If p divides n
          the canonical order-preserving lift need not exist, so inv is not
          defined at all. Note for the control: an anomalous curve has
          #E(F_p) = p, so n = p and gcd(n,p) = p, and the entire family is
          UNDEFINED there.
      (C) j and k not 0 mod n - load-bearing: x is undefined at the identity in
          the affine Weierstrass chart. The frozen family as written in
          ideas/ECDLP-IDEA-436_local_torsion_coordinate_valuation_profile_hypothesis.md
          states NO convention for k = 0 mod n.
      (D) WEIERSTRASS MODEL - load-bearing for Step 2, which needs x of degree 2
          with deck group {+/-1}. On a twisted Edwards model, negation is
          (x,y) -> (-x,y) and the x-fibre is {P, P+T} with T = (0,-1) of order 2,
          a different fibre and a different answer.
      (E) MINIMALITY, or equivalently an integral model with v_p(discriminant) = 0
          - I claim this is a MISSING hypothesis and I predict the memo will not
          state it. The word Weierstrass alone, even with coefficients in Z_p,
          does not force the finite value to be 0. Under the admissible change of
          model x = u^2 X + s with u in Q_p^*, one gets
          X([k]S-hat) - X([j]S-hat) = u^(-2) (x([k]S-hat) - x([j]S-hat)), so the
          finite value is -2 v_p(u), not 0. Concretely, if E is y^2 = x^3 + Ax + B
          with good reduction over Z_p, then
              E-prime : Y^2 = X^3 + p^4 A X + p^6 B
          is a Weierstrass model of the SAME curve with coefficients in Z_p, and
          X = p^2 x, so for every k not +/- j mod n
              v_p( X([k]S-hat) - X([j]S-hat) ) = 2,
          which is FINITE and at least 1. So the value 0 needs the model that
          actually realises the good reduction, v_p(discriminant) = 0. The
          DICHOTOMY - two-valued, constant in k off the +/- locus - is
          model-covariant and survives any such change; only the label 0 moves.
      (F) p >= 3 - NOT needed for the dichotomy. Steps 0 to 3 all hold at p = 2
          and p = 3 on a general Weierstrass form with a_1 through a_6, because
          E-hat(m) is pro-p for every p and the x-fibre argument is
          characteristic-free. p >= 3 is needed only for the SHORT form
          y^2 = x^3 + Ax + B, where negation is (x,y) -> (x,-y). It is a
          conservative inherited restriction, not an error.

      TWO COROLLARIES I DERIVED THAT THE TASK CARD DID NOT ASK FOR.
      (G) PRECISION r = 1 SUFFICES. Because v_p >= 1 implies v_p = +infinity,
          precision 1 already decides the functional completely. So inv factors
          through E(F_p) and needs NO p-adic lifting at all. The idea record own
          expected fatal obstruction - precision growth with exponent rho_r at or
          above 1/2 - is therefore VACUOUS for this family. It is beaten, not met.
      (H) THE FUNCTIONAL IS NOT CONSTANT IN k. As a function of k it is the
          indicator of the two-element set {+j, -j}: +infinity there, 0 elsewhere.
          So the idea record null fires through its SECOND disjunct (cost), not
          its first (constancy). Its content is exactly the equality test
          [k]S = +/- [j]S, which is one group operation plus a handle comparison,
          i.e. a generic-group zero test. Recovering k from it requires sweeping j
          over Z/nZ: cost n, WORSE than n^(1/2).

      2-TORSION PROBE, run explicitly per the worked attack.
      If 2 divides n, then T = [n/2]S-hat satisfies T = -T. The x-fibre over x(T)
      is {T}, of size ONE - x ramifies exactly at 2-torsion. So 2-torsion yields
      no third preimage and no counterexample. It does however falsify the
      sloppier phrasing that the fibre has exactly two points; the correct
      phrasing is that the fibre is {P,-P}, of size at most two. FLAGGED to check
      against the memo Lemma 2 in Phase 2.

  result: 'value set is {0, +infinity} untruncated, {0, r} truncated; TWO-VALUED; no finite value at or above 1'
  agrees_with_producer: true

  comparison_to_producer_after_lifting_blindness: >-
    My Steps 0 and 1 are the producer Lemma 1. My Steps 2 and 3 are its Lemma 2.
    My chained gap argument is its Proposition 4, reached by the same two cases.
    My corollary (G) is its Corollary 4.1 including the sharp statement that
    rho_r is 0 rather than at least 1/2. My corollary (H) is its Corollaries 4.2
    and 4.3, including the observation that the retained content is equality in
    the quotient <S>/{+/-1}, which Pollard rho already exploits through the
    negation map. I derived (G) and (H) independently and before reading them,
    which is the strongest form of agreement this control can produce.
    The one place my blind derivation went somewhere the producer did not is
    hypothesis (E), the model-minimality gap, which I predicted before opening
    the memo would be missing and which is in fact missing. That is recorded as
    F-1 below.
  disagreement_localisation: >-
    There is no disagreement about the value set. The single disagreement is
    about the stated finite VALUE and the quantifier list that carries it, and it
    localises to one clause of section 1.1 plus one line of the Lemma 1 proof,
    not to the dichotomy.

# ---------------------------------------------------------------------------
joint_disposition:
  joint_id: J1
  joint_name: 'Mathematical correctness of the Proposition and its two lemmas'
  disposition: holds_with_findings
  disposition_expanded: >-
    HOLDS on everything the verdict rests on. The Proposition is two-valued, the
    separating predicate is exactly the group-theoretic condition k = +/- j mod n,
    and both lemmas are correctly stated and correctly proved on the intended
    reading of section 1.1. FINDINGS on the stated finite value and on the
    quantifier list that carries it: under the weaker but admissible reading of
    section 1.1 the value is a nonzero model constant and the literal
    non-existence claim is false. Repairable in one clause.

  counterexample_search_result: >-
    The worked attack asked me to exhibit 1 <= v_p < infinity with [k]S-hat not
    equal to +/- [j]S-hat. Within the intended hypotheses I could NOT, and I
    believe no one can: the chain in Step 3 of my derivation closes the gap
    completely. Outside them I found exactly one construction that the memo
    stated hypotheses do NOT exclude, given in F-1, and two that they DO exclude
    by a stated hypothesis, given in the probe table below.

  probe_table:
    - probe: '2-torsion points, where P = -P'
      result: NO_COUNTEREXAMPLE
      excluded_by: 'not excluded, and not needed: the case is handled correctly'
      detail: >-
        x ramifies at 2-torsion, so the fibre there has size one, not two. No
        third preimage arises. I specifically checked whether the memo Lemma 2
        overstates this as exactly two preimages, which would be an error at
        2-torsion. It does not. Its wording is that x(P) = x(P-prime) implies
        P-prime = +/- P, which is correct and is size-at-most-two. The header
        phrase the x-map has exactly the +/- fibres is also correct, since
        {P,-P} is a set that may have one element. This probe FAILS to break the
        lemma, and I record that as a positive result for the producer.

    - probe: 'the identity, and the k = 0 mod n convention the frozen family leaves unstated'
      result: NO_COUNTEREXAMPLE
      excluded_by: 'STATED HYPOTHESIS of the Proposition (k, j not 0 mod n), and additionally named rather than passed over'
      detail: >-
        This is the plan fourth declared control, the degenerate-case control,
        and the producer PASSES it affirmatively rather than by silence. Section
        1.2 states that degenerate arguments need a stated convention and that
        the frozen family does not supply one; section 5.3 shows the simulator
        detects the case with one further equality test against the identity
        handle and that the verdict is independent of which convention is chosen.
        I confirm both: the identity handle is available in both Fork-A branches,
        so the indicator of k = 0 mod n is itself a free generic-group predicate
        and cannot rescue the family. I independently confirm the underlying gap
        in the frozen record: ideas/ECDLP-IDEA-436_..._hypothesis.md states the
        family with no convention at k = 0. Recorded as F-3, minor.

    - probe: 'p = 2 and p = 3'
      result: NO_COUNTEREXAMPLE
      excluded_by: 'STATED HYPOTHESIS of section 1.1 (p >= 3), and by the section 10 scope block'
      detail: >-
        Excluded by a stated hypothesis, so this probe does not produce a
        finding. I record the opposite observation instead: the exclusion is
        UNNECESSARY. On the general Weierstrass form the whole argument runs at
        p = 2 and p = 3, because the formal group is pro-p for every p and the
        x-fibre argument is characteristic-free. Section 10 lists p = 2 among the
        cases where Proposition 4 does not apply; that is conservative rather
        than wrong, and under-claiming is safe. Recorded as F-2, informational.

    - probe: 'gcd(n,p) not equal to 1'
      result: NO_COUNTEREXAMPLE
      excluded_by: 'STATED HYPOTHESIS of section 1.1 (gcd(n,p) = 1), repeated in the section 10 scope block'
      detail: >-
        Correctly excluded. I add one consequence the memo does not draw and
        that is useful downstream: on an anomalous curve #E(F_p) = p, so a
        generator has n = p and gcd(n,p) = p. The family D1 is therefore not
        merely uninformative on anomalous curves, it is UNDEFINED there, because
        no canonical order-n prime-to-p lift of a point of order p exists. That
        means ECDLP-IDEA-436 own declared POSITIVE control - anomalous curves,
        where the instrument must detect a known p-adic separation - is not
        executable as written. Recorded as F-4, forward guidance, and it is a
        defect of the idea record control design rather than of this memo.

    - probe: 'bad reduction'
      result: NO_COUNTEREXAMPLE_WITHIN_SCOPE
      excluded_by: 'STATED HYPOTHESIS of section 1.1 (good reduction), repeated in the section 10 scope block'
      detail: >-
        Correctly excluded, and I verified it is load-bearing rather than
        decorative: my Tate-curve sketch in Phase 1 hypothesis (A) indicates
        finite valuations at least 1 do occur there. I label that sketch as an
        analytic leading-order argument, NOT a verified computation, because
        this round permits no computation. It is not a counterexample to the
        Proposition. It corroborates the memo own section 10 resource_check
        reading, that the object is empty precisely under the good-reduction
        hypothesis the ECDLP setting cannot drop.

    - probe: 'non-Weierstrass models'
      result: NO_COUNTEREXAMPLE
      excluded_by: 'STATED HYPOTHESIS of section 1.1 (Weierstrass model), and named as open item 4 in section 10'
      detail: >-
        Correctly excluded and, better, explicitly carried forward: section 10
        forward guidance item 4 names non-Weierstrass models as an open class
        where the collapse argument does not run as written. I confirm the
        mechanism concretely: on a twisted Edwards model negation is
        (x,y) -> (-x,y), so the x-fibre is {P, P+T} with T the order-2 point
        (0,-1), not {P,-P}. When n is odd, T is not in <S-hat>, so within the
        cyclic subgroup the fibre is a single point and the functional becomes
        the indicator of {j} rather than of {+j,-j}. That is a DIFFERENT
        functional, and the memo is right not to claim it.

    - probe: 'j = -k, where x agrees but the points differ'
      result: NO_COUNTEREXAMPLE
      excluded_by: 'handled explicitly and correctly as the +infinity branch'
      detail: >-
        This is the sharpest form of the attack, because x agrees while the
        points genuinely differ, so one might hope for a large-but-finite
        valuation. It fails for a reason worth stating: x(-P) = x(P) holds
        EXACTLY in Q_p, not approximately and not only modulo a power of p, so
        the difference is the zero element and the valuation is +infinity rather
        than large. The memo makes exactly this step and makes it correctly.

    - probe: 'non-MINIMAL integral Weierstrass model (validator-added probe, not on the plan list)'
      result: COUNTEREXAMPLE_FOUND_TO_THE_LITERAL_STATEMENT
      excluded_by: 'NOT EXCLUDED BY ANY STATED HYPOTHESIS - this is the finding'
      detail: 'See F-1.'

