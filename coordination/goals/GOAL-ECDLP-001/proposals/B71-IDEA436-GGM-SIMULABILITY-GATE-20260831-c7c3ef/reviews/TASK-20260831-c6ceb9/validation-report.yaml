      The Proposition is the strictness witness: it does not merely show the
      family is feasible to simulate, it shows the value depends on (j,k) only
      through a group-theoretic predicate, which is what upgrades A-structured to
      A-strict. Under F-1 the strictness statement no finite value at or above 1
      is model-conditional; the strictness that the closure actually needs -
      constancy in k off the +/- locus - is not.
  - check: observation_collisions
    result: PASS
    detail: >-
      Section 6.3 bounds its own scope: the argument is run on the four recorded
      oracles and closes 2, declining the other 2. No global identifiability is
      claimed from that bounded set, and section 10 items 2 to 4 name what the
      search did not cover.
  - check: interface_preservation
