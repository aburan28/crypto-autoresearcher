control_checks:
  - control: 'Control A - anomalous curves (trace one), KN-TECH-033, Smart / Satoh-Araki / Semaev additive transfer'
    mandated_by: 'review-plan proves_too_much_objects[0], run_by both'
    result: PASS_BOTH_HALVES
    half_1_M1_proves_too_much:
      producer_claim: 'M1 (determinism reduction) PROVES TOO MUCH here and is broken as a closure rule'
      my_independent_verdict: CONFIRMED
      my_argument: >-
        M1 says that if the oracle output is a deterministic function of objects
        the adversary already holds in the model, it is simulable at the cost of
        evaluating that function locally. The additive transfer psi is exactly
        that: for #E(F_p) = p, lift P to P-hat in E(Q_p), note that [p]P-hat lies
        in the kernel of reduction because pP is the identity in E(F_p), apply
        the formal logarithm and divide by p, then reduce mod p. Every step is a
        deterministic function of the coordinates of P and of the public curve
        data, and the result is independent of the lift. So in the structured
        branch M1 fires and declares psi simulable with zero group operations.
        If A-structured simulability with O(1) overhead were allowed to imply
        closed at exponent 1/2, M1 would conclude that ECDLP on anomalous curves
        needs Omega(sqrt p) group operations. KN-TECH-033 records that it is
        instead O(log p) field operations and that the ECDLP collapses entirely.
        So M1 alone proves too much. CONFIRMED.
      why_it_fails_diagnosed: >-
        Simulability is always relative to a baseline, and in the structured
        branch the baseline is ALREADY non-generic: an adversary holding
        coordinates on an anomalous curve solves the DLP in linear time without
        any oracle. So the true statement, the oracle adds nothing over the
        structured baseline, is correct and yet carries no exponent, because the
        structured baseline is not Omega(sqrt p). The producer diagnosis in
        sections 5.4 and 6.4 is the same one and it is correct.
      independent_corroboration_from_the_corpus: >-
        KN-TECH-005, opened and read, states this caveat itself in its
        Applicability limits, quoted verbatim: The bound is about the generic
        model; it says nothing about attacks exploiting concrete structure
        (isogenies, pairings on low-embedding-degree curves, anomalous curves
        with #E = p, summation-polynomial index calculus over extension fields).
        Those live precisely in the model blind spot. So the corpus record the
        closure rule is imported FROM already carries the anomalous-curve
        exception. The producer rediscovery of it is correct and consistent with
        its own cited source.
    half_2_M2_does_not_fire:
      producer_claim: 'M2 (predicate collapse) correctly does NOT fire on the anomalous transfer'
      my_independent_verdict: CONFIRMED
      my_argument: >-
        M2 fires only if the deterministic function factors through the group
        law, inversion and equality on opaque labels. Suppose it did for psi, in
        T group operations. Since #E(F_p) = p is prime and psi is a nontrivial
        homomorphism onto (F_p,+), psi is a group ISOMORPHISM. An adversary given
        handles for P and for Q = [x]P could then compute psi(P) and psi(Q) and
        output x = psi(Q) times the inverse of psi(P) mod p, giving a generic DLP
        algorithm in about 2T + O(1) group operations. KN-TECH-005 states,
        verbatim, Any generic DLP algorithm needs Omega(sqrt(p)) group operations
        (Shoup, KN-LIT-011; precursor Nechaev 1994). Hence T is Omega(sqrt p),
        so psi is NOT computable from labels with O(1) overhead and M2 does not
        fire. CONFIRMED.
      unambiguous_statement_the_plan_demanded: >-
        M2 DOES NOT FIRE ON ANOMALOUS CURVES. The exponent-1/2 verdict is
        therefore NOT broken by this control and does NOT have to be withdrawn.
        I state this unambiguously because the plan required an unambiguous
        answer, and I reached it from Shoup bound plus the structure of psi
        rather than from the memo argument.
      residual_caveat: >-
        One nuance a later reader should not lose. The reason M2 does not fire is
        itself Shoup theorem, so M2 is, on this object, close to circular as a
        DISCOVERY procedure: it declines to collapse psi because collapsing psi
        would contradict the very bound M2 exists to invoke. That is sound as a
        CHECK - it is exactly the shape of a consistency proof - but it means M2
        cannot be used to discover that some new oracle is non-collapsing. On D1
        this does not bite, because there M2 fires POSITIVELY by exhibiting an
        explicit three-line simulator, which is a construction and not an appeal
        to the bound.
    m2_fires_positively_on_D1_verified: >-
      I verified the D1 simulator directly against the strict Shoup interface. The
      adversary holds labels sigma(k). EQ(A,B) tests k = j; INV(B) yields
      sigma(-j); EQ(A, INV(B)) tests k = -j. By the Proposition the pair of
      answers determines inv exactly. Cost is one inversion and two equality
      tests, independent of r, p, n and of any coordinate. This is a construction,
      it is correct, and it lives in the branch where Shoup theorem is actually
      stated, so the closure is sound.

  - control: 'Control B - the already-closed jet and endomorphism oracles, KN-FIND-002 and KN-FIND-b7e091, each on the branch it actually uses'
    mandated_by: 'review-plan proves_too_much_objects[1], run_by both'
    result: PASS
    branch_attribution_verified: >-
      KN-FIND-002 states its own branch, verbatim from its Scope and limitations:
      The classification uses the structured GGM (curve equation is public), not
      the strictest Shoup GGM (opaque labels). Under the strictest GGM, jet and
      endomorphism would be NON-SIMULABLE because they require coordinate access.
      KN-FIND-b7e091 does not name a Fork-A branch but its wording places it in
      the strict branch: it says the oracle output is determined by group
      operations and equality tests alone, and it invokes any algorithm using
      only a generic group oracle (group operations + equality tests). So the
      branch attribution the memo makes is correct for both records.
    reproductions:
      - object: 'jet oracle, KN-FIND-002, structured branch'
        recorded_verdict: 'SIMULABLE with O(1) overhead, C = 1, closed at exponent 1/2'
        argument_style_reproduces: true
        detail: >-
          M1 applies: the dual-number data is a rational function of the
          coordinates of P, Q, P+Q and the public curve parameters, so the
          simulator computes P+Q with one group operation and evaluates the
          rational function. Overhead C = 1. Matches.
      - object: 'jet oracle, strict branch, KN-FIND-002 own scope note and KN-FIND-b7e091 Oracle A'
        recorded_verdict: 'NON-SIMULABLE; b7e091 verbatim: Oracle A (first-jet): non-simulable but privately computable (requires k).'
        argument_style_reproduces: true
        detail: >-
          M2 does not fire, because derivative values separate points standing in
          identical group-theoretic relations. Matches both records. The apparent
          tension between the two records is correctly localised to Fork A rather
          than being called an error in either, which is what the plan demanded.
      - object: 'endomorphism oracle, KN-FIND-002, structured branch'
        recorded_verdict: 'SIMULABLE, C = 0, closed at exponent 1/2'
        argument_style_reproduces: true
        detail: 'M1 gives a public deterministic coordinate map evaluated locally with zero group operations. Matches C = 0 exactly.'
      - object: 'endomorphism oracle, KN-FIND-b7e091, strict branch'
        recorded_verdict: 'simulable; verbatim: For prime-order prime-field curves with End_{F_p}(E) = Z, every phi = [m], so phi(Q) = [m]Q is computable in m group operations from Q alone.'
        argument_style_reproduces: true
        detail: 'M2 fires: phi is multiplication by m, a pure group computation. Matches exactly, including the m group operations count.'
      - object: 'elliptic-net oracle, KN-FIND-002'
        recorded_verdict: 'verbatim heading: SIMULABLE with non-constant overhead (NOT closed at 1/2); O(log N)'
        argument_style_reproduces: true
        detail: 'M1 applies but through the group, costing O(log N) group operations. Non-constant, so the constant-overhead bound does not close it. Matches, and this is the anti-triviality half.'
      - object: 'incidence oracle, KN-FIND-002'
        recorded_verdict: 'O(B^m), NOT closed at 1/2'
        argument_style_reproduces: true
        detail: 'M1 gives O(B^m) group operations with B growing with problem size. Matches.'
    anti_triviality: >-
      The argument closes 2 of the 4 KN-FIND-002 oracles and declines to close
      the other 2, reproducing the recorded 4/4 split. An argument style that
      closed everything would be worthless, and this one demonstrably does not.
    validator_added_negative_controls: >-
      The producer could not open experiments/EXP-GGM-001 because it lay outside
      its declared read_scope, and disclosed that its Control B ran against the
      records stated arguments rather than against the implementation. That path
      is NOT outside my read scope, so I closed the producer disclosed gap. The
      committed experiments/EXP-GGM-001/analysis.md reproduces the four oracle
      verdicts exactly as KN-FIND-002 records them - jet C = 1 YES,
      elliptic_net O(log N) NO, incidence O(B^m) NO, endomorphism C = 0 YES - and
      additionally records a 4/4 control gate whose two NEGATIVE controls are
      discrete_log expected NON_SIMULABLE and encoding expected NON_SIMULABLE,
      both classified correctly. I ran the memo M1/M2 style on both negative
      controls myself. On discrete_log, M1 declares the output a deterministic
      function of the group element but with local evaluation cost equal to
      solving the DLP, so the overhead is non-constant and the oracle is not
      closed; M2 does not fire, by Shoup. On encoding, the output is not a
      function of anything the strict adversary holds, and does not factor
      through group operations, so neither move fires. Both match the recorded
      NON_SIMULABLE. This upgrades Control B from argument-level to
      implementation-level agreement and removes one of the producer own
      disclosed limitations.

  - control: 'null-object / no-decay check (inventor-protocol section 3), applied to this round'
    result: NOT_APPLICABLE_AND_CORRECTLY_SO
    detail: >-
      Inventor-protocol section 3 requires that any reported correlation, bias or
      excess be measured against a null object of the same shape, and that the
      report state what the measured quantity SHOULD do as the parameter meant to
      destroy it increases. This round reports NO statistical signal: zero runs,
      zero samples, no correlation, no bias, no excess. There is therefore no
      artifactual signal to detect and no decay curve to demand. The structural
      analogue of the null-object control for an ARGUMENT is the proves-too-much
      control, and that one IS mandatory here, was run, and passed. I record this
      explicitly rather than omitting it, so a later reader does not read the
      absence of a null-object control as an unmet obligation.
      One decay statement is nevertheless available and is worth recording,
      because it is the honest form of the artifact tell in this setting: the
      parameter meant to destroy any p-adic content of this family is the
      precision r, and the correct expectation was that information would GROW
      with r. It does not. Corollary 4.1 and my independent corollary (G) both
      give exactly 1 bit at every r including r = 1. A quantity that is flat in
      the parameter that should sharpen it is the signature of a quantity that
      was never p-adic, which is precisely the producer conclusion.

