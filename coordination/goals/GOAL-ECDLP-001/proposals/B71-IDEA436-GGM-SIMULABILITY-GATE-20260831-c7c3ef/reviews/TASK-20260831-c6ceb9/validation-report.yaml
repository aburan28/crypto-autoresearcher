      success-probability loss to record, and that is stated rather than assumed.
  - check: ceiling_and_nearby_control
    result: PASS
    detail: >-
      The method ceiling is derived from the method own resource measure, the
      group-operation count of KN-TECH-005, and the preregistered nearby object -
