    judge the mapping WRONG and have revised it to `breaks`. Per the Coordinator
    instruction the nested block was left byte-identical rather than rewritten, so
    the two disagree on this one token and the original mapping stays visible instead
    of being silently overwritten. WHERE THEY DIFFER, THIS TOP-LEVEL BLOCK IS THE
    OPERATIVE ATTESTATION. Nothing else in the report changed - no objection, no
    control outcome, no scope or cost finding, no escalation determination, and no
    part of the falsification control design.

  reason_for_breaks: >-
    J2 asks whether SIMULABILITY licenses the scoped rejection AT THE STATED SCOPE
    AND TIER. It does not. The producer own proof-search-map method ceiling says the
    method can certify nothing about the real cost of any algorithm on a real curve,
    and KN-LIT-7606 as the memo itself quotes it says a plain-GGM simulability
    argument cannot close a candidate for real elliptic curves - so the stated chain
    does not carry the claim it is asked to carry. The stated SCOPE is separately
    insufficient - the exponent-1/2 step needs n prime and no stated hypothesis
    supplies it. And one of the two mandatory controls for this joint, Control B,
    failed as an independent control. A joint whose primary attack partially succeeds,
    whose stated scope is missing a hypothesis, and whose mandatory control fails is
    not a joint that holds.

  what_breaks_and_what_does_not: >-
    BREAKS - the licensing chain, the stated tier, and the stated scope. DOES NOT
    BREAK - the disposition. The scoped rejection of D1 SURVIVES on a different and
    strictly stronger ground the memo already contains but does not lead with -
    Corollary 4.3 identifies D1 with equality in the quotient by plus-or-minus one,
    computable for free in E(F_p) by one x-coordinate comparison, so D1 gives a real
    coordinate-holding adversary literally zero information. That ground is
    model-free and needs no GGM, no Shoup and no Fork-A branch. `breaks` here means
    the inference as stated must be repaired and re-issued, NOT that the producer
    conclusion is wrong and NOT that the candidate family is viable.

  why_not_holds: >-
    Because the one token this field carries is what a composing Coordinator reads
    when it does not re-read the body. `holds` would report that J2 raised no
    blocking problem, while I recorded four blocking repairs, two of them major, one
    being that the licensing chain does not carry the claim. The error costs are
    asymmetric - a wrong `breaks` costs the Coordinator one reading of a report whose
    first line already says the disposition survives, while a wrong `holds` ships a
    defective licensing chain and a missing primality hypothesis into the record
    behind a green token.

  why_not_inconclusive: >-
    I am not inconclusive. I reached a definite finding in both directions - the
    stated chain fails, and a named alternative chain succeeds. `inconclusive` would
    understate the certainty and would wrongly suggest more review is needed to
    decide, when what is needed is a bounded producer erratum.

