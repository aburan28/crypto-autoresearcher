  verdict_revision_disclosure: >-
    THIS FIELD RECORDS A CHANGE OF ANSWER. My report body records the J2 verdict as
    holds_with_required_repairs and maps it to `holds` in the plan vocabulary. The
    Coordinator asked me to confirm that mapping given that my Attack 1 partially
