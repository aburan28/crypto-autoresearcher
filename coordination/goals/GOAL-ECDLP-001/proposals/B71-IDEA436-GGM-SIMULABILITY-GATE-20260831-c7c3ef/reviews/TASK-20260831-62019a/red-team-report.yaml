  controls:
    - control: 'Control A - anomalous curves (trace one), KN-TECH-033, Smart / Satoh-Araki / Semaev'
      plan_expectation: >-
        That M1 proves too much there while M2 does not, and that if M2 also fires
        the exponent-1/2 verdict is broken. Both halves to be confirmed
        independently.
      half_1_M1_proves_too_much: CONFIRMED_INDEPENDENTLY
      half_1_my_own_derivation: >-
        Take psi, the additive transfer onto (F_p,+) on a curve with #E(F_p) = p.
        KN-TECH-033 (opened, kb) states 'there is an explicit isomorphism from that
        group onto the additive group (F_p, +)' and 'the ECDLP is linear time', and
        separately that 'the p-adic version (KN-LIT-088) is additionally the one
        place where lifting to characteristic zero is known to pay'. psi is
        computable from the coordinates of P and public curve data in O(log p) field
        operations and ZERO oracle group operations. M1, as the memo states it, is
        a determinism criterion and therefore fires. If firing M1 licensed a
        closure at exponent 1/2, one would conclude Omega(sqrt(p)) group operations
        for a problem that is solved in linear time. M1 alone proves too much. This
        also entails, independently of the memo, that NO unconditional exponent-1/2
        lower bound exists in the structured GGM at all - which is exactly what the
        producer own method_ceiling asserts and what KN-TECH-005 Applicability
        limits assert ('The bound is a barrier, NOT a proof that no non-generic
        attack exists'; the bound 'says nothing about attacks exploiting concrete
        structure (... anomalous curves with #E = p ...)').
      half_2_M2_does_not_fire: CONFIRMED_BUT_NOT_FOR_THE_MEMO_STATED_REASON
      half_2_my_own_derivation: >-
        M2 does not fire on psi, so the exponent-1/2 verdict for D1 is NOT broken
        by this control. But the memo reason - 'psi is a nontrivial homomorphism
        onto (F_p,+) whose evaluation from handles alone would make DLP generically
        easy, contradicting Shoup' - argues from the absurdity of the CONCLUSION,
        i.e. it invokes the very theorem whose applicability M2 is supposed to
        license. That is a consistency check, not a mechanism check, and a
        proves-too-much control that argues this way cannot detect an artifactual
        rule. The operative reason is different and must be written into M2 - see
        OBJ-6. Under the repaired, cost-bounded reading of M2 ('there exists an
        explicit simulator using O(1) group operations and equality tests') M2
        provably does not fire on psi, and the D1 verdict is untouched because the
        memo exhibits exactly such a simulator for D1.
      additional_finding_from_this_control: >-
        gcd(n,p) = 1 in ECDLP-IDEA-436 Assumption 1 EXCLUDES anomalous curves,
        where n = p. So the object the record itself declares as its POSITIVE
        control lies outside the Proposition scope entirely, and this memo says
        nothing about it. Section 10 scope block does record 'a point whose order
        is divisible by p' as outside; section 0 does not. See OBJ-13.
      control_outcome: 'PASS. The exponent-1/2 verdict is not broken by Control A. One repair required (OBJ-6).'

    - control: 'Control B - the already-closed jet and endomorphism oracles, KN-FIND-002 and KN-FIND-b7e091, on the branch each record actually uses'
      branch_identification: CORRECT
      verdict_reproduction: 'reproduces all four recorded oracle verdicts on both branches, including the incidence disagreement between the two records, which the memo reports rather than resolves - correct under the retrieval policy on contradictory sources'
      control_outcome: 'FAILS AS AN INDEPENDENT CONTROL, while reproducing the recorded verdicts'
      why_it_fails_as_a_control: >-
        M1 and M2 were abstracted FROM KN-FIND-002 four classifications and then
        validated BY reproducing those same four classifications. The reported
        '4/4' and 'closes 2 of 4 and declines 2' is a fit statistic on the training
        set, with zero held-out objects for M2. The memo does have exactly one
        genuine held-out object - the anomalous curve - and it BROKE M1, which is
        the most valuable thing in the memo and deserves credit. But M2 has no
        held-out object on which its verdict is independently recorded, so its
        discriminating power in the FIRING direction is untested outside the
        records it was built from. See OBJ-5.
      second_defect: >-
        The reproduction copied a mathematically false justification and marked it
        correct. See OBJ-4.
      producer_own_disclosure_credited: >-
        Section 11 and the proof-search-map reproduction_limitation both disclose
        that the reproduction is against the STATED arguments in the two findings
        records and NOT against experiments/EXP-GGM-001/simulability_test.py, which
        was outside read_scope. That disclosure is accurate and is the reason I can
        localise the defect rather than merely suspect it. It does not repair the
        circularity, because a disclosed circular control is still circular.

  objections:
    - id: OBJ-1
      severity: major
      title: 'The stated licensing chain certifies strictly less than the verdict claims, by the producer own method ceiling'
      evidence: >-
        (a) proof-search-map.yaml method_ceiling.strongest_certifiable_claim, opened
        and quoted - the method 'can certify NOTHING about (a) any oracle whose
        output is not so determined, (b) ECDLP hardness itself, (c) any non-generic
        attack, or (d) the real cost of any algorithm on a real curve. In particular
        it can never certify a lower bound in the structured GGM, because Shoup
        theorem does not hold there.' (b) KN-LIT-7606, opened and quoted BY THE MEMO
        ITSELF in section 6.4 - 'A plain-GGM simulability argument cannot close a
        candidate for real elliptic curves'. Plain GGM is the strict model, which is
        the branch the D1 closure lives in. (c) KN-TECH-005 Applicability limits -
        'The bound is a barrier, NOT a proof that no non-generic attack exists.'
      the_defect: >-
        ECDLP-IDEA-436 is a proposal about attacking real ECDLP. A certification
        that says nothing about the real cost of any algorithm on a real curve
        cannot, on its own, be the ground for rejecting it. The memo applies
        KN-LIT-7606 scoping discipline to D2 (via M1, structured branch) and not to
        D1 (via M2, strict branch), even though KN-LIT-7606 sentence is about the
        PLAIN, i.e. strict, model.
      why_the_verdict_nevertheless_survives: >-
        Because the memo has a second, independent, MODEL-FREE ground it does not
        foreground. Corollary 4.3 identifies D1 with equality in <S>/{+-1}. That
        quotient is computable for free in E(F_p) by ONE x-coordinate comparison.
        So a real, non-generic, coordinate-holding adversary given D1 gains
        strictly zero information and strictly zero computational leverage - not
        'O(1) overhead', literally nothing. That argument needs no model, no Shoup,
        no Fork-A branch, and it defeats non-generic adversaries too, which the GGM
        argument by construction cannot.
      repair_action: >-
        Re-issue section 0 verdict on the model-free ground - D1 is the free
        +-/- fibre indicator, computable in one F_p comparison, therefore zero
        leverage for ANY adversary - and demote the strict-GGM simulator, Shoup, and
        the phrase 'closed at exponent 1/2' to corroboration with KN-TECH-005 own
        barrier caveat carried forward verbatim. This is a re-founding, not a
        retraction; it makes the result STRONGER and simultaneously makes it
        independent of OFQ-1.
      status_if_unrepaired: >-
        The recorded claim would rest on a chain the producer own artifact says
        cannot carry it.

    - id: OBJ-2
      severity: major
      title: 'The closure step needs n prime, and no stated hypothesis supplies it'
      evidence: >-
        KN-TECH-005 frontmatter complexity field, opened and quoted verbatim -
        'Omega(sqrt(p)) group operations for any generic DLP algorithm (p = largest
        prime factor of the group order)'. ECDLP-IDEA-436 Assumption 1 and the memo
        section 1.1 and section 10 scope block state only gcd(n,p) = 1, never that
        n is prime. proof-search-map quantifier_order.claim_d1 quantifies over all
        n with gcd(n,p) = 1, and method_ceiling concludes 'cannot bring any
        algorithm below Omega(sqrt(n)) group operations'.
      the_defect: >-
        For composite n, Pohlig-Hellman reduces a generic DLP to the largest prime
        factor, so 'Omega(sqrt(n))' and 'closed at exponent 1/2' are false as
        stated. KN-FIND-b7e091, the record whose argument style the memo extends,
        DOES carry the hypothesis - 'For prime-order prime-field elliptic curves' -
        and the memo dropped it while widening the quantifier. The Proposition and
        the simulator themselves are unaffected; only the exponent conclusion is.
      repair_action: >-
        Add 'n prime' to section 1.1 and to the section 10 scope block, or restate
        the exponent as 1/2 in the largest prime factor of n. One line, zero
        compute, and it is the same hypothesis the parent record already carries.

    - id: OBJ-3
      severity: major
      title: 'Misattribution of the caveat the nearby-object control actually establishes, and an adjacent contradiction with KN-FIND-002 recorded tier'
      evidence: >-
        Memo section 6.4 - 'This is also exactly the caveat KN-FIND-002 records
        against itself'. proof-search-map control_verdict - the fired sub-control
        'independently re-derives the caveat KN-FIND-002 records against itself'.
        KN-FIND-002 actual caveat, opened and quoted in full - 'The classification
        uses the structured GGM (curve equation is public), not the strictest Shoup
        GGM (opaque labels). Under the strictest GGM, jet and endomorphism would be
        NON-SIMULABLE because they require coordinate access.'
      the_defect: >-
        Those are two different caveats, and arguably opposite in polarity.
        KN-FIND-002 discloses that its oracles would be LESS simulable under the
        strict model. It does NOT disclose that its own closure is UNCERTIFIABLE
        under the structured model it declares. The caveat the memo section 6.4
        control actually establishes is the second one, and the producer states
        that principle correctly in its own method_ceiling - 'it can never certify
        a lower bound in the structured GGM, because Shoup theorem does not hold
        there' - without drawing the consequence for KN-FIND-002.
      the_consequence_the_producer_did_not_draw: >-
        KN-FIND-002 records the jet oracle (C=1) and the endomorphism oracle (C=0)
        as 'SIMULABLE with O(1) overhead (closed at exponent 1/2 by KN-TECH-005)'
        while declaring the structured GGM as its model. Combining the producer own
        method ceiling with the producer own anomalous-curve control, no such
        certification is available in that model. The supportable tier for those two
        oracles is the RELATIVE tier the memo correctly assigns to its own D2 - 'no
        advantage over an adversary that already holds F_p coordinates' - not an
        absolute exponent-1/2 closure. KN-FIND-002 is status established, confidence
        strong, backed by EV-GGM-001 and DEC-20260726-007. KN-LIT-7606 already flags
        this in its Relevance block, quoted here - it names KN-FIND-002 as the
        target and says a plain-GGM simulability argument cannot close a candidate
        for real elliptic curves.
      claim_tier_of_this_objection: >-
        Red-team objection at DERIVATION tier, zero runs, single session. I am not
        asserting it as established and it changes no status. It is filed for
        routing.
      repair_action: >-
        (i) Correct the two misattributing sentences in the memo and the
        proof-search-map by erratum. (ii) The Coordinator opens a SEPARATE round on
        KN-FIND-002 tier, which is a contradiction of validated evidence and
        therefore runs at review-breakthrough, max, degradable false, per AGENTS.md
        rule 12. It must not be folded into this round - see the escalation block.

    - id: OBJ-4
      severity: medium
      title: 'Control B reproduced a mathematically false justification and marked it correct'
      evidence: >-
        KN-FIND-b7e091, opened and quoted - 'For prime-order prime-field curves with
        End_{F_p}(E) = Z, every phi = [m], so phi(Q) = [m]Q is computable in m group
        operations from Q alone.' Memo section 6.2 - 'for prime-order prime-field
        curves End_{F_p}(E) = Z, so phi = [m] ... Matches KN-FIND-b7e091 exactly.'
      the_defect: >-
        End_{F_p}(E) = Z is false for EVERY elliptic curve over a finite field. The
        p-power Frobenius pi_p lies in End_{F_p}(E) and has degree p, while [m] has
        degree m squared; p prime is not a perfect square, so pi_p is not [m] for
        any m, hence End_{F_p}(E) strictly contains Z. This is a one-line degree
        argument requiring no computation. Provenance of the degree facts - recalled,
        standard theory of elliptic curves over finite fields; the internal claim it
        contradicts is `internal` and was opened and quoted above.
      what_survives: >-
        The CONCLUSION survives under a corrected argument. On a prime-order
        subgroup <G> of E(F_p) of order l, E(F_p)[l] is the one-dimensional
        lambda = 1 eigenspace of Frobenius, any phi in End_{F_p}(E) preserves it and
        acts on it as a scalar lambda_phi mod l, and lambda_phi is a root mod l of
        phi public characteristic polynomial and is therefore computable in
        polynomial time. So phi(Q) = [lambda_phi]Q, computable in O(log l) group
        operations by double-and-add - NOT 'm group operations', which as literally
        written is Omega(l) by repeated addition and would not be a constant- or
        even a log-overhead simulation at all.
      why_it_matters_here: >-
        This is the concrete demonstration that Control B validates recorded PROSE
        rather than mathematics. A control that reproduces a record wrong reason
        with a check mark has told the reader nothing about the record.
      repair_action: >-
        Correct memo section 6.2 to the eigenvalue argument with the O(log l) cost,
        and file the KN-FIND-b7e091 defect as a second candidate correction for the
        same Coordinator-opened round as OBJ-3.

    - id: OBJ-5
      severity: medium
      title: 'Control B has no held-out object for M2; the reported 4/4 is a fit statistic on the training set'
      evidence: >-
        All four oracles used in the memo section 6.1 to 6.3 baseline reproduction
        (jet, endomorphism, elliptic-net, incidence) are the four oracles
        KN-FIND-002 classifies, and M1 and M2 are abstractions of KN-FIND-002 own
        reasoning about them. proof-search-map baseline_embedding.parameter_slice
        makes this explicit - 'oracle in {jet, endomorphism, elliptic-net,
        incidence}'.
      the_defect: >-
        docs/inventor-protocol.md section 3 requires the identical measurement
        against a null object of the same shape before belief. Here the analogue is
        a HELD-OUT object whose verdict is recorded elsewhere. There is exactly one
        (the anomalous curve) and it broke M1 - which is why the control was worth
        running. M2 has none in the firing direction, so its discriminating power is
        asserted rather than measured.
      repair_action: >-
        Run M1 and M2 on one oracle class recorded OUTSIDE KN-FIND-002 and
        KN-FIND-b7e091 - the cheapest candidates are a MOV/pairing oracle on a
        low-embedding-degree curve (KN-TECH-032, referenced from KN-TECH-033
        Applicability limits) where the correct verdict is not-closed, and a
        Weil-descent / index-calculus-over-extension-fields oracle, which
        KN-LIT-7606 names as the canonical genuine non-generic algorithm and which
        is therefore the strongest available inconvenient object. Zero compute.

    - id: OBJ-6
      severity: major
      title: 'M2 is stated ambiguously, and on its natural unbounded reading it also proves too much'
      evidence: >-
        Memo section 6, move M2, verbatim - 'If that deterministic function further
        factors through group-theoretic predicates (equality, inversion, group law),
        the simulation lifts from A-structured to A-strict.' The statement carries
        no cost bound.
      the_defect: >-
        psi on an anomalous curve IS a group isomorphism onto (F_p,+), so psi(P) is
        determined by P as a group element and psi does 'factor through group
        structure' in the information-theoretic sense - unboundedly, as
        psi(P) = k*psi(G) where P = [k]G and k is pinned down by equality tests. On
        that reading M2 fires on psi and proves too much exactly as M1 does. The
        memo blocks this only by invoking Shoup, i.e. the conclusion. Using one
        criterion for D1 (an exhibited three-line simulator) and a different one for
        psi (absurdity of the conclusion) inside a single control is precisely the
        failure a proves-too-much control exists to catch.
      repair_action: >-
        Restate M2 constructively and with a cost bound - 'M2 fires iff there is an
        EXPLICIT simulator answering each query with O(1) group operations,
        inversions and equality tests on handles.' Under that statement M2 provably
        does not fire on psi (a bounded simulator would give generic DLP in O(1)
        group operations), and D1 is unaffected because the memo exhibits exactly
        such a simulator. Then re-run Control A half 2 against the repaired
        statement and record the outcome; I expect it to pass.

    - id: OBJ-7
      severity: medium
      title: 'The O(1) figure presupposes a handle interface; the frozen family is written with integer indices, and under an integer interface the overhead is O(log n)'
      evidence: >-
        Memo section 5.1 takes A and B as HANDLES. Section 2.2 declares the handle
        reading only in passing and only under Fork B branch B-reduction - 'inv is
        an augmentation the adversary may query on a handle'. ECDLP-IDEA-436 writes
        the frozen family as inv_{j,r}(k), indexed by integers.
      the_defect: >-
        Under an integer-indexed interface the simulator must itself materialise
        handles for [j]S-hat and [k]S-hat, at O(log n) group operations each. That
        overhead is NON-CONSTANT, and under KN-FIND-002 own bookkeeping it lands in
        the elliptic-net tier, whose recorded heading is 'SIMULABLE with non-constant
        overhead (NOT closed at 1/2)'. The memo never states which interface the
        gate is run on, and the two interfaces give two different recorded tiers.
        Relatedly, section 5.1 profile-vector line - '|J| group operations and 2|J|
        equality tests' - omits the cost of materialising the |J| reference handles,
        which is the KN-LIT-7593 pattern the review card names - an eliminated
        dimension is not free until its own cost is in the total. Here the omission
        runs in the producer-favouring direction, since it makes the simulator look
        cheaper and the closure look stronger.
      repair_action: >-
        Promote the interface question to an explicit fourth fork and answer on both
        branches, as the memo already does for Forks A and B - handle interface,
        O(1), closed by the constant-overhead bound; integer interface, O(log n),
        NOT closed by the constant-overhead bound but still no sub-birthday
        advantage, using KN-FIND-002 own elliptic-net language. Also charge the
        reference-handle materialisation in the profile-vector line. Note that the
        model-free ground of OBJ-1 is indifferent to the interface, which is a
        further reason to lead with it.

    - id: OBJ-8
      severity: minor
      title: 'The record hypothesis is a disjunction, so rejecting the RECORD is broader than the memo findings support'
      evidence: >-
        ECDLP-IDEA-436 hypothesis H, verbatim - 'there is a coordinate/valuation
        functional on <S-hat> - concretely a member of the frozen family ... OR a
        fixed statistic of the precision-r coordinate digits of [k]S-hat - that is
        non-constant in k, efficiently invertible, and ...'. The record 'Exactly one
        next executable action' offers the two dispositions as ALTERNATIVES -
        'either recommend scoped rejection under KN-FIND-002 / KN-FIND-b7e091, or
        state precisely which operation of the profile is not simulable by a generic
        group oracle.' The memo does both and does not say which governs.
      the_defect: >-
        Closing one disjunct of a disjunctive hypothesis does not close the
        hypothesis. Every tier statement in the prose is correct (see the Attack 2
        disposition); the over-reach is confined to the single recommendation
        sentence and the single verdict label scoped_rejection_simulable.
      repair_action: >-
        Split the disposition explicitly - D1 rejected in scope; D2 NOT gated,
        returned to the record with the section 10 item 2 sub-question attached.
        The verdict label should read as a two-part disposition rather than a single
        rejection of the record.

    - id: OBJ-9
      severity: minor
      title: 'Broken cross-reference at exactly the sentence that carries the scope limitation'
      evidence: >-
        Memo section 0 - 'The rejection is scoped, and section 7 states exactly what
        it does not cover'. Section 7 is the lossy-projection test and contains no
        scope limitation. The limitation lives in sections 5.4, 9.2 and 10.2.
      why_it_is_worth_recording: >-
        The content IS stated inline in section 0, so nothing is hidden. But a
        reader who follows the pointer to check the scope finds nothing there, which
        is the mechanical route by which correctly-labelled tiers become leaked
        tiers downstream.
      repair_action: 'Point to sections 5.4 and 10 instead of section 7.'

    - id: OBJ-10
      severity: minor
      title: 'Novelty inflation in section 0, contradicted by the memo own section 6.2'
      evidence: >-
        Section 0 - '... by the same closure mechanism as KN-FIND-002 jet oracle and
        KN-FIND-b7e091 endomorphism oracle - and, unlike THOSE TWO, without needing
        the structured-GGM weakening'. Section 6.2 - the endomorphism oracle under
        M2 gives 'collapse succeeds, m group operations, A-strict. Matches
        KN-FIND-b7e091 exactly.'
      the_defect: >-
        KN-FIND-b7e091 endomorphism simulation is already strict-branch and needs no
        structured weakening. The memo strict-branch result is unlike KN-FIND-002
        jet oracle only. As written section 0 claims a distinction from a record the
        memo section 6.2 shows it does not have.
      repair_action: >-
        Replace the phrase `unlike those two` with `unlike KN-FIND-002 jet oracle`.
        One word.

    - id: OBJ-11
      severity: minor
      title: 'Pareto wording contradicts the Pareto numbers in the same deliverable'
      evidence: >-
        Memo section 8 - 'So D1 is dominated on every axis and matched on none.'
        Same section and source-novelty-audit pareto block - sota_delta time
        exponent +0, memory exponent +0, data-or-query exponent +0, constant factor
        +0.
      the_defect: >-
        A delta of +0 on every axis is MATCHED on every axis, not dominated on every
        axis. Strict domination appears only once the query cost of D1 is charged
        against a rho that pays nothing for the same predicate.
      repair_action: >-
        Restate as 'equalled at every exponent and on the constant factor, and
        strictly dominated once the per-query cost of the oracle is charged.'

    - id: OBJ-12
      severity: minor
      title: 'dominated_by is genuinely checked - credit - but two frontier rows are missing'
      dominated_by_field_audit:
        value: 'Pollard rho with the negation map on the x-line, n^{1/2+o(1)} time, O(1) memory'
        is_it_an_unchecked_null: false
        rows_actually_checked: 'rho (time, memory); BSGS (time, memory); generic preprocessing tradeoff S*T^2 = Omega-tilde(n); and an explicit data/query-axis row'
        axes_covered: 'time, memory, data/queries - all three'
        basis_verified: >-
          All three baseline rows are read off KN-TECH-005, which I opened and which
          states each of them - the Omega(sqrt(p)) bound, that it 'matches
          baby-step/giant-step and Pollard rho', and 'S*T^2 = Omega~(n)
          (Corrigan-Gibbs-Kogan, KN-LIT-013)'. The memo also correctly discloses
          that KN-TECH-001 is cited INSIDE KN-TECH-005 and was not opened. Accurate.
      missing_rows:
        - 'van Oorschot-Wiener parallel collision search and its time-memory interpolation, which the review card names explicitly and which the memo does not mention'
        - 'Pohlig-Hellman, which is the row that actually bites here, because it is what makes OBJ-2 an error rather than a pedantry'
      can_the_omission_flip_the_verdict: >-
        No. sota_delta is +0 on every checked axis and, under OBJ-1 model-free
        ground, D1 supplies literally zero information to a coordinate-holding
        adversary, so no additional frontier row can make D1 incomparable. I record
        the gap as a completeness item with that reason attached rather than as a
        fabricated null under AGENTS.md rule 5, which it is not.
      repair_action: 'Add the two rows with the one-line reason above.'

    - id: OBJ-13
      severity: minor
      title: 'Positive-control substitution - the argument-level control is not the record instrument-level positive control'
      evidence: >-
        ECDLP-IDEA-436 - 'Positive: a curve and n where a KNOWN p-adic separation
        exists (e.g. anomalous #E(F_p) = p, where the Smart/SSSA attack applies) -
        THE INSTRUMENT MUST DETECT IT.' Memo section 6.4 uses the same object as a
        proves-too-much object for the ARGUMENT, and reports 'ECDLP-IDEA-436 itself
        names this case as its positive control' - which is true but elides that the
        record names it as a control on an instrument that was never built (zero
        runs).
      the_defect: >-
        Two different controls sharing one object. Compounded by the fact that
        gcd(n,p) = 1 excludes anomalous curves from the Proposition scope entirely,
        so the memo has not answered, and must not be read as answering, whether the
        profile detects the known separation there. Section 10 scope block records
        the exclusion; section 0 does not.
      repair_action: >-
        Distinguish the two controls by name in section 6.4, and carry 'a point
        whose order is divisible by p is outside scope' up into section 0.

    - id: OBJ-14
      severity: medium
      title: 'No null-object control exists, and the reported quantity has exactly the shape a truncation artifact would have'
      what_the_quantity_should_have_done: >-
        The reported quantity is the image size of inv_{j,r}, reported as exactly 2
        for every r. The parameter meant to move it is the precision r -
        ECDLP-IDEA-436 predicted rho_r >= 1/2, i.e. that separating [k]S-hat from
        [j]S-hat would require precision growing with n. The memo reports the
        quantity FLAT in r. Per docs/inventor-protocol.md section 3, a quantity that
        does not move when the parameter meant to move it increases is the canonical
        artifact tell. Here flatness is a DERIVED claim rather than a measurement,
        so the tell does not fire automatically - but it converts directly into a
        demand for the measurement, because a finite-precision implementation would
        ALSO report flatness, and can never observe +infinity, only 'at least r'.
      what_is_missing: >-
        Zero runs, therefore zero null objects. ECDLP-IDEA-436 own declared negative
        control - 'random profiles with the same precision budget and no scalar
        dependence' - was not run. KN-OPEN-3417fc own negative-resolution criterion
        is explicitly a measurement - 'Resolved negatively (scoped) by MEASURING a
        stated family of coordinate functionals at toy p' - and was not run. The
        memo is right that the gate licenses skipping the instrument; it is not
        right that a zero-run derivation therefore needs no control.
      repair_action: 'Run the cheapest_falsification_control below. Minutes of compute, toy scale.'

    - id: OBJ-15
      severity: minor
      title: 'Recorded in good faith in the producer favour - three places the memo UNDERSTATES its own result or its own scope'
      items:
        - >-
          'E/F_p ordinary' and 'p >= 3' are inherited from KN-TECH-73630e scope
          labels and are used by NEITHER lemma. Lemma 1 needs good reduction and
          gcd(n,p) = 1; Lemma 2 needs a Weierstrass model. The Proposition therefore
          also covers supersingular curves, and on a general Weierstrass equation
          the negation map is (x,y) -> (x, -y - a1*x - a3), so x(-P) = x(P) holds in
          characteristic 2 as well. The scope is over-restrictive rather than
          insufficient. Flagged here and deferred - J1 owns p = 2 and p = 3.
        - >-
          D1 is the exact functional KN-OPEN-3417fc names as its OWN headline
          example - 'for instance the profile v_p(x([k]S-hat) - x([j]S-hat))'. The
          memo is correct not to claim closure of the open problem, which quantifies
          over any computable functional, but the Coordinator should know that the
          object killed is the open problem own worked example, which makes the
          result more consequential than 'one named family' conveys.
        - >-
          Memo section 8 computes reciprocal informative-query density delta = 1/2
          'under adaptive references'. ECDLP-IDEA-436 Assumption 3 FORBIDS post-hoc
          selection of (j, r) - 'Post-hoc selection of (j, r) after seeing the scalar
          is forbidden advice and scores zero.' Under the frozen contract the
          reference is fixed, delta = 1, and lambda >= 1, so the record own promotion
          gate fails harder than the memo reports. The memo chose the reading more
          favourable to the idea, which is the correct direction, and should say so.

  red_team_resource_reading:
    id: RTF-1
    obligation: 'agents/red-team.md responsibility 8 - run the reversal against the obstruction the record just measured'
    the_obstruction_as_measured: 'image size exactly 2, precision r inert, rho_r = 0'
    which_theory_wants_this_measurement: >-
      The memo section 10 item 3 says of functionals of three or more lifted points
      that 'Whether it collapses by a similar route is open'. That can be sharpened,
      and the sharpening is the useful part of the obstruction. The collapse is not
      a pairwise-versus-multipoint phenomenon; it is RIGIDITY. Lemma 1 puts every
      lifted x-coordinate in Z_p reducing to its F_p value, so for ANY polynomial
      functional F of several lifted coordinates, v_p(F) = 0 unless F vanishes mod p.
      Two-valuedness needs the SECOND step - that F vanishing mod p forces F to
      vanish EXACTLY in Q_p - and for the pairwise x-difference that is supplied by
      Lemma 2 +-/- fibre structure holding on both sides. For a general multi-point
      functional that step fails - a determinant, a resultant, or a
      division-polynomial value can vanish mod p without vanishing in Q_p - and then
      v_p takes a FINITE value at least 1 and the precision r stops being inert.
    consequences_for_the_search: >-
      (i) The route provably does NOT extend to general multi-point functionals, so
      section 10 item 3 can be upgraded from 'open' to 'the collapse mechanism
      demonstrably does not reach here, and the exact separator is rigidity of the
      mod-p vanishing locus'. (ii) It also predicts which multi-point functionals
      DO still collapse, for free and with no new work - any product of pairwise
      differences (a Vandermonde in the x-coordinates) and any functional whose
      vanishing encodes a group-law relation (the collinearity determinant, which
      vanishes iff P1 + P2 + P3 = O). (iii) The first genuinely untried object is
      therefore a multi-point functional whose mod-p vanishing locus is NEITHER a
      union of +-/- fibres NOR a group-law relation. That is a much narrower target
      than 'three or more points'.
    claim_status: >-
      Candidate for ranking, NEVER evidence. Derivation tier, zero runs, produced in
      this red-team session and not independently checked. It changes no status and
      supports no promotion. It is testable by part three of the falsification
      control below.
    spawned_ids: []
    spawned_ids_note: >-
      No identifier minted. Minting a KN-OPEN or IDEA record is the Coordinator
      authority, not mine, and this reading belongs in the ranking queue rather than
      in the corpus until someone runs the control.

  baseline_comparison:
    pollard_rho: >-
      n^{1/2+o(1)} time, O(1) memory, and it ALREADY exploits the <S>/{+-1} quotient
      via the negation map. D1 supplies exactly that quotient and nothing else
      (Corollary 4.3), so rho with the negation map is the correct dominator and the
      memo names it correctly. One caveat the memo does not carry - the negation-map
      speedup on the x-line is not free in practice, because the +-/- walk introduces
      fruitless cycles requiring a correction that consumes part of the saving
      (provenance: recalled, standard; not load-bearing). This only makes the
      baseline slightly optimistic in the PRODUCER favour, and cannot change a
      sota_delta of +0.
    bsgs: >-
      n^{1/2+o(1)} time and n^{1/2+o(1)} memory. D1 offers no memory axis, since the
      simulator replaces the oracle with O(1) group work; correctly assessed.
    closest_specialized_baseline: >-
      The anomalous additive transfer (KN-TECH-033, Smart / Satoh-Araki / Semaev),
      which KN-TECH-033 identifies as 'the one place where lifting to characteristic
      zero is known to pay' - i.e. the only recorded case where the p-adic apparatus
      D1 uses actually buys anything. It is EXCLUDED from the gated scope by
      gcd(n,p) = 1, so the memo neither beats it nor is measured against it, and the
      scoped rejection must not be read as saying anything about it. This is the
      single most important scope sentence of the round and it appears in section 10
      but not in section 0.
    verdict: >-
      The baseline comparison is correct and honestly signed. D1 equals rho on every
      exponent and beats nothing. There is no regime in which D1 is incomparable.

  heuristic_challenges:
    - >-
      There are no numbered heuristics to challenge - this is a derivation, not a
      heuristic-conditional exponent claim in the docs/target-result-profile.md
      exemplar shape, and it correctly does not present itself as one. The
      exemplar-style challenge list of agents/red-team.md therefore mostly does not
      apply, and I record that rather than manufacturing objections to fill it.
    - >-
      The one place the exemplar discipline DOES bite is scale honesty. The memo
      tested scale is zero (zero runs) and it says so plainly in five separate
      places. Its transfer assumption is that a derivation over stated hypotheses
      needs no measurement. That assumption is defensible for the Proposition and
      indefensible for the control (see OBJ-14), because a truncation artifact and a
      mathematical degeneracy produce the same reported number.
    - >-
      Cost bookkeeping in the exemplar sense - per-attempt cost times inverse success
      probability - is present and correctly done. Corollary 4.2 gives success
      probability 2/n per query against a fixed reference and the memo carries it
      into lambda through the delta term rather than silently setting it to 1. Credit.

  cost_model_challenges:
    - id: CM-1
      challenge: 'Is the O(1) end-to-end, or is something off-book?'
      audit: >-
        Charged and disclosed - the one inversion, the two equality tests, the third
        equality test against the identity handle for the k = 0 mod n degenerate case
        (section 5.3), and the explicit statement that no coordinate access, Hensel
        lifting, p-adic arithmetic or field arithmetic of any kind is performed.
        Fork C states the accounting convention up front and section 5.4 states
        exactly where that convention can hide an attack, which is unusually honest.
      off_book_items_found:
        - 'materialisation of the reference handle(s) - see OBJ-7'
        - 'the interface question that decides whether the overhead is O(1) or O(log n) - see OBJ-7'
      not_off_book: >-
        The k = 0 mod n convention IS handled (section 5.3) and the memo explicitly
        notes the frozen family leaves it unstated, so the reviewer does not have to
        infer it. The reference set J when queried as a profile vector IS addressed,
        though under-charged. Identity handling IS charged.
    - id: CM-2
      challenge: 'Does the o(1) / polylog cofactor hide anything, as the exemplar profile requires be checked?'
      audit: >-
        No. The memo states 'O(1) here is literally one inversion and two equality
        tests, not an o(1) exponent', which is the correct and strongest form of the
        disclosure. There is no o(1) term to interrogate.
    - id: CM-3
      challenge: 'Memory'
      audit: >-
        The simulator is stateless beyond two handles, so memory is O(1) and the
        memory axis is genuinely non-issue here. The memo does not state this
        explicitly; it should, because AGENTS.md target-result-profile requires
        memory beside time in every asymptotic claim. One line.
    - id: CM-4
      challenge: 'van Oorschot-Wiener time-memory interpolation back to the old baseline'
      audit: >-
        Not performed and not mentioned. It cannot change the verdict here (see
        OBJ-12) because the candidate offers no memory or parallelism axis at all,
        but the review card asks that it be checked and I record that it was not.

  reduction_and_scope_challenges:
    - id: SC-1
      question: 'Is the stated scope sufficient for EVERY step?'
      answer: 'No. One hypothesis is needed and not listed.'
      detail: 'n prime, or the exponent restated in the largest prime factor of n. See OBJ-2.'
    - id: SC-2
      question: 'Does any step need a hypothesis the record does not have?'
      answer: >-
        The Weierstrass model with Z_p coefficients is stated in the memo section 1.1
        but not in ECDLP-IDEA-436 Assumption 1. I do NOT treat this as smuggled - it
        is the standard minimal-model consequence of good reduction, and the frozen
        family notation x([k]S-hat) already presupposes a distinguished coordinate.
        Recorded so the next reader does not have to re-derive that judgement.
    - id: SC-3
      question: 'Is any hypothesis listed but unused, i.e. is the scope over-narrow?'
      answer: 'Yes - ordinary, and p >= 3. See OBJ-15. This is understatement, not overclaim.'
    - id: SC-4
      question: 'Is the affected-versus-safe scope inflated?'
      answer: >-
        No. The memo section 9 makes seven explicit non-claims, including no closure
        of KN-OPEN-3417fc, no closure of face F2 beyond KN-TECH-73630e, no usefulness
        claim in either direction, no Fork-A adjudication and no impossibility claim.
        I checked each against the records it names and found no inflation. The
        Coordinator snapshot receipt scientific_boundary is equally well scoped. This
        is the strongest part of the deliverable.
    - id: SC-5
      question: 'Are cited reductions validly instantiated with their hypotheses checked?'
      answer: >-
        The only imported theorem is Shoup via KN-TECH-005. Its hypotheses are (i)
        the strict opaque-label model - satisfied by construction on branch A-strict,
        and (ii) the exponent stated in the largest prime factor of the group order -
        NOT satisfied, see OBJ-2. Its own applicability limit ('a barrier, NOT a
        proof that no non-generic attack exists') is not carried forward into
        section 0, see OBJ-1.

  proof_architecture_challenges:
    - attack: quantifier_order
      finding: >-
        The D1 quantifier order is genuinely the strong uniform one - the existential
        witness Sim is inside all universals and depends on no instance, seed,
        characteristic, precision or reference. I checked the claimed dependency
        audit against the simulator itself - three lines, mentions no curve
        parameter, and r enters only as an input returned as the cap - and it holds.
        The D2 order is correctly recorded as weaker and guarded by a model proviso.
        No silent witness-after-instance selection. PASSES.
    - attack: method_ceiling
      finding: >-
        The ceiling is stated honestly and it does NOT reach the headline as the
        headline is written. That is the OBJ-1 finding, and it is a case of the
        producer own audit refuting the producer own framing - the most useful thing
        a proof_search_map can do. BREAKS the stated framing; the result survives on
        another ground.
    - attack: nearby_object
      finding: 'Ran, fired on M1, correctly localised. See Control A. PASSES with the OBJ-6 repair.'
    - attack: observation_fiber
      finding: >-
        Ran by me directly. Hold the claimed invariant (the returned value of
        inv_{j,r}) fixed and vary the object - can two k with the same profile land
        on opposite sides of the conclusion? Trivially yes, and the memo says so
        itself in Corollary 4.2 - the profile is a 1-bit indicator, so all n - 2
        values of k off the +-/- fibre share one profile value. That is not a defect;
        it IS the finding. The missing separator is everything, which is exactly what
        makes the family useless. Consistent.
    - attack: boundary_and_strictness
      finding: >-
        The old method (rho with the negation map) is genuinely embedded as the
        boundary and the candidate is NOT strictly better - it is equal at every
        exponent and worse once queries are charged. Correctly signed, with the
        wording defect of OBJ-11.
    - attack: compositional_invariant
      finding: >-
        Deleting Lemma 2 second clause (that x(P) = x(P-prime) implies P-prime = +-P
        over Q_p) is what breaks first, and it is exactly the step RTF-1 identifies
        as the rigidity hinge. Deleting Lemma 1 breaks the case-one branch. Both
        components are load-bearing and neither is decorative.

  escalation_determination:
    ofq_1_as_the_producer_states_it: >-
      'Neither record states a single canonical model for this program' and 'until
      one is declared canonical ... every closed at exponent 1/2 in this program
      corpus carries an unstated model parameter.'
    my_determination: 'SCOPING OBSERVATION, NOT A CONTRADICTION. The escalation condition of the review plan DOES NOT FIRE on OFQ-1 as stated.'
    reasoning: >-
      I opened both records and established the branches independently. KN-FIND-002
      DECLARES its branch in its own scope block. KN-FIND-b7e091 does not declare
      one, but every argument in it is strict-branch and its Oracle A verdict
      (non-simulable) is the strict-branch verdict. Neither record asserts a
      canonical model for the program, so neither is contradicted by the observation
      that they differ. The two are consistent with each other once the branch is
      supplied, which is precisely what the memo section 6.1 shows. OFQ-1 is true,
      useful, and scoping.
    but_i_am_not_absorbing_this: >-
      A DIFFERENT proposition, which the producer did NOT raise and which is not
      OFQ-1, does contradict prior validated evidence. It is stated in full at OBJ-3
      and OBJ-4 and summarised here so it cannot be lost - (i) KN-FIND-002 records
      the jet and endomorphism oracles as closed at exponent 1/2 while declaring the
      structured GGM, and the producer own method_ceiling plus the producer own
      anomalous-curve control together entail that no such certification exists in
      that model; the supportable tier is relative, not absolute. (ii)
      KN-FIND-b7e091 Oracle-D justification, End_{F_p}(E) = Z, is false for every
      elliptic curve over a finite field by a one-line degree argument, though its
      conclusion survives under a corrected argument at a corrected cost. Both
      records are validated - KN-FIND-002 is status established, confidence strong,
      EV-GGM-001 and DEC-20260726-007; KN-FIND-b7e091 is confidence proved,
      evidence_level theorem_backed, EV-GGM-79e710 and DEC-20260804-3b4258.
    routing_recommendation: >-
      Do NOT re-run THIS round at review-breakthrough. Re-running it would not help -
      the D1 verdict does not depend on KN-FIND-002 or KN-FIND-b7e091 in either
      direction, and under the OBJ-1 repair it does not depend on the GGM at all, so
      the contradiction is collateral to this joint rather than load-bearing on it.
      Instead, the Coordinator opens a SEPARATE round whose subject is the recorded
      tier of KN-FIND-002 and the recorded justification of KN-FIND-b7e091. THAT
      round is a contradiction of validated evidence and must run at
      review-breakthrough, max, degradable false, per AGENTS.md rule 12 and the
      routing_rules unrecoverable-result-review the review plan names. My findings
      are the input to that round, at derivation tier, not its conclusion.
    what_would_change_this_determination: >-
      If the Coordinator judges that OFQ-1 and my OBJ-3 are the same observation
      rather than two, then escalation fires on OFQ-1 and this round re-runs. I do
      not think they are the same - OFQ-1 says the parameter is unstated; OBJ-3 says
      that on one of its two values the closure is unavailable - but that is a
      composition judgement and it is the Coordinator to make, so I state the
      alternative explicitly rather than deciding it silently.

  required_controls:
    - id: RC-1
      control: 'Toy-scale exact tabulation of D1 with a null-lift control and a three-point probe'
      is_the_cheapest_falsification_control: true
      why_this_one: >-
        It is the single cheapest thing that settles what I find most doubtful, and
        it settles three separate items at once - it supplies the null object the
        deliverable entirely lacks (OBJ-14), it is the toy-p measurement
        KN-OPEN-3417fc own negative-resolution criteria explicitly ask for, and it
        tests RTF-1.
      protocol:
        setup: >-
          One small ordinary E/F_p with p around 1009, S of prime order n with
          gcd(n,p) = 1, minimal Weierstrass model. Hensel-lift S to the canonical
          order-n point S-hat at p-adic precision r = 8.
        part_1_prediction_test: >-
          Tabulate v_p(x([k]S-hat) - x([j]S-hat)) for all 1 <= j < k < n. PREDICTED
          by the Proposition - the image is contained in {0, at least 8}, and the
          'at least 8' set is exactly {k congruent to +-j mod n}. A single observed
          value strictly between 1 and 7 falsifies the Proposition outright and is
          precisely the counterexample the review plan prior says would change the
          Coordinator mind.
        part_2_null_object: >-
          Repeat the IDENTICAL tabulation with S-hat replaced by an arbitrary Hensel
          lift of S that does NOT satisfy the order-n condition, so that Lemma 1
          torsion-freeness step does not apply. PREDICTED - intermediate valuations
          DO occur. If the null lift ALSO yields only {0, at least 8}, then the
          observed flatness is an artifact of the p-adic library precision handling
          rather than a consequence of the canonical lift, and the memo mechanism is
          not what produces the number. This is the discriminating half and it is the
          half nobody has run.
        part_3_rtf_1_probe: >-
          On the same canonical lift, tabulate v_p of one NON-RIGID three-point
          functional - for example v_p(x([k1]S-hat)*x([k2]S-hat) - x([k3]S-hat)) -
          alongside one RIGID one (the Vandermonde, i.e. the product of the three
          pairwise differences). PREDICTED by RTF-1 - the Vandermonde is two-valued
          exactly as D1 is, and the non-rigid functional takes finite values at least
          1, showing the collapse does not extend and the memo section 10 item 3 is
          correctly left open but can be sharpened.
      cost: 'single toy curve, well under one CPU-minute, no cryptographic scale, no new theory, one short script'
      what_it_cannot_do: >-
        It cannot confirm +infinity - a finite-precision computation observes only
        'at least r'. That limitation is exactly why part 2 is required, and it must
        be stated in whatever record reports the outcome.
    - id: RC-2
      control: 'Re-run Control A half 2 against the repaired, cost-bounded statement of M2 (OBJ-6). Zero compute.'
    - id: RC-3
      control: >-
        Add one held-out object to Control B, outside KN-FIND-002 and KN-FIND-b7e091
        - a MOV/pairing oracle (KN-TECH-032) or a Weil-descent / extension-field
        index-calculus oracle, which KN-LIT-7606 names as the canonical genuine
        non-generic algorithm. Zero compute. See OBJ-5.
    - id: RC-4
      control: >-
        A frozen regression fixture against experiments/EXP-GGM-001/simulability_test.py,
        which the producer names as available future work and which was outside its
        read_scope. This is the only control that would make Control B a
        reproduction of an IMPLEMENTATION rather than of prose.

  counterexample_or_mutation: >-
    I did not find a counterexample to the inference, and I was not asked to look for
    one to the Proposition (J1 owns it, and I granted it throughout). The productive
    MUTATION is RC-1 part 3 - mutate the functional from a rigid pairwise difference
    to a non-rigid multi-point functional and watch the two-valuedness disappear.
    That mutation is what shows the collapse is a property of RIGIDITY rather than of
    p-adic lifts, coordinates, or valuations, and it is the cheapest way to see that
    the obstruction the memo measured does not reach the neighbours it declines to
    close.

  narrowest_supported_statement: >-
    Under ECDLP-IDEA-436 Assumption 1 as written (E/F_p with good reduction, p >= 3,
    S of order n with gcd(n,p) = 1) on a Weierstrass model, and GRANTING the
    Proposition, which J1 owns and which I did not re-check - the primary named
    functional D1, inv_{j,r}(k) = v_p(x([k]S-hat) - x([j]S-hat)) truncated at r, is
    exactly the indicator of the fibre k congruent to +-j mod n. It is therefore
    computable from F_p data alone by a single x-coordinate comparison, for every r,
    and gives a real coordinate-holding adversary strictly zero information and
    strictly zero computational leverage beyond the <S>/{+-1} quotient that Pollard
    rho negation map already uses. THAT is a model-free ground for rejecting D1 in
    scope, and it triggers ECDLP-IDEA-436 own contractual gate ('if the functional
    family is simulable, this record is rejected without running anything').
    SEPARATELY and MORE WEAKLY - D1 is simulable in the strict Shoup GGM with one
    inversion and two equality tests, on a handle interface; by this program
    KN-TECH-005 convention that is recorded as 'closed at exponent 1/2', but that
    phrase additionally requires n prime, and per KN-LIT-7606 and KN-TECH-005 own
    applicability limits it is a barrier statement about generic algorithms that
    cannot by itself close a candidate against real elliptic curves. NOT SUPPORTED -
    any rejection of the D2 disjunct, any closure of KN-OPEN-3417fc, any statement
    about functionals of three or more lifted points, non-Weierstrass models, bad or
    additive reduction, or curves with p dividing n, which includes the anomalous
    curves ECDLP-IDEA-436 names as its own positive control.

