        The classification uses the structured GGM (curve equation is
        public), not the strictest Shoup GGM (opaque labels). Under the
        strictest GGM, jet and endomorphism would be NON-SIMULABLE because
        they require coordinate access.
      - 'SIMULABLE with non-constant overhead (NOT closed at 1/2)'
    quotation_fidelity: >-
      Each quotation was copied from the opened file. Markdown emphasis
      markers present in the source were dropped in the memo's inline
      quoting; no word order, term, or numeral was altered.
    used_for: >-
      The baseline the gate memo's argument must reproduce, and the source of
      the structured-versus-strict GGM distinction that Fork A formalises.
    limitations: >-
      Its own scope block records proof_status derivation, that the test
