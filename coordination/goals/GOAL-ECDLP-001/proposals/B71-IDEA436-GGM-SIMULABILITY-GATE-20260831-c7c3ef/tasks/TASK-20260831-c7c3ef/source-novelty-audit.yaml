audit_conclusion: >-
  Novelty is adaptation for the two load-bearing steps (the two-valued
  collapse and its strict-GGM simulator), known for the fired proves-too-much
  control, and unverified for the bad-reduction adjacency. No claim exceeds
  the internal, kb, or retrieved evidence actually opened in this task, and
  the one failed fetch is cited only for a textbook fact that the memo does
  not lean on. The four mandated records were opened in full and quoted
  verbatim. The verdict scoped_rejection_simulable is a negative gate result
  on one named functional family; it asserts no attack, no speedup, no
  hardness claim, no usefulness claim in either direction, and no resolution
  of the open problem the family was drawn from.
