  rationale: >-
    Every frontier row above was checked before dominated_by was written, so
    the value is not an unchecked null. The honest summary is that this task
    claims no result on the frontier at all: it is a negative gate verdict on
    a candidate family, and Pollard rho remains the realized frontier for the
