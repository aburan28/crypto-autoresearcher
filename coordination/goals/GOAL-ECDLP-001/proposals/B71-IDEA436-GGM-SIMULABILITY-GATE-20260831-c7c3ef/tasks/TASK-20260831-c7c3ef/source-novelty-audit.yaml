        For prime-order prime-field curves with End_{F_p}(E) = Z, every phi =
        [m], so phi(Q) = [m]Q is computable in m group operations from Q
        alone.
      - 'Oracle A (first-jet): non-simulable but privately computable (requires k).'
    quotation_fidelity: 'Verbatim from the opened file; markdown emphasis markers dropped, no other change.'
    used_for: >-
      The exact style of simulability argument the task required this gate to
      apply to the new oracle, and the second branch of the proves-too-much
      control.
    limitations: >-
      Its incidence-oracle definition (which factor-base subsets sum to Q,
      simulable in O(m)) is narrower than KN-FIND-002's incidence oracle
