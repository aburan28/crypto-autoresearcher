  - id: KN-TECH-73630e
    path: knowledge/techniques/KN-TECH-73630e.md
    provenance: internal
    opened_in_task: true
    read_depth: full_file
    quotations_used_in_memo:
      - >-
        S-hat is a deterministic function of S, computable to any precision
        from E(F_p) data alone by Hensel lifting plus the order condition.
      - >-
        It can only be escaped by an invariant that is not group-theoretic --
        one reading the p-adic coordinates or valuations of [k]S-hat -- and
        such an invariant would offer at most a computational handle, never an
        information gain.
    quotation_fidelity: >-
      Verbatim apart from ASCII transliteration of the source's S-hat
      typography and removal of markdown emphasis. No claim wording changed.
    used_for: >-
      Lemma 1 (torsion-freeness of the formal group away from p), Lemma 2's
      commuting-with-negation step (reduction on prime-to-p torsion is a group
      isomorphism), Fork B's resolution, and the boundary the memo is
      forbidden to cross.
    limitations: >-
      Its own scope labels are DERIVATION under good reduction, p >= 3,
      gcd(n,p) = 1, no experiment run. It is deliberately restricted to
      group-theoretic invariants and therefore does NOT itself answer the
      coordinate-valuation question; the memo's Proposition 4 is a separate
      derivation and is not attributed to this record.
  - id: KN-TECH-06bb4e
    path: knowledge/techniques/KN-TECH-06bb4e.md
    provenance: internal
    opened_in_task: true
    read_depth: full_file
    quotations_used_in_memo:
      - >-
        F2, local, torsion, formal-group annihilation. The order-n lift is
        unique and preserves T-hat = m S-hat, but the only known route to a
        computable logarithm multiplies by n and yields O-hat = m O-hat.
    quotation_fidelity: >-
      The F2 row is reproduced in substance with the table typography flattened
      to prose; the obstruction name and the annihilation identity are exact.
    used_for: >-
      Placing the gated family in face F2 and confirming the memo closes
      nothing in that taxonomy beyond what KN-TECH-73630e already recorded.
    limitations: >-
      Its own scope-and-limits section states it is a classification
      instrument, LITERATURE-DERIVED and MODEL-BOUND, that Silverman's
      exhaustiveness assertion is the author's framing and not a theorem, and
      that this program does not treat it as one. The memo does not use it as
