provenance_policy: >-
  Every entry below carries one of recalled, retrieved, kb, or internal.
  internal means a committed record of this repository opened and read in
  this task. kb means a committed knowledge/ corpus record located by grep
  and read in full in this task; this session had no crypto-kb MCP retrieval
  call available, so kb here means corpus-resident-and-opened, which is
  disclosed rather than upgraded. retrieved means an external source that
  this session fetched, at the reading depth stated per entry. recalled means
  no source was opened; a recalled entry is a pointer for a reviewer and
  supports nothing, may not back a coordinator decision, and may not support
  a novelty status of known or adaptation. The mandated four records
  KN-FIND-002, KN-FIND-b7e091, KN-TECH-73630e and KN-TECH-06bb4e were each
  opened in full and every quotation attributed to them in the gate memo is
  verbatim from the opened file.

