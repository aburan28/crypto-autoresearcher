pareto:
  dominated_by: >-
    Pollard rho with the negation map, at n^{1/2+o(1)} time and O(1) memory.
  dominance_check_complete: true
  checked_frontier_rows:
    - row: 'Pollard rho, n^{1/2+o(1)} time, O(1) memory, no queries'
      comparison: >-
        D1 is dominated. Corollary 4.3 shows D1 IS the x-line equality
        predicate that rho with the negation map already uses, so D1 supplies
        no axis rho lacks.
    - row: 'BSGS, n^{1/2+o(1)} time, n^{1/2+o(1)} memory'
      comparison: >-
        D1 is dominated on time and offers no memory saving, since the
        simulator shows the oracle can be replaced by O(1) group work without
        changing any cost.
    - row: 'Generic preprocessing tradeoff, S times T squared equals Omega-tilde(n)'
      comparison: >-
        D1 does not move this frontier either. A strict-GGM-simulable oracle
        adds no advice and no queries beyond what the model already counts.
    - row: 'Data/query axis'
      comparison: >-
        Checked and D1 is dominated here too. Corollary 4.2 bounds each query
        at 1 bit with success probability 2/n against a fixed reference, so
        optimal use against adaptive references is exactly an x-line collision
        search, i.e. rho again.
  sota_delta:
    time_exponent: '+0'
    memory_exponent: '+0'
    data_or_query_exponent: '+0'
    constant_factor: >-
      +0 as well. The square-root-of-two-type saving from the negation map is
