      Outside this task's declared read_scope. KN-FIND-002 cites
      experiments/EXP-GGM-001/analysis.md, specification.yaml and
      simulability_test.py as its proof_refs. The baseline reproduction in the
      gate memo is therefore against KN-FIND-002's and KN-FIND-b7e091's
      STATED arguments and recorded verdicts, not against that implementation.
      This is a disclosed limitation of the reproduction, and it is not a
      statement about the implementation's correctness.
    consequence: >-
      A frozen regression fixture against simulability_test.py would be a
      strictly stronger baseline check and is named as available future work.
  - path: 'ledger/hypotheses/ (full sweep)'
    reason: >-
      Not in read_scope and not needed: this task creates no hypothesis, and
      the duplicate check ran against knowledge/ and the frozen idea record's
      own five-closest-ledger-entries list, which names the relevant
      neighbours (KN-TECH-73630e, KN-OPEN-3417fc, ECDLP-IDEA-004,
      ECDLP-IDEA-160, KN-FIND-002).
    consequence: >-
      Duplicate coverage is therefore a floor, not an exhaustive sweep.
      Absence of a hit is not evidence that a hypothesis record does not
      already state Proposition 4.

external_retrieval_log:
  - instrument: WebSearch
    query: 'p-adic valuation of difference of x-coordinates elliptic curve torsion points good reduction distinct mod p'
    outcome: >-
      9 links surfaced. Most relevant hit: Recovering Kodaira types from
      ell-torsion on elliptic curves, arXiv:2607.02678, which the synthesized
      summary described as endowing E[ell] with a distance function recording
      the p-adic distances between the x-coordinates of the points.
    caveat: 'The returned prose is an AI-synthesized summary of surfaced content, not raw full text.'
  - instrument: WebFetch
    query: 'https://arxiv.org/abs/2607.02678'
    outcome: >-
      Abstract-level read. Confirmed the distance-function framing, confirmed
      the paper targets bad-reduction discrimination (potentially good versus
      multiplicative reduction, Kodaira types), and confirmed the abstract
      does NOT state that the good-reduction case is degenerate.
    caveat: >-
      Abstract only; the body was not read and no explicit formula for the
      distance function was obtained. Used as adjacency and as the
      resource_check taker, never as support for Proposition 4.
  - instrument: WebSearch
    query: 'generic group model simulable oracle elliptic curve coordinate access p-adic lift ECDLP no advantage'
    outcome: >-
      9 links surfaced, including Koblitz and Menezes, Another Look at Generic
      Groups (eprint 2006/230), whose synthesized summary reported the point
      that elliptic curves have special properties a generic group would not
      have, particularly that P and minus P share an x-coordinate.
    caveat: 'Synthesized summary only.'
  - instrument: WebFetch
    query: 'https://eprint.iacr.org/2006/230.pdf'
    outcome: >-
      FAILED. The fetched PDF did not yield extractable text; no passage could
      be located or quoted. Disclosed as an infrastructure limitation, not as
      evidence.
    caveat: >-
      Consequently Koblitz and Menezes is cited at web-search-snippet level
      only, for a fact (x of minus P equals x of P on a Weierstrass model)
      that is elementary and textbook and is independently used in the memo
      without leaning on that citation. The citation is therefore a pointer,
      not support.
  - instrument: WebSearch
    query: 'reduction map injective prime-to-p torsion elliptic curve good reduction distinct x-coordinates remain distinct modulo p'
    outcome: >-
      10 links surfaced. The synthesized summary stated that for good
      reduction at p at least 3 the reduction map induces an isomorphism on
      prime-to-p torsion, and that by injectivity distinct x-coordinates of
      torsion points remain distinct modulo p.
    caveat: >-
      Synthesized summary only; no primary source was opened for this
      statement. It is recorded because it independently corroborates the
      textbook status of Lemma 1 and of the first half of Proposition 4, and
      because it is the reason this audit labels the collapse an adaptation
      rather than a new result. The load-bearing internal source for the same
      fact is KN-TECH-73630e, which WAS opened in full.
  - instrument: internal repository grep
    query: 'knowledge/ for simulab, generic.group, GGM, case-insensitive'
    outcome: '60 files matched; the four GGM-relevant records were opened in full.'
    caveat: 'A grep floor, not an exhaustive semantic search.'
  - instrument: internal repository grep
    query: 'knowledge/ for valuation.*coordinate, coordinate.*valuation, v_p(x'
    outcome: >-
      Matches confined to KN-TECH-06bb4e, KN-TECH-73630e, KN-OPEN-3417fc, two
      gather indices and KN-LIT-6935a1. No corpus record states Proposition 4
      or any two-valued collapse of this functional.
    caveat: >-
      Absence of a search result is not evidence that something was not tried,
      per AGENTS.md's retrieval bounds. The corpus index was not queried via
      the crypto-kb MCP server, which this session did not have available.

novelty_dimensions:
  proposition_4_two_valued_collapse:
    statement: >-
      For a canonical prime-to-p torsion lift under good reduction, the
      valuation v_p(x([k]S-hat) - x([j]S-hat)) equals 0 when k is not
      congruent to plus-or-minus j mod n and equals plus-infinity otherwise,
      with no finite value at or above 1 ever attained.
    nearest_internal_work: >-
      KN-TECH-73630e, which proves the reduction isomorphism on prime-to-p
      torsion but is deliberately restricted to group-theoretic invariants and
      explicitly leaves the coordinate/valuation case open.
    nearest_external_work: >-
      The textbook injectivity of reduction on prime-to-p torsion (corroborated
      at synthesized-summary level by the third WebSearch above; the primary
      statement in this program's corpus is KN-TECH-73630e) combined with the
      elementary Weierstrass fact that x of minus P equals x of P.
    proposed_delta: >-
      The composition of those two facts into an exhaustive two-case dichotomy
      for this specific functional family, and the observation that it makes
      precision r inert.
    novelty_status: adaptation
    evidence: >-
      Both ingredients are textbook and one is already an internal derivation
      in this corpus; the composition applied to ECDLP-IDEA-436's frozen family
      is this session's own step and is not stated in any corpus record found
      by grep. Labelled adaptation, not speculative and not a new theorem.
  strict_ggm_simulability_of_d1:
    statement: >-
      D1 is simulable in the strict Shoup GGM with one group inversion and two
      equality tests per emitted value, independent of r, p and n.
    nearest_internal_work: >-
      KN-FIND-b7e091's endomorphism oracle, which is also strict-GGM simulable
      via a group-theoretic collapse (phi = [m]).
    nearest_external_work: 'none identified by this round''s bounded retrieval.'
    proposed_delta: >-
      A second, mechanistically different route to strict-GGM collapse for an
      oracle defined by non-group-theoretic apparatus (coordinates and
      valuations), together with the observation that the strict closure is
      strictly stronger than the structured closure KN-FIND-002 had to settle
      for on the jet oracle.
    novelty_status: adaptation
    evidence: >-
      The simulability technique is this program's own standing screen
      (KN-OPEN-005, KN-TECH-005); its application to this oracle is new within
      the corpus, its conclusion is negative for the idea, and it claims no
      external novelty.
  m1_proves_too_much_at_the_anomalous_curve:
    statement: >-
      The determinism-reduction move alone, if allowed to imply an exponent-1/2
      closure, would falsely close anomalous-curve ECDLP, which is linear time.
    nearest_internal_work: >-
      KN-FIND-002's own scope block and KN-LIT-7606's corpus entry, both of
      which already record that a structured-GGM simulability argument cannot
      close a candidate for real elliptic curves.
    nearest_external_work: >-
      Koblitz and Menezes, Another Look at Generic Groups (fetch failed;
      snippet level only), which the search summary reports as making the
      general form of this objection.
    proposed_delta: >-
      Instantiating that standing caution as a concrete fired control on a
      named object, and using it to force this task's own exponent claim onto
      the strict-model move only.
    novelty_status: known
    evidence: >-
      The underlying point is already recorded twice in this corpus. What is
      new here is only that it was run as a control on this task's own
      argument and changed what this task was willing to claim. No external
      novelty is asserted.
  resource_check_reading_of_the_degeneracy:
    statement: >-
      The same object (p-adic distances between x-coordinates of torsion
      points) that is empty under good reduction is informative under bad
      reduction, where it recovers the Kodaira type.
    nearest_external_work: 'Recovering Kodaira types from ell-torsion on elliptic curves, arXiv:2607.02678, abstract level only.'
    nearest_internal_work: none found.
    proposed_delta: 'None claimed. This is an adjacency and a resource_check reading, not a result.'
    novelty_status: unverified
    evidence: >-
      Abstract-level reading only; the abstract does not state the
      good-reduction degeneracy, so the complementarity is this session's
      inference from its own Lemma 1 and is explicitly not attributed to that
      paper.

novelty_falsifiers:
  - >-
    A committed corpus record or primary source already stating that this
    valuation profile is two-valued on prime-to-p torsion under good
    reduction. Searched by grep over knowledge/ and by three WebSearch
    queries; not found. Absence is a floor, not proof.
  - >-
    A demonstration that some already-closed oracle collapses via the
    x-coordinate plus-or-minus fibre structure specifically, which would make
    D1 a relabeling rather than a new oracle class. Not found; the nearest
    near-collision (KN-FIND-b7e091's endomorphism oracle) collapses via
    End_{F_p}(E) = Z instead, and the collision is disclosed in
    proof-search-map.yaml.
  - >-
    A model in which D1 is publicly computable but NOT strict-GGM simulable.
    None was constructed; Proposition 4 makes the value depend on its
    arguments only through a group-theoretic predicate, so any such model
    would have to break Lemma 1 or Lemma 2, i.e. leave good reduction, leave
    prime-to-p order, leave p at least 3, or leave the Weierstrass model.
    Each of those four exits is named in the memo as outside scope, not as
    impossible.
  - >-
    A digit statistic T for D2 that is nonconstant, efficiently invertible,
    and evaluable on an ORDINARY curve without a named structural
    coincidence. This memo does not close that possibility and does not claim
    to.

