record_kind: proof_search_map
subject: >-
  The finding of ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate.md,
  namely that ECDLP-IDEA-436's primary named coordinate-valuation-profile
  family D1 is generic-group-model simulable with O(1) overhead in the
  strict Shoup GGM, and that its secondary digit-statistic disjunct D2 is
  simulable only relatively, in the structured GGM.
applies_to: this gate-check's own finding, not to ECDLP-IDEA-436's original hypothesis
evidence_tier: derivation_zero_run_single_session_unreviewed
runs: 0
experiments: 0
implementations: 0

bottleneck: >-
  The exact step whose removal changes the verdict is the evaluation of
  v_p(x([k]S-hat) - x([j]S-hat)) itself. Everything else in ECDLP-IDEA-436's
  cost model (lift setup, precision schedule, ambiguity charging,
  reconstruction) is downstream of whether that single evaluation is
  reproducible from generic group operations. The gate stands or falls on
  that one quantity, which is why it is a gate rather than a step.

baseline_embedding:
  parameter_slice: >-
    The exact old-method boundary is KN-FIND-002's and KN-FIND-b7e091's
    existing closure arguments for the jet, endomorphism, elliptic-net and
    incidence oracles. This gate memo's argument is a family extension of
    theirs, so the required embedding is that the extended argument, run at
    the parameter slice corresponding to those four oracles, returns their
    already-recorded verdicts exactly. The slice is: oracle in
    {jet, endomorphism, elliptic-net, incidence}, and Fork-A branch in
    {A-strict, A-structured}.
  reproduction_check: >-
    Symbolic, performed in ggm_simulability_gate.md section 6, item by item
    and with the recorded verdict quoted verbatim from the opened source
    file in every case. Results: (a) jet under A-structured reproduces
    KN-FIND-002's SIMULABLE with C=1 and its one-group-operation simulator;
    (b) jet under A-strict reproduces KN-FIND-002's own scope-block
    prediction of NON-SIMULABLE and KN-FIND-b7e091's recorded
    non-simulability of Oracle A; (c) endomorphism under A-structured
    reproduces KN-FIND-002's C=0; (d) endomorphism under A-strict reproduces
    KN-FIND-b7e091's m-group-operation simulation via phi = [m];
    (e) elliptic-net reproduces KN-FIND-002's O(log N), NOT closed at 1/2 by
    the constant-overhead bound; (f) incidence reproduces KN-FIND-002's
    O(B^m), NOT closed at 1/2 by the constant-overhead bound. Four of four
    oracles reproduced, and the two-of-four split between closed and
    not-closed is reproduced as a split rather than collapsed.
  reproduction_outcome: pass_4_of_4_oracles_both_fork_a_branches
  reproduction_limitation: >-
    The reproduction is against the STATED arguments and recorded verdicts in
    knowledge/findings/KN-FIND-002.md and knowledge/findings/KN-FIND-b7e091.md,
    both opened and read in full in this task. It is NOT against the
    implementation at experiments/EXP-GGM-001/simulability_test.py, which lies
    outside this task's declared read_scope and was not opened. A frozen
    regression fixture against that implementation would be a strictly stronger
    check and is named here as available future work, not as work performed.

observation_collision:
  observable: >-
    The observable carrying the conclusion is the pair (simulator overhead in
    group operations, Fork-A branch on which the simulation is valid). The
    verdict scoped_rejection_simulable is asserted because that pair takes the
    value (O(1), A-strict) for family D1.
  distinct_preimage_search: >-
    The required check is whether this gate examines a genuinely new oracle
    class or merely relabels an already-closed one. Two distinct
    ground-truth objects were sought with the same observable, one on each
    side of the claimed conclusion.
  collision_candidates_examined:
    - candidate: KN-FIND-002 jet oracle
      same_observable: >-
        Partially. The jet oracle shares the (O(1) overhead) coordinate of
        the observable but NOT the branch coordinate: it is simulable only on
        A-structured, whereas D1 is simulable on A-strict.
      distinguishing_structure: >-
        Jet data is a nonconstant rational function of coordinates and
        separates points standing in identical group-theoretic relations;
        D1 is two-valued and its separating predicate is the group-theoretic
        predicate [k]S = plus-or-minus [j]S. The mechanism of closure is
        therefore different, and D1's closure is strictly stronger. Not a
        relabeling.
      verdict: distinct_oracle_class
    - candidate: KN-FIND-b7e091 endomorphism oracle
      same_observable: >-
        Yes on both coordinates: (O(m) group operations, A-strict). This is
        the nearest collision found.
      distinguishing_structure: >-
        The endomorphism oracle collapses because End_{F_p}(E) = Z forces
        phi = [m], a scalar multiplication. D1 collapses because the
        x-coordinate map has exactly the plus-or-minus fibres and reduction is
        injective on prime-to-p torsion. Different structural facts, different
        subgroups of operations used by the simulator (scalar multiplication
        versus inversion plus equality). The shared observable value is a
        genuine near-collision and is disclosed as such; the two objects are
        separated by their collapse mechanism, not by their cost vector.
      verdict: distinct_mechanism_shared_cost_vector_disclosed
    - candidate: KN-FIND-002 endomorphism oracle at C=0
      same_observable: >-
        No. C=0 versus D1's C=1; and KN-FIND-002 evaluates on A-structured.
      distinguishing_structure: >-
        The C=0 result is local evaluation of a public map with zero group
        operations; D1's strict simulator genuinely uses the group inversion
        oracle.
      verdict: distinct
    - candidate: ECDLP-IDEA-004 prime-to-p jet logarithm
      same_observable: >-
        No. ECDLP-IDEA-436's own record states this route is additive and is
        killed by the formal-group annihilation D1 never performs.
      distinguishing_structure: >-
        ECDLP-IDEA-436 explicitly does not map into the formal group; the
        annihilation O-hat = m O-hat that closes the classical F2 route is
        never carried out. Confirmed by reading the frozen idea record.
      verdict: distinct
    - candidate: ECDLP-IDEA-160 ramification-break scalar digits
      same_observable: 'No. Closed family is functorial towers and upper/lower ramification breaks.'
      distinguishing_structure: >-
        A valuation of a coordinate difference on a fixed curve over a fixed
        field is neither a tower invariant nor a break number, per
        ECDLP-IDEA-436's own mechanism-new-operation section.
      verdict: distinct
  collision_conclusion: >-
    This gate examines a genuinely new oracle class. The nearest collision is
    the endomorphism oracle of KN-FIND-b7e091, which shares D1's cost vector
    and its Fork-A branch but not its collapse mechanism; the collision is
    disclosed rather than argued away. No candidate examined is a relabeling
    of D1, and D1 is not a relabeling of any already-closed oracle.
  falsifier_that_would_overturn_this: >-
    A committed record showing that some already-closed oracle collapses via
    the x-coordinate plus-or-minus fibre structure specifically would make D1
    a relabeling. None was found in knowledge/ by targeted grep for the
    relevant phrases, but absence of a search result is not evidence that
    something was not tried, per AGENTS.md's retrieval bounds.

quantifier_order:
  claim_d1: >-
    forall p >= 3, forall E/F_p ordinary with good reduction, forall S in
    E(F_p) of order n with gcd(n,p) = 1, forall r >= 1, forall j: there
    EXISTS a single fixed simulator Sim, independent of E, p, n, r, j, k and
    of the scalar being sought, using exactly one group-inversion query and
    two equality tests per emitted value and no coordinate or p-adic access,
    such that forall k the value Sim outputs equals inv_{j,r}(k).
  quantifier_order_note_d1: >-
    The existential is INSIDE all universals and the witness Sim is uniform:
    it does not depend on the instance, the characteristic, the precision, the
    reference index, or any seed. This is the strong order, and it is the
    order the closure needs. It is achievable only because Proposition 4 makes
    the value depend on (k, j) solely through the predicate k congruent to
    plus-or-minus j mod n.
  claim_d2: >-
    forall statistics T of the precision-r digits of x([k]S-hat), forall
    instances: there EXISTS a simulator using zero group operations and
    O-tilde(r log p) local bit operations that reproduces T, PROVIDED the
    model grants coordinate access (branch A-structured). Under branch
    A-strict no such simulator exists, and under branch A-strict no party can
    evaluate T either.
  quantifier_order_note_d2: >-
    The D2 existential is guarded by a model-dependent proviso, so its
    quantifier order is strictly weaker than D1's. This is why the memo states
    D2's closure as relative and refuses to promote it to an exponent-1/2
    claim. Recording the two orders separately is what prevents the memo from
    silently exporting D1's strength onto D2.
  dependency_audit: >-
    Checked for a hidden dependence of the D1 witness on the instance: none
    found. Sim's code is three lines and mentions no curve parameter. Checked
    for a hidden dependence on r: none; r enters only as the returned cap
    value, which the simulator receives as an input, not as a computed
    quantity.

method_ceiling:
  strongest_certifiable_claim: >-
    The strongest claim this method could ever certify, under ideal tuning,
    is: an augmented ECDLP oracle whose output is determined by a
    group-theoretic predicate computable in O(1) generic operations is
    simulable in the strict Shoup GGM and therefore cannot bring any
    algorithm below Omega(sqrt(n)) group operations. It can certify NOTHING
    about (a) any oracle whose output is not so determined, (b) ECDLP
    hardness itself, (c) any non-generic attack, or (d) the real cost of any
    algorithm on a real curve. In particular it can never certify a lower
    bound in the structured GGM, because Shoup's theorem does not hold there.
  nearby_object_control:
    object: >-
      Anomalous curve, #E(F_p) = p, with the Semaev / Satoh-Araki / Smart
      additive transfer psi onto (F_p, +), per KN-TECH-033. On this object
      the desired conclusion (closed at exponent 1/2) is KNOWN FALSE: the
      ECDLP is solved in O(log p) field operations.
    argument_run_on_it: >-
      The gate memo's argument has two moves. M1, determinism reduction: if
      the oracle output is a deterministic function of what the adversary
      already holds, it is simulable at local cost. M2, predicate collapse:
      if that function further factors through group operations and equality
      tests, the simulation lifts to the strict model.
    outcome_m1: >-
      M1 FIRES on psi. psi is a deterministic, publicly computable function of
      the coordinates and the public curve data, so M1 declares it
      A-structured simulable with zero group operations. Combined with an
      exponent-1/2 closure rule this would prove that anomalous ECDLP needs
      Omega(sqrt(p)) group operations, which is false. M1 alone therefore
      PROVES TOO MUCH and is broken as a closure rule.
    outcome_m2: >-
      M2 does NOT fire on psi. psi is a nontrivial homomorphism onto (F_p,+)
      and cannot factor through O(1) group operations and equality tests
      without contradicting Shoup's bound. The control correctly separates
      the two moves.
    repair_applied: >-
      The memo's exponent-1/2 verdict for D1 rests on M2 alone. M1 is used
      only for D2, and D2's conclusion is correspondingly reported at the
      weaker relative tier with the anomalous curve named as the standing
      witness that relative closure does not upgrade to absolute. This repair
      was applied before the verdict was written, not after.
    control_verdict: >-
      PASS with a fired sub-control. The fired sub-control is itself a
      load-bearing result of this task, since it localises exactly which half
      of the argument may carry an exponent claim and independently
      re-derives the caveat KN-FIND-002 records against itself and that
      KN-LIT-7606 turns into a quantity.
  method_ceiling_consequence_for_this_task: >-
    Because the ceiling forbids certifying anything in the structured GGM,
    D2 cannot be closed by this method at all, only relativised. That is a
    limitation of the method, disclosed here rather than hidden by widening
    the verdict.

constructive_transforms:
  - transform: representation_reduction
    proposed_object: >-
      Move the question into a model where the hypothesis is an exact
      equality: replace the p-adic valuation by the residue-field equality
      x([k]S) = x([j]S), which Lemma 1 shows is equivalent to a positive
      valuation, and then by the group-theoretic equality [k]S = plus-or-minus
      [j]S, which Lemma 2 shows is equivalent to that.
    predicted_gain: >-
      Converts a quantity requiring p-adic arithmetic at precision r into a
      quantity requiring one inversion and two equality tests, and therefore
      converts a model-dependent relative statement into a strict-GGM
      theorem. Realized: this is the transform that produced Proposition 4.
    obligations_discharged: 'encoding, completeness, soundness'
    obligations_open: >-
      Transfer and cost-loss obligations are trivial here because the
      reduction is an identity of values, not an approximation; no cost is
      lost.
  - transform: observable_fiber
    proposed_object: >-
      Hold the observable (the valuation value) fixed and vary the forgotten
      structure (which point of the plus-or-minus fibre, and all digits beyond
      the first) to see whether any intrinsic invariant distinguishes the
      resulting objects.
    predicted_gain: >-
      Would have produced a counterexample to the collapse had one existed.
      It did not: by Lemma 2 the fibre of the observable over the value
      plus-infinity is exactly {j, -j} and over 0 is its complement, with no
      residual structure to vary. This transform is recorded as run and
      NEGATIVE, which is what makes Proposition 4 an exhaustive dichotomy
      rather than a partial computation.
    obligations_discharged: exhaustiveness_of_the_two_cases
    obligations_open: >-
      Not run for functionals of three or more lifted points, where the
      fibre structure of a determinant or resultant valuation is not
      determined by pairwise plus-or-minus relations. Named as open in the
      memo's forward guidance item 3.
  - transform: stronger_invariant
    proposed_object: not_selected
    predicted_gain: >-
      Not applicable to this task. A stronger compositional invariant is a
      transform for building an algorithm or a proof that must survive
      recursion; this task certifies a simulation, which has no recursion to
      survive. Recorded as non-applicable rather than silently omitted, per
      docs/inventor-protocol.md section 8.
    obligations_discharged: none
    obligations_open: none
  - transform: boundary_lift
    proposed_object: not_selected
    predicted_gain: >-
      Not applicable. There is no certificate family to enlarge and no strict
      inward improvement to prove; the deliverable is a gate verdict, not a
      bound to be tightened.
    obligations_discharged: none
    obligations_open: none
  - transform: telescoping_potential
    proposed_object: not_selected
    predicted_gain: 'Not applicable. There is no unstable increment and no global budget to charge it to.'
    obligations_discharged: none
    obligations_open: none
  - transform: specialization_pack
    proposed_object: not_selected
    predicted_gain: >-
      Not applicable. No problem-specific resource measure is built; the cost
      accounting is the standard group-operation count of KN-TECH-005.
    obligations_discharged: none
    obligations_open: none

proof_obligations:
  - claim: >-
      For k not congruent to 0 mod n, x([k]S-hat) lies in Z_p and reduces mod
      p to x([k]S).
    responsibility: correctness
    status: >-
      Discharged by Lemma 1 of the memo, from the torsion-freeness of the
      formal group away from p, quoted from KN-TECH-73630e which was opened
      and read in full. Textbook; not this task's contribution.
  - claim: >-
      On a Weierstrass model x(P) = x(P-prime) if and only if P-prime equals
      plus or minus P, over both F_p and Q_p, and the canonical lift commutes
      with negation.
    responsibility: correctness
    status: >-
      Discharged by Lemma 2 of the memo. The commuting-with-negation step uses
      that reduction restricted to prime-to-p torsion is a group isomorphism
      (KN-TECH-73630e, opened and read in full) and that negation is a group
      automorphism. Textbook; not this task's contribution.
  - claim: >-
      The valuation v_p(x([k]S-hat) - x([j]S-hat)) takes only the values 0 and
      plus-infinity, and never a finite value at or above 1.
    responsibility: strictness
    status: >-
      Discharged by Proposition 4 of the memo as an exhaustive two-case
      dichotomy. This composition is this task's own step; its honest novelty
      label is adaptation, since both ingredients are textbook and one is
      already recorded internally.
  - claim: 'The simulator of memo section 5.1 is correct on every input and costs one inversion plus two equality tests.'
    responsibility: runtime
    status: >-
      Discharged by reading Proposition 4 as a lookup table. The cost is
      counted directly off the three-line simulator; no amortisation, no
      hidden constant, no o(1).
  - claim: >-
      A strict-Shoup-GGM-simulable oracle with O(1) overhead cannot bring any
      algorithm below Omega(sqrt(n)) group operations.
    responsibility: baseline
    status: >-
      Not proved here. Imported from KN-TECH-005, which was opened and read in
      full and which states the Shoup bound and the program's standard screen
      in exactly these terms. This memo's contribution is the simulability
      premise, not the lower bound.
  - claim: 'D2 is closed absolutely at exponent 1/2.'
    responsibility: scope
    status: >-
      NOT CLAIMED and explicitly refused. The nearby-object control shows the
      only available argument for it (M1) proves too much. D2 is reported as
      relatively closed only.
  - claim: 'The family is not useful, or ECDLP is hard.'
    responsibility: scope
    status: >-
      NOT CLAIMED. Per dispatch constraint 5 and KN-TECH-73630e, this gate
      says nothing about usefulness in either direction and adds no hardness
      claim.
  - claim: 'KN-OPEN-3417fc is resolved.'
    responsibility: scope
    status: >-
      NOT CLAIMED. One named family is closed unconditionally, one hedge
      relatively; the open problem asks about any computable non-group-
      theoretic coordinate or valuation invariant and stands unresolved.

not_applicable_reason: null

audit_summary: >-
  All four mandated audits were run and none was omitted. Baseline
  reproduction passed 4 of 4 recorded oracles across both Fork-A branches,
  including reproducing the apparent tension between KN-FIND-002 and
  KN-FIND-b7e091 as a model difference rather than an error. The
  observation-collision search found one genuine near-collision (the
  endomorphism oracle shares D1's cost vector and Fork-A branch) and
  disclosed it, separating the two objects by collapse mechanism rather than
  by cost. The quantifier order for D1 is the strong uniform order with the
  existential inside all universals, and D2's weaker guarded order is
  recorded separately so D1's strength is not silently exported to it. The
  method ceiling forbids any structured-GGM lower bound, and the
  nearby-object control FIRED on move M1 at the anomalous curve, which is the
  most useful single outcome of this map: it forced the exponent-1/2 verdict
  onto move M2 alone before the verdict was written. Passing these audits
  asserts nothing beyond AGENTS.md rules 4 and 6.
