  producer_verdict: scoped_rejection_simulable

routing:
  policy: review-adversarial
  reasoning_effort: xhigh
  rule_id: critical-result-review
  rule_basis: >-
    The producer proposes a SCOPED REJECTION of one named functional family,
    which is proposed_state_transition rejected under routing_rules
    critical-result-review, not a goal closure and not a claimed breakthrough.
    It does not contradict prior validated evidence: it extends the
    KN-FIND-002 / KN-FIND-b7e091 closure to a new oracle class.
  escalation_condition: >-
    If either reviewer concludes that the producer's OFQ-1 (that this program
    has no canonical GGM branch, so KN-FIND-002 and KN-FIND-b7e091 evaluate on
    DIFFERENT branches and every corpus 'closed at exponent 1/2' carries an
    unstated model parameter) amounts to a CONTRADICTION of prior validated
    evidence rather than a scoping observation about it, then routing_rules
    unrecoverable-result-review fires and this round must be re-run at
    review-breakthrough (max, degradable false). Reviewers are instructed to
    say so explicitly rather than absorbing it.

prior:
  held_by: coordinator-ecdlp-2
  recorded_before_any_reviewer_launched: true
  statement: >-
    My prior is that the Proposition is CORRECT and the scoped rejection will
    survive. I re-derived the dichotomy independently before opening the memo's
    proof and reached the same two cases. I record this prior precisely because
    it biases me toward accepting the round, and the reviewers exist to attack
    it rather than confirm it.
  what_would_change_my_mind: >-
    A concrete j, k, E, p, n with 1 <= v_p(x([k]S-hat) - x([j]S-hat)) < infinity;
    or a demonstration that the exponent-1/2 closure being imported from
    KN-FIND-002 does not hold in the strict Shoup branch the simulator is
    stated in.
  known_weakness_of_my_own_check: >-
    My re-derivation is NOT independent. I dispatched the producer, I read its
    result before re-deriving, and I am the session reporting the outcome. It
    carries no independence weight and is recorded as an orchestrator sanity
    check only.

joints:
  - id: J1
    name: 'Mathematical correctness of the Proposition and its two lemmas'
    owner: TASK-20260831-c6ceb9
    owner_role: validator
    exactly_one_owner: true
    worked_attack: >-
      Attempt to exhibit a counterexample in which the valuation is FINITE and
      at least 1 - that is, x([k]S-hat) congruent to x([j]S-hat) mod p while
      [k]S-hat is NOT equal to plus-or-minus [j]S-hat. This requires either
      reduction to be non-injective on prime-to-p torsion, or the x-fibre
      argument to admit a third preimage. Probe specifically - 2-torsion points
      where P equals minus P; the identity and the k congruent to 0 mod n
      convention the frozen family leaves unstated; p equal to 2 and p equal to
      3; gcd(n,p) not equal to 1; bad reduction; non-Weierstrass models; and
      the case j congruent to minus k where x agrees but the points differ.
      Each excluded case must be excluded BY A STATED HYPOTHESIS of section 1.1,
      not by silence.
  - id: J2
    name: 'Does simulability actually license the scoped rejection, at the stated scope and tier'
    owner: TASK-20260831-62019a
    owner_role: red-team
    exactly_one_owner: true
    worked_attack: >-
      Grant the Proposition and attack the INFERENCE. Attack 1 - the GGM branch
      equivocation - the simulator is stated in the strict Shoup model, but the
      exponent-1/2 closure is imported from KN-FIND-002, which the producer
      itself says holds in a STRUCTURED GGM that record discloses as a
      weakening. If the closure lives in a different model than the simulator,
      the scoped rejection does not follow and the round must be re-scoped.
      Attack 2 - claim-tier leakage from D2 - the secondary disjunct, a digit
      statistic of a SINGLE lifted point, is said to carry only M1 and to be
      reported at the weaker relative tier. Check that the memo's own framing,
      abstract and conclusion do not let D2 ride on D1's closure. Attack 3 -
      premature closure - inventor-protocol treats declining to search as
      symmetric with overclaiming, so check that closing D1 does not
      over-close the neighbours the producer lists as untried, in particular
      functionals of three or more lifted points.

proves_too_much_objects:
  - object: 'anomalous curves (trace one), KN-TECH-033, Smart / Satoh-Araki / Semaev transfer'
    run_by: both
    expected: >-
      The producer reports that its M1 (determinism reduction) PROVES TOO MUCH
      here - it would wrongly declare the anomalous transfer simulable and
      closed at 1/2, which is false in linear time - while its M2 (predicate
      collapse) correctly does not fire. Reviewers must independently confirm
      BOTH halves. If M2 also fires on anomalous curves, the exponent-1/2
      verdict is broken and must be withdrawn.
  - object: 'the already-closed jet and endomorphism oracles, KN-FIND-002 and KN-FIND-b7e091'
    run_by: both
    expected: >-
      The argument style must reproduce the verdicts those records already
      establish, on the branch each record actually uses. A different verdict
      means the argument is broken, not that the records are wrong.

blind_rederivation:
  quantity: >-
    The value set of inv_{j,r}(k) equals v_p(x([k]S-hat) - x([j]S-hat)) truncated
    at precision r - specifically whether it is two-valued (0 and plus infinity)
    or can take a finite value of at least 1.
  performed_by: TASK-20260831-c6ceb9
  ordering_requirement: >-
    The re-derivation MUST be performed and written down BEFORE the reviewer
    opens any blind_from path, and the reviewer must attest to that ordering in
    its report. A re-derivation performed after reading the memo's proof is not
    a blind re-derivation and must be reported as such rather than presented as
    one.
  blind_from:
    - ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate.md
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-GGM-SIMULABILITY-GATE-20260831-c7c3ef/tasks/TASK-20260831-c7c3ef/proof-search-map.yaml
  permitted_during_blind_phase:
    - knowledge/techniques/KN-TECH-73630e.md
    - ideas/ECDLP-IDEA-436_local_torsion_coordinate_valuation_profile_hypothesis.md
    - 'standard theory of formal groups and reduction of elliptic curves'

blindness_declaration:
  reviewers_launched_concurrently: true
  reviewers_can_see_each_others_output: false
  reviewer_is_not_the_producing_agent: true
  independent_session: true
  note: >-
    Both reviewers are FRESH agent calls, not continuations of the producer's
    session, and are launched in a single message so neither can read the
    other's report. Each declares which sibling review outputs it read - the
    correct answer is none.

controls_declared:
