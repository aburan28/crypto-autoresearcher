  theorem:
    name: >-
      Conditional amplification obstruction for the uniformly conditionally
      biased fixed-target ordinary-generic advice-bank interface.

    statement: >-
      Let N be a prime, B = N^(1/5), r = ceil(log2 B), m = 2^r,
      D = {-m,...,-1,1,...,m}, C = sum_{i=0}^4 m^i, and
      L = m + m^2 + m^3 + m^4, with N > 4L+1 (the admitted stratum).
      Under every imported MPZ and target-shift premise (A1)-(A5) below, plus
      the imported MPZ Theorem 3 and the inherited target-shift resource
      rectangle, there does not exist a fixed-target Query2P1 predicate
      object P with an admissible adaptive controller C such that the
      majority-amplified q-call transcript is jointly correct with
      probability at least 3/4. The contradiction is stated only under every
      imported premise; if any premise is absent the argument stops at the
      first missing premise named in conditional_nature.

    frozen_parameters:
      r: "ceil(log2 B)"
      q: "<= 5r+3"
      epsilon_regime: "epsilon > 0 and epsilon^{-1} = B^(o(1))"
      s: "odd, s >= ln(4q)/(2 epsilon^2)"
      complete_transcript_success: ">= 3/4"
      ell_total: "q*s*B^(9/4+o(1))"
      k_total: "q*s*B^(5/4+o(1))"
      mpz_bound: "3*ell_total*(k_total+1)^2/B^5 = B^(-1/4+o(1)) = o(1)"
      q_s_overhead: "q*s = B^(o(1))"

    premises:
      - id: A1
        name: ordinary_generic_target_independent
        statement: >-
          P is target-independent and ordinary-generic: its internals consist
          solely of allowed ordinary-generic operations and
          representation/equality queries, all counted within the same
          main-phase interaction cap. No extra oracle, no coordinate-aware or
          P1553 structure, no representation-sensitive or
          dyadic-unit-product method. The predicate is not admitted as an
          extra oracle; the implication is valid only for an implementation
          whose predicate internals are allowed ordinary-generic operations.

      - id: A2
        name: uniform_conditional_bias
        statement: >-
          For every fixed generic representation, every allowed public deck
          state, every restriction (a subset of the frozen deck entries),
          every target, and every admissible prior history H independent of
          the unused banks, the probability (over the predicate's fresh
          main-phase coins and one unused bank) that the answer is correct is
          at least 1/2 + epsilon, where epsilon > 0 and
          epsilon^{-1} = B^(o(1)). The bias is conditional on the full
          admissible history, not merely an unconditional or average-only
          marginal. The s banks in a group are mutually independent
          conditional on H.

      - id: A3
        name: independent_preallocated_serialized_banks
        statement: >-
          Before Q is known, q*s mutually independent advice banks are
          generated, each serialized as ordinary bits, with no opaque generic
          handle crossing the phase boundary. The banks are grouped into q
          groups of s. For adaptive call j, only the unused group j and fresh
          independent main-phase coins are used, and that group is then
          discarded. No bank is chosen after observing the target or the
          adaptive history. No bank or coin is shared across calls.

      - id: A4
        name: admissible_controller
        statement: >-
          C makes at most q <= 5r+3 adaptive calls, each staying within P's
          admitted call domain: the restriction is a subset of the frozen
          deck entries, the target is the fixed R = Q + [C]P, and C does not
          leave the predicate's admitted call domain. The theorem quantifies
          over all admissible controllers; it does not quantify over
          controllers that leave the admitted domain.

      - id: A5
        name: complete_resource_ledger
        statement: >-
          Bank generation and serialization, framing, every predicate and
          generic interaction, every majority operation, target shift (zero
          in the fixed-target interface), reconstruction, replay, decode,
          verification, traffic, teardown, and phase-boundary clearing are
          all charged to advice ell, aggregate main-phase k, or an explicit
          separately bounded local cost. No cost is uncharged. If any term is
          uncharged the resource rectangle is not the inherited one and the
          obstruction does not apply.

    amplification_lemma:
      statement: >-
        Under (A2) and (A3), with s odd and s >= ln(4q)/(2 epsilon^2), the
        majority-amplified transcript is jointly correct (all q calls
        correct) with probability at least 3/4, for every admissible
        controller C, every fixed representation, deck state, restriction,
        and target.

      proof_sketch: >-
        For call j, let H_j be the sigma-algebra generated by the prior
        history (representation, deck state, restriction, target, prior
        calls' answers, and main-phase coins used so far), which is
        independent of the unused banks (j,1..s) by (A3). By (A2), the s
        answers for call j are conditionally independent given H_j, and each
        is correct with probability at least 1/2 + epsilon given H_j. Let
        X_i be the indicator that bank (j,i) is correct, i = 1..s. Then
        E[X_i | H_j] >= 1/2 + epsilon, and the majority is wrong iff
        sum_i X_i <= (s-1)/2. By the conditional Hoeffding bound,
        Pr[sum_i X_i <= (s-1)/2 | H_j]
          <= Pr[sum_i X_i - E[sum_i X_i | H_j] <= -s*epsilon | H_j]
          <= exp(-2 epsilon^2 s),
        almost surely in H_j. Let E_j be the event that call j's majority is
        wrong. Then Pr[E_j] = E[Pr[E_j | H_j]] <= exp(-2 epsilon^2 s). By
        the union bound over the q calls,
        Pr[union_j E_j] <= sum_j Pr[E_j] <= q * exp(-2 epsilon^2 s).
        Hence Pr[all q calls correct] >= 1 - q*exp(-2 epsilon^2 s).
        Setting s >= ln(4q)/(2 epsilon^2) gives
        q*exp(-2 epsilon^2 s) <= q * exp(-ln(4q)) = 1/4,
        so Pr[all q calls correct] >= 3/4.

      overhead: >-
        q <= 5r+3 = O(log B) = B^(o(1)), and
        s = O(epsilon^{-2} log q) = O(B^(o(1)) * log log B) = B^(o(1)),
        so q*s = B^(o(1)).

    resource_accounting:
      ell_total: "q*s*B^(9/4+o(1))"
      k_total: "q*s*B^(5/4+o(1))"
      per_bank_advice: "B^(9/4+o(1)) bits"
      per_bank_interactions: "B^(5/4+o(1))"
      ledger:
        - term: bank_generation_and_serialization
          charged_to: ell
          bound: "q*s*B^(9/4+o(1)) bits"
          note: >-
            Every bank is serialized as ordinary bits before Q; all
            cross-boundary bits are part of ell.
        - term: framing
          charged_to: ell
          bound: "q*s*polylog(B) = B^(o(1)) bits"
          note: >-
            The metadata identifying each bank and its group is
            polylogarithmic per bank and absorbed into ell.
        - term: predicate_and_generic_interactions
          charged_to: k
          bound: "q*s*B^(5/4+o(1))"
          note: >-
            Every predicate-internal ordinary-generic operation and
            representation/equality query for every bank in every call is
            counted within the same main-phase cap k.
        - term: majority_operations
          charged_to: k
          bound: "q*s bit operations = B^(o(1))"
          note: >-
            Each majority is a local computation over s bits; the total is
            negligible and absorbed into k.
        - term: target_shift
          charged_to: k
          bound: "0"
          note: >-
            The fixed-target interface has no target shift; the term is
            named and charged as zero.
        - term: reconstruction
          charged_to: k
          bound: "B^(1+o(1))"
          note: >-
            Post-boundary reconstruction of every public generic handle from
            scalar lineage, inherited from the target-shift theorem, is
            B^(1+o(1)) and is within k_total.
        - term: replay
          charged_to: k
          bound: "polylog(B) = B^(o(1))"
          note: >-
            Replay of the transcript for verification is polylogarithmic.
        - term: decode
          charged_to: k
          bound: "polylog(B) = B^(o(1))"
          note: >-
            The decoder x_hat = (m*z + c0 - C) mod N is polylogarithmic.
        - term: verification
          charged_to: k
          bound: "polylog(B) = B^(o(1))"
          note: >-
            The mandatory final equality [x_hat]P = Q is polylogarithmic.
        - term: traffic
          charged_to: k
          bound: "B^(o(1)) bit traffic"
          note: >-
            Memory traffic for bank storage, lookup, and clearing is
            negligible.
        - term: teardown
          charged_to: k
          bound: "B^(o(1))"
          note: >-
            Bank and handle teardown is negligible.
        - term: phase_boundary_clearing
          charged_to: k
          bound: "B^(o(1))"
          note: >-
            Clearing every model register at the phase boundary is
            negligible and inherited from the MPZ preprocessing boundary.
      uncharged_terms: []
      uncharged_terms_note: >-
        Every term in the mandated list is charged to ell, aggregate k, or a
        separately bounded local cost. There are no uncharged terms. If any
        term were uncharged the resource rectangle would not be the inherited
        one and the obstruction would not apply.

    mpz_substitution:
      imported_theorem: >-
        MPZ Theorem 3 (Maurer-Portmann-Zhu, ePrint 2020/996, verified in
        TASK-20260827-c8609e): for prime N, positive integer k and advice
        length ell, every ell-bit two-phase solver in pG_dense with unlimited
        preprocessing, at most k main-phase interactions, unbounded
        registers, and dense representation access has average-case
        extraction success at most 3*ell*(k+1)^2/N.
      expression: "3*ell_total*(k_total+1)^2/N"
      computation: >-
        ell_total = q*s*B^(9/4+o(1)),
        k_total = q*s*B^(5/4+o(1)),
        N = B^5,
        q*s = B^(o(1)).
        (k_total+1)^2 = (q*s*B^(5/4+o(1)) + 1)^2
          = (q*s)^2 * B^(5/2+o(1))
          (since 1/k_total = B^(-5/4+o(1)) = o(1)).
        3*ell_total*(k_total+1)^2/N
          = 3 * [q*s*B^(9/4+o(1))] * [(q*s)^2 * B^(5/2+o(1))] / B^5
          = 3 * (q*s)^3 * B^(9/4 + 5/2 - 5 + o(1))
          = 3 * (q*s)^3 * B^(-1/4 + o(1))
          = 3 * B^(o(1)) * B^(-1/4 + o(1))
          = B^(-1/4 + o(1))
          = o(1).
      result: "B^(-1/4+o(1)) = o(1)"
      exponent_check:
        b_exponent: "9/4 + 2*(5/4) - 5 = -1/4"
        n_exponent: "(-1/4)*(1/5) = -1/20"
        status: matches_imported_target_shift_exponents

    contradiction:
      statement: >-
        The amplified object is an ell_total-bit two-phase solver with
        k_total main-phase interactions in the ordinary-generic dense model.
        By the amplification lemma, its complete-transcript success is at
        least 3/4, pointwise over every fixed representation and target,
        hence also in the average. Complete-transcript success implies
        extraction success (the decoder and mandatory final verification
        produce x). Therefore the amplified object's extraction success is
        at least 3/4. But by the MPZ substitution, its average-case
        extraction success is at most B^(-1/4+o(1)) = o(1). Since 3/4 > o(1)
        for sufficiently large N, this is a contradiction. Hence no such
        uniformly conditionally biased fixed-target predicate P with an
        admissible controller C can exist under every imported premise.

    conditional_nature:
      statement: >-
        The contradiction holds only under every imported MPZ and
        target-shift premise (A1)-(A5) plus the imported MPZ Theorem 3 and
        the inherited target-shift resource rectangle. If any premise is
        absent the argument stops at the first missing premise. The
        conditional contradiction is not an unconditional non-existence
        result, not a generic ECDLP lower bound, and not a construction.

      first_missing_premise_by_object:
        - object: >-
            receiptless TASK-20260827-668542 drafts missing MPZ
            substitution, complete cost mapping, exact quantifiers, and
            Pareto typing
          first_missing_premise: >-
            The explicit MPZ substitution is absent; the complete resource
            ledger is absent; the r and admissible-controller quantifiers are
            not frozen exactly; and the inventor-protocol Pareto fields are
            absent. The drafts are terminal failure provenance only and do
            not satisfy the completion gate.
        - object: >-
            representation-wide latent bad-advice mixture with positive
            unconditional marginal bias
          first_missing_premise: >-
            (A2) uniform conditional bias. The unconditional marginal
            exceeds 1/2, but the conditional bias fails after conditioning
            on the adaptive history. The amplification lemma requires the
            conditional bias and does not apply. The mixture is not
            obstructed and remains open.
        - object: >-
            shared advice bank or shared online coins across replicas
          first_missing_premise: >-
            (A3) independent preallocated serialized banks. The banks are
            not mutually independent (they are shared) or the coins are
            correlated, so the s answers for a call are not conditionally
            independent and the majority is not amplified. The object is not
            obstructed and remains open.
        - object: >-
            bias exactly one half
          first_missing_premise: >-
            (A2) with epsilon > 0. If the bias is exactly 1/2 then
            epsilon = 0 and s >= ln(4q)/(2*0) is infinite; the
            amplification does not work. The object is not obstructed and
            remains open.
        - object: >-
            epsilon inverse with a positive power of B
          first_missing_premise: >-
            (A2) with epsilon^{-1} = B^(o(1)). If epsilon^{-1} = B^c for
            c > 0 then s = B^{2c+o(1)} and q*s = B^{2c+o(1)}, which is not
            B^(o(1)). The MPZ bound becomes
            3*(q*s)^3*B^(-1/4+o(1)) = B^{6c-1/4+o(1)}, which is not o(1)
            for c > 1/24. The object is not obstructed and remains open.
        - object: >-
            bank chosen after observing the target or adaptive history
          first_missing_premise: >-
            (A3) target-independent preallocated banks. The advice is
            target-conditioned or history-conditioned, so the MPZ model does
            not apply (the advice must be target-independent and generated
            before Q). The object is not obstructed and remains open.
        - object: >-
            opaque external state or an extra oracle
          first_missing_premise: >-
            (A1) ordinary-generic with no extra oracle, and (A3) serialized
            bits with no opaque handle. The advice is not serialized bits or
            the predicate uses an extra oracle, so the MPZ model does not
            apply. The object is not obstructed and remains open.
        - object: >-
            random-deck-only, coordinate-aware, or P1553 target-local
            predicate
          first_missing_premise: >-
            (A1) ordinary-generic, and (A2) bias for every allowed deck
            state. The predicate is coordinate-aware or P1553, or is
            guaranteed only for random decks, so the MPZ model does not
            apply and the conditional bias premise does not hold for every
            allowed deck state. The object is not obstructed and remains
            open.

  preserved_open_models:
    - success only on average over the generic representation
    - success only on average over decks or targets
    - bias that disappears after conditioning on adaptive history
    - shared bad advice or correlated coins across calls
    - target-conditioned advice, extra oracles, or opaque handles
    - coordinate-aware P1553 remainder and dyadic-unit-product methods
    - existence or efficient construction of any predicate satisfying A2
    - average-only marginal success as an obstruction target
    - B71 admission, lane closure, goal completion, and breakthrough

