proof_search_map:
  schema: crypto.autoresearch.proof_search_map.v1
  id: PSM-P1553-FIXED-TARGET-ADVICE-BANK-053708
  task_id: TASK-20260827-053708
  packet_id: P1553-FIXED-TARGET-ADVICE-BANK-CORRECTION-20260827-668542
  goal_id: GOAL-ECDLP-001
  recorded_at: "2026-08-27"
  role: idea-generator
  supersedes_failed_task: TASK-20260827-668542
  correction: CORR-20260827-e1398a
  review_plan: REVIEW-PLAN-P1553-FIXED-TARGET-ADVICE-BANK-668542-V2
  claim_ceiling: >-
    At most an independently reviewed conditional amplification obstruction
    for the stronger uniformly conditionally biased fixed-target
    ordinary-generic interface. It is not an obstruction for ordinary
    average-only marginal success, a predicate construction, a P1553 or
    coordinate result, a generic ECDLP lower bound, an algorithm, attack,
    speedup, SOTA movement, B71 admission, lane closure, goal completion, or
    breakthrough.

  bottleneck: >-
    The exact step whose removal changes the theorem is the conditional
    Hoeffding tail plus adaptive union bound that converts a per-bank
    conditional bias of 1/2+epsilon into a jointly correct q-call
    transcript, followed by the MPZ substitution of the amplified
    resources ell_total = q*s*B^(9/4+o(1)) and
    k_total = q*s*B^(5/4+o(1)) into 3*ell*(k+1)^2/N. Without the
    conditional (history-uniform) bias premise the tail bound is
    unavailable; without the complete resource ledger the amplified
    resources do not map into the inherited MPZ rectangle and the
    substitution is not licensed.

  baseline_embedding:
    parameter_slice: >-
      The best-known baseline is the imported MPZ Theorem 3 bound
      3*ell*(k+1)^2/N evaluated on the inherited target-shift resource
      rectangle ell = B^(9/4+o(1)), k = B^(5/4+o(1)), N = B^5, as
      independently validated in TASK-20260827-c8609e and accepted in
      EV-ECDLP-3fbef8 / DEC-20260827-f3e77a. This proposal is a family
      extension (fresh-bank majority amplification on the fixed-target
      interface), not a new model.
    reproduction_check: >-
      Symbolic: substituting the base rectangle gives
      3*B^(9/4+o(1))*(B^(5/4+o(1))+1)^2/B^5
        = 3*B^(9/4+o(1))*B^(5/2+o(1))/B^5
        = B^(-1/4+o(1)) = N^(-1/20+o(1)),
      exactly the imported target-shift success bound recorded in
      EV-ECDLP-3fbef8 (success_bound field) and recomputed in
      TASK-20260827-c8609e (metric_recomputations: B exponent -1/4,
      N exponent -1/20). The amplified substitution in
      proof-theorem.yaml reduces to this same expression when the
      overhead factor (q*s)^3 = B^(o(1)) is 1, i.e. the baseline is the
      zero-amplification slice of the same formula. No curve or plot is
      used; the check is the exact exponent arithmetic above.

  observation_collision:
    observable: >-
      The observable carrying the conclusion is the pair
      (MPZ bound 3*ell*(k+1)^2/N, complete-transcript success). The MPZ
      bound is a function of (ell, k, N) only; the complete-transcript
      success is the event that every one of the q adaptive answers is
      correct and the decoder plus mandatory final verification produce x.
    distinct_preimage_search: >-
      Two distinct objects with the same resource observable: (a) the
      inherited target-shift object with ell = B^(9/4+o(1)),
      k = B^(5/4+o(1)) and an exact (always-correct) predicate premise;
      (b) the amplified fixed-target object with
      ell_total = q*s*B^(9/4+o(1)), k_total = q*s*B^(5/4+o(1)) and a
      merely biased (1/2+epsilon) predicate premise. Both are mapped into
      the same MPZ bound form, and both are bounded by o(1) once their
      resources are substituted. The collision shows the MPZ bound alone
      cannot identify which premise (exactness vs conditional bias plus
      amplification) is doing the work; the separating condition is the
      complete-transcript success lower bound (>= 3/4 after amplification,
      nonvanishing by premise in the target-shift case) together with the
      implication complete-transcript success implies extraction success.
      A marginal per-query success observable would collide with objects
      the theorem does not obstruct, which is exactly why the theorem is
      stated on the joint transcript event and the marginal composition is
      rejected (imported control, TASK-20260827-c8609e
      success_event_mapping).

  quantifier_order:
    statement: >-
      For all primes N with B = N^(1/5), r = ceil(log2 B),
      m = 2^r, N > 4L+1:
      for all fixed-target Query2P1 predicate objects P satisfying A1
      (ordinary-generic, target-independent), A2 (uniform conditional bias
      1/2+epsilon for every fixed representation, allowed deck state,
      restriction, target, and admissible history independent of the
      unused banks, with epsilon^{-1} = B^(o(1))), A3 (q*s mutually
      independent preallocated serialized banks, no opaque handle, no
      post-target or post-history bank selection, no sharing), A4
      (admissible controller, q <= 5r+3 calls, each inside the admitted
      call domain), and A5 (complete resource ledger, no uncharged term):
      for all odd s >= ln(4q)/(2 epsilon^2) with q*s = B^(o(1)):
      the majority-amplified transcript has complete-transcript success
      at least 3/4 (pointwise in representation and target), hence
      average-case extraction success at least 3/4, while MPZ Theorem 3
      bounds average-case extraction success by
      3*ell_total*(k_total+1)^2/N = B^(-1/4+o(1)) = o(1);
      therefore no such P exists.
    witness_dependency_check: >-
      No witness depends on the instance in a way the uniform conclusion
      forbids: P and C are fixed before the representation and target are
      sampled; the banks are generated before Q is known and are
      target-independent; the controller's calls are determined by the
      admitted domain and the prior answers, not by the representation or
      x. The premise is pointwise (forall representation, target,
      history) and the MPZ bound is average-case (over representation and
      x), so the pointwise lower bound 3/4 implies the average lower bound
      3/4, which contradicts the average upper bound o(1). A controller
      that leaves the admitted call domain is outside the quantifier by
      A4; a bias that holds only on average over representations or decks
      is outside the quantifier by A2.

  constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        The invariant tracked through the adaptive transcript is the
        conditional correctness of each unused bank group given the full
        admissible history, not the marginal correctness of individual
        answers. The stronger state (history-conditional bias plus
        conditional independence of the unused group) is what survives the
        adaptive recursion; the marginal bias does not.
      predicted_gain: >-
        Converts a per-bank conditional bias 1/2+epsilon into a
        jointly correct transcript with failure at most
        q*exp(-2 epsilon^2 s) <= 1/4, at overhead q*s = B^(o(1)).
    - transform: specialize_measure_pack
      proposed_object: >-
        The problem-specific resource measure is the pair
        (ell_total, k_total) with the mandated all-work ledger: every
        build, bit, framing, interaction, majority, shift,
        reconstruction, replay, decode, verification, traffic, teardown,
        and phase-clearing term is charged to ell, aggregate k, or a
        separately bounded local cost before the MPZ substitution.
      predicted_gain: >-
        Licenses the MPZ substitution by ensuring the amplified object
        sits inside the inherited ordinary-generic resource rectangle with
        no uncharged or reset work; the o(1) overhead is explicit
        (q*s = B^(o(1))) rather than hidden.

  method_ceiling:
    strongest_certifiable_claim: >-
      The strongest result this method can certify is the conditional
      amplification obstruction stated in proof-theorem.yaml: under every
      imported MPZ and target-shift premise, no uniformly conditionally
      biased fixed-target ordinary-generic predicate with an admissible
      controller and independent preallocated serialized banks can be
      amplified to complete-transcript success at least 3/4 inside the
      inherited resource rectangle. It cannot certify existence or
      construction of any predicate, an obstruction for average-only
      marginal success, a P1553 or coordinate result, a generic ECDLP
      lower bound, an algorithm, attack, speedup, SOTA movement, B71
      admission, lane closure, goal completion, or breakthrough.
    nearby_object_control: >-
      The closest object on which the hoped-for conclusion fails is the
      representation-wide latent bad-advice mixture with positive
      unconditional marginal bias: its unconditional marginal exceeds 1/2,
      so a marginal-only argument would certify the same obstruction
      there, but its conditional bias fails on reachable histories, so the
      amplification lemma stops at A2 and the mixture is not obstructed.
      The method distinguishes the pair only through the conditional bias
      premise; a method that certified the obstruction on the mixture as
      well would have an invalid probability step. The invalid predecessor
      TASK-20260827-668542 is the second nearby object: it lacks the MPZ
      substitution, the complete cost mapping, the exact r and
      admissible-controller quantifiers, and the Pareto typing, so the
      method's output on it is a revise/no-admission card, not a theorem.

  proves_too_much_controls:
    source: review-plan-v2.yaml proves_too_much.objects
    objects:
      - id: PTM-1
        object: >-
          receiptless TASK-20260827-668542 drafts missing MPZ
          substitution, complete cost mapping, exact quantifiers, and
          Pareto typing
        expected_behavior: rejected
        result: >-
          Rejected. The successor states the explicit MPZ substitution
          (3*ell_total*(k_total+1)^2/B^5 = B^(-1/4+o(1)) = o(1)), the
          complete all-work ledger with zero uncharged terms, the frozen
          r = ceil(log2 B), q <= 5r+3, and admissible-controller
          quantifiers, and the inventor-protocol Pareto fields
          (dominated_by: unverified_full_frontier, numeric zero SOTA
          deltas). The predecessor drafts remain immutable terminal
          failure provenance and are not evidence.
      - id: PTM-2
        object: >-
          representation-wide latent bad-advice mixture with positive
          unconditional marginal bias
        expected_behavior: stop_at_first_missing_premise
        result: >-
          Stops at A2 (uniform conditional bias). The unconditional
          marginal exceeds 1/2 but the conditional bias fails after
          conditioning on the adaptive history; the conditional Hoeffding
          tail is unavailable and the mixture is not obstructed. Preserved
          open.
      - id: PTM-3
        object: >-
          shared advice bank or shared online coins across replicas
        expected_behavior: stop_at_first_missing_premise
        result: >-
          Stops at A3 (independent preallocated serialized banks). Shared
          banks or shared coins make the s answers for a call conditionally
          dependent, so the majority tail exp(-2 epsilon^2 s) is
          unavailable. Not obstructed. Preserved open.
      - id: PTM-4
        object: >-
          bias exactly one half or epsilon inverse with a positive power
          of B
        expected_behavior: stop_at_first_missing_premise
        result: >-
          Stops at A2. Bias exactly 1/2 gives epsilon = 0 and requires
          s = infinity; epsilon^{-1} = B^c with c > 0 gives
          q*s = B^{2c+o(1)} and MPZ bound B^{6c-1/4+o(1)}, which is not
          o(1) for c > 1/24. Not obstructed. Preserved open.
      - id: PTM-5
        object: >-
          bank chosen after observing the target or adaptive history
        expected_behavior: stop_at_first_missing_premise
        result: >-
          Stops at A3 (target-independent preallocated banks before Q).
          Post-target or post-history bank selection reverses the advice
          quantifier order and leaves the MPZ two-phase model. Not
          obstructed. Preserved open.
      - id: PTM-6
        object: >-
          opaque external state or an extra oracle
        expected_behavior: stop_at_first_missing_premise
        result: >-
          Stops at A1 (ordinary-generic, no extra oracle) and A3
          (serialized bits, no opaque handle). An opaque handle or extra
          oracle changes the model and invalidates the MPZ mapping and the
          complete-k premise. Not obstructed. Preserved open.
      - id: PTM-7
        object: >-
          random-deck-only, coordinate-aware, or P1553 target-local
          predicate
        expected_behavior: stop_at_first_missing_premise
        result: >-
          Stops at A1 (ordinary-generic) and A2 (bias for every allowed
          deck state). A random-deck-only guarantee supplies no premise
          for the deterministic admitted decks; coordinate-aware or P1553
          structure changes the model and no transfer lemma is supplied.
          Not obstructed. Preserved open.
    failure_signature_check: >-
      The argument rejects the invalid predecessor (PTM-1) and stops at a
      named first missing premise in every nearby object (PTM-2..PTM-7).
      It does not certify the same obstruction on any object where the
      conclusion is known false or outside scope, so the probability,
      accounting, and scope are not invalidated by the controls.

  pareto_typing:
    dominated_by: unverified_full_frontier
    dominated_by_note: >-
      No actual complete comparison against every row of the frontier
      (across time, memory, and data/queries) was performed in this
      zero-run proof-only session, so dominated_by is set to
      unverified_full_frontier rather than null. Setting it to null
      without the full check would be a fabrication under AGENTS.md rule 5.
    sota_delta:
      time: 0
      memory: 0
      data_query: 0
      note: >-
        Numeric realized SOTA deltas of zero on all three axes: this
        deliverable is a proof-only conditional obstruction candidate with
        no algorithm, no experiment, no implementation, and no realized
        time, memory, or data/query point. No SOTA movement is claimed.

  open_successors:
    - construction or existence of any predicate satisfying A2 (open, unestablished)
    - average-only marginal success models (open, preserved)
    - shared or correlated advice and coins (open, preserved)
    - target-conditioned advice, extra oracles, opaque handles (open, preserved)
    - coordinate-aware P1553 remainder and dyadic-unit-product methods (open, preserved)
    - B71 admission, lane closure, goal completion, breakthrough (all open, not claimed)

