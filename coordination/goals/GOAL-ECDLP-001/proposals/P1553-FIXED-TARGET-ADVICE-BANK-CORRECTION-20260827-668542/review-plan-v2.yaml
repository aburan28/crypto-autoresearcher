  coordinator_prior: >-
    The first receiptless drafts correctly isolated the filtration-uniform bias
    mechanism and conditional majority tail, but they did not complete the MPZ
    substitution, all-work resource ledger, exact r and admissible-controller
    quantifiers, or inventor-protocol Pareto typing. A corrected successor can
    plausibly repair those omissions. Even if it does, construction of any
    predicate satisfying the strong premise, average-only marginals, correlated
    advice, target-conditioned advice, opaque state, coordinate/P1553 methods,
    and all scientific admission questions remain open.
  claim_under_review: >-
    Whether, under a history-uniform conditional bias of at least
    1/2+epsilon for every unused independent preallocated serialized bank, a
    q-call admissible ordinary-generic adaptive transcript can be amplified to
    complete success at least 3/4 with q*s=B^(o(1)) overhead and therefore
    contradict the imported MPZ preprocessing bound inside the exact inherited
    resource and model premises.
  joints:
    - joint: J1-adaptive-conditional-majority-and-union-bound
      assigned_to: TASK-20260827-357875
      role: reviewer
      attack_plan: >-
        Re-derive the filtration, conditional Hoeffding-Azuma bound, odd
        majority size, adaptive union bound, and admissible-controller
        quantifiers. Reproduce all four invalid-predecessor omissions as
        negative controls and verify that the successor repairs them without
        silently using iid correctness or average-only marginal bias.
      expected_break: >-
        The next unused bank may be measurable from prior history, the bias may
        fail on a reachable prefix, or the controller may leave the admitted
        predicate domain.
    - joint: J2-bank-serialization-MPZ-binding-and-complete-accounting
      assigned_to: TASK-20260827-7866ad
      role: validator
      attack_plan: >-
        Independently retrieve and hash-bind MPZ, verify the exact model and
        success quantifiers, recompute ell_total, k_total, and the
        B^(-1/4+o(1)) bound, and charge every build, bit, invocation, local
        operation, shift, reconstruction, replay, decode, verification,
        traffic, teardown, and phase-clearing term. Reject any extra oracle,
        reset interaction counter, opaque handle, or uncharged cost.
      expected_break: >-
        Complete bank generation or wrapper work may not map into ell/k, or
        the imported obstruction may require a different transcript, advice,
        or interaction model.
    - joint: J3-quantifier-scope-proves-too-much-and-open-routes
      assigned_to: TASK-20260827-042846
      role: red-team
      attack_plan: >-
        Run the representation-wide bad-advice mixture, shared-bank and
        shared-coin, exact-half bias, polynomial epsilon inverse, target-
        conditioned, post-target bank selection, opaque-handle, extra-oracle,
        random-deck, coordinate/P1553, and unchecked-frontier controls. Require
        the proof to stop at the first missing premise and preserve every open
        route and zero realized SOTA delta.
      expected_break: >-
        A marginal success claim may be smuggled into a conditional premise,
        or the MPZ conclusion may be exported beyond the ordinary-generic
        serialized-advice model.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - receiptless TASK-20260827-668542 drafts missing MPZ substitution, complete cost mapping, exact quantifiers, and Pareto typing
      - representation-wide latent bad-advice mixture with positive unconditional marginal bias
      - shared advice bank or shared online coins across replicas
      - bias exactly one half or epsilon inverse with a positive power of B
      - bank chosen after observing the target or adaptive history
      - opaque external state or an extra oracle
      - random-deck-only, coordinate-aware, or P1553 target-local predicate
    failure_signature: >-
      The argument must reject the invalid predecessor and stop at the first
      absent premise in every nearby object. If it certifies the same
      obstruction there, its probability, accounting, or scope is invalid.
