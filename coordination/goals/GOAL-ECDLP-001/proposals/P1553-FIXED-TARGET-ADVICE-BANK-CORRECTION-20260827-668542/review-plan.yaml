review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-P1553-FIXED-TARGET-ADVICE-BANK-20260827-668542
  goal_id: GOAL-ECDLP-001
  batch_id: null
  packet_id: P1553-FIXED-TARGET-ADVICE-BANK-CORRECTION-20260827-668542
  recorded_at: "2026-08-27"
  coordinator_prior: >-
    The amplification should hold only with a bias uniform after conditioning
    on the fixed generic representation, public deck/restriction state, target,
    and adaptive history independent of the unused bank. The ordinary
    average-only marginal model should survive as a known-false control.
  claim_under_review: >-
    Preallocated independent serialized advice banks amplify a uniformly
    conditionally biased fixed-target ordinary-generic predicate to a jointly
    correct adaptive target-shift transcript with only B^(o(1)) overhead, so
    the archived MPZ obstruction applies to that stronger interface.
  joints:
    - joint: J1-adaptive-conditional-majority-and-union-bound
      assigned_to: TASK-20260827-357875
      role: reviewer
      attack_plan: >-
        Re-derive the conditional probability space, unused-bank independence,
        Chernoff constant, union bound, adaptive filtration, and complete
        transcript event. Construct a representation-wide bad-advice mixture.
      expected_break: >-
        The producer may use an unconditional marginal where the target or
        history is correlated with a bad representation or advice block.
    - joint: J2-bank-serialization-and-mpz-accounting
      assigned_to: TASK-20260827-7866ad
      role: validator
      attack_plan: >-
        Independently retrieve MPZ, charge q*s complete advice copies and every
        aggregate interaction without reset, and verify that epsilon^-1=B^(o(1))
        makes the overhead B^(o(1)) rather than free.
      expected_break: >-
        Advice replication, bank selection, public-handle reconstruction, or
        query interactions may be omitted or may exceed the rectangle.
    - joint: J3-quantifier-scope-and-proves-too-much
      assigned_to: TASK-20260827-042846
      role: red-team
      attack_plan: >-
        Run all average-only, shared-advice, shared-coin, history-conditioned,
        target-conditioned, extra-oracle, coordinate/P1553, and vanishing-bias
        controls and name the first missing premise for each.
      expected_break: >-
        The conclusion may silently expand from uniform conditional bias to
        ordinary marginal success or from ordinary-generic to coordinates.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - representation-wide bad-advice mixture with positive unconditional marginal bias
      - shared-advice and shared-coin correlated repetitions
      - bias exactly one half
      - epsilon inverse not B^(o(1))
      - target-conditioned bank selection
      - average-only deck or target success
      - extra-oracle predicate
      - coordinate-aware P1553 target-local transducer
    failure_signature: >-
      The proof must stop at the first absent conditional-bias, independence,
      serialization, cost, or ordinary-generic premise. If it amplifies the
      bad-advice mixture, the corresponding joint breaks.
  blind_rederivation:
    required: true
    quantity: >-
      q, s, the adaptive conditional tail/union bound, the advice and aggregate
      interaction overhead, and the final MPZ exponent.
    assigned_to: TASK-20260827-eef407
    blind_from:
