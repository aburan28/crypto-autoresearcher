blind_statement:
  schema: crypto.autoresearch.blind_statement.v1
  id: BLIND-P1553-FIXED-TARGET-ADVICE-BANK-668542
  goal_id: GOAL-ECDLP-001
  packet_id: P1553-FIXED-TARGET-ADVICE-BANK-CORRECTION-20260827-668542
  recorded_at: "2026-08-27"
  quantity: >-
    Let q<=5r+3 with r=ceil(log2 B). A randomized fixed-target bit predicate
    receives target-independent serialized advice of ell0 bits and uses at
    most k0 charged main-phase interactions. For every fixed generic
    representation, allowed public deck/restriction state, target, and prior
    history independent of an unused bank, one fresh independently generated
    bank and fresh coins return the correct bit with probability at least
    1/2+epsilon, where epsilon^-1=B^(o(1)). Derive the bank count s needed per
    adaptive call for total transcript failure at most 1/3, and derive total
    advice and interaction exponents when ell0=B^(9/4+o(1)) and
    k0=B^(5/4+o(1)).
  required_derivation:
    - Condition on the complete prior history and fixed representation before analyzing the unused bank group.
    - State the independence and uniform conditional-bias assumptions used by the tail bound.
    - Choose an explicit s=O(epsilon^-2 log q) and union-bound q adaptive calls.
    - Charge q*s advice banks, all main interactions, majority work, reconstruction, replay, verification, and teardown.
    - Substitute the resulting ell and k into 3*ell*(k+1)^2/N with N=B^5.
    - Give a counterexample showing why unconditional average-only marginal success cannot be amplified by this proof.
  forbidden_sources:
    - producer artifacts
    - snapshot receipt
    - dispatch queue
    - packet and review plan
    - sibling review outputs or messages
  output_boundary: >-
    Statement-only derivation with no J1-J3 joint and no whole-claim or
    scientific-state verdict.
  claim_ceiling: >-
    At most a conditional amplification lemma for a uniformly conditionally
    biased ordinary-generic fixed-target interface. No conclusion about
    average-only marginals, P1553, coordinates, attacks, SOTA, B71, or a
    breakthrough.
