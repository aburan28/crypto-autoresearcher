  id: P1553-FIXED-TARGET-ADVICE-BANK-CORRECTION-20260827-668542
  goal_id: GOAL-ECDLP-001
  recorded_at: "2026-08-27"
  opened_by: coordinator
  opening_commit: bfd969cd65b29329f289707ffc03b40e9ad2519f
  basis:
    - ledger/evidence/EV-ECDLP-3fbef8.yaml
    - ledger/decisions/DEC-20260827-f3e77a.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/P1553-MIXED-RADIX-TARGET-SHIFT-SUCCESSOR-20260827-6b69e4/reviews/TASK-20260827-c8609e/mpz-validation.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/P1553-MIXED-RADIX-TARGET-SHIFT-SUCCESSOR-20260827-6b69e4/reviews/TASK-20260827-2e2dc4/scope-red-team.yaml
  objective: >-
    Determine whether fresh target-independent serialized advice banks turn a
    uniformly biased fixed-target randomized Query2P1 predicate into the one
    jointly correct adaptive transcript required by the archived target-shift
    obstruction, while preserving average-only marginal models as open.
  candidate_construction: >-
    Before Q is known, generate q*s mutually independent advice banks, with
    q at most 5r+3 and s=Theta(epsilon^-2 log q). For adaptive call j, use only
    its unused group of s banks and fresh independent main-phase coins, take a
    majority answer, and discard that group. Under a correctness bias of at
    least 1/2+epsilon conditional on every fixed generic representation,
    allowed public deck state, restriction, target, and prior history
    independent of the unused banks, Chernoff plus a union bound yields a
    jointly correct transcript with nonvanishing probability.
  mandatory_assumptions:
    - The predicate and every advice bank are target-independent and ordinary-generic.
    - Conditional correctness bias is at least 1/2+epsilon for every fixed representation, allowed deck/restriction state, target, and admissible prior history.
    - epsilon inverse is B^(o(1)); all banks and coins are mutually independent before use.
    - Advice contains serialized bits only; no opaque generic handle crosses the phase boundary.
    - Every bank build, bit, predicate interaction, majority operation, target shift, replay, decode, verification, and teardown is charged.
  preserved_open_models:
    - success only on average over the generic representation
    - success only on average over decks or targets
    - bias that disappears after conditioning on adaptive history
    - shared bad advice or correlated coins across calls
    - target-conditioned advice, extra oracles, or opaque handles
    - coordinate-aware P1553 remainder and dyadic-unit-product methods
  required_controls:
    - A representation-wide bad-advice mixture whose unconditional marginal exceeds one half but whose conditional bias fails.
    - Shared advice and shared-coin variants where majority samples are correlated.
    - Bias exactly one half and epsilon inverse larger than B^(o(1)).
    - Target-conditioned banks and a bank chosen after observing the adaptive target.
    - Fixed target with uniform conditional bias as the positive control.
    - Random-deck, coordinate/P1553, and extra-oracle objects as scope controls.
  budget:
    experiments: 0
    implementations: 0
    producer_commands: 0
    maximum_concurrent_reviews: 4
  novelty_status: unverified
  scientific_transition: none
  claim_ceiling: >-
    At most an independently reviewed conditional amplification obstruction for
    the stronger uniformly conditionally biased fixed-target ordinary-generic
    interface. It is not an obstruction for ordinary average-only marginal
    success, a predicate construction, a P1553 or coordinate result, a generic
    ECDLP lower bound, an algorithm, attack, speedup, SOTA movement, B71
    admission, lane closure, goal completion, or breakthrough.
