blind_statement:
  schema: crypto.autoresearch.blind_statement.v1
  id: BLIND-P1553-MIXED-RADIX-THREE-DECK-55000d
  goal_id: GOAL-ECDLP-001
  recorded_at: "2026-08-25T00:53:00Z"
  quantity: >-
    Decide from the statement alone whether three exact subset-stable
    mixed-radix decks plus a labelled F_3 dictionary and F_4 complement scan
    yield a verified DLP extractor inside the supplied preprocessing
    generic-group resource rectangle.
  frozen_statement:
    - G=<P> is a prime-order generic group of order N and Q=[x]P is fresh
    - B=N^(1/5), m=2^ceil(log2 B), and C=sum_i_0_to_4 m^i
    - F_i contains labelled signed occurrences (i,d,sigma,[sigma(d+1)m^i]P) for 0<=d<m
    - target R=Q+[C]P
    - one target-independent object answers the exact existence predicate after canonical dyadic restrictions of F_0 through F_2 while F_3 and F_4 stay whole
    - all labelled F_3 and F_4 occurrences are public and reconstructible from known scalar lineage
    - phase-crossing advice is at most B^(9/4+o(1)) ordinary bits
    - every main interaction, including public-handle reconstruction, F_3 dictionary construction, collision-list retention, F_4 complement lookups, replay, decoding, and verification, is included in one B^(5/4+o(1)) cap
    - supplied theorem bound is success <=3 ell (k+1)^2/N for ell advice bits and k aggregate main interactions
  required_derivation:
    - prove or refute the three-deck bisection invariant and exact 3 log2(2m) query count
    - prove or refute completeness of the labelled F_3 dictionary and F_4 complement scan
    - derive the labelled decoder and final verification under signs, identity, duplicate, modular, and cross-deck collisions
    - count reconstruction, dictionary, collision-list, lookup, shared-RO, replay, decoding, and verification interactions and advice bits
    - derive the B and N success exponents
    - state the exact nonapplicability boundary after removing the third restriction without claiming a 3SUM lower bound
  known_false_transfers:
    - only two restrictable decks with a three-public-deck 3SUM-like remainder
    - anonymous public occurrences whose labels cannot be reconstructed from scalar lineage
    - target-conditioned advice
    - nonreconstructible opaque public-deck handles
    - random-deck-only or non-subset-stable interfaces
    - marginal per-query rather than complete-transcript success
    - coordinate-aware P1553, Semaev, resultant, or field-arithmetic oracle
    - unbounded-bit unit-cost state
  sources_allowed:
    - this blind statement
    - the standalone committed handoff for TASK-20260825-ea3140
    - mandatory role and harness contracts named by that handoff
