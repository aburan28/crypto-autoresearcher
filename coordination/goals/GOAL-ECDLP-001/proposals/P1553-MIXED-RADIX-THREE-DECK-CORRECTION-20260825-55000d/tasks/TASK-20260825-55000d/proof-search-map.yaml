proof_search_map:
  schema: crypto.autoresearch.proof_search_map.v1
  id: P1553-MIXED-RADIX-THREE-DECK-CORRECTION-20260825-55000d
  packet: P1553-MIXED-RADIX-THREE-DECK-CORRECTION-20260825-55000d
  task_id: TASK-20260825-55000d
  goal_id: GOAL-ECDLP-001
  recorded_at: "2026-08-26T00:00:00Z"
  recorded_at_basis: date supplied by runtime context; wall-clock time was not sampled
  claim_under_audit: >-
    Whether the reviewed four-restriction mixed-radix generic-interface
    reduction can be strengthened to exactly three cumulative restrictions by
    replacing the isolated F_3 occurrence with a complete labelled F_3
    encoding dictionary and an F_4 complement scan, without changing the
    B^(9/4+o(1)) bit, B^(5/4+o(1)) interaction, or B^(-1/4+o(1)) MPZ exponents.
  status: complete_for_producer_stage
  audits:
    exact_baseline_reproduction:
      applies: true
      baseline: >-
        The reviewed four-deck correction uses the same N,B,m,C,F_i,R,
        cumulative exact-predicate invariant, decoder, final verification, and
        MPZ rectangle. It isolates F_0,F_1,F_2,F_3 with exactly
        4*log2(2m) calls and scans all 2m public F_4 occurrences.
      reproduced_steps:
        - initial witness under the exact target-independent predicate
        - canonical left-half query and exact complementary NO branch
        - cumulative nonempty-witness invariant through singleton isolation
        - signed mixed-radix decoder and final group verification
        - complete crossing-bit and aggregate-interaction charge
        - "3*ell*(k+1)^2/N with exponents 9/4+5/2-5=-1/4"
      changed_component: >-
        Stop restriction after F_2, form W=R-e_0-e_1-e_2, store all public
        labelled F_3 encodings with full collision fibres, and scan public
        labelled F_4 by exact complement keys.
      result: pass_as_symbolic_reproduction_pending_independent_review
      break_conditions:
        - any baseline parameter, sign convention, decoder offset C, or probability space differs
        - bisections do not share one cumulative exact predicate state
        - the changed join receives an uncharged resource or stronger oracle
    observable_collision_search:
      applies: true
      observable: exact generic encoding used as the F_3 dictionary key
      certificate: >-
        A complete fibre mapping each observed encoding key to every distinct
        F_3 occurrence label, signed digit, and reconstruction backpointer that
        produces that key.
      distinct_preimage_search:
        - same-deck distinct labels with the same generic encoding
        - opposite signs or modular wraparound producing the same encoding
        - identity encodings and duplicate occurrences
        - cross-deck equality between an F_3 key and an F_4 complement
        - shared-random-oracle/equality collisions and replayed encodings
      constructive_transform:
        type: observable_fiber
        description: >-
          Replace a representative-only hash table by the complete labelled
          fibre over each exact encoding. Enumerating the fibre converts an
          encoding-level join into all labelled preimages required by the
          decoder while making collision multiplicity an explicit charged cost.
      nearby_known_false_object:
        object: a representative-only dictionary whose retained representative has the wrong signed digit while a discarded colliding occurrence is the unique valid witness
        known_false_conclusion: the representative-only dictionary is a complete labelled decoder
        expected_control_behavior: the proof fails at labelled_join_completeness before claiming recovery
      result: pass_conditionally_with_full_fibres_and_aggregate_collision_charge
      break_conditions:
        - any collision list is truncated, deduplicated by encoding alone, or hidden behind a free handle
        - occurrence labels or scalar lineage cannot be reconstructed
        - total fibre enumeration exceeds the assumed k aggregate
    quantifier_order_and_constructive_transform:
      applies: true
      quantifier_order:
        - universal choice of prime-order dense generic group and arbitrary public signed labelled decks
        - universal target-independent preprocessing state, scalar lineage, and random tape
        - fresh uniform target Q and generic encoding randomness
        - adaptive but exact cumulative restrictions of F_0,F_1,F_2
        - conditional existence of a witness for the initial exact predicate
        - constructive isolation and labelled join of at least one surviving witness
        - probability over the complete adaptive transcript
      forbidden_reordering:
        - choosing preprocessing, decks, labels, advice, or hidden state after seeing Q
        - replacing universal arbitrary decks with an average over random decks
        - replacing a complete transcript bound with independent marginal-query bounds
        - choosing a different existential object or witness state for each bisection without preserving cumulative feasibility
      constructive_transform:
        type: representation_reduction
        input: exact target-independent three-deck cumulative restriction interface plus two public labelled reconstructible decks
        output: a generic discrete-log candidate generator with a final [x_hat]P=Q verifier
        steps:
          - preserve a nonempty witness set while isolating F_0,F_1,F_2
          - reduce the remaining equation to a two-list encoding sum
          - realize that sum by a complete observable-fibre dictionary and complement scan
          - decode public signed scalar lineage and verify in the group
      result: pass_as_explicit_conditional_reduction_pending_blind_rederivation
      break_conditions:
        - target advice, representation leakage, or nonpublic lineage enters the transform
        - exactness or cumulative subset stability is weakened
        - the output omits final group verification
    method_ceiling:
      applies: true
      strongest_certifiable_claim: >-
        Only the conditional three-restriction generic-interface reduction and
        its resource-exponent substitution, after independent source,
        accounting, scope, and blind review.
      ceiling_reason: >-
        The method uses a two-list join. With only F_0,F_1 restricted, the
        residual has three public summands F_2+F_3+F_4; this construction has
        neither a third-list elimination nor a certified lower bound for that
        remainder. It also assumes generic encodings and therefore says
        nothing about coordinate-specific or non-subset-stable structure.
      proves_too_much_controls:
        - control: remove exact restriction on F_2
          nearby_object: >-
            A synthetic residual instance in which the unique valid solution
            uses a nonzero F_2 occurrence and no F_3+F_4 pair alone sums to W.
          known_false_conclusion: the unchanged one-dictionary/one-scan construction is complete for the three-public-deck residual
          expected_control_behavior: STOP before the join; no B^2 or 3SUM lower bound is inferred
        - control: irrecoverably hide all F_3 occurrence labels while retaining only encoding keys
          nearby_object: two colliding labels decode to different signed digits and only one verifies
          known_false_conclusion: an anonymous encoding key uniquely determines the labelled digit needed by the decoder
          expected_control_behavior: STOP unless public target-independent lineage reconstructs every occurrence
        - control: provide only marginal per-call success bounds
          nearby_object: adaptively correlated answers whose marginals look valid but whose joint transcript violates the claimed event calculation
          known_false_conclusion: marginal bounds alone establish the complete adaptive-transcript probability
          expected_control_behavior: STOP and require the MPZ full-transcript statement
      non_transfer_boundaries:
        - coordinate P1553 and Semaev systems
        - non-subset-stable or representation-sensitive predicates
        - random-deck-only interfaces
        - target-advised preprocessing
        - opaque handles, extra oracles, representation leakage, and unbounded words
      result: ceiling_explicit_and_negative_lane_claim_refused
      break_conditions:
        - any P1553, coordinate, generic-ECDLP, B71, SOTA, algorithm, attack, speedup, closure, completion, or breakthrough language is promoted from nonclaim to conclusion
        - the three-public-deck stopping point is described as a lower bound or a dead lane
  proof_obligations:
    - id: PO-state-invariant
      requirement: prove exact cumulative bisection preserves a common witness through all three decks
      falsifier: an exact-call trace whose selected complementary half is empty despite a nonempty incoming state
    - id: PO-call-count
      requirement: derive exactly 3*log2(2m) from three power-of-two decks of size 2m
      falsifier: any hidden padding call, reset, or extra isolation query
    - id: PO-join-completeness
      requirement: show the witness F_3 key is stored and its label survives the full collision fibre queried by witness F_4
      falsifier: a valid witness lost by representative-only storage or irrecoverable labels
    - id: PO-decoder
      requirement: derive the C offset and modular scalar formula from R=Q+[C]P
      falsifier: a genuine labelled five-tuple whose decoded scalar fails final verification
    - id: PO-resource-ledger
      requirement: charge all bits and interactions, including collision fibres, replay, shared random oracle, decoder, and verifier
      falsifier: any persistent target/restriction/dictionary datum or operation absent from ell or k
    - id: PO-MPZ
      requirement: independently verify theorem hypotheses and the full-transcript bound before using the exponent substitution
      falsifier: source text gives a different resource meaning, probability space, shared-RO rule, or bound
    - id: PO-scope
      requirement: fail closed on every stated nonapplicability boundary
      falsifier: unchanged reasoning appears to prove the two-restriction, hidden-label, target-advice, random-only, coordinate, or unbounded-word controls
  scoped_disposition:
    producer_assessment: >-
      The strengthening is technically plausible and falsifiable. The exact
      algebraic transform is explicit, collision fibres are measurable, and
      the nearest overreach fails at a named third-summand obstruction. It is
      ready only for the frozen independent review round.
    dominated_by: null
    dominated_by_check: >-
      Checked only against the reviewed four-deck baseline across time, memory,
      and data/queries. The candidate weakens the subset-stability premise from
      four decks to three while adding B^(1+o(1)) dictionary/scan cost that is
      absorbed by the existing rectangle; no broader SOTA comparison was made.
    sota_delta:
      baseline: reviewed four-deck generic-interface correction
      assumption_delta: one fewer subset-stable deck is required
      time_delta: adds B^(1+o(1)) dictionary/scan work within k=B^(5/4+o(1))
      memory_delta: adds B^(1+o(1)) labelled dictionary bits within ell=B^(9/4+o(1)) when crossing
      success_exponent_delta: 0
      external_sota_claim: none
    decision_boundary: >-
      No acceptance, evidence strengthening, status transition, B71 admission,
      or scientific conclusion is authorized by this producer artifact.

