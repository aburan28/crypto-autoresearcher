  claim_ceiling: >-
    At most an independently reviewed additive generic-interface theorem
    correction for exactly three subset-stable mixed-radix decks and two
    public labelled decks joined by an exact dictionary/complement scan. This
    is not a P1553-specific or coordinate lower bound, not a generic ECDLP
    lower bound, not B71, not a SOTA claim, algorithm, attack, or speedup, and
    not a closure, completion, or breakthrough. It changes no goal, batch,
    hypothesis, experiment, evidence-strength, or scientific status.
  theorem:
    title: Conditional three-restriction mixed-radix reduction with a labelled two-deck join
    kind: conditional_generic_interface_reduction
    statement: >-
      Let G=<P> be a prime-order dense generic group of order N. Put
      B=N^(1/5), m=2^ceil(log2(B)), and C=sum_{i=0}^4 m^i. For each i in
      {0,1,2,3,4}, let F_i contain the 2m independently labelled occurrences
      (i,d,sigma,[sigma(d+1)m^i]P), where 0<=d<m and sigma is in {-1,+1}.
      Assume one target-independent exact existential object supports every
      cumulative canonical dyadic restriction of precisely F_0,F_1,F_2,
      while F_3 and F_4 remain full, public, labelled, and reconstructible
      from target-independent known scalar lineage. For fresh uniform Q, set
      R=Q+[C]P. Conditional on the exact predicate initially having a witness,
      exactly 3*log2(2m) calls isolate labelled e_0,e_1,e_2 while preserving a
      nonempty common witness set. With W=R-e_0-e_1-e_2, an exact dictionary
      containing every generic encoding of F_3 and every colliding occurrence
      label/backpointer, followed by a scan of all F_4 occurrences for the
      complement W-enc(e_4), recovers every matching labelled pair needed for
      decoding. Each candidate decodes as
      x_hat=(sum_{i=0}^4 sigma_i(d_i+1)m^i-C) mod N and is accepted only if
      [x_hat]P=Q. If all ordinary crossing data and all interactions fit
      ell=B^(9/4+o(1)) serialized bits and k=B^(5/4+o(1)) aggregate hard
      interactions, respectively, then the complete adaptive-transcript
      success probability over fresh uniform Q is at most
      3*ell*(k+1)^2/N=B^(-1/4+o(1))=N^(-1/20+o(1)).
    logical_form:
      quantifier_order:
        - "for every prime-order dense generic group G=<P> of order N"
        - "for every set of five arbitrary public signed independently labelled decks of the stated form"
        - "for every preprocessing state and random tape fixed independently of Q"
        - "for fresh uniform Q and the generic encoding randomness"
        - "for every exact adaptive predicate transcript under cumulative restrictions of only F_0,F_1,F_2"
        - "if the initial predicate has a witness, there exists a surviving labelled five-tuple recovered by the construction"
        - "the probability that the complete transcript returns a verified discrete logarithm is bounded by the MPZ expression"
      target_independence: >-
        Decks, scalar lineage, preprocessing, ordinary crossing data, and the
        exact predicate object are fixed before the fresh target Q is sampled.
        No target advice is permitted.
      conditionality: >-
        The reduction does not assert that the exact existential object exists
        within the resource rectangle. It states what follows if that exact,
        subset-stable, target-independent object and all charging assumptions
        hold.
  mechanism:
    baseline: >-
      The reviewed four-deck correction bisected F_0,F_1,F_2,F_3 and scanned
      public F_4. The only proposed strengthening is to bisect F_0,F_1,F_2,
      retain public labelled F_3 as an exact dictionary, and scan public
      labelled F_4 by complements.
    exact_predicate:
      initial_invariant: >-
        The current cumulative restrictions admit at least one labelled
        five-tuple (e_0,e_1,e_2,e_3,e_4) whose generic encodings sum to R.
      call_semantics: >-
        A call returns exactly whether a witness exists after intersecting one
        currently unrestricted deck with the queried canonical half while all
        earlier restrictions remain in force.
      invariant_step: >-
        Query the left canonical half. On YES retain the left half. On NO
        retain its complementary right half; exactness plus the incoming
        nonempty witness set guarantees that the right half is nonempty.
      prohibition: >-
        Independent marginal predicates, approximate answers, predicates that
        forget prior restrictions, or a fresh existential object per call do
        not establish the invariant.
    isolation:
      deck_cardinality: 2m
      power_of_two_reason: m is a power of two, so 2m is a power of two
      calls_per_deck: log2(2m)
      restricted_decks: 3
      total_calls: 3*log2(2m)
      output: three singleton labelled occurrences e_0, e_1, e_2 with a common surviving witness
    dictionary_join:
      residual_equation: "enc(e_3)+enc(e_4)=W, where W=R-enc(e_0)-enc(e_1)-enc(e_2)"
      build: >-
        Enumerate all 2m public F_3 occurrences. Key the dictionary by the
        exact generic encoding and retain the complete list of labels,
        signed digits, and reconstruction backpointers for every key.
      scan: >-
        Enumerate all 2m public F_4 occurrences, compute the exact complement
        key W-enc(e_4), and enumerate every F_3 collision-list entry at that
        key. No matching occurrence may be collapsed to a single representative.
      correctness: >-
        The invariant supplies at least one surviving e_3,e_4 pair. Its F_3
        encoding is stored under exactly the key queried by its F_4 complement,
        and its label remains in the full collision list.
    decoder:
      formula: "x_hat=(sum_{i=0}^4 sigma_i(d_i+1)m^i-C) mod N"
      derivation:
        - "R=Q+[C]P"
        - "sum_i enc(e_i)=R"
        - "enc(e_i)=[sigma_i(d_i+1)m^i]P"
        - "therefore [sum_i sigma_i(d_i+1)m^i-C]P=Q"
      final_verification: "accept a candidate if and only if [x_hat]P=Q"
      corrupt_candidate_behavior: a corrupt predicate answer, label, backpointer, or join match is rejected unless it independently passes final group verification
  proof_decomposition:
    - obligation: state_invariant
      claim: cumulative exact bisection preserves at least one common five-tuple witness
      dependency: exact predicate semantics and initial witness
      failure_condition: any approximate, marginal, noncumulative, or target-advised predicate answer
    - obligation: call_count
      claim: singleton isolation of three 2m-occurrence decks uses exactly 3*log2(2m) calls
      dependency: canonical halves and 2m being a power of two
      failure_condition: noncanonical partitions, padding not charged, or a non-power-of-two deck
    - obligation: labelled_join_completeness
      claim: the F_3 dictionary and F_4 complement scan enumerate every surviving labelled pair
      dependency: exact encoding keys, public reconstructible labels, and complete collision lists
      failure_condition: opaque handles, irrecoverable anonymity, approximate keys, or representative-only collision storage
    - obligation: decoder_correctness
      claim: every genuine joined five-tuple decodes to a scalar whose multiple of P equals Q
      dependency: signed digit lineage, the definition of C and R, and arithmetic modulo N
      failure_condition: lost sign, deck index, digit, label, or modular reduction
    - obligation: complete_resource_charge
      claim: the join adds B^(1+o(1)) storage/bits and interactions and is absorbed by the stated ell,k rectangle
      dependency: ordinary serialized words of logarithmic size and no free handles or representation leakage
      failure_condition: unbounded words, opaque persistent state, uncharged target/restriction/reconstruction data, or an extra oracle
    - obligation: adaptive_transcript_bound
      claim: MPZ applies to the full adaptive transcript and yields the stated exponent
      dependency: independently verified MPZ hypotheses, shared random-oracle accounting, and complete ell,k charging
      failure_condition: only marginal-query success is bounded or any transcript resource is omitted
  resource_accounting:
    parameters:
      N_relation: "N=B^5 at exponent level because B=N^(1/5)"
      deck_size_each: 2m
      m_asymptotic: B^(1+o(1))
    restriction_calls:
      exact_count: 3*log2(2m)
      charged_to: k
    dictionary:
      keys: 2m exact generic encodings before key coalescing
      payload: all 2m occurrence labels, signed digits, and reconstruction backpointers distributed across full collision lists
      bit_cost: O(m*(log(N)+log(m)))=B^(1+o(1))
      interaction_cost: O(m)=B^(1+o(1))
    complement_scan:
      scanned_occurrences: 2m
      lookups: 2m
      base_cost: B^(1+o(1)) interactions and logarithmic-size words
      collision_output_charge: >-
        Every enumerated collision-list entry, replay, decode, and verification
        is charged. The k bound is an assumption on their aggregate; collision
        multiplicity is not declared free.
    crossing_bits:
      ell: B^(9/4+o(1))
      includes: >-
        All ordinary serialized target, restriction, reconstruction,
        dictionary key and collision-list, equality/shared-random-oracle,
        lookup/scan, replay, decoder, and verification data that crosses the
        clearing boundary. If dictionary state crosses that boundary, its
        B^(1+o(1)) bits are included in ell rather than treated as an opaque handle.
    hard_interactions:
      k: B^(5/4+o(1))
      includes: >-
        One aggregate for every generic-group, exact-predicate, target,
        restriction, reconstruction, equality/shared-random-oracle,
        dictionary, collision-list, lookup, scan, replay, decode, and final
        verification interaction.
      absorption_check: "B^(1+o(1)) <= B^(5/4+o(1))"
    mpz_substitution:
      cited_bound: "success <= 3*ell*(k+1)^2/N"
      ell_exponent: 9/4
      k_squared_exponent: 5/2
      N_exponent_in_B: 5
      total_exponent: "9/4+5/2-5=-1/4"
      result_in_B: B^(-1/4+o(1))
      result_in_N: N^(-1/20+o(1))
      probability_space: complete adaptive transcript over fresh uniform Q, generic encoding randomness, and algorithm randomness
  assumptions:
    - universal arbitrary public signed labelled decks, not merely random decks
    - exact cumulative subset stability for exactly F_0,F_1,F_2
    - F_3 and F_4 are full, public, labelled, and reconstructible from target-independent known scalar lineage
    - exact generic encoding keys and complete collision lists with occurrence backpointers
    - every crossing datum is ordinarily serialized; no opaque handles survive clearing
    - no target advice, extra oracle, coordinate or representation leakage, or unbounded words
    - all signs, identities, duplicates, modular collisions, cross-deck collisions, shared-random-oracle calls, replays, decodes, and verifications are charged
    - MPZ is applied only after its hypotheses and the complete ell,k ledger are independently checked
  controls:
    - name: remove_F2_restriction
      modification: restrict only F_0 and F_1, leaving F_2,F_3,F_4 public
      expected_result: >-
        STOP at a three-public-deck 3SUM-like residual. The one-deck dictionary
        plus one-deck scan no longer covers the third summand.
      forbidden_inference: no B^2 lower bound, no 3SUM lower bound, and no P1553 or coordinate lower bound
    - name: hidden_labels
      modification: erase occurrence labels and scalar lineage after exposing encodings
      expected_result: >-
        STOP if anonymity is irrecoverable. Continue only when public
        target-independent scalar lineage reconstructs the exact signed digit
        and deck label for every encoding occurrence.
    - name: opaque_handles
      modification: replace serialized dictionary or predicate state with free persistent handles
      expected_result: STOP because the ell,k MPZ substitution is not established
    - name: random_deck_only
      modification: predicate correctness holds only for sampled random decks
      expected_result: STOP because the universal arbitrary-deck theorem does not follow
    - name: marginal_query_probability
      modification: bound each predicate query separately without the adaptive transcript
      expected_result: STOP because the claimed probability concerns the complete adaptive transcript
    - name: target_advice_or_unbounded_words
      modification: allow target-dependent preprocessing or unbounded words
      expected_result: STOP because the cited MPZ resource model no longer applies
    - name: coordinate_or_representation_sensitive_target
      modification: instantiate coordinate P1553, Semaev, non-subset-stable, or representation-sensitive structure
      expected_result: nonapplicable; no conclusion transfers from this generic-interface theorem
    - name: algebraic_edge_cases
      modification: inject signs, identity encodings, duplicate labels, modular collisions, cross-deck encoding collisions, shared-random-oracle equality, replay, and corrupt matches
      expected_result: >-
        Preserve every labelled collision preimage and charge every operation;
        final verification rejects any candidate that does not satisfy [x_hat]P=Q.
  scope_boundary:
    applies_only_to:
      - prime-order dense generic groups
      - the stated five signed mixed-radix decks
      - one exact target-independent cumulative restriction object for exactly three decks
      - two public labelled reconstructible decks joined by exact encodings
      - complete ordinary-bit and interaction accounting within the stated rectangle
    nonapplicable_to:
      - coordinate-aware P1553 or Semaev-polynomial systems
      - non-subset-stable predicates
      - random-deck-only claims
      - irrecoverably hidden labels
      - opaque handles, target advice, extra oracles, representation leakage, or unbounded words
      - the two-restriction three-public-deck remainder
    explicitly_not_claimed:
      - a P1553-specific or coordinate lower bound
      - a generic ECDLP lower bound
      - an algorithm, attack, speedup, or SOTA result
      - B71 admission or any goal, batch, hypothesis, experiment, evidence-strength, or scientific-status transition
      - closure, completion, or breakthrough
  conclusion:
    producer_result: >-
      The three-restriction plus exact labelled two-deck join is a plausible
      correction candidate: under the enumerated assumptions it preserves the
      predecessor resource exponents and MPZ probability exponent. This is a
      proposed conditional proof artifact awaiting independent J1, J2, J3,
      and blind review, not accepted evidence.
    stopping_boundary: >-
      This construction itself stops when a third public deck remains. Nothing
      here establishes a cost lower bound for that remainder.

