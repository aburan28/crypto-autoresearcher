  claim_ceiling:
    allowed: "A proposed conditional generic-interface correction: under the frozen ordinary generic-group and MPZ-accounting assumptions, three exact canonical deck restrictions followed by an explicit public two-deck join would reconstruct every target, contradicting the stated generic transcript success upper bound."
    prohibited:
      - "existence of the exact cumulative existential predicate"
      - "a coordinate-aware or P1553 theorem"
      - "an unconditional generic-ECDLP lower bound"
      - "a new ECDLP algorithm, attack, or speedup"
      - "a state-of-the-art or novelty claim"
      - "a B71 admission or any goal, batch, hypothesis, experiment, or ledger transition"
      - "closure, completion, or breakthrough"
  theorem:
    title: "Three exact mixed-radix deck restrictions reduce the frozen residual to a linear public join"
    status: "proposed_conditional_correction"
    statement: "For every sufficiently large prime N and every dense ordinary generic cyclic group G=<P> of order N, the frozen exact subset-stable cumulative existential interface on F0,F1,F2, if realized inside the stated ordinary-bit and complete-interaction rectangle, yields a deterministic reconstruction of the discrete logarithm of every Q in G. The reconstruction makes exactly 3*log2(2m) canonical restriction calls and then performs an O(m polylog(m))-cost exact labelled dictionary/scan join over public F3 and F4, where m=2^ceil(log2(N^(1/5))). Thus its adaptive fresh-target success is 1, while the relayed MPZ accounting gives at most 3*ell*(k+1)^2/N=B^(-1/4+o(1))=N^(-1/20+o(1)); conditional on that model mapping, both properties cannot hold for sufficiently large N."
    logical_quantifiers:
      order:
        - "There exists N0 such that for every prime N>N0."
        - "For every ordinary generic cyclic group G=<P> of order N."
        - "For every target Q=[x]P, with x the canonical integer in [0,N-1]."
        - "If one target-independent exact cumulative existential object has the frozen semantics and supports canonical cumulative restrictions of exactly F0,F1,F2 within the resource rectangle."
        - "Then the stated deterministic restriction-and-join transform returns x for that Q."
        - "Therefore, for a fresh uniform Q, the complete adaptive transform succeeds with probability 1; comparison with the relayed MPZ upper bound is conditional on the declared ordinary-generic transcript mapping."
      no_quantifier_swap: "The target-independent object is fixed before Q. The universal initial witness is proved for every Q; it is not an average-case or postselected event."
  parameters:
    group: "G=<P>, cyclic of prime order N, exposed only through the frozen ordinary generic interface"
    B: "N^(1/5)"
    m: "2^ceil(log2(B))"
    C: "sum_{i=0}^4 m^i"
    target: "Q=[x]P with canonical x in [0,N-1]"
    shifted_target: "R=Q+[C]P"
    asymptotic_size_facts:
      - "B<=m<2B, so m=B^(1+o(1))."
      - "m^5>=B^5=N."
      - "For all sufficiently large prime N, m<N and 2m<N."
      - "Because N is prime and m<N, gcd(m,N)=1, so every m^j is invertible modulo N."
  signed_labelled_decks:
    definition: "F_i={(i,d,sigma,[sigma(d+1)m^i]P): 0<=d<m and sigma in {-1,+1}} for i=0,...,4"
    occurrence_count_per_deck: "2m"
    occurrence_identity: "The tuple (i,d,sigma) is retained independently of its generic group encoding."
    public_lineage: "F3 and F4 remain full, public, labelled, and reconstructible from target-independent known scalar lineage."
  predicate_contract:
    premise_only: true
    existence_claimed: false
    semantics: "One target-independent exact cumulative existential object answers whether the currently retained Cartesian product of labelled deck occurrences contains a five-occurrence witness summing to R."
    restriction_surface: "Only canonical dyadic cumulative restrictions of F0,F1,F2 are available. F3 and F4 remain unrestricted."
    exactness_invariant: "Before each binary decision, the current retained product contains at least one witness. Querying the canonical left half either preserves a witness when true or proves that the disjoint right half preserves one when false."
    serialization: "All retained state, labels, answers, generic encodings, and replay information is charged as ordinary serialized bits or interactions; no opaque handle or unbounded word is permitted."
  lemmas:
    universal_initial_witness:
      claim: "The initial unrestricted five-deck product contains a labelled witness for every target Q."
      proof:
        - "Fix Q=[x]P and take the canonical integer x in [0,N-1]."
        - "Since m^5>=N>x, x has a five-digit base-m expansion x=sum_{i=0}^4 a_i*m^i with 0<=a_i<m. Leading zero digits are allowed."
        - "For each i choose the actual occurrence e_i=(i,d_i=a_i,sigma_i=+1) in F_i."
        - "Then sum_{i=0}^4 sigma_i(d_i+1)m^i=sum_{i=0}^4 a_i*m^i+sum_{i=0}^4 m^i=x+C as an integer."
        - "Consequently sum_i enc(e_i)=[x+C]P=Q+[C]P=R."
      consequence: "The first restriction call starts from a proved yes-instance for every Q. No target probability, heuristic density, or uncharged initial oracle call is used."
    exact_three_deck_isolation:
      claim: "Exactly 3*log2(2m) canonical cumulative calls isolate one occurrence in each of F0,F1,F2 while preserving a full five-deck witness."
      proof:
        - "Each signed labelled deck has exactly 2m occurrences, and 2m is a power of two."
        - "At each level partition the currently retained occurrences of the active deck into its canonical equal left and right halves."
        - "Query the left-half cumulative restriction once. Retain the left half on true and the right half on false; exactness plus the current yes-invariant proves the retained half still extends to a witness."
        - "After log2(2m) levels one occurrence is retained. Repeat sequentially for F0,F1,F2 without releasing earlier restrictions."
      output: "Labelled occurrences e0,e1,e2 and the residual W=R-enc(e0)-enc(e1)-enc(e2), with at least one pair (e3,e4) in F3 x F4 satisfying enc(e3)+enc(e4)=W."
    public_deck_signed_injectivity:
      threshold: "Choose N0 so that for every prime N>N0, m<N and 2m<N."
      claim: "Within each public deck F_j for j in {3,4}, distinct signed labelled occurrences have distinct generic group encodings."
      same_sign_case:
        derivation: "If [sigma(d+1)m^j]P=[sigma(d'+1)m^j]P, then (d-d')m^j=0 mod N. Since gcd(m,N)=1, d-d'=0 mod N. But |d-d'|<m<N, hence d=d'."
        conclusion: "No distinct same-sign collision exists."
      opposite_sign_case:
        derivation: "If [(d+1)m^j]P=[-(d'+1)m^j]P, then (d+d'+2)m^j=0 mod N. Invertibility gives d+d'+2=0 mod N, but 2<=d+d'+2<=2m<N, which is impossible."
        conclusion: "No opposite-sign collision exists."
      edge_consequence: "The public-deck encodings are nonidentity as well: 1<=d+1<=m<N and m^j is invertible modulo N."
      limitation: "This is within-deck injectivity. Cross-deck encoding coincidences are not excluded and are handled by retaining deck and occurrence labels."
    exact_public_dictionary_join:
      algorithm:
        - "Enumerate all 2m labelled occurrences of F3, compute or replay each public encoding, and build an exact dictionary keyed by that encoding while retaining the complete occurrence tuple and scalar lineage."
        - "Enumerate all 2m labelled occurrences e4 of F4 and look up the exact complement W-enc(e4)."
        - "For every hit, emit the retained labelled pair (e3,e4), decode the five labelled occurrences, and perform final group verification."
      exact_counts:
        dictionary_insertions: "2m"
        scan_iterations: "2m"
        match_output_bound: "At most 2m total matches, because injectivity of F3 gives at most one e3 for each scanned e4."
        total_join_cost: "O(m) expected exact-dictionary operations with the charged shared random oracle, or O(m log m) comparison/sort fallback; either is B^(1+o(1)) ordinary work/interactions."
      correctness: "The isolation invariant supplies at least one residual pair, so the exact scan finds at least one match. Collision lists/backpointers and occurrence data are retained rather than silently deduplicated."
    decoder_and_verifier:
      decoder: "x_hat=(sum_{i=0}^4 sigma_i(d_i+1)m^i-C) mod N"
      correctness: "A matched five-tuple sums to R=Q+[C]P, hence [x_hat]P=Q."
      final_check: "Return x_hat only if an explicit generic group verification confirms [x_hat]P=Q; reject any corrupt, malformed, or false match."
  mechanism:
    non_rename_rationale: "The failed predecessor asserted the same high-level join without proving the target-universal starting witness, signed public-deck injectivity, or the linear match-output bound, and typed its unchecked Pareto frontier as null. This additive successor supplies those missing load-bearing arguments and uses an explicit unknown Pareto status; it does not modify the immutable drafts."
    constructive_transform:
      input: "A target Q and the premise-only frozen exact cumulative existential object."
      steps:
        - "Construct the public shifted target R."
        - "Use the universal base-m witness to establish the initial yes-invariant."
        - "Isolate e0,e1,e2 with exactly 3*log2(2m) cumulative calls."
        - "Form W and solve the remaining public labelled two-deck equation by the exact F3 dictionary/F4 complement scan."
        - "Decode and verify."
      output: "The canonical residue x in Z/NZ for every Q, conditional on the predicate premise and the frozen interface."
  proof_decomposition:
    - id: "L1-universal-initial-witness"
      responsibility: "Prove a witness exists for every target before any call."
      status: "producer_argument_supplied_pending_independent_review"
    - id: "L2-cumulative-isolation"
      responsibility: "Prove the exact call count and preservation of a full witness while isolating F0,F1,F2."
      status: "producer_argument_supplied_pending_independent_review"
    - id: "L3-public-signed-injectivity"
      responsibility: "Prove sufficiently-large-N injectivity of every signed occurrence within F3 and F4."
      status: "producer_argument_supplied_pending_independent_review"
    - id: "L4-linear-public-join"
      responsibility: "Prove exact dictionary/scan counts, at-most-2m output, label retention, and correctness."
      status: "producer_argument_supplied_pending_independent_review"
    - id: "L5-decoder"
      responsibility: "Prove modular decoding and final verification."
      status: "producer_argument_supplied_pending_independent_review"
    - id: "L6-complete-resource-accounting"
      responsibility: "Map the entire adaptive transcript to the frozen MPZ resource variables without omitted handles or interactions."
      status: "producer_accounting_supplied_requires_independent_source_validation"
  resource_ledger:
    ell:
      definition: "All ordinary crossing bits, including the target-independent object, serialized retained state, labels, public scalar lineage, transcript state, dictionary/backpointer data, and any replay material."
      bound: "B^(9/4+o(1))"
    k:
      definition: "One hard aggregate containing every target, restriction, reconstruction, generic group, equality, shared-random-oracle, dictionary, scan, match-output, replay, decode, and final-verification interaction."
      bound: "B^(5/4+o(1))"
    restriction_calls:
      exact: "3*log2(2m)"
      asymptotic: "B^(o(1)), absorbed by k"
    public_join:
      exact_enumeration: "2m F3 insertions plus 2m F4 scans and at most 2m emitted matches"
      asymptotic: "B^(1+o(1)), absorbed by k because 1<5/4"
    no_free_resources:
      - "No opaque handles."
      - "No target advice or target-conditioned preprocessing."
      - "No extra oracle or representation leakage."
      - "No unbounded-word or pointer-sized free storage."
      - "No marginal-call probability accounting."
    mpz_accounting:
      source_status: "Relayed by the Coordinator from prior independent retrieval; not independently opened by this producer and pending the assigned J2 retrieval."
      formula: "Pr[complete adaptive fresh-target success] <= 3*ell*(k+1)^2/N"
      substitution: "3*B^(9/4+o(1))*B^(2*(5/4)+o(1))/B^5"
      exponent_in_B: "9/4+5/2-5=-1/4"
      exponent_in_N: "-1/20"
      resulting_upper_bound: "B^(-1/4+o(1))=N^(-1/20+o(1))"
      comparison: "The constructive transform is target-universal and therefore has fresh-uniform-target success 1. Conditional on the formula and model mapping, this contradicts the upper bound for sufficiently large N."
  assumptions:
    - "N is prime and sufficiently large for m<N and 2m<N."
    - "The generic group is dense, ordinary, and exposes only the frozen interface."
    - "The cumulative existential object is target-independent, exact, and subset-stable for canonical restrictions of exactly F0,F1,F2."
    - "F3 and F4 labels and scalar lineage are public and reconstructible."
    - "All adaptive transcript resources map to ell and k exactly as declared."
    - "The relayed MPZ formula applies to this complete adaptive construction; this requires independent source review."
  controls:
    required_positive:
      - "Direct symbolic check of the base-m witness, including x=0, leading zero digits, and x=N-1."
      - "Independent derivation of the dyadic call count and yes-invariant."
      - "Independent same-sign and opposite-sign injectivity proof with the strict inequalities m<N and 2m<N."
      - "Independent count of dictionary entries, scan iterations, and emitted matches."
      - "Independent decoder derivation and corrupt-output rejection."
    known_false_or_proves_too_much:
      - "The three immutable drafts from TASK-20260825-55000d are a negative control: they omit the universal witness and signed-injectivity/output proof and must not pass."
      - "Remove the F2 restriction: the residual has three public signed labelled decks and the present dictionary argument no longer gives an O(m) join; stop at a 3SUM-like residual and claim no B^2 or 3SUM lower bound."
      - "Make labels irrecoverably hidden: the labelled public join does not apply."
      - "Permit target advice, opaque handles, representation leakage, or unbounded words: the MPZ resource mapping does not apply."
      - "Replace universal constructed decks by random-only decks: the universal base-m witness proof does not transfer."
    exceptional_strata:
      - "Finite small N for which m>=N or 2m>=N remain explicit controls outside the sufficiently-large-N asymptotic statement."
      - "Identity, duplicate, modular, sign, and cross-deck collision cases must be tested by the assigned independent review; none may be silently discarded."
  falsification_criteria:
    - "Exhibit a target x in [0,N-1] lacking the stated five-digit base-m witness."
    - "Show that exact cumulative bisection can return false on the left while no witness exists on the right despite the current yes-invariant."
    - "Exhibit two distinct signed occurrences within F3 or within F4 with equal encoding under m<N and 2m<N."
    - "Exhibit more than 2m exact residual pairs despite F3 injectivity."
    - "Find an omitted interaction or ordinary-bit resource that violates the frozen ell or k bound."
    - "Show from the independently retrieved source that the relayed MPZ formula or its applicability conditions differ materially."
    - "Show that final verification can accept an x_hat with [x_hat]P!=Q."
  scope:
    supported_if_reviewed: "Only the stated conditional obstruction for an exact target-independent three-restricted-deck generic interface inside the frozen resource rectangle."
    unresolved:
      - "Whether any such exact predicate exists in any model."
      - "Coordinate-aware P1553, Semaev-polynomial, and non-subset-stable structures."
      - "Random-deck-only or target-conditioned constructions."
      - "Hidden-label interfaces and representations without public scalar lineage."
      - "Two-restriction interfaces, whose three-public-deck residual is not resolved here."
      - "Any unconditional or end-to-end generic ECDLP lower bound."
  conclusion:
    text: "The missing mathematics in the invalid predecessor can be supplied at the producer level: every target has a canonical initial witness, the two remaining signed public decks are injective for sufficiently large N, and their exact labelled residual join has 2m insertions, 2m scans, and at most 2m outputs. These facts make the three-restriction transform target-universal with only B^(1+o(1)) added work. The contradiction with the relayed MPZ bound remains conditional on independent validation of the source and full interface accounting, so this record is a proposed correction rather than accepted evidence or a state transition."
    decision_authority: "Coordinator only, after the frozen independent review round and archival gates."
  references:
    - id: "EV-ECDLP-4a127c"
      provenance: "internal"
      use: "Immutable predecessor evidence that motivated, but does not validate, the three-deck correction."
