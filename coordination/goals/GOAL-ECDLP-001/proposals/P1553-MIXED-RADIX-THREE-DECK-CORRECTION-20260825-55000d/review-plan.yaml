review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-P1553-MIXED-RADIX-THREE-DECK-55000d
  goal_id: GOAL-ECDLP-001
  batch_id: null
  packet_id: P1553-MIXED-RADIX-THREE-DECK-CORRECTION-20260825-55000d
  recorded_at: "2026-08-25T00:53:00Z"
  coordinator_prior: >-
    The exact dictionary/complement strengthening appears algebraically sound:
    after three exact bisections, W-e_4 can be looked up among the 2m labelled
    F_3 encodings, so construction and scan cost B^(1+o(1)), beneath the
    inherited B^(5/4+o(1)) cap. The most likely breaks are an MPZ mismatch in
    charging encoding-equality dictionaries and handle reconstruction, loss of
    occurrence labels across phases, or collision multiplicity. Even if every
    joint holds, the result remains a narrow generic-interface correction and
    does not transfer to coordinate-aware P1553 or establish a generic-ECDLP
    lower bound.
  claim_under_review: >-
    Whether the reviewed mixed-radix/MPZ contradiction extends exactly to a
    universal arbitrary-deck generic predicate with subset stability in three
    named decks and two full public labelled decks, by isolating three labels,
    building an F_3 encoding dictionary, and scanning F_4 complements within
    the same aggregate cap.
  joints:
    - joint: J1-three-deck-isolation-dictionary-complement-and-labelled-decoding
      assigned_to: TASK-20260825-322d25
      role: reviewer
      attack_plan: >-
        Re-derive the three-deck invariant and exact query count; construct W;
        build the full labelled F_3 dictionary with collision lists; scan every
        F_4 label by W-encoding(e_4); test signs, identity, duplicate encodings,
        modular and cross-deck collisions, multiple matches, corrupted branches,
        decoder arithmetic, and final verification.
      expected_break: >-
        Encoding equality may identify only an anonymous point, collision-list
        multiplicity may hide the correct labelled pair, or a modular match may
        not decode to the verified discrete logarithm.
    - joint: J2-MPZ-binding-and-complete-three-plus-two-resource-accounting
      assigned_to: TASK-20260825-6e2167
      role: validator
      attack_plan: >-
        Independently retrieve the MPZ primary source; verify the exact theorem
        model; charge every phase-crossing bit and every group, dense, equality,
        shared-RO, replay, handle reconstruction, restriction, dictionary,
        collision-list, lookup, scan, decoder, and verification interaction;
        recompute the B and N exponents and complete-transcript quantifier.
      expected_break: >-
        Serializing or reconstructing the labelled dictionary may exceed ell or
        k, or the cited theorem may not cover adaptive equality lookups composed
        with repeated restricted predicates.
    - joint: J3-scope-proves-too-much-and-two-restriction-boundary
      assigned_to: TASK-20260825-e7969e
      role: red-team
      attack_plan: >-
        Run every proves-too-much control, especially removal of the third
        restriction, hidden labels versus labels reconstructible from public
        scalar lineage, coordinate-aware P1553, random-deck-only support,
        target-conditioned advice, unbounded words, opaque handles, and
        non-subset-stable predicates. Require the proof to stop at the remaining
        three-public-deck 3SUM-like problem without asserting a lower bound.
      expected_break: >-
        The proof may covertly assume labelled lineage or universal subset
        stability, or may overstate failure of the same dictionary trick on
        three public decks as a proved B^2 or 3SUM lower bound.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - two-restrictable-deck solver with three public decks and no supplied 3SUM lower bound
      - anonymous public occurrences without reconstructible scalar lineage
      - opaque nonreconstructible public handles
      - random-deck-only solver
      - target-conditioned preprocessing
      - unbounded-bit unit-cost state
      - non-subset-stable predicate
      - coordinate-aware P1553 target-local remainder oracle
    failure_signature: >-
      The argument must stop at the first absent premise and must not manufacture
