review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-P1553-MIXED-RADIX-THREE-DECK-55000d-V2
  supersedes: REVIEW-PLAN-P1553-MIXED-RADIX-THREE-DECK-55000d
  correction: CORR-20260826-6bfdaa
  goal_id: GOAL-ECDLP-001
  batch_id: null
  packet_id: P1553-MIXED-RADIX-THREE-DECK-CORRECTION-20260825-55000d
  recorded_at: "2026-08-26T00:00:00Z"
  coordinator_prior: >-
    The invalid first producer drafts exposed three defects before receipt:
    they omitted the universal base-m initial-witness lemma, did not prove the
    signed F_3/F_4 encoding injectivity needed for an unconditional O(m) join,
    and used dominated_by:null without a full-frontier check.  The additive
    successor must repair all three.  If it does, the three-restriction
    dictionary/complement reduction appears algebraically plausible, but MPZ
    model binding, complete resource accounting, collision and edge strata,
    and every non-transfer boundary remain open for independent review.
  claim_under_review: >-
    Whether a corrected, target-independent universal generic predicate with
    subset stability in exactly F_0,F_1,F_2 yields a verified DLP extractor by
    universal base-m witness construction, three exact bisections, an
    injective labelled F_3 dictionary, and an F_4 complement scan inside the
    stated MPZ bit and interaction rectangle.
  joints:
    - joint: J1-three-deck-initial-witness-isolation-injective-join-and-decoding
      assigned_to: TASK-20260825-322d25
      role: reviewer
      attack_plan: >-
        Re-derive the canonical base-m witness for every Q, the cumulative
        three-deck invariant and exact 3*log2(2m) call count, the sufficiently
        large-N signed injectivity of both public decks, W, the exact
        dictionary/complement join, signs, identity, duplicate and modular
        edge strata, decoder arithmetic, and final verification.  Reproduce
        the invalid predecessor defects as negative controls and attest whether
        the additive successor actually repairs them.
      expected_break: >-
        A zero digit may be mishandled by the d+1 offset, a sign collision may
        survive modulo N, or a representative/collision/output path may not
        yield a verified labelled scalar within the declared cost.
    - joint: J2-MPZ-binding-and-complete-three-plus-two-resource-accounting
      assigned_to: TASK-20260825-6e2167
      role: validator
      attack_plan: >-
        Independently retrieve and hash-bind MPZ; verify its exact probability
        and shared-RO model; charge every crossing bit and every target,
        restriction, reconstruction, encoding, equality, dictionary, lookup,
        replay, decode, and verification interaction; and recompute the B and
        N exponents for the complete transcript.
      expected_break: >-
        The generic dictionary/equality interface or retained lineage may not
        fit MPZ, or a crossing representation, repeated lookup, or adaptive
        transcript cost may have been omitted.
    - joint: J3-scope-proves-too-much-and-two-restriction-boundary
      assigned_to: TASK-20260825-e7969e
      role: red-team
      attack_plan: >-
        Run every proves-too-much control, including removal of the third
        restriction, irrecoverably hidden labels versus public scalar lineage,
        coordinate P1553, random-deck-only support, target advice, opaque
        handles, unbounded words, and non-subset-stable predicates.  Audit the
        full-frontier unknown-axis correction and require the proof to stop at
        the three-public-deck remainder without a B^2 or 3SUM lower bound.
      expected_break: >-
        The proof may assume the labels or subset universality it claims to
        test, silently transfer to coordinates, or turn absence of a third-list
        mechanism into an unsupported lower bound or closure statement.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - invalid TASK-20260825-55000d drafts missing the universal witness and injectivity lemmas
      - two-restrictable-deck solver with three public decks and no supplied 3SUM lower bound
      - anonymous public occurrences without reconstructible scalar lineage
      - opaque nonreconstructible public handles
      - random-deck-only or target-conditioned solver
      - unbounded-bit unit-cost state or non-subset-stable predicate
      - coordinate-aware P1553 target-local remainder oracle
    failure_signature: >-
      The argument must reject the invalid predecessor and stop at the first
      absent premise in every nearby object.  If it derives the same theorem
      there, the successor proof or its scope is invalid.
  blind_rederivation:
    required: true
    quantity: >-
      From the frozen statement alone, derive the universal initial witness,
      exact three-deck isolation, public-deck injectivity and labelled join,
      decoder, complete interaction census, and MPZ exponent.
    assigned_to: TASK-20260825-ea3140
    blind_from:
