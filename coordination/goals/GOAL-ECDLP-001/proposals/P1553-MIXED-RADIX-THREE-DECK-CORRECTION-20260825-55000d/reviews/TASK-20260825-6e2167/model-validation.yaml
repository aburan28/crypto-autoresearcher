  metric_recomputations:
    - metric: mpz_bound_exponent_in_B
      input: "3*B^(9/4+o(1))*(B^(5/4+o(1))+1)^2/B^5"
      arithmetic: "9/4 + 2*(5/4) - 5 = 9/4 + 10/4 - 20/4 = -1/4"
      result: "B^(-1/4+o(1))"
      status: PASS
    - metric: mpz_bound_exponent_in_N
      input: "B=N^(1/5)"
      arithmetic: "(-1/4)*(1/5)=-1/20"
      result: "N^(-1/20+o(1))"
      status: PASS
    - metric: theorem_3_auxiliary_p_range
      input: "p=(ell+log2(N))*k"
      arithmetic: >-
        ell=N^(9/20+o(1)), k=N^(1/4+o(1)), hence
        p=N^(7/10+o(1)) and p/N=N^(-3/10+o(1)).
      result: "p<N for sufficiently large N"
      status: PASS
    - metric: explicit_transform_overhead
      result_ref: accounting.json
      result: >-
        With n=ceil(log2 N), L=log2(2m_radix), and K_pred the complete
        black-box interaction cost internal to the predicate implementation,
        a deliberately conservative reconstruction gives
        K_total <= K_pred + 12*m_radix*n + 10*m_radix + 4*n + 3,
        plus 3L ordinary control dispatches and O(m_radix*n*log m_radix)
        solver-side bit work.  Every explicit added term is B^(1+o(1)).
      status: PASS_CONDITIONAL_ON_K_PRED_PREMISE_AND_J1_OUTPUT_BOUND

  control_checks:
    - control: complete_transcript_not_marginal_calls
      status: PASS
      result: >-
        MPZ bounds the final adaptive game win.  The producer assumes an exact
        predicate and obtains deterministic whole-run success one.  It
        expressly excludes replacing that premise by marginal per-call
        correctness.  If only marginal correctness were available, J2 would
        stop because O(log N) adaptive composition could decay below the MPZ
        upper bound.
    - control: no_extra_oracle
      status: PASS_CONDITIONAL
      result: >-
        The source permits only +, 1, dense, and optionally the one shared ro.
        The dictionary can be implemented deterministically from exact dense
        outputs by sorting and comparison, so no hash-table oracle is needed.
        The existential object must be solver code plus ell-bit advice; treating
        a predicate answer as a free external oracle would invalidate J2.
    - control: opaque_handle_lifecycle
      status: PASS_CONDITIONAL
      result: >-
        The source clears registers between phases.  Public scalar lineage
        permits main-phase reconstruction in O(m_radix*log N) interactions.
        Any unreconstructible preprocessing handle would have to cross as
        ordinary advice bits; a persistent uncharged handle would invalidate
        applicability.
    - control: collision_lists_and_exact_keys
      status: PASS_CONDITIONAL_ON_J1
      result: >-
        Exact dense outputs are injective dictionary keys.  Hash collisions can
        be avoided by the deterministic dense-key sort fallback, while complete
        labels and backpointers use O(m_radix*log N) bits.  The at-most-2m match
        and verification charge depends on the F3 injectivity fact owned by J1;
        J2 does not adjudicate that joint.  If that fact fails, output replay can
        be quadratic and this accounting verdict ceases to hold.
    - control: identity_sign_duplicate_modular_and_cross_deck_strata
      status: PASS_FOR_ACCOUNTING
      result: >-
        The census reconstructs and keys all 4m signed public occurrences and
        retains occurrence labels rather than deduplicating them.  It budgets
        verification of every one of the producer's at-most-2m matches.
        Algebraic exclusion of within-deck identity/sign/modular collisions is
        J1-owned; cross-deck equality does not erase the separate labels.
    - control: source_random_oracle_scope
      status: PASS
      result: >-
        Corollary 3 covers the single shared RO(pi(v)) only.  The validated
        deterministic dense-key fallback ensures the J2 implication does not
        rely on a wider random-oracle interface.

  heuristic_validation_checks: []
  cost_model_checks:
    - check: advice_unit
      status: PASS
      unit: ordinary_bits_crossing_preprocessing_to_main
      limitation: "MPZ does not charge preprocessing time or main solver memory."
    - check: interaction_unit
      status: PASS
      unit: black_box_operations_and_function_queries_in_the_complete_main_phase
      limitation: >-
        Dictionary comparisons, integer decoding, and other standard bit work
        are not MPZ interactions; they were separately bounded and are not a
        source theorem about end-to-end bit complexity.
    - check: advice_absorption
      status: PASS_CONDITIONAL
      result: >-
        Target-independent predicate state is ell_pred by premise.  Full public
        labels, scalar lineage, exact keys, and backpointers require at most
        B^(1+o(1)) additional bits if serialized, or can be rebuilt in main.
        Therefore ell_total=ell_pred+B^(1+o(1)) remains B^(9/4+o(1)).
    - check: interaction_absorption
      status: PASS_CONDITIONAL
      result: >-
        K_pred must include every internal +, 1, dense, and ro interaction used
        to answer all 3L restrictions.  The explicit transform adds only
        B^(1+o(1)); thus K_total remains B^(5/4+o(1)) if K_pred has the frozen
        cap.  The count 3L alone is not a substitute for charging K_pred.

  proof_architecture_checks:
    - check: interface_preservation_for_MPZ_arrow
      status: holds_conditionally
      reason: >-
        The producer states the target-independence, exactness, phase-crossing,
        complete-k, no-extra-oracle, and no-opaque-handle hypotheses needed by
        the source model.  J2 verified the arrow under those hypotheses; it did
        not prove a predicate object satisfying them exists.
    - check: quantifier_fidelity_for_success_probability
      status: holds
      reason: >-
        An object fixed before Q and correct for every Q yields final success
        one over uniform fresh (pi,x).  No per-target or per-query witness is
        smuggled through the advice string.
    - check: cost_bookkeeping
      status: holds_conditionally
      reason: >-
        The explicit transformation overhead is subdominant.  The only
        load-bearing unconstructed quantity is the declared K_pred/ell_pred
        resource premise, which is correctly labelled as a premise rather than
        evidence.

  limitations:
    - >-
      J2 validates a conditional model implication.  No implementation,
      measurement, or source artifact establishes that the exact cumulative
      predicate object exists or achieves ell_pred and K_pred.
    - >-
      The MPZ source bounds advice length and black-box interactions.  It does
      not bound preprocessing work, ordinary bit-operation time, or main-phase
      solver memory because the cited model uses unlimited preprocessing and
      m_MPZ=infinity.
    - >-
      The at-most-2m match/output charge is conditional on the within-F3
      injectivity fact assigned to J1.  J2 neither read a J1 report nor issues a
      J1 verdict.
    - >-
      Applicability stops for target-conditioned preprocessing, a predicate or
      equality oracle outside Definition 12, arbitrary-string or multiple ROs,
      opaque cross-phase handles, coordinates, representation leakage,
      unbounded-word claims, or merely marginal predicate correctness.
    - >-
      The runtime model identifier was supplied by the spawning Coordinator as
      gpt-5.6-sol at max effort, but no direct backend probe was performed;
      model_verified is therefore false.
    - >-
      No knowledge-search MCP tool was exposed in this session.  J2 used the
      permitted primary PDF directly and makes no novelty, prior-art, or SOTA
      claim.

