  source_content_checks:
    - check: section_3_1_interaction_semantics
      status: PASS
      observation: >-
        The AMC black box stores Z_N values in registers.  Every operation in
        Pi and function query in Sigma to which the box responds consumes one
        of the k interactions.  Computation operations store a new register;
        function queries output a value to the solver.
      applicability: >-
        Candidate group additions, insertion of the generator represented by
        1, dense-representation queries, and optional ro queries must all be
        included in one aggregate main-phase k.  Ordinary solver-side bit
        processing is not what MPZ counts as k.
    - check: section_3_2_average_case_game
      status: PASS
      observation: >-
        The average-case extraction game samples the representation parameter
        and extracted value uniformly.  In the dense model these are a uniform
        permutation pi in P_N and a uniform x in Z_N.
      applicability: >-
        The producer's exact transform is quantified over every target and
        every admitted generic representation, so conditional success one is
        stronger than the fresh-uniform average required for the MPZ bound.
    - check: section_5_1_preprocessing_boundary
      status: PASS
      observation: >-
        Preprocessing cannot access x.  At the phase boundary all game
        registers are cleared, x is placed in V1, and the independent phases
        share only an ell-bit advice string z.
      applicability: >-
        The target-independent object may depend on the group representation
        but not on Q.  No generic register index or opaque group handle may
        cross the boundary; it must be serialized as bits or reconstructed in
        the main phase.
    - check: definition_12_exact_model
      status: PASS
      observation: >-
        Definition 12 sets S=Z_N, Pi={+,1}, Sigma={dense,ro}, parameter
        space P_N, and preprocessing/main budgets (k.pre,k.main).  The dense
        query returns pi(v); ro returns RO(pi(v)) for one random oracle
        RO:Z_N->Z_N.
      applicability: >-
        An exact dictionary may use the injective dense outputs as ordinary
        bit-string keys.  If ro is used, it must be this one shared
        group-representation oracle and every query counts in k.  An
        arbitrary-string oracle, Semaev oracle, coordinate oracle, existential
        oracle, or target-conditioned oracle is not supplied by Definition 12.
    - check: theorem_3_exact_bound
      status: PASS
      observation: >-
        For prime N, positive integer k and ell, model
        pG_dense=<Z_N,{+,1},{dense},(infinity,k),infinity,P_N>, and every
        ell-bit-advice solver S, Theorem 3 states final extraction-game success
        at most 3*ell*(k+1)^2/N.
      applicability: >-
        The theorem bounds the final adaptive game win, not the marginal
        correctness of an individual call.  Unlimited preprocessing and
        unlimited source-model registers do not provide free phase-crossing
        state or extra black-box operations.
    - check: corollary_3_shared_random_oracle
      status: PASS
      observation: >-
        Corollary 3 gives the same bound in pG_dense,ro.  Appendix F.6 fixes a
        function h, replaces each ro query by one dense query plus local
        evaluation of h, invokes Theorem 3, and averages over h.
      applicability: >-
        The optional shared oracle does not enlarge the cited success bound,
        but the corollary does not authorize multiple, target-dependent, or
        arbitrary-domain oracles.

  model_mapping:
    source_group: additive_Z_N
    candidate_group: cyclic_G_generated_by_P_of_prime_order_N
    map:
      source_value_1: generator_P
      source_secret_x_in_V1: target_Q_equal_bracket_x_bracket_P
      source_addition: generic_group_addition
      source_dense_of_v: exact_uniform_permutation_encoding_pi_of_v
      source_ro_of_v: optional_single_RO_of_pi_of_v
      source_advice_ell: all_target_independent_group_specific_crossing_bits
      source_main_k: all_main_black_box_operations_and_function_queries
    notation_disambiguation:
      m_radix: "2^ceil(log2(B)); approximately B; used by the mixed-radix decks"
      m_MPZ: "the source model's internal-register cap; it is infinity in Theorem 3 and Corollary 3"
      conclusion: >-
        These two quantities share a glyph but are unrelated.  MPZ supplies no
        main-memory bound here, so the candidate cannot infer one from m_radix.
    phase_mapping:
      preprocessing: >-
        Build only target-independent representation-dependent state.  The
        phase may use unlimited black-box interactions in the cited theorem,
        but only an ell-bit string reaches main.
      main: >-
        Receive Q as V1, reconstruct public scalar lineage and any required
        handles, run the exact adaptive restriction implementation, build the
        F3 dictionary, scan F4 complements, decode, verify, and submit x_hat.
      crossing_rule: >-
        Preprocessing register handles do not survive.  Precomputed dense keys,
        labels, backpointers, RO-derived data, or replay state must either be
        represented in the ell-bit advice or rebuilt with charged main calls.

