  verdict_scope: >-
    J2 holds for the producer's deliberately conditional implication.  The
    independently retrieved MPZ source states the cited complete-game success
    bound in the preprocessing dense generic-group model, and the explicit
    three-restriction plus public two-deck transform adds only
    B^(1+o(1)) interactions and ordinary-bit state.  Therefore it preserves
    the frozen ell=B^(9/4+o(1)), k=B^(5/4+o(1)) rectangle if, and only if, the
    premise object itself is compiled into one MPZ solver whose complete
    crossing state and all internal black-box interactions obey those caps.
    This verdict does not validate existence or efficiency of that premise
    object, does not adjudicate J1 or J3, and is not a verdict on the complete
    claim.

