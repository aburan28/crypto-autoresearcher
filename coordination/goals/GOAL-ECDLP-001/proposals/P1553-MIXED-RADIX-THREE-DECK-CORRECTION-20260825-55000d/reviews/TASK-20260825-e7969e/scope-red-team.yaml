  objections:
    - id: J3-O1
      classification: boundary_qualification_and_successor_route
      status: open_nonbreaking_objection
      finding: >-
        The phrase three-public-deck 3SUM-like remainder is safe only as a
        description of arity.  These public decks are not arbitrary 3SUM
        lists.  After factoring m^2, every fixed sign vector gives the scalar
        set s2*[1,m] + m*s3*[1,m] + m^2*s4*[1,m], a contiguous interval of
        exactly m^3 integers.  The union has at most eight such intervals.
      derivation: >-
        The lowest signed digit fills an interval of m consecutive integers;
        successive middle digits shift that interval by exactly m and tile an
        interval of m^2 integers; successive highest digits shift by exactly
        m^2 and tile an interval of m^3 integers.  Equivalently the width is
        (m-1)*(1+m+m^2)+1=m^3.  For sufficiently large N, m^3<N, so each
        interval remains injective modulo N after multiplication by m^2.
      constructive_reading: >-
        Given the residual W, scalar multiplication by m^(-2) mod N reduces
        each sign case to interval discrete logarithm of length m^3.  An
        explicit baby-step/giant-step split with S stored consecutive steps
        uses O(S+m^3/S) group interactions and O(S) encodings; S=m^(3/2)
        gives an O(m^(3/2)) upper bound.  This is a successor route, not a
        lower bound and not evidence of an ECDLP attack.
      current_rectangle_effect: >-
        Under the packet's own rule charging dictionary/table construction in
        the same hard aggregate k=m^(5/4+o(1)), the standard interval split
        does not fit: min_S(S+m^3/S)=Theta(m^(3/2)).  If a model instead moved
        target-independent construction outside k, S>=m^(7/4) would make the
        online scan at most m^(5/4) while fitting the stated bit allowance;
        that accounting question belongs to J2 and is not decided here.
      effect_on_joint: >-
        No break.  The producer expressly stops, asserts no B^2 or 3SUM lower
        bound, types the frontier unknown, and leaves the route open.  The
        Coordinator must not turn the descriptive 3SUM-like label into a
        hardness, closure, or Pareto conclusion.
