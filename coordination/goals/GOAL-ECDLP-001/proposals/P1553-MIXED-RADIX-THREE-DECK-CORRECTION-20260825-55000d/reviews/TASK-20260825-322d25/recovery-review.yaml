  independent_rederivation:
    universal_initial_witness:
      verdict: "holds"
      derivation:
        - >-
          Let x be the canonical integer in [0,N-1].  Since
          m^5 >= N > x, repeated Euclidean division gives exactly five
          base-m digits a_i in [0,m-1] with x=sum_i a_i*m^i; leading zero
          digits are legal.
        - >-
          Select the actual occurrence (i,d_i=a_i,sigma_i=+1) in every
          F_i.  Its scalar contribution is (a_i+1)m^i, so the integer sum is
          x+C and the encoded sum is [x+C]P=Q+[C]P=R.
        - >-
          For x=0 all five digits are zero and d_i=0, so the d+1 offset
          contributes exactly C rather than losing the zero target.  For
          x=N-1 the same inequality x<m^5 guarantees legal boundary digits.
      algorithm_does_not_need_x: >-
        The unknown digits are used only as an existence certificate for the
        first yes-invariant; the reconstruction algorithm never receives them.

    exact_three_deck_isolation:
      verdict: "holds"
      derivation:
        - "m is a power of two, so every signed deck has power-of-two size 2m."
        - >-
          At a current yes-instance, the active occurrence set is the disjoint
          union of its canonical left and right halves.  A true left query
          preserves a witness; a false left query plus exactness and the prior
          yes-invariant forces at least one witness into the right half.
        - >-
          Retaining earlier deck restrictions while repeating this bisection
          isolates one occurrence after log2(2m) calls per deck.  Exactly three
          decks therefore cost 3*log2(2m) calls, with no initial predicate call.
      residual: >-
        The final yes-invariant supplies e0,e1,e2 and at least one public pair
        (e3,e4) satisfying enc(e3)+enc(e4)=W.

    public_deck_signed_injectivity:
      verdict: "holds"
      explicit_safe_threshold: >-
        N0=5 suffices for prime N>N0.  Since m<2*N^(1/5), prime N>=7 gives
        2m<4*N^(1/5)<N, hence m<N; primality then makes m^j invertible modulo N.
      same_sign_case: >-
        Equality inside F_j gives (d-d')m^j=0 mod N.  Cancelling m^j and using
        |d-d'|<m<N yields d=d'.
      opposite_sign_case: >-
        Equality of +(d+1)m^j and -(d'+1)m^j gives d+d'+2=0 mod N after
        cancellation, impossible because 2<=d+d'+2<=2m<N.
      identity_case: >-
        An identity occurrence would give d+1=0 mod N after cancellation,
        impossible for 1<=d+1<=m<N.
      scope: "within each of F3 and F4; cross-deck equality is allowed"

    exact_public_join:
      verdict: "holds"
      dictionary_insertions: "2m"
      complement_scan_iterations: "2m"
      exact_match_output_bound: "at most 2m"
      reason: >-
        For each of the 2m labelled F4 occurrences, the complement key can
        equal at most one F3 occurrence because F3 is injective.  The residual
        witness guarantees at least one hit.  Exact equality, full occurrence
        tuples, and scalar lineage prevent a hash bucket or encoding equality
        from silently becoming an unlabeled candidate.
      cross_deck_collision_control: >-
        Cross-deck coincidences genuinely occur: the positive F3 occurrence
        d=m-1 has scalar m*m^3=m^4, equal to the positive F4 occurrence d=0;
        the negative pair also coincides.  Deck and occurrence labels keep
        these distinct, and the join remains correct.
      collision_list_boundary: >-
        Under 2m<N every exact F3 key has one occurrence.  Retaining lists is
        still the correct representation; without injectivity a list may be
        linear and the emitted-pair count may be quadratic.

    decoder_and_final_verification:
      verdict: "holds"
      derivation: >-
        For any exact match let S=sum_i sigma_i(d_i+1)m^i.  The match gives
        [S]P=R=[x+C]P, so S-C=x mod N.  Therefore
        x_hat=(S-C) mod N is the canonical discrete logarithm x.  Multiple
        valid labelled tuples decode to the same residue.  A malformed or
        false match has no authority to return until the explicit check
        [x_hat]P=Q succeeds.

