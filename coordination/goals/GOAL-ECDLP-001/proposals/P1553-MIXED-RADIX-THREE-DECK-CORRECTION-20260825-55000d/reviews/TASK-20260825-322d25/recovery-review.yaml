    algebraic_model: "scalar residues modulo prime N"
    positive_target_count: 180
    positive_scope:
      - "all x for N=7,31,37,101"
      - "x=0,1,floor(N/2),N-1 for N=1031"
    positive_result: >-
      Every checked target had the base-m witness, retained a witness through
      the exact call count, produced at least one and at most 2m public matches,
      decoded every exact match to x, and rejected deliberately stale or false
      paths at final verification.
    exceptional_result: >-
      N=2 exposes identity and same/opposite-sign collisions.  N=3,m=2 has
      opposite-sign collision lists of length two and a residual with eight
      labelled pairs, exceeding 2m=4.  N=5,m=2 satisfies 2m<N and restores
      singleton keys and the 2m output bound.  These are boundary controls,
      not evidence outside the theorem's asymptotic scope.

