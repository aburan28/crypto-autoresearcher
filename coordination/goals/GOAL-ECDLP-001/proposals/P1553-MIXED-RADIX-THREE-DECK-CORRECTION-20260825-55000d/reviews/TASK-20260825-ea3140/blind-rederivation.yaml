    claim_ceiling: >-
      This artifact reports only agreement or disagreement on the frozen
      reduction and exponent. It is not a P1553, coordinate-model, generic-DLP,
      SOTA, admission, closure, completion, attack, speedup, or breakthrough
      verdict.

  notation:
    canonical_scalar_representative: "x_bar in {0,...,N-1} with Q=[x_bar]P"
    digit_radix: "m=2^ceil(log2(B)), so m is a power of two and m^5 >= N"
    occurrence_scalar: "s(i,d,sigma)=sigma*(d+1)*m^i"
    occurrence_handle: "g(i,d,sigma)=[s(i,d,sigma)]P"
    exact_predicate: >-
      E(S0,S1,S2;R)=1 exactly when there are labelled occurrences
      z_i in S_i for i=0,1,2 and z_i in F_i for i=3,4 whose five
      group handles sum to R. The derivation uses only this natural exact
      one-occurrence-per-deck reading of the frozen existence predicate.

  derivation:
    universal_initial_witness:
      result: derived
      steps:
        - >-
          Because 0 <= x_bar < N <= m^5, x_bar has a unique five-place
          base-m expansion x_bar=sum_{i=0}^4 a_i*m^i with 0<=a_i<m.
        - >-
          Put d_i=a_i and sigma_i=+1. Each labelled occurrence
          (i,d_i,+1,[((d_i+1)*m^i)]P) is in F_i.
        - >-
          Since C=sum_{i=0}^4 m^i, the sum of those five handles is
          [x_bar+C]P=Q+[C]P=R, including when x_bar+C is at least N because
          group equality is modulo N.
      consequence: >-
        The unrestricted exact predicate starts true for every target Q; no
        initial predicate call or probabilistic existence premise is needed.

    three_deck_bisection:
      result: derived
      labels_per_restrictable_deck: "2m"
      queries_per_deck: "log2(2m)=1+log2(m)=1+ceil(log2(B))"
      exact_total_queries: "3*log2(2m)"
      invariant: >-
        Before every split, at least one full five-deck labelled witness uses
        an occurrence in each current restricted set S0,S1,S2.
      induction:
        - >-
          Split the current labelled set Sj into its two canonical equal
          dyadic halves L and H. Query the exact predicate with L substituted.
        - >-
          If the answer is true, keep L. If false, no current witness uses L;
          the pre-split invariant and the one-occurrence-per-deck relation
          therefore imply that some current witness uses H, so keep H without
          making a second query.
        - >-
          After log2(2m) such splits Sj is one labelled occurrence. Apply the
          same induction successively to decks 0, 1, and 2.
      collision_safety: >-
        The partition is over labelled occurrences, not deduplicated group
        handles. Equal handles, opposite signs, identity handles, or modular
        collisions therefore do not invalidate the invariant when the
        interface is exact and subset-stable.

    public_deck_injectivity:
      asymptotic_domain: "prime N >= 7"
      deck_local_result: derived
      proof: >-
        The radix bound m<2*N^(1/5) implies 2m<N for prime N>=7. Also m is a
        power of two and hence invertible modulo the odd prime N. For fixed
        i in {3,4}, equality sigma*a*m^i=tau*b*m^i modulo N, with
        1<=a,b<=m, reduces to sigma*a=tau*b modulo N. Equal signs force a=b;
        opposite signs would force 0<a+b<=2m<N to be 0 modulo N, impossible.
        Thus each F_3 and each F_4 has exactly 2m distinct nonidentity handles.
      public_union_result: refuted
      explicit_cross_deck_collision:
        first_label: "(3,m-1,+1)"
        second_label: "(4,0,+1)"
        equality: "m*m^3 = 1*m^4"
        negative_collision_also_present: true
      required_interpretation: >-
        No handle-to-label injectivity may be assumed across F_3 union F_4.
        Deck identity and scalar lineage must remain attached to every entry.
        The join needs only deck-local F_3 injectivity for its asymptotic
        candidate bound, and it remains logically correct with collision lists.

    labelled_dictionary_complement_join:
      result: derived
      residual: "H=R-g(z0)-g(z1)-g(z2)"
      dictionary: >-
        Enumerate every labelled z3 in F_3 and store it in the exact-key list
        D[g(z3)]. Never replace a list by one representative. A hash, if used
        for addressing, is followed by comparison of the full group handle.
      scan: >-
        Enumerate every labelled z4 in F_4, compute c=H-g(z4), and visit every
        label in D[c]. Emit the labelled pair (z3,z4), retaining both deck ids,
        digits, signs, and scalar lineages.
      completeness: >-
        The post-bisection invariant supplies z3_star,z4_star with
        g(z3_star)+g(z4_star)=H. The dictionary contains z3_star, and the scan
        of z4_star computes exactly g(z3_star), so that pair is emitted.
      soundness: >-
        Exact-key equality for any emitted pair gives
        g(z0)+g(z1)+g(z2)+g(z3)+g(z4)=R.
      candidate_bound: >-
        For N>=7, deck-local injectivity of F_3 makes every exact dictionary
        list a singleton. Thus at most one candidate is visited per F_4 label,
        for at most 2m emitted candidates, despite possible pair-sum and
        cross-deck collisions.

    labelled_decoder_and_verification:
      result: derived
      formula: >-
        y = (sum_{i=0}^4 sigma_i*(d_i+1)*m^i - C) mod N,
        reduced to the canonical representative in {0,...,N-1}.
      correctness: >-
        An emitted exact match says R=[sum_i sigma_i*(d_i+1)*m^i]P. Since
        R=Q+[C]P, subtraction gives Q=[y]P. Because P generates the order-N
        group, y is the unique discrete logarithm x_bar modulo N.
      final_verification: "Compute [y]P and accept only if it equals Q exactly."
      edge_cases:
        signs: "The sign is part of the label and enters the integer formula."
        identity: >-
          A labelled identity occurrence, if present in a finite exceptional
          instance, still has a known scalar modulo N; zero contribution does
          not erase its label. No public-deck identity occurs for N>=7.
        duplicates: >-
          Exact collision lists retain every label; decoding never attempts to
          invert an anonymous handle back to a unique scalar.
        modular_collisions: >-
          Different scalar lineages may yield the same handle, but any emitted
          group equality makes the decoded values congruent to x_bar modulo N.
        cross_deck_collisions: >-
          The explicit radix-boundary collision is harmless because the F_3
          dictionary entry and F_4 scan label retain different deck ids.
        hash_collisions: >-
          Full-handle comparison rejects accidental dictionary-address
          collisions before decoding.

  resource_accounting:
    asymptotic_domain: "N tends to infinity through odd primes"
    advice:
      target_independent_object_bits: "ell <= B^(9/4+o(1)) ordinary bits"
      public_parameters_and_label_metadata: "O(m*log(N))=B^(1+o(1)) bits at most"
      total_phase_crossing_bits: "B^(9/4+o(1))"
      target_conditioned_phase_crossing_state: none
    main_interactions:
      exact_predicate_queries: "3*log2(2m)"
      exact_predicate_replay: "at most 3*log2(2m)"
      target_and_residual_construction: "O(log(N)) generic-group interactions"
      selected_F0_F2_handle_reconstruction: "O(log(N)) generic-group interactions"
      public_F3_F4_handle_reconstruction: >-
        At most 4m independent known-scalar reconstructions, each O(log(N))
        generic-group interactions; total O(m*log(N)).
      F3_dictionary_construction: >-
        2m insertions. A deterministic exact-key sorted map costs
        O(m*log(m)) full-handle comparisons.
      collision_list_retention: "2m label insertions and O(m*log(N)) bits"
      F4_complements: "2m generic-group subtractions"
      F4_complement_lookups: "2m exact lookups, O(m*log(m)) comparisons total"
      shared_random_oracle: >-
        Zero additional calls in the deterministic exact-key construction.
        If a shared-RO address table is substituted, charge exactly 2m insert
        addresses plus 2m lookup addresses and retain exact-key checks; 4m is
        still B^(1+o(1)).
      candidate_reconstruction_and_decode: >-
        At most 2m candidates for N>=7, each using O(log(N)) ordinary-bit
        arithmetic under the conservative decode-all accounting.
      verification: >-
        At most 2m known-scalar multiplications under verify-all accounting;
        stopping at the first exact emitted pair needs one. Either bound is
        O(m*log(N)).
      wrapper_total: "O(m*polylog(N))=B^(1+o(1))"
      supplied_aggregate_cap: "k <= B^(5/4+o(1))"
      cap_check: >-
        Since m<2B, every explicitly inventoried wrapper term is
        B^(1+o(1)), strictly inside B^(5/4+o(1)). The supplied aggregate cap
        therefore covers the wrapper and any already-budgeted predicate
        interactions; no dictionary, lookup, replay, decode, or verification
        operation is omitted.
    finite_instances: >-
      The local-injectivity proof is stated for N>=7, which is sufficient for
      the asymptotic exponent. The finitely many smaller prime orders do not
      establish or refute an asymptotic transfer and must be handled as finite
      exceptions if they matter operationally.

  supplied_theorem_substitution:
    theorem_as_frozen: "success <= 3*ell*(k+1)^2/N"
    B_exponent_arithmetic:
      advice_exponent: "9/4"
      doubled_main_exponent: "2*(5/4)=10/4"
      numerator_exponent: "19/4"
      denominator_exponent: "5=20/4"
      resulting_bound: "success <= 3*B^(-1/4+o(1))"
    N_exponent_arithmetic:
      substitution: "B=N^(1/5)"
      resulting_bound: "success <= 3*N^(-1/20+o(1))"
    extractor_success_from_frozen_exactness: >-
      The positive digit witness exists for every canonical x_bar, exact
      bisection preserves a witness, the complete labelled join finds one, and
      final verification accepts its unique decoded logarithm. Thus the frozen
      exact interfaces imply complete-transcript extractor success one.
    scoped_incompatibility: >-
      For sufficiently large N, success one is incompatible with the supplied
      complete-transcript theorem bound tending to zero. This is only the
      reduction-and-exponent consequence of the frozen assumptions; the
      theorem itself was supplied rather than independently reviewed here.

  controls_and_nontransfers:
    - control: two_restrictable_decks
      outcome: reduction_stops
      reason: >-
        After isolating only F_0 and F_1, the residual asks for one occurrence
        from each of F_2,F_3,F_4. The direct two-list dictionary/complement
        join no longer applies. Enumerating a pair dictionary uses up to
        (2m)^2=4m^2 entries, outside B^(5/4+o(1)). This is a method boundary,
        not a 3SUM or other lower bound.
    - control: anonymous_public_occurrences
      outcome: decoder_breaks
      reason: >-
        Handle equality does not identify a unique deck, sign, digit, or
        scalar lineage, as the explicit F_3/F_4 boundary collision shows.
    - control: target_conditioned_advice
      outcome: theorem_transfer_invalid
      reason: "The frozen theorem substitution requires target-independent phase-crossing advice."
    - control: opaque_nonreconstructible_public_handles
      outcome: join_breaks
      reason: "The exact F_3 table and F_4 complements cannot be constructed from scalar lineage."
    - control: random_only_or_non_subset_stable_interface
      outcome: bisection_breaks
      reason: "The false-half implication requires exact answers on every adaptive canonical labelled half."
    - control: marginal_per_query_success
      outcome: theorem_transfer_invalid
      reason: >-
        The adaptive extraction conclusion requires the stated bound on the
        complete transcript with aggregate k, not unrelated marginal bounds.
    - control: coordinate_or_field_arithmetic_oracle
      outcome: out_of_model
      reason: "Such an interface is not the frozen prime-order generic-group interface."
    - control: unbounded_bit_unit_cost_state
      outcome: resource_accounting_invalid
      reason: "It defeats the ordinary-bit advice and explicit interaction accounting."

  exact_nonapplicability_boundary:
    removed_restriction: F_2
    remaining_equation: "g(z2)+g(z3)+g(z4)=H with z_i in F_i"
    direct_pair_table_size: "up to 4m^2=B^(2+o(1)) entries"
    statement: >-
      The derivation stops here. It does not show that every algorithm for the
      three-public-deck remainder needs quadratic work, and it asserts no
      3SUM, generic-DLP, P1553, coordinate, or field-arithmetic lower bound.

  result_summary:
    universal_witness: agrees_with_frozen_reduction
    three_deck_bisection: agrees_with_frozen_reduction
    exact_query_count: "3*log2(2m)"
    F3_deck_local_injectivity: derived_for_N_at_least_7
    F3_F4_union_injectivity: refuted_by_explicit_boundary_collision
    labelled_join_and_decoder: agrees_with_frozen_reduction
    B_success_exponent: "-1/4+o(1)"
    N_success_exponent: "-1/20+o(1)"
    procedure_deviations: []
    limitations:
      - The supplied theorem bound is treated as a frozen premise and was not independently sourced or proved.
      - The exact existence predicate is used in its one-labelled-occurrence-per-deck sense stated under notation.
      - No conclusion is drawn for the three-public-deck remainder after removing the F_2 restriction.
