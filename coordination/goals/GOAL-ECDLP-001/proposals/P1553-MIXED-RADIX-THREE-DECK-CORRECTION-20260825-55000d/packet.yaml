    maximum_batches: 128
    unused_slots: 58
    b71_admitted: false
    changed_by_packet: false
  claim_ceiling: >-
    At most an independently reviewed additive generic-interface theorem
    correction for exactly three subset-stable mixed-radix decks and two public
    labelled decks joined by an exact dictionary/complement scan. It is not a
    P1553-specific or coordinate-aware lower bound, not a generic ECDLP lower
    bound, not B71, not SOTA movement, not an algorithm, attack, speedup,
