  control_plane_parent_commit: 210767ac81993d726749126e96448e265df16de3
  objective: >-
    Independently verify or falsify the exact strengthening of the reviewed
    mixed-radix reduction from four restrictable decks plus one public scan to
    three restrictable decks plus a labelled dictionary/complement join over
    two public decks, without changing P1553, B70, B71, or any scientific status.
  correction_target:
    evidence: EV-ECDLP-4a127c
    decision: DEC-20260825-88ea84
    issue: >-
      The four-plus-one review's J3 control found that the claimed stopping
      boundary at three restrictable decks was not established: after isolating
      three decks, a dictionary of labelled F_3 encodings and a complement scan
      of labelled F_4 may recover the final pair in B^(1+o(1)) interactions.
    immutable_history: true
    repair_mode: additive_evidence_and_decision_only
  proposed_theorem:
    group: prime_order_dense_generic_group_G_equal_angle_P_angle_of_order_N
    scale: B_equals_N_to_the_one_fifth
    radix: m_equals_2_to_the_ceiling_log2_B
    offset: C_equals_sum_i_0_to_4_m_to_i
    decks: >-
      For i=0,...,4, F_i contains independently occurrence-labelled signed
      elements (i,d,sigma,[sigma(d+1)m^i]P), 0<=d<m and sigma in {+1,-1}.
    target: R_equals_Q_plus_bracket_C_bracket_P
    restricted_interface: >-
      One target-independent object answers the exact existential predicate for
      every canonical dyadic restriction of F_0,F_1,F_2 while F_3 and F_4
      remain public, full, occurrence-labelled, and reconstructible.
    recovery: >-
      Isolate labels in F_0,F_1,F_2 using exactly 3 log2(2m) predicate calls.
      Compute W=R-e_0-e_1-e_2; retain or build a dictionary containing every
      labelled F_3 encoding and its full collision list; scan every labelled
      F_4 occurrence and look up W-encoding(e_4). Any dictionary match supplies
      a labelled pair (e_3,e_4), after which decode
      x_hat=(sum_i sigma_i(d_i+1)m^i-C) mod N and finally verify [x_hat]P=Q.
    proposed_conclusion: >-
      Under the exact MPZ model, complete ordinary-bit advice serialization,
      target-independent preprocessing, one hard aggregate cap on every main
      interaction, and nonvanishing success for the complete adaptive transcript,
      no universal arbitrary-deck generic solver with three-deck subset stability
      can simultaneously use at most B^(9/4+o(1)) crossing state and
      B^(5/4+o(1)) total online/replay interactions, if every model and accounting
      premise survives independent review.
  resource_accounting:
    advice_bits: ell_equals_B_to_9_over_4_plus_o_1
    restriction_calls: 3_times_log2_2m
    public_dictionary_and_complement_scan: B_to_1_plus_o_1
    total_main_interactions: k_equals_B_to_5_over_4_plus_o_1
    mpz_success: B_to_minus_1_over_4_plus_o_1_equals_N_to_minus_1_over_20_plus_o_1
  mandatory_assumptions:
    - universal arbitrary public signed occurrence-labelled decks of the declared size
    - exact canonical dyadic subset stability in the same three named decks
    - both public decks remain full, labelled, and reconstructible from target-independent known scalar lineage
    - dictionary keys are exact generic encodings and every collision retains all occurrence labels
    - complete transcript success, not marginal per-query success
    - all phase-crossing data charged by serialized bit length
    - all target construction, restrictions, handle reconstruction, dictionary creation, lookups, scans, decoding, and verification included in one hard MPZ main-interaction cap
    - no persistent opaque handles, target-conditioned advice, extra oracle, representation leakage, or unbounded words outside the cited MPZ model
  controls:
    - remove restriction support from F_2 and require the proof to stop at a three-public-deck 3SUM-like remainder without asserting a B^2 lower bound
    - hide public occurrence labels and distinguish irrecoverable anonymity from labels reconstructible through public scalar lineage
    - make public-deck handles opaque and nonreconstructible after preprocessing and require accounting to stop
    - replace universal arbitrary decks by random-deck-only support and require the universal reduction to stop
    - replace complete-transcript success by independent marginal correctness and require the reduction to stop
    - allow target-conditioned advice or unbounded words and require MPZ applicability to stop
    - apply the proof to a coordinate-aware P1553 remainder, non-subset-stable predicate, or Semaev oracle and require nonapplicability
    - include signs, identity, duplicate encodings, modular and cross-deck collisions, shared random-oracle use, replay, dictionary collision lists, and final verification
    - corrupt one restriction answer or dictionary match and require final verification to reject
  scientific_custody:
    current_batch_id: BATCH-4e7dcf
    primary_dispatch_queue: coordination/goals/GOAL-ECDLP-001/batches/BATCH-4e7dcf/dispatch_queue.json
