  - id: H-ENDO-001
    status: 'approved, no evidential standing (toy-tier cap only)'
    overlap_disposition: >-
      NOT reused as a primary lens. H-ENDO-001's object is the r-endomorphism
      augmented witness LATTICE W_r of a SINGLE curve's own endomorphism ring,
      searched by a balanced meet-in-the-middle over 2r coordinates; its own
      rigorous P1 (index of W_r in Z^{2r} equals N exactly, for a unit
