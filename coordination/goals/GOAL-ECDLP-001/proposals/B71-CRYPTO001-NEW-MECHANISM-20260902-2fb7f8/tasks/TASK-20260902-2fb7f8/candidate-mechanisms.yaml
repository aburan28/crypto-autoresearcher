      minimal test are zero-to-low compute), so it is a low-cost way to
      retire one plausible-looking but ultimately dominated lane before any
      more expensive speculative candidate is dispatched against it.
    discriminated_from:
      - 'H-CREP-001: different object entirely (resultant/Semaev decks vs. Poincare-factor embedding); no resultant, Semaev polynomial, or deck-based meet-in-the-middle appears anywhere in CAND-1.'
      - 'H-STR-002: different object (GLV endomorphism orbit on ONE curve''s factor base vs. a SECOND curve/abelian-variety glued to the target); CAND-1 uses no endomorphism of E and no factor-base structuring.'
      - 'H-IC-001 / H-SUBRES-001: different object (Groebner/subresultant-measured Semaev decomposition vs. genus-g Jacobian embedding); no relation to either.'
      - 'H-ENDO-001: different object (endomorphism-augmented coordinate lattice of ONE curve vs. a glued higher-dimensional abelian variety); see overlap_disposition above for the explicit check.'
