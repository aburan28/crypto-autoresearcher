    sota_delta: >-
      Zero on every attack axis against plain prime-field ECDLP -- no
      speedup is claimed or found. The candidate's own contribution is a
      NEGATIVE exponent-level delta for the examined attack family: the best
      case of that family (g = 2) costs Otilde(N^{1}), a full exponent
      WORSE than rho's Otilde(N^{1/2}), and the gap only widens as g grows.
    recommended_priority: medium
    priority_rationale: >-
      Not ranked "high" because it is a closure, not a path toward beating
      rho; ranked above "low" because it (a) forecloses, with a clean,
      unconditional, cheaply-checkable argument, an entire externally
      motivated attack family this program had not yet examined
      (higher-genus embedding transfer), consistent with the search
