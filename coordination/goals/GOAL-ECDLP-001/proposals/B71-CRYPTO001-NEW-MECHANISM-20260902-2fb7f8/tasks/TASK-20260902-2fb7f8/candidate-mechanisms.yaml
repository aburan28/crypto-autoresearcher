        verified_by: 'this session, direct Read of goal.yaml lines 5453-5490 and H-IT-001-adjacent notes.'
      - ref: 'ledger/proposals/IDEA-20260901-eb468f.yaml (GOAL-ECTD-001 lane)'
        provenance: internal
        claim: >-
          A SIBLING, unrelated-question use of Kani''s construction and
          Galbraith 2024/2025 (eprint 2024/924, 2025/1243) to bound the COST
          of navigating an isogeny volcano for trapdoor path-hiding analysis
          (RQ-ECTD-001), explicitly disclaiming any ECDLP exponent claim.
          Cited to demonstrate CAND-1 is discriminated from this large,
          active, adjacent body of work, not a re-reading of it.
        verified_by: 'this session, full Read of the record on 2026-09-02.'
    assumptions:
      - 'E is ordinary (not supersingular); RQ-CRYPTO-001''s scope (standardized short-Weierstrass prime-field curves) is ordinary throughout.'
      - 'The embedding is realised as an honest F_p-isogeny (equivalently, E and A both appear with their FULL multiplicity in the Poincare decomposition of Jac(C) over F_p), not merely over F_p-bar; a construction whose gluing kernel is only defined over an extension would need a separate, additional cost/transfer argument not made here.'
      - 'The cited Gaudry / Gaudry-Thome-Theriault-Diem complexity figures are read correctly from the retrieved abstract/snippet; Stage-0-style verification against the full paper is named as an outstanding step in the minimal test, not assumed complete.'
    proof_search_map: 'See proof-search-map.yaml (this task directory) for the full four-audit map. Summary: baseline reproduction PASSES (reproduces Gaudry 2000''s own g=2 no-gain result and the published g>=3 Diem/Thistery figures exactly as a special case); observation collision is the point of the closure (two embeddings with the same (N, g) always cost the same, by construction); quantifier order is FOR ALL g >= 2, FOR ALL F_p-isogeny embeddings, FOR the STATED published algorithm family; method ceiling is bounded to that family and does not certify a general impossibility (named open direction below).'
    predictions:
      - metric: 'toy-scale point-count identity #Jac(C)(F_p) vs #E1(F_p) * #E2(F_p) for an explicit genus-2 Kani-Rosen gluing of two toy curves E1, E2/F_p'
        direction: different
        minimum_effect: 'EXACT equality (zero discrepancy) at every tested toy instance; a discrepancy of any size falsifies step (1) of the mechanism as stated and is the lead outcome (see falsification_conditions F1).'
      - metric: 'literature-accuracy check of the Gaudry-Thome-Theriault-Diem Otilde(q^{2-2/g}) figure against the full paper (not the search snippet used in this session)'
        direction: different
        minimum_effect: 'exact match of the exponent formula and its stated conditions (field size q, genus g, double-large-prime variant); any deviation (e.g. an additional condition excluding the case used here) requires CAND-1''s cost bookkeeping in mechanism step (5) to be re-derived before the closure is treated as settled.'
    minimal_test:
      design: >-
        STAGE 0 (reading, zero compute, hard gate): open the full text of
        Gaudry-Thome-Theriault-Diem (eprint 2004/153) and Gaudry (2000) and
        record verbatim the exact theorem statement and its conditions,
        confirming or correcting the Otilde(q^{2-2/g}) figure this session
        used from a WebSearch snippet only.
        STAGE 1 (toy, zero-to-low compute): construct one explicit
        Kani-Rosen-style genus-2 gluing of two small toy elliptic curves
        E1, E2/F_p (or, as a cheaper frozen-fixture substitute, verify the
        identity on the degenerate case C = E1 x E2 with the product
        principal polarisation, which already exercises the Tate-isogeny-
        theorem step without requiring an explicit non-split gluing) and
        directly point-count #Jac(C)(F_p) against #E1(F_p) * #E2(F_p).
        STAGE 2 (arithmetic, zero compute): tabulate the cost formula
        Otilde(N^{2-2/g}) for g in {2, 3, 4, 5} against Otilde(N^{1/2}) at a
        cryptographic-scale N (e.g. log2 N ~ 256), as a one-line table
        making the closure's margin explicit and checkable by any reader.
      controls:
        - 'STAGE 1 IS ITS OWN NULL/KNOWN-CASE CONTROL: at g = 2 the formula must reproduce Gaudry''s own published "no gain over generic" result exactly (exponent 1, matching generic on the Jacobian); a mismatch here means the formula was mis-transcribed, not that the closure fails.'
        - 'KNOWN-POSITIVE-CASE (proves-too-much) CONTROL: apply the identical cost formula to the case of attacking the AMBIENT Jacobian''s OWN discrete log directly (not extracting the embedded E-factor). At g = 3 this must show a GENUINE advantage over generic-on-the-Jacobian (Otilde(p^{4/3}) vs Otilde(p^{1.5})), reproducing the actual, independently known positive Gaudry-Thome-Theriault-Diem result. If the argument also (incorrectly) negated this well-established positive case, the argument would be wrong; it does not, because the inflation factor N^{g-1} applies only to the EXTRACTED-FACTOR reading, not to the ambient-group reading.'
      required_metrics:
        - 'Stage 0 verbatim theorem statement and confirmed/corrected exponent'
        - 'Stage 1 exact point-count discrepancy (must be exactly 0)'
        - 'Stage 2 cost table, g in {2,3,4,5}, at one stated cryptographic N'
    falsification_conditions:
      - >-
        F1. The Stage-1 point-count identity fails (a nonzero discrepancy
        between #Jac(C)(F_p) and #E1(F_p)*#E2(F_p) at any tested instance
        with a verified honest F_p-isogeny embedding). This would mean step
        (1) of the mechanism (Tate's isogeny theorem as applied here) has
        been mis-stated or mis-applied, and the whole closure must be
        re-derived before being relied on again.
      - >-
        F2. Stage 0 reveals the cited Otilde(q^{2-2/g}) figure does not
        apply uniformly for g >= 2 as this record assumes (e.g. it requires
        a large-genus-only regime, or an additional smoothness/class-number
        condition not accounted for here). The cost bookkeeping in
        mechanism step (5) would then need to be redone with the corrected
        figure before the closure's conclusion (cost >= N^1 for all g >= 2)
        can be re-asserted.
      - >-
        F3. A reviewer exhibits a genuinely different index-calculus
        algorithm (not in the Gaudry/Gaudry-Thome-Theriault-Diem family)
        that solves DLP on a genus-g Jacobian using work that scales with
        N (the embedded factor's own size) rather than with the FULL
        ambient group order N * #A(F_p) -- i.e. a "factor-restricted" or
        "relative" index calculus. This is explicitly NOT ruled out by
        this closure (see method_ceiling) and is the named forward
        direction; finding one would reopen this entire line.
    confounders:
      - >-
        The embedding's construction cost (how expensive it is to actually
        build C, E1, E2, ... with the required compatible torsion structure)
        is NOT charged anywhere in this argument, because the closure holds
        even if the embedding were handed over for free -- disclosed so
        the closure is not read as stronger than it is (it is a LOWER bound
        on the attack's cost from the index-calculus stage alone; the true
        cost, including construction, is only worse).
      - >-
        This closure addresses only the SPECIFIC attack shape "embed, run
        published genus-g index calculus on the whole Jacobian, project
        back". It says nothing about hybrid constructions that use the
        embedding for some OTHER purpose (e.g. as a distinguisher, a
        re-randomization device, or a partial relation source combined with
        a different collection method); those are separate, unexamined
        objects.
    interpretation_limits:
      - >-
        This is a SCOPED closure of one attack family (published genus-g
        hyperelliptic/plane-curve index calculus applied to an embedding of
        E as a Poincare factor), not a claim that no genus-transfer
        mechanism of any kind could ever help. See method_ceiling and F3.
      - >-
        Zero compute, zero implementation; every quantitative step above is
        a symbolic derivation composing two classical theorems (Tate;
        Hasse-Weil) with one externally cited complexity figure (Gaudry /
        Gaudry-Thome-Theriault-Diem), itself verified only at
        WebSearch-snippet depth in this session (Stage 0 of the minimal test
        names the outstanding full-text verification).
      - >-
        Applies to ordinary curves over prime fields, matching RQ-CRYPTO-001's
        scope exactly; makes no claim about extension-field curves or
        supersingular curves.
    heuristic_assumptions: []
    heuristic_assumptions_note: >-
      NONE. Every load-bearing step (Tate's isogeny theorem, the Hasse-Weil
      bound, and the cited index-calculus complexity figure) is a classical
      or externally published UNCONDITIONAL statement (or, for the
      index-calculus figure, the author's own stated non-heuristic
      complexity for the double-large-prime variant); no random-model or
      distributional assumption is introduced by this candidate's own
      argument. This is a stronger evidentiary position than a
      heuristic-conditional claim and is stated as such rather than padded
      with an assumption that is not actually needed.
    target_complexity:
      time_exponent: >-
        NO POSITIVE ATTACK IS CLAIMED. The candidate instead upper-bounds
        (from below, i.e. LOWER-bounds the cost of) the named attack family:
        for every g >= 2, cost = Otilde(N^{2 - 2/g}) >= Otilde(N^{1}),
        strictly worse than direct rho.
      memory_exponent: >-
        Not separately bounded here; the cited genus-g index-calculus family
        uses a factor base of size ~q^{1 - 1/g} = Theta(N^{1-1/g}), which
        already exceeds rho's O(1)-per-processor / O(log N) memory profile
        for every g >= 2, reinforcing (not offsetting) the time-exponent
        conclusion.
      best_known: 'Pollard rho with negation, 0.886 sqrt(N) group operations, O(log N) memory (KN-TECH-005/006 conventions used elsewhere in this corpus).'
      hidden_overhead: >-
        The Otilde() in the cited genus-g complexity figure hides
        polylogarithmic factors from the double-large-prime variant''s own
        analysis, unquantified here (Stage 0 of the minimal test is where
        this would be pinned down); this overhead can only make the closure
        MORE decisive (it adds cost to the already-dominated attack side),
        never less.
      tradeoff_note: >-
        No time-memory tradeoff is proposed; the closure holds against the
        cited algorithm family at its own best-case (time-optimized)
        parameterisation, so no alternative memory/time balance of that
        family can cross below rho's exponent either (the exponent gap is a
        full factor of 2, not a constant that a tradeoff could close).
    estimated_cost:
      implementation: low
      compute: low
    dominated_by: >-
      n/a for the attack side (no attack is claimed; the deliverable is a
      closure). ROWS CHECKED before writing that: Pollard rho (0.886 sqrt(N),
      O(log N) memory); BSGS (2 sqrt(N) time, sqrt(N) memory); van
      Oorschot-Wiener parallel rho; H-ENDO-001's own balanced-MITM lattice
