      N^{1/(2r)}) are unconditional, and its P3 (cost stays at exponent 1/2,
      constant 2^{r+1}) is this hypothesis's own claim. CAND-1 below uses a
      DIFFERENT object entirely (a second, distinct elliptic or abelian-variety
      factor glued to E to form a higher-dimensional Jacobian, attacked via
      published hyperelliptic/plane-curve index calculus, never via lattice
      reduction over endomorphism eigenvalues). This session additionally
      traced, as a rejected sketch (source-novelty-audit.yaml,
      rejected_sketch REJ-4), why a naive "solve W_r by LLL in polynomial time
      for fixed r" shortcut fails for the SAME reason H-ENDO-001's own design
      already implies: constructing W_r's basis requires the coefficients
      k*lambda_i mod N, which requires k itself -- the identical
      hidden-number-problem-style obstruction. No new leverage was found
      there, and it is not submitted as a candidate.
  - id: H-IT-001
    note: >-
      Not named in the commissioning brief's off-limits list, but found during
      this session's own goal-history search (goal.yaml, BATCH-047/048) and
      treated as prior art: H-IT-001 (RQ-ECDLP-002, SG-ECDLP-002) established,
      via the unconditional Tate isogeny theorem, that anomalous-trace,
      MOV-vulnerable, and Weil-descent-vulnerable special-curve membership are
      ALL isogeny-class invariants over F_p (ordinary isogenies preserve the
      trace of Frobenius), so rho_special = 0 for any curve isogenous to a
      non-special one -- a mathematical certainty, not an open measurement.
      CAND-1 below independently re-derives and generalizes the SAME
      isogeny-invariance mechanism (via the stronger tool of Frobenius
      characteristic-polynomial multiplicativity under isogeny/Poincare
      decomposition) to a FOURTH, previously unchecked family: whether E can
      be embedded as a factor of a higher-genus Jacobian to access published
      genus-g index calculus. This is acknowledged as a mechanism EXTENSION
      of H-IT-001's own tool to a new target family, not an unrelated
      invention; CAND-1's own novelty argument in source-novelty-audit.yaml
      addresses this directly.

objects_considered:
  - object_id: OBJ-1
    description: >-
      (N, q_J): the target curve's own point count N = #E(F_p) paired with
      the point count q_J = #Jac(C)(F_p) of a genus-g curve C/F_p in which E
      is realised, over F_p, as a Poincare/isogeny factor (Jac(C) isogenous
      over F_p to E x A for a complementary (g-1)-dimensional abelian variety
      A), tracked through the embedding operation.
    genuinely_new_or_repackaging: >-
      Genuinely new to this program's corpus as a MECHANISM (an unconditional
      closure via Frobenius-characteristic-polynomial multiplicativity
      composed with the Weil/Hasse-Weil bound, applied against
      higher-genus-index-calculus-transfer attacks on plain prime-field
      ECDLP). Its two rigorous ingredients (Tate's isogeny theorem; the
      Gaudry / Gaudry-Thome-Theriault-Diem genus-g index-calculus complexity
      figure) are individually well-known published results, cited as such.
      Distinct from the sibling goal GOAL-ECTD-001's extensive Kani-construction
      / isogeny-volcano corpus, which uses the SAME external ingredient
      family (Kani's construction, Galbraith 2024/eprint-2024-924) for a
      DIFFERENT purpose (bounding the COST of navigating BETWEEN two given
      curves of one isogeny class, for trapdoor path-hiding analysis under
      RQ-ECTD-001) and explicitly disclaims any ECDLP exponent claim. See
      source-novelty-audit.yaml for the full discrimination.
    concretely_testable: >-
      Yes. The one-step propagation (Poincare/isogeny embedding forces
      q_J = N * #A(F_p) exactly, and #A(F_p) = Theta(N^{g-1}) by Hasse-Weil)
      is a toy-scale, zero-to-low-compute checkable numerical identity: take
      any two toy curves E1, E2/F_p of known point counts and any explicit
      genus-2 gluing realising Jac(C) isogenous to E1 x E2 (Kani-Rosen),
      then verify #Jac(C)(F_p) = #E1(F_p) * #E2(F_p) exactly by direct point
      counting. See CAND-1.minimal_test.
    how_far_it_survives: >-
      Survives as a CLOSURE, not as an attack: the argument holds
      unconditionally for every g >= 2, so the "structure" (the hoped-for
      exponent gain) dissolves immediately upon the Weil-bound counting step,
      before any relation-collection or linear-algebra stage is even
      designed. This is disclosed as the candidate's own finding, not hidden.
  - object_id: OBJ-2
    description: >-
      The Mordell-Weil lattice of an integral (Z-)lift of (E, P, Q) under the
      Neron-Tate canonical height pairing (Xedni calculus, Silverman-Scott
      1998-2000).
    genuinely_new_or_repackaging: 'Known result, not new. Rejected on this ground alone.'
    concretely_testable: 'Not attempted; superseded by the published negative result below.'
    how_far_it_survives: >-
      Already shown, in the open literature, to require lattice reduction of
      a basis whose entries grow super-polynomially with the lift height,
      making the method asymptotically worse than Pollard rho
      (Jacobson-Koblitz-Silverman-Stein-Teske, "The xedni calculus and the
      elliptic curve discrete logarithm problem", Des. Codes Cryptogr. 20
      (2000)). Recorded here as a rejected sketch (source-novelty-audit.yaml
      REJ-1) for completeness, not proposed.
  - object_id: OBJ-3
    description: >-
      The (Z/2Z)^3-kernel isogeny class of a genus-3 hyperelliptic curve
      (Smith, EUROCRYPT 2008 / eprint 2007/428 / arXiv:0806.2995), which
      transfers DLP from a hyperelliptic to a faster non-hyperelliptic
      genus-3 Jacobian for an explicit ~18.57% density of genus-3 curves over
      F_p, p > 3.
    genuinely_new_or_repackaging: >-
      Considered as a possible route to CAND-1's ambient object, but VERIFIED
      BY WEBFETCH (not assumed from memory) to concern ONLY genus-3-to-genus-3
      transfer; it does not touch elliptic curves (genus 1) at all and does
      not supply an embedding of a genus-1 curve into a genus-3 Jacobian.
      Rejected as inapplicable to this problem, not as unoriginal.
    concretely_testable: 'N/A -- ruled out at the applicability-check stage before any test was designed.'
    how_far_it_survives: 'Does not reach this problem at all. See source-novelty-audit.yaml REJ-2 for the exact WebFetch confirmation text.'
  - object_id: OBJ-4
    description: >-
      The isogeny-class representative at the volcano surface (maximal
      order), sought for extra rational automorphisms or a smaller CM
      discriminant than the given curve's own.
    genuinely_new_or_repackaging: >-
      Repackaging. The CM discriminant D = t^2 - 4p (t the trace of Frobenius)
      is fixed for the WHOLE isogeny class (it is not a property of any one
      representative), so no isogeny walk can move a curve into a smaller-
      discriminant class; this is the identical mechanism H-IT-001 already
      established for anomalous/MOV/Weil-descent membership.
    concretely_testable: 'N/A -- ruled out algebraically before any test was designed (see REJ-3).'
    how_far_it_survives: 'Dissolves immediately; not submitted.'
  - object_id: OBJ-5
    description: >-
      An auxiliary "strong-DH-like" oracle built from an endomorphism phi's
      public eigenvalue lambda, attempting a Cheon-style structured-auxiliary-
      group speedup (sqrt(N/d) + sqrt(d) for d | N +/- 1).
    genuinely_new_or_repackaging: >-
      Not a repackaging of anything in this corpus, but mechanically
      inapplicable: Cheon's algorithm needs genuine ORACLE ACCESS to
      g^{a^d . x} in a MULTIPLICATIVE group; there is no additive analogue of
      the exponentiation a -> a^d available from group operations alone on
      E(F_p), and no such oracle is granted by RQ-CRYPTO-001's problem
      statement (plain (P, Q = kP), no auxiliary oracle).
    concretely_testable: 'No -- no oracle exists to test against.'
    how_far_it_survives: 'Dissolves at the object-definition stage (REJ-5); not submitted.'
  - object_id: OBJ-6
    description: >-
      The x-only "halving tree" (preimage tree of the doubling map), searched
      as an alternative to the standard doubling-based Montgomery ladder.
    genuinely_new_or_repackaging: >-
      FAILS THE LOSSY-PROJECTION TEST explicitly. Halving is multiplication
      by 2^{-1} mod N; the object retains the full group structure and
      discards nothing that is not already recoverable via the ordinary
      group law. A change of coordinates, not a new object (docs/inventor-
      protocol.md section 2).
    concretely_testable: 'N/A -- fails the projection test before any test is designed.'
    how_far_it_survives: 'Does not survive the projection test itself; not submitted.'

candidates:
  - id: CAND-1
    title: >-
      Cross-genus Poincare-factor embedding cannot beat Pollard rho on the
      embedded elliptic factor (Hasse-Weil order-inflation closure)
    class: control
    tracked_object: OBJ-1
    claim: >-
      Let E/F_p be an ordinary elliptic curve with prime subgroup order
      N = #E(F_p) (Hasse: N = p + 1 - t, |t| <= 2 sqrt(p)). Suppose E is
      realised, by ANY explicit construction (gluing two or more curves
      along compatible torsion per Kani-Rosen, or any other method), as a
      Poincare/isogeny factor over F_p of the Jacobian of a smooth genus-g
      curve C/F_p, g >= 2, so that Jac(C) is F_p-isogenous to E x A for some
      complementary abelian variety A/F_p of dimension g - 1. Then: (a) the
      complementary factor A is FORCED, unconditionally, to satisfy
      #A(F_p) = Theta(N^{g-1}) -- it cannot be made small by any choice of
      construction; and (b) applying the best published genus-g
      hyperelliptic/plane-curve index-calculus algorithm (Gaudry 2000 for
      g = 2; the Gaudry-Thome-Theriault-Diem double-large-prime family for
      general g, complexity Otilde(p^{2-2/g}) = Otilde(N^{2-2/g})) to
      Jac(C)(F_p) and reading off k from the E-component costs
      Otilde(N^{2-2/g}) >= Otilde(N^{1}) for every g >= 2 -- strictly worse,
      by a full exponent factor of 2, than direct Pollard rho on E at
      Otilde(N^{1/2}). No embedding of E into a higher-genus ambient
      Jacobian, attacked by this published algorithm family, can beat rho on
      E. This is a closure of that specific attack shape, not a claim about
      every conceivable genus-transfer method (see method_ceiling below).
    mechanism: >-
      (1) [Tate 1966, isogeny theorem, RECALLED] Isogenous abelian varieties
      over F_p have IDENTICAL characteristic polynomials of Frobenius (the
      isogeny induces an isomorphism of rational Tate modules, hence
      identical Frobenius eigenvalues). If Jac(C) ~ E x A over F_p then
      charpoly_Frob(Jac(C))(T) = charpoly_Frob(E)(T) * charpoly_Frob(A)(T)
      exactly, because the characteristic polynomial of a product is the
      product of the factors' characteristic polynomials. Evaluating at
      T = 1 gives an EXACT identity (not an estimate):
      #Jac(C)(F_p) = #E(F_p) * #A(F_p) = N * #A(F_p).
      (2) [Hasse-Weil bound for genus-g curves, RECALLED, classical] For any
      smooth genus-g curve C/F_p, #Jac(C)(F_p) lies in
      [(sqrt(p) - 1)^{2g}, (sqrt(p) + 1)^{2g}], i.e. Theta(p^g).
      (3) Combining (1) and (2), and using N = Theta(p) (Hasse bound for E):
      #A(F_p) = #Jac(C)(F_p) / N = Theta(p^g) / Theta(p) = Theta(p^{g-1})
      = Theta(N^{g-1}). This holds for EVERY construction realising the
      embedding, because it follows from (1)-(2) alone, independent of how
      Jac(C) was built or how large or small its defining equations are.
      There is no "cheap auxiliary factor" available to any designer of the
      embedding.
      (4) [Gaudry 2000; Gaudry-Thome-Theriault-Diem 2007 (eprint 2004/153),
      RETRIEVED via WebSearch snippet, see citations] The best published
      genus-g hyperelliptic/plane-curve index-calculus family solves DLP on
      a genus-g Jacobian over F_p in expected time Otilde(p^{2-2/g})
      (matching, at g = 2, Gaudry's own O(p) result -- no gain over generic
      on the Jacobian -- and, at g >= 3, beating generic on the Jacobian,
      the well-known headline result of that line of work).
      (5) Expressing step (4)'s cost in terms of N (since p = Theta(N)):
      cost = Otilde(N^{2-2/g}). The exponent 2 - 2/g is STRICTLY INCREASING
      in g for g >= 2 (derivative 2/g^2 > 0), with minimum value 1 attained
      at g = 2. Hence for every g >= 2, cost = Otilde(N^{>= 1}), which is
      worse than direct Pollard rho's Otilde(N^{1/2}) by a full factor-of-2
      exponent gap, uniformly in g. Reading off the target's own discrete
      log k from a solved Jac(C)-instance requires only the (efficiently
      computable, once the embedding is fixed) projection to the E-factor,
      which does not change this cost bookkeeping (it is cheaper, not more
      expensive, than the index-calculus stage itself).
    novelty_status: unverified
    citations:
      - ref: 'Tate, J. "Endomorphisms of abelian varieties over finite fields." Invent. Math. 2 (1966), 134-144.'
        provenance: recalled
        claim: 'Isogenous abelian varieties over a finite field have identical characteristic polynomials of Frobenius.'
        verified_by: null
      - ref: 'Weil conjectures for curves / Hasse-Weil bound (classical, e.g. Weil 1948 / any standard reference).'
        provenance: recalled
        claim: '#Jac(C)(F_p) in [(sqrt(p)-1)^{2g}, (sqrt(p)+1)^{2g}] for a genus-g curve C/F_p.'
        verified_by: null
      - ref: 'Gaudry, P. "An algorithm for solving the discrete log problem on hyperelliptic curves." EUROCRYPT 2000.'
        provenance: recalled
        claim: 'Genus-2 hyperelliptic-curve index calculus costs O(q) field operations -- no asymptotic gain over generic sqrt(#Jacobian) for genus 2.'
        verified_by: null
      - ref: 'Gaudry, Thome, Theriault, Diem, "A double large prime variation for small genus hyperelliptic index calculus", Math. Comp. 76 (2007); eprint.iacr.org/2004/153.'
        provenance: retrieved
        claim: >-
          Using a factor base of size ~q^{1-1/g}, the double-large-prime
          variation gives complexity Otilde(q^{2-2/g}) for both harvesting
          and linear algebra on a genus-g curve over F_q, and for genus 3
          this surpasses Pollard rho "even for rather small field sizes".
        verified_by: 'this session, WebSearch query on 2026-09-02 quoting the eprint 2004/153 abstract; snippet-level only, full PDF not opened -- disclosed as a limitation.'
      - ref: 'Smith, B. "Isogenies and the Discrete Logarithm Problem in Jacobians of Genus 3 Hyperelliptic Curves." EUROCRYPT 2008; arXiv:0806.2995; eprint.iacr.org/2007/428.'
        provenance: retrieved
        claim: >-
          Gives explicit (Z/2Z)^3-kernel isogenies transferring DLP from
          hyperelliptic to non-hyperelliptic genus-3 Jacobians for ~18.57%
          of genus-3 curves over F_p, p > 3; CONFIRMED via WebFetch to
          concern genus-3-to-genus-3 transfer only and NOT to touch elliptic
          curves (genus 1) -- cited here to document that this specific
          external result was checked and found inapplicable as a
          shortcut for CAND-1's embedding step, not as a supporting citation.
        verified_by: 'this session, WebFetch of arxiv.org/abs/0806.2995 on 2026-09-02.'
      - ref: 'Kani, E. and Rosen, M. "Idempotent relations and factors of Jacobians." Math. Ann. 284 (1989), 307-327 (gluing two elliptic curves along compatible n-torsion to realise a genus-2 Jacobian isogenous to their product).'
        provenance: recalled
        claim: 'Existence of an explicit gluing construction realising Jac(C) isogenous to E1 x E2 for suitably compatible E1, E2.'
        verified_by: null
      - ref: 'ledger/goals/GOAL-ECDLP-001/goal.yaml, BATCH-047/BATCH-048 notes (H-IT-001, DEC-20260804-2fae6a).'
        provenance: internal
        claim: >-
          Ordinary F_p-isogenies preserve the trace of Frobenius, hence
          anomalous/MOV/Weil-descent special-curve membership is an
          isogeny-class invariant; rho_special = 0 as a mathematical
          certainty. CAND-1 generalises the same class of argument (isogeny
