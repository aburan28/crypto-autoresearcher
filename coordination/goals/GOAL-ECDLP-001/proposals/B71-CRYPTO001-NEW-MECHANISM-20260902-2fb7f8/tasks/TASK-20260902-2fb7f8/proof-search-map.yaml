schema: 'crypto.autoresearch.proof_search_map.v1'
task_id: TASK-20260902-2fb7f8
goal_id: GOAL-ECDLP-001
applies_to_candidate: CAND-1
candidate_title: >-
  Cross-genus Poincare-factor embedding cannot beat Pollard rho on the
  embedded elliptic factor (Hasse-Weil order-inflation closure)
recorded_at: '2026-09-02'
note: >-
  Per docs/inventor-protocol.md section 8 / KN-TECH-080, applied before any
  compute or dispatch is recommended. This is a falsification aid: a failed
  audit is itself a useful result and none of the four audits below asserts
  anything beyond what AGENTS.md rules 4 and 6 already allow.

proof_search_map:
  bottleneck: >-
    The single step whose removal (or correction) changes the whole
    argument is mechanism step (3) in candidate-mechanisms.yaml: the
    forced inequality #A(F_p) = Theta(N^{g-1}) for the complementary
    factor A. This follows purely from combining Tate's isogeny theorem
    (exact multiplicativity of the characteristic polynomial of Frobenius
    across an isogeny decomposition) with the Hasse-Weil bound
    (#Jac(C)(F_p) = Theta(p^g)) and Hasse's own bound for E
    (N = Theta(p)). If ANY of these three classical facts fails to apply
    to a proposed construction -- for instance, if the "embedding" is not
    an honest F_p-rational isogeny decomposition, or if C is not smooth of
    the stated genus, or the isogeny's kernel forces a different field of
    definition -- the forced inflation does not follow, and the closure
    does not apply to that construction. This is exactly the gap named as
    open in falsification_conditions F1 and interpretation_limits.

  baseline_embedding:
    parameter_slice: >-
      g = 2, the case Gaudry (EUROCRYPT 2000) already solved directly: an
      elliptic curve E embedded (via any genus-2 gluing, e.g. Kani-Rosen)
      as a factor of a genus-2 Jacobian. CAND-1's own formula
      Otilde(N^{2-2/g}) must reduce, at g = 2, to Otilde(N^{1}) -- i.e. to
      EXACTLY Gaudry's own published "no gain over generic on the
      Jacobian" result (generic on a genus-2 Jacobian of order ~N^2 is
      Otilde(N^{2/2}) = Otilde(N^{1}), matching). This is not a curve on a
      plot that merely looks similar to the baseline: it is the SAME
      published exponent, re-derived from the general formula as a special
      case, which is the correct sense of "baseline reproduction" for a
      closure that generalizes an existing no-gain result to all g.
    reproduction_check: >-
      Symbolic: substitute g = 2 into Otilde(q^{2-2/g}) and confirm it
      equals Otilde(q^1) = Otilde(q), matching Gaudry's own stated
      complexity for genus-2 hyperelliptic index calculus. This check
      requires no computer algebra and is verified by direct substitution
      in this record; it is additionally named as the Stage-0/Stage-1
      content of CAND-1's own minimal_test, to be independently confirmed
      against the full papers (not the WebSearch snippet this session
      used) before the closure is cited as settled elsewhere.
      RESULT OF THIS SESSION'S OWN CHECK: PASSES (2 - 2/2 = 1, exactly).

  observation_collision:
    observable: >-
      The pair (N, g) -- the target factor's order and the ambient genus --
      together with the resulting predicted attack cost Otilde(N^{2-2/g}).
      This is the quantity the closure's conclusion is read off.
    distinct_preimage_search: >-
      REQUIRED, AND EXPECTED (BY CONSTRUCTION) TO SUCCEED, in exactly the
      sense that makes the closure hold rather than break it: for a FIXED
      (N, g), every honest F_p-isogeny embedding of a fixed E into a
      genus-g Jacobian -- regardless of which auxiliary curves or gluing
      construction is used to build it -- gives the IDENTICAL forced value
      #A(F_p) = Theta(N^{g-1}) and hence the identical predicted cost. The
      observable does not distinguish between "cheap-looking" and
      "expensive-looking" constructions, because step (3) of the mechanism
      shows that distinction is illusory: no construction can escape the
      Hasse-Weil-forced count. A collision here is NOT a falsifier of the
      closure; it is the closure's own content (this mirrors the treatment
      in this program's own prior audits, e.g. TASK-20260831-0cbeca's
      Wagner-sub-avenue closure, where the collision across constructions
      was likewise the point rather than a defect).
      What WOULD be a genuine, closure-breaking collision: two
      CONSTRUCTIONS with the same (N, g) but where one is NOT an honest
      F_p-rational isogeny decomposition (e.g. the gluing kernel is only
      defined over an extension field, or C is singular / of the wrong
      genus) -- such a construction would fall outside the audited scope
      and is explicitly flagged as untouched by this closure in
      interpretation_limits and falsification_conditions F1.

  quantifier_order: >-
    FOR ALL ordinary elliptic curves E/F_p with N = #E(F_p),
    FOR ALL integers g >= 2,
    FOR ALL smooth genus-g curves C/F_p such that Jac(C) is F_p-isogenous
      to E x A for some abelian variety A/F_p of dimension g - 1,
    FOR THE STATED published algorithm family (Gaudry 2000 at g = 2;
      Gaudry-Thome-Theriault-Diem's double-large-prime variant for
      general g),
    THE cost of solving DLP on Jac(C)(F_p) via that algorithm and
      projecting to E's factor is Otilde(N^{2 - 2/g}) >= Otilde(N^1).
    NOT CLAIMED (the universal that would be the falsifier, F3): "FOR ALL
    algorithms of any kind operating on any ambient object containing E as
    a factor, no speedup over rho is possible." That broader universal is
    explicitly outside this closure's scope; a single genuinely different
    "factor-restricted" algorithm (not in the named family) surviving this
    audit would not falsify CAND-1 as stated, but WOULD reopen the general
    question CAND-1 leaves as forward guidance.

  constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        Hold (N, g) fixed and vary the forgotten structure -- which
        specific auxiliary curves/abelian variety A, and which specific
        gluing construction, realise the embedding. Ask whether any
        intrinsic invariant of a particular construction lets the
        index-calculus stage run in less than Otilde(N^{2-2/g}) time by
        exploiting A's internal structure (e.g. A itself being a product
        of SMALL-order-looking pieces).
      predicted_gain: >-
        None, by step (3) of the mechanism: A's TOTAL point count is
        forced to Theta(N^{g-1}) regardless of its internal factorization,
        and the cited index-calculus complexity is stated in terms of the
        field size p (equivalently N), not in terms of any finer structure
        of A. This transform is run analytically in this record and
        returns a negative result, which is the closure itself, not a
        separate finding.
    - transform: specialization_pack
      proposed_object: >-
        The resource measure "exponent margin between the attack family
        and direct rho", realised as (2 - 2/g) - (1/2), charged per g.
      predicted_gain: >-
        A one-line table (CAND-1.minimal_test Stage 2) replacing a
        qualitative "higher genus should help" intuition with a signed,
        monotonically increasing margin: g=2 gives margin +0.5; g=3 gives
        margin +0.833; g=4 gives +1.0; margin -> +1.5 as g -> infinity.
        The margin is NEVER negative for g >= 2, which is the whole
        closure stated as a single monotone quantity.

  method_ceiling:
    strongest_certifiable_claim: >-
      At most: "for the DECLARED algorithm family (Gaudry / Gaudry-Thome-
      Theriault-Diem genus-g index calculus applied to the FULL ambient
      Jacobian, then projected), embedding E as a Poincare factor of ANY
      genus-g curve's Jacobian, g >= 2, costs at least Otilde(N^1), which
      is worse than direct rho." It can NEVER certify: (i) that no
      DIFFERENT algorithm exploiting the embedding could do better (the
      factor-restricted-index-calculus question, F3); (ii) that no
      embedding-free structural fact about E correlates with genus-g
      objects in some other useful way; or (iii) anything about attacks
      that do not go through a full-Jacobian relation-collection stage at
      all.
    nearby_object_control: >-
      THE CLOSEST OBJECT WHERE THE HOPED-FOR CONCLUSION (genus-g index
      calculus gives an exponent gain) GENUINELY HOLDS: attacking the
      AMBIENT Jacobian's OWN discrete logarithm problem directly, rather
      than extracting an embedded elliptic factor's discrete log. There,
      for g >= 3, Otilde(N^{2-2/g}) (e.g. N^{4/3} at g=3) IS strictly
      better than generic on the ambient group (Otilde(N^{g/2}) = N^{1.5}
      at g=3) -- this is the actual, independently published, well-known
      positive result of Gaudry-Thome-Theriault-Diem and Diem's broader
      framework, and CAND-1's own argument correctly does NOT negate it
      (see candidate-mechanisms.yaml minimal_test's "known-positive-case"
      control). A method whose argument ALSO incorrectly ruled out this
      known-true nearby case would have proved too much and would be
      wrong somewhere; CAND-1's argument is checked against exactly this
      object and distinguishes the two readings (ambient-group DLP versus
      extracted-factor DLP) cleanly via the N^{g-1} inflation factor,
      which applies to the SIZE of the prize (N, tiny) relative to the
      cost (scaling with the full ambient order N^g) only in the
      extracted-factor reading.

  proof_obligations:
    - claim: 'Isogenous abelian varieties over F_p have identical characteristic polynomials of Frobenius (Tate 1966).'
      responsibility: baseline
    - claim: '#Jac(C)(F_p) = Theta(p^g) for a smooth genus-g curve C/F_p (Hasse-Weil).'
      responsibility: size
    - claim: 'Given (1) and (2) and N = Theta(p) for E, the complementary factor A satisfies #A(F_p) = Theta(N^{g-1}) for every honest F_p-isogeny embedding.'
      responsibility: correctness
    - claim: 'The cited genus-g index-calculus family costs Otilde(p^{2-2/g}) on the full ambient Jacobian (Gaudry 2000; Gaudry-Thome-Theriault-Diem 2007).'
      responsibility: runtime
    - claim: 'Projecting a solved Jac(C)-instance to the E-factor to read off k costs no more than the index-calculus stage itself.'
      responsibility: interface
    - claim: 'The closure applies only to the named algorithm family and does not certify the absence of a factor-restricted/relative index-calculus variant (F3).'
      responsibility: scope
    - claim: 'The closure applies only to ordinary curves over prime fields (RQ-CRYPTO-001''s stated scope); no claim is made for extension-field or supersingular curves.'
      responsibility: scope

  not_applicable_reason: null

