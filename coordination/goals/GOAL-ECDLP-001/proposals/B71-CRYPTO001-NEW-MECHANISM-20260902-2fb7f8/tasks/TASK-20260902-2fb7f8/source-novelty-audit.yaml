method: >-
  No crypto-kb MCP server (search_knowledge/get_context/get_source/
  find_related) was available to this session's declared tool surface;
  corpus access was via direct Grep/Read of ledger/ and knowledge/ rather
  than the semantic index. This is disclosed per AGENTS.md's knowledge
  retrieval policy rather than silently substituted. External-literature
  checking used WebSearch (2 queries directly informing CAND-1, plus 3
  earlier exploratory queries recorded below for completeness) and WebFetch
  (1 call). Absence of a corpus match is reported as a floor, not an
  estimate (AGENTS.md, "Knowledge retrieval policy").

internal_corpus_searches:
  - query: 'isogeny | Weil descent | GHS | pairing | MOV | Cheon | class group | modular curve | hyperelliptic | Coppersmith | kangaroo | distinguished point | quantum | Kummer surface (case-insensitive) over ledger/goals/GOAL-ECDLP-001/goal.yaml'
    note: 'First pass matched "pairing" as a substring of "repairing" (false positives); re-run word-bounded below.'
  - query: '\bisogeny\b | Weil descent | \bGHS\b | \bMOV\b | \bCheon\b | twist security | class group | modular curve | hyperelliptic | Coppersmith | kangaroo | distinguished point | \bquantum\b | Kummer surface | \bpairing\b | multiplicative embedding, word-bounded, over goal.yaml'
    result: >-
      Surfaced H-IT-001 / SG-ECDLP-002 (BATCH-047 through BATCH-053): the
      unconditional Tate isogeny theorem was already used in this goal's
      own history to close anomalous/MOV/Weil-descent special-curve
      membership as an isogeny-class invariant (rho_special = 0). Used as
      prior art and as the basis for CAND-1's own discrimination note
      against H-IT-001 (see candidate-mechanisms.yaml).
  - query: 'Kani | Hasse-Weil | Poincar[e] | Jacobian | genus | Weil bound | abelian variety, over goal.yaml'
    result: 'One incidental match unrelated to CAND-1''s object (a "degree/genus/conductor-matched" phrase in an unrelated statistical-control context). No prior use of the Kani/Jacobian/genus-embedding mechanism found in GOAL-ECDLP-001''s own history.'
  - query: 'Kani | Hasse-Weil | Jacobian | genus.g | abelian variety | Weil restriction | Gaudry | Diem, over knowledge/'
    result: >-
      250+ files matched (limit hit) -- almost entirely "genus" appearing
      inside unrelated literature abstracts and Diem/Gaudry citations used
      as GENERIC prior-art pointers for Semaev-style decomposition
      elsewhere in the corpus (e.g. index-calculus sizing conventions
      already cited by H-SUBRES-001). No entry was found applying these
      terms to a genus-g EMBEDDING TRANSFER argument against plain ECDLP;
      this breadth is disclosed as a floor (many hits, none on-point) not
      as evidence of absence beyond what was actually read.
  - query: 'gluing | Kani | Richelot | product of elliptic | isogeny factor | Poincar[e] | Weil restriction | non-hyperelliptic, over ledger/proposals/ and knowledge/'
    result: >-
      81-223 files matched, again predominantly boilerplate
      "excluded-mechanism" checklists inside unrelated idea proposals
      (standard practice in this program's own proposal template, where
      producers list established families as off-limits even when
      irrelevant to their own object). ONE genuinely on-point family of
      records was found and is reported in full below:
      ledger/proposals/IDEA-20260901-eb468f.yaml (and its sibling record
      IDEA-20260901-80308d) under GOAL-ECTD-001 / RQ-ECTD-001, dated the
      day before this task. Read in full; discrimination recorded below.

sibling_goal_finding:
  goal: GOAL-ECTD-001
  question: RQ-ECTD-001
  record_read_in_full: ledger/proposals/IDEA-20260901-eb468f.yaml
  what_it_is: >-
    An active, large (dozens of IDEA-/H-ECTD-* records dated 2026-07-31
    through 2026-09-01) research line using Kani's construction and two
    recent external papers -- Galbraith, "Climbing and descending tall
    isogeny volcanos" (eprint 2024/924, Research in Number Theory 11:7,
    2025) and Galbraith-Gilchrist-Robert, "Improved algorithms for
    ascending isogeny volcanoes..." (eprint 2025/1243) -- to bound the COST
    of computing an explicit connecting isogeny BETWEEN TWO GIVEN curves of
    the SAME ordinary isogeny class (same point count), at
    Otilde(p^{1/4}) rigorous (small crater) to Otilde(p^{0.4}) heuristic
    (worst case), both below matched rho. This is used for a TRAPDOOR
    PATH-HIDING security analysis (whether a curve-based trapdoor design
    can hide a secret isogeny-volcano vertex from a public observer), not
    for attacking a random ECDLP instance's own discrete log. The record's
    own target_complexity block states explicitly: "NO ATTACK ON ECDLP IS
    CLAIMED AND NO EXPONENT MOVES FOR PLAIN ECDLP."
  why_this_does_not_overlap_cand_1: >-
    (1) DIFFERENT PROBLEM: connecting-isogeny COMPUTATION between two given,
    already-isogenous curves (a navigation problem) versus CAND-1's
    genus-g-Jacobian INDEX-CALCULUS TRANSFER (a relation-collection/
    linear-algebra problem on a higher-dimensional ambient object). (2)
    DIFFERENT DIMENSION: IDEA-20260901-eb468f stays within GENUS 1 (moving
    between elliptic curves in one isogeny class); CAND-1 requires an
    ambient GENUS >= 2 object. (3) DIFFERENT USE OF "KANI'S CONSTRUCTION":
    the sibling record uses it (via the cited 2024/2025 papers) for
    volcano-navigation speed; CAND-1 uses the ORIGINAL Kani-Rosen
    gluing-to-a-product-Jacobian construction as the embedding whose COST
    STRUCTURE is then analysed via Hasse-Weil, not as a navigation
    algorithm. (4) DIFFERENT QUESTION: RQ-ECTD-001 (trapdoor path-hiding)
    versus RQ-CRYPTO-001 (beat rho on plain ECDLP). No content of CAND-1
    is drawn from, duplicates, or contradicts IDEA-20260901-eb468f; both
    are recorded so a future reader does not mistake the shared citation
    family (Kani, Galbraith) for a shared claim.
  action_taken: >-
    None beyond this disclosure -- this task's write scope excludes
    GOAL-ECTD-001's records and no action is proposed on that lane.

external_citations_full_table:
  - ref: 'Tate, J., "Endomorphisms of abelian varieties over finite fields", Invent. Math. 2 (1966), 134-144.'
    provenance: recalled
    claim: 'Isogenous abelian varieties over F_p share an identical characteristic polynomial of Frobenius.'
    verified_by: null
    novelty_role: 'Load-bearing classical ingredient; known, cited as such (novelty is not claimed for this theorem).'
  - ref: 'Hasse-Weil bound for curves of genus g (classical; Weil 1948 or any standard reference, e.g. Silverman, AEC II, or Stichtenoth).'
    provenance: recalled
    claim: '#Jac(C)(F_p) in [(sqrt p - 1)^{2g}, (sqrt p + 1)^{2g}].'
    verified_by: null
    novelty_role: 'Load-bearing classical ingredient; known, cited as such.'
  - ref: 'Gaudry, P., "An algorithm for solving the discrete log problem on hyperelliptic curves", EUROCRYPT 2000, LNCS 1807.'
    provenance: recalled
    claim: 'Genus-2 hyperelliptic index calculus costs O(q) -- no exponent gain over generic on the genus-2 Jacobian.'
    verified_by: null
    novelty_role: 'Baseline-reproduction anchor for CAND-1''s proof_search_map audit 1; known result.'
  - ref: 'Gaudry, Thome, Theriault, Diem, "A double large prime variation for small genus hyperelliptic index calculus", Math. Comp. 76 (2007); eprint.iacr.org/2004/153.'
    provenance: retrieved
    claim: 'Complexity Otilde(q^{2-2/g}) for genus-g curves over F_q using a q^{1-1/g}-size factor base; beats rho for g >= 3.'
    verified_by: 'this session, WebSearch on 2026-09-02, query "Gaudry Thome Theriault Diem double large prime genus hyperelliptic index calculus complexity q^{2-2/g} formula"; result quoted the eprint abstract text directly. SNIPPET-LEVEL ONLY -- the full PDF was not opened. Disclosed as an outstanding Stage-0 item in candidate-mechanisms.yaml, in the same spirit as this corpus''s own prior practice of flagging grep-snippet-only citations (cf. KN-OPEN-2f5e66''s CPF-4 note on KN-LIT-3264).'
    novelty_role: 'THE load-bearing external complexity figure for CAND-1''s mechanism step (4)-(5); externally published, not new.'
  - ref: 'Smith, B., "Isogenies and the Discrete Logarithm Problem in Jacobians of Genus 3 Hyperelliptic Curves", EUROCRYPT 2008; arXiv:0806.2995; eprint.iacr.org/2007/428.'
    provenance: retrieved
    claim: '(Z/2Z)^3-kernel isogenies transfer DLP from hyperelliptic to non-hyperelliptic genus-3 Jacobians for ~18.57% of genus-3 curves over F_p (p>3); applies ONLY to genus-3-to-genus-3 transfer, NOT to elliptic curves.'
    verified_by: 'this session, WebFetch of https://arxiv.org/abs/0806.2995 on 2026-09-02, prompted specifically to check whether the construction touches elliptic (genus-1) curves. Response: "This construction does not affect elliptic curves (genus 1) at all."'
    novelty_role: >-
      NEGATIVE CHECK, not a supporting citation: this session initially
      (mis)recalled that Smith''s result might supply a genus-1-to-genus-3
      embedding route and DELIBERATELY VERIFIED this by WebFetch rather
      than proceeding on memory, per AGENTS.md rule 9 and the "recalled is
      a pointer, never a citation" discipline. The check falsified the
      initial recollection; CAND-1 does NOT rely on Smith 2008 for its own
      embedding step and instead uses the classical Kani-Rosen gluing
      (recalled) for that role. This negative result is recorded here so a
      future session does not re-attempt the same false lead without first
      reading this disclosure.
  - ref: 'Kani, E. and Rosen, M., "Idempotent relations and factors of Jacobians", Math. Ann. 284 (1989), 307-327.'
    provenance: recalled
    claim: 'Explicit gluing of two elliptic curves along compatible n-torsion realises a genus-2 curve whose Jacobian is isogenous to their product.'
    verified_by: null
    novelty_role: 'Cited as the classical existence result for CAND-1''s embedding step; not itself claimed as new. NOT the same use of "Kani''s construction" as GOAL-ECTD-001''s corpus -- see sibling_goal_finding above.'
  - ref: 'Gaudry-Hess-Smart (GHS) Weil descent; Diem''s odd-characteristic generalization (both recalled, plus one confirming WebSearch)'
    provenance: retrieved
    claim: 'Weil descent / GHS-style attacks fundamentally require an extension-field structure (attacking E/F_{p^n} via a cover defined over F_p); they do not apply to genuinely prime fields F_p, which have no subfield to descend to.'
    verified_by: 'this session, WebSearch on 2026-09-02, query on GHS/Diem odd-characteristic Weil descent scope; confirmed the extension-field requirement directly from search-result summaries of the Nigel Smart Weil-descent survey page and related sources.'
    novelty_role: >-
      Used only to rule out one of the sketches considered (an attempted
      revival of Weil-descent-family ideas) as out of RQ-CRYPTO-001''s
      prime-field scope; not a component of CAND-1 itself. Consistent with,
      and independently corroborates without duplicating, this program''s
      own already-recorded H-IT-001 finding that Weil-descent membership is
      an isogeny-class invariant for the ordinary prime-field case.
  - ref: 'Jacobson, M.J., Koblitz, N., Silverman, J.H., Stein, A., Teske, E., "Analysis of the Xedni Calculus Attack", Des. Codes Cryptogr. 20 (2000), 41-64.'
    provenance: recalled
    claim: >-
      Silverman-Scott''s "xedni calculus" (lifting E, P, Q to Z and using
      Mordell-Weil lattice reduction under the canonical height pairing) is
      shown infeasible: the required lattice basis grows super-polynomially
      with the lift height, making the attack asymptotically worse than
      Pollard rho.
    verified_by: null
    novelty_role: 'Cited to justify rejecting OBJ-2 (Xedni calculus) as a KNOWN, already-closed result in the open literature, not proposed as a candidate here.'

rejected_sketches:
  - id: REJ-1
    object: OBJ-2
    summary: 'Xedni calculus (Silverman-Scott Z-lift + Mordell-Weil lattice reduction).'
    reason_rejected: 'KNOWN result, independently and definitively shown infeasible in the open literature (Jacobson-Koblitz-Silverman-Stein-Teske 2000). Not novel.'
  - id: REJ-2
    object: OBJ-3
    summary: 'Smith 2008 genus-3 hyperelliptic-to-non-hyperelliptic transfer, considered as a possible embedding shortcut for CAND-1.'
    reason_rejected: 'INAPPLICABLE, verified by WebFetch (not assumed from memory): concerns genus-3-to-genus-3 transfer only, does not touch elliptic curves.'
  - id: REJ-3
    object: OBJ-4
    summary: 'Isogeny-volcano walk to a surface curve with a smaller CM discriminant or extra automorphisms.'
    reason_rejected: >-
      The CM discriminant D = t^2 - 4p is fixed for the entire isogeny
      class (a function of the trace t alone, not of any one
      representative curve), so no walk changes it. This is the identical
      mechanism this goal''s own H-IT-001 already established for
      anomalous/MOV/Weil-descent membership; re-derived here independently
      and found to give the same answer, so not submitted as a new
      candidate (a re-parameterization of already-established prior art,
      named as such rather than presented as new per the commissioning
      brief''s instruction).
  - id: REJ-4
    object: 'H-ENDO-001''s own witness lattice W_r (considered as a possible shortcut, not a distinct proposed object)'
    summary: >-
      Whether LLL / lattice reduction in the FIXED small dimension 2r could
      solve H-ENDO-001''s own lattice W_r in polynomial time (in log N),
      apparently bypassing the need for H-ENDO-001''s own balanced
      meet-in-the-middle search.
    reason_rejected: >-
      Traced through explicitly: constructing W_r''s basis requires the
      coefficients k * lambda_i mod N for the Q-side generators, which
      requires k itself -- the unknown quantity being solved for. This is
      the identical obstruction the classical Boneh-Venkatesan-style
      hidden-number-problem lattice has (you cannot build the lattice
      whose short vector reveals a secret using a basis vector that already
      encodes the secret). No new leverage was found; this sketch is not a
      genuinely new object (it re-derives, rather than evades,
      H-ENDO-001''s own P1-P3 framing) and is not submitted.
  - id: REJ-5
    object: OBJ-5
    summary: 'Cheon-style structured-auxiliary-group speedup using an endomorphism eigenvalue as a pseudo-exponentiation.'
    reason_rejected: >-
      Cheon''s algorithm requires genuine ORACLE ACCESS to a multiplicative
      "raise to the d-th power of the secret exponent" operation; no
      additive analogue exists from ECDLP''s own group operations alone,
      and RQ-CRYPTO-001''s problem statement grants no such oracle.
      Mechanically inapplicable, not merely undesirable.
  - id: REJ-6
    object: OBJ-6
    summary: 'x-only "halving tree" (preimage tree of the doubling map) as an alternative search object.'
    reason_rejected: >-
      Fails the lossy-projection test (docs/inventor-protocol.md section
      2) explicitly: halving is multiplication by 2^{-1} mod N, so the
      object retains the full group structure and discards nothing that
      is not already recoverable via the ordinary group law -- a change of
      coordinates, not a new object.
  - id: REJ-7
    object: 'Quantum resource-optimization results (2026 ECDLP Shor-circuit improvements)'
    summary: >-
      A WebSearch for very recent (2025-2026) ECDLP literature surfaced
      several genuine, recent papers reducing the qubit/gate count for
      Shor''s algorithm against prime-field ECDLP (e.g. eprint 2026/1128,
      eprint 2026/280, and others reducing logical-qubit counts from
      ~2124 toward ~835-1200 for a 256-bit curve).
    reason_rejected: >-
      Out of scope for RQ-CRYPTO-001, which asks about a "reproducible
      NON-GENERIC algorithm" compared against Pollard rho -- a CLASSICAL
      comparison. These are quantum (Shor's-algorithm) circuit-engineering
      results, not classical algorithmic improvements, and do not bear on
      beating rho classically. Logged here as literature scouting per
      agents/idea-generator.md search heuristic 2 ("record candidate
      external results... even when no idea follows immediately") but NOT
      proposed as a candidate and NOT written to knowledge/literature/ by
      this session (outside this task''s write scope; flagged to the
      Coordinator as a possible knowledge/literature/ addition for the
      quantum-track goal, if one exists, rather than performed here).

overlap_audit_against_full_hypothesis_decision_history: >-
  Every hypothesis named in the commissioning brief (H-CREP-001, H-STR-002,
  H-IC-001, H-SUBRES-001, H-ENDO-001) was read in full, not merely by title,
  and CAND-1's object (a second curve/abelian-variety glued to the target to
  form a higher-genus Jacobian, attacked via published index calculus) shares
  NO mechanism, tracked object, or intermediate quantity with any of them --
  see candidate-mechanisms.yaml's per-hypothesis overlap_disposition and
  discriminated_from blocks for the explicit, item-by-item argument required
  by the commissioning brief, rather than a bare assertion of distinctness.
  H-IT-001 (found via this session's own search, not named in the brief) is
  the one genuine TOOL overlap (isogeny/Frobenius invariance), disclosed and
  discriminated on the TARGET FAMILY it is applied to (a fourth family, not
  one of H-IT-001's original three). GOAL-ECTD-001's corpus (found via this
  session's own search) is the one genuine CITATION-FAMILY overlap (Kani's
  construction, Galbraith 2024/2025), disclosed and discriminated on the
  QUESTION and DIMENSION as detailed above.

honest_gaps_in_this_audit: >-
  (1) ledger/goals/GOAL-ECDLP-001/goal.yaml is 942KB of accumulated batch
  history; this session read its head fields in full and used targeted Grep
  passes over the rest rather than a full line-by-line read, per the
  commissioning brief's own guidance ("you do not need to read every
  historical block in full"). A targeted term did not appear in a Grep pass
  is reported as a floor (nothing found matching that term), not as proof
  the underlying idea was never considered under different wording. (2) No
  crypto-kb semantic index was available; Grep is a strictly weaker,
  lexical-only instrument, so semantically related but differently-worded
  prior art could have been missed. (3) The two most load-bearing external
  citations (Gaudry-Thome-Theriault-Diem 2007 and Smith 2008) were each
  checked at abstract/snippet depth via WebSearch/WebFetch, not by reading
  the full papers; Stage 0 of CAND-1's own minimal_test names the full-text
  verification as still outstanding.
