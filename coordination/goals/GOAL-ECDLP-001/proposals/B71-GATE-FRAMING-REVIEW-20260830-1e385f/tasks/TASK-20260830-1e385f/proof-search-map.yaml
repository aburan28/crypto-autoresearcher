bottleneck: >-
  The exact step whose removal would change the claimed cost is
  MATERIALIZING r_R's Theta(B^3)-size coefficient data (or an
  equal-size intermediate) BEFORE any reduction modulo g_I can be applied,
  versus SUBSTITUTING that materialization with an externally supplied
  witness for r_R's or the joint system's ideal/factor structure. The
  argument's conclusion is that every retrieved technique removes this
  bottleneck only by paying one of those two costs, never a third way.

baseline_embedding:
  parameter_slice: >-
    The frozen EXP-CREP-001 route set exactly as specified and already
    executed: 8 named routes x 12 recorded symbolic instances (deck sizes
    B in {2, 3} crossed with 6 strata), plus the 2 calibration fixtures.
    This is the exact old-method boundary the argument claims to
    reproduce: EV-CRYPTO-002's constructor-admission stage-zero screen
    generalized and then machine-checked at toy scale by EXP-CREP-001.
  reproduction_check: >-
    Verified by direct reading of
    experiments/EXP-CREP-001/execution-report.yaml's predicate_matrix
    (not by re-running any computation, since this task is zero-compute):
    all 8 routes FAIL; ROUTE-01/03/04/05/06/07/08 fail first at V3
    (compactness) and also V6 (cost caps), each with declared
    online-materialized target-dependent-coordinates exponent exactly 3
    against a cap of 5/4 -- the "materialization" mode; ROUTE-02 fails
    first at V1 (typed completeness, imports a supplied resultant as an
    oracle node) and is recorded failed_duplicate owner EV-CRYPTO-002 --
    the "witness" mode. Calibration was 2/2 (CAL-PASS passes all of
    V1-V6; CAL-FAIL fails first at V3, also V6) and corpus integrity was
    19/19, so the verdicts count under the run's own frozen rules. This is
    a frozen-fixture reproduction (a specific, already-recorded,
    machine-verified run outcome, quoted exactly), not a resemblance
    claim or an extrapolation.
  audit_result: pass_reproduces_exactly

observation_collision:
  observable: >-
    The classifier "first-failed predicate" (V1 versus V3/V6) used to sort
    every candidate into the "witness" mode or the "materialization" mode.
  distinct_preimage_search: >-
    Searched for two ground-truth objects sharing this observable's
    apparent classification but differing in whether a public sub-cubic
    constructor actually exists. Found one: subproduct-tree / remainder-
    tree evaluation of a polynomial defined as an EXPLICIT product of
    known linear factors, reduced modulo a smaller-degree polynomial. This
    is a real, known, PUBLIC, WITNESS-FREE, quasi-linear-cost technique
    (the same fast-modular-transforms/Borodin-Moenck lineage H-CREP-001
    itself cites as ROUTE-04's own structural ingredient) -- i.e. a case
    on the "constructor exists" side of the conclusion. Applying the
    GENERAL, unscoped form of the proposed dichotomy's reasoning to this
    object would misclassify it as requiring either full materialization
    or a witness, which is FALSE for the general textbook setting (known,
    explicit linear factors). This is a genuine collision: the same
    reasoning pattern, applied to two different objects (P1553's r_R mod
    g_I, and a generic product-of-known-factors mod g), gives an
    INCORRECT verdict on one of them if stated at the general level the
    premises P1-P3 are written at.
  is_the_collision_resolved_by_an_additional_condition: >-
    Yes, and this is exactly the boundary the argument's scope_boundary
    field draws: P2's premise that g_I's roots are FREE PUBLIC data,
    contrasted with r_R's roots/factor structure being NEITHER free NOR
    given, is precisely what would need to hold for the dichotomy to be
    correctly scoped. In the generic remainder-tree setting, ALL of the
    relevant structure (the D known linear factors a_i AND the modulus g)
    is explicit and free; the P1553 asymmetry (g_I's structure free, r_R's
    structure not) is the load-bearing condition that must be checked to
    separate the two cases. This session did check H-CREP-001's own
    definitions for that asymmetry (source-novelty-audit.yaml records this
    as an internal-provenance check), which is why the argument is not
    simply discarded -- but the collision's existence proves the GENERAL
    form (premises stated loosely, without pinning down exactly what makes
    r_R's implicit specification different in kind from "many known
    linear factors") is unsound as an identifiability claim, per the
    inventor protocol's own rule that "a collision is a direct falsifier
    of identifiability unless an additional condition separates it" --
    here an additional condition (P2's asymmetry) is available, but it was
    only checked at the DEFINITIONAL level (what H-CREP-001 states), not
    at the level of actually deriving why the P1553 system's local
    generators fail to telescope the way known linear factors do (see
    method_ceiling below).
  audit_result: collision_found_partially_addressed_by_scope_boundary

quantifier_order: >-
  Explicit statement: for ALL candidate techniques C in the FINITE,
  ENUMERATED set of techniques actually retrieved and read across the four
  literatures searched in rounds seven through thirteen (see
  source-novelty-audit.yaml for the exact list; roughly two dozen named
  candidates C1 through C8-per-round across seven rounds, plus the eight
  frozen EXP-CREP-001 routes), C's instantiation to the frozen P1553
  setting fails via mode (i) [materialization] or mode (ii) [witness].
  This is EXISTENTIAL-NEGATIVE over a finite list, not a UNIVERSAL claim
  over "all possible techniques" or "all future literature." The witness
  the conclusion would need to be false (a passing technique) is
  explicitly allowed to depend on a literature area, mechanism, or
  algebraic structure NOT YET RETRIEVED -- nothing in the thirteen rounds'
  search process forecloses that dependence, and the goal.yaml's own
  standing next_action explicitly preserves this ("if a future session
  identifies a genuinely new, disjoint, promising literature area ... a
  fourteenth trigger-search round remains available"). Any restatement of
  this evidence as "for all POSSIBLE techniques T, T fails" would silently
  convert an existential-negative-over-a-finite-list into a universal
  claim the search process cannot support; this is exactly the
  "haven't-found-one-yet fallacy" the dispatch handoff itself warns
  against, and this record's conclusion and scope_boundary are written to
  avoid making that conversion.

method_ceiling:
  strongest_certifiable_claim: >-
    A scoped, TOY-TIER, machine-verified EMPIRICAL claim: within the
    frozen EXP-CREP-001 route set (8 named routes instantiating the major
    computational-algebra technique families) and the 12 recorded
    symbolic instances, every attempted representation hits exactly one of
    two named predicate failures (V1 for witness-mode, V3/V6 for
    materialization-mode), with zero exceptions, machine-verified with 2/2
    calibration and 19/19 corpus integrity. Combined with the thirteen
    further literature rounds' consistent finding of no third mode among
    retrieved candidates, this is a real, checkable, growing data point.
    No MECHANISM-LEVEL THEOREM (a proof that any technique NOT yet tried
    must also fail) is certifiable from this round's zero-compute
    analysis; asserting one would exceed what a proof-search-map audit
    that has just found and only partially resolved an observation
    collision (above) can support.
  nearby_object_control: >-
    Applied the GENERAL, unscoped form of the proposed dichotomy ("any
    value derived from an implicitly-specified large polynomial requires
    either full materialization or an external witness") to the nearest
    object where the hoped-for conclusion (impossibility of a public
    sub-cubic constructor) is KNOWN FALSE: subproduct-tree/remainder-tree
    reduction of a polynomial defined as an explicit product of known
    linear factors modulo a smaller modulus (recalled classical fact, not
    independently retrieved this session; see
    framing-revisit-analysis.yaml's provenance_caveat). RESULT: the
    general form of the argument INCORRECTLY predicts impossibility there
    too -- CONTROL FAILS for the general form. A correctly narrowed
    version restricted specifically to the P1553 complete-chart system's
    actual local-generator combination structure (why it does NOT
    telescope the way known linear factors do, if indeed it does not) was
    NOT constructed or verified this round: doing so requires an algebraic
    DERIVATION of the P1553 object's own defining equations, which this
    zero-compute review is not positioned to perform, and no prior round
    (seven through thirteen, all literature searches) performed it either.
    EXP-CREP-001's own measurement that ROUTE-04 (multipoint evaluation)
    and ROUTE-07 (subresultant/half-gcd) -- the two routes closest in
    spirit to the nearby-object control -- ALSO cost Theta(B^3) for P1553
    specifically is named here as the concrete anomaly such a derivation
    would need to explain: it is evidence the P1553 instantiation diverges
    from the generic nearby-object case, but it is not itself an
    explanation of WHY.
  audit_result: >-
    control_fails_for_the_general_argument_form; the argument as proposed
    does not survive Section 8 in a form supporting the requested
    structural claim; see framing-revisit-analysis.yaml's "result" block
    for the narrower residual finding that does survive.

