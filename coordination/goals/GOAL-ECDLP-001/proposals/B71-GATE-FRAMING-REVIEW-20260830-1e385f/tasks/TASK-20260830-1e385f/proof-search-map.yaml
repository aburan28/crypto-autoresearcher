    status: named_not_attempted
  - transform: (all other five transforms)
    status: not_selected
    reason: >-
      No other constructive transform (boundary_lift, stronger_invariant,
      telescoping_potential, specialization_pack, observable_fiber) has an
      identifiable prerequisite present in this round's zero-compute
