overall_audit_verdict: >-
  The one proposed structural argument fails audit 2 (observation
  collision) in its general form and consequently fails audit 4's
  proves-too-much control in that same general form. It passes audit 1
  (baseline reproduction is exact and frozen-fixture-verified) and is
  correctly stated under audit 3 (quantifier order is existential-negative
  over a finite list, not universal). Net result: the structural argument
  as originally attempted does NOT clear Section 8 for the strong
  conclusion in the dispatch handoff's phrasing ("must defeat both failure
  modes simultaneously"); the surviving, control-consistent residual is
  the narrower empirical claim recorded in
  framing-revisit-analysis.yaml's result block, which this record's own
  audits directly support.
