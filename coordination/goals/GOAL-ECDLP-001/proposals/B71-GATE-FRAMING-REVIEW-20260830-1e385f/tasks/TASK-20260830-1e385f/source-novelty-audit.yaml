internal_overlap_audit:
  against_thirteen_rounds: >-
    Both proposed critiques in gate-calibration-analysis.yaml (G2's
    referent ambiguity and name-versus-budget gap; G8's family-versus-
    cost-delta gap) operate ONE LEVEL ABOVE every candidate examined in
    rounds seven through thirteen: those rounds test CANDIDATE TECHNIQUES
    against the gate; this review tests the GATE'S OWN TEXT against
    hypothetical techniques constructed specifically to probe wording, a
    question type no round seven through thirteen posed. No duplicate
    finding, no restatement of a closed round's verdict as new. The one
    factual overlap is deliberate and disclosed: CTREX-3 explicitly reuses
    round twelve's own C2 finding (that C2 IS ROUTE-05 and conceded no
    improved cost bound) as the empirical anchor for a hypothetical
    variant of C2 that DOES claim an improved bound -- this is presented
    as a variation ON round twelve's own record, not a new independent
    discovery, and is cited as such.
  against_h_crep_001: >-
    framing-revisit-analysis.yaml's proposed structural argument is built
    directly from H-CREP-001's own stated mechanism and assumptions (its
    premises P1/P2 restate H-CREP-001's mechanism text and round eleven's
    already-accepted CRT finding); no new claim about H-CREP-001's
    correctness or status is made, and the record explicitly recommends
    no status change.
  against_exp_crep_001: >-
    Both analysis records and the proof-search-map treat
    EXP-CREP-001/execution-report.yaml's predicate_matrix as a FROZEN,
    already-recorded empirical fact to reason FROM, never as something
    this review re-executes, re-derives, or contests. No new run, no
    re-verification of the verifier's own correctness, is performed or
    claimed.
  duplicate_id_check: >-
    No IDEA-*, H-*, EXP-*, EV-*, DEC-*, CORR-*, BATCH-*, or B71-* record is
    created by this task (per its constraints); the internal record IDs
    referenced above (H-CREP-001, EXP-CREP-001, EV-CRYPTO-002,
    KN-TECH-005, KN-LIT-011) are all pre-existing and were only read, never
    written or superseded.

