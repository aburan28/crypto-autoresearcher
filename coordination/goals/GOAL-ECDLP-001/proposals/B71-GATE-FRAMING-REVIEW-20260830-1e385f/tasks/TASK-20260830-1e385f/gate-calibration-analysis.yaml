schema: crypto.autoresearch.gate_calibration_analysis.v1
task_id: TASK-20260830-1e385f
goal_id: GOAL-ECDLP-001
proposal_namespace: B71-GATE-FRAMING-REVIEW-20260830-1e385f
role: idea-generator
record_kind: gate_calibration_analysis
question: >-
  Is the frozen pre-admission gate's G2 (no roots, factors, witnesses,
  support tables, or source enumeration) and G8 (already-costed-route
  exclusion) calibrated correctly, or does the wording structurally exclude
  legitimate techniques regardless of merit? This record answers by
  genuinely attempting to construct a counterexample technique that would
  legitimately solve the actual problem (a public, cheap, correct r_R mod
  g_I from E, P, and Q alone) but is wrongly excluded by G2 or G8's current
  wording, rather than re-litigating the thirteen rounds' own candidates.

frozen_gate_text_examined:
  source: >-
    ledger/goals/GOAL-ECDLP-001/goal.yaml, next_action_superseded_20260828_
    standing_directive (verbatim frozen text, unchanged through round
    thirteen), cross-checked against the itemized G1-G8 restatement in
    coordination/goals/GOAL-ECDLP-001/proposals/B71-PREADMISSION-TRIGGER-
    SEARCH-12-20260830-765788/tasks/TASK-20260830-765788/mechanism-card.yaml
    (frozen_gate_items block), which every round seven through thirteen has
    used as the operational item-by-item checklist.
  G2_text: >-
    Before any queue opens it must freeze rings, bases, CRT components,
    interval geometry, public g_I and r_R construction, and an exact
    computation from E, P, and Q without roots, factors, witnesses, support
    tables, or source enumeration.
  G8_text: >-
    Explain why it is not an already-costed norm, resultant, quotient, full
    power-projection, represented-table, or witness-conditioned route.

method_this_round: >-
  Rather than re-running the thirteen rounds' own candidates against the
  gate (which only re-confirms that techniques already screened for
  SUBSTANTIVE cost/witness reasons also happen to fail the gate's wording),
  this round attempted to construct techniques deliberately engineered to
  test the LITERAL WORDING against its evident INTENT: for each candidate,
  it asks whether the technique's actual behaviour (cost, information
  content, target-independence) would satisfy the problem's real
  requirement, and separately whether the gate's literal text would
  classify it as admissible. A gap between those two answers is a
  miscalibration. Three candidates were constructed and evaluated; one
  additional line of attack was considered and rejected as not a genuine
  gap (recorded below for disclosure of real effort).

counterexample_attempts:
  - id: CTREX-1-G2-WHICH-POLYNOMIALS-ROOTS
    name: 'Ambiguous referent of "roots" and "factors" in G2'
    description: >-
      G2 bans an exact computation from E, P, and Q "without roots,
      factors, witnesses, support tables, or source enumeration," naming no
      polynomial. H-CREP-001's own mechanism states that g_I's roots (the
      fifth-occurrence labels) are themselves the PUBLIC, already-known
      problem data: "distinct public fifth-occurrence labels are the roots
      of the squarefree polynomial g_I." A construction cannot even STATE
      what g_I is without referring to those already-public roots; they
      are not a discovered witness, they are part of the public problem
      statement (confirmed independently by round eleven's Coordinator
      finding that g_I splits completely into distinct linear factors over
      the working field at exactly the public labels). By contrast, r_R's
      roots (or the joint complete-chart system's factor/ideal structure)
      are NOT public and recovering them is exactly ECDLP-equivalent
      information -- this is the actual witness G2 is evidently trying to
      exclude, per every round's own use of "G2 circularity" to describe
      candidates that require a Groebner basis or point set for r_R's
      system specifically (rounds seven through thirteen, e.g. round
      twelve's C4 finding).
    would_it_legitimately_solve_the_problem: >-
      A hypothetical technique that (a) freely uses g_I's own already-public
      roots as an interpolation/evaluation basis (zero additional cost,
      since they are given), and (b) never touches r_R's or the joint
      system's roots, factors, or ideal structure, and (c) has a genuinely
      declared sub-Theta(B^3) cost certificate -- would legitimately
      satisfy the stated problem (public, cheap, correct r_R mod g_I from
      E, P, Q alone plus the already-public labels).
    gate_item_at_risk: G2
    literal_wording_verdict: >-
      Ambiguous. A hyper-literal reading of "without roots ... of [any
      polynomial]" would exclude even referring to g_I's own defining
      labels, which is incoherent (g_I cannot be stated without them) and
      would make G2 self-contradictory rather than merely strict. A
      charitable reading resolves the ambiguity correctly (roots/factors of
      r_R or the joint system, not of g_I), but the WORDING itself does not
      say which polynomial is meant, and every round to date has relied on
      the charitable reading being applied correctly by a careful reader
      rather than on the text disambiguating it.
    intent_based_verdict: admissible
    verdict: genuine_wording_ambiguity_not_yet_causing_a_wrong_rejection
    reasoning: >-
      This is not a case where any of the thirteen rounds' candidates were
      actually rejected under the wrong reading (every round's application
      correctly treated g_I's public labels as free and reserved "witness"
      language for r_R's/the system's unknown structure, e.g. round
      eleven's explicit per-root-evaluation analysis). The risk is textual,
      not yet realized: a future reviewer applying G2 mechanically, without
      the same care, could either (a) wrongly reject a legitimate
      construction for merely mentioning g_I's own public labels, or (b)
      wrongly admit a candidate that launders r_R's witness through
      language claiming it only touches "g_I's roots" when the two objects'
      structures are entangled. Both failure directions are live because
      the text does not name which polynomial's roots/factors are excluded.

  - id: CTREX-2-G2-NAME-VS-BUDGET
    name: G2 excludes by artifact NAME rather than by budget or information content
    description: >-
      G2's list ("roots, factors, witnesses, support tables, or source
      enumeration") is a list of ARTIFACT TYPES named by their conventional
      description, not a semantic test. EXP-CREP-001's own frozen verifier
      already has a precise, computable semantic test for exactly what G2
      is trying to approximate: V1 (no untyped oracle node), V2
      (target-independence via the mutation control), V3 (no forbidden
      payload AND declared exponents within the 9/4 / 5/4 caps), and V6
      (cost caps). A hypothetical fast divide-and-conquer construction for
      r_R mod g_I could use, as a purely internal, target-independent,
      fully-budgeted memoization cache of intermediate partial-product
      residues -- built once in preprocessing, costed within the B^(9/4)
      cap, carrying no secret-derived information and passing V1-V3/V6
      exactly -- and a natural-language description of that cache would
      likely be "a support table." Likewise, a legitimate recursive
      algorithm's O(1)-size base case (e.g. "if the sub-problem has at most
      2 sources, enumerate them directly") is a "source enumeration" in
      the plain English sense, yet touches an asymptotically negligible,
      fully-budgeted amount of data.
    would_it_legitimately_solve_the_problem: >-
      Yes by construction in this hypothetical: budgeted, target-
      independent, carries no ECDLP-equivalent information, and its cost
      is exactly what V1/V2/V3/V6 already certify as acceptable.
    gate_item_at_risk: G2
    literal_wording_verdict: >-
      A mechanical, name-matching application of G2 ("does this candidate's
      description contain the words support table or source enumeration?")
      would exclude it. G2 as WORDED gives no threshold or budget carve-out
      for artifacts that are lexically describable by its banned nouns but
      substantively benign and already budget-compliant.
    intent_based_verdict: admissible
    verdict: genuine_miscalibration_risk
    reasoning: >-
      G2 duplicates, in cruder form, a test EXP-CREP-001's own frozen
      verifier already performs precisely (V1/V2/V3/V6 on declared
      exponents and target-independence). Duplicating a precise budget
      test with an imprecise vocabulary test adds a strictly worse failure
      mode: a candidate can be correctly budget-compliant and still be
      screened out at the PRE-admission stage purely because its natural
      description uses one of G2's banned nouns, before it ever reaches a
      cost check. None of the thirteen rounds' candidates were actually
      rejected on this specific ground (their rejections were substantive:
      genuine Theta(B^3) cost or genuine external-witness dependence), so
      this has not yet caused a wrong verdict in practice, but the wording
      gap is real and would bind on a future candidate shaped like this
      hypothetical.

  - id: CTREX-3-G8-FAMILY-VS-COST-DELTA
    name: G8 excludes by route-FAMILY identity rather than by cost-exponent delta
    description: >-
      G8 requires a candidate to "explain why it is not an already-costed
      ... route," i.e. to argue non-identity with a named category
      (norm, resultant, quotient, power-projection, represented-table,
      witness-conditioned). But the actual thing that makes an
      already-tried route a dead end is not its FAMILY MEMBERSHIP, it is
      its MEASURED COST EXPONENT (EXP-CREP-001's own frozen verifier tests
      cost via V3/V6, not family membership). Consider a hypothetical
      future genuine complexity breakthrough in modular composition (the
      Kedlaya-Umans/Brent-Kung backend ROUTE-05 already uses, and an
      actively studied problem: see e.g. the Neiger-Salvy-Schost lineage
      cited in H-CREP-001's own structural_ingredients) that reduces the
      construction's declared online exponent for the P1553 setting below
      the B^(5/4) cap. Such a candidate is, honestly and by construction,
      "a modular-composition constructor" -- the SAME family as ROUTE-05 --
      but with a genuinely new, smaller declared cost.
    would_it_legitimately_solve_the_problem: >-
      Yes by hypothesis: it is public, correct (same construction
      semantics as ROUTE-05, which already passed V1/V2/V4/V5 in
      EXP-CREP-001's actual run -- ROUTE-05's ONLY failures were V3/V6,
      the cost caps), and its declared online cost is within the B^(5/4)
      budget.
    gate_item_at_risk: G8
    literal_wording_verdict: >-
      A literal reading of G8 ("explain why it is not an already-costed
      ... route") asks the candidate to argue it is NOT ROUTE-05. It
      genuinely IS a modular-composition route, so a literal, family-based
      application would find this explanation cannot honestly be given
      and would record the candidate as G8-absent -- exactly the verdict
      round twelve in fact gave to its C2 candidate ("this candidate is
      not merely adjacent to ROUTE-05, it IS ROUTE-05"). Round twelve's C2
      was correctly rejected because it ALSO conceded no improved cost
      bound ("the natural algorithm ... is the frozen setting's own named
      ROUTE-05 bound"); this hypothetical differs only in that it DOES
      claim, and could certify, an improved cost bound, and G8's wording
      does not distinguish the two cases.
    intent_based_verdict: admissible
    verdict: genuine_miscalibration_risk
    reasoning: >-
      G8's own text and every round's own application already show
      sophisticated readers reasoning about cost, not just family label
      (round twelve explicitly checked whether C2 supplied a new cost
      bound before failing it). But the WORDING itself only asks for
      non-identity with a category, which is the wrong question: a
      candidate can be honestly, admittedly IN a named family and still be
      the sought-after trigger, if its cost differs. A future reviewer who
      applies G8 exactly as worded, rather than with round twelve's added
      cost-aware nuance, could reject a genuine improvement at the
      pre-admission stage before its cost certificate is ever examined.
      This is the single highest-value correction identified this round,
      because it is the one gate item whose literal text and whose actual
      (better) practice have visibly diverged already, in round twelve's
      own record.

rejected_attack:
  - id: REJECTED-1
    description: >-
      Considered whether G6 ("yield known P and Q coefficients with
      invertible Q coefficient") could wrongly exclude a valid technique
      operating on a curve model where Q's defining coefficient is not
      literally invertible in the base ring (e.g. a degenerate or
      characteristic-2 model).
    disposition: not_a_genuine_counterexample
    reasoning: >-
      G6 is an input-shape precondition on the frozen problem instance
      (H-CREP-001's assumptions fix "a generic ordinary prime-field
      elliptic curve family"), not a computational-technique exclusion; a
      technique failing only because the frozen instance does not meet G6
      is a mismatch between technique and INSTANCE, not the gate wrongly
      excluding a technique that would solve the actual stated problem. No
      tension with Question 1's target (G2/G8) was found here, and this
      line was dropped rather than padded into the counterexample list.

findings:
  counterexample_found: true
  characterization: >-
    No counterexample was found in which the gate's WORDING has already
    caused a wrong rejection of a technique that in fact would have cheaply
    and correctly solved the problem -- every one of the thirteen rounds'
    actual rejections rests on a substantive failure (genuine Theta(B^3)
    materialization cost or genuine external-witness dependence), not on a
    wording technicality. But this round DID find two genuine, disclosed
    wording-level miscalibration RISKS (CTREX-2 and CTREX-3) and one
    genuine textual AMBIGUITY (CTREX-1) that could cause a wrong rejection
    on a future candidate shaped differently from anything tried so far:
    G2 excludes by artifact NAME rather than by the budget/information-
    content test its own frozen verifier (V1-V3/V6) already performs
    precisely; G8 excludes by route-FAMILY identity rather than by the
    cost-exponent delta that is the only thing that actually matters, a
    gap round twelve's own practice had to informally paper over with
    added reasoning not present in the gate's text; and G2's "roots" ban
    does not disambiguate g_I's own free public roots from r_R's
    ECDLP-equivalent ones. This is a considered finding, not a shrug: real,
    disclosed effort was spent (four candidate lines, one rejected) and it
    surfaces textual gaps between wording and evident intent, without
    finding that intent itself is miscalibrated.

proposed_gate_corrections:
  G2_corrected_wording: >-
    Before any queue opens it must freeze rings, bases, CRT components,
    interval geometry, and the public g_I and r_R construction, and supply
    an exact computation from E, P, and Q that imports no root, factor,
    Groebner basis, or other structural witness OF r_R OR OF THE
    UNDERLYING COMPLETE-CHART INTERSECTION SYSTEM (g_I's own already-public
    defining roots -- the fifth-occurrence labels -- are exempt, since they
    are part of the public problem statement, not a discovered witness);
    any internal data structure, cache, or table used by the construction
    is permitted provided its full construction and storage cost is
    declared and counted within the same B^(9/4) preprocessing / B^(5/4)
    online budget the frozen verifier already checks (V1, V3, V6) -- an
    artifact is excluded by what it COSTS and what SECRET-DERIVED
    information it carries, never by what it is conventionally named.
  G2_newly_admits: >-
    (a) constructions that state or use g_I's own already-public roots as
    part of describing the problem, without being mistaken for importing a
    witness; (b) benign, fully-budgeted internal caches, memoization
    tables, or trivial O(1)/O(polylog B) base-case enumerations that a
    natural-language description would call a "support table" or "source
    enumeration" but that carry no ECDLP-equivalent information and stay
    inside the declared cost caps.
  G8_corrected_wording: >-
    For each already-costed norm, resultant, quotient, full
    power-projection, represented-table, or witness-conditioned route named
    in the frozen route set (EXP-CREP-001), state the candidate's declared
    cost exponent for the same construction step; a candidate sharing a
    route's algorithmic family or backend is excluded under this item ONLY
    IF its own declared cost is dominated by (greater than or equal to)
    that route's already-measured exponent -- sharing a family name is not
    itself disqualifying, and a candidate that independently argues and
    cost-certifies a strictly smaller exponent within an already-named
    family must be evaluated on that certificate under G3/G6, not rejected
    by category alone under G8.
  G8_newly_admits: >-
    A hypothetical future genuine complexity breakthrough within an
    already-named backend family (e.g. a faster modular-composition or
    resultant algorithm reducing the declared exponent below the B^(5/4)
    cap) that the current wording would otherwise auto-reject by category
    before its cost certificate is ever examined.

retroactive_impact_on_prior_rounds: >-
  None. Every one of the thirteen rounds' actual candidate rejections rests
  on a genuine cost failure (Theta(B^3) materialization, matching V3/V6) or
  a genuine external-witness dependence (matching V1 / the G2-circularity
  finding), independently re-derivable under either the current or the
  corrected wording. No prior round's candidate offered an improved cost
  bound within a named family (round twelve's C2 explicitly conceded it
  did not), so G8's family-vs-cost-delta gap was never actually triggered;
  no prior round's candidate was rejected merely for using a lexically
  "support table"-like or "source enumeration"-like artifact that was
  otherwise budget-compliant. This is a forward-looking wording
  clarification recommended for future rounds and future candidates, not a
  request to reopen any of the thirteen closed rounds.

honest_limits: >-
  This analysis is a wording-level audit performed by construction and
  argument, not an exhaustive formal proof that no other wording gap
  exists in G1-G8; G3 through G7 were spot-checked (one rejected attack
  recorded above, on G6) but not subjected to the same three-candidate
  depth of scrutiny as G2 and G8, per the task's explicit focus on the two
  items every near-miss has failed on. A future session focusing on
  G1/G3-G7 individually could surface further wording gaps this session
  did not look for.

novelty_status: unverified
novelty_status_reasoning: >-
  This meta-level critique of the gate's own wording (as distinct from any
  candidate technique) has no precedent found in the thirteen prior
  rounds, which all operate ONE LEVEL DOWN (testing candidate techniques
  against the gate, never testing the gate's text against a hypothetical).
  No external literature search was performed to check whether this
  specific wording-calibration critique has any external analogue (it is
  an internal-process question, not a mathematical one, so no such search
  was attempted); novelty is therefore recorded as unverified rather than
  known, per this program's novelty discipline.
