source_entries:
  # --- Retrieved (fetched and read in this task) ---
  - key: regular_chain_normal_form_gcd
    citation: >-
      arXiv:0903.3690 (Li, Moreno Maza, Pan, Computations modulo regular
      chains); arXiv:1104.0689 (Chen, Moreno Maza, Algorithms for Computing
      Triangular Decompositions of Polynomial Systems).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a normal-form/GCD-modulo-regular-chain construction that could
      serve as a typed public P1553 remainder transducer for r_R mod g_I,
      exploiting the fixed-degree, labelled, complete-chart structure.
    supplied: >-
      Algorithms for polynomial GCDs and regularity tests MODULO AN ALREADY-
      GIVEN regular chain, using modular methods and fast polynomial
      arithmetic; empirically several orders of magnitude faster than Maple/
      Magma. No absolute exponent-in-B complexity claim; no derivation of a
      chain or remainder from E, P, Q without materializing the system first.
    supports: []
    limitations: >-
      Requires the regular chain as explicit input; this is a basis/quotient-
      ring computation modulo an already-given ideal, the same already-costed
      category as ROUTE-02 (quotient-ring resultants) of H-CREP-001's eight
      frozen routes. No P1553 typing, no B^(5/4)/o(ell^(1/2)) enumeration.
  - key: shape_lemma_subresultant_relation
    citation: arXiv:2112.10306 (Cox, D'Andrea, Subresultants and the Shape Lemma).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a Shape Lemma / subresultant relation theorem that could serve
      as a typed public P1553 remainder transducer for r_R mod g_I.
    supplied: >-
      A theorem relating Shape Lemma normal forms to resultant/first-
      subresultant generating sets of a zero-dimensional complete-intersection
      ideal, and a Poisson formula for resultants via the hidden-variable
      method (roots-requiring).
    supports: []
    limitations: >-
      Requires the resultant/subresultant generators (or roots) as already-
      given inputs; a resultant/subresultant-generation question, the same
      already-costed category as round nine's C1 and C2. No P1553 typing, no
      B^(5/4)/o(ell^(1/2)) enumeration.
  - key: triangular_decomposition_complexity
    citation: >-
      arXiv:1002.4784 (Chen, Davenport, May, Moreno Maza, Xia, Xiao,
      Triangular Decomposition of Semi-algebraic Systems); arXiv:1110.6275
      (Tang, Xia, Stability of Triangular Decomposition and Comprehensive
      Triangular Decomposition, WITHDRAWN by author, crucial proof error).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a triangular-decomposition complexity bound that could serve as
      a typed public P1553 remainder transducer or bound its cost.
    supplied: >-
      1002.4784 reports one decomposition variant achieving "singly
      exponential time w.r.t. the number of variables" for semi-algebraic
      systems. 1110.6275 (withdrawn) concerned decomposition stability under
      parameter specialization, not remainder construction.
    supports: []
    limitations: >-
      General real/complex semi-algebraic decomposition complexity, not typed
      to P1553; the singly-exponential bound is far above B^(5/4); subresultant/
      pseudo-division-based, the same already-costed category as round nine's
      C3. 1110.6275 is withdrawn and is recorded as considered-and-declined,
      not used to support any gate item.
  - key: cad_regular_chains_off_target
    citation: arXiv:1405.6090, arXiv:1404.6371, arXiv:1405.6094 (England, Bradford, Chen, Davenport, Moreno Maza, Wilson).
    provenance: retrieved
    opened_in_task: true
    read_for: To check whether CAD-via-regular-chains literature bears on the P1553 remainder question.
    supplied: Cylindrical algebraic decomposition of real semi-algebraic sets using regular chains and variable-ordering heuristics.
    supports: []
    limitations: >-
      Wrong object (real sign-condition partition) and wrong field (reals);
      does not reach r_R mod g_I from E, P, Q under any accounting. Declined
      as off-target.
  - key: noncommutative_shape_lemma_off_target
    citation: arXiv:2502.11787 (Kauers, Koutschan, Verron, A Shape Lemma for Ideals of Differential Operators).
    provenance: retrieved
    opened_in_task: true
    read_for: To check whether the noncommutative shape-lemma extension bears on the P1553 remainder question.
    supplied: Extension of the classical shape lemma to zero-dimensional ideals of noncommutative differential-operator (Weyl-algebra-style) rings, for holonomic function theory.
    supports: []
    limitations: >-
      Wrong ring (noncommutative differential operators, not the P1553
      commutative label polynomial ring); does not address a resultant or a
      remainder modulo g_I. Declined as off-target.
  - key: deck_crt_hines
    citation: arXiv:2206.07412 (Peter M. Hines, The Inverse Semigroup Theory of Elementary Arithmetic).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To check whether an external CRT/mixed-radix normal-form theorem bears
      on the deck-local identity search (component b).
    supplied: >-
      A category-/inverse-semigroup-theoretic account of natural-number
      arithmetic in which composition and normal forms are based on the
      Chinese remainder theorem, connecting polycyclic-monoid normal forms,
      mixed-radix counting systems, and p-adic norms.
    supports: []
    limitations: >-
      Domain is natural-number arithmetic monoids in general (presupposing a
      composite, factorable radix structure), not elliptic curves, discrete
      logs, or generic groups; not typed to the P1553/mixed-radix setting.
      Even granting full transfer, the frozen setting's prime-order group N
      supplies no composite modulus for this theory's CRT normal forms to act
      on, so it does not resolve the prime-N obstruction identified
      internally. Full text (proofs) was not fetched; the abstract alone
      settles the domain mismatch.

