  - url: 'http://export.arxiv.org/api/query?search_query=all:%22normal+form%22+AND+all:%22triangular+set%22&max_results=20'
    read: 0 results.
  - url: 'http://export.arxiv.org/api/query?search_query=all:%22Lazard%22+AND+all:%22regular+chain%22&max_results=20'
    read: 0 results.
  - url: 'http://export.arxiv.org/api/query?search_query=all:%22mixed+radix%22+AND+all:%22Chinese+remainder%22&max_results=20'
    read: >-
      1 result: arXiv:2206.07412 (Peter M. Hines, The Inverse Semigroup Theory
      of Elementary Arithmetic). Abstract statement read: "Composition and
      normal forms within A are based on the Chinese remainder theorem, and a
      minimal generating set corresponds to all prime-order polycyclic
      monoids. This then gives a close connection between Nivat & Perot's
      normal forms for polycyclic monoids, mixed-radix counting systems, and
      p-adic norms & distances."
  - url: 'http://export.arxiv.org/api/query?search_query=all:%22mixed-radix%22+AND+all:%22discrete+logarithm%22&max_results=20'
    read: 0 results.
