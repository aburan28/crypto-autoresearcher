  - url: 'http://export.arxiv.org/api/query?search_query=all:%22regular+chains%22+AND+all:%22normal+form%22&max_results=20'
    read: 0 results.
  - url: 'http://export.arxiv.org/api/query?search_query=all:%22Ritt-Kalkbrener%22&max_results=20'
