provenance_policy: >-
  Every entry is labeled recalled, retrieved, kb, or internal. Retrieved means
  the source was fetched and read in this task (here, arXiv export API query
  responses and arXiv abstract pages via webfetch). kb means the source was
  resolved through grep to a committed knowledge/ or ledger corpus record and
  read. internal means a committed repository record (goal head, dispatch
  queue, frozen elliptic setting packets, prior packets, prior-round trigger
  searches, checkpoint, hypothesis) read in this task. Recalled means no
  source was opened and the entry cannot support a coordinator decision, a
  known/adaptation novelty status, or a mathematical conclusion. No trigger-
  carrying statement in this task rests on a recalled source; every trigger-
  carrying statement rests on a retrieved, kb, or internal object actually
  read.

