  - url: 'http://export.arxiv.org/api/query?search_query=all:%22regular+chain%22+AND+all:%22triangular+decomposition%22&max_results=20'
    read: >-
      7 results, all read at abstract level: arXiv:1110.6275 (Tang-Xia,
      Stability of Triangular Decomposition and Comprehensive Triangular
      Decomposition, WITHDRAWN by author, crucial proof error); arXiv:1002.4784
      (Chen-Davenport-May-Moreno Maza-Xia-Xiao, Triangular Decomposition of
      Semi-algebraic Systems, reports "singly exponential time w.r.t. the
      number of variables" for one decomposition variant); arXiv:1104.0689
      (Chen-Moreno Maza, Algorithms for Computing Triangular Decompositions of
      Polynomial Systems, "a weakened notion of a polynomial GCD modulo a
      regular chain"); arXiv:0903.3690 (Li-Moreno Maza-Pan, Computations
      modulo regular chains); arXiv:1405.6090, arXiv:1404.6371, arXiv:1405.6094
      (England-Bradford-Chen-Davenport-Moreno Maza-Wilson, CAD via regular
      chains, 2014).
  - url: 'http://export.arxiv.org/api/query?search_query=all:%22shape+lemma%22&max_results=20'
    read: >-
      4 results, all read at abstract level: arXiv:2112.10306 (Cox-D'Andrea,
      Subresultants and the Shape Lemma); arXiv:2502.11787 (Kauers-Koutschan-
      Verron, A Shape Lemma for Ideals of Differential Operators);
      arXiv:1205.7087 (Mastrolia-Mirabella-Ossola-Peraro, Scattering
      Amplitudes from Multivariate Polynomial Division, unrelated physics
      application); arXiv:2211.08175 (Buchacher-Kauers, The Orbit-Sum Method
      for Higher Order Equations, unrelated).
  - url: 'https://arxiv.org/abs/2112.10306'
    read: >-
      Full abstract: "In nice cases, a zero-dimensional complete intersection
      ideal over a field of characteristic zero has a Shape Lemma. There are
      also cases where the ideal is generated by the resultant and first
      subresultant polynomials of the generators. This paper explores the
      relation between these representations and studies when the resultant
      generates the elimination ideal. We also prove a Poisson formula for
      resultants arising from the hidden variable method." Accepted in
      Mathematics of Computation; v2 Feb 2023.
  - url: 'http://export.arxiv.org/api/query?id_list=0903.3690'
    read: >-
      Full abstract: "The computation of triangular decompositions are based
      on two fundamental operations: polynomial GCDs modulo regular chains and
      regularity test modulo saturated ideals. We propose new algorithms for
      these core operations relying on modular methods and fast polynomial
      arithmetic... In most cases, our new code outperforms the other packages
      by several orders of magnitude." Authors Xin Li, Marc Moreno Maza, Wei
      Pan; published 2009-03-21.
  - url: 'http://export.arxiv.org/api/query?search_query=all:%22sparse+Groebner+basis%22&max_results=20'
    read: 0 results.
  - url: 'http://export.arxiv.org/api/query?search_query=all:%22sparse+resultant%22+AND+all:%22Groebner%22&max_results=20'
