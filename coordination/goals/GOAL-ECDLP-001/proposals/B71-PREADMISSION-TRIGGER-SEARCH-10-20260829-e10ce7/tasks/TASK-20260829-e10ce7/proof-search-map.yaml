failure_localization:
  - symptom: candidate is only an assertion that a specialized circuit may exist
    localizes_to: L1_NAMED_TRIGGER_OBJECT
    interpretation: not a trigger; G1 fails
  - symptom: candidate's named theorem is withdrawn or carries a known proof gap
    localizes_to: L1_NAMED_TRIGGER_OBJECT
    interpretation: not a stable retrieved theorem; G1 present but weakened (C3's 1110.6275)
  - symptom: requested object's structural precondition (composite modulus, shared ring, multiplicative structure) is absent from the frozen premises
    localizes_to: L1_NAMED_TRIGGER_OBJECT
    interpretation: object does not exist under frozen premises; G1 fails (C6, C7, C8 this round)
  - symptom: candidate cannot be typed into the frozen P1553 setting
    localizes_to: L2_FROZEN_SETTING_TYPING
    interpretation: general object, not a P1553 trigger; G2 fails
  - symptom: candidate requires an excluded input (root, factor, witness, support table, source enumeration) or an already-given polynomial system/chain
    localizes_to: L2_FROZEN_SETTING_TYPING
    interpretation: excluded input or already-materialized system; G2 fails (C1, C2, C3 this round)
  - symptom: any cost axis unbounded, singly exponential, or at/above ell^(1/2)
    localizes_to: L3_FULL_COST_ENUMERATION
    interpretation: no B^(5/4)/o(ell^(1/2)) certificate; G3 fails (C3's singly-exponential bound)
  - symptom: coalesced or nonreduced fibre loses label or multiplicity
    localizes_to: L4_LINEAGE_MULTIPLICITY_FIBRES
    interpretation: G4 fails
  - symptom: output invariant under Q to -Q
    localizes_to: L5_Q_VS_MINUS_Q
    interpretation: sign channel absent; G5 fails
  - symptom: Q coefficient unknown or non-invertible
    localizes_to: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    interpretation: G6 fails
  - symptom: unranking needs full source or support enumeration
    localizes_to: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    interpretation: G7 fails
  - symptom: candidate reduces to a norm/resultant/quotient/basis/power-projection/represented-table/witness-conditioned route
    localizes_to: L8_NOT_ALREADY_COSTED_ROUTE
    interpretation: already-costed route; G8 fails (C1, C2, C3 this round)
  - symptom: candidate accepts a planted non-elliptic common-factor pair
    localizes_to: first purported P1553-structure lemma that fails to distinguish it
    interpretation: proof proves too much (component a nearby-object control)

stopping_rules:
  - Stop before implementation or experiment execution because this role has no approval to run either.
  - Stop admission if any of G1 through G8 remains undisclosed or false for a candidate.
  - Treat crashes, timeouts, missing dependencies, unavailable backends, rate-limited or 503 retrieval endpoints, and 404 full-text fetches as infrastructure outcomes only, never as mathematical evidence.
  - Preserve all untested variants and the coordinate-aware P1553 remainder and dyadic unit-product routes when reporting a scoped failure.
  - A demonstrated structural non-existence within one frozen record's premises (C6, C8 this round) is scoped exactly to that record's frozen premises and is not generalized to a claim about mixed-radix or CRT machinery in general (the method-ceiling composite-order control above shows the same machinery DOES apply outside the frozen prime-N premise).

