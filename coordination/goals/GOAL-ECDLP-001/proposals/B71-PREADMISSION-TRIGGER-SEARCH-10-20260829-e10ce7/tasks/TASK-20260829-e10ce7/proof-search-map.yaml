target_statement:
  informal: >-
    An actual recurrence, circuit identity, or retrieved theorem instantiates
    to the frozen elliptic setting as a typed public P1553 target-local
    remainder transducer for r_R mod g_I or the exact dyadic subinterval
    unit-product interface, and passes every item of the frozen pre-admission
    gate (G1-G8).
  quantifiers: >-
    There exists one named public object T (a recurrence, circuit identity, or
    theorem) and one fully specified public construction rule C such that, for
    the frozen P1553 setting (rings, bases, CRT components, interval geometry,
    public g_I and r_R construction fixed before any witness is observed), C
    computes r_R mod g_I (or the dyadic unit-product step) from E, P, Q alone,
    without roots, factors, witnesses, support tables, or source enumeration;
    the full state/update-map/degree/rank/nonzero/coefficient-growth/live-
    storage/traffic/build-query/amortization enumeration lies within the
    inherited B^(5/4) interface budget and strict end-to-end o(ell^(1/2)) time,
    memory, and data; lineage and multiplicity are preserved on coalesced and
    nonreduced fibres; Q is distinguished from -Q; known P and Q coefficients
    are yielded with invertible Q coefficient; output-sensitive source
    unranking is supported; and T is shown not to be an already-costed norm,
    resultant, quotient, full power-projection, represented-table, or witness-
    conditioned route.
  present_support: none

lemma_decomposition:
  - id: L1_NAMED_TRIGGER_OBJECT
    responsibility: >-
      Name the actual recurrence, circuit identity, or retrieved theorem T,
      with its exact statement and source, and verify it is not merely the
      assertion that a specialized circuit may exist. For component (b), this
      lemma additionally requires establishing that the requested object (a
      CRT-componentwise recurrence, radix-local factorable identity, or
      deck-geometry identity) can exist at all under the frozen premises.
    status: open
    falsifier: >-
      T is only an existence assertion, a heuristic, a withdrawn or
      gap-flagged result, a result whose hypotheses are not met by the frozen
      setting, or (component b) an object whose structural precondition
      (composite modulus, shared ring, multiplicative structure) is absent
      from the frozen premises.
  - id: L2_FROZEN_SETTING_TYPING
    responsibility: >-
      Type T into the frozen P1553 setting: rings, bases, CRT components,
      interval geometry, public g_I and r_R construction, and an exact
      computation from E, P, Q without roots, factors, witnesses, support
      tables, or source enumeration.
    status: open
    falsifier: >-
      Any of the frozen objects is left implicit, or the computation requires
      an excluded input (a root, factor, witness, support table, or source
      enumeration), or (component a) T operates modulo an already-given
      polynomial system rather than deriving one.
  - id: L3_FULL_COST_ENUMERATION
    responsibility: >-
      Enumerate state, update maps, degrees, ranks, nonzeros, coefficient
      growth, live storage, traffic, build/query split, and amortization, and
      bound every axis within the B^(5/4) interface budget and strict
      end-to-end o(ell^(1/2)) time, memory, and data.
    status: open
    falsifier: >-
      Any charged axis is unbounded, at or above ell^(1/2), singly exponential,
      or hidden in soft-O notation.
  - id: L4_LINEAGE_MULTIPLICITY_FIBRES
    responsibility: Preserve lineage and multiplicity on coalesced and nonreduced fibres.
    status: open
    falsifier: A coalesced or nonreduced fibre loses its occurrence label or multiplicity under T.
  - id: L5_Q_VS_MINUS_Q
    responsibility: Distinguish Q from -Q in the transducer output.
    status: open
    falsifier: The output is invariant under Q mapped to -Q with no separately proved orientation channel.
  - id: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    responsibility: Yield known P and Q coefficients with invertible Q coefficient.
    status: open
    falsifier: The Q coefficient is not known a priori or is not invertible on the declared strata.
  - id: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    responsibility: Support output-sensitive source unranking.
    status: open
    falsifier: Unranking requires enumerating the full source or a support table.
  - id: L8_NOT_ALREADY_COSTED_ROUTE
    responsibility: >-
      Show T is not an already-costed norm, resultant, quotient, full power-
      projection, represented-table, or witness-conditioned route; for
      normal-form/regular-chain or CRT machinery specifically, show the
      structured instance is not the already-costed basis/quotient/CRT-
      evaluation route it generalizes.
    status: open
    falsifier: T reduces to one of the excluded already-costed routes, or the structured-instance tension is not resolved in T's favor.

dependency_order:
  - [L1_NAMED_TRIGGER_OBJECT, L2_FROZEN_SETTING_TYPING]
  - [L2_FROZEN_SETTING_TYPING, L3_FULL_COST_ENUMERATION]
  - [L2_FROZEN_SETTING_TYPING, L4_LINEAGE_MULTIPLICITY_FIBRES]
  - [L2_FROZEN_SETTING_TYPING, L5_Q_VS_MINUS_Q]
  - [L2_FROZEN_SETTING_TYPING, L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q]
  - [L2_FROZEN_SETTING_TYPING, L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING]
  - [L1_NAMED_TRIGGER_OBJECT, L8_NOT_ALREADY_COSTED_ROUTE]
  - [L3_FULL_COST_ENUMERATION, L8_NOT_ALREADY_COSTED_ROUTE]

cheap_audits:
  exact_baseline_reproduction:
    applies: true
    baseline: >-
      The frozen gate items G1-G8 read from the live next_action, and the frozen
      elliptic setting (B = N^(1/5), m = 2^ceil(log2 B), C = sum_{i=0}^{4} m^i,
      decks F_0..F_4, target R = Q + [C]P, per-sign-vector intervals
      [A_sigma, A_sigma + m^3 - 1] with exact base-m labelled unranking,
      ell = B^(9/4+o(1)), k = B^(5/4+o(1))) read from the two P1553 mixed-radix
      correction packets, and the g_I/r_R/z_R definitions and eight frozen
      already-costed routes read from H-CREP-001.
    attack_plan:
      - restate each gate item G1-G8 verbatim from the live next_action
      - restate the frozen setting quantities from the two packet.yaml files
      - restate g_I, r_R, z_R and the eight frozen routes from H-CREP-001
      - for each candidate, mark each gate item present (with an optional weakening note) or absent, with a named reason
      - confirm no candidate is admitted by assertion of a possibly existing specialized circuit
    expected_break: >-
      A candidate that carries G1 (an actual recurrence, formula, or theorem)
      but cannot be typed into the frozen setting (G2) or costed within the
      B^(5/4) budget (G3), or that is an already-costed route (G8), or whose
      requested object cannot exist under the frozen premises at all (C6, C8).
    pass_condition: >-
      Every gate item is explicitly present for a candidate, with the exact
      construction and full cost enumeration; otherwise the candidate is
      recorded not intake-ready with its absent items named.
    current_result: >-
      Performed statically. C1 (regular-chain normal-form/GCD), C2 (shape-
      lemma/subresultant relation), and C3 (triangular-decomposition
      complexity) each carry G1 present (named theorems/algorithms) but fail
      G2 (operate modulo an already-given system, not typed to the frozen
      P1553 setting), G3 (no B^(5/4)/o(ell^(1/2)) enumeration; C3's bound is
      singly exponential), and G8 (each an already-costed basis/quotient-ring
      or resultant/subresultant route), and G4-G7. C4-C5 are off-target
      (wrong object/ring). C6-C8 (the internal deck-local candidates) fail
      G1 itself: the requested object cannot exist under the frozen prime-N,
      single-ring, purely-additive premises. No candidate is intake-ready. No
      experiment was run.
  observation_collision_search:
    applies: true
    collision_object: >-
      A retrieved or internal object that is the same observable as a trigger
      already screened in one of the six terminal pre-admission packets, in
      the seventh-, eighth-, or ninth-round candidate sets, or in the B70/
      P1553 mixed-radix packet reviews, i.e. a duplicate that would re-run a
      frozen screen.
    attack_plan:
      - compare each candidate against the six screened families and their scoped negative boundaries
      - compare each candidate against the seventh-, eighth-, and ninth-round candidate sets and record which, if any, is a re-derivation
      - compare each candidate against the B70 derived findings B70-DER-1..7 and the two P1553 mixed-radix packets' own reviews
      - record which candidate, if any, falls inside a screened family
      - check whether any candidate is a new trigger specific to a screened family satisfying the post-screen revisit condition
    expected_break: >-
      A candidate that is actually a re-run of a screened family (SUBRES-
      COFACTOR in particular) or a re-derivation of a seventh-, eighth-, or
      ninth-round candidate, or a re-run of the P1553 mixed-radix packets' own
      additive-generic-interface review question, rather than a new question.
    pass_condition: >-
      No candidate re-runs a frozen screen or re-derives a prior-round
      candidate; any candidate inside a screened family is shown to be a new
      trigger satisfying the revisit condition, or is recorded as a
      non-revisit literature check.
    current_result: >-
      Performed statically. This round does not re-derive the seventh-,
      eighth-, or ninth-round candidate sets; it searches two disjoint places
      (normal-form/regular-chain literature, and an internal-structure
      identity search over the two frozen P1553 mixed-radix packets). C1-C3
      are adjacent to the SUBRES-COFACTOR screened family and to round nine's
      C1-C3 (subresultant/PRS/resultant machinery), recorded as retrieved
      literature checked against the gate, not a re-run. C6-C8 ask a different
      question of the two P1553 mixed-radix packets than their own accepted
      reviews did (those reviews addressed whether an additive generic-
      interface bound holds; this search asks whether the packets' own
      radix structure supplies a CRT/factorable/geometric identity for a
      DIFFERENT object, r_R mod g_I or the dyadic unit-product interface) --
      not a re-run of those reviews. None is a new trigger satisfying the
      revisit condition.
  quantifier_order_statement:
    applies: true
    required_order:
      - freeze the P1553 rings, bases, CRT components, and interval geometry
      - fix the public g_I and r_R construction
      - name the trigger object T (recurrence, circuit identity, or theorem)
      - receive public E, P, Q
      - compute r_R mod g_I (or the dyadic unit-product step) from E, P, Q alone
      - enumerate the full cost and verify the B^(5/4)/o(ell^(1/2)) bounds
      - verify lineage/multiplicity, Q vs -Q, invertible Q coefficient, and source unranking
    forbidden_order: >-
      Observe a root, factor, witness, support table, or source enumeration
      first and then choose T, the rings, the bases, or the g_I/r_R
      construction; or select T after seeing where a target-dependent
      remainder is large; or assume a composite-modulus/ring-bridge/
      multiplicative structure that the frozen setting does not fix before
      naming T.
    expected_break: >-
      A candidate whose typing into the frozen setting requires an excluded
      input, moving witness-equivalent work into the constructor, or (C6-C8)
      requires structure absent from the frozen premises.
    pass_condition: >-
      All frozen objects are fixed before any witness is observed, and T is
      chosen from public data alone.
    current_result: >-
      Statement only, checked per candidate. C1-C5's general objects
      (regular chain, generators, roots, real system, differential ideal) are
      fixed independently of the witness, but none types the frozen P1553
      objects before a witness is observed, because none reaches r_R mod g_I
      from E, P, Q. C6-C8 do not reach this stage: the object C6/C8 asks for
      does not exist under the frozen premises (prime N; purely additive
      interface), and C7's requested ring bridge is undefined, so no
      quantifier order can even be posed for them.
  method_ceiling_nearby_object_control:
    applies: true
    nearby_object: >-
      For component (a): a degree- or genus-matched non-elliptic analogue --
      an arbitrary pair of univariate polynomials (degree-matched to g_I and
      r_R) with a planted common factor, for which the conclusion that a
      P1553 target-local remainder transducer recovers an elliptic scalar
      witness is known false. For component (b): a composite-order generic
      group G' = <P'> of order N' = p_1 p_2 (two known small coprime factors)
      with the identical mixed-radix deck construction, for which a genuine
      CRT-componentwise recurrence WOULD exist (Pohlig-Hellman-style), used as
      a positive control to confirm the negative finding is specific to the
      frozen prime-N premise and not an error in the search method.
    attack_plan:
      - apply the identical candidate recurrence/identity/theorem to the planted non-elliptic polynomial pair (component a)
      - apply the same C6 CRT-componentwise-recurrence question to the composite-order positive control (component b)
      - prohibit use of curve-law facts absent from the claimed lemmas
      - identify the first lemma that distinguishes the genuine P1553/frozen-prime-N object from the control
      - reject the argument if it still returns a P1553 witness certificate on the planted pair, or accept the recurrence if the composite-order control genuinely supplies one (confirming the search correctly localizes the obstruction to primality, not to the search method)
    expected_break: >-
      Component (a): a sparse-resultant/normal-form/triangular-decomposition
      argument based only on general polynomial structure proves too much and
      accepts the planted non-elliptic pair. Component (b): the composite-
      order control DOES admit a CRT-componentwise recurrence (via
      Pohlig-Hellman on the known coprime factors), confirming that the
      round's finding is specifically about the frozen PRIME-order premise and
      not a general claim that mixed-radix decks never admit CRT recurrences.
    pass_condition: >-
      A named P1553-structure lemma rejects the nearby object before witness
      recovery (component a), while the composite-order control is correctly
      accepted (component b), confirming the obstruction is exactly localized
      to primality rather than to an error in the search.
    current_result: >-
      Not run as an experiment (no experiment authorized). Stated analytically:
      component (a) candidates are general polynomial/intersection results
      with no P1553-structure lemma, so each would accept the planted
      non-elliptic pair -- consistent with scoped_no_candidate. Component (b):
      the composite-order control is consistent with standard Pohlig-Hellman
      reduction (a well-known, already-costed generic-group technique) and
      WOULD admit a CRT-componentwise recurrence there, which is exactly why
      this search records the frozen setting's primality, not an inherent
      impossibility of mixed-radix CRT recurrences, as the operative
      obstruction. No computation was executed; this is a stated control, not
      a run result.

