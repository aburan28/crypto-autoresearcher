  disjoint_scope_statement: >-
    This round's scope is explicitly disjoint from rounds seven, eight, and
    nine. Round seven performed abstract-level arXiv searches over
    subresultant/PRS recurrences, modular-composition circuits, fast-remainder/
    Kedlaya-Umans fast arithmetic, Semaev/Weil-descent index calculus,
    combinatorial unranking, and transposed/multipoint evaluation. Round eight
    read the withdrawn round-seven near-miss in full text, ran an internal-corpus
    pointer audit, and searched function-field/algebraic-geometry/transfer-
    theoretic circuit identities. Round nine searched structured, sparse,
    triangular, and black-box resultant computation and explicit intersection-
    theoretic computation (Canny-Emiris/mixed-subdivision sparse-resultant
    theory, the classical Poisson product formula, and Wu/Ritt triangular
    decomposition as a RESULTANT-COMPUTATION route -- i.e. computing the
    resultant/subresultant of an already-given system), plus an internal-corpus
    resource-check pass. None of those areas is re-run here. This round deepens
    or extends in two disjoint ways: (1) it performs bounded network retrieval
    over normal-form computation for triangular structures -- Lazard regular
    chains, Ritt-Kalkbrener normal forms, normal-form complexity bounds, and
    shape-lemma / sparse Groebner-basis degree bounds -- asking not "can the
    resultant of this system be computed" (round nine's question, answered no)
    but "does the normal-form REDUCTION step itself, applied to a complete-
    chart-style triangular structure, yield a public r_R mod g_I constructor
    within the B^(5/4) budget" (a distinct question about reducing an object
    modulo a chain/ideal rather than computing the chain's resultant); and (2)
    it performs an internal-structure identity search over the frozen deck/
    interval geometry of the two P1553 mixed-radix correction packets
    themselves (not the round-nine resultant literature, and not a re-run of
    the B70/P1553-packet reviews), asking whether the restriction operator's
    base-m digit recurrence, taken as a CRT-style componentwise recurrence, a
    radix-locally factorable remainder identity, or a deck-geometry identity,
    supplies a public transducer. The seventh-, eighth-, and ninth-round
    candidate sets are the earlier rounds'; this round does not re-derive them.
