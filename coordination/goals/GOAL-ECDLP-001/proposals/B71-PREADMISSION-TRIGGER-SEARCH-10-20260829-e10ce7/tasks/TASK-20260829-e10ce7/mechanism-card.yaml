trigger_shapes:
  shape_a_remainder_transducer: >-
    A typed public P1553 target-local remainder transducer for r_R mod g_I: an
    exact computation, from E, P, and Q alone, of the remainder of the
    complete-chart intersection resultant r_R upon division by the squarefree
    label polynomial g_I, with no roots, factors, witnesses, support tables, or
    source enumeration, inside the B^(5/4) interface budget.
  shape_b_dyadic_unit_product: >-
    The exact dyadic subinterval unit-product interface: a public construction
    over the frozen mixed-radix deck/interval geometry (per-sign-vector
    intervals [A_sigma, A_sigma + m^3 - 1] with exact base-m labelled
    unranking) that supplies the unit-product step the two-restriction and
    three-deck corrections leave as the surviving coordinate-aware interface.

scope_components:
  component_a_normal_form_regular_chain_literature:
    what_was_searched: >-
      Bounded network retrieval (webfetch, arXiv export API) over normal-form
      computation for triangular structures -- Lazard regular chains,
      Ritt-Kalkbrener normal forms, normal-form complexity bounds, and
      shape-lemma / sparse Groebner-basis degree bounds -- aimed at a public
      r_R mod g_I normal-form/remainder constructor exploiting the fixed-
      degree, labelled, complete-chart structure without importing the
      Theta(B^3) represented payload, source advice, or scalar orientation.
    searches_performed:
      - query: 'all:"regular chains" AND all:"normal form"'
        instrument: webfetch arXiv export API
        results: 0
      - query: 'all:"Ritt-Kalkbrener"'
        instrument: webfetch arXiv export API
        results: 0
      - query: 'all:"regular chain" AND all:"triangular decomposition"'
        instrument: webfetch arXiv export API
        results: 7 (all read at abstract level)
      - query: 'all:"shape lemma"'
        instrument: webfetch arXiv export API
        results: 4 (all read at abstract level)
      - query: 'all:"sparse Groebner basis"'
        instrument: webfetch arXiv export API
        results: 0
      - query: 'all:"sparse resultant" AND all:"Groebner"'
        instrument: webfetch arXiv export API
        results: 0
      - query: 'all:"normal form" AND all:"triangular set"'
        instrument: webfetch arXiv export API
        results: 0
      - query: 'all:"Lazard" AND all:"regular chain"'
        instrument: webfetch arXiv export API
        results: 0
      - query: 'abstract fetch of arXiv:2112.10306 (Subresultants and the Shape Lemma)'
        instrument: webfetch arxiv.org/abs page
        results: 1 (full abstract read)
      - query: 'abstract fetch of arXiv:0903.3690 (Computations modulo regular chains)'
        instrument: webfetch arXiv export API id_list lookup
        results: 1 (full abstract read)
    objects_read:
      - id: REGULAR_CHAIN_NORMAL_FORM_GCD
        name: >-
          Computations modulo regular chains (Li, Moreno Maza, Pan,
          arXiv:0903.3690); Algorithms for Computing Triangular Decompositions
          of Polynomial Systems (Chen, Moreno Maza, arXiv:1104.0689).
        source_refs:
          - arXiv:0903.3690 (Li-Moreno Maza-Pan, Computations modulo regular chains)
          - arXiv:1104.0689 (Chen-Moreno Maza, Algorithms for Computing Triangular Decompositions of Polynomial Systems)
        assessment: >-
          These compute polynomial GCDs modulo an ALREADY-GIVEN regular chain
          and a regularity test modulo the associated saturated ideal, using
          modular methods and fast polynomial arithmetic; the incremental
          decomposition algorithm uses "a weakened notion of a polynomial GCD
          modulo a regular chain." Both require the polynomial system (the
          chain itself) as explicit input; neither derives a chain or a normal
          form from E, P, Q without first materializing the system, which for
          the P1553 setting is exactly the excluded Theta(B^3) represented
          payload. This is a basis/quotient-ring computation modulo an
          already-given ideal, structurally the same category as the
          already-costed "quotient-ring resultants" route (one of H-CREP-001's
          eight frozen routes, EV-CRYPTO-002). G1 present, G2-G8 absent.
      - id: SHAPE_LEMMA_SUBRESULTANT_RELATION
        name: >-
          Subresultants and the Shape Lemma (Cox, D'Andrea, arXiv:2112.10306).
        source_refs:
          - arXiv:2112.10306 (Cox-D'Andrea, Subresultants and the Shape Lemma)
        assessment: >-
          Full abstract: "In nice cases, a zero-dimensional complete
          intersection ideal over a field of characteristic zero has a Shape
          Lemma. There are also cases where the ideal is generated by the
          resultant and first subresultant polynomials of the generators. This
          paper explores the relation between these representations and
          studies when the resultant generates the elimination ideal. We also
          prove a Poisson formula for resultants arising from the hidden
          variable method." This studies WHEN a Shape Lemma normal form and a
          resultant/subresultant generating set coincide for an
          already-specified complete-intersection ideal; it does not construct
          r_R from E, P, Q, requires the resultant/subresultant polynomials (or
          their generators) as already-given inputs, and the Poisson-formula
          component requires roots (the same excluded-input failure as round
          nine's C2). G1 present, G2 absent (requires already-given generators
          and/or roots), G8 absent (a resultant/subresultant-generation
          question, the same already-costed category round nine's C1-C3
          occupy).
      - id: TRIANGULAR_DECOMPOSITION_NORMAL_FORM_COMPLEXITY
        name: >-
          Triangular Decomposition of Semi-algebraic Systems (Chen, Davenport,
          May, Moreno Maza, Xia, Xiao, arXiv:1002.4784); Stability of
          Triangular Decomposition and Comprehensive Triangular Decomposition
          (Tang, Xia, arXiv:1110.6275, WITHDRAWN by author, crucial proof
          error).
        source_refs:
          - arXiv:1002.4784 (Chen-Davenport-May-Moreno Maza-Xia-Xiao)
          - arXiv:1110.6275 (Tang-Xia, withdrawn)
        assessment: >-
          1002.4784 decomposes semi-algebraic systems into regular
          semi-algebraic systems and reports that one decomposition variant
          achieves "singly exponential time w.r.t. the number of variables" --
          a general worst-case complexity claim, not typed to the P1553 setting
          and far above the B^(5/4) budget (singly exponential in the number of
          variables dominates any fixed polynomial exponent in B for growing
          instance size). 1110.6275 is withdrawn for a crucial proof error and
          concerns decomposition STABILITY under parameter specialization, not
          a remainder construction; it is recorded and declined rather than
          used as a trigger source, consistent with round eight's treatment of
          a withdrawn near-miss. G1 present but weakened for 1110.6275
          (withdrawn); G2 absent for both (general real/complex
          semi-algebraic decomposition, not typed to P1553); G3 absent
          (singly exponential exceeds B^(5/4)); G8 absent (subresultant/
          pseudo-division-based triangular decomposition, the same
          already-costed category as round nine's C3).
      - id: CAD_REGULAR_CHAINS_OFF_TARGET
        name: >-
          Cylindrical algebraic decomposition (CAD) via regular chains
          (England, Bradford, Chen, Davenport, Moreno Maza, Wilson;
          arXiv:1405.6090, 1404.6371, 1405.6094).
        source_refs:
          - arXiv:1405.6090
          - arXiv:1404.6371
          - arXiv:1405.6094
        assessment: >-
          These construct cylindrical algebraic decompositions of REAL
          semi-algebraic sets (sign-condition partitions over R) using regular
          chains technology and variable-ordering heuristics. This is a
          different mathematical object entirely: it partitions real space by
          sign conditions, not a remainder of a resultant modulo a squarefree
          label polynomial over the P1553 label ring, and it operates over the
          reals, not the finite-field/algebraic setting of g_I and r_R.
          Declined at abstract level as off-target rather than false: G1
          present (named algorithm), G2 absent (wrong object and wrong field),
          G8 not applicable in the resultant sense but the candidate does not
          reach r_R mod g_I from E, P, Q under any accounting.
      - id: NONCOMMUTATIVE_SHAPE_LEMMA_OFF_TARGET
        name: >-
          A Shape Lemma for Ideals of Differential Operators (Kauers,
          Koutschan, Verron, arXiv:2502.11787).
        source_refs:
          - arXiv:2502.11787
        assessment: >-
          Extends the classical shape lemma to zero-dimensional ideals of
          NONCOMMUTATIVE differential-operator rings (Weyl-algebra-style),
          for applications in holonomic function theory. Not typed to the
          P1553 commutative label-polynomial ring, does not address a
          resultant or a remainder modulo g_I, and introduces noncommutativity
          absent from the frozen setting. Declined at abstract level as
          off-target. G1 present, G2 absent (wrong ring), G8 not applicable in
          the resultant sense but the candidate does not reach r_R mod g_I.
    what_it_supplied: >-
      No relevant trigger. Searches for the literal terms "Lazard"+"regular
      chain", "regular chains"+"normal form", "Ritt-Kalkbrener", "normal
      form"+"triangular set", and "sparse Groebner basis" each returned zero
      arXiv results (the export API answered these queries directly this
      round, with no rate-limiting observed). The seven regular-chain/
      triangular-decomposition hits and the four shape-lemma hits that WERE
      retrieved all compute a normal form, GCD, or resultant/subresultant
      generating set from an ALREADY-GIVEN polynomial system or ideal (the
      chain, the generators, or the roots); none constructs r_R from E, P, Q
      without first materializing the P1553 system, none is typed to the
      P1553 complete-chart structure, none computes a remainder modulo the
      squarefree label polynomial g_I from public curve data alone, and none
      operates within the B^(5/4) budget. Normal-form reduction modulo an
      already-given regular chain is, for this program's purposes, the same
      already-costed basis/quotient-ring category as ROUTE-02 of H-CREP-001's
      eight frozen routes: the difficulty was never reducing r_R once it is
      known, it is deriving r_R (or its residue mod g_I) compactly in the
      first place, and none of the retrieved normal-form literature supplies
      that derivation.
  component_b_deck_local_mixed_radix_identity_search:
    what_was_searched: >-
      An internal-structure identity search over the frozen deck/interval
      geometry of the two P1553 mixed-radix correction packets themselves
      (P1553-MIXED-RADIX-TWO-RESTRICTION-CORRECTION-20260827-0fbb54 and
      P1553-MIXED-RADIX-THREE-DECK-CORRECTION-20260825-55000d), asking whether
      the restriction operator's base-m digit structure supplies (i) a
      CRT-componentwise recurrence, (ii) a radix-locally factorable remainder
      identity, or (iii) a deck-geometry identity, that yields a public r_R mod
      g_I transducer or the exact dyadic subinterval unit-product interface.
      Targeted network retrieval (webfetch, arXiv export API) was performed
      where it bears on the question; knowledge/, the B70 checkpoint, and the
      two packets were re-read as the resource-check pass.
    searches_performed:
      - query: 'all:"mixed radix" AND all:"Chinese remainder"'
        instrument: webfetch arXiv export API
        results: 1 (read; see DECK_CRT_HINES below)
      - query: 'all:"mixed-radix" AND all:"discrete logarithm"'
        instrument: webfetch arXiv export API
        results: 0
      - query: 'abstract fetch of arXiv:2206.07412'
        instrument: webfetch arxiv.org/abs page
        results: 1 (abstract read)
    internal_structural_facts_established:
      - fact: >-
          Both packets fix G = <P> as a PRIME-order cyclic group (order N
          prime). A Chinese Remainder Theorem decomposition requires a
          COMPOSITE modulus with pairwise-coprime factors; a prime modulus
          admits no nontrivial CRT splitting. The "mixed radix" in these
          packets denotes a base-m POSITIONAL digit expansion of a bounded
          integer offset (t in [0, m^3) for the two-restriction correction, or
          x in [0, N) for the five-digit base-m witness), which is an ordinary
          place-value number system over Z, not a Chinese Remainder
          combination of coprime moduli. No CRT-componentwise recurrence can
          exist in this setting because the structural precondition for one
          (a composite, factorable modulus) is absent by the packets' own
          frozen premise (N prime).
        supports: [C6_DECK_CRT_COMPONENTWISE_RECURRENCE gate discharge]
      - fact: >-
          The P1553 object g_I lives in a distinct ring from the mixed-radix
          decks' base m: g_I is a squarefree polynomial over the label
          polynomial ring (roots = distinct public fifth-occurrence labels of
          the complete-chart Semaev-style construction, per H-CREP-001), while
          m is an integer radix used only to represent bounded SCALAR
          exponents (elements of Z, consumed as [.]P coefficients) in the
          mixed-radix deck packets. No map between these two rings is defined,
          derived, or even gestured at anywhere in either P1553 mixed-radix
          correction packet; the two objects arose in unrelated proof-repair
          threads (an additive generic-group preprocessing bound versus a
          complete-chart intersection-resultant support factor). A
          "radix-locally factorable remainder identity" bridging m-adic digits
          of a scalar to residues of a polynomial modulo g_I would require an
          explicit ring homomorphism or encoding that no frozen record
          supplies.
        supports: [C7_DECK_RADIX_LOCAL_FACTORABLE_REMAINDER gate discharge]
      - fact: >-
          The base-m digit decomposition of the residual scalar t (t = sigma_2
          a + m sigma_3 b + m^2 sigma_4 c, uniquely with a,b,c in [1,m], or the
          five-digit x = sum a_i m^i) is already the exact identity used by the
          accepted two-restriction and three-deck corrections to build the
          per-sign-vector interval [A_sigma, A_sigma + m^3 - 1] and its
          unranking r = r_0 + m r_1 + m^2 r_2 (interval solver) or the F3/F4
          dictionary join (three-deck solver). There is no unexploited digit
          recurrence left over: splitting the single linear Diophantine
          identity t = sigma_2 a + m sigma_3 b + m^2 sigma_4 c into
          independent per-digit "unit products" solvable without already
          knowing t is precisely the ECDLP-equivalent witness recovery the
          interface is required to avoid importing (G2's exclusion of roots,
          factors, and witnesses); the digits are linked additively through
          one unknown integer, not through independent residues modulo
          coprime factors, so there is no factorization to exploit.
        supports: [C6_DECK_CRT_COMPONENTWISE_RECURRENCE, C7_DECK_RADIX_LOCAL_FACTORABLE_REMAINDER gate discharge]
      - fact: >-
          Both packets state the group law entirely ADDITIVELY ("[.]P",
          "R = Q + [C]P", "H = R - e_0 - e_1"); neither packet defines,
          derives, or references a pairing, a multiplicative embedding into an
          extension-field unit group, or any other structure under which
          interval membership could be recast as a PRODUCT of units. A
          "deck-geometry identity" supplying a unit-product test would require
          importing such an embedding (e.g. a Weil/Tate pairing or an
          index-calculus-style multiplicative encoding) from outside the
          frozen additive setting; this is exactly "the assertion that a
          specialized circuit may exist" that G1 excludes as a non-trigger,
          not an actual recurrence present in the frozen records. Introducing
          a pairing generically would also open a different, already-studied
          attack family (pairing/Weil-descent reductions), not a "recurrence
          of the restriction operator."
        supports: [C8_DECK_GEOMETRY_IDENTITY_UNIT_PRODUCT gate discharge]
    objects_read:
      - id: DECK_CRT_HINES
        name: The Inverse Semigroup Theory of Elementary Arithmetic (Hines, arXiv:2206.07412)
        source_refs: [arXiv:2206.07412]
        assessment: >-
          Full abstract statement read: "Composition and normal forms within A
          are based on the Chinese remainder theorem, and a minimal generating
          set corresponds to all prime-order polycyclic monoids. This then
          gives a close connection between Nivat & Perot's normal forms for
          polycyclic monoids, mixed-radix counting systems, and p-adic norms &
          distances." This is a category-/inverse-semigroup-theoretic account
          of natural-number arithmetic (addition and multiplication as
          monotone injections in an inverse monoid); its CRT normal forms
          presuppose a COMPOSITE, factorable radix structure of natural-number
          representations in general, not a fixed base-m expansion of one
          bounded scalar offset inside a prime-order group. It is not typed to
          elliptic curves, discrete logarithms, or generic groups, and does
          not address remainder computation modulo a squarefree label
          polynomial. Even granting full transfer, the same prime-N
          obstruction applies: nothing in this theory supplies a componentwise
          recurrence when the ambient group order N is prime. G1 present
          (an actual retrieved theorem), G2 absent (wrong domain: natural-
          number arithmetic monoids, not the P1553/mixed-radix elliptic
          setting; requires composite-radix structure absent here).
    resource_check_answer:
      examined: true
      reading_found: false
      what_was_examined: >-
        Both P1553 mixed-radix correction packets (packet.yaml and the
        TASK-20260826-1572a7 proof-theorem.yaml) re-read in full for the exact
        deck/restriction-operator/interval definitions; the B70 checkpoint
        (BATCH-4e7dcf.yaml, B70-DER-1..7) re-read for the mixed-radix operator
        product and leaf-descent findings; knowledge/ grepped for
        "mixed-radix", "mixed radix", and "CRT recurrence" (zero matches) and
        for "P1553", "complete-chart", "g_I", "r_R" (zero matches, confirming
        round nine's finding that the P1553 object lives only in the ledger,
        not knowledge/); the reachable ledger records for H-CREP-001 and the
        eight frozen construction routes.
      answer: >-
        None found. No theorem, bound, or correspondence in the corpus or the
        two frozen packets supplies a CRT-componentwise recurrence, a
        radix-locally factorable remainder identity, or a deck-geometry
        unit-product identity for the fixed prime-order mixed-radix deck
        structure. The absence has a named structural cause in each of the
        three named avenues (see internal_structural_facts_established above),
        not merely an unsearched gap.
    lossy_projection_test: >-
      Per the inventor protocol's lossy-projection test (applied here as due
      diligence though no experiment is proposed): the natural tracked object
      for a CRT-style recurrence would be "the base-m digit t_i of the
      residual scalar, tracked modulo a small auxiliary radix." This
      projection is lossy (it discards all digits but one), but what it
      discards is NOT discarded compatibly with the group's arithmetic: under
      a prime-order group there is no coprime-modulus structure for which
      "t mod (small factor)" propagates deterministically through the additive
      group law independently of the other digits, because there is no
      factorization of N to anchor such a projection to. The projection
      therefore fails the lossy-projection test at the object-definition
      stage, before any construction or cost question arises -- the object is
      either lossless (it is just "the digit itself", a change of coordinates
      already used by the accepted interval solver) or it is not well-defined
      as a deterministic projection at all.
    what_it_supplied: >-
      No candidate supplied a typed trigger. The internal-structure search
      establishes, with a named structural cause for each of the three
      requested avenues (CRT componentwise recurrence: no composite modulus to
      decompose; radix-locally factorable remainder identity: no ring map
      between the label polynomial ring of g_I and the integer radix m;
      deck-geometry unit-product identity: no multiplicative/pairing structure
      exists in the frozen additive setting), that this specific bridge
      (mixed-radix deck structure to P1553 remainder transducer or dyadic
      unit-product interface) is not available under the frozen premises. This
      is a scoped absence over the exact frozen mixed-radix setting, not a
      claim about any differently-structured or future correction to that
      setting.

