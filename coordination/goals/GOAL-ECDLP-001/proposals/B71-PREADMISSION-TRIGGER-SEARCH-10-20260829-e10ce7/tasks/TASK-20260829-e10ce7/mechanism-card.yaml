research_question: >-
  Does any actual recurrence, circuit identity, or retrieved theorem, in exactly
  two earlier-round-disjoint places, instantiate to the frozen elliptic setting
  as (a) a typed public P1553 target-local remainder transducer for r_R mod g_I,
  or (b) the exact dyadic subinterval unit-product interface, passing every item
  of the frozen pre-admission gate? The two places are: (1) the literature on
  normal-form computation for triangular structures (Lazard regular chains,
  Ritt-Kalkbrener normal forms, normal-form complexity bounds, shape-lemma and
  sparse Groebner-basis degree bounds), which rounds seven, eight, and nine did
  not search as normal-form/remainder computation (round nine's C3 searched
  triangular decomposition strictly as resultant computation and failed as an
  already-costed route); and (2) the frozen CRT/mixed-radix setting itself (the
  P1553-MIXED-RADIX-TWO-RESTRICTION-CORRECTION-20260827-0fbb54 and
  P1553-MIXED-RADIX-THREE-DECK-CORRECTION-20260825-55000d packets), asking
  whether radix-specific recurrences of the restriction operator on the fixed
  deck supply a public remainder transducer or the exact dyadic subinterval
  unit-product interface.

