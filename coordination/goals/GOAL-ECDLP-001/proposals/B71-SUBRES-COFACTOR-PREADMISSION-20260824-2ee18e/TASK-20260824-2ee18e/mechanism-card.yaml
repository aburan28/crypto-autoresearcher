statement:
  candidate: signed_subresultant_cofactor_separator
  question: >-
    Can two publicly constructed branch circuits from one fixed summation-polynomial
    tree be joined by a finite fraction-free subresultant sequence whose first
    informative Bezout cofactors form a signed, replayable, strict-sub-rho
    separator for an ordinary public elliptic-curve target?
  answer: >-
    Not on the supplied record. The polynomial identity U_j L_Q + V_j R = S_j
    is classical and finite once L_Q and R are already frozen, but the record
    does not supply an oracle-free public construction of those circuits, a
    uniform low-width realization of every required subresultant and cofactor,
    a rule separating genuine compatible branches from multiplicity and
    extraneous components, or a deterministic signed replay to a verified
    scalar. No positive gate is met.
  boundary: >-
    This is one formula-level, zero-run pre-admission result. It does not settle
    subresultants, resultants, summation-polynomial methods, circuit-native gcd
    methods, structured or transposed constructions, batched or extension-field
    variants, or multi-target variants.
research_activity:
  commands_run: 0
  experiments_run: 0
  implementations_created: 0
  external_retrievals: 0
  status_changes: 0
  identifiers_allocated: 0
object:
  public_input:
    curve: "ordinary elliptic curve E over F_q"
    generator: "P in E(F_q) of prime order ell"
    target: "Q = [w]P with unknown w in Z/ell Z"
  proposed_tree:
    state: not_frozen
    required_form: >-
      One fixed binary or explicitly arity-bounded summation-polynomial tree,
      including every leaf domain, internal elimination variable, edge map,
      and the point at which Q enters.
    missing: >-
      No exact arity, topology, leaf family, internal-variable ordering, or
      public construction algorithm is specified.
  branch_polynomials:
    notation:
      left: "L_Q(z)"
      right: "R(z)"
      separator_variable: z
    coefficient_ring: not_frozen
    basis: not_frozen
    degree_bounds: not_derived
    characteristic_restrictions: not_derived
    denominator_restrictions: not_derived
    exceptional_strata: not_enumerated
    public_constructor: not_supplied
  prohibited_dependencies:
    - hidden scalar w
    - a root or compatible witness supplied in advance
    - subset, support, or witness enumeration
    - factor, gcd, cofactor, or target-advice oracle
    - dense resultant or quotient materialization
    - unnamed fast polynomial-remainder machinery
mechanism_delta:
  baseline_interface: >-
    Earlier records exposed conditional occurrence moments and split-root
    identities, but not a typed public evaluator, traffic-aware circuit, or
    oriented replay. The present candidate asks whether subresultant Bezout
    cofactors can carry the missing orientation without materializing a dense
    resultant.
  proposed_delta: >-
    Retain U_j and V_j, rather than only a gcd degree or principal coefficient,
    at the first publicly determined informative subresultant index. Attempt to
    use the ordered pair of cofactors as a branch-sensitive transcript that can
    be recompressed and replayed through the frozen tree.
  delivered_delta: >-
    Only the prospective identity and the obligations it would have to meet are
    stated. No public construction, transcript encoding, replay map, or
    asymptotic realization is delivered.
displayed_algebra:
  frozen_input_assumption: >-
    Suppose, only for stating the algebraic interface, that A(z)=L_Q(z) and
    B(z)=R(z) are nonzero polynomials over a specified coefficient domain D.
  fraction_free_sequence: >-
    A finite fraction-free polynomial remainder or subresultant sequence
    S_m, S_{m-1}, ..., S_0 can be defined from A and B after degrees,
    normalization, content handling, and exceptional leading coefficients are
    fixed.
  bezout_identity: "U_i(z) A(z) + V_i(z) B(z) = S_i(z)"
  principal_coefficients: >-
    Principal subresultant coefficients can expose gcd-degree strata in a
    squarefree generic setting, but repeated factors, vanished leading terms,
    specialization, and extraneous summation-polynomial components require
    separate typed strata.
  prospective_index_rule: >-
    A future construction would need a deterministic rule choosing j from
    public principal-coefficient data while proving that the rule does not
    select a multiplicity-only or extraneous component and does not depend on
    a hidden compatible root.
  current_limit: >-
    The identity is true for arbitrary polynomial pairs, including planted
    non-elliptic common-root pairs. It therefore cannot by itself certify an
    elliptic witness or its sign.
algebra_or_cofactor_audit:
  fixed_tree_and_rings:
    satisfied: false
    reason: >-
      The tree, rings, bases, degree bounds, characteristic restrictions,
      denominators, exceptional strata, and public circuit constructors are
      absent.
  finite_oracle_free_identity:
    satisfied: false
    reason: >-
      The generic Bezout identity is finite, but normalization, content,
      specialization, informative-index selection, and a proof distinguishing
      compatible from multiplicity or extraneous components are not supplied.
  uniform_circuit_realization:
    satisfied: false
    reason: >-
      No uniform streaming or low-width circuit is given for the full sequence
      and both cofactors; dimensions, ranks, nonzeros, coefficient growth,
      storage, and traffic are unbounded on this record.
  orientation_content:
    satisfied: false
    reason: >-
      Bezout pairs are normalization-dependent and can change by syzygies. No
      invariant normalization is shown to preserve Q versus -Q information.
  replay_content:
    satisfied: false
    reason: >-
      No map sends a recompressed cofactor transcript through the tree to leaf
      choices and then to a scalar whose multiplication by P verifies Q.
  cost_content:
    satisfied: false
    reason: >-
      Branch construction, sequence generation, coefficient representation,
      exceptional strata, recompression, replay, and verification have no
      end-to-end bound.
signed_witness_replay:
  required_input: >-
    A public transcript consisting of the normalized informative index,
    principal coefficients, and a bounded representation of U_j,V_j,S_j.
  required_steps:
    - publicly identify the genuine compatible component
    - map the ordered cofactor transcript to oriented choices at every tree edge
    - recover all leaf contributions without search over subsets or supports
    - combine the leaves into a scalar candidate modulo ell
    - verify the candidate by checking scalar multiplication against Q
    - reject the sign-reversed transcript unless it separately verifies Q
  supplied_steps: []
  sign_test:
    status: absent
    required: >-
      On the same public curve and point P, the transcript response for Q must
      differ predictably from that for -Q, and replay must select the scalar
      verifying the requested target rather than merely an unoriented x-value.
  syzygy_risk: >-
    If U,V is one Bezout pair, transformations by polynomial syzygies can leave
    U A + V B unchanged. A future certificate must specify a canonical
    normalization and prove that orientation survives it and subsequent
    recompression.
predictions_if_future:
  - id: P1
    prediction: >-
      On squarefree compatible tiny instances, all three exact constructions
      produce the same normalized subresultant sequence, principal coefficients,
      and Bezout identity.
  - id: P2
    prediction: >-
      Increasing a controlled repeated-factor multiplicity changes the declared
      principal-coefficient stratum and cofactor normalization exactly as the
      symbolic degree law predicts.
  - id: P3
    prediction: >-
      Degree- and Hilbert-matched random branch pairs with no common root do not
      emit a replayable transcript, while planted non-elliptic common-root pairs
      may emit a gcd transcript but must fail elliptic replay.
  - id: P4
    prediction: >-
      Replacing one summation-polynomial edge by a shape-identical broken edge
      destroys elliptic replay even when generic polynomial common-root
      behavior remains matched.
  - id: P5
    prediction: >-
      Q and -Q produce predictably distinct canonical transcripts, and only the
      correctly oriented scalar verifies against the requested target.
  - id: P6
    prediction: >-
      Measured degree, width, coefficient growth, live storage, and traffic
      follow the preregistered formulas as tree size and multiplicity vary.
cost_model:
  comparison_scale: "sqrt(ell) group operations for generic Pollard rho"
  required_result: >-
    Expected time, peak memory, data, and query complexity must each be strict
    o(sqrt(ell)), with q and ell typed consistently and with success probability
    and amplification included.
  mandatory_terms:
    - public construction of L_Q and R
    - coefficient generation and representation
    - fraction-free sequence and all Bezout cofactors used
    - every characteristic, denominator, and multiplicity stratum
    - transcript recompression and storage
    - signed replay through the entire tree
    - scalar verification
    - sparse linear algebra if invoked
    - preprocessing and multi-target amortization if invoked
    - inverse success probability and amplification
  available_bounds: none
  largest_unresolved_term: >-
    The public construction and representation size of the branch circuits is
    not bounded; therefore even the input size to the proposed subresultant
    stage is unknown.
  rho_comparison_completed: false
heuristics:
  used_for_disposition: false
  items: []
  note: >-
    No heuristic rank, sparsity, mixing, genericity, or independence premise is
    promoted into an admission argument.
controls:
  exact_three_way_equivalence:
    required: true
    performed: false
    branches:
      - independent circuit-native fraction-free sequence
      - explicit Sylvester and subresultant matrices
      - direct gcd and Bezout computation
    instance_classes:
      - tiny squarefree compatible branches
      - tiny repeated-factor compatible branches
      - characteristic or leading-coefficient exceptional strata
  orientation:
    required: true
    performed: false
    comparisons:
      - Q versus -Q on the same E and P
      - successful replay versus x-only or sign-ambiguous detector
  null_objects:
    required: true
    performed: false
    cases:
      - degree- and Hilbert-matched random branches with no common root
      - degree-matched branches with a planted non-elliptic common z
      - shape-identical tree with one broken summation-polynomial edge
  parameter_response:
    required: true
    performed: false
    variation:
      - factor multiplicity
      - branch degree
      - tree depth and arity
    demand: >-
      Every declared principal-coefficient, degree, width, storage, and traffic
      response must track its preregistered formula.
falsification:
  positive_candidate_fails_if:
    - >-
      Public construction of either branch needs support, subset, or witness
      enumeration on the rho scale, or requires information equivalent to the
      hidden scalar.
    - >-
      Sequence degree, circuit width, coefficient growth, live storage, or
      traffic reaches the rho scale after all branches and strata are counted.
    - >-
      Multiplicity or extraneous components dominate the informative-index rule.
    - >-
      The canonical cofactor transcript is invariant under target sign or cannot
      be replayed to a verifying scalar.
    - >-
      The proposed replay manufactures an elliptic witness on a matched planted
      non-elliptic common-root control.
  current_disposition_trigger: >-
    All six positive gates lack at least one required construction, proof,
    control, or bound, so the only admissible result is scoped_no_admission.
