schema_version: "1.0"
record_kind: proof_search_map
task_id: TASK-20260824-2ee18e
goal_id: GOAL-ECDLP-001
result_count: 1
disposition: scoped_no_admission
claim_ceiling: unverified_zero_run_formula_level_signed_subresultant_cofactor_separator_or_exact_declared_construction_scoped_counterexample_only
source_access_mode: parent_relay
candidate:
  name: signed_subresultant_cofactor_separator
  form: >-
    For publicly constructed branch polynomials A=L_Q and B=R from one fixed
    summation-polynomial tree, retain normalized Bezout cofactors at the first
    informative subresultant index and attempt deterministic signed replay to a
    scalar verifying Q.
  present_state: formula_level_only
scope:
  public_input: "ordinary E/F_q, P of prime order ell, and Q=[w]P"
  separator_variable: z
  activity: zero_run_symbolic_preadmission
  excluded:
    - hidden witness, scalar, root, factor, gcd, or cofactor advice
    - subset, support, branch, or witness enumeration
    - dense resultant or quotient materialization
    - unnamed fast polynomial arithmetic
    - any claim beyond the exact declared ceiling
bottleneck:
  primary: >-
    The algebraic Bezout identity begins only after A and B exist, while the
    record has neither an oracle-free public construction with bounded size nor
    a canonical cofactor normalization that carries orientation through
    recompression and replay.
  secondary:
    - >-
      Principal-coefficient patterns can reflect multiplicity, specialization,
      or extraneous components rather than a genuine compatible elliptic branch.
    - >-
      Full-sequence and cofactor degree, width, coefficient growth, storage, and
      traffic are not bounded.
    - >-
      No all-resource expected-cost formula includes constructor work, strata,
      success probability, replay, and verification.
baseline_embedding:
  classical_reproduction:
    target: >-
      Derive the signed fraction-free subresultant sequence and normalized
      Bezout identities over an explicitly stated coefficient domain, including
      content, units, leading-coefficient vanishing, and repeated-factor strata.
    current: not_performed
    reason: >-
      Only the generic identity U_i A + V_i B = S_i is available; it is
      insufficient to determine a uniform informative index or elliptic meaning.
  prior_interface_reproduction:
    target: >-
      Embed the earlier conditional occurrence-moment interface into the exact
      fixed tree, then identify where the proposed cofactor transcript supplies
      evaluator typing, traffic, and replay that the earlier interface lacked.
    current: not_performed
    reason: No fixed tree, evaluator, or transcript map is supplied.
  exact_baseline_question: >-
    Does the proposed argument prove more than ordinary polynomial common-root
    detection, and if so which typed lemma connects its cofactor transcript to
    an oriented elliptic witness?
  answer: No connecting lemma is present.
typed_algebra_audit:
  coefficient_domain:
    required: true
    supplied: false
    obligations:
      - base field and any polynomial coefficient extensions
      - unit and content convention
      - denominator-free normalization
      - characteristic exclusions and exceptional strata
  tree_and_circuits:
    required: true
    supplied: false
    obligations:
      - fixed topology and arity
      - leaf and internal variable ordering
      - public target insertion
      - bases and degree bounds for every wire
      - oracle-free constructor for L_Q and R
  sequence:
    required: true
    supplied: false
    obligations:
      - finite recurrence with every scaling factor
      - principal subresultant coefficients
      - Bezout cofactor recurrence
      - informative-index rule
      - repeated-factor and specialization handling
  elliptic_semantics:
    required: true
    supplied: false
    obligations:
      - compatible-component criterion
      - exclusion of extraneous components
      - canonical sign-sensitive normalization
      - deterministic replay to a scalar
      - independent scalar-multiplication verification
observation_collision:
  search_required: true
  performed: false
  collision_families:
    - name: same_principal_coefficients_different_root_semantics
      construction: >-
        Seek two branch pairs with the same principal-coefficient pattern but
        with one common root elliptically compatible and the other extraneous.
      consequence: >-
        A detector using only the coefficient pattern cannot select the genuine
        component.
    - name: same_normalized_cofactor_summary_opposite_target_sign
      construction: >-
        Compare the canonicalized summaries for Q and -Q after eliminating
        y-sign information in otherwise shape-identical trees.
      consequence: >-
        Equality would falsify signed replay from that summary.
    - name: same_gcd_degree_different_multiplicity
      construction: >-
        Pair squarefree and repeated-factor branches with matched gcd degree but
        distinct scheme structure.
      consequence: >-
        A degree-only informative-index rule confounds multiplicity with a
        compatible branch.
    - name: same_common_root_non_elliptic_provenance
      construction: >-
        Plant a common z in degree- and Hilbert-matched random branches that do
        not arise from a valid summation-polynomial edge.
      consequence: >-
        Any elliptic replay produced on this object proves too much.
  acceptance_condition: >-
    A future proposal must either distinguish each collision by a publicly
    computed transcript field with a proof, or narrow its claim so the collision
    lies outside a precisely testable domain.
quantifier_order:
  required_statement: >-
    For every allowed ordinary public instance (E,P,Q) and every declared
    characteristic and exceptional stratum, a fixed algorithm using only that
    public instance first constructs the tree, L_Q, and R within declared
    resource bounds; it then constructs a canonical subresultant/cofactor
    transcript; conditioned only on a stated public success event, replay
    returns a scalar candidate whose multiplication by P is checked against Q.
  forbidden_reversal: >-
    There exists a compatible witness, root, factor, branch, or support from
    which one can choose L_Q, R, an informative index, or a cofactor pair.
  audit_result: failed_missing_constructor
  explanation: >-
    The current formulation assumes the branch polynomials for the algebraic
    identity and never gives the public-before-witness construction.
constructive_transforms:
  required:
    - transform: public_instance_to_fixed_tree
      status: absent
      proof_need: Total, typed construction with no hidden witness-dependent choice.
    - transform: fixed_tree_to_branch_circuits
      status: absent
      proof_need: Degree, basis, width, nonzero, coefficient, storage, and traffic bounds.
    - transform: branch_circuits_to_fraction_free_sequence
      status: absent
      proof_need: Finite recurrence with all normalization and exceptional strata.
    - transform: sequence_to_canonical_cofactor_transcript
      status: absent
      proof_need: Syzygy-invariant or uniquely normalized bounded representation.
    - transform: transcript_to_oriented_tree_replay
      status: absent
      proof_need: Deterministic edge-by-edge recovery distinguishing target sign.
    - transform: replay_to_verified_scalar
      status: absent
      proof_need: Correct scalar combination modulo ell and independent check against Q.
    - transform: construction_to_end_to_end_cost
      status: absent
      proof_need: Expected all-resource accounting including success amplification.
method_ceiling:
  nearby_object:
    name: planted_non_elliptic_common_root
    construction: >-
      Choose degree- and Hilbert-matched polynomial branches with a planted
      common z but provenance deliberately disconnected from one valid tree edge.
    common_root_statement: true_by_construction
    elliptic_replay_statement: known_false_by_construction
  proves_too_much_control:
    required: true
    performed: false
    failure_condition: >-
      If the same subresultant/cofactor argument returns a purported elliptic
      witness on the nearby object, its missing step is the provenance-to-replay
      implication rather than polynomial common-root detection.
  ceiling_statement: >-
    Without a typed provenance and replay lemma, the method ceiling is a
    certificate of polynomial common-root structure, not a certificate of an
    oriented elliptic discrete-log witness.
  other_nearby_objects:
    - degree-matched random branches with no common root
    - repeated-factor branches with matched gcd degree
    - shape-identical tree with one invalid edge relation
separate_obligations:
  size:
    statement: >-
      Bound degrees, dimensions, width, ranks, nonzeros, coefficient growth,
      live storage, and traffic for construction of both branch circuits and
      every retained sequence/cofactor object.
    status: open
  runtime:
    statement: >-
      Bound public construction, fraction-free processing, stratum handling,
      recompression, replay, and verification, and multiply per-attempt cost by
      inverse success probability.
    status: open
  correctness:
    statement: >-
      Prove the selected component is genuine, the transcript normalization is
      canonical, replay is edge-consistent, and scalar verification accepts
      exactly the requested target.
    status: open
  success_probability:
    statement: >-
      State the sample space and success event independently of a hidden witness;
      bound failure on generic and exceptional strata and include amplification.
    status: open
  orientation:
    statement: >-
      Prove a predictable transcript distinction between Q and -Q survives all
      eliminations, syzygy normalization, and recompression.
    status: open
  control_equivalence:
    statement: >-
      Prove independent agreement among circuit-native fraction-free processing,
      explicit Sylvester/subresultant matrices, and direct gcd/Bezout on frozen
      squarefree, repeated, and exceptional instances.
    status: open
proof_obligations:
  - id: O1
    obligation: Freeze one public tree, coefficient domains, bases, degrees, restrictions, and strata.
    discharged: false
  - id: O2
    obligation: Construct L_Q and R from public input with no witness, support, subset, or oracle advice.
    discharged: false
  - id: O3
    obligation: Give the complete fraction-free recurrence and Bezout cofactors with canonical normalization.
    discharged: false
  - id: O4
    obligation: Prove the informative-index rule rejects multiplicity-only and extraneous components.
    discharged: false
  - id: O5
    obligation: Give a uniform circuit or streaming DAG and exact all-intermediate resource formulas.
    discharged: false
  - id: O6
    obligation: Prove recompression retains the fields needed for signed edge-by-edge replay.
    discharged: false
  - id: O7
    obligation: Prove replay distinguishes Q from -Q and yields a scalar verified against Q.
    discharged: false
  - id: O8
    obligation: Establish three-way exact agreement on all declared tiny-instance strata and nulls.
    discharged: false
  - id: O9
    obligation: Bound expected time, memory, data, and queries strictly below the rho scale end to end.
    discharged: false
  - id: O10
    obligation: Pass the planted non-elliptic common-root proves-too-much control.
    discharged: false
falsification_conditions:
  constructor:
    - branch support or construction reaches the rho scale
    - construction requires hidden-witness-equivalent information
  algebra:
    - principal coefficients cannot distinguish genuine from multiplicity or extraneous components
    - coefficient or degree growth reaches the rho scale
    - a required denominator or leading coefficient vanishes on an unhandled stratum
  realization:
    - width, live storage, traffic, or recompression reaches the rho scale
    - dense support, resultant, or quotient materialization is required
  replay:
    - transcript is invariant under Q versus -Q
    - canonicalization discards the orientation field
    - replay requires branch or support enumeration
    - replay emits an elliptic witness on the planted non-elliptic common-root control
  cost:
    - any one of expected time, memory, data, or queries is not strict sub-rho
    - the advantage relies on excluding constructor, strata, amplification, or verification cost
controls:
  algebraic_baselines:
    performed: false
    required:
      - circuit-native fraction-free sequence
      - explicit Sylvester and subresultant matrices
      - independent direct gcd and Bezout
  instance_matrix:
    performed: false
    required:
      - squarefree compatible
      - repeated-factor compatible
      - leading-coefficient or characteristic exceptional
      - matched random with no common root
      - planted non-elliptic common root
      - shape-identical broken tree edge
      - Q and -Q target pair
  parameter_sweeps:
    performed: false
    required:
      - multiplicity
      - branch degree
      - tree depth and arity
    response_rule: >-
      The observed principal-coefficient strata, degrees, widths, coefficient
      growth, storage, and traffic must follow preregistered exact predictions.
conclusion:
  disposition: scoped_no_admission
  claim_ceiling: unverified_zero_run_formula_level_signed_subresultant_cofactor_separator_or_exact_declared_construction_scoped_counterexample_only
  reason: >-
    The candidate has a meaningful algebraic interface but none of the six
    conjunctive positive gates is fully instantiated. In particular, the
    public-before-witness constructor and the provenance-to-signed-replay lemma
    are absent, so the generic Bezout identity cannot be promoted into an
    elliptic witness mechanism.
  preserved_open_space:
    - structured and fraction-free subresultant constructions
    - alternative canonical Bezout and syzygy normal forms
    - jet-sensitive, transposed, and circuit-native gcd methods
    - characteristic-specific exceptional-stratum methods
    - batched, extension-field, and multi-target variants
  does_not_establish:
    - an attack or speedup
    - novelty
    - a negative theorem for any broader method family
    - a breakthrough
citations:
  - provenance: internal
    reference: parent-relayed committed handoff and predecessor interface summaries
    supports: exact gates, controls, quantifier boundary, and known interface gaps
  - provenance: recalled
    reference: classical subresultant, Sylvester-matrix, and Bezout identities
    supports: literature pointer only; not evidentiary support for novelty or admission
