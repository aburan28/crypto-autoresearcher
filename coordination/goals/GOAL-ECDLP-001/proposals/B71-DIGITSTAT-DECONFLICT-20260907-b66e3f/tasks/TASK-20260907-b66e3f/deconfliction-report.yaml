  questions:
    Q1:
      question: >-
        Is EXP-ECDLP-a98ea9's measured quantity genuinely distinct from
        EXP-ECDLP-56ee42, or the same observable under a different name?
      verdict: distinct
      recommended_reading: >-
        Distinct tracked object, shared estimator family. Paying twice for one
        measurement would require treating p-adic lift digits as binary
        F_p-coordinate digits. They are not the same map.
      a98ea9_observable:
        source: experiments/EXP-ECDLP-a98ea9/specification.yaml
        provenance: internal
        quantity: >-
          ADV(v, n, s, r) = q_maj(v) - 1/s for ordinary base-p digits of the
          canonical prime-to-p lift at precision r in {1,2,3,4}, minus the
          matched-s x-bucket comparator, plus the k-free transport agreement
          rate.
        blocking_gates:
          - k-free Hensel-plus-projection transport
          - NULL-2 wrong lift without the order-n projection
          - T5 D1 valuation calibration
          - curve-free multiplicative arm
      exp56ee42_observable:
        source: experiments/EXP-ECDLP-56ee42/specification.yaml
        provenance: internal
        quantity: >-
          A(v) and q_maj - 1/2 for balanced Thue-Morse and Rudin-Shapiro
          BINARY digit signs of the integer representative of x(R) in [0, p)
          on the frozen 17-27 bit prime-order ladder.
        blocking_gates:
          - spectral-norm vacuity derivation
          - matched-marginal shuffle
          - discrete-log parity planted positive
          - Thue-Morse of the discrete log
      shared:
        - majority-advantage estimator family from IDEA-20260815-f558e4
        - toy complete-enumeration band
        - x-coordinate comparator as an r = 1 / interval shadow
      not_shared:
        - p-adic lift versus binary F_p representative
        - precision axis r
        - transport lemma as a procedure
        - NULL-2 order-n projection strip
        - D1 valuation known-answer
      already_covered_by_56ee42_run: >-
        Stages 0-2 of EXP-ECDLP-56ee42 exist and calibrate the BINARY-digit
        instrument and the sibling x-bucket fixture. They do not tabulate
        base-p digits of a Hensel lift, do not run the k-free transport, and
        do not run NULL-2. Quantitatively, the p-adic r>1 cells of a98ea9
        have zero coverage from 56ee42. The r = 1 x-bucket fixture is the
        only overlapping pipeline check and is already declared as such in
        a98ea9.
      exp3930b1_note: >-
        EXP-ECDLP-3930b1 measures the same BINARY Thue-Morse / Rudin-Shapiro
        family as EXP-ECDLP-56ee42, with a planted ladder and a computed
        spectral-norm stage. That is the same question 56ee42 is already
        approved and partly run to answer. Q1 for 3930b1 versus 56ee42 is
        duplicative.

    Q2:
      question: >-
        Is the IDEA-20260901-b4e6eb to H-ECDLP-07c7c6 conversion faithful?
      verdict: faithful_with_disclosed_tightenings
      detail: >-
        The hypothesis preserves the frozen setting, the transport procedure,
        claims (A)-(D), the declared T1-T5 ladder, the two-branch 0.01/0.05
        rule, NULL-1, NULL-2, the x-bucket comparator, the D1 calibration,
        Control C, and the interpretation limits including the r(n) gap.
        Coordinator tightenings in the design note are additive, not
        substitutions: planted-advantage ladder, multiplicative-group arm,
        and honest 16-26 bit band instead of 'up to about 30 bits'.
      drift_named:
        - field: goal_id
          proposal: bound to RQ-ECDLP-002 under GOAL-ECDLP-001
          hypothesis: 'goal_id: null'
          action: bind to GOAL-ECDLP-001 in this successor
        - field: duplicate_keys
          hypothesis: status and proposed_by appear twice at the top of the file
          action: leave historical bytes; last-key YAML reading is specified
        - field: observable_convention
          proposal: ordinary digits implied, Witt and character not named
          later_finding: DEC-20260904-4f0f52
          action: freeze ordinary-digit versus Witt versus character on a98ea9
      missing_from_hypothesis_present_in_proposal: []
      added_by_design_not_in_proposal:
        - planted-advantage ladder at four known effect sizes
        - curve-free multiplicative arm with pre-declared consequence
        - field-size cap at 26 bits for the 16 GB envelope

    Q3:
      question: >-
        Should EXP-ECDLP-a98ea9 be approved, revised, or dropped?
      recommended_disposition: revise_then_approve
      ground: >-
        The tracked object is distinct (Q1), the conversion is faithful (Q2),
        the protocol already has controls, metrics, budget, stopping rules,
        and artifacts, and the goal next_action ranks this admission first.
        DEC-20260904-4f0f52 recorded that computability does not imply
        bounded degree or a character-bound transfer, and that ordinary
        digits, Witt coordinates, and a primitive character are three
        observables. That is a protocol-completeness revision, not a reason
        to drop. Standing user authorization of 2026-09-06 covers approval
        of the completed frozen contract. EXP-ECDLP-3930b1 should not be
        approved; it is duplicative of the live 56ee42 contract.
      not_dropped_because: >-
        A drop would treat the p-adic lift family as already measured by
        binary F_p digit signs. That would be the exact double-count Q1
        forbids in the other direction.

    Q4:
      question: >-
        Where does CAND-D2-A, the degree audit, sit relative to the cluster?
      recommended_ordering: complementary_do_not_dispatch_before_a98ea9_freeze
      relation:
        to_a98ea9: >-
          Upstream of the statistical TRANSPORT claim (proposal claim D).
          a98ea9 measures whether the degree gap is consequential on the
          declared ladder. CAND-D2-A would bound deg(Phi_r,T). They are not
          the same measurement.
        to_56ee42: >-
          Complementary. 56ee42's pinning failure is a spectral-norm theorem
          for BINARY digits. CAND-D2-A is about algebraic degree of the
          p-adic transport.
        to_3930b1: not applicable if 3930b1 stays unapproved
        already_done: >-
          DEC-20260904-4f0f52 admitted a precision-two representation audit.
          DEC-20260904-697887 is an unpublished local composition and is NOT
          used as durable evidence here. The cheap high-agreement bound
          failure recorded in DEC-20260903-e9dad9 remains the reason not to
          re-attempt that cheap bound.
      do_not_dispatch_until: >-
        EXP-ECDLP-a98ea9 is frozen and snapshot-archived. Budget must not be
        double-committed to the same degree-gap question.

  recommended_disposition:
    IDEA-20260901-b4e6eb: admit_as_source_of_H-ECDLP-07c7c6_and_EXP-ECDLP-a98ea9
    H-ECDLP-07c7c6: specified
    EXP-ECDLP-a98ea9: revise_observable_convention_then_approve
    EXP-ECDLP-3930b1: do_not_approve_duplicative_of_EXP-ECDLP-56ee42
    EXP-ECDLP-56ee42: unchanged_approved_do_not_rerun
    CAND-D2-A: hold_until_a98ea9_is_frozen_then_rerank

