  prior_art_finding_recorded_against_the_handoff:
    id: PA-1
    severity: material
    statement: >-
      The handoff names KN-OPEN-002 -- the growth of the Groebner solving degree
      for prime-field summation-polynomial systems -- as this goal's single live
      unbounded quantity and its strongest seed. This corpus already holds
      KN-LIT-4558 (Yokoyama, Yasuda, Takahashi, Kogure, J. Math. Cryptol. 14
      (2020) 460-485, doi 10.1515/jmc-2019-0029) whose relayed abstract states
      that the ideal derived from the point decomposition problem has a special
      structure making Groebner basis computation an extension of the extended
      Euclidean algorithm, that this yields a LOWER BOUND on that computation's
      cost, and that with the bound they PROVE that Semaev's naive index calculus
      method cannot be more efficient than generic methods. KN-OPEN-002's
      source_refs are KN-LIT-005, KN-LIT-010 and KN-TECH-004 -- KN-LIT-4558 is
      NOT among them.
    what_this_does_and_does_not_mean: >-
      It does NOT establish that KN-OPEN-002 is closed. KN-LIT-4558's own
      frontmatter records that the entry was generated in a 2026-07-24 bulk
      seeding pass from the PDF's first two pages, that fields were parsed
      heuristically, that claims are relayed without independent verification,
      and that it should be upgraded after a careful read. The bound is also
      conditional on simple statistical assumptions on summation polynomials, is
      stated for the NAIVE method, and is a GROEBNER-cost bound -- McGuire and
      Mueller's algorithm explicitly avoids Groebner computation entirely, so the
      bound does not cover the whole lane. What it does mean is that the flagship
      open quantity of this goal may already be substantially answered by an
      unread paper sitting in this program's own literature shelf, and that no
      ideation or costing session should treat the quantity as untouched until
      someone reads it.
    handled_how_in_this_session: >-
      NOT filed as a proposal, because a proposal whose core is "read this paper
      properly" is citation-coverage work and the handoff excludes that class
      without exception. Instead it is (a) recorded here, (b) recorded as a
      pre-registration step inside IDEA-20260904-a195ff part (D), where the
      extraction supplies one predicted curve for one arm and the experiment runs
      and concludes without it if the extraction fails, and (c) recommended below
      as a Coordinator-commissioned literature note.
    recommended_action_for_the_coordinator: >-
      Commission a literature task to read the local copy at
      knowledge/downloads/complexity-bounds-on-semaev-s-naive-index-calculus-method-1f7yzrgu06.pdf,
      supersede KN-LIT-4558 with a verified entry stating the exact bound, its
      hypotheses and its parameter regime, and then decide whether KN-OPEN-002's
      statement needs superseding. This is not idea-generator work and no such
      record was created here.

  per_proposal:
    - id: IDEA-20260904-d84512
      short_name: >-
        advice length under a charged decompression time; the non-generic
        preprocessing frontier
      nearest_existing_open_or_converted:
        - record: IDEA-20260806-071255
          relation: NEAREST, and the one this record must escape
          what_it_says: >-
            Item D3 closes Kolmogorov complexity / compression ratio of the
            sequence x(P), x(2P), ..., x(tP): that sequence is emitted by a
            program of size O(log p) -- the curve, P and a loop -- so its
            Kolmogorov complexity is O(log p) for every t and every curve, and the
            compression ratio measures t, not k. Family closed by definition
            unfolding.
          what_distinguishes_the_new_one: >-
            The decompression time is charged. D3's O(log p)-bit program answers
            one query in Theta(N) steps, i.e. the point (S, T) = (O(log p), N)
            with S*T^2 = N^2 * polylog -- catastrophically off the preprocessing
            frontier, which is exactly why the (S, T) model exists. Requiring
            polylog random access is the only difference and it is what makes the
            quantity non-vacuous. The new record states this in its own claim (D)
            and carries an explicit withdrawal instruction if a reviewer judges
            the requirement does not change D3's argument.
        - record: IDEA-20260806-3b91c7
          relation: nearest on the preprocessing axis
          what_it_says: >-
            Derives and calibrates the GENERIC frontier S*T^2 = Theta(N) for a
            fixed curve by stored deterministic walk chains, and uses it to
            correct this program's comparator convention, which had been scoring
            memory-heavy candidates against memory-free rho.
          what_distinguishes_the_new_one: >-
            That record establishes the generic frontier and makes no non-generic
            claim; the new record takes that frontier as its baseline and asks the
            strictly different question of whether the concrete curve's coordinate
            structure lets the ADVICE be shorter than the generic construction
            requires. Complementary, and the new record cites it as the baseline
            its exponent identity is stated against.
        - record: IDEA-20260808-9d6677
          relation: adjacent, and explicitly disjoint by its own scoping
          what_it_says: >-
            A single-target, no-advice, no-free-label-table proposal whose Pareto
            table lists preprocessing, advice, queries and multi-target as
            OUTSIDE SCOPE.
          what_distinguishes_the_new_one: >-
            The new record lives entirely inside the scope that one excludes and
            touches none of its single-target claims.
        - record: KN-OPEN-020 and the bounded-degree Bezout no-go
          relation: same word, different object
          what_it_says: >-
            Bounds the DESCRIPTION DEGREE of an algebraically described factor
            base used for relation collection.
          what_distinguishes_the_new_one: >-
            The new record charges description LENGTH of an advice table used for
            lookup, in a model where preprocessing time is free, and collects no
            relation. Different object, different model, different cost axis.
      knowledge_checked:
        - knowledge/techniques/KN-TECH-005.md -- read in full
        - knowledge/open-problems/KN-OPEN-019.md -- read in full
        - knowledge/open-problems/KN-OPEN-020.md -- read in full
        - knowledge/findings/KN-FIND-ffe1df.md -- read in full
        - knowledge/techniques/KN-TECH-73630e.md -- read in full
        - knowledge/findings/KN-FIND-61347e.md -- read in full
        - knowledge/findings/KN-FIND-1ba0fe.md -- read in full
      literature_checked: >-
        Corrigan-Gibbs and Kogan resolved through the corpus as KN-LIT-013 (via
        KN-TECH-005, read); one web search confirming the ST^2 = Omega~(N)
        statement and its restriction to GENERIC algorithms, plus the follow-up
        constructive optimal-tradeoff work (eprint 2022/583, not read). Lange and
        Winterhof COCOON 2002 at snippet depth only, marked `recalled` in the
        record. Smart / Satoh-Araki / Semaev for the anomalous positive control,
        marked `recalled`.
      novelty_label: unverified
      novelty_label_provenance: >-
        The corpus and the working tree were checked and the two nearest
        neighbours were read in the relevant part; the external literature on
        NON-GENERIC discrete-log preprocessing was checked only at web-search
        depth and no source was opened that settles whether the concrete-curve
        advice-compressibility question has been asked before. Under
        agents/idea-generator.md that is `unverified` and not `speculative`.
    - id: IDEA-20260904-f7d47d
      short_name: >-
        relative bucket variance of a sum-compatible filter; the quantity Lemma 5
        assumes to be zero
      nearest_existing_open_or_converted:
        - record: >-
            RT-EXP-1 and its result file
            analysis/o2-sum-compatible-filters/reviews/RT-EXP-1-RESULT.md, via
            KN-FIND-ffe1df
          relation: NEAREST
          what_it_says: >-
            Measured G = M * max_{c,d} pi_c(d) at M = round(N^{1/3}) across the
            8-prime ladder, three curves per prime, with target-dependent and
            x([2]P) filters added and a planted theta = p^{-1/9} mixture. Found no
            attack signal for any cheap filter; popcount and digitsum tripped the
            refutation criterion and were both shown to be false positives by the
            matched-marginal shuffle. The corpus's own summary is that this does
            NOT close the hole, because Lemma 5 is a proof gap, no theorem bounds
            max_c pi_c, and eight toy primes are not a bound.
          what_distinguishes_the_new_one: >-
            Different quantity, different purpose, different design. RT-EXP-1
            measured the MAXIMUM at ONE alphabet to look for an attack. The new
            record measures the relative SECOND MOMENT across an alphabet GRID
            {N^{1/4}, N^{1/3}, N^{2/5}} to identify the scaling law W = C*M^a*
            p^{-1/2} whose exponent a decides, at a < 1/2, whether the
            second-moment route repairs Lemma 5 at M = p^{1/3}. The variance and
            the grid are what turn eight points into a law with a fitted exponent,
            and the exponent is the object a proof would have to establish. The
            new record also reuses RT-EXP-1's harness, its SHA null, its
            matched-marginal shuffle and its planted mixture rather than
            re-inventing them.
        - record: >-
            O2_composition_closure.md, O2_fourier_obstruction.md (Theorem A-prime)
            and O2_derivation_attempt.md (Lemma 5)
          relation: the line this record repairs
          what_it_says: >-
            Theorem A-prime bounds delta, the bucket-AVERAGED rate, with no factor
            M, for uniform independent P and Q. Lemma 5 bridges delta to
            max_c pi_c with the words "if the pi_c are equal".
          what_distinguishes_the_new_one: >-
            It does not re-derive the first-moment bound and takes it as given. It
            addresses only the bridge, and it does so by measuring the exact
            quantity the bridge assumes away rather than by re-expanding the
            single-bucket rate, which the red team showed costs back the M^2 factor
            and reaches only M <= p^{1/4}.
        - record: KN-FIND-ffe1df Theorem C
          relation: near neighbour whose hypotheses are NOT satisfied
          what_it_says: >-
            Exact sum-compatibility plus associativity forces h to be a surjective
            homomorphism E(F_p) -> ([M], f), impossible for N prime and M < N.
          what_distinguishes_the_new_one: >-
            The new record is entirely inside the APPROXIMATE case, which that same
            entry lists as item 1 of what is NOT established. h is not assumed
            homomorphic and f is not assumed exactly sum-compatible; the measured
            quantity IS the deviation from the exact case. The record states this
            explicitly in its standing_results_check.
      knowledge_checked:
        - knowledge/findings/KN-FIND-ffe1df.md -- read in full, including the
        - >-
          red-team, validation, coverage-table and what-is-NOT-established
          sections, from which every quoted number in the new record is taken
        - knowledge/techniques/KN-TECH-005.md -- read in full
        - knowledge/techniques/KN-TECH-73630e.md -- read in full
        - knowledge/findings/KN-FIND-61347e.md -- read in full
      literature_checked: >-
        Wagner CRYPTO 2002 and Weil / Bombieri, both `recalled` and marked as
        such. KN-LIT-7639 and KN-LIT-f6de4b were not opened; the new record
        inherits, and states, this line's own recorded finding that (H1) is only
        partly traced and (H1-prime) largely untraced.
      novelty_label: unverified
      novelty_label_provenance: >-
        The internal line was read in full and the distinguishing quantity is
        named in that line's own text as untouched ("nothing else in the line
        touches that hypothesis", "no theorem here bounds max_c pi_c"). No
        external literature search was run for second-moment bucket bounds in
        k-tree analysis, so the honest label is `unverified`.
    - id: IDEA-20260904-a195ff
      short_name: >-
        known-answer calibration of the solving-degree instrument against the
        binary-field published first-fall degrees, with a matched null system
      nearest_existing_open_or_converted:
        - record: >-
            the DREG and SIG solving-degree clusters (EXP-DREG-620b15,
            EXP-SIG-008 and siblings) and the BKK cluster (RQ-BKK-001,
            RQ-BKKMV-001, H-BKK-001, H-BKKMV-001)
          relation: NEAREST
          what_it_says: >-
            Measure first-fall and solving degrees, and Newton polytopes and mixed
            volumes, for prime-field summation systems at toy scale. The BKK
            cluster returned a scoped negative (Newton saturation, no support-aware
            advantage at m <= 5).
          what_distinguishes_the_new_one: >-
            It adds the two arms those runs lack: a KNOWN-ANSWER arm on the
            binary-field systems whose first-fall degrees are published
            (KN-LIT-005, KN-LIT-010, as named by KN-OPEN-002's own source_refs),
