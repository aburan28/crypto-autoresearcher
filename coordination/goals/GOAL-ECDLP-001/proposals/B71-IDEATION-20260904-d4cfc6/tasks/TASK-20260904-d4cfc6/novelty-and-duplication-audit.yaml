        - knowledge/findings/KN-FIND-c93d45.md -- read in full
        - knowledge/findings/KN-FIND-d4f820.md -- read in full
        - knowledge/findings/KN-FIND-1ba0fe.md -- read in full
        - knowledge/literature/KN-LIT-025.md -- read in full
        - knowledge/literature/KN-LIT-4558.md -- read in full
      literature_checked: >-
        Amadori-Pintore-Sala and McGuire-Mueller abstracts fetched and read this
