    - query_or_url: >-
        WebSearch -- Lange Winterhof polynomial interpolation elliptic curve
        discrete logarithm degree lower bound
      outcome: >-
        Lange and Winterhof, COCOON 2002, prove lower bounds on the degree of
        polynomials interpolating the elliptic-curve discrete logarithm. Snippet
        depth only; recorded as `recalled` in IDEA-20260904-d84512 and used only
        to narrow that record's declared representation classes.
    - query_or_url: >-
        WebSearch -- 2025 2026 new results elliptic curve discrete logarithm prime
        field index calculus
      outcome: >-
        Nothing exponent-relevant surfaced. The one 2025 item (eprint 2025/015)
