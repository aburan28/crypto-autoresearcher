  ideas_dropped_as_duplicative:
    - dropped: >-
        A Kummer / multiplicative-subgroup factor base V = mu_D over prime fields,
        with membership x^D = 1 encoded as a binary square-and-multiply TOWER of
        quadratic equations to keep the Groebner degrees low, escaping the
        extended-Euclidean structural hypothesis of KN-LIT-4558's lower bound by
        changing the ideal.
      duplicates: >-
        The Kummer base is already proposed at IDEA-20260808-726aa3 and
        IDEA-20260829-4b34c5, and is run as a named arm inside
        IDEA-20260902-701458 (with M = x^e - 1 sparse). The composed-low-degree-map
        base is Petit-Kosters-Messeng's own construction (KN-LIT-025), described in
        IDEA-20260902-701458 as "the composed-map base (KN-LIT-025)" and as "the
        Petit-Kosters-Messeng root-extraction tower". The tower encoding is a
        presentation change on an object already occupied twice over.
      verdict: >-
        Not enough distinguishes it. Dropped rather than filed. The one residual
        increment -- that a tower encoding changes the ideal and so escapes
        KN-LIT-4558's structural hypothesis -- is recorded here for whoever
        upgrades that literature entry, and is not worth an identifier on its own.
    - dropped: >-
        A degree-based method-ceiling theorem for algebraically described
        prime-field factor bases, via a Lang-Weil image-size bound (any morphism
        A^r -> A^1 over F_p is constant or dominant, so an image of size p^{1/m}
        forces degree >= p^{1-1/m}) combined with the zero-set bound (a set of
        size D has vanishing ideal of degree exactly D).
      duplicates: >-
        KN-OPEN-020, "Universal algebraic-factor-base no-go for prime-field index
        calculus", whose bounded-degree theorem
        (ideas/artifacts/IDEA-20260801-021/bounded_degree_factor_base_theorem.md)
        already gives the Bezout obstruction for one bounded-degree plane
        predicate and its algebraic-degree generalisation; KN-FIND-c93d45 and
        KN-FIND-d4f820 both refer to it as the settled "Bezout no-go for algebraic
        factor bases".
      verdict: >-
        Nothing distinguishes it. Dropped. Recorded because the derivation was
        carried out independently in this session before the corpus record was
        found, which is a small piece of corroboration for that theorem and
        nothing more.
    - dropped: >-
        A meet-in-the-middle join-space ceiling for prime-field relation search:
        split the m-sum via the summation-polynomial resultant recursion, enumerate
        D^{m/2} half-sums each side and join on the intermediate x-coordinate; with
        D = p^{1/m} this costs p^{1/2} per relation and, times the p^{1/m}
        relations needed, p^{1/2 + 1/m} total.
      duplicates: >-
        Catalogue A1-2 "algebra-free meet-in-the-middle", recorded in
        IDEA-20260806-3b91c7 at exactly (N^{1/2 + 1/m}, N^{1/2}) and noted there as
        dominated at its own memory by the chain frontier's N^{1/4}.
      verdict: >-
        Nothing distinguishes it; the exponent this session derived is the one
        already on the record. Dropped.
    - dropped: >-
        Isogeny-class re-randomisation of the relation-collection stage: the ECDLP
        instance is invariant under any F_p-isogeny of degree coprime to N, so the
        ~sqrt(p) curves of the isogeny class give sqrt(p) independent coordinate
        maps for one instance, and their arithmetic factor bases could be unioned
        into a single relation matrix over the common group.
      duplicates: >-
        The isogeny-class search over presentations is already an active line of
        this program (harness/rl_isogeny, built 2026-09-03, reward stated as
        null-relative Macaulay excess).
      verdict: >-
        Dropped as duplicative AND independently refuted in this session, which is
        recorded because the refutation is cheap and useful. Using k curves each
        with factor base B, against a single curve with factor base kB, the ratio
        of total costs is k^m * C(B)/C(kB), so the multi-curve union is worse by
        k^m for any per-trial cost C growing at most polynomially. The union buys
        nothing that enlarging B on one curve does not buy more cheaply. This
        closes the UNION construction only; it says nothing about MINIMISING a
        curve-dependent cost over the class, which is what the active line does.
    - dropped: >-
        A proposal to reconcile KN-LIT-4558's Groebner lower bound with
        KN-OPEN-002 and with the corpus's H-PSEUDO-conditional ceiling.
      duplicates: nothing; excluded on a different ground
      verdict: >-
        NOT dropped for duplication but for SCOPE: its core is reading a paper the
        corpus already holds, which is citation-coverage work and is excluded by
        the handoff without exception. Recorded as PA-1 above and folded into
        IDEA-20260904-a195ff part (D) as a subordinate pre-registration step.

  standing_results_compliance:
    kn_tech_73630e: >-
      No filed proposal lifts. d84512 states explicitly why the boundary does not
      apply (the advice is the output of a preprocessing phase the online party
      does not run, so it is not a deterministic function of data that party
      holds) and records against interest that the experiment's FINDING is
      nevertheless a deterministic function of public data and is therefore
      computational, which is consistent with the boundary rather than in tension
      with it. f7d47d and a195ff involve no lift at all.
    kn_find_ffe1df_theorem_c: >-
      Each filed proposal states explicitly whether its object satisfies the
      argument's hypotheses. d84512: NOT satisfied -- the tracked object is a
      length assigned to a table indexed by x-coordinates, not a homomorphism, and
