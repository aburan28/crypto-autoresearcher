novelty_and_duplication_audit:
  task: TASK-20260904-d4cfc6
  role: idea-generator
  question: RQ-ECDLP-002
  produced: '2026-09-04'

  method_and_its_limits:
    tool_run: false
    why_not: >-
      This session has no shell or Bash tool. The command the handoff specifies,
      `python3 tools/audit_proposal_backlog.py --question RQ-ECDLP-002 --list`,
      COULD NOT BE RUN, and no output of it is quoted or paraphrased anywhere in
      this session. Stated plainly rather than worked around, because that tool's
      own docstring records that this campaign got the unconverted-proposal
      question wrong twice by seeing less state than the writers collectively
      hold, and a substitute must not be presented as equivalent.
    what_was_done_instead: >-
      A keyword-and-read audit over the working tree only, at HEAD of branch
      ecdlp-backlog-20260904. (1) `Grep` for RQ-ECDLP-002 across
      ledger/proposals returned 143 files. (2) Targeted keyword sweeps over the
      whole of ledger/proposals for each candidate mechanism's vocabulary --
      solving degree / degree of regularity / first-fall (80+ files), Semaev and
      summation polynomial (80+ files), preprocessing and advice and
      Corrigan-Gibbs and time-memory tradeoff, quasi-subfield and Chebyshev and
      multiplicative subgroup and straight-line program, meet-in-the-middle and
      claw, Kummer and roots of unity, Kolmogorov and Berlekamp-Massey and
      incompressible, Amadori and one-basis and linear-algebra-free, anomalous
      and Smart. (3) Full reads of the records those sweeps surfaced as nearest
      neighbours, listed per proposal below. (4) Full reads of the four
      standing-result and open-problem inputs named in the handoff plus
      KN-OPEN-020, KN-FIND-c93d45, KN-FIND-d4f820, KN-TECH-005, KN-LIT-025 and
      KN-LIT-4558. (5) Five web searches and four fetches, listed under
      external_checks.
    known_gaps_in_this_audit:
      - >-
        WORKING TREE ONLY. Other worktrees and unmerged branches were not
        scanned. The audit tool exists precisely because a proposal contracted on
        an unmerged branch looks open to every session but the one that did it,
        and this audit is blind to that. A duplicate of any of the three filed
        proposals could exist on another branch.
      - >-
        CONVERTED PROPOSALS WERE NOT SEPARATED FROM OPEN ONES. Without the tool
        this session could not compute which of the 143 RQ-ECDLP-002 proposals are
        unconverted, so the handoff's figure of 39 open titles was neither
        confirmed nor used. Every proposal read was treated as prior art
        regardless of status, which is the conservative direction.
      - >-
        KEYWORD RECALL IS A FLOOR. A near-duplicate phrased in vocabulary none of
        the sweeps used would not have been found. The three filed records each
        carry an explicit withdrawal instruction naming the finding that would
        make them duplicative.
      - >-
        The strict duplicate-key YAML parse the handoff requires was NOT RUN, for
        the same reason. See the session receipt.

  external_checks:
    - query_or_url: >-
        WebSearch -- index calculus elliptic curve prime field factor base
        membership polynomial degree Semaev Amadori Pintore Sala
      outcome: >-
        Surfaced Amadori-Pintore-Sala (eprint 2017/609), Petit-Kosters-Messeng
        (PKC 2016), McGuire-Mueller (eprint 2017/1262) and Yokoyama-Yasuda-
        Takahashi-Kogure (J. Math. Cryptol. 2020, doi 10.1515/jmc-2019-0029).
    - query_or_url: https://eprint.iacr.org/2017/609
      outcome: >-
        Abstract read. Amadori, Pintore, Sala 2017 -- a prime-field variation of
        Semaev's approach that outperforms Semaev's method and Petit et al., the
        improvement obtained by reducing the necessary Groebner basis
        computations to only one basis calculation. Body NOT read; no complexity
        figure taken.
    - query_or_url: https://eprint.iacr.org/2017/1262
      outcome: >-
        Abstract read. McGuire and Mueller 2017 -- an index calculus algorithm
        using fast summation-polynomial evaluation that, unlike all other
        algorithms using summation polynomials, does NOT involve a Groebner basis
        computation. Recorded because it bounds the reach of any Groebner-cost
        lower bound.
    - query_or_url: https://christophe.petit.web.ulb.be/files/16PKC_primeECDLP.pdf
      outcome: >-
        Fetched, but the returned summary is LOW FIDELITY and internally
        implausible (it describes a small-norm factor base and attributes a
        subexponential claim). NOT USED as a source anywhere. The corpus's own
        KN-LIT-025 entry was used instead, and it too is marked as relayed from
        the abstract.
    - query_or_url: >-
        WebSearch -- Yokoyama Yasuda Takahashi Kogure Semaev naive index calculus
        lower bound (plus a De Gruyter and a DOAJ fetch, both refused: HTTP 405
        and HTTP 403)
      outcome: >-
        Bibliographic details confirmed and the abstract's four bullet claims
