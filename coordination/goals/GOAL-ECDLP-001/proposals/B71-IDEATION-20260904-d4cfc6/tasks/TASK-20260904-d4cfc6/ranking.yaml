    unspent:
      - id: IDEA-20260904-f4172f
        why: >-
          Deliberately left unspent. Four candidate mechanisms were generated and
          dropped during the duplication audit -- a Kummer/tower factor base
          (occupied twice over), a Lang-Weil degree ceiling for algebraic factor
          bases (already the corpus's Bezout no-go), a meet-in-the-middle
