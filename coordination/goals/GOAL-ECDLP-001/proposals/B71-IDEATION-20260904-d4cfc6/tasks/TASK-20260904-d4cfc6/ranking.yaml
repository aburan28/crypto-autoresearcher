      prime-order finite FIELDS and reports a roughly 2x success-probability gain,
      which is a constant factor. This is recorded as a negative result of the
      hunt, not omitted.
    - >-
      NO CANDIDATE THAT MOVES THE SINGLE-TARGET, NO-ADVICE EXPONENT. All three
      filed records operate on axes other than that one: advice length, a barrier
      quantity, and instrument calibration. The single-target no-advice exponent
