  ranked:
    - rank: 1
      id: IDEA-20260904-d84512
      title_short: >-
        advice length under a charged decompression time; the non-generic
        preprocessing frontier
      expected_information_gain: >-
        HIGH. It is the only filed record whose positive outcome would be a
        genuine exponent result -- S*T^2 = N^{2 - theta(1+gamma)} against the
        generic frontier Theta~(N) -- and its negative outcome closes a NAMED,
        previously unoccupied cell of this program's own attack-family
        enumeration with a measured obstruction rather than a tally. Either way
        the campaign gains a fact it does not have. It also reads a standing
        closure as a resource in exactly the sense KN-TECH-056 asks for:
        IDEA-20260806-071255 item D3 killed the compression question by observing
        that a loop of size O(log p) emits the sequence, and the observation that
        the same loop takes Theta(N) steps to answer one query is precisely what
        the (S, T) model charges. The dead quantity becomes a live one by charging
        the axis the closure ignored.
      cost: >-
        LOW. Exhaustive discrete-logarithm tables at 13 to 24 bits; the largest
        table is N about 1.7e7 entries, one enumeration pass. Four representation
        classes, three curve types, three set designs, six primes, 200 curves per
        cell for the distributional arms. Estimated well under one CPU-hour for
        the core grid and under 2 GB peak. The only implementation work of
        substance is the representation-class library and the anomalous-curve
        search, both routine.
      why_first: >-
        Cheapest decisive discriminator per unit of information, and the only one
        with an upside. See recommended_first_test below.
    - rank: 2
      id: IDEA-20260904-f7d47d
      title_short: >-
        relative bucket variance; the quantity Lemma 5 assumes to be zero
      expected_information_gain: >-
        HIGH, and two-sided in an unusual way. Its two outcomes point in OPPOSITE
        directions: a small, Weil-rate-decaying variance makes the second-moment
        route a live repair for the O2 line's load-bearing proof gap and would
        retire the exponent-0.4167 j = 2 configuration; a large or non-decaying
        variance closes that proof route AND is the first quantitative sign of a
        filtering gain this program would have, because an attacker who selects
        the bucket after seeing h collects max_c pi_c rather than the average
        delta. The corpus states in its own words that no theorem there bounds
        max_c pi_c and that nothing in the line touches Lemma 5's hypothesis, so
        this measures an explicitly named untouched quantity.
      cost: >-
        LOW. Reuses the RT-EXP-1 harness, its 8-prime ladder, its SHA null, its
        matched-marginal shuffle and its planted theta = p^{-1/9} mixture. The
        increment is a jackknife-debiased second-moment estimator, an alphabet
        grid of three values instead of one, and an exact whole-group anchor at
        the two smallest primes. Estimated 1 to 3 CPU-hours at 10^7 pairs per
        cell, under 4 GB.
      why_not_first: >-
        Slightly higher estimator risk than rank 1 -- a variance estimator over
        M = N^{1/3} buckets is biased upward and the debiasing has to work before
        anything else means anything -- and its best realistic outcome is a
        barrier repair rather than an attack. Rank 1 has the same cost and a real
        upside.
    - rank: 3
      id: IDEA-20260904-a195ff
      title_short: >-
        known-answer calibration of the solving-degree instrument, with a matched
        null summation polynomial
      expected_information_gain: >-
        MEDIUM, and structurally different from the other two: it produces no
        mathematical fact about the ECDLP at all. What it produces is a statement
        about whether this campaign's degree-based nulls were made by an
        instrument that can see. Given that every result this campaign has
        produced is a negative, an uncalibrated instrument is the single largest
        systematic risk to the whole body of work, and the UNCALIBRATED outcome
        would force a scope narrowing on standing records -- which would be the
        more valuable of its two outcomes.
      cost: >-
        MEDIUM, and the highest of the three. Groebner computations at toy
        parameters on two field families, two independent solver implementations,
        ten null instances per cell. Estimated 10 to 40 CPU-hours with cells
        capped, up to 32 GB on the worst cells. Cap exhaustion is the dominant
        risk and every exhausted cell must be recorded as infrastructure, never as
        a high degree.
      why_last: >-
        sota_delta is +0 BY CONSTRUCTION and the record says so in its own claim
        (C); its best possible outcome is not an exponent move. It earns its slot
        as a required building block, not as a candidate mechanism, and under the
        handoff's own priority ordering that places it below two records that
        could move an exponent. It also carries the highest residual duplication
        risk of the three, because the degree lane spans 80-plus proposals by
        keyword and this session could not enumerate which of them are open.

  recommended_first_test:
    id: IDEA-20260904-d84512
    the_test: >-
      The instrument-calibration slice ALONE, before any measurement on a generic
      curve. Build the four representation classes; construct one anomalous curve
      with #E(F_p) = p at about 20 bits by scanning (a, b) over a fixed p;
      construct its named null twin -- a DIFFERENT curve over the SAME p with
      #E prime and not equal to p; compute both full dlog tables; report
      gamma_C on both.
    cost_of_that_slice: >-
      Minutes of wall clock and a few hundred MB. One 20-bit dlog table is about
      10^6 entries. No Groebner engine, no sampling, no statistics beyond a
      bootstrap.
    why_it_is_the_cheapest_valid_discriminator: >-
      Because it is a KNOWN-ANSWER test that costs almost nothing and can kill the
      whole record before any expensive cell is run. On the anomalous curve the
      answer is known in advance: the formal-group logarithm makes the discrete
      logarithm an affine function of a polylog-computable coordinate, so
      gamma = 1, and a declared class list that does not report gamma >= 0.9 there
      is too weak to make ANY null it later produces interpretable. On the null
      twin -- same prime, same code path, only the anomalousness removed -- the
      answer is equally known: gamma must be about 0. Two numbers, both predicted
      in advance, both cheap, and between them they decide whether the instrument
      exists. If the slice passes, the generic-curve grid is worth running; if it
      fails, the record is withdrawn at a cost of one afternoon rather than after
      a full grid of uninterpretable zeros. This is the control the O2 line's own
      red team said was missing when it observed that the P2 control calibrates
      only the maximal-signal end and never demonstrates that the instrument
      resolves the boundary where closure is actually decided.

  most_likely_to_be_wrong:
    id: IDEA-20260904-f7d47d
    what_is_most_likely_wrong: >-
      The mechanism claim in its part (B): that performing the sum over the bucket
      variable c INSIDE the character expansion collapses the M^2 frequency pairs
      by orthogonality before any triangle inequality is taken, and therefore
      escapes the M^2 loss that defeated the line's direct single-bucket repair.
      That is an assertion about an expansion this session did not write out. The
      red team's finding was that in the direct expansion all M^2 coefficients
      have modulus 1 and no ell^2 saving is available -- the same Cauchy-Schwarz
      step that both O2 derivations independently hit from opposite directions.
      There is a live possibility that the second moment reproduces the same
      barrier in a different variable, in which case the fitted exponent a comes
      out at or above 1/2 and the route is dead for the same reason the first one
      was.
    how_it_would_show: >-
      Directly and cheaply, in the measurement itself, which is why the record is
      still worth filing. The fitted a in W = C*M^a*p^{-1/2} is estimated over the
      alphabet grid {N^{1/4}, N^{1/3}, N^{2/5}}; an interval lying entirely above
      1/2 is the LARGE-W outcome and closes the route with a measured obstruction
      rather than a suspicion. A second, sharper tell: if the barrier is the same
      one in a new variable, the fitted a should land near 2 -- the frequency count
      of the direct expansion -- rather than at some intermediate value, and that
      is a distinguishable prediction. A third: the record requires the derived
      Cauchy-Schwarz bound and the directly measured G = M*max_{c,d} pi_c(d) to be
      reported side by side in every cell, so a bound that is vacuous against the
      quantity it bounds is visible in the raw table and cannot be written up as a
      result.
    second_most_likely: >-
      IDEA-20260904-d84512's premise that the declared representation classes are
      rich enough for a null to mean anything. Its own anomalous positive control
      is designed to catch exactly this, and the first-test slice above runs that
      control before anything else, which is why it is ranked first despite
      carrying this risk.

  what_this_session_did_not_find:
    - >-
      NO NEW EXTERNAL STRUCTURAL INGREDIENT. The ingredient hunt required by the
      search heuristics was run (five web searches, four fetches) and returned
      nothing from 2024 to 2026 that converts a prime-field bottleneck into a
