controls_before_belief:
  screen_is_its_own_control: >-
    For every candidate carrying G1, the screen checked (i) that the
    computation is genuinely public (no ECDLP-equivalent information hidden
    behind syndrome/decoder/interpolation language -- the syndrome-defined-
    from-received-word pattern is exactly this kind of hidden dependency, made
    explicit rather than accepted at face value), (ii) the quantifier order
    (all objects fixed before any witness observed), and (iii) the
    already-costed-route exclusion as a named check.
  public_computation_check: >-
    C1's and C2's "public" evaluation objects (the syndrome, the black-box
    oracle) are shown to either require an already-corrupted/received input
    or to cost exactly what the already-costed ROUTE-04 costs; neither hides a
    witness so subtly that it would pass on a first read -- the dependency is
    stated directly in the source abstracts themselves (cs/0701070: "syndromes
    of the received word"). C3-C5 do not reach a public-computation question
    at all (wrong role or wrong domain).
  quantifier_order_check: >-
    In every candidate the general algorithm is fixed independently of any
    particular instance, but none types the frozen P1553 objects (rings,
    bases, public g_I and r_R construction) before a witness-equivalent input
    (the received word, the sparsity bound, the evaluation oracle) is
    required.
  already_costed_route_exclusion: >-
    Named check run per candidate: C1's matching direction and C2's oracle
    both collapse to ROUTE-04 (multipoint evaluation); C3 is a fast-arithmetic
    accelerant for the same route. C4-C5 are off-target (wrong problem/domain),
    so the already-costed-route test does not apply in the resultant sense;
    the off-target failure is recorded directly.

lossy_projection_test_summary: >-
  See scope_components.component_b_sparse_interpolation_exponential_sum_reconstruction.lossy_projection_test
  for the full statement. Summary: the syndrome-analogue tracked object
  (values of r_R at g_I's known roots) carries EXACTLY the same information
  as r_R mod g_I via CRT on g_I's linear factors -- it is a change of
  coordinates, not a lossy projection, and fails the test at the
  definitional stage. The sparse-interpolation tracked object (t black-box
  samples) IS genuinely lossy but has no established compatible propagation
  rule under E, P, Q updates and no established sparsity bound for its
  target, so it fails the test at the "discarded compatibly" clause.

