route_preservation:
  closure_statement: >-
    This is a scoped no-candidate result for the exact searched scope. It does
    not close, weaken, or falsify any route, family, or broader approach. The
    directional/oracle-cost obstructions established this round (C1's syndrome-
    requires-received-word circularity and reversed-direction mismatch; C2's
    absent sparsity bound and non-free evaluation oracle) are named and argued
    per the inventor protocol's closure standard, but are scoped exactly to
    the specific syndrome and black-box-evaluation formulations of the
    retrieved literature as read this round -- not a claim that no future
    coding-theoretic or sparse-reconstruction construction, with a genuinely
    public syndrome-analogue or an established cheap oracle, could ever
    supply a trigger.

decision_summary: >-
  The eleventh trigger search was performed over a scope explicitly disjoint
  from rounds seven through ten: algebraic coding theory (Reed-Solomon/BCH
  syndrome decoding, error-locator polynomial constructions -- Berlekamp-
  Massey, the Euclidean-algorithm decoder, Peterson-Gorenstein-Zierler) and
  sparse polynomial / exponential-sum reconstruction (Ben-Or/Tiwari, Prony's
  method and modern variants), via the arXiv export API, which answered every
  query directly (no rate-limiting observed). Component (a) retrieved
  syndrome/key-equation decoders and Groebner-basis reformulations
  (Bras-Amoros & O'Sullivan; Augot, Bardet & Faugere; Shany & Berman; Chang,
  Lee & Feng; Peterson-Gorenstein-Zierler literature) and established that
  "the syndrome" in every source is defined as a function of the received
  (possibly corrupted) word -- an already-witness-bearing object -- and that
  even granting a public analogue, the direction these algorithms make cheap
  (public value to unknown roots) is the reverse of the P1553 need (known
  roots to public residual), which collapses the matching direction to the
  already-costed ROUTE-04 multipoint evaluation. Component (b) retrieved
  sparse-interpolation and Prony-method reconstruction theory and established
  that it requires both an a priori sparsity bound (absent for r_R under the
  frozen premises) and a black-box evaluation oracle whose per-query cost
  equals ROUTE-04's materialization cost; the nearest coding-theoretic/
  elliptic-curve intersection found (ECFFT, arXiv:2107.08473) is a
  fast-arithmetic accelerant for that same already-costed route, not a new
  identity. Two internal-corpus off-target items (Wiedemann/Block-Wiedemann
  linear algebra; LFSR annihilator attacks) were considered and declined as
  wrong-problem/wrong-domain. The resource-check answer is examined true,
  none found. Every candidate considered (C1-C5) is judged item-by-item
  against the frozen gate (G1-G8); none passes every item. The honest
  disposition is scoped_no_candidate, with every broader route preserved and
  no B71, experiment, evidence, attack, SOTA, or breakthrough claimed.
