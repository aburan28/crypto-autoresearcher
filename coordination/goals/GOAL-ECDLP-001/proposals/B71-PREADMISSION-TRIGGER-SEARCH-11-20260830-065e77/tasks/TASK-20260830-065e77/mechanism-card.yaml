  critical_directional_fact_established_this_round: >-
    Unlike the classic coding-theory setting, where the error positions
    (roots of the error-locator polynomial sigma(x)) are UNKNOWN and are the
    object being recovered from public syndromes, the P1553 setting's
    analogous roots (g_I's roots, the public fifth-occurrence labels) are
    ALREADY PUBLIC and known before any transducer is invoked. The open
    P1553 problem is therefore not "find the roots from a small public
    observable" (the direction Berlekamp-Massey, the Euclidean-algorithm
    decoder, and Peterson-Gorenstein-Zierler specialize in and make cheap);
    it is the reverse direction, "given the roots, compute a small public
    residual (r_R mod g_I) of a large object (r_R) without materializing that
    object." In every coding-theoretic construction searched this round, the
    reverse direction (computing syndromes, i.e. evaluations of the received
    word at the code's defining points, from a KNOWN error pattern) is the
    cheap/direct encoding-style computation, not the one Berlekamp-Massey,
    Euclidean, or Peterson-Gorenstein-Zierler machinery accelerates; it
    requires exactly the per-point evaluation of the underlying object that
    the frozen setting's already-costed ROUTE-04 (multipoint evaluation)
    already prices at Theta(B^3)-style cost. This directional mismatch is the
    single structural reason every candidate below fails G2/G8, independent
    of any single candidate's other weaknesses.
