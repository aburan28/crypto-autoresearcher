    computation for triangular structures and performed a deck-local
    mixed-radix identity search over the two named frozen P1553 mixed-radix
    correction packets (CLOSED as a narrow negative and not reopened here).
    This round searches a genuinely new area: algebraic coding theory
    (Reed-Solomon/BCH syndrome decoding, error-locator polynomial
    constructions -- Berlekamp-Massey, the Euclidean-algorithm decoder,
    Peterson-Gorenstein-Zierler) and sparse polynomial / exponential-sum
