    objects_read:
      - id: SPARSE_INTERPOLATION_BLACKBOX
        name: >-
          Ben-Or/Tiwari sparse-interpolation extensions and Prony's-method
          exponential-sum reconstruction theory (Huang, arXiv:2002.03706;
          Huang & Gao, arXiv:2207.13874; Sauer, arXiv:1602.02352 and
          1603.03944; Kunis, Moller, Peter, von der Ohe et al.,
          arXiv:1506.00450 and related; Keller & Plonka, arXiv:2001.03651;
          Stampfer & Plonka, arXiv:1901.08778; Kunis, Romer & von der Ohe,
          arXiv:1907.01547).
        source_refs:
          - arXiv:2002.03706
          - arXiv:2207.13874
          - arXiv:1602.02352
          - arXiv:1506.00450
          - arXiv:2001.03651
          - arXiv:1901.08778
          - arXiv:1907.01547
        assessment: >-
          Every construction recovers a sparse polynomial or exponential sum
          with an a priori BOUNDED number of nonzero terms t from t (or O(t))
          BLACK-BOX EVALUATIONS at chosen points (Ben-Or/Tiwari: powers of a
          fixed generator; Prony: equispaced or structured samples), via a
          Hankel/Toeplitz linear-algebra step (itself often solved by
          Berlekamp-Massey, per the same directional analysis as component a)
          followed by root-finding for the support. Two independent
          structural preconditions are absent from the frozen P1553 setting:
          (i) no a priori bound on the number of nonzero terms of r_R (or of
          r_R mod g_I as a function of a monomial/exponential basis native to
          the elliptic construction) is established anywhere in the frozen
          records -- the object is expected to be DENSE, not sparse, prior to
          any reduction; (ii) even granting sparsity, each black-box
          evaluation of the underlying object at a chosen point costs exactly
          the already-costed ROUTE-04 multipoint-evaluation materialization,
          so there is no separately cheap oracle to call. G1 present (named,
          published sparse-interpolation and Prony-method theorems); G2
          absent (the frozen setting supplies no sparsity precondition for
          r_R, and the evaluation oracle these methods require is not free);
          G3 absent; G8 absent (collapses to ROUTE-04 when an oracle is
          supplied at all).
      - id: ECFFT_FAST_EVALUATION_NEAR_MISS
        name: >-
          Elliptic Curve Fast Fourier Transform, ECFFT Part I (Ben-Sasson,
          Carmon, Kopparty, Levit, arXiv:2107.08473).
        source_refs: [arXiv:2107.08473]
        assessment: >-
          Retrieved under the "Reed-Solomon"+"elliptic curve" query as the
          nearest coding-theoretic/elliptic-curve intersection found this
          round. Develops fast polynomial multipoint evaluation and
          interpolation using a set of points ON an elliptic curve as the
          evaluation domain (in place of roots of unity), enabling efficient
          Reed-Solomon-style encoding/evaluation in fields without large
          smooth-order multiplicative subgroups. This is a fast-ARITHMETIC
          implementation technique for the SAME already-costed ROUTE-04
          multipoint-evaluation family (its backend citation in H-CREP-001 is
          Borodin-Moenck fast modular transforms), not a new remainder
          identity: it could in principle accelerate an implementation of
          ROUTE-04 by a polylogarithmic or constant factor but does not
          change the Theta(B^3)-style target-dependent materialization
          dependency or the exponent-in-B cost that makes ROUTE-04
          already-costed for the P1553 setting; its evaluation-domain points
          are elliptic-curve points chosen for FFT-friendliness in the
          arithmetic sense (unrelated to g_I's label-polynomial roots) and
          it does not address discrete logarithms. Considered and declined:
          G1 present; G2 absent (wrong role -- fast arithmetic for an
          already-costed route, not a new r_R mod g_I identity); G8 absent
          (adjacent to and inherits ROUTE-04's already-costed status; also
          adjacent to round seven's fast-remainder/Kedlaya-Umans-family
          sub-avenue in spirit, though ECFFT itself was not among round
          seven's retrieved objects -- checked against the gate here, not a
          re-run of round seven's screen).
    resource_check_answer:
      examined: true
      reading_found: false
      what_was_examined: >-
        knowledge/ grepped for "Ben-Or"+"Tiwari" and "Prony's method" (no
        matches beyond the general OR-pattern already covered under
        component a's resource check, which returned no genuine hits for
        these exact terms); the eight frozen routes' backend citations in
        H-CREP-001.yaml (Borodin-Moenck for ROUTE-04, Kedlaya-Umans for
        ROUTE-05, Moroz-Schost for ROUTE-07) re-read to confirm ECFFT's
        adjacency to ROUTE-04 rather than to an unexplored route.
      answer: >-
        None found. No corpus record or frozen route citation supplies a
        sparse-interpolation- or Prony-based P1553 remainder transducer.
    lossy_projection_test: >-
      Per the inventor protocol's lossy-projection test (applied here as due
      diligence though no experiment is proposed): the natural tracked object
      for a syndrome-style trigger (component a) would be "the tuple of
      values of r_R at each of g_I's deg(g_I) known roots." Because g_I is
      squarefree, this tuple and r_R mod g_I are in EXACT bijection via the
      Chinese Remainder Theorem on the linear factors of g_I: no information
      is discarded in either direction. This is therefore not a lossy
      projection at all -- it is a change of coordinates for the same
      object, and computing it costs exactly what ROUTE-04 (direct multipoint
      evaluation of r_R at g_I's roots) already costs. It fails the
      lossy-projection test at the definitional stage, precisely as the
      inventor protocol anticipates for representations that "lose nothing."
      For component b, the natural tracked object would be "t black-box
      evaluations of r_R (or of a putative sparse residual) at points
      1, w, w^2, ..." for the Ben-Or/Tiwari construction. This IS a
      genuinely lossy projection of the full Theta(B^3) object (it discards
      all information except t sample values), but what it discards is NOT
      discarded compatibly with the frozen setting's operations: there is no
      established recurrence by which incrementing E, P, or Q updates these
      t sample values without re-evaluating the whole object, and no bound on
      t (the sparsity) is established for r_R under the frozen premises, so
      the projection's target object is not even well-defined at the scale
      the frozen setting requires. It fails the lossy-projection test at the
      "discarded compatibly with the target's operations" clause.
    what_it_supplied: >-
      No candidate supplied a typed trigger. Component (a) establishes that
      every retrieved syndrome/error-locator construction's public input
      (the syndrome) is defined as a function of an already-corrupted/received
      object carrying the unknown, and that even granting a public analogue,
      the cheap direction these algorithms provide (public value -> unknown
      roots) is the reverse of what P1553 needs (known roots -> public
      residual), which collapses the useful direction to the already-costed
      ROUTE-04. Component (b) establishes that sparse-interpolation and
      Prony-method reconstruction require both an a priori sparsity bound
      (absent for r_R under the frozen premises) and a black-box evaluation
      oracle whose per-query cost equals the already-costed ROUTE-04
      materialization cost; the one near-miss (ECFFT) is a fast-arithmetic
      accelerant for that same already-costed route, not a new identity.

