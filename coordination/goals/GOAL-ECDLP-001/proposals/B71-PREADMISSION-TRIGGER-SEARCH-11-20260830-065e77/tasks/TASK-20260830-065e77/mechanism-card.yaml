      error-locator construction (Bras-Amoros & O'Sullivan 0908.2198; Augot,
      Bardet & Faugere cs/0701070; Shany & Berman 2008.01796; Chang, Lee &
      Feng 1209.1198; Peterson-Gorenstein-Zierler literature).
