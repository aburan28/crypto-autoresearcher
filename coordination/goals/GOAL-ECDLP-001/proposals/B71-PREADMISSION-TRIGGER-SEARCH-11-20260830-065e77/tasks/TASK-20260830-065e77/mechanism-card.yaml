        instrument: webfetch arxiv.org/abs page
        results: 1 (full abstract read)
      - query: 'abstract fetch of arXiv:2008.01796 (Shany-Berman)'
        instrument: webfetch arxiv.org/abs page
        results: 1 (full abstract read)
    objects_read:
      - id: SYNDROME_KEY_EQUATION_DECODERS
        name: >-
          Berlekamp-Massey / Sugiyama-Euclidean-algorithm key-equation solvers
          and their Groebner-basis / interpolation reformulations (Bras-Amoros
          & O'Sullivan, arXiv:0908.2198; Augot, Bardet & Faugere, arXiv:cs/0701070;
          Shany & Berman, arXiv:2008.01796; Chang, Lee & Feng, arXiv:1209.1198;
          Peterson-Gorenstein-Zierler literature, arXiv:1910.11574, 1703.00745,
          1310.2473, 1706.03504).
        source_refs:
          - arXiv:0908.2198
          - arXiv:cs/0701070
          - arXiv:2008.01796
          - arXiv:1209.1198
          - arXiv:1910.11574, arXiv:1703.00745, arXiv:1310.2473, arXiv:1706.03504
        assessment: >-
          In every source read, "the syndrome" (the small public object from
          which the error-locator polynomial's coefficients are derived,
          whether via Euclidean-algorithm recursion, Berlekamp-Massey LFSR
          synthesis, Groebner-basis elimination, or a closed-form
          interpolation formula) is defined as a function of the RECEIVED
          WORD -- i.e. of an object that already encodes the unknown error
          pattern (cs/0701070's abstract states the problem is "to find the
          error locator polynomial in terms of the syndromes of the received
          word"; 1209.1198 constructs an "unknown syndrome representation"
          that itself requires the received/corrupted codeword; Shany-Berman
          is explicitly "syndrome-based," with syndromes derived from the
          received corrupted word). This is structurally the excluded input:
          for P1553, the analogous "received word" would already have to
          encode the witness (the discrete logarithm or the source labels)
          before any syndrome-analogue could be computed, which is exactly
          the circularity G2 excludes. Independently of that circularity,
          the DIRECTION these algorithms specialize in (small public syndrome
          -> unknown locator roots, cheaply, via O(t) Euclidean/BM steps) is
          the reverse of the direction P1553 needs (known g_I roots -> small
          public residual r_R mod g_I): the coding-theoretic direction that
          would match P1553's need -- computing the syndrome-like object FROM
          a known error pattern/support -- is the ordinary encoding-style
          computation, requiring evaluation of the underlying object at each
          root, exactly the already-costed ROUTE-04 (multipoint evaluation)
          materialization cost. G1 present (named, published algorithms and
          theorems); G2 absent (requires an already-corrupted/received input
          carrying the witness, and even granting a hypothetical public
          received-word analogue, the needed direction is the reverse of what
          these algorithms make cheap); G3 absent (no B^(5/4)/o(ell^(1/2))
          enumeration for the P1553 setting); G8 absent (the useful direction
          collapses to ROUTE-04, an already-costed route).
    resource_check_answer:
      examined: true
      reading_found: false
      what_was_examined: >-
        knowledge/ grepped (case-insensitive) for "Berlekamp-Massey",
        "Peterson-Gorenstein-Zierler", "error locator polynomial",
        "Ben-Or"+"Tiwari", and "Prony's method"; H-CREP-001.yaml re-read for
        the exact g_I/r_R/z_R definitions, the eight frozen routes'
        backend citations (ROUTE-04 multipoint evaluation: Borodin-Moenck;
        ROUTE-05 modular composition: Kedlaya-Umans; ROUTE-07
        subresultant/half-gcd: Moroz-Schost), and the constructor obligation.
      answer: >-
        Seven files match a broad Berlekamp-Massey/Peterson-Gorenstein-Zierler
        grep, all off-target for this task: KN-LIT-016 (Wiedemann's algorithm
        -- uses Berlekamp-Massey on a Krylov sequence to recover a sparse
        matrix's minimal polynomial for LINEAR-SYSTEM solving, the index-calculus
        relation-collection linear-algebra bottleneck, a different problem
        entirely from a resultant/remainder construction) and its
        Block-Wiedemann companion KN-LIT-017/KN-TECH-008; KN-LIT-15853c (a
        side-channel attack on the Berlekamp-Massey step of Classic McEliece
        decapsulation -- a physical implementation attack, not an algebraic
        public transducer); KN-TECH-072 (algebraic/fast-algebraic attacks on
