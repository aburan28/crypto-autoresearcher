research_question: >-
  Does any actual recurrence, circuit identity, or retrieved theorem from
  algebraic coding theory (Reed-Solomon/BCH syndrome decoding, error-locator
  polynomial constructions: Berlekamp-Massey, the Euclidean-algorithm decoder,
  Peterson-Gorenstein-Zierler) or sparse polynomial / exponential-sum
  reconstruction (Ben-Or/Tiwari, Prony's method and modern variants)
  instantiate to the frozen P1553 elliptic setting as (a) a typed public
  target-local remainder transducer for r_R mod g_I, or (b) the exact dyadic
  subinterval unit-product interface, passing every item of the frozen
  pre-admission gate, by exploiting the structural analogy between an
  error-locator polynomial's roots (recovered from public syndrome values
  without enumerating all codeword positions) and g_I's roots (the public
  fifth-occurrence labels)?

