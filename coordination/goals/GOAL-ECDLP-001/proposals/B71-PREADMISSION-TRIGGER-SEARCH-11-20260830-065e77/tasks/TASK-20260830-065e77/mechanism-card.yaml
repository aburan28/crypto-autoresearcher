        (possibly corrupted) word, i.e. an object that already carries the
        unknown error pattern; cs/0701070's own abstract frames the problem
        as finding the error locator "in terms of the syndromes of the
        received word." No source computes a syndrome-analogue from public
        channel/curve data alone without first receiving a witness-bearing
        object. Independently, the direction these algorithms make cheap
        (public syndrome -> unknown locator roots) is the reverse of the
        P1553 need (known g_I roots -> public residual r_R mod g_I); the
        matching direction requires evaluating the underlying object at each
