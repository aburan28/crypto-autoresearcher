    - bounded network retrieval was performed via webfetch against the arXiv export API, which answered every query directly this round (no rate-limiting observed)
    - every classical algebraic-coding-theory construction retrieved this round (Berlekamp-Massey, the Euclidean-algorithm decoder, Peterson-Gorenstein-Zierler, and their Groebner-basis/interpolation reformulations) defines "the syndrome" as a function of the received (possibly corrupted) word, per the sources' own abstracts
    - Ben-Or/Tiwari and Prony's-method sparse reconstruction require an a priori sparsity bound and a black-box evaluation oracle, neither established for r_R under the frozen P1553 premises
    - the nearest coding-theoretic/elliptic-curve intersection found (ECFFT, arXiv:2107.08473) is a fast-arithmetic accelerant for the already-costed ROUTE-04, not a new remainder identity
