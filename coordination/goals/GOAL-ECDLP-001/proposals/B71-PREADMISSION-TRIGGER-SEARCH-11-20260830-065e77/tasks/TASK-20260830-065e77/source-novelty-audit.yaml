novelty_falsifiers:
  - A retrieved primary source already states the same frozen-setting P1553 remainder transducer or dyadic unit-product interface with the full gate discharge. (Not found.)
  - The supposed trigger is only a general coding-theory or sparse-reconstruction result renamed for the P1553 setting. (C1, C2 are of this form.)
  - The trigger is an already-costed norm, resultant, quotient, basis, full power-projection, represented-table, or witness-conditioned route. (C1, C2, C3 collapse to ROUTE-04.)
  - The trigger requires a root, factor, witness, support table, source enumeration, or an already-received/corrupted witness-bearing object. (C1, C2 do.)
  - The tracked object carries identical information to the target object under an exact reconstruction map (e.g. CRT), making it a change of coordinates rather than a new object. (C1's syndrome-analogue tracked object is.)
  - The requested object's structural precondition (a sparsity bound, a free evaluation oracle) is demonstrably absent from the frozen setting. (C2 is.)
  - The candidate is off-target (wrong problem or wrong domain entirely). (C4, C5 are.)

