    read: 0 results.
  - url: 'https://arxiv.org/abs/cs/0701070'
    read: >-
      Full abstract: "We address the problem of the algebraic decoding of any
      cyclic code up to the true minimum distance. For this, we use the
      classical formulation of the problem, which is to find the error
      locator polynomial in terms of the syndromes of the received word,"
      using Groebner bases and elimination theory to automate closed-form
      syndrome-to-locator formulas. Confirms the syndrome is computed FROM
      THE RECEIVED WORD.
  - url: 'https://arxiv.org/abs/1209.1198'
    read: >-
      Full abstract: presents a multivariate interpolation formula (MVIF)
      over finite fields; "for any cyclic codes the unknown syndrome
      representation can also be provided by the proposed MVIF ... By
      applying the unknown syndrome representation and the Berlekamp-Massey
      algorithm, one-step decoding algorithms can be developed to determine
      the error locator polynomials." Confirms "the unknown syndrome
      representation" is solved for, not computed from public channel data
      alone; it stands in for the received/corrupted-word-derived syndrome.
  - url: 'https://arxiv.org/abs/0908.2198'
    read: >-
      Full abstract: "The two primary decoding algorithms for Reed-Solomon
      codes are the Berlekamp-Massey algorithm and the Sugiyama et al.
      adaptation of the Euclidean algorithm, both designed to solve a key
      equation. In this article an alternative version of the key equation
      and a new way to use the Euclidean algorithm to solve it are presented,
      which yield the Berlekamp-Massey algorithm." The abstract does not
      itself restate which object plays the role of the syndrome; by
      construction (both algorithms solve "a key equation" for Reed-Solomon
      decoding) the object is the standard received-word-derived syndrome
      polynomial, consistent with every other source read this round; the
      full mathematical statement of the alternative key equation (beyond the
      abstract) was not fetched, since the syndrome-provenance question is
      already settled by the paper's stated problem (Reed-Solomon decoding)
      regardless of which equivalent key-equation formulation is used.
  - url: 'https://arxiv.org/abs/2008.01796'
    read: >-
      Full abstract: presents "a simple syndrome-based fast Chase decoding
      algorithm for Reed-Solomon (RS) codes" using Groebner-bases-over-modules
      theory in place of Berlekamp-Massey properties, for "one-pass Chase
      decoding" with O(n) operations per modified coordinate. Confirms
      "syndrome-based," i.e. syndromes derived from the received
      (error-corrupted) word.

source_entries:
  # --- Retrieved (fetched and read in this task) ---
  - key: syndrome_key_equation_decoders
    citation: >-
      arXiv:0908.2198 (Bras-Amoros, O'Sullivan); arXiv:cs/0701070 (Augot,
      Bardet, Faugere); arXiv:2008.01796 (Shany, Berman); arXiv:1209.1198
      (Chang, Lee, Feng); arXiv:1910.11574, arXiv:1703.00745 (Gomez-
      Torrecillas et al.); arXiv:1310.2473 (Giacomelli); arXiv:1706.03504
      (Bras-Amoros).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a syndrome-to-error-locator construction that could serve as a
      typed public P1553 remainder transducer for r_R mod g_I, exploiting the
      structural analogy between an error-locator polynomial's roots and
      g_I's roots.
    supplied: >-
      Algorithms (Berlekamp-Massey, Sugiyama-Euclidean, Peterson-Gorenstein-
      Zierler) and Groebner-basis/interpolation reformulations that compute
      an error-locator polynomial's coefficients from the syndromes of a
      RECEIVED (possibly corrupted) word, in closed form or via O(t)
      recursive steps.
    supports: []
    limitations: >-
      "The syndrome" is, in every source, a function of the received word --
      an already witness-bearing object for the P1553 analogy; even granting
      a public analogue, the cheap direction (syndrome to unknown roots) is
      the reverse of the direction P1553 needs (known roots to public
      residual), which collapses to the already-costed ROUTE-04 (multipoint
      evaluation). No P1553 typing, no B^(5/4)/o(ell^(1/2)) enumeration.
  - key: sparse_interpolation_prony_reconstruction
    citation: >-
      arXiv:2002.03706 (Huang); arXiv:2207.13874 (Huang, Gao); arXiv:1602.02352,
      1603.03944 (Sauer); arXiv:1506.00450, 1705.11017 (Kunis et al.);
      arXiv:2001.03651 (Keller, Plonka); arXiv:1901.08778 (Stampfer, Plonka);
      arXiv:1907.01547 (Kunis, Romer, von der Ohe).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a sparse-polynomial or exponential-sum reconstruction
      construction that could serve as a typed public P1553 remainder
      transducer for r_R mod g_I.
    supplied: >-
      Ben-Or/Tiwari-style and Prony's-method algorithms that recover a sparse
      object with an a priori bounded number t of nonzero terms from O(t)
      black-box evaluations, via a Hankel/Toeplitz linear-algebra step and
      root-finding for the support.
    supports: []
    limitations: >-
      No a priori sparsity bound is established for r_R (or r_R mod g_I in a
      native basis) anywhere in the frozen records; each black-box evaluation
      of the underlying object at a chosen point costs exactly the
      already-costed ROUTE-04 materialization cost. No P1553 typing, no
      B^(5/4)/o(ell^(1/2)) enumeration.
  - key: ecfft_fast_evaluation
    citation: arXiv:2107.08473 (Ben-Sasson, Carmon, Kopparty, Levit, Elliptic Curve Fast Fourier Transform (ECFFT) Part I).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To check whether the nearest coding-theoretic/elliptic-curve
      intersection literature bears on the P1553 remainder question.
    supplied: >-
      Fast polynomial multipoint evaluation/interpolation using elliptic-
      curve point sets as an FFT-friendly evaluation domain, enabling
      efficient Reed-Solomon-style encoding in fields lacking large
      smooth-order multiplicative subgroups.
    supports: []
    limitations: >-
      A fast-arithmetic implementation technique for the already-costed
      ROUTE-04 (multipoint evaluation) family (same backend citation
      lineage, Borodin-Moenck fast modular transforms, in H-CREP-001); its
      evaluation-domain points are unrelated to g_I's label-polynomial
      roots; does not address discrete logarithms or supply a new remainder
      identity. Declined as an already-costed-route accelerant.

  # --- kb (internal corpus, resolved by grep and read in this task) ---
  - key: wiedemann_block_wiedemann
    citation: >-
      KN-LIT-016 (Wiedemann, Solving sparse linear equations over finite
      fields); KN-LIT-017 (Coppersmith, block Wiedemann); KN-TECH-008
      (sparse linear algebra technique note).
    provenance: kb
    opened_in_task: true
    read_for: >-
      Internal-corpus resource-check pass for component (a): whether the
      corpus's existing Berlekamp-Massey-adjacent record (Wiedemann's
      algorithm) bears on the P1553 remainder question.
    supplied: >-
      Wiedemann's algorithm recovers the minimal polynomial of a large sparse
      matrix on a Krylov sequence via Berlekamp-Massey, for solving sparse
      LINEAR systems (the index-calculus relation-collection linear-algebra
      bottleneck).
    supports: []
    limitations: >-
      Wrong object entirely: a linear-system solver, not a resultant/
      remainder-of-a-polynomial construction; does not reach r_R mod g_I from
      E, P, Q under any accounting. Declined as off-target.
  - key: lfsr_annihilator_attacks
    citation: KN-TECH-072 (Algebraic and fast algebraic attacks on LFSR-based stream ciphers).
    provenance: kb
    opened_in_task: true
    read_for: >-
      Internal-corpus resource-check pass for component (b): whether the
      corpus's existing annihilator-polynomial record bears on the P1553
      remainder question.
    supplied: >-
      Algebraic and fast-algebraic attacks on LFSR-based stream ciphers using
      Boolean-function annihilator polynomials and algebraic immunity.
    supports: []
    limitations: >-
      Wrong domain (symmetric cryptanalysis of stream ciphers), not the
      P1553 commutative label polynomial ring; does not address a resultant
      or a remainder modulo g_I. Declined as off-target.
  - key: side_channel_bm_mceliece
    citation: KN-LIT-15853c (Key-recovery side-channel attack on the Berlekamp-Massey decoding algorithm in the Classic McEliece KEM).
    provenance: kb
    opened_in_task: true
    read_for: >-
      Internal-corpus resource-check pass: whether this Berlekamp-Massey-
      adjacent record bears on the P1553 remainder question.
    supplied: A physical side-channel (power/timing) key-recovery attack exploiting secret-dependent control flow in a hardware/software Berlekamp-Massey implementation.
    supports: []
    limitations: >-
      A physical implementation attack against a specific decapsulation
      routine, not an algebraic public transducer; not typed to the P1553
      setting, no relevance to a public r_R mod g_I construction. Declined
      as off-target.

