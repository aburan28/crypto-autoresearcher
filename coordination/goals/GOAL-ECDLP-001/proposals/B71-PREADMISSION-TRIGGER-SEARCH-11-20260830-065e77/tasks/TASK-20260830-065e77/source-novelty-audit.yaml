    nearest_retrieved_work: >-
      Berlekamp-Massey / Sugiyama-Euclidean-algorithm key-equation solvers and
      their Groebner-basis reformulations (Bras-Amoros & O'Sullivan; Augot,
      Bardet & Faugere; Shany & Berman; Chang, Lee & Feng); Peterson-
      Gorenstein-Zierler literature.
    proposed_delta: >-
      A typed public computation of r_R mod g_I from E, P, Q alone, inside the
      B^(5/4) interface budget, exploiting the error-locator/syndrome
      structural analogy, that is not an already-costed norm/resultant/
      quotient/multipoint-evaluation route.
    novelty_status: unverified
    evidence: >-
      Retrieved syndrome/error-locator results exist but none instantiates to
      the frozen P1553 setting; every source's syndrome-analogue requires an
      already-received/corrupted word, and the direction these algorithms
      make cheap is the reverse of the direction P1553 needs. No novelty or
      known-status claim is made beyond the retrieved evidence.
  p1553_remainder_transducer_via_sparse_interpolation:
