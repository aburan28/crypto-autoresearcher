failure_localization:
  - symptom: candidate is only an assertion that a specialized circuit may exist
    localizes_to: L1_NAMED_TRIGGER_OBJECT
    interpretation: not a trigger; G1 fails
  - symptom: '"the syndrome" or "the evaluations" require an already-received/corrupted word or witness-bearing object'
    localizes_to: L2_FROZEN_SETTING_TYPING
    interpretation: excluded input; G2 fails (C1 this round)
  - symptom: candidate requires an a priori sparsity bound or a free evaluation oracle not established in the frozen setting
    localizes_to: L2_FROZEN_SETTING_TYPING
    interpretation: unestablished structural precondition; G2 fails (C2 this round)
  - symptom: candidate's cheap direction is the reverse of the direction P1553 needs
    localizes_to: L2_FROZEN_SETTING_TYPING
    interpretation: directional mismatch; G2 fails (C1 this round)
  - symptom: candidate cannot be typed into the frozen P1553 setting at all (wrong role or wrong domain)
    localizes_to: L2_FROZEN_SETTING_TYPING
    interpretation: off-target; G2 fails (C3, C4, C5 this round)
  - symptom: any cost axis unbounded or the required oracle costs the same as an already-costed materialization route
    localizes_to: L3_FULL_COST_ENUMERATION
    interpretation: no B^(5/4)/o(ell^(1/2)) certificate; G3 fails
  - symptom: coalesced or nonreduced fibre loses label or multiplicity
    localizes_to: L4_LINEAGE_MULTIPLICITY_FIBRES
    interpretation: G4 fails
  - symptom: output invariant under Q to -Q
    localizes_to: L5_Q_VS_MINUS_Q
    interpretation: sign channel absent; G5 fails
  - symptom: Q coefficient unknown or non-invertible
    localizes_to: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    interpretation: G6 fails
  - symptom: unranking needs full source or support enumeration
    localizes_to: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    interpretation: G7 fails
  - symptom: candidate's matching direction reduces to a norm/resultant/quotient/basis/power-projection/represented-table/witness-conditioned route
    localizes_to: L8_NOT_ALREADY_COSTED_ROUTE
    interpretation: already-costed route; G8 fails (C1, C2, C3 this round -- all collapse to ROUTE-04)
  - symptom: candidate proves too much on a planted generic non-elliptic control instance
    localizes_to: first purported P1553-structure lemma that fails to distinguish it
    interpretation: proof proves too much (method-ceiling nearby-object control); confirms G2 failure
  - symptom: tracked object carries identical information to the target object under an exact reconstruction map (e.g. CRT)
    localizes_to: lossy_projection_test, component a
    interpretation: change of coordinates, not a new object; disqualifies the candidate before any cost question arises

stopping_rules:
  - Stop before implementation or experiment execution because this role has no approval to run either.
  - Stop admission if any of G1 through G8 remains undisclosed or false for a candidate.
  - Treat crashes, timeouts, missing dependencies, unavailable backends, rate-limited or 503 retrieval endpoints, and 404 full-text fetches as infrastructure outcomes only, never as mathematical evidence.
  - Preserve all untested variants and the coordinate-aware P1553 remainder and dyadic unit-product routes when reporting a scoped failure.
  - A demonstrated directional or oracle-cost obstruction within one reading of a literature area (C1, C2 this round) is scoped exactly to the specific syndrome/oracle formulations read, not generalized to a claim about coding theory or sparse interpolation in general.

