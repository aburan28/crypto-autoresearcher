target_statement:
  informal: >-
    An actual recurrence, circuit identity, or retrieved theorem from
    algebraic coding theory or sparse-interpolation/exponential-sum
    reconstruction instantiates to the frozen elliptic setting as a typed
    public P1553 target-local remainder transducer for r_R mod g_I or the
    exact dyadic subinterval unit-product interface, and passes every item of
    the frozen pre-admission gate (G1-G8).
  quantifiers: >-
    There exists one named public object T (a recurrence, circuit identity, or
    theorem) and one fully specified public construction rule C such that, for
    the frozen P1553 setting (rings, bases, CRT components, interval geometry,
    public g_I and r_R construction fixed before any witness is observed), C
    computes r_R mod g_I (or the dyadic unit-product step) from E, P, Q alone,
    without roots, factors, witnesses, support tables, or source enumeration;
    the full state/update-map/degree/rank/nonzero/coefficient-growth/live-
    storage/traffic/build-query/amortization enumeration lies within the
    inherited B^(5/4) interface budget and strict end-to-end o(ell^(1/2)) time,
    memory, and data; lineage and multiplicity are preserved on coalesced and
    nonreduced fibres; Q is distinguished from -Q; known P and Q coefficients
    are yielded with invertible Q coefficient; output-sensitive source
    unranking is supported; and T is shown not to be an already-costed norm,
    resultant, quotient, full power-projection, represented-table, or witness-
    conditioned route.
  present_support: none

lemma_decomposition:
  - id: L1_NAMED_TRIGGER_OBJECT
    responsibility: >-
      Name the actual recurrence, circuit identity, or retrieved theorem T,
      with its exact statement and source, and verify it is not merely the
      assertion that a specialized circuit may exist.
    status: open
    falsifier: >-
      T is only an existence assertion, a heuristic, a withdrawn or
      gap-flagged result, or a result whose hypotheses are not met by the
      frozen setting.
  - id: L2_FROZEN_SETTING_TYPING
    responsibility: >-
      Type T into the frozen P1553 setting: rings, bases, CRT components,
      interval geometry, public g_I and r_R construction, and an exact
      computation from E, P, Q without roots, factors, witnesses, support
      tables, or source enumeration. For coding-theoretic T, this includes
      identifying what plays the role of "the syndrome" or "the evaluations"
      and verifying it is genuinely computable from E, P, Q alone rather than
      from an already-received/corrupted or witness-bearing object.
    status: open
    falsifier: >-
      Any of the frozen objects is left implicit; the computation requires an
      excluded input (a root, factor, witness, support table, or source
      enumeration); the "syndrome" or "evaluations" require an
      already-received/corrupted word or an a priori unestablished sparsity
      bound; or the matching direction between T's cheap operation and
      P1553's needed operation is reversed (T is cheap in the direction
      opposite to the one P1553 requires).
  - id: L3_FULL_COST_ENUMERATION
    responsibility: >-
      Enumerate state, update maps, degrees, ranks, nonzeros, coefficient
      growth, live storage, traffic, build/query split, and amortization, and
      bound every axis within the B^(5/4) interface budget and strict
      end-to-end o(ell^(1/2)) time, memory, and data.
    status: open
    falsifier: >-
      Any charged axis is unbounded, at or above ell^(1/2), or the black-box
      evaluation oracle T requires costs the same as an already-costed
      materialization route.
  - id: L4_LINEAGE_MULTIPLICITY_FIBRES
    responsibility: Preserve lineage and multiplicity on coalesced and nonreduced fibres.
    status: open
    falsifier: A coalesced or nonreduced fibre loses its occurrence label or multiplicity under T.
  - id: L5_Q_VS_MINUS_Q
    responsibility: Distinguish Q from -Q in the transducer output.
    status: open
    falsifier: The output is invariant under Q mapped to -Q with no separately proved orientation channel.
  - id: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    responsibility: Yield known P and Q coefficients with invertible Q coefficient.
    status: open
    falsifier: The Q coefficient is not known a priori or is not invertible on the declared strata.
  - id: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    responsibility: Support output-sensitive source unranking.
    status: open
    falsifier: Unranking requires enumerating the full source or a support table.
  - id: L8_NOT_ALREADY_COSTED_ROUTE
    responsibility: >-
      Show T is not an already-costed norm, resultant, quotient, full power-
      projection, represented-table, or witness-conditioned route; for
      coding-theoretic or sparse-interpolation machinery specifically, show
      the matching (P1553-useful) direction of T is not simply ROUTE-04
      (multipoint evaluation) or another already-costed route under a
      different name.
    status: open
    falsifier: T's matching direction reduces to one of the excluded already-costed routes, or the structured-instance tension is not resolved in T's favor.

dependency_order:
  - [L1_NAMED_TRIGGER_OBJECT, L2_FROZEN_SETTING_TYPING]
  - [L2_FROZEN_SETTING_TYPING, L3_FULL_COST_ENUMERATION]
  - [L2_FROZEN_SETTING_TYPING, L4_LINEAGE_MULTIPLICITY_FIBRES]
  - [L2_FROZEN_SETTING_TYPING, L5_Q_VS_MINUS_Q]
  - [L2_FROZEN_SETTING_TYPING, L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q]
  - [L2_FROZEN_SETTING_TYPING, L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING]
  - [L1_NAMED_TRIGGER_OBJECT, L8_NOT_ALREADY_COSTED_ROUTE]
  - [L3_FULL_COST_ENUMERATION, L8_NOT_ALREADY_COSTED_ROUTE]

cheap_audits:
  exact_baseline_reproduction:
    applies: true
    baseline: >-
      The frozen gate items G1-G8 read from the live next_action, and the
      g_I/r_R/z_R definitions and eight frozen already-costed routes
      (ROUTE-01 component resultants through ROUTE-08 displacement
      representation, with ROUTE-04 multipoint evaluation backed by
      Borodin-Moenck fast modular transforms) read from H-CREP-001.
    attack_plan:
      - restate each gate item G1-G8 verbatim from the live next_action
      - restate g_I, r_R, z_R and the eight frozen routes (with backend citations) from H-CREP-001
      - for each candidate, identify the object playing the role of "the syndrome"/"the evaluations" and mark each gate item present/absent with a named reason
      - confirm no candidate is admitted by assertion of a possibly existing specialized circuit
    expected_break: >-
      A candidate that carries G1 (an actual algorithm or theorem) but whose
      "syndrome"/"evaluations" object requires an already-received/corrupted
      or witness-bearing input (G2), or whose matching direction collapses to
      an already-costed route (G8).
    pass_condition: >-
      Every gate item is explicitly present for a candidate, with the exact
      construction and full cost enumeration; otherwise the candidate is
      recorded not intake-ready with its absent items named.
    current_result: >-
      Performed statically. C1 (syndrome/key-equation decoders) and C2
      (sparse-interpolation/Prony reconstruction) each carry G1 present but
      fail G2 (syndrome requires an already-received/corrupted word, or a
      sparsity bound/oracle absent from the frozen setting), G3, and G8 (the
      P1553-matching direction collapses to ROUTE-04). C3 (ECFFT) is a
      fast-arithmetic accelerant for the same already-costed route (G2, G8
      absent). C4-C5 (internal-corpus Wiedemann/Block-Wiedemann and LFSR
      annihilator attacks) are off-target (wrong problem/domain). No
      candidate is intake-ready. No experiment was run.
  observation_collision_search:
    applies: true
    collision_object: >-
      A retrieved or internal object that is the same observable as a trigger
      already screened in one of the six terminal pre-admission packets, or
      in the seventh-, eighth-, ninth-, or tenth-round candidate sets, i.e. a
      duplicate that would re-run a frozen screen.
    attack_plan:
      - compare each candidate against the six screened families and their scoped negative boundaries
      - compare each candidate against the seventh-, eighth-, ninth-, and tenth-round candidate sets and record which, if any, is a re-derivation
      - confirm this round does not reopen round ten's closed deck-local mixed-radix/CRT sub-avenue over the two named P1553 mixed-radix packets
      - record which candidate, if any, falls inside a screened family
      - check whether any candidate is a new trigger specific to a screened family satisfying the post-screen revisit condition
    expected_break: >-
      A candidate that is actually a re-run of a screened family (SUBRES-
      COFACTOR in particular, given the Euclidean-algorithm/Bezout-cofactor
      family resemblance) or a re-derivation of a seventh-round fast-remainder
      candidate (given ECFFT's family resemblance to Kedlaya-Umans-style fast
      arithmetic), or a reopening of round ten's closed mixed-radix/CRT
      sub-avenue.
    pass_condition: >-
      No candidate re-runs a frozen screen, re-derives a prior-round
      candidate, or reopens round ten's closure; any candidate inside a
      screened family is shown to be a new trigger satisfying the revisit
      condition, or is recorded as a non-revisit literature check.
    current_result: >-
      Performed statically. This round does not re-derive the seventh-,
      eighth-, ninth-, or tenth-round candidate sets and does not reopen round
      ten's closed mixed-radix/CRT sub-avenue (no candidate this round touches
      the deck/interval geometry of the two named P1553 mixed-radix packets).
      C1 is adjacent to the SUBRES-COFACTOR screened family in spirit (the
      extended Euclidean algorithm produces a cofactor/Bezout-style relation
      in both the key-equation and the subresultant setting), recorded as
      newly retrieved literature checked against the gate, not a re-run. C3
      (ECFFT) is adjacent to round seven's fast-remainder/Kedlaya-Umans
      sub-avenue in spirit, but ECFFT itself was not among round seven's
      retrieved objects (round seven's fast-remainder set was Poteaux-Schost,
      Guo-Narayanan-Umans, Hubrechts per the round-seven terminal note); not a
      re-run. None is a new trigger satisfying the revisit condition.
  quantifier_order_statement:
    applies: true
    required_order:
      - freeze the P1553 rings, bases, CRT components, and interval geometry
      - fix the public g_I and r_R construction
      - name the trigger object T (recurrence, circuit identity, or theorem)
      - receive public E, P, Q
      - compute r_R mod g_I (or the dyadic unit-product step) from E, P, Q alone
      - enumerate the full cost and verify the B^(5/4)/o(ell^(1/2)) bounds
      - verify lineage/multiplicity, Q vs -Q, invertible Q coefficient, and source unranking
    forbidden_order: >-
      Observe a received/corrupted word, a witness, a root, a factor, a
      support table, or a source enumeration first and then choose T, the
      rings, the bases, or the g_I/r_R construction; or assume a sparsity
      bound or a free evaluation oracle that the frozen setting does not
      establish before naming T.
    expected_break: >-
      A candidate whose typing into the frozen setting requires an excluded
      input, moving witness-equivalent work into the constructor.
    pass_condition: >-
      All frozen objects are fixed before any witness is observed, and T is
      chosen from public data alone.
    current_result: >-
      Statement only, checked per candidate. C1's "syndrome" and C2's
      "black-box evaluations" both require an object (a received/corrupted
      word, or a per-point evaluation of the underlying dense object) that is
      not fixed independently of the witness under the frozen P1553 premises;
      C3-C5 do not reach a P1553 typing stage at all (wrong role or wrong
      domain), so no quantifier order can even be posed for them.
  method_ceiling_nearby_object_control:
    applies: true
    nearby_object: >-
      A generic, non-elliptic Reed-Solomon/BCH decoding instance (an
      arbitrary received word over a finite field with a planted error
      pattern of the same length/degree profile as g_I and r_R), for which
      the conclusion "the same syndrome/error-locator machinery recovers a
      P1553 target-local remainder or witness" is known false, since the
      instance has no elliptic-curve provenance at all.
    attack_plan:
      - apply the identical candidate construction (Berlekamp-Massey, the Euclidean-algorithm decoder, Ben-Or/Tiwari) to the planted generic non-elliptic instance
      - prohibit use of any elliptic-curve-specific fact absent from the claimed lemmas
      - identify the first lemma that would need to distinguish the genuine P1553 object from the generic control
      - reject the argument if it still returns a purported P1553 witness/remainder certificate on the planted generic instance
    expected_break: >-
      A syndrome/error-locator or sparse-interpolation argument based only on
      general coding-theoretic or sparse-reconstruction structure proves too
      much and would "recover" a locator/coefficient result on the planted
      generic instance with equal ease, because nothing in the argument used
      an elliptic-curve-specific fact; this confirms the candidate never
      typed the frozen P1553 setting in the first place (it is a general
      coding-theory result, not a P1553-specific one), consistent with the
      G2 failure already recorded.
    pass_condition: >-
      A named P1553-structure lemma would need to reject the generic control
      before granting a P1553 witness/remainder; no candidate this round
      supplies such a lemma, so none passes.
    current_result: >-
      Not run as an experiment (no experiment authorized). Stated
      analytically: C1's syndrome-decoding argument and C2's sparse-
      interpolation argument are both generic coding-theory/signal-processing
      results with no P1553-structure lemma; each would apply identically
      (and just as fruitlessly, in the sense of not producing an ECDLP
      witness) to the planted generic non-elliptic instance, confirming that
      neither candidate ever typed the frozen P1553 setting -- consistent
      with the recorded G2 failure. No computation was executed; this is a
      stated control, not a run result.
  lossy_projection_test:
    applies: true
    tracked_object_component_a: >-
      "The tuple of values of r_R at each of g_I's deg(g_I) known roots,"
      proposed as the syndrome-analogue tracked object for C1.
    tracked_object_component_b: >-
      "t black-box evaluations of r_R (or a putative sparse residual) at
      points 1, w, w^2, ...," proposed as the tracked object for C2's
      Ben-Or/Tiwari-style construction.
    test_result_component_a: >-
      FAILS at the definitional stage: because g_I is squarefree, this tuple
      and r_R mod g_I are in exact bijection via the Chinese Remainder
      Theorem on g_I's linear factors. No information is discarded in either
      direction, so this is a change of coordinates for the identical object,
      not a lossy projection -- per the inventor protocol, "a projection that
      loses nothing is a change of coordinates, not a new object." Computing
      it costs exactly what ROUTE-04 (direct multipoint evaluation) already
      costs.
    test_result_component_b: >-
      Genuinely lossy (t samples discard almost all of the Theta(B^3)-scale
      object's information), but fails the "discarded compatibly with the
      target's operations" clause: no recurrence is established by which
      incrementing E, P, or Q updates the t sample values without
      re-evaluating the whole object, and no sparsity bound t is established
      for r_R under the frozen premises, so the projection's target is not
      even well-defined at the scale the frozen setting requires.
    conclusion: >-
      Neither tracked object survives the lossy-projection test: component a
      is not lossy at all (a coordinate change), and component b is lossy but
      not compatibly discarded. This is an algebraic, zero-compute audit
      performed before any experiment was proposed, consistent with the
      requirement to apply this test before proposing any experiment; no
      experiment is proposed as a result.

