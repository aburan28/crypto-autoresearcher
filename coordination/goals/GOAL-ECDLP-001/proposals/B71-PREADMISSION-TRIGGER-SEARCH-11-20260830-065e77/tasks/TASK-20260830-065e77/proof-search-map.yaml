current_assessment:
  positive_gates_discharged: 0
  positive_gates_total: 8
  disposition: scoped_no_candidate
  rationale: >-
    The proof map exposes two distinct structural gaps. Component (a):
    syndrome/error-locator constructions (Berlekamp-Massey, the
    Euclidean-algorithm decoder, Peterson-Gorenstein-Zierler, and their
    Groebner-basis/interpolation reformulations) fail G2 because "the
    syndrome" requires an already-received/corrupted word carrying the
    unknown, and because the direction these algorithms make cheap is the
    reverse of the direction P1553 needs, collapsing the matching direction
    to the already-costed ROUTE-04 (G8). Component (b): sparse-interpolation
    and Prony-method reconstruction (Ben-Or/Tiwari and modern variants) fail
    G2 because no a priori sparsity bound is established for r_R and no free
    evaluation oracle exists under the frozen premises; the nearest
    coding-theoretic/elliptic-curve intersection found (ECFFT) is a
    fast-arithmetic accelerant for the same already-costed route (G8). Two
    internal-corpus items (Wiedemann/Block-Wiedemann linear algebra; LFSR
    annihilator attacks) are off-target (wrong problem/domain). The
    lossy-projection test independently disqualifies the natural tracked
    object for component (a) as a mere change of coordinates, and the
    tracked object for component (b) as incompatibly discarded. No audit was
    executed as an experiment, and no broad route is closed: both structural
    findings are scoped exactly to the specific literature formulations read
    this round.
