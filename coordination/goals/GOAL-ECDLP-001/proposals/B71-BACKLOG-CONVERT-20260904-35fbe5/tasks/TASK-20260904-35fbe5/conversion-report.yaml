        quoting rules to the content. This is the systematic defence rather than
        a per-string audit.
      - >-
        The few plain scalars that remain are short and are single-quoted
        wherever they contain a colon, a comma inside a flow mapping, or
        parenthesis-heavy text.
      - >-
