    - proposal: IDEA-20260808-2e14f7
      short_name: 'Coordinate-degree optimisation for the factor base'
      converted: false
      already_converted_elsewhere: true
      converted_by: 'a prior task on an unmerged branch; NOT by TASK-20260904-35fbe5'
      existing_records_reported_by_dispatcher: [H-ECDLP-30a2a1]
