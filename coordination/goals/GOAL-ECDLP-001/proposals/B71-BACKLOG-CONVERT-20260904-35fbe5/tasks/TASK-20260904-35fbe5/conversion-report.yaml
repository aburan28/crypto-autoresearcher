  rows:

    - proposal: IDEA-20260815-3c9919
      short_name: 'Pollard rho charged baseline'
      converted: true
      converted_by: TASK-20260904-35fbe5
      assigned_hypothesis: H-ECDLP-f3d2fd
      assigned_experiment: EXP-ECDLP-4320a7
      hypothesis_path: ledger/hypotheses/H-ECDLP-f3d2fd.yaml
      experiment_path: experiments/EXP-ECDLP-4320a7/specification.yaml
      hypothesis_status: proposed
      experiment_status: review_required
      approved_by: null
      scale_tier: toy
      scale_tier_reason: >-
        EARNED, NOT CONSERVATIVE. Prime-order subgroups at 16, 20, 24 and 28 bits
        are CONSTRUCTED and solved, so toy-scale evidence genuinely exists and
        every tested size is at or below the 32-bit toy boundary. This is the
        contrast with batch 1, where tier null was correct because no curve was
        instantiated at any size.
      falsification_criterion_one_line: >-
        A known solution is not recovered; or the fitted step-count constant
        falls outside plus or minus 5 percent of the prediction for the DECLARED
        walk variant while the random-oracle control is also off; or the
        constant's slope against log N excludes zero, refuting the transferable
        half of HEUR-RHO-BASE-1; or parallel speedup at 8 workers falls below 0.6
        times 8, which is an implementation problem and not a finding; or Stage 0
        finds a completed run that already measures the constant, which refutes
        the proposal's own premise.
      can_it_fail: >-
        Yes, in six independent directions, two of them forced-value controls
        that no tuning survives, and one of them a supersession check that can
        terminate the line at zero compute.
      conditionality_preserved: >-
        HEUR-RHO-BASE-1 carried with its original id under source_id_in_proposal,
        its formal statement verbatim, and its rigorous-ingredient-plus-THE-GAP
        justification quoted in full including the proposal's own warning that
        conflating the step-count and wall-clock constants is the specific error
        it guards against. supporting_results left EMPTY because every source is
        recalled. target_complexity carried verbatim under
        source_target_complexity.
      cost_model_pattern_compliance: >-
        measured_vs_modeled block present with both lists; five optimistic
        assumptions each with an explicit BIAS DIRECTION; peak memory a primary
        metric reported beside time in every table, with a completed_invalid rule
        for any table omitting it; time-memory tradeoff stated with its
        interpolation range given as exactly [theta, 4*theta] at 20 bits and an
        explicit statement that two points do not determine a curve.
      substantive_finding_from_conversion: >-
        THE PROPOSAL'S PREMISE IS ALREADY PARTLY FALSE AND THE CONTRACT SAYS SO.
        experiments/EXP-RHO-60da4f/specification.yaml is an APPROVED contract in
        this worktree whose secondary metrics include 'collision_constant:
        measured steps / sqrt(N/2)' and 'peak_rss_bytes and distinguished-point
        table size', at tier medium over 2^32 to 2^48. The parent proposal
        asserts that no record in this corpus measures rho's constant. That is
        false at the CONTRACT level. Whether it is false at the RUN level was not
        determined here and is Stage 0 of the new contract, which is a
        terminator. What survives cleanly is the parallel arm: EXP-RHO-60da4f
        states in its own optimistic-assumption list that 'Parallelisation is
        modeled as near-linear per KN-TECH-006 rather than measured on a
        cluster', so the measured speedup curve is genuinely unmeasured here.
      largest_coordinator_addition: >-
        THE WALK-VARIANT DECLARATION. The proposal's HEUR-RHO-BASE-1 names
        sqrt(pi*N/4), about 0.8862*sqrt(N), as its rigorous ingredient. That is
        the constant for a walk over an effectively halved state space, i.e. the
        negation-quotiented walk; the un-quotiented walk predicts sqrt(pi*N/2),
        about 1.2533*sqrt(N). The proposal does not say which it assumes and the
        two differ by sqrt(2), so its own acceptance test is ambiguous by more
        than any band worth pre-registering. The contract does not resolve this
        by choosing; it makes the variant an approval-time declaration and
        reports both candidates, because choosing after seeing the data would
        make the criterion unfalsifiable.
      nulls_and_justifications:
        - field: hypothesis.asymptotic_claim
          value: null
          justification: >-
            No complexity improvement is claimed and no exponent moves; the
            parent proposal states it proposes no algorithm for any hard problem
            and that the incumbent is measured and not improved. Every value of
            the claim_kind enum would be false. Annotated in
            asymptotic_claim_note.
        - field: hypothesis.proof_search_map (all subfields)
          value: null
          justification: >-
            Purely empirical; not_applicable_reason filled at length. The
            proposal states under object_first_candidate that no tracked object
            propagating under a group law is proposed.
        - field: hypothesis.rerandomization
          value: null
          justification: No worst-to-average-case device is used or proposed.
        - field: 'heuristic_assumptions[HEUR-RHO-BASE-1].supporting_results'
          value: '[]'
          justification: >-
            The birthday analysis and the van Oorschot-Wiener parallelisation are
            RECALLED in the parent proposal and no agent in this program has
            opened either. AGENTS.md rule 9 forbids a recalled reference from
            discharging this field. A supporting_results_note says so in place.
        - field: 'structural_ingredients[*].verified_by'
          value: null
          justification: >-
            Null exactly where provenance is 'recalled', per the template. The
            two 'internal' ingredients -- EXP-RHO-60da4f and its
            C2_random_oracle_walk control -- carry verified_by
            TASK-20260904-35fbe5 because they WERE opened during conversion.
        - field: experiment.scale_relevance.correspondence
          value: null
          justification: >-
            Instances are sampled directly at the tested sizes; no
            correspondence trick is used to reach a scale the computation cannot
            reach. Annotated in correspondence_note.
        - field: experiment.replication.seeds
          value: '[]'
          justification: >-
            EMPTY AT CONTRACT TIME AND FILLED AT APPROVAL, not empty because the
            work is deterministic. This experiment IS stochastic, so the binding
            requirement recorded in seeds_note is that a master seed is recorded
            in the approval decision before execution, that every derived seed is
            logged, and that the same frozen instance set is reused by every arm.

    - proposal: IDEA-20260815-f81c17
      short_name: 'BSGS memory-bound crossover'
      converted: true
      converted_by: TASK-20260904-35fbe5
      assigned_hypothesis: H-ECDLP-3ac227
      assigned_experiment: EXP-ECDLP-709063
      hypothesis_path: ledger/hypotheses/H-ECDLP-3ac227.yaml
      experiment_path: experiments/EXP-ECDLP-709063/specification.yaml
      hypothesis_status: proposed
      experiment_status: review_required
      approved_by: null
      scale_tier: toy
      scale_tier_reason: >-
        EARNED. Prime-order subgroups at 16, 20, 24 and 28 bits are CONSTRUCTED
        and solved under real enforced memory ceilings. The memory budgets, 4 KiB
        to 256 KiB, are tiny by design so the ceiling binds inside a reachable
        size range; they are not models of any deployment and the record says so.
      falsification_criterion_one_line: >-
        A null misbehaves -- unbounded BSGS fails to beat rho in operations, or
        fixed-table BSGS runs under an 8-byte budget, or an over-budget
        allocation is not terminated, any of which means the ceiling was
        simulated rather than enforced and voids every memory number; or the
        crossover lies outside the reachable range, in which case a BOUND is
        reported rather than a crossover; or a crossover sits inside the
        campaign's working sizes, which means comparisons there have one baseline
        and not two; or measured bytes per entry vary by more than 20 percent
        across sizes, refuting HEUR-BSGS-1.
      can_it_fail: >-
        Yes, in eight directions. Two are forced-value nulls that fail in
        opposite directions, one is a separate enforcement probe, and the
        headline outcome -- a crossover inside the campaign's working sizes -- is
        itself a negative about the campaign's own control sets.
      conditionality_preserved: >-
        HEUR-BSGS-1 carried with its original id, its formal statement verbatim,
        and its rigorous-ingredient-plus-THE-GAP justification quoted in full
        including the observation that the per-entry cost 'can be optimised in
        ways that shift the crossover by a constant that matters exactly where
        the crossover sits'. Its SAMPLE/COMPARISON/TAIL CHECK/TRANSFER validation
        plan carried verbatim and implemented as the largest-size tail check.
        target_complexity carried verbatim.
      cost_model_pattern_compliance: >-
        measured_vs_modeled block present; five optimistic assumptions each with
        a BIAS DIRECTION, and they deliberately do NOT all point the same way --
        two overstate BSGS memory and pull the crossover down, one understates
        arm B's cost and pushes it up -- with an explicit statement that they are
        not netted out. Peak memory is a primary metric in every cell of a
        twelve-cell table. The time-memory tradeoff is not merely stated but is
        the object of the experiment, with its interpolation range given as
        exactly the three budgets at the four sizes and no functional form fitted
        outside them.
      largest_coordinator_addition: >-
        THE TWO-ARM SPLIT. The proposal's NULL 2 describes BSGS that 'cannot run
        at all' while its crossover language describes BSGS that 'stops being
        competitive'. Those are different algorithms: fixed-table BSGS has a
        CLIFF and no crossover, memory-constrained BSGS has a crossover and no
        cliff. Running one arm only would either make the proposal's own null
        unreachable or make its crossover undefined. Both arms are run and
        reported separately, and presenting a cliff as a crossover is named as
        the central reporting error the contract can make. The closed form
        N* = (c*E)^2, which the proposal does not supply and without which its
        crossover claim is not decidable, is derived and placed in the MODELED
        column.
      declared_dependency_preventing_double_payment: >-
        This contract's NULL 1, unbounded-memory BSGS on shared instances, IS
        EXP-ECDLP-4320a7's R6 metric. The contract records that if the sibling
        runs first its result must be REUSED rather than re-measured, and makes
        that a named approval-gate decision. The campaign must not buy the
        unconstrained BSGS measurement twice.
      nulls_and_justifications:
        - field: hypothesis.asymptotic_claim
          value: null
          justification: >-
            No complexity claim; the proposal states the incumbents are BSGS and
            rho themselves, measured under memory constraint and not improved.
            Annotated in asymptotic_claim_note.
        - field: hypothesis.proof_search_map (all subfields)
          value: null
          justification: >-
            Purely empirical; not_applicable_reason filled, including why the one
            closed form used is arithmetic over two measured quantities rather
            than a proof obligation.
        - field: hypothesis.rerandomization
          value: null
          justification: No worst-to-average-case device is used or proposed.
        - field: 'heuristic_assumptions[HEUR-BSGS-1].supporting_results'
          value: '[]'
          justification: >-
            The entry-count half is exact by construction and needs no supporting
            result; the per-entry-cost half has no rigorous support and the
            proposal claims none. Filling this field would present an
            implementation fact as a distribution theorem.
        - field: experiment.scale_relevance.correspondence
          value: null
          justification: Instances sampled directly and inherited from the sibling contract.
        - field: experiment.replication.seeds
          value: '[]'
          justification: >-
            EMPTY BECAUSE THE SEEDS ARE INHERITED, NOT DRAWN. The contract reuses
            EXP-ECDLP-4320a7's frozen instance set verbatim so every comparison
            is paired against the same rho measurements. seeds_note makes
            recording the inherited master seed binding and makes an arm that
            draws its own instances completed_invalid.

    - proposal: IDEA-20260815-284aff
      short_name: 'Multi-target amortization with storage charged'
      converted: true
      converted_by: TASK-20260904-35fbe5
      assigned_hypothesis: H-ECDLP-4d21c2
      assigned_experiment: EXP-ECDLP-7dba4b
      hypothesis_path: ledger/hypotheses/H-ECDLP-4d21c2.yaml
      experiment_path: experiments/EXP-ECDLP-7dba4b/specification.yaml
      hypothesis_status: proposed
      experiment_status: review_required
      approved_by: null
      scale_tier: toy
      scale_tier_reason: >-
        EARNED. One prime-order subgroup at 24 bits is CONSTRUCTED and up to 64
        targets in it are genuinely solved. The proposal's own transfer statement
        -- 'TRANSFER: none beyond tested sizes and ratios' -- is preserved
        literally, and the record states that 64 targets against a 2^24 group is
        a batch-to-group ratio no deployment exhibits.
      falsification_criterion_one_line: >-
        A null misbehaves -- batch size one fails to reproduce the single-target
        baseline, or the non-sharing arm costs materially less than M times it,
        which would mean the harness is sharing something it should not and had
        manufactured the effect under study; or the uncharged factor misses its
        band, in which case no charged number is computed at all; or the charged
        per-target cost keeps decreasing at every declared rate, rejecting the
        hypothesis and vindicating the classical accounting; or storage dominates
        before the factor is realised, which the proposal names as the most
        decision-relevant possible outcome.
      can_it_fail: >-
        Yes, in nine directions. Two forced nulls bracket the measurement from
        opposite sides, and BOTH directions of the headline result -- the
        classical factor surviving charging, and storage dominating -- are
        pre-registered as reportable outcomes rather than one being the hoped-for
        answer.
      conditionality_preserved: >-
        HEUR-BATCH-1 carried with its original id, its formal statement verbatim,
        and its rigorous-ingredient-plus-THE-GAP justification quoted in full
        including the proposal's own statement that 'the charged factor is
        necessarily worse than sqrt(M) and the question is only by how much'. The
        proposal's SECOND ASSUMPTION is preserved as a live obligation rather
        than assumed away: 'storage cost can be charged in the same model as
        computation; if it cannot, the amortization number is incomplete and must
        say so' -- and that conditional is wired into a falsification condition
        and an invalidation rule, not merely quoted. target_complexity carried
        verbatim.
      cost_model_pattern_compliance: >-
        measured_vs_modeled block present, with the exchange rate itself listed
        as MODELED because it is a declared accounting choice and not a property
        of anything measured. Five optimistic assumptions each with a BIAS
        DIRECTION, and the retained-bytes over-approximation is listed FIRST and
        required to be listed first in the report, precisely because it biases
        toward the record's own conclusion and is the one a reader should
        discount hardest. Peak memory is a primary metric beside every operation
        count. The time-memory tradeoff is the object of the experiment, with the
        interpolation range given as exactly M in [1, 64] at 24 bits at one
        frozen theta, and with an explicit statement that the joint optimum over
        M and theta is measured by no contract in this series.
      largest_coordinator_addition: >-
        THE EXCHANGE-RATE LADDER. The proposal requires storage to be 'charged in
        the same model as computation' but never says at what rate. Any single
        rate would make the headline answer an artifact of an undeclared choice,
        so the charged per-target cost is reported as a CURVE over a
        pre-declared ladder spanning at least six orders of magnitude, and the
        deliverable scalar is the CROSSING RATE -- the smallest rate at which
        increasing the batch stops paying. Quoting one point on that curve as the
        result is a completed_invalid condition. This converts an arbitrary
        constant into a reported sensitivity.
      outstanding_check_that_blocks_approval: >-
        DISTINCTNESS AGAINST H-ECDLP-6c52c0 IS UNRESOLVED AND IS RECORDED AS AN
        APPROVAL BLOCKER. The dispatching Coordinator's correction reports that
        the sibling proposal IDEA-20260731-013 -- the shared distinguished-point
        table for T-target rho -- is already converted as H-ECDLP-6c52c0 on an
        unmerged branch. THAT RECORD CANNOT BE READ FROM THIS WORKTREE, so
        whether 284aff measures anything H-ECDLP-6c52c0 does not has NOT been
        established. It is not guessed at. It is written into the hypothesis's
        interpretation_limits, into the experiment's approval_gate as its single
        most important precondition, into Stage 0 as a recorded run-time check,
        and into the required artifacts.
      what_could_be_established_about_the_overlap: >-
        FROM THE TWO PROPOSALS ALONE, WHICH ARE BOTH READABLE HERE. Reading
        IDEA-20260731-013 and IDEA-20260815-284aff side by side, 013's measured
        set appears to CONTAIN 284aff's uncharged quantities: 013's construction
        B is the shared-table walk, its construction A is 284aff's no-sharing
        null, its memory axis is table size shared versus independent, and its
        fitted gamma against 1/2 is 284aff's amortization factor against
        sqrt(M). 013 also carries controls 284aff lacks -- a random-function null
        walk with no group law, a planted-bug control, a negation calibration,
        a theta-invariance sweep, three N values rather than one, and an anchor
        to the Corrigan-Gibbs-Kogan floor. What 013 reports as two SEPARATE axes,
        time and memory in bits, 284aff asks to be combined into ONE charged
        number, and that combination requires an exchange rate 013 does not
        supply. That combination is the only distinguishing content this contract
        has. Whether H-ECDLP-6c52c0 preserved 013's separation or already added a
        charging step is exactly what cannot be checked from here.
      second_overlap_found_and_readable: >-
        experiments/EXP-MTGT-d4f8cd/specification.yaml, a DRAFT contract under
        GOAL-ENDO-001 and RQ-MTGT-2cabee, is present in this worktree and was
        read. Its primary metrics include 'total and per-target group operations
        per arm per M', 'peak store size in entries and bytes, per arm' and
        'fitted exponent of M with confidence interval, per arm'; its controls
        include matched single-target rho at M equal to 1 and a randomly
        populated store; its tail checks freeze theta across arms; its tier is
        toy; and its success criterion is a fitted exponent of 0.50 plus or minus
        0.05 over M in 1 to 32. Its OBJECT is an isogeny-transport comparison and
        the same-curve multi-target arm is its instrument calibration, not its
        deliverable -- so it is not identical to this record. But the UNCHARGED
        arm would be measured twice if both were approved. Which contract owns
        that measurement is a cross-goal Coordinator decision spanning
        GOAL-ECDLP-001 and GOAL-ENDO-001, and it is NOT made here.
      nulls_and_justifications:
        - field: hypothesis.asymptotic_claim
          value: null
          justification: >-
            No complexity improvement; the proposal states the incumbent is the
            classical multi-target amortization result, measured with storage
            charged rather than improved. Annotated in asymptotic_claim_note.
        - field: hypothesis.proof_search_map (all subfields)
          value: null
          justification: >-
            Purely empirical; not_applicable_reason filled, with the note that
            the identifiability question is handled by the two forced nulls and
            the charged-versus-uncharged split.
        - field: hypothesis.rerandomization
          value: null
          justification: No worst-to-average-case device is used or proposed.
        - field: 'heuristic_assumptions[HEUR-BATCH-1].supporting_results'
          value: '[]'
          justification: >-
            The classical shared-walk analysis is RECALLED in the parent proposal
            and unopened by any agent in this program; AGENTS.md rule 9 forbids it
            from discharging this field.
        - field: experiment.scale_relevance.correspondence
          value: null
          justification: Targets sampled directly in the tested group.
        - field: 'experiment.preregistered_prediction (charged half)'
          value: 'no numeric value'
          justification: >-
            DELIBERATE AND CARRIED FROM THE PARENT. The proposal predicts no
            magnitude for the charged factor and its HEUR-BATCH-1 states only
            that the charged factor is necessarily worse than sqrt(M). What is
            pre-registered instead is the STRUCTURE of the answer -- monotone or
            not in M, per rate -- which is decidable from the primary metrics.
            Inventing a magnitude would launder a guess into a prediction.
        - field: experiment.replication.seeds
          value: '[]'
          justification: >-
            EMPTY AT CONTRACT TIME AND FILLED AT APPROVAL. Genuinely stochastic
            work; seeds_note makes the master seed, the inherited 24-bit
            instance, and the requirement that BOTH arms resolve THE SAME targets
            binding preconditions.

