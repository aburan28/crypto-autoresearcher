  defect_in_the_brief_as_written:
    requested_by: 'the dispatching Coordinator, who asked that this be recorded rather than merely fixed'
    defect: >-
      CONSTRAINT 1 SPECIFIED A CONVERSION CHECK THAT CANNOT SEE THE STATE IT
      NEEDS TO SEE. It directed this task to verify conversion status by grepping
      ledger/hypotheses/*.yaml and experiments/*/specification.yaml. Those globs
      resolve against the WORKING TREE of one worktree. In a repository worked by
      many concurrent sessions on many branches, a record that already converts a
      proposal commonly lives on a branch not merged into the tree doing the
      checking, and is therefore invisible to that query. This session ran the
      specified query, found zero references for all eight proposals, and would
      have minted five duplicate immutable hypotheses on that basis had the
      dispatching Coordinator not re-run the audit across all refs and sent a
      mid-task correction.
    why_it_is_the_same_defect_as_batch_1_one_level_up: >-
      Batch 1 (TASK-20260904-e1420d) found that four of its eight proposals were
      already converted and invisible because the audit read only the
      source_proposal FIELD while the existing records recorded provenance under
      derived_from_idea or inside source_refs. The fix widened the query across
      FIELDS. This batch's defect is the same failure at the next level: the
      widened query still reads only one TREE. Both are instances of asking a
      partial view of shared state a question that only the whole state can
      answer.
    corrected_query: >-
      git grep -lE "<IDEA-ID>" $(git rev-list --all --max-count=400) --
      'ledger/hypotheses/*.yaml' 'experiments/*/specification.yaml'
    residual_limitation_of_even_the_corrected_query: >-
      STATED PLAINLY BECAUSE IT WILL BITE NEXT. 'git rev-list --all' enumerates
      refs THIS CLONE HAS. A branch that exists only on the remote and has not
      been fetched, or only in another clone or another machine's worktree, is
      still invisible. The corrected query should therefore be preceded by
      'git fetch --all', and even then its negative result is a floor and not a
      proof of absence -- the same discipline AGENTS.md already applies to
      retrieval, where absence of a search result is not evidence that something
      was not tried. Every contract written in this task records that limitation
      in its own Stage 0 rather than leaving it implicit.
    second_recommendation: >-
      The corrected query reads hypotheses and experiments only. It would not
      have surfaced CORR-20260808-f4d780's do_not_dispatch verdict on
      IDEA-20260808-2e14f7, which this session found only by grepping the whole
      ledger tree. A conversion audit should also check ledger/corrections/ for a
      verdict on each candidate proposal before it is assigned, since converting
      a proposal whose mechanism a committed correction has refuted spends a
      designer's effort on a record that should not be dispatched.

