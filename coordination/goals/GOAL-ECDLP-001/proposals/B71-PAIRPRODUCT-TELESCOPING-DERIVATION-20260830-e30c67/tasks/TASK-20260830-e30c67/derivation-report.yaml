question: >-
  On the frozen P1553 instance model (H-CREP-001's pair-product generators
  over the complete-chart intersection system, deck sizes B in {2, 3}, six
  strata, as machine-checked by EXP-CREP-001), write down exactly what a
  generator is and what combining two generators costs, and determine
  whether that combination is additive/telescoping (as for a product of
  known linear factors, the property that makes subproduct-tree/remainder-
  tree reduction quasi-linear) or costs strictly more.

