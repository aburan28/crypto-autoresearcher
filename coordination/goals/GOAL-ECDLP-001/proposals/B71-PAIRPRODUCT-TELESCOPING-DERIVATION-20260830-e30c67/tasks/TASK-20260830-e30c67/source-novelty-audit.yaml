external_sources_consulted:
  - id: subproduct-tree-remainder-tree-classical-fact
    description: >-
      Subproduct-tree / remainder-tree reduction of an explicit product
      of D known linear factors modulo a smaller-degree modulus g runs
      in quasi-linear time by keeping every retained intermediate node
      reduced modulo g (bounded by deg(g)) rather than materializing the
      full degree-D product; standard computational-algebra result, e.g.
      von zur Gathen and Gerhard, 'Modern Computer Algebra', chapters on
      fast multipoint evaluation and interpolation; same Borodin-Moenck
      fast-modular-transforms lineage H-CREP-001 itself cites as
      ROUTE-04's structural ingredient.
    provenance: recalled
    provenance_caveat: >-
      Not independently retrieved or re-verified this session (no
      WebSearch/WebFetch performed); this is the SAME control fact and
      the SAME provenance caveat already recorded in the prior round's
      framing-revisit-analysis.yaml (provenance_of_control_fact:
      recalled), reused here per the dispatch handoff's explicit
      instruction to run a fresh control against the same nearby object.
      Treated as well-established textbook material, used strictly as a
      proves-too-much control, not to support any claim of novelty or
      established fact elsewhere in this record.
  - id: bezout-elimination-degree-bound
    description: >-
      Classical algebraic-elimination fact (Bezout's theorem and its
      consequences for resultants): eliminating a variable from a system
      of polynomial constraints generically produces an object whose
      degree is bounded by a PRODUCT of the input degrees, not their
      sum, in contrast to plain polynomial multiplication where degree
      adds. Named in derivation-report.yaml's named_missing_specification
      as one plausible (but NOT verified as the specifically intended)
      mechanism behind the declared Theta(B^2)-degree/Theta(B^3)-
      materialization convention in build_packages.py.
    provenance: recalled
    provenance_caveat: >-
      Not independently retrieved this session. Used only to name a
      candidate explanation for the declared convention's origin, flagged
      explicitly in derivation-report.yaml as one of at least two
      plausible mechanisms (the other being non-deduplicated per-generator
      lookup accounting), neither of which is confirmed against
      H-CREP-001's actual (unspecified) equations. This citation does NOT
      appear in obstruction, exact_obstruction_claim, or any load-bearing
      field of outcome-card.yaml or proof-search-map.yaml -- the
      obstruction itself rests entirely on internal, directly-read
      artifact facts (package JSON, verifier code), not on this external
      fact, precisely to avoid resting Gate 3 on a recalled-only external
      claim.

