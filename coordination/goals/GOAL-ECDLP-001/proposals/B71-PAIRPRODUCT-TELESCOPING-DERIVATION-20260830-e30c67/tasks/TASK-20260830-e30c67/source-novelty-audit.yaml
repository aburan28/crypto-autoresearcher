  against_thirteen_trigger_search_rounds: >-
    Rounds seven through thirteen searched EXTERNAL literature areas
    (subresultant/PRS, modular composition, fast remainder, Semaev/Weil
    descent, unranking, transposed evaluation, function-field/transfer-
    theoretic identities, structured/sparse/black-box resultant theory,
    normal-form/triangular decomposition, algebraic coding theory,
    sparse interpolation, structured-matrix/eigenvalue methods,
