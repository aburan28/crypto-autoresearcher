why_this_differs_from_the_prior_rounds_dichotomy_attempt: >-
  The Coordinator's own independent review (ledger/goals/GOAL-ECDLP-001/
  goal.yaml, preadmission_gate_framing_review_terminal_note_20260830)
  found the prior coefficient-space-versus-ideal/root-space dichotomy's
  central premise -- that r_R's factor/ideal structure is 'not free' --
  was ASSERTED BY DEFINITION (r_R's structure is the sought witness,
  hence by definition not free) rather than DERIVED from the P1553
  complete-chart system's own defining equations. This record's
  obstruction claim is deliberately built on a DIFFERENT and narrower
  kind of ground: a directly-verifiable, mechanical fact about the
  ARTIFACTS THEMSELVES (zero decomposition levels in 8 of 8 route
  package.json files; a vocabulary asymmetry between decks 0-1 and decks
  2-4 in check_representation.py's own frozen PREPROCESSING_KINDS
  dictionary; and the verifier's own max-style cost-aggregation formula
  in check_V6/aggregate_certificate, which is a piece of code in this
  repository, not an assumption about r_R's abstract algebraic identity)
  rather than on a claim about what r_R's factor structure 'truly is'.
  It therefore does not repeat the defect the Coordinator named: nothing
  here is true 'by definition' of what a witness is; every load-bearing
  fact is either read directly out of a frozen JSON/Python artifact
  (derivation-report.yaml sources_read_this_session) or is a named,
  flagged, external classical fact (source-novelty-audit.yaml).

bottleneck: >-
  The exact step whose removal (i.e. whose replacement by a genuinely
  decomposed, interleaved combination rule) would change the claimed
  cost is the atomic chart_index -> resultant_coefficient_vector /
  translated_endpoints edge shared by all 8 frozen route packages
  (derivation-report.yaml part 2(C), part 6). The obstruction claims
  this specific, named edge -- not r_R's abstract structure in general --
  is what the verifier's max-aggregation rule reads as the online cost
  floor.

baseline_embedding:
  parameter_slice: >-
    The frozen EXP-CREP-001 route set exactly as specified and executed:
    8 named routes x 12 recorded symbolic instances (B in {2,3} x 6
    strata), plus the 2 calibration fixtures, plus build_packages.py's
    own shared build_expansion_route() function that produces the
    identical edge shape for 7 of the 8 routes. This is the exact
    baseline the obstruction claims to reproduce.
  reproduction_check: >-
    Verified symbolically by direct reading (no execution) of three
    artifacts in agreement: (1) execution-report.yaml's predicate_matrix
    -- all 7 non-oracle routes fail first at V3, each with declared
    online-materialized target-dependent-coordinates exponent exactly 3;
    (2) ROUTE-04-multipoint-evaluation/package.json's dependency_graph --
    edge n1->n2 declares output_size_exponent_in_B=3, cost_exponent_in_B=3,
    matching (1) exactly, and edge n2->n3 (the algebra-specific
    multipoint_evaluate step) declares cost_exponent_in_B=2, i.e.
    genuinely lower than the route's own reported online exponent, which
    can only be true if the max-aggregation rule is reading n1->n2, not
    n2->n3, as the binding constraint; (3) build_packages.py's
    aggregate_certificate function, whose literal formula (agg_on_ws =
    max of on_edges output exponents and on_node sizes) is read directly
    and traced by hand against ROUTE-04's own edge list, producing
    max(3,1,1,1,1)=3, matching the package's own declared
    online.workspace_exponent_in_B=3 exactly. This is a hand-traced,
    frozen-artifact reproduction of the exact mechanism producing the
    baseline number, not a resemblance claim.
  audit_result: pass_reproduces_exactly_and_mechanically

observation_collision:
  observable: >-
    'presence or absence of a recursive pairwise-combination decomposition
    in a route's dependency graph, for the step producing the largest
    target-dependent object' -- the observable the obstruction claim
    reads to sort routes/techniques into 'floor forced to the largest
    declared node' versus 'floor bounded by the largest RETAINED
    (modulus-reduced) node'.
  distinct_preimage_search: >-
    Searched for two ground-truth objects sharing an atomic-looking
    top-level description but differing on whether a public sub-cubic
    (or sub-Theta(output-size)) constructor exists, specifically
    targeting the same subproduct-tree/known-linear-factors nearby
    object used in the prior round's control (framing-revisit-
    analysis.yaml). Found the collision the prior round already
    identified in general terms (framing-revisit-analysis.yaml,
    proves_too_much_control), but resolved it here on STRUCTURAL rather
    than definitional grounds: a genuine subproduct-tree/remainder-tree
    implementation for reducing an explicit product of D known linear
    factors modulo a degree-e modulus g is, when expressed as the SAME
    kind of dependency graph this record's observable reads, NOT an
    atomic single-edge construction -- it is, by definition of the
    technique, a balanced binary tree of Theta(log D) LEVELS, where each
    level's node holds its running partial product REDUCED MODULO g
    (this is the specific engineering trick, recalled classical fact,
    that keeps every retained intermediate bounded by degree e rather
    than by the unreduced partial product's own degree). So the SAME
    observable (decomposition present/absent) that classifies the 8
    frozen P1553 routes as 'atomic, hence floor-bound' correctly
    classifies a properly-built remainder tree as 'decomposed, hence NOT
    floor-bound at the full product's size' -- there is no collision on
    this observable between the two objects, because they differ
    exactly on the property the observable reads (one has zero
    decomposition levels; the other has Theta(log D) levels with bounded
    retained size at each). This is a DIFFERENT, and stronger, resolution
    than the prior round's: the prior round's collision was resolved (if
    at all) by an asserted premise about r_R's freeness; this one is
    resolved by pointing at a directly-inspectable structural difference
    between the two graphs.
  is_the_collision_resolved_by_an_additional_condition: >-
    Yes, and unlike the prior round, the condition is not asserted about
    r_R's nature -- it is the literal presence/absence of decomposition
    levels in the two objects' own dependency graphs, which is exactly
    what the observable is defined to read. No definitional premise about
    which object's roots are 'free' is invoked anywhere in this
    resolution.
  audit_result: collision_resolved_by_a_directly_observable_structural_condition

quantifier_order: >-
  Explicit statement: FOR ALL 8 routes r in the frozen EXP-CREP-001
  route set, r's dependency graph contains zero nodes representing a
  combination of two strict, smaller-than-whole generator/chart subsets
  in the fold-in step, and (for the 7 non-oracle routes) declares that
  step's output at exponent 3 -- this is a UNIVERSAL claim, but it is
  universal over a FINITE, FULLY ENUMERATED, ALREADY-FROZEN set of 8
  JSON artifacts (verified by direct reading of all 8, not sampled), not
  over 'all possible constructions'. It is NOT the claim 'FOR ALL
  possible routes R (including any not yet designed), R fails to
  decompose' -- that would be an unwarranted universal-over-an-open-set
  claim this record does not make (see interpretation_limits and
  outcome-card.yaml's what_this_does_not_authorize). The witness that
  would falsify the OPEN, forward-looking question (whether SOME
  decomposition could succeed) is explicitly allowed to be a route not
  yet constructed, dependent on an interleaved combination rule not yet
  specified for decks 2-4 -- exactly the forward_guidance_open_directions
  named in derivation-report.yaml. This record's own EXISTENTIAL claim
  (that a decomposed alternative might exist) is left genuinely open,
  not foreclosed.

method_ceiling:
  strongest_certifiable_claim: >-
    A directly-verified, mechanically-derived, TOY-TIER structural fact:
    within the 8 frozen EXP-CREP-001 routes, the measured Theta(B^3)
    online cost for 7 of them follows necessarily from one directly-
    inspectable graph property (a single atomic, exponent-3 edge) via
    the verifier's own deterministic max-aggregation formula, and this
    same graph property is ABSENT by construction in a genuine
    remainder-tree implementation of the classical nearby object. No
    stronger claim is certifiable: this does not establish that a
    decomposed alternative for the P1553 system would succeed, would be
    correct, or would fit within the B^{5/4} online cap even if it
    existed -- those are separate, unaddressed proof obligations (see
    proof_obligations below) that this zero-compute session cannot
    discharge because H-CREP-001 does not specify the combination rule
    a decomposed alternative would need (derivation-report.yaml
    named_missing_specification).
  nearby_object_control: >-
    Applied the SAME observable (decomposition-levels-present) used to
    classify the 8 frozen P1553 routes to the nearby object (subproduct-
    tree/remainder-tree reduction of an explicit product of D known
    linear factors modulo a smaller modulus g; recalled classical fact,
    not independently retrieved this session, provenance flagged in
    source-novelty-audit.yaml -- same control object named in the
    dispatch handoff and in framing-revisit-analysis.yaml). RESULT: a
    correctly-implemented remainder tree has Theta(log D) decomposition
    levels with every retained intermediate bounded by deg(g), NOT zero
    decomposition levels -- so the obstruction's premise (zero
    decomposition levels observed) does NOT hold for the nearby object,
    and the obstruction claim therefore does NOT fire on it and does NOT
    falsely predict impossibility there. This is the control passing,
    for a reason grounded in an inspectable structural property of both
    graphs (decomposition levels), not in an asserted premise about
    which object's roots are free. CONTRAST with the prior round: the
    prior round's general dichotomy DID fire incorrectly on the nearby
    object (framing-revisit-analysis.yaml, control_verdict:
    general_form_fails_the_control) because its premises were phrased at
    the level of 'implicit versus explicit specification', a distinction
    the classical control also loosely satisfies (a product of D known
    factors is 'in a loose sense' implicit too). This record's premise is
    phrased at the level of 'observed decomposition levels in the actual
    dependency graph as built', which the classical control clearly and
    non-loosely satisfies (it IS decomposed) and the 8 frozen P1553
    routes clearly and non-loosely do not (they are each a single flat
    graph with one atomic fold-in edge) -- there is no comparable
    looseness for a future reader to exploit.
  audit_result: control_passes_for_this_narrower_structural_claim

derived_not_asserted_declaration: >-
  Direct response to Gate 3 (completion_gate item 3 of the dispatch
  handoff): the P1553 generators' asymmetry from the classical
  subproduct-tree/known-linear-factors object is derived here from (1) a
  direct reading of all 8 frozen route package.json files (zero
  decomposition levels, uniformly, verified by inspection, not assumed),
  (2) a direct reading of check_representation.py's PREPROCESSING_KINDS
  dictionary (exactly one deck-pair has a dedicated compact combination
  object; the other deck pairs do not, verified by inspection of the
  literal dictionary contents), (3) a direct, hand-traced application of
  build_packages.py's own aggregate_certificate max-formula to ROUTE-04's
  own edge list (producing the observed exponent 3 mechanically, not by
  restating the executor's report), and (4) the well-known structural
  fact (recalled, flagged) that a genuine remainder tree has Theta(log D)
  retained, modulus-bounded intermediate nodes rather than zero. None of
  these four grounds is a claim about r_R's abstract identity as 'the
  sought witness' -- the exact ground the Coordinator's review found was
  asserted rather than derived in the prior round. The residual,
  honestly disclosed limit is that this derivation explains why the 8
  AS-BUILT routes hit this floor and why the classical control does not
  hit an analogous floor; it does not derive (because H-CREP-001 does
  not specify) whether a hypothetical decomposed alternative for the
  P1553 system's own decks 2-4 fold-in would succeed -- that residual
  gap is named plainly, not smoothed over, in
  forward_guidance_open_directions.

constructive_transforms_considered:
  - transform: representation_reduction
    proposed_object: >-
      Reformulate 'does a sub-Theta(B^3) constructor for r_R mod g_I
      exist' as an exact question about whether an interleaved, modulus-
      g_I-reduced pairwise combination rule can be defined for decks 2-4
      analogous to the existing pair-product-generator object for decks
      0-1 (forward_guidance_open_directions in derivation-report.yaml).
    predicted_gain: >-
      Unknown; not evaluated quantitatively. Naming the transform
      identifies the proof obligations a future derivation would need to
      discharge (encoding: does such a combination rule exist and match
      the complete-chart intersection system's actual semantics;
      completeness against all six frozen strata including exceptional
      markers and collisions; soundness against the target-independence
      mutation control V2; transfer from the toy combinatorial model to
      the real elliptic-curve construction, given the CAL-PASS disclaimer
      that the toy model's own cheap solvability does not transfer;
      cost-loss versus the B^{5/4} online cap).
    status: named_not_attempted
  - transform: telescoping_potential
    proposed_object: >-
      If an interleaved combination rule (above) is found to exist,
      whether an 'unstable increment' (a per-combination cost spike) can
      be randomized in location and charged to a global budget the way
      Section 8's telescoping_potential transform describes.
    predicted_gain: not_evaluated
    status: not_selected
    reason: >-
      No concrete object exists yet to apply this transform to (the
      prerequisite representation_reduction transform above is itself
      only named, not attempted); selecting telescoping_potential without
      a defined combination rule to randomize over would be assertion,
      not argument.
  - transform: (boundary_lift, stronger_invariant, specialization_pack, observable_fiber)
    status: not_selected
    reason: >-
      No identifiable prerequisite for any of these four remaining
      transforms is present in this session's zero-compute analysis.

proof_obligations:
  - claim: >-
      A decomposed, interleaved combination rule for decks 2-4's fold-in
      (analogous to pair-product generators for decks 0-1) exists and
      matches the complete-chart intersection system's actual semantics.
    responsibility: feasibility
  - claim: >-
      Such a rule, if it exists, preserves exact support and replay
      correctness across all six frozen strata (V4, V5) including
      exceptional markers, collisions, and the no-relation-unit case.
    responsibility: correctness
  - claim: >-
      Such a rule stays target-independent in its preprocessing phase
      (V2, the fresh-target mutation control).
    responsibility: interface
  - claim: >-
      Such a rule's combination cost is additive/telescoping rather than
      multiplicative, i.e. genuinely achieves the B^{5/4} online cap
      rather than merely improving on B^3 without reaching the target.
    responsibility: runtime
  - claim: >-
      The toy combinatorial model's own cheap solvability (CAL-PASS,
      Theta(B) online) does not licence transferring any conclusion to
      the real, non-toy elliptic-curve construction without an
      independent argument, since it is explicitly disclaimed in the
      corpus as an artifact of the synthetic Boolean-OR semantics.
    responsibility: scope

proof_obligations_none_discharged_here: true

overall_audit_verdict: >-
  The obstruction claim in outcome-card.yaml passes all four Section 8
  audits, including a proves-too-much control against the same
  subproduct-tree/known-linear-factors nearby object used in the prior
  round, and does so on directly-inspectable structural grounds (graph
  decomposition levels; a frozen vocabulary dictionary; a frozen
  aggregation formula) rather than on an asserted premise about r_R's
  abstract algebraic identity -- directly closing the specific gap named
  in ledger/goals/GOAL-ECDLP-001/goal.yaml's
  preadmission_gate_framing_review_terminal_note_20260830 and
  preadmission_structural_argument_review_decision_20260830. The
  obstruction is scoped exactly to the 8 as-built frozen routes; it is
  not, and does not claim to be, a proof that no decomposed alternative
  can exist for the P1553 system, and the residual open question
  (whether such a decomposition exists and would telescope) is carried
  forward explicitly rather than smoothed into an implied impossibility
  claim, per docs/inventor-protocol.md Section 4 and Section 7's
  standing prohibition on declaring a direction impossible.
