mechanism_delta:
  proposed_delta: >-
    Replace the ordinary trace functional used in reduced projector formulas
    by a public residue or dualizing functional that is nonzero on the first
    nilpotent jet, then apply its transpose through a fixed Semaev separator
    contraction DAG.
  concrete_constructor_supplied: false
  exact_uniform_identity_supplied: false
  difference_from_relayed_baselines: >-
    The intended delta is jet sensitivity rather than reduced-algebra trace,
    coupled to an implicit transposed Semaev evaluation. The intake does not
    realize that delta as a finite public construction.

displayed_algebra:
  status: diagnostic_template_only
  template: >-
    A = k[x_1,...,x_n]/I with a candidate linear functional lambda_A in the
    dualizing module, and lambda_A(epsilon) != 0 on a matched square-zero
    specialization k[epsilon]/(epsilon^2).
  forbidden_shortcut: >-
    Selecting a local factor, annihilator, socle generator, Jacobian inverse,
    or normalization after learning the solution would make lambda_A
    x-equivalent to a hidden-root oracle.
  missing_finite_data:
    - one fixed Semaev arity and separator tree
    - explicit generators and relations for every intermediate algebra
    - ordered bases and every public linear or bilinear map
    - a denominator-safe residue constructor on stated characteristic strata
    - a proof of nondegeneracy on the required reduced and nonreduced fibers

