    - >-
      Explicit multiplication-matrix and independently derived implicit
      transpose evaluations agree exactly on every declared tiny reduced and
      nonreduced control algebra.
    - >-
      The residue response changes according to a preregistered rule across
      nilpotent orders one, two, and three, while ordinary trace loses the
      first square-zero jet.
    - >-
      Q and -Q yield observably distinct oriented replay outputs, and the
      accepted output verifies [w]P=Q.
  artifact_tell:
