statement:
  candidate: public_dualizing_residue_semaev_separator_contraction
  question: >-
    Can an explicitly and publicly constructed dualizing-module or
    Grothendieck-residue functional on a fixed public-target Semaev separator
    preserve the first nilpotent jet, admit an exact transposed contraction,
    and reconstruct the oriented signed scalar with strict all-axis
    o(ell^(1/2)) cost?
  answer_in_this_intake: >-
    No candidate is admitted. The relayed material names the desired residue
    functional but supplies neither a frozen finite Semaev algebra nor an
    oracle-free public construction of the functional. Consequently no exact
    contraction identity, control agreement, signed replay, or all-in
    sub-rho cost certificate can be checked.
  obtained_delta: none
  closure_claimed: false
  breakthrough_claimed: false

