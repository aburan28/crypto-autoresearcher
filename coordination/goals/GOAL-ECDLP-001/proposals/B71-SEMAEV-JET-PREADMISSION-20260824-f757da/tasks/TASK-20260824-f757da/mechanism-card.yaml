mechanism_delta:
  requested_delta: >-
    Replace the B66 materialized occurrence algebra, the B67 explicit
    B^5-scale moment evaluation, and the B70 dense or explicit-leaf orbit
    paths by a public, jet-sensitive, Semaev-specific separator contraction
    whose boundary state is sufficient for deterministic oriented witness
    replay.
  obtained_delta: none
  why_not_obtained:
    - No fixed Semaev arity and elimination tree were derived with a typed public quotient or factor-base algebra.
    - No basis-level tensor-entry formula and no separator factorization were derived.
    - No proof or construction of sub-square-root separator rank, nonzero count, traffic, or state size was derived.
    - No jet semantics were connected to a boundary state that survives contraction and supports witness replay.
    - No deterministic map from a successful boundary index to an oriented signed scalar was derived.
    - With no finite public construction, no all-axis exponent certificate can be stated.
displayed_algebra:
  semaev_semantics: >-
    A fixed Semaev summation-polynomial relation can express that selected
    x-coordinates admit compatible points whose signed sum is the identity.
    That relation alone is existential and sign-symmetric; it does not provide
    a public low-rank tensor factorization, a target-local contraction, or an
    oriented scalar witness.
  recursive_elimination_warning: >-
    Writing higher-arity relations through resultants is only a formal
    elimination recipe until the arity, tree, coefficient ring, denominators,
    repeated-root branches, bases, tensor entries, and finite arithmetic DAG
    are all fixed. No complexity benefit follows from the word contraction.
