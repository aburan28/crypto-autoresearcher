quantifier_order:
  required_statement: >-
    There exists one uniform public algorithm which, for every admissible
    public curve and ECDLP target in the declared parameter family, constructs
    the fixed relation system and all contraction data without target advice,
    succeeds with a stated probability and yield, recovers an oriented scalar,
    and incurs strict all-axis o(ell^(1/2)) cost after every preprocessing and
    amortization quantifier is fixed.
  prohibited_swaps:
    - choose_a_favorable_tensor_or_factorization_after_seeing_the_target
    - assume_a_low_rank_decomposition_exists_then_count_only_its_application
    - amortize_over_an_unspecified_or_exponential_number_of_targets
    - condition_on_a_relation_without_charging_relation_yield
    - select_a_sign_after_witness_verification_without_retaining_orientation_data
  candidate_satisfies_statement: false
  failure: no_uniform_algorithm_or_cost_statement_present
