scope_statement: >-
  This map audits only whether the present formula-level intake contains a
  dispatchable public Semaev separator contraction. It contains no proof that
  such contractions do not exist and makes no B71, attack, speedup, novelty,
  closure, or breakthrough claim.
bottleneck:
  question: >-
    Can a fixed, explicitly typed Semaev relation system be contracted from
    ordinary public ECDLP inputs using a jet-complete boundary representation
    that is publicly constructible, retains enough signed information to
    recover an oriented scalar w with [w]P=Q, and costs strictly
    o(ell^(1/2)) on every end-to-end axis?
  current_answer: not_demonstrated
  load_bearing_missing_items:
    - fixed_arity_and_elimination_tree
    - public_factor_base_or_quotient_polynomial
    - explicit_bases_maps_and_tensor_entries
    - separator_dimensions_ranks_nonzeros_and_exception_branches
    - nilpotent_and_repeated_root_jet_semantics
    - finite_construction_and_contraction_dag_with_traffic
    - deterministic_boundary_to_oriented_scalar_replay
    - all_axis_cost_and_yield_certificate
baseline_embedding:
  exact_baseline_reproduction:
    b66:
      reproduced_statement: >-
        The reduced occurrence-algebra projector identity is exact, while its
        displayed constructor materializes D=Theta(B^5); it neither constructs
        mu_R nor exact recompression within budget, may retain
        (q+1)d_R+1 words with d_R=B^5=N, lacks a faithful source inverse, and
        ordinary trace loses nilpotent jets.
      implication: ordinary_trace_or_materialized_occurrence_algebra_is_not_the_requested_separator
    b67:
      reproduced_statement: >-
        Square-free occurrence moments have conditional decoder semantics but
        no evaluator schedule, traffic certificate, typed Semaev interface, or
        oriented replay; the explicit path costs Theta(B^5 log p) target work
        and Theta(B^5) traffic.
      implication: decoder_semantics_without_public_evaluation_and_replay_is_insufficient
    b70:
      reproduced_statement: >-
        The split-root Boolean identity is exact after correcting leaf
        orientation from m^(-j) to m^j, but dense quotient work is Theta(ell),
        explicit leaves cost Theta(D/s), and exact generic cycles require D/s
        point queries. The hypothetical D^beta balance has exponent
        1/(3-2beta) and beats rho only for beta<1/2.
      implication: a_separator_claim_must_supply_beta_below_one_half_with_every_cost_axis_included
    generic_preadmission:
      ref: TASK-20260823-4b30d3
      reproduced_statement: >-
        No complete mechanism-new public-input identity or observable,
        correctly oriented witness, and all-axis certificate were jointly present.
    division_polynomial_preadmission:
      ref: TASK-20260824-e9a211
      reproduced_statement: >-
        The kernel-product identity remained semantic only: recurrence, base
        cases, SLP, gauge branch typing, descent, replay, verifier, and cost
        charges were absent.
  exact_reproduction_complete: true
  candidate_improvement_over_baseline: not_instantiated
