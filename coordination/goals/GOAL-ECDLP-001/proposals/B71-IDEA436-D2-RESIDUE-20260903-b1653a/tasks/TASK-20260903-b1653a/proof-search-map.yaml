proof_search_map:
  task: TASK-20260903-b1653a
  goal: GOAL-ECDLP-001
  role: idea-generator
  recorded_at: '2026-09-03'
  applies_to: >-
    The two halves on which d2-disposition.yaml reaches a verdict - (I) the
    STRICT reading of ECDLP-IDEA-436 disjunct D2's sub-question, closed
    conditionally on n prime, and (II) the STRICT-ISO reading restricted to
    additive targets of the p-adic tower, closed by exponent coprimality. The
    -LIKE residue reaches NO verdict, so audits 1 to 4 are recorded for it as
    not_applicable WITH THE REASON, never silently omitted, per
    docs/inventor-protocol.md section 8.
  tier: 'derivation, zero runs, zero compute; a falsification aid, not a new claim tier'

  bottleneck: >-
    The exact step whose removal changes the conclusion is the STEP FROM
    'homomorphism-like' TO A DECLARED TARGET STRUCTURE AND A DECLARED SIZE
    RELATION. Everything downstream is elementary once the target is declared
    to be (a) a group and (b) smaller than the source. The sub-question as
    written in the erratum declares NEITHER, which is why it has survived
    ungated - it is not a single claim but a family of claims with different
    verdicts, and the family splits exactly on those two declarations. Naming
    that as the bottleneck is this map's principal content.

  baseline_embedding:
    parameter_slice: >-
      TWO EXACT SLICES, both reproducing already-committed results rather than
      resembling them. SLICE 1 (STRICT) - set the target to a group of order
      below n and set n prime. The conclusion is then the terminal step of
      KN-FIND-ffe1df Theorem C, which the Validator independently confirmed,
      including the non-surjective case where the argument runs on the image.
      SLICE 2 (STRICT-ISO restricted to additive targets) - set the target to a
      graded piece of the formal-group filtration and set n = p. The conclusion
      FLIPS, and what it flips to is the Smart / Satoh-Araki / Semaev additive
      transfer, the known linear-time attack recorded verbatim in KN-TECH-033.
      A closure whose parameter slice reproduces a known ATTACK at one end and
      a Validator-confirmed IMPOSSIBILITY at the other is embedded on both
      sides, which is the strongest form of this audit available without
      compute.
    reproduction_check: >-
      SYMBOLIC, not a plot and not a fixture. Slice 1 - the image of a
      homomorphism from a cyclic group of order n has order dividing n; for n
      prime it is 1 or n; nonconstancy forces n; n exceeds the target order;
      contradiction. Four lines, checkable by any reader, and identical to the
      quoted Theorem C terminal step. Slice 2 - for n = p the source is a
      p-group and the coprimality step used in section 4 of the disposition
      fails at its first line, so the argument correctly does not apply, which
      is what must happen where an attack exists. NO FROZEN REGRESSION FIXTURE
      IS OFFERED because no code is run by this task; RC-4 of the 2026-08-31
      round (a frozen fixture against experiments/EXP-GGM-001/simulability_test.py)
      remains undischarged and is NOT discharged here.

  observation_collision:
    observable: >-
      The pair (does T composed with digit extraction propagate exactly under
      some combining rule, size of the image of T). This is the observable
      carrying every conclusion in the disposition - the STRICT closure reads
      it as (yes, below n) and derives a contradiction; the -LIKE residue is
      exactly the set of objects for which the first coordinate is 'only with
      probability q'.
    distinct_preimage_search: >-
      A COLLISION WAS FOUND, IT IS REPORTED, AND IT IS THE MOST IMPORTANT LINE
      IN THIS MAP. Two ground-truth objects share the description
      'nonconstant homomorphism-like map from <S> to a target' and land on
      OPPOSITE sides of the claimed conclusion. Object A - a hypothetical exact
      homomorphism onto a group of order below n, which cannot exist for n
      prime. Object B - the SSSA isomorphism onto (F_p, +) on an anomalous
      curve, and the MOV injection into the multiplicative group of an
      extension field, both of which exist and both of which break or weaken
      the ECDLP. THE OBSERVABLE AS THE SUB-QUESTION WRITES IT DOES NOT
      DISTINGUISH THEM; only the added coordinate 'size of the target relative
      to n' does. This is a direct falsifier of the sub-question's
      identifiability AS WRITTEN, and the separating condition is stated - the
      target size relation. Recorded here rather than absorbed into the
      disposition, because the honest consequence is that a Coordinator
      recording any D2 disposition must record WHICH size relation it disposes
      of, or the record will be cited for more than it establishes.
    second_collision_recorded: >-
      A weaker collision at the image-size coordinate alone - D1's
      plus-or-minus fibre indicator and an arbitrary balanced two-valued
      statistic both have image size 2, for entirely different reasons. The
      observable does not see the fibre structure. Non-fatal here because no
      conclusion in this file is drawn from image size alone, but it is the
      reason the disposition insists on the null-lift control for any
      successor measurement.

  constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Move the D2 family from the p-adic model, where no bound is available,
        to the F_p-coordinate model, where a measured bound already exists, via
        the explicit transport map. ENCODING exact; COMPLETENESS exact (every
        D2 statistic is in the image); SOUNDNESS exact for the INFORMATION
        claim and NOT established for the STATISTICAL claim, because the
        transfer does not preserve algebraic degree. PRIOR ART, NOT THIS
        SESSION'S - this transform is IDEA-20260901-b4e6eb's, stated there in
        full, and it is credited rather than re-proposed.
      predicted_gain: >-
        Disposes of D2's information half at zero compute and reduces its
        computational half to one already-instrumented measurement. The
        disclosed cost loss is the degree gap.
    - transform: observable_fiber
      proposed_object: >-
        Hold the observable fixed - the exact-propagation predicate plus image
        size - and vary the forgotten structure, which here is THE ORDER
        RELATION BETWEEN SOURCE AND TARGET AND THE EXPONENT OF THE TARGET. The
        resulting objects are the three of the proves-too-much control (SSSA,
        MOV, composite-n quotient), and the intrinsic invariant that
        distinguishes them from the closed case is exactly gcd(n, exponent of
        target) together with the size relation.
      predicted_gain: >-
        Converts 'is D2 closed' from a single question into a two-parameter
        table with a different verdict in each cell, which is what the
        disposition reports. This is the transform that produced the STRICT-ISO
        scope discovery.
    - transform: stronger_invariant
      proposed_object: >-
        Preserve more state than the conclusion needs - specifically, track the
        DEGREE of the transport map as an algebraic function of the F_p
        coordinates rather than only its poly-time computability. Poly-time is
        what survives the transport; degree is what a Weil-type bound consumes,
        and the two came apart exactly at claim (D) of b4e6eb.
      predicted_gain: >-
        CAND-D2-A of the disposition. Turns an unbounded theoretical gap into a
        finite integer measurable in minutes at toy p, with a matched random
        null.

  quantifier_order:
    claim_strict: >-
      FOR ALL E, p, n, r, and admissible Weierstrass models in the frozen
      setting with n PRIME, FOR ALL statistics T, FOR ALL targets G with
      |G| < n and FOR ALL precision schedules r(n), IF T composed with
      precision-r digit extraction is a group homomorphism from <S> to G THEN
      it is constant. The witness for the contradiction (the collision element
      D of the df906f argument) is allowed to depend on the instance; the
      CONCLUSION is universal and uniform in n, so no per-n witness sneaks in.
      This matters because the sub-question's own quantifier is
      'THERE EXISTS T and a schedule r(n)' - an existential ranging over a
      family that may grow with n - and only a conclusion uniform in n can meet
      it. The closure is uniform. STATED EXPLICITLY BECAUSE THE 2026-08-31
      ROUND FAILED EXACTLY THIS AUDIT ONCE ALREADY - repair R-F1 records a
      universal sentence that was FALSE because the Weierstrass model was
      absent from the quantifier list. The model IS in the list above.
    claim_strict_iso_additive: >-
      FOR ALL E, p, n in the frozen setting with gcd(n, p) = 1, FOR ALL r, FOR
      ALL additive targets A that are a graded piece of the formal-group
      filtration, the formal group itself, or (Q_p, +), EVERY group
      homomorphism from <S-hat> to A is zero. No existential quantifier
      appears; the statement is purely universal and the proof is a divisibility
      argument, so there is no witness to smuggle.
    quantifier_hazard_recorded: >-
      The one place a dependence could hide is the phrase 'additive targets of
      the p-adic tower'. That phrase quantifies over a list this session
      ENUMERATED rather than proved exhaustive. If a later reader exhibits an
      additive subquotient of E over Z_p that is neither pro-p nor
      torsion-free, the STRICT-ISO closure does not reach it. Recorded as a
      known limit of the quantifier rather than left implicit.

  method_ceiling:
    strongest_certifiable_claim: >-
      AT MOST - 'for a prime-order source there is no nonconstant exact
      small-target propagating statistic, at any precision and any schedule;
      and for a prime-to-p-order source there is no nonzero homomorphism into
      any additive target of the p-adic tower'. It can NEVER certify anything
      about probabilistic propagation (q below 1), which is the entire -LIKE
      residue; anything about targets of size at least n outside the additive
      family, which is where MOV lives; anything about the COST of any
      statistic, which is the axis on which D2 is actually dominated; anything
      about ECDLP hardness; and anything about a curve outside the frozen
      good-reduction, minimal-model, gcd(n, p) = 1 setting. It also cannot
      certify that the enumeration of additive targets is complete - see the
      quantifier hazard above.
    nearby_object_control: >-
      THREE nearby objects on which the hoped-for conclusion is KNOWN FALSE,
      all three run in full in section 7 of d2-disposition.yaml, all three
      declining for distinct stated reasons. (1) SSSA on an anomalous curve -
      declines because the target has order n, not order below n, and because
      the source is a p-group so coprimality fails. (2) MOV/pairing on a
      low-embedding-degree curve - declines because the map is injective and
      the target is larger, and the additive argument does not even apply since
      the target is multiplicative. (3) A composite-order subgroup - declines
      because the primality hypothesis fails, and this is the object that
      forced the 'conditional on n prime' qualification onto the STRICT verdict
      instead of allowing an unconditional statement. A method that could not
      distinguish the closed case from all three would not have identified the
      load-bearing structure; this one distinguishes each by a different
      hypothesis, which is stronger than distinguishing all three by one.
    honest_ceiling_note: >-
      The ceiling is LOW and it is the point. Both closures are elementary
      divisibility facts. Their value is not depth but PLACEMENT - they say
      which of the three readings of a live open sub-question is settled, and
      the reason the sub-question looked open for longer than it was is that
      the three readings were never separated.

  proof_obligations:
    - claim: 'For n prime, a nonconstant homomorphism from <S> to a group of order below n does not exist.'
      responsibility: strictness
      status: >-
        DISCHARGED BY CITATION - KN-FIND-ffe1df Theorem C terminal step,
        Validator-confirmed, quoted verbatim in the disposition. Not re-derived
        here, per the handoff's instruction.
    - claim: >-
        For any map from a prime-order group to any set that propagates under
        any combining rule, the map is injective or constant - the
        target-structure-free generalisation.
      responsibility: strictness
      status: >-
        CITED from IDEA-20260807-df906f claim (A), a `proposed` and unadmitted
        ledger record; its four-line proof was re-read this session and found
        valid. Derivation tier, NOT independent validation, and the tier
        difference from Theorem C is recorded wherever it is used.
    - claim: >-
        Every homomorphism from a finite group of order coprime to p into a
        p-group or a torsion-free group is trivial, and every additive target
        of the p-adic tower is one or the other.
      responsibility: correctness
      status: >-
        DERIVED THIS SESSION at derivation tier from Lagrange plus the
        torsion-freeness statement quoted verbatim from KN-TECH-73630e. The
        second half of the claim - that the enumeration of additive targets is
        exhaustive - is ENUMERATED, NOT PROVED, and is flagged as the
        quantifier hazard.
    - claim: >-
        Every D2 statistic is a poly(r, log p) computable function of the F_p
        point, so the digit vector is redundant rather than lossy relative to
        that point.
      responsibility: interface
      status: >-
        NOT THIS SESSION'S CLAIM. Cited from IDEA-20260901-b4e6eb claim (A),
        whose own proof obligation P3 (digit-for-digit agreement between the
        k-free transport path and the direct lift) is UNDISCHARGED because that
        record has not been run. Everything this file builds on the transport
        lemma inherits that undischarged obligation and says so.
    - claim: >-
        n prime is not a hypothesis of ECDLP-IDEA-436, so the STRICT closure is
        conditional rather than unconditional over the record's own scope.
      responsibility: scope
      status: >-
        DISCHARGED by direct reading - ECDLP-IDEA-436 Assumption 1 requires
        good reduction, p at least 3, and gcd(n, p) = 1, and does not mention
        primality; the erratum's repair R-OBJ2 adds n prime to the D1
        corroboration only.
    - claim: 'Every reported statement names its tier, its scope, and whether it is cited or derived.'
      responsibility: scope
      status: 'discharged throughout; no number is reported because none was measured.'

  audits_not_applicable_and_why:
    - audit: 'baseline reproduction for the -LIKE residue'
      not_applicable_reason: >-
        No verdict is reached on the -LIKE residue, so there is no conclusion
        to embed and no baseline to reproduce. The relevant baseline for a
        FUTURE -like claim is stated instead - IDEA-20260815-f558e4's committed
        x-bucket values at p near 100, which b4e6eb makes the blocking r = 1
        fixture. Not silently omitted.
    - audit: 'method ceiling for the -LIKE residue'
      not_applicable_reason: >-
        A ceiling bounds what a method could prove; this session applies no
        method to the -like residue beyond an enumeration and one FAILED
        self-correction attempt, which is reported as failed. Stating a ceiling
        for a method that was not applied would overstate the work.
    - audit: 'constructive transform selection for CAND-D2-B'
      not_applicable_reason: >-
        CAND-D2-B is a literature read with a binary outcome, not a
        construction. No transform is being attempted and none is claimed.
