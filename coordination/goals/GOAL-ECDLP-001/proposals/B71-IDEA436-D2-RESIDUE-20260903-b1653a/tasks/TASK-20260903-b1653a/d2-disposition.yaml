d2_disposition:
  task: TASK-20260903-b1653a
  goal: GOAL-ECDLP-001
  proposal_namespace: B71-IDEA436-D2-RESIDUE-20260903-b1653a
  role: idea-generator
  recorded_at: '2026-09-03'
  requested_policy: research-deep
  reasoning_effort: high

  tier_and_scope_header: >-
    DERIVATION TIER, ZERO RUNS, SINGLE SESSION. No experiment, implementation,
    command, timing, or p-adic arithmetic was performed. Nothing below is an
    experimental result, an attack, a speedup, a hardness result, a closure of
    any KN-OPEN record, or a status change. Status changes and dispositions are
    the Coordinator authority alone; everything here is a recommendation. No
    identifier is minted and no B71, H, EXP, EV, DEC, KN, or CORR record is
    created by this task.

  object_studied: >-
    Disjunct D2 of ECDLP-IDEA-436 hypothesis H, verbatim - a fixed statistic T
    of the precision-r coordinate digits of a SINGLE lifted point [k]S-hat,
    where S-hat is the canonical order-n prime-to-p torsion lift of S in E(F_p)
    and E has good reduction on a Weierstrass model over Z_p with
    v_p(discriminant) = 0 (the erratum repair R-F1 setting). The attached
    sub-question, verbatim from section I item 3 and section B Part 2 of the
    2026-08-31 erratum - 'Is there a statistic T and a precision schedule r(n)
    such that T(sigma(.)) is a nonconstant homomorphism-like map <S> to (small
    target)?'

  headline: >-
    THE TWO HALVES GET DIFFERENT VERDICTS, AND A THIRD READING WAS FOUND THAT
    THE HANDOFF SPLIT DOES NOT COVER. (a) The STRICT reading is CLOSED, but
    only under the added hypothesis n prime, which ECDLP-IDEA-436 Assumption 1
    does NOT carry (it requires only gcd(n, p) = 1). (b) The -LIKE residue is
    OPEN, and this session does not close it; what it does is RELOCATE it -
    after the four-escape audit in section 5 the residue is exactly one escape
    (probabilistic propagation) applied to statistics of a REDUNDANT
    re-encoding, so it is not a p-adic question at all and D2 is
    cost-dominated by its own r = 1 shadow. (c) A THIRD reading, STRICT-ISO -
    a nonconstant homomorphism onto a target of the SAME size, which is what
    every historically successful representation attack on ECDLP actually is -
    is not covered by the handoff's 'small target' definition, is NOT closed by
    Theorem C, and is where the KN-TECH-033 coincidence question really lives.
    Section 4 names its coincidence and gives an elementary obstruction for
    ordinary curves.

  # ------------------------------------------------------------------
  # 1. THE SPLIT, DECLARED BEFORE ANY ARGUMENT
  # ------------------------------------------------------------------
  split:
    - id: STRICT
      definition: >-
        T composed with digit extraction is an actual group homomorphism
        phi from <S> to G for some group G with |G| < n, and phi is nonconstant.
        This is the handoff's reading (a), taken verbatim.
      verdict: closed_conditional_on_n_prime
    - id: STRICT-ISO
      definition: >-
        T composed with digit extraction is an actual nonconstant group
        homomorphism from <S> to G with |G| >= n - in practice injective, so
        that the map is a change of representation rather than a quotient. NOT
        covered by the handoff's reading (a), which requires |G| < n, and NOT
        covered by reading (b), because the map is an exact homomorphism and
        not an approximate one. Recorded as a scope discovery, not as a
        reinterpretation of the brief.
      verdict: not_closed_by_theorem_c__closed_for_the_p_adic_target_family_by_an_exponent_coprimality_argument__open_in_general
    - id: LIKE
      definition: >-
        Everything the erratum's deliberately looser phrase 'homomorphism-like'
        admits that is not an exact homomorphism - approximate, partial,
        statistical, or structure-preserving-only-on-a-subset maps. The
        handoff's reading (b), taken verbatim.
      verdict: open__relocated_and_narrowed__not_closed_by_this_session

  # ------------------------------------------------------------------
  # 2. STRICT READING - THE THEOREM C APPLICABILITY ASSESSMENT
  # ------------------------------------------------------------------
  strict_reading:
    theorem_c_applicability:
      instruction_followed: >-
        The handoff requires this be ASSESSED rather than assumed, with the
        hypotheses of KN-FIND-ffe1df Theorem C checked explicitly against D2's
        source and target, and with the theorem CITED rather than re-derived if
        it applies. Both are done below.
      theorem_c_as_stated_in_the_source:
        record: KN-FIND-ffe1df
        provenance: internal
        opened: 'read in full, this session, 2026-09-03'
        verbatim_quote: >-
          'A tree must invert f in each argument to index buckets, so f is a
          quasigroup. Exact sum-compatibility plus associativity of + on E
          forces f associative; an associative quasigroup is a group; so h is a
          surjective homomorphism E(F_p) -> ([M],f), impossible for N prime and
          M < N. Four lines, no character-sum input, no restriction on h.'
        validator_status_verbatim: >-
          'The Validator independently confirmed Theorem C in full, including
          the case this entry did not check (non-surjective h: the argument
          runs on im(h), giving M_eff | N).'
      hypothesis_check:
        - hypothesis: source group has PRIME order
          d2_status: >-
            SATISFIED ONLY CONDITIONALLY. <S> has order n. ECDLP-IDEA-436
            Assumption 1 requires only gcd(n, p) = 1 and does NOT require n
            prime; the erratum added n prime to the scope of the D1
            CORROBORATION only (repair R-OBJ2), never to D2. So the hypothesis
            holds in the cryptographic target regime (KN-TECH-030, internal,
            quoted by the erratum verbatim - 'It gives no advantage when n is
            prime -- which is the designed case for every cryptographic curve')
            and FAILS at the toy scale where this program does its
            measurements. This is a real gap in the sub-question as written,
            not a technicality.
          verdict: conditional
        - hypothesis: the source is a subgroup rather than the whole group
          d2_status: >-
            IMMATERIAL. Theorem C is stated for E(F_p) with #E(F_p) = N prime,
            i.e. the whole group; D2's source is <S> of order n, possibly a
            proper subgroup. The argument uses only that the source is a finite
            group of prime order, so restricting to <S> changes nothing. The
            Validator's own extension (run the argument on im(h)) covers the
            non-surjective case, which is D2's case, since a D2 statistic is
            not assumed onto.
          verdict: satisfied
        - hypothesis: the TARGET carries a group structure and phi respects it
          d2_status: >-
            SATISFIED BY THE STRICT READING'S OWN DEFINITION, and NOT otherwise.
            D2's sub-question says only '(small target)' and does not say the
            target is a group. Theorem C reaches a group target because its own
            chain (quasigroup plus associativity) MANUFACTURES one; D2 has no
            such chain, so under the strict reading the group structure must be
            declared as a hypothesis, and under the -like reading it is absent.
            This is where the two halves genuinely part company.
          verdict: satisfied_by_declaration
        - hypothesis: 'the target is smaller than the source'
          d2_status: >-
            SATISFIED for STRICT by definition; VIOLATED for STRICT-ISO, which
            is exactly why Theorem C does not close that reading. See section 4.
          verdict: satisfied_for_strict_only
      applicability_verdict: >-
        THEOREM C APPLIES to the STRICT reading, under the added hypothesis n
        prime, and it is cited rather than re-derived, as the handoff directs.
        Two honest qualifications are recorded rather than smoothed over.
        FIRST, what applies is Theorem C's TERMINAL group-theoretic step - a
        homomorphic image of C_n has order dividing n, so for n prime a
        nonconstant homomorphism forces the image to have order n, exceeding
        |G|, a contradiction. None of KN-FIND-ffe1df's character-sum machinery,
        none of its Weil or Bombieri input, and none of the
        quasigroup-to-group chain is engaged by D2, because D2's strict reading
        hands over the homomorphism as a hypothesis rather than deriving it
        from a combining rule. The value of citing Theorem C is that this step
        is VALIDATOR-CONFIRMED in a committed record, which no other statement
        of it in this corpus is. SECOND, Theorem C is not the sharpest
        instrument the corpus holds for this question; see immediately below.
    sharper_corpus_instrument:
      record: IDEA-20260807-df906f
      status_caveat: >-
        A `proposed` ledger proposal, NOT an admitted hypothesis and NOT a
        Validator-confirmed knowledge record. It is cited here as a corpus
        statement whose four-line proof this session re-read and found valid;
        that re-reading is derivation tier and is not independent validation.
      claim_A_verbatim: >-
        'Let G be a group of prime order N. Let S be any set and v: G -> S any
        map. Suppose v PROPAGATES, i.e. there exists F: S x S -> S with
        v(R + R') = F(v(R), v(R')) for all R, R' in G. Then v is injective or
        constant. [...] No hypothesis on S or F is used -- F need not be
        associative, computable, or well-behaved.'
      why_it_is_strictly_stronger_for_D2: >-
        D2's target is a '(small target)', not necessarily a group, and
        'homomorphism-like' in its exact sense means 'propagates under SOME
        combining rule'. df906f (A) needs no group structure on the target, no
        associativity, and no computability, so it covers exactly the class D2
        names, whereas Theorem C first needs the target to be a group. For D2
        the two give the same verdict; df906f gives it on strictly weaker
        hypotheses. RECOMMENDATION TO THE COORDINATOR - if a D2 disposition is
        recorded, cite Theorem C for authority (it is Validator-confirmed) and
        df906f (A) for generality, and note the tier difference between them.
    verdict_strict: >-
      CLOSED, CONDITIONAL ON n PRIME. For n prime there is no nonconstant exact
      homomorphism from <S> onto any group of order below n, hence none arising
      from any statistic of any precision-r digit vector, for every r and every
      precision schedule r(n), uniformly in n. Closed by KN-FIND-ffe1df Theorem
      C (terminal step, Validator-confirmed) and, on weaker hypotheses covering
      non-group targets, by IDEA-20260807-df906f claim (A). The closure is a
      THEOREM, so unlike this lane's toy measurements it carries to
      cryptographic n without a transfer assumption - which is the one place in
      this whole file where scale is not a limitation.
    what_the_strict_closure_does_not_cover:
      - >-
        COMPOSITE n. For n = d * m with 1 < d < n the conclusion is FALSE and
        the witnesses are explicit - k mod d is a nonconstant homomorphism onto
        Z/d. Those witnesses are exactly the Pohlig-Hellman projections
        (KN-TECH-030, internal, quoted through the erratum), already on the
        frontier, and they cost sqrt(d) group operations to evaluate from the
        POINT rather than from the scalar. So the composite case is not a
        counterexample to anything useful - but it is the only regime in which
        the object D2 asks for provably EXISTS, which makes it the correct
        instrument-power control, and IDEA-20260901-b4e6eb already names it as
        its CONTROL C. This session ENDORSES that control and adds one demand -
        it is only non-vacuous if the statistic family is frozen in advance and
        cost-restricted, since 'any function of the digits' trivially includes
        k mod d (the digits determine the point, which determines k mod d).
      - 'ANY approximate, partial, statistical, or subset-restricted map - reading (b), section 5.'
      - 'ANY target of size at least n - reading STRICT-ISO, section 4.'
      - >-
        ANY cost statement. A closure of exact homomorphisms says nothing about
        what a statistic costs, and cost is the axis on which D2 is actually
        dominated (section 5.4).

  # ------------------------------------------------------------------
  # 3. THE STANDING INFORMATION BOUNDARY, APPLIED AS A FILTER
  # ------------------------------------------------------------------
  information_boundary_filter:
    boundary: >-
      KN-TECH-73630e (internal, read in full this session) verbatim - 'The lift
      is information-theoretically empty - S-hat is a deterministic function of
      S, computable to any precision from E(F_p) data alone by Hensel lifting
      plus the order condition. Nothing is learned that was not already
      available.'
    consequence_for_D2: >-
      Every statistic of S-hat's digits is a deterministic function of data the
      querying party already holds, so its conditional entropy given that
      party's view is exactly 0. Any D2 candidate claiming an information gain
      is refuted before it is costed. NO candidate proposed below claims one.
    prior_art_credit_recorded_against_this_session: >-
      The explicit computational form of this boundary - a poly(r, log p)
      procedure computing digits_r([k]S-hat) from [k]S alone, hence
      T(digits_r([k]S-hat)) = Phi_{r,T}([k]S) for an explicit poly-time
      Phi_{r,T} - is ALREADY IN THE CORPUS as claim (A), the transport lemma,
      of IDEA-20260901-b4e6eb (proposed 2026-09-01, status `proposed`, not
      admitted). This session derived the same statement independently before
      finding that record, and claims NO novelty for it. Everything in sections
      5.1 to 5.4 below is built on b4e6eb's lemma and cites it.

  # ------------------------------------------------------------------
  # 4. STRICT-ISO - THE SCOPE DISCOVERY, AND THE COINCIDENCE NAMED
  # ------------------------------------------------------------------
  strict_iso_reading:
    why_it_exists_as_a_separate_reading: >-
      The sub-question says '(small target)', and the handoff's reading (a)
      formalises that as a target of order below n. But EVERY representation
      attack on the ECDLP that has ever worked is a nonconstant homomorphism
      onto a target of the SAME size or larger, never onto a smaller one.
      Smart / Satoh-Araki / Semaev is an ISOMORPHISM from <S> onto (F_p, +)
      with target order n = p (KN-TECH-033, internal, read in full, verbatim -
      'there is an explicit isomorphism from that group onto the additive group
      (F_p, +)' and 'the ECDLP is linear time' at 'O(log p) field operations').
      MOV/pairing on a low-embedding-degree curve is an INJECTION of <S> into
      the multiplicative group of F_{p^k} (KN-TECH-032, NOT opened by this
      session; the pointer is KN-TECH-033's own applicability-limits sentence,
      verbatim - 'Nothing here transfers to trace zero (supersingular), which
      is the pairing case (KN-TECH-032)'; the injectivity and the
      subexponential consequence are `recalled`). Neither is closed by Theorem
      C, and neither is closed by df906f (A) - SSSA because the target has
      order n rather than order below n, MOV because the map is injective and
      df906f (A)'s conclusion is precisely 'injective or constant'. BOTH
      ARGUMENTS CORRECTLY DECLINE TO FIRE ON BOTH OBJECTS; this is the
      proves-too-much control of section 7 and it passes.
    the_reading_this_forces: >-
      Under the lossy-projection test (docs/inventor-protocol.md section 2) the
      historically successful ECDLP representation attacks are CHANGES OF
      COORDINATES - they discard nothing. The protocol says a projection that
      loses nothing is not a new object; the historical record says that on a
      prime-order group the non-lossy changes of coordinates are the only
      things that have ever won. That tension is recorded as an OBSERVATION AND
      A FRAMING, not a result, and it is the reason STRICT-ISO deserves its own
      row - a D2 proposal aimed at a 'small target' is aimed away from where
      the only known wins are.
    name_your_coincidence__the_kn_tech_033_bar:
      bar_as_its_source_states_it:
        record: KN-TECH-033
        provenance: internal
        opened: 'read in full, this session'
        verbatim: >-
          'representations win exactly when the curve supplies a global
          structural coincidence,' and 'a proposal must name its coincidence'
        self_label_carried_forward_verbatim: >-
          'The representation-attack reading in the second section is this
          program's own interpretation and is a framing, not a result.'
        how_this_file_uses_it: >-
          As a bar on proposals, at exactly the strength its source claims and
          no more. Nothing below treats the bar as a theorem, and no closure in
          this file rests on it.
      the_coincidence_SSSA_supplies: >-
        The curve order equals p, so the source group <S> IS a p-group. That
        single fact is what puts the additive target within reach - the
        formal-group side of the p-adic tower is where the additive structure
        lives, and a p-group source is the only kind of source that can map to
        it nontrivially.
      the_obstruction_for_an_ORDINARY_curve_under_D2s_own_hypotheses:
        statement: >-
          Under ECDLP-IDEA-436 Assumption 1, gcd(n, p) = 1. Every additive
          target available anywhere in the p-adic tower of the good-reduction
          model is either a p-group or torsion-free - the formal group is
          pro-p and torsion-free away from p (KN-TECH-73630e, internal, its own
          derivation section, verbatim - 'the formal group E-hat(pZ_p), which
          is a pro-p group and hence torsion-free away from p'), each graded
          piece of the filtration is an F_p vector group, and (Q_p, +) is
          torsion-free. A homomorphism from a finite group of order n into a
          group of exponent a power of p has image of order dividing a power of
          p and dividing n, hence trivial; a homomorphism from a finite group
          into a torsion-free group is trivial. THEREFORE EVERY HOMOMORPHISM
          FROM <S-hat> INTO EVERY ADDITIVE TARGET OF THE p-ADIC TOWER IS ZERO,
          for every precision r and every schedule r(n).
        tier: >-
          DERIVATION, elementary (Lagrange plus torsion-freeness). It uses one
          internal record for the torsion-freeness fact and nothing else. It is
          re-checkable in two lines and is offered as such.
        what_it_closes: >-
          The FILTRATION-LINEAR subfamily of STRICT-ISO and of STRICT alike -
          any D2 statistic whose homomorphism property comes from the additive
          structure of the p-adic tower. That subfamily is not a corner case -
          it is precisely the family the SSSA attack belongs to, i.e. the one
          family for which a working precedent exists, which is why closing it
          is worth stating.
        what_it_does_not_close: >-
          Non-additive targets (multiplicative groups, pairings, class groups),
          which is where MOV lives and which the p-adic tower does not supply;
          and every non-exact map, which is section 5.
        the_coincidence_restated_as_a_dichotomy: >-
          The SAME object - the second p-adic digit of a canonical lift, i.e.
          a Fermat-quotient-type quantity - collapses the ECDLP when the curve
          order equals p, and is provably homomorphism-free when gcd(n, p) = 1.
          D2's own hypothesis gcd(n, p) = 1 is exactly the negation of the
          coincidence that makes the only known p-adic representation attack
          work. A D2 proposal therefore cannot name SSSA's coincidence; it must
          name a different one, and this session found none available in the
          good-reduction, gcd(n, p) = 1, large-embedding-degree regime.
    verdict_strict_iso: >-
      NOT closed by Theorem C, and correctly so - the nearby objects where the
      conclusion is known false (SSSA, MOV) are exactly the objects Theorem C's
      hypotheses exclude. CLOSED for the additive/p-adic target family by the
      exponent-coprimality argument above, at derivation tier, under D2's own
      hypotheses. OPEN in general, since no argument here reaches non-additive
      targets, and open is the honest label - the forward guidance is that any
      such target must be exhibited outside the p-adic tower, at which point it
      is no longer a D2 candidate.

  # ------------------------------------------------------------------
  # 5. THE -LIKE RESIDUE
  # ------------------------------------------------------------------
  like_residue:
    verdict: >-
      OPEN. This session does not close it and does not claim to. What it does
      is RELOCATE and NARROW it, by four steps that are individually cheap and
      jointly decisive about where the remaining uncertainty sits.
    step_1_enumeration_of_what_like_admits:
      note: >-
        Enumerated BEFORE any argument, so the argument cannot be tuned to the
        enumeration. The four escapes are IDEA-20260807-df906f's own list,
        stated there 'before any measurement so that the measurement cannot be
        tuned to them'; this session applies them to D2, which that record does
        not do.
      escapes:
        - id: E1
          name: probabilistic propagation
          statement: >-
            T(R + R') is determined by (T(R), T(R')) only with probability q
            over R, R'. df906f (A) forces q below 1 for lossy T but says
            nothing about how far below 1.
          d2_status: 'OPEN - this is the entire residue. See step 2 and step 3.'
        - id: E2
          name: auxiliary state
          statement: >-
            T propagates only when supplemented by extra data a(R); the real
            object is then the pair (T, a). Elliptic nets are the named prior
            art.
          d2_status: >-
            UNAVAILABLE TO D2, and this is new to the corpus as far as this
            session checked. By b4e6eb's transport lemma the digits at every
            precision are a deterministic function of the F_p point, so any
            'auxiliary' digit data is a function of the state it is meant to
            supplement. The pair (T, a) is then just another statistic of the
            point and df906f (A) applies to it unchanged. This is the exact
            structural difference from elliptic nets, whose auxiliary values
            W(a, b) are functions of the SCALAR PAIR and not of the point.
            D2's higher precisions look like auxiliary state and are not.
        - id: E3
          name: objects not on the prime-order group
          statement: >-
            The ell-torsion is a rank-two module, not of prime order, so it has
            genuine lossy quotients - the ell-isogenies.
          d2_status: >-
            UNAVAILABLE BY CONSTRUCTION. D2's object lives on <S-hat>, which
            reduces isomorphically onto <S> of prime-to-p order. A statistic
            that reached ell-torsion structure (a division-polynomial value,
            say) would be df906f's own object, not D2's, and would exit the
            frozen family.
        - id: E4
          name: objects not tracked under the group law
          statement: >-
            A statistic used as a walk-iteration function or a
            distinguished-point predicate rather than as a homomorphism.
            Pollard rho is the incumbent instance.
          d2_status: >-
            AVAILABLE BUT STRICTLY COST-DOMINATED, and the argument is
            b4e6eb's claim (C), cited not re-derived - a D2 statistic costs
            poly(r, log p) per evaluation while the F_p coordinate it is a
            function of costs O(1), roughly an r-cubed premium (b4e6eb
            target_complexity.hidden_overhead), so for use inside rho it is
            dominated for every r above 1 and degenerates to the plain F_p
            coordinate at r = 1. THIS IS THE PRACTICALLY IMPORTANT ROW - top
            bits of x as a distinguished-point predicate is the one place a
            coordinate digit statistic has ever paid in ECDLP practice, and D2
            can only be a more expensive way to compute it.
      audit_result: >-
        THREE OF FOUR ESCAPES ARE CLOSED FOR D2 SPECIFICALLY - E2 by the
        transport lemma, E3 by construction, E4 on cost - leaving exactly E1.
        That is the whole of the -like residue.
    step_2_the_residue_cannot_be_closed_group_theoretically:
      finding: >-
        There is an EXPLICIT constant-advantage approximate homomorphism on
        every cyclic group - the discrete-log interval bucket - so no
        group-theoretic argument can close E1. This is already in the corpus
        and is cited, not claimed.
      citation_record: KN-FIND-ffe1df
      citation_provenance: internal
      citation_verbatim: >-
        'Arbitrary cheap h. Proposition 2 of O2_derivation_attempt.md proves no
        group-theoretic argument can reach it: the dlog-interval pullback
        achieves eps ~ 1/2 at arbitrarily large M on every prime-order group.
        Only a definitional cost restriction closes this, and the cost clause
        is not a theorem.'
      consequence_for_D2: >-
        Any closure of the -like residue must be a COST or COMPUTABILITY
        statement, never a structural one. That single sentence explains why
        the sub-question has resisted a gate - it is not gateable in the
        register in which it is written.
      this_sessions_own_negative_result_recorded_against_interest: >-
        This session attempted a cheap self-correction bound for the
        HIGH-AGREEMENT end (q near 1) by the obvious route - pick a colliding
        pair R, R' with good row density, transfer the collision to a
        translation invariance v(T) = v(T + D), and iterate. The union bound
        over the orbit of D costs a factor n, so the argument reaches only
        q at least 1 - Theta(1/n), which is vacuous. IT DOES NOT WORK, and it
        is recorded here so the next session does not re-attempt it. A real
        bound needs Fourier or self-correction machinery (BLR-type linearity
        testing, `recalled`, no source opened by this program) or the o2 lane's
        character-sum machinery, whose own barriers are the M-squared
        Cauchy-Schwarz loss and the unrepaired bucket-averaging hole recorded
        in KN-FIND-ffe1df.
    step_3_where_the_residue_actually_lives:
      relocation: >-
        By the transport lemma every D2 statistic equals Phi_{r,T} of the F_p
        point. So the -like residue for D2 is a SUBSET of the residue for
        cheap F_p-coordinate statistics, and D2 contributes no statistic that
        is not already a function of the F_p point - it contributes an r-cubed
        cost premium and nothing else, UNLESS the one named open quantity below
        breaks that containment.
      the_one_named_open_quantity_name: THE DEGREE GAP
      the_one_named_open_quantity_prior_art: >-
        Stated as claim (D) of IDEA-20260901-b4e6eb, verbatim - 'Phi_{r,T} is
        poly-TIME but is NOT a bounded-degree algebraic function of the F_p
        coordinates: it is the output of a Hensel iteration and a projection,
        and its degree as an algebraic map is not controlled by anything this
        record can cite.' This session adds no novelty to the statement and
        proposes a cheaper way to settle it (section 6, CAND-D2-A).
      the_one_named_open_quantity_why_load_bearing: >-
        IDEA-20260815-f558e4's pinning of coordinate statistics at the Weil
        scale is stated 'up to the degree of the defining conditions'.
        Weil-type bounds degrade linearly in degree and are vacuous once the
        degree approaches sqrt(p). Every function on F_p is a polynomial of
        degree at most p - 1, so the QUESTION is not whether Phi_r has a degree
        but whether it has a SMALL one. If it does, the -like residue for D2 is
        closed conditionally on f558e4 (E) at zero further compute. If it does
        not, the pinning provably cannot reach D2 and the measurement b4e6eb
        proposes is the only route, which raises that record's priority rather
        than lowering it. Either way the answer decides how a multi-day
        measurement budget is spent.
      this_sessions_prediction_and_its_basis: >-
        PREDICTED HIGH DEGREE, i.e. the pinning does NOT reach D2. Basis, and
        it is an analogy and is labelled as one - the multiplicative-group
        analogue of the canonical lift is the Teichmuller lift, whose second
        digit is the Fermat quotient, and the Fermat quotient is studied
        precisely because it is NOT low-degree and requires its own
        exponential-sum machinery (see source-novelty-audit.yaml, external
        items X1 and X2, provenance `retrieved` at web-search-snippet depth
        only). The analogy is not a proof and the prediction is pre-registered
        so the measurement cannot be tuned to it.
    step_4_the_lossy_projection_test_applied_to_D2:
      instruction: >-
        docs/inventor-protocol.md section 2, applied before any experiment is
        proposed, as the handoff requires.
      is_the_projection_lossy: >-
        THE LIFT CONTRIBUTES ZERO LOSSINESS. The map from a point to its
        precision-r digit vector is INJECTIVE - digit 0 of x already determines
        the point up to the plus-or-minus fibre, and the higher digits add a
        deterministic function of it (transport lemma). Relative to the F_p
        point the digit vector is REDUNDANT, not lossy - a change of
        coordinates in exactly the protocol's sense, and its worked
        counterexample's failure mode. Whatever lossiness a D2 candidate has is
        entirely T's, and T is a statistic of the F_p point that could have
        been applied without ever mentioning Q_p.
      does_it_propagate_compatibly: >-
        The digit vector propagates deterministically under the group law of
        E over Z/p^r, so the compatibility clause is satisfied - and that is
        precisely why it is not a new object - it satisfies compatibility by
        being a re-encoding rather than by discarding something compatibly.
      credit: >-
        The same verdict is reached in IDEA-20260901-b4e6eb's
        object_first_candidate block, which states the object is 'not lossy but
        REDUNDANT'. This session confirms it independently and adds only the
        injectivity observation at digit 0 and the E2 consequence in step 1.
      consequence: >-
        A D2 experiment that does not include its own r = 1 shadow as a
        blocking comparator is uninterpretable, because the higher-precision
        arms differ from it by a change of coordinates plus a cost premium.
        b4e6eb already makes that comparator blocking; this file endorses that
        requirement and would treat its absence as disqualifying in any
        successor contract.
    null_object_control_for_any_surviving_candidate:
      required_nulls:
        - >-
          NULL-LIFT (record-specific, b4e6eb's NULL-2). Replace the canonical
          order-n lift by a Hensel lift WITHOUT the order-n projection. If the
          measured quantity is unchanged, the result is about Hensel digits in
          general and no canonical-lift-specific conclusion may be drawn.
          MANDATORY CORRECTION CARRIED FORWARD - DEC-20260903-256c7c records
          that the raw-perturbation null family (x0 = S.x + p^e) does NOT track
          e and reads the value set {0, 1} at every depth, so it is valid at
          e = 1 only and must NOT be cited as a dose-response instrument; the
          canonical-offset family is the one that tracks e.
        - >-
          MATCHED-MARGINAL SHUFFLE. KN-FIND-ffe1df's RT-EXP-1 records popcount
          and digitsum tripping a refutation criterion (alpha = +0.125 and
          +0.495, CIs excluding 0) and BOTH being false positives reproduced
          exactly by the shuffle (+0.135, +0.537). Any digit-statistic lane
          that omits this control will reproduce that false positive.
        - >-
          MATCHED IMAGE-SIZE RANDOM FUNCTION, with the sample-size decay
          parameter stated, so a finite-sample advantage that shrinks with
          sample size is separated from one that does not.
      artifact_tell_to_watch: >-
        docs/inventor-protocol.md section 3 - a quantity flat in the parameter
        meant to destroy it. For D2 that parameter is the PRECISION r. The
        erratum already records (section E item 4) that D1's image size is flat
        in r as a DERIVED rather than measured fact. For a -like measurement,
        flatness in r is the PREDICTED closure signal (the object is its own
        r = 1 shadow) and growth in r is the lead - so here the tell is
        inverted relative to the protocol's default and must be declared that
        way in advance, or the same number will be read both ways.

  # ------------------------------------------------------------------
  # 6. WHAT SURVIVES - CANDIDATES, WITH LOCAL LABELS ONLY
  # ------------------------------------------------------------------
  surviving_candidates_id_note: >-
    The candidate labels below are LOCAL to this file. No identifier is minted
    by this task; the Coordinator mints any IDEA or H identifier if it admits
    these, using tools/allocate_id.py.

  surviving_candidates:
    - id: CAND-D2-A
      title: >-
        Degree audit of the transport map - settle the degree gap by
        interpolation before spending a measurement budget
      class: measurement
      rank: 1
      claim: >-
        For the frozen setting and a fixed small precision r = 2, the digit-1
        map d1(x, y) = (second base-p digit of the x-coordinate of [k]S-hat)
        restricted to the curve, viewed as a function on the nonzero points of
        E(F_p), has algebraic degree as a polynomial in x - equivalently a
        coefficient support in the interpolation basis over F_p - that is
        generic, within a stated band of the degree of a uniformly random
        function on the same domain, and in particular exceeds sqrt(p) at every
        tested p. CONSEQUENCE IF TRUE - f558e4's Weil-scale pinning provably
        does not reach the D2 family, claim (D)'s degree gap is real, and
        b4e6eb's measurement is the only available route. CONSEQUENCE IF FALSE
        - the degree is polylogarithmic or otherwise below the Weil threshold,
        the pinning applies conditionally on f558e4 (E), and the -like residue
        for D2 is closed conditionally with no measurement program at all.
      mechanism: >-
        Every function from F_p to F_p is a polynomial of degree at most
        p - 1, so 'the degree of Phi_r' is a computable finite quantity, not a
        modelling choice. Interpolate d1 on the x-line (using the
        plus-or-minus symmetry so the function is well defined in x on the
        image of the curve, or interpolate on the curve's rational points
        directly) and read the degree and the coefficient support. The
        canonical lift is unique, so d1 is well defined; the FG-1 construction
        recorded in KN-FIND-1ba0fe (internal) computes it group-theoretically
        with no Hensel iteration.
      why_it_is_not_a_renamed_known_approach: >-
        b4e6eb proposes to MEASURE the statistical consequence of the degree
        gap through a majority-advantage program over six prime orders, three
        precisions and seven image sizes, with two nulls and three blocking
        controls. This candidate measures the DEGREE ITSELF, which is the
        quantity the gap is about, on one curve, in one interpolation. It is
        strictly upstream of b4e6eb and can make b4e6eb's Stage 3 unnecessary
        or, more likely, necessary and better-motivated.
      predictions:
        - metric: 'degree of the interpolated digit-1 map in x, at fixed p'
          direction: higher
          minimum_effect: >-
            at least p/2, i.e. within a factor 2 of the p - 1 ceiling and far
            above the sqrt(p) Weil threshold, at every tested p in the 10-bit
            to 16-bit band
        - metric: 'coefficient support size relative to a matched random-function null'
          direction: different
          minimum_effect: >-
            within 10 percent of the null's support size records the GENERIC
            branch; below 50 percent of the null's support records the
            STRUCTURED branch and is the lead
        - metric: 'degree as a function of r, for r = 2, 3, 4'
          direction: higher
          minimum_effect: 'non-decreasing in r; a degree that does not move with r is itself an artifact tell'
      minimal_test:
        design: >-
          One toy curve satisfying the frozen setting (good reduction, minimal
          model, n prime, gcd(n, p) = 1, not anomalous, order factored), p in
          the 10-bit to 16-bit band so the full x-line is enumerable. Compute
          the canonical order-n lift to precision r, extract digit 1 of x for
          every point of <S>, interpolate over F_p, report degree and support.
          Estimated cost - minutes, single core, tens of lines, reusing
          EXP-ECDLP-809375's arithmetic which already exists and is
          Coordinator-verified.
        controls:
          - 'MATCHED RANDOM NULL - interpolate a uniformly random function on the same domain; report its degree and support as the comparison distribution.'
          - 'NULL LIFT - the same interpolation on a Hensel lift without the order-n projection; if the degree is the same, the result is about Hensel digits generally.'
          - 'KNOWN-ANSWER ARM - interpolate digit 0, whose degree must be 1 in x by construction because it IS x. An implementation that does not return 1 there is wrong and nothing else may be read.'
          - 'PD-3 GUARD, carried from DEC-20260903-256c7c - naive Jacobian formulas over Z/p^r silently return a wrong answer when the difference of the two U-coordinates is a zero divisor. Any implementation must guard non-unit denominators explicitly or use staged evaluation.'
        required_metrics:
          - 'interpolated degree and coefficient support per (p, r, arm)'
          - 'degree of the matched random null on the same domain, with the seed discipline stated'
          - 'pass or fail of the digit-0 known-answer arm'
          - 'p, n, curve coefficients, r, seed, wall clock'
      falsification_conditions:
        - 'F1. The digit-0 arm does not return degree 1. Implementation error; nothing is reported.'
        - >-
          F2. The interpolated degree is below sqrt(p) at any tested p. The
          prediction is refuted, the Weil pinning may reach D2, and the -like
          residue narrows further without a measurement program.
        - >-
          F3. The degree matches the random null within the band at every
          tested p and r. The PREDICTED outcome - the degree gap is real, the
          pinning is vacuous for D2, and b4e6eb's measurement is the only
          route. This closes NOTHING about D2 and says so.
        - >-
          F4. Budget or arithmetic failure. Infrastructure outcome under
          AGENTS.md rule 5, never evidence about the degree.
      confounders:
        - >-
          Degree is basis-dependent in presentation but not in substance - the
          quantity that matters for a Weil-type bound is the degree of the
          defining conditions, and interpolated degree on the x-line is a proxy
          for it, not the same number. STATED AS A GAP - a high interpolated
          degree does not by itself prove that no low-degree DEFINING
          description exists in other coordinates. The null comparison is what
          makes the measurement informative despite this.
        - >-
          Small p inflates the chance that a genuinely structured map looks
          generic and vice versa; the ladder in p is the only defence and three
          primes is the minimum.
      interpretation_limits:
        - 'Toy tier. No transfer to cryptographic p is licensed by any outcome.'
        - 'It measures a property of Phi_r, not an advantage, not an attack, and not any exponent.'
        - 'It does not close ECDLP-IDEA-436 D2, KN-OPEN-3417fc, or any subfamily; it decides whether an existing bound can be applied.'
      heuristic_assumptions:
        - id: H1
          statement: >-
            For the frozen setting with gcd(n, p) = 1, the digit-1 map of the
            canonical order-n lift behaves, with respect to its degree and
            coefficient support as a function on F_p, like a uniformly random
            function on the same domain - degree p - 1 - o(p) and support
            (1 - o(1)) times p.
          rigorous_support: >-
            NONE INSIDE THIS PROGRAM, and the honest statement is that H1 has
            no rigorous half here. The nearest rigorous analogue is the
            exponential-sum and value-set literature for FERMAT QUOTIENTS, the
            multiplicative-group counterpart of this exact object (Heath-Brown;
            Ostafe and Shparlinski; Shparlinski), which establishes nontrivial
            cancellation and pseudorandomness for that counterpart. Provenance
            `retrieved` at web-search-snippet depth only - no full text was
            read by this session and no elliptic analogue was located. The
            classical distribution statement H1 imitates is that the digits of
            a canonical lift equidistribute like independent uniform digits.
          validation_plan: >-
            SAMPLE - the full point set of <S> at three or more primes in the
            10-bit to 16-bit band, exhaustively, so no estimator variance
            enters. SHORTCUT - none needed at this scale; the honest cost is
            that H1 is validated only where interpolation is exhaustive and the
            transfer to cryptographic p is an EXPLICIT and unjustified
            extrapolation. COMPARISON DISTRIBUTION - the empirical degree and
            support of matched uniformly random functions on the same domain,
            over at least 32 seeds, reported as a distribution rather than a
            point. TAIL CHECK - the single lowest degree observed across all
            (p, r) cells against the lowest observed across an equal number of
            null replicates; a real structure must shift the distribution, not
            produce one outlier cell. RECORDED PARAMETERS - p, n, curve
            coefficients, r, seed, arm.
          falsification_condition: >-
            An interpolated degree below sqrt(p), or a support below half the
            null's, reproduced at three primes. H1 is refuted at the tested
            scale and the result is a lead requiring independent review before
            interpretation.
      target_complexity:
        time_exponent: 'NO ATTACK EXPONENT IS CLAIMED AND NONE CAN BE. This is a gating measurement, not an algorithm.'
        memory_exponent: 'O(p) field elements for the exhaustive interpolation - a property of the measurement, not of any proposed algorithm. The object offers no memory axis.'
        best_known: >-
          Parallel Pollard rho with distinguished points and the negation map,
          about 0.886 sqrt(n) group operations, small per-processor memory
          (KN-TECH-006, internal, via the erratum); BSGS at n^{1/2} time and
          memory; Pohlig-Hellman fixing which n is at issue (KN-TECH-030).
        hidden_overhead: >-
          Nothing hides in an o(1) - every quantity here is a finite integer at
          a stated toy p. The r-cubed evaluation premium of a D2 statistic
          (b4e6eb) is the only cost factor in the lane and it is stated, not
          absorbed.
        tradeoff_note: 'Not applicable - no attack is mounted and no time-memory point is claimed.'
      estimated_cost:
        implementation: low
        compute: low
      recommended_priority: high
    - id: CAND-D2-B
      title: 'Zero-compute closure attempt for the p-adic height subfamily of D2'
      class: mechanism
      rank: 2
      claim: >-
        If the p-adic canonical height on E over Q_p is a quadratic form
        vanishing on torsion, then every p-adic-height-type functional is
        IDENTICALLY ZERO on <S-hat>, which is pure n-torsion, and the entire
        height subfamily of D2 is constant, closing a named subfamily at zero
        compute. If instead a non-canonical or non-quadratic p-adic height is
        nonzero on prime-to-p torsion, that height is a NAMED SURVIVING D2
        CANDIDATE and the first one with an external motivation.
      mechanism: >-
        Canonical heights are quadratic forms and vanish on torsion
        (`recalled`, standard for the archimedean canonical height; the p-adic
        Mazur-Tate / Schneider / Coleman-Gross analogues are believed to share
        the property but NO source was opened by this session and the claim is
        explicitly NOT asserted). The check is a literature read, not a
        computation.
      external_hook: >-
        Gadiyar and Padma, 'A p-adic Height Function Of Cryptanalytic
        Significance', arXiv:math/0512459, submitted 20 December 2005, 4 pages.
        Provenance `retrieved`, ABSTRACT PAGE ONLY - the abstract states only
        that 'an efficient algorithm for calculating a p-adic height could have
        cryptanalytic applications' and the full text was NOT read. This is a
        pointer for a reviewer, not support, and nothing above rests on it.
      why_both_outcomes_are_informative: >-
        Vanishing closes a subfamily that a published note calls
        cryptanalytically significant, with a one-line mechanism, which is
        exactly the closure standard's 'named obstruction plus redirection'.
        Non-vanishing produces the first D2 candidate with an external source
        behind it, and it would be a genuine surprise worth a record.
      predictions:
        - metric: 'value of the p-adic canonical height on a nonzero n-torsion point of E over Q_p'
          direction: lower
          minimum_effect: 'exactly 0 for every n-torsion point, or a nonzero value at some point - a binary outcome, not an estimate'
      minimal_test:
        design: >-
          Read the definition and the torsion behaviour of the p-adic canonical
          height in one standard source plus the 4-page Gadiyar-Padma note.
          Zero compute; hours of reading. Record which height, on which group,
          with what torsion behaviour, and whether it is defined for a purely
          local point rather than a global one - THIS LAST POINT IS THE LIKELY
          KILLER AND IS FLAGGED IN ADVANCE, since global heights need a global
          point and S-hat is constructed locally.
        controls:
          - 'The archimedean canonical height as a known-answer arm - it provably vanishes on torsion, so a reading that says otherwise is a misreading.'
        required_metrics:
          - 'the exact definition read, with source and page'
          - 'stated torsion behaviour, quoted verbatim'
          - 'whether the height is defined for a local point without a global model'
      falsification_conditions:
        - 'F1. The height requires a global point. The subfamily is not defined for D2 at all and the candidate is withdrawn rather than closed.'
        - 'F2. The height vanishes on torsion. Subfamily closed, mechanism recorded, no measurement needed.'
        - 'F3. The height is nonzero on prime-to-p torsion. A named surviving candidate; route to a proper ideation record with its own cost model.'
      interpretation_limits:
        - 'A literature reading is not a theorem of this program and closes only the subfamily it names.'
        - 'No exponent, no attack, no cost claim.'
      target_complexity:
        time_exponent: 'none claimed - this is a literature audit'
        memory_exponent: 'not applicable'
        best_known: 'as CAND-D2-A'
        hidden_overhead: 'none - zero compute'
        tradeoff_note: 'not applicable'
      estimated_cost:
        implementation: low
        compute: low
      recommended_priority: medium

  endorsed_not_originated:
    - >-
      IDEA-20260901-b4e6eb's CONTROL C, the composite-order instrument-power
      gate. This session independently reached the same control and, on finding
      it already recorded, endorses rather than re-proposes it, with ONE ADDED
      DEMAND - the statistic family must be frozen AND cost-restricted in
      advance, since 'any function of the digits' trivially computes k mod d
      (the digits determine the point). Without that restriction the control is
      vacuous. RATIONALE FOR THE ENDORSEMENT - the composite case is the ONLY
      regime in which the object D2 asks for provably exists, so a
      digit-statistic search that cannot find it there has no demonstrated
      power, and a negative from that search at prime n is uninterpretable.
      This is the same lesson KN-FIND-ffe1df records against its own P2
      control, verbatim - it 'never demonstrates that the instrument resolves
      the M*T ~ 1 boundary where closure is actually decided.'
    - >-
      IDEA-20260901-b4e6eb's blocking r = 1 comparator, for the reason in
      section 5.4 - without it the higher-precision arms differ from the
      baseline by a change of coordinates and a cost premium, and the report is
      uninterpretable.

  # ------------------------------------------------------------------
  # 7. CONTROLS ON THIS SESSION'S OWN ARGUMENTS
  # ------------------------------------------------------------------
  proves_too_much_control:
    method: >-
      Run each closure argument against nearby objects for which its conclusion
      is KNOWN FALSE. An argument that still goes through there is wrong
      somewhere nobody has read closely enough.
    objects:
      - object: 'Smart / Satoh-Araki / Semaev on an anomalous curve, curve order equal to p'
        conclusion_known_false_because: >-
          KN-TECH-033, internal, read in full, verbatim - 'there is an explicit
          isomorphism from that group onto the additive group (F_p, +)' and
          'the ECDLP is linear time' at 'O(log p) field operations'.
        does_the_strict_argument_fire: >-
          NO, and for a stated structural reason rather than by exception. The
          SSSA map has a target of order exactly n, not of order below n, and
          it is an isomorphism; both Theorem C and df906f (A) require a smaller
          target or conclude 'injective or constant', and an isomorphism is
          injective. The argument correctly declines. CONTROL PASSES.
        does_the_exponent_coprimality_argument_fire: >-
          NO. There n = p, so the source is a p-group and the coprimality step
          fails at its first line. The argument correctly declines, and this is
          the sharpest available statement of the coincidence.
      - object: 'MOV / pairing embedding on a low-embedding-degree curve'
        conclusion_known_false_because: >-
          `recalled` - the Weil or Tate pairing embeds <S> injectively into the
          multiplicative group of F_{p^k}, where index calculus is
          subexponential. The internal pointer is KN-TECH-033's
          applicability-limits sentence naming KN-TECH-032 as the pairing case;
          KN-TECH-032 was NOT opened by this session.
        does_the_strict_argument_fire: >-
          NO. The map is injective and the target is far larger than n. CONTROL
          PASSES, and it passes for a DIFFERENT reason than SSSA does, which is
          what makes it a second control rather than a restatement of the
          first.
        does_the_exponent_coprimality_argument_fire: >-
          NO, and it is not even applicable - the pairing target is
          multiplicative, not an additive target of the p-adic tower, so the
          argument's scope excludes it by construction. Recorded so that no
          later reader mistakes the additive closure for a general one.
      - object: 'a composite-order subgroup, n a product of two nontrivial factors'
        conclusion_known_false_because: >-
          Reduction of the scalar modulo a proper divisor is an explicit
          nonconstant homomorphism onto a smaller cyclic group. Its existence
          is elementary and its algorithmic content is Pohlig-Hellman
          (KN-TECH-030, internal, via the erratum).
        does_the_strict_argument_fire: >-
          NO - the primality hypothesis fails. CONTROL PASSES, and this is the
          object that forced the conditional 'n prime' qualification onto the
          STRICT verdict rather than letting it be stated unconditionally.
        does_the_exponent_coprimality_argument_fire: >-
          NO - it is about additive p-adic targets and says nothing about
          cyclic quotients of order coprime to p.
    outcome: >-
      THREE nearby objects, three declines, distinct reasons in each case. No
      argument in this file proves too much on any of them. Recorded as a
      passing control and not as support for anything else.

  null_object_control_on_this_sessions_conclusions: >-
    ZERO RUNS MEANS ZERO NULL OBJECTS, exactly as the erratum records for its
    own lane (section E item 4). This session measures nothing, so it has
    nothing to control statistically; the null-object requirements it states
    are requirements on SUCCESSORS (section 5.4 and CAND-D2-A's control block),
    and no number in this file has been controlled because no number in this
    file was measured.

  # ------------------------------------------------------------------
  # 8. OBSTRUCTION, AT THE SECTION-4 CLOSURE STANDARD
  # ------------------------------------------------------------------
  obstruction:
    name: 'exponent coprimality between prime-to-p torsion and every additive target of the p-adic tower'
    quantity: >-
      the order of the image of any homomorphism from <S-hat> into a graded
      piece of the formal-group filtration, into the formal group itself, or
      into (Q_p, +)
    value: 'exactly 1 (the trivial image), for every precision r and every schedule r(n)'
    units: 'group order (a divisor count, dimensionless)'
    error_bars: >-
      NONE - THIS IS A DERIVATION OVER STATED HYPOTHESES, NOT A MEASUREMENT. No
      run is cited because none exists. Disclosed rather than dressed as a
      measured obstruction, exactly as the erratum discloses its own.
    read_from_runs: []
    scope: >-
      E/F_p good reduction, minimal Weierstrass model over Z_p with
      v_p(discriminant) = 0, S of order n with gcd(n, p) = 1, the canonical
      order-n prime-to-p lift. EXPLICITLY OUTSIDE SCOPE - any point whose order
      is divisible by p, which includes every generator of an anomalous curve;
      bad or additive reduction; non-minimal models; non-Weierstrass models.
    resource_check:
      examined: true
      reading: >-
        WHICH THEORY WANTS THIS MEASUREMENT. The obstruction is exponent
        coprimality, and a coprimality obstruction is the hypothesis of every
        construction that DELIBERATELY introduces p-torsion. Three readings
        were considered and one survives as a forward direction rather than a
        closed door. (i) It is the exact statement of the SSSA precondition, so
        it converts 'why does not the p-adic route generalise' from folklore
        into a one-line criterion that a curve either satisfies or does not -
        useful as a hygiene check and as the honest answer to the KN-TECH-033
        bar. (ii) It predicts where the p-adic tower DOES carry information -
        on points of order divisible by p, and on the bad-reduction locus,
        which is where the erratum's own retrieved pointer (arXiv:2607.02678,
        Kodaira types from ell-torsion, `retrieved` by an earlier session at
        abstract level, NOT re-fetched here) says the same tracked object is
        informative. Both are outside the cryptographic case by construction.
        (iii) It does NOT read as an asset for any theory this session could
        name in the gcd(n, p) = 1 regime, and that is recorded as a complete
        and honest answer rather than left null.
    forward_guidance_named_classes_still_open:
      - 'E1, probabilistic propagation, for cheap F_p-coordinate statistics - not a p-adic question and not closable group-theoretically (KN-FIND-ffe1df item 2).'
      - 'Non-additive targets outside the p-adic tower - pairings, class groups, multiplicative groups. Reaching them exits the D2 family.'
      - 'The degree gap of Phi_r - the one named open quantity, and CAND-D2-A is its cheapest probe.'
      - 'Composite n, where the strict closure is false; useful as an instrument control, not as an attack surface, since the witnesses are Pohlig-Hellman.'
      - 'The p-adic height subfamily - CAND-D2-B, undetermined pending one literature read.'

  # ------------------------------------------------------------------
  # 9. HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
  # ------------------------------------------------------------------
  honest_accounting:
    objects_considered:
      - 'the precision-r p-adic digit vector of the canonical prime-to-p torsion lift of a SINGLE point (D2 proper)'
      - 'exact homomorphic images of <S> in a smaller group (STRICT)'
      - 'exact homomorphic images of <S> in a same-size or larger group (STRICT-ISO)'
      - 'approximately propagating statistics of that digit vector (LIKE, escape E1)'
      - 'the additive graded pieces of the formal-group filtration as targets'
      - 'the p-adic height functional family on the lift'
    depth_of_verified_structure: >-
      DERIVATION TIER, ZERO RUNS, SINGLE SESSION, NOT INDEPENDENTLY REVIEWED.
      The STRICT closure re-derives, through a different lens, a step already
      committed in this corpus (KN-FIND-ffe1df Theorem C, Validator-confirmed)
      and already stated for exactly this sub-question in an unadmitted
      proposal (IDEA-20260901-b4e6eb claim (C)); it is recorded as exactly
      that. The exponent-coprimality argument for STRICT-ISO is elementary and,
      as far as this session's corpus check reached, not written down in this
      program - but it is textbook-adjacent mathematics and no external
      literature was checked for it, so its honest novelty label is
      `unverified`. The four-escape audit and the E2-unavailability consequence
      are, as far as this session checked, new to this corpus; that is a
      statement about this corpus and not about the literature.
    dominated_by: 'n/a (no result claimed)'
    dominated_by_justification: >-
      No algorithm, solve, relation, speedup, advantage, or bound is claimed,
      so there is nothing to place on the frontier. For completeness the
      frontier was nonetheless re-read from the erratum's own checked table -
      Pollard rho with negation (n^{1/2+o(1)} time, O(1) memory per processor,
      about 0.886 sqrt(n) serial), BSGS (n^{1/2+o(1)} time and memory), the
