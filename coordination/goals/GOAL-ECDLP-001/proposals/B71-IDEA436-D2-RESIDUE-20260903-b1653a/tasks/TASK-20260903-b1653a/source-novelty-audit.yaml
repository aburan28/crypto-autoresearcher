  # ------------------------------------------------------------------
  # D1 OVERLAP AUDIT - the audit the handoff specifically requires
  # ------------------------------------------------------------------
  d1_overlap_audit:
    purpose: >-
      D2 is a DIFFERENT mathematical object from D1 - a statistic of a SINGLE
      point's digits versus a valuation of a TWO-POINT x-difference. The
      handoff requires an explicit check that no D1 argument is silently reused
      on it. Every load-bearing D1 argument in this goal's record is listed
      below with a verdict.
    arguments:
      - d1_argument: 'Proposition E - the D1 functional collapses to the plus-or-minus fibre indicator, computable by one F_p equality test'
        source: 'erratum section C.2'
        reused_on_D2: false
        reason: >-
          It is a statement about the valuation of a DIFFERENCE of two lifted
          x-coordinates. Its proof runs through Lemma 2's plus-or-minus fibre
          structure holding on both sides, which requires two points. There is
          no single-point analogue and none is constructed here. The erratum
          says this itself, verbatim - 'Proposition 4 is specific to a
          difference of two x-coordinates and says nothing about a single
          point's digits.'
      - d1_argument: 'Lemma 2 - x(-P) = x(P) and x(P) = x(P'') implies P'' = plus or minus P'
        source: 'erratum section D.9'
        reused_on_D2: false
        reason: 'a two-point statement; it plays no role in either closure here'
      - d1_argument: 'the strict-GGM simulator, M2, and the closed-at-exponent-1/2 corroboration'
        source: 'erratum sections C.4 and C.5'
        reused_on_D2: false
        reason: >-
          Deliberately not used. No argument in this task invokes a
          generic-group model, a simulability move, the Shoup bound, or either
          fork (OFQ-1 or Fork D). Both closures here are model-free in that
          sense, which also makes them immune to the routed and unopened
          objections against KN-FIND-002 and KN-FIND-b7e091.
      - d1_argument: 'Corollary 4.2 - each D1 query returns at most 1 bit, and the optimal use of the fibre indicator is an x-line collision search'
        source: 'erratum section C.2'
        reused_on_D2: false
        reason: 'a bit-accounting statement about the D1 oracle specifically; no D2 query model is proposed here at all'
      - d1_argument: 'the toy measurement of D1''s two-valued image and its FG-1 cross-implementation discharge'
        source: 'KN-FIND-1ba0fe, EV-ECDLP-feb897, DEC-20260903-256c7c'
        reused_on_D2: 'partially, and only in ways that are not evidence about D2'
        reason: >-
          THREE uses, each declared. (1) The FG-1 group-theoretic lift
          CONSTRUCTION is recommended as the arithmetic CAND-D2-A should reuse
          - a tooling recommendation, not an argument, and it carries no D1
          conclusion with it. (2) The PD-3 hazard (silent wrong answers from
          naive Jacobian formulas over Z/p^r) is carried forward as a control
          requirement - an implementation warning, not evidence. (3) The
          corrected reading of the null-lift family is carried forward so a
          successor does not cite it as a dose-response instrument - a
          correction, not evidence. NO D1 MEASUREMENT IS CITED AS EVIDENCE
          ABOUT D2 anywhere in this task's artifacts.
      - d1_argument: 'KN-TECH-73630e''s information-emptiness boundary'
        source: 'KN-TECH-73630e'
        reused_on_D2: true
        reason: >-
          LEGITIMATE AND EXPLICITLY SO. This is NOT a D1 argument - it is a
          statement about the LIFT, quantifying over every functional of it,
          and ECDLP-IDEA-436 itself accepts it up front for the whole record
          rather than for one disjunct ('the only thing that can be claimed
          here is a computational handle'). The handoff independently instructs
          that it be applied to D2 as a standing boundary. Its reuse is
          therefore directed, not silent.
      - d1_argument: 'the checked Pareto frontier rows'
        source: 'erratum section G'
        reused_on_D2: true
        reason: >-
          LEGITIMATE. These are baselines, not arguments, and they are re-read
          rather than re-derived. Nothing in this task approaches any of them,
          so the reuse cannot change a verdict; it is recorded for completeness
          under the Pareto-honesty obligation.
    conclusion: >-
      NO D1 ARGUMENT IS REUSED ON D2. The two closures reached here rest on
      (i) Theorem C's terminal group-theoretic step and df906f's rigidity
      theorem, neither of which is a D1 result, and (ii) an exponent-coprimality
      argument that uses one structural fact about the formal group. What IS
      carried from the D1 lane is a lift construction, an implementation
      hazard, and a correction to a control's interpretation - three
      engineering items, no mathematics.

