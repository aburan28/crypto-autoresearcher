provenance_policy: >-
  Every entry is labeled recalled, retrieved, kb, or internal. Retrieved means
  the source was fetched and read in this task (here, the arXiv search-UI result
  lists and abstracts via webfetch). kb means the source was resolved through
  the read-only knowledge index or grep to a committed corpus record and read.
  internal means a committed repository record (goal head, dispatch queue,
  frozen elliptic setting packets, prior packets, prior-round trigger searches,
  checkpoint, decision) read in this task. Recalled means no source was opened
  and the entry cannot support a coordinator decision, a known/adaptation
  novelty status, or a mathematical conclusion. No trigger-carrying statement in
  this task rests on a recalled source; every trigger-carrying statement rests
  on a retrieved, kb, or internal object actually read. The "Mori-Wu-type sparse
  resultants and Poisson products" named in the dispatch constraint is a
  recalled pointer: no arXiv record under that name was retrieved (the author-
  directed query returned 0 results), so it is recorded as recalled and does not
  back any trigger or novelty statement.

retrieval_instrument_note: >-
  A separate websearch tool was not exposed to this role session. Bounded
  network retrieval was performed with webfetch. The arXiv export API
  (http://export.arxiv.org/api/query and https://export.arxiv.org/api/query) was
  the specified instrument but returned repeated 429 (rate limit) and 503
  (service unavailable) responses and timeouts across multiple retries; this is
  an operational limitation of the retrieval instrument, not mathematical
  evidence, and is recorded rather than smoothed over. The fallback instrument
  actually used was the arXiv search UI
  (https://arxiv.org/search/?query=...&searchtype=all&start=0), which returns
  result lists with abstracts. Every fetched source was read at abstract level
  at minimum; no full text was fetched because the scoped_no_candidate verdict
  does not depend on construction detail beyond what the abstracts establish
  (none of the retrieved objects constructs r_R from E, P, Q, is typed to the
  P1553 complete-chart structure, or computes a remainder modulo the squarefree
  label polynomial g_I).

