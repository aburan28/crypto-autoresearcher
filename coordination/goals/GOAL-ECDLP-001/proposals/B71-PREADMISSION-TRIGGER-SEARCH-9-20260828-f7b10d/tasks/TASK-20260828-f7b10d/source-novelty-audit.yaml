source_entries:
  # --- Retrieved (fetched and read in this task) ---
  - key: sparse_resultant_theory
    citation: arXiv search UI query "sparse resultant" (47 results; key items read at abstract level).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a structured/sparse resultant construction that could serve as a
      typed public P1553 remainder transducer for r_R mod g_I, exploiting the
      fixed-degree, labelled, complete-chart structure.
    supplied: >-
      General sparse-resultant theory: Canny-Emiris formula and mixed
      subdivisions, Koszul-complex determinants, toric Sylvester forms, sparse
      Nullstellensatz, singular loci of sparse resultants, sparse trace tests,
      sparse resultant packages, sparse difference resultants. The resultant of
      a given sparse polynomial system is computed as a determinant of a matrix
      whose size is governed by the mixed volume (or a related Newton-polytope
      quantity) of the system. None constructs r_R from E, P, Q; none is typed
      to the P1553 complete-chart structure; none computes a remainder modulo
      the squarefree label polynomial g_I; none operates within the B^(5/4)
      budget.
    supports: []
    limitations: >-
      General sparse-resultant theory; the resultant is computed from the given
      polynomials (as a determinant), not a remainder modulo g_I, and not from
      E, P, Q. Computing the resultant (even sparsely) is the already-costed
      full resultant route that G8 excludes. No P1553 typing, no public g_I and
      r_R construction, no B^(5/4)/o(ell^(1/2)) enumeration.
  - key: poisson_product_formula
    citation: arXiv search UI query "Poisson product" resultant (2 results, both read).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a Poisson-product / subresultant-in-roots formula that could
      serve as a typed public P1553 remainder transducer for r_R mod g_I.
    supplied: >-
      The classical Poisson product formula for the (projective) resultant and
      its multivariate subresultant-in-roots generalization (arXiv:math/0501281,
      D'Andrea-Krick-Szanto). The formula expresses the resultant of f and g as
      a product over the roots of one polynomial of the other polynomial
      evaluated at those roots (up to a leading-coefficient factor). The second
      hit (arXiv:1107.0520, Meyerovitch) is unrelated (Poisson processes,
      math.DS/math.PR).
    supports: []
    limitations: >-
      The Poisson product formula requires the roots of one polynomial and the
      values of the other at those roots; instantiating it to the P1553 setting
      (f = g_I, g = r_R) requires the roots of g_I (the labels) and r_R (or a
      way to compute it), both excluded inputs. It yields the resultant (zero
      iff z_R != 1), not the remainder r_R mod g_I. It is a resultant route
      (G8). No P1553 typing, no public g_I and r_R construction, no
      B^(5/4)/o(ell^(1/2)) enumeration.
  - key: triangular_decomposition
    citation: arXiv search UI query "triangular set" resultant elimination (3 results, all read).
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a triangular-set / characteristic-set construction that could
      serve as a typed public P1553 remainder transducer for r_R mod g_I.
    supplied: >-
      Wu/Ritt triangular decomposition and characteristic sets, and chordal-
      graph structure in top-down triangular decomposition (arXiv:1811.11023
      Mou-Bai-Lai; arXiv:1802.01752 Mou-Bai; arXiv:1108.1486 Jin-Li-Wang). These
      triangularize polynomial systems (via pseudo-division / subresultants /
      PRS) to produce triangular sets or characteristic sets.
    supports: []
    limitations: >-
      Triangular decomposition does not compute a remainder of an already-formed
      resultant modulo a specific squarefree label polynomial, and it is
      subresultant/PRS-based, which is an already-costed resultant/quotient
      route (G8). No P1553 typing, no public g_I and r_R construction, no
      B^(5/4)/o(ell^(1/2)) enumeration.
  - key: interpolation_remainder_modular
    citation: arXiv search UI query resultant remainder interpolation polynomial modular.
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find an interpolation-based resultant and remainder extraction that
      could serve as a typed public P1553 remainder transducer.
    supplied: >-
      Zero results. No interpolation-based resultant/remainder object retrieved.
    supports: []
    limitations: >-
      Zero results is an absence in the searched scope, not evidence that no
      such object exists.
  - key: common_factor_black_box
    citation: arXiv search UI query "common factor" resultant gcd polynomial black-box.
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a black-box computation of intersection divisors or common factors
      that could serve as a typed public P1553 remainder transducer.
    supplied: >-
      Zero results. No black-box common-factor / intersection-divisor object
      retrieved.
    supports: []
    limitations: >-
      Zero results is an absence in the searched scope, not evidence that no
      such object exists.
  - key: mori_wu_author_directed
