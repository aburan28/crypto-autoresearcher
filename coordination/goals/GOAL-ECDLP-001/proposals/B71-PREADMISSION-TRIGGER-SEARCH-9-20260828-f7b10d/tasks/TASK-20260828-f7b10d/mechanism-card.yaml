decision_summary: >-
  The ninth trigger search was performed over a scope explicitly disjoint from
  the seventh and eighth rounds. Component (a) (structured-resultant and
  intersection literature) performed bounded network retrieval over structured,
  sparse, triangular, and black-box resultant computation and explicit
  intersection-theoretic computation; the arXiv export API was rate-limited (429)
  and intermittently unavailable (503), so the arXiv search UI was the fallback
  instrument actually used. The retrieved literature (general sparse resultant
  theory, the Poisson product formula, Wu/Ritt triangular decomposition)
  computes resultants from given polynomials (as determinants, root products, or
  via triangular decomposition); it does not construct r_R from E, P, Q, is not
  typed to the P1553 complete-chart structure, does not compute a remainder
  modulo the squarefree label polynomial g_I, and does not operate within the
  B^(5/4) budget. Component (b) (internal-corpus resource-check pass) re-read the
  open public r_R constructor obligation as an asset and searched knowledge/,
  inputs/, and the reachable ledger records for a theorem, bound, or
  correspondence that reads the complete-chart intersection structure as a
  resource; the answer is examined true, none found. Every candidate considered
  is judged item-by-item against the frozen gate (G1-G8); none passes every
  item. The honest disposition is scoped_no_candidate, with every broader route
  preserved and no B71, experiment, evidence, attack, SOTA, or breakthrough
  claimed.
