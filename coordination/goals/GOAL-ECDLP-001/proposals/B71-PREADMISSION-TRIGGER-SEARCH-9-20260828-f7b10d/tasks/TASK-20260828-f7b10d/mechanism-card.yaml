trigger_shapes:
  shape_a_remainder_transducer: >-
    A typed public P1553 target-local remainder transducer for r_R mod g_I: an
    exact computation, from E, P, and Q alone, of the remainder of the
    complete-chart intersection resultant r_R upon division by the squarefree
    label polynomial g_I, with no roots, factors, witnesses, support tables, or
    source enumeration, inside the B^(5/4) interface budget.
  shape_b_dyadic_unit_product: >-
    The exact dyadic subinterval unit-product interface: a public construction
    over the frozen mixed-radix deck/interval geometry (per-sign-vector
    intervals [A_sigma, A_sigma + m^3 - 1] with exact base-m labelled
    unranking) that supplies the unit-product step the two-restriction and
    three-deck corrections leave as the surviving coordinate-aware interface.

scope_components:
  component_a_structured_resultant_intersection_literature:
    what_was_searched: >-
      Bounded network retrieval (webfetch) over structured, sparse, triangular,
      and black-box resultant computation and explicit intersection-theoretic
      computation, aimed at a public r_R mod g_I constructor that exploits the
      fixed-degree, labelled, complete-chart structure without importing the
      Theta(B^3) represented payload. The arXiv export API was the specified
      instrument but was rate-limited (429) and intermittently unavailable (503)
      across multiple retries; the arXiv search UI
      (https://arxiv.org/search/) was the fallback instrument actually used.
    searches_performed:
      - query: '"sparse resultant"'
        instrument: webfetch arXiv search UI
        results: 47 (key items read at abstract level)
      - query: '"Poisson product" resultant'
        instrument: webfetch arXiv search UI
        results: 2 (both read; one is the classical Poisson product formula, the other unrelated)
      - query: '"triangular" resultant polynomial'
        instrument: webfetch arXiv search UI
        results: 288 (mostly matrix/numerical "triangular" noise; no algebraic triangular-set resultant trigger)
      - query: '"triangular set" resultant elimination'
        instrument: webfetch arXiv search UI
        results: 3 (all read; Wu/Ritt triangular decomposition and characteristic sets)
      - query: 'resultant remainder interpolation polynomial modular'
        instrument: webfetch arXiv search UI
        results: 0
      - query: '"common factor" resultant gcd polynomial black-box'
        instrument: webfetch arXiv search UI
        results: 0
      - query: 'Mori Wu sparse resultant Poisson'
        instrument: webfetch arXiv search UI
        results: 0 (the "Mori-Wu-type" reference is a recalled pointer, not a retrievable arXiv record)
    objects_read:
      - id: SPARSE_RESULTANT_THEORY
        name: >-
          General sparse resultant theory: Canny-Emiris formula and mixed
          subdivisions, Koszul-complex determinants, toric Sylvester forms,
          sparse Nullstellensatz, singular loci of sparse resultants, sparse
          trace tests, sparse resultant packages, sparse difference resultants.
        source_refs:
          - arXiv:2602.13039 (Checa-Emiris-Konaxis, A sparse overview on sparse resultants)
          - arXiv:2407.13450 (D'Andrea-Jeronimo, Sparse Nullstellensatz, resultants and determinants of complexes)
          - arXiv:2209.11281 (Buse-Checa, Toric Sylvester forms)
          - arXiv:2202.12034 (Checa-Emiris, Mixed subdivisions suitable for the Canny-Emiris formula)
          - arXiv:2004.14622 (D'Andrea-Jeronimo-Sombra, The Canny-Emiris conjecture)
          - arXiv:1912.10268 (Bhayani-Kukelova-Heikkila)
          - arXiv:2007.10100 (Bhayani-Kukelova-Heikkila)
          - arXiv:2301.06443 (Bhayani-Heikkila-Kukelova, Sparse resultant based minimal solvers in computer vision)
          - arXiv:2010.00286 (Stagliano, A package for computations with sparse resultants)
          - arXiv:2110.13872 (Statnik, Singular loci of sparse resultants)
          - arXiv:2201.04268 (Brysiewicz-Burr, Sparse trace tests)
          - arXiv:2301.07001 (Esterov-Statnik-Voorhaar, Sparse curve singularities)
          - arXiv:1810.00057 (Yuan-Zhang, sparse difference resultant)
        assessment: >-
          All general sparse-resultant theory: the resultant of a given sparse
          polynomial system is computed as a determinant of a matrix whose size
          is governed by the mixed volume (or a related Newton-polytope
          quantity) of the system. None constructs r_R from E, P, Q; none is
          typed to the P1553 complete-chart structure; none computes a remainder
          modulo the squarefree label polynomial g_I; none operates within the
          B^(5/4) budget. Computing the resultant (even sparsely) from the
          polynomials is the already-costed full resultant route that G8
          excludes. G1 present (named theorems), G2-G8 absent.
      - id: POISSON_PRODUCT_FORMULA
        name: >-
          The classical Poisson product formula for the (projective) resultant,
          and its multivariate subresultant-in-roots generalization.
        source_refs:
          - arXiv:math/0501281 (D'Andrea-Krick-Szanto, Multivariate Subresultants in Roots)
          - arXiv:1107.0520 (Meyerovitch, Ergodicity of Poisson products and applications; unrelated, math.DS/math.PR)
        assessment: >-
          The Poisson product formula expresses the resultant of f and g as a
          product over the roots of one polynomial of the other polynomial
          evaluated at those roots (up to a leading-coefficient factor).
          Instantiating it to the P1553 setting (f = g_I, g = r_R) requires the
          roots of g_I (the labels) and the values of r_R at those roots, i.e.
          it requires r_R (or a way to compute it) and the roots, both of which
          are excluded inputs. It yields the resultant (zero iff g_I and r_R
          share a root, i.e. z_R != 1), not the remainder r_R mod g_I. G1
          present (a named formula), G2 absent (requires excluded roots and
          r_R), G8 absent (a resultant route).
      - id: TRIANGULAR_DECOMPOSITION
        name: >-
          Wu/Ritt triangular decomposition and characteristic sets, and
          chordal-graph structure in top-down triangular decomposition.
        source_refs:
          - arXiv:1811.11023 (Mou-Bai-Lai, Chordal Graphs in Triangular Decomposition in Top-Down Style)
          - arXiv:1802.01752 (Mou-Bai, On the chordality of polynomial sets in triangular decomposition in top-down style)
          - arXiv:1108.1486 (Jin-Li-Wang, A New Algorithmic Scheme for Computing Characteristic Sets)
        assessment: >-
          These triangularize polynomial systems (via pseudo-division /
          subresultants / PRS) to produce triangular sets or characteristic
          sets. They do not compute a remainder of an already-formed resultant
          modulo a specific squarefree label polynomial, and they are
          subresultant/PRS-based, which is an already-costed resultant/quotient
          route. G1 present (named algorithms/theorems), G2 absent (not a
          remainder-of-resultant transducer), G8 absent (subresultant/PRS
          route).
    what_it_supplied: >-
      No relevant trigger. The structured/sparse/triangular/black-box resultant
      and intersection literature computes resultants from given polynomials (as
      determinants, root products, or via triangular decomposition); it does not
      construct r_R from E, P, Q, is not typed to the P1553 complete-chart
      structure, does not compute a remainder modulo the squarefree label
      polynomial g_I, and does not operate within the B^(5/4) budget. Every
      candidate is the already-costed full resultant / quotient / subresultant
      route that G8 excludes. No candidate supplied a typed trigger.
  component_b_internal_corpus_resource_check:
    what_was_searched: >-
      Per the inventor protocol's resource-check obligation, the open public r_R
      constructor obligation was re-read as an asset. knowledge/, inputs/, and
