controls_before_belief:
  screen_is_its_own_control: >-
    For every candidate that superficially carried G1 (an actual recurrence,
    formula, or theorem), the screen re-checked (i) that the computation is
    genuinely public (no ECDLP-equivalent information hidden behind
    transducer/recurrence/identity language), (ii) the quantifier order (all
    objects fixed before any witness observed), and (iii) the already-costed-
    route exclusion as a named check.
  public_computation_check: >-
    Every candidate's G1 object is a general polynomial result whose inputs (the
    polynomial system, the roots, the triangular set) are not the frozen public
    E, P, Q. Instantiating any of them to the P1553 setting requires the public
    g_I and r_R constructor, which is exactly the missing object; no candidate
    hides the witness or the resultant behind the recurrence/identity language,
    because none of them reaches r_R mod g_I from E, P, Q at all. The Poisson
    product formula (C2) is the closest: it reaches the resultant from the
    roots, but the roots and r_R are excluded inputs, so it does not reach r_R
    mod g_I from E, P, Q.
  quantifier_order_check: >-
    In every candidate the general object (polynomial system, root set,
    triangular set) is fixed independently of the ECDLP witness; but none fixes
    the P1553 rings, bases, CRT components, interval geometry, or public g_I and
    r_R construction before any witness is observed, because it never types
    them. The constructor-before-witness quantifier is therefore not discharged
    for the frozen setting.
  already_costed_route_exclusion: >-
    Named check run per candidate: C1 is a resultant route (sparse
    generalization of the full resultant); C2 is a resultant route (Poisson
    product / subresultant-in-roots); C3 is a subresultant/PRS route. Each is
    excluded by G8. No candidate survives the exclusion.

