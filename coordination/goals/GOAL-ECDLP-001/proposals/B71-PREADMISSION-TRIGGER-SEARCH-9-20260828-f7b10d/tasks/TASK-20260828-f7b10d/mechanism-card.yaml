    objects_opened:
      - key: KN-OPEN-004
        provenance: kb
        carried: >-
          BKK / mixed-volume versus dense resultant for sparse elimination. A
          scoped negative: the mixed-volume bound does not beat the dense
          resultant for the relevant systems. A pointer to a bound, not a typed
          construction.
      - key: KN-OPEN-007
        provenance: kb
