trigger_shapes:
  shape_a_remainder_transducer: >-
    A typed public P1553 target-local remainder transducer for r_R mod g_I: an
    exact computation, from E, P, and Q alone, of the remainder of the
    complete-chart intersection resultant r_R upon division by the squarefree
    label polynomial g_I, with no roots, factors, witnesses, support tables, or
    source enumeration, inside the B^(5/4) interface budget.
  shape_b_dyadic_unit_product: >-
    The exact dyadic subinterval unit-product interface: a public construction
    over the frozen mixed-radix deck/interval geometry (per-sign-vector
    intervals [A_sigma, A_sigma + m^3 - 1] with exact base-m labelled
    unranking) that supplies the unit-product step the two-restriction and
    three-deck corrections leave as the surviving coordinate-aware interface.

scope_components:
  component_1_full_text_near_miss:
    what_was_searched: >-
      The seventh-round mechanism card's per-item gate notes, to identify the
      specific retrieved near-miss objects whose frozen-gate verdicts were
      settled at abstract level only (i.e. where the abstract could not settle
      whether the object supplies a uniform public construction with explicit
      constants, or where the abstract-level verdict might change on full text).
    near_miss_objects_identified:
      - id: C2_MODULAR_COMPOSITION_CIRCUIT
        name: >-
          Modular composition and polynomial GCD in the border of small, shallow
          circuits (Andrews-Kumar-Rai, arXiv:2511.05035).
        why_abstract_level_only: >-
          The seventh-round G3 note asserts "This is a border-complexity
          (non-uniform, limit) statement, not a uniform typed public
          construction with explicit constants." That is a claim about
          uniformity and explicit constants that the abstract alone does not
          fully settle: the abstract says the circuit family "can itself be
          constructed in near-linear time," which is a uniformity-adjacent
          statement whose status (uniform vs border-only) is a full-text
          question. This is the one seventh-round candidate whose frozen-gate
          item (G3) was settled at abstract level only.
        full_text_fetch: >-
          Fetched and read. https://arxiv.org/html/2511.05035 returned 404;
          http://export.arxiv.org/api/query?id_list=2511.05035 returned the
          metadata and abstract (read); https://arxiv.org/pdf/2511.05035v2
          returned 404; https://arxiv.org/html/2511.05035v2 returned 404;
          https://arxiv.org/abs/2511.05035 was read in full. The abs page
          reveals that the paper has been WITHDRAWN by the author (v2,
          2026-01-27), with "No license for this version due to withdrawn," so
          the full text is genuinely unavailable. The arXiv comment field
          (metadata, read) states "An anonymous referee pointed out a gap in the
          proofs of Theorems 6.2 and 6.4."
        re_adjudication: >-
          G1 is present (a named circuit-complexity theorem) but materially
          WEAKENED: the object is withdrawn and carries a referee-noted proof
          gap, so it is not a stable, established retrieved theorem. G2 remains
          absent (over infinite fields, arbitrary
          polynomials, no P1553 typing, no public g_I and r_R construction, no
          exact E,P,Q-only computation). G3 remains absent (border-complexity
          non-uniform result over infinite fields, not a uniform typed public
          construction with the required state/update-map/degree/rank/nonzero/
          coefficient-growth/live-storage/traffic/build-query/amortization
          enumeration within the B^(5/4) budget and strict o(ell^(1/2))
          end-to-end). G4-G7 remain absent. G8 remains absent (modular
          composition is an already-costed quotient / full power-projection
          route). The full-text / abs-page reading STRENGTHENS the rejection:
          the object is not only a general theorem that cannot type the frozen
          setting, it is a withdrawn theorem with a known proof gap.
        verdict: not_intake_ready
        absent_items: [G2, G3, G4, G5, G6, G7, G8]
        g1_note: >-
          G1 is present (a named circuit-complexity theorem) but materially
          weakened (withdrawn theorem with a referee-noted proof gap). Even
          taking the abstract's claims at face value, the object fails G2, G3,
          and G8, so it is not intake-ready regardless.
      - id: C1_SUBRESULTANT_PRS_RECURRENCE
        name: >-
          Subresultant / recursive polynomial remainder sequence recurrences
          (Terui, Habicht, Hong-Meng-Yang, Wang-Yang, Glotov, Perrucci-Roy).
        assessment_and_decline: >-
          Assessed and declined. The seventh-round G2 note is conclusive at
          abstract level: "The recurrence is for an arbitrary pair (or set) of
          univariate polynomials over a coefficient domain." This is a general
          theorem that cannot type the frozen setting without the missing public
          g_I/r_R constructor; the full text of a general subresultant
          recurrence paper would not supply that constructor. No full-text
          fetch was performed (needless). Gate status carried from the seventh
          round: G1 present, G2-G8 absent.
      - id: C3_FAST_REMAINDER_KEDLAYA_UMANS
        name: >-
          Near-linear-time modular composition / fast polynomial remainder over
          finite fields (Poteaux-Schost, Guo-Narayanan-Umans, Hubrechts).
        assessment_and_decline: >-
          Assessed and declined. The seventh-round G2 note is conclusive at
          abstract level: "General fast-remainder theorems for arbitrary
          polynomial pairs." A general fast-remainder theorem cannot type the
          frozen setting without the missing public constructor; the full text
          would not supply it. No full-text fetch was performed (needless).
          Gate status carried from the seventh round: G1 present, G2-G8 absent.
      - id: C4_SEMAEV_WEL_DESCENT
        name: >-
          Semaev summation polynomials and Weil-descent / Groebner-basis ECDLP
          index calculus (Kousidis-Wiemers, Kosters-Yeo, Karabina, Semaev,
          Gorla-Massierer, Huang-Kosters-Yang-Yeo).
        assessment_and_decline: >-
          Assessed and declined. The seventh-round G2 note is conclusive at
          abstract level: "These concern the summation-polynomial /
          Weil-descent systems for the ECDLP in general, not the frozen P1553
          r_R mod g_I remainder or the dyadic subinterval unit-product
          interface." A general index-calculus theorem cannot type the frozen
          setting without the missing public constructor; the full text would
          not supply it. No full-text fetch was performed (needless). Gate
          status carried from the seventh round: G1 present, G2-G8 absent.
      - id: C5_COMBINATORIAL_UNRANKING
        name: >-
          General combinatorial ranking/unranking and universal-cycle decoding
          (de Bruijn, BDD, RNA, HF-sets).
        assessment_and_decline: >-
          Assessed and declined. The seventh-round G2 note is conclusive at
          abstract level: "They rank/unrank general combinatorial families (de
          Bruijn sequences, BDDs, RNA structures), not the frozen P1553 dyadic
          subinterval unit-product interface." A general combinatorial
          unranking theorem cannot type the frozen setting without the missing
          public constructor; the full text would not supply it. No full-text
          fetch was performed (needless). Gate status carried from the seventh
          round: G1 present, G2-G8 absent.
      - id: C6_TRANSPOSED_MULTIPPOINT_EVALUATION
        name: >-
          Transposed / fast multipoint polynomial evaluation and interpolation
          (Pan, Centrone-de Mello).
        assessment_and_decline: >-
          Assessed and declined. The seventh-round G2 note is conclusive at
          abstract level: "General (and partly numerical/approximate) multipoint
          evaluation, not the frozen P1553 remainder or dyadic unit-product
          interface." A general fast-evaluation theorem cannot type the frozen
          setting without the missing public constructor; the full text would
          not supply it. No full-text fetch was performed (needless). Gate
          status carried from the seventh round: G1 present, G2-G8 absent.
    what_it_supplied: >-
      One full-text / abs-page reading (C2, Andrews-Kumar-Rai arXiv:2511.05035),
      which revealed the paper is WITHDRAWN (v2, 2026-01-27) with a
      referee-noted proof gap in Theorems 6.2 and 6.4, strengthening the
      rejection of that candidate. Five assessment-and-decline records (C1, C3,
