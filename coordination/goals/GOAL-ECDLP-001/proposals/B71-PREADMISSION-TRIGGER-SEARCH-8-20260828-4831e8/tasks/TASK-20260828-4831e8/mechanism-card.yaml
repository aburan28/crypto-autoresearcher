research_question: >-
  Does any actual recurrence, circuit identity, or retrieved theorem, in exactly
  three seventh-round-disjoint places, instantiate to the frozen elliptic setting
  as (a) a typed public P1553 target-local remainder transducer for r_R mod g_I,
  or (b) the exact dyadic subinterval unit-product interface, passing every item
  of the frozen pre-admission gate? The three places are: (1) the full public
  text of specific seventh-round near-misses whose frozen-gate verdicts were
  settled only at abstract level; (2) the internal corpus (knowledge/, inputs/,
  and the ledger records reachable from the declared reads) as a correspondence
  source converting the public r_R constructor or the dyadic subinterval
  unit-product step into a tractable typed public computation from E, P, and Q;
  and (3) function-field, algebraic-geometry, or transfer-theoretic circuit
  identities and recurrences outside the seventh round's six searched areas.

