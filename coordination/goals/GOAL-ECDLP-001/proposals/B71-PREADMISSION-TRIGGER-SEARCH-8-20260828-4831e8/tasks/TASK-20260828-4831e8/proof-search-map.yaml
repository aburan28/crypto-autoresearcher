target_statement:
  informal: >-
    An actual recurrence, circuit identity, or retrieved theorem instantiates
    to the frozen elliptic setting as a typed public P1553 target-local
    remainder transducer for r_R mod g_I or the exact dyadic subinterval
    unit-product interface, and passes every item of the frozen pre-admission
    gate (G1-G8).
  quantifiers: >-
    There exists one named public object T (a recurrence, circuit identity, or
    theorem) and one fully specified public construction rule C such that, for
    the frozen P1553 setting (rings, bases, CRT components, interval geometry,
    public g_I and r_R construction fixed before any witness is observed), C
    computes r_R mod g_I (or the dyadic unit-product step) from E, P, Q alone,
    without roots, factors, witnesses, support tables, or source enumeration;
    the full state/update-map/degree/rank/nonzero/coefficient-growth/live-
    storage/traffic/build-query/amortization enumeration lies within the
    inherited B^(5/4) interface budget and strict end-to-end o(ell^(1/2)) time,
    memory, and data; lineage and multiplicity are preserved on coalesced and
    nonreduced fibres; Q is distinguished from -Q; known P and Q coefficients
    are yielded with invertible Q coefficient; output-sensitive source
    unranking is supported; and T is shown not to be an already-costed norm,
    resultant, quotient, full power-projection, represented-table, or witness-
    conditioned route.
  present_support: none

lemma_decomposition:
  - id: L1_NAMED_TRIGGER_OBJECT
    responsibility: >-
      Name the actual recurrence, circuit identity, or retrieved theorem T,
      with its exact statement and source, and verify it is not merely the
      assertion that a specialized circuit may exist.
    status: open
    falsifier: >-
      T is only an existence assertion, a heuristic, a withdrawn or
      gap-flagged result, or a result whose hypotheses are not met by the
      frozen setting.
  - id: L2_FROZEN_SETTING_TYPING
    responsibility: >-
      Type T into the frozen P1553 setting: rings, bases, CRT components,
      interval geometry, public g_I and r_R construction, and an exact
      computation from E, P, Q without roots, factors, witnesses, support
      tables, or source enumeration.
    status: open
    falsifier: >-
      Any of the frozen objects is left implicit, or the computation requires
      an excluded input (a root, factor, witness, support table, or source
      enumeration).
  - id: L3_FULL_COST_ENUMERATION
    responsibility: >-
      Enumerate state, update maps, degrees, ranks, nonzeros, coefficient
      growth, live storage, traffic, build/query split, and amortization, and
      bound every axis within the B^(5/4) interface budget and strict
      end-to-end o(ell^(1/2)) time, memory, and data.
    status: open
    falsifier: >-
      Any charged axis is unbounded, at or above ell^(1/2), or hidden in soft-O
      notation.
  - id: L4_LINEAGE_MULTIPLICITY_FIBRES
    responsibility: >-
      Preserve lineage and multiplicity on coalesced and nonreduced fibres.
    status: open
    falsifier: >-
      A coalesced or nonreduced fibre loses its occurrence label or
      multiplicity under T.
  - id: L5_Q_VS_MINUS_Q
    responsibility: >-
      Distinguish Q from -Q in the transducer output.
    status: open
    falsifier: >-
      The output is invariant under Q mapped to -Q with no separately proved
      orientation channel.
  - id: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    responsibility: >-
      Yield known P and Q coefficients with invertible Q coefficient.
    status: open
    falsifier: >-
      The Q coefficient is not known a priori or is not invertible on the
      declared strata.
  - id: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    responsibility: >-
      Support output-sensitive source unranking.
    status: open
    falsifier: >-
      Unranking requires enumerating the full source or a support table.
  - id: L8_NOT_ALREADY_COSTED_ROUTE
    responsibility: >-
      Show T is not an already-costed norm, resultant, quotient, full power-
      projection, represented-table, or witness-conditioned route.
    status: open
    falsifier: >-
      T reduces to one of the excluded already-costed routes.

dependency_order:
  - [L1_NAMED_TRIGGER_OBJECT, L2_FROZEN_SETTING_TYPING]
  - [L2_FROZEN_SETTING_TYPING, L3_FULL_COST_ENUMERATION]
  - [L2_FROZEN_SETTING_TYPING, L4_LINEAGE_MULTIPLICITY_FIBRES]
  - [L2_FROZEN_SETTING_TYPING, L5_Q_VS_MINUS_Q]
  - [L2_FROZEN_SETTING_TYPING, L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q]
  - [L2_FROZEN_SETTING_TYPING, L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING]
  - [L1_NAMED_TRIGGER_OBJECT, L8_NOT_ALREADY_COSTED_ROUTE]
  - [L3_FULL_COST_ENUMERATION, L8_NOT_ALREADY_COSTED_ROUTE]

cheap_audits:
  exact_baseline_reproduction:
    applies: true
    baseline: >-
      The frozen gate items G1-G8 read from the live next_action, and the frozen
      elliptic setting (B = N^(1/5), m = 2^ceil(log2 B), C = sum_{i=0}^{4} m^i,
      decks F_0..F_4, target R = Q + [C]P, per-sign-vector intervals
      [A_sigma, A_sigma + m^3 - 1] with exact base-m labelled unranking,
      ell = B^(9/4+o(1)), k = B^(5/4+o(1))) read from the two P1553 mixed-radix
      correction packets.
    attack_plan:
      - restate each gate item G1-G8 verbatim from the live next_action
      - restate the frozen setting quantities from the two packet.yaml files
      - for each candidate, mark each gate item present (with an optional weakening note) or absent, with a named reason
      - confirm no candidate is admitted by assertion of a possibly existing specialized circuit
    expected_break: >-
      A candidate that carries G1 (an actual recurrence or circuit identity)
      but cannot be typed into the frozen setting (G2) or costed within the
      B^(5/4) budget (G3), or that is an already-costed route (G8), or whose
      G1 object is withdrawn or gap-flagged.
    pass_condition: >-
      Every gate item is explicitly present for a candidate, with the exact
      construction and full cost enumeration; otherwise the candidate is
      recorded not intake-ready with its absent items named.
    current_result: >-
      Performed statically. C2 (Andrews-Kumar-Rai) carries G1 present but
      materially weakened (withdrawn theorem with a referee-noted proof gap,
      revealed by this round's full-text / abs-page reading) and fails G2, G3,
      and G8 (and G4-G7). C1, C3, C4, C5, C6 carry G1 present (abstract level,
      conclusive) but fail G2, G3, and G8 (and G4-G7). No candidate is
      intake-ready. No experiment was run.
  observation_collision_search:
    applies: true
    collision_object: >-
      A retrieved or internal object that is the same observable as a trigger
      already screened in one of the six terminal pre-admission packets, in the
      seventh-round candidate set, or in the B70 mixed-radix records, i.e. a
      duplicate that would re-run a frozen screen.
    attack_plan:
      - compare each candidate against the six screened families and their scoped negative boundaries
      - compare each candidate against the seventh-round candidate set (C1-C6) and record which, if any, is a re-derivation
      - compare each candidate against the B70 derived findings B70-DER-1..7 and the B66/B67 boundaries
      - record which candidate, if any, falls inside a screened family
      - check whether any candidate is a new trigger specific to a screened family satisfying the post-screen revisit condition
    expected_break: >-
      A candidate that is actually a re-run of a screened family (SUBRES-
      COFACTOR, DIVPOLY, SEMAEV-JET) or a re-derivation of a seventh-round
      candidate rather than a new trigger.
    pass_condition: >-
      No candidate re-runs a frozen screen or re-derives a seventh-round
      candidate; any candidate inside a screened family is shown to be a new
      trigger satisfying the revisit condition, or is recorded as a non-revisit
      literature check.
    current_result: >-
      Performed statically. This round does not re-derive the seventh-round
      candidate set; it deepens C2 (full-text / abs-page reading) and records
      assessment-and-decline for C1, C3, C4, C5, C6. C1 (subresultant/PRS)
      falls inside the SUBRES-COFACTOR family; C4 (Semaev/Weil descent) falls
      inside the DIVPOLY and SEMAEV-JET families. Neither is a new trigger
      satisfying the revisit condition (a concrete typed public P1553 remainder
      or dyadic unit-product transducer), so neither re-runs a screen; both are
      recorded as retrieved literature checked against the gate. The internal-
      corpus objects (H-CREP-001, IDEA-20260723-001, DEC-20260722-002,
      EV-ECDLP-002, EXP-CREP-001) are the P1553 object and its open obligation,
      not a duplicate of any screened family. The Component-3 retrieved objects
      (function-field lattices, class-number asymptotics, genus fields, L-
      function moments, GPU NTT, signal processing, 3DM hardness, probability /
      modal-logic transfer theorems) are new general objects not in any
      screened family and not in the seventh-round candidate set.
  quantifier_order_statement:
    applies: true
    required_order:
      - freeze the P1553 rings, bases, CRT components, and interval geometry
      - fix the public g_I and r_R construction
      - name the trigger object T (recurrence, circuit identity, or theorem)
      - receive public E, P, Q
      - compute r_R mod g_I (or the dyadic unit-product step) from E, P, Q alone
      - enumerate the full cost and verify the B^(5/4)/o(ell^(1/2)) bounds
      - verify lineage/multiplicity, Q vs -Q, invertible Q coefficient, and source unranking
    forbidden_order: >-
      Observe a root, factor, witness, support table, or source enumeration
      first and then choose T, the rings, the bases, or the g_I/r_R
      construction; or select T after seeing where a target-dependent
      remainder is large.
    expected_break: >-
      A candidate whose typing into the frozen setting requires an excluded
      input, moving witness-equivalent work into the constructor.
    pass_condition: >-
      All frozen objects are fixed before any witness is observed, and T is
      chosen from public data alone.
    current_result: >-
      Statement only, checked per candidate. Every candidate's general object
      is fixed independently of the witness, but none types the frozen P1553
      objects (rings, bases, CRT, interval geometry, public g_I and r_R) before
      a witness is observed, because none of them reaches r_R mod g_I from E,
      P, Q. The constructor-before-witness quantifier is not discharged for the
      frozen setting by any candidate.
  method_ceiling_nearby_object_control:
    applies: true
    nearby_object: >-
      A degree- or genus-matched non-elliptic analogue: an arbitrary pair of
      univariate polynomials (degree-matched to g_I and r_R) with a planted
      common factor, for which the conclusion that a P1553 target-local
      remainder transducer recovers an elliptic scalar witness is known false.
    attack_plan:
      - apply the identical candidate recurrence/identity/theorem to the planted non-elliptic polynomial pair
      - prohibit use of curve-law facts absent from the claimed lemmas
      - identify the first lemma that distinguishes the genuine P1553 object from the planted pair
      - reject the argument if it still returns a P1553 witness certificate on the planted pair
    expected_break: >-
      A subresultant, modular-composition, fast-remainder, function-field, or
      transfer-theoretic argument based only on general polynomial /
      combinatorial / function-field structure proves too much and accepts the
      planted non-elliptic pair, showing it carries no P1553-specific witness
      information.
    pass_condition: >-
      A named P1553-structure lemma rejects the nearby object before witness
      recovery, while all genuine positive controls remain accepted.
    current_result: >-
      Not run (no experiment authorized). Statically, every candidate is a
      general polynomial/combinatorial/function-field result with no P1553-
      structure lemma, so each would accept the planted non-elliptic pair; this
      is recorded as the expected break and is consistent with the
      scoped_no_candidate disposition. No control was executed.

