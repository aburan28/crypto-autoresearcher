provenance_policy: >-
  Every entry is labeled recalled, retrieved, kb, or internal. Retrieved means
  the source was fetched and read in this task (here, the full public text or
  abs page and metadata via webfetch against the arXiv HTML/PDF/abs views and
  the arXiv export API). kb means the source was resolved through the read-only
  knowledge index to a committed corpus record and read. internal means a
  committed repository record (goal head, dispatch queue, frozen elliptic
  setting packets, prior packets, checkpoint, decision) read in this task.
  Recalled means no source was opened and the entry cannot support a
  coordinator decision, a known/adaptation novelty status, or a mathematical
  conclusion. No trigger-carrying statement in this task rests on a recalled
  source; every trigger-carrying statement rests on a retrieved, kb, or
  internal object actually read.

retrieval_instrument_note: >-
  A separate websearch tool was not exposed to this role session. Bounded
  network retrieval was performed with webfetch against the arXiv export API
  (http://export.arxiv.org/api/query) and the arXiv HTML/PDF/abs views
  (https://arxiv.org/html/<id>, https://arxiv.org/pdf/<id>,
  https://arxiv.org/abs/<id>). The arXiv API returns metadata and abstracts;
  the HTML and PDF views return full text where available. For the one
  full-text near-miss (C2, arXiv:2511.05035) the HTML and PDF views returned
  404 and the abs page revealed the paper is withdrawn, so the full text is
  genuinely unavailable; the metadata and abstract (API) and the abs page were
  read. This is an operational limitation of the retrieval instrument, not
  mathematical evidence; it is recorded rather than smoothed over.

