novelty_falsifiers:
  - A retrieved primary source already states the same frozen-setting P1553 remainder transducer or dyadic unit-product interface with the full gate discharge. (Not found.)
  - The supposed trigger is only a general polynomial/combinatorial/function-field result renamed for the P1553 setting. (All candidates are of this form.)
  - The trigger is an already-costed norm, resultant, quotient, full power-projection, represented-table, or witness-conditioned route. (C1, C2, C3, C4, C6 are.)
  - The trigger requires a root, factor, witness, support table, or source enumeration. (None supplies the public constructor, so none reaches r_R mod g_I from E, P, Q.)
  - The trigger's named theorem is withdrawn or carries a known proof gap. (C2 is, per this round's full-text / abs-page reading.)

