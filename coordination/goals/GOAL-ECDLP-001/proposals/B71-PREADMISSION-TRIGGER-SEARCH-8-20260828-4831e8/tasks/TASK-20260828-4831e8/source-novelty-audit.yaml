  - key: modular_composition_circuit_full_text
    citation: Andrews-Kumar-Rai, arXiv:2511.05035 (v2 withdrawn 2026-01-27), Modular composition & polynomial GCD in the border of small, shallow circuits.
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To re-adjudicate the one seventh-round near-miss whose frozen-gate
      verdict (G3, uniform public construction with explicit constants) was
      settled at abstract level only, against the full public text.
    supplied: >-
      The full text is genuinely unavailable: the HTML and PDF views returned
      404 and the abs page reveals the paper is WITHDRAWN (v2, 2026-01-27) with
      "No license for this version due to withdrawn." The metadata and abstract
      (API) and the abs page were read. The abstract states the result is a
      border-complexity (non-uniform) statement over infinite fields, with the
      circuit family constructible in near-linear time. The arxiv:comment field
      (metadata) states a referee pointed out a gap in the proofs of Theorems
      6.2 and 6.4.
    supports: []
    limitations: >-
      Full text unavailable (withdrawn). The object is a border-complexity
      result over infinite fields, not a uniform typed public construction for
      the frozen prime/finite-field P1553 setting; it does not supply the
      public g_I and r_R construction or compute r_R mod g_I from E, P, Q; it
