claim_ceiling: unverified_zero_run_formula_level_frobenius_orbit_additive_character_semaev_separator_or_exact_declared_construction_scoped_counterexample_only

target_statement:
  informal: >-
    A single frozen, public, oriented Semaev separator kernel admits a
    low-conductor additive-character transform. A finite public Frobenius
    recurrence and a public witness-independent frequency set of sub-rho size
    suffice to reconstruct a signed branch certificate, distinguish Q from
    minus Q, and recover or sub-rho-list the scalar witness with strict sub-rho
    cost on every resource axis.
  quantifiers: >-
    There exists one fully specified public construction rule C and constants
    epsilon greater than zero and c such that, for every instance in a declared
    infinite family and every public Q in the subgroup, C chooses the same type
    of kernel, recurrence, and frequency-selection rule without the scalar
    witness; with stated probability over committed public randomness, the
    signed replay returns a candidate list containing the witness, and total
    time, memory, storage, traffic, data or queries, and preprocessing are each
    O(n^(1/2-epsilon) polylog(n)).
  present_support: none

lemma_decomposition:
  - id: L1_TYPED_KERNEL
    responsibility: >-
      Define one public separator kernel including field tower, tree, separator,
      value ring, branch multiplicity, exceptional divisor, basis, and orientation.
    status: open
    falsifier: Ambiguity or target-dependent changes alter the object being transformed.
  - id: L2_CHARACTER_NORMALIZATION
    responsibility: >-
      Define the additive characters and exact normalization so direct DFT,
      recurrence, and replay are the same mathematical transform.
    status: open
    falsifier: Any convention-dependent disagreement or hidden full-conductor cost.
  - id: L3_FROBENIUS_RECURRENCE
    responsibility: >-
      Derive a finite recurrence on transform coefficients along every Frobenius
      orbit, with order, initialization, exceptions, and coefficient growth bounded.
    status: open
    falsifier: Periodicity only, prime-field identity, or no saving after setup.
  - id: L4_PUBLIC_FREQUENCY_THEOREM
    responsibility: >-
      Prove that a witness-independent public A of o(sqrt(n)) size preserves a
      uniform oriented recovery or candidate-list guarantee.
    status: open
    falsifier: Adaptive support, large omitted mass, or Omega(sqrt(n)) retained data.
  - id: L5_SIGNED_REPLAY_CORRECTNESS
    responsibility: >-
      Prove that retained coefficients reproduce correctly swapped Q and minus-Q
      oriented transcripts, including multiplicities and exceptional branches.
    status: open
    falsifier: x-only sign collision or a missing branch with nonnegligible mass.
  - id: L6_INFORMATION_TO_WITNESS
    responsibility: >-
      Bound the candidate scalar list implied by the retained signed transcript
      and prove exact group verification recovers the correct witness.
    status: open
    falsifier: Exponential or rho-size lists, or the same transcript for many scalars.
  - id: L7_END_TO_END_COST
    responsibility: >-
      Multiply per-attempt construction, transform, recurrence, replay,
      enumeration, and verification cost by inverse success probability and bound
      every resource axis strictly below rho.
    status: open
    falsifier: Any charged axis reaches n^(1/2-o(1)) or worse.

dependency_order:
  - [L1_TYPED_KERNEL, L2_CHARACTER_NORMALIZATION]
  - [L2_CHARACTER_NORMALIZATION, L3_FROBENIUS_RECURRENCE]
  - [L1_TYPED_KERNEL, L4_PUBLIC_FREQUENCY_THEOREM]
  - [L3_FROBENIUS_RECURRENCE, L4_PUBLIC_FREQUENCY_THEOREM]
  - [L4_PUBLIC_FREQUENCY_THEOREM, L5_SIGNED_REPLAY_CORRECTNESS]
  - [L5_SIGNED_REPLAY_CORRECTNESS, L6_INFORMATION_TO_WITNESS]
  - [L3_FROBENIUS_RECURRENCE, L7_END_TO_END_COST]
  - [L6_INFORMATION_TO_WITNESS, L7_END_TO_END_COST]

cheap_audits:
  exact_baseline_reproduction:
    applies: true
    baseline: >-
      Full exact DFT of the frozen finite kernel plus exhaustive oriented replay
      on small fields, using identical trace, basis, root-of-unity, sign, and scaling conventions.
    attack_plan:
      - derive every coefficient by direct summation
      - derive every coefficient independently from the recurrence and its declared initial values
      - replay Q and minus Q independently from the full coefficient table
      - compare exact values, branches, multiplicities, and operation counts
    expected_break: >-
      A normalization mismatch, lost exceptional branch, or a recurrence that
      reproduces orbit periodicity but does not lower construction cost.
    pass_condition: Exact coefficient and signed-branch agreement with a complete cost ledger.
    current_result: not_run
  observation_collision_search:
    applies: true
    collision_object: >-
      Distinct oriented branch transcripts, including Q and minus Q, that map to
      the same coefficient vector restricted to public A.
    attack_plan:
      - enumerate small typed instances and all oriented separator branches
      - hash the exact retained vectors under the preregistered A
      - record all cross-sign, cross-scalar, multiplicity, and exceptional collisions
      - compare collision rates with a matched random-kernel null
    expected_break: >-
      The x-coordinate Semaev kernel erases sign, so Q and minus Q collide unless
      the kernel or replay carries an independently sufficient orientation channel.
    pass_condition: >-
      A uniform theorem and exhaustive small-instance evidence bound every
      collision list below the end-to-end sub-rho budget.
    current_result: not_run
  quantifier_order_statement:
    applies: true
    required_order:
      - freeze the infinite instance family and all public types
      - choose the construction and frequency-selection rule
      - sample or receive public P and Q
      - construct A without k and without replay outcomes
      - compute retained coefficients and signed replay
      - enumerate and verify candidates
    forbidden_order: >-
      Observe the target spectrum, hidden witness, successful branches, or replay
      collisions first and then choose A, the kernel, tower, or recurrence.
    expected_break: >-
      Spectral sparsity may be visible only after target-dependent frequency
      search, moving rho-scale work or witness advice into preprocessing.
    pass_condition: A is public and uniform before target outcomes, with all selection work charged.
    current_result: statement_only
  method_ceiling_nearby_object_control:
    applies: true
    nearby_object: >-
      A same-shaped non-elliptic polynomial kernel with a planted common-zero or
      matched spectrum for which the conclusion that a Semaev branch encodes an
      elliptic scalar witness is known false.
    attack_plan:
      - apply the identical transform, recurrence, A selection, and replay proof text
      - prohibit use of curve-law facts absent from the claimed lemmas
      - identify the first lemma that distinguishes the genuine Semaev object
      - reject the argument if it still returns a witness certificate
    expected_break: >-
      A spectral or recurrence argument based only on finite periodicity and
      sparsity may prove too much and accept the planted non-elliptic object.
    pass_condition: >-
      A named elliptic-structure lemma rejects the nearby object before witness
      recovery, while all genuine positive controls remain accepted.
    current_result: not_run

required_three_way_control:
  direct_dft:
    input: exact frozen kernel table
    output: full exact transform coefficients
    independence: direct summation only; no recurrence implementation or replay notes
  recurrence_reconstruction:
    input: frozen recurrence statement and declared initial coefficients
    output: full exact transform coefficients along every orbit
    independence: no direct-DFT output beyond committed positive training fixtures
  signed_replay:
    input: frozen A and retained coefficient vector
    output: separate oriented transcripts and candidate lists for Q and minus Q
    independence: no access to hidden witness during construction or replay
  agreement_gate: >-
    All exact coefficients and declared oriented branch consequences must agree;
    Q and minus Q must swap rather than collide, and the same check must reject
    null and nearby known-false objects.
  status: not_run

