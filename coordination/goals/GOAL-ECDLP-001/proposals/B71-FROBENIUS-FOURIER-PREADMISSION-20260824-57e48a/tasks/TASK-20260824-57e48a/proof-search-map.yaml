    status: open
  G6_COMPLETE_SUB_RHO_ACCOUNTING:
    lemmas: [L7_END_TO_END_COST]
    status: open

failure_localization:
  - symptom: recurrence equals length-one periodicity on prime-field coefficients
    localizes_to: L3_FROBENIUS_RECURRENCE
    interpretation: typed degeneracy, not evidence against unrelated transforms or towers
  - symptom: Q and minus Q retained vectors collide
    localizes_to: L1_TYPED_KERNEL or L5_SIGNED_REPLAY_CORRECTNESS
    interpretation: sign channel absent in this exact construction
  - symptom: sparse A works only after seeing target coefficients
    localizes_to: L4_PUBLIC_FREQUENCY_THEOREM
    interpretation: target-dependent advice or uncharged search
  - symptom: candidate list remains rho-size
    localizes_to: L6_INFORMATION_TO_WITNESS
    interpretation: no useful information bridge
  - symptom: nearby false object is accepted
    localizes_to: first purported elliptic-structure lemma that fails to distinguish it
    interpretation: proof proves too much
  - symptom: any resource axis reaches rho
    localizes_to: L7_END_TO_END_COST
    interpretation: exact end-to-end proposal fails pre-admission only

stopping_rules:
  - Stop before implementation or experiment execution because this role has no approval to run either.
  - Stop admission if any of G1 through G6 remains undisclosed or false.
  - Treat crashes, timeouts, missing dependencies, and unavailable backends as infrastructure outcomes only.
  - Preserve all untested variants and extension-field routes when reporting a scoped failure.

