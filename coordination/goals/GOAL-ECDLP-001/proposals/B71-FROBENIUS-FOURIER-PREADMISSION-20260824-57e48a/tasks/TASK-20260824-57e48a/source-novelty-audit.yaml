required_retrieval_plan:
  - priority: 1
    query_target: >-
      Primary Semaev summation-polynomial definitions, sign symmetry, exceptional
      branches, and exact complexity claims for prime and extension fields.
    purpose: Freeze the kernel type and avoid attributing sign information that x-only relations discard.
  - priority: 2
    query_target: >-
      Primary finite-field character-sum and Fourier results that explicitly bind
      conductor, Frobenius action, coefficient recurrence, and normalization.
    purpose: Determine whether a useful recurrence is known or whether only periodicity follows.
  - priority: 3
    query_target: >-
      Primary sparse-Fourier or compressed-sensing theorems over the relevant
      finite additive groups, including uniform versus nonuniform support selection.
    purpose: Test whether a witness-independent A with exact recovery could satisfy the declared quantifiers.
  - priority: 4
    query_target: >-
      ECDLP algorithms combining character sums, Frobenius orbits, summation
      polynomials, or spectral methods, including negative and complexity results.
    purpose: Assess duplication, known obstructions, and the nearest end-to-end cost model.
  - priority: 5
    query_target: >-
      Generic-group lower bounds and representation-specific escape conditions.
    purpose: State the rho comparison and affected-versus-safe scope accurately.

novelty_falsifiers:
  - A retrieved primary source already states the same frozen-kernel recurrence, public frequency theorem, signed replay, and end-to-end cost result.
  - The supposed low-conductor transform is only a full transform or frequency truncation under another name.
  - Frobenius recurrence reduces to standard orbit periodicity with no computational compression.
  - The public set A is actually chosen from target-dependent spectral observations or hidden witness advice.
  - Signed replay is a standard, already-costed component of the nearest method and adds no distinct mechanism.
  - Complete accounting shows no delta from rho on one or more resource axes.

