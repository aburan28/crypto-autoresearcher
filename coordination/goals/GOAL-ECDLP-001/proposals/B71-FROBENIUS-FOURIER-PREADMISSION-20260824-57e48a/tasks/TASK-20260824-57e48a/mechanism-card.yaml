title: Public Frobenius-Fourier pre-admission test for one fixed oriented Semaev separator kernel
role: idea-generator
record_kind: preadmission_mechanism
result_count: 1
status: proposed
disposition: scoped_no_admission
claim_ceiling: unverified_zero_run_formula_level_frobenius_orbit_additive_character_semaev_separator_or_exact_declared_construction_scoped_counterexample_only

research_question: >-
  Can a single completely public separator kernel, frozen from one exact Semaev
  addition tree, have a low-conductor additive-character representation whose
  coefficients obey a finite Frobenius-orbit recurrence and whose public,
  witness-independent frequency support is small enough to permit signed
  Q-versus-minus-Q replay with sub-rho cost in every resource axis?

mechanism:
  public_instance:
    objects:
      - a finite field F_q and a fully specified extension F_qd when d is greater than one
      - a public elliptic curve E over F_q
      - public points P and Q with Q in the subgroup generated by P
      - one exact, immutable Semaev addition tree including all branch conventions
    witness: the scalar k satisfying Q = [k]P
    witness_use_rule: >-
      The frequency set, kernel definition, recurrence, truncation rule, and
      replay rule must be chosen without k and without any run-derived proxy for k.
  frozen_separator_kernel:
    symbol: K_Q(z)
    domain: >-
      One explicitly typed public separator variable z in the frozen Semaev tree;
      the field, basis, tree node, elimination order, exceptional divisors, and
      multiplicity convention must be part of the frozen specification.
    codomain: >-
      A finite, exactly encoded value ring that retains enough branch information
      for a later oriented replay. A zero-set indicator alone is insufficient
      unless the orientation loss is separately repaired and proved.
    definition_boundary: >-
      K_Q is computed only from the public instance and the fixed tree. Changing
      the tree, separator variable, exceptional-set convention, or coefficient
      encoding creates a different kernel and cannot be pooled into this test.
  additive_character_transform:
    symbol: Khat_Q(a)
    formal_definition: >-
      Khat_Q(a) = |D|^(-1) sum over z in D of K_Q(z) psi_a(z), where D is the
      frozen finite additive domain and psi_a is an explicitly normalized
      additive character defined through the frozen trace and field basis.
    low_conductor_requirement: >-
      The proposal must exhibit a conductor parameter c and an evaluation
      procedure whose dependence on c is stated. Merely restricting frequencies
      or renaming a full-conductor character as low conductor does not discharge
      this requirement.
    normalization_requirement: >-
      Direct DFT, recurrence reconstruction, and replay must use byte-identical
      trace, root-of-unity, sign, basis, and scaling conventions.
  finite_frobenius_orbit_recurrence:
    candidate_relation: >-
      For a in the dual domain, compare coefficients on the orbit
      a, a^q, a^(q^2), ..., and seek a fixed-order public recurrence whose
      coefficients depend only on the frozen public circuit and field tower.
    necessary_nontriviality: >-
      Orbit periodicity of length at most d is not compression by itself. The
      recurrence must reduce total transform construction and storage below the
      declared rho baseline after its derivation, initialization, and exception
      handling are charged.
    prime_field_boundary: >-
      If the transform domain is F_q with q prime and no nontrivial extension
      action, Frobenius is the identity and the orbit has length one. This is a
      degeneracy, not a useful recurrence, unless an independently justified
      nontrivial tower action is specified and fully charged.
  frequency_selection:
    symbol: A
    requirements:
      - A is fixed from public typed data before any hidden witness or replay outcome is known
      - the rule for constructing A is deterministic or uses committed public seeds
      - cardinality, description length, construction time, and memory are all charged
      - omitted-frequency error has a uniform bound over the declared instance family
      - the same A is used for Q and minus Q
    forbidden_shortcut: >-
      Selecting frequencies after observing where a target-dependent spectrum is
      large is witness-dependent advice unless the selection process and its full
      search cost are charged and proved uniform.
  signed_replay:
    requirement: >-
      Reconstruct or test an oriented branch certificate separately for Q and
      minus Q, preserving y-coordinate sign and every exceptional branch. The
      outputs must swap according to the frozen orientation convention and must
      not collapse to the same x-only transcript.
    rejection_condition: >-
      If Khat_Q on A is invariant under Q mapped to minus Q and no separately
      sub-rho orientation channel is proved, the mechanism fails this pre-admission.
  proposed_information_bridge: >-
    The hoped-for bridge is that a uniformly bounded set A of transform
    coefficients determines the oriented branch transcript of the frozen
    separator strongly enough to recover or sharply restrict the scalar witness.
    No such injectivity, list-size, or recovery theorem is supplied here. A
    deterministic public transform of Q is not itself a witness-recovery result.

predictions:
  - id: P1_TYPED_TRANSFORM
    statement: >-
      One exact public kernel and character normalization can be evaluated by a
      direct finite DFT and independently reconstructed on complete Frobenius
      orbits with exact agreement on small typed instances.
  - id: P2_NONTRIVIAL_RECURRENCE
    statement: >-
      The recurrence order and initialization cost grow slowly enough that the
      total recurrence route is asymptotically and concretely smaller than a
      direct full transform; prime-field length-one periodicity does not count.
  - id: P3_PUBLIC_SPARSE_SUPPORT
    statement: >-
      A witness-independent public rule selects a frequency set A of size
      o(sqrt(n)) with a proved uniform omitted-mass or list-size guarantee.
  - id: P4_SIGNED_SEPARATION
    statement: >-
      Replays for Q and minus Q produce distinct, correctly swapped oriented
      transcripts under the same A and the same frozen kernel conventions.
  - id: P5_INFORMATION_BRIDGE
    statement: >-
      The retained coefficients provably bound the scalar-witness candidate list
      tightly enough that construction plus enumeration remains sub-rho.
  - id: P6_ALL_AXIS_COST
    statement: >-
      Kernel construction, coefficient evaluation, recurrence derivation and
      initialization, frequency selection, replay, candidate verification,
      exceptional branches, storage, traffic, and data or query use are each
      strictly sub-rho under one common parameterization.

positive_admission_gates:
  - id: G1_EXACT_PUBLIC_KERNEL
    requirement: >-
      Freeze a single typed Semaev tree, separator variable, kernel value ring,
      field basis, character normalization, multiplicities, exceptional divisors,
      and orientation convention, with no hidden witness dependence.
    discharged: false
    reason: No executable or proof-complete frozen circuit is supplied in this idea record.
  - id: G2_FINITE_USEFUL_RECURRENCE
    requirement: >-
      Derive a finite Frobenius-orbit recurrence and prove that it compresses
      evaluation rather than merely restating finite orbit periodicity.
    discharged: false
    reason: >-
      Finite orbit periodicity is immediate, but no useful fixed-order recurrence
      with charged derivation and initialization cost has been proved.
  - id: G3_WITNESS_INDEPENDENT_FREQUENCIES
    requirement: >-
      Give a public frequency set A, chosen before replay outcomes, with a uniform
      truncation or candidate-list theorem and size strictly below rho.
    discharged: false
    reason: No uniform sparse-support or list-size theorem is available.
  - id: G4_SIGNED_Q_REPLAY
    requirement: >-
      Show the same retained coefficients support correctly oriented, distinct
      replays for Q and minus Q, including exceptional branches.
    discharged: false
    reason: >-
      Standard Semaev x-coordinate relations are sign-insensitive; an oriented
      sub-rho repair has not been constructed or proved.
  - id: G5_THREE_WAY_CONTROLS
    requirement: >-
      Obtain exact agreement among direct DFT, recurrence reconstruction, and
      signed replay on positive, null, collision, sign-flip, and nearby-object controls.
    discharged: false
    reason: No experiment was authorized or executed by this role.
  - id: G6_COMPLETE_SUB_RHO_ACCOUNTING
    requirement: >-
      Establish strict sub-rho time, memory, storage, traffic, data or queries,
      preprocessing, and success-amplification cost with every public construction charged.
    discharged: false
    reason: >-
      The information bridge and sparse-support theorem are absent, so no complete
      end-to-end cost bound can presently be stated.

minimal_discriminating_test:
  boundary: >-
    Small finite fields and one frozen low-depth Semaev tree only. This test can
    reject the typed recurrence and orientation mechanism but cannot support a
    cryptographic-scale ECDLP claim.
  preregistered_steps:
    - Freeze the field tower, basis, curve, P, Q, minus Q, tree, separator, kernel encoding, character family, and normalization.
    - Enumerate the full kernel domain and compute the exact direct DFT using rational or symbolic cyclotomic encoding where feasible.
    - Derive the proposed Frobenius recurrence without reading the direct-DFT outputs beyond preregistered training instances.
    - Reconstruct complete orbits and compare every coefficient against the direct DFT.
    - Select A using only the preregistered public rule, then perform separate oriented replays for Q and minus Q.
    - Repeat all measurements on a matched random kernel, a sign-erased x-only kernel, a permuted separator, and a planted non-elliptic nearby object.
    - Report operation counts, recurrence order, initialization size, coefficient growth, support size, list size, failures, memory, storage, traffic, and data use.
  controls:
    direct_dft: Exact full transform of the frozen finite kernel.
    recurrence: Independent reconstruction from the stated recurrence and initial coefficients.
    signed_replay: Independent Q and minus-Q oriented replay from the retained set A.
    null_same_shape: Matched random kernel with the same domain, codomain histogram, and sparsity.
    sign_erased: The same tree with orientation deliberately removed; Q and minus Q must collide here.
    nearby_false_object: >-
      A matched non-elliptic planted common-zero relation for which a purported
      Semaev-specific witness conclusion is known false.

falsification_criteria:
  - Any field, tree, basis, branch, character, or multiplicity convention remains implicit.
  - The recurrence is only orbit periodicity or its derivation plus initialization costs at least the direct transform.
  - The frequency selector reads witness-dependent or replay-dependent information not fully charged as search.
  - A requires Omega(sqrt(n)) elements, operations, words, queries, or communicated values on the declared family.
  - Q and minus Q yield the same retained transcript without an independently proved sub-rho orientation repair.
  - Direct DFT, recurrence reconstruction, and signed replay disagree under identical normalization.
  - The method also asserts a witness on the nearby known-false object.
  - Any omitted preprocessing, candidate enumeration, exception handling, or amplification raises an axis to rho cost or above.

cost_model:
  baseline: >-
    Generic rho cost is Theta(sqrt(n)) group operations for subgroup order n,
    with the exact comparison unit and memory model frozen before evaluation.
  charged_components:
    - Semaev tree and kernel construction
    - field-tower and basis construction
    - character and root-of-unity representation
    - direct or partial coefficient evaluation
    - recurrence discovery or derivation and verification
    - initial coefficients for every orbit
    - public frequency selection and description
    - signed replay for Q and minus Q
    - exceptional-divisor and multiplicity handling
    - candidate-list generation and group verification
    - success amplification
    - peak and aggregate memory
    - persistent storage and interprocess or network traffic
    - public data, oracle calls, and preprocessing amortization
  required_output: >-
    A single table at common parameters reporting exponent and concrete counts for
    time, memory, storage, traffic, data or queries, preprocessing, and success
    probability. No axis may be hidden in soft-O notation.
  current_state: unavailable

