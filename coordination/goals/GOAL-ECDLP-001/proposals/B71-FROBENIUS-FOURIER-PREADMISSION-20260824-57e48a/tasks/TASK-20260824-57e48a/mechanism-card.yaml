obstruction:
  quantity: smallest public retained frequency-set size sufficient for oriented witness recovery
  measured_value: null
  units: transform coefficients
  error_bars: null
  run_refs: []
  scope: one frozen Semaev separator kernel under the declared transform
  status: unmeasured
  resource_check:
    examined: true
    reading: >-
      A large or sign-invariant spectrum could be useful as a null model for
      detecting overfitted separator claims, but no resource that turns it into
      a sub-rho recovery mechanism is presently established.

route_preservation:
  untested_routes:
    - alternative oriented kernels that retain y-coordinate information at construction time
    - multiplicative or nonabelian transforms with a genuine conductor parameter
    - extension-field towers with nontrivial, provably compressive Frobenius modules
    - approximate sparse recovery with a uniform theorem and exact verification
    - hybrid spectral and subresultant certificates with fully charged public preprocessing
  closure_statement: >-
    None of these routes is tested or closed. Failure of this exact pre-admission
    proposal would apply only to the frozen kernel, transform, recurrence,
    frequency rule, and replay boundary actually specified and evaluated.

decision_summary: >-
  All six positive admission gates remain open. The prime-field Frobenius
  degeneracy, absence of a public sparse-support theorem, missing signed
  orientation bridge, and unavailable all-axis accounting prevent admission.
  The honest disposition is scoped_no_admission, with every broader route preserved.
