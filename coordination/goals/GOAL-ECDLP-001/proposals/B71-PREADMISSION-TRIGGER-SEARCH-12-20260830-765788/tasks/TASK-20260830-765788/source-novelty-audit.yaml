    read: 0 results.
  - url: 'http://export.arxiv.org/api/query?search_query=all:%22Dixon+resultant%22&max_results=10'
    read: >-
      7 relevant results read at abstract level: hidden-variable tensor
      Dixon resultant for polynomial multiparameter eigenvalue problems
      (2503.22887); DAE index reduction via Dixon resultant (1504.04977);
      camera-pose recovery via Dixon resultant (1901.09364); DixonEDF
      bifurcation analysis (2204.12437); parametric discriminant varieties
      via Dixon and iterated resultants (2201.13189); two off-topic physics
      papers using "Dixon" for the unrelated Mathisson-Papapetrou-Dixon
      equations (2412.16077, 1307.3933), screened out by topic.
  - url: 'https://arxiv.org/abs/2503.22887'
    read: >-
      Abstract: the method "transforms a [polynomial multiparameter
      eigenvalue problem] into one or more univariate polynomial eigenvalue
      problems, which are solved as generalized eigenvalue problems," and
      "avoids the need for custom linearizations." The abstract does not
      itself state whether the hidden-variable/Dixon resultant matrix is
      built from coefficients alone or requires additional structure; this
      is recorded honestly as an abstract-level limitation. The assessment
      in mechanism-card.yaml and proof-search-map.yaml relies instead on
      the classical, independently confirmed structural fact (from the
      Bezout-matrix literature read above) that a Dixon/hidden-variable
      resultant matrix's size is dominated by the largest input polynomial
      degree, which for the P1553 setting is deg(r_R) = Theta(B^3)
      regardless of the specific linearization-avoidance technique.
