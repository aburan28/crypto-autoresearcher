      Bezoutian null-space/root-counting theory (1207.2434, 1402.4952,
      1805.03628, 2404.18117, math/0505224, math/0601047, 2005.03251) and
      the hidden-variable Dixon-resultant eigenvalue method (2503.22887 and
      adjacent applications).
    nearest_internal_work: >-
      idea_generation_20260718_batch3.md's A1 candidate (displacement-
      structured Bezoutian backend for a different elliptic setting).
    proposed_delta: >-
      A typed public computation of r_R mod g_I from E, P, Q alone, inside
      the B^(5/4) interface budget, via the eigenstructure or displacement
      structure of a Bezoutian or Dixon-resultant matrix built from g_I and
      r_R.
    novelty_status: adaptation
    evidence: >-
      The mechanism is a direct application of the general Bezoutian/Dixon
      construction to the P1553 g_I/r_R pair; it is not a genuinely new
      mathematical construction relative to the retrieved and internal
      prior art, and it fails at the cost-enumeration step (G3) because the
      resulting matrix is dominated by deg(r_R) = Theta(B^3).
