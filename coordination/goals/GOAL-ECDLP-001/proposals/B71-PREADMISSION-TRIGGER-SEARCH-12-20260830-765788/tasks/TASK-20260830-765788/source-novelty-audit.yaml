source_entries:
  # --- Retrieved (fetched and read in this task) ---
  - key: bezoutian_construction_and_null_space_theory
    citation: >-
      arXiv:1207.2434; arXiv:1402.4952; arXiv:1805.03628; arXiv:2404.18117;
      arXiv:math/0505224; arXiv:math/0601047; arXiv:2005.03251.
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To confirm the exact data required to construct a Bezoutian matrix
      (coefficients only, or roots too) and its size relative to its two
      input polynomials' degrees.
    supplied: >-
      Confirmation that Bez(f,g) is built directly from the coefficients of
      f and g (no roots needed a priori), is a max(deg f, deg g) x
      max(deg f, deg g) matrix, and satisfies det(Bez(f,g)) proportional to
      Res(f,g), with rank/signature giving root-count/common-root
      information.
    supports: []
    limitations: >-
      None of the eight sources treats the case of one input of degree
      Theta(B^3) against another of degree Theta(B); the size/cost
      consequence for the P1553 setting (matrix dominated by deg r_R) is
      this task's own inference from the confirmed general construction
      fact, not a statement made by any source.
  - key: dixon_hidden_variable_resultant_eigenvalue
    citation: >-
      arXiv:2503.22887; arXiv:1504.04977; arXiv:1901.09364; arXiv:2204.12437;
      arXiv:2201.13189.
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To find a Dixon/hidden-variable resultant construction reformulating
      multivariate elimination as a polynomial eigenvalue problem that could
      supply a public r_R mod g_I transducer.
    supplied: >-
      Confirmation that the hidden-variable Dixon-resultant method reduces a
      multivariate elimination problem to one or more univariate polynomial
      eigenvalue problems; applications to multiparameter eigenvalue
      problems, DAE index reduction, camera-pose recovery, bifurcation
      analysis, and discriminant-variety construction.
    supports: []
    limitations: >-
      No source addresses an already-univariate pair of polynomials (g_I,
      r_R already univariate in the P1553 setting); applying the method
      here reduces to an ordinary resultant of the same Theta(B^3)-dominated
      shape as the Bezoutian case, via an unneeded auxiliary variable. No
      P1553 typing, no B^(5/4)/o(ell^(1/2)) enumeration in any source.
  - key: companion_matrix_resultant_literature
    citation: arXiv:2212.03422; arXiv:1908.07331.
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To confirm the classical fact that a polynomial evaluated at the
      companion matrix of another polynomial computes a remainder, and
      whether any published algorithm evaluates a high-degree polynomial at
      a companion matrix without materializing its full coefficient vector.
    supplied: >-
      Confirmation that companion-matrix-derived matrices support
      subresultant computation in Newton basis and that determinantal
      divisors of f(companion matrix) equal resultants; no algorithm beyond
      standard modular-composition techniques (Brent-Kung, Kedlaya-Umans)
      for evaluating a high-degree polynomial at a companion matrix without
      full materialization.
    supports: []
    limitations: >-
      Neither source addresses the P1553 setting or supplies anything beyond
      the already-costed ROUTE-05 modular-composition mechanism.
  - key: sylvester_pencil_note
    citation: arXiv:1311.2130.
    provenance: retrieved
    opened_in_task: true
    read_for: To check for a Sylvester-matrix-pencil resultant/remainder construction distinct from the companion-matrix case.
    supplied: A note connecting generalized eigenvalue problems to Sylvester-type matrix equations, via deflating subspaces.
    supports: []
    limitations: Addresses Sylvester matrix EQUATIONS (solving AX+XB=C), not resultant or remainder computation; off-target for this task's construction question.
  - key: u_resultant_toric
    citation: arXiv:math/9702221.
    provenance: retrieved
    opened_in_task: true
    read_for: To find a u-resultant construction applicable to the P1553 setting.
    supplied: A binomial variant of the u-resultant exploiting sparsity via toric geometry, for multivariate elimination.
    supports: []
    limitations: >-
      Requires a genuinely multivariate elimination problem and an
      established sparsity structure; g_I and r_R are already univariate in
      the frozen setting and no sparsity bound on r_R is established. No
      P1553 typing.
  - key: auzinger_stetter_construction
    citation: arXiv:1805.09165.
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To determine what data (points, coefficients, a Groebner basis) is
      required to construct an Auzinger-Stetter matrix.
    supplied: >-
      Confirmation that Auzinger-Stetter matrices are built "with respect to
      the lexicographical Groebner escalier of the ideal of the points,"
      i.e. indexed by an already-known point set.
    supports: []
    limitations: >-
      Abstract-level only; the paper's own cost analysis (if any) for the
      escalier-computation algorithm was not fetched, since the
      construction-direction question (points known first) is already
      settled by the stated problem framing.
  - key: multiplication_matrix_requires_groebner_basis
    citation: arXiv:2202.09226.
    provenance: retrieved
    opened_in_task: true
    read_for: >-
      To determine whether a multiplication matrix for a zero-dimensional
      ideal can be built without a Groebner basis.
    supplied: >-
      Direct confirmation: "a Groebner basis must first be computed using
      the degree reverse lexicographic order before the multiplication
      matrix can be extracted" for the change-of-order pipeline the paper
      accelerates.
    supports: []
    limitations: >-
      Addresses the specific degree-reverse-lexicographic-to-lexicographic
      change-of-order setting; the finding (a Groebner basis is a stated
      prerequisite) is general enough to apply directly to the P1553
      question without further extrapolation.

