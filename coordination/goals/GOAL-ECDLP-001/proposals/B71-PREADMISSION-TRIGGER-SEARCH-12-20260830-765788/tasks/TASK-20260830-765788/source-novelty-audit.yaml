provenance_policy: >-
  Every entry is labeled recalled, retrieved, kb, or internal. Retrieved
  means the source was fetched and read in this task (arXiv export API
  query responses and arXiv abstract pages via webfetch). kb means the
  source was resolved through grep to a committed knowledge/ corpus record
  and read. internal means a committed repository record (goal head,
  dispatch queue, frozen H-CREP-001 hypothesis, EXP-CREP-001 specification
  and packages, H-SUBRES-001, prior-round packets, or the idea-generation
  corpus under inputs/) read in this task. Recalled means no source was
  opened and the entry cannot support a coordinator decision, a known/
  adaptation novelty status, or a mathematical conclusion. No trigger-
  carrying statement in this task rests on a recalled source; every
  trigger-carrying statement rests on a retrieved, kb, or internal object
  actually read. Two specific facts are flagged recalled rather than
  retrieved and are marked as such wherever used: the classical Stetter-
  Moller theorem statement (its exact name returned zero arXiv hits) and
  the Kailath-Sayed displacement-structure lineage connecting Bezoutian/
  Sylvester matrices to ROUTE-08 (an arXiv query for "displacement
  structure"+"Bezoutian" also returned zero hits).

