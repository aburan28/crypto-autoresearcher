claim_ceiling: unverified_zero_run_formula_level_p1553_remainder_or_dyadic_unit_product_typed_trigger_and_gate_discharge_only

target_statement:
  informal: >-
    An actual recurrence, circuit identity, or retrieved theorem from
    eigenvalue or structured-matrix methods for polynomial systems --
    Bezoutian-matrix eigenstructure, companion-matrix and Sylvester-matrix
    pencils, u-resultants, or multiplication-operator eigenvalue methods
    (Stetter-Moller, Auzinger-Stetter) -- instantiates to the frozen
    elliptic setting as a typed public P1553 target-local remainder
    transducer for r_R mod g_I or the exact dyadic subinterval unit-product
    interface, and passes every item of the frozen pre-admission gate
    (G1-G8).
  quantifiers: >-
    There exists one named public object T (a recurrence, circuit identity,
    or theorem) and one fully specified public construction rule C such
    that, for the frozen P1553 setting (rings, bases, CRT components,
    interval geometry, public g_I and r_R construction fixed before any
    witness is observed), C computes r_R mod g_I (or the dyadic unit-
    product step) from E, P, Q alone, without roots, factors, witnesses,
    support tables, or source enumeration; the full state/update-map/
    degree/rank/nonzero/coefficient-growth/live-storage/traffic/build-
    query/amortization enumeration lies within the inherited B^(5/4)
    interface budget and strict end-to-end o(ell^(1/2)) time, memory, and
    data; lineage and multiplicity are preserved on coalesced and
    nonreduced fibres; Q is distinguished from -Q; known P and Q
    coefficients are yielded with invertible Q coefficient; output-
    sensitive source unranking is supported; and T is shown not to be an
    already-costed norm, resultant, quotient, full power-projection,
    represented-table, or witness-conditioned route.
  present_support: none

lemma_decomposition:
  - id: L1_NAMED_TRIGGER_OBJECT
    responsibility: >-
      Name the actual recurrence, circuit identity, or retrieved theorem T,
      with its exact statement and source, and verify it is not merely the
      assertion that a specialized circuit may exist.
    status: open
    falsifier: >-
      T is only an existence assertion, a heuristic, or a result whose
      hypotheses are not met by the frozen setting.
  - id: L2_FROZEN_SETTING_TYPING
    responsibility: >-
      Type T into the frozen P1553 setting: rings, bases, CRT components,
      interval geometry, public g_I and r_R construction, and an exact
      computation from E, P, Q without roots, factors, witnesses, support
      tables, or source enumeration. For an eigenvalue/structured-matrix T,
      this includes identifying exactly what data (coefficients only, or
      also roots, a Groebner basis, or a normal-form basis) is required to
      CONSTRUCT the matrix, and verifying that data is genuinely public and
      computable from E, P, Q alone.
    status: open
    falsifier: >-
      Any of the frozen objects is left implicit; the matrix construction
      requires an excluded input (a root, factor, Groebner basis, normal-
      form basis, or an equivalent witness of the joint complete-chart
      system).
  - id: L3_FULL_COST_ENUMERATION
    responsibility: >-
      Enumerate state, update maps, degrees, ranks, nonzeros, coefficient
      growth, live storage, traffic, build/query split, and amortization,
      and bound every axis within the B^(5/4) interface budget and strict
      end-to-end o(ell^(1/2)) time, memory, and data.
    status: open
    falsifier: >-
      Any charged axis is unbounded, at or above ell^(1/2), or the matrix
      whose eigenstructure is required has size or construction cost
      matching an already-costed materialization route (e.g. Theta(B^3),
      matching ROUTE-08's own materialize_resultant_coefficients node).
  - id: L4_LINEAGE_MULTIPLICITY_FIBRES
    responsibility: Preserve lineage and multiplicity on coalesced and nonreduced fibres.
    status: open
    falsifier: A coalesced or nonreduced fibre loses its occurrence label or multiplicity under T.
  - id: L5_Q_VS_MINUS_Q
    responsibility: Distinguish Q from -Q in the transducer output.
    status: open
    falsifier: The output is invariant under Q mapped to -Q with no separately proved orientation channel.
  - id: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    responsibility: Yield known P and Q coefficients with invertible Q coefficient.
    status: open
    falsifier: The Q coefficient is not known a priori or is not invertible on the declared strata.
  - id: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    responsibility: Support output-sensitive source unranking.
    status: open
    falsifier: Unranking requires enumerating the full source or a support table.
  - id: L8_NOT_ALREADY_COSTED_ROUTE
    responsibility: >-
      Show T is not an already-costed norm, resultant, quotient, full
      power-projection, represented-table, or witness-conditioned route;
      specifically, show the candidate is not ROUTE-08 (displacement
      representation), ROUTE-05 (modular composition), ROUTE-02 (quotient-
      ring resultants), or ROUTE-01 (component resultants) under a
      different name, since structured-matrix and multiplication-operator
      methods share lineage with all four.
    status: open
    falsifier: >-
      T's matrix construction cost matches an already-costed
      materialization exactly (ROUTE-01/ROUTE-08), T's operation IS one of
      the frozen routes restated in different vocabulary (ROUTE-05,
      ROUTE-02), or the structured-instance tension is not resolved in T's
      favor.

dependency_order:
  - [L1_NAMED_TRIGGER_OBJECT, L2_FROZEN_SETTING_TYPING]
  - [L2_FROZEN_SETTING_TYPING, L3_FULL_COST_ENUMERATION]
  - [L2_FROZEN_SETTING_TYPING, L4_LINEAGE_MULTIPLICITY_FIBRES]
  - [L2_FROZEN_SETTING_TYPING, L5_Q_VS_MINUS_Q]
  - [L2_FROZEN_SETTING_TYPING, L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q]
  - [L2_FROZEN_SETTING_TYPING, L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING]
  - [L1_NAMED_TRIGGER_OBJECT, L8_NOT_ALREADY_COSTED_ROUTE]
  - [L3_FULL_COST_ENUMERATION, L8_NOT_ALREADY_COSTED_ROUTE]

cheap_audits:
  exact_baseline_reproduction:
    applies: true
    baseline: >-
      The frozen gate items G1-G8 read from the live next_action, the
      g_I/r_R/z_R definitions from H-CREP-001, and the eight frozen already-
      costed routes with their exact descriptions and backend citations
      from EXP-CREP-001/specification.yaml (ROUTE-01-component-resultants,
      ROUTE-02-quotient-ring-resultants described exactly as "resultant
      construction in the quotient-ring direction (r_R mod g_I)",
      ROUTE-03-split-norms, ROUTE-04-multipoint-evaluation, ROUTE-05-
      modular-composition described exactly as "Brent-Kung / Kedlaya-Umans
      lineage", ROUTE-06-power-projection, ROUTE-07-subresultant-hgcd,
      ROUTE-08-displacement-representation with its
      exponent_certificate node n2 declaring cost_exponent_in_B 3 for
      materializing the resultant coefficient vector).
    attack_plan:
      - restate each gate item G1-G8 verbatim from the live next_action
      - restate g_I, r_R, z_R, the eight frozen routes and ROUTE-08's exact exponent certificate from H-CREP-001 and EXP-CREP-001/specification.yaml and its ROUTE-08 package.json
      - for each candidate, identify the exact data required to construct the relevant matrix (Bezoutian, companion, Sylvester, or multiplication-operator) and mark each gate item present/absent with a named reason
      - confirm no candidate is admitted by assertion of a possibly existing specialized circuit
    expected_break: >-
      A candidate that carries G1 (an actual algorithm or theorem) but
      whose matrix construction requires either the full Theta(B^3)
      coefficient vector of r_R (matching ROUTE-08's own materialization
      node) or a Groebner basis / normal-form basis / point set (a witness
      excluded by G2).
    pass_condition: >-
      Every gate item is explicitly present for a candidate, with the exact
      construction and full cost enumeration; otherwise the candidate is
      recorded not intake-ready with its absent items named.
    current_result: >-
      Performed statically. C1 (Bezoutian/Dixon hidden-variable) and C3
      (u-resultant) each require a matrix dominated by deg(r_R) =
      Theta(B^3), matching ROUTE-08's own node n2 cost exponent 3 and
      ROUTE-01's componentwise construction (G3, G8 absent). C2 (companion/
      Sylvester pencil evaluating r_R at the companion matrix of g_I) IS
      ROUTE-05 (modular composition) under matrix-pencil vocabulary (G3, G8
      absent). C4 (multiplication-operator/Stetter-Moller/Auzinger-Stetter)
      requires a Groebner basis or known point set before construction (G2
      absent, two independent retrieved sources) and independently
      generalizes ROUTE-02 precisely (G8 absent). No candidate is intake-
      ready. No experiment was run.
  observation_collision_search:
    applies: true
    collision_object: >-
      A retrieved or internal object that is the same observable as a
      trigger already screened in one of the six terminal pre-admission
      packets, or in the seventh- through eleventh-round candidate sets, or
      an internal idea-generation-corpus candidate that already proposed
      the identical mechanism for a different setting.
    attack_plan:
      - compare each candidate against the six screened families and their scoped negative boundaries
      - compare each candidate against the seventh- through eleventh-round candidate sets and record which, if any, is a re-derivation
      - grep inputs/ and knowledge/ for the exact mechanism names (Bezoutian, Stetter, Auzinger, companion matrix, u-resultant, multiplication operator) and read any on-topic hit in full
      - confirm this round does not reopen round ten's closed mixed-radix/CRT sub-avenue or round eleven's ROUTE-04 collapse
      - record which candidate, if any, falls inside a screened family or duplicates an internal prior candidate
    expected_break: >-
      A candidate that re-runs a screened family, re-derives a prior-round
      candidate, reopens a closed sub-avenue, or restates an internal
      idea-generation-corpus candidate (POWERPROJ-A1, the displacement-
      structured Bezoutian backend) that already disclosed the same
      obstruction for a different elliptic setting.
    pass_condition: >-
      No candidate re-runs a frozen screen, re-derives a prior-round
      candidate, reopens a prior closure, or silently restates an internal
      prior candidate without crediting its disclosed obstruction.
    current_result: >-
      Performed statically, including a genuine internal-corpus hit. This
      round does not re-derive the seventh- through eleventh-round
      candidate sets and does not reopen round ten's or eleven's closures.
      C1 is adjacent to the SUBRES-COFACTOR screened family and to round
      nine's structured/sparse-resultant screen in spirit; recorded as
      newly retrieved literature checked against the gate, not a re-run.
      Internal-corpus collision found and credited: inputs/
      idea_generation_20260718_batch3.md's A1 candidate
      ("Displacement-structured (Toeplitz-like) Bezoutian membership
      backend") and inputs/idea_generation_20260718_batch5.md's
      POWERPROJ-A1 candidate both propose, for the RT-1476 Semaev setting
      (a different hypothesis, RQ-ECDLP-002, from this task's RQ-CRYPTO-001
      P1553 setting), the identical mechanisms this round searches
      (displacement-structured Bezoutian solve; multiplication-operator
      power sums), and each self-discloses substantially the same
      obstruction this round's independent literature retrieval confirms
      (generic Bezout-dense degree; matrix-construction cost hiding the
      claimed exponent). Neither internal candidate was ever promoted to a
      ledger hypothesis for the multiplication-operator/displacement-
      Bezoutian mechanism specifically (H-SUBRES-001/EXP-RT1476-001 tested
      the sibling subresultant-PRS candidate, not these two), so this is
      recorded as a genuine, credited internal-corpus overlap rather than a
      re-run of a formal screen.
  quantifier_order_statement:
    applies: true
    required_order:
      - freeze the P1553 rings, bases, CRT components, and interval geometry
      - fix the public g_I and r_R construction
      - name the trigger object T (recurrence, circuit identity, or theorem)
      - receive public E, P, Q
      - construct the eigenvalue/structured matrix from E, P, Q alone
      - compute r_R mod g_I (or the dyadic unit-product step) by reading its eigenstructure
      - enumerate the full cost and verify the B^(5/4)/o(ell^(1/2)) bounds
      - verify lineage/multiplicity, Q vs -Q, invertible Q coefficient, and source unranking
    forbidden_order: >-
      Observe a Groebner basis, a normal-form basis, a root set, a witness,
      a support table, or a source enumeration first and then choose T, the
      matrix construction, or the frozen setting's rings/bases; or assume
      the matrix can be built at sub-Theta(B^3) cost without stating the
      construction that achieves it.
    expected_break: >-
      A candidate whose matrix construction requires an excluded input,
      moving witness-equivalent work into the constructor step before any
      eigenvalue is computed.
    pass_condition: >-
      All frozen objects are fixed before any witness is observed, and T's
      matrix is built from public data alone.
    current_result: >-
      Statement only, checked per candidate. C4's construction requires a
      Groebner basis or point set (an excluded witness) before the
      multiplication matrix can even be written down, per two independently
      retrieved sources (arXiv:1805.09165, arXiv:2202.09226) -- this is a
      direct violation of the required order, not an inferred one. C1 and
      C3 require the full Theta(B^3) r_R coefficient vector before any
      matrix can be formed, which is not an excluded witness in the
      root/factor sense but does violate the cost ordering (the matrix
      cannot exist before the already-costed materialization is paid for).
      C2 requires nothing excluded but supplies no construction beyond the
      already-costed ROUTE-05 backend.
  method_ceiling_nearby_object_control:
    applies: true
    nearby_object: >-
      A generic zero-dimensional polynomial system of the same degree
      profile as g_I and the complete-chart system, with no elliptic-curve
      provenance at all (e.g. a random system of the same variable count
      and degrees over the same field).
    attack_plan:
      - apply the identical candidate construction (Bezoutian eigenstructure, companion/Sylvester pencil, u-resultant, Stetter-Moller/Auzinger-Stetter) to the planted generic non-elliptic system
      - prohibit use of any elliptic-curve-specific fact absent from the claimed lemmas
      - identify the first lemma that would need to distinguish the genuine P1553 object from the generic control
      - reject the argument if it still returns a purported P1553 remainder/witness certificate on the planted generic instance at the same claimed cost
    expected_break: >-
      Every candidate this round is a general computational-algebra result
      (true for ANY zero-dimensional system or ANY pair of polynomials of
      the given degrees) with no P1553-structure lemma; each would apply
      identically, and at the identical cost, to the planted generic
      non-elliptic instance, confirming that none of them ever typed the
      frozen P1553 setting's elliptic-curve-specific structure -- the
      generic control does not distinguish because none of C1-C4 uses any
      fact about E, P, or Q beyond treating g_I and r_R as opaque
      polynomials of given degree.
    pass_condition: >-
      A named P1553-structure lemma would need to reject the generic
      control before granting a P1553 remainder/witness at sub-Theta(B^3)
      cost without a Groebner-basis-equivalent witness; no candidate this
      round supplies such a lemma, so none passes.
    current_result: >-
      Not run as an experiment (no experiment authorized). Stated
      analytically: all four candidates are general theorems about
      Bezoutians, companion/Sylvester matrices, u-resultants, or
      multiplication operators of arbitrary zero-dimensional systems; none
      references any elliptic-curve-specific fact (the group law, the
      Weierstrass equation, or the complete-chart intersection structure)
      beyond treating g_I and r_R as opaque polynomials, so each applies
      identically to the generic non-elliptic control at the identical
      (already-costed or witness-conditioned) cost. This confirms none of
      C1-C4 ever typed the frozen P1553 setting specifically -- consistent
      with the recorded G2/G3/G8 failures. No computation was executed;
      this is a stated control, not a run result.
  lossy_projection_test:
    applies: true
    tracked_object_component_c1_c3: >-
      "The Bezoutian (or u-resultant) matrix Bez(g_I, r_R), of size
      max(deg g_I, deg r_R) = Theta(B^3)," proposed as the tracked object
      for C1 and, via an extra reintroduced variable, for C3.
    tracked_object_component_c2: >-
      "The Theta(B)-sized matrix r_R(C_{g_I}), or equivalently its first
      column," proposed as the tracked object for C2's companion-matrix
      evaluation.
    tracked_object_component_c4: >-
      "The eigenvalues (or joint eigenvector coordinates) of the
      multiplication-by-x operator on k[x]/(g_I), or on the quotient ring
      of the joint complete-chart ideal," proposed as the tracked object
      for C4.
    test_result_c1_c3: >-
      FAILS at the "genuinely lossy" clause for this setting's actual size
      regime: the Bezoutian/u-resultant matrix's size is dominated by
      deg(r_R) = Theta(B^3), so constructing it requires exactly the
      Theta(B^3) coefficient data it would need to discard something from
      -- nothing is discarded before the full cost is already paid. This is
      not a change-of-coordinates failure (unlike round eleven's component
      a); it is a failure of the projection to be smaller than its input at
      all in this size regime.
    test_result_c2: >-
      Genuinely lossy (a Theta(B)-sized object discards almost all of the
      Theta(B^3)-scale r_R's information) but fails the "discarded
      compatibly with the target's operations" clause only in the sense
      that the sole known compatible-discard mechanism (evaluating a
      polynomial at a companion matrix without first materializing its
      coefficients) IS the already-costed ROUTE-05 modular-composition
      backend -- the discard is compatible, but by the identical mechanism
      already priced and already exercised without success.
    test_result_c4: >-
      Would be genuinely lossy relative to a full symbolic system
      representation, but fails the "discarded compatibly with the
      target's operations" clause because forming the projection (the
      multiplication-operator matrix) requires a Groebner basis or point
      set the frozen setting's public construction does not supply -- the
      projection's domain of definition is not even reached from E, P, Q
      alone without first solving an equivalent problem.
    conclusion: >-
      No tracked object this round survives the lossy-projection test: C1/
      C3 are not lossy at all in this size regime (construction cost equals
      retention cost); C2 is lossy and compatibly discarded, but only via
      the already-costed ROUTE-05 mechanism, which fails the test's
      novelty clause rather than its algebraic-validity clause; C4 is
      lossy in principle but its discard is not reachable compatibly from
      the frozen setting's public data. This is an algebraic, zero-compute
      audit performed before any experiment was proposed; no experiment is
      proposed as a result.

