failure_localization:
  - symptom: candidate is only an assertion that a specialized circuit may exist
    localizes_to: L1_NAMED_TRIGGER_OBJECT
    interpretation: not a trigger; G1 fails
  - symptom: matrix construction requires a Groebner basis, normal-form basis, or known point set of the joint system
    localizes_to: L2_FROZEN_SETTING_TYPING
    interpretation: excluded witness; G2 fails (C4 this round, per arXiv:1805.09165 and arXiv:2202.09226)
  - symptom: matrix size or construction cost is dominated by deg(r_R) = Theta(B^3)
    localizes_to: L3_FULL_COST_ENUMERATION
    interpretation: matches an already-costed materialization; G3 fails (C1, C3 this round)
  - symptom: candidate supplies no algorithm beyond an already-costed route's own backend
    localizes_to: L3_FULL_COST_ENUMERATION
    interpretation: no independent cost enumeration; G3 fails (C2 this round)
  - symptom: coalesced or nonreduced fibre loses label or multiplicity
    localizes_to: L4_LINEAGE_MULTIPLICITY_FIBRES
    interpretation: G4 fails
  - symptom: output invariant under Q to -Q
    localizes_to: L5_Q_VS_MINUS_Q
    interpretation: sign channel absent; G5 fails
  - symptom: Q coefficient unknown or non-invertible
    localizes_to: L6_KNOWN_COEFFICIENTS_INVERTIBLE_Q
    interpretation: G6 fails
  - symptom: unranking needs full source or support enumeration
    localizes_to: L7_OUTPUT_SENSITIVE_SOURCE_UNRANKING
    interpretation: G7 fails
  - symptom: candidate's operation IS an already-costed route restated in different vocabulary
    localizes_to: L8_NOT_ALREADY_COSTED_ROUTE
    interpretation: 'already-costed route; G8 fails (C1/C3 match ROUTE-01/ROUTE-08''s materialization; C2 IS ROUTE-05; C4 generalizes ROUTE-02)'
  - symptom: candidate proves too much on a planted generic non-elliptic zero-dimensional system
    localizes_to: first purported P1553-structure lemma that fails to distinguish it
    interpretation: proof proves too much (method-ceiling nearby-object control); confirms none of C1-C4 typed the elliptic-specific structure
  - symptom: tracked object's construction cost equals or exceeds the object it is meant to compress
    localizes_to: lossy_projection_test, C1/C3
    interpretation: not a lossy projection in this size regime; disqualifies the candidate before any cost question arises
  - symptom: tracked object is lossy but its domain of definition requires an unreachable witness
    localizes_to: lossy_projection_test, C4
    interpretation: discarded incompatibly with the target's operations; disqualifies the candidate

stopping_rules:
  - Stop before implementation or experiment execution because this role has no approval to run either.
  - Stop admission if any of G1 through G8 remains undisclosed or false for a candidate.
  - Treat crashes, timeouts, missing dependencies, unavailable backends, rate-limited or 503 retrieval endpoints, and zero-result queries as infrastructure or literature-absence outcomes only, never as mathematical evidence.
  - Preserve all untested variants and the coordinate-aware P1553 remainder and dyadic unit-product routes when reporting a scoped failure.
  - A demonstrated cost or witness obstruction within one reading of a literature area (C1-C4 this round) is scoped exactly to the specific constructions read, not generalized to a claim about eigenvalue or structured-matrix methods in general.

