trigger_shapes:
  shape_a_remainder_transducer: >-
    A typed public P1553 target-local remainder transducer for r_R mod g_I:
    an exact computation, from E, P, and Q alone, of the remainder of the
    complete-chart intersection resultant r_R upon division by the
    squarefree label polynomial g_I, with no roots, factors, witnesses,
    support tables, or source enumeration, inside the B^(5/4) interface
    budget.
  shape_b_dyadic_unit_product: >-
    The exact dyadic subinterval unit-product interface: a public
    construction over the frozen mixed-radix deck/interval geometry that
    supplies the unit-product step the two-restriction and three-deck
    corrections leave as the surviving coordinate-aware interface. Not
    reached by any candidate this round: no Bezoutian, companion/Sylvester,
    u-resultant, or multiplication-operator construction found below
    references, is typed to, or bears on the deck/interval geometry at all;
    this trigger shape is recorded as unsupplied rather than searched
    against a specific literature match, exactly as in round eleven.

scope_components:
  component_a_bezoutian_and_dixon_hidden_variable:
    what_was_searched: >-
      Bounded network retrieval over Bezoutian-matrix construction and
      eigenstructure (its use for GCD/resultant computation, root counting
      by inertia, null-space structure), and the Dixon/hidden-variable
      resultant method that reformulates multiparameter and multivariate
      elimination problems as (generalized) polynomial eigenvalue problems,
      aimed at a public r_R mod g_I transducer.
    searches_performed:
      - query: 'all:"Bezoutian" AND all:"eigenvalue"'
        instrument: webfetch arXiv export API
        results: 0
      - query: 'all:"Bezout matrix"'
        instrument: webfetch arXiv export API
        results: 8 (representative subset read at abstract level; see objects_read)
      - query: 'all:"displacement structure" AND all:"Bezoutian"'
        instrument: webfetch arXiv export API
        results: 0
      - query: 'all:"Dixon resultant"'
        instrument: webfetch arXiv export API
        results: 7 (all read at abstract level)
      - query: 'abstract fetch of arXiv:2503.22887 (hidden-variable Dixon resultant, polynomial multiparameter eigenvalue problem)'
        instrument: webfetch arxiv.org/abs page
        results: 1 (abstract read; construction-detail question posed and answered as inconclusive at abstract level, recorded honestly below)
    objects_read:
      - id: BEZOUTIAN_STRUCTURE_PAPERS
        name: >-
          Bezoutian construction, null-space, and root-counting theory
          (Fiedler/Pinkus-style principal-minor results arXiv:1207.2434;
          basis-generalized null-space and GCD arXiv:1402.4952; Bezoutian
          zero-counting via quadrature domains arXiv:1805.03628; Newton-
          basis Bezoutian construction arXiv:2404.18117; ARMA/Fisher-
          information Bezoutian connection math/0505224; survey math/0601047;
          Bernstein-Bezout structured inversion arXiv:2005.03251).
        source_refs:
          - arXiv:1207.2434
          - arXiv:1402.4952
          - arXiv:1805.03628
          - arXiv:2404.18117
          - arXiv:math/0505224
          - arXiv:math/0601047
          - arXiv:2005.03251
        assessment: >-
          Every source confirms the Bezoutian Bez(f,g) is built directly
          from the coefficients of f and g (no roots needed a priori: this
          is the genuinely public part), and that det(Bez(f,g)) = Res(f,g)
          up to a normalizing leading-coefficient power, with rank/signature
          giving root-count and common-root information (Hermite-style).
          None of the eight sources treats a case where one input polynomial
          has degree Theta(B^3) (the frozen setting's r_R against g_I of
          degree Theta(B)): the Bezoutian of a degree-d1 and a degree-d2
          polynomial is a max(d1,d2) x max(d1,d2) matrix, so
          Bez(g_I, r_R) is a matrix of size Theta(B^3), dominated entirely
          by deg(r_R), and writing it down requires exactly r_R's
          Theta(B^3) coefficient vector -- the same object ROUTE-08's own
          node n2 (materialize_resultant_coefficients, declared cost
          exponent 3 in B) already prices as the already-costed
          materialization step. G1 present; G2 partially present (no roots
          needed, satisfying the "no witness" clause) but G3 absent (the
          matrix's very existence requires the Theta(B^3) coefficient
          data, exceeding the B^(5/4) online cap by construction, before
          any eigen-decomposition is even attempted); G8 absent (identical
          materialization cost to ROUTE-08's n2 node and to ROUTE-01's
          componentwise resultant).
      - id: DIXON_HIDDEN_VARIABLE_EIGENVALUE
        name: >-
          Hidden-variable tensor Dixon resultant method for the polynomial
          multiparameter eigenvalue problem (arXiv:2503.22887) and adjacent
          Dixon-resultant applications (index reduction of DAEs
          arXiv:1504.04977; camera-pose Dixon resultant arXiv:1901.09364;
          DixonEDF bifurcation analysis arXiv:2204.12437; parametric-system
          discriminant varieties via Dixon and iterated resultants
          arXiv:2201.13189).
        source_refs:
          - arXiv:2503.22887
          - arXiv:1504.04977
          - arXiv:1901.09364
          - arXiv:2204.12437
          - arXiv:2201.13189
        assessment: >-
          arXiv:2503.22887's abstract states the method "transforms a
          [polynomial multiparameter eigenvalue problem] into one or more
          univariate polynomial eigenvalue problems," i.e. it reduces a
          MULTIVARIATE elimination problem to a univariate one via a Dixon/
          hidden-variable resultant, then reads solutions off that
          univariate polynomial's companion-matrix eigenvalues -- so it is
          itself built from a resultant matrix of the same
          dimension-dominated-by-the-largest-input-degree shape as the
          Bezoutian case above, and it does not reduce the P1553 setting's
          problem (already reduced to univariate g_I and r_R) to anything
          new: the frozen setting has already performed the multivariate-to-
          univariate elimination that Dixon/hidden-variable methods exist to
          perform. Applying it here would mean forming a resultant matrix
          between g_I and r_R of size dominated by deg(r_R) = Theta(B^3),
          identical to the Bezoutian case. G1 present; G2 not reached
          (nothing new for an already-univariate pair); G3 absent (same
          Theta(B^3) size); G8 absent (restates ROUTE-01/ROUTE-08 in
          hidden-variable language).
    internal_prior_art_this_round: >-
      inputs/idea_generation_20260718_batch3.md (candidate A1,
      "Displacement-structured (Toeplitz-like) Bezoutian membership
      backend," read in full this round) proposed, for a DIFFERENT
      elliptic-curve setting (the m=5 Semaev serial-3-sum split, gate
      RT-1476), exactly this round's Bezoutian/displacement mechanism:
      exploit that the Sylvester/Bezout matrix of a summation-polynomial
      eliminant has O(1) displacement rank under the Kailath-Sayed
      operator to run a superfast GKO structured solve instead of dense
      resultant materialization. That candidate's own recorded "likely
      fatal obstruction" is that superfast structured methods reduce
      arithmetic AT FIXED DEGREE but not the eliminant DEGREE itself, and
      that if the degree is generically Theta(q) (the generic Bezout
      count), the structured speedup is arithmetically real but
      asymptotically inert. The companion internal ledger record
      H-SUBRES-001 / EXP-RT1476-001 (formerly H-RT1476-001, read in full
      this round) MEASURED this exact quantity on real sampled ordinary
      prime-order curves at three toy sizes (10, 16, 24 bits) and found
      the backward eliminant degree tracks 8*L^3 exactly (the generic
      Bezout count) with beta_deg pooled 0.5985 against a success
      threshold of beta_deg < 0.3 -- falsification condition F4 ("the
      measured backward-state size agrees with the generic Theta(L^3)
      count... no collapse is present at all") was met on every tested
      size and seed, and H-SUBRES-001 status is weakened. This is not
      direct evidence about the P1553 g_I/r_R setting (different RQ,
      different construction, toy scale only, an admitted "not
      generalizable beyond this exact test boundary" result per its own
      interpretation_limits) but it is the program's own closest empirical
      data point on whether elliptic-curve-derived elimination degrees
      collapse below their generic Bezout bound, and it measured NO
      collapse. It is cited here as internal corroborating context for the
      G3/G8 verdict above, not as a proof that r_R behaves the same way.
    resource_check_answer:
      examined: true
      reading_found: true
      what_was_examined: >-
        knowledge/ grepped (case-insensitive) for "Bezoutian", "Bezout
        matrix", "Stetter", "Auzinger", "u-resultant", "multiplication
        operator", "companion matrix", "Sylvester matrix", "Dixon
        resultant"; inputs/ grepped for the same terms; H-CREP-001.yaml and
        EXP-CREP-001/specification.yaml re-read for the exact g_I/r_R/z_R
        definitions and the eight frozen routes' descriptions and backend
        citations; H-SUBRES-001.yaml and experiments/EXP-RT1476-001/
        analysis.md read in full after the inputs/ grep surfaced them.
      answer: >-
        knowledge/ carries one off-target hit, KN-LIT-3436 (recursive MDS
        diffusion-layer construction via companion matrices for block
        ciphers -- symmetric-cipher design, unrelated to resultants or
        ECDLP); zero files match "P1553", "complete-chart", "g_I", or "r_R"
        (consistent with prior rounds). inputs/ carries genuine, on-topic
        internal prior art: idea_generation_20260718_batch3.md's A1
        candidate (Bezoutian/displacement-structured membership backend,
        Kailath-Sayed lineage, for the RT-1476 Semaev setting) and
        idea_generation_20260718_batch5.md's POWERPROJ-A1 candidate
        (quotient-algebra multiplication-operator power sums for
        membership, also for the RT-1476 setting), both summarized under
        internal_prior_art_this_round and component_d below; and the
        ledger-recorded, machine-verified H-SUBRES-001/EXP-RT1476-001
        result measuring no eliminant-degree collapse in that adjacent
        setting. Neither internal object supplies a P1553-typed g_I/r_R
        construction; both are recorded as internal overlap in
        source-novelty-audit.yaml.

  component_b_companion_sylvester_pencils_modular_composition:
    what_was_searched: >-
      Bounded network retrieval over companion-matrix and Sylvester-matrix
      pencils for resultant/remainder computation, aimed at whether
      evaluating r_R at the companion matrix of g_I (a standard way to
      compute a polynomial remainder via a matrix pencil, since any monic
      g_I satisfies g_I(C_{g_I}) = 0 by the Cayley-Hamilton-style property
      of the companion matrix, so r_R(C_{g_I}) determines r_R mod g_I)
      supplies a public transducer distinct from the already-costed routes.
    searches_performed:
      - query: 'all:"companion matrix" AND all:"resultant"'
        instrument: webfetch arXiv export API
        results: 20 (all read at abstract level)
      - query: 'all:"Sylvester matrix" AND all:"pencil"'
        instrument: webfetch arXiv export API
        results: 1 relevant, others off-topic Sylvester-equation numerics
      - query: 'all:"modular composition" AND all:"companion matrix"'
        instrument: webfetch arXiv export API
        results: 0
    objects_read:
      - id: COMPANION_MATRIX_RESULTANT_LITERATURE
        name: >-
          Companion-matrix resultant/Smith-form and Newton-basis
          subresultant papers (arXiv:2212.03422, "Subresultants of Several
          Univariate Polynomials in Newton Basis," using a matrix derived
          from the companion matrix; arXiv:1908.07331, expressing a
          determinantal divisor of f(companion matrix) as a resultant), and
          eighteen further root-localization/numerical-range companion-
          matrix papers assessed as off-target (root bounding, Toeplitz/
          Hankel relations, similarity classes, numerical ranges -- none
          constructs a public remainder transducer).
        source_refs: [arXiv:2212.03422, arXiv:1908.07331]
        assessment: >-
          The retrieved literature confirms the standard fact this
          candidate relies on (a polynomial evaluated at a companion matrix
          reduces modulo that matrix's characteristic/minimal polynomial,
          which is exactly polynomial remaindering restated as a matrix
          identity) but supplies no algorithm for evaluating a
          Theta(B^3)-degree polynomial (r_R) at a Theta(B)-sized companion
          matrix (of g_I) other than the standard modular-composition
          approaches (repeated squaring of the companion matrix combined
          with a Horner-style or Brent-Kung baby-step/giant-step evaluation)
          -- which is precisely the Brent-Kung / Kedlaya-Umans lineage
          EXP-CREP-001's frozen route set already names as
          ROUTE-05-modular-composition. G1 present (the companion-matrix
          remainder identity is a real, classical, retrieved-and-confirmed
          fact); G2 present in the narrow sense that no roots of g_I or r_R
          are needed, only coefficients; G3 absent (no sub-B^(5/4)
          enumeration is supplied or implied -- the natural algorithm for
          evaluating r_R at a Theta(B)-sized matrix pencil is exactly
          modular composition, whose cost is the frozen setting's own named
          ROUTE-05 bound); G8 absent, and explicitly and precisely so: this
          candidate is not merely adjacent to ROUTE-05, it IS ROUTE-05
          under a matrix-pencil name -- "evaluate r_R at the companion
          matrix of g_I" and "compute r_R mod g_I via modular composition"
          are the same computation, since the companion-matrix evaluation
          IS how modular composition is classically defined and implemented
          (Brent-Kung 1978; Kedlaya-Umans 2011, the exact citation already
          in H-CREP-001's structural_ingredients for ROUTE-05).
    lossy_projection_test: >-
      The tracked object here would be "the Theta(B) x Theta(B) matrix
      r_R(C_{g_I})," or equivalently its first column. This is a genuinely
      lossy projection of r_R's full Theta(B^3) coefficient vector (it
      retains only Theta(B) numbers). But whether it is discarded
      COMPATIBLY with the frozen setting's operations is exactly the open
      modular-composition question ROUTE-05 already poses and has not
      resolved for this setting: the standard algorithms for computing
      r_R(C_{g_I}) without first materializing r_R's coefficients (Brent-
      Kung, Kedlaya-Umans) are the ROUTE-05 backend itself, already
      exercised without success. Framing the same computation as
      "eigenvalues of a companion-matrix pencil" changes notation, not the
      underlying compatible-discard mechanism, so this candidate fails the
      lossy-projection test's novelty clause: it is a change of vocabulary
      for the already-costed route, not a new projection.

  component_c_u_resultants:
    what_was_searched: >-
      Bounded network retrieval over the u-resultant method (multivariate
      elimination via introducing a generic linear form u and computing the
      resultant of the system together with that linear form, whose roots
      recover the system's solutions after back-substitution), aimed at
      whether it supplies a public g_I/r_R-analogous construction distinct
      from the already-costed multivariate-resultant routes.
    searches_performed:
      - query: 'all:"u-resultant"'
        instrument: webfetch arXiv export API
        results: 20 (1 relevant after filtering false positives on the letter "u"; see objects_read)
    objects_read:
      - id: U_RESULTANT_TORIC
        name: >-
          Binomial variant of the u-resultant via toric geometry
          (arXiv:math/9702221, "Some New Applications of Toric Geometry").
        source_refs: [arXiv:math/9702221]
        assessment: >-
          The u-resultant is, by construction, a technique for reducing a
          MULTIVARIATE zero-dimensional elimination problem to a single
          univariate resultant via a generic linear projection; it exists
          to produce exactly the kind of object (a univariate polynomial
          whose roots parametrize the solution set) that the frozen P1553
          setting already possesses in g_I and r_R. There is no
          multivariate elimination step left for a u-resultant to perform
          in this setting: applying u-resultant machinery to g_I and r_R
          (already univariate) would mean constructing a resultant of two
          univariate polynomials via an auxiliary generic linear form in an
          artificially reintroduced second variable, which reduces to an
          ordinary bivariate-to-univariate resultant computation over
          objects of degree Theta(B) and Theta(B^3) -- the same
          Theta(B^3)-dominated construction as component (a) above, i.e.
          ROUTE-01/ROUTE-08 territory again, now via an unnecessary detour
          through a second variable. The retrieved paper's own toric/sparse
          framing (a "binomial variant... exploiting sparsity") does not
          apply, because no sparsity bound on r_R is established in the
          frozen setting (the same absent precondition round eleven found
          for sparse-interpolation candidates). G1 present; G2 absent (no
          new elimination step remains to perform; introducing one is
          circular); G3 absent; G8 absent (collapses to ROUTE-01/ROUTE-08's
          Theta(B^3) construction, reached by an unneeded extra variable).
    resource_check_answer:
      examined: true
      reading_found: false
      what_was_examined: >-
        knowledge/ and inputs/ grepped for "u-resultant"; H-CREP-001.yaml
