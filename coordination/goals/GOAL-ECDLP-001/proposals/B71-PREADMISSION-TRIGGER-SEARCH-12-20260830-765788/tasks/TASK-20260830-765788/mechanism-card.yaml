  disjoint_scope_statement: >-
    This round's scope is explicitly disjoint from rounds seven through
    eleven. Round seven searched subresultant/PRS recurrences, modular-
    composition circuit borders, fast-remainder/Kedlaya-Umans arithmetic,
    Semaev/Weil-descent index calculus, combinatorial unranking, and
    transposed/multipoint evaluation. Round eight read the withdrawn round-
    seven near-miss in full text and searched function-field, algebraic-
    geometry, and transfer-theoretic circuit identities. Round nine searched
    structured, sparse, triangular, and black-box multivariate-resultant
    theory (Canny-Emiris/mixed-subdivision, Newton-polytope mixed-volume
    methods for computing resultants) and explicit intersection-theoretic
    computation -- a distinct literature from this round's eigenvalue/
    structured-matrix scope, which concerns the SPECTRAL structure of a
    single fixed matrix (Bezoutian, companion, Sylvester, multiplication
    operator) rather than sparse elimination-matrix constructions. Round ten
    searched normal-form computation for triangular structures and closed
    the deck-local mixed-radix identity sub-avenue over the two named frozen
    P1553 mixed-radix correction packets (not reopened here). Round eleven
    searched algebraic coding theory (syndrome decoding, error-locator
    construction) and sparse polynomial/exponential-sum reconstruction, and
    collapsed both onto ROUTE-04 (not reopened here). This round searches a
    genuinely new area: the eigenstructure of Bezoutian, companion,
    Sylvester, and multiplication-operator matrices for polynomial-system
    solving (Stetter-Moller, Auzinger-Stetter), and u-resultants for
    multivariate elimination via a single linear form. The seventh- through
    eleventh-round candidate sets are the earlier rounds'; this round does
    not re-derive them.
