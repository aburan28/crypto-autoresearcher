research_question: >-
  Does any actual recurrence, circuit identity, or retrieved theorem from
  eigenvalue and structured-matrix methods for polynomial systems --
  Bezoutian-matrix eigenstructure, companion-matrix and Sylvester-matrix
  pencils, u-resultants (multivariate elimination via a single linear
  form), and multiplication-operator eigenvalue methods (the Stetter-Moller
  theorem and Auzinger-Stetter matrices, which recover a zero-dimensional
  system's solutions from the eigenvalues of multiplication-by-coordinate
  operators on the quotient ring) -- instantiate to the frozen P1553
  elliptic setting as (a) a typed public target-local remainder transducer
  for r_R mod g_I, or (b) the exact dyadic subinterval unit-product
  interface, passing every item of the frozen pre-admission gate, by
  exploiting the eigenstructure of a public multiplication operator or
  structured matrix built from E, P, and Q alone?

