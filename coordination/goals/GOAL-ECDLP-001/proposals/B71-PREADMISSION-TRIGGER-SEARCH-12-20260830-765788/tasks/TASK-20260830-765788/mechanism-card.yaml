decision_summary: >-
  The twelfth trigger search was performed over a scope explicitly disjoint
  from rounds seven through eleven: eigenvalue and structured-matrix
  methods for resultant and polynomial-remainder computation -- Bezoutian-
  matrix eigenstructure and the Dixon hidden-variable resultant (C1),
  companion-matrix and Sylvester-matrix pencils restating modular
  composition (C2), u-resultants for multivariate elimination via a single
  linear form (C3), and multiplication-operator eigenvalue methods --
  Stetter-Moller theorem and Auzinger-Stetter matrices (C4) -- via the
  arXiv export API, which answered every query directly. C1 and C3
  construct a matrix whose size is dominated by deg(r_R) = Theta(B^3),
  matching exactly the already-costed materialization cost of ROUTE-08's
  own dependency-graph node and of ROUTE-01's componentwise resultant. C2
  is shown to BE ROUTE-05 (modular composition, Brent-Kung/Kedlaya-Umans
  lineage) under matrix-pencil vocabulary, not merely adjacent to it. C4 is
  shown to generalize ROUTE-02 (quotient-ring resultants) precisely, and
  independently fails G2: two retrieved sources (arXiv:1805.09165,
  arXiv:2202.09226) confirm that building an Auzinger-Stetter/multiplication
  matrix requires a Groebner basis or an already-known point set before
  construction, exactly the witness circularity every prior round's near-
  misses have failed on. Internal prior art from a different elliptic
  setting (idea_generation_20260718_batch3.md's displacement-Bezoutian
  candidate and batch5.md's POWERPROJ-A1 multiplication-operator candidate,
  both from 2026-07-18, neither ever promoted to a ledger hypothesis) self-
  discloses the same two obstructions independently, and the ledger-
  recorded H-SUBRES-001/EXP-RT1476-001 measurement (a different hypothesis,
  toy scale, not generalizable) found no eliminant-degree collapse in a
  closely analogous elliptic setting, recorded as corroborating context.
  Every candidate considered (C1-C4) is judged item-by-item against the
  frozen gate (G1-G8); none passes every item. The honest disposition is
  scoped_no_candidate, with every broader route preserved, the mandatory
  G8 comparison against ROUTE-08 discharged (and sharpened to name ROUTE-02
  and ROUTE-05 as the more precise correspondents for C4 and C2
  respectively), and no B71, experiment, evidence, attack, SOTA, or
  breakthrough claimed.
