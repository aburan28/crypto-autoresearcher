controls_before_belief:
  screen_is_its_own_control: >-
    For every candidate carrying G1, the screen checked (i) that the
    computation is genuinely public (no ECDLP-equivalent information hidden
    behind eigenvalue/matrix-pencil/Groebner-escalier language -- the
    Groebner-basis-required-first pattern for multiplication operators is
    exactly this kind of hidden dependency, made explicit by two independent
    retrieved sources rather than accepted at face value), (ii) the
    quantifier order (all objects fixed before any witness observed), and
    (iii) the already-costed-route exclusion as a named, route-specific
    check (not a generic "shares lineage" gesture).
  public_computation_check: >-
    C1's and C2's constructions are genuinely public in the narrow sense
    that neither requires roots or factors, but both require either the
    full Theta(B^3) coefficient vector of r_R (C1) or an equivalent
    Kedlaya-Umans-lineage modular-composition computation (C2) -- neither
    hides a witness so subtly it would pass a first read; the dependency is
    a direct cost/route-identity fact stated in this round's own analysis.
    C3 requires no new elimination step at all in a setting that has
    already performed the univariate reduction u-resultants exist to
    produce. C4's dependency is stated directly in its own retrieved
    sources: "a Groebner basis must first be computed" and matrices built
    "with respect to... the ideal of the points" are explicit
    already-known-witness statements, not implications requiring
    inference.
  quantifier_order_check: >-
    In every candidate the general algorithm or theorem is fixed
    independently of any particular instance, but none types the frozen
    P1553 objects (rings, bases, public g_I and r_R construction) before a
    witness-equivalent input (a Groebner basis for C4; the full r_R
    coefficient vector for C1/C3; an unresolved modular-composition oracle
    for C2) is required.
  already_costed_route_exclusion: >-
    Named, route-specific check run per candidate: C1 matches ROUTE-08's
    own materialization node (n2, cost exponent 3) and ROUTE-01's
    componentwise construction; C2 IS ROUTE-05 (modular composition) under
    matrix-pencil vocabulary; C3 collapses to ROUTE-01/ROUTE-08 via an
    unneeded extra variable; C4 generalizes ROUTE-02 (quotient-ring
    resultants) precisely, independent of its separate G2 circularity. This
    discharges the dispatch's mandatory G8 comparison against ROUTE-08 for
    every structured-matrix candidate, and additionally identifies the more
    precise ROUTE-02 and ROUTE-05 correspondences the dispatch's framing
    hypothesis (displacement-representation lineage only) did not name.

lossy_projection_test_summary: >-
  C1/C3's tracked object (the Bezoutian or u-resultant matrix built from
  g_I and r_R's coefficients) is genuinely lossy relative to r_R's full
  Theta(B^3) coefficient data in principle, but its construction requires
  that same Theta(B^3) data as an input, so nothing is discarded before the
  cost is already paid -- it fails the lossy-projection test at the
  "genuinely lossy" clause for the P1553 setting's actual size regime. C2's
  tracked object (the Theta(B)-sized matrix r_R(C_{g_I}) or its first
  column) IS genuinely lossy, but it is discarded compatibly with the
  frozen setting's operations only via the already-costed ROUTE-05 modular-
  composition backend -- it fails the test's novelty clause, not its
  algebraic-validity clause: this is a change of vocabulary for an
  already-costed compatible discard, not a new one. C4's tracked object
  (the multiplication-operator eigenvalues) would be lossy relative to a
  full symbolic system representation, but the discard is not compatible
  with the frozen setting's operations because forming the projection
  requires a Groebner basis the frozen setting's public construction does
  not supply -- it fails the test's "discarded compatibly with the
  target's operations" clause, exactly as round eleven's sparse-
  interpolation candidate did for a different reason (absent sparsity
  bound rather than absent Groebner basis).

