review_protocol_amendment:
  id: CORR-20260824-e1164f
  packet_id: QEC-EXACT-ADD-PREADMISSION-20260824-4c797e
  review_plan_id: REVIEW-PLAN-QEC-EXACT-ADD-4c797e
  version_from: review-protocol-1
  version_to: review-protocol-2
  filed_at: '2026-08-24'
  filed_by: coordinator
  status: approved_pre_rederivation
  reason: >-
    The combined independence checker correctly reports one failure: the
    re-deriver assigned by review-protocol-1, TASK-20260824-8252e1, read the
    eight paths in blind_rederivation.blind_from after sealing its blind
    derivation. That Reviewer honestly followed the phased plan as written,
    but the checker enforces a stronger session-level invariant: the assigned
    re-deriver must never read any blind_from path. The phased plan is therefore
    incompatible with the mechanical independence gate. Existing artifacts and
    verdicts are not altered.
  changes:
  - id: C1
    field: review_plan.blind_rederivation.assigned_to
    kind: pre_run_independence_repair
    prior_value: TASK-20260824-8252e1
    corrected_value: TASK-20260824-b16b99
    exact_scope: >-
      TASK-20260824-8252e1 remains the semantic Reviewer and sole J1 owner. Its
      completed phased review remains immutable and is neither relabelled nor
      used as the mechanically blind attestation. Fresh
      TASK-20260824-b16b99 owns no J1-J3 joint and supplies only the blind
      rederivation agreement/disagreement attestation.
  - id: C2
    field: dispatch_queue independent blind-rederivation task and ledger dependency
    kind: additive_task
    prior_value: absent
    corrected_value: TASK-20260824-b16b99
    exact_scope: >-
      The fresh task depends only on snapshot TASK-20260824-d22dd0, runs in an
      independent fork/session under review-adversarial xhigh with fallback and
      degradation forbidden, and has a read scope that excludes all eight
      producer blind_from paths and all sibling review artifacts. The ledger
      task must wait for and archive this new attestation.
  affected_completed_reviews:
  - TASK-20260824-8252e1
  affected_rederivation_runs: []
  approved_by: coordinator
  approval_basis: >-
    This amendment is committed before TASK-20260824-b16b99 is launched. It
    responds to a mechanical independence-protocol incompatibility, not to the
    substance of the new rederivation, which does not yet exist.
  governing_rule: >-
    Review-protocol version 2 assigns blind rederivation solely to
    TASK-20260824-b16b99. The task must attest joints_owned: [],
    blind_from_respected: true, exact sources read, fork/session independence,
    and only agreement, disagreement, or inconclusive status for the declared
    quantity. It may not read producer or sibling-review artifacts.
  scientific_effect: >-
    None. No existing review artifact, J1-J3 verdict, producer observation,
    snapshot binding, hypothesis, goal, B70 custody, B71 gate, resource claim,
    speedup, novelty, support, completion, or breakthrough status changes.
