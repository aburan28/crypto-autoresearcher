review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-QEC-EXACT-ADD-4c797e
  goal_id: GOAL-ECDLP-001
  batch_id: null
  packet_id: QEC-EXACT-ADD-PREADMISSION-20260824-4c797e
  recorded_at: '2026-08-24'
  coordinator_prior: >-
    The totalized generic core and four-way exceptional routing are expected to
    be algebraically repairable. The likely breaks are implementation-level:
    a flag or qROM target remains live, an address-dependent equality is not
    coherently uncomputed, the disabled core is tested only on curve points, or
    added equality/table work invalidates an exact width or gate coefficient.
    The expected disposition is REVISE unless exact liveness and deterministic
    controls close all four risks. Even a clean result warrants only a scoped
    correction packet and sibling-goal recommendation, not an ECDLP breakthrough.
  claim_under_review: >-
    Whether one concrete implementation realizes an exact complete fixed and
    signed-window affine translation on the stated secp256k1 prime-subgroup code
    space and supports only the leading bounds 3n+O(log n) logical width and the
    source algorithm's asymptotic gate order. No exact 835-qubit count, exact
    logarithmic coefficient, exact Toffoli coefficient, speedup, algorithmic
    advance, P1553 progress, novelty, support, or breakthrough is under review.
  joints:
  - joint: J1-total-arithmetic-generic-algebra-exception-routing-and-coherent-cleanup
    assigned_to: TASK-20260824-8252e1
    role: reviewer
    attack_plan: >-
      Blindly rederive the curve-law algebra, totalized e=0 identity, nonzero u
      and m promises, four exceptional maps, collision-free post-map cleanup,
      and block-diagonal superposed-address semantics from blind-statement.yaml.
      Freeze that derivation before reading producer artifacts, then compare the
      implementation schedule with it and inspect every identity, sign, r>3,
      address, and cleanup assumption.
    expected_break: >-
      One total wrapper is not reversible on X=0; the core is not identity on an
      invalid bitstring; an exceptional output collides; flags are uncomputed
      from pre-map rather than post-map state; or qROM/address entanglement remains.
  - joint: J2-implementation-receipt-exhaustive-controls-and-independent-reproduction
    assigned_to: TASK-20260824-47b6ea
    role: validator
    attack_plan: >-
      Reproduce the frozen deterministic test command from the snapshot, verify
      source and patch bindings, enumerate tiny odd-prime subgroups across every
      accumulator/address/digit, exhaust e=0 over all field bitstrings, check
      O/A/-A/-2A and zero digit, inspect scratch cleanup, and independently
      compare classical basis permutations with the circuit schedule including
      a superposed-address statevector control where bounded.
    expected_break: >-
      Tests cover operation order but not semantics, skip invalid bitstrings or
      zero digits, reuse producer-generated expected outputs, miss dirty ancilla,
      fail to bind the upstream commit, or cannot reproduce the receipt.
  - joint: J3-peak-liveness-added-gates-qrom-cost-scope-and-proves-too-much
    assigned_to: TASK-20260824-fb2fe2
    role: red-team
    attack_plan: >-
      Independently reconstruct peak liveness and every added equality, zero
      test, flag, qROM/table access, mask, uncompute, and control cost. Challenge
      reuse of S/A/z bits, ensure no hidden n-bit register or history survives,
      run the omit-totalization and omit-precleanup known-false controls, and
      test whether the same argument incorrectly certifies a non-total or dirty
      circuit. Police the non-batch, no-speedup, no-835, no-breakthrough scope.
    expected_break: >-
      The leading 3n term hides another n-bit live register, table access is
      omitted, flag lifetime crosses the arithmetic peak, a known-false circuit
      passes, or asymptotic preservation is promoted into an exact count/speedup.
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
    - the source-like core with ordinary partial IDiv/IMul and no X=0 totalization
    - the four-way router with flags cleared from pre-map rather than unique post-map outputs
    - an enabled-only test suite with no zero digit
    - a curve-point-only disabled test suite that omits invalid field bitstrings
    - a classical address loop that never represents a coherent superposed address
    failure_signature: >-
      Any proof or test that also certifies one of these known-defective objects
      is insufficient for the exact-complete or coherent-cleanup claim.
  blind_rederivation:
    required: true
    assigned_to: TASK-20260824-8252e1
    quantity: >-
