    verdict: breaks
    analysis: >-
      Basis-permutation correctness plus clean work would prove coherent action
      by linearity for an actual reversible address-controlled schedule. That
      schedule is absent. candidate_translate accepts an ordinary integer
      address and performs Python table indexing; assigning and clearing two
      Scratch fields is not a quantum qROM construction. The Qiskit patch's
      append_exact_fixed_addition has no address register and takes one
      compile-time addend. CoherentSignedWindowBackend is only a Protocol;
      SignedWindowCompletionPlan lists relation names and validate_backend
      merely calls assert_targets_clean. No method builds or invokes addressed
      comparisons, constants, masks, loads, or unloads. Consequently the
      claimed concrete signed-window direct sum and absence of residual
      address/qROM entanglement are not implemented or established.
