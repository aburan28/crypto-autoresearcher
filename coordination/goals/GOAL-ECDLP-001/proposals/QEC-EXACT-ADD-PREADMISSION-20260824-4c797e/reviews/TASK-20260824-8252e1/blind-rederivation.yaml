    reason: After an exceptional map the accumulator no longer equals its preimage, so recomputing the pre-map predicate cannot toggle the stored flag back to zero without forbidden history.
  - object: enabled-only test suite with no zero digit
    result: not_certified
    reason: It never exercises e=0 and would miss the explicit Y-centering residue derived above.
  - object: curve-point-only disabled test suite omitting invalid field bitstrings
