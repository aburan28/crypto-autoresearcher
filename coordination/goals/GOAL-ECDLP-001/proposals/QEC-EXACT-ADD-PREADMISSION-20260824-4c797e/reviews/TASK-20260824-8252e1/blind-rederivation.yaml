    reason: Exact reversible semantics are claimed on the full encoded field-pair space; a curve-only domain cannot establish that obligation.
  - object: classical address loop that never represents a coherent superposed address
    result: not_certified_unless_full_schedule_and_cleanup_are_proved
    reason: Per-address classical outputs suffice by linearity only when they cover the actual reversible qROM schedule and verify an address-independent clean final workspace; a loop that bypasses those registers does not.
