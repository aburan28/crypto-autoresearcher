  total_interface_derivation:
    total_idiv:
      derived_map: >-
        D_X(Y)=Y/X for X nonzero and D_0(Y)=Y. For X=0, the
        zero-test bit changes the preserved divisor word from 0 to 1 before
        the partial primitive and restores it afterward; for X nonzero it
        changes nothing. The restored X recomputes the zero predicate and
        clears z.
      reversibility: >-
        For fixed nonzero X, multiplication by X is the inverse permutation;
        for X=0 the map is the identity. The wrapper is therefore a total
        permutation provided the wrapped primitive preserves X and returns its
        declared clean workspace.
    total_imul:
      derived_map: >-
        M_X(Y)=X*Y for X nonzero and M_0(Y)=Y, using the same
        0-to-1 wrapper and restored-X uncomputation of z.
      reversibility: >-
        For fixed nonzero X, division by X is the inverse permutation; for
        X=0 the map is the identity.
    composition_identity: >-
      M_X(D_X(Y))=Y for every field pair (X,Y), including X=0.
    wrapper_limitations:
    - Correctness assumes the bit representation maps the all-zero word to 0 and toggling its least-significant bit maps it to the field element 1.
    - The statement supplies no primitive gate schedule, so workspace lifetime and exact cost are not derivable here.
  generic_affine_derivation:
    definitions:
      R: (x,y)
      A: (a,b)
      u: x-a
      v: y-b
      lambda: v/u
      x3: lambda^2-x-a
      u3: x3-a=lambda^2-u-3a
      m: u-lambda^2+3a=-u3
    curve_law: >-
      The line through R and A has slope lambda=(y-b)/(x-a). Its translated
      point has x-coordinate x3=lambda^2-x-a and y-coordinate
      y3=lambda*(a-x3)-b=-lambda*u3-b.
    enabled_schedule_trace:
    - after centering: (X,Y)=(u,v)
    - after Total-IDiv with u nonzero: (X,Y)=(u,lambda)
    - after the two enabled X updates: (X,Y)=(m,lambda)
    - after Total-IMul with m nonzero: (X,Y)=(m,-lambda*u3)
    - after enabled negation and unconditional X uncentering: (X,Y)=(x3,-lambda*u3)
    - after the final enabled Y subtraction: (X,Y)=(x3,-lambda*u3-b)=R+A
    enabled_formula_verdict: holds under the derived nonzero promises
  disabled_all_bitstring_derivation:
    schedule_trace:
    - after unconditional centering: (X,Y)=(u,y-b)
    - after Total-IDiv: (X,Y)=(u,D_u(y-b))
    - the enabled X updates are skipped
    - after Total-IMul: (X,Y)=(u,M_u(D_u(y-b)))=(u,y-b), including u=0
    - the enabled X negation is skipped and unconditional X+a restores x
    - the final Y-b update is skipped because it is controlled by e
    actual_disabled_map: (x,y) -> (x,y-b)
    claimed_identity_verdict: breaks
    counterexample_family: >-
      Every field pair is shifted by -b in its Y word. Moreover b is nonzero:
      b=0 would make the nonzero point A equal to -A and give it order 2,
      contradicting membership in a prime-order subgroup with r>3. Thus the
      stated disabled schedule is never the identity.
    minimal_statement_level_repairs:
    - Control the initial Y<-Y-b centering by e; this preserves the enabled trace and makes the disabled composition Total-IMul o Total-IDiv cancel on the original Y.
    - Alternatively provide a different reversible schedule with an explicit disabled Y uncentering; its enabled sign and constant arithmetic must be rederived independently.
    consequence: >-
      The stated zero-digit obligation and the candidate construction as
      written cannot be certified, independently of any producer implementation.
  nonzero_promises:
    u:
      proof: >-
        On the curve over an odd field, x(R)=a implies y(R)=b or y(R)=-b, so
        R=A or R=-A. Both are excluded when effective enable is one. Hence
        u=x-a is nonzero.
      verdict: holds
    m:
      proof: >-
        m=-u3=a-x(R+A). On the generic domain R is not -A, so R+A is an
        affine curve point. If m=0, then x(R+A)=a and therefore R+A=A or
        R+A=-A. Translation by -A gives R=O or R=-2A, both excluded by the
        effective-enable router. Hence m is nonzero.
      verdict: holds
  exceptional_router_derivation:
    translation: tau_A(R)=R+A
    exceptional_preimages:
    - O
    - A
    - -A
    - -2A
    exceptional_images:
    - A
    - 2A
    - O
    - -A
    maps:
      O: A
      A: 2A
      -A: O
      -2A: -A
    distinctness_proof: >-
      A has order r because it is nonzero in a prime-order subgroup. Equality
      among A, 2A, O, and -A would imply kA=O for some nonzero k in
      {1,2,3}; none is divisible by prime r>3. The four outputs are distinct.
    cleanup_proof: >-
      Translation by A is injective. Therefore the complement of the four
      exceptional preimages maps to the complement of their four images.
      Masked post-map equality with the branch's unique image toggles exactly
      the one live branch flag and cannot toggle on an effective-enable output.
      This proof requires the equality constant and mask to be selected by the
      same retained address/sign block as the pre-map flag.
    verdict: holds as an abstract router, conditional on implementing post-map masked equality and clean address-selected constants
  coherent_address_derivation:
    proof: >-
      Let h denote the retained computational-basis address/sign block and let
      T_h be the clean basis permutation on the accumulator proved for its
      nonzero A_h. If every qROM target, equality bit, branch flag, sign/work
      bit, and arithmetic scratch register begins and ends in the same clean
      state, the full circuit is U=sum_h |h><h| tensor T_h. Linearity then
      gives the required coherent action on every superposition of h without
      leaving address-dependent garbage.
    necessary_conditions:
    - the address and sign convention is frozen and retained throughout each controlled block
    - all address-selected constants and masks are computed by a reversible qROM/table schedule and are uncomputed
    - every per-block accumulator map is a permutation on the full declared code space
    - all work registers return to one address-independent clean state
    nuance: >-
      Explicit statevector simulation is not mathematically necessary if full
      basis-state permutation correctness and clean-workspace restoration are
      proved for the actual reversible schedule. A classical loop that bypasses
      that schedule or omits its work registers cannot establish the premise.
    verdict: conditional; the statement gives the proof criterion but no implementation schedule to check
  symbolic_peak_live_expression:
    symbols:
      n: field-register width, here 256
      q: retained address-register width
      s: retained sign and digit work bits beyond the enable bit
      F_t: live exceptional flags at stage t, with 0<=F_t<=4
      epsilon_t: one if a separately materialized effective-enable bit is live at stage t, else zero
      z_t: one only while a total arithmetic wrapper zero-test bit is live
      Q_t: address-selected qROM target and qROM-cleanup workspace live at stage t
      E_t: equality-test workspace live at stage t
      M_t: XOR-mask workspace live at stage t
      A_t: arithmetic-primitive clean workspace live at stage t, excluding the two accumulator registers and z
    expression: >-
      W_peak = 2n + q + 1_enable + s +
      max_t(F_t + epsilon_t + z_t + Q_t + E_t + M_t + A_t).
    stage_constraints:
    - During Total-IDiv or Total-IMul, z_t=1 and A_t is the corresponding primitive workspace; flags may remain live across the core.
    - During exceptional equality and masking, E_t or M_t and the address-selected Q_t may overlap the still-live flags.
    - Any n-bit constant or history register retained concurrently must appear in Q_t, E_t, M_t, or A_t and cannot be hidden in the additive term.
    conditional_leading_bound: >-
      The expression becomes 3n+O(log n) only if a schedule independently
      proves max_t(Q_t+E_t+M_t+A_t)=n+O(log n), all other live terms are
      O(log n), and no two additional n-bit targets overlap. Those premises
      are not supplied by the blind statement, so no exact coefficient or
      leading bound is certified by this derivation alone.
  proves_too_much_controls:
  - object: source-like core with partial IDiv and IMul and no X=0 totalization
    result: not_certified
    reason: The disabled full-code-space branch includes X-a=0, where a partial division or multiplication does not define the required total permutation.
  - object: four-way router clearing flags from pre-map rather than unique post-map outputs
