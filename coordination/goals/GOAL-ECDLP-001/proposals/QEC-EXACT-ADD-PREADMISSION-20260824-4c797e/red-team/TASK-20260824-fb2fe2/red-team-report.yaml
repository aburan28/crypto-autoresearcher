red_team_report:
  schema: crypto.autoresearch.red_team_report.v1
  id: RT-20260824-fb2fe2
  task_id: TASK-20260824-fb2fe2
  claim_under_review: >-
    J3 only: whether the frozen implementation supports the allowed leading
    logical-width and source-asymptotic-order boundary after every added
    equality, zero test, Boolean combine, qROM/table access, mask, control and
    cleanup is charged, and whether the scope survives the declared
    proves-too-much objects.
  joint_verdict: breaks
  whole_claim_verdict: not_issued
  summary: >-
    The fixed-add patch exposes X,Y,A,S,enable plus z, four flags and e, so its
    undecomposed interface has symbolic width 3n+s(n)+7 and no declared fourth
    n-bit quantum register. The signed-window path is not a concrete circuit:
    it allocates no address/sign/qROM registers and never calls its backend
    comparison, constant or mask methods. The classical-address known-false
    object therefore survives, and qROM/primitive costs remain too symbolic to
    establish either signed-window leading width or preserved source gate
    order. This is a J3 resource/coherence break, not a verdict on J1 algebra,
    J2 reproduction, the whole construction, or ECDLP.
  objections:
  - id: J3-O1
    severity: blocking_for_signed_window_boundary
    title: Signed-window implementation is an unused protocol surface
    evidence: >-
      CoherentSignedWindowBackend declares four methods, while
      SignedWindowCompletionPlan.validate_backend calls only
      assert_targets_clean. No address or sign qubit, qROM target, comparator
      target, constant application or mask application appears in the patch.
    consequence: >-
      Neither coherent signed-window semantics nor its peak liveness is bound
      by executable producer bytes.
  - id: J3-O2
    severity: blocking_for_coherence_claim
    title: The classical-address known-false control survives
    evidence: >-
      candidate_translate takes a classical integer address and selects a
      Python table entry. Per-address basis permutations do not prove that one
      shared address-controlled circuit exists, especially when the backend is
      absent.
    consequence: >-
      The linear-extension sentence assumes the missing block-diagonal unitary
      and cannot certify a coherent superposed address.
  - id: J3-O3
    severity: blocking_for_signed_window_leading_width
    title: qROM target reuse is asserted but not exhibited
    evidence: >-
      The accounting says A_shared_work is streamed for qROM, but no backend or
      schedule demonstrates that reuse. Under the task rule, a qROM target and
      backend ancillas must be simultaneous with A,S,flags,e and z.
    consequence: >-
      A materialized n-bit coordinate target produces a fourth n-bit live
      register unless a concrete schedule proves target-free synthesis or safe
      aliasing. The leading 3n signed-window coefficient is not established.
  - id: J3-O4
    severity: blocking_for_asymptotic_order_boundary
    title: qROM, primitives and control deltas are symbolic with inconsistent boundaries
    evidence: >-
      T(n), loads/unloads, table passes, target width, MCX synthesis, promised
      IDiv/IMul expansion and controlled-arithmetic deltas are absent.
      Additionally, ZEQ_n is defined as including uncompute while four
      compute-or-uncompute calls are counted, and EQ2_n includes qROM work
      while qROM loads are also listed separately.
    consequence: >-
      No non-double-counted symbolic coefficient or asymptotic comparison to
      the source gate order can be independently reconstructed.
  - id: J3-O5
    severity: receipt_integrity
    title: Producer git-diff-check attestation is inaccurate
    evidence: >-
      An exact producer-path diff check from snapshot parent to pinned HEAD
      exits 2 and reports five new blank lines at EOF, while the producer
      runtime receipt says the check passed. The snapshot receipt correctly
      explains that the earlier command inspected an untracked directory.
    consequence: >-
      The hygiene attestation requires additive correction. No semantic effect
      on parsed YAML or Python is identified, and producer bytes must remain
      unchanged.
  required_controls:
  - >-
    A no-op backend with clean targets must be rejected by the backend contract;
    it is currently accepted.
  - >-
    A genuine two-address shared circuit must be tested on a phase-sensitive
    superposed address with address/sign preserved and every lookup,
    comparator, mask and arithmetic target returned to zero.
  - >-
    Omit Total-IDiv and Total-IMul separately, not only the combined
    source-like failure that stops first at partial division.
  - >-
    Emit an implementation-derived register/call trace and recompute peak and
    cost from it, including classical histories and preprocessing.
  counterexample_or_mutation: >-
    A class implementing CoherentSignedWindowBackend with no-op comparison,
    constant and mask methods and an assert_targets_clean method that returns
    normally passes SignedWindowCompletionPlan.validate_backend. It implements
    no addressed translation at all, so acceptance is a direct static
    proves-too-much counterexample.
  baseline_comparison: >-
    End-to-end Pollard-rho, BSGS, specialized quantum-ECDLP and practical
    runtime comparisons are outside this packet's allowed claim and were not
    performed. Because no speedup or ECDLP improvement is allowed, inventing
    such a comparison here would inflate scope. Within the authorized circuit
    baseline, only the fixed-add undecomposed source-register interface can be
    compared; signed-window and primitive-expanded baselines are missing.
  heuristic_challenges: []
  cost_model_challenges:
  - >-
    Fixed-add instruction-level overhead is exactly eight (2n+1)-control pair
    matches, four n-control zero toggles, two five-control effective toggles,
    four z-to-X CNOTs, four Hamming-weight masks, two unconditional constant
    additions and five controlled coordinate updates, before decomposition.
  - >-
    The exact fixed-match basis-flip count is 2*Z_eq_A X gates and the exact
    fixed exceptional-mask count is W_mask_A CNOTs; both depend on the supplied
    fixed addend. No exact universal coefficient follows.
  - >-
    The fixed builder allocates b_div, b_mul and m_arith simultaneously, totaling
    3n classical bits for n>=1. Their incremental status against the source is
    unbound, so end-to-end memory accounting cannot omit them.
  - >-
    A window backend must charge eight addressed relations, five addressed
    arithmetic constants, four addressed masks and the inverse cleanup of
    every materialized lookup. Its integer qROM pass count and T-dependent
    table cost are not present.
  reduction_and_scope_challenges:
  - >-
    Fixed-add basis correctness does not transfer to signed-window coherence
    without a single implemented address-controlled circuit and cleanup proof.
  - >-
    Symbolic compatibility with 3n+O(log n) cannot be promoted into 835
    qubits, an exact logarithmic or Toffoli coefficient, speedup, P1553
    progress, novelty, support, completion or breakthrough.
  - >-
    The J3 break does not imply a quantum-ECDLP or classical-ECDLP negative
    result and does not assess the algebraic J1 or reproduction J2 joints.
  proof_architecture_challenges:
  - attack: nearby_object_and_proves_too_much
    result: breaks
    detail: >-
      The absent coherent backend is indistinguishable from a no-op backend
      under validate_backend, and the classical-address loop receives the same
      linear-extension certificate as a genuine coherent circuit.
  - attack: method_ceiling
    result: breaks_for_signed_window
    detail: >-
      From the frozen bytes the strongest resource statement is a conditional
      undecomposed fixed-add inventory. The method has no information from
      which to bound signed-window target width or T-dependent lookup cost.
  - attack: compositional_invariant
    result: breaks
    detail: >-
      Delete all addressed comparison, constant and mask methods while retaining
      assert_targets_clean; validation still succeeds. The cleanup-only
      invariant does not imply addressed translation.
  proves_too_much_outcomes:
  - object: partial IDiv/IMul without zero totalization
    result: caught
  - object: pre-map flag cleanup
    result: caught
  - object: enabled-only suite without zero digit
    result: caught_by_coverage_audit
  - object: curve-point-only disabled suite
    result: caught_by_coverage_audit
  - object: classical address loop without coherent address state
    result: survives
  narrowest_supported_statement: >-
    At the undecomposed fixed-add patch interface, the declared quantum wires
    are X,Y,A,S,enable,z,fO,fA,fNA,fN2A,e, giving symbolic width
    3n+s(n)+7 and no declared fourth n-bit register. Conditional on the
    promised primitive interfaces and a decomposition introducing no
    undeclared n-bit workspace, this is compatible with a fixed-add leading
    3n+O(log n) statement only. It does not establish the signed-window
    leading width, coherent address semantics, source asymptotic gate order,
    or any exact or end-to-end resource claim.
  next_concrete_action: >-
    Freeze a concrete two-address coherent backend and an implementation-derived
    register/call trace. Require the no-op backend to fail, run the shared
    circuit on a superposed address with all targets cleaned, then recompute
    qROM, primitive, Boolean, mask, classical-memory and preprocessing costs
    without overlapping symbolic boundaries.
