sub_goals:
- id: SG-ECDLP-001
  title: Degree-split Semaev claw membership cost
  status: deferred_residuals
  objective: Determine whether a degree-split meet-in-the-middle / smoothness claw rewrite of prime-field
    Semaev membership yields a charged per-relation cost ratio R = cost_split/cost_naive strictly below
    0.5 that survives a same-shape null object.
  linked_question_ids:
  - RQ-ECDLP-002
  linked_idea_ids:
  - IDEA-20260731-007
  - IDEA-20260731-011
  - IDEA-20260727-003
  - IDEA-20260727-007
  linked_hypothesis_ids:
  - H-IC-001
  hypothesis_status_note: H-IC-001 remains weakened; this sub-goal does not reopen or alter that status.
    New work stays at proposal→design until /design-experiment.
  success_criteria:
  - R < 0.5 at B>=64 on at least two toy bit sizes with successful relation harvest
  - R_null >= 0.9 whenever R < 0.5 (structure-dependent gain)
  - HEUR-DS-1 toy validation reported (KS / tail) or explicitly failed
  falsification_criteria:
  - R >= 0.9 across tested (B,m) with successful harvest → claw rewrite adds no charged saving
  - R_null tracks R below 0.5 → gain is engine artifact, not Semaev structure
  claim_ceiling: toy charged-cost ratio and heuristic-status only; no crypto-scale ECDLP exponent claim;
    assembled E remains dominated by rho unless a surviving superpolynomial HEUR-DS-1 gain appears
  suggested_next_experiment_class: design-experiment on IDEA-20260731-007 with IDEA-20260731-011 null-control
    template frozen into the contract; pair HEUR-DS-1 sampling in-contract or as immediate follow-on
  path: coordination/goals/GOAL-ECDLP-001/sub_goals/decomposition_BATCH-016.yaml#SG-ECDLP-001
- id: SG-ECDLP-002
  title: Isogeny-transfer cost gate to special families
  status: selected_next
  objective: 'Falsify silent special-curve overclaiming: measure when a short ordinary isogeny to a special
    family can beat matched rho after full transfer charging.'
  linked_question_ids:
  - RQ-ECDLP-002
  linked_idea_ids:
  - IDEA-20260731-008
  - IDEA-20260731-011
  linked_hypothesis_ids:
  - H-IT-001
  success_criteria:
  - Charged transfer gate documented with explicit ell-budget vs hit-probability accounting
  - Either no short path beats rho under HEUR-ISO-1 at tested sizes, or a certificate exhibits a charged
    win on a declared special family
  falsification_criteria:
  - Gate cannot be stated with matched rho/BSGS controls within budget → infrastructure inconclusive
  - Claimed generic-curve exponent move without exhibited short path → packaging failure, not support
  claim_ceiling: mechanism/gate and toy transfer accounting; no generic prime-field exponent improvement
    without an exhibited path
  suggested_next_experiment_class: design-experiment on IDEA-20260731-008 (BATCH-025 / H-IT-001 / EXP-IT-001)
  path: coordination/goals/GOAL-ECDLP-001/sub_goals/decomposition_BATCH-016.yaml#SG-ECDLP-002
  selection_note_batch025: >-
    Selected at BATCH-025 open (DEC-20260731-023) after BATCH-024 RC-24
    non-execution. SG-ECDLP-001 residuals deferred.
- id: SG-ECDLP-003
  title: Crypto-proxy first-fall-degree correspondence
  status: queued
  objective: 'Validate or kill HEUR-FF-1: whether Semaev-shaped systems share normalized first-fall degree
    distribution with random same-shape systems, enabling honest Groebner cost models without solving
    ECDLP at crypto size.'
  linked_question_ids:
  - RQ-ECDLP-002
  linked_idea_ids:
  - IDEA-20260731-009
  - IDEA-20260727-006
  linked_hypothesis_ids:
  - H-IC-001
  success_criteria:
  - Toy Semaev vs random-shape KS comparison archived with pre-registered thresholds
  - Proxy sampling plan to larger shapes stated; missing crypto-proxy sizes reported missing, never fabricated
  falsification_criteria:
  - Normalized d_ff distributions diverge beyond threshold → HEUR-FF-1 weakened/rejected_scoped to tested
    shapes
  claim_ceiling: building-block measurement; informs IC bookkeeping; never itself an ECDLP break
  suggested_next_experiment_class: measurement experiment (heuristic-validation class) scheduled with
    any conditional IC exponent claim
  path: coordination/goals/GOAL-ECDLP-001/sub_goals/decomposition_BATCH-016.yaml#SG-ECDLP-003
- id: SG-ECDLP-004
  title: Shared-factor-base multi-target amortization
  status: queued
  objective: Measure when T ECDLP instances on one curve clear matched multi-target rho after one shared
    relation matrix, under HEUR-MT-1 and honest C_rel / C_LA / C_desc accounting.
  linked_question_ids:
  - RQ-ECDLP-002
  linked_idea_ids:
  - IDEA-20260731-010
  - IDEA-20260727-002
  - IDEA-20260727-003
  linked_hypothesis_ids:
  - H-YIELD-001
  - H-IC-001
  hypothesis_status_note: H-YIELD-001 remains specified; no status change here.
  success_criteria:
  - Amortized per-target cost vs T*rho reported with full preprocessing charge
  - C_desc distribution and cross-target dependence measured
  falsification_criteria:
  - For all feasible T in budget, amortized cost stays >= matched multi-target rho → no amortization win
    at tested scope
  - Single-target (T=1) presented as sub-rho without amortization → claim rejected as mis-scope
  claim_ceiling: composition / multi-target accounting at toy or mid-toy; not a single-target SOTA exponent
