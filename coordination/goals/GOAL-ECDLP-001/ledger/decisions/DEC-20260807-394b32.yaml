coordinator_decision:
  id: DEC-20260807-394b32
  goal_id: GOAL-ECDLP-001
  superseding:
    record_id: DEC-20260805-364e9e
    superseding_task: TASK-20260806-e87d2e
    superseding_by: BATCH-e0ccb2 (reviewer TASK-20260806-e87d2e, validator TASK-20260806-39f832, red-team TASK-20260806-8c3441)
  context: >-
    BATCH-e0ccb2 completed independent review of the committed BATCH-121 analyses and
    their official disposition in DEC-20260805-364e9e. Three reviews (reviewer, validator,
    red-team) identified critical issues in committed findings. The red-team demonstrated
    an algebraic halving query voids the doubling-oracle closure. The validator found
    provenance errors in the snapshot receipt (parent commit does not exist). The reviewer
    rejected the "UNCONDITIONALLY" claim for Semaev IC. This DEC creates the superseding
    disposition.

  superseded_findings:
    DEC-20260805-364e9e Finding #1 (TASK-20260805-004):
      Original: "Semaev IC is sub-rho (L[1/2,sqrt(2)] ≈ 2^61.7) in GGM+C_t UNCONDITIONALLY."
      Correction: "Semaev IC is sub-rho (L[1/2,sqrt(2)] ≈ 2^61.7) in GGM+C_t with
                  heuristic yield and smoothness assumptions." (heuristic, not unconditional)

    DEC-20260805-364e9e Idea disposition (IDEA-58b638/rejected):
      Original: "IDEA-58b638 (doubling-oracle) barrier CONFIRMED → rejected."
      Correction: "The 'barrier confirmed' claim is void because the doubling-oracle
                   query O_D([(q+1)/2]Q) recovers x(Q) in 1 call. No sub-rho barrier
                   from this mechanism. IDEA-58b638 disposition: survives_with_amendment."

    DEC-20260805-364e9e Finding #3 (biconditional):
      Original: "∃F [chain-complex sub-rho] iff ∃F [H-PSEUDO fails]."
      Correction: "Claim INC. The biconditional conflates: (a) chain sub-rho for typical
                   targets under smoothness, and (b) yield increase from Fourier failures.
                   Moderate failures (C≈3–6) don't trigger above-heuristic yield. Requires
                   M ≈ B for activation."

  superseding_findings:
    1. Semaev IC sub-rho:
       - Cost exp(sqrt(2)·sqrt(ln N·ln ln N)) = exp(42.9) ≈ 2^61.9 for N=2^256
       - This is heuristic: requires smoothness + yield heuristics (per Semaev IC literature)
       - Comparison: N^{1/2} = 2^128, so sub-rho holds if heuristics valid
       - Note: "GGM+C_t" provides the oracle, not the cost model; C_t is x-coordinate
         oracle, non-simulable, same class as elliptic-net oracle

    2. Comparison oracle C_t minimality:
       - C_t queries {(m+1)-tuple} at {(j]G)} for j ∈ F (|F| = m)
       - Minimal order-based non-simulable oracle (any smaller order has no polynomial base)
       - Same class as elliptic-net oracle in knowledge/
       - Does NOT enable sub-rho: chain-complex sub-rho requires above-heuristic yield

    3. H-PSEUDO iff biconditional:
       - Claim: "∃F [chain-sub-rho] iff ∃F [H-PSEUDO fails]"
       - Verdict: INC (inconclusive on this biconditional)
       - Reason: quantifier mismatch, moderate failures don't trigger yield increase
       - Status: ready for formal theorem derivation on claim C (C_t minimality + iff)

    4. x-coordinate oracle power:
       - O_D(P) = x([2]P) is rational function of x(P)
       - O_D([(q+1)/2]Q) = x(Q) in 1 query, independent of ord_N(2)
       - Conclusion: oracle access = x-oracle access; closure on IDEA-58b638 void, but
         x-oracle non-simulability (Tier 3) stands

    5. Multi-target BKK crossover (IDEA-0cd03f):
       - K*(BKK) = ceil(s·beta/(1-t·beta)), beta = 2/(m+1)
       - Crossover t_cross = s/(m+1)(s+1) = 0.38 for s=200, m=5
       - Critical regime: rescues t ∈ [1, (m+1)/2), asymptotic speedup 1/(t·beta)
       - Example: s=200, t=0.9, m=5: K*(std)=2001 → K*(BKK)=96 (21x reduction)
       - Verdict: APPROVED for experiment design; EV-SEMAEV-7f7d22 reserved

  decisions:
    - 'IDEA-58b638: survives_with_amendment. The original closure is void (halving
      query), but the x-oracle non-simulability result stands.'
    - 'IDEA-62ef74: survives_with_lesson. Sub-rho is heuristic on claim B (chain-complex
      sub-rho). C_t minimality claim C will be formalized.'
    - 'IDEA-0cd03f: APPROVED for experiment design. EV-SEMAEV-7f7d22 reserved.
      Crossover formula verified; critical regime t ∈ [1,(m+1)/2) is new capability.'
    - 'The x-coordinate oracle (O_D) is simulable (rational function), but that does
      not imply sub-rho ECDLP. Sub-rho requires above-heuristic yield; moderate Fourier
      failures give no yield increase for typical targets.'

  decisions_on_idea_status:
    IDEA-20260805-58b638: survives_with_amendment (closure void, x-oracle non-simulable stands)
    IDEA-20260805-62ef74: survives_with_lesson (sub-rho = heuristic on chain-complex sub-rho)
    IDEA-20260805-0cd03f: approved

  decision_scope: >-
    This DEC supersedes DEC-20260805-364e9e and applies only to the oracle/multi-target
    analysis tracks within batches BATCH-121 and BATCH-e0ccb2. GOAL-ECDLP-001 hypothesis
    states unchanged (H-PSEUDO-83817b remains open). Multi-target BKK track approved for
    EV-SEMAEV-7f7d22 design. x-oracle power result stands: closure on IDEA-58b638 void,
    but non-simulability (Tier 3) verified.

  exact_next_action: >-
    (A) Design EV-SEMAEV-7f7d22 (multi-target BKK experiment, 5 curves, m ∈ [3,5], k
        threshold sweep).
    (B) Formalize claim C (C_t minimality + H-PSEUMO iff iff chain-complex condition)
        in knowledge/findings.

  knowledge_promotion: not_warranted (claims remain internal hypotheses)
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2 (no sub-rho ECDLP yet)
    sota_delta:
      time_exponent: null (sub-rho heuristic)
      constant_factor: null (pending experiment)
