# ── completion gate self-check (docs/task-lifecycle.md step 7) ─────────────
completion_gate:
  contract_approved_and_committed_before_compute: true
  base_curve_and_seed_band_frozen_before_first_between_member_comparison: true
  every_executed_run_has_exactly_one_terminal_status_with_reason: true
  every_required_artifact_present_or_recorded_missing: true
  every_claimed_solve_has_independent_certificate_verification: true
  vertex_count_and_independent_h_both_reported_per_run: true
  null_object_result_reported_per_run: true
  q1_in_common_coordinate_system_and_q2_in_per_member_cheapest_model: true
  candidate_model_set_and_ms_rule_recorded_before_measurement: true
  every_q3_walk_component_labelled_measured_or_modelled: true
  no_interpretation_or_status_change_anywhere: true
  no_write_outside_scope_and_no_commit: true
  expected_run_count: "4 of a maximum 4; all four executed and terminal"
  duplicated_or_missing_seeds: "none; all 16 declared seeds present for every curve in every run"
  raw_and_summary_agree: true
  reproduces_from_recorded_command_and_revision: true

executor_assessment:
  protocol_complete: true
  data_quality: good
  data_quality_caveats: >-
    Three limitations a reviewer should weigh and that are NOT hidden anywhere
    in this package: (1) the class-completeness comparison is true by
    construction at the accepted base curve, because closing on h(D) was a
    declared selection filter (DEV-3); (2) the null-object control separates
    under the primary median_band in all four runs but under the raw
    per_seed_band in only two of them, and the primary-band choice was fixed
    after 16-bit implementation shakedown though before any of these four runs
    (ANOM-1, DEV-5); (3) between 0.31% and 2.33% of solves per run were
    censored by the distinguished-point stopping rule and contribute no cost
    datum (ANOM-3).
  requires_rerun: false
