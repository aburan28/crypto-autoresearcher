# ── protocol deviations and recorded anomalies ─────────────────────────────
protocol_deviations:
  - id: DEV-1
    field: "required_artifacts / 'every Velu isogeny with its kernel generator'"
    deviation: >-
      No edge in any run has an F_p-RATIONAL kernel generator, and none can:
      the contract requires N prime, so E(F_p) has no ell-torsion for any
      declared ell and every ell-isogeny kernel is defined over an extension.
      The kernel is therefore recorded by its KERNEL POLYNOMIAL together with
      the Frobenius eigenvalue lambda, which specifies exactly the same
      Galois-stable subgroup. Each edge additionally records deg h = (ell-1)/2,
      the verified divisibility h | psi_ell, the codomain, and an order check
      pinning #E' = N. Recorded rather than silently substituted.
  - id: DEV-2
    field: "run package layout (docs/evidence-and-reproducibility.md)"
    deviation: >-
      command.txt, environment.json, stdout.log and stderr.log are carried as
      FIELDS INSIDE manifest.yaml (command, environment, stdout_log,
      stderr_log) instead of as separate files, because the queue card fixes
      exactly eleven per-run filenames and the archive stages only declared
      paths: an undeclared file would be invisible to the record. No required
      content was dropped. For the same reason the `summarize` handoff state
      file is written to a scratch path OUTSIDE the repository rather than into
      the run directory.
  - id: DEV-3
    field: "inputs.base_curve selection procedure"
    deviation: >-
      The declared selection procedure adds three filters beyond the contract's
      shape requirements: |D| <= DMAX and H_MIN <= h(D) <= H_MAX (budget
      feasibility) and "the declared degrees {2,3,5,7,11,13} generate cl(O),
      i.e. the class walk closes on h(D)" (structural). All three are
      structural, were declared and frozen before any DLP was solved, and none
      uses or could use a cost datum. CONSEQUENCE THE REVIEWER MUST SEE: the
      third filter makes the completeness comparison TRUE BY CONSTRUCTION at
      the accepted base curve. It is reported side by side anyway in every run,
      and candidates rejected for closing short of h appear in each run's
      rejection log with that exact reason.
  - id: DEV-4
    field: "metrics.primary field_multiplications_per_group_operation (Q2)"
    deviation: >-
      Q2 is measured by replaying the first 300 group operations of each
      member's own seed-index-0 rho walk in each candidate model with
      instrumented arithmetic, not the full walk; the replay length is uniform
      across every member and was declared before measurement, and the replayed
      operation sequence is asserted equal to the Q1 sequence as a self-check.
      Additionally, the reported per-operation ratio is evaluated at ONE COMMON
      operation mix (the base curve's seed-0 adds/doublings proportion) rather
      than at each member's own mix, because each member's walk draws its own
      random adds/doublings proportion and a member-specific mix would confound
      the model effect Q2 is defined to measure with seed noise in that
      proportion. Per-ADD and per-DBL costs and each member's own-mix value are
      all recorded, so any other mix is recomputable by a reviewer.
  - id: DEV-5
    field: "controls.seed_dispersion_band"
    deviation: >-
      The frozen seed band has TWO parts rather than one: per_seed_band =
      [min, max] of the 16 raw base-curve counts, and median_band = a
      [2.5, 97.5] bootstrap interval on the median-of-16 statistic (bootstrap
      seed 20260813, 4000 resamples). The PRIMARY band for every between-member
      comparison and for the null-object gate is median_band, because the
      statistic actually compared between curves is each curve's median over
      the same 16 seeds and a band on single draws is not the resolution of a
      band on medians. Both are frozen together, before any between-member
      number, and both are reported everywhere. THIS CHOICE MATTERS AND IS
      DISCLOSED: see anomaly ANOM-1.
  - id: DEV-6
    field: "field-operation counting convention"
    deviation: >-
      Multiplication by a small integer constant (2, 3, 4, 8) is NOT charged as
      a field multiplication, uniformly across every candidate model and every
      curve, because the standard Jacobian operation counts the frozen
      prediction rests on (IEEE P1363; dbl-2001-b at 3M+5S, add-2007-bl at
      11M+5S) do not charge it either; charging it would make the measured
      counts incomparable with the cost model under test. With this convention
      the measured routines reproduce the literature counts exactly.

anomalies:
  - id: ANOM-1
    kind: instrument_resolution_observation
    observation: >-
      In RUN-ISOU-2ac81f-20BIT-A and RUN-ISOU-2ac81f-24BIT-A the different-order
      null object separates under the PRIMARY median_band but NOT under the raw
      per_seed_band; in the two B runs it separates under both. The raw
      per-seed band is very wide (e.g. [220, 3029] in 20BIT-A against a base
      median of 1198.5) because the rho step count is heavy-tailed and the
      minimum over 16 seeds dips far below the median.
    disclosure: >-
      The two-part band and the choice of median_band as primary were fixed and
      written into the implementation's frozen PROTOCOL block BEFORE any of the
      four runs was executed, but AFTER implementation shakedown runs at a
      different prime size (16-bit, in scratch, not part of this record). That
      ordering is disclosed here rather than left for a reviewer to infer.
      Both bands and both verdicts are reported for every run, so the effect of
      the choice is fully visible and independently recomputable from
      solve_records.jsonl.
    classification: recorded observation about instrument resolution; NOT a mathematical result
  - id: ANOM-2
    kind: unexpected_observation_against_the_frozen_fixture
    observation: >-
      The base curve's measured median group-operation count sits ABOVE the
      frozen reproduction fixture 0.886*sqrt(N) in all four runs, by factors
      1.320 (20BIT-A), 1.506 (20BIT-B), 1.457 (24BIT-A) and 1.106 (24BIT-B).
      The fixture lies INSIDE the frozen per_seed_band in all four runs, and
      inside the tighter primary median_band in the two 24-bit runs but NOT in
      the two 20-bit runs. For reference the measured medians sit near
      sqrt(pi*N/2) = 1.2533*sqrt(N), the constant for the length (tail + cycle)
      of a single rho walk under the random-function idealisation, as opposed to
      the contract's sqrt(pi*N/4) = 0.886*sqrt(N).
    handling: >-
      The frozen prediction was NOT adjusted and no run was re-scored. Every
      comparison reported anywhere in these runs is made against 0.886*sqrt(N)
      exactly as the contract specifies; both constants are recorded in each
      manifest's frozen_seed_band so a reviewer can see which one the
      measurement tracks. If the Coordinator judges the fixture needs revisiting
      that is an amendment producing a new record, not an edit here.
    classification: unexpected observation, preserved; no verdict stated
  - id: ANOM-3
    kind: measurement_limitation
    observation: >-
      A fraction of solves terminated as `censored_max_steps` rather than
      solving: 49/2640 (1.86%) in 20BIT-A, 63/2704 (2.33%) in 20BIT-B, 45/9648
      (0.47%) in 24BIT-A, 37/12016 (0.31%) in 24BIT-B. The mechanism is the
      distinguished-point stopping rule: when the walk's cycle happens to
      contain no distinguished point, no collision is ever detected and the run
      hits the 60*isqrt(N) step cap. Each censored solve is recorded in
      solve_records.jsonl with its status and its step count at cutoff, and in
      each run's defect_log.yaml, and contributes NO cost datum.
    handling: >-
      Censored solves are infrastructure/stopping-rule signal and are NEVER
      recorded as slow curves, as curves that resisted solving, or as evidence
      for or against any leg of the hypothesis (AGENTS.md rule 5). The
      censoring mechanism is identical on every curve, but the exclusion is not
      guaranteed to be exactly unbiased with respect to walk length, so the
      rate is reported per run rather than dismissed.
    classification: recorded measurement limitation
  - id: ANOM-4
    kind: execution_history
    observation: >-
      RUN-ISOU-2ac81f-20BIT-A was executed twice with identical parameters: once
      before a purely cosmetic fix to a log line that printed the null-object
      separation verdict next to the wrong band, and once after, with only the
      second execution retained as the run record. The run is fully
      deterministic given its seeds (verified: byte-identical
      solve_records.jsonl), so the two executions produced identical data. No
      run was repeated, and no parameter was changed, in pursuit of a more
      favourable result; every execution is recorded here.
    classification: recorded execution history

