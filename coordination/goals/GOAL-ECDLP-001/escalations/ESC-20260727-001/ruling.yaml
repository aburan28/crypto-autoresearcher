coordinator_ruling:
  id: ESC-20260727-001
  goal_id: GOAL-ECDLP-001
  ruled_by: coordinator
  ruled_at: "2026-07-27T09:00:00-07:00"
  status_of_this_document: >-
    Coordinator ruling on an escalation. This file lives in coordination/, not ledger/, and
    is therefore NOT itself an official state transition. Each item below that changes
    official state (H-GGM-001 status, the ID renumber, the new task) must be entered into
    ledger/ as a decision record and committed by an archive task before it is official. This
    ruling is binding as Coordinator direction for how that is to be done.
  subject: >-
    origin/main commit 3a59a2079e7d24fa877828dc4766d4ca1c1cc9cb (parent
    7ec5251ff6c23cbc26ada90ecb0fced928f84b85, author Adam Buran, 2026-07-27 07:51:00 -0700),
    "ledger: archive EXP-GGM-001 GGM simulability test - EV-GGM-001, DEC-20260726-007
    (support, strong)", which executed EXP-GGM-001 (9 run directories), recorded EV-GGM-001
    and main's DEC-20260726-007, promoted H-GGM-001 to supported, and promoted KN-FIND-001.
  what_i_inspected:
    - "main blobs at 3a59a207, read verbatim: DEC-20260726-007, EV-GGM-001, H-GGM-001, EXP-GGM-001/specification.yaml, EXP-GGM-001/analysis.md, run manifests and raw-result.json for RUN-GGM-s1-b8 and RUN-GGM-s1-b16, COMMIT_METADATA.txt, COMMIT_PATHS.txt"
    - "our branch: REV-20260726-005, RT-20260726-001 and their companions, EV-ECDLP-007, DEC-20260726-008, GOAL-ECDLP-001, BATCH-006 batch.yaml and dispatch queue"
