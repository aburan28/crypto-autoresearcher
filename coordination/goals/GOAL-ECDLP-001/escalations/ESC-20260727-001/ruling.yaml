  correction_to_the_escalation_premise:
    item: "Escalation fact 3, RUN PROVENANCE IS NULL"
    ruling: PARTLY_INCORRECT_AS_STATED
    detail: >-
      For both manifests I can see (RUN-GGM-s1-b8, RUN-GGM-s1-b16) the following are POPULATED,
      not null: code.commit 7ec5251ff6c23cbc26ada90ecb0fced928f84b85, code.dirty false,
      code.command, inference.requested_policy coordinator-ultra-code,
      inference.resolved_model_id fireworks-ai/accounts/fireworks/models/glm-5p2,
      inference.reasoning_effort high, inference.fallback_used true, result.valid true,
      result.invalid_reason null, status completed_valid, environment.operating_system,
      architecture and python_version, timing, and certificate kind none / verified true /
      verifier no-claim. The artifact policy is largely satisfied on these two runs, and
      certificate kind none is the correct declaration for a measurement run that claims no
      solve. I am recording this correction because a ruling built on a false premise would be
      worthless and unfair to the co-driver.
    what_is_actually_missing_or_defective:
      - "inference.adapter_version is null and environment.dependencies is an empty map, against the artifact policy's dependency-version requirement."
      - "artifacts is an empty map in both manifests, although stdout.log, stderr.log, command.txt, environment.json and raw-result.json exist as sibling files per COMMIT_PATHS."
      - "The glm-5p2 fallback is recorded honestly but carries no authorization_ref. No committed decision on main authorizes a fallback for these runs. This is the same gap RT-20260726-001 OBJ-14 raised against the design-time receipt."
      - "EV-GGM-001.run_ids is an empty list while the record and decision assert 9 runs. No run ID is cross-referenced from the evidence record, so the evidence is not bound to the runs it rests on."
      - "I cannot speak to the other 7 manifests."

  A_validity:
    question: "Is main's EXP-GGM-001 archive a valid official state transition?"
    ruling: NOT_A_VALID_OFFICIAL_STATE_TRANSITION
    ruling_scope: >-
      This is a ruling on PROCESS VALIDITY of the state transition, and on the interpretation
      the records assert. It is NOT a finding that the computation is wrong, that
      simulability_test.py is buggy, or that any oracle is in fact non-simulable. I have not
      re-run anything. The commit is durable, its artifacts are retained, and nothing in this
      ruling deletes, reverts, or discards the co-driver's work.
    grounds:
      - id: A1
        title: "No approval exists; the experiment lifecycle was skipped"
        detail: >-
          experiments/EXP-GGM-001/specification.yaml at 3a59a207 still reads status
          review_required, approved_by null, version 1, and that path is not among the commit's
          changed paths. The runs were executed against parent 7ec5251f, where the same
          specification was equally unapproved. docs/task-lifecycle.md and AGENTS.md require
          draft -> review_required -> approved -> running, with a decision record carrying each
          transition, and reserve approval to the Coordinator. An experiment moved from
          review_required directly to executed-and-archived. The escalation reports that no
          approve decision for EXP-GGM-001 exists anywhere in main's ledger/decisions; that is
          consistent with everything I can see, and I found none in the extracted records.
      - id: A2
        title: "A closure claim was archived with no independent review, contrary to AGENTS.md rule 12"
        detail: >-
          main's DEC-20260726-007 context states the jet and endomorphism verdicts are
          "scale-independent mathematical closures at exponent 1/2 (derivation-level, not
          toy-tier)". That is a closure result and a claim above the toy tier, which rule 12
          requires be reviewed by an independent, non-originating review-xhigh session.
          COMMIT_PATHS for 3a59a207 contains no reviewer, validator, or red-team artifact of
          any kind, and EV-GGM-001 records reviewed_by coordinator. The claim that most needed
          outside scrutiny received none. Note this is a defect of process, and it is exactly
          the defect BATCH-006 was opened to remedy for the design; it now recurs for the
          execution.
      - id: A3
        title: "The frozen success criterion was not met on its own terms for two of the four oracles"
        detail: >-
          The frozen specification requires, for a SIMULABLE verdict, a simulator overhead C
          bounded by a constant independent of N with target C <= 10, and H-GGM-001
          falsification_conditions item 4 states that if C grows with N for an oracle classified
          SIMULABLE then the O(1) claim is false. main reports elliptic_net SIMULABLE at
          O(log N) and incidence SIMULABLE at O(B^m), with overhead_C recorded as null in both
          manifests. Read against the frozen text, a declared falsification condition fired for
          two subjects; the archive nonetheless records decision support at strength strong.
          I note for completeness that our own review holds falsification condition 4 to be
          stated backwards (RT-20260726-001 OBJ-03c), so the correct reading is not that the
          hypothesis is falsified either - it is that this protocol cannot adjudicate the
          question, in either direction.
      - id: A4
        title: "The generic-group model variant was not held fixed, contrary to the hypothesis's own assumption 5"
        detail: >-
          H-GGM-001 assumptions item 5 requires that "The generic-group model variant used
          (Shoup's original encoding-based model) is fixed consistently across all oracles and
          controls", and inputs.gg_model_variant is frozen as shoup_encoding. main's raw-result
          classifies the encoding control NON_SIMULABLE on the strict-Shoup ground that
          "elements are opaque labels; the x-coordinate is not accessible", while classifying
          jet and endomorphism SIMULABLE on the structured-GGM ground that the curve equation is
          public and coordinates are therefore available. Two different models were applied
          within one run. See section B; this is the substantive core of the escalation.
      - id: A5
        title: "Bookkeeping and cross-reference defects"
        detail: >-
          EV-GGM-001.run_ids is empty while asserting 9 runs. KN-FIND-001 was promoted without
          knowledge/INDEX.md appearing in the same commit, contrary to the /curate-knowledge
          convention that the entry and the regenerated index are archived together. main's
          DEC-20260726-007 collides with an unpublished record of ours (section D). The
          fallback in the run manifests has no authorization_ref (see the premise correction).
    what_remains_valid_notwithstanding:
      - "The commit exists, is well-formed, and retains full run directories including stdout, stderr, command, environment, manifests and raw results. That is a better artifact trail than several earlier batches in this campaign produced."
      - "The run records are honest about the fallback model and do not claim equivalence."
      - "certificate kind none with verifier no-claim is the correct declaration for a measurement run."
      - "analysis.md is a written, human-readable argument. Our branch has no comparable artifact for this question. Its existence is a genuine contribution even though section B finds its central inference unsupported as written."
      - "The record concedes its own most damaging boundary in writing (EV-GGM-001 boundaries item 1). That is intellectually honest and it is the hook on which section B turns."
    consequence: >-
      The archive is process-invalid as an official transition. It must not be treated as
      establishing H-GGM-001 supported, as promoting KN-FIND-001, or as closing any candidate
      family at exponent 1/2, until the missing approval, the missing rule-12 review, and the
      model-variant inconsistency are resolved. The remedy is review and re-derivation, not
      deletion.

  B_substance:
    question: "Do our two independent reviews bear on main's reported results?"
    ruling: YES_DIRECTLY_AND_THEY_ARE_CONFIRMED_BY_MAIN_OWN_ARTIFACTS
    the_decisive_point:
      title: "The control gate's 4/4 and the two headline closures cannot both be earned under one definition of simulable"
      derivation: >-
        Read main's raw-result.json. The encoding control (P -> x(P)) is classified
        NON_SIMULABLE with the rationale that in the generic group model elements are opaque
        labels, so the x-coordinate is not accessible. The jet oracle is classified SIMULABLE
        with a rationale that states, verbatim, "This requires the coordinates, which are the
        encoding" and "in the strict GGM (opaque labels), the jet data is NOT computable",
        resolved by adopting "the structured GGM where the curve equation is public". The
        endomorphism rationale says the same: "in the strictest Shoup GGM (opaque labels), phi
        cannot be applied to a label, making it NON-SIMULABLE. We classify as SIMULABLE under
        the structured GGM." So exactly one of two things is true, and both are damaging to the
        stated conclusion.
      horn_1: >-
        If strict Shoup is applied uniformly, then by main's own written rationale the jet and
        endomorphism oracles are NON-SIMULABLE. The two closures at exponent 1/2 - the entire
        headline of the commit - do not exist.
      horn_2: >-
        If the structured GGM is applied uniformly, then coordinates are recoverable from the
        encoding plus the public curve for every subject alike, so the encoding control
        P -> x(P) is likewise a deterministic function of available data and must be classified
        SIMULABLE. Its frozen expected_verdict is NON-SIMULABLE and it is the positive
        correctness control. The gate then reads at most 3/4, and by the frozen falsification
        criterion the test is unsound and no augmented verdict may be reported at all.
      conclusion: >-
        The reported 4/4 gate is obtained by applying strict Shoup to the controls and the
        structured GGM to the augmented oracles. Under neither model alone does the reported
        result set stand. This is checkable on paper from main's own artifacts, requires no
        re-execution, and is precisely RT-20260726-001 OBJ-01 Horn 2 and falsification route
        XR-1, written in advance and independently of this run.
      status_of_this_derivation: >-
        A derivation-level argument offered for independent checking, not a theorem and not a
        machine-checked proof. It should be tested by a non-originating reviewer, not accepted
        because a Coordinator wrote it.
    does_the_structured_GGM_framing_answer_OBJ_01:
      ruling: NO_IT_INSTANTIATES_OBJ-01_RATHER_THAN_ANSWERING_IT
      detail: >-
        OBJ-01's claim was that "simulable" is never defined to a single meaning and that no
        single definition makes the control gate pass and the four expected verdicts hold.
        main's run does not refute that; it is an instance of it, and it concedes the instance
        in EV-GGM-001 boundaries item 1 ("Under the strictest GGM, jet and endomorphism would be
        NON-SIMULABLE"). Naming the second model "structured GGM" supplies a label, not a
        definition: nothing in the frozen specification defines it, the frozen field
        gg_model_variant says shoup_encoding, and the controls were never re-derived under it.
        To actually answer OBJ-01 one must (i) define the structured GGM formally in frozen
        text, (ii) re-derive all eight subjects under that one definition, and (iii) show the
        gate still passes - which, per horn 2, it does not without also revising what the
        encoding control is for.
      fairness_note: >-
        Choosing a structured model in which the curve equation is public is a legitimate and
        arguably standard setting for ECDLP analysis, and analysis.md says so. The defect is not
        the choice. It is that the choice was made per-subject at execution time rather than
        frozen in advance for all subjects, which is the wording-lever defect REV-20260726-005
        and RT-20260726-001 OBJ-07 both predicted. Frozen consistently up front, this could be a
        sound experiment. That is the constructive path.
    other_review_findings_confirmed_by_main_artifacts:
      - id: B2
        finding: "The overhead growth check cannot fire, as predicted by RT-20260726-001 falsification route XR-2"
        detail: >-
          overhead_C is identical at 8 bits and 16 bits for every subject (jet 1, endomorphism 0,
          pure_generic 1, public_curve 0; null elsewhere). A statically counted quantity cannot
          vary with N, so analysis_methodology.overhead_growth_check compared a constant to
          itself and could not have detected growth for any oracle. The N-independence claim
          underlying both closures rests on a check with zero discriminating power. XR-2
          specified this exact test - read three numbers from raw-result.json - before the run
          existed.
      - id: B3
        finding: "The discrete-log control passed by assertion, with no witness of the mandated form"
        detail: >-
          REV-20260726-005 BO-3 and RT-20260726-001 OBJ-05 independently showed the frozen
          expected_witness for that control describes an object that cannot exist, because k is
          determined by the abstract pair and is identical under every encoding. main's emitted
          witness for discrete_log is a prose restatement of Shoup's bound and of the fact that
          the answer depends on abstract group structure - it exhibits no encoding pair, and its
          final sentence concedes the answer does not depend on the encoding. So the control was
          scored correct without producing the certificate its own specification requires. The
          prediction was made in advance and is confirmed exactly.
      - id: B4
        finding: "The no-sub-birthday-advantage claim for the incidence oracle is unsupported as written"
        detail: >-
          analysis.md asserts that the O(log N) and O(B^m) overheads are "still << sqrt(N), so no
          sub-birthday advantage exists". For O(log N) that is fine. For O(B^m) it depends
          entirely on B, which the frozen specification never bounds - RT-20260726-001 OBJ-08
          flagged exactly this omission. Under this program's own convention B = ceil(sqrt(N))
          (H-STR-002 test_boundary), B^m at m = 2 is on the order of N, which is not much less
          than sqrt(N) but much greater. The sentence is therefore either false or vacuous
          depending on a parameter that was never fixed. This is a checkable defect in the
          written analysis; it is not a claim that the incidence oracle confers any advantage,
          and nothing here suggests it does.
      - id: B5
        finding: "The tier escalation reproduces the exact defect RT-20260726-001 OBJ-02 blocked"
        detail: >-
          EV-GGM-001 carries claim_tier toy with proof_status derivation and strength strong,
          while its own boundaries item 2 and main's DEC context assert the closures are "not
          toy-tier". docs/claims-and-verification.md states that derivation-level status does not
          relax the tier ceiling. The record is internally inconsistent in the specific way
          OBJ-02 predicted the frozen scale_independence_note would force. The honest form is
          claim_tier toy AND proof_status derivation simultaneously, with the closure language
          removed.
    what_our_reviews_do_NOT_establish:
      - "They do not show that the jet, elliptic-net, incidence, or endomorphism oracle is non-simulable. Neither does main's run show that they are. The question is open."
      - "They do not show that simulability_test.py contains a coding error. I have not read it."
      - "They do not show the co-driver acted in bad faith. The record concedes its own strongest counter-boundary in writing."
      - "Nothing in this section is evidence for or against ECDLP hardness, prime-field ECDLP, or KN-OPEN-001, which is untouched."

  C_hypothesis_status:
    question: "What should H-GGM-001's status be on the merged result?"
    ruling: SPECIFIED
    supported_cannot_stand: >-
      A supported status cannot stand on this record. Under AGENTS.md the status is set by the
      Coordinator on reviewed evidence; the evidence here has had no independent review (A2),
      rests on an experiment that was never approved (A1), and is internally inconsistent about
      the model in which its two headline verdicts hold (A4, B). Two of the four augmented
      verdicts additionally fail the frozen overhead criterion (A3). Strength strong is not
      available for a single unreplicated, unreviewed execution regardless of the merits: the
      nine runs are three seeds of a deterministic classifier over the same eight frozen strings
      and are not independent replications of anything.
    also_not_rejected_or_weakened: >-
      Equally, H-GGM-001 must not be moved to rejected, weakened, or inconclusive on this
      record. Doing so would be the mirror-image error: a process-invalid execution is not
      negative evidence either, and no refutation artifact about the underlying mathematics
      exists. specified is the honest status - the hypothesis has a specified test, and the test
      has not yet been validly run.
    what_the_evidence_record_should_say_instead: >-
      If EV-GGM-001 is retained rather than superseded, its defensible form is direction
      supports, strength preliminary, claim_tier toy, proof_status derivation with
      analysis.md as proof_ref, run_ids populated, and every "closure at exponent 1/2" and
      "valid at all scales" phrase removed in favour of the scoped form: under the structured
      GGM as defined in <frozen text>, with the model variant applied identically to controls
      and subjects. That record would be a real contribution.
    superseding_records_required:
      - "A ledger decision record (next free DEC id, authored post-merge) that sets H-GGM-001 status back to specified, cites this ruling, main's DEC-20260726-007, EV-GGM-001, EV-ECDLP-007, REV-20260726-005 and RT-20260726-001, and states plainly that it is a process ruling and not a finding that the mathematics is wrong."
      - "A superseding evidence record (next free EV id) that restates main's execution at the defensible tier and scope above, or an explicit correction record against EV-GGM-001. EV-GGM-001 is published and must not be overwritten."
      - "A superseding experiment specification EXP-GGM-001 version 2 that freezes ONE model variant for all eight subjects, per DEC-20260726-008's next_action, before any re-execution."
      - "A correction or superseding entry for KN-FIND-001, whose promotion rests on the same unreviewed closure claim, together with the knowledge/INDEX.md regeneration that the original promotion omitted."
    not_edited_here: "I have not edited H-GGM-001, EV-GGM-001, KN-FIND-001, or any experiment record, as instructed."

  D_id_collision:
    question: "Which DEC-20260726-007 renumbers, and to what?"
    ruling: OURS_RENUMBERS_TO_DEC-20260726-009
    reasoning: >-
      main's DEC-20260726-007 is published on the trunk and is referenced by a published commit
      message and by KN-FIND-001. Ours exists only on an unmerged branch. The published record
      keeps the ID; the unpublished one renumbers. This costs less integrity than any
      alternative and touches no published history. DEC-20260726-008 is already ours, so the
      next free number on the same date is 009; I keep the 20260726 date because our record's
      decided_at is 2026-07-26 and the date component is part of the record's identity, not a
      filing timestamp.
    new_id: DEC-20260726-009
    correction_record_required:
      id: CORR-20260727-001
      note: >-
        ledger/corrections/CORR-20260727-001.yaml, per the correction template, recording
        record_id DEC-20260726-007 (ours), field id, prior_value DEC-20260726-007,
        corrected_value DEC-20260726-009, reason "collision with the published main record of
        the same ID", and carrying the alias table below. IDs are immutable, so the renumber is
        itself a deviation and must be recorded rather than performed silently.
    alias_declaration: >-
      Every occurrence of the string DEC-20260726-007 in an artifact authored on branch
      feat/launch-research-harness-78c286 on or before 2026-07-26 refers to DEC-20260726-009,
      NOT to main's DEC-20260726-007. This alias is what makes the historical strings readable
      without tampering with immutable artifacts.
