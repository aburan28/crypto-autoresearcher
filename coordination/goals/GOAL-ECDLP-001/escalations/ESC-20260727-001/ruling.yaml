  E_run_provenance_repair_task:
    id: TASK-20260727-001
    confirmed_free: "No ledger/handoffs/TASK-20260727-*.yaml exists on this branch."
    from: coordinator
    to: validator
    role_note: >-
      Validator, not coordinator: the job is artifact and cross-reference integrity checking,
      which is the Validator's charter, and it should not be done by the role that will act on
      the result. It must be a non-originating session.
    objective: >-
      Determine, for all 9 EXP-GGM-001 run directories at origin/main commit 3a59a207, whether
      each run record satisfies the AGENTS.md artifact policy, and bind every run artifact by
      SHA-256 computed from Git object content in a separate receipt. Record precisely what is
      present, what is missing, and what cannot be determined. Do not repair by editing.
    constraints:
      - "Do NOT edit, rewrite, normalize, or back-fill any run manifest, raw-result, log, or any file under experiments/EXP-GGM-001/. Run records are immutable. A gap is recorded, never filled."
      - "Do NOT change any hypothesis, experiment, evidence, decision, or knowledge record."
      - "Compute every SHA-256 from Git object content at 3a59a207, never from a working tree."
      - "Report per run: status, result.valid, code.commit, code.dirty, command, inference.requested_policy, inference.resolved_model_id, inference.fallback_used, inference.adapter_version, environment.dependencies, artifacts, timing, certificate block, and whether stdout.log and stderr.log are non-empty."
      - "Check cross-references: EV-GGM-001.run_ids is empty while 9 runs are asserted; report every run ID that exists on disk and is not cited by the evidence record."
      - "Verify the 8 spec_hash values are identical across all 9 runs, and report any subject whose spec_hash or verdict differs between runs. A deterministic classifier over frozen strings should be invariant; any variation is a finding."
      - "Report whether overhead_C for each subject is identical across the 8, 12, and 16 bit runs. This is the static-count check (RT-20260726-001 XR-2) and its outcome is a finding either way."
      - "Locate any committed decision authorizing the glm-5p2 fallback recorded in these runs. If none exists, say so; do not infer authorization."
      - "This is bookkeeping and integrity work. Nothing found here is evidence for or against any hypothesis, and no defect found here is a mathematical result."
    write_scope:
      - "coordination/goals/GOAL-ECDLP-001/escalations/ESC-20260727-001/provenance_audit/TASK-20260727-001/"
    deliverables:
