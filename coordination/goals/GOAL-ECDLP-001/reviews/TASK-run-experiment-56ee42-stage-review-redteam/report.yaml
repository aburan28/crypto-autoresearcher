  verdict: REVISE
  verdict_summary: >-
    The amendment must NOT be dispatched as written. Beyond the no-op gap the
    Coordinator already flagged, a load-bearing factual error was found in the
    amendment's own premise: the COMPARATOR ("top bit of x") is not "nearly
    balanced" -- it is catastrophically imbalanced at every ladder rung, and
    its own q_maj - 1/2 is measured, by direct computation on the frozen
    estimator, at 0.4998 (essentially the theoretical ceiling), ~460x larger
    than T1's 0.00109 at the same n. This means C2's positive control is
    itself a T4-type unbalanced statistic, not a point-structure control, and
    numerical checks (three rungs, official seed formula) show C2's <=0.5
    threshold is not met by the CORRECT, fully-random NULL-2 shuffle -- i.e.
    the calibration run as specified is very likely to fail for a reason that
    has nothing to do with whether NULL-2 works.

  objections:
    - id: OBJ-1-genuine-signal-case
      target: "DEC-92dec2 finding F-control"
      objection: >-
        At every one of the six ladder rungs, T4's pre-shuffle A_noDC exceeds
        the MAX of all 8 NULL-2 shuffles (T17: 0.014515 > max=0.011389; T19:
        0.007240 > max=0.006764; T21: 0.003994 > max=0.003309; T23: 0.002032
        > max=0.001585; T25: 0.001016 > max=0.000869; T27: 0.000548 >
        max=0.000446). Under exchangeability, P(pre-shuffle is the unique max
        of 9) = 1/9 per rung; observing this at all 6 has probability
        ~(1/9)^6 ~= 1.9e-6.
      counterexample_or_check: >-
        Checked the point-at-infinity fixed-position explanation and ruled it
        out quantitatively: contributes ~7.5e-9 at T27, four+ orders of
        magnitude below the observed ~5.5e-4 value.
      verdict_on_this_objection: >-
        Does not fully survive scrutiny as a "genuine signal" claim, but does
        survive as an unresolved gap: T4 is diagnostic not primary; 6 rungs
        share one mechanism (not fully independent trials); T4's pre-shuffle
        A_noDC decays at ~n^-0.5 across the ladder, consistent with either
        closure or a weak genuine correlation at the same rate. NET: the
        DEC's "calibration defect, not evidence" reading is undersupported as
        stated -- it never rules out this rank anomaly -- but the anomaly
        does not rise to proof of a real effect either.

    - id: OBJ-2-comparator-not-balanced
      target: "amendment v2, C2, disclosed_limitations"
      objection: >-
        DECISIVE, LOAD-BEARING FINDING. The amendment states the comparator's
        level sets are "nearly, not exactly, balanced" -- this is FALSE, not
        merely imprecise. Because the frozen ladder selector picks the FIRST
        prime p >= 2^T for each rung, the "1" fiber (top_bit_fiber) is a tiny
        interval just above 2^(bit_length-1): fiber-1 fraction is 0.0221% at
        T17, down to 0.000022% at T27 -- between 1:4500 and 1:4,600,000, and
        it worsens (relatively) as the ladder scales up.
      counterexample_or_check: >-
        Direct computation on the actual T17 rung using the frozen
        estimator.py: comparator fiber sizes {0: 131081, 1: 32} (n=131113),
        COMPARATOR q_maj = 131081/131113 = 0.99975594, q_maj-1/2 = 0.49975594
        (essentially the ceiling). T1 (Thue-Morse) q_maj-1/2 = 0.00108685 at
        the same rung. T4 (popcount mod 4), by contrast, is genuinely close
        to balanced at the same rung: {0: 32949, 1: 32736, 2: 32750, 3:
        32678} against n/4=32778, within ~1%. The comparator is far MORE
        imbalanced than the statistic the design flagged as "unbalanced."
      downstream_consequence: >-
        specification.yaml v1's primary metric P1 is "A(v) and q_maj-1/2 for
        T1,T2,T3 MINUS the SAME quantities for the COMPARATOR." If the
        comparator's own q_maj-1/2 is pinned near 0.5 by its marginal, the P1
        difference at every rung would read approximately -0.4987 -- a value
        the frozen two-branch rule was never built to interpret, and read as
        unsigned |diff|>=0.05 would mechanically trigger LEAD for a reason
        unrelated to digit-family structure. This exceeds the CONTROL-C
        remit but is a direct consequence of the same comparator-balance
        question and should block Stage 3 independent of how C1/C2 resolve.

    - id: OBJ-3-C2-non-discriminating
      target: "amendment v2, C2"
      objection: >-
        Given OBJ-2, C2 ("comparator collapse ratio <= 0.5") cannot do the
        job it is assigned. Running the ACTUAL, correctly-implemented NULL-2
        mechanism (numpy default_rng.permutation, frozen algorithm, official
        8-seed formula) on the real T17/T19/T21 comparator sequences: T17 (8
        official seeds) ratio = 0.8898 (100-seed sweep: 0.72-0.93, median
        0.80); T19 (40 seeds): 0.96-0.99; T21 (8 official seeds): 0.8477
        (20-seed sweep: 0.76-0.82). None approach C2's required <=0.5, across
        three rungs, using the genuine, correctly-seeded shuffle. A
        deliberately weak contiguous-block shuffle also failed to sneak under
        0.5 (T17: 0.77-0.83).
      verdict_on_this_objection: >-
        C2 as instantiated is UNCONDITIONALLY NON-DISCRIMINATING: a correct
        shuffle and a deliberately weak one land in the same failing range.
        C2 currently carries ZERO information about whether NULL-2 works.

