  attack_step_b_survives_vs_imbalance: >-
    rt_exp_1.py line 113's comment ("A positive alpha that SURVIVES this is
    signal; one that does not is imbalance") is inverted relative to the
    mechanism and relative to the script's own P2 usage: a matched-marginal
    shuffle preserves level-set sizes exactly, so excess produced purely by
    size imbalance is exactly preserved (should survive); genuine
    positional/additive dependence is destroyed by relabeling (should
    collapse). Confirmed by the script's own P2 control (deliberately
    structural, G:20.01->1.003, collapses) vs popcount/digitsum (G-1 survives
