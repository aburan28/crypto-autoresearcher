  narrowest_supported_statement: >-
    Read against TASK-20260727-004's exact required_repair text, four of the
    five blocking objections (BO-1, BO-3's literal text, BO-4, BO-5) are
    genuinely discharged by experiments/EXP-IC-002/amendments/v1_to_v2.yaml.
