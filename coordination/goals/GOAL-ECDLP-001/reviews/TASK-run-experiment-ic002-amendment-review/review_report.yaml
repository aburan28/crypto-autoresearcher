  per_objection_disposition:

    - id: BO-1
      original_title: "The motivating premise is false and the frozen protocol halts on it"
      original_required_repair: >-
        "Replace the absolute premise with the per-instance decomposition table
        read from the committed records, and rewrite CTRL-G's expectation to
        that table. Scope A1 to N >= 1e9. Carry the correction of EV-IC-001,
        DEC-20260726-005 limitations, EXP-IC-001/analysis.md and goal note
        INT-BATCH006-003 to TASK-20260727-009 as a superseding record; those are
        immutable and are not mine to edit."
      disposition: discharged
      verification: >-
        R1 in v1_to_v2.yaml strikes the absolute "no decomposition ever
        occurred" premise from objective, contrast_with_ev_ic_001, CTRL-G, SC2
        and alternative_outcome A1, and replaces it with the per-instance table
        (9, 9, 10, 1, 2, 2, 1 decomposed of 10 at (8,1),(8,2),(8,3),(12,1),
        (12,2),(12,3),(16,3); 0 at the other 27 instances) sourced from
        verified_source_record, which itself cites two independent readings
        (RT-20260727-001 and the dispatching orchestrator) at the time of
        writing. CTRL-G's v2 expectation is rewritten to this exact table, not
        "0 decompositions". Stopping rule 4 is rewritten with graded
        dispositions G-a (agreement, continue) / G-b (1-7 disagreeing
        instances, continue and report) / G-c (>7 disagreeing instances, halt)
        / G-d (reuse-contract failure, halt, unchanged from v1). Since the
        corrected expectation table has exactly 7 nonzero entries and the
        target is deterministic reproduction of the same code path, instance 1
        (8-bit seed 1, expected 9/10) either exactly agrees (G-a) or at worst
        falls under the 7-instance G-b tolerance; either way the arm does not
        halt. alternative_outcome A1 is rescoped to "ONLY to the instances where
        it is actually observed" and explicitly states the (8,1)-(16,3)
        counterexamples, correctly narrowing "the source experiment never
        performed a descent" to N >= 1e9. The superseding-record obligation for
        the immutable EV-IC-001/DEC-20260726-005/analysis.md/goal-note text is
        correctly routed to TASK-20260727-009 rather than attempted here (the
        amendment has no authority to edit those immutable records, and does
        not try to).
      independent_corroboration: >-
        TASK-20260727-012 (Q1, R1_detail) independently re-derived the same
        748-run census and 7-instance table from committed bytes at a different
        commit (e0db8ef7) and confirmed "so a legitimate 8-16 bit decomposition
        no longer halts the primary arm at instance 1 of 34." EV-IC-002's
        replication_map lists this table as a "quadruple_derivation_agreeing"
        item (four independent parties). I regard this as adequately
        cross-checked arithmetic that I did not need to re-execute to trust.
      residual_concerns: none.

    - id: BO-2
      original_title: "F2 is unreachable at the instances that carry the decision"
      original_required_repair: >-
        "State plainly in the specification that F2 is unreachable at N >= 1e9
        and that the experiment's genuinely empirical content is confined to
        the 7 instances with N <= 2377. Add the disposition rule that separates
        a genuine F2 from an integrity failure from an s3_eval-filter defect.
        Add the filter-completeness control (below)."
      disposition: NOT_fully_discharged
      verification: >-
        The required_repair names THREE distinct actions. Two are done: (1)
        R2 / f2_reachability.statement plainly records "F2 is UNREACHABLE at
        every instance with N >= 1e9" and empirical_content_confined_to
        correctly narrows the genuinely new content to items (a)-(e), which
        line up with the 7 instances at N <= 2377 plus a few zero-cost
        secondary metrics; (2) the disposition block under f2_reachability
        genuinely separates three cases -- (i) an s3_eval filter-incompleteness
        finding, (ii) a source-reproducibility finding, (iii) neither, "only
        case (iii) would be F2 in the sense v1 labelled it" -- which is exactly
        the disposition rule required. The THIRD action, "Add the
        filter-completeness control (below)" -- an explicit, unambiguous
        cross-reference to CTRL-I in required_controls -- is NOT done. Instead,
        declined_objections.D1 explicitly declines to add CTRL-I, citing scope
        ("this amendment is scoped to the five blocking repairs plus zero-cost
        reporting changes") — but CTRL-I is not an item outside the five
        blocking repairs; it is a literal clause of BO-2's own required_repair,
        one of the five. D1's own text all but concedes this:
        "but_this_is_the_load_bearing_decline: Heuristic H3 is the SOLE
        residual route to falsifier F2 at N >= 1e9, and this amendment declares
        F2 unreachable there partly on the strength of H3. Declining CTRL-I
        leaves that declaration resting on an unproved, untested assumption...
        It is the one decline in this list that a re-reviewer should weigh
        rather than accept." The amendment's own top-level "changes" list entry
        for R2 ("repairs BO-2") does not mention this decline at all -- a
        reader following only the changes summary would conclude BO-2 is fully
        repaired, and would have to separately notice, in a different section
        (declined_objections, not cross-referenced from R2), that one-third of
        BO-2's required_repair was declined rather than performed. That is
        precisely the failure mode this task asked me to check for: not a
        silent drop (D1 does disclose the decline), but a repair claimed in the
        summary that is not fully backed at the point a reader would check it.
      independent_corroboration: >-
        TASK-20260727-012 reached the substantively same conclusion by a
        different bookkeeping route: it scored the F2-unreachability framing
        itself as "REPAIRED_WITH_ONE_OVERSTATEMENT" (a wording nit: "by
        construction and not by assumption" should read "conditional on H3"),
        but separately issued its OWN blocking objection RT-012-BO-4,
        "Declined objection D1 (CTRL-I, s3_eval filter completeness) must be
        adopted; the stated reason for declining is factually incorrect,"
        explicitly stating "The Coordinator invited this overrule; I issue it."
        TASK-20260727-012 also ran CTRL-I itself, read-only, at all 34
        instances (not merely the one 8-bit instance D1 costed), and found 0
        filter violations -- so H3 holds empirically -- but insisted the
        control still be run IN-RUN with a certificate, not merely probed
        outside a run record, because "the residual risk is therefore
        implementational, not mathematical -- which is exactly what a control
        is for." Whether one calls this "BO-2 not fully discharged" (my
        framing, driven by BO-2's literal three-part text) or "a new blocking
        objection of the second round" (TASK-20260727-012's framing), the
        underlying fact both reviews converge on is identical: CTRL-I was never
        added, was requested by the FIRST review as part of BO-2's repair, was
        declined by the amendment with a reason the SECOND review calls
        "factually incorrect" (the claimed marginal cost of "roughly 420 point
        additions" versus the actual marginal cost of "one assertion inside an
        existing loop"), and remains missing at this commit.
      residual_concerns: >-
        CTRL-I (or an equivalent in-run assertion of s3_eval completeness) is
        still absent from both the specification and the amendment. The
        f2_reachability.statement's "by construction and not by assumption"
        phrasing overstates what the amendment establishes; TASK-20260727-012's
        proposed correction ("unreachable by determinism of _find_decomposition
        on frozen inputs, conditional on H3") is more accurate.

    - id: BO-3
      original_title: "Metric semantics break on 7 of 34 instances"
      original_required_repair: >-
        "p_dec_counting_bound := min(1, |S|/N); t_desc_charged_lower_bound :=
        T_attempt * max(1, N/|S|). Report the seven affected instances
        explicitly."
      disposition: "text-of-BO-3 discharged; a serious undisclosed consequence of the discharge is not"
      verification: >-
        The literal required_repair is satisfied exactly. revised_fields.
        metric_definitions.p_dec_counting_bound.v2 = "min(1, |S|/N)" and
        t_desc_charged_lower_bound_gops.v2 = "T_attempt_gops * max(1,
        N/|S|)" -- both match the required formulas verbatim (up to the R5
        threshold's effect on |S|, which is a separate, correctly-applied
        repair). instances_that_can_be_affected.committed_list enumerates
        exactly the seven instances the original review named: N = 5 (8,3), 23
        (8,1), 23 (16,1), 31 (12,1), 37 (12,2), 41 (8,2), 349 (24,3) -- I
        compared this list field-by-field against BO-3's original detail text
        and against adversarial_notes.md section 1.4; they match exactly.
        HOWEVER: flooring the metric at T_attempt for these 7 low-N instances
        necessarily makes charged_ratio_lower_bound = T_attempt/sqrt(N) there,
        which DECREASES in N, while at the other 27 (unfloored) instances the
        same metric INCREASES in N. This is not a hypothetical -- the
        amendment's own direction_of_the_repair paragraph predicts the
        qualitative shape ("the repaired series is therefore non-monotone at
        the low-N end and the SC4 Spearman statistic can only fall or stay
        equal") -- but the amendment states only the SIGN of the effect and
        never computes its MAGNITUDE, despite SC4's own threshold (Spearman >=
        0.9) being a fixed, checkable number sitting one arithmetic step away
        from data already sitting in the amendment's own committed_list. This
        is a repair that is textually correct against BO-3 but leaves the
        protocol's SC4/F3 decidability un-audited at the moment the audit was
        cheapest to do -- before, not after, the numbers were computed by
        someone else.
      independent_corroboration: >-
        TASK-20260727-012 (RT-012-BO-1) computed the consequence the amendment
        left uncomputed: on the repaired metric, Spearman over all 34 instances
        = 0.8143, BELOW SC4's 0.9 threshold, so falsification criterion F3 --
        "the charged ratio fails to increase with N (Spearman < 0.9 or rise <
        10x)" -- FIRES on the amendment's own repaired metric, determinately,
        from committed data, before any run. Both pre-registered diagnostics
        the amendment itself required (the 27-instance restricted statistic and
        the unrepaired-metric statistic) clear 0.9 comfortably (0.9853 and
        0.9904 respectively), which is exactly the asymmetric pattern that
        makes this a genuine finding and not restated protocol paranoia: the
        REQUIRED, decisive statistic fails while both DIAGNOSTIC, non-decisive
        statistics pass. TASK-20260727-012 further flagged that this
        invalidates v1's carried-forward empirical_content_disclosure, which
        the amendment's unchanged_fields list is silent on and which therefore
        remains asserted in a now-false form.
      residual_concerns: >-
        Per RT-012-BO-1's required_repair, the amendment (or a v2_to_v3
        successor) must state the determinate SC4 = 0.8143 / F3-fires outcome
        explicitly and pre-commit an interpretation before any run, and must
        supersede v1's empirical_content_disclosure claim that the charged
        ratio "must grow like sqrt(N)" (false at 7 of 34 instances under the
        R3 floor). Neither has been done as of this commit.

    - id: BO-4
      original_title: "No multi-target baseline; CTRL-E compares a multi-target claim against single-target algorithms only"
      original_required_repair: >-
        "Add CTRL-E2 with both baselines, computed in closed form per instance
        in the same group-operation unit. Zero new runs, zero new
        implementation."
      disposition: discharged_as_literally_required_but_incomplete_relative_to_the_operating_regime
      verification: >-
        R4 / ctrl_e2 adds exactly the two baselines the original review named:
        E2a (exhaustive discrete-log table, N-1 offline additions, N stored
        elements, 0 per-target operations) and E2b (S*T^2 = Omega~(eps*N)
        generic preprocessing frontier at S=T=N^(1/3), citing KN-LIT-013 /
        KN-TECH-005, which BO-4's own detail text also cited). Both are
        closed-form, per-instance, in group-operation units, with zero new runs
        and zero new implementation -- matching the required_repair verbatim.
        honest_caveats_to_be_reported_verbatim correctly discloses that E2b is
        an online-cost/advice-size comparison only (CGK's offline phase is
        unbounded) and that "a K* finite against a single-target baseline and
        infinite against a multi-target baseline is a statement about which
        baseline the claim was compared to, not a new mathematical fact" --
        this is exactly the caution the target profile and claims-and-
        verification.md require for a cost-model claim. On its literal text,
        BO-4 is discharged.
      independent_corroboration: >-
        TASK-20260727-012 (Q4, Q6) confirmed every closed-form CTRL-E2 value it
        could check (S_rel/N = 2287 at 36-bit seed 2, the four headline
        per-target ratios 9.91/13.20/23.11/12.82, k_star_vs_frontier = infinity
        at all 34 instances not merely the four headline ones) and separately
        adjudicated the one open arithmetic dispute (integer cube root 3232,
        not 3240) that the amendment had left unresolved. It also raised a NEW
        objection, RT-012-BO-3, that CTRL-E2 omits the one multi-target
        baseline that is actually tight at the operating scale (van
        Oorschot-Wiener / Kuhn-Struik multi-target rho, c*sqrt(K*N) total for K
        targets), noting this omission is favourable to the amendment's own
        conclusion and therefore a completeness objection rather than a
        correctness one.
      residual_concerns: >-
        This completeness gap (missing multi-target-rho baseline, RT-012-BO-3)
        is outside BO-4's literal required_repair text and is not, on its own,
        a reason to say BO-4 is undischarged -- but it is a reason the amended
        protocol as a WHOLE still cannot pass a from-scratch independent
        re-review, which is the practical question this task actually turns
        on.

    - id: BO-5
      original_title: "The |S| invalidation threshold is not tight"
      original_required_repair: >-
        "Set the invalidation threshold to 4*C(14,2) + 2*14 = 392, keep 420 as
        the loose derivation bound, and record min(392, #E - 1) as the binding
        constraint at 8-bit."
      disposition: discharged
      verification: >-
        revised_fields.reachable_set_bound sets tight_maximum: 392 with the
        exact derivation (364 off-diagonal + 28 diagonal), retains 420 as
        loose_bound_retained "so the v1 arithmetic stays auditable", sets
        invalidation_threshold.v2 to exactly 392 ("Every value in [393, 420] is
        necessarily defective and the v1 rule would have passed it" --
        matching BO-5's own detail text), and records
        second_binding_constraint: "|S| <= min(392, #E - 1)" with the 8-bit
        curve orders (#E roughly 115-273) named as the actually-binding
        quantity there. This matches the required_repair exactly, field for
        field.
      independent_corroboration: >-
        TASK-20260727-012 (Q2) independently re-derived the same bound from
        harness/semaev.py::_find_decomposition and additionally measured it:
        "|S| = 392 at 24 of 34 instances (every instance from 16-bit seed 2
        upward), and never exceeds 392. Max |S| over 8-bit instances = 191". So
        392 is not merely a corrected upper bound but the exact attained
        supremum -- a stronger result than the amendment claims for itself, and
        consistent with it.
      residual_concerns: none.

  additional_checks_requested_by_this_task:
    - question: >-
        Does the amended protocol still reference the correct EXP-IC-001
        decomposition data (68-of-748 runs with decomposition_found true)?
      answer: YES, CONFIRMED.
      detail: >-
        verified_source_record.totals in v1_to_v2.yaml states
        runs_with_decomposition_found_true: 68 out of runs: 748, with
        certificate_kind_census {none: 646, decomposition: 68, discrete_log:
        34} and the reconciliation 680 + 68 = 748. This is identical to the
        census TASK-20260727-004 (RT-20260727-001) reported, identical to what
        TASK-20260727-012 independently re-derived a second time from raw
        bytes at a different commit, identical to EV-IC-002's certificate_refs
        and observations.OBS-1/OBS-2, and identical to the count named in this
        task's own background section. Four independent readings agree
        (EV-IC-002's own replication_map calls this "quadruple_derivation_
        agreeing"). I did not re-open all 748 raw-result.json files myself in
        this document-only review; I checked internal consistency across four
        independently-authored sources instead, which is the load-bearing
        replication this record itself relies on.
    - question: >-
        Does the CTRL-G / stopping-rule interaction now actually let the
        primary arm proceed past instance 1?
      answer: YES, CONFIRMED.
      detail: >-
        v1's stopping rule 4 fired on ANY CTRL-G disagreement with a "0
        decompositions" expectation, which instance 1 (8-bit seed 1, 9 of 10
        committed targets decompose) would have violated immediately. v2's
        stopping rule 4 fires only on disposition G-c (>7 disagreeing
        instances) or G-d (reuse-contract failure); the per-instance
        expectation table now has exactly 7 nonzero entries matching what a
        deterministic re-run of the same code path on the same frozen inputs
        will reproduce, so instance 1 lands in disposition G-a (exact
        agreement) at worst G-b (tolerated local disagreement), either of which
        continues the arm. This specific execution-blocking defect --
        "executed exactly as frozen, the primary arm halts on instance 1 of 34
        and produces nothing" (adversarial_notes.md section 0) -- is genuinely
        fixed. TASK-20260727-012 confirms this in its own words: "so a
        legitimate 8-16 bit decomposition no longer halts the primary arm at
        instance 1 of 34."

  heuristic_and_control_notes_beyond_BO_1_through_BO_5:
    - topic: "Null-object control for heuristic H2 (controls-before-belief, docs/inventor-protocol.md section 3)"
      finding: >-
        The amendment records H2 ("S behaves like a uniform random subset of E
        when intersected with <P>") as SUPPORTED_AT_LOW_N_UNTESTABLE_AT_HIGH_N
        and explicitly declines (D4) the cheapest available null-object check
        -- comparing measured |S| against the random-subset prediction
        #E*(1-exp(-392/#E)) -- calling it out of scope. This is exactly the
        kind of untested null-model assumption this program's controls-before-
        belief rule exists to catch. TASK-20260727-012 performed the check
        anyway (read-only, not archived as a run) and found the null model
        DOES fail at 2 of the 4 decision-bearing headline instances (z = +3.97
        and +2.93 against the uniform null |S|/h), in the ANTI-conservative
        direction (real yield larger than the counting model predicts, though
        by only 1.2x-1.4x against roughly seven orders of magnitude at stake,
        so it does not change any conclusion). This does not change my
        BO-1..BO-5 verdicts (D4 was never one of the five blocking items), but
        it is a concrete instance of exactly the failure mode AGENTS.md's
        controls-before-belief language warns against: an assumed uniform null
        was left unchecked in the frozen protocol, and when checked, it did not
        hold. I record this per my role's obligation to flag a reported
        quantity that was not measured against a null object of the matching
        shape.
    - topic: "Heuristic H4 (wall-time-to-group-operation calibration) unnumbered"
      finding: >-
        Both the amendment and its predecessor leave the calibration
        assumption -- that rho's total_group_operations/wall_seconds
        faithfully converts Groebner wall-time into group-operation
        equivalents -- unnumbered and untested, despite the committed
        calibration factors spanning a 2.66x range that TASK-20260727-012
        shows moves the UNCHARGED crossover threshold in N by about 7.1x. This
        is not one of BO-1..BO-5 and does not change my verdict, but it bears
        directly on whether any future PASS on this contract could support
        even the toy-tier conclusion it targets.

