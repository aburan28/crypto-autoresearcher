    control CTRL-I -- was explicitly declined rather than performed, with the
    amendment's own text conceding this is "the load bearing decline" a
    re-reviewer should weigh rather than accept. Independently of BO-2, the
    mechanically-correct BO-3 repair (capping/flooring the two metric
    definitions) has an undisclosed consequence: on the repaired metric, SC4's
    Spearman statistic over all 34 instances is 0.8143, below its own 0.9
