  # ===================================================================
  # 1. Independent recomputation of stage 0/1/2 gates
  # ===================================================================
  metric_recomputations:
    - check: 'Stage 1 fixture: q_maj(N=23, s=3, interval partition) = 284/529'
      method: >-
        Own brute-force script (fresh process, no repo code read at the
        time): built the interval partition directly from its stated
        definition (fiber j = {k : k in [j*n/s, (j+1)*n/s)}) and computed
        q_maj by exhaustive enumeration of all 529 pairs mod 23, taking
        argmax_m N_{ijm} per (i,j) — the same closed-form q_maj definition
        the contract states, independently coded.
      result: 'Fraction(284, 529) exactly, matching the frozen fixture and RUN-ECDLP-56ee42-S1.'
      blindness: true
      disposition: CONFIRMED

    - check: 'Stage 2 POS-A: A((-1)^k) -> 2/pi at n = 131113, 525361, and a third size'
      method: >-
        Own FFT script (fresh process, before reading estimator.py):
        v_k = (-1)^k, A(v) = max_{a != DC-excluded... } |FFT(v)|_max / n
        exactly as the contract's estimator.iii defines it. Also cross-
        checked with a closed-form geometric-series formula for the same
        quantity, independently.
      result: >-
        n=131113: A = 0.6366197723828103 (recorded S2 value: identical to
        11 significant digits); n=525361: A = 0.6366197723685297
        (recorded: identical). Both converge to 2/pi = 0.6366197723675814.
      blindness: true
      disposition: CONFIRMED

    - check: 'Stage 2 POS-B: fitted beta and the [0.5,2]xn^-0.21 band, from the six raw A(POS-B) values in RUN-ECDLP-56ee42-S2'
      method: 'Own log-log least-squares fit (numpy.linalg.lstsq) on the six (n, A) pairs copied verbatim from the raw JSON.'
      result: >-
        beta = 0.1704557466010138 (recorded: 0.17045574660101379 —
        identical to float precision); band check
        0.5*n^-0.21 <= A <= 2*n^-0.21 holds at all six rungs, matching
        recorded band_pass: true and gate_pass: true.
      blindness: false
      blindness_note: 'Regression only; does not require reading the estimator implementation, but performed after S2 raw-result.json (not estimator.py) was read.'
      disposition: CONFIRMED

    - check: 'Stage 2 CONTROL-C: post/pre survival ratios per rung'
      method: 'Recomputed A_noDC_post_shuffle_max / A_noDC_pre_shuffle directly from the eight numbers already reported per rung in RUN-ECDLP-56ee42-S2.'
      result: >-
        T17..T27: 0.7847, 0.9343, 0.8285, 0.7799, 0.8554, 0.8130 — matches
        DEC-20260904-92dec2's cited 0.785, 0.934, 0.828, 0.780, 0.855,
        0.813 to displayed precision. All six exceed the frozen 0.5
        threshold, so gate_pass: false is confirmed correct.
      blindness: true
      disposition: CONFIRMED

    - check: 'Stage 0 gate_P3: fitted L1 growth exponents for t, r (is_polylog threshold 0.1)'
      method: 'Own log-log least-squares fit on the raw per-rung L1 values in RUN-ECDLP-56ee42-S0.'
      result: >-
        t_L1 alpha = 1.401980 (recorded 1.401980320324224); r_L1 alpha =
        1.401785 (recorded 1.4017846568149495). Both >> 0.1, so
        is_polylog: false / arm_dropped: false / F1: false is confirmed
        correct for both arms.
      blindness: true
      disposition: CONFIRMED

    - check: 'Stage 0 raw spectral norms at T21 (p=2097169): t, r, comparator L1'
      method: >-
        Independent re-implementation (own script) of the Thue-Morse sign,
        the Rudin-Shapiro recursion r(0)=r(1)=1, r(2m)=r(m), r(2m+1)=-r(m),
        and the top-bit comparator, applied to x = 0..p-1 directly (this
        computation never touches curve arithmetic — Stage 0's spectral
        norm is a function of x alone, not of enumerated points), then one
        length-p FFT each.
      result: >-
        t L1 = 717522016.0036793 (recorded: identical); r L1 =
        718196597.0195143 (recorded: identical); comparator L1 =
        11063466.790552605 (recorded: 11063466.790552609, agreeing to 11
        significant digits, floating-point-summation-order noise).
      blindness: false
      blindness_note: >-
        Performed AFTER reading estimator.py (I needed the exact
        Rudin-Shapiro recursion, which diverges from the contract's
        literal "count of 11-blocks" wording — see finding
        rudin_shapiro_definition below). This is REPLICATION, not the
        blind rederivation TASK-20260904-410404 calls for; see
        procedural_finding.
      disposition: CONFIRMED (as replication)

    - check: 'Stage 2 combined gates / validity / validity_reason'
      method: >-
        Recomputed the boolean AND of {POS-A: true, POS-B: true,
        CONTROL-C: false, static_provenance: false} and confirmed
        validity = "gate_failure" with validity_reason naming exactly the
        two failing keys.
      result: 'Matches RUN-ECDLP-56ee42-S2 exactly.'
      blindness: true
      disposition: CONFIRMED

    - check: 'Static-provenance T3 flag: does rudin_shapiro_sign_array read the discrete-log coordinate k?'
      method: >-
        Direct read of estimator.py lines 99-114. The function signature
        is `rudin_shapiro_sign_array(xs)`; its `k` is a local bit-length
        loop counter used only to fill the recursion level-by-level
        (`k = 1; while (1 << k) < n: ...; k += 1`). No parameter, closure,
        global, or discrete-log-indexed array read anywhere in the
        function body.
      result: >-
        Confirms DEC finding F-static: the scanner's token match on the
        identifier "k" is a false positive; the contract's actual
        intent ("no T-arm/comparator code path reads the discrete-log
        coordinate k") is satisfied.
      blindness: false
      disposition: CONFIRMED

    - check: 'Curve ladder construction (design/ladder.json, design/select_ladder.py)'
      method: >-
        Read both files. select_ladder.py does real point-counting (QR-
        table identity N = 1 + 2*sum(qr[f]) - z) and enforces N prime,
        N != p, j != 1728 mod p, and the target bit-cell, deterministically
        (no seed). ladder.json's per-rung `checks` block records all four
        conditions as true for all six rungs.
      result: 'Curve exclusions (KN-TECH-034 as cited) are satisfied by construction; no issue found.'
      blindness: false
      disposition: CONFIRMED

  # ===================================================================
  # 2. C1 / C2 mathematical soundness — worked counterexamples
  # ===================================================================
  control_checks:
    - control: 'C1 (T4 survival band [0.70, 1.10])'
      attack: 'Identity (no-op) permutation applied as "NULL-2".'
      analysis: >-
        Under the identity permutation, post-shuffle values equal
        pre-shuffle values exactly, so the survival ratio is exactly 1.0
        for ANY statistic, including T4. 1.0 lies inside [0.70, 1.10].
      result: >-
        CONFIRMED: C1 alone admits this broken shuffle, exactly as the
        amendment's own disclosed_limitations states. This is not
        empirical, it is a property of the band containing 1.0.
      disposition: CONFIRMED (amendment's self-diagnosis verified)

    - control: 'C1 (T4 survival band), a second broken-shuffle case'
      attack: 'Pure cyclic rotation, v_shuffled[k] = v[(k+shift) mod n], as "NULL-2" (a plausible off-by-one/indexing bug, not just literal identity).'
      analysis: >-
        A cyclic shift is a group translation; it changes the phase of
        every DFT coefficient by e^{i*2*pi*a*shift/n} but leaves
        |V_a| exactly unchanged for every a. A_noDC (a max-magnitude
        quantity) is therefore IDENTICAL before and after a cyclic shift,
        for ANY input sequence — not an approximation.
      result: >-
        This is a second, structurally different broken "shuffle"
        (not merely the trivial identity) that also produces ratio = 1.0
        and so also passes C1 undetected. It shows C1's blind spot is not
        limited to a literal no-op.
      disposition: NEW FINDING (not in the amendment's disclosed_limitations; supports the amendment's own conclusion that C1 needs a partner)

    - control: 'C2 (comparator collapse <= 0.5), against both broken-shuffle cases above'
      analysis: >-
        Both the identity and the cyclic-rotation "shuffle" leave
        A_noDC(comparator) exactly unchanged (ratio = 1.0) by the same
        arguments as above (trivial for identity; exact DFT-magnitude
        invariance for cyclic rotation). Since 1.0 > 0.5, C2 REJECTS both
        broken shuffles.
      result: >-
        CONFIRMED: C2, unlike C1, correctly rejects both worked
        counterexamples. This matches the Coordinator's own stated prior
        in TASK-20260904-410404's review_plan ("under either of them the
        comparator's post-shuffle max equals its pre-shuffle value...
        C2 fails"). The two-sided pair (C1+C2) is a genuine improvement
        over C1 alone for these two failure modes.
      disposition: CONFIRMED

    - control: 'C2, order-of-magnitude plausibility of the <=0.5 threshold for a genuine (non-broken) shuffle'
      analysis: >-
        Rough back-of-envelope only (no data; the comparator's DL-order
        A_noDC has not been measured — this is exactly what the
        calibration run is for). The Weil-bound "point structure" scale
        for the comparator is ~ log(p)/sqrt(n); the random/marginal
        floor scale (per H1's own formula) is ~ sqrt(log n / n). Their
        ratio grows like log(p)/sqrt(log n), e.g. ~4x at T27
        (n=134234689). If point structure genuinely dominates by a
        factor of several, a shuffle that fully destroys it while
        leaving the floor intact would plausibly clear a 2x-reduction
        (ratio <= 0.5) bar.
      result: >-
        This is a PLAUSIBILITY check only, with unknown multiplicative
        constants on both sides — it is not a substitute for measuring
        it, and I did not run any code or curve arithmetic to sharpen it
        (per the "do not run any experiment" constraint). It does not
        contradict the amendment's own disclosed concern that the
        comparator could be marginal-dominated; it only says the
        threshold is not obviously infeasible on the numbers available.
      disposition: INCONCLUSIVE (informative, not decisive)

    - control: 'C2 calibration run design — completeness for interpreting its own outcome'
      finding: >-
        BLOCKING GAP. As specified ("T4 + comparator, six rungs, pre + 8
        shuffles, cached enumeration"), the calibration run has no
        null/no-structure reference (e.g. even a handful of NULL-1
        keyed-random replicates) for the comparator at the same n. If C2
        fails, or passes only marginally, there is no way from the run's
        own data to tell whether that is because NULL-2 is broken (the
        interpretation effect_on_stop_rule assumes: "F3 stands... every
        digit number is void") or because the comparator's pre-shuffle
        A_noDC was itself close to the null floor to begin with (a bad
        choice of positive control, which the amendment's own
        disclosed_limitations for C2 already flags as a live possibility,
        but does not provide a way to detect from the calibration run as
        designed).
      recommendation: >-
        Add a small NULL-1 sample (a handful of seeded replicates suffice
        for a sanity comparison — the full 256-replicate NULL-1 run is
        Stage 3's job, not this calibration's) for the comparator, and
        ideally also for T4, at each of the six rungs, reusing the
        already-cached enumeration. Record it explicitly as part of the
        C2 calibration run's raw-result.json so a pass, fail, or
        borderline C2 outcome can be read against the "no structure"
        scale at the same n, not only against the fixed 0.5 threshold.
      disposition: REVISE — this must be added to the calibration run's design before dispatch.

  # ===================================================================
  # 3. DEC-20260904-92dec2 accuracy check
  # ===================================================================
  dec_accuracy_check:
    - item: 'F-static finding (T3 false positive)'
      verdict: ACCURATE — independently confirmed by direct code read (see metric_recomputations above).

    - item: 'F-control finding (CONTROL C gate: miscalibrated known answer, not an instrument/hypothesis failure)'
      verdict: >-
        ACCURATE in its central claim and in its per-rung T4 survival
        ratios (independently reproduced exactly). The mechanism argument
        (a matched-marginal/multiset-preserving shuffle preserves
        marginal-driven excess and destroys point-structure-driven
        excess) is correct and is the right reading of both the o2-lane
        source and result document (see next item).

    - item: >-
        DEC's numeric citation "the G-1 survival ratios are 0.97-0.99
        (popcount) and 0.79-0.98 (digitsum)"
      verdict: >-
        digitsum range CONFIRMED (independently recomputed: 0.7871 to
        0.9766, i.e. "0.79-0.98"). popcount range NOT ACCURATE AS STATED:
        independently recomputed from the same RT-EXP-1-RESULT.md table,
        the true range is 0.9207 to 0.9916 ("0.92-0.99"), not "0.97-0.99".
        The minimum occurs at p=1033 (G 2.5702 -> SHUF 2.4457, ratio
        0.9207). This is a minor citation error in the DEC's own evidence
        bullet; it does not change any threshold, gate, or the C1 band
        derivation (0.92 remains comfortably inside [0.70, 1.10], and the
        qualitative "survives, does not decay" reading is unaffected).
        Recommend a superseding correction note per the record-immutability
        rule (do not edit DEC-20260904-92dec2 in place).

    - item: >-
        "KNOWN AMBIGUITY" flagged for the review round: the o2 code
        comment ("A positive alpha that SURVIVES this is signal; one that
        does not is imbalance") vs. the result document's reading
        (survival of popcount/digitsum = imbalance)
      verdict: >-
        RESOLVED by this review, in DEC's favor. Read rt_exp_1.py in full
        around the SHUF branch: the comment is about the shuffled
        variant's OWN alpha. Mechanistically, a matched-marginal shuffle
        preserves whatever marginal imbalance drove the unshuffled alpha,
        so an alpha that is IMBALANCE-driven will still be positive after
        shuffling (it "survives"); an alpha that is genuine
        sum-compatible STRUCTURE will be destroyed by the shuffle (it does
        NOT survive). This is exactly the numeric pattern in the table: P2
        dlog-int [old ctrl] — the one genuine positive control — has its
        alpha flip from +0.375 to -0.634 and its G collapse ~20x under
        shuffle (does NOT survive, and the result document calls it
        signal); popcount and digitsum keep nearly the same alpha and G
        under shuffle (DO survive, and the result document calls them
        imbalance). The code comment's wording is therefore backwards
        relative to its own analysis and to the result document — a
        wording slip, not an analysis error — and DEC's reliance on the
        result document's reading (survival = imbalance) is the correct
        one. This should close the red team's assigned open item rather
        than being re-derived from scratch.

    - item: 'Overall characterization of the stage-2 stop ("a defect in the frozen control calibration, not the instrument or hypothesis")'
      verdict: >-
        ACCURATE for CONTROL-C. For the static-provenance failure it is
        also accurate (scanner defect, not a real k-dependence). Both
        conclusions are independently reproduced above from the raw
        records, not merely restated from the DEC.

  # ===================================================================
  # 4. Other observations (non-blocking)
  # ===================================================================
  limitations:
    - >-
      Run-record format gap (flagged in the task and independently
      confirmed): RUN-ECDLP-56ee42-S0/S1/S2 carry only raw-result.json
      (plus vacuity-derivation.md for S0 and static-provenance-check.json
      for S2) — no manifest.yaml, command.txt, environment.json,
      stdout.log, or stderr.log, contrary to AGENTS.md's Artifact Policy.
      Concretely: experiments/EXP-ECDLP-56ee42/implementation/runrecord.py
      already implements exactly that writer (write_run_record, with git
      commit/dirty state, environment, seeds, inference block, resources)
      but is never imported or called by stage0.py, stage1.py, or
      stage2.py's main(). This is a cheap, mechanical fix (wire
      runrecord.write_run_record into each stage driver) that the
      archiving Coordinator or the executor should make before or
      alongside the C2 calibration run, so that new run has proper
      provenance rather than adding to the raw-result.json-only debt.
    - >-
      RUN-ECDLP-56ee42-S1's raw-result.json hash-binds
      runs/stage-cache/rung_T*_x.npy / _y.npy (x_sha256/y_sha256), but
      these .npy files are not present anywhere in the current working
      tree (confirmed by `find . -iname "*.npy"` returning nothing under
      the experiment). They appear to be regenerable local cache, not a
      committed artifact, which is fine if intentional and re-verified by
      hash whenever regenerated — but the amendment's C2 calibration run
      explicitly says it is "reusing the stage-cache enumeration," so
      whoever runs it should confirm the cache is regenerated
      deterministically (stage1.py) and hash-matches before treating any
      cached x/y arrays as identical to Stage 1's.
    - >-
      docs/task-lifecycle.md's protocol_amendment schema calls for
      version_from/version_to, `affected_runs`, and a `confirmatory_status`
      (preserved | reset | exploratory_only) field. amendments/
      v2_control_c_recalibration.yaml uses a different, unmatched shape
      (experiment/version/supersedes/rationale/changes) and states the
      same information narratively (the frozen prediction is unchanged;
      RUN-ECDLP-56ee42-S2 is the affected run) but names neither field
      explicitly. Note: templates/research-records.md, which CLAUDE.md
      designates as the authoritative schema source, does not itself
      define a protocol_amendment template, so this is not a template
      violation, only a minor divergence from docs/task-lifecycle.md's
      example shape. Non-blocking; recommend adding explicit
      `confirmatory_status: preserved` and `affected_runs:
      [RUN-ECDLP-56ee42-S2]` fields for machine-readability if the
      amendment is revised for the C2-calibration gap above.
    - >-
      C3 (the amended static-provenance check) is a stated requirement,
      not yet implemented: the current scanner is a naive regex/text scan
      of function bodies for the bare token "k", and the amendment asks
      for a data-flow-level check (parameter/closure/global/discrete-log-
      indexed). A regex-based "is this k inside a string/comment"
      approximation is fragile; recommend an AST-based check (e.g.
      inspect each function's `ast.arguments`, enclosing-scope free
      variables, and global names) rather than another text-pattern
      heuristic, to avoid re-creating a different false positive/negative
      of the same kind.
    - >-
      This review did not execute any stage of EXP-ECDLP-56ee42 and
      created no run records; all independent recomputation above was
      done in throwaway scripts outside the repository, using only the
      raw JSON already committed at 5e709a5c6 and (for the T21-norm and
      code-provenance checks) the committed implementation files.

  heuristic_validation_checks:
    - check: pre_registered_prediction
      result: >-
        CONFIRMED present and prior to any run: specification.yaml's
        preregistered_prediction (the two-branch rule, POS-A/POS-B
        expected bands) is part of the v1 contract frozen and approved
        2026-09-03, before TASK-20260903-087076 executed any stage.
    - check: sample_integrity
      result: >-
        Seed schedules (NULL-1 SplitMix64 key construction; NULL-2
        BASE_SEED + 1000 + 10*arm_index + shuffle_index) are declared in
        the frozen contract and, for NULL-2, independently checked against
        stage2.py's ARM_INDEX table (COMPARATOR already has arm_index 4,
        so the C2 calibration run's shuffle seeds are already
        well-defined and require no new seed derivation). NULL-1 has not
        yet been exercised (deferred to Stage 3); not assessable yet.
    - check: correspondence_validity
      result: 'N/A — this experiment uses complete enumeration, not a substitute-sampling correspondence.'
    - check: scale_binding
      result: >-
        CONFIRMED disclosed: scale_relevance.tier = toy, 17-27 bits, with
        an explicit "TRANSFER TO CRYPTOGRAPHIC n IS AN EXPLICIT UNLICENSED
        EXTRAPOLATION" statement and a stated bias direction (toy scale
        biases toward apparent structure). No transfer is claimed by the
