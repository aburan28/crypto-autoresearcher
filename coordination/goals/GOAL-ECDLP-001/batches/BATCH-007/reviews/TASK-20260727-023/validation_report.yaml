      holds: true
    criteria_that_fire:
      F1: fires at I1 and at I4
      F1_detail: alpha(E) > alpha(A) at I1 (11 > 9) and at I4 (29 > 1)
      F2: does not fire at any instance
      F3: does not fire at any instance
      F4: does not fire (S4 holds at all four instances)
    verdict_recomputation:
      contract_verdict_rule_applied: >-
        `obs1_falsified` — at least one of F1, F2, F3 fires. The Executor
        recorded `obs1_falsified` and `arm_D_verdict: S4_satisfied`. Both
        recompute correctly from the measured values.
      executor_recorded_verdict: obs1_falsified
      validator_recomputed_verdict: obs1_falsified
      agrees: true
    consequence_recorded_not_adjudicated: >-
      The frozen contract fixes the consequence in advance: if F1 fires, OBS-1
      and RT-OBJ-1 must be withdrawn or rescoped by a superseding record,
