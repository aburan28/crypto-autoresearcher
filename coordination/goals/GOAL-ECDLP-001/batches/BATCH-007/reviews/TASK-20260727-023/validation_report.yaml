      I2: {alpha_A: 2, misaligned: 5, holds: true, equality: false}
      I3: {alpha_A: 4, misaligned: 4, holds: true, equality: true}
      I4: {alpha_A: 1, misaligned: 1, holds: true, equality: true}
      holds_everywhere: true
      extra_observation: >-
        alpha <= misaligned_row_count holds in all 16 (arm, instance) cells,
        not only arm A, with equality in 9 of 16.
    S4_arm_D:
      I1: {B_mod_3: 0, exit_code: 0, IndexError_at_451: false, matches_S4: true}
      I2: {B_mod_3: 1, exit_code: 1, IndexError_at_451: true, matches_S4: true}
