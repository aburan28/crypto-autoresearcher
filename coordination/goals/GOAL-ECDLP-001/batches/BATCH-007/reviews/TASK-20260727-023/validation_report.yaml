      residual: >-
        rank_M for arms B, C and E at I3/I4 remains cross-checked only by the
        driver's own fast implementation. rank_M and rank_deficiency are
        secondary metrics and enter no success or falsification criterion.

  criteria_evaluation_on_recomputed_values:
    note: >-
      Recomputed from this session's own re-execution, not copied from
      ablation_summary.json. Reported as a mechanical arithmetic fact about
      the frozen criteria; the Validator does not adjudicate what it means.
    S1_alpha_E_le_alpha_A:
