  reproducibility:
    executor_claim: >-
      Re-execution at the same commit into an independent output root with
      zero differences (asserted in the snapshot commit message).
    validator_finding: >-
      Independently corroborated at the level that matters. This session did
      not re-run the executor's driver; it re-derived every measured quantity
      from separately written code against the same committed harness, which
      is a strictly stronger check for the primary metrics. All 16 primary
      cells, all 16 alternate-shift cells, all 16 misaligned_row_count cells,
      all four instance parameter sets, all four arm-D exit behaviours, arm-E
      dedup counts at all four instances, arm-A dedup counts at all four
      instances, and arm-A rank_M at I3/I4 reproduce exactly. Zero
      disagreements of any kind.
    arm_E_cells_reproduced: [I1, I2, I3, I4]
    arm_E_reproduction_note: >-
      Arm E is the arm that falsified the prediction, so all four of its cells
      were re-executed rather than one. The two F1-firing cells (I1: 11 vs
      predicted 0; I4: 29 vs predicted 1) both reproduce exactly.
    determinism: >-
      The contract's determinism claim holds in practice: two independent
      implementations, in two sessions, at two times, produce bit-identical
      integers. In-run `determinism_check` is `pass` at I1 and I2 for arms A,
      B, C and E (IV-7 not triggered) and `not_required_at_this_instance` at
      I3/I4 as the contract specifies.
    validator_reexecution_wall_seconds: {I1: 0.07, I2: 0.13, I3: 5.35, I4: 87.76}

  deviation_assessment:
    - id: DEV-1
      deviation: Execution order B, A, C, E, D within each instance rather than A, B, C, E, D
      independently_verifiable: true
      how: >-
        The 20 manifest timing windows are distinct, non-overlapping and
        ordered exactly B, A, C, E, D within each of I1..I4. The order is also
        stated in ablation_summary.json.execution_order with its rationale.
      compromises_primary_result: false
      reasoning: >-
        Every arm is a deterministic function of (field_bits, requested_seed)
        and the committed harness; the contract states there is no unseeded
        randomness anywhere. Order can only matter through cross-arm caching,
        and the caches are used only for equality assertions (IV-5, IV-6) and
        for the arm-A append replay, never as a substitute for a measurement.
        This session's re-execution used a different order again (A, B, C, E
        per instance) and got identical numbers, which settles it empirically.
    - id: DEV-2
      deviation: Arm E re-collects base rows with _collect_relations rather than reusing arm C's list by identity
      independently_verifiable: true
      how: >-
        raw.assertions.base_rows_source and base_rows_equal_arm_C in each
        arm-E record.
      compromises_primary_result: false
      reasoning: >-
        This is a strengthening, not a weakening. IV-6 requires arm E's base
        rows to equal arm C's; the driver re-collects and then asserts
        element-wise equality against arm C's cached list, which both
        satisfies IV-6 and additionally demonstrates that _collect_relations
        is deterministic. The assertion is true at all four instances, and
        this session independently confirmed the equality, so the arm-E rows
        are exactly arm C's rows however they were obtained.
    - id: DEV-3
      deviation: dedup_suppressed_count for arm A reconstructed by replaying the append rule over arm B's rows
      independently_verifiable: true
      how: raw.append_replay and raw.assertions.append_replay_reproduces_arm_A_rows in each arm-A record.
      compromises_primary_result: false
      soundness_verdict: SOUND — independently confirmed, not merely plausible
      reasoning: >-
        Three separate grounds. (i) The necessity is real: the count lives
        inside harness/endomorphism_la.py::_collect_relations, which the
        contract forbids modifying, so it cannot be read out directly. (ii)
        The driver's replay is a term-for-term transcription of lines 292-304
        including the `len(relations) >= num_targets` bound at line 270, and
        it asserts that the replayed row list equals arm A's actual row list;
        that assertion is true at all four instances, and since the replay
        operates over the identical evolving `relations` list from the
        identical base sequence, identical output implies identical
        intermediate states and therefore an identical rejection count. (iii)
        Decisively, this session derived the same counts by a different
        method: an instrumented transcription of the whole m==2 branch of
        _collect_relations with a suppression counter added, asserted equal to
        the committed harness's own output. It returns 6, 0, 2, 0 at I1..I4 —
        exactly the committed replay-derived values. Independent of all this,
        dedup_suppressed_count is a SECONDARY metric and enters no S or F
        criterion, so it could not have moved the primary result in any case.
    - id: DEV-4
      deviation: rank_M implemented by the driver; reference cross-check `pass` at I1/I2, `not_computed` at I3/I4
      independently_verifiable: true
      how: raw.assertions.rank_M_crosscheck in every arm A/B/C/E record.
      compromises_primary_result: false
      reasoning: >-
        The contract itself notes that the committed matrix_rank_mod is a
        closure inside _measure_displacement_rank and is not reachable, and it
        asks only for "the committed matrix_rank_mod semantics". The driver
        discloses the gap rather than hiding it. rank_M and rank_deficiency
        are secondary metrics feeding no criterion. This session closed part
        of the gap by computing the pure-Python reference rank for arm A at
        I3 (174) and I4 (330); both agree with the recorded values. Arms B, C
        and E at I3/I4 remain single-implementation; recorded as limitation
        L-3.
    - id: DEV-5
      deviation: Two out-of-repository dress rehearsals disclosed by the executing session
      independently_verifiable: false
      how: >-
        Nothing in the committed tree records them. The driver's `--out-root`
        flag is documented "rehearsal only", and no committed run's
        command.txt carries it, which confirms that the 20 committed runs are
        production runs — but says nothing about how many rehearsals preceded
        them.
      compromises_primary_result: false
      reasoning: >-
        A rehearsal could compromise a confirmatory experiment only by feeding
        its outcome back into the criteria or the predictions. That route is
        closed cryptographically here: specification.yaml is byte-identical
        (blob 1c6f10b7) at the pre-execution freeze commit 92268c9e and at the
        snapshot c79e3a8d, so no criterion, threshold or prediction was
        touched after any rehearsal. A rehearsal could still have influenced
        the driver's implementation, but the primary metrics are produced by
        direct calls into the unmodified committed harness and have been
        reproduced here by independent code, so implementation choice cannot
        account for them. Residual concern is disclosure hygiene, recorded as
        defect D-VAL023-2, not result integrity.
  deviation_assessment_overall: >-
    None of the five disclosed deviations compromises the primary result.
    Four are independently verifiable from the committed artifacts and were
    verified; the fifth (rehearsals) is unverifiable from artifacts but is
    neutralised by the byte-identical pre-execution contract freeze.

  contract_freeze_check:
