    - id: C2
      cmd: git merge-base --is-ancestor c79e3a8d HEAD
      result: exit 0 — reachable from HEAD. CONFIRMED.
    - id: C3
      cmd: git diff-tree --no-commit-id -r --name-status c79e3a8d
      result: >-
        123 entries, all status A. 20 run directories x 6 files (120), plus
        driver/ablation_driver.py, results/ablation_summary.json,
        results/run_index.json. Every path is under
        experiments/EXP-STR-003/{driver,results,runs}, i.e. inside
        TASK-20260727-021's declared write_scope. CONFIRMED.
    - id: C4
      cmd: git diff-tree --no-commit-id -r --name-only c79e3a8d | grep -c '/\._'
      result: 0 AppleDouble sidecars committed. `.gitignore:9` carries `._*`. CONFIRMED.
    - id: C5
      cmd: git rev-parse 92268c9e:experiments/EXP-STR-003/specification.yaml c79e3a8d:experiments/EXP-STR-003/specification.yaml
      result: >-
        Both resolve to blob 1c6f10b7ba4db293126504c19b4fe9c931b257f3;
        `git diff 92268c9e c79e3a8d -- experiments/EXP-STR-003/specification.yaml`
