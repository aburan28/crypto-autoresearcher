      I2: {alpha_B: 52, half_alpha_C: 27.0, holds: true}
      I3: {alpha_B: 197, half_alpha_C: 100.5, holds: true}
      I4: {alpha_B: 386, half_alpha_C: 191.0, holds: true}
      holds_everywhere: true
    S3_alpha_A_le_misaligned_row_count_A:
