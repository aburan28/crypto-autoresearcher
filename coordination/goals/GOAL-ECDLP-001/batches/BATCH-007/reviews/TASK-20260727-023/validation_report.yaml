        `factor_base_equals_partner` true at all four instances (partner A);
        arity, quota, instance and shift held fixed; independently reproduced.
    - id: CTRL-3
      control: Arm E, phi-free positive control on the null (the decisive control)
      status: pass
      evidence: >-
