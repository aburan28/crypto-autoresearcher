      status: pass
    - id: AC-16
      check: No interpretation in the deliverables (TASK-20260727-021 completion gate)
      observed: >-
        A scan of all 20 run directories and both results files for
        conclusion-language found none. ablation_summary.json's
        `verdict_rule_note` states only that the verdict is computed
        mechanically. Interpretation appears only in the snapshot commit
        message, which is the Coordinator's record, not the Executor's
        deliverable.
      status: pass
    - id: AC-17
      check: Producer receipt durability (Validator prohibition on working-tree-only receipts)
      observed: >-
        The producer artifacts are durable by commit: all 123 are in
        c79e3a8d, independently verified against git by this session. The
        archive receipt
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/archives/TASK-20260727-022/snapshot_commit_receipt.json
        DOES NOT EXIST — not in the commit and not in the working tree — and
        TASK-20260727-022 is still `queued` in dispatch_queue.json. See
        limitation L-1 and the INT-BATCH007-T assessment.
      status: incomplete_at_coordination_layer
    - id: AC-18
      check: Executor task receipt / deviation disclosure as a durable artifact
      observed: >-
        No coordination/.../BATCH-007/tasks/TASK-20260727-021/ directory exists.
        The deviations named on this validation card (execution order B,A,C,E,D;
        arm-E base-row re-collection; replay-derived dedup_suppressed_count;
        rank_M implemented by the driver; two out-of-repository dress
        rehearsals) are NOT recorded in any committed artifact as deviations.
        The driver even initialises `self.deviations: list[str] = []`
        (ablation_driver.py:366) and never populates or writes it. Four of the
        five are nonetheless independently inferable from the artifacts (see
        deviation_assessment); the dress rehearsals are not.
      status: pass_with_defect
      defect_id: D-VAL023-2

  metric_recomputations:
    method: >-
      This session wrote two scripts of its own from the frozen specification
      text (sections 2 and 4) and from harness/endomorphism_la.py, without
      reading experiments/EXP-STR-003/driver/ablation_driver.py for the
      measurement logic, and executed them against the same committed harness
      at the same tree. Nothing was written inside the repository; all output
      went to a scratch path outside it.
    recomputed_phi_alpha_table:
      note: >-
        Every cell below is this session's independently recomputed value. All
        16 equal the committed run records and the committed summary.
      columns: [B=27 (I1), B=55 (I2), B=204 (I3), B=397 (I4)]
      A_phi_invariant_with_appended_rows: [9, 2, 4, 1]
      B_phi_invariant_rows_removed: [27, 52, 197, 386]
      C_random_baseline: [27, 54, 201, 382]
      E_phi_free_synthetic_closure: [11, 1, 0, 29]
