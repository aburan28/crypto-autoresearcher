      control: Dual-shift measurement (alpha under both operators for every arm)
      status: pass
      evidence: alpha_alternate_shift recorded in all 16 cells; all 16 independently reproduced.
    - id: CTRL-5
      control: Static-bound control (misaligned_row_count computed by definition)
      status: pass
      evidence: >-
        Recomputed by this session from the spec's definition (square /
        rectangular branch, sigma the positional block-of-3 permutation)
        independently of any rank computation. All 16 values agree. Branch is
        `square` in all 16 cells, so the rectangular limb is untested by this
