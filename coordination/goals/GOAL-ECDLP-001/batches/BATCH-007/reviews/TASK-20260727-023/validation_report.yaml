  int_batch007_t_assessment:
    question: >-
      Is INT-BATCH007-T the reason no archive receipt here carries a bound
      commit_sha, and does it block this validation?
    finding: PARTIALLY CONFIRMED, WITH A CORRECTION
    detail: >-
      INT-BATCH007-T is real and correctly stated: tools/research_dispatch.py
      requires a completed archive's commit to change exactly the union of the
      archive's artifact_paths and its sources, that set includes the
      archive's own snapshot_commit_receipt.json, and the receipt can only be
      written after the commit it records — so no archive task in this
      repository can be marked `completed` and pass verify_archive. That
      correctly explains why every archive task in BATCH-007 remains queued
      with a null commit_sha at the QUEUE level.
      THE CORRECTION: it is not true that no archive receipt here carries a
      bound commit_sha. The TASK-20260727-015 receipt at
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/archives/TASK-20260727-015/snapshot_commit_receipt.json
      does carry commit_sha 624dd2c1..., parent_sha 6eb37799..., path_sha256
      and reachable_from_head — it is simply UNTRACKED, exactly as the defect
      predicts. For TASK-20260727-022 the situation is worse in one respect:
      no receipt file exists at all, in the commit or in the working tree.
    blocks_this_validation: false
    reasoning: >-
      The Validator prohibition is against accepting a working-tree-only
      producer artifact as a durable receipt. The producer artifacts here are
      not working-tree-only: all 123 are inside commit c79e3a8d, and this
      session verified against git every property the missing receipt would
      have attested — reachability from HEAD, the expected parent, exactly the
      123 declared paths, all additions, no path outside the declared
      write_scope, nothing staged under harness/ or experiments/EXP-STR-002/,
      no AppleDouble sidecar, and working-tree/commit identity for every path.
      What is unavailable is the tool-level attestation, which INT-BATCH007-T
      already records as unreachable repository-wide and out of scope for this
      batch. Direct git verification by an independent session is a sufficient
      substitute for the purpose of admitting this run package. The gap is
      recorded as limitation L-1 and must not be closed by fabricating a
      receipt.

  heuristic_validation_applicability: >-
    EXP-STR-003 is an instrument ablation, not a heuristic validation in the
    exemplar style of docs/target-result-profile.md. It samples no
    distribution, states no rho(u)-style theoretical prediction, and uses no
    substitute-sampling correspondence. The exemplar-specific checks are
    therefore recorded as not applicable, with those that do transfer
    answered.

  heuristic_validation_checks:
    - id: HV-1
      check: Pre-registered prediction recorded before or independently of the measurement
      status: pass
      finding: >-
        The predicted table (arm A 9/2/4/1, arm B 27/52/197/386, arm C
        27/54/201/382, arm E 0/1/0/1, misaligned 9/5/4/1, arm D crash
        pattern) is inside the specification at freeze commit 92268c9e, whose
        blob is byte-identical at the snapshot. It could not have been fitted
        to the data. The contract also discloses the predictions' provenance
        (unarchived TASK-20260727-017 scratchpad probes) and forbids
        evaluating any criterion against them. The driver hardcodes them as
        report-only constants; a code read confirms no prediction is read into
        any computation, default or fallback.
    - id: HV-2
      check: Sample integrity — sample size, seeds and procedure in the manifest, statistics recomputed from raw data
      status: pass
      finding: >-
        Requested and derived seeds, the deterministic instance construction,
        the target quota max(10, B+10) and the arity are recorded per run.
        Every reported statistic was recomputed here from the same
        deterministic procedure rather than copied from the summary.
    - id: HV-3
      check: Correspondence validity (substitute sampling)
      status: not_applicable
      finding: No correspondence substitutes for direct measurement in this design.
    - id: HV-4
      check: Scale binding / toy-scale recorded as a limitation
      status: pass
      finding: >-
        claim_tier is `toy` in the contract and in ablation_summary.json.
        Parameters are p from 2293 to 631843 (12 to 20 bits), n <= 158071
        (about 17 bits), B <= 397, arity 2 only, four j=0 (CM discriminant -3)
        prime-field curves. The contract's `claim_ceiling` states explicitly
        that nothing extends to arity 3, B > 397, j != 0 curves, generic
        curves, medium or cryptographic scale, or index calculus in general.
        No artifact presents this as scale-matched evidence. AGENTS rule 7 is
        satisfied.
    - id: HV-5
      check: Sample count adequacy
      status: incomplete_by_design
      finding: >-
        Four instances, one repeat per cell, justified in the contract by
        determinism (`repeats_rationale`). Correct as far as it goes — a
        repeat of a deterministic computation returns the same integer — but
        it means each arm's alpha at each B is a single realisation of a
        single curve, so nothing here supports a distributional statement
        about phi_alpha across curves. Recorded as limitation L-4.

  cost_model_applicability: >-
    The contract explicitly excludes cost from this experiment
    (metrics.explicitly_not_measured — no cost ratio, no structured_cost, no
    wiedemann_cost, no density_penalty, no crossover claim, no wall-time
    comparison between a structured solver and Wiedemann).

  cost_model_checks:
    - id: CM-1
      check: No concrete cost table is asserted
      status: pass
      finding: >-
        No cost table, no cost unit, no per-attempt-cost x
        inverse-success-probability bookkeeping and no time-memory tradeoff
        appears anywhere in the package. Correctly so — asserting one would
        breach the frozen contract. RT-CM-1..RT-CM-6 are untouched by this
        experiment, as the contract says.
    - id: CM-2
      check: Resource budget declares its unit and reports memory beside time
      status: pass
      finding: >-
        The budget block declares seconds and bytes explicitly:
        measured_total_wall_seconds 132.595 against declared 5400,
        measured_peak_rss_bytes 106,708,992 (0.0994 GB) against declared 8 GB,
        runs_written 20 against declared maximum 20. Memory is reported
        alongside time for every run. The contract's own
        stage_total_reconciliation flags in advance that the pessimistic stage
        sum (5480 s) exceeds the cap (5400 s) — an optimistic-assumption
        disclosure that was made before execution and was not needed, since
        the measured total came in at 2.5 percent of the cap.
    - id: CM-3
      check: Wall-time figures are not presented as a speed or cost claim
      status: pass
      finding: >-
        Per-run wall_seconds and cpu_seconds are recorded as resource
        measurements only. Nothing in the package compares them across arms as
        a cost result, and the searches_per_relation_row column is recorded as
        a secondary observation with no cost interpretation attached.

  limitations:
    - id: L-1
      limitation: >-
        No TASK-20260727-022 snapshot_commit_receipt.json exists, in the
        commit or in the working tree, and TASK-20260727-022 is still `queued`
        in dispatch_queue.json. The tool-level post-commit attestation
        required by AGENTS.md "Durable research commits" is therefore absent.
        INT-BATCH007-T establishes that this is a repository-wide harness
        defect, not a lapse by this batch. This session verified the
        equivalent facts directly against git; that substitutes for the
        receipt's evidentiary function but not for its bookkeeping function.
    - id: L-2
      limitation: >-
        No executor task receipt exists for TASK-20260727-021, so the five
        disclosed deviations are not recorded in any durable artifact. Four
        are independently inferable from the committed run records and were
        verified here; the two dress rehearsals are not recorded anywhere and
        cannot be verified or refuted from artifacts.
    - id: L-3
      limitation: >-
        rank_M at I3 and I4 rests on the driver's vectorised implementation
        alone for arms B, C and E (the in-run cross-check is `not_computed`
        there). This session supplied the missing reference computation for
        arm A only. rank_M feeds no criterion.
    - id: L-4
      limitation: >-
        Four instances, one realisation per cell, all j=0 (CM discriminant -3)
        prime-field toy curves at 12/16/20 bits with arity 2. The package
        supports no distributional claim about phi_alpha and nothing above the
        contract's toy tier. The rectangular branch of the metric and the
        zero-relation (SR-4) path are never exercised.
    - id: L-5
      limitation: >-
        manifest.run.inference.fallback_used is false in all 20 manifests
        while raw-result.json.inference_supplement.fallback_used is true. The
        harness hardcodes the former (harness/runner.py:136-140) and is code
        under measurement that the contract forbids modifying; the
        disagreement is disclosed in every record. A reader of manifest.yaml
        alone would draw the wrong conclusion.
    - id: L-6
      limitation: >-
        Two stderr.log files (RUN-STR-003-C-b16s3, RUN-STR-003-C-b20s3) are
        zero bytes. Present, so IV-2 is satisfied, but the contract's
        assertion that stderr carries real captured output "for every arm
        here" is not literally true.
    - id: L-7
      limitation: >-
        Arms A and E differ in row count at the same instance (39 vs 91 rows
        at I1; 408 vs 1209 at I4) because arm A's quota is consumed partly by
        appended rows while arm E closes arm C's full quota. In the square
        branch the metric is taken on the first B rows, so the two arms are
        not matched on the row population being measured. This is a design
        comparability question about what S1 and F1 mean; it is inherent in
        the frozen contract, is not a receipt defect, and its adjudication
        belongs to TASK-20260727-024 and the Coordinator, not to this report.
    - id: L-8
      limitation: >-
        This validator session shares runtime, resolved model and host with
        the executing session. Independence is session-level and
        implementation-level, not model-level or hardware-level.

