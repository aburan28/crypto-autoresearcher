      I1: {p: 2293, n: 733, a: 0, b: 417, zeta3: 1303, B: 27, B_mod_3: 0, derived_seed: 100, num_targets: 37, curve_id: TOY-P12-cf8e3078}
      I2: {p: 2953, n: 3061, a: 0, b: 2556, zeta3: 800, B: 55, B_mod_3: 1, derived_seed: 201, num_targets: 65, curve_id: TOY-P12-a1c06429}
      I3: {p: 42013, n: 41617, a: 0, b: 33267, zeta3: 15662, B: 204, B_mod_3: 0, derived_seed: 300, num_targets: 214, curve_id: TOY-P16-8c79aad3}
      I4: {p: 631843, n: 158071, a: 0, b: 242278, zeta3: 314488, B: 397, B_mod_3: 1, derived_seed: 300, num_targets: 407, curve_id: TOY-P20-ebb6c37d}
      agreement_with_run_records: exact on every field
      predicted_B_reproduced: true
    rank_M_spotcheck:
      motivation: >-
        The in-run rank_M cross-check is recorded as `pass` at I1/I2 and
        `not_computed (reference implementation too slow at this B)` at I3/I4,
