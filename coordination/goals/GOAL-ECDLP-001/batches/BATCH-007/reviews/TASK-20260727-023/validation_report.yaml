  artifact_checks:
    - id: AC-1
      check: Run count and identifiers
      expected: 20 runs, exactly the identifiers in specification run_inventory
      observed: 20 directories, identifiers exactly the 20 declared, no extras
      status: pass
    - id: AC-2
      check: Six required files per run (IV-2)
      observed: >-
        All 120 files present. Two are zero bytes:
        experiments/EXP-STR-003/runs/RUN-STR-003-C-b16s3/stderr.log and
        .../RUN-STR-003-C-b20s3/stderr.log. IV-2 requires presence only, so no
        run is invalidated; but the contract's artifact_policy_mapping asserts
        stderr "for every arm here carry real captured output", which is false
        for those two cells (arm C at I3/I4 emits no assertion lines because
        the determinism recheck is I1/I2-only and the rank_M cross-check is
        not_computed at those B).
      status: pass_with_note
    - id: AC-3
      check: Exact command per run (artifact policy)
      observed: >-
        manifest.run.code.command equals command.txt byte for byte in all 20
        runs; each carries a distinguishing `# cell: arm=... instance=...
        label=...` suffix on the contract's command_template. The recorded
        command carries no `--out-root`, so these are production runs and not
        the driver's rehearsal mode.
      status: pass
    - id: AC-4
      check: Git commit and dirty-tree state
      observed: >-
        All 20 manifests record commit 92268c9e... (the contract-freeze commit,
        i.e. HEAD at execution time) and dirty false. NOTE OF SCOPE:
        harness/runner.py:44 and the driver both compute dirty with
        `git status --porcelain --untracked-files=no`, so `dirty: false` means
        "no tracked file differs from HEAD" and is silent about untracked
        files — the driver itself was untracked at execution time. That is the
        committed harness's definition, not a driver deviation, and it is the
        definition relevant to reproducibility.
      status: pass_with_note
    - id: AC-5
      check: Environment and dependency versions
      observed: >-
        environment.json and manifest.run.environment carry python 3.13.1,
        macOS-26.6-arm64, sympy 1.14.0, pyyaml 6.0.3, sage null. The
        contract-required numpy version (not recorded by
        harness/runner.py::environment()) is present as
        raw-result.json.environment_supplement.numpy_version = 2.4.0 in all 20
        runs, with the interpreter path. Complete against the artifact policy.
      status: pass
    - id: AC-6
      check: Input parameters and random seeds
      observed: >-
        Every run records requested_seed, derived_seed, p, n, a, b, zeta3, B,
        B_mod_3, field_bits, arity, num_targets and curve_id. Derived seeds
        100 / 201 / 300 / 300 for I1..I4. This session regenerated all four
        instances from (field_bits, requested_seed) alone and obtained
        identical p, n, a, b, zeta3, derived_seed, num_targets, curve_id and B.
        No parameter is hardcoded or transcribed.
      status: pass
    - id: AC-7
      check: code_hashes agreement across the set (IV-3)
      observed: >-
        Exactly one distinct code_hashes block across all 20 raw-result.json
        files, and it equals the SHA-256 of the five harness sources as they
        stand in the tree. IV-3 not triggered.
      status: pass
    - id: AC-8
      check: stdout and stderr captured
      observed: >-
        20 stdout.log files, all non-empty and carrying per-cell measured
        values; 18 non-empty stderr.log carrying the IV-5/IV-6 assertions, the
        determinism recheck, the rank_M cross-check, the arm-A append replay,
        the CTRL-8 cross-check and (arm D) the child traceback. Two empty, per
        AC-2. Not the empty strings recorded at endomorphism_la.py:485/499.
      status: pass_with_note
    - id: AC-9
      check: Raw machine-readable results
      observed: 20 raw-result.json files, well-formed, each with metrics/raw/code_hashes/environment_supplement/inference_supplement.
      status: pass
    - id: AC-10
      check: Validity status and reason
      observed: All 20 manifests record status completed_valid, result.valid true, invalid_reason null. No run is marked failed_infrastructure or cancelled.
      status: pass
    - id: AC-11
      check: Inference block (requested policy, resolved model, provenance, verification, fallback, degraded)
      observed: >-
        manifest.run.inference is written by harness/runner.py, which HARDCODES
        requested_policy "executor-terra", resolved_model_id "none
        (deterministic harness execution)" and fallback_used FALSE
        (harness/runner.py:136-140). raw-result.json.inference_supplement,
        written by the driver, records fallback_used TRUE, model_verified
        false, model_provenance "runtime-reported ... not probed",
        degraded_requirements and the reason. The two blocks therefore
        disagree on fallback_used in all 20 runs. The disagreement is
        explicitly disclosed in every record's
        `harness_manifest_inference_note`, and the harness is code under
        measurement that the contract forbids modifying. It is a residual
        defect of the receipt (a reader of manifest.yaml alone would conclude
        no fallback occurred), not a fabrication or a silent substitution.
      status: pass_with_defect
      defect_id: D-VAL023-1
    - id: AC-12
      check: Timestamps and resource measurements, per run (EXP-STR-002 defect D6 not repeated)
      observed: >-
        20 distinct, non-overlapping timing windows with per-run wall_seconds,
        peak_rss_bytes and cpu_seconds. Span 2026-07-28T00:02:20.143Z ->
        00:04:31.457Z = 131.3 s. No timing window is reused across runs.
      status: pass
    - id: AC-13
      check: Summary reconciles with raw records (IV-9)
      observed: >-
        Every field of every (arm, instance) cell in ablation_summary.json
        equals the corresponding raw-result.json metric — zero mismatches over
        16 arm cells. The four arm_D summary cells carry four derived booleans
        (completed_without_IndexError, raised_IndexError_at_451,
        out_root_inside_repository, experiments_unchanged_after_invocation)
        that are not literal keys of raw metrics; each was traced to and
        agrees with the corresponding raw fields (arm_D_exit_code,
        arm_D_exception_type/_file/_line, raw.assertions.*,
        raw.child_out_root_inside_repository). No IV-9 invalidation.
      status: pass
    - id: AC-14
      check: run_index.json
      observed: 20 entries, declared_run_count 20, every path/status/validity consistent with the manifests.
      status: pass
    - id: AC-15
      check: Budget and stopping rules
      observed: >-
        Sum of per-run wall = 127.003 s; summary's driver-level
        measured_total_wall_seconds = 132.595 s (>= the sum, consistent with
