  task_id: TASK-20260727-023
  batch_id: BATCH-007
  goal_id: GOAL-ECDLP-001
  experiment_id: EXP-STR-003
  hypothesis_id: H-STR-002
  role: validator
  verdict: passed
  verdict_in_card_vocabulary: PASS
  verdict_scope: >-
    PASS applies to receipt integrity, artifact-policy compliance and
    reproducibility of the TASK-20260727-021 run package as committed at
    c79e3a8d6cb429c7a9c876b5e0272f46145ab919. It is NOT an adjudication of
    OBS-1 / RT-OBJ-1, NOT a statement about H-STR-002's mechanism, NOT
    evidence for or against any ECDLP claim, and NOT an authorization to
    promote, weaken or otherwise transition any hypothesis. All measured
    quantities remain at the contract's `toy` claim tier and inside its
    `claim_ceiling`.

  session_independence:
    non_originating: true
    statement: >-
      This session did not write the specification, the driver, any run record
      or the summary, and did not produce the TASK-20260727-017 probes. It read
      the committed snapshot and re-executed the measurement from independently
      written code.
    originating_sessions_distinct_from: [TASK-20260727-017, TASK-20260727-020, TASK-20260727-021, TASK-20260727-022]
    worktree: /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006
    branch: claude/ecdlp-batch006
    inference:
      requested_policy: review-xhigh
      resolved_model_id: claude-opus-5
      model_provenance: runtime-reported by this session; not probed
      model_verified: false
      model_verification_note: >-
        `python3 -m orchestration.adapter doctor --probe` returned "No module
        named orchestration.adapter"; orchestration/ contains only
        model-policies.yaml on this branch. No policy-equivalence is claimed.
      fallback_used: true
      fallback_reason: >-
        review-xhigh / review-adversarial was requested; the executing runtime
        is Claude Code serving claude-opus-5. Disclosed, not silent.
      degraded_requirements:
        - model_verified is false: the adapter probe is unavailable on this branch
      equivalence_to_requested_policy_claimed: false
      reasoning_effort: null
    independence_caveat: >-
      This validator session runs on the same runtime and the same resolved
      model as the executing session, and on the same host. Independence here
      is session-level and implementation-level (separately written
      re-execution code), not hardware- or model-level.

  bound_snapshot:
    commit_sha: c79e3a8d6cb429c7a9c876b5e0272f46145ab919
    parent_sha: 92268c9e72dd9d49de410f4a535e64af5aa5d9a9
    branch: claude/ecdlp-batch006
    reachable_from_head: true
    head_at_validation: c79e3a8d6cb429c7a9c876b5e0272f46145ab919
    files_changed: 123
    change_types: {added: 123, modified: 0, deleted: 0, renamed: 0}
    appledouble_sidecars_committed: 0
    paths_outside_declared_write_scope: 0
    harness_paths_staged: 0
    exp_str_002_paths_staged: 0
    working_tree_matches_commit_for_all_123_paths: true

  commands_run:
