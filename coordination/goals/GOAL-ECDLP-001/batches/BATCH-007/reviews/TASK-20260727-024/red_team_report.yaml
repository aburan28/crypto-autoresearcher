  # =====================================================================
  # 1. THE PRO CASE, ARGUED FIRST AND ARGUED PROPERLY
  # =====================================================================
  pro_case_for_phi_alpha_argued_first:
    instruction: >-
      The handoff requires the case that arm E is a strawman, that arm B
      handicaps a method an attacker would really run, and that the ablation
      therefore leaves `phi_alpha` unimpeached, to be argued first and honestly.
      Here it is, at full strength, followed by where it actually lands.
    RT24-PRO-1:
      title: Arm E's rows are not relations, so scoring them is a category error.
      argument: >-
        Arm E's appended rows are index permutations of incidence vectors over a
        factor base that is not phi-invariant. They are not images of any
        relation under any morphism of the curve. They satisfy no equation. An
        attacker who wrote them down would hold a matrix of nonsense. Comparing
        a nonsense matrix's displacement rank against a real one and concluding
        the metric is meaningless is like discrediting a scale by weighing a
        photograph of a brick.
      where_it_lands: >-
        PARTLY VALID and pre-conceded. The frozen contract wrote this rebuttal
        into section 2/E `anticipated_rebuttal_recorded_in_advance` before any
        outcome was seen, and answered it: `phi_alpha` is advertised as
        detecting a property OF THE MATRIX (near C_3-equivariance), not a
        property of the mathematics behind the matrix. The answer holds. But the
        rebuttal survives in one narrower form that matters and that I sustain:
        arm E's *level of dedup breakage* is not comparable to arm A's, which is
        exactly why F1 fired (RT24-OBJ-1). So PRO-1 does not rescue the metric,
        but it does defeat the specific cross-arm inequality S1/F1 was built on.
    RT24-PRO-2:
      title: Arm B describes a method nobody would run.
      argument: >-
        phi(R) is a genuine relation whenever R is and F is phi-invariant: phi is
        an automorphism, phi(P) = lambda*P on the order-n subgroup, so the
        orbit images are free, correct, and any competent implementer would keep
        them. Arm B throws them away. A comparison that handicaps the method by
        discarding free relations proves nothing about the method.
      where_it_lands: >-
        VALID AS TO THE METHOD, and pre-conceded by the contract
        (section 2/B `known_objection_recorded_in_advance`). It does NOT rescue
        the metric, and it does not blunt the finding I rely on, because the
        decisive comparison I use is not arm B versus arm A. It is arm B versus
        arm C's alternate-shift measurement: same phi shift operator, same
        collection rule, same no-append convention, one variable changed (the
        factor base). See RT24-OBJ-5.
    RT24-PRO-3:
      title: The committed numbers are real. Nothing was fabricated.
      argument: >-
        Arm A reproduced phi_alpha 9, 2, 4, 1 at B = 27, 55, 204, 397 exactly,
        4 of 4, and misaligned_row_count 9, 5, 4, 1 exactly, 4 of 4. CTRL-8
        against the one overlapping committed record
        (experiments/EXP-STR-002/runs/RUN-STR-phi-b12-s1-m2/raw-result.json)
        agrees on all five compared fields. DEC-20260726-006's cost_ratio 0.011
        is exact arithmetic on alpha = 1 and B = 397
        (1*397*ceil(log2 397) / (2*397^2) = 3573/315218 = 0.01133). Whatever
        else is wrong here, the headline numbers were computed, not invented.
      where_it_lands: >-
        TRUE AND IMPORTANT, and it is the strongest thing anyone can say for
        EV-STR-002. I record it prominently: there is no evidence of fabrication
        in EXP-STR-002's phi-arm numbers, and any record that implies otherwise
        would be wrong. But it is only half of the reproduction: EV-STR-002's
        rand_alpha values do NOT reproduce, 3 of 3 (RT24-OBJ-7).
    RT24-PRO-4:
      title: F1 fired. The red team's own decisive control turned on it.
      argument: >-
        The prior session's central empirical claim was that a construction with
        zero endomorphism content scores equal or better at EVERY headline B
        (0, 1, 0, 1 against 9, 2, 4, 1). Measured under a frozen contract it
        scored 11, 1, 0, 29 - worse at B = 27 and 29x worse at B = 397. The
        claim is dead, it died on a pre-registered criterion, and the consequence
        was fixed in advance: OBS-1/RT-OBJ-1 withdrawn or rescoped,
        DEC-20260727-009 may not rest on them, metric UNADJUDICATED.
      where_it_lands: >-
        ENTIRELY VALID AND BINDING. I accept it without reservation. I do not
        defend the TASK-20260727-017 session, and nothing below re-asserts its
        comparative claim. What I do dispute is the inference some reader will
        draw next - that because the attack on the metric failed, the metric is
        vindicated and DEC-20260726-006 stands. The contract itself forbids that
        reading ("UNADJUDICATED rather than refuted"), and RT24-OBJ-2 shows the
        verdict machinery cannot even express what actually happened.
    net_position_of_the_pro_case: >-
      The pro case wins on arm E's status as a competing method (it is not one),
      wins on arm B as a description of a real method (it is not one), wins on
      the authenticity of the phi-arm numbers, and wins outright on F1. It does
      NOT establish that `phi_alpha` measures phi-invariance, and it does not
      reach the three findings that carry my recommendation (RT24-OBJ-5,
      RT24-OBJ-7, RT24-OBJ-8), none of which involves arm E or F1 at all.

  # =====================================================================
  # 2. OBJECTIONS
  # =====================================================================
  objections:

  - id: RT24-OBJ-1
    severity: fatal_to_S1_F1_as_a_discriminator
    answers: task deliverable 1 (why did arm E fail to reproduce)
    title: >-
      Arm E as frozen is a valid EXISTENCE control but a mis-specified
      COMPARATIVE one. F1 fired on an uncontrolled nuisance variable, not on
      endomorphism content.
    mechanism_read_from_the_committed_code: >-
      In the square branch (endomorphism_la.py:233-242, taken whenever
      rows >= B, and taken in all 16 measured cells) the displacement matrix is
      D[i][j] = M[i][j] - M[sigma(i)][sigma(j)]. Row i is zero exactly when
      M[sigma(i)] == shift_row(M[i]). Both arm A's append rule (lines 292-304)
      and arm E's synthetic closure emit r, s(r), s^2(r) in consecutive
      positions, which makes that identity hold identically - UNTIL an emission
      is skipped. Every skip shifts the phase of the whole downstream stream by
      one position and misaligns rows until a later skip restores the phase
      mod 3. alpha is therefore a phase-tracking statistic of the emission
      stream, and its value depends on WHERE the skips fall, not on how many
      there are. That is why arm E at I4 turns 12 suppressions into 29
      misaligned rows while arm A at I1 turns 6 into 9.
    why_the_two_arms_cannot_have_matched_skip_patterns:
    - >-
      Different base-row budgets. Arm A's appends count against the num_targets
      quota, so it consumes 15 / 22 / 72 / 136 base rows (committed
      `append_replay.base_rows_consumed`). Arm E closes arm C's FULL collection:
      37 / 65 / 214 / 407 base rows. Same rule, 2.5x-3.0x as many opportunities
      to skip.
    - >-
      Different skip CAUSES. Arm A's shifted row is built by mapping each
      support element x to zeta3^s * x and looking it up in the factor base; a
      miss DROPS that coordinate, and `_build_phi_invariant_factor_base` returns
      `xs[:B]`, so when B mod 3 != 0 the last orbit is truncated and its element
      has no image in F. Arm E's shift is a positional permutation and is
      weight-preserving, so it can never drop a coordinate; every one of its
      skips is a duplicate hit. The two arms' skip processes are not the same
      random variable.
    - >-
      Confirmed by the committed numbers: arm A at I2 and I4 has
      dedup_suppressed_count 0 yet misaligned_row_count 5 and 1 - misalignment
      with zero suppression, which only the truncated-orbit mechanism explains
      (both are the B mod 3 = 1 instances). Arm E at I3 has 0 suppression and 0
      misalignment.
    diagnostic_probe_NOT_EVIDENCE: >-
      Run outside the repository, read-only, unarchived, and therefore NOT
      evidence and not citable by any downstream record (see
      probe_status below). Re-executing the frozen arm-E construction reproduced
      the committed cells exactly (suppressed 20/4/0/12, alpha 11/1/0/29). A
      variant that emits each sigma-orbit ONCE and never suppresses returned
      alpha 0, 1, 0, 1 - the pre-registered prediction, exactly, at all four
      instances. The probe also found the random factor bases have 0, 0, 2 and 1
      elements out of B whose zeta3-image lies in F, i.e. essentially no
      phi-closure, so arm E's "zero endomorphism content" premise is sound.
    what_this_means_for_the_falsification: >-
      The divergence is NOT a driver defect, NOT instance-dependence, and NOT
      arithmetic error. It is a difference of CLOSURE CONVENTION: the frozen
      arm E faithfully mirrors the committed harness's dedup pathology
      ("mirroring, term for term, the filter and dedup at ... lines 303-304"),
      while the prior session's probe evidently emitted clean orbits. Both are
      phi-free. The metric returns 1 for one and 29 for the other at B = 397,
      with the mathematics - which is to say, nothing - held fixed. A quantity
      that swings 29x under a change of bookkeeping convention, at fixed and
      zero endomorphism content, is not measuring endomorphism content. But
      that observation cannot be used to rescue S1, because S1 as frozen
      demanded a cross-arm inequality that this same variance makes
      unpredictable. The correct verdict is exactly the one the contract fixed
      in advance: UNADJUDICATED.
    consequence_i_accept: >-
      OBS-1 and RT-OBJ-1's comparative limb are withdrawn. DEC-20260727-009 may
      not rest on them. I do not restate them in any form.

  - id: RT24-OBJ-2
    severity: high_contract_design
    title: >-
      The `mixed` verdict branch is unreachable by construction, and the
      measured S1 pattern is precisely the case `mixed` was written for.
    detail: >-
      Section 7 defines S1 = not F1, S2 = not F2, S3 = not F3, so
      "S1 and S2 and S3" and "F1 or F2 or F3" are exact complements. `mixed`
      ("different instances point different ways after all four completed") can
      never be selected. Yet S1 HELD at I2 (1 <= 2) and I3 (0 <= 4) and FAILED at
      I1 (11 > 9) and I4 (29 > 1) - two instances each way, which is the literal
      definition of `mixed`. The contract's own disposition for `mixed` is
      Coordinator `inconclusive` on the instrument question, "and saying so
      plainly is the required outcome".
    consequence: >-
      The mechanical label `obs1_falsified` is correct under the rule as written
      and the Executor applied it correctly. It must NOT be read as "the metric
      is vindicated" or as "phi_alpha measures phi-invariance". The contract's
      own UNADJUDICATED language and its `mixed` disposition both point the same
      way, and the ledger record must use that language and not the label.

  - id: RT24-OBJ-3
    severity: medium_design_power
    title: The criteria are decidable but the design is statistically asymmetric.
    decidability: >-
      DECIDABLE AS WRITTEN. S1-S3 are integer comparisons on measured values;
      S4 is a comparison of exception type, file and line. Every one of the 16
      metric cells was measured (no SR-4 nulls), so the "evaluable instance"
      qualifier never had to be exercised and no ambiguity arose. I found no
      criterion whose evaluation required judgement.
    separation_threshold_0_5: >-
      The 0.5 in S2/F2 is arbitrary as a number and defensible as a decision
      here only because it is non-binding: the measured ratios alpha(B)/alpha(C)
      are 1.000, 0.963, 0.980 and 1.011, so S2 holds for ANY threshold below
      0.963 and F2 fires for none below it. The verdict is insensitive to the
      threshold over two thirds of its possible range. A contract that had
      landed near 0.5 would deserve the objection; this one does not.
    asymmetric_power: >-
      Confirmation of OBS-1 required S1 at 4 of 4; falsification required F1 at
      1 of 4. With a per-instance nuisance variable of the magnitude documented
      in RT24-OBJ-1, the falsifying outcome was far MORE reachable than the
      confirming one. To the contract's credit this is the opposite of a rigged
      design - the falsifying outcome was genuinely available and it occurred.
      It is nevertheless a power defect: a single-tailed existential falsifier
      against a universal success criterion, on an uncontrolled variable, cannot
      settle the question in either direction.
    branch_dependence_RT_OBJ_4: >-
      Not a live confound here. All 16 cells reported branch "square", so every
      arm-to-arm comparison is between values computed by the same limb of
      lines 220-242 on a B x B matrix. RT-OBJ-4's incommensurability objection
      is real for the code in general (the rectangular limb computes
      rank(MZ - M), a different quantity entirely) but it does not touch this
      result. The design earned that by using num_targets = max(10, B+10), which
      guarantees rows >= B in every arm.

  - id: RT24-OBJ-4
    severity: informational_what_survives
    title: >-
      The DERIVATIONAL limb of RT-OBJ-1 was not falsified. It was confirmed, at
      4 of 4, and the frozen contract is what confirmed it.
    detail: >-
      RT-OBJ-1 had two limbs. Limb 1 (static): alpha is bounded by the number of
      row indices at which the append order lost alignment, i.e. it is a
      statistic of the insertion bookkeeping. Limb 2 (comparative): a phi-free
      construction scores better at every headline B. F1 killed limb 2 only.
      Limb 1 is S3, and S3 held at 4 of 4 with equality at 3 of 4
      (9<=9, 2<=5, 4<=4, 1<=1); arm E's alpha EQUALS its misaligned_row_count at
      4 of 4 (11, 1, 0, 29). The contract's permitted remedy is "withdrawn OR
      RESCOPED"; the honest rescoping keeps limb 1 and deletes limb 2, including
      the title assertion "A factor base with ZERO phi content scores BETTER".
    warning: >-
      Limb 1 does not by itself say the metric is uninformative. It says alpha
      counts phase breaks in the emission stream. Whether those phase breaks
      correlate with anything mathematical is the UNADJUDICATED question.

  - id: RT24-OBJ-5
    severity: fatal_to_the_evidentiary_basis_of_DEC-20260726-006
    answers: task deliverable 2 and 4
    title: >-
      CTRL-4's common-shift comparison is the one-variable test the original
      claim never ran, it is archived, it is 4 of 4, and it shows phi-invariance
      of the factor base contributes NOTHING to alpha.
    measurement: >-
      Under the SAME phi shift operator, same collection rule, same no-append
      convention, changing only the factor base:
      arm B (phi-invariant F, declared phi shift)  27, 52, 197, 386
      arm C (random F, alternate phi shift)        27, 52, 199, 387
      Differences 0, 0, 2, 1 on values of order B. This is CTRL-4 as promised in
      the contract, it does not involve arm E, it does not involve F1, and it is
      not touched by the falsification.
    why_it_matters: >-
      EV-STR-002's inference sentence is "endomorphism-invariant factor bases
      induce O(1) displacement rank". The factor base induces nothing. The
      appended rows induce it, and they induce it BY CONSTRUCTION - closing a
      row list under sigma makes the matrix sigma-equivariant, which is a
      derivation, not a measurement. The residual is the phase-break count.
    relation_to_H_STR_002_falsification_condition_1: >-
      H-STR-002 FC-1 reads "Displacement rank alpha grows like B (or faster) for
      phi-invariant factor bases, showing no separation from the random baseline
      - the block-circulant structure does not survive relation collection."
      On the natural reading (what collection produces) that condition is MET at
      4 of 4: alpha = 27, 52, 197, 386 ~ B, no separation from 27, 52, 199, 387.
      On the defender's reading (collection INCLUDES the orbit closure, since
      the appends live inside `_collect_relations`) it is not met. I record the
      ambiguity rather than resolving it in my own favour: it is a defect of
      FC-1's drafting, and it is a reason the transition is `weaken` and not
      anything stronger.

  - id: RT24-OBJ-6
    severity: high
    title: >-
      The phi-free arm reproduces the ORIGINAL claim's signature at 4 of 4,
      which F1 does not touch.
    detail: >-
      DEC-20260726-006's evidence is the pair (phi_alpha small, rand_alpha ~ B):
      2 vs 53, 4 vs 200, 1 vs 387. Arm E - random factor base, zero phi content -
      measured under both shift operators on the SAME rows gives
      phi-shift vs random-shift: 11 vs 26, 1 vs 53, 0 vs 200, 29 vs 391.
      A construction with no endomorphism in it exhibits the same qualitative
      separation, at every instance, including the two headline instances. This
      is a within-arm, one-variable, 4-of-4 comparison; F1 was a cross-arm
      comparison and its failure says nothing about it.
    caveat_i_hold_myself_to: >-
      This shows the SIGNATURE is not diagnostic. It does not show the phi arm's
      value is "the same as" a phi-free one - at I1 and I4 it is not, which is
      exactly F1. Both statements are true simultaneously and I assert only the
      first.

  - id: RT24-OBJ-7
    severity: high_artifact_integrity
    answers: task deliverable 3
    title: >-
      Only HALF of DEC-20260726-006's headline pairs reproduce. Every phi_alpha
      reproduces exactly; every rand_alpha fails to.
    detail: >-
      EV-STR-002 / DEC-20260726-006 state rand_alpha = 53 (B=55), 200 (B=204),
      387 (B=397). EXP-STR-003 arm C is byte-for-byte the same computation the
      committed main() performs for rand_alpha (same constructor, same
      _collect_relations call, same _measure_displacement_rank call with
      seed=inst.seed, cols=len(fb)) and measures 54, 201, 382. Three comparisons,
      three mismatches. For completeness the phi-shift measurement of the same
      arm-C rows gives 52, 199, 387 - so the recorded values match NEITHER
      committed computation across all three instances.
    inference: >-
      The producing script for EV-STR-002's nine "inline" extended measurements
      is absent from every ref (census, validated PASS) and its random-arm output
      is not reproducible from the committed harness by either shift convention.
      I do not speculate on the cause; the fact of non-reproduction is
      established from two committed artifacts and simple arithmetic.

  - id: RT24-OBJ-8
    severity: fatal_to_any_cost_claim
    title: >-
      There is no end-to-end path. No right-hand side, no system, no solve, and
      the phi arm's matrix is rank-deficient at every single instance.
    detail: >-
      `_collect_relations` builds rows as bare incidence vectors
      (`row[factor_base.index(sx)] = 1`); the target's scalar multiple k is
      never recorded in any row, so no linear system with a right-hand side is
      ever assembled, in EXP-STR-002 or EXP-STR-003. Measured rank deficiency
      B - rank_M of the phi arm's own row list: 4, 6, 30, 67 at B = 27, 55, 204,
      397. At the headline instance the system is 67 short of full rank. No
      solve is available from it at any tested instance; none was attempted;
      no source recovery, no target descent, and no scalar orientation exists
      anywhere in this line of work.
    sharpest_form: >-
      Arm E - the construction the contract itself calls "mathematically
      worthless" - has rank deficiency 0, 0, 0, 1. The worthless matrix is
      full rank; the meaningful one is 67 short. Any cost comparison between a
      "structured solve" and Wiedemann is a comparison between two models of
      solving a system that has never been assembled and, on this evidence,
      could not be solved if it were.

  - id: RT24-OBJ-9
    severity: medium
    title: >-
      H-STR-002's own primary positive prediction fails at 2 of 4 instances on
      the reproduced arm-A numbers.
    detail: >-
      The hypothesis predicts "alpha <= r = 3 for phi-invariant factor bases at
      all tested B". Arm A measures 9, 2, 4, 1: alpha = 9 > 3 at B = 27 and
      alpha = 4 > 3 at B = 204. EV-STR-002 dismissed the first as "a small-B
      artifact"; the second is at B = 204, the second-largest instance, and is
      not dismissed anywhere. This is not a large objection but it is a recorded
      prediction failing on the record's own favourable numbers.

  - id: RT24-OBJ-10
    severity: high_process
    title: >-
      RT-OBJ-1 has never been committed, so "withdraw or rescope by a
      superseding record" has an unusual and much cheaper remedy.
    detail: >-
      The TASK-20260727-016 and -017 reports are untracked working-tree files.
      There is no committed record to supersede. The remedy is therefore not a
      correction chain but a gate: the ledger archive task must not commit
      RT-OBJ-1 in its present wording. It commits the rescoped form (limb 1
      only, per RT24-OBJ-4) together with this report, or it commits neither.
      Committing the falsified comparative claim and then superseding it in the
      same batch would manufacture exactly the kind of record this batch exists
      to clean up.

  - id: RT24-OBJ-11
    severity: medium_reproducibility
    title: The run records do not archive the objects the metric is computed from.
    detail: >-
      raw-result.json records metrics, timings, assertions and a row-weight
      histogram, but not the factor bases and not the row lists (nor their
      hashes). A third party cannot recheck a single alpha from the archived
      artifacts; they must re-execute the driver. That is adequate here only
      because the computation is deterministic and the driver is committed, and
      it is the difference between "reproducible" and "checkable". Storing
      sha256 of the factor base and of the final row list per cell costs
      nothing and would close it.

  - id: RT24-OBJ-12
    severity: medium_baseline
    title: No archived rho or BSGS baseline exists at the two larger instances.
    detail: >-
      EXP-STR-002 commits rho baselines only at n = 7, 7, 37, 733, 3061. There is
      no committed rho or BSGS datum at n = 41617 or n = 158071 - the two
      instances carrying the headline claims. Arm D's child process did run rho
      at those sizes, but its records were written outside the repository and the
      contract forbids citing them. The comparison that decides whether any of
      this matters is therefore absent from the repository at exactly the
      parameters where the claim was made.

  # =====================================================================
  # 3. ADJUDICATIONS THE HANDOFF REQUIRES
  # =====================================================================
  adjudications:

    deliverable_1_why_arm_E_diverged:
      verdict: >-
        MIS-SPECIFIED COMPARATIVE CONTROL, with the divergence fully accounted
        for by closure convention, not by dedup suppression alone, not by
        instance-dependence, and not by any defect in the driver.
      supporting: >-
        The driver implements section 2/E faithfully; the frozen text told it to
        mirror the harness dedup "term for term", and it did. The prior probe
        evidently emitted clean sigma-orbits instead. Both constructions are
        phi-free; they differ only in whether a suppressed shift is allowed to
        break the emission phase. RT24-OBJ-1 gives the mechanism and the
        committed numbers that support it.
      what_this_changes_about_the_falsification: >-
        It does not undo it. F1 fired on measured values under a pre-registered
        criterion and the consequence is binding. It does change the MEANING:
        the falsification refutes the prior session's comparative claim, and it
        does not support the converse. Arm E as frozen was the right EXISTENCE
        control (it produced alpha = 0 on a phi-free row list at I3) and the
        wrong COMPARATIVE control (its nuisance level was never matched to arm
        A's). S1/F1 tested a proposition strictly stronger than OBS-1's content.

    deliverable_2_narrowest_defensible_claim_about_phi_alpha:
      statement: >-
        On the four tested toy instances, the integer the committed harness
        reports as `phi_alpha` is, in every arm measured, equal to or bounded by
        the number of positions at which the emitted row list departs from a
        clean concatenation of sigma-orbit triples (S3: 4 of 4 in arm A, equality
        in 3 of 4; equality in 4 of 4 in arm E). Under a common shift operator
        and without the appended rows, making the factor base phi-invariant
        changes it by 0, 0, 2 and 1 on values of order B (RT24-OBJ-5). With the
        appended rows, a small value is obtained by construction, and is also
        obtained - including the value 0 at B = 204 - by a construction with no
        endomorphism content (arm E at I3).
      therefore: >-
        `phi_alpha` is not established as a measurement of phi-invariance of the
        factor base, and it is not established as an artifact of construction
        either. It is UNADJUDICATED, exactly as the frozen contract fixed in
        advance. What IS established, at toy scale and on these four instances,
        is the narrower negative: whatever `phi_alpha` measures, the
        phi-invariance of the factor base is not what moves it - because
        removing the appended rows removes the entire effect while leaving the
        phi-invariant factor base in place, at 4 of 4.
      explicitly_not_claimed:
      - Not that phi_alpha is "an artifact" - F1 forbids that wording.
      - Not that arm E's alphas are comparable to arm A's - they are not.
      - Not any statement about H-STR-002's mechanism, which no arm tested.
      - Not any statement at any tier above toy, in either direction.

    deliverable_3_does_reproduction_rehabilitate_DEC-20260726-006:
      case_for_rehabilitation: >-
        (i) Arm A reproduces phi_alpha 9, 2, 4, 1 exactly, 4 of 4, plus
        misaligned_row_count 9, 5, 4, 1 exactly, and CTRL-8 matches the one
        overlapping committed record on all five fields. (ii) cost_ratio 0.011 is
        exact arithmetic on (alpha=1, B=397) and needs no separate measurement.
        (iii) The computation is deterministic, so (contract, code, seed)
        determines the output; the run directory is bookkeeping around a
        function evaluation. (iv) Nothing was fabricated, which is the accusation
        an absent-artifact finding invites and which this experiment refutes.
      case_against_rehabilitation: >-
        (i) Reproduction was performed by a DIFFERENT program (ablation_driver.py)
        under a DIFFERENT experiment id, so the numbers now belong to
        EXP-STR-003's run records; they do not retroactively populate
        EV-STR-002's `run_ids: []`. (ii) The producing path EV-STR-002 claims is
        falsified for two of its four headline rows: S4 measured IndexError at
        endomorphism_la.py:451 at both B mod 3 != 0 instances, exit code 1, no
        record written - the committed main() cannot have produced the B = 55 and
        B = 397 rows. (iii) The random-arm half does not reproduce at all
        (RT24-OBJ-7), so "the numbers reproduced" is true of exactly half the
        headline pairs. (iv) 5de2db97 rewrote EV-STR-002.yaml,
        DEC-20260726-006.yaml and EXP-STR-002/analysis.md IN PLACE, adding zero
        run records - an AGENTS core rule 4 immutability violation that
        reproducing a number cannot cure. (v) Most importantly, EV-STR-002's
        content is not the integers; it is the INFERENCE ("endomorphism-invariant
        factor bases induce O(1) displacement rank ... the structured solve beats
        Wiedemann by 3x-90x"). RT24-OBJ-5 contradicts the first clause at 4 of 4
        and RT24-OBJ-8 shows the second clause prices a system that was never
        assembled and is rank-deficient by 67 at B = 397.
      settled: >-
        NO. Reproducing the numbers rehabilitates the ARITHMETIC and the good
        faith of whoever computed it; it does not rehabilitate the record. An
        evidence record is a claim plus its artifacts plus its inference. The
        artifacts remain absent (census PASS across 247 refs and 47,983
        objects), the stated provenance is falsified for half the headline rows,
        half the numbers do not reproduce, and the inference is contradicted by
        the very experiment that reproduced the other half. The correct
        disposition is to cite EXP-STR-003's run records for the alphas going
        forward and to supersede EV-STR-002 - never to edit it, and never to
        treat the reproduction as a retroactive artifact.

    deliverable_4_does_instrument_confound_imply_evidentiary_basis_failure:
      plain_answer: >-
        NO - not by that route, and I say so plainly because taking that route is
        precisely how this batch went wrong. The premise "the instrument is
        confounded" is UNADJUDICATED after F1. Any record that reasons
        "phi_alpha is an artifact, therefore DEC-20260726-006 fails" is
        re-committing the error, and I do not offer that reasoning.
      the_routes_that_do_hold: >-
        The evidentiary basis of DEC-20260726-006 fails on three grounds that
        are independent of the instrument question, independent of arm E, and
        independent of F1:
        (R1) ARTIFACTS. `run_ids: []`; no run record at B >= 55 in any ref -
             census validated PASS over 247 refs and 47,983 objects; the claimed
             producing path crashes at two of the four headline instances (S4,
             measured, 4 committed run records); half the headline numbers do
             not reproduce (RT24-OBJ-7); and the record was rewritten in place
             (5de2db97).
        (R2) THE ONE-VARIABLE COMPARISON. Under a common phi shift and without
             the appended rows, phi-invariance of the factor base moves alpha by
             0, 0, 2, 1 on values of order B, at 4 of 4 (RT24-OBJ-5). The
             record's inference sentence is contradicted on its own metric.
        (R3) NO COST PATH. No right-hand side, no assembled system, no solve,
             rank deficiency 4/6/30/67, no archived rho or BSGS baseline at the
             two headline instances, and the cost model itself untested
             (RT-CM-1..6, RT24-OBJ-8, RT24-OBJ-12).
      gap_stated_plainly: >-
        R1 is an evidence-integrity failure, not a mathematical one. R2 is a
        measured contradiction of the record's inference sentence but is open to
        the defender's reading of FC-1 (RT24-OBJ-5). R3 is an absence, not a
        refutation. None of the three, alone or together, shows the MECHANISM is
        wrong, and none licenses rejection.

  # =====================================================================
  # 4. THE SINGLE TRANSITION
  # =====================================================================
  recommended_transition:
    named_transition: weaken
    applies_to:
      hypothesis: H-STR-002, status supported -> weakened
      decision: DEC-20260726-006, marked superseded by a NEW decision record
      evidence: EV-STR-002, superseded by a NEW evidence record carrying the
        EXP-STR-003 run ids; never edited in place
    delivery_form: >-
      One ledger archive task creating NEW records only: a decision superseding
      DEC-20260726-006, a correction record documenting the 5de2db97 in-place
      rewrite of EV-STR-002 / DEC-20260726-006 / analysis.md in the established
      CORR-20260727-005/002 form, and an evidence record for EXP-STR-003 at
      strength `preliminary` and claim_tier `toy`. Nothing under
      experiments/EXP-STR-002/ or experiments/EXP-STR-003/ is touched.
    justification: >-
      `weaken` is the strongest transition the archived, replicable evidence
      supports and the weakest that is honest. The status `supported` cannot
      survive R1, R2 and R3 above. But three separate rules cap it at `weaken`:
      docs/claims-and-verification.md ("an empirical-only refutation on a single
      unreplicated run takes `weaken` + replication"); the absence of any
      instance on which the MECHANISM fails; and the ambiguity in H-STR-002's
      own FC-1 (RT24-OBJ-5). The weakening must be stated as: the evidentiary
      basis for `supported` fails, the instrument question is UNADJUDICATED, and
      the mechanism is untested - not as a finding against the mathematics.
    why_the_alternatives_are_unavailable:
      replicate: >-
        UNAVAILABLE. The independent re-execution reserved as TASK-20260727-023
        does not exist in this tree; the frozen contract caps EXP-STR-003 at
        strength `preliminary` and forbids describing it as replicated until
        that report exists. Separately, EXP-STR-003 replicates an INSTRUMENT and
        could not replicate H-STR-002 even if it had been re-run: no arm
        measures the mechanism.
      inconclusive: >-
        UNDERSTATES. It would be right if the only finding were the
        UNADJUDICATED instrument question. It is not: R1 is a documented
        artifact failure validated PASS, and R2 is a measured 4-of-4
        contradiction of the evidence record's own inference sentence under a
        one-variable comparison. `inconclusive` would leave the ledger silent
        about both and would let a future reader re-derive `supported` from the
        same unreproducible record.
      correction_without_status_change: >-
        INSUFFICIENT. It repairs the in-place rewrite and the missing run ids
        while leaving H-STR-002 `supported` on an evidence record whose extended
        rows have no artifacts anywhere, whose random-arm numbers do not
        reproduce, and whose stated producing path crashes at half its headline
        instances. A status must not outlive its evidence. The correction is
        necessary - it is part of the delivery form above - and it is not
        sufficient.
      reject_scoped: >-
        FORBIDDEN by the handoff and I concur without reservation. No instance is
        exhibited on which the mechanism fails. The mechanism is a one-line
        consequence of phi being an automorphism: for phi-invariant F, phi(R) is
        a genuine relation whenever R is, and the closed system really is
        C_3-equivariant. The refutation artifact achieved is `empirical_only`
        and unreplicated, which by docs/claims-and-verification.md takes
        `weaken` plus replication. Rejecting here would convert a bounded
        instrument ablation into an impossibility claim, which the Red Team
        contract prohibits outright.

  refutation_artifact_classification:
    strongest_class_this_result_ADMITS: derivation
    why: >-
      The identity D[i][j] = M[i][j] - M[sigma(i)][sigma(j)] in the square branch
      (lines 233-242) together with the append rule (lines 292-304) and the
      truncation `xs[:B]` in `_build_phi_invariant_factor_base` yields, in a few
      lines checkable by an independent reader, that alpha counts phase breaks in
      the emission stream. It is self-contained, algebraic, and confirmed at
      4 of 4 by S3.
    strongest_class_it_currently_SUPPORTS: empirical_only
    why_not_derivation_yet: >-
      No derivation note is archived. The only place that argument exists is
      RT-OBJ-1's `static_argument` inside an UNTRACKED working-tree file
      (RT24-OBJ-10), and docs/claims-and-verification.md requires the artifact to
      be produced and snapshot-committed BEFORE the decision that relies on it.
      Until such a note is written and committed, the achieved level is
      `empirical_only`, which is exactly why the transition is capped at
      `weaken` + replication.
    counterexample_certificate: >-
      NOT AVAILABLE. Every run record carries certificate {kind: none}, and no
      arm claims a solve, a decomposition, or any statement a verifier could
      independently re-check. Arm E at I3 (alpha = 0 on a phi-free row list) is
      the closest thing to an explicit counterinstance, but it is packaged as a
      metric, not as a certificate.

  # =====================================================================
  # 5. CONTROLS, MUTATION, BASELINE
  # =====================================================================
  required_controls:
  - id: RT24-CTRL-1
    priority: 1
    control: >-
      Arm E-prime: the phi-free closure that emits each sigma-orbit ONCE and
      never suppresses (skip a base row whose orbit is already present, then
      append both shifts unconditionally). Frozen, archived, all four instances,
      beside the as-frozen arm E. This is the cheapest discriminating control in
      the whole batch: it isolates closure convention from endomorphism content
      with zero new mathematics, and it converts my RT24-OBJ-1 probe into
      evidence.
    predicted: >-
      alpha 0, 1, 0, 1 - stated as a PREDICTION from an unarchived probe, exactly
      as the prior predictions were, and to be tested, never cited.
  - id: RT24-CTRL-2
    priority: 1
    control: >-
      Matched-nuisance comparison: truncate arm E's base list to the same number
      of base rows arm A consumed (15 / 22 / 72 / 136) so that the first B
      emitted rows of each arm derive from the same number of base rows, and
      report alpha CONDITIONAL on suppression count rather than as a raw
      cross-arm inequality. Any future criterion of the S1 form must control this
      variable or it is untestable.
  - id: RT24-CTRL-3
    priority: 1
    control: >-
      Arm A-prime: the as-committed phi arm with the dedup and zero-filter at
      lines 303-304 disabled (append the shifted row unconditionally). The
      derivational limb predicts alpha = 0 exactly at every instance with
      B mod 3 == 0, and alpha equal to the number of rows touching the truncated
      tail otherwise. This is a sharp, one-line, pass/fail test of what alpha is,
      using only committed code, and it needs no arm E at all.
  - id: RT24-CTRL-4
    priority: 2
    control: >-
      Arm A-double-prime: a phi-invariant factor base of exactly 3*floor(B/3)
      elements (no truncated orbit) at the B mod 3 != 0 instances, isolating the
      `xs[:B]` truncation effect that produces misalignment with zero
      suppression at I2 and I4.
  - id: RT24-CTRL-5
    priority: 2
    control: >-
      Record sha256 of the factor base and of the final row list in every
      raw-result.json, so an alpha can be re-checked without re-execution
      (RT24-OBJ-11).
  - id: RT24-CTRL-6
    priority: 2
    control: >-
      Commit rho and BSGS baselines at n = 41617 and n = 158071 INSIDE the
      repository, with discrete_log certificates, so the two headline instances
      have an archived baseline to be compared against (RT24-OBJ-12).
  - id: RT24-CTRL-7
    priority: 1
    control: >-
      Assemble an actual linear system: add the target's scalar multiple as a
      right-hand side column, report rank over Z/nZ, and attempt a solve with a
      discrete_log certificate. Until a system exists and is solvable, no cost
      model on either side is comparing anything real (RT24-OBJ-8).
  - id: RT24-CTRL-8
    priority: 3
    control: >-
      Implement one structured solver and measure wall time against Wiedemann at
      B = 397. This is the only thing that can touch RT-CM-1..RT-CM-6.

  counterexample_or_mutation:
    cheapest_single_mutation: RT24-CTRL-3 (arm A-prime, dedup disabled)
    why: >-
      It is a two-line change to a copy of the append rule inside a new driver,
      it needs no new mathematics, no new instance and no arm E, and it makes a
      falsifiable point prediction: alpha = 0 at I1 and I3. If alpha = 0 there,
      the metric's value in the as-committed arm is settled as a count of dedup
      and truncation events and the UNADJUDICATED verdict resolves. If alpha != 0
      there, the derivational limb of RT-OBJ-1 fails too and the whole objection
      family collapses - which is a genuinely available outcome and the reason
      to run it.
    second_cheapest: RT24-CTRL-1 (arm E-prime), which explains F1 directly.

  baseline_comparison:
    pollard_rho: >-
      Committed, with independently verified discrete_log certificates:
      RUN-STR-rho-b12-s1 solves n = 733 in 24 group operations;
      RUN-STR-rho-b12-s2 solves n = 3061 in 156. Against this, the index-calculus
      arm at the same instances solved nothing. At n = 158071 the phi arm spent
      314 decomposition attempts, each an arity-2 double loop over the factor
      base of order B(B+1)/2 = 79,003 s3_eval calls - roughly 2.5e7 field-level
      operations - to produce a matrix that is 67 short of full rank and was
      never solved. No archived rho datum exists at that n (RT24-OBJ-12); BSGS
      arithmetic gives 2*sqrt(158071) ~ 795 group operations with ~398 stored
      points. The gap is three to four orders of magnitude and it widens with B.
    bsgs: >-
      2*sqrt(n) group operations, ~54 / 111 / 408 / 795 at the four instances,
      with sqrt(n) memory. Neither EV-STR-002 nor DEC-20260726-006 compares
      against rho or BSGS anywhere; they compare a model of one linear-algebra
      step against a model of another.
    closest_specialized_baseline: >-
      Automorphism exploitation is a solved, quantified technique.
      Wiener-Zuccherato and Duursma-Gaudry-Morain give rho a sqrt(r) = sqrt(3) ~
      1.73x speedup on a curve with an order-3 automorphism; quotienting an index
      calculus factor base by an order-r automorphism gives a factor r in
      relation collection and an r-fold block decomposition in the linear
      algebra. The committed data reproduce exactly that and nothing beyond it:
      searches per relation row, phi arm vs random arm, are 0.692/1.811,
      0.364/1.154, 0.383/1.136 and 0.770/2.466 - ratios 2.62x, 3.17x, 2.97x and
      3.20x, i.e. r = 3 at every instance. That constant factor is the real,
      reproducible, archived effect in this line of work. It is already known,
      and it is not target-class.

  # =====================================================================
  # 6. HEURISTIC, COST-MODEL, REDUCTION AND SCOPE CHALLENGES
  # =====================================================================
  heuristic_challenges:
  - id: RT24-H-1
    challenge: >-
      docs/target-result-profile.md is ABSENT at this commit. It governs as an
      instruction to me but I do not cite it as a present document. Under its
      rule A1 as given in my task card, constant-factor and log-cofactor
      improvements are not target-class; the only reproducible effect measured
      here is the constant factor r = 3, so nothing in this batch is
      target-class in either direction.
  - id: RT24-H-2
    challenge: >-
      H-STR-002's assumptions are prose, not numbered heuristics, and none has a
      random-model justification built from a rigorous bound plus a classical
      distribution theorem. "alpha = O(1) at large B" is asserted from four toy
      points that are not monotone (9, 2, 4, 1) and that RT24-OBJ-4 shows are a
      phase-break count. No scaling law may be read off them.
  - id: RT24-H-3
    challenge: >-
      Scale honesty. Maximum tested field size is 20 bits, n <= 158071 (~17.3
      bits), B <= 397. AGENTS core rule 7 forbids presenting this as
      crypto-scale validation, and no substitute-sampling argument is offered
      that would reach cryptographic sizes.
  - id: RT24-H-4
    challenge: >-
      Cost bookkeeping. Nowhere is total expected cost computed as per-attempt
      cost times inverse success probability. Success probability of the overall
      procedure is effectively set to 1 while no instance has ever produced a
      solvable system (RT24-OBJ-8).

  cost_model_challenges:
    status: >-
      RT-CM-1 through RT-CM-6 are UNTOUCHED by EXP-STR-003 and MUST NOT be
      described as settled, tested or addressed by any downstream record. The
      frozen contract says so itself in metrics.explicitly_not_measured: "No cost
      ratio, no structured_cost, no wiedemann_cost, no density_penalty and no
      crossover claim. This contract measures an instrument; the cost model is
      not under test here and RT-CM-1..RT-CM-6 remain open objections that no arm
      of this experiment addresses." I confirm that against the run records: no
      cell reports any cost quantity, and no wall-time comparison of any solver
      exists in this repository.
    RT24-CM-A: >-
      The order-3 objection stands untested. alpha^2 * B * log B is the
      superfast-solver cost for a Toeplitz-LIKE matrix whose displacement
      operator is the NILPOTENT lower shift. Here Z is a permutation of order 3
      (endomorphism_la.py:174-183), so small rank(M - Z M Z^{-1}) means near
      C_3-EQUIVARIANCE, a different structure. An exactly equivariant system
      block-diagonalises into 3 blocks of size B/3, giving 3 * 2*(B/3)^2 =
      (2/3)B^2 against Wiedemann's 2B^2 - an honest ceiling of factor r = 3, not
      the 44x-90x the model reports. Arithmetic check that the ceiling is even
      available: the block decomposition needs a cube root of unity mod n, i.e.
      3 | n-1; n-1 = 732, 3060, 41616, 158070 are all divisible by 3, so it is
      available at all four instances and the r = 3 ceiling is the right
      comparison. No arm tested any of this.
    RT24-CM-B: >-
      Degenerate limit, with one correction to the prior session's supporting
      example. Line 472 computes structured_cost = alpha^2 * B * ceil(log2 B) if
      alpha > 0 else -1: the model's limit as alpha -> 0 is zero operations for a
      B x B solve, and the code papers over it with a -1 sentinel rather than
      treating it as a contradiction. That is a code-reading fact, verified, and
      independent of any arm. The prior session's illustration ("arm E produced
      alpha = 0 at B = 27 and B = 204") is now FALSIFIED at B = 27 (measured 11)
      and confirmed at B = 204 (measured 0); the objection stands on the
      arithmetic, not on that example.
    RT24-CM-C: >-
      Relation collection is still uncharged and still dominates. Using the
      committed attempt counts and B(B+1)/2 s3_eval per attempt: 27 attempts at
      B = 27 -> ~1.0e4 against a modelled Wiedemann 2B^2 = 1458; 314 attempts at
      B = 397 -> ~2.5e7 against 315,218. Collection is 7x to 79x the ENTIRE
      modelled linear algebra and the ratio grows with B. Units are not strictly
      comparable (s3_eval vs "operation"), so these are order-of-magnitude
      statements; the gaps are one to two orders of magnitude and survive any
      plausible conversion.
    RT24-CM-D: >-
      Memory is absent on both sides. Wiedemann's point is O(B) memory at O(B^2)
      operations; the structured side needs a generator representation plus a
      transform. Neither is costed, and no time-memory interpolation is offered,
      so there is no way to check whether a memory-constrained baseline dominates
      everywhere practical.
    RT24-CM-E: >-
      Recomputing the committed model on the ablated alpha (arm B: 27, 52, 197,
      386, now backed by committed run records) gives cost_ratio 67.5, 147.5,
      761.0 and 1688.9 - two to three orders of magnitude WORSE than Wiedemann at
      every headline B. This is a model evaluation on measured inputs, not a
      measurement, and I present it only to show how completely the headline
      depends on the appended rows.

  reduction_and_scope_challenges:
    reductions_cited: >-
      None. This line of work cites no published reduction and derives no
      corollary from one, so there is no reduction instantiation to check.
    scope_confirmation:
      curve_family: j = 0 (a = 0, CM discriminant -3) prime-field toy curves with p = 1 mod 3
      instances: 4 (field_bits 12 seed 1, 12 seed 2, 16 seed 3, 20 seed 3)
      parameters: >-
        p in {2293, 2953, 42013, 158071-scale}; n in {733, 3061, 41617, 158071};
        B = ceil(isqrt(n)) in {27, 55, 204, 397}; decomposition arity m = 2 only;
        num_targets = max(10, B+10); endomorphism phi(x,y) = (zeta3*x, y), r = 3
      solver: >-
        harness/semaev.py `_find_decomposition` for collection, and the committed
        `_measure_displacement_rank` for the metric. No linear-system solver of
        any kind was run. No structured solver exists in this repository.
      stack: Python 3.13.1, numpy 2.4.0, macOS arm64, as recorded per run
      budget: 20 runs, 132.595 s of a declared 5400 s, peak RSS 0.107 GB of 8 GB
      claim_tier: toy (max field bits 20 <= 32 per docs/claims-and-verification.md)
    scope_test_results:
    - >-
      NOT a cryptanalytic result. Nothing here attacks, weakens or speeds up any
      cryptosystem, and no record in this batch may say otherwise.
    - >-
      NOT an attack improvement. The only reproducible speedup measured is the
      classical factor r = 3 in relation collection, which is known and is
      already the specialized baseline.
    - >-
      NOT a closure and NOT an impossibility claim. Negative findings close
      exactly the four tested instances and nothing else.
    - >-
      NO asymptotic-complexity claim is smuggled in in either direction. "alpha =
      O(1) at large B" is not supported by four toy points and is not asserted
      here; neither is any claim that alpha must grow.
    - >-
      NO scope inflation. Nothing extends to arity m = 3, to B > 397, to j != 0
      curves, to generic curves, or to index calculus in general.

  # =====================================================================
  # 7. SETTLEMENT
  # =====================================================================
  narrowest_supported_statement: >-
    At toy tier, on four deterministically generated j = 0 prime-field curves
    with p = 1 mod 3, n <= 158071, B <= 397 and arity 2, measured under the
    frozen EXP-STR-003 contract at commit 92268c9e and archived at c79e3a8d:
    (1) with the phi-orbit rows not appended, making the factor base
    phi-invariant does not change the displacement-rank metric relative to a
    random factor base under the same shift operator - 27, 52, 197, 386 against
    27, 52, 199, 387 at 4 of 4; (2) in every arm measured, the metric is equal to
    or bounded by the count of positions where the emitted row list departs from
    a clean sigma-orbit concatenation - 4 of 4 in arm A with equality at 3 of 4,
    and equality at 4 of 4 in arm E; (3) a row list containing no endomorphism
    content exhibits the same phi-shift versus random-shift signature the
    original claim rested on, at 4 of 4, and attains the metric's optimum
    (alpha = 0) at B = 204; (4) the committed main() terminates with IndexError
    at endomorphism_la.py:451 at both instances with B mod 3 != 0 and completes
    at both with B mod 3 == 0, so that path cannot have produced the B = 55 and
    B = 397 rows of experiments/EXP-STR-002/analysis.md; and (5) the phi arm's
    relation matrix is rank-deficient by 4, 6, 30 and 67, so no solve is
    available from it at any tested instance. Whether the reported `phi_alpha`
    is an artifact of the row-insertion rule remains UNADJUDICATED: F1 fired at
    I1 and I4, OBS-1/RT-OBJ-1's comparative limb is withdrawn, and no record may
    call the metric refuted. Nothing here is a cryptanalytic result, an attack,
    an attack improvement, a closure, or evidence at any tier above toy, in
