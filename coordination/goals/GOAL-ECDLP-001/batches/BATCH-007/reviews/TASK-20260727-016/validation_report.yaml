  hard_gate_ref_search:
    claim_under_test: >-
      "No run record for B = 55, 204 or 397 exists in ANY ref." Orchestrator
      asserted it; the Coordinator had no shell and recorded it as UNVERIFIED
      (census ref_search.verification_status_in_this_session, R3,
      what_is_NOT_established item 3).
    verdict: CONFIRMED - the claim is TRUE over every ref and every object in this repository.
    repository_scale:
      local_heads: 194
      remote_tracking_refs: 53
      total_refs_scanned: 247
      tags: 0
      stash_entries: 20
      objects_in_db: {blobs: 34997, trees: 11112, commits: 1874}
      remotes: 'origin https://github.com/aburan28/crypto-autoresearcher'
    commands_and_outputs:
    - id: A
      purpose: every EXP-STR-002 run directory present at any ref tip
      cmd: >-
        for r in $(git for-each-ref --format='%(refname)' refs/heads refs/remotes);
        do git ls-tree -r --name-only "$r" -- experiments/EXP-STR-002/; done
        | awk -F/ '{print $4}' | sort -u
      refs_scanned: 247
      path_lines_returned: 1920
      output: |
        RUN-STR-phi-b12-s1-m2
        RUN-STR-phi-b8-s1-m2
        RUN-STR-phi-b8-s2-m2
        RUN-STR-phi-b8-s3-m2
        RUN-STR-rand-b12-s1-m2
        RUN-STR-rand-b8-s1-m2
        RUN-STR-rand-b8-s2-m2
        RUN-STR-rand-b8-s3-m2
        RUN-STR-rho-b12-s1
        RUN-STR-rho-b12-s2
        RUN-STR-rho-b8-s1
        RUN-STR-rho-b8-s2
        RUN-STR-rho-b8-s3
      finding: exactly 13, identical to the census inventory. No b12-s2/b12-s3/b16/b20 phi or rand run.
    - id: B
      purpose: every ADD of a run path in all-refs history INCLUDING reflogs
      cmd: >-
        git log --all --reflog --diff-filter=A --name-only
        -- 'experiments/EXP-STR-002/runs/*' | awk -F/ '{print $4}' | sort | uniq -c
      output: '6 file-adds for each of the same 13 run directories; no fourteenth directory'
      finding: no B=55/204/397 run record was ever added on any ref, ever.
    - id: C
      purpose: rule out add-then-delete (a record that existed and was removed)
      cmd: git log --all --reflog --diff-filter=D --name-only -- 'experiments/EXP-STR-002/runs/*'
      output: '(empty)'
      finding: no EXP-STR-002 run path was ever deleted on any ref.
    - id: D
      purpose: rule out rename
      cmd: git log --all --reflog --diff-filter=R --name-only -- 'experiments/EXP-STR-002/runs/*'
      output: '(empty)'
      finding: no EXP-STR-002 run path was ever renamed.
    - id: E
      purpose: >-
        strongest available check - scan the ENTIRE object database (trees AND
        blobs, reachable or unreachable/dangling) for any RUN-STR identifier
      cmd: >-
        git cat-file --batch-all-objects --batch --buffer
        | grep -a -o -E 'RUN-STR-[A-Za-z0-9_-]+' | sort | uniq -c | sort -rn
      output: |
