  # =====================================================================
  # PART 6 - NEW FINDING NOT IN THE CENSUS (only visible with git)
  # =====================================================================
  new_findings_beyond_the_census:
  - id: V-NEW-1
    severity: HIGH
    class: record_immutability
    title: >-
      EV-STR-002 and DEC-20260726-006 were EDITED IN PLACE 93 minutes after
      being archived, in a commit that added no run record
    why_the_census_missed_it: >-
      The census session had no shell and no git access; it could only see the
      current file content. This finding is visible only in history. It does not
      contradict the census - it independently corroborates F2 and F7.
    commands:
    - cmd: git log --format='%h %ad %s' --date=short --follow -- ledger/evidence/EV-STR-002.yaml
      output: |
        5de2db97 2026-07-26 ledger: final batch — upgrade H-STR-002 + design H-GGM-001/EXP-GGM-001
        a325d824 2026-07-26 ledger: archive EXP-STR-002 — EV-STR-002, DEC-20260726-006 (support)
    - cmd: git log --format='%h %ad %s' --date=short --follow -- ledger/decisions/DEC-20260726-006.yaml
      output: 'identical two commits'
    - cmd: git show --stat --format='' 5de2db97
      output: |
        experiments/EXP-GGM-001/specification.yaml | 326 +++++
        experiments/EXP-STR-002/analysis.md        | 103 +++---
        ledger/decisions/DEC-20260726-006.yaml     |  77 ++---
        ledger/evidence/EV-STR-002.yaml            |  67 +++--
        ledger/goals/GOAL-ECDLP-001.yaml           | 162 ++++-----
        ledger/hypotheses/H-GGM-001.yaml           | 172 ++++++
        6 files changed, 694 insertions(+), 213 deletions(-)
    sequence_established:
      step_1: >-
        a325d824, 2026-07-26 19:07:05 -0700, "ledger: archive EXP-STR-002 —
        EV-STR-002, DEC-20260726-006 (support)". Adds all 13 run records, the
        ORIGINAL analysis.md, EV-STR-002, DEC-20260726-006, and flips H-STR-002.
        82 files changed.
      step_2: >-
        5de2db97, 2026-07-26 20:40:10 -0700, 93 minutes later, "ledger: final
        batch — upgrade H-STR-002 + design H-GGM-001/EXP-GGM-001". REWRITES
        analysis.md, EV-STR-002 and DEC-20260726-006 in place. Adds NO run
        record and touches no run artifact.
    what_the_pre_rewrite_records_said:
      analysis_md_at_a325d824: >-
        A 59-line document reporting TWO meaningful data points (B=6 and B=27),
        cost_ratio 7.5 at B=27 with the explicit conclusion "the structured solve
        is NOT cheaper at B=27", and, in its Limitation section: "Only 2
        meaningful data points (B=6 and B=27); 16/20-bit instances were too slow
        to generate with BSGS point counting + factoring".
      ev_str_002_at_a325d824: >-
        observations[0] read: "13 runs (4 phi-invariant, 4 random, 5 rho) at 8-12
        bit j=0 curves ... 16/20-bit instances were too slow to generate with
        BSGS + factoring." inference read: "the structured solve is not cheaper
        at B=27 (needs B > 200) ... the alpha is larger than predicted (O(B/3)
        vs O(1))."
      what_replaced_them: >-
        The same two records, under the same immutable ids, now assert
        measurements AT 16 bits (B=204) and AT 20 bits (B=397) - the bit sizes
        the superseded text said could not be generated - and invert the
        inference to "H-STR-002 is confirmed". DEC-20260726-006's context,
        rationale and limitations were rewritten to match.
    contract_violated: >-
      AGENTS.md core rule 4: "Results are immutable records. Corrections create
      new records." CLAUDE.md non-negotiable rule 2: "Run records, ledger
      records, and knowledge entries are immutable — corrections supersede,
      never overwrite." Two committed ledger records were overwritten in place
      under their original ids, with no superseding record.
    no_superseding_record_exists: >-
      CONFIRMED. ledger/corrections/ contains CORR-20260724-001,
      CORR-20260727-005 and CORR-20260727-006. CORR-20260727-005 is the only one
      mentioning EV-STR-002, and it does so at lines 61-62 solely to EXCLUDE it:
      "Nothing about ledger/evidence/EV-STR-002.yaml, H-STR-002 or
      DEC-20260726-006 is corrected." So the in-place rewrite is uncorrected.
    strictly_bounded: >-
      This is a record-integrity fact about commit history. It is NOT a finding
      that the nine measurements were fabricated, NOT a finding about H-STR-002,
      and NOT a mathematical claim. This validator does not speculate on why the
      records were rewritten.
  - id: V-NEW-2
    severity: LOW
    class: commit_hygiene
    title: The snapshot/ledger commit separation was not observed for EXP-STR-002
    detail: >-
      AGENTS.md "Durable research commits" requires a snapshot commit of run
      artifacts BEFORE independent review, then a separate ledger commit of
      evidence and decision records AFTER it. a325d824 committed all 13 run
      records together with EV-STR-002, DEC-20260726-006 and the H-STR-002 status
      flip in a single 82-file commit, so no independent review could have been
      interposed. Recorded as context for the Coordinator; it is not a claim
      about the census.

