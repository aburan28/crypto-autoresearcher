  # PART 5 - MANIFEST / SEED / CONTROL INTEGRITY (census Q3, delegated here)
  # =====================================================================
  manifest_and_seed_integrity:
    raw_vs_manifest_all_13:
      result: PASS - 13 of 13
      detail: >-
        For every one of the 13 runs, manifest.yaml `result.metrics` equals
        raw-result.json `metrics` field for field, and the certificate kind
        agrees. This extends the census's spot check on the two B=27 records to
