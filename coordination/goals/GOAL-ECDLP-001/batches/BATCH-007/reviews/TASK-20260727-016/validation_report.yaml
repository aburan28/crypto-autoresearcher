  claim_adjudication:
  - id: C1
    claim: 'B values present are exactly {2, 6, 27}'
    verdict: CONFIRMED
    evidence: >-
      Recount over the 8 committed measurement records yields the set {2, 6, 27}
      and nothing else. B=2 at 8-bit seeds 1 and 2 (four records), B=6 at 8-bit
      seed 3 (two records), B=27 at 12-bit seed 1 (two records). The five rho
      records carry no B field at all, exactly as the census clarifies in R2.
      Cross-check: harness/endomorphism_la.py:383 `B = math.ceil(math.isqrt(n))`
      reproduces every pairing - isqrt(7)=2, isqrt(37)=6, isqrt(733)=27.
  - id: C2
    claim: 'At B=27: phi_alpha=9, rand_alpha=27, cost_ratio=7.5, phi_hits 15/27, rand_hits 37/67'
    verdict: CONFIRMED - all seven values exact
