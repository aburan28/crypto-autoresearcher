  - id: AV2
    subject: harness/endomorphism_la.py performs no Groebner solve
    verdict: CONFIRMED, on both limbs, by reading the committed file
    limb_1_sympy_usage: >-
      `grep -n -i -E 'sympy|groebner' harness/endomorphism_la.py` at 6eb3779
      returns exactly two lines: line 18 `import sympy` and line 59
      `factors = sympy.factorint(order)`. The token "groebner" does not occur
      anywhere in the 512-line file, in any case form.
    limb_2_decomposition_path: >-
      endomorphism_la.py references module `semaev` at exactly two call sites:
      line 119 `semaev.build_factor_base(...)` and line 281
      `found, summands, cert = semaev._find_decomposition(E, factor_base, target, a, b, p)`.
      `semaev._find_decomposition` (harness/semaev.py lines 147-171) is a direct
      double loop `for i, v1 in enumerate(V): for v2 in V[i:]` using `s3_eval`
      as a pointwise filter plus an explicit `E.add(sA, sB) == R` check. It
      calls no solver.
    limb_3_the_only_groebner_call_is_unreachable_from_this_experiment: >-
      The single `sympy.groebner` call in harness/semaev.py is at line 121,
      inside `measure_s3_decomposition` (lines 92-144). endomorphism_la.py never
      calls `measure_s3_decomposition`. Therefore the m=2 code path that produced
      every EXP-STR-002 record performs no Groebner computation whatsoever.
    limb_4_no_groebner_quantity_was_recorded: >-
      CONFIRMED independently. None of the 13 committed raw-result.json contains
      `groebner_seconds`, `groebner_basis_size`, `groebner_basis_max_degree`,
      `is_trivial_ideal` or `decomposition_found` - the fields
      `measure_s3_decomposition` would emit. The EV-STR-002 boundary at line 55
      therefore names a quantity these run records do not carry.
    census_F4_caveat_confirmed: >-
      The census's own caveat is also correct and is upheld: line 281 binds
      `cert` and it is never used again, and both writers set
      `certificate={"kind": "none"}` at lines 484 and 498. The 15 and 37 counts
      are uncertificated integers in a metrics block. This validator therefore
      records that they are NOT independently re-verifiable from the archived
      artifacts alone - see limitations L3.

  - id: AV3
    subject: RUN-STR-rho-b12-s2 records n = 3061 with isqrt(3061) = 55; are its phi/rand siblings absent?
    verdict: CONFIRMED on both halves
    detail: >-
      RUN-STR-rho-b12-s2 raw-result.json carries raw.n = 3061 and
      certificate.statement.curve.p = 2953, manifest inputs.seed = 2,
      curve_id TOY-P12-a1c06429. Python `math.isqrt(3061)` = 55, and
      harness/endomorphism_la.py:383 computes B from n by exactly that formula.
      The matched phi and rand records for that same (bits=12, seed=2) instance
      -- RUN-STR-phi-b12-s2-m2 and RUN-STR-rand-b12-s2-m2 -- do not exist at any
      ref, in any stash, in any reflog, or as any object in the database
      (Part 1, query E).
    census_F6_structure_confirmed: >-
      The committed set is exactly rho+phi+rand at (8,1), (8,2), (8,3), (12,1),
      then rho ALONE at (12,2), and nothing after. Verified from the manifests'
      curve_id/seed grouping: TOY-P12-a1c06429 seed 2 is carried by
      RUN-STR-rho-b12-s2 and by no other record. The write order the census
      infers is confirmed in source: rho at lines 414-427, phi at 478-489, rand
      at 492-503.
    what_this_validator_does_NOT_establish: >-
      WHY the sequence stops there. As the census itself says, an interrupted
      execution, artifacts produced and never committed, and a separate
      unrecorded execution are all consistent with the git record. The history
      shows no deletion (Part 1, query C), which rules out "committed then
      removed" but does not distinguish the rest. Not speculated on further.

  - id: AV4
    subject: Internal consistency of the census with the files it cites; does it overstate?
    verdict: >-
      CONSISTENT. Every citation checked resolves, at the cited line numbers,
      to the quoted text. The census does not overstate; on several points it
      under-claims relative to what the artifacts support.
    citation_spot_checks:
    - cited: 'EV-STR-002 line 6 `run_ids: []` and line 23 basis statement'
      result: EXACT
    - cited: EV-STR-002 lines 25-27 (B=204), 28-30 (B=397), 31-33 (B=55), line 55 (Groebner boundary)
      result: EXACT at all four
    - cited: DEC-20260726-006 lines 19-20 "The crossover is at B ~ 55"
      result: EXACT
    - cited: analysis.md line 37 "an artifact of small B and poor orbit closure"
      result: EXACT
    - cited: 'analysis.md line 41 "alpha <= 3 for phi-invariant at B >= 55: MET"'
      result: EXACT
    - cited: specification.yaml lines 83-87 success criterion, "at all tested B"
      result: EXACT (criterion spans 83-87; the "all tested B" quantifier is on line 84)
    - cited: specification.yaml lines 36-39 phi-ablation control
      result: EXACT
    - cited: specification.yaml line 22 bit_sizes [8,12,16,20,24], line 25 arity [2,3], lines 123-125 expected_run_count ~600
      result: EXACT on all three
    - cited: H-STR-002 lines 70-73 falsification condition ("no separation from the random baseline")
      result: EXACT
    - cited: harness/endomorphism_la.py lines 281, 283, 292-304, 383, 398-400, 414-427, 434, 437-439, 441-452, 469-475, 478-489, 484, 492-503, 497, 498
      result: EXACT at every one of these line references
    - cited: harness/semaev.py lines 147-171 (_find_decomposition), line 121 (the only sympy.groebner)
      result: EXACT
    - cited: docs/task-lifecycle.md section 5 (amendment rule) and section 7 (expected run count, control comparability)
      result: >-
        EXACT in substance. Section 5 "Approval and handoff" states "Protocol
        changes after approval require a versioned amendment. Exploratory changes
        must be labeled exploratory and cannot be evaluated against the original
        confirmatory criterion." Section 7 "Validation" lists "expected run
        count", "duplicated or missing seeds", "agreement between raw and
        summarized data", "control comparability". The protocol_amendment schema
        with confirmatory_status is in the unnumbered "Protocol amendments"
        section at line 147.
    - cited: 'ripgrep for the absent run ids returns no matches; ledger/ grep returns seven files'
      result: >-
        BOTH REPRODUCED EXACTLY. The run-id grep returns empty. The ledger grep
        returns exactly seven files: CORR-20260727-005, DEC-20260726-006,
        DEC-20260727-008, EV-IC-002, EV-STR-002, GOAL-ECDLP-001, IDEA-20260727-001.
    - cited: 'no experiments/EXP-STR-002/amendments/ directory and no protocol_amendment record'
      result: >-
        CONFIRMED AND STRENGTHENED. No amendments path exists under EXP-STR-002
        at ANY of the 247 refs, and no protocol_amendment record naming
        EXP-STR-002 exists anywhere in the object database. The comparison class
        the census cites is real: experiments/EXP-IC-001/amendments/v1_to_v2.yaml
        and v2_to_v3.yaml both exist, and CORR-20260727-006 exists.
    census_arithmetic_checks_independently_reverified:
      check_2_cost_arithmetic: >-
        CONFIRMED. cost_ratio = alpha^2 * B * ceil(log2 B) / (2 B^2) reproduces
        every committed value exactly, and so do structured_cost and
        wiedemann_cost: B=27/alpha=9 -> 10935/1458 = 7.5; B=6/alpha=2 -> 72/72 = 1.0.
      check_3_density_arithmetic: >-
        CONFIRMED to full float precision. (37/67)/(15/27) = 0.9940298507462687
        matches the recorded value bit for bit; (4/9)/(4/9) = 1.0 matches.
        Sentinel -1 correctly emitted where phi_hits = 0.
      check_4_extended_table_self_consistency: >-
        CONFIRMED, and this validator reproduces it independently: from the
        stated (alpha, B) the model gives 7.5000, 0.2182, 0.3704, 3.7500,
        42.0577, 0.3137, 13.0841, 0.0113 against the table's 7.500, 0.218,
        0.370, 3.750, 42.1, 0.314, 13.1, 0.011. Every "reduction" entry equals
        rand_alpha/phi_alpha. And B == isqrt(n) for ALL NINE rows. The census's
        own interpretation of this check is also correct and is upheld: because
        cost_ratio and reduction are deterministic functions of (alpha, B) and B
        is a deterministic function of n, the consistency rules out an arithmetic
        slip in the derived columns and carries NO information about whether the
        measurements were made.
    where_the_census_under_claims:
    - >-
      It records the all-refs claim as unverified rather than asserting it. This
      validator has now verified it; the census was right to withhold.
    - >-
      It records check_4 as "the strongest point in favour of the extended
      table" and states it against its own thesis. That is the correct posture.
    - >-
      It routes OBS-1, the metric-validity question in F8, and the F9 ablation
