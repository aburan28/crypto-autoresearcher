    result: 0.9940298507462687 and 1.0 reproduced to full float precision; -1 sentinel correct
  - metric: phi_hit_rate / rand_hit_rate
    result: 15/27 and 37/67, 4/9 and 4/9, reproduced exactly
  - metric: B from n
    formula: math.ceil(math.isqrt(n))
    result: reproduces all committed pairings and all nine inline rows (B == isqrt(n) for 9/9)
  - metric: extended-table cost_ratio and reduction columns
    result: >-
      reproduced from the stated (alpha, B) for all eight computable rows.
      Carries no information about whether the measurements were made.
  - metric: phi_hits / rand_hits at B=27 (15/27, 37/67)
    result: >-
      NOT INDEPENDENTLY RECOMPUTABLE from the archived artifacts. The
      decomposition certificates are built and discarded (line 281) and both
      writers record certificate kind "none" (lines 484, 498). Re-deriving the
      counts would require re-executing the harness, which this read-only
      session does not do. Recorded as unverified, not as agreed. See L3.

