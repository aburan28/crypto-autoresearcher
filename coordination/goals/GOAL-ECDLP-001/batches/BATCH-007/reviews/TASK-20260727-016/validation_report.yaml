    result: reproduces every committed non-sentinel value exactly (7.5 at B=27, 1.0 at B=6)
  - metric: structured_cost / wiedemann_cost
    result: 10935/1458 at B=27 and 72/72 at B=6, both exact
  - metric: density_penalty
