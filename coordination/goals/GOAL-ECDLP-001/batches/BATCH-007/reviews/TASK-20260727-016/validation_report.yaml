    - >-
      Its what_is_NOT_established block correctly refuses four conclusions the
      artifacts cannot support, including "that the nine measurements were never
      made, or were fabricated". This validator makes no such finding either.
    overstatement_found: >-
      NONE of substance. One non-material provenance imprecision is recorded
