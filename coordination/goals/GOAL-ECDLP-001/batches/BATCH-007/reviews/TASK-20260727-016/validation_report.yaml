      cmd: "grep -rIl -E 'RUN-STR-(phi|rand)-b(12-s2|12-s3|16|20)' ."
      output: '(empty)'
      finding: confirms the census's ripgrep result independently.
    settled_answer: >-
      SETTLED. No run record for B = 55, 204 or 397 exists in any local branch,
      any remote-tracking branch, any tag, any stash, any reflog entry, or
      anywhere in the object database of this repository, reachable or not, at
