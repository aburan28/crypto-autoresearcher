  limitations:
  - id: L1
    limitation: >-
      Remote-tracking refs are as of FETCH_HEAD 2026-07-27 14:48 local, about 45
      minutes before the snapshot commit. This read-only offline session could
      not fetch. A run record pushed to origin after that time and never fetched
      would not appear in any query above. This is the only qualification on the
      Part 1 settled answer.
  - id: L2
    limitation: >-
      The ref search establishes what exists in THIS repository's refs, history
      and object database. It cannot establish what happened outside it. This
      validator therefore does NOT find that the nine measurements were never
      made or were fabricated, and makes no such claim, exactly as the census
      declines to.
  - id: L3
    limitation: >-
      The B=27 hit counts (15/27 and 37/67) were NOT independently recomputed.
      The decomposition certificates are discarded in the harness, so the counts
      are uncertificated integers that cannot be re-derived from the archived
      artifacts alone; re-deriving them requires executing the harness, which
      this read-only session did not do. The census's Q4 request for an
      independent recomputation is therefore answered as UNVERIFIED, not as
      confirmed. What IS confirmed is the semantics: a "hit" at m=2 is a
      successful semaev._find_decomposition call (line 281, counted at 283).
  - id: L4
    limitation: >-
      This report is a working-tree artifact until the TASK-20260727-018 ledger
      archive commits it and the dispatcher's post-commit verifier accepts the
      receipt.
  - id: L5
    limitation: >-
      resolved_model_id is runtime-reported and NOT probe-verified; no
      `orchestration.adapter doctor --probe` was run. No policy-equivalence
      claim is made.
  - id: L6
    limitation: >-
      Everything here is scoped to toy instances: five j=0 curves at 8 and 12
      bits, n between 7 and 3061, factor bases of at most 27 elements. Nothing
      in this report bears on medium-scale or cryptographic-scale curves, on
      generic curves, or on index calculus in general.
  - id: L7
    deviation: >-
      The task card lists a second artifact, independent_recount.md. Per the
