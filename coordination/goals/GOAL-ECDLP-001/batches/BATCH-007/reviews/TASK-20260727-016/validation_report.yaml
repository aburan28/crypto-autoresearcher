      fail for the nine inline measurements - no manifest, no seed record, no
      procedure. pass for the 13 committed runs.
  - check: correspondence validity
    result: not_applicable - no substitute-sampling correspondence is used.
  - check: scale binding
    result: >-
      pass. Every committed instance is at field_bits 8 or 12 with n between 7
      and 3061, at most about 12 bits. The census sets claim_tier toy on exactly
      that basis and states the ceiling explicitly. Toy scale is recorded as a
      limitation, not as scale-matched evidence (AGENTS rule 7).

  cost_model_checks:
  - check: cost unit declared
    result: >-
      pass, with the qualification stated in the records themselves. The unit is
      an abstract closed-form operation count, alpha^2 * B * ceil(log2 B) against
      2 B^2. EV-STR-002 lines 56-57 and DEC-20260726-006 line 34 both declare it
      a model comparison and not a measured wall-time. The census repeats this
      in what_is_NOT_established.
  - check: memory reported alongside time
    result: >-
      fail for the cost model - the model has no memory term at all, and no
      time-memory tradeoff is stated. The manifests do record peak_rss_bytes and
      cpu_seconds per run, but those are harness process measurements, not the
      modelled solve.
  - check: optimistic assumptions flagged
    result: >-
      partial. The model-vs-measured caveat is flagged. Not flagged anywhere:
      that no structured solver was implemented or timed, and that the
      hit-rate denominators feeding density_penalty come from loops with
      different stopping rules (quota max(10, B+10) = 37 at B=27; the random arm
      needed 37 hits in 67 attempts, the phi arm 15 in 27, because the phi arm
      appends up to two extra phi-shifted rows per hit at lines 292-304). The
      census routes the validity of that comparison to TASK-20260727-017 rather
      than adjudicating it; this validator confirms the mechanism in code and
      does the same.
  - check: total expected cost = per-attempt cost x inverse success probability
    result: >-
      not_applicable. No success probability enters this cost model; it is a
      direct linear-algebra operation count, not an attempt-repetition bound.

