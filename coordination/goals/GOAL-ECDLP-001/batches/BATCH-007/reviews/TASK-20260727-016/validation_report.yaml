        adapter_version null. It carries NO `model_verified`, NO model
        provenance and NO `degraded_requirements` field, which the artifact
        policy lists as required. For a deterministic harness this is a
        low-severity bookkeeping gap, recorded for completeness, not as a
        finding about the census.
    control_comparability:
      result: DEFECT CONFIRMED
      detail: >-
        Per docs/task-lifecycle.md section 7 ("control comparability"), the
        declared paired control is not present as an independent observation:
        the four rand records re-emit their phi sibling's payload minus `mode`
        (C3). Separately, the declared phi-ablation control - same phi-invariant
        F, random shift operator - is not implemented: line 439 measures the
        random shift against the RANDOM factor base, so the two arms differ in
        both the factor base and the shift operator. Confirms census F9.
    expected_run_count:
      result: DEFECT CONFIRMED
      detail: >-
        specification.yaml lines 123-125 declares approximately 600 runs
        (5 bit sizes x 3 seeds x 2 arities x 3 arms x 10 targets). The committed
