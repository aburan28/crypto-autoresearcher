         3 RUN-STR-phi-b8-s3-m2
         3 RUN-STR-phi-b8-s2-m2
         3 RUN-STR-phi-b8-s1-m2
         1 RUN-STR-rand-          <- f-string prefix in harness/endomorphism_la.py:493
         1 RUN-STR-phi-           <- f-string prefix in harness/endomorphism_la.py:479
      finding: >-
        The complete set of EXP-STR-002 run identifiers that has ever existed in
        this object database is the 13. No identifier for a 12-bit seed 2, 12-bit
        seed 3, 16-bit or 20-bit phi/rand run exists in any object.
    - id: F
      purpose: value-level search - any run-record payload recording B in {55,204,397}
      cmd: >-
        git cat-file --batch-all-objects --batch --buffer
        | grep -a -o -E '"B": *[0-9]+' | sort | uniq -c
      output: >-
        86 distinct "B" literals across the whole repository (all experiments).
        "B": 27 appears exactly 2 times (the two committed B=27 records).
        "B": 55 - ABSENT. "B": 204 - ABSENT. "B": 397 - ABSENT.
        Both spacings ("B": n and "B":n) were captured by the regex.
      finding: no object in the database records B = 55, 204 or 397 in a JSON metrics payload.
    - id: G
      purpose: all 20 stash entries (working-tree snapshots not on any branch)
      cmd: >-
        git stash list --format='%gd %H' | while read gd h; do
        git ls-tree -r --name-only "$h" -- experiments/EXP-STR-002/runs/; done
      output: 'stash@{0} -> the same 13 run directories; stash@{1}..stash@{19} -> none'
      finding: no additional run record hides in a stash.
    - id: H
