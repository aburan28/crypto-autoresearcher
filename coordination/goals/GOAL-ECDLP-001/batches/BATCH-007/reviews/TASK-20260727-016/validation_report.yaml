      cost_ratio     claimed=7.5   actual=7.5   OK
      phi_hits       claimed=15    actual=15    OK
      phi_attempts   claimed=27    actual=27    OK
      rand_hits      claimed=37    actual=37    OK
      rand_attempts  claimed=67    actual=67    OK
  - id: C3
    claim: >-
      The rand-* records are byte-identical in metrics to their phi-* siblings
      (cause: harness/endomorphism_la.py:497 filters the `mode` key), so there
      are 4 distinct payloads, not 8.
    verdict: CONFIRMED on both the data and the stated cause
    evidence: >-
      For all four (phi, rand) sibling pairs, dropping the single key `mode`
      from the phi record's metrics yields a dict EQUAL to the rand record's
      metrics. No rand record carries a `mode` key. Distinct measurement
      payloads among the 8 non-rho records: 4. The cause is verified in source:
      harness/endomorphism_la.py:497 reads
      `metrics={k: v for k, v in metrics.items() if k != "mode"}`
      - literally the phi record's metrics dict with `mode` deleted. Corroborating
      detail also confirmed: the rand records carry no `mode: random` label,
      only an input parameter `fb_type: random` in the manifest.
