    code_and_dirty_state:
      result: PASS
      detail: >-
        All 13 manifests record code.commit aa6304f252d388c95b8a12e885896ff9f6005a16
        and code.dirty false. That commit exists ("fix: z3 -> zeta3 variable name
        in endomorphism_la.py", 2026-07-26 19:04:13 -0700) and is an ancestor of
        the bound snapshot. harness/endomorphism_la.py is byte-identical at
        aa6304f2 and at 6eb3779 (blob 3dc7fccd...), so the code this validator
        read IS the code that produced the records.
    seeds:
      result: PASS - no duplicated or missing seed
      instances: |
        TOY-P8-a271451d  seed 1 -> phi-b8-s1-m2, rand-b8-s1-m2, rho-b8-s1
        TOY-P8-9b4723ae  seed 2 -> phi-b8-s2-m2, rand-b8-s2-m2, rho-b8-s2
        TOY-P8-1e177bd5  seed 3 -> phi-b8-s3-m2, rand-b8-s3-m2, rho-b8-s3
        TOY-P12-cf8e3078 seed 1 -> phi-b12-s1-m2, rand-b12-s1-m2, rho-b12-s1
        TOY-P12-a1c06429 seed 2 -> rho-b12-s2  ONLY
      note: >-
        Five distinct curve instances, each with a distinct seed within its bit
        size. The fifth carries a rho baseline with no measurement siblings -
        this is the AV3 / census-F6 gap.
    timing_fields:
      result: DEFECT CONFIRMED (census Q3 note upheld)
      detail: >-
        For each of the four complete (bits, seed) groups, the rho, phi and rand
        manifests carry an IDENTICAL started_at/finished_at pair. Example, the
        b12-s1 group: all three record
        started 2026-07-27T02:04:21.852128+00:00,
        finished 2026-07-27T02:04:21.852644+00:00, wall_seconds 0.000516.
        The source explains it exactly: `started`/`finished` are captured around
        the rho solve only (lines 398-401) and the same two values are passed to
        the phi and rand write_run calls (lines 487-489, 501-503). The phi and
        rand runs therefore carry NO timing of their own; their wall_seconds is
        the rho solve's duration. Any wall-time reading of a phi or rand record
        is invalid. This does not affect the metrics, which recompute correctly.
    stdout_stderr:
      result: PRESENT BUT EMPTY for the measurement arms
      detail: >-
        Every run directory contains stdout.log and stderr.log, satisfying
        specification.yaml line 79 as a file-existence check. For the phi and
        rand runs both are 0 bytes, because RunResult is constructed with
        `stdout=""` at lines 485 and 499. Only the rho runs captured real stdout.
    inference_block_completeness:
      result: INCOMPLETE against the AGENTS.md artifact policy
      detail: >-
        Every manifest's inference block carries requested_policy
