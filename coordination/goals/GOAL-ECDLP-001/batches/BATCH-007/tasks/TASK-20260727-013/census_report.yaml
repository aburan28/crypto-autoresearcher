census_report:
  id: CENSUS-STR-002-20260727
  record_class: >-
    Coordinator task report under a dispatch-queue task directory. This is NOT a
    ledger record. It is not evidence and it is not a decision; it changes no
    hypothesis status. It is frozen input to the independent non-originating
    reviews TASK-20260727-016 and TASK-20260727-017, and to the ledger archive
    TASK-20260727-018 that follows them.
  task_id: TASK-20260727-013
  batch_id: BATCH-007
  goal_id: GOAL-ECDLP-001
  produced_by: coordinator
  produced_on: '2026-07-27'
  status: frozen
  claim_tier: toy
  claim_tier_basis: >-
    docs/claims-and-verification.md "Claim-tier ceiling": tier is derived from
    the instances actually tested. Every committed EXP-STR-002 run is at
    field_bits 8 or 12 with prime subgroup order n between 7 and 3061, i.e. at
    most about 12 bits. That is far inside the `toy` band (max field bit size
    <= 32). Nothing in this report may assert anything about medium or
    cryptographic curves.

  headline:
    what_this_is: >-
      An ARTIFACT-INTEGRITY finding about the evidentiary basis of
      DEC-20260726-006 and EV-STR-002. Every headline number in that support
      decision comes from nine measurements recorded inline in prose, with no
      run record, no manifest, no seed, no command, no environment and no raw
      result. The single committed run at the largest recorded B contradicts
      the conclusion and is dismissed in both records as an artifact.
    what_this_is_NOT: >-
      This is NOT a mathematical refutation of H-STR-002. The mechanism the
      hypothesis states - that a phi-invariant factor base induces a
      block-circulant relation matrix with O(r) displacement rank - may well
      hold. What is missing is the EVIDENCE for it. This is also NOT a
      cryptanalytic result, NOT an attack improvement, NOT a closure, NOT an
      impossibility result, and NOT a claim of any tier above toy. No
      asymptotic exponent moves in either direction.
    status_effect: >-
      NONE in this record. H-STR-002 remains `supported` per DEC-20260726-006
      and EV-STR-002 remains as committed. Any transition belongs to the
      TASK-20260727-018 ledger archive, after TASK-20260727-016 and
      TASK-20260727-017 report.

  method:
    session_capabilities:
      shell_access: false
      git_access: false
      tools_used:
      - Glob over the working tree
      - Grep (ripgrep) content search over the working tree
      - Read of individual files
      what_this_forbids: >-
        This session ran NO git command, NO validator and NO harness. It
        therefore verified nothing about refs, history, ancestry, blob hashes
        or commit membership. Every statement below is a statement about the
        FILE CONTENT OF THE WORKING TREE at the checkout this session was
        given, not about any commit.
    working_tree: /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006
    branch_reported_by_orchestrator: claude/ecdlp-batch006
    head_reported_by_orchestrator: 4aa4068c
    head_verification_status: >-
      UNVERIFIED in this session. The branch name and HEAD were supplied by the
      dispatching orchestrator and no command was run to confirm either.
    enumeration_step_1: >-
      Glob `experiments/EXP-STR-002/runs/*/raw-result.json` returned exactly 13
      paths. Every one was read in full.
    enumeration_step_2: >-
      Glob `experiments/EXP-STR-002/*` returned analysis.md,
      specification.yaml and runs/ (plus macOS AppleDouble `._` sidecars). There
      is NO experiments/EXP-STR-002/amendments/ directory.
    enumeration_step_3: >-
