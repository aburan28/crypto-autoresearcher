      harness/semaev.py::_find_decomposition (lines 147-171), to fix the
      SEMANTICS of every recorded metric rather than infer them from the name.
    enumeration_step_4: >-
      Content search (ripgrep) over the whole working tree for the regex
      `RUN-STR-(phi|rand)-b(12-s2|12-s3|16|20)` returned NO MATCHES: no file
      anywhere in the tree names a phi or rand run identifier at 12-bit seed 2,
      12-bit seed 3, any 16-bit instance or any 20-bit instance.
    manifest_cross_check: >-
      For the two runs that carry the decision-relevant B=27 numbers
      (RUN-STR-phi-b12-s1-m2 and RUN-STR-rand-b12-s1-m2) the manifest.yaml
      `result.metrics` block was read and compared field by field with
      raw-result.json `metrics`. They agree exactly. The other eleven manifests
      were NOT read field by field; that check is delegated to
      TASK-20260727-016.

