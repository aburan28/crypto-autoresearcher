  findings:
  - id: F1
    title: >-
      The committed run set spans only B in {2, 6, 27}
    status: VERIFIED IN THE WORKING TREE
    statement: >-
      The eight committed EXP-STR-002 phi/rand run records report B = 2 (four
      records, at 8-bit seeds 1 and 2), B = 6 (two records, at 8-bit seed 3) and
      B = 27 (two records, at 12-bit seed 1). No committed run record reports B =
      55, B = 204 or B = 397. The five rho runs record no B.
    scope_of_verification: >-
      The working tree at the given checkout. The stronger all-refs claim is
      orchestrator-supplied and unverified here (see ref_search).
    corroborating_detail: >-
      harness/endomorphism_la.py line 383 sets `B = math.ceil(math.isqrt(n))`,
      i.e. B = floor(sqrt(n)). This reproduces every committed pairing exactly:
      isqrt(7) = 2, isqrt(37) = 6, isqrt(733) = 27. It also reproduces the three
      uncommitted headline pairings from their stated n: isqrt(3061) = 55,
      isqrt(41617) = 204, isqrt(158071) = 397.
  - id: F2
    title: >-
      Every headline number in DEC-20260726-006 comes from nine measurements
      with no run artifacts
    status: VERIFIED IN THE WORKING TREE
    statement: >-
      ledger/evidence/EV-STR-002.yaml line 23 states its own basis verbatim -
      "13 committed runs (8-12 bit) + 9 extended measurements (12-20 bit,
      inline)." Those nine inline measurements are the sole source of every
      headline number in DEC-20260726-006: B=55 cost_ratio 0.218 (EV line
      31-33); B=204 phi_alpha 4 vs rand_alpha 200, cost_ratio 0.314 (EV lines
      25-27); B=397 phi_alpha 1 vs rand_alpha 387, cost_ratio 0.011 (EV lines
      28-30); and "The structured solve beats Wiedemann at B >= 55"
      (DEC-20260726-006 lines 19-20). None of the nine has a manifest, a seed, a
      command, an environment record, a stdout/stderr log or a raw result.
      EV-STR-002 carries `run_ids: []` (line 6).
    contract_violated: >-
      AGENTS.md "Artifact policy" requires each run to retain the exact command,
      git commit and dirty-tree state, environment and dependency versions,
      input parameters and random seeds, requested and resolved model policy,
      stdout and stderr, raw machine-readable results, validity status,
      timestamps and resource measurements. None of that exists for the nine.
      AGENTS.md core rule 10 requires every conclusion to cite the experiment IDs
      and artifacts that support it; `run_ids: []` cites none.
    coverage_arithmetic: >-
      experiments/EXP-STR-002/analysis.md lines 5-15 gives the nine rows as
      (bits, seed) = (12,1), (12,2), (12,3), (16,1), (16,2), (16,3), (20,1),
      (20,2), (20,3). Exactly ONE of the nine - the (12,1) B=27 row - matches a
      committed run record, and it matches it exactly (B 27, n 733, phi_alpha 9,
      rand_alpha 27, cost_ratio 7.500). That one row is the row both records
      dismiss as an artifact (finding F3). The other eight rows have no
      committed counterpart of any kind.
  - id: F3
    title: >-
      The committed data contradicts the conclusion at the largest committed B,
      and that result is dismissed as an artifact
    status: VERIFIED IN THE WORKING TREE
    statement: >-
      At the largest committed B (27), RUN-STR-phi-b12-s1-m2 records phi_alpha =
      9 and cost_ratio = 7.5. phi_alpha = 9 is not O(1) and is three times the
      hypothesis's stated ceiling of alpha <= 3. cost_ratio = 7.5 means the
      modelled structured solve is 7.5x MORE expensive than Wiedemann, not
      cheaper. experiments/EXP-STR-002/analysis.md line 37 calls this "an
      artifact of small B and poor orbit closure", and EV-STR-002 lines 48-49
      calls it "a small-B artifact"; in both records the dismissal is supported
      only by the unrecorded extended measurements.
    against_the_frozen_criteria: >-
      experiments/EXP-STR-002/specification.yaml lines 83-87 froze the success
      criterion as "displacement_rank_alpha <= 3 for phi-invariant factor bases
      at ALL tested B, AND relation_density_penalty < B/3, AND
      structured_vs_wiedemann_cost_ratio < 0.5 at the largest tested B". On the
      committed run set that conjunction FAILS: alpha = 9 > 3 at B = 27, and
      cost_ratio = 7.5 > 0.5 at the largest committed B. The criterion is met at
      exactly one committed instance, B = 6 (n = 37, an 8-bit toy with a
      six-element factor base), where alpha = 2 and cost_ratio = 1.0 - and 1.0
      is not < 0.5 either.
    what_it_does_NOT_establish: >-
      It does NOT trigger H-STR-002's own falsification condition. That
      condition (ledger/hypotheses/H-STR-002.yaml lines 70-73) requires alpha to
      grow like B "showing no separation from the random baseline". At B = 27
      there IS separation: phi_alpha = 9 against rand_alpha = 27, a factor of 3.
      So the committed data neither satisfies the frozen success criterion nor
      meets the declared falsification condition. That is precisely why this is
      an evidence-integrity finding and not a refutation.
  - id: F4
    title: >-
      The "no decompositions at B >= 27" boundary is contradicted at B = 27, and
      its "Groebner" framing describes a computation this experiment never runs
    status: VERIFIED IN THE WORKING TREE
    statement_part_a: >-
      EV-STR-002 line 55 records the boundary "All Groebner solves on trivial
      ideals (no decompositions at B >= 27)." The committed B = 27 run records
      phi_hits = 15 of phi_attempts = 27 and rand_hits = 37 of rand_attempts =
      67. In harness/endomorphism_la.py a "hit" at arity m = 2 is exactly a
      successful call to semaev._find_decomposition (line 281, incremented at
      line 283), which returns a certificate of kind "decomposition". So 15 and
      37 successful decompositions are recorded at B = 27, and the boundary is
      contradicted by the run record at exactly the B it names.
    statement_part_b: >-
      The "Groebner" framing is unsupportable for a second, independent reason.
      semaev._find_decomposition (harness/semaev.py lines 147-171) is a direct
      double loop over the factor base using s3_eval as a pointwise filter
      followed by an explicit elliptic-curve addition check. It never calls
      sympy.groebner; the only sympy.groebner call in harness/semaev.py is at
      line 121, on a different code path that EXP-STR-002 does not use. The
      committed EXP-STR-002 raw-result.json files contain no `is_trivial_ideal`,
      no `decomposition_found`, no `groebner_seconds` and no other Groebner
      field of any kind. The boundary as written is therefore not merely false
      at B = 27; it is not checkable against these run records at all, because
      no Groebner quantity was ever recorded.
    caveat_recorded_against_this_finding: >-
      The 15 and 37 decompositions carry NO retained certificate.
      _find_decomposition builds a `kind: decomposition` certificate, but
      _collect_relations binds it and discards it (line 281), and both run
      writers set `certificate: {"kind": "none"}` (lines 484 and 498). The counts
      are therefore uncertificated integers in a metrics block. They contradict
      the boundary statement as recorded, but they cannot be re-verified from
      the archived artifacts alone. Independently recomputing them is assigned
      to TASK-20260727-016.
  - id: F5
    title: The rand-* runs are not an independent control arm
    status: VERIFIED IN THE WORKING TREE
    origin: >-
      Additional finding produced by this session; not in the supplied census
      beyond the note that the rand directories record identical values.
    statement: >-
      Each RUN-STR-rand-* record carries the same metrics payload as its
      RUN-STR-phi-* sibling with the single key `mode` removed - verified both
      by reading all eight raw-result.json files and in the source at
      harness/endomorphism_la.py line 497. The committed non-rho run set
      therefore contains four distinct measurement payloads, not eight, and the
      rand records carry zero independent information. They are also not
      labelled: they have no `mode: random` field, only a `fb_type: random`
      input parameter in the manifest.
    consequence: >-
      Under docs/task-lifecycle.md section 7 ("expected run count ... control
      comparability") the committed set does not contain the paired control the
      specification declares; it contains one arm emitted twice. This is a
      run-integrity observation about the archive, not a statement about whether
      the random-factor-base measurement itself was correctly computed - it was
      computed, at harness/endomorphism_la.py lines 437-439, and its results are
      the rand_* fields inside the shared payload.
  - id: F6
    title: >-
      The committed run set is a prefix of a run that stops inside the very
      instance the B=55 headline needs
    status: VERIFIED IN THE WORKING TREE
    origin: Additional finding produced by this session.
    statement: >-
      harness/endomorphism_la.py::main writes, for each (bits, seed): the rho
      baseline first (lines 414-427), then per arity the phi record (lines
      478-489) and then the rand record (lines 492-503). The committed set is
      exactly rho+phi+rand at (8,1), (8,2), (8,3) and (12,1), then rho ALONE at
      (12,2) - and nothing after. RUN-STR-rho-b12-s2 records n = 3061, and
      isqrt(3061) = 55. So the committed artifacts contain the matched rho
      baseline for the instance whose B = 55 numbers open the DEC-20260726-006
      crossover claim ("The crossover is at B ~ 55", line 20), while the phi and
      rand records for that same instance are absent.
    what_it_does_NOT_establish: >-
      It does NOT establish WHY. An interrupted execution, artifacts produced
      and never committed, artifacts produced and later removed, and a separate
      unrecorded execution are all consistent with what is in the tree. This
      session cannot distinguish them without git history, and does not
      speculate. Distinguishing them is assigned to TASK-20260727-016.
  - id: F7
    title: The success criterion was narrowed after the adverse result, with no amendment
    status: VERIFIED IN THE WORKING TREE
    origin: Additional finding produced by this session.
    statement: >-
      experiments/EXP-STR-002/specification.yaml line 84 freezes the criterion
      as "alpha <= 3 for phi-invariant factor bases at ALL tested B".
      experiments/EXP-STR-002/analysis.md line 41 checks a different criterion:
      "alpha <= 3 for phi-invariant at B >= 55: MET". The quantifier moved from
      "all tested B" to "B >= 55" - which is exactly the range that excludes the
      one committed instance where it fails. There is no
      experiments/EXP-STR-002/amendments/ directory and no protocol_amendment
      record anywhere in the tree for EXP-STR-002.
    contract_violated: >-
      docs/task-lifecycle.md section 5 and its protocol_amendment schema: a
      revision made after observing that the original criterion failed cannot be
      evaluated against the original confirmatory criterion, and requires a
      versioned amendment with confirmatory_status recorded. This is the same
      defect class that CORR-20260727-006 records for
      experiments/EXP-IC-001/amendments/v2_to_v3.yaml, except that here no
      amendment record exists at all.
    secondary_note: >-
      analysis.md line 41 also reports the criterion as MET while listing
      "alpha=4 at B=204", describing 4 > 3 as "slightly above 3 but within noise
      of the O(r=3) prediction". No noise model is stated anywhere in the
      specification.
  - id: F8
    title: >-
      The "density penalty ~2-3x" figure appears in no committed run record, and
      the metric's denominators are endogenous
    status: VERIFIED IN THE WORKING TREE
    origin: Additional finding produced by this session.
    statement_part_a: >-
      EV-STR-002 lines 34-36 and line 54, DEC-20260726-006 lines 22-23 and line
      36, and analysis.md lines 31-33 all report a density penalty of about 2-3x
      as a headline contrast against EV-STR-001. Every committed value of the
      `density_penalty` metric is 0.9940298507462687 (B=27), 1.0 (B=6) or -1
      (B=2, undefined). No committed run record contains any value near 2 or 3.
      Note the direction: the metric is defined at
      harness/endomorphism_la.py line 469 as rand_hit_rate / phi_hit_rate, so
      0.994 means the phi arm's measured hit rate was marginally HIGHER than the
      random arm's, i.e. no penalty at all in the committed data.
    statement_part_b: >-
      The hit-rate denominators are endogenous. _collect_relations stops when
      the collected relation list reaches its quota (line 270), and the phi arm
      appends up to two phi-shifted rows per hit (lines 292-304) while the
      random arm appends one. At B = 27 the quota is max(10, B+10) = 37: the
      random arm needed 37 hits (exactly the quota) in 67 attempts, the phi arm
      needed only 15 hits in 27 attempts to reach the same row count. The two
      "hit rates" are therefore measured over loops with different stopping
      points, and `density_penalty` divides one by the other. Whether that is a
      valid density comparison is a metric-validity question, not an integrity
      question, and it is routed to TASK-20260727-017 rather than adjudicated
      here.
  - id: F9
    title: Two declared controls are not implemented as declared
    status: VERIFIED IN THE WORKING TREE
    origin: Additional finding produced by this session.
    statement: >-
      experiments/EXP-STR-002/specification.yaml lines 36-39 declares a
      phi-ablation control - "use the SAME phi-invariant F but measure
      displacement rank with a random (non-phi) shift operator. Alpha should
      return to ~B, confirming the structure comes from phi." That control is
      not implemented. harness/endomorphism_la.py line 439 measures the random
      shift against the RANDOM factor base, not against the phi-invariant one,
      so the two arms differ in both the factor base and the shift operator and
      the ablation the specification declared - the one that isolates phi as the
      cause - was never run. Separately, the specification declares arities [2,
      3] (line 25) and bit sizes [8, 12, 16, 20, 24] (line 22) with
      expected_run_count about 600 (lines 123-125); the committed set has arity
      2 only, bits 8 and 12 only, and 13 runs.
    routing: >-
      Whether the missing ablation undermines the displacement-rank measurement
      is an interpretation question for TASK-20260727-017. This record states
      only that the declared control is absent from the implementation.

  observation_recorded_but_not_adjudicated:
    id: OBS-1
    subject: the phi relation matrix is constructed phi-closed before its phi-structure is measured
    statement: >-
      harness/endomorphism_la.py lines 292-304 explicitly append, for every
      relation found on the phi-invariant factor base, its two phi-shifted rows
      to the relation list. The displacement rank with respect to the phi-shift
      operator is then measured on that list (line 434). Separately,
      `commutation_holds` is computed (lines 441-452) by taking the FIRST
      relation, shifting it, and testing membership in that same list.
    why_it_is_recorded_here: >-
      If this construction is what produces the low phi_alpha, then phi_alpha
      measures the row-insertion rule rather than a property of relation
      collection on a phi-invariant factor base, and `commutation_holds` tests
      the insertion rule against itself. That would bear on the PRIMARY metric of
      H-STR-002 and would matter far more than the artifact gap this report is
      about.
    why_it_is_NOT_a_finding_here: >-
      It is an interpretation of code behaviour, not an artifact-integrity fact,
      and the Coordinator is not the agent who adjudicates it. It is stated so
      that it cannot be lost, and it is routed to TASK-20260727-017 (red team)
      with TASK-20260727-016 asked to confirm the code reading. Nothing in this
      report's findings depends on it.

  internal_consistency_checks:
    purpose: >-
      Recorded so that the strongest case AGAINST this report is on the record
      beside it. These checks passed, and they cut in favour of the committed
      records being internally coherent.
    check_1_raw_vs_manifest: >-
      PASS on the two B=27 records: manifest.yaml `result.metrics` and
      raw-result.json `metrics` agree field for field.
    check_2_cost_arithmetic: >-
      PASS. cost_ratio = alpha^2 * B * ceil(log2 B) / (2 B^2) reproduces every
      committed value exactly: B=27, alpha=9 gives 81*5/54 = 7.5; B=6, alpha=2
      gives 4*3/12 = 1.0.
    check_3_density_arithmetic: >-
      PASS. (37/67)/(15/27) = 0.99402985... matches the recorded
      0.9940298507462687 exactly; (4/9)/(4/9) = 1.0 matches.
    check_4_the_uncommitted_table_is_arithmetically_self_consistent: >-
      PASS, and this is the strongest point in favour of the extended table. The
      same closed-form cost model reproduces every cost_ratio in
      experiments/EXP-STR-002/analysis.md lines 5-15 from its stated (alpha, B):
      B=55/alpha=2 gives 0.2182; B=204/alpha=4 gives 0.3137; B=397/alpha=1 gives
      0.01134; B=24/alpha=6 gives 3.75; B=52/alpha=27 gives 42.06;
      B=107/alpha=20 gives 13.08; B=27/alpha=2 gives 0.370. Every "reduction"
      column entry equals rand_alpha/phi_alpha. And every stated B equals
      isqrt(stated n).
    check_4_interpretation: >-
      This consistency carries NO independent information about whether the nine
      measurements were ever made. cost_ratio and reduction are deterministic
      functions of (alpha, B), and B is a deterministic function of n, so the
      table would be equally self-consistent whether the (alpha, B) pairs were
      measured or written down. What it does rule out is a simple arithmetic
      error in the derived columns. It is recorded because a fair reading of the
      evidence requires it, and it does not weaken F2: the missing thing is the
      run artifacts, not the arithmetic.

  what_is_established:
  - >-
    Within the working tree at this checkout, EXP-STR-002 has exactly 13
    committed run records, all at 8 or 12 bits, all at arity 2 for the
    measurement arms, with B in {2, 6, 27}.
  - >-
    Every headline quantity in DEC-20260726-006 and in EV-STR-002's observations
    and inference blocks - the B=55, B=204 and B=397 rows and the claim that the
    structured solve beats Wiedemann at B >= 55 - rests on measurements that
    have no run artifacts of any kind in this tree, and EV-STR-002 says so
    itself at line 23 while carrying `run_ids: []`.
  - >-
    At the largest committed B the committed record reports phi_alpha = 9 and
    cost_ratio = 7.5, which fails the experiment's own frozen success criterion
    and is the opposite of the reported conclusion, and both the analysis and
    the evidence record dismiss it on the strength of the unrecorded
    measurements.
  - >-
    The EV-STR-002 boundary "All Groebner solves on trivial ideals (no
    decompositions at B >= 27)" is contradicted by the committed B=27 record
    (15/27 and 37/67 successful decompositions) and describes a Groebner
    computation that the m=2 code path never performs and that no committed run
    record measures.
  - >-
    The committed rand-* records are the phi records re-emitted without the
    `mode` key, so the paired control declared in the specification is not
    present as an independent observation, and the declared phi-ablation control
    is not implemented at all.
  - >-
    The success criterion checked in analysis.md is narrower than the one frozen
    in specification.yaml, and no protocol_amendment record exists for
    EXP-STR-002.

  what_is_NOT_established:
  - >-
    That H-STR-002 is false. Nothing here contradicts the mechanism. The
    hypothesis's own falsification conditions are not met by the committed data:
    at B = 27 there is a 3x separation between phi_alpha and rand_alpha, not the
    absence of separation the falsification condition requires.
  - >-
    That the nine extended measurements were never made, or were fabricated.
    This report establishes that no run artifacts for them exist in this working
    tree and that no file in the tree names such a run identifier. It does not
    and cannot establish what did or did not happen outside the tree.
  - >-
    That B = 55, 204 or 397 run records exist in no ref. That is
    orchestrator-supplied and unverified here; TASK-20260727-016 must confirm or
    refute it with git.
  - >-
    Anything about medium-scale or cryptographic-scale curves, about generic
    curves, or about index calculus in general. Every committed instance is a
    j=0 toy curve of at most 12 bits with a factor base of at most 27 elements.
  - >-
    Any claim about wall-time. Every cost number in this experiment, committed
    or not, is a closed-form model value alpha^2 * B * ceil(log2 B) against
    2 B^2. EV-STR-002 lines 56-57 says so itself. No structured solver was
    implemented and none was timed.
  - >-
    Whether the low phi_alpha values are a property of relation collection or of
    the row-insertion rule described in OBS-1. That is open and routed to
    independent review.
  - >-
    Any conclusion about the OTHER support decision in this family.
    DEC-20260727-008 already disposed of the EV-IC-001 confound; this report
    concerns EV-STR-002 and DEC-20260726-006 only.

