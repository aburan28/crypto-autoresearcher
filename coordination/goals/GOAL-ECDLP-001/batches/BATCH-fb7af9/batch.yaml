      only), and the 21 BATCH-158345 carry items (VAL-D50C44-N1..N7,
      RT-A70C90 M1..M4/D1..D3/N1..N7) which remain carried by ID, none
      silently dropped (verified 21/21 by both round-two reviewers).
    required_fix: >-
      Address each non-blocking item by ID in the successor, or carry it
      forward as an explicit visible open line. None is blocking; none may be
