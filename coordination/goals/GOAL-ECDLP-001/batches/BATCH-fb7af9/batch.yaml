ctrl5_first: >-
  RUN CTRL-5 FIRST, BEFORE ANY OTHER WORK. It is the red team's whole-file
  overlay-completeness diff: every difference from the predecessor
  (EXP-SYC-c5f30f) must map to an `overlays_in_this_successor` entry, AND
  every field that SHOULD have differed because it names this task
  (TASK-20260820-e384f0), this batch (BATCH-fb7af9), this session, this
  branch, this archive task, or the reviewers must actually differ. It is
  mechanical, needs zero experiment runs, and would have caught the
  specification-side copy of the dedup bound (VAL-B0465B-B1) as an unmapped
  difference from the companion compiler page. That is why it goes first. The
  producer must record the CTRL-5 result (the overlay map and the
  should-differ/did-differ check) as a first-class artifact of the successor
  package, with ACTUALLY-COMPUTED digests. Per RT-0F62F9-M2, CTRL-5 in this
  batch must ALSO check partially-updated leaves: a file whose digest changed
  but whose content still carries a stale predecessor clause is a defect, not
  a clean overlay.

required_successor_repairs:
  - id: R1-VAL-B0465B-B1-SPEC-DEDUP-BOUND
    source_checkpoint: BATCH-4d7ae0
    source_findings: [VAL-B0465B-B1]
    severity: blocking
    class: incomplete_repair_leaves_a_false_mathematical_statement_in_a_frozen_contract
    checkpoint_statement_verbatim: >-
      The identical FALSE bound `0 <= dedup(t) <= sum_j nonshared_j(t)` that
      RT-DB50A3-B1 declared blocking was repaired in the companion compiler
      page but survives byte-identical in the FROZEN CONTRACT
      (experiments/EXP-SYC-c5f30f/specification.yaml:1243,
      blocker_repairs.SYSTEM-PEAK-LIVE-CONCURRENCY.dedup_term.range, a copy
      byte-identical to EXP-SYC-4725b3:1159), under a dedup definition that
      names the TEN terms including B_0 and shared, with the disposition
      recorded REPAIRED and no residual disclosed. Counterexample: B_0 and
      shared co-resident on one 4096-byte page, no nonshared term: dedup =
      4096, the bound asserts 4096 <= 0.
    required_fix: >-
      Propagate the corrected dedup range
      `0 <= dedup(t) <= B_0(t) + shared(t) + sum_j nonshared_j(t) - M(t)` and
      the union-size lemma into the specification's frozen contract at
      specification.yaml:1243 so the specification copy matches the companion
      compiler page byte-for-byte in substance. OR record the specification-
      side site as an explicit open residual and downgrade the RT-DB50A3-B1
      disposition to PARTIALLY_REPAIRED. The preferred fix is propagation; the
      residual path is a fallback that must be visibly disclosed, not silent.
      No number changes.
    no_numeric_or_disposition_change: >-
      A bound-statement correction in the frozen contract. No numeric row,
      bound value, or ECDLP disposition changes; no ECDLP assertion in either
      direction.

  - id: R2-RT-0F62F9-B1-EXACT-PREFIX-40TH-DIGIT
    source_checkpoint: BATCH-4d7ae0
    source_findings: [RT-0F62F9-B1]
    severity: blocking
    class: numeric_error_in_the_artifact_that_certifies_the_arithmetic_plus_unsupported_verification_claim
    checkpoint_statement_verbatim: >-
      The 40-decimal-digit exact_prefix for 2^(-7/6) in
      ctrl5-overlay-completeness.yaml recomputation.d4_mu_column_bits_21.
      exact_prefix ends ...539935; the true value ends ...539936 (verified by
      the Coordinator at 60-digit Decimal precision:
      0.4454493590701696523701131027952562539936 0630...). The declared
      string is neither a truncation nor a rounding of the true value; it
      sits under an "exact" label and a result verdict, carries no pasted
      command output, and is contradicted by the first-round validator's own
      independently computed ...539936.
    required_fix: >-
      Correct d4_mu_column_bits_21.exact_prefix to
      0.4454493590701696523701131027952562539936 (or state fewer digits,
      which must then be a true truncation or rounding). HARD REQUIREMENT: the
      producer must ACTUALLY RUN a python3 Decimal recompute of 2^(-7/6) at
      >= 60-digit precision and paste the ACTUAL command output next to the
      declared prefix. This is the ONLY numeric change in the batch.
    no_numeric_or_disposition_change: >-
      Corrects one 40th-digit error in a static literal. No specification
      value, bound, or disposition depends on it; no ECDLP assertion in
      either direction.

  - id: R3-RT-0F62F9-B2-CROSSING-RULE-FORMULA
    source_checkpoint: BATCH-4d7ae0
    source_findings: [RT-0F62F9-B2]
    severity: blocking
    class: unsupportable_method_claim_in_the_artifact_that_certifies_the_arithmetic
    checkpoint_statement_verbatim: >-
      The stated formula `gamma_x <= 1/3 - (15 - log2 33)/bits` in
      ctrl5-overlay-completeness.yaml recomputation.d4_crossing_rule.formula
      yields +0.00147980 at bits 30 (verified by the Coordinator), not the
      entry's own recorded m_98304_bits_30 = -0.05135228, which the
      generating form 1/3 - (15 - log2 11)/bits produces exactly. The value
      -0.05135228 is correct and no conclusion changes.
    required_fix: >-
      Restate the d4_crossing_rule formula PER ROW: the m = 32768 rows are
      generated under the literal-15 form 1/3 - (15 - log2 33)/bits, and the
      m = 98304 rows are generated under 1/3 - (15 - log2 11)/bits. Re-run
      the recompute for every crossing row and paste the ACTUAL command
      output. Do not assert a single formula that does not generate the
      recorded rows.
    no_numeric_or_disposition_change: >-
      A method-accounting correction. The recorded crossing values are
      correct; only the unsupported single-formula claim must not survive. No
      ECDLP assertion in either direction.

  - id: R4-RT-0F62F9-M1-UNIVERSAL-ASSERTION-REPAIR
    source_checkpoint: BATCH-4d7ae0
    source_findings: [RT-0F62F9-M1]
    severity: major
    class: repair_asserted_in_universal_form_that_is_false_at_the_receipt_side
    checkpoint_statement_verbatim: >-
      The RT-DB50A3-M2 repair is asserted in universal form at six sites and
      is false at the receipt side: the recomputation output block begins at
      section [3] with [1]/[2] absent package-wide, five of ten
      recomputation entries carry no pasted output, and the receipt asserts
      output it does not contain.
    required_fix: >-
      EITHER paste complete stdout covering all ten recomputation entries from
      section [1] (so the universal assertion is true), OR amend the six
      universal assertions to the true statement (name exactly which entries
      carry pasted output and which do not). Do not assert a universal
      property the package does not satisfy.
    no_numeric_or_disposition_change: >-
      A method-accounting correction. No numeric row or disposition changes.

  - id: R5-RT-0F62F9-M2-STALE-COPY-FORWARD-AND-CTRL5-BLINDNESS
    source_checkpoint: BATCH-4d7ae0
    source_findings: [RT-0F62F9-M2]
    severity: major
    class: stale_copy_forward_asserting_a_digest_that_appears_zero_times
    checkpoint_statement_verbatim: >-
      The design-repair-report D1 disposition is a stale copy-forward
      asserting the successor ctrl5 records the EXP-SYC-95ff77 digest
      786ca5f0..., which appears zero times in it; CTRL-5 is structurally
      blind to partially-updated leaves.
    required_fix: >-
      Replace the stale 786ca5f0/EXP-SYC-95ff77 clause with
      089613756608e4c0bc3853f3689b59fbfc0f1fe9f579a630431399f2ac992322/
      EXP-SYC-4725b3 (the actual predecessor of this successor). AND add the
      partially-updated-leaf check to CTRL-5: a file whose digest changed but
      whose content still carries a stale predecessor clause must be flagged,
      not treated as a clean overlay.
    no_numeric_or_disposition_change: >-
      A stale-reference and method correction. No numeric row or disposition
      changes.

  - id: R6-RT-0F62F9-M3-SEPARATING-FIXTURE
    source_checkpoint: BATCH-4d7ae0
    source_findings: [RT-0F62F9-M3]
    severity: major
    class: no_kat_fixture_discriminates_the_b1_dedup_range_repair
    checkpoint_statement_verbatim: >-
      No KAT fixture discriminates the B1 dedup-range repair: every fixture
      passes identically under the false predecessor range and the corrected
      range, and this is not disclosed.
    required_fix: >-
      EITHER add the separating fixture (B_0 and shared co-resident on one
      page, dedup positive, all nonshared zero) with a must_reject for the
      predecessor range, so a regression to the false bound is caught, OR
      state plainly that no fixture discriminates the range and why. Do not
      leave the non-discrimination undisclosed.
    no_numeric_or_disposition_change: >-
      A test-coverage or disclosure correction. No numeric row or disposition
      changes.

  - id: NON-BLOCKING-CARRY
    source_checkpoint: BATCH-4d7ae0
    source_findings: [VAL-B0465B-N1, VAL-B0465B-N2, VAL-B0465B-N3, VAL-B0465B-N4, VAL-B0465B-N5, VAL-B0465B-N6, VAL-B0465B-N7, VAL-B0465B-N8, VAL-B0465B-N9, VAL-B0465B-N10, VAL-B0465B-N11, RT-0F62F9-D1, RT-0F62F9-D2, RT-0F62F9-D3, RT-0F62F9-D4, RT-0F62F9-D5, RT-0F62F9-N1, RT-0F62F9-N2, RT-0F62F9-N3, RT-0F62F9-N4, RT-0F62F9-N5, RT-0F62F9-N6, VAL-E0FA83-N4, RT-DB50A3-N5]
    severity: non_blocking_carry
    class: record_quality_and_premature_closure_risk
    checkpoint_statement_verbatim: >-
      The 55th batch's dual re-review left eleven validator non-blocking
      findings (VAL-B0465B-N1..N11), the red team's five moderate (D1-D5) and
      six minor (N1-N6) findings open, plus the first-round
      VAL-E0FA83-N4 (custody contradiction, genuinely repaired at both custody
