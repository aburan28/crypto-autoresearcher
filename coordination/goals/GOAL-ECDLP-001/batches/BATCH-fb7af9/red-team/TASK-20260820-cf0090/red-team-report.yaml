  findings:
    blocking: []

    major:
      - id: RT-CF0090-M1
        severity: major
        joint: J6
        class: stale_predecessor_digest_in_three_sites_creating_internal_contradiction
        where:
          - 'custody-and-executable-contract.yaml line 166 (fabrication_note): "the predecessor-specification digest (089613756608e4c0bc3853f3689b59fbfc0f1fe9f579a630431399f2ac992322)"'
          - 'design-repair-report.yaml line 914 (VAL-E0FA83-N4 what_this_successor_does): "the predecessor-specification digest (089613756608e4c0bc3853f3689b59fbfc0f1fe9f579a630431399f2ac992322)"'
          - 'design-repair-report.yaml line 2015 (actions_not_taken.digest_computed_note): "The predecessor-spec digest (08961375...) is asserted as verified"'
        what_is_wrong: >-
          The actual predecessor of EXP-SYC-52f6f7 is EXP-SYC-c5f30f (SHA-256
          666434da626eb6862eca2e305aa068cfb2d712580cf0af809333a91e05ed70ed,
          independently verified by this red team with shasum -a 256). But
          three sites in the package still carry 089613756608e4c0bc3853f3689b59fbfc0f1fe9f579a630431399f2ac992322,
          which is the SHA-256 of experiments/EXP-SYC-4725b3/specification.yaml
          (the predecessor of the predecessor), not of the actual predecessor.
          This contradicts four sites that correctly carry 666434da...:
          ctrl5 lines 1089/1100/1110, custody contract line 137
          (digest_binding_note), and design-repair-report lines 506/1672.
          The package asserts two different "predecessor-specification digest"
          values, creating an internal contradiction. This is exactly the class
          of defect R5 was supposed to repair: a stale predecessor clause
          surviving in a file whose digest changed.
        what_should_be_done: >-
          Replace 08961375... with 666434da... at all three sites, so the
          package asserts one predecessor-specification digest consistently.
          The correct value is 666434da626eb6862eca2e305aa068cfb2d712580cf0af809333a91e05ed70ed
          (experiments/EXP-SYC-c5f30f/specification.yaml).
        no_numeric_or_disposition_change: true
        no_ecdlp_assertion_affected: true

    moderate:
      - id: RT-CF0090-D1
        severity: moderate
        joint: J6
        class: partially_updated_leaf_check_too_narrow
        where: 'ctrl5-overlay-completeness.yaml lines 756-782 (partially_updated_leaf_check)'
        what_is_wrong: >-
          The partially-updated-leaf check (added per R5/RT-0F62F9-M2) only
          searches for stale predecessor IDENTITY (experiment_id / task_id /
          batch_id) in IDENTITY positions. It does NOT search for:
          (a) stale predecessor digests in prose fields (the 08961375... defect
          in RT-CF0090-M1 above);
          (b) stale predecessor experiment IDs in prose fields (the EXP-SYC-4725b3
          references in design-repair-report actions_not_taken, see RT-CF0090-D2);
          (c) stale task IDs in prose fields (the TASK-20260819-* references in
          design-repair-report next_action, see RT-CF0090-D2);
          (d) stale batch numbers in prose fields (the "batch 55" reference in
          design-repair-report next_action, see RT-CF0090-D2).
          The check declares PASS with "no partially-updated leaf found" while
          three partially-updated leaves exist in the package. This is a gap in
          the check that R5 was supposed to close: "a file whose digest changed
          but whose content still carries a stale predecessor clause is a defect,
          not a clean overlay."
        what_should_be_done: >-
          Extend the partially-updated-leaf check to search for stale
          predecessor digests and stale predecessor references in ALL fields,
          not just identity positions. A digest-shaped string or predecessor
          experiment ID in a prose field that matches the grandparent or earlier
          predecessor (not the immediate predecessor) is a stale clause.
        no_numeric_or_disposition_change: true

      - id: RT-CF0090-D2
        severity: moderate
        joint: J6
        class: stale_predecessor_references_in_design_repair_report_actions_and_next_action
        where:
          - 'design-repair-report.yaml line 2001 (actions_not_taken.command_executed_note): "CTRL-5 parsed-YAML overlay-completeness diff over all five comparable pairs against EXP-SYC-4725b3"'
          - 'design-repair-report.yaml line 2022 (actions_not_taken.parser_invoked_note): "CTRL-5 whole-file diff of all five comparable artifact pairs against their EXP-SYC-4725b3 counterparts"'
          - 'design-repair-report.yaml line 2034 (next_action): "Snapshot these seven declared artifacts under TASK-20260819-be6ead alone"'
          - 'design-repair-report.yaml line 2035 (next_action): "then dispatch fresh independent Validator TASK-20260819-b0465b"'
          - 'design-repair-report.yaml line 2036 (next_action): "and Red Team TASK-20260819-0f62f9"'
          - 'design-repair-report.yaml line 2037 (next_action): "then ledger-dispose under TASK-20260818-2e3190 alone"'
          - 'design-repair-report.yaml line 2040 (next_action): "This is batch 55 under campaign_budget.maximum_batches=55 (BUDGET-AMEND-20260818-001)"'
        what_is_wrong: >-
          The design-repair-report's actions_not_taken section references
          EXP-SYC-4725b3 as the CTRL-5 comparison baseline (lines 2001, 2022),
          but the actual comparison baseline is EXP-SYC-c5f30f (as correctly
          recorded in ctrl5 line 1089 and ctrl5 files_compared lines 43-46).
          The next_action section references task IDs from BATCH-4d7ae0
          (TASK-20260819-be6ead, TASK-20260819-b0465b, TASK-20260819-0f62f9,
          TASK-20260818-2e3190) and "batch 55 under
          campaign_budget.maximum_batches=55 (BUDGET-AMEND-20260818-001)" --
          all stale for this successor (batch 56, BATCH-fb7af9,
          TASK-20260820-362012, TASK-20260820-71c2b8, TASK-20260820-cf0090,
          TASK-20260820-ea4a93, BUDGET-AMEND-20260820-001). The specification's
          next_action was correctly updated (ctrl5 diff map line 549-552 shows
          old: TASK-20260819-be6ead -> new: TASK-20260820-362012), but the
          design-repair-report's next_action was NOT updated -- a partially-
          updated leaf.
        what_should_be_done: >-
          Update the design-repair-report's actions_not_taken and next_action
          sections to reference EXP-SYC-c5f30f (not EXP-SYC-4725b3), the
          correct task IDs (TASK-20260820-362012, TASK-20260820-71c2b8,
          TASK-20260820-cf0090, TASK-20260820-ea4a93), and the correct batch
          number (56 under campaign_budget.maximum_batches=56,
          BUDGET-AMEND-20260820-001).
        no_numeric_or_disposition_change: true

    minor:
      - id: RT-CF0090-N1
        severity: minor
        joint: J6
        class: batch_yaml_r5_required_fix_specifies_wrong_replacement
        where: 'batch.yaml line 211-213 (R5 required_fix)'
        what_is_wrong: >-
          The batch.yaml R5 required_fix says to "Replace the stale
          786ca5f0/EXP-SYC-95ff77 clause with
          089613756608e4c0bc3853f3689b59fbfc0f1fe9f579a630431399f2ac992322/
          EXP-SYC-4725b3 (the actual predecessor of this successor)." But the
          actual predecessor of EXP-SYC-52f6f7 is EXP-SYC-c5f30f (digest
          666434da...), not EXP-SYC-4725b3 (digest 08961375...). The phrase
          "the actual predecessor of this successor" is incorrect if "this
          successor" means EXP-SYC-52f6f7. The producer followed this
          instruction in three sites (creating RT-CF0090-M1) but went beyond it
          in four other sites, creating the internal contradiction. This is a
          batch.yaml-level issue inherited from the parent checkpoint's
          next_action, not a producer artifact defect.
        what_should_be_done: >-
          The batch.yaml is frozen and should not be edited. The producer
          should have recognized that the R5 required_fix specified the wrong
          replacement and used the correct predecessor (EXP-SYC-c5f30f,
          666434da...) consistently, as it did in four sites. The three sites
          that followed the batch.yaml's instruction are the defect.
        no_numeric_or_disposition_change: true

