        dedup=4096 > 0, so 0 <= 4096 <= 0 is FALSE. The predecessor range
        is correctly REJECTED.
      corrected_bound: '0 <= dedup(t) <= B_0(t) + shared(t) + sum_j nonshared_j(t) - M(t)'
      corrected_bound_test: >-
        0 <= 4096 <= 4096 + 4096 + 0 - 4096 = 4096. The corrected bound
        holds at equality. The corrected range is correctly ACCEPTED.
      result: PASS
      result_note: >-
        KAT-PEAK-G correctly discriminates the corrected bound from the
        predecessor false range. A regression to the false bound would be
        caught. The proves-too-much control works: the argument (predecessor
        range) is run against an object for which its conclusion is KNOWN FALSE
        (dedup=4096 > sum nonshared=0), and it fails there as it should.
