      fixture: KAT-PEAK-G
      setup: >-
        B_0 and shared co-resident on one 4096-byte page, dedup(t)=4096,
        all nonshared terms zero.
      predecessor_false_range: '0 <= dedup(t) <= sum_j nonshared_j(t) = 0'
