      - {predecessor: coordination/goals/GOAL-ECDLP-001/batches/BATCH-4d7ae0/tasks/TASK-20260819-b4453f/physical-frontier-compiler.yaml, successor: coordination/goals/GOAL-ECDLP-001/batches/BATCH-fb7af9/tasks/TASK-20260820-2a02c2/physical-frontier-compiler.yaml}
      - {predecessor: coordination/goals/GOAL-ECDLP-001/batches/BATCH-4d7ae0/tasks/TASK-20260819-b4453f/verification-and-null-kats.yaml, successor: coordination/goals/GOAL-ECDLP-001/batches/BATCH-fb7af9/tasks/TASK-20260820-2a02c2/verification-and-null-kats.yaml}
