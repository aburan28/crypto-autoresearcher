  recorded_at: "2026-08-23T20:19:25Z"
  recorded_by: red-team
  status: complete_scoped_joint_review_pending_ledger_archive
  claim_under_review: >-
    Only whether the committed zero-run packet certifies one fully explicit
    finite-subgroup V_(P,H) orbit-membership construction or one exact scoped
    obstruction for its declared representation family, with complete decoder,
    resource, novelty, and closure accounting.
  claim_not_under_review:
    - practical ECDLP attack
    - supported speedup
    - generic-group lower bound
    - broad finite-domain or Lattes impossibility
    - novelty
    - goal closure
    - breakthrough
  review_boundary:
    joints_owned:
      - J4-proves-too-much-generic-group-precompute-oracle-and-decoder
      - J5-Pareto-novelty-scope-and-frontier-preservation
    whole_claim_verdict: not_rendered
    experiment_runs: 0
    implementations_created: 0
    official_state_changes: 0
    sibling_reports_read: false
    procedure_deviations: []

  joint_verdicts:
    J4-proves-too-much-generic-group-precompute-oracle-and-decoder:
      verdict: breaks
      break_location: >-
        The signed-orbit cardinality and every formula derived from it use the
        wrong sign factor. The packet defines s=|H intersect {+1,-1}| but then
        states |+/-H|=sD. By the product-set formula the correct cardinality is
        |+/-H|=2D/s.
      exact_derivation:
        definitions:
          D: "|H|"
          s: "|H intersect {+1,-1}|, in {1,2}"
          N: "|H/(H intersect {+1,-1})|=D/s"
        signed_orbit_cardinality: "|{+1,-1}H|=2D/s=2N"
        membership_hit_probability: "2D/(s*ell)"
        expected_membership_trials: "s*ell/(2D)"
        terminal_success_probability_with_identity_branch: "(1+2D/s)/ell"
        note: >-
          The last formula applies when a uniform shift stops on either the
          separately typed identity event or signed-orbit membership. If the
          record intends membership hits only, it must say so and use the
          preceding probability instead.
      counterexamples:
        - instance: "ell=7, H={1,2,4}, D=3, s=1"
          expected: "|+/-H|=6 and membership-hit probability 6/7"
          packet_formula: "sD=3 and membership-hit probability 3/7"
        - instance: "ell=7, H=F_7^*, D=6, s=2"
          expected: "|+/-H|=6 and membership-hit probability 6/7"
          packet_formula: "sD=12 and membership-hit probability 12/7"
          failure_signature: probability_exceeds_one
      impacted_fields:
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fd74ac/tasks/TASK-20260823-d26ed5/blind-statement-packet.yaml:statements_only.parameters
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fd74ac/tasks/TASK-20260823-d26ed5/orbit-membership-mechanism.yaml:shift_reduction
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fd74ac/tasks/TASK-20260823-d26ed5/shift-recovery-and-cost.yaml:symbols
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fd74ac/tasks/TASK-20260823-d26ed5/shift-recovery-and-cost.yaml:uniform_shift_model
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fd74ac/tasks/TASK-20260823-d26ed5/pareto-and-resource-check.yaml:candidate_profiles
        - ledger/proposals/IDEA-20260823-0cec0b.yaml:target_complexity
      invariant_subresults_after_repair:
        polynomial_degree: "N=D/s remains correct"
        explicit_setup: "Omega(D/s) retained words or records remains correct"
        query_term: "(s*ell/2)*D^(beta-1), up to polylogarithmic factors"
        explicit_single_target_floor: >-
          Omega(D/s + s*ell/(2D)) still minimizes to Omega(sqrt(ell))
          up to fixed constants and integer/divisibility slack.
        balanced_exponent: "1/(3-2*beta) remains unchanged"
        strict_sub_rho_threshold: "beta<1/2 remains unchanged"
      controls:
        roots_of_unity_sparse_positive:
          verdict: holds
          result: >-
            The sparse Z^D-1 example correctly defeats any inference from root
            count or degree alone to linear implicit-description size.
        degree_one_or_composition_sparse_positive:
          verdict: holds
          result: >-
            The packet does not extend its syntactic output bound to compact
            recurrences or closed-form iterates.
        random_D_subset:
          verdict: holds_at_syntactic_boundary_only
          result: >-
            The explicit root/vector/leaf/table word count survives unchanged
            on a random subset. That survival gives the bound no elliptic or
            generic-group hardness content, and the packet says so.
        generic_rational_map:
          verdict: holds_at_syntactic_boundary_only
          result: >-
            No Lattes-specific evaluator or impossibility is inferred from the
            same explicit-output count on a generic map.
        supplied_coefficients_or_post_hoc_table:
          verdict: holds
          result: >-
            Fast online evaluation from supplied advice does not discharge the
            public-input constructor, advice-size, setup, persistence, or
            transfer costs. The packet excludes it.
        single_versus_many_targets:
          verdict: incomplete_guardrail_not_a_current_positive_claim
          result: >-
            C_pre(D)/T_targets is only a per-target accounting view. A future
            claim must also report total campaign work C_pre+T_targets*C_online,
            advice bits or field words, state lifetime, traffic, target
            distribution, and the single/fixed/growing-target regimes.
        generic_group_transfer:
          verdict: holds
          result: >-
            The x-coordinate/orbit-product predicate is a concrete non-generic
            object. If a proposed evaluator were simulable using only generic
            group operations and equality with constant overhead, the generic
            square-root lower bound would apply. The packet neither supplies
            such a simulator nor claims that its syntactic bound is a generic
            lower bound.
        boolean_without_decoder:
          verdict: holds_with_future_instantiation_required
          result: >-
            The packet explicitly retains H-restricted source recovery, sign
            disambiguation, and final [u]P=Q verification. Its D^(1/2)
            recovery is labeled a baseline upper bound rather than a lower
            bound, so alternate decoders remain open. A future positive claim
            must instantiate the decoder and charge reusable tables and memory.

    J5-Pareto-novelty-scope-and-frontier-preservation:
      verdict: inconclusive
      holds:
        realized_frontier: >-
          Pollard rho remains the certified exponent-1/2 single-target
          baseline; the packet certifies no positive exponent delta.
        negative_scope: >-
          The obstruction is kept to explicit root lists, dense coefficient
          vectors, leaf-explicit product trees, and per-coset tables in the
          single-target uniform-shift pipeline.
        preserved_routes:
          - compact implicit circuits and random-access recurrences
          - compressed public-input encodings with proved constructors and queries
          - multi-target preprocessing with declared target population
          - alternate source-recovery mechanisms
          - non-generic concrete structure outside the four syntax classes
        novelty: >-
          The packet says unverified and makes no novelty or adaptation claim.
        steering: >-
          REVISE/select-none is a batch disposition, not lane closure. The
          revisit conditions name a public-input implicit constructor, a new
          recovery argument, or a retrieved theorem, so no supported high-value
          route is silently erased by this packet.
      unresolved_frontier_audit:
        required_rows:
          - B68
          - P1531
          - P1532
          - P1533
          - P1549
          - P1550
          - P1551
          - P1552
          - P1553
          - ECDLP-IDEA-121
          - ECDLP-IDEA-133
          - Pollard rho
        available_in_declared_read_bundle: >-
          Only the B68 Coordinator summary and partial IDEA-121/IDEA-133
          append-only summaries are present. The canonical P1531-P1553 rows
          and their typed time, memory, data, preprocessing, and target-count
          vectors are not included, and exact-identifier searches of the
          allowed knowledge directory returned no such records.
        consequence: >-
          This Red Team cannot independently certify nonduplication or a
          row-by-row Pareto comparison from the declared read scope. Absence
          from the derived knowledge corpus is not evidence of novelty or
          nonduplication.
      pareto_typing_challenges:
        - >-
          Replace the incorrect ell/(sD) predicate-query row with
          s*ell/(2D), or with (1+2D/s)/ell for total termination probability
          when the identity branch is included.
        - >-
          Type membership-query count as local predicate evaluations unless an
          external oracle is actually assumed. If an oracle is assumed, its
          construction, advice, and query interface are separate charged axes.
        - >-
          Use distinct symbols for target population and online time. The
          generic fixed-group preprocessing baseline uses advice size S and
          online time tau with S*tau^2=Omega-tilde(ell); it is not the same T
          as the number of targets.
        - >-
          State Pollard rho's O(1)-storage option and, for concrete comparisons,
          the negation or automorphism-adjusted constant. Field and group
          operation units and any extension degree must be normalized before
          claiming practical dominance.
        - >-
          An unchecked hypothetical row is honestly not certified, but it does
          not complete the required comparison against every named frontier
          row. Supply those rows before setting dominated_by to null or making
          a nonduplication statement stronger than unverified.

  objections:
    - id: RT-J4-SIGN-CARDINALITY
      severity: joint_break
      statement: >-
        The packet inverts the sign-intersection factor in |+/-H|, creating
        false exact probabilities and query counts, including probabilities
        greater than one on valid even-D instances.
    - id: RT-J5-FRONTIER-READ-SCOPE
      severity: joint_inconclusive
      statement: >-
        The declared source packet does not expose the canonical named
        frontier rows needed for an independent Pareto and nonduplication
        audit; novelty must remain unverified.

  required_controls:
    - id: CTRL-J4-SIGN-PARITY
      type: symbolic_mutation
      requirement: >-
        Add odd-D and even-D fixtures that assert N=D/s, |+/-H|=2D/s,
        membership probability at most one, and separate identity termination.
      cheapest_instances:
        - "ell=7, D=3"
        - "ell=7, D=6"
    - id: CTRL-J4-UNCHANGED-ARGUMENT
      type: proves_too_much_table
      requirement: >-
        For every claimed future implicit evaluator, show exactly which step
        fails on roots of unity, a random same-size subset, a generic rational
        map, supplied coefficients, and a post-hoc table. Surviving only the
        explicit-output count is not elliptic hardness evidence.
    - id: CTRL-J4-ADVICE-AMORTIZATION
      type: cost_table
      requirement: >-
        Report one-target, fixed-target, and growing-target totals; advice
        words/bits; state lifetime; preprocessing and transfer traffic; online
        time; decoder time and memory; and final verification. Compare any
        generic component with the fixed-group preprocessing tradeoff.
    - id: CTRL-J4-DECODER
      type: reduction_interface
      requirement: >-
        Emit an actual signed scalar witness or instantiate and charge an
        H-restricted decoder, then verify [u]P=Q. A Boolean bit alone cannot
        satisfy the attack interface.
    - id: CTRL-J5-CANONICAL-FRONTIER
      type: read_scope_and_pareto_repair
      requirement: >-
        Provide the canonical B68, P1531-P1553, IDEA-121, and IDEA-133 rows in
        a successor declared read scope, normalize every resource axis, and
        record row-by-row dominance and mechanism collisions before any
        novelty, nondominance, saturation, or closure statement.

  counterexample_or_mutation: >-
    Substitute ell=7 and H=F_7^*. The packet's unchanged formula gives
    |+/-H|=sD=12 and a membership probability 12/7, while the actual signed
    orbit is H itself of size 6. The first survival point is the mistaken
    replacement of the product-set quotient 2D/s by sD.

  baseline_comparison:
    pollard_rho:
      status: realized_baseline
      time: "Theta(ell^(1/2)) expected group operations up to constants"
      memory: "O(1) is available; parallel and table tradeoffs must be typed separately"
      concrete_adjustment: "negation and available automorphisms can improve constants, not the exponent"
    explicit_materialized_single_target_after_repair:
      time_lower_bound: "Omega(D/s + s*ell/(2D))=Omega(sqrt(ell))"
      memory_or_traffic: "Omega(D/s) if retained or transferred"
      comparison: asymptotically_not_strictly_better_than_rho_in_the_declared_pipeline
    hypothetical_implicit_evaluator:
      status: not_constructed
      comparison: not_pareto_classifiable_from_this_packet
    generic_preprocessing:
      status: baseline_guardrail
      comparison: >-
        In the generic fixed-group/advice regime, knowledge records report
        S*tau^2=Omega-tilde(ell). A concrete-coordinate evaluator may be
        non-generic, but then its non-generic public structure must be explicit.

  heuristic_challenges:
    - >-
      Uniform independent shifts give the corrected membership probability;
      deterministic schedules require an exact coverage argument and must not
      inherit an independence tail bound.
    - >-
      The square-root H-restricted recovery cost is an available baseline, not
      a lower bound and not a reason to close alternate decoders.

  cost_model_challenges:
    - signed-orbit and identity constants must be corrected before calling the cost chain exact
    - advice size, persistence, traffic, and target count cannot be collapsed into C_pre/T_targets alone
    - decoder precomputation and memory must be charged where they are reused
    - internal predicate evaluations and external data or oracle queries require different units
    - concrete comparison must normalize field operations, group operations, extension degree, and automorphism-adjusted rho constants

  reduction_and_scope_challenges:
    - >-
      Boolean membership is not scalar recovery; the packet currently keeps
      this interface explicit, and any successor must preserve it.
    - >-
      The syntactic output-size proof transfers to random subsets precisely
      because it is representation counting. It must never be promoted to an
      elliptic, generic-group, finite-domain, or Lattes impossibility.
    - >-
      No canonical-source novelty or full frontier nonduplication conclusion
      is available under this review's declared read scope.

  proof_architecture_challenges:
    - attack: nearby_object_and_proves_too_much
      result: >-
        Positive sparse controls block a universal implicit-size inference;
        random-subset and generic-map controls leave only the declared syntax
        count. This scoped method ceiling is valid after the sign repair.
    - attack: quantifier_and_preprocessing_order
      result: >-
        The packet correctly requires target-independent setup before fresh
        targets, but a future asymptotic claim still needs a nonempty family,
        target population, and advice lifetime before balancing exponents.
    - attack: method_ceiling
      result: >-
        The strongest supported ceiling is the corrected single-target
        explicit-output square-root floor. It does not reach an implicit or
        generic impossibility claim.

  narrowest_supported_statement: >-
    After replacing |+/-H|=sD by |+/-H|=2D/s and separating membership hits
    from identity termination, the committed packet supports only this J4/J5
    boundary: the four declared explicit-output syntaxes require Omega(D/s)
    records, writes, retained state or one-time transfer; the declared
    single-target Boolean-shift pipeline therefore has an Omega(sqrt(ell))
    time floor up to fixed constants, while compact implicit evaluators,
    alternate decoders, and declared multi-target amortization remain open.
    Novelty, full frontier nonduplication, and any broad closure remain
    unverified.

  next_concrete_action: >-
    Coordinator should create an additive correction or successor packet,
    never edit the committed snapshot: correct every signed-orbit probability
    and query row; add the odd/even and identity symbolic controls; and provide
    the canonical named frontier rows in a future declared read scope. Then
    obtain fresh scoped review before any ledger disposition relies on J4/J5.

