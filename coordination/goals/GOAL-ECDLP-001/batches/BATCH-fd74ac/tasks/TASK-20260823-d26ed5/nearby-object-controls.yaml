artifact: nearby_object_controls
task_id: TASK-20260823-d26ed5
controls:
  roots_of_unity_positive:
    object: multiplicative roots of unity with a sparse polynomial such as Z^D-1
    purpose: show that a large root set can have a succinct public-input predicate when an explicit algebraic identity exists
    expected_discriminator: description and query need not materialize D roots
    implication: prevents treating degree or root count alone as a universal lower bound
  degree_one_sparse_positive:
    object: a degree-one or otherwise composition-sparse map with closed-form iterates
    purpose: detect a proof that incorrectly makes every orbit product expensive
    expected_discriminator: recurrence or closed form supplies a compact evaluation path
  random_subset_proves_too_much:
    object: a uniformly sampled same-size subset of F_ell^* with its signed quotient
    purpose: test whether a proposed compression uses subgroup structure or merely assumes a free table
    expected_discriminator: a subgroup-specific identity should not transfer unchanged to the random set
  generic_rational_map:
    object: a generic degree-m^2 rational self-map with a same-length orbit segment
    purpose: separate a Lattes or elliptic-net identity from a generic iteration shortcut
    expected_discriminator: a claimed elliptic correspondence should fail or lose structure on the generic map
  supplied_coefficients_or_table:
    object: V coefficients or orbit labels supplied as input
    purpose: expose preprocessing hidden outside the cost model
    expected_discriminator: query may become fast, but construction and traffic remain unaccounted and the result is inadmissible
  quotient_boundary:
    cases:
      - D odd and -1 not in H
      - D even and -1 in H
      - R is identity
      - Q is identity
      - ambient 2-torsion outside <P>
      - P defined over an extension field
    purpose: falsify sign, degree, multiplicity, and field assumptions
  target_count_and_amortization:
    cases: [T=1, fixed_T, growing_T]
    purpose: prevent a multi-target preprocessing result from being reported as single-target
  boolean_versus_decoder:
    object: perfect signed-orbit membership bit with no scalar witness
    purpose: force recovery, sign disambiguation, retries, and verification into the total cost
static_findings:
  - The roots-of-unity control defeats any universal inference from N roots to Omega(N) implicit description size.
  - The random-subset and supplied-table controls leave the explicit-output word-count obstruction intact but give it no hardness interpretation.
  - The Boolean-only control shows that membership does not by itself recover u.
runs_executed: 0
control_status: defined_and_symbolically_applied_only
