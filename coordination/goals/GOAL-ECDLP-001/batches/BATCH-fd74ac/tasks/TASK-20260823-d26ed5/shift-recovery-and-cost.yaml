artifact: shift_recovery_and_cost
task_id: TASK-20260823-d26ed5
symbols:
  s: "|H intersect {+1,-1}|"
  orbit_size: sD=|+/-H|
  query_cost: C_query(D)=D^beta times polylogarithmic factors
  preprocessing_cost: C_pre(D)
  preprocessing_memory: M_pre(D)
  targets: T
  recovery_cost: C_recover(D)
  verification_cost: C_verify(ell)
uniform_shift_model:
  success_probability_per_shift: sD/ell
  expected_queries_per_target: ell/(sD)
  caveat: independence and tail bounds must be stated for any randomized schedule; deterministic schedules need exact coverage
total_cost:
  per_target: C_pre(D)/T + (ell/(sD))*C_query(D) + C_recover(D) + C_verify(ell)
  separately_report:
    - peak memory M_pre(D)
    - preprocessing and query traffic
    - shared-state persistence
    - number and distribution of targets
    - retries and failure probability
    - field-extension overhead
baseline_recovery:
  method: baby-step giant-step or Pollard-style search on the public H action
  time: D^(1/2) times polylogarithmic factors
  memory: method-dependent and not suppressed
  status: baseline upper bound, not a lower bound
balance_without_dominating_preprocessing:
  query_term: ell*D^(beta-1), ignoring the fixed sign factor and polylogarithms
  recovery_term: D^(1/2)
  balanced_D: ell^(2/(3-2*beta))
  balanced_ell_exponent: 1/(3-2*beta)
  strict_sub_rho_condition: beta < 1/2
  ideal_beta_zero: D approximately ell^(2/3) and time approximately ell^(1/3)
  warning: this balance is invalid if preprocessing, memory traffic, verification, or family-existence costs dominate
explicit_materialization_single_target:
  setup_lower_bound: Omega(N)=Omega(D) field-word writes for fixed s
  attempt_lower_bound: Omega(ell/(sD)) because each Boolean query costs at least one operation
  combined: Omega(D + ell/D)
  minimum: Omega(sqrt(ell)) over positive D, up to fixed sign constants
  implication: no strict single-target exponent improvement within the declared explicit-output representation class
multi_target_boundary:
  materialized_setup_per_target: Omega(D/T)
  status: open after exact T, storage lifetime, traffic, and recovery are charged
  no_inference: a multi-target amortized result is not a single-target ECDLP result
result:
  certified_speedup: false
  reason: no beta_below_one_half implicit evaluator and no acceptable complete preprocessing chain were supplied
