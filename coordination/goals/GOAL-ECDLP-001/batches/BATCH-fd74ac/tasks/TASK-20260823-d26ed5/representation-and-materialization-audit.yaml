artifact: representation_and_materialization_audit
task_id: TASK-20260823-d26ed5
word_model:
  unit: one field element or one index capable of naming a signed coset occupies at least one machine or field word
  charged_operations: emitted words, writes, reads, persistent storage, and transfer to the query phase
  quotient_size: N=D/s with s in {1,2}
declared_representation_family:
  explicit_root_list:
    syntax: one normalized field element x([h]P) for each h in H/S
    size: at least N field words
  dense_coefficient_vector:
    syntax: all coefficients of a monic degree-N polynomial, excluding or including the known leading one
    size: at least N field words for the nonleading coefficients
  leaf_explicit_product_tree:
    syntax: a multiplication tree whose N leaves each store or name one distinct linear factor
    size: at least N leaf records, before internal nodes
  per_coset_table:
    syntax: one distinguishable lookup record for each signed coset or orbit point
    size: at least N records
scoped_obstruction:
  statement: >-
    Any constructor whose output satisfies one of the four syntactic
    definitions above emits at least N distinguishable records. In the
    charged word model it therefore has Omega(N) output size, Omega(N)
    construction writes, Omega(N) persistent representation memory if the
    artifact is retained, and Omega(N) artifact traffic if transferred once.
  proof:
    - The root-list definition contains one entry for each of N distinct roots.
    - The dense-vector definition contains N nonleading coefficient slots for a monic degree-N polynomial.
    - The product-tree definition contains N explicit leaves.
    - The table definition contains N distinguishable per-coset records.
    - Counting the required records gives the bound without an algebraic or generic-group lower-bound assumption.
  single_target_consequence: >-
    Combining Omega(D) setup for fixed s with at least one operation per each
    of the expected Omega(ell/D) shifts gives Omega(D+ell/D), hence
    Omega(sqrt(ell)). This consequence is limited to the uniform-shift,
    single-target, explicit-output pipeline.
excluded_from_obstruction:
  - implicit circuits whose description is o(N)
  - random-access recurrence or oracle representations not materializing every coset
  - compressed encodings with a separately proved sublinear constructor and query algorithm
  - multi-target preprocessing with declared T
  - alternative recovery mechanisms not using the Boolean shift pipeline
hidden_materialization_checks:
  - roots passed as supplied input
  - coefficients treated as an oracle
  - modular-composition tables of linear total size
  - transposed matrices or factor trees written off-ledger
  - one point or scalar label per orbit element
  - host-device or network traffic omitted from setup
result:
  obstruction_status: exact_for_declared_syntactic_family
  generic_lower_bound_status: not_claimed
  implication_for_implicit_evaluator: none
