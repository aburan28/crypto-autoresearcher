artifact: proof_search_map
task_id: TASK-20260823-d26ed5
question: >-
  Can the finite signed orbit predicate be constructed and queried from public
  inputs with beta<1/2 and complete sub-rho end-to-end accounting, or can an
  exact obstruction be proved for one explicitly declared representation?
audits:
  exact_baseline_reproduction:
    status: specified_not_executed
    construction:
      - enumerate H/S and compute all N roots
      - form the monic orbit product V
      - evaluate V for each nonidentity shifted point
      - on a hit run a square-root H-restricted DLP and verify candidates
    costs_to_rederive:
      - root generation and scalar multiplication
      - polynomial multiplication and storage
      - expected ell/(sD) queries
      - D^(1/2) recovery
      - sign and verification
  observation_collision_search:
    status: symbolically_resolved_under_declared_types
    collision_relation: x([h]P)=x([k]P) iff h=+/-k mod ell
    branches:
      - identity is outside the polynomial roots and handled before x
      - two-torsion is absent from the odd prime-order point subgroup
      - sign collisions are removed by H/S
      - extension-field and coordinate normalization remain charged
  quantifier_order_statement:
    status: required_not_instantiated_as_an_asymptotic_family
    order:
      - choose and prove a nonempty curve and subgroup family
      - construct target-independent preprocessing
      - receive fresh target or declared target batch
      - choose shifts and randomness
      - recover, verify, and state success and resource bounds
    first_gap: no nonempty family paired with an explicit beta_below_one_half constructor
  constructive_transform:
    status: absent
    required_output: public-input algorithm for an implicit evaluator and exact conversion to its query state
    prohibited_inputs:
      - free root list
      - free coefficient vector
      - free modular-composition or transposition table
      - target-dependent preprocessing
  method_ceiling:
    status: established_only_for_explicit_materialization
    ceiling: Omega(N) output, writes, retained words, and one-time transfer for the four declared representation syntaxes
    nearby_false_object: random D-subset of F_ell^* represented with the same explicit syntax
    interpretation: the ceiling diagnoses representation materialization, not elliptic-curve hardness
decision_tree:
  - if an exact constructor has beta<1/2 and all other axes fit, request future validation without promoting the claim
  - if a representation only renames Theta(N) materialization, apply the scoped obstruction and revise
  - if correctness depends on an unproved modular-composition or net identity, remain inconclusive
  - if a claimed lower bound crosses into implicit representations without proof, reject that extension
current_outcome: scoped_explicit_representation_obstruction_and_no_admitted_evaluator
