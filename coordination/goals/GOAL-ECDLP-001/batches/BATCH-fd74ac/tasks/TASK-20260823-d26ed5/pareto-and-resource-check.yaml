  repaired_generic_B68_theorem: defer because it does not supply a finite-domain evaluator
  elliptic_net_bulk_exception: retain only with a public-input random-access recurrence and charged setup
  finite_domain_coefficient_extraction: retain only if coefficients are not materialized linearly
  common_factor_or_projector_fallback: lower priority until it connects Boolean membership to charged recovery
