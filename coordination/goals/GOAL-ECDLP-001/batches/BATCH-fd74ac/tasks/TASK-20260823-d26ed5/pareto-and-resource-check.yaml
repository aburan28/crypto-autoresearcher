resource_check:
  obstruction: explicit representations contain one record per signed coset or coefficient slot
  measured_value: N=D/s records by syntax; no empirical measurement
  units: field_words_or_distinguishable_records
  error_bars: not_applicable_to_exact_syntactic_count
  scope: explicit root list, dense coefficient vector, leaf-explicit product tree, and per-coset table
  resource_reading:
    examined: true
    reading: >-
      The same linear state may be useful when many targets share one public
      subgroup, so the obstruction identifies target batching and compressed
      random access as the only plausible assets of this representation. It
      does not make either asset free; T, lifetime, and traffic must be shown.
frontier_comparison:
