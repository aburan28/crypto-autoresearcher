artifact: finite_domain_typing_and_boundaries
task_id: TASK-20260823-d26ed5
required_types:
  ell: odd prime
  scalar_ring: F_ell
  point_subgroup: <P> of exact order ell
  multiplier_subgroup: H=<m> in F_ell^* with exact order D dividing ell-1
  coordinate_field: declared K containing all coordinates and normalization constants
  quotient_coordinate: x on E/{+/-1}, with infinity represented only through an explicit branch
sign_cases:
  D_odd:
    minus_one_in_H: false
    signed_orbit_size: 2D
    polynomial_degree: D
  D_even:
    minus_one_in_H: true
    signed_orbit_size: D
    polynomial_degree: D/2
  note: s=|H intersect {+1,-1}| unifies both cases
exceptional_branches:
  identity:
    condition: R_a is the identity, equivalently u=a mod ell
    action: verify u=a directly; do not call x or V
  two_torsion:
    condition: a point equals its negative
    action: excluded inside <P> because ell is odd; any ambient-curve use outside <P> must branch separately
  nonaffine_models:
    condition: the implementation uses projective or non-Weierstrass coordinates
    action: define the canonical quotient map and charge normalization or inversion
  extension_field:
    condition: P or orbit coordinates are not F_q-rational
    action: declare K/F_q, its degree, basis, arithmetic, storage, and traffic
  zero_scalar_target:
    condition: Q is the identity
    action: return u=0 only after direct verification
multiplicity_and_collisions:
  root_multiplicity: one
  justification: exact odd order and quotienting by H intersect {+1,-1} remove all sign collisions
  forbidden_shortcut: do not assume distinct x-coordinates without the exact-order and quotient proof
quantifier_order:
  family: first declare the admissible family of (E/F_q,ell,P,m,H) and prove it is nonempty at the claimed scale
  preprocessing: next construct target-independent state from public family inputs
  targets: then quantify one or T fresh targets Q=[u]P
  shifts: then choose or enumerate shifts under a declared randomness and coverage model
  conclusion: only then state success probability and end-to-end complexity
boundary_result: all exceptional cases are typed; no finite-domain evaluator beyond the direct definition is established
