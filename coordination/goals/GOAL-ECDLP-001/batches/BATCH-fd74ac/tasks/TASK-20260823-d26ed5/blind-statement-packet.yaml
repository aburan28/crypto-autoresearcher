purpose: independent rederivation of the load-bearing cost quantities without producer derivations
blind_from:
  - orbit-membership-mechanism.yaml
  - subgroup-factor-and-evaluator.yaml
  - shift-recovery-and-cost.yaml
  - representation-and-materialization-audit.yaml
  - finite-domain-typing-and-boundaries.yaml
  - proof-search-map.yaml
