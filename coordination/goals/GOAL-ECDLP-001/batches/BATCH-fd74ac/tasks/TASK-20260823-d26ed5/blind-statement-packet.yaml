statements_only:
  parameters:
    - ell is an odd prime.
    - H is a subgroup of F_ell^* of order D.
    - s=|H intersect {+1,-1}| is either 1 or 2.
    - A uniform shift hits +/-H with probability sD/ell.
    - One membership query costs D^beta field-operation units up to polylogarithmic factors.
    - On a hit, the declared baseline recovery costs D^(1/2) units up to polylogarithmic factors.
  rederive:
    - Derive the expected number of membership queries.
    - Balance the query and recovery terms by setting D=ell^alpha.
    - Derive alpha, the resulting ell exponent, and the exact condition for strict exponent below 1/2.
    - Add a preprocessing term C_pre(D)/T and state the inequality it must satisfy.
    - Separately derive the single-target minimum if construction emits cD records for a positive constant c and each query costs at least one unit.
    - State peak-memory and traffic consequences rather than folding them into time.
  boundary_questions:
    - Does the sign factor s alter any exponent?
    - What changes when D is odd versus even?
    - Does a Boolean membership result remove the recovery term?
    - What target count T is required to amortize linear setup at the balanced D?
    - Which derivations are upper-bound balances and which are scoped lower bounds from representation syntax?
forbidden_inputs:
  - producer derivations or conclusions
  - producer cost table
  - implementation, run, or timing artifacts
requested_output: independent symbolic derivation with explicit assumptions and disagreement report
