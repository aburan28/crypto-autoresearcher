artifact: subgroup_factor_and_evaluator
task_id: TASK-20260823-d26ed5
factor:
  symbol: V_(P,H)
  degree: N=D/|H intersect {+1,-1}|
  public_inputs: [E, q, ell, P, m, D, field_representation, coordinate_normalization]
  target_independence: construction must finish before a fresh Q is supplied
direct_baseline:
  constructor:
    - certify that P has order ell and m has order D modulo ell
    - enumerate one representative from each coset H/(H intersect {+1,-1})
    - compute every point [h]P and its normalized x-coordinate
    - multiply the N linear factors into a monic polynomial
  evaluator: evaluate the materialized polynomial at x(R) after the identity branch
  required_charges:
    - scalar multiplications and subgroup enumeration
    - root writes and reads
    - factor multiplication or product-tree construction
    - dense coefficients if emitted
    - field-extension conversion and normalization
    - memory and artifact traffic
    - per-query polynomial evaluation
candidate_implicit_families:
  - transposed Lattes evaluation
  - structured Cauchy or cyclic-resolvent evaluation
  - modular composition without coefficient materialization
  - elliptic-net recurrence with random access
constructor_obligations:
  - Give executable pseudocode from public inputs only.
  - State the representation emitted and its exact word size.
  - Prove that setup does not enumerate, write, or read Theta(N) roots, coefficients, leaves, or coset records under another name.
  - Prove exact equality with the orbit product predicate on all declared branches.
  - State whether the algorithm handles one query, a batch, or an amortized target population.
  - Charge modular-composition tables, transposition matrices, precomputed isogeny or net data, and all conversions.
result:
  constructor_supplied: false
  beta_below_one_half_established: false
  first_failed_obligation: explicit_public_input_implicit_constructor
  disposition: revise
limit: >-
  Absence of a constructor in this batch is not evidence that no implicit
  evaluator exists.
