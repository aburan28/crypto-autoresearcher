scope: zero_run_symbolic_derivation
instance:
  curve: ordinary E/F_q
  subgroup_generator: P of exact odd prime order ell
  target: Q=[u]P with u in F_ell
  multiplier_subgroup: H=<m> <= F_ell^* with certified order D
  sign_intersection: S=H intersect {+1,-1}
  sign_factor: s=|S|, equal to 1 for odd D and 2 for even D
  quotient_size: N=D/s
  coordinate: canonical x:E/{+/-1}->P^1 with an explicit identity branch
orbit_product:
  definition: V_(P,H)(Z)=product_(h in H/S) (Z-x([h]P))
  coefficient_field: >-
    The smallest declared public field K containing the coordinates of P and
    the chosen curve model. If P is F_q-rational then K=F_q; otherwise the
    extension degree and representation are charged.
  normalization: monic in K[Z]
  degree: N
  multiplicity: squarefree
  distinctness_argument:
    - For nonidentity points in the odd-order cyclic subgroup, x([h]P)=x([k]P) exactly when [h]P=+/-[k]P.
    - Exact order ell converts that equality to h=+/-k mod ell.
    - Choosing one representative per H/S therefore gives N distinct roots.
typed_predicate:
  input: R=[r]P
  branches:
    - if R is the identity, return false before evaluating x
    - otherwise return whether V_(P,H)(x(R))=0
  equivalence: >-
    For nonidentity R in <P>, V_(P,H)(x(R))=0 iff x(R)=x([h]P)
    for some h in H, iff R=+/-[h]P, iff r lies in +/-H.
shift_reduction:
  shift: choose public a in F_ell and compute R_a=Q-[a]P=[u-a]P
  identity_case: if R_a is identity then u=a is immediately verified and x is not evaluated
  membership_case: if R_a is nonidentity, apply the typed predicate
  hit_probability: "|+/-H|/ell=sD/ell for a uniform independent shift"
  expected_attempts: ell/(sD)
recovery_chain:
  - Recover r=u-a in +/-H with a charged H-restricted DLP procedure.
  - Resolve the quotient sign, producing at most the candidates u=a+r and u=a-r according to the recovery convention.
  - Verify each candidate by checking [u]P=Q.
observation: >-
  The algebraic reduction is exact after its branches, but it supplies only a
  predicate definition. It does not supply a sublinear public-input
  constructor or evaluator for V.
claim_ceiling: unverified_typed_mechanism_only
