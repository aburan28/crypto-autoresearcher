  scoped_joint_verdicts:
    - joint: J1-instance-subgroup-quotient-polynomial-and-membership-typing
      verdict: breaks
      retained_subclaims:
        - >-
          Let ell be odd prime, let P have exact order ell, let H be a
          subgroup of F_ell^* of order D, and put S=H intersect {+1,-1},
          s=|S|.  Since x([h]P)=x([k]P) exactly when h=+/-k modulo ell,
          one representative per H/S gives N=D/s distinct roots.  The monic
          orbit polynomial therefore has degree N and is squarefree.
        - >-
          For a nonidentity R=[r]P in <P>, V_(P,H)(x(R))=0 if and only if
          r is in (+/-1)H.  The identity must be tested before evaluating x;
          nonzero two-torsion cannot occur in the odd-prime-order subgroup.
        - >-
          If the quotient coordinate and P are defined over the declared
          public field K, every root x([h]P) lies in K, so the monic product
          lies in K[Z].  Extension representation and normalization remain
          charged as the producer states.
      breaking_finding:
        summary: >-
          The package repeatedly identifies |(+/-1)H| with sD.  The subgroup
          product formula instead gives |(+/-1)H|=2D/s.  Thus the exact sign
          cardinality, membership-hit probability, and expected-shift count
          are internally inconsistent even though the nonidentity iff
          predicate itself survives.
        derivation:
          intersection: "S=H intersect {+1,-1}, with |S|=s"
          product_cardinality: "|H{+1,-1}|=|H|*|{+1,-1}|/|S|=2D/s"
          odd_D: "s=1, polynomial degree D, signed scalar orbit size 2D"
          even_D: "s=2, polynomial degree D/2, signed scalar orbit size D"
          membership_hit_probability: "2D/(s*ell) for a uniform shift"
          membership_hit_expected_attempts: "ell*s/(2D) for independent shifts with replacement"
          full_success_if_identity_is_also_counted: "(2D/s+1)/ell, because r=0 is accepted by the separate identity branch"
        exact_counterexamples:
          - >-
            For ell=7 and the order-three subgroup H={1,2,4}, D=3 and s=1.
            The polynomial has three x-roots but accepts all six nonzero
            scalars because -H={6,5,3}; hence |+/-H|=6, not sD=3.
          - >-
            For ell=7 and H=F_7^* of order D=6, s=2 and +/-H=H has size six.
            The asserted sD/ell would be 12/7, which cannot be a probability;
            the correct membership-hit probability is 6/7.
        affected_fields:
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fd74ac/tasks/TASK-20260823-d26ed5/orbit-membership-mechanism.yaml:shift_reduction.hit_probability
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fd74ac/tasks/TASK-20260823-d26ed5/orbit-membership-mechanism.yaml:shift_reduction.expected_attempts
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fd74ac/tasks/TASK-20260823-d26ed5/shift-recovery-and-cost.yaml:symbols.orbit_size
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fd74ac/tasks/TASK-20260823-d26ed5/shift-recovery-and-cost.yaml:uniform_shift_model
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fd74ac/tasks/TASK-20260823-d26ed5/proof-search-map.yaml:audits.exact_baseline_reproduction.costs_to_rederive
          - ledger/proposals/IDEA-20260823-0cec0b.yaml:idea.target_complexity.expected_attempts
        scope_impact:
          - The exact J1 sign typing breaks and requires an immutable correction or superseding record by the Coordinator.
          - The degree N=D/s, squarefreeness, and nonidentity membership equivalence remain valid.
          - The fixed-factor asymptotic statements Omega(ell/D) and Omega(sqrt(ell)) are unchanged by replacing sD with 2D/s; exact constants and probability statements are not.
          - This review does not adjudicate J3 cost balancing or J4 recovery/decoder completeness.
    - joint: J2-constructor-evaluator-representation-and-hidden-materialization
      verdict: breaks
      first_break: explicit_public_input_implicit_constructor_absent
      constructor_trace:
        public_inputs:
          - E and its declared coordinate model
          - q and any charged extension-field representation
          - exact odd prime ell and exact-order point P
          - multiplier m and certified subgroup order D
          - quotient and coordinate normalization
        direct_baseline: >-
          The package gives a target-independent public construction only by
          enumerating H/S, computing all N points and normalized x-roots, and
          multiplying the N linear factors.  This is an exact explicit
          baseline, but it emits at least N distinguishable records and is not
          the requested succinct evaluator.
        implicit_candidates: >-
          Transposed Lattes evaluation, structured Cauchy or cyclic-resolvent
          evaluation, modular composition without coefficients, and
          random-access elliptic-net recurrence are names only.  No executable
          state constructor, query algorithm, coefficient lineage, word-size
          bound, or equality proof is supplied for any of them.
        conclusion: >-
          No public-input evaluator with beta below one half is established.
          The positive constructor/evaluator leg therefore breaks at the first
          obligation, consistently with the producer's own REVISE/select-none
          disposition.
      retained_scoped_obstruction:
        verdict: holds
        representation_family:
          - explicit root list with one field element for each of N distinct roots
          - dense degree-N monic coefficient vector with N nonleading slots
          - leaf-explicit product tree with N distinguishable leaves
          - per-coset table with N distinguishable records
        derivation: >-
          Each listed syntax contains N distinguishable output records by
          definition.  In the declared word model this forces Omega(N) output
          size and construction writes, Omega(N) retained memory when the
          state is kept, and Omega(N) one-time traffic when it is transferred.
          Since N=D/s and s is one or two, this is Omega(D).
        single_target_consequence: >-
          Combining the explicit-output setup bound with at least one charged
          operation for each of Theta(ell/D) uniform membership attempts gives
          Omega(D+ell/D)=Omega(sqrt(ell)) up to fixed sign constants.  The J1
          cardinality correction changes no exponent.
        excluded_inferences:
          - no lower bound for an o(N)-description implicit circuit
          - no lower bound for a random-access recurrence or oracle representation
          - no single-target inference from undeclared multi-target amortization
          - no generic-group, algebraic-circuit, or all-finite-domain impossibility
      hidden_materialization_result: >-
        The package correctly charges roots, dense coefficients, explicit
        leaves, per-coset labels, retained memory, and transfer for its four
        syntactic families.  Because no implicit candidate is actually
        constructed, the review cannot certify that a named transposed,
        modular-composition, resolvent, Lattes, or elliptic-net evaluator avoids
        hidden Theta(N) state; that route remains open rather than refuted.
