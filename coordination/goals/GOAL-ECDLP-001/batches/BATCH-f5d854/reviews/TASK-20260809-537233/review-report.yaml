  findings:
    - id: REV-BOOT-GAP-001
      severity: critical
      blocking: true
      evidence: >-
        The success criterion requires a 99-percent bootstrap interval for the
        diffuse-minus-concentrated gamma gap, but the estimator defines only
        per-arm resampling and never defines the gap bootstrap statistic.
      impact: >-
        Conforming implementations can compute different intervals and disagree
        on the primary registered decision gate.
      cheapest_repair: >-
        In an immutable successor, pair existing diffuse and concentrated fit
        records by draw ordinal at eta zero, compute gap_star[d] as diffuse
        gamma minus concentrated gamma, sort 8191 gaps, and use Type-1 ranks 41
        and 8151. Keep the existing arm-separated keys and state explicitly
        that the two arm resamples are independent. This adds no fits.
    - id: REV-SERIALIZATION-002
      severity: critical
      blocking: true
      evidence: >-
        Folded YAML key templates preserve ambiguous embedded spaces; arm byte
        values and ordering are absent; retained bootstrap-index bytes,
        bootstrap digest framing, cluster-rank headers, summaries, fit records,
        comparison records, index, paths, and padding are not fully frozen.
      impact: >-
        Independent implementations cannot be required to absorb identical key
        bytes, produce identical digests, or generate identical archive bytes.
      cheapest_repair: >-
        Freeze whitespace-free key templates and concrete hex fixtures; assign
        diffuse=0 and concentrated=1; define all digest and record framing,
        path ordering, container indexing, and padding.
    - id: REV-DECODER-003
      severity: critical
      blocking: true
      evidence: >-
        One bitset and one multiplicity table encode S and one multiplicity
        channel, while X, Y, and V are described as separately checked mirrors.
        The artifact cannot represent those three values disagreeing.
      impact: >-
        X/Y/V equality is tautological rather than an independently decoded
        obligation, so the current certification claim is overstated.
      cheapest_repair: >-
        Either define X=Y=V as aliases of one encoded M field and narrow the
        certified interface, or encode three separately framed fields and add
        a mismatch fixture. The latter exceeds the current reserve by 968000
        bytes before other additions, so the archive cap must be recomputed.
    - id: REV-RESOURCE-ARTIFACT-004
      severity: critical
      blocking: true
      evidence: >-
        The design provides global totals but no stage-by-stage wall, CPU, RSS,
        shard, operation, logical-I/O, archive, exact-file-versus-slot, residual,
        or exact path/schema/allocation/digest/producer/read bijection.
      impact: >-
        Admission, cap invalidation, exact archive totals, and completeness
        cannot be independently recomputed from a future package.
      cheapest_repair: >-
        Add a reconciling stage ledger, exact-versus-maximum allocation
        semantics, padding and residual equations, and a bijection from every
        required artifact to path, schema, allocation, digest, stage, and read.
    - id: REV-MUTATION-CONTROL-005
      severity: major
      blocking: false
      evidence: >-
        No malformed bitset, endian-swapped table, truncated stream, or
        cross-channel mismatch fixture is preregistered.
      impact: untested rejection paths weaken the cheapest falsification control
      cheapest_repair: >-
        Add fixed single-bit, byte-swap, truncation, and conditional channel
        mismatch mutations with frozen rejection reason codes.
    - id: REV-PROBABILITY-LABEL-006
      severity: minor
      blocking: false
      evidence: >-
        The finite fixture law is deterministic while the objective is called
        an exact aggregated binomial likelihood.
      impact: terminology can imply a sampling law the fixture denies
      cheapest_repair: >-
        Rename it fixed aggregated binomial objective or composite
        quasi-likelihood and limit curvature and percentiles to apparatus output.
