    point_fits: 6
    all_fit_attempts: 49152
    identities:
      - 'Diffuse: X=Y=S=1 on 65536 roots, hence E[X]=E[Y]=p=1/4.'
      - 'Concentrated: X=Y=kappa on 65536/kappa roots, hence E[X]=E[Y]=1/4 and p=1/(4*kappa).'
      - 'kappa=N^(1/3), so delta_kappa=+1/3 and delta_ratio=-1/3 at eta=0.'
      - 'gamma_s=beta+1/3 gives diffuse gamma_s=1/3 and concentrated gamma_s=0.'
      - 'The Boolean-gamma gap is exactly 1/3.'

  design_repairs_materialized:
    decoder: >-
      A byte-level bitset/u16 decoder and a separately implemented rank-direct
      reference decoder must agree root-for-root; encoder/decoder shared-code
      self-consistency is not accepted.
    seed_and_rank: >-
      One frozen 32-byte seed, three disjoint prefix-free domains, exact key
      cardinalities, fixed output widths, strict uniqueness, ordered rank
      digests, and exact bootstrap reduction make regeneration bounded.
    exact_law: >-
      Materialized records are a deterministic finite population. Bootstrap
      indices use one u64 word reduced modulo 32 with no rejection because 32
      divides 2^64. No non-dyadic cap-conditioned law, imputation, or dropped
      draw survives.
    estimator: >-
      Exact cell sums feed kappa and p/E[X] bridge slopes plus a free-intercept
      marginal binomial fit. Whole clusters are resampled and every one of
      49152 fits must converge.
    resources: >-
      The design binds 146798080 XOF output bytes, 24036672 allocated archive
      bytes, 33554432 archive hard-cap bytes, 48073344 archive write-plus-read
      bytes, a 256 MiB RSS hard cap, and explicit wall/CPU caps.

  controls_before_belief:
    - static compiler must prove the exact schedule before materialization
    - two independent regenerators must produce identical rank and bootstrap digests
    - two independent decoders must agree on every root and summary
    - diffuse zero-concentration identity must reproduce exact neutral values
    - concentrated planted-power arm must recover both one-third bridge slopes
    - arm-label swap must change no numerical value except record ownership

  proof_search_map:
    baseline_reproduction: diffuse exact identity
    observation_collision: equal E[X] and E[Y] across arms
    quantifier_order: all seeds, estimators, thresholds, and budgets frozen before implementation
    method_ceiling: deterministic apparatus power only; no ECDLP inference
    nearby_object_control: diffuse arm and post-decode arm-label swap

  pareto_honesty:
    dominated_by: >-
      Not applicable as an algorithmic candidate; this is an apparatus
      control. Pollard rho remains the ECDLP baseline.
    quantitative_sota_delta:
      time: 0
      memory: 0
      data_or_query: 0
      note: no attack or measured result exists

  pending_independent_checks:
    - recompute every cardinality, byte total, exact mean, success count, and fit count
    - challenge prefix freedom, seed binding, rank uniqueness, and digest framing
    - challenge whether the dual decoders are genuinely independent
    - reproduce eta-aware slope references with directed multiprecision arithmetic
    - challenge the marginal estimator's quantifier order and convergence requirements
    - map every archive allocation to one write and one verification read
    - verify that no curve, selector, or ECDLP inference enters scope

  claim_boundary: >-
    This is a frozen design pending immutable snapshot and fresh independent
