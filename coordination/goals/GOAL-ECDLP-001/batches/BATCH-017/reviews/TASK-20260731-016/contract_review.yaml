# ---------------------------------------------------------------------------
# Objections
# ---------------------------------------------------------------------------
objections:
  - id: B-1
    severity: BLOCKING
    title: HEUR-DS-1 KS/tail pass-fail is not pre-registered as a decidable rule
    status: OPEN
    detail: >-
      H-DS-001.heuristic_assumptions[HEUR-DS-1].falsification_condition states
      that KS distance from Dickman rho(u) must exceed "the pre-registered
      threshold in EXP-DS-001". EXP-DS-001 contains no numeric KS threshold,
      no bound on the "constant factor" in the smoothness-probability claim,
      and no per-cell definition of the intermediate degree bound D used in
      u = log D / log B. TAIL-DS-1 asks whether the smoothest sample is an
      "extreme outlier" without a quantitative rule (e.g. implied probability
      times sample size). Metric HEUR_DS_1_KS_distance further permits KS of
      the intermediate-*degree* CDF against Dickman rho(u), which is a
      category error: rho(u) governs B-smoothness probabilities / LPF structure
      of random integers of size ~D, not the distribution of the degrees
      themselves. The formal claim is about P(B-smooth) ≈ c·rho(u); the metric
      and F3 ("KS/tail fail") do not pin a single measurable CDF or a fail
      threshold. Under docs/target-result-profile.md A7 / C12 and the Validator
      heuristic-validation checklist, a heuristic under test needs a
      pre-registered prediction and a decidable comparison — this contract does
      not yet provide one. F3 is therefore not executable; HEUR status can be
      fabricated after seeing data.
    discharge: >-
      Amend EXP-DS-001 (versioned amendment; do not silently rewrite v1) to:
      (1) define the sampled quantity as B-smoothness indicators or u-values /
      LPF-derived smoothness statistics of intermediate integers (not raw
      degree CDF vs rho); (2) tabulate or formulaically define D (or u) per
      (bits,B,m) from Semaev degree bounds before sampling; (3) pre-register a
      numeric KS threshold and/or a two-sided band on empirical smoothness
      rate / rho(u) (name the constant-factor bound); (4) pre-register a
      quantitative TAIL-DS-1 rule (e.g. flag if smoothest-sample rho-probability
      < 1/N_samples). Align H-DS-001 falsification_condition text with that
      amendment if needed via superseding hypothesis note / amendment pointer.

  - id: B-2
    severity: BLOCKING
    title: Structure-gate R_null middle band unlabeled when R < 0.5
    status: OPEN
    detail: >-
      S1 requires R_null >= 0.9 whenever R < 0.5 (plus other conjuncts). F2
      fires only when R < 0.5 and R_null < 0.5. The reachable band
      R < 0.5 and 0.5 <= R_null < 0.9 matches neither S1 nor F2, yet is exactly
      the soft failure mode of IDEA-20260731-011's structure-destruction gate
      (apparent real speedup with a partial null echo). outcome_disposition has
      no named label for this band. The handoff requires the null-control gate
      and decidable success/falsification criteria; as frozen, the Executor
      cannot assign a unique official outcome when the null partially tracks
      the real arm. This is a protocol hole, not a measurement.
    discharge: >-
      Name an explicit disposition for R < 0.5 ∧ 0.5 <= R_null < 0.9 (e.g.
      structure_gate_failed_soft / reject_scoped_mechanism or weaken with
      reason code NULL_PARTIAL_ECHO), mutually exclusive with S1 and F2.
      Prefer aligning the F2 threshold with the S1 gate (F2 whenever R < 0.5
      and R_null < 0.9) if that matches IDEA-20260731-011 intent for this
      rewrite metric.

  - id: M-1
    severity: MAJOR
    title: Yield-charged cost_split / cost_naive formula underspecified
    status: OPEN
    detail: >-
      Primary R is yield-charged group-op equivalents via rho wall-calibration,
      but the contract does not state the exact expression (e.g. whether
      cost = wall_seconds_method * (rho_total_group_operations / rho_wall_seconds)
      / n_usable_relations, which solver events enter wall time, whether claw
      table build is included, and whether failed attempts are charged). Without
      a frozen formula, two honest Executors can report different R on the same
      traces. Not solely REVISE-forcing if B-1/B-2 are repaired with a precise
      cost identity, but it is a residual integrity risk for the primary metric.
    discharge: >-
      Add a one-line identity for cost_naive, cost_split, and the yield-charged
      aggregator; list included phases; require the identity in summary.json.

  - id: M-2
    severity: MAJOR
    title: Partial-matrix R outcomes have no named disposition
    status: OPEN
    detail: >-
      S1 needs R < 0.5 on at least two bit sizes; F1 needs R >= 0.9 at all
      successfully harvested (B,m) cells. Reachable outcomes such as R < 0.5 on
      exactly one bit size, or 0.5 <= R < 0.9 on all harvested cells, match
      neither. Exploratory contracts may treat this as implicit inconclusive,
      but the frozen outcome_disposition list does not say so. Recorded MAJOR
      so Coordinator/Executor do not invent a label post hoc.
    discharge: >-
      Add an explicit prediction_not_met / inconclusive_partial disposition for
      complete valid runs where neither S1 nor F1 nor F2 fires.

  - id: M-3
    severity: MAJOR
    title: CTRL-NULL-RHO reuses R_real/R_null with a different meaning than primary R
    status: OPEN
    detail: >-
      Primary R is cost_split/cost_naive. CTRL-NULL-RHO (and IDEA-20260731-011)
      speak of R_real ≈ R_null ≈ 1 for honest rho, meaning cost_A / matched_rho
      style ratios. Same symbol, different definition. Risk of Executor wiring
      the wrong ratio into the ±0.15 band.
    discharge: >-
      Rename control metrics (e.g. rho_calib_ratio_real / rho_calib_ratio_null)
      and keep R / R_null exclusively for split-vs-naive.

  - id: M-4
    severity: MAJOR
    title: Claw key, early-abort smoothness test, and null multidegree table not frozen
    status: OPEN
    detail: >-
      degree_split_claw refers to an "intermediate invariant table" and early
      abort under a "declared smoothness test" without defining the invariant
      or the test predicate. Null construction says "matched multidegree" without
      a table of Semaev multidegrees for m in {4,5}. These are implementation
      degrees of freedom that can change measured R after approval.
    discharge: >-
      Freeze: (a) intermediate key definition; (b) smoothness-abort predicate
      and when it is enabled; (c) multidegree vectors for real and null arms.

  - id: m-1
    severity: MINOR
    title: IDEA-011 threshold adaptation (rho-relative vs naive-relative) is intentional but undocumented as a mapping
    status: OPEN
    detail: >-
      IDEA-20260731-011 gates on cost_A/matched_rho < 0.7 with R_null >= 0.95.
      EXP-DS-001 gates on split/naive < 0.5 with R_null >= 0.9. Adaptation to a
      rewrite-vs-naive metric is reasonable; a one-sentence mapping note would
      prevent later readers from treating the thresholds as the IDEA-011 numbers.
    discharge: Optional clarifying note in an amendment; not REVISE-forcing alone.

  - id: I-1
    severity: INFORMATIONAL
    title: Claim ceiling, D-1 approval routing, and weakened-hypothesis quarantine are sound
    detail: >-
      Toy ceiling, no asymptotic support path, approved_by null, approval only
      via TASK-20260731-017, and does_not_modify H-IC-001/H-STR-002 are all
      correctly stated. Matched rho/BSGS and planted-bug null controls are
      present. REVISE is about decidability holes, not claim-ceiling failure.
    discharge: null

  - id: I-2
    severity: INFORMATIONAL
    title: Coordinator note — queue/plan regeneration outside write_scope
    detail: >-
      TASK-20260731-016 write_scope is only
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-017/reviews/TASK-20260731-016.
      This reviewer cannot mark dispatch_queue.json completed or regenerate
      dispatch_plan via a scoped edit. Coordinator must mark TASK-016 completed
      and run tools/research_dispatch.py so TASK-017 becomes ready. Review
      artifacts below are complete for archival under TASK-017.
    discharge: >-
      Coordinator: set TASK-20260731-016 state completed with completed_at;
      regenerate BATCH-017 dispatch plan; then run TASK-017 (snapshot review +
      APPROVAL_DETERMINATION). On this REVISE verdict, determination must be
      NOT APPROVED; no Executor handoff.

objection_counts:
