# ---------------------------------------------------------------------------
# New residuals (none blocking)
# ---------------------------------------------------------------------------
objections:
  - id: R-1
    severity: MAJOR
    title: Multi-cell S1∧F2 coexistence lacks an explicit override rule
    status: OPEN_NONBLOCKING
    detail: >-
      Per-cell, R<0.5 splits cleanly into S1-eligible (R_null>=0.9) vs F2
      (R_null<0.9). Across a full bits×B×m matrix it remains possible that two
      bit sizes meet S1's null conjunct while another R<0.5 cell meets F2.
      outcome_disposition does not state a priority. Scientific reading of
      IDEA-20260731-011 (and F2_met "structure_gate_failed") is that any F2
      cell voids mechanism-success: F2 overrides S1. Recorded so Executor /
      Validator do not invent a dual success label. Not a reopen of B-2 (middle
      band is labeled); not REVISE-forcing under the one-cycle cap.
    discharge: >-
      Optional clarifying sentence in a future amendment outside BATCH-017:
      "If any completed cell with R<0.5 has R_null<0.9, official disposition is
      F2_met even if other cells would satisfy S1." For this batch, treat that
      as the implied adjudication rule.

  - id: R-2
    severity: MINOR
    title: KS reference CDF named but not formula-pinned
    status: OPEN_NONBLOCKING
    detail: >-
      KS-DS-1 compares the empirical CDF of Z_j = ln(N_j)/ln(P_max(N_j)) to the
      "classical Dickman LPF CDF for uniform random integers in (1, D]". The
      threshold is numeric and the quantity is correct (not degree-CDF vs rho).
      A closed-form or library pointer for the reference CDF is not frozen;
      RATE-DS-1 and TAIL-DS-1 independently decide HEUR status. Residual
      implementation freedom for Validator, not undecidability of F3.
    discharge: Optional future pin of the reference CDF implementation.

  - id: m-2
    severity: MINOR
    title: Honest-rho prose still uses R_real/R_null colloquially
    status: OPEN_NONBLOCKING
    detail: >-
      inputs.null_object.honest_rho_negative_control still writes
      "R_real ≈ R_null ≈ 1" while CTRL-NULL-RHO correctly renames metrics.
      Binding control text wins; colloquial residue only.
    discharge: Optional prose cleanup in a later amendment.

  - id: I-1
    severity: INFORMATIONAL
    title: Claim ceiling, D-1 approval routing, and quarantine remain sound
    detail: >-
      Toy ceiling, no asymptotic support path, approved_by null, approval only
      via TASK-20260731-021, and does_not_modify H-IC-001/H-STR-002 are correctly
      stated. v1 blob left immutable. PASS is about B-1/B-2 discharge, not a
      measurement or approval.
    discharge: null

  - id: I-2
    severity: INFORMATIONAL
    title: Coordinator note — queue/plan regeneration outside write_scope
    detail: >-
      TASK-20260731-020 write_scope is only
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-017/reviews/TASK-20260731-020.
      This reviewer cannot mark dispatch_queue.json completed or regenerate
      dispatch_plan via a scoped edit. Coordinator must mark TASK-020 completed
      and run tools/research_dispatch.py so TASK-021 becomes ready.
    discharge: >-
      Coordinator: set TASK-20260731-020 state completed with completed_at;
      regenerate BATCH-017 dispatch plan; then run TASK-021 (snapshot re-review
      + APPROVAL_DETERMINATION). On this PASS verdict, determination should be
      APPROVED if no post-review integrity failure; then Executor may be
      authorized against specification.v2.yaml only.

  - id: I-3
    severity: INFORMATIONAL
    title: H-DS-001 text still names R_null < 0.5; EXP-DS-001 v2 adjudicates at 0.9
    detail: >-
      H-DS-001.falsification_conditions still bullet R_null < 0.5. Amendment
