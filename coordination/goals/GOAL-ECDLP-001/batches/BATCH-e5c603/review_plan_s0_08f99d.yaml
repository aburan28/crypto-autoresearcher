review_plan:
  id: review_plan_s0_08f99d
  goal: GOAL-ECDLP-001
  batch: BATCH-e5c603
  experiment: EXP-ECDLP-08f99d
  hypothesis: H-ECDLP-3a73d1
  source_proposal: IDEA-20260913-31457a
  approval_decision: DEC-20260913-ebcd6a
  run: pending_stage0_run
  recorded_at: '2026-09-13T18:19:00Z'
  recorded_by: coordinator
  recorded_under_task: TASK-20260913-34d9ec
  recorded_before_producer_run: true
  recorded_before_reviewers: true
  assignment_status: pending_additive_overlay
  assignment_rule: >-
    Each pending slot below must be mapped to exactly one future reviewer
    TASK-* by an additive assignment overlay written after the design snapshot.
    This frozen plan is never edited. If the future reviews occur in this
    same session, every assignment and report must record
    independent_session: false; no same-session review may be described as
    independent corroboration.

  claim_under_review: >-
    The producer's maximum Stage 0 claim under EXP-ECDLP-08f99d and
    DEC-20260913-ebcd6a: one valid run has independently derived the exact
    p=23 curve and all 28 points; reproduced the full frozen d table under
    the standard 2-torsion convention; found zero native homomorphism
    violations among all 784 ordered pairs, the exact four-element
    product-+1 image, |2E|=7=<(3,9)>, four halves of (3,9) with four distinct
    labels, unique 3-division point (10,4), and constant d image on the
    order-7 subgroup; passed the seeded random-label threshold, planted
    Z/28->Z/4 homomorphism, non-homomorphic fibre collision, coarsening
    ladder, all payload mutations, all invalid-input refusals and assembled
    tail scans; reported certificate none and no Stage 1/2 quantity. Claim
    ceiling: stage0_positive_control_fixture_only.

  coordinator_prior: >-
    Written before any run or review. The Coordinator expects the exact
    fixture anchors to reproduce and expects every payload mutation and
    invalid-input control to discriminate. Confidence is lower for the
    control harness than for the finite-group identities because
    RUN-ECDLP-1bef8f-S0 was invalidated after static/tautological controls
    returned clean-looking booleans. The most likely break is therefore not
    an arithmetic anchor but a gate assigned from an expected literal rather
    than derived from an assembled mutated payload. The second likely break
    is mishandling O or chi(0) at 2-torsion. The third is conflating zero
    fibre-propagation violations with the native homomorphism law despite the
    registered relabeling collision. The Coordinator expects the empirical
    random-label lower-tail threshold to be positive but treats any failure
    to separate as instrument invalidity, not evidence against d. The
    Coordinator expects no Stage 0 conclusion about c, timing, attack cost,
    prime-order ECDLP, transfer, or H2.

  joints:
    - joint: J1_curve_group_and_full_d_table
      assigned_to: pending_validator
      attack_plan: >-
        Rebuild E(F_23) from y^2=x^3+16x+6 without importing the producer.
        Enumerate all x,y pairs, verify 28 points, the order multiset
        {14:18,7:6,2:3,1:1}, roots 1,2,20 and the three rational 2-torsion
        points. Derive d for each row from Euler's criterion and the standard
        product convention, then compare with the frozen 28-row table.
        Deliberately evaluate literal chi(0) at the torsion points and require
        refusal. The expected break is a convention or infinity special-case
        hidden behind the expected table.
      breaking_artifact: >-
        A point/order/label row with independent derivation and both values,
        or a literal-chi(0) payload accepted by the evaluator.
    - joint: J2_homomorphism_image_and_native_law
      assigned_to: pending_validator
      attack_plan: >-
        Using independently implemented group addition and the independently
        derived table, enumerate all 784 ordered pairs including O and count
        componentwise-law violations. Derive the image set, size and
        component products from rows. Repeat after MUT-WRONG-TORSION-VALUE
        and MUT-NONCONSTANT-ODD-SUBGROUP; each must produce a positive count.
        The expected break is a counter that skips O/torsion rows or reads
        expected zero directly.
      breaking_artifact: >-
        A pair (R,S) whose independently derived law verdict differs from the
        producer, or a mutation leaving the zero gate true.
    - joint: J3_halves_doubled_image_and_odd_contrast
      assigned_to: pending_validator
      attack_plan: >-
        Compute [2]P for all 28 points, derive the seven-element image and
        compare it with <(3,9)>. Solve [2]Q=(3,9) and [3]Q=(3,9) by exhaustive
        search, derive four and one preimages respectively, and derive the
        labels of the four halves. Apply MUT-SHARED-HALF-LABEL and require
        the distinct count to fall to 1. Derive the order-7 subgroup labels
        and apply its mutation. The expected break is a hard-coded half list
        whose labels are not recomputed from the mutated table.
      breaking_artifact: >-
        A missing/extra division point, a differing label, or a mutation
        that fails to move the relevant derived count.
    - joint: J4_random_null_threshold_and_seed_integrity
      assigned_to: pending_validator
      attack_plan: >-
        Independently implement the frozen SHA-256 label generator, regenerate
        all 200 seed streams and V_native counts, sort them, and derive the
        fifth order statistic. Confirm the real and planted values are zero
        and strictly below that threshold. Verify no equality-to-expectation
        gate exists. Delete one null count from an assembled-copy payload and
        require the tail gate to fail. The expected break is a seed framing
        ambiguity, an omitted replicate, or a theoretical-expectation
        comparison substituted for the registered empirical threshold.
      breaking_artifact: >-
        A seed/count mismatch with digest input bytes, a different derived
        threshold, or an incomplete vector accepted by the gate.
    - joint: J5_observation_collision_and_coarsening_ladder
      assigned_to: pending_red_team
      attack_plan: >-
        Recompute both generic-group controls. Show k mod 4 has zero native
        violations. Show phi(k mod 4), phi swapping 0 and 1, has image size 4
        and zero fibre-propagation violations but 735 native-law violations.
        Then enumerate all 28^3 triples for all four ladder rungs and require
        (image,V_fibre)=(4,0),(3,2058),(2,4116),(1,0). Search every report
        sentence for an inference of the native law from image size or fibre
        consistency. The expected break is proving too much from the coarse
        observable or pooling the exact and constant endpoints.
      breaking_artifact: >-
        A corrected count or a quoted inference that survives the
        non-homomorphic collision.
    - joint: J6_payload_driven_controls_and_hardcoding
      assigned_to: pending_red_team
      attack_plan: >-
        Trace each gate to the supplied payload and assembled output. Execute
        all six registered mutations on deep copies. In particular permute
        root order and require component permutation with preserved group
        properties; negate every y and require point permutation with
        preserved x-label properties; corrupt shared-half, odd-subgroup and
        torsion labels and require the named failures. Replace expected-label
        constants in the test harness with sentinels to verify computation
        does not consume them before comparison. The expected break is the
        RUN-ECDLP-1bef8f-S0 failure mode: clean booleans assigned from static
        expected values.
      breaking_artifact: >-
        Dataflow from an expected literal to a pass gate, or a mutation that
        should break/preserve a gate but does not.
    - joint: J7_invalid_inputs_and_assembled_tail_gates
      assigned_to: pending_red_team
      attack_plan: >-
        Send the infinity-without-label, literal-chi(0), nonsplit
        y^2=x^3+x+3 and singular y^2=x^3 payloads through the same public
        parser and evaluator as REAL; require structured refusals. Recursively
        scan the assembled output and mutate it with a non-none certificate,
        extra point row, missing null replicate and semantic c/timing field;
        require each tail gate to become false. The expected break is a
        validator that checks local literals while malformed fields survive
        elsewhere in retained artifacts.
      breaking_artifact: >-
        An accepted invalid payload or injected prohibited/malformed field
        that leaves its derived gate true.
    - joint: J8_authorization_scope_and_accounting
      assigned_to: pending_red_team
      attack_plan: >-
        Inspect every produced path and semantic field. Confirm exactly one
        Stage 0 run, certificate none, and no implementation/execution of
        Stage 1 timing or Stage 2 prime-order contrast. Confirm no c, timing,
        attack cost, rho/BSGS comparison, scalar, ECDLP result or transfer
        claim. Confirm the report states exponent gain 0, domination by
        Pohlig-Hellman, the structured full-rational-2-torsion scope,
        H-TORS-9851f8's odd-order boundary, and that KN-FIND-ffe1df's
        withdrawn headline is not support while Theorem C is exact-only.
        The expected break is an "illustrative" cost or prime-order
        extrapolation appearing outside the main result object.
      breaking_artifact: >-
        A named unauthorized artifact/field or a quoted conclusion above
        stage0_positive_control_fixture_only.
    - joint: J9_blind_d_table_rederivation
      assigned_to: pending_blind
      attack_plan: >-
        From only p=23, A=16, B=6, ordered roots (1,2,20), the group-law
        formulas, Euler's criterion and the stated standard torsion
        convention, independently enumerate the point set and derive the
        complete 28-row d table and the 784-pair homomorphism count. Write
        and freeze the derivation output before reading any producer artifact
        or expected d table. The expected break is a torsion-sign or infinity
        convention error shared by the producer and ordinary validator.
      breaking_artifact: >-
        A blind table/count differing from the producer, with the first
        differing row or pair and complete arithmetic.

  blindness:
    mutual: true
    within_round: true
    lifted_for: []
    rationale: >-
      Pending reviewers may not read sibling reports. The assignment overlay
      will name one task per pending slot; each report attests to sources read
      and its owned joints only. The Coordinator composes the joint verdicts.

  proves_too_much:
    objects:
      - >-
        phi(k mod 4) with phi swapping 0 and 1: image size 4 and zero
        fibre-propagation violations but not a native Z/4 homomorphism.
      - >-
        The constant coarsening endpoint: zero fibre violations solely
        because image size is 1, not because four branches are separated.
      - >-
        The order-7 subgroup: d is constant and [2] is bijective, so any
        claimed four-way prime-order pruner is known false here.
      - >-
        A curve with nonsplit cubic: the full-rational-2-torsion label is
        undefined; an argument that applies unchanged has escaped its scope.
    failure_signature: >-
      The non-homomorphic relabel has positive native-law violations; the
      constant endpoint is distinguished by image size 1; the odd subgroup
      reports image size 1 and b=1; and the nonsplit payload is refused.
      Any argument still claiming native multiplication, four-way pruning,
      or family transfer on these objects has proved too much.
    assigned_to: pending_red_team

  blind_rederivation:
    required: true
    quantity: >-
      The complete d:E(F_23)->{+1,-1}^3 table under the standard torsion
      convention and the count of violations of d(R+S)=d(R)d(S) over all
      784 ordered pairs.
    parameters: >-
      p=23; y^2=x^3+16x+6; ordered roots (1,2,20); d(O)=(1,1,1);
      at (e_i,0), replace the zero i-th factor by
      (e_i-e_j)(e_i-e_k).
    blind_from:
      - experiments/EXP-ECDLP-08f99d/specification.yaml#inputs.stage0_fixture.full_d_table
      - experiments/EXP-ECDLP-08f99d/implementation/
      - experiments/EXP-ECDLP-08f99d/runs/
      - experiments/EXP-ECDLP-08f99d/execution-report-s0.yaml
      - >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-e5c603/reviews/
      - any sibling report or producer message containing expected labels
    allowed_sources:
      - >-
        A sealed assignment overlay containing only the parameters and
        quantity above, generated without the frozen d-table subsection.
      - standard finite-field and elliptic-curve group-law definitions
    assigned_to: pending_blind

  procedure_deviations: []
  composition_rule: >-
    Every joint must have one assigned task in the additive overlay and a
    matching attestation. Run tools/check_review_independence.py on the batch
    before composition. A clean composition can establish only Stage 0 fixture
    and instrument validity at p=23. Any same-session review is explicitly
    independent_session=false and carries no independent-model corroboration.
