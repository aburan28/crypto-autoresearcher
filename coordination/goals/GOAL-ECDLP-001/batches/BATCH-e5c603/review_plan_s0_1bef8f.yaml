  claim_under_review: >-
    The Stage 0 claim as its PRODUCER will state it, for the single authorized run of
    EXP-ECDLP-1bef8f under DEC-20260913-0f8468: status valid; the five pre-registered
    fixture anchors of IDEA-20260913-c5f90d reproduce EXACTLY under exact integer
