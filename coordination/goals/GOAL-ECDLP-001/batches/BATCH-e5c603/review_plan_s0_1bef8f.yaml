    y^2 = x^3 + x + 28 over F_10007 with n = 9851 prime, exactly 69 on-curve x-values
    of height at most 10 carrying B = 138 base points; (c) the homogenised arity-2
    relation form has exactly 9 monomials at total degree 4 with all nine bidegrees
    present and the frozen coefficient list; (d) H^4/p = 0.99930 at p = 10007,
    H = 10; (e) the dispersion cell has mean 1.9332, variance 5.5822, dispersion
    index 2.8875, 3704 unreachable targets, max 138, c(O) = 138, with the seeded
    matched negation-closed null at mean dispersion 2.9163 over range 2.7628-3.1316
    and 3712.3 mean unreachable targets — AND the three known-false claims KF-1,
    KF-2, KF-3 are rejected, the three invalid inputs INV-1, INV-2, INV-3 are
    refused, the certificate kind is `none`, and NO gamma is reported. The claim
    ceiling is stage0_fixture_reproduction_only. Frozen object is P-S0-HTBOX.

  coordinator_prior: >-
    Recorded before any reviewer runs and before the producer runs.
    (1) ON THE STAGE 0 GATES the Coordinator expects ALL primary gates true: every
    anchor reproduces exactly, all three known-false claims are rejected, all three
    invalid inputs are refused, certificate kind is `none`, and no gamma appears. The
    reason for the expectation is weak but stated: every anchor is exact integer
    arithmetic over two small cells and the proposal reports having enumerated them
    exhaustively during ideation. The expectation is NOT a result and the review is
    what can overturn it.
    (2) WHERE THE COORDINATOR THINKS A BREAK IS MOST LIKELY, in order: first the
    HEIGHT NORMALISATION of anchor (b) — the asymmetric convention (alpha in the
    symmetric interval, beta >= 1) changes |F_H| by tens of per cent at small H, and
    an off-by-one in the beta range or a different tie-breaking rule is the single
    cheapest way to reproduce 23/39/47/111/127 as something else; second the
    two-directional structure of anchor (a), where a one-sided check on a vacuous
    predicate would pass; third whether 6441 counts ORDERED triples with the
    multiplicity the pipeline actually uses; fourth the coefficient list of anchor
    (c), where a sign on -2a*x_3 - 4b or on a^2 - 4b*x_3 is easy to carry wrongly and
    self-consistently through both the producer and a non-blind check.
    (3) ON THE PRE-REGISTERED STAGE 1 BRANCH — recorded here because a prior written
    after the computation is worthless — the Coordinator expects BR-CLOSURE,
    gamma_2 <= 0.9, and expects gamma_3 <= gamma_2. Reasons: the requirement side is
    exactly 1 by the density identity, which is the uniqueness threshold of a single
    modular equation, while the only rigorous anchor available is the univariate
    Coppersmith exponent 1/d = 1/4 at degree 4 (provenance `recalled`); multivariate
    small-root bounds are known to degrade with the number of unknowns, and here
    there are four; and a method achieving gamma_2 >= 1 would be returning box roots
    at or above the density where a random equation need not have one at all, which
    would be surprising enough to require review-breakthrough before anyone believed
    it. The Coordinator holds this prior with LOW confidence for one specific reason:
    gamma_2 for this exact 9-monomial bidegree-(2,2) support has never been computed
    by this program, the support is unusually structured rather than generic, and
    structured supports are exactly where the Jochemsz-May strategy can beat the
    naive expectation. BR-LEAD is therefore live and is the outcome the Coordinator
    would most want to be wrong about. Stage 1 is UNAUTHORIZED and nothing in this
    round tests this prior; it is recorded now so that it cannot be written
    afterwards.
    (4) WHAT THE COORDINATOR DOES NOT EXPECT AND WILL NOT ACCEPT FROM THIS ROUND: any
    reading of Stage 0 as evidence about gamma_m, about whether the size-function
    lane is open or closed, about additive structure in the height box, about
    coverage, or about the ECDLP; any claim founded on the density observable in
    either direction; and any treatment of an anchor mismatch as negative
    mathematical evidence rather than as a fixture defect.

  procedure_deviations:
    - id: PD-C5F90D-S0R1
      what: >-
        Same-session review. The session that designed the contract is expected to
        drive the Stage 0 review attacks as well, so independent_session is FALSE for
        every slot in this round.
      independent_session: false
      why: >-
        Independence here is the DECLARED PLAN and the blind_from cut, not a second
        process. This is recorded rather than absorbed because a plan that reads as
        independent while running in one session is worth less than one that never
        claimed it. If a genuinely independent session becomes available, a hardening
        round may re-run any joint and must record that it did.
      asserts_nothing_about: >-
        The science. It bounds how much corroboration a concurring verdict from this
        round can carry, and nothing else.
    - id: PD-C5F90D-S0R2
      what: >-
        The blind re-deriver is allowed to read the frozen specification, which
        contains the pre-registered coefficient list it must re-derive.
      independent_session: false
      why: >-
        The check this round can actually run is against a PRODUCER implementation
        that is wrong and self-consistent, which is what validation cannot see. The
        pre-registration is not the producer, so reading it does not defeat that
        check. The cost is real and is stated: the re-deriver knows the target value,
        so its agreement is weaker evidence than a fully sealed derivation would be.
        MITIGATION, REQUIRED: the re-deriver records its own complete derivation
        transcript — homogenisation, expansion, per-bidegree coefficient — and
        commits it BEFORE comparing against the pre-registration, and its attestation
        states the order in which it did so. A fully sealed re-derivation is
        available to a later hardening round by withholding the specification.

  joints:
    - joint: J1_relation_condition_two_directional
      anchor: stage0 anchor (a)
      assigned_to: pending_validator
      attack_plan: >-
        Rebuild the F_101 cell from the frozen manifest and enumerate ALL ordered
        triples of on-curve x-coordinates independently of the producer's loop order.
        Compute f_3 = (e_2 - a)^2 - 4*e_1*(e_3 + b) mod 101 from the elementary
        symmetric functions and, SEPARATELY, decide realisability by direct point
        arithmetic (choose points with those x-coordinates and test that some sign
        combination sums to the identity). Report the two counts and the two error
        counts independently: realisable-but-not-vanishing (false negatives) and
        vanishing-but-not-realisable (false positives). Confirm 6441 and confirm both
        error counts are zero. Then attack the count itself: check that 6441 is a
        count of ORDERED triples under the producer's own multiplicity convention by
        recomputing the unordered count and the count with repeated x-coordinates
        separately, and confirm #E = 115. WHERE THE COORDINATOR THINKS IT BREAKS: a
        one-sided check (only that realisable triples vanish), which passes on a
        vacuous predicate; or an ordered/unordered mismatch that lands near 6441 by
        coincidence.
      breaking_artifact: >-
        A triple exhibited with its x-coordinates, its f_3 value, and its
        realisability decided by point arithmetic, contradicting the producer in one
        direction; or a corrected total with the convention that produces it.
    - joint: J2_box_counts_and_base
      anchor: stage0 anchor (b)
      assigned_to: pending_validator
      attack_plan: >-
        Reimplement ht(x) from the declared asymmetric normalisation — minimise
        max(|alpha|, beta) over alpha = x*beta mod p with beta >= 1 and alpha reduced
        to the symmetric interval — WITHOUT reading the producer's height routine, by
        brute force over beta at these tiny p rather than by continued fractions, so
        that a continued-fraction bug cannot be reproduced. Recount |F_H| at
        H = 4, 5, 6, 9, 10 and confirm 23, 39, 47, 111, 127 exactly, then confirm
        c_H = 1.438, 1.560, 1.306, 1.370, 1.270 as |F_H|/H^2 from the integer counts.
        On the p = 10007 cell confirm 69 on-curve x-values of height at most 10 and
        B = 138 points, confirm n = 9851, confirm n is prime and n != p, and confirm
        the curve is non-singular. Then vary the convention deliberately: recount
        under the SYMMETRIC normalisation and with beta allowed negative, and report
        how far each moves the counts. WHERE THE COORDINATOR THINKS IT BREAKS: this
        is the most likely break in the whole round — an off-by-one in the beta range
        or a different tie-breaking rule shifts these counts by tens of per cent at
        H = 4..6.
      breaking_artifact: >-
        A recount table under the declared normalisation disagreeing at any H, with
        the specific x-values added or dropped and the lift that decides each.
    - joint: J3_pinning_anchor_and_identity
      anchor: stage0 anchor (d) and the identity control
      assigned_to: pending_validator
      attack_plan: >-
        Confirm H^4 = 10000, p = 10007, and the ratio 0.99930 to the frozen
        precision, computed from exact integers rather than floating point, and
        confirm B^2/n = 1.9332 with B = 138 and n = 9851. Then check the pinning
        claim is not a coincidence of this cell: recompute H^{2m} against n/c_H^m at
        m = 2 and m = 3 with the measured c_H and report the ratio at each, and
        confirm KF-1 (that the product of bounds falls with m) is refuted by the
        arithmetic and not merely asserted. Separately confirm the identity control:
        c(O) = 138 = B exactly, which negation closure forces to be at least B.
        WHERE THE COORDINATOR THINKS IT BREAKS: a c(O) below B, which is a
        negation-closure bug in the base construction and would invalidate anchor (e)
        as well; or a pinning ratio computed in floating point and rounded into
        agreement.
      breaking_artifact: >-
        An exact-integer recomputation disagreeing with 0.99930 or 1.9332 at the
        frozen precision, or a c(O) below B with the missing base points named.
    - joint: J4_dispersion_cell_and_matched_null
      anchor: stage0 anchor (e)
      assigned_to: pending_validator
      attack_plan: >-
        Index the whole group of the p = 10007 cell once by repeated addition of a
        generator, compute the arity-2 ordered decomposition count for EVERY target
        as an exact convolution over the 138-point base, and confirm mean 1.9332,
        variance 5.5822, dispersion index 2.8875, 3704 unreachable targets and max
        138. Independently regenerate the 60 matched negation-closed random bases
        from seed 20260913 and confirm mean dispersion 2.9163, range 2.7628-3.1316
        and 3712.3 mean unreachable targets; confirm every null draw is
        negation-closed and of size exactly 138 (drawn as a random x-SET with both
        points per x, NOT as a random point set). Cross-check the mean against the
        ordered-pair conservation identity B^2/n, which must agree for the box AND
        for every null draw — KN-FIND-007's multiset identity is
        C(B+m-1, m)/n and does not apply to this ordered metric. If a null draw's
        mean differs from the box's, the null is not matched. WHERE THE COORDINATOR
        THINKS IT BREAKS: a null drawn as a plain
        random point set rather than a negation-closed x-set, which would separate
        from the box for that reason alone and manufacture a spurious signal; or a
        draw set not reproducible from the declared seed.
      breaking_artifact: >-
        A recomputed dispersion index or unreachable count disagreeing with the
        anchor, or a null draw that is not negation-closed, exhibited with the
        offending point.
    - joint: J5_monomial_support_blind_rederivation
      anchor: stage0 anchor (c)
      assigned_to: pending_blind
      attack_plan: >-
        From the STATEMENT of the quantity alone, re-derive the homogenised arity-2
        form: substitute x_1 = alpha_1/beta_1 and x_2 = alpha_2/beta_2 into
        f_3(x_1, x_2, x_3) = (e_2 - a)^2 - 4*e_1*(e_3 + b), multiply through by
        beta_1^2*beta_2^2, and expand. Record the monomial count, the total degree,
        the set of bidegrees present, and every coefficient as a polynomial in a, b
        and x_3, in a transcript committed BEFORE any comparison. Then compare
        against the frozen pre-registration and, separately, refute KF-2 by naming
        which bidegree a missing-bidegree claim would have to omit and showing its
        coefficient is nonzero. Do not read the producer's implementation, raw
        results, or execution report. WHERE THE COORDINATOR THINKS IT BREAKS: a sign
        or factor-of-two error in -2a*x_3 - 4b or in a^2 - 4b*x_3, which the producer
        and a non-blind checker would reproduce identically.
      breaking_artifact: >-
        An independently derived coefficient list differing from the frozen one in
        any entry, with the expansion step that produces the difference.
    - joint: J6_known_false_and_invalid_controls
      anchor: KF-1, KF-2, KF-3 and INV-1, INV-2, INV-3
      assigned_to: pending_red_team
      attack_plan: >-
        Try to make the pipeline ACCEPT each known-false claim. For KF-1, feed it the
        assertion that the product of unknown bounds falls with arity and check it is
        rejected by the identity rather than by a hard-coded string match. For KF-2,
        feed a support with a genuinely missing bidegree and check the rejection names
        which one is missing. For KF-3, feed a gamma_2 >= 1 claim with no lattice
        dimension or determinant and check it is rejected as inadmissible on its face
        — AND check the Stage 0 run does not itself report any gamma anywhere in its
        artifacts. For the invalid inputs, feed x = 0, the point at infinity, an H
        above (4p/3)^{1/2}, and a singular (a, b), and check each is handled or
        refused explicitly rather than silently coerced. WHERE THE COORDINATOR THINKS
        IT BREAKS: a control implemented as a hard-coded expected answer, which
        passes without testing anything; or an H above the Minkowski bound that is
        measured instead of refused, which would make the density condition vacuous
        while still reporting a number.
      breaking_artifact: >-
        A known-false claim accepted, an invalid input silently coerced, or a control
        shown to be a hard-coded constant rather than a computation.
    - joint: J7_density_observable_collision_limit_honoured
      anchor: the binding observation-collision limit
      assigned_to: pending_red_team
      attack_plan: >-
        Read every Stage 0 artifact and report whether ANY conclusion is founded on
        the density observable, in either direction. Specifically: does the run or its
        report read the reproduction of dispersion 2.8875 as evidence about the height
        box, as a coverage advantage, or as evidence that the box behaves randomly? Is
        the agreement of MEANS anywhere presented as a finding, when the ordered-pair
        conservation identity makes the mean uninformative about the base by
        construction? Is the collision (2.8875 against 2.9163 in range 2.7628-3.1316;
        3704 against 3712.3) stated as a LIMIT rather than as a null result the reader
        must infer? Also check the run does not claim any decay test: Stage 0 measures
        one value of p and therefore cannot test the declared decay parameter at all.
        WHERE THE COORDINATOR THINKS IT BREAKS: the honest failure mode here is
        rhetorical rather than numerical — a report that reproduces the fixture and
        then describes the height box as "behaving like a random base", which is a
        claim founded on the observable that has already been shown not to identify
        it.
      breaking_artifact: >-
        A quoted sentence from a Stage 0 artifact that rests on the density
        observable, with the claim it smuggles in.
    - joint: J8_stage_authorization_and_claim_ceiling
      anchor: DEC-20260913-0f8468 scope
      assigned_to: pending_red_team
      attack_plan: >-
        Confirm the run stays inside its authorization: no gamma_2, gamma_3 or gamma_m
        value, bound or estimate anywhere; no shift-polynomial set; no lattice, no LLL
        or BKZ call, no lattice dimension or determinant; no planted instance; no
        p-ladder and no second field size; no charged total against rho or BSGS; no
        ECDLP solve and no recovered scalar; certificate kind `none`; maximum_runs 1
        honoured with exactly one run record. Confirm the run does not authorize Stage
        1, 2 or 3, does not authorize Stage 1 of any sibling GOAL-ECDLP-001
        experiment, does not edit ledger/goals/GOAL-ECDLP-001/goal.yaml, does not add
        H-ECDLP-b97b72 to active_hypothesis_ids, and leaves current_batch_id at
        BATCH-9a5be4. Confirm the reported claim does not exceed
        claim_ceiling: stage0_fixture_reproduction_only, and that any anchor mismatch
        is classified as a FIXTURE DEFECT rather than as negative mathematical
        evidence. WHERE THE COORDINATOR THINKS IT BREAKS: an "illustrative" gamma
        estimate offered in prose, or a Stage 0 report whose conclusion section reads
        as though the lane had been narrowed.
      breaking_artifact: >-
        A named Stage 1+ artifact or authorization flag present in a Stage 0 run, or a
        reported claim above the ceiling, quoted.

  blindness:
    mutual: true
    within_round: true
    lifted_for: []
    rationale: >-
      Reviewers may not read each other's reports in this round; each attests to what
      it read. pending_validator recomputes fixtures from the producer's artifacts,
      pending_red_team attacks the controls, the collision limit and the
      authorization boundary, and pending_blind re-derives one quantity under an
      explicit blind_from cut. The Coordinator composes the verdicts: no blinded
      reviewer owns enough of the round to return a verdict on the whole claim, and a
      whole-claim verdict from one is an opinion formed from a fraction of the
      evidence. Blindness may be lifted deliberately for a later hardening round; it
      is not lifted here.

  proves_too_much:
    objects:
      - >-
        KF-1: the claim that the product of the unknown bounds FALLS with arity m.
        The conclusion is known false — the identity H^{2m} = n/c_H^m makes the
        product p^{1+o(1)} at every arity. An argument or pipeline that endorses KF-1
        has proved too much.
      - >-
        KF-2: a monomial support with a MISSING bidegree. Known false: independent
        expansion finds all nine bidegrees present with nonzero coefficients.
      - >-
        KF-3: gamma_2 >= 1 asserted WITHOUT the lattice dimension and determinant
        recorded. Known false as an admissible claim, whatever the true value of
        gamma_2 turns out to be: the assertion is unsupportable on its face, and a
        pipeline that accepts it would accept the LEAD branch on no evidence.
      - >-
        THE DENSITY OBSERVABLE AS AN IDENTIFIER of the height box. Known false by the
        proposal's own successful collision search: a matched negation-closed random
        base produces the same observation. An argument that concludes anything about
        the height box from the density observable has proved too much, because the
        same argument applied to the random base would conclude it about a base with
        no height structure at all.
      - >-
        THE RELABELLED Z/nZ CONTROL for the density half: a group with no height
        structure whatever, on which the density statistics must AGREE with the
        elliptic run because they are generic. An argument that reads the elliptic
        density statistics as structural must also read the relabelled group's as
        structural, which is false by construction.
    failure_signature: >-
      For KF-1, KF-2 and KF-3: the corresponding *_reject_pass gate is true and the
      rejection is produced by a computation rather than a hard-coded expected value.
      A pipeline that accepts any of the three has an artifactual instrument and the
      record stops as a procedure defect, never as evidence about the object. For the
      density observable and the relabelled group: no Stage 0 artifact draws any
      conclusion about the height box from the density statistics, and the collision
      is stated as a limit in the report itself. The correct signature on all five
      objects is REFUSAL — an argument that still goes through where its conclusion is
      known false is wrong somewhere nobody has read closely enough.
    assigned_to: pending_red_team

  blind_rederivation:
    required: true
    quantity: >-
      The monomial support of the homogenised arity-2 box relation form: its monomial
      COUNT, its total degree, the set of bidegrees present, and the coefficient of
      each monomial as a polynomial in a, b and x_3. Stated as the quantity and not
      as the method: the form is
      F(alpha_1, beta_1, alpha_2, beta_2) = beta_1^2*beta_2^2 *
      f_3(alpha_1/beta_1, alpha_2/beta_2, x_3), where
      f_3(x_1, x_2, x_3) = (e_2 - a)^2 - 4*e_1*(e_3 + b) and e_1, e_2, e_3 are the
      elementary symmetric functions of (x_1, x_2, x_3).
    why_this_quantity: >-
      It is the load-bearing quantity of the whole record that a wrong,
      self-consistent implementation would carry silently. Every later stage consumes
      this support: Stage 1's gamma_2 is a function of the monomial set and nothing
      else, so a single wrong coefficient or a missing bidegree would propagate into
      the one number the lane turns on, and validation from the producer's own
      artifacts would reproduce the error faithfully. It is also cheap: the
      re-derivation is pure symbolic algebra needing no curve, no field and no
      producer.
    parameters: >-
      Symbolic a, b and x_3 over Z; unknowns alpha_1, beta_1, alpha_2, beta_2. No
      field, no prime, no curve instance, no seed. The expected shape is 9 monomials
      at total degree 4 with bidegree (2, 2).
    assigned_to: pending_blind
    blind_from:
      - experiments/EXP-ECDLP-1bef8f/implementation/stage0_htbox.py
      - experiments/EXP-ECDLP-1bef8f/runs/
      - experiments/EXP-ECDLP-1bef8f/homogenisation-transcript.txt
      - experiments/EXP-ECDLP-1bef8f/execution-report-s0.yaml
      - experiments/EXP-ECDLP-1bef8f/raw-result.json
      - experiments/EXP-ECDLP-1bef8f/known-false-report.yaml
      - >-
        any Stage 0 producer artifact under
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-e5c603/ or any reviewer report
        from this round
    allowed_sources:
      - experiments/EXP-ECDLP-1bef8f/specification.yaml
      - ledger/hypotheses/H-ECDLP-b97b72.yaml
    allowed_sources_caveat: >-
      The specification carries the pre-registered coefficient list, so the
      re-deriver knows the target value. That is declared as PD-C5F90D-S0R2 with its
      cost and its mitigation: the re-deriver must commit its own complete derivation
      transcript BEFORE comparing, and must state that order in its attestation. The
      pre-registration is not the producer, so the check this re-derivation exists to
      run — catching a producer implementation that is wrong and self-consistent —
      survives intact. A fully sealed re-derivation, with the specification withheld,
      remains available to a later hardening round.
    method: >-
      Re-derive by hand or with an independent symbolic algebra routine written from
      the statement above. Do not import, read, or execute the producer's
      implementation. Expand fully, collect by bidegree, and report every coefficient
      including the ones the pre-registration says are equal (x_1^2x_2 and x_1x_2^2;
      x_1^2 and x_2^2; x_1 and x_2) — the symmetry is part of what is being checked,
      not an excuse to compute one of each pair.
    reports_to: >-
      Its own reviewer task directory under
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-e5c603/reviews/, with the
      review_attestation block of templates/research-records.md, including
      blind_from_respected and sources_read stated honestly and completely.

  composition_rule: >-
    The Coordinator composes the verdicts; no reviewer votes on the claim. Before
    treating the round as complete, run
    `python3 tools/check_review_independence.py --batch
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-e5c603` and record any departure
    from this plan in procedure_deviations rather than absorbing it. A concurring
    round here supports ONE thing — that the five fixtures reproduce and the three
    known-false claims are rejected — and supports nothing about gamma_m, about the
    height box, about coverage, or about the ECDLP.
  independence_declared:
    independent_session: false
    reason: >-
      Same-session review (PD-C5F90D-S0R1). Never claim independence not obtained: a
      concurring verdict from this round is bounded by that fact, and the durable
      independence in it is the blind_from cut on J5, not a separate process.
