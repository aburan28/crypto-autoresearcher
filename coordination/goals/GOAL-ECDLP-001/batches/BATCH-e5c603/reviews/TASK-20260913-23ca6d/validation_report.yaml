  metric_recomputations:
    - metric: homogenised_arity_2_monomial_support
      method: >-
        Independent exact dictionary polynomial arithmetic over Z. Set
        u=alpha_1/beta_1, v=alpha_2/beta_2, expanded
        (u*v+x_3*(u+v)-a)^2 - 4*(u+v+x_3)*(u*v*x_3+b), collected
        by (deg_u,deg_v), and mapped u^i*v^j to
        alpha_1^i*beta_1^(2-i)*alpha_2^j*beta_2^(2-j).
      affine_expansion: >-
        u^2*v^2 - 2*x_3*u^2*v - 2*x_3*u*v^2 + x_3^2*u^2
        + x_3^2*v^2 + (-2*a - 2*x_3^2)*u*v
        + (-2*a*x_3 - 4*b)*u + (-2*a*x_3 - 4*b)*v
        + (a^2 - 4*b*x_3)
      independently_derived:
        monomial_count: 9
        total_degree_in_alpha_beta_variables: 4
        bihomogeneous_pair_degree: [2, 2]
        numerator_exponent_bidegrees_present:
          - [0, 0]
          - [0, 1]
          - [0, 2]
          - [1, 0]
          - [1, 1]
          - [1, 2]
          - [2, 0]
          - [2, 1]
          - [2, 2]
        coefficients:
          - bidegree: [2, 2]
            homogenised_monomial: alpha_1^2*alpha_2^2
            coefficient: '1'
          - bidegree: [2, 1]
            homogenised_monomial: alpha_1^2*alpha_2*beta_2
            coefficient: '-2*x_3'
          - bidegree: [2, 0]
            homogenised_monomial: alpha_1^2*beta_2^2
            coefficient: 'x_3^2'
          - bidegree: [1, 2]
            homogenised_monomial: alpha_1*beta_1*alpha_2^2
            coefficient: '-2*x_3'
          - bidegree: [1, 1]
            homogenised_monomial: alpha_1*beta_1*alpha_2*beta_2
            coefficient: '-2*a - 2*x_3^2'
          - bidegree: [1, 0]
            homogenised_monomial: alpha_1*beta_1*beta_2^2
            coefficient: '-2*a*x_3 - 4*b'
          - bidegree: [0, 2]
            homogenised_monomial: beta_1^2*alpha_2^2
            coefficient: 'x_3^2'
          - bidegree: [0, 1]
            homogenised_monomial: beta_1^2*alpha_2*beta_2
            coefficient: '-2*a*x_3 - 4*b'
          - bidegree: [0, 0]
            homogenised_monomial: beta_1^2*beta_2^2
            coefficient: 'a^2 - 4*b*x_3'
      comparison_with_frozen_preregistration:
        comparison_source: experiments/EXP-ECDLP-1bef8f/specification.yaml
        comparison_source_location: experiment.inputs.stage0_anchors.c_monomial_support
        comparison_normalization: >-
          Algebraic normalization only: implicit products in the frozen strings
          (for example -2a and -4b) were rendered with explicit multiplication
          signs (-2*a and -4*b). No coefficient was otherwise transformed.
        monomial_count_exact_match: true
        total_degree_exact_match: true
        bidegrees_exact_match: true
        coefficients:
          - bidegree: [2, 2]
            derived: '1'
            frozen: '1'
            exact_match: true
          - bidegree: [2, 1]
            derived: '-2*x_3'
            frozen: '-2*x_3'
            exact_match: true
          - bidegree: [1, 2]
            derived: '-2*x_3'
            frozen: '-2*x_3'
            exact_match: true
          - bidegree: [1, 1]
            derived: '-2*a - 2*x_3^2'
            frozen: '-2*a - 2*x_3^2'
            exact_match: true
