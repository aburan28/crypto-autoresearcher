  joints:
    - joint: J1_relation_condition_two_directional
      verdict: holds
      attack_executed: >-
        Rebuilt y^2=x^3+3x+5 over F_101 from a square table, enumerated all
        57^3=185193 ordered x-triples in an x3-descending/x1-ascending/
        x2-descending order, evaluated f_3 from the elementary symmetric
        functions, and separately decided realisability by affine point
        arithmetic over every y-sign choice.
      recomputation:
        curve_order_including_identity: 115
        affine_points: 114
        on_curve_x_values: 57
        realisable_ordered_x_triples: 6441
        f3_vanishing_ordered_x_triples: 6441
        realisable_but_not_vanishing_false_negatives: 0
        vanishing_but_not_realisable_false_positives: 0
        ordered_realisable_with_repeated_x: 171
        ordered_realisable_all_distinct: 6270
        unordered_realisable_x_multisets: 1102
        unordered_pattern_counts:
          all_distinct: 1045
          exactly_two_equal: 57
          all_three_equal: 0
        ordered_count_reconstructed_from_unordered_orbits: 6441
      discrepancy: null

    - joint: J2_box_counts_and_base
      verdict: holds
      attack_executed: >-
        Reimplemented the declared height without importing or executing the
        producer: for every x and every beta in 1..H, reduce x*beta to the
        symmetric interval and exhaustively minimize max(|alpha|,beta). This is
        a brute-force tiny-p check and cannot reproduce a continued-fraction
        bug.
      recomputation:
        box_sizes_by_H:
          4: 23
          5: 39
          6: 47
          9: 111
          10: 127
        c_H_by_H:
          4: {exact: 23/16, decimal_3dp: '1.438'}
          5: {exact: 39/25, decimal_3dp: '1.560'}
          6: {exact: 47/36, decimal_3dp: '1.306'}
          9: {exact: 37/27, decimal_3dp: '1.370'}
          10: {exact: 127/100, decimal_3dp: '1.270'}
        curve_order_including_identity: 9851
        n_is_prime: true
        n_not_equal_p: true
        discriminant_expression_mod_p: 1158
        nonsingular: true
        on_curve_x_values_in_height_box: 69
        base_points: 138
        on_curve_x_list_exactly_matches_frozen_manifest: true
      convention_controls:
        signed_beta_with_absolute_norm_counts: [23, 39, 47, 111, 127]
        signed_beta_deltas_from_declared: [0, 0, 0, 0, 0]
        least_nonnegative_alpha_counts: [12, 20, 24, 56, 64]
        least_nonnegative_alpha_deltas_from_declared: [-11, -19, -23, -55, -63]
        note: >-
          Under the mathematically symmetric norm max(|alpha|,|beta|), allowing
          negative beta cannot move the residue set: (alpha,beta) and
          (-alpha,-beta) represent the same x. The review plan's suggestion
          that negative beta should move counts is therefore not borne out.
          Replacing symmetric alpha reduction by least-nonnegative reduction
          does move the counts by the expected order-one amount.
      discrepancy: null

    - joint: J3_pinning_anchor_and_identity
      verdict: breaks
      attack_executed: >-
        Recomputed H^4/p and B^2/n from exact integers, checked c(O)=B from the
        independent J4 convolution, then compared H^(2m) directly with
        n/c_H^m for m=2 and m=3 using the measured c_H=127/100. Also evaluated
        the literal KF-1 sequence n/c_H^m for m=2..8.
      anchor_subchecks_that_hold:
        H_to_4: 10000
        H_to_4_over_p_exact: 10000/10007
        H_to_4_over_p_decimal_5dp: '0.99930'
        B_squared_over_n_exact: 19044/9851
        B_squared_over_n_decimal_4dp: '1.9332'
        c_of_identity: 138
        B: 138
        c_of_identity_equals_B: true
      breaking_recomputation:
        declared_c_H: 127/100
        m2:
          H_to_2m: 10000
          n_over_c_H_pow_m: 98510000/16129
          ratio_left_over_right: 16129/9851
          ratio_decimal_6dp: '1.637296'
          equal: false
        m3:
          H_to_2m: 1000000
          n_over_c_H_pow_m: 9851000000/2048383
          ratio_left_over_right: 2048383/9851
          ratio_decimal_6dp: '207.936555'
          equal: false
        literal_KF1_product_strictly_falls_for_m_2_through_8: true
        successive_ratio_P_m_over_P_m_plus_1: 127/100
      producer_control_defect: >-
        known_false_kf1 receives the field-element box size 127 and sets
        c_H=127/100. Its `identity_holds` check computes
        `(n/c_H^m)*c_H^m == n`, a tautology; it never compares H^(2m) with
        n/c_H^m. The run then labels this as verification of
        H^(2m)=n/c_H^m. At the frozen cell those sides are unequal at both
        requested arities. The literal finite claim frozen as KF-1, “the product
        of the unknown bounds FALLS with arity m,” is true for the producer's
        own sequence because c_H>1. The producer instead rejects a different,
        asymptotic statement—fall of the formal exponent of n—which the frozen
        KF-1 wording did not state.
      scope_of_break: >-
        A Stage 0 fixture/procedure defect only. The conditional asymptotic
        identity follows algebraically when the density premise B^m=n is
        imposed and H is selected separately for each m; this fixed-H toy cell
        does not satisfy that premise exactly and cannot validate it across
        m=2 and m=3. This is not evidence about gamma_m, the height-box lane,
        coverage, or ECDLP.

    - joint: J4_dispersion_cell_and_matched_null
      verdict: holds
      attack_executed: >-
        Indexed all 9851 group elements by repeated affine addition of
        G=(2,5425), derived the 138-point base from the independent J2 height
        scan, convolved all 138^2 ordered index pairs, and independently
        regenerated 60 sequential random.Random(20260913) samples of 69
        ascending-universe on-curve x-values with both points per x.
      recomputation:
        indexed_group_size: 9851
        indexed_affine_set_equals_independently_enumerated_curve: true
        box:
          total_ordered_pairs: 19044
          mean_exact: 19044/9851
          mean_decimal_4dp: '1.9332'
          variance_exact: 541706970/97042201
          variance_decimal_4dp: '5.5822'
          dispersion_exact: 90284495/31267074
          dispersion_decimal_4dp: '2.8875'
          unreachable_targets: 3704
          max_count: 138
          c_of_identity: 138
          producer_count_vector_exact_match: true
        matched_null:
          seed: 20260913
          draws: 60
          x_universe_size: 4925
          x_set_size_each: 69
          point_base_size_each: 138
          every_draw_negation_closed: true
          every_draw_size_138: true
          every_draw_mean_exactly_B_squared_over_n: true
          all_60_producer_count_vectors_exact_match: true
          mean_dispersion_exact: 683876722/234503055
          mean_dispersion_decimal_4dp: '2.9163'
          minimum_dispersion_decimal_4dp: '2.7628'
          maximum_dispersion_decimal_4dp: '3.1316'
          mean_unreachable_exact: 11137/3
          mean_unreachable_decimal_1dp: '3712.3'
      discrepancy: null

