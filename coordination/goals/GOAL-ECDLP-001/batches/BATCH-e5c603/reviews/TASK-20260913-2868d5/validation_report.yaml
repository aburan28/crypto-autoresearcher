  verdict: invalid
  verdict_basis: >-
    J1, J2, and J4 hold, but J3 breaks. KF-1 is a required Stage 0
    known-false/proves-too-much control. The producer never tests
    H^(2m)=n/c_H^m, the requested exact comparisons fail at m=2 and m=3, and
    the literal frozen product sequence falls rather than not falling. A failed
    required known-false control makes completed_valid inadmissible under the
    frozen stopping rules. This verdict is confined to Stage 0 fixture and
    procedure validity.

  limitations:
    - >-
      This report owns only J1-J4. It gives no verdict on J5-J8 and no
      whole-claim verdict; the Coordinator composes the round.
    - >-
      independent_session is false. The disclosed header-only sibling exposure
      additionally prevents treating this report as mutually blind.
