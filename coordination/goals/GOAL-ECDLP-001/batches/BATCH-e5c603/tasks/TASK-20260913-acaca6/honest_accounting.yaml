depth_of_verified_structure: >-
  No new theorem. What is verified in-session is only the algebraic
  design of four Stage-0 identities on the frozen F_19 curve
  y^2=x^3+x-1, P=(2,3), [2]P=(16,11), independently recomputed:
  chi_2(2)=2^9≡18, chi_2(16)=16^9≡1; (x mod 4, x' mod 4)=(2, 0);
  lambda(P)=18, lambda([2]P)=3, 18^2-4≡16, and [4]P from lambda'=3
  is (15, 11); S=2+3=5, S'=16+11≡8. Nearby-object Q=(1,1) is
  on-curve and [2]Q=(2,16) with chi_2 pair (1, 18). Those are
  derivation-tier designs, not run records. Trichotomy and Theorem C
  are cited from internal records (IDEA-20260806-c5d183,
  KN-FIND-ffe1df), not re-proved here.

