    representation: R1 affine x then quadratic character
    sigma: '{[2]}'
    trichotomy: coordinate-dependent
    lossy_projection_test: >-
      Discards y and the magnitude of x beyond its quadratic class.
      Alphabet size 2 on F_p^* (plus the zero fibre). Compatible with
      Sigma as a well-defined character of x'; unary closure is the
      open bit. Filed as IDEA-20260913-d76b38.
    survival: >-
      Well-defined for odd p and x != 0. Dissolves if replaced by a
      pairing / F4 map. On the frozen P the pair coincides with
      chi_2(y); Q=(1,1) separates them.
    genuinely_new_or_repackaging: >-
      Sketch, not a taxonomy (KN-OPEN-019 still open). 84755b P2 and
      ffe1df family C are the translation-side neighbors.
  - name: two low bits of the {0,...,p-1} lift of x
    representation: R1 digit
    sigma: '{[2]}'
    trichotomy: coordinate-dependent
    lossy_projection_test: >-
      Discards y and high bits of x_Z. Alphabet size 4. Filed as
      IDEA-20260913-6011b8.
    survival: Well-defined on a complete residue system; dissolves if the lift convention changes.
    genuinely_new_or_repackaging: >-
      Not fa01b7 (y-bits, {[2]}) and not 84755b P5 (x-bits, translation).
  - name: affine doubling slope lambda = (3x^2+A)/(2y)
    representation: R1 affine rational function
    sigma: '{[2]}'
    trichotomy: coordinate-dependent
    lossy_projection_test: >-
      Discards the point except the tangent slope. Lossy (finite fibres
      of a non-constant rational function). Compatible with Sigma as
      lambda' computed from [2]P. Filed as IDEA-20260913-4efec0.
    survival: >-
      Survives as a well-defined chart scalar away from 2-torsion.
      Dissolves as a group-element invariant under PGL_2. Unary
      closure is the open bit.
    genuinely_new_or_repackaging: >-
      Not 768066 (Jacobian det, different scalar). Not 2dd68d
      (constructed slope=1 fixture).
  - name: affine sum S = x+y
    representation: R1 affine (x, y)
    sigma: '{[2]}'
    trichotomy: coordinate-dependent
    lossy_projection_test: >-
      Discards the difference y-x. Retaining only S (not the pair
