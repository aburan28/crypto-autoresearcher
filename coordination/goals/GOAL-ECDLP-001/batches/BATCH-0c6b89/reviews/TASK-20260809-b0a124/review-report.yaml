      blocking_residual: >-
        Eight still-used payload layouts are not normatively inherited or
        restated, the objective inheritance path does not exist, and PROVRC02
        serializes only seven of nine blocking controls.
    - id: REV-RESOURCE-CONSUMER-009
      disposition: not_closed
      confirmed_progress: >-
        Sorts, endpoints, index comparison/consumption, cluster-rank comparison,
        gap storage, package writes, rereads, and displayed arithmetic are charged.
      blocking_residual: >-
        C7/C8 lack a complete producer-consumer-attester path and S7 actual
        resource measurements lack an outer artifact binding.
    - id: REV-PACKAGE-FINALIZATION-010
      disposition: not_closed
      confirmed_progress: >-
        S4-through-S7 is acyclic, S6 rereads every immutable package file, and
        FINALR03 is external and later hash-bound.
      blocking_residual: >-
        The external layer retains neither C8's verdict nor S7's actual cap
        measurements, so final success binding is incomplete.
    - id: REV-MUTATION-LAYER-011
      disposition: closed_at_exact_fixture_scope
      confirmed_repair: >-
        All eight records, four pairs, paths, ordinals, offsets, spans, bytes,
        hashes, retained/rebound digests, parser semantics, precedence, and
        expected first errors recompute.

  new_findings:
    - id: REV-NORMATIVE-SCHEMAS-012
      severity: critical
      blocking: true
      title: Complete replacement drops eight live payload schemas
      evidence: >-
        canonical_binary_contract is declared a complete replacement but does
        not redeclare eight v2 schemas still named by artifact rows.
      repair_action: >-
        Make inheritance granular or restate every used payload schema in full.
    - id: REV-OBJECTIVE-PATH-013
      severity: critical
      blocking: true
      title: Declared objective inheritance path does not exist
      evidence: >-
        The successor names estimators.fixed_aggregated_binomial_objective;
        the predecessor defines the objective under estimators.marginal_gamma.
      repair_action: >-
        Bind the actual predecessor path or restate the complete objective and solver.
    - id: REV-INTERVAL-POPULATION-014
      severity: critical
      blocking: true
      title: Production interval bytes are not uniquely populated
      evidence: >-
        Outward dyadic conversion and complete per-kind field population are
        absent, including mixed source precision for gap records.
      repair_action: >-
        Specify unique dyadic quantization and every GAPINT03 field by record kind.
    - id: REV-CONTROL-ATTESTATION-015
      severity: critical
      blocking: true
      title: Nine blocking controls have only seven serialized verdicts
      evidence: >-
        PROVRC02 and S4 capture C0-C6; FINALR03 retains neither C7 nor C8.
      repair_action: >-
        Serialize and charge all C0-C8 verdicts with C8 in an acyclic external layer.
    - id: REV-S7-RESOURCE-BINDING-016
      severity: major
      blocking: true
      title: S7 actual resource caps have no acyclic receipt
      evidence: >-
        FINALR03 ends at S6 and the later snapshot records no S7 actual values
        or cap verdict.
      repair_action: >-
