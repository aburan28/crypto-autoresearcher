    The immutable snapshot and Git bindings are valid. Seed, population,
    arithmetic, S/M alias truth, static fixtures, mutation corpus, displayed
    geometry and resource arithmetic, and causal stage ordering recompute.
    The design is nevertheless not ready: eight live schemas are no longer
    normative under its own replacement rule; the named objective path does
    not exist; adaptive refinement does not uniquely determine production
    interval bytes; only seven of nine blocking controls have serialized and
    charged verdicts; and S7 actual caps have no outer binding. These are
    repairable specification defects, so the verdict is REVISE rather than
    NO-GO. They are not mathematical, cryptanalytic, or ECDLP evidence.

  narrowest_supported_statement: >-
    EXP-ECDLP-b16990 is a claim-safe apparatus-only successor whose reviewed
    snapshot, seed and planted population, exact arithmetic, one-channel S/M
    alias boundary, static byte fixtures, mutation corpus, displayed geometry
    and resource arithmetic, and causal finalization ordering are internally
    consistent. It does not determine one unique end-to-end package. Nothing
    reviewed establishes implementation correctness, execution readiness, an
    elliptic-curve phenomenon, ECDLP evidence, an attack, speedup, security
    impact, asymptotic improvement, cryptographic-scale result, scientific
    transition, closure, or breakthrough.

