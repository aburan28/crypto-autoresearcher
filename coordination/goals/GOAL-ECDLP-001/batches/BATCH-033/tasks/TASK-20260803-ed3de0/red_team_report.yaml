    consequence: >-
      EV/DEC prose that cites only the branch id can overclaim HEUR-DS-1 support
      despite forbids_reading_as.
    required_control: >-
      Coordinator evidence/decision must quote instrument_pass_at_toy_cells_only
      and HEUR_DS_1_validated=false; refuse validated/supported/discharged language.
  - id: RTed3de0-2
    severity: INFO
    title: GATE discrimination is integrity-minimal; TAIL limb unplanted
    finding: >-
      GATE-TAIL-NONVACUOUS equates 'discriminating' with thr_TAIL>0 and at least
      one positive tau_r. CTRL-PLANT-B4 (D_plant≫thr_KS; delta_4≫thr_RATE_4) does
      not require tau_plant>thr_TAIL. Mid-band TAIL alternative-power is therefore
      untested by the plant positive control.
    consequence: >-
      'TAIL-pass' must not be narrated as demonstrated deep-smooth power; only as
      non-rejection of |T_real−T_ref| under the measured mid-band-mean null.
    required_control: >-
      EV prose must not claim TAIL power beyond GATE integrity + observed non-rejection.
      Optional successor: plant a mid-band-mean shift and require tau>thr_TAIL.
  - id: RTed3de0-3
    severity: INFO
    title: Mid-band escape residual is scope/power, not vacuity failure
    finding: >-
      Full-eligible-set mid-band mean produced thr_TAIL>0 as designed. The statistic
      is no longer a deep-extreme probe. FB-census ENC-B/Bfb=512 remains not the
      HEUR-DS-1 uniform-random-target statement.
    consequence: >-
      Non-rejection at toy FB-census cells cannot discharge HEUR-DS-1 (contract
      already states this).
    required_control: Retain HEUR_DS_1_anti_promotion through EV/DEC; no G1–G4 movement.
