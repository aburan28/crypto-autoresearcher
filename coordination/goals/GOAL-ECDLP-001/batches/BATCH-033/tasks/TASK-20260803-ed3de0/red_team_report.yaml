    Q1_thr_TAIL_truly_nonvacuous_discriminating: >-
      YES at GATE-TAIL-NONVACUOUS integrity level. thr_TAIL≈6.3e-4 both cells;
      tau cloud fully positive and spread; reject rule non-vacuous. Residual:
      GATE 'discriminating' is integrity-minimal (thr>0 ∧ ∃tau_r>0), not a power
      proof against alternatives. CTRL-PLANT-B4 rejects via KS∧RATE4 only and does
      not exercise the TAIL limb — so TAIL alternative-power remains unplanted.
      That residual does NOT restore thr_TAIL≡0 vacuity.
    Q2_M_SUPPORT_overreadable_as_HEUR_despite_antipromotion: >-
      YES as citation/language hazard (branch id still M-SUPPORT). NO as a silent
      package false positive: anti-promotion fields and forbids_reading_as are
      present and HEUR_DS_1_validated=false. Coordinator EV/DEC must quote
      instrument_pass_at_toy_cells_only and must not promote HEUR-DS-1.
    Q3_midband_escape_failure_residual: >-
      Escape did not fail. Residual = scope/power (bulk mid-band mean ≠ deep
      extreme) + carry-over FB-census≠URT (RT411037-M2) + i.i.d.-null vs shared-vertex
      dependence (RT411037-M1). Not a vacuity recurrence.
    Q4_interpretation_may_proceed_for_support_language: >-
      support_language_may_proceed=false; heur_ds_1_promotion_may_proceed=false;
      interpretation_may_proceed=true only as instrument_pass_at_toy_cells_only.
