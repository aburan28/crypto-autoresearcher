schema_version: "1.0"
red_team_report:
  id: RT-20260802-215
  task_id: TASK-20260802-215
  role: red-team
  verdict: REVISE
  claim_under_review: >-
    TASK-213's scoped ordinary generic-group nonlinear-acquisition barrier,
    certificate and expected-cost argument, typed graded-tower escape theorem,
    Cheon composition, and six-row Pareto comparison.

  immutable_snapshot:
    commit: 7516d91c156a662aed73c4acc6bb17a088c70370
    parent: 59b50c5c2594b7b9ab7343feef9a8c23416f68d5
    source_blobs_verified: true
    sources:
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-033/tasks/TASK-20260802-213/ordinary-acquisition-analysis.md
        sha256: 74138505d7f92b4a194ab9bbd42ee00ac20b2e926191334bd927620c3ce128e3
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-033/tasks/TASK-20260802-213/proof-obligations.yaml
        sha256: 509eea888f8bcd0ccb49c61ca50a69ccfbf4d190f767ea83f27f90d377555308
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-033/tasks/TASK-20260802-213/escape-interfaces.yaml
        sha256: 3491898539f1c403f64eeff5c45b8ec9d3e5797777065c2122b5602e05672a62
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-033/tasks/TASK-20260802-213/pareto-frontier.yaml
        sha256: befc5c2006c36ab595c82cc8af21d3962d98aac493e542c2ede8d82b09df1545
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-033/tasks/TASK-20260802-213/provenance.yaml
        sha256: 979c9c4586c556b36d611112e28d398f16fa5a38248c8376151eb29b406afd7f
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-033/archives/TASK-20260802-214/snapshot_commit_receipt.json
        sha256: 9fd3e277d58c1dd86027be61143803ba39dc9bdf8c5eda704e83f94cf8e597fa

  baseline_comparison:
    ordinary_pollard:
      input: "G, alpha*G"
      expected_time_exp: 1/2
      memory_exp: 0
    cheon_prior_art:
      input: "G, alpha*G, alpha^d*G"
      source: "https://www.iacr.org/archive/pkc2012/72930594/72930594.pdf"
      time: "O(sqrt((r-1)/d)+sqrt(d))"
      time_exp: "chi(delta)=max((1-delta)/2,delta/2)"
      balanced_time_exp: 1/4
      novelty_claim: none
    reconstructed_ordinary_composition: >-
      A repaired producer-output bound forces single-instance ordinary generic
      acquisition work exponent at least 1/2, so adding Cheon's downstream
      cost supplies no ordinary generic time-exponent gain.

  objections:
    - id: RT-215-C1
      severity: critical
      title: certificate_verifier_collision_omission
      affected_claims:
        - ordinary-acquisition-analysis.md#lemma-6-certificate-bearing-lower-bound
        - proof-obligations.yaml#PO-213-08
        - "Pr[accepted correct] <= B(P,L)/(r-1)+epsilon_s"
        - "exp(C_acquire) >= 1/2 as derived from Lemma 6"
      finding: >-
        The proof couples verifier decisions without including verifier-created
        generic labels and collisions in B(P,L). If L includes verifier work,
        the conclusion is about combined producer-plus-verifier work, not
        acquisition alone; if it excludes that work, the lemma is false.
      counterexample: >-
        A collision-free producer outputs R=G and a trivial certificate. A
        deterministic ordinary-generic BSGS verifier recovers z=dlog_G(Q) and
        accepts iff R=z^d*G. It is perfectly sound and accepts for the d inputs
        alpha^d=1, although the producer had no informative collision. With
        P=0,L=1, actual accepted-correct probability d/(r-1) exceeds the
        claimed 1/(r-1) bound for d>1.
      cheapest_repair: >-
        Derive producer acquisition from Lemma 5. Alternatively include every
        verifier label, query, comparison, certificate symbol and random coin,
        and weaken the lemma to a combined-work lower bound.

    - id: RT-215-C2
      severity: major
      title: adaptive_coupling_requires_fixed_symbolic_game
      finding: >-
        Successive conditioning removes alpha values, so saying each later
        equality excludes one still-unconditioned alpha does not by itself give
        denominator r-1. Fix algorithm and lazy-sampling randomness first,
        obtain an alpha-independent symbolic transcript, and union its roots.
      required_scope:
        - raw_encoding_string_branches
        - encoding_dependent_alpha_independent_preprocessing
        - arbitrary_certificate_scalars_and_handles
        - verifier_randomness_and_oracle_responses

    - id: RT-215-C3
      severity: major
      title: preprocessing_tradeoff_drops_additive_terms
      finding: >-
        From L<=q_g+1 the exact relation is
        P*(q_g+1)+(q_g+1)^2=Omega(N), not P*q_g+q_g^2=Omega(N) when
        q_g may be zero.
      single_instance_consequence: "P+q_g+1=Omega(sqrt(N))"
      repair: >-
        Define q as online labels including Q, or retain q_g+1. Separately
        charge comparisons, handle access, construction, P/K, and peak memory.

    - id: RT-215-C4
      severity: major
      title: output_and_certificate_channel_underspecified
      finding: >-
        Lemma 5 silently requires an oracle-issued output handle. If arbitrary
        raw strings may be output, add an encoding-guess term depending on
        lambda. Charge certificate scalar/handle count, bit length, accesses,
        generation and verification.

    - id: RT-215-C5
      severity: major
      title: graded_tower_cost_premise_incomplete
      finding: >-
        O(log d) map calls is correctly typed but hides uniform map-family
        description, level materialization, setup-law certification, H_d group
        operations needed by Cheon, order/factorization data, certificate
        length, soundness error, inverse success, memory and data movement.
      boundary: >-
        Theta(d) explicit setup at balanced d has exponent 1/2, but level d
        alone does not prove such a lower bound against a uniform succinct
        family.

    - id: RT-215-C6
      severity: major
      title: pareto_fields_violate_declared_dominance_rule
      finding: >-
        PF-213-02 has no strict listed advantage for Pollard and is a tie under
        the stated exponent rule. PF-213-05 and PF-213-06 require piecewise
        dominance. Numeric zero is not the candidate-minus-baseline delta for
        rows inadmissible to ordinary input; use not_applicable.

  required_controls:
    - id: RTC-215-01
      name: fixed_symbolic_transcript_audit
      action: >-
        Fix producer coins and lazy strings before alpha; enumerate every
        distinct affine collision root and the output agreement roots.
      execution: proof_only_not_run
    - id: RTC-215-02
      name: verifier_work_inclusion_mutation
      action: >-
        Apply the R=G plus exact generic-DLP verifier counterexample, then add
        verifier labels and confirm that only the combined-work claim survives.
      execution: proof_only_not_run
    - id: RTC-215-03
      name: preprocessing_zero_query_boundary
      action: >-
        Set q_g=0 and retain Q as one online label; verify the P additive term
        and all comparison/access costs.
      execution: proof_only_not_run
    - id: RTC-215-04
      name: tower_description_access_audit
      action: >-
        Materialize a byte-and-primitive cost ledger for the exact addition
        chain levels, map descriptions, H_d operations, certificate and setup.
      execution: proof_only_not_run
    - id: RTC-215-05
      name: piecewise_pareto_recompute
      action: >-
        Recompute every row under the artifact's listed dimensions, treating
        interface assumptions as a partial order and inadmissible deltas as
        not_applicable.
      execution: proof_only_not_run

  counterexample_or_mutation:
    cheapest: RT-215-C1
    implementation_required: false
    experiment_required: false
    description: >-
      Use producer R=G and a perfectly sound ordinary-generic BSGS verifier.
      This immediately distinguishes acquisition-transcript collision freedom
      from combined-transcript collision freedom.

  reconstruction:
    affine_labels: pass_with_formalization_repair
    rho_f:
      result: "rho_(X^d)=d when d divides r-1"
      nonvacuity: "d=o(N) for fixed 0<delta<1"
    corrected_output_bound: >-
      Pr[R=f(alpha)G] <= ((P+1)L+binom(L,2)+rho_f)/(r-1), subject
      to an oracle-issued-output convention or an added encoding-guess term.
    corrected_preprocessing_tradeoff: >-
      P*(q_g+1)+(q_g+1)^2=Omega(N) for constant producer correctness.
    expected_cost: >-
      Las Vegas truncation is valid; retries must include recognition,
      certificate and verification cost times inverse success.
    graded_tower_queries: "at most 2*ell(d)+ell(d-1)+1=O(log d)"
    graded_tower_typing: pass_conditionally_on_interface_axioms
    concrete_tower_instantiation: not_supplied

  heuristic_challenges:
    - >-
      No empirical or random-model heuristic supports the ordinary bound; it
      is intended as a proof inside a declared random-encoding model.
    - >-
      Existence and sub-rho cost of a concrete graded tower remain unverified
      interface premises, not observations or supported heuristics.

  cost_model_challenges:
    - Charge verifier labels and collisions wherever soundness is used.
    - Charge certificate symbols, generation, reads and verification.
    - Preserve P, P/K, q_g, comparisons, memory and data as separate axes.
    - Parameterize the distinguished-point time/memory tradeoff for Cheon rho.
    - Charge map-family description, setup, levels and H_d group operations.
    - Declare the cost or supplied status of multiplicative-order factor data.

  reduction_and_scope_challenges:
    - >-
      The Cheon baseline was confirmed as augmented-input prior art and gives
      no ordinary-input improvement without acquisition.
    - >-
      The ordinary result is only average-case over uniform nonzero alpha in
      the exact random-encoding generic model.
    - >-
      Coordinate structure, pairings, correspondences, leakage,
      alpha-dependent advice, quantum algorithms, and high-rho_f targets remain
      outside scope.
    - >-
      A conditional graded-tower oracle theorem is not a concrete ordinary
      elliptic-curve construction or a novelty claim.

  pareto_audit:
    PF-213-01: undominated_within_list
    PF-213-02: revise_to_tie_or_add_quantified_strict_dimension
    PF-213-03: undominated_conditional_row_but_ordinary_delta_not_applicable
    PF-213-04: dominated_by_PF-213-01
    PF-213-05: "piecewise: undominated if kappa_tower<1/2; otherwise Pollard dominates"
    PF-213-06: "piecewise: undominated if max(kappa_L,lambda/2)<1/2; otherwise Pollard dominates"
    global_frontier_claim: false

  narrowest_supported_statement: >-
    Subject to a formal fixed symbolic transcript and an oracle-issued-output
    convention, a constant-correctness producer for f(alpha)G with rho_f=o(N)
    in the declared ordinary generic model requires
    P*(q_g+1)+(q_g+1)^2=Omega(N); charging single-instance preprocessing gives
    work Omega(sqrt(N)). For f(X)=X^d with d|r-1 and fixed 0<delta<1,
    rho_f=d=o(N), so composing acquisition with known Cheon DLPwAI cannot beat
    ordinary time exponent 1/2. This is scoped known-style generic evidence,
    not novelty, closure, SOTA, or a non-generic impossibility result.

  next_concrete_action: >-
    Perform a proof-only repair replacing the acquisition use of Lemma 6 with
    Lemma 5, formalize the fixed symbolic game and q_g+1 tradeoff, then issue a
    new immutable snapshot for independent review. Separately specify a
    uniform concrete tower before any cost or Pareto claim about that escape.

  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-033/tasks/TASK-20260802-215/red-team-report.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-033/tasks/TASK-20260802-215/verdict.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-033/tasks/TASK-20260802-215/provenance.yaml

  experiment_execution: prohibited
  experiments_run: 0
  implementation_decision: none
  official_state_transition: none
  closure_claim: false
  support_claim: false
  sota_claim: false
  novelty_claim: false
  breakthrough_claim: false
