schema_version: "1.0"
task_id: TASK-20260802-213
artifact_kind: proof_obligations
experiment_execution: prohibited
official_state_change: false

theorem_scope:
  group:
    notation: G_group
    structure: cyclic_additive
    order: r
    order_condition: prime
    size_parameter: "N := r"
    scalar_field: F_r
  instance:
    orientation: "Q = alpha * G"
    alpha_distribution: uniform_over_F_r_nonzero
  target:
    primary: "R = alpha^d * G"
    d_conditions:
      - "d divides r-1"
      - "1 < d < r-1"
      - "d = N^(delta+o(1))"
      - "0 < delta < 1"
    generalized: "R = f(alpha) * G with rho_f = o(r)"
    affine_agreement: "rho_f := max_(a,b) #{x in F_r^*: f(x)=a+b*x}"
  conclusion_boundary: >-
    Constant-success, certificate-bearing acquisition in the declared ordinary
    generic model has charged single-instance work exponent at least 1/2.
    This does not cover a declared non-generic interface.

obligations:
  - id: PO-213-01
    name: exact_generic_model
    proposition: >-
      The random injection, equality behavior, ordinary operations,
      preprocessing classes, cost units, and excluded interfaces are stated
      without implicit coordinate access.
    disposition: discharged_in_payload
    support:
      - ordinary-acquisition-analysis.md#2-exact-ordinary-generic-group-model
    reviewer_check: >-
      Confirm that bit-string branching is handled by lazy sampling and no
      undeclared operation can multiply two hidden scalar coefficients.

  - id: PO-213-02
    name: formal_label_span
    proposition: >-
      Prior to an informative collision, every constructed point has formal
      scalar label a+bX.
    disposition: discharged_in_payload
    proof_method: induction_on_oracle_calls
    support:
      - ordinary-acquisition-analysis.md#lemma-1-formal-label-span
    falsifier: >-
      Exhibit an allowed ordinary operation whose output coefficient contains
      a product of two unknown-input coefficients.

  - id: PO-213-03
    name: unseen_encoding_distribution
    proposition: >-
      Conditioned on distinct formal labels remaining distinct after
      evaluation, fresh handles are uniformly distributed unused strings and
      the formal transcript couples across admissible alpha values.
    disposition: discharged_in_payload
    proof_method: lazy_sampling_of_random_injection
    support:
      - ordinary-acquisition-analysis.md#lemma-2-unseen-encoding-distribution
    reviewer_check: >-
      Audit adaptive branches on raw encoding strings and verify that the
      coupling preserves their distribution.

  - id: PO-213-04
    name: informative_collision_probability
    proposition: >-
      With P preprocessed constant handles and L online affine labels, the
      informative-collision probability is at most
      ((P+1)L + binom(L,2))/(r-1).
    disposition: discharged_in_payload
    proof_method: deferred_decisions_and_union_bound
    support:
      - ordinary-acquisition-analysis.md#lemma-3-informative-collision-probability
    falsifier: >-
      Produce a distinct affine-label equality having more than one possible
      alpha, or an adaptive transcript not representable by the deferred
      decision coupling.

  - id: PO-213-05
    name: information_per_collision
    proposition: >-
      A collision between distinct affine labels either has no solution or
      reveals alpha exactly as (a'-a)/(b-b').
    disposition: discharged_in_payload
    support:
      - ordinary-acquisition-analysis.md#lemma-4-information-per-collision
    implication: >-
      Ordinary generic equality does not directly expose a multiplicative
      coset or a partial value alpha^d.

  - id: PO-213-06
    name: affine_agreement_bound
    proposition: >-
      For f(X)=X^d with d<r, every equation X^d=a+bX has at most d roots.
    disposition: discharged_in_payload
    proof_method: nonzero_polynomial_root_bound
    support:
      - ordinary-acquisition-analysis.md#1-scalar-orientation-and-parameters
    boundary: >-
      General equivalent nonlinear generators require an explicit rho_f
      bound; syntactic nonlinearity alone is insufficient.

  - id: PO-213-07
    name: uncertified_success_bound
    proposition: >-
      Uncertified correctness is at most
      (B(P,L)+rho_f)/(r-1), including accidental affine agreement.
    disposition: discharged_in_payload
    support:
      - ordinary-acquisition-analysis.md#lemma-5-uncertified-nonlinear-output-bound
    control: CTRL-213-04
    warning: >-
      Accidental correctness is not recognizable success and cannot be
      converted into Las Vegas acquisition without a verifier.

  - id: PO-213-08
    name: certificate_soundness_barrier
    proposition: >-
      Under instance-wise perfect soundness, a collision-free coupled
      transcript cannot carry an accepted certificate for a target with
      rho_f=o(r); with soundness error epsilon_s, add epsilon_s.
    disposition: candidate_proof_requires_independent_review
    support:
      - ordinary-acquisition-analysis.md#lemma-6-certificate-bearing-lower-bound
    exact_nonvacuity_condition: "B(P,L)+rho_f < r-1"
    cheapest_repair: >-
      Formalize the coupling as a standard generic-group game hop and prove
      the statistical-soundness variant with all verifier randomness exposed.
    falsifier: >-
      Give an ordinary generic verifier that distinguishes two collision-free
      coupled alpha instances while receiving the same formal transcript and
      lazy-sampled handles.

  - id: PO-213-09
    name: time_preprocessing_tradeoff
    proposition: >-
      Constant certified success requires P*q+q^2=Omega(r); when preprocessing
      is charged to one instance, P+q=Omega(sqrt(r)).
    disposition: derived_from_PO_213_04_and_PO_213_08
    support:
      - ordinary-acquisition-analysis.md#lemma-6-certificate-bearing-lower-bound
    cost_axes:
      preprocessing: P
      online_queries: q
      stored_data: P
      amortization_instances: K
    boundary: >-
      The theorem gives no positive polynomial memory lower bound and does not
      treat group-specific preprocessing as free.

  - id: PO-213-10
    name: expected_work
    proposition: >-
      Truncation converts a Las Vegas expected-work acquisition into a
      bounded-work constant-success algorithm, yielding expected work
      Omega(sqrt(r)).
    disposition: discharged_in_payload
    support:
      - ordinary-acquisition-analysis.md#lemma-7-expected-work-and-inverse-success-accounting

  - id: PO-213-11
    name: cheon_composition
    proposition: >-
      Restoring acquisition gives total exponent at least 1/2 even though the
      known auxiliary-input downstream exponent is
      max((1-delta)/2,delta/2), minimized at 1/4.
    disposition: discharged_in_payload
    support:
      - ordinary-acquisition-analysis.md#4-composition-with-the-known-cheon-baseline
    prior_art:
      title: "Cheon DLP with auxiliary input implementation paper"
      url: "https://www.iacr.org/archive/pkc2012/72930594/72930594.pdf"
    novelty_claim: none

  - id: PO-213-12
    name: graded_tower_typing
    proposition: >-
      A tower e_(i,j):H_i x H_j -> H_(i+j) with scalar action
      e(xT_i,yT_j)=xyT_(i+j) constructs T_d, alpha*T_d, and
      alpha^d*T_d in the same order-r group H_d.
    disposition: discharged_conditionally_on_interface_axioms
    support:
      - ordinary-acquisition-analysis.md#5-typed-non-generic-escape-theorem
    certificate: recomputable_addition_chain_DAG
    does_not_assume:
      - alpha
      - alpha^d_T_d

  - id: PO-213-13
    name: graded_tower_cost_inequality
    proposition: >-
      The conditional composition is strictly sub-rho exactly when
      max(kappa_tower, chi(delta)) < 1/2, after construction, amortization,
      map calls, parameter data, memory access, certification, and verification
      are charged.
    disposition: discharged_symbolically
    support:
      - ordinary-acquisition-analysis.md#5-typed-non-generic-escape-theorem
    unresolved_instantiation: >-
      No concrete ordinary elliptic-curve construction satisfying
      kappa_tower<1/2 is supplied or asserted.

  - id: PO-213-14
    name: exact_scope
    proposition: >-
      Coordinate structure, non-generic maps, leakage, quantum algorithms,
      alpha-dependent advice, and high-affine-agreement targets are excluded
      explicitly.
    disposition: discharged_in_payload
    support:
      - ordinary-acquisition-analysis.md#6-scope-and-excluded-interfaces

controls:
  - id: CTRL-213-01
    name: symbolic_affine_label_simulator
    execution: designed_not_run
    identical_shape: false
    input: ordinary_generic_query_DAG
    output: formal_pairs_a_b_and_collision_equations
    falsification_signal: a_permitted_operation_leaves_span_of_1_and_X

  - id: CTRL-213-02
    name: random_label_null
    execution: designed_not_run
    identical_shape: true
    preserves:
      - query_DAG
      - branch_structure
      - handle_allocation_shape
    destroys: affine_scalar_semantics
    falsification_signal: claimed_nonlinear_signal_survives_null

  - id: CTRL-213-03
    name: oracle_removal
    execution: designed_not_run
    identical_shape: true
    action: replace_each_non_generic_map_with_random_type_correct_map
    falsification_signal: escape_claim_survives_without_declared_scalar_action

  - id: CTRL-213-04
    name: fiber_and_inverse_success
    execution: designed_not_run
    checks:
      - rho_f
      - per_attempt_success
      - recognizability
      - inverse_success_factor
      - certificate_soundness_error
    falsification_signal: reported_cost_omits_any_item

  - id: CTRL-213-05
    name: type_and_orientation_audit
    execution: designed_not_run
    required_orientation: "Q = alpha * G"
    required_cheon_typing: all_three_points_in_one_order_r_group
    falsification_signal: scalar_orientation_flip_or_cross_group_tuple

  - id: CTRL-213-06
    name: full_composition_check
    execution: designed_not_run
    restores:
      - acquisition
      - preprocessing
      - amortization
      - oracle_construction
      - data_access
      - inverse_success
      - certificate
      - verification
      - downstream_solve
    falsification_signal: ordinary_total_exponent_computed_from_downstream_only

completion_assessment:
  outcome: scoped_negative_generic_barrier_with_conditional_escape
  positive_ordinary_generic_acquisition: not_derived
  scoped_barrier: candidate_proof_supplied
  non_generic_escape: typed_and_costed_but_uninstantiated
  closure_claim: false
  support_claim: false
  sota_claim: false
  experiment_claim: false
