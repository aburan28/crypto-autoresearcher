preprocessing_tradeoff:
  generic_certified_condition: "P*q + q^2 = Omega(N)"
  exponent_condition: "max(pi+beta,2*beta) >= 1"
  single_instance_total_exp_lower_bound: 1/2
  amortized_reporting_requirements:
    - total_preprocessing_P
    - number_of_instances_K
    - amortized_cost_P_over_K
    - online_queries_q
    - stored_data_P
    - memory
  ordinary_comparison_rule: >-
    Compare against a Pollard or baby-step/giant-step baseline granted the same
    preprocessing, amortization, memory, and data budget.

