  data_query_exp: 0
  success: constant_amplifiable
  certificate: scalar_alpha_checked_by_alpha_G_equals_Q
  input_assumption_rank: 0

delta_convention:
  formula: "candidate exponent minus ordinary baseline exponent"
  interpretation:
    negative: lower_exponent
    zero: no_exponent_change
    positive: higher_exponent
  ordinary_sota_rule: >-
    A row with an extra auxiliary point, oracle, leakage, uncharged
    preprocessing, or non-generic setup is not admissible as an ordinary SOTA
    improvement. Its ordinary-admissible delta is recorded as zero.

dominance_rule:
  dimensions:
    - ordinary_input_assumption
    - non_generic_interface_assumption
    - expected_time_exp
    - memory_exp
    - preprocessing_exp
    - data_query_exp
    - certificate_soundness
  definition: >-
    Row A dominates row B only if A is no worse on every listed dimension and
    strictly better on at least one. A stronger input or oracle assumption is
    worse and cannot dominate an ordinary-input row solely through lower time.
  scope: rows_listed_in_this_artifact_only
  global_sota_claim: false

