decision_summary:
  mechanism_considered: >-
    Ordinary generic operations preserve affine scalar labels. A certified
    nonlinear output therefore requires an informative affine collision unless
    a declared operation multiplies hidden scalar coefficients.
  ordinary_result: >-
    Candidate scoped proof gives constant-success certified acquisition work
    Omega(sqrt(r)), including charged preprocessing and inverse-success logic.
  escape_result: >-
    A graded bilinear tower is sufficient algebraically and produces a
    correctly typed same-group Cheon triple in O(log d) map calls, conditional
    on a succinct certified setup whose complete exponent is below 1/2.
  action_recommended: >-
    Snapshot these artifacts, independently review the adaptive certificate
    lemma, and red-team the graded-tower setup/data cost before any synthesis.
  responsible_role: idea-generator
  official_status_change: none

