idea:
  id: IDEA-20260913-fa01b7
  title: Two low bits of the integer lift of y under doubling
  class: representation
  claim: >-
    The two lowest bits of the unique integer representative of y(P) in
    {0,...,p-1} are an R1 digit projection. Paired with Sigma={[2]}, either
    (A) those two bits of y([2]P) are a function of the two bits of y(P)
    (unary closure on a 4-letter alphabet), or (B) modular reduction by p
    mixes higher digits and the object is branching, priced by (L, b).
    KN-FIND-ffe1df leaves y-based and digit-sum/popcount filters open as
    translation filters; this asks doubling-compatibility of a 2-bit y-lift,
    not translation-defect of x-bits (IDEA-20260817-84755b P5). Stage-0 is a
    frozen 2-bit residue identity. No exponent gain. Attack stage: collision
    structure.
  mechanism: >-
    Representation: R1 digit representation — the integer lift
    y_Z in {0,...,p-1} of the affine y-coordinate, then the 2-bit residue
    r(P) = y_Z mod 4. Operation set Sigma = {[2]}, then re-extract r([2]P).
    Trichotomy class: coordinate-dependent -- r depends on the choice of
    integer lift of an F_p element and is not a function of the group element
    (a different complete set of residues, or a PGL_2 change of the y-chart,
    changes r). One-line reason: low bits of a lift are a property of the
    representative, not of the class in E(F_p). R1 class. Attack stage:
    collision structure (cheap 2-bit predicate), not factor-base membership.

    LOSSY-PROJECTION TEST against Sigma={[2]}. What is discarded: x, the
    higher bits of y_Z, and all other models of the point. Lossy: the
    alphabet has size 4, so 1 < 4 < N for any cryptographic N and already
    for the toy N of a p=19 curve. Discard compatibility: doubling gives y'
    as a rational function of (x, y); reducing the lift of y' modulo 4 is
    well-defined. Whether r([2]P) is determined by r(P) alone is Outcome A
    versus B. If A, the four fibres (when nonempty) are a block system of
    <[2]> on the points where r is defined, and the open number is the cost
    of using a 2-bit label as an orbit canonicalizer (almost certainly
    useless as a quotient of size N/4, which Theorem C already forbids as a
    sum-compatible bucket; the remaining question is doubling-compatibility
    only). If B, measure (L, b) against identity, random 2-bit labels, and
    relabelled Z/NZ.

    Not IDEA-20260906-c37df9 (steal-listed): that is a target-blind mixture of
    fixed-weight carry transducers on scalar representations a+b = x, not
    bits of the point's y-coordinate. Not 84755b P5 (bottom bits of x under
    translation). Not nested LHW. No factor base (KN-OPEN-020 does not apply).
