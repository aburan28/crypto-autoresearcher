checks_passed:
  - item: immutable_snapshot_and_no_producer_mutation
    detail: >-
      The producer snapshot is reachable from reviewed HEAD, has the receipt's
      declared parent, changes exactly its twelve declared paths, and all
      eleven non-self producer SHA-256 values recompute exactly. HEAD adds only
      the dispatch queue; every declared producer blob is byte-identical from
      snapshot commit to reviewed HEAD.
  - item: canonical_pair_target_byte_contract
    detail: >-
      Both length-prefixed byte preimages, both SHA-256 digests, and the
      big-endian modular target reduction replay exactly for the frozen G01
      vector. The three artifact descriptions agree semantically and the
      manifest retains the required preimage, digest, order, and target fields.
  - item: source_random_paired_invariance
    detail: >-
      The source/random contract fixes p, subgroup order, pair seed/id/token,
      target, partition seed, stopping rule, and cost-model identity while
      allowing only the separate deterministic control stream. The manifest
      fail-closes a paired-target mismatch.
  - item: exact_walsh_and_signed_rank_contract
    detail: >-
      The exact rational Walsh, lower-median, threshold, stable-order, and
      legacy-substitution requirements are now schema-bound. The inherited
      signed-rank contract retains zero rows, exact tie rules, 256 explicit
      vectors, inclusive tails, and the exact p-numerator gate.
  - item: typed_map_closure_and_stabilizer_contract
    detail: >-
      The manifest and specification require duplicate-free typed generated-map
      closure, per-map field/formula/P-action/scalar/replay witnesses, total
      composition replay, independently recomputed group order, and fail-closed
      orbit/stabilizer witnesses with selected-map scalar binding.
  - item: calibration_and_control_contract
    detail: >-
      Eight registered calibration rows have 256 attempts with the inclusive
      0 through 255 interval, unavailable and detector-mismatch terminal
      invalid dispositions, retained receipts, no replacement, and exclusion
      from primary aggregation. Six variants across sixteen primary groups plus
      eight calibration rows reconcile exactly to 104 maximum runs.
  - item: baseline_fixture_exact_arithmetic
    detail: >-
      Exact recomputation of R(a,b)=(a+37b) mod 101 yields initial residue 0,
      transition residues 75, 11, and 14, and negation residues 0, 26, 90,
      and 87 with the frozen output tuples. The fixture explicitly rejects
      curve-point inference and remains a pre-compute fixture rather than
      empirical evidence.
  - item: charged_cost_contract
    detail: >-
      The exclusive counter vector names field, scalar, map, canonicalization,
      recovery, retry, setup, hashing, serialization, and memory work once;
      the validator must reject missing/non-integer/negative/overlapping or
      summary-mismatched counters before reading a comparison statistic.
  - item: proof_search_map_and_claim_ceiling
    detail: >-
      H-ECDLP-63eecd supplies baseline reproduction, observation collision,
      quantifier-order, and method-ceiling/nearby-control audits. The package
      states a finite constant-factor-only toy prediction, retains generic time
      exponent 1/2 and memory exponent 0, and limits direct work to p < 2^18;
      it licenses no target-class, exponent, security, or cryptographic-scale
      conclusion.
