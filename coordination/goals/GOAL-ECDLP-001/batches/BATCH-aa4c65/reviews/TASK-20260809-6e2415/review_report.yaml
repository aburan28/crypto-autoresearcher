toy_claim_boundaries:
  - This report is a design-admissibility review, not an ECDLP experiment or result.
  - The technical PASS findings validate frozen contracts and static replay only; they do not validate an implementation or a run.
  - No conclusion about a full-scale ECDLP attack, generic-exponent improvement, or cryptographic security follows.
  - A future run could support at most the declared p < 2^18 toy finite-family charged-work comparison, and only after immutable provenance repair, approval, freeze, implementation, execution, validation, and Coordinator disposition.
  - The NO-GO identifies a repairable evidence-chain defect only; it neither weakens nor rejects H-ECDLP-63eecd.
recommendation: >-
  Do not approve, freeze, implement, or dispatch EXP-ECDLP-1c12d3 from this
  snapshot. Preserve the reviewed bytes. The Coordinator should create and
  snapshot the narrowly scoped immutable provenance correction described in
  REV-6e2415-01, then obtain a fresh independent review-adversarial report
  before considering a separate approval/freeze decision.
