predecessor_finding_closure:
  - id: REV-7761cf-01
    result: PASS
    detail: >-
      v6 selects one canonical derivation. specification.yaml,
      seed_register.yaml, and instance_manifest.schema.yaml all prescribe
      PAIR-ID-v1 as length-prefixed UTF-8 tag, u32 seed, u32 pair-id length,
      UTF-8 pair id, and u32 field bits; then prescribe PAIR-TARGET-v1 as
      length-prefixed UTF-8 tag, raw 32-byte pair-token digest, and u32
      subgroup order. They all define target_x as
      1 + int(SHA-256(target_preimage), big-endian) mod (n-1). The seed
      register's group_id is explicitly the primary pair_id, so its G01 vector
      agrees field-for-field with the manifest vector after that declared name
      normalization.
    frozen_replay:
      seed: 101
      pair_id: G01
      field_bits: 12
      subgroup_order: 1009
      pair_token_preimage_hex: 0000000a504149522d49442d763100000065000000034730310000000c
      pair_token_sha256: 29656248d40cabdee13daa128018083de383dd650e9c3e6eaa32783b9f145594
      target_derivation_preimage_hex: 0000000e504149522d5441524745542d763129656248d40cabdee13daa128018083de383dd650e9c3e6eaa32783b9f145594000003f1
      target_derivation_sha256: 62c5111c589fe9db1e506d910863593bd202486c7564b88fcf6368779f698b1c
      target_x: 237
      replay_result: >-
        Independent byte construction, SHA-256 replay, big-endian reduction,
        and target-x calculation all exactly match the two frozen vectors.
    retained_manifest_fields:
      - pair_token_preimage
      - pair_token
      - pair_token_digest
      - target_x
      - target_derivation_preimage
      - target_derivation_digest
    source_random_equality: >-
      The specification fixes the same p, subgroup order, pair id/seed, pair
      token, target, partition seed, stopping rule, and cost model for the
      source/matched-random pair; the manifest validator rejects a mismatch in
      all paired target fields, and the cost model requires exact paired
      invariance. instance_id is expressly excluded from both derivations.
  - id: REV-7761cf-02
    result: PASS
    detail: >-
      comparison_artifact_schema now requires walsh_table_36 rather than the
      undefined legacy walsh_pairs_36 field. The table contract requires
      exactly 36 pair_index 0..35 rows in lexicographic (i,j) order for
      1 <= i <= j <= 8, reduced exact rational r_i*r_j numerator and
      denominator, and sorted_position after stable exact ascending ordering
      by product then pair_index. Independent enumeration has 36 pairs from
      (1,1) through (8,8). No output data exist yet; this is a static
      schema/validator closure check only.
    lower_median_and_effect_recheck: >-
      The validator must bind lower_median_index=18 to the row whose
      sorted_position is 18, recompute lower_median_squared and effect_pass
      from that row, and check the exact g_18^2 <= 81/100 threshold. The rule
      explicitly says no legacy Walsh field is accepted as a substitute.
    exact_signed_rank_recheck: >-
      The held-out order is [G09,G10,G11,G12,G13,G14,G15,G16], with exactly
      k=0..255 bit vectors, inclusive two-sided abs(T2_k) tail, and exact
      p_numerator threshold. Integer comparison verifies 6/256 <= 0.025 while
      7/256 > 0.025; zero rows, reciprocal-magnitude ties, doubled midranks,
      and every 256-table row remain required and validator-recomputed.
