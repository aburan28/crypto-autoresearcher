  interpretation:
    survives: >-
      The immutable data support a strong ordering for the exact frozen
      instrument: with-replacement Arm D is much more expensive per recovered
      canonical unique relation than Arm B in every q50 and q90 toy record,
      and this ordering remains after removing the kappa query charge from
      both arms in a static sensitivity calculation.
    does_not_survive: >-
      The snapshot does not show that the arms answer an equivalent
      algorithmic question, that kappa=1 is an end-to-end ECDLP cost, that the
      recovered relations supply independent rank, or that either arm solves
      an ECDLP. It therefore supports neither an exponent improvement nor a
      crypto-scale claim.

  objections:
    - id: RT-OBJ-001
      severity: critical
      category: algorithmic_equivalence
      objection: >-
        Arm B and Arm D do not have a frozen common information interface or
        common stopping rule. Arm B uses N queries and obtains full relation
        coverage, while D makes q*N uniform-key queries and obtains nominally
        partial coverage. If a source-conditioned lookup is available at the
        same price, D is dominated by construction; if it is unavailable,
        Arm B is not a feasible comparator. Normalizing by relation count does
        not repair this mismatch or equalize rank and solve probability.
      disposition: open_blocks_any_algorithmic_superiority_or_failure_claim
      evidence:
        - >-
          818be4a6064c79e1c0e0d1a9c000c276afd2b1fa:
          experiments/EXP-XOR-019343/specification.yaml#experiment.charge_model
        - >-
          818be4a6064c79e1c0e0d1a9c000c276afd2b1fa:
          experiments/EXP-XOR-019343/runs/RUN-XOR-019343-001/
          raw-result.json#/cells

    - id: RT-OBJ-002
      severity: major
      category: dominated_null
      objection: >-
        The frozen null queries with replacement. A per-source affine
        permutation prefix samples without replacement using O(1) state. At
        the same nominal 50%/90% coverage it strictly reduces queries and the
        frozen expected candidate workload while leaving the right table and
        asymptotic memory unchanged. Thus the frozen null is not on the
        time-memory-data Pareto frontier.
      disposition: sustained_analytic_model_domination_actual_timing_requires_control
      evidence:
        - >-
          818be4a6064c79e1c0e0d1a9c000c276afd2b1fa:
          experiments/EXP-XOR-019343/specification.yaml#experiment.charge_model

    - id: RT-OBJ-003
      severity: major
      category: query_cost
      objection: >-
        Kappa=1 is an internal sensitivity point, not an end-to-end cost
        model. The interface does not specify whether a query is a local field
        sample and hash lookup, an elliptic-curve addition, a scalar
        multiplication, an external oracle/data access, or a target-dependent
        computation. RNG/permutation generation, inversions, hashing, bucket
        access, canonicalization, and communication are not normalized to the
        same unit. The kappa=0 sensitivity preserves the narrow ordering but
        does not validate kappa=1 as a real system cost.
      disposition: open_blocks_end_to_end_cost_interpretation_narrow_ordering_survives

    - id: RT-OBJ-004
      severity: critical
      category: relation_identity_multiplicity_and_rank
      objection: >-
        Unique relation cardinality is not independent algebraic rank. The
        snapshot does not retain canonical relation IDs or coefficient rows,
        and CTRL-A-B asserts only equal counts. Permutations, sign symmetry,
        repeated points, multiple source orientations, shared queried keys,
        and composite-modulus dependencies can turn many unique tuples into
        few independent equations. At p=211,b=0.4 even the complete relation
        set has only 8 relations for N=15 factor-base points.
      disposition: open_blocks_rank_or_solver_claim

    - id: RT-OBJ-005
      severity: critical
      category: missing_end_to_end_solver
      objection: >-
        No path is specified from zero-sum factor-base tuples to a target
        discrete logarithm. Missing stages include known-scalar source
        generation, sufficient independent relation collection, arithmetic or
        Smith/CRT linear algebra over the correct subgroup order, anchoring the
        global scalar orientation to a generator, descent of an arbitrary
        target into the factor base, target recovery, and verification. Their
        success probabilities and retry factors are absent.
      disposition: open_blocks_any_ecdlp_complexity_claim

    - id: RT-OBJ-006
      severity: major
      category: memory_preprocessing_and_tradeoffs
      objection: >-
        Equal right-table shape does not complete a memory model. T=N*(N-1)
        stored pairs plus bucket/container overhead is recorded only as entry
        counts; peak RSS is missing. Factor-base construction, preprocessing,
        relation storage, matrix memory, target state, and parallel collision
        handling are uncharged. No table-blocking/recomputation curve,
        distinguished-point alternative, or amortization rule is evaluated.
      disposition: open_blocks_memory_or_pareto_claim

    - id: RT-OBJ-007
      severity: critical
      category: scale_transfer
      objection: >-
        Transport from p<=211 to cryptographic ECDLP would require all of the
        following, none tested here: stable factor-base density and bucket
        occupancy; a justified relation-key distribution; controlled
        multiplicity and independence; enough full-rank rows in a declared
        prime-order subgroup; scalable source and target decompositions;
        constant-cost oracle semantics; feasible N^2 storage; charged linear
        algebra and retries; and a demonstrated end-to-end reduction. Five
        seeds and four tiny composite-order curves do not validate these
        assumptions.
      disposition: open_blocks_crypto_scale_or_asymptotic_transfer

    - id: RT-OBJ-008
      severity: major
      category: baseline_scope
      objection: >-
        Pollard rho and BSGS solve a DLP; this instrument counts relations and
        does not. The closest frozen specialized baseline is Arm B, but its
        information access is not shown equivalent to D's. Consequently no
        solver-level baseline comparison is presently well typed.
      disposition: open_no_sota_claim_available

    - id: RT-OBJ-009
      severity: major
      category: coverage_model
      objection: >-
        The formula 1-(1-1/p)^q is field-key coverage under independent
        with-replacement queries. Treating it as unique-relation coverage also
        assumes each canonical relation has an auditable key exposure model.
        Shared keys, several orientations per relation, and relation
        multiplicity change covariance and solve probability even if marginal
        key coverage is correct. The raw result cannot audit this mapping.
      disposition: open_requires_relation_key_trace_and_multiplicity_audit

  required_controls:
    - id: CTRL-RT-AFFINE-NOREPEAT
      priority: 1
      cost: cheapest_exact_mutation_one_successor_top_level_run
      purpose: >-
        Test whether replacement collisions and repeated candidate work
        explain a material fraction of the Arm D disadvantage.
      protocol_ref: counterexample_or_mutation
      status: preregistration_required_not_run_in_this_review

    - id: CTRL-RT-ORACLE-INTERFACE
      priority: 2
      purpose: >-
        Freeze one oracle interface and charge schedule that both Arm B and
        Arm D may actually use. State whether source-conditioned keys are
        available. Compare at the common stopping event of a specified rank
        or successful solve, not only per tuple.
      pass_condition: >-
        Both arms receive identical admissible information, preprocessing,
        amortization, and query charges, and neither obtains a key the other
        is forbidden to request.

    - id: CTRL-RT-RELATION-SET-RANK
      priority: 3
      purpose: >-
        Retain sorted canonical relation IDs and sparse coefficient rows;
        verify A/B set equality and D subset membership; report multiplicity,
        rank growth, nullity, duplicate rows, and the first full-rank stopping
        point over each declared subgroup modulus.
      pass_condition: >-
        The relation definition, modulus, symmetry quotient, and required rank
        are frozen, and rank can be recomputed from immutable rows.

    - id: CTRL-RT-END-TO-END
      priority: 4
      purpose: >-
        Add a generator, prime-order subgroup, known-scalar sources, target
        instances, descent, linear solve, scalar orientation, recovery, and
        final DLP verification. Charge preprocessing, failed attempts, and
        inverse success probability.
      pass_condition: >-
        At least one frozen end-to-end target is solved and verified under a
        cost ledger whose stages sum to reported total time, memory, and
        data/query usage.

    - id: CTRL-RT-MEMORY-TRADEOFF
      priority: 5
      purpose: >-
        Measure peak RSS and bytes per stored pair/row, then evaluate at least
        full table, blocked table with recomputation, and low-memory collision
        search points under one output criterion.
      pass_condition: >-
        The reported frontier includes time, peak memory, preprocessing, and
        data/query counts with no unchecked dominated_by=null entry.

  counterexample_or_mutation:
    name: deterministic_no_repeat_affine_permutation_null
    rationale: >-
      This changes only the replacement policy and has O(1) per-source state,
      so it is the cheapest exact discriminator between replacement waste and
      a deeper deficiency in uniform-key probing.
    frozen_inputs:
      snapshot_commit: 818be4a6064c79e1c0e0d1a9c000c276afd2b1fa
      primes: [101, 103, 107, 211]
      b_values: [0.4, 0.5]
      seeds: [1, 2, 3, 4, 5]
      arity_m: 3
      arm_b: unchanged
      right_table: unchanged
      candidate_verification: unchanged
      canonical_relation_definition: unchanged_but_must_be_emitted
      kappa_add_equivalents_per_query: 1
    query_counts:
      q1: 1
      q50: ceil(0.50*p)
      q90: ceil(0.90*p)
      exact_by_prime:
        p101: {q1: 1, q50: 51, q90: 91}
        p103: {q1: 1, q50: 52, q90: 93}
        p107: {q1: 1, q50: 54, q90: 97}
        p211: {q1: 1, q50: 106, q90: 190}
    deterministic_generation: >-
      Canonically order source points exactly as in the frozen run. For each
      tuple (p, canonical b string, seed s, source index i), let A be
      1 + (OS2IP(SHA-256("EXP-XOR-AFFINE-v1|p|b|s|i|A")) mod (p-1))
      and let C be OS2IP(SHA-256("EXP-XOR-AFFINE-v1|p|b|s|i|C")) mod p.
      Query x_j=(A*j+C) mod p for j=0,...,q-1. Because p is prime and A is
      nonzero modulo p, every per-source prefix is collision free. Record A,
      C, the ordered-key SHA-256, and distinct_query_count for every source.
    accounting:
      - Charge the same N^2 table construction and two additions per verified candidate.
      - Charge kappa*q*N exactly as in the frozen model.
      - Separately count two SHA-256 derivations per source and one modular update per emitted key.
      - Record actual wall time, peak RSS, queries, distinct keys, bucket hits, candidate verifications, and canonical relation IDs.
      - Report both total charge divided by total unique relations and per-seed ratios; do not average ratios across zero-yield seeds.
    deterministic_checks:
      - Every source has exactly q distinct keys and zero repeated keys.
      - Every key lies in [0,p-1].
      - Replaying the successor produces byte-identical scientific payloads.
      - Arm B output and right-table digest match the frozen snapshot.
      - Every Arm D relation ID belongs to the canonical Arm B relation set.
    decision_rule:
      broad_interpretation_falsified_if: >-
        Any q50 or q90 record has no-repeat Arm D charged cost per unique
        relation at most Arm B's under the common interface, or the rank-stopped
        comparison reverses, using the preregistered no-repeat query counts.
      replacement_artifact_confirmed_if: >-
        No-repeat has equal peak memory, strictly fewer queries, and strictly
        lower charge than frozen Arm D at the same nominal coverage in every
        cell, with preserved or higher relation yield; this falsifies any
        interpretation that the frozen null is Pareto-efficient even if Arm B
        still wins.
      narrow_result_extended_if: >-
        No-repeat remains above Arm B in every cell and seed and the same holds
        at the declared rank-stopped output. The extension remains toy-only.
    analytic_preregistration_expectation:
      query_reduction_q50_range: [0.2702702703, 0.2777777778]
      query_reduction_q90_range: [0.6056910569, 0.6082474227]
      frozen_model_expected_cost_reduction_q50_range: [0.2356210422, 0.2798191042]
      frozen_model_expected_cost_reduction_q90_range: [0.5959826994, 0.6054236154]
      expected_no_repeat_cppu_ratio_to_arm_b_q50_range: [14.4024321585, 36.6171243379]
      expected_no_repeat_cppu_ratio_to_arm_b_q90_range: [13.9890402732, 35.7352360375]
      caveat: >-
        These are ratios of expectations under the frozen uniform-candidate
        model, not observed successor results. Multiplicity and rank can still
        change the realized comparison.

  baseline_comparison:
    comparison_unit_warning: >-
      Generic baselines output a discrete logarithm. EXP-XOR-019343 outputs
      relation counts. Until the downstream solve path is supplied, the rows
      are context rather than a valid performance race.
    pollard_rho:
      target: DLP in a subgroup of order n
      expected_time: Theta(sqrt(n)) group operations
      memory: O(1) group elements in the serial form
      preprocessing: none required for one target
      data_or_queries: O(1) external data
    bsgs:
      target: DLP in a subgroup of order n
      time: Theta(sqrt(n)) group operations
      memory: Theta(sqrt(n)) group elements
      preprocessing: table may be amortized only when targets share the same group and base
      data_or_queries: no external oracle assumed
    closest_frozen_specialized_baseline:
      name: Arm B targeted MITM relation enumeration
      output: full toy relation set
      frozen_cost: C_B=N^2+kappa*N+2*candidates_B
      memory: same N^2 right-table construction as Arm D
      data_or_queries: N
      caveat: >-
        It is the closest in-snapshot comparator, but equivalence depends on a
        common oracle interface that the snapshot does not freeze.
    arm_d_frozen:
      output: partial canonical unique relation set
      frozen_cost: C_D=N^2+kappa*q*N+2*V_D(q)
      memory: N^2 table insertions and T=N*(N-1) stored non-identity pairs
      data_or_queries: q*N
      pareto_vs_arm_b_under_frozen_model: >-
        Dominated at q50 and q90: equal table shape, more queries, higher
        charged cost per unique relation, and lower or equal relation coverage.
        This is not an algorithmic dominance theorem until access interfaces
        and output criteria are equalized.
    affine_no_repeat_vs_frozen_arm_d:
      time: strictly lower expected frozen charge at matched nominal coverage
      memory: equal asymptotic table memory and O(1) query-generator state
      data_or_queries: strictly fewer
      verdict: model_pareto_dominates_frozen_arm_d_actual_run_still_required
    time_memory_tradeoffs_missing:
      - Reduce table memory by blocking buckets and recomputing pairs.
      - Replace stored table search with collision search or distinguished points.
      - State whether preprocessing is one-target or amortized across targets.
      - Include sparse versus dense linear algebra and relation-storage memory.
    dominated_by: >-
      Arm B under the frozen internal model; for end-to-end ECDLP context,
      Pollard rho and BSGS remain the necessary solver baselines.
    sota_delta:
      demonstrated_time_exponent_improvement_vs_pollard_rho: 0.0
      demonstrated_memory_exponent_improvement_vs_pollard_rho: 0.0
      demonstrated_data_query_exponent_improvement_vs_pollard_rho: 0.0
      reason: no_asymptotic_fit_and_no_ecdlp_solve
      conditional_instrument_ceiling_if_N_equals_p_to_b_and_T_is_Theta_N_squared:
        frozen_fixed_coverage_query_exponent:
          b0.4: 1.4
          b0.5: 1.5
        frozen_fixed_coverage_candidate_verification_exponent:
          b0.4: 1.2
          b0.5: 1.5
        frozen_charged_time_exponent_with_positive_constant_kappa:
          b0.4: 1.4
          b0.5: 1.5
        right_table_memory_exponent:
          b0.4: 0.8
          b0.5: 1.0
        conditional_time_exponent_delta_vs_pollard_rho:
          b0.4: 0.9
          b0.5: 1.0
        conditional_memory_exponent_delta_vs_serial_pollard_rho:
          b0.4: 0.8
          b0.5: 1.0
        conditional_memory_exponent_delta_vs_bsgs:
          b0.4: 0.3
          b0.5: 0.5
        caveat: >-
          This is a method-ceiling extrapolation of the frozen formulas, not
          evidence that relation density, oracle cost, or solver success scales
          this way. No-repeat changes constants, not these exponents.

  heuristic_challenges:
    - >-
      Independent uniform field-key coverage is not yet justified as the
      distribution of canonical relation exposures; relation multiplicity and
      shared keys affect covariance and variance.
    - >-
      Five deterministic seeds do not estimate tails, rare rank deficiency,
      or retry probability. No confidence interval or exact distributional
      test is reported.
    - >-
      The scale transfer assumes N behaves as p^b and T as Theta(N^2), while
      factor-base lifting, subgroup filtering, bucket occupancy, and relation
      density remain favorable at cryptographic p.
    - >-
      It is assumed that query cost is a constant kappa independent of p,
      source construction, target dependence, memory hierarchy, and whether
      the query is local or external.
    - >-
      It is assumed that unique relation count predicts usable rank and solve
      probability. The snapshot measures neither.
    - >-
      The composite toy group orders are assumed to stand in for a declared
      large prime-order subgroup, but no subgroup transfer argument is given.

  cost_model_challenges:
    - stage: factor_base_and_subgroup_setup
      omitted_costs:
        - x enumeration and point lifting
        - subgroup membership and cofactor clearing
        - canonical ordering and storage
    - stage: right_table_preprocessing
      omitted_costs:
        - field inversions and coordinate extraction
        - hash computation, allocation, bucket overhead, and sorting
        - byte-level memory, cache misses, and peak RSS
        - one-target versus multi-target amortization
    - stage: querying
      omitted_costs:
        - random or affine key generation
        - exact oracle semantics and communication/data acquisition
        - source generation and any scalar multiplication
        - duplicate-query handling and repeated bucket scans
    - stage: relation_processing
      omitted_costs:
        - canonical relation IDs and multiplicity accounting
        - sparse coefficient-row construction and storage
        - rank tests and surplus relations required for reliable rank
    - stage: linear_algebra
      omitted_costs:
        - modulus selection for composite orders or prime subgroups
        - Smith normal form or CRT decomposition where applicable
        - sparse solve time, memory, failure probability, and verification
    - stage: target_solution
      omitted_costs:
        - known-scalar source production
        - target descent and retry probability
        - scalar orientation to a generator
        - target recovery and final verification
    - stage: parallel_and_time_memory_frontier
      omitted_costs:
        - processors and communication
        - distinguished-point storage
        - table blocking/recomputation
        - wall-clock versus total-work accounting

  reduction_and_scope_challenges:
    - >-
      No reduction maps the relation instrument to ECDLP, so there is no basis
      for carrying relation-cost ratios into a DLP time exponent.
    - >-
      No source points are tied to known coefficients of a generator and
      target; homogeneous zero-sum relations can leave a global scalar
      orientation unresolved even after rank collection.
    - >-
      No target descent or target-recovery probability is specified. Relation
      collection alone cannot establish one-target or many-target success.
    - >-
      The exact supported boundary is the eight cells with p<=211, five seeds,
      and the frozen charge definition. It excludes cryptographic curves,
      prime-order subgroup ECDLP, asymptotic claims, and exponent gains.
    - >-
      The lane is not declared dead. The named obstruction to a broader claim
      is the absent common oracle/solve interface and rank-aware end-to-end
      reduction; the open route is the affine no-repeat and rank-stopped
      successor control.

  proof_architecture_challenges:
    applicable_as_formal_proof_review: false
    reason: empirical_toy_measurement_not_a_theorem_or_closure_argument
    observation_fiber_attack: >-
      Holding unique relation count fixed while varying relation coefficient
      rows can change rank and solve success. The missing separator is the
      canonical rank-bearing matrix over a declared subgroup modulus.
    quantifier_order_attack: >-
      The frozen q grid was selected before output, which is sound for the toy
      measurement. A broader claim would still need to quantify over curve
      families, targets, subgroup orders, and seeds rather than select a
      favorable factor base or source mapping after seeing the instance.
    boundary_and_strictness_attack: >-
      q=1 is a low-information nearby point but is not a no-repeat boundary or
      an end-to-end baseline. It does not test the replacement artifact.
    method_ceiling_attack: >-
      Under the frozen formulas and N=p^b, fixed coverage makes q=Theta(p),
      q*N=Theta(p^(1+b)), and right-table memory Theta(p^(2b)). This ceiling
      cannot support a better-than-rho headline even before downstream costs.
    nearby_object_attack: >-
      A collision-free affine permutation has the same table and marginal
      field-key domain but strictly fewer queries at the same nominal coverage.
      Failure to include it leaves replacement waste confounded with the
      purported behavior of uniform-key querying.

  narrowest_supported_statement: >-
    At immutable snapshot 818be4a6064c79e1c0e0d1a9c000c276afd2b1fa,
    for exactly the eight p<=211 cells, five seeds, frozen with-replacement
    q50/q90 schedules, canonical unique-relation counter, and charge formulas
    with kappa=1, every Arm D record has higher charged cost per recovered
    unique valid relation than its Arm B cell. The smallest observed ratio is
    14.2943 at q50 and 31.5060 at q90; a static kappa=0 sensitivity still has
    minima 10.4696 and 23.4625. This supports only inefficiency of this frozen
    Arm D sampling instrument relative to Arm B under those definitions. It
    does not establish algorithmic equivalence, rank sufficiency, an ECDLP
    solve, an exponent gain, cryptographic-scale validity, or a breakthrough.

  next_concrete_action: >-
    The Coordinator should preregister one successor experiment implementing
    CTRL-RT-AFFINE-NOREPEAT exactly as specified above, preserving the eight
    cells and five seeds and emitting canonical relation IDs and coefficient
    rows. Compare it to Arm B only after freezing a common oracle interface;
    use both per-relation and first-required-rank stopping metrics. If the
    no-repeat result still loses, the next bounded action is one end-to-end
    prime-subgroup toy solve with source, linear algebra, orientation, descent,
    target recovery, peak memory, and complete stage costs. No official status
    change or lane closure is recommended by this report.

