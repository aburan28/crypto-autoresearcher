      - end-to-end ECDLP time or memory
      - crypto-scale behavior
      - asymptotic improvement
      - security impact on a protocol or scheme

  pareto_accounting:
    dominated_by:
      end_to_end_ecdlp_frontier: >-
        Pollard rho at exponent 1/2, matching the frozen hypothesis record;
        this toy instrument does not solve ECDLP and therefore is not itself a
        commensurate attack-frontier point.
      frozen_arm_d_null: >-
        A blind without-replacement affine-permutation key schedule at matched
        coverage dominates the with-replacement D schedule on query count and
        expected verification work while retaining O(1) generator state and
        the same N^2 main table.
    sota_delta:
      time_exponent: 0
      memory_exponent: 0
      attack_result: none
      arm_d_to_arm_b_queries_per_source:
        q50_range: [70, 146]
        q90_range: [232, 485]
      observed_per_seed_cost_per_tuple_ratio_D_over_B: [14.294320137693632, 100.04411764705883]
      observed_pooled_cost_per_tuple_ratio_D_over_B: [19.518072289156628, 86.37358101135192]
      no_replacement_model_sensitivity_ratio_D_over_B: [13.888088436219105, 36.44440205327414]
      note: >-
        The first two ratio ranges are observations from frozen bytes. The
        no-replacement range is a reviewer-derived expectation under the same
        formulas, not an executed control.
    pareto_boundary: >-
      No ECDLP time-memory-data Pareto improvement is claimed or observed. The
      only frontier statement is internal to this toy key-information
      instrument; crossing to an attack frontier requires key-acquisition cost,
      usable-relation rank, total collection target, linear algebra, and target
      recovery.

  narrowest_supported_statement: >-
    RUN-XOR-019343-001 is a valid snapshot-bound observation that, in the
    declared toy add-equivalent proxy, one supplied correct x bucket key per
    source has lower cost per recovered ordered zero-sum triple than q blind
    with-replacement field-key probes at the preregistered q50 and q90 values.
    The literal EXP-XOR-019343 F2 criterion is not triggered. Nothing stronger
    follows from this review.

  cheapest_decisive_follow_up:
    action: >-
      Freeze a versioned, deterministic trace-level control on the same eight
      toy cells. Export per-source relation multiplicities and bucket sizes,
      then compute exact occupancy/cost distributions for (i) the existing
      with-replacement D, (ii) an O(1)-state affine-permutation no-repeat D, and
      (iii) B with the targeted-key acquisition cost exposed as a parameter
      rather than fixed silently at kappa=1. Freeze a source-cluster-aware F1
      interval and one aggregation estimator before calculation.
    why_cheapest: >-
      p is at most 211 and the required table geometry already exists. Exact
      enumeration removes five-seed Monte Carlo noise and nested-q ambiguity,
      needs no cryptographic-scale computation, and directly separates the
      supplied-key information value from replacement waste and arbitrary
      query pricing.
    decisive_outcomes:
      - >-
        If B remains cheaper across a justified targeted-key cost range and
        against the no-repeat null, the toy information-value statement is
        robust within the proxy.
      - >-
        If the gap disappears under either control, the current ratio is an
        artifact of query acquisition pricing or the dominated null schedule.
      - >-
        The source-cluster interval gives an actual F1 verdict; no naive
        relation-level binomial interval is admissible.

  unresolved_objections:
    - OBJ-R1 fully charged end-to-end wording
    - OBJ-R2 dominated with-replacement null
    - OBJ-R3 missing and dependence-invalid F1 procedure
    - OBJ-R4 ordered tuples are not shown to be independent usable relations
