  cost_model_audit:
    correctly_charged_within_proxy:
      - N^2 curve additions used to enumerate the right-pair table per modeled attempt
      - q*N declared query charges for Arm D and N query charges for Arm B
      - two curve additions for every candidate verification, including duplicate candidates
      - unique-relation denominator for repeated successful keys in Arm D
    not_end_to_end_charged:
      - curve selection and factor-base construction
      - coordinate-key acquisition semantics beyond the arbitrary kappa=1 proxy
      - SHA-256, string construction, modular reduction, and random-query generation
      - dictionary hashing, bucket creation, insertion, and lookup
      - duplicate-key detection or caching policy
      - storage and hashing of Arm D's valid_relation_tuples deduplication set
      - materialization or downstream use of relation rows
      - relation-rank filtering, linear algebra, source recovery, and target descent
      - bit complexity and calibrated field-operation costs
    actual_command_accounting: >-
      Terminal wall time 3.237613792 seconds includes two complete internal
      evaluations. The modeled per-attempt costs include one evaluation, as
      frozen and disclosed. Peak RSS is absent, so no measured total-memory
      comparison is available.
    table_label_correction: >-
      table_adds=N^2 counts curve additions/right-pair attempts. Only T=N^2-N
      non-identity pairs are stored, so describing N^2 as table insertions is
      inaccurate even though the charged arithmetic itself is consistent.
    verdict: internally_consistent_partial_operation_proxy_not_fully_charged_end_to_end

  matching_and_equivalence_audit:
    arm_b_logic: >-
      For each explicit source point P1, Arm B directly reads P1[0] and probes
      the bucket keyed by x(P1). Because a valid triple has P2+P3=-P1, this key
      recovers every compatible ordered tuple, subject to sign false positives.
    arm_d_logic: >-
      For each P1, Arm D makes q deterministic-hash values modeled as
      independent uniform samples from F_p, probes those buckets, verifies all
      candidates, and deduplicates recovered ordered triples.
    equivalent_components:
      - same deterministic curve and factor base in a cell
      - same right-pair table construction and x-key buckets
      - same two-add candidate verification predicate
    non_equivalent_information:
      - Arm B receives the correct target key once; Arm D searches blindly for it.
      - Arm B's implementation performs coordinate access, not a measured oracle computation.
      - Arm D samples with replacement and re-verifies repeated buckets; Arm B has no analogous duplicate-query waste.
    answer: >-
      B and D are equivalent only as an instrument for pricing the value of a
      supplied correct key against this particular blind null. They do not
      answer equivalent end-to-end algorithmic questions. Calling their ratio
      an x-oracle algorithmic speedup requires a separately specified source
      and cost for the correct key.

  denominator_coverage_and_dependence_audit:
    coverage_definition: >-
      D unique ordered triples divided by Arm A/B ordered triples. It is not
      coverage of sign/permutation quotient classes or independent matrix rows.
    expected_coverage_identity: 1-(1-1/p)^q
    expectation_scope: >-
      Correct for each relation's marginal hit probability under independent
      with-replacement uniform keys. It does not make relation-hit indicators
      independent.
    within_source_dependence: >-
      All valid tuples sharing P1 require the same x(P1) key, so their hit
      indicators move together within a seed. Treating the relation count as a
      binomial sample size would understate uncertainty.
    q_dependence: >-
      q1, q50, and q90 use nested query-index prefixes for the same seed and
      source. They are paired, not independent q experiments.
    seed_dependence: >-
      Five domain-separated deterministic SHA-256 streams vary Arm D only;
      Arm B and the cell geometry are fixed. They are Monte Carlo replicates
      conditional on one deterministic cell, not five independent curves.
    cell_dependence: >-
      For each p the b=0.4 factor base is nested in b=0.5, every curve and base
      follow the same deterministic construction, and the eight cells should
      not be treated as independent draws from an ECDLP instance population.
    f1_sensitivity_not_a_verdict: >-
      As an explicitly non-frozen sensitivity check, pooled relation-level
      Wilson intervals would exclude the predicted coverage in six of sixteen
      matched-q aggregates. That calculation is not admissible as F1 evidence
      because Wilson was not preregistered and relation indicators are
      clustered. It shows why F1 cannot be silently declared passed or ignored;
      a source-cluster-aware frozen interval is required.

  objections:
    - id: OBJ-R1
      severity: major
      title: fully_charged_language_exceeds_the_model
      objection: >-
        The formulas are exact for a declared curve-add/query proxy, but omit
        multiple algorithmic stages, bit costs, lookup/generation work, memory,
        and every downstream relation-collection obligation. "Fully charged"
        is supportable only with the qualifier "within this frozen proxy."
      consequence: no end-to-end or concrete attack-cost interpretation
    - id: OBJ-R2
      severity: major
      title: blind_with_replacement_arm_d_is_not_the_closest_competitive_null
      objection: >-
        At q90 the frozen D makes about 2.30p queries per source to see about
        90% of keys and reprocesses repeats. A blind affine-permutation schedule
        visits distinct field keys with O(1) generator state, reaches coverage
        q/p, and uses ceil(0.5p) or ceil(0.9p) queries. Under the same expected
        add-equivalent formulas its modeled cost per relation remains 13.888x
        to 36.444x Arm B across the frozen grid, but it strictly improves the
        D null's time/data cost without increasing the dominant table memory.
      consequence: >-
        The observed numerical gap is partly a property of the chosen
        with-replacement null. The Theta(p) information statement survives,
        but the reported constants are not a Pareto-frontier null comparison.
    - id: OBJ-R3
      severity: major
      title: hypothesis_f1_is_unassessed
      objection: >-
        H-XOR-56cc0a contains a separate binomial-interval falsifier. The
        successor protocol drops it, freezes no interval method, and reports no
        intervals. Clustered relation hits also invalidate a naive binomial
        relation denominator.
      consequence: >-
        F2 non-falsification is not a verdict on the full hypothesis record.
    - id: OBJ-R4
      severity: moderate
      title: recovered_tuple_is_not_independent_relation
      objection: >-
        Ordered signed/permuted triples are counted separately and no rank or
        downstream utility is measured.
      consequence: cost per recovered tuple cannot be read as cost per usable relation
    - id: OBJ-R5
      severity: moderate
      title: seed_and_cell_aggregation_is_underspecified
      objection: >-
        The F2 phrase "in any cell" does not select seed-wise, mean-of-ratios,
        or pooled-ratio aggregation. The answer is robust here, but future
        threshold-near data would not have a unique verdict.
      consequence: freeze one aggregation estimator and dependence-aware uncertainty rule
    - id: OBJ-R6
      severity: moderate
      title: memory_equivalence_is_unmeasured
      objection: >-
        The common table population is recorded, but Arm D additionally stores
        a deduplication set and no peak RSS or byte-level structure cost exists.
      consequence: only shared-main-table shape, not total memory equality, is supported

  tested_claim_boundary:
    scale: toy
    primes: [101, 103, 107, 211]
    b_values: [0.4, 0.5]
    arity_m: 3
    seeds: [1, 2, 3, 4, 5]
