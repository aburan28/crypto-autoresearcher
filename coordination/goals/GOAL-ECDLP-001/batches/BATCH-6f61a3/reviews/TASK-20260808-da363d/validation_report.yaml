        1f51fd95f5bdf87e3c4972ed612786ae9164f358aaebe5d5cb0d33b704083211;
        source manifest.yaml
        20f758233b5381c3ce8497a6231eb923dd637787d64a0c715c55a2d6ec7f32d8.
    - check: cell and arm coverage
      status: PASS
      detail: >-
        Independent parse found exactly 40 unique cells and 120 arm records,
        with p in {101,103,107,211}, b in {0.4,0.5}, and seeds 1 through 5
        for every (p,b) pair. Every cell has exactly arms A, B, and C.
    - check: A/B/C arithmetic identities
      status: PASS
      detail: >-
        For every cell, A equals 2*factor_base_size^3, B equals
        factor_base_size^2 + 2*candidates_verified_B, and C equals
        factor_base_size^2 + 2*candidates_verified_C. No identity mismatch
        occurred in 40 cells.
    - check: A/B relation-count equality
      status: PASS
      detail: >-
        All 40 independent comparisons have relations_A == relations_B and
        relation_count_A_minus_B == 0; this is not treated as a yield gain.
    - check: B/C candidate ratio
      status: PASS
      detail: >-
        All 40 C candidate counts are nonzero. Independent mean of
        candidates_verified_B/candidates_verified_C is exactly
        3.7543605110164, matching RUN-ECDLP-288336-002/raw-result.json and
        its manifest summary.
    - check: raw-result cell-by-cell binding
      status: PASS
      detail: >-
        Recomputed transformed rows from the frozen source match all 40 rows
        in RUN-ECDLP-288336-002/raw-result.json, including ratios, costs,
        candidate counts, relation counts, and controls; zero field mismatches.
    - check: aggregate summaries
      status: PASS
      detail: >-
        Recomputed mean B/A = 0.055657994843265765, mean C/A =
        0.039343976718488036, minimum B/A = 0.03213432911649647, maximum
        B/A = 0.09259259259259259, and mean B/C candidate ratio =
        3.7543605110164. These match the raw result and manifest.
  control_checks:
    - check: source controls
      status: PASS
      detail: >-
        all_controls_pass is true in all 40 source cells; every C arm has
        prng_collision_free true; right_half_pairs equals factor_base_size^2
        for both B and C in all cells.
    - check: source-hash invalidation behavior
      status: PASS
      detail: >-
        RUN-ECDLP-288336-001 reports invalid after detecting source hashes in
        the dirty shared worktree. RUN-ECDLP-288336-002 uses the detached clean
        source root and reports no validity errors.
  heuristic_validation_checks:
    - check: statistical overclaiming
      status: PASS
      detail: >-
        The frozen specification removes the prior t-test. The v2 analyzer
        contains no t-test or inferential statistic and labels the statistic
        as not_applicable_deterministic_cost_identity.
    - check: interpretation separation
      status: PASS
      detail: >-
        B/A field-operation ratio is the primary MITM split-cost comparison;
        B/C candidates_verified ratio is separately reported as the marginal
        structured-query versus matched-random-query diagnostic. The artifacts
        do not call B/C a speedup or a yield result, and A/B relation equality
        is explicitly preserved.
  cost_model_checks:
    - check: charged operation formulas
      status: PASS
      detail: >-
        The implementation and recomputation charge A as 2|F|^3 and B/C as
        |F|^2 + 2*candidates_verified, exactly as preregistered.
    - check: cost-unit and scope declaration
      status: PASS
      detail: >-
        The metric is explicitly field_operations and the experiment's claim
        ceiling is toy. No crypto-scale, asymptotic, or Pollard-rho conclusion
        is asserted; no discrete logarithm is solved.
  proof_architecture_checks: []
  discrepancies:
    - id: D-VAL-001
      severity: material_provenance
      status: REVISE
      check: run 002 manifest revision and companion provenance agreement
      detail: >-
        The archived RUN-ECDLP-288336-002 manifest.yaml records code.command
        with ECDLP_SOURCE_ROOT=/tmp/ecdlp-source-head and source_provenance
        dirty=false. Its immutable command.txt records
        ECDLP_SOURCE_ROOT=/tmp/ecdlp-cost-source, while environment.json
        records source_root=/tmp/ecdlp-cost-source and dirty_pr_worktree=true.
        Further, manifest.yaml and manifest_v2.yaml both record code.commit
        c921778ecd5c925f3524749e95680347e0884012, but analyze_mitm_cost_v2.py
        is introduced at freeze commit 8dcbc68eefad7a90884b364fe7a13a2f1c5891a6
        and is absent at c921. Thus the manifest's claimed exact command,
        dirty/revision binding is not internally self-consistent.
      impact: >-
        The detached source bytes and all numerical observations independently
        reproduce exactly, but artifact-policy reproducibility of the charged
        reanalysis is not fully established from the manifest as written.
        The existing manifest_v2 and v2_manifest_schema_repair amendment do
        not suffice to cure this provenance defect: they are schema/additive
        repairs, retain the c921 code commit, and do not supersede the
        conflicting command/revision fields explicitly.
      required_correction: >-
        Coordinator must obtain a new immutable superseding manifest (without
        editing either archived manifest) that binds the actual v2 analyzer
        commit 8dcbc68eefad7a90884b364fe7a13a2f1c5891a6, the exact command in
        command.txt, and an explicit distinction between dirty PR worktree and
        clean detached source tree. Rebind its hash in a new snapshot before
        admitting the run as valid evidence.
  supersession_checks:
    - check: registry entries for runs 001 and 002
      status: PASS
      detail: >-
        For both entries, superseded and superseding files exist and their
        SHA-256 values exactly equal tools/run_supersession_registry.yaml. Each
        superseding manifest declares the same run id and the registry's prior
        path and hash under its supersedes block.
    - check: immutable parent/path binding
      status: PASS
      detail: >-
        Snapshot TASK-20260808-4840d4 is a child of the recorded parent
        1966272bfbc38aabfba1d08d4d88d3efeaddd749 and its four path hashes match
        the working tree. Snapshot TASK-20260808-530e8d is reachable from the
        recorded source-code parent 8dcbc68ee; no archived run file was edited.
  verdict: REVISE
  limitations:
    - >-
      This validation covers deterministic source reanalysis only; it is not a
      new experiment and does not validate the underlying ECDLP hypothesis.
    - >-
      All cells use 7-8 bit prime-field toy parameters. The evidence cannot
      support crypto-scale, asymptotic, or practical-security claims.
    - >-
      The B/C candidate ratio is a descriptive oracle-control diagnostic, not
      a yield or speedup claim; A/B equality of relation counts is retained.
    - >-
      RUN-ECDLP-288336-001 remains invalid infrastructure/provenance evidence
      and must not be pooled with RUN-ECDLP-288336-002.
    - >-
      Resolved model identity and probe verification were unavailable in this
      validator API session and are intentionally not fabricated.
