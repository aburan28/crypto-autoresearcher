  metric_recomputations:
    - check: frozen source SHA-256 values
      status: PASS
      detail: >-
        Recomputed against the detached clean source tree
        /tmp/ecdlp-cost-source at commit
        c921778ecd5c925f3524749e95680347e0884012. All four specification
        values match exactly: full_grid.py
        64d682e56e28472987ebd319f6250a09620c566ab7a881701d53acce3300a540;
        raw-results.json
        6e2d126166b0a6f6ee25c462e121c247b66f571e6e6ffc107e751602ee5ed978;
