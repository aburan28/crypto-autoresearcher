  accounting_conventions:
    asymptotic_variable: N
    target_bound: N^(1/3+o(1))
    incumbent_time_exponent: N^(1/2+o(1))
    soft_factor_rule: >-
      Fixed-degree field operations, fixed-character evaluation, dictionary
      overhead, and scalar-multiplication verification factors polynomial in
      log N may be absorbed only into N^o(1); an N^alpha enumeration, table,
      retry, or data term may not be hidden there.
    verification_cost_per_scalar: O(log N) group operations
    expected_cost_identity: >-
      Expected total cost is per-attempt cost divided by per-attempt success
      probability. Truncating a fiber of size F to ell candidates gives
      success at most ell/F absent extra information and therefore does not
      remove the aggregate Omega(F) candidate/verification charge over
      retries.
    cost_axes_required:
      - preprocessing
      - enumeration
      - target_query_or_descent
      - retries
      - direct_verification
      - memory
      - data_or_queries
      - aggregate_parallel_work
      - multi_target_amortization
    unit_limitation: >-
      The packet gives exponent-level group-operation baselines but no matched
      concrete conversion between group operations, field operations,
      character evaluations, division-polynomial evaluations, and dictionary
      probes. This report therefore compares N-exponents and keeps unlike
      primitive counts named rather than equating their constants.

  incumbent_rederivation:
    pollard_rho:
      preprocessing: 0
      serial_time_per_target: N^(1/2+o(1)) group operations
      serial_memory: O(1) group states
      success_probability_per_sqrt_N_scale_run: constant
      retries: O(1) for constant success; O(log(1/delta)) for failure probability delta
      verification: O(log N) group operations for the returned scalar
      data_or_queries: N^(1/2+o(1)) group-transition and equality evaluations
      parallel_wall_time: >-
        Ideally N^(1/2+o(1))/r with r coordinated distinguished-point
        workers in the work-preserving range; the aggregate work remains
        N^(1/2+o(1)) and coordination memory is not O(1) globally.
      aggregate_parallel_work: N^(1/2+o(1)) group operations
      multi_target_slice: >-
        Independent solution of t specified targets costs
        t*N^(1/2+o(1)); no target-independent preprocessing credit is needed.
    baby_step_giant_step:
      tradeoff_parameter: M stored baby steps, with 1 <= M <= N
      preprocessing_time: M group operations
      preprocessing_memory: M group elements plus dictionary overhead
      target_time: N/M group operations and dictionary probes
      success_probability: 1 for a complete exact table and scan
      retries: 0
      verification: O(log N) group operations per target
      single_target_total: M + N/M + O(log N)
      balanced_single_target: >-
        M=N^(1/2) gives N^(1/2+o(1)) time and N^(1/2+o(1)) memory.
      data_or_queries: M table writes plus N/M target lookups
      parallel_wall_time: >-
        Parallelizable table construction and giant-step scans can ideally
        divide wall time by r, but aggregate work stays M+N/M and shared or
        distributed table memory stays M.
      multi_target_total: M + t*N/M + O(t*log N)
      multi_target_optimum: >-
        For 1 <= t <= N, choosing M=sqrt(t*N) gives total
        2*sqrt(t*N)+N^o(1), memory sqrt(t*N), and amortized work
        2*sqrt(N/t)+N^o(1) per target. Any proposed reusable preprocessing
        must be compared with this adjustable incumbent slice, not only with
        the fixed M=sqrt(N) point.
    embedding_rule: >-
      A public observable computed from R, or an exact provenance-enriched
      label of R, can be evaluated inside incumbent group walks and equality
      tables. It changes the exponent only if its construction plus inverse
      location beats these incumbent slices after all data, candidates,
      retries, and verification are charged.

  candidate_rederivations:
    - statement_id: BLIND-CW
      proposal_id: IDEA-20260823-6284e8
      notation:
        alphabet_size: kappa
        window_length: m
        distinct_windows: D_m
        fiber_size_for_window_w: a_w
        target_fiber_size: F_x
        representation_build_time: A_CW
        representation_memory: M_CW
        representation_data: D_CW
        location_time: L_CW
      state_space_derivation:
        identities:
          - D_m <= min(N, kappa^m)
          - sum_w(a_w) = N
          - max_w(a_w) >= N/D_m
          - E_x[F_x] = (1/N)*sum_w(a_w^2) >= N/D_m >= N/kappa^m
        consequence: >-
          For a uniform target, exhaustive direct verification alone has
          expected cost at least (N/kappa^m)*O(log N), before representation
          construction or lookup. To fit N^(1/3+o(1)), a necessary entropy
          inequality is kappa^m >= N^(2/3-o(1)), equivalently
          m >= (2/3-o(1))*log_kappa(N). The packet supplies only an upper
          range for m, not this lower bound or an achieved D_m.
      complete_cost_vector:
        preprocessing: A_CW
        enumeration: >-
          The direct complete-word realization evaluates N cyclic symbols and
          builds an N-position occurrence index, hence has Theta(N) symbol
          evaluations and Theta(N) explicit entries. A sublinear compressed
          representation is a premise, not a derived construction.
        target_query_or_descent: O(m) symbol evaluations + L_CW
        candidate_and_verification: F_x*O(log N) group operations
        success_and_retries: >-
          Complete enumeration has success one. Returning only ell<F_x
          otherwise indistinguishable occurrences has success at most ell/F_x
          per attempt; inverse-success multiplication restores an Omega(F_x)
          aggregate candidate charge. No independent retry distribution is
          stated.
        memory: M_CW plus either streamed O(1) or materialized O(F_x) candidate storage
        data_or_queries: >-
          D_CW plus O(m) target symbol evaluations and location probes; the
          explicit complete-word/index construction uses Theta(N) source
          evaluations and entries.
        parallel_wall_time: >-
          Symbol generation and candidate verification may ideally be split
          across r workers, but aggregate work remains A_CW+L_CW+F_x*N^o(1).
          The packet gives no work-preserving parallel locator contract.
        aggregate_parallel_work: A_CW + L_CW + F_x*N^o(1)
        multi_target_total: >-
          A_CW + sum_i(L_CW(i)+F_i*N^o(1)); amortized preprocessing is A_CW/t,
          but each target retains its own location and fiber charge.
      required_end_to_end_inequalities:
        - A_CW <= N^(1/3+o(1))
        - M_CW <= N^(1/3+o(1))
        - D_CW <= N^(1/3+o(1))
        - L_CW <= N^(1/3+o(1))
        - E_x[F_x] <= N^(1/3+o(1))
        - kappa^m >= N^(2/3-o(1))
      first_false_or_missing_inequality: >-
        The first state-space-to-cost inequality is missing:
        kappa^m >= N^(2/3-o(1)) together with an achieved
        D_m >= N^(2/3-o(1)). It is false for every
        m < (2/3-o(1))*log_kappa(N). Even where the parameter range permits a
        larger m, alphabet capacity alone does not establish the achieved
        window count or target-fiber tail bound.
      conditional_assembly: >-
        If a complete, source-independent representation really satisfies all
        build, memory, data, location, completeness, and candidate-fiber
        inequalities above, direct verification preserves the exponent. The
        packet does not establish those premises.
      incumbent_embedding: >-
        W_m is a public hash-like observable of a group point. It can label
        incumbent rho states or BSGS table entries at N^o(1) evaluation
        overhead. Without the missing inverse index, this yields the rho/BSGS
        exponents above; the explicit all-position occurrence index costs
        Theta(N), worse than both balanced incumbents.
      j1_verdict: breaks
      j1_verdict_reason: >-
        The stated data do not close the candidate-fiber, success/retry, and
        representation-construction inequalities needed for a complete
        N^(1/3+o(1)) end-to-end accounting. This is not an impossibility claim
        about every structured or compressed cyclic-word locator.

    - statement_id: BLIND-FIBER
      proposal_id: IDEA-20260823-38f214
      notation:
        image_size_on_subgroup: D_pi
        inverse_locator_build_time: A_INV
        inverse_locator_memory: M_INV
        inverse_locator_data: D_INV
        inverse_location_time: L_INV
        jump_composition_time: J_COMP
        scalar_candidate_count: C_x
      state_space_derivation:
        identities:
          - ceil(N/3) <= D_pi <= N
          - each U-fiber contains at most 3 subgroup points away from ramification, with multiplicity only reducing distinct points
        consequence: >-
          The degree-three label removes at most a constant number of bits; it
          leaves Theta(N) public labels on the subgroup. A provenance state
          that selects the exact lift gives an exact encoding of the original
          point, hence N reachable exact states. The at-most-three inverse
          geometric points are not scalar locations: Q is already known, and
          mapping its label to x remains the orbit-index problem.
      complete_cost_vector:
        preprocessing: A_INV plus any provenance and composed-jump construction
        enumeration: >-
          A direct dictionary from the Theta(N) reachable labels to scalar
          positions contains N total scalar entries and costs Theta(N) in its
          explicit realization.
        target_query_or_descent: N^o(1) to evaluate pi(Q) + J_COMP + L_INV
        candidate_and_verification: C_x*O(log N) group operations
        success_and_retries: >-
          A complete deterministic inverse locator has success one. If it is
          incomplete, its success probability and inverse-success retry factor
          are unspecified; small geometric fiber size does not supply them.
        memory: M_INV plus provenance/jump state and candidate workspace
        data_or_queries: D_INV plus inverse-locator probes and correspondence evaluations
        parallel_wall_time: >-
          An explicit label dictionary or incumbent table can be sharded, but
          sharding changes wall time only; aggregate construction remains its
          full entry count. No parallel inverse-locator contract is stated.
        aggregate_parallel_work: A_INV + J_COMP + L_INV + C_x*N^o(1)
        multi_target_total: >-
          A_INV + sum_i(J_COMP(i)+L_INV(i)+C_i*N^o(1)); A_INV may be shared,
          and therefore must be compared with M+t*N/M BSGS preprocessing and
          query work at the same number t of targets.
      required_end_to_end_inequalities:
        - A_INV <= N^(1/3+o(1))
        - M_INV <= N^(1/3+o(1))
        - D_INV <= N^(1/3+o(1))
        - J_COMP <= N^(1/3+o(1))
        - L_INV <= N^(1/3+o(1))
        - C_x <= N^o(1)
        - inverse_locator_success_probability >= N^(-o(1))
      first_false_or_missing_inequality: >-
        The first uncharged end-to-end inequality is
        A_INV+D_INV+M_INV <= N^(1/3+o(1)). The statement bounds inverse-location
        query time but gives no construction, data, or memory bound for the
        inverse locator itself. The only explicit dictionary realization
        derivable from the packet has N entries because D_pi=Theta(N).
      conditional_assembly: >-
        Granting a complete inverse locator, its construction/data/memory
        bounds, N^(1/3+o(1)) query and jump costs, and N^o(1) candidates makes
        direct verification N^(1/3+o(1)). The cost improvement is therefore
        located entirely in an unconstructed inverse-location mechanism.
      incumbent_embedding: >-
        An exact pair (pi(R), provenance(R)) represents R itself and supports
        the same generic group walks. Pollard rho gives the constant-memory
        N^(1/2+o(1)) slice; BSGS gives M+N/M with M memory. Merely replacing
        point coordinates by a degree-three label and branch does not change
        either exponent.
      j1_verdict: breaks
      j1_verdict_reason: >-
        The inverse-locator preprocessing/data/memory and incomplete-locator
        retry costs are absent, while the exact enriched state space remains
        size N. This is a cost-model break, not a lower bound excluding every
        possible non-generic algebraic inverse locator.

    - statement_id: BLIND-EDS
      proposal_id: IDEA-20260823-850562
      notation:
        syndrome_alphabet_size_including_sentinels: sigma
        initial_index_count: s
        distinct_syndromes: D_S
        target_syndrome_fiber: F_x
        recurrence_closure: Cl_S
        decoder_build_time: A_DEC
        decoder_memory: M_DEC
        decoder_data: D_DEC
        decoder_query_time: L_DEC
        total_division_polynomial_evaluation_cost: Q_PSI
      state_space_derivation:
        identities:
          - D_S <= min(N, sigma^s)
          - E_x[F_x] = (1/N)*sum_d(a_d^2) >= N/D_S >= N/sigma^s
        consequence: >-
          The promised N^o(1) scalar-candidate count for arbitrary target
          syndromes requires D_S >= N^(1-o(1)) and therefore the necessary
          entropy inequality sigma^s >= N^(1-o(1)), or
          s >= (1-o(1))*log_sigma(N). A polylogarithmic upper bound on s does
          not prove that lower bound, independence of syndrome coordinates,
          or the achieved D_S.
      recurrence_closure_accounting: >-
        Every multiplication identity actually used with multiplier a maps an
        index n to n*a and therefore charges the size and bitlength of the
        resulting closure Cl_S. The packet conditionally bounds the closed
        family but does not name the decoder multipliers, materialize Cl_S, or
        give Q_PSI. Polylogarithmic index bitlength alone is not a bound on the
        number of indices or on total evaluation work.
      complete_cost_vector:
        preprocessing: A_DEC plus construction of Cl_S and every reusable inverse structure
        enumeration: >-
          The direct syndrome-to-scalar dictionary computes syndromes for N
          subgroup points and stores N total scalar entries. Its explicit
          realization costs Theta(N*s) syndrome-coordinate evaluations and
          Theta(N) entries before division-polynomial evaluation cost.
        target_query_or_descent: Q_PSI(target) + L_DEC
        candidate_and_verification: F_x*O(log N) group operations
        success_and_retries: >-
          A complete decoder has success one. Truncating an F_x-sized syndrome
          fiber reintroduces an inverse-success factor and Omega(F_x)
          aggregate checks. No source-independent retry distribution is
          stated.
        memory: M_DEC plus Cl_S and candidate workspace
        data_or_queries: D_DEC plus all Q_PSI build and target evaluations
        parallel_wall_time: >-
          Independent syndrome evaluations and candidate checks may be split
          across workers, but aggregate work retains every evaluation and
          check. No work-preserving parallel decoder bound is stated.
        aggregate_parallel_work: A_DEC + Q_PSI + L_DEC + F_x*N^o(1)
        multi_target_total: >-
          A_DEC + Q_PSI(build) + sum_i(Q_PSI(i)+L_DEC(i)+F_i*N^o(1)); shared
          preprocessing must be compared with M+t*N/M BSGS at the same t.
      required_end_to_end_inequalities:
        - sigma^s >= N^(1-o(1)) for the stated N^o(1) candidate guarantee
        - size(Cl_S) <= N^(1/3+o(1))
        - Q_PSI <= N^(1/3+o(1))
        - A_DEC <= N^(1/3+o(1))
        - M_DEC <= N^(1/3+o(1))
        - D_DEC <= N^(1/3+o(1))
        - L_DEC <= N^(1/3+o(1))
        - decoder_success_probability >= N^(-o(1))
      first_false_or_missing_inequality: >-
        The first state-space inequality is missing:
        sigma^s >= N^(1-o(1)) together with an achieved
        D_S >= N^(1-o(1)). It is false whenever
        s < (1-o(1))*log_sigma(N). Even if that entropy condition is later
        met, A_DEC+D_DEC+M_DEC and Q_PSI remain uncharged for the inverse
        decoder and recurrence closure.
      conditional_assembly: >-
        If the closed family, every evaluation, a complete source-independent
        decoder, its build/data/memory, its target query, and its N^o(1)
        candidate guarantee all satisfy the displayed inequalities, direct
        verification preserves N^(1/3+o(1)). The packet does not derive those
        jointly compatible premises.
      incumbent_embedding: >-
        D_S(R) is a public observable of the original group point. It can be
        recomputed as a hash-like label inside rho or stored beside BSGS
        entries at its evaluation overhead. Without a cheaper inverse decoder,
        the observable inherits the rho/BSGS exponents; an explicit complete
        syndrome dictionary costs Theta(N) entries.
      j1_verdict: breaks
      j1_verdict_reason: >-
        Syndrome entropy, recurrence-evaluation work, inverse-decoder
        preprocessing/data/memory, and retry completeness are not jointly
        bounded. This leaves the advertised end-to-end exponent
        underived without asserting that every future closed syndrome family
        must fail.

  joint_findings:
    joint: J1-blind-baseline-and-cost-rederivation
    verdict: breaks
    candidate_attestations:
      - statement_id: BLIND-CW
        verdict: breaks
        first_break: missing_window_entropy_and_target_fiber_inequality
      - statement_id: BLIND-FIBER
