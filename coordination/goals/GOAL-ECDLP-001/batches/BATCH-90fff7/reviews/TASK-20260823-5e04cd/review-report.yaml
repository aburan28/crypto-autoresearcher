      - statement_id: BLIND-EDS
        verdict: breaks
        first_break: missing_syndrome_entropy_and_achieved_image_inequality
    synthesis: >-
      All three conditional implications become exponent-correct only after
      granting the very construction, inverse-location, candidate, or
      completeness bounds that carry the improvement. From the blind packet,
      none supplies a complete single-target end-to-end cost, and none supplies
      a matched multi-target or parallel aggregate-work bound. The result is a
      break of J1 sufficiency, not a verdict on J2-J4 and not a mathematical
      closure of any object family.

