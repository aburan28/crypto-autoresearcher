review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-BATCH-90fff7
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-90fff7
  recorded_at: '2026-08-23'
  coordinator_prior: >-
    I expect at least two of the three proposed objects to fail the lossy-object,
    circular-oracle, observation-collision, or end-to-end cost audit. I assign
    low confidence that any candidate survives to a future specification and
    zero confidence that this zero-run batch itself establishes an ECDLP
    improvement. The informative positive outcome would be one candidate with
    a genuinely new object, a public propagation law, a non-circular target
    decoder, and no immediate exponent-accounting contradiction.
  claim_under_review: >-
    Whether any of three frozen object-first proposals is sufficiently
    well-defined and unbroken to merit a separately authorized specification
    batch. No attack, implementation, empirical result, scientific promotion,
    closure, or breakthrough is under review.
  joints:
    - id: J1-blind-baseline-and-cost-rederivation
      owner_task_id: TASK-20260823-a82a71
      owner_role: validator
      attack_plan: >-
        Read only the frozen blind statement packet, the review plan, the
        snapshot receipt, and cited public baseline statements. For each
        candidate independently derive the state-space size, per-attempt work,
        memory, preprocessing, data/query cost, success probability, retry
        multiplier, verification cost, and multi-target amortization. Try to
        reconstruct Pollard rho and BSGS as parameter slices and identify the
        first missing or false inequality. Never read the producer proposals,
        proof maps, source audit, frontier table, selection report, or receipt.
      expected_break: >-
        At least one candidate will omit a retry, enumeration, preprocessing,
        or target-decoder charge, or will fail to embed the incumbent baseline.
    - id: J2-lossiness-propagation-and-identifiability
      owner_task_id: TASK-20260823-4284b8
      owner_role: red-team
      attack_plan: >-
        Determine whether each tracked object is actually lossy, whether the
        discarded information is compatible with curve operations, and whether
        distinct ground-truth states collide while requiring different decoder
        outputs. Build the cheapest explicit observation-fiber collision and
        test whether any proposed propagation law survives it.
      expected_break: >-
        A reversible coordinate change or an observation collision will break
        at least one proposal.
    - id: J3-circularity-quantifiers-and-proves-too-much
      owner_task_id: TASK-20260823-4284b8
      owner_role: red-team
      attack_plan: >-
        Search for a hidden DLP/CDH oracle, target-trained observable, full pair
        table, excluded curve condition, or witness that depends on the target,
        seed, curve, or characteristic contrary to the claim. Apply all named
        known-false controls and require a different signature on each.
      expected_break: >-
        At least one proposal will reverse a quantifier or smuggle an incumbent-cost oracle.
    - id: J4-source-novelty-pareto-and-steering
      owner_task_id: TASK-20260823-4284b8
      owner_role: red-team
      attack_plan: >-
        Compare every mechanism against direct committed predecessors and
        retrieved primary sources, check provenance, and reconstruct separate
        realized and conditional Pareto tables over time, memory,
        preprocessing, data/queries, verification, and multi-target axes.
        Unknown axes are incomparable. Audit whether a higher-value route was
        suppressed or an established family was renamed.
      expected_break: >-
        Novelty will remain unverified because the derived KB is unavailable,
        and at least one conditional Pareto claim will require narrowing.
  blindness:
    reviewers_may_read_sibling_reports: false
    lifted_for: []
    validator_allowed_paths:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/review-plan.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/archives/TASK-20260823-bc16df/snapshot-receipt.json
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/blind-statement-packet.yaml
      - docs/target-result-profile.md
      - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-c36939.yaml
    red_team_allowed_scope: full frozen producer snapshot except the Validator report
  blind_rederivation:
    task_id: TASK-20260823-a82a71
    statement_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/blind-statement-packet.yaml
    blind_from:
      - ledger/proposals/IDEA-20260823-6284e8.yaml
      - ledger/proposals/IDEA-20260823-38f214.yaml
      - ledger/proposals/IDEA-20260823-850562.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/object-frontier.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/source-audit.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/proof-search-portfolio.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/selection-report.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/runtime-session-receipt.json
    rule: >-
      The Validator never reads any blind_from path, before or after deriving.
      The task ends after writing its report and receipt; there is no later
      snapshot-audit phase in that session. The Red Team, not the blind
      Validator, verifies producer semantics and source bindings.
  proves_too_much_controls:
    - id: PTM-1-random-relabelled-curve
      known_false_conclusion: A coordinate marginal or bucket statistic alone yields target-dependent DLP information.
      required_signature: The mechanism must lose its claimed decoder or propagation advantage after a public random relabelling that preserves marginal sizes but destroys curve-operation compatibility.
    - id: PTM-2-generic-prime-cyclic-labels
      known_false_conclusion: A curve-specific exponent gain follows using only generic prime-order group labels and group operations.
      required_signature: The proposal must identify a non-generic, publicly computable ingredient unavailable in the generic group model and charge its evaluation.
    - id: PTM-3-hidden-dlp-or-full-table
      known_false_conclusion: A DLP-derived key or materialized quadratic pair table is a sub-rho observable.
      required_signature: The complete cost model must reject the object at or above the incumbent cost before reporting any downstream gain.
  composition_rule: >-
    The Coordinator composes J1 through J4 only after both reports are terminal,
    strict-parse, hash-bind to the snapshot, attest to no sibling-report read,
    and check_review_independence passes. One surviving joint does not make a
    whole candidate PASS. A target-class candidate requires every joint to
    hold; otherwise the disposition is REVISE, REJECT, or no selection.
  authority_boundary: >-
    Neither review authorizes implementation, execution, a hypothesis or
    experiment status change, evidence promotion, closure, or a breakthrough.
    Any actual breakthrough claim would require later empirical/proof evidence
    satisfying C1-C18 and another claim-specific review-breakthrough/max round.
