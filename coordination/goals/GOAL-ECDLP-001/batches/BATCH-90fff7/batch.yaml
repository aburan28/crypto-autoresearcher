objective: >-
  Generate exactly three genuinely distinct, object-first mechanisms for
  prime-field ECDLP that could change the attack exponent if their stated
  structural obligations held. Each mechanism must define a genuinely lossy,
  publicly computable object, show how it propagates through elliptic-curve
  operations, reproduce the Pollard-rho/BSGS baseline, expose an observation
  collision, state quantifier order and a method ceiling, and provide complete
  time, memory, preprocessing, data/query, retry, verification, and multi-target
  accounting. Select at most one for future specification; produce no code or
  experiment run.

established_primary_lenses_off_limits:
  - JPR bookkeeping repair or a pruning-ratio-only Wagner variant
  - summation-polynomial factor-base or Groebner-basis parameter polishing
  - GLV, automorphism, negation-map, rho distinguished-point, or parallel-rho constant factors
  - MOV, Frey-Ruck, pairing, trace-zero, anomalous-curve, or small-subgroup transfer on already excluded standard-curve conditions
  - generic N^(2/3) preprocessing with N^(1/3) online advice presented as an end-to-end single-target gain
  - CM-null calibration without a charged decoder
  - fixed-order Fourier moments without an efficient logarithmic-order bridge
  - quantum resource optimization presented as a classical ECDLP exponent breakthrough

candidate_requirements:
  - >-
    Name the tracked object and prove that it is lossy rather than a reversible
    coordinate change; state exactly what information it discards.
  - >-
    Define one-step propagation under point addition/doubling or another
    explicitly charged curve operation, with a deterministic or quantified
    probabilistic law and a falsification condition.
  - >-
    Exhibit the public target-dependent information and decoder that connect
    the object to recovery of k from Q=kP; forbid hidden DLP, CDH, pair-table,
    target-trained, or uncharged preprocessing oracles.
  - >-
    Reproduce Pollard rho and BSGS as exact parameter slices and give
    per-attempt cost times inverse success probability on every cost axis.
  - >-
    Supply the four proof-search audits and one known-false nearby-object
    control before proposing implementation.
  - >-
    Record citation provenance. The unavailable derived KB is disclosed;
    repository records and retrieved primary sources are read directly.

selection_rule: >-
  Select at most one candidate only if it is not a renamed established family,
  has no immediate observation collision or circular oracle, and has a
  concrete cheapest discriminating test below the cost of an implementation.
  If none qualifies, select none and preserve the strongest measured or
  derived obstruction plus its resource reversal. Unknown Pareto axes are
  incomparable and may not be used to assert domination.

