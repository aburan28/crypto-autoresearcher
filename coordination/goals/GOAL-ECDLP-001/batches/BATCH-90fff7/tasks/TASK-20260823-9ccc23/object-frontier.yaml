cross_frontier_findings:
  common_bottleneck: >-
    All three objects are publicly evaluable and genuinely lossy, but the
    discarded state reappears as boundary symbols, sheet provenance, or
    out-of-set recurrence indices. No charged arbitrary-target locator survives
    below the rho baseline.
  obstruction_quantity:
    name: hidden-state resynchronization cost
    measurement_status: not_measured
    units: charged operations and bits of provenance
    error_bars: unavailable because zero runs were authorized
    scope: the three defined proposals only
    resource_check:
      examined: true
      reading: >-
        The lossiness is also the proposed resource: a useful object would need
        a theorem that the hidden state re-synchronizes with bounded entropy.
        Special translation-compatible covers, low-complexity symbolic factors,
        or recurrence-closed codes remain concrete successor conditions.
  nonclosure_boundary: >-
    This frontier does not prove that object-first ECDLP approaches are
    impossible. It identifies three exact propagation or decoding joints whose
    failure would reject only the corresponding mechanism and parameter scope.
