record_type: proof_search_portfolio
task_id: TASK-20260823-9ccc23
goal_id: GOAL-ECDLP-001
recorded_at: "2026-08-23"
purpose: >-
  Precompute the cheap falsification architecture for three proof-oriented
  object-first proposals. These are specified audits, not executed experiments
  and not evidence.
shared_baseline_reproduction:
  symbol: N
  pollard_rho:
    expected_time: N^(1/2+o(1)) group operations
    expected_memory: O(1) serial state
    exact_charges:
      - group operations
      - distinguished-point or collision detection
      - retries from success probability
      - parallel coordination and aggregate work
      - candidate verification
  baby_step_giant_step:
    expected_time: N^(1/2+o(1)) group operations
    expected_memory: N^(1/2+o(1)) group elements
    exact_charges:
      - baby-table construction
      - sorting or hashing
      - giant steps
      - table memory
      - candidate verification
  comparison_rule: >-
    Candidate preprocessing, enumeration, linear algebra, target descent,
    retries, verification, memory, data or queries, parallelism, and
    multi-target amortization must be placed on the same ledger.
maps:
  - proposal_id: IDEA-20260823-6284e8
    target_statement: >-
      Coordinate-character windows admit a public compressed cyclic-substring
      locator with sub-square-root construction and arbitrary-target query cost.
    quantifier_order: >-
      There exists one preprocessing algorithm A depending only on public curve
      parameters, P, f, chi, and m such that for every Q in the subgroup, A's
      locator returns all x satisfying Q=xP within the declared charged bound.
    lemmas:
      - id: CW-L1
        statement: W_m is public and lossy with explicitly bounded collision multiplicity
        proof_route: character-alphabet counting plus exceptional-value conventions
        failure_mode: collision count remains too large for target location
      - id: CW-L2
        statement: propagation is an exact shift with a predictable boundary rule
        proof_route: derive the shift identity and seek a source-independent recurrence
        failure_mode: equal windows have unequal next symbols
      - id: CW-L3
        statement: the full cyclic word has grammar size at most N^(1/3+o(1))
        proof_route: algebraic symbolic-dynamics compression theorem
        failure_mode: random-word control or lower bound forces near-linear grammar
      - id: CW-L4
        statement: arbitrary target windows are located within N^(1/3+o(1)) work
        proof_route: compressed pattern index with bounded ambiguity
        failure_mode: query construction scans or stores the orbit
      - id: CW-L5
        statement: total expected cost is target bound times inverse success probability
        proof_route: explicit composition and verification ledger
        failure_mode: success probability or retries restore square-root cost
    audits:
      exact_baseline_reproduction:
        status: not_run
        artifact_required: baseline worksheet with rho and BSGS exact charges
      observation_collision_search:
        status: not_run
        object_pair: points with equal W_m and unequal next symbol
        minimal_range: small prime-order curves with several m and fixed-degree f
        null_control: random cyclic words with the same length and alphabet
        stopping_condition: first reproducible collision or exhausted preregistered range
      quantifier_order_statement:
        status: completed_as_definition
        caveat: no theorem is claimed
      method_ceiling:
        status: not_run
        nearby_object: random cyclic word
        known_false_conclusion: generic random words have group-law-induced public compression
        proves_too_much_test: reject any argument that derives compression without using curve-specific structure
    proof_dependencies:
      - character-sum or symbolic-complexity bound
      - public grammar-construction algorithm
      - exact substring-location theorem
    required_blind_quantity: grammar size and arbitrary-target locator cost
    expected_ceiling: absent CW-L3 and CW-L4, location is a scan, full index, or generic collision search
  - proposal_id: IDEA-20260823-38f214
    target_statement: >-
      A degree-three cover fiber label has bounded public provenance under
      translation and can be inverted to scalar locations below square-root cost.
    quantifier_order: >-
      There exists one fixed public cover pi and preprocessing A depending only
      on the curve and P such that for every Q, A inverts pi(Q) to the correct
      scalar candidates within the declared charged bound.
    lemmas:
      - id: FIBER-L1
        statement: generic and exceptional fiber sizes and rationality are explicitly bounded
        proof_route: separability, ramification, and rational-point analysis
        failure_mode: exceptional fibers dominate the claimed range
      - id: FIBER-L2
        statement: coordinate elimination yields a bounded-degree public C_P
        proof_route: fixed-degree resultants with all coefficients and costs explicit
        failure_mode: degree or coefficient growth is hidden
      - id: FIBER-L3
        statement: N^(o(1)) provenance makes long translation deterministic
        proof_route: monodromy or automaton theorem
        failure_mode: same-fiber different-successor collisions force growing provenance
      - id: FIBER-L4
        statement: inverse location of U(Q) costs at most N^(1/3+o(1))
        proof_route: jump composition plus bounded-width backward traversal
        failure_mode: branch frontier or pair table reaches square-root size
      - id: FIBER-L5
        statement: verification and ambiguity preserve the target bound
        proof_route: explicit candidate-list and retry calculation
        failure_mode: candidate multiplicity restores generic cost
    audits:
      exact_baseline_reproduction:
        status: not_run
        artifact_required: comparison worksheet charging elimination, tables, branches, and verification
      observation_collision_search:
        status: not_run
        object_pair: points in one pi-fiber with different translated pi-values
        minimal_range: small prime-order curves and separable degree-three maps
        null_control: random degree-three set maps with matched fiber sizes
        stopping_condition: first collision or exhausted preregistered family
      quantifier_order_statement:
        status: completed_as_definition
        caveat: no cover satisfying it is known
      method_ceiling:
        status: not_run
        nearby_object: random bounded-degree correspondence
        known_false_conclusion: every bounded local correspondence has a compact inverse scalar decoder
        proves_too_much_test: reject any proof using local degree alone to bound long-run branch width
    proof_dependencies:
      - rational-fiber and ramification theorem
      - translation-compatible monodromy bound
      - provenance-entropy bound
      - inverse-location algorithm
    required_blind_quantity: reachable-state width and provenance bits versus step length
    expected_ceiling: local bounded degree does not prevent exponential branches or an N-sized transition table
  - proposal_id: IDEA-20260823-850562
    target_statement: >-
      A source-independent recurrence-closed residue syndrome supports general
      prime-field ECDLP target descent without pairings, field DLP, or full EDS association.
    quantifier_order: >-
      There exists one public index family S and preprocessing A depending only
      on the curve, P, and chi such that for every Q, A recovers the scalar from
      D_S(Q) within the declared charged bound and excluded transfers are never invoked.
    lemmas:
      - id: EDS-L1
        statement: D_S is public and lossy with a bounded scalar candidate multiplicity
        proof_route: character-residue collision analysis
        failure_mode: syndrome fibers contain square-root or more scalar candidates
      - id: EDS-L2
        statement: every propagation identity is correct with zeros, poles, and scaling handled
        proof_route: exact division-polynomial algebra followed by character mapping
        failure_mode: sentinel or normalization destroys the claimed recurrence
      - id: EDS-L3
        statement: recurrence closure of S has size at most N^(1/3+o(1))
        proof_route: combinatorial closure theorem for required index products
        failure_mode: closure reaches square-root size or the full orbit
      - id: EDS-L4
        statement: arbitrary target syndrome descends to scalar candidates within the same bound
        proof_route: recurrence-code decoder distinct from established EDS reductions
        failure_mode: residual step is ECDLP, pairing, field DLP, rho, or BSGS
      - id: EDS-L5
        statement: full expected cost remains below rho after retries and verification
        proof_route: exact cost composition
        failure_mode: candidate enumeration or success probability restores square-root cost
    audits:
      exact_baseline_reproduction:
        status: not_run
        artifact_required: worksheet charging closure, recurrence evaluations, target descent, and verification
      observation_collision_search:
        status: not_run
        object_pair: points with equal D_S and unequal translated syndrome or closure residues
        minimal_range: small prime-order curves and several fixed public index sets
        null_control: random codes with matched alphabet, length, and collision rate
        stopping_condition: first collision or exhausted preregistered range
      quantifier_order_statement:
        status: completed_as_definition
        caveat: no recurrence-closed family or decoder is claimed
      method_ceiling:
        status: not_run
        nearby_object: EDS association instance whose residual problem is standard ECDLP
        known_false_conclusion: division-polynomial recurrence identities alone solve the residual ECDLP
        proves_too_much_test: reject any proof that silently treats association as inversion
    proof_dependencies:
      - exact character-valued division-polynomial identities
      - closure-size theorem
      - scalar candidate-multiplicity bound
      - transfer-free decoder
    required_blind_quantity: closure size and residual scalar-candidate count
    expected_ceiling: known EDS equivalences can restate the target while leaving generic ECDLP intact
portfolio_order:
  cheapest_first:
    - observation-collision audit for IDEA-20260823-38f214
    - observation-collision audit for IDEA-20260823-6284e8
    - recurrence-closure audit for IDEA-20260823-850562
    - only then attempt decoder theorems
  rationale: >-
    A single collision or explosive closure falsifies the corresponding
    deterministic propagation premise more cheaply than implementing a decoder.
