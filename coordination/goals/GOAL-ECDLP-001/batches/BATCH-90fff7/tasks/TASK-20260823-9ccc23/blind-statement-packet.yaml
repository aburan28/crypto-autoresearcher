record_type: blind_statement_packet
task_id: TASK-20260823-9ccc23
goal_id: GOAL-ECDLP-001
recorded_at: "2026-08-23"
blindness_purpose: >-
  Supply definitions, parameter ranges, formal claims, and baseline quantities
  for independent re-derivation. This packet contains no producer derivations,
  rankings, source-audit conclusions, or expected verdicts.
common_definitions:
  curve: E over the prime field F_p
  subgroup: cyclic prime-order subgroup generated by P
  subgroup_order: N
  target_point: Q in the subgroup
  unknown_scalar: x in Z/NZ satisfying Q equals xP
  public_inputs: [E, p, N, P, Q]
  direct_verification: check whether xP equals Q
baseline_quantities:
  pollard_rho:
    time: N^(1/2+o(1)) group operations
    memory: O(1) serial state
  baby_step_giant_step:
    time: N^(1/2+o(1)) group operations
    memory: N^(1/2+o(1)) group elements
  accounting_identity: expected total cost equals per-attempt cost times inverse success probability
  charged_dimensions:
    - preprocessing
    - enumeration
    - linear algebra
    - target descent
    - retries
    - verification
    - memory
    - data or queries
    - aggregate parallel work
    - multi-target amortization
statements:
  - statement_id: BLIND-CW
    proposal_id: IDEA-20260823-6284e8
    definitions:
      rational_function: fixed public nonconstant f on E of degree independent of N
      character: fixed public multiplicative character chi with an explicit value convention at zero and poles
      window: >-
        W_m(R) is the ordered tuple chi(f(R+jP)) for integers j from zero
        through m minus one.
    parameter_ranges:
      window_length: 1 <= m <= ceiling((log N)^c) for a fixed public constant c in the first audit
      character_order: fixed independently of N
      target_cost_bound: N^(1/3+o(1))
    formal_claims_for_rederivation:
      - >-
        W_m(R+P) consists of entries two through m of W_m(R), followed by
        chi(f(R+mP)).
      - >-
        For m less than log base kappa of N, where kappa is the alphabet size,
        W_m cannot be injective on an N-point subgroup.
      - >-
        If a source-independent representation of the complete cyclic word has
        construction time and memory at most N^(1/3+o(1)), and supports
        arbitrary length-m substring location within N^(1/3+o(1)) time, then
        scalar candidates can be returned within those bounds and checked by
        direct verification.
    load_bearing_quantities:
      - number of distinct W_m values
      - maximum and mean preimage size
      - number of equal-window pairs with unequal successor symbol
      - size and construction cost of the complete-word representation
      - arbitrary-target location time and candidate-list size
  - statement_id: BLIND-FIBER
    proposal_id: IDEA-20260823-38f214
    definitions:
      cover: fixed public separable rational map pi from E to the projective line of degree three
      fiber_label: U(R) equals pi(R)
      translation_correspondence: >-
        C_P(u,v) is obtained by eliminating R from u equals pi(R) and
        v equals pi(R+P).
    parameter_ranges:
      cover_degree: 3
      field: prime
      target_cost_bound: N^(1/3+o(1))
    formal_claims_for_rederivation:
      - A geometric fiber of a separable degree-three map has at most three points counted without multiplicity away from ramification.
      - C_P is a public algebraic correspondence for fixed public pi and P.
      - >-
        If a public provenance alphabet of N^(o(1)) states makes translation
        deterministic, jump composition and inverse location both cost at most
        N^(1/3+o(1)), and candidate multiplicity is N^(o(1)), then scalar
        candidates can be returned and directly verified within
        N^(1/3+o(1)) time and memory.
    load_bearing_quantities:
      - rational and geometric fiber-size distributions
      - number of equal-U point pairs with unequal translated U
      - reachable correspondence width by step length
      - minimum provenance bits needed for deterministic update
      - inverse-location candidate count, time, and memory
  - statement_id: BLIND-EDS
    proposal_id: IDEA-20260823-850562
    definitions:
      division_polynomials: standard psi_n associated with E
      character: fixed public multiplicative character chi with explicit zero and pole sentinels
      index_family: fixed public finite set S of positive integers
      residue_syndrome: D_S(R) is the tuple chi(psi_n(R)) indexed by n in S
    parameter_ranges:
      initial_index_count: at most ceiling((log N)^c) for fixed public c
      index_bitlength: polylogarithmic in N
      target_cost_bound: N^(1/3+o(1))
    formal_claims_for_rederivation:
      - >-
        For valid nonexceptional inputs, the standard division-polynomial
        multiplication identity relates psi_n([a]R), psi_na(R), and
        psi_a(R) raised to an n-squared power.
      - Applying chi maps that multiplicative identity to a character identity when every term and sentinel convention is valid.
      - >-
        If a source-independent index family closed under all identities used
        by the decoder has size, construction time, and memory at most
        N^(1/3+o(1)), and arbitrary target syndromes yield N^(o(1)) scalar
        candidates within N^(1/3+o(1)) time without a pairing or field
        discrete logarithm, then direct verification preserves the stated bound.
    load_bearing_quantities:
      - syndrome preimage-size distribution
      - equal-syndrome unequal-successor count
      - number and bitlength of indices after recurrence closure
      - division-polynomial evaluation count
      - residual scalar-candidate count
      - target-descent time and memory
