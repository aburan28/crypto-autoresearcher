  baseline_comparison:
    pollard_rho: >-
      The frozen realized baseline has expected time exponent 1/2 and serial
      memory exponent 0. No frozen realized candidate has a lower time
      exponent. Scan/table/linear-closure rows are worse; generic-location rows
      retain exponent 1/2 with extra object evaluation.
    baby_step_giant_step: >-
      The frozen realized baseline has time and memory exponents 1/2. Full
      window, transition, or EDS association tables have exponent 1 and are
      worse. Each hypothetical N^(1/3) candidate would beat BSGS in time and
      memory only if its complete unproved decoder conditions and all unknown
      axes were discharged.
    conditional_frontier: >-
      Each claimed N^(1/3) point has lower time but higher memory/data than
      serial rho and therefore is Pareto-incomparable with rho even under its
      premises. None is a realized frontier point, and unknown multi-target or
      data/query coordinates cannot establish domination.

  steering_and_suppression_audit:
    promising_path_deliberately_suppressed: false
    unjustified_lane_closure_detected: false
    select_none_as_preimplementation_action: supported
    selection_rationale_quality: revise
    finding: >-
      Selecting none is conservative and the frozen records retain all three
