      IDEA-20260823-6284e8: >-
        Reopen only with a source-only, curve-specific theorem and constructor
        that fails on the random-relabelled word, plus an arbitrary-target
        occurrence locator and fiber/output bound. A generic supplied-text
        grammar or target-trained index does not qualify.
      IDEA-20260823-38f214: >-
        Do not reopen merely on N^o(1) provenance. First specify whether the
        target-initializable state is lossy, multivalued, or injective. An
        injective deterministic state must include a mechanism-distinct
        iterate-index decoder; a lossy state must give an output-sensitive
        global branch algorithm with all candidate paths charged.
      IDEA-20260823-850562: >-
        First fix the exact index equivalence, normalization, zero/pole rules,
        and multiplier semigroup. Prove that one target-independent closure
        covers every Q below square-root size without using x, or supply a
        decoder that does not use the direct psi_(nx) association route.
    resource_reversal: >-
      Lossiness can be a resource only through controlled multivalued output,
      not deterministic compression on the prime cycle. The useful successor
      question is whether branching can be generated and inverted
      output-sensitively without restoring point identity or a scalar table.
      This is a proposal-level reading, not evidence or a spawned task.
    spawned_ids: []

  objections:
    - id: RT-O1-LOSSINESS-SCOPE
      severity: material_mechanism_defect
      status: validated_static
      finding: >-
        The portfolio-wide statement that all three objects are genuinely
        lossy is unsupported. The cover claim has an explicit degree-three
        injective subgroup counterexample, and the other tuple codomains can
        exceed N.
    - id: RT-O2-PRIME-CYCLE-CLOSURE
      severity: blocking_for_deterministic_propagation
      status: validated_static
      finding: >-
        On a prime cycle, a public nonconstant deterministic factor is
        injective. Therefore every claimed lossy deterministic propagation
        rule either fails on an observation collision or restores full point
        identity.
    - id: RT-O3-EDS-QUANTIFIER-CLOSURE
      severity: blocking_for_stated_direct_identity_route
      status: validated_static
      finding: >-
        A source-independent set supporting the displayed multiplication
        identity for every unknown x needs Theta(N) index closure. Choosing the
        actual x-dependent closure is circular.
    - id: RT-O4-SOURCE-COVERAGE
      severity: material_novelty_and_distinctness_defect
      status: validated_against_committed_scope
      finding: >-
        Direct committed predecessor families for scalar-orbit characters,
        cover-sheet/provenance routing, and EDS/net index location were omitted.
