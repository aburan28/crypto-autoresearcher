  required_controls:
    - >-
      Add the prime-cycle deterministic-factor lemma as the first static gate
      for every proposed time-homogeneous lossy translation state.
    - >-
      Bind the two explicit F_5 cover certificates as positive hidden-
      invertibility and negative propagation controls; any general cover claim
      must distinguish both.
    - >-
      For EDS, publish the exact set of index multipliers used by the decoder
      and its closure modulo N, with sign/normalization equivalences. Reject an
      all-target closure of linear size before implementation.
    - >-
      Reissue the source audit with the omitted committed IDEA-110, IDEA-010,
      IDEA-195, IDEA-120, IDEA-006, and P1540 boundaries and resolve the two
      citation locator/attribution conflicts.
    - >-
      Reissue separate realized and conditional Pareto tables with one row per
      realization and explicit time, memory, preprocessing, data/query unit,
      verification/output, and multi-target coordinates. Preserve unknowns as
      incomparable.
    - >-
      Mark the frozen proof-search audits as specified_not_run and do not claim
      they were executed. A later successor may cite this red-team report's
      static certificates only after Coordinator archival.

  proof_architecture_challenges:
    observation_fiber: >-
      Coordinate windows have a universal equal-window/unequal-boundary result
      in the forced-lossiness range. Degree-three covers have both an injective
      rational-subgroup example and an explicit same-fiber/unequal-successor
      example. Fixed EDS syndromes have an explicit collision example. Each
      identifies the exact missing separator.
    quantifier_order: >-
      CW and fiber state the correct source-before-target order but assume the
      missing locator. EDS cannot use its displayed psi_(nx) identity uniformly
      with a sublinear source-only closure; an x-dependent set reverses the
      order.
    boundary_and_strictness: >-
      No realized row is strictly better than rho. Each hypothetical N^(1/3)
      row would trade lower time for higher memory/data than serial rho and is
      conditional on the operation under review.
    method_ceiling: >-
      Deterministic prime-cycle factors are injective or constant; local fiber
      degree does not imply global indexability; and direct all-target EDS
      multiplier closure is linear. These ceilings block the stated current
      routes, not every approximate, randomized, multivalued, or
      mechanism-distinct successor.
    nearby_object: >-
      Random words preserve CW's definitional shift; random matched partitions
      preserve fiber sizes but lose compact C_P; random syndrome labels lose
      division-polynomial recurrence. Only the latter two name a concrete
      non-generic local separator, and neither connects it to scalar location.
    compositional_invariant: >-
      Adding a boundary symbol, sheet label, or out-of-set residue can make one
      step exact, but repeated composition either grows provenance/indices or
      yields an injective state. Deleting that component recreates the explicit
      observation collision; retaining it requires a target initializer and
      iterate-index decoder.

  heuristic_challenges:
    - >-
      Coordinate-character pseudorandomness cannot simultaneously be cited as
      evidence for random-like behavior and left unexamined when H-CW-1 asks for
      a highly compressible full word. A positive grammar theorem must explain
      the structured deviation and fail under PTM-1.
    - >-
      Small rational cover fibers do not bound long-run branch entropy. The
      prime-cycle lemma shows deterministic closure buys injectivity, not a
      lossy automaton.
    - >-
      Division-polynomial recurrence identities are exact algebra, but exact
      evaluation is not evidence for small target-index closure or scalar
      inversion.

  cost_model_challenges:
    - >-
      Do not compare query-only locator cost with rho while hiding the grammar,
      transition table, provenance initializer, or closure construction in
      source preprocessing.
    - >-
      Candidate-list verification is part of target descent. Observation fiber
      size is an output lower bound, even when each scalar check is only
      polylogarithmic.
    - >-
      A reusable source table is not free in a single-target claim. For a
      multi-target claim, state the target count and report both total and
      amortized work/memory.

  reduction_and_scope_challenges:
    - >-
      Shoup's lower bound applies to generic-label algorithms. The coordinate,
      rational-map, and division-polynomial evaluations are non-generic, but no
      frozen theorem turns any one of them into a sub-rho scalar locator.
    - >-
      The prime-cycle lemma is narrow: it concerns deterministic public
      time-homogeneous factors of +P. It is not an impossibility result for
      approximate statistics, randomized branching, batched relations, or all
      coordinate-aware ECDLP algorithms.
    - >-
      The all-target EDS closure result concerns the displayed multiplication-
      identity route. It does not prove that every possible nonlinear residue
      decoder is impossible.

  narrowest_supported_statement: >-
    The frozen packet contains three pairwise distinguishable proposal
    descriptions and honestly establishes no attack, experiment, or
    improvement. On J2-J4, none currently merits specification: forced-lossy
    coordinate windows are not deterministic factors; degree-three geometric
    fibers are neither guaranteed lossy on the subgroup nor globally
    indexable; and the direct all-target division-polynomial identity route
    needs linear index closure or target-dependent indices. All three locator
    premises remain uninstantiated, direct committed predecessor coverage is
    incomplete, and the Pareto tables require realized/conditional separation.
    These are scoped static breaks of the stated routes, not closure of
    object-first ECDLP research and not evidence of ECDLP hardness or weakness.

  next_concrete_action: >-
    The Coordinator should preserve select_none and ledger-dispose this review
    round as REVISE without implementation or experiments. Any additive
    successor should first incorporate the prime-cycle lemma and explicit F_5
    certificates, repair direct-predecessor/citation coverage, and present one
    candidate-specific non-circular locator plus a separately typed Pareto
    table. No successor, budget increase, status transition, closure, or
    execution is authorized by this report.

