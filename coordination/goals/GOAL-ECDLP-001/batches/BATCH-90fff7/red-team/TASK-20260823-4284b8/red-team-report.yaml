        are assigned one domination statement, and unknown preprocessing,
        data/query, and multi-target coordinates are treated as addressed.
    - id: RT-O6-AUDITS-NOT-RUN
      severity: protocol_completion_defect
      status: validated_from_frozen_artifacts
      finding: >-
