  candidate_attestations:
    - proposal_id: IDEA-20260823-6284e8
      title: Elliptic-coordinate character windows
      J2-lossiness-propagation-and-identifiability:
        verdict: breaks
        finding: >-
          In the advertised lossy range kappa^m<N, a nonconstant cyclic word
          forces an equal-window pair with unequal next symbols. Thus W_m is
          lossy but not a deterministic factor. If the underlying character
          word is constant, it contains no target-location information. For
          m large enough to evade the counting collision, lossiness is no
          longer established and W_m may be an injective fingerprint. The
          proposal therefore does not exhibit an object that is both genuinely
          lossy and closed under propagation.
        identifiability: >-
          A decoder restricted to W_m(Q) must handle a fiber of average size at
          least N/kappa^m. Returning and verifying all candidates costs at
          least that many checks on some fiber. If the decoder instead uses Q
          to restore information omitted by W_m, it has returned to the
          original point representation and still needs an iterate-index
          algorithm.
      J3-circularity-quantifiers-and-proves-too-much:
        verdict: breaks
        holds: >-
          The written quantifier order is correct: one source-only grammar and
          locator must be fixed before Q and work for every target. The record
          also correctly rejects target-trained grammars and materialized
          scalar-location tables.
        break: >-
          The only route beyond the definitional shift relation is the assumed
          source-independent compressed grammar plus arbitrary-substring
          locator. No construction or curve-specific implication supplies
          either. The same conditional implication remains true for an
          arbitrary cyclic word if one simply assumes an equally strong
          locator, so it does not separate the known-false relabelled/generic
          controls. This is an explicit uninstantiated decoder premise rather
          than a hidden oracle, but it leaves no current mechanism after the
          full-table oracle is rejected.
      J4-source-novelty-pareto-and-steering:
        verdict: breaks
        holds: >-
          novelty_status unverified and the bounded nonselection are honest.
          The source audit correctly limits the coordinate-character paper to
          distributional context and does not claim that it supplies a locator.
        break: >-
          The direct committed predecessor audit omits ECDLP-IDEA-110, which
          already studies the same scalar-orbit character sequence and random
          relabelling control, and omits committed supplied-word grammar and
          suffix-index controls. The new element is at most the window/grammar
          locator adaptation. The Pareto record also merges scan, full-index,
          and generic-collision realizations and does not separate them from
          the conditional N^(1/3) point across preprocessing, verification,
          and multi-target axes.

    - proposal_id: IDEA-20260823-38f214
      title: Degree-three cover fibers
      J2-lossiness-propagation-and-identifiability:
        verdict: breaks
        finding: >-
          Geometric degree three does not imply lossiness on the rational
          prime-order subgroup. A static five-point certificate below gives a
          separable degree-three map that is injective on the whole subgroup.
          A second degree-three map on the same curve gives a same-fiber pair
          with unequal successors. More generally, any publicly evaluable
          nonconstant deterministic augmented state for translation by a
          generator of a prime-order cycle is injective. Provenance either
          restores the entire point and destroys lossiness, remains ambiguous
          and fails propagation, or is path-only state that cannot be
          initialized from Q without walking the orbit or solving DLP.
        identifiability: >-
          Solving pi(R)=pi(Q) produces at most three geometric points, one of
          which is the already-public Q. It does not produce their scalar
          indices. Recovering every x with pi(xP)=pi(Q) is up to three ECDLP
          instances. If the augmented transition is injective, locating its
          iterate number is exactly the original orbit-index problem under a
          public representation change.
      J3-circularity-quantifiers-and-proves-too-much:
        verdict: breaks
        holds: >-
          The cover and preprocessing are quantified before every Q, and the
          record names pi and the bounded-degree algebraic correspondence as
          non-generic public ingredients. It rejects a target-specific cover,
          sheet oracle, scalar-labelled table, and uncharged branch catalog.
        break: >-
          The premise that the bounded-provenance automaton can be inverted to
          scalar locations is the missing ECDLP operation. Bounded local
          correspondence degree gives neither a global inverse nor an iterate
          index. Publicly computable provenance falls under the prime-cycle
          injective-or-constant lemma; non-public provenance is a hidden path
          oracle. After PTM-3 removes the full transition table, no non-circular
          inversion mechanism remains.
      J4-source-novelty-pareto-and-steering:
        verdict: breaks
        holds: >-
          The proposal makes no positive novelty claim and preserves special
          translation-compatible covers as an open condition.
        break: >-
          Calling this a new campaign proposal is not supported by the direct
          committed corpus. ECDLP-IDEA-010 and its P1548 gate already isolate
          cover fibers, sheet/branch selection, target-independent routing,
          and explicit-catalog cost; ECDLP-IDEA-195, P1549, P1550, and
          ECDLP-IDEA-120 already isolate bounded provenance, finite-state
          closure, and target path location. Reversing the cover direction to
          E-to-P1 is a specific adaptation, not a verified new lens. The
          conditional Pareto point omits data/query, success/retry, and
          multi-target coordinates and therefore cannot dominate a baseline.

    - proposal_id: IDEA-20260823-850562
      title: Division-polynomial residue syndromes
      J2-lossiness-propagation-and-identifiability:
        verdict: breaks
        finding: >-
          A tuple of polylogarithmically many fixed-alphabet residues is not
          automatically lossy; its codomain can already exceed N and can hide
          an injective fingerprint. In a concrete lossy instance below,
          S={2} and the quadratic character give the same nonzero syndrome on
          all four nonidentity points but an unequal translated successor at
          the point at infinity. Thus fixed syndromes are either ambiguous and
          not translation-closed, constant and uninformative, or potentially
          injective and no longer genuinely lossy.
        identifiability: >-
          Equal syndromes require a scalar candidate list unless the decoder
          uses Q itself, and an injective syndrome still needs an inverse from
          its residue tuple to the orbit index. Division-polynomial evaluation
          supplies values at a known point; it does not label that point by its
          unknown scalar.
      J3-circularity-quantifiers-and-proves-too-much:
        verdict: breaks
        holds: >-
          The proposal identifies division-polynomial identities as a
          non-generic ingredient and expressly rejects pairings, field DLP,
          full EDS association tables, and target-dependent S.
        break: >-
          Applying psi_n([x]P)=psi_(nx)(P)/psi_x(P)^(n^2) to an arbitrary
          target requires indices nx and x that depend on the unknown scalar.
          For one nonzero n, a source-only set closed under multiplication by
          every possible x in Z_N^* contains every nonzero residue class, or
          at least half after granting sign identification, hence Theta(N)
          indices. Choosing only the actual x-dependent indices reverses the
          quantifiers and presupposes x. Restricting to a fixed small
          multiplier set only evaluates known scalar multiples and does not
          invert the target. A mechanism-distinct decoder could escape this
          exact route, but none is supplied.
      J4-source-novelty-pareto-and-steering:
        verdict: breaks
        holds: >-
          The proposal accurately labels EDS/division-polynomial identities as
          established and its own fixed-syndrome decoder as novelty unverified.
        break: >-
          The direct predecessor audit omits ECDLP-IDEA-006 and its P1540
          independent audit, which already study elliptic-net/EDS recurrence
          compression, target index recovery, equivalence to the original
          translation orbit, and the hidden field-DLP/full-period boundaries.
          KN-TECH-009 and KN-LIT-247 make the same representation-versus-index
          distinction. The current proposal is at most a residue-code
          adaptation. Its claimed direct-source bindings also contain an
          unresolved Silverman arXiv identifier conflict and an uncorroborated
          Smart/Shipsey ePrint attribution. Its Pareto row does not separate a
          full association table, square-root closure, and the conditional
          N^(1/3) premise.

  prime_cycle_deterministic_factor_lemma:
    statement: >-
      Let N be prime, let s:Z_N->Omega be a public state, and suppose one fixed
      deterministic update F satisfies s(j+1)=F(s(j)) for every j. Then s is
      either injective or constant.
    derivation: >-
      If s(a)=s(b) for a!=b, applying F^t gives s(a+t)=s(b+t) for every t.
      Therefore s(j)=s(j+(b-a)) for every j. Since b-a is nonzero and generates
      Z_N, s is constant on the whole cycle. The contrapositive says every
      nonconstant deterministic factor is injective.
    scope: >-
      This is a theorem about a time-homogeneous publicly evaluable state under
      +P on the prime-order subgroup. It does not rule out multivalued,
      randomized, approximate, non-time-homogeneous, or target-batched
      algorithms. Adding the scalar step number as state is excluded because
      it is the desired DLP label.
    application:
      coordinate_windows: >-
        If W_m is nonconstant and lossy, its next boundary cannot be a function
        of W_m alone. If made deterministic by public added state, that state
        is injective or constant.
      degree_three_fibers: >-
        Any public provenance that makes U propagation deterministic is either
        point-identifying or uninformative; path-only provenance is not
        target-initializable without the missing orbit index.
      division_polynomial_syndromes: >-
        Any nonconstant fixed syndrome that is genuinely lossy cannot be a
        deterministic translation factor. Multiplication identities do not
        evade the separate all-target index-closure argument.

  explicit_cheapest_counterexamples:
    - id: RT-CE-CW-PRIME-CYCLE
      proposal_id: IDEA-20260823-6284e8
      kind: universal_static_observation_fiber
      construction: >-
        Write a_j=chi(f(jP)) and use W_m(jP)=(a_j,...,a_(j+m-1)). If
        kappa^m<N, two windows collide. If all equal-window pairs had the same
        next symbol, W_m would have a deterministic update. The prime-cycle
        lemma would make W_m constant or injective, contradicting a
        nonconstant collision. Hence a nonconstant word has j!=j' with equal
        W_m and a_(j+m)!=a_(j'+m).
      failure_signature: equal_window_unequal_boundary
      consequence: deterministic propagation is false throughout the claimed forced-lossiness range unless the observation is constant and useless

    - id: RT-CE-FIBER-INJECTIVE
      proposal_id: IDEA-20260823-38f214
      kind: hand_derived_static_finite_field_certificate
      curve: "E/F_5: y^2=x^3+3x+3"
      certificate: >-
        The discriminant is nonzero. The rational points are O, (3,2),
        (3,3), (4,2), and (4,3), so E(F_5) has prime order 5. The rational
        function pi=x+2y has pole order three at O, hence defines a separable
        degree-three map. Its values on those five points are respectively
        infinity, 2, 4, 3, and 0, all distinct.
      failure_signature: geometric_degree_three_but_rational_subgroup_injective
      consequence: the proposal's parameter range does not establish genuine subgroup lossiness

    - id: RT-CE-FIBER-PROPAGATION
      proposal_id: IDEA-20260823-38f214
      kind: hand_derived_static_finite_field_certificate
      curve: "E/F_5: y^2=x^3+3x+3"
      generator: "P=(3,2)"
      multiplication_table: >-
        2P=(4,3), 3P=(4,2), and 4P=(3,3). For the separable degree-three
        map pi=y, take R=2P and R'=4P. Then pi(R)=pi(R')=3, while
        pi(R+P)=pi(3P)=2 and pi(R'+P)=pi(O)=infinity.
      failure_signature: same_fiber_unequal_translated_fiber
      consequence: U alone is not a deterministic translation state even in the smallest prime-order example

    - id: RT-CE-EDS-S2
      proposal_id: IDEA-20260823-850562
      kind: hand_derived_static_finite_field_certificate
      curve: "E/F_5: y^2=x^3+3x+3"
      generator: "P=(3,2)"
      index_family: [2]
      character: quadratic_character_with_pole_sentinel
      certificate: >-
        Standard psi_2=2y. At P, 2P, 3P, and 4P its values are 4, 1, 4,
        and 1, all quadratic residues modulo 5, so every nonidentity point has
        the same syndrome +1. Yet P and 4P have equal syndromes while their
        successors 2P and O have +1 and the pole sentinel respectively.
      failure_signature: equal_syndrome_unequal_successor_and_no_nonzero_target_information
      consequence: a valid fixed public syndrome can be lossy but nonclosed and unidentifying

  counterexample_or_mutation:
    primary: >-
      Hold a proposed public state fixed on two different scalar positions and
      demand one deterministic +P update. On a prime cycle, the collision
      propagates around the complete orbit and forces the state constant. Thus
      a nonconstant deterministic state must be injective, exposing the exact
      lossiness-versus-hidden-invertibility dichotomy common to all three
      proposals.
    smallest_concrete_certificate: >-
      On E/F_5: y^2=x^3+3x+3 with P=(3,2), pi=x+2y is a separable
      degree-three map injective on the five-point group, while pi=y has
      pi(2P)=pi(4P)=3 but pi(3P)=2 and pi(O)=infinity. No program or experiment
      is needed to check the displayed finite-field arithmetic.
    EDS_mutation: >-
      Require one source-only index family to support the displayed
      multiplication identity for every possible target scalar. Multiplication
      of one nonzero index by all x in Z_N^* fills every nonzero residue class,
      converting the proposed sub-square-root closure into a Theta(N) object.

  quantifier_order_audit:
    - proposal_id: IDEA-20260823-6284e8
      declared_order: "exists A(E,P,f,chi,m) such that for every Q, A locates Q"
      verdict: holds_as_written
      adversarial_boundary: >-
        A grammar, suffix dictionary, or occurrence selector chosen after Q,
        W_m(Q), an observed collision, or the full word reverses the order.
        Constructing A by enumerating the full word preserves the order but
        costs Theta(N) and fails the target exponent.
    - proposal_id: IDEA-20260823-38f214
      declared_order: "exists pi,A(E,P) such that for every Q, A inverts U(Q)"
      verdict: holds_as_written_but_premise_is_uninstantiated
      adversarial_boundary: >-
        A cover, sheet label, provenance seed, or branch rule learned from Q is
        target-trained. A path provenance fixed at the source but unavailable
        from Q does not satisfy the target interface.
    - proposal_id: IDEA-20260823-850562
      declared_order: "exists S,A(E,P,chi) such that for every Q, A decodes D_S(Q)"
      verdict: breaks_for_the_direct_multiplication_identity_route
      adversarial_boundary: >-
        Closing S only after the unknown x is fixed yields S_x and reverses the
        order. Closing one source-only S under all x yields Theta(N) indices.
        Any smaller all-target S therefore needs a different decoder theorem,
        not the displayed direct identity alone.

  proves_too_much_controls:
    - proposal_id: IDEA-20260823-6284e8
      controls:
        PTM-1-random-relabelled-curve:
          result: breaks_required_discriminator
          concrete_signature: >-
            Randomly permuting the symbol assignment while preserving the
            alphabet histogram leaves the definition of W_m and its exact
            left-shift-plus-boundary relation unchanged. The snapshot supplies
            no curve-specific theorem that makes the grammar/locator disappear;
            it merely assumes the desired grammar and locator. Thus every
            proved step before the assumption survives the known-false object.
        PTM-2-generic-prime-cyclic-labels:
          result: breaks_as_current_argument
          concrete_signature: >-
            Bucket generic labels into the same kappa-symbol alphabet. Window
            evaluation and shift are still public generic operations on the
            supplied labels. Although f and chi are named non-generic inputs,
            no exploited bound distinguishes their word from this generic
            control. The first missing separator is H-CW-1.
        PTM-3-hidden-dlp-or-full-table:
          result: rejected_as_required
          concrete_signature: >-
            A dictionary from every observed window to its scalar positions
            materializes Theta(N) positions, Theta(N) preprocessing/data, and
            Theta(N) memory up to compression metadata. A target-trained
            dictionary or scalar-labelled grammar is a DLP oracle. The frozen
            cost model correctly refuses both before crediting a query gain.

    - proposal_id: IDEA-20260823-38f214
      controls:
        PTM-1-random-relabelled-curve:
          result: separator_holds_only_at_local_equation
          concrete_signature: >-
            Replace pi by a public random partition with the same one-to-three
            fiber-size distribution. Fiber lossiness and local branching
            remain, but the compact bounded-degree algebraic equation C_P is
            replaced by an explicit random transition table. This is the
            required local failure signature. It does not validate the
            candidate because bounded algebraic degree still supplies no
            global index decoder.
        PTM-2-generic-prime-cyclic-labels:
          result: interface_separator_holds_but_index_claim_does_not
          concrete_signature: >-
            A fixed rational pi and eliminated C_P are unavailable from opaque
            generic labels and are the named non-generic ingredients. Once
            only label/fiber equality and group operations remain, locating an
            iterate is generic DLP. No charged theorem converts the algebraic
            correspondence into a better locator.
        PTM-3-hidden-dlp-or-full-table:
          result: rejected_as_required
          concrete_signature: >-
            A scalar-labelled inverse table or every U-to-successor pair costs
            Theta(N) entries and preprocessing. A sheet/provenance label
            obtained by walking from O costs x steps for target x, and one
            obtained from a DLP is circular. The frozen record correctly
            rejects these realizations.

    - proposal_id: IDEA-20260823-850562
      controls:
        PTM-1-random-relabelled-curve:
          result: separator_holds_at_recurrence
          concrete_signature: >-
            Randomly relabel points while preserving syndrome alphabet and
            collision multiplicities. The division-polynomial multiplication
            identities cease to relate the relabelled syndromes, which is the
            required signature. The surviving marginal/collision data alone
            therefore cannot support a decoder.
        PTM-2-generic-prime-cyclic-labels:
          result: interface_separator_holds_but_index_claim_does_not
          concrete_signature: >-
            Division-polynomial evaluation and its character identities are
            unavailable from opaque generic labels and are explicitly charged.
            However, recurrence evaluation at known indices does not locate an
            unknown scalar; if the proof ends at association or a supplied
            index, the generic residual DLP remains.
        PTM-3-hidden-dlp-or-full-table:
          result: rejected_as_required
          concrete_signature: >-
            Full EDS association, an all-nonzero-index closure, or a table from
            syndromes to scalars has Theta(N) scale before target descent.
            Pairing/field-DLP transfers carry their own incumbent cost. The
            frozen record rejects these, but supplies no remaining locator.

  method_ceilings:
    - proposal_id: IDEA-20260823-6284e8
      ceiling: >-
        Alphabet counting and the shift identity certify collision and
        nonclosure, not compression. Without a curve-specific constructive
        grammar plus locator theorem, the realizable routes are a length-N
        scan/index or generic square-root search. The formal conditional
        N^(1/3) point is not a realized method ceiling.
    - proposal_id: IDEA-20260823-38f214
      ceiling: >-
        Constant geometric degree bounds only the local fiber. Deterministic
        nonconstant public state is injective on the prime cycle, so its
        iterate-index problem is representation-equivalent to ECDLP. Keeping
        the state multivalued restores branches; materializing them costs a
        table. No result below the generic square-root locator follows from
        degree three or bounded local correspondence alone.
    - proposal_id: IDEA-20260823-850562
      ceiling: >-
        The direct all-target use of the displayed multiplication identity has
        linear index closure. A fixed small closure evaluates known multiples
        but does not invert x. Known EDS association/equivalence can restate
        the target and generic rho/BSGS remain applicable. A genuinely new
        nonlinear scalar locator is outside this ceiling but absent here.

