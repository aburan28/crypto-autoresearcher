      conditions. No evidence of bad-faith steering or deliberate suppression
      appears. However, the claim that all three objects are genuinely lossy is
      false at the stated scope, the mandated cheap audits are recorded as
      not_run, and direct committed predecessor families are omitted. Those
      defects weaken the ranking rationale even though they do not make
      implementation appropriate.
    audit_execution_conflict: >-
      The producer handoff required the lossy-projection, observation-collision,
      quantifier-order, method-ceiling, and nearby-object audits before
      selection. proof-search-portfolio records zero audits executed, zero
      proofs completed, and all observation/method-ceiling rows not_run, while
      selection-report says every cost category was addressed. Specifying an
      audit is not executing its static proof check.
