review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-BATCH-90fff7-V2
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-90fff7
  recorded_at: '2026-08-23'
  supersedes_for_composition: REVIEW-PLAN-BATCH-90fff7
  supersession_scope: >-
    Replace only the invalid J1 Validator owner TASK-20260823-a82a71 with fresh
    TASK-20260823-5e04cd. J2 through J4 remain assigned to the already-running
    mutually blind Red Team TASK-20260823-4284b8 under unchanged attack plans.
  coordinator_prior: >-
    The original prior is preserved: I expect at least two of the three
    proposed objects to fail the lossy-object, circular-oracle,
    observation-collision, or end-to-end cost audit. I assign low confidence
    that any candidate survives to a future specification and zero confidence
    that this zero-run batch itself establishes an ECDLP improvement. The
    informative positive outcome would be one candidate with a genuinely new
    object, a public propagation law, a non-circular target decoder, and no
    immediate exponent-accounting contradiction.
  claim_under_review: >-
    Whether any of three frozen object-first proposals is sufficiently
    well-defined and unbroken to merit a separately authorized specification
    batch. No attack, implementation, empirical result, scientific promotion,
    closure, or breakthrough is under review.
  procedure_deviations:
    - id: DEV-J1-AGENT-STATUS-DISCLOSURE
      task_id: TASK-20260823-a82a71
      disposition: invalid_replaced
      report_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/reviews/TASK-20260823-a82a71/review-report.yaml
      report_sha256: e31169c3497678eb0c5b06253d8ecfef2e4e3590303b03efcf9f959d4e3b3d02
      receipt_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/reviews/TASK-20260823-a82a71/runtime-session-receipt.json
      receipt_sha256: 3653da771b5df1cc73ec148cbe06e7d0a012b8e5e9792bfbf5ad9c03f57cc984
      description: >-
        An aggregate collaboration status call unexpectedly embedded a
        completed producer summary containing forbidden disposition and
        obstruction prose. No forbidden repository path or sibling report was
        read, but blindness was spent. The task recorded
        blind_from_respected=false and no admissible candidate verdict.
      effect_on_composition: >-
        TASK-20260823-a82a71 is archived as procedural provenance only and is
        excluded from J1 composition. TASK-20260823-5e04cd starts in a fresh
        fork_turns:none session and receives no predecessor conversation.
  joints:
    - joint: J1-blind-baseline-and-cost-rederivation
      assigned_to: TASK-20260823-5e04cd
      owner_role: validator
      attack_plan: >-
        Read only this v2 plan, the frozen blind statement packet, the snapshot
        receipt, target profile, and the prior checkpoint. For each candidate
        independently derive state-space size, per-attempt work, memory,
        preprocessing, data/query cost, success probability, retries,
        verification, parallel work, and multi-target amortization. Reconstruct
        Pollard rho and BSGS slices and identify the first missing or false
        inequality. Never call collaboration status or messaging tools and
        never read producer proposals, proof maps, source audit, frontier table,
        selection report, producer receipt, invalid Validator report, or Red
        Team output.
      expected_break: >-
        At least one candidate will omit a retry, enumeration, preprocessing,
        or target-decoder charge, or fail to embed an incumbent baseline.
    - joint: J2-lossiness-propagation-and-identifiability
      assigned_to: TASK-20260823-4284b8
      owner_role: red-team
      attack_plan: >-
        Determine whether each object is actually lossy, whether discarded
        information is compatible with curve operations, and whether distinct
        ground-truth states collide while requiring different decoder outputs.
        Build the cheapest explicit observation-fiber collision.
      expected_break: >-
        A reversible coordinate change or observation collision will break at
        least one proposal.
    - joint: J3-circularity-quantifiers-and-proves-too-much
      assigned_to: TASK-20260823-4284b8
      owner_role: red-team
      attack_plan: >-
        Search for hidden DLP/CDH oracles, target-trained observables, full
        tables, excluded curve conditions, and reversed quantifiers. Run every
        named known-false control and require its failure signature.
      expected_break: >-
        At least one proposal will reverse a quantifier or smuggle an
        incumbent-cost oracle.
    - joint: J4-source-novelty-pareto-and-steering
      assigned_to: TASK-20260823-4284b8
      owner_role: red-team
      attack_plan: >-
        Compare mechanisms against committed predecessors and retrieved primary
        sources, reconstruct realized versus conditional Pareto tables across
        every charged axis, keep unknown axes incomparable, and audit whether a
        higher-value route was suppressed or an established family renamed.
      expected_break: >-
        Novelty remains unverified because derived KB coverage is unavailable,
        and at least one conditional Pareto statement will require narrowing.
  blindness:
    mutual: true
    lifted_for: []
    replacement_validator_allowed_paths:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/review-plan.v2.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/archives/TASK-20260823-bc16df/snapshot-receipt.json
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/blind-statement-packet.yaml
      - docs/target-result-profile.md
      - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-c36939.yaml
    red_team_allowed_scope: >-
      Unchanged full frozen producer snapshot except all Validator reports and
      receipts, including both the invalid and replacement Validator tasks.
  blind_rederivation:
    required: true
    assigned_to: TASK-20260823-5e04cd
    quantity: >-
      Each candidate's complete end-to-end classical time, memory,
      preprocessing, data/query, retry, verification, parallel-work, and
      multi-target cost relative to Pollard rho and BSGS.
    statement_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/blind-statement-packet.yaml
    blind_from:
      - ledger/proposals/IDEA-20260823-6284e8.yaml
      - ledger/proposals/IDEA-20260823-38f214.yaml
      - ledger/proposals/IDEA-20260823-850562.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/object-frontier.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/source-audit.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/proof-search-portfolio.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/selection-report.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/tasks/TASK-20260823-9ccc23/runtime-session-receipt.json
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/reviews/TASK-20260823-a82a71
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-90fff7/red-team/TASK-20260823-4284b8
    rule: >-
      The replacement Validator reads only its five allowed paths, never calls
      collaboration list/status/message tools, and ends after writing its report
      and receipt. Any other producer or reviewer disclosure invalidates it.
  proves_too_much:
    objects:
      - PTM-1-random-relabelled-curve
      - PTM-2-generic-prime-cyclic-labels
      - PTM-3-hidden-dlp-or-full-table
    failure_signature: >-
      A surviving mechanism must lose its claimed advantage under public random
      relabelling, identify and charge a non-generic curve ingredient absent
      from generic labels, and reject DLP-derived keys or full tables at their
      incumbent-or-worse construction cost.
  composition_rule: >-
    Compose only TASK-20260823-5e04cd for J1 and TASK-20260823-4284b8 for
    J2-J4 after both reports are terminal, strict-parse, bind the frozen
    snapshot, attest no sibling-report read, and check_review_independence
    passes when explicitly given this v2 plan and those two report paths. The
    invalid TASK-20260823-a82a71 is provenance only.
  authority_boundary: >-
    Neither review authorizes implementation, execution, scientific status
    change, evidence promotion, closure, or a breakthrough. Any actual claim
    requires later proof or empirical evidence and a separate claim-specific
    review-breakthrough/max round.
