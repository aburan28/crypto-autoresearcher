  producer_claim_reading:
    ctrl1_claimed: PASS_CTRL4
    ctrl2_claimed: FAIL_SUPPLY_OR_FB_SHORT
    shortfall_ge_2_cells_claimed:
      - {cell: L12, arm: E_prime_random_fb, shortfall: 4}
      - {cell: L13, arm: A_prime_phi_invariant_fb, shortfall: 2}
      - {cell: L13, arm: E_prime_random_fb, shortfall: 4}
    stand_down_basis_defective_claimed: true
    claim_tier_claimed: toy
    mechanism_claim_present: false

  focus_1_collection_budget_fidelity:
    question: >-
      Is num_targets=R_base with attempts≤5*R_base a faithful reading of
      DEC-20260729-004 / RT35-CTRL-2 supply probe, or does it under-sample and
      falsely fire shortfall?
    answer: UNDER-SAMPLES AND CAN FALSELY FIRE SHORTFALL
    binding_definitions:
      RT35_CTRL_2_from_BATCH014_red_team: >-
        call _collect_relations(inst, fb, m, Q(B)) with
        include_phi_orbits=False; report len(relations) against R_base(B).
      EXP_STR_004_collection_quota: >-
        Q(B)=max(60, B+10) as num_targets. Floor of 60 declared expressly
        because at small B the harness allowance 5*num_targets otherwise leaves
        too few candidates to make R_base base rows probable
        (specification.yaml collection_quota).
      DEC_20260729_004_next_action: >-
        Names RT35-CTRL-1 and RT35-CTRL-2 jointly; SUPPLY limb says call
        _collect_relations with orbit closure DISABLED and report len(relations)
        against R_base(B) (and distinct-target count). Incorporates CTRL-2 by
        name; does not authorize substituting R_base for Q(B).
      harness_loop: >-
        endomorphism_la._collect_relations loops range(num_targets*5) and breaks
        when len(relations)>=num_targets. Quota sets both stop and search
        allowance.
    what_the_probe_did: >-
      rt35_probe.py line ~98: num_targets=R_base. At B=12/13 that is 5/6, so
      attempt cap 25/30 — not Q=60 with cap 300.
    evidence_of_false_fire_pattern:
      - >-
        All three shortfall≥2 rows exhausted the R_base attempt cap
        (attempts=25,30,30 = 5*R_base).
      - >-
        L12/A_prime also shortfall=1 at attempts=25 (cap) — same pattern, below
        the ≥2 trigger.
      - >-
        Naive constant-rate extrapolation to Q-budget (300 attempts): L12/E
        hit_rate 0.04 → ~12 expected hits vs R_base=5; L13/A 0.133 → ~40 vs 6;
        L13/E 0.067 → ~20 vs 6. Fills are likely under the declared quota; the
        FAIL is not established as a supply defect on committed code under
        RT35-CTRL-2.
      - >-
        Larger-B and m=3 cells fill under R_base targets — failure concentrates
        exactly where EXP-STR-004's Q floor was designed to protect.
    severity: BLOCKING on CTRL-2 disposition and stand_down_basis_defective

  focus_2_fail_triggers_reopen_without_mechanism_claim:
    question: >-
      Does FAIL correctly trigger reopen of the execution question without
      claiming an H-STR-002 mechanism result?
    answer: >-
      PROCEDURE SHAPE IS RIGHT; TRIGGER FIRING IS NOT. IF a faithful CTRL-2
      FAIL occurred, DEC-20260729-004 pre-registers reopen of the execution
      question on the merits, without adjudicating H-STR-002's mechanism. The
      producer correctly fences mechanism (claim_tier toy; what_this_is_not).
      BUT because CTRL-2 was not the declared supply probe, FAIL must not fire
      that reopen from this package.
    producer_fencing_ok:
      - claim_tier: toy
      - no_alpha_ladder_driver_rank_cost: true
      - not_H_STR_002_mechanism_test: true
    reopen_licensed_by_this_package: false

  focus_3_overclaim_and_claim_tier:
    claim_tier_inflation: NOT FOUND
    mechanism_overclaim: NOT FOUND
    falsification_trigger_inflation: FOUND
    detail: >-
      stand_down_basis_defective_on_committed_code=true overclaims relative to
      the pre-registered falsifier. That boolean is licensed only by a faithful
      RT35-CTRL-1/2 probe. CTRL-1 PASS alone does not set it; CTRL-2 under
      num_targets=R_base does not. Setting the flag here is disposition
      inflation, not tier inflation. Distinct-target count required by DEC was
      also not reported (minor omission beside the budget defect).

  ctrl1_independent_reading:
    disposition: CONFIRM_PASS_CTRL4
    checks:
      B_192: {len_F: 192, len_equals_B: true, orbit_block_ok: true, short_list: false}
      B_193: {len_F: 193, len_equals_B: true, orbit_block_ok: true, short_list: false}
    note: >-
      Structure probe at B=192/193 matches CTRL-4 / RT35-CTRL-1. Does not by
      itself establish or refute stand-down basis defectiveness.

  ctrl2_independent_reading:
    disposition_as_faithful_RT35_CTRL_2: REJECT_AS_INVALID_BUDGET
    arithmetic_under_probe_budget_as_run: >-
      Recomputed shortfall = max(0, R_base - len(relations)) matches JSON for
      all 28 rows; n_shortfall_ge_2=3; n_fb_short=0; R_base=(B+2)//3+1 holds.
    meaning: >-
      The numbers are consistent with the code that was run. They are not a
      faithful measurement of the supply condition DEC/RT35-CTRL-2 asked for.

  objections:
    - id: RT36-1
      severity: BLOCKING
      title: CTRL-2 used num_targets=R_base instead of Q(B)=max(60,B+10)
      detail: >-
        Violates RT35-CTRL-2 and EXP-STR-004 collection_quota. Under-samples
        small-B cells (~12x fewer attempts) and falsely enables shortfall≥2.
    - id: RT36-2
      severity: BLOCKING
      title: stand_down_basis_defective_on_committed_code=true is not licensed
      detail: >-
        Pre-registered falsifier requires faithful CTRL-1/2. CTRL-2 invalid;
        flag must stay false / unset for ledger purposes until re-probe.
    - id: RT36-3
      severity: MAJOR
      title: Shortfall cells are exactly attempt-cap exhausted
      detail: >-
        L12/E, L13/A, L13/E all stop at attempts=5*R_base with unmet R_base.
        Diagnostic of budget starvation, not established collector/FB collapse.
    - id: RT36-4
      severity: MINOR
      title: Distinct-target count not reported
      detail: >-
        DEC SUPPLY limb asks len(relations) against R_base and measured
        distinct-target count. Probe omits the latter.
    - id: RT36-5
      severity: INFORMATIONAL
      title: Snapshot receipt file not post-commit-finalized
      detail: >-
        receipt commit_sha null / pending_post_commit vs queue-recorded
        01221745…; Git verifies the snapshot. Coordinator hygiene, not probe math.

  narrowest_supported_statement: >-
    On snapshot 0122174582bff55f660e4488c55f1054d1ee333a, committed
    _build_phi_invariant_factor_base on CURVE-J12S1 returns length-B
    orbit-blocked lists at B=192 and B=193 (CTRL-1 PASS). The same snapshot's
    CTRL-2 run collected relations with num_targets=R_base (attempts≤5*R_base)
