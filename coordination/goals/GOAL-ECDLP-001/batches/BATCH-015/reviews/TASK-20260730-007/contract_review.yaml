    prior_severity: BLOCKING
    status: DISCHARGED
    a_prime_hole_closed: true
    e_prime_only_remainder_closed: true
    completeness_claim_holds_for_coverage: true
    detail: >-
      v3 generalizes prediction_failed: complete valid measurement AND F-4 silent
      AND F-1 fires for at least one arm (A-prime, E-prime, or both), with reason
      codes F1_A_prime_fires_F4_silent, F1_E_prime_fires_F4_silent, or both.
      Exhaustive enumeration of the 12 reachable (F1_A, F1_E, F4, dir_E_gt_A)
      complete-valid outcomes under the written rule yields ZERO unlabeled cells.
      The RT-20260730-001 remainder F-1(E)-only ∧ F-1(A)-silent ∧ F-4-silent now
      maps uniquely to prediction_failed / F1_E_prime_fires_F4_silent.
    forces_revise: false

  B-2:
    prior_severity: BLOCKING
    status: DISCHARGED
    detail: >-
      Inherited from v2 without textual regression. specification.v3.yaml
      F-1_SET_IDENTITY still states P-3 has two limbs that do not coincide, that
      either may fire without the other, cites the B=13 counterexample, requires
      summary reporting of both limbs, and RETRACTS the v1 coincide-by-construction
      sentence. feasibility_table.v3.md §5 F-1 row mirrors the retraction. Diff
      v2→v3 touches only version metadata and the prediction_failed clause.

  M-1:
    prior_severity: MAJOR
    status: DISCHARGED
    detail: >-
      Inherited from v2 without textual regression. F-4_DIAGNOSTICITY still says
      F-4 firing means the arms' alpha sets differ on a nonempty named subset,
      points to IL0, and forbids paraphrasing as "the phi-invariant factor base
      is doing something" without the truncation caveat. Byte-identical to v2
      on this field (diff confined to header + prediction_failed).

  scope_mechanism_run_smuggle:
    status: PASS_NO_SMUGGLE
    detail: >-
      v2→v3 diff is confined to version/provenance metadata and the
      prediction_failed verdict clause. Fourteen cells, two arms, R_base=ceil(B/3),
      PRED-ID-STR, claim ceiling, N-1..N-5, and no-mechanism posture unchanged.
      derivation_note.md byte-identical to f3e15614 and 26625837. No third arm,
      density measurement, mechanism test, or run authorization. Receipt and
      amendment state no_run_authorized / CREATE NO RUN. experiments/EXP-STR-004/runs/
      absent at reviewed HEAD.

# ---------------------------------------------------------------------------
# Objections (this review)
# ---------------------------------------------------------------------------
objections:
  - id: M-2
    severity: MAJOR
    title: falsified and mixed both match when F1_A silent and some alpha(E)>alpha(A)
    prior_objection: M-2
    status: CARRIED_WITHOUT_REVISE_FORCE
    detail: >-
      Unchanged from RT-20260730-001. When F-1 is silent for A-prime and some
      cell has alpha(E)>alpha(A), F-4 necessarily fires; residue-0 cells keep
      the agreement set nonempty, so mixed's "nonempty proper subset" also
      matches. Two dual-labeled cells remain in the enumeration:
      (F1_A=0,F1_E=0,F4=1,E>A=1) and (F1_A=0,F1_E=1,F4=1,E>A=1). This is a
      priority/exclusivity defect on "exactly one" uniqueness, not a coverage
      hole. Per RC-15 and prior severity assignment it is NOT used as sole or
      joint ground for REVISE.
    discharge: >-
      Optional later amendment: state explicit priority (falsified before mixed)
      or mutually exclusive predicates. Not required to PASS this review.

  - id: M-3
    severity: MAJOR
    title: Matched budget still specification-only (prior M-2/M-3 carried)
    prior_objection: M-3
    status: CARRIED
    detail: >-
      DEV-BASE-1 remains; matched base-row budget is still a driver obligation,
      not a property of the committed _collect_relations source. Unchanged by v3;
      residual implementation risk for Executor review.
    discharge: >-
      Executor implementation review must verify BASE-row-only counting.

  - id: m-1
    severity: MINOR
    title: P-3 vs derivation disagreement remains carried unresolved
    prior_objection: m-1
    status: CARRIED
    detail: >-
      SPEC-STR-004-E / derivation §8.2 tension unchanged and correctly left
      unresolved. Mixed remains the expected instrument verdict under the
      derivation. Not blocking.
    discharge: null

  - id: m-2
    severity: MINOR
    title: Feasibility §5.1 still says four verdict branches
    prior_objection: null
    status: NEW_NON_BLOCKING
    detail: >-
      feasibility_table.v3.md §5.1 still enumerates confirmed / mixed /
      falsified reachability as "four verdict branches" and does not name
      prediction_failed there; the v3 header note does cover the
      generalization. Binding text is specification.v3.yaml. Not REVISE-forcing.
    discharge: null

  - id: I-1
    severity: INFORMATIONAL
    title: B-1 remainder closed; B-2 and M-1 remain sound
    detail: >-
      Generalized prediction_failed closes F1(E)-only ∧ F4-silent. Coincide
      retraction and F-4 magnet rephrase carry forward. Scope not widened. No
      run authorization smuggled. Derivation note byte-identical to f3e15614.
    discharge: null

  - id: I-2
    severity: INFORMATIONAL
    title: Favourable ladder still not support for H-STR-002
    detail: >-
      Unchanged from RT-20260729-034 / RT-20260730-001 I-2. N-2 / F-5 companion /
      IL1 still forbid reading a silent F-5 as mechanism support when E-prime
      matches.
    discharge: null

