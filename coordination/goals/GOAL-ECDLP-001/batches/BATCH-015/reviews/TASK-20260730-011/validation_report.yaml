    - id: NBO-2
      observation: >-
        targets_attempted list lengths differ across arms at 8/14 cells because
        collection stops at R_base hits; every cell has identical shared prefix
        (CTRL-3 generating sequence is arm-independent). Hash equality is not
        required when attempt counts differ.
    - id: NBO-3
      observation: >-
        DEV-BASE-1 is declared in specification.v3.yaml and recorded in every
        run and in sweep_summary.deviations; not an undeclared deviation.
    - id: NBO-4
      observation: >-
        Snapshot receipt path_sha256 is empty under INT-BATCH007_T
        (commit_sha null in-blob); path-set equality to the 174 changed paths
        was verified instead. Receipt itself is one of the 174 paths.
    - id: NBO-5
      observation: >-
        manifest.run.inference is the harness-hardcoded executor-terra block;
        true session provenance is in raw-result.json.inference_supplement
        (executor-implementation, fallback_used true, model_verified false),
        as the contract discloses (EV-STR-003 UC-5).
    - id: NBO-6
      observation: >-
        CTRL-7 cross-check is present and agrees on all CURVE-J12S1 cells;
        null on X96/X97 (CURVE-J16S3 has no EXP-STR-002 reference record).
        Contract scopes CTRL-7 to the committed J12 reference.

  admissibility_statement: >-
    THE RUN PACKAGE IS VALID AND ADMISSIBLE AS A RESEARCH RECEIPT. Twenty-eight
    of twenty-eight declared runs are completed_valid with valid true; every
    required per-run artifact and the three results files are present in the
    TASK-20260730-010 snapshot; seeds, instance parameters, and AP/EP matched
    budgets agree with specification.v3.yaml; primary metrics agree across
    raw-result.json, manifest.yaml, sweep_summary.json, and run_index.json;
    certificate re-verification is 654 pass / 0 fail; and instrument_verdict
    mixed is the unique label the frozen verdict_rule assigns to the measured
    F-1/F-4 matrix. This session interpreted none of the cryptanalytic claims.
  what_a_pass_means: >-
    A passed validation report means this receipt is admissible evidence about
    the recorded instrument measurements on fourteen toy cells. It does not
    support H-STR-002, demonstrate a speedup, license an asymptotic claim, or
    authorize promotion. Disposition belongs to TASK-20260730-013.

