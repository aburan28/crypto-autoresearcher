      FALSIFICATION CONDITION TEXT, THE CLAIM CEILING, THE FOURTEEN CELLS, THE
      TWO ARMS AND THE EXECUTOR CARD ARE BYTE-IDENTICAL ACROSS THE AMENDMENT.
    verdict: "SCHEMA REPAIRS AS CLAIMED. One forward hazard follows from -002 and is raised as OBJ-7, not as a breach."
    standing_lesson_endorsed: "A dispatch queue that has never been rendered by tools/research_dispatch.py is an unverified artifact. The queue's own root_cause note says this and it is correct."

  discarded_duplicate_dependency_assessment:
    question: "Does anything in BATCH-015 silently depend on the discarded uncommitted EXP-STR-004 copy?"
    finding: "NO - checked by diff, not assumed. See OBJ-6 for the identifier ambiguity that IS real."

  prohibition_check_item_by_item:
    gate: G3
    method: "Recursive grep over every BATCH-015 artifact for each prohibited construction, plus manual read of the probe artifacts and the snapshot receipt."
    items:
      - prohibition: "No record may say H-STR-002's MECHANISM was tested, confirmed or refuted by BATCH-014 or BATCH-015."
