  # ------------------------------------------------------------------ OBJECTIONS
  objections:
    - id: OBJ-1
      severity: blocking_for_interpretation
      not_blocking_for: >-
        The committed artifacts themselves, which are honest, in scope and
        correctly narrow. THIS OBJECTION BLOCKS A READING, NOT AN ARTIFACT.
      title: >-
        CTRL-4 CONDITION (ii) IS A TAUTOLOGY OF THE CONSTRUCTOR. IT CANNOT FAIL
        FOR ANY B, ANY CURVE OR ANY zeta3, AND ITS `PASS` CARRIES ZERO
        INFORMATION ABOUT PHI-INVARIANCE.
      argument: >-
        harness/endomorphism_la.py::_build_phi_invariant_factor_base builds its
        output by exactly one statement, `xs.extend(orbit)` where
        `orbit = [x, (zeta3*x) % p, (zeta3*zeta3*x) % p]`. xs is never permuted,
        never inserted into, and never appended to by any other path; the return
        is `xs[:B]`, which preserves the first floor(B/3) contiguous triples
        intact. CTRL-4's condition (ii) then checks
        `F[3j+k] == pow(zeta3,k,p) * F[3j] % p` for `0 <= j < len(F)//3` - that
        is, it re-evaluates THE SAME ARITHMETIC EXPRESSION THE CONSTRUCTOR USED
        and compares it against itself. This is a MIRROR TEST, not a test.
      demonstration_run_by_this_review: >-
        I called the committed builder at B = 192 on CURVE-J12S1 with three
        values of zeta3: the true one (1303, cube 1 mod 2293), 5 (cube 125 mod
        2293) and 1234 (cube 1799 mod 2293). CTRL-4 conditions (i) AND (ii)
        REPORT PASS IN ALL THREE CASES. A "phi-invariance" assertion that passes
        with a value that is not a cube root of unity is not an assertion about
        phi at all. Command reproducible from the committed harness; nothing was
        modified.
      what_actually_survives: >-
        Only condition (i), `len(F) == B`. Condition (ii) establishes nothing and
        must not be reported as a verified structural property of the factor base.
      what_the_condition_conspicuously_does_not_cover: >-
        The one structural variable the EXP-STR-004 ladder is built on. That
        contract's own text says at B = 3q+1 "the last phi-orbit is TRUNCATED to a
        single element whose phi-image is not in F". CTRL-4 (ii) checks only
        COMPLETE blocks and is therefore blind to the truncated tail by
        construction. At B = 193 the probe correctly records
        tail_indices_not_in_a_complete_block = [192] and checks nothing about it.
      consequence_for_the_batch: >-
        M-1's second limb is NOT established. Any BATCH-015 record must say that
        CTRL-4 condition (ii) is a constructor identity, so that no successor
        treats "both structure assertions PASS" as evidence that the arm A-prime
        factor base is phi-closed.

    - id: OBJ-2
      severity: high
      title: >-
        THE PART A LIMB OF THE PRE-REGISTERED FALSIFICATION CONDITION WAS
        STRUCTURALLY INCAPABLE OF FIRING AT B = 192 AND B = 193. "IT DID NOT
        FIRE" CARRIES NO INFORMATION ON THAT LIMB.
      argument: >-
        The clause `len(F) != B` fires only if the builder exhausts its trial
        bound j < 50*B + 1000 before accumulating ceil(B/3) whole orbits. On
        CURVE-J12S1 (p = 2293) I measured, by re-running the committed builder
        read-only, that it consumes 139 draws at B = 192 and 140 at B = 193
        against permitted bounds of 10600 and 10650 - A MARGIN OF ROUGHLY 76x.
        The instance affords 366 distinct full phi-orbits (1099 liftable
        x-coordinates, and the liftable set is CLOSED under x -> zeta3*x because
        a = 0 makes (zeta3*x)^3 + b = x^3 + b, so the builder's per-member curve
        test never rejects anything). The builder first returns a SHORT list only
        at B of about 1142 on this instance - roughly SIX TIMES the tested B.
      what_the_quantity_should_have_done: >-
        B is the parameter that is supposed to destroy the D-3 length property.
        The honest measurement is a SWEEP IN B up to and past the orbit-supply
        boundary, with `len(F) == B` expected to hold up to B ~ 1098 and to fail
        above it. Two adjacent PASSes taken at ~1/6 of the boundary, with a 76x
        trial-bound margin, is the canonical artifact tell of docs/inventor-
        protocol.md section 3: a quantity reported flat where nothing was doing
        the work of making it vary.
      what_survives: >-
        A true and narrow procedural fact: at commit e3cf9fdd, on CURVE-J12S1,
        the committed builder returns lists of length exactly 192 and 193. That
        is worth having and is what D-3's length limb asked for. It is NOT a
        passed stress test and must not be banked as one.

    - id: OBJ-3
      severity: high
      title: >-
        183 IS AN INSTRUMENT CONSTANT OF THE TARGET GENERATOR, NOT A PROPERTY OF
        THE CURVE, THE FIELD OR EITHER FACTOR BASE. THE TWO HEADLINE CELLS ARE
        MEASURING THE INSTRUMENT.
      argument: >-
        harness/endomorphism_la.py::_collect_relations generates targets by the
        arithmetic progression `k = (t_idx + 1) * c % (n - 1) + 1` with
        `c = max(2, inst.seed % max(2, n - 3))`. On CURVE-J12S1, n = 733 and the
        derived seed is 100, so c = 100 and gcd(100, 732) = 4. The progression
        therefore visits exactly (n - 1) / gcd(c, n - 1) = 732 / 4 = 183 distinct
        k values, and I verified by direct computation that these yield exactly
        183 distinct target x-coordinates. THE 183 IS 732/4. It is a divisibility
        accident of the seed against n - 1.
      consequence: >-
        At L192 (Q = 202) and L193 (Q = 203) THE QUOTA IS UNREACHABLE BY
        CONSTRUCTION. `len(relations) = 183` at those cells is the target
        generator's cycle length, reached with a 100% decomposition rate
        (hits = attempts = 183 in both arms). The loop's remaining 827 of 1010
        iterations do nothing but `continue` on the seen_targets set.
      the_censoring_is_wider_than_the_two_headline_cells: >-
        Of the 28 supply units, 24 report a SATURATED INSTRUMENT CONSTANT rather
        than a supply measurement: len(relations) = 60 = Q at L24, L25, L48, L49,
        A12M3, A13M3 (both arms, 12 units); = 106 or 107 = Q at L96, L97, X96,
        X97 (both arms, 8 units); = 183 = target-cycle ceiling at L192, L193
        (both arms, 4 units). ONLY L12 AND L13, BOTH ARMS - FOUR UNITS - REPORT
        AN UNCENSORED NUMBER.
      what_the_quantity_should_have_done: >-
        len(relations) should rise with Q and then flatten when either the quota
        or the distinct-target supply binds. It flattened at exactly Q, or at
        exactly 183, at 24 of 28 units. That is the instrument, and any ladder
        statement across B built on those cells is confounded above the ceiling.

    - id: OBJ-4
      severity: high
      title: >-
        THE ARM E-PRIME NULL OBJECT IS WELL CONSTRUCTED BUT WAS MEASURED ON A
        CENSORED QUANTITY. THE A-PRIME = E-PRIME IDENTITIES ARE FORCED BY THE
        CEILING AND ARE NOT EVIDENCE OF INSENSITIVITY.
      the_null_is_genuinely_null_on_construction: >-
        I read harness/semaev.py::build_factor_base, which
        `_build_random_factor_base` delegates to. It returns `size` DISTINCT
        ON-CURVE x-coordinates from the same `_seed_int` stream and the same
        trial bound. It is matched to arm A-prime on size, on liftability, on
        determinism and on seed source, and differs only in phi-orbit structure.
        THIS IS A PROPERLY CONSTRUCTED NULL OBJECT AND THE PROBE DESERVES CREDIT
        FOR RUNNING IT. It is not a strawman.
      but_the_comparison_is_uninterpretable: >-
        The identities the successor will notice - 60/60, 106/106, 107/107,
        183/183 - occur at exactly the units where OBJ-3 shows the quantity is
        pinned at Q or at 183. Two arms cannot differ on a number that is
        clamped. The identity is FORCED and is not a controlled null.
      and_the_quantity_is_NOT_arm_insensitive: >-
        Where the clamp does not bind, the arms separate substantially and in a
        consistent direction. len(relations) at L12: A-prime 29 vs E-prime 17.
        At L13: 31 vs 20. And even at quota-pinned cells the arms separate on the
        number of targets consumed to reach the quota - L24 150 vs 132, L25 139
        vs 129, L48 67 vs 68, A12M3 82 vs 104, A13M3 75 vs 95, X96 289 vs 296.
        SO THE INSTRUMENT IS NOT BLIND TO THE ARM; THE REPORTED QUANTITY IS
        CENSORED.
      what_this_batch_may_and_may_not_say: >-
        MAY: the null object was built and run at all fourteen cells, and no
        (cell, arm) unit fell short of R_base(B). MAY NOT, IN EITHER DIRECTION:
        any A-prime versus E-prime comparison, any statement that the arms are
        indistinguishable, any statement that a phi-invariant factor base yields
        more relations. The queue's own restriction to "ONLY len(relations)"
        forbids the second and third, and OBJ-3's censoring forbids the first.
        A SUCCESSOR WHO READS 183/183 AS A CONTROLLED NULL IS READING THE CLAMP.

    - id: OBJ-5
      severity: medium
      title: >-
        THE SUPPLY LIMB OF THE FALSIFICATION CONDITION WAS APPLIED EXACTLY AS
        WRITTEN, BUT WITH A MARGIN OF 3.4x TO 36x. QUOTE THE MARGIN OR THE
        "DID NOT FIRE" IS BANKED ABOVE ITS WORTH.
      argument: >-
        The clause needs max(0, R_base(B) - len(relations)) >= 2 at some unit.
        The tightest unit in the whole probe is L12/arm_E_prime: R_base = 5, so
        firing required len(relations) <= 3; the observed value was 17, a factor
        of 5.7 clear, and 3.4x clear of R_base itself. At the two headline cells
        R_base is 65 and 66 against an observed 183 - firing would have required
        the decomposition hit rate to collapse below 36%, where the observed rate
        was 100%. UNLIKE OBJ-1 AND OBJ-2 THIS LIMB WAS NOT ANALYTICALLY DEAD: at
        B = 12 the m = 2 pair-coverage argument gives no a-priori guarantee, and
        the E-prime arm did land within a factor of 5.7 of firing. THE LIMB WAS A
        REAL TEST, WITH A WIDE MARGIN, AND SHOULD BE REPORTED WITH THE MARGIN.
      required_wording: >-
        "The supply limb was evaluated at all 28 units and did not fire; the
        tightest unit was L12/arm_E_prime at len(relations) = 17 against
        R_base = 5" - NOT "the falsification condition passed".

    - id: OBJ-6
      severity: medium
      title: >-
        THE `CTRL-4` IDENTIFIER IS DEMONSTRABLY AMBIGUOUS ACROSS THE TWO FROZEN
        COPIES OF EXP-STR-004. NOTHING IN BATCH-015 DEPENDS ON THE DISCARDED
        COPY, BUT EVERY FUTURE CITATION MUST CARRY A COMMIT SHA.
      what_i_checked: >-
        I diffed the committed experiments/EXP-STR-004/specification.yaml against
        the discarded duplicate preserved in the session scratchpad. IN THE
        COMMITTED COPY, CTRL-4 IS THE FACTOR-BASE STRUCTURE ASSERTION. IN THE
        DISCARDED COPY, CTRL-4 IS A DIFFERENT CONTROL ENTIRELY - "RESIDUE
        CONTRAST AT EVERY RUNG" - and that copy has no `the_fourteen_named_cells`
        block at that location at all.
      does_batch_015_depend_on_the_discarded_artifact: >-
        NO, AND I CHECKED RATHER THAN ASSUMED. The probe recomputed R_base(B) and
        Q(B) from the two formulas and recorded `table_disagreements: []`; I
        independently confirmed the fourteen cells and the CTRL-4 text in the
        COMMITTED copy match what the queue carried and what the driver executed.
        The structure_probe.json authority field cites the path, which resolves
        unambiguously on this branch.
      required_forward_action: >-
        Any successor record citing CTRL-4 must cite it as "CTRL-4 of
        experiments/EXP-STR-004/specification.yaml at <commit sha>". The bare
        identifier is now known to name two different controls.

    - id: OBJ-7
      severity: medium
      title: >-
        QUEUE-AMEND-20260730-002 CREATES A TOOLING-DRIVEN PRESSURE TO MINT AN
        EVIDENCE RECORD FOR A PROBE THE SAME QUEUE SAYS IS NOT A RESULT.
      argument: >-
        tools/research_dispatch.py::_validate_ledger_archive requires
        unconditionally that a `ledger` archive declare at least one path under
        ledger/evidence/. The amendment therefore put ledger/evidence/EV-STR-005.yaml
        into TASK-20260730-035's artifact_paths UNCONDITIONALLY. A dispatcher
        schema now asserts, structurally, that an evidence record will exist for
        a batch whose own claim ceiling says it produces no result.
      mitigating_fact_recorded_fairly: >-
        The amendment names this hazard itself and forbids it in terms: "NO
        EVIDENCE RECORD MAY BE WRITTEN UNDER BRANCH 2 IN ORDER TO MAKE A DECLARED
        PATH COUNT COME TRUE." The declare-then-deviate route with a recorded
        shortfall is already pre-registered, with BATCH-014's TASK-20260729-048
        as its precedent.
      required_forward_action: >-
        TASK-20260730-035 must exercise declare-then-deviate and RECORD THE
        SHORTFALL if it does not write EV-STR-005, and must not write an evidence
        record to satisfy a path count. This is a live hazard, not a breach.

    - id: OBJ-8
      severity: low
      title: >-
        THE MEASURED DISTINCT-TARGET COUNT OF 183 AGREES NUMERICALLY WITH THE
        TASK-20260729-043 DERIVED BOUND OF 183, AND THE PROBE DID NOT COMPARE
        MEMBER SETS. UNDER PRED-ID-STR THAT IS CARDINALITY-ONLY AGREEMENT ON THE
        FACE OF THE ARTIFACTS.
      what_i_did_about_it: >-
        I checked the underlying sets myself. The 183 distinct targets ARE the
        full k-cycle of the progression, so the agreement here is GENUINE and not
        cardinality-only. THE PROBE IS NOT WRONG; ITS ARTIFACTS SIMPLY DO NOT
        ESTABLISH THIS, and a successor must not upgrade "183 = 183" to set
        agreement on the strength of the probe alone. The probe's own artifacts
        correctly report both figures side by side without claiming agreement.

    - id: OBJ-9
      severity: process_medium
      title: >-
        THE SHARED-MODEL FALLBACK IS A REAL THREAT TO THE INDEPENDENCE THIS
        REVIEW CHAIN ASSUMES, AND OBJ-1 IS AN EXAMPLE OF THE FAILURE MODE IT
        PRODUCES.
      argument: >-
        The producing Executor (TASK-20260730-031), the Validator
        (TASK-20260730-033) and this Red Team (TASK-20260730-034) all resolve to
        claude-opus-5 with fallback_used true and model_verified false. The
        specific hazard is CORRELATED BLIND SPOTS, not laziness: an executor that
        implements a check by transcribing the constructor's own expression, and
        a reviewer running the same model that reads the check and finds it
        faithful to the contract, will agree - correctly on fidelity and wrongly
        on informativeness. OBJ-1 IS EXACTLY THAT SHAPE. I did not find it by
        reading; I found it by RE-EXECUTING THE COMMITTED BUILDER WITH A BOGUS
        zeta3 AND WATCHING THE ASSERTION PASS.
      the_available_mitigation_costs_no_model_diversity: >-
        REQUIRE A MUTATION TEST FOR EVERY ASSERTION-STYLE CONTROL. A control that
        has never been shown to FAIL on a deliberately broken input is not known
        to be a control. Mutation evidence is model-independent in a way that
        cross-reading is not, and it is available at zero additional model cost.
      what_is_not_claimed: >-
        NO MODEL INDEPENDENCE IS CLAIMED ANYWHERE IN THIS REPORT (INT-BATCH015-D,
        INT-BATCH015-E, N-5). This session is session-level and
        implementation-level independent only, and counts toward no quorum.

  # ------------------------------------------------- PROCESS CHECKS (G2, G3, G4)
  falsification_condition_integrity_check:
    gate: G2
    was_it_reinterpreted: "NO."
    commit_order_checked_against_git_not_assertion: true
    evidence:
      - "d0bdec8434f2394c625222cf0e44edac41780bd8 - 2026-07-30 18:14:54 -0700 - BATCH-015 opening; freezes PRE_REGISTERED_FALSIFICATION_CONDITION."
      - "085f5d485cc21b4c46e4c6fb4a1db788567f79b7 - 2026-07-30 18:25:00 -0700 - QUEUE-AMEND-20260730-001/-002."
      - "e3cf9fdd770cbab3ebf55691a60143ace2b75f4c - 2026-07-30 18:33:52 -0700 - probe artifacts."
      - "THE CONDITION PRECEDES THE PROBE BY NINETEEN MINUTES AND TWO COMMITS."
    threshold_comparison_and_scope_check: >-
      probe_driver.py::finish() implements exactly two clauses: `returned_length
      != B` over PART A assertions with valid true, and `shortfall >= 2` over
      PART B records with valid true, where shortfall is
      max(0, R_base_recomputed - len(relations)). NO OTHER THRESHOLD, NO OTHER
      COMPARISON, NO OTHER SCOPE. A shortfall of ONE is tolerated exactly as the
      arm E-prime limb declares. Infrastructure-failed and budget-cancelled units
      are excluded and named rather than scored as zeros - correct under AGENTS
      core rule 5. NO ARTIFACT OF THIS BATCH APPLIES A DIFFERENT RULE.
    but_see: "OBJ-1, OBJ-2 and OBJ-5 - the condition was applied faithfully; two of its three clauses could not have fired at these parameters."

  amendment_materiality_assessment:
    question: "Did QUEUE-AMEND-20260730-001 or -002 materially alter what BATCH-015 could conclude?"
    method: "git diff d0bdec84 085f5d48, read in full."
    finding: >-
      NO. The diff is PURE ADDITION - 274 insertions, ZERO deletions, across
