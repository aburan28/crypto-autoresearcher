      - prohibition: "No record may quote the C-20 power sentence unaccompanied by RT21-1, PDC-15's `better than 3.2e-5`, the deviation count of eight, or an EXP-YIELD-002 difference column."
        result: "NO VIOLATION. None appears in any probe artifact."
      - prohibition: "No record may issue RT-20260729-036 to any report."
        result: "NO VIOLATION, AND THIS REPORT MINTS NO RT-* IDENTIFIER AT ALL."
      - prohibition: "AND NO RECORD MAY STATE OR IMPLY THAT THE LEDGER VALIDATES."
        result: "NO VIOLATION. INT-BATCH012-F is carried unrepaired in the queue and no artifact contradicts it. THIS REPORT DOES NOT STATE OR IMPLY THAT THE LEDGER VALIDATES."

  batch_014_readjudication_check:
