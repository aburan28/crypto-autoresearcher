  what_would_falsify_my_own_recommendation:
    - id: SELF-F1
      falsifies: "OBJ-1, the tautology finding, which is the whole of my strongest objection."
      test: >-
        EXHIBIT ANY (inst, B, zeta3) FOR WHICH THE COMMITTED
        _build_phi_invariant_factor_base RETURNS A LIST WHOSE COMPLETE BLOCKS
        VIOLATE F[3j+k] == pow(zeta3,k,p) * F[3j] % p. I claim none exists because
        `xs.extend(orbit)` is the only mutation of xs on any path and `xs[:B]`
        preserves whole leading triples. ONE COUNTEREXAMPLE AND OBJ-1 FALLS
        ENTIRELY, and CTRL-4 (ii) becomes a real control.
    - id: SELF-F2
      falsifies: "OBJ-3, the 183-is-an-instrument-constant finding."
      test: >-
        SHOW THAT THE DISTINCT-TARGET COUNT STAYS 183 WHEN THE PROGRESSION
        MULTIPLIER c IS VARIED SO THAT gcd(c, n - 1) CHANGES. If 183 survives that
        variation, it is not 732/gcd(100,732) and my reading is wrong.
    - id: SELF-F3
      falsifies: "OBJ-2, the dead-clause finding."
      test: >-
        SHOW THAT THE ORBIT SUPPLY OR THE TRIAL BOUND MAKES len(F) != B REACHABLE
        AT OR NEAR B = 192 ON A DECLARED CURVE - for instance if CURVE-J16S3 or
        another declared instance has far fewer usable orbits than CURVE-J12S1's
        366. I did not sweep every declared curve; if such a curve is exhibited,
        the clause was live and OBJ-2 weakens to "live on one curve, dead on
        another".
    - id: SELF-F4
      falsifies: "My verdict that the probe does not support reopening the execution question."
      test: >-
        DEMONSTRATE THAT THE PRE-REGISTERED CONDITION, READ AS WRITTEN, ADMITS A
        CLAUSE I MISSED that the committed data trips. I read the driver's
        finish() implementation line by line and found exactly two clauses. If a
        third exists in the preserved text and the data trips it, my
        recommendation is wrong and reopening is owed.

  dissents_recorded_verbatim:
    - id: DISSENT-1
      against: "My own OBJ-4 and my own verdict."
      text: >-
        "A DISSENT AGAINST MY OWN REPORT. I have written that no arm comparison is
        supported. But the direction of the four uncensored units and of every
        target-count separation is CONSISTENT: arm A-prime reached the same quota
        on fewer targets at L24, L25, A12M3, A13M3 and X96, and produced more
        relations at L12 and L13. Seven signals, one direction, zero
        counterexamples in the committed data. I HAVE DECLINED TO CALL THAT A
        FINDING because the batch forbids it, because it is one instance and one
        realisation, and because I have not run the null-object control that would
        distinguish an orbit-structure effect from a plain coverage effect. THAT
        IS A SCOPE DECISION, NOT A MATHEMATICAL ONE, AND I RECORD MY OWN
        DISCOMFORT WITH IT. If a successor decensors the quantity and the
        direction holds, I will have been wrong to say nothing was there."
    - id: DISSENT-2
      against: "My own recommendation that CTRL-4 be rewritten rather than retired."
      text: >-
        "A SECOND DISSENT. It is arguable that CTRL-4 should simply be DELETED
        rather than repaired, since a mutation-tested version of it would still
        only check a constructor whose behaviour is fully determined by four lines
        of committed code that anyone can read. The counter-argument, which I
        accept only weakly, is that a contract executed by an agent should assert
        its assumptions mechanically rather than trusting a reading. I RECORD THE
        DISAGREEMENT RATHER THAN RESOLVING IT."
    - id: DISSENT-3
      against: "My own claim-ceiling audit finding of `none`."
      text: >-
        "A THIRD DISSENT, AGAINST MY OWN CLEAN BILL. I found no breach in the
        committed artifacts, and I stand by that. But the probe_manifest's
        `what_this_is` field and the snapshot receipt between them state the
        negative eleven times, and a document that must deny eleven claims is a
        document positioned close to all eleven. I DO NOT CALL THAT A BREACH.
        I DO SAY THAT THE DENSITY OF DENIAL IS ITSELF EVIDENCE OF HOW STRONG THE
        PULL TOWARD OVER-READING IS IN THIS LANE, and it is why OBJ-1, OBJ-3 and
        OBJ-4 are written as forward prohibitions rather than as observations."

