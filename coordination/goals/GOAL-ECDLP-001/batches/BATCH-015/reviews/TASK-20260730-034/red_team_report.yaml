  # ------------------------------------------------------------- CONTROLS (G5)
  required_controls:
    - id: CTRL-RT034-A
      name: "MUTATION TEST OF CTRL-4 - the cheapest discriminating control in this review."
      what_it_does: >-
        Re-run the CTRL-4 assertion against three deliberately broken inputs and
        require it to FAIL on each: (1) a zeta3 that is not a cube root of unity;
        (2) a factor base with one element of one complete block replaced by an
        unrelated on-curve x; (3) a factor base with two blocks' contents
        interleaved. If the assertion passes any of the three, the assertion is a
        mirror of the constructor and is retired or rewritten.
      why_it_is_the_cheapest: >-
        Milliseconds of compute, about ten lines, no new curve, no new cell, no
        closure, no alpha, no cost quantity. IT IS THE ONE MEASUREMENT THAT
        DETERMINES WHETHER "CTRL-4 PASSES" EVER MEANT ANYTHING.
      expected_outcome_prestated: >-
        Case (1) WILL PASS the assertion - I have already run it and reported it
        under OBJ-1. That is the finding. Cases (2) and (3) should fail; if they
        pass, the checker itself is broken as well as vacuous.
      should_it_be_dispatched: >-
        YES, IN A SUCCESSOR, AND NOT HERE. TASK-20260730-034 may not enlarge
        BATCH-015. It should be attached to any successor contract that retains
        CTRL-4, and CTRL-4 should not be retained in its present form without it.

    - id: CTRL-RT034-B
      name: "DECENSOR THE HEADLINE CELLS - break the 183 target-cycle ceiling."
      what_it_does: >-
        At L192 and L193 only, either (a) vary the target-progression multiplier
        so gcd(c, n - 1) = 1, giving up to 732 distinct targets, or (b) report the
        cell as censored with the ceiling quoted. Then re-measure len(relations)
        against Q = 202/203.
      why: >-
        Until the ceiling is broken, L192 and L193 measure 732/gcd(100,732) and
        nothing else, and the two cells the whole batch was built around are the
        two most confounded cells in it.
      note_on_scope: >-
        Option (a) changes committed harness behaviour and therefore needs a
        versioned protocol amendment; option (b) is free and can be done in
        prose. NEITHER IS DISPATCHED HERE.
      should_it_be_dispatched: "YES, IN A SUCCESSOR. Option (b) immediately and at zero cost; option (a) only under an amendment."

    - id: CTRL-RT034-C
      name: "REPORT THE UNCENSORED SUPPLY QUANTITY - hits against attempts."
      what_it_does: >-
        Report the already-returned `hits` and `attempts` at every cell as the
        supply quantity, instead of len(relations), which is clamped at Q.
      why: >-
        `_collect_relations` ALREADY RETURNS BOTH and the probe already recorded
        both. The quantity exists; only the reading is censored. This is not a
        cost quantity, not a ratio against any baseline and not a rate claim -
        it is two counts the committed loop returns.
      should_it_be_dispatched: "YES, IN A SUCCESSOR, and it costs zero additional compute because the numbers are already committed at e3cf9fdd."

    - id: CTRL-RT034-D
      name: "BUILDER FAILURE-BOUNDARY SWEEP - locate the B at which D-3's length limb actually breaks."
      what_it_does: >-
        Sweep B upward on the declared curves and record the first B at which
        _build_phi_invariant_factor_base returns a short list, so that every
        future D-3 assertion is positioned relative to a known boundary rather
        than at an unstated distance from one.
      prestated_expectation: >-
        About B = 1142 on CURVE-J12S1, from the 366 available full orbits. I have
        run this read-only and report it as a RED-TEAM DIAGNOSTIC, NOT AS A BATCH
        MEASUREMENT AND NOT AS EVIDENCE.
      should_it_be_dispatched: "YES, IN A SUCCESSOR. Seconds of compute; it converts OBJ-2 from an objection into a calibrated instrument."

    - id: CTRL-RT034-E
      name: "CROSS-CURVE BREADTH EXTENSION - more seeds, more curves, same censored quantity."
      what_it_does: "Repeat the fourteen-cell supply probe on additional j = 0 instances."
      should_it_be_dispatched: >-
        NO. I WOULD NOT RUN THIS, AND I NAME IT SO MY RECOMMENDATION IS
        FALSIFIABLE. It buys breadth on a quantity that is instrument-saturated
        at 24 of 28 units, so it would multiply censored numbers rather than
        produce information. Decensoring (CTRL-RT034-B and -C) strictly dominates
        it, and it should be reconsidered only AFTER the quantity is uncensored.

  counterexample_or_mutation: >-
    THE MUTATION THAT BREAKS THE READING, ALREADY EXECUTED. Call the committed
    _build_phi_invariant_factor_base(inst, 192, z) on CURVE-J12S1 with z = 5,
    whose cube modulo 2293 is 125 and which is therefore NOT a primitive cube root
    of unity. Both CTRL-4 conditions REPORT PASS. Same for z = 1234 (cube 1799).
    A structure assertion that passes on a factor base built from a non-cube-root
    is not an assertion about phi-invariance; it is the constructor's own
    arithmetic read back. THIS SINGLE THREE-LINE MUTATION DEFEATS THE
    INTERPRETATION "BOTH CTRL-4 STRUCTURE ASSERTIONS PASS, THEREFORE THE FACTOR
    BASE IS PHI-INVARIANT AS THE DERIVATION ASSUMES."

  baseline_comparison:
    what_is_being_compared: >-
      Nothing. The probe produces no time, memory, data or query figure that any
      baseline could be compared against, and its own manifest says so three
      times.
    pollard_rho: >-
      NOT COMPARED AND NOT COMPARABLE. The probe performs no solve, emits no
      certificate and computes no cost quantity. Pollard rho on this instance
      (n = 733) is trivial and would settle the instance outright; the probe does
      not attempt it and must not be read as competing with it.
    bsgs: "NOT COMPARED AND NOT COMPARABLE, for the same reason."
    closest_specialized_baseline: >-
      Pollard rho WITH the order-3 automorphism speedup - Wiener-Zuccherato and
      Duursma-Gaudry-Morain - which on a j = 0 curve gives the classical constant
      factor r = 3 (sqrt(3) in the number of steps for the automorphism group of
      order 3, quoted in this lineage as r = 3). THE ONLY REPRODUCIBLE SPEEDUP
      MEASURED ANYWHERE IN THIS LINEAGE IS THAT CONSTANT FACTOR, AND IT IS
      ALREADY THE SPECIALIZED BASELINE RATHER THAN AN IMPROVEMENT ON IT.
    dominated_by:
      - "Pollard rho with the order-3 automorphism (Wiener-Zuccherato; Duursma-Gaudry-Morain) - the specialized baseline for j = 0 curves. DOMINATES ON TIME, ON MEMORY AND ON DATA, since the probe offers no figure on any of the three axes."
      - "Plain Pollard rho and BSGS - dominate trivially for the same reason."
      - "EV-STR-001 and EV-STR-003 within this campaign, which at least measured quantities (yield, alpha) on the same instrument. The probe measures the instrument."
    dominated_by_null_is_refused: >-
      `null` WOULD BE A FABRICATION HERE UNDER AGENTS RULE 5 AND UNDER
      docs/inventor-protocol.md's Pareto-honesty clause. The frontier was checked
      on all three axes - time, memory, data/queries - and the probe is on none
      of them.
    sota_delta:
      time: "0. No time figure is produced. The recorded 2.05 s of PART B is budget accounting and is explicitly not a cost measurement."
      memory: "0. No memory figure is produced. The 76 MB peak RSS is budget accounting."
      data_or_queries: "0. No query or data complexity is produced."
      exponent: "0. No asymptotic exponent is moved, approached or bounded in either direction."
      summary: "sota_delta = 0 ON EVERY AXIS. The probe's contribution is instrument metrology, not a frontier movement, and this field says so rather than leaving it to be inferred."
    rule_A1_status: >-
      NOT TARGET-CLASS, and the constant factor r = 3 IS NOT TARGET-CLASS EITHER.
      docs/target-result-profile.md rule A1 asks for mechanisms that move the
      ASYMPTOTIC EXPONENT of a central hard problem; a constant factor of 3 leaves
      the exponent of sqrt(n) exactly where it was, and is in any case already
      classical. BATCH-015 is admitted only under A1's building-block clause, and
      the queue's own scope ruling says so. THIS REPORT AGREES WITH THAT
      SELF-ASSESSMENT AND DOES NOT SOFTEN IT.

  heuristic_challenges:
    - id: HC-1
      status: not_applicable_with_reason
      detail: >-
        The probe states no conditional result and introduces no numbered
        heuristic. It asserts deterministic properties of a deterministic builder
        and counts the output of a deterministic loop at fixed quotas, verified by
        an in-process determinism repeat at L12 and A12M3 in both arms, all PASS.
        THERE IS NO DISTRIBUTION TO SAMPLE AND NOTHING TO VALIDATE AT SCALE. The
        queue declares the conditional-result pairing rule inapplicable with its
        reason rather than fabricating a pairing, AND THAT IS THE CORRECT
        HANDLING.
    - id: HC-2
      status: forward_warning
      detail: >-
        The moment a successor writes "the phi-invariant factor base supplies more
        relations", it has stated a distributional claim over instances from n = 1
        curve and 1 seed, and the pairing obligation attaches to THAT record. The
        four uncensored units (L12, L13, both arms) are one realisation each on
        one instance and cannot support it.

  cost_model_challenges:
    - id: CMC-1
      detail: >-
        NO COST MODEL IS PRESENT AND NONE MAY BE INFERRED. The 2.05 s and 76 MB
        are budget accounting; peak RSS is a monotonic process peak, not a
        per-unit delta, and the driver says so. A successor must not build a
        per-entry constant, an o(1) overhead estimate or a time-memory
        interpolation from these numbers.
    - id: CMC-2
      detail: >-
        WHEN A COST MODEL DOES ARRIVE, the total expected cost must be per-attempt
        cost times INVERSE SUCCESS PROBABILITY, never per-attempt cost alone, and
        the van Oorschot-Wiener time-memory interpolation back to
        rho-with-automorphism must be reported, not just the headline. That
        obligation attaches to the successor cost experiment, WHICH IS NOT
        APPROVED, NOT FROZEN, NOT SCHEDULED AND NOT AUTHORIZED, AND WHICH THIS
        REPORT DOES NOT RECOMMEND APPROVING.
    - id: CMC-3
      detail: >-
        The eliminated-dimension rule (KN-LIT-7593) applies in advance: if a
        future record claims that phi-invariance removes a search dimension, the
        cost of BUILDING the invariant factor base must be charged into the total.
        The probe shows that build cost is not zero - 139 draws with a lift test
        each at B = 192 - and it is currently uncharged everywhere.

  reduction_and_scope_challenges:
    - id: RSC-1
      detail: >-
        SCOPE IS ONE INSTANCE. CURVE-J12S1 is p = 2293, n = 733, a = 0, b = 417,
        derived seed 100, curve_id TOY-P12-cf8e3078. Twelve-bit field. NOTHING
        HERE EXTENDS TO ANY OTHER CURVE, TO j != 0, TO GENERIC CURVES, TO B > 193,
        TO ARITY m > 3, OR TO MEDIUM OR CRYPTOGRAPHIC SCALE. Two cells touch a
        second instance (CURVE-J16S3) and both are quota-pinned.
    - id: RSC-2
      detail: >-
        AGENTS RULE 7 - TOY SCALE STAYS TOY SCALE. p = 2293 is roughly 244 bits
        short of any standardized parameter size. No validation at cryptographic
        scale exists in this lineage and none is claimed.
    - id: RSC-3
      detail: >-
        NO REDUCTION IS INVOKED AND NO COROLLARY IS DRAWN, so there is no cited
        theorem whose hypotheses need checking. AFFECTED-SCHEME SCOPE IS EMPTY:
        no deployed scheme is affected by this probe in any direction, and no
        artifact suggests otherwise.
    - id: RSC-4
      detail: >-
        DRIVER FIDELITY IS UNREACHABLE AND STAYS UNREACHED. Neither arm's closure
        is committed code; the driver has never been written. A derivation whose
        committed-code hypotheses hold is not thereby a correct prediction about
        an unwritten driver, and N-2 says so. This review adds nothing to and
        subtracts nothing from that.

  # ------------------------------------------------------------------- VERDICT
  verdict:
    overall: >-
      THE PROBE IS SOUND AS EXECUTED AND OVER-READ AS FRAMED. The artifacts are
      honest, in scope, reproducible, byte-verified at e3cf9fdd, and free of
      claim-ceiling breaches. The falsification condition was applied exactly as
      pre-registered and was frozen two commits and nineteen minutes before the
      probe existed. BUT TWO OF THE CONDITION'S THREE CLAUSES COULD NOT HAVE
      FIRED AT THESE PARAMETERS, AND 24 OF THE 28 SUPPLY UNITS REPORT A SATURATED
      INSTRUMENT CONSTANT RATHER THAN A SUPPLY MEASUREMENT. "It did not fire" is
      therefore worth much less than it reads.
    was_the_falsification_condition_capable_of_failing:
      part_a_clause_len_F_not_equal_B: "CAPABLE IN PRINCIPLE, DEAD IN PRACTICE. 76x trial-bound margin; failure boundary at B of about 1142 against a tested B of 192/193."
      part_a_condition_ii_block_identity: >-
        NOT CAPABLE AT ALL, AT ANY B, ON ANY CURVE, WITH ANY zeta3. It is a
        constructor identity. NOTE: condition (ii) is NOT part of the
        pre-registered falsification condition, which cites only `len(F) != B` -
        so this does not impugn the condition; it impugns the headline sentence
        "both CTRL-4 structure assertions PASS", which is where the information
        content is silently zero.
      part_b_clause_shortfall_ge_2: "GENUINELY CAPABLE. Tightest unit L12/arm_E_prime cleared it by a factor of 5.7. THIS IS THE ONE REAL TEST IN THE PROBE AND IT WAS PASSED."
    does_the_output_support_reopening_the_execution_question_on_the_merits: >-
      NO. The pre-registered disposition made reopening contingent on the
      condition FIRING, and it did not fire. Nothing measured here contradicts
      DEC-20260729-004's derivation on the two facts about committed code that it
      assumes, so far as those facts were actually reached. I SAY THIS PLAINLY
      RATHER THAN MANUFACTURING AN OBJECTION: the stand-down's basis is not shown
      defective by this probe. EQUALLY, NOTHING HERE SUPPORTS APPROVING ANYTHING,
      AND THIS REPORT RECOMMENDS NO APPROVAL AND NO ENLARGEMENT.
    is_this_a_closure: >-
      NO, IN EITHER DIRECTION. This report closes no lane, names no obstruction
      and declares nothing dead. Premature closure is a failure mode symmetric
      with overclaiming, and a count of instrument checks is not a statement about
      the endomorphism lane's mathematics.

  narrowest_supported_statement: >-
    AT COMMIT e3cf9fdd, ON THE SINGLE DETERMINISTICALLY GENERATED INSTANCE
    CURVE-J12S1 (p = 2293, n = 733, a = 0, b = 417, derived seed 100, curve_id
    TOY-P12-cf8e3078), THE COMMITTED harness.endomorphism_la
    _build_phi_invariant_factor_base RETURNED LISTS OF LENGTH EXACTLY 192 AND
    EXACTLY 193, AND THE COMMITTED _collect_relations WITH include_phi_orbits
    FALSE RETURNED, AT EACH OF FOURTEEN NAMED CELLS AND EACH OF TWO NAMED FACTOR
    BASES, A NUMBER OF RELATIONS NOT LESS THAN R_base(B) = (B + 2) // 3 + 1, THE
    TIGHTEST UNIT BEING L12/arm_E_prime AT 17 AGAINST 5. THE CTRL-4 BLOCK
    IDENTITY IS A CONSTRUCTOR TAUTOLOGY AND ESTABLISHES NOTHING. TWENTY-FOUR OF
    THE TWENTY-EIGHT SUPPLY COUNTS ARE CLAMPED AT Q(B) OR AT THE 183-TARGET
    CYCLE CEILING OF THE COMMITTED TARGET GENERATOR AND ARE NOT SUPPLY
    MEASUREMENTS. NO ARM COMPARISON IS SUPPORTED IN EITHER DIRECTION. ONE HOST,
    ONE SOFTWARE STACK, ONE REALISATION PLUS AN IN-PROCESS DETERMINISM REPEAT AT
