      not instrument_artifact_confirmed because F1_E fires and F4 fires.
    packaging_explicit_overclaim: false
    packaging_blocking_overclaim_exists: false

  objections:
    - id: RT003-B1
      severity: BLOCKING ON DECISION
      title: Favourable ladder must not be read as H-STR-002 mechanism support
      target: >-
        Any EV-STR-004 / DEC-20260730-014 / H-STR-002 status prose that treats
        ladder_verdict_F3=hold or ladder_verdict_F5_A_prime=hold as confirming
        H-STR-002's mechanism, primary prediction, or block-circulant structure.
      statement: >-
        F-5 does not fire for A-prime: alpha <= 3 on all ten ladder cells. F-3
        does not fire: alpha(A-prime)=0 exactly on L0={L12,L24,L48,L96,L192}.
        THAT LOOKS LIKE H-STR-002's primary words. It is not mechanism support.
        Arm E-prime — ZERO endomorphism content, same sigma closure convention —
        also has ladder_verdict_F5_E_prime=hold and the same L0 zeros. Spec
        N-1, N-2, F-5 companion sentence, IL1, and RT-20260730-002 I-2 forbid
        the reading in advance. The matching E-prime F-5 hold is the null-object
        control (inventor-protocol §3): the quantity that was supposed to depend
        on phi-invariance stays flat when the endomorphism content is removed.
      which_way_it_cuts: >-
        BLOCKS upward smuggle of H-STR-002. Does not invalidate the run package.
        Does not assert the mechanism is false (N-1).
      discharging_requirement: >-
        EV-STR-004 and DEC-20260730-014 must state, in the same terms as
        EV-STR-003, that neither verdict pole and neither ladder hold is support
        for or evidence against H-STR-002's mechanism. F-3/F-5 holds may be
        recorded as measured set equalities on the named cells only.

    - id: RT003-B2
      severity: BLOCKING ON DECISION
      title: Mixed plus A>E disagreements is not instrument_artifact_falsified
      target: >-
        Any reading that upgrades instrument_verdict=mixed into
        instrument_artifact_falsified, or that treats F-4 firing as
        endomorphism / phi-invariant factor-base content.
      statement: >-
        Falsification requires F-1 silent for A-prime AND a NAMED nonempty set
        of cells with alpha(E-prime) > alpha(A-prime). Measured: F1_A silent,
        but every F-4 disagreement has direction A_prime > E_prime on
        {L25,L49,L97,A13M3}, all with B mod 3 == 1 (plus the arity companion).
        That is exactly IL0's truncation-artifact pattern. Reading it as "the
        phi-invariant factor base is doing something mathematical" is forbidden
        in advance. Mixed correctly forces Coordinator instrument disposition
        inconclusive; it is not a weak form of falsified and not a partial
        confirmation of phi content. F1_E fires on the same four cells (MIS set
        identity fails while alphas differ), which further blocks any narrative
        that the arms agree except for a beneficial A-prime effect.
      which_way_it_cuts: >-
        Blocks upgrading mixed → falsified or mixed → "phi is doing work".
        Package label mixed is correct and must stand.
      discharging_requirement: >-
        Ledger prose must keep instrument_verdict=mixed, report IL0 beside the
        four A>E cells, name the F1_E cells, and set the instrument question to
        inconclusive.

    - id: RT003-B3
      severity: BLOCKING ON DECISION
      title: Fourteen toy cells do not license alpha = O(1) or any asymptotic
      target: >-
        Any asymptotic, O(1), exponent, or scale-extrapolating sentence citing
        EXP-STR-004 / this mixed verdict / the F-5 holds.
      statement: >-
        Spec N-2 and claim_ceiling forbid concluding that alpha is O(1) or is
        not. Maximum field_bits=16, B<=193, fourteen cells, one unreplicated
        realisation. AGENTS rule 7: toy stays toy. All four asymptotic-claim
        promotion gates remain OPEN. A silent F-5 on a doubling ladder at these
        sizes is a finite set equality, not an asymptotic.
      which_way_it_cuts: >-
        Blocks exponent-first / O(1) smuggle. Package itself makes no asymptotic
        claim.
      discharging_requirement: >-
        EV/DEC must restate claim_ceiling: no B>193, no field_bits>16, no
        asymptotic in either direction.

    - id: RT003-B4
      severity: BLOCKING ON DECISION
      title: No cost claim is licensed; wall_seconds are not results
      target: >-
        Any cost_ratio, structured_solve, Wiedemann, density-penalty, crossover,
        or "beats rho/BSGS" sentence citing this run package.
      statement: >-
        Spec N-4: the contract measures no time as a result, no memory as a
        result, no operation count, no baseline. H-STR-002's second and third
        predictions (density penalty, structured vs Wiedemann) are untouched.
        RT-CM-1 through RT-CM-6 remain OPEN. wall_seconds_* in sweep_summary.json
        are finalize/ops telemetry with an explicit note that
        wall_seconds_total is finalize-only — not a cryptanalytic cost path.
        Total expected attack cost was never assembled (no RHS, no solve, no
        rho/BSGS baseline at these cells). An unchecked dominated_by=null
        claiming a Pareto win would be fabrication under AGENTS rule 5 /
        inventor-protocol §4.
      which_way_it_cuts: >-
        Blocks cost smuggle from alpha small or from wall-clock fields.
      discharging_requirement: >-
        EV/DEC must state N-4 explicitly; no cost model is recharged or defended
        from this batch.

    - id: RT003-M1
      severity: MAJOR
      title: >-
        Top-level F3/F5 hold fields invite favourable-ladder smuggle without a
        packaging-local N-1/N-2 caveat
      target: experiments/EXP-STR-004/results/sweep_summary.json top-level keys
      statement: >-
        The summary correctly separates ladder_verdict_F3 / F5_* from
        instrument_verdict and sets executor_interprets=false. It does not
        assert mechanism support. Nevertheless the top-level juxtaposition
        instrument_verdict=mixed with three ladder holds and empty
        instrument_verdict_reason_codes is the exact DEC-20260726-006 failure
        mode the contract was written to prevent: a skimmer sees "alpha<=3 on
        the ladder" and reads H-STR-002. This is NOT an explicit packaging
        overclaim and does NOT require rewriting the immutable run package. It
        IS a MAJOR adoption hazard for TASK-20260730-013.
      which_way_it_cuts: >-
        Forces explicit anti-smuggle sentences in the ledger commit; does not
        invalidate or reopen the snapshot.
      discharging_requirement: >-
        Coordinator ledger archive writes the N-1/N-2/IL0 sentences beside any
        quotation of the F-3/F-5 holds; do not edit sweep_summary.json.

    - id: RT003-M2
      severity: MAJOR
      title: Scope creep beyond the fourteen named cells is forbidden
      target: >-
        Any generalization to other curves, B, m, hosts, or to GOAL-ECDLP-001
        completion.
      statement: >-
        Claim_ceiling and interpretation_limits confine every licensed statement
        to these two curves, fourteen (curve,B,m) cells, two arms, this solver
        path, this budget, toy tier. Cross-curve cells X96/X97 agree (F-4 silent
        there); that does not widen the ladder statements. Arity cells do not
        license m>3. No GOAL completion criterion is met.
      discharging_requirement: >-
        EV status_scope and DEC next_action must name the fourteen cells and
        forbid reject_scoped on this single unreplicated empirical-only set
        (N-3; dispatch constraint on TASK-20260730-013).

    - id: RT003-I1
      severity: INFORMATIONAL
      title: Packaging correctly labels mixed; no explicit packaging overclaim
      statement: >-
        instrument_verdict=mixed matches v3 verdict_rule for the realised
        matrix cell. reason_codes=[] is correct (codes attach to
        prediction_failed when F4 is silent, not to mixed). F1_E cells,
        F4 disagree directions, F3/F5 separate fields, and
        executor_interprets=false are present. packaging_blocking_overclaim_exists
        remains false.
      discharge: null

    - id: RT003-I2
      severity: INFORMATIONAL
      title: Prior I-2 favourable-ladder warning is realised, not discharged
      statement: >-
        RT-20260730-002 I-2 pre-registered that a silent F-5 is not H-STR-002
        support when E-prime matches. The measurement realises exactly that
        pattern (F5_A hold AND F5_E hold). The warning is now binding on the
        ledger write, not merely anticipatory.
      discharge: null

  objection_counts:
    BLOCKING_ON_DECISION: 4
    BLOCKING_ON_PACKAGING: 0
    MAJOR: 2
    MINOR: 0
    INFORMATIONAL: 2

  packaging_blocking_overclaim_exists: false
  packaging_blocking_overclaim_note: >-
    No explicit sentence in the snapshot-committed results packaging asserts
    mechanism support, asymptotics, cost advantage, or crypto-scale scope.
    Blocking objections RT003-B1..B4 constrain Coordinator interpretation and
    ledger prose, not package integrity. The package needs no repair and must
    not be edited.

  required_controls:
    - id: CTRL-NULL-F5
      control: >-
        Already present in the design: arm E-prime with zero endomorphism
        content. Demand that any positive reading of F5_A hold be checked
        against F5_E. Measured: both hold → controlled null for mechanism
        attribution.
      cheapest_discriminating_action: >-
        In EV-STR-004, place F5_E_prime=hold in the same sentence as F5_A_prime=hold
        and state that the match blocks mechanism attribution (N-2).
    - id: CTRL-IL0-DIRECTION
      control: >-
        For every F-4 disagree cell, require the direction field. Measured
        directions are uniformly A>E on B≡1 cells → truncation artifact under
        IL0, not E>A falsification.
      cheapest_discriminating_action: >-
        Quote the four (cell, direction) pairs verbatim in EV-STR-004; forbid
        paraphrasing F-4 as phi-content.
    - id: CTRL-NO-COST-BASELINE
      control: >-
        Confirm absence of archived rho/BSGS/Wiedemann baselines and of any
        assembled linear system with RHS at these cells before any cost sentence.
      cheapest_discriminating_action: >-
        Grep EV/DEC drafts for cost_ratio|wiedemann|structured_solve|density_penalty;
        delete any hit that cites EXP-STR-004.

  counterexample_or_mutation: >-
    Cheapest discriminating mutation already realised: replace the
    phi-invariant factor-base builder with the E-prime sigma-closure builder
    (zero endomorphism). Predicted if mechanism drove F-5: F5_E should fire
    (alpha grow) while F5_A holds. Observed: F5_E holds identically. Therefore
    a favourable A-prime ladder is not evidence of endomorphism structure at
    these cells. Second cheap check: if anyone claims instrument_artifact_falsified,
    exhibit a cell with alpha(E)>alpha(A) — none exists in the committed matrix.

  baseline_comparison: >-
    Not applicable as an attack-cost comparison: this contract is an instrument
    measurement, not an ECDLP solver run. Closest specialized baselines for
    H-STR-002's cost claim (Pollard-rho, BSGS, Wiedemann O(B^2), structured
    O(alpha^2 B log B)) were not measured and may not be charged from these
    artifacts. Relative to the instrument question: E-prime is the correct
    null baseline; it matches A-prime on F-5 and on all B≡0 ladder alphas, and
    undercuts A-prime alpha on the four truncation cells.

  heuristic_challenges:
    - >-
      No numbered exemplar-style heuristic is validated here; the experiment is
      explicitly not target-class (claim_ceiling / rule A1). Any implicit
      transfer from "alpha<=3 on a 16-bit ladder" to cryptographic GLV instances
      is an unstated heuristic and is rejected (AGENTS rule 7).
    - >-
      Random-model transfer does not arise: MIS/alpha are deterministic linear-
      algebra quantities on named cells under a frozen builder, not smoothness
      samples. The relevant null is the E-prime construction, not a random
      integer model.

  cost_model_challenges:
    - >-
      Per-attempt vs total expected cost: neither is measured. Small alpha does
      not imply total attack cost; relation-density penalty is unmeasured;
      success probability for an end-to-end solve is unset.
    - >-
      wall_seconds_total=2.774209 is finalize-only telemetry
      (wall_seconds_total_note); wall_seconds_cells_sum_from_manifests=1.28763
      is not a result metric under N-4.
    - >-
      Memory, o(1)/polylog overheads, and van Oorschot–Wiener interpolation are
      all out of scope; silence is correct, not an invitation to fill them from
      alpha.

  reduction_and_scope_challenges:
    - >-
      No reduction corollary (OneEnd/EndRing/Isogeny or index-calculus descent)
      is instantiated; none may be claimed.
    - >-
      Affected-vs-safe scheme lists must not mention this experiment: no scheme
      reduces to "phi_alpha on fourteen toy cells".
    - >-
      Status scope for any ledger write: two j=0 curves, field_bits in {12,16},
      B<=193, m in {2,3}, fourteen named cells, arms A-prime/E-prime, toy tier,
      one unreplicated run set under DEV-BASE-1.

  narrowest_supported_statement: >-
    Under frozen specification.v3.yaml at 135149d0, on the TASK-20260730-010
    snapshot 76b9e602, twenty-eight completed_valid runs at the fourteen named
    cells produced instrument_verdict=mixed: F-1 silent for A-prime; F-1 fires
    for E-prime at L25, L49, L97, A13M3; F-4 agreement is a nonempty proper
    subset of the fourteen with disagree directions uniformly A_prime > E_prime
    on those four cells; F-3 holds (A-prime zeros exactly on L0); F-5 holds for
    both A-prime and E-prime on the ten ladder cells; F-2 silent; certificates
    654/654 pass. THAT LICENSES: (M-2) an inconclusive disposition on the
    instrument question at toy tier on these fourteen cells, and (M-1)
    procedural discharge of DEFER-BATCH009-001 once independent review and
    ledger archive complete. IT LICENSES NOTHING ELSE — not H-STR-002 mechanism
    right or wrong, not alpha=O(1), not any cost statement, not crypto-scale
    validation, and not reject_scoped on this single unreplicated set.

  sentences_that_may_not_be_written:
    - H-STR-002 is supported / strengthened by EXP-STR-004.
    - The favourable ladder confirms alpha = O(1) / O(r).
    - Phi-invariant factor bases beat Wiedemann / rho / BSGS on this evidence.
    - instrument_artifact_falsified (no E>A cell).
    - instrument_artifact_confirmed (F1_E fires; F4 fires).
    - F-4 shows endomorphism content / phi is doing mathematical work.
    - Any GOAL-ECDLP-001 completion criterion is met.
    - reject_scoped on this unreplicated empirical-only run set.

  next_concrete_action: >-
    TASK-20260730-013 writes EV-STR-004 and DEC-20260730-014 with instrument
    disposition inconclusive, status_scope locked to the fourteen toy cells,
    explicit N-1/N-2/N-4/IL0 anti-smuggle sentences beside the F-3/F-5 holds,
    knowledge_promotion filled either way, exactly one next action, and no
    reject_scoped. Do not edit the run package.

  the_ruling_asked_for:
    question: >-
      Can the mixed instrument_verdict and favourable ladder be read as
      H-STR-002 support, asymptotic O(1), cost win, or scope beyond fourteen
      toy cells?
    ruling: >-
      NO. Mixed is correct and inconclusive on the instrument question. The
      F-3/F-5 holds are measured set equalities that E-prime matches; they are
      not mechanism support. No asymptotic, no cost, no scope expansion. No
      explicit BLOCKING overclaim exists in the results packaging; BLOCKING
      constraints attach to the Coordinator's ledger reading.

  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-015/reviews/TASK-20260730-012/red_team_report.yaml
