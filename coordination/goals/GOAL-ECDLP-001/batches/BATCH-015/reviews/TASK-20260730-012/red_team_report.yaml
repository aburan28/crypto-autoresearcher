  claim_under_review: >-
    That the mixed instrument_verdict of EXP-STR-004 v3, together with
    ladder_verdict_F3=hold and ladder_verdict_F5_{A,E}_prime=hold on the
    fourteen named cells, can be read as (i) support for H-STR-002's mechanism,
    (ii) evidence that alpha is O(1), (iii) a cost or structured-solve claim,
    (iv) a result beyond the fourteen toy cells, or (v) instrument-artifact
    falsification / endomorphism content from the F-4 disagreements.

  snapshot_under_review:
    run_package_commit: 76b9e602390aff281ad6ba73412ee6c4dca98d1f
