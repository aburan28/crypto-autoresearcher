      B193: "len(F) = 193, B = 193 -> false"
      fires: false
    clause_2_shortfall_ge_2:
      units_evaluated: 28
      maximum_shortfall_observed: 0
      units_with_shortfall_ge_2: []
      fires: false
    my_verdict_fired: false
    my_maximum_shortfall: 0
    probe_reported_fired: false
    probe_reported_contributing_entries: []
    agreement: CONFIRMED
    disagreement_blocking: false
    statement: >-
      I CONFIRM, INDEPENDENTLY AND NOT ON THE EXECUTOR'S WORD, THAT THE
      PRE-REGISTERED FALSIFICATION CONDITION DID NOT FIRE AND THAT THE MAXIMUM
      SHORTFALL IS ZERO. The contributing set is empty. There is no disagreement
      to raise as BLOCKING.
    what_not_firing_does_not_mean: >-
      A non-firing falsification condition means the probe found no reason to
      declare the instrument unfit on these two conditions at these fourteen
      cells. IT IS NOT SUPPORT FOR H-STR-002, NOT EVIDENCE OF A MECHANISM, NOT A
      COST STATEMENT, AND NOT AN APPROVAL OF EXP-STR-004.

  # ------------------------------------------------------------------ findings
  findings:
    - id: F-1
      severity: medium
      blocking: false
      title: >-
        The 183-target ceiling is a property of the harness's target GENERATOR,
        not of the curve - correctly measured, but not characterised, and it will
        bind again in any larger EXP-STR-004 execution.
      question_asked: >-
        Is 183 a genuine exhaustion of the target range on a p = 2293 curve, or
        an artifact of the loop's break condition?
      answer: >-
        NEITHER, EXACTLY. It is a GENUINE SATURATION and NOT a break-condition
        artifact - but it is NOT exhaustion of the curve's target range.
      derivation: >-
        _collect_relations enumerates k = (t_idx+1)*c mod (n-1) + 1 with
        c = max(2, inst.seed % max(2, n-3)). For CURVE-J12S1: n = 733,
        inst.seed = 100, so c = 100 and the image of the progression is the
        subgroup of multiples of gcd(100, 732) = 4 in Z/732, of size 732/4 = 183,
        with period 183 in t. I simulated the loop's own generator over t ranges
        of 300, 1010 and 5000 and got distinct target_x = 183, 183, 183 -
        INVARIANT. Since 5*Q is 300 at L12 and 1010 at L192 and the count does
        not grow, the range(num_targets * 5) break is NOT the binding
        constraint. So the loop truly runs out of reachable targets.
      but: >-
        Over ALL k in 1..n-1 the curve has 366 distinct x-coordinates
        (= (n-1)/2, since k and n-k share an x). The loop reaches 183 = EXACTLY
        50.0% of them, because every k it generates satisfies k = 1 mod 4
        (verified: the set of residues mod 4 hit over 2000 iterations is exactly
        {1}). Calling 183 "exhaustion of the target range on a p = 2293 curve"
        would OVERSTATE it by a factor of two.
      consequence: >-
        At L192 and L193 the loop stops at 183 relations against a quota of
        202/203 - a real supply ceiling, though still far above R_base = 65/66,
        which is why the shortfall is 0 and the falsification condition
        correctly does not fire. The ceiling is a LATENT LIMITATION OF THE
        COMMITTED INSTRUMENT: no cell on CURVE-J12S1 can ever obtain more than
        183 base rows, regardless of B or Q, and a future EXP-STR-004 execution
        at larger quota on this curve will hit the same wall silently.
      why_not_a_probe_defect: >-
        The probe MEASURES this correctly and defines its measurement exactly:
        distinct_target_count_definition states that `attempts` is the loop's own
        counter, incremented once per newly-seen target x-coordinate, and that no
        target sequence is re-derived. The probe does not claim 183 is a curve
        property. The gap is that nothing in the package explains WHY it is 183,
        so a downstream reader could adopt the stronger reading.
      recommended_disposition: >-
        FOR THE COORDINATOR, NOT FOR ME: carry this as a named limitation on any
        record citing the probe, and treat it as a design constraint on
        EXP-STR-004 before execution. I make no disposition and move no state.

    - id: F-2
      severity: low
      blocking: false
      title: "probe_manifest.json inference block omits reasoning_effort, degraded-requirements and an explicit backend field."
      detail: >-
        AGENTS.md artifact policy (lines 287-303) requires "reasoning effort,
        whether fallback was used, and any degraded requirements" and "requested
        model policy, backend, and resolved runtime model identifier". The
        manifest carries requested_policy, resolved_model_id, model_verified with
        an honest reason, fallback_used with an honest reason,
        independent_session_required and model_independence_claimed - but has NO
        reasoning_effort key, NO degraded-requirements key, and NO explicit
        backend key (the backend is only inferable from fallback_reason). The
        TASK-20260730-031 card carries reasoning_effort: null, so nothing is
        contradicted; the field is simply not carried into the receipt.
      affects_any_measured_quantity: false

    - id: F-3
      severity: low
      blocking: false
      title: "The single dirty worktree path at run time is counted but not named."
      detail: >-
        environment.json records PROBE_GIT_DIRTY_COUNT = "1" with head_commit
        085f5d48 (the parent - correct, since the probe ran before its artifacts
        were committed). The dirty PATH is not recorded, so the receipt does not
        let a reviewer confirm which file it was. It is almost certainly
        probe_driver.py itself, written but not yet committed, which is
        consistent with everything else in the package - but that is my
        inference, not a recorded fact, and I flag it rather than assert it.
        A count without its member is precisely the cardinality-not-identity
        pattern this campaign has recorded six times, in miniature.
      affects_any_measured_quantity: false

    - id: F-4
      severity: informational
      blocking: false
      title: "`hits == len(relations)` in all 28 rows is a TAUTOLOGY of the committed counting, not a substantive observation."
      detail: >-
        In the committed loop (endomorphism_la.py 281-290) hits is incremented on
        every `found`, and a row is appended on every `found` whose row is
        non-zero. The row can be all-zero only if NO summand's x-coordinate lies
        in the factor base - unreachable in practice, since _find_decomposition
        searches for summands drawn from the factor base. So the equality is
        forced by construction. Its ONLY informational content is that the
        `sum(row) > 0` guard discarded no hit at any of the 28 units. It says
        nothing about relation quality, independence or usefulness, and any
        record presenting it as an empirical finding would be overreading it.
        The probe itself does not do so.

    - id: F-5
      severity: informational
      blocking: false
      title: "What the in-process determinism check does and does not establish."
      establishes: >-
        The committed functions are referentially stable WITHIN ONE PROCESS - no
        hidden mutable module state, no RNG advancing between calls, no
        invocation-order dependence. Real and non-trivial, and the check is
        correctly scoped and correctly labelled ("Same process, second
        execution, same commit").
      does_not_establish:
        - >-
          CROSS-PROCESS reproducibility. A same-process repeat shares
          PYTHONHASHSEED and all interned state and therefore CANNOT detect
          set/dict-iteration-order dependence, which is fixed for the process
          lifetime.
        - "Cross-machine, cross-OS or cross-Python-version reproducibility (one host, one stack)."
        - "Coverage beyond L12 and A12M3 - only 2 of 14 cells were repeated."
        - "Correctness. A deterministic function reproduces a wrong answer exactly as faithfully as a right one."
      partially_closed_by_this_review: >-
        My re-execution ran in a SEPARATE PROCESS on the same host and reproduced
