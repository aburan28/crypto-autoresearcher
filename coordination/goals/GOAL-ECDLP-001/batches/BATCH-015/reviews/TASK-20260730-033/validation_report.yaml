  # ---------------------------- independent verdict on the falsification rule
  falsification_condition_independent_evaluation:
    rule_as_stated: >-
      Fires if len(F) != B at B = 192 or at B = 193, OR if
      max(0, R_base(B) - len(relations)) >= 2 at any (cell, arm).
    evaluated_by_me_from_my_own_re_execution: true
    clause_1_len_F_ne_B:
