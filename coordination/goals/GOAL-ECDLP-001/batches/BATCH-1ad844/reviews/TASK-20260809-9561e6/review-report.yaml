  findings:
    - id: VAL-CE875B-HASH-GRAMMAR-001
      severity: critical
      blocking: true
      category: byte_exact_SHA256_message_grammar
      exact_evidence_locations:
        - ledger/proposals/IDEA-20260809-ce875b.yaml:645
        - ledger/proposals/IDEA-20260809-ce875b.yaml:669
        - ledger/proposals/IDEA-20260809-ce875b.yaml:685
        - ledger/proposals/IDEA-20260809-ce875b.yaml:701
      independent_recomputation: >-
        The numerical family sizes and compression-block totals all reconcile,
        but they do not determine message bytes. generator-bundle-header-64-v1
        lists semantic contents without offsets, field widths, integer
        encodings, magic bytes, bundle-class codes, or an exact schema-id
        encoding. planted-audit-digest-header-64-v1 likewise has no layout; a
        literal complete XOFKey64 already consumes all 64 header bytes, while
        the prose also names denominator class, first-decision index,
        consumed-bit count, and cap status. The record does not state that
        those fields are derived rather than serialized. Selected-pair,
        matched-rank, canonical-root-seed, fixture-transcript, and archive-pass
        families contain only aggregate message lengths and operation rows,
        without a complete header, field order, and byte encoding. Thus equal
        raw payloads in different contexts are not demonstrably separated by
        the fixed headers claimed in PC-HASH-COMPLETENESS.
      impact: >-
        Several declared digests cannot be regenerated byte-for-byte from the
        proposal. Exact lengths and block counts are arithmetic identities, not
        a collision-free serialization certificate. Hash, traffic, CPU, wall,
        and archive completeness therefore remain unestablished.
      cheapest_bounded_repair: >-
        In a new immutable successor, freeze one offset/width/endianness/code
        table and one canonical byte fixture for every SHA-256 family. State
        explicitly which values are serialized and which are deterministically
        derived, then regenerate all message lengths, blocks, rows, and archive
        mappings.

    - id: VAL-CE875B-CERT-HASH-001
      severity: major
      blocking: true
      category: omitted_interval_certificate_hash_work
      exact_evidence_locations:
        - ledger/proposals/IDEA-20260809-ce875b.yaml:809
        - ledger/proposals/IDEA-20260809-ce875b.yaml:830
        - ledger/proposals/IDEA-20260809-ce875b.yaml:842
        - ledger/proposals/IDEA-20260809-ce875b.yaml:685
      independent_recomputation: >-
        The certificate specification requires nine certificate_sha256 values
        and says to hash certificate bytes. The complete SHA-256 schedule has
        no nine-message family, no certificate-byte serialization, no absorbed
        byte count, no compression blocks, no CPU or wall charge, and no output
        archive subfield for these digests. Therefore 785684 cannot be the
        complete message count under the proposal's own certificate contract.
      impact: >-
        The hash and resource headlines omit explicitly required work, and the
        certificate bytes themselves are not canonically defined.
      cheapest_bounded_repair: >-
        Freeze a canonical certificate serialization, add exactly nine framed
        SHA-256 messages and output mappings, and recompile the affected traffic,
        operation, CPU, wall, archive, and headline totals.

    - id: VAL-CE875B-ARCHIVE-HASH-001
      severity: critical
      blocking: true
      category: self_referential_archive_digest_container
      exact_evidence_locations:
        - ledger/proposals/IDEA-20260809-ce875b.yaml:701
        - ledger/proposals/IDEA-20260809-ce875b.yaml:710
        - ledger/proposals/IDEA-20260809-ce875b.yaml:1261
      independent_recomputation: >-
        The schedule hashes all 84 complete archive write/read rows and stores
        all 84 resulting digests inside archive.hashes-and-container-index.
        That allocation is itself one of the 42 allocations and therefore has
        its own write and verification-read digests among the 84. The absorbed
        byte total is exactly the full two-pass allocation total, with no
        excluded digest field, zero-neutral representation, detached manifest,
        or fixed-point construction. The two self-digests therefore depend on
        bytes that contain the same digests.
      impact: >-
        The archive-pass hash schedule has no finite byte-reproducible value as
        written, so its 84 messages, 70396786 blocks, and enclosing mapping
        cannot be admitted as an executable integrity contract.
      cheapest_bounded_repair: >-
        Use an explicit self-neutral rule analogous to a null self field, or
        move the 84 digests to a detached allocation excluded from the hashed
        payload. Freeze the exact neutral bytes and recompute both passes.

    - id: VAL-CE875B-CURVE-SCHEMA-001
      severity: major
      blocking: true
      category: undefined_curve_stream_schema_code
      exact_evidence_locations:
        - ledger/proposals/IDEA-20260809-ce875b.yaml:1030
      independent_recomputation: >-
        The stream header assigns tag 1 a four-byte payload named schema_code,
        but schema_code occurs nowhere else in the proposal. No numeric value,
        byte order, or relation to the textual schema id is frozen. All other
        header and point-frame lengths reconcile, but this four-byte payload
        remains undefined.
      impact: >-
        None of the 160 ordered curve/outcome messages has a unique byte string,
        despite the otherwise exact 25316-byte length and 63360-block total.
      cheapest_bounded_repair: >-
        Freeze one exact u32be schema-code value in the code table, add a
        canonical 60-byte header fixture, and recheck all 160 stream hashes.

