  verdict: REVISE
  verdict_scope: proposal_readiness_for_a_separately_frozen_future_experiment_design_only
  verdict_summary: >-
    The immutable successor repairs the XOFKey64 item-ordinal grammar, the six
    selector-bootstrap arm names, the repaired gamma=3/10 eta=0 rational
    bracket, the numerical curve/outcome framing totals, and the conservative
    exponent-class-only Pareto boundary. Its internally stated XOF, SHA-256,
    traffic, archive, CPU, wall, sampler, curve, and exponent-row arithmetic
    recomputes exactly. It is not yet byte-reproducible or hash-schedule
    complete. The generator-bundle header is prose rather than an offset and
    code table; the planted-audit 64-byte header has no layout that explains
    how a complete 64-byte XOFKey64 and the additionally named fields are
    encoded; selected-pair, matched-rank, canonical-root-seed, fixture-
    transcript, and archive-pass messages have lengths but no complete byte
    grammar. The required nine interval-certificate SHA-256 values are absent
    from the schedule, and their certificate serialization is undefined. The
    84 archive-pass hashes include the hashes-and-container-index allocation
    that encloses those same hashes, with no self-neutralization rule. The
    curve-stream header also leaves its four-byte schema_code value and
    encoding undefined. These are bounded deterministic proposal defects, so
    the proposal-readiness verdict is REVISE rather than NO-GO.

