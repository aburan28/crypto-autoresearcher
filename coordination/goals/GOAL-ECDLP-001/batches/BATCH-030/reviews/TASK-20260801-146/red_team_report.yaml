red_team_report:
  id: RT-20260801-146
  task_id: TASK-20260801-146
  batch_id: BATCH-030
  goal_id: GOAL-ECDLP-001
  claim_under_review: >-
    Executor claim (TASK-20260801-143) that RUN-IT-001-rerun is a
    completed_valid measurement under EXP-IT-001 v3 + repair overlay
    PA-IT-001-v3-rc30-repair-1-to-7, with FIX-1..FIX-7 PASS,
    planted_path_recovered=true, plant_detected=true, R_xfer=0.1107 on the
    planted path, n_unplanted=21, rate_iso_1_fraction_R_ge_1=0.0,
    rho_special_by_bits all 0.0.
  reviewer_role: red-team
  independent_session: true
  reviewed_record_ids:
    - experiments/EXP-IT-001/specification.v3.yaml
    - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc30-repair-1-to-7.yaml
    - experiments/EXP-IT-001/runs/RUN-IT-001-rerun/manifest.json
    - experiments/EXP-IT-001/runs/RUN-IT-001-rerun/raw-result.json
    - experiments/EXP-IT-001/runs/RUN-IT-001-rerun/command.txt
    - experiments/EXP-IT-001/runs/RUN-IT-001-rerun/environment.json
