  task_id: TASK-20260801-145
  batch_id: BATCH-030
  goal_id: GOAL-ECDLP-001
  experiment_id: EXP-IT-001
  hypothesis_id: H-IT-001
  claim_under_review: >-
    Executor claim (TASK-20260801-143, execution_report.yaml) that
    RUN-IT-001-rerun is a completed_valid measurement under EXP-IT-001 v3 +
    repair overlay PA-IT-001-v3-rc30-repair-1-to-7, with FIX-1..FIX-7 all PASS,
