    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/tasks/TASK-20260801-143/execution_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/archives/TASK-20260801-144/snapshot_commit_receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/dispatch_queue.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-030/tasks/TASK-20260801-146/red_team_report.yaml
