corrected_rows:

  - handle: B22-T03
    defect_class: MATERIAL_THEOREM_COST_MISSTATEMENT
    title: Fiat-Naor and Hellman source-free function inversion
    field_corrected: primary_source.exact_result
    prior_text: >-
      "The paper's main tradeoffs invert a supplied f:[N]->[N]: T*S^2=N^3*q(f),
      where q(f) is the collision probability of two uniform inputs, and the
      all-function/all-point tradeoff T*S^3=N^3. For a permutation, the classic
      Hellman tradeoff gives S*T about N after preprocessing; balanced online
      time and storage are N^(1/2+o(1))."
    what_is_wrong: >-
      The row conflates two different results under one source. The first two
      relations are Fiat-Naor's. The third sentence -- S*T about N with a
      balanced N^(1/2) point -- is NOT a Fiat-Naor guarantee; it is the
      permutation case of Hellman's construction. Specialising Fiat-Naor's OWN
      relation to a permutation gives a strictly weaker bound than the row
      claims, so the row credits the cited paper with a result it does not
      prove and simultaneously understates that paper's cost by a factor
      N^(1/6) in the balanced exponent.
    corrected_text: >-
      Fiat-Naor (1999) proves rigorous tradeoffs for inverting a supplied
      f:[N]->[N]: T*S^2 = N^3*q(f), where q(f) is the probability that two
      uniform independent inputs collide under f, and the all-function
      all-point tradeoff T*S^3 = N^3. For a PERMUTATION, q(f) = 1/N, so
      Fiat-Naor's first relation specialises to T*S^2 = N^2, whose balanced
      point is T = S = N^(2/3) -- NOT S*T = N and NOT N^(1/2). The S*T = N
      permutation relation, with balanced online time and storage N^(1/2), is
      the permutation case of HELLMAN's (1980) construction and must be cited
      to Hellman, not to Fiat-Naor. Hellman's construction for a RANDOM
      FUNCTION is weaker still: m*t^2 = N per table over t tables, giving
      balanced online time and memory T = M = N^(2/3), i.e. T*M^2 on the N^2
      scale at constant coverage. Preprocessing is N f-evaluations in every one
      of these variants.
    arithmetic_check:
      performed_by_this_session: true
      fiat_naor_permutation: >-
        q(f) for a permutation is Pr[f(x1) = f(x2)] over uniform independent
        x1,x2, which for an injective f equals Pr[x1 = x2] = 1/N. Substituting
        into T*S^2 = N^3*q(f) gives T*S^2 = N^3/N = N^2. Setting T = S gives
        T^3 = N^2, so T = N^(2/3). The reviewer's specialisation is internally
        consistent.
      fiat_naor_all_function: >-
        T*S^3 = N^3 balanced at T = S gives T^4 = N^3, T = N^(3/4). Consistent.
      hellman_random_function: >-
        With m*t^2 = N per table and t tables, memory M = m*t and online time
        T = t*t = t^2. At m = t = N^(1/3): M = N^(2/3) and T = N^(2/3), and
        T*M^2 = N^(2/3)*N^(4/3) = N^2. Consistent with the reviewer.
      hellman_permutation: >-
        A single table with m*t = N gives S = m, T = t, hence S*T = N and a
        balanced point of N^(1/2). Consistent -- and demonstrably a DIFFERENT
        relation from Fiat-Naor's N^2, which is the whole point of the defect.
      conclusion: >-
        All four specialisations check out arithmetically. The reviewer's
        finding is sound as arithmetic; what remains unverified here is only
        the attribution of the base relations to the papers.
    carried_unverified:
      - That Fiat-Naor state T*S^2 = N^3*q(f) and T*S^3 = N^3 in those forms.
      - That Hellman's paper presents the permutation relation and the m*t^2 = N random-function construction as described.
    rejection_robustness: >-
      THE CORRECTION DOES NOT CHANGE THE VERDICT, AND THE VERDICT NEVER
      DEPENDED ON THE DISPUTED CONSTANT. B22-T03 was rejected as
      fail_time_memory_and_preprocessing_rectangle against a 0.45 exponent
      gate. The best variant on the table is Hellman's permutation case at
      online exponent 1/2; the corrected Fiat-Naor figure is 2/3; the
      all-function figure is 3/4. Every one of these exceeds 0.45. Independent
      of online cost, preprocessing is N f-evaluations, each a scalar
      multiplication on the target curve -- exponent 1.0 -- and for a single
      declared ECDLP target there is no target population over which to
      amortise it. The rejection is therefore strengthened, not weakened, and
      would survive even if the attribution question resolved the other way.
    status_after_correction: rejected_pre_id (unchanged)
    applicability_verdict_after_correction: fail_time_memory_and_preprocessing_rectangle (unchanged)

  - handle: B22-T01
    defect_class: SCOPED_ACCURACY_DEFECT_UNDERCHARGED_SETUP
    title: Cheon auxiliary-scalar-power inversion
    field_corrected: cost_transform.theorem_setup
    prior_text: >-
      "factor N-1 enough to exhibit d; polynomial/logarithmic arithmetic once d
      is known"
    what_is_wrong: >-
      The setup term is charged as if it were free once d is in hand. Per
      TASK-20260802-018's recheck, Cheon's own setup discussion gives an
      N^(1/4+o(1)) deterministic scale for constructing the required generator
      GIVEN the factorization, and treats the factorization itself under a
      heuristic N^(1/4) discussion. Calling that "polynomial/logarithmic"
      understates the setup by an exponent, and the row's own
      complete_cost_model obligation requires setup to be charged.
    corrected_text: >-
      Theorem setup is NOT free. Following Cheon's setup discussion:
      exhibiting the divisor d requires factoring N-1 (Theorem 1) or N+1
      (Theorem 2), discussed heuristically at the N^(1/4) scale; and given the
      factorization, deterministic construction of the required generator is at
      the N^(1/4+o(1)) scale. Setup must therefore be charged at N^(1/4+o(1))
      rather than as polynomial or logarithmic arithmetic. At theta = 1/2 this
      places setup at the same N^(1/4) exponent as the granted-advice core,
      so setup ceases to be a lower-order term and becomes co-dominant.
    arithmetic_check:
      performed_by_this_session: true
      note: >-
        Theorem 1's core, O(sqrt((N-1)/d) + sqrt(d)) with d = N^(theta+o(1)),
        is N^(max((1-theta)/2, theta/2)+o(1)), minimised at theta = 1/2 giving
        N^(1/4+o(1)). A setup term at N^(1/4+o(1)) is exactly co-dominant with
        that minimum, so the "lower-order" treatment in the prior text is not
        merely imprecise but changes which term dominates. The row's end_to_end
        field already declined to state a standard exponent, so no downstream
        number in the artifact has to move.
    carried_unverified:
      - The N^(1/4+o(1)) deterministic generator scale attributed to Cheon's setup discussion.
      - The heuristic N^(1/4) factorization discussion attributed to the same paper.
      - Note that Theorem 1 and Theorem 2 as quoted in the BATCH-027 row were AFFIRMED by the reviewer and are not corrected here.
    rejection_robustness: >-
      THE CORRECTION DOES NOT CHANGE THE VERDICT. B22-T01 was rejected at
      fail_missing_nonlinear_auxiliary_input: no public operation on
      (E, F_p, P, Q) constructs Q_d = [k^d]P without k, a CDH oracle, a pairing
      return, or scalar-labelled advice. That is a constructibility failure, not
      a cost failure, so it is untouched by any setup accounting. The reviewer
      says so explicitly: "This does not rescue the missing [k^d]P
      constructor." The correction makes the cost column honest; it does not
      move the gate that actually rejected the row.
    status_after_correction: rejected_pre_id (unchanged)
    applicability_verdict_after_correction: fail_missing_nonlinear_auxiliary_input (unchanged)

  - handle: B22-T02
    defect_class: SCOPED_ACCURACY_DEFECT_MISLABELLED_THEOREM_AND_HYPOTHESIS
    title: Diem algebraic factor base over growing extension degree
    fields_corrected: [primary_source.exact_result, primary_source.hypotheses]
    prior_text: >-
      exact_result opened "Main theorem: for every sequence of prime powers q_i
      and positive integers n_i with n_i tending to infinity and n_i/log(q_i)
      tending to zero, ECDLP on elliptic curves over F_(q_i^n_i) is solvable in
      expected time (q_i^n_i)^o(1)." hypotheses listed "A suitable degree-two
      cover satisfying the paper's additional condition is constructed."
    what_is_wrong: >-
      Two distinct defects. (i) The sequence statement is a CONSEQUENCE of the
      main theorem along a particular regime, not the main theorem. Diem's main
      theorem is an expected running time of exp(O(max(log(q), n^2))) for
      E/F_(q^n); the (q_i^n_i)^o(1) form follows only under n_i -> infinity and
      n_i/log(q_i) -> 0. Labelling the corollary as the theorem overstates what
      is available off-regime. (ii) The degree-two cover is CONSTRUCTED inside
      the proof; listing it among the theorem's hypotheses recasts an internal
      construction as an external assumption the campaign could hope to supply,
      which is precisely the kind of borrowed-hypothesis move the scout is
      supposed to screen out.
    corrected_text: >-
      Main theorem (Diem 2011, Compositio Math. 147): the ECDLP for elliptic
      curves over F_(q^n) is solvable in expected time exp(O(max(log(q),
      n^2))). CONSEQUENCE, not theorem: for sequences of prime powers q_i and
      positive integers n_i with n_i -> infinity and n_i/log(q_i) -> 0, the
      expected time is (q_i^n_i)^o(1). The degree-two cover phi: E -> P^1 over
      F_(q^n), the algebraic factor base {R in E(F_(q^n)) : phi(R) in
      P^1(F_q)}, and the multivariate decomposition are CONSTRUCTED WITHIN THE
      PROOF and are not hypotheses. The hypotheses are on the input regime
      alone: the instance field is an extension F_(q^n) with n growing and
      n/log(q) -> 0.
    arithmetic_check:
      performed_by_this_session: true
      note: >-
        Consistency of the two statements is checkable directly. Along the
        stated regime, log of the running time is O(max(log q, n^2)), while
        log(q^n) = n*log(q). The ratio max(log q, n^2)/(n log q) tends to 0
        exactly when n/log(q) -> 0 and n -> infinity: in the branch where
        log q dominates, the ratio is 1/n -> 0; in the branch where n^2
        dominates, it is n/log(q) -> 0. So the corollary does follow from the
        theorem precisely under the stated regime, and NOT otherwise. This
        confirms the corollary is regime-bound and cannot be quoted bare.
      prime_field_specialisation: >-
        At n = 1 the exponent is exp(O(max(log q, 1))) = q^O(1), and the
        regime hypothesis n -> infinity fails outright. The prime-field
        rejection is untouched.
    carried_unverified:
      - That exp(O(max(log(q), n^2))) is the verbatim form of Diem's main theorem.
      - That the cover construction sits inside the proof rather than the hypotheses.
    rejection_robustness: >-
      THE CORRECTION DOES NOT CHANGE THE VERDICT, and the reviewer states the
      n=1 prime-field rejection is still correct. The campaign object is a
      generic ordinary curve over a PRIME field F_p, i.e. n = 1. The
      load-bearing proper-subfield hypothesis is empty there, and the growing-n
      regime hypothesis fails. Correcting the label in fact HARDENS the
      rejection: the corollary the row had quoted as a theorem is now visibly
      regime-bound, so it cannot be cited off-regime even rhetorically.
    status_after_correction: rejected_pre_id (unchanged)
    applicability_verdict_after_correction: known_extension_field_index_calculus_not_prime_field_successor (unchanged)

  - handle: B22-T04
    defect_class: SCOPED_ACCURACY_DEFECT_UNSTATED_INTERFACE_OBLIGATION
    title: Koutis multilinear detection over the exterior incidence lane
    field_corrected: applicability_obligations (addition), primary_source.exact_result (precision)
    prior_text: >-
      The row's theorem core was affirmed by the reviewer, but the row does not
      state that it supplies neither the arithmetic circuit nor the witness
      interface that Koutis's theorem consumes.
    what_is_wrong: >-
      Not a misstatement but an omission with the same effect: an unmet
      obligation left implicit reads as met. Koutis's result is conditional on
      being handed a circuit that evaluates the target polynomial, plus the
      means to read a witness back out. The ECDLP screen supplies neither, and
      the row's obligation list did not say so, leaving the impression that
      only cost stood in the way.
    corrected_text: >-
      Exact result (Koutis 2008): for a polynomial containing a degree-k
      square-free monomial with odd coefficient, the method detects that
      monomial with one-sided constant probability. If the polynomial is
      evaluated by a circuit over the integers modulo 2^(k+1) in time t and
      space s, Theorem 2.5 gives O((n*k + t) * 2^k) time and O(n*k + s) space.
      ADDED APPLICABILITY OBLIGATIONS, PREVIOUSLY UNSTATED AND UNMET -- (a)
      exhibit the explicit arithmetic circuit over Z/2^(k+1) that evaluates the
      exterior incidence polynomial for the ECDLP instance, and charge its t
      and s; (b) exhibit the witness interface that converts a positive
      detection into the actual source tuple, since detection is a decision and
      the campaign's promotion rectangle requires a returned relation source;
      (c) charge the 2^k factor against the campaign's exponent gate at the k
      the ECDLP instance actually needs.
    arithmetic_check:
      performed_by_this_session: true
      note: >-
        The 2^k factor is the binding term for this lane independently of
        anything else. The campaign's promotion rectangle caps the total
        exponent at 0.45 in N. Any k that grows like a constant fraction c of
        log2(N) makes 2^k = N^c, so the method can only sit under the gate for
        c < 0.45 -- and the exterior-incidence formulation needs k tied to the
        relation arity over a factor base whose size is itself a power of N.
        Detection cost alone therefore collides with the gate before the
        missing circuit and witness interfaces are even priced.
    carried_unverified:
      - That Theorem 2.5 has exactly the O((n*k + t) * 2^k) time and O(n*k + s) space form.
      - That the odd-coefficient square-free detection is one-sided with constant probability as stated.
    rejection_robustness: >-
      THE CORRECTION DOES NOT CHANGE THE VERDICT. B22-T04 was rejected at
      occupied_multilinear_detection_and_exterior_tensor_lane -- the missing
      operation is an exact source-complete separator-rank theorem, which no
      accounting change supplies. The added obligations make the gap explicit
      rather than implicit, which is the correction's whole purpose.
    status_after_correction: rejected_pre_id (unchanged)
    applicability_verdict_after_correction: occupied_multilinear_detection_and_exterior_tensor_lane (unchanged)

