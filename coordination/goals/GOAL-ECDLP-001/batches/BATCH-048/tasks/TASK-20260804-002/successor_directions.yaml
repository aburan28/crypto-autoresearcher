successor_directions:
  analysis_id: TASK-20260804-002
  batch_id: BATCH-048
  analysis_file: class_invariant_analysis.md

  context: >-
    The Tate isogeny theorem (Tate 1966) shows that ordinary elliptic curves
    over F_p are isogenous iff they have the same trace of Frobenius. All three
    special families named in H-IT-001 (anomalous trace=1, MOV low-embedding-degree,
    GHS/Weil-descent) are isogeny-class invariants: the defining arithmetic property
    depends only on #E(F_p) = p+1-t or the Frobenius eigenvalues, both of which
    are constant across the F_p-isogeny class. Therefore no ordinary F_p-isogeny
    path of any finite length can connect a generic (non-special) curve to any of
    these special endpoints. rho_special=0 is not a finite-scale artifact; it is
    a mathematical certainty. The ordinary isogeny transfer mechanism in H-IT-001
    is structurally infeasible for the three named families.

  h_it_001_ordinary_assessment:
    verdict: mechanistic_gap
    scope: ordinary ell-isogenies over F_p, any degree, any ell coprime to p
    claim: >-
      Ordinary F_p-isogenies preserve #E(F_p) (equivalently: the trace of
      Frobenius). The anomalous, MOV, and Weil-descent special families are
      all isogeny-class invariants. No ordinary isogeny path of any finite
      length from a generic non-special curve can reach any of these special
      endpoints at any scale. H-IT-001's ordinary isogeny transfer mechanism
      is structurally infeasible for all three named families.
    theorem_basis: >-
      Tate (1966), Inventiones Mathematicae 2(2), 134-144.
      Silverman AEC Ch. V Thm. 3.1.
      Waterhouse (1969), classification of F_q-isogeny classes.
    correction_to_O6: >-
      EV-IT-aefd12 O-6 states the path "requires at least p/(ell^2) steps".
      This understates the obstruction. The Tate theorem gives a stronger result:
      no finite path exists (the isogeny classes are disconnected over F_p).
      O-6 is correct that rho_special=0 is not a finite-scale artifact; the
      correct reason is disconnection, not exponential path length.
    remaining_open: >-
      (a) Whether there exist special curve families whose "special" property
      is NOT an isogeny-class invariant over F_p. (b) Whether isogenies defined
      over extension fields F_{p^k} (k>1) can bridge trace classes at acceptable
      cost. (c) Whether a reformulated H-IT-001 targeting a within-class weakness
      could yield a sub-rho finding.
    h_it_001_status: >-
      H-IT-001 stays at 'specified' per task constraint (no status change in
      this analysis task). The mechanistic gap requires a Coordinator decision
      on scope: reject_scoped at ordinary-isogeny level, or reformulate.

  directions:

    - id: DIR-1
      name: Supersingular isogeny bridge
      priority: low
      description: >-
        Attempt to bridge between ordinary trace-classes via a supersingular
        intermediate: E_ordinary -> E_ss -> E'_ordinary. However, for p > 3,
        a supersingular curve over F_p has trace t=0. The first step
        E_ordinary (trace t≠0) -> E_ss (trace 0) requires an F_p-isogeny
        between curves of different trace, which is exactly what the Tate
        theorem forbids. There is therefore no F_p-isogeny bridge through a
        supersingular intermediate. Over extension fields F_{p^k}, ordinary
        and supersingular curves can become isogenous (their extended-field
        point counts can coincide), but the cost of finding such an extension-
        field isogeny is not known to improve on Pollard rho.
      mechanism_status: infeasible_over_Fp
      dominated_by: >-
        Pollard rho. The F_p bridge does not exist by Tate's theorem.
        An F_{p^k} bridge (if constructible) would cost at least Omega(p^{1/2})
        for any known algorithm for finding it, matching rho before any
        special-curve saving is applied.
      sota_delta:
        time_exponent: non-improving
        memory_exponent: non-improving
        note: >-
          Bridge cost alone reaches rho floor; no net improvement over Pollard
          rho is achievable without a new algorithm for bridge-finding.
      falsifiable: >-
        Find an explicit F_{p^k}-isogeny from a non-anomalous ordinary curve
        to an anomalous ordinary curve for some small k; measure the cost of
        finding it; compare to matched rho. A positive result (bridge found
        at sub-rho cost) would be surprising and require independent mathematical
        analysis before any claim.
      key_references:
        - "Tate (1966) — Tate isogeny theorem (disconnection result)"
        - "Pizer (1990) — supersingular isogeny graphs as Ramanujan graphs"
        - "Charles-Goren-Lauter (2009) — SIDH/supersingular graph structure"

    - id: DIR-2
      name: Special families with non-invariant distinguisher
      priority: medium
      description: >-
        Search for a special-curve family F_special whose "special" property
        is NOT an isogeny-class invariant over F_p — i.e., the property is
        defined by something that varies within an isogeny class, such as the
        CM conductor f, the j-invariant value, or the specific Weierstrass
        model. Within the same isogeny class (fixed trace t), curves at
        different depths of the volcanic structure (different conductor f) are
        genuinely distinct; an attacker traversing the volcano can move between
        them via ordinary isogenies. If there is a cryptographically exploitable
        weakness correlated with conductor depth or j-invariant within a fixed
        isogeny class, H-IT-001 could be reformulated to target that weakness
        instead of the three named families.

        Candidate sub-directions:
        (a) CM curves with small j-invariant (j=0, j=1728): these have specific
        CM fields and are in specific isogeny classes; a random generic curve is
        in a different class, so these are still isogeny-class invariants.
        (b) Curves with smooth-order CM conductor: the conductor f can be varied
        by isogenies; if a curve with conductor f=ell has a faster DLP solver,
        that would be within-class reachable from a surface curve. No such solver
        is currently known.
        (c) Anomalous curves over F_{p^k} (k>1): a curve E/F_p is anomalous
        over F_{p^k} if #E(F_{p^k}) = p^k. This depends on alpha^k + alpha-bar^k,
        which is determined by t and p. So F_{p^k}-anomalous status IS an
        isogeny-class invariant over F_p. No improvement over anomalous case.
      dominated_by: >-
        Unknown; no special family with a non-invariant exploitable weakness
        has been identified. The direction requires a new structural mechanism
        proposal before a cost comparison is possible.
      sota_delta:
        time_exponent: unknown
        memory_exponent: unknown
        note: >-
          Requires identifying a new weakness. If no new weakness exists, the
          direction collapses to Pollard rho as baseline.
      falsifiable: >-
        Exhibit a special family F_special with: (a) exploitable ECDLP weakness
        with verified cost C_special < sqrt(N); (b) the "special" property is
        not an isogeny-class invariant; (c) an explicit ordinary isogeny from
        a random generic curve to a member of F_special at cost C_path <
        sqrt(N) - C_special.
      key_references:
        - "Waterhouse (1969) — classification of isogeny classes"
        - "Kohel (1996) — CM conductor and volcano structure"
        - "Delfs-Galbraith (2016) — ordinary isogeny volcanoes"

    - id: DIR-3
      name: Reformulate H-IT-001 within an isogeny class
      priority: medium
      description: >-
        Reformulate H-IT-001 to ask a question that is well-posed within a
        single isogeny class (fixed trace t). The current H-IT-001 formulation
        asks whether a generic curve (trace t) can be transferred to a special
        endpoint in a different trace class (trace 1, or MOV trace class, etc.).
        The Tate theorem closes this for ordinary isogenies. A within-class
        reformulation would ask: given a random curve E in isogeny class C_t
        (trace t), can a DLP on E be transferred to a structurally weaker curve
        E' also in C_t at sub-rho total cost?

        For this to be non-trivial, there must be within-class DLP difficulty
        variation. Two possibilities:
        (a) Curves at the bottom of the volcano (deep conductor) vs the surface:
        is DLP on a deep-conductor curve easier? No known result supports this.
        (b) Curves with endomorphism rings having additional structure: GLV-style
        speedups exploit CM; within a fixed isogeny class, all curves have the
        same CM discriminant, so GLV performance is uniform across the class.
        (c) GHS-descent within an isogeny class: lifting E/F_p to F_{p^n} and
        checking whether the extended curve has a GHS-manageable Jacobian depends
        only on t (as shown in Section 4), so all within-class curves have the
        same GHS status. No within-class variation.

        Preliminary assessment: within a fixed isogeny class over F_p, DLP
        difficulty appears uniform (all curves have the same group order N,
        same embedding degree, same GHS profile). If this uniformity can be
        proved, then H-IT-001's isogeny transfer approach cannot improve on Pollard
        rho for any ordinary F_p-isogeny path (regardless of endpoint). This
        would constitute a scoped negative result for the entire approach.
      dominated_by: >-
        Pollard rho unless a within-class DLP difficulty variation is identified.
        Current evidence supports uniform difficulty within a class.
      sota_delta:
        time_exponent: not_applicable_pending_mechanism
        memory_exponent: not_applicable_pending_mechanism
        note: >-
          This is a reframing direction; a positive or negative result would
          sharpen the scope of H-IT-001 rather than immediately improving sota.
      falsifiable: >-
        (For a negative result): prove that for all E, E' in the same F_p-
        isogeny class, any DLP algorithm on E' with cost C_special can be
        converted to a DLP on E at cost C_path + C_special >= C_special (i.e.,
        the isogeny transfer adds no advantage). This would extend the
        mechanistic gap from "no special endpoint exists" to "no within-class
        advantage exists."
        (For a positive result): exhibit a within-class pair (E, E') with
        C_special(E') < C_special(E) at sub-rho ratio after accounting for
        C_path.
      key_references:
        - "Silverman AEC Ch. III — endomorphism ring within isogeny class"
        - "Gallant-Lambert-Vanstone (2001) — GLV method for CM curves"
        - "Gaudry-Hess-Smart (2002) — GHS Weil descent"

    - id: DIR-4
      name: Scope H-IT-001 rejection to ordinary isogenies; document known results
      priority: not_applicable
      description: >-
        The security of generic prime-field ECDLP against ordinary isogeny
        transfer to anomalous, MOV, and GHS targets follows directly from the
        Tate isogeny theorem — a classical result, not a new finding.
        Balasubramanian-Koblitz (1998) and Luca-Shparlinski (2005) establish
        that generic prime-field curves have large embedding degree; Koblitz's
        original 1987 work establishes anomalous curves as a special family.
        This direction is therefore a documentation and scoping exercise:
        record the proof that H-IT-001's ordinary isogeny route is already
        excluded by classical results, and formally scope the rejection to
        ordinary F_p-isogenies for the three named families.
      dominated_by: >-
        Known result (Tate 1966 + Balasubramanian-Koblitz 1998); not a new
        attack direction and not an improvement over known security analyses.
      sota_delta:
        time_exponent: zero
        memory_exponent: zero
        note: This is an existing ECDLP security analysis, not a new algorithm.
      falsifiable: not_applicable
      priority_override: >-
        Valuable for correctly scoping H-IT-001 in the ledger (a Coordinator
        action) but contributes no new algorithmic idea.

  overall_recommendation: >-
    The Tate isogeny theorem closes H-IT-001's ordinary isogeny transfer route
    for all three named special families. The mechanistic gap is mathematical
    (not experimental), classical, and unconditional. Three directions remain
    for the Coordinator to consider:

    (a) DIR-2 (non-invariant special family): search for a new special family
    where the "special" property is not an isogeny-class invariant. This is the
    only positive direction for ordinary isogenies but requires identifying a
    new mechanism.

    (b) DIR-3 (within-class reformulation): assess whether DLP difficulty varies
    within a single isogeny class. Strong preliminary evidence (all isogeny-class
    invariants listed above) suggests it does not, but a formal proof would
    sharpen the scope.

    (c) Coordinator scoped decision: formally mark H-IT-001 as having a
    mechanistic gap at ordinary-isogeny scope for the three named families,
    record this as a scoped finding without full closure, and either redirect to
    DIR-2/DIR-3 or close the ordinary-isogeny formulation as reject_scoped with
    a named successor.

    None of the directions identified here beats Pollard rho on generic prime-
    field ECDLP at the current stage of analysis.

  pareto_integrity:
    dominated_by: >-
      Pollard rho at exponent 1/2 for generic prime-field ECDLP.
      No successor direction identified in this analysis beats rho.
      This is a negative structural analysis revealing a mechanistic gap in
      H-IT-001's ordinary isogeny route; it is not a positive algorithm.
    dominated_by_checked: true
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
      note: >-
        No algorithmic improvement is proposed. All identified directions are
        either dominated (DIR-1, DIR-4) or require a new mechanism before a
        cost comparison is possible (DIR-2, DIR-3). The analysis is purely
        structural and negative; no new asymptotic claim is made or warranted.
    unchecked_null_fields: none
