  # =====================================================================
  # 3. METRIC RECOMPUTATIONS - ALL FROM AN INDEPENDENT REBUILD
  # =====================================================================
  recomputation_method:
    what_was_rebuilt_from_nothing: >-
      A pure-Python reconstruction (no numpy for the object arithmetic, no line
      shared with lpf001_driver.py) that (a) called
      harness.toycurve.generate_instance(2301, bits) for the curve, (b) rebuilt
      the 512-element deterministic factor base by an Euler-criterion
      quadratic-residue test, (c) enumerated all C(512,2) = 130816 strictly
      i < j half-tuples, (d) applied INT-1 with a modular inverse computed by
      extended Euclid (`pow(c2, -1, p)`) rather than the driver's Fermat
      exponentiation, (e) applied ENC-B, (f) factored every value with
      sympy.factorint, and (g) solved the Dickman equation by a DIFFERENT
      numerical scheme from the driver's.
    dickman_scheme_used_by_this_validator: >-
      The differentiated form u*rho'(u) = -rho(u-1), marched interval by interval
      with the composite trapezoid rule at h = 1e-5 and rho == 1 on [0,1]. The
      driver instead solves the INTEGRAL equation u*rho(u) = int_{u-1}^{u} rho
      by composite Simpson at h = 2.5e-4, implicit in the right endpoint. The two
      schemes are independent.
    dickman_agreement:
      u_1: {mine: 1.0, driver: 1.0, relative_difference: 0.0}
      u_2: {mine: 0.306852819434, driver: 0.30685282258145957, relative_difference: 1.03e-08}
      u_3: {mine: 0.0486083882819, driver: 0.048608388763315906, relative_difference: 9.90e-09}
      u_4: {mine: 0.00491092563954, driver: 0.0049109257010501225, relative_difference: 1.25e-08}
      u_5: {mine: 0.000354724694019, driver: 0.0003547247043376174, relative_difference: 2.91e-08}
      u_6: {mine: 1.96496912335e-05, driver: 1.9649696569618583e-05, relative_difference: 2.72e-07}
      verdict: >-
        The driver's Dickman solution is correct to ~3e-7 relative at the worst
        tabulated point, far inside the 1 percent L-5 tolerance. The driver's own
        reported worst discrepancy against FROZEN_RHO_TABLE, 1.5441749690432644e-05,
        is a discrepancy of the 5-significant-figure TABLE, not of the solution.

