  # =====================================================================
  # 13. LIMITATIONS
  # =====================================================================
  limitations:
    - >-
      TOY TIER, AND THE GAP IS NOT SMALL. D = 2**32 and 2**40, p = 46663 and
      767551, against cryptographic parameters many orders of magnitude larger.
      This is the AGENTS rule 7 limitation and it is recorded as a limitation,
      never as scale-matched validation of HEUR-DS-1.
    - >-
      PROCEDURAL INDEPENDENCE ONLY. Author and reviewer resolve to the same model
      (claude-opus-5) under this harness. `model_verified` is false on both
      sides - neither the Executor's nor this validator's model identifier has
      been probe-confirmed. The compensating measure is that this report's
      findings are recomputations, not judgements about the Executor's reasoning.
    - >-
      THE OBJECT IS NOT THE FULL SEMAEV RELATION. It is the half-arity m = 4,
      d_half = 2 partial-map intermediate under INT-1 and ENC-B over a frozen
      512-element factor base. No relation is harvested, no discrete logarithm is
      computed, no search is run, and no statement about relation YIELD follows.
    - >-
      SINGLE CURVE INSTANCE PER CELL. One curve at each of two bit sizes, from
      one master seed. Any per-instance effect is completely confounded with the
      cell. Replication at a different curve instance per cell is the named next
      action in L-4's disposition and is not supplied by this run.
    - >-
      THE APPARATUS HAS A MEASURED DETECTION FLOOR. Seven of 28 plant groups are
      inert, all OBJ-PLANT-ROUGH at small gamma. Any consistency statement is
      bounded by that floor and says nothing below it.
    - >-
      LIMB B IS A BIASED AND ASYMMETRIC TEST AT THESE CELLS. LIMBB-DECL-RR066
      travels with every LIMB B number: R(u) on a correct uniform arm is biased
      UPWARD because u is defined at D while samples live on [1, p**2], the
      bits-16 u=6 non-decidability is largely definitional (about 11.59 -> about
      6.68 under the corrected u), and the upward headroom at bits-16 u=5 is
      1.75x, not 8x. LIMB B MUST NOT BE DESCRIBED AS AN ORDER-OF-MAGNITUDE OR
