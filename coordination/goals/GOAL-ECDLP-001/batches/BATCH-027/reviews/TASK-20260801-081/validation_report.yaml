        established MECHANICALLY, not by assertion: the specification is bound at
        ba1567ee, the driver (carrying the rho solver, the Bsm ladders, the u
        formula, POW-LPF-1's powered threshold and the [1/8, 8] band) at
        104d32fa, and RR-LPF-2 (carrying every band edge and null sd) at
        9515f6a1 - and each of those files has EXACTLY ONE COMMIT in its history.
        All three precede the run commit f68015aa. No prediction could have been
        fitted after seeing the measurement data.
      also_pre_registered:
        point_prediction_for_the_verification_fraction: 1.0
        frozen_absolute_band_for_LIMB_B: [0.125, 8.0]
        provenance_of_the_band: constant_factor_c = 8, inherited from EXP-DS-001, not derived from any calibration number
        bands_adjusted_after_runs_began: false
    - id: HV-2
      check: SAMPLE INTEGRITY - size, seeds, procedure in the manifest; empirical quantities recomputed from raw
      result: PASS
      finding: >-
        Sample size (130816 per arm per cell, exhaustive over C(512,2)),
        enumeration rule (strictly i < j, diagonal excluded by construction),
        both Bsm ladders, the u ladder, the Dickman grid parameters, the uniform
        arm's stream name, offset, per-cell seed, seed formula, draw index and
        generator are ALL in manifest.inputs. The real arm is EXHAUSTIVE and
        carries no sampling seed, which the manifest states explicitly and which
        this validator confirmed by regenerating it deterministically. Every
        empirical quantity in this report was recomputed from the rebuilt raw
        samples; none was copied.
      tail_consistency_recomputed: >-
        The deep-tail rungs were recomputed like the rest: bits 16 u = 6.0129
        gives 32 smooth of 130816 against an expectation of 2.47 under rho, and
        bits 20 u = 5.9948 gives 16 against 2.61. Both are UNPOWERED by
        POW-LPF-1's n*rho >= 30 rule, fixed before any datum, and both carry the
        STRUCK statistic. They read no branch. Recorded, not interpreted.
    - id: HV-3
      check: CORRESPONDENCE VALIDITY (substitute sampling)
      result: NOT APPLICABLE, with one declared substitution of a different kind
      finding: >-
        No Deuring-style correspondence is used. The object is enumerated
        directly, so no theorem is needed to license a substitute sampler.
        However there IS a declared reference substitution that a reader could
        mistake for one: the asymptotic rho(u) is evaluated at u = ln(D)/ln(Bsm)
        with D = 2**(bits * d_half), while the samples live on [1, p**2], and
        X/D is about 0.507 at bits 16 and 0.536 at bits 20. LIMBB-DECL-RR066
        states this and states its direction - u is systematically OVERSTATED and
        rho(u) systematically UNDER-predicts p_hat, so R(u) on a correct uniform
        arm is A BIASED ESTIMATOR, biased upward. This validator confirms the
        bias is real and its direction correct: the uniform arm's own R(u)
        exceeds 1 at every single rung at both cells (1.13 to 11.59), which is
        exactly what an upward-biased reference produces. THE DECLARATION MUST
        TRAVEL WITH EVERY LIMB B NUMBER.
    - id: HV-4
      check: SCALE BINDING (AGENTS rule 7)
      result: PASS
      finding: >-
        D = 2**32 and 2**40; p = 46663 and 767551. This is TOY TIER by orders of
        magnitude and is recorded as such in claim_tier, in scope_caveats, in the
        interpretation note, in the snapshot receipt and in the commit message.
        NOTHING HERE IS SCALE-MATCHED EVIDENCE FOR HEUR-DS-1, and RR-LPF-2's own
        L-2 disposition states that "HEUR-DS-1 IS NOT VALIDATED AT ANY TIER" even
        on the most favourable branch. The scale limitation is recorded, not
        merely implied.
    - id: HV-5
      check: COST-UNIT HONESTY
      result: NOT APPLICABLE
      finding: >-
        This run publishes NO concrete cost table, no field-operation count, no
        asymptotic claim and no time-memory tradeoff. The only cost quantity is
