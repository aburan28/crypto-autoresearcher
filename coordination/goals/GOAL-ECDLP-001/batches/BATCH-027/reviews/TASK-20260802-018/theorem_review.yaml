        supported_memory_exponent_delta: 0.0
        conditional_granted_advice_time_delta_at_d_sqrt_N: -0.25
      named_obstruction: nonlinear target-specific auxiliary point is absent from the standard input
      cheapest_falsification: >-
        Audit a claimed constructor for k, DLP/CDH, pairing-return, or
        target-specific advice, then verify exact [k^d]P equality before the
        Cheon core. A random replacement for [k^d]P must not yield an accepted k.
      forward_guidance: >-
        Reopen only with a public ordinary-curve constructor for certified
        nonlinear scalar advice and a complete construction-plus-recovery cost
        inside the campaign rectangle.

    - handle: B22-T02
      title: Diem algebraic factor base over growing extension degree
