    - handle: B22-T01
      title: Cheon auxiliary-scalar-power inversion
      ingredient_verdict: REJECT_PRE_ID_AFTER_REVISION
      survivor: false
      theorem_accuracy: REVISE_SETUP_ACCOUNTING
      standard_prime_field_applicability: FAIL_MISSING_NONLINEAR_AUXILIARY_INPUT
      exact_finding: >-
        Theorem 1 really does recover k from P,[k]P,[k^d]P for d dividing
        N-1 in O(sqrt((N-1)/d)+sqrt(d)) group exponentiations with the stated
        table storage. Theorem 2 really requires powers through 2d, d dividing
        N+1, and ERH for its deterministic setup. Ordinary group operations on
        P and [k]P retain affine labels and do not construct [k^d]P.
      cost_defect: >-
        Replace the claimed polylogarithmic theorem setup with the scalar-field
        generator/factorization setup actually discussed by Cheon, and state
        favorable-divisor applicability explicitly. At d=N^(1/2+o(1)), this
        setup is on the N^(1/4+o(1)) scale discussed in the paper and does not
        alter the absent standard-input construction term.
      full_path_result: >-
        construct(P,[k]P -> [k^d]P) + Cheon core + [k]P verification cannot be
        assembled in the target model. Rank, factor logs, and descent are
        legitimately inapplicable because a valid Cheon instance returns k.
      semantic_novelty: duplicate_ECDLP_IDEA_003_008_auxiliary_power_lane
      shoup_scope: outside_strict_GGM_only_after_secret_dependent_advice_is_granted
      structured_generic_scope: no_public_oracle_or_delta_defined
