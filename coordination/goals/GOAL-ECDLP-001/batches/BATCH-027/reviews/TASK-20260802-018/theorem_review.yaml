  primary_source_recheck:
    verdict: REVISE
    sources:
      - key: CHEON-2010
        url: https://www.math.snu.ac.kr/~jhcheon/publications/2010/StrongDH_JoC_Final2.pdf
        checked_results: [Theorem_1, Theorem_2, deterministic_generator_setup]
        finding: >-
          Theorem 1 and Theorem 2 support the auxiliary-input complexities and
          input requirements used for rejection. The producer undercharges
          deterministic scalar-field generator and factorization setup by
          calling it polynomial or logarithmic once d is known; Cheon's setup
          discussion gives an N^(1/4+o(1)) deterministic generator scale given
          factorization and a heuristic N^(1/4) factorization discussion. This
          does not rescue the missing [k^d]P constructor.
      - key: DIEM-2011
        url: https://www.math.uni-leipzig.de/~diem/preprints/dlp-ell-curves.pdf
        checked_results: [main_theorem, sequence_consequence, factor_base, decomposition]
        finding: >-
          The actual main theorem is expected time
          exp(O(max(log(q),n^2))) for E/F_(q^n). The producer accurately states
          the derived (q_i^n_i)^o(1) sequence consequence when n_i tends to
          infinity and n_i/log(q_i) tends to zero, but incorrectly labels that
          consequence the main theorem and treats the constructed cover too
          much like an external hypothesis. The n=1 prime-field rejection is
          still correct.
      - key: FIAT-NAOR-1999
        url: https://doi.org/10.1137/S0097539795280512
        checked_results: [collision_probability_tradeoff, all_function_all_point_tradeoff]
        finding: >-
          The source states T*S^2=N^3*q(f) and T*S^3=N^3 for the general
          all-function/all-point guarantee. For a permutation q(f)=1/N, the
          first relation is T*S^2=N^2, not S*T=N. Its balanced point is
          T=S=N^(2/3), not N^(1/2).
      - key: HELLMAN-1980
        url: https://ee.stanford.edu/~hellman/publications/36.pdf
        checked_results: [random_function_tradeoff, preprocessing, reduction_function]
        finding: >-
          Hellman's generic cryptanalytic construction uses a reduction to an
          iterable endofunction, N preprocessing operations, and balanced
          online time and memory N^(2/3); equivalently T*M^2 is on the N^2
          scale at constant coverage. The N^(1/2) time-memory product discussed
          in the introduction is the stronger structure-specific search/DLP
          frontier, not the Hellman function-inversion construction claimed by
          B22-T03.
      - key: KOUTIS-2008
        url: https://www.cs.cmu.edu/~jkoutis/papers/MultilinearDetection.pdf
        checked_results: [Theorem_2_4, Theorem_2_5]
        finding: >-
          The paper detects a degree-k square-free term with odd coefficient
          with one-sided constant probability. If the circuit evaluates over
          integers modulo 2^(k+1) in time t and space s, Theorem 2.5 gives
          O((n*k+t)*2^k) time and O(n*k+s) space. The producer's theorem core
          is accurate, but it does not supply the circuit or witness interface.
      - key: SHOUP-1997
        url: https://www.shoup.net/papers/dlbounds1.pdf
        finding: >-
          Supports the Omega(sqrt(N)) generic-group control for prime-order
          DLP; it is not a universal lower bound against encoding-specific
          operations.
      - key: CGHW-2026
        url: https://eprint.iacr.org/2026/384
        finding: >-
          The official abstract states the model-scoped
          Omega(min(sqrt(N),1/delta)) bound. None of the four screens defines
          the paper's exact structured oracle and delta, so it remains a
          boundary control rather than a turnkey rejection.

