        F_(q^n). The (q_i^n_i)^o(1) statement is a derived sequence result under
        n_i -> infinity and n_i/log(q_i) -> 0. The algebraic factor base and
        decomposition source output use the proper subfield and are genuine in
        that native extension-field regime.
      cost_defect: >-
        State the main theorem and its sequence consequence separately. Do not
        imply that relation collection, linear algebra, memory, and individual
        logarithm costs have been converted to original-N prime-field bounds;
        no such n=1 conversion is supplied.
      full_path_result: >-
        At n=1 the factor-base condition collapses and the asymptotic sequence
        hypothesis fails. Artificial extension to E(F_(p^n)) changes the
        ambient problem and supplies no proved original-subgroup setup, rank,
        factor-log, or blind-descent exponent below rho.
      semantic_novelty: known_extension_field_index_calculus_and_cover_family
      shoup_scope: non_generic_where_proper_subfield_structure_exists_but_no_prime_field_escape
      structured_generic_scope: no_prime_field_oracle_or_delta_defined
      controls: PASS
      dominated_by: Pollard_rho_for_the_target_prime_field_instance
      sota_delta:
        supported_time_exponent_delta: 0.0
        supported_memory_exponent_delta: 0.0
        native_sequence_result: (q_i^n_i)^o(1)
      named_obstruction: the load-bearing proper-subfield geometry vanishes at n=1
      cheapest_falsification: >-
        Substitute n=1 in the exact factor-base and decomposition definitions.
        For any artificial extension, measure all setup, source, rank, logs,
        and descent in the original subgroup's N units and compare with rho.
      forward_guidance: >-
        Seek a directly prime-field algebraic subset with a proved
