    - handle: B22-T03
      title: Fiat-Naor and Hellman source-free function inversion
      ingredient_verdict: REJECT_PRE_ID_AFTER_MATERIAL_CORRECTION
      survivor: false
      theorem_accuracy: FAIL_TRADEOFF_TRANSFORM
      standard_prime_field_applicability: FAIL_PREPROCESSING_TIME_MEMORY_AND_INTERFACE
      exact_finding: >-
        Fiat-Naor gives T*S^2=N^3*q(f); a permutation has q(f)=1/N and
        therefore T*S^2=N^2. Hellman's random-function construction likewise
        has balanced online time and memory N^(2/3) after N preprocessing.
        The producer's S*T=N and balanced N^(1/2) claim is not the cited
        function-inversion theorem. N^(1/2)-by-N^(1/2) is instead the
        structure-specific BSGS DLP baseline.
      interface_defect: >-
        f(a)=canonical_encode([a]P) is not by itself an iterable endofunction
        on [N]. Hellman requires an explicit public reduction back to the
        domain, with target reduction, collision coverage, false alarms, replay,
        and final point verification all charged. A canonical injective point
        encoding does not automatically provide that endofunction.
      corrected_cost_transform: >-
        With S=N^sigma, the Fiat-Naor permutation relation gives
        T=N^(2-2*sigma) before full preprocessing accounting. The balanced
        point is sigma=2/3. General all-function/all-point inversion has
        T*S^3=N^3 and balanced exponent 3/4. Full Hellman-style preprocessing
        is N evaluations. Every version misses lambda,mu<=0.45; BSGS separately
        attains N^(1/2) time and memory, and rho attains N^(1/2) time with
        negligible memory.
      full_path_result: >-
        Advice construction, reduction/evaluation, coverage amplification,
        chain merges, replay, scalar output, and [k]P verification are charged.
        The correction strengthens rather than weakens rejection.
      semantic_novelty: >-
        occupied_function_inversion_family_but_not_exact_duplicate_of_IDEA_374
      shoup_scope: no_encoding_specific_information_beyond_the_matched_inversion_control
      structured_generic_scope: no_special_predicate_or_delta_defined
      controls: PASS_AFTER_USING_THE_CORRECT_TRADEOFF
      dominated_by: >-
        Pollard rho end to end for one target when preprocessing is charged;
        BSGS is the matched N^(1/2),N^(1/2) DLP time-memory control.
      sota_delta:
        supported_time_exponent_delta: 0.0
        supported_memory_exponent_delta: 0.0
        fiat_naor_permutation_balanced_time_exponent: 0.6666666667
        fiat_naor_permutation_balanced_memory_exponent: 0.6666666667
        hellman_preprocessing_exponent: 1.0
      named_obstruction: correct black-box inversion costs and an unspecified iterable reduction restore or exceed the square-root frontier
      cheapest_falsification: >-
        Instantiate the same reduction and table scheme on a matched random
        function, freeze the number of targets, and record preprocessing,
        memory, online evaluations, coverage, false alarms, replay, and final
        verification. Reject any analysis substituting S*T=N for the cited
        Fiat-Naor/Hellman theorem.
      forward_guidance: >-
        Reopen only for a concrete elliptic-encoding inversion theorem that
        specifies its endofunction/reduction and beats matched rho/BSGS/random
        controls after full advice construction.

    - handle: B22-T04
      title: Koutis odd-multilinear exterior/group-algebra detection
      ingredient_verdict: REJECT_PRE_ID_AFTER_REVISION
      survivor: false
      theorem_accuracy: PASS_CORE_REVISE_COMPOSITION_SCOPE
      standard_prime_field_applicability: FAIL_MISSING_EXACT_SOURCE_CIRCUIT_AND_WITNESS_PATH
      exact_finding: >-
        Koutis correctly supplies odd-coefficient square-free detection with
        one-sided constant probability and O((n*k+t)*2^k) time,
        O(n*k+s) space once the circuit is supplied. It does not construct an
        elliptic relation circuit, prove all-strata biconditional support,
        isolate parity, or return a witness.
      composition_defects:
        - >-
          Distinguish the full six-list relation circuit (degree k=6 with six
          B-sized colored variable decks) from a fixed-target circuit for
          A1+...+A5-R=O (degree k=5 if R is a constant). The constant-degree
          difference does not affect the rejection but must be typed exactly.
        - >-
          State B^3 as the cost of the known explicit 3+3 construction, not a
          lower bound on every possible compact circuit. No unrestricted
          circuit-size lower bound was proved.
        - >-
          Quantify the number of restricted detector calls, per-call error,
          parity isolation, and amplification if witness self-reduction is
          proposed; Theorems 2.4 and 2.5 do not supply this composition.
      full_path_result: >-
        The missing circuit constructor precedes detection. Exact source
        output, B independent rows, duplicate-normalized rank, factor logs,
        masked-target descent, verification, circuit storage, relation data,
        and communication remain charged. Known explicit construction already
        costs B^3=N^0.6 before those axes.
      semantic_novelty: duplicate_ECDLP_IDEA_280_and_B21_P05_exterior_tensor_lane
      shoup_scope: encoding_specific_only_if_the_missing_compact_circuit_is_constructed
      structured_generic_scope: no_circuit_oracle_or_delta_defined
      controls: PASS
      dominated_by: >-
        Pollard rho end to end; known explicit 3+3 and 2+2+2 enumerators are
        the matched relation-subproblem controls, not universal lower bounds.
      sota_delta:
        supported_time_exponent_delta: 0.0
        supported_memory_exponent_delta: 0.0
        conditional_fixed_k_detector_overhead: constant_factor_over_supplied_circuit_evaluation
      named_obstruction: detection consumes the missing exact source circuit and supplies no complete witness-to-descent path
      cheapest_falsification: >-
