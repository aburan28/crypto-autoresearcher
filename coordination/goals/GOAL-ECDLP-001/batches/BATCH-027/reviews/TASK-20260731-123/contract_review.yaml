prior_blocker_discharge:
  B-1:
    title: HEUR-ISO-1 F_hit / regularity / min_ell pre-registration
    status: RETAINED_DISCHARGED
    detail: >-
      v3 retains graph_regularity_d=3; H_min hop RV with hops_max=floor(log2(N)/2);
      deterministic tree-ball F_hit(h; rho, d=3); HEUR_ISO_1_report schema with
      F_hit_table_by_bits required before path search. Unchanged in spirit from
      v2 B-1 discharge (RT-109 / RT-105).

  B-5:
    title: Density-universe N / cofactor designation not unique
    status: DISCHARGED
    detail: >-
      instance_N_map N_MAP-IT-001-v3 freezes h_max=256 and unique_N_rule:
      Cand = primes N with bitlength(N)==bits and #E=h*N for 1<=h<=h_max;
      empty Cand excludes the class; |Cand|>1 ⇒ N*=min(Cand); h*=#E/N*.
      Detectors embedding_degree_leq_threshold and subfield_weil_descent_friendly
      MUST use N*. p_bits is the smallest prime in (2^{bits+1}, 2^{bits+2})
      with at least one retained ordinary class under increasing-j scan;
      seed_density does not override that rule. density_universe_spec_hash
      schema includes map id, h_max, unique_N_rule_id, p_bits_selection_id.
      rho_special(bits) is uniquely recomputable from the freeze artifact.

  B-6:
    title: R_xfer path / endpoint aggregation rule not frozen
    status: DISCHARGED
    detail: >-
      R_xfer_aggregation freezes attack-favorable min: R_xfer := minimum charged
      ratio among all certificate-bearing paths within ell_max/hops_max
      (including mixed-prime MITM certificates if that arm is used); censorship
      lower bound if none. Tie-break: smaller hop count, then smaller endpoint j,
      then lexicographically smaller path-edge certificate id. bfs_neighbor_order
      freezes increasing j for HEUR and cost-gate BFS; MITM must still apply min
      aggregation. Executor MUST NOT report a non-minimal certificate to avoid
      F1 or force RATE. Matches RT-109 required_fix (min aggregation + BFS order).

  B-7:
    title: NULL-IT-ISOGENY-TRANSFER graph construction not a closed algorithm
    status: DISCHARGED
    detail: >-
      NULL-IT-ISOGENY-TRANSFER-v2 / NULL-IT-NEIGHBOR-v1 freezes vertex set
      V={0..M-1} from hops_max tree ball_bound; three distinct null_seed-derived
      XOR offsets with failure if not found in 10000 draws (failed_infrastructure);
      neighbors(v)=sorted XOR triple — uniquely determined before any null walk;
      no post-freeze pairing invention. neighbor_algorithm_id is included in
      null_object_spec_hash. Builder receipt may echo offs/M but must not choose them.

  B-8:
    title: CTRL-NULL-IT-PLANT detection predicate not frozen
    status: DISCHARGED
    detail: >-
      Plant injection on designated cell (seeds[0]/bits=20 first unplanted):
      persist raw edge ledger; set C_path_reported=floor(C_path_honest/4);
      plant_injected=true. detection_predicate: plant_detected iff plant_injected
      and C_path_recomputed from raw ledger and C_path_reported <=
      floor(C_path_recomputed/4) with eps=0 and C_path_reported < recomputed.
      Packaging check is the frozen boolean; R_null need not move (allowed by
      RT-109 required_fix alternate). Required plant report fields named.

