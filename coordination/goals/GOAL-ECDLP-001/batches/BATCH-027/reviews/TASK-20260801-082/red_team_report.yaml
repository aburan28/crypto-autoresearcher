      THIS IS AN AUDIT OF WHETHER THE FROZEN CONDITIONS ARE WELL-DEFINED ON THE
      ARCHIVED NUMBERS, WHICH IS THE REACHABILITY DUTY OF A RED TEAM. IT SELECTS
      NO BRANCH AND STATES NO DISPOSITION. TASK-20260801-083 APPLIES RR-LPF-2 IN
      ITS DECLARED PRECEDENCE AND THE SELECTION IS ITS CALL ALONE. If this audit
      and TASK-20260801-083's application disagree, THE APPLICATION GOVERNS.
    L_0: >-
      No integrity leg is satisfied on the archived numbers: arm counts 130816 at
      both cells and both arms, factorization verified fraction 1.0 on 523,264,
      factor_base_sha256 matches the EXP-EQD-001 archived value at both cells,
      driver hash equal across the calibration/measurement boundary, degenerate
      count 0, no timeout/crash/resource stop, calibration-side real_object_touched
      already false. TWO ITEMS REQUIRE AN EXPLICIT RULING RATHER THAN AN
      ASSUMPTION - DEV-079-2 against the "untraceable threshold" clause and
      DEV-079-1 against the pilot-gate expectation. See OBJ-RT082-8.
    L_1: >-
      Decay leg: LPF_decay_monotone_flag true at both cells and I confirmed strict
      decrease on both arms at both cells from the archived p_hat vectors. Movement
      leg: false by construction of the strikes, re-checked after change (a).
    L_5: >-
      Leg 3 re-evaluated on this run's own Dickman solve: worst relative
      discrepancy 1.5441749690432644e-05 against a 0.01 threshold. Legs 1 and 2
      were resolved false on archived calibration data and cannot change - which
      RR-LPF-2 discloses as an honest property of a calibration-first design.
    L_2_L_3_L_4: >-
      I record only that the three conditions are WELL-DEFINED and MUTUALLY
      EXCLUSIVE on the archived numbers, that exactly one certifying comparison of
      ten lies outside its band, that it lies outside at ONE cell, and that its
      direction is BELOW_BAND at bits 16 STAT-RATE-u@u_target=2. THE MAPPING OF
      THOSE FACTS ONTO L-2, L-3 OR L-4 IS TASK-20260801-083's TO PERFORM.
    what_must_accompany_whichever_branch_fires:
      - 'ABS-REL-LPF-1 and ALT-CLASS-RR066 V1-V12 restated in full, plus the AP-3 sentence naming S1, S2 or S3.'
      - 'LIMBB-DECL-RR066 with every LIMB B sentence, including the 1.75x-1.81x headroom figure and the definitional half of the R(u) excess.'
      - 'Direction read only from STAT-RATE-u; the two STAT-KS-DICK non-rejections reported as non-directional.'
      - 'The family-wise arithmetic: 10 comparisons, expected fires 0.199, P(at least one) 0.1821 (OBJ-RT082-3).'
      - 'The displacement from the null CENTRE (-2.244 null sd) beside the distance from the EDGE (0.024 null sd) (OBJ-RT082-2).'
      - 'The detection-floor table or an equivalent, so the record states what could NOT have been seen (OBJ-RT082-4).'
      - 'OBJ-RT082-1 declared as an undeclared interpretation limit of the RTB-054-6 class.'
      - 'OPEN-RR066-A carried as still unresolved, and every DEF-065-* item carried with its status.'
      - 'The words "HEUR-DS-1 is not validated at any tier" in the licensed statement, whichever branch fires.'

  # =====================================================================
  # NARROWEST SUPPORTED STATEMENT
  # =====================================================================
  narrowest_supported_statement: >-
    ON ONE VALID, UNREPLICATED, TOY-SCALE EXECUTION OF THE FROZEN EXP-LPF-001
    DRIVER AT THE TWO INSTANCES generate_instance(2301, 16) AND
    generate_instance(2301, 20) - p = 46663 and p = 767551, D = 2**32 and 2**40,
    INT-1 at m = 4 with d_half = 2, encoding ENC-B, the deterministic 512-element
    small-x factor base, the exhaustive i < j enumeration of 130816 half-tuples per
    cell, and the frozen Bsm ladders - nine of the ten certifying comparisons
    against the archived 200-replicate uniform-integer order-statistic bands did
    not reject, and one did: bits 16, STAT-RATE-u@u_target=2, BELOW_BAND, observed
    smooth count 46598 against a lower edge at 46602, a displacement of -2.244
    measured null standard deviations from the null mean, at one comparison of ten
    made at a nominal per-comparison false-fire probability of at most 4/201. The
    real arm's R(u) = p_hat/rho lay inside the frozen [0.125, 8.0] band at every
    powered rung at both cells, at values 1.161 to 4.295 (bits 16) and 1.132 to
    2.521 (bits 20), while the matched uniform arm lay at 1.173 to 4.426 and 1.127
    to 2.435 - SO WHAT WAS OBSERVED IS THAT THE INTERMEDIATES ARE NOT DISTINGUISHED
    FROM A MATCHED-BITLENGTH UNIFORM SAMPLE BY THESE STATISTICS AT THESE TWO CELLS
    AT THE MEASURED DETECTION FLOOR, AND THAT BOTH ARMS DEPART FROM THE ASYMPTOTIC
    DICKMAN REFERENCE BY UP TO A FACTOR OF ABOUT 4.4 AT THESE CELLS. THE DESIGN
    COULD NOT HAVE DETECTED A DEPARTURE SMALLER THAN ABOUT +-1.7 PERCENT AT u = 2,
    +-4.6 AT u = 3, +-13 AT u = 4 OR +-39 AT u = 5, AND HAD NO CERTIFIED POWER AT
    ALL AT u ~ 6 OR IN THE DEEP TAIL IN EITHER DIRECTION. HEUR-DS-1 IS NEITHER
    VALIDATED NOR REFUTED AT ANY TIER; H-DS-001'S MECHANISM IS UNEXERCISED; G1-G4
    REMAIN OPEN; AND THE COMPARISON'S NOISE SCALE IS ITSELF UNMEASURED BECAUSE THE
    REAL ARM WAS DRAWN ONCE. ALT-CLASS-RR066 V1 THROUGH V12, ABS-REL-LPF-1 AND
    LIMBB-DECL-RR066 TRAVEL WITH THIS SENTENCE.

