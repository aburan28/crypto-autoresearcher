  # =====================================================================
  # ATTACK 1 - WHAT NINE NON-REJECTIONS LICENSE
  # =====================================================================
  attack_1_what_the_non_rejections_license:
    headline: >-
      THE NINE NON-REJECTIONS LICENSE A DETECTION FLOOR AND NOTHING ELSE. On a
      correct null this design fires 0.199 times in expectation over its ten
      certifying comparisons and fires at least once with probability 0.1821
      (independent-comparison arithmetic at 4/201). Observing exactly one fire is
      the second most likely correct-null outcome. The observation therefore
      distinguishes the null from essentially nothing; what it DOES do is fix,
      quantitatively, how large a departure could have been present and gone
      unseen.
    the_ten_comparisons_are_not_ten_independent_tests:
      mechanism: >-
        The Bsm ladder is NESTED (bits 16: 65536 > 1626 > 256 > 84; bits 20:
        1048576 > 10321 > 1024 > 256), so the u = 3 smooth set is a subset of the
        u = 2 smooth set and so on. Under the nested-binomial model on the
        uniform arm's own measured means, corr(p2,p3) = 0.368, corr(p3,p4) =
        0.366, corr(p4,p5) = 0.396, corr(p2,p4) = 0.135, corr(p2,p5) = 0.053,
        corr(p3,p5) = 0.145. STAT-KS-DICK is a function of the same empirical
        Z-CDF and is correlated with all four.
      consequence: >-
        "NINE OF TEN" IS NOT NINE INDEPENDENT CONFIRMATIONS. It is on the order of
        six to seven effectively independent comparisons, and the two cells are
        the only genuinely near-independent replication in the package - and even
        they share one master seed (generate_instance(2301, 16) and
        generate_instance(2301, 20)).
      recomputed_here: true
    the_measured_blind_spot_in_the_rough_direction:
      fact: >-
        Seven of 28 plant rung-cell pairs are INERT (not one of the seven
        statistics moves), and ALL SEVEN ARE OBJ-PLANT-ROUGH at small gamma -
        bits 16 at gamma 0.0005, 0.001, 0.002 and 0.005, bits 20 at gamma 0.0005,
        0.001 and 0.002 (execution report inert_rungs_called_out; identical
        whether taken over all seven statistics or over the five retained).
      certified_floors_carried_verbatim_from_ALT_CLASS_RR066: >-
        SMOOTH direction (S1), both cells: gamma = 0.002 for
        STAT-RATE-u@u_target=4, 0.005 for u_target=3, 0.01 for u_target=2, 0.05
        for STAT-KS-DICK, and NONE_ON_LADDER for u_target=5. ROUGH direction (S2),
        both cells: gamma = 0.02 for u_target=2 and 0.05 for u_target=3; EVERY
        OTHER STATISTIC IS NONE_ON_LADDER, INCLUDING STAT-KS-DICK.
      what_that_means_in_samples: >-
        A rough-direction contamination of up to gamma = 0.02, i.e. UP TO 2,616 OF
        THE 130,816 SAMPLES REPLACED BY THE ROUGH PLANT, is below the design's
        certified both-cells detection floor. The design's rough-direction power
        is measurably weaker than its smooth-direction power, which ALT-CLASS-RR066
        states rather than averages away, and the one reject that fired is in the
        ROUGH direction - the weak one.
      the_sharpest_single_sentence_in_this_report: >-
        THE OBSERVED REJECT IS THE SIZE OF A CONTAMINATION THE DESIGN IS NOT
        CERTIFIED TO DETECT. The bits-16 STAT-RATE-u@2 displacement is -2.244
        measured null sd from the null mean. The archived OBJ-PLANT-ROUGH bits-16
        STAT-RATE-u@2 shift ladder is (gamma 0.002, 0.005, 0.01, 0.02, 0.05) ->
        (-0.244, -0.882, -2.061, -4.366, -11.248) null sd; linear interpolation
        puts the observed displacement at gamma ~ 0.0108, i.e. the effect of
        replacing about 1.1 percent of the samples with the rough plant - BELOW
        the certified rough-direction both-cells floor of gamma = 0.02.
    controls_before_belief_applied:
      the_parameter_meant_to_destroy_the_signal: >-
        u (equivalently, decreasing Bsm). p_hat(u) must decay; DECAY-LPF-1 is the
        L-1 artifact-tell leg.
      does_it_decay: >-
        YES, strictly, on the real arm and on the fresh uniform arm at both cells
        (LPF_decay_monotone_flag true at both cells; real bits 16 0.35621,
        0.070190, 0.010052, 0.0014983, 0.00024462, and the uniform arm likewise).
        NO ARTIFACT TELL IN THIS CHANNEL.
      but_the_decay_is_a_controlled_null: >-
        The decay is present at essentially identical magnitude in the uniform
        arm. Under docs/inventor-protocol.md section 3 that makes it a CONTROLLED
        NULL - it records that the apparatus works, and it is not a finding about
        the Semaev map.
      the_quantity_that_should_be_flat_and_is_not: >-
        R(u) = p_hat/rho should be flat in u if the Dickman reference were valid at
        this X. IT IS NOT. Real arm bits 16: 1.161, 1.444, 2.047, 4.295, 12.940.
        Uniform arm bits 16: 1.173, 1.453, 2.122, 4.426, 10.110. THE RISE IS
        PRESENT AT NEARLY IDENTICAL MAGNITUDE ON THE KNOWN-UNIFORM ARM, so it is a
        second controlled null: it is a finite-X plus definitional artifact
        (LIMBB-DECL-RR066 part 1 recomputes about half of it away), NOT a property
        of the intermediates. Any deliverable that reports the real arm's R(u)
        rise as a Semaev observation is reporting the apparatus.
      the_inverted_power_profile: >-
        RECORDED AS A DESIGN CRITICISM AND NOT AS A DEFECT OF THIS RUN. The
        discriminating power of LIMB A collapses monotonically in u exactly where
        a smoothness heuristic is interesting - band half-width relative to the
        null mean is +-0.87 percent at bits 16 u=2, +-2.24 at u=3, +-6.87 at u=4,
        +-18.22 at u=5, +-43.60 at u=6 - and LIMB B's upward headroom collapses
        the same way (6.82x, 5.51x, 3.77x, 1.81x at bits 16). The design is
        sharpest where the answer matters least.
    largest_departure_still_consistent:
      what_this_table_is: >-
        THE FINDING. For each powered rung, the largest multiplicative departure
        of the real arm's B-smooth rate from the uniform arm's measured law that
        this design could NOT have ruled out. Two readings are given because they
        answer two different questions and neither alone is honest.
      reading_i_band_arithmetic:
        definition: >-
          The interval of multiplicative factors delta on the null mean whose
          image lies inside the frozen band, i.e. [lower/null_mean,
          upper/null_mean]. This is what a single in-band observation leaves open
          IGNORING resampling noise. Computed here from RR-LPF-2 bands and
          null_spread.
        bits_16:
          'u=2': '[-0.79%, +0.96%]'
          'u=3': '[-2.51%, +1.98%]'
          'u=4': '[-7.76%, +5.97%]'
          'u=5': '[-19.5%, +17.0%]'
          'STAT-KS-DICK': '[-2.93%, +3.07%] in the KS statistic, NON-DIRECTIONAL'
        bits_20:
          'u=2': '[-0.98%, +1.03%]'
          'u=3': '[-2.37%, +2.73%]'
          'u=4': '[-7.13%, +8.02%]'
          'u=5': '[-19.8%, +23.4%]'
          'STAT-KS-DICK': '[-3.46%, +3.25%] in the KS statistic, NON-DIRECTIONAL'
      reading_ii_power_based_and_this_is_the_one_to_quote:
        definition: >-
          The smallest |delta - 1| this design would have detected with 90 percent
          probability under L-3, which requires a band exit at BOTH cells in the
          SAME direction. Computed as the per-cell 95 percent one-sided
          requirement delta*mean >= upper + 1.6449*sd (or <= lower - 1.6449*sd),
          taking the WORSE of the two cells. Normal approximation to the binomial
          count at n = 130816; the null's own sd matches the binomial prediction
          to within about 8 percent at every rung, so the approximation is sound.
        'u=2': 'smoother by more than +1.68% or rougher by more than -1.63%'
        'u=3': 'smoother by more than +4.57% or rougher by more than -4.21%'
        'u=4': 'smoother by more than +13.1% or rougher by more than -12.5%'
        'u=5': 'smoother by more than +38.8% or rougher by more than -35.2%'
        'STAT-KS-DICK': 'a KS-statistic change beyond +5.5% / -5.7%, direction UNREADABLE'
        'u=6': 'NO CERTIFIED POWER. STAT-RATE-u@u_target=6 is STRUCK (V9); the rung is underpowered by POW-LPF-1 pre-datum arithmetic, n*rho(6) about 2.6.'
        deep_tail: 'NO CERTIFIED POWER IN EITHER DIRECTION AT EITHER CELL. STAT-TAIL-DEEP is STRUCK (V8).'
      the_statement_that_should_be_written_into_the_evidence_record: >-
        AT u = 5 THIS EXPERIMENT COULD NOT HAVE DETECTED A DEPARTURE OF THE
        INTERMEDIATES' B-SMOOTH RATE FROM THE MATCHED UNIFORM LAW SMALLER THAN
        ABOUT PLUS 39 PERCENT OR MINUS 35 PERCENT; AT u = 6 AND IN THE DEEP TAIL
        IT COULD NOT HAVE DETECTED ANY DEPARTURE AT ALL. Its finest resolution,
        about +-1.7 percent, is at u = 2, where the smoothness heuristic is least
        interesting. That sentence, not the count of non-rejections, is what nine
        non-rejections license.
      caveat_that_must_travel_with_the_table: >-
        BOTH READINGS ASSUME THE FROZEN BAND IS THE CORRECT NOISE SCALE FOR THE
        REAL ARM. Objection OBJ-RT082-1 argues that assumption is untested and is
        the largest single hole in the package. If it fails, every number in this
        table is wrong by the same unknown factor.

  # =====================================================================
  # ATTACK 2 - THE ONE REJECT, ADJUDICATED
  # =====================================================================
  attack_2_adjudication_of_the_single_reject:
    the_two_framings:
      framing_A_minimising: >-
        "A rejection by FOUR SAMPLES out of 130816 - observed 46598 against a lower
        edge at 46602 - a p_hat shortfall of 3.06e-05 sitting 0.024 measured null
        sd outside the nearer edge, against a per-comparison false-fire
        probability of 4/201 = 0.0199." (ANOM-079-2, and the snapshot message.)
      framing_B_amplifying: >-
        "At that cell and rung the frozen lower edge coincides EXACTLY with the
        minimum of the 200 calibration replicates, the 1st and 2nd ascending order
        statistics being TIED at 0.3562408268101761, so the real value lies BELOW
        ALL 200 NULL REPLICATES." (ANOM-079-3.)
      both_are_true_and_both_are_misleading: true
    verdict: >-
      IT IS NEITHER A TRIVIAL EDGE EFFECT NOR A SIGNAL. IT IS AN ORDINARY
      TWO-SIGMA EXCURSION IN A FAMILY OF TEN, AND ITS HONEST STATUS IS
      "UNINFORMATIVE IN EITHER DIRECTION UNTIL REPLICATED AT A SECOND CURVE
      INSTANCE".
    why_framing_A_understates:
      - >-
        IT MEASURES FROM THE WRONG REFERENCE. "0.024 null sd outside the nearer
        edge" is a distance to a BAND EDGE, and a band edge is itself the 2nd
        order statistic of 200 draws with its own sampling noise of order half a
        null sd. The scale-free quantity is the distance from the null CENTRE:
        recomputed here, (0.3562102495107632 - 0.35907492202788643) /
        0.0012764339776488623 = -2.244 measured null sd. That is a 2.5 percent
        two-sided normal event at that one comparison, not a rounding artifact.
      - >-
        IT COMPARES A MAGNITUDE WITH A RATE. "Four samples" and "4/201" are not
        commensurable quantities; setting them side by side invites the reader to
        conclude the fire was marginal in PROBABILITY, which "four samples" does
        not establish.
      - >-
        THE TIE CUTS AGAINST THE MINIMISING READING, NOT FOR IT. Because the 1st
        and 2nd ascending order statistics are tied, falling STRICTLY below the
        2nd order statistic means falling strictly below the MINIMUM, whose null
        probability is at most 1/201 = 0.00498, not 2/201. RR-LPF-2
        band_provenance.tie_caveat_declared states exactly this and states it in
        the correct direction: 0.0199 is an UPPER BOUND, never an understatement.
        SO THE BAND AT THAT EDGE IS STRICTER THAN NOMINAL, AND A FIRE THERE IS
        RARER UNDER THE NULL THAN THE DECLARED LEVEL SUGGESTS.
    why_framing_B_overstates:
      - >-
        MULTIPLICITY. "Below all 200 replicates" is a per-comparison event of
        probability at most 1/201; over the ten certifying comparisons the
        family-wise probability of SOME comparison landing strictly below its own
        200 nulls is at most 1 - (1 - 1/201)**10 = 0.0487, and the corresponding
        either-tail figure is 1 - (1 - 2/201)**10 = 0.0952. The positive
        correlation among the nested statistics (0.37 between adjacent rungs)
        makes the true family-wise rate lower still than these independent bounds,
        but it does not move it into discovery territory. A five-percent
        family-wise event is not a finding.
      - >-
        THE TIE IS UNREMARKABLE AND IS NOT A PATHOLOGY. The null sd in COUNTS is
        0.0012764*130816 = 167 counts and the 200 replicates span roughly 911
        counts (46602 to 47513); two of 200 draws landing on the same integer
        count is expected, not anomalous. "Below 200/200" and "four counts below
        the edge" are the same fact viewed at two zoom levels; the scale-free
        statement is -2.244 null sd.
      - >-
        DIRECTION AND POWER ARE MISMATCHED. The fire is BELOW_BAND, i.e. ROUGHER
        than the reference - the direction in which S2 records the design's
        weakest certified power (both-cells floor gamma = 0.02 for this very
        statistic, NONE_ON_LADDER for three of the five retained). Under
        validity_of_a_rejection_versus_certification_of_power a rejection against
        a measured band is VALID wherever it occurs, and I do not dispute its
        validity; but its interpretive weight is bounded by the fact that the
        displacement corresponds to a contamination (gamma ~ 0.011) the design is
        not certified to detect at both cells.
    which_direction_the_tied_edge_cuts_stated_plainly: >-
      THE TIE MAKES THE DECLARED 4/201 LEVEL NOT HOLD AT THAT EDGE - IT HOLDS AS
      AN UPPER BOUND, WITH THE TRUE LOWER-SIDE RATE AT MOST 1/201. That is the
      CONSERVATIVE direction: the band is harder to exit downward there than the
      nominal level implies, so the fire is somewhat MORE surprising than 4/201
      suggests, not less. The executor's magnitude framing therefore understates
      the event on this axis. It is still not significant once the ten
      comparisons are counted, and the two effects roughly cancel: a per-comparison
      one-sided event of about 0.005 in a family of ten is about 0.05 family-wise.
    what_would_settle_it: >-
      NOT MORE ARGUMENT. The bits-16 STAT-RATE-u@2 statistic has by far the finest
      resolution in the package (+-0.87 percent). If the real arm is genuinely
      about 0.8 percent rougher than a matched uniform sample at bits 16, that
      offset will reappear at a fresh curve instance; if it is sampling noise it
      will not. See next_concrete_action.

  # =====================================================================
  # ATTACK 3 - IS THE ABSOLUTE LIMB DOING WHAT IT CLAIMS
  # =====================================================================
  attack_3_is_limb_b_genuinely_absolute:
    construction_check_PASSES: >-
      YES AS TO CONSTRUCTION. The [0.125, 8.0] band is inherited from EXP-DS-001,
      is hash-bound pre-datum in specification.yaml at sha256
      0d6c946fb84073feae47865da9b787b7d7ba459617834644680a06bf886d1cda, and did
      not move. The denominator is the driver's OWN numerically solved rho
      (LPF_rho_u_computed, worst relative discrepancy against the frozen table
      1.544e-05, well inside the 1 percent L-5 leg). NO CALIBRATION NUMBER ENTERS
      THE LIMB B THRESHOLD OR THE LIMB B REFERENCE. I could not break this and I
      record that I tried.
    content_check_FAILS_TO_SUPPORT_THE_NATURAL_READING:
      the_measured_agreement_is_with_the_uniform_arm_not_with_dickman:
        real_vs_dickman_at_powered_rungs: >-
          R_real, bits 16: 1.161, 1.444, 2.047, 4.295. bits 20: 1.132, 1.309,
          1.599, 2.521. THE REAL ARM DISAGREES WITH ASYMPTOTIC DICKMAN BY UP TO A
          FACTOR OF 4.30 AT A POWERED RUNG, and by 12.94 at bits 16 u = 6, where
          real_R_u_inside_frozen_band is FALSE.
        real_vs_uniform_at_the_same_rungs: >-
          p_hat_real / p_hat_uniform, bits 16: 0.98928, 0.99372, 0.96478, 0.97030.
          bits 20: 1.00382, 0.98345, 0.92857, 1.03540. THE REAL ARM AGREES WITH
          THE UNIFORM ARM TO WITHIN 1 TO 7 PERCENT.
        the_ks_statistic_makes_it_unambiguous: >-
          STAT-KS-DICK is the sup-norm distance between the empirical Z-CDF and
          the DICKMAN CDF. The real arm's value is 0.04861 at bits 16 and 0.03806
          at bits 20; the uniform arm's 200-replicate mean is 0.04893 and 0.03840.
          THE REAL ARM IS 4.9 AND 3.8 CDF PERCENTAGE POINTS AWAY FROM DICKMAN.
          What was measured is that IT IS EXACTLY AS FAR FROM DICKMAN AS A UNIFORM
          SAMPLE OF THE SAME SIZE AT THE SAME X IS.
      what_follows_if_it_is_only_the_latter: >-
        EXACTLY WHAT U1 AND V1 SAY, AND THE SHARED-DEVIATION CHANNEL IS NOT
        HYPOTHETICAL HERE - IT IS MEASURED AND LARGE. A two-sample comparison is
        blind by construction to any deviation both arms share; the shared
        deviation from asymptotic Dickman at these cells is a factor of 1.17 to
        4.43 at powered rungs and 11.59 at bits 16 u = 6 (calibration means), and
        about half of it survives LIMBB-DECL-RR066's recomputation of u against
        the actual sample range (corrected uniform-arm R(u) at bits 16: 1.063,
        1.199, 1.519, 2.998, 6.684). LIMB B'S ENTIRE JOB IS TO CATCH THAT SHARED
        COMPONENT, AND AT THESE CELLS THE SHARED COMPONENT HAS ALREADY CONSUMED
        4.43 OF THE 8.0 BUDGET AT BITS 16 u = 5. Therefore: no deliverable may
        write "the intermediates are consistent with the Dickman prediction". The
        licensed sentence is "the intermediates are not distinguished from a
        matched-bitlength uniform sample by these statistics, and BOTH depart from
        asymptotic Dickman by up to a factor of about 4.4 at these cells".
    limb_b_declaration_carried_into_every_limb_b_statement:
      binding: 'LIMBB-DECL-RR066 travels with every sentence in this block, as RR-LPF-2 requires.'
      part_2_asymmetry_applied_to_THIS_run: >-
        LIMB B IS NOT A SYMMETRIC 8x TEST AT THESE CELLS AND A NON-EXIT IS
        CORRESPONDINGLY WEAK EVIDENCE OF AGREEMENT. Upward headroom against the
        measured uniform arm of this run: bits 16 u=2 6.82x, u=3 5.51x, u=4 3.77x,
        u=5 1.81x; bits 20 u=2 7.10x, u=3 6.01x, u=4 4.65x, u=5 3.29x. Downward
        headroom is at least 9.0x everywhere. SO "R(u) INSIDE [1/8, 8] AT EVERY
        POWERED RUNG" MEANS, AT ITS TIGHTEST, "THE REAL ARM IS NOT MORE THAN 1.81
        TIMES SMOOTHER THAN THE UNIFORM ARM AT BITS 16 u = 5", AND AT ITS
        LOOSEST "NOT MORE THAN 64 TIMES ROUGHER". A statement of the second kind
        must never be reported as an order-of-magnitude agreement.
      part_1_definitional_mismatch_carried: >-
        RTB-054-6 part 1 travels: u is defined at D (2**32, 2**40) while every
        sample lives on [1, p**2], with archived X/D = 0.50697 and 0.53581. u is
        systematically OVERSTATED relative to the sample range and rho(u)
        systematically UNDER-predicts p_hat, so R(u) on a CORRECT uniform arm is a
        BIASED ESTIMATOR of the thing LIMB B is named for. The bits-16 u=6
        non-decidability is largely a definitional artifact (11.59 -> about 6.68
        under the corrected u).
    the_run_time_flag_anomaly_checked: >-
      ANOM-079-1 IS DECLARED-IN-ADVANCE AND I CONFIRM IT AS SUCH. At bits 20 u = 6
      the fresh uniform replicate gave R(u) = 8.0434, marginally above the 8.0
      edge, against an archived 200-replicate mean of 5.0386 and an archived
      measured range 1.53 to 8.81 that RR-LPF-2 recorded IN ADVANCE as straddling
      8. No branch reads that rung. I record, as a separate observation, that the
      real and uniform arms move in OPPOSITE directions at u = 6 across the two
      cells - bits 16 real/uniform = 1.280, bits 20 real/uniform = 0.762 - which
      is precisely the rung this design struck. That is not evidence; it is the
      shape of the blind spot named in V9, and it is where a genuine deep-u
      departure would be invisible.

  # =====================================================================
  # ATTACK 4 - SCOPE AND WHAT REMAINS UNTOUCHED
  # =====================================================================
  attack_4_scope:
    what_HEUR_DS_1_asserts_verbatim: >-
      "Intermediate degrees arising from half-arity Semaev partial maps ON UNIFORM
      RANDOM TARGETS behave, for B-smoothness purposes, like uniform random
      integers of the same bitlength - the probability an intermediate is B-smooth
      is within a constant factor of Dickman rho(u) with u = log D / log B, where
      D bounds the intermediate degree."
    what_this_run_does_not_touch:
      - id: SCOPE-1
        item: 'THE QUANTIFIER "ON UNIFORM RANDOM TARGETS" IS ABSENT FROM THE MEASURED OBJECT.'
        detail: >-
          INT-1 forms f_ij(Z) = S_3(x_i, x_j, Z) over a FIXED deterministic
          512-element factor base with NO target anywhere in the construction, and
          OBJ-REAL is EXHAUSTIVE over the C(512,2) = 130816 half-tuples. The
          heuristic's probability is over a randomised object; the measurement is a
          deterministic population fraction at one instance per cell. This is not a
          defect of the run - it is what the frozen contract measures - but it means
          the run measures a DIFFERENT quantity from the one the heuristic
          quantifies, and no branch of RR-LPF-2 says so in these terms.
      - id: SCOPE-2
        item: 'THE MEASURED INTEGER IS AN ENCODING, NOT A DEGREE.'
        detail: >-
          N_ij = lift(e_1)*p + lift(e_2) + 1 (ENC-B) is a bijective encoding of the
          fibre invariant pair, not "the intermediate degree" the heuristic names.
          Its smoothness is NOT invariant under a change of encoding: a different
          bijection [0,p)**2 -> [1,p**2] would give a different largest-prime-factor
          law for the SAME mathematical object. V5 scopes the result to ENC-B, which
          is correct as far as it goes, but the substitution of ENC-B for "degree" is
          a MODELLING CHOICE and no deliverable may present the result as a test of
          the heuristic's own quantity without saying so.
      - id: SCOPE-3
        item: 'u IS DEFINED AT D WHILE SAMPLES LIVE ON [1, p**2] (RTB-054-6 part 1).'
        detail: 'Carried in full at attack_3.limb_b_declaration_carried_into_every_limb_b_statement.part_1_definitional_mismatch_carried. X/D = 0.50697 and 0.53581.'
      - id: SCOPE-4
        item: 'LIMB B IS NOT A SYMMETRIC 8x TEST (RTB-054-6 part 2).'
        detail: 'Only about 1.75x-1.81x upward headroom at bits 16 u = 5. Carried at attack_3.'
      - id: SCOPE-5
        item: 'NO CERTIFIED POWER AGAINST A DEEP-TAIL-ONLY DEPARTURE IN EITHER DIRECTION AT EITHER CELL (V8).'
        detail: >-
          STAT-TAIL-DEEP is STRUCK. Its largest absolute shift over all 28 plant
          rung-cell pairs is 0.338 null sd. The rough family cannot reach the deep
          tail structurally (Z < 2 by construction against a null tenth-largest Z
          above 5, 0 exceedances in 462,736 regenerated plants); the smooth family
          reaches it at a measured rate of about 6.5e-06 per plant, 3 of 463,080.
          I ACCEPT D1-v2 PART (i) AS STRUCTURAL AND PART (ii) AS MEASURED AND NOT
          STRUCTURAL, WHICH IS WHAT RR-LPF-2 SAYS. Consequence for this run: the
          measured T_deep values (5.9398 at bits 16, 5.7571 at bits 20) are
          UNREADABLE in either direction and their non-rejection is not evidence.
      - id: SCOPE-6
        item: 'NO POWER AT u ~ 6 (V9), AND THAT IS WHERE THE TWO CELLS DISAGREE IN THIS RUN.'
        detail: 'Real/uniform p_hat ratio 1.280 at bits 16 and 0.762 at bits 20. Struck; unreadable; recorded.'
      - id: SCOPE-7
        item: 'ONE MASTER SEED, TWO CELLS, NO REPLICATION.'
        detail: >-
          Both cells come from generate_instance(2301, .). The same two instances as
          EV-EQD-001 by design, so THIS IS EXPRESSLY NOT A REPLICATION OF ANYTHING
          and may never be counted toward `replicated`. RT049-CTRL-5 remains owed.
      - id: SCOPE-8
        item: 'RT049-B6 CARRIED SHARPENED - THE FACTOR BASE MEASURED IS THE NARROW SMALL-x WINDOW.'
        detail: >-
          The base is "the first 512 x-coordinates in F_p in increasing integer
          order". The determinism-versus-small-x-window confound is UNTOUCHED
          (V7). So a departure would be attributable to the WINDOW rather than to
          the Semaev map, and - the sharpened form - A NON-DEPARTURE IS A
          NON-DEPARTURE FOR THAT BASE ONLY. The discriminating arm RT049-CTRL-2, a
          windowed null, remains owed.
      - id: SCOPE-9
        item: 'THE ENTIRE QUESTION OF BEHAVIOUR AT CRYPTOGRAPHIC D (V6).'
        detail: >-
          D = 2**32 and 2**40 here, with the smoothness-tested integer living on
          [1, p**2], i.e. log2 X = 31.02 and 39.10. The exemplar profile validates
          its analogous heuristic at p = 5*2**248 - 1 (log2 p = 250.3) with 100,000
          samples and p = 27*2**500 - 1 (log2 p = 504.8) with 10,000 samples, where
          the smoothness-tested integer is a minimal isogeny degree bounded by
          (p/2)**(1/3), i.e. log2 X about 83.1 and 167.9. TWO GAPS, BOTH STATED
          RATHER THAN CONFLATED: about 235 to 485 bits in the security parameter p,
          and about 52 to 129 bits (a factor of 2.7 to 4.3 in log2) in the size of
          the integer whose smoothness is actually measured.
      - id: SCOPE-10
        item: 'V1 THROUGH V12 IN FULL - REPRODUCED BELOW SO THAT NO STATEMENT CAN TRAVEL WITHOUT THEM.'
    alternative_class_restatement_completeness_check:
      duty: >-
        The handoff makes checking ALT-CLASS-RR066 for COMPLETENESS and for
        SOFTENED WORDING the specific failure being hunted. I checked all twelve
        against RR-LPF-2 section 7 and against the specification's own
        alternative-class block.
      verdict: 'COMPLETE AND NOT SOFTENED. Twelve classes present; V8''s restatement is strictly weaker as a claim about the world and exactly as strong as a limit on what may be claimed, which is what V8 is for; V12 correctly records the uncertified side of change (a).'
      V1: 'Any departure from the Dickman law that a matched-bitlength uniform sample exhibits at the same magnitude and sign - absorbed by LIMB A''s measured band by construction; only LIMB B can see it.'
      V2: 'Any departure of magnitude below the smallest ladder rung gamma = 0.0005, about 65 of the 130816 samples.'
      V3: 'Any departure visible only in the joint law of the largest and second-largest prime factors, in the full factorization pattern, or in the arithmetic of the factors themselves.'
      V4: 'Any departure at u outside the frozen sweep [2, 6], and in particular at u > 6 where this design is underpowered by its own declared arithmetic.'
      V5: 'Any object other than the two frozen toy cells, INT-1, ENC-B, m = 4, d_half = 2, Bfb = 512 and the i < j enumeration.'
      V6: 'THE ENTIRE QUESTION OF BEHAVIOUR AT CRYPTOGRAPHIC D. The toy D here is 2**32 and 2**40; NOTHING MEASURED HERE TRANSFERS UPWARD BY ANY ARGUMENT THIS CONTRACT OFFERS.'
      V7: 'The determinism-versus-small-x-window confound RT049-B6, untouched here as it was in BATCH-024.'
      V8: 'Any departure visible only in the deep tail of the Z distribution, above the measured null tenth-largest Z of about 6.06 at bits 16 and 5.76 at bits 20. STAT-TAIL-DEEP is struck; OBJ-PLANT-ROUGH places no mass there at any rung, structurally; OBJ-PLANT-SMOOTH places negligible mass there at the frozen rungs. NO CERTIFIED POWER AGAINST A DEEP-TAIL-ONLY DEPARTURE IN EITHER DIRECTION AT EITHER CELL.'
      V9: 'Any departure visible only at u about 6, i.e. Bsm = 40 at bits 16 and Bsm = 102 at bits 20. Struck, underpowered (n*rho(6) about 2.6), and at bits 16 LIMB B is not decidable there.'
      V10: 'Any rough-direction departure detectable only by STAT-KS-DICK at bits 20, at any gamma. That ladder is struck under D9 and its sign carries no direction near the D+/D- crossing.'
      V11: 'Any rough-direction departure at u = 5 at either cell. Both OBJ-PLANT-ROUGH / STAT-RATE-u@u_target=5 ladders are struck (top-rung shifts -0.829 and -0.462).'
      V12: 'Any rough-direction departure at gamma = 0.005 detectable only by STAT-RATE-u@u_target=2 at bits 16, and any rough-direction departure at gamma = 0.01 detectable only by STAT-KS-DICK at bits 16. Neither is supported by the archived movement flag (shifts -0.882122 and -0.937958, both false).'
      the_ap_3_sentence_restated: >-
        NO DELIVERABLE MAY DESCRIBE THIS EXPERIMENT AS HAVING POWER AGAINST
        "DEPARTURES FROM DICKMAN" WITHOUT NAMING WHICH OF S1, S2 OR S3 THE CLAIM
        RESTS ON AND WITHOUT CARRYING V1 THROUGH V12.
    the_upward_argument_attacked_step_by_step:
      step_1: 'p_hat(u) on 130816 ENC-B encodings at p = 46663 and p = 767551 is close to the matched uniform value. FAILS AS A PREMISE FOR ANYTHING ABOVE: it is one deterministic instance per cell with no measured instance-to-instance noise (OBJ-RT082-1).'
      step_2: 'Therefore the intermediates are Dickman-distributed at these cells. FAILS: both arms sit 3.8 to 4.9 CDF points from Dickman and R(u) reaches 4.30 on the real arm. What was shown is agreement with the UNIFORM ARM (attack_3).'
      step_3: 'Therefore the same holds at larger D by continuity of the Dickman law. FAILS: rho is asymptotic, the finite-X correction measured here is a factor of up to 4.4 and is not a small perturbation, and its size and sign at D = 2**512 are unknown and unmeasured. V6.'
      step_4: 'Therefore HEUR-DS-1 holds at cryptographic D. FAILS: the security parameter is about 235-485 bits away and the smoothness-tested integer about 52-129 bits away from the exemplar''s, and the exemplar profile requires validation AT the claimed scale reached by a substitute-sampling correspondence. NO SUCH CORRESPONDENCE EXISTS FOR SEMAEV INTERMEDIATES IN THIS CAMPAIGN, AND NAMING ONE IS A RESEARCH PROBLEM, NOT A GAP TO BE WAVED THROUGH.'
      step_5: 'Therefore the split index-calculus cost model is justified. FAILS TWICE: the heuristic would still be a heuristic (conditional theorems stay conditional), and H-DS-001''s cost claim needs the claw mechanism measured, which no run in this campaign has done.'
      conclusion: 'THERE IS NO STEP OF THIS CHAIN THAT SURVIVES. The chain fails at step 1.'

  # =====================================================================
  # ATTACK 5 - THE PROMOTION CEILING
  # =====================================================================
  attack_5_promotion_ceiling:
    state_machine: >-
      H-LPF-001 is `approved`. The AGENTS.md ladder is proposed -> specified ->
      approved -> running -> analyzed -> replicated -> supported. The most
      favourable branch available to this run (L-2) advances it to `analyzed` with
      disposition `replicate`. `supported` IS TWO TRANSITIONS AWAY AND REQUIRES
      `replicated` FIRST, WHICH REQUIRES RT049-CTRL-5 - THE ACTUAL REPLICATION AT A
      DIFFERENT CURVE INSTANCE PER BIT SIZE - WHICH IS EXPRESSLY OWED AND NOT RUN.
      Independently of the ladder, `support` is forbidden under EVERY branch of
      RR-LPF-2.
    promotion_gates: 'G1, G2, G3, G4 ALL REMAIN OPEN. Nothing in this run touches any of them.'
    target_profile_scoring:
      C1_exponent_moved: 'NO. This run moves no exponent and claims none. asymptotic_claim in H-LPF-001 is deliberately null.'
      C12_validation_at_the_largest_feasible_scale: 'NO. Toy scale only, and the substitute-sampling route to a larger scale does not exist for this object.'
      C13_C16_cost_table_overheads_tradeoffs_scope: 'NOT ATTEMPTED AND NOT APPLICABLE - this run makes no cost claim.'
      C17_toy_presented_as_toy: 'YES. The package labels claim tier toy throughout and every results JSON carries interpretation: NONE. Credited.'
      classification: >-
        NON-TARGET-CLASS BY CONSTRUCTION, AND CORRECTLY SO. Under
        docs/target-result-profile.md a fully favourable outcome here says the
        heuristic is NOT FALSIFIED at toy scale. That is a PRECONDITION for the
        lane, not a result in it. The lane's target-class result would be an
        exponent statement conditional on HEUR-DS-1 with a crypto-scale validation
        and a concrete-cost table; this run is the first rung of the ladder that
        would have to be climbed before such a statement could even be drafted.
    what_this_run_CAN_support:
      - 'That the apparatus works: 100 percent factorization verification on 523,264 values in-driver and on the full 261,632-value real arm outside the driver, with the object independently reconstructed and all ten smooth counts reproduced exactly.'
      - 'A quantitative detection-floor map for this instrument at these two cells (the largest_departure_still_consistent table).'
      - 'The observation that the real arm''s certifying statistics sit inside their measured uniform bands at 9 of 10 comparisons, with one BELOW_BAND at bits 16 u = 2, scoped exactly to INT-1, ENC-B, Bfb = 512, the i < j enumeration, the two tested cells, the frozen Bsm ladder and the archived bands.'
      - 'That both arms depart from asymptotic Dickman by up to a factor of about 4.4 at these cells - a measured statement about the REFERENCE at finite X, not about the Semaev map.'
      - 'That OPEN-BATCH023-A''s "no direct smoothness measurement has ever been performed" is discharged as a matter of fact IF AND ONLY IF the Validator returned the package admissible.'
    what_this_run_CANNOT_support:
      - 'Validation, support or confirmation of HEUR-DS-1 at any tier including toy.'
      - 'Any statement that the intermediates "follow" or "agree with" the Dickman law.'
      - 'Any statement about H-DS-001, its claw mechanism, its cost ratio R, or S1_met/F1_met/F2_met/structure_gate_passed.'
      - 'Any crypto-scale, medium-scale, asymptotic or affected-scheme claim; any movement of G1-G4.'
      - '`support` or `reject_scoped` on H-LPF-001 or on anything else.'
      - '`replicated` - the two cells share one master seed and are the same instances as EV-EQD-001 by design.'
      - 'A KN-FIND promotion. Promotion requires `support` or `reject_scoped` on replicated or strong evidence; a single unreplicated toy run is neither.'

  # =====================================================================
  # OBJECTIONS
  # =====================================================================
  objections:
    - id: OBJ-RT082-1
      severity: BLOCKING_FOR_INTERPRETATION_IN_BOTH_DIRECTIONS
      title: 'THE BAND IS CALIBRATED TO A NOISE SOURCE THE REAL ARM DOES NOT HAVE, AND NOTHING IN THE PACKAGE MEASURES THE ONE IT DOES.'
      statement: >-
        OBJ-NULL-UNIF is 130816 INDEPENDENT uniform draws; I verified its
        200-replicate sd matches the iid binomial prediction sqrt(p(1-p)/n) to
        within about 8 percent at every powered rung (ratios 0.928, 0.962, 1.012,
        1.033, 1.037, 1.049, 1.052, 0.999). OBJ-REAL is not a sample at all: the
        specification states it plainly - "OBJ-REAL IS EXHAUSTIVE OVER THAT INDEX
        SET. It carries no sampling seed and no sampling noise at all". Its 130816
        values are determined by 512 factor-base x-coordinates, each of which
        appears in 511 of the samples. SO THE FROZEN BAND IS AN iid-SAMPLING BAND
        BEING USED AS THE YARDSTICK FOR A DETERMINISTIC POPULATION FRACTION WHOSE
        OWN FLUCTUATION SCALE - THE SCALE ACROSS CURVE INSTANCES - IS NEVER
        MEASURED, BECAUSE THERE IS ONE INSTANCE PER CELL.
      why_it_cuts_both_ways: >-
        THIS IS NOT AN ARGUMENT FOR EITHER READING AND THAT IS THE POINT. (a) If
        the instance-to-instance sd of p_hat exceeds the iid sd - which the
        C(512,2)-from-512 dependence structure makes entirely possible, since a
        nonzero first-order projection would put the effective sample size nearer
        512 than 130816 - then the true per-comparison false-fire rate is far above
        4/201, the single reject is noise, AND THE NINE NON-REJECTIONS ARE NEARLY
        VACUOUS because the band would be too narrow to be informative in either
        direction. (b) If the instance-to-instance sd is BELOW the iid sd, the
        nine non-rejections are stronger than they look and the one reject is
        stronger still. NOBODY KNOWS WHICH, AND THE PACKAGE CANNOT TELL.
      what_the_package_says_about_it: >-
        NOTHING. I searched the specification, RR-LPF-2 and H-LPF-001 for a
        declaration that the real arm's fluctuation scale might differ from the
        calibration arm's. The nearest items are the assumption that "EVERY
        THRESHOLD IS A MEASURED ORDER STATISTIC OF A MEASURED NULL AT THE ACTUAL X"
        and the exhaustiveness note, which asserts the real arm has NO noise
        without drawing the consequence that the band therefore measures the wrong
        thing. The campaign's "dependence-power repair" carried forward in
        GOAL-ECDLP-001 is about EXP-DEP-001's C2 plant construction and is a
        DIFFERENT item. THIS IS AN UNDECLARED INTERPRETATION LIMIT OF THE SAME
        CLASS AS RTB-054-6, AND IT IS LARGER.
      required_repair: 'A declaration in the evidence record, and the measurement named at next_concrete_action. It is not repairable by argument.'
    - id: OBJ-RT082-2
      severity: MAJOR
      title: 'THE "FOUR SAMPLES" FRAMING MEASURES FROM THE BAND EDGE AND NOT FROM THE NULL CENTRE, AND COMPARES A MAGNITUDE WITH A RATE.'
      statement: >-
        See attack_2 in full. The recomputed scale-free displacement is -2.244
        measured null sd from the null mean, a 2.5 percent two-sided normal event
        at that comparison, not "0.024 sd". ANOM-079-2 is factually correct in
        every number and is nevertheless the less informative of the two available
        framings. The evidence record must carry the displacement from the CENTRE
        beside the distance from the EDGE, or the reader is invited to a
        conclusion the arithmetic does not carry.
      not_an_accusation: >-
        RECORDED AS A FRAMING OBJECTION, NOT AS AN ERROR. The executor recorded the
        tie (ANOM-079-3) that cuts the other way, in the same package, unprompted.
        That is the behaviour the contract asks for and it is credited.
    - id: OBJ-RT082-3
      severity: MAJOR
      title: 'THE FAMILY-WISE ARITHMETIC IS NOT WRITTEN ANYWHERE IN THE PACKAGE.'
      statement: >-
        Ten certifying comparisons were made at a nominal per-comparison rate of
        4/201. The expected number of fires on a correct null is 0.199 and
        P(at least one fire) = 0.1821. Neither number appears in the execution
        report, the reading rule, or any results file; the report states the
        per-comparison rate and the comparison count side by side and leaves the
        multiplication to the reader. THIS IS THE SINGLE ARITHMETIC MOST LIKELY TO
        BE OMITTED FROM THE EVIDENCE RECORD AND IT IS THE ONE THAT DECIDES HOW THE
        ONE REJECT READS. Required in EV-LPF-001.
    - id: OBJ-RT082-4
      severity: MAJOR
      title: 'THE NON-REJECTIONS ARE REPORTED AS A COUNT AND NOT AS A DETECTION FLOOR.'
      statement: >-
        A count of non-rejections is a statement about the procedure; a detection
        floor is a statement about the world. The package archives everything
        needed to compute the floor (bands, null_spread, the DET-LPF-1 gamma
        floors, the movement ladders) and computes none of it. Under
        docs/inventor-protocol.md section 5 the honest deliverable carries the
        floor. Supplied here at largest_departure_still_consistent; it must be
        carried into EV-LPF-001 or the record understates its own scope limits.
    - id: OBJ-RT082-5
      severity: MAJOR
      title: 'THE MEASURED AGREEMENT IS WITH THE UNIFORM ARM; THE AGREEMENT WITH DICKMAN IS A FACTOR-OF-8 STATEMENT SATISFIED AT FACTORS UP TO 4.30.'
      statement: 'See attack_3 in full. The specific prohibition: no sentence of the form "consistent with the Dickman prediction" may be written about the real arm at these cells.'
    - id: OBJ-RT082-6
      severity: MODERATE
      title: 'THE TWO STAT-KS-DICK NON-REJECTIONS ARE THE WEAKEST OF THE NINE AND MUST NOT BE COUNTED AS DIRECTIONAL AGREEMENT.'
      statement: >-
        STAT-KS-DICK is max(D+, D-) and D6 measured the argmax SWITCHING between
        cells at these very parameters (null D+/D- 0.04919/0.00030 at bits 16 and
        0.03824/0.00006 at bits 20; perturbed 0.04658/0.04382 and
        0.03642/0.04461). OPEN-RR052-D as ruled, and the reviewer extension carried
        in force, bar reading direction from it in EITHER direction, including from
        an agreeing sign. Its bits-20 rough ladder is additionally struck under D9,
        which is the canonical artifact tell (movement at gamma = 0.02, none at
        gamma = 0.05). The two KS non-rejections therefore contribute
        "the empirical Z-CDF is not distinguished from the null's own distance to
        Dickman" and nothing more.
    - id: OBJ-RT082-7
      severity: MODERATE
      title: 'THE MEASURED QUANTITY IS AN ENCODING OF AN INVARIANT PAIR, NOT THE INTERMEDIATE DEGREE THE HEURISTIC NAMES, AND THERE IS NO TARGET RANDOMISATION.'
      statement: 'See attack_4 SCOPE-1 and SCOPE-2. Both must be stated in EV-LPF-001; neither is a defect of the run and both are limits on what it measures.'
    - id: OBJ-RT082-8
      severity: MODERATE
      title: 'DEV-079-2 IS AN UNADJUDICATED SPECIFICATION/AUTHORISATION MISMATCH AND SOMEONE MUST RULE IT AGAINST L-0''s "UNTRACEABLE THRESHOLD" CLAUSE.'
      statement: >-
        specification.yaml required_artifacts.reading_rule still names
        reading_rule.yaml (RR-LPF-1) while the run was executed against RR-LPF-2.
        I DO NOT ASSERT THAT THIS IS AN L-0 FAILURE - the thresholds used are fully
        traceable to RR-LPF-2, which passed review at TASK-20260801-068 and was
        bound by the TASK-20260801-078 approval - BUT THE RULING MUST BE MADE
        EXPLICITLY RATHER THAN ASSUMED, because L-0 lists "an untraceable
        threshold" and precedes every other branch. The same applies to DEV-079-1:
        the handoff's pilot-gate sentence was not executable against the
        hash-bound driver, the executor ran the driver unmodified and projected
        outside it (37.26 s MODELED against 18.0 s measured), and no L-0 clause
        names a missing pilot - but that too is a ruling, not a fact in evidence.
    - id: OBJ-RT082-9
      severity: MINOR_BUT_RECORDED
      title: 'ONE RECOMPUTATION DISAGREEMENT: THE ARCHIVED "reading_rule bands" AND THE RUN-TIME LIMB B FLAG DISAGREE AT bits 20 u = 6, AS DECLARED.'
      statement: >-
        limb_b_decidability_map records limb_b_decidable TRUE at bits 20 u = 6 on
        the 200-replicate mean (R = 5.0386); the run-time flag from one fresh
        replicate is FALSE (R = 8.0434). RR-LPF-2 declared this possibility in
        advance with the measured range 1.53 to 8.81 and no branch reads the rung.
        RECORDED AS A CONFIRMED DECLARED-IN-ADVANCE DIVERGENCE, NOT AS A DEFECT.
    - id: OBJ-RT082-10
      severity: PROCESS
      title: 'ANOM-079-7 - CONCURRENT UNTRACKED WRITES IN THE SHARED WORKTREE DURING THE RUN WINDOW.'
      statement: >-
        Three ledger/proposals/IDEA-20260802-*.yaml files and one BATCH-026 review
        directory appeared during the run window and were not created by this run.
        The executor recorded it and stated no tracked file was modified. THE
        SNAPSHOT COMMIT STAGED EXACTLY 14 PATHS, WHICH IS CONSISTENT. I record the
        item because AGENTS.md "durable research commits" makes a scope-expanding
        commit an evidence-integrity failure, and because IDEA-20260802-* ids dated
        after the run window are a queue-hygiene matter for the Coordinator, not a
        mathematical one.

