  required_controls:
    - id: RT082-CTRL-1
      name: 'THE INSTANCE-VARIANCE CONTROL. The null object of the correct SHAPE.'
      priority: 1
      what: >-
        Run the identical pipeline on k >= 20 FRESH curve instances per cell
        (fresh master seeds, same bits, same Bfb = 512 rule, same INT-1/ENC-B, same
        i < j enumeration) and record p_hat(u) for u in {2,3,4,5} plus
        STAT-KS-DICK at each. Compute the BETWEEN-INSTANCE standard deviation and
        compare it, rung by rung, with the frozen null sd already archived
        (bits 16 u=2: 0.0012764339776488623).
      why_it_is_the_control_the_protocol_demands: >-
        docs/inventor-protocol.md section 3 requires the identical measurement
        against a null object of the SAME SHAPE. A uniform integer sample is not
        the same shape as OBJ-REAL: it lacks the C(512,2)-from-512 dependence and
        it lacks the instance. The correct null object is THE SAME DETERMINISTIC
        CONSTRUCTION ON A DIFFERENT CURVE.
      what_it_decides: >-
        (i) Whether the frozen band is the right yardstick at all (OBJ-RT082-1),
        and therefore whether the detection-floor table is right by a factor of 1
        or a factor of 16. (ii) Whether the bits-16 u = 2 shortfall of -0.798
        percent is an instance accident or a reproducible offset - the single
        question this batch cannot answer. (iii) It is RT049-CTRL-5 in the form
        that also discharges the noise-scale question.
      cost: 'About 20 x 18 s of wall clock per cell on the measured timings, plus contract time. Under ten minutes of compute.'
      free_rider: >-
        In the same run, emit the per-factor-base-index smooth rate: for each of
        the 512 base elements, the smooth fraction over its 511 pairs. If the
        dispersion of those 512 rates exceeds sqrt(p(1-p)/511), the first-order
        projection is nonzero, the effective sample size is below 130816, and the
        iid band is provably too narrow. This costs nothing beyond one extra
        array.
    - id: RT082-CTRL-2
      name: 'RT049-CTRL-2, THE WINDOWED NULL. Carried, still owed.'
      priority: 2
      what: >-
        A null whose factor base is drawn from the same narrow small-x window but
        by a NON-deterministic rule, to separate "deterministic selection rule"
        from "small-x window". Until it is run, V7 and RT049-B6 stand and the
        result is a result for THIS base only, in both directions.
    - id: RT082-CTRL-3
      name: 'THE ENCODING CONTROL.'
      priority: 3
      what: >-
        Re-run the identical statistics under a SECOND bijective encoding
        [0,p)**2 -> [1,p**2] that is not ENC-B (for example a bit-interleave, or
        lift(e_2)*p + lift(e_1) + 1). If the smoothness statistics differ between
        encodings by more than the band, then what is being measured is the
        encoding and not the map, and V5 must be promoted from a scope note to a
        first-order limitation. If they agree, ENC-B stops being a free parameter.
        Cheap: no new object, one extra column.
    - id: RT082-CTRL-4
      name: 'THE DEEP-TAIL PERTURBATION FAMILY.'
      priority: 4
      what: >-
        A plant that actually places mass above the null tenth-largest Z (above
        about 6.06 and 5.76). It is the ONLY thing that would convert V8 from an
        uncertified class into a certified one, and the deep tail is exactly where
        an index calculus would care. Already ranked in GOAL-ECDLP-001; I endorse
        the ranking and note it is the only listed item that removes a
        NO-CERTIFIED-POWER-IN-EITHER-DIRECTION hole.
    - id: RT082-CTRL-5
      name: 'THE CENTRED LIMB B SUCCESSOR AND THE SIGNED (D+, D-) DRIVER REVISION.'
      priority: 5
      what: >-
        A successor contract defining u against the ACTUAL sample range rather
        than against D (removing about half the measured R(u) excess), and a driver
        that reports STAT-KS-DICK as the signed pair rather than as their maximum
        (removing the non-directionality that makes two of the nine
        non-rejections uninterpretable). Both already ranked; both endorsed.

  # =====================================================================
  # COUNTEREXAMPLE / MUTATION
  # =====================================================================
  counterexample_or_mutation:
    the_cheapest_discriminating_mutation: >-
      CHANGE THE CURVE, KEEP EVERYTHING ELSE. One further execution of the frozen
      driver at generate_instance(<new seed>, 16) is enough to make the bits-16
      u = 2 question decidable in principle, and twenty are enough to make it
      decidable in practice AND to measure the noise scale the whole design
      presumes. Nothing else in the package - not more replicates of the uniform
      arm, not more statistics, not a finer gamma ladder - addresses either
      question, because both are questions about the REAL arm's variability and
      the real arm was drawn once.
    the_mutation_that_would_break_the_favourable_reading: >-
      If the between-instance sd at bits 16 u = 2 comes out at, say, 3x the iid
      null sd, then EVERY comparison in this package was made against a band about
      three times too narrow, the observed -2.244 becomes -0.75, the reject
      evaporates, AND SO DOES ALL NINE NON-REJECTIONS' EVIDENTIAL CONTENT, because
      a band three times too narrow is a band that a genuinely deviant real arm
      would also have passed with high probability at u = 4 and u = 5. That is the
      concrete route by which the favourable reading is falsified WITHOUT any new
      mathematics.
    the_mutation_that_would_break_the_unfavourable_reading: >-
      If the between-instance sd matches the iid null sd and the bits-16 u = 2
      offset does not reproduce across 20 instances, the single reject is settled
      as sampling noise and the detection-floor table stands as written.
    counterfactual_stated_as_the_handoff_requires:
      had_the_result_gone_the_other_way: >-
        HAD L-3'S CONDITION BEEN MET - the same certifying statistic outside its
        band at BOTH cells in the SAME direction - I would have attacked the
        departure with the SAME instruments and, I believe, with more force. I
        would have demanded: (i) that the direction be read ONLY from STAT-RATE-u
        and never from STAT-KS-DICK (OPEN-RR052-D); (ii) that the deviation
        certificate's independent re-verification cover more than a 1000-sample
        subsample per cell, since a 2-in-130816-scale claim rests on the
        factorization of the specific samples that moved the count; (iii) that the
        departure be checked against the SAME instance-variance objection
        (OBJ-RT082-1) - a both-cells departure at one seed shared by both cells is
        one instance-level accident away from nothing, because the two cells share
        generate_instance(2301, .); (iv) that the departure's magnitude be
        compared with the RT049-B6 small-x window confound before any word about
        the Semaev map was written; and (v) that `reject_scoped` and any word of
        impossibility be blocked outright. My objection list would have been
        LONGER, not shorter. That symmetry is the point of stating it.

  # =====================================================================
  # BASELINE COMPARISON, dominated_by, sota_delta
  # =====================================================================
  baseline_comparison:
    what_this_run_computes: 'No discrete logarithm. No relation. No search. It factors 523,264 integers in 18.0 s and reports order statistics.'
    pollard_rho_at_the_tested_cells: >-
      At p = 46663 and p = 767551 the matched generic baseline is about
      0.886*sqrt(N) group operations - of order 2**7.6 and 2**9.6 - i.e. a few
      hundred to about a thousand group operations, with negligible memory. Any
      index-calculus path at these sizes is worse by orders of magnitude and none
      is claimed here.
    bsgs: 'About 2*sqrt(N) operations with sqrt(N) memory - of order 430 and 1750 operations. Also uncontested and unclaimed.'
    closest_specialized_baseline: >-
      For the HEURISTIC-VALIDATION artifact class the closest specialized baseline
      is Wesolowski 2026 section 4.2
      (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md): the analogous smoothness
      heuristic validated at p = 5*2**248 - 1 with 100,000 samples and
      p = 27*2**500 - 1 with 10,000 samples, reached by the Deuring correspondence
      as a sampling oracle, with an empirical-CDF comparison against Dickman and
      explicit tail-consistency checks on the extreme samples. THE ARCHITECTURAL
      DIFFERENCE MATTERS MORE THAN THE SCALE - the exemplar reaches its scale by a
      CORRESPONDENCE that turns an infeasible direct computation into a feasible
      sampling problem. This lane has no such correspondence and has not looked for
      one; finding one, not running more toy cells, is what would move it.
    dominated_by: >-
      DOMINATED ON EVERY AXIS THAT MATTERS FOR THE HEURISTIC-VALIDATION CLASS BY
      Wesolowski 2026 section 4.2, AND ON EVERY AXIS THAT MATTERS FOR ECDLP BY
      POLLARD RHO AND BSGS AT THESE PARAMETER SIZES. Checked row by row across
      time, memory and data/queries: (time) this run 18.0 s to produce ten order
      statistics versus rho's few hundred group operations to actually solve the
      instance - rho dominates because this run solves nothing; (memory) 0.165 GB
      peak here versus negligible for rho - rho dominates; (data/queries) 130816
      exhaustive half-tuples per cell here versus 100,000 sampled instances at
      p ~ 2**248 in the exemplar - the exemplar dominates on the axis that
      matters, PARAMETER SIZE AT WHICH THE HEURISTIC IS VALIDATED. THIS FIELD IS
      NOT NULL AND WAS NOT SET BY DEFAULT.
    sota_delta: >-
      QUANTITATIVE. (1) Heuristic-validation scale, security parameter: p = 46663
      and 767551, i.e. log2 p = 15.51 and 19.55, against the exemplar's log2 p =
      250.3 and 504.8 - A DEFICIT OF ABOUT 235 AND 485 BITS. (2)
      Heuristic-validation scale, size of the integer whose smoothness is measured:
      log2 X = 31.02 and 39.10 here (X = p**2) against about 83.1 and 167.9 in the
      exemplar (X = (p/2)**(1/3)) - a deficit of about 52 and 129 bits, a factor of
      2.7 to 4.3 in log2. (3) Sample count: 130816 exhaustive per cell against
      100,000 sampled at NIST-I size and 10,000 at NIST-V - comparable in count,
      incomparable in size, and the exemplar's samples are independent draws while
      these are one exhaustive deterministic set per cell. (4) ECDLP cost: NO
      DELTA. This run makes no cost claim, harvests no
      relation and computes no logarithm, so its sota_delta against rho is exactly
      zero improvement and it should never be described otherwise. (4) Against the
      campaign's own prior state the delta is real but non-numeric: from "the
      direct smoothness measurement of HEUR-DS-1 remains UNPERFORMED across
      twenty-four batches" to one performed, verified, toy-scale measurement with a
      quantified detection floor.

  # =====================================================================
  # HEURISTIC CHALLENGES (exemplar-profile duties 1-3, 5)
  # =====================================================================
  heuristic_challenges:
    - id: HC-1
      duty: 'Heuristic inventory (C3).'
      finding: >-
        HEUR-DS-1 IS NUMBERED, STANDALONE AND QUOTED VERBATIM in the specification,
        the hypothesis record and the reading rule, with its uniformity implicit in
        "for B-smoothness purposes ... within a constant factor". CREDITED. Its
        quantifier range is however LOOSE by exemplar standards: it names no
        u-range analogous to the exemplar's (log p)**eps < u < (log p)**(1-eps),
        and this run's own sweep u in [2,6] is a design choice with no stated
        relation to the range in which the heuristic is asserted. V4 records the
        gap on the uncertified side but the heuristic statement itself should carry
        the range.
    - id: HC-2
      duty: 'Random-model transfer (C4) - does the justification apply to the object at hand?'
      finding: >-
        THE JUSTIFICATION AS RECORDED IS "Canfield-Erdos-Pomerance /
        Dickman-de Bruijn govern integer smoothness; the heuristic transfers that
        law to Semaev intermediate ideals over F_p IN THE ABSENCE OF A PROVEN
        CORRESPONDENCE" (H-DS-001). THAT IS AN ADMISSION, NOT A JUSTIFICATION. The
        exemplar's Heuristic 1 is justified by COMPOSITION - a rigorous size bound
        (Aubry-Oyono-Vincent, degree <= (p/2)**(1/3)) times a classical
        distribution theorem (CEP). HEUR-DS-1 HAS THE DISTRIBUTION THEOREM AND NO
        RIGOROUS SIZE BOUND ON THE OBJECT: nothing in the campaign proves the
        intermediate's size distribution, and ENC-B supplies a range by fiat rather
        than a bound by theorem. THIS IS THE STRUCTURAL WEAKNESS OF THE WHOLE LANE
        AND IT IS NOT REPAIRED BY ANY AMOUNT OF SAMPLING.
      the_cheapest_computation_that_would_expose_a_systematic_deviation: >-
        RT082-CTRL-1's free rider - the 512 per-index smooth rates - plus
        RT082-CTRL-3, the second encoding. A structured quantity is not a uniformly
        random integer, and the two cheapest places for the structure to show
        itself here are (a) a nonzero first-order projection onto the factor-base
        index, and (b) encoding dependence. Both are one extra array on a run that
        already takes 18 seconds.
    - id: HC-3
      duty: 'Scale honesty (C12, C17; AGENTS rule 7).'
      finding: >-
        THE PACKAGE IS SCRUPULOUS HERE AND I COULD NOT BREAK IT. Claim tier toy is
        stated in the specification, the hypothesis, the reading rule, the run
        manifest and every results file; interpretation: NONE is emitted
        machine-readably in all four results JSONs; V6 states the transfer gap in
        the strongest available terms. CREDITED WITHOUT QUALIFICATION. The residual
        duty falls on EV-LPF-001 and DEC-20260801-014, which have not been written
        yet and where the tier is most likely to slip.
    - id: HC-4
      duty: 'Cost bookkeeping (per-attempt cost x inverse success probability).'
      finding: >-
        NOT APPLICABLE AND CORRECTLY SO - this run charges no cost and asserts no
        success probability. RECORDED AS A STANDING DUTY FOR THE LANE: if a future
        record ever converts a measured p_hat(u) into an attempt count, the
        conversion must be total expected cost = per-attempt cost x P0**-1 with P0
        derived under the named heuristic, never per-attempt cost alone, and the
        detection-floor table above bounds how precisely p_hat(u) is actually known
        at these cells (+-1.7 percent at u = 2 rising to +-39 percent at u = 5).
    - id: HC-5
      duty: 'Is the heuristic being rejected merely for being conditional?'
      finding: 'NO. I explicitly do not object to HEUR-DS-1 being a heuristic, nor to a future theorem being conditional on it. My objections are to the inference from this run to its status, in both directions.'

  # =====================================================================
  # COST MODEL CHALLENGES
  # =====================================================================
  cost_model_challenges:
    - id: CMC-1
      finding: >-
        NO COST MODEL IS ASSERTED BY THIS RUN, SO THERE IS NOTHING TO RECOMPUTE.
        The relevant hidden-overhead challenge is prospective and is recorded so it
        is not lost: H-DS-001's asymptotic_claim already discloses that its o(1)
        hides Dickman u**-u factors, Groebner poly(D) factors and hash constants,
        and that NONE are proved negligible at crypto size. This run reduces the
        uncertainty on exactly one of those three, at D = 2**32 and 2**40, to a
        precision of +-1.7 percent at u = 2 and +-39 percent at u = 5, at one
        instance. That is the honest accounting of what was bought.
    - id: CMC-2
      finding: >-
        MEMORY AND TIME OF THE MEASUREMENT ITSELF ARE RECORDED AND MODEST - 18.0 s
        process wall clock, 11.6 s driver-internal, 0.165 GB peak RSS against an
        8 GB budget, 1 run of a maximum of 1. No budget event, no timeout, no
        resource stop. There is no route by which an infrastructure fact in this
        package could be mistaken for a mathematical one, and I checked for one.
    - id: CMC-3
      finding: >-
        THE ELIMINATED-DIMENSION RULE (KN-LIT-7593) IS NOT ENGAGED - no invariance
        or precomputation is claimed to remove a search dimension here, because no
        search is run. Recorded so the absence is deliberate.

  # =====================================================================
  # REDUCTION AND SCOPE CHALLENGES
  # =====================================================================
  reduction_and_scope_challenges:
    - id: RSC-1
      title: 'NO REDUCTION IS INVOKED AND NONE MAY BE.'
      finding: >-
        The only reduction-shaped move available in this lane is
        "toy instance of HEUR-DS-1 -> HEUR-DS-1 -> H-DS-001's cost model", and
        BOTH ARROWS ARE BROKEN. The first is broken by V6 (208-460 bits) and by
        SCOPE-1/SCOPE-2 (no target randomisation, encoding not degree). The second
        is broken because H-DS-001's claim is about a CHARGED COST RATIO from a
        claw mechanism that no run in this campaign has exercised. H-LPF-001 says
        this itself: "THIS HYPOTHESIS IS THE TOY-SCALE INSTANCE OF HEUR-DS-1 AND
        NOT A PROXY FOR IT."
    - id: RSC-2
      title: 'AFFECTED-VERSUS-SAFE SCOPE.'
      finding: >-
        NO SCHEME IS AFFECTED AND NONE MAY BE NAMED. No deployed curve, no live
        key, no parameter set is touched. Any affected-scheme sentence anywhere
        downstream of this run is scope inflation and is forbidden by the
        specification's own claim_ceiling.
    - id: RSC-3
      title: 'CLOSURE DISCIPLINE - APPLIED TO THIS BATCH AND TO THE CAMPAIGN.'
      finding: >-
        NOTHING IN THIS PACKAGE CLOSES ANYTHING, AND NOTHING IN IT LICENSES A
        CLOSURE. Under docs/inventor-protocol.md section 4 a closure needs a named
        obstruction, an argument and forward guidance. This run supplies an
        instrument and a floor, not an obstruction. SYMMETRICALLY, I record that
        the campaign's standing saturation conclusions about the classical ECDLP
        space remain `unverified` fatigue reports until KN-OPEN-019's enumeration
        and argument exist, and that this batch neither strengthens nor weakens
        them. A batch that measures one heuristic at toy scale is not evidence
        about whether the search space is mined.

  # =====================================================================
