      frozen_plantz_manifest_sha256: "c8812fb42bfc567259dbda36b5727ff19b466c093b8d57983d9a2b58409ab7a4, measured on the worktree file and on `git show HEAD:<path>` - byte-unedited and equal to the digest the TASK-20260801-064 snapshot receipt binds"
