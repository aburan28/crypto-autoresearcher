        TRUE of every flag and of --update-baseline, and FALSE of a hand edit to
        the baseline file - which is equally true of the duplicate-ID check, the
        missing-artifact check, and every other force=True error the tool has
        ever emitted. Filed as DEFECT-3, pre-existing, out of scope for this
        commit, and NOT a reason to REVISE it.

  - check: 4
    name: duplicate_run_id_check_unweakened
    result: PASS_ON_THE_PROPERTY_FAIL_ON_THE_STATED_MECHANISM
    method: execution
    property_holds: true
    executed_proof: >-
      A full exploit was constructed in a sandbox tree - a second run directory
      experiments/EXP-LPF-001/runs/RUN-LPF-001-plantzv2/ carrying a manifest.yaml
      that declares run id RUN-LPF-001-plantz with all five companion artifacts
      present, registered through a superseding_path spelled
      `experiments/EXP-LPF-001/runs//RUN-LPF-001-plantzv2/manifest.yaml`. The
      loader ACCEPTED that entry (the '//' spelling does not match the
      not-globbable regex) and routing followed it. The duplicate-ID check then
      fired anyway - `duplicate ID RUN-LPF-001-plantz` at force=True - and the
      run count went 1169 -> 1170. The exploit is loud, not silent.
    stated_mechanism_is_wrong: >-
      The commit message says the loader's refusal of a globbable
      superseding_path "is what keeps the force=True duplicate-ID check intact".
      That is not what keeps it intact. Ctx.register()'s own duplicate detection
      keeps it intact. The loader rule is a defence-in-depth layer, and it is
      bypassable (DEFECT-1). The distinction matters because a future reader who
      believes the loader rule is load-bearing may weaken the backstop.
    same_run_id_on_both_sides:
      demonstrated: true
      observed: >-
        Renaming the superseding record's run.id to RUN-LPF-001-imposter with the
        digest re-pinned produced `registered superseding run manifest declares
        run id 'RUN-LPF-001-imposter', but the supersession registry entry is for
        'RUN-LPF-001-plantz'` at force=True. The symmetric side is checked too:
        the entry's run_id is compared against BOTH files.
      note: >-
        On mismatch the routed record is still registered under whatever id it
        declares, so ctx.ids briefly holds the imposter id. One loud
        unsuppressable error accompanies it; no reference resolution changed in
        this repository because no ledger/evidence record cites
        RUN-LPF-001-plantz today (verified by grep).
    registered_exactly_once: true

  - check: 5
