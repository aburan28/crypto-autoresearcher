  - check: 6
    name: error_set_diff_is_exactly_the_two_plantz_lines
    result: PASS
    method: execution
    measured: "1171 -> 1169; sorted-set diff is `365,366d364` - two deletions, zero insertions"
    counts_i_measured_match_the_claim: true
    side_effects_found: none
    interpretive_note: >-
      THIS DIFF IS ITSELF THE STRONGEST CONTROL IN THE REVIEW and deserves to be
      named as such. The adversarial worry about a supersession registry is that
