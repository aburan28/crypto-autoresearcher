  - check: 7
    name: tier_of_run_semantics
    result: PASS_ON_BEHAVIOUR
    semantics_ruling: ACCEPTED_AS_DOCUMENTED_WITH_A_NAMED_LIMIT
    method: execution
    measured_table:
      - {input: "[16, 20]", new: "0 toy", old: TypeError}
      - {input: "[16, 256]", new: "2 crypto", old: TypeError}
      - {input: "[256, 16]", new: "2 crypto", old: TypeError}
      - {input: "32", new: "0 toy", old: "0 toy"}
      - {input: "33", new: "1 medium", old: "1 medium"}
      - {input: "96", new: "1 medium", old: "1 medium"}
      - {input: "97", new: "2 crypto", old: "2 crypto"}
      - {input: "256", new: "2 crypto", old: "2 crypto"}
      - {input: "absent", new: "None", old: "None"}
      - {input: "None", new: "None", old: "None"}
      - {input: "[] empty", new: "None", old: "None"}
      - {input: "'20' string", new: "0 toy", old: "0 toy"}
      - {input: "'abc'", new: "None", old: ValueError}
      - {input: "True", new: "None", old: "0 toy"}
      - {input: "[16, True]", new: "None", old: TypeError}
      - {input: "[16, None]", new: "None", old: TypeError}
      - {input: "[16, 'abc']", new: "None", old: TypeError}
      - {input: "[16, 20.9]", new: "0 toy", old: TypeError}
      - {input: "{'a': 1} dict", new: "None", old: TypeError}
      - {input: "[[16],[256]] nested", new: "None", old: TypeError}
      - {input: "{16,256} set", new: "2 crypto", old: TypeError}
      - {input: "field_bit_size 256", new: "2 crypto", old: "2 crypto"}
      - {input: "field_bits 0 + field_bit_size 256", new: "2 crypto", old: "2 crypto"}
    required_assertions:
      "[16, 256] yields crypto": CONFIRMED
      "[16, 20] yields toy": CONFIRMED
      "absent/empty/non-numeric returns None rather than crashing": CONFIRMED
      "no TypeError on any input tried": CONFIRMED
    is_largest_cell_the_right_semantics_for_a_ceiling:
      ruling: >-
        YES, MAX IS THE CORRECT CHOICE, and it is the only one that does not
        generate false errors. The value is consumed at one site: an evidence
        record's declared claim_tier is rejected when `declared >
        max(run_tiers)`. It is an UPPER BOUND on what the cited runs can support.
        A run that swept a 16-bit and a 256-bit cell did reach 256 bits, so a
        crypto-tier claim about the large cell is bounded correctly by max;
        taking min or first would cap a genuinely crypto-scale sweep at toy
        merely because it also carried a toy calibration cell, producing a false
        error and pressuring authors to strip calibration cells from manifests.
        Note also that the outer composition is already `max` across the runs a
        record cites, so `max` within a run is the consistent operator.
      named_limit_that_must_be_on_the_record: >-
        `field_bits` is a DECLARED parameter list, not an executed-cell list. The
        validator does not and cannot check that the largest cell was actually
        run to completion, so a single large cell added to a sweep declaration
        raises the ceiling for the whole evidence record. This is a coarse guard
        against the AGENTS rule 7 failure (toy evidence presented as
        crypto-scale); it is not a defence against it. The defence remains
        reviewer judgement on the run's actual result block. Max is still right -
        the alternative trades a real false-positive rate for an unreliable
        partial defence - but the limit should not be quietly inherited.
      effect_on_the_records_at_hand: >-
        NONE. Both EXP-LPF-001 manifests declare field_bits [16, 20] and
        claim_tier toy; max gives toy; no ceiling error exists before or after.
        The fix is latent here, which is why it never fired.
    behaviour_change_worth_flagging: "See DEFECT-4."

attacks_attempted:

  - id: ATK-1
    attack: "Make a registry entry stop requiring the run's companion artifacts in the run directory"
    method: >-
      Moved manifest_v2.yaml out of the run directory to
      experiments/EXP-LPF-001/supersessions/, populated the NEW directory with
      all five companion artifacts, and DELETED all five from the original run
      directory; repointed the registry.
    succeeded: false
    observed: >-
      Five errors, `run directory missing artifact 'command.txt'` ...
      'stdout.log'. run_dir is captured from the DISCOVERED path before routing,
      so artifacts are demanded beside the original manifest no matter where the
      superseding record is filed. A weaker version - deleting stdout.log and
      raw-result.json in place - also errored.
    cosmetic_note: >-
      The error line is attributed to the superseding path while the directory
      checked is the original run dir. Confusing to read, harmless.

  - id: ATK-2
    attack: "Let a defect INSIDE a superseding record escape reporting"
    method: "Removed run.status and run.code.command from manifest_v2.yaml, re-pinned the registry digest."
    succeeded: false
    observed: "`run missing required field 'status'` and `run.code.command missing (not reproducible)` both reported against manifest_v2.yaml. The full run schema is applied to the routed record."

  - id: ATK-3
    attack: "Make the run silently vanish from the ledger by removing the superseding file"
    method: "Deleted manifest_v2.yaml."
    succeeded: false
    observed: >-
      FOUR errors - the sweep's `registered superseding run manifest is missing;
      a supersession requires both records to be present`, check_run's
      `registered superseding run manifest is missing; validating the superseded
      record in place`, and the superseded record's own two original defects
      reappearing. The run is still validated and still registered. This is the
      correct fail-loud-and-fall-back direction. The same behaviour occurs when
      the superseding path is a DIRECTORY rather than a file.

  - id: ATK-4
    attack: "Make routing depend on a check that can be skipped"
    method: "Searched for any flag that disables the sweep; ran with --no-baseline and --update-baseline; deleted the registry."
    succeeded: false
    observed: >-
      check_run_supersessions() is called unconditionally in main() before the
      run glob, with no flag guarding it. The only way to 'skip' routing is to
      delete the registry, which restores the pre-change behaviour exactly -
      i.e. the suppressed errors come BACK. There is no skip that suppresses.

  - id: ATK-5
    attack: "Change behaviour for a run WITHOUT a registry entry"
    method: "Ran the NEW tool on the SAME tree with the registry file deleted and diffed against the OLD tool's output."
    succeeded: false
    observed: "Sorted error sets byte-identical (1171 = 1171, empty diff); stdout byte-identical. This is a proof over every globbed run manifest in the repository, not an assertion."

  - id: ATK-6
    attack: "Bypass the loader rule that a superseding_path must not be discoverable by the run glob"
    method: "Spelled the path `experiments/EXP-LPF-001/runs//RUN-.../manifest.yaml` and `experiments/EXP-LPF-001/runs/./RUN-.../manifest.yaml`."
    succeeded: true
    consequence: >-
      PARTIAL - the loader rule is bypassed, the backstop is not. See DEFECT-1
      and check 4. The duplicate-ID error fires and the abuse raises the error
      count rather than lowering it.

  - id: ATK-7
    attack: "Absorb a supersession hash-mismatch error into the baseline"
    method: "(a) --update-baseline on a drifted tree; (b) hand-append the exact error line to tools/validate_ledger_baseline.txt."
    succeeded: "(a) no; (b) yes"
    consequence: "See DEFECT-3. Pre-existing property of the baseline for every error line in the tool, not introduced here."

  - id: ATK-8
    attack: "Point the registry at an unrelated but complete existing manifest to launder the defect"
    method: "Renamed the superseding record's run.id and re-pinned; also constructed the double-slash route to a different run directory."
    succeeded: false
    observed: "Two-sided run-id equality check errors at force=True in the first case; duplicate-ID error in the second."

  - id: ATK-9
    attack: "Slip a divergent value through YAML duplicate mapping keys in a registry record"
    method: "Duplicated superseded_sha256 within one record."
    succeeded: "partially - PyYAML applies last-wins silently"
    consequence: >-
      The loader does not detect duplicate mapping keys inside a record, so a
      human auditor reading the registry could see a different digest from the
      one enforced. In the specific probe the last value parsed falsy and the
      record was refused, but that is luck, not a rule. Low severity for an
      artifact whose whole purpose is auditability; filed as DEFECT-5. Note the
      analogous duplicate at the RECORD level (two entries for one superseded
      path) IS caught explicitly.

  - id: ATK-10
    attack: "Chain supersessions or induce a routing loop"
    method: "Reasoned from the two loader regexes and confirmed routing is one-shot on the discovered path."
    succeeded: false
    observed: >-
      A superseded_path must match the glob shape and a superseding_path must
      not, so an entry's target cannot be another entry's source; and check_run
      consults the registry once, on the discovered path only, so even the
      double-slash bypass cannot produce transitive routing.
    method_caveat: "This one is reading plus a targeted probe, not an end-to-end executed chain."

strongest_abuse_route:
  question: >-
    Could this mechanism be used to make a real defect disappear rather than to
    record a real repair?
  answer: >-
    IN ONE SENSE YES, AND IT SHOULD BE SAID PLAINLY. Routing sends the ENTIRE
    run-schema check to the superseding record, and the tool never compares any
    field the superseding record restates against the corresponding field of the
    frozen record. It pins both files by digest; it does not compare their
    content. So a superseding record that quietly DROPS or ALTERS material the
    frozen record carried is accepted by the gate, and the divergence is not
    reported.
  is_it_instantiated_here: >-
    YES, MILDLY, AND I CHECKED RATHER THAN ASSUMED. Diffing the two records key
    by key: v2's `inputs.parameters` is NOT equal to the frozen `parameters`
    block - five keys present in the frozen record are absent from v2
    (plant_bases, plant_stream_index_formula, randomness_sources,
    stream_offsets_used, stream_seed_formula) and five keys are present in v2
    that the frozen record does not carry (X_equals_p_squared_by_bits,
    bsm_u4_by_bits, bsm_u6_by_bits, p_by_bits, wall_clock_seconds_argument). v2's
    `timing` drops peak_rss_gb_independent_measurement_source; its
    `authorization` drops scope_quoted_verbatim and
    receipt_commit_is_ancestor_of_run_commit. NO SHARED KEY'S VALUE DIFFERS -
    every parameter present in both holds the same value, including field_bits -
    so nothing is contradicted; but the registry's `notes` ("restates nothing
    else") and v2's own `what_is_not_added` ("NOTHING ELSE ... added or removed")
    are broader than what the files support.
  why_it_is_nevertheless_bounded:
    - >-
      The frozen record stays present and byte-pinned, so the original is
      permanently auditable and the divergence is one `diff` away. Nothing is
      destroyed.
    - >-
      The before/after error-set diff exposes exactly which validator-visible
      errors a registry entry suppresses. Here it is two lines, and both are the
      omissions the repair was written to supply. A defect the validator CAN see
      cannot be hidden without showing up in that diff.
    - >-
      manifest_v2.yaml was added at 8a1fe5f20, one commit BEFORE the tool change,
      so its content is not this commit's work. The content review belongs to the
      record reviewer, not to this gate review.
  what_the_implementation_does_block: >-
    Byte-level drift in either file (both directions, demonstrated), a
    superseding record that is itself defective (demonstrated), a superseding
    record belonging to a different run (demonstrated), a superseding record that
    would double-register the run id (demonstrated, via the backstop), relaxation
    of the companion-artifact requirement (demonstrated), and any change at all to
    a run without a registry entry (demonstrated).
  what_it_does_not_block: >-
    Content divergence BETWEEN the two records, including silent omission of
    material the frozen record carried. That gap is inherent to any supersession
    short of a field-level diff engine, and it is not a regression - before the
    change the frozen record's content was checked and the repair was
    unrepresentable at all.

defects:

  - id: DEFECT-1
    severity: medium
    blocking: false
    title: "The not-globbable rule on superseding_path is bypassable by non-normalised path spellings"
    detail: >-
      RUN_MANIFEST_PATH is matched against the raw string, but the key is built
      with os.path.abspath(), which normalises. `experiments/E/runs//R/
      manifest.yaml` and `experiments/E/runs/./R/manifest.yaml` both fail the
      regex and both resolve to a path the run glob DOES discover. Demonstrated
      end to end (ATK-6).
    why_it_is_not_blocking: >-
      The property the rule protects is preserved by Ctx.register()'s
      duplicate-ID check at force=True, which I fired in the sandbox; the abuse
      RAISES the error count. The committed registry uses a clean path, and any
      new entry arrives in a reviewable commit diff.
    exact_repair_for_a_future_task: >-
      Normalise before matching: reject any declared path where
      os.path.normpath(rel) != rel, and run both regex tests against the
      normalised string. One condition, in load_run_supersessions(), plus two
      tests. Do NOT weaken the register() backstop on the strength of it.

  - id: DEFECT-2
    severity: low_medium
    blocking: false
    owner: "record reviewer, not this tool change"
    title: "The registry entry's prose and manifest_v2's what_is_not_added overstate the additivity of the superseding record"
    detail: "See strongest_abuse_route.is_it_instantiated_here for the measured key-level diff."
    recommended_disposition: >-
      Either narrow the wording in a superseding registry entry / a further
      manifest revision, or record the five dropped and five added
      inputs.parameters keys explicitly under
      `fields_not_restated_here`. NOT a tools/ change and NOT a reason to hold
      this gate.

  - id: DEFECT-3
    severity: low
    blocking: false
    pre_existing: true
    title: "A hand-added line to validate_ledger_baseline.txt suppresses any error, including a supersession hash mismatch"
    detail: >-
      force=True defeats the legacy-warning downgrade only. --update-baseline is
      genuinely prune-only (verified: 1143 lines in, 1138 written, mismatch line
      not added), and the baseline header states lines may only ever be removed -
      but nothing enforces that mechanically. The `--update-baseline` bootstrap
      branch would also absorb everything if the baseline file were deleted first.
    recommended_disposition: >-
      A separate task adding a monotonicity check (assert the committed baseline
      is a subset of the previous commit's baseline) would close it for the whole
      tool. Out of scope here; this commit neither created nor widened it.

  - id: DEFECT-4
    severity: low
    blocking: false
    title: "tier_of_run now returns None (no ceiling) instead of raising on unparseable field_bits, and emits no error line"
    detail: >-
      'abc' went ValueError -> None; True went toy -> None. None means the
      ceiling is not enforced for that run, which is the permissive direction,
      and no error is emitted to tell anyone the parameter was unreadable.
    why_it_is_acceptable: >-
      The alternative is the status quo ante, in which a malformed field_bits
      ABORTS the entire validation with a traceback - strictly worse. None also
      matches the long-standing behaviour for an absent field_bits.
    recommended_disposition: >-
      Optional follow-up: emit a non-fatal error line when field_bits is present
      but unparseable, so 'tier unknown' is visible rather than silent.

  - id: DEFECT-5
    severity: informational
    blocking: false
    title: "The loader does not detect duplicate mapping keys inside a registry record"
    detail: "PyYAML applies last-wins silently, so the enforced digest can differ from the one an auditor's eye lands on. Duplicate ENTRIES for one superseded path are caught explicitly; duplicate KEYS within one entry are not."

  - id: DEFECT-6
    severity: informational
    blocking: false
    title: "Two asymmetries in the fallback behaviour"
    detail: >-
      (a) If the SUPERSEDING file is missing, check_run falls back and the run is
      still validated and registered. If the SUPERSEDED file is deleted, the glob
      never discovers it, check_run is never called, and the run leaves ctx.ids
      entirely on the strength of one sweep error. (b) If the superseding file
      exists but is unparseable YAML, check_run returns early and does NOT fall
      back to the superseded record, unlike the missing-file case. Both produce
      loud force=True errors, so neither is silent; the inconsistency is worth
      knowing about before the registry has more than one entry.

  - id: DEFECT-7
    severity: informational
    blocking: false
    title: "The commit message misattributes the mechanism that preserves the duplicate-ID check"
    detail: "See check 4. The loader rule is defence in depth; register() is the backstop. Correcting the record matters so a future change does not trade the backstop for the bypassable rule."

what_this_pass_does_not_certify:
  - >-
    NOTHING ABOUT SMOOTHNESS. This review is about a validator. It says nothing,
    in either direction, about H-LPF-001, HEUR-DS-1, the Semaev map, the
    least-prime-factor distribution, or any measurement BATCH-027 intends to
    take.
  - >-
    NOTHING ABOUT THE CONTENT OF manifest_v2.yaml. I verified its digest, that it
    satisfies the run schema, that it declares the same run id, and that no value
    it shares with the frozen record differs. I did NOT verify that its
    `environment`, `inputs` and `resources` blocks accurately describe the
    execution that happened; that is the record reviewer's job and DEFECT-2 is
    addressed to it.
  - >-
    NOTHING ABOUT THE 1169 RESIDUAL ERRORS. They are pre-existing branch state.
    This review certifies only that the count moved by exactly the two intended
    lines.
  - >-
    NOTHING ABOUT THE TWO PRE-EXISTING tools/test_validate_ledger.py FAILURES,
    beyond that they are identical at both commits and therefore not caused here.
  - >-
    NO MODEL-LEVEL INDEPENDENCE. Same backend as the author; the mitigation is
    execution, not a second opinion.
  - >-
    NO CLAIM THAT THE SUPERSESSION MECHANISM IS SAFE AT SCALE. It is exercised by
    exactly ONE registry entry today. DEFECT-1, DEFECT-5 and DEFECT-6 all become
    more consequential as entries accumulate, and each new entry should get the
    before/after error-set diff treatment of check 6.

