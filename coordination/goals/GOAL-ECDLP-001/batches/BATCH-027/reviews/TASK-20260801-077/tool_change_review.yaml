    name: registry_format_and_malformed_refusal
    result: PASS
    method: execution
    what_was_run: >-
      load_run_supersessions() imported directly from the 864e0cf0a tree and
      driven with 34 hand-built registry files, plus a whole-tool run against a
      schema-corrupted committed registry.
    refused_as_required:
      - "wrong schema value -> ValueError: invalid run supersession registry schema"
      - "no schema key -> ValueError (same)"
      - "top-level document is a list -> ValueError (same)"
      - "empty file -> ValueError (same)"
      - "records is a mapping not a list -> ValueError: records must be a list"
      - "record is a scalar not a mapping -> ValueError: record 0 must be a mapping"
      - "run_id null / blank / whitespace -> ValueError: missing required field 'run_id'"
      - "defect removed -> ValueError: missing required field 'defect'"
      - "registered removed / false / 0 -> ValueError: missing required field 'registered'"
      - "63-hex digest -> ValueError: must be 64 hex characters"
      - "non-hex leading character -> ValueError: must be 64 hex characters"
      - "absolute superseded_path (/experiments/...) -> ValueError: must be repository-relative without '..'"
      - "'..' component in superseding_path -> ValueError: must be repository-relative without '..'"
      - "'X/../Y' rejoin trick -> ValueError: must be repository-relative without '..'"
      - "superseded_path that could never be globbed (manifest_old.yaml) -> ValueError"
      - "superseded_path with './' prefix -> ValueError (fails the glob-shape rule)"
      - "superseding_path that WOULD be globbed (runs/X/manifest.yaml) -> ValueError"
      - "duplicate superseded_path in two records -> ValueError: lists ... more than once"
      - "trailing space inside a quoted globbable superseding_path -> ValueError (strip() then match)"
    accepted_and_correctly_so:
      - "uppercase digest: lowercased before the 64-hex match, then compared against hexdigest(); harmless normalisation, not a hole"
      - "'..x' as a path component: '..' in relative.split('/') is an exact-component test, and '..x' is an ordinary directory name that cannot escape the repo"
      - "records: [] and records: null -> {} (empty registry), correctly not fatal"
    malformed_registry_refuses_to_run:
      demonstrated: true
      observed: >-
        With the committed registry's schema string corrupted, the tool printed
        `FAIL: cannot load run supersession registry: invalid run supersession
        registry schema` to stderr, exited 1, and produced ZERO lines of stdout
        - no partial validation, no half-applied routing.
    registry_entry_truthfulness:
      superseded_sha256_recorded: c8812fb42bfc567259dbda36b5727ff19b466c093b8d57983d9a2b58409ab7a4
      superseded_sha256_measured: c8812fb42bfc567259dbda36b5727ff19b466c093b8d57983d9a2b58409ab7a4
      superseding_sha256_recorded: 0831526becbad2337a12c223c05eeaff37952e9fd8e252ddde9991d30430c2ba
