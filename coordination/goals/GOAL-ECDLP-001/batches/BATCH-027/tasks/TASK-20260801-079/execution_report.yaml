  anomalies:
    - id: ANOM-079-1
      kind: unexpected_observation
      text: >-
        LPF_limb_b_decidable_flag came out FALSE at bits 20, u_target = 6, where
        the archived 200-replicate decidability map records TRUE. The run-time
        flag uses ONE fresh uniform replicate, whose R(u) here is
        8.043358425482902, marginally above the frozen upper edge 8.0, against
        an archived 200-replicate mean of 5.0386. RR-LPF-2 declared this
        possibility in advance - its measured 200-replicate range at that rung
        is 1.53 to 8.81, straddling 8, and it states that the u = 6 flag may
        come out either way and no branch reads it. Both non-decidable rungs are
        unpowered and carry a struck statistic. RECORDED, NOT INTERPRETED.
    - id: ANOM-079-2
      kind: unexpected_observation
      text: >-
        The single certifying reject is by FOUR SAMPLES out of 130816 - observed
        smooth count 46598 against a lower band edge corresponding to exactly
        46602 - a p_hat shortfall of 3.06e-05, sitting 0.024 measured null
        standard deviations outside the nearer edge. The frozen band's own
        per-comparison false-fire probability is 4/201 = 0.0199 and ten
        certifying comparisons were made. RECORDED WITH ITS MAGNITUDE, NOT
        INTERPRETED.
    - id: ANOM-079-3
      kind: unexpected_observation
      text: >-
        At bits 16 u_target = 2 the frozen lower band edge coincides exactly
        with the minimum of the 200 measured LPF-CAL-A uniform replicates, the
        1st and 2nd ascending order statistics being tied at 0.3562408268101761.
        At that rung the THR-LPF-1 band is therefore not strictly interior to
        the measured null range below. RECORDED, NOT INTERPRETED.
    - id: ANOM-079-4
      kind: unexpected_observation
      text: >-
        At bits 16 u_target = 6 the real arm's R(u) is 12.94 and the fresh
        uniform arm's is 10.11, both outside the frozen band. The rung is
        unpowered, non-decidable and struck, so it reads no branch. Carries
        LIMBB-DECL-RR066, which records that about half the excess at the deep
        rungs is definitional.
    - id: ANOM-079-5
