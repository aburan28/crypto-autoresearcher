  protocol_deviations:
    - id: DEV-079-1
      kind: contract_internal_inconsistency_recorded_not_repaired
      text: >-
        The frozen handoff says the pilot budget gate runs first, but in the
        hash-bound driver run_pilot() is reachable only from run_calibration();
        the measurement path enters run_measurement() under
        Deadline(5400) with no pilot. The specification's own budget clause
        frames the pilot as a projection of THE FULL CALIBRATION COST, so the
        driver is consistent with the specification and the handoff sentence is
        broader than the frozen code. ATS-LPF-1 forbids editing the driver, and
        editing it is precisely the tuning route this design exists to close, so
        the driver was executed unmodified.
      mitigation: >-
        A pre-bulk projection was computed OUTSIDE the driver before the
        invocation, by linear extrapolation of the pilot factorization rates
        measured and archived in RUN-LPF-001-calib - 37.26 seconds MODELED
        against a 5400 second budget, abort false, against 18.0 seconds
        measured. Recorded in manifest timing.pre_bulk_projection_MODELED and
        labelled MODELED throughout. It touched no repository file.
      scope_effect: none
      amendment_requested: false
    - id: DEV-079-2
