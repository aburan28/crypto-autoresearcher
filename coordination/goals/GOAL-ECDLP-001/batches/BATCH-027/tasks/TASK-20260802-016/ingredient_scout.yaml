claim_ceiling: >-
  Pre-ID primary-literature and applicability screen only. No experiment ran,
  no canonical IDEA id was allocated, no ECDLP improvement was observed, and
  no research state moved.

scope:
  problem: >-
    Given public P,Q=[k]P in a prime-order subgroup G=<P> of order N on an
    ordinary elliptic curve E/F_p, recover k using public, target-independent
    preprocessing and fully charged classical computation.
  exact_campaign_object: >-
    The complete relation route is the six-list coloured zero-sum problem with
    B=N^(1/5), B verified independent factor-base rows, solved factor logs, and
    the identical scalar-blind masked-target descent. Direct scalar-return
    routes may bypass relations only if they output and verify k themselves.
  complete_cost_model: >-
    Charge public setup, theorem-object construction, every failed attempt,
    inverse success probability, exact source output, duplicate-normalized
    independent rank, factor-base logarithms, blind masked-target descent,
    output verification, peak memory, persistent data/advice, and communication.
  promotion_rectangle: >-
    A campaign candidate must instantiate complete time lambda<=0.45 and peak
    memory mu<=0.45. For B=N^(1/5), target-independent setup/state is at most
    B^(9/4), one fresh masked-target query is at most B^(5/4), and B verified
    independent rows plus 100 blind descents remain charged.
  matched_frontier:
    pollard_rho: {time: "N^(1/2+o(1))", memory: "N^o(1)", data_queries: "O(1)"}
    bsgs: {time: "N^(1/2+o(1))", memory: "N^(1/2+o(1))", data_queries: "O(1)"}
    shoup_boundary: >-
      Omega(sqrt(N)) group operations for constant-success classical generic
      DLP. It is model-scoped; a successor must identify and charge concrete
      encoding-specific information unavailable to the generic simulator.
    structured_generic_boundary: >-
      Corrigan-Gibbs, Henzinger, and Wu give
      Omega(min(sqrt(N),1/delta)) in their structured generic-group model. A
      proposed structure oracle must be mapped to that model and its exploitable
      fraction delta computed; this is not a universal impossibility theorem.

mechanism_frontier:
  completeness_note: >-
    The complete current canonical corpus and BATCH-026 review were read before
    scouting. This is the operation-level frontier recorded by BATCH-026 and
    the P1552 mechanism review, not a closed taxonomy; KN-OPEN-019 remains open.
  families:
    - family: generic_collision_orbit
      object: affine scalar labels carried by a group walk
      operation: group addition and collision
      obstruction: Shoup square-root boundary inside the generic model
    - family: relation_decomposition
      object: factor-base source tuples or their endpoint aggregate
      operation: summation, exact source unranking, relation elimination
      obstruction: density, source output, rank, factor logs, and descent all remain charged
    - family: scalar_orientation_return
      object: scalar power, character, cover sheet, period, or torsion orientation
      operation: separate, lift, invert, and return
      obstruction: missing nonlinear advice, order-N dictionary/DLP, or rho-scale return
    - family: source_preserving_transform
      object: source-labelled circuit, tensor, module, exterior row, path, or incidence deck
      operation: transform, contraction, detection, or factorization
      obstruction: deleting labels yields an aggregate; retaining them pays source construction
    - family: global_cover_correspondence
      object: point or relation image on a curve, cover, Jacobian, or Weil restriction
      operation: transport, decompose, and pull back
      obstruction: fixed degree is constant-factor; growing field/genus/state and exact return restore cost
    - family: public_augmented_invariant
      object: public jet, net, spectrum, incidence value, or predicate
      operation: deterministic public evaluation or update
      obstruction: simulator-visible absent quantified non-generic density and a source-valid use

