ingredients:
  - handle: B22-T01
    title: Cheon auxiliary-scalar-power inversion
    class: algorithm
    status: rejected_pre_id
    primary_source:
      citation: >-
        Jung Hee Cheon, Discrete Logarithm Problems with Auxiliary Inputs,
        Journal of Cryptology 23 (2010), 457-476.
      doi: "https://doi.org/10.1007/s00145-009-9047-0"
      author_copy: "https://www.math.snu.ac.kr/~jhcheon/publications/2010/StrongDH_JoC_Final2.pdf"
      exact_result: >-
        Theorem 1: for an abelian group G of prime order N generated by P,
        d|(N-1), and supplied P,Q=[k]P,Q_d=[k^d]P, k is recovered
        deterministically in O(sqrt((N-1)/d)+sqrt(d)) group exponentiations,
        using max(ceil(sqrt((N-1)/d)),ceil(sqrt(d))) group elements of storage.
        Theorem 2 treats d|(N+1) under ERH but requires [k^i]P for
        i=1,...,2d and costs O(sqrt((N+1)/d)+d) exponentiations.
      hypotheses:
        - G is abelian of known prime order N with generator P.
        - For Theorem 1, d is a positive divisor of N-1 and Q_d=[k^d]P is supplied.
        - For Theorem 2, d divides N+1, all 2d auxiliary powers are supplied, and ERH is assumed for deterministic setup.
    exact_ecdlp_object: "The nonlinear auxiliary point Q_d=[k^d]P in addition to standard P,Q=[k]P."
    explicit_operation: >-
      Embed the exponent manipulation in F_N^*, split the relevant coset by
      baby-step/giant-step, collide group exponentiations, and reconstruct k.
    why_information_flow_changes: >-
      Q_d is genuinely nonlinear in the hidden scalar and is unavailable from
      the affine scalar labels produced by ordinary generic group operations.
      If granted, it changes the problem rather than merely re-encoding Q.
    applicability_obligations:
      - Construct Q_d from only public E,F_p,P,Q without k, a CDH oracle, a pairing return, or scalar-labelled advice.
      - Prove construction correctness and success for generic ordinary prime-field inputs.
      - Charge the construction before invoking Cheon's theorem.
      - Preserve the ordinary ECDLP input model; secret-dependent auxiliary powers cannot be declared public preprocessing.
    applicability_verdict: fail_missing_nonlinear_auxiliary_input
    cost_transform:
      parameterization: "Let d=N^(theta+o(1)) divide N-1."
      theorem_setup: "factor N-1 enough to exhibit d; polynomial/logarithmic arithmetic once d is known"
      theorem_object_construction: >-
        Unspecified by the theorem and unavailable in the standard instance.
        Generic combinations of P and Q retain affine labels a+bk and cannot
        create k^d for d>1.
      per_attempt_time: "N^(max((1-theta)/2,theta/2)+o(1)) group exponentiations after Q_d is granted"
      per_attempt_success: "deterministic under Theorem 1 hypotheses"
      source_output: "k directly; no relation-source unranking"
      independent_rank: "not applicable to the direct scalar-return route"
      factor_logs: "not applicable"
      blind_descent: "not applicable"
      verification: "one scalar multiplication [k]P and comparison with Q"
      peak_memory: "N^(max((1-theta)/2,theta/2)+o(1)) group elements after Q_d is granted"
      data: "one secret-dependent nonlinear auxiliary group element for Theorem 1; 2d for Theorem 2"
      communication: "same auxiliary group elements if supplied externally"
      end_to_end: >-
        At theta=1/2 the granted-advice core is N^(1/4+o(1)) time and memory,
        but the standard-ECDLP construction term is absent, so no standard
        end-to-end exponent exists. Treating Q_d as free changes the problem.
    matched_boundaries:
      pollard_rho_shoup: >-
        The granted Q_d is extra structure outside strict generic DLP; Shoup
        does not contradict Cheon. Without Q_d, no sub-rho route is supplied.
      structured_generic: >-
        No delta-oracle mapping is given. The auxiliary point is target-specific
        nonlinear advice, not a public sparse point predicate.
    proof_decomposition:
      size_lemma: "Cheon bounds the two baby/giant tables once Q_d is supplied."
      runtime_lemma: "Theorem 1 supplies the stated exponentiation and storage bounds."
      correctness_lemma: "Cheon's collision reconstruction returns k under d|(N-1) and correct Q_d."
      success_lemma: "Deterministic for Theorem 1; the missing constructor has no success theorem."
      assembly_gap: "construction(P,Q -> Q_d) + Cheon core + verification cannot be assembled"
    controls:
      - Replace Q_d by a uniform random group element and require failure rather than a spurious scalar.
      - On toy groups, generate genuine Q_d only after freezing k and compare to the no-advice standard instance.
      - Charge any pairing, oracle, trusted setup, or auxiliary transcript used to manufacture Q_d.
    falsification_conditions:
      - The proposed Q_d constructor uses k, solves a DLP/CDH instance, or carries target-specific advice.
      - Construction plus Cheon core has time or memory exponent above 0.45.
      - The claimed auxiliary point fails exact equality Q_d=[k^d]P.
    semantic_dedup:
      nearest: [ECDLP-IDEA-003, ECDLP-IDEA-008]
      verdict: occupied_auxiliary_scalar_power_lane
      reason: >-
        The existing corpus already records partial algebraic correspondences
        and pairing-return routes whose missing operation is exactly Q_d construction.
    dominated_by: "Pollard rho on the standard ECDLP instance"
    sota_delta:
      supported_time_exponent_improvement: 0.0
      supported_memory_exponent_improvement: 0.0
      conditional_granted_advice_time_delta_at_theta_half: -0.25
      cryptographic_security_bits_reduced: 0
    named_obstruction: "nonlinear target-specific auxiliary point is not constructible from the standard input"
    forward_guidance: >-
      Reopen only for an explicit public ordinary-curve operation producing a
      certified nonlinear scalar power with complete construction below N^0.45.

  - handle: B22-T02
    title: Diem algebraic factor base over growing extension degree
    class: algorithm
    status: rejected_pre_id
    primary_source:
      citation: >-
        Claus Diem, On the discrete logarithm problem in elliptic curves,
        Compositio Mathematica 147 (2011), 75-104.
      doi: "https://doi.org/10.1112/S0010437X10005075"
      author_record: "https://www.math.uni-leipzig.de/~diem/preprints/dlp-ell-curves.pdf"
      exact_result: >-
        Main theorem: for every sequence of prime powers q_i and positive
        integers n_i with n_i tending to infinity and n_i/log(q_i) tending to
        zero, ECDLP on elliptic curves over F_(q_i^n_i) is solvable in expected
        time (q_i^n_i)^o(1). The construction uses a degree-two cover
        phi:E->P^1 over F_(q^n), the algebraic factor base
        {R in E(F_(q^n)): phi(R) in P^1(F_q)}, and multivariate decomposition.
      hypotheses:
        - The input fields form extension-field sequences F_(q_i^n_i).
        - n_i tends to infinity.
        - n_i/log(q_i) tends to zero.
        - A suitable degree-two cover satisfying the paper's additional condition is constructed.
    exact_ecdlp_object: >-
      Algebraic factor-base points whose image under phi is F_q-rational, with
      decomposition sources returned by solving the paper's polynomial systems.
    explicit_operation: >-
      Decompose random E(F_(q^n)) points over the algebraic factor base, collect
      relations, solve factor-base logs, and perform individual logarithm descent.
    why_information_flow_changes: >-
      The proper subfield F_q supplies a non-permutation algebraic membership
      condition and a small source alphabet; this is real extension-field
      structure rather than a bounded chart multiplication.
    applicability_obligations:
      - Exhibit a proper subfield of F_p with growing extension degree n.
      - Instantiate the theorem's cover and decomposition probabilities on the prime-field subgroup.
      - Bound relation rank, factor logs, and individual descent in N rather than q^n for an artificial extension.
      - Prove that extension and restriction preserve a useful density rather than make E(F_p) a sparse exceptional subset.
    applicability_verdict: fail_prime_field_has_extension_degree_one
    cost_transform:
      theorem_setup: "construct phi, algebraic factor base, polynomial systems, and field representation"
      theorem_object_construction: "valid in F_(q^n) with a proper F_q subfield"
      per_attempt_time: "absorbed in the theorem's (q^n)^o(1) expected extension-field bound"
      per_attempt_success: "the theorem's expected-time analysis applies under its growing-n regime"
      source_output: "decomposition sources are returned by the decomposition algorithm"
      independent_rank: "relation collection and linear algebra are included in the theorem's regime"
      factor_logs: "included for the extension-field factor base"
      blind_descent: "individual logarithm step is part of the index-calculus route"
      verification: "group relation replay and final [k]P=Q"
      peak_memory: "not converted here to a prime-field N exponent; no applicable instantiation"
      data: "extension-field factor base and relation matrix; no prime-field bound instantiated"
      communication: "none intrinsically, or the full relation artifacts if distributed"
      prime_field_substitution: >-
        For F_p the only representation F_(q^n)=F_p with q a prime power has
        n=1 when q=p; n does not tend to infinity, so the theorem does not
        provide a subexponential or sub-rho bound. Artificially extending to
        F_(p^n) changes the ambient group size and supplies no bound below N^0.5
        for the original sparse subgroup.
      end_to_end: "undefined for the target scope; rho remains the matched complete path"
    matched_boundaries:
      pollard_rho_shoup: >-
        Diem exploits explicit proper-subfield encoding and therefore lies
        outside strict generic DLP where applicable. That structure is absent
        at n=1, so no conflict or prime-field improvement follows.
      structured_generic: >-
        No applicable prime-field structure fraction delta exists; an
        artificial extension would need a new model and density calculation.
    proof_decomposition:
      size_lemma: "paper bounds the algebraic factor base and systems in growing n"
      runtime_lemma: "main theorem gives (q^n)^o(1) expected extension-field time"
      correctness_lemma: "valid decompositions yield exact group relations"
      success_lemma: "paper's relation analysis is tied to its field sequence"
      assembly_gap: "no n=1 specialization or original-subgroup cost theorem"
    controls:
      - Compare n=1 directly; the proper-subfield factor base collapses to the whole base-field condition.
      - If artificial extension is proposed, compare against rho on E(F_p) and rho on the ambient subgroup separately.
      - Require held-out blind target descent, not only relation generation in E(F_(p^n)).
    falsification_conditions:
      - The proposed specialization silently sets n=1 while citing the n->infinity theorem.
      - Ambient extension setup, rank, logs, or descent reaches at least N^0.5 in original-group units.
      - Returned relations do not retain valid original E(F_p) source logs.
    semantic_dedup:
      nearest: ["P1552 global/cover/correspondence family", "APS-2017", "DIEM-2011"]
      verdict: known_extension_field_index_calculus_not_prime_field_successor
      reason: >-
        The mechanism frontier already distinguishes extension-field
        decomposition from generic ordinary prime-field ECDLP.
    dominated_by: "Pollard rho for the target prime-field instance"
    sota_delta:
      supported_time_exponent_improvement: 0.0
      supported_memory_exponent_improvement: 0.0
      extension_field_theorem: "(q^n)^o(1) only under the stated growing-n regime"
      cryptographic_security_bits_reduced: 0
    named_obstruction: "the load-bearing proper-subfield hypothesis disappears at prime-field extension degree one"
    forward_guidance: >-
      Search for a prime-field algebraic subset with a proved decomposition and
      independent-rank theorem; relabelling F_p as an extension is not valid.

  - handle: B22-T03
    title: Fiat-Naor and Hellman source-free function inversion
    class: algorithm
    status: rejected_pre_id
    primary_source:
      citation: >-
        Amos Fiat and Moni Naor, Rigorous Time/Space Trade-offs for Inverting
        Functions, SIAM Journal on Computing 29(3) (1999/2000), 790-803.
      doi: "https://doi.org/10.1137/S0097539795280512"
      exact_result: >-
        The paper's main tradeoffs invert a supplied f:[N]->[N]:
        T*S^2=N^3*q(f), where q(f) is the collision probability of two uniform
        inputs, and the all-function/all-point tradeoff T*S^3=N^3. For a
        permutation, the classic Hellman tradeoff gives S*T about N after
        preprocessing; balanced online time and storage are N^(1/2+o(1)).
      hypotheses:
        - Random access to a fully evaluable supplied function f on [N].
        - Advice/preprocessing depends on f but not on the later challenge y.
        - The challenge y lies in the promised image/success set.
    exact_ecdlp_object: >-
      The public permutation f(a)=encode([a]P) from scalar indices to canonical
      encodings of subgroup points, with challenge y=encode(Q).
    explicit_operation: >-
      Precompute chain endpoints/advice for f, then invert y by chain traversal,
      collision handling, replay, and exact verification of the recovered index.
    why_information_flow_changes: >-
      This is a genuine source-free inverse for a public permutation; it does
      not need a source label at query time. Its tradeoff, however, is the
      ordinary square-root time-memory frontier rather than an exponent gain.
    applicability_obligations:
      - Include advice construction and all f evaluations for a single public ECDLP instance.
      - Use canonical injective point encoding and charge scalar multiplication per f evaluation.
      - Bound chain merges, coverage, replay, and inverse success probability.
      - Fit both online time and persistent advice below exponent 0.45.
    applicability_verdict: fail_time_memory_and_preprocessing_rectangle
    cost_transform:
      theorem_setup: >-
        Build f-dependent advice by public scalar-to-point evaluations. The
        inversion theorem does not make this source enumeration free; for one
        ECDLP target it cannot be amortized over an undeclared target population.
      theorem_object_construction: "f(a) is computable by scalar multiplication in polylog(N) group work"
      per_attempt_time: "for the permutation specialization, T=N/S up to lower-order factors"
      per_attempt_success: "constant only after the theorem's coverage and replay conditions; amplify explicitly otherwise"
      source_output: "the scalar preimage a=k directly"
      independent_rank: "not applicable"
      factor_logs: "not applicable"
      blind_descent: "not applicable"
      verification: "one [a]P=Q check"
      peak_memory: "S point/index words"
      data: "S words of f-dependent persistent advice"
      communication: "none locally; S words if advice is transferred"
      rectangle_calculation: >-
        Writing S=N^sigma gives T=N^(1-sigma+o(1)). Requiring both sigma<=0.45
        and 1-sigma<=0.45 is impossible. Balanced S=T=N^0.5 matches BSGS;
        rho dominates when negligible memory and one target are required.
      end_to_end: >-
        Adding advice construction only worsens the one-target cost. No
        lambda,mu<=0.45 point exists even under the optimistic free-setup ST=N control.
    matched_boundaries:
      pollard_rho_shoup: >-
        f is exactly the generic scalar-to-encoding permutation; the balanced
        inversion point matches the square-root barrier and does not exploit
        encoding-specific elliptic structure.
      structured_generic: >-
        No special subset or predicate is used, so delta supplies no escape;
        this is the unstructured control itself.
    proof_decomposition:
      size_lemma: "advice stores S chain/checkpoint words"
      runtime_lemma: "Hellman permutation specialization gives ST approximately N"
      correctness_lemma: "chain replay verifies a returned preimage"
      success_lemma: "coverage and collision analysis determine inversion probability"
      assembly_gap: "the complete time-memory rectangle has no feasible exponent point"
    controls:
      - Run the identical index on a random permutation with the same encoding size and evaluation cost.
      - Count preprocessing evaluations separately from online traversal.
      - Freeze the number of target inversions before amortizing setup.
    falsification_conditions:
      - Real-curve inversion matches the random-permutation null.
      - S*T remains N^(1-o(1)) and either time or memory exceeds N^0.45.
      - Advice construction or target coverage is omitted from charged cost.
    semantic_dedup:
      nearest: [ECDLP-IDEA-374, ECDLP-IDEA-011, ECDLP-IDEA-329]
      verdict: exact_duplicate_of_occupied_function_inversion_lane
      reason: >-
        ECDLP-IDEA-374 already applies Fiat-Naor collision-aware arbitrary
        function inversion and records the same advice/query obstruction.
    dominated_by: "Pollard rho at low memory; BSGS at the balanced high-memory point"
    sota_delta:
      supported_time_exponent_improvement: 0.0
      supported_memory_exponent_improvement: 0.0
      best_balanced_time_exponent: 0.5
      best_balanced_memory_exponent: 0.5
      cryptographic_security_bits_reduced: 0
    named_obstruction: "source-free inversion exists, but its complete time-memory tradeoff is the square-root frontier"
    forward_guidance: >-
      A successor needs an elliptic-encoding theorem that beats the matched
      random-permutation ST control after advice construction; another chain
      schedule or longer orbit window is duplicate maintenance.

  - handle: B22-T04
    title: Koutis odd-multilinear exterior/group-algebra detection
    class: composition
    status: rejected_pre_id
    primary_source:
      citation: >-
        Ioannis Koutis, Faster algebraic algorithms for path and packing
        problems, ICALP 2008, LNCS 5125, 575-586.
      doi: "https://doi.org/10.1007/978-3-540-70575-8_47"
      author_copy: "https://www.cs.cmu.edu/~jkoutis/papers/MultilinearDetection.pdf"
      exact_result: >-
        Theorem 2.4 gives one-sided odd-multilinear detection: a circuit
        polynomial with no multilinear degree-k term is always rejected, while
        one with such a term is accepted with probability greater than 1/4.
        Theorem 2.5 states that if the n-variable input circuit evaluates over
        integers modulo 2^(k+1) in time t and space s, detection costs
        O((nk+t)2^k) time and O(nk+s) space. The predicate is parity-sensitive
        and the theorem is a detector, not an endpoint-to-source circuit constructor.
      hypotheses:
        - A supplied arithmetic circuit G represents the polynomial.
        - A desired source corresponds to a degree-k square-free monomial with odd coefficient.
        - G evaluates modulo 2^(k+1) in the stated time t and space s.
    exact_ecdlp_object: >-
      A hypothetical circuit C_R whose variables name the six coloured deck
      occurrences and whose degree-six multilinear monomials are exactly the
      labelled tuples A1+...+A5-R=O, including repeated/sign/infinity strata.
    explicit_operation: >-
      Randomly substitute group-algebra elements so repeated variables
      annihilate, evaluate C_R modulo 2^7, detect an odd multilinear term, and
      self-reduce restrictions to recover its six source labels.
    why_information_flow_changes: >-
      Given a compact exact C_R, the theorem would turn a source-complete
      existence circuit into constant-overhead detection for fixed k=6. It
      does not, however, construct C_R from the endpoint or preserve witnesses by itself.
    applicability_obligations:
      - Construct C_R in time/state below B^(9/4) without enumerating B^3 or B^6 source combinations.
      - Prove biconditional support for every coloured and confluent stratum.
      - Prevent even-coefficient cancellation or supply isolation with charged success probability.
      - Provide restriction-stable evaluation for witness self-reduction.
      - Repeat for B independent rows, factor logs, and blind masked-target descent.
    applicability_verdict: fail_supplied_source_circuit_and_witness_interface
    cost_transform:
      parameterization: "k=6 fixed, n=6B occurrence variables, B=N^(1/5)"
      theorem_setup: "random substitutions and O(B) variable assignment once C_R exists"
      theorem_object_construction: >-
        Missing. A direct 3+3 or full tuple circuit pays B^3 or worse; the
        desired compact exact circuit is the same source-locator theorem sought
        by B21-P05 and P1552.
      per_attempt_time: "O(t+B) for fixed k=6, where t is one exact C_R evaluation"
      per_attempt_success: ">1/4 only for an odd surviving monomial; amplify and charge parity isolation"
      source_output: >-
        Not supplied by Theorems 2.4/2.5. Restriction self-reduction requires
        repeated calls to a restriction-stable C_R and exact source-addressable variables.
      independent_rank: "not implied; B returned relations still require duplicate-normalized rank"
      factor_logs: "not implied; sparse/dense linear algebra remains charged"
      blind_descent: "not implied; rebuild/evaluate C_(Q+[t]P), recover sources, remove t, verify"
      verification: "six EC additions per candidate plus final [k]P=Q"
      peak_memory: "O(B+s) plus C_R representation, witness-recovery state, and relation matrix"
      data: "C_R plus B verified source rows and descent artifacts"
      communication: "circuit and relation artifacts if distributed"
      end_to_end: >-
        The attractive O(t+B) detector is conditional on the missing compact
        exact source circuit. Instantiating C_R by known explicit separators
        costs at least B^3=N^0.6 time or equivalent source incidence, before
        rank, logs, and descent. No complete exponent below 0.45 is instantiated.
    matched_boundaries:
      pollard_rho_shoup: >-
        A compact C_R would be concrete encoding-specific structure outside
        strict GGM, but Koutis supplies no such elliptic circuit.
      structured_generic: >-
        No delta is computed for endpoints admitting a compact circuit, and no
        structured oracle is defined. The detector alone is not the oracle.
    proof_decomposition:
      size_lemma: "required but absent: compact all-strata C_R size bound"
      runtime_lemma: "Koutis Theorem 2.5 gives O((nk+t)2^k) after C_R is supplied"
