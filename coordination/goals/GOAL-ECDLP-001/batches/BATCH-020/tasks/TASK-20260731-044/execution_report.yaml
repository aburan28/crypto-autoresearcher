  observations:
    - >-
      Primary unplanted measurement (plant OFF, per R-1 binding): R=0.03655,
      R_null=112.105. R < 0.5 AND R_null >= 0.9, so r1_cell_label =
      S1_eligible_on_null_axis, NOT F2_eligible. The R-1 rule (F2_eligible iff
      R<0.5 and R_null<0.9) does not apply to this cell. This is an observation
      only; it does not constitute an S1_met determination (a single cell alone
      cannot -- specification.v2.yaml success_criterion requires >=2 distinct
      bit sizes) and is not a conclusion about H-DS-001.
    - >-
      Both real-arm methods (naive and split) hit 100% empirical success
      probability against genuinely unplanted (T = k*P, k uniform in [1,n-1])
      targets: 200/200 naive, 200/200 split. This reflects the toy-scale group
      structure of this specific cell (subgroup order n=241; the signed
      factor-base list has 128 elements, so m=4-fold signed sums cover the
      241-element group with high multiplicity) -- not a general claim about
      unplanted success rates at other parameters. Executor makes no claim
      about how this generalizes to other (bits,B,m) cells.
    - >-
      Live /4 plant companion (CTRL-RT025-PLANT-LIVE, computed strictly from
      this run's own measured costs, no synthetic known-answer): fake_R =
      0.009138, fake_R_null = 28.026. planted_bug_detected = False, because
      fake_R_null (28.03) remains far above the 0.9 detection threshold even
      after the live /4 inflation -- the null arm's true R_null (112.1) is so
      far above 0.9 that a 4x inflation of split-cost alone does not push it
      under 0.9. This is an honest, non-fabricated negative detection result on
      this specific cell; it does not by itself mean CTRL-NULL-PLANT is
      generally ineffective (the sibling RUN-DS-001-impl cell, bits=16, DID
      detect its plant), and the run does not claim
      planted_bug_detected=true anywhere.
    - >-
      CTRL-RHO / CTRL-BSGS matched baselines present: rho solved (k=43, 744
      total_group_operations, wall 0.00124s) with certificate_verified=true
      inside the driver, and independently re-verified true by
      experiments/EXP-DS-001/implementation/verify_certificates.py run
