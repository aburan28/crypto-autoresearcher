  protocol_deviations:
    - id: PD-1
      title: Live-plant detection predicate is not fixed by the frozen contract
      class: specification_underspecification
      detail: >-
        specification.v2.yaml CTRL-NULL-PLANT says only "the null gate must
        FLAG it (R_null also low)"; CTRL-RT025-UNPLANTED companion_live_plant
        says "Null gate must FLAG the plant (R_null echo)". Neither fixes a
        numeric detection predicate. Per the Executor contract the missing
        point is REFUSED rather than invented: three named readings are
        computed and reported side by side, and planted_bug_detected is
        reported under Reading B (the operative control's own wording,
        parameter-free). Readings A and C are reported at their measured
        values alongside. Adjudication belongs to Reviewer/Coordinator.
      missing_field_named: >-
        controls/CTRL-RT025-UNPLANTED.yaml companion_live_plant.pass_condition
        lacks a numeric decision rule for "the null gate FLAGS the plant".
      is_mathematical_evidence: false
    - id: PD-2
      title: Post-review blob drift on the frozen control and amendment files
      class: integrity_observation
      detail: >-
        The live CTRL-RT025-UNPLANTED.yaml and v2_ctrl_unplanted.yaml blobs at
        HEAD differ from the blobs reviewed at snapshot cac4d8b4. Cause is
        post-review merge commits 69df8230b / da6f4fdaf / d28767320 remapping
        colliding DEC ids (DEC-20260731-003 -> 022, -009 -> 018, -005 -> 023).
        Delta is five cross-reference lines. Cell, target_mode, backend,
        smoothness_abort, relations_target, budget, R-1, companion_live_plant
        and claim ceiling are byte-identical between the two versions.
        Executed against the HEAD blobs; both hashes recorded; the Executor
        edited nothing under controls/ or amendments/.
      is_mathematical_evidence: false
    - id: PD-3
      title: Memory cap could not be enforced by rlimit
      class: infrastructure
      detail: >-
        RLIMIT_AS, RLIMIT_DATA and RLIMIT_RSS all raise "ValueError: current
        limit exceeds maximum limit" on this macOS 26.6 arm64 host. The 16 GB
        budget was therefore not machine-enforced. Measured peak RSS was
        69,091,328 bytes (~0.07 GB), far under budget; recorded in the manifest
        resources block and environment.json resource_limits.
      is_mathematical_evidence: false
    - id: PD-4
      title: Wall-clock used is far below the 7200 s budget
      class: not_a_shortened_wall
      detail: >-
        R-2 (RT-20260731-042 MINOR) asked that a shorter wall be recorded as a
        deviation. No shorter wall was imposed: --wall 7200 was passed and the
        run terminated after 24.74 s because BOTH real arms reached the
        contractual stopping rule relations_target = 200. This is
        "relations_target reached", not "resource_exhaustion" and not an
        Executor-shortened budget.
      is_mathematical_evidence: false
    - id: PD-5
      title: CTRL-NULL-RHO not measured (recorded missing, not hardcoded)
      class: scoped_out
      detail: >-
        rho_calib_ratio_real and rho_calib_ratio_null are recorded as null with
        status "not_measured". They were deliberately NOT hardcoded to 1.0 as
        in the earlier planted package. The RT038-B3 rho-calibration defect
        remains unrepaired and is outside CTRL-RT025-UNPLANTED scope.
      is_mathematical_evidence: false
    - id: PD-6
      title: New driver file added under implementation/
      class: implementation_addition
      detail: >-
        experiments/EXP-DS-001/implementation/ds001_ctrl_unplanted.py was added
        (inside the task write_scope) because ds001_driver.py's measure path
        plants random m-sums, which this control forbids, and its plant path
        used forbidden synthetic known-answer constants. ds001_driver.py was
        NOT modified (its sha256 is recorded in the run manifest); the control
        driver imports its search kernels, factor base, null object and charged
        units so the backend id is preserved unchanged. implementation.md was
        appended to, never rewritten. Both files are inside write_scope but are
        additional to the 11 declared artifact paths; declared here explicitly.
      is_mathematical_evidence: false
    - id: PD-7
      title: Bootstrap CI construction stated explicitly
      class: method_detail
      detail: >-
        TAIL-R-BOOTSTRAP CIs resample per-relation reported wall samples and add
        each arm's fixed overhead amortized over its yield, so the identity
        resample reproduces the frozen point estimate exactly and
        rho_gop_per_second cancels. 2000 resamples, seeded from
        _seed_int(101, "boot_R_*").
      is_mathematical_evidence: false

