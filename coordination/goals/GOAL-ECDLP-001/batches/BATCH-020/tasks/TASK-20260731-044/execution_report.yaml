      calibration_perturbation_sign_stable=true.
    - >-
      HEUR-DS-1 was NOT re-run (CTRL-RT025-UNPLANTED.yaml scope.heursampling
      forbids re-running RUN-DS-001-heur for this control). The prior
      HEUR-DS-1 F3 observation (EV-DS-002) stands unchanged and unreferenced by
