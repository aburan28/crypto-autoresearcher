  protocol_deviations:
    - >-
      IMPLEMENTATION GAP FOUND AND REPAIRED (additive, in-scope): none of the
      existing driver modes (impl/measure/heur/finalize) can express an
      "unplanted uniform random target" or a live /4 plant detection path free
      of a synthetic known-answer shortcut. harvest_real() inside execute_cell
      (used by impl and measure) always calls random_target(), which plants a
      known m-sum so a hit is guaranteed by construction -- exactly the
      planted-yield packaging this control exists to discriminate against
      (RT-20260731-038 / DEC-20260731-018). mode_impl's do_planted branch also
      always executes a hardcoded "Synthetic known-answer plant (always
      exercised)" path (synth_R=0.05, synth_Rn=0.05, OR'd into
      planted_bug_detected), which CTRL-RT025-UNPLANTED.yaml's
      companion_live_plant explicitly forbids for this control
      ("WITHOUT synthetic known-answer synth_R/synth_Rn shortcuts").
      Added a new `--mode ctrl-unplanted` to
      experiments/EXP-DS-001/implementation/ds001_driver.py (additive only --
      no existing function body was modified) that (a) generates targets as
      T = k*P for k uniform in [1, n-1] (random_uniform_target), carrying no
      planted decomposition witness, (b) harvests naive/split relations against
      those targets (harvest_real_unplanted) up to relations_target or
      wall-budget, tracking attempted_targets/success_count per arm, and
      (c) computes the live /4 plant companion strictly from this run's own
      measured cost_naive/cost_split/cost_naive_null/cost_split_null
      (compute_live_plant_companion), with no synthetic fallback of any kind.
      All membership search, cost-charging, and backend functions
      (naive_search, split_search, build_claw_table, charge_backend_units,
      null_naive_search, null_split_search, cost_from_wall, bootstrap_ci,
      run_rho, run_bsgs, BACKEND_ID) are reused unmodified from the existing
      v2 driver, so the backend identity and cost identities are byte-identical
      to the planted-package measurement.
    - >-
      Deliberately omitted the "give up early if zero successes after N*50
      attempts" heuristic present in harvest_real/harvest_null when writing
      harvest_real_unplanted/harvest_null_arm, so the only stopping conditions
      are relations_target reached or wall_clock_seconds exhausted -- the exact
      frozen stopping rule ("stop after 200 successful usable relations or
      wall_clock_seconds_per_run, whichever first"), with no extra undocumented
      early exit.
    - >-
      cell_wall used was 7200s (the full contractual per-run wall from
      specification.v2.yaml budget.wall_clock_seconds_per_run and
      CTRL-RT025-UNPLANTED.yaml budget.wall_clock_seconds) -- NOT shortened, so
      R-2 (prefer contractual 7200s) does not apply as a deviation. All four
      arms (real-naive, real-split, null-naive, null-split) reached
      relations_target=200 well inside that ceiling; measured total run
      wall_seconds was 25.2s (see timing below), so the 7200s ceiling was never
      actually exercised.
    - >-
      Certificate handling follows the exact precedent set by the sibling runs
      of this same experiment (RUN-DS-001-impl/measure): the top-level
      "certificate" field is escalated to kind=discrete_log only when CTRL-RHO
      independently solves and verifies k (which it did here: n=241 is a small
      toy subgroup and rho solved trivially, k=43). Individual usable relations
      (the primary yield) are each re-verified in-place by an independent
      from-scratch resummation (point_sum over the claimed summands vs. the
      target) inside naive_search/split_search before being counted; this
      mirrors, not extends, the certificate-handling convention already
      established by RUN-DS-001-impl/measure/heur, which used the same pattern
      without per-relation certificate objects.
    - >-
      REPRODUCIBILITY NOTE (measured, not a bug): re-ran the identical command
      and revision into a scratch directory as a reproducibility check.
      Deterministic quantities (n_usable_*, attempted_*, the target/hit
      sequence, fb_x_hash, null_object_spec_hash, r1_cell_label) reproduced
      exactly. The wall-clock-derived cost metrics (R, R_null, cost_naive,
      cost_split, cost_naive_null, cost_split_null) did NOT reproduce bit-for-
      bit -- expected, because cost_identities.cost_* is defined on measured
      wall_seconds (specification.v2.yaml cost_identities), which is inherently
      subject to run-to-run system timing variance; this is a property of the
      frozen wall-clock cost definition itself, not of this run's code. The
      qualitative regime was stable across both runs (R stayed in the
      approximately-0.03-0.04 band, R_null stayed two orders of magnitude above
      0.9).
    - >-
      ANOMALY CARRIED FROM THE PARENT v2 DRIVER (not introduced here): the
      bootstrap CI construction (ratio of individually-resampled per-relation
      wall times) does not bracket the point estimate R in this cell
      (R=0.0366, R_ci=[0.108, 0.415]). Checked the already-completed sibling
      package (experiments/EXP-DS-001/results/R_table.json, produced by the
      unmodified v2 driver): the identical mismatch occurs in 41/54 of the
      planted-matrix cells, including the SAME cell under the planted target
      mode (bits=20,B=64,m=4,seed=101: R=0.03404, CI=[0.256, 0.919]). This
      confirms the CI construction is a pre-existing characteristic of the
      frozen cost_identities/bootstrap methodology (a ratio-of-per-attempt-
      ratios proxy vs. the ratio-of-aggregate-sums R metric), reproduced
      faithfully rather than corrected (correcting it would be an
      unauthorized post-hoc edit to a frozen cost model).
