      Executor authority; would require a Coordinator-approved amendment).
    - >-
      Wall-clock-derived cost metrics (R, R_null, cost_*) are not bit-for-bit
      reproducible across repeated executions of the identical command and
      revision, because cost_identities.cost_* is defined on measured
      wall_seconds (inherent system timing variance). Deterministic quantities
