    - id: D-3
      severity: minor
      class: undeclared_parameter
      statement: >-
        PER_TARGET_CAP_SECONDS = 5.0 is a hard-coded per-attempt truncation inside
        the measurement loop (ds001_ctrl_unplanted.py lines 67, 207, 278). It is
        not in the frozen contract and appears in no manifest, raw-result or
        summary field, so a reader of the artifacts cannot see that a per-attempt
        cap exists. At larger parameters such a cap truncates the slower (naive)
        arm first and would bias R downward.
      admissibility_impact: none_on_this_run
      why: >-
        It demonstrably never bound: the largest per-relation wall in the whole
        run is 0.1196 s on real_naive, 42x under the cap, and every arm reached
        200 usable relations with zero incomplete attempts. Reported so that it is
        declared before any larger-parameter re-use of this driver.
