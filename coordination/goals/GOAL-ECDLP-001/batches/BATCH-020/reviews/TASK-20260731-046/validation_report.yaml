validation_report:
  id: VAL-20260801-001
  task_id: TASK-20260731-046
  role: validator
  independent_session: true
  produced_this_run: false
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-020
  experiment_id: EXP-DS-001
  hypothesis_id: H-DS-001
  control_protocol_id: CTRL-RT025-UNPLANTED
  companion_control_id: CTRL-RT025-PLANT-LIVE
  run_ids:
