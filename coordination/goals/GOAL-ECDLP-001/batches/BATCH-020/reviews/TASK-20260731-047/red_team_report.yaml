  counterexample_or_mutation: >-
    Cheapest discriminating mutation: (1) patch live_plant_detect to only set
    planted_bug_detected on null_gate_f2_shape (disable echo tautology) and
    re-evaluate the companion — expect detection false on this cell; (2)
    increase bits while holding B,m fixed until unplanted p̂ drops below ~0.1
