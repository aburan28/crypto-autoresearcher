    the present R is saturated-toy packaging of wall amortization, not
    mechanism. Null-object destroy parameter for R_null theater: strengthen
    null_split composition until a packaging-like real arm can drive R_null<0.9;
    if R_null cannot be driven down, the null gate is not falsifiable.

  baseline_comparison: >-
    At n≈241, Pollard-rho solved in 744 group operations (certificate verified);
    BSGS modeled at ~2·ceil(√n) ops. Control R≈0.028 is a wall ratio under
    point-sum charged-units proxy with p̂=1.0, not an end-to-end attack beating
    rho/BSGS. assembled_E_proxy≈1.52 > 0.45 honesty floor. Closest specialized
    baseline for this regime remains Pollard-rho on the prime-order toy
    subgroup; no admissible claim that the claw rewrite dominates rho/BSGS on
    time, memory, and data jointly (dominated_by cannot be null).

