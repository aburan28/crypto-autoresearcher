  # ======================================================================
  objections:

    - id: RT047-B1
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: >-
        R and R_null are wall-clock ratios of unequally-optimized Python code;
        the run's own deterministic cost proxy disagrees by 116x on R_null
      target: >-
        Any reading of R = 0.0322 or R_null = 111.45 as a ratio of modeled
        algebraic/backend cost, charged units, group operations, or anything
        other than host-specific Python wall time.
      statement: >-
        summary.json optimistic_assumptions_restated[0] reads: "Charged units
        use a frozen backend cost proxy (ds001_driver.charge_backend_units),
        NOT a per-attempt Groebner solve; this is optimistic for BOTH arms
        equally". A reader takes from this that R is a ratio of modeled charged
        units. IT IS NOT. The frozen cost identity, quoted identically in
        R_cell.json cost_identities_used and in CTRL-RT025-UNPLANTED.yaml
        cost_identities, is
            cost_arm = reported_wall_seconds * rho_gop_per_second / max(n_usable,1)
        (ds001_driver.cost_from_wall, line 706; ds001_ctrl_unplanted.arm_cost,
        line 313). charge_backend_units is accumulated into
        reported_backend_units and then NEVER ENTERS R. rho_gop_per_second is a
        constant that cancels. With n_usable = 200 on every arm, R is exactly
        wall_split / wall_naive and R_null is exactly wall_split_null /
        wall_naive_null. The statement "optimistic for BOTH arms equally" is
        therefore not merely optimistic, it is describing a quantity that is
        not the reported one.
        This matters because BOTH cost proxies are present in the same
        raw-result.json and they disagree. Recomputed by Red Team from
        measurements.primary_unplanted_plant_off.arms:
          real_naive   wall 4.450349 s  units 130,630,800  n 200
          real_split   wall 0.143135 s  units   1,914,080  n 200
          null_naive   wall 0.026477 s  units     486,040  n 200
          null_split   wall 2.950737 s  units     465,080  n 200 (269 attempts)
        Wall-based:   R = 0.03216       R_null = 111.445
        Unit-based:   R = 0.01465       R_null =   0.9569
        Disagreement: R by 2.20x, R_null by 116.5x.
        The charged units are deterministic (bit-identical across all three
        independent measure_cell invocations: 130630800 / 1914080 / 486040 /
        465080 appear three times each), while the walls vary run to run. The
        deterministic ledger says the two null arms are computationally
        INDISTINGUISHABLE (ratio 0.957). The headline R_null = 111 exists only
        in the noisy, host-dependent proxy.
        Concretely, the 111 is uncharged Python work: null_split_search
        (ds001_driver.py line 624) rebuilds a table of
        left_samples = min(20000, max(B^2, B*10)) = 4096 random entries INSIDE
        EVERY PER-TARGET ATTEMPT (269 attempts => ~1.1M dict inserts), and none
        of that is charged to backend units. Meanwhile the REAL split arm builds
        its claw table ONCE for all 200 targets
        (table_build_reported_wall_seconds = 0.0113 s, amortized to 0.00006 s
        per relation). One arm amortizes its table, the other rebuilds it per
        attempt, and R_null is the ratio between them. That is an
        apples-to-oranges accounting asymmetry, not a structure measurement.
      which_way_it_cuts: >-
        Blocks any claim that R/R_null are cost-model quantities. Does not
        erase the wall measurements, which are honestly reported and
        reproducible on this host. Note it also cuts AGAINST premature
        rejection: under the unit proxy R = 0.0147 is still well under 0.5,
        so the split arm does enumerate substantially fewer candidates. The
        objection is to what R MEANS, not to the existence of an enumeration
        difference.
      discharging_requirement: >-
        EV/DEC must (1) correct or supersede the summary's
        optimistic_assumptions_restated[0] to say R is a wall ratio and charged
        units do not enter it; (2) report R_unit = 0.0147 and R_null_unit =
        0.957 beside the wall figures as a proxy-sensitivity disclosure; and
        (3) record that under the frozen R_null >= 0.9 gate the unit proxy
        passes by 6%, not by 12,000%, so the gate is not robust to proxy choice.

    - id: RT047-B2
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: >-
        NULL-DS-RANDOM-MULTIHOMOGENEOUS is not a matched control; the real arm
        exercises no Semaev structure, so R_null discriminates nothing
      target: >-
        Any claim that R_null = 111.45 >= 0.9 demonstrates structure-dependence,
        or that IDEA-20260731-011's structural mechanism has been tested.
      statement: >-
        Two independent halves, both fatal.
        (i) THE REAL ARM USES NO STRUCTURE. SMOOTHNESS_ABORT = False
        (ds001_ctrl_unplanted.py line 66, and CTRL-RT025-UNPLANTED.yaml
        smoothness_abort: false), so the `if smoothness_abort and not
        is_B_smooth(N, B)` branch in split_search (line 489) never executes.
        The join key is claw_key(encode_intermediate(need_x, D)) = SHA-256 of
        the x-coordinate, and with D_HALF[4] = 2, D = 2^(20*2) = 2^40, so
        max_bits = 41 while every x-coordinate is < p = 752627 < 2^20 — the
        truncation never fires and encode_intermediate is the IDENTITY. The
        candidate loop then accepts only on `lsum == need`, exact group
        equality. What the split arm performs is therefore a plain hash-join
        meet-in-the-middle on 2-element subsums of a 128-point signed factor
        base: enumerate C(128+1,2) = 8256 left pairs into a table, then probe
        with right pairs, instead of enumerating triples. This is the generic
        MITM / BSGS-style split. It is available on ANY group with ANY factor
        base and contains no Semaev, resultant, degree, or multihomogeneous
        content whatsoever. The measured enumeration ratio agrees: 653,154
        units/relation naive / 9,570 units/relation split = 68x, i.e. roughly
        the |signed|/2 saving a depth-3 -> depth-2 enumeration change buys.
        (ii) THE NULL OBJECT CANNOT SUPPORT A JOIN BY CONSTRUCTION.
        null_full_hit (line 548) is blake2b(...) % max(B^(m//2-1),2) == 0, i.e.
        an unstructured random oracle with hit density 1/64 — which matches the
        measured 486,040/40/200 = 60.75 checks per null relation. There is no
        composition law, so no meet-in-the-middle is possible even in
        principle. null_split_search's own docstring concedes it: "Independent
        half keys destroy compositional structure ... so claws rarely survive
        verification". Its productive path is a fallback that samples one full
        tuple every 50th iteration (line 677, `if n_enum % 50 == 0`), i.e. a
        50x-diluted copy of null_naive_search, plus a 4096-entry table it can
        never use. R_null ~ 50x dilution x per-attempt table build ~ 111 is
        arithmetically foreordained.
        A control that is guaranteed to fail for a reason unrelated to the
        hypothesis is not a control (docs/inventor-protocol.md §3). The correct
        matched null must destroy the STRUCTURE while leaving the ALGORITHM
        intact; this one destroys the algorithm and leaves the structure
        question untouched. H-DS-001's prediction explicitly demands "R_null >=
        0.9 on the MATCHED null object"; that conjunct is unevaluated.
        THE ARTIFACT TELL (inventor-protocol §3.1). Ask what R should do as the
        parameter meant to destroy the signal increases. If the win is generic
        MITM, R must scale like ~1/|signed| = ~1/(2B) and must therefore HALVE
        when B doubles from 64 to 128, with the claw table growing as B^2. If
        the win is Semaev/degree structure, R's dependence on B should track
        the smoothness-of-intermediates statistics instead. Nobody has measured
        R against B on the null axis. Until they do, "R < 0.5" is a restatement
        of "3 nested loops cost more than 2".
      which_way_it_cuts: >-
        Blocks structure-dependence and mechanism-supported dispositions.
        Explicitly does NOT support rejecting H-DS-001: the hypothesis's
        mechanism was not exercised, so no evidence about it was generated in
        either direction. Keeps the lane open and names the missing test.
      discharging_requirement: >-
        EV/DEC must record that the real arm ran structure-free
        (smoothness_abort=false, identity encoding, exact-equality join), that
        NULL-DS-RANDOM-MULTIHOMOGENEOUS shares no algorithm with the real split
        arm, and that R_null therefore does not discriminate packaging from
        structure. RT047-CTRL-1 must be scheduled before any S1-axis reading.

    - id: RT047-B3
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: >-
        CTRL-RT025-PLANT-LIVE is NOT discharged — Reading B is an arithmetic
        identity with zero specificity, and the contract's own gate did not fire
      target: >-
        summary.json planted_bug_detected = true, and any disposition treating
        CTRL-RT025-PLANT-LIVE as discharged.
      statement: >-
        The plant is applied to the SPLIT ARMS ONLY. measure_cell
        (ds001_ctrl_unplanted.py lines 360-379) passes plant_divisor to
        harvest_real("split", ...) and harvest_null("split", ...) and hard-codes
        1.0 for both naive arms; raw-result.json records the field literally as
        `plant_divisor_on_split_arms` and controls.CTRL_RT025_PLANT_LIVE
        applied_live_to = ["real_split arm", "null_split arm"]. Since R =
        cost_split/cost_naive and only the numerator is divided by 4,
        R_on / R_off == 1/4 IDENTICALLY, up to timing noise. The measured echo
        ratios are 0.2512 and 0.2499 — exactly 1/4, as the algebra requires.
        Reading B's rule is "R_on < R_off AND R_null_on < R_null_off". It is a
        bare strict inequality with NO THRESHOLD. Given a split-only divisor
        > 1 it CANNOT fail. Its true-positive rate is 1 and its false-positive
        rate is also 1: a GENUINE 4x algorithmic improvement of the split arm
        would fire it identically. A predicate that fires on every speedup,
        real or fake, detects nothing. It is also not a gate on a single
        measurement — it requires the plant-OFF run in hand for comparison,
        which in any real deployment you do not have.
        Worse, Reading B is justified in the code comment as "the false speedup
        appears on the NULL object too, where no structural claw win is
        possible" — but the null gate did not flag anything. With the plant ON,
        R_null = 27.20, still ~30x ABOVE the 0.9 threshold the contract's gate
        uses. The Executor records this honestly as AN-2. Reading A, the only
        reading with contractual provenance (spec-v2 S1/F2 numeric gate
        R < 0.5 AND R_null < 0.9), returned FALSE for plant-on AND plant-off,
        and the run's own field records discriminates: false. THE FROZEN
        DETECTION MACHINERY FAILED THE PLANT.
        Reading C (true_elapsed/reported = 4.005 and 4.000 on the two planted
        split arms) is the only reading with any diagnostic content — and it
        is expressly non-contractual, uses an Executor-chosen 1.5 threshold,
        and works by auditing the INSTRUMENTATION (reported vs true wall), not
        by any null gate. It also only works because R is wall-based; an
        operation-count cost model would have been immune to this plant
        entirely, which is itself a finding about the cost model (see RT047-B1).
        Under CTRL-RT025-UNPLANTED.companion_live_plant.pass_condition —
        "planted_bug_detected true via live /4 detection path" — the honest
        reading is that the plant was detected by a post-hoc, parameter-free,
        zero-specificity predicate selected after the numbers were in hand.
        PD-1 concedes the underspecification and correctly refuses to invent a
        threshold; the Executor's conduct here is exemplary. But the control is
        not discharged by a predicate chosen after seeing the data.
      which_way_it_cuts: >-
        Blocks discharge of CTRL-RT025-PLANT-LIVE and therefore blocks the
        third conjunct ("live plant detected") of the
        packaging_falsification_rule's structure-dependent branch. Does not
        impugn the Executor, who declared the gap rather than papering it.
      discharging_requirement: >-
        Coordinator must (1) declare CTRL-RT025-PLANT-LIVE UNDISCHARGED;
        (2) supersede CTRL-RT025-UNPLANTED with a control revision that fixes a
        NUMERIC, PRE-REGISTERED, SPECIFIC detection predicate before any rerun;
        (3) require the plant to be applied under at least one condition where
        a specific predicate could fail — e.g. a divisor applied to the NAIVE
        arm, or a divisor of 1.0 as a negative-control arm, so the detector's
        false-positive rate is measurable rather than assumed. A detector never
        run against a no-plant condition has no measured specificity.

    - id: RT047-B4
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: >-
        End-to-end, the "winning" split arm is ~89x SLOWER than the matched
        Pollard-rho receipt in the same file, and dominated by BSGS on every axis
      target: >-
        Any statement, in EV/DEC/knowledge prose, that lets R = 0.032 read as
        progress toward beating rho, or any `dominated_by: null`.
      statement: >-
        R is a per-relation MEMBERSHIP-SEARCH ratio between two arms of the same
        stage. It is not an attack cost. Recomputed from the snapshot:
          cost_split  = 1,033.91 rho-equivalent group ops per relation
          cost_naive  = 32,146.21 rho-equivalent group ops per relation
          CTRL_RHO (measured, same instance, certificate_verified true):
                        744 group operations TOTAL to solve the whole DLP
          CTRL_BSGS (modeled 2*ceil(sqrt(241))): 32 group ops, 16 stored elements
        Index calculus needs at least |factor base| = 64 independent relations
        before linear algebra can start. 64 x 1,033.91 = 66,170 rho-equivalent
        group operations for the RELATION-COLLECTION STAGE ALONE of the split
        arm — 88.9x the entire measured rho solve. The naive arm is 2,765x rho.
        The conclusion is robust to which group you baseline against: rho over
        the full group order 753,848 models to 0.886*sqrt(753848) = 769 ops,
        essentially the same. Memory: split holds a claw table of
        peak_claw_table_entries = 8,256; BSGS holds 16 elements; rho with
        distinguished points holds O(1). The split arm is dominated on TIME by
        rho (~89x) and by BSGS (~2000x), and on MEMORY by both. There is no
        axis on which it wins.
        NOT IN R, and therefore not in any cost claim from this package:
          - sparse linear algebra over the 64+ relation matrix (never run);
          - the descent / target-decomposition phase (never run);
          - claw-table build at scale (amortized to 0.00006 s/relation here only
            because 200 relations were harvested from an 8,256-entry table;
            table size is O(B^{m/2}) and is the van Oorschot-Wiener memory
            dimension, never swept against B);
          - the inverse success probability. Both real arms recorded
            empirical_success_probability = 1.0. AN-3 explains why: with 128
            signed points, C(131,4) ~ 1.2e7 multisets against group order
            753,848 gives ~16 expected representations PER RANDOM TARGET. This
            is the exact opposite of the index-calculus regime, where
            decompositions are RARE and 1/Pr[success] is the dominant cost
            factor. Total expected cost = per-attempt cost x inverse success
            probability (target-profile C-checklist, red-team obligation 5) is
            untested because the probability was structurally pinned at 1.
          - matched-rho calibration: CTRL_NULL_RHO rho_calib_ratio_real and
            _null are BOTH null / "not_measured" (PD-5). The RT038-B3 rho
            calibration defect is explicitly still unrepaired, by the run's own
            record.
          - BSGS is modeled from 2*ceil(sqrt(N)), never measured (summary
            optimistic_assumptions_restated[2]).
      which_way_it_cuts: >-
        Blocks any Pareto or attack-cost claim and forbids dominated_by: null.
        Does not deny that the split arm enumerates fewer candidates than the
        naive arm at this cell.
      discharging_requirement: >-
        EV/DEC must carry dominated_by = "matched Pollard-rho (measured 744
        group ops on this instance) and BSGS (modeled 32 ops / 16 stored
        elements); split-arm relation collection alone is ~89x rho on time and
        ~500x BSGS on memory at this cell" and sota_delta stated quantitatively
        in those terms, with R labelled explicitly as a per-stage, per-relation
        intra-experiment ratio.

    - id: RT047-B5
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: >-
        Scope — one cell, one seed, unreplicated, and the "20-bit" instance has
        a 7.9-bit prime-order subgroup
      target: >-
        Any promotion request, replication claim, or bit-size characterization
        derived from this run.
      statement: >-
        (i) H-DS-001 requires R < 0.5 at B >= 64 on AT LEAST TWO bit sizes among
        {16,20,24}. This run supplies one (bits=20, B=64, m=4, seed=101),
        unreplicated: budget maximum_runs = 1 and the execution report states a
        confirming rerun was NOT executed. No promotion request can be
        satisfied from this package on arithmetic grounds alone, before any of
        RT047-B1..B4 are considered.
        (ii) raw-result.json instance records p = 752,627,
        full_group_order = 753,848, subgroup_order_n = 241. The prime-order
        subgroup is ~7.9 bits. H-DS-001 test_boundary.instances says
        "16-, 20-, and 24-bit PRIME-ORDER SUBGROUPS". The "20 bits" label is the
        FIELD size, not the subgroup order, and the matched rho/BSGS baselines
        in the same file are computed over n = 241 while the membership search
        runs over E(F_p) of order 753,848. The Executor flags exactly this as
        AN-5 and did not alter the frozen instance. This is a contract-
        conformance deviation on the test boundary, and it means the toy is
        toyer than the label: any prose saying "at 20 bits" must say which
        20 bits.
        (iii) peak_rss_bytes = 69,091,328 (~66 MB) is essentially the CPython
        interpreter baseline plus an 8,256-entry table; it carries no
        information about how memory scales, because table size depends on B
        and m, not on bits, and B was never varied. Extrapolating 69 MB to any
        larger parameter is unsupported.
        (iv) PD-2 / AN-4: the live CTRL-RT025-UNPLANTED.yaml and
        v2_ctrl_unplanted.yaml blobs differ from the blobs reviewed at snapshot
        cac4d8b4 because of post-review DEC-id remaps. The Executor states the
        science-bearing fields are byte-identical and recorded both hashes.
        This is an evidence-integrity item for the Coordinator, not a
        mathematical result, but it must be adjudicated before the package is
        described as bound to its reviewed contract.
      which_way_it_cuts: >-
        Blocks promotion and blocks bit-size overstatement. Does not invalidate
        the run.
      discharging_requirement: >-
        EV/DEC state cell scope explicitly as (p 20-bit, prime-order subgroup
        n=241, B=64, m=4, seed=101, single unreplicated run), name AN-5 as a
        test-boundary deviation against H-DS-001's stated instances, and
        adjudicate PD-2 blob drift.

    - id: RT047-M1
      severity: MAJOR
      blocks_ledger_disposition: false
      advisory: true
      title: The bootstrap CI understates uncertainty in the arm's fixed overhead
      target: R_bootstrap_ci_95 and R_null_bootstrap_ci_95 as reported.
      statement: >-
        bootstrap_R (ds001_ctrl_unplanted.py line 318, disclosed as PD-7)
        resamples per-relation wall samples but adds each arm's
        reported_overhead_wall_seconds as a FIXED constant, unresampled. For the
        real split arm that overhead is the one-time claw-table build (0.0113 s,
        8% of that arm's 0.1431 s); for the null split arm it is 1.054 s, 36% of
        that arm's 2.951 s. A third of the null split arm's cost is thus treated
        as noiseless. The CIs are anticonservative by an unquantified amount.
        This is advisory only: R = 0.032 is far enough from 0.5 that the
        conclusion "CI excludes 0.5 from above" survives, and R_null is far from
        0.9. It matters for a future cell where R sits nearer the threshold —
        exactly the situation RT038-B7 flagged at the previous package, where
        the CI [0.256, 0.920] straddled 0.5 and excluded its own point estimate.
      discharging_requirement: >-
        Record as a limitation; resample the overhead (or report both variants)
        in any successor protocol.

    - id: RT047-M2
      severity: MAJOR
      blocks_ledger_disposition: false
      advisory: true
      title: Credit where due — three real repairs must be recorded, not lost
      statement: >-
        A red-team report that only attacks is as misleading as one that only
        praises. This run genuinely delivers, and the successor protocol should
        inherit rather than redo:
        (1) UNPLANTED TARGETS ARE REAL. target_mode records 4,000 uniform random
        curve targets, lift_x acceptance 0.508, target_stream_sha256
        4a020749..., planted_m_sums_used: false. RT038-B7's central complaint —
        that the previous package harvested from planted m-sums — is answered.
        Both real arms reached 200/200 with stop_reason
        relations_target_reached and zero resource exhaustion. The FIRST branch
        of the packaging_falsification_rule (R rises toward 0.5, and/or yield
        collapses to resource_exhaustion with near-zero successes) is
        DEFINITIVELY NOT what happened. Naive-yield packaging is falsified.
        (2) 1,200/1,200 relation certificates independently re-verified via
        independent_verify_decomposition, a code path separate from the search
        arms, with zero failures across all six arm-conditions. The claim tier
        is honestly supported by certificates.
        (3) The synthetic known-answer plant that RT038-B3 called control
        theater is GONE: synthetic_known_answer_used false,
        synth_R_or_synth_Rn_constants_present false,
        hardcoded_planted_bug_detected false, and CTRL_NULL_RHO is recorded as
        not_measured rather than being hardcoded to 1.0. The Executor also
        self-reported an arithmetic error it caught and corrected (AN-7) and
        declared seven protocol deviations including the one that most damages
        its own headline (PD-1, AN-2). This is the standard of execution
        reporting the program should be citing as the norm.
        None of this makes R a structure measurement. All of it is durable.

  # ======================================================================
  required_controls:

    - id: RT047-CTRL-1
      priority: 1
      name: MATCHED-ALGORITHM NULL (the cheapest experiment that would kill this)
      why_this_one: >-
        It attacks the single load-bearing inference — "R < 0.5 while R_null
        >= 0.9 means the win is structure-dependent" — at its weakest joint,
        costs essentially nothing, and requires no new mathematics. Per
        docs/inventor-protocol.md §3.2, the null object must be the identical
        measurement on a random instance of the SAME SHAPE. The existing null
        changes the algorithm; this one changes only the object.
      protocol: >-
        Run naive_search and split_search UNCHANGED — same code, same
        SMOOTHNESS_ABORT=False, same charge_backend_units, same cost identity,
        same 200-relation stopping rule, same seed 101 — against a
        STRUCTURE-DESTROYED GROUP OF THE SAME SHAPE. Two concrete variants,
        either sufficient, both ~30 seconds of compute:
          (a) Replace E(F_p) with the additive group Z/753848Z. Draw a
              128-element "signed factor base" of random residues (closed under
              negation, to match). Draw 200 uniform random targets. All Semaev /
              elliptic / degree structure is gone; the composition law and the
              factor-base geometry remain.
          (b) Keep E(F_p) but replace the factor base with 64 x-coordinates
              drawn uniformly at random from the curve rather than by the frozen
              deterministic subset policy, destroying any factor-base structure
              while keeping the group.
      measures: >-
        R_matched_null = cost_split/cost_naive on the structure-destroyed
        object, reported under BOTH cost proxies (wall AND charged units), plus
        the enumeration counts n_enum for each arm.
      predicted_if_artifact: >-
        R_matched_null ~ 0.03 (wall) and ~ 0.015 (units) — i.e. approximately
        EQUAL to the real-arm R, because the observed win is generic
        meet-in-the-middle and transfers to any group.
      predicted_if_genuine: >-
        R_matched_null >= 0.9, i.e. the split arm loses its advantage when
        Semaev structure is removed.
      falsification_consequence: >-
        R_matched_null < 0.9 fires H-DS-001's OWN falsification condition
        ("R_null < 0.5 whenever R < 0.5: apparent gain is an engine artifact,
        not Semaev structure") and R-1's F2 branch, which no measurement in the
        entire EXP-DS-001 series has ever fired (RT038-B3: f2_eligible = 0
        across 54 cells). Under CTRL-RT025-UNPLANTED.packaging_falsification_rule
        the correct disposition would then be WEAKEN, explicitly NOT
        reject_scoped-as-impossibility: it would establish that the harness has
        never yet tested the mechanism, not that the mechanism fails.
      estimated_cost: <60 s wall, single cell, no new dependencies.

    - id: RT047-CTRL-2
      priority: 2
      name: B-SWEEP ARTIFACT TELL (what should the quantity do?)
      protocol: >-
        Same cell, sweep B in {32, 64, 128, 256} at fixed bits=20, m=4,
        seed=101, unplanted targets. Record R, R_null, n_enum per arm,
        peak_claw_table_entries, and peak RSS at each B.
      measures: >-
        The scaling of R and of the claw table with B.
      predicted_if_generic_mitm: >-
        R decays approximately as 1/(2B) — halving from B=64 to B=128 — while
        peak_claw_table_entries grows as ~(2B)^2/2 (8,256 -> 32,896 -> 131,328).
        A quantity that tracks 1/|signed| is measuring loop depth.
      predicted_if_structural: >-
        R's B-dependence tracks the smoothness statistics of the intermediates,
        not 1/(2B), and departs measurably from the MITM curve.
      why_required: >-
        docs/inventor-protocol.md §3.1: name the parameter that is supposed to
        destroy the signal and state what the measurement should do as it
        increases. No B-sweep of R on a controlled null has ever been run in
        this experiment. It also supplies the memory axis, which is currently
        a single unswept 69 MB number, and the van Oorschot-Wiener
        time-memory interpolation that RT047-B4 says is missing.

    - id: RT047-CTRL-3
      priority: 3
      name: PLANT-DETECTOR SPECIFICITY
      protocol: >-
        Before any rerun, fix a NUMERIC detection predicate in a superseding
        control record. Then run the detector under at least three conditions:
        divisor 4.0 on the split arms (true positive); divisor 1.0 (negative
        control — the detector MUST NOT fire); divisor 4.0 on the NAIVE arms
        (opposite-sign plant). Report the detector's confusion matrix.
      why_required: >-
        Reading B has never been evaluated against a no-plant condition, so its
        specificity is asserted, not measured. A detector with an unmeasured
        false-positive rate discharges nothing. This is the direct repair of
        PD-1 and it is a contract-drafting task, not a compute task.

    - id: RT047-CTRL-4
      priority: 4
      name: SPARSE-TARGET SUCCESS-PROBABILITY REGIME
      protocol: >-
        Reduce B (or raise the group order) until empirical success probability
        per random target drops well below 1 — the actual index-calculus regime
        — and report total expected cost = per-attempt cost x inverse success
        probability for both arms, with attempted_targets and success_count.
      why_required: >-
        AN-3 shows this cell has ~16 decompositions per random target, so
        1/Pr[success] = 1 by construction and the dominant cost factor of real
        index calculus is invisible. CTRL-RT025-UNPLANTED.target_mode already
        anticipates this (sparse_alternative_ok / sparse_requires) and it was
        not exercised. Red-team obligation 5 and target-profile cost
        bookkeeping are untested until it is.

  counterexample_or_mutation: >-
    RT047-CTRL-1 variant (a) is the counterexample construction. The claim
    requires that the split arm's advantage depend on Semaev/multihomogeneous
    structure. But the split arm, as executed, joins on exact x-coordinate
    equality with the smoothness predicate switched off and the intermediate
    encoding reduced to the identity map (D = 2^40 vs x < 2^20). Nothing in
    split_search reads any curve-specific or degree-specific property that
    naive_search does not also read; the two differ only in enumeration depth
    (pairs vs triples) and in the presence of a hash table. Therefore replacing
    E(F_p) by Z/753848Z with a 128-element random signed factor base must
    reproduce R ~ 0.03 if the mechanism is generic. Producing that number would
    be a direct counterexample to the structure-dependent reading, at a cost of
    under a minute. Producing R >= 0.9 instead would be the first genuine
    evidence for the mechanism this experiment has generated.

  baseline_comparison:
    regime: >-
      Prime field p = 752,627; curve group order 753,848; prime-order subgroup
      n = 241; factor base 64 x-coordinates / 128 signed points; m = 4;
      200 relations harvested per arm; unplanted uniform-random targets.
    pollard_rho_matched:
      source: raw-result.json controls.CTRL_RHO (MEASURED, certificate_verified true)
      total_group_operations: 744
      wall_seconds: 0.000515
      memory: O(1) with distinguished points
      comparison: >-
        Split-arm relation collection alone, at the 64 relations needed before
        linear algebra can begin, costs 64 x 1,033.91 = 66,170 rho-equivalent
        group operations. That is 88.9x the ENTIRE measured rho solve, before
        linear algebra, descent, and precomputation are counted. Naive arm:
        2,057,357 units = 2,765x rho.
    bsgs_matched:
      source: raw-result.json controls.CTRL_BSGS (MODELED, never measured)
      group_operations_modeled: 32
      storage_elements_modeled: 16
      caveat: >-
        Modeled as 2*ceil(sqrt(241)) over the subgroup while the membership
        search runs over the order-753,848 full group (AN-5). Even taking the
        generous full-group figure (2*ceil(sqrt(753848)) = 1,738 ops / 869
        stored), the split arm is dominated on both axes.
      comparison: >-
        Split arm holds 8,256 claw-table entries against BSGS's 16 (or 869),
        and spends ~66,170 ops against BSGS's 32 (or 1,738). Dominated on time
        AND memory.
    closest_specialized_baseline: >-
      Gaudry/Diem-style index calculus with Semaev summation polynomials and a
      Groebner membership solve. NOT COMPARED, and cannot be compared from this
      package: the backend is exact point-sum verification with a constant
      charge_backend_units(4) = 40 per candidate
      (backend_id ds001-v2-point-sum-membership+charged-units-v1), never a
      Groebner solve. The relative cost of the naive and split arms under a
      real algebraic membership backend is unmeasured, and the whole R
      literature-relevance question turns on it.
    dominated_by: >-
      Matched Pollard-rho (measured 744 group operations, O(1) memory, on this
      exact instance) and matched BSGS (32 ops / 16 stored, modeled). Also
      dominated by the generic meet-in-the-middle baseline in the sense that
      matters most: RT047-B2 shows the split arm IS that baseline, so it holds
      no advantage over it by construction.
    dominated_by_check_performed: >-
      Every row checked across time, memory, and data/queries against both
      baseline receipts present in raw-result.json plus the generic-MITM
      alternative. `null` is not admissible here and would be a fabrication
      under AGENTS.md rule 5 / inventor-protocol §5.
    sota_delta: >-
      -8,800% on time versus matched rho for relation collection alone
      (66,170 vs 744 group operations, i.e. 88.9x worse); -51,500% on memory
      versus modeled BSGS (8,256 vs 16 stored elements). The only positive
      delta in the package is intra-experimental: the split arm is 31x cheaper
      in wall (or 68x in charged units) than the naive arm of the same harness,
      which is not a published baseline and is not a state of the art.

  heuristic_challenges:
    - id: RT047-H1
      heuristic: HEUR-DS-1 (smoothness of split intermediates)
      challenge: >-
        Not exercised and not validated. SMOOTHNESS_ABORT = False throughout, so
        is_B_smooth is never called on the real arm; the F3_trigger observation
        in EV-DS-002 (RATE and KS fail at 16/20/24 with n = 1e5; TAIL passes
        only vacuously at p_ext = 1.0) stands unchanged and unaddressed. Any
        write-up that places R = 0.032 beside a smoothness narrative is
        connecting two things that never touched in this run.
    - id: RT047-H2
      heuristic: random-model transfer for HEUR-DS-1
      challenge: >-
        RT038-B2's transfer objection is unrepaired and this snapshot makes it
        sharper. The sampled object is encode_intermediate of an EC
        x-coordinate, and at bits=20, m=4 the encoding is provably the IDENTITY
        map (mask width 41 bits, x < 2^20). The quantity whose smoothness
        HEUR-DS-1 is about — a Semaev resultant/norm intermediate of size
        D = 2^(bits*d_half) = 2^40 — is therefore not the quantity being
        sampled, by a factor of 2^20 in magnitude. A minimal/structured
        algebraic intermediate is not a uniformly random integer of its size,
        and neither is a curve x-coordinate; the cheapest exposure is to sample
        the ACTUAL resultant intermediates at the same toy parameters and
        compare their smoothness CDF against Dickman rho, which is what the
        heuristic's validation plan was supposed to do.
    - id: RT047-H3
      heuristic: assembled exponent E
      challenge: >-
        IDEA-20260731-007 gives E = max(beta*m/2*(1-o(1)), omega_LA*beta), which
        at the quoted optimistic m=5, beta=1/5, omega_LA=2 is
        max(0.5(1-o(1)), 0.4, 0.2) ~ 1/2 — i.e. NO improvement over matched rho
        UNLESS HEUR-DS-1 delivers a superpolynomial smoothness gain. HEUR-DS-1
        has FAILED at toy (EV-DS-002 F3). It follows that a favourable R at this
        cell CANNOT be an exponent improvement even in principle, and any prose
        letting R = 0.032 read as progress toward beating rho is overclaiming.
        The package itself agrees: summary.modeled.assembled_E_proxy = null,
        status "not_computed (out of control scope)". EV-DS-002 O-7 records the
        assembled proxy never fell below 0.45 (min ~0.65) on the previous
        matrix. No exponent was computed here at all.
    - id: RT047-H4
      heuristic: >-
        Unnumbered implicit heuristic — "wall-clock ratio on this host is a
        faithful proxy for algebraic cost"
      challenge: >-
        This assumption is load-bearing for every number in the package and it
        appears nowhere as a numbered heuristic with a falsification condition.
        RT047-B1 shows it is false in the sharpest possible way: the two cost
        proxies inside the same artifact disagree by 116x on R_null. Under the
        target-result profile every heuristic must be explicit and numbered;
        this one is neither.

  reduction_and_scope_challenges:
    - id: RT047-S1
      challenge: >-
        No reduction chain is invoked. H-DS-001 reduction_chain lists
        corollaries: [] and core_problem "charged Semaev membership / relation
        cost at toy prime-field ECDLP". Correct and honest; no scope inflation
        via cited reduction exists to audit. Recorded as satisfactory.
    - id: RT047-S2
      challenge: >-
        Affected-vs-safe scheme scope: none claimed, none admissible. Nothing
        in this package bears on any deployed curve or parameter set. Any
        successor document asserting affected schemes from EXP-DS-001 is
        inflating scope from an 8-bit-subgroup toy.
    - id: RT047-S3
      challenge: >-
        The control's own `discharges:` list claims [RT038-B7,
        CTRL-RT025-UNPLANTED, CTRL-RT025-PLANT-LIVE]. On the evidence:
        CTRL-RT025-UNPLANTED is discharged as to the unplanted-target facet
        only; RT038-B7 is partially discharged (unplanted remeasure done, live
        plant not); CTRL-RT025-PLANT-LIVE is NOT discharged (RT047-B3). The
        Coordinator must not carry the contract's self-asserted discharge list
        forward unamended.

  cost_model_challenges:
    - id: RT047-C1
      challenge: >-
        R is not a cost model output. It is wall_split/wall_naive, a ratio of
        two hand-written Python procedures of different loop structure, on one
        macOS arm64 host, mediated by dict-lookup and interpreter constants that
        no algebraic cost model contains. See RT047-B1 for the 2.20x / 116.5x
        disagreement with the run's own deterministic charged-unit ledger.
    - id: RT047-C2
      challenge: >-
        charge_backend_units(m) returns a CONSTANT (40 for m=4) per backend
        call, so "charged units" is just 40 x (candidate count) for naive and
        40 x (table-probe count) for split. It charges nothing for the split
        arm's table-build elliptic-curve additions, and nothing for the naive
        arm's per-candidate E.add. Both proxies are broken, in opposite
        directions. There is no defensible operation count in this package.
    - id: RT047-C3
      challenge: >-
        Amortization asymmetry. The real split arm builds its claw table ONCE
        (0.0113 s over 200 relations); the null split arm rebuilds a 4,096-entry
        table INSIDE EVERY ATTEMPT across 269 attempts. R_null compares an
        amortized arm to an unamortized one. At crypto scale the real arm's
        amortization is itself unjustified: table size is O(B^{m/2}) while the
        relation requirement is O(B), so the per-relation share of table build
        grows with B and has never been swept (RT047-CTRL-2).
    - id: RT047-C4
      challenge: >-
        The eliminated dimension is not free (KN-LIT-7593 rule). The split arm
        removes one enumeration level by precomputing a table; the table's own
        construction and its 8,256-entry memory must be, and are not, charged
        into any comparison against rho or BSGS. Until the van Oorschot-Wiener
        time-memory interpolation is drawn for this arm, the "speedup" is a
        memory purchase reported as a time win.
    - id: RT047-C5
      challenge: >-
        Total expected cost = per-attempt cost x inverse success probability is
        untested, because success probability was structurally 1.0 (AN-3, ~16
        representations per random target). The regime in which index calculus
        is hard was not entered. See RT047-CTRL-4.
    - id: RT047-C6
      challenge: >-
        rho_gop_per_second = 1,444,660 is derived from a single CTRL-RHO capture
        of 744 group operations in 0.000515 s — a half-millisecond
        measurement. It cancels in R, so no harm there, but every
        gops_per_relation figure in R_cell.json and summary.json is scaled by
        it, and those absolute figures should not be quoted without the caveat
        that their unit comes from a sub-millisecond timing.

  packaging_falsification_rule_adjudication:
    rule_quoted_from_contract: >-
      "Expected under planted-yield packaging: unplanted R rises toward >=0.5,
      and/or usable yield collapses to resource_exhaustion with near-zero
      successes. Expected under true structure-dependent rewrite: R remains
      <0.5 with bootstrap CI honestly excluding 0.5 from above AND R_null>=0.9
      AND live plant detected."
    branch_1_packaging: >-
      NOT OBSERVED. R did not rise (0.0322); yield did not
      collapse (200/200 both real arms, success probability 1.0, no resource
      exhaustion). Planted-yield packaging is falsified as an explanation of
      the previous package's yield. This is a genuine result and must be
      recorded.
    branch_2_structure_dependent: >-
      NOT ESTABLISHED. Conjunct 1 (R < 0.5 with CI
      excluding 0.5 from above) is satisfied as measured, but RT047-B1 shows R
      is a wall ratio and RT047-B2 shows the win is structure-free generic MITM,
      so the conjunct does not mean what the branch label says. Conjunct 2
      (R_null >= 0.9) is satisfied only under the wall proxy and against an
      unmatched null; under the run's own charged-unit ledger it is 0.957, and
      RT047-B2 shows the null cannot support a join by construction. Conjunct 3
      (live plant detected) is NOT satisfied: RT047-B3.
    adjudication: >-
      The rule was drafted as a dichotomy and the run landed outside both
      branches. It falsified packaging without establishing structure. The
      honest label is THIRD OUTCOME: the mechanism remains untested because the
      instrument does not measure it. The correct disposition is to keep the
      lane open, record the repair, and run RT047-CTRL-1.

  narrowest_supported_statement: >-
    At exactly one toy cell (p = 752,627, prime-order subgroup n = 241, curve
    group order 753,848, B = 64 / 128 signed points, m = 4, seed = 101, 200
    relations per arm, unplanted uniform-random targets, smoothness_abort =
    false, backend ds001-v2-point-sum-membership+charged-units-v1, one
    unreplicated run on one macOS arm64 host), a depth-2 hash-join
    meet-in-the-middle over factor-base pair-sums collected 200 verified
    4-term relations in 0.143 s of measured wall while a depth-3 enumeration
    over the same factor base took 4.450 s, giving a wall ratio R = 0.0322
    (bootstrap CI [0.0267, 0.0387]) and a charged-unit ratio of 0.0147; every
    one of the 1,200 relation certificates re-verified independently; both
    arms decomposed 200/200 unplanted random targets, consistent with the
    ~16 expected representations per target that these parameters imply.
    This measurement is silent on Semaev/multihomogeneous structure: the join
    used exact x-coordinate equality with the smoothness predicate disabled and
    the intermediate encoding acting as the identity. The reported
    R_null = 111.45 compares this arm to a differently-implemented,
    per-attempt-unamortized procedure on a random-oracle object that admits no
    join, and the same run's deterministic charged-unit ledger puts that ratio
    at 0.957. The live /4 plant fired only a parameter-free post-hoc
    inequality that a genuine speedup would fire identically; the contract's
    numeric null gate did not fire. End to end, the split arm's relation
    collection alone costs ~66,170 rho-equivalent group operations against the
    744 that measured Pollard-rho needed to solve this instance outright.
    Nothing here supports S1_met, `support` for H-DS-001, HEUR-DS-1 validation,
    any asymptotic or crypto-scale claim, or a Pareto win over any baseline —
    and equally, nothing here supports rejecting H-DS-001, whose mechanism was
    not exercised.

  recommended_disposition:
    for_task: TASK-20260731-048 (ledger archive / decision)
    hypothesis_status_recommendation: >-
      Keep H-DS-001 at `analyzed`, pending replication and pending
      RT047-CTRL-1. Do NOT advance to `replicated` or `supported`. Do NOT
      `reject_scoped`.
    evidence_disposition: >-
      Record a new evidence record as `inconclusive_on_mechanism /
      partial_repair_confirmed`, scoped exactly to the narrowest_supported_
      statement above, carrying: the packaging-branch falsification (real,
      durable), the unplanted-target repair, the 1,200/1,200 certificate
      verification, and RT047-B1..B5 as limitations. dominated_by and
      sota_delta as given in baseline_comparison. It must NOT be labelled
      S1_met, F2_met, or structure_gate_passed.
    control_discharges:
      CTRL-RT025-UNPLANTED: DISCHARGED AS TO UNPLANTED TARGETS ONLY.
      CTRL-RT025-PLANT-LIVE: NOT DISCHARGED (RT047-B3).
      RT038-B7: PARTIALLY DISCHARGED.
      RT038-B3: NOT DISCHARGED — null-object defect is unrepaired code.
      RT038-B4: NOT DISCHARGED — cost-identity defect is unrepaired contract.
    reasons: >-
      (1) The run cannot meet H-DS-001's success criterion arithmetically
      (one bit size, two required) regardless of any objection, so no promotion
      is available. (2) Three of the four quantities carrying the favourable
      reading are shown to be instrument artifacts from in-artifact evidence.
      (3) But the run genuinely falsified the packaging branch and genuinely
      repaired the planted-yield and synthetic-plant defects, so this is not a
      failed run and must not be written up as one. (4) The mechanism has never
      been tested, so closing the lane would be a fatigue report about the
      harness rather than a statement about the problem
      (docs/inventor-protocol.md §4), and is forbidden.
    what_remains_open: >-
      Whether Semaev/multihomogeneous structure yields a claw advantage BEYOND
      generic meet-in-the-middle is entirely open — no measurement in the
      EXP-DS-001 series has yet separated the two, because every real arm to
      date ran with smoothness_abort = false. That separation is cheap
      (RT047-CTRL-1, under a minute) and is the highest-value next experiment
      in this lane.

  next_concrete_action: >-
    Run RT047-CTRL-1 variant (a): re-execute ds001_ctrl_unplanted.py's real
    arms UNCHANGED (naive_search and split_search, smoothness_abort=false,
    same charge_backend_units, same cost identity, 200 relations, seed 101) but
    with E(F_p) replaced by the additive group Z/753848Z and a 128-element
    negation-closed random "signed factor base", against 200 uniform random
    targets; report R and R_null under BOTH the wall proxy and the charged-unit
