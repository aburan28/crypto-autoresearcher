        observation only; keep asymptotic gates OPEN; keep H-DS-001 analyzed;
        forbid S1_met / support / asymptotic promotion.

    - id: RT047-B2
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: packaging_falsification_rule structure branch fails on CI honesty
      target: >-
        Any claim that the control outcome matches the protocol's
        "true structure-dependent rewrite" expectation.
      statement: >-
        CTRL-RT025-UNPLANTED requires, for the structure reading, R<0.5 with
        bootstrap CI honestly excluding 0.5 from above, plus R_null≥0.9 and
        live plant detected. Observed CI [0.108, 0.847] includes 0.5; point
        R≈0.0276 lies outside the reported CI (lower bound 0.108 > R). Degenerate
        R_null CI (zero width, point repeated) is not an honest uncertainty
        estimate. Driver bootstrap uses per-relation wall ratios, not the
        yield-charged cost identity that defines R — artifact tell carried from
        RT038 on this same cell. Therefore structure_expected_established=false
        under the protocol's own rule.
      which_way_it_cuts: >-
        Blocks packaging the point-estimate pattern as a passed structure test.
      discharging_requirement: >-
        Ledger must state the structure branch did not clear CI honesty; must
        not equate S1_eligible_on_null_axis with structure_gate_passed.

    - id: RT047-B3
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: Live /4 plant theater not discharged — echo factor is tautological
      target: >-
        Any claim that CTRL-RT025-PLANT-LIVE / RT038-B3 is scientifically
        discharged because synthetic_shortcut_used=false and
        planted_bug_detected=true.
      statement: >-
        live_plant_detect divides reported split costs by 4 in-process, then
        sets null_gate_echo_factor when exact_factor_real/null hold and
        R_plant==R/4 and R_null_plant==R_null/4. Those predicates are true by
        construction whenever primary costs are finite — they do not detect a
        plant injected into an independent measurement path. null_gate_f2_shape
        is false (R_null_plant≈26.4 ≮ 0.9), so the only firing path is this
        tautology. Synth OR-path removal is cosmetic progress, not theater
        discharge. Residual RT038-B3 facets remain: rho_calib_ratio_*=1.0
        hardcoded; R_null≈105 still consistent with an asymmetrically crippled
        null_split that nearly-automatically passes R_null≥0.9 whenever
        R_real<0.5 (inventor-protocol §3 null-gate evasion risk).
      which_way_it_cuts: >-
        Blocks treating live_plant_detected as non-theater CTRL-NULL-PLANT
        success or as S1 plant conjunct.
      discharging_requirement: >-
        EV/DEC must record plant detection path as tautological echo arithmetic;
        refuse structure-dependence claims; list residual B3 facets as open.

    - id: RT047-B4
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: Cost-proxy R and toy p_success=1.0 are not ECDLP progress
      target: >-
        Any reading of R as Groebner/Semaev membership cost, total expected
        attack cost, or a Pareto win over Pollard-rho / BSGS; any use of
        p_success=1.0 as evidence of robust unplanted relation yield at
        cryptographic density.
      statement: >-
        Backend remains exact point-sum verification with charged-units proxy
        (charge_backend_units), not per-attempt sympy Groebner. R =
        wall_split/wall_naive under equal n_usable (rho_gop factor cancels) —
        table-amortized enumeration timing at bits=20. empirical_success=1.0
        on 200/200 unplanted attempts at n≈241 means the sparse-target stress
        the packaging rule expected never appeared; total expected cost =
        per-attempt × 1/p_success is silently ≈ per-attempt because p̂=1, which
        is exactly the bookkeeping failure AGENTS / exemplar profile forbid
        when extrapolating. Matched rho (744 gops, solved) and modeled BSGS
        (n=241) are toy calibration telemetry. assembled_E_proxy≈1.52 does not
        beat the ~0.45 honesty floor. dominated_by vs rho/BSGS cannot be null.
      which_way_it_cuts: >-
        Blocks cost-path, exponent-assembly, and Pareto-null claims from this
        control.
      discharging_requirement: >-
        Scope R as toy wall-charged ratio under named proxy + unplanted toy
        density; record p_success=1.0 as saturated-toy observation, not crypto
        yield; forbid dominated_by null over rho/BSGS.

    - id: RT047-B5
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: Do not reject_scoped-as-impossibility or close the lane from this control
      target: >-
        Any disposition that over-closes H-DS-001 as reject_scoped /
        impossibility because packaging did not fire, or that treats
        packaging_expected_observed=false as mathematical proof of structure.
      statement: >-
        packaging_falsification_rule explicitly says a packaging-consistent
        outcome is NOT reject_scoped-as-impossibility on a single unreplicated
        empirical_only control. The converse also holds: packaging non-fire at
        saturated toy density is not structure proof (RT047-B2/B3/B4). Inventor
        protocol §4: a negative closure needs a named obstruction, argument, and
        forward guidance — a single cell is a fatigue-prone over-read if used to
        close either way. Prefer keep analyzed / inconclusive.
      which_way_it_cuts: >-
        Blocks both overclaim (S1_met) and over-close (reject_scoped-as-
        impossibility) from BATCH-020 alone.
      discharging_requirement: >-
        DEC disposition inconclusive (or refine/pause with explicit next
        control); H-DS-001 remains analyzed; no impossibility language.

    - id: RT047-B6
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: No scope creep into H-IC-001 / H-STR-002; remint DEC id
      target: >-
        Any status change to H-IC-001 or H-STR-002; any write of DEC-20260731-011
        for this ECDLP ledger close.
      statement: >-
        Contract and handoff forbid altering H-IC-001 / H-STR-002. Snapshot
        receipt already records DEC-20260731-011 collision with GOAL-ECTD-001;
        TASK-048 must remint DEC-20260731-012 (or later) and must not overwrite
        ECTD DEC-011.
      which_way_it_cuts: >-
        Blocks cross-hypothesis and DEC-id collision failures.
      discharging_requirement: >-
        Leave H-IC-001/H-STR-002 unchanged; remint decision id before ledger
        archive.

  required_controls:
    - id: CTRL-RT025-PLANT-INDEPENDENT
