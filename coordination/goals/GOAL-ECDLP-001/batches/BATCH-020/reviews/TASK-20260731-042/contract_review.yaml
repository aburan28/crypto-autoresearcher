objections:
  - id: R-1
    severity: MAJOR
    title: Live-plant companion must not rewrite primary unplanted R
    status: OPEN_NONBLOCKING
    detail: >-
      companion_live_plant method says "on one real-arm measurement of the same
      cell" without an explicit sentence that primary unplanted R / R_null in
      R_cell.json are measured with the /4 plant OFF, and that live /4 applies
      only in the companion detection path reported in live_plant_report.json.
      Confounding primary R with the plant would artificially depress R and bias
      toward a structure-win reading.
    why_not_revise: >-
      Field is named companion_live_plant; required artifacts separate
      R_cell.json from live_plant_report.json; packaging_falsification_rule
      treats "live plant detected" as an AND conjunct beside unplanted R;
      parent v2 CTRL-NULL-PLANT and the existing ds001_driver pattern compute
      a detection-path fake_R without replacing primary R. Binding reading for
      Executor/Validator: plant OFF on primary unplanted costs; live /4 only in
      the companion detection report; synthetic OR-path remains forbidden.
    discharge: >-
      Optional clarifying sentence in a future control note outside this
      RC-20 cycle. For BATCH-020 execution, apply the binding reading above.

  - id: R-2
    severity: MINOR
    title: cell_wall prefers 7200s but allows shorter as deviation
    status: OPEN_NONBLOCKING
    detail: >-
      budget.note prefers contractual cell_wall 7200s from specification.v2.yaml
      but permits a shorter wall if recorded as protocol deviation. Planted
      package previously used 90s (RT038-M2). Underpowering remains possible.
    why_not_revise: >-
      DEC-009 next_action requires relations_target=200 or honest
      resource_exhaustion, not a hard 7200s wall. Deviation labeling is honest
      under AGENTS rule 5.
    discharge: >-
      Executor should use 7200s unless an honest resource stop fires earlier;
      Validator must flag any shorter wall as deviation, not as math evidence.

  - id: I-1
    severity: INFORMATIONAL
    title: CTRL-RT025-RHO-CALIB and HEUR-OBJECT remain outstanding for S1_met
    detail: >-
      RT-20260731-038 still lists CTRL-RT025-RHO-CALIB and
      CTRL-RT025-HEUR-OBJECT as STILL_REQUIRED. This addendum correctly scopes
      to DEC-009's exact next_action (unplanted + live plant) and does not
      pretend to clear those for mechanism support. claim_ceiling keeps
      RT038-B1–B7 + M1 binding on later promotion.
    discharge: null

  - id: I-2
    severity: INFORMATIONAL
    title: Coordinator note — queue/plan regeneration outside write_scope
    detail: >-
      TASK-20260731-042 write_scope is only
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/reviews/TASK-20260731-042.
      This reviewer cannot mark dispatch_queue.json completed or regenerate
      dispatch_plan. Coordinator must mark TASK-042 completed and regenerate
      so TASK-043 becomes ready.
    discharge: >-
      Coordinator: set TASK-20260731-042 state completed; regenerate BATCH-020
      dispatch plan; then run TASK-043. On this PASS, APPROVAL_DETERMINATION
      should be APPROVED if no post-review integrity failure.

