      The control does not constitute an end-to-end comparison with BSGS.
    closest_specialized: >-
      The relevant specialized baseline is actual naive Semaev/Groebner
      membership under sparse random targets. The backend here is exact
      point-sum enumeration plus frozen charged labels, so that baseline was
      not tested.

