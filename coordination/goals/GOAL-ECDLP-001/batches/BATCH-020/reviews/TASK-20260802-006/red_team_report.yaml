  claim_under_review: >-
    Whether the single frozen bits=20, B=64, m=4, seed=101 unplanted control
    discriminates planted-yield packaging from a structure-dependent claw win,
    and whether R=0.03204552524531826, R_null=111.54958054230949, 200/200
    usable targets on both real arms, and the failed live /4 plant can support
    anything stronger than an invalid toy control observation.

  verdict: >-
    BLOCKING: THE RUN IS AN INVALID TOY CONTROL AND DOES NOT DISCRIMINATE
    PACKAGING FROM STRUCTURE. The package honestly self-classifies
    invalid_measurement because the frozen live /4 plant was not detected.
    More fundamentally, the fixed absolute null threshold has no power in the
    observed null regime: R_null=111.5496 becomes 27.8874 after /4, still
    30.986 times above 0.9; a divisor greater than 123.944 would have been
    required merely to cross that threshold. The unplanted target source also
    did not create a sparse-yield control: both real arms decomposed 200/200
    uniformly sampled subgroup targets, so the cell remains a dense toy
    point-sum benchmark. The bootstrap interval [0.050283,0.136587] excludes
    its own reported R=0.032046 because it estimates per-hit sample ratios
    while R includes arm-level wall/table cost; R_null uncertainty is a
    degenerate point interval. Therefore neither branch of the frozen
    packaging_falsification_rule is established. RT038-B1 through B7 plus M1
    remain binding. Forbid S1_met, mechanism support, asymptotic promotion,
    reject_scoped-as-impossibility, GOAL completion, or any change to H-IC-001
    or H-STR-002.

  packaging_explicit_crypto_or_asymptotic_claim: false
  packaging_honestly_marks_invalid_measurement: true
  packaging_blocking_overclaim_exists: false
  interpretation_blocking_overclaim_risk: true
  packaging_falsification_rule_result: NOT_DISCRIMINATING_INVALID_CONTROL

  named_obstruction:
    id: RT047-OBSTRUCTION-NULL-DYNAMIC-RANGE
    name: Absolute-threshold saturation in an asymmetrically slow null arm
    argument: >-
      The live detector requires both R_live<0.5 and R_null_live<0.9. The
      implementation applies the same /4 mutation to split costs, so
      R_null_live=R_null/4. With baseline R_null=111.54958054230949, the
      largest possible conclusion from the prescribed mutation is
      R_null_live=27.88739513557737, not a flag. The failure is thus predicted
      by the gate's dynamic range and cannot distinguish an absent reporting
      fault from an insensitive detector. The prior RT038-B3 objection that
      null_split uses non-composing independent half-keys explains why this
      null baseline is orders of magnitude above the real ratio.
    forward_guidance: >-
      Keep the lane open but inconclusive. A successor control would first
      need a compositional, same-shape null whose unmutated ratio occupies the
      detector's useful range, and a live report-layer /4 mutation judged by a
      preregistered relative echo as well as an absolute artifact criterion.
      This report identifies that control but does not authorize or execute it.

  objections:
    - id: RT047-B1
      severity: BLOCKING ON DECISION
      title: Failed live plant invalidates the only purported control outcome
      statement: >-
        CTRL-RT025-PLANT-LIVE requires planted_bug_detected=true. The frozen
        path recorded false, and the manifest correctly marks the run invalid.
        The raw R/R_null values are diagnostics from a failed control, not
        admissible S1 evidence and not a mechanism falsification.
      binding_prior_constraints: [RT038-B3, RT038-B5, RT038-B7, RT038-M1]
    - id: RT047-B2
      severity: BLOCKING ON DECISION
      title: The /4 gate is underpowered by construction in the observed null regime
      statement: >-
        R_null/4=27.8874 cannot satisfy R_null_live<0.9. The required divisor
        would exceed 123.944. Calling this merely an unlucky failure hides the
        named gate-design obstruction; repeating the same frozen cell cannot
        repair detector power.
      binding_prior_constraints: [RT038-B3]
    - id: RT047-B3
      severity: BLOCKING ON DECISION
      title: Uniform-unplanted targets did not make relation yield sparse
      statement: >-
        Target construction is independent of the factor base, but 200/200
        targets were decomposed by each real arm in only 200 attempts. With
        B=64, signed lifts, m=4, and a toy group, the reachable four-sum space
        is dense. This removes planted construction without measuring the
        sparse success probability or inverse-success cost relevant to Semaev
        relation collection. No packaging-vs-structure inference follows from
        the observed 100 percent empirical yield.
      binding_prior_constraints: [RT038-B4, RT038-B7]
    - id: RT047-B4
      severity: BLOCKING ON DECISION
      title: The null is not algorithmically same-shape
      statement: >-
        null_naive samples a full-tuple hash oracle, whereas null_split joins
        independent L/R/J hash maps that intentionally do not compose and
        then verifies through the full oracle. Their ratio 111.55 mostly
        measures this asymmetric construction. R_null>=0.9 is therefore not
        evidence that the real split gain is structure-dependent.
      binding_prior_constraints: [RT038-B3]
    - id: RT047-B5
      severity: BLOCKING ON DECISION
      title: Bootstrap interval targets a different estimand from reported R
      statement: >-
        Reported R uses total arm wall divided by usable relations; the
        bootstrap resamples per-success attempt walls and omits the same
        arm-level/table contribution. Its lower endpoint is 1.569 times the
        point R, placing R outside its own interval. R_null_ci repeats one
        point and quantifies no uncertainty. The required honest CI excluding
        0.5 is not supplied.
      binding_prior_constraints: [RT038-M1]
    - id: RT047-B6
      severity: MAJOR
      title: Package-level validity labels are internally inconsistent
      statement: >-
        The manifest and summary say invalid_measurement, while R_cell.json
        retains status completed_valid; execution_report says
        protocol_complete=true and requires_rerun=true. Downstream records
        must treat only the run-level invalid status as authoritative and must
        not read cell completion as validity or Executor wording as rerun
        authorization.
    - id: RT047-B7
      severity: MAJOR
      title: Dirty-source replay binding is incomplete
      statement: >-
        The run manifest records code.commit=7b840f3d and dirty=true, but does
        not retain a dirty diff or hashes for imported harness/toycurve.py,
        harness/rho.py, and harness/semaev.py. Snapshot 59dbd8fd binds the
        modified driver and output package, but cannot prove that unarchived
        dirty imported bytes at execution matched the snapshot tree. This is
        a reproducibility limitation, not mathematical evidence either way.

  required_controls:
    - id: CTRL-RT047-SHAPE-MATCHED-LIVE-ECHO
      status: REQUIRED_BEFORE_INTERPRETATION_NOT_AUTHORIZED
      cheapest_valid_falsification: true
      description: >-
        Pre-register one toy cell using a compositional same-shape random null
        on which naive and split solve the same membership predicate and whose
        baseline ratio is in the gate's dynamic range. Inject the /4 error in
        the live report path for both real and null split costs; require the
        recorded ratios to change by 0.25 relative to their unmutated values
        and require the null echo to flag under a justified threshold. Preserve
        per-target successes/failures and total attempts so inverse-success
        cost can be charged. This report neither approves nor runs it.
      falsifies_if: >-
        The live /4 mutation is present in raw costs but the preregistered
        relative echo or justified null gate does not flag it.
    - id: CTRL-RT047-SPARSE-COVERAGE
      status: REQUIRED_FOR_YIELD_INTERPRETATION_NOT_AUTHORIZED
      description: >-
        Choose a preregistered toy parameter regime where the factor-base
        m-sum image occupies materially less than the target group, estimate
        coverage independently, and report successes over all attempted
        unplanted targets for both arms. Charge total attempted work divided
        by successes, not successful-hit wall alone.
      falsifies_if: >-
        A favourable per-success R disappears after inverse empirical success
        probability and table-build cost are charged.

  counterexample_or_mutation: >-
    The committed tuple itself is the cheapest counterexample to the detector:
    applying the prescribed /4 gives (R_live,R_null_live)=(0.0080114,27.8874),
    so a real injected reporting fault is not flagged. No new run is needed to
    establish this gate-power failure. The cheapest valid successor control is
    CTRL-RT047-SHAPE-MATCHED-LIVE-ECHO above; it is identified, not authorized.

