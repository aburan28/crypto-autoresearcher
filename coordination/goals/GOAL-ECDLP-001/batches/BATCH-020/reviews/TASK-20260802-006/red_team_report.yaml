  narrowest_supported_statement: >-
    Snapshot 59dbd8fd durably records that one toy unplanted-uniform
    point-sum cell completed 200/200 real-arm decompositions and emitted
    diagnostic R=0.0320455 and R_null=111.5496, after which the prescribed
    live /4 mutation yielded R_live=0.0080114 and R_null_live=27.8874 and was
    not detected. The run is invalid_measurement. It demonstrates a named
    dynamic-range obstruction in the frozen null gate and supports no
    packaging-vs-structure conclusion, S1_met, mechanism support, asymptotic
    promotion, scoped rejection, impossibility result, or crypto-scale ECDLP
