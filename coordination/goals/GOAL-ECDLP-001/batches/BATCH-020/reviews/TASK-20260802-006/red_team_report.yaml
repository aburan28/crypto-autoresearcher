    enumerated_closures:
      - scope: Frozen absolute-threshold /4 detector on this null regime
        mechanism: >-
          R_null/4=27.8874 remains above 0.9; threshold crossing would require
          a divisor greater than 123.944.
        status: CLOSED_AS_UNDERPOWERED_FOR_THIS_REGIME
      - scope: Packaging-versus-structure lane
        mechanism: >-
          Not closed. Dense 200/200 real-arm yield, mismatched null, invalid
