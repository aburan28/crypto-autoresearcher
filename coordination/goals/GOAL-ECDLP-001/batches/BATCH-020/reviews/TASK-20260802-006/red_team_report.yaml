  cost_model_challenges:
    - id: RT047-CM1
      challenge: >-
        cost_naive and cost_split are wall*rho_gop/success; backend_units do
        not enter R. The result is not algebraic membership cost.
    - id: RT047-CM2
      challenge: >-
        With empirical success 200/200, the run does not expose sparse-target
        inverse-success cost. No end-to-end per-attempt times inverse-success
        accounting is available.
    - id: RT047-CM3
      challenge: >-
        The split table is amortized over 200 successes, while the CI omits
        arm-level/table contributions. Cost point and uncertainty are not the
        same estimand.
    - id: RT047-CM4
      challenge: >-
        No relation rank B-1, linear algebra, target descent, source recovery,
        or scalar orientation is measured. R cannot be assembled into ECDLP
        cost.

  reduction_and_scope_challenges:
