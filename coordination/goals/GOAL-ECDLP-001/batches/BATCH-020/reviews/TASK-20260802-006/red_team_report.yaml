      - Live relative-echo detection for the report-layer /4 mutation.
      - Sparse-coverage unplanted targets with inverse-success cost charged.

  heuristic_challenges:
    - id: RT047-HC1
      challenge: >-
        HEUR-DS-1 remains failed at toy under EV-DS-002/RT038-B2 and was not
        rerun here. Unplanted point-sum success does not sample Semaev
        resultant/norm intermediates and cannot validate the heuristic.
    - id: RT047-HC2
      challenge: >-
        One 20-bit seed is neither replication nor cryptographic-scale
