toy_validation_protocol:
  schema: "crypto.autoresearch.toy_validation_protocol"
  version: "1.0.0-review"
  task_id: "TASK-20260724-301"
  terminal_verdict: "PROTOCOL_COMPLETE_REVIEW_REQUIRED"
  first_unsatisfied_obligation: null
  status: "review_only_protocol_design"
  binds_certificate_contract:
    schema: "crypto.autoresearch.rank_failure_conservation_certificate"
    version: "1.0.0-review"
    source_path: "coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-012/certificate_contract.yaml"
    source_sha256: "1ca204a0e16e88012892a0867aab5ea82d388fdfa1b0474938a0e2c8cffd8d9f"
  authorization_ref: "DEC-20260724-007"

  inference_receipt:
    requested_policy: "research-sol-max"
    resolved_model_id: "cursor-grok-4.5-high-fast"
    reasoning_effort: "high"
    available_reasoning_effort: "high"
    fallback_used: true
    adapter_version: "unavailable_not_exposed_by_cursor_runtime"
    authorization_ref: "DEC-20260724-007"
    equivalence_to_requested_policy_claimed: false

  claim_boundary:
    maximum_tier: "toy"
    passing_claim: >-
      At most, this package pins a review-only toy validation protocol under
      certificate contract 1.0.0-review with a concrete public fixture, sealed
      empty-or-pilot schedule template, independent verifier stub digest, and
      frozen group-operation vocabulary.
    prohibited_claims:
      - "an ECDLP attack improvement"
      - "a lower bound on ECDLP relation cost"
      - "a cryptographic-scale conclusion"
      - "a breakthrough or solution"
      - "authorization to implement or execute the campaign"
      - "equivalence of the fallback runtime to research-sol-max"
    exclusions:
      - "No implementation or experiment is authorized in this campaign."
      - "No live key, account, private target, or deployed system is in scope."
      - "The P1553 R4 target-label common-factor operation is excluded."

  public_fixture:
    fixture_id: "TOY-WEIERSTRASS-P53-ELL17-V1"
    fixture_version: "1.0.0"
    curve_or_group_parameters:
      form: "short_weierstrass"
      field_prime_decimal: "53"
      a_decimal: "1"
      b_decimal: "0"
      equation: "y^2 = x^3 + x over F_53"
      group_cardinality: "68"
      cofactor: "4"
    subgroup_order: "17"
    modulus_primality_method: "trial_division_upto_sqrt"
    generator_encoding_hex: "04060d"
    factor_base_points:
      - column_id: "FB1"
        point_encoding_hex: "04060d"
        point_sha256: "38504e0539e45ab1b7c4db06a6d864b1f1519cf00ae25a2d46a82e4f0f647a46"
      - column_id: "FB2"
        point_encoding_hex: "04182a"
        point_sha256: "b6d7dc09b7392439cdea71d06616bf679081b16b6c2c5c50fe252e33d296d2e2"
      - column_id: "FB3"
        point_encoding_hex: "040d0e"
        point_sha256: "89bcf99f9efae1bba3fa9a3c0c3470d32c0f7d17a2d13b574370a365803bf883"
    point_encoding_rule: >-
      Uncompressed SEC1-style 0x04 || x || y with each coordinate exactly one
      unsigned byte (ceil(bitlength(52)/8)=1) over F_53.
    independent_checks_required:
      - "Parse field_prime_decimal=53 and confirm primality."
      - "Confirm subgroup_order=17 is prime and equals ell for the field schema."
      - "Confirm each factor-base point lies on y^2=x^3+x over F_53."
      - "Confirm ell*P = identity for each factor-base point and the generator."
      - "Confirm encodings and point_sha256 bindings."
    fixture_canonical_json_sha256: "e9604173f1606052d4513e3d171bd0fe5abd0427c45f4b0018cb3309bc700088"
    fixture_sha256: "e9604173f1606052d4513e3d171bd0fe5abd0427c45f4b0018cb3309bc700088"
    note: >-
      fixture_sha256 is SHA-256 of the UTF-8 JSON object formed from the
      fixture fields fixture_id, fixture_version, curve_or_group_parameters,
      subgroup_order, modulus_primality_method, generator_encoding_hex, and
      factor_base_points with sorted keys and separators (',', ':').

  field_and_column_schema:
    field:
      kind: "prime_field"
      modulus_decimal: "17"
      modulus_primality_method: "trial_division_upto_sqrt"
      subgroup_order_binding: "equals public_fixture.subgroup_order"
    columns:
      - column_id: "FB1"
        point_encoding_hex: "04060d"
        point_sha256: "38504e0539e45ab1b7c4db06a6d864b1f1519cf00ae25a2d46a82e4f0f647a46"
      - column_id: "FB2"
        point_encoding_hex: "04182a"
        point_sha256: "b6d7dc09b7392439cdea71d06616bf679081b16b6c2c5c50fe252e33d296d2e2"
      - column_id: "FB3"
        point_encoding_hex: "040d0e"
        point_sha256: "89bcf99f9efae1bba3fa9a3c0c3470d32c0f7d17a2d13b574370a365803bf883"
    coefficient_width_bytes: 1
    canonical_row_format: "concatenate three one-byte big-endian coefficients in FB1,FB2,FB3 order"

  group_operation_type_vocabulary:
    version: "toy-group-op-v1"
    types:
      - id: "AFFINE_ADD"
        meaning: "affine point addition on the fixture curve"
      - id: "AFFINE_DOUBLE"
        meaning: "affine point doubling on the fixture curve"
      - id: "SCALAR_MUL_BIT"
        meaning: "one double-and-add bit step while forming a multiple"
      - id: "EQUALITY_TEST"
        meaning: "point equality or identity test"
      - id: "ENCODING_PARSE"
        meaning: "parse or serialize one canonical point encoding"
    counting_rule: >-
      Every counted group operation must use exactly one vocabulary id.
      Unknown ids invalidate resource conservation. Types are not fungible.
    aggregation: "sum counters per type; never sum across types into a scalar"

  independent_verifier:
    verifier_id: "indep-rank-fail-toy-v1"
    verifier_version: "0.1.0-spec-only"
    language: "specification_stub_not_executable"
    implementation_authorized: false
    algorithms:
      - "reparse_public_fixture"
      - "verify_point_on_curve"
      - "verify_subgroup_order_ell"
      - "verify_decomposition_sum"
      - "derive_canonical_row"
      - "exact_gaussian_elimination_over_F_ell"
    binds_contract_schema: "crypto.autoresearch.rank_failure_conservation_certificate"
    binds_contract_version: "1.0.0-review"
    artifact_sha256: "3d74cde9ed8121306ed21a8c4b6ed5a5344d787d81925b193fe68d581d83b8d7"
    artifact_digest_rule: >-
      SHA-256 of the UTF-8 JSON object of the independent_verifier block fields
      verifier_id, verifier_version, language, algorithms,
      binds_contract_schema, binds_contract_version, and
      implementation_authorized with sorted keys and separators (',', ':').
    note: >-
      This is a sealed specification stub digest, not an executable binary.
      A later separately budgeted experiment must replace or re-seal this with
      a concrete verifier artifact under a new Coordinator approval.

