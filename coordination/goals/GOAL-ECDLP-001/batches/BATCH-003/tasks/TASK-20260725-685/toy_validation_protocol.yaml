toy_validation_protocol:
  task_id: TASK-20260725-685
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-003
  status: review_only_design
  authorization: >-
    No implementation, solver, relation campaign, or experiment is authorized
    by this artifact. Runs remain unauthorized until this protocol receives
    independent review PASS.
  inference:
    requested_policy: research-sol-max
    resolved_model_id: cursor-grok-4.5-high-fast
    fallback_used: true
    authorization_ref: AMEND-PATH-001-001
    note: >-
      Produced in parent coordinator session after Task-tool API limits; model is authorized fallback under AMEND-PATH-001-001.
  contract:
    schema: crypto.autoresearch.rank_failure_conservation_certificate
    version: "1.0.0-review"
    claim_tier: toy
    field_bit_size_max: 32
  pins:
    public_fixture:
      fixture_id: FIXTURE-ECDLP-TOY-RANKFAIL-001
      fixture_version: "1.0.0"
      description: >-
        Public toy prime-field short-Weierstrass subgroup instance for
        certificate conservation validation only (≤32-bit field). Exact curve
        parameters, points, and encodings are sealed by fixture_sha256 before
        any later executable campaign; this design task does not mint private
        bytes.
      required_fields:
        - fixture_id
        - fixture_version
        - curve_or_group_parameters
        - subgroup_order
        - factor_base_points
        - fixture_sha256
      verifier_checks:
        - parameters match sealed bytes
        - point membership on curve
        - order check ell*P = O
      status: template_pinned_bytes_deferred_to_execution_batch
    sealed_schedule_template:
      mode: empty_or_pilot
      seal_before_activation: true
      required_root_fields:
        - contract_schema
        - contract_version
        - campaign_id
        - public_fixture
        - field
        - column_schema
        - canonical_row_format
        - terminal_vocabulary
        - resource_schema
        - probability_plan
        - attempts
        - initial_matrix
        - precommit
      schedule_sha256: null  # filled when a concrete schedule is sealed
      attempt_required_fields:
        - attempt_id
        - ordinal
        - seed_256_hex
        - fixture_sha256
        - worker_slot
        - stage_id
        - budget
        - retry_parent_id
        - activation_terminal_codes
        - statistical_stratum_id
        - probability_cohort_member
      constraints:
        - finite_acyclic_retry_graph
        - precommit_before_any_activation
    independent_verifier:
      identity_field: independent_verifier_identity
      artifact_sha256_field: independent_verifier_artifact_sha256
      obligation: >-
        Pin concrete independent_verifier_artifact_sha256 before any executable
        campaign. Relation receipts must carry independent_verifier_id/version/artifact_sha256.
      artifact_sha256: null  # filled when verifier binary/script is frozen
    group_operation_type_vocabulary:
      resource_schema: rank-failure-resource-v1
      field: group_operations_by_declared_type
      frozen_types:
        - add
        - dbl
        - mixed_add
        - scalar_mul_fixed_window
        - endomorphism_apply
        - equality_test
        - encode_decode
      note: >-
        Vocabulary is frozen inside the schedule object, not only in prose
        (TASK-20260722-014 residual).
  resource_vector:
    schema: rank-failure-resource-v1
    no_scalarization: true
    additive:
      - cpu_time_ns
      - group_operations_by_declared_type
      - io_read_bytes
      - io_write_bytes
      - communication_sent_bytes
      - communication_received_bytes
    non_additive:
      - campaign_elapsed_wall_ns
      - active_wall_union_ns
      - peak_memory_bytes_by_domain
      - campaign_peak_observed_bytes
      - retained_unique_bytes
    ownership_rules:
      - exclusive_work_id_has_exactly_one_owner
      - shared_work_id_has_one_registry_entry_weights_sum_to_1
      - double_owned_or_unowned_invalidates_conservation
    required_stages:
      - setup
      - relation_collection
      - linear_algebra
      - descent
      - verification
    comparison_rule: >-
      Coordinatewise dominance under identical counter conventions only;
      otherwise incomparable. If R_gain=0, resource-per-rank is undefined —
      do not fabricate a finite scalar.
  terminal_vocabulary: rank-failure-terminal-v1
  probability_gate:
    forbid: ceil(r/p_L)
    require: binomial_or_negative_binomial_tail_at_declared_alpha
    drop_finite_tail_if_within_stratum_iid_indefensible: true
  conservation_gates:
    - schedule_receipt_bijection
    - exhaustive_terminal_vocabulary
    - independent_decomposition_cert_to_canonical_row_to_exact_gaussian_rank
    - resource_vector_conservation
  controls:
    - id: CTRL-OMISSION
      mutation: remove_one_receipt
      expected: BIJECTION_MISSING_RECEIPT
    - id: CTRL-DUPLICATE-ID
      mutation: repeat_attempt_id
      expected: BIJECTION_DUPLICATE_ID
    - id: CTRL-RETRY-CYCLE
      mutation: mutual_retry_parents
      expected: SCHEDULE_RETRY_CYCLE
    - id: CTRL-FIELD-SCHEMA
      mutation: change_modulus_order_or_digest
      expected: FIELD_OR_SCHEMA_MISMATCH
    - id: CTRL-SHARED-DOUBLE
      mutation: shared_work_double_charged
      expected: SHARED_WORK_DOUBLE_COUNT
    - id: CTRL-SHARED-OMITTED
      mutation: shared_work_unowned
      expected: SHARED_WORK_UNOWNED
    - id: CTRL-CERTIFICATE-ROW
      mutation: valid_cert_wrong_summand_row
      expected: CERTIFICATE_ROW_MISMATCH_AND_ZERO_RANK
    - id: CTRL-WRONG-FIELD
      mutation: producer_rank_over_other_field
      expected: INDEPENDENT_RANK_MISMATCH
    - id: CTRL-CLEAN
      mutation: none
      expected: PASS_ONLY_IF_ALL_CONSERVATION_GATES_PASS
  claim_boundary:
    maximum_claim: >-
      Toy-tier conservation for a later sealed public/toy campaign under frozen
      schema and accepted probability assumptions.
    not_claimed:
      - attack_improvement
      - ecdlp_lower_bound
      - crypto_scale_conclusion
      - breakthrough
      - solution
      - universal_impossibility
    exclusions:
      - no_live_keys_or_private_targets
      - P1553_R4_out_of_scope
      - timeouts_infra_failures_are_costs_not_negative_math
  supersedes_failed_card: TASK-20260725-611
