  # ─────────────────────────────────────────────────────────────
  # GAP 1: CONCRETE PUBLIC TOY FIXTURE
  # ─────────────────────────────────────────────────────────────
  public_fixture:
    fixture_id: "TOY-P4-ECDLP-001"
    fixture_version: "1.0.0"
    curve_or_group_parameters:
      curve_model: "short_weierstrass"
      prime_field_modulus_decimal: "11"
      coefficient_a_decimal: "1"
      coefficient_b_decimal: "6"
      equation: "y^2 = x^3 + a*x + b over F_p"
      group_order_decimal: "13"
      group_order_primality: "prime"
    subgroup_order: "13"
    subgroup_order_primality_method: "trial_division_by_primes_le_3_since_sqrt_13_lt_4"
    subgroup_order_binding: >-
      13 is prime (no divisor in {2,3} since 13 mod 2 = 1 and 13 mod 3 = 1;
      sqrt(13) < 4 so trial division is exhaustive). The full group E(F_11)
      has order 13, making every non-identity point a generator of the
      prime-order subgroup. Every named factor-base point P satisfies
      13*P = identity on E: y^2 = x^3 + x + 6 over F_11.
    generator_point:
      x_decimal: "2"
      y_decimal: "4"
      encoding_hex: "040204"
    factor_base_points:
      - column_id: "col-1"
        label: "G"
        x_decimal: "2"
        y_decimal: "4"
        encoding_hex: "040204"
        point_sha256: "14c0e459b7a8ff79f3d4867c8455d6bc0f963a20d7ff4940ba8ebac31cc7af14"
        discrete_log_wrt_generator_decimal: "1"
      - column_id: "col-2"
        label: "2G"
        x_decimal: "5"
        y_decimal: "9"
        encoding_hex: "040509"
        point_sha256: "6188b0fcb2b58cf35fca4c5e9292e903bfb19babc58b4e1bb416ae453e35c95a"
        discrete_log_wrt_generator_decimal: "2"
      - column_id: "col-3"
        label: "3G"
        x_decimal: "8"
        y_decimal: "8"
        encoding_hex: "040808"
        point_sha256: "f9c2ecc090c3efefaae83e5a0b7d1dfd76498b803cbcb0d890fac25b1917bee6"
        discrete_log_wrt_generator_decimal: "3"
      - column_id: "col-4"
        label: "5G"
        x_decimal: "3"
        y_decimal: "5"
        encoding_hex: "040305"
        point_sha256: "40d8597ea9a489ae7d1e43e93de718c7c5ccdf3299fd58493b2f6f777d51550d"
        discrete_log_wrt_generator_decimal: "5"
    canonical_point_encoding:
      identity_hex: "00"
      finite_point_prefix_hex: "04"
      layout: "prefix_byte || byte(x) || byte(y)"
      byte_encoding: "unsigned 8-bit big-endian, one byte per coordinate"
      field_element_range: "0 to 10 inclusive (F_11 coordinates)"
    fixture_sha256: "1b5478a65d39461b6730089dae403c0d57b98c03f39b522a76cf55b28fd0b4cb"
    fixture_sha256_computation: >-
      sha256(JCS(fixture_object_without_fixture_sha256_field)) where JCS is
      RFC 8785 canonicalization with keys sorted by UTF-16 code unit order,
      no whitespace, and all integer values serialized as base-10 strings.
    fixture_verification:
      group_order_check: "#E(F_11) = 13 verified by enumerating all (x,y) in {0..10}^2 satisfying y^2 = x^3 + x + 6 mod 11 plus the identity"
      generator_order_check: "13 * (2,4) = O verified by repeated affine addition"
      factor_base_order_checks:
        - "13 * (2,4) = O"
        - "13 * (5,9) = O"
        - "13 * (8,8) = O"
        - "13 * (3,5) = O"
      sample_relation_check: >-
        P_col-1 = 3*P_col-3 + P_col-4 verified: G = 3*(3G) + 5G = 9G + 5G =
        14G = G (mod 13). Derived row (a_col-1, a_col-2, a_col-3, a_col-4) =
        (12, 0, 3, 1); dot product with discrete logs (1,2,3,5) mod 13 = 0.

  # ─────────────────────────────────────────────────────────────
  # FIELD FOR RANK COMPUTATION (F_13 = F_subgroup_order)
  # ─────────────────────────────────────────────────────────────
  field:
    kind: "prime_field"
    modulus_decimal: "13"
    modulus_primality_method: "trial_division_by_primes_le_3_since_sqrt_13_lt_4"
    subgroup_order_binding: >-
      modulus_decimal equals fixture subgroup_order; every named factor-base
      point P satisfies 13*P = identity on E y^2=x^3+x+6 over F_11.
    field_schema_sha256: "e3788b29abdddc770b33cede330ad60361c94d5394e3e8acb800d2645e176af7"
    field_arithmetic: >-
      All rank-computation arithmetic is modulo 13. Modular inverses computed
      via Fermat's little theorem: a^{-1} = a^{11} mod 13 for a in {1..12}.

  # ─────────────────────────────────────────────────────────────
  # COLUMN SCHEMA (ordered factor-base points)
  # ─────────────────────────────────────────────────────────────
  column_schema:
    column_order: ["col-1", "col-2", "col-3", "col-4"]
    columns:
      - column_id: "col-1"
        point_encoding_hex: "040204"
        point_sha256: "14c0e459b7a8ff79f3d4867c8455d6bc0f963a20d7ff4940ba8ebac31cc7af14"
      - column_id: "col-2"
        point_encoding_hex: "040509"
        point_sha256: "6188b0fcb2b58cf35fca4c5e9292e903bfb19babc58b4e1bb416ae453e35c95a"
      - column_id: "col-3"
        point_encoding_hex: "040808"
        point_sha256: "f9c2ecc090c3efefaae83e5a0b7d1dfd76498b803cbcb0d890fac25b1917bee6"
      - column_id: "col-4"
        point_encoding_hex: "040305"
        point_sha256: "40d8597ea9a489ae7d1e43e93de718c7c5ccdf3299fd58493b2f6f777d51550d"
    fixture_sha256: "1b5478a65d39461b6730089dae403c0d57b98c03f39b522a76cf55b28fd0b4cb"
    field_schema_sha256: "e3788b29abdddc770b33cede330ad60361c94d5394e3e8acb800d2645e176af7"
    column_schema_sha256: "7b348668293595206ffdc2f4593e44fcac78e5a850b4254a28c57029f0652175"
    column_schema_sha256_computation: >-
      sha256(JCS(column_schema_object_without_column_schema_sha256_field)).
      The schema digest binds fixture_sha256, field_schema_sha256, column
      order, column IDs, point encodings, and point hashes.

  # ─────────────────────────────────────────────────────────────
  # CANONICAL ROW FORMAT
  # ─────────────────────────────────────────────────────────────
  canonical_row_format:
    coefficient_width_bytes: "1"
    coefficient_width_derivation: "ceil(bit_length(13-1)/8) = ceil(4/8) = 1"
    bytes_rule: >-
      Concatenate each derived coefficient in frozen column order
      (col-1, col-2, col-3, col-4) as exactly 1 unsigned big-endian byte,
      value in [0, 12].
    row_hash_rule: >-
      sha256(UTF8("rank-row-v1\0") || bytes.fromhex(column_schema_sha256) ||
      canonical_row_bytes)
    equation_hash_rule: >-
      sha256(UTF8("rank-equation-v1\0") || bytes.fromhex(column_schema_sha256) ||
      bytes.fromhex(statement_sha256) || canonical_row_bytes)
    zero_row_rule: "A verified zero row (all coefficients 0) is dependent and gains zero rank."
    derived_coefficients_rule: >-
      For each ordered column j, a_j is the number of appearances of j among
      summand_column_ids minus one when j equals target_column_id, reduced to
      the unique integer in [0, 12].

  # ─────────────────────────────────────────────────────────────
  # TERMINAL VOCABULARY (carried forward from contract)
  # ─────────────────────────────────────────────────────────────
  terminal_vocabulary:
    version: "rank-failure-terminal-v1"
    codes:
      RELATION_VALID:
        lifecycle_status: "completed_valid"
        meaning: "a candidate relation passed independent group and row verification"
      RELATION_INVALID:
        lifecycle_status: "completed_invalid"
        meaning: "a candidate relation or its row binding failed independent verification"
      NO_RELATION_WITHIN_BUDGET:
        lifecycle_status: "completed_valid"
        meaning: "the activated attempt ended without a relation inside its frozen budget"
      INFRASTRUCTURE_FAILURE:
        lifecycle_status: "failed_infrastructure"
        meaning: "the environment failed; this is not mathematical evidence"
      IMPLEMENTATION_FAILURE:
        lifecycle_status: "failed_implementation"
        meaning: "the implementation failed; this is not mathematical evidence"
      RESOURCE_EXHAUSTION:
        lifecycle_status: "resource_exhaustion"
        meaning: "a frozen non-time resource cap was reached"
      BUDGET_CANCELLATION:
        lifecycle_status: "cancelled_by_budget"
        meaning: "the Coordinator's frozen campaign budget cancelled the attempt"
      TIMEOUT_CENSORED:
        lifecycle_status: "cancelled_by_budget"
        meaning: "the frozen wall cap was reached; latent completion time is unobserved"
      NOT_ACTIVATED:
        lifecycle_status: null
        meaning: "a precommitted retry activation predicate evaluated false"
    exhaustive: true
    extension_rule: "A new code requires a versioned contract and a new schedule seal."

  # ─────────────────────────────────────────────────────────────
  # GAP 4: FROZEN GROUP-OPERATION TYPE VOCABULARY
  # ─────────────────────────────────────────────────────────────
  group_operation_type_vocabulary:
    version: "rank-failure-group-ops-v1"
    types:
      POINT_ADD:
        description: >-
          Affine point addition P + Q on the declared curve, where P and Q
          are finite, distinct, and P is not equal to plus-or-minus Q.
        counts_as: 1
        counting_rule: >-
          Each invocation of the affine addition formula (one field inversion
          for the slope, two field multiplications, field subtractions for
          coordinates) counts as exactly one POINT_ADD, regardless of operand
          source or purpose.
      POINT_DOUBLE:
        description: >-
          Affine point doubling 2*P on the declared curve, where P is finite
          and not the identity.
        counts_as: 1
        counting_rule: >-
          Each invocation of the affine doubling formula (one field inversion
          for the slope using 3*x^2+a, field multiplications and subtractions
          for coordinates) counts as exactly one POINT_DOUBLE.
      POINT_NEGATE:
        description: >-
          Affine point negation -P = (x, p - y mod p) on the declared curve.
        counts_as: 1
        counting_rule: >-
          Each computation of the negation of a finite point counts as exactly
          one POINT_NEGATE. This is a single field subtraction p - y.
      POINT_IDENTITY_TEST:
        description: >-
          Test whether a point representation is the group identity O.
        counts_as: 1
        counting_rule: >-
          Each membership test for the identity element counts as exactly one
          POINT_IDENTITY_TEST.
      POINT_MEMBERSHIP_TEST:
        description: >-
          Test whether (x, y) satisfies the curve equation
          y^2 = x^3 + a*x + b (mod p) for the declared curve.
        counts_as: 1
        counting_rule: >-
          Each curve-equation check counts as exactly one
          POINT_MEMBERSHIP_TEST. This includes computing y^2 and x^3 + a*x + b
          modulo p and comparing.
      SCALAR_MULT_ORDER_CHECK:
        description: >-
          Full scalar multiplication ell*P to verify subgroup membership
          (ell*P = identity), where ell is the declared subgroup order.
        counts_as: 1
        counting_rule: >-
          Each complete ell*P computation counts as exactly one
          SCALAR_MULT_ORDER_CHECK, reported as a single unit. Its internal
          doublings and additions are NOT additionally counted under
          POINT_DOUBLE or POINT_ADD to prevent double-counting. This type
          captures the composite operation as one indivisible unit.
    exhaustive: true
    no_open_ended_types: true
    exclusion_rule: >-
      No operation type outside this vocabulary may be charged to the
      group_operations_by_declared_type resource coordinate. Compound
      operations decompose into these primitives. Point subtraction P - Q
      decomposes into POINT_NEGATE plus POINT_ADD. Scalar multiplication k*P
      for general k (not the order check) decomposes into a sequence of
      POINT_DOUBLE and POINT_ADD operations, each counted individually.
    aggregation_rule: >-
      group_operations_by_declared_type is a map from type name to nonnegative
      integer count. It is an additive coordinate: campaign total is the
      coordinatewise sum of per-attempt vectors plus the verification-stage
      vector. The zero vector for an attempt with no group operations is
      {POINT_ADD: 0, POINT_DOUBLE: 0, POINT_NEGATE: 0, POINT_IDENTITY_TEST: 0,
      POINT_MEMBERSHIP_TEST: 0, SCALAR_MULT_ORDER_CHECK: 0}.

  # ─────────────────────────────────────────────────────────────
  # RESOURCE SCHEMA
  # ─────────────────────────────────────────────────────────────
  resource_schema:
    version: "rank-failure-resource-v1"
    no_scalarization: true
    additive_coordinates:
      - "cpu_time_ns"
      - "group_operations_by_declared_type"
      - "io_read_bytes"
      - "io_write_bytes"
      - "communication_sent_bytes"
      - "communication_received_bytes"
    nonadditive_coordinates:
      - "campaign_elapsed_wall_ns"
      - "active_wall_union_ns"
      - "peak_memory_bytes_by_domain"
      - "campaign_peak_observed_bytes"
      - "retained_unique_bytes"
    group_operation_type_vocabulary_ref: "rank-failure-group-ops-v1"
    attempt_resource_required:
      - "counter_source"
      - "counter_coverage"
      - "cpu_time_ns"
      - "wall_interval_monotonic_ns"
      - "group_operations_by_declared_type"
      - "io_read_bytes"
      - "io_write_bytes"
      - "communication_sent_bytes"
      - "communication_received_bytes"
      - "memory_domain_id"
      - "peak_memory_bytes"
      - "retained_object_sha256"
      - "exclusive_work_ids"
      - "shared_work_ids"
    ownership_registry:
      exclusive_rule: "Every exclusive work_id has exactly one owner attempt or named campaign stage."
      shared_rule: >-
        Every shared_work_id occurs exactly once in the campaign shared-work
        registry, has one measured vector, and lists rational attribution
        weights whose nonnegative numerators/denominators sum exactly to one.
        Receipt references do not add the shared vector again.
      unowned_or_duplicate_rule: "Any work_id with zero or multiple registry owners invalidates resource conservation."
      retained_rule: >-
        Each retained object is keyed by content SHA-256, has one byte size and
        one owner; retained_unique_bytes is the sum over unique object hashes.
    aggregation:
      cpu_and_counters: "coordinatewise sum of exclusive vectors plus each shared vector exactly once"
      wall_elapsed: "max(finished)-min(started) over activated work on the campaign monotonic clock"
      active_wall_union: "Lebesgue length in integer nanoseconds of the union of activated work intervals"
      peak_memory: >-
        Preserve each memory-domain peak and a separately observed campaign
        peak. Never sum peaks. A missing campaign monitor is declared missing,
        not reconstructed from per-process peaks.
      retained_bytes: "sum unique retained object sizes; never sum repeated references"
      audit_overhead: "receipt creation and independent verification are named stages and are included"
    required_stages:
      - "setup"
      - "relation_collection"
      - "linear_algebra"
      - "descent"
      - "verification"
    comparison_rule: >-
      No cross-unit sum is permitted. A comparison is allowed only under one
      predeclared coordinatewise dominance rule with identical counter
      conventions and resource coverage, plus separately declared wall and
      memory caps. Otherwise the campaigns are incomparable.

  # ─────────────────────────────────────────────────────────────
  # PROBABILITY GATE (trivially satisfied: r=0, n=0)
  # ─────────────────────────────────────────────────────────────
  probability_plan:
    version: "rank-yield-tail-v1"
    purpose: >-
      Bound a finite count of unconditional attempts for r verified
      incremental-rank successes. This is not a lower bound on required work.
    declared_r_total: "0"
    declared_n_total: "0"
    alpha_campaign: "0"
    strata: []
    gate_status: "trivially_satisfied"
    gate_reason: >-
      r=0 implies n_star=0 per the contract edge case. With zero scheduled
      attempts and zero required rank units, the tail gate is trivially
      satisfied. No probability claim is made beyond this trivial case.
    assumptions_held: >-
      The fixed-IID stratified model is vacuously satisfied when there are no
      strata and no probability-cohort members. No within-stratum independence
      claim is needed. No calibration sample is required.

