          point_encoding_hex: "040808"
          point_sha256: "f9c2ecc090c3efefaae83e5a0b7d1dfd76498b803cbcb0d890fac25b1917bee6"
        - column_id: "col-4"
          point_encoding_hex: "040305"
          point_sha256: "40d8597ea9a489ae7d1e43e93de718c7c5ccdf3299fd58493b2f6f777d51550d"
      fixture_sha256: "1b5478a65d39461b6730089dae403c0d57b98c03f39b522a76cf55b28fd0b4cb"
      field_schema_sha256: "e3788b29abdddc770b33cede330ad60361c94d5394e3e8acb800d2645e176af7"
    canonical_row_format:
      coefficient_width_bytes: "1"
      bytes_rule: >-
        Concatenate each derived coefficient in frozen column order
        (col-1, col-2, col-3, col-4) as exactly 1 unsigned big-endian byte,
        value in [0, 12].
      row_hash_rule: >-
        sha256(UTF8("rank-row-v1\0") || bytes.fromhex(column_schema_sha256) ||
        canonical_row_bytes)
      equation_hash_rule: >-
        sha256(UTF8("rank-equation-v1\0") || bytes.fromhex(column_schema_sha256) ||
        bytes.fromhex(statement_sha256) || canonical_row_bytes)
      zero_row_rule: "A verified zero row (all coefficients 0) is dependent and gains zero rank."
    terminal_vocabulary:
      version: "rank-failure-terminal-v1"
      exhaustive: true
      extension_rule: "A new code requires a versioned contract and a new schedule seal."
      codes:
        - "RELATION_VALID"
        - "RELATION_INVALID"
        - "NO_RELATION_WITHIN_BUDGET"
        - "INFRASTRUCTURE_FAILURE"
        - "IMPLEMENTATION_FAILURE"
        - "RESOURCE_EXHAUSTION"
        - "BUDGET_CANCELLATION"
        - "TIMEOUT_CENSORED"
        - "NOT_ACTIVATED"
    resource_schema:
      version: "rank-failure-resource-v1"
      no_scalarization: true
      additive_coordinates:
        - "cpu_time_ns"
        - "group_operations_by_declared_type"
        - "io_read_bytes"
        - "io_write_bytes"
        - "communication_sent_bytes"
        - "communication_received_bytes"
      nonadditive_coordinates:
        - "campaign_elapsed_wall_ns"
        - "active_wall_union_ns"
        - "peak_memory_bytes_by_domain"
        - "campaign_peak_observed_bytes"
        - "retained_unique_bytes"
      group_operation_type_vocabulary_version: "rank-failure-group-ops-v1"
      required_stages:
        - "setup"
        - "relation_collection"
        - "linear_algebra"
        - "descent"
        - "verification"
    probability_plan:
      version: "rank-yield-tail-v1"
      declared_r_total: "0"
      declared_n_total: "0"
      alpha_campaign: "0"
      strata: []
      gate_status: "trivially_satisfied"
    attempts: []
    initial_matrix:
      row_count: "0"
      canonical_rows_sha256: "6a34d0c8f94d22958b0317877dce11d2b96f461fa9ad2835b51f3475662790f3"
      rank: "0"
      field_schema_sha256: "e3788b29abdddc770b33cede330ad60361c94d5394e3e8acb800d2645e176af7"
      column_schema_sha256: "7b348668293595206ffdc2f4593e44fcac78e5a850b4254a28c57029f0652175"
      canonical_rows_sha256_computation: >-
        sha256(UTF8("rank-row-v1\0") || bytes.fromhex(column_schema_sha256) ||
        b"") — the empty concatenation of zero canonical row bytes, with the
        row domain separator and column schema hash as domain separators.
    precommit:
      schedule_sha256: "6566e8bab496e9c8cc60a4754c3e95e9056d8dcac5ff155e4409064c2e1ab270"
      schedule_path: "coordination/goals/GOAL-ECDLP-001/batches/BATCH-003/tasks/TASK-20260725-001/toy_validation_protocol.yaml"
      coordinator_snapshot_receipt_path: "to-be-filled-by-TASK-20260725-002"
      snapshot_commit_sha: "to-be-filled-by-TASK-20260725-002"
      snapshot_parent_sha: "to-be-filled-by-TASK-20260725-002"
      verified_before_execution: "to-be-filled-by-TASK-20260725-002"
      schedule_sha256_computation: >-
        sha256(JCS(schedule_object_without_schedule_sha256_field)) where the
        schedule object includes all root fields: contract_schema,
        contract_version, campaign_id, public_fixture, field, column_schema,
        canonical_row_format, terminal_vocabulary, resource_schema,
        probability_plan, attempts (empty), initial_matrix, and precommit
        (without schedule_sha256).
      placeholder_explanation: >-
        Snapshot commit references (coordinator_snapshot_receipt_path,
        snapshot_commit_sha, snapshot_parent_sha, verified_before_execution)
        are placeholders marked to-be-filled-by-TASK-20260725-002 because no
        snapshot commit exists at review-only time. The precommit seal
        structure is present and structurally valid; the placeholder values
        will be replaced with actual Git commit references when the
        Coordinator creates the snapshot archival commit.
      ordering_gate: >-
        The Coordinator's snapshot verifier must accept the exact schedule
        bytes and commit before any attempt is activated. Every receipt
        repeats schedule_sha256. A missing, changed, or post-execution seal
        invalidates the campaign certificate. With zero attempts, no
        activation is possible, so the seal gate is trivially enforced.
    attempt_identity_rules:
      - "attempt_id values are unique nonempty ASCII strings"
      - "ordinal values are unique and contiguous from zero"
      - "seed_256_hex is exactly 64 lowercase hexadecimal characters"
      - "every retry parent is null or names an earlier ordinal"
      - "every non-root has exactly one retry parent"
      - "roots have retry_parent_id null and an empty activation list"
      - "the retry graph is a directed acyclic rooted forest"
      - "all possible retries are listed before execution"
      - "no attempt or retry may be appended after the precommit seal"
    empty_schedule_justification: >-
      An empty sealed template (zero attempts) is the safest review-only
      choice. It trivially satisfies: the schedule/receipt bijection (empty
      set = empty set, 0 = 0), the retry forest acyclicity (zero nodes), the
      activation predicate recomputation (no predicates), and the probability
      gate (r=0 implies n_star=0). It pins the fixture, field, column schema,
      row format, terminal vocabulary, resource schema, and group-operation
      type vocabulary without authorizing any execution.

  # ─────────────────────────────────────────────────────────────
  # GAP 3: INDEPENDENT VERIFIER IDENTITY, VERSION, ARTIFACT SHA-256
  # ─────────────────────────────────────────────────────────────
  independent_verifier:
    verifier_id: "independent-gaussian-rank-verifier-toy-v1"
    verifier_version: "0.1.0-spec"
    implementation_status: "specification_only_not_yet_implemented_review_only"
    independence_statement: >-
      This verifier specification is independent of the producer solver path.
      It reparses the public fixture, recomputes group sums, derives
      coefficients, computes canonical rows, and performs exact Gaussian
      elimination over F_ell without using any producer solver state.
    artifact_sha256: "d0ccd87df0f9718dc0edb7d28115b41a0833a63e2a968b8af19824acd66a54e8"
    artifact_sha256_computation: >-
      sha256(JCS(verifier_specification_object)) where the verifier
      specification object is the self-contained JSON document defined below
      in verifier_specification. This hash binds the verifier's declared
      algorithm, checks, field, and rank computation method.
    algorithm: "exact_gaussian_elimination_over_declared_prime_field"
    prime_field_modulus_decimal: "13"
    verifier_specification:
      checks_performed:
        - "reparse_public_fixture_without_producer_state"
        - "verify_each_point_on_curve_y_squared_equals_x_cubed_plus_ax_plus_b_mod_11"
        - "verify_13_times_each_point_equals_identity"
        - "for_each_relation_certificate_recompute_group_sum_of_summands_and_compare_to_target"
        - "derive_coefficients_independently_from_target_and_summand_column_ids"
        - "compute_canonical_row_bytes_in_frozen_column_order"
        - "compute_row_hash_and_equation_hash_per_contract_domain_separators"
        - "compare_declared_row_sha256_and_equation_sha256_to_independently_derived_values"
        - "perform_exact_gaussian_elimination_over_F_13_for_incremental_rank"
        - "verify_schedule_receipt_bijection_set_cardinality_multiplicity"
        - "recompute_activation_predicates_in_ordinal_order"
        - "verify_terminal_code_consistency_and_resource_ownership"
        - "verify_all_planted_controls_produce_expected_verdicts"
      rank_computation:
        method: "exact Gaussian elimination with partial pivoting over F_13"
        field_arithmetic: >-
          all arithmetic modulo 13 using modular inverse via Fermat's little
          theorem since 13 is prime
        insertion_order: "ascending schedule ordinal"
        rank_increment_domain: "{0, 1}"
        row_dispositions:
          - "independent"
          - "exact_duplicate"
          - "dependent_nonduplicate"
          - "invalid_or_absent"
      resource_counting: >-
        Verifier operations are counted under the same
        group_operations_by_declared_type vocabulary and charged to the
        verification stage.

  # ─────────────────────────────────────────────────────────────
  # TERMINAL RECEIPT SCHEMA (carried forward from contract)
  # ─────────────────────────────────────────────────────────────
  terminal_receipt:
    required_fields:
      - "receipt_schema"
      - "receipt_version"
      - "campaign_id"
      - "schedule_sha256"
      - "attempt_id"
      - "ordinal"
      - "seed_256_hex"
      - "retry_parent_id"
      - "activated"
      - "terminal_code"
      - "started_monotonic_ns"
      - "finished_monotonic_ns"
      - "resource_vector"
      - "relation"
      - "producer_artifact_hashes"
    immutable_rule: "One JCS receipt object per schedule node; corrections create a superseding campaign."
    echo_rule: >-
      campaign, schedule, attempt, ordinal, seed, retry parent, fixture,
      worker, stage, budget, and schema values must equal the sealed schedule.
    not_activated_rule: >-
      terminal_code is NOT_ACTIVATED, activated is false, relation is absent,
      and every attempt-owned additive counter is zero. Campaign verifier work
      is charged separately to the verification stage.
    relation_block:
      required_when_present:
        - "certificate"
        - "certificate_sha256"
        - "declared_row_sha256"
        - "declared_equation_sha256"
        - "independent_verifier_id"
        - "independent_verifier_version"
        - "independent_verifier_artifact_sha256"
        - "certificate_verified"
        - "independently_derived_row_sha256"
        - "independently_derived_equation_sha256"
      independent_verifier_id: "independent-gaussian-rank-verifier-toy-v1"
      independent_verifier_version: "0.1.0-spec"
      independent_verifier_artifact_sha256: "d0ccd87df0f9718dc0edb7d28115b41a0833a63e2a968b8af19824acd66a54e8"
      mismatch_rule: >-
        Any certificate failure, field/schema mismatch, or mismatch between a
        declared and independently derived row/equation forces
        RELATION_INVALID and zero rank credit while retaining all resources.

  # ─────────────────────────────────────────────────────────────
  # SCHEDULE/RECEIPT BIJECTION (carried forward from contract)
  # ─────────────────────────────────────────────────────────────
  schedule_receipt_bijection:
    set_identity: "set(schedule.attempt_id) = set(receipt.attempt_id)"
    cardinality_identity: "count(schedule.attempts) = count(receipts)"
    multiplicity: "each schedule attempt_id and receipt attempt_id occurs exactly once"
    empty_schedule_case: >-
      With zero attempts: set() = set(), 0 = 0, no multiplicity violations.
      The bijection is trivially satisfied.
    verification_order:
      - "validate schedule canonicalization and preexecution seal"
      - "reject duplicate schedule IDs or ordinals"
      - "reject retry cycles, forward parents, or undeclared parents"
      - "validate receipt canonicalization and receipt-set digest"
      - "reject missing, extra, or duplicate receipt IDs"
      - "validate every schedule/receipt echoed field"
      - "recompute every activation predicate in ordinal order"
      - "validate terminal-code consistency and all resource ownership"
    failure_effect: >-
      Any bijection or retry-graph failure invalidates the campaign-level
      conservation certificate. Existing receipts remain preserved and no
      omitted attempt is imputed a mathematical result.

  # ─────────────────────────────────────────────────────────────
  # INDEPENDENT RANK VERIFICATION (carried forward, concrete F_13)
  # ─────────────────────────────────────────────────────────────
  independent_rank_verification:
    initial_matrix:
      row_count: "0"
      canonical_rows_sha256: "6a34d0c8f94d22958b0317877dce11d2b96f461fa9ad2835b51f3475662790f3"
      rank: "0"
      field_schema_sha256: "e3788b29abdddc770b33cede330ad60361c94d5394e3e8acb800d2645e176af7"
      column_schema_sha256: "7b348668293595206ffdc2f4593e44fcac78e5a850b4254a28c57029f0652175"
      rule: "The verifier reparses and recomputes the initial exact rank."
    insertion_order: "ascending schedule ordinal"
    candidate_eligibility: >-
      Only RELATION_VALID receipts with a matching independently derived row
      are eligible. Every other terminal code has rank_increment zero.
    algorithm_requirement: >-
      Recompute exact Gaussian elimination over the declared prime field F_13
      using an implementation independent of the producer's rank path.
    per_attempt_output:
      - "rank_before"
      - "rank_after"
      - "rank_increment"
      - "row_disposition"
    row_dispositions:
      - "independent"
      - "exact_duplicate"
      - "dependent_nonduplicate"
      - "invalid_or_absent"
    identities:
      - "rank_increment is rank_after-rank_before and belongs to {0,1}"
      - "independent iff rank_increment=1"
      - "exact_duplicate iff row hash appeared earlier and rank_increment=0"
      - "dependent_nonduplicate iff valid, not an exact duplicate, and rank_increment=0"
      - "final_rank = initial_rank + sum(rank_increment over all schedule ordinals)"
      - "R_gain = final_rank - initial_rank"
    zero_gain_cost_rule: "resource_per_rank is componentwise infinity when R_gain=0"
    empty_schedule_case: >-
      With zero attempts and initial rank 0: final_rank = 0, R_gain = 0.
      The conservation identity holds trivially: 0 - 0 = sum() = 0.

  # ─────────────────────────────────────────────────────────────
  # RELATION CERTIFICATE SCHEMA (carried forward from contract)
  # ─────────────────────────────────────────────────────────────
  relation_certificate:
    kind: "decomposition"
    statement: "target_column_point = sum of summand_column_points"
    required:
      - "fixture_sha256"
      - "curve_parameters"
      - "target_column_id"
      - "target_point_encoding"
      - "summand_column_ids"
      - "summand_point_encodings"
      - "statement_sha256"
      - "producer_certificate_sha256"
    independent_checks:
      - "reparse the public fixture without using producer solver state"
      - "apply the current decomposition verifier to curve, target, and summand points"
      - "check every referenced column and canonical point encoding"
      - "recompute the group sum and compare with the target point"
      - "derive coefficients independently from target and summand IDs"
    derived_coefficients: >-
      For each ordered column j, a_j is the number of appearances of j among
      summand_column_ids minus one when j equals target_column_id, reduced to
      the unique integer in [0, 12].

  # ─────────────────────────────────────────────────────────────
  # PLANTED CONTROLS (carried forward from contract)
  # ─────────────────────────────────────────────────────────────
  planted_controls:
    - id: "CTRL-OMISSION"
      mutation: "remove one receipt for a sealed schedule ID"
      expected_verdict: "BIJECTION_MISSING_RECEIPT"
    - id: "CTRL-DUPLICATE-ID"
      mutation: "repeat one attempt ID in schedule or receipts"
      expected_verdict: "BIJECTION_DUPLICATE_ID"
    - id: "CTRL-RETRY-CYCLE"
      mutation: "make two retry nodes parents of each other"
      expected_verdict: "SCHEDULE_RETRY_CYCLE"
    - id: "CTRL-FIELD-SCHEMA"
      mutation: "change field modulus, column order, or schema digest in one receipt"
      expected_verdict: "FIELD_OR_SCHEMA_MISMATCH"
    - id: "CTRL-SHARED-DOUBLE"
      mutation: "assign one shared work ID as measured work to two owners"
      expected_verdict: "SHARED_WORK_DOUBLE_COUNT"
    - id: "CTRL-SHARED-OMITTED"
      mutation: "reference shared work with no registry owner"
      expected_verdict: "SHARED_WORK_UNOWNED"
    - id: "CTRL-CERTIFICATE-ROW"
      mutation: "use a valid group certificate with a declared row from different summands"
      expected_verdict: "CERTIFICATE_ROW_MISMATCH_AND_ZERO_RANK"
    - id: "CTRL-WRONG-FIELD"
      mutation: "compute producer incremental rank over a different prime field"
      expected_verdict: "INDEPENDENT_RANK_MISMATCH"
    - id: "CTRL-CLEAN"
      mutation: "none"
      expected_verdict: "PASS_ONLY_IF_ALL_CONSERVATION_GATES_PASS"

  # ─────────────────────────────────────────────────────────────
  # CAMPAIGN CERTIFICATE OUTPUTS (carried forward from contract)
  # ─────────────────────────────────────────────────────────────
  campaign_certificate:
    required_outputs:
      - "schedule_sha256"
      - "receipt_set_sha256"
      - "bijection_verdict"
      - "retry_graph_verdict"
      - "relation_verification_manifest"
      - "field_schema_sha256"
      - "column_schema_sha256"
      - "initial_rank"
      - "final_rank"
      - "R_gain"
      - "incremental_rank_manifest"
      - "resource_vector_total"
      - "resource_coverage_gaps"
      - "probability_gate_verdict"
      - "control_results"
      - "independent_verifier_identity"
      - "independent_verifier_artifact_sha256"
      - "claim_boundary"
    concrete_values_for_empty_campaign:
      schedule_sha256: "6566e8bab496e9c8cc60a4754c3e95e9056d8dcac5ff155e4409064c2e1ab270"
      field_schema_sha256: "e3788b29abdddc770b33cede330ad60361c94d5394e3e8acb800d2645e176af7"
      column_schema_sha256: "7b348668293595206ffdc2f4593e44fcac78e5a850b4254a28c57029f0652175"
      initial_rank: "0"
      final_rank: "0"
      R_gain: "0"
      independent_verifier_identity: "independent-gaussian-rank-verifier-toy-v1"
      independent_verifier_artifact_sha256: "d0ccd87df0f9718dc0edb7d28115b41a0833a63e2a968b8af19824acd66a54e8"
    pass_rule: >-
      PASS requires exact schedule/receipt bijection, valid retry activation,
      independent relation-to-row verification, exact incremental rank,
      complete declared resource ownership, and every mandatory planted control
      producing its expected verdict. The probability subgate may pass only
      when all fixed-IID assumptions and alpha accounting are accepted.
    partial_or_failure_rule: >-
      A failed probability assumption blocks only the finite tail-budget claim.
      A failed conservation obligation invalidates the campaign certificate.
      Neither result is evidence against a mathematical mechanism.

  # ─────────────────────────────────────────────────────────────
  # SCOPED NO-GO TRIGGERS (all satisfied at review-only time)
  # ─────────────────────────────────────────────────────────────
  scoped_no_go_triggers:
    first_obligation_order:
      - obligation: "runtime_metadata_matches_authorization"
        status: "satisfied"
        evidence: "inference_receipt block records requested_policy, resolved model, fallback_used true, authorization_ref DEC-20260722-005"
      - obligation: "preexecution_schedule_can_be_sealed"
        status: "satisfied"
        evidence: "empty schedule with precommit seal structure present; schedule_sha256 computed"
      - obligation: "schedule_and_retry_graph_are_finite_and_acyclic"
        status: "satisfied"
        evidence: "zero nodes; empty forest is trivially finite and acyclic"
      - obligation: "terminal_vocabulary_is_exhaustive"
        status: "satisfied"
        evidence: "9 codes carried forward from contract v1.0.0-review; exhaustive=true"
      - obligation: "field_column_and_row_schema_are_exact"
        status: "satisfied"
        evidence: "F_13 prime field, 4 ordered columns, 1-byte coefficients, all schema hashes computed"
      - obligation: "schedule_receipt_bijection_is_reconstructible"
        status: "satisfied"
        evidence: "empty set = empty set, 0 = 0; trivially reconstructible"
      - obligation: "relation_and_row_are_independently_verifiable"
        status: "satisfied"
        evidence: "verifier spec pinned with artifact_sha256; independence statement recorded"
      - obligation: "incremental_rank_is_exactly_reconstructible"
        status: "satisfied"
        evidence: "exact Gaussian elimination over F_13 specified; initial rank 0 with 0 rows"
      - obligation: "resource_ownership_is_complete_without_scalarization"
        status: "satisfied"
        evidence: "resource vector schema with 6-type group-operation vocabulary; no scalarization"
      - obligation: "probability_assumptions_and_tail_gate_are_declared"
        status: "satisfied"
        evidence: "r=0, n=0, alpha_campaign=0, no strata; trivially satisfied gate"
      - obligation: "all_planted_controls_are_decisive"
        status: "satisfied"
        evidence: "9 controls carried forward from contract with expected verdicts"
    rule: >-
      Stop at the first failed item and report only that this version cannot
      certify the named toy/public campaign under its declared boundary. Do not
      infer universal impossibility, ECDLP hardness, or an attack lower bound.
    current_result: "No obligation failed at protocol-construction time. All four residual gaps are frozen with concrete values."

  exactly_one_recommended_next_action: >-
    Archive these two TASK-20260725-001 artifacts through TASK-20260725-002
    and submit only that immutable snapshot to independent review; authorize
    no implementation or experiment until the protocol passes independent
    review and the Coordinator approves a separately scoped executable
    campaign.
