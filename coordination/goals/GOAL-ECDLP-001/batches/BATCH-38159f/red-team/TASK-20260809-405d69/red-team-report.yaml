  narrowest_supported_statement: >-
    Snapshot 7e17c2c6f695697c38d912ed8ce5cb85e2ed1e5b is exactly hash-bound,
    its six-receipt and nine-signature fixture is cryptographically consistent,
    its mixed-radix index arithmetic and literal self-neutral hash KATs pass,
    and its 1131370560-byte archive overage is exact. The producer's overall
