    that ten interfaces are frozen is not supported: lifecycle semantics,
    full census codebooks and charges, semantic registries, rootwise stopped
    cost, rho transcript and frontier completeness, complete self-neutral
    schemas, executable bootstrap, full-cost wiring, and target-cell sparse
    noninterference remain static blockers. No ECDLP observation or evidence
