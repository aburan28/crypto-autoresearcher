  objections:
    - id: RT-405d69-O1-receipt-lifecycle-language
      severity: blocking
      attacked_claim: R1-production-receipt-grammar
      finding: >-
        The six positive receipts and all nine signatures replay exactly, but
        the grammar freezes no lifecycle transition automaton, required-type
        uniqueness, cross-receipt equality predicates, or status-to-payload
        predicate. It therefore proves cryptographic fixture consistency, not
        receipt-language completeness.
      exact_counterexamples:
        - >-
          independent_replay permits commitment_match=false,
          public_manifest_match=false, and replay_verdict=FAIL while the
          top-level status field has no frozen semantic rule; ledger_bound,
          retention_close, and destruction are not forbidden successors.
        - >-
          external_key_id, envelope_sha256, and retention_deadline are repeated
          across common and lifecycle fields without equality constraints, so
          a legitimately signed chain may switch the referenced key, envelope,
          or deadline while preserving every hash link.
        - >-
          The positive fixture records retention_close at
          2026-08-09T00:00:04Z and destruction at 2026-08-09T00:00:05Z against
          retention_deadline 2026-08-16T00:00:00Z, but the language specifies
          no before-or-after deadline predicate.
      consequence: R1_is_not_static_frozen

    - id: RT-405d69-O2-census-codebooks-and-charging
      severity: blocking
      attacked_claim: R2-consumer-split-census_and_R3-complete-resource-charge
      finding: >-
        The block-2231 split and delta ten arithmetic are correct, but the
        snapshot contains no closed class_code, bits_code, or consumer_code
        codebook, no complete consumer-prefix and population table, and no
        derivation of the asserted 5660912 count. The statement
        non_split_rows_unchanged is not a machine-checkable census. In
        addition, the contract explicitly excludes 480 sandbox reset and
        counter receipts from the 280-byte census and leaves their cost
        unknown. The 280-byte SYC4_BLOCK_v2 record is also not an instance of
        the fourteen-field signed syc4.receipt.v2 grammar, and no aggregation,
        signature, or authenticated-manifest rule binds all block records into
        that production receipt language.
      exact_counterexample: >-
        Two different class_id values may be assigned the same unspecified
        class_code and therefore the same path and block identity without
        violating any enumerated codebook, because no such codebook is frozen.
      consequence: >-
        Consumer-local block arithmetic passes narrowly; full-census
        uniqueness and complete archive, reset, counter, CPU, wall, and
        communication charging remain open.

    - id: RT-405d69-O3-lossless-representation-method-ceiling
      severity: blocking
      attacked_claim: possibility_of_a_later_smaller_lossless_encoding_under_unchanged_caps
      finding: >-
        Only 453684800 bytes remain after removing the legacy reserve from the
        predecessor archive base. That is 80 bytes per receipt plus 811840
        bytes total. The declared logical-operation, input, and output digests
        alone occupy 96 unconstrained bytes per receipt, or 543447552 bytes.
      exact_counterexample: >-
        The set of all triples of independent bytes32 values has 2^768
        elements. Any injective representation valid for the declared domain
        needs at least 96 bytes before identity, counters, directed intervals,
        signatures, reset records, or framing, which already exceeds the
        receipt allowance by 89762752 bytes.
      consequence: >-
        The current unchanged-domain and unchanged-cap requirements are
        mutually incompatible unless a successor first narrows the valid
        domain with proved derivability or shared-dictionary relations. An
        unexpanded digest commitment is not a lossless replacement.

    - id: RT-405d69-O4-index-not-semantic-bijection
      severity: blocking
      attacked_claim: R4-semantic-slot-bijection
      finding: >-
        The mixed-radix integer encode and decode are bijective over the stated
        index ranges, and their cardinalities are correct. The snapshot does
        not bind curve_id to canonical curve bytes, model_id to an exact model
        transformation and bytes, root_id to a root-generation transcript, or
        candidate_id to canonical candidate bytes. It also gives no preimage
        rule for record_checksum_sha256.
      observation_collision: >-
        Two different curve or public-model registries can assign different
        mathematical objects to the same bits, curve_id, model_id, eta,
        root_id, candidate_id, and slot record while satisfying the frozen
        mixed-radix arithmetic.
      consequence: index_bijection_PASS_but_semantic_bijection_REVISE

    - id: RT-405d69-O5-targetwise-stopping-cost
      severity: blocking
      attacked_claim: R5-targetwise-inverse-success-cost-pairing
      finding: >-
        Pairing C_i with H_i by target cell fixes the producer's two-cell
        product-of-means collision, but target_key_fields omit root_id and
        attempt ordinal while C_i is described as per-root. No root attempt,
        retry, early-stop, or censoring order maps the 256 root rounds to one
        C_i and H_i, and no preregistered w_i values are present.
      exact_counterexample: >-
        In one target cell let root A cost 1 and succeed, and root B cost 100
        and fail. The unordered root data and eventual target success are the
        same, but order A-then-B charges 1 before stopping while order
        B-then-A charges 101. The frozen target-cell summary has no coordinate
        that distinguishes these costs.
      consequence: >-
        The two-target collision KAT passes, but E[C_i/p_i] is not an
        instantiated targetwise stopped-cost functional.

    - id: RT-405d69-O6-rho-transcript-not-unique
      severity: blocking
      attacked_claim: R6-rho-schedule-and-stop-order
      finding: >-
        The resident-walk round-robin rule is deterministic for the fixed
        five-shard row, but the snapshot omits the rho transition partition,
        exact RHO_START-v2 domain encoding, distinguished-point bit and point
        encoding rule, collision-pair enumeration, and whether the merged
        distinguished table persists across epoch barriers. The frontier also
        asks this five-shard protocol to instantiate one-worker and
        eight-worker rows without replacement schedules.
      exact_counterexample: >-
        Retaining the canonical merged table across epochs and discarding it
        after each barrier both satisfy the phrase retain until epoch barrier
        then canonical merge, but only the former detects inter-epoch
        collisions and it has a different memory and archive cost.
      consequence: R6_is_not_one_frozen_rho_transcript

    - id: RT-405d69-O7-frontier-not-complete-and-negative-gate-invalid
      severity: blocking
      attacked_claim: R7-finite-rho-BSGS-frontier
      finding: >-
        The 32640 rows are a preregistered sparse grid, not the complete finite
        nondominated frontier. Rho omits worker counts 2, 3, 4, 6, and 7 and
        most integer distinguished-bit choices. BSGS omits nearly every
        integer baby width and freezes no segmentation parameter family. No
        dominance proof excludes those rows.
      exact_counterexample: >-
        The negative gate fires when a candidate is worse on any one axis than
        any retained row. For baseline time-memory vector (1,2) and candidate
        vector (2,1), it fires on time although neither vector dominates the
        other. This rejects a valid Pareto tradeoff and is not a nondominance
        test.
      consequence: >-
        Pollard-rho and BSGS baseline reproduction and Pareto honesty remain
        open; no candidate or baseline measurement exists.

    - id: RT-405d69-O8-self-neutral-coverage-incomplete
      severity: blocking
      attacked_claim: R8-self-neutral-manifest-hashes
      finding: >-
        The two literal omitted-field preimages have the claimed lengths and
        hashes. However, the snapshot freezes no closed schema or canonical
        preimage for the complete executable manifest, coverage object, or
        semantic record, and identifies no receipt field that externally binds
        both final manifest objects. The canonical semantic record includes
        record_checksum_sha256 without an omitted-field rule, recreating the
        circularity that R8 is intended to eliminate.
      consequence: literal_two_KATs_PASS_but_complete_hash_interface_REVISE

    - id: RT-405d69-O9-executable-enforcement-bootstrap
      severity: blocking
      attacked_claim: R9-enforceable-syscall-path-temporal-boundary
      finding: >-
        The claim ceiling correctly admits that seccomp cannot inspect paths or
        dataflow, but the proposed boundary is not executable as frozen. If a
        deny-execve filter is installed before worker exec, it blocks that exec;
        if installed after exec, an unfiltered interpreter and dynamic-loader
        startup phase remains. Unconditionally denying openat is also
        incompatible with an ordinary dynamic loader and Python import closure
        unless an exact descriptor-only bootstrap is supplied.
      additional_gap: >-
        The broker says to verify content before open and then open with
        O_NOFOLLOW. Content cannot be hashed before obtaining a descriptor,
        O_NOFOLLOW protects only the final path component, and no
        descriptor-first openat2 RESOLVE_BENEATH and post-open fstat/hash
        sequence is frozen. The stated order leaves a path and inode race.
      consequence: >-
        A policy decomposition is designed, but no enforceable bootstrap or
        race-free pathname mechanism is frozen.

    - id: RT-405d69-O10-wiring-proxy-not-full-cost
      severity: blocking
      attacked_claim: R10-wiring-axis-adjudication
      finding: >-
        Unique 64-byte line touches are a traffic-cardinality proxy, not the
        three-dimensional wiring area, distance, occupancy, or hardware-times-
        time cost required by KN-TECH-035. Two layouts can touch the same lines
        the same number of times while one performs local accesses and the
        other traverses long, congested wiring.
      consequence: >-
        Inclusion in 105 intervals does not establish a fully charged BSGS or
        rho comparison. The claim must be narrowed to this measured proxy or a
        physical full-cost mapping must be frozen.

    - id: RT-405d69-O11-sparse-semantic-interference-dilution
      severity: blocking
      attacked_claim: R11-sparse-tail-interference
      finding: >-
        The four-whole-block mutation is rejected, but the family groups all
        384 target cells of a size into only 32 blocks. One target cell has
        8192 slots while a block has 98304. Even if every slot of one target
        cell is concentrated in one block and doubles, that block ratio is at
        most 13/12 with absolute log ratio 0.08004270767353643, below the
        declared 1.25 threshold; distributing the cell makes the signal still
        smaller.
      observation_collision: >-
        A noninterfering object and an object with two-fold interference on an
        entire curve-model-eta target cell can both pass every size-level
        threshold-count and maximum gate.
      consequence: >-
        The family detects sparse whole-block tails but cannot certify
        targetwise or semantic-subfamily noninterference.

  required_controls:
    - id: CTRL-405d69-1
      control: >-
        Freeze a lifecycle automaton and negative signed KATs that reject a
        failed replay followed by ledger binding, skipped or duplicated types,
        changed key or envelope identities, and both sides of the intended
        retention-deadline predicate.
    - id: CTRL-405d69-2
      control: >-
        Freeze complete class, bits, consumer, prefix, population, shard, and
        path codebooks and mechanically derive all 5660912 receipts plus every
        sandbox, reset, counter, archive, communication, CPU, and wall charge.
    - id: CTRL-405d69-3
      control: >-
        Before proposing compression, state the valid entropy domain for every
        receipt field and prove an injective decoder and worst-case encoded-size
        bound no larger than 453684800 bytes including dictionaries and indexes.
    - id: CTRL-405d69-4
      control: >-
        Bind curve, public-model, eta, root, and candidate registries to exact
        canonical bytes and add exhaustive forward-and-inverse KATs including
        an omitted-field checksum preimage.
    - id: CTRL-405d69-5
      control: >-
        Index costs and success probabilities at the attempt or root level,
        freeze retry and early-stop order, and add the cost-1-success versus
        cost-100-failure order-swap KAT with exact stopped-cost expectations.
    - id: CTRL-405d69-6
      control: >-
        Freeze rho start and transition bytes, distinguished predicate, point
        encoding, collision-pair order, persistent-table lifecycle, and a
        separate deterministic schedule and resource row for every worker count.
    - id: CTRL-405d69-7
      control: >-
        Enumerate every admissible integer rho distinguished-bit and BSGS baby
        width or provide a dominance proof for each excluded interval; replace
        the any-one-axis negative gate by directed interval Pareto dominance.
    - id: CTRL-405d69-8
      control: >-
        Freeze full schemas and omitted-field preimages for executable,
        coverage, semantic-record, and receipt objects and identify the exact
        external receipt that binds each complete final object.
    - id: CTRL-405d69-9
      control: >-
        Supply a trusted bootstrap that can load the interpreter and imports
        before irreversible syscall denial, and use descriptor-first openat2
        resolution plus post-open identity and content verification; add
        denial KATs for alternate exec, IPC descriptor injection, and path races.
    - id: CTRL-405d69-10
      control: >-
        Either narrow wiring_unique_64_byte_line_touches to a disclosed proxy
        or bind it to a three-dimensional full-cost model with layout,
        distance, occupied hardware, and time charged.
    - id: CTRL-405d69-11
      control: >-
        Add target-cell and prespecified semantic-subfamily tail gates. The
        closest mandatory mutation doubles all 8192 slots of one target cell
        while leaving the other 383 cells unchanged and must be rejected.

  counterexample_or_mutation:
    cheapest_static_falsifier: three_digest_information_lower_bound
    statement: >-
      The unchanged archive leaves 453684800 bytes for 5660912 receipts, but
      three arbitrary bytes32 fields require 543447552 bytes. This
      89762752-byte digest-only excess is cheaper and stronger than searching
      for a better compressor because it rules out every injective encoding of
      the currently declared field domain.
    cheapest_semantic_mutation: >-
      Double every one of the 8192 slots belonging to one target cell. Even
      maximum concentration into a 98304-slot block yields ratio 13/12 and
      passes the declared 1.25 tail threshold.

  baseline_comparison:
    result: NOT_REPRODUCED
    Pollard_rho: >-
      The snapshot contains twelve labels per target but not twelve executable
      deterministic protocols, and it omits most admissible worker and
      distinguished-bit rows.
    BSGS: >-
      Five sampled baby widths do not enumerate the finite memory-bounded or
      segmented BSGS frontier; KN-TECH-035 full cost is not captured by unique
      cache-line cardinality.
    candidate_measurements_present: false
    dominated_by: >-
      Pollard rho or an unenumerated rho or BSGS tradeoff until a complete
      finite frontier and all nine charged axes are instantiated.
    sota_delta:
      time: 0
      memory: 0
      data_or_queries: 0
      interpretation: no_attack_or_improvement_claimed

