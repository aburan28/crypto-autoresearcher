      blocking_evidence: >-
        rho_protocol fixes shard_count=5, shard_assignment=walk_id_mod_5,
        resident counts [13,13,13,13,12], and a five-shard epoch barrier.
        finite_frontier.rho_grid simultaneously declares worker_counts
