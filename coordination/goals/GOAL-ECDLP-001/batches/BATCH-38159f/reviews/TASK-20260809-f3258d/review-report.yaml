  verdict_summary: >-
    REVISE. The immutable snapshot, exact parent and six-path commit, all six
    archive hashes, strict parsing, predecessor lineage, both mandatory cheap
    falsifiers, six signed lifecycle receipts and nine Ed25519 signatures,
    consumer-local receipt count, 280-byte receipt width, preserved point,
    SHAKE256, AEAD, confidence, population, verification, cap, self-neutral
