      blocking_evidence: >-
        executable-and-noninterference-contract.yaml lists eleven
        canonical_record_fields but freezes no field types, widths, order,
        occupied and empty encodings, candidate_sha256 preimage,
        record_checksum_sha256 preimage, record width, or file framing. The
        preserved predecessor record is a different exact 96-byte schema that
        omits model_id, eta, and slot. Thus more than one byte stream can encode
        the same integer tuple, and cardinal coverage is not canonical record
        coverage.
      required_repair: >-
        Freeze the exact byte-level record and file encoding, including a
        model and eta aware tuple map, empty record, digest preimages, checksum,
        width identity, and byte-identical inverse KATs.
    - id: R5-targetwise-inverse-success-cost-pairing
      verdict: REVISE
      passed_checks:
        - the two-cell collision distinguishes 5/2 from 2
        - the separate-product value 9/4 is correctly forbidden
        - target keys include bits, curve, model, and eta
      blocking_evidence: >-
        cost-and-frontier-compiler.yaml defines w_i, C_i_x, and H_i only as
        symbols. It contains no 1920 rational family weights, no normalization
        rule, no per-target inverse-success construction from the 256 roots,
        and no canonical interval record or digest. The only concrete weights
        are the two values inside the collision KAT. Distinct rational weight
        vectors and H_i constructions therefore satisfy the text while
        producing different family costs.
      required_repair: >-
        Freeze all target-cell weights and their sum, the exact targetwise C
        and H interval constructors including clipping and infinity, canonical
        bytes and outward-rounding rules, then replay the full 1920-cell
