    recompute. The producer's resource residual is real: 5660912 lossless
    receipts require 1585055360 bytes and raise scheduled archive bytes to
    3439116160, exactly 1131370560 above the unchanged 2307745600-byte cap,
    before separately uncharged sandbox, reset, and counter receipts. Three
    additional zero-run static defects prevent the claimed ten-of-eleven
    freeze. The semantic-slot section gives a bijective integer index but no
    canonical record byte encoding or checksum preimage. The targetwise cost
    section gives a correct symbolic covariance formula and collision KAT but
    freezes neither the 1920 rational weights nor the construction and bytes
    of each target's inverse-success interval. The finite frontier counts
    twelve rho rows while its only executable rho protocol fixes five shards;
    the one-worker and eight-worker rows therefore conflict with the frozen
    assignment, resident counts, epoch barrier, and observation order. These
    are apparatus and reproducibility defects only. They are not ECDLP
    evidence and do not authorize implementation, execution, a status change,
    or a budget increase.

