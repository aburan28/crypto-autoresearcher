      pair decks in Lambda^2(F_p^6), then track a rank-r factorization or
      linear sketch Pi(T) chosen independently of the target scalar.
    explicit_operation: >-
      Contract one pair deck into the factored/sketched tensor, propagate the
      resulting separator state, and query whether a source-labelled zero of
      T exists; exact candidates are verified by EC addition.
    lossy_projection_test:
      intended_discard: "Full B^2 by B^2 pair incidence and high-rank tensor components."
      result: fail_exactness_or_compression
      reason: >-
        Exact source-complete propagation retains the full separator rank or an
        equivalent source dictionary. Rank truncation is genuinely lossy but
        has no completeness guarantee; restoring false negatives requires the
        discarded state. This is the already recorded P1539/P1506/P1552 and
        tensor-network frontier, not a new operation.
    hypothetical_claim: >-
      The exact useful separator rank satisfies r<=B^(1/4+o(1)), giving setup
