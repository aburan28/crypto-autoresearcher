pre_id_screen:
  - handle: B21-P01
    title: Translation-orbit divisor membership word
    class: representation
    status: rejected_pre_id
    exact_object: >-
      For public low-degree divisors D_1,...,D_s on E and public offsets
      t_0,...,t_(w-1), track the binary word
      W(X)=(1_{D_i}(X+[t_j]P))_(i,j), with every D_i, t_j and evaluation rule
      fixed independently of Q and k.
    explicit_operation: >-
      Translate X -> X+P and update W by shifting each divisor row one position
      and evaluating the one newly entering public predicate.
    lossy_projection_test:
      intended_discard: "The full point X and its scalar label."
      result: fail_usefulness
      reason: >-
        With sw=o(log N), many orbit positions share a word and the projection
        has no deterministic inverse. With enough bits to isolate positions,
        constructing the scalar-labelled orbit dictionary costs Omega(N) bits
        or performs the missing search. The shift law is compatible only
        because the computation still advances through the original orbit.
    hypothetical_claim: >-
      A sublinear index of W-patterns locates the shift k of Q=[k]P in
      N^(1/3+o(1)) preprocessing, time, and memory.
    mechanism: >-
      Treat a lossy public predicate word as a symbolic-dynamics code for the
      translation orbit, then recover k by dictionary or pattern collision.
    novelty_status: known_or_semantic_duplicate
    semantic_anchors:
      - "ECDLP-IDEA-011 scalar-orbit elliptic-period descent"
      - "ECDLP-IDEA-329 Koopman delay-coordinate source observer"
      - "ECDLP-IDEA-374 Fiat-Naor function-inversion source index"
      - "KN-LIT-7606 structured generic-group model"
    matched_control: >-
      Pollard rho using the same point representation, hash cost, distinguished
      point rule, processor count, and success target; BSGS with the same total
      stored bytes. Also compare a random prime cyclic group with random
      encodings and identically distributed public predicate bits.
    heuristic_assumptions:
      - id: B21-P01-H1
        statement: >-
          Uniformly for ordinary prime-order E/F_p and sw=o(log N), the W-word
          collision multiplicity is at most N^(o(1)) while W and one update are
          computable in N^(o(1)) work.
        rigorous_support: >-
          None. Pigeonhole gives average multiplicity at least N/2^(sw), which
          contradicts the claimed bound unless sw >= (1-o(1))log_2 N.
        validation_plan: >-
          Exhaust complete toy orbits, compare the multiplicity distribution
          with the same-shape random-encoding predicate null, and test scaling
          as s and w vary; the tail check is maximum and 0.999-quantile fibre
          size versus N/2^(sw).
    proof_decomposition:
      size_lemma: "Bound the number and multiplicity of W-classes."
      runtime_lemma: "Charge predicate construction, updates, index build, queries, and output."
      correctness_lemma: "Prove that an isolated W-match returns the unique scalar k."
      success_lemma: "Bound isolation probability under B21-P01-H1."
      assembly: "total = build + per-attempt cost times inverse isolation probability"
    target_complexity:
      intended_time: "N^(1/3+o(1))"
      intended_memory: "N^(1/3+o(1))"
      preprocessing: "N^(1/3+o(1)), secret-independent"
      online_queries: "N^o(1)"
      success_amplification: "multiply by inverse unique-word probability"
      best_known: "Pollard rho N^(1/2+o(1)) time and negligible memory"
      actual_bound: >-
        The stated H1 forces sw >= (1-o(1))log N. Without a scalar-labelled
        inverse the words do not recover k; with one, full construction/search
        is at least rho-scale and naturally N-scale for an exact dictionary.
    falsification_conditions:
      - "Median or tail fibre size follows N/2^(sw) up to subpolynomial factors."
      - "The same apparent isolation occurs in the random-encoding null."
      - "End-to-end build plus query plus verification is not below matched rho."
    dominated_by: "Pollard rho; BSGS on the high-memory point"
    sota_delta:
      supported_time_exponent_delta: 0.0
      supported_memory_exponent_delta: 0.0
      supported_data_query_delta: 0
    named_obstruction: "pigeonhole fibre size plus scalar-labelled inverse cost"
    forward_guidance: >-
      A successor must exhibit a public predicate family with a proved
      non-generic propagation theorem and a source-free inverse whose complete
      construction is below N^1/2; adding longer orbit words is not a successor.

  - handle: B21-P02
    title: Kummer neighbourhood deck under differential addition
    class: mechanism
    status: rejected_pre_id
    exact_object: >-
      The unordered Kummer deck K_w(X)={x(X+[j]P): -w<=j<=w}, retaining
      multiplicity but discarding signs and ordering; w and the deck rule are
      public and secret-independent.
    explicit_operation: >-
      Apply x-only differential addition to advance X -> X+P, delete the
      departing x-coordinate, and insert the entering one, using public
      neighbouring differences.
    lossy_projection_test:
      intended_discard: "Signs, order, and the central full point."
      result: fail_compatible_inverse
      reason: >-
        Unordered deletion/insertion is not deterministic without restoring
        the ordering/backpointer that was discarded. Retaining enough
        differential state to update exactly makes the deck a window of the
        original orbit, while scalar recovery remains orbit search.
    hypothetical_claim: >-
      Deck collisions create an N^(1/3+o(1))-time Kummer claw search with
      N^(1/3+o(1)) memory.
    mechanism: >-
      Quotient by sign and order, then match overlapping x-coordinate decks
      instead of full group elements.
    novelty_status: known_or_semantic_duplicate
    semantic_anchors:
      - "ECDLP-IDEA-010 torsor deck-orbit descent"
      - "ECDLP-IDEA-057 Kummer/isogeny router artifacts"
      - "ECDLP-IDEA-158 nonfaithful x-only signed lift"
      - "P1515 prime-order composable-bucket theorem"
    matched_control: >-
      Negation-aware Pollard rho and BSGS, charged in x-only field operations
      and identical bytes, plus a random cyclic group whose encoding is
      quotient-paired by a public involution and supplied with same-size random
      neighbourhood multisets.
    heuristic_assumptions:
      - id: B21-P02-H1
        statement: >-
          For w=N^(1/3+o(1)), a random K_w deck admits a canonical exact update
          and has only N^(o(1)) orbit preimages with probability N^(-o(1)).
        rigorous_support: >-
          The Kummer quotient rigorously removes at most the sign involution;
          no theorem supplies the claimed unordered exact update or density.
        validation_plan: >-
          Enumerate complete toy prime-order orbits, compare deck fibres and
          update ambiguity with an involution-matched random null, and track
          whether collision excess decays as w or a random reordering destroys
          overlap.
    proof_decomposition:
      size_lemma: "Bound distinct decks and storage after multiplicity encoding."
      runtime_lemma: "Charge exact deck update, canonicalization, table build, and claw verification."
      correctness_lemma: "Show a deck claw yields a unique signed scalar relation."
      success_lemma: "Bound useful claw probability under B21-P02-H1."
      assembly: "per-attempt deck cost times inverse useful-claw probability plus setup"
    target_complexity:
      intended_time: "N^(1/3+o(1))"
      intended_memory: "N^(1/3+o(1))"
      data: "one public ECDLP instance"
      best_known: "Negation-aware rho retains exponent 1/2"
      actual_bound: >-
        Sign quotient is constant-factor only. Exact unordered updates require
        order/backpointer restoration, and table/claw construction reduces to
        occupied orbit-index or meet-in-the-middle routes without an exponent gain.
    falsification_conditions:
      - "Deck collision advantage matches the involution-shaped null."
      - "Canonical update needs an ordering or scalar-index backpointer."
      - "Full charged time-memory product does not beat matched rho/BSGS."
    dominated_by: "Negation-aware Pollard rho"
    sota_delta:
      supported_time_exponent_delta: 0.0
      supported_memory_exponent_delta: 0.0
      best_possible_known_effect: "constant-factor sign symmetry only"
    named_obstruction: "nonfaithful quotient loses the update witness; faithful restoration returns orbit search"
    forward_guidance: >-
      Only a nonhomomorphic, list-specific Kummer predicate with exact
      source-free propagation and measured density beyond the involution null
      would be distinct; another deck or orientation encoding is merged.

  - handle: B21-P03
    title: Translation-covariant Hasse-jet divisor signature
    class: representation
    status: rejected_pre_id
    exact_object: >-
      For a public relation divisor Z and fixed h, track the truncated local
      principal-part vector J_h(X)=(f(X),D f(X),...,D^h f(X)) modulo a public
      local parameter and trivialization, with f defining Z and all choices
      independent of Q and k.
    explicit_operation: >-
      Pull J_h through the rational translation map tau_P:X->X+P using the
      chain rule/Hasse composition, truncating above order h.
    lossy_projection_test:
      intended_discard: "The full local function germ and all derivatives above h."
      result: fail_new_information
      reason: >-
        For fixed public f, parameter, and X, J_h(X) is a deterministic public
        function of X. Its update is generically simulable from public field
        arithmetic. Source-bearing jets arise only after source occurrence
        leaves, branch data, or labels have been compiled, which restores the
        occupied source oracle.
    hypothetical_claim: >-
      Bounded jets reject enough failed decompositions to yield complete
      relation collection, factor logs, and descent in N^(0.4+o(1)) time and
      memory.
    mechanism: >-
      Use derivative compatibility as a cheap filter before exact summation-
      polynomial or divisor-incidence solving.
    novelty_status: known_or_semantic_duplicate
    semantic_anchors:
      - "ECDLP-IDEA-004 prime-to-p jet logarithm"
      - "ECDLP-IDEA-068 source-marked Hasse forms"
      - "ECDLP-IDEA-160 ramification-break digits"
      - "EV-JET-001 no first-jet advantage"
      - "KN-FIND-002 / KN-LIT-7606 simulability boundary"
    matched_control: >-
      Exact base relation test without jets, with identical candidate tuples,
      arithmetic backend, and early-exit policy; same-shape null replaces f by
      a degree- and multiplicity-matched random rational function and uses the
      identical jet pipeline.
    heuristic_assumptions:
      - id: B21-P03-H1
        statement: >-
          Uniformly for generic ordinary prime-field instances, conditional on
          base non-membership, the order-h jet test rejects an N^epsilon
          fraction more candidates than the degree/multiplicity-matched random
          function while costing N^o(1) per candidate.
        rigorous_support: >-
          Hasse composition supplies the update identity only; it gives no
          selectivity theorem. Public deterministic jets are simulator-visible.
        validation_plan: >-
          Freeze candidate tuples before evaluation, run real and degree-
          matched random-function jets at h=0..h_max, measure conditional
          rejection and accepted-source recall, and require any excess to scale
          rather than remain constant as h increases.
    proof_decomposition:
      size_lemma: "Bound jet representation and chart/exceptional-stratum state."
      runtime_lemma: "Charge construction, chain-rule update, exact fallback, relation collection, LA, and descent."
      correctness_lemma: "Prove no valid signed source is rejected on every stratum."
      success_lemma: "Derive survival/rejection probabilities from B21-P03-H1."
      assembly: "relation attempts times cost per attempt plus LA, descent, and inverse success"
    target_complexity:
      intended_time: "N^(0.4+o(1))"
      intended_memory: "N^(0.4+o(1))"
      data: "N^(0.2+o(1)) verified relations plus descent queries"
      best_known: "rho N^(1/2+o(1)); prime-field Semaev variants have no established sub-rho complete path"
      actual_bound: >-
        No non-generic selectivity or source-complete inverse is supplied. The
        public jet is simulable; source-marked jets require the labels whose
        generation dominates. Therefore no complete exponent can be instantiated.
    falsification_conditions:
      - "Real-vs-random conditional rejection ratio tends to one."
      - "Positive recall requires source-labelled occurrence leaves or post-hoc selectors."
      - "Construction plus failed attempts plus LA/descent reaches exponent at least 1/2."
    dominated_by: "Pollard rho; base exact relation test on the filter subtask"
    sota_delta:
      supported_time_exponent_delta: 0.0
      supported_memory_exponent_delta: 0.0
      measured_filter_gain: "none in this task; no run"
    named_obstruction: "public-jet simulability or source-label restoration"
    forward_guidance: >-
      Seek a proved encoding-specific derivative statistic occupying
