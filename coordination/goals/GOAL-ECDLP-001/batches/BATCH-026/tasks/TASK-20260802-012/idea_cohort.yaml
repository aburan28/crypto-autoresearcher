    proof_decomposition:
      size_lemma: "Bound ensemble maps, bases, transported states, and deduplicated relations."
      runtime_lemma: "Charge isogeny construction/evaluation, relation generation, LA, and descent."
      correctness_lemma: "Prove transported source logs return valid original-group relations."
      success_lemma: "Prove density and independent-rank gain under B21-P04-H1."
