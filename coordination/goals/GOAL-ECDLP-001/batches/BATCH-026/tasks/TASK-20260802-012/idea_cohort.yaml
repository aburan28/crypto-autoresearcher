    target_complexity:
      intended_time: "N^(1/3+o(1))"
      intended_memory: "N^(1/3+o(1))"
      preprocessing: "N^(1/3+o(1)), public"
      data_queries: "N^(1/3+o(1)) relation/decomposition trials"
      best_known: "rho exponent 1/2"
