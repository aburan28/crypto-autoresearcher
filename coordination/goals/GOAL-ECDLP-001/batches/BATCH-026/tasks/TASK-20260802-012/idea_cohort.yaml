  - handle: B21-P04
    title: Bounded-isogeny ensemble factor-base signature
    class: composition
    status: rejected_pre_id
    exact_object: >-
      For public separable isogenies phi_i:E->E_i of degrees d_i=N^o(1), track
      S(X)=(1_{F_i}(phi_i(X)))_i together with any claimed decomposition
      witnesses in public factor bases F_i; all curves, kernels, maps, and bases
      are selected independently of Q and k.
    explicit_operation: >-
      Transport addition componentwise using phi_i(X+Y)=phi_i(X)+phi_i(Y),
      then test factor-base membership/decomposition on each E_i.
    lossy_projection_test:
      intended_discard: "The point images, retaining only membership/decomposition signatures."
      result: fail_rank_or_faithfulness
      reason: >-
        On a prime-order subgroup disjoint from ker(phi_i), each phi_i is an
        injective homomorphism, so full images are faithful re-encodings.
        Membership bits are lossy but do not return factor-base source logs;
        independent views conserve mean decomposition yield unless a charged
        correlation/rank theorem is supplied.
    hypothetical_claim: >-
      An ensemble of N^(1/6+o(1)) bounded-degree isogenous charts raises useful
      relation density enough for N^(1/3+o(1)) complete ECDLP time and memory.
    mechanism: >-
      Aggregate factor-base hits across several transported curve models and
      solve the combined relation matrix.
    novelty_status: known_or_semantic_duplicate
    semantic_anchors:
      - "ECDLP-IDEA-002 split-Jacobian projected smoothness"
      - "ECDLP-IDEA-057 ECFFT/isogeny router"
      - "ISO-CW-NR-001 fixed factor-base isogeny atlas negative"
      - "KN-FIND-007 decomposition-yield conservation"
      - "global/cover/correspondence family in P1552 frontier"
    matched_control: >-
      Equal total factor-base cardinality split randomly into the same number
      of direct E charts, and a random-permutation transport null preserving
      every marginal hit count and map-evaluation cost. Charge map
      construction, kernels, all relation attempts, deduplication, rank, factor
      logs, blind descent, output, and peak memory.
    heuristic_assumptions:
      - id: B21-P04-H1
        statement: >-
          For m=N^(1/6+o(1)) public bounded-degree isogenies, the union of
          source-valid decomposition events has an N^(1/6-o(1)) gain over an
          equal-budget random partition while retaining independent rank.
        rigorous_support: >-
          Isogeny homomorphism and injectivity on the subgroup are rigorous,
