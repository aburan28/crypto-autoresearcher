  primary_literature_recheck:
    verdict: PASS
    sources:
      - key: SHOUP-1997
        url: https://www.shoup.net/papers/dlbounds1.pdf
        finding: >-
          Establishes the square-root lower-bound baseline for generic
          algorithms; it does not apply universally to encoding-specific
          ordinary-curve structure.
      - key: CGHW-2026
        url: https://eprint.iacr.org/2026/384
        finding: >-
          The official abstract states the model-scoped
          Omega(min(sqrt(q),1/delta)) bound for structure available on at most
          a delta fraction of elements and explicitly includes analogous
          elliptic-curve-point results. None of B21-P01..P05 computes the
          paper's model-specific delta or proves that its object satisfies that
          interface, so the theorem is a control, not a candidate rejection by
          itself.
      - key: SEMAEV-2004
        url: https://eprint.iacr.org/2004/031.pdf
        finding: >-
          Supplies the exact summation-polynomial endpoint relation. It does
          not supply source-labelled jets, an isogeny-ensemble rank gain, or an
          exterior separator-rank theorem.
      - key: APS-2017
        url: https://eprint.iacr.org/2017/609.pdf
        finding: >-
          Gives a prime-field summation-polynomial route and expressly states
          that further work is needed to improve on Pollard rho. It also
          separates extension-field Weil-descent results from the prime-field
          case.
      - key: CHUNG-COSTELLO-SMITH-2016
        url: https://eprint.iacr.org/2016/777
        finding: >-
          Confirms the standard Kummer pattern: project to unsigned data for
          pseudomultiplication and separately recover signed output. It does
          not provide deterministic translation of an unordered orbit deck or
          a sub-rho scalar inverse.
      - key: KOUTIS-2008
        url: https://doi.org/10.1007/978-3-540-70575-8_47
        finding: >-
          Exterior-algebra cancellation is prior art for witness structures;
          it does not give the elliptic, exact-source, low-separator-rank
          theorem required by B21-P05.
    literature_boundary: >-
      No checked primary source supplies one of the five complete mechanisms
      as a generic ordinary prime-field sub-rho ECDLP algorithm. Absence in a
      targeted literature search is not a novelty proof. Every disposition
      below instead rests on an exact internal obstruction, a corpus duplicate,
      or a missing load-bearing theorem and complete cost path.

  generic_boundary_review:
    shoup_statement_accurate: true
    structured_generic_statement_accurate: true
    qualification: >-
      Both are model statements. In particular, a coordinate or jet operation
      is not automatically simulable in strict Shoup GGM, whose labels are
      opaque. B21-P03 is rejected because it supplies no source-sensitive
      selectivity or complete attack path, not because strict Shoup universally
      rules out jets. Similarly, CGHW-2026 cannot be applied until delta and
      the structured oracle interface are proved for the exact candidate.

  candidate_reviews:
    - handle: B21-P01
      title: Translation-orbit divisor membership word
      candidate_verdict: REJECT_PRE_ID
      exact_object_operation_audit:
        object_well_typed: true
        operation_well_typed: true
        finding: >-
          The word is a public function of X and translation shifts its window,
          but the update law does not provide an inverse from a word to the
          scalar position.
      semantic_novelty:
        verdict: duplicate_orbit_observer_and_function_inversion_lane
        closest_records:
          - ECDLP-IDEA-011
          - ECDLP-IDEA-329
          - ECDLP-IDEA-374
      scope_and_boundary: >-
        The object is in the requested ordinary prime-field scope, but no
        encoding-specific theorem separates it from generic orbit search.
        Shoup is only the matched baseline, not the counting obstruction.
      exact_obstruction: >-
        At most 2^(s*w) words exist. Hence the average fibre is at least
        N/2^(s*w), and the fraction of scalar positions that can be singleton
        fibres is at most 2^(s*w)/N. The candidate's H1 is false when
        s*w=o(log N). Making the word nearly injective still leaves inversion
        from the public word to the scalar; no sub-rho inverse is constructed.
      end_to_end_cost_audit:
        verdict: FAIL
        finding: >-
          The advertised N^(1/3) build/query path has no algorithm. With a
          short word, inverse unique-word probability alone contributes
          N^(1-o(1)) amplification in the worst claimed regime; with a long
          word, the missing inverse/dictionary/search is uncharged. Time,
          memory, preprocessing, success amplification, and output verification
          therefore do not instantiate a sub-1/2 exponent.
      proof_architecture: >-
        Labels for size/runtime/correctness/success lemmas are present, but H1
        contradicts the elementary fibre bound and no lemma is supplied.
      controls_and_falsification: PASS
      dominated_by: >-
        Pollard rho on demonstrated ECDLP performance; direct table inversion
        or BSGS on the proposed inverse subtask.
      sota_delta:
        supported_time_exponent_delta: 0.0
        supported_memory_exponent_delta: 0.0
        supported_data_query_delta: 0
      named_obstruction: short-word fibre size plus missing scalar inverse
      cheapest_falsification: >-
        Zero-run counting proof: bound singleton probability by 2^(s*w)/N and
        reject H1 before implementing predicates. If a successor claims a
        compressed inverse, trace every state and charge scalar-labelled advice.
      forward_guidance: >-
        Only a nonhomomorphic public predicate with a proved encoding-specific
        propagation law and a source-free inverse below N^1/2 is distinct.

    - handle: B21-P02
      title: Kummer neighbourhood deck under differential addition
      candidate_verdict: REJECT_PRE_ID
      exact_object_operation_audit:
        object_well_typed: true
        operation_well_typed: false
        finding: >-
          The unordered deck is not a deterministic state for translation by
          +P. For symmetric j, K_w(-X)=K_w(X) because x(-R)=x(R), but generally
          K_w(P-X) differs from K_w(P+X). The same current deck therefore has
          two different next decks. Ordering, a signed centre, or a backpointer
          repairs the update only by restoring discarded orbit state.
      semantic_novelty:
        verdict: duplicate_kummer_deck_and_x_only_lift_lane
        closest_records:
          - ECDLP-IDEA-010
          - ECDLP-IDEA-057
          - ECDLP-IDEA-158
      scope_and_boundary: >-
        The Kummer quotient removes generic sign only, a constant-size
        involution. It does not create an exponent-changing quotient or a
        deterministic +P action on the proposed state.
      exact_obstruction: sign-symmetric state aliasing destroys deterministic update
      end_to_end_cost_audit:
        verdict: FAIL
        finding: >-
          No canonical exact update, source inverse, useful-claw probability,
          or source-output algorithm is instantiated. Restoring orientation
          reduces the object to an orbit window; omitting it makes correctness
          fail. Thus the N^(1/3) time/memory claim and amplification are not
          defined.
      proof_architecture: >-
        The proposed lemma decomposition is appropriate as a plan, but the
        correctness precondition fails before size or success analysis.
      controls_and_falsification: PASS
      dominated_by: negation-aware Pollard rho
      sota_delta:
        supported_time_exponent_delta: 0.0
        supported_memory_exponent_delta: 0.0
        supported_data_query_delta: 0
      named_obstruction: nonfaithful sign quotient aliases states with different successors
      cheapest_falsification: >-
        Zero-run algebraic counterexample K_w(X)=K_w(-X) with unequal +P
        successors. A tiny exhaustive orbit is only a verifier for this identity,
        not the primary evidence.
      forward_guidance: >-
        Require a genuinely nonhomomorphic Kummer predicate with exact
        source-free propagation and a real/null density separation; another
        orientation or deck encoding is not a successor.

    - handle: B21-P03
      title: Translation-covariant Hasse-jet divisor signature
      candidate_verdict: REJECT_PRE_ID
      exact_object_operation_audit:
        object_well_typed: true
        operation_well_typed: partially
        finding: >-
          Hasse composition transports a fixed public rational-function jet,
          but the candidate never specifies a source-tuple-to-X interface or an
          exact accept/reject predicate that turns this endpoint statistic into
          source-complete relation collection.
      semantic_novelty:
        verdict: duplicate_public_jet_and_source_jet_oracle_lane
        closest_records:
          - ECDLP-IDEA-004
          - ECDLP-IDEA-068
          - ECDLP-IDEA-160
          - ECDLP-IDEA-268
          - EV-JET-001
      scope_and_boundary: >-
        A public jet is a deterministic encoding-specific statistic, but that
        fact neither makes it available in strict Shoup GGM nor gives it
        non-generic source selectivity. The candidate proves neither a CGHW
        delta nor a source-sensitive operation outside the endpoint simulator.
      exact_obstruction: >-
        Endpoint jets contain no occurrence labels. Source-sensitive jets
        require the branch-separated source leaves whose construction is the
        missing relation problem. The closest empirical evidence, EV-JET-001,
        is only a toy first-jet scoped negative and is not generalized here.
      end_to_end_cost_audit:
        verdict: FAIL
        finding: >-
          Intended N^0.4 time/memory and N^0.2 relations are not derived from
          selectivity, recall, independent rank, factor-log, target-descent, or
          amplification bounds. No measured filter gain exists. The row is
          strictly worse than the exact base relation test on its only defined
          subtask because it adds jet work without a proved rejection gain.
      proof_architecture: >-
        The lemma labels and null experiment are reasonable, but H1 lacks a
        rigorous bound plus distribution theorem and the correctness lemma has
        no all-strata source interface to bind to.
      controls_and_falsification: PASS
      dominated_by: Pollard rho; exact base relation test on the filter subtask
      sota_delta:
        supported_time_exponent_delta: 0.0
        supported_memory_exponent_delta: 0.0
        supported_data_query_delta: 0
      named_obstruction: endpoint-jet determinism versus missing source-labelled jet oracle
      cheapest_falsification: >-
        Before any campaign, symbolically reduce the h=1 jet equations modulo
        the zeroth-order relation ideal and compare conditional rank/selectivity
        with a degree-and-multiplicity-matched random rational function. Kill
        the route if no independent constraint remains or if the real/null
        ratio is one; freeze candidate tuples before measurement.
      forward_guidance: >-
        A successor must name a source-free derivative statistic, prove its
        exact all-strata recall and non-generic selectivity, and then charge
        rank, factor logs, blind descent, and memory. Higher jet order alone is
        duplicate maintenance.

    - handle: B21-P04
      title: Bounded-isogeny ensemble factor-base signature
      candidate_verdict: REJECT_PRE_ID
      exact_object_operation_audit:
        object_well_typed: true
        operation_well_typed: true
        finding: >-
          Each degree-coprime isogeny restricts injectively to the prime-order
          subgroup. Pulling each F_i back therefore turns the component into an
          ordinary factor-base experiment on an isomorphic copy of the same
          group; the membership signature alone does not output factor logs.
      semantic_novelty:
        verdict: duplicate_fixed_degree_transfer_and_isogeny_atlas_lane
        closest_records:
          - ECDLP-IDEA-002
          - ECDLP-IDEA-057
          - ISO-CW-NR-001
          - KN-FIND-007
      scope_and_boundary: >-
        The exact injectivity argument is valid for the requested generic
        ordinary prime-order subgroup when gcd(d_i,N)=1. It is not a global
        statement about growing-degree non-permutation correspondences or
        solver circuits.
      exact_obstruction: >-
        For fixed relation arity, the total number of source tuples in chart i
        is determined by |F_i|. Summing over a partition cannot exceed the
        corresponding equal-total direct-base tuple budget. Isogeny transport
        preserves group sums, so no N^(1/6) mean-yield or independent-rank gain
        follows. Coverage or circuit cost could still differ, but the candidate
        supplies no theorem for either.
      end_to_end_cost_audit:
        verdict: FAIL
        finding: >-
          The claimed N^(1/6) ensemble-density gain is unsupported and the row
          supplies no base exponent, arity, per-chart solve cost, useful-rank
          probability, factor-log complexity, target-descent density, or
          amplification calculation. Map construction and m=N^(1/6) charts are
          charged only nominally, not assembled into a proof of N^(1/3).
      proof_architecture: >-
        The intended size/runtime/correctness/success split is appropriate, but
        H1 conflicts with equal-total tuple accounting unless a new solver or
        rank theorem is inserted; none is given.
      controls_and_falsification: PASS
      dominated_by: Pollard rho; equal-total direct factor base on the relation subtask
      sota_delta:
        supported_time_exponent_delta: 0.0
        supported_memory_exponent_delta: 0.0
        supported_density_exponent_gain: 0.0
        supported_data_query_delta: 0
      named_obstruction: injective homomorphic re-encoding plus equal-total source-tuple accounting
      cheapest_falsification: >-
        Zero-run pullback/counting proof: replace every F_i by
        D_i=phi_i^(-1)(F_i) and compare exact tuple budgets at fixed total base
        cardinality. Only if a candidate names a chart-specific solver circuit
        should a held-out arithmetic DAG test follow.
      forward_guidance: >-
        A successor must use a non-permutation correspondence or a proved
        chart-specific solve/rank gain that survives equal-total-base, map,
        source-output, factor-log, and blind-descent accounting.

    - handle: B21-P05
      title: Low-separator sketch of the six-list Abel-Jacobi tensor
      candidate_verdict: REJECT_PRE_ID
      exact_object_operation_audit:
        object_well_typed: partially
        operation_well_typed: conditional
        finding: >-
          Exterior incidence gives an exact zero predicate once source pairs
          are already represented. A low-rank factorization or sketch is not
          an exact source-biconditional operation until a separator-rank and
          source-recall theorem is proved.
      semantic_novelty:
        verdict: exact_semantic_duplicate_of_current_exterior_tensor_frontier
        closest_records:
          - ECDLP-IDEA-050
          - ECDLP-IDEA-052
          - ECDLP-IDEA-056
          - P1539
          - P1552
      scope_and_boundary: >-
        This is the existing coloured five-sum/six-list Abel-Jacobi incidence
        problem in tensor language. Known kSUM/indexing and explicit 3+3
        controls miss the B^2.25/B^1.25 rectangle, but those misses are not a
        lower bound against every field-specific nonlinear locator.
      exact_obstruction: >-
        Exact source completeness retains the occupied separator/source state;
        lossy rank truncation has false negatives unless H1 supplies the missing
        exact real-vs-null rank gap and source-biconditional contraction.
      end_to_end_cost_audit:
        verdict: FAIL
        finding: >-
          The arithmetic B=N^(1/5), setup/state B^(9/4)=N^0.45, and B targets
          times B^(5/4)=N^0.45 is internally consistent only conditional on H1.
          No setup algorithm, exact rank bound, useful-relation probability,
          independent-rank theorem, factor-log cost, blind-descent proof, or
          amplification bound instantiates it. The conditional -0.05 delta is
          not supported SOTA.
      proof_architecture: >-
        The planned decomposition matches the target profile, but the size and
        correctness lemmas are precisely the missing theorem and no empirical
        validation can substitute for them.
      controls_and_falsification: PASS
      dominated_by: >-
        Pollard rho on demonstrated ECDLP performance; explicit 3+3 and 2+2+2
        enumeration on the defined incidence subproblem.
      sota_delta:
        supported_time_exponent_delta: 0.0
        supported_memory_exponent_delta: 0.0
        supported_data_query_delta: 0
        conditional_target_delta_if_H1_proved: -0.05
      named_obstruction: exact separator rank versus source-complete lossy compression
      cheapest_falsification: >-
        Compute exact finite-field flattening/separator ranks and all-source
        recall on the smallest shape-complete instances for both real and
        matched random six-list tensors. Stop on one missed source or no
        scaling gap. This is a theorem-discovery screen, not attack evidence.
      forward_guidance: >-
        Reopen only on an exact rank theorem and biconditional source contraction
        with complete B^2.25/B^1.25 construction, rank, factor-log, descent,
        amplification, and memory bounds. A new tensor format or solver is a
        duplicate.

  target_result_profile_audit:
    ambition: >-
      All five aim at exponent movement, but none establishes C1 or C2 as a
