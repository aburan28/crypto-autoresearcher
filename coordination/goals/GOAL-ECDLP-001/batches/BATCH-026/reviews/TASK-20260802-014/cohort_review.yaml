      contradicted by counting; B21-P02-H1 assumes an impossible state update;
      B21-P03-H1 lacks a source interface; B21-P04-H1 lacks a density/rank
      theorem; B21-P05-H1 is the missing rank theorem itself.
    proof_architecture: >-
      Single-responsibility lemma names are present as proposal scaffolding.
      No numbered algorithm, proved lemma, or assembly-only theorem exists.
    evidence_and_cost: >-
      No experiment ran, no heuristic was validated, no concrete standardized
      cost table exists, and no crypto-scale claim is made. This is consistent
      with the proposal-stage ceiling but cannot support admission as a
      mechanism survivor.

  pareto_review:
    verdict: PASS
    finding: >-
      The producer correctly records supported time, memory, data/query, and
      security deltas as zero and labels B21-P05's -0.05 only conditional on an
