        time and memory side by side.

  # ======================================================================
  # 10. LIMITATIONS OF THIS VALIDATION
  # ======================================================================
  limitations:
    - >-
      Independence is procedural, not model-level. The producer and this
      validator resolve to the same model under this harness. The mitigation is
      that every verdict above rests on code written in this session and on
      numbers this session computed, not on agreement with the executor's
      reasoning; where I could use a genuinely independent implementation
      (sympy.factorint for the null deep tails, my own Miller-Rabin and my own
      trial division for the planted P_max) I did.
    - >-
      Bit-for-bit reproduction was obtained under numpy 2.4.0 / Python 3.13.1 /
      macOS arm64, the same stack as the run. The archive's reproducibility
      under a different numpy Generator implementation or a different libm was
      NOT tested and is not claimed. rng.choice and rng.integers streams are
      numpy-version-dependent in principle.
    - >-
      apply_plant, build_smooth_replacement and build_rough_replacement were
      called from the frozen driver rather than re-implemented; they ARE the
      construction under test. What I verified independently is that their
      OUTPUTS satisfy their claimed properties (every smooth plant fully
      Bsm(u=4)-smooth with the stated P_max, every rough plant q*r with q, r
      prime and q > p), which is the checkable content.
    - >-
      Full top-1000 array comparison was performed on 6 of 28 blocks, chosen to
      include both per-cell peak blocks and both rough-maximum blocks. The other
      22 blocks were verified on maxima, per-replicate maxima, counts,
      exceedances and the full accounting, but their 1000-element arrays were
      compared only via max, percentiles and internal consistency. A
      hypothetical corruption confined to ranks 2..1000 of one of those 22
      blocks would not have been caught.
    - >-
      tools/validate_ledger.py has no per-file entry point; it was run
      repo-wide and its output filtered. The repository-wide FAIL (1171 new
      errors, 1138 grandfathered) is a pre-existing condition unrelated to this
      package except for the two lines quoted in AC-11.
    - >-
      This report rules on admissibility only. It is not evidence for or
      against HEUR-DS-1, H-LPF-001, H-SMTH-001, H-DS-001, H-EQD-001 or
      H-DEP-001, it does not support any ECDLP claim, it demonstrates no
      speedup, and it authorizes no promotion.

  ladder_applicability_note: >-
    docs/inventor-protocol.md section 6 (the scaled-down-instance ladder) is
    NOT applicable: this package claims no improvement, no speedup and no
    complexity result, so there is no extrapolation to check. Its toy scale is
    a property of a calibration apparatus, declared as such, not a stand-in for
    a real-scale claim.

