  # ======================================================================
  # 5. THE EVICTION : INSERTION ACCOUNTING
  # ======================================================================
  eviction_insertion_recomputation:
    definitions_as_applied:
      insertion: a planted position appearing in the planted replicate's top ten
      eviction: >-
        a member of the null top ten that is not still a surviving UNPLANTED
        member of the planted top ten, whether overwritten in place or pushed
        out; equivalently 10 - survivors
      survivor: an unplanted null-top-ten position still in the planted top ten
      promoted: 10 - survivors - insertions
    definitions_applied_consistently: >-
      Yes. I re-implemented all four from the stated definitions and reproduced
      every per-block total exactly, so the archived counts are not merely
      self-consistent, they follow from the definitions the report prints. Note
      the identity evictions = insertions + promoted holds in all 28 blocks by
      construction of `promoted`; a reader should not treat evictions and
      insertions as independent measurements of the same thing.
    slices:
      - name: SMOOTH, gamma == 0.05, both cells
        blocks: 2
        evictions: 19
        insertions: 2
        ratio: 9.5
        my_recomputation: 19:2 (bits 16 rung 11:1, bits 20 rung 8:1)
        agrees: true
      - name: SMOOTH, gamma >= 0.02, both cells
        blocks: 4
        evictions: 28
        insertions: 3
        ratio: 9.333333333333334
        my_recomputation: 28:3 (bits 16 5+11, bits 20 4+8; insertions 0+1+1+1)
        agrees: true
      - name: SMOOTH, all rungs, both cells
        blocks: 14
        evictions: 40
        insertions: 3
        ratio: 13.333333333333334
        agrees: true
      - name: ROUGH, all rungs, both cells
        blocks: 14
        evictions: 39
        insertions: 0
        ratio: null
        agrees: true
      - name: ALL 28 blocks
        blocks: 28
        evictions: 79
        insertions: 3
        ratio: 26.333333333333332
        agrees: true
    gamma_slice_vacuity_check:
      claim: >-
        `gamma <= 0.05` is vacuous on ladders topping out at 0.05, so that
        slice differs from `gamma == 0.05`
      verified: true
      evidence: >-
        Both frozen ladders are (0.0005, 0.001, 0.002, 0.005, 0.01, 0.02,
        0.05), so gamma <= 0.05 selects all 7 rungs. Directly visible in the
        archive without any argument: aggregates.by_family_gamma_le_0p05 is
        field-for-field IDENTICAL to aggregates.by_family (14 blocks, 463,080
        smooth plants, 40:3), whereas the gamma == 0.05 slice is 2 blocks,
        261,640 plants, 19:2. The two slices give different counts AND a
        different ratio (13.33 vs 9.50). A restatement that writes
        `gamma <= 0.05` while meaning the top rung would misstate the ratio by
        40 percent.
      result: pass
    ambiguity_warning: see DEF-065-5

  # ======================================================================
  # 6. THE FOUR RECORDED OBSERVATIONS
  # ======================================================================
  observation_assessment:
    - id: OBS-1
      observation: UNEXP-PLANTZ-1, the per-cell maximum is not at the top rung
      honest: true
      material: HIGH
      assessment: >-
        Recorded accurately and without interpretation, and it is the single
        most consequential number in the package because it is what changed
        between BATCH-025 and now. But the observation understates its own
        fragility. At bits 20 gamma 0.02 the block maximum 6.91606451193366
        comes from ONE replicate (11); the next-highest replicate maximum in
        that same block is 5.5526405342442215, a gap of 1.36 in Z. The
        p99.99 of that block is 5.2608. At bits 16 the three top rungs are
        5.955369, 5.922396 and 5.936052 - a spread of 0.033, i.e. the claim
        "bits 16 peaks at gamma 0.01" is a statement about the third decimal
        place of a rank-1 statistic. Independently corroborating the
        mechanism: the block with the 6.916 maximum contains exactly ONE
        Bsm(u=6)-smooth planted value, and 6.916 is the u one would read off
        such an integer. The maxima are driven by rare over-smooth
        construction accidents, not by gamma.
    - id: OBS-2
      observation: UNEXP-PLANTZ-2, gamma <= 0.05 is vacuous
      honest: true
      material: HIGH
      assessment: >-
        Correct, verifiable directly from the archive, and exactly the kind of
        slice-definition trap that would silently propagate into a frozen
        restatement. Archiving both slices was the right call. Impact is high
        because the two slices differ by 40 percent in the ratio.
    - id: OBS-3
      observation: >-
        UNEXP-PLANTZ-3, exceedance is SMOOTH-only, rare, and T_deep always
        moved up in the three cases
      honest: true
      material: HIGH
      assessment: >-
        Verified in full, including an independent search over all 560
        instances for cases the executor might have missed: there are none.
        The ROUGH zero is not a coincidence to be reported as an empirical
        rate; it is forced by the structural bound (Z < 2 < every null
        T_deep, which is above 5 at both cells), and the executor says so.
        Recorded as a measurement without a reading, correctly.
    - id: OBS-4
      observation: UNEXP-PLANTZ-4, the __pycache__ side effect
      honest: true
      material: LOW
      assessment: >-
        Verified: .gitignore line 1 matches the directory
        (`git check-ignore -v` confirms), the directory exists in the working
        tree, it is not among the 11 declared paths, and `git status` is clean.
        A benign disclosure, correctly classified. It does affect nothing, but
        disclosing it is the right default.

  # ======================================================================
  # 7. SUFFICIENCY FOR RR-LPF-2
  # ======================================================================
  sufficiency_ruling:
    verdict: SUFFICIENT FOR THE RESTATEMENT, WITH TWO NAMED LIMITS
    sufficient_for:
      - >-
        The maximum planted Z at any granularity - per replicate, per block,
        per cell, per family, overall - directly from archived fields, without
        re-running.
      - >-
        The per-replicate exceedance count and rate against that replicate's
        own null tenth-largest Z, from per_replicate rows carrying
        plants_exceeding_this_replicates_null_t_deep, null_t_deep,
        planted_t_deep and plant_count. All 560 rows are present.
      - >-
        The eviction-to-insertion RATIO on any gamma slice, as arithmetic over
        the archived per-block and per-replicate counts.
      - >-
        The ROUGH structural statement: 462,736 values, five clauses, zero
        violations, maximum 1.994781310510841, archived per block and in
        aggregate. This is the half of D1 that survives and it is airtight -
        it recomputed exactly here, in arbitrary-precision integers, with
        primality of q and r additionally verified under an independent
        Miller-Rabin.
      - >-
        Identifying the three exceeding plants' Z values: each of the three
        instances has count 1, so the exceeding value equals that replicate's
        archived max_plant_z. This works only because the count is one; the
        archive does not in general carry the identity of exceeding plants.
    not_sufficient_for:
      - >-
        Re-deriving the eviction and insertion COUNTS themselves without
        re-running. The null and planted top-ten INDEX SETS are not archived,
        only the resulting counts. A future reader must accept those counts on
        the archive's authority, or regenerate. I regenerated: they are
        correct. RR-LPF-2 should say it is quoting an archived count, not a
        recomputable one.
      - >-
        Any statement about the planted-Z distribution below the top 1000 per
        block, beyond the archived histogram and the p99/p99.9/p99.99
        percentiles. The full per-sample arrays are NOT archived. For a
        restatement of D1, which concerns the deep tail (rank 10), this is not
        binding: the top 1000 per block covers rank 10 with three orders of
        magnitude to spare.
    ruling_for_the_task_deliverable: >-
      YES - RR-LPF-2 can restate D1 and V8 on these arrays without regenerating
      anything, provided it restates them as statements about archived counts
      and the deep tail, names its gamma slice explicitly, and does not lean on
      a rank-1 maximum (DEF-065-4).

  # ======================================================================
  # 8. DEFECTS
  # ======================================================================
  defects:
    - id: DEF-065-1
      severity: blocking_for_schema_conformance, non_blocking_for_the_numbers
      title: run manifest fails check_run on two required fields
      detail: >-
        manifest.yaml has no `environment` key and no `inputs` key.
        RUN_REQUIRED_TOP in tools/validate_ledger.py requires both, and the
        sibling RUN-LPF-001-calib manifest carries both, so this is a
        regression in this package rather than a repository convention. The
        substance is present - environment.json is a declared, committed
        artifact and is listed in the manifest's artifacts, and the inputs are
        under `parameters` - so nothing is missing as evidence; the record is
        merely not schema-conforming and the run will not index cleanly.
      repair: >-
        A superseding manifest record by the producer or Coordinator. NOT
        repaired here: the Validator does not edit receipts.
      affects_admissibility_of_the_numbers: false
    - id: DEF-065-2
      severity: advisory
      title: >-
        the gamma == 0.05 and gamma >= 0.02 slices are the only figures in the
        package NOT emitted by the mechanical generator
      detail: >-
        plant_z_regen.py's build_report emits exactly four aggregate views:
        all, by_family, by_family_gamma_le_0p05, by_family_and_cell. The
        `derived_slices_arithmetic_over_the_archived_block_counts` table in
        execution_report.yaml - which carries 19:2 (9.50), 28:3 (9.3333),
        40:3 (13.3333), ROUGH 17:0 and ALL 79:3 (26.3333) - is NOT in either
        archived JSON and was therefore derived outside the generator. Under
        the strict reading of MECH-GEN-1 ("no hand-written derived summary
        anywhere") this is a hand-derived summary; under the manifest's own
        narrower wording, MECH-GEN-1 is scoped to the two JSON files and is
        satisfied. I recomputed every one of those five slice figures from my
        own regeneration and ALL FIVE ARE CORRECT, so this is a provenance
        defect and not an arithmetic one. It matters because those exact
        figures are the ones the task card quotes and RR-LPF-2 is likeliest to
        restate.
      repair: >-
        RR-LPF-2 should cite the archived per-block counts and show the
        arithmetic, or the slices should be added to the generator in a
        superseding run.
    - id: DEF-065-3
      severity: advisory
      title: the snapshot commit message overstates what is archived by one clause
      detail: >-
        "The per-sample planted-Z arrays are now ARCHIVED" is not accurate as
        written: what is archived is the top 1000 Z values per block, per-block
        summaries and histograms, and 560 per-replicate rows. The very next
        clause of the same message enumerates exactly that, so the message is
        self-correcting; but the first clause is the one that gets quoted. The
        manifest's own PERTURB-TAIL-1 text is accurate ("archives their upper
        tails, per-replicate maxima, per-replicate exceedance counts").
      repair: none required; noted so it is not carried forward verbatim
    - id: DEF-065-4
      severity: advisory_but_the_most_important_one
      title: >-
        the per-cell maxima are rank-1 statistics and reintroduce exactly the
        instability TAIL-LPF-1 was designed to avoid
      detail: >-
        The driver's own docstring for stat_tail_deep says rank ten and not
        rank one was chosen DELIBERATELY because "a single extreme order
        statistic has an unstable law and was the proximate cause of the
        TAIL-DS-1 defect". The three successive corrections 4.957/4.643 ->
        5.936/6.031 -> 5.955369/6.916065 are corrections to a rank-1 statistic.
        The current figures are CORRECT for this seed - I recomputed them at
        tolerance zero - but they are not stable quantities: 6.91606451193366
        rests on a single planted integer, exceeding the second-highest
        replicate maximum in its own block by 1.36 in Z, and the bits-16
        "peak at gamma 0.01" is a 0.033 spread across three rungs. A different
        master seed would move both. If RR-LPF-2 restates D1 in terms of a
        maximum planted Z, a fourth correction is not merely possible, it is
        the expected behaviour of the statistic. Statements in terms of T_deep,
        of the exceedance count, or of the ROUGH structural bound do not carry
        this exposure.
      repair: >-
        A matter for TASK-20260801-066 and TASK-20260801-068, not for this
        report. Flagged because the task card asks whether these figures need a
        fourth correction: THEY DO NOT, but the class of statement does.
    - id: DEF-065-5
      severity: advisory
      title: the numeral pair 19:2 is ambiguous in this archive
      detail: >-
        19:2 (9.50) is simultaneously the SMOOTH gamma == 0.05 both-cells
        slice AND the SMOOTH bits == 20 all-rungs per-cell aggregate; both
        appear in the archive with the same counts by coincidence. Likewise
        21:1 (SMOOTH bits 16 all rungs) sits beside 11:1 (SMOOTH bits 16
        gamma 0.05). A restatement that writes "19:2" without naming the slice
        is ambiguous on its face.
      repair: RR-LPF-2 names family, cells and gamma slice for every ratio

  # ======================================================================
  # 9. HEURISTIC-VALIDATION AND COST-MODEL CHECKS
  # ======================================================================
  heuristic_validation_checks:
    - check: pre-registered prediction
      finding: >-
        APPLICABLE AND SATISFIED IN THE NARROW SENSE. The predictions this run
        tests are structural and were frozen in the driver before the data:
        build_rough_replacement's docstring states Z < 2 as a derived
        consequence of the construction, and the Dickman rho used by KS-DICK is
        solved numerically and checked against FROZEN_RHO_TABLE, never
        substituted from it. Nothing here fits a prediction after seeing data.
    - check: sample integrity
      finding: >-
        SATISFIED. MASTER_SEED 2301, the stream-offset table, the seed formula
        sha256("<seed>:<name>:<k>")[:16], the plant stream index g_i*1000+k,
        n = 130816, 20 replicates per rung and both 7-rung ladders are all in
        the manifest. I re-derived the seeds from that description alone and
        reproduced the archive bit-for-bit, which is the operational test of
        whether the description is complete. It is.
    - check: correspondence validity
      finding: >-
        NOT APPLICABLE. No correspondence substitutes for direct sampling here;
        the plants are constructed directly.
    - check: scale binding
      finding: >-
        TOY, AND RECORDED AS TOY. Field primes 46663 and 767551, i.e. 16 and 20
        bits. claim_tier toy is declared in the manifest, the raw result and the
