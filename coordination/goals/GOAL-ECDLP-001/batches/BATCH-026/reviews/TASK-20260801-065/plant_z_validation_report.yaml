        Neither archived output contains either EQD_FACTOR_BASE_SHA256 value
        (0 occurrences of each), nor any occurrence of the strings
        factor_base, fibre, OBJ-REAL, discrete log or relation. The only
        object-level content is the field prime p (46663 and 767551) and
        X = p**2, which the calibration arm is defined on.
      result: pass
    - id: CC-4
      check: null-object control present and of the same shape
      observed: >-
        Yes. Every planted replicate is measured against the SAME replicate's
        unplanted uniform base (OBJ-NULL-UNIF, integers uniform on [1, p**2]),
        which is the same object with the plant removed: paired, same n, same
        seed lineage. Exceedance is defined against that replicate's own null
        tenth-largest Z, not a pooled threshold. This satisfies the
        inventor-protocol §3 requirement that a reported signal be measured
        against a null object of the same shape.
      result: pass
    - id: CC-5
      check: >-
        does the measured quantity behave as the parameter meant to move it is
        varied (the artifact tell)
      observed: >-
        Mixed, and this is recorded as an observation and not as a defect. The
        ROUGH family behaves exactly as its construction predicts: max Z rises
        monotonically toward 2 with gamma and never reaches it (see CC-6). The
        SMOOTH per-block MAXIMUM does not increase monotonically with gamma
        even though the plant count does - see OBS-1 and DEF-065-4. The
        per-rung plant sets are drawn from independent stream indices
        (g_i*1000+k), so the rungs are not nested and a rank-1 statistic is
        free to invert between them. That is a sampling property of an extreme
        order statistic, not a decay failure of a claimed signal; but it is
        precisely why a maximum is a fragile thing to freeze.
      result: pass_with_observation
    - id: CC-6
      check: >-
        ROUGH structural bound, re-checked independently in exact integer
        arithmetic on all 462,736 rough plants
      observed: >-
        My own check, in Python object (arbitrary-precision) integers rather
        than int64, on every one of the 462,736 regenerated rough planted
        values, testing q > p, q | m, r = m//q < q, r <= v//q, Z < 2, AND
        additionally the primality of q and of r under my own Miller-Rabin
        (independent of the driver's is_prime): ZERO violations of every
        clause, in every one of the 14 rough blocks. Max rough Z anywhere
        1.994781310510841 (bits 20, gamma 0.05), max at bits 16
        1.9941869527759615. The chain r <= v//q <= p**2/q < p < q forces
        P_max = q and hence Z = ln(qr)/ln(q) < 2 holds on every value.
      result: pass

