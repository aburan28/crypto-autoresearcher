  independence:
    independent_session: true
    authored_or_executed_any_artifact_under_review: false
    independence_is_procedural_not_model_level: >-
      This harness resolves the producer of RUN-LPF-001-plantz and this
      validator to the same model family. Independence here is procedural only:
      a separate session, a separately written reduction, and recomputation
      rather than agreement by reading. Every numeric verdict below rests on
      code written in this session, not on reasoning about the executor's code.
    method: >-
      A fresh script (not archived; it is not a declared artifact) re-derived
      Stream.draw_seed from the manifest formula with hashlib and cross-checked
      it against the driver's Stream; re-drew the 20 uniform base replicates per
      cell from my own numpy Generator; computed Z, the tenth-largest Z, the
      per-block and per-replicate maxima, the exceedance counts, and the
      eviction/insertion accounting with my own implementations of every
      definition. plant_z_regen.py was READ but never imported or executed. The
      frozen driver WAS imported, because apply_plant /
      build_smooth_replacement / build_rough_replacement ARE the construction
      under test, not a reduction of it; every reduction downstream of them is
      mine.

  inference:
    requested_policy: review-adversarial
    resolved_model_id: claude-opus-5
    fallback_used: true
    fallback_reason: >-
      Claude Code subagent frontmatter cannot resolve the GPT-5.6-family policy
      alias named in orchestration/model-policies.yaml; CLAUDE.md requires
      recording the substitution rather than performing it silently.
    model_verified: false
    model_verified_reason: >-
      python3 -m orchestration.adapter doctor --probe was not run for this
      session, so the resolved identifier is unverified configuration.
    reasoning_effort: null
    degraded_allowed: false
    degraded_requirements: []
    independent_session: true

  claim_tier: toy
  interpretation: NONE
  adjudication: >-
    NONE. This report rules on admissibility only. It does not restate D1, does
    not restate V8, authors no reading rule, freezes no band, selects no branch
    and adjudicates no hypothesis. It sets no status. RR-LPF-2 is authored at
    TASK-20260801-066 and reviewed at TASK-20260801-068.

