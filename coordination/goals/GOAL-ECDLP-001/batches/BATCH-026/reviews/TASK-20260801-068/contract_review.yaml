  ruling_on_OPEN_RR066_A:
    open_item_id: OPEN-RR066-A
    question: >-
      Does mechanical regeneration from the flags mean the D9-struck ladder''s
      moving_rungs list should read [0.02] with the strike applied elsewhere
      (reading 2), or [] as written (reading 1)?
    the_raw_fact_recomputed: >-
      CONFIRMED BY MY OWN REGENERATION. The raw flag set for OBJ-PLANT-ROUGH /
      STAT-KS-DICK / bits 20 is [0.02] and not []. The gamma = 0.02 row carries
      LPF_movement_shift_in_null_sd = -1.402750452642616 with flag true. My
      independent audit over all 28 lists found exactly ONE flag-true rung
      omitted from its list, and it is this one.
    ruling: 'READING 1 IS CORRECT. THE LIST READS []. The strike is applied in step 2 of the generating operation and the raw flag set is disclosed rather than certified.'
    grounds_all_textual:
    - 'RR-LPF-1''s own certified_ladders note DEFINES the field - "Per-rung power is certified only at rungs whose own row moves; rungs below the movement floor are UNCERTIFIED and are listed as such." The field is a PER-RUNG POWER CERTIFICATE. A struck ladder certifies no power by definition of the strike, so its certificate is empty. This definition is frozen in RR-LPF-1 and carried unchanged; it is not invented at this supersession.'
    - 'The block is named certified_ladders, not flag_column. Writing [0.02] beside a bits_20 status of STRUCK would make the record self-contradictory on its face - asserting certified per-rung power inside a ladder declared to certify none.'
    - 'PERTURB-MOVE-1''s top-rung sentence is a rule about what the reading rule may LIST - "A FAMILY WHOSE TOP RUNG SHOWS NO MOVEMENT IS STRUCK FROM THE CERTIFIED LIST BY THE READING RULE RATHER THAN REPORTED AS LOW POWER." Listing the one moving rung of a family whose top rung is inert is exactly the selective report that sentence forbids.'
    - 'TASK-20260801-054 ruled under OPEN-RR052-C that the whole-ladder strike INCLUDING the moving gamma = 0.02 rung is correct and not overcautious. Reading 2 would partially undo a ruled item inside the certification table while leaving the STRUCK label standing, and RR-LPF-2 is forbidden to re-open a ruling.'
    - 'MECH-GEN-1 is not in tension with the strike once the operation is read as the TWO steps it states. Step 1 generates the raw flag set from the flags; step 2 applies the strike. The tension exists only if the operation is read as one step, and it is not. Nothing is concealed either way, because raw_flag_sets_all_28 publishes the flag column in full and I verified it at 28/28.'
    is_the_ruling_independent_of_which_answer_preserves_the_cap:
      answer: 'YES. STATED WITH THE COUNTERFACTUAL IN BOTH DIRECTIONS.'
      counterfactual_a: >-
        Suppose RR-LPF-1 had written [0.02] there, so that reading 2 preserved
        the count of three and reading 1 broke it. I WOULD STILL RULE READING 1,
        because grounds 1 to 5 are textual and none of them refers to what
        RR-LPF-1 happened to transcribe. On that counterfactual the correct
        outcome would be a FOURTH changed list and a REVISE on the declared count
        of three - not an adoption of reading 2.
      counterfactual_b: >-
        Suppose the archived flag at that row had been FALSE, so the two readings
        coincided. My ruling would be identical and vacuous.
      conclusion: >-
        The ruling turns on the frozen definition of the moving_rungs field and
        on PERTURB-MOVE-1''s text. It does not turn on the measured value
        -1.402750452642616, and it does not turn on which answer keeps the count
        at three.
    what_the_ruling_does_not_license: >-
      BOUND AS A CONDITION OF THE RULING. The empty list may NEVER be cited as
      evidence that the rough plant fails to move STAT-KS-DICK at bits 20 at
      gamma = 0.02. IT DEMONSTRABLY DOES - shift -1.402750452642616, flag true.
      That fact is preserved in three places (d9_handling''s seven-rung sequence,
      raw_flag_sets_all_28, and MECH-MOVE-RR066''s the_one_place_the_two_steps_differ)
      and V10 already forbids the converse misreading. The empty list records an
      absence of CERTIFIED POWER, never an absence of MEASURED MOVEMENT.
    the_tension_named_honestly: >-
      THE TENSION IS REAL AND THE COORDINATOR WAS RIGHT TO SURFACE IT RATHER THAN
      RESOLVE IT. MECH-GEN-1 read as a one-step operation and the D9 whole-ladder
      strike genuinely pull opposite ways on this one entry. What resolves it is
      that the field''s frozen definition is a certificate and not a copy of the
      flag column, and that the raw column is published beside it, so no reader
      depends on adopting my reading.

