  # DUTY 3 (prompt) - THE D1 RESTATEMENT
  # =====================================================================
  ruling_on_D1_v2:
    part_i_rough_rederived_from_source:
      verdict: 'CONFIRMED STRUCTURAL, UNCONDITIONAL, AND CORRECTLY LABELLED.'
      derivation: >-
        From build_rough_replacement source. q is drawn in [p+1, v//64] and the
        prime search runs while cand <= q_hi, so p < q <= v//64. r_hi = v // q
        and every one of the three r-selection paths returns r <= r_hi. For a
        sample v <= X = p**2, r <= v//q <= p**2/q < p < q, so q is strictly the
        largest prime factor, P_max = q exactly, and Z = ln(qr)/ln q =
        1 + ln r/ln q < 2. The chain uses only the construction''s own bounds and
        holds at every rung, every gamma, every replicate and both cells.
      edge_case_checked: >-
        q = max(q_lo, min(q_hi, q)) | 1 can push q to q_hi + 1 when q_hi is even.
        In that case cand > q_hi, the search body never runs, found_q = 0, and
        the attempt is retried. NO PATH ESCAPES q <= q_hi.
      execution: >-
        I imported the hash-bound driver and executed build_rough_replacement on
        my own inputs - 7,992 successful constructions over uniform v in [1, p**2]
        at both cells and 2,672 further constructions at the EDGE of the
        admissible range where the construction is most constrained. ZERO
        violations of q > p, r < q, r <= v//q, q | m, r | m, primality of q and r,
        Z < 2, and m <= v. Max observed Z 1.9906086945689119.
      zero_violations_across_all_462736: >-
        CONFIRMED FROM THE ARCHIVE. rough_structural_bound records plants_checked
        462736 with violations_total zero on every one of the five clauses,
        max_plant_z_over_all_rough_blocks 1.994781310510841, and
