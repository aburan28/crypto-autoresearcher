      every_number_recomputed: >-
        3 of 280 smooth instances with exactly one exceeding plant and 277 with
        none (distribution {0: 277, 1: 3} over 280 per_replicate rows); rough
        {0: 280}; 3 of 463,080 plants, 6.478e-06; 3 insertions and 40 evictions
        over 2,800 slots; rough 0 and 39; p99.99 5.535876141602368 below anchor
        6.060618052804848 and 5.190061837472107 below 5.762382565494627, and the
        bits-20 gamma = 0.02 block p99.99 5.260801146064238 also below; the three
        planted T_deep moves +0.16613459508532102, +0.04424795880325849,
        +0.06166194166478878, ALL UP; insertion rate 0.050 per replicate at both
        cells at gamma = 0.05 against eviction rates 0.550 and 0.400. ALL EXACT.
    part_iii_and_the_maxima:
      does_any_clause_depend_on_a_maximum: 'NO, FOR THE FOUR PER-CELL PLANTED-Z MAXIMA. Tested by mutation, not by reading.'
      method: >-
        I located every citation of the four maxima in the file and asked of each
        whether the clause would become false under a fourth correction. Every
        citation sits in one of - the declaration that they are relied on nowhere;
        a verbatim quote of withdrawn text; the withdrawal explanation; part (iii)
        arguments AGAINST relying on a maximum, which a fourth correction
        STRENGTHENS; the observations-only block; or the DEF-065-4 restatement.
      clauses_tested_and_found_independent:
      - 'D1-v2 part (i) - rests on the source-derived inequality r <= v//q <= p**2/q < p < q, which I re-derived and executed. Substituting any value for the smooth maxima changes nothing.'
      - 'D1-v2 part (ii) - rests on counts, a rate, generator aggregates, a p99.99 percentile and the rank-10 quantity. No maximum.'
      - 'STRIKE-1 - rests on 0 of 28 flagged rows with largest |shift| 0.3379820826156079. No planted-Z maximum.'
      - 'V8 - quotes p99.99, counts, the rate, the 462,736 zero-exceedance count and Z < 2. No maximum.'
      - 'All six branch conditions - none reads any planted Z, and none reads STAT-TAIL-DEEP at all, which is struck from the certifying set so L-5 leg 2 does not reach it either.'
      the_one_precision_note: >-
        RECORDED SO THE CLAIM IS NOT READ MORE BROADLY THAN IT IS TRUE. Two of
