  peak_memory_custody:
    rule: 'peak_live_bytes_system = max_t( shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )'
    shards_required: 8
    streams_required: 9
    stream_list: shared/setup context plus one complete allocation-event stream per BSGS shard
    receipt_requirement: >-
      one complete timestamped allocate/free event stream per shard plus the
      shared context stream, all on one host monotonic clock; every stream
      participates in the time-aligned aggregate, not in a maximum
    missing_shard: invalidates
    missing_shared_stream: invalidates
    multi_host_execution: invalidates
    sampled_or_polled_census: invalidates
    averaging_or_dividing: forbidden
    reuse_of_a_five_way_maximum: forbidden
    no_invariance_claim: true
    dedup_custody:
      definition: >-
        dedup(t) = sum over physical pages P live at t of (c_P(t) - 1) *
        bytes(P), where c_P(t) counts how many of the nine accounting terms
        charge P at t
      evidence_requirement: page-level census
      unproved_duplication: set to zero, so it can never reduce the reported peak
      shared_counted_exactly_once: true
    kats: coordination/goals/GOAL-ECDLP-001/batches/BATCH-8c58a3/tasks/TASK-20260815-6f4429/verification-and-null-kats.yaml
    kats_note: >-
