      (which itself carried KAT-PEAK-1 through 6 byte-identical from
      EXP-SYC-793304, with KAT-PEAK-7 new to repair item C). Not re-touched by
      D2 or V2.
    measured_values_present: false
    new_residual:
      id: PEAK-AGGREGATE-FIT-UNPROVED
      statement: >-
        the unchanged maximum_memory_gb ceiling of 2 binds an aggregate over
        nine concurrently live streams rather than a per-shard maximum; the
        aggregate can exceed any single per-shard figure by up to eightfold and
        no byte figure exists, so fit is unproved. Unchanged from
        EXP-SYC-793304 and EXP-SYC-edf98d; not targeted by D2 or V2 and not
        repaired here.
      cap_raised: false
      disposition: OPEN_CARRIED_FORWARD

