    - id: V2-BLOCKER-REPAIR-PROSE-SILENTLY-TRIMMED
      checkpoint_statement_verbatim: >-
        The successor's specification.yaml states, twice, that the
        blocker_repairs block is "CARRIED FORWARD UNCHANGED ... nothing else
        in it is touched" / "untouched in logic and conclusion." Five
        distinct sub-fields of supporting mathematical reasoning in the HA-2
        proof are ABSENT from the entire six-file successor package with no
        ITEM-X-style disclosure anywhere.
      remedy_mandated: (a) RESTORE the five missing sub-fields verbatim
      remedy_rationale: >-
        Restoring is a purely mechanical, verifiable byte-copy from an
        already-committed, immutable, frozen source, carries zero
        recomputation risk, and loses no information, unlike remedy (b) which
        would leave the actual supporting mathematical reasoning permanently
        missing even though disclosed.
      source: experiments/EXP-SYC-793304/specification.yaml blocker_repairs.HA2-EXPECTATION-NOT-TAIL.contract_3_simultaneous_tail
      five_sub_fields_to_restore_verbatim:
        - lemma_L2.non_vacuity_requirement.interpretation
        - lemma_L2.union_bound_conservatism_note
        - lemma_L3.conclusion (the explicit conclusion sentence)
        - lemma_L4.why_this_matters
        - lemma_L5.worked_bound
      exact_text:
        lemma_L2_non_vacuity_requirement_interpretation: >-
          HA-2's mean would have to be smaller by a factor of at least
          938.297567 (bits 30) and at most 1489.454545 (bits 18) at
          gamma_x=5/18, and by 2978.909091 at the gamma_x=1/3 ceiling, before
          even a vacuity-free union bound existed. The gap is not marginal
          and cannot be closed by choosing a different ladder size within the
          frozen scope.
        lemma_L2_union_bound_conservatism_note: >-
          The union bound requires no independence, which is why it is used
          here. HA-2 supplies no independence across tuples either, so a
          Poissonization or inclusion-exclusion refinement is not available
          as an alternative.
        lemma_L3_conclusion_sentence: >-
          Adding HA-3's second-moment shape does not rescue the familywise
          bound. The obstruction is not the crudeness of the first moment.
        lemma_L4_why_this_matters: >-
          A convention that yields P(overflow)=0 by fiat is not a
          certificate; it is the conclusion assumed. It also contradicts the
          design's own worst-case contract posture, under which occupancy up
          to 8*(L-1) is admissible. The convention is therefore admitted for
          HA-2 mean arithmetic only, exactly as the predecessor declared, and
          is explicitly refused for any tail statement.
        lemma_L5_worked_bound: >-
          For any integer m >= 1, Markov on X^m gives P(X >= 33) <=
          E[X^m]/33^m, and E[X^m] >= mu for nonnegative integer X, with
          equality only in the degenerate {0,1} case of L4. Even in that
          degenerate best case, the familywise bound at bits 18 requires
          33^m >= 98304*0.5 = 49152; since 33^3 = 35937 < 49152 <= 1185921 =
          33^4, no moment order below four suffices there, and any usable
          moment order must be justified by a new assumption that does not
          exist in H-SYC-b854f4.
      independent_verification_required: >-
        The producer must independently re-verify each quotation against
        experiments/EXP-SYC-793304/specification.yaml before writing it, not
        trust this transcription uncritically, and report any mismatch found.
      scope_limit: >-
        Exactly these five sub-fields; does NOT require touching
        frozen_literals_propagated_verbatim, SYSTEM-PEAK-LIVE-CONCURRENCY's
        defect table, or RT-OBJ2's explanatory sub-fields (named by both
        reviews as relocated-not-lost, out of scope for this remedy).
      no_numeric_or_disposition_change: >-
        No numeric row, bound, or final disposition label changes anywhere in
        blocker_repairs. Only the supporting prose is restored; the HA-2
        proof's logic and conclusion are unchanged.
