required_successor_repairs:
  - id: D2-ARCHIVE-ITEMIZATION-BASIS-OVERLOOKED
    severity: required_before_item_D_is_treated_as_correctly_closed
    checkpoint_statement_verbatim: >-
      The producer's disposition ITEM-D-ITEMIZATION-NOT-ACHIEVABLE-WITHOUT-
      FABRICATION is FALSE for archive_scheduled_bytes and TRUE for
      communication_scheduled_bytes. Both reviewers, independently, followed a
      hash-pinned reference one hop past what the producer searched
      (EXP-SYC-12de89/specification.yaml's own cited binding to
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-68ea16/tasks/TASK-20260811-cb5d76/physical-frontier-compiler.yaml)
      and found that file's archive_hashing_mount_state_scaling section
      supplies a genuine per-ladder-size decomposition: n_c_by_size =
      [177118029, 357047457, 716906313, 1436624022, 2876059443] for bits
      [18,21,24,27,30], summing EXACTLY to 5563755264 (archive_scheduled_bytes).
      This exact x3-mount-state-multiplier derivation was independently
      verified FOUR times total: by that earlier batch's own Validator
      (TASK-20260811-b34084) and Red Team (TASK-20260811-c0a729) when it was
      first derived, and now again by BATCH-11dc7b's Red Team and Validator.
    required_fix:
      basis_citation: >-
        Cite
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-68ea16/tasks/TASK-20260811-cb5d76/physical-frontier-compiler.yaml's
        archive_hashing_mount_state_scaling section (id
        VAL-EA56C5-ARCHIVE-COMMUNICATION-repair, closing finding
        VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED) as the archive
        itemization basis, in specification.yaml, custody-and-executable-contract.yaml,
        and physical-frontier-compiler.yaml alike.
      archive_row_values:
        n_c_by_size: [177118029, 357047457, 716906313, 1436624022, 2876059443]
        bits: [18, 21, 24, 27, 30]
        sum: 5563755264
        arithmetic_check: 177118029 + 357047457 + 716906313 + 1436624022 + 2876059443 = 5563755264
        derivation: >-
          x3 mount-state multiplier applied to archive_hashing's predecessor
          (EXP-SYC-268d6f, unrepaired) n_c_by_size [59039343, 119015819,
          238968771, 478874674, 958686481], tied to
          verification_accounting.mount_state_count=3, on the grounds that no
          other formula for archive_hashing appears anywhere in either
          compiler document and this is the minimal, non-arbitrary completion
          consistent with its column sibling scalar_witness_verification's
          already-verified x3 scaling.
      uncertainty_disclosure_required: >-
        This basis must be cited with its OWN disclosed uncertainty preserved,
        not presented as certain: the x3 multiplier is a DERIVED, not
        directly-stated, inference (no artifact gives archive_hashing's
        per-verification byte formula explicitly). An alternative
        additive-delta derivation (modeled on physical_memory_topology's own
        confirmed flat 1171783680-byte-per-size delta approach) was also
        computed there and gives a different, LARGER total of 7713503488,
        used as a robustness check and NOT adopted. Both facts must be
        reproduced, not omitted.
      communication_disposition_required: >-
        CONTINUE to record communication_scheduled_bytes (5614086912) as
        NOT_ACHIEVABLE_WITHOUT_FABRICATION -- both independent reviews of
        BATCH-11dc7b confirmed this disposition IS correct for communication
        specifically, since no comparable per-row basis exists anywhere in the
        inherited chain (only a weaker, disclosed-as-uncertain total-level x3
        relationship: 5614086912 = 3 x 1871362304, an "explicitly weaker, more
        uncertain extrapolation" by symmetry alone with no named class, not a
        row-level itemization). The disposition must be re-scoped to
        communication ALONE, not stated as applying to both totals as the
        predecessor's disposition wrongly did.
      unchanged_scalars:
        archive_scheduled_bytes: 5563755264
        archive_hard_cap_bytes: 2307745600
        archive_over_cap_bytes: 3256009664
        communication_scheduled_bytes: 5614086912
        communication_hard_cap_bytes: 2328717120
        communication_over_cap_bytes: 3285369792
      what_must_not_change: >-
        None of the six scalars above changes. Only the archive itemization is
        added and the "not achievable" claim's scope is corrected to
        communication alone.
    found_by:
      - validator TASK-20260815-0825b2 finding V-1-ARCHIVE-ITEMIZATION-BASIS-OVERLOOKED
      - red-team TASK-20260815-4f54d6 blocker_by_blocker_findings.D-ARCHIVE-COMMUNICATION-ITEMIZATION-GAP

  - id: V2-BLOCKER-REPAIR-PROSE-SILENTLY-TRIMMED
    severity: required_before_this_block_can_be_trusted_at_face_value
    checkpoint_statement_verbatim: >-
      The successor's specification.yaml states, twice, that the
      blocker_repairs block (covering the HA-2 tail-unavailability proof and
      the SYSTEM-PEAK-LIVE-CONCURRENCY repair) is "CARRIED FORWARD UNCHANGED
      ... nothing else in it is touched" / "untouched in logic and
      conclusion." The Validator's byte-level diff against the frozen
      predecessor EXP-SYC-793304 shows this is FALSE AS A LITERAL, CHECKABLE
      STATEMENT: five distinct sub-fields of supporting mathematical reasoning
      in the HA-2 proof are ABSENT from the entire six-file successor package
      with no ITEM-X-style disclosure anywhere -- lemma L2's
      non_vacuity_requirement.interpretation and union_bound_conservatism_note;
      lemma L3's explicit conclusion sentence; lemma L4's why_this_matters;
      lemma L5's worked_bound moment-order argument.
    remedy_choice: >-
      Remedy (a) is REQUIRED for this batch: RESTORE the five missing
      sub-fields verbatim, byte-for-byte, from
      experiments/EXP-SYC-793304/specification.yaml's
      blocker_repairs.HA2-EXPECTATION-NOT-TAIL.contract_3_simultaneous_tail
      block. Do not paraphrase or reconstruct from memory; quote the exact
      text below. This Coordinator's rationale (recorded for the producer, not
      a license to deviate): restoring is a purely mechanical, verifiable
      byte-copy from an already-committed, immutable, frozen source, carries
      zero recomputation risk, and loses no information, unlike remedy (b)
      (an honest disclosure of absence) which would leave the actual
      supporting mathematical reasoning permanently missing from the record
      even though disclosed. The checkpoint's own required_control names
      restoring as one of two independently sufficient remedies; this batch
      selects it for the reason above.
    exact_text_to_restore:
      lemma_L2_non_vacuity_requirement_interpretation: >-
        HA-2's mean would have to be smaller by a factor of at least
        938.297567 (bits 30) and at most 1489.454545 (bits 18) at
        gamma_x=5/18, and by 2978.909091 at the gamma_x=1/3 ceiling, before
        even a vacuity-free union bound existed. The gap is not marginal and
        cannot be closed by choosing a different ladder size within the frozen
        scope.
      lemma_L2_union_bound_conservatism_note: >-
        The union bound requires no independence, which is why it is used
        here. HA-2 supplies no independence across tuples either, so a
        Poissonization or inclusion-exclusion refinement is not available as
        an alternative.
      lemma_L3_conclusion_sentence: >-
        Adding HA-3's second-moment shape does not rescue the familywise
        bound. The obstruction is not the crudeness of the first moment.
      lemma_L4_why_this_matters: >-
        A convention that yields P(overflow)=0 by fiat is not a certificate;
        it is the conclusion assumed. It also contradicts the design's own
        worst-case contract posture, under which occupancy up to 8*(L-1) is
        admissible. The convention is therefore admitted for HA-2 mean
        arithmetic only, exactly as the predecessor declared, and is
        explicitly refused for any tail statement.
      lemma_L5_worked_bound: >-
        For any integer m >= 1, Markov on X^m gives P(X >= 33) <=
        E[X^m]/33^m, and E[X^m] >= mu for nonnegative integer X, with equality
        only in the degenerate {0,1} case of L4. Even in that degenerate best
        case, the familywise bound at bits 18 requires 33^m >= 98304*0.5 =
        49152; since 33^3 = 35937 < 49152 <= 1185921 = 33^4, no moment order
        below four suffices there, and any usable moment order must be
        justified by a new assumption that does not exist in H-SYC-b854f4.
      source: >-
        experiments/EXP-SYC-793304/specification.yaml lines ~451-517
        (blocker_repairs.HA2-EXPECTATION-NOT-TAIL.contract_3_simultaneous_tail.lemma_L2_first_moment_union_bound.non_vacuity_requirement.interpretation,
        .union_bound_conservatism_note; .lemma_L3_second_moment_route_also_vacuous.conclusion;
        .lemma_L4_zero_o1_convention_is_not_tail_safe.why_this_matters;
        .lemma_L5_what_would_be_required.worked_bound). This Coordinator
        transcribed the quotations above directly from that committed,
        immutable file; the producer must verify them independently against
        the same source before writing them into EXP-SYC-ff777e and report
        any transcription mismatch it finds as a defect rather than silently
        correcting it.
    scope_limit: >-
      This fix restores exactly the five named sub-fields above and nothing
      else. It does not require restoring or re-disclosing
      HA2-EXPECTATION-NOT-TAIL's frozen_literals_propagated_verbatim table,
      SYSTEM-PEAK-LIVE-CONCURRENCY's defect_being_replaced/rejected_rules
      table, or RT-OBJ2's what_changed_and_why/dependent_numeric_values
      sub-fields -- those items are named by the reviews as reformatted /
      relocated-not-lost (their underlying facts survive elsewhere in the
      package), and the two-review record does not require this remedy to
      additionally touch them. Do not expand this fix beyond the five named
      sub-fields.
    no_numeric_or_disposition_change: >-
      Do not change any numeric row, bound, or final disposition label
      anywhere in blocker_repairs -- both reviews confirmed those are all
      already correct. V2 is purely about the block's self-description being
      false, not about any figure being wrong. The HA-2 tail-unavailability
      proof's LOGIC and CONCLUSION are unchanged by this fix; only its
      SUPPORTING PROSE is restored.
    found_by:
      - validator TASK-20260815-0825b2 finding V-2-BLOCKER-REPAIR-PROSE-SILENTLY-TRIMMED

