  repair_summary:
    marginal_estimand:
      prior_blocker: >-
        Conditional complementary-log-log effects, unspecified random-effect
        integration, realized-D exposure, undefined floor correction, and an
        unstated proportional-hazard premise did not identify marginal p_N.
      specified_repair: >-
        The primary estimand is an equal-curve, uniform-four-model marginal
        Boolean probability. A constrained marginal Bernoulli log-link uses
        beta=gamma_s-1/3, so gamma_s=beta+1/3 exactly. It has no random effects,
        no D exposure, zero D/floor offsets, and no proportional-hazard premise.
      marginalization: >-
        Equal averaging over roots and models inside each curve, then equal
        averaging over curves. No quadrature or conditional conversion exists.
      bootstrap: >-
        8191 size-stratified nonparametric whole-curve resamples; statistic is
        the refitted marginal gamma. Type-1 order statistics 41 and 8151 form
        the 99-percent interval and one-sided 99.5-percent bounds.
      status: specified_for_independent_recomputation

    clustering_positive_control:
      prior_blocker: >-
        Existing gamma plants moved match expectation and Boolean success
        together and did not test polynomial root concentration.
      specified_repair: >-
        Two deterministic streams use N=2^b for b in {18,21,24,27,30}, 32
        clusters, and 8192 roots per cluster. Both have E[X]=E[Y]=1/4. The
        concentrated stream has kappa_N=N^(1/3) and Boolean success lower by
        N^(-1/3).
      exact_totals:
        roots_per_stream: 1310720
        roots_both_streams: 2621440
        sum_X_each_size_each_stream: 65536
        diffuse_successes_each_size: 65536
        concentrated_successes_by_bits: {18: 1024, 21: 512, 24: 256, 27: 128, 30: 64}
        concentrated_sum_X_squared_by_bits: {18: 4194304, 21: 8388608, 24: 16777216, 27: 33554432, 30: 67108864}
      powered_gates: >-
        Every cluster satisfies the planted moment identities, so every legal
        cluster resample preserves delta_kappa=+1/3 and delta_ratio=-1/3 at
        eta=0. Required margins are greater than +0.313333 and less than
        -0.313333 under every eta. Prospective resampling power is algebraically
        one; no run is claimed.
      status: specified_for_independent_recomputation

    repeated_coverage:
      prior_blocker: One interval containing a plant is not coverage calibration.
      specified_repair: >-
        Four gamma cells each use 512 complete synthetic datasets processed by
        the unchanged marginal estimator and all 8191 bootstrap draws.
      nominal_coverage: 0.99
      acceptance_interval_count: [500, 512]
      exact_lower_tail_probability_at_499: 0.002329740788839534
      directional_miss_cap: 7
      stopping_rule: >-
        No favorable early stop. Stop early only when remaining datasets cannot
        mathematically reach 500 covers or either directional misses exceed seven.
      status: specified_for_independent_recomputation

    isomorphism_apparatus:
