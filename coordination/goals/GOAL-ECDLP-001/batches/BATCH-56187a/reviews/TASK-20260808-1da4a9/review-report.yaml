  verdict: REVISE
  verdict_summary: >-
    The versioned successor repairs the load-bearing marginal estimand and
    Boolean bridge at proposal level. The direct marginal Bernoulli log-link
    has gamma_s=beta+1/3 exactly, has no random effects, D exposure, floor
    offset, conditional-to-marginal conversion, or proportional-hazard
    premise, and its whole-curve percentile bootstrap has the correct 41st and
    8151st order-statistic endpoints. The deterministic matched-mean control
    also recomputes exactly: both arms have E[X]=E[Y]=1/4, while the
    concentrated arm has kappa=N^(1/3), p/E[X]=N^(-1/3), and Boolean gamma_s
    lower by 1/3; every legal cluster resample preserves the two bridge slopes.
    The isomorphism algebra, headline group-operation rows, lossless bucket
    bit widths, declared archive-row sum, live-memory sum, stage sums, primary
    power arithmetic, conditional asymptotic gates, proof_search_map, method
    ceiling, Pareto comparisons, novelty boundary, and proposal-only ceiling
    also pass their stated recomputations. The successor nevertheless does not
    repair every frozen blocker. Its repeated-coverage workload counts only
    one eta even though the estimator and seed domain require 8191 refits for
    each of three eta values, so the exact count is 50325504 rather than
    16775168. It also supplies one gamma_ref and four coverage cells although
    eta=-4 and eta=4 have different pseudo-true slopes. Separately, the exact
    label count includes all five selector controls, but the selected-pair
    hash writes, join lookups, candidate-verification queries, candidate
    archive slots, and most local selected-pair traffic count treatment only.
    Under the stated same-selector/no-reuse rule those controls contribute up
    to 650117120 additional selected-pair events, 325058560 additional joins,
    and 6553600 additional candidate slots; using the declared record widths
    would put local traffic above its hard cap. Finally, the hard
    isomorphism gate refers to seeded unequal pairs without defining their
    generator, count, transforms, equality queries, or archive record. These
    are blocking but versionable design contradictions, not observations
    about signed-y propagation or ECDLP.

