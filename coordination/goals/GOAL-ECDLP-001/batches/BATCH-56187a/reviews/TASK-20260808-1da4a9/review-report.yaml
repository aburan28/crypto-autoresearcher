  cheapest_falsification_control:
    name: matched_mean_Boolean_bridge_decoder_and_estimator_fixture
    priority: first_control_after_the_design_contract_is_repaired
    construction: >-
      Materialize only the two deterministic matched-mean root streams already
      specified, decode their reversible bitsets and multiplicity table, and
      run the exact marginal, kappa, p/E[X], eta-sensitivity, and whole-curve
      bootstrap code with the repaired seed domains. Do not generate a curve,
      scalar multiple, label histogram, selected pair, or signed-y treatment.
    exact_expected_result: >-
      Both streams must decode to E[X]=E[Y]=1/4. The diffuse arm must have
      kappa slope zero, p/E[X] slope zero, and gamma_s=1/3. The concentrated
      arm must have kappa slope +1/3, p/E[X] slope -1/3, and gamma_s=0, with
      every deterministic bridge resample clearing the +/-0.3133333333333333
      gates under all eta values.
    falsification_rule: >-
      Any decode mismatch, unequal match mean, failure to recover the planted
      bridge slopes, or failure to separate the Boolean gamma values by 1/3
      falsifies the inference apparatus before any group selector is built.
    why_cheapest: >-
      The fixture uses deterministic integer/root records only and directly
      attacks the premise converting match expectation into restart success.
      It is cheaper and more discriminating than curve generation, group-list
      construction, or even the full selector controls.
    authorization_note: >-
      This is a recommendation for a future separately authorized experiment
      contract. It was not executed here and this review does not authorize it.

  limitations:
    - >-
      This review validates a proposal snapshot, not a completed experiment or
      run. There are no run IDs, raw curve samples, measured gamma_s values,
      recovered live keys, throughput observations, or empirical costs.
    - >-
      The knowledge MCP tools were unavailable and the local KB CLI could not
      start because pydantic_settings is absent. The exact frozen-tree fallback
      verifies only repository-local deduplication; external novelty remains
      unverified.
    - >-
      KN-TECH-035 supports the repository's exponent-level wiring convention,
      not the candidate-specific access constant, energy, or real-machine
      price. HA-6 and future measured access tables remain necessary.
    - >-
      Even a fully repaired and executed 18--30-bit design would be toy-scale
      evidence on one frozen family/model schedule. It could not establish the
      eventual asymptotic quantifier or change deployed-curve security.
    - >-
      No backend/model probe was run. Native provenance is bound only to the
      authenticated ChatGPT-backed Codex session emitted by this run.

