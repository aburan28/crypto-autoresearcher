  marginal_boolean_estimand_audit:
    probability_space:
      status: satisfied
      finding: >-
        Curves and targets are outer family draws; each curve has equal weight,
        the four fixed public models have weight 1/4 inside a curve, and roots
        have weight 1/256 inside a model. Isomorphic models are nested repeated
        observations and never independent family draws.
    direct_log_link:
      status: satisfied
      recomputation: >-
        log p_i=alpha+beta log(N_i/2^24)+eta(N_i^(-1/3)-2^-8).
        The fixed eta term tends to the constant -eta*2^-8, which is absorbed
        by alpha. Therefore log p_N/log N tends to beta and the exact link is
        gamma_s=beta+1/3. No rare-event, complementary-log-log, or hazard
        approximation is used.
    random_effects_and_marginalization:
      status: satisfied
      recomputation: >-
        There is no random effect to integrate. The working composite
        likelihood targets the displayed marginal mean directly, while
        dependence affects uncertainty through size-stratified whole-curve
        resampling. This removes the predecessor's conditional-versus-marginal
        defect at design level.
    D_and_floor_exposure:
      status: satisfied
      recomputation: >-
        D remains a retained selector diagnostic and has coefficient zero.
        Both the D and floor offsets are exactly zero. The proposal makes no
        proportional-hazard-in-D assumption, so it does not double count L,
        M, bucket, floor, or realized exposure variation.
    point_estimator:
      status: satisfied_conditionally
      finding: >-
        Each size has total weight one, each of 32 curves weight 1/32, each
        model 1/4, and each root 1/256. A free intercept prevents constant
        enrichment from becoming a slope. The constrained marginal mean is a
        legitimate finite-design estimand subject to HA-7 and the declared
        all-draw convergence rule; it does not establish an asymptotic family
        law by itself.
    bootstrap_statistic:
      status: satisfied
      finding: >-
        A resample moves one complete curve-target cluster, including all four
        models and all roots, and refits gamma_star=beta_star+1/3 with the
        unchanged estimator. Sizes are fixed strata. No residual, score,
        null-restricted, random-effect, or studentized substitution is allowed.
    bootstrap_quantiles:
      status: satisfied
      recomputation: >-
        For 8191 converged values, type-1 quantiles use ceil(8191*0.005)=41
        and ceil(8191*0.995)=8151, so the 41st and 8151st one-indexed order
        statistics are exactly the two-sided 99-percent percentile endpoints
        and one-sided 99.5-percent bounds.
    bootstrap_seed_stream:
      status: blocking_specification_gap
      finding: >-
        The seed domain includes arm, eta, and draw but not size or dataset,
        while the prose requires independent resampling at each size. One
        SHAKE256 stream could be consumed sequentially across sizes, restarted
        per size, or reused at every size; those implementations are not
        equivalent. For repeated coverage, arm is also not explicitly defined
        to include gamma and dataset.
      required_revision: >-
        Put size and, for coverage, gamma and dataset directly in the seed
        domain, or freeze an exact XOF byte-consumption order and nonoverlapping
        offsets that gives 32 indices for every size and dataset.
    overall_status: repaired_except_for_seed_binding_used_by_coverage

  matched_mean_control_audit:
    generator:
      status: satisfied
      recomputation: >-
        Sixteen low clusters have A_c=1024 and sixteen high clusters have
        A_c=3072, so each size has 262144 roots and sum A_c=65536. Every A_c is
        divisible by kappa_b in {64,128,256,512,1024}; the ranking rules make
        active positions deterministic without selecting from data.
    exact_means:
      status: satisfied
      values:
        total_roots_per_size: 262144
        sum_X_per_size_each_arm: 65536
        sum_Y_per_size_each_arm: 65536
        E_X_each_arm: 0.25
        E_Y_each_arm: 0.25
        gamma_x_each_arm: 0.3333333333333333
    diffuse_stream:
      status: satisfied
      active_roots_each_size: 65536
      sum_X_squared_each_size: 65536
      kappa_each_size: 1
      p_each_size: 0.25
      gamma_s: 0.3333333333333333
    concentrated_stream:
      status: satisfied
      rows:
        - {order_bits: 18, kappa: 64, active_roots: 1024, sum_X_squared: 4194304, p: 0.00390625}
        - {order_bits: 21, kappa: 128, active_roots: 512, sum_X_squared: 8388608, p: 0.001953125}
        - {order_bits: 24, kappa: 256, active_roots: 256, sum_X_squared: 16777216, p: 0.0009765625}
        - {order_bits: 27, kappa: 512, active_roots: 128, sum_X_squared: 33554432, p: 0.00048828125}
        - {order_bits: 30, kappa: 1024, active_roots: 64, sum_X_squared: 67108864, p: 0.000244140625}
      gamma_s: 0.0
    exact_relations:
      status: satisfied
      recomputation: >-
        In every cluster, sum X^2=kappa_b*sum X and sum S=sum X/kappa_b.
        Thus kappa_b=N_b^(1/3), p_concentrated=p_diffuse*N_b^(-1/3), and
        p_concentrated/E[X]=N_b^(-1/3), while both E[X] and E[Y] remain 1/4.
    bootstrap_invariance:
      status: satisfied
      recomputation: >-
        The two clusterwise identities survive every multiset of 32 resampled
        clusters. Hence delta_kappa=+1/3 and delta_ratio=-1/3 exactly at eta=0
        in every legal resample. Cluster composition may change Boolean p, but
        cannot change either load-bearing bridge ratio.
    eta_sensitivity_and_tolerances:
      status: satisfied
      recomputation:
        eta_minus_4_delta_kappa: 0.3265707003291663
        eta_zero_delta_kappa: 0.3333333333333333
        eta_plus_4_delta_kappa: 0.34009596633750033
        eta_minus_4_delta_ratio: -0.34009596633750033
        eta_zero_delta_ratio: -0.3333333333333333
        eta_plus_4_delta_ratio: -0.3265707003291663
      finding: >-
        Every kappa slope remains above 0.3133333333333333 and every ratio
        slope remains below -0.3133333333333333. The eta=0 diffuse slopes are
        exactly zero and the eta=0 Boolean gamma gap is exactly 1/3, so the
        1e-8 deterministic tolerances are coherent.
    prospective_power:
      status: satisfied_as_algebraic_design_power
      finding: >-
        The two bridge-gate detection probabilities are one under the frozen
        cluster-resampling law because the identities hold in every possible
        resample. This is prospective deterministic control power only, not an
        observed result or evidence that treatment clustering is subpolynomial.
    overall_status: satisfied_at_design_level

  repeated_coverage_audit:
    schedule:
      status: satisfied
      gamma_cells: 4
      complete_datasets_per_gamma: 512
      complete_datasets_total: 2048
      unique_bits: 83886080
      bitset_bytes: 10485760
      finding: >-
        4*512*5*32*256=83886080 unique root bits. Reusing each bit by reference
        across four models correctly tests that repeated models are not
        resampled as independent curves.
    generator_probability:
      status: arithmetic_satisfied_determinism_revision
      recomputation: >-
        The low and high clusters have probabilities 0.8*p_b and 1.2*p_b and
        occur 16 times each, so their unquantized family mean is p_b. Across
        the four gamma labels and five sizes the extreme cluster probabilities
        are 0.04 and 0.96. Averaging the two uint128 thresholds gives the
        stated rational q_b with error below 2^-128.
      blocking_gap: >-
        T=floor(2^128*0.2*(N/2^24)^(gamma-1/3)*(1+0.2z)) uses a real
        exponent, but no exact arithmetic, precision, rounding, or correctly
        rounded transcendental routine is frozen. The general integer
        convention does not determine these threshold integers.
      required_revision: >-
        Precompute and commit every uint128 threshold and eta-specific
        reference value, or freeze a reproducible correctly rounded arithmetic
        algorithm with enough precision to certify every floor.
    interval_ranks:
      status: satisfied
      finding: >-
        The unchanged type-1 8191-draw interval uses ranks 41 and 8151, and a
        missing or regenerated draw is correctly made inconclusive.
    acceptance_band:
      status: satisfied_for_one_defined_interval_family
      recomputation: >-
        For C distributed Binomial(512,0.99), Pr(C<=499) is
        0.002329740788839529, so 500<=C<=512 is a conservative discrete central
        99-percent acceptance set.
    directional_miss_cap:
      status: satisfied
      recomputation: >-
        For M distributed Binomial(512,0.005), Pr(M<=6) is
        0.9843311942110489 and Pr(M<=7) is 0.9952460066837686. Seven is
        therefore the type-1 0.995 quantile, and either directional count above
        seven is a valid impossible-to-accept stop.
    stopping_rule:
      status: satisfied
      finding: >-
        covered_so_far+remaining<500, lower_misses>7, and upper_misses>7 are
        exactly the monotone conditions under which final acceptance cannot be
        recovered. Favorable early stopping is forbidden and partial bits are
        retained.
    eta_reference_and_cell_definition:
      status: blocking_revision
      finding: >-
        The proposal requires every control fit under eta in {-4,0,4} and the
        bootstrap seed domain has a separate eta field, but coverage defines
        one gamma_ref and only four gamma cells. The claimed gamma_ref within
        2^-100 of the nominal label is true for eta=0 after uint128
        quantization, not for eta=-4 or eta=4. For nominal gamma=0.30, the
        pseudo-true direct-log-link fits are approximately
        0.2929769266507037, 0.30, and 0.3070295604541843 for eta=-4,0,4.
        Testing all three intervals against one nominal reference therefore
        does not define a 0.99 coverage experiment.
      required_revision: >-
        Either declare that repeated coverage calibrates eta=0 only and give a
        separate justified sensitivity rule, or define twelve gamma-by-eta
        coverage cells with an eta-specific pseudo-true rational reference and
        explicit simultaneous acceptance rule.
    bootstrap_refit_count:
      status: blocking_revision
      declared: 16775168
      recomputed_one_eta: 16775168
      recomputed_three_eta: 50325504
      recomputation: >-
        2048*8191=16775168 is only one eta. The mandatory eta-specific seed and
        unchanged refit for all three fixed eta values require
        2048*8191*3=50325504 bootstrap refits, before point fits and convergence
        bookkeeping.
      impact: >-
        S2 CPU, wall, throughput, fit-summary, and convergence budgets are not
        bound to the analysis that the proposal says must pass before
        treatment.
    overall_status: blocking_revision

  isomorphism_apparatus_audit:
    map_algebra:
      status: satisfied
      recomputation: >-
        Substituting x'=u^2*x and y'=u^3*y multiplies both sides of the source
        curve equation by u^6 and gives A'=A*u^4 and B'=B*u^6. Nonzero u has
        inverse map (u^-2*x,u^-3*y), and the map preserves addition, equality,
        discrete logs, and scalar recovery.
    distinct_public_models:
      status: satisfied_conditionally
      finding: >-
        Requiring the three (u^4,u^6) tuples to be pairwise distinct and
        different from (1,1) excludes u values differing only by sign and
        excludes the canonical coefficient model. The declared exceptional-
        curve admission checks must also exclude coefficient degeneracies.
    positive_fixture_generator:
      status: satisfied
      recomputation: >-
        Choosing b=sum r_j-a*k modulo N makes A0+B0=[sum r_j]P equal
        Q'=[a*k+b]P. Nonzero a then gives
        k_hat=a^-1(sum r_j-b)=k modulo N, so both canonical and transformed
        scalar checks must succeed.
