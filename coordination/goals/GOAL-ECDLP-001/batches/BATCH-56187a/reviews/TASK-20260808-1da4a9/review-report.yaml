  findings:
    - id: F1-coverage-eta-workload-and-determinism
      severity: critical
      blocking: true
      category: repeated_coverage_and_statistical_contract
      observation: >-
        The coverage design has correct ranks, binomial band, miss cap, and
        stopping rule, but its work count covers one eta while the frozen
        estimator requires three. It defines one gamma_ref and four cells even
        though fixed eta sensitivities have different pseudo-true slopes, and
        neither bootstrap size/dataset seed separation nor the real-to-uint128
        threshold rounding is fully deterministic.
      impact: >-
        The claimed nominal coverage, all-draw convergence, S2 resource budget,
        and treatment-admission gate do not refer to one executable analysis.
        A later implementation could pass a different coverage test or require
        roughly three times the declared refits without violating the current
        prose.
      required_revision:
        - Define eta-specific coverage targets and acceptance cells, or explicitly limit calibration to eta=0 with a separate justified sensitivity rule.
        - Replace 16775168 with 50325504 refits if all three eta values remain mandatory and recompute S2 CPU, wall, throughput, and retained summaries.
        - Freeze exact uint128 thresholds or a certified correctly rounded generator.
        - Include size, gamma, and dataset in bootstrap seed domains or freeze exact nonoverlapping XOF offsets.

    - id: F2-selector-control-cost-and-archive-scope
      severity: critical
      blocking: true
      category: operations_traffic_and_lossless_artifacts
      observation: >-
        All five selector controls are charged for labels and bucket counters,
        but their selected-pair events, joins, candidate queries, candidate
        archive slots, and most pair traffic are absent. The current candidate
        array exactly covers treatment and cannot retain every promised control
        candidate. Applying the declared record widths to the missing control
        rows exceeds the local-traffic hard cap and consumes almost all archive
        reserve.
      impact: >-
        The supposedly exact operation, traffic, archive, communication, and
        20-percent admission budgets are not upper bounds for the frozen
        controls. Resource exhaustion would be infrastructure rather than
        ECDLP evidence, but the current design would not preserve the evidence
        needed to classify even that failure.
      required_revision:
        - Add separate exact selected-pair, hash-write, join, equality, witness-verification, and candidate rows for every selector control.
        - Freeze a lossless synthetic selected-pair and candidate schema if it differs from treatment and derive its traffic and archive bytes.
        - Recompute archive, communication, live/peak, spill/workspace, wall, and CPU reserves from the complete rows.
        - Preserve every control candidate verification record or narrow the artifact promise with a justified lossless audit scheme.

    - id: F3-isomorphism-negative-fixture-is-undefined
      severity: major
      blocking: true
      category: pre_treatment_correctness_gate
      observation: >-
        The map, inverse, homomorphism, planted equality, and scalar-recovery
        fixtures are correct and are now hard pre-treatment gates. The promised
        seeded unequal-pair check has no generator, rejection rule, count,
        transform/query budget, or archive representation.
      impact: >-
        The negative equality direction cannot be reproduced or proven to have
        gated every treatment curve/model, and the exact operation/archive
        tables omit the work of a mandatory correctness fixture.
      required_revision:
        - Specify deterministic unequal fixtures and their noncollision proof.
        - Gate them on all 160 curves and three noncanonical models before treatment.
        - Charge and retain their additions, transforms, equality outcomes, seeds, and hashes.

    - id: F4-marginal-estimand-repair-passes
      severity: informational
      blocking: false
      category: success_probability_estimand
      observation: >-
        The direct marginal Bernoulli log-link, exact gamma_s=beta+1/3
        identity, no-random-effect law, explicit design marginalization, zero
        D/floor offsets, no-hazard premise, whole-curve bootstrap statistic,
        and percentile ranks repair the predecessor's conditional/marginal and
        exposure defects.
      impact: >-
        After the separate seed and coverage repairs, a fitted gamma has the
        same finite-design meaning as the marginal Boolean probability used in
        inverse-success accounting. It remains conditional on HA-7 and cannot
        establish an asymptotic law from toy sizes.
      required_revision: []

    - id: F5-matched-mean-bridge-control-passes
      severity: informational
      blocking: false
      category: Paley_Zygmund_observation_collision
      observation: >-
        Exact means, second moments, kappa values, Boolean probabilities,
