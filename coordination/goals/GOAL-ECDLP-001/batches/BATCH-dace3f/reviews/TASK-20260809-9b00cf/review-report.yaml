      independent_recomputation: >-
        The treatment and selector list components contain L=64,128,256,512,
        or 1024 accepted items (L=U-1 for the exact quotient), totaling
        65011712 treatment items, 4*65011712 generic-control items, and
        64847872 exact-quotient items. Candidate-word semantics gives every
        accepted item a fresh SHAKE256 state, but the only listed key fields are
        bits, curve/cluster, root, arm, and component=list-j. No item ordinal or
        deterministic per-item state-derivation rule exists. Literal use of the
        same key repeats one candidate sequence; an implicit ordinal contradicts
        the complete-key and domain-separation claim. The selector-bootstrap
        domain also contains arm=<arm> while the fixed-stream grammar supplies
        no exact six-value arm set. Independently, the bounded CPU formula is
        exactly candidate/range/duplicate/unit/bootstrap work and contains no
        SHA-256 cost. The archive stores 248800 bundle digests and 122880
        planted audit digests, but no logical hash-input row exists for at least
        25025527808 capped XOF bytes plus 3932160 planted-mode bytes.
      impact: >-
        Seeds and accepted indices do not define a unique byte stream for the
        lists, so the proposal cannot regenerate its canonical roots or controls
        byte-for-byte. The traffic, CPU, wall, and bundle-integrity headlines
        also omit declared hash work. Shared-root ownership and finite caps are
        therefore not yet an executable deterministic contract.
      cheapest_bounded_repair: >-
        In a new immutable successor, add a fixed-width item=<ordinal> field to
        every multi-item list XOF state or define an equally explicit collision-
        free state derivation from the complete key and item ordinal; enumerate
        the six selector-bootstrap arm names rather than arm=<arm>; assert exact
        XOF-state counts; and add framed hash-input, hash-operation, traffic,
        CPU, wall, and archive rows for every bundle and audit digest. Recompile
        all hashes and totals without changing any immutable predecessor.

