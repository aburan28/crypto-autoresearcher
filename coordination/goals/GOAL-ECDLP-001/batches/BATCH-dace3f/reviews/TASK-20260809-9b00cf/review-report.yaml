  verdict: REVISE
  verdict_scope: proposal_readiness_for_a_separately_frozen_future_experiment_design_only
  verdict_summary: >-
    The immutable successor repairs the global traffic-row identifiers and the
    archive allocation-to-write/read bijection, and it supplies a total
    infinity/affine curve-equation branch with the previously omitted affine
    additions and comparison. All 215 emitted traffic-row identifiers are
    unique, their declared products sum to 414901054592 bytes, all 42 archive
    allocations map bijectively to 42 writes and 42 verification reads, the
    15 planted numerators and root certificates are exact, and every declared
    standardized width and exponent row recomputes. The successor is not yet
    compiler-reproducible or fully charged, however. A list component contains
    many accepted scalars but its declared fresh-XOF-state key has no item
    ordinal; selector-bootstrap retains an unenclosed arm placeholder; and the
    SHA-256 inputs and work for generator bundles and planted audit hashes are
    absent from the traffic and CPU formulas. The cap-conditioned finite target
    for gamma=3/10, eta=0 is approximately 0.3-3.0817523475e-79 and therefore
    lies below its frozen lower endpoint 0.3. The identity/on-curve bits and
    declared curve/model tags are said to enter per-curve hashes but have no
    corresponding hash-absorb rows. Finally, the candidate Pareto row uses a
    mixed group/field/hash/join/verification unit while the shared axis and
    standardized rows call every time value a group-addition equivalent, with
    no conversion. These are bounded proposal defects rather than a mathematical
    obstruction, so the exact proposal-readiness verdict is REVISE, not NO-GO.

