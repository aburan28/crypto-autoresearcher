    "claim": "For target-independent index sets I,J fixed before a hit, with |I|=M and |J|=K, quotient-equality replay can certify only logarithms in C(I,J)={i-j,-i-j : i in I,j in J}; hence |C(I,J)|<=min(n,2MK) and a uniform target has success probability at most min(1,2MK/n).",
    "scope": {
