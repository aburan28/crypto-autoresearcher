      "offline_data": "pi(iP) for i in I",
      "online_data": "pi(Q+jP) for j in J",
      "observable": "only exact equality between one offline and one online quotient value",
      "target": "q uniform modulo n and independent of I,J before the first hit"
    },
    "statements": {
      "coverage_set": "C(I,J)=union over (i,j) in I times J of {i-j mod n,-i-j mod n}.",
      "cardinality": "|C(I,J)|<=min(n,2MK).",
      "success_probability": "Pr_q[at least one equality hit]<=min(1,2MK/n).",
      "multiplicity_rule": "Two edge occurrences, paths, or index pairs with the same net signed offset name the same q and do not enlarge C(I,J)."
    },
    "derivation": [
      "By the two-candidate decoder, each equality indexed by (i,j) can certify only i-j or -i-j.",
      "There are MK pairs and at most two candidates per pair, so their union has at most 2MK elements; it also has at most n elements because q is modulo n.",
      "Uniform q succeeds only when q lies in this fixed union, yielding the probability bound.",
      "The proof is a union-cardinality statement; it does not assume independence of equality events and cannot be improved by counting duplicate occurrences repeatedly."
    ],
