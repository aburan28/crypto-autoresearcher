    "status": "proved_for_quotient_equalities_only",
    "claim": "If Q=qP and pi(Q+jP)=pi(iP), then q is one of i-j or -i-j modulo n; checking both candidate multiples against the full public point Q yields a correct decoder for this equality event.",
    "scope": {
      "inputs": "public P,Q; known integers i,j modulo n; a certified quotient equality",
      "output": "at most two discrete-log candidates, each checked by computing q'P and comparing with Q",
      "excluded": "events that expose only graph adjacency, occurrence identity, weights, field-coordinate predicates, or non-equality algebraic relations"
    },
    "derivation": [
      "The quotient equality holds exactly when Q+jP=iP or Q+jP=-iP.",
      "Substituting Q=qP and using that P has order n gives q+j congruent to i or -i modulo n.",
      "Therefore q congruent to i-j or -i-j modulo n.",
      "Compute both candidate multiples and accept only q' with q'P=Q. If both candidates coincide, the duplicate is harmless; if distinct, at most one can equal q modulo prime n."
    ],
    "controls": [
      {"case":"plus branch","constructed_target":"Q=(i-j)P","expected":"first candidate verifies"},
      {"case":"minus branch","constructed_target":"Q=(-i-j)P","expected":"second candidate verifies"},
      {"case":"coincident candidates","condition":"2i congruent to 0 modulo n","expected":"i=0 and the candidate list deduplicates"},
      {"case":"false quotient event","expected":"neither candidate is accepted without a full Q equality check"}
    ],
    "counterexamples": [
      "Knowing only that v_i and v_j are adjacent does not instantiate an equality with Q and produces no q candidate.",
      "A procedure that reads an actual field-coordinate relation from Q may yield other equations, but it is outside this decoder and outside the coverage theorem."
    ],
    "boundaries": [
      "This is the standard two-sign replay of a quotient collision, not a new locator.",
      "It does not increase the probability of obtaining an equality event.",
      "Full point verification is required and charged.",
      "No claim is made for an IDEA-195-style algebraic router or signed-row descent."
