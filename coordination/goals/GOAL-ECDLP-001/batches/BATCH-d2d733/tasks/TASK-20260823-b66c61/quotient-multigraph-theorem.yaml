    "claim": "The occurrence-labelled canonical +/- quotient walk is a path v_0,...,v_m with a doubled edge occurrence from v_0 to v_1 and a self-loop occurrence at v_m.",
    "scope": {
      "group": "G=<P> of odd prime order n>3",
      "quotient": "X=G/{+/-1}, pi(R)={R,-R}",
      "operator": "tau_P(pi(R)) is the two-occurrence multiset [pi(R+P),pi(R-P)]",
      "representatives": "m=(n-1)/2 and v_i=pi(iP), 0<=i<=m"
    },
    "statements": [
      "tau_P(v_0)=[v_1,v_1], where the two equal values remain distinct edge occurrences.",
      "For 1<=i<m, tau_P(v_i)=[v_(i-1),v_(i+1)].",
      "tau_P(v_m)=[v_(m-1),v_m]."
    ],
    "derivation": [
      "Replacing R by -R swaps R+P and R-P after applying pi, so tau_P is a well-defined two-occurrence multiset on X.",
      "At i=0, pi(P)=pi(-P)=v_1, producing multiplicity two.",
      "For 1<=i<m, neither i-1 nor i+1 crosses the chosen representative boundary, so the two neighbours are v_(i-1) and v_(i+1).",
      "For i=m, m+1=(n+1)/2 is congruent to -m modulo n, hence pi((m+1)P)=v_m, while pi((m-1)P)=v_(m-1)."
    ],
