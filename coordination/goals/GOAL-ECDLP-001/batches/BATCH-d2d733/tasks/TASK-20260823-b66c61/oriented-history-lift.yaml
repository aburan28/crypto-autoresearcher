    "claim": "The ordered predecessor/current state H(R)=(pi(R-P),pi(R)) is injective and propagates deterministically by H(R+P)=(pi(R),pi(R+P)); consequently it restores orientation only by retaining a full encoding of R and is exactly within the B58 factor-map theorem.",
    "scope": {"group":"G=<P> of odd prime order n>3","state":"ordered pair in X times X","ordering":"predecessor then current is essential"},
    "derivation": [
      "Assume H(R)=H(S). Equality of the second components gives S=R or S=-R.",
      "If S=R there is nothing to prove. If S=-R, equality of first components gives pi(-R-P)=pi(R-P).",
      "The plus-sign lift of that equality implies 2R=0 and hence R=S=0. The minus-sign lift implies 2P=0, impossible. Thus H is injective.",
      "The next ordered state shifts the window: H(R+P)=(pi(R),pi(R+P)), so deterministic transport exists on the reachable image.",
      "Setting f=H and T(H(R))=H(R+P) satisfies the B58 factor equation f(R+P)=T(f(R)); injectivity is therefore the expected B58 alternative, not an evasion."
    ],
    "controls": [
      "Removing the predecessor recovers X and the memoryless-locator contradiction.",
      "The identity representation R is another injective exact transport with no ECDLP decoder.",
      "For n=5,7,11, direct symbolic pair listing has n distinct ordered states."
    ],
    "counterexamples": [
      "An unordered pair {pi(R-P),pi(R)} need not carry the same orientation and is not covered by the injectivity proof.",
      "Injectivity of H does not give a method for recovering the integer discrete log from H(Q)."
    ],
    "boundaries": [
      "This is not a compressed locator, relation-producing decoder, or speedup.",
      "The mechanism is not new: it is explicitly a B58 deterministic factor-map corollary and also matches the B61 warning that exact deterministic state propagation is constant or injective.",
      "No implication is made for multivalued, randomized, adaptive, or support-changing states."
