      "identity_quotient": "On G itself, ell(R)=R+P exists, showing the contradiction is caused by the +/- quotient.",
      "oriented_double_cover": "Retaining the sign/orientation also permits deterministic +P.",
      "order_two_group": "When 2P=0 the contradiction step fails; this nearby object is excluded by odd prime n>3."
    },
