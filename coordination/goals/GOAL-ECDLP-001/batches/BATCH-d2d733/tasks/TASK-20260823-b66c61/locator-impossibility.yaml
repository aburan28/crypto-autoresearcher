    "claim": "No target-independent memoryless function ell:X->X satisfies ell(pi(R))=pi(R+P) for every R in G when G has odd prime order n>3.",
    "scope": {
      "included": "single-valued, deterministic, target-independent, memoryless selector on the canonical quotient X",
      "excluded": ["target-dependent selectors","history-dependent selectors","randomized or distributional selectors","multivalued correspondences","weighted algebraic transforms","support-changing routers","oracles exposing a representative"]
    },
    "statement": "For all odd primes n>3 and all cyclic G=<P> of order n, there does not exist ell:X->X such that for all R, ell(pi(R))=pi(R+P).",
    "derivation": [
      "Because pi(P)=pi(-P), a function ell would have to assign the same output to these two presentations.",
      "The presentation R=P requires ell(pi(P))=pi(2P), while R=-P requires ell(pi(-P))=pi(0).",
      "Equality pi(2P)=pi(0) would imply 2P=0, impossible for odd prime n>3. Therefore ell cannot exist."
    ],
    "controls": {
