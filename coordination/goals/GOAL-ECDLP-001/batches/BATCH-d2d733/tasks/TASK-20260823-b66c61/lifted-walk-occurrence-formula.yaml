    "status": "proved",
    "claim": "All length-t quotient-walk edge occurrences from v_a to v_b are counted by folding the endpoints of the 2^t signed +/-1 lifts modulo n.",
    "scope": {"n":"odd prime >3","m":"(n-1)/2","a_b_range":"0<=a,b<=m","walk_length":"integer t>=0"},
    "statements": {
      "fold_map": "fold_n(r) is the unique b in {0,...,m} with r congruent to b or -b modulo n.",
      "count_formula": "C_t(a,b)=sum_{k=0}^t binom(t,k) * 1[fold_n(a+2k-t)=b].",
      "normalization": "sum_{b=0}^m C_t(a,b)=2^t.",
      "congruence_form": "A term contributes exactly when a+2k-t is congruent to b or -b modulo n; if b=0 the coincident signs describe one endpoint condition and are not double-counted."
    },
    "derivation": [
      "A signed lift chooses k plus steps and t-k minus steps, so its net offset is 2k-t and it has binom(t,k) occurrence sequences.",
      "Applying pi identifies precisely residues r and -r, which is exactly fold_n.",
      "Every signed sequence has one folded endpoint, proving the normalization and retaining endpoint edge multiplicities.",
      "For t=1,a=0, both k=0 and k=1 fold to b=1, so C_1(0,1)=2. For t=1,a=m, the two endpoints fold to m-1 and m, each with count one."
    ],
    "controls": [
      {"case":"n=5,t=1,a=0","counts":{"v1":2}},
      {"case":"n=7,t=1,a=3","counts":{"v2":1,"v3":1}},
      {"case":"n=11,t=2,a=0","counts":{"v0":2,"v2":2}}
    ],
    "counterexamples": ["Counting only distinct quotient vertices gives one rather than two outgoing occurrences at v_0 and violates the 2^t normalization."],
    "boundaries": [
      "The formula counts occurrence-labelled random-walk paths; it does not identify which hidden orientation realizes a desired +P successor.",
      "It makes no mixing, independence, or success-probability heuristic assumption.",
      "It supplies no algebraic relation beyond the signed endpoint congruence."
    ],
