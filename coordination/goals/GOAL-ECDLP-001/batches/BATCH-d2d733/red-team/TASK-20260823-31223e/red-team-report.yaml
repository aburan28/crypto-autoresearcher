  overall_verdict: REVISE
  claim_under_review: >-
    On J4 and J5 only, whether the frozen zero-run B62 packet is semantically
    distinct from B58, B61, IDEA-057, IDEA-158, IDEA-195, and BATCH-026;
    refuses the oriented-cover, identity-quotient, order-two,
    coordinate-reading, and IDEA-195 proves-too-much controls; and states its
    novelty, Pareto, scope, opportunity-cost, and steering boundaries without
    using the equality-only theorem to close a stronger route. This report
    does not review or compose J1 through J3 and gives no whole-claim verdict.

