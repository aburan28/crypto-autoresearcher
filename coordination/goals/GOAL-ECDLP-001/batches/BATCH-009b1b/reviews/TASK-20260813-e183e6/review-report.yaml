      mitigation_established_here: >-
        SUBSTANTIALLY MITIGATED BY DIRECT RECOMPUTATION. Every statistic in
        every summary.json was re-derived in this session from
        solve_records.jsonl -- per-member medians, minima, maxima, means and
        solved-seed counts for all 1652 members, the class statistics, the
        band-exceedance sets by identity, the Q2 values and partitions, and all
        Q3 rows and counts -- with ZERO mismatches. The content is correct; what
