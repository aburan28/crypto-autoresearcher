        predicted 0.5227 -- the SHAPE of the distribution matches the
        random-function model to within 2 percent in every run. Location sits
        about 4 to 6 percent above the ideal (pooled means 1.335 / 1.320 /
        1.325 / 1.304 in sqrt(N) units), which is the documented behaviour of a
        finite-branch Teske r-adding walk (r = 20 here) plus the O(1/theta)
        distinguished-point detection overhead. No run is re-scored against any
        constant; every reported comparison in the run records remains against
        the frozen 0.886*sqrt(N), as the contract specifies.
      status: observation

  # ===================================================================
  # CONTROL CHECKS
  # ===================================================================
  control_checks:
    - id: CTL-01
      control: null_object_different_order (MANDATORY, the stop gate)
      contract_requirement: >-
        At least 8 random curves over a declared smaller prime p' with prime
        N' <= N/16, under the SAME frozen solver parameters and seed schedule
        as the members they control; must be distinguishable from the members'
        costs at the resolution of the frozen band.
      verified: >-
        8 curves per run in all four runs, all N' prime, all N' <= N/16
        (N/16 = 65635 / 65653 / 1048147 / 1048132 against N' near 32.7k in the
        20-bit runs and near 524k in the 24-bit runs, so the actual margin is
        about N/32). Solver parameters IDENTICAL: every null-object record
        carries the same walk family, partition count 20, distinguished-point
        rule x congruent to 0 mod 16, coordinate system
        AFFINE_SHORT_WEIERSTRASS, and the same 16 declared seeds. A control run
        under different parameters would not be a control; these were not.
      separation: see band_determination and the per-run gate table
      strength_limit_carried_forward: >-
        DEC-20260813-e0077d's recorded NULL-OBJECT STRENGTH limitation stands
        unchanged and I confirm it: this control shows the meter tracks group
        order, which it demonstrably does (the null median tracks the predicted
        sqrt(N'/N) scaling in all four runs). It does NOT show sensitivity to a
        within-class difference of the size the census would need to detect. It
        is the strongest available control and it is weaker than the ideal one.
        Any evidence record citing a null from these runs carries that gap.
      status: see_band_determination
    - id: CTL-02
      control: positive_control_tate_invariance
      verified: >-
        Independently and completely. Every one of the 1652 enumerated vertices
        was verified IN THIS SESSION to have group order exactly N: two random
        points constructed per curve with my own Tonelli-Shanks and scalar
        multiplication, [N]R = O for both, with N prime and
        p + 1 + 2*sqrt(p) < 2N pinning #E' = N. By Tate's theorem equal point
        count over F_p is equivalent to F_p-isogeny, so this independently
        certifies class membership for every vertex WITHOUT relying on the
        producer's edge certificates. Zero failures across all four runs.
      status: pass
    - id: CTL-03
      control: seed_dispersion_band
      verified: >-
        Frozen on the base curve only, from its 16 per-seed counts,
        bit-reproducible (REC-02), and frozen strictly BEFORE the first
        between-member comparison in every run -- verified from the manifests'
        freeze_ordering timestamps, which are strictly monotone in all four
        runs (base curve, then DLP instance, then seed band, then first
        between-member comparison: 07:18:09.199 / 07:18:09.199 / 07:18:14.731 /
        07:18:23.449 in 20BIT-A and analogously in the other three). The base
        curve tuple and the band therefore both carry timestamps PRECEDING the
        first between-member comparison, as the producer completion gate
        requires.
      defect: >-
        The band's STATISTIC was not fixed by the frozen contract. See
        band_determination and VAL-DEF-01.
      status: pass_with_defect
    - id: CTL-04
      control: bsgs_cross_check
      verified: >-
        Performed in all four runs on all three declared instances -- the
        smallest instance (null object of least order), the base-curve
        instance, and the class member of least j-invariant. BSGS agreed with
        rho AND with the planted k in every case, twelve instances in total.
        BSGS shares no walk logic with rho.
      defect: >-
        Its EXECUTION is guarded by a wall-clock deadline test
        (`if time.time() < deadline`), so on a slower host it would be silently
        skipped rather than reported missing. See VAL-DEF-10.
      status: pass_with_defect
    - id: CTL-05
      control: special_j_segregation
      verified: >-
        Applied, not merely declared. I independently recomputed the j-invariant
        of every vertex from its (a, b) and confirm that NO member of any of the
        four classes has j = 0 or j = 1728. The segregated set is legitimately
        empty and the generic band is the whole certified class in every run.
      status: pass
    - id: CTL-06
      control: model_normalization (Q1 and Q2 regime separation)
      verified: >-
        ADJUDICATED BY EVIDENCE, NOT BY ACCEPTING THE PRODUCER'S ASSERTION. All
        27008 solve records across the four runs carry
        coordinate_system == AFFINE_SHORT_WEIERSTRASS -- base curve, every class
        member, every null object, every fresh-seed tail-check record, with no
        exception. Q1 is therefore measured with every curve in the ONE declared
        common coordinate system through a single shared code path, so the
        group-operation counter counted the same abstract events everywhere. Q2
        is measured in a SEPARATE replay pass over the declared candidate model
        set (AFFINE_SHORT_WEIERSTRASS, JACOBIAN_GENERIC, JACOBIAN_A_MINUS_3,
        MONTGOMERY, TWISTED_EDWARDS) with reachability tests recorded for every
        member regardless of which model was selected. The candidate set, the
        cost rule and the M/S aggregation rule (squaring weight 1.0, raw M and S
        recorded separately so any other weighting is recomputable) are all in
        manifest.protocol_frozen_constants, written at run start, with the
        explicit flag q2_candidate_model_set_declared_before_measurement: true.
        THE TWO REGIMES WERE NOT MIXED. The contract's Q1 invalidation rule for
        cross-coordinate-system comparison is not triggered.
      status: pass
    - id: CTL-07
      control: structural_null_object_same_p_different_trace
      verified: >-
        8 same-p different-trace curves enumerated per run; none appeared in any
        class walk in any run. Correctly carries no cost-resolution role, as the
        contract and H-ISOU-c5bfea both require (Hasse confines their orders to
        relative width O(1/sqrt(p)), so their non-separation would falsify
        nothing).
      status: pass
    - id: CTL-08
      control: >-
        HEUR-ISOU-1's OWN falsification condition -- relative dispersion of
        members versus different-order controls under matched seed schedules
      verified: >-
        RUN BY THIS VALIDATOR; the producer did not compute it and the
        disclosures do not mention it. Coefficient of variation of pooled
        solved counts, members against nulls: 0.5119 vs 0.4519 (ratio 0.88),
        0.5052 vs 0.4699 (0.93), 0.5141 vs 0.5429 (1.06), 0.5207 vs 0.5273
        (1.01). The relative dispersions are not materially different, and the
        two deviations are in the two runs with 10 percent null-object
        censoring, which truncates dispersion. THE HEURISTIC'S STATED
        FALSIFICATION CONDITION IS NOT MET. Reported as the measurement plus the
        condition it does not meet; nothing further is asserted.
      status: observation
    - id: CTL-09
      control: tail_checks required by the contract
      verified: >-
        All three performed and recorded in every run. (a) The single cheapest
        member on the group-operation axis sat outside the frozen median band in
        all four runs and was re-run under the 16 declared FRESH seeds, coming
        back inside the band each time (vertex 143: 782 -> 1079; vertex 143:
        811 -> 1116; vertex 231; vertex 75). (b) The cheapest member on the
        per-operation axis has the a = -3 model reachable in all four runs, so
        the condition that would have bitten was not observed. (c) The largest
        measured walk cost is reported against the largest measured solve
        saving per run, given as numbers rather than as an asserted
        confirmation. The producer's own recorded limitation is correct and I
        confirm it: only the SINGLE cheapest member was re-run, so no
        fresh-seed statement exists for the other band-exceeding members and
        none is made.
      status: pass
    - id: CTL-10
      control: >-
        NULL-OBJECT CONTROL FOR THE MEMBER-LEVEL SCREEN ITSELF (inventor
        protocol section 3: a statistical signal without a null-object control
        of the same shape is not evidence)
      verified: >-
        RUN BY THIS VALIDATOR. The "clears_frozen_band" screen is a ONE-SIDED
        test at the 2.5 percent tail of a 95 percent interval, applied
        independently to 156 / 160 / 594 / 742 members with NO multiplicity
        control. Under the null of no between-member effect the nominal
        expected false-flag counts are 3.90 / 4.00 / 14.85 / 18.55; the observed
        clearing counts are 6 / 7 / 14 / 9. Pooled: 36 observed against 41.3
        expected -- BELOW chance. The two-sided outside-band counts behave the
        same way, 9 / 7 / 18 / 64 against nominal 7.8 / 8.0 / 29.7 / 37.1, i.e.
        realized coverage ranging from 0.61x to 1.73x nominal, so the band is
        not a calibrated 95 percent screen (it is estimated from ONE
        realization of 16 draws on ONE curve, and its realized coverage
        therefore inherits that curve's luck). The quantity that should decay
        as the parameter meant to destroy it increases DOES decay: the
        different-order control's cost falls with sqrt(N'/N) exactly as
        predicted in all four runs. What does NOT show an excess over its own
        null is the member-level band-clearing flag count.
      status: observation

  # ===================================================================
  # CERTIFICATE-CHECKER INDEPENDENCE
  # ===================================================================
  certificate_checks:
    independence_finding: >-
      INDEPENDENT. Established by reading experiments/EXP-ISOU-2ac81f/
      implementation/certificate_checker.py in full, not by trusting the
      receipt. Evidence read: (1) its entire import list is argparse, json, os,
      sys, datetime and yaml -- it imports NOTHING from census.py and nothing
      from any other module of this experiment, so it cannot be "a separate
      file importing the solver's internals"; (2) it re-implements its own
      modular inverse by EXTENDED EUCLID where the solver uses FERMAT
      exponentiation, so a fault in one cannot be reproduced by the other;
      (3) it re-implements its own affine point addition, doubling and scalar
      multiplication, using a LEFT-TO-RIGHT MSB-FIRST ladder where the solver
      uses a right-to-left ladder; (4) it runs as a separate process after the
      solver has exited and reads only written artifacts, so it shares no
      in-process state; (5) it re-derives both the member check [k]P' = Q' on
      E' and the PULLBACK check [k]P = Q on the base curve, plus on-curve and
      order-N checks on the transferred points, plus agreement with the frozen
      k, plus the single-k-across-all-seeds condition; (6) a member failing any
      check is written certificate_verified: false and, in do_summarize, is
      skipped entirely so it contributes NO cost datum.
    my_own_independent_re_verification: >-
      I did not stop at reading the checker. I re-verified every claimed solve
      in this session with arithmetic written here, independent of BOTH the
      solver and the checker. Results: the base-curve instance verifies in all
      four runs; all 1652 member transfers verify ([k]P' = Q' on the member,
      P' and Q' on the curve, both of order N); all 32 null-object instances
      verify against their planted k; and across 26331 member and base solve
      records the set of rho-recovered k values is a SINGLETON equal to the
      frozen k in every run (332328 / 2831 / 4186854 / 11847516), with zero
      non-matching values. All 483 null-object solves recovered the planted k.
      Zero failures anywhere.
    coverage: >-
      Every claimed solve carries independent verification output. No member
      lacks one, so no member was required to be excluded from cost data on
      certificate grounds, and members_excluded_no_verified_certificate is
      legitimately empty in all four runs.
    scope_limit_recorded: >-
      The certificate chain verifies the SOLVE (that rho found the right k on a
      curve of order N). It does NOT independently re-verify the Velu isogenies
      themselves -- edge certificates (deg h = (ell-1)/2, h | psi_ell,
      nonsingular codomain, order check) are computed inside census.py and are
      self-checks. THIS GAP IS CLOSED BY A DIFFERENT ROUTE, INDEPENDENTLY: my
      order-N verification of all 1652 vertices establishes class membership by
      Tate's theorem without using any edge certificate. What remains
      un-reverified is which particular isogeny connects which pair, i.e. the
      walk-path structure that the Q3 walk cost is charged along.
    status: pass

  # ===================================================================
  # COMPLETENESS GATE AND DEV-3
  # ===================================================================
  completeness_findings:
    closure_versus_termination: >-
      CLOSURE, NOT MERE TERMINATION, IN ALL FOUR RUNS, AND VERIFIED
      INDEPENDENTLY. Vertex count equals h(disc(End(E_0))) at 156, 160, 594 and
      742, where h was recomputed IN THIS SESSION by counting reduced primitive
      positive-definite binary quadratic forms, using no producer code and no
      part of the walk. Both numbers are reported side by side in every run,
      including when they agree, as the contract requires. Additionally
      verified independently: every vertex is nonsingular; every vertex has the
      recorded j-invariant; every vertex has group order exactly N (so every
      vertex genuinely lies in the F_p-isogeny class, by Tate); all vertices
      have DISTINCT j-invariants and no two vertices are F_p-isomorphic, so the
      declared deduplication by F_p-isomorphism class rather than j-invariant
      alone is correct and no twist was merged. THE CLASS IS COMPLETE AS A
      MATTER OF FACT.
    dev3_assessment: >-
      DEV-3 IS REAL AND ITS COST IS NARROWER THAN THE DISCLOSURE SUGGESTS. The
      condition "the declared degrees generate cl(O)" was applied as a candidate
      SELECTION FILTER, so the gate could not fail at the accepted base curve
      and its PASS carries no per-run diagnostic information. That is the loss,
      and it is genuine: the contract wrote the gate as an independent check
      capable of exposing an incomplete subgraph, and as executed it is not
      one. What is NOT lost is completeness itself, which I verified
      independently above and which does not depend on how the curve was chosen.
    dev3_quantified: >-
      THE SELECTION EFFECT IS MEASURABLE FROM THE REJECTION LOGS AND IS NOT
      UNIFORM ACROSS THE RUNS -- a fact neither the receipt nor the batch
      disclosure draws out. Candidates rejected specifically for "class walk
      closed short of h(D): declared degrees do not generate cl(O)": 5 in
      20BIT-A, 2 in 20BIT-B, ZERO in 24BIT-A, ZERO in 24BIT-B. So the accepted
      base curve is 1-of-6 conditioned on this filter in 20BIT-A, 1-of-3 in
      20BIT-B, and 1-of-1 -- no conditioning whatever -- in both 24-bit runs. In
      the two 24-bit runs the filter never rejected anything, so it did not
      change which curve was chosen; the agreement there is informationally
      equivalent to an independent check that could have failed and did not,
      even though it formally could not have been reported as a failure.
    what_no_member_is_cheaper_is_worth: >-
      It remains a statement about a COMPLETE class -- the class is verifiably
      complete, so the object the statement quantifies over is intact and the
      contract's invalidation rule for an incomplete walk is NOT triggered in
      any run. What narrows is the POPULATION of base curves it generalizes
      over: in the 20-bit runs the base curve is drawn from a sub-population
      conditioned on cl(O) being generated by the declared degrees (a roughly
      6:1 and 3:1 conditioning), and in all four runs it is additionally
      conditioned on |D| <= DMAX and h in [40, 160] or [40, 800]. Any evidence
      record must scope the statement to that filtered population rather than
      to P-256-shaped curves generally. The filters use no cost datum -- I
      confirmed the rejection reasons are exclusively structural (N not prime,
      conductor f != 1, h out of range, walk closed short) -- so they do not
      bias the cost comparison itself.
    status: pass_with_scope_restriction

  # ===================================================================
  # COST-MODEL CHECKS
  # ===================================================================
  cost_model_checks:
    - id: COST-01
      check: unit declared and never mixed
      result: >-
        PASS. charged_end_to_end_cost is in FIELD MULTIPLICATIONS (M + 1.0*S)
        throughout, the unit is declared on every Q3 row and every Q3 class
        statistic, and no group-operation count is added to a
        field-multiplication count anywhere. Verified by recomputing every Q3
        row. Multiplication and squaring are instrumented and stored separately
        as raw counts, so any other squaring weight is recomputable by a
        reviewer, which is what the handoff's DECLARED M/S AGGREGATION
        constraint asks for.
    - id: COST-02
      check: measured-versus-modelled split labelled and not blurred
      result: >-
        LABELLED CORRECTLY BUT THE LABEL IS NOT ENOUGH, AND THIS IS THE
        LOAD-BEARING ITEM. Every transfer row carries
        walk_cost_measured_label: measured and
        walk_cost_modelled_label: modelled; the modelled formula is recorded in
        full (naive (m+1)(n+1) polynomial multiplication, remainder, gcd, and an
        inversion charged at ceil(log2 p) squarings plus hamming-weight(p-2)
        multiplications); and Q3 is reported on two separately named bases,
        neither presented as the other. All of that is correct. WHAT THE LABEL
        DOES NOT CONVEY is the magnitude: the median modelled construction cost
        per member is 222x to 1421x the median MEASURED walk cost, and 51x to
        120x the ENTIRE base-curve solve cost. On the
        q3_measured_plus_modelled_walk basis the answer is therefore determined
        by a modelled quantity two orders of magnitude larger than anything
        measured, and "0 members cheaper end-to-end" on that basis is a
        statement about the declared naive-multiplication cost model, not a
        measurement of the class.
    - id: COST-03
      check: which basis the contract actually defines
      result: >-
        THE Q3 RESULT FLIPS ON THIS AND THE CONTRACT'S TEXT POINTS AT THE
        MEASURED BASIS. specification.yaml defines charged_end_to_end_cost as
        "walk cost to reach the member (Velu isogeny EVALUATIONS, converted to
        field multiplications) plus that member's solve cost". Velu isogeny
        EVALUATION is precisely the measured component; the modelled
        CONSTRUCTION cost is an addition beyond the contract's literal
        definition. On the contract-literal (measured-walk-only) basis the
        counts of members below the base curve are 24 / 75 / 90 / 37 raw and
        6 / 7 / 14 / 9 after applying the frozen band; on the
        measured-plus-modelled basis they are 0 / 0 / 0 / 0. REPORTED AS THE
        OBSERVATION PLUS THE CONDITION IT MEETS AND NOTHING FURTHER: on the
        contract-literal basis there exist members whose charged end-to-end cost
        is below the base-curve solve cost, which is the observable named in
        falsification criterion F4 and in specification.falsification_criterion.
        THIS REPORT DRAWS NO CONCLUSION FROM THAT and explicitly notes that the
        same flags do not exceed their own null (CTL-10): the 6 / 7 / 14 / 9
        counts are at or below the nominal false-flag expectation of
        3.90 / 4.00 / 14.85 / 18.55, pooling to 36 observed against 41.3
        expected. Both facts belong in any record that cites either number.
    - id: COST-04
      check: per-attempt cost times inverse success probability
      result: >-
        NOT APPLICABLE AS SUCH, and correctly so. This census reports a measured
        cost per member, not an expected cost under a probabilistic success
        model, so there is no success probability to invert. The nearest
        analogue -- censored solves that produce no k -- is handled by exclusion
        rather than by inflating a cost, which is the correct handling under
        AGENTS.md rule 5 and is what the contract requires. The censoring rate
        is reported per run rather than absorbed into a cost.
    - id: COST-05
      check: memory reported alongside time
      result: >-
        PARTIAL. The receipt records peak resident set size 47464448 bytes
        (0.045 GB against an 8 GB cap), measured with /usr/bin/time -l on
        RUN-ISOU-2ac81f-20BIT-A only, and wall clock per run (24.7 / 22.2 /
        105.1 / 161.1 s, 313.1 s total against a 2 CPU-hour budget, no limit
        hit). Memory is NOT measured for the other three runs, including the
        largest (24BIT-B, 742 members, 12016 solve records). Low severity at
        this scale, but a concrete-cost table that reports memory for one of
        four runs does not report memory alongside time.
    - id: COST-06
      check: optimistic assumptions flagged
      result: >-
        The modelled construction cost is PESSIMISTIC rather than optimistic --
        it charges naive quadratic polynomial arithmetic where the
        implementation actually uses Kronecker substitution, which is why it
        cannot be counted. That direction is disclosed by the formula but is
        not flagged in words as biasing Q3 toward "no member is cheaper". It
        should be, in any record that cites the measured-plus-modelled basis.
    - id: COST-07
      check: wall clock never used as a cost basis
      result: >-
        PASS. wall_clock_seconds appears only as transparency, exactly as the
        contract's secondary metric specifies, and no cost claim anywhere rests
        on it.

  # ===================================================================
  # HEURISTIC-VALIDATION CHECKS (agents/validator.md section)
  # ===================================================================
  heuristic_validation_checks:
    - id: HEU-01
      check: prediction pre-registered before or independently of sampling
      result: >-
        PASS ON ORDERING, FAIL ON CONTENT. The prediction is in the frozen
        contract at version 1, committed at ac07d773c before any compute, and
        is reproduced verbatim in every summary.json and in the receipt; the
        Executor adjusted nothing and re-scored nothing, which is the correct
        conduct. But the pre-registered CONSTANT is wrong for the mandated
        solver -- see VAL-DEF-02. A prediction can be properly pre-registered
        and still be mis-specified, and this one is.
    - id: HEU-02
      check: sample size, seeds and sampling procedure in the manifest
      result: >-
        PASS. All 16 rho seeds, the 16 fresh tail-check seeds, the master seed,
        the bootstrap seed and resample count, the walk family, partition count,
        distinguished-point rule and density, and the max-steps rule are all in
        manifest.protocol_frozen_constants. Sample sizes recomputed from raw:
        2640 / 2704 / 9648 / 12016 solve records, 27008 in total.
    - id: HEU-03
      check: empirical distribution recomputed from raw samples
      result: >-
        DONE, see REC-10 and CTL-08. Recomputed from raw, not copied from any
        report.
    - id: HEU-04
      check: correspondence validity where a substitute stands in for direct sampling
      result: >-
        NOT APPLICABLE AND CORRECTLY DECLARED NOT APPLICABLE. The contract sets
        scale_relevance.correspondence to null and samples the objects directly:
        every member of every class is solved, with no substitute sampler
        standing in for anything. There is therefore no correspondence theorem
        to cite and none is claimed.
    - id: HEU-05
      check: scale binding and transfer assumptions recorded
      result: >-
        PASS. claim_tier toy is on every manifest, every summary, the receipt
        and the batch record. Prime sizes 20 and 24 bits are recorded; the
        contract states plainly that P-256 is imitated in SHAPE (ordinary,
        prime order, conductor f = 1, a = -3), not approached in SIZE, and that
        no result transfers. Two prime sizes were run so the findings are not
        single-scale artifacts. NO TRANSFER ASSUMPTION IS ASSERTED ANYWHERE,
        which is the correct handling; the scale mismatch to P-256 is total and
        is recorded as scope rather than treated as an invalidation.
    - id: HEU-06
      check: cost-unit honesty and cost bookkeeping
      result: see cost_model_checks COST-01 through COST-07

  # ===================================================================
  # PROOF-ARCHITECTURE CHECKS
  # ===================================================================
  proof_architecture_checks:
    - id: PA-01
      check: baseline fixture reproduces the cited baseline exactly
      result: >-
        FAIL, AND THE FIXTURE IS THE DEFECT. See VAL-DEF-02. The measured
        base-curve medians exceed the frozen 0.886*sqrt(N) fixture by 1.320,
        1.506, 1.457 and 1.106 in the four runs -- above it in all four, never
        below. A close numerical fit would be `incomplete` under
        agents/validator.md; this is not even a close fit, and the failure is
        one-directional across four independent base curves at two prime sizes.
    - id: PA-02
      check: strictness witness for any improvement claim
      result: >-
        NOT APPLICABLE. No improvement is claimed anywhere in this run set; the
        Executor states no verdict. The Q3 observation at COST-03 is recorded
        as an observation meeting a stated falsification condition, which is
        the opposite of an improvement claim and is not treated as one.
    - id: PA-03
      check: observation collisions bound to their enumerated scope
      result: >-
        PASS. Every reported search is bound to its enumerated scope and
        artifact: the class searches are exhaustive over a verified-complete
        class (156 / 160 / 594 / 742 members, all certified), the base-curve
        search is bounded by its rejection log (2137 / 1568 / 234 / 471
        candidates examined with a complete reason tally), and the
        Montgomery/Edwards no-collision result is a per-member computed
        reachability test over all 1652 members rather than a sampled search.
    - id: PA-04
      check: interface preservation across the representation change
      result: >-
        PASS on the part that matters here. The DLP transfer is the
        representation change, and its loss profile is verified: the isogeny
        restricted to F_p-rational points is a group isomorphism between groups
        of the same prime order N, so the discrete logarithm is literally the
        same integer on every member -- which I confirmed independently, the
        recovered k being a singleton equal to the frozen k across all 26331
        member and base records in all four runs. Determinism, success
        probability and dimension are unchanged; the time and memory cost of the
        transfer is what Q3 charges.
    - id: PA-05
      check: method ceiling and nearby-object control
      result: >-
        The nearby object is the different-order null curve set and it was run
        under the identical implementation and seed schedule. Its behaviour is
        the subject of band_determination.
    - id: PA-06
      check: quantifier fidelity
      result: >-
        PASS. The quantifier order in the artifacts matches the order stated at
        approval: the class is fixed FIRST by the base curve and then every
        member of that class is measured, mirroring an attacker handed a curve
        who cannot choose its class. No per-instance witness is presented as a
        uniform one. The four runs are four independent instantiations of that
        order, not one instantiation reused.

  # ===================================================================
  # DEFECTS
  # ===================================================================
  defects:
    - id: VAL-DEF-01
      severity: blocking_for_any_q1_or_q3_evidence_record
      title: >-
        The frozen contract does not fix the seed band's statistic, and the
        producer's choice decides a mandatory stop condition
      artifact_and_field: >-
        experiments/EXP-ISOU-2ac81f/specification.yaml, controls[2]
        seed_dispersion_band (and inputs.null_objects, which asserts that
        N' <= N/16 "separates at the resolution of the seed dispersion band");
        against experiments/EXP-ISOU-2ac81f/runs/RUN-ISOU-2ac81f-*/manifest.yaml
        protocol_frozen_constants.seed_band_rule and .null_object_rule; and
        experiments/EXP-ISOU-2ac81f/implementation/census.py PROTOCOL block.
      detail: >-
        The contract names a band but no statistic, no interval rule and no
        percentile. TASK-20260813-4bee82's enumerated pre-data resolutions do
        not include it. The Executor supplied a two-part band with the
        median-of-16 bootstrap designated PRIMARY, which is the designation that
        makes the mandatory null-object gate pass in RUN-ISOU-2ac81f-20BIT-A and
        RUN-ISOU-2ac81f-24BIT-A. Under the raw per-seed reading census.py's own
        code path sets terminal_status to completed_invalid with the stop text;
        under the primary reading all four runs are completed_valid.
      reproduction: >-
        Read manifest.frozen_seed_band in each run; compare
        separated_under_median_band_primary against
        separated_under_per_seed_band in each null_objects.yaml. Both verdicts
        are recomputable from solve_records.jsonl and were recomputed here.
      repair_route: >-
        A versioned protocol_amendment under
        experiments/EXP-ISOU-2ac81f/amendments/, or a superseding contract,
        adopted by the Coordinator, fixing the band statistic prospectively with
        the reasoning on the record. NOT a field edit, NOT a re-score, and NOT
        this report's agreement with the statistics.
      status: open
    - id: VAL-DEF-02
      severity: blocking_for_the_reproduction_precondition
      title: >-
        The frozen reproduction fixture 0.886*sqrt(N) is the negation-map
        constant while the contract mandates plain rho with no negation map --
        mis-specified AT APPROVAL, in three records
      artifact_and_field: >-
        experiments/EXP-ISOU-2ac81f/specification.yaml
        preregistered_prediction.formula and success_criterion;
        ledger/decisions/DEC-20260813-e0077d.yaml (the approval reasoning cites
        the fixture as the baseline); ledger/hypotheses/H-ISOU-c5bfea.yaml
        heuristic_assumptions[HEUR-ISOU-1].formal_statement, which states the
        MEAN over seeds is 0.886*sqrt(N)*(1+o(1)).
      detail: >-
        0.886*sqrt(N) = sqrt(pi*N/4) = sqrt(pi*(N/2)/2) is the plain-rho
        expectation on a group of HALF the size, which is what the negation map
        achieves by working in the quotient by inversion. Plain rho with no
        automorphism speedup has expectation sqrt(pi*N/2) = 1.2533*sqrt(N) and
        median sqrt(2*ln 2*N) = 1.1774*sqrt(N). TASK-20260813-4bee82 and
        DEC-20260813-e0077d both mandate NO negation map, and every manifest
        records negation_map_used: false, which I confirm from the solve
        records. THE FIXTURE IS THEREFORE INCONSISTENT WITH THE SOLVER THE SAME
        CONTRACT MANDATES, and the inconsistency was present at approval. This
        is a defect AGAINST THE CONTRACT AND ITS APPROVAL, NOT AGAINST THE RUNS.
        Two distinct errors are stacked: the constant is the wrong one, and it
        is stated as a MEAN while the runs necessarily compare a median.
      consequence: >-
        The contract makes reproduction of the fixture a clause of its
        success_criterion. Under the primary band that clause FAILS in
        RUN-ISOU-2ac81f-20BIT-A and RUN-ISOU-2ac81f-20BIT-B
        (fixture_inside_median_band false). Because the fixture is
        mis-specified, that failure is not evidence of an instrument fault --
        but it also cannot simply be waived, because waiving it after seeing the
        outcome is exactly the post-hoc adjustment the pre-registration exists
        to prevent.
      no_re_scoring: >-
        NOTHING IN THIS REPORT RE-SCORES ANY RUN AGAINST A SUBSTITUTE CONSTANT.
        REC-10 reports the measured distribution shape as a measurement and
        explicitly declines to convert it into a pass or fail. The Executor's
        conduct here was correct: it adjusted no prediction, re-scored nothing,
        and recorded both constants side by side so a reviewer could see which
        one the measurement tracks.
      repair_route: >-
        A versioned protocol_amendment or superseding contract for the
        experiment, AND -- separately, because an experiment amendment cannot
        reach a hypothesis record -- a superseding H-ISOU-c5bfea that restates
        HEUR-ISOU-1's formal_statement with the correct constant and the correct
        statistic. Records are immutable; this is a supersede, never an edit.
      status: open
    - id: VAL-DEF-03
      severity: material
      title: >-
        Completeness gate cannot fail as executed (DEV-3), with a selection
        effect that is unequal across the runs
      artifact_and_field: >-
        experiments/EXP-ISOU-2ac81f/runs/RUN-ISOU-2ac81f-*/base_curve_selection.yaml
        selection_criteria.criteria_in_order[9] and
        selection_log.rejection_reason_counts; class_enumeration.yaml
        completeness_comparison.selection_filter_caveat.
      detail: see completeness_findings above for the full assessment and the quantification
      repair_route: >-
        No repair to these runs is possible or appropriate. Any record citing
        completeness states that the gate was non-falsifiable as executed and
        scopes the base-curve population accordingly (6:1 conditioning in
        20BIT-A, 3:1 in 20BIT-B, none in either 24-bit run). A future contract
        that wants the gate to be a gate applies the degree-generation condition
        as a post-selection CHECK rather than as a selection filter, and accepts
        that some runs will then report an incomplete subgraph.
      status: open
    - id: VAL-DEF-04
      severity: material
      title: >-
        The Q3 solve-cost formula implemented is not the q3_definition declared
        in the manifest before measurement
      artifact_and_field: >-
        manifest.protocol_frozen_constants.q3_definition declares
        "Q3(member) = walk_cost_to_member + median_over_seeds(Q1(member)) *
        Q2(member)"; census.py do_summarize solve_field_mults implements
        median_adds_over_seeds * q2_add_field_mults_per_op +
        median_dbls_over_seeds * q2_dbl_field_mults_per_op.
      detail: >-
        The two differ because the reported Q2 is evaluated at ONE COMMON
        operation mix (the base curve's, per DEV-4) while the implemented Q3
        charges each member at its OWN median adds/doublings mix. Recomputed
        base solve costs under the declared formula are 17130.56 / 19801.40 /
        75413.60 / 57694.56 against the recorded 17296 / 19680 / 76076 / 57944.
        The headline count of members below base on the measured-walk-only basis
        changes from 24 / 75 / 90 / 37 (implemented) to 27 / 76 / 88 / 32
        (declared formula), a symmetric difference of 3 / 1 / 2 / 5 members.
        A reader who applies the manifest's stated rule gets different numbers
        from the ones recorded.
      secondary_concern: >-
        The implemented form re-introduces into Q3 exactly the per-member
        adds/doublings seed noise that DEV-4 says the common mix was adopted to
        remove from Q2. The two metrics are therefore inconsistent with each
        other about what counts as mix noise.
      repair_route: >-
        Do not edit the run records. The evidence record states which formula
        produced the recorded numbers and reports the declared-formula counts
        alongside them, or the Coordinator fixes one formula in an amendment for
        future runs.
      status: open
    - id: VAL-DEF-05
      severity: material
      title: >-
        The measured-plus-modelled Q3 basis is dominated by a modelled cost 51x
        to 120x the entire base solve cost
      artifact_and_field: >-
        dlp_instance.yaml transfers[*].walk_cost_modelled_construction_weighted_field_mults
        against summary.json q3_class_statistics.base_solve_cost_measured;
        manifest.protocol_frozen_constants.walk_cost_basis.modelled_formula.
      detail: >-
        Median modelled construction cost per member is 2062641 / 1047872 /
        4023618 / 2963242 field multiplications against base solve costs of
        17296 / 19680 / 76076 / 57944 -- ratios of 120x / 53x / 53x / 51x -- and
        222x to 1421x the median MEASURED walk cost. The "0 members cheaper
        end-to-end once the walk is charged" reading is therefore produced
        entirely by a modelled quantity, computed under a deliberately naive
        quadratic polynomial-arithmetic model, that swamps every measured
        quantity in the run by two orders of magnitude.
      repair_route: >-
        Any record citing that reading states the ratio and the model's
        pessimistic direction, and states the contract-literal
        (measured-walk-only) counts alongside it. Neither basis is presented
        alone.
      status: open
    - id: VAL-DEF-06
      severity: material
      title: >-
        The band-clearing member screen has no multiplicity control and its
