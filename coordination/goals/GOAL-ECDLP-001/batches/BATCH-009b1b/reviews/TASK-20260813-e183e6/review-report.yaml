  # ===================================================================
  # THE BAND DETERMINATION -- the one call that is this task's alone
  # ===================================================================
  band_determination:
    question: >-
      The contract's mandatory different-order null-object control carries an
      unconditional stop: if it does not separate, NO Q1 or Q3 result may be
      reported as evidence in any form. The Executor's frozen band has two
      parts. Under the PRIMARY bootstrap band on the median-of-16 statistic the
      control separates in all four runs. Under the RAW per-seed band it fails
      to separate in RUN-ISOU-2ac81f-20BIT-A and RUN-ISOU-2ac81f-24BIT-A. Which
      band is admissible, and is a band designated after a 16-bit shakedown a
      legitimate pre-registration or a post-hoc rescue?

    finding_on_the_merits: >-
      THE MEDIAN BAND IS THE CORRECT INSTRUMENT AND THE RAW PER-SEED BAND IS
      NOT A RESOLUTION CRITERION FOR THIS COMPARISON. This is not a judgement
      call; it is a closed-form fact about the contract's own numbers. The
      contract sizes the control at N' <= N/16 and asserts that this is "large
      enough that 0.886*sqrt(N) separates at the resolution of the seed
      dispersion band". Model the plain rho step count as the random-function
      ideal, so the count in units of sqrt(N) has survival exp(-x^2/2). The raw
      per-seed band's lower edge is the MINIMUM of 16 such draws, with
      P(min > c) = exp(-8c^2). A control at exactly N' = N/16 has median
      sqrt(2*ln 2 * N/16) = (1.1774/4)*sqrt(N), and
      exp(-8 * (1.1774/4)^2) = exp(-ln 2) = 0.5000 EXACTLY. So at the
      contract's own declared boundary the raw-band gate is a fair coin toss,
      decided entirely by where the base curve's luckiest of 16 seeds happened
      to land, and it would fail half the time against a control that separates
      perfectly and by construction. At the ratio the runs actually used
      (N' approximately N/32) the same computation gives a FAILURE probability
      of about 0.71; two of four runs failed, which is exactly what that
      predicts. A gate whose outcome is a coin flip statistically independent
      of the quantity it is meant to test does not measure resolution.
    finding_on_the_merits_measured_support: >-
      Measured in units of sqrt(N_base), the null-object median is the stable
      quantity and the raw band's lower edge is the unstable one. Null medians
      across the four runs: 0.230, 0.225, 0.230, 0.214 -- a spread of 7
      percent. Base-curve per-seed minima across the same four runs: 0.215,
      0.457, 0.163, 0.353 -- a spread of 180 percent. The raw-band verdict is
      determined by the threshold's noise, not by the control's position. By
      contrast the null median tracks the predicted sqrt(N'/N) scaling in every
      run (predicted 0.176, 0.177, 0.177, 0.177 against observed 0.197, 0.169,
      0.178, 0.218), which is the actual positive content of this control and
      which holds under BOTH bands in ALL FOUR runs.
    finding_on_the_merits_second_ground: >-
      The statistic every between-member comparison in this census actually
      compares is each curve's MEDIAN over the same 16 seeds. A band on single
      draws is not the sampling resolution of a statistic on 16 draws. Applying
      the raw per-seed range as the gate for a comparison of medians is a
      category error independent of the coin-flip argument above.

    finding_on_pre_registration: >-
      LEGITIMATE PRE-REGISTRATION IS NOT ESTABLISHED, AND POST-HOC RESCUE IS
      AFFIRMATIVELY CONTRADICTED BY THE RECORD. Three separate findings:
      (1) The frozen contract does NOT name the band's statistic. Its
      seed_dispersion_band control says only that "the base curve re-solved
      under all 16 seeds establishes the within-curve dispersion band"; it names
      no interval rule, no percentile, no bootstrap. TASK-20260813-4bee82's list
      of implementation-level resolutions the Coordinator fixed before data
      (walk and distinguished-point parameters, Q1 common coordinate reading, Q2
      candidate model set, M/S aggregation, measured-versus-modelled labelling,
      run ordering) does NOT include the band statistic. So the field was
      underspecified and the producer had to resolve it. Because there was no
      prior value, the contract's invalidation rule against "post-hoc adjustment
      of ... the seed band after seeing cost data" is NOT literally triggered --
      nothing was adjusted. But an underspecified field resolved with knowledge
      of how the alternatives behave is a researcher-degrees-of-freedom problem
      whether or not the word "adjustment" applies, and the resolution decides a
      MANDATORY STOP.
      (2) The choice is NOT self-serving, which is the strongest available
      evidence against post-hoc rescue and is a fact neither the Executor nor
      the batch disclosures drew out. The primary band simultaneously BREAKS a
      different clause of the same contract: the success_criterion requires that
      "the base curve reproduced 0.886*sqrt(N) within the seed band", and
      fixture_inside_median_band is FALSE in RUN-ISOU-2ac81f-20BIT-A and
      RUN-ISOU-2ac81f-20BIT-B while fixture_inside_per_seed_band is TRUE in all
      four. Under the raw band the reproduction clause passes everywhere and the
      null clause fails twice; under the median band the null clause passes
      everywhere and the reproduction clause fails twice. A choice made to
      rescue admissibility does not hand back a failure of the same contract's
      success criterion in the two runs where it was already safe. THERE IS NO
      BAND UNDER WHICH ALL FOUR RUNS SATISFY BOTH CLAUSES.
      (3) What can and cannot be verified from artifacts. VERIFIED: the two-part
      rule with median_band designated PRIMARY is embedded verbatim in the
      manifest of RUN-ISOU-2ac81f-20BIT-A, the FIRST of the four runs
      (started_at 2026-08-14T07:17:59Z), so it demonstrably predates all four
      archived runs. NOT VERIFIABLE: the 16-bit shakedown is recorded as "in
      scratch, not part of this record", so the assertion that the design was
      fixed after it -- and what was seen in it -- rests solely on the
      Executor's own disclosure. The Executor disclosing this at all is evidence
      about conduct, and good evidence; it is not evidence about the band, and
      this report does not treat it as such.

    determination: >-
      The median band is the admissible resolution ON THE MERITS. The AUTHORITY
      to designate it is not the producer's: the frozen contract left the field
      open, and a producer-chosen statistic that decides a mandatory stop
      condition cannot be the pre-registration that the stop condition depends
      on. Being right is not the same as being pre-registered. The cure is a
      Coordinator act on the record -- a versioned protocol_amendment under
      experiments/EXP-ISOU-2ac81f/amendments/ or a superseding contract -- that
      fixes the band statistic prospectively and states the reasoning. It is NOT
      a field edit, NOT a re-score of these runs, and NOT this Validator's
      agreement with the statistics.

    disposition_robust_to_the_cure: >-
      The disposition below does not depend on how the Coordinator rules,
      because it separates the runs by whether their verdict is band-dependent
      at all. RUN-ISOU-2ac81f-20BIT-B and RUN-ISOU-2ac81f-24BIT-B pass the
      mandatory stop under BOTH bands; their Q1 and Q3 are admissible on this
      gate regardless. RUN-ISOU-2ac81f-20BIT-A and RUN-ISOU-2ac81f-24BIT-A pass
      only under the median band; their Q1 and Q3 are HELD -- not rejected, not
      admissible -- until the Coordinator settles the band on the record. If the
      Coordinator declines to amend, the raw band governs by default and those
      two runs carry NO admissible Q1 or Q3 in any form, including preliminary,
      partial or indicative.

