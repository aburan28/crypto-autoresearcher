      status: open
    - id: VAL-DEF-09
      severity: material
      title: >-
        Null-object censoring is 5x to 7x the member rate in the 20-bit runs
        because the distinguished-point density is not scale-invariant
      artifact_and_field: >-
        solve_records.jsonl status fields by curve_role;
        manifest.protocol_frozen_constants.rho.distinguished_point_rule and
        .max_steps_rule.
      detail: >-
        Censoring by curve role, recomputed from raw: 20BIT-A members 35/2480
        (1.41 percent) against nulls 13/128 (10.16 percent); 20BIT-B members
        49/2544 (1.93 percent) against nulls 14/128 (10.94 percent); 24BIT-A
        members 43/9488 (0.45 percent) against nulls 2/128 (1.56 percent);
        24BIT-B members 37/11856 (0.31 percent) against nulls 0/128. The
        mechanism is fully explained and scales as predicted: the walk is
        censored when its cycle contains no distinguished point, which has
        probability of order 1/(ln(16/15)*1.2533*sqrt(N)) -- about 1.2 percent
        at N near 1.05e6 and 0.30 percent at N near 1.68e7, matching the member
        rates closely. Because the density is fixed at 1/16 while N' is about
        N/32, the CONTROL runs in a different censoring regime from the members
        even though its solver parameters are literally identical.
      direction_and_magnitude: >-
        Censoring selects walks with short cycles, which are shorter than
        typical overall, so removing them biases the surviving median UPWARD --
        toward the members, i.e. AGAINST separation. The primary-band separation
        is therefore conservative with respect to this bias. But
        RUN-ISOU-2ac81f-20BIT-A's raw-band verdict sits only 7.3 percent from
        the band edge, which is inside the bias magnitude, so that particular
        verdict is not robust in either direction. RUN-ISOU-2ac81f-24BIT-A's
        raw-band failure at 41 percent from the edge is robust.
      repair_route: >-
        Future contracts scale the distinguished-point density with sqrt(N) so
        the control and the members share a censoring regime, or restart
        censored walks under a derived seed and record the restart.
      status: open
    - id: VAL-DEF-10
      severity: minor
      title: Control execution is guarded by wall-clock tests, so the control set is machine-speed dependent
      artifact_and_field: >-
        census.py lines guarding the tail-check re-run
        (`if not inside and time.time() < deadline`), the BSGS cross-check
        (`kb0 = bsgs_solve(...) if time.time() < deadline else None`) and the
        member-pool BSGS check.
      detail: >-
        On these runs every control executed (313 s against a 2 CPU-hour
        budget, no limit hit), so nothing was skipped. But the recorded command
        does not deterministically reproduce the CONTROL SET on a slower host:
        the BSGS cross-check and the fresh-seed tail check would be silently
        omitted rather than reported as missing.
      repair_route: >-
        Controls are run unconditionally or their omission is written to the
        defect log rather than left as a null.
      status: open
    - id: VAL-DEF-11
      severity: minor
      title: >-
        The declared Q2 replay self-check FAILS for 14 members and is not in any
        defect log
      artifact_and_field: >-
        summary.json members[*].q2_replay_matches_q1_op_sequence is false for
        vertices 20, 29, 75, 99, 143, 154 (20BIT-A); 32, 41, 105, 137, 149
        (20BIT-B); 29 (24BIT-A); 198, 451 (24BIT-B). Not present in any
        defect_log.yaml, and the receipt's DEV-4 asserts the check without
        noting exceptions.
      detail: >-
        The manifest declares "The replayed op sequence is asserted equal to the
        Q1 op sequence, which is a self-check on the replay". FOUND AND
        DIAGNOSED IN THIS SESSION: the check fails for exactly and only those
        members whose seed-index-0 walk solved in FEWER than the declared 300
        replay operations (their seed-1 counts are 167, 263, 183, 157, 145, 225;
        140, 252, 191, 181, 283; 86; 151, 74). The correlation is perfect,
        14 of 14, and no member with 300 or more seed-1 operations fails. It is
        a benign length mismatch, not an arithmetic disagreement, and the
        retained Q2 values sit correctly on the two-valued a = -3 partition, so
        NO NUMBER IS WRONG. The defect is that a declared self-check failed, the
        failing data was retained without gating, and the failures were not
        written to the defect log, which the contract and AGENTS.md rule 8
        require for unexpected observations and protocol deviations.
      repair_route: >-
        Record the diagnosis. No number changes. A future run either gates on
        the check or declares the short-walk exception in advance.
      status: open
    - id: VAL-DEF-12
      severity: minor
      title: Run-record terminal status reason is a template that misstates the run
      artifact_and_field: run_record.yaml terminal_status_reason in all four runs
      detail: >-
        The text reads "N individual solves were censored and/or the budget was
        reached before every member was measured" while budget_exhausted is
        false, no run reached its limit, and every member was measured. The
        censored count quoted there is the class-member subset (35 / 49 / 43 /
        37) while the receipt's censored_solves for the same runs is the
        all-roles total (49 / 63 / 45 / 37), so the same named quantity carries
        two values across two records for three of the four runs.
      repair_route: reporting fix in a future run; no measurement is affected
      status: open
    - id: VAL-DEF-13
      severity: minor
      title: >-
        A producer artifact asserts the admissibility adjudication that this
        task owns
      artifact_and_field: summary.json fields null_object_separated and q1_admissible
      detail: >-
        Both are set true in all four runs. They are a mechanical application of
        the manifest's declared rule and are not an interpretation of the
        result, so this is not a no-interpretation violation. But
        q1_admissible is the field a downstream reader will take as the gate's
        verdict, and the gate's authority is exactly what VAL-DEF-01 leaves
        unsettled.
      repair_route: >-
        Any evidence record cites this report's per-run gate table rather than
        summary.q1_admissible.
      status: open

  # ===================================================================
  # WHAT MAY AND MAY NOT CARRY INTO AN EVIDENCE RECORD
  # ===================================================================
  admissibility_disposition:
    binding_note: >-
      This section states what the RECEIPT can support. It assigns no evidence
      strength and draws no conclusion; the Coordinator interprets, on its own
      decision, after this verdict.
    may_carry_now:
      - >-
        CLASS COMPLETENESS, all four runs. Enumerated vertex count equals
        h(disc(End(E_0))) at 156, 160, 594, 742, with h recomputed
        independently in this validation and every vertex independently
        certified to lie in the F_p-isogeny class. Must carry the DEV-3 scope
        restriction (VAL-DEF-03): the gate was non-falsifiable as executed, and
        the base-curve population is filtered 6:1 in 20BIT-A and 3:1 in
        20BIT-B, unfiltered in both 24-bit runs.
      - >-
        CERTIFICATE COVERAGE, all four runs. 1652 of 1652 members verified, plus
        four base-curve instances and 32 null-object instances, by a checker
        established independent by code reading AND re-verified in this session
        by third arithmetic. Zero failures.
      - >-
        Q2, all four runs. Best-to-worst per-operation ratio 1.0299 / 1.0262 /
        1.0304 / 1.0283, taking exactly two values per run partitioned exactly
        by the a/(-3) fourth-power test, each member in its own cheapest
        reachable model from a candidate set declared before measurement. Q2 is
        not gated by the null-object stop, which names Q1 and Q3. Must carry the
        DEV-4 common-mix caveat.
      - >-
        MONTGOMERY/EDWARDS REACHABILITY, all four runs. Zero of 1652 members
        admits either model, computed per member rather than sampled. This is
        the observable named in falsification criterion F3, and it was not
        observed.
      - >-
        Q1 AND Q3 FROM RUN-ISOU-2ac81f-20BIT-B AND RUN-ISOU-2ac81f-24BIT-B. The
        mandatory null-object stop is met in these two under BOTH bands, so
        their admissibility does not depend on VAL-DEF-01. Every Q3 citation
        must carry COST-02, COST-03, VAL-DEF-04, VAL-DEF-05 and VAL-DEF-06;
        every Q1 citation must carry the DEC-20260813-e0077d resolution floor
        (a null means "no effect above the frozen band at the tested scale",
        never "no effect") and the null-object strength limitation.
      - >-
        CENSORING RATES as an instrument property: 1.86 / 2.33 / 0.47 / 0.31
        percent, mechanism identified and matching the predicted 1/sqrt(N)
        scaling, each censored solve recorded with its step count at cutoff and
        contributing no cost datum. Never as a slow or resistant curve, never as
        mathematical evidence.
    must_not_carry_until_the_coordinator_settles_the_band:
      - >-
        ANY Q1 OR Q3 NUMBER FROM RUN-ISOU-2ac81f-20BIT-A. Under the raw band
        the mandatory control does not separate, and under the median band the
        contract's reproduction clause fails; the run satisfies the contract's
        success_criterion under NO available reading. Held in every form,
        including preliminary, partial and indicative.
      - >-
        ANY Q1 OR Q3 NUMBER FROM RUN-ISOU-2ac81f-24BIT-A. Under the raw band the
        mandatory control does not separate, by a 41 percent margin. Held in
        every form.
      - >-
        The class-level Q1 and Q3 aggregates that pool all four runs, since two
        of the four contributors are held.
    must_not_carry_at_all:
      - >-
        Any statement that the base curve reproduced the frozen 0.886*sqrt(N)
        fixture. It did not, in any run; the measured medians exceed it by
        1.320 / 1.506 / 1.457 / 1.106.
      - >-
        Any re-scored comparison of these runs against sqrt(pi*N/2),
        sqrt(2*ln 2*N) or any other substitute constant. Re-scoring after
        seeing the outcome is precisely the post-hoc adjustment the frozen
        prediction exists to prevent, and the contract's own invalidation rule
        names it.
      - >-
        "No member is cheaper end-to-end" stated without naming its basis.
        The statement is true on the measured-plus-modelled basis and false on
        the contract-literal measured basis, where 24 / 75 / 90 / 37 members are
        below the base curve raw and 6 / 7 / 14 / 9 clear the frozen band -- the
        observable named in falsification criterion F4. Both bases and the
        false-flag expectation must appear together or neither may be cited.
      - >-
        Any statement about P-256, any asymptotic, scaling, speedup or
        security-impact claim, and any claim above toy tier.

  limitations:
    - >-
      MODEL INDEPENDENCE IS NOT ACHIEVED. This validation ran in a separate
      session under the validator role with xhigh effort, and I did not produce
      any artifact under review, but the resolved model is the same model that
      served the Executor because this harness resolves every policy alias to
      one model. Every substantive check was therefore re-derived with
      arithmetic written in this session rather than by reading the producer's
      conclusions, which narrows but does not remove the correlated-judgement
      risk.
    - >-
      I did not re-run the experiment and am forbidden to. The byte-identical
      re-run of RUN-ISOU-2ac81f-20BIT-A is the Executor's own measurement. What
      I could check is the BINDING, and I did: all RNGs are seeded from the
      master seed or from fixed constants, the class enumeration is
      insertion-ordered with no set-iteration dependence, and the recorded
      command carries every parameter. Two gaps remain and are recorded as
      VAL-DEF-07 and VAL-DEF-10.
    - >-
      The Velu edge certificates are self-checks computed inside census.py and
      were not independently re-verified as isogenies. Class MEMBERSHIP is
      independently certified for every vertex by my own order-N verification
      plus Tate; what is not independently certified is which particular isogeny
      connects which pair, which is the structure the Q3 walk cost is charged
      along.
    - >-
      The 16-bit shakedown is not in the record, so the provenance narrative in
      ANOM-1 and ANOM-4 cannot be verified from artifacts. What IS verifiable is
      that the two-part band rule is embedded in the manifest of the first of
      the four runs and therefore predates all four.
    - >-
      Memory was measured on one of four runs (VAL-DEF-05 in cost_model_checks
      COST-05).
    - >-
      Toy scale, 20 and 24 bits. P-256 is the SHAPE imitated, not the object
      measured. Nothing here is evidence about P-256, and no transfer assumption
      is asserted anywhere in the run set, which is the correct handling.

  conduct_observations:
    - >-
      RECORDED BECAUSE IT BEARS ON HOW THE DEFECTS ABOVE SHOULD BE READ, AND
      NOT AS EVIDENCE ABOUT ANY MEASUREMENT. Every item that could have been
      buried was disclosed by the producer first: the two-part band and its
      post-shakedown ordering (ANOM-1/DEV-5), the fixture discrepancy with both
      constants recorded side by side and no re-scoring (ANOM-2), the
      completeness filter with its rejection counts (DEV-3), the Q2 replay
      length and common-mix choices (DEV-4), the censoring mechanism and rates
      (ANOM-3), the twice-executed run (ANOM-4), the small-constant charging
      convention (DEV-6), the kernel-generator substitution (DEV-1) and the
      package layout (DEV-2). Both band verdicts are reported in every run and
      every number in this validation was recomputable from the raw records.
      Sage was available and deliberately not used so the operation counts are
      real instrumented counts.
    - >-
      That does not lower the bar anywhere in this report. Disclosure is
      evidence about conduct, not about the band, the fixture or the gate, and
      the defects above stand at the severity they earn on the artifacts. The
      two blocking defects are in the CONTRACT and its APPROVAL, not in the
      execution.

  gate_results_one_line_each:
    null_object_separation: >-
      Separates in all four runs under the primary median band and in 20BIT-B
      and 24BIT-B under the raw per-seed band; the median band is correct on
      the merits but was designated by the producer on a field the frozen
      contract left open, so Q1/Q3 from 20BIT-A and 24BIT-A are HELD pending a
      Coordinator amendment.
    class_closure_versus_termination: >-
      CLOSURE in all four runs, independently verified -- h recomputed here by
      form counting equals the enumerated vertex count (156, 160, 594, 742) and
      every vertex was independently certified to have order N and hence to lie
      in the class -- with the DEV-3 restriction that the gate was
      non-falsifiable as executed.
    q1_q2_regime_separation: >-
      NOT MIXED -- all 27008 solve records carry the single declared common
      coordinate system AFFINE_SHORT_WEIERSTRASS, and Q2 was measured in a
      separate replay over a candidate model set and M/S rule recorded in the
      manifest before measurement.
    certificate_checker_independence: >-
      INDEPENDENT -- no import of solver internals, separate process, different
      inversion algorithm and different scalar-multiplication schedule -- and
      additionally re-verified in this session by third arithmetic, 1652 of 1652
      members plus base and null instances, zero failures.

  blockers_and_inability_to_adjudicate:
    - >-
      I CANNOT ADJUDICATE, AND DO NOT, whether the Coordinator should amend the
      band or let the raw reading stand. That is a protocol decision reserved to
      the Coordinator by AGENTS.md and by the contract's own amendment clause.
      This report states the merits, the authority problem and a disposition
      that is robust to either outcome.
    - >-
      I CANNOT VERIFY the content of the 16-bit shakedown or the code version of
