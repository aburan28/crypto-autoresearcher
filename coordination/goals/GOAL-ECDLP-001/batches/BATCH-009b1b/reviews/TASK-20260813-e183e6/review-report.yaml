    - id: VAL-DEF-07
      severity: material
      title: >-
        summary.json is generated from an unarchived scratch state file, so the
        archived artifact set cannot regenerate it
      artifact_and_field: >-
        census.py do_run writes args.state_file, and do_summarize reads it;
        manifest.command records
        --state-file <scratch>/stateA.json, a path outside the repository.
      detail: >-
        The summarize step consumes member_q1, member_mix, member_q2,
