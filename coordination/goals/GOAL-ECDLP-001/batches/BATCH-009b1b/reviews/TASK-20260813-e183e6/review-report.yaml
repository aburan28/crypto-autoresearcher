      status: open
    - id: VAL-DEF-08
      severity: material
      title: >-
        The discarded first execution of RUN-ISOU-2ac81f-20BIT-A and the code
        version that produced it are not in the record, and the changed line is
        the null-object band verdict line
      artifact_and_field: >-
        coordination/goals/GOAL-ECDLP-001/tasks/TASK-20260813-4bee82/receipt.yaml
        anomalies[ANOM-4].
      detail: >-
        The receipt discloses that 20BIT-A was executed twice, before and after
        "a purely cosmetic fix to a log line that printed the null-object
        separation verdict next to the wrong band", with only the second
        retained. The first execution's artifacts and the pre-fix census.py are
        not archived, so "purely cosmetic" rests solely on the Executor's word,
        and the line concerned is precisely the item this report has to
        adjudicate. THE DISCLOSURE IS CORRECT CONDUCT AND THE GAP IS STILL REAL.
      containment_established_here: >-
        No NUMBER is in doubt. Both bands and both separation verdicts are
        computed from the base-curve and null-object solve records, which are
        produced by the solver and not by the band logic, and I recomputed both
        bands and both verdicts in this session from raw with exact agreement.
        What cannot be established from artifacts is whether the first execution
        displayed a different verdict that motivated the change.
      repair_route: >-
        Nothing to repair in these artifacts. Future runs retain every execution
