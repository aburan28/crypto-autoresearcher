      PRESERVED VERBATIM AND NOT EDITED. The corrected enumeration is 51 batch
      directories CARRYING A batch.yaml, and 47 DISTINCT batch ids across 48
      checkpoint files (BATCH-ef31ab carries two files). The superseded 146
      counted every directory under batches/ including those with no batch record
      and OVERSTATED the count; the derived 100/2 mismatch figures were computed
      from it and are superseded with it, and the corresponding corrected figures
      are NOT asserted, having not been computed. THIS DOES NOT RESOLVE THE
