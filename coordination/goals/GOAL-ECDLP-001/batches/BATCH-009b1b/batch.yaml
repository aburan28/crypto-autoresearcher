mandatory_gates:
  - >-
    NULL-OBJECT GATE IS A STOP, NOT A CAVEAT. If the different-ORDER null object
    control (at least 8 curves over a declared smaller prime p' with N' <= N/16)
    fails to separate from the class members at the resolution of the frozen
    seed band, that run reports instrument failure and NO Q1 or Q3 result may be
    reported from it in any form, including as preliminary or partial.
  - >-
    COMPLETENESS GATE. The census is complete only when the enumerated vertex
    count equals h(disc(End(E_0))) computed independently of the walk. A walk
    that merely terminates is not a closed class. Vertex count and independently
    computed h are reported side by side in every case, including agreement.
  - >-
    Q1 AND Q2 LIVE IN DIFFERENT COORDINATE REGIMES AND MUST NOT BE MIXED. Q1 in
    one common coordinate system across all members; Q2 in each member's own
    cheapest reachable model from a candidate set declared before measurement.
    Mixing them invalidates Q1 under the contract's own invalidation rules.
  - >-
    INDEPENDENT CERTIFICATE CHECKER. The checker shares no state and no code
    path with the solver. A member whose certificate does not verify contributes
    NO cost datum and goes in the defect log.
  - >-
    TIMEOUTS, CRASHES AND IMPLEMENTATION FAILURES ARE INFRASTRUCTURE SIGNAL AND
    NEVER NEGATIVE MATHEMATICAL EVIDENCE (AGENTS.md rule 5). A budget-exhausted
    24-bit run yields an incomplete subgraph and no Q1 or Q3 claim; the
    completed 20-bit censuses still stand on their own.
