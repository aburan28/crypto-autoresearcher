objective: >-
  Execute the approved, frozen contract EXP-ISOU-2ac81f exactly as written -- a
  complete-class ECDLP cost census on a P-256-SHAPED toy curve, producing
  immutable certificate-carrying run records with the three separated
  quantities Q1 (group operations in one common coordinate system), Q2 (field
  multiplications per group operation in each member's own cheapest reachable
  model) and Q3 (charged end-to-end cost in field multiplications with the
  isogeny walk charged), together with the contract's null-object, seed-band,
  positive-control, BSGS cross-check and special-j controls -- and then
  INDEPENDENTLY VALIDATE that result: its run receipts, certificates, controls
  and reproducibility bindings. Two cards, one Executor and one dependent
  Validator. Nothing in this batch interprets the result into a claim.
