    disposition: >-
      NOTHING SCIENTIFIC IS NARROWED. The frozen contract still authorizes
      maximum_runs 4; the 24-bit censuses are not cancelled, not deferred as
      science, and not scope-reduced; this is not a protocol change and would need a
