  baseline_comparison:
    pollard_rho: N^(1/2+o(1)) with negligible live-storage exponent
    standard_bsgs_full_cost: N^(2/3+o(1)) under the cited three-dimensional wiring model
    candidate_raw_expected_cost: N^(2/3-gamma_s+o(1))
    candidate_live_storage: N^(1/3+o(1))
    candidate_wiener_multiplier: N^(1/9+o(1))
    candidate_fully_charged_cost: N^(7/9-gamma_s+o(1))
    algebraic_checks:
      raw_vs_pollard_rho: '2/3-gamma_s<1/2 iff gamma_s>1/6: PASS'
      full_vs_standard_bsgs: '7/9-gamma_s<2/3 iff gamma_s>1/9: PASS'
      full_vs_pollard_rho: '7/9-gamma_s<1/2 iff gamma_s>5/18: PASS'
    adjudication: >-
      These are correct symbolic equalities conditional on the stated raw-work,
      storage, access, and fixed-input success exponents. They do not validate
      those premises. In particular, gamma_s fitted to the marginal E[p_i]
      is not the exponent of E[1/p_i], and logical byte traffic is not itself a
      certificate of the physical Wiener access multiplier.

  budget_adjudication:
