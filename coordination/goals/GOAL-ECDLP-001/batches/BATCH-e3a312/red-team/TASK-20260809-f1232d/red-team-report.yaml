  schema: crypto.autoresearch.red_team_report.v1
  task_id: TASK-20260809-f1232d
  batch_id: BATCH-e3a312
  goal_id: GOAL-ECDLP-001
  role: red-team
  recorded_at: '2026-08-09'
  claim_under_review: >-
    Whether the frozen signed-y experiment contract can support the conditional
    inference that a marginal Boolean-success exponent gamma_s greater than
    5/18 yields a fully charged single-target prime-field ECDLP cost exponent
    below Pollard rho, while preserving the stated no-advice, fixed-family,
    fixed-model, Boolean-bridge, control, resource, and scope boundaries.
  verdict: REVISE
  execution_authorized: false
  implementation_authorized: false
  official_status_change_authorized: false
  overall_rationale: >-
    The three algebraic crossover equalities and the explicitly materialized
    finite-population arithmetic are internally consistent, and the producer
    honestly surfaced the schedule-versus-authority mismatch. Version 1 is not
    approvable. Its complete compiler schedule already exceeds every separately
    authorized wall and CPU ceiling. More importantly, the experiment estimates
    an annealed marginal E[p_i] over curve-target/model inputs but inserts its
    inverse into a fixed-input restart cost. Two input families can have the
    same complete frozen observable tuple while one has finite fixed-target
    expected cost and the other has zero-success targets and infinite cost.
    The contract also does not freeze curve or target generation in its fifteen
    generator domains, does not make the X-to-V-to-S interface and 32-slot
    overflow behavior a hard gate, and declares an identical-shape null even
    though the treatment and null use materially different record and transform
    paths. These are interpretation and apparatus defects, not ECDLP evidence.

