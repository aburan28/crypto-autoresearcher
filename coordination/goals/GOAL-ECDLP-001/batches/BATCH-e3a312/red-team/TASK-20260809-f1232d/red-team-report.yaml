    complete_compiler_schedule:
      planned_wall_seconds: 451200
      hard_wall_seconds: 564000
      planned_cpu_hours: 992
      hard_cpu_hours: 1240
    authorized_ceiling:
      planned_wall_seconds: 450000
      hard_wall_seconds: 562500
      planned_cpu_hours: 988
      hard_cpu_hours: 1235
    exact_excess:
      planned_wall_seconds: 1200
      hard_wall_seconds: 1500
