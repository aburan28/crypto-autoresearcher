      hard_cpu_hours: 5
    stage_sum_check: >-
      The six authorized stage rows sum exactly to 450000/562500 wall seconds
      and 988/1235 CPU hours. The larger compiler totals are therefore not a
      rounding artifact or unused stage slack.
    disposition: >-
      Do not approve, implement, or execute version 1. Do not relabel the
      compiler totals as compatible, delete controls, reduce populations,
      weaken gates, or raise any ceiling. A versioned successor must prove a
      complete same-work schedule within the existing ceilings. If that cannot
      be done without a new measurement or added resource, the design remains
      blocked pending separate user authority; the mismatch is not a negative
      result about the hypothesis.

  objections:
    - id: RT-FIXED-INPUT-MARGINAL-INVERSION
      severity: blocking
      category: estimand_and_runtime_interface
      finding: >-
        The estimand is p_N=E_i[p_i], where i is the outer curve-target input
        and p_i averages the four fixed model views and fresh roots. For a
        single fixed input with independently restarted roots, expected root
        count is 1/p_i. Expected single-target cost over the input family is
        therefore proportional to E_i[1/p_i], not 1/E_i[p_i]. Jensen gives
        E[1/p_i]>=1/E[p_i], with an unbounded gap when the lower tail of p_i is
        uncontrolled. The contract lists heterogeneity summaries but has no
        preregistered lower-tail, uniformity, or harmonic-mean admission gate.
      observation_fiber_counterexample: >-
        Let f_N=N^(-1/3+gamma_s). Family A gives every input an independent
        Bernoulli root success probability p_i=f_N. Family B gives an f_N
        fraction of inputs p_i=1 and all remaining inputs p_i=0, with all four
        model views equal within an input. Take X=Y=V=S in both families. Both
        have the same global E[Y]=E[X]=p_N=f_N, kappa=E[X^2]/E[X]=1,
        p_N/E[X]=1, and p_N, so the complete proof-map observable tuple
        collides. Family A has finite expected roots 1/f_N on every input;
        Family B never succeeds on most fixed inputs and has infinite
        E_i[1/p_i]. The frozen observable therefore does not identify the
        claimed single-target cost conclusion.
      required_repair: >-
        Either narrow the scientific statement to an annealed experiment that
        redraws an outer input between attempts and remove every single-target
        attack/cost inference, or preregister and power a fixed-input lower-tail
        claim sufficient to bound E_i[1/p_i]. A synthetic between-input
        concentration control must hold the five global observables fixed while
        moving success between curve-target clusters. No post-treatment removal
        of zero-success clusters is permitted.

    - id: RT-FAMILY-TARGET-GENERATOR-UNBOUND
      severity: blocking
      category: family_model_estimand_and_discovery_cost
      finding: >-
        All fifteen literal generator domains are unique and their declared
        count is correct, but none generates or keys the curve family or the
        target scalar/point. The contract states 32 curves per size, one public
        curve-target outer population, exceptional-curve exclusions, and no
        special-curve selection, yet it freezes no curve-generation algorithm,
        prime/order sampling distribution, target-scalar distribution, target
        multiplicity, rejection cap, domain separator, or discovery and
        certification charge. Future manifests record what was chosen after the
        fact; they do not make the public family distribution preregistered.
      consequence: >-
        The family/model estimand is not reproducible from the frozen contract,
        family selection cannot be distinguished from discovery or special-curve
        advice, and the outer-input component of the runtime claim has no
        identifiable sampling law.
      required_repair: >-
        In a versioned successor, freeze the exact curve and target generators,
        seed domains, admissibility/rejection rules, number of targets per curve,
        retry exhaustion behavior, and all generation/order/subgroup/cofactor/
        anomalous/model-certificate costs. Bind the generated public inputs
        before treatment. This work must be reconciled inside the existing
        ceiling rather than omitted or charged to unreported preprocessing.

    - id: RT-BOOLEAN-INTERFACE-AND-CANDIDATE-OVERFLOW
      severity: blocking
      category: boolean_success_bridge_and_scalar_orientation
      finding: >-
        Paley-Zygmund bounds Pr[X>0], while runtime success is S=1[V>=1]. The
        files do not make X=V or S=1[X>0] a per-root hard invariant. Treatment
        and each control budget exactly 32 candidate slots per model/root, but
        no explicit rule says that a thirty-third exact distinct match causes
        apparatus invalidity rather than truncation. Silent truncation can
        bias X, V, kappa, p/E[X], and multiplicity slopes while leaving S
        apparently favorable. The named fixture pass rule does not state the
        required overflow behavior.
      required_repair: >-
        Freeze a lossless X-to-V interface, scalar orientation, candidate
        ordering, and overflow rule. Require X=V for every mathematically exact
        prime-order witness, S=1[V>0], and apparatus invalidity on any unrecorded
        candidate. Add a fixed 33-distinct-match mutation and an orientation-
        flipped witness mutation through the same candidate/verifier path.

    - id: RT-NULL-NOT-IDENTICAL-MEASUREMENT-SHAPE
      severity: blocking
      category: controls_before_belief
      finding: >-
        The contract sets identical_shape_null_requirement=true, but its own
        compiler makes the treatment and selector controls materially different:
        treatment list and pair records are 64 bytes and traverse canonical plus
        three transformed models, whereas control list records are 16 bytes,
        control pairs are 32 bytes, and the transform/model path is absent. The
        named balanced antisymmetric control can test the statistical estimator,
        but it cannot falsify a serialization, transform, bucket, hash, equality,
        buffer, or model-view artifact in the actual treatment path.
      required_repair: >-
        Add a same-code-path null on the admitted prime curves that changes only
        the public label/object to a balanced random antisymmetric null while
        retaining treatment points, models, record widths, hashing, joins,
        equality, candidate, verifier, and archive paths. Reuse frozen inputs
        and deterministic permutations where possible; do not pay for this by
        deleting an existing control or increasing the ceiling.

    - id: RT-END-TO-END-COST-MANIFEST-INCOMPLETE
      severity: blocking
      category: full_cost_and_hidden_overhead
      finding: >-
        The materialized arithmetic passes for 1567771584 group additions,
        194745216 transforms, 389597632 field multiplications, and all 87
        logical traffic rows totaling 676907725568 bytes. Those tables are not
        yet a complete end-to-end charge. They do not provide primitive-time or
        energy counts and throughput certificates for curve/target discovery
        and certification, signed-y labels, SHAKE blocks, pair hashes, sorting,
        bucket joins and comparisons, exact equalities, all witness paths,
        fixed-precision interval-Newton arithmetic, archive hashing, or the
        physical memory topology. Only the coverage-fit stage has an explicit
        throughput probe. Logical reads and writes do not by themselves prove
        HA-6's nonvanishing physical access rate or the N^(1/9) wiring charge.
      scope_of_objection: >-
        Omitted polylogarithmic work need not change an exponent if it is proved
        polylogarithmic, but it blocks the claims that the finite compiler is
        complete and that its wall/CPU schedule is auditable. An omitted
        discovery, advice, or outer-family selection phase can also change the
        claimed scope rather than merely a constant.
      required_repair: >-
        Supply a zero-residual cost manifest mapping every finite population and
        artifact to primitive operations, logical and physical access classes,
        measured-or-proved throughput, stage ownership, and the corresponding
        planned/hard cap. Add pre-treatment throughput admission for every
        dominant stage, not S2 alone. Preserve Pollard-rho and BSGS under the
        same cost convention.

    - id: RT-FINITE-LADDER-NONIDENTIFIABILITY
      severity: claim_ceiling
      category: asymptotic_scope
      finding: >-
        Five order sizes from 18 through 30 bits and three fixed eta values can
        identify only the preregistered finite-ladder parametric coefficient.
        A probability sequence can agree at all five sizes, pass every eta
        sensitivity fit, and flatten immediately above 30 bits. The design
        already says the toy ladder cannot establish the asymptotic quantifier;
        no later record may relabel a positive finite fit as gamma_s in an
        asymptotic ECDLP theorem or as cryptographic-scale validation.
      required_repair: >-
        Keep every outcome explicitly at toy finite-ladder scope. Treat a
        complete positive result only as a trigger for a separately designed
        scale/transfer investigation and independent review, never as the
        fully charged exponent claim itself.

    - id: RT-VERIFIER-SECRET-ISOLATION-UNSPECIFIED
      severity: blocking
      category: no_advice_and_oracle_boundary
      finding: >-
        Independent scalar verification requires retaining the known target
        scalar in the benchmark apparatus, but the frozen files state the
        no-advice rule without a data-flow isolation or noninterference gate.
        A selector that accidentally reads the verifier secret can create
        perfect Boolean success while preserving many aggregate counters.
      required_repair: >-
        Hold the target scalar in a verifier-only artifact or process that the
        selector cannot read. Require candidate-stream hashes and D/Y/X to be
        identical when the verifier secret is replaced by a committed decoy;
        only V/S and the verifier outcome may depend on the verifier input.

  required_controls:
    - id: CTRL-OUTER-CONCENTRATION-COLLISION
      purpose: >-
        Hold global E[Y], E[X], kappa, p/E[X], and p fixed while moving all
        successes from diffuse per-input Bernoulli roots onto a shrinking
        subset of curve-target clusters. The marginal estimator must collide,
        while the fixed-input/harmonic cost diagnostic must separate them.
      cheapest_construction: >-
        A symbolic machine-readable fixture using the existing synthetic count
        schema; no group computation, new curve, or experiment run is needed.
    - id: CTRL-33-CANDIDATE-OVERFLOW
      purpose: >-
        Route one root with 33 distinct exact matches through the real candidate
        path and require explicit apparatus invalidity or a lossless expansion,
        never truncation.
    - id: CTRL-SCALAR-ORIENTATION-AND-SECRET-ISOLATION
      purpose: >-
        Mutate scalar orientation and substitute a committed decoy verifier
        scalar. Candidate streams and pre-verifier metrics must remain fixed;
        the bad witness must yield V=0 and S=0.
    - id: CTRL-SAME-PATH-BALANCED-NULL
      purpose: >-
        Run a balanced random antisymmetric label through the exact treatment
        point, transform, serialization, hash, join, equality, candidate,
        verifier, and archive path.
    - id: CTRL-CURVE-TARGET-GENERATOR-REPLAY
      purpose: >-
        Rebuild the complete public input manifest from only frozen domains and
        keys and reproduce its bytes, retry counts, certificates, and charged
        discovery work exactly.

  counterexample_or_mutation:
    cheapest_falsification: RT-FIXED-INPUT-MARGINAL-INVERSION
    cost: symbolic_only_zero_experiment_runs
    construction: >-
      Compare the diffuse family p_i=f_N for every input with the concentrated
      family p_i in {0,1} having mean f_N, and set X=Y=V=S. The five frozen
      global observables are identical, yet one family has finite fixed-input
      expected restart cost and the other fails forever on most inputs.
    conclusion: >-
      The current observable and estimand cannot support the single-target
      inverse-success cost, even under ideal implementation and with every
      finite arithmetic check passing.

  heuristic_challenges:
    - id: HA-3
      result: insufficient_for_outer_input_heterogeneity
      detail: >-
        Subpolynomial within-root clustering does not control variation of the
        conditional Boolean probability across curve-target inputs.
    - id: HA-4
      result: conditional_independence_not_enough
      detail: >-
        Geometric restarts conditional on a fixed input justify 1/p_i, not
        inversion of the family marginal E[p_i].
    - id: HA-5
      result: untestable_as_frozen
      detail: >-
        The curve and target generator law is absent, and the listed fixed
        heterogeneity summaries have no pass threshold sufficient for a
        fixed-input cost claim.
    - id: HA-6
      result: algebraically_consistent_but_unvalidated
      detail: >-
        The N^(1/9) multiplier yields the stated 5/18 crossover, but the
        implementation-independent tables do not certify physical access or
        topology assumptions.
    - id: HA-7
      result: finite_model_only
      detail: >-
        Eta sensitivity can test the chosen five-point finite model; it cannot
        establish the asymptotic quantifier.

  cost_model_challenges:
    - The complete compiler schedule is outside all four authorized wall/CPU caps.
    - The full-cost threshold is correct only after replacing the marginal success exponent with a valid fixed-input or harmonic-cost exponent.
    - Logical traffic, archive bytes, and RSS caps are not a physical Wiener wiring certificate.
    - Curve/target generation, certification, and rejection/discovery costs are neither generated nor charged by the fifteen-domain compiler.
    - Several dominant hash, join, comparison, fitting, and archive operations have byte traffic but no primitive-throughput binding.
    - Preprocessing, reusable advice, and multi-target amortization are correctly excluded in prose and must remain excluded in every successor; they cannot be used to repair the cost comparison.

  reduction_and_scope_challenges:
    - >-
      The only admissible scientific output is about the exact toy prime-order
      family/model/root distribution once that distribution is actually frozen.
      No live-key, cryptographic-scale, special-curve, extension-field,
      multi-target, reusable-advice, security-impact, or breakthrough statement
      follows.
    - >-
      The current marginal-to-single-target interface is not a valid reduction.
      It requires either a new lower-tail theorem/control or an annealed-input
      scope that is not a single-target ECDLP algorithm.
    - >-
      Pollard rho remains the relevant generic single-target baseline and
      standard BSGS remains the memory-heavy full-cost boundary. Neither is
      displaced by a finite toy-ladder estimator outcome.

  proof_architecture_challenges:
    baseline_reproduction: >-
      The symbolic boundary gamma_s=0 gives (raw, memory, full) exponents
      (2/3,1/3,7/9), and the three crossover thresholds reproduce exactly.
      No frozen executable fixture yet binds those symbolic values to the
      complete physical cost manifest.
    observation_collision: >-
      Blocking collision found. Diffuse and outer-input-concentrated families
      share the complete observable tuple but disagree on fixed-target cost.
      The missing separator is a conditional-success lower-tail or harmonic-
      mean observable across curve-target inputs.
    quantifier_order: >-
      The hypothesis quantifies one public family/model rule before data, but
      the contract does not freeze the curve/target generator. It also moves
      from an average over outer inputs to a conclusion about independently
      restarted work on a fixed input without the required uniform quantifier.
    method_ceiling: >-
      The formal ceiling p_N<=1 gives gamma_s<=1/3 and the stated N^(4/9)
      ideal Wiener floor. That ceiling is about the marginal. It gives no
      finite upper bound for fixed-target expected cost when conditional
      success may be zero.
    nearby_object: >-
      The exact quotient and balanced null are useful estimator controls, but
      neither is the required outer-input concentration control, and the
      balanced null does not use the identical treatment path.
    compositional_interface: >-
      The stronger tuple D,Y,X,V,S does not by itself compose into the attack
      cost. The missing arrows are X-to-V/S losslessness, conditional p_i to
      fixed-input inverse-success cost, and logical traffic to physical
      full-cost charge.

  passed_gates:
    - Snapshot commit, parent, exact four-path diff, and reviewed file hashes are consistent.
    - All four reviewed files parse strictly with no duplicate YAML keys.
    - Fifteen generator rows have fifteen distinct literal domains.
    - All 87 traffic rows satisfy local_bytes=event_count*byte_width and sum to 676907725568 bytes.
    - Scheduled group, transform, and field-multiplication totals recompute exactly.
    - The three symbolic gamma_s crossover thresholds are arithmetically correct.
    - The files consistently state review_required, no evidence, no implementation, no execution, no official transition, no crypto-scale claim, and no breakthrough claim.
    - The producer did not conceal or zero the nonzero schedule-versus-budget residual.

  surviving_objections:
    - RT-FIXED-INPUT-MARGINAL-INVERSION
    - RT-FAMILY-TARGET-GENERATOR-UNBOUND
    - RT-BOOLEAN-INTERFACE-AND-CANDIDATE-OVERFLOW
    - RT-NULL-NOT-IDENTICAL-MEASUREMENT-SHAPE
    - RT-END-TO-END-COST-MANIFEST-INCOMPLETE
    - RT-FINITE-LADDER-NONIDENTIFIABILITY
    - RT-VERIFIER-SECRET-ISOLATION-UNSPECIFIED
    - DESIGN-BUDGET-INCOMPATIBILITY

  narrowest_supported_statement: >-
    Snapshot 58d4a04956d58b328b2fab9eda08f37f0e639b73 durably records a
    strictly parseable, implementation-independent toy finite-ladder design
    whose explicitly enumerated population, operation, traffic, and algebraic
    crossover arithmetic is internally consistent. It records no observation
    and supports no positive gamma_s, fixed-target inverse-success exponent,
    fully charged ECDLP improvement, solver, attack, security impact,
    cryptographic-scale transfer, novelty, or breakthrough. Version 1 is
    blocked before implementation by the declared budget excess and the Red
    Team objections above.

  next_concrete_action: >-
    Coordinator should record REVISE with execution_authorized=false and open
    only a versioned design-repair successor. The successor must first add the
    zero-run outer-concentration observation-fiber fixture and correct the
    marginal-to-fixed-input claim interface; freeze and charge curve/target
    generation; make X-to-V/S, candidate overflow, verifier isolation, and the
    same-path null explicit; and produce a complete same-work cost schedule
    at or below 450000/562500 wall seconds and 988/1235 CPU hours. It must not
    raise budget, delete work, weaken controls, or authorize implementation or
    execution. Snapshot the successor and obtain fresh independent Validator
    and Red Team review before any later approval decision.

