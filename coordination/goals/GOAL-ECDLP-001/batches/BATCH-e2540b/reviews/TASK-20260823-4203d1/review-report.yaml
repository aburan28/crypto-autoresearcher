    "joint_verdicts": [
      {
        "joint": "J1-P1531-equality-Lattes-typing-pole-divisors-and-specialization",
        "verdict": "breaks",
        "disposition": "REVISE",
        "summary": "The intended standard-coordinate theorem has a sound generic-C divisor argument, and its P1531 term equality follows after the elliptic objects are typed. The frozen theorem packet itself does not bind the elliptic curve E/F_p, the standard quotient coordinate x with x(O)=infinity, the exact-order point P, the scalar u, the field containing each specialized c, or the specialized circuit base field. Those are load-bearing for the claimed exact P1531 identity and for treating finite c as an affine pullback value. The omission makes J1 false as an exact, self-contained frozen statement even though no counterexample was found to the naturally repaired theorem.",
        "checks": [
          {
            "check": "half-orbit representatives",
            "outcome": "holds",
            "derivation": "Because D=2n is the exact order of m modulo the prime ell, m^n has order two in F_ell^*. The even-order premise excludes ell=2, so the unique order-two element is -1. Hence m^0 through m^(n-1) are exactly one representative from each pair {h,-h} in H."
          },
          {
            "check": "term-by-term P1531 equality",
            "outcome": "holds_conditionally_on_missing_types",
            "derivation": "After fixing E/F_p, a point P of exact order ell, u in F_ell^*, and the standard x-coordinate quotient, x([m^j u]P)=L_m^j(x([u]P)). For F_u(Z)=product over H/{+-1} of (Z-x([uh]P)), the squarefree product rule gives F_u'(c)/F_u(c)=sum_j 1/(c-L_m^j(X)) whenever the tagged denominators are nonzero. These E, P, u, x, and field bindings are not present in the frozen parameter block."
          },
          {
            "check": "Lattes degree and separability",
            "outcome": "holds_conditionally_on_explicit_quotient_diagram",
            "derivation": "For the quotient pi=x:E to P^1 and p not dividing m, [m] is separable of degree m^2. From pi composed with [m] = L_m composed with pi, multiplicativity of total and inseparable degrees gives deg(L_m)=m^2 and inseparable-degree one. This remains valid in characteristics two and three when pi is the standard elliptic quotient, but that quotient is only named implicitly in the packet."
          },
          {
            "check": "generic pullback reducedness and degree",
            "outcome": "holds",
            "derivation": "Over K=F_p(C), C is not a branch value of any separable iterate phi^j because every branch value is algebraic over F_p. Therefore D_j=(phi^j)^*[C] is reduced of degree d^j."
          },
          {
            "check": "generic level disjointness",
            "outcome": "holds",
            "derivation": "If z belonged to D_i and D_j for i<j, then phi^(j-i)(C)=C in F_p(C). Evaluation at the transcendental C is injective on F_p(T), while phi^(j-i)(T)-T is nonzero because phi^(j-i) has degree d^(j-i)>1. Thus no such z exists."
          },
          {
            "check": "infinity, reduced denominator, and cancellation",
            "outcome": "holds_for_generic_C",
            "derivation": "The value phi^j(infinity) is algebraic over F_p and cannot equal transcendental C. A point of D_j is therefore affine and a simple pole of exactly the j-th summand. All other summands are regular there, so its nonzero principal part cannot cancel. The finite pole divisor has degree M_n=sum_j d^j, exactly the reduced denominator polynomial degree."
          },
          {
            "check": "concrete specialization boundary",
            "outcome": "breaks_as_frozen",
            "derivation": "Avoiding branch values and periods below n is sufficient for reduced, level-disjoint pullbacks. To make the packet's affine-denominator and P1531 conclusions exact, however, the record must also bind the standard quotient convention x(O)=infinity and L_m(infinity)=infinity, or independently require c not equal phi^j(infinity); bind c to the public constant field; bind E, P, and u; and state the specialized scalar-circuit base field. The existing requirements concerning defined queried labels and actual tuple separation are then appropriate, and they correctly make no existence or probability claim."
          }
        ],
        "minimal_repair": [
          "Quantify an elliptic curve E/F_p and the standard quotient pi=x:E to P^1 with x(O)=infinity.",
          "Quantify P of exact order ell, u in F_ell^*, and define F_u before asserting the P1531 identity.",
          "State pi composed with [m] = phi composed with pi, derive deg(phi)=m^2 and separability from p not dividing m, and record phi(infinity)=infinity for the chosen coordinate.",
          "For each concrete c, state its field and the specialized circuit base field; alternatively add c not equal phi^j(infinity) for all j if a nonstandard P^1 coordinate is allowed.",
          "Retain the existing branch-value, aperiodicity, tagged-pole, actual-separation, global-equality, and finite-domain exclusion clauses."
        ],
        "claim_boundary": "The break is a formal statement and specialization-typing defect. It is not a counterexample to the generic-C pole calculation under the intended standard Lattes setup, and it says nothing about finite-domain, shared, transposed, multipoint, collision-only, P1533, or charged-oracle algorithms."
      },
      {
        "joint": "J2-scalar-arithmetic-circuit-degree-and-tightness",
        "verdict": "holds",
        "disposition": "PASS_JOINT_ONLY",
        "summary": "Conditional on an output with Delta_X at least M_n, the fan-in-two scalar arithmetic-circuit lower bound is correct, including arbitrary X-independent constants, divisions, cancellation, and DAG reuse. The direct fixed-degree recurrence supplies an O_m(D) upper bound, so the exponent is tight inside exactly this model.",
        "checks": [
          {
            "check": "degree measure under all four gates",
            "outcome": "holds",
            "derivation": "For reduced f=A/B and g=G/H, each of f+g, f-g, fg, and f/g before reduction has numerator and denominator X-degrees bounded by Delta_X(f)+Delta_X(g). Reduction and cancellation can only decrease those degrees. Division is admitted only when g is not the zero rational function."
          },
          {
            "check": "2^s envelope with DAG reuse",
            "outcome": "holds",
            "derivation": "Initially Delta_X(X)=1 and every X-independent constant has Delta_X zero. In a topological ordering, gate t combines two values of degree at most 2^(t-1), including two references to the same reused DAG node, and therefore has degree at most 2^t. Thus every size-s output has Delta_X at most 2^s."
          },
          {
            "check": "exact lower bound and asymptotic form",
            "outcome": "holds",
            "derivation": "If the output has reduced denominator degree M_n, then Delta_X(output)>=M_n. Hence M_n<=2^s and s>=ceil(log_2 M_n). With M_n=(d^n-1)/(d-1), fixed d=m^2>1, and n=D/2, log_2 M_n=n log_2 d-O_m(1), which is Omega(D) along families with D tending to infinity."
          },
          {
            "check": "direct-recurrence tightness",
            "outcome": "holds",
            "derivation": "For fixed m, phi has fixed degree d and can be evaluated from its X-independent coefficients with O_m(1) scalar gates. Updating Y=phi(Y), forming 1/(C-Y), and accumulating for n terms uses O_m(n)=O_m(D) gates."
          },
          {
            "check": "degree-one proves-too-much control",
            "outcome": "holds",
            "derivation": "For phi(X)=zeta X with zeta of exact order n and p not dividing n, the sum is n C^(n-1)/(C^n-X^n). Its X-degree is n, so the same degree argument yields only ceil(log_2 n), consistent with addition-chain exponentiation and not Omega(n). The d>1 exponential pullback growth is therefore genuinely load-bearing."
          }
        ],
