      kind: operational_filter_exposure
      description: "While filtering the generated dispatch plan, the Red Team printed one sibling Reviewer task card and its queued state. The same assignment structure was already present in the committed review plan. No sibling report, result, verdict, artifact bytes, or directory contents were read."
      effect_on_scientific_blindness: "No scientific output was exposed; read_sibling_reports remains false. The operational status exposure violates the stricter task instruction and is recorded rather than hidden."
    - id: PD-RT68-02
      kind: shared_worktree_path_exposure
      description: "A required pre-write git-status check later exposed the paths of two untracked sibling Reviewer output files created concurrently in the same worktree. The Red Team did not open, read, hash, stat, modify, delete, or wait on either file."
      effect_on_scientific_blindness: "Path-only exposure; no sibling content or verdict was observed. The Coordinator directed continuation within the exact disjoint two-file scope."

