  recorded_by: red-team
  claim_under_review: "Only whether the frozen fixed-small-m global rational Lattes Cauchy accumulator requires Omega(D) fan-in-two scalar arithmetic gates for generic C and individually certified good c, with exact P1531 equality and Gallant cost/recovery. No positive algorithm, broad P1531-P1533 closure, finite-domain lower bound, novelty, speedup, support, or breakthrough is under review."
  claim_ceiling: unverified_zero_run_scoped_closure_candidate_for_global_uniform_scalar_arithmetic_circuits_computing_the_fixed_small_m_Lattes_Cauchy_accumulator_only
  assignment:
    joints_owned:
      - J4-Gallant-recovery-end-to-end-cost-and-resource-reversal
      - J5-nonduplication-proves-too-much-scope-and-source-provenance
