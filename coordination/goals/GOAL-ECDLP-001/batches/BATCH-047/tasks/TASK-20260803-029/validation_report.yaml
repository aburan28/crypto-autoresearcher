        certificate_pass=true, n_hops_planted=4, H_min=1 >= 1 (FIX-3 min_hops
        requirement satisfied), path non-empty, endpoint j=1032394 != search
        start j=415112.
        SCOPED CONCERN: start_det for the BFS start j=415112 shows any_special=true
