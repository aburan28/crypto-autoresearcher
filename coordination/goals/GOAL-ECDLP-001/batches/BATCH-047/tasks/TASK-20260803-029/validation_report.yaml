        BFS search starts at a curve that is ITSELF already special. Since
        trace/group-order is an isogeny-class invariant for ordinary curves, the
        planted walk traverses curves all having the same group order — the control
        demonstrates path-finding WITHIN special isogeny classes, NOT transfer from
        a generic non-special curve to a special target. This is consistent with
        rho_special=0. Ledger record must not cite planted_path_recovered=true as
        evidence of generic-to-special transfer capability.

