    - id: RT-045-D3
      disposition: OPEN
      detail: >-
        rho_special=0.0 for all three bit sizes; density scans incomplete at
        24 and 28 bits. HEUR-ISO-1 null-decay validation impossible.
    - id: RT-045-D4
      disposition: OPEN
      detail: >-
        c_smart=8 upper-bound justification remains questionable (O(log^2 p)
        estimate 2.4x above C_special_smart). Direct timing validation not performed.

  narrowest_supported_statement: >-
    Under seed 2026080347 on a dirty worktree (run_bounded_toy.py modified),
    a BFS exploration of the ordinary 2-isogeny graph at three toy prime fields
    (p in {2097169, 33554467, 536870923}) found no special-curve endpoints
    across 21 sampled unplanted curves at bits in {20, 24, 28} (rho_special=0.0
    for all three; bits=24 and bits=28 scans incomplete). Planted path control
    found a MOV-type path (j=415112 -> j=1032394, embedding_degree=1) starting
    from a special curve (R5-FIX-PRESERVE-M1 violated). Cost formula for a Smart
    anomalous curve at bits=20 gives C_special_smart=157, matched_rho=779, ratio
    0.202 < 0.7 (arithmetic only; no path demonstrated). No transfer-gate
    measurement. H-IT-001 stays specified. Toy tier only.

