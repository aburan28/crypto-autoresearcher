  blocking_objections:
    - id: RT-047-B1
      subject: >-
        R5-FIX-PRESERVE-M1 breach: planted path control has special start.
        CTRL-PLANTED-PATH-POS reports start_det.embedding_degree=1 and
        any_special=true, directly contradicting the amendment requirement
        start_j_speciality: nonspecial. Required acceptance-criteria fields
        (path_is_reverse_of_planted, pullback_evaluated, relation_reverified)
        are absent from the planted_path_control output. FIX-3 is invoked in
        the run note as justification but does not appear in the frozen
        amendment PA-IT-001-v3-rc45-repair-5.yaml. An Executor-defined informal
        fix overriding a formal amendment repair is a protocol deviation.
        CTRL-TRANSFER-NONSPECIAL is not present in the run output at all.
      cheapest_falsification: >-
        Direct inspection of raw-result.json planted_path_control.start_det:
        embedding_degree=1 and any_special=true (already confirmed). Text search
        of PA-IT-001-v3-rc45-repair-5.yaml for "FIX-3" confirms absence (done).
      contract_clauses_violated:
        - "R5-FIX-PRESERVE-M1 acceptance criteria: start_j_speciality: nonspecial"
        - "R5-FIX-PRESERVE-M1 acceptance criteria: path_is_reverse_of_planted: true"
        - "R5-FIX-PRESERVE-M1 acceptance criteria: pullback_evaluated: true"

    - id: RT-047-B2
      subject: >-
        Non-reserved run-id, mode deviation, and BATCH-047 provenance gap.
        The amendment reserves only RUN-IT-001-rc45-smoke and
        RUN-IT-001-rc45-measure; RUN-IT-001-rc47 is not reserved. Mode
        smoke_then_measure is not one of the two frozen modes (smoke / measure).
        The amendment states "any other entrypoint or CLI flag change is
        contract_invalid." Additionally, manifest.contract_in_force records
        batch_open_decision: DEC-20260803-003, but DEC-20260803-003 opens
        BATCH-046, not BATCH-047. No distinct decision authorizing BATCH-047
        is cited in the run artifacts.
      cheapest_falsification: >-
        Verify reserved_run_ids in amendment (confirms rc45-smoke/measure only).
        Locate a ledger decision with batch_id: BATCH-047 and decision: open —
        absent, confirming the provenance gap.

    - id: RT-047-B3
      subject: >-
        Dirty worktree: run_bounded_toy.py was modified (M entry in git status)
        at runtime. The implementation state cannot be confirmed to match any
        committed version, preventing reproducibility.
      cheapest_falsification: >-
        git diff HEAD experiments/EXP-IT-001/implementation/run_bounded_toy.py
        to identify changes.

  non_blocking_notes:
    - id: RT-047-D1
      subject: >-
        R_xfer < 1.0 for unplanted curves are censored BFS overhead ratios
        (correctly documented, not transfer findings). mode=censorship_lower_bound,
        certificate_pass=false, C_special=0, C_pullback=0 for all 21 curves.
        n_unplanted_R_xfer_lt_0.7_with_cert=0. No overclaiming.
    - id: RT-047-D2
      subject: >-
        BF1 is arithmetic certificate verification only; no end-to-end Smart
        anomalous transfer demonstrated. planted_path_recovered=true is for
        the MOV-type control only (p=2097169, j=415112), not for the anomalous
        arm (p=771853, j=823). Downstream citations must not conflate these.
    - id: RT-047-D3
      subject: >-
        Sensitivity analysis "10x calibrated constant" for anomalous arm is
        misleading: it tests c_smart=8 raised to c=10 (25% increase), not a
        genuine 10x test. At 10x C_special_smart (=1570), R_xfer=2.015 > 0.7
        (fails gate). The label should read "c_smart raised from 8 to 10."
    - id: RT-047-D4
      subject: >-
        c_smart=8 upper-bound claim questionable. Smart p-adic lift costs
        O(log^2 p) approx 383 ops at 20 bits (Karatsuba), 2.4x above
        C_special_smart=157. Direct timing validation needed.
    - id: RT-047-D5
      subject: >-
        Density null-decay untestable. rho_special=0.0 for all three bit sizes.
        Bits=24 resource_exhaustion at 78% coverage; bits=28 only 0.16% sample.
        HEUR-ISO-1 null-decay validation impossible from this run.
    - id: RT-047-D6
      subject: >-
        Null packaging gate structurally correct but untested against real
        candidates (vacuous because rho_special=0 so no real false-positive
        candidate could arise). Gate logic is correct; real-world discriminating
        power was not exercised.
    - id: RT-047-D7
      subject: >-
        Minor cost accounting issues: C_path_reported=268 vs
        C_path_recomputed=1072 (4x) in BF2 null plant; float vs ceiling
        denominator inconsistency in planted path R_xfer (0.11066 vs 0.11059).
        Neither affects the < 0.7 finding.

  carryovers_addressed:
    - id: RT-045-D1
      disposition: CLOSED
      detail: >-
        Amendment uses properly YAML-quoted strings for colon-bearing acceptance
