  # ===================================================================
  # T-A. THE CASE FOR EXECUTING, STATED AT FULL STRENGTH AND NOT SOFTENED
  # This section is written BEFORE the ruling sections, as the card requires.
  # ===================================================================
  the_case_for_executing_at_full_strength:
    preamble: >-
      The Coordinator recorded seven items for running (F-1 to F-7) and answered
      them all. Three of the seven are answered correctly and completely - F-1,
      F-3 and F-7 are disposed of by the observation that what the run would
      test is the derivation and the driver rather than the hypothesis. Two are
      answered by procedure that the Coordinator itself has already demonstrated
      it can vary - F-6 and the RC-14 gate. Two are answered too quickly - F-2
      and F-4. Below are four items the Coordinator did not record, of which the
      first two are stronger than any of F-1 to F-7, and one structural gap in
      the ruling's logic. THIS SESSION BELIEVES THE CASE FOR EXECUTING IS
      MATERIALLY STRONGER THAN THE AMENDMENT STATES, AND STILL LOSES.
    F_8_the_predecessor_of_arm_E_prime_measured_29:
      severity: THE STRONGEST ITEM FOR EXECUTING, AND THE ONE THE RULING DOES NOT RECORD
      statement: >-
        Arm E-prime is not a new construction. It is EXP-STR-003's arm E with
        two boolean conditions deleted. EXP-STR-003 arm E is specified at
        experiments/EXP-STR-003/specification.yaml lines 238-256 as the identical
        random factor base, the identical base row list, and the identical
        POSITIONAL sigma-orbit closure, appended "if sum(r_shift) > 0 AND
        r_shift is not already in the list - mirroring, term for term, the filter
        and dedup at harness/endomorphism_la.py lines 303-304". That arm MEASURED
        alpha = 11, 1, 0, 29 across its four instances, as recorded in
        ledger/decisions/DEC-20260727-009.yaml instrument_question_disposition.
        The ruling asserts that the SAME arm, with those two conditions removed,
        is derivably alpha <= 1 at every declared cell and every B. That is a
        swing from a measured 29 to a derived 1 attributed entirely to two
        boolean conditions, and it has never been checked on a machine.
      why_it_is_strong: >-
        It supplies exactly what a derivation-versus-measurement dispute needs
        and what F-5 only gestures at - an ARCHIVED NUMBER from the nearest
        neighbour of the object under derivation, and it is 29, not 1. The
        derivation explains the difference (D-5 and EV-STR-003 observation O-4 -
        a single suppressed emission shifts the phase of the whole downstream
        stream, so triple boundaries stop coinciding with sigma-block
        boundaries). But that explanation is itself the unchecked step. Under
        route (a) - the reviewer's own recommendation, which requires no
        amendment and consumes no cycle - executing arm E-prime is a sharp
        pre-registered test of it at ten cells for zero marginal budget.
      what_would_have_falsified_the_ruling: >-
        A measured alpha(E-prime) >= 2 at any declared cell. Per
        docs/claims-and-verification.md that would be a COUNTEREXAMPLE
        CERTIFICATE, the strongest refutation-artifact class, against the exact
        limb the ruling rests on.
    F_9_the_arm_E_prime_limb_is_not_unconditional:
      severity: THE RULING'S OWN LOAD-BEARING SENTENCE IS FALSE AS WRITTEN
      statement: >-
        A-2, R-7 and L-5 of the amendment state that the arm E-prime limb is
        unconditional and that this is why the ruling rests on it - L-5 declares
        only the arm A-prime limb conditional, on D-3. The E-prime limb is
        conditional on at least two further hypotheses, neither declared and
        neither verified.
      conditionality_1_the_square_branch_requires_a_base_row_supply: >-
        The derivation is of the SQUARE branch of _measure_displacement_rank
        (harness/endomorphism_la.py lines 233-242), taken only when the emitted
        row count is at least B. The contract's own
        matched_base_row_budget.why_this_value states that a shortfall of TWO
        base rows loses that branch. In the rectangular branch (lines 226-232)
        the returned quantity is rank(M Z - M), whose rows are
        sigma . M[i] - M[i] over the WHOLE emitted list; for a sigma-closed list
        those are sigma r - r, sigma^2 r - sigma r, r - sigma^2 r per triple, two
        independent per base row, so the quantity generically becomes Theta(B)
        rather than <= 1. The E-prime bound therefore holds only if arm E-prime
        collects at least R_base(B) - 1 base rows at every cell. NOTHING HAS
        MEASURED THAT.
      conditionality_2_no_driver_exists: >-
        Arm E-prime's closure - "emit r, sigma . r and sigma . (sigma . r)
        unconditionally" - IS NOT COMMITTED CODE. It appears nowhere in
        harness/endomorphism_la.py. Arm A-prime's closure is the committed block
        WITH TWO CONDITIONS DELETED, which is also not committed code. The
        derivation is therefore an argument about a DRIVER THAT HAS NEVER BEEN
        WRITTEN, and the only checks of driver fidelity the contract has are
        IV-8 (suppression count zero) and IV-10 (row reconstruction), both of
        which fire only on execution. The amendment's L-2 - "THIS IS A DERIVATION
        ABOUT COMMITTED PYTHON FUNCTIONS ON DECLARED PARAMETER CELLS" - is
        inaccurate for the closure limb of both arms, and derivation_note.md
        D-8 item 4 already declares that limb CONDITIONAL. The ruling drops that
        declared conditionality when it reaches for the E-prime limb.
      consequence: >-
        The ruling rests on a limb it calls unconditional and which carries at
        least two undeclared conditions, one of them larger than the D-3
        condition it does declare. That is a real defect in the ruling's basis
        statement and it must be repaired in DEC-20260729-004 whatever the
        disposition.
    F_10_the_marginal_cost_of_executing_is_zero_and_the_option_has_no_substitute:
      statement: >-
        7500 seconds and 28 run identifiers are already budgeted, already
        authorised in the campaign's arithmetic, and have no alternative use.
        The batch closes having spent zero curve compute. campaign_budget
        .maximum_batches is 14 and is consumed at this close; a fifteenth batch
        requires explicit user authorization and is not self-granted. So the
        derivation the whole ruling rests on may go permanently unchecked
        against a machine, and the option to check it expires at this close and
        cannot be repurchased from within the program.
      why_it_is_not_merely_a_budget_argument: >-
        The information gained by executing is not about H-STR-002. It is about
        THE RULING. A ruling that stands down the only compute in the batch on
        the strength of an unexecuted derivation, at the last authorized batch,
        with the budget for checking it already paid, is precisely the shape of
        claim AGENTS.md asks to be adversarially checked - and the cheapest
        available check is the one being released.
    F_11_the_ruling_answers_a_different_question_from_the_one_it_decides:
      severity: A STRUCTURAL GAP IN THE RULING'S LOGIC
      statement: >-
        The amendment's title question, its single-sentence justification, and
        A-3 through A-7 all answer "CAN AN AMENDMENT MAKE EXP-STR-004 CAPABLE OF
        SUPPORTING H-STR-002". The disposition it takes answers a different
        question - "SHOULD EXP-STR-004 BE EXECUTED". Those are not the same
        question. Route (a), which the TASK-20260729-042 reviewer itself
        recommended and which the amendment records verbatim at F-1, requires NO
        amendment, edits NO frozen file, consumes NO cycle, adds NO arm, adds NO
        statistic and therefore passes QUEUE-AMEND-20260729-003's direction test
        trivially, so A-5 and A-6 do not reach it at all. Under route (a) the
        value of executing is not support for H-STR-002 - nobody claims it is -
        it is checking the derivation and checking D-3 at B = 192 and B = 193.
        THE AMENDMENT CONCEDES EXACTLY THIS AT R-7 AND THEN DOES NOT WEIGH IT
        AGAINST A BUDGET THAT HAS NO OTHER USE.
    where_the_recorded_case_FOR_is_overstated_and_this_cuts_against_running:
      F_2_overstates_what_the_pre_flight_cleared: >-
        F-2 says "THE ONE MEASURED HAZARD IS CLEARED" and "the infrastructure is
        specified and paid for". The TASK-20260729-043 receipt's
        O_2_VERIFIED_BY_THE_DISPATCHING_SESSION block measures the DISTINCT
        TARGET limb only - target_period 183 for CURVE-J12S1 against a maximum
        R_base of 66, and 3468 for CURVE-J16S3 against R_base(97) = 34. Base
        rows are HITS, not distinct targets. No archived hit rate exists for a
        phi-invariant factor base at any declared B, the contract's own
        collection_quota.why_a_floor_of_60 chooses Q = 60 expressly because "at
        the smallest rungs the committed quota leaves too few candidate targets
        to make R_base(B) base rows probable" and does so WITHOUT MEASURING IT,
        and a shortfall at any cell excludes that cell from F-3, F-4 and F-5 and
        forces verdict `incomplete`. The receipt's own
        `the_hazard_is_still_real` says as much. The hazard is half cleared.
      F_4_is_answered_more_cheaply_than_by_28_runs: >-
        F-4's live content is that D-3 - the hypothesis that
        _build_phi_invariant_factor_base returns exactly B elements in whole
        orbit layout - is unverified at B = 192 and B = 193, where the builder
        returns a SHORT list if it cannot find enough whole orbits inside
        j < 50*B + 1000 (harness/endomorphism_la.py line 95). That is true and
        it is the one genuinely unchecked fact about COMMITTED code in the whole
        design. It does not require the ladder, a driver, a closure, a relation,
        or an alpha. See required_controls.RT35-CTRL-1.

  # ===================================================================
  # THIS SESSION'S OWN DERIVATION, FROM PRIMARY SOURCE
  # ===================================================================
  independent_rederivation:
    what_was_read: >-
      harness/endomorphism_la.py lines 85-114, 122-244 and 247-353 DIRECTLY, not
      as quoted in derivation_note.md or in the TASK-20260729-042 review. This
      matters for the correlation question the dispatching message raises: the
      amendment's own how_many_independent_derivations_exist records that its
      third derivation worked "by hand from the source text QUOTED IN THOSE
      ARTIFACTS". A transcription error in derivation #1 would propagate to #3.
      This session read the primary file and can report that it does not.
    step_1_the_square_branch_identity: >-
      Z[i][j] = 1 exactly when j = sigma(i) (lines 173-183). (Z M)[i][j] =
      M[sigma(i)][j]. Z_inv[k][j] = 1 exactly when k = sigma(j) (lines 199-203),
      so (A Z_inv)[i][j] = A[i][sigma(j)]. Hence
      (Z M Z_inv)[i][j] = M[sigma(i)][sigma(j)] and
      D[i][j] = M[i][j] - M[sigma(i)][sigma(j)] mod n. CONFIRMED.
    step_2_the_rows_at_a_residue_one_cell: >-
      With B = 3q + 1, c_j = r_j[3q], S_1 r_j = sigma . r_j with coordinate 3q
      zeroed and S_2 r_j = sigma^2 . r_j with coordinate 3q zeroed, and using
      sigma(3q) = 3q so that sigma . e_{3q} = e_{3q} - I compute
      D[3j] = c_j e_{3q}, D[3j+1] = 0, D[3j+2] = -c_j e_{3q}, and
      D[3q] = r_q - sigma^{-1} . r_q whose 3q coordinate is
      r_q[3q] - r_q[3q] = 0. CONFIRMED, in the note's own sign convention, and
      confirmed again in the equivalent convention sigma . D[i] = sigma . M[i] -
      M[sigma(i)], which has the same rank because it is right multiplication of
      the whole matrix by one permutation.
    step_3_the_ranks: >-
      All tail-induced rows lie in the one-dimensional span of e_{3q}; the one
      remaining row is orthogonal to that coordinate and so is independent of it
      when nonzero. Hence
      alpha(A-prime) = [exists j < q with r_j[3q] = 1] + [sigma . r_q != r_q],
      in {0, 1, 2}, and for arm E-prime, whose closure is the genuine
      permutation sigma^s so that every complete triple contributes a zero row,
      alpha(E-prime) = [sigma . r'_q != r'_q] in {0, 1}. At every residue-zero
      cell both are 0 exactly. CONFIRMED - I REPRODUCE THE ROW FORMS AND BOTH
      BOUNDS INDEPENDENTLY AND FROM PRIMARY SOURCE. This is a fifth derivation
      and it AGREES.
    scope_of_my_agreement: >-
      I agree with the mathematics GIVEN the driver behaves as the contract
      specifies, GIVEN the square branch is taken, and for arm A-prime GIVEN
      D-3. I do not agree that the E-prime limb is unconditional; see
      the_case_for_executing_at_full_strength.F_9.

  # ===================================================================
  # T-B. THE FIFTH DISCRIMINATING STATISTIC
  # ===================================================================
  discriminating_statistic_ruling:
    question: >-
      Is there a fifth statistic, inside DEC-20260727-009's two arms and nothing
      else, that O-1 does not trivialise, that does not measure an uncontested
      premise, and that the contract does not forbid?
    answer: >-
      NO. I could not name one, and I record the candidates I examined and
      rejected rather than asserting the negative. I concur with the
      Coordinator's C-1 to C-4 dispositions on their stated grounds, and I add
      four further candidates below, all of which fail.
    C_5_displacement_rank_under_the_MULTIPLICATIVE_phi_image_map_as_the_shift: >-
      REJECTED, AND IT COLLAPSES INTO C-2. Replacing sigma by the multiplicative
      map x -> zeta3 . x as the shift operator makes the instrument
      endomorphism-sensitive by construction - but only because that map is a
      permutation of factor-base indices IF AND ONLY IF the factor base is
      closed under multiplication by zeta3, which is the DEFINITION of the
      phi-invariant builder's output. The statistic would return "the factor
      base is phi-invariant", a property built in by construction and contested
      by nobody. Same failure class as C-2, at one further remove.
    C_6_per_eigenspace_block_ranks_of_the_closed_matrix: >-
      REJECTED. Because 3 divides n - 1 at all four archived instances, a
      sigma-equivariant matrix block-diagonalises over the three eigenspaces of
      the order-3 permutation and one could report the three per-block ranks
      instead of one rank. It does not discriminate: BOTH arms are
      sigma-equivariant by construction after the closure, both consume
      R_base(B) base rows of identical support size m, and the supports carry no
      orbit correlation in either arm - a decomposition of a target into m
      summands has no reason to prefer summands inside one phi-orbit. The
      statistic is a refinement of C-3 and inherits C-3's blindness to
      genuineness and C-3's adverse archived prior (DEC-20260727-009 R3, rank
      deficiency 4, 6, 30, 67 in the phi arm against 0, 0, 0, 1).
    C_7_the_truncation_loss_rate_of_the_phi_image_map: >-
      REJECTED AS NOT TARGET-CLASS AND AS TAIL-DETERMINED. The fraction of
      phi-images that fall outside the truncated factor base is a real quantity
      about how much C_3 structure survives a size-B budget. At B mod 3 = 1 it
      is supported on the single index 3q and equals #{j < q : r_j[3q] = 1} over
      R_base, at B mod 3 = 0 it is identically zero, and it is fully derivable
      from artifacts that exist before any alpha. It measures the committed
      builder's truncation, not the endomorphism.
    C_8_row_weight_distribution_of_the_closed_matrix: >-
      REJECTED. Arm A-prime's appended rows lose a coordinate exactly when a
      summand's phi-image leaves the truncated base; arm E-prime's never do. So
      the arms differ in mean row weight at residue-one cells and not at all at
      residue-zero cells. That is the same tail artifact as C-7 wearing a
      different name, and at the seven cells where the closures coincide the
      statistic is identically equal in the two arms.
    what_I_found_instead_and_it_is_not_a_discriminator_but_a_stronger_negative:
      title: THE VERDICT IS DETERMINED BY A FREE CHOICE OF NULL CONVENTION, IN BOTH DIRECTIONS
      derivation: >-
        The ruling's decisive move is that the matched control has alpha <= 1.
        But arm E-prime's closure is a POSITIONAL permutation while arm
        A-prime's is the committed MULTIPLICATIVE map, and the spec says so
        itself at arms.E-prime
        .the_two_closures_do_not_coincide_at_residue_one_and_this_is_declared.
        Consider instead the other candidate null, which the spec names and
        discards - the committed MULTIPLICATIVE closure with the filter off,
        applied to arm E-prime's random factor base. The spec asserts that "a
        random factor base is almost never closed under multiplication by zeta3
        and the closure would emit empty rows at every cell". Take that
        assertion and run my step-1 identity on the resulting stream
        [r'_0, 0, 0, r'_1, 0, 0, ...]: D[3j] = r'_j, D[3j+1] = 0,
        D[3j+2] = -sigma^{-1} . r'_j, D[3q] = r'_q - sigma^{-1} . r'_q. The rank
        is generically 2q = 2(B-1)/3, i.e. Theta(B), NOT O(1).
      consequence: >-
        Three defensible-looking null conventions give three different answers on
        the same instance: no closure gives alpha of order B (the EV-STR-001
        baseline H-STR-002's prediction actually cites); the committed
        multiplicative closure with the filter off gives alpha about 2B/3; the
        positional sigma closure gives alpha <= 1. UNDER TWO OF THE THREE,
        H-STR-002's FIRST PREDICTION READS AS CONFIRMED WITH A LARGE SEPARATION.
        Under the third it reads as vacuous. Nothing in the mathematics of the
        curve selects among them.
      why_this_STRENGTHENS_the_stand_down_rather_than_breaking_it: >-
        Because it makes the instrument worse than vacuous. The ruling says the
        criterion carries no information because a null object satisfies it
        identically. The stronger and more accurate statement is that alpha on a
        closure-generated row list is a FUNCTION OF THE CLOSURE CONVENTION IN
        BOTH ARMS, and the convention is a free parameter of the experiment that
        determines the sign of the reported separation. An instrument whose
        verdict is chosen by the experimenter's convention cannot be repaired by
        an amendment, and cannot be rescued by running it.
      what_it_does_NOT_license: >-
        It does not license running the multiplicative null. That arm appends
        literal all-zero rows; its Theta(B) is an artifact of counting zero rows
        as rows, it is degenerate exactly as the spec says, and it would be a
        THIRD ARM, which DEC-20260727-009's "two arms and nothing else"
        forbids and which RULE-BATCH014-SCOPE ruled constrains the arms.

  # ===================================================================
  # THE RULING ON THE RULING
  # ===================================================================
  ruling_on_the_stand_down:
    verdict: >-
      THE STAND-DOWN STANDS, ON A NARROWED AND PARTLY DIFFERENT GROUND. I could
      not break its conclusion. I break three of its stated grounds, and I
      dissent from its central reason.
    the_ground_that_survives_adversarial_pressure: >-
      NOT "no amendment can create a supporting outcome", which is true but
      answers a question the disposition does not turn on (F-11). The ground
      that survives is this: THE ONLY DISCRIMINATING POWER EXECUTION WOULD HAVE
      OVER THE DERIVATION IS THE POWER TO DETECT A DRIVER BUG. Arm E-prime's
      bound follows from the CONTRACT'S OWN DEFINITION of arm E-prime's closure
      together with sigma^3 = id; arm A-prime's follows from the same plus D-3
      and D-4(b). A driver that implements the specification reproduces both
      bounds by construction. So a run can contradict the derivation only if the
      driver departs from the specification, or if the builder or the collector
      fails to supply what D-3 and the square branch assume. TWENTY-EIGHT CURVE
      RUNS AT THE LAST AUTHORIZED BATCH IS AN EXPENSIVE SOFTWARE TEST, AND THE
      TWO SUPPLY FACTS IT WOULD ESTABLISH ARE REACHABLE FOR SECONDS WITHOUT IT
      (RT35-CTRL-1, RT35-CTRL-2).
    what_would_have_made_me_rule_the_other_way: >-
      Recorded so it is checkable rather than rhetorical. If arm E-prime's bound
      had depended on any property of the CURVE, the FACTOR BASE, or the
      COLLECTOR rather than on the contract's own closure definition, execution
      would have had genuine discriminating power and I would have recommended
      running. It does not. And if the two supply facts (D-3 at B = 192/193; the
      base-row count at every cell) had been reachable ONLY by running the full
      ladder, the marginal-cost argument of F-10 would have carried. They are
      not.
    a_favourable_ladder_is_not_support:
      the_ruling_this_card_exists_for: >-
        IF alpha <= 3 HOLDS AT EVERY NAMED LADDER CELL FOR ARM A-PRIME AND ARM
        E-PRIME MATCHES IT, THAT IS A PROPERTY OF THE CLOSURE CONVENTION AND NOT
        SUPPORT FOR H-STR-002. I rule this in terms, and I rule it from a
        derivation I performed myself from primary source rather than by
        deferring to the Coordinator's. The bound is imposed by closing the row
        list under the operator with respect to which the rank is then measured;
        it is reproduced exactly by an arm with zero endomorphism content; and
        at the seven residue-zero cells it is alpha = 0 EXACTLY for both arms,
        for a reason - the coincidence of triple boundaries with sigma-block
        boundaries - that mentions neither phi nor the curve.
      and_the_converse_is_also_not_evidence: >-
        A ladder that came out UNfavourably would not be evidence against
        H-STR-002 either. Under the derivation, alpha > 2 at any cell means the
        driver, the builder or the collector failed. Both directions are
        instrument findings. That symmetry is the definition of a
        non-diagnostic instrument and it is the honest content of this batch.
    defects_in_the_ruling_that_must_be_repaired_in_DEC_20260729_004:
      RT35-D1_the_E_prime_limb_is_called_unconditional_and_is_not: >-
        A-2, R-7 and L-5. See F-9. DEC-20260729-004 must declare the E-prime
        limb conditional on (i) an arm-E-prime base-row supply of at least
        R_base(B) - 1 at every cell, without which the RECTANGULAR branch is
        taken and the measured quantity becomes rank(M Z - M), generically
        Theta(B); and (ii) a driver implementing an unconditional positional
        sigma closure, which is not committed code and has never been written.
        derivation_note.md D-8 item 4 already declares (ii) conditional; the
        ruling drops that declaration at the exact point it leans on the limb.
      RT35-D2_upper_bounds_are_compared_as_if_they_were_values: >-
        R-2 states that "THE ARM WITH ZERO ENDOMORPHISM CONTENT SATISFIES THE
        HYPOTHESIS'S OWN BOUND MORE STRONGLY THAN THE PHI ARM". alpha(A-prime)
        <= 2 and alpha(E-prime) <= 1 are DERIVED UPPER BOUNDS, not realised
        values. Cell by cell the realised values can run the other way -
        alpha(A-prime) = 0 with alpha(E-prime) = 1 occurs whenever no arm-A-prime
        base row touches the tail and sigma . r_q = r_q while
        sigma . r'_q != r'_q. The derived statement is that BOTH arms satisfy
        alpha <= 3 at every declared cell, so F-5 cannot discriminate. "More
        strongly" is not derived and is a bound-for-value substitution of the
        same family as the cardinality-not-identity failures this campaign
        tracks. Correct the sentence; the conclusion does not need it.
      RT35-D3_the_reserved_KN_FIND_010_boundary_sentence_is_FALSE_AS_WRITTEN: >-
        THIS IS THE MOST IMPORTANT DEFECT IN THE AMENDMENT AND IT IS ARCHIVED-
        NUMBER CHECKABLE. knowledge_promotion.not_warranted reserves this
        sentence verbatim for a later /curate-knowledge session - "closing a
        relation row list under a shift operator makes the displacement rank
        with respect to that operator O(1) BY CONSTRUCTION, independently of the
        factor base, so a displacement rank measured on a shift-closed row list
        cannot be evidence of endomorphism structure". The qualifier
        UNCONDITIONALLY is missing, and without it the sentence is falsified by
        this program's own archived numbers - EXP-STR-003 arm E closed its row
        list under exactly this shift operator, with the line-303/304 filter and
        dedup ENABLED, and measured alpha = 11, 1, 0, 29
        (ledger/decisions/DEC-20260727-009.yaml
        instrument_question_disposition). A shift-closed row list measured 29.
        The sentence is true only for an UNCONDITIONAL closure, where triple
        boundaries coincide with sigma-block boundaries; suppression breaks that
        coincidence, which is precisely what D-5 and EV-STR-003 observation O-4
        say. DEC-20260729-004 must carry the sentence WITH the unconditionality
        qualifier and with the arm-E counter-numbers beside it, and KN-FIND-010
        must not be promoted in the present wording under any amendment.
      RT35-D4_F_2_overstates_the_cleared_hazard: >-
        See where_the_recorded_case_FOR_is_overstated. The pre-flight cleared
        the distinct-target limb of O-2 and not the hit-supply limb. If
        DEC-20260729-004 carries F-2 verbatim it must carry that qualification
        with it, otherwise a successor reads "the infrastructure is specified
        and paid for" as a supply guarantee it is not.
      RT35-D5_the_identifier_defect_is_a_DANGLING_REFERENCE_not_a_DUPLICATION: >-
        SUP-BATCH014-C calls the RT-20260729-036 discrepancy "a THIRD identifier
        defect" and sets it beside "two duplicated immutable identifiers already
        on record in this campaign". Those are different defect classes and the
        count groups unlike members. From a read-only scan of the whole worktree
        this session finds - RT-20260729-034 occurs in the TASK-20260729-042
        task_card, in the dispatch_queue, in BOTH TASK-20260729-042 review
        artifacts and in ledger/goals/GOAL-ECDLP-001.yaml; RT-20260729-035
        occurs only in this card, the queue and the goal record, i.e. it is
        reserved and free for this report; RT-20260729-036 occurs in EXACTLY TWO
        places, the TASK-20260729-043 receipt that cites it and the queue block
        that records the defect, AND NOWHERE ELSE. So RT-20260729-036 is not a
        duplicate of anything: it is a PHANTOM, an identifier that names no
        report. That is a milder and differently-shaped defect than a
        duplication and DEC-20260729-004 should say which it is. I did not run
        tools/allocate_id.py; this is a grep, and TASK-20260729-046's D5 is the
        allocator check.

  # ===================================================================
  # THE SIX RULINGS THE DISPATCHING MESSAGE ASKS FOR
  # ===================================================================
  rulings:
    premature_closure_under_the_inventor_protocol:
      question: >-
        Is standing down the run premature closure under docs/inventor-protocol.md
        - and does a DERIVED null object make the closure sounder than a
        MEASURED one, or weaker?
      ruling: >-
        NOT PREMATURE CLOSURE, AND THE DERIVED NULL IS SOUNDER IN KIND AND
        WEAKER IN WARRANT. Both halves matter and the ruling is the conjunction.
      closure_standard_limb: >-
        Section 4 requires a named obstruction, an argument and forward
        guidance. The ruling supplies all three - the obstruction is that alpha
        on a shift-closed row list is fixed by the closure; the argument is the
        row computation, now independently reproduced five times; the guidance
        is S_1 to S_5. It is expressly not a closure of the lane and claims no
        obstruction theorem. The inventor protocol's own anti-pattern - "we
        screened N mechanisms and all were rejected", a statement about the
        search rather than the problem - is not what this is.
      controls_before_belief_limb: >-
        Section 3's second move requires the identical measurement against a
        null object BEFORE a signal is believed. It is an obligation on
        BELIEVING A SIGNAL, not an obligation on PRODUCING ONE. Here no signal
        exists and none is believed, so the rule is satisfied trivially by
        standing down. Reading it as compelling execution inverts it.
      sounder_in_kind: >-
        A measured null is a finite sample - ten cells, two curves, one seed per
        cell. A derived null is universal over cells, seeds, curves and B for
        the construction it covers, and it CANNOT be confounded by a nuisance
        variable, which is the exact failure EV-STR-003 observation O-4 found in
        the measured null of arm E. On the specific defect the protocol exists
        to prevent, the derivation is strictly stronger evidence than the
        measurement would have been.
      weaker_in_warrant: >-
        Nothing was observed, so an error in the argument is invisible. This
        program has already shipped one confident derivation-flavoured claim
        that was provably wrong - DEC-20260727-009's next action states alpha
        equal to the number of rows touching the truncated tail, and O-1 proves
        that false - and one feasibility-table certification that F-5 CAN FIRE,
        which is false for the same reason. Two wrong arguments in this same
        lineage, both of which passed review. That is the correct prior on the
        third.
      how_the_two_halves_resolve: >-
        A derived null is an admissible basis for not running IF AND ONLY IF
        every hypothesis it rests on is either checked, or declared conditional
        and cheaply checkable. For arm A-prime the amendment does that (L-5
        declares D-3). For arm E-prime it does not (RT35-D1). So the closure is
        sound in form and defective in its declared basis, and the repair is a
        declaration plus RT35-CTRL-1 and RT35-CTRL-2, not 28 runs.
      correlation_risk_among_the_derivations:
        assessment: >-
          REAL, AND SMALLER THAN IT LOOKS AFTER THIS SESSION. The amendment
          counts three independent derivations and records that its own, the
          third, worked "by hand from the source text QUOTED IN THOSE
          ARTIFACTS". That is not independence from #1 and #2 on the one failure
          mode that matters most - a mis-transcription of harness source into
          the derivation note would propagate silently into #3. #2 states it
          re-derived from committed source before reading the note, which is the
          right protocol; #1 is the note itself.
        what_this_session_adds: >-
          A derivation from the PRIMARY FILE, harness/endomorphism_la.py, read
          directly and not through any quotation, by a session that shares no
          lineage with #1, #2 or #3. It reproduces the row forms and both bounds.
          The transcription-correlation channel is therefore closed for the row
          computation specifically.
        what_remains_correlated: >-
          All five derivations share the same READING of what the driver will
          do, because the driver does not exist. No amount of independent
          derivation from source can check a program that has not been written.
          THAT residual correlation is not reducible by adding a sixth
          derivation, and TASK-20260729-046's fourth pass will not reduce it
          either. It is reducible only by execution or by declaring the limb
          conditional. This report recommends the declaration.
    reject_scoped_availability:
      on_H_STR_002: >-
        NOT AVAILABLE. I concur with the Coordinator without reservation, and on
        three independent grounds. (i) docs/task-lifecycle.md section 9 defines
        reject_scoped as "valid evidence contradicts the exact tested
        prediction"; there is NO evidence, valid or otherwise - zero runs exist.
        (ii) DEC-20260727-009 already ruled reject_scoped FORBIDDEN on a
        strictly stronger record (twenty committed runs under a contract frozen
        before execution, independently reproduced); a fortiori it is
        unavailable on zero runs. (iii) MOST IMPORTANTLY, the derivation does
        not contradict the prediction. H-STR-002's first prediction is
        "alpha <= r = 3 ... clearly below the random-baseline alpha ~ B". The
        derivation says alpha <= 2 for arm A-prime - THE BOUND LIMB IS
        SATISFIED. What fails is the comparative limb, and it fails against a
        null the derivation itself constructs. NOT-DISCRIMINATING IS NOT
        CONTRADICTED, and converting the one into the other is exactly how a
        bounded instrument ablation becomes an impossibility claim.
      on_the_narrow_diagnosticity_proposition_T_C: >-
        NOT AVAILABLE EITHER, on two grounds. (i) VOCABULARY. The section 9
        labels attach to a hypothesis or an experiment under Coordinator review.
        "A displacement rank measured on a shift-closed row list is evidence of
        phi-invariance of the factor base" is a free-floating instrument
        proposition with no ledger identifier, no mechanism block, no test
        boundary and no falsification criteria. There is nothing for the label
        to attach to, and inventing an object to reject would be worse than
        leaving it unlabelled. (ii) ARTIFACT CLASS. Even granting the object,
        the strongest artifact archived is a DERIVATION, rank 2 of the three
        classes in docs/claims-and-verification.md. No counterexample
        certificate exists and none can exist without execution. Under this
        program's own precedent - DEC-20260727-009's refutation_artifact block,
        which took `weaken` plus replication because the archived class was
        `empirical_only` - a derivation supports a scoped narrowing recorded IN
        A DECISION, not a rejection.
      what_IS_available_and_where_it_belongs: >-
        A NARROWING, recorded in DEC-20260729-004's own named block exactly as
        the amendment's ground_3 specifies, with proof_status `derivation`,
        proof_refs naming both committed artifacts by path, scope stated as the
        two declared closure conventions and B mod 3 in {0, 1} on the committed
        harness, the A-prime limb declared conditional on D-3, THE E-PRIME LIMB
        DECLARED CONDITIONAL ON SUPPLY AND DRIVER FIDELITY (RT35-D1), and never
        `proved`.
    does_the_ruling_cross_DEC_20260727_009s_standing_prohibition:
      the_prohibition: >-
        "Whether phi_alpha is an artifact of the row-insertion rule is OPEN and
        may be asserted in neither direction by any downstream record."
        (ledger/decisions/DEC-20260727-009.yaml instrument_question_disposition.)
      ruling: >-
        THE RULING DOES NOT CROSS IT. THE RESERVED KN-FIND-010 SENTENCE DOES.
        The Coordinator's distinction is sound and I verified it against source
        rather than accepting it.
      why_the_distinction_holds: >-
        `phi_alpha` names the quantity produced by the AS-COMMITTED pipeline,
        whose append block at harness/endomorphism_la.py lines 303-304 skips an
        emission when the shifted row is all-zero or already present. A skip
        desynchronises triple boundaries from sigma-block boundaries, and D-6's
        entire argument - "triple boundaries and sigma-block boundaries
        coincide" - fails the moment one emission is skipped. The row
        computation is then simply not available. The derivation therefore
        reaches a DIFFERENT INSTRUMENT from the one the prohibition names, and
        it says so at what_the_derivation_does_NOT_reach.
      the_empirical_confirmation_that_the_two_are_genuinely_different: >-
        This is not a formal dodge. EXP-STR-003 arm E is the FILTERED version of
        arm E-prime and measured alpha = 11, 1, 0, 29 where the derivation gives
        <= 1 for the unfiltered version. The filtered and unfiltered instruments
        demonstrably behave differently, by a factor of at least 29 at one
        archived instance. That is the strongest possible evidence that the
        derivation cannot be extended across the filter, and it is the reason
        the prohibition survives untouched.
      where_the_crossing_actually_occurs: >-
        In the reserved boundary sentence (RT35-D3), which drops the
        unconditionality qualifier and reads as a general statement about "a
        displacement rank measured on a shift-closed row list". A reader
        applying that sentence to EV-STR-002 and EV-STR-003 concludes that
        phi_alpha IS an artifact of the row-insertion rule, which is precisely
        the prohibited assertion. The prohibition is crossed by the artifact
        reserved for promotion, not by the ruling - and it is crossed by an
        omitted adverb.
      binding_consequence: >-
        DEC-20260729-004 must restate the boundary sentence with the
        UNCONDITIONAL qualifier and must repeat the prohibition beside it in the
        same block. KN-FIND-010 remains uncreated. If TASK-20260729-048 promotes
        the sentence in its present wording under a further QUEUE-AMEND, that
        promotion crosses the prohibition and this report objects to it in
        advance.
    agents_rule_12:
      does_it_fire_on_the_refine_decision: >-
        NO. AGENTS.md rule 12 fires on a claim proposed as a breakthrough, a
        closure result, or a contradiction of established evidence. A decision
        to redesign an experiment because a pre-data derivation shows the
        instrument cannot bear on the claim is none of the three. No exponent
        moves, no lane closes, no obstruction theorem is claimed, no evidence
        record is contradicted, and the amendment says all of this in terms.
      where_it_DOES_fire_and_is_therefore_declined:
        - >-
          A `reject_scoped` on the narrow diagnosticity proposition. That would
          settle in one direction a question DEC-20260727-009 committed as OPEN,
          which is a contradiction of an established disposition. Rule 12 fires,
          `review-breakthrough` at `max` is unavailable on this branch and may
          not be degraded, THEREFORE THE CLAIM IS NOT MADE. This report does not
          make it and recommends that DEC-20260729-004 does not either.
        - >-
          Promotion of the reserved boundary sentence in its present, general,
          unqualified wording as a KN-FIND. In that form it is a general closure
          claim about an instrument family and it contradicts the archived
          arm-E numbers (RT35-D3). Rule 12 fires; the policy is unavailable;
          THE CLAIM IS NOT MADE and KN-FIND-010 stays uncreated.
      where_it_does_NOT_fire_although_it_is_close: >-
        SUP-BATCH014-A, which supersedes DEC-20260727-009's next-action phrasing
        "alpha equal to the number of rows touching the truncated tail" as
        provably wrong. That is a correction of a PHRASING IN A DECISION'S
        NEXT-ACTION FIELD; it changes no measured number, no evidence record and
        no disposition, and it is recorded as a supersession and never as an
        edit. Rule 12 does not fire on it. It is close enough that the safe
        disposition is the one already chosen - supersede, never refute
        DEC-20260727-009 as a whole.
    O_1_as_evidence_about_H_STR_002_itself:
      the_rulings_scoping_is_RIGHT_IN_DIRECTION: >-
        O-1 reaches H-STR-002's FIRST prediction and does not reach the
        mechanism. Both halves are correct. The mechanism - phi is an
        automorphism, phi(R) is a genuine relation on a phi-invariant base, the
        closed system is C_3-equivariant - is untouched in either direction by
        anything in this batch, and no arm of EXP-STR-004 would have touched it
        either.
      where_it_OVER_reaches: >-
        "The asserted separation does not exist" is a claim about the world. The
        derived claim is narrower - the separation is not exhibited by this
        instrument, and its SIGN is set by a free choice of null convention:
        no closure gives alpha of order B (the EV-STR-001 baseline the
        prediction actually cites), the committed multiplicative closure with
        the filter off on a random base gives about 2B/3 by the same row
        computation, and the positional sigma closure gives <= 1. THE
        COMPARISON HAS NO CANONICAL REFERENT. That is a stronger criticism of
        H-STR-002's first prediction than the ruling makes, and it is the
        accurate one. Recording the over-reaching form invites a successor to
        cite DEC-20260729-004 for a negative fact it does not establish.
      where_it_UNDER_reaches: >-
        The ruling says O-1 bears on the cost claim in no way. It bears on the
        cost claim's INPUT, though on no cost measurement. H-STR-002's third
        prediction is model_ops = alpha^2 * B * ceil(log2 B), and the committed
        harness computes exactly that at harness/endomorphism_la.py lines
        472-475 together with a cost_ratio against 2*B^2. So the alpha this
        instrument produces flows directly into a cost number by committed code.
        If that alpha is closure-determined, the cost number it produces is
        manufactured. DEC-20260729-004 should say, in terms - NO COST QUANTITY
        IS MEASURED OR DERIVED BY THIS BATCH, AND NO ALPHA MEASURED ON A
        SHIFT-CLOSED ROW LIST MAY EVER BE SUBSTITUTED INTO H-STR-002's COST
        MODEL. Note also that the derivation predicts alpha = 0 at seven of the
        fourteen cells, and RT-CM-2 records that the model returns cost ZERO at
        alpha = 0, masked by a -1 sentinel at line 472. Half the ladder sits in
        the model's degenerate region.
      does_it_belong_in_the_ledger_now: >-
        YES, and the amendment's ordering argument is correct and is verified:
        the derivation is committed at 7c9aa579 and the exact-rank strengthening
        at 0cea73f9, both ancestors of HEAD, both with unchanged blobs, and
        neither EV-STR-004 nor DEC-20260729-004 exists at HEAD. The precedence
        of the derivation over any future table is a property of commit order
        that any reader can check, and this session checked it.
    the_successor_experiment:
      is_S_1_to_S_5_the_right_successor: >-
        YES IN SHAPE, AND INCOMPLETE IN THREE PLACES. S-1 (assemble a real
        system with right-hand sides) is correct and is the unrepaired
        DEC-20260727-009 R3. S-2 (use the C_3 block decomposition directly
        rather than measuring a rank) is correct AND HAS A BETTER REASON THAN
        THE ONE GIVEN - see cost_model_challenges.RT35-CM-A. S-4 (density
        honestly, with the whole EV-STR-001 range) is correct. S-5 (pre-register
        the ceiling at r = 3 and state that a constant is not target-class under
        rule A1) is correct and is the single most important line in the
        amendment.
      gap_1_the_baseline_named_in_S_3_is_the_wrong_one: >-
        S-3 requires "a matched Pollard rho baseline". PLAIN rho is not the
        closest specialized baseline for a curve with an order-3 automorphism.
        The published specialized baseline is rho WITH the automorphism -
        Wiener-Zuccherato, Duursma-Gaudry-Morain, Gallant-Lambert-Vanstone -
        which already takes the sqrt(r) = sqrt(3) speedup on the rho side, just
        as the automorphism-quotient factor base already takes the factor r = 3
        on the index-calculus side. S-5 names those authors for the LA ceiling
        and S-3 does not carry them into the baseline. A successor that
        baselines against plain rho will credit the C_3 structure with a saving
        the specialized baseline already has. REQUIRE A MATCHED
        rho-WITH-AUTOMORPHISM BASELINE, NOT PLAIN RHO, AND SAY SO IN THE
        SPECIFICATION.
      gap_2_memory_is_absent_from_S_1_TO_S_5: >-
        RT-CM-4 is open and records that memory is absent on both sides -
        Wiedemann's whole point is O(B) memory at O(B^2) operations, and the
        structured side needs a generator representation plus a transform.
        Neither is costed anywhere in S-1 to S-5. Add S-6: MEASURE MEMORY BESIDE
        TIME ON BOTH SIDES AND REPORT A TIME-MEMORY INTERPOLATION, so that a
        memory-constrained baseline can be checked for dominance.
      gap_3_total_expected_cost_is_not_per_attempt_cost: >-
        Add S-7. DEC-20260727-009 R3 archives the phi arm's rank deficiency as
        4, 6, 30 and 67 against the control's 0, 0, 0 and 1. A rank-deficient
        block system needs more relations, so the SUCCESS PROBABILITY of one
        assembled system is below 1 and the honest quantity is per-attempt cost
        times inverse success probability, never per-attempt cost alone.
        PRE-REGISTER THAT THE DEFICIENCY d(B) MUST BE o(B/3) FOR THE FACTOR-3
        SAVING TO SURVIVE AT ALL, AND MEASURE d(B) ALONG THE LADDER. The
        archived four points already grow faster than B does across those
        instances, which is an adverse prior recorded before the successor is
        designed rather than discovered inside it.
      is_the_no_exhibited_mechanism_statement_fair: >-
        YES, AND IT IS IF ANYTHING UNDERSTATED. H-STR-002's super-constant limb
        is a saving of B/(alpha^2 log B). Exact C_3 equivariance delivers three
        blocks of size B/3, i.e. a factor of 3. Nothing in this lineage connects
        the two, and RT-CM-1 - OPEN since BATCH-007 - names why: alpha^2 * B *
        log B is the superfast-solver cost for a TOEPLITZ-LIKE matrix, whose
        displacement operator is the NILPOTENT lower shift; here Z is a
        permutation of ORDER 3, small displacement rank means near-C_3-
        equivariance, and that is a different structure with no superfast
        solver attached. The gap between "factor 3" and "factor B/(9 log B)" is
        the entire claim. One caution on wording: "HAS NO EXHIBITED MECHANISM"
        is inside the ceiling because it is a statement about the state of the
        record, but it is one word from crossing it. DEC-20260729-004 should
        write "no mechanism for the super-constant limb has been exhibited in
        this lineage; whether one exists is open and is asserted in neither
        direction."
      what_S_5s_ceiling_must_also_say: >-
        RT-CM-3, also OPEN, measures relation collection at 7.0x, 6.1x, 20.6x
        and 78.7x the ENTIRE modelled linear algebra at B = 27, 55, 204 and 397,
        with the ratio growing in B. So even a perfect factor-3 LA saving is
        invisible at every size this lineage has ever reached. The successor's
        pre-registered ceiling should be that stronger statement, not the
        LA-only one.

  # ===================================================================
  # THE FIVE TASK_CARD QUESTIONS, ANSWERED FOR THE RE-POINTED OBJECT
  # ===================================================================
  task_card_questions:
    Q1_does_anything_licence_a_statement_about_the_instrument_question: >-
      IT LICENSES ONE STATEMENT AND LEAVES THE CARD'S QUESTION UNADJUDICATED.
      Licensed - for the UNCONDITIONAL closure of either declared arm, on the
      committed harness, at B mod 3 in {0, 1}, the displacement rank is fixed by
      the closure convention and carries no information about phi-invariance of
      the factor base. Not licensed and NOT ASSERTED IN EITHER DIRECTION - the
      same statement about the as-committed FILTERED closure, which is the
      instrument DEC-20260727-009 left UNADJUDICATED and whose archived arm-E
      numbers 11, 1, 0, 29 show it behaves differently. EXP-STR-003 left the
      question open; this batch leaves it open too, about a different instrument
      than the one it adjudicates.
    Q2_is_arm_E_prime_a_MATCHED_control: >-
      NO, AND THE PATTERN OF THE MISMATCH IS THE FINDING. At the seven
      residue-one cells the arms differ in TWO variables - the factor base AND
      the closure index map - which the spec declares in advance at
      arms.E-prime.the_two_closures_do_not_coincide_at_residue_one_and_this_is
      _declared, and which contradicts CTRL-3's flat assertion that "the factor
      base and the closure rule are the only differences" only in emphasis, not
      in substance. At the seven residue-zero cells the closures DO coincide as
      index maps (D-4a) and the control IS matched - and there the derivation
      gives alpha = 0 exactly for BOTH arms. SO THE CONTROL IS MATCHED EXACTLY
      WHERE IT IS UNINFORMATIVE AND UNMATCHED EXACTLY WHERE A DIFFERENCE COULD
      HAVE APPEARED. That is a cleaner statement of the instrument's problem
      than "the null satisfies the bound", and it is not in the amendment.
    Q3_does_anything_licence_a_statement_about_the_MECHANISM: >-
      NO, AND NO RECORD IN THIS BATCH IS DRIFTING TOWARD ONE. I checked the
      contract, the derivation note, both receipts and the amendment. The
      closest approach is derivation_note.md D-8 item 6's derivational aside
      that at a residue-zero cell arm A-prime's appended rows WOULD be genuine
      relations - and it is immediately fenced ("not measured and not claimed as
      evidence", certificate kind `none` for every appended row, "NO RECORD MAY
      DESCRIBE EITHER ARM'S MATRIX AS A MATRIX OF RELATIONS"). The fence holds.
      The one drift risk is the reserved boundary sentence of RT35-D3, and that
      drifts toward an INSTRUMENT claim, not a mechanism claim.
    Q4_does_the_ladder_licence_any_statement_about_independence_of_B: >-
      NO. Not from ten cells at two curves with B <= 193, and N-2 of the queue
      forbids it outright in both directions. The derivation DOES give bounds
      that do not depend on B - and that is the point: the B-independence is
      IMPOSED BY THE CLOSURE, is derivable without touching a curve, and is
      shared by an arm with zero endomorphism content. THE STRONGEST COUNTER-
      READING OF A FAVOURABLE LADDER is therefore that its B-independence is
      exactly as informative as the statement "a permutation of order three has
      order three", dressed as a sixteen-fold sweep. A reader who saw
      alpha in {0, 1, 2} at every B from 12 to 193 would read confirmation of
      alpha = O(1); DEC-20260726-006 is this program's own precedent for that
      reading being recorded as `supported`.
    Q5_the_strongest_checkable_refutation_artifact_and_its_sufficiency:
      strongest_class_this_result_admits: >-
        DERIVATION, rank 2 of the three classes in
        docs/claims-and-verification.md. A COUNTEREXAMPLE CERTIFICATE - rank 1 -
        IS NOT AVAILABLE AND CANNOT BE MADE AVAILABLE WITHOUT EXECUTION. That is
        the honest price of the stand-down and it should be recorded as a price
        and not as a tie.
      is_the_TASK_20260729_041_derivation_note_SUFFICIENT_for_DEC_20260729_004: >-
        NOT ON ITS OWN, ON TWO COUNTS. (i) The note stops at alpha <= |MIS| and
        explicitly declines to derive rank(D) - D-8 item 1. The exact-rank
        result the whole ruling turns on lives in the TASK-20260729-042 review
        at commit 0cea73f9, NOT in the note at 7c9aa579. DEC-20260729-004 must
        cite BOTH artifacts by path, as the amendment already specifies. (ii)
        Neither artifact declares the arm E-prime limb's dependence on base-row
        supply or on driver fidelity (RT35-D1), and the decision must add both
        declarations itself rather than inherit them. WITH BOTH REPAIRS THE
        ARTIFACT BASIS IS SUFFICIENT FOR A `refine` AND FOR A SCOPED NARROWING,
        AND FOR NOTHING STRONGER.

