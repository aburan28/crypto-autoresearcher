  required_controls:
    - id: RT35-CTRL-1
      name: Factor-base structure probe at B = 192 and B = 193 only. NO arms, NO closure, NO alpha.
      what_it_does: >-
        Generate CURVE-J12S1 by the committed path, call
        _build_phi_invariant_factor_base(inst, 192, zeta3) and
        (inst, 193, zeta3), and assert len(F) == B together with
        F[3j+k] == pow(zeta3, k, p) * F[3j] % p for every complete block. That
        is CTRL-4 of the frozen contract, executed alone.
      what_it_resolves: >-
        D-3 - THE ONE UNVERIFIED FACT ABOUT COMMITTED CODE THAT THE RULING'S ARM
        A-PRIME LIMB DEPENDS ON, and the live content of F-4 and of the
        amendment's own conceded R-7.
      cost: >-
        Seconds of curve compute at 12 field bits. No driver, no relation
        collection, no rank computation, no ladder, and no dependence on any of
        the 28 released run identifiers. Two output lines.
      resume_condition: >-
        A successor batch with any curve-compute authorization at all, including
        one far smaller than the released 7500 seconds.
      should_it_be_dispatched: >-
        YES. THIS IS THE ONE CONTROL I WOULD RUN. It converts the conceded price
        of the stand-down (R-7) into a discharged obligation for a rounding
        error of the released budget, and it is the cheapest artifact that could
        contradict the ruling.
    - id: RT35-CTRL-2
      name: Base-row supply probe at every declared cell. Collection only, no closure and no alpha.
      what_it_does: >-
        For each declared cell and each arm, call _collect_relations(inst, fb, m,
        Q(B)) with include_phi_orbits=False and report only len(relations)
        against R_base(B) and against the measured distinct-target count.
      what_it_resolves: >-
        The undeclared supply condition of RT35-D1 for BOTH arms, and the
        unmeasured hit-supply limb of O-2 that F-2 overstates as cleared. It
        determines whether the square branch would have been taken at all.
      cost: >-
        A small fraction of the released TASK-20260729-044 budget - relation
        collection only, no rank computation, which is the expensive part at
        B = 192 and 193.
      resume_condition: Same as RT35-CTRL-1, and it should be run in the same probe.
      should_it_be_dispatched: >-
        YES, JOINTLY WITH RT35-CTRL-1. Together they discharge every fact about
        COMMITTED code that the derivation assumes, and they leave only driver
        fidelity - which is a software-test question, not a research question.
    - id: RT35-CTRL-3
      name: Matched rho-with-automorphism baseline at the successor's instances.
      what_it_does: >-
        Solve the identical instances with rho exploiting the order-3
        automorphism, with independently re-verified discrete_log certificates,
        beside plain rho.
      what_it_resolves: >-
        The successor's baseline gap (rulings.the_successor_experiment.gap_1)
        and EV-STR-003's open boundary that no archived baseline exists at the
        two larger instances.
      cost: Small at toy scale; the committed rho baselines already exist at two of four instances.
      resume_condition: Freezing of the successor cost experiment.
      should_it_be_dispatched: >-
        YES, AS PART OF THE SUCCESSOR AND NOT BEFORE. It has no object until a
        structured solve exists to compare against.
    - id: RT35-CTRL-4
      name: NOT RECOMMENDED - the 28-run EXP-STR-004 ladder as frozen.
      why_not: >-
        Named here because the card forbids naming a control I would not run,
        and this is the one I would NOT run, stated so that my recommendation is
        falsifiable. Its discriminating power over the derivation is confined to
        detecting a departure of an unwritten driver from a specification that
        implies the derivation. RT35-CTRL-1 and RT35-CTRL-2 recover the two
        committed-code facts for a fraction of the cost. I record against myself
        that if RT35-CTRL-1 or RT35-CTRL-2 FAILS, this judgement is wrong and
        the ladder becomes the right instrument again.

  counterexample_or_mutation:
    cheapest_discriminating_control: RT35-CTRL-1 jointly with RT35-CTRL-2.
    the_counterexample_that_would_break_the_ruling: >-
      A measured alpha(E-prime) >= 2 at any declared cell under a driver whose
      suppression count is zero and whose square branch was taken. Per
      docs/claims-and-verification.md that is a counterexample certificate
      against the exact limb the ruling rests on. It is NOT AVAILABLE without
      execution and this report records that as the stand-down's real price.
    the_cheapest_mutation_that_exposes_the_convention_dependence: >-
      No mutation is needed and none should be run. The row computation at
      discriminating_statistic_ruling.what_I_found_instead already shows, on
      paper, that swapping the null's closure from positional sigma to the
      committed multiplicative map moves the null's alpha from <= 1 to about
      2B/3 and flips the reported verdict. That is a derivation, costs nothing,
      and would be a forbidden third arm if run.

  baseline_comparison:
    pollard_rho: >-
      Rho SOLVES these instances with verified certificates at 24 group
      operations for n = 733 and 156 for n = 3061 (committed runs cited in the
      BATCH-007 red-team baseline block), and 237 and 1104 group operations
      reproduced there for n = 41617 and n = 158071. Against that, EXP-STR-004
      would have recovered NO discrete logarithm, assembled NO linear system,
      and emitted certificate kind `none` for every appended row in both arms.
      NOTHING IN THIS BATCH BEATS, APPROACHES, OR IS COMMENSURABLE WITH RHO.
    bsgs: >-
      Not applicable and not attempted: no solve exists on either side to
      compare. BSGS at these n is likewise trivially cheaper than any structured
      pipeline this lineage has built.
    closest_specialized_baseline: >-
      For an order-3 automorphism the specialized baselines are the
      automorphism-quotient index calculus and rho-with-automorphism
      (Wiener-Zuccherato; Duursma-Gaudry-Morain; Gallant-Lambert-Vanstone). Both
      are ALREADY PUBLISHED and both already capture the entire structural
      saving available here - a factor of r = 3 on the linear algebra and
      sqrt(3) on rho. DEC-20260727-009 R5 archives that factor 3 as the one
      reproducible effect in this lineage. So the specialized baseline dominates
      everything this batch could have produced, at every parameter size, and
      the ruling's S-5 ceiling states this correctly.
    van_oorschot_wiener_style_interpolation: >-
      NOT APPLICABLE HERE AND SAID SO RATHER THAN OMITTED. There is no
      time-memory claim to interpolate against, because there is no time claim
      and no memory claim anywhere in this lineage - RT-CM-4 remains open. It
      becomes mandatory for the successor (rulings.the_successor_experiment
      .gap_2), where a parallel-collision-search baseline with memory w and its
      matched structured-solve memory must both be reported.

  heuristic_challenges:
    - id: RT35-H1
      challenge: >-
        H-STR-002 states no numbered heuristic at all. Its `assumptions` block
        carries four unnumbered items, and the load-bearing one - "The
        displacement rank alpha is measured with respect to the phi-shift
        operator ... and is O(r) = O(1)" - assumes its own conclusion as an
        assumption. Under docs/target-result-profile.md every heuristic must be
        explicit, numbered, given a rigorous bound plus a classical distribution
        theorem, and paired with a falsification condition. NONE OF THAT EXISTS
        HERE, and the successor must not inherit the omission.
    - id: RT35-H2
      challenge: >-
        RANDOM-MODEL TRANSFER, IN THE INVERTED DIRECTION THAT MATTERS HERE. The
        usual failure is treating a structured object as a random one. This
        lineage's failure is the mirror image: the "random baseline alpha ~ B"
        is quoted from EV-STR-001 as though it were a property of random factor
        bases, when it is a property of a row list that was never closed. The
        cheapest computation that exposes it is the four-line row computation in
        this report, which needs no curve.
    - id: RT35-H3
      challenge: >-
        SCALE HONESTY. Everything here is B <= 193 at 12 and 16 field bits on
        two deterministically generated toy curves. AGENTS.md rule 7 forbids
        presenting it as crypto-scale validation, the claim tier is `toy`, and
        under docs/target-result-profile.md rule A1 nothing in this batch is
        target-class and no exponent moves in either direction. Recorded here
        because the exemplar profile's demand - validate the heuristic AT the
        claimed scale, via a correspondence trick if direct sampling is
        infeasible - has no counterpart anywhere in this lineage and the
        successor will not supply one either.

  cost_model_challenges:
    - id: RT35-CM-A
      challenge: >-
        THE DEEPEST PROBLEM IN H-STR-002 IS NOT MEASURABLE BY ANY alpha, AND IT
        IS ALREADY ON RECORD AS OPEN. RT-CM-1 (BATCH-007) states it: alpha^2 * B
        * log B is the superfast-solver cost for a TOEPLITZ-LIKE matrix, whose
        displacement operator is built from the NILPOTENT lower shift; here Z is
        a permutation of ORDER 3, so a small rank(M - Z M Z^{-1}) means M is
        nearly C_3-EQUIVARIANT, which block-diagonalises into three blocks and
        buys a factor of three, with no superfast solver attached. I concur and
        add the consequence for the successor: THIS IS WHY S-2's instruction to
        use the block decomposition directly rather than to measure a rank is
        right. The reason is not that rank-measuring is inconvenient; it is that
        the rank has no solver attached to it.
    - id: RT35-CM-B
      challenge: >-
        PER-ATTEMPT COST IS NOT TOTAL EXPECTED COST. Nothing in this lineage has
        ever multiplied a per-system cost by an inverse success probability. The
        archived rank deficiencies 4, 6, 30, 67 in the phi arm against 0, 0, 0,
        1 in the control are exactly an inverse-success-probability term, and
        they grow across the instances. See
        rulings.the_successor_experiment.gap_3.
    - id: RT35-CM-C
      challenge: >-
        COLLECTION DOMINATES AND IS NOT CHARGED. RT-CM-3, open, measures
        collection at 7.0x, 6.1x, 20.6x and 78.7x the entire modelled linear
        algebra at B = 27, 55, 204 and 397, growing in B. Any LA saving, real or
        artifactual, is invisible at every size reached. RT-CM-6's unit caveat
        applies and the gaps survive it.
    - id: RT35-CM-D
      challenge: >-
        MEMORY IS ABSENT ON BOTH SIDES (RT-CM-4, open) and the model prices the
        perfectly-structured case at ZERO operations (RT-CM-2, open). RT-CM-1
        through RT-CM-6 REMAIN OPEN AND UNTOUCHED BY THIS BATCH, AND NO RECORD
        OF THIS BATCH MAY DESCRIBE ANY OF THEM AS ADDRESSED, TESTED OR SETTLED.
    - id: RT35-CM-E
      challenge: >-
        THE RELATION-DENSITY PENALTY IS QUOTED CORRECTLY NOWHERE EXCEPT AS A
        RANGE, AND THIS REPORT QUOTES IT AS ONE. EV-STR-001's yield penalty is
        THE RANGE 17.5x TO 4128.6x, WHICH GROWS WITH SIZE AND SUPERLINEARLY IN
        m, and it is never 17.5x alone. H-STR-002's second assumption - that the
        penalty does not exceed B/alpha - has never been tested, and at
        alpha <= 2 with B = 193 the admissible ceiling B/alpha is about 97,
        which the upper end of the archived range exceeds by more than an order
        of magnitude on the construction where it was measured. NOT A FINDING
        ABOUT THE PHI CONSTRUCTION - the archived range is from the AP
        construction - BUT THE SUCCESSOR MUST MEASURE IT AND MUST NOT ASSUME IT
        SMALL.

