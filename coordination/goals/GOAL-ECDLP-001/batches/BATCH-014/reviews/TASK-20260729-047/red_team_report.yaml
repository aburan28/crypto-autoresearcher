  dissent:
    recorded_plainly_and_unsoftened: >-
      I DISSENT FROM THE RULING'S CENTRAL REASON WHILE CONCURRING IN ITS
      CONCLUSION. The reason given is that the arm with zero endomorphism
      content satisfies H-STR-002's bound more strongly, so a criterion a null
      object satisfies identically carries no information. That reason is
      convention-bound and, stated at that generality, is wrong: it holds for
      the positional-sigma null the contract chose and fails for the equally
      constructible multiplicative null, under which the same arm has alpha
      about 2B/3 and H-STR-002's first prediction reads as CONFIRMED with a
      large separation. The correct reason is stronger and different - ALPHA ON
      A CLOSURE-GENERATED ROW LIST IS A FUNCTION OF THE CLOSURE CONVENTION IN
      BOTH ARMS, THE CONVENTION IS A FREE PARAMETER OF THE EXPERIMENT, AND IT
      DETERMINES THE SIGN OF THE REPORTED SEPARATION. An instrument like that
      cannot be repaired by an amendment and cannot be rescued by running it,
      which is why the conclusion survives the loss of its stated reason.
    second_dissent: >-
      I DISSENT FROM THE CLAIM THAT THE ARM E-PRIME LIMB IS UNCONDITIONAL. It is
      conditional on a base-row supply that nothing has measured and on a driver
