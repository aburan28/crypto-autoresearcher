# ---------------------------------------------------------------------------
# Explicit discharge checks (card-mandated)
# ---------------------------------------------------------------------------
discharge_checks:
  B-1:
    prior_severity: BLOCKING
    status: NOT_DISCHARGED
    a_prime_hole_closed: true
    a_prime_hole_detail: >-
      v2 adds verdict label prediction_failed with reason code
      F1_A_prime_fires_F4_silent for complete valid measurements where F-1 fires
      for A-prime and F-4 is silent. That specific unlabeled outcome from
      RT-20260729-034 is now labeled.
    completeness_claim_holds: false
    completeness_claim_detail: >-
      v2 asserts that on a fully measured valid set every F-1/F-4 matrix outcome
      maps to exactly one named label. Exhaustive enumeration of the reachable
      (F1_A, F1_E, F4, dir_E_gt_A) outcomes under the written rule leaves one
      unlabeled cell: F-1 silent for A-prime, F-1 fires for E-prime, F-4 silent.
      Confirmed requires F-1 silent on BOTH arms; prediction_failed requires
      F-1 for A-prime; falsified requires some alpha(E)>alpha(A); mixed requires
      F-4's agreement set to be a nonempty proper subset. None applies.
      Reachability: RT-20260729-034 B-2's own B=13 counterexample
      (MIS(A)={0,2}, alpha(A)=1, MIS(E)={12}, alpha(E)=1) with MIS(A)=T(cell)
      yields exactly this cell. Retracting coincide-by-construction (B-2) makes
      the cell acknowledged as reachable; v2 does not label it.
    forces_revise: true

  B-2:
    prior_severity: BLOCKING
    status: DISCHARGED
    detail: >-
      specification.v2.yaml F-1_SET_IDENTITY states P-3 has two limbs that do not
      coincide, that either may fire without the other, cites the B=13
      counterexample, requires summary reporting of both limbs, and RETRACTS the
      v1 "coincide by construction" sentence. feasibility_table.v2.md §5 F-1 row
      mirrors the retraction. No affirmative coincide-by-construction claim
      remains in the v2 binding artifacts. (Immutable v1 blobs retain the old
      sentence by design; Executor binds to v2.)

  M-1:
    prior_severity: MAJOR
    status: DISCHARGED
    detail: >-
      F-4_DIAGNOSTICITY now says F-4 firing means the arms' alpha sets differ on
      a nonempty named subset, points to IL0 in the same interpretive path, and
      forbids paraphrasing as "the phi-invariant factor base is doing something"
      without the truncation caveat. The bare magnet sentence from v1 is gone.
      Remaining "doing something" phrases are the P-3 failure-rationale text and
      the IL0 / feasibility §5.2 prohibitions — not F-4's non-failure oversell.

  scope_mechanism_run_smuggle:
    status: PASS_NO_SMUGGLE
    detail: >-
      Fourteen cells, two arms, R_base=ceil(B/3), PRED-ID-STR, claim ceiling,
      N-1..N-5, and no-mechanism posture unchanged. Amendment binding and
      receipt state no run authorized until TASK-20260730-004 APPROVED.
      derivation_note.md not modified. No third arm, density measurement, or
      mechanism test introduced.

# ---------------------------------------------------------------------------
# Objections (this re-review)
# ---------------------------------------------------------------------------
objections:
  - id: B-1
    severity: BLOCKING
    title: F-1/F-4 matrix completeness still fails for F1(E)-only ∧ F4-silent
    prior_objection: B-1
    status: NOT_DISCHARGED
    detail: >-
      The A-prime-specific hole named in RT-20260729-034 is closed by
      prediction_failed / F1_A_prime_fires_F4_silent. The v2 completeness claim
      is still false. On a complete valid set with F-1(A-prime) silent, F-1(E-prime)
      firing, and F-4 silent, no instrument label applies. That outcome is
      reachable under the derivation and under B-2's counterexample whenever
      MIS(A)=T(cell) while MIS(E)≠MIS(A) with equal alphas. The false v1
      coincide-by-construction claim had papered over this cell; retracting it
      without widening prediction_failed (or adding a sibling reason code) leaves
      the Executor unable to assign exactly one verdict.
    discharge: >-
      Widen prediction_failed (or add a named sibling label/reason code) so every
      complete-valid outcome with F-4 silent and F-1 firing for EITHER arm is
      labeled — e.g. reason codes F1_A_prime_fires_F4_silent and
      F1_E_prime_fires_F4_silent (or a single F1_any_fires_F4_silent). Restate
      that every F-1/F-4 matrix outcome on a complete valid set maps to exactly
      one named label, and verify by enumeration. Under the one-cycle cap this
      discharge cannot be executed in this batch; Coordinator records
      non-execution failure.

  - id: M-2
    severity: MAJOR
    title: falsified and mixed both match when F1_A silent and some alpha(E)>alpha(A)
    prior_objection: null
    status: NEW_CARRIED_WITHOUT_SOLE_REVISE_FORCE
    detail: >-
      When F-1 is silent for A-prime and some cell has alpha(E)>alpha(A), F-4
      necessarily fires. Residue-0 cells keep the agreement set nonempty, so
      mixed's "nonempty proper subset" also matches. The written rule then
      assigns two labels unless an unstated priority (falsified before mixed)
      is assumed. This dual-label defect was already present in v1 and was not
      the named B-1 hole; recorded MAJOR so it is not forgotten. Not used as the
      sole ground for REVISE — B-1's unlabeled cell is sufficient.
    discharge: >-
      State explicit priority or mutually exclusive predicates (e.g. mixed =
      F-4 fires AND NOT falsified). Cannot be repaired in a second amendment
      cycle in this batch.

  - id: M-3
    severity: MAJOR
    title: Matched budget still specification-only (prior M-2 carried)
    prior_objection: M-2
    status: CARRIED
    detail: >-
      DEV-BASE-1 remains; the matched base-row budget is still a driver
      obligation, not a property of the committed _collect_relations source.
      Unchanged by v2; not a reason to reject the mathematical content of
      T(cell); residual implementation risk.
    discharge: >-
      Executor implementation review must verify BASE-row-only counting. No
      further contract text required for that point alone.

  - id: m-1
    severity: MINOR
    title: P-3 vs derivation disagreement remains carried unresolved
    prior_objection: m-1
    status: CARRIED
    detail: >-
      SPEC-STR-004-E / derivation §8.2 tension unchanged and correctly left
      unresolved. Mixed remains the expected instrument verdict under the
      derivation. Not blocking.
    discharge: null

  - id: I-1
    severity: INFORMATIONAL
    title: B-2 and M-1 text repairs are otherwise sound
    detail: >-
      Coincide-by-construction is retracted in both binding v2 artifacts. F-4
      magnet rephrase meets PDC-3. Scope not widened. No run authorization
      smuggled. Derivation note byte-identical to f3e15614.
    discharge: null

  - id: I-2
    severity: INFORMATIONAL
    title: Favourable ladder still not support for H-STR-002
    detail: >-
      Unchanged from RT-20260729-034 I-2. N-2 / F-5 companion / IL1 still forbid
      reading a silent F-5 as mechanism support when E-prime matches.
    discharge: null

