  # ------------------------------------------------------------------
  # D1 - the fourth independent derivation
  # ------------------------------------------------------------------
  D1_fourth_independent_derivation:
    ordering_discipline: >-
      The derivation was written from harness/endomorphism_la.py at this HEAD and
      committed to a scratch file OUTSIDE the repository BEFORE this session
      opened derivation_check.md section 6.2, experiments/EXP-STR-004/derivation_note.md
      or the amendment's the_derivation_the_ruling_rests_on block. Only the
      frozen specification's arms.A-prime and arms.E-prime closure definitions
      were consulted before writing, to learn what the two arms are.
    claim_under_test_as_supplied: >-
      At a cell with B mod 3 = 1 and c = r_j[3q], the displacement rows are
      D[3j] = c e_3q, D[3j+1] = 0, D[3j+2] = minus c e_3q, and
      D[3q] = r_q minus sigma-inverse . r_q with vanishing 3q coordinate, giving
      alpha(A-prime) at most 2 and alpha(E-prime) at most 1.
    square_branch_identity_reproduced: >-
      YES. From lines 173-183, 199-203 and 233-242, Z is a genuine permutation
      matrix for the index map sigma with sigma cubed equal to the identity,
      Z_inv is its true inverse, and
      D[i][j] = M[i][j] minus M[sigma(i)][sigma(j)], i.e.
      D[i] = r_i minus sigma-inverse . r_{sigma(i)}.
    rows_reproduced:
      - >-
        D[3j] = c e_3q. REPRODUCED.
      - >-
        D[3j+1] = 0. REPRODUCED.
      - >-
        D[3j+2] = minus c e_3q. REPRODUCED.
      - >-
        D[3q] = r_q minus sigma-inverse . r_q, whose 3q coordinate vanishes
        because sigma fixes 3q. REPRODUCED.
    bounds_reproduced: >-
      YES, and in the exact-rank form, not only as bounds.
      alpha(A-prime, B mod 3 = 1) equals the indicator that some j less than q
      has r_j[3q] = 1, plus the indicator that sigma . r_q differs from r_q, so
      it lies in the set 0, 1, 2. alpha(E-prime, B mod 3 = 1) equals the
      indicator that sigma . r-prime_q differs from r-prime_q, so it lies in the
      set 0, 1. Both arms give alpha = 0 at every cell with B mod 3 = 0.
    agreement_with_the_three_prior_derivations: >-
      FULL AGREEMENT. This fourth derivation reproduces derivation_check.md
      section 6.2 line for line, including its exact-rank formulas, and
      reproduces the amendment's the_derivation_the_ruling_rests_on statement
      term for term. THERE IS NO DISAGREEMENT TO REPORT, AND NO FINDING THAT
      GOVERNS THE RULING AGAINST IT.
    numeric_confirmation_not_evidence: >-
      The committed _measure_displacement_rank was invoked VERBATIM, outside the
      repository, on synthetic row lists built to each arm's declared closure at
      B in 7, 8, 9, 10, 11, 12, 13, 14, 16, 22 over F_101. At every B mod 3 = 1
      size the predicted D matrix agreed with the actual
      M[i][j] minus M[sigma(i)][sigma(j)] ENTRY BY ENTRY, not merely in rank, and
      the measured ranks were alpha(A-prime) at most 2 and alpha(E-prime) exactly
      1. At B mod 3 = 0 both arms gave 0. This exercises the real Z, Z_inv,
      branch selection and rank routine rather than a re-implementation. IT IS A
      SYNTHETIC INDEX-ONLY CHECK ON INVENTED ROWS. It is not a measurement of any
      cell and it is not evidence about H-STR-002. Detail is in recount_note.md
      sections 1.8 and 1.9.
    two_preconditions_named_and_shown_load_bearing:
      - id: P1
        statement: >-
          The square branch is entered only when the final row count is at least
          the column count. The rectangular branch computes a different quantity
          whose rank grows like twice the number of triples.
        evidence: >-
          Feeding B-1 rows to the committed function raised alpha from 1 to 8, 10
          and 14 at B = 13, 16 and 22. The contract names this precondition at
          IV-5 and in its R_base derivation.
      - id: P2
        statement: >-
          The first B rows must be exactly a concatenation of ordered triples
          aligned to row indices 3j, 3j+1, 3j+2. This is NOT implied by sigma
          cubed being the identity. It is a property of the emission order and of
          the two filters at lines 303 and 304.
        evidence: >-
          Deleting ONE row from an early triple raised alpha from 1 to 8, 10 and
          14 at B = 13, 16 and 22. In arm E-prime the precondition is discharged
          BY CONSTRUCTION under CTRL-2, which disables both filters, and a
          positional closure can never emit a zero row.
    wording_observation_not_a_defect: >-
      The paraphrase that every tail-induced row lies in the one-dimensional span
      of e_3q and therefore alpha is at most 2 elides the second generator.
      D[3q] is generally NOT in the span of e_3q. The correct statement, which is
      what derivation_check.md section 6.2 and the amendment both actually write,
      is that the rows arising from complete triples lie in that span and the
      single orphan row, orthogonal to the 3q coordinate, contributes at most one
      more. THE COMMITTED ARTIFACTS ARE CORRECT AS WRITTEN. Only the informal
      paraphrase supplied to this session was loose, and no record needs
      changing.
    scope_boundary_confirmed_independently: >-
      The bounds are residue-one statements. This session measured alpha(A-prime)
      at 3 and 4 and alpha(E-prime) at 2 at B = 8, 11 and 14, which are
      B mod 3 = 2. The contract's residue_two_is_out_of_scope clause and the
      amendment's what_the_derivation_does_NOT_reach item on B mod 3 = 2 are
      therefore CORRECT AND NECESSARY, and this session confirms no declared cell
      has B mod 3 = 2.

  # ------------------------------------------------------------------
  # D2 - the load-bearing ruling
  # ------------------------------------------------------------------
  D2_is_the_E_prime_limb_independent_of_D_3:
    ruling: >-
      YES. THE ARM E-PRIME LIMB IS INDEPENDENT OF D-3. The ruling does not rest
      on a conditional it declared unconditional, and THE STAND-DOWN RULING
      STANDS on this limb.
    what_D_3_is: >-
      D-3, at derivation_note.md lines 135 to 161, is the claim that
      _build_phi_invariant_factor_base returns a list of length exactly B whose
      complete blocks satisfy F[3j+k] = zeta3^k F[3j]. It feeds D-4, which turns
      the MULTIPLICATIVE closure into an index map, and D-4 is used only by arm
      A-prime.
    route_1_textual: >-
      Arm E-prime's factor base is _build_random_factor_base(inst, B). It never
      calls _build_phi_invariant_factor_base, so D-3's hypothesis has no subject
      on that arm.
    route_2_structural: >-
      The derivation of alpha(E-prime) at most 1 uses only three things. First,
      sigma as built at lines 174-183, which is a function of the column count
      alone and never touches the factor base, zeta3, p or the curve. Second, the
      closure being unconditional and POSITIONAL, so the row stream is exactly r,
      sigma r, sigma squared r. Third, the square-branch identity. No step names
      a factor-base entry.
    route_3_numeric: >-
      The arm E-prime rows used in the numeric confirmation were produced by
      applying sigma positionally to arbitrary random 0/1 vectors. NO FACTOR BASE
      EXISTED IN THAT COMPUTATION AT ALL, and alpha(E-prime) was at most 1 at
      every residue-one size and 0 at every residue-zero size.
    the_independence_is_stronger_than_claimed: >-
      This session derives the general statement alpha(E-prime) at most
      (column count mod 3), hence at most 2, for EVERY column count and WHATEVER
      the factor base is, because sigma fixes exactly that many tail indices,
      every complete triple contributes a zero row, and each tail row contributes
      at most one. Consequently even a SHORT random factor base, which is the
      E-prime-side analogue of the hypothesis D-3 guards, leaves alpha(E-prime)
      at O(1) and leaves the non-discrimination reading intact. OFFERED AS A
      DERIVATION, NEVER AS A PROOF.
    what_the_E_prime_limb_DOES_depend_on: >-
      P1 and P2, and NEITHER IS D-3. P2 is discharged by CTRL-2 by construction.
      P1 is a relation-yield question governed by IV-5 and IV-6, with a margin of
      one base-row shortfall at residue-zero cells and two at residue-one cells.
      This session recomputed R_base(B) = (B+2)//3 + 1 across the fourteen cells
      as 5, 6, 9, 10, 17, 18, 33, 34, 65, 66, 33, 34, 5, 6 and confirms
      rows_final minus B is 3 at every residue-zero cell and 5 at every
      residue-one cell, so all fourteen take the square branch absent a shortfall
      of two or more base rows. This reproduces the derivation_check.md section 7
      table independently.
    consequence_for_the_ruling: >-
      THE RULING STANDS. The arm with zero endomorphism content does satisfy the
      bound for reasons that have nothing to do with the phi-invariant builder,
      the factor base, zeta3 or D-3, so a small alpha at arm A-prime cannot
      discriminate endomorphism content from closure convention. THIS SESSION
      FOUND NO GROUND ON WHICH THE RULING FALLS.

