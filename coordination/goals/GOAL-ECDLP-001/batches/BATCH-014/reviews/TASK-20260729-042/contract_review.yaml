# ---------------------------------------------------------------------------
# Eight card questions (objective)
# ---------------------------------------------------------------------------
eight_questions:
  Q1_T_cell_rule_correct_from_source:
    answer: YES
    detail: >-
      Independently re-derived from harness/endomorphism_la.py (square-branch
      identity at lines 233-242; MIS vanishing criterion; A-prime closure with
      guard off). Closed form matches derivation_note.md §8.1. Synthetic checks
      at B in {7,13,25} agreed. See derivation_check.md.
  Q2_predictions_are_set_identities_no_dispositive_cardinality:
    answer: YES_FOR_P1_P2_P3_P4_AND_F1_F3_F4_F5_CELL_SETS
    detail: >-
      P-1/P-2/P-3 are set identities; P-4 is an inequality falsifier; F-1/F-3/F-4/F-5
      dispose by set equality of named-cell sets (or MIS sets), with
      cardinality_only_agreement recorded as disagreement. F-2 uses |MIS| only as
      a static upper bound, not as a predicted equal count. No criterion was found
      that can be satisfied by a bare count without a member set. (Separate
      BLOCKING defects concern verdict coverage and a false coincidence claim, not
      a cardinality-as-prediction slip.)
  Q3_matched_base_row_budget_function_of_B_alone:
    answer: YES_AS_DRIVER_OBLIGATION
    detail: >-
      Contract declares R_base(cell) = ceil(B/3), identical across both arms, with
      shortfall disposition naming cell and arm. Feasibility arithmetic checked for
      all fourteen cells. Against the committed collection function
      _collect_relations this matched budget is NOT present (it stops on
      len(relations) counting appends) — the contract correctly records DEV-BASE-1
      and requires the driver to reimplement only the stopping condition and the
      two closures. Controlled by construction in the frozen driver spec, not by
      assertion about the unmodified harness loop.
  Q4_mixed_reachable_and_F_evaluability:
    answer: MIXED_REACHABLE_BUT_VERDICT_RULE_HAS_A_HOLE
    detail: >-
      The mixed branch (F-4 agreement set a nonempty proper subset of the fourteen)
      is reachable by construction: Theorem 1 forces agreement at the seven
      B mod 3 == 0 cells, while residue-1 cells may agree or differ. F-1..F-5 can
      fail to be evaluable at a named cell under IV-* / SR-4 exclusion, with
      verdict incomplete — by design. HOWEVER the four-way verdict rule does not
      cover every valid-measurement outcome (see objection B-1).
  Q5_smuggled_third_arm_cost_density_scaling_or_mechanism:
    answer: NO
    detail: >-
      what_this_experiment_is_NOT forbids a third arm; N-1..N-5 and
      interpretation_limits forbid mechanism support, O(1) laws, cost statements,
      and crypto-scale readings. RC-7 declared inapplicable with reason. Density
      penalty bound as EV-STR-001-RANGE (not measured). M-3 forbids a scaling law.
      Budget text about cheap elimination is labelled an operational estimate, not
      a result.
  Q6_sage_verifier_independent_and_invoked_via_binary:
    answer: YES_IN_THE_FROZEN_CONTRACT
    detail: >-
      CTRL-2 requires a separate Sage verifier through the sage binary, never as a
      Python import, reconstructing EllipticCurve(GF(p),[a,b]) with Sage's own
      arithmetic and forbidding import/call/replicate of harness/toycurve.py.
      command_template and implementation_note require
      `sage experiments/EXP-STR-004/driver/verify_certificates.sage`. Host note that
      `import sage` from system python3 fails is recorded as unarchived provenance
      of a design decision, not as evidence. The .sage file itself is not yet
      written (Executor task); the contract's invocation form is correct.
  Q7_numbers_from_unarchived_sources:
    answer: DISCLOSED_HOST_PROBES_ONLY_FOR_GATES
    detail: >-
      Instance parameters are required to be computed, never transcribed.
      Budget basis cites archived EV-STR-003 O-12. The PF-1 expected Sage version
      string and the two inconsistent disk figures are unarchived host probes,
      labelled as such; PF-3 makes the Executor re-measure free space. No hidden
      numeric prediction was found that silently depends on an unarchived probe.
  Q8_budgets_survivable_with_infrastructure_dispositions:
    answer: YES
    detail: >-
      Per-run 900 s, total 7200 s, sage 900 s, 8 GB, 2 MiB/run, 64 MiB tree,
      stop below 5 GiB free — all have SR-*/PF-* dispositions naming infrastructure
      signal. Present volume observation at review time: ~1.3 Ti available (not an
      archived result). Even under the older ~30 GiB / 99% note, the 64 MiB tree
      cap and 5 GiB stop remain coherent. Breaches do not become mathematical
      negatives.

# ---------------------------------------------------------------------------
# Pre-stated verdict labels (BEFORE any measurement)
# ---------------------------------------------------------------------------
pre_stated_verdict_labels:
  basis: >-
    Frozen verdict_rule text in experiments/EXP-STR-004/specification.yaml at
    HEAD f3e15614, with EV-STR-004 and DEC-20260729-004 absent. Labels below are
    what each REALISED branch of that rule should carry. Ladder fields stay
    separate and are never folded into the instrument verdict.
  instrument_verdict_branches:
    instrument_artifact_confirmed:
      when: >-
        F-1 fires at no cell for either arm AND F-4 does not fire (agreement set
        equals the full fourteen-cell set).
      pre_stated_label: instrument_artifact_confirmed
      coordinator_instrument_decision_if_this_branch: >-
        May record instrument-artifact confirmed at toy tier on the fourteen
        cells ONLY. MUST NOT be read as support for H-STR-002's mechanism (N-1,
        IL1). If F-5 is also silent for A-prime while E-prime matches, that is
        still not mechanism support (F-5 companion sentence; N-2).
    instrument_artifact_falsified:
      when: >-
        F-1 does not fire for arm A-prime AND the set of cells with
        alpha(E-prime) > alpha(A-prime) is nonempty and named.
      pre_stated_label: instrument_artifact_falsified
      coordinator_instrument_decision_if_this_branch: >-
        Instrument-artifact proposition falsified at toy tier on the named cells.
        Still not a mechanism verdict on H-STR-002 (N-1).
    mixed:
      when: >-
        The F-4 agreement set is a nonempty proper subset of the fourteen.
      pre_stated_label: mixed
      coordinator_instrument_decision_if_this_branch: inconclusive
      note: >-
        Per contract: under mixed the Coordinator's decision on the instrument
        question is inconclusive. IL0 still binds: an F-4 firing localised to
        B mod 3 == 1 with alpha(A-prime) >= alpha(E-prime) is the truncation
        artifact, not endomorphism content.
    incomplete:
      when: >-
        Any named cell not measured; any stopping rule fired; any certificate
        failed; or a base-row shortfall excluded a cell from comparative criteria.
      pre_stated_label: incomplete
      coordinator_instrument_decision_if_this_branch: inconclusive
  ladder_fields_separate:
    ladder_verdict_F3:
      when_silent: >-
        {cells where alpha(A-prime)=0} equals {L12,L24,L48,L96,L192} as sets.
      when_fires: names the symmetric difference; never folded into instrument verdict
    ladder_verdict_F5_A_prime:
      when_silent: all ten ladder cells have alpha(A-prime) <= 3
      when_fires: names ladder cells with alpha > 3; not mechanism support if E-prime matches
    ladder_verdict_F5_E_prime:
      when_silent: all ten ladder cells have alpha(E-prime) <= 3
      when_fires: names ladder cells with alpha > 3
  uncovered_outcome_named_here_before_measurement:
    description: >-
      Valid measurements at all fourteen cells, F-1 fires for arm A-prime at one
      or more cells, and F-4 does not fire (alphas still match everywhere). None
      of confirmed / falsified / mixed / incomplete applies as written. See
      BLOCKING objection B-1. This pre-statement records the hole rather than
      inventing a fifth label the contract does not contain.

# ---------------------------------------------------------------------------
# Objections (numbered, severity-ranked)
# ---------------------------------------------------------------------------
objections:
  - id: B-1
    severity: BLOCKING
    title: Verdict rule leaves a reachable outcome unlabeled
    detail: >-
      The frozen verdict_rule defines four instrument labels. Confirmed requires
      F-1 silent on both arms. Falsified requires F-1 silent for A-prime.
      Mixed requires the F-4 agreement set to be a nonempty proper subset.
      Incomplete covers shortfall / stop / cert failure / unmeasured cells.
      Consider valid full measurements where MIS(A-prime) ≠ T(cell) at some
      residue-1 cell (F-1 fires for A-prime) while alpha(E-prime)=alpha(A-prime)
      at every cell (F-4 silent). This is reachable under a T(cell) computation
      defect or any common-mode MIS/prediction bug that preserves alpha equality.
      No label applies. EXP-STR-003's defect was an unreachable mixed branch;
      this is the dual defect — a reachable outcome with no branch.
    discharge: >-
      Amend the verdict_rule (versioned protocol_amendment, or revise-before-freeze
      replacement of the contract text) so every outcome of the F-1/F-4 matrix on
      a fully measured valid set maps to exactly one named label. Minimal repair:
      add an explicit branch (e.g. prediction_failed / instrument_unresolved) for
      "F-1 fires for A-prime and F-4 is silent", OR fold that case into incomplete
      with a named reason code, and state the mapping in the contract before any
      run.

  - id: B-2
    severity: BLOCKING
    title: False claim that arm E-prime F-1 and F-4 coincide by construction
    detail: >-
      The contract and feasibility_table.md assert that for arm E-prime, F-1 and
      F-4 coincide by construction, because E-prime's F-1 predicted set is
      MIS(A-prime). That is false. F-1(E) tests MIS(E)=MIS(A) as sets; F-4 tests
      alpha(E)=alpha(A). These predicates diverge under the derivation's own
      account of reachable MIS sets. Concrete synthetic counterexample constructed
      in this review at B=13: MIS(A)={0,2}, alpha(A)=1, MIS(E)={12}, alpha(E)=1 —
      F-1(E) fires, F-4 is silent at that cell. Treating the criteria as the same
      object would mis-score P-3's two limbs and mis-fill summary fields.
    discharge: >-
      Retract or rewrite every "F-1 and F-4 coincide by construction" sentence in
      the specification and feasibility table. State explicitly that P-3 has two
      limbs (MIS-set equality evaluated by F-1 for E-prime; alpha equality
      evaluated by F-4), that either may fire without the other, and that summary
      reporting must record both. Optionally add a named per-cell field for
      MIS(E)△MIS(A) distinct from the alpha inequality direction.

  - id: M-1
    severity: MAJOR
    title: F-4 prose oversells a firing as endomorphism content
    detail: >-
      F-4_DIAGNOSTICITY text says a firing is "the outcome under which the
      phi-invariant factor base is doing something", while interpretation_limits
      IL0 correctly forbids reading a residue-1 A>=E firing as endomorphism
      content (truncation artifact). IL0 governs, but the F-4 sentence is a
      temptation magnet of the same kind that produced DEC-20260726-006.
    discharge: >-
      Rephrase F-4's non-failure sentence to say the arms' alpha sets differ, and
      point to IL0 for interpretation; do not say the phi-invariant factor base is
      "doing something" without the truncation caveat in the same sentence.

  - id: M-2
    severity: MAJOR
    title: Matched budget is not a property of the committed collection source
    detail: >-
      Card completion gate R4 asks that the matched base-row budget be checked
      against the committed source. The committed _collect_relations cannot
      deliver it. The contract's DEV-BASE-1 disclosure is honest, but until the
      driver exists there is no committed artifact that implements the matched
      budget — only a specification of one. This is not a reason to reject the
      design, but it is a residual risk equal to the entire nuisance-variable
      repair.
    discharge: >-
      Not required for mathematical content of T(cell). For freeze confidence:
      keep DEV-BASE-1; require the Executor implementation review to verify the
      driver counts BASE rows only and never tops up; IV-4/IV-5/SR-4 already
      target the failure modes. No contract text change strictly required if B-1
      and B-2 are fixed; listed MAJOR so it is not forgotten at implementation.

  - id: m-1
    severity: MINOR
    title: P-3 vs derivation disagreement is carried unresolved
    detail: >-
      The queue's P-3 predicts MIS/alpha equality at all fourteen cells; the
      derivation (which this review re-derived) says residue-1 cells can differ.
      The contract correctly refuses to silently amend P-3 and records the
      disagreement as a finding. That is procedurally right and makes mixed the
      expected instrument verdict. It is still an unusual confirmatory setup:
      the "prediction" most likely to fail is the discriminating one. Not
      blocking — intentional — but the Coordinator must not later call a
      residue-1-only F-4 firing a surprise.
    discharge: >-
      No text change required. Coordinator records SPEC-STR-004-E / derivation
      §8.2 as known pre-execution tension in the TASK-20260729-043 receipt.

  - id: m-2
    severity: MINOR
    title: Snapshot receipt commit_sha null in-blob
    detail: >-
      Expected under INT-BATCH007-T. Reviewed content is at f3e15614 with the
      four declared paths. Not an evidence defect for this review, but a verifier
      must bind via Git, not via the in-blob null.
    discharge: >-
      None for the contract. Archive binding in the queue must carry the real sha
      (orchestration concern, outside this write_scope).

  - id: I-1
    severity: INFORMATIONAL
    title: PF-1 version pin originates in an unarchived host probe
    detail: >-
      Expected SageMath 10.9 / 2026-05-04 is a disclosed dispatching-session host
      observation, not an archived run. Acceptable as a preflight gate; must not
      be cited as measurement evidence.
    discharge: null

  - id: I-2
    severity: INFORMATIONAL
    title: Favourable ladder is not support for H-STR-002
    detail: >-
      Asked plainly by the card: a favourable outcome (alpha <= 3 at every ladder
      cell for A-prime) does NOT support H-STR-002's mechanism if E-prime does the
      same — and the contract already says so (N-2; F-5 companion sentence; IL1).
      No objection to the contract on this point; recorded so the answer is
      unambiguous in the review artifact.
    discharge: null

  - id: I-3
    severity: INFORMATIONAL
    title: T(cell) re-derivation succeeded
    detail: >-
      Square-branch identity and T(cell) closed form were re-derived from
      harness/endomorphism_la.py and match the frozen derivation note. P-2 is
      fit for pre-registration as a set identity. This informational item exists
      so a REVISE verdict is not misread as a failure of the derivation note.
    discharge: null

objection_counts:
  BLOCKING: 2
  MAJOR: 2
  MINOR: 2
  INFORMATIONAL: 3

