  claim_under_review: >-
    That the frozen EXP-STR-004 contract, its derivation note and its
    feasibility table constitute a sound, falsifiable, executable
    pre-registration adequate to discharge DEFER-BATCH009-001 and to bind the
    next transition of H-STR-002, which currently reads `weakened`.

  # =================================================================
  # 1. VERDICT
  # =================================================================
  verdict: REVISE
  verdict_basis: >-
    The derivation note is CORRECT where it goes, and I re-derived every one of
    its sections D-1 to D-7 independently from the committed source before
    reading them; the closed form for T, including the claim that the 3j+1 row
    provably always vanishes, REPRODUCES EXACTLY. All fourteen cells take the
    square branch. The contract's arithmetic about itself checks out at every
    place I could enumerate members. It is by a wide margin the most disciplined
    contract in this lineage.
    It is nonetheless REVISE on three counts, all cheap to discharge and none
    requiring a redesign. (1) The feasibility table certifies that the headline
    B-independence falsifier F-5 CAN FIRE for arm A-prime by reading a
    CARDINALITY (|T| >= 4) as a MAGNITUDE (alpha > 3); the exact rank is
    derivably at most 2, so F-5 is VACUOUS for both arms and the sixth
    cardinality-not-identity instance is sitting inside the very artifact
    written to prevent the fifth. (2) The feasibility of the two largest cells,
    where the sixteen-fold B lever actually lives, rests on a bound the table
    never computes; the true ceiling on collectable base rows is the period of
    the committed target sequence, is independent of the quota Q, and for 5 of
    the 50 possible derived seeds of CURVE-J12S1 is BELOW R_base(192) and
    R_base(193). (3) The contract enumerates exactly four things the driver may
    reimplement, and then requires a fifth (the target-sequence replay needed to
    attach k to every m=2 certificate), while IV-10's row-equality check cannot
    detect an unfaithful m=3 reimplementation that lands on the same 0/1
    support.
  what_a_REVISE_here_does_not_mean: >-
    It is NOT a rejection of the design, NOT a finding that the derivation is
    wrong, and NOT a claim that the experiment is unrunnable. Every blocking
    item below is discharged by text the Coordinator can record VERBATIM in the
    TASK-20260729-043 receipt and in DEC-20260729-004 as a pre-dispatch
    condition. NO EDIT TO THE FROZEN FILES IS REQUIRED OR RECOMMENDED, and
    editing them would violate the contract's own immutability clause; note
    additionally that experiments/EXP-STR-004/amendments/ is NOT in the
    174-path declared_commit_sets, so an amendment file would itself be an
    undeclared artifact and would need a recorded QUEUE-AMEND.

  # =================================================================
  # 2. OBJECTIONS
  # =================================================================
  objections:
    - id: O-1
      severity: BLOCKING
      title: >-
        F-5 CANNOT FIRE FOR ARM A-PRIME. The feasibility table certifies that it
        can, by reading the cardinality |T| as the magnitude alpha. This is the
        sixth cardinality-not-identity instance.
      where: >-
        feasibility_table.md section 4, "Firing analysis, per arm", arm A-prime
        bullet; and derivation_note.md D-8 item 1, which stops one step short of
        the result that exposes it.
      the_objection: >-
        The table argues "Two base rows touching the tail already give |T| >= 4,
        so alpha > 3 is arithmetically available and F-5 CAN FIRE for arm
        A-prime. It is not a vacuous criterion." That inference is invalid.
        Computing the ROWS of the displacement matrix rather than only their
        vanishing (derivation_check.md section 6.2) gives, at a residue-one
        cell, D[3j] = c e_{3q}, D[3j+2] = -c e_{3q}, D[3j+1] = 0 and
        D[3q] = r_q - sigma^{-1} . r_q, whose 3q coordinate is 0. Every
        tail-induced row of D is a scalar multiple of the SAME vector e_{3q}.
        Therefore alpha(A-prime) = [exists j < q with r_j[3q] = 1] +
        [sigma . r_q != r_q], which is at most 2, and alpha(E-prime) is at most
        1. A5(arm) == TEN is FORCED for both arms at every declared cell, so
        F-5 returns identity_holds for both arms under the derivation and can
        depart from it only if the derivation, the factor-base hypothesis D-3 or
        the driver has failed - which is exactly the framing the table already
        uses for arm E-prime and refuses to use for arm A-prime.
      why_it_matters: >-
        F-5 is the contract's own "direct test of H-STR-002's own words". The
        table's certification that no invalidation rule and no criterion is
        vacuous is the record the queue requires, and it is wrong at the one
        criterion that carries the hypothesis. This is the same failure class as
        RT21-1 (a count read as a magnitude in a power curve) and D-2 (matching
        counts, different members), occurring inside the artifact written to
        prevent it, and it would otherwise have shipped in a frozen,
        snapshot-committed pre-registration. It is also, precisely, the
        BATCH-012 pattern - a FALSE pre-registered numeric claim surviving
        pre-execution review.
      discharge_condition_recordable_verbatim: >-
        The Coordinator records, in the TASK-20260729-043 receipt and in
        DEC-20260729-004 before dispatch, the following as a binding correction
        to the frozen feasibility table, superseding rather than editing it -
        "CORRECTION TO TASK-20260729-040 FEASIBILITY TABLE SECTION 4. The
        statement that F-5 CAN FIRE for arm A-prime because |T| >= 4 is
        WITHDRAWN. Under the derivation the displacement matrix at a residue-one
        cell has all tail-induced rows parallel to e_{3q}, so alpha(A-prime) is
        at most 2 and alpha(E-prime) is at most 1 at every declared cell. F-5 is
        DERIVED NOT TO FIRE FOR EITHER ARM. It is retained on the same footing
        the table already gives arm E-prime - evaluable, and logically able to
        return an outcome other than identity_holds only by falsifying the
        derivation, which is informative in its own right. NO F-5 OUTCOME OF
        identity_holds MAY BE REPORTED AS SUPPORT FOR H-STR-002, FOR EITHER ARM,
        UNDER ANY READING." Additionally the Executor pre-registers the exact
        prediction P-5 - "alpha(A-prime, residue-one cell) = [exists j < q with
        r_j[3q] = 1] + [sigma . r_q != r_q]; alpha(E-prime, residue-one cell) =
        [sigma . r'_q != r'_q]; alpha = 0 for both arms at every residue-zero
        cell" - and results/sweep_summary.json reports the measured alpha against
        it per cell by name. P-5 is strictly sharper than P-4 and is free.
    - id: O-2
      severity: BLOCKING
      title: >-
        The base-row supply ceiling at L192 and L193 is the period of the
        committed target sequence, not the quota. The feasibility table records
        "large" headroom there without deriving it, and for 5 of the 50 possible
        derived seeds the ceiling is below R_base.
      where: >-
        feasibility_table.md section 2, the "L96+" row of the headroom table and
        the sentence marking those cells "quota-bound"; specification.yaml
        collection_quota.why_a_floor_of_60_and_why_it_is_declared_in_advance.
      the_objection: >-
        _collect_relations draws targets as k = ((t_idx + 1) * c) mod (n - 1) + 1
        with c = max(2, seed mod max(2, n - 3)), and deduplicates by
        x-coordinate. The number of DISTINCT targets is therefore bounded by
        (n - 1) / gcd(c, n - 1), a quantity fixed by the derived seed and n and
        COMPLETELY INDEPENDENT OF Q. Raising the quota cannot raise it. For
        CURVE-J12S1 the derived seed is 100 + offset with offset in [0, 50) and
        n = 733 per the committed EV-STR-003 record, so n - 1 = 732 = 4 * 3 * 61.
        Enumerating all fifty candidates - 45 give a period of 122 or more;
        seeds 108, 120, 132 and 144 give period 61; seed 122 gives period 6.
        At period 61, L192 and L193 can collect at most 61 base rows against
        R_base 65 and 66, so rows_final is at most 183 and the RECTANGULAR
        branch is taken - IV-5 invalidates both cells in both arms and branch 1
        forces the entire experiment to `incomplete`. At period 6 the failure
        reaches down to L24. The same enumeration for CURVE-J16S3 (n = 41617,
        derived seed 300 + offset) gives a minimum period of 136 against
        R_base(97) = 34, so the cross-curve cells are safe. This is the arithmetic
        the table's own caveat sentence gestures at and never performs, and it
        binds exactly at the two cells that carry the sixteen-fold B lever the
        whole design exists to pull.
      why_it_matters: >-
        This is the last authorized batch. A one-line pre-flight computation
        distinguishes "the design cannot reach its top rung on this instance"
        from "the design reached its top rung and measured it", and the
        difference is between a reported, bounded non-execution and 28 runs
        ending in `incomplete` after the fact.
      discharge_condition_recordable_verbatim: >-
        The Coordinator records before dispatch - "PRE-FLIGHT SUPPLY CHECK,
        BINDING. Immediately after each instance is generated and BEFORE any
        factor base is built, the driver computes c = max(2, derived_seed mod
        max(2, n - 3)), g = gcd(c, n - 1) and target_period = (n - 1) // g, and
        records c, g and target_period in results/run_index.json and in every
        manifest for that curve. For every declared cell on that curve it
        compares target_period against R_base(B). IF target_period < R_base(B)
        THE CELL IS RECORDED `not_reached` WITH REASON
        `target_sequence_period_below_base_row_budget`, NAMING THE CELL, THE
        PERIOD AND R_base(B); IT IS NOT ATTEMPTED; ITS SIX FILES ARE STILL
        WRITTEN; THE VERDICT IS `incomplete`; AND THIS IS INFRASTRUCTURE SIGNAL,
        NEVER A MEASUREMENT AND NEVER A NEGATIVE RESULT ABOUT H-STR-002 OR ABOUT
        THE INSTRUMENT QUESTION. In addition the driver records `attempts` (the
        distinct-target count actually reached) beside `hits` at every cell, and
        results/sweep_summary.json reports rows_base_collected against both
        R_base(B) and target_period."
    - id: O-3
      severity: BLOCKING
      title: >-
        The contract declares exactly four things the driver may reimplement and
        then requires a fifth; and IV-10's row-equality check cannot detect an
        unfaithful m=3 certificate reconstruction that lands on the same 0/1
        support.
      where: >-
        specification.yaml implementation_note ("implement ONLY the two
        closures, the misalignment-set computation, the predicted-set rule ...
        and the m = 3 certificate reconstruction"); certificate_discipline
        .base_rows.statement_fields (which requires k per certificate);
        invalidation_rules IV-10.
      the_objection: >-
        Two distinct defects, one of scope declaration and one of check strength.
        (a) SCOPE. Every base-row certificate must carry k with target = k * P.
        Nothing in the committed harness returns k for a collected row, so the
        driver must replay the target loop of endomorphism_la.py lines 269-279,
        including the seen_targets x-coordinate dedup and the
        `len(relations) >= num_targets` break, to know which target produced
        which base row. That is a FIFTH reimplementation of committed control
        flow and it is not in the declared list of four; the feasibility table's
        own IV-10 row acknowledges it exists ("the driver's certificate pass and
        _collect_relations walk the target sequence differently") while the
        contract says the driver implements ONLY four things. An undeclared
        reimplementation of the loop that selects the measured rows is exactly
        the class of defect this review exists to catch.
        (b) CHECK STRENGTH. For m = 3 the certificate is a declared driver
        reimplementation of the quadruple loop at lines 305-339, and its
        faithfulness is checked ONLY by requiring the reconstructed incidence row
        to equal the committed base row element by element. The incidence row is
        a LOSSY function of the decomposition - it drops multiplicity and sign.
        A reimplementation that enumerates in a different order can land on a
        DIFFERENT valid triple (v1, v2, rx) with the SAME index set - for
        instance 2 P_a + P_b against P_a + 2 P_b when v1 = v2 - and both the
        row-equality assertion and both certificate verification layers will
        pass, because the alternative decomposition is genuinely true. IV-10
        therefore establishes that the certificate certifies A relation with the
        measured support, not that it certifies THE relation the committed
        collector found. That is a weaker statement than the contract makes.
      discharge_condition_recordable_verbatim: >-
        The Coordinator records before dispatch - "(a) THE TARGET-SEQUENCE REPLAY
        IS DECLARED AS A FIFTH DRIVER REIMPLEMENTATION. Its exact form is
        k = ((t_idx + 1) * max(2, inst.seed mod max(2, n - 3))) mod (n - 1) + 1
        for t_idx in range(Q * 5), with targets deduplicated by x-coordinate in
        first-seen order and the loop stopping when the base-row count reaches Q,
        transcribed from harness/endomorphism_la.py lines 269-279. It is recorded
        in raw-result.json under `declared_reimplementations` together with the
        other four, and a mismatch between the replay's row sequence and
        _collect_relations' returned rows invalidates the cell under IV-10.
        (b) IV-10 IS STRENGTHENED FOR m = 3. The driver records, per base row,
        the ORDERED triple of factor-base indices (index(v1), index(v2),
        index(rx)) WITH MULTIPLICITY and the two sign flags sA and sB, and
        asserts that the certificate's summand list, in order and with signs
        applied, is exactly (sA, sB, target - (sA + sB)) for that triple. The
        driver's m = 3 search is a VERBATIM transcription of the committed
        iteration order at lines 305-339 - outer over enumerate(factor_base),
        then sA in (A, negate(A)), then enumerate(factor_base), then sB in
        (B_pt, negate(B_pt)), with the same `found` short-circuit - and the
        transcription is recorded as such. Row equality alone is NOT accepted as
        evidence of faithfulness and no record may state that it is."
    - id: O-4
      severity: MAJOR
      title: >-
        success_criterion calls F-4 firing at a residue-zero cell an outcome in
        which "the phi-invariant factor base does something the phi-free closure
        does not". Under the contract's own derivation it cannot mean that.
      where: >-
        specification.yaml success_criterion, against
        falsification_conditions.F-4.the_reading_bound_to_F_4_in_advance and
        derivation_note.md D-6 and D-9.
      the_objection: >-
        D-6's residue-zero argument uses NOTHING about the base rows or about the
        factor base. It is a property of the closure alone - once C_s = sigma^s,
        the first B rows of the stream are sigma-equivariant by construction and
        every row of D vanishes, whatever rows were collected. Arm E-prime
        satisfies C_s = sigma^s by definition and arm A-prime by D-4(a).
        Therefore alpha = 0 at a residue-zero cell for both arms is FORCED and
        cannot depend on phi-invariance. A disagreement there is, as
        the_reading_bound_to_F_4_in_advance correctly says, "a finding about the
        derivation or about the committed code" - an instrument-integrity
        failure, most likely a short factor base under D-3 or a driver defect.
        The success_criterion clause describes the SAME event in the favourable
        vocabulary of endomorphism content. Two readings of one event are frozen
        into one contract and only one of them is derived. Since section 5's
        asymmetry (residue-one firing is tail-explained, residue-zero firing is
        informative) IS correctly derived from D-4a and D-4b, the defect is
        confined to this one clause - but it is the clause a downstream record
        would quote when a favourable-looking result appears.
      discharge_condition_recordable_verbatim: >-
        The Coordinator records before dispatch - "THE READING BOUND TO F-4 IN
        ADVANCE GOVERNS AND success_criterion IS SUBORDINATE TO IT. F-4 FIRING AT
        A RESIDUE-ZERO CELL IS AN INSTRUMENT-INTEGRITY FINDING ABOUT THE
        DERIVATION, THE FACTOR-BASE HYPOTHESIS D-3 OR THE DRIVER, AND IS NOT
        EVIDENCE OF ENDOMORPHISM CONTENT IN EITHER DIRECTION. No record arising
        from EXP-STR-004 may describe it as the phi-invariant factor base doing
        something the phi-free closure does not."
    - id: O-5
      severity: MAJOR
      title: >-
        The reachability repair was applied to `mixed` and to nothing else. Four
        of the seven verdict branches are derivably unreachable, and the contract
        does not say so.
      where: >-
        specification.yaml verdict_rule.branches and
        the_mixed_branch_is_reachable_by_construction.
      the_objection: >-
        The contract correctly diagnoses EV-STR-003 O-5 (an unreachable `mixed`)
        and repairs it. It then declares its seven branches exhaustive and
        pairwise disjoint - which I checked and which holds, given the order -
        but never asks which branches its own derivation can reach. Under the
        derivation, alpha = 0 for both arms at all seven residue-zero cells, so
        AGREE always contains those seven and AGREE is NEVER EMPTY. Branches 4, 6
        and 7 all require AGREE empty and are therefore derivably unreachable.
        Branch 4 additionally requires GREATER (alpha(E-prime) > alpha(A-prime))
        non-empty, which under the exact ranks of O-1 requires the rare
        combination a = 0, b = 0, b' = 1 at some residue-one cell. Branch 5
        requires AGREE == N with DISAGREE non-empty, which needs a set identity
        failure with alpha agreement everywhere - possible but not derived.
        Realistically the contract has three live branches - 1 (`incomplete`),
        2 (`instrument_artifact_confirmed`) and 3 (`mixed`) - and branch 3 is
        overwhelmingly the most likely, because at roughly half the residue-one
        cells alpha(A-prime) = 2 while alpha(E-prime) = 1. The claim
        "pairwise disjoint" is also only true GIVEN the order - branch 1's
        condition overlaps every other branch - which the text does say, but the
        statement is then close to vacuous and should not be read as a structural
        property.
      discharge_condition_recordable_verbatim: >-
        The Coordinator records before dispatch - "REACHABILITY UNDER THE
        DERIVATION, PRE-STATED. Branches 4, 6 and 7 of the verdict rule require
        AGREE to be empty, which the derivation forbids because both arms are
        derived to give alpha = 0 at all seven residue-zero cells. Branch 5
        requires alpha agreement everywhere with a set-identity failure. The live
        branches are 1, 2 and 3, and branch 3 `mixed` is the DERIVED EXPECTATION.
        A realised branch 4, 6 or 7 falsifies the derivation and is reported as
        such." Optionally and at no cost, results/sweep_summary.json additionally
        reports AGREE_0 (agreement restricted to the seven residue-zero cells)
        and AGREE_1 (the seven residue-one cells) as separate named sets, so that
        the derivably-expected residue-one split does not swamp the instrument
        verdict; the top-level verdict rule is NOT changed.
    - id: O-6
      severity: MAJOR
      title: >-
        No reachable outcome of EXP-STR-004 supports H-STR-002. This is a finding
        about the design, not a defect to smooth, and it should be stated in the
        approval record rather than discovered in the evidence record.
      where: >-
        specification.yaml falsification_conditions.F-5
        .the_reading_bound_to_F_5_in_advance, derivation_note.md D-9, and the
        interaction of O-1, O-4 and O-5 above.
      the_objection: >-
        Enumerating the outcomes. F-5 returning identity_holds for arm A-prime is
        pre-registered as NOT support when F-4 also does not fire, and after O-1
        it is derived to return identity_holds for BOTH arms unconditionally, so
        it can never be support. F-4 firing only at residue-one cells is
        pre-registered as tail-explained and not endomorphism content, and the
        derivation makes exactly that the expected pattern. F-4 firing at a
        residue-zero cell is, after O-4, an instrument-integrity finding, not
        endomorphism content. F-3 returning identity_holds is what the derivation
        forces (L0 is contained in Z0 always, so `fails_wholly` is derivably
        unreachable). Branch 2 `instrument_artifact_confirmed` licenses exactly
        one statement, that the statistic carries no information about
        phi-invariance. Branch 3 `mixed` and branch 1 `incomplete` both map, by
        the contract's own fixed disposition, to a Coordinator decision of
        `inconclusive`.
        THEREFORE - AND THIS IS THE ANSWER TO THE CARD'S QUESTION, STATED
        PLAINLY - NO OUTCOME REACHABLE BY THIS CONTRACT SUPPORTS H-STR-002. The
        most likely single outcome is branch 3 `mixed` leading to
        `inconclusive`, because at each residue-one cell alpha(A-prime) is 2
        whenever any of the R_base base rows touches index 3q (expected at
        roughly half the residue-one cells at these B and R_base values) while
        alpha(E-prime) is 1. The contract is HONEST about this - it says so in
        three places and calls it the expected outcome - and it is not a defect.
        What is missing is that the approval record should say it too, so that
        DEFER-BATCH009-001 is discharged with eyes open - as an executed,
        reviewed, archived replication that leaves H-STR-002 `weakened` - rather
        than dispatched on an implicit hope of a supporting result.
      discharge_condition_recordable_verbatim: >-
        The Coordinator records before dispatch - "PRE-STATED AND ACCEPTED. NO
        OUTCOME REACHABLE BY EXP-STR-004 SUPPORTS H-STR-002. The experiment is
        dispatched to discharge DEFER-BATCH009-001 by executing, reviewing and
        archiving the replication that a `weaken` on an `empirical_only` basis
        requires, and to settle the instrument question at toy tier on fourteen
        named cells. Its most likely verdict is `mixed`, whose fixed disposition
        is `inconclusive`. H-STR-002 remaining `weakened` after a clean execution
        is a SUCCESSFUL discharge of the obligation, not a failure of the
        experiment, and no record may present it as either support or refutation
        of the mechanism."
    - id: O-7
      severity: MAJOR
      title: >-
        Verdict branch 1's trigger "any stopping rule fired" is not well defined,
        because SR-4 and SR-11 do not stop.
      where: specification.yaml verdict_rule.branches order 1; stopping_rules SR-4, SR-11.
      the_objection: >-
        SR-4 explicitly records deviation DEV-SIZE-1, omits the full dumps and
        CONTINUES; SR-11 binds the Executor's reporting behaviour and stops
        nothing. Read literally, a run directory brushing 2 MiB forces the whole
        experiment to `incomplete` even though every cell measured cleanly. Read
        charitably, the Executor decides which rules count - which is exactly the
        discretion the verdict rule says it leaves the Executor none of.
      discharge_condition_recordable_verbatim: >-
        The Coordinator records before dispatch - "VERDICT BRANCH 1 IS TRIGGERED
        BY SR-0, SR-1, SR-2, SR-3, SR-5, SR-6, SR-7, SR-8, SR-9 AND SR-10 ONLY.
        SR-4 is a DEVIATION that is recorded as DEV-SIZE-1 naming the exact cells
        and does NOT set `incomplete`; SR-11 binds reporting and does not set a
        verdict."
    - id: O-8
      severity: MAJOR
      title: >-
        The non-support clause is written in the queue's binary "F-5 fires /
        does not fire" vocabulary against a specification that redefined F-5 as
        three-valued. The one sentence that must survive downstream verbatim is
        the one whose antecedent is undefined.
      where: >-
        specification.yaml falsification_conditions.F-5.rule (three outcomes)
        against .the_reading_bound_to_F_5_in_advance ("IF F-5 DOES NOT FIRE");
        same pattern for F-3.
      the_objection: >-
        Under the specification F-5 has no fire/not-fire semantics, only
        identity_holds, mixed and fails_wholly recorded in f5_verdict_A_prime and
        f5_verdict_E_prime. A downstream record must map the clause itself, and
        an unstated mapping is precisely the D-2 hazard the contract cites - a
        condition recorded after the fact is not a condition.
      discharge_condition_recordable_verbatim: >-
        The Coordinator records before dispatch - "`F-5 does not fire for arm X`
        MEANS f5_verdict_X == identity_holds, and `F-3 does not fire` MEANS
        f3_ladder_verdict == identity_holds. Any other value of either field
        means the corresponding criterion fired. The non-support clause reads, in
        the mapped form - IF f5_verdict_A_prime == identity_holds, THAT IS NOT
        SUPPORT FOR H-STR-002 IF F-4 ALSO DID NOT FIRE."
    - id: O-9
      severity: MINOR
      title: The feasibility table's rate sentence is inverted relative to its own table.
      where: feasibility_table.md section 2, "The arithmetic".
      the_objection: >-
        The prose says the per-target decomposition probability "falls roughly
        like B^2"; the table scales it UP with B (0.11 at B=12, 0.44 at B=24,
        saturating by B=48), which is correct. I reproduced every entry from the
        committed anchor 15/27 - 0.5556 * (12/27)^2 = 0.110, * (13/27)^2 = 0.129,
        * (24/27)^2 = 0.439, * (25/27)^2 = 0.476, times 300 giving 33, 39, 131,
        143, headrooms 6.6x and 6.5x. The arithmetic is right and only the verb
        is wrong.
      discharge_condition_recordable_verbatim: >-
        Recorded as a wording defect in the TASK-20260729-043 receipt. No
        artifact change required.
    - id: O-10
      severity: MINOR
      title: derivation_note.md D-9 applies F-5 per cell, but F-5 is per arm over the whole ladder.
      where: derivation_note.md D-9, first bullet, "and F-5 does not fire there".
      the_objection: >-
        F-5 is evaluated per arm over the ten-cell ladder set and has no per-cell
        value, so "F-5 does not fire there" is not a well-formed statement. The
        intended content - that alpha = 0 at those cells is inside the bound - is
        correct.
      discharge_condition_recordable_verbatim: Recorded as a wording defect. No artifact change required.
    - id: O-11
      severity: MINOR
      title: MIS is defined with cols = B while alpha is measured with cols = len(factor_base).
      where: >-
        specification.yaml metrics.primary.misalignment_set.definition ("cols =
        B") against arms.*.alpha_call ("len(fb)").
      the_objection: >-
        If the committed builder returns a short list the two quantities are
        computed over different column counts. IV-4 invalidates the cell, so no
        measurement survives the discrepancy; but the driver should assert
        len(factor_base) == B BEFORE either quantity is computed rather than
        after, so the two are never computed on different widths.
      discharge_condition_recordable_verbatim: >-
        The Coordinator records - "The CTRL-4 assertion len(factor_base) == B is
        evaluated BEFORE the misalignment set and before alpha at every cell and
        for both arms, and a failure aborts the cell rather than invalidating it
        afterwards."
    - id: O-12
      severity: MINOR
      title: The exhaustiveness note's "pairwise disjoint" is only true given the order.
      where: specification.yaml verdict_rule.exhaustiveness_note.
      the_objection: >-
        Branch 1's condition overlaps every other branch - a reduced N can still
        satisfy AGREE == N. Branches 2 through 7 ARE pairwise disjoint as
        conditions, which I checked; branch 1 is not, and the "given the order"
        qualifier makes the claim true but nearly vacuous. Exhaustiveness itself
        holds - AGREE is equal to N, a non-empty proper subset, or empty, and
        branches 2 and 5 exhaust the first, branch 3 the second, and branches 4,
        6 and 7 the third.
      discharge_condition_recordable_verbatim: Recorded as a precision defect. No artifact change required.
    - id: O-13
      severity: MINOR
      title: Verification layer 1 does not check the k limb of the certificate.
      where: >-
        specification.yaml certificate_discipline.verification_layer_1_in_run
        against harness/semaev.py verify_decomposition_certificate.
      the_objection: >-
        verify_decomposition_certificate reads only target, summands and curve;
        it ignores the added k and P fields entirely. Only the Sage layer checks
        k * P == target. The contract does not misstate this, but the two layers
        are not equivalent and a reader of the run record alone will see
        `verified true` on a certificate whose k limb was never checked in-run.
        If SR-6 fires, k is checked NOWHERE.
      discharge_condition_recordable_verbatim: >-
        The Coordinator records - "raw-result.json labels the in-run
        verification result `point_sum_only` and records that the k limb is
        verified only by the Sage layer; if SR-6 fires, every certificate is
        recorded with `k_limb_verified: false`."
    - id: O-14
      severity: INFORMATIONAL
      title: Budget realism, assessed from the committed loops rather than measured.
      the_assessment: >-
        L192 and L193 SHOULD finish inside 900 s per run. The alpha measurement
        is two numpy object-dtype 193x193 products plus one modular elimination,
        about 3 * 193^3 = 21.6 million Python-level integer operations, which on
        this class of host is tens of seconds, not hundreds. Relation collection
        at m = 2 is the O(B^2/2) s3_eval scan of semaev._find_decomposition, but
        it EXITS EARLY on the first S_3 root, and at B = 192 with p of order 2293
        the expected number of vanishing pairs per target is of order 30, so the
        expected scan is a few hundred evaluations, not 18528. A12M3 and A13M3
        are cheap - the quadruple loop is at most 4 * 13^2 = 676 inner steps per
        target with an early exit, and the m = 3 hit rate at B = 13 is high.
        The single term I judge most likely to be underestimated is the FAILED
        m = 2 searches at L12 and L13, where most targets do not decompose and
        the full pair scan runs to completion - but that scan is only 78 and 91
        pairs. I do NOT expect SR-1 or SR-2 to fire on compute. THE REAL RISK AT
        THE TOP RUNGS IS SUPPLY, NOT TIME - see O-2. None of this is a
        measurement and none of it may be cited as one.
    - id: O-15
      severity: INFORMATIONAL
      title: >-
        Things the contract gets right that a reviewer should record, so that a
        later session does not re-litigate them.
      the_record: >-
        CTRL-1 is genuinely by construction - R_base(B) = (B+2)//3 + 1 depends on
        B alone and both arms truncate to the identical prefix, so the nuisance
        variable EXP-STR-003 F1 fired on is removed rather than argued away.
        CTRL-2's zero suppression is forced by the unconditional closure. The
        prefix-invariance claim is TRUE - changing Q changes only the loop range
        and the stopping point, never the order, so the first R_base rows are
        identical for any Q large enough. The quota floor of 60 is correctly
        justified from the committed 5 * num_targets allowance at
        endomorphism_la.py:269 and cannot affect which rows are measured. The
        contract's own counts all check out - 28 runs enumerated as 14 cells x
        2 arms, 14 cells named, 14 invalidation rules IV-1 to IV-14, 7 verdict
        branches, the 174-path declaration reconciling with the queue's
        declared_commit_sets as 28*6 + 6, the stage sums 505 and 6480 with 720 s
        of headroom. Sage is invoked through the binary and never as a Python
        import, which is correct for this host, and the verifier is required to
        share no code with harness/toycurve.py. The forbidden entry point
        main() is correctly identified and the IndexError at line 451 is real.
        The refusal to pre-register DEC-20260727-009's numeric phrasing is not
        only defensible but NECESSARY - that phrasing is provably wrong, for the
        reason given in O-1.

  # =================================================================
  # 3. ANSWERS TO THE EIGHT CARD QUESTIONS
  # =================================================================
  answers_to_the_eight_questions:
    Q1_is_the_T_rule_correct_and_from_the_committed_source: >-
      YES, and it was re-derived independently from harness/endomorphism_la.py
      before the note was read. T1, T2, T3, the disjointness, the count
      |T| = 2 * #{tail-touching base rows} + [sigma . r_q != r_q], the claim that
      the 3j+1 row PROVABLY ALWAYS VANISHES, and arm E-prime's
      |T| <= 1 all REPRODUCE EXACTLY. The rule is complete - the q + 1 rows of
      the square block are exhausted and every sigma-comparison stays inside a
      single triple or on the fixed point 3q. Full working is in
      derivation_check.md sections 1 to 6. The note is nonetheless one step short
      of the exact rank, and that gap causes O-1.
    Q2_is_every_prediction_a_set_identity_with_no_cardinality_dispositive: >-
      IN THE PREDICTIONS, YES. P-1, P-2 and P-3 are set identities at named
      cells; set_agreement makes cardinality_only_agreement count as
      DISAGREEMENT; F-1 fires on it. P-4 and F-2 read a cardinality (alpha <=
      |MIS|) but as a BOUND on that arm's own measured set, with the member list
      reported, which is legitimate.
      IN THE CONTRACT'S STATEMENTS ABOUT ITSELF, NO - see O-1. The feasibility
      table lets the cardinality |T| >= 4 dispose of the question whether F-5 can
      fire, and that is a count doing dispositive work in the artifact whose
      purpose is to certify no criterion is vacuous. THAT IS THE SIXTH INSTANCE.
    Q3_is_the_base_row_budget_matched_by_construction: >-
      YES. R_base(B) = (B+2)//3 + 1 is a function of B alone, identical across
      arms, and both arms truncate their own collected list to that prefix before
      any closure. This is control by construction, not by assertion, and it is
      the correct repair of the EXP-STR-003 F1 nuisance variable. The one
      unbounded quantity is whether the budget can be MET at the top two cells -
      that is O-2, a supply question, not a matching question.
    Q4_is_mixed_reachable_and_are_F1_to_F5_evaluable: >-
      `mixed` IS reachable by construction at F-3, F-4 and F-5 and at the
      experiment verdict, and the EV-STR-003 O-5 defect is genuinely repaired.
      But the repair was applied to `mixed` only - branches 4, 6 and 7 are
      derivably unreachable and F-5's non-identity outcomes are derivably
      unreachable for BOTH arms (O-1, O-5). Evaluability - F-2 is always
      evaluable; F-1 for arm E-prime depends on the partner AP run being valid,
      which the feasibility table declares in advance and correctly; F-3 and F-5
      require all ten ladder cells and become unevaluable if L192 or L193 is
      lost, which is exactly the O-2 risk.
    Q5_does_the_contract_smuggle_in_a_third_arm_or_a_cost_or_mechanism_claim: >-
      NO. Two arms, no third. No cost quantity of any kind is measured, RC-7 is
      declared inapplicable with its reason and with the cost of that honesty
      recorded, no density penalty is measured, no scaling law is claimed, and
      the mechanism is explicitly and repeatedly excluded. The one clause that
      leans toward a favourable mechanism-flavoured reading is
      success_criterion - see O-4 - and it is a reading, not a measurement.
    Q6_is_the_sage_verifier_independent_and_invoked_through_the_binary: >-
      YES on both. The verifier is required not to import, call or replicate
      harness/toycurve.py, harness/semaev.py or any harness module, to share no
      code with the driver, and to communicate only through JSON files in the
      out-of-repository scratch directory. The invocation is
      `sage experiments/EXP-STR-004/driver/verify_certificates.sage IN.json
      OUT.json`, through the BINARY and never as a Python import, with the
      exact command recorded in command.txt. NOT BLOCKING. The IV-14 integer
      hygiene rule correctly anticipates the EV-STR-001 preparser failure mode
      that killed three of four EXP-STR-001 Sage invocations.
    Q7_does_any_number_come_from_an_unarchived_source: >-
      NO NUMBER FEEDS A CRITERION FROM AN UNARCHIVED SOURCE. The two empirical
      anchors are cited to committed records and I verified both - EV-STR-003
      O-10(a) does record hits 15 and attempts 27 at B = 27 on this curve, and
      O-12 does record 132.595 s of 5400 s over twenty runs with peak RSS 0.0994
      GB. EV-STR-001 does record 4 Sage invocations with attempts 1 to 3 lost to
      preparser and JSON failures. The pre-freeze Sage host observation and the
      two disk figures are labelled as unarchived provenance and explicitly
      non-citable, and the run-time checks govern. B is a free parameter and no
      instance parameter is transcribed. This is handled correctly.
    Q8_are_the_budgets_survivable_and_does_every_breach_name_infrastructure_signal: >-
      The wall-clock and artifact budgets are survivable - see O-14 - and the
      artifact projection (roughly 230 to 400 KiB for the largest run directory
      against a 2 MiB cap, and 6 to 11 MiB of tree against 64 MiB) is sound.
      Every breach is named infrastructure signal in
      every_breach_is_infrastructure_signal and in each SR, and SR-0 makes the
      disk check mandatory at run time rather than trusting either reported
      figure. The one defect is O-7, that branch 1 does not say which stopping
      rules trigger it.

  # =================================================================
  # 4. REQUIRED CONTROLS
  # =================================================================
  required_controls:
    - >-
      CHEAPEST DISCRIMINATING CONTROL, AND THE ONE I WOULD ADD IF I COULD ADD
      ONLY ONE - the pre-flight target-sequence period check of O-2. It is
      gcd(c, n - 1) computed once per curve, before any factor base is built,
      and it converts a possible post-hoc whole-experiment `incomplete` into a
      named, bounded non-execution reported before a single second of compute is
      spent.
    - >-
      PRE-REGISTER THE EXACT RANK AS P-5 (O-1). alpha is derivably
      [exists tail-touching base row] + [sigma . r_q != r_q] for arm A-prime and
      [sigma . r'_q != r'_q] for arm E-prime at residue-one cells, and 0 for both
      at residue-zero cells. This is strictly sharper than P-2 plus P-4, costs
      nothing, and turns the residue-one cells from bounded into predicted. A
      measured alpha of 3 or more at ANY cell would then be a genuine
      counterexample certificate against the derivation - the strongest
      refutation artifact class in docs/claims-and-verification.md - rather than
      an unexplained number inside a loose bound.
    - >-
      RECORD attempts (the distinct-target count) beside hits at every cell, and
      report rows_base_collected against BOTH R_base(B) and the computed
      target_period, so a shortfall is attributable to supply rather than to
      rate.
    - >-
      RECORD THE ORDERED INDEX TRIPLE AND SIGN FLAGS for every m = 3 base row and
      assert the certificate against them, not merely against the 0/1 row (O-3b).
    - >-
      DECLARE THE TARGET-SEQUENCE REPLAY AS THE FIFTH REIMPLEMENTATION and bind
      IV-10 to it (O-3a).
    - >-
      NULL-OBJECT CONTROL, ALREADY PRESENT AND WORTH NAMING - arm E-prime IS the
      null object of the same shape that the inventor protocol's "controls before
      belief" obligation requires, and the contract correctly refuses to read a
      signal that the null object reproduces. This is the strongest single
      feature of the design.

  # =================================================================
  # 5. COUNTEREXAMPLE / MUTATION
  # =================================================================
  counterexample_or_mutation: >-
    THE COUNTEREXAMPLE THAT BREAKS THE FEASIBILITY TABLE'S F-5 CLAIM, exhibited
    rather than argued. Take a residue-one cell and let two distinct base rows
    r_j and r_j' both have a 1 in coordinate 3q. Then T contains 3j, 3j+2, 3j',
    3j'+2 and 3q, so |T| = 5 >= 4 and the table concludes alpha > 3 is
    arithmetically available. But rows 3j, 3j', 3j+2 and 3j'+2 of the
    displacement matrix are c e_{3q}, c e_{3q}, -c e_{3q} and -c e_{3q}, all in a
    one-dimensional space, and row 3q is orthogonal to e_{3q}. The rank is 2.
    An index-only synthetic simulation run OUTSIDE THE REPOSITORY - no curve, no
    harness, no repository file, NOT ARCHIVED, NOT EVIDENCE AND NOT CITABLE -
    over the ten declared B values, both arities and sixty random base-row draws
    each (1200 configurations) returned maximum alpha 2 for arm A-prime and 1 for
    arm E-prime, and produced a B = 193 case with |MIS| = 5 and alpha = 2. The
    algebra in derivation_check.md section 6.2 stands on its own; the simulation
    is reported only as a corroboration of the reviewer's arithmetic.
    THE CHEAPEST MUTATION THAT WOULD EXPOSE THE O-2 RISK WITHOUT ANY CURVE
    COMPUTE - compute gcd(max(2, s mod (n-3)), n-1) for s in range(100, 150) with
    n = 733 and observe that five values give a period below R_base(193) = 66.

  # =================================================================
  # 6. BASELINE COMPARISON
  # =================================================================
  baseline_comparison: >-
    NO BASELINE IS OWED AND NONE IS CLAIMED, AND THAT IS CORRECT. EXP-STR-004
    solves no instance, recovers no discrete logarithm, assembles no linear
    system and measures no cost, so Pollard rho, BSGS and the closest
    specialized baseline (the automorphism-quotient factor-r saving of
    Wiener-Zuccherato and Duursma-Gaudry-Morain, which EV-STR-003 O-11 already
    identifies as the ONE reproducible effect in this lineage and as a known
    constant factor) have no matched task here. RC-7 is declared inapplicable
    with its reason and with the cost of that honesty stated - EV-STR-003's
    boundary that NO ARCHIVED BASELINE EXISTS AT THE TWO LARGER INSTANCES stays
    open and this contract does not close it. I accept that determination.
    What I do NOT accept, and what no downstream record may do, is to read the
    absence of an owed baseline as an absence of a baseline gap - the gap is
    real, it is unrepaired, and RT-CM-1 through RT-CM-6 remain open.
    Under docs/target-result-profile.md rule A1 this is NOT target-class - no
    exponent moves under any outcome, in either direction.

  # =================================================================
  # 7. HEURISTIC AND COST-MODEL CHALLENGES
  # =================================================================
  heuristic_challenges:
    - >-
      THE CONTRACT INTRODUCES NO NUMBERED HEURISTIC AND STATES NO CONDITIONAL
      RESULT, and its declaration of the conditional-result pairing rule as
      inapplicable is correct - every quantity is a deterministic function of
      (curve, B, m, arm) with no distributional assumption. There is nothing to
      validate at scale because there is nothing distributional to validate.
    - >-
      WHAT DOES CARRY HIDDEN CONDITIONALITY IS THE FEASIBILITY TABLE'S RATE
      MODEL. Scaling one committed data point (15/27 at B = 27) by (B/27)^2 is a
      random-model transfer - it assumes the decomposition rate of a
      DETERMINISTICALLY GENERATED, PHI-ORBIT-STRUCTURED factor base behaves like
      that of a uniform random one. A phi-invariant factor base is a union of
      zeta3-orbits, which is exactly the kind of structured object for which a
      uniform-random count can deviate. The contract does not rest any criterion
      on this model, so the exposure is confined to feasibility - but it is the
      same failure shape the target profile warns about, and the cheapest thing
      that would expose a deviation is already available at zero cost - report
      hits and attempts per cell PER ARM and compare the phi-invariant arm's
      rate against the random arm's rate at matched B. Both numbers are already
      returned by _collect_relations.
    - >-
      THE RANDOM-MODEL TRANSFER THAT ACTUALLY BINDS is the one nobody modelled -
      the target sequence is not a random sample of the group, it is an
      arithmetic progression modulo n - 1 whose image size is (n-1)/gcd(c, n-1).
      That is O-2, and it is the concrete instance of "a structured object is not
      a uniformly random one" in this contract.
  cost_model_challenges:
    - >-
      NO COST CLAIM IS MADE, so there is no per-attempt versus total-expected-cost
      confusion to find and no o(1) or polylog cofactor to unpack. The contract
      forbids structured_cost, wiedemann_cost, cost_ratio, density_penalty and
      any rho or BSGS comparison, and it names RT-CM-1 through RT-CM-6 as still
      OPEN. This is correct and I have no objection to it.
    - >-
      MEMORY IS STATED BESIDE TIME (8 GB cap, 2 MiB per run directory, 64 MiB
      tree, 5 GiB free-disk floor) and every breach is named infrastructure
      signal. The projections are sound - see O-14.
    - >-
      THE ONE COST-SHAPED STATEMENT IN THE CONTRACT IS THE BUDGET BASIS CLAIM
      that per-cell measurement cost at B = 193 is below EXP-STR-003's B = 397
      cell because the rank measurement grows like B^3. That is a legitimate
      complexity argument, correctly labelled an ESTIMATE, and the pessimistic
      stage sum of 6480 s against a 7200 s cap is real arithmetic over the six
      declared stage ranges. It does not conceal a hidden constant that I can
      find.
    - >-
      IF ANY DOWNSTREAM RECORD TOUCHES THE RELATION-DENSITY PENALTY IT QUOTES THE
      WHOLE RANGE 17.5x TO 4128.6x, WHICH GROWS WITH SIZE AND SUPERLINEARLY IN m,
      AND NEVER 17.5x ALONE. I verified that ledger/EV-STR-001.yaml (flat root,
      not ledger/evidence/) records exactly that range. The contract states this
      correctly and I restate it here so the binding survives this review.

  # =================================================================
  # 8. REDUCTION AND SCOPE CHALLENGES
  # =================================================================
  reduction_and_scope_challenges:
    - >-
      NO COROLLARY IS CLAIMED VIA ANY CITED REDUCTION. The only reduction-shaped
      move is DEC-20260727-009's next action, which specifies the two arms and
      the matched-budget, sha256 and frozen-criteria requirements; I checked the
      contract against it and the instantiation is faithful, including the
      matched base-row budget, the per-cell sha256 of the factor base and of the
      final row list, and the freeze-before-execution ordering. The one place the
      contract DEPARTS from that decision is P-2's refusal to pre-register
      "alpha equal to the number of rows touching the truncated tail", and that
      departure is CORRECT - the decision's phrasing is provably false, for the
      reason in O-1.
    - >-
      RULE-BATCH014-SCOPE's ruling that "two arms and nothing else" constrains
      arms and not instances is a queue ruling, not a decision-record ruling, and
      the contract relies on it to add twelve cells beyond a single B. I do not
      object - a replication of "independent of B" at one B replicates nothing -
      but the reliance should be visible in DEC-20260729-004 rather than only in
      the queue.
    - >-
      SCOPE IS NOT INFLATED. claim_ceiling, what_may_not_be_concluded_under_any_outcome
      N-1 to N-5, instrument_not_mathematics and SPEC-STR-004-E all bound this to
      a toy-tier fourteen-cell measurement on two curves at B <= 193 with m <= 3,
      one realisation per cell, one host, one stack. It correctly states that it
      moves no exponent under any outcome and that under rule A1 it is not
      target-class. The affected-versus-safe question does not arise because no
      scheme is affected by anything here.
    - >-
      CARRIED DEFECTS ARE DISCLOSED RATHER THAN REPAIRED, and correctly - UC-3,
      UC-4, UC-5, UC-7, O-9 and INT-BATCH012-F (the ledger still does not
      validate) are all named as untouched. I confirm none of them is repaired by
      this contract and none is presented as repaired.

  # =================================================================
  # 9. PRE-STATED VERDICT LABELS, BEFORE ANY MEASUREMENT EXISTS
  # =================================================================
  pre_stated_verdict_labels:
    basis: >-
      PRE-STATED AT THE REVIEWED HEAD 561495cd, AT WHICH NO EV-STR-004, NO
      DEC-20260729-004 AND NO RUN-STR-004-* PATH EXISTED - confirmed by
      git ls-tree at that commit. Nothing below is fitted to any outcome because
      no outcome exists.
    per_branch:
      - branch: 1
        experiment_verdict: incomplete
        label_the_record_should_carry: >-
          INFRASTRUCTURE SIGNAL OR BOUNDED NON-EXECUTION. DEFER-BATCH009-001
          SURVIVES INTACT. Coordinator decision on the instrument question is
          `inconclusive`. H-STR-002 stays `weakened`. No mathematical content in
          either direction.
      - branch: 2
        experiment_verdict: instrument_artifact_confirmed
        label_the_record_should_carry: >-
          The number the committed harness reports as `phi_alpha` carries NO
          information about whether the factor base is phi-invariant, on these
          fourteen named cells, at TOY tier. NOT support for H-STR-002 and NOT
          refutation of its mechanism. proof_status `derivation` for what the
          note derives and `empirical_only` for the rest, NEVER `proved`.
          H-STR-002 stays `weakened`; DEFER-BATCH009-001 is discharged.
      - branch: 3
        experiment_verdict: mixed (named_cells_point_different_ways)
        label_the_record_should_carry: >-
          THE DERIVED EXPECTATION. Coordinator decision `inconclusive`, said
          plainly. The cells in the symmetric difference are NAMED and, if they
          are all residue-one cells, the disagreement is attributed to the
          truncated tail of the committed builder per D-4b and is NOT evidence of
          endomorphism content. H-STR-002 stays `weakened`;
          DEFER-BATCH009-001 is discharged.
      - branch: 4
        experiment_verdict: instrument_artifact_falsified
        label_the_record_should_carry: >-
          DERIVABLY UNREACHABLE (O-5). If realised, the FIRST claim of the record
          is that the derivation is falsified, with the members of GREATER named,
          and the second is that this is still NOT support for H-STR-002 absent a
          cost path. Requires an independent re-derivation before any transition.
      - branch: 5
        experiment_verdict: mixed (alpha_agreement_without_set_agreement)
        label_the_record_should_carry: >-
          `inconclusive`, with the set-identity failures named per cell and the
          symmetric differences given as member lists. A cardinality match with
          different members is DISAGREEMENT and is labelled
          cardinality_only_agreement.
      - branch: 6
        experiment_verdict: mixed (E_prime_strictly_below_A_prime_at_every_cell)
        label_the_record_should_carry: >-
          DERIVABLY UNREACHABLE (O-5). If realised, treat as a derivation
          falsification first and as an instrument result second.
      - branch: 7
        experiment_verdict: mixed (A_prime_prediction_failed_with_disagreement)
        label_the_record_should_carry: >-
          DERIVABLY UNREACHABLE (O-5). If realised, the A-prime set-identity
          failure is the headline and a counterexample certificate against the
          derivation is the strongest available artifact.
    ladder_fields_pre_stated:
      - >-
        f3_ladder_verdict is PRE-STATED as identity_holds (Z0 == L0). Any other
        value falsifies the derivation and is reported as such, not as evidence
        about H-STR-002.
      - >-
        f5_verdict_A_prime and f5_verdict_E_prime are BOTH PRE-STATED as
        identity_holds, for the reason in O-1 - alpha is at most 2 and at most 1
        respectively at every declared cell. NEITHER IS SUPPORT FOR H-STR-002
        UNDER ANY READING. Any other value falsifies the derivation.
      - >-
        F-4 is PRE-STATED to fire, at a subset of the seven residue-one cells and
        at NONE of the seven residue-zero cells. Firing at a residue-zero cell is
        an instrument-integrity finding (O-4).

  # =================================================================
  # 10. NARROWEST SUPPORTED STATEMENT AND NEXT ACTION
  # =================================================================
  narrowest_supported_statement: >-
    On the evidence available before execution - a committed contract, a
