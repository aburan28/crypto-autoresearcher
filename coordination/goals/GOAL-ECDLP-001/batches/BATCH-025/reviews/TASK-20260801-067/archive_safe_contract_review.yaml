    finding: >-
      The 120951808-byte subtraction is correct, but a filesystem-byte cap on
      pilot paths is not itself a cap on the received Git pack. The pack also
      contains blob framing, trees, commits and every object not already on the
      remote. The contract neither binds the exact remote base immediately
      before archival nor preflights the complete remote-relative pack. Its
      push ceiling is therefore not mechanically enforceable from the stated
      counters, and its next-record-boundary stop cannot be applied after a
      final pack is discovered to exceed the remote limit.

  local_disk_rederivation:
    tracked_certificate_shards_bytes: 1610612736
    other_tracked_artifacts_bytes: 268435456
    untracked_temporary_bytes: 134217728
    stated_git_worktree_and_index_reserve_bytes: 134217728
    stated_sum_bytes: 2147483648
    stated_total_cap_bytes: 2147483648
    arithmetic_verdict: PASS
    archive_complete_verdict: REVISE
    finding: >-
      The four stated terms sum to 2 GiB, but the derivation omits the Git
      object database created when the evidence is staged and committed.
      Tracked artifacts already occupy up to 1.75 GiB in the worktree. Git add
      must create blob objects as a second representation; the 1.5-GiB shard
      population is already gzip-compressed and can require approximately its
      full size again in Git's object store. Certificate worktree bytes plus
      certificate blob bytes alone can therefore approach 3 GiB, before the
      other tracked artifacts, temporary files, index, trees or commit. A
      128-MiB Git reserve cannot establish the claimed 2-GiB end-to-end local
      archive bound.

