      The reconstructed contract remains a null-only, non-evidentiary resource
      pilot. It cannot provide evidence for or against HEUR-DS-1 and introduces
      no ECDLP, asymptotic, cryptographic-scale or breakthrough claim.

  objections:
  - id: RT055-B1
    severity: blocking_handoff_integrity
    finding: >-
      Two literal amendment inputs named by TASK-20260801-067 are absent at the
      snapshot, so the instruction to apply all four amendments literally
      cannot be satisfied as written.
    required_repair: >-
      Issue an immutable successor handoff naming the exact committed documents
      and the precise operation order. Do not claim four amendments unless all
      four exact paths and IDs exist.
  - id: RT055-B2
    severity: blocking_archive_cost_model
    finding: >-
      The 2-GiB local cap charges worktree artifacts but omits the near-duplicate
      Git blob storage required to stage and commit mostly pre-compressed shards.
    required_repair: >-
      Add a separate archive-phase disk budget charging worktree bytes, worst-
      case Git object bytes, index/tree/commit overhead and temporary pack
      bytes, or lower artifact caps enough that a proved worst-case sum fits.
  - id: RT055-B3
    severity: blocking_transport_enforcement
    finding: >-
      Aggregate pilot file bytes do not bind the remote-relative Git pack, and
      no exact remote base or complete pack preflight is frozen.
    required_repair: >-
      Require a clean, named remote ancestor immediately before execution and
      archival, then deterministically preflight the entire objects-to-push
      pack with explicit framing/tree/commit headroom. Treat failure as an
      archive/infrastructure outcome, never as mathematical evidence.

  required_controls:
  - Re-run path-based materialization from the corrected committed input roster.
  - Measure or conservatively bound Git object-store growth for worst-case 12-MiB gzip shards.
  - Measure the complete remote-relative pack, not only artifact filesystem bytes.
  - Preserve all 4186112 certificate records across exactly 128 required shards.
  - Preserve the null-only CLI and non-evidentiary outcome ceiling.

  counterexample_or_mutation: >-
    Fill 128 valid gzip shards near the 12-MiB cap with incompressible
    certificate-shaped bytes in a disposable repository, record worktree disk,
    run git add, and record object-database growth. Growth near the 1.5-GiB
    shard total falsifies the amendment's 128-MiB Git-overhead reserve without
    running the scientific pilot.

