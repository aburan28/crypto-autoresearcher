      ECDLP or breakthrough evidence.

  cost_model_checks:
  - check: required feasibility result fields
    status: fail
    blocker_id: VAL084-B5
    evidence: >-
      The returned feasibility report omits peak RSS, disk bytes by phase and
      total, factorizations per wall and CPU second by bits and null type,
      compressed and logical bytes per certificate by bits and null type, the
      projected v2 full-contract wall/CPU/disk table with linearity caveat, and
      checkpoint/resume events. It also does not record the required SymPy
      dependency version. These fields cannot be reconstructed from the emitted
      report after a run.

  proof_architecture_checks: []

  seed_and_certificate_checks:
  - check: factor certificate reconstruction
    status: pass
    evidence: >-
      Bounded N=360 test reproduced sorted prime factors, LPF=5, three
      primality checks and exact reconstruction.
  - check: seed-roster coverage and collision claim
    status: fail
    blocker_id: VAL084-B6
    evidence: >-
      The binding seed_roster_contract requires every domain tuple and derived
      128-bit seed. The implementation records only 32 stream descriptors and
      hashes. For NULL-K512-ADD it checks collisions only on synthesized edge
      hashes, not on the underlying A/B derived seeds, and its recorded seed_rule
      describes a six-field derivation that those edge hashes do not follow.
      Thus collision_count=0 would not certify all generated seed material and
      the implementation note's declared no-deviation statement is unsupported.
  - check: interrupted-write cleanup
    status: fail
    blocker_id: VAL084-B7
    evidence: >-
      run_null_pilot has no try/finally that aborts the current certificate
      writer after worker, wall, CPU, RSS or aggregate-cap failure. A resource
      exception can leave a .partial shard, and already renamed shards are not
      reconciled by a checkpoint/resume receipt.

  limitations:
  - No run evidence exists or was reviewed.
  - run-null-pilot was deliberately not invoked.
  - Pack tests used tiny synthetic producers, not git pack-objects or a remote.
  - This report does not alter experiment, hypothesis, goal or ledger state.

