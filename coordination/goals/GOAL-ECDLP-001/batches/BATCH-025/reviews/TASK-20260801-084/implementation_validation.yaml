  artifact_checks:
  - check: committed implementation snapshot exists and is immutable for review
    status: pass
    evidence: Exact commit, parent, diff roster and SHA-256 values reproduced.
  - check: syntax
    status: pass
    evidence: Python AST parsing completed without creating a bytecode artifact.
  - check: CLI surface
    status: pass
    evidence: >-
      Help exposes only self-test and run-null-pilot. Unsupported source and
      evidence subcommands both exited 2 without running a test or pilot.
  - check: frozen constant arithmetic
    status: pass
    evidence: >-
      Independently imported committed bytes and reproduced 32 arrays, 130816
      records per array, 4186112 records total, 32704 records per shard and 128
      shards, with 32704*128=4186112.
  - check: exact result-path binding
    status: fail
    blocker_id: VAL084-B1
    evidence: >-
      run-null-pilot accepts an arbitrary --output-root. Certificate manifest
      repository_relative_path is str(final), so an absolute output root emits
      absolute paths, and no guard requires the frozen experiment root or the
      exact 137-path run-evidence roster. The implementation therefore does not
      enforce the committed repository-relative output paths.

  metric_recomputations:
  - metric: deterministic IID seed derivation
    status: pass
    evidence: >-
      Recomputed first_128_bits(SHA256(EXP-SMTH-002/v1|NULL-IID-EDGE|16|0|0|0))
      and matched derived_seed.
  - metric: process-tree CPU seconds
    status: fail
    blocker_id: VAL084-B2
    evidence: >-
      run_null_pilot uses time.process_time() in the parent while all
      factorizations run in ProcessPoolExecutor children. Child CPU is excluded,
      so both the 28800-second ceiling and reported cpu_seconds omit the main
      scientific cost.
  - metric: process-tree peak RSS
    status: fail
    blocker_id: VAL084-B2
    evidence: >-
      resource.getrusage(RUSAGE_SELF) measures only the parent, not the four
      factor workers. The 4294967296-byte peak-RSS ceiling and reported resource
      accounting are consequently not enforced for the execution topology.
  - metric: run-phase disk and tracked-byte caps
    status: fail
    blocker_id: VAL084-B2
    evidence: >-
      MAX_RUN_DISK_BYTES, MAX_OTHER_AGGREGATE_BYTES and MAX_TRACKED_BYTES are
      declared but never read after assignment. No phase/device disk measurement
      or aggregate-other/tracked gate exists. The implementation note's claim
      that runtime methods enforce all frozen ceilings is false.

  control_checks:
  - check: bounded synthetic self-test
    status: pass
    evidence: >-
      One independent invocation passed all six named tests and reported
      scientific_runs=0.
  - check: bounded pack exact cap
    status: pass
    evidence: 4096 input bytes produced an exact 4096-byte final pack.
  - check: bounded pack cap plus one
    status: pass
    evidence: >-
      4097 input bytes against a 4096-byte cap returned overflow, recorded
      bytes_written=4096, and left neither final nor partial output.
  - check: bounded pack producer failure
    status: pass
    evidence: Synthetic producer exit 7 could not succeed and left no output.
  - check: split-device arithmetic
    status: pass
    evidence: >-
      Exact worktree/common thresholds pass and either threshold minus one
      fails; same-device threshold passes.
  - check: twelve-factor composite rejection
    status: pass_with_test_gap
    evidence: >-
      Independent bounded harness supplied twelve alleged factors with a
      composite final item and observed rejection. The committed self-test uses
      only two alleged factors, so its name does not exercise the frozen
      twelve-factor control and must be repaired.
  - check: 1025-byte logical-record rejection before writer
    status: pass_with_test_gap
    evidence: >-
      Independent bounded harness observed CertificateShardWriter reject an
      oversized record before writing. The committed self-test merely compares
      a serialized length and never calls the rejection path.
  - check: checkpoint and single-resume policy
    status: fail
    blocker_id: VAL084-B3
    evidence: >-
      The base checkpoint_policy remains binding through AMEND-007, but the
      implementation writes no checkpoint at the 32704-record interval,
      records none of the required checkpoint fields, and has no verified
      resume path. Existing final shards also make a restarted writer fail
      rather than resume from the last verified checkpoint.
  - check: process-output handles and no-network ceiling
    status: fail
    blocker_id: VAL084-B2
    evidence: >-
      The frozen controls require observing at most eight process output
      handles and no network during the run. The driver neither measures nor
      enforces either condition.
  - check: one-byte shard mutation and independent canonical-hash reproduction
    status: fail
    blocker_id: VAL084-B4
    evidence: >-
      No committed synthetic test mutates a shard and checks rejection, and no
      test independently reproduces the seed-roster or shard-manifest canonical
      hashes. Hash construction alone is not the required negative/independent
      control.

  heuristic_validation_checks:
  - check: scientific interpretation
    status: not_run
    evidence: >-
