# ---------------------------------------------------------------------------
# Blocking defects (REVISE) — new residuals after amend
# ---------------------------------------------------------------------------
blocking_defects:
  - id: B-5
    supersedes_or_residual_of: B-2
    title: Density-universe N / cofactor designation not unique
    target: >-
      experiments/EXP-IT-001/specification.v2.yaml
      inputs.density_universe
    detail: >-
      p_bits selection mixes "smallest prime p such that ..." with
      "deterministically first hit under seed_density". More critically,
      U(bits) retains ordinary curves whose group order "has a prime factor N
      with bitlength == bits", while detectors and the curve_sampler speak of
      a prime-order subgroup N under test. Missing: cofactor bound h=#E/N;
      rule when multiple distinct bits-bit prime factors exist; which N is
      passed to embedding_degree_leq_threshold and Weil-descent predicates for
      the density freeze. Without these, rho_special(bits) and
      density_universe hashes are not uniquely recomputable by a Validator.
    required_fix: >-
      Freeze a unique instance map per retained class: e.g. require #E=h*N with
      N prime, bitlength(N)=bits, 1<=h<=h_max (name h_max); exclude or
      deterministically break ties when multiple N candidates exist; align
      p_bits witness search with that map; keep freeze-artifact schema.

  - id: B-6
    supersedes_or_residual_of: B-3
    title: R_xfer path / endpoint aggregation rule not frozen
    target: >-
      experiments/EXP-IT-001/specification.v2.yaml
      inputs.cost_ledger; metrics.primary; heur_iso_1_decision_rule.sampled_quantity
    detail: >-
      cost_ledger defines how to charge a "chosen transfer path" but does not
      freeze which path/endpoint is chosen when several specials exist within
      ell_max/hops_max (first BFS discovery vs argmin R_xfer; same-depth
      neighbor iteration order; mixed-prime MITM vs HEUR 2-isogeny arm).
      Because C_special differs by endpoint family, R_xfer is not a function of
      the instance alone. An Executor can avoid F1 / force RATE pass by
      reporting an expensive certificate when a cheaper one exists — the
      opposite of the objective "whether paths can beat matched rho".
    required_fix: >-
      Freeze R_xfer := minimum charged ratio among all certificate-bearing
      paths found within budget (attack-favorable / objective-aligned), or
      alternately freeze a unique BFS selection rule (layer order, neighbor
      order by increasing j, first special) and require that same rule for
      both H_min and R_xfer on the HEUR arm; state MITM aggregation explicitly
      if mixed-prime search remains allowed.

  - id: B-7
    supersedes_or_residual_of: B-4
    title: NULL-IT-ISOGENY-TRANSFER graph construction not a closed algorithm
    target: >-
      experiments/EXP-IT-001/specification.v2.yaml
      inputs.null_object.construction
    detail: >-
      Construction requires a deterministic pseudorandom 3-regular simple
      undirected graph with edges from SHA256 stubs "with rejection to ensure
      ... pairing recorded in the null builder receipt". Missing: vertex set
      (all j in F_p vs U(bits) vs instance-local ball); exact configuration /
      stub-pairing algorithm; rejection and non-termination fallback; whether
      lazy neighbor oracles must be undirected-consistent. Deferring the pairing
      to a builder receipt is post-freeze invention — two Executors can produce
      different null graphs with the same null_object_spec_hash (hash omits the
      pairing algorithm). Validator cannot recompute R_null.
    required_fix: >-
      Freeze a complete deterministic null-neighbor algorithm from null_seed
      (vertex set, pairing/config-model steps, failure rule) such that
      neighbors(v) is uniquely determined before any null walk, and include
      that algorithm id in null_object_spec_hash.

  - id: B-8
    supersedes_or_residual_of: B-4
    title: CTRL-NULL-IT-PLANT detection predicate not frozen
    target: >-
      experiments/EXP-IT-001/specification.v2.yaml
      inputs.null_object.planted_bug_positive_control; controls.CTRL-NULL-IT-PLANT
    detail: >-
      IDEA-20260731-011 requires a planted false speedup that the null control
      FLAGS, classically by R_null also being low. v2 plants "artificially
      divide reported C_path by 4 on one real arm receipt" and allows detection
      via "R_null also low or plant_detected=true". A reporting-only real-arm
      cut does not move R_null; plant_detected has no frozen boolean predicate
      (e.g. recompute C_path from the raw edge ledger and flag
      reported <= recomputed/4 + eps). Success_criterion requires the plant
      detected — not Executor-decidable as written.
    required_fix: >-
      Freeze a plant injection + independent detection predicate (shared-code
      bug that also lowers R_null, or a Validator-recomputable packaging check
      on raw ledgers), with explicit pass/fail bits in
      null_it_isogeny_transfer_report.json.

