prior_blocker_discharge:
  B-1:
    title: HEUR-ISO-1 F_hit / regularity / min_ell pre-registration
    status: DISCHARGED
    detail: >-
      v2 freezes graph_regularity_d=3; defines min_ell RV as H_min (BFS hop
      count on the ordinary 2-isogeny graph, hops_max=floor(log2(N)/2)); gives
      a deterministic F_hit(h; rho, d) via infinite d-regular tree ball_size
      survival; requires F_hit_table_by_bits in HEUR_ISO_1_report.json before
      path search. KS/TAIL abscissa is hops, not composite degree. An
      independent Validator can recompute F_hit without post-freeze invention.
  B-2:
    title: Special-family detectors and rho_special universe
    status: NOT_FULLY_DISCHARGED
    detectors_status: DISCHARGED
    density_universe_status: BLOCKING_RESIDUAL
    detail: >-
      Detector predicates are now decidable: anomalous iff #E(F_p)==p;
      embedding threshold_k_max=6 with N|(p^k-1); Weil-descent n in {2,3,4}
      with non-descent of N (false for default prime-field sampler). However
      density universe U_IT_ORDINARY_PRIME_ORDER does not uniquely designate
      the prime N used by detectors per retained j-class (prime-order subgroup
      vs any bits-bit prime factor of #E; cofactor bound; multi-factor
      collision rule). rho_special is therefore not uniquely recomputable
      (see B-5).
  B-3:
    title: C_path / C_special / ell_max cost accounting
    status: NOT_FULLY_DISCHARGED
    formulas_status: DISCHARGED
    aggregation_status: BLOCKING_RESIDUAL
    detail: >-
      cost_ledger freezes ell_max as composite path-degree cap floor(N^{1/2})
      with separate hops_max; C_path=C_search+C_eval with BFS/MITM edge charges
      and c_iso(ell)=4*ell; per-family C_special closed formulas; C_pullback;
      R_xfer identity vs matched_rho=0.886*sqrt(N); censorship lower bound;
      ±10x on C_eval only. Residual: which transfer path / special endpoint
      enters R_xfer is not frozen (first BFS discovery vs min R_xfer over
      certificates within budget; same-depth neighbor order). Primary gate and
      F1 are Executor-manipulable without an aggregation rule (see B-6).
  B-4:
    title: IDEA-011 isogeny-transfer null object
    status: NOT_FULLY_DISCHARGED
    identities_status: DISCHARGED
    construction_status: BLOCKING_RESIDUAL
    plant_detector_status: BLOCKING_RESIDUAL
    detail: >-
      NULL-IT-ISOGENY-TRANSFER names mechanism class, R_null identity, gate
      R_null>=0.95 when R_xfer<0.7, packaging hash fields, and CTRL-NULL-IT-PLANT
      / CTRL-NULL-IT-RHO. Residual: the 3-regular null graph construction is not
      a closed deterministic algorithm (vertex set, stub-pairing/rejection
      procedure, failure rule deferred to "null builder receipt"); CTRL-NULL-IT-PLANT
      detection predicate is not frozen (reporting-only 4x C_path cut does not
      make R_null low; plant_detected algorithm unspecified). See B-7 / B-8.

