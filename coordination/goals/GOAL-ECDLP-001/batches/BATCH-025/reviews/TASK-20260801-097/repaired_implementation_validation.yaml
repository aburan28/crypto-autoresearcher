  blockers:
  - id: VAL097-B1
    requirement: Enforce one cumulative CPU/wall budget across the initial attempt and the single resume, stopping at the next record boundary.
    repair: >-
      On every failure overwrite, rather than setdefault, cumulative CPU, wall
      and peak RSS using the final process-tree sample plus prior charged usage;
      persist it before re-raise, reload it on resume, and check wall at every
      returned record. Add a bounded interruption/resume test with nonzero
      synthetic pre-checkpoint and post-checkpoint resource charges.
  - id: VAL097-B2
    requirement: Classify worker, dependency and process-pool failures as infrastructure outcomes and test their cleanup/resume boundary.
    repair: >-
      Distinguish certificate/seed/hash integrity exceptions from worker-pool,
      dependency, OS and interruption failures. Preserve checkpoint-verified
      shards for the latter under failed_infrastructure_or_budget and add a
      bounded worker-process crash or injected executor-failure control; N=0 is
      an integrity fixture, not an infrastructure fixture.
  - id: VAL097-B3
    requirement: Record every stop, checkpoint and resume event in the durable manifest and final feasibility result.
    repair: >-
