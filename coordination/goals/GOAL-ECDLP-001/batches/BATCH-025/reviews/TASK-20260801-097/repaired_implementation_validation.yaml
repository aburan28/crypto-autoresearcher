  - metric: process-tree CPU and peak RSS mechanics
    status: partial
    blocker_id: VAL097-B1
    evidence: >-
      Successful records return worker CPU and RSS and the monitor enforces
      conservative parent-plus-worker limits. However, after an interruption,
      the exception handler loads the last checkpoint and uses setdefault for
      cpu_seconds, wall_seconds and peak_rss_bytes. Existing checkpoint values
      therefore suppress the fresh failure sample. A resume reloads those stale
      values, so work performed after the last checkpoint is not charged to the
      same global CPU/wall ceilings.
  - metric: wall-clock ceiling boundary
    status: fail
    blocker_id: VAL097-B1
    evidence: >-
      CPU and RSS are checked at every returned factor record, but wall time is
      checked only in checkpoint_callback after a complete 32704-record shard.
      The frozen stop rule requires a ceiling crossing to stop at the next
      record boundary.

