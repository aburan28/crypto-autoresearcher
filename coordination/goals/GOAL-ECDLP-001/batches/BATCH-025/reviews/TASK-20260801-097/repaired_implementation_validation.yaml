  - check: cumulative one-resume budget and event integrity
    status: fail
    blocker_id: VAL097-B1
    evidence: >-
      The checkpoint/resume control checks shard state only. It does not test
      cumulative CPU or wall charging across an interrupted attempt, and the
      implementation's stale setdefault behavior demonstrably cannot preserve
      those cumulative values.
  - check: worker interruption interpretation
    status: fail
    blocker_id: VAL097-B2
    evidence: >-
      The named worker-failure fixture submits N=0, deliberately causing an
      IntegrityError for invalid scientific input. It does not simulate a
      worker crash, dependency failure or BrokenProcessPool. At top level every
      exception other than ResourceCapError is labeled invalid_integrity, so an
      actual worker/dependency infrastructure failure would be misclassified
      and made non-resumable, contrary to the frozen outcome and resume rules.
  - check: stop, checkpoint and resume event coverage
    status: fail
    blocker_id: VAL097-B3
    evidence: >-
      Checkpoint events are recorded, but no explicit resume event is appended.
      Failure handling stores error fields without adding a stop event, and a
      subsequently completed feasibility result always emits stops as an empty
      list. The required every-stop/checkpoint/resume event history is therefore
      not preserved.

