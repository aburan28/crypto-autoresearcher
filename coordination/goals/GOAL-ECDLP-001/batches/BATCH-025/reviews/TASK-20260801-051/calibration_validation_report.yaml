validation_report:
  id: VAL-20260801-006
  task_id: TASK-20260801-051
  role: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  archived_by: TASK-20260801-060
  claim_tier: toy
  run_ids:
  - RUN-LPF-001-calib

  verdict: passed
  admissibility_verdict: ADMISSIBLE
  verdict_scope: >-
    ADMISSIBLE as a research receipt. The package is a complete, internally consistent and
    independently reproducible record of what the instrument did on OBJ-NULL-UNIF,
    OBJ-NULL-SYNTH, OBJ-CTRL-PRODUCT and the two plant ladders. It says NOTHING about
    H-LPF-001, HEUR-DS-1, H-SMTH-001, H-DS-001, H-EQD-001 or H-DEP-001 in either direction,
    supports no ECDLP claim, demonstrates no speedup and authorizes no promotion. This report
    freezes no threshold, endorses no band, selects no branch and strikes no statistic;
    TASK-20260801-052 owns the freeze and TASK-20260801-054 owns the open items. Two findings
    below (D1 and D9) are material to how the movement table may be read at that freeze and
    are reported as measured facts, not as adjudications.

  snapshot_under_review:
    commit: 104d32faff09207740f980be3c7dc8faa3642110
    parent: 59250c56827119465e0bfab6a31a334aae99ad23
    read_at_commit: true
    working_tree_only_receipt_refused: not_applicable
    snapshot_is_ancestor_of_HEAD: true
    declared_path_count: 15
    changed_paths_equal_declared_paths: true
    receipt_source_path_sha256_entries: 14
    all_receipt_hashes_match_at_snapshot_and_live: true
    receipt_hash_check_note: >-
      The receipt hashes 14 of the 15 declared paths (every path except the receipt itself).
      I recomputed each from the blob at 104d32fa and from the working tree; all 28
      comparisons agree with the receipt.

  inference:
    requested_policy: review-adversarial
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the GPT-5.6-family policy aliases in
      orchestration/model-policies.yaml; subagent frontmatter supports only Claude models, so
      the session ran on the inherited Claude backend.
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      `python3 -m orchestration.adapter doctor --probe` was not run in this session, so the
      model identifier is unverified configuration.
    independent_session: true
    independence_caveat: >-
      THIS HARNESS RESOLVES AUTHOR AND REVIEWER TO THE SAME MODEL. Independence here is
      PROCEDURAL - a separate session, code written in this session, no access to the
      producer's reasoning - and NOT model-level. Correlated blind spots between author and
      reviewer are not excluded. Every load-bearing number below was therefore RECOMPUTED
      from the archived arrays or regenerated from the recorded seeds with code written here,
      or checked against an external library (sympy), rather than reasoned about.

  # ======================================================================
  # PRIORITY DUTY 1 - THE PERTURBATION MOVEMENT TABLE, ROW BY ROW
  # ======================================================================
  movement_table_verification:
    source: experiments/EXP-LPF-001/results/calib/perturbation_movement_report.json
    rows_declared: 210
    rows_present: 210
    coverage_check: >-
      One row per (family, rung, cell, statistic) with no rung missing. Expected set =
      {OBJ-CTRL-PRODUCT (no rung)} + {OBJ-PLANT-SMOOTH, OBJ-PLANT-ROUGH} x 7 rungs, all x 2
      cells x 7 statistic ids = 210. Computed set equals expected set exactly; zero missing,
      zero extra, zero duplicates.
    recomputation_method: >-
      For each of the 210 rows I recomputed null_mean, null_sd (ddof=1), null_min, null_max
      from the archived 200-value LPF-CAL-A replicate array for that (cell, statistic); the
      shift as (plant_mean - null_mean) / null_sd; the movement flag as |shift| >= 1; the
      auxiliary record as plant_mean outside [null_min, null_max]; and the band as the 2nd
      and 199th ascending order statistics of the same 200 values.
    rows_recomputed: 210
    rows_disagreeing: 0
    max_absolute_discrepancy_over_all_recomputed_fields: 0.0
    misreported_rows_found: none
    plant_mean_provenance_note: >-
      The 20 per-replicate plant values behind each plant_mean are NOT archived; only the
      summary (mean, sd, min, max) is. I therefore verified plant_mean by a full end-to-end
      re-execution of the recorded command from the recorded revision, which reproduced all
      210 rows identically (see reproducibility below), and additionally by regenerating
      individual plant replicates from the recorded streams. This is a recorded limitation of
      the archive, not a defect of the numbers.
    certifying_statistics_that_fail_to_move_on_any_rung_of_any_ladder:
    - statistic_id: STAT-TAIL-DEEP
      plant_rows: 28
      rows_flagged_moved: 0
      max_absolute_shift_in_null_sd: 0.3379820826156079
      max_shift_location: OBJ-PLANT-ROUGH, gamma 0.05, bits 20
      auxiliary_range_reading_moved: false
      product_control_shift_bits_16: 13.484
      product_control_shift_bits_20: 16.732
      product_control_detection: 20 of 20 at both cells
      executor_claim_verified: >-
        EXACT. The reported 'moved at no rung of either ladder at either cell, largest
        absolute shift 0.338 null sd across all 28 plant rung-cell pairs' recomputes to
        0.33798 and 0/28 flags. The product-control shifts recompute to +13.484 and +16.732.
    - statistic_id: STAT-RATE-u@u_target=6
      plant_rows: 28
      rows_flagged_moved: 0
      max_absolute_shift_in_null_sd: 0.4808835
      executor_claim_verified: 'EXACT. Reported max 0.481; recomputed 0.4809.'
    other_inert_rung_claims_checked:
    - claim: STAT-RATE-u at u_target 5 under OBJ-PLANT-ROUGH moves at no rung of either cell
      recomputed_max_abs_shift: 0.8292
      verdict: confirmed
    - claim: >-
        STAT-RATE-u at u_target 5 moves only on OBJ-PLANT-SMOOTH at gamma 0.02 and 0.05 at
        bits 16 and at gamma 0.05 at bits 20
      recomputed_moved_set: 'SMOOTH/0.02/b16 = 1.839; SMOOTH/0.05/b16 = 4.929; SMOOTH/0.05/b20 = 1.516'
      verdict: confirmed
    - claim: STAT-KS-DICK moves nothing below gamma 0.02
      recomputed_max_abs_shift_below_gamma_0_02: 0.9554883266525243
      verdict: confirmed
    - claim: OBJ-PLANT-ROUGH at gamma 0.0005, 0.001 and 0.002 moves no certifying statistic
      recomputed_max_abs_shift_at_those_rungs: '0.330, 0.330, 0.447 respectively; zero flags'
      verdict: confirmed
    - claim: OBJ-PLANT-SMOOTH at gamma 0.0005 moves only STAT-RATE-u at u_target 4
      recomputed_moved_set: 'RATE-u@4 at bits 16 = 1.685 and at bits 20 = 2.048; nothing else'
      verdict: confirmed
    full_move_matrix_recomputed:
      note: >-
        Counts of rung-cell pairs (out of 14 per family) whose |shift| >= 1, recomputed by me.
      OBJ-PLANT-SMOOTH: 'RATE-u@2 9, RATE-u@3 12, RATE-u@4 14, RATE-u@5 3, RATE-u@6 0, KS-DICK 4, TAIL-DEEP 0'
      OBJ-PLANT-ROUGH: 'RATE-u@2 7, RATE-u@3 5, RATE-u@4 2, RATE-u@5 0, RATE-u@6 0, KS-DICK 3, TAIL-DEEP 0'

  # ======================================================================
  # PRIORITY DUTY 2 - INDEPENDENT REFACTORING
  # ======================================================================
  factorization_verification:
    claim_under_test: >-
      LPF_factorization_verified_fraction 1.0 on 68950136 factorizations with zero failures.
    independent_reverification_method: >-
      I regenerated sample sets from the recorded seed scheme in my own code
      (draw_seed(k) = int(sha256("<seed>:<name>:<k>")[:16], 16) re-implemented from the
      manifest, not imported), obtained the driver's p_max for those exact arrays by
      executing its Factorizer, and then re-factored a uniformly random subsample with a
      SECOND path sharing no code with the driver - sympy.factorint - checking four things
      per sample - (a) the returned prime powers multiply back to N exactly in Python
      integers, (b) every returned base is prime under sympy.isprime AND under a
      random-base Miller-Rabin routine written in this session (25 random bases, disjoint
      from the driver's fixed base set), (c) the driver's recorded p_max equals
      max(sympy.factorint(N)), and (d) that maximum genuinely dominates every other returned
      factor.
    uniform_arm_samples_reverified: 12000
    uniform_arm_breakdown: >-
      6000 per cell, drawn from five distinct LPF-CAL-A replicates per cell (k = 0, 7, 55,
      123, 199), 1200 uniformly random indices per replicate.
    uniform_arm_results:
      product_reconstructs: 12000 of 12000
      every_factor_independently_prime: 12000 of 12000
      recorded_pmax_equals_independent_largest_prime: 12000 of 12000
      disagreements: 0
    plant_arm_samples_reverified: 1600
    plant_arm_breakdown: >-
      400 replaced values per family per cell at the top rung gamma 0.05 (OBJ-PLANT-SMOOTH
      and OBJ-PLANT-ROUGH, bits 16 and bits 20), sympy-factored and compared against the
      p_max the plant construction assigns from its known factor list.
    plant_arm_results:
      product_reconstructs_and_pmax_agrees: 1600 of 1600
      disagreements: 0
    total_independently_reverified: 13600
    count_arithmetic_reconciled: >-
      The 68950136 total reconciles exactly - (200 LPF-CAL-A + 20 + 20 LPF-CAL-B + 20
      LPF-CAL-C) x 130816 x 2 cells = 68024320 batch factorizations, plus 925816 plant
      replacement values verified by the known-factorization path, summing to 68950136. The
      925816 equals the sum of replacements_effected over all 28 rung-cell pairs in the
      archived construction accounting (926160 requested minus 344 construction fallbacks).
      The 20000 pilot factorizations are correctly EXCLUDED from the count.
    verification_semantics_note: >-
      `Factorizer.factor` grants verified_count = n only if the elementwise product identity
      holds for the whole array AND no residual fails Miller-Rabin; otherwise it grants 0 and
      raises. This is stricter than per-sample accounting, not weaker, and any single failure
      would have stopped the run. Recorded here so the 1.0 is not read as a per-sample
      average that could hide a failure.
    verdict: >-
      No disagreement in 13600 independent re-factorizations. The 1.0 stands on this sample.
      I did not and cannot re-factor all 68950136; the claim is verified on a sample and by
      full re-execution, not exhaustively.

  # ======================================================================
  # ARTIFACT, SCHEMA AND INTEGRITY CHECKS
  # ======================================================================
  artifact_checks:
  - check: all 15 declared paths exist at the snapshot and parse
    result: pass
    detail: >-
      14 executor artifacts plus the snapshot receipt. All JSON parses, all YAML parses, the
      driver imports and its AST is well formed, stderr.log is present and empty.
  - check: check_run indexes the run
    result: pass
    detail: >-
      tools/validate_ledger.py check_run on
      experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/manifest.yaml returns zero errors - all
      of id, experiment_id, status, code, environment, inputs, timing, result present;
      code.commit and code.command present; command.txt, environment.json, stdout.log,
      stderr.log and raw-result.json all present beside the manifest; certificate.kind
      'none' accepted.
    caveat: >-
      A whole-repository `python3 tools/validate_ledger.py` FAILS with 1169 pre-existing
      errors, none of which mentions EXP-LPF-001, RUN-LPF-001-calib or any LPF record. That
      backlog is outside this task's scope and is not attributed to this package.
  - check: DRIVER_SHA256 equality across the measurement boundary (ATS-LPF-1 clause 3)
    result: pass
    detail: >-
      786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65 is the value I
      computed from the file at the snapshot; it equals the manifest's code.driver_sha256,
      environment.json's driver_sha256, the value in command.txt, the execution report's
      driver_sha256, the TASK-20260801-050 receipt's DRIVER_SHA256, and the sha256 of the
      live file at HEAD. Six-way agreement, so the equality TASK-20260801-058 must check is
      enforceable.
  - check: specification hash binding
    result: pass
    detail: >-
      specification.yaml hashes to 0d6c946fb84073feae47865da9b787b7d7ba459617834644680a06bf886d1cda,
      equal to SPEC_SHA256_AT_FREEZE in the driver and to the manifest; the contract commit
      ba1567ee is an ancestor of the run commit 59250c56. The driver refuses to start on a
      spec hash mismatch (exercised indirectly - the check is at main() entry).
  - check: environment record integrity
    result: pass
    detail: >-
      sha256 of json.dumps(env, sort_keys=True) recomputes to
      b432d07c6610a02a7db8ad344061376228348be2d78f6701d11d7102982a7d11, matching both the
      manifest's environment_record_sha256 and raw-result.json's environment_sha256_of_record.
      Note the recorded hash is over the canonicalized JSON, not the file bytes (the file
      bytes hash to 2b1770e9...); that is the driver's own semantics and is consistent, but
      the field name does not say so.
  - check: git_status_prerun.txt archived and consistent
    result: pass
    detail: >-
      Records commit 59250c56, branch feat/ecdlp-harness-experiments-54a06f, contract-commit
      ancestry YES, and exactly two untracked paths (the implementation and runs directories
      this task produced). This matches environment.json's independently captured git block
      and the manifest's dirty_tree_detail. No tracked file was modified.
  - check: sample counts and scope as contracted
    result: pass
    detail: >-
      R_CAL 200, R_IDENT 20, R_PROD 20, R_PLANT 20, both cells (bits 16 and 20), both ladders
      at all seven rungs 0.0005 to 0.05, n = C(512,2) = 130816 per sample set, tail_rank 10,
      band ranks 2 and 199, Bsm ladders element-for-element as frozen. No scope reduction
      anywhere; the archived arrays have exactly 200 and the movement table exactly 7 rungs
      per family per cell.
  - check: pilot gate ran first and its projection is recorded
    result: pass
    detail: >-
      stdout.log line 2-3 shows the pilot gate before any bulk work; the archived gate
      records the MEASURED per-cell rate and a MODELED total of 3228.8 s against a 14400 s
      budget with abort false. My re-execution produced a different projection (3065.4 s),
      which is the correct behaviour for a quantity extrapolated from a measured rate and
      confirms it is not a hardcoded number. No budget event, no resource stop, no scope
      reduction; measured wall clock 1305.1 s, peak RSS 0.164 GB against an 8 GB limit.
  - check: raw versus summary agreement at tolerance zero
    result: pass
    detail: >-
      dickman_reference_reproduction.json, the 210 movement rows, the identity report, both
      cells' LPF-CAL-A blocks, limb_b_absolute blocks and LPF-CAL-D detection blocks are
      OBJECT-IDENTICAL to their counterparts inside raw-result.json. Not 'within tolerance' -
      equal.

  seed_and_stream_checks:
  - check: seed scheme reproduces the archived samples
    result: pass
    detail: >-
      Re-implementing draw_seed from the manifest description, I regenerated LPF-CAL-A
      replicates 0 and 199 at both cells and recomputed all five STAT-RATE-u values and
      STAT-TAIL-DEEP with my own counting code. All 24 recomputed values equal the archived
      replicate values exactly (bit-identical floats), which binds the archived statistics to
      the recorded seeds.
  - check: prime table binding
    result: pass
    detail: >-
      The sieved trial-division table's sha256 recomputes to the descriptor value at both
      cells.
  - check: calibration streams disjoint from the reserved measurement stream
    result: pass
    detail: >-
      Stream offsets 100000, 200000, 300000, 400000, 500000, 600000, 700000 for calibration
      against 900000 for measure_uniform_ks2; each stream's seed is MASTER_SEED + offset +
      bits with bits in {16, 20}, so no calibration seed can reach the measurement seed
      (nearest gap 199984). The real arm carries no sampling seed at all.

  # ======================================================================
  # STRUCTURAL BLINDNESS - THE MEASUREMENT ARM WAS NOT RUN
  # ======================================================================
  control_checks:
  - control: measurement arm not invoked, at object level and not merely label level
    result: pass
    method: >-
      AST call-graph closure over the driver, computed in this session - I took the transitive
      closure of every identifier referenced from run_calibration and checked it against the
      forbidden set. deterministic_factor_base, int1_fibre_invariants, run_measurement,
      upper_triangle_indices and _independent_pmax_recheck are ALL unreachable and none is
      even mentioned in run_calibration's body. encode_enc_b IS reachable, correctly - it is
      ENC-B applied to uniform (e_1, e_2) in draw_synth, which is the declared apparatus
      identity object and not the Semaev specialization. The only callers of the real-object
      functions are run_measurement and _independent_pmax_recheck, neither reachable.
      CalibrationCell stores only p (and X, D); it never builds the x-coordinate membership
      array, never selects the first 512 x-coordinates, and does not retain a or b.
  - control: tripwire and recorded flags
    result: pass
    detail: >-
      LPF_real_object_touched is false in raw-result.json and in my own re-execution; the
      module tripwire remained False through every gate test I ran. No real-object sample
      exists anywhere in the package - the only integers are uniform draws on [1, p**2],
      ENC-B images of uniform pairs, the ENC-A product control and the two plant families.
  - control: the two-gate refusal, EXECUTED not merely read
    result: pass
    detail: >-
      I executed the driver in measure mode in a scratch directory. With no approval receipt
      it refuses ('MEASUREMENT REFUSED - no approval receipt supplied'), status invalid, rc 1,
      tripwire still False. With a receipt whose APPROVAL_DETERMINATION is 'PENDING' it
      refuses naming the value. With an APPROVED receipt but no reading rule it refuses
      ('THERE IS NO READING RULE YET UNTIL TASK-20260801-052 freezes one') and prints the
      expected schema. Unit-testing _load_reading_rule directly - a rule missing
      certifying_set_retained is refused; a rule with frozen false is refused; a rule with no
      frozen key is refused. Calib mode with a DENIED receipt returns rc 2 and with no receipt
      returns rc 2. At no point did the tripwire flip.
    limitation_D5: see defects_and_observations D5 - the per-band completeness refusal was
      verified by SOURCE only, deliberately.
  - control: positive control (OBJ-CTRL-PRODUCT)
    result: pass
    detail: >-
      Detected under DET-LPF-1 by all seven statistic ids at both cells, 20 of 20 rejections
      each, with shifts I recomputed as 251 to 1097 null sd for the rate and KS statistics
      and 13.5 / 16.7 for STAT-TAIL-DEEP. So the apparatus is not globally inert - the
      null-object machinery detects a derivably smoother object.
  - control: null objects of the same shape
    result: pass
    detail: >-
      The measured signal here is the apparatus itself, and it is read against two null
      objects - OBJ-NULL-UNIF (200 replicates per cell) and OBJ-NULL-SYNTH (the ENC-B image
      of uniform pairs, declared in advance to be the SAME distribution by bijection, so its
      agreement is explicitly not corroboration). Identity rejection counts under reading (ii)
      are 4, 3, 3 and 1 of 140 comparisons against a 4/201 per-comparison false-fire rate
      (expectation 2.8), and no cut is frozen on them.
  - control: decay of the measured quantity in the parameter meant to drive it
    result: pass_with_one_exception
    detail: >-
      Inventor-protocol section 3 asks whether the quantity behaves as it should as the
      driving parameter changes. I recomputed the |shift|-versus-gamma profile for all 28
      family-cell-statistic sequences. Every statistic that moves at all grows monotonically
      in gamma, and the non-monotonicities are confined to the sub-noise region (|shift| < 1)
      where the sign is noise - EXCEPT ONE, recorded as D9 below. Separately,
      LPF_decay_monotone_flag_uniform_arm is true at both cells and I confirmed the five
      pooled p_hat(u) values are strictly decreasing in u and equal the means of the archived
      200-replicate arrays exactly.

  # ======================================================================
  # METRIC RECOMPUTATIONS
  # ======================================================================
  metric_recomputations:
  - metric: the uniform arm's R(u) at every rung
    method: >-
      Recomputed twice - once as mean(archived 200 p_hat values) / rho_driver(u), and once
      against a Dickman solution I wrote in this session using a different quadrature scheme
      (Simpson on the lag integral of rho'(u) = -rho(u-1)/u at step 1e-4) from the driver's
      implicit composite-Simpson delay-equation solve.
    bits_16: '1.1702, 1.4522, 2.0521, 4.5709, 11.5937'
    bits_20: '1.1279, 1.3055, 1.6443, 2.4453, 5.0386'
    agreement: >-
      All ten values reproduce to four decimal places under both routes; the largest
      difference between my independent rho and the driver's rho at any evaluated u is
      8.7e-06 relative (at u = 6.0129).
    u_recomputation_check: >-
      Every u was re-derived from the integer Bsm by u = ln(D)/ln(Bsm) and matches the
      archived u_recomputed exactly, including the non-integer rungs 2.999875, 5.006009,
      6.012858 (bits 16) and 3.000009, 5.994822 (bits 20). No target value was substituted
      for a recomputed one.
    limb_b_decidability: >-
      CONFIRMED INDEPENDENTLY. At bits 16, u_target 6, the KNOWN-UNIFORM arm's own mean R(u)
      is 11.5937, which lies OUTSIDE the frozen [1/8, 8] band, so LPF_limb_b_decidable_flag
      is false there and LIMB B IS NOT DECIDABLE AT THAT RUNG. Every other rung at both cells
      is inside the band. This is a property of the reference at finite X measured against a
      known-uniform arm; it is not a statement about the Semaev map and this report draws no
      such statement from it.
  - metric: the Dickman reference itself
    method: >-
      Independent numerical solution of the delay equation in this session by a different
      scheme, compared against both the frozen table and the driver's solved grid.
    driver_versus_frozen_table_worst_relative: 1.5441749690432644e-05
    recomputed_from_archived_rows: >-
      I recomputed the relative_discrepancy column of every row of
      dickman_reference_reproduction.json from its own rho_computed_by_driver and
      rho_frozen_reference values; all six agree to 1e-12 and the maximum is exactly the
      recorded 1.5441749690432644e-05.
    my_solution_versus_frozen_table_worst_relative: 2.412286837202729e-05
    driver_versus_my_solution_worst_relative: 8.681e-06
    conclusion: >-
      The reference reproduces. The residual discrepancy against the frozen table is
      dominated by the table's own five-significant-figure rounding (my independent solution
      differs from the table by more than the driver's does at u = 6, in the same direction),
      not by solver error. The absolute limb rests on a rho that two independent solvers
      agree on to better than 1e-05 relative.
  - metric: the tenth-largest-Z replicate arrays the freeze will consume
    method: recomputed as ascending order statistics of the archived 200-value arrays
    bits_16: 'rank2 5.670319, rank199 6.726485, mean 6.084039, sd 0.208234'
    bits_20: 'rank2 5.348262, rank199 6.099011, mean 5.697344, sd 0.142123'
    agreement: >-
      Exact at every digit recorded, and the dedicated
      T_deep_replicate_values_for_the_freeze array is element-identical to the
      STAT-TAIL-DEEP entry of LPF_null_replicate_values, so there is one array and not two.
      I additionally regenerated replicates 0 and 199 from the seeds and recomputed T_deep
      with my own order-statistic code - bit-identical at both cells.
  - metric: the identity-leg comparison counts
    method: read and recomputed from the archived per-statistic counts
    result: >-
      reading (i) 4/60, 3/60, 3/60, 1/60 and reading (ii) 4/140, 3/140, 3/140, 1/140 for
      (bits 16 uniform, bits 16 synth, bits 20 uniform, bits 20 synth). The recorded
      reading_i_comparison_count is 60, not the contract's 80, precisely because STAT-KS2-CAL
      is non-certifying and uncomputed - which is the substance of OPEN-LPF049-A.

  # ======================================================================
  # OPEN ITEMS AND ANOMALIES ASSESSED
  # ======================================================================
  open_items_assessed:
  - id: OPEN-LPF049-A
    question: was any cut frozen for the apparatus-identity comparison count
    finding: >-
      NO CUT WAS FROZEN. The apparatus identity report carries counts only, both readings are
      recorded per statistic so either is computable downstream, the report states in terms
      that the exact binomial cut belongs to RR-LPF-1 at TASK-20260801-052, and there is no
      key anywhere in the package holding a cut, an alpha, or a rejection bar for this leg. I
      searched every emitted interval - all 210 movement rows and all 14 band records carry
      the NOT FROZEN band_status disclaimer, and the manifest records
      thresholds_frozen_by_this_run 0, bands_frozen_by_this_run 0,
      branch_selected_by_this_run null, disposition_stated_by_this_run null. Correctly routed
      to TASK-20260801-054; unresolved and left unresolved.
  - id: movement flag threshold
    question: is the 1.0 null-sd threshold a frozen cut, and is the range reading decisional
    finding: >-
      The flag is implemented exactly as |shift| >= 1.0 measured null sd, which is the literal
      unit the metric definition states, and every row carries the alternative range-based
      reading as movement_beyond_null_range_auxiliary_record with explicit text that it is not
      a decision variable, not a cut and not frozen. I verified BOTH readings row by row from
      the archived arrays; they agree on the inert statistics (STAT-TAIL-DEEP moves under
      neither reading at any rung) so no conclusion in this package depends on the choice.
      Recorded as ANOM-LPF049-6 and routed; not resolved here.
  anomalies_assessed:
  - id: ANOM-LPF049-1
    verdict: confirmed exactly, and see D1 for a mechanism I measured that the record does not state
  - id: ANOM-LPF049-2
    verdict: confirmed exactly (0.4809 and the three SMOOTH-only u=5 rungs)
  - id: ANOM-LPF049-3
    verdict: >-
      confirmed exactly, and DIAGNOSED - see D6. The sign flip is the KS argmax switching
      between its two one-sided suprema, which is an instrument property and not a
      distributional reversal.
  - id: ANOM-LPF049-4
    verdict: >-
      confirmed as to counts, imprecise as to percentage - see D3. Total fallbacks 344 of
      926160 requested (0.0371 percent); worst RATE 0.2217 percent, not 0.14 percent. Smooth
      family zero fallbacks at every rung, confirmed.
  - id: ANOM-LPF049-5
    verdict: confirmed; counts recomputed, neither reading resolved, no cut frozen
  - id: ANOM-LPF049-6
    verdict: confirmed; both readings present in all 210 rows
  - id: ANOM-LPF049-7
    verdict: >-
      confirmed as a forward risk statement about the reading-rule schema; see D5, which
      makes it concrete.

  # ======================================================================
  # DEFECTS AND OBSERVATIONS
  # ======================================================================
  defects_and_observations:
  - id: D1
    severity: material_to_the_freeze
    blocking_admissibility: false
    title: STAT-TAIL-DEEP's inertness is structural, not low power, and I measured the witness
    finding: >-
      Neither plant family can place a value in the region of Z-space that STAT-TAIL-DEEP
      measures. At the TOP rung gamma 0.05 I regenerated the planted values and computed
      their Z directly - the MAXIMUM Z over all 6541 planted OBJ-PLANT-SMOOTH values is 4.957
      at bits 16 and 4.643 at bits 20, while the null's tenth-largest Z is about 6.061 and
      5.762 respectively. OBJ-PLANT-ROUGH is bounded by Z < 2 by construction. So no planted
      value at any rung can enter the top ten of the Z distribution; the only effect a plant
      can have on T_deep is to EVICT null samples from that tail, which pushes T_deep
      slightly DOWN - and every one of the 28 shifts is near zero and predominantly negative,
      exactly as that mechanism predicts.
    consequence: >-
      'No movement at any rung' here is not a statement about sample size or gamma reach, and
      raising gamma or the replicate count will not change it - the ladders are disjoint in
      construction from the statistic they were run to certify. Whatever TASK-20260801-052
      decides under the contract's strike rule, the record should say THIS rather than 'low
      power', and the same question should be asked of STAT-RATE-u at u_target 6, whose rung
      (Bsm 40 / 102) is likewise far outside the plants' reach. I adjudicate nothing.
  - id: D9
    severity: material_to_the_freeze
    blocking_admissibility: false
    title: an unrecorded above-noise non-monotonicity at a TOP rung
    finding: >-
      One sequence moves at an intermediate rung and then FAILS to move at the top rung -
      OBJ-PLANT-ROUGH, STAT-KS-DICK, bits 20 - with shifts -0.020, -0.049, -0.122, -0.358,
      -0.687, -1.403, -0.759 across gamma 0.0005 to 0.05. The movement flag is therefore TRUE
      at gamma 0.02 and FALSE at gamma 0.05. It is the only such row in the table (I checked
      all 28 sequences). This is the canonical artifact tell named in inventor-protocol
      section 3 - the quantity did not grow when the parameter meant to drive it grew - and it
      is not covered by ANOM-LPF049-1 through 7. The same D+/D- crossover in D6 explains it,
      which makes it an instrument property of STAT-KS-DICK rather than a data error, but it
      is decision-relevant because the contract's own rule keys the strike on the TOP rung.
    action: >-
      Should be carried as a new anomaly by the Coordinator and read at TASK-20260801-052 and
      TASK-20260801-054. The numbers themselves are correct and archived; this is a reading
      hazard, not a computation error.
  - id: D6
    severity: observation
    blocking_admissibility: false
    title: the KS-DICK sign flip between cells, diagnosed
    finding: >-
      I recomputed the two one-sided Kolmogorov-Smirnov suprema separately on regenerated
      replicate 0. Null - D+ 0.04919, D- 0.00030 at bits 16; D+ 0.03824, D- 0.00006 at bits
      20. Under OBJ-PLANT-SMOOTH at gamma 0.05 - bits 16 gives D+ 0.04658, D- 0.04382, so D+
      still wins and the KS value falls slightly (the recorded -4.278 sd); bits 20 gives D+
      0.03642, D- 0.04461, so D- overtakes and the KS value rises (the recorded +11.846 sd).
      The sign difference between cells is the argmax switching branch across a near-crossing,
      not two cells disagreeing about the direction of the perturbation.
    consequence: >-
      STAT-KS-DICK's shift SIGN carries no directional information near that crossing, and its
      magnitude is non-monotone there (D9). Anyone freezing a directional reading on
      STAT-KS-DICK must account for this. Recorded, not adjudicated.
  - id: D2
    severity: observation
    blocking_admissibility: false
    title: the movement metric mixes a 20-replicate mean with a 1-replicate standard deviation
    finding: >-
      plant_mean averages 20 plant replicates built on the SAME first 20 LPF-CAL-A base
      replicates, but the yardstick is the single-replicate null sd over 200 replicates, and
      the design is paired. I checked whether the inertness findings survive the tighter
      paired yardstick - against sd/sqrt(20) and against the base-20 mean rather than the
      200 mean, the largest STAT-TAIL-DEEP excursion is 0.797 and the largest STAT-RATE-u at
      u_target 6 excursion is 1.060, so the inertness conclusions are robust to the choice.
      The observation matters in the other direction - shifts like 502 or 1097 null sd on the
      product control are inflated by the same mixing and should not be read as effect sizes.
  - id: D3
    severity: minor_imprecision
    blocking_admissibility: false
    title: the rough-plant fallback percentage in ANOM-LPF049-4
    finding: >-
      The recorded 'worst case 182 of 130820 (0.14 percent)' is the largest fallback COUNT,
      not the largest fallback RATE. Recomputed rates - the worst is 0.2217 percent (29 of
      13080, bits 16, gamma 0.005), then 0.1718, 0.1527, 0.1391, 0.1376, 0.1185, 0.0769
      percent at bits 16 and at most 0.0769 percent at bits 20. Total 344 fallbacks over
      926160 requested replacements (0.0371 percent). Every fallback is counted and reported
      rather than dropped, and the effected count reconciles to the factorization total
      exactly, so nothing is hidden; the parenthetical is simply not the maximum.
  - id: D4
    severity: minor_integrity_gap
    blocking_admissibility: false
    title: the snapshot receipt does not bind its own commit
    finding: >-
      snapshot_commit_receipt.json has commit_sha null, both at the snapshot and at HEAD; only
      parent_sha is filled. I therefore verified the binding by reconstruction - the parent
      matches 59250c56, the commit's changed-path set equals the 15 declared paths exactly,
      all 14 hashed paths match at the snapshot blob and in the working tree, and 104d32fa is
      reachable from HEAD. The binding holds, but a receipt that names no commit cannot be
      checked against Git by field comparison alone, which is what the durable-commit rule
      asks of the dispatcher's verifier.
  - id: D5
    severity: forward_risk_to_the_measurement_arm
    blocking_admissibility: false
    title: the missing-band refusal is real but it fires AFTER the real object is touched
    finding: >-
      _load_reading_rule checks only for the presence of the keys bands, null_spread and
      certifying_set_retained and for frozen true; I confirmed by execution that it ACCEPTS a
      rule whose bands and null_spread are empty mappings. Per-statistic completeness is
      checked inside run_measurement's per-cell loop, which runs only AFTER
      deterministic_factor_base has been called and OBJ-REAL has been enumerated, specialized
      and factored at that cell. So a missing band is indeed a refusal and never a silent
      default - that claim is correct - but it is not a pre-flight refusal, and a run against
      an incomplete reading rule would touch the real object first. Worse, by source, a
      missing CELL key in bands or a missing null_spread entry for a statistic raises a bare
      KeyError, which is caught by neither the BudgetExceeded nor the IntegrityFailure handler
      and so would crash without writing the 'invalid' raw-result record.
    verification_status: >-
      The gate-order claim and the empty-mapping acceptance are VERIFIED BY EXECUTION. The
      KeyError claim and the position of the per-statistic check are VERIFIED BY SOURCE ONLY
      and are marked UNVERIFIED BY EXECUTION - deliberately. Exercising them requires running
      the measurement arm past both gates with a fabricated APPROVED receipt, which would
      touch OBJ-REAL before the reading rule is frozen. I declined to do that; it is outside
      my write scope and would defeat the blindness this batch is built on.
    action: >-
      TASK-20260801-052 and TASK-20260801-054 should require that reading-rule completeness -
      every cell, every statistic id in statistic_ids(bits), both bands and null_spread - is
      validated before the first call to deterministic_factor_base. Under ATS-LPF-1 clause 3
      that is a Coordinator amendment producing a NEW driver under a NEW hash, never an edit
      of the hash-bound file.
  - id: D7
    severity: observation
    blocking_admissibility: false
    title: environment_record_sha256 semantics
    finding: >-
      The recorded value hashes the canonicalized JSON object, not the archived file bytes.
      Both are reproducible and I verified the canonical form; the field name does not
      disclose which is meant, which costs a future validator a step.

  # ======================================================================
  # REPRODUCIBILITY
  # ======================================================================
  reproducibility:
    method: >-
      I re-executed the recorded command in full from the repository root at the current
      revision, with the recorded authorization receipt, writing to a scratch directory
      outside the repository. This is a from-scratch rebuild of the artifacts, not an
      assertion that they rebuild.
    command_reexecuted: >-
      python3 experiments/EXP-LPF-001/implementation/lpf001_driver.py --mode calib --out-run
      <scratch>/run --out-results <scratch>/results --authorization-receipt
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-048/snapshot_commit_receipt.json
    wall_clock_seconds_mine: 1259.6
    wall_clock_seconds_archived: 1305.1
    peak_rss_gb_mine: 0.148
    artifacts_regenerated_and_compared:
      perturbation_movement_report_json: identical, all 210 rows
      null_replicate_statistics_json: identical, all 2800 archived replicate values
      dickman_reference_reproduction_json: identical
      apparatus_identity_report_json: identical
      raw_result_per_cell_block: identical
      LPF_factorization_verified_count: 68950136, identical
      LPF_factorization_verified_fraction: 1.0, identical
      LPF_factorization_verification_failures: empty, identical
      LPF_real_object_touched: false, identical
      LPF_gamma_det_both_cells: identical
    fields_that_differed_and_why: >-
      Exactly four - wall_seconds, peak_rss_gb, environment_sha256_of_record (the environment
      block records this host and this timestamp) and pilot_budget_gate's MODELED projection
      (3065.4 s here against 3228.8 s archived). Every one of these is a host-dependent or
      timing-dependent quantity that the contract already labels MODELED or measured-resource,
      and none is a decision variable. No statistic, band, count or flag differed.
    verdict: >-
      The package reproduces bit-for-bit on every scientific field, on a different session and
      a different process, from the recorded command and revision alone.

  heuristic_validation_checks:
  - check: pre-registered prediction
    result: pass
    detail: >-
      The Dickman rho(u) prediction, the u_star formula u = ln(D)/ln(Bsm), the integer Bsm
      ladders, the [1/8, 8] absolute band, the gamma ladders and gamma_star are all fixed in
      specification.yaml at contract commit ba1567ee, which is an ancestor of the run commit
      and whose sha256 the driver asserts before it starts. Nothing was fitted after seeing
      data; the frozen rho table is used as a reproduction check on the driver's own solve and
      is never substituted into it, which I verified in source and by the fact that the
      driver's rho differs from the table in the fifth significant figure.
  - check: sample integrity
    result: pass
    detail: >-
      Sample size (130816 per set), replicate counts, master seed 2301, the stream naming
      scheme and every stream offset are in the manifest, and I regenerated archived
      replicates from them and reproduced the statistics exactly.
  - check: correspondence validity
    result: not_applicable
    detail: >-
      No correspondence substitutes for direct sampling in the calibration arm; the objects
      are drawn directly. OBJ-NULL-SYNTH is the ENC-B bijection applied to uniform pairs and
      is declared in advance to be the same distribution by derivation, so its agreement is
      explicitly not treated as corroboration - which is the correct handling.
  - check: scale binding
    result: pass_with_limitation
    detail: >-
      Two toy cells, p = 46663 and p = 767551, D = 2**32 and 2**40. The manifest records TOY
      TIER and states that nothing here transfers to crypto-scale D. AGENTS rule 7 is
      satisfied by the record and is restated in this report's limitations.
  cost_model_checks:
  - check: concrete cost table
    result: not_applicable
    detail: >-
      This receipt reports no cost model, no asymptotic claim and no per-attempt-cost times
      inverse-success-probability bookkeeping. The only cost-like quantity is the pilot budget
      projection, which declares its unit (seconds), declares its overhead multiplier
      pre-datum, labels itself MODELED rather than measured, and is explicitly not a decision
      variable. Memory is reported beside time (peak RSS 0.164 GB against an 8 GB budget).

  limitations:
  - >-
    TOY TIER, AGENTS rule 7. Two toy field cells only. Nothing in this report or in the
    package it validates transfers to cryptographic scale by any argument offered here.
  - >-
    NON-EVIDENTIAL. A passed validation means the receipt is admissible evidence about the
    apparatus and the reference. It is not evidence about the Semaev map, it does not support
    an ECDLP claim, it demonstrates no speedup and it authorizes no promotion or state
    transition.
  - >-
    The 20 per-replicate plant values behind each movement row are not archived. I verified
    plant_mean by full re-execution and by regenerating individual replicates, but a future
    reader of the archive alone cannot recompute a plant row without re-running the driver.
    Archiving the 20 plant values per row would make the movement table self-contained.
  - >-
    13600 of 68950136 factorizations were independently re-factored by a second code path.
    The 1.0 is verified on that sample and by full re-execution, not exhaustively.
  - >-
    The per-band completeness refusal inside run_measurement (D5) is verified by source and
    not by execution, because executing it would require touching OBJ-REAL under a fabricated
    approval receipt. It is reported as UNVERIFIED BY EXECUTION rather than as passing.
  - >-
    Independence is procedural, not model-level - this harness resolves author and reviewer to
    the same model. Every load-bearing number was recomputed or regenerated in this session to
    compensate, but correlated blind spots are not excluded.
  - >-
    A whole-repository ledger validation currently fails on 1169 pre-existing errors unrelated
    to any LPF record. I did not repair them and they are not attributed to this package.
  - >-
    I made no commit, edited no artifact, froze no threshold, selected no branch and stated no
    disposition. TASK-20260801-060 archives this report.

