  rt056_repair_assessment:
    RT056-B1:
      verdict: PASS
      finding: >-
        The sink writes at most cap_bytes minus bytes_written from each chunk,
        detects even one remaining byte, closes the read pipe, waits for
        pack-objects, and deletes only the named partial. Exactly-cap,
        cap-plus-one and nonzero-producer tests are mandatory. A separate
        committed implementation snapshot and independent validation remain
        explicit release gates; this review does not validate unwritten code.
      residual_implementation_attack: >-
        The implementation review must inject overflow, producer nonzero exit,
        write error and interruption between write, fsync and rename. It must
        bound stderr handling and process termination so waiting on the closed
        pipe cannot deadlock while a partial remains live.
    RT056-B2:
      verdict: PASS
      finding: >-
        The worktree and Git common directory are resolved separately by
        device number, mount source and mount point. The temporary pack and
        push TMPDIR are forced beneath the Git common directory. Separate
        split-device reservations exactly charge 1610612736 worktree bytes and
        5297483648 common-directory bytes; the same-device sum is 6908096384.
    RT056-B3:
      verdict: PASS
      finding: >-
        The exclusion ancestor is constrained to equal the independently
        passed authorized snapshot. Before implementation a streamed baseline
        pack from execution_remote_head excluding that snapshot is bounded by
        150000000 bytes and must satisfy measured_bytes plus 1350000000 at most
        1500000000. This rejects an oversized pre-existing range before a run.

