  objections:
  - id: RT057-B1
    severity: blocking_archive_scope_integrity
    finding: >-
      The baseline allowance says one future evidence commit changes exactly
      all 139 frozen required paths plus one archive receipt, while the same
      clause requires every implementation/control commit to already be an
      ancestor of execution_remote_head_sha and the release condition requires
      a separately snapshotted, independently validated sink implementation.
      Two of the 139 frozen required paths are pilot_driver.py and
      implementation.md. Under the repository's exact changed-path archival
      rule, those paths cannot both be immutable ancestors and also be changed
      again by the later evidence commit. Merely staging unchanged paths does
      not make them changed paths in Git. Thus the stated one-commit evidence
      scope is not literally executable even though its byte allowance is
      conservative.
    required_repair: >-
      Replace the future evidence scope with an explicit disjoint partition:
      enumerate the required implementation/control paths archived before the
      run, enumerate the remaining run/result paths changed by the evidence
      commit, and bind the archive receipt to the latter exact changed-path
      set. Keep the 1207959552-byte evidence allowance if desired as a
      conservative upper bound. Re-run literal materialization and obtain a
      fresh committed-byte review before authorization.

  required_controls:
  - Snapshot and independently validate the sink implementation and its tests before any scientific run.
  - Inject exactly-cap, cap-plus-one, producer-nonzero, write-error and interruption paths and verify bounded output plus exact partial cleanup semantics.
  - Exercise the split-device path and prove peak, not merely phase-end, usage remains within each reservation.
  - Re-run the baseline gate after authorization and all implementation/control commits are on the fetched remote head.
  - Verify the final archive commit changes exactly its newly declared disjoint path set.
  - Preserve all 4186112 certificate records across exactly 128 frozen shards.

  counterexample_or_mutation: >-
    Commit and independently review pilot_driver.py and implementation.md as
    required before execution, run the pilot, then attempt to create the
    promised evidence commit that changes exactly all 139 required paths plus
    its receipt without altering those immutable implementation bytes. Git
    reports only the newly created run/result paths; forcing the two prior
    paths to appear requires changing reviewed implementation. Either branch
    violates one literal side of AMEND-006.

