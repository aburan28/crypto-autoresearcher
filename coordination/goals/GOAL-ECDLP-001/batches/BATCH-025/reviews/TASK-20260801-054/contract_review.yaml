  # =====================================================================
  # RULINGS ON EVERY ROUTED OPEN ITEM
  # =====================================================================
  rulings:
  - open_item_id: OPEN-RR052-A
    subject: CERT-LPF-1 versus TAIL-LPF-1 on striking STAT-TAIL-DEEP
    ruling: 'READING 1 IS CORRECT. THE STRIKE OF STAT-TAIL-DEEP STANDS.'
    could_this_ruling_have_been_made_without_the_measured_value: >-
      YES, AND I ASSERT THAT AS THE ANSWER TO THE QUESTION AS PUT. The ruling is
      textual and rests on four points none of which reads a calibration number.
      (i) CERT-LPF-1 is mandatory in form - "A member that does not move on any
      rung of either ladder IS STRUCK" - and its predicate ranges over the two
      LADDERS only; OBJ-CTRL-PRODUCT is expressly "A SINGLE OBJECT AND NOT A
      LADDER" and carries gamma_rung null in the movement table, so it cannot
      satisfy that predicate whatever it measured. (ii) TAIL-LPF-1's strike clause
      is a one-way conditional - "if BOTH are absent the statistic is struck" -
      which on its face states a sufficient condition; and its one-absent branch
      assigns a STATUS ("the corresponding direction is UNCERTIFIED and the reading
      rule must say so"), not an immunity, and says nothing about membership of the
      certifying set. (iii) The two rules can be given full simultaneous effect -
      TAIL-LPF-1 governs which DIRECTIONS are demonstrated, CERT-LPF-1 governs
      MEMBERSHIP - so there is no genuine conflict calling for a lex-specialis
      tiebreak, and a construction giving both rules effect is preferred to one
      that reads either as impliedly repealing the other. (iv) PERTURB-MOVE-1's
      named reviewer duty independently makes it a REVISE for the reading rule to
      certify a rung with no recorded movement, so reading 2 would produce a
      self-contradictory instrument on the contract's own terms.
    the_decisive_structural_point_that_settles_it_a_priori: >-
      TAIL-LPF-1's three demonstrations interlock with CERT-LPF-1's predicate in a
      way that is visible before any datum. Demonstration (c) IS the top rung of
      the ROUGH ladder - i.e. it is itself one of the rows CERT-LPF-1 reads. So if
      (c) were present, CERT-LPF-1 would not strike, and the conflict could not
      arise. The ONLY configuration in which TAIL-LPF-1's one-absent case can
      co-occur with a CERT-LPF-1 strike is exactly (b) present and (c) absent - the
      configuration at hand. Under reading 2 TAIL-LPF-1 would therefore be drafted
      so that its only operative effect is to override CERT-LPF-1 in the single
      case where CERT-LPF-1 bites, which is not a reading anyone would adopt on the
      text. I would have given this ruling in the counterfactual world where
      STAT-TAIL-DEEP moved (there CERT-LPF-1's predicate is simply false and no
      strike occurs) and in the counterfactual world where the DOWNWARD
      demonstration was present and the upward one absent (there CERT-LPF-1 does not
      strike either, and TAIL-LPF-1 marks the upward direction uncertified).
    ats_lpf_1_clause_4_position: >-
      ACCEPTED. Reading 1 is an APPLICATION of contract text and not a resolution
      of an ambiguity discovered after a number existed, for the reason just given -
      the interlock is derivable from the two texts alone. The freezing Coordinator
      was correct to apply it AND correct to route it, and the alternative was
      recorded with its full consequence rather than hidden, which is the behaviour
      the clause is for.
    consequence: >-
      L-1's second leg does NOT pre-fire on archived data, L-2, L-3 and L-4 are NOT
      unreachable by construction, and the measurement arm is NOT ended by this
      question. The REVISE in this report is on RTB-054-1 and RTB-054-2 and NOT on
      OPEN-RR052-A.
    the_wording_consequence_i_additionally_bind: >-
      L-2's frozen disposition says "THESE THREE STATISTICS". The frozen wording is
      correctly not edited. Any deliverable quoting it must state that
      STAT-TAIL-DEEP was struck at freeze time and read nothing, so the licensed
      statement is narrower than the frozen sentence reads. I CONFIRM the freeze's
      handling of this.
  - open_item_id: OPEN-LPF049-A
    subject: the apparatus-identity comparison count and the exact-binomial cut
    ruling: >-
      NON-DECISIONAL AT THIS CALIBRATION, CONFIRMED BY RECOMPUTATION. I recomputed
      all three cuts by exact binomial upper tail at p = 4/201 - n = 60 gives
      c = 4 (P = 0.006883, next lower 0.031696), n = 80 gives c = 5 (P = 0.005322,
      next lower 0.021937), n = 140 gives c = 7 (P = 0.007246, next lower 0.022567).
      Every false-fire probability is below the 0.02 REVISE threshold and every
      next-lower candidate is above it. The archived counts are 4, 3, 3, 1 for
      (bits 16 uniform, bits 16 synth, bits 20 uniform, bits 20 synth) under BOTH
      archived readings, and 4 exceeds none of 4, 5, 7. THE LEG DOES NOT FIRE UNDER
      ANY READING.
    which_reading_i_select_and_why: >-
      READING (i), n = 60. A comparison that is not made cannot reject, and
      STAT-KS2-CAL is declared non-certifying by the contract itself and is not
      computed by the driver; using the contract's literal n = 80 would inflate the
      null expectation by a third and make the leg LESS ready to fire. n = 60 is
      the count actually formed and is the most stringent of the three.
    the_deviation_i_must_record: >-
      STATED RATHER THAN GLOSSED. The frozen contract literally fixes n = 80, whose
      cut is 5. RR-LPF-1 writes 4. That is a departure from the literal contract
      number, in the conservative direction - a lower cut fires more readily, and
      firing L-5 SUSPENDS the rule and yields no disposition in any direction, so it
      cannot manufacture a favourable outcome. I accept it as conservative and
      non-decisional, and I bind the consequence - IF ANY FUTURE RECORD NEEDS THIS
      LEG TO FIRE OR NOT FIRE, the choice becomes decisional and is then a
      Coordinator amendment under ATS-LPF-1 clause 4, never a reviewer or freezer
      interpretation.
    could_this_ruling_have_been_made_without_the_measured_value: >-
      THE SELECTION OF READING (i) YES - it follows from the contract's own
      declaration that STAT-KS2-CAL is non-certifying plus the driver's not
      computing it, both fixed before any datum. THE NON-DECISIONALITY NO - that
      depends on the observed count being 4. Counterfactual in both directions - had
      the count been 5 at any cell, reading (i) fires L-5 and suspends the rule while
      readings (ii) and the literal 80 do not, the item becomes decisional, and my
      ruling would have been that RR-LPF-1 may not choose and the item must go to a
      versioned protocol_amendment. Had the count been 8, all three readings fire and
      the item is again non-decisional.
    the_zero_margin: >-
      CONFIRMED AND ENDORSED AS RECORDED. Under my selected reading the bits-16
      uniform count is exactly on the cut. One further rejection would have
      suspended the rule. The freeze states this plainly and does not round it away.
  - open_item_id: OPEN-RR052-B
    subject: whether "a rung where LIMB A rejects" in L-4 includes a struck statistic
    ruling: >-
      READING A. "LIMB A rejects" means a rejection by a CERTIFYING statistic. A
      struck statistic cannot trigger L-4's third clause.
    argument: >-
      CERT-LPF-1 provides that a struck member's "non-firing may never be reported
      as evidence about the intermediates", and AP-4 provides the same for its
      firing. A rule under which a struck statistic's reject boolean diverts the
      classification from L-2 to L-4 would be reading that firing as evidence about
      the intermediates in the only sense that matters - it would change the
      disposition. Reading B is therefore barred by CERT-LPF-1 read with AP-4.
    could_this_ruling_have_been_made_without_the_measured_value: >-
      YES. It turns on CERT-LPF-1 and AP-4 alone, both hash-bound pre-datum.
      Counterfactual - had bits 20 u = 6 also come out non-decidable, or had neither,
      the ruling is unchanged, because the argument never reads which rung is
      undecidable. The measured value affects only the SIZE of what the ruling is
      worth (about 2 percent of L-2 mass), not the ruling.
  - open_item_id: OPEN-RR052-C
    subject: whether the moving gamma = 0.02 rung of a struck ladder may be certified alone
    ruling: >-
      THE FREEZE IS CORRECT. STRIKING THE WHOLE OBJ-PLANT-ROUGH / STAT-KS-DICK /
      BITS-20 LADDER IS RIGHT AND IS NOT OVERCAUTIOUS. See
      perturbation_movement_check.md for the full ruling.
    could_this_ruling_have_been_made_without_the_measured_value: >-
      PARTLY. That the top-rung clause is a sufficient condition for striking a
      family, and the per-rung clause a necessary condition for certifying a rung,
      is textual and pre-datum; on that alone the strike follows whenever the top
      rung is inert. What is NOT available pre-datum is that this configuration
      arose at all. Counterfactual - had the sequence been monotone with an inert
      top rung, my ruling is identical. Had the top rung moved, the question does
      not arise.
  - open_item_id: OPEN-RR052-D
    subject: how a STAT-KS-DICK band exit may be reported directionally under L-3
    ruling: >-
      THE FROZEN RULING IS CORRECT AND I CONFIRM IT. STAT-KS-DICK is
      max(D+, D-) by construction in stat_ks_dickman, so a band exit is
      non-directional in the smoothness sense; the direction under L-3 must be read
      from STAT-RATE-u, whose sign is unambiguous. I verified the D6 mechanism by
      execution - the null D+ / D- at replicate 0 are 0.04919123 / 0.00030 at
      bits 16 and 0.03823691 / 0.00006 at bits 20, reproducing VAL-20260801-006's
      numbers exactly, so the argmax switching is real and is an instrument
      property.
    additional_binding_i_add: >-
      The same argument bars the converse too - a STAT-KS-DICK band exit that agrees
      in SIGN across the two cells may not be reported as directional agreement
      either, because the agreeing sign may be produced by different argmaxes. Only
      STAT-RATE-u establishes direction.
    could_this_ruling_have_been_made_without_the_measured_value: >-
      YES for the ruling, NO for its urgency. max(D+, D-) is non-directional by
      definition, which is derivable from the statistic's form alone. The measured
      argmax switch shows the concern is live at these parameters rather than
      theoretical. Counterfactual - had no switch been measured, the ruling stands
      and would be recorded as a precaution rather than as a diagnosis.
  - open_item_id: DREAD-LPF-1
    subject: the D_formula per-cell reading carried unadjudicated for three batches
    ruling: 'CONFIRMED. THE READING IS CORRECT AND IS NOT A REVISE.'
    argument: >-
      The frozen D_formula is D(bits, m) = 2**(bits * d_half[m]) with d_half[4] = 2,
      which gives D = 2**32 at bits 16 and D = 2**40 at bits 20, exactly as the
      driver implements in D_BY_BITS. The BATCH-021 next_action named both
      "D = 2**40" and bits in {16, 20}; those are consistent only if "D = 2**40"
      names the bits = 20 cell. Forcing D = 2**40 at bits 16 would require
      redrafting the frozen formula, which ATS-LPF-1 clause 2 forbids, and would
      additionally break the p**2 <= D integrity assertion the driver makes per cell
      in the opposite direction by making u meaningless relative to the sample range.
      THE PER-CELL APPLICATION OF THE FROZEN FORMULA IS THE ONLY ADMISSIBLE READING.
    the_caveat_that_travels_with_the_confirmation: >-
      CONFIRMING THE READING IS NOT THE SAME AS ENDORSING ITS CONSEQUENCE. D is used
      only to define u, while samples live on [1, p**2] with p**2/D 0.5070 and
      0.5358, so u is systematically overstated relative to the sample range and
      rho(u) systematically under-predicts p_hat. This is RTB-054-6 and it is the
      dominant part of why R(u) is far from 1 at every rung. The reading is right;
      the resulting R(u) is a biased estimator of the thing LIMB B is named for, and
      that must be declared wherever LIMB B is read.
    could_this_ruling_have_been_made_without_the_measured_value: >-
      YES ENTIRELY. It is arithmetic on a frozen formula. The caveat likewise -
      p**2/D is computable from the cell descriptor without any statistic.
