      Representative A and B streams have different endpoint seeds and stream
      hashes, and the all-seed exact set found no cross-domain collision.
  - check: edge-value versus tuple-derived seed distinction
    status: pass
    evidence: >-
      The edge value is frozen as arithmetic over A_i,A_j,B_i,B_j and has no
      additional tuple-derived seed. The 130816 edge records per K512 array
      therefore add no entries to the exact derived-seed set.
  - check: optional edge commitment distinction
    status: pass
