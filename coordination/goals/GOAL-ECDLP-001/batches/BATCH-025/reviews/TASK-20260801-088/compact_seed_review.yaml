  narrowest_supported_statement: >-
    On committed snapshot 65daa067119fc85523ea44bd58596305cf800e8e,
    AMEND-008's tuple domains mechanically expand to 52 streams and 2109444
    distinct 16-byte derived seeds with zero observed exact collisions and
    ordered-all-seed SHA-256
    c3991b86bedce849dd8b13dee1550ae79405526d9b1467ff4ac30436bdc37fc6.
