    pilot_sha256: dcf6ca00e2a367f7271e17e3c151286227dba46877b8621cd791109efca3391d
    recorded_hashes_match: true
    caveat: receipt_commit_sha_is_null

  count_rederivation:
    edges_per_array: 130816
    formula: 512*511/2
    pilot_arrays: 32
    pilot_factorizations: 4186112
    pilot_formula: 2*2*2*4*130816
    v2_arrays_equivalent: 608
