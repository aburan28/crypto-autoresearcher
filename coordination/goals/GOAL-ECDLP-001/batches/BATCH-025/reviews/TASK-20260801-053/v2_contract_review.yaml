    verdict: PASS

  checks:
    graph_null:
      verdict: PASS_WITH_LIMITATION
      finding: >-
        Each edge is exactly uniform on [1,p^2], and disjoint edges are
        independent. The construction shares endpoint variables on K_512, but
        adjacent additive edge sums are themselves pairwise independent and
        higher-order dependencies are algebra-specific. The proposal correctly
        carries the limitation that it matches incidence topology, not the
        source's unknown joint law.
    exact_split_bank_test:
      verdict: PASS
      finding: >-
        Banks 1..32 and 33..64 are disjoint. Conditional on the frozen
        transformation bank and fixed reference, the add-one test
        (1 + count(M_r >= M_source))/33 has grid 1/33 through 33/33; ties count
        against rejection and alpha 0.05 is reachable only at 1/33.
    branch_partition:
      verdict: REVISE
      finding: >-
        Precedence makes the six labels exclusive, but revise_without_source
        is not mechanically decidable: calibration-validation failure is
        undefined and the gross plant has neither a construction nor a pass
        rule. Moreover, allowing source execution when either plant passes
        permits the gross truncation plant alone to bypass failure of the
        matched sensitivity control.
    matched_plant:
      verdict: REVISE
      finding: >-
        Same-bin replacement can preserve all bin counts and N=1, but the
        deterministic algorithm is incomplete. It does not freeze Bernoulli
        versus fixed-cardinality selection, candidate ordering, tie handling,
        reuse versus consumption, or whether one candidate pool/base array is
        shared across deltas. The accounting assumes reuse, while alternative
        valid readings alter both power and resource costs.
    pilot_resources:
      verdict: REVISE
      finding: >-
        The roster has exactly 128 shards. At 256 MiB each, the shard maxima
        consume exactly 32 GiB, leaving no global-disk allowance for manifests,
        checkpoints, logs, or reports. Also, a number below 2^40 can have
        eleven distinct prime factors because the product of the first eleven
        primes is 200560490130, while the nominal primality budget is only
        eight checks per factorization on average. Any per-record cap of eight
        would be invalid; the contract must specify global accounting and
        reserve enough worst-case headroom.
    shard_and_open_files:
      verdict: REVISE
      finding: >-
        Four workers plus four simultaneously open gzip shards exhaust the
        four-output-file ceiling before checkpoint or manifest writes. A
        single-writer architecture could comply, but it is not frozen.
        Certificate shard paths and the seed-roster hash artifact are also
        absent from required_artifacts.
    pilot_scope:
      verdict: PASS_AT_CONTRACT_LEVEL
      finding: >-
        The specification declares no curve, factor base, S3 source arm, plant,
        p-value, evidence disposition, or status transition. The later
        implementation must expose no source/evidence mode before authorization;
        no executable exists in this snapshot to verify that property.

  objections:
  - id: RT052-B1
    severity: blocking_determinism
    finding: Matched-plant selection, reuse, and tie rules are unfrozen.
  - id: RT052-B2
    severity: blocking_decision_logic
    finding: Calibration and gross-plant pass rules are undefined.
  - id: RT052-B3
    severity: blocking_resource_contract
    finding: Disk, primality, shard, and open-file ceilings are not jointly safe.
  - id: RT052-B4
    severity: blocking_artifact_integrity
    finding: Raw certificate shards and seed-roster hashes lack required artifact paths.
  - id: RT052-B5
    severity: blocking_statistic_definition
    finding: >-
      Directional KS orientation and corrected log-rate-ratio correction are
      named but not mathematically defined, so conforming implementations can
      disagree.

  required_controls:
  - Freeze exact plant selection, candidate ordering, tie and reuse rules.
  - Require the matched plant itself to pass before any source executable exists.
  - Define every statistic and calibration-validation predicate algebraically.
  - Reserve disk beyond 128 shard maxima and freeze a compliant writer topology.
  - Permit at least eleven explicit primality verifications for an individual N.
  - Declare certificate-shard and seed-roster artifacts.
  - Independently inspect the implemented CLI for absence of source/evidence modes.

  counterexample_or_mutation: >-
    Run the future matched-plant constructor twice with candidate reuse enabled
    and disabled. Divergent detection floors under the current text demonstrate
    that plant power is implementation-selected rather than pre-registered.

  baseline_comparison:
    dominated_by: Pollard-rho generic exact ECDLP
    sota_delta:
      time_exponent: 0.0
      memory_exponent: 0.0
      data_exponent: 0.0
      solved_instances: 0

  narrowest_supported_statement: >-
    The exact snapshot and arithmetic counts are sound, and the pilot is
    correctly scoped as null-only and non-evidentiary. Neither contract is
    execution-ready because deterministic plant semantics, decision predicates,
    and resource/artifact ceilings remain incomplete.
  next_concrete_action: >-
    Issue a v3 contract repairing RT052-B1 through RT052-B5, snapshot it, and
    obtain fresh independent committed-byte review before authorizing any run.
  artifact_paths:
