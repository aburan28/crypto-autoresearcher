  limitations:
  - No scientific experiment, pilot, retry or resume was executed.
  - This review is bound only to exact snapshot cd3870ea1fd29dd0885fc56807b0fb5a4c18a71f and does not review later branch or experiment-id renames.
  - Historical concurrent RSS for RUN002 remains unknowable; the repair cannot backfill it.
  - Process-tree RSS can double-count shared pages and is not unique host physical memory.
  - One synthetic macOS lifecycle receipt does not prove that a future scientific run remains below 4 GiB.
  - The control receipt records parent commit and dirty status but no pre-control driver SHA-256; co-archival and independent final-source review do not cryptographically exclude an edit between control exit and snapshot.
