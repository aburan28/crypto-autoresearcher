  control_checks:
  - check: active-pool epoch semantics
    status: pass
    evidence: >-
      begin_pool_epoch creates monotone epochs and clears only the active worker
      peak map; end_pool_epoch clears active epoch state. attempt_peak remains a
      maximum across epochs, while cumulative worker CPU is initialized once
      and never reset at an epoch boundary.
  - check: retired worker exclusion and cap enforcement
    status: pass
    evidence: >-
      observe_worker_record accepts only its active epoch and computes parent
      peak plus active-epoch worker maxima. Both record observation and live-tree
      sampling enforce maximum_rss_bytes against attempt_peak_rss_bytes. A
      validator fixture produced active candidates 1300 then 1500, never the
      retired sum 1800, preserved CPU, and rejected 1500 against a 1499 cap.
  - check: pool lifecycle integration
    status: pass
    evidence: >-
      _bounded_ordered_factorizations opens one epoch per ProcessPoolExecutor,
      supplies the epoch to every worker observation, returns the resource
      sample with each ordered record and closes the epoch in a finally block.
  - check: checkpoint, terminal and failure plumbing
    status: pass
    evidence: >-
      rss_receipt_fields fail-closes unless all seven registered fields exist.
      The exact field set is propagated twice for checkpoint event/manifest,
      three times for terminal event/result/manifest, and twice for failure
      event/manifest. Compatibility peak_rss_bytes remains the cumulative max.
