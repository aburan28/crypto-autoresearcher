    correct; conservative ancestor exclusion is complete; and the successor
    remote binding is feasible without self-reference. AMEND-005 still does
    not mechanically enforce its pack cap or its storage reservations before
    and during execution, so it is not yet safe to release the null-only pilot.
    No experiment result or ECDLP evidence exists.

  next_concrete_action: >-
    Keep the pre-execution hold in force. Snapshot an immutable successor that
    adds a live-bounded pack writer, explicit per-filesystem reservations and a
    pre-run baseline-pack capacity gate; then obtain a fresh independent
    committed-byte review before authorization or Executor dispatch.

