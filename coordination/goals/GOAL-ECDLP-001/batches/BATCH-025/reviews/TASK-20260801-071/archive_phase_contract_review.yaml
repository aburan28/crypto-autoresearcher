  narrowest_supported_statement: >-
    On committed snapshot 34b380351a1d9c1fdca744341a291b8c9300ca25,
    the exact-input amendment chain materializes without implicit merges; all
    five digests match; the 139 required paths, 128 shard names and 4186112
