  objections:
  - id: RT056-B1
    severity: blocking_archive_cap_enforcement
    finding: >-
      The preflight pack is fully written before its 1.5-GB cap is checked, so
      the operation that is supposed to measure the bound can itself exceed
      the reserved pack and total archive-disk ceilings.
    required_repair: >-
      Stream pack-objects through a byte-counting writer that aborts and removes
      only the named partial pack immediately after 1500000000 bytes, or apply
      an equivalent hard file-size/resource limit during generation. Record
      the abort as failed_infrastructure_or_archive and never rename an
      over-cap partial pack.
  - id: RT056-B2
    severity: blocking_storage_enforcement
    finding: >-
      Free-space and incremental-usage gates have no per-filesystem scope even
      though the active linked worktree and Git common object database are on
      different filesystems.
    required_repair: >-
      Resolve and record the filesystem for the worktree, Git common object
      database, preflight temporary file and push temporary storage before the
      run. Require sufficient free bytes and enforce the assigned reservation
      separately on every distinct filesystem, or require all archive-phase
      storage to reside on one named filesystem.
  - id: RT056-B3
    severity: blocking_pre_run_archive_feasibility
    finding: >-
      The conservative exclusion ancestor is ancestry-checked but not
      capacity-checked before execution; it may already imply a pack above the
      frozen cap before any pilot artifact is added.
    required_repair: >-
      Before implementation, cap a streamed pack of execution_remote_head
      excluding the frozen ancestor and combine its measured bytes with a
      conservative maximum evidence-pack allowance, or constrain the exclusion
      SHA to the reviewed snapshot and prove a bound on every intervening path.
      Do not start the run when the worst-case final preflight cannot fit.

  required_controls:
  - Exercise the pack writer with a synthetic stream one byte above the cap and verify bounded abort plus partial-file cleanup.
  - Exercise archive accounting in a linked worktree whose Git common directory is on a different filesystem.
  - Preflight the frozen remote-head-to-exclusion range before execution and reject an intentionally oversized range.
  - Preserve all 4186112 certificate records across exactly 128 required shards.
  - Preserve the null-only CLI and non-evidentiary ceiling on every archive failure.

  counterexample_or_mutation: >-
    Bind pack_exclusion_ancestor_sha to a valid but sufficiently old remote
    ancestor whose evidence_commit-minus-ancestor pack exceeds 1.5 GB. The
    current ancestry and remote-head gates still start the run; pack-objects
    then writes beyond its reserved term before the post-write size check can
    reject it. The same mutation also exposes any unscoped filesystem check in
    a linked worktree.

  baseline_comparison:
    dominated_by: Pollard-rho generic exact ECDLP
    pollard_rho: >-
      Pollard rho solves exact generic ECDLP in expected exponent 1/2. This
      archive-contract repair measures no source arm and solves no DLP.
    sota_delta:
