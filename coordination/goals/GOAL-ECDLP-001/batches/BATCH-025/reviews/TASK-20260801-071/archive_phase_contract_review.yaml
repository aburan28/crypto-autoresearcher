    arithmetic_verdict: PASS
    enforcement_verdict: REVISE
    finding: >-
      The sums are correct and the separate loose-object and pack reservations
      repair the accounting omission in RT055-B2 on paper. They are not yet a
      mechanically enforced end-to-end bound: the sequence first writes a
      complete pack and only afterward compares its size with 1500000000.
      An unexpectedly large conservative-ancestor range can therefore consume
      more than the reserved pack term and even cross the 8-GiB archive cap
      before the stated gate fires.

  conservative_ancestor_and_transport_review:
    completeness_property: PASS
    completeness_finding: >-
      If pack_exclusion_ancestor_sha is an ancestor of the frozen remote head,
      the complete pack for evidence_commit excluding that ancestor is a
      conservative superset of objects absent from that branch. Excluding an
      older ancestor cannot omit evidence objects.
    pre_run_capacity_property: REVISE
    pre_run_capacity_finding: >-
      The authorization may select any already-pushed ancestor; AMEND-005 does
      not require the exclusion SHA to equal the reviewed snapshot, cap the
      intervening object range, or preflight the already-existing
      execution_remote_head-to-ancestor pack before starting the run. A remote
      range that already exceeds 1.5 GB can therefore pass every pre-run gate,
      consume the scientific run, and be discovered only after evidence is
      produced.
    actual_push_binding: >-
      The preflight is a complete non-thin pack, while a normal Git push may
      construct a different transport pack. The 500-MB remote-limit headroom
      is conservative, and any server rejection is explicitly non-evidentiary,
      but the contract does not record or cap the actual transmitted pack.
      This is secondary to the blocking late-cap defect.

  filesystem_scope_review:
    verdict: REVISE
    observed_checkout_layout:
      worktree: /private/tmp/ecdlp-breakthrough-20260801-main2
      git_common_dir: /Volumes/Volume/crypto-autoresearcher/.git
      same_filesystem: false
    finding: >-
      The contract has one minimum_free_disk_bytes_before_run value and one
      incremental-disk cap but does not define which filesystem each term is
      measured on. In the actual linked checkout, run artifacts and temporary
      packs may live on the system data filesystem while staged loose Git
      objects live on the separate /Volumes/Volume filesystem. A free-space
      check on only one location cannot protect the other, and summing usage
      across filesystems does not prove either filesystem has enough capacity.

  authorization_self_reference_review:
    verdict: PASS
    finding: >-
      A successor authorization can bind remote_name, remote_branch,
      authorized_snapshot_sha 34b380351a1d9c1fdca744341a291b8c9300ca25,
      and a pre-existing exclusion ancestor without naming its own future
      commit. After that authorization is committed and pushed, its commit can
      be observed as execution_remote_head_sha in the later run manifest. No
      authorization self-hash is required.

