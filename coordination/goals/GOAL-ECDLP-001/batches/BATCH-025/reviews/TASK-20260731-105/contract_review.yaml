# ---------------------------------------------------------------------------
# Blocking defects (REVISE)
# ---------------------------------------------------------------------------
blocking_defects:
  - id: B-1
    title: HEUR-ISO-1 F_hit / regularity / min_ell variable not pre-registered
    target: >-
      experiments/EXP-IT-001/specification.yaml
      preregistered_prediction.formula; heur_iso_1_decision_rule
    detail: >-
      KS-ISO-1 and TAIL-ISO-1 compare empirical min-ell to F_hit at frozen
      rho_special, but F_hit is defined only as "the contract's random-regular
      hitting-time CDF." Missing: (i) graph regularity d; (ii) whether the
      abscissa is graph hops, prime degree, or composite path degree (volcano
      hitting time ≠ product of isogeny degrees); (iii) a closed-form or
      algorithmic CDF F_hit(ell; rho_special, d) frozen before sampling.
      Without these, HEUR-ISO-1 validation is not pre-registered and not
      independently recomputable (target-result-profile / inventor-protocol
      heuristic-validation requirement).
    required_fix: >-
      Freeze d, the min_ell random variable definition, and an explicit F_hit
      formula or deterministic algorithm of (rho_special, d), written into
      HEUR_ISO_1_report.json schema before any path search.

  - id: B-2
    title: Special-family detectors and rho_special universe underspecified
    target: >-
      experiments/EXP-IT-001/specification.yaml
      inputs.special_family_detectors; heur_iso_1_decision_rule.density_freeze
    detail: >-
      embedding_degree_leq_threshold has no numeric threshold.
      subfield_weil_descent_friendly has no boolean predicate (field extension
      degree, cofactor, or GHS-friendly conditions). density_freeze requires
      enumerating rho_special(bits) but does not name the universe or sampling
      frame, so the freeze step is not executable or auditable.
    required_fix: >-
      Pin detector predicates (including embedding-degree threshold and
      Weil-descent friendliness), and pin the density universe / estimator with
      a freeze artifact schema written before path search.

  - id: B-3
    title: C_path / C_special / ell_max cost accounting not decidable
    target: >-
      experiments/EXP-IT-001/specification.yaml
      inputs.cost_model; inputs.ell_max; metrics.primary
    detail: >-
      Gate metric R_xfer requires additive charging of path-finding +
      special-solver + pullback in group-op units comparable to matched_rho.
      Contract gives matched_rho but not: search algorithm cost (BFS vs MITM
      table ops), per-isogeny evaluation schedule, C_special for each named
      family, or whether ell_max is max composite degree, max prime, hop
      radius, or a group-op budget. H-IT-001's "N^{1/2} degree budget
      (group-op charged)" conflicts with bare ell_max: N**(0.5). Planted-path
      R_xfer < 0.7 and F1 cannot be recomputed without a frozen ledger of
      charges.
    required_fix: >-
      Freeze a cost ledger: ell_max semantics; C_path formula (search +
      evaluation); C_special per detector family; pullback; measured-vs-modeled
      labels; keep ±10x sensitivity on the isogeny-evaluation component.

  - id: B-4
    title: Isogeny-transfer null object for IDEA-011 gate not in freeze
    target: >-
      experiments/EXP-IT-001/specification.yaml controls.CTRL-NULL-PACKAGING-GATE;
      ledger/proposals/IDEA-20260731-011.yaml
    detail: >-
      IDEA-011 states null objects are specified per mechanism class before
      execution. EXP-IT-001 mandates the gate on any claimed R_xfer < 0.7 but
      does not define the isogeny-transfer null (what structure is destroyed,
      how API/cost shape is preserved, R_null identity, required report fields,
      planted-bug positive control for the gate itself). Inventor-protocol §3
      controls-before-belief is therefore not protocol-encoded for this lane.
    required_fix: >-
      Add a frozen null-object protocol (or amendment) for the isogeny-transfer
      class: null construction, R_null metric, pass/fail bits, and packaging
      hash in required artifacts — even if expected unplanted outcomes never
      fire F1.

