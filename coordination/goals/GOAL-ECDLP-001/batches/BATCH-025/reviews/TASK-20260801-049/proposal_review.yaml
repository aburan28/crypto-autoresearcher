red_team_report:
  id: RT-20260801-051
  task_id: TASK-20260801-049
  role: red-team
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  hypothesis_id: H-SMTH-002
  experiment_id: EXP-SMTH-002
  reviewed_on: '2026-08-01'
  independent_session: true
  author_of_reviewed_artifact: false
  verdict: REVISE
  recommendation_to_coordinator: DO_NOT_FREEZE_OR_EXECUTE_AS_WRITTEN
  disposition_authority: coordinator_only

  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    resolved_model_id: gpt-5.6-sol
    fallback_allowed: false
    fallback_used: false
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    independent_session_required: true

  claim_under_review: >-
    A toy finite-X comparison of LPF and smoothness statistics from all
    off-diagonal ENC-B pairs against discrete-uniform integers on [1,p^2].
    No algorithmic, asymptotic, cryptographic-scale, or breakthrough claim.

  snapshot_verification:
    commit: 2f61bac6655d56b3a5739055df01129601fb3800
    parent: 255916dd2764da8996224472c9fe44c257b5425e
    reachable_from_head: true
    exact_changed_path_count: 2
    exact_changed_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/tasks/TASK-20260801-047/design_proposal.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-048/snapshot_commit_receipt.json
    proposal_sha256: b463704dc9b2aa1aa9cb4cba0ecb55b3aa387443300056d7b10836ce20efe85d
    receipt_hash_matches: true
    receipt_commit_sha_field: null
    caveat: >-
      Git verifies the reachable commit, parent, two-path scope, and proposal
      digest. The null receipt self-field is archival-format debt only.

  dominant_checks:
    shared_reference_rank:
      verdict: CONDITIONALLY_VALID_IN_PRINCIPLE
      finding: >-
        Given fixed reference R, statistics f(Y_r,R) from independent iid null
        arrays are exchangeable. Sharing R is not itself fatal.
    inferential_unit:
      verdict: FAIL
      finding: >-
        The source is an edge array on K_512: every coordinate participates in
        511 pairs. Its 130816 values are not iid like each calibration vector.
    plant_power:
      verdict: FAIL_FOR_SOURCE_LIKE_ALTERNATIVES
      finding: >-
        B4 truncation forces q4=1 but also collapses magnitude and creates an
        atom at one. It certifies gross responsiveness only.
    resource_accounting:
      verdict: FAIL
      finding: >-
        The proposal omits one factorization of each plant input U and supplies
        no physical resource ceilings.
    branch_logic:
      verdict: FAIL
      finding: >-
        no_detected_signal overlaps inconsistent_signal, and budget exhaustion
        has no terminal branch.

  objections:
  - id: RT051-B1
    severity: fatal_statistical_validity
    finding: >-
      Iid uniform calibration matches source marginals but not its shared-node
      joint law. KS, extreme-order, and smooth-count null distributions can
      therefore be miscalibrated even when every source marginal is uniform.
    consequence: >-
      real_family_p cannot support toy_signal or no_detected_signal.
    required_repair: >-
      Use independently generated curve/factor-base fixtures as inferential
      units and a null object with the same K_512 dependency graph, or prove
      and freeze a valid dependency-graph calibration. Treat 3-of-4 signs as
      descriptive unless curve-level inference is calibrated.

  - id: RT051-B2
    severity: blocking_mechanical_ambiguity
    finding: >-
      Upper empirical rank, extremeness direction, ties, denominators, and
      real-point symmetrization are undefined. T_r uses 199 peers while
      T_real's comparison set is unspecified.
    consequence: >-
      Faithful implementations can produce different family decisions.
    required_repair: >-
      Freeze exact integer-count formulas, tail direction, tie handling,
      family ordering, and one decision variable. Use independent
      transformation and maximum-calibration banks, or prove an exact
      symmetric conformal construction. State the attainable grid; the usual
      minimum add-one p-value with 200 null scores is 1/201.

  - id: RT051-B3
    severity: blocking_power_claim
    finding: >-
      Plant rejection may be driven by N=1, KS, or magnitude collapse while
      the required positive u=4 sign is guaranteed by construction.
    consequence: >-
      A passing plant gives no detection floor for a subtle source-like LPF
      deviation, so source non-rejection is not a sensitive scoped negative.
    required_repair: >-
      Retain this plant only as a gross implementation control. Add a frozen
      magnitude-bin- and atom-at-one-matched smoothness plant over several
      mixture strengths, requiring movement in the directional statistics
      permitted to establish toy_signal.

  - id: RT051-B4
    severity: blocking_resource_accounting
    finding: >-
      Source, reference, and calibration counts are correct, but each of
      1046528 plant draws factors U and then N_plant. The stated 212445184
      maximum counts only one of those calls.
    consequence: >-
      The minimum existing maximum is 213491712 factorization calls before
      pilots, retries, rejection draws, or added controls.
    required_repair: >-
      Charge calls by phase, including plant construction, pilot, retries,
      primality tests, certificate verification, and rejection sampling.

  - id: RT051-B5
    severity: blocking_feasibility
    finding: >-
      More than 213 million direct factorizations and per-integer certificates
      are proposed without CPU-hour, wall-time, RSS, disk-byte, shard,
      compression, checkpoint, or resume ceilings.
    consequence: >-
      Attainability and budget-stopping behavior cannot be reviewed.
    required_repair: >-
      Before contract snapshot, use a separately authorized bounded null-path
      pilot or conservative derivation to freeze total CPU, wall, RSS, disk,
      bytes-per-certificate, shard format, checkpoint cadence, and pilot cost.

  - id: RT051-B6
    severity: blocking_branch_logic
    finding: >-
      Family rejection with failed direction or replication satisfies both
      no_detected_signal and inconsistent_signal. Timeout, disk exhaustion,
      and deliberate budget stop are uncovered. Control failure is also
      incorrectly included in mathematical falsification.
    consequence: >-
      Identical observations permit incompatible conclusions.
    required_repair: >-
      Freeze mutually exclusive branches: invalid_integrity,
      failed_infrastructure_or_budget, revise_without_source, toy_signal,
      inconsistent_signal defined by p<=alpha with failed sign or replication,
      and no_detected_signal defined by p>alpha with valid controls. Remove
      control failure from mathematical falsification.

  counterexample_or_mutation: >-
    Generate null arrays with exactly uniform marginals but the same K_512
    sharing pattern and measure the proposed iid-calibrated rejection rate over
    independent fixtures. Inflation above 0.05 falsifies the current calibration
    without factoring source integers.

  baseline_comparison:
    dominated_by: Pollard-rho generic exact ECDLP
    pollard_rho: >-
      Expected generic time exponent 1/2 and solves exact DLP; this proposal
      solves no DLP instance.
    closest_specialized_baseline: >-
      Gaudry-Semaev-style prime-field index calculus. The proposal measures one
      heuristic input but omits relation yield, rank, linear algebra, source
      recovery, target descent, and scalar orientation.
    sota_delta:
      time_exponent: 0.0
      memory_exponent: 0.0
      data_exponent: 0.0
      solved_instances: 0

  narrowest_supported_statement: >-
    The proposal correctly uses i<j, exact X=p^2, direct factorization, and an
    explicit toy-only claim ceiling. It is not ready to freeze or execute.
    This review produced no evidence for or against HEUR-DS-1 and no ECDLP
    algorithmic progress.

  next_concrete_action: >-
    Create a fresh proposal revision addressing RT051-B1 through RT051-B6,
    snapshot it, and obtain fresh independent pre-run review before enabling
    any source mode.

  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-049/proposal_review.yaml

  explicit_non_actions:
  - No experiment was executed.
  - No predecessor record was edited.
  - No official status or approval was changed.
  - No commit was created by the Red Team.
