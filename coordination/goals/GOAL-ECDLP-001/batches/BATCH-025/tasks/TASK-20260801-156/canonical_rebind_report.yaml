  commands:
  - kind: exact_ast_scope_comparison
    command: |-
      python3 - <<'PY'
      import ast, copy, hashlib, subprocess
      from pathlib import Path
      path = 'experiments/EXP-SMTH-002/implementation/pilot_driver.py'
      before = ast.parse(subprocess.check_output(['git', 'show', f'670ccf3e1:{path}'], text=True))
      after = ast.parse(Path(path).read_text())
      tokens = ('experiments/EXP-SMTH-PILOT-001', 'EXP-SMTH-PILOT-001/v1', 'EXP-SMTHPILOT-001', 'EXP-SMTH-PILOT-001', 'experiments/EXP-SMTH-002', 'EXP-SMTH-002/v1', 'EXP-SMTH-002')
      def digest(tree, normalize=False):
          tree = copy.deepcopy(tree)
          if normalize:
              for node in ast.walk(tree):
                  if isinstance(node, ast.Constant) and isinstance(node.value, str):
                      for token in tokens:
                          node.value = node.value.replace(token, '<CANONICAL_BINDING>')
          return hashlib.sha256(ast.dump(tree, annotate_fields=True, include_attributes=False).encode()).hexdigest()
      result = {
          'node_count_before': sum(1 for _ in ast.walk(before)),
          'node_count_after': sum(1 for _ in ast.walk(after)),
          'raw_before': digest(before),
          'raw_after': digest(after),
          'normalized_before': digest(before, True),
          'normalized_after': digest(after, True),
      }
      assert result['node_count_before'] == result['node_count_after'] == 17158
      assert result['normalized_before'] == result['normalized_after']
      print(result)
      PY
