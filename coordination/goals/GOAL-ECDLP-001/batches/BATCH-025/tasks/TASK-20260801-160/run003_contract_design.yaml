run003_contract_design:
  id: DESIGN-RUN-SMTH-PILOT-003
  task_id: TASK-20260801-160
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  experiment_id: EXP-SMTH-002
  proposed_run_id: RUN-SMTH-PILOT-003
  status: design_only_review_required
  execution_authorized: false
  evidence_eligible: false
  scientific_runs_executed: 0

  uncertainty_to_reduce: >-
    Whether the exact null-only direct-factorization and certificate instrument
    in EXP-SMTH-002 can complete its frozen 4,186,112-record workload under the
    existing wall, CPU, concurrent-RSS, disk, descriptor and worker ceilings
    after the validated active-pool RSS-accounting repair.

  mechanism:
    statement: >-
      Re-run the frozen EXP-SMTH-002 null workload from deterministic index
      zero with the canonical seed domain and the same shared factor/verify/
      reconstruct function for both identical-shape null arms, while placing
      every new artifact under a fresh RUN003 namespace. Completion can size a
      later scientific contract; it cannot measure an ECDLP advantage.
    source_arm_present: false
    elliptic_curve_operations: 0
    ecdlp_instances_solved: 0
    hypothesis_tested: null
    hypothesis_binding_only: H-SMTH-001

  predecessor_boundary:
    predecessor_run: RUN-SMTH-PILOT-002
    predecessor_status: failed_infrastructure_or_budget
    predecessor_retained_records: 1700608
    predecessor_completed_shards: 52
    predecessor_domain: EXP-SMTH-PILOT-001/v1
    predecessor_peak_rss_interpretation: contaminated_retired_pid_accumulator
    predecessor_registered_as_observations: false
    prohibited_reuse:
    - no resume of RUN-SMTH-PILOT-002
    - no append to any RUN002 run or result file
    - no hard-link, copy or ingestion of RUN002 certificates or statistics
    - no relabeling of RUN002 records as RUN003
    - no use of RUN002 partial distributions in a scientific comparison
    permitted_pre_execution_reference: >-
      Committed RUN002 aggregate resource counters may be cited only as a
      planning prior in the cost audit. They are not input data to RUN003 and
      must not affect its deterministic roster, metrics or outcome.

  seed_domain_decision:
    domain: EXP-SMTH-002/v1
    master_seed: 25051
    start_index: 0
    alternate_seed_allowed: false
    rationale: >-
      This is the canonical domain frozen by specification.yaml and validated
      in the canonical rebind. RUN002 used the retired
      EXP-SMTH-PILOT-001/v1 domain, so canonical-domain generation is fresh by
      construction. Adding RUN003 to the seed preimage would change the frozen
      experiment rather than merely create a successor run.
    required_preflight: >-
      Generate a new canonical-domain seed roster from index zero, prove all
      stream hashes and collision checks, and write it only inside the RUN003
      results namespace. The old roster must not be opened as an execution
      input.

  frozen_objects:
    bits: [16, 20]
    fixtures_per_bit: 2
    null_types: [NULL-IID-EDGE, NULL-K512-ADD]
    replicates_per_null_type_per_fixture: 4
    factor_base_size: 512
    integers_per_replicate: 130816
    total_integer_factorizations: 4186112
    logical_records_per_shard: 32704
    expected_shards: 128
    expected_cell_count: 32
    source_arm_present: false
    plant_present: false

  fresh_namespace:
    run_prefix: experiments/EXP-SMTH-002/runs/RUN-SMTH-PILOT-003
    result_prefix: experiments/EXP-SMTH-002/results/RUN-SMTH-PILOT-003
    absence_precondition: >-
      Every declared RUN003 target must be absent before the single initial
      launch. Any pre-existing target is invalid_integrity and the launcher
      must exit before constructing a seed, creating the run directory,
      opening a result sink or starting a worker.
    forbidden_write_prefixes:
    - experiments/EXP-SMTH-002/runs/RUN-SMTH-PILOT-001
    - experiments/EXP-SMTH-002/runs/RUN-SMTH-PILOT-002
    - experiments/EXP-SMTH-002/results/certificates
    - experiments/EXP-SMTH-002/results/seed_roster.json
    - experiments/EXP-SMTH-002/results/feasibility_report.json
    - experiments/EXP-SMTH-002/results/shard_manifest.json

  artifact_roster:
    exact_path_count: 139
    implementation_paths:
    - experiments/EXP-SMTH-002/implementation/pilot_driver.py
    - experiments/EXP-SMTH-002/implementation/implementation.md
    run_paths:
    - experiments/EXP-SMTH-002/runs/RUN-SMTH-PILOT-003/manifest.yaml
    - experiments/EXP-SMTH-002/runs/RUN-SMTH-PILOT-003/command.txt
    - experiments/EXP-SMTH-002/runs/RUN-SMTH-PILOT-003/environment.json
    - experiments/EXP-SMTH-002/runs/RUN-SMTH-PILOT-003/stdout.log
    - experiments/EXP-SMTH-002/runs/RUN-SMTH-PILOT-003/stderr.log
    - experiments/EXP-SMTH-002/runs/RUN-SMTH-PILOT-003/raw-result.json
    result_metadata_paths:
    - experiments/EXP-SMTH-002/results/RUN-SMTH-PILOT-003/feasibility_report.json
    - experiments/EXP-SMTH-002/results/RUN-SMTH-PILOT-003/shard_manifest.json
    - experiments/EXP-SMTH-002/results/RUN-SMTH-PILOT-003/seed_roster.json
    certificate_pattern: >-
      experiments/EXP-SMTH-002/results/RUN-SMTH-PILOT-003/certificates/shard-000.jsonl.gz
      through shard-127.jsonl.gz, inclusive, with three decimal digits.
    arithmetic: 2 implementation + 6 run + 3 result metadata + 128 shards = 139

  identical_shape_controls:
  - id: C-SHAPE-1
    statement: >-
      NULL-IID-EDGE and NULL-K512-ADD each have the same bits, fixtures,
      replicates, record counts, shard size, factorization function,
      certificate schema, worker limit and resource accounting.
    invalid_when: Any arm-specific implementation or budget path exists.
  - id: C-SHAPE-2
    statement: >-
      Every certificate reconstructs N from sorted prime powers and every
      claimed prime is checked through the same dependency path before shard
      acceptance.
    invalid_when: One reconstruction or primality assertion fails.
  - id: C-SHAPE-3
    statement: >-
      First and last records of each of 128 shards are independently parsed,
      reconstructed and primality-checked from the closed shard.
    expected_boundary_records: 256
  - id: C-INTEGRITY-1
    statement: An injected composite-as-prime certificate is rejected by a pre-run self-test.
  - id: C-INTEGRITY-2
    statement: An injected one-byte shard mutation fails its recorded SHA-256 in a pre-run self-test.
  - id: C-LIFECYCLE-1
    statement: >-
      Checkpoint, terminal and failure receipts carry current live-tree RSS,
      active-epoch conservative RSS, attempt-peak RSS, cumulative CPU, wall,
      disk, worker-epoch and next-index fields.
  - id: C-NULL-INTERPRETATION
    statement: >-
      Any descriptive difference between the two nulls is reported alongside
      the same-shape control and is ineligible for a hypothesis disposition.

  preregistered_predictions:
  - id: P-COUNT
    prediction: Exactly 4,186,112 sequential certificates close in 128 shards.
    falsification: Any gap, duplicate, out-of-range value or count mismatch.
  - id: P-WALL
    prediction: >-
      Linear planning estimate from RUN002 is 964.99 wall seconds; a twofold
      planning envelope is 1,929.98 seconds. The binding ceiling remains 7,200
      seconds and is not relaxed if the estimate is wrong.
    scientific_interpretation: none
  - id: P-CPU
    prediction: >-
      Linear planning estimate from RUN002 is 1,448.71 CPU seconds; a twofold
      planning envelope is 2,897.42 seconds. The binding ceiling remains
      28,800 CPU seconds.
    scientific_interpretation: none
  - id: P-DISK
    prediction: >-
      Linear tracked-byte estimate is 86,760,084 bytes and receipt-time
      physical-byte estimate is 90,227,949 bytes. Fourfold planning envelopes
      are 347,040,336 and 360,911,796 bytes respectively; the binding cap
      remains 34,359,738,368 bytes.
    scientific_interpretation: none
  - id: P-PRIMALITY
    prediction: >-
      Linear planning estimate is 13,810,243 primality checks, below the frozen
      cap 33,554,496. The actual fully charged count controls.
    scientific_interpretation: none
  - id: P-RSS
    prediction: null
    rationale: >-
      Historical concurrent RUN002 RSS is unknowable and the synthetic repair
      control is not a scientific workload measurement. No point estimate is
      preregistered; completion must demonstrate attempt-peak RSS at or below
      4,294,967,296 bytes.

  metrics:
    integrity:
    - completed sequential records and shards
    - seed-stream hashes and collision count
    - certificate reconstruction and prime-check failures
    - closed-shard SHA-256 and byte counts
    resources:
    - setup, roster, generation, factorization, verification, serialization, fsync and finalization wall seconds
    - the same phases in CPU seconds
    - current live-tree, active-epoch conservative and attempt-peak RSS bytes
    - compressed, logical, tracked and physical bytes by phase and total
    - maximum open output handles and maximum live workers
    throughput:
    - factorizations per wall and CPU second by bits and null type
    - compressed and logical bytes per certificate by bits and null type
    descriptive_only:
    - smooth rates for u in [2, 3, 4, 5]
    - two-sided z-distribution KS against the fixture's first iid replicate
    - top-z means for k in [1, 8, 64, 512]

  fully_charged_budget:
    maximum_initial_launches: 1
    maximum_process_launches: 1
    maximum_resume_count: 0
    interruption_boundary: >-
      Any interruption terminates RUN003 as failed_infrastructure_or_budget.
      It is not resumed, retried or appended. Further execution would require
      a fresh run ID, contract and authorization.
    maximum_factorization_calls: 4186112
    maximum_primality_checks: 33554496
    maximum_certificate_reconstructions: 4186368
    reconstruction_arithmetic: >-
      4,186,112 in-pipeline certificate reconstructions plus two independent
      closed-shard boundary reconstructions for each of 128 shards equals
      4,186,368 fully charged reconstructions.
    maximum_wall_seconds: 7200
    maximum_cpu_seconds: 28800
    maximum_peak_rss_bytes: 4294967296
    maximum_total_disk_bytes: 34359738368
    maximum_open_output_files: 4
    maximum_workers: 4
    no_network: true
    charged_scope: >-
      Setup, dependency import, seed roster, object generation, factorization,
      prime checks, reconstruction, statistics, serialization, compression,
      close/fsync/hash, checkpoint verification, final verification, failure
      cleanup all count inside the ceilings. No resume or retry exists.

  stopping_rules:
  - Crossing one physical or count ceiling stops at the next record boundary and yields failed_infrastructure_or_budget.
  - Any seed, namespace, sequence, range, certificate, reconstruction, shard, hash or roster failure yields invalid_integrity immediately.
  - A missing required terminal artifact prevents completed_feasibility_only.
  - A timeout, crash, dependency error or resource stop is not evidence against a mathematical hypothesis.

  mutually_exclusive_outcomes:
  - id: invalid_integrity
    evidence_value: instrument_invalid_only
  - id: failed_infrastructure_or_budget
    evidence_value: exact_resource_checkpoint_only
  - id: completed_feasibility_only
    evidence_value: instrument_and_resource_feasibility_only

  falsification:
    feasibility_claim: >-
      Falsified if the exact workload cannot finish all 128 verified shards and
      terminal artifacts inside every frozen ceiling.
    implementation_claim: >-
      Falsified if any protected predecessor blob changes, any output escapes
      the RUN003 namespace, retired worker epochs enter active RSS accounting,
      or the two null arms traverse different certificate pipelines.
    forward_guidance: >-
      An invalid run requires a new implementation repair and review. A true
      budget failure requires a new run ID and an explicitly justified budget
      or workload redesign. Neither result closes the smoothness mechanism.

  execution_preconditions:
  - This design and cost audit are snapshot-committed and independently reviewed.
  - A canonical protocol amendment materializes these exact semantics and is independently reviewed.
  - An implementation snapshot binds RUN_ID and every sink to RUN003 and passes independent review.
  - The complete RUN003 namespace is absent and predecessor Git blobs match their frozen hashes.
  - A separate explicit execution authorization fixes the commit, command, invocation count and ceilings.

  pareto_honesty:
    dominated_by: generic Pollard rho for the actual ECDLP objective
    reason: >-
      RUN003 solves zero ECDLP instances and has no source arm, whereas rho
      solves generic prime-order ECDLP in expected O(sqrt(n)) group operations
      and negligible stored distinguished points relative to this null corpus.
    sota_delta:
      generic_ecdlp_time_exponent: 0.0
      generic_ecdlp_memory_exponent: 0.0
      ecdlp_instances_solved: 0
      source_queries: 0
      null_factorizations_if_completed: 4186112
      interpretation: No algorithmic or asymptotic state-of-the-art change.

  claim_ceiling:
    maximum_supported_if_completed: >-
      The exact EXP-SMTH-002 null-only factorization and certificate instrument
      completed once under the frozen end-to-end resource ceilings with all
      integrity and identical-shape controls passing.
    never_supported_by_this_run:
    - evidence for or against HEUR-DS-1, H-SMTH-001 or H-SMTH-002
    - a source-arm smoothness advantage
    - an ECDLP algorithm or solved ECDLP instance
    - an improvement over Pollard rho or the generic Shoup lower bound
    - any asymptotic time, memory or data improvement
    - authorization for calibration, plant, source, full-contract or cryptographic-scale execution

  required_next_gate: >-
    Independent adversarial review of these exact design bytes and the cost/
    Pareto audit. A PASS may authorize drafting a canonical amendment only; it
    may not authorize implementation or execution.
