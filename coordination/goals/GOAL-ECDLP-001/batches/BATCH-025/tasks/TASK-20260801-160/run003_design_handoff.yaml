handoff:
  id: TASK-20260801-160
  from: coordinator
  to: idea-generator
  objective: >-
    Produce an amendment-ready, falsifiable design for a fresh
    RUN-SMTH-PILOT-003 feasibility experiment after the failed RUN002 and
    validated canonical RSS rebind, without authorizing or executing it.
  inputs:
  - experiments/EXP-SMTH-002/specification.yaml
  - experiments/EXP-SMTH-002/protocol-amendment.v10-successor-run.yaml
  - experiments/EXP-SMTH-002/protocol-amendment.v11-successor-run-archive-repair.yaml
  - experiments/EXP-SMTH-002/protocol-amendment.v12-merge-rebind.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-144/run002_validation.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-146/rss_accounting_red_team.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-151/rss_epoch_repair_validation.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-154/merge_reconciliation_validation.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-158/canonical_rebind_validation.yaml
  constraints:
  - design_only_no_execution
  - no_hypothesis_experiment_goal_or_ledger_status_change
  - no_canonical_amendment_or_run_package_creation
  - >-
    RUN003 must use a fresh run-specific, non-overwriting result namespace and
    must never resume, relabel, append to, or consume RUN002 partial artifacts
    as registered observations.
  - Specify whether the seed domain remains EXP-SMTH-002/v1 or becomes run-specific, with a reproducibility and comparability rationale.
  - Include identical-shape null controls before any belief update.
  - Charge setup, generation, factorization, certificates, verification, storage, CPU, wall time and concurrent RSS end to end.
  - Separate feasibility evidence from HEUR-DS-1, H-SMTH-001, ECDLP and asymptotic claims.
  - Include dominated_by and quantitative sota_delta after checking the declared frontier.
  - Do not stage, commit, push, merge or rebase.
  deliverables:
  - >-
    YAML design record specifying mechanism, preregistered predictions,
    controls, invalid conditions, metrics, exact budgets, stopping rules,
    artifact roster, execution preconditions, claim ceiling and falsification.
  - >-
    Markdown end-to-end cost and Pareto audit comparing RUN003 with RUN002,
    the repaired implementation envelope, and generic-rho as the scientific
    baseline rather than claiming equivalence.
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/tasks/TASK-20260801-160/run003_contract_design.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/tasks/TASK-20260801-160/run003_cost_pareto_audit.md
  archived_by: TASK-20260801-161
  inference:
    policy: research-deep
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
  - design is executable only after a separate canonical amendment, independent review and Coordinator authorization
  - all controls metrics budgets stopping rules and required artifacts are fixed before execution
  - RUN002 reuse and overwrite paths are explicitly prohibited
  - scientific and cryptanalytic claim ceilings are explicit
  - Pareto audit contains dominated_by and quantitative sota_delta
