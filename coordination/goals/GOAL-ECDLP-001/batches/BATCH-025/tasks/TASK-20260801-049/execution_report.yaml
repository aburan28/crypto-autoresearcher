        - {bits: 16, u_target: 5, Bsm: 84, u_recomputed: 5.00601, rho_computed: 3.4886e-04, p_hat_uniform: 0.00159464, R_u_uniform: 4.5709, powered: true, limb_b_decidable: true, replicates_inside_band: 200}
        - {bits: 16, u_target: 6, Bsm: 40, u_recomputed: 6.01286, rho_computed: 1.8904e-05, p_hat_uniform: 0.000219163, R_u_uniform: 11.5937, powered: false, limb_b_decidable: false, replicates_inside_band: 7}
        - {bits: 20, u_target: 2, Bsm: 1048576, u_recomputed: 2.00000, rho_computed: 3.0685e-01, p_hat_uniform: 0.346093, R_u_uniform: 1.1279, powered: true, limb_b_decidable: true, replicates_inside_band: 200}
        - {bits: 20, u_target: 3, Bsm: 10321, u_recomputed: 3.00001, rho_computed: 4.8608e-02, p_hat_uniform: 0.063456, R_u_uniform: 1.3055, powered: true, limb_b_decidable: true, replicates_inside_band: 200}
        - {bits: 20, u_target: 4, Bsm: 1024, u_recomputed: 4.00000, rho_computed: 4.9109e-03, p_hat_uniform: 0.00807482, R_u_uniform: 1.6443, powered: true, limb_b_decidable: true, replicates_inside_band: 200}
        - {bits: 20, u_target: 5, Bsm: 256, u_recomputed: 5.00000, rho_computed: 3.5472e-04, p_hat_uniform: 0.000867402, R_u_uniform: 2.4453, powered: true, limb_b_decidable: true, replicates_inside_band: 200}
