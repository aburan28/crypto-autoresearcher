        These numbers measure how far a KNOWN-UNIFORM sample of this exact size
        at this exact X departs from the asymptotic Dickman prediction. A false
        decidable flag is a MEASURED FACT ABOUT THE APPARATUS AND THE
        REFERENCE, never a result about the Semaev map in either direction, and
        it SATISFIES SUCC-LPF-1.
      rows:
        - {bits: 16, u_target: 2, Bsm: 65536, u_recomputed: 2.00000, rho_computed: 3.0685e-01, p_hat_uniform: 0.359075, R_u_uniform: 1.1702, powered: true, limb_b_decidable: true, replicates_inside_band: 200}
