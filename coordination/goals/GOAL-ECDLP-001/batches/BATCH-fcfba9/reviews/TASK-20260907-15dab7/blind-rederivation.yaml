  construction_notes: >-
    Independent derivation from the specification text and
    review_plan.blind_rederivation only. No producer implementation,
    execution report, Stage-1 run directory, Stage-0 raw-result.json,
    or sibling review was opened.

    gcd(n, p) = 1 is required; canonical_order_n_lift raises ValueError
    otherwise. For each F_p point, Hensel-lift the Weierstrass equation
    by holding affine x at its F_p representative in {0,...,p-1} and
    Newton-lifting y through f(y) = y^2 - x^3 - A x - B, one p-power at
    a time, guarding that 2y is a unit. The resulting point on
    E(Z/p^r Z) is converted to homogeneous projective coordinates
    (X : Y : Z) with x = X/Z, y = Y/Z. Apply [p] exactly (r-1) times by
    complete double-and-add, then multiply by (p^{r-1})^{-1} mod n.
    This is the spec's k-free construction: any Hensel lift, kill the
    formal-group component by [p^{r-1}], then rescale the prime-to-p
    part.

    Group law over Z/p^r is the Renes–Costello–Batina complete
    homogeneous addition (IACR ePrint 2015/1060, Algorithm 1, fetched
    only to correct an initial Jacobian-vs-homogeneous mis-reading of
    those formulas). Affine conversion inverts Z and refuses a non-unit
    Z. F_p arithmetic for [k]S is ordinary affine addition.

    Ordinary base-p digits are those of the unique representative of
    affine x in [0, p^r), as frozen in the specification's
    observable_convention.

    Per-instance sanity before sampling: S lies on E(F_p), [n]S is
    infinity over F_p, gcd(n, p) = 1, the constructed lift of S reduces
    to S, and [n] of that lift is infinity over Z/p^r. All six
    instances passed. Path (1) caches the lift of S and computes [k]
    of it; path (2) computes [k]S over F_p and lifts that point.
    Digit tuples are compared exactly.

    No ADV, D, or NULL-2 quantity was computed or interpreted.

