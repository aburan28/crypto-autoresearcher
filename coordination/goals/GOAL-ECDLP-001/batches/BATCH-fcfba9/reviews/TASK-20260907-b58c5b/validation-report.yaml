      assigned_to: TASK-20260907-b58c5b
      attack: >-
        Proves-too-much control. Read the execution report and Stage 0 lemma.
        Holds only if r=1 NULL-2 agreement is labeled width-zero / consistency
        and is not used as a discriminating or ADV-relevant observation.
        Confirm kfree_transport refuses gcd(n,p)!=1 (n=p, expect ValueError).
      breaking_artifact_seen: none
      verdict: holds
      computed:
        r1_labeled_width_zero_consistency: true
        r1_sold_as_discriminating: false
        r1_sold_as_projection_does_nothing: false
        n_equals_p_raises: ValueError
        n_equals_p_message: 'gcd(n, p) = 1 is required; the order-n lift does not exist'

