      dirty_summary '?? experiments/EXP-ECDLP-a98ea9/runs/'. Recorded; not a
      hash mismatch.
    - >-
      raw-result.json stores per-(instance,r) agree/compared aggregates, not
      per-sample digit tuples. The recompute is integer arithmetic on those
      stored counts. A recount of 10000 individual k-samples is not possible
      from this file alone.
    - >-
      ADV and D2 were not interpreted. The blind re-derivation joint is owned
      by TASK-20260907-15dab7 and was not performed here.
    - >-
