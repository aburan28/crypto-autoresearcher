  repair_gate_reviews:
    - gate: versioned_replacement_and_predecessor_immutability
      verdict: PASS
      detail: >-
        IDEA-20260808-b16d04 is a new random-suffix ID, declares replaces
        IDEA-20260808-4bd694, binds the predecessor's exact SHA-256, and the
        snapshot does not modify the predecessor.

    - gate: H4_raw_tail_reachability_in_proposal
      verdict: PASS
      recomputation:
        - {b: 21, L: 128, C_emit: 57344, T_out: 240, T_bucket: 12, L_squared: 16384, minimum_duplicate_bucket_r: 23}
        - {b: 24, L: 256, C_emit: 131072, T_out: 363, T_bucket: 16, L_squared: 65536, minimum_duplicate_bucket_r: 28}
        - {b: 27, L: 512, C_emit: 294912, T_out: 544, T_bucket: 23, L_squared: 262144, minimum_duplicate_bucket_r: 34}
      detail: >-
        X=Y=mmax=1 with no duplicates reaches PASS. At each top size one
        verifying bucket product of size T_out reaches FAIL below both L^2 and
        C_emit. Buckets r=23,28,34 give binom(r,2)=253,378,561 and reach the
        C_dup tail; buckets T_bucket+1 reach E_key/B_key tails. With
        alpha=.01/3 and n=192, zero bad curves gives one-sided CP upper
        0.029270278773621, the first lower bound above .05 is k=20 with
        0.053187753299561, and all-bad lower is 0.970729721226379.

    - gate: H4_repair_report_binding
      verdict: REVISE
      detail: >-
        The proposal freezes T_out=sqrt(C_emit), T_bucket=sqrt(L), and CP
        alpha=.01/3. The repair report instead claims threshold vector
        (8a,8a,4a,8a,4a) and alpha=.0004, while the design audit records a
        pass vector and confidence indices not present in the proposal. The
        self-audits therefore do not bind the frozen H4 gate they claim to
        validate.

    - gate: scalar_sampler_and_duplicate_occupancy
      verdict: REVISE
      sound_parts:
        - >-
          The proposal's SHAKE rejection sampler gives ordinary independent
          uniform draws with replacement and explicitly permits duplicates.
        - >-
          For C_dup=C_A+C_B+C_AB it correctly derives
          T_L=2L^2-L, E[C_dup]=T_L/N, and
          Var(C_dup)=T_L*(1/N)*(1-1/N); scaling by N gives
          B_occ=R_b*T_L*(N-1), so the printed 5-sigma PASS and 8-sigma FAIL
          integer comparisons are algebraically correct.
      blockers:
        - >-
          The repair report and design audit instead claim 2L distinct PRP
          inputs and exact within-side uniqueness. That is a different sampler
          and null law from the proposal.
        - >-
          The proposal says only "across R_b null roots" and does not freeze
          whether the gate is applied separately or jointly across N0/N1,
          192 curves, four models, and seven sizes, nor its multiplicity rule.
          Conforming implementations can therefore return different PASS or
          FAIL verdicts.

    - gate: H3_H4_interval_construction
      verdict: PASS
      detail: >-
        The proposal now freezes 20000 whole-curve resamples, K/MU/DELTA
        max-t families, studentized one-sided statistics, the 19801st
        one-based order statistic, interval inversion, singleton handling,
        and explicit nonpositive/nonfinite INCONCLUSIVE behavior. This is
        executable as written, although it is not the 25-bound Bonferroni
        construction claimed by the producer reports.

    - gate: N0_orbit_map_and_attainable_balance
      verdict: PASS
      recomputation: >-
        For H=(N-1)/2=qM+r, permutation t=pi(i) makes c=t mod M occur q+1
        times for c<r and q times otherwise. For each orbit the two signs of
        eps xor flip(i) supply one scalar of each sign, so signed counts are
        exactly equal and color counts differ by at most one. At N=103,M=5,
        H=51=10*5+1 and the complete histogram is
        [11,10,10,10,10,11,10,10,10,10] plus ZERO once.

    - gate: N0_N1_awkward_domain_KATs
      verdict: REVISE
      sound_parts:
        - >-
          The injected W=4,H=5,F_j=1 vector independently reproduces outputs
          [0,4,2,3,1], walks [2,1,2,2,1], and exact restricted inverse.
        - >-
          The eight declared (N,M) domains have sum H=247; for two controls
          the maxima 632320 capped round hashes, 988 flips, and 1004 emitted
          labels reproduce.
      blocker: >-
        The actual SHAKE-based awkward-domain KAT list supplies only (N,M).
        The seed frame also requires a curve digest, model, control, and
        replicate, but no concrete values or expected permutation digest are
        frozen. N=103,M=5 therefore tests only the permutation-independent
        histogram, not the actual frame, SHAKE rounds, or cycle walk. It is an
        exhaustive property-test request, not a complete known-answer test.

    - gate: N1_histogram_preserving_control
      verdict: PASS
      detail: >-
        The signed-domain Feistel restriction is bijective, its inverse is
        defined by reverse cycle walking, and the sign flip makes f commute
        with negation. Composition lambda_structured(f(x)) therefore preserves
        the complete structured histogram and antisymmetry.

    - gate: exact_quotient_definition_and_tolerance
      verdict: REVISE
      sound_parts:
        - >-
          The proposal fixes n_Q=1048576 trials at every b and the quotient
          G=Z/(257*K_Q)Z with K_Q=2M, giving exact hit probability 1/K_Q.
        - >-
          Exhaustive maps 522224, query pairs 7340032, operands 14680064, and
          the 64-block cap 939524096 reproduce.
      blockers:
        - >-
          In exact_tolerance, H is not defined as the hit count and is already
          bound to (N-1)/2 in orbit_domain. Thus E=abs(K_Q*H-n_Q) is ambiguous
          and is wrong under the only explicit H definition.
        - >-
          The proposal freezes p=1/(2M), while the repair report and design
          audit freeze K_b=2^(b/3)=M and p=1/K_b. The claimed repair is not
          denominator-consistent across artifacts.

    - gate: selector_removal
      verdict: PASS
      detail: >-
        Model selection is disabled, with four equal-weight diagnostic models,
        zero pilots, empty scores/domains/claims, and zero time/storage. No
        selector claim or max-plus term remains in the proposal.

    - gate: clustered_B2_design_arithmetic
      verdict: PASS
      recomputation:
        residualized_slope_information: 27.766022800414
        curves_per_size_42:
          lambda: 1.580984936481
          prospective_power: 0.474537391373
        curves_per_size_192:
          independent_outer_clusters_total: 1344
          lambda: 3.380287980549
          prospective_power: 0.958668050179
      detail: >-
        The free finite-size beta, model effects, curve and nested-model random
        effects, exact Bernoulli zeros, and 192 independent curves per size are
        preserved. These are prospective analytic calculations only.

    - gate: power_confirmation_and_profile_execution_definition
      verdict: REVISE
      blockers:
        - >-
          The proposal defines 24 power cells and 20000 replicates per cell,
          but does not freeze the confidence alpha or multiplicity adjustment
          for its power, type-I, and nonconvergence bounds. The reports instead
          claim 60 simultaneous bounds at alpha=1/6000 and 720000 power
          datasets, neither of which appears in the proposal.
        - >-
          The proposal charges 60000 primary profile datasets and 480000 power
          datasets, but does not freeze or charge the number of constrained
          profile evaluations, bisection steps, or both optimizer starts per
          dataset. The reports' 34-fit/profile and objective-cell formulas are
          absent from the proposal and cannot repair it by assertion.

    - gate: proposal_resource_vector_arithmetic
      verdict: PASS
      recomputation:
        roots_per_arm: 24969216
        roots_all_arms: 74907648
        entries_per_arm: 17178820608
        entries_all_arms: 51536461824
        base_group_equivalents_24L: 618437541888
        scalar_SHAKE_blocks_64_cap: 3298333556736
        N0_N1_minimum_round_hashes: 343576412160
        N0_N1_maximum_round_hashes: 21988890378240
        main_serialized_bytes: 323996245622784
        auxiliary_stage_serialized_bytes: 54593732608
        all_stage_serialized_bytes: 324050839355392
      detail: >-
        The proposal's main serialization recomputes from 1673741205504 entry
        bytes, 322302822580224 natural-L^2 emission bytes, 505479168 D bytes,
        and 19176357888 root-summary bytes. Adding replay, quotient, profile,
        power, planted, multiplicity, and H3/H4 stages reproduces the declared
        324050839355392-byte envelope.

    - gate: complete_resource_and_report_reconciliation
      verdict: REVISE
      blockers:
        - >-
          The repair report/design audit claim 1379013193920 serialized bytes,
          only about 1.254 TiB, versus the proposal's exact
          324050839355392-byte or 294.723-TiB envelope. The shortfall is
          322671826161472 bytes and cannot be a rounding convention.
        - >-
          The proposal caps two-control Feistel work at 21988890378240 round
          hashes; the reports claim 112693232738560. The proposal reserves 672
          in-flight replay slots; the reports claim 21. The proposal withholds
          worker seconds until calibration; the reports assert 472101415
          prospective worker seconds. These vectors are not one protocol.
        - >-
          The missing exact fitter/profile schedule means the proposal's
          resource vector is arithmetically reproducible but not complete for
          all mandatory acceptance gates.

    - gate: materialization_and_authorship_disclosure
      verdict: REVISE
      blockers:
        - >-
          The receipt says the Coordinator materialized because the Idea
          Generator role forbids filesystem writes. At d30eda54e,
          orchestration/roles.yaml grants the Idea Generator write_files and
          the Codex binding permits creation inside declared write scope.
        - >-
          The proposal says author_wrote_files=true and
          author_ran_read_only_checks=true; both producer reports say the
          author wrote no files and ran no commands; the receipt names a
          Coordinator materializer and says substantive_changes=false.
        - >-
          The proposal records resolved_model_id=null because it was not
          exposed, while the repair report asserts gpt-5.6-sol. The snapshot
          binds the contradictory bytes but cannot validate the asserted
          authorship, no-change transport, or exact model provenance.

  preserved_pass_reviews:
    - gate: output_sensitive_full_point_join
      verdict: PASS
      detail: >-
        D=L^2 remains arithmetic only. Full canonical points, every witness,
        exact complements, complete bucket products, derived-scalar checks,
        charged retry/fallback, and invalid-heavy replay semantics are
        preserved; a cap or replay failure never becomes I=0.
    - gate: D_Y_X_I_separation
      verdict: PASS
      detail: >-
        D is exposure, Y is tuple count, X is distinct verifying-key count,
        and I is 1[X>=1]. The multiplicity trap freezes X/I while changing
        Y/mmax, so alias multiplicity cannot silently become distinct success.
    - gate: conditional_Paley_Zygmund_algebra
      verdict: PASS
      detail: >-
        E[X(X-1)]<=kappa*mu^2 implies
        P(X>0)>=mu/(1+kappa*mu), while Markov gives P(X>0)<=mu. This is a
        conditional algebra check only, not evidence that H3 holds.
    - gate: exponent_only_full_cost_and_crossovers
      verdict: PASS
      detail: >-
        Raw time 2/3-gamma_B and storage 1/3 give full-cost exponent
        7/9-gamma_B under T*S^(1/3). Crossovers against rho exponent 1/2 are
        gamma_B>1/6 raw and gamma_B>5/18 full cost.
    - gate: separately_matched_constant_convention
      verdict: PASS
      detail: >-
        Exponent rows strip constants and the future concrete comparison keeps
        0.886*sqrt(N) separate from candidate overhead, including
        log2(24)=4.5849625007. No concrete advantage is claimed.
    - gate: narrowed_pooled_method_ceiling
      verdict: PASS
      detail: >-
        The ceiling remains limited to fixed target-independent balanced-fiber
        labels and explicitly excludes irregular, adaptive, advice, and
        selector regimes.
    - gate: Pareto_honesty_low_prior_and_novelty
      verdict: PASS
      detail: >-
        realized_delta is null, rho remains the achieved baseline, storage
        +1/3 is disclosed, gamma>5/18 prior remains .005, priority remains
        low, and novelty_status remains unverified.
    - gate: proof_search_map_presence
      verdict: PASS
      detail: >-
        Baseline reproduction, observation collisions, constructive
        transforms, quantifier order, method ceiling, nearby N1 control, and
        single-responsibility obligations remain present.
    - gate: provenance_preservation
      verdict: REVISE
      detail: >-
        Snapshot and input commit references are explicit, but the
        materialization/authorship/model contradictions above mean exact
        producer provenance was not preserved coherently.
    - gate: proposal_only_boundary
      verdict: PASS
      detail: >-
        No experiment/specification, implementation, run, empirical evidence,
        hypothesis transition, breakthrough, crypto-scale claim, commit by the
