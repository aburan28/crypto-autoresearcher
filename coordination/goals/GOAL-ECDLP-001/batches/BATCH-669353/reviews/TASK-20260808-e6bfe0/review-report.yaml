    curve/model/control families receive its 5/8-sigma rule, and the exact
    profile/power confidence and optimizer resource schedule is not frozen.
    Materialization disclosure is contradictory as to who wrote the files,
    whether commands ran, and which model authored them. These are repairable
    proposal-integrity defects, not ECDLP evidence. No experiment, approval,
    status transition, or execution authority is granted or implied.

