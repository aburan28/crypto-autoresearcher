  proof_architecture_checks:
    exact_baseline_reproduction:
      verdict: PASS
      detail: Uniform D/N exposure, quotient probability, and exponent rows are explicit baseline fixtures, subject to repairing the quotient notation.
    strictness_witness:
      verdict: PASS
      detail: No achieved improvement is claimed; future strictness still requires gamma_B lower greater than 5/18 and every control/cost gate.
    observation_collisions:
      verdict: PASS
      detail: Alias multiplicity, point encoding, finite beta, reuse, caps, and null placement are enumerated without treating bounded searches as global proofs.
    interface_preservation:
      verdict: REVISE
      detail: Join interfaces pass, but sampler, quotient, KAT, resource, and materialization interfaces disagree across the three source artifacts.
    ceiling_and_nearby_control:
      verdict: REVISE
      detail: The analytic ceiling and N1 concept remain sound, but the missing concrete KAT seed and incomplete exact-fitter gate prevent a frozen nearby-control protocol.
    quantifier_fidelity:
      verdict: PASS
      detail: Public design choices precede curves and targets; adaptive target-dependent choices remain excluded.

  new_findings:
    - id: NF1-cross-artifact-protocol-split
      severity: critical
      category: artifact_integrity
      finding: >-
        Proposal, repair report, and design audit bind incompatible sampler,
        H4 confidence, quotient, power, replay, Feistel, profile, and resource
        definitions. A later designer cannot know which frozen protocol was
        independently validated.
    - id: NF2-materialization-provenance-contradiction
      severity: critical
      category: provenance
      finding: >-
        The snapshot binds mutually exclusive authorship/write/command/model
        claims, and its stated reason for Coordinator materialization conflicts
        with the committed role capability.
    - id: NF3-quotient-hit-count-overload
      severity: major
      category: executable_control
      finding: >-
        H in the quotient tolerance is undefined as a hit count and already
        denotes (N-1)/2; proposal and reports also disagree by a factor two in
        the quotient success probability.
    - id: NF4-awkward-KAT-missing-seed
      severity: major
      category: control_construction
      finding: >-
        The N=103,M=5 histogram is correct but no complete actual SHAKE seed
        tuple or expected mapping digest is frozen, so framing/cycle-walk KAT
        execution is not reproducible.
    - id: NF5-profile-power-gate-not-fully-frozen
      severity: critical
      category: cost_and_power
      finding: >-
        Confidence multiplicity and exact optimizer/profile evaluation counts
        are missing from the proposal, while the producer reports assert a
        different unbound construction and a resource total smaller by more
        than 322 trillion serialized bytes.

  complete_discharge_gate:
    verdict: REVISE
    passed_repairs:
      - H4 raw-tail reachability in the proposal
      - occupancy moment algebra in the proposal
      - N0 quotient-remainder mapping and attainable balance
      - N1 histogram-preserving bijection
      - selector removal
      - H3/H4 max-t interval construction in the proposal
      - clustered B2 prospective arithmetic
      - proposal resource-vector integer arithmetic
    unresolved_repairs:
      - cross-artifact protocol consistency
      - duplicate-gate family scope
      - complete awkward-domain KAT seed and expected output
      - exact quotient numerator and factor-two probability consistency
      - profile/power confidence multiplicity and optimizer resource schedule
      - materialization, authorship, command, and model provenance
    statement: >-
      Preserve the valid immutable snapshot and the sound proposal algebra, but
      create a new additive versioned replacement that contains one canonical
      sampler, quotient, confidence family, profile algorithm, resource vector,
      and provenance statement. Obtain a fresh snapshot and independent review
      before any experiment-design batch.

  cheapest_falsification_control:
    name: seed-complete N=103,M=5 integer N0/N1 plus quotient transcript
    why_cheapest: >-
      A deterministic integer-only checker can exhaust 103 scalars, the forward
      and inverse restricted Feistel, antisymmetry, the exact signed histogram,
      N1 histogram identity, quotient fibers, and operation counters without
      elliptic-curve arithmetic or stochastic sampling. It directly tests the
      highest-risk control interface before expensive B2 work.
    prerequisite: >-
      First freeze one complete curve-digest/model/control/replicate seed tuple,
      an expected permutation or digest, one unambiguous quotient hit-count
      symbol, and one success denominator. The current snapshot cannot execute
      this full KAT reproducibly.
    expected_valid_result: >-
      N0 produces [11,10,10,10,10] for each sign and ZERO once; N1 preserves
      the full structured histogram; forward/inverse agree pointwise; quotient
      fibers all have size 257; exact counters match the frozen transcript.
    authorization_note: >-
      This is a recommendation for a future Coordinator-approved protocol. It
      was not run as an experiment, assigned to an Executor, or authorized by
      this review.

  required_revision_gate:
    - Choose the proposal's with-replacement occupancy sampler or a collision-free PRP and make all three successor artifacts state the same choice and null law.
    - Freeze the duplicate 5/8-sigma gate separately or jointly across explicit arm, size, curve, and model families with its multiplicity correction.
    - Add complete actual SHAKE KAT seed tuples and expected mappings or digests, including N=103,M=5.
    - Rename the quotient hit count, bind n_Q=2^20 once, and use one success probability consistently across proposal and reports.
