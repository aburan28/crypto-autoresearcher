      repair: >-
        Mint path-stable category-and-arm-qualified IDs for all 101 rows and
        require a global uniqueness assertion over the flattened schedule.
    - id: VAL-NEW-XOF-001
      severity: critical
      blocking: true
      category: generator_reproducibility_and_cost
      evidence: >-
        Bootstrap index domains alone consume exactly 64668272640 uncharged
        bytes. Treatment and selector-control scalar/list generation and
        fixture u,r,a,delta generation use rejection streams with no word cap,
        event rows, or archive schema. selector_control retains open <arm> and
        <name> placeholders instead of an enumerable component grammar. The
        proposal promises every accepted-word index is retained, but no
        retained record width or archive capacity binds those indices; the
        treatment lists alone contain 65011712 accepted scalars.
      impact: >-
        Seeds do not determine a bounded compiler schedule, byte traffic, or
        immutable regeneration package. Shared-root and control provenance
        therefore cannot be verified byte-for-byte.
      repair: >-
        Enumerate every control arm and component, define per-stream rejection
        and duplicate-test caps with fail-closed semantics, charge all fixed
        and rejected XOF words and tests, retain accepted indices in a frozen
        schema, and recompile traffic, archive, memory, CPU, wall, and stopping
        rows.
    - id: VAL-NEW-ARCHIVE-IO-001
      severity: critical
      blocking: true
      category: archive_traffic_completeness
      evidence: >-
        Fourteen of 37 archive allocations, totaling 41430592 bytes, have no
        explicit atomic write-plus-verification-read mapping. A consistent
        two-pass charge is 82861184 bytes; even crediting the lone curve-
        certificate use read as one pass leaves at least 82205824 bytes absent.
      impact: >-
        The 324324469056-byte headline is not the promised sum of every archive
        write and verification read, so admission and hard-reserve claims are
        incomplete.
      repair: >-
        Give every archive row an exact record-count and width derivation plus
        exactly one globally identified write row and one verification-read
        row, and regenerate all totals from that bijection.
    - id: VAL-NEW-SAMPLER-LAW-001
      severity: critical
      blocking: true
      category: exact_control_probability
      evidence: >-
        Five parameter rows are dyadic and terminate exactly. Ten are non-
        dyadic. Removing the one t=256 dyadic cell that straddles q and
        conditioning on a valid package yields
        floor(q*2^256)/(2^256-1), not q. The claimed exact Bernoulli(q) law on
        admitted packages is therefore false, although the numerical change is
        below 2^-256.
      impact: >-
        The planted gamma targets and their pseudo-true references are not the
        exact law of the confirmatory package specified by the validity gate.
        A tiny discrepancy cannot be called zero under an exact-control
        contract.
      repair: >-
        Adopt a finite exact rational law and recompute targets, or explicitly
        certify and use the cap-conditioned law. Do not combine an irrational
        exact-law claim with a finite fail-closed cap and then ignore the
        conditioning.
    - id: VAL-NEW-IDENTITY-EQUATION-001
      severity: critical
      blocking: true
      category: elliptic_curve_correctness_and_cost
      evidence: >-
        h_y(O) and phi_u(O) are stated, but no unique infinity encoding,
        on-curve identity branch, or identity operation/traffic row exists.
        The affine on-curve rate charges two multiplications and two squarings
        but omits two additions and the final equality for each of 52480 checks.
      impact: >-
        Identity points can arise in sampled lists, Q-prime, pair sums, or
        fixture intermediate sums. The mandatory gate and field-operation
        budget do not define how such points pass or how full curve equations
        are checked.
      repair: >-
        Freeze infinity serialization and validation, specify identity and
        affine branches including coefficient reads, two affine additions, and
        comparison, retain branch outcomes, and recompile operations, traffic,
        CPU, wall, and hashes.
    - id: VAL-NEW-STANDARDIZED-PARETO-001
      severity: major
      blocking: true
      category: cost_unit_and_pareto_completeness
      evidence: >-
        Raw and full logarithmic exponents recompute, but peak_log2_bytes
        implies undeclared 96-, 128-, and 160-byte entry widths at 256, 384,
