  verdict_summary: >-
    The immutable successor correctly repairs the scoped coverage-rank key
    domains, shared-canonical-root ownership, and exact-quotient L=M=U-1
    schedule, and all requested headline arithmetic reproduces. It is not yet
    one compiler-reproducible, fully charged design. The 101 atomic traffic
    rows have non-global identifiers and omit fixed bootstrap XOF traffic,
    variable rejection-sampling traffic and accepted-index retention, and
    write-plus-verification traffic for fourteen archive allocations. The
    purported exact finite non-dyadic sampler changes its Bernoulli law when a
    valid package is conditioned on no cap hit. The on-curve schedule has no
    identity-point branch and does not charge the full affine curve equation.
    The standardized byte rows hide size-dependent entry widths, and the
    Pareto table names a data/query axis absent from every row. These are
    repairable design defects, not a fatal obstruction to the research lane,
    so the exact verdict is REVISE rather than NO-GO.

