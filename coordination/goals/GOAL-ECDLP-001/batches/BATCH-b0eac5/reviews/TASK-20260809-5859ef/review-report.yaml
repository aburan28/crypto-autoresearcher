  findings:
    - id: VAL-NEW-ROW-ID-001
      severity: critical
      blocking: true
      category: deterministic_schedule_identity
      evidence: >-
        The 101 atomic traffic rows contain 52 unique unqualified IDs. Twenty-
        three labels are duplicated, creating 49 excess occurrences, even
        though the schedule reconciliation rule says a duplicate row ID is a
        compiler rejection and this task requires global uniqueness.
      impact: >-
        A receipt, residual, or compiler diagnostic cannot bind one atomic row
