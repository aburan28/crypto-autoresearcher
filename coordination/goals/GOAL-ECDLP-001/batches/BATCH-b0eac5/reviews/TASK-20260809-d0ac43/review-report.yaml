        sampler_archive_bytes: 5899200
        sampler_traffic_bytes_displayed: 15728640
        sampler_live_memory_bytes: 65536
        cap_bits_per_event: 256
      algebra_check: >-
        For q=K^(-1/d), the t-bit half-open cell is
        [A_t/2^t,(A_t+1)/2^t). The inequality
        K*(A_t+1)^d<=2^(t*d) puts the whole cell below q, and
        K*A_t^d>=2^(t*d) puts the whole cell at or above q. The two decisions
        are therefore exact and disjoint. A non-dyadic boundary leaves at most
        one unresolved 256-bit cell; a dyadic boundary separates exactly.
      finite_error_and_cap_check: >-
        Every emitted bit has zero comparison error. Exactly 32 bytes are
        consumed whether the decision occurs early or late. If no inequality
        separates by bit 256, no bit is emitted and the entire package is
        invalidated. The per-event cap-hit probability is at most 2^-256 and
        the stated 122880*2^-256 union bound is correct. This failure state is
        not silently treated as a Bernoulli outcome or mathematical evidence.
      limitation: >-
        The algorithm and charges are prospective and were not executed. The
        missing sampler-parameter archive traffic is included in the traffic
        blocker above; it does not change the correctness of the comparison.

