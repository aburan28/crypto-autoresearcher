    8083534080 bootstrap-index keys and for the selector list generators, and
    it omits write-plus-verification traffic for six newly named dynamic archive
    rows. The bootstrap index output/consumption rule is no longer explicit,
    despite the predecessor having frozen a one-byte mask rule, and the
    unbounded rejection-sampling accepted-word indices are promised as retained
    without an exact archive row, traffic row, or fail-closed cap. Finally,
    admitted fixture scalars can make A0, B0, T0, Q_neq, or W_neq the identity,
    while the fixture schedule asserts exactly two multiplications and two
    squarings for every on-curve check without freezing an identity-point
    predicate, rejection rule, or dummy-operation convention. These are
    versionable determinism and end-to-end accounting defects. The displayed
    totals are proposed schedule assertions only.

