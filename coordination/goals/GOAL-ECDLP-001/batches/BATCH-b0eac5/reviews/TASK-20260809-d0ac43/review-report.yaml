        on_curve_archive_bytes: 11680
        planned_CPU_nanoseconds: 10496000000
        hard_CPU_nanoseconds: 20992000000
        planned_wall_nanoseconds: 2624000000
        hard_wall_nanoseconds: 5248000000
        point_batch_buffer_bytes: 8192
        result_bitset_buffer_bytes: 8192
        on_curve_bits: 52480
        per_curve_stream_hashes: 160
      algebra_check: >-
        For an affine short-Weierstrass point the intended membership equation
        is y^2=x^3+A*x+B. Computing y^2 and x^2, followed by x^2*x and A*x,
        accounts for the displayed two squarings and two multiplications. The
        isomorphism equation with A*u^4, B*u^6 and
        phi_u(x,y)=(u^2*x,u^3*y) is algebraically correct for nonzero u, and
        the nonzero-delta proof correctly makes Q_neq distinct from T0.
      residual_blocker: >-
        Distinct nonzero r1 through r4 do not prevent r1+r2=0 or r3+r4=0, so
        A0 or B0 may be the identity. Their total may make T0 and Q_eq the
        identity. A nonzero delta can make Q_neq the identity, and
        k_hat_neq can be zero so W_neq is the identity. The proposal defines
        phi_u(O)=O but does not freeze the on-curve predicate, point-record
        encoding, or field-operation behavior for O. It also does not reject
        these scalar combinations or specify fixed dummy field operations.
        Therefore 52480 point events are enumerated, but the claim of exactly
        104960 multiplications and 104960 squarings is not an exact operation
        schedule for every admitted fixture.
      required_revision: >-
        Freeze an identity-inclusive on-curve predicate and lossless record
