      disposition: count_repair_satisfied_identity_semantics_still_blocking
      point_enumeration:
        canonical_P_and_Q: 320
        canonical_R1_R2_R3_R4_A0_B0_T0: 8960
        canonical_D_delta_Q_neq_W_neq: 3840
        canonical_total: 13120
