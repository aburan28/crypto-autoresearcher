  rationale: >-
    The proof-search map is complete and the proposed audit is a cheap,
    deterministic certificate check of whether the named special-j families
    can realize a relation-free rank-3 eigenvalue configuration. It carries
    no cost, exponent, or cryptographic-scale claim.
  constraints:
    - Scope is limited to ordinary prime-field J=0 and J=1728 cells in the frozen toy instances.
    - Generic-j rank-one and synthetic [1,2,4] controls are mandatory.
    - A timeout or implementation failure is infrastructure evidence only.
    - No ledger evidence or hypothesis status transition occurs before independent review.
