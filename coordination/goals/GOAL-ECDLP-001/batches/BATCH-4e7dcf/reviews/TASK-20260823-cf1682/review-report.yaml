          "class": "labelled_witness_descent_correctness",
          "severity_within_joint": "material_and_locally_repairable",
          "statement": "The leaf-explicit descent stores and returns h_j=m^j, but under the packet's fixed pullback orientation leaf j is supported at the signed class of m^{-j}, not m^j.",
          "derivation": [
            "The packet fixes (sigma_m f)(alpha_bar_v)=f(alpha_bar_(mv)).",
            "Therefore sigma_m^j(delta_P)(alpha_bar_v)=1 iff m^j v is congruent to +1 or -1 mod ell.",
            "Equivalently, the starting scalar class is v congruent to +m^{-j} or -m^{-j} mod ell.",
            "A leaf hit at index j must consequently return m^{-j} (up to sign), whereas the frozen leaf representation and recovery algorithm return m^j.",
            "The returned candidates a+m^j and a-m^j are correct only in the exceptional case m^{2j} congruent to +1 or -1; this is not the claimed uniform descent."
          ],
          "symbolic_counterexample": "Take ell=13, m=3, so H={1,3,9}, D=3, s=1, and r=3. For leaf j=1, v=9=m^{-1} satisfies 3*v=1 mod 13, so sigma_m(delta_P) hits at alpha_bar_9. The frozen descent returns h=3, but the correct signed class is {9,4}; {3,10} is disjoint from it, so final verification of a+3 and a-3 fails when u-a is in {9,4}.",
          "affected_artifacts": [
