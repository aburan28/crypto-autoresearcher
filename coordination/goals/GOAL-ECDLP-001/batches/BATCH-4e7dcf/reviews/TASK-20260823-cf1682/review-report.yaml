        "joint": "J1-finite-quotient-lattes-automorphism-idempotent-and-projector-typing",
        "verdict": "holds",
        "scope": "declared split-root stratum only",
        "checks": [
          {
            "check": "field, root, squarefreeness, and quotient typing",
            "verdict": "holds",
            "derivation": "P in E(F_q) implies every nonzero multiple [v]P and alpha_bar_v=x([v]P) are F_q-rational. For exact odd-prime order ell, alpha_bar_v=alpha_bar_w implies v=+w or -w mod ell, so the signed roots are distinct. Hence Phi_P splits into distinct linear factors, A is the reduced product of n=(ell-1)/2 copies of F_q, and CRT coordinate evaluation is injective. No nonzero subgroup point is O or two-torsion because ell is odd."
          },
          {
            "check": "Lattes denominator and substitution automorphism",
            "verdict": "holds",
            "derivation": "For a cancelled representative N_m/G_m of the descended multiplication map, [m_tilde][v]P is nonzero for every v because m is nonzero mod ell. The map is finite at every signed subgroup root, so a reduced denominator has no zero there. Thus gcd(G_m,Phi_P)=1, Bezout gives a unit in A, and lambda_m is defined. Coordinatewise lambda_m(alpha_bar_v)=alpha_bar_(mv); multiplication by m permutes Omega and the similarly typed m^{-1} substitution is its inverse."
          },
          {
            "check": "primitive idempotent and signed-orbit indicator",
            "verdict": "holds",
            "derivation": "Because every coordinate lies in F_q, delta_P=1-(xi-alpha_bar_1)^(q-1) is one at alpha_bar_1 and zero at all other roots. With (sigma_m f)(alpha_bar_v)=f(alpha_bar_(mv)), sigma_m^j(delta_P) is one precisely when m^j v=+1 or -1. Exactly one j modulo r=D/s has this property for v in +H union -H and none does otherwise, so e_H is the Boolean support idempotent. The equality with 1-V_(P,H)(xi)^(q-1) follows coordinatewise by CRT."
          },
          {
            "check": "trace/projector normalization and exceptional branches",
            "verdict": "holds",
            "derivation": "The action has signed order r and T_H^2=r*T_H. The producer correctly calls r^{-1}T_H a linear projector only when char(F_q) does not divide r; the unnormalized trace and Boolean algebra idempotent e_H remain valid when char(F_q) divides r. The nonsplit/extension-coordinate q-1 formula, characteristic two, ell=char(F_q), identity R_a=O, s=1, s=2, and r=1 branches are separated rather than silently transferred."
          }
        ],
        "limitations": [
          "This verdict establishes formula typing on the declared split-root stratum. It does not establish a subambient constructor, evaluator, cost improvement, or extension-field descent."
        ]
