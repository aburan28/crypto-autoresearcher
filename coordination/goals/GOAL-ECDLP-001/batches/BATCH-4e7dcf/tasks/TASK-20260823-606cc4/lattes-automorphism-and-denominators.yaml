    "typed_definition": {
      "integer_lift": "Choose m_tilde in Z with m_tilde congruent to m mod ell and gcd(m_tilde,p)=1. Such a lift exists because ell != p; adding multiples of ell avoids the single residue 0 mod p.",
      "rational_map": "Multiplication [m_tilde] commutes with [-1], so it descends through the x-quotient to a rational function L_m=N_m/G_m in F_q(X) satisfying L_m(x(R))=x([m_tilde]R) wherever [m_tilde]R is not O.",
      "quotient_element": "g=G_m(xi) in A. Once g is proved a unit, define lambda_m=N_m(xi)*g^(-1) in A and sigma_m(f(xi))=f(lambda_m)."
    },
    "denominator_unit_proof": {
      "orbit_no_poles": "For every v in F_ell^*, [m_tilde]([v]P)=[m_tilde*v]P is not O because m_tilde*v is nonzero mod ell. Hence the descended x-coordinate map is regular and finite at every alpha_bar_v.",
      "representative_requirement": "Fix a cancelled numerator/denominator representation N_m/G_m whose denominator cuts out the pole divisor of the descended map, equivalently use a division-polynomial denominator after cancellation. A raw formula with a removable 0/0 is not admissible.",
      "rootwise_nonvanishing": "With that fixed representative, regularity at each orbit point gives G_m(alpha_bar_v) != 0. Therefore gcd(G_m,Phi_P)=1.",
      "bezout_unit": "Because gcd(G_m,Phi_P)=1, there exist B,C in F_q[X] with B*G_m+C*Phi_P=1. Modulo Phi_P, B(xi) is the inverse of g. This explicitly proves the quotient denominator is a unit.",
      "failure_branch": "If a proposed concrete N_m/G_m has G_m(alpha_bar_v)=0 for any root, substitution with that representative is ill-typed and must stop. One may cancel/rechoose a representative and reprove the unit property; notation alone does not repair it."
    },
    "well_defined_substitution": {
      "root_action": "lambda_m(alpha_bar_v)=alpha_bar_(mv) for every bar_v in Omega because m_tilde congruent to m mod ell on <P>.",
      "ideal_preservation": "Phi_P(lambda_m) evaluates to 0 at every CRT coordinate, so it is 0 in reduced A. Thus evaluation f -> f(lambda_m) descends from F_q[X] to A independently of the polynomial representative of f.",
      "permutation": "Multiplication by m permutes Omega. Its inverse is multiplication by m^(-1) mod ell, whose similarly typed substitution is inverse on every CRT coordinate. CRT injectivity gives sigma_(m^-1) composed with sigma_m = identity and the reverse composition. Hence sigma_m is an F_q-algebra automorphism.",
      "orientation": "For all f in A, (sigma_m f)(alpha_bar_v)=f(alpha_bar_(mv)). Therefore sigma_m^j(delta_P)(alpha_bar_v)=1 exactly when m^j v is congruent to +1 or -1. This orientation is fixed throughout the packet."
    },
    "order_and_trace": {
      "signed_order": "The permutation induced by m on Omega has order r=D/s: m^j acts trivially on signed classes iff m^j is in {+1,-1}, and the first such exponent is |H|/|H intersect {+1,-1}|.",
      "operator_identity": "sigma_m^r=identity_A, and no smaller positive power is identity on the coordinate alpha_bar_1.",
      "normalization_exception": "The orbit sum T_H has T_H^2=r*T_H. Only when r is nonzero in F_q may r^(-1)T_H be formed as an idempotent linear projector. The orbit indicator e_H does not require this normalization."
