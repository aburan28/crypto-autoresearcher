proposals:

  # -----------------------------------------------------------------------
  # IDEA-20260804-0f5339
  # EC division polynomial recurrence as a character sum bound for H-PSEUDO
  # -----------------------------------------------------------------------
  - id: IDEA-20260804-0f5339
    goal_id: GOAL-ECDLP-001
    direction: novel
    status: proposed
    added: '2026-08-04'
    authored_by: TASK-20260804-158

    avoids_tate_obstruction: not_applicable

    mechanism: >-
      The x-coordinate of [k]P satisfies: x([k]P) = ψ_{k-1}(x(P)) · ψ_{k+1}(x(P)) / ψ_k(x(P))²
      where ψ_k are the DIVISION POLYNOMIALS of E, which satisfy a recurrence:
      ψ_{2k+1} = ψ_{k+2} · ψ_k³ - ψ_{k-1} · ψ_{k+1}³ (odd index recurrence)

      The division polynomials ψ_k are POLYNOMIALS in x (and y) with coefficients in Z.
      For a prime-order curve with prime N: ψ_N ≡ 0 mod N (all N-torsion points).

      PROPOSED MECHANISM: The factor base indicator 1_{x([j]G) < t} can be expressed as
      1_{ψ_{j-1}(x(G))·ψ_{j+1}(x(G)) / ψ_j(x(G))² < t}.
      The Fourier transform hat{1_F}(k) = Σ_j 1_{x([j]G)<t} · e^{2πi kj/N} involves
      a sum over j of the indicator of "the j-th division polynomial ratio is small."

      KEY: Can the RECURRENCE STRUCTURE of ψ_k give bounds on this Fourier sum?
      The division polynomials ψ_k satisfy a 4-term linear recurrence in k (for fixed P).
      If this recurrence can be related to the exponential e^{2πi kj/N}, it might give
      a bound on the Fourier sum via generating function methods.

    predictions:
      - metric: division_polynomial_dft_bound
        direction: lower
        minimum_effect: >-
          The generating function G(z) = Σ_k x([k]P) · z^k satisfies a recurrence.
          The Fourier transform hat{1_F}(k) = Σ_j 1_{G_k < t} · e^{2πi kj/N} might be
          bounded by the radius of convergence of G(z) at z = e^{2πi k/N}.

    minimal_discriminating_test:
      description: >-
        At p=1009: compute the division polynomials ψ_1,...,ψ_N for a random curve.
        Check: does the sequence x([j]G) = ψ_{j-1}ψ_{j+1}/ψ_j² satisfy a linear
        recurrence? If yes: the generating function has poles at specific z values,
        giving natural Fourier bounds.
      estimated_cost: "~30 minutes SageMath at p=1009"
      pass_criterion: >-
        The division polynomial ratio sequence satisfies a linear recurrence of degree d,
        and the bound |hat{1_F}(k)| = O(d * sqrt(B)) follows from the recurrence length d.
      fail_criterion: >-
        The division polynomial sequence has no useful recurrence (degree d = N): no improvement.

    null_object_control:
      description: >-
        For a random sequence y_j with the same distribution (not from EC): does it also
        satisfy a degree-d recurrence? If yes: the recurrence is not EC-specific.
      expected_null_result: >-
        Random sequence: no fixed-degree recurrence. EC sequence: degree ~ sqrt(N) via
        division polynomials. If EC division polynomial degree grows as sqrt(N): no improvement.

    falsification_criteria:
      - >-
        The division polynomial ratio sequence has recurrence degree ~ N (full-length):
        no useful bound. This is the expected outcome.
      - >-
        Any Fourier bound derived from the division polynomial recurrence requires knowing
        the division polynomials, which requires knowing the curve — not the DL. So this
        IS non-circular. But if the bound is O(sqrt(N)) (Weyl-type), it doesn't improve
        on the Shparlinski bound.

    dominated_by: not_applicable (proof attempt)
    sota_delta: {time_exponent: not_applicable}
    target_class: conditional
    recommended_priority: medium

    proof_search_map:
      observation_collision_search: >-
        Division polynomial recurrences for ECDLP: search literature. The sequence
        x([k]G) is the "Somos-like" sequence associated to E. Is Somos = division polynomial
        ratio? If yes: Somos sequences have known linear recurrences, potentially useful.
      exact_baseline_reproduction: >-
        Compute ψ_1,...,ψ_50 for a random curve at p=1009 and verify the recurrence.
        Confirm: does x([k]G) = ψ_{k-1}·ψ_{k+1}/ψ_k² follow a linear recurrence
        of degree < N?
      quantifier_order_statement: >-
        Claim: FOR ALL primes p and prime-order E, the sequence x([j]G) satisfies a
        linear recurrence of degree d < N, giving |hat{1_F}(k)| ≤ d * C' * sqrt(B).
      method_ceiling: >-
        If the recurrence has degree d ~ sqrt(N): bound is d * sqrt(B) ~ N^{1/4} * sqrt(B).
        This is WORSE than H-PSEUDO target O(sqrt(B)). Need d = O(1) for improvement.
        d = O(1) would mean x([j]G) is periodic with period O(1) — impossible for prime N.
        METHOD CEILING: O(sqrt(N)) from division polynomial degree. Not useful for H-PSEUDO.

  # -----------------------------------------------------------------------
  # IDEA-20260804-c3577b
  # Spectral gap of the EC multiplication graph as a character sum bound
  # -----------------------------------------------------------------------
  - id: IDEA-20260804-c3577b
    goal_id: GOAL-ECDLP-001
    direction: novel
    status: proposed
    added: '2026-08-04'
    authored_by: TASK-20260804-158

    avoids_tate_obstruction: not_applicable

    mechanism: >-
      Define the "EC multiplication graph" M_G: a regular bipartite graph on E(F_p) × F_p
      where (P, x) is an edge iff x = x(P). The factor base indicator 1_{x(P)<t} is the
      characteristic function of a vertex set in F_p.

      The Fourier transform hat{1_F}(k) = Σ_{P: x(P)<t} e^{2πi k·DL(P)/N} is a
      "mixing" quantity: how well does the "small x" set align with the "DL-k periodic" set?

      SPECTRAL GAP APPROACH: The "mixing time" of the map j → e^{2πi kj/N} over the
      set S = {j: x([j]G) < t} is related to the spectral gap of the operator
      T_k: L²(S) → L²(S) that applies e^{2πi k·} to the indicator.

      However: this reduces to the Fourier coefficient analysis we already have.
      The spectral gap of T_k = |hat{1_F}(k)|² / |S| = B/N (trivially).
      No improvement from spectral theory.

    minimal_discriminating_test:
      description: "Mathematical analysis only — no experiment needed"
      estimated_cost: "~1 hour"
      pass_criterion: "Non-trivial spectral gap bound"
      fail_criterion: "Spectral gap = B/N (trivial, no improvement)"

    null_object_control:
      description: "Compare spectral gap for EC S vs random S"
      expected_null_result: "Both give spectral gap ~ B/N"

    falsification_criteria:
      - >-
        The spectral gap of T_k reduces to |hat{1_F}(k)|² / B = C²/N — exactly
        H-PSEUDO in disguise. No improvement.

    dominated_by: not_applicable
    sota_delta: {time_exponent: not_applicable}
    target_class: false
    target_class_reason: >-
      The spectral gap approach is equivalent to H-PSEUDO — it doesn't provide a
      new way to bound the character sum.
    recommended_priority: low

    proof_search_map:
      observation_collision_search: "Already covered by BGS analysis (BATCH-066)."
      exact_baseline_reproduction: "Trivial: spectral gap = C²/N by definition."
      quantifier_order_statement: "Equivalent to H-PSEUDO — circular."
      method_ceiling: "Same as H-PSEUDO. No improvement possible."
