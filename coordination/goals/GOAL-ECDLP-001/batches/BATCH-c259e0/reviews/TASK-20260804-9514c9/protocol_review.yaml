  gap_reviews:
    - id: GAP-1
      name: curve_and_factor_base_deterministic_construction
      disposition: amendment_required
      committed_material:
        - experiments/EXP-SMTH-92d322/specification.yaml:66-78
        - experiments/EXP-SMTH-92d322/specification.yaml:159-167
        - experiments/EXP-SMTH-92d322/specification.yaml:228-237
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-c259e0/tasks/TASK-20260804-1bdcf5/snapshot_input_audit.md:25-31
      finding: >-
        The draft fixes sizes, a master seed, a domain, and the pair loop, but
        only describes curve and factor-base construction as deterministic.
        It does not specify seed-to-prime and curve derivation, ordinary/other
        eligibility tests, rejection and retry order, point or x-coordinate
        enumeration, selection, ordering, or failure behavior. The draft
        itself labels this requirement currently unspecified.
      minimal_successor_rule: >-
        Specify one total deterministic algorithm from (master_seed, domain,
        bits) to the exact prime, curve parameters, and ordered 512 distinct
        x-coordinates, including every eligibility test, rejection/retry rule,
        enumeration order, duplicate handling, and terminal failure condition.
    - id: GAP-2
      name: int_1_enc_b_root_multiset_and_exceptions
      disposition: amendment_required
      committed_material:
        - experiments/EXP-SMTH-92d322/specification.yaml:46-64
        - experiments/EXP-SMTH-92d322/specification.yaml:228-237
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-c259e0/tasks/TASK-20260804-1bdcf5/snapshot_input_audit.md:27-29
      finding: >-
        The draft names elementary symmetric functions reduced to [0,p-1] and
        gives only the ENC-B codomain. It supplies neither the INT-1/ENC-B
        arithmetic formula nor a complete root-multiset procedure. It does not
        state multiplicity, non-split or repeated-root handling, field
        representative conventions beyond the stated output interval, or any
        arithmetic and encoding exceptions.
      minimal_successor_rule: >-
        Specify the exact S_3 coefficient and root-multiset/invariant
        computation, canonical field-to-integer representatives, the complete
        INT-1 and ENC-B formulas, and a deterministic disposition for every
        exceptional case, including repeated and non-split roots and any
        arithmetic or encoding failure.
    - id: GAP-3
      name: complete_factorization_solver_configuration_and_output_verification
      disposition: amendment_required
      committed_material:
        - experiments/EXP-SMTH-92d322/specification.yaml:61-64
        - experiments/EXP-SMTH-92d322/specification.yaml:101-113
        - experiments/EXP-SMTH-92d322/specification.yaml:221-226
        - experiments/EXP-SMTH-92d322/specification.yaml:228-237
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-c259e0/tasks/TASK-20260804-1bdcf5/snapshot_input_audit.md:29-30
      finding: >-
        Completeness is required and product equality is named as a control, but
        no solver identity, version, configuration, timeout/resume behavior,
        raw treatment/null record schema, factor representation, or independently
        checkable verification format is committed.
      minimal_successor_rule: >-
        Specify the factorization solver identity, version and configuration;
        its timeout, retry, resume, and incomplete-result behavior; and a raw
        schema for both arms that records each input integer, complete status,
        factor representation, and independently checkable product
        verification, with a defined failure disposition.
    - id: GAP-4
      name: numerical_rss_probe_tolerance_margins_and_failure_rule
      disposition: amendment_required
      committed_material:
        - experiments/EXP-SMTH-92d322/specification.yaml:176-198
        - experiments/EXP-SMTH-92d322/specification.yaml:228-237
        - experiments/EXP-SMTH-71b1b0/specification.yaml:314-324
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-c259e0/tasks/TASK-20260804-1bdcf5/snapshot_input_audit.md:30-31
      finding: >-
        The draft gives a 4 GiB ceiling and record-boundary stop semantics, but
        it gives no preflight probe schedule, numerical tolerance, margin,
        RSS measurement method, or probe failure rule. The predecessor says
        that values must be declared before running, and the draft expressly
        retains their absence as an approval requirement.
      minimal_successor_rule: >-
        Specify the RSS measurement source and sampling protocol, exact probe
        record counts or percentages near 5%, 10%, and 20%, a numerical
        tolerance and safety margin for each probe, the forecast or acceptance
        calculation, and the mandatory halt/invalidation disposition for any
        probe failure.
    - id: GAP-5
      name: domain_separation_comparability
      disposition: amendment_required
      committed_material:
        - experiments/EXP-SMTH-92d322/specification.yaml:159-167
        - experiments/EXP-SMTH-92d322/specification.yaml:228-237
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-c259e0/tasks/TASK-20260804-1bdcf5/snapshot_input_audit.md:31-31
      finding: >-
        The successor domain is deliberately different from the predecessor's,
        while the numerical master seed is retained. The stated rationale
        avoids an unverified freeze-binding claim, but no rule identifies
        which streams or outputs, if any, may be compared across domains or
        what equality or distributional relation would be required.
      minimal_successor_rule: >-
        State explicitly either that no predecessor-comparability claim is
        permitted, or define the exact cross-domain comparison scope, streams,
        expected relation, comparator, and failure interpretation. Do not
        infer stream equivalence from the shared numerical seed.
  limitations:
    - The reviewed draft remains review_required, unfrozen, execution_authorized false, and evidence_eligible false.
    - This review is independent-session design review only and remains at the stated toy ceiling.
    - No execution, data creation, metric recomputation, control result, or mathematical inference occurred.
  verdict: REVISE
  verdict_basis: >-
    All five named gaps are explicitly still unspecified or unresolved in the
    committed draft and audit material. A future successor revision may supply
    the listed minimal rules; this review does not approve, freeze, or
    authorize it.
