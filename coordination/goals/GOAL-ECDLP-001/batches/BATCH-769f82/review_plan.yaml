  reviewers:
  - task: TASK-20261017-881c1b
    role: validator
    policy: review-adversarial
    blind_from:
    - coordination/review/snfs-g-20261017/TASK-20261017-543a78
    - any Coordinator reading
  - task: TASK-20261017-543a78
    role: red-team
    policy: review-adversarial
    blind_from:
    - coordination/review/snfs-g-20261017/TASK-20261017-881c1b
    - any Coordinator reading
  order:
  - TASK-20261017-dac0a6 snapshot archive of all four run records
  - TASK-20261017-881c1b and TASK-20261017-543a78 in independent sessions
  - TASK-20261017-94b6a7 evidence-review decision DEC-20261017-7ec9cc
  decision_rules:
  - A contract whose success_criterion is met on every control is read as supporting its hypothesis in
    the exact tested scope and closes nothing (AGENTS.md rules 6 and 7).
  - A contract whose falsification_criterion is met with all controls passing is read as weakening its
    hypothesis; the specification's decision_impact.on_negative applies (independent re-implementation
    before interpretation).
  - Anything else is inconclusive. No breakthrough, speedup, attack or closure language is admissible
    from this battery.
  - 'knowledge_promotion is filled on the decision: a KN-FIND only for a replicated or strong reading,
    otherwise KN-OPEN or not_warranted with the reason.'
  cheapest_falsification_controls:
    EXP-ECDLP-84af7b: abelian_control and random_split arms (present in the run)
    EXP-ECDLP-8cc60d: matched random-prime arm and supersingular control (present in the run)
    EXP-ECDLP-4c6a09: random_g, t^d - c and Q arms (present in the run)
    EXP-ECDLP-ad27ad: keyed-hash and size-based subsets, exact enumeration at c <= 17 (present in the
      run)
  claim_under_review: >-
    The four SNFS-side ECDLP contracts (EXP-ECDLP-84af7b, 8cc60d, 4c6a09,
    ad27ad) each produce, on toy primes and public parameters with no secret
    scalar, a recorded yield / covering-exponent / closure statistic whose
    sign and size against its matched control is what the frozen
    success_criterion and falsification_criterion say. No attack, speedup
    or closure is under review; only whether each hypothesis survives its
    own preregistered test.
  coordinator_prior: >-
    Recorded before the round. The Coordinator expects every contract to
    land inconclusive-or-negative: the cyclotomic / Solinas structure is
    expected to give a measurable but small covering-exponent gap that does
    not reach the success_criterion, and the closure deviations of
    EXP-ECDLP-ad27ad are expected to sit inside their bands. A positive
    reading on any contract would be a surprise and is to be checked for
    a checker-runner shared defect before interpretation.
  joints:
  - joint: runner-checker independence (no shared code; replay of recorded sample points, residues, witnesses and torsion bounds from recorded inputs)
    assigned_to: TASK-20261017-881c1b
    attack_plan: >-
      Re-derive two sampled cells per experiment from the recorded inputs
      with a third implementation (not check.py), then tamper one recorded
      field in a copied run directory and confirm check.py exits nonzero.
  - joint: control arms are matched (random-split, abelian, random_g, random-prime, keyed-hash arms drawn from the same size and seed envelope as the treatment arm)
    assigned_to: TASK-20261017-543a78
    attack_plan: >-
      Recompute the arm size and seed envelopes from manifest.yaml and
      raw-result.json; find any treatment/control asymmetry the
      specification does not preregister and state the statistic it biases.
  - joint: summary statistics follow from per-cell records (rungs, gamma, ratios, SE, regression slope recomputed from cells rather than from the runner's summary)
    assigned_to: TASK-20261017-881c1b
    attack_plan: >-
      Recompute every summary field from the per-cell records with an
      independent script; any field that cannot be reproduced to the
      recorded tolerance is a finding.
  - joint: claim-boundary and interpretation (toy primes only, no scalar recovered, success read as support in the tested scope and not as a speedup)
    assigned_to: TASK-20261017-543a78
    attack_plan: >-
      Write the cheapest end-to-end cost model that would turn a positive
      reading into a deployed-curve claim and show which omitted cost
      dominates; check that no run record or decision draft uses attack,
      speedup or closure language.
  proves_too_much:
    objects:
    - EXP-ECDLP-84af7b abelian_control arm (the covering-exponent gap is known to be zero by construction)
    - EXP-ECDLP-8cc60d supersingular control (the exact condition count is known)
    - EXP-ECDLP-4c6a09 random_g arm (no Solinas structure; gamma difference must be zero within noise)
    - EXP-ECDLP-ad27ad size-based subset (closure ratio known to be 1 by enumeration at c <= 17)
    failure_signature: >-
      If the argument that reads a treatment-arm statistic as structural
      also returns a positive reading on one of these known-null objects,
      the argument proves too much and the decision records inconclusive
      for the contract with that control, whatever the treatment arm says.
  blindness:
    lifted_for: []
    rationale: null
