    activation_gate_interaction:
      PRECOMMIT_VERIFIER_HASH_MISSING:
        status: discharged_by_this_pin
        meaning: >-
          Non-null independent_verifier_artifact_sha256 bound to
          sha256(independent_verifier.py). If the pin were null, activation
          hard-fails with this code (enforced by the verifier artifact).
      PRECOMMIT_SNAPSHOT_UNVERIFIED:
        status: still_blocking
        meaning: >-
          verified_before_execution remains false. The BATCH-004 snapshot
          fields above document the protocol-design reference (9b17754e23a1)
          and are not an authorized execution-time seal. A later Coordinator
          execution seal must re-verify snapshot receipt/commit/parent against
          the exact bytes to be run and set verified_before_execution: true.
      PRECOMMIT_SCHEDULE_UNSEALED:
        status: still_blocking
        meaning: >-
          The empty-or-pilot schedule is hash-bound and sealable, but an
          execution seal that binds schedule_sha256 under authorized
          precommit (with verified_before_execution) has not occurred.
          Sealable ≠ sealed-for-execution.
