        prior authority, and names the WRONG reviewers as having reviewed it. A
        Coordinator ledger-disposing on this record would bind the wrong task,
        the wrong archive receipt and the wrong reviewer set.
      falsification_route: >-
        python3 -c "import yaml; a=yaml.safe_load(open('experiments/EXP-SYC-ff777e/specification.yaml'))['experiment'];
        b=yaml.safe_load(open('experiments/EXP-SYC-dc854f/specification.yaml'))['experiment'];
        print(a['authority']==b['authority'], a['runtime_provenance']==b['runtime_provenance'])"
        -- I ran the field-by-field form of this and every listed field is
        identical between the two files. THIS OBJECTION DIES only if (a) the
        Coordinator rules that specification.yaml's runtime_provenance is
        intentionally the PREDECESSOR's, in which case it must be renamed
