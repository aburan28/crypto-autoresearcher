  objections:

    - id: RT-82A8CB-OBJ1
      severity: BLOCKING
      falsification_scope_item: 1 and 3
      title: >-
        specification.yaml's authority and runtime_provenance blocks are
        unedited byte-copies of EXP-SYC-ff777e's, so the successor misattributes
        its own authorship, authority, archive task, reviewers, branch and
        authoring model to a different task in a different batch served by a
        different model.
      where:
        - experiments/EXP-SYC-dc854f/specification.yaml lines 84-108 (authority)
        - experiments/EXP-SYC-dc854f/specification.yaml lines 145-200 (runtime_provenance)
      exact_defects:
        - 'authority.task_id: TASK-20260815-6f4429 (should be TASK-20260815-9b3cb3; experiment.task_id at line 7 is correct)'
        - 'authority.batch_id: BATCH-8c58a3 (should be BATCH-7d9b78; experiment.batch_id at line 6 is correct)'
        - 'authority.archived_by_task: TASK-20260815-48ab56 (the other four artifacts and this file''s own next_action at line 1849 say TASK-20260815-5e74e3)'
        - 'authority.reviewed_by_tasks: [TASK-20260815-839dc8, TASK-20260815-fbd43e] (those are BATCH-8c58a3''s reviewers; this batch''s are TASK-20260815-7fa865 and TASK-20260815-82a8cb, as this file''s own next_action at lines 1850-1851 states)'
