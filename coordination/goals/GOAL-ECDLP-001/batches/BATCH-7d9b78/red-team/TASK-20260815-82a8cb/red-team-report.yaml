        - 'runtime_provenance.receipt_path points at BATCH-8c58a3/tasks/TASK-20260815-6f4429/runtime-session-receipt.json, not this package''s own declared receipt (verification-and-null-kats.yaml:88 owned_json_path)'
        - 'runtime_provenance.task_id: TASK-20260815-6f4429'
        - 'runtime_provenance.self_reported_resolved_model_id: claude-sonnet-5, with source text "Direct self-report from THIS authoring session''s own runtime system context, which states verbatim: You are powered by the model named Sonnet 5" -- a present-tense first-person self-report that is FALSE for the session that wrote this file'
        - 'runtime_provenance has no backend and no runtime key, while the other four artifacts record backend: vllm and runtime: opencode'
      contradicted_by:
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-7d9b78/tasks/TASK-20260815-9b3cb3/runtime-session-receipt.json line 19 (self_reported_resolved_model_id vllm/qwen3.8-27b)
        - same receipt line 46 (receipt_scope is "the entire authoring span of the single session that wrote all six declared artifacts") and lines 49-56, which list specification.yaml among them
        - same receipt lines 47-48 (number_of_sessions_involved_in_authoring 1)
      why_this_is_blocking: >-
        This is precisely the defect class CORR-20260815-092c9f corrected, and
        the very block that carries it cites that correction at
        specification.yaml lines 137-142 as "the precedent this task's own
        provenance statement below must not repeat." The experiment record --
