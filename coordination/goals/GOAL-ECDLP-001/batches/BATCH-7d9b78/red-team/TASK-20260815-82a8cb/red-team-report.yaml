        - 'experiments/EXP-SYC-dc854f/specification.yaml lines 76-79 and design-repair-report.yaml lines 47-52 (verbatim in both): "no bound on the probability of mid-run invalidation exists, so no per-attempt-cost times inverse-success-probability bookkeeping and therefore no cost, frontier, dominance, or advantage claim is admissible from this design EVEN AFTER A FUTURE IMPLEMENTATION"'
        - 'experiments/EXP-SYC-dc854f/specification.yaml lines 932-938 goes further: "...even after a future implementation AND EVEN IF THAT IMPLEMENTATION RUNS TO COMPLETION" -- and this clause is one of the twelve V4 restorations (specification.yaml line 670)'
        - 'physical-frontier-compiler.yaml lines 393-397 restates it as an additional_gate_blocker'
      the_contradiction_with_its_own_menu: >-
        ROUTE-A (specification.yaml lines 1292-1305) names exactly what would
        supply the missing factor: "an archived validation experiment sampling
        the occupancy distribution at ladder scale and checking tail
        consistency". A MEASURED per-tuple invalidation rate over the frozen
        ladder is an empirical success probability. It does not require a new
        tail THEOREM; it requires a run. So the foreclosure is stated at a
        breadth its own successor route contradicts.
      why_this_matters_now: >-
        This sentence is the stated reason every dependent claim is capped below
        `supported`, and specification.yaml lines 1854-1858 makes a REVISE
        verdict with new findings move GOAL-ECDLP-001 to `paused` at the
        campaign ceiling. An over-broad foreclosure at that exact decision point
        is a premature-closure risk symmetric with overclaiming. Per
        docs/inventor-protocol.md section 4, a closure needs a named obstruction,
        an argument, and forward guidance naming what remains open -- the
        obstruction and argument are here and are sound for the heuristics; the
        "even after implementation" extension is not argued anywhere.
      narrowest_correct_statement: >-
        "No per-attempt-cost times inverse-success-probability bookkeeping is
        admissible FROM THE COMMITTED HEURISTICS ALONE. An archived ROUTE-A
        validation measuring the realized invalidation rate would supply the
        missing factor empirically, scoped to the tested ladder."
      falsification_route: >-
        At bits 18 only, in stages S0/S1, estimate the realized per-tuple
        occupancy distribution and the empirical overflow rate with a confidence
        interval. If that rate is measurable to a useful CI, the sentence "no
        cost claim is admissible even after a future implementation" is
        falsified AS STATED. DIES when the sentence is qualified to "from the
        committed heuristics alone".

    - id: RT-82A8CB-OBJ16
      severity: MINOR_NON_BLOCKING
      falsification_scope_item: 4 and 5
      title: >-
        The Pollard-rho baseline's memory axis is asserted rather than cited,
        and it is load-bearing for a nine-axis dominance gate.
      where:
        - 'physical-frontier-compiler.yaml lines 400-404: "The program baseline remains 0.886*sqrt(N) group operations with van Oorschot-Wiener parallelization and NEGLIGIBLE LIVE STORAGE."'
        - 'physical-frontier-compiler.yaml lines 386-390 requires a future candidate to "dominate every row on the per-size nondominated rho/BSGS frontier on ALL NINE AXES", one of which is peak_live_bytes (lines 103-104)'
      the_problem: >-
        van Oorschot-Wiener parallel rho stores a distinguished-point table whose
        size is a tuned parameter, and the whole point of the vOW analysis is the
        time-memory interpolation (time proportional to sqrt(N)/m with m
        processors against a shared DP store). "Negligible live storage" is not
        a property of the method; it is a choice of operating point. The
        direction of the error is CONSERVATIVE for the candidate -- it makes the
        baseline look stronger -- so it is not self-serving. But taken literally
        it makes the peak_live_bytes axis of the nine-axis gate unsatisfiable,
        and that consequence is not disclosed anywhere.
      what_is_correct_here: >-
        physical-frontier-compiler.yaml lines 405-412 correctly refuse the BSGS
        comparison pending an implementation and correctly keep RT-OBJ4's k-list
        / generalized-birthday specialized baseline explicitly OPEN. I do not
        object to either.
      falsification_route: >-
        Replace "negligible live storage" with a cited DP-table size at each
        ladder size and the vOW time-memory relation, OR record explicitly that
        the peak axis of the gate is presently unsatisfiable against a
        negligible-storage baseline and file it as a gate residual alongside
        C-R3 (specification.yaml lines 1584-1591, which already notes
        peak_live_bytes has no declared hard cap).

    - id: RT-82A8CB-OBJ17
      severity: MINOR_NON_BLOCKING
      falsification_scope_item: 3
      title: >-
        A field is named "margin" for a quantity the package's own mandatory
        negative KAT forbids reading as a margin.
      where:
        - 'verification-and-null-kats.yaml lines 387-398 and 403-410, physical-frontier-compiler.yaml lines 162-168: cap_over_expected_X_margin with values 64.000000000000 through 101.593667325965 and 32.000000000000 at the ceiling'
        - 'verification-and-null-kats.yaml lines 503-508 (NKAT-HA2-EQUAL-MEAN.forbidden_uses_of_mean_margins) lists "as evidence of capacity adequacy"'
      why_it_is_still_worth_recording: >-
        The prose around the field is correctly hedged
        (physical-frontier-compiler.yaml lines 171-174). The defect is that the
        field NAME is the affordance the negative KAT exists to block, and field
        names travel further than the prose beside them.
      falsification_route: >-
        Rename to capacity_over_mean_ratio and confirm no downstream text reads
        it as headroom. DIES on the rename.

    - id: RT-82A8CB-OBJ18
      severity: MINOR_NON_BLOCKING
      falsification_scope_item: 1
      title: >-
        The V4 completeness claim enumerates four categories of remaining
        difference and there are five.
      where:
        - 'experiments/EXP-SYC-dc854f/specification.yaml lines 543-547: "after the twelve restorations the only remaining differences in this block are the item-A serialization-convention relabel, the item-B bit-width correction, the disclosed repair_summary rewrite, and the two relocated literal blocks"'
      what_my_diff_found: >-
        A fifth difference exists: EXP-SYC-dc854f ADDS the key
        contract_2_tuplewise_tail.serialization_convention_repair_note, which is
        absent from EXP-SYC-793304 and is not named in the four categories. It
        is charitably read as part of the item-A relabel, but the sentence says
        "the ONLY remaining differences ... are", and it is exactly the class of
        completeness assertion that FALSE-PREAMBLE-COMPLETENESS-CLAIM exists to
        police.
      falsification_route: >-
        Re-run the parsed diff (script under required_controls, CTRL-4). DIES
        when the added key is named in the enumeration.

  # =========================================================================
  required_controls:

    - id: CTRL-1-null-object-control-for-the-peak-census
      what_it_tests: >-
        The falsification_scope's "what should the reported quantity have done"
        question, applied to the peak axis. The package has a null control for
        the SAMPLING method (KAT-PEAK-6) but none for the AGGREGATE RULE itself:
        the seven fixtures are hand-built topologies whose expected values were
        computed by the same reasoning that wrote the rule.
      the_control: >-
        Specify a random-allocation-trace fixture: N shards, event times and
        byte sizes drawn from a declared generator with the event count and
        total bytes held fixed, evaluated under the frozen formula AND under
        each of FORBIDDEN-R1 through R7. Name the parameter that must destroy
        the signal: as the number of shards with pairwise time-disjoint
        allocations increases, the FORBIDDEN-R2 (sum-of-per-shard-maxima) value
        must grow LINEARLY in the shard count while the frozen value stays FLAT.
        A census whose output tracks R2 on random traces is not implementing the
        frozen formula, and no finite set of hand-built fixtures shows this.
      cost: zero experiment runs; this is a fixture specification, not an execution.
      why_it_is_required: >-
        verification-and-null-kats.yaml line 352 asserts
        rejects_partial_overlap_special_casing: true, which its own scope note at
        lines 353-361 admits "asserts more than any finite KAT suite can prove".
        The random-trace control is the measurement that would earn that field.

    - id: CTRL-2-evaluate-KAT-PEAK-F-against-the-records-own-frozen-rule
      what_it_tests: RT-82A8CB-OBJ5.
      the_control: >-
        Evaluate KAT-PEAK-F (setup allocates 4096 private bytes; shared context
        and all eight shards idle) under specification.yaml line 969's
        frozen_rule. Expected 4096; obtained 0.
      cost: one line, no execution.

    - id: CTRL-3-evaluate-the-familywise-bound-under-both-family-sizes
      what_it_tests: RT-82A8CB-OBJ7.
      the_control: >-
        At gamma_x = 0/1, bits 30: 32768*2^-10/33 = 32/33 = 0.9696969697 versus
        98304*2^-10/33 = 32/11 = 2.909090909. The RT-OBJ-C exception exists
        under the first and does not exist under the second.
      cost: one line, no execution.

    - id: CTRL-4-the-parsed-diff-that-four-sites-claim-was-performed
      what_it_tests: RT-82A8CB-OBJ3, RT-82A8CB-OBJ4, RT-82A8CB-OBJ18, and confirms V4 (CONF-3).
      the_control: >-
        Load experiments/EXP-SYC-{793304,ff777e,dc854f}/specification.yaml with
        yaml.safe_load, extract
        experiment.blocker_repairs['HA2-EXPECTATION-NOT-TAIL'], flatten each to
        leaf paths, and report (a) keys present in 793304 and absent in the
        other, and (b) whitespace-normalised value differences on shared keys.
        Result: ff777e has 1 absent key plus 14 value diffs; dc854f has 0 absent
        keys of that kind plus 3 value diffs, all three disclosed. 15 - 3 = 12.
      cost: one script, zero experiment runs. I ran it; it is reproducible.

    - id: CTRL-5-whole-file-overlay-completeness-diff
      what_it_tests: >-
        The package's single strongest claim -- that this successor is a
        faithful merge that changes nothing it does not disclose
        (physical-frontier-compiler.yaml lines 81-90,
        overlays_in_this_successor, with everything_else_changed: none).
      the_control: >-
        Extend CTRL-4 to the WHOLE of specification.yaml against BOTH declared
        predecessors (EXP-SYC-ff777e and EXP-SYC-75f7d2) and against
        EXP-SYC-793304, and require that (a) every difference maps to an entry
        in overlays_in_this_successor, and (b) every field that SHOULD have
        differed because it names this task, batch, session, branch, archive
        task or reviewers actually does.
      cost: one script, zero experiment runs.
      why_this_is_the_one_to_run_first: >-
        The HA2-block instance of it produced RT-82A8CB-OBJ4 as a by-product;
        the authority/runtime_provenance instance produced RT-82A8CB-OBJ1
        immediately. Run over the whole file it would have caught OBJ1, OBJ3,
        OBJ4, OBJ12 and OBJ18 before dispatch. It is the cheapest control that
        falsifies what the package claims about itself.

  counterexample_or_mutation:
    id: MUT-1-serialization-label-mutation
    statement: >-
      Mutate contract_2_tuplewise_tail.serialization_convention back to
      "truncation of the long division" and re-run the batch's own item-A check.
      The five stored twelve-decimal values must then FAIL at bits 18, 27 and 30
      (0.015151515152 vs 0.015151515151; 0.010713739109 vs 0.010713739108;
      0.009544856439 vs 0.009544856438). Any verification procedure that reports
      PASS under BOTH labels is not checking the values against the label, and
      the item-A repair is then unverified rather than repaired.
    id_2: MUT-2-B_0-deletion-mutation
    statement_2: >-
      Delete the B_0 term from specification.yaml line 1440 and re-run the
      package's own KAT suite as MANDATED (KAT-PEAK-1 through KAT-PEAK-4). All
      four still pass, because B_0 = 0 in all of them
      (verification-and-null-kats.yaml line 116). This is the mutation that
      demonstrates RT-82A8CB-OBJ5 is a real gap and not a wording quibble: the
      repaired term is invisible to every fixture an implementation is required
      to pass.

  baseline_comparison:
    pollard_rho:
      recorded_at: physical-frontier-compiler.yaml lines 400-404
      figure: 0.886*sqrt(N) group operations, van Oorschot-Wiener parallelizable
      comparison_made: false
      comparison_correctly_declined: true
      reason_recorded_by_the_package: >-
        zero-run static record, no target-dependent decoder, no measured
        end-to-end cost, so no comparison as an attack is possible or attempted
      red_team_assessment: >-
        The refusal is correct and I do not object to it. My only objection is
        RT-82A8CB-OBJ16, on the uncited "negligible live storage" memory-axis
        characterisation, which is conservative in direction but load-bearing
        for the nine-axis gate.
    bsgs:
      recorded_at: physical-frontier-compiler.yaml lines 405-409
      comparison_made: false
      red_team_assessment: >-
        Correctly declined pending an implementation and a global time-aligned
        aggregate peak. It is now ADDITIONALLY incomplete because that aggregate
        rule is stated four different ways in the package (RT-82A8CB-OBJ5), so
        even a future implementation would not know which rule to implement.
    closest_specialized_baseline:
      identified_as: k-list / generalized birthday (RT-OBJ4)
      status: OPEN, deferred, explicitly NOT closed in all four artifacts that mention it
      red_team_assessment: >-
        Correctly kept open. RT-OBJ3 (crossover-N estimate) is likewise carried
        open by ID and by its own visible line in four artifacts. Neither is
        folded into another item. This is honest deferral, not premature closure.
    dominated_by_field: 'n/a (no result claimed)'
    dominated_by_verdict: >-
      CHECKED PAST, NOT READ. Correct and not a fabricated null: zero runs, no
      measured frontier, no claimed axis position, so there is no Pareto point.
      The package additionally forecloses a FUTURE dominance claim while the
      familywise tail is unavailable (physical-frontier-compiler.yaml lines
      393-397) -- see RT-82A8CB-OBJ15 for where that foreclosure over-reaches.
    sota_delta: 'no measured attack or cost delta; static contract repair only -- accepted as accurate'

  heuristic_challenges:
    - id: HC-1-heuristics-are-numbered-and-their-limits-are-stated
      finding: >-
        HA-2 and HA-3 are explicitly numbered in ledger/hypotheses/H-SYC-b854f4.yaml
        (lines 111-122) and quoted verbatim in the successor
        (specification.yaml lines 690-698). The record is unusually good here:
        it states what HA-2 supplies (a first moment) and what it does not
        (any higher moment, any tail, any concentration, any joint law, any
        finite-N control on o(1)) at specification.yaml lines 1048-1055. No
        implicit or unnumbered assumption is doing load-bearing work that I
        could find. NO OBJECTION.
    - id: HC-2-the-o1-term-is-load-bearing-and-the-record-says-so
      finding: >-
        The frozen o(1) := 0 convention is the entire basis of every E[X] row,
        and the record states plainly that this makes every row "a symbolic
        reference value, not a bound" (B-R2, specification.yaml lines 1384-1389),
        and that extending the convention to HA-3's kappa forces kappa = 1 and
        P(overflow) = 0 by fiat, which it refuses as "the conclusion assumed"
        (lemma L4, lines 860-884; NKAT-HA2-CONVENTION-DEGENERACY,
        verification-and-null-kats.yaml lines 510-520). This is exactly the
        random-model-transfer discipline the exemplar profile asks for. NO
        OBJECTION.
    - id: HC-3-random-model-transfer-is-NOT-the-live-risk-here-and-the-record-knows-it
      finding: >-
        The usual exemplar-profile attack -- "a structured object is not a
        uniformly random integer" -- does not bite, because the record does not
        assume a distribution at all. It derives the SUPREMUM over every law
        consistent with HA-2 and finds it is the whole interval [0,1] at the
        tabulated slices, both endpoints attained (specification.yaml lines
        1190-1201). That is the strongest form of the honest answer: HA-2
        excludes no possible answer. NO OBJECTION to the derivation; see
        RT-82A8CB-SPAWN-1 for what I think that measurement is actually telling
        the program.
    - id: HC-4-scale-honesty
      finding: >-
        The tested scale is the frozen 18/21/24/27/30-bit ladder and NOTHING is
        tested, because zero runs occurred. The record says so at every
        opportunity, and specification.yaml lines 1265-1277 explicitly labels
        the bits >= 179.2009 / 207.7302 non-vacuity thresholds "ARITHMETIC ONLY
        ... not a claim about cryptographic scale, not a transfer, not an
        extrapolation of any measured quantity". transfer_authorized: false
        (line 231). NO OBJECTION.
    - id: HC-5-the-one-heuristic-level-gap
      finding: >-
        The family-size premise underlying RT-OBJ-C -- that the three eta tuples
        of one (curve, root, model) are the SAME random variable, giving
        m = 32768 rather than 98304 -- is a modelling assumption, not a
        theorem. I verified its stated basis: the eta_rule at
        physical-frontier-compiler.yaml lines 128-132 does say eta is "a
        preregistered finite-size analysis stratum, not a new root draw" and
        that occupancy "equals that root/model X". So the premise is grounded
        and I do not challenge it. What I challenge is that the package never
        adopts it consistently -- see RT-82A8CB-OBJ7.

  cost_model_challenges:
    - id: CMC-1-per-attempt-versus-total-expected-cost
      finding: >-
        The record does NOT confuse per-attempt with total expected cost. It
        states the correct identity and then correctly reports that it CANNOT
        instantiate it, because the invalidation probability is unbounded
        (specification.yaml lines 76-79, 932-938). Setting the success
        probability silently to 1 is exactly what it refuses to do. NO
        OBJECTION to the bookkeeping. The objection is that the refusal is
        stated at too great a breadth (RT-82A8CB-OBJ15).
    - id: CMC-2-hidden-overhead-and-memory
      finding: >-
        Memory is the one axis where a hidden cost survives, and it survives
        because of RT-82A8CB-OBJ5: budget.maximum_memory_gb = 2 binds a
        host-level aggregate over what is now TEN concurrently live streams, the
        package still contracts for NINE, and PEAK-AGGREGATE-FIT-UNPROVED
        (specification.yaml lines 998-1010) records that no byte figure exists
        at all. So the memory axis carries an undisclosed additive term
        (max_t B_0) on top of an already-unproved fit. The record discloses the
        unproved fit honestly; it does not disclose that its own repair widened
        the quantity being fitted.
    - id: CMC-3-the-three-capacity-residuals-are-not-costed-away
      finding: >-
        All three remain positive under unchanged caps, no cap is raised
        anywhere, and truncation, hash substitution, dropping a mount, dropping
        a stream and inventing a communication partition are all explicitly
        refused as capacity fits (specification.yaml lines 1659-1664). The
        failure is reported AS a failure. This is correct and I do not object.
        My objection is to the precision label on the archive figure
        (RT-82A8CB-OBJ14), not to the refusal.
    - id: CMC-4-the-route-B-byte-impact-is-honestly-uncomputed
      finding: >-
        B-R3 (specification.yaml lines 1390-1401) records that widening
        candidate_index from U8 to at least U13 (byte-aligned U16) has an
        UNKNOWN byte impact on archive, communication and output, and does not
        estimate it. That is the honest disposition. VAL-A723AF-R1's 14-to-13
        correction is arithmetically right (2^13 = 8192 >= 8185 > 4096 = 2^12),
        verified, and it is applied consistently in all four locations I found
        (specification.yaml lines 1338 and 958, custody line 162-168,
        physical-frontier-compiler line 199-204). NO OBJECTION.

  reduction_and_scope_challenges:
    - id: RSC-1-no-cited-reduction-is-instantiated
      finding: >-
        The package invokes no published reduction and derives no corollary from
        one, so the exemplar profile's reduction-instantiation attack has no
        target here. NO OBJECTION.
    - id: RSC-2-affected-versus-safe-scheme-scope
      finding: >-
        No scheme is named as affected or safe anywhere. Scope is confined to
        the frozen ladder and static contract arithmetic
        (specification.yaml lines 232-237). There is NO scope inflation to
        audit. NO OBJECTION.
    - id: RSC-3-the-supersession-scope-is-the-one-scope-claim-worth-checking
      finding: >-
        The successor claims to supersede BOTH EXP-SYC-ff777e and EXP-SYC-75f7d2
        (specification.yaml lines 10-11). I checked that the merged parallel-lane
        section carries 75f7d2's repair_item_B and repair_item_C, and that
        75f7d2's repair_item_A and repair_item_D are declared as superseded by
        this spec's own PRODUCER-POLICY-RESOLUTION-BINDING and
        capacity_residuals blocks (lines 1024-1027). That mapping is complete on
        its face. HOWEVER the supersession of repair_item_A is exactly the item
        RT-82A8CB-OBJ11 shows is asserted on a false tool-surface premise, so
        the supersession inherits that defect.

  proof_architecture_challenges:
    - id: PA-1-observation-fiber-attack
      applied_to: the deterministic bound 8*(L-1) as a certificate of occupancy
      result: >-
        Hold the bound fixed and vary the underlying occupancy law. C-HA2-2
        supplies a law with P(X = 33) > 0 and C-HA2-3's construction supplies a
        law with P(overflow) = 1 at the tabulated slices, while the symmetric
        certificate supplies a law with P(overflow) = 0. All three respect the
        same bound and the same mean. So the fiber over "8*(L-1) = 8184" contains
        preimages on BOTH sides of the conclusion. The record already performs
        this attack on itself and records the answer (lines 1190-1201). The
        missing separator is a finite-N tail assumption, which the record names
        and declines to adopt. NO NEW OBJECTION -- this is the record's own
        strongest work.
    - id: PA-2-quantifier-order-attack
      applied_to: the RT-OBJ-C narrowing
      result: >-
        Written with explicit quantifiers, C-HA2-3 claims: for all ladder sizes
        and for the tabulated gamma slices, sup over admissible joint laws of
        P(some tuple overflows) = 1. RT-OBJ-C correctly identifies that the
        witness (the covering construction) is chosen AFTER seeing (gamma, bits)
        and does not exist for one pair. That is a genuine quantifier-order
        catch and the repair is right to make it. But the repair then commits a
        mirror-image error at that same pair: it asserts a supremum WITHOUT
        choosing a witness at all (RT-82A8CB-OBJ10). The witness exists and I
        supplied it.
    - id: PA-3-boundary-and-strictness-attack
      applied_to: the RT-OBJ-F system-peak rule
      result: >-
        The old rule must be embedded as the boundary case of the new one, and
        it is: at B_0 = 0 the corrected formula reduces exactly to the
        predecessor's, which is why KAT-PEAK-1 through 7 are byte-identical and
        still pass. The perturbation is strictly better only where B_0 > 0, and
        the only fixture exercising that is optional (RT-82A8CB-OBJ5). So the
        new rule is strictly better in principle and NOT strictly enforced in
        contract.
    - id: PA-4-method-ceiling-attack
      applied_to: the zero-run static producer itself
      result: >-
        The record's own method_ceiling (specification.yaml lines 1820-1826) is
        correct and I could not push past it: a zero-run static producer cannot
        establish a finite-N tail, a measured peak, a capacity fit, a crossover
        N, an attack, a speedup, a status transition, or a communication
        itemization that does not exist in the inherited design. Every one of my
        BLOCKING findings sits STRICTLY INSIDE that ceiling -- they are all
        record-integrity defects a zero-run producer could and should have
        avoided. That is the sharpest thing I can say about this package: it did
        not overreach its method ceiling; it failed to describe itself.
    - id: PA-5-nearby-object-attack
      applied_to: the family-size correction
      result: >-
        The nearest object for which the desired conclusion is false is the same
        design with eta treated as an independent draw. Then m = 98304 is
        correct, the RT-OBJ-C exception vanishes, and the blanket sentences the
        batch narrowed were right all along. The record does not distinguish the
        two objects consistently -- it asserts both. RT-82A8CB-OBJ7.
    - id: PA-6-compositional-invariant-attack
      applied_to: the merge of two lanes into one successor
      result: >-
        Delete the merged_parallel_lane section and the primary base still
        stands as a coherent (if un-narrowed) record. Delete the primary base's
        blocker_repairs and the merged lane's C-HA2 clauses lose the lemmas L2
        through L5 they cite. So the composition is one-directional, and the
        first step that fails is the reconciliation of the two family sizes and
        the two worst-case phrasings, which live on opposite sides of the seam
        (RT-82A8CB-OBJ7 and RT-82A8CB-OBJ9). The merge joined the content and
        did not join the conclusions.

  closure_challenges:
    - id: CC-1-the-HA-2-tail-unavailability-closure-is-genuine
      finding: >-
        This closure names an obstruction, argues it, and names what remains
        open. Lemmas L1 through L5 are a real argument: Markov is sharp from the
        mean alone (L1, with the extremal law exhibited), the union bound is
        vacuous by two to three orders of magnitude (L2), the second-moment
        route is vacuous for every admissible kappa >= 1 (L3), the zero-o(1)
        convention would assume the conclusion (L4), and the moment order needed
        is at least four (L5, worked). ROUTE-A, ROUTE-A2 and ROUTE-B name what
        remains open with revisit conditions. This is NOT a fatigue report. It
        passes the docs/inventor-protocol.md section 4 standard. I do not object
        to it and I recomputed its arithmetic (CONF-7, CONF-9).
    - id: CC-2-the-communication-itemization-closure-is-genuine-and-correctly-scoped
      finding: >-
        NOT_ACHIEVABLE_WITHOUT_FABRICATION for communication alone is supported
        by the cited source's own communication_extension_note, which I read at
        BATCH-68ea16/.../physical-frontier-compiler.yaml lines 487-497 and which
        says exactly what the successor says it says. The record also names both
        conditions that would close it (specification.yaml lines 505-512). NO
        OBJECTION.
    - id: CC-3-the-one-closure-that-over-reaches
      finding: RT-82A8CB-OBJ15. See there.
    - id: CC-4-no-lane-is-declared-saturated
      finding: >-
        premature_closure_check (specification.yaml lines 1834-1837) is
        substantive rather than pro forma: the HA-2 axis, the capacity axis and
