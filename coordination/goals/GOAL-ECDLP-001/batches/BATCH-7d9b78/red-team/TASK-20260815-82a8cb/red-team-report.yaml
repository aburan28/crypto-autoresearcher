  independently_verified_and_confirmed:

    - id: CONF-1-snapshot-integrity
      statement: >-
        All six declared paths in the working tree are byte-identical to
        snapshot 36bcb3f7, and 36bcb3f7 is an ancestor of HEAD. No declared path
        is missing and no extra file exists under either write-scope directory.

    - id: CONF-2-strict-parse
      statement: >-
        All five YAML artifacts strict-parse as SINGLE documents with NO
        duplicate keys (verified with a yaml.SafeLoader subclass whose mapping
        constructor raises on a repeated key), and runtime-session-receipt.json
        parses as JSON. This satisfies verification-and-null-kats.yaml's own
        strict_parse_contract (lines 74-80) and its stopping rule
        "stop on strict-parse or duplicate-key failure in any declared
        artifact" (specification.yaml:1800). The producer explicitly declined to
