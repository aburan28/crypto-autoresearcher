    - id: CONF-3-V4-substance-holds
      statement: >-
        THE V4 REPAIR IS SUBSTANTIVELY CORRECT AND I CONFIRM IT BY THE EXACT
        METHOD THE PACKAGE CLAIMS. I ran a full recursive parsed-YAML structural
        and value diff of blocker_repairs.HA2-EXPECTATION-NOT-TAIL against the
        frozen baseline experiments/EXP-SYC-793304/specification.yaml.
        EXP-SYC-ff777e differs from the baseline by 1 absent key
        (contract_1_worst_case.falsification_condition) plus 14 value diffs on
        shared keys. EXP-SYC-dc854f differs by 0 absent keys of that kind plus
        exactly 3 value diffs, and all 3 are the disclosed exceptions: the
        repair_summary rewrite, the item-A serialization relabel
        (contract_2_tuplewise_tail.serialization_convention), and the item-B
        bit-width correction
        (contract_3_simultaneous_tail.cost_of_the_missing_simultaneous_tail[5]).
        15 minus 3 equals 12. EXACTLY TWELVE ITEMS WERE RESTORED, matching
        specification.yaml lines 663-675 item for item. The 37 remaining
        key-level absences are entirely the two relocated literal blocks
        (frozen_literals_propagated_verbatim and
        expected_X_literals_carried_from_immutable_predecessor), which
        specification.yaml:545-547 discloses as carried in
        verification-and-null-kats.yaml, and which I confirm are present there
        (lines 387-419).
      consequence_for_objections: >-
        RT-82A8CB-OBJ3 and RT-82A8CB-OBJ4 are therefore objections to the
        package's ACCOUNT of V4, not to V4. Neither asks for V4 to be withdrawn.

    - id: CONF-4-residual-arithmetic-exact
      statement: >-
        Every residual identity recomputes exactly. 5563755264 - 2307745600 =
        3256009664. 5614086912 - 2328717120 = 3285369792. 15520768 - 8388608 =
        7132160. 177118029 + 357047457 + 716906313 + 1436624022 + 2876059443 =
        5563755264. 1871362304 * 3 = 5614086912. The five archive rows are
        exactly 3x the cited predecessor rows (59039343, 119015819, 238968771,
        478874674, 958686481). The output manifest sums exactly:
        1966080*4 + 524288 + 2097152 + 1048576 + 8192 + 46080 + 1048576 +
        2097152 + 786432 = 15520768, twelve rows.

    - id: CONF-5-no-transcription-drift
      statement: >-
        FALSIFICATION SCOPE ITEM 2 ANSWERED NEGATIVE. I extracted every integer
        of five or more digits from all six declared artifacts (66 distinct
        values) and tested each against the canonical set for two drift classes:
        (a) same digit multiset, different value (transposition), and (b)
        single-digit substitution at equal length. ZERO ALERTS. 3256009664,
        3285369792 and 7132160 appear consistently and identically at every
        occurrence across specification.yaml, design-repair-report.yaml,
        verification-and-null-kats.yaml, custody-and-executable-contract.yaml
        and physical-frontier-compiler.yaml. There is NO transcription drift in
        the carried-forward residuals. The residuals' remaining weakness is
        epistemic, not transcriptional; see RT-82A8CB-OBJ14.

    - id: CONF-6-load-bearing-citation-genuine
      statement: >-
        The single most load-bearing citation in the package CHECKS OUT. I read
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-68ea16/tasks/TASK-20260811-cb5d76/physical-frontier-compiler.yaml
        lines 435-500 directly. It contains, verbatim,
        corrected_archive_hashing_n_c_by_size [177118029, 357047457, 716906313,
        1436624022, 2876059443] (line 482), corrected_archive_hashing_sum
        5563755264 (483), archive_hard_cap_bytes 2307745600 (485),
        archive_over_cap_bytes 3256009664 (486), the x3 mount-state derivation
        (454-469), the derivation_uncertainty_disclosed block naming the
        alternative additive-delta total 7713503488 (470-481), the
        communication_extension_note (487-497) and
        corrected_communication_scheduled_bytes 5614086912 (498). The successor
        transcribes all of it faithfully AND reproduces the disclosed
        uncertainty rather than omitting it. The D2 archive itemization is
        genuine, not fabricated, and the NOT_ACHIEVABLE_WITHOUT_FABRICATION
        re-scoping to communication alone is correct against that source.

    - id: CONF-7-RT-OBJ-C-arithmetic-recomputed
      statement: >-
        Every RT-OBJ-C number recomputes and matches. At gamma_x = 0/1 with
        m = 32768 the first-moment familywise bound is 512/33, 256/33, 128/33,
        64/33, 32/33 at bits 18/21/24/27/30, non-vacuous only at bits 30
        (32/33 = 0.9696969697). p = mu/33 = (2^-10)/33 = 1/33792 =
        2.959280303e-05 is strictly below 1/32768 = 3.0517578125e-05.
        15 - log2(33) = 9.955605881. The crossing values 1/3 - (15 - log2 33)/bits
        are -0.219755882, -0.140743137, -0.081483578, -0.035392810, +0.001479804,
        matching the record's -0.21975588 / -0.14074314 / -0.08148358 /
        -0.03539281 / 0.00147980 at the stated precision, and only bits 30 is
        positive. The m = 98304 crossing at bits 30 is -0.051352279, matching
        -0.05135228. The thresholds 18*(15 - log2 33) = 179.2009 and
        18*(15 - log2 11) = 207.7302 match, as do 33/32768 = 0.001007080078125,
        11/32768 = 0.000335693359375 and 363/32768 = 0.011077880859375.

    - id: CONF-8-item-A-relabel-correct
      statement: >-
        The item-A claim that 3 of 5 rows match half-up rounding rather than
        truncation is CORRECT. mu/33 at twelve decimal places: half-up gives
        0.015151515152 / 0.013498465426 / 0.012025765545 / 0.010713739109 /
        0.009544856439; truncation gives 0.015151515151 / 0.013498465426 /
        0.012025765545 / 0.010713739108 / 0.009544856438. Exactly bits 18, 27
        and 30 differ, as stated. The stored values are unchanged.

    - id: CONF-9-familywise-and-DERIV1-serializations-correct
      statement: >-
        98304*mu/33 at six decimal places gives 1489.454545 / 1326.953145 /
        1182.180856 / 1053.203409 / 938.297567 and 2978.909091 at the ceiling,
        all matching. DERIV-1: 4088/134217728 = 0.000030457973480224609375, and
        its sixteen-place serialization is 0.0000304579734802 as the preserved
        closure requires; all five margin_vs_32 values (16644.063492,
        66052.031496, 263172.015686, 1050628.007828, 4198404.00391) reproduce.

    - id: CONF-10-no-implicit-ECDLP-assertion
      statement: >-
        FALSIFICATION SCOPE ITEM 4 ANSWERED NEGATIVE. I found NO implicit or
        smuggled ECDLP result assertion. evidence_claimed: false,
        experiment_runs: 0, maximum_runs: 0, curve_generation_performed: false
        and advantage_claimed: false are consistent across all six artifacts.
        claim_boundary appears at specification.yaml:1839-1846 and
        design-repair-report.yaml:625-633. specification.yaml:1256 states
        "establishes_nothing_about: capacity adequacy in fact, H-SYC-b854f4, or
        ECDLP". physical-frontier-compiler.yaml:399-414 declines the rho and
        BSGS comparisons outright and keeps RT-OBJ4's specialized baseline
        explicitly open. The ONE over-reach I found in the direction of a
        "result" is a NEGATIVE, foreclosing one (RT-82A8CB-OBJ15), which is a
        premature-closure risk, not an ECDLP claim.

    - id: CONF-11-pareto-field-checked-past
      statement: >-
        I checked past the dominated_by field rather than reading it. The value
        `n/a (no result claimed)` (physical-frontier-compiler.yaml:413,
        specification.yaml:1832, design-repair-report.yaml:687) is CORRECT and
        is NOT an unchecked null: there are zero runs, no measured frontier, no
        cost figure and no claimed axis position, so there is no Pareto point to
        compare. The package additionally goes beyond the requirement:
        physical-frontier-compiler.yaml:393-397 forecloses even a FUTURE
        dominance claim while the familywise tail is unavailable, and :410-412
        records the closest specialized baseline (k-list / generalized birthday,
        RT-OBJ4) as explicitly open and NOT closed. My only Pareto objection is
        RT-82A8CB-OBJ16, on the baseline's memory axis.

  # =========================================================================
  # OBJECTIONS. Every one is tied to a file and a line or field, and every one
