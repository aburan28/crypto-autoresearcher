    - id: FALSE-PREAMBLE-COMPLETENESS-CLAIM
      source_checkpoint: BATCH-8c58a3
      checkpoint_statement_verbatim: >-
        specification.yaml's own preamble comment immediately above
        blocker_repairs (~lines 519-528) asserts that, once V2's five fields
        are restored, the "carried forward unchanged ... nothing else in it is
        touched" language "(except for items A and B) is literally accurate
        again" -- a checkably FALSE completeness claim against the same
        EXP-SYC-793304 baseline.
      required_fix: >-
        Strike or correct the "is literally accurate again" preamble comment
        so it states precisely what is restored (items A, B, V2's five named
        fields, and the twelve V4 items) without asserting blanket
        completeness against EXP-SYC-793304 -- OR, if all twelve items are
        restored verbatim, state exactly that with the byte-verification
        method named.
    - id: CONVERGENT-C-HA2-1
      source_checkpoint: BATCH-a723af
      checkpoint_statement_verbatim: >-
        Clause C-HA2-1 infers worst-case inadequacy of capacity 32 from the
        UPPER bound X <= 8*(L-1) with no attainment witness, while C-HA2-2
        and C-HA2-3 do supply attaining laws; the immutable predecessor
        EXP-SYC-b11b38 phrased it correctly as not proved in the worst-case
        sense, and the successor converted a correct not-proved into an
        incorrect proved-not.
      required_fix: >-
        Narrow clause C-HA2-1 from proved-not back to not-proved in the
        worst-case sense, or supply an attainment witness and label it as
        such.
    - id: RT-OBJ-C
      source_checkpoint: BATCH-a723af
      checkpoint_statement_verbatim: >-
        H-SYC-b854f4 declares four preregistered coverage_gamma_values (0/1,
        5/18, 3/10, 1/3); the record tabulates two and omits the declared
        leading null 0/1. At gamma_x = 0/1 and bits = 30 with m = 32768 the
        familywise first-moment bound is 32768 * 2^-10 / 33 = 32/33 =
        0.9696969697, NON-VACUOUS from HA-2 alone, and p = 2.959280e-05 is
        below 1/32768 = 3.051758e-05.
      required_fix: >-
        Evaluate the record's own closed form min(1, 32768 * 2^(bits*(gamma_x
        - 1/3)) / 33) at the omitted preregistered gamma_x = 0/1 across all
        five ladder sizes (bits 18, 21, 24, 27, 30); record 32/33 =
        0.9696969697 at bits 30 with p = 2.959280e-05 < 1/32768 =
        3.051758e-05, the crossing rule gamma_x <= 1/3 - (15 - log2 33)/bits,
        and the per-size crossings at m = 32768 [-0.21975588, -0.14074314,
        -0.08148358, -0.03539281, 0.00147980] (only bits = 30 non-empty,
        containing the declared null), and at m = 98304 (pre-correction)
        crossing -0.05135228 at bits 30 and negative at every size; then
        narrow C-HA2-3, C-HA2-4, B-R1, the specification success_criterion,
        and the design-repair-report summary to the gamma-qualified
        statement. Independently recompute every value and report any
        mismatch.
    - id: RT-OBJ-D
      source_checkpoint: BATCH-a723af
      checkpoint_statement_verbatim: >-
        The second moment the record says would require a NEW heuristic HA-2T
        is already numbered HA-3-subpolynomial-root-clustering in the same
        hypothesis record; the method ceiling was UNDER-reached, not
        over-claimed, and the frozen o(1) := 0 convention is load-bearing in
        both directions while the record used it only in the direction that
        produces a negative.
      required_fix: >-
        Add the already-numbered heuristic HA-3-subpolynomial-root-clustering
        to the C-HA2-6 menu with its conditionality stated as plainly as
        ROUTE-A's; state that the frozen o(1) := 0 convention is load-bearing
        in both directions.
    - id: RT-OBJ-F
      source_checkpoint: BATCH-a723af
      checkpoint_statement_verbatim: >-
        The frozen system-peak formula max_t (S + sum over j = 1..8 of B_j)
        has no term for the co-located setup process's private non-shared
        allocations, which the record's own time_base declares present, so it
        returns 0 for a host holding only setup allocations while
        budget.maximum_memory_gb = 2 is a host-level quantity.
      required_fix: >-
        Add the missing setup-process term B_0 to the frozen system-peak
        formula, or add the KAT-PEAK-F fixture that exposes its absence (one
        line: setup allocates 4096 private non-shared bytes live on [0,20),
        no shard allocation, no shared regions; true peak 4096, frozen
        formula returns 0).
    - id: VAL-A723AF-R1
      source_checkpoint: BATCH-a723af
      checkpoint_statement_verbatim: >-
        "8184 needs 14 bits" is wrong; 2^13 = 8192 >= 8184, so 13 suffice.
      required_fix: >-
        Correct any "14-bit" literal to 13 wherever it appears in the base
        package; the ff777e chain already repaired item B in three locations
        -- verify none regressed and correct any residual.
    - id: VAL-A723AF-R3
      source_checkpoint: BATCH-a723af
      checkpoint_statement_verbatim: >-
        KAT-PEAK-D binds seven simultaneous shards, not the eight the frozen
        BATCH-080a9c blocker SYSTEM-PEAK-LIVE-CONCURRENCY names, while
        claiming literal conformance; the 7+1 choice improves discrimination
        between FORBIDDEN-R2 and FORBIDDEN-R3.
      required_fix: >-
        Record the seven-versus-eight shard choice in KAT-PEAK-D as a reasoned
        deviation instead of claiming literal conformance.
