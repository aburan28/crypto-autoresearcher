      - red-team TASK-20260815-fbd43e

  - id: CONVERGENT-C-HA2-1
    source_checkpoint: BATCH-a723af
    severity: blocking_for_item_b
    checkpoint_statement_verbatim: >-
      Clause C-HA2-1 infers worst-case inadequacy of capacity 32 from the
      UPPER bound X <= 8*(L-1) with no attainment witness, while C-HA2-2 and
      C-HA2-3 do supply attaining laws. The immutable predecessor
      EXP-SYC-b11b38 phrased it correctly as not proved in the worst-case
      sense; the successor converted a correct not-proved into an incorrect
      proved-not. Both reviewers reached this without contact, which makes it
      this batch's strongest evidential fact, subject to the same-model
      discount above.
    required_fix: >-
      Narrow clause C-HA2-1 from proved-not back to not-proved in the
      worst-case sense, or supply an attainment witness and label it as such.
      The clause must not infer worst-case inadequacy of capacity 32 from the
      UPPER bound X <= 8*(L-1) without an attainment witness, while C-HA2-2
      and C-HA2-3 do supply attaining laws.
    reached_independently_by: [VAL-A723AF-R2, RT-OBJ-A]

  - id: RT-OBJ-C
    source_checkpoint: BATCH-a723af
    severity: blocking_for_item_b
    checkpoint_statement_verbatim: >-
      H-SYC-b854f4 declares four preregistered coverage_gamma_values (0/1,
      5/18, 3/10, 1/3); the record tabulates two and omits the declared
      leading null 0/1. At gamma_x = 0/1 and bits = 30 with m = 32768 the
      familywise first-moment bound is 32768 * 2^-10 / 33 = 32/33 =
      0.9696969697, NON-VACUOUS from HA-2 alone, and p = 2.959280e-05 is
      below 1/32768 = 3.051758e-05, so the covering construction fails its
      own stated hypothesis and the supremum there is 32/33 rather than 1.
    crossing_rule: 'gamma_x <= 1/3 - (15 - log2 33)/bits'
    crossing_by_bits_m_32768: [-0.21975588, -0.14074314, -0.08148358, -0.03539281, 0.00147980]
    crossing_by_bits_note: 'ordered bits 18, 21, 24, 27, 30; only bits = 30 is non-empty and it contains the declared null'
    crossing_at_bits_30_m_98304: -0.05135228
    correction_opened_the_window: >-
      Under the PRE-correction m = 98304 the crossing is negative at every
      size, so the blanket sentences would have held. The record's own
      98304 -> 32768 correction opened this window and the blanket sentences
      were not re-checked after it. The correction is right; the un-rechecked
      prose is the defect.
    falsified_at_exactly_one_ladder_point:
      - 'C-HA2-4 "no reparameterisation inside the frozen ladder can rescue it"'
      - 'B-R1 "permanently"'
      - 'the specification success_criterion'
      - 'the design-repair-report summary'
    establishes_nothing_about: 'capacity adequacy in fact, H-SYC-b854f4, or ECDLP'
    required_fix: >-
      Evaluate the record's own closed form min(1, 32768 * 2^(bits*(gamma_x -
      1/3)) / 33) at the omitted preregistered gamma_x = 0/1 across all five
      ladder sizes (bits 18, 21, 24, 27, 30); record 32/33 = 0.9696969697 at
      bits 30 with p = 2.959280e-05 < 1/32768 = 3.051758e-05, the crossing
      rule gamma_x <= 1/3 - (15 - log2 33)/bits, and the per-size crossings at
      m = 32768 [-0.21975588, -0.14074314, -0.08148358, -0.03539281,
      0.00147980] (only bits = 30 non-empty, containing the declared null),
      and at m = 98304 (pre-correction) crossing -0.05135228 at bits 30 and
      negative at every size; then narrow C-HA2-3, C-HA2-4, B-R1, the
      specification success_criterion, and the design-repair-report summary to
      the gamma-qualified statement. The producer must independently
      recompute every value and report any mismatch.
    recomputed_and_confirmed_by_the_dispatching_session: true

  - id: RT-OBJ-D
    source_checkpoint: BATCH-a723af
    severity: blocking_for_item_b
    checkpoint_statement_verbatim: >-
      The second moment the record says would require a NEW heuristic HA-2T
      is already numbered HA-3-subpolynomial-root-clustering in the same
      hypothesis record. The method ceiling was UNDER-reached, not
      over-claimed, and the frozen o(1) := 0 convention is load-bearing in
      both directions while the record used it only in the direction that
      produces a negative.
    required_fix: >-
      Add the second-moment route's already-numbered heuristic
      HA-3-subpolynomial-root-clustering to the C-HA2-6 menu with its
      conditionality stated as plainly as ROUTE-A's; state that the frozen
      o(1) := 0 convention is load-bearing in both directions.

  - id: RT-OBJ-F
    source_checkpoint: BATCH-a723af
    severity: blocking_for_item_c
    checkpoint_statement_verbatim: >-
      The frozen system-peak formula max_t ( S + sum over j = 1..8 of B_j )
      has no term for the co-located setup process's private non-shared
      allocations, which the record's own time_base declares present, so it
      returns 0 for a host holding only setup allocations while
      budget.maximum_memory_gb = 2 is a host-level quantity.
    cheapest_falsifier: 'KAT-PEAK-F, one line: setup allocates 4096 private non-shared bytes live on [0,20), no shard allocation, no shared regions; true peak 4096, frozen formula returns 0.'
    required_fix: >-
      Add the missing setup-process term B_0 to the frozen system-peak
      formula max_t (S + sum over j = 1..8 of B_j), or add the KAT-PEAK-F
      fixture that exposes its absence (one line: setup allocates 4096
      private non-shared bytes live on [0,20), no shard allocation, no shared
      regions; true peak 4096, frozen formula returns 0).

  - id: VAL-A723AF-R1
    source_checkpoint: BATCH-a723af
    severity: minor_must_fix
    checkpoint_statement_verbatim: >-
      "8184 needs 14 bits" is wrong; 2^13 = 8192 >= 8184, so 13 suffice. The
      same check confirms 8*(L-1) = 504/1016/2040/4088/8184 and the excesses
      472/984/2008/4056/8152 are exact. The downstream conclusion is
      unaffected and ROUTE-B is not adopted.
    required_fix: >-
      Correct any "14-bit" literal to 13 (2^13 = 8192 >= 8184) wherever it
      appears in the base package; the ff777e chain already repaired item B
      in three locations -- verify none regressed and correct any residual.
    confirmed_by_the_dispatching_session: true

  - id: VAL-A723AF-R3
    source_checkpoint: BATCH-a723af
    severity: moderate
    checkpoint_statement_verbatim: >-
      KAT-PEAK-D binds seven simultaneous shards, not the eight the frozen
      BATCH-080a9c blocker SYSTEM-PEAK-LIVE-CONCURRENCY names, while claiming
      literal conformance. The 7+1 choice improves discrimination between
      FORBIDDEN-R2 and FORBIDDEN-R3; the defect is asserting literal
      conformance instead of recording a reasoned deviation.
    required_fix: >-
      Record the seven-versus-eight shard choice in KAT-PEAK-D as a reasoned
      deviation (it improves discrimination between FORBIDDEN-R2 and
      FORBIDDEN-R3) instead of claiming literal conformance.

