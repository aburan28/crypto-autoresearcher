required_successor_repairs:
  - id: V4-RESIDUAL-BLOCKER-REPAIR-TRIMS-BEYOND-V2
    source_checkpoint: BATCH-8c58a3
    severity: required_before_the_blocker_repairs_self_description_can_be_trusted_at_face_value
    checkpoint_statement_verbatim: >-
      V2's five specifically-required sub-fields ARE restored genuinely,
      completely, and correctly -- both reviewers independently confirmed
      this via parsed-YAML comparison with per-field SHA-256 hashing (not
      raw text search, which both reviewers explicitly flag can produce
      false-alarm mismatches from YAML line-wrap reflow). BUT a full
      recursive parsed-YAML structural diff of the ENTIRE
      blocker_repairs.HA2-EXPECTATION-NOT-TAIL block against the same frozen
      EXP-SYC-793304 baseline -- a check neither this successor's producer,
      nor the original Validator (TASK-20260815-0825b2), nor the original
      Red Team (TASK-20260815-4f54d6) performed exhaustively (they checked
      five named phrases, not the whole block) -- finds the underlying defect
      class (silently trimmed HA-2 supporting prose, no ITEM-X-style
      disclosure) recurring. All twelve items below are confirmed by both
      reviewers to be PRE-EXISTING (already absent in EXP-SYC-edf98d, so NOT
      newly introduced by this successor's own authoring work) -- this is not
      fabrication or a new loss, it is an incomplete repair of a pre-existing
      gap.
    twelve_item_enumeration_red_team_authoritative:
      - {n: 1, field: contract_1_worst_case.falsification_condition, kind: ENTIRE_FIELD_MISSING, detail: 'Present in EXP-SYC-793304 ("Exhibit a realized retained candidate not traceable to a charged selected_pair_comparisons event, or a realized tuple occupancy above 8*(L-1). Either falsifies the event-census cost model itself."), absent from EXP-SYC-edf98d AND EXP-SYC-ff777e, not relocated anywhere in this successor package.'}
      - {n: 2, field: contract_1_worst_case.conclusion, kind: trimmed_trailing_sentence, detail: 'Missing "This is a genuine contract, not an absence of one, and it is the reason the overflow-invalidation rule is mandatory rather than precautionary."'}
      - {n: 3, field: contract_2_tuplewise_tail.certification_status, kind: trimmed_clause, detail: 'Missing "; it is an overflow probability roughly one in seventy per tuple at the ceiling slice."'}
      - {n: 4, field: contract_2_tuplewise_tail.falsification_condition, kind: trimmed_parenthetical, detail: 'Missing "(which falsifies the applicability, not the inequality)".'}
      - {n: 5, field: contract_2_tuplewise_tail.lemma_L1_sharpness, kind: trimmed_sentence, detail: 'Missing "No strengthening is available without an additional assumption beyond HA-2''s mean."'}
      - {n: 6, field: 'contract_3.cost_of_the_missing_simultaneous_tail[1]', kind: trimmed_clause, detail: 'Missing ": it is the only line of defence, and its firing probability cannot be bounded away from 1 across a full ladder."'}
      - {n: 7, field: 'contract_3.cost_of_the_missing_simultaneous_tail[2]', kind: trimmed_clause, detail: 'Missing "and even if that implementation is built exactly as designed".'}
      - {n: 8, field: 'contract_3.cost_of_the_missing_simultaneous_tail[3]', kind: trimmed_sentence, detail: 'Missing "That is a budget risk this design cannot price; it is disclosed rather than assumed away."'}
      - {n: 9, field: contract_3.lemma_L2_first_moment_union_bound.vacuity, kind: trimmed_trailing_sentence, detail: 'Missing "It is recorded because a vacuous bound is a result, not a gap." -- the IMMEDIATE SIBLING field of the two lemma_L2 fields V2 DID restore.'}
      - {n: 10, field: contract_3.lemma_L3_second_moment_route_also_vacuous.why_it_fails, kind: trimmed_qualifier_and_clause, detail: 'Missing qualifier "under gamma_x=5/18" and trailing clause "so the second-moment familywise bound is vacuous for every admissible kappa."'}
      - {n: 11, field: contract_3.lemma_L5_what_would_be_required.statement, kind: trimmed_parenthetical, detail: 'Missing "(for example a Poisson-type or exponential concentration statement for X)".'}
      - {n: 12, field: contract_3.lemma_L5_what_would_be_required.status_of_that_assumption, kind: trimmed_sentence, detail: 'Missing "This producer has no authority to approve an experiment and does not."'}
    remedy_choice: >-
      Remedy (a) is REQUIRED for this batch: RESTORE the twelve enumerated
      items verbatim, byte-for-byte, from
      experiments/EXP-SYC-793304/specification.yaml's
      blocker_repairs.HA2-EXPECTATION-NOT-TAIL block. Item 1
      (contract_1_worst_case.falsification_condition) is an ENTIRE missing
      field and is prioritized; the other eleven are trimmed
      clauses/sentences. Do not paraphrase or reconstruct from memory; quote
      the exact text. This Coordinator's rationale (recorded for the
      producer, not a license to deviate): restoring is a purely mechanical,
      verifiable byte-copy from an already-committed, immutable, frozen
      source, carries zero recomputation risk, and loses no information,
      unlike remedy (b) (an honest disclosure of absence) which would leave
      the actual supporting mathematical reasoning permanently missing from
      the record even though disclosed.
    required_fix:
      restore_source: experiments/EXP-SYC-793304/specification.yaml
      restore_block: blocker_repairs.HA2-EXPECTATION-NOT-TAIL
      byte_verification_required: >-
        The producer must verify every restored fragment byte-for-byte
        against the committed baseline
        experiments/EXP-SYC-793304/specification.yaml and report any
        transcription mismatch as a defect rather than silently correcting
        it.
      no_numeric_or_disposition_change: >-
        None of the twelve differences changes a numeric row, bound, or final
        disposition label; both BATCH-8c58a3 reviews independently
        recomputed every number and label in contract_1/2/3 and all match.
        This is a self-description/provenance-integrity defect, not a
        reversed mathematical conclusion. The HA-2 tail-unavailability
        proof's LOGIC and CONCLUSION are unchanged by this fix; only its
        SUPPORTING PROSE is restored.
    found_by:
      - validator TASK-20260815-839dc8 finding V3-RESIDUAL-COMPLETENESS-OVERCLAIM (seven items)
      - red-team TASK-20260815-fbd43e objection RT-FBD43E-OBJ2-V2-INCOMPLETE (twelve items, authoritative -- strict superset of the Validator's)

  - id: FALSE-PREAMBLE-COMPLETENESS-CLAIM
    source_checkpoint: BATCH-8c58a3
    severity: required_before_the_blocker_repairs_self_description_can_be_trusted_at_face_value
    checkpoint_statement_verbatim: >-
      What IS new in this successor: specification.yaml's own preamble
      comment immediately above blocker_repairs (~lines 519-528) newly
      asserts that, once V2's five fields are restored, the "carried forward
      unchanged ... nothing else in it is touched" language "(except for
