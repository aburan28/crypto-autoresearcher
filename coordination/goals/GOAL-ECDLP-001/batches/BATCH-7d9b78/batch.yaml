      EXP-SYC-793304 baseline the original V2 finding used -- the SAME
      failure mode as the original V2 defect (a checkable completeness claim
      a byte comparison falsifies), narrower in surface area, but appearing
      as a FRESH assertion in this successor's own committed bytes, not
