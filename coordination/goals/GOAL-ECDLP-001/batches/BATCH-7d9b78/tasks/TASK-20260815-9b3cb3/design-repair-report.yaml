    # ------------------------------------------------------------------
    # Items 3-8: the six parallel-lane (EXP-SYC-75f7d2) repairs, merged into
    # specification.yaml's merged_parallel_lane_exp_syc_75f7d2 section and
    # applied to the C-HA2 clauses, the system-peak rule, and the KAT suite.
    # ------------------------------------------------------------------

    - item_id: CONVERGENT-C-HA2-1
      severity: required
      disposition: REPAIRED
      source_checkpoint: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-a723af.yaml
      found_by:
        - validator TASK-20260815-7fa865 finding CONVERGENT-C-HA2-1
        - red-team TASK-20260815-82a8cb finding CONVERGENT-C-HA2-1
      what_was_wrong: >-
        EXP-SYC-75f7d2's clause C-HA2-1 stated the deterministic bound
        X <= 8*(L-1) "exceeds capacity 32 at every ladder size, so capacity 32
        is NOT worst-case adequate. This is settled, not merely unproved." That
        over-asserts: 8*(L-1) is a DETERMINISTIC UPPER BOUND on occupancy, not
        an ATTAINED worst case. That the bound exceeds 32 is a settled fact;
        that a realized occupancy actually reaches the bound is NOT proved.
        Both BATCH-a723af reviewers converged on the same narrowing.
      what_this_successor_does: >-
        C-HA2-1 is narrowed from "settled, not merely unproved" to "the
        deterministic upper bound 8*(L-1) exceeds capacity 32 at every ladder
        size; the bound is an upper bound, not an attained worst case, so
        worst-case adequacy is not established and overflow invalidation
        stands." The five rows are re-keyed upper_bound_8L_minus_1 (504, 1016,
        2040, 4088, 8184) with rows_are_upper_bounds_not_attained_worst_cases:
        true. No numeric value changes; only the epistemic status is corrected.
      fallback_used: false
      degraded: false

    - item_id: RT-OBJ-C
      severity: required
      disposition: REPAIRED
      source_checkpoint: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-a723af.yaml
      found_by:
        - red-team TASK-20260815-82a8cb finding RT-OBJ-C
      what_was_wrong: >-
        EXP-SYC-75f7d2's clause C-HA2-3 claimed "the familywise supremum is
        EXACTLY 1 at every ladder size and at both gamma_x slices," via a
        covering construction on the unit circle. The covering construction
        (arcs A_i = [i/m, i/m + p) with p = E[X]/33, m = 32768) covers [0,1)
        ONLY when p >= 1/m = 1/32768. At the preregistered coverage endpoints
        gamma_x = 0/1 the first-moment familywise bound (m = 32768) is
        512/33, 256/33, 128/33, 64/33, 32/33 at bits 18/21/24/27/30, clipped to
        1 except at bits 30 where it is 32/33 = 0.9696969697. At gamma_x = 0,
        bits 30, p = E[X]/33 = (1/1024)/33 = 1/33792 = 2.9592803030e-05, which
        is LESS than 1/32768 = 3.0517578125e-05, so the arcs do NOT cover and
        the construction does not attain 1; the supremum there is the
        first-moment bound 32/33, not 1. The "exactly 1" claim was therefore
        over-asserted at (gamma_x = 0/1, bits 30).
      what_this_successor_does: >-
        C-HA2-3, C-HA2-4, and residual B-R1 are gamma-qualified. An
        evaluated_gamma_x_0_over_1 sub-block is added to C-HA2-4 recording the
        five first-moment values 512/33, 256/33, 128/33, 64/33, 32/33 (clipped
        to 1 except bits 30 = 32/33 = 0.9696969697) and the covering validity
        condition p >= 1/m. The crossing rule is gamma_x <= 1/3 - (15 - log2
        33)/bits with 15 - log2 33 = 9.95560588; the m = 32768 crossings at
        bits 18/21/24/27/30 are -0.21975588, -0.14074314, -0.08148358,
        -0.03539281, 0.00147980 (only bits 30 non-empty within the preregistered
        gamma_x range, containing the null endpoint), and the m = 98304
        crossing at bits 30 is -0.05135228. B-R1 is narrowed from "derivable
        familywise overflow probability spans [0,1]" to "spans [0,1] where the
        covering construction is valid (p >= 1/m) and [0, 32/33] at
        (gamma_x = 0/1, bits 30) where it is not." All values independently
        recomputed by this task and matching.
      fallback_used: false
      degraded: false

    - item_id: RT-OBJ-D
      severity: required
      disposition: REPAIRED
      source_checkpoint: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-a723af.yaml
      found_by:
        - red-team TASK-20260815-82a8cb finding RT-OBJ-D
      what_was_wrong: >-
        EXP-SYC-75f7d2's clause C-HA2-6 declared three routes to adequacy
        (ROUTE-A new numbered heuristic, ROUTE-B capacity at the deterministic
        worst case, ROUTE-C status quo) and adopted none. The Red Team noted
        that the o(1) term in HA-2 is LOAD-BEARING in both directions: it is
        what keeps every E[X] row a symbolic reference rather than a bound, and
        a subpolynomial root-clustering heuristic on the o(1) term is a fourth,
        genuinely distinct route that C-HA2-6 did not name.
      what_this_successor_does: >-
        ROUTE-A2-HA-3-subpolynomial-root-clustering is added to the C-HA2-6
        menu as a declared, NOT-adopted route: a subpolynomial control on the
        o(1) term (root clustering of the matching A values) that would convert
        the symbolic E[X] rows into finite-N bounds, stated with its
        requirement (archived validation) and its reason_not_adopted (amending
        the hypothesis record is outside this task's write scope; an unvalidated
        heuristic would cap the claim below supported in any case). The o(1)
        term's load-bearing role in both directions is recorded.
      fallback_used: false
      degraded: false

    - item_id: RT-OBJ-F
      severity: required
      disposition: REPAIRED
      source_checkpoint: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-a723af.yaml
      found_by:
        - red-team TASK-20260815-82a8cb finding RT-OBJ-F
      what_was_wrong: >-
        EXP-SYC-75f7d2's frozen system-peak formula
        max_t ( S(t) + sum_{j=1..8} B_j(t) ) charged the shared context S(t)
        and the eight non-shared shard streams B_j(t) but OMITTED the
        setup-private allocation B_0(t): bytes live in the setup process's own
        private (neither shared nor shard) regions. A setup-private allocation
        is concurrently live and must be charged, so the frozen formula
        undercounts by up to max_t B_0(t).
      what_this_successor_does: >-
        The frozen formula is corrected to
        max_t ( B_0(t) + S(t) + sum_{j=1..8} B_j(t) ), with the equivalent
        per-shard-totals form max_t ( B_0(t) + sum_j P_j(t) - D(t) ) and the
        retained bracket's upper bound widened by max_t B_0(t). FORBIDDEN-R7
        (omitted-setup-stream) is added to the forbidden-rules list, and the
        KAT-PEAK-F fixture (setup-private-allocation) is added to the KAT suite:
        a setup-private allocation of 1 byte live while all shards and the
        shared context are idle, expected_system_peak 1, rejecting
        FORBIDDEN-R7 (which returns 0). No other KAT changes.
      fallback_used: false
      degraded: false

    - item_id: VAL-A723AF-R1
      severity: required
      disposition: REPAIRED
      source_checkpoint: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-a723af.yaml
      found_by:
        - validator TASK-20260815-7fa865 finding VAL-A723AF-R1
      what_was_wrong: >-
        EXP-SYC-75f7d2's ROUTE-B (capacity at the deterministic worst case)
        stated that 8184 admissible values "needs 14 bits" (U8 -> at least
        U14). That is an arithmetic error: 8184 needs 13 bits, since
        2^13 = 8192 >= 8184 and 2^12 = 4096 < 8184. This is the same
        14-vs-13 error as item B (B-BITWIDTH-14-VS-13-ERROR) that was already
        corrected in the ff777e line, re-introduced in the parallel lane.
      what_this_successor_does: >-
        ROUTE-B's width statement is corrected to U8 -> at least U13 (u16 in
        any byte-aligned layout); "14 bits" appears only as the quoted error
        being corrected. Consistent with item B's carried-forward 13-bit
        correction. No numeric row changes.
      fallback_used: false
      degraded: false

    - item_id: VAL-A723AF-R3
      severity: required
      disposition: REPAIRED
      source_checkpoint: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-a723af.yaml
      found_by:
        - validator TASK-20260815-7fa865 finding VAL-A723AF-R3
      what_was_wrong: >-
        The parallel lane's KAT-PEAK-D (seven-simultaneous-one-staggered-one-
        shared, expected peak 15) and the primary line's KAT-PEAK-5
        (seven-simultaneous-one-staggered, expected peak 7) look like the same
        fixture with different expected values, which reads as an
        inconsistency. It is not: KAT-PEAK-D additionally charges a 1-byte
        shared region mapped by all eight shards (hence +1 over the 7+2=9...
        precisely 15 with the shared byte and the staggered shard's 2 bytes),
        while KAT-PEAK-5 has no shared region (7 simultaneous 1-byte shards).
        The 7-vs-8 / 15-vs-7 difference is the shared byte plus the staggered
        shard's byte count, a REASONED deviation, not an arithmetic error.
      what_this_successor_does: >-
        KAT-PEAK-D is recorded as a reasoned deviation from KAT-PEAK-5, with
