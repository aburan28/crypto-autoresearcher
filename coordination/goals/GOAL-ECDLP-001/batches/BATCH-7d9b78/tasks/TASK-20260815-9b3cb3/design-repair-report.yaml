    successor that supersedes BOTH EXP-SYC-ff777e (primary base) and
    EXP-SYC-75f7d2 (merged parallel lane), without implementation, execution,
    cap change, weakened predecessor closure, use of process-invalid precursor
    bytes, or fabrication -- while carrying every confirmed-repaired item (A,
    B, C, D2, V2) and every other finding of both predecessors forward
    unchanged.

