        task card names explicitly under
        `required_fix.prioritize_item_1`, and it omits
        `contract_2_tuplewise_tail.falsification_condition`.
        (d) specification.yaml's own `V4_FIX_APPLIED.twelve_items_restored` list
        IS correct and matches the checkpoint exactly, so the two artifacts of
        one package contradict each other.
      what_this_does_not_do: >-
        It does not mean the restoration failed. I verified independently that
        all twelve authoritative items ARE restored byte-for-byte, including the
        prioritized item 1. The defect is in the report's account of the work,
        not in the work.
      why_this_is_blocking: >-
        design-repair-report.yaml is the artifact a reviewer or a future
        Coordinator reads to learn what was repaired. A reader who checked the
        listed twelve would verify seven fields that were never broken, miss the
        one field the task card ordered prioritized, and conclude the item was
        discharged for the wrong reasons. It is also the single best piece of
        evidence for finding B4: a list produced by an actual parsed-YAML
