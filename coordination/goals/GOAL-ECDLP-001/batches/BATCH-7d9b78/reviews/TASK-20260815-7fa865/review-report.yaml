        BATCH-a723af -- Validator TASK-20260815-508861 (VAL-A723AF-R1/R2/R3) and
        Red Team TASK-20260815-47a2e9 (RT-OBJ-A/C/D/F), with CONVERGENT-C-HA2-1
        recorded as `reached_independently_by: [VAL-A723AF-R2, RT-OBJ-A]`.
        The producer's own `item_by_item[*].source_checkpoint` fields name those
        two checkpoints correctly, so the checkpoints were read; only the
