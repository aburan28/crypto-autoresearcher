  verdict_enum_note: >-
    The dispatching instruction requests ACCEPT / REVISE / REJECT; the role
    contract (agents/validator.md) requires a terminal verdict from
    passed | failed | incomplete | invalid. Both are supplied. REVISE maps to
    `failed`, NOT to `incomplete` and NOT to `invalid`.
    NOT `incomplete`, because the blocking findings below are not gaps or
    missing checks: they are affirmative statements of fact inside
    snapshot-committed artifacts that committed records contradict. A missing
    field is incomplete; a false self-report is failed.
    NOT `invalid`, because nothing about the package's process integrity
    collapsed: the snapshot is a real, reachable, single-purpose Coordinator
    commit; all six declared path_sha256 values recompute exactly; zero
    experiment runs occurred; no hard cap was raised; no status moved; no
    quarantined precursor was used; and -- this is the important part -- EVERY
    numeric row, bound, and literal in the package recomputes exactly from the
    frozen formulas. No number anywhere is fabricated.
    NOT `passed`, because a passed report would make this receipt admissible
    evidence, and one of the six artifacts states, of its own authoring
    session, something the same snapshot's own receipt shows to be untrue.

  verdict_summary: >-
    REVISE. The MATHEMATICS AND THE REPAIRS SURVIVE THIS REVIEW INTACT. All
    four of verification_scope items 1, 3, 4 and 5 PASS in full and item 6
    passes on its own terms: every numeric literal recomputes, all twelve V4
    items are byte-for-byte identical to the frozen EXP-SYC-793304 baseline,
    the three carried-forward residuals are unchanged, every preserved closure
    is intact, and the zero-run static ceiling is stated honestly with no
    ECDLP result asserted anywhere. Item 2 passes AT THE LEVEL OF THE FROZEN
    CONTRACT: all eight required repairs are genuinely discharged in
    experiments/EXP-SYC-dc854f/specification.yaml, independently verified here
    field by field.
    WHAT FAILS IS RECORD INTEGRITY, and it fails in the one dimension this
    chain has been repairing for four consecutive batches: a record saying
    something checkably untrue about itself. Five blocking findings, none of
    them arithmetic. The worst is B1: specification.yaml's `runtime_provenance`
    and `authority` blocks are byte-identical copies of EXP-SYC-ff777e's, so
    the frozen contract asserts, in the first person, that THIS authoring
    session self-reported `claude-sonnet-5` under TASK-20260815-6f4429 in
    BATCH-8c58a3 -- while the producer's own receipt in the SAME snapshot, and
    the other four deliverables, all record `vllm/qwen3.8-27b` under
    TASK-20260815-9b3cb3 in BATCH-7d9b78. That block also carries a
    `conflation_forbidden_note` citing CORR-20260815-092c9f as the precedent it
    must not repeat. It repeats it. B2 attributes all eight findings to THIS
    batch's two not-yet-dispatched reviews (TASK-20260815-7fa865 and
    TASK-20260815-82a8cb) rather than to the four sessions that actually made
    them. B3 and B5 are two further places where design-repair-report.yaml
    contradicts the specification it reports on -- and B3's contradiction omits
    exactly the item the task card ordered prioritized. B4 is a method claim
    that cannot be true alongside the same package's own `parser_invoked:
    false`.
    None of this is a mathematical negative about H-SYC-b854f4 or about ECDLP,
    and none of it touches the arithmetic. It is a provenance and
    self-description failure in a package whose entire purpose this batch was
    to repair provenance and self-description.

