  control_checks:
    - id: CC-1-null-object-controls-present
      status: PASS
      per_inventor_protocol: section 3, controls before belief
      finding: >-
        NKAT-HA2-EQUAL-MEAN is a genuine null object of the same shape for the
        inference the design must refuse: the two-point law X=33 with
        probability mu/33 and X=0 otherwise preserves EVERY displayed mean and
        EVERY displayed margin exactly while making overflow positive-probability.
        Its expected_verdict is stated as a mandatory failure condition -- "Any
        argument that infers capacity adequacy, tail safety, or overflow
        improbability from an HA-2 mean margin MUST FAIL against this fixture"
        -- with may_be_removed_when set to "never" absent a validated finite-N
        tail heuristic, and an explicit forbidden-uses list. I verified it is
        exactly the Markov extremal law, so it is sharp, not merely illustrative.
        NKAT-HA2-CONVENTION-DEGENERACY is a second, structurally different null:
        applying the frozen o(1):=0 convention to HA-3's kappa forces kappa = 1,
        hence X supported on {0,1}, hence P(X >= 33) = 0 by fiat. It is correctly
        labelled a certificate that must be REJECTED as assuming its conclusion.
        FORBIDDEN-R1 through R7 act as negative controls on the peak rule, each
        with a KAT that returns a specific wrong value under the wrong rule.
    - id: CC-2-decay-question-addressed
      status: PASS
      per_inventor_protocol: section 3, the canonical artifact tell
      finding: >-
        The operating rule asks whether the report states what the measured
        quantity SHOULD do as the parameter meant to destroy it increases. Here
        the parameter is ladder size and the quantity is the familywise bound.
        The record answers it directly and negatively: the bound decays across
        the ladder (1489.45 -> 938.30 at gamma_x = 5/18) but NOWHERE crosses 1,
        and the record computes exactly where it would -- bits >= 179.2 at
        m = 32768, bits >= 207.7 at m = 98304, both far outside the frozen
        ladder -- and at the gamma_x = 1/3 ceiling the bound is CONSTANT IN N
        (2978.91 at every size), which the record calls out as "vacuous at every
        conceivable size, not only on this ladder". A quantity that does not
        decay when it should is the artifact tell; here the non-decay is
        measured, quantified, and reported as the negative result rather than
        explained away.
    - id: CC-3-no-statistical-signal-is-claimed
      status: PASS
      finding: >-
        Zero runs, zero measurements, zero samples. No correlation, bias, or
        excess is reported anywhere, so there is no signal that could require a
        null control it does not have. The controls above are contract-level
        fixtures for a future implementation, and the record says so explicitly:
        "These fixtures are SPECIFIED, not executed. No fixture was run, no byte
        was allocated, and no measurement exists."
    - id: CC-4-positive-controls
