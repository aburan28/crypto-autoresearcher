        receipt and tabulated them; only the specification dissents.
      why_this_is_blocking: >-
        Three reasons, and any one of them suffices.
        (1) It is a first-person assertion of a verbatim system-context
        quotation that the same snapshot shows the session did not receive. It
        is not a missing field; it is a stated untruth about identity, which is
        the exact category AGENTS.md rule 9 forbids.
        (2) The block that contains it carries a `conflation_forbidden_note`
        naming CORR-20260815-092c9f -- the correction issued for precisely this
        failure mode in the BATCH-86fd69 archive receipt -- as the precedent
        "this record deliberately keeps ... separate". A record that cites the
        correction for its own defect while committing that defect is worse than
        one that is merely silent, because it invites a reader to stop checking.
        (3) It is load-bearing for review routing. `authority.reviewed_by_tasks`
        names the PREVIOUS batch's reviewers, so the frozen contract's own
        statement of who is reviewing it is wrong, and the SESSION-MODEL-PROVENANCE-GAP
        disposition it records (the DEC-20260815-23d3bd / DEC-20260815-d83212
        amendment) is being asserted for the wrong session's model.
      what_is_NOT_claimed: >-
        I do not claim deliberate deception. The mechanism is visibly a
        copy-forward of an inherited block that was never re-authored for the
        new session, and every OTHER artifact of the same task got it right,
        which is the signature of an omission rather than an invention. That
        mitigates the intent reading. It does not change the effect: the frozen,
        snapshot-committed contract states something false about itself, and a
        later reader has no way to know which of the two model identities in the
        package describes the session that wrote the specification.
      required_fix: >-
        A successor record (NEVER an edit to the committed snapshot) must
        re-author `runtime_provenance` and `authority` in specification.yaml to
        describe its own authoring session: its own task_id, batch_id, receipt
        path, genuine self-reported resolved model id kept separate from the
        committed binding target, and its own archived_by / reviewed_by tasks.
        Because the defective bytes are already committed and immutable, the
        Coordinator should additionally consider a CORR-* record superseding the
        false provenance assertion by reference, on the CORR-20260815-092c9f
        precedent.

    - id: VAL-7FA865-B2
      title: All eight repair items are attributed to this batch's two not-yet-dispatched reviews
      severity: blocking
      class: fabricated_citation_provenance
      rule_engaged: AGENTS.md core rule 9 (citations); AGENTS.md "Never record an agreement, attestation, or approval you did not obtain"
      location:
        file: coordination/goals/GOAL-ECDLP-001/batches/BATCH-7d9b78/tasks/TASK-20260815-9b3cb3/design-repair-report.yaml
        fields: item_by_item[*].found_by (lines 202-203, 259-260, 293-295, 319-320, 357-358, 383-384, 410-411, 431-432)
      what_the_record_says:
        - 'V4-RESIDUAL-BLOCKER-REPAIR-TRIMS-BEYOND-V2 found_by: "validator TASK-20260815-7fa865 predecessor finding (BATCH-8c58a3 dual review)"'
        - 'FALSE-PREAMBLE-COMPLETENESS-CLAIM found_by: "red-team TASK-20260815-82a8cb predecessor finding (BATCH-8c58a3 dual review)"'
