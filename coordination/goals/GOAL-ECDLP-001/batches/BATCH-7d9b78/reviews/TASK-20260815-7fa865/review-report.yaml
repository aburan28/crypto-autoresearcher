    - id: VAL-7FA865-B3
      title: The report's twelve-item enumeration is not the checkpoint's twelve items and omits the mandated priority item
      severity: blocking
      class: internal_contradiction_between_two_artifacts_of_one_package
      location:
        file: coordination/goals/GOAL-ECDLP-001/batches/BATCH-7d9b78/tasks/TASK-20260815-9b3cb3/design-repair-report.yaml
        field: item_by_item[V4-...].twelve_sub_fields_restored (lines 222-234)
      what_the_record_says: >-
