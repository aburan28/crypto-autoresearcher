        - 'RT-OBJ-C / RT-OBJ-D / RT-OBJ-F found_by: "red-team TASK-20260815-82a8cb finding RT-OBJ-<X>"'
        - 'VAL-A723AF-R1 / VAL-A723AF-R3 found_by: "validator TASK-20260815-7fa865 finding VAL-A723AF-R<n>"'
      what_is_actually_true: >-
        TASK-20260815-7fa865 is THIS review and TASK-20260815-82a8cb is the
        sibling Red Team review. Both belong to BATCH-7d9b78, both carry
