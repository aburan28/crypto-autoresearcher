  # =========================================================================
  # PROOF-ARCHITECTURE CHECKS  (docs/inventor-protocol.md section 8, KN-TECH-080)
  # =========================================================================
  proof_architecture_checks:
    - check: baseline_fixture
      status: PASS_AS_SCOPED
      finding: >-
        The proof_search_map records "predecessor finite rho/BSGS frontier and
        matched eight-way shard assignment preserved by reference; no measured
        baseline row exists" -- an honest statement rather than a claimed
        reproduction. Where an exact fixture DOES exist I reproduced it: all
        twelve V4 fields against EXP-SYC-793304 byte-for-byte, all seven
        KAT-PEAK fixtures against the predecessor byte-for-byte, and the whole
        DERIV1_regression block byte-for-byte. Symbolic identities (4088/2^27,
        33/98304 = 11/32768, 1089/98304 = 363/32768, 32*2^(bits/18)) recompute
        exactly rather than approximately.
    - check: strictness_witness
      status: NOT_APPLICABLE_CORRECTLY_DECLARED
      finding: >-
        No improvement over anything is claimed, so no strictness witness is
        owed. frontier_gate.advantage_claimed is false and
        baseline_position records the rho and BSGS baselines as unchallenged.
    - check: observation_collisions
      status: PASS
      finding: >-
        The map states the overflow rule separates a saturated stream from a
        valid one, and that the equal-mean negative KAT plus lemmas L2-L4 show
        the mean-margin collision cannot be resolved by any first- or
        second-moment argument in the committed hypothesis record. I verified the
        arithmetic behind that: the first-moment familywise bound is >= 938.3
        everywhere on the ladder and the second-moment route needs
        kappa*mu <= 0.011077880859375 while kappa*mu >= 0.3149802624737183. The
        collision is real and is bound to its enumerated scope (the frozen
        ladder, the two tabulated slices, and now explicitly the third slice
        gamma_x = 0/1 after RT-OBJ-C).
    - check: interface_preservation
      status: PASS
      finding: >-
        The one representation change in this batch -- the system-peak formula
        gaining B_0 -- records its equivalence explicitly
        (`B_0 + sum_j P_j - D = B_0 + S + sum_j B_j`), widens the retained
        bracket's upper bound by max_t B_0, adds a forbidden rule for the
        omitted term, and adds a discriminating KAT. Nothing is lost silently.
    - check: ceiling_and_nearby_control
      status: PASS
      finding: >-
        The declared method ceiling is exactly right and is stated against the
        method's own resource measure: "a zero-run static producer cannot
        establish a finite-N tail, a measured peak, capacity fit, a crossover N,
        an attack, a speedup, a status transition, or a communication
        itemization where none exists in the inherited design; RT-OBJ3, RT-OBJ4,
        and communication's itemization residual sit exactly at this ceiling."
        I confirmed all three of those sit at the ceiling and none was quietly
        closed. The nearby-object control is declared "preserved by reference;
        not executed", which is honest for a zero-run record.
    - check: quantifier_fidelity
      status: PASS
      finding: >-
        The quantifier order is frozen before data ("sizes, curves, roots,
        models, eta strata, shards, time base, dedup definition, caps, KAT
        expected values, and overflow behaviour frozen before any future data").
        The CONVERGENT-C-HA2-1 repair is precisely a quantifier-fidelity fix: an
        upper bound (for-all) had been read as an attainment (there-exists), and
        the successor restores the distinction and redirects attainment to the
        clauses that actually supply attaining laws. The RT-OBJ-C repair is the
        second: a claim quantified over "both gamma_x slices" was being read as
        quantified over all four preregistered slices, and is now
        gamma-qualified per slice and per ladder size.

  # =========================================================================
  # SCALED-DOWN-INSTANCE LADDER  (docs/inventor-protocol.md section 6)
  # =========================================================================
  scaled_down_ladder_checks:
    applicability: NOT_TRIGGERED
    reasoning: >-
      My operating rules require the section 6 ladder when a claimed improvement
      cannot be executed at the scale where it would matter, and make a missing
      step 2 a `failed` WHEN A SPEEDUP IS CLAIMED. NO SPEEDUP, ADVANTAGE, OR
      IMPROVEMENT OF ANY KIND IS CLAIMED HERE. maximum_runs is 0,
      experiment_runs is 0, `measured_frontier_present: false`,
      `advantage_claimed: false`, and the package states in four separate places
      that it reports no solver, speedup, attack, or cost delta. The ladder's
      trigger is absent, so its absence is not a defect and I do not record one.
    what_this_means_and_what_it_forbids: >-
      Stated plainly so the Coordinator cannot read this PASS as more than it is:
      because step 2 was never run, THERE IS NO MEASURED RATIO AGAINST ANY
      BASELINE ANYWHERE IN THIS PACKAGE, and nothing in it may be cited in
      support of any claim that this design is faster, cheaper, or better than
      Pollard rho, BSGS, or any other baseline. The package agrees: its
      frontier_gate says even a future measured frontier could not support a
      dominance claim while the HA-2 familywise tail is unavailable.
    reproducibility_pointer: >-
      The only rebuildable artifacts here are the digests and the field
      comparisons, and I exercised them rather than asserting them: all six
      path_sha256 recomputed from the commit, all twelve V4 fields re-compared
      against the baseline, all seven KAT-PEAK fixtures re-compared against the
      predecessor, every numeric literal recomputed from the frozen formulas.
      The producer explicitly computed no digest and delegated strict parsing to
      the review tasks; that delegation is now discharged (AC-5).

  # =========================================================================
  # HEURISTIC-VALIDATION AND COST-MODEL CHECKS
  # =========================================================================
  heuristic_validation_checks:
    - check: pre_registered_prediction
      status: NOT_APPLICABLE_NO_SAMPLING_OCCURRED
      finding: >-
        No sampling, no empirical CDF, no tail statistic. HA-2 and HA-3 are
        numbered heuristics in ledger/hypotheses/H-SYC-b854f4.yaml, quoted here
        verbatim with their formal statements, and the record states plainly that
        HA-2's promotion gate -- a numbered heuristic with archived validation --
        REMAINS UNSATISFIED and therefore caps any dependent claim below
        `supported`. That is the correct handling of an unvalidated heuristic.
    - check: sample_integrity
      status: NOT_APPLICABLE
      finding: no samples, no seeds, no sampling procedure, because zero runs occurred and none is authorized.
    - check: correspondence_validity
      status: NOT_APPLICABLE_BUT_ONE_CORRESPONDENCE_IS_DECLARED_AND_CONTROLLED
      finding: >-
        The one substitution in the design is the eta-stratum correspondence:
        98304 accounting tuples versus 32768 distinct random variables, on the
        stated ground that eta is a preregistered analysis stratum rather than a
        new root draw so each eta tuple's occupancy EQUALS that root/model X.
        The record uses the CONSERVATIVE count 32768 for every familywise
        statement and says why ("makes each derived bound smaller and each
        vacuity conclusion stronger"), and carries both counts and both closed
        forms. Choosing the count that weakens your own negative result is the
        right direction to err, and I verified both forms
        (min(1, 2^(15-bits/18)/33) and min(1, 2^(15-bits/18)/11)) and both
        thresholds.
    - check: scale_binding
      status: PASS
      finding: >-
        Parameter sizes are recorded exactly (bits 18/21/24/27/30, 32 curves, 256
        roots, 4 public models, 3 eta values, capacity 32, U8 width, 98304
        tuples), transfer_authorized is false, and every extension of the frozen
        symbolic expression -- including the 179.2 / 207.7 bit thresholds -- is
        explicitly labelled ARITHMETIC ONLY and "not a claim about cryptographic
        scale, not a transfer, not an extrapolation of any measured quantity".
        The scale mismatch between an 18-30 bit ladder and any cryptographic
        parameter is reported as a scope limitation, exactly as AGENTS.md rule 7
        requires, not concealed and not treated as disqualifying.
  cost_model_checks:
    - check: declared_unit
      status: PASS
      finding: >-
        Every capacity table is in BYTES and says so (archive, communication,
        output, group_additions, logical_traffic, peak_live_bytes); the rho
        baseline is in GROUP OPERATIONS (0.886*sqrt(N)); budgets are in
        wall-clock seconds and CPU hours. No table lacks a unit.
    - check: memory_reported_alongside_time
      status: PASS
      finding: >-
        budget carries maximum_memory_gb 2 beside the wall and CPU columns, and
        the peak_live_bytes axis is a first-class frontier axis with
        `peak_axis_can_be_ignored: false`. Memory is the binding constraint here
        and the record treats it as such: PEAK-AGGREGATE-FIT-UNPROVED is carried
        as an open residual precisely because no byte figure exists to compare
        against the 2 GB ceiling.
    - check: optimistic_assumptions_flagged
      status: PASS
      finding: >-
        The x3 mount-state multiplier is flagged DERIVED and "not directly
        stated"; the larger non-adopted additive-delta alternative 7713503488 is
        disclosed as a robustness check; the dedup term's unproved duplication is
        set to 0, which is the conservative direction and is stated; ROUTE-B's
        byte impact is recorded as UNKNOWN and explicitly not estimated. Nothing
        optimistic is quietly assumed.
    - check: per_attempt_cost_times_inverse_success_probability
      status: PASS_BY_CORRECT_REFUSAL
      finding: >-
        This is the check that matters most here and the record gets it right in
        the only way available to it. Because no bound on the probability of
        mid-run invalidation exists, the record states that
        per-attempt-cost x inverse-success-probability bookkeeping is
        UNAVAILABLE, and therefore that "no cost, frontier, dominance, or
        advantage claim is admissible from this design EVEN AFTER A FUTURE
        IMPLEMENTATION". frontier_gate repeats it as a standing gate. Refusing
        the bookkeeping is the correct output when the success probability is
        unbounded; computing it as if success were certain would have been the
        violation.
    - check: time_memory_tradeoffs
      status: PASS_AS_SCOPED
      finding: >-
        ROUTE-B's tradeoff is stated qualitatively and honestly: widening
        candidate_index from U8 to at least U13 (u16 byte-aligned) buys
        deterministic overflow impossibility at the price of "strictly worsening
        all three already-open output, archive, and communication residuals",
        with the byte deltas recorded as an open, uncomputed quantity (B-R3)
        rather than estimated.

  # =========================================================================
  # WHAT THIS REPORT DOES NOT DO
  # =========================================================================
  claim_boundary: >-
    This is an independent, non-originating review of a zero-run static design
    record. It executed zero experiment runs, wrote no code, generated no curve
    or target, created no evidence or decision record, changed no status,
    modified no producer or predecessor artifact, raised no cap or budget,
    committed nothing, and contacted no backend. It asserts nothing whatever
    about ECDLP, about H-SYC-b854f4, or about any speedup: no mathematical
    negative and no positive follows from any finding above. A `failed`
    validation status here means THE RECEIPT IS NOT YET ADMISSIBLE AS EVIDENCE
    because of provenance and self-description defects; it is not a mathematical
    result, and per AGENTS.md rule 5 and this record's own stopping rules,
    apparatus and contract residuals are never evidence against a mathematical
    hypothesis.

