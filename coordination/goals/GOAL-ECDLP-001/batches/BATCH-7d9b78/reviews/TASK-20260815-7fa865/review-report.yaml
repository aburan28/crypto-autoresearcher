        contract_2.tight_per_tuple_first_moment.lemma_L1_statement, ...,
        .assumption_number, .serialization_convention, .rows, .ceiling_row,
        .independent_corroboration, .certification_status, then two aggregate
        entries for contract_3.
      what_is_actually_true: >-
        (a) The parent path segments do not exist. The spec's keys are
        `contract_1_worst_case`, `contract_2_tuplewise_tail`,
        `contract_3_simultaneous_tail`; there is no
        `contract_1.deterministic_worst_case` and no
        `contract_2.tight_per_tuple_first_moment` anywhere in the block.
        (b) The list is not the checkpoint's authoritative twelve. Seven of its
        entries (rows, lemma_L1_statement, assumption_number,
        serialization_convention, rows, ceiling_row, independent_corroboration)
        were never among the trimmed fields at all -- I confirmed each of them
        already matched the baseline in ff777e -- and one of them,
        serialization_convention, is a field that DELIBERATELY DIFFERS from the
