  preserved_confirmed_core:
    direct_marginal_log_link: >-
      log p_i=alpha+beta log(N_i/2^24)+eta(N_i^(-1/3)-2^-8) targets the
      marginal Bernoulli probability directly, with gamma_s=beta+1/3 exactly.
      There is no random effect, D exposure, floor offset, hazard premise,
      rare-event conversion, or conditional-to-marginal conversion.
    matched_mean_bridge: >-
      Both deterministic streams have E[X]=E[Y]=1/4. The diffuse stream has
      kappa=1, p=1/4, gamma_s=1/3. The concentrated stream has
      kappa=N^(1/3), p=(1/4)N^(-1/3), and gamma_s=0. Every legal cluster
      resample preserves the planted +1/3 and -1/3 bridge slopes at eta=0.
    asymptotic_gates:
      raw_work: N^(2/3-gamma_s+o(1))
      live_storage: N^(1/3+o(1))
      full_cost: N^(7/9-gamma_s+o(1))
      raw_rho: gamma_s>1/6
      full_rho: gamma_s>5/18
      standard_BSGS_full: gamma_s>1/9
      method_ceiling: 'gamma_s<=1/3 with N^(1/3) root-work and storage floors'
    honesty_fields:
      proof_search_map_present: true
      novelty_status: unverified
      dominated_by: >-
        With no observed gamma_s, rho dominates at gamma_s=0 and there is no
        fully charged win through gamma_s=5/18.
      sota_delta: >-
        Candidate-minus-rho is 1/6-gamma_s raw and 5/18-gamma_s full with
        +1/3 storage. No measured delta exists.

