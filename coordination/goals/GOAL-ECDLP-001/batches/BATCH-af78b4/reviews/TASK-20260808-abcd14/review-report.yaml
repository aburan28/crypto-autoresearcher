  verdict_basis: >-
    The proposed authoritative reading is technically recoverable and the
    scientific REVISE disposition remains admissible, but the lineage is not
    presently a fully verifier-accepted archive chain. Commit
    6191a4e82e276039f27f58eada612411ee372880 is mechanically exact while its
    checkpoint and decision semantically cite the stale pre-correction review
    digest. Commit add528c646751e4d6066154b70a55cd8a5c0712f is an invalid
    same-path edit of four already archived artifacts. Commit
    92706c27b72c55013283439d9dee1c5eb569be9b restores those four paths
    byte-for-byte to their original 6191a4e82 blobs without erasing the
    intervening history. Commit d8920562901a578e08d18cc9ce2b3fce763a0186
    contains the exact correction and receipt bytes but fails its immutable
    archive envelope because its message omits source task
    TASK-20260808-3a3d21. Commit
    d99cb03f7b22bba43c640aa8366dcddbbad04de2 then falsely recorded successful
    verification, including a nonexistent full commit SHA and an incorrect
    all-identifiers assertion. A new exact-path successor ledger archive is
    therefore required. REJECT is not warranted because the final technical
    report and proposal snapshot remain byte-stable and the six scientific
    blockers are unchanged; PASS is not warranted until the successor evidence,
    decision, report, and receipt receive a valid archive envelope.
