      - id: VAL-F2-TREATMENT-SHARING-001
        severity: critical
        category: seed_operation_schedule_consistency
        unchanged: true
        statement: >-
          Treatment keys include model, producing 163840 model-root contexts,
          while the operation schedule charges 40960 shared canonical roots
          transformed to the other models. The proposal must choose shared
          component keys or charge four independent roots and recompile all
          affected rows.
        required_revision: >-
          Freeze component-level ownership for shared versus model-specific
          keys and recompile every affected operation, transform, storage, and
          traffic count.
      - id: VAL-F2-TRAFFIC-COMPILER-001
        severity: critical
        category: local_traffic_and_resource_admission
        unchanged: true
        statement: >-
          The five logical-local-traffic values sum to 261870023168 bytes, and
          the 25-percent reserve arithmetic is correct, but no component
          event-count times byte-width formulas derive those values. The
          aggregate assertions cannot prove that every promised access is
          charged or serve as the sole compiler source.
        required_revision: >-
          Replace aggregate traffic rows with compiler-checkable component
          event-count and width formulas and derive only their sum into the hard
          cap.
      - id: VAL-F2-PLANTED-SAMPLER-001
        severity: critical
        category: selector_control_determinism
        unchanged: true
        statement: >-
          The planted-gamma controls use generally non-dyadic probabilities
          K^(-1/6), K^(-1/18), and K^(-1/30) without a certified exact sampler,
          interval-comparison semantics, byte-consumption rule, stopping cap, or
          finite rational replacement.
        required_revision: >-
          Freeze and charge a certified exact Bernoulli sampler with a bounded
          stopping rule, or replace the probabilities with exact finite
          rational thresholds and recompute the control references.
      - id: VAL-F2-EXACT-QUOTIENT-L-001
        severity: major
        category: selector_control_operation_semantics
        unchanged: true
        statement: >-
          CTRL-EXACT-QUOTIENT declares L=M=U-1 while its supposedly exact arm
          row uses L=U. The overcharge is conservative as a cap but conflicts
          with exact list-label, pair, join, metric, hash, traffic, and archive
          semantics.
        required_revision: >-
          Compile the row with L=M or explicitly define a harmless padded list
          operation and distinguish actual-event counts from allocation caps.
      - id: VAL-F3-CANONICAL-ONCURVE-001
        severity: major
        category: unequal_isomorphism_pre_treatment_gate
        unchanged: true
        statement: >-
          The mandatory isomorphism gate promises on-curve checks for every
          canonical and transformed fixture point but charges only 39360
          transformed checks. At least 12800 canonical checks, 25600
          multiplications, 25600 squarings, and their traffic costs are absent.
        required_revision: >-
          Add every canonical fixture on-curve query, specify whether P and Q
          are covered by curve certificates, charge exact field and traffic
          costs, and recompile the S3 and headline caps.
