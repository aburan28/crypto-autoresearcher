        - {quantity: total_raw, exponent: '2/3-gamma_s'}
        - {quantity: live_storage, exponent: '1/3'}
        - {quantity: wiring_multiplier, exponent: '1/9'}
        - {quantity: total_full_cost, exponent: '7/9-gamma_s'}
