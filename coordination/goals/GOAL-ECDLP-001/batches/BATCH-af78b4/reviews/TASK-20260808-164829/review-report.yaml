  preservation_and_claim_boundary_audit:
    marginal_Bernoulli_log_link:
      status: satisfied
      recomputation: >-
        log p_i=alpha+beta log(N_i/2^24)+eta(N_i^(-1/3)-2^-8) targets the
        finite-design marginal Bernoulli probability directly. The fixed eta
        term tends to a constant absorbed by alpha, so gamma_s=beta+1/3
        exactly. There is no random effect, D exposure, floor offset, hazard
        approximation, rare-event conversion, or conditional-to-marginal
        conversion.
    Boolean_second_moment_bridge:
      status: satisfied_at_proposal_algebra_level
      recomputation: >-
        Paley-Zygmund gives E[X]/kappa_N <= Pr[X>=1] <= E[X]. If
        kappa_N=N^o(1) and V=X except for negligible apparatus failure, then
        p_N and E[X] have the same exponent. E[Y] is not substituted for
        Boolean success.
    asymptotic_cost_gates:
      status: satisfied_conditionally
      rows:
        - {quantity: per_root_raw, exponent: '1/3'}
        - {quantity: marginal_success, exponent: '-1/3+gamma_s'}
