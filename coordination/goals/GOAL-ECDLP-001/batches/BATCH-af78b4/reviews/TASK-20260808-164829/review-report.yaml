  cheapest_falsification_control:
    name: repaired_matched_mean_decoder_seed_and_estimator_fixture
    authorization: future_separately_authorized_experiment_contract_only
    construction: >-
      After a versioned proposal freezes separate cluster-rank keys, materialize
      only the deterministic diffuse and concentrated matched-mean streams,
      decode their reversible bitsets and multiplicity table, and run the
      frozen eta-aware marginal, kappa, p/E[X], and whole-cluster bootstrap
      analysis. Do not generate a curve, scalar list, selector, selected pair,
      isomorphism model, or signed-y treatment.
    exact_expected_result: >-
      Both streams must have E[X]=E[Y]=1/4. At eta=0 the diffuse stream must
      have delta_kappa=0, delta_ratio=0, and gamma_s=1/3; the concentrated
      stream must have delta_kappa=+1/3, delta_ratio=-1/3, and gamma_s=0. Under
      eta=-4,0,4 the kappa slopes must be
      0.3265707003291663, 1/3, 0.34009596633750033 and the ratio slopes must be
      -0.34009596633750033, -1/3, -0.3265707003291663.
    falsification_rule: >-
      Any seed-regeneration mismatch, decode mismatch, unequal match mean,
      failure to recover the planted bridge slopes, or failure to separate
      Boolean gamma by exactly 1/3 falsifies the inference apparatus before
      any curve or selector is built.
    why_cheapest: >-
      It uses deterministic integer/root records only and directly attacks the
      conversion from match expectation to restart success. It is cheaper and
      more discriminating than curve generation, selector construction, or
      treatment.
    execution_status: not_run

  required_revision_gate:
    - Freeze explicit coverage-cluster-rank and matched-mean-cluster-rank seed domains.
    - Reconcile treatment root sharing with model fields and recompile its operation schedule.
    - Replace aggregate local-traffic assertions with compiler-checkable component formulas.
    - Specify and charge an exact planted-gamma Bernoulli sampler or exact rational replacement.
    - Reconcile CTRL-EXACT-QUOTIENT L=M with the schedule's L=U rows.
    - Add and charge every canonical fixture on-curve query and its field and traffic costs.
    - Preserve every passing threshold, bracket, estimator, bridge, asymptotic, proof, Pareto, novelty, and claim-ceiling field unchanged.
    - Snapshot a new immutable proposal version and obtain another distinct review-adversarial verdict before experiment design.

  limitations:
    - >-
      This report validates a proposal snapshot, not an experiment or run.
      There are no run IDs, raw curve samples, measured gamma_s values,
      recovered scalars, throughput measurements, or empirical costs.
    - >-
      Pseudo-true roots were independently recomputed at high precision and
      shown to lie inside the frozen rectangles. This is not a replacement for
      the future 512-bit directed-rounding interval certificate required by the
      proposal.
    - >-
      Exact integer row sums validate only the rows that exist. They cannot
      validate omitted component formulas, ambiguous seed semantics, or an
      uncharged mandatory check.
    - >-
      The corpus boundary is lineage-only. No external novelty or absence claim
      was made or validated.
    - >-
      Even a corrected and later executed 18--30-bit design would remain toy-
      scale evidence on one frozen family and could not establish an
      asymptotic or crypto-scale ECDLP claim.

