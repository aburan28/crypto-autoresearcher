objective: >-
  Interpret H-XOR-YIELD in light of BATCH-ef31ab corrected results. Corrected Δ = 0.01202
  (95% CI: [0.00593, 0.01811], t(7)=4.665, p=0.0023) is statistically significant, but
  Y_A = Y_B exactly across all 40 cells, indicating the x-oracle provides cost reduction
  via MITM filtering (fewer field operations), not yield improvement over exhaustive search.
  The comparison Y_B vs Y_C (oracle vs random) is a strawman baseline; the scientifically
  relevant comparison is Y_B vs Y_A. H-XOR-YIELD in its original formulation (oracle improves
  yield) is NOT SUPPORTED. The correct interpretation is that MITM with x-oracle finds the
  same relations as exhaustive search but faster. Decide whether to weaken H-XOR-YIELD or
  reframe as a cost-reduction result.
