batch:
  id: BATCH-b3f591
  goal_id: GOAL-ECDLP-001
  question_ids:
    - RQ-ECDLP-002
  title: >-
    Successor analysis batch — halving-query equivalence, KN promotions,
    H-PSEUDO o(1)-branch decision, and x-oracle-alone experiment design
  objective: >-
    Execute the single successor analysis action named in DEC-20260806-08b9ed
    (the exact_next_action of the BATCH-e0ccb2 independent-review audit):
    (A) re-derive the doubling-oracle to halving-query equivalence in a
    standalone record with the corrected duplication formula
    (x^4-2a.x^2+a^2-8b.x)/(4(x^3+a.x+b)) and replace the printed-wrong closed
    form from TASK-20260505-005; (B) promote the halving-query equivalence and
    the exact-arithmetic BKK corrections (K*=2000 not 2001; m=4 cell 125 not
    126) into KN-FIND candidate records and draft the KN-FIND-9d2f56 wording
    repair to match the corrected H-PSEUDO orientation; (C) decide the fate of
    the o(1) branch of the corrected H-PSEUDO biconditional as the first step
    of the IDEA-20260805-62ef74 re-formalization dispatch; (D) design the first
    x-oracle-alone toy-scale discrimination experiment under the EV-SEMAEV
    pipeline, reconciled with the corrected MT-corridor record on main
    (DEC-20260806-26c0e8, DEC-20260806-bba4bf). NO toy computation of the
    discrimination run happens in this batch unless a producer validates a
    derivation with a local arithmetic check that requires no committed run
    record; the default is analysis + design only. This batch takes analysis
    first — the experiment design is only frozen after independent review.

  status: ready_for_dispatch
  claim_ceiling: >-
    Analysis and experiment-design only. This batch asserts no cryptanalytic
    capability and moves no asymptotic exponent. The standalone halving-query
    equivalence is a derivation record (correctness of an algebraic identity is
    checkable by hand and by the review); the H-PSEUDO o(1) branch decision is
    a formalization/dispatch decision, not a measured result; the knowledge
    promotions are candidates that ride a ledger decision; the experiment
    design is a contract under review, not a run. Any claim that a halving
    oracle equals an x-coordinate oracle must be stated in the record exactly as
    the reviewers verified it (one-query recovery of x(Q) from O_D([1/2]Q)), and
    no claim about the x-oracle-alone question being sub-rho-enabling OR
    disabling may be asserted here — it is open and the experiment design is
    the pre-registration that will eventually test it.

