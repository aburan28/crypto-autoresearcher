    - id: OBJ-03
      severity: S1-blocking-for-the-O1-claim
      title: >-
        The overhead bound is unmeasurable as specified (static count), is satisfied by a
        Theta(log N) quantity on exactly the tested sizes, and the inference drawn from
        growth is backwards.
      targets: experiments/EXP-GGM-001/specification.yaml implementation_requirements.simulator_construction_method; analysis_methodology.overhead_growth_check; ledger/hypotheses/H-GGM-001.yaml falsification_conditions[4]
      detail_ref: objections.md#obj-03
