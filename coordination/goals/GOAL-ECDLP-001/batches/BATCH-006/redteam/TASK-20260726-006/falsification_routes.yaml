  claim_under_review: >-
    That a SIMULABLE verdict from EXP-GGM-001 is a scale-independent mathematical
    closure at exponent 1/2 (via the Shoup / Corrigan-Gibbs-Kogan generic lower
    bound, KN-TECH-005) rather than toy-tier evidence, and that a NON-SIMULABLE
    verdict is a meaningful non-generic signal.
