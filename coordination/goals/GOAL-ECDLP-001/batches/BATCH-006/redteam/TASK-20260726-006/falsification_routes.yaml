      severity: S1-blocking
      title: >-
        The tier escalation is forbidden by docs/claims-and-verification.md and CI, and
        scale_independence_note pre-commits the analyst to making it.
      targets: experiments/EXP-GGM-001/specification.yaml claim_tier_basis; analysis_methodology.scale_independence_note
