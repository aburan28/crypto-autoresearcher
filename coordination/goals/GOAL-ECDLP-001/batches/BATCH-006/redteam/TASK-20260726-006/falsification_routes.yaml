        presupposes cannot exist (Rice), leaving eight hand-coded branches.
      targets: experiments/EXP-GGM-001/specification.yaml success_criterion; analysis_methodology.control_gate; ledger/hypotheses/H-GGM-001.yaml assumptions[2]
      detail_ref: objections.md#obj-04
    - id: OBJ-05
      severity: S2-major
      title: >-
        The discrete-log control's expected_witness is self-refuting (the DLP answer is
        relabeling-invariant), so the primary soundness control cannot pass the gate.
      targets: experiments/EXP-GGM-001/specification.yaml controls[discrete_log].expected_witness
      detail_ref: objections.md#obj-05
    - id: OBJ-06
      severity: S2-major
      title: >-
        Transfer step: eight named gaps between the oracle specification, the technique
        family, and prime-field ECDLP; plus Shoup/CGK model conflation.
      targets: experiments/EXP-GGM-001/specification.yaml claim_tier_basis; ledger/hypotheses/H-GGM-001.yaml statement
      detail_ref: objections.md#obj-06
    - id: OBJ-07
      severity: S2-major
      title: >-
        Jet and elliptic-net frozen specifications reproduce the ambiguity their own
        confounder names; expected_basis disambiguates differently from the frozen text.
      targets: experiments/EXP-GGM-001/specification.yaml inputs.augmented_oracles[jet_oracle,elliptic_net_oracle]; ledger/hypotheses/H-GGM-001.yaml interpretation_limits[5]
      detail_ref: objections.md#obj-07
    - id: OBJ-08
      severity: S2-major
      title: >-
        The incidence oracle's verdict is determined by the factor base's provenance,
        which the specification omits; and "accessible" is conflated with "accessible in
        O(1)".
      targets: experiments/EXP-GGM-001/specification.yaml inputs.augmented_oracles[incidence_oracle]
      detail_ref: objections.md#obj-08
    - id: OBJ-09
      severity: S2-major
      title: >-
        The verdict asymmetry is an epistemic ratchet: the confirming branch gets a
        stronger tier than the disconfirming branch of the same module, and no outcome
        is costly to the program.
      targets: ledger/hypotheses/H-GGM-001.yaml interpretation_limits[1,2]; experiments/EXP-GGM-001/specification.yaml claim_tier_basis
      detail_ref: objections.md#obj-09
    - id: OBJ-10
      severity: S2-major
      title: >-
        The claimed H-STR-002 contextualization is a category error (query cost vs
        linear-algebra cost) and the asserting sentence is internally contradictory.
      targets: ledger/decisions/DEC-20260726-006.yaml next_actions[2]; ledger/hypotheses/H-STR-002.yaml predictions[structured_solve_cost_vs_wiedemann]
      detail_ref: objections.md#obj-10
    - id: OBJ-11
      severity: S3-moderate
      title: >-
        Witness "certificates" are outside the harness certificate enum, and the required
        verifier independence is unachievable within one Executor task.
      targets: experiments/EXP-GGM-001/specification.yaml implementation_requirements.witness_verification_method
      detail_ref: objections.md#obj-11
    - id: OBJ-12
      severity: S3-moderate
      title: >-
        "Generic-model-indistinguishable encoding pair" is not well defined on a fixed
        toy curve; the witness and its 3-seed replication are trivial.
      targets: ledger/hypotheses/H-GGM-001.yaml mechanism; experiments/EXP-GGM-001/specification.yaml replication.replication_note
      detail_ref: objections.md#obj-12
    - id: OBJ-13
      severity: S3-moderate
      title: >-
        expected_verdict and expected_basis are pre-loaded instructions to the same
        Executor who writes and runs the deterministic module; no blinding, no held-out
        subject.
      targets: experiments/EXP-GGM-001/specification.yaml inputs.augmented_oracles[*].expected_verdict, expected_basis
      detail_ref: objections.md#obj-13
    - id: OBJ-14
      severity: S4-minor
      title: Design-time model policy fallback has authorization_ref null.
      targets: experiments/EXP-GGM-001/specification.yaml inference_receipt
      detail_ref: objections.md#obj-14
    - id: OBJ-15
      severity: S4-minor
      title: >-
        Witness-verification curves are unconstrained in group order; KN-TECH-005 is
        stated in the largest prime factor p, not N.
      targets: experiments/EXP-GGM-001/specification.yaml independent_variables.witness_verification_curve
      detail_ref: objections.md#obj-15

falsification_routes:
  purpose: >-
    For each augmented oracle and each control, the cheapest concrete check that would
    show the specification's expected_verdict (or expected role) is wrong. All routes are
    read-only-to-design proposals; nothing here was executed. Costs are stated as
    implementer effort, not measured timings.

  augmented_oracles:

    - oracle: jet_oracle
      expected_verdict_in_spec: SIMULABLE
      spec_quote: >-
        "Query type (P, Q) -> (P+Q, eps*(P+Q)) in F_p[eps]/eps^2. Returns the zeroth-order
        sum and the first-order (dual-number / jet) part of the addition law."
      why_expected_verdict_may_be_wrong: >-
        The frozen string is the encoding-dependent reading (return a concrete element of
        F_p[eps]/eps^2), while the expected_basis argues the universal-identity reading
        ("the eps-block is implied by the Zariski tangent space"). Under the frozen
        reading the eps-part is coordinate data, exactly like the encoding control's x(P),
        so the correct verdict is NON-SIMULABLE.
      cheapest_check:
        name: weierstrass-twist invariance test
        procedure: >-
          Fix one 8-bit curve E/F_p. Form the twist E' via (x,y) -> (u^2 x, u^3 y) for a
          unit u, which is a group isomorphism, so the abstract group data is identical.
          Evaluate the frozen jet oracle on the corresponding point pairs on E and on E'
          and compare the returned eps-coefficients.
        cost: one 8-bit curve, ~20 lines, no simulability machinery
      falsifying_observation: >-
        eps-coefficients differ across the twist while the abstract group pair is
        identical => the frozen jet oracle returns model-dependent data => NON-SIMULABLE,
        contradicting expected_verdict SIMULABLE.
      confirming_observation_and_its_price: >-
        If the eps-coefficients agree across every isomorphism, the oracle returns nothing
        beyond abstract group data, so the SIMULABLE verdict is correct but vacuous
        (C = 0, no information transmitted) and closes nothing that the group-operation
        oracle did not already close.
      secondary_check: >-
        Demand the module print, for the SIMULABLE verdict, the explicit expression of the
        eps-part in terms of group-oracle results. If it cannot, the verdict was asserted,
        not constructed.

    - oracle: elliptic_net_oracle
      expected_verdict_in_spec: SIMULABLE
      spec_quote: >-
        "Query type (a, b) -> W(a, b), the elliptic-net (Somos) value at index vector
        (a, b). Returns the net value satisfying the Somos recurrence on the curve."
      why_expected_verdict_may_be_wrong: >-
        (i) W(a,b) is a division-polynomial-derived field element depending on the
        Weierstrass model and on the net normalization, hence encoding data;
        (ii) the expected_basis ("Somos identities are universal ... encode only the group
        law, not k") argues that the data is useless for recovering k, which is a
        different proposition from producible by a simulator;
        (iii) the zero set {(a,b) : W(a,b) = 0} = {(a,b) : aP + bQ = O} makes the oracle a
        free zero-test whose generic evaluation costs Theta(log a + log b) group ops,
        already exceeding C <= 10 for modest (a,b) at 16 bits.
      cheapest_check:
        name: normalization / model-dependence test plus a query-cost count
        procedure: >-
          (a) On one 8-bit curve, compute the net from two admissible initial-value
          normalizations (or on a curve and its u-twist) and compare W(a,b) for the same
          (a,b). (b) Independently, with no code: state the minimal number of group
          operations a generic simulator needs to decide W(a,b) = 0 for a,b < N, namely an
          addition chain of length >= log2(max(a,b)).
      falsifying_observation: >-
        (a) W differs under a normalization or model change with identical group data =>
        NON-SIMULABLE. (b) The counted addition-chain length exceeds 10 for some (a,b)
        inside the tested toy range => the C <= 10 target fails even under the most
        generous reading.
      unspecified_input_that_changes_the_verdict: >-
        The specification never bounds (a,b). If (a,b) range over [0,N) the oracle is a
        full free zero-test; if they are bounded by a constant it is trivial. Freeze the
        range before any verdict.

    - oracle: incidence_oracle
      expected_verdict_in_spec: SIMULABLE
      spec_quote: >-
        "Decompositions are computed via group operations (summing factor-base points and
        comparing to R); the oracle reports structure accessible to a generic algorithm."
      why_expected_verdict_may_be_wrong: >-
        "Accessible" is not "accessible in O(1)". With B = ceil(sqrt(N)) and m = 2 a
        generic simulator must form Theta(B^2) sums (Theta(B log B) with sorted equality
        tests), unbounded in N. Separately, the verdict flips entirely on whether the
        factor base consists of GGM-accessible labels with known exponent vectors or of
        externally supplied points with unknown discrete logs; the specification does not
        say.
      cheapest_check:
        name: instrumented decomposition-sweep count vs B
        procedure: >-
          Instrument the group object and count actual group operations performed by the
          simulator answering one incidence query at bits 8, 12, 16, 24, with
          B = ceil(sqrt(N)) and m = 2, 3. Plot count against B.
        cost: one instrumented counter; seconds of runtime; still toy tier
      falsifying_observation: >-
        Any measured count above 10, or any growth with B, falsifies SIMULABLE under the
        specification's own C <= 10 criterion. At 16 bits the naive count is ~65,000
        pair-sums.
      structural_falsification: >-
        Ask the module to print the predicate that distinguishes the incidence oracle from
        the discrete-log control. Both answers are functions of the abstract group data
        alone; both are expensive to compute generically. If the printed distinction is
        the oracle's name or a hard-coded branch, the SIMULABLE verdict is an artifact.
      scope_falsification: >-
        Even a correct SIMULABLE verdict would not bear on ECDLP-IDEA-001/012: the known
        prime-field obstruction is that relation search costs more than rho, and this
        oracle supplies relations free.

    - oracle: endomorphism_oracle
      expected_verdict_in_spec: SIMULABLE
      spec_quote: >-
        "The endomorphism is public and computable from the curve parameters (part of the
        generic model's public setup), hence simulable."
      why_expected_verdict_may_be_wrong: >-
        Under the specification's own stated method (express the answer as a function of
        group-operation results), the simulator must compute [lambda]P where
        lambda^2 + lambda + 1 = 0 mod N, costing an addition chain of length
        Theta(log N) -- not O(1), and above C = 10 well inside the toy range. The oracle
        IS O(1)-simulable, but only under the lazy-encoding simulator definition (answer
        by exponent-vector bookkeeping, zero group-oracle queries) that the specification
        never states. So the expected verdict is right for a reason the protocol cannot
        express, and wrong under the reason it does express.
      cheapest_check:
        name: C versus log2 N slope, extended inside the toy tier
        procedure: >-
          Replace the static count with a dynamic instrumented count and extend the sweep
          to --bits 8,12,16,20,24,28,32 (all <= 32, so claim_tier is unchanged). Fit the
          measured C against log2 N.
        cost: one counter plus four extra bit sizes; negligible runtime
      falsifying_observation: >-
        A nonzero log2 N slope, or C > 10 at 20-24 bits, falsifies the O(1) claim under
        the specification's criterion. The predicted pattern for a balanced GLV root is
        C ~ 5, 7, 9 at 8, 12, 16 bits -- all under the C <= 10 target and all on a
        straight Theta(log N) line. This is precisely the case where C looks constant at
        toy scale and is not.
      circularity_check: >-
        If the module reports C = 1 for this oracle, inspect whether it counted a
        scalar_mult or a phi call as a single group operation. That is the oracle
        simulating itself and must invalidate the verdict.
      cheapest_alternative_that_supersedes_the_whole_subject: >-
        phi acts on the prime-order subgroup as [lambda] for a publicly computable lambda.
        The known payoff of a public automorphism group of order r is a sqrt(r) = sqrt(3)
        speedup of rho over equivalence classes, exponent unchanged. That one-line
        statement answers the endomorphism question with more precision than any verdict
        label and costs nothing.

  controls:

    - control: pure_generic
      expected_in_spec: "SIMULABLE, C = 1"
      role_quote: >-
        "Negative false-positive control: the test must return SIMULABLE (trivially
        simulable, C = 1). A NON-SIMULABLE verdict here is a false positive and falsifies
        the test."
      cheapest_check:
        name: semantics-preserving mutation
        procedure: >-
          Resubmit the same oracle under a different name with the procedure written as
          "return (P + Q) + O, where O is the identity", and again as "compute P + Q,
          discard, recompute P + Q, return".
        cost: two extra specification stanzas
      falsifying_observation: >-
        Verdict flips to NON-SIMULABLE, or C changes, under a semantics-preserving
        rewrite => the module is pattern-matching on specification surface text, not
        analysing semantics, and the entire control gate is void.

    - control: discrete_log
      expected_in_spec: "NON-SIMULABLE with an encoding-pair witness"
      role_quote: >-
        "Any two encodings E_1, E_2 representing the same abstract group element
        relationship but requiring different k."
      cheapest_check:
        name: demand and independently re-check the witness
        procedure: >-
          Read the emitted witness JSON. Verify the two claims separately: (i) that E_1
          and E_2 present the same abstract group with the same abstract pair (P, Q);
          (ii) that the returned k values differ.
        cost: reading one JSON object
      falsifying_observation: >-
        No such witness can exist -- the discrete log is invariant under relabeling of the
        encoding, so (i) and (ii) cannot both hold. Therefore either no witness is emitted
        (=> alternative_outcome => this control is inconclusive => under control_gate no
        augmented verdict may be reported), or a witness is emitted and fails check (i)
        (=> verify_witness is unsound). Either branch falsifies the protocol as written,
        on paper, before any code is run.
      required_repair: >-
        Restate the DLP control's non-simulability as a query-cost fact (Omega(sqrt(p))
        group operations, Shoup) and drop the encoding-pair witness requirement for it.

    - control: public_curve
      expected_in_spec: "SIMULABLE, C = 0"
      role_quote: >-
        "Negative false-positive control: the test must return SIMULABLE (C = 0, public
        data is part of the generic model's setup, not group-encoding data)."
      cheapest_check:
        name: secret-smuggling mutation
        procedure: >-
          Resubmit as "Query = () -> (a, b, p, N, k)" where k is the target discrete log,
          i.e. a zero-arity query whose payload includes secret data.
        cost: one line
      falsifying_observation: >-
        Still SIMULABLE with C = 0 => the module is classifying by input arity or by the
        absence of group-element arguments, not by the content of the answer. That single
        observation invalidates every SIMULABLE verdict the module produces, because
        SIMULABLE is exactly the branch the tier escalation rests on.

    - control: encoding
      expected_in_spec: "NON-SIMULABLE with an encoding-pair witness"
      role_quote: >-
        "Positive correctness control: the test must return NON-SIMULABLE, confirming it
        catches encoding-dependent oracles."
      cheapest_check:
        name: paired sensitivity/specificity mutation
        procedure: >-
          Resubmit two variants: (a) "P -> x(P) mod 2" (one bit of encoding data);
          (b) "P -> 0 * x(P)" (mentions the x-coordinate, returns a constant).
        cost: two lines
      falsifying_observation: >-
        (a) classified SIMULABLE => the module misses low-bandwidth encoding leakage.
        (b) classified NON-SIMULABLE => the module keys on the token "x-coordinate" rather
        than on the answer's dependence on the encoding. Either outcome voids the
        encoding control's certification role.
      witness_triviality_check: >-
        Inspect the emitted witness. If it is "two arbitrary injections of Z_N into the
        point set", note that such a pair exists for every coordinate-returning oracle by
        construction, so witness_checkability: true carries no information and its 3-seed
        replication replicates a triviality.

  cross_cutting_routes:
    - id: XR-1
      name: definition dilemma, checkable on paper
      procedure: >-
        Before any execution, write the module's operative simulability predicate as one
        sentence and apply it to all eight subjects by hand. Reading A (relabeling
        invariance) classifies discrete_log as SIMULABLE, which the specification's own
        falsification_criterion calls unsoundness. Reading B (bounded group-op count)
        classifies jet, elliptic_net, incidence and endomorphism as NON-SIMULABLE,
        contradicting all four expected_verdicts.
      falsifying_observation: >-
        If no single sentence reproduces the specification's eight expected outcomes, the
        module must be applying an unstated per-subject criterion, and no verdict it emits
        is a mathematical result.
      cost: zero; pen and paper
    - id: XR-2
      name: static-count vacuity check
      procedure: >-
        Compare the reported C at 8, 12 and 16 bits for every SIMULABLE subject.
      falsifying_observation: >-
        Identical integers at all three sizes for every subject confirm that C is a static
        source-text count that cannot vary with N, so analysis_methodology.
        overhead_growth_check has zero discriminating power and the N-independence claim
        rests on a check that cannot fail.
      cost: reading three numbers from raw-result.json
    - id: XR-3
      name: blind subject
      procedure: >-
        Add two oracle specifications authored outside the specifying session whose
        correct verdicts are not printed in the specification, one genuinely simulable and
        one genuinely not, and require the Executor to report verdicts before the key is
        revealed.
      falsifying_observation: >-
        Any misclassification of a blind subject falsifies the module's generality far
        more strongly than the four pre-announced controls can confirm it.
      cost: two specification stanzas, no new machinery

  required_controls_before_approval:
    - "Freeze one simulability definition (lazy-encoding simulator; overhead = group-oracle queries made by the simulator) and re-derive all eight expected verdicts under it. (OBJ-01, OBJ-03c)"
    - "Replace the static overhead count with a dynamic instrumented count; extend the sweep to --bits 8,12,16,20,24,28,32 (all still toy) and fit C against log2 N and against B. (OBJ-03a, OBJ-03b)"
    - "Add the four control mutations: (P+Q)+O; () -> (a,b,p,N,k); P -> x(P) mod 2; P -> 0*x(P). (OBJ-04)"
    - "Repair or delete controls[discrete_log].expected_witness; restate DLP non-simulability as a query-cost fact. (OBJ-05)"
    - "Disambiguate the jet and elliptic-net frozen specifications to exactly one reading each and pre-register the twist test as discriminator. (OBJ-07)"
    - "State the incidence oracle's factor-base provenance and mark the verdict conditional on it. (OBJ-08)"
    - "Delete analysis_methodology.scale_independence_note and rewrite claim_tier_basis to the ceiling below. (OBJ-02)"
    - "Add at least two blind subjects authored outside the specifying session. (OBJ-13)"

  claim_tier_and_proof_status_ceiling:
    applies_to: >-
      Any evidence record that a future execution of EXP-GGM-001 could support, at any
      verdict, for any subject.
    claim_tier_ceiling: toy
    claim_tier_rationale: >-
      docs/claims-and-verification.md derives the tier mechanically from run parameters
      ("toy: max field bit size <= 32"); the command_template is --bits 8,12,16.
      tools/validate_ledger.py check_cross_refs errors when declared > max(run_tiers).
      medium and crypto are unreachable by this protocol at any verdict, and "theoretical"
      is not a claim_tier value (TIER_ORDER = {toy, medium, crypto}). claim_tier and
      proof_status are different axes; a record may be claim_tier toy AND
      proof_status derivation simultaneously, and that is the correct target here.
    proof_status_default_ceiling: empirical_only
    proof_status_upgrade_to_derivation_requires_all_of:
      - "A human-readable simulator-construction note archived as a repository artifact and listed in proof_refs, containing the simulator, its correctness argument, and an explicit query-count bound q(N), checkable by an independent reader step by step."
      - "Independent non-originating review of that note under AGENTS.md rule 12, carrying the model-policy fallback non-equivalence as a limitation."
      - "The note written under the single frozen simulability definition, with q(N) dynamically measured and fitted over bits 8..32, not statically counted."
      - "A scope sentence confined to the exact frozen oracle string and its specification hash."
    proof_status_certificate: unreachable
    proof_status_certificate_rationale: >-
      docs/claims-and-verification.md and tools/validate_ledger.py admit only
      certificate.kind in {discrete_log, decomposition, none}; harness/runner.py has no
      verifier for a simulability witness, so witness_checkability would be self-reported
      by the module under test.
    mandatory_scope_sentence_template: >-
      For algorithms in Shoup's encoding-based generic group model that are additionally
      given oracle access to the oracle specification frozen at
      experiments/EXP-GGM-001/specification.yaml sha256 <hash>, the discrete-log query
      cost is Omega(sqrt(p)/q), where p is the largest prime factor of the group order and
      q is the measured simulator query overhead. This is a statement about that model and
      that oracle string. It is not a statement about the corresponding informal technique
      family, about any concrete algorithm, or about prime-field ECDLP (KN-OPEN-001 is
      untouched).
    forbidden_phrasings:
      - "closes the candidate family / closes all dual-number candidates"
      - "valid at all scales"
      - "closure at exponent 1/2 without the model and oracle qualifiers"
      - "proved"
      - "any claim_tier above toy"
      - "any statement that a NON-SIMULABLE verdict is evidence of a sub-birthday attack"

  baseline_comparison:
    end_to_end_cost_path_exists: false
    note: >-
      EXP-GGM-001 constructs no attack, so no verdict can be converted into a measured
      cost and no comparison table can honestly be produced from it. Recording that
      absence is the comparison. No verdict may appear in a synthesis sentence of the form
      "beats / does not beat rho".
    pollard_rho: "~sqrt(pi*N/4) group ops on the tested regime: ~13 at 8 bits, ~200 at 16 bits; O(1) memory (KN-TECH-001)."
    bsgs: "~2*sqrt(N) ops with ~sqrt(N) memory: ~32 at 8 bits, ~512 at 16 bits; the memory axis this package never touches."
    closest_specialized_baselines:
      endomorphism: "rho over phi-equivalence classes: sqrt(r) = sqrt(3) ~ 1.73x speedup, exponent unchanged (Wiener-Zuccherato; GLV; Duursma-Gaudry-Morain). Already sharper than any verdict label, and supersedes the OBJ-10 link."
      elliptic_nets: "Stange's net algorithm computes Tate pairings; pairing transfer (MOV / Frey-Ruck) is the canonical non-generic attack, inapplicable at large embedding degree."
      incidence: "Semaev summation polynomials; Gaudry / Diem index calculus. The known prime-field obstruction is that relation search costs more than rho -- exactly what this oracle assumes away."

  counterexample_or_mutation: >-
    Cheapest single discriminating mutation: resubmit the public_curve control as
    "() -> (a, b, p, N, k)" with k the target discrete log. If the module still returns
    SIMULABLE with C = 0, it classifies by input arity rather than by answer content, and
    every SIMULABLE verdict it produces -- the sole branch the tier escalation rests on --
    is void. One line, no new machinery.
    Cheapest concrete N-independence counterexample: the endomorphism simulator's group-op
    count for [lambda]P on a GLV j=0 curve is ~5, 7, 9 at 8, 12, 16 bits -- every point
    under the C <= 10 target, on a straight Theta(log N) line, crossing 10 near 20 bits and
    reaching ~128 at P-256.

  narrowest_supported_statement: >-
    H-GGM-001 and EXP-GGM-001 v1 propose a screen whose central term, "simulable", is not
    defined to a single meaning; under the only reading that passes the specification's own
    control gate, all four augmented oracles are predicted NON-SIMULABLE, which the package
    itself declares to be no breakthrough. No claim above claim_tier toy,
    proof_status empirical_only is supportable from this package in its current form.
    Nothing here asserts that GGM simulability screening is unsound in general, that any of
    the four oracles is in fact non-simulable, or anything at all about prime-field ECDLP.

  blocking_finding:
    blocks_execution_of_specification_v1: true
    blocking_objection: OBJ-02
    reason: >-
      analysis_methodology.scale_independence_note is a standing instruction frozen into
      the protocol that the analyst must assert a supra-toy tier and must not present a
      SIMULABLE verdict as toy-tier evidence. That contradicts
      docs/claims-and-verification.md and inverts AGENTS.md rule 7, and it takes effect
      regardless of whether the verdicts are correct.
    does_not_block: >-
      The research direction, or running a small Python module on toy curves. The screen is
      cheap and a corrected version is worth having.
    minimal_remedy: >-
      A superseding version 2 specification that (i) deletes scale_independence_note and
      rewrites claim_tier_basis to the ceiling above, (ii) freezes one simulability
      definition, and (iii) replaces the static overhead count with a dynamic one over
      bits 8..32. With those three changes plus the remaining required controls, execution
      is unobjectionable at the stated ceiling.
    current_record_state_observed: >-
      experiments/EXP-GGM-001/specification.yaml is status review_required with
      approved_by null, and DEC-20260726-007 already states "Execution of EXP-GGM-001 is
      not authorized." This report changes no status; disposition is the Coordinator's.

  next_concrete_action: >-
    Do not approve specification v1. Commission a version 2 whose first edit is a single
    frozen definition of "simulable" in lazy-encoding-simulator form, with the eight
    expected verdicts re-derived by hand under it and recorded in the specification before
    any implementation is commissioned. That one edit resolves OBJ-01, forces the OBJ-03
    overhead metric to be restated as simulator group-oracle queries, and exposes on paper
    -- at zero compute cost -- whether the experiment has any subject left that it can
    legitimately classify SIMULABLE.

