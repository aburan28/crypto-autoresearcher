    - "A finite or infinite K* here says nothing about whether multi-target index-calculus amortization is possible with a properly sized factor base. The controlling references remain S*T^2 = Omega~(N) (KN-LIT-013, KN-TECH-005) and the Shoup bound."
    - "The 34 verified decompositions I report are a re-derivation from committed run records, not a new measurement, and they concern only instances with N <= 2377."
