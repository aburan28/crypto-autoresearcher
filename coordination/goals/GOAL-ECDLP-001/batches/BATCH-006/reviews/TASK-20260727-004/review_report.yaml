  question_findings:

    - id: Q1
      question: "Is the design decidable with a genuinely possible negative outcome? Verify SC3/SC4 follow arithmetically from SC1/SC2."
      finding: CONFIRMED_WITH_A_STRONGER_RESULT
      detail: >-
        The spec's empirical_content_disclosure is correct and is the single best feature
        of this document: SC3 and SC4 are arithmetic consequences of SC1 plus committed
        numbers. I verified the algebra independently. charged_ratio_lower_bound =
        T_attempt * sqrt(N) / |S|. Committed T_attempt spans 30110-35617 group-op
        equivalents (1.18x total spread, EXP-IC-001/analysis.md 36-bit table) and
        Groebner wall time spans 0.038-0.044 s across ALL 34 instances (1.15x, recomputed
        from the 340 fixed-mode raw-result.json files). |S| <= 392 by pure combinatorics.
        sqrt(N) spans 2 to 183757 across the instance set. Hence log(charged_ratio)
        tracks log sqrt(N) with a residual of at most log(1.18 * 2), Spearman >= 0.9 is
        forced, and the required 10x rise is exceeded by more than three orders of
        magnitude. SC3 is likewise forced: T_attempt * N / |S| >= 32000 * N / 392 = 76*N
        > sqrt(N) for every N >= 1.
      but: >-
        The disclosure understates the problem. SC2's second clause
        (p_dec_target_set_empirical = 0 at every instance with N >= 1e9) is not a
        measurement either: it recomputes a fact already recorded in the committed
        EXP-IC-001 run records. And falsifier F2 is logically the SAME EVENT as a CTRL-G
        disagreement, which stopping rule 4 routes to "return the run to the Coordinator
        as a source-integrity failure rather than continuing". The design therefore
        forbids reporting its only genuinely empirical falsifier as a falsification. The
        single residual gap that keeps F2 technically reachable is an incompleteness bug
        in the s3_eval pre-filter (see Q2), which would be an instrumentation finding,
        not the "the confound claim is wrong" outcome the spec assigns to F2.
      residual_genuinely_possible_negative_outcomes:
        - "SC1 second clause (max |S| at 8-bit vs 36-bit within 2x) can fail for a reason unrelated to the claim: at 8-bit p is 137, 163 and 241, so #E is roughly 115-273 and |S| <= #E - 1, while at 36-bit |S| is near 392. The ratio sits within a few percent of the 2x threshold. A pigeonhole failure would sink an ALL-FOUR success criterion for no scientific reason."
        - "A2 (CTRL-C charged/uncharged disagreement > 2x at B' = ceil(sqrt(N))) genuinely can fire and routes correctly to INCONCLUSIVE."
      verdict_contribution: >-
        Decidable, yes. But at the four instances that actually carry DEC-20260726-005 the
        outcome is determined by committed data plus arithmetic, and the design has no
        reachable falsifier there. That must be stated in the record before execution, not
        after.

    - id: Q2
      question: "Is the reachable-set bound 4*(C(14,2)+14) = 420 right?"
      finding: VALID_UPPER_BOUND_BUT_NOT_TIGHT
      code_read: harness/semaev.py::_find_decomposition (lines 147-171 at this commit)
      what_the_code_actually_does: >-
        for i, v1 in enumerate(V): for v2 in V[i:]  -> unordered pairs including i == j,
        so C(B,2) + B = 105 pairs at B = 14. Then a s3_eval(a,b,v1,v2,xR,p) != 0 filter,
        then E.lift_x on each, then for sA in (A, negate(A)): for sB in (B, negate(B)):
        if E.add(sA,sB) == R. So the sign search is over 4 combinations per pair and the
        target is compared as a full point. The spec's set
        S = {s1*A_i + s2*A_j : i <= j, s1,s2 in {+1,-1}} is the correct reachable set,
        and 4*(C(B,2)+B) = 420 is a correct upper bound that can never be exceeded.
      correction: >-
        420 is not tight. For the 14 diagonal pairs i = j the four sign combinations give
        {2A_i, O, O, -2A_i}: at most 2 distinct non-identity points, not 4, and the spec's
        own enumeration procedure says to drop the point at infinity. The tight
        combinatorial maximum is 4*C(14,2) + 2*14 = 364 + 28 = 392. Any measured |S| in
        [393, 420] is necessarily an implementation defect that the spec's invalidation
        rule ("a measured |S| exceeding 420 is an implementation defect") would let
        through. Set the invalidation threshold to 392.
      direction_of_the_error: >-
        420 > 392 overstates the reachable set, hence overstates the yield bound |S|/N by
        at most 7.1% and understates the charged-cost lower bound by at most 6.7%. That
        is the conservative direction: it biases the test AGAINST the confound claim,
        exactly as the spec asserts. The error is real but immaterial against the 76x and
        1e4x effects at stake. Confirmed, not refuted.
      unstated_dependency: >-
        The spec's counting_derivation never mentions the s3_eval pre-filter. The bound is
        still sound because S3(v1,v2,x(R)) = 0 is a NECESSARY condition for some sign
        combination to satisfy s1*A_i + s2*A_j = +/-R (Semaev's S3 vanishes exactly when
        points with those three x-coordinates sum to O, and S is closed under global
        negation), so the filter cannot reject a true hit. But the spec asserts the code
        path "tests both sign choices" without recording the filter or its completeness,
        and no control tests it. If s3_eval were incomplete, the harness's effective
        reachable set would be a proper subset of S, which makes the true charged cost
        LARGER - again the conservative direction, but it is also the only route by which
        F2 could fire.
      second_binding_constraint_the_spec_omits: >-
        |S| <= min(392, #E - 1). At 8-bit (p = 137, 163, 241) the curve-order term binds,
        not 392. This is what puts SC1's 2x clause at risk.

    - id: Q3
      question: "Is the EXP-IC-001 v3 '4/4' an empirical finding or an arithmetic consequence of its own conditioning?"
      finding: ARITHMETIC_CONSEQUENCE_CONFIRMED_AND_WORSE_THAN_ALLEGED
      adjudication: >-
        The Coordinator's allegation is correct, and understated. Let A = {sqrt(N) >
        T_desc_gops} be the v3 conditioning event and B = {K* finite}. From
        EXP-IC-001/specification.yaml metrics.crossover_K_star, K* is finite exactly when
        T_desc_gops + T_verify < sqrt(N) with T_verify = 2 group operations frozen, so
        B = {sqrt(N) > T_desc_gops + 2}. Therefore B is a subset of A and A \ B =
        {T_desc_gops < sqrt(N) <= T_desc_gops + 2}: a window two group operations wide
        against a T_desc_gops of roughly 3.2e4. The v3 criterion asks for |B|/|A| >= 2/3,
        i.e. it conditions on (a 2-operation dilation of) the outcome variable itself and
        then reports the outcome rate. That is selection on the dependent variable, and
        the reported ratio is 1 whenever no instance lands in the 2-wide window.
      quantification_from_committed_data: >-
        The four conditioning-set members have margins sqrt(N) - T_desc_gops of 151736
        (36-s2: 183757 - 32021), 78865 (36-s5: 108975 - 30110), 23982 (36-s10: 58996 -
        35014) and 98591 (36-s11: 131782 - 33191). The narrowest margin is 23982, i.e.
        1.2e4 times wider than the 2-operation failure window. Treating sqrt(N) as
        anything but adversarially placed, the per-instance chance of the criterion failing
        is about 2/32000 = 6e-5 and the chance of falling below the 2/3 threshold (3 or
        more of 4 failing) is about 1e-11. The observed "4/4 = 100% >> 2/3 threshold" in
        EV-IC-001 lines 38-41 therefore carries on the order of 1e-4 bits of information
        about H-IC-001. It is arithmetic, not measurement.
      compounding_history: >-
        This is not a benign restatement. EXP-IC-001/analysis.md lines 51-54 record that
        the v2 criterion was NOT met and "the result is inconclusive". amendments/
        v2_to_v3.yaml then revised the criterion, citing the observed 4/13 and 4/4 numbers
        in its own reason field, into a form that could essentially not fail. EV-IC-001
        reports the revised criterion as "SUCCESS CRITERION MET" and DEC-20260726-005
        rationale item 1 is precisely that met criterion. So the support verdict rests on a
        criterion whose satisfaction was fixed before any observation, chosen after the
        original criterion failed.
      what_IS_empirical_in_EXP_IC_001: >-
        Two things survive as genuine measurements and I do not dispute them: (i) the
        magnitude of T_desc_gops (roughly 3.0e4-3.6e4 across all instances), and (ii) the
        fact that the conditioning set A is non-empty at 36 bits, i.e. 4 of 13 random
        36-bit curves have sqrt(N) above that constant. Everything downstream of the
        conditioning is arithmetic. The narrowest honest restatement of EV-IC-001 is:
        "sympy's Buchberger on this fixed 2-variable, degree-14 system costs about 0.04 s,
        equal to about 3.2e4 Python group operations, and 4 of 13 random 36-bit curves have
        an isqrt(N) above that number."
      does_EXP_IC_002_repeat_the_error: >-
        Partly. It discloses SC3/SC4 as arithmetic (good, and rare). But it moves the same
        defect into SC2's second clause and into CTRL-D. CTRL-D cannot fail by
        construction - the spec itself says the calibration "multiplies charged and
        uncharged costs identically", so the trend sign is invariant. It is a decorative
        control occupying a whole run arm.

    - id: Q4
      question: "Does the zero-decomposition confound actually undermine DEC-20260726-005? Argue the strongest case AGAINST the confound claim first."
      finding: THE_CONFOUND_IS_REAL_BUT_IS_NOT_THE_STRONGEST_OBJECTION_AND_ITS_STATED_FORM_IS_FALSE
      strongest_case_against_the_confound_claim:
        - "Premise falsification. 'No decomposition ever occurred in the 748 runs' is false: 34 fixed-mode runs at 7 instances decomposed with verified certificates. The claim's headline framing does not survive contact with its own inputs."
        - "The trivial-ideal confound EV-IC-001 flags is answerable for free from committed data and comes out AGAINST the objection: pooled median groebner_seconds is 0.040484 s over 306 trivial solves versus 0.038775 s over 34 non-trivial solves, ratio 0.958. Non-trivial systems are if anything marginally faster at this parameterization, so 'T_desc on trivial ideals may not represent non-trivial Groebner systems' is not a live confound here. EXP-IC-002 neither computes nor cites this, though it costs zero runs."
        - "H-IC-001 already assumes the yield. Its mechanism states P_dec ~ B^2/N and derives S_rel = (N/B)*T_desc from it. So the counting content of the confound is not new information; it is already in the hypothesis. What EXP-IC-002 'discovers' about SC1/SC2 is a restatement of a committed assumption."
        - "H-IC-001 never claimed a cryptanalytic advantage. It declares itself implementation-bound, and DEC-20260726-005 next_actions already record that K* is 3e8-5e8 and 'provides no practical advantage at toy scale'. Weakening a claim that already disclaims itself is a low-yield use of the final batch."
        - "B = 14 with m = 2 is not an index calculus. A real point-decomposition index calculus balances B against N so the yield term is not dominant. Charging yield at a fixed B = 14 proves the tested CONFIGURATION useless; it does not prove the multi-target crossover false. EXP-IC-002's own interpretation_limits say this, correctly."
      why_the_confound_nevertheless_stands_where_it_matters: >-
        H-IC-001's cost model is internally inconsistent, and that is the durable point.
        The same operation - "try a randomization until the target decomposes over V" - is
        charged WITH yield inside S_rel = (N/B)*T_desc and WITHOUT yield inside the
        per-target term K*(T_desc + T_verify). One of the two is wrong. Since the runs
        found no decomposition at any instance with N >= 1e9, T_desc as recorded is the
        cost of one FAILED attempt, so the per-target term is the wrong one. This is a
        derivation from H-IC-001's own assumptions and needs no new run at all.
      the_objection_that_dominates_both: >-
        Neither EXP-IC-001 nor EXP-IC-002 compares against a multi-target baseline, and
        that comparison closes the question without any yield model. See
        baseline_comparison below. Against the correct fixed-curve multi-target baseline,
        K* is infinite at all four headline instances UNCHARGED.
      scope_error_to_repair: >-
        EXP-IC-002 alternative_outcome A1 asserts that P_dec = 0 everywhere would mean
        "the source experiment never performed a descent, only a failed attempt". That is
        false as a global statement and must be scoped to N >= 1e9 (equivalently, to the
        27 instances with 0 recorded decompositions).

    - id: Q5
      question: "Is confirmatory_status: preserved defensible for amendments/v2_to_v3.yaml?"
      finding: NOT_DEFENSIBLE
      rule: >-
        docs/task-lifecycle.md section 5 (line 47 at this commit): "Protocol changes after
        approval require a versioned amendment. Exploratory changes must be labeled
        exploratory and cannot be evaluated against the original confirmatory criterion."
      adjudication: >-
        The v2_to_v3 amendment's own reason field cites observed outcomes as its
        justification - "At 36-bit with 13 seeds, only 4/13 (31%) have finite K*" and "4/4
        instances with N > 10^9 have finite K*". The criterion was therefore revised after
        the original was observed to fail, using the observed outcome to select the new
        criterion. It is an exploratory change by the plain text of the rule. The
        defensible status is exploratory_only, or reset with a fresh pre-registered run
        set. 'preserved' is the one status the rule excludes.
      secondary_defect: >-
        affected_runs: [] is misleading. No run needs re-execution, but ALL 748 runs
        preceded the amendment. The field should record that the entire run set is
        pre-amendment, which is exactly the fact that makes the change exploratory.
      contrast: >-
        v1_to_v2.yaml's confirmatory_status: preserved IS defensible: it repaired five
        blocking review objections before execution, with no outcome observed.
      consequence: >-
        With v2_to_v3 correctly labelled exploratory_only, EV-IC-001's "SUCCESS CRITERION
        MET" cannot be read as a confirmatory result, and DEC-20260726-005 rationale item
        1 loses its support independently of anything EXP-IC-002 measures. This is a
        finding about the ledger, not an authorization: only the Coordinator may act on it.

    - id: Q6
      question: "Confirm the spec cannot support anything above toy tier and frames nothing as a cryptanalytic improvement."
      finding: CONFIRMED
      detail: >-
        claim_tier: toy with an explicit justification; five interpretation_limits, the
        last of which states that no asymptotic-complexity claim is made or advanced and
        that the four promotion gates are out of scope; success_criterion self-scopes with
        "within the tested scope only"; alternative_outcome A2 routes a control failure to
        INCONCLUSIVE rather than to a negative claim. I found no sentence in the
        specification that presents a toy number as crypto-scale or that frames the control
        as a cryptanalytic improvement. The one scope overreach is A1's unscoped "never
        performed a descent" (see Q4), which is a factual, not a tier, error.
      rule_A1_application: >-
        Under the governing rule quoted in goal integrity note INT-BATCH006-002 (the file
        docs/target-result-profile.md is absent at this commit and is not cited as
        present), NEITHER DIRECTION of this question is target-class. A crossover at
        K* ~ 3e8-5e8 in a 36-bit group, produced by comparing a fixed Python/sympy
        overhead constant against isqrt(N), moves no asymptotic exponent and touches no
        central structural barrier; neither does its removal. EXP-IC-002 is ledger
        hygiene on one parameterization of one toy experiment. It must never be reported
        as an ECDLP result, as a closure, or as evidence about index calculus in general.

  blocking_objections:
    - id: BO-1
      severity: blocking
      title: "The motivating premise is false and the frozen protocol halts on it"
      detail: >-
        objective, counting_derivation.contrast_with_ev_ic_001, CTRL-G, SC2 and
        alternative_outcome A1 all assert zero decompositions across the 748 EXP-IC-001
        runs. 34 fixed-mode runs at 7 instances decomposed, with verified decomposition
        certificates. CTRL-G as written ("must reproduce the '0 decompositions' recorded
        across all 748 EXP-IC-001 runs") will disagree at the first 8-bit instance, and
        stopping_rules item 4 then requires "stop immediately and return the run to the
        Coordinator as a source-integrity failure rather than continuing". The primary arm
        cannot reach instance 2 of 34.
      required_repair: >-
        Replace the absolute premise with the per-instance decomposition table read from
        the committed records, and rewrite CTRL-G's expectation to that table. Scope A1 to
        N >= 1e9. Carry the correction of EV-IC-001, DEC-20260726-005 limitations,
        EXP-IC-001/analysis.md and goal note INT-BATCH006-003 to TASK-20260727-009 as a
        superseding record; those are immutable and are not mine to edit.
    - id: BO-2
      severity: blocking
      title: "F2 is unreachable at the instances that carry the decision"
      detail: >-
        F2 fires iff some committed EXP-IC-001 target lies in S, which is iff CTRL-G
        disagrees, which stopping rule 4 routes to an integrity halt "rather than
        interpreted". After BO-1 is repaired, the corrected record still shows 0
        decompositions at every N >= 479 except (12,3) at N = 2377, and 0 at every
        N >= 1e9. So F2 remains unreachable exactly where DEC-20260726-005 lives, and the
        only residual route to it is an incompleteness defect in the s3_eval pre-filter -
        an instrumentation finding, not the "confound claim is wrong" finding F2 is
        labelled with.
      required_repair: >-
        State plainly in the specification that F2 is unreachable at N >= 1e9 and that the
        experiment's genuinely empirical content is confined to the 7 instances with
        N <= 2377. Add the disposition rule that separates a genuine F2 from an integrity
        failure from an s3_eval-filter defect. Add the filter-completeness control (below).
    - id: BO-3
      severity: blocking
      title: "Metric semantics break on 7 of 34 instances"
      detail: >-
        Seven committed instances have N < |S|: N = 5 (8,3), 23 (8,1), 23 (16,1), 31
        (12,1), 37 (12,2), 41 (8,2), 349 (24,3). At these, p_dec_counting_bound = |S|/N is
        greater than 1 and is not a probability, and t_desc_charged_lower_bound =
        T_attempt * N / |S| is SMALLER than T_attempt - at N = 5 by roughly two orders of
        magnitude - contradicting its own definition, since the true charged cost
        T_attempt / P_dec is at least T_attempt for every P_dec <= 1. The defective metric
        is then fed to the SC4 Spearman statistic over all 34 instances.
      required_repair: "p_dec_counting_bound := min(1, |S|/N); t_desc_charged_lower_bound := T_attempt * max(1, N/|S|). Report the seven affected instances explicitly."
    - id: BO-4
      severity: blocking
      title: "No multi-target baseline; CTRL-E compares a multi-target claim against single-target algorithms only"
      detail: >-
        CTRL-E supplies matched Pollard rho and BSGS. Both are single-target baselines.
        H-IC-001 is a fixed-curve, K-target amortization claim, so the closest specialized
        baselines are the exhaustive precomputed log table and the generic preprocessing
        frontier S*T^2 = Omega~(N) that the repository's own KN-LIT-013 and KN-TECH-005
        record as tight. Both are closed-form on committed numbers and both dominate
        EXP-IC-001's IC accounting uncharged. Omitting them lets a vacuous "crossover"
        stand as if it meant something. See baseline_comparison.
      required_repair: "Add CTRL-E2 with both baselines, computed in closed form per instance in the same group-operation unit. Zero new runs, zero new implementation."
    - id: BO-5
      severity: blocking
      title: "The |S| invalidation threshold is not tight"
      detail: "The true maximum is 392, so an enumeration producing 393-420 - necessarily defective - passes the invalidation rule written to catch it."
      required_repair: "Set the invalidation threshold to 4*C(14,2) + 2*14 = 392, keep 420 as the loose derivation bound, and record min(392, #E - 1) as the binding constraint at 8-bit."

  non_blocking_objections:
    - id: NB-1
      title: "CTRL-D cannot fail and occupies a whole run arm"
      detail: >-
        The spec itself states the reason: calibration "multiplies charged and uncharged
        costs identically", so the trend sign in charged_ratio is invariant under any
        positive rescaling. CTRL-D is an algebraic identity, not a control. Worse, the
        quantity that IS calibration-sensitive - the UNCHARGED K* finiteness that
        DEC-20260726-005 rests on - is not tested by it. The committed calibration factors
        span 554,930 to 1,477,926 group-ops/s (2.66x, recomputed from the 34 rho manifests);
        that alone moves the crossover threshold in N by 7.1x. Repoint CTRL-D at the
        uncharged crossover, or relabel it an identity check.
    - id: NB-2
      title: "CTRL-A never validates the membership test at a headline instance"
      detail: >-
        CTRL-A applies only where N <= 200000, which is 23 of 34 instances and none of
        36-bit seeds 2, 5, 10, 11. Cheapest fix, microseconds per instance: a
        positive/negative membership control valid at every N - take random Y in E, assert
        the test accepts h*Y where h = #E/N, and assert it rejects a Y with N*Y != O.
    - id: NB-3
      title: "The s3_eval pre-filter is undocumented and untested"
      detail: >-
        See Q2. Cheapest fix, roughly 420 point additions on one small instance: enumerate
        the harness's reachable set once with the filter and once with it disabled and
        assert set equality.
    - id: NB-4
      title: "k_star_charged is a hybrid accounting, not a corrected cost model"
      detail: >-
        T_desc is yield-charged while S_rel stays frozen at the uncharged (N/B)*T_desc.
        The direction is safe - correcting S_rel only raises K* - but the number must be
        labelled a single-factor attribution figure, not "the corrected K*".
    - id: NB-5
      title: "The counting bound is loose by the cofactor"
      detail: >-
        S is spread over E, not over <P>, so the natural estimate is P_dec ~ |S|/#E =
        |S|/(h*N), not |S|/N. h is 2, 4, 16, 3 at 36-bit seeds 2, 5, 10, 11 (from committed
        p and N), so the looseness is at most 16x and immaterial - but the derivation should
        say so instead of leaving |S|/N looking tight.
    - id: NB-6
      title: "Effective target sample size is not 10 at degenerate instances"
      detail: >-
        EXP-IC-001's _derive_targets computes k = ((idx+1)*stride) mod (n-1) + 1. At
        (8, seed 3) with N = 5 the ten committed target_k values are 3,1,3,1,3,1,3,1,3,1 -
        two distinct targets repeated five times. p_dec_target_set_empirical has effective
        n = 2 there, not 10. Report effective distinct-target counts per instance.
    - id: NB-7
      title: "A free, zero-run secondary metric is omitted"
      detail: >-
        The trivial-versus-non-trivial Groebner cost comparison (306 vs 34 solves, medians
        0.040484 s and 0.038775 s, ratio 0.958) settles one of EV-IC-001's three recorded
        unresolved_confounds from committed records at no cost. Add it as a secondary
        metric; note that it comes out in H-IC-001's favour.
    - id: NB-8
      title: "CTRL-B is degenerate below N = 100000"
      detail: >-
        Drawing 100000 subgroup elements from a subgroup of order 5, 23 or 31 is not a
        sample; it enumerates the subgroup thousands of times. Restrict CTRL-B to
        N >= 1e6 or report the effective sample size.
    - id: NB-9
      title: "Evidence records cite no run_ids"
      detail: >-
        EV-IC-001, EV-STR-002 and EV-GGM-001 all carry run_ids: [] while citing 748, 22
        and 9 runs. This does NOT block the present design review: the EXP-IC-001 run
        directories exist at this commit, I enumerated all 748 and read the fields the
        reuse contract depends on, and the 34 rho manifests carry
        parameters.prime_order_n, metrics.total_group_operations and timing.wall_seconds
        as the spec assumes. It does mean AGENTS.md rule 10 is unmet for the records
        already committed, and EV-IC-002 must not repeat it.
    - id: NB-10
      title: "EXP-IC-002 addresses only DEC-20260726-005, not DEC-20260726-006"
      detail: >-
        The batch framing cites EV-STR-002 line 55 alongside EV-IC-001 line 55, but nothing
        in this specification bears on H-STR-002. That is a correct scoping choice
        (DEFER-BATCH006-001 carries it), but the batch narrative should not imply the
        control covers both decisions.

  baseline_comparison:
    stated_baseline_in_spec: "CTRL-E: matched Pollard rho as the committed total_group_operations, and BSGS as 2*ceil(sqrt(N)) ops with ceil(sqrt(N)) stored elements."
    missing_baseline_1_exhaustive_table:
      construction: "Precompute all N multiples of P: N-1 group additions, N stored elements. Each of the K targets is then a table lookup, 0 group operations."
      comparison_to_EXP_IC_001_accounting: >-
        EXP-IC-001 charges S_rel = (N/B)*T_desc_gops. Hence S_rel/N = T_desc_gops/B, which
        is INDEPENDENT of N and equals 2151-2544 at the four headline instances (T_desc_gops
        30110-35617, B = 14). So the index-calculus precomputation is roughly 2.2e3-2.5e3
        times MORE expensive than exhaustively enumerating the entire group, at every one
        of the 34 instances, and the per-target cost is 32023 group ops against O(1).
        EXP-IC-001's scheme is dominated in BOTH terms, uniformly, by a first-week
        algorithm.
      consequence: "A 'finite K*' against rho is cryptanalytically vacuous when the same accounting loses to exhaustive enumeration by three orders of magnitude in precomputation and four in per-target cost."
    missing_baseline_2_preprocessing_frontier:
      source: "knowledge/literature/KN-LIT-013.md (Corrigan-Gibbs and Kogan, EUROCRYPT 2018): S*T^2 = Omega~(eps*N), and 'shows the bound is essentially tight via a matching generic algorithm'. Restated in knowledge/techniques/KN-TECH-005.md. H-IC-001's own assumptions name this as the correct reference frontier."
      instantiation: "Balance at S = T = N^(1/3): S*T^2 = N. Online cost per target is N^(1/3) group operations with N^(1/3) stored elements."
      per_instance_at_the_four_headline_instances:
        - {instance: "36-bit seed 2",  N: 33766959953, N_cbrt: 3232, T_desc_gops: 32021, frontier_cheaper_per_target_by: "9.9x"}
        - {instance: "36-bit seed 5",  N: 11875729387, N_cbrt: 2281, T_desc_gops: 30110, frontier_cheaper_per_target_by: "13.2x"}
        - {instance: "36-bit seed 10", N: 3480617339,  N_cbrt: 1515, T_desc_gops: 35014, frontier_cheaper_per_target_by: "23.1x"}
        - {instance: "36-bit seed 11", N: 17366619409, N_cbrt: 2590, T_desc_gops: 33191, frontier_cheaper_per_target_by: "12.8x"}
      consequence: >-
        At every one of the four instances DEC-20260726-005 rests on, N^(1/3) < T_desc_gops.
        Substituting the correct multi-target baseline for sqrt(N) in
        K* = ceil((S_rel + S_LA)/(baseline - T_desc - T_verify)) gives a NEGATIVE
        denominator, i.e. K* = infinity - UNCHARGED, with no yield model, no new run and no
        appeal to the zero-decomposition confound at all. The advice size N^(1/3) is
        1515-3232 elements, trivially small.
      honest_caveat: >-
        CGK's offline phase is unbounded, so this compares online cost and advice size, not
        offline time. Baseline 1 (exhaustive table) has fully explicit offline cost and
        already suffices. Both are stated as closed-form comparisons on committed numbers,
        not as measurements.
    net: >-
      Against the correct baseline for the regime H-IC-001 is stated in, the crossover does
      not exist and never did. This is cheaper, more decisive, and less contestable than the
      yield charge, and it is absent from both EXP-IC-001 and EXP-IC-002.

  cost_model_challenges:
    - "Per-attempt cost is used where total expected cost is required. Total expected cost = per-attempt cost x inverse success probability. EXP-IC-001 applies this correctly inside S_rel = (N/B)*T_desc and omits it inside K*(T_desc + T_verify) for the same operation. The two are inconsistent; the per-target term is the wrong one at every instance with N >= 1e9, where the runs record 0 successes."
    - "The 'crossover' is a comparison of two Python overheads. T_desc_gops = groebner_seconds x (rho total_group_operations / rho wall_seconds). Groebner wall time is 0.038-0.044 s across ALL 34 instances (1.15x over N from 5 to 3.4e10) because the polynomial operation count is fixed by degree 14 in 2 variables and, below 36 bits, coefficients fit a machine word. The calibration factor is 5.5e5-1.5e6 ops/s (2.66x). So the crossover point is 'where isqrt(N) exceeds a fixed interpreter-overhead constant', and it moves by 7.1x under the observed calibration spread alone. Neither experiment tests that sensitivity."
    - "Memory is reported for BSGS but never for the IC route. B = 14 makes IC memory trivial, which is precisely why it cannot compete: the baselines that beat it buy their advantage with N or N^(1/3) memory, and the comparison is not made."
    - "S_LA is asserted as roughly B^2/12 ~ 16 group ops and never measured. Harmless at B = 14, but it is an unmeasured term inside a headline formula."
    - "The 8-bit and 12-bit rho baselines are overhead-dominated: rho used 197, 448 and 551 total group operations at N = 5, 23 and 41 against sqrt(N) of 2, 4 and 6. The same numbers supply both the 'baseline' and the calibration unit, so at small N the comparison is a measurement against itself."

  heuristic_challenges:
    - "H1 (implicit, unnumbered in EXP-IC-002): 'targets are effectively uniform in <P>'. IDEA-20260727-002 states it as an assumption; the specification does not carry it as a numbered heuristic. The committed targets are a deterministic stride sequence, k = ((idx+1)*stride) mod (n-1) + 1, and at (8,3) it collapses to two distinct values. Number it and record the effective sample size."
    - "H2 (implicit): 'S behaves like a uniform random subset of E when intersected with <P>'. The committed data supports it at the 7 low-N instances (predicted vs observed hits agree instance by instance) and is untestable at N >= 1e9, where 10 targets cannot resolve a yield of order 1e-8. Say that, rather than letting SC2 read as a measurement at crypto-relevant... (at toy-large) N."
    - "H3 (implicit): 'the s3_eval filter is complete'. Provable, unproved in the spec, untested by any control. See NB-3."
    - "Random-model transfer, the honest version: this is a case where the structured object helps rather than hurts. S is a signed sumset of 14 lifted points; sumsets can be far from random. The cheapest experiment that would expose a deviation is already affordable - compare |S| against the random-subset prediction #E*(1 - exp(-392/#E)) at the 8-bit and 12-bit instances, where #E is small enough for the two to differ measurably. The spec measures |S| but never compares it to a null model."
    - "Scale honesty: nothing here is at cryptographic scale and the spec says so. Maximum N is 3.4e10, about 35 bits. AGENTS rule 7 is respected."

  reduction_and_scope_challenges:
    - "No published reduction is instantiated by this specification, so the reduction-instantiation checklist is vacuous here. Correct."
    - "Scope inflation check: the affected scope is exactly one parameterization (B = 14, m = 2) of one toy experiment on 34 prime-field curves of 8-36 bits under sympy 1.14.0 / Python 3.13.1 / macOS arm64. Nothing about index calculus in general, other (B, m), other solvers, binary or extension fields, or ECDLP at any deployed parameter size is in scope in either direction."
    - "The one place scope IS inflated is alternative_outcome A1's unscoped 'the source experiment never performed a descent'. 34 verified decompositions say otherwise. Scope it to N >= 1e9."

  counterexample_or_mutation: >-
    Cheapest discriminating artifact, requiring zero runs and zero implementation: a
    per-instance closed-form table of (a) exhaustive-table cost N with O(1) per target,
    and (b) the S*T^2 = Theta~(N) frontier at S = T = N^(1/3), both against EXP-IC-001's
    committed S_rel = (N/B)*T_desc and per-target T_desc + 2, in the same group-operation
    unit. At the four headline instances this yields N^(1/3) = 3232, 2281, 1515, 2590
    against T_desc_gops = 32021, 30110, 35014, 33191, and S_rel/N = T_desc_gops/14 =
    2151-2544. It refutes the cryptanalytic content of the crossover uncharged, without
    the yield model, and it is immune to every implementation objection the yield model
    inherits.

  required_controls:
    - "CTRL-E2 (new, blocking): the two multi-target baselines above, closed form, per instance, same unit."
    - "CTRL-G (repair, blocking): expectation rewritten to the verified 34-decomposition per-instance table, not '0 decompositions'."
    - "CTRL-I (new, cheap): s3_eval filter-completeness check - enumerate the harness reachable set with and without the filter on one 8-bit instance and assert set equality."
    - "CTRL-A2 (new, cheap): positive/negative subgroup-membership control valid at every N, including the four headline instances."
    - "CTRL-D (repair): repoint at the UNCHARGED crossover under the observed 2.66x calibration spread, or relabel as an algebraic identity."
    - "Secondary metric (new, free): trivial vs non-trivial Groebner cost from the committed records."
    - "Null-model comparison (new, cheap): measured |S| against #E*(1 - exp(-392/#E)) at 8-bit and 12-bit."

  narrowest_supported_statement: >-
    Within B = 14, m = 2, the 34 committed EXP-IC-001 toy instances (8-36 bit primes,
    N from 5 to 3.4e10), the sympy 1.14.0 Buchberger and Python rho stack on macOS arm64,
    and the group-operation calibration EXP-IC-001 used: the per-target descent cost that
    DEC-20260726-005 compared against sqrt(N) is the cost of one decomposition ATTEMPT,
    and at every instance with N >= 1e9 no attempt in the committed record ever succeeded.
    Charging one success instead of one attempt makes the per-target cost grow linearly in
    N and the crossover disappear within that scope. Independently of any yield model, the
    same committed numbers show the scheme's precomputation exceeds exhaustive enumeration
    of the whole group by a factor T_desc_gops/B ~ 2.2e3-2.5e3 and its per-target cost
    exceeds the N^(1/3) preprocessing frontier by 10x-23x, so no cryptanalytically
    meaningful crossover exists in the tested scope. Nothing here is evidence about index
    calculus in general, about other (B, m), about other solvers, or about ECDLP at any
    deployed parameter size, and nothing here moves an asymptotic exponent in either
    direction.

