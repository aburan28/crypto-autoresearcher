      R2_F2_unreachable: REPAIRED_WITH_ONE_OVERSTATEMENT
      R2_detail: >-
        The identity "F2 fires <=> CTRL-G disagrees at an instance with
        N >= 1e9" is correct, and v1 did assign the same event contradictory
        dispositions. I confirm 0 of the 10 committed targets lie in S at every
