      R4_CTRL_E2: REPAIRED_AND_THE_STRONGEST_PART
      R4_detail: >-
        Every closed-form value I could check is correct (see Q6). E2b's
        citation of KN-LIT-013 is validly instantiated: KN-LIT-013 at this
        commit states S*T^2 = Omega~(eps*N) for prime order N with a matching
        generic algorithm, which is exactly what E2b uses, and the balance point
        S = T = N^(1/3) is the right instantiation. CTRL-E2 is nevertheless
        incomplete - see BO-3.
      R5_threshold_392: REPAIRED_AND_CORRECT
      R5_detail: See Q2.

    Q2_is_392_right:
      answer: >-
        YES. 392 is correct, and it is not merely an upper bound - it is the
        exact supremum and it is ATTAINED.
      independent_derivation_from_source: >-
        harness/semaev.py::_find_decomposition lines 147-171. The outer loop is
        `for i, v1 in enumerate(V)` and the inner is `for v2 in V[i:]`, so the
        index pairs are unordered with repetition: C(14,2) + 14 = 105. For each
        pair it lifts A = E.lift_x(v1), B = E.lift_x(v2) and tests
        `E.add(sA, sB) == R` over sA in {A, -A}, sB in {B, -B}. R is an affine
        committed target, so the point at infinity is never a hit.
        Off-diagonal i < j: at most 4 distinct sums, 4 * C(14,2) = 4 * 91 = 364.
        Diagonal i = j: A and B are the SAME lifted point, so the four sign
        combinations give the multiset {2A_i, O, O, -2A_i}, at most 2 distinct
        non-identity points, 2 * 14 = 28. Total |S| <= 364 + 28 = 392.
      error_direction_of_the_v1_bound_420: >-
        CONSERVATIVE, as the amendment states. 420 overstates |S| by 28
        (7.1%), which overstates the yield bound |S|/N and understates the
        charged-cost lower bound T_attempt * N / |S| by at most 6.7%. That
        biases the test AGAINST the confound claim. Confirmed, and immaterial
        against the effect sizes at stake.
      measured_reality: >-
        I enumerated S exactly at all 34 instances from the committed factor
        bases and curve parameters. |S| = 392 at 24 of 34 instances (every
        instance from 16-bit seed 2 upward), and never exceeds 392. Max |S| over
        8-bit instances = 191; over 36-bit instances = 392. So 392 is tight and
        attained, F1 is definitionally unreachable, and the amendment's
        disclosure of that tension is correct.
      unclaimed_further_constraint: >-
        S is closed under global negation, so |S| is odd only when S contains a
        point equal to its own negative. Two measured values are odd (|S| = 191
        at (8,1), 389 at (16,3)), which implies those S contain a point of order
        dividing 2. This is a free structural consistency check the design does
        not use; not a defect.

    Q3_is_exploratory_only_sufficient:
      answer: NECESSARY_AND_CORRECTLY_JUSTIFIED_BUT_NOT_SUFFICIENT
      what_it_does_bind: >-
        The label is right, the docs/task-lifecycle.md section 5 quotation is
        accurate against the committed doc, `preserved` is genuinely unavailable
        after an adverse review, and the binding clause ("NO EXP-IC-002 result
        may be reported as satisfying a confirmatory pre-registered criterion")
        is the strongest single guard in the amendment. The contrast drawn with
        EXP-IC-001's v1_to_v2 precedent is fair.
      two_routes_it_does_not_close:
        - >-
          It does not bite on a DISPOSITION rule, because a disposition changes
          how an outcome is read rather than asserting a confirmatory result.
          SC1_disposition_rule_new is such a rule, its triggering condition is
          determinate from committed data, and it fires. See BO-2.
        - >-
          It does not bite on the SC4 / F3 structure, because F3 is a
          falsification criterion, not a confirmatory one. The repaired metric
          fires F3 while both pre-registered diagnostics clear the threshold.
          See BO-1.
      propagation_gap: >-
        exploratory_only is declared binding on EV-IC-002 but the amendment does
        not require it to appear in the run artifacts. A stdout line or
        raw-result.json field reading "SC2 MET" would violate the rule in
        substance while satisfying it in letter. Cheap fix: require the Executor
        to emit `confirmatory_status: exploratory_only` beside every SC verdict
        in raw-result.json and observations.md.

    Q4_is_a_criterion_free_CTRL_E2_defensible:
      answer: THE_GROUND_IS_DEFENSIBLE_THE_IMPLEMENTATION_IS_NOT
      defensible_part: >-
        Correct: adding a success criterion whose outcome is arithmetically
        forced by committed numbers is exactly the defect this batch exists to
        correct, and CTRL-E2's content is closed-form arithmetic. Keeping it
        verdict-free is the right call, and the honest_caveats block (online-cost
        only for E2b, derivation not measurement, and "a K* finite against a
        single-target baseline and infinite against a multi-target baseline is a
        statement about which baseline the claim was compared to") is exemplary.
      indefensible_part: >-
        "No verdict" has been implemented as "no pre-registered value at all".
        CTRL-E2 produces 34 rows; exactly ONE row carries a cross-check (2287 at
        36-bit seed 2), and even that row's companion number is left as an
        unadjudicated disagreement between 3232 and 3240. There is no stated
        rule for what a disagreement means ("an observation to report, not to
        reconcile silently"). That is a criterion-free control that can be read
        selectively after the fact, and the fix costs nothing because every
        value is determined by committed numbers.
      cheapest_fix: >-
        Pre-register the full 34-row expected CTRL-E2 table as an
        IMPLEMENTATION-DEFECT check (not a success criterion): a disagreement is
        an implementation defect, never a result. At minimum pre-register
        k_star_vs_frontier = "infinity" at all 34 instances and the exact
        integer cube roots at the four headline instances.

    Q5_the_declined_CTRL_I:
      answer: OVERRULE_THE_DECLINE_REQUIRE_CTRL_I
      but_first_the_result: >-
        I ran CTRL-I myself, read-only, at ALL 34 instances rather than the one
        8-bit instance D1 proposed. For every point reachable by the unfiltered
        signed-pair-sum enumeration, I evaluated
        s3_eval(a, b, v_i, v_j, x(Q), p). It was zero in every case: the
        pre-filter rejected 0 of the reachable points at 0 of the 34 instances.
        H3 therefore holds empirically on every committed factor base, and
        CTRL-I would find nothing.
      why_require_it_anyway:
        - >-
          The stated ground for declining is factually wrong. D1 says CTRL-I
          "adds a new computation and a new control arm". It adds neither. The
          primary arm's analysis_methodology.reachable_set_enumeration already
          forms every signed pair sum; CTRL-I is one s3_eval per enumerated
          point inside that existing loop - about 392 modular evaluations per
          instance, about 13,300 across all 34, no new arm, no new run, no new
          instance. The real marginal cost is a single assertion, not "roughly
          420 point additions".
        - >-
          H3 is, by the amendment's own words, the SOLE residual route to
          falsifier F2 at N >= 1e9, and the amendment concedes that at the four
          instances DEC-20260726-005 rests on, the experiment has NO reachable
          falsifier. Removing the only falsifier at the decision-bearing
          instances on the strength of an assumption recorded as
          PROVABLE_UNPROVED_UNTESTED, when validating it costs one assertion in
          an existing loop, is under-controlled regardless of how the test comes
          out.
        - >-
          The "conservative direction" argument is narrower than the amendment
          claims. Filter incompleteness is conservative for the CHARGED-COST
          metric. It is NOT conservative for the census that R1 now makes
          load-bearing, nor for SC2's second and third clauses, which are
          reproductions through the filtered path. If s3_eval were incomplete,
          the 68/748 census and the per-instance expectation table would measure
          the filter rather than the reachable set, and R1's entire premise
          correction would inherit that.
      honest_consequence_of_adopting_it: >-
        Adopting CTRL-I does NOT restore a reachable F2. It converts "F2
        unreachable, conditional on unvalidated H3" into "F2 unreachable, H3
        validated in-run at all 34 instances". That is the narrowest correct
        statement and it is worth the one assertion it costs.
      mathematical_status_of_H3: >-
        H3 is not merely plausible, it is provable, and the amendment's
        derivation sketch is correct: if s1*A_i + s2*A_j = R then
        s1*A_i + s2*A_j + (-R) = O is a sum of three affine points with
        x-coordinates v_i, v_j, x(R), so the third summation polynomial
        S3(v_i, v_j, x(R)) vanishes; hence the filter cannot reject a true hit.
        The residual risk is therefore implementational, not mathematical -
        which is exactly what a control is for.

    Q6_runs_versus_derivation:
      answer: >-
        THE DERIVATION ALREADY SUPPORTS THE DECISION. The runs cannot change the
        cryptanalytic conclusion. They buy artifact durability and two genuine
        integrity controls, and nothing else.
      arithmetic_independently_verified:
        S_rel_over_N_is_N_independent: >-
          CONFIRMED. s_rel_frozen = (N/B) * T_attempt, so S_rel/N = T_attempt/B,
          independent of N. At 36-bit seed 2, T_desc_gops = 32021 (I reproduced
          this from the committed run records: median of the 10 fixed-mode
          groebner_seconds times total_group_operations/wall_seconds from the
          matched rho manifest; it matches the committed analysis table exactly,
          as do all 13 of the 36-bit values), so S_rel/N = 32021/14 = 2287.2.
          The amendment's 2287 is confirmed.
        S_rel_over_N_at_all_34: >-
          Ranges 1908 to 4142; at the four headline instances 2287, 2151, 2501,
          2371. So the index-calculus PRECOMPUTATION alone costs 1.9e3 to 4.1e3
          times the cost of exhaustively enumerating the entire group (N-1
          additions). Roughly three orders of magnitude, as stated.
        integer_cube_root_dispute_ADJUDICATED: >-
          RT-20260727-001's 3232 is CORRECT; the orchestrator's 3240 is WRONG.
          3232^3 = 33760903168 <= N = 33766959953 < 3233^3 = 33792250337, while
          3240^3 = 34012224000 > N. The amendment declines to adjudicate a
          three-line integer computation; I adjudicate it. Exact integer cube
          roots at the four headline instances: 3232, 2281, 1515, 2589.
        ratio_per_target: >-
          CONFIRMED. T_attempt / N^(1/3) = 32021/3232 = 9.91 at 36-bit seed 2
          (the amendment's ~9.9x). At seeds 5, 10, 11: 13.20, 23.11, 12.82.
        k_star_vs_frontier: >-
          CONFIRMED and STRONGER than claimed. The denominator
          n_cbrt - T_attempt - T_verify is strictly negative at ALL 34
          instances, not only the four headline ones (max n_cbrt = 3232, min
          T_attempt = 21374), so k_star_vs_frontier = "infinity" everywhere,
          uncharged, with T_desc frozen at EXP-IC-001's own value.
      what_this_means: >-
        Against the correct multi-target baselines the fixed-curve
        index-calculus configuration of EXP-IC-001 never amortizes, at any K, at
        any of the 34 instances, without charging the descent by yield at all.
        The yield charge is not needed to reach that conclusion; it is a second,
        independent route to the same place. That is the cryptanalytically
        decisive content of this batch and it is already in closed form.
      what_the_runs_would_actually_add: >-
        I reconstructed EVERY primary and secondary metric of the primary arm
        from committed records in about a minute of read-only computation: |S|,
        |S intersect <P>|, p_dec_exact, p_dec_counting_bound,
        t_desc_charged_lower_bound, charged_ratio_lower_bound, k_star_charged in
        all three variants, p_dec_target_set_empirical, T_attempt_gops, the
        uncharged ratio, and the CTRL-G reproduction. The primary arm therefore
        contains no unknown. What the four arms genuinely add is: (a) durable,
        independently re-verifiable run artifacts with certificates, which is an
        evidence-integrity good and not a mathematical one; (b) CTRL-A, a real
        exhaustive check that the N*X == O membership predicate agrees with
        direct subgroup intersection at the 23 instances with N <= 200000; and
        (c) CTRL-C, the only genuinely new computation in the whole design -
        rebuilding the factor base at B' = min(ceil(sqrt(N)), 256) at 8/12-bit
        to confirm yield charging introduces no artifact of its own. By the
        amendment's own Z1, CTRL-D cannot fail and is an identity check; by its
        own Z5, CTRL-B is enumeration rather than sampling at 6 of 34 instances.
      recommendation_on_budget: >-
        If budget is scarce, the defensible package is the primary arm plus
        CTRL-A and CTRL-C. CTRL-D should be recorded as the algebraic identity
        Z1 already says it is rather than run as a control arm. This is advice
        to the Coordinator; this report authorizes no execution and changes no
        arm count.

    Q7_claim_boundaries:
      answer: CONFIRMED_NOTHING_HERE_CAN_SUPPORT_ABOVE_TOY_TIER
      basis: >-
        Largest subgroup order tested is N = 33,766,959,953, about 35 bits.
        Every instance is an 8-36 bit prime field with B = 14, m = 2, one solver
        stack (sympy Buchberger versus Python Pollard rho on macOS arm64). The
        amendment's claim_boundaries block is accurate and I found no scope
        inflation in it; its statement that the amendment creates no evidence
        record, no decision record and no hypothesis-status change is correct
        against the commit, which touches only the amendment, the queue and the
        living goal record.
      rule_A1_governing_doc_absent: >-
        docs/target-result-profile.md does not exist at e0db8ef7. I treat rule
        A1 as governing and do not cite the document as present, exactly as the
        amendment does. Under A1, constant-factor and log-cofactor improvements
        are not target-class. Nothing here is even that: no asymptotic exponent
        moves whether H-IC-001 ends supported, weakened or rejected at
        B = 14, m = 2, and CTRL-E2's K* = infinity is, in the amendment's own
        honest words, a statement about which baseline the claim was compared to
        rather than a new mathematical fact.
      what_a_fully_confirmed_EXP_IC_002_would_be: >-
        A scope correction to one ledger claim about one toy configuration. It
        is not an ECDLP result, not a closure, not an impossibility result, not
        a cryptanalytic improvement, and not evidence about index calculus in
        general, about any other (B, m), about other solvers, or about ECDLP at
        any deployed parameter size.

  objections:

    - id: RT-012-BO-1
      severity: blocking
      title: >-
        The R3 repair makes SC4 FAIL and fires falsification criterion F3,
        determinately, and the amendment does not say so.
      derivation: >-
        Computed from committed records only, before any EXP-IC-002 run exists.
        On the REPAIRED metric charged_ratio_lower_bound =
        T_attempt * max(1, N/|S|) / isqrt(N), the Spearman rank correlation
        between log N and log(ratio) over all 34 instances is 0.8143. SC4
        requires >= 0.9. SC4 therefore FAILS. The largest-N over smallest-N rise
        is 1404.6x, which clears its 10x threshold, but SC4 is conjunctive.
        Both pre-registered diagnostics clear the bar comfortably: restricted to
        the 27 instances with N >= 392, Spearman = 0.9853; on the UNREPAIRED v1
        metric over all 34, Spearman = 0.9904 with a 42419x rise.
      mechanism: >-
        The floor pins the 7 low-N instances at ratio = T_attempt/sqrt(N), which
        DECREASES in N. Concretely (8,1) at N = 23 sits at 13865 while (16,2) at
        N = 733 sits at 3002 and (12,3) at N = 2377 sits at 7770. The series is
        strongly non-monotone at the low-N end, exactly as the amendment's
        direction_of_the_repair predicts - but the amendment predicts only the
        SIGN of the effect and never computes its magnitude, so it does not
        disclose that the effect is threshold-crossing.
      why_this_is_blocking: >-
        Under specification.yaml's falsification_criterion preamble, "ANY of the
        following falsifies this control and leaves H-IC-001 standing as decided
        by DEC-20260726-005", and F3 is "the charged ratio fails to increase
        with N (Spearman < 0.9 or rise < 10x)". The amended protocol therefore
        ships a design whose own falsification criterion fires on its own
        repaired metric, with two escape statistics sitting next to it that both
        pass, and with F3_v2 already worded to attribute the firing to the floor
        ("An F3 firing that is attributable to the R3 floor at the 7 low-N
        instances must be reported as such"). The amendment forbids substitution
        in words and constructs the substitution in structure. This must be on
        the record BEFORE execution, not adjudicated after.
      compounding_defect: >-
        R3 also invalidates v1's empirical_content_disclosure, which asserts
        that "the charged cost lower bound T_attempt * N / |S| exceeds sqrt(N)
        for every N >= 1, so ... the charged ratio must grow like sqrt(N)".
        Under the floor it does not grow at 7 of 34 instances. unchanged_fields
        is silent on empirical_content_disclosure, so a now-false disclosure
        remains in force.
      required_repair: >-
        State the determinate SC4 statistic and the determinate F3 firing in the
        amendment before execution, and pre-commit the interpretation: either
        (a) keep SC4 and F3 as frozen and record now that the design's own
        falsifier is met on the repaired metric, with the consequence for
        H-IC-001 spelled out; or (b) restate SC4 as a scope-restricted trend
        test over the regime where the counting bound is non-vacuous (N > |S|),
        declared as a scope restriction and not as a rescue diagnostic. Also
        supersede v1's empirical_content_disclosure.

    - id: RT-012-BO-2
      severity: blocking
      title: >-
        SC1's second clause fails determinately, and the disposition rule this
        amendment adds converts that determinate failure into INCONCLUSIVE,
        asymmetrically.
      derivation: >-
        Measured exactly from committed factor bases: max |S| over the 8-bit
        instances = 191 (at (8,1)); max |S| over the 36-bit instances = 392.
        Ratio = 2.0524. SC1's second clause requires "differ by less than 2x".
        It fails, by 2.6%. SC1_disposition_rule_new then fires, because |S| is
        within a factor 2 of min(392, #E - 1) at every instance: I computed
        #E = 230, 123, 160 at the three 8-bit instances, giving
        |S| / min(392, #E - 1) = 0.834, 0.951, 0.950. So SC1 is reported
        INCONCLUSIVE on clause 2 and is not read as a falsification.
      why_this_is_blocking: >-
        The rule's SUBSTANCE is right - the 8-bit curve orders really do bind,
        and the ratio really is a pigeonhole artifact. The problem is procedural
        and it is the exact defect this batch exists to correct. |S| is a
        deterministic function of data already committed; I computed it in
        seconds. A disposition rule written after an adverse review, against a
        quantity already determined by committed inputs, in the single direction
        that rescues, is a criterion set to match an observation that already
        exists. The amendment's own confirmatory_status reason (2) states that
        principle and applies it to CTRL-G and to SC2's second clause, but not
        to the rule the amendment itself introduces. There is no symmetric
        branch that would downgrade a PASS. exploratory_only does not close this
        because a disposition is not a confirmatory assertion.
      required_repair: >-
        Record the determinate values (191, 392, 2.0524, and |S|/binding at
        every instance) in the amendment, and replace SC1 clause 2 with the
        constraint that is actually meaningful and actually satisfied - that
        |S| tracks min(392, #E - 1) within a stated factor at every instance -
        rather than adding an escape branch to a threshold that is known in
        advance to fail.

    - id: RT-012-BO-3
      severity: blocking
      title: >-
        CTRL-E2 omits the only multi-target baseline that is tight in the
        operating regime: van Oorschot-Wiener / Kuhn-Struik multi-target rho
        with sqrt(K) amortization.
      argument: >-
        R4's own motivation is that "CTRL-E supplies matched Pollard rho and
        BSGS. Both are SINGLE-TARGET algorithms. H-IC-001 is a fixed-curve,
        K-target amortization claim, so the closest specialized baselines are
        multi-target ones." Both baselines CTRL-E2 actually adds are
        K-INDEPENDENT: E2a's exhaustive table costs N-1 offline regardless of K,
        and E2b's frontier at S = T = N^(1/3) costs N^(1/3) per target
        regardless of K. The genuinely K-dependent multi-target baseline -
        solving K discrete logs in one group in about c*sqrt(K*N) total, i.e.
        about c*sqrt(N/K) per target - is absent from CTRL-E, from CTRL-E2, and
        from the knowledge corpus: KN-LIT-012 and KN-TECH-006 at this commit
        record van Oorschot-Wiener only in its parallel / distinguished-points
        single-target form and say nothing about multi-instance amortization.
      why_it_matters_in_the_actual_regime: >-
        EXP-IC-001 uses K = 10 targets per curve. At K = 10 the exhaustive table
        (N - 1 = 3.4e10 offline at 36-bit seed 2) is absurdly out of scale and
        the CGK frontier is a lower-bound instantiation, whereas multi-target
        rho is a concrete algorithm at the right scale. It is therefore the one
        baseline IC could plausibly have been claimed to beat, and it is the one
        not reported.
      direction_of_the_omission: >-
        FAVOURABLE to the amendment's conclusion, which is why it is a
        completeness objection rather than a correctness one. Order of
        magnitude: at 36-bit seed 2 with K = 10 the multi-target total is about
        7e5 group operations against S_rel = (N/B)*T_desc = 7.72e13 for the IC
        precomputation alone, and even at the maximum admissible K = N the
        multi-target total stays near 4e10, three orders below S_rel. So
        K* = infinity against this baseline too, at every admissible K.
      honesty_note: >-
        I state the constant c as "near 1" and do not assert a precise value.
        The exact constant must be taken from the cited source (van
        Oorschot-Wiener, J. Cryptology 12(1), 1999; Kuhn and Struik, SAC 2001)
        and not from this report. The order-of-magnitude conclusion does not
        depend on it.
      required_repair: >-
        Add E2c: one closed-form column per instance for multi-target rho at the
        committed K = 10 and at K = N, with the constant cited to a knowledge
        entry, and extend KN-LIT-012 / KN-TECH-006 (or add a new entry) to
        record the multi-instance result. Zero runs.

    - id: RT-012-BO-4
      severity: blocking
      title: >-
        Declined objection D1 (CTRL-I, s3_eval filter completeness) must be
        adopted; the stated reason for declining is factually incorrect.
      detail: See Q5. The Coordinator invited this overrule; I issue it.
      required_repair: >-
        Fold CTRL-I into the existing primary-arm enumeration loop as one
        s3_eval assertion per enumerated point at all 34 instances, and restate
        f2_reachability.statement as "unreachable by determinism of
        _find_decomposition on frozen inputs, conditional on H3, with H3
        validated in-run by CTRL-I" rather than "by construction and not by
        assumption".

    - id: RT-012-NB-1
      severity: non_blocking
      title: >-
        Heuristic H2's status is mis-stated: it is testable at high N and it
        deviates, in the anti-conservative direction.
      detail: >-
        H2 is recorded SUPPORTED_AT_LOW_N_UNTESTABLE_AT_HIGH_N, and D4 declines
        the null-model comparison partly on that ground. What is untestable at
        high N is the 10-TARGET empirical yield; the exact |S intersect <P>| is
        computed exactly at every instance and is fully testable. I pinned #E
        via the unique multiple of N inside the Hasse interval at the four
        headline instances, confirming the cofactors h = 2, 4, 16, 3 that Z6
        attributes to RT-20260727-001, and compared |S intersect <P>| against
        the uniform null |S|/h with sd = sqrt(|S| * (1/h) * (1 - 1/h)):
        (36,2) observed 200 vs null 196.0, z = +0.40;
        (36,5) observed 132 vs null 98.0,  z = +3.97;
        (36,10) observed 24 vs null 24.5,  z = -0.10;
        (36,11) observed 158 vs null 130.7, z = +2.93.
        Two of the four decision-bearing instances show a resolvable POSITIVE
        enrichment of S in the prime-order subgroup. This is the classic
        random-model transfer failure: S is a structured, negation-closed image
        of signed pair sums over a fixed 14-element set, not a uniform random
        subset of E.
      direction: >-
        ANTI-CONSERVATIVE for the confound claim - enrichment makes P_dec LARGER
        than the counting model predicts, which favours H-IC-001. The magnitude
        (1.2x to 1.4x) is nowhere near the ~7 orders of magnitude at stake, so
        it does not change the conclusion. It does refute the amendment's
        implicit framing that every unvalidated assumption here points the
        conservative way.
      cheapest_control: >-
        One extra column: #E per instance (already needed for
        min(392, #E - 1) and for subgroup_uniqueness_flag) and the null
        |S|/h beside the measured |S intersect <P>|. Zero new computation.

    - id: RT-012-NB-2
      severity: non_blocking
      title: SC2's first clause is a tautology and is not disclosed as one.
      detail: >-
        p_dec_exact_subgroup = |S intersect <P>| / N and the repaired bound is
        min(1, |S|/N). Since |S intersect <P>| <= |S| by definition and the cap
        makes the bound at most 1, the inequality holds identically and can
        never fail. After R1 and R3, SC2 = (tautology) AND (reproduction) AND
        (reproduction). The amendment's SC2_empirical_content_note correctly
        discloses clause 2 as reproduction but leaves clause 1 presented as a
        test, and v1's empirical_content_disclosure still lists SC2 among the
        "genuinely empirical content".

    - id: RT-012-NB-3
      severity: non_blocking
      title: An adjudicable arithmetic disagreement is left recorded as UNRESOLVED.
      detail: >-
        The 3232 versus 3240 cube-root disagreement is settled by three integer
        multiplications. Leaving it open in a design record that governs
        execution is an unmade computation, not honest uncertainty. 3232 is
        correct.

    - id: RT-012-NB-4
      severity: non_blocking
      title: A free verification was declined as unverifiable.
      detail: >-
        verified_source_record says the naive-mode per-instance attribution "is
        NOT independently verified in this record and is not asserted". It is
        one aggregation over files the census already reads. I verified it: the
        naive-mode per-instance counts equal the fixed-mode counts exactly
        (9, 9, 10, 1, 2, 2, 1). Recording it costs nothing and gives CTRL-G a
        second, independent expectation table.

    - id: RT-012-NB-5
      severity: non_blocking
      title: Evidence records still carry run_ids [] (D5).
      does_it_block_this_review: NO
      detail: >-
        I confirm at e0db8ef7 that ledger/evidence/EV-IC-001.yaml,
        EV-STR-002.yaml and EV-GGM-001.yaml all carry `run_ids: []` while citing
        748, 22 and 9 runs, so AGENTS.md rule 10 is unmet for those three
        records. This is not a defect of the amended EXP-IC-002 protocol and
        does not block adjudicating this design; the amendment routes it
        correctly to TASK-20260727-009 with EV-IC-002.run_ids as a required
        deliverable. It DOES block promotion of any conclusion that cites those
        three evidence records as support, and the eventual EV-IC-002 must not
        repeat it.

  required_controls:
    - id: CTRL-I
      what: >-
        Inside the existing primary-arm enumeration, for every point Q reachable
        as s1*A_i + s2*A_j, assert s3_eval(a, b, v_i, v_j, x(Q), p) == 0. Report
        the count of violations per instance; any nonzero count is an
        s3_eval filter-incompleteness finding.
      cost: >-
        About 392 modular evaluations per instance, about 13,300 total, inside a
        loop the primary arm already runs. No new arm, no new run, no new
        instance, no new timing.
      expected_outcome_from_my_own_read_only_probe: 0 violations at all 34 instances.
    - id: E2c
      what: >-
        Closed-form multi-target rho baseline (van Oorschot-Wiener /
        Kuhn-Struik, about c*sqrt(K*N) total for K targets in one group) per
        instance at K = 10 and at K = N, with the constant cited to a knowledge
        entry rather than asserted.
      cost: Zero runs; one arithmetic column.
    - id: NULL-MODEL-COLUMN
      what: >-
        Report #E and the uniform null |S|/h beside the measured
        |S intersect <P>| at every instance, with the deviation in standard
        deviations. This is the cheapest experiment that exposes the systematic
        deviation of the structured set S from the uniform-random-subset model
        H2 assumes.
      cost: Zero new computation; #E is already required for min(392, #E - 1).
    - id: PREREGISTERED-CTRL-E2-TABLE
      what: >-
        Pre-register all 34 CTRL-E2 rows as an implementation-defect check
        (disagreement = defect, never a result), replacing the single-instance
        cross-check at 2287.
      cost: Zero runs.
    - id: EXPLORATORY-LABEL-PROPAGATION
      what: >-
        Require confirmatory_status exploratory_only to be emitted beside every
        SC verdict in raw-result.json, stdout.log and observations.md, not only
        in EV-IC-002.
      cost: One field.

  counterexample_or_mutation: >-
    The cheapest discriminating mutation, and the one that would have caught
    both blocking metric objections before the amendment was written, is to
    execute the primary arm's declared computation as a read-only derivation
    against the committed records BEFORE freezing the criteria: enumerate S,
    intersect with <P>, reconstruct T_attempt from the committed medians and
    calibrations, and evaluate SC1-SC4 and F1-F4 on paper. I did exactly that in
    about a minute. It returns SC1 clause 2 = FAIL by 2.6%, SC4 = FAIL at
    Spearman 0.8143, F3 = FIRES, and CTRL-I = clean at all 34 instances. Any
    criterion whose value that derivation already fixes is not a
    pre-registration, whatever label it carries; any criterion the derivation
    leaves open is the experiment's real content. On this design the derivation
    leaves open only CTRL-A's membership-predicate check, CTRL-C's B' rebuild,
    and the durability of the artifacts.

  baseline_comparison:
    regime: >-
      Fixed toy curve over F_p, 8-36 bit p, prime subgroup order N from 5 to
      3.377e10, K = 10 committed targets per curve, B = 14, m = 2, cost unit =
      group-operation equivalents under EXP-IC-001's own calibration.
    pollard_rho_single_target: >-
      About 0.886*sqrt(N) group operations, negligible memory (KN-TECH-006). At
      36-bit seed 2, sqrt(N) = 183757, so about 1.63e5 operations per target.
      The uncharged IC descent T_desc = 32021 beats it per target, which is the
      whole basis of the DEC-20260726-005 crossover; the yield-charged descent
      is at least 2.76e12, losing by seven orders of magnitude.
    bsgs: >-
      2*ceil(sqrt(N)) = 367514 operations with 183757 stored elements at the
      same instance. Same order as rho, with memory that rho does not pay.
      Single-target, so not the right baseline for a K-target claim.
    closest_specialized_baseline_1_exhaustive_table_E2a: >-
      N - 1 = 3.377e10 offline additions, N stored elements, 0 online per
      target. IC's relation-collection precomputation alone is S_rel/N = 2287
      times that. IC loses before a single target is descended.
    closest_specialized_baseline_2_generic_preprocessing_frontier_E2b: >-
      S*T^2 = Omega~(eps*N) (KN-LIT-013, tight); at S = T = N^(1/3) = 3232 the
      online cost is 3232 operations per target with 3232 advice elements. The
      uncharged IC descent 32021 loses by 9.9x per target, and
      k_star_vs_frontier = infinity at all 34 instances because
      N^(1/3) - T_desc - T_verify < 0 everywhere.
    closest_specialized_baseline_3_multi_target_rho_MISSING: >-
      About c*sqrt(K*N) total for K targets in one group, about c*sqrt(N/K) per
      target, c near 1 (constant to be taken from van Oorschot-Wiener 1999 /
      Kuhn-Struik 2001, not from this report). At K = 10 and 36-bit seed 2 this
      is roughly 7e5 operations total, against S_rel = 7.72e13 for IC's
      precomputation alone; even at K = N it stays near 4e10, three orders below
      S_rel. So K* = infinity against this baseline too. This is the tightest
      baseline in the actual operating regime and it is in neither CTRL-E nor
      CTRL-E2. See RT-012-BO-3.
    memory_beside_time: >-
      Recorded because a time-only comparison would be incomplete. IC: N stored
      relations is not what EXP-IC-001 measures; S_rel is a time heuristic
      (N/B)*T_desc with no memory column at all, which the design should state.
      Exhaustive table: N elements. CGK frontier: N^(1/3) advice elements. rho:
      negligible with distinguished points. BSGS: sqrt(N). Only the exhaustive
      table's memory is prohibitive, and it still beats IC on time by 2287x.

  heuristic_challenges:
    - id: H1
      challenge: >-
        Correctly recorded FALSE_AS_STATED, and I confirm the (8,3) degeneracy:
        2 distinct targets out of 10. The required reporting of an effective
        distinct-target count is the right repair. No objection.
    - id: H2
      challenge: >-
        Status is wrong and the decline of D4 rests on it. See RT-012-NB-1: the
        exact intersection IS testable at high N and shows a resolvable positive
        deviation at 2 of the 4 decision-bearing instances (z = +3.97, +2.93).
        Random-model transfer fails for a structured, negation-closed set of
        signed pair sums, in the direction that makes the yield larger than the
        counting model predicts.
    - id: H3
      challenge: >-
        The derivation sketch is correct and I confirm it, but the status
        PROVABLE_UNPROVED_UNTESTED is load-bearing for the removal of the only
        falsifier at the decision-bearing instances. See RT-012-BO-4. I ran the
        test read-only at all 34 instances: 0 violations. Requiring it in-run
        costs one assertion.
    - id: H4_unnumbered
      challenge: >-
        UNNUMBERED ASSUMPTION, and by the amendment's own standard that is an
        objection. The whole design assumes the EXP-IC-001 calibration factor
        (total_group_operations / wall_seconds from a matched rho run) converts
        Groebner wall time into group-operation equivalents faithfully. The
        committed calibrations span 554,930 to 1,477,926 ops/s, a 2.66x spread.
        Z1 concedes this moves the UNCHARGED crossover threshold in N by 7.1x
        and D3 declines to test it. The amendment numbers H1-H3 but not this
        one, even though it is the assumption DEC-20260726-005's crossover rests
        on most directly. It should be numbered H4 with its status and direction
        stated, whether or not D3 stays declined.

  cost_model_challenges:
    - >-
      Per-attempt versus total expected cost is handled correctly and is the
      point of the experiment: T_desc_charged = T_attempt / P_dec is
      per-attempt cost times inverse success probability, and the R3 floor
      correctly prevents the "lower bound" from falling below one attempt. This
      is the design's strongest conceptual move. My objection is only that its
      threshold-crossing consequence for SC4 is undisclosed (RT-012-BO-1).
    - >-
      S_rel is charged UNCHARGED by deliberate design (Z2), so k_star_charged is
      a single-factor attribution figure. Z2's label repair is correct and the
      direction claim is correct (charging S_rel too can only raise K*). No
      objection.
    - >-
      Memory is absent from the IC side of every comparison. S_rel = (N/B)*T_desc
      is a time heuristic with no companion memory term, while both multi-target
      baselines are stated with explicit memory (N elements, N^(1/3) advice).
      A cost model that gives the baseline a memory column and the candidate
      none is not symmetric. The direction is favourable to the candidate, so
      this is a completeness objection.
    - >-
      No o(1)/polylog accounting is needed or claimed here because no asymptotic
      claim is made; the costs are concrete per-instance integers. Confirmed
      that the amendment makes no asymptotic claim.
    - >-
      The van Oorschot-Wiener time-memory interpolation is not applicable in the
      usual sense (there is no p^{1/3} claim to interpolate back from), but its
      MULTI-TARGET counterpart is the missing baseline of RT-012-BO-3.

  reduction_and_scope_challenges:
    - >-
      KN-LIT-013 (Corrigan-Gibbs and Kogan, EUROCRYPT 2018) is validly
      instantiated. I read the entry at this commit: it states
      S*T^2 = Omega~(eps*N) for a group of prime order N and that the bound is
      essentially tight via a matching generic algorithm. E2b uses exactly that
      and balances at S = T = N^(1/3). The hypotheses transfer: the instances
      are prime-order subgroups and the comparison is generic. E2b's own caveat
      that the CGK offline phase is unbounded, so this is an online-cost and
      advice-size comparison only, is correct and necessary; E2a supplies the
      bounded-offline comparison.
    - >-
      No published reduction is invoked to produce a corollary here, so there is
      no reduction-instantiation error to find. The scope statements are
      correspondingly narrow.
    - >-
      No affected-versus-safe scheme list is offered, and none should be: at
      35 bits maximum there is no scheme scope to state. Absence of scope
      inflation confirmed.
    - >-
      One scope statement I checked and found accurate: the amendment does not
      claim to correct the immutable EV-IC-001 / DEC-20260726-005 /
      analysis.md text, routes that to a ledger/corrections/ superseding record
      at TASK-20260727-009, and edits only the living goal record in place.
      That is the correct handling under AGENTS.md rule 4.

  narrowest_supported_statement: >-
    At commit e0db8ef7, EXP-IC-002 specification.yaml v1 as amended by
    amendments/v1_to_v2.yaml is a materially improved but not yet executable
    protocol. What is independently established here, without any EXP-IC-002
    run: (1) the EXP-IC-001 census is 748 runs, 68 decompositions, 612 trivial
    ideals, with 0 decompositions across all 500 runs at field_bits >= 20, and
    the per-instance fixed-mode table 9/9/10/1/2/2/1 at (8,1),(8,2),(8,3),
    (12,1),(12,2),(12,3),(16,3) - confirmed exactly, third independent reading;
    (2) the reachable-set bound is 392, not 420, and it is attained at 24 of the
    34 instances, so |S| does not grow with N beyond 392 and F1 is unreachable;
    (3) against both multi-target baselines CTRL-E2 supplies, and against the
    multi-target rho baseline it omits, the B = 14, m = 2 fixed-curve
    index-calculus configuration of EXP-IC-001 never amortizes at any admissible
    K at any of the 34 instances, uncharged, by closed-form arithmetic on
    committed numbers; (4) the s3_eval pre-filter is empirically complete at all
    34 instances. All of this is toy-tier, confined to 8-36 bit primes with
    N <= 3.377e10, B = 14, m = 2, one solver stack, and is evidence about one
    parameterization of one experiment and about nothing else. No asymptotic
    exponent moves in any direction, and nothing here approaches, or bears on,
    a target-class result.

