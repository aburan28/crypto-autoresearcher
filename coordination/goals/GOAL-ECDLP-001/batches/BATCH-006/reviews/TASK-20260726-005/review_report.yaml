  control_gate_review:
    finding: UNSOUND_AS_SPECIFIED
    summary: >-
      The control gate is the specification's declared precondition for trusting
      any augmented-oracle verdict ("The control gate is binary: 4/4 correct or
      the test fails"). It cannot discharge that function. All four controls are
      extremal cases of the generic group model, the correct answers for all four
      are printed inside the frozen file the implementer reads, and a classifier
      with no mathematical content passes 4/4 while disagreeing with the
      specification on the augmented oracles the experiment exists to decide.
    controls_are_all_extremal: >-
      pure_generic IS the model's native oracle; public_curve IS the model's
      declared public setup; discrete_log IS the exact object Shoup's lower bound
      is about; encoding (x-coordinate) IS the textbook definition of
      encoding-dependence. Not one control sits near a decision boundary. A test
      may be wrong about every non-extremal oracle and still score 4/4. Control
      soundness is only demonstrated by controls that are hard for the test.
    trivial_classifier_that_passes_4_of_4:
      rule: >-
        SIMULABLE if and only if the declared output_format is a group element or
        is a member of the declared public_data list; otherwise NON-SIMULABLE.
        This rule never reads computational_procedure, never constructs a
        simulator, and never counts a group operation.
      control_results:
        pure_generic: "output P+Q is a group element -> SIMULABLE (matches expected)"
        public_curve: "output (a,b,p,N) is declared public data -> SIMULABLE (matches expected)"
        discrete_log: "output integer k is neither -> NON-SIMULABLE (matches expected)"
        encoding: "output x-coordinate is neither -> NON-SIMULABLE (matches expected)"
      score: "4/4 -- the control gate passes"
      augmented_oracle_results_under_the_same_rule: >-
        jet -> NON-SIMULABLE (the eps-block is neither a group element of E(F_p)
        nor declared public data), contradicting expected_verdict SIMULABLE;
        elliptic_net -> NON-SIMULABLE (W(a,b) is a field value, not declared
        public data), contradicting expected_verdict SIMULABLE; incidence ->
        verdict depends on whether the factor base is typed as public data, so
        the rule is undetermined there; endomorphism -> SIMULABLE (phi(P) is a
        group element), matching expected_verdict.
      consequence: >-
        A content-free classifier passes the gate and then disagrees with the
        specification on at least two of the four subjects under test. Therefore
        4/4 on this control set carries no information about whether the test
        will be right on the augmented oracles. The gate and the subjects are not
        in the same difficulty class.
    missing_control_classes:
      - >-
        Bounded-overhead boundary control. No control exercises the overhead
        branch at all: pure_generic is asserted C=1, public_curve C=0, and the
        two NON-SIMULABLE controls never reach an overhead check. The metric
        simulator_overhead_C and H-GGM-001 falsification condition 4 ("C grows
        with N") are therefore untested by the gate. A required control is an
        oracle that IS generically computable but only with Theta(log N)
        operations, e.g. query = (P, m) -> m*P with m supplied in binary.
      - >-
        Statistical-versus-perfect simulation control. The specification never
        says whether simulation must be exact or is permitted up to negligible
        statistical distance. An oracle returning a fresh consistent random label
        for each queried element would probe this; none of the four does.
      - >-
        Public-but-non-generic control. The endomorphism oracle's stated basis is
        the inference "public and computable from curve parameters, hence
        simulable". That inference is false in general and no control tests it. A
        Weil-pairing-value oracle on a pairing-friendly curve is public,
        computable from the curve, and paradigmatically non-generic; it is the
        control that would catch the inference.
    fix: >-
      (1) Remove the answer key from the test's input (see BO-1). (2) Add at
      minimum the three control classes above so that every decision axis has a
      control on each side, and restate the gate as "correct on every control on
      both sides of every axis", not "4/4 on four extremal cases". (3) Require
      the run record to report, for each control, WHICH branch of the test
      produced the verdict, so that a verdict reached by the wrong branch is
      visible as a gate failure rather than a pass.

  simulator_construction_review:
    finding: NOT_AN_ALGORITHM_AS_SPECIFIED
    specified_method_quoted: >-
      "For each query type, the test attempts to express the oracle's answer as a
      function of (a) group-operation results and (b) equality tests, without
      reference to the concrete encoding. If the answer can be so expressed with
      a bounded number of group operations (counted statically from the
      construction), the query type is simulable. If the answer provably depends
      on encoding-specific data (exhibited by the witness pair), it is
      non-simulable."
    decidability_analysis: >-
      The input to this procedure is oracle_specification_schema's
      computational_procedure, defined as "pseudocode or Python describing how
      the oracle computes its answer from the concrete encoding". Deciding
      whether an arbitrary program of that kind is extensionally equal to some
      program in a restricted basis, over an unbounded input domain (all primes
      p, all curves, all point tuples), is a program-equivalence question for a
      Turing-complete language. It is undecidable in general (Rice), and even the
      positive half is a universally quantified statement over an infinite domain
      rather than a finite search. There is no algorithm meeting the
      specification's description. The specification names a research task and
      then labels the artifact that would result from performing it by hand as a
      "machine-checkable test".
    failed_search_versus_proof: >-
      The specification does not distinguish them. Its two branches are "can be
      so expressed" and "provably depends on encoding-specific data", but the
      procedure it describes can only ever report "my search did not find an
      expression". Absence of a found simulator is not a proof of
      non-simulability, exactly as docs/evidence-and-reproducibility.md's
      negative-result semantics require and as AGENTS.md rule 5 requires for
      failures. The specification has no third verdict, so every failed search is
      silently promoted to NON-SIMULABLE -- which is the more consequential
      direction, since a NON-SIMULABLE verdict is reported as a non-generic
      signal requiring further review.
    output_type_gap: >-
      A generic-group algorithm's outputs are group-element labels and the bits
      returned by equality tests. Three of the four augmented oracles and two of
      the four controls have answers that are not group elements (a ring element
      in F_p[eps]/eps^2, a field value W(a,b), a list of index tuples, an integer
      k, a coordinate in F_p). The specification never states how a simulator is
      permitted to produce a non-group-element answer, which is precisely where
      the whole question lives.
    fix: >-
      Replace computational_procedure with a typed answer-form declaration drawn
      from a closed grammar, and decide membership in that grammar instead of
      searching for a program. For example:
      answer_form ::= group_element(sle) | public_datum(name) |
      boolean(equality_test_expr) | integer_from_public(expr) |
      concrete_coordinate(...) | external(...) ;
      sle ::= input_i | sle + sle | c * sle, with c a declared N-independent
      public constant. Then SIMULABLE iff the declaration parses into one of the
      first four productions AND the straight-line expression's operation count
      -- with every scalar multiple c expanded to ceil(log2 c) doublings plus
      additions, not counted as one operation -- is bounded by C and independent
      of N. concrete_coordinate yields NON-SIMULABLE. external yields a third
      verdict UNDETERMINED, which must be added: a failed or out-of-grammar
      analysis is reported as undetermined and referred for hand adjudication,
      never as NON-SIMULABLE.

  witness_review:
    finding: DEFINITION_UNSOUND_AND_INADEQUATE_TO_ITS_OWN_PRIMARY_CONTROL
    definition_quoted: >-
      "an encoding pair (E_1, E_2) that are generic-model-indistinguishable but
      yield different O-answers".
    defect_1_divergence_without_equivariance_is_vacuous: >-
      Taken literally, the criterion is satisfied by the pure_generic control
      itself. Let E_1 be any labelling of E(F_p) and E_2 = pi o E_1 for a
      permutation pi of labels. The group-operation oracle's answer, read as a
      label string, differs between E_1 and E_2 on the same abstract inputs.
      Under "different O-answers", pure_generic produces a witness and is
      classified NON-SIMULABLE -- the specification's own declared false-positive
      falsifier. The property actually intended is EQUIVARIANCE: a simulable
      oracle satisfies O_{pi o E}(pi(x)) = pi(O_E(x)) (with pi acting trivially
      on non-group answer types), and a witness is a failure of equivariance, not
      a difference of answers. The specification never states equivariance, so
      the criterion is either vacuous or depends on an unstated convention.
    defect_2_indistinguishability_is_undefined_and_unquantified: >-
      "generic-model-indistinguishable" appears in H-GGM-001, IDEA-20260726-004,
      and EXP-GGM-001 without a definition. Indistinguishable to an adversary
      making how many queries, at what advantage, over what distribution of
      encodings? The specification's own gloss -- "same abstract group element
      under different labelings" -- is weaker than what is needed, because it does
      not require the transcript of equality tests over the algorithm's whole
      query history to agree. Without a stated predicate, "checkable by a third
      party" is not achievable: the third party has nothing to check against.
    defect_3_the_discrete_log_control_admits_no_witness_of_this_form: >-
      The two NON-SIMULABLE controls fail for two different reasons and the
      single witness format fits only one of them. The x-coordinate oracle's
      answer is genuinely not a function of the abstract group: two realizations
      of Z_N assign different x-coordinates to the same abstract element, so an
      encoding-pair witness exists. The discrete-log oracle's answer IS a function
      of the abstract group: if b = k*a in Z_N, then k is determined by the
      abstract pair and is identical under every encoding. Its non-simulability
      is a query-complexity fact (Shoup's Omega(sqrt(p))), not an
      encoding-dependence fact. Consequently the specification's own
      expected_witness for that control -- "Any two encodings E_1, E_2
      representing the same abstract group element relationship but requiring
      different k" -- describes an object that cannot exist: if the abstract
      relationship is the same, k is the same. The control declared "the primary
      unsoundness falsifier" (H-GGM-001 falsification_conditions item 1) is the
      one control for which the mandated certificate is unconstructible.
    consequence_for_the_gate: >-
      The realistic execution path is that the test emits NON-SIMULABLE for the
      discrete-log control without a well-formed witness, and the gate records a
      pass. The control would then have passed by assertion of a fact everyone
      already knows and which the frozen file states in three separate places,
      not by the test detecting anything.
    verify_witness_independence_analysis: >-
      docs/claims-and-verification.md's certificate discipline works for ECDLP
      because the claim is in NP with a recomputation checker. A non-simulability
      witness is not of that shape. Its first conjunct -- O(E_1) != O(E_2) -- is
      genuinely certificate-like and can be recomputed independently. Its second
      conjunct -- E_1 and E_2 are generic-model-indistinguishable -- is a
      universally quantified claim about all generic algorithms and cannot be
      established by recomputation at all. An independent verifier can only
      re-apply whatever definition it was given; if constructor and verifier
      share an unstated definition, a shared wrong definition passes both. So
      "re-verify with independent code" is achievable for one conjunct and not
      the other, regardless of who writes the code. The specification also
      contradicts itself on the mechanics: module_interface places verify_witness
      inside the test module while witness_verification_method requires "not the
      test module's own path".
    fix: >-
      (1) Define the witness as an equivariance failure and state the definition
      in the frozen specification. (2) Make indistinguishability a finite,
      third-party-checkable predicate: E_1 and E_2 are group isomorphisms
      Z_N -> E_i(F_{p_i}) and induce identical transcripts on an explicitly
      enumerated finite query set Q that is part of the frozen record. (3) Split
      the witness type by failure axis: an encoding-pair witness for
      encoding-dependence, and a stated operation-counting argument for
      overhead failures -- and require the discrete-log control to be classified
      via the overhead axis, where a witness of the encoding-pair kind is
      correctly reported as not applicable rather than fabricated. (4) Move
      verify_witness into a separate module authored by a different session that
      reads only the frozen predicate. (5) Record proof_status per conjunct:
      certificate for the divergence check, derivation for the
      indistinguishability argument; never a single blanket verified: true.

  specification_wording_review:
    finding: VERDICTS_ARE_WORDING_ARTIFACTS_AND_THE_FROZEN_WORDING_IS_NOT_NEUTRAL
    conceded_by_the_package: >-
      H-GGM-001 interpretation_limits item 5 and IDEA-20260726-004 confounder 1
      both state that a jet oracle worded as "return the eps-coefficient of P+Q"
      may receive a different verdict from one worded as "return the derivative
      of the addition map". The package files this as a confounder to be recorded
      rather than resolving it in the frozen text. For a test whose entire input
      is the wording, an unresolved wording dependence is not a confounder; it is
      the free parameter that sets the answer.
    the_frozen_jet_wording_is_the_coordinate_wording: >-
      The frozen jet specification reads "(P, Q) -> (P+Q, eps*(P+Q)) in
      F_p[eps]/eps^2 ... the first-order (dual-number / jet) part of the addition
      law". Written in this register the eps-block is affine coordinate data
      computed from the coordinates of P and Q -- the same register as the
      encoding control's x-coordinate, which the specification declares to be the
      paradigm of non-simulable. Any witness procedure that makes the encoding
      control return NON-SIMULABLE returns NON-SIMULABLE for this wording of the
      jet oracle too, and the witness will check on all three toy curves. The
      frozen wording therefore predetermines a verdict OPPOSITE to the frozen
      expected_verdict.
    same_defect_for_the_elliptic_net_oracle: >-
      W(a,b) as frozen is a field value on a concrete curve. Its expected_basis
      -- "Somos identities are universal" -- establishes that the values satisfy a
      curve-independent recurrence, not that the values themselves are
      reconstructible from group operations. Universality of the identities is
      not simulability of the values; the frozen wording again drives
      NON-SIMULABLE against the frozen expectation.
    the_protocol_has_no_third_branch: >-
      When the frozen wording and the frozen expected_verdict disagree, the
      protocol offers only two paths: report the wording-driven verdict (and
      manufacture a "non-generic signal" the program should be most skeptical
      of), or override the wording to match expected_verdict (answer-key
      fitting). Nothing in the specification detects or reports that the two
      diverged.
    expected_verdict_fields_bias_the_test: >-
      Yes, and structurally rather than psychologically. expected_verdict and
      expected_basis for all four augmented oracles, and expected_verdict plus
      expected_overhead and role for all four controls, are inside the frozen
      inputs and controls blocks -- the same file the Executor must read to build
      the test. There is no blinding provision anywhere in the specification. The
      required oracle_specification_hash cannot separate the question from the
      answer, because the hashed text contains both.
    fix: >-
      (1) Fix the register explicitly in the frozen specification: state, per
      oracle, whether the answer is presented in affine coordinates or as a
      basis-free object, and freeze BOTH wordings as separate subjects where the
      distinction is live (jet-coordinate and jet-intrinsic as two entries). A
      divergence between them is the experiment's most informative possible
      output and should be a first-class reported result, not a confounder note.
      (2) Physically split each oracle record into a specification file that is
      hashed and given to the test, and a sealed expectation file that is hashed
      separately, withheld from the implementer and the test, and opened only
      after all eight verdicts are emitted and recorded.

  decidability_and_reachable_negative_review:
    finding: FALSIFICATION_CRITERION_IS_FORMALLY_DECIDABLE_BUT_PRACTICALLY_UNREACHABLE
    experiment_falsification_criterion_quoted: >-
      "Any of the four controls is misclassified ... A single control
      misclassification falsifies the test's soundness."
    formal_decidability: >-
      Decidable: eight emitted verdicts compared against four expected values is
      a finite comparison. This is a genuine improvement over designs whose
      criteria are not even well-formed.
    practical_unreachability: >-
      The four expected control verdicts are stated in the frozen specification
      (expected_verdict), restated in each control's role field, and restated a
      third time in H-GGM-001's predictions. The classification routine is not an
      algorithm (see simulator_construction_review), so the emitted verdicts will
      be whatever the implementer encodes, and the implementer is required to read
      the file containing the answers. The criterion can be reached only by an
      implementer who both builds a genuine decision procedure and then gets one
      of the four easiest oracles in the model wrong. Its non-reachability is
      therefore not evidence of soundness.
    narrowing_relative_to_the_hypothesis: >-
      H-GGM-001 lists four falsification conditions. EXP-GGM-001's
      falsification_criterion retains only the control-gate subset. Condition 3
      (no checkable witness) is demoted to alternative_outcome, where it is
      explicitly declared not to falsify. Condition 4 (C grows with N) is dropped
      from the falsification criterion entirely and reappears in
      analysis_methodology.overhead_growth_check as an instruction to "reclassify
      as effectively non-simulable" -- converting a falsifier of the hypothesis
      into a verdict adjustment the protocol absorbs. As the sole test of
      H-GGM-001, the experiment is thereby harder to falsify than the hypothesis
      it tests.
    overhead_growth_check_is_vacuous_as_written: >-
      simulator_construction_method defines C as "counted statically from the
      construction". A statically counted operation count is a property of the
      construction, not of the instance, so it cannot vary across 8, 12, and 16
      bit curves. overhead_growth_check therefore compares a constant to itself
      three times and will report stability unconditionally. The single mechanism
      that could detect Theta(log N) overhead is disabled by the specification's
      own definition of the quantity it measures. Even if C were measured
      dynamically, three points spanning a factor of two in log N, with no fit
      procedure and no threshold, is not a decidable growth test.
    fix: >-
      (1) Restore all four H-GGM-001 falsification conditions as experiment
      falsification criteria, including "C grows with N", and remove the
      reclassification escape hatch. (2) Measure C dynamically per instantiated
      curve with scalar multiplications expanded into doublings and additions.
      (3) Add the boundary controls named in control_gate_review so that
      misclassification is a live possibility. (4) Add a third verdict
      UNDETERMINED so a failed analysis has somewhere to go other than
      NON-SIMULABLE.

  overhead_criterion_review:
    finding: CRITERION_IS_MIS_SPECIFIED_AND_TWO_AUGMENTED_ORACLES_FAIL_IT_ON_THEIR_OWN_STATED_BASES
    conflation: >-
      The criterion "C bounded by a constant independent of the group order N
      (target C <= 10)" does not distinguish dependence on N from dependence on
      the query's own input size. The incidence oracle takes a factor base of
      size B as part of its query, so its cost is a function of B; the criterion
      has no vocabulary for that and silently permits it.
    endomorphism_oracle_argument: >-
      The frozen expected_basis is "The endomorphism is public and computable
      from the curve parameters (part of the generic model's public setup), hence
      simulable". In Shoup's encoding model an algorithm holds opaque labels, so
      being able to write phi as a rational map on affine coordinates does not let
      it act on a label. The simulator must produce the label of phi(P) from the
      label of P. On the prime-order subgroup phi acts as multiplication by an
      eigenvalue lambda, a residue mod n that is generically full-size (GLV's
      speedup comes from decomposing k = k_1 + k_2*lambda with small k_i, not from
      lambda being small). A generic algorithm reaches only {c*P} for c in a set
      of size at most 2^t after t operations, so producing lambda*P requires
      Omega(log lambda) = Omega(log N) group operations. Under the
      specification's own N-independence requirement this oracle is not
      O(1)-simulable, while its frozen expected_verdict is SIMULABLE and its
      stated basis is an inference ("public, hence simulable") that is not a
      simulability argument. This is a derivation-level argument offered for
      independent checking, not a theorem claim.
    incidence_oracle_argument: >-
      The frozen expected_basis is that decompositions are "computed via group
      operations (summing factor-base points and comparing to R)". True, and the
      cost of doing so -- and in particular of certifying the returned list is
      complete -- is Theta(B^m) sums and equality tests under the model's own
      accounting. That exceeds C <= 10 for any B >= 4 at m = 2, and it is not a
      constant. Its expected_verdict SIMULABLE is inconsistent with the frozen
      overhead threshold in the same file.
    fix: >-
      Define C as C(N, |query input|); require N-independence explicitly and
      declare the permitted input-size dependence explicitly; count scalar
      multiplication as ceil(log2 c) operations rather than one; and require every
      SIMULABLE verdict to exhibit the operation count term by term in the run
      record so a reviewer can check it against the construction.

  claim_boundary_review:
    note: >-
      TASK-20260726-006 is chartered to attack claim_tier_basis directly. This
      section records only what bears on whether the protocol may be executed as
      written, and does not attempt that session's job.
    what_is_correct: >-
      The logical form is not wrong. An explicitly exhibited O(1) simulator plus
      Shoup's theorem is a scale-independent argument, and
      docs/claims-and-verification.md already provides the right label for it:
      proof_status: derivation, "a checkable argument, not a machine-verified
      proof -- label it derivation, never proved". The specification is right that
      such a verdict is not toy-tier empirical evidence.
    defect_1_tier_and_proof_status_are_conflated: >-
      claim_tier is a function of the instances actually tested; proof_status is
      the strength of the supporting artifact. They are different fields with
      different rules. claim_tier_basis instructs that "a SIMULABLE verdict from
      this experiment is NOT limited to toy tier", using proof_status to relax the
      tier ceiling, while docs/claims-and-verification.md states that
      derivation-level status "does not relax the ceiling above".
    defect_2_shoup_qualifier_dropped: >-
      "Closes the candidate at exponent 1/2" is stated unconditionally in both
      objective and claim_tier_basis. Shoup's bound constrains GENERIC
      adversaries. A SIMULABLE verdict says an adversary given that oracle is no
      stronger than a generic one, so the bound applies within that model; it does
      not close the candidate as a research direction, because a real attack need
      not be generic. KN-TECH-005 says exactly this: "The bound is a barrier, NOT
      a proof that no non-generic attack exists."
    defect_3_pre_committed_interpretation: >-
      analysis_methodology.scale_independence_note requires analysis.md to state,
      for each SIMULABLE verdict, that the result is a mathematical closure valid
      at all scales -- written into the contract before any verdict exists. A
      frozen protocol may pre-commit to metrics and decision rules; pre-committing
      to the interpretation of a result not yet obtained is the same defect as
      pre-committing the expected verdicts.
    defect_4_toy_curves_are_load_bearing_for_negatives: >-
      claim_tier_basis says toy curves "serve only to make witnesses concrete".
      For every NON-SIMULABLE verdict the witness IS the entire basis, so 8-16 bit
      realizations are load-bearing, and such a verdict is a toy-tier claim about
      specific realizations unless the indistinguishability argument is supplied
      in general form.
    no_crypto_scale_claims: true
    no_live_key_or_deployed_target: true
    no_breakthrough_claim_endorsed_by_this_review: true
    no_universal_impossibility_claim_endorsed_by_this_review: true
    fix: >-
      Set claim_tier from tested instances (toy, or not_applicable for the purely
      argumentative component) and carry scale-independence in proof_status:
      derivation with the derivation archived as an artifact; restore the
      generic-adversary qualifier everywhere "closes at exponent 1/2" appears;
      and replace scale_independence_note with a neutral reporting requirement --
      state the model, the overhead bound actually established, and the class of
      adversaries the bound covers, and assert scale-independence only where an
      explicit simulator construction with an N-independent operation count has
      been exhibited.

  blocking_objections:
    - id: BO-1
      title: "Answer-key contamination: all eight expected verdicts are inside the test's own frozen input"
      severity: critical
      detail: >-
        expected_verdict and expected_basis for the four augmented oracles, and
        expected_verdict, expected_overhead, and role for the four controls, all
        live in experiments/EXP-GGM-001/specification.yaml, which the Executor
        must read to implement classify_oracle. There is no blinding provision.
        oracle_specification_hash hashes question and answer together and so
        cannot detect the contamination it would otherwise be useful against.
      fix: >-
        Split each oracle into a specification file (hashed, supplied to the
        test) and a sealed expectation file (hashed separately, withheld from the
        implementer and the test, opened only after all eight verdicts are
        emitted and recorded). Record both hashes in the run manifest.
    - id: BO-2
      title: "Control gate has no discriminating power: a content-free classifier passes 4/4"
      severity: critical
      detail: >-
        All four controls are extremal cases. The rule "SIMULABLE iff the output
        is a group element or declared public data" passes 4/4 without ever
        constructing a simulator, and then disagrees with the specification on at
        least two of the four augmented oracles. No control exercises the
        overhead branch, the perfect-versus-statistical question, or the
        public-but-non-generic inference.
      fix: >-
        Add a Theta(log N)-overhead control (query = (P, m) -> m*P), a
        consistent-random-relabeling control for the statistical-simulation
        question, and a public-but-non-generic control (pairing-value oracle on a
        pairing-friendly curve). Restate the gate as correctness on both sides of
        every decision axis, and require each control's verdict to report which
        branch produced it.
    - id: BO-3
      title: "Two NON-SIMULABLE controls fail for different reasons; the single witness format fits only one"
      severity: critical
      detail: >-
        The x-coordinate oracle is non-simulable because its answer is not a
        function of the abstract group. The discrete-log oracle's answer IS a
        function of the abstract group and is identical under every encoding; its
        non-simulability is query complexity, not encoding dependence. The frozen
        expected_witness for the discrete-log control -- two encodings with the
        same abstract relationship but different k -- describes an object that
        cannot exist. The control declared the primary unsoundness falsifier is
        the one whose mandated certificate is unconstructible, so it will pass by
        assertion.
      fix: >-
        Split the verdict onto two axes: encoding-dependence (witness = an
        equivariance-violating realization pair) and query-overhead (witness = an
        explicit operation-counting argument). Classify every subject on both
        axes, require the discrete-log control to fail only the overhead axis and
        the encoding control to fail only the encoding axis, and permit
        "witness not applicable on this axis" as a well-formed, recorded outcome.
    - id: BO-4
      title: "Witness definition is unsound: divergence without equivariance, and undefined indistinguishability"
      severity: critical
      detail: >-
        "Different O-answers" is satisfied by relabelling the pure_generic
        control, which would make the specification's own false-positive
        falsifier fire on the model's native oracle. The intended property is
        failure of equivariance and is never stated.
        "Generic-model-indistinguishable" is used in three records without a
        definition, quantifier, query budget, or advantage bound, so it cannot be
        checked by a third party. verify_witness can recompute the divergence
        conjunct but cannot verify the indistinguishability conjunct by
        recomputation at all, so "independent code" delivers implementation
        independence without semantic independence; a shared wrong definition
        passes both paths. module_interface and witness_verification_method also
        contradict each other on whether the verifier lives inside the module.
      fix: >-
        State the equivariance-failure definition and a finite
        indistinguishability predicate (same induced transcript on an enumerated
        query set Q) in the frozen specification so the third party checks against
        text rather than code; put the verifier in a separate module written by a
        different session reading only that predicate; record proof_status per
        conjunct (certificate for divergence, derivation for
        indistinguishability) rather than one blanket verified flag.
    - id: BO-5
      title: "simulator_construction_method is an undecidable search presented as an algorithm"
      severity: critical
      detail: >-
        Deciding whether an arbitrary computational_procedure is extensionally
        equal to some bounded generic-basis program, over all primes, curves, and
        inputs, is program equivalence for a Turing-complete language -- no
        algorithm exists. The specification also provides no branch for "search
        failed", so absence of a found simulator is promoted to NON-SIMULABLE,
        violating negative-result semantics. It never states how a simulator may
        produce a non-group-element answer, which is where the question actually
        lives for six of the eight subjects.
      fix: >-
        Replace free-form computational_procedure with a closed answer-form
        grammar and decide membership in it (grammar given in
        simulator_construction_review.fix); add a third verdict UNDETERMINED for
        out-of-grammar or failed analyses, referred for hand adjudication and
        never reported as NON-SIMULABLE.
    - id: BO-6
      title: "O(1) overhead criterion is unenforceable, and two augmented oracles fail it on their own stated bases"
      severity: high
      detail: >-
        C is defined as statically counted from the construction, so it is
        constant across curve sizes by definition and overhead_growth_check
        cannot detect growth. The criterion also conflates dependence on N with
        dependence on the query's input size. On the specification's own stated
        bases, the endomorphism oracle requires Omega(log N) group operations to
        produce the label of lambda*P, and the incidence oracle requires
        Theta(B^m) sums and equality tests; both carry expected_verdict SIMULABLE
        against a frozen threshold of C <= 10 and N-independence.
      fix: >-
        Measure C dynamically per instantiated curve with scalar multiples
        expanded to ceil(log2 c) operations; define C(N, |input|) and state
        N-independence and permitted input-size dependence separately; require
        every SIMULABLE verdict to exhibit its operation count term by term;
        re-derive the endomorphism and incidence expectations under the corrected
        criterion before freezing v2.
    - id: BO-7
      title: "No reachable negative: the falsification set is narrowed to a gate that cannot fail"
      severity: high
      detail: >-
        EXP-GGM-001's falsification_criterion retains only H-GGM-001's
        control-gate falsifiers. Condition 3 is demoted to a non-falsifying
        alternative_outcome and condition 4 is converted into a reclassification
        instruction, so the experiment is harder to falsify than the hypothesis
        it is the sole test of. The retained gate is unreachable for the reasons
        in BO-1 and BO-2. This reproduces the structural defect BATCH-004 found
        in EXP-IC-001 (REV-20260726-003, BO-5, tautological success criterion) in
        a different guise.
      fix: >-
        Restore all four H-GGM-001 falsification conditions as experiment
        falsification criteria, delete the reclassification escape hatch, and add
        the BO-2 boundary controls so that misclassification is a live
        possibility rather than a formality.
    - id: BO-8
      title: "Protocol pre-commits its own interpretation and instructs relaxing the claim-tier ceiling"
      severity: high
      detail: >-
        analysis_methodology.scale_independence_note mandates that analysis.md
        assert scale-independent closure for each SIMULABLE verdict before any
        verdict exists. claim_tier_basis uses proof_status to lift claim_tier off
        toy, which docs/claims-and-verification.md forbids ("does not relax the
        ceiling above"). Both objective and claim_tier_basis drop Shoup's
        generic-adversary qualifier that KN-TECH-005 states explicitly.
      fix: >-
        Replace scale_independence_note with a neutral reporting requirement
        (state the model, the overhead bound actually established, and the
        adversary class covered); set claim_tier from tested instances and carry
        scale-independence via proof_status: derivation with an archived
        derivation artifact; restore the generic-adversary qualifier everywhere
        "closes at exponent 1/2" appears.

  non_blocking_objections:
    - id: NBO-1
      title: verify_witness is placed inside the module it is required to be independent of
      severity: medium
      fix: >-
        Move verify_witness to a separate module with its own commit and author,
        and reconcile module_interface with witness_verification_method. The
        substantive half of this issue is in BO-4.
    - id: NBO-2
      title: Verdict token is inconsistent between NON-SIMULABLE and NON_SIMULABLE
      severity: low
      fix: >-
        metrics and controls use NON-SIMULABLE with a hyphen; module_interface
        uses NON_SIMULABLE with an underscore. A machine comparison against
        expected_verdict will not match. Fix the enum in one place and reference
        it.
    - id: NBO-3
      title: Run, seed, and budget accounting are mutually inconsistent
      severity: low
      fix: >-
        command_template passes --seeds 1,2,3 in a single invocation while
        replication declares 3 independent instances and budget declares
        maximum_runs 3 at 120s each (360s), against a 1800s stopping rule and
        H-GGM-001's total_wall_clock_seconds 1800. Define what one run is and
        make the three numbers agree.
    - id: NBO-4
      title: required_artifacts omits implementation.md and amendments/
      severity: low
      fix: >-
        docs/evidence-and-reproducibility.md's reproduction package requires
        both. Add them to required_artifacts.
    - id: NBO-5
      title: Elliptic-net basis conflates universality of identities with simulability of values
      severity: medium
      fix: >-
        Universal Somos identities constrain the values; they do not make the
        values reconstructible from group operations. Restate the basis in terms
        of what a simulator would actually have to produce, or re-derive the
        expectation.
    - id: NBO-6
      title: gg_model_variant is named but its live parameters are left open
      severity: medium
      fix: >-
        shoup_encoding is named without saying whether simulation must be perfect
        or may be statistical, what the query budget is, or what advantage is
        tolerated. IDEA-20260726-004 flagged the model-variant confounder and the
        freeze did not resolve it. State all three in the frozen record.
    - id: NBO-7
      title: Toy curves are described as decorative but are load-bearing for every NON-SIMULABLE verdict
      severity: medium
      fix: >-
        State that a NON-SIMULABLE verdict supported only by 8-16 bit
        realizations is toy-tier unless the indistinguishability argument is
        supplied in general form, and label such verdicts accordingly.

  valid_aspects:
    - >-
      The research question is the right one and is well chosen. KN-TECH-005 and
      KN-OPEN-005 both identify GGM simulability as the cheapest decisive screen
      for the program's representation candidates, and this package is a serious
      attempt to operationalize it.
    - >-
      The gating architecture is methodologically correct: soundness controls
      evaluated first, with augmented verdicts reported only if the gate passes.
      The defect is the choice of controls and the placement of the answer key,
      not the idea of gating.
    - >-
      invalidation_rules correctly separate run-integrity failure from scientific
      falsification, and explicitly state that control misclassification is NOT
      an invalidation. stopping_rules correctly classify crashes as
      failed_infrastructure. Both comply with AGENTS.md rule 5.
    - >-
      Requiring an oracle_specification_hash to detect specification drift is the
      right instinct for a test whose entire input is text; it needs only to be
      split so that it hashes the question apart from the answer.
    - >-
      H-GGM-001 interpretation_limits item 2 is properly conservative: a
      NON-SIMULABLE verdict is explicitly not a breakthrough and is routed to
      AGENTS.md rule 12 for separate scrutiny.
    - >-
      H-GGM-001 interpretation_limits item 5 shows the authors identified the
      sharpest objection to their own design (wording dependence). The defect is
      that it was filed as a confounder rather than resolved in the frozen text.
    - >-
      Scope hygiene is good: no crypto-scale target, no live key, no claim to
      settle KN-OPEN-001, and an explicit statement that the test covers
      specifications rather than implementations.
    - >-
      Freezing the design as review-only with implementation deferred, status
      review_required, and approved_by null is correct and matches BATCH-006's
      excluded_peripheral_work. Nothing has been executed, which is why these
      defects are still cheap to repair.

  terminal_verdict: REVISE

  verdict_rationale: >-
    The review binding is established: both reviewed paths are supplied by commit
    5de2db97, that commit is an ancestor of HEAD ab59e26b, and the Git-object,
    HEAD-object, and working-tree SHA-256 values agree for each path.

    The question EXP-GGM-001 asks is the right question, and the package is
    scope-disciplined. But the protocol as frozen cannot deliver a verdict that
    means what H-GGM-001 says it means, for reasons that compound rather than
    accumulate independently. The four expected verdicts are printed inside the
    test's own input (BO-1). The control gate that is supposed to license every
    augmented-oracle verdict consists entirely of extremal cases and is passed
    4/4 by a classifier keyed on output type that never constructs a simulator
    and then disagrees with the specification on at least two of the four
    subjects under test (BO-2). The two NON-SIMULABLE controls fail for two
    different reasons and the one mandated witness format fits only the
    x-coordinate one; for the discrete-log control -- the declared primary
    unsoundness falsifier -- the frozen expected_witness describes an object that
    cannot exist, so that control will pass by assertion (BO-3). The witness
    definition itself is satisfied by relabelling the pure_generic control, and
    its indistinguishability conjunct is undefined and not verifiable by
    recomputation (BO-4). The classification routine is an undecidable search
    with no branch for failure, so a failed search becomes a NON-SIMULABLE
    verdict (BO-5). The overhead criterion is measured statically and therefore
    cannot vary across the curve sizes it is checked against, while two augmented
    oracles fail that criterion on their own stated bases (BO-6). The
    falsification set is narrowed to a gate that cannot fail (BO-7), and the
    protocol pre-commits the interpretation of results it has not obtained while
    instructing that the claim-tier ceiling be lifted by a route
    docs/claims-and-verification.md forbids (BO-8).

    The compounded consequence is concrete and runs in both directions. Under the
    frozen coordinate wording plus the frozen witness procedure, the jet and
    elliptic-net oracles receive NON-SIMULABLE verdicts backed by witnesses that
    check on all three toy curves -- an experiment that manufactures non-generic
    signals the program should be most skeptical of. Under the frozen
    expected_basis fields, the endomorphism and incidence oracles receive
    SIMULABLE verdicts despite requiring Omega(log N) and Theta(B^m) group
    operations, with the growth check that should have caught it disabled by the
    specification's own definition of C -- and a SIMULABLE verdict is then
    promoted to a scale-independent closure at exponent 1/2. Both failure modes
    are reachable with the control gate reading 4/4.

    The verdict is REVISE rather than FAIL because the underlying question
    survives every objection, every blocking objection carries a concrete and
    bounded fix, the specification is still status review_required with
    approved_by null, and nothing has been executed. This maps to BATCH-006's
    negative_branch: a scoped revise bounded to EXP-GGM-001 version 1, naming the
    first unmet obligation, authorizing no execution. The first unmet obligation
    is the control gate: it cannot discriminate a sound test from an unsound one,
    because its answers are inside its input and its controls are all extremal.

    This review makes no claim about whether any augmented oracle is GGM-simulable
    and endorses no crypto-scale, breakthrough, or universal-impossibility claim.
    Toy scale stays toy scale.

  recommended_next_action: >-
    Open a single Coordinator-authored design-revision task for EXP-GGM-001
    version 2 in a separately budgeted successor campaign, addressing BO-1
    through BO-8 in that order, and authorize no implementation or execution of
    EXP-GGM-001 version 1. Version 2 must (a) seal the eight expected verdicts
    into a separate withheld, separately hashed file, (b) add the three boundary
    control classes so the gate has a control on each side of each decision axis,
    (c) split the verdict onto an encoding-dependence axis and a query-overhead
    axis with a distinct witness type per axis, (d) define the witness as an
    equivariance failure with a finite third-party-checkable
    indistinguishability predicate stated in the frozen text, (e) replace the
    free-form computational_procedure with a closed answer-form grammar plus an
    UNDETERMINED verdict, (f) measure C dynamically with scalar multiplications
    expanded and re-derive the endomorphism and incidence expectations, (g)
    restore all four H-GGM-001 falsifiers as experiment falsifiers, and (h)
    replace the pre-committed scale-independence note with neutral reporting and
    set claim_tier from tested instances with scale-independence carried by
    proof_status: derivation.

  records_changed: none
  execution_authorized: false
  statuses_changed: none

