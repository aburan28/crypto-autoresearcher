batch:
  id: BATCH-006
  goal_id: GOAL-ECDLP-001
  question_ids: [RQ-ECDLP-002]
  objective: >-
    Subject the H-GGM-001 + EXP-GGM-001 package to two independent, non-originating
    review-xhigh sessions before any execution is authorized: a Reviewer that
    challenges the simulability test's soundness, control gate, and decidability, and
    a Red Team that attacks the single riskiest assertion in the package -- the
    claim_tier_basis argument that a SIMULABLE verdict is a scale-independent
    derivation-level closure at exponent 1/2 rather than toy-tier evidence. Repair the
    BATCH-004 archive receipts in the same batch. Authorize no implementation and no
    execution of EXP-GGM-001; the review outcome, not this batch, decides its fate.
  status: ready_for_dispatch
  maximum_wall_clock_seconds: 6600
  max_concurrent: 2
  campaign_budget_position:
    maximum_batches: 6
    batches_consumed_before_this_one: 5
    consumed_batch_ids: [BATCH-001, BATCH-002, BATCH-003, BATCH-004, BATCH-005]
    batches_remaining_after_this_one: 0
    exhausts_campaign_batch_budget: true
    note: >-
      BATCH-005 has no coordination directory, batch record, dispatch queue, review,
      or archive receipt, but its id was reserved by the committed next_action of
      DEC-20260726-004 and the work it named was executed (DEC-20260726-005 /
      EV-IC-001, 748 EXP-IC-001 runs; DEC-20260726-006 / EV-STR-002; the design of
      H-GGM-001 + EXP-GGM-001). The id is consumed and, per the immutable-ID
      convention, not reusable. BATCH-006 is therefore the sixth and final batch under
      campaign_budget.maximum_batches. Its ledger archive triggers pause_condition 1
      unless a completion criterion is met. The campaign wall-clock tally against
      total_wall_clock_seconds: 28800 is NOT reconstructible, because BATCH-005
      recorded no batch budget or elapsed time; this batch is bounded independently at
      6600 seconds.
  id_renumber_note: >-
    Every decision citation in this batch record that read DEC-20260726-007 when this
    record was authored now reads DEC-20260726-009. The record it cites is unchanged in
    substance; only its ID changed, under CORR-20260727-001 and ESC-20260727-001 section
    D_id_collision, because origin/main published a different decision at
    DEC-20260726-007. Updating this file rather than relying on the alias was a
    Coordinator choice at execution time, on the ground that a stale citation here would
    silently resolve to a real but unrelated main record.
  rerank_basis:
    evidence_id: EV-ECDLP-006
    decision_id: DEC-20260726-009
    verified_checkpoint_commit: 6a4f0705d6bbd1e7b72aa77b79c1a024a20b4faf
    selected_frontier: >-
      H-GGM-001 / EXP-GGM-001 generic-group simulability test for the jet,
      elliptic-net, incidence, and endomorphism oracles.
    selection_reason: >-
      It is the committed next action of the goal record, it is the only open package
      whose outcome is decidable inside one bounded batch without new implementation,
      and it is the only candidate in the campaign that asserts a scale-independent
      (non-toy) conclusion. Under AGENTS.md rule 12 a closure claim at exponent 1/2
      requires independent review-xhigh by a non-originating session, and
      H-GGM-001/EXP-GGM-001 were authored by the Coordinator session under a declared
      glm-5p2 fallback, so the package has had no independent scrutiny at all.
    excluded_frontiers:
      - >-
        Executing EXP-GGM-001. Explicitly out of scope: EXP-GGM-001 is status
        review_required with approved_by null, and no execution may be authorized
        before TASK-20260726-005 returns and TASK-20260726-008 archives the resulting
        decision.
      - >-
        The H-STR-002 structured-solve wall-time track (DEC-20260726-006 next_action,
        B=200-1000 versus Wiedemann). It requires a new experiment design,
        implementation, execution, and its own review chain; it does not fit inside
        the final batch without producing an unreviewed result.
      - >-
        Repairing EXP-IC-001 against the five BATCH-004 blocking objections. The
        repair was superseded in practice by the unbatched v2/v3 amendments and
        DEC-20260726-005; re-opening it is not decidable within this batch.
      - Any crypto-scale claim, live-key target, or breakthrough assertion.
  review_package_binding:
    reviewed_paths:
      - ledger/hypotheses/H-GGM-001.yaml
      - experiments/EXP-GGM-001/specification.yaml
    binding_method: prior_commit_plus_reviewer_verified_hash
    binding_rationale: >-
      Both reviewed artifacts are already committed and unmodified in the working
      tree. A snapshot archive commit must change exactly its declared paths, so these
      files cannot be re-snapshotted: staging unchanged content produces an empty diff
      and fails the post-commit verifier. The pre-review snapshot function is therefore
      discharged the same way TASK-20260726-003 discharged it for commit 6a4f0705 --
      each independent session must, before interpreting the package, resolve the
      commit that currently supplies each reviewed path, confirm the path is clean at
      HEAD, compute its SHA-256 from Git object content, and record all of it in its
      own report. A review that cannot establish this binding must stop and report a
      binding failure rather than review an unbound package.
    binding_values_recorded_by: [TASK-20260726-005, TASK-20260726-006]
  producer_task_ids: [TASK-20260726-005, TASK-20260726-006, TASK-20260726-007]
  snapshot_archive_task_id: null
  snapshot_archive_note: >-
    This batch has no in-queue snapshot archive task because it contains no producer
    whose artifacts require an independent review inside the batch: the two producers
    ARE the independent reviews, and the third is a Coordinator receipt repair. The
    pre-review snapshot obligation is met by the batch-opening archive commit declared
    in DEC-20260726-009 (which commits this batch record, the dispatch queue, the four
    handoffs, the repaired goal record, the BATCH-004 state reconciliation, and
    DEC-20260726-009) together with review_package_binding above.
  independent_review_task_ids: [TASK-20260726-005, TASK-20260726-006]
  ledger_archive_task_id: TASK-20260726-008
  positive_branch: >-
    If both independent sessions accept the simulability test's soundness, its control
    gate, and its claim_tier_basis, record a Coordinator decision approving EXP-GGM-001
    for execution in a separately budgeted successor campaign, with the claim tier the
    reviews actually support -- and no higher. Approval of the protocol is not a
    result about any oracle.
  negative_branch: >-
    If either session finds the control gate unsound, the witness construction
    uncheckable, or the scale-independence argument unsupported, record a scoped
    revise or reject_scoped bounded to the reviewed specification version, name the
    first unmet obligation, and authorize no execution. A defect in the test design is
    a statement about EXP-GGM-001, never about the mathematics of any augmented
    oracle.
  inconclusive_branch: >-
    If the two sessions disagree, or if the reviews cannot discriminate between
    "specification is sound" and "specification is underdetermined", record
    inconclusive, name the exact unresolved obligation, and authorize no execution.
  excluded_peripheral_work:
    - Implementing simulability_test.py or any oracle simulator.
    - Executing EXP-GGM-001 or any other experiment.
    - Changing the status of H-GGM-001, EXP-GGM-001, H-IC-001, H-STR-002, or any
      other hypothesis or experiment during producer tasks.
    - Editing ledger records outside the declared write scope of TASK-20260726-008.
    - Testing live keys, deployed systems, or private targets.
    - Any crypto-scale or breakthrough claim.
  next_action: >-
    Dispatch TASK-20260726-005 and TASK-20260726-006 concurrently under review-xhigh in
    two separate non-originating sessions, neither of which authored H-GGM-001 or
    EXP-GGM-001.
  created_at: '2026-07-26T21:15:00-07:00'
  updated_at: '2026-07-26T21:15:00-07:00'
