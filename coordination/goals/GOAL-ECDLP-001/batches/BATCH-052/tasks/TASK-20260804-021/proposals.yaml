proposals:

  # -----------------------------------------------------------------------
  # IDEA-20260804-ea13dc
  # Isogeny-cycle endomorphism eigenvalue — formal closure of the direction
  # -----------------------------------------------------------------------
  - id: IDEA-20260804-ea13dc
    goal_id: GOAL-ECDLP-001
    sub_goal_id: SG-ECDLP-002
    direction: DIR-3
    status: proposed
    added: '2026-08-04'
    authored_by: TASK-20260804-021

    avoids_tate_obstruction: true
    avoids_tate_obstruction_reason: >-
      Works within a single isogeny class (fixed trace). Does not attempt to
      cross to a different class. Tate's theorem says classes are disconnected
      over F_p, but within a class any isogeny is allowed.

    mechanism: >-
      Compose k ordinary F_p-isogenies phi_1,...,phi_k: E -> E_1 -> ... -> E_k -> E
      (a CYCLE returning to E or an isomorphic copy) to form a single endomorphism
      Phi = phi_k ∘ ... ∘ phi_1: E -> E. If Phi has a small eigenvalue lambda mod N
      (meaning Phi(P) = lambda*P for all P ∈ E[N]), then GLV decomposes the DLP
      in O(N^{1/4}) steps instead of O(N^{1/2}).
      For curves at the SURFACE of the volcano (CM by the maximal order O_K of
      discriminant D = t^2-4p), the endomorphism ring End_{F_p}(E) is either Z
      (generic case, only {±1}) or an order in Q(sqrt(D)) if D is a perfect square
      (only for specific traces t). For generic prime p and t, D is NOT a perfect
      square and End_{F_p}(E) = Z.

    predictions:
      - metric: non_trivial_endomorphism_existence
        direction: different
        minimum_effect: >-
          For a random prime p with generic CM discriminant D = t^2-4p > 0 (not a
          perfect square), End_{F_p}(E) = Z and no non-trivial endomorphism (beyond
          ±1) exists. A cycle phi_k ∘ ... ∘ phi_1 returning to E gives phi(P) = ±P
          for all P ∈ E[N]. The eigenvalue lambda ∈ {±1} gives NO GLV advantage.

    minimal_discriminating_test:
      description: >-
        At bits=20: generate random prime p, random prime-order E/F_p. Compute
        End_{F_p}(E) via the Kohel algorithm (or just check if any isogeny of
        degree <= 100 returns to a curve isomorphic to E over F_p). Count how
        many such short cycles exist and what their eigenvalues are.
      estimated_cost: "< 1 minute at bits=20"
      pass_criterion: >-
        A short cycle (k <= 100 isogenies) is found with eigenvalue lambda != ±1 mod N.
      fail_criterion: >-
        All cycles found have eigenvalue ±1 (consistent with End_{F_p}(E) = Z).

    null_object_control:
      description: >-
        For a CM curve (j = 0, D = -3) where End_{F_p}(E) is known to contain
        non-trivial endomorphisms, verify that the test correctly finds them.
        This calibrates the detection method before applying it to generic curves.
      expected_null_result: >-
        For j = 0 at a prime p ≡ 1 mod 3, End_{F_p}(E) contains the cube root of
        unity endomorphism zeta with zeta^3 = 1 and lambda^2 + lambda + 1 ≡ 0 mod N.
        The detection should find this. If it doesn't, the test is broken.

    falsification_criteria:
      - >-
        End_{F_p}(E) = Z for all random primes p tested (no non-trivial endomorphisms
        found via isogeny cycles). This formally establishes that the cycle-endomorphism
        direction is CLOSED for generic prime-order prime-field curves.
      - >-
        Even for CM curves (j = 0, 1728 etc.), the endomorphism is only useful for
        curves explicitly chosen to have it — not for generic ECDLP instances.
        Standard curve selection excludes these.

    dominated_by: Pollard rho at exponent 1/2 (for generic curves, no advantage)
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
      verified: false
      note: >-
        For generic prime-field curves End_{F_p}(E) = Z (a standard result in CM
        theory). No non-trivial isogeny cycle gives a useful endomorphism. This is
        effectively a CLOSURE DIRECTION — the test is expected to confirm that this
        approach is BLOCKED for generic curves, cleanly closing it.

    target_class: false
    target_class_reason: >-
      Even in the best case (a CM curve), GLV gives only a constant-factor speedup
      (sqrt(2) for a single endomorphism). Not exponent-moving. Generic curves have
      no non-trivial endomorphisms, so no advantage at all.

    recommended_priority: medium
    novelty_status: closure_direction

    proof_search_map:
      observation_collision_search: >-
        End_{F_p}(E) = Z for generic ordinary prime-field curves is a standard
        result (CM theory, Silverman AEC). No experiment needed to know the answer;
        the test serves as a formal instrument verification. Already known.
      exact_baseline_reproduction: >-
        Reproduce End_{F_p}(E) computation for j=0 (should find the CM endomorphism)
        and j=random (should find only {±1}). Baseline confirms the instrument works.
      quantifier_order_statement: >-
        FOR ALL ordinary prime-field curves E with prime order N and random prime p
        (generic discriminant D), End_{F_p}(E) = Z. This is an unconditional
        theorem, not a heuristic.
      method_ceiling: >-
        Isogeny-cycle endomorphisms for generic prime-field curves: method ceiling =
        GLV with lambda = ±1 = no improvement. CEILING IS POLLARD RHO.

    interpretation_limits:
      - >-
        A positive result on j=0 curves does NOT imply anything for generic ECDLP
        instances. CM curves are explicitly excluded from standard security criteria.
      - >-
        This direction is expected to produce a CLOSURE result, not a breakthrough.
        Its value is formally establishing the boundary.

  # -----------------------------------------------------------------------
  # IDEA-20260804-b6624c
  # Ordinary-isogeny-graph meet-in-the-middle: analogue of Wesolowski p^{1/3}
  # -----------------------------------------------------------------------
  - id: IDEA-20260804-b6624c
    goal_id: GOAL-ECDLP-001
    sub_goal_id: SG-ECDLP-002
    direction: novel
    status: proposed
    added: '2026-08-04'
    authored_by: TASK-20260804-021

    avoids_tate_obstruction: true
    avoids_tate_obstruction_reason: >-
      Does NOT try to move between isogeny classes via ordinary isogenies.
      Instead, proposes a meet-in-the-middle on the ORDINARY ISOGENY GRAPH
      within the class to find a structural decomposition of the DLP.
      The inspiration is Wesolowski's p^{1/3} result for supersingular isogenies,
      which also stays within a fixed (supersingular) isogeny class.

    mechanism: >-
      The ordinary isogeny class of E over F_p (curves with the same trace t,
      hence the same group order N ~ p) forms a connected graph under ell-isogenies
      for each prime ell. This graph has ~ h(D) ~ O(sqrt(p)) vertices, degree ell+1
      at each vertex (for Elkies ell). The DIAMETER of this graph is O(sqrt(p)).

      PROPOSED MECHANISM: Analogous to Wesolowski's supersingular computation,
      use a MEET-IN-THE-MIDDLE on the ordinary isogeny graph to find a pair of
      short paths (each of length O(p^{1/6})) that together form a cycle encoding
      a relation on the DLP scalar. Specifically:

      Step 1 (FORWARD WALK): Starting from E, take random ell-isogeny walks of
      length L = p^{1/6} to reach a set S_1 of ~ p^{1/6} curves {E_i}.

      Step 2 (BACKWARD WALK): Starting from the "translated" curve [k]E (the DLP
      target encoded as an isogeny-class object), take random ell-isogeny walks of
      length L = p^{1/6} to reach a set S_2 of ~ p^{1/6} curves {E_j}.

      Step 3 (COLLISION): Find i,j such that E_i = E_j. This gives a relation:
      (phi_1 ∘ ... ∘ phi_L)(E) = (psi_1 ∘ ... ∘ psi_L)([k]E) where the psi walk
      goes backward. The collision encodes an equation in the class group of Cl(O_K)
      relating k to the composed isogenies.

      CRITICAL MISSING LINK: The equation from the collision gives an element of
      the class group Cl(O_K), not directly the scalar k. Recovering k from the
      class group element requires the reverse direction of the ECDLP -> class group
      DLP reduction — which is BLOCKED by the h(D) << N mismatch (IDEA-e88120
      audit). So this is a CONDITIONAL proposal: it works IF a reduction from class
      group information to the ECDLP scalar k can be established.

    predictions:
      - metric: meet_in_the_middle_collision_rate
        direction: different
        minimum_effect: >-
          At bits=20: S_1 and S_2 each of size ~ p^{1/6} ~ 6 curves. Probability
          of collision in the h(D) ~ sqrt(p) ~ 1024-curve class: ~ p^{1/3} / p^{1/2}
          = p^{-1/6} per pair. Expected matches: p^{1/3} / p^{1/2} * p^{1/3} = p^{1/6}
          / p^{1/2} ... actually need birthday paradox in a pool of h(D) curves.
          Birthday paradox on h(D) ~ p^{1/2} elements with S = p^{1/3} samples:
          collision probability ~ S^2 / h(D) = p^{2/3} / p^{1/2} = p^{1/6} >> 1.
          So collision is GUARANTEED at cost O(p^{1/3}) isogeny steps.
          BUT: recovering k from the collision requires additional computation.
      - metric: key_recovery_cost
        direction: lower
        minimum_effect: >-
          If key recovery from the collision is O(p^{1/6}) or less, total cost
          is O(p^{1/3}) -- strictly below Pollard rho O(p^{1/2}).

    minimal_discriminating_test:
      description: >-
        At bits=20 (p ~ 2^20, h(D) ~ 2^10): (1) Build S_1 by walking p^{1/6} ~
        8 steps from E. (2) Build S_2 by walking 8 steps from some known translation
        [k]E (using a PLANTED k). (3) Find the collision E_i = E_j. (4) Attempt to
        extract k from the collision using the class group structure.
      estimated_cost: "~10 minutes at bits=20"
      pass_criterion: >-
        Collision found AND k correctly extracted from the collision, with total
        cost < Pollard rho baseline at bits=20.
      fail_criterion: >-
        (a) k cannot be extracted from the collision (class group information
        does not determine the DLP scalar), OR (b) cost is not below Pollard rho.

    null_object_control:
      description: >-
        Replace the isogeny walk with a RANDOM WALK on a graph of the same size
        and degree (Cayley graph of the class group, not the isogeny graph).
        If the MITM collision rate and key extraction difficulty are the same,
        the isogeny graph structure provides no advantage over a random graph.
      expected_null_result: >-
        Random walk collision rate = birthday paradox in h(D) ~ p^{1/2} vertices,
        identical to the isogeny walk. Key extraction: fails for a random graph
        (no algebraic structure). If key extraction also fails for the isogeny
        MITM, the proposal is infeasible.

    falsification_criteria:
      - >-
        If k cannot be extracted from the class group collision information (due to
        the h(D) << N order mismatch identified in IDEA-e88120 audit), the mechanism
        is blocked at the KEY RECOVERY step. This is the primary obstruction.
      - >-
        If the isogeny MITM collision rate equals the null graph rate (no structural
        advantage), the isogeny graph provides no benefit over a random walk.

    dominated_by: Pollard rho at exponent 1/2 (until key recovery is resolved)
    sota_delta:
      time_exponent: conditional_minus_one_sixth
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
      verified: false
      note: >-
        CONDITIONAL: If key recovery from class group collision takes O(p^{1/6}),
        total cost is O(p^{1/3}) — exponent 1/3 vs Pollard rho's 1/2, a genuine
        exponent improvement. BLOCKED by the unresolved key-recovery problem
        (same h(D) << N obstruction as IDEA-e88120). Not verified; the key step
        is conjecture. If key recovery costs O(p^{1/3}), total is O(p^{1/3}) (same).
        If key recovery costs O(p^{1/2}), no improvement.

    target_class: conditional
    target_class_reason: >-
      Conditional on resolving the key-recovery step: can class group collision
      information be converted to the ECDLP scalar k in sub-rho time? If yes,
      this achieves exponent 1/3 — strictly target-class. This is the analogue of
      Wesolowski's p^{1/3} result for ordinary curves. The obstruction is the same
      h(D) << N mismatch identified in IDEA-e88120.

    recommended_priority: high
    novelty_status: novel_conditional

    proof_search_map:
      observation_collision_search: >-
        Has a MITM on the ordinary isogeny graph been proposed or analyzed? Search:
        Wesolowski 2022 (supersingular analogue), De Feo-Galbraith, and the
        Buchmann-Vollmer class group DLP literature. Key question: does the class
        group MITM for ordinary curves appear in any prior work? If absent, this
        is genuinely novel.
      exact_baseline_reproduction: >-
        Implement the MITM at bits=20, find the collision, and attempt key recovery
        using the class group structure. The baseline is: collision is easy (birthday
        paradox), key recovery is the bottleneck.
      quantifier_order_statement: >-
        The claim is: FOR ALL prime p and prime-order ordinary E/F_p, there EXISTS
        a MITM procedure on the ordinary isogeny graph that finds k in O(p^{1/3})
        time IF the key-recovery step takes O(p^{1/6}) or less. The quantifier
        order: the recovery procedure must exist for ALL k (not just a specific k).
      method_ceiling: >-
        MITM collision cost: O(p^{1/3}) steps (birthday paradox on h(D) ~ p^{1/2}
        nodes with p^{1/6} samples each direction). Key recovery: unknown, bounded
        by O(p^{1/2}) (Pollard rho on the residual). Method ceiling without improved
        key recovery: O(p^{1/2}), same as Pollard rho. Nearby-object control: replace
        isogeny graph with a random regular graph of same degree and size — identical
        MITM collision cost, different (and likely easier) key recovery since no
        algebraic structure.

    interpretation_limits:
      - >-
        A successful MITM collision at toy scale (bits=20) does NOT establish
        sub-rho complexity without solving the key-recovery problem.
      - >-
        Even with key recovery, the result applies only to curves in the same
        isogeny class (same trace t). The claim is for generic prime-order
        prime-field ECDLP, which requires the mechanism to work for any E.

  # -----------------------------------------------------------------------
  # IDEA-20260804-3d35ab
  # Pairing-group index calculus via targeted k-smooth N selection (DIR-2)
  # -----------------------------------------------------------------------
  - id: IDEA-20260804-3d35ab
    goal_id: GOAL-ECDLP-001
    sub_goal_id: SG-ECDLP-002
    direction: DIR-2
    status: proposed
    added: '2026-08-04'
    authored_by: TASK-20260804-021

    avoids_tate_obstruction: true
    avoids_tate_obstruction_reason: >-
      Does NOT use ordinary isogenies at all. Instead, targets a DIFFERENT special
      family that is defined by the EMBEDDING DEGREE k of E over F_p. The embedding
      degree k = ord_N(p) depends on N = p+1-t, and since N is an isogeny-class
      invariant (Tate theorem), k is also an isogeny-class invariant. Therefore
      the Tate theorem says: you CANNOT change k by ordinary isogeny. This proposal
      investigates whether there exists a DIRECT (non-isogeny) approach to find
      specific (p, E) pairs where k is small enough for pairing-based DLP reduction,
      and whether this admits a sub-rho algorithm for choosing/constructing such curves.

    mechanism: >-
      The Weil/Tate pairing maps E(F_p)[N] to F_{p^k}* where k = ord_N(p).
      If k is small (k = 1: MOV trivial; k = 2: Frey-Rück; k <= log(N)/5: MOV
      practical), the DLP on E reduces to the DLP in F_{p^k}* which can be solved
      by index calculus in L_{p^k}[1/3] time.

      For a RANDOM prime p and prime-order curve E, k = ord_N(p) is typically ~ N/2
      (exponentially large). The MOV attack is infeasible for generic curves.

      PROPOSAL: Can we construct curves (p, E) with small k as part of the
      ATTACK SETUP (not the curve generation)? Specifically: given a target ECDLP
      instance (E, G, Q = [k]G) where E is a standardized curve (embedding degree
      exponentially large), can an attacker CONSTRUCT a new prime p' and curve E'
      with:
        (a) E' is isomorphic to E as a group (same group order N) — so DLP on E'
            is equivalent to DLP on E
        (b) E' has small embedding degree k' (k' <= log(N)^c for some constant c)
        (c) E' is an ordinary curve over F_{p'}

      If such (p', E') can be found efficiently, the DLP on E reduces to DLP in
      F_{p'^{k'}}* which is subexponential.

      OBSTRUCTION: Two curves are "isomorphic as groups" if and only if they have
      the same group order N. But if E has order N over F_p and E' has order N over
      F_{p'}, they are ISOMORPHIC AS ABSTRACT GROUPS (both Z/N since N is prime)
      but NOT isomorphic as elliptic curves over any single field. The DLP in E(F_p)
      and the DLP in E'(F_{p'}) are computationally distinct problems — they have
      the same abstract group structure (Z/N) but different generators and different
      arithmetic.

      So: "equivalent DLP" in the group-theoretic sense does NOT give computational
      equivalence. The DLP on E(F_p) is not the same computation as DLP on E'(F_{p'})
      even if both groups are Z/N.

      REVISED PROPOSAL: Is there a (p', E', G', Q') with small embedding degree such
      that the DLP on E'(F_{p'}) can be TRANSLATED to DLP on E(F_p) via some
      computational reduction? For this, we need: an efficiently computable bijection
      f: E(F_p) -> E'(F_{p'}) such that f is a group homomorphism and f(G) = G',
      f(Q) = Q'. Since both groups are Z/N, such an f exists abstractly. But
      computing f explicitly requires solving the DLP (to find the isomorphism k:
      k*f(G) = f(Q) implies k = DLP). Circular.

    predictions:
      - metric: embedding_degree_achievability
        direction: different
        minimum_effect: >-
          The obstruction (circularity) is expected. The test would confirm
          that no efficient non-circular translation exists between the DLP in
          E(F_p) and the DLP in E'(F_{p'}) for distinct primes p, p' and same N.

    minimal_discriminating_test:
      description: >-
        Theoretical analysis: state precisely why the group-isomorphism E(F_p) ≅
        E'(F_{p'}) ≅ Z/N does NOT give a computational DLP equivalence. Find the
        specific information-theoretic barrier. The test is a PROOF ATTEMPT, not
        an experiment.
      estimated_cost: "1-2 hours of mathematical analysis"
      pass_criterion: >-
        A non-circular reduction is found: an efficient algorithm that, given
        (E, G, Q) over F_p, computes (p', E', G', Q') with small k' and then
        computes DLP on E'(F_{p'}).
      fail_criterion: >-
        Every proposed reduction is shown to require solving DLP as a sub-step
        (circular).

    null_object_control:
      description: >-
        Compare against the known pairing-based DLP attacks (MOV, Frey-Rück):
        these ARE non-circular for curves with SMALL embedding degree over the
        SAME base field F_p. The null object is: does the attack work for curves
        with small k over F_p? (Yes, by MOV.) Does it work for curves constructed
        over a DIFFERENT field F_{p'}? (This is the unknown.)
      expected_null_result: >-
        MOV works for small-k curves over F_p. The proposed extension to different
        fields F_{p'} requires a non-circular group isomorphism, which is not
        available.

    falsification_criteria:
      - >-
        If every reduction from DLP on E(F_p) to DLP on E'(F_{p'}) with small k'
        requires computing the DLP as a sub-step (circularity), the mechanism is
        closed.
      - >-
        The abstract group isomorphism E(F_p) ≅ E'(F_{p'}) ≅ Z/N is computable
        in principle (via Chinese Remainder Theorem + Pohlig-Hellman on small
        subgroups of N) but requires solving the DLP.

    dominated_by: >-
      Pollard rho for generic curves. Pairing-based attacks (MOV/Frey-Rück) for
      curves with specifically chosen small embedding degree.
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
      verified: false
      note: >-
        Expected to be a CLOSURE direction (the mechanism is blocked by circularity).
        Proposing it to establish the closure formally. If somehow non-circular,
        the gain would be from O(p^{1/2}) Pollard rho to L_{p^k}[1/3] index calculus,
        a genuine exponent improvement.

    target_class: false
    target_class_reason: >-
      Expected to terminate with a circularity proof. The direction is included
      to formally establish its boundary, not because a positive result is expected.

    recommended_priority: low
    novelty_status: closure_direction

    proof_search_map:
      observation_collision_search: >-
        Has a cross-field pairing attack been proposed? Search: Smart-Vercauteren,
        Joux-Nguyên-Stern DLP literature, and the NIST-PQC evaluation reports on
        pairing-based DLP. If absent, formally state the circularity barrier.
      exact_baseline_reproduction: >-
        Show that the abstract group isomorphism Z/N -> Z/N requires finding a
        generator, which requires solving the DLP. Baseline: this is classical.
      quantifier_order_statement: >-
        THERE IS NO efficient non-circular reduction from DLP on E(F_p) to DLP
        on E'(F_{p'}) with small k' for distinct p, p' and same prime N.
        Proof: any such reduction must either know the DLP scalar k, or find an
        efficient bijection whose computation is equivalent to solving the DLP.
      method_ceiling: >-
        If a non-circular reduction existed, cost = L_{p^k}[1/3] << p^{1/2}.
        Ceiling = L_p[1/3] for the best index calculus in F_{p^k}*.
        But circularity blocks this.
