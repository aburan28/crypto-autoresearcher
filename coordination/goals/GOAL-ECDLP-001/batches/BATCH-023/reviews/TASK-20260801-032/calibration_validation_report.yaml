validation_report:
  id: VAL-20260801-003
  task_id: TASK-20260801-032
  role: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  experiment_id: EXP-EQD-001
  run_ids:
    - RUN-EQD-001-calib
  reviewed_snapshot: 53e202dd2011b8e83141d3471289443051754675
  reviewed_snapshot_parent: e9e601bd82eab31eb9fd083f31cfd62a772beb80
  produced_at: "2026-08-01"

  verdict: passed
  admissibility: ADMISSIBLE
  admissibility_statement: >-
    The RUN-EQD-001-calib package archived at 53e202dd2 is an admissible research receipt.
    Every declared artifact is present and hash-bound; the driver sha256 matches the manifest
    and the TASK-20260801-022 receipt; ATS-1 clause 2 holds STRUCTURALLY on the artifact and
    not merely by assertion; the real-arm entry point exists, is reachable, and was not
    invoked; and every number this Validator was asked to recompute reproduced EXACTLY,
    including a full byte-identical re-execution of the recorded command. Defects D-1..D-6
    below are named. NONE of them is an error in the measured calibration numbers. D-1 and
    D-2 are properties of the frozen STAT-DUP band FORM and of the curve object that make one
    specific number unsound TO FREEZE AS DECLARED, and they are handed to TASK-20260801-023,
    which owns the freeze. This report freezes nothing, applies no reading rule, and states no
    disposition about any hypothesis.

  scope_and_prohibitions_observed:
    - RUN-EQD-001-calib is treated as expressly NON-EVIDENTIAL about H-EQD-001, HEUR-DS-1 and H-SMTH-001 in either direction. Nothing here states or implies a disposition about any hypothesis.
    - No threshold was frozen, no reading rule was applied, no branch was selected. Recomputed order statistics appear below as ARITHMETIC CHECKS only.
    - No commit was made. No ledger record, specification, driver, run artifact or result file was modified.
    - >-
      The real arm was deliberately NOT executed and no statistic of OBJ-REAL was computed by
      this Validator, including the STAT-DUP value the deterministic factor base would produce.
      Computing it would be exactly the information leak ATS-1 clause 2 exists to prevent, and
      would contaminate TASK-20260801-023 and TASK-20260801-026. This is a deliberate
      non-check, recorded as such.
    - Nothing under experiments/EXP-DS-001/ or experiments/EXP-SMTH-001/ was read, imported, edited or staged.

  inference:
    requested_policy: review-adversarial
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    model_verified: false
    independent_session: true
    independence_caveat: >-
      Independence here is PROCEDURAL, not model-level. This harness resolves the producer
      (TASK-20260801-021 executor) and this reviewer to the same underlying model
      (claude-opus-5). A shared-model reviewer cannot be assumed to be an independent error
      source for reasoning defects; it is an independent error source for arithmetic and
      artifact defects only to the extent that the checks below were mechanically recomputed
      from raw data, which is why every check in this report was run as code against the
      archived bytes rather than reasoned about.

  # ======================================================================
  # CHECK 1 - ATS-1 CLAUSE 2, STRUCTURAL ABSENCE OF REAL DATA
  # ======================================================================
  check_1_structural_absence_of_real_data:
    verdict: PASS
    method: >-
      Checked against the archived bytes at the snapshot, not against the contract sentence
      and not against the execution report. The deterministic factor base was reconstructed
      INDEPENDENTLY by this Validator (the first 512 elements of X_E in increasing order,
      computed from the curve equation with plain Python pow-based Legendre symbols, not with
      the driver's code) and its canonical digest was searched for across the whole package.
    findings:
      - id: C1-a
        claim: no OBJ-REAL sample and no deterministic factor-base x-list is present in the package
        result: CONFIRMED
        evidence: >-
          The package contains exactly two archived x-lists, one per cell, both under
          instrument_characterization.json cells.<bits>.representative_null_draw.x_list, both
          labelled OBJ-NULL-RFB. Each was checked against the independently reconstructed
          deterministic base. bits 16 - deterministic base digest
          4521b0d1231554cfbbbd0aeb601f913ad64f30426dd7ebe6f3b61bc77fe75ea1, archived list
          digest bb27d554bd4705ff41245b1ae149bd44758f7ca4405ceefd4204cba3b80b56ba, overlap
          12 of 512 elements. bits 20 - deterministic base digest
          d7a8c2bbe474821bfe95185b6f05c4ee7b2b0f0ab5c805f7f34c1c7303d8fa69, archived list
          digest 1f30bbd5b15ed12cccb8c741010b4ed9849b88c84a02b877b15783558f3d789b, overlap
          1 of 512. The deterministic base is confined to x <= 1052 (bits 16) and x <= 1056
          (bits 20); both archived lists span the full field range (max 46513 and 764853) and
          are not in increasing order. Neither deterministic-base digest appears anywhere in
          any of the five archived files.
      - id: C1-b
        claim: no half-tuple of the deterministic factor base was enumerated
        result: CONFIRMED
        evidence: >-
          Both archived x-lists were re-enumerated through INT-2 by this Validator and every
          derived statistic in the package reproduced from them; there is no statistic in the
          package that does not reproduce from a null draw. Every one of the 621 null-stream
          draw indices per cell is accounted for as 400 CAL-1 plus 200 CAL-2 plus 20 CAL-3
          plus 1 CAL-4, matching null_stream_draws_consumed = 621 and the recorded
          seed_sequence_sha256 (recomputed independently - see check 4).
      - id: C1-c
        claim: the real-arm null stream was not consumed
        result: CONFIRMED
        evidence: >-
          stream_hashes at both cells lists exactly four consumed streams - calibration_null
          (621 draws), calibration_plant (100), calibration_independent_pair (20),
          calibration_uniform_pair (1). The stream name real_arm_null appears in the package
          exactly once, inside raw-result.json frozen_parameters.stream_offsets as a DECLARED
          offset, and never as a consumed stream.
      - id: C1-d
        claim: the module tripwire was recorded false
        result: CONFIRMED
        evidence: >-
          raw-result.json payload.ats1_clause_2_real_data_touched is false, and
          cells.16.real_data_touched and cells.20.real_data_touched are both false;
          instrument_characterization.json carries the same false at both cells.
      - id: C1-e
        claim: the package contains no factorization, smoothness statistic, Dickman evaluation, search arm, timing decision variable, cost identity or R
        result: CONFIRMED
        evidence: >-
          The full key set of all four JSON artifacts was enumerated. No key or string
          matching factoriz, smooth, Dickman, largest_prime, relation, claw, cost or R as a
          decision variable occurs. The only occurrences of timing and wall are
          raw-result.json timing.wall_seconds, declared as budget accounting. The only
          occurrences of the word threshold are inside the two disclaimer strings that state
          NO threshold is frozen.
    honest_qualification: >-
      One thing IS computed from the same underlying object in calibration mode and should be
      stated rather than glossed - Cell.__init__ materialises X_E in memory at both cells in
      both modes, and |X_E| (23430 and 383713) is recorded as a declared CAL-4 output. The
      deterministic factor base is a deterministic function of X_E, so the datum from which it
      could be derived is present in the process; what never happens, and what clause 2
      actually claims, is that no half-tuple of it is enumerated, no sample of it appears in
      the package, and no statistic is computed from one. All three were verified above.
      |X_E| is a curve fact, is a declared CAL-4 output, and carries no information about the
      fibre-invariant statistics of the real object.

  # ======================================================================
  # CHECK 2 - REAL-ARM ENTRY POINT PRESENT, REACHABLE, UNEXECUTED
  # ======================================================================
  check_2_real_arm_entry_point:
    verdict: PASS_WITH_QUALIFICATION
    entry_point_present: true
    entry_point_reachable: true
    entry_point_executed: false
    evidence_present_and_reachable: >-
      run_real_arm is defined at eqd001_driver.py:745 and is called at line 980 from main()
      inside the args.mode == "real" branch, once per bits in FIELD_BITS. It is complete - it
      computes DV-1 through DV-7, the STAT-DUP tell, PC-1, the apparatus-identity check and
      CTRL-EQD-S3 - and it takes its thresholds from the reading rule as DATA via
      load_reading_rule(), so ATS-1 clause 5 is satisfiable without a code edit.
    evidence_not_executed: >-
      command.txt and manifest.yaml both record --mode calib; stdout.log contains only
      mode=calib and the CAL-1..CAL-4 stage lines; raw-result.json records mode calib and
      status completed_valid; stderr.log is zero bytes; and no EQD_report.json (the real
      arm's declared output) exists at the snapshot. The four artifact-side facts of check 1
      are the structural confirmation.
    guard_analysis:
      - id: G-1
        guard: module tripwire _REAL_DATA_TOUCHED
        does_what_is_claimed: true
        assessment: >-
          Verified by source reading and by exhaustive grep, not by trusting the docstring.
          _REAL_DATA_TOUCHED is written at exactly one site, line 506, inside
          deterministic_factor_base(), which is called from exactly one site, line 766, inside
          run_real_arm(). cell.X_E is read at exactly three sites - line 355 (its size only),
          line 507 (inside deterministic_factor_base) and nowhere else; the boolean membership
          array is_x_of_E is used only for point-multiset construction and for the CAL-4
          support-fraction lookup, neither of which enumerates the first 512 elements. So
          within the bound file there is no second path to the deterministic base, and the
          tripwire cannot be bypassed by another code path in it.
        residual: >-
          The tripwire detects a FUNCTION CALL in this module, not access to the data. Any
          code outside the bound file that computed X_E[:512] itself would not set it. That
          residual is bounded by ATS-1 clause 5 - TASK-20260801-027 must execute this exact
          hash-bound file - and by check 1, which verifies the absence of the data
          artifact-side rather than trusting the flag. The two checks are independent, which
          is why the residual does not undermine the clause-2 verdict.
      - id: G-2
        guard: refusal of --mode real without an APPROVED receipt and a frozen reading rule
        does_what_is_claimed: true
        trivially_satisfiable: PARTIALLY
        assessment: >-
          Exercised, not merely read. Three refusals were run into a scratch directory -
          (a) no --approval-receipt refused with "real mode requires --approval-receipt
          pointing at the TASK-20260801-026 snapshot receipt"; (b) a receipt whose
          APPROVAL_DETERMINATION is NOT_APPROVED refused with "APPROVAL_DETERMINATION is not
          APPROVED"; (c) a FABRICATED receipt containing the literal
          {"APPROVAL_DETERMINATION":"APPROVED"} refused at the next gate with "real mode
          requires the frozen reading rule from TASK-20260801-023". Each refusal is recorded
          as status failed_infrastructure / specification_error with an empty payload, so a
          refused start cannot be mistaken for a result. The real arm was NOT executed past
          gate (c) by deliberate choice.
        named_weakness: >-
          The receipt gate checks only that a readable JSON file exists whose
          APPROVAL_DETERMINATION field equals the string APPROVED. It does not check the
          receipt's provenance, its task id, its commit binding or any hash, and the reading-
          rule gate checks only file existence and required-field presence, not a frozen
          digest. The gate therefore prevents ACCIDENTAL invocation, which is what
          implementation.md actually claims ("cannot be started today even by accident"), and
          does not prevent deliberate or careless invocation by anyone who can write two small
          files. This is a defect of assurance strength, not of the calibration package, and
          it is recorded as D-3.
      - id: G-3
        guard: the package contains no real sample
        does_what_is_claimed: true
        assessment: Verified independently under check 1; the strongest of the three guards because it is checked against bytes rather than against control flow.
    documentation_discrepancy: >-
      The driver docstring at lines 21-22 states that run_calibration() "asserts that the
      tripwire is still False when it finishes". It does not - run_calibration() only RECORDS
      the tripwire at line 691, and the assertion is at main():992, after both cells and
      before _emit_calibration_results() at line 998. The guard is therefore functionally
      present and correctly ordered, and only the docstring is inaccurate.
      implementation.md line 53 describes the arrangement correctly. No impact on this run;
      recorded so the discrepancy is not rediscovered as a finding later.

  # ======================================================================
  # CHECK 3 - DRIVER HASH BINDING
  # ======================================================================
  check_3_driver_hash:
    verdict: PASS
    independently_recomputed_sha256: bdb2601b195f314a4430fa80fcf8ab15ec0b605335a8386a93c2b9b3c7d7b02f
    method: sha256 of the file extracted from the snapshot tree with git archive, recomputed with shasum -a 256, independently of any recorded value
    matches_run_manifest: true
    manifest_value: bdb2601b195f314a4430fa80fcf8ab15ec0b605335a8386a93c2b9b3c7d7b02f
    matches_task_022_receipt_DRIVER_SHA256: true
    receipt_value: bdb2601b195f314a4430fa80fcf8ab15ec0b605335a8386a93c2b9b3c7d7b02f
    matches_raw_result_driver_sha256: true
    matches_task_prompt_claim: true
    also_verified:
      - The same digest appears in the receipt's source_path_sha256 map for the driver path, and all 12 entries of that map were recomputed against the snapshot content and all 12 matched.
      - The receipt's declared_paths (13) exactly equals the set of paths changed by 53e202dd2 relative to its parent - no extra, none missing.
      - The receipt's parent_sha e9e601bd82eab31eb9fd083f31cfd62a772beb80 equals the actual git parent of 53e202dd2, and equals the code.commit recorded in manifest.yaml (with dirty true, consistent with the artifacts being uncommitted at execution time).
      - fibre_invariant_map_sha256 2577139d51b010bc2a8226803b5699ad4395044bcd0ae9eaf4f55c29d53d32d1 and specification_sha256 295d85c748cf9d1d14e2746d3067fbbbc0a7fc9ebd8b62ccbdbe021a6dc99431 reproduced identically on re-execution; the spec digest equals SPEC_SHA256_AT_FREEZE recorded in the driver and matches the 7792331b hash-binding named in the handoff.
      - The tree is clean and experiments/EXP-EQD-001 is byte-identical between 53e202dd2 and current HEAD c52cd37f, so no post-snapshot drift has occurred in the reviewed package.
    minor_observation: >-
      The receipt records commit_sha - null. That is structurally unavoidable, since the
      receipt is itself one of the 13 declared paths and cannot contain its own commit's
      digest. The binding to 53e202dd2 was instead established here by parent_sha plus an
      exact declared-path-set match plus 12 of 12 content digests, all verified. Recorded for
      completeness, not as a defect.

  # ======================================================================
  # CHECK 4 - REPRODUCIBILITY AND ARITHMETIC
  # ======================================================================
  check_4_reproducibility:
    verdict: PASS
    full_reexecution:
      performed: true
      note: >-
        The recorded command was re-executed verbatim at the snapshot revision with --out-run
        and --out-results redirected into a scratch directory, so that nothing in the
        repository was written. This is the reproducibility pointer EXERCISED, not asserted.
      command: >-
        python3 experiments/EXP-EQD-001/implementation/eqd001_driver.py --mode calib --out-run
        <scratch>/run --out-results <scratch>/results --run-id RUN-EQD-001-calib
        --wall-clock-seconds 3600 --requested-policy executor-implementation
        --resolved-model-id claude-opus-5
      exit_status: 0
      wall_seconds: 58.92
      peak_rss_bytes: 171409408
      artifacts_rebuilt_from_scratch:
        - null_replicate_statistics.json - BYTE-IDENTICAL to the archived file
        - power_curve.json - BYTE-IDENTICAL to the archived file
        - instrument_characterization.json - BYTE-IDENTICAL to the archived file
        - raw-result.json - payload sub-object IDENTICAL; only timing and resources differ, as they must
      conclusion: All three declared result files reproduce. The run is deterministic under the recorded seed policy.
    independent_regeneration:
      note: >-
        Independently of the re-execution above, the sampler and every statistic were
        RE-IMPLEMENTED from the documented algorithm in a separate module that does not import
        the driver - object-dtype modular arithmetic instead of the driver's int64
        vectorisation, a Counter-based contingency table for chi-square, scipy.stats.ks_2samp
        for the KS statistics, and a Counter-based STAT-DUP - and used to regenerate declared
        draws from their seeds. This is what makes the agreement below evidence about the
        numbers rather than about the code being run twice.
      cal1_replicate_pairs_regenerated:
        - bits 16, replicate pairs r = 0, 1, 199 (null-stream draw indices 0,1,2,3,398,399)
        - bits 20, replicate pairs r = 0, 1, 199
      cal1_agreement: >-
        All 6 regenerated replicate pairs (12 independently regenerated random factor bases)
        agree with the archived values on every statistic. Examples - bits 16 r=0 STAT-CHI-16
        mine 212.2525809959373 vs archived 212.2525809959372, STAT-CHI-64 4019.628111500089 vs
        4019.6281115001, STAT-KS1-E1 0.0057408879647749544 exactly, STAT-KS1-E2
        0.0020869006849314475 exactly, STAT-DUP 90 and 20 exactly; bits 20 r=199 STAT-CHI-16
        321.2809474845538 vs 321.28094748455374, STAT-KS1-E1 0.004066780821917804 exactly.
        Float differences are at the last ulp and arise only from summation order in the two
        independent chi-square implementations. Per-draw redraw counts also matched exactly
        (bits 16 r=0 - 7 and 3; bits 20 r=199 - 1 and 0).
      independence_of_replicates_verified: >-
        CONFIRMED, and this is the property THR-EQD-1's stated level depends on. Replicate 199
        was regenerated WITHOUT replaying replicates 0..198 and matched exactly, which
        demonstrates that the stream is index-addressable (draw_seed(k) = sha256 of
        "<seed>:<name>:<k>") and that the 400 factor bases per cell come from 400 distinct
        seeds rather than a chained pool. All 621 null draw seeds per cell are pairwise
        distinct (621 of 621), and the recorded seed_sequence_sha256 for the calibration_null
        stream was recomputed independently and matched at both cells (bits 16
        344c309d1754bca6f855..., bits 20 0a7645438aca3cc0376e...). CAL-1 therefore used 200
        INDEPENDENT DISJOINT replicate pairs, 400 independent random factor bases per cell.
      cal2_regenerated: bits 16 and bits 20, delta = 0.10, replicate 0 - every statistic, the n_replaced count and both STAT-DUP arms reproduced exactly.
      cal3_regenerated: bits 16 and bits 20, replicate 0 - every statistic and both STAT-DUP arms reproduced exactly.
      cal4_regenerated: both cells, both support fractions reproduced exactly (see below).
      ctrl_eqd_s3_regenerated: >-
        CTRL-EQD-S3 was re-verified INDEPENDENTLY on the representative null draw of each cell
        by lifting each x to a point, forming P+Q and P-Q with the toycurve group law and
        checking e_1 == x(P+Q)+x(P-Q) and e_2 == x(P+Q)*x(P-Q) mod p. Result 1000 of 1000 at
        bits 16 and 1000 of 1000 at bits 20, matching the archived record.

  metric_recomputations:
    - id: M-1
      quantity: CAL-1 199th-of-200 ascending order statistics (the numbers THR-EQD-1 selects)
      source: recomputed from the 200 archived raw replicate values per statistic per cell, not copied from measured_order_statistics
      result: EXACT AGREEMENT with both the archived summary and the values named in the task prompt
      values:
        bits_16:
          STAT-CHI-16: 315.4755320010126
          STAT-CHI-64: 4345.885305765976
          STAT-KS1-E1: 0.006191903131115506
          STAT-KS1-E2: 0.00623012475538165
        bits_20:
          STAT-CHI-16: 326.2209621328956
          STAT-CHI-64: 4293.229704961268
          STAT-KS1-E1: 0.006841670743639949
          STAT-KS1-E2: 0.00631421232876711
      auxiliary_recomputed_and_agreeing: min, max (200th), median, mean and sample stdev of all four statistics at both cells all reproduce from the raw values
      tie_check: >-
        At all eight statistic-by-cell combinations exactly one of the 200 values equals the
        199th order statistic and exactly one is strictly greater, so the strict-greater
        comparison rule is unambiguous and THR-EQD-1's stated exact level of 2/201 = 0.00995
        is intact AS MEASURED for the four two-sample statistics. Noted for completeness - the
        two KS statistics are lattice-valued (186 and 173 distinct values out of 200) and ties
        do occur elsewhere in their distributions; a future value landing exactly on the
        threshold would not reject, which makes the test conservative, never anti-conservative.
    - id: M-2
      quantity: CAL-1 STAT-DUP band, 3rd and 398th of 400
      source: recomputed from the 400 archived raw STAT-DUP values per cell
      result: EXACT AGREEMENT with the archived summary and with the values named in the task prompt
      values:
        bits_16: "[0, 110] - min 0, max 182, median 20.0, mean 30.8225, 11 of 400 draws equal 0, 5 equal 110, 2 strictly above 110"
        bits_20: "[0, 0] - min 0, max 0, median 0.0, mean 0.0, all 400 draws exactly 0, zero variance"
      see_defects: D-1 and D-2
    - id: M-3
      quantity: CAL-2 detection rates at every delta on the frozen ladder
      source: recomputed from the archived per-replicate CAL-2 rows against a threshold recomputed from the archived CAL-1 values
      result: EXACT AGREEMENT with every rate recorded in power_curve.json, at both cells, all five deltas, all four statistics
      bits_16:
        "0.005": "CHI-16 0/20, CHI-64 0/20, KS1-E1 0/20, KS1-E2 0/20"
        "0.01": "CHI-16 0/20, CHI-64 1/20, KS1-E1 7/20, KS1-E2 1/20"
        "0.02": "CHI-16 1/20, CHI-64 0/20, KS1-E1 20/20, KS1-E2 0/20"
        "0.05": "CHI-16 20/20, CHI-64 5/20, KS1-E1 20/20, KS1-E2 1/20"
        "0.10": "CHI-16 20/20, CHI-64 20/20, KS1-E1 20/20, KS1-E2 1/20"
      bits_20:
        "0.005": "CHI-16 0/20, CHI-64 0/20, KS1-E1 0/20, KS1-E2 0/20"
        "0.01": "CHI-16 0/20, CHI-64 0/20, KS1-E1 7/20, KS1-E2 0/20"
        "0.02": "CHI-16 0/20, CHI-64 1/20, KS1-E1 20/20, KS1-E2 0/20"
        "0.05": "CHI-16 20/20, CHI-64 9/20, KS1-E1 20/20, KS1-E2 0/20"
        "0.10": "CHI-16 20/20, CHI-64 20/20, KS1-E1 20/20, KS1-E2 0/20"
      plant_size_check: n_replaced is a single value per delta at both cells and equals int(round(delta * 130816)) exactly - 654, 1308, 2616, 6541, 13082
    - id: M-4
      quantity: CERT-EQD-1 predicate, evaluated as an ARITHMETIC CHECK only
      source: the recomputed M-3 rates
      recomputation: >-
        The smallest delta on the frozen ladder whose measured detection rate is at least 0.95
        at BOTH bit sizes for at least one of STAT-CHI-16 or STAT-CHI-64 is delta = 0.05, via
        STAT-CHI-16 (20/20 = 1.00 at bits 16 and 20/20 = 1.00 at bits 20). STAT-CHI-64 does
        not reach the bar at 0.05 (5/20 = 0.25 and 9/20 = 0.45) and first reaches it at 0.10.
        No smaller delta qualifies for either statistic. Under the frozen tie-break
        (smallest delta first) the certifying statistic at that delta is STAT-CHI-16, the only
        one of the two that qualifies there.
      cal_stop_1_first_leg: NOT MET - a delta meeting the CERT-EQD-1 bar at both bit sizes exists
      binding_status: >-
        REPORTED AS ARITHMETIC, NOT FROZEN AND NOT DECLARED. TASK-20260801-023 owns the freeze
        and must recompute it from the archived values itself; this line exists so that a
        disagreement between the two computations would be visible.
      precision_caveat: >-
        With R_REPS = 20 a 0.95 bar can only be met by 19/20 or 20/20, so the certification is
        effectively a 20-of-20 test. A statistic whose true power is 0.90 passes it about 12
        percent of the time and one whose true power is 0.97 fails it about 46 percent of the
        time. The certified delta is therefore a coarse quantity and its uncertainty is a
        limitation of the calibration, not of the arithmetic.
    - id: M-5
      quantity: CAL-3 dependency-structure exceedance rates
      source: recomputed from the archived 20 CAL-3 rows per cell against the recomputed CAL-1 199th order statistics
      result: EXACT AGREEMENT with instrument_characterization.json
      bits_16: "CHI-16 1/20 = 0.05, CHI-64 0/20 = 0.0, KS1-E1 0/20 = 0.0, KS1-E2 0/20 = 0.0"
      bits_20: "CHI-16 0/20 = 0.0, CHI-64 1/20 = 0.05, KS1-E1 0/20 = 0.0, KS1-E2 1/20 = 0.05"
      reading: >-
        Instrument characterization only, per the artifact's own cal3_note. The exceedances are
        1 in 20 at a per-test level of 0.00995, i.e. at the noise floor of a 20-replicate
        estimate; they are reported here as recomputed numbers and are not interpreted.
    - id: M-6
      quantity: CAL-4 characterization numbers
      source: >-
        #E(F_p), |X_E| and the 2-adic valuation were computed INDEPENDENTLY of the driver -
        the curve was rebuilt from harness.toycurve.generate_instance(2301, bits) and the point
        count obtained by evaluating the Legendre symbol of x^3+ax+b at every x in F_p with
        Python's built-in pow, cross-checked against sympy.legendre_symbol on a 500-point
        sample. Support fractions were recomputed with an independent square-root and
        membership routine.
      results:
        bits_16: >-
          p = 46663 (prime, 3 mod 4), a = 35281, b = 42152 - all match the archived descriptor.
          #E(F_p) = 46860 CONFIRMED independently (Hasse - |46860 - 46664| = 196 <= 431).
          2-adic valuation = 2 CONFIRMED (46860 = 4 * 11715). |X_E| = 23430 CONFIRMED,
          |X_E|/p = 0.5021108801405825 CONFIRMED. affine point count 46859 CONFIRMED.
          support_fraction_OBJ_NULL_UNIF2 = 0.1256574119373777 REPRODUCED EXACTLY.
          support_fraction_OBJ_NULL_RFB = 1.0 REPRODUCED EXACTLY (exactly 1.0 as the contract requires).
        bits_20: >-
          p = 767551 (prime, 3 mod 4), a = 170405, b = 120633 - all match. #E(F_p) = 767427
          CONFIRMED independently (Hasse - |767427 - 767552| = 125 <= 1752). 2-adic valuation
          = 0 CONFIRMED (767427 is odd). |X_E| = 383713 CONFIRMED, |X_E|/p =
          0.49991857218608277 CONFIRMED. affine point count 767426 CONFIRMED.
          support_fraction_OBJ_NULL_UNIF2 = 0.12369282045009784 REPRODUCED EXACTLY.
          support_fraction_OBJ_NULL_RFB = 1.0 REPRODUCED EXACTLY.
      note: >-
        Both curve orders were verified by exhaustive point counting over the whole field, so
        they are established facts here and not restatements of the driver's own computation.

  control_checks:
    - id: CTRL-EQD-S3
      required: 1000 of 1000 at both cells
      recorded: 1000 of 1000 at bits 16 and 1000 of 1000 at bits 20
      independently_reverified: true
      result: PASS
      note: >-
        Executed on the representative OBJ-NULL-RFB draw per DEV-1, not on the real
        enumeration. It certifies that INT-2 as implemented really produces the elementary
        symmetric functions of {x(P+Q), x(P-Q)} on a null object. The real arm must run it
        again on the real enumeration; this run does not and could not discharge that.
    - id: CTRL-EQD-RANGE
      required: every recorded e_1 and e_2 in [0, p) and exactly 130816 pairs per arm
      result: PASS
      evidence: >-
        range_violations = 0 at both cells; the driver enforces min >= 0 and max < p on every
        null arm before recording. Independently verified on all 12 regenerated CAL-1 arms
        plus the regenerated CAL-2, CAL-3 and CAL-4 arms - every one carried exactly n =
        130816 and every coordinate lay in [0, p).
    - id: degenerate-draw-count
      required: exactly zero c_2 = 0 draws on every arm
      result: PASS
      evidence: >-
        degenerate_draw_count = 0 at both cells. The exclusion is genuinely BY CONSTRUCTION -
        upper_triangle_indices() uses np.triu_indices(512, k=1), i.e. strictly i < j, so the
        diagonal is never generated; the count 130816 = C(512,2) is declared from the
        construction and not obtained by counting and dropping. enumerate_factor_base()
        additionally refuses any base whose 512 x-coordinates are not distinct. Independently
