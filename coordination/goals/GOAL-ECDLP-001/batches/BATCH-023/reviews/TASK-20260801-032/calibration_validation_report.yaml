    - id: empty-cell-omission
      required: recorded
      result: PASS
      evidence: The maximum empty_cell_omission_count over all 200 CAL-1 replicates is 0 at K=16 and 0 at K=64 at both cells, so no contingency cell was omitted and every chi-square used the full 256 or 4096 cells with df = nonempty - 1.
    - id: matched-arm-sizes
      required: every arm at exactly n = 130816
      result: PASS
      evidence: Verified on the archived records and on every independently regenerated arm. Two-sample matching is by construction, not by argument.
    - id: null-object-control-inventory
      note: >-
        Per docs/inventor-protocol.md section 3, recorded for the record - this run is
        ENTIRELY null objects. OBJ-NULL-RFB is the matched null of the same shape,
        OBJ-NULL-IND is a second null of the same shape with different dependency structure,
        OBJ-NULL-UNIF2 is a structureless null, and OBJ-PLANT-delta is a positive control with
