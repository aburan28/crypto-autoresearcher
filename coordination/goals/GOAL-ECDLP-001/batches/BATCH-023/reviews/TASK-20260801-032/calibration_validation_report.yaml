        no certified delta anywhere (no such key exists in any artifact). The claim that a
        rate cannot be produced without evaluating the frozen form is correct.
    - id: DEV-4
      declared_as: determinism re-execution into scratchpad, not a run of record
      honest: true
      impact: none_adverse
      assessment: >-
        Independently CORROBORATED - this Validator performed the same re-execution and
