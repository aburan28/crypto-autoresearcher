    - id: HV-2
      applicable: yes
      subject: the pre-run expectation the calibration was run against
      finding: >-
        The specification's own pre-run expectation for STAT-DUP, n^2/(2S) with S about p^2/8,
        was checked against the measurement - it matches at bits 16 (predicted 31.4 per arm,
        observed mean 30.82) and is falsified at bits 20 (predicted 0.116 per arm, so about 46
