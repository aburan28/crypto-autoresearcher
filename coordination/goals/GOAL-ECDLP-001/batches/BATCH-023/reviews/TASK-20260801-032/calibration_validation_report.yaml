    - id: DEV-3
      declared_as: detection rates produced by mechanical evaluation of the frozen THR-EQD-1 form, no threshold frozen
      honest: true
      impact: none_adverse_but_load_bearing
      assessment: >-
        The most consequential deviation and the most honestly declared. Verified in the
        source - measured_detection_rates() recomputes the 199th order statistic from the same
        run's CAL-1 values every time it is called and applies the strict-greater rule; it
        writes no threshold as a threshold. Verified in the artifacts - all 200 raw replicate
