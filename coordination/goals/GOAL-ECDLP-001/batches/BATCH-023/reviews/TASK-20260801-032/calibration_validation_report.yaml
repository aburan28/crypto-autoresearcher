  degenerate_statistic_findings:
    preamble: >-
      Reported as measured facts with their mechanisms. CAL-STOP-1 second_stop_leg exclusion
      is TASK-20260801-023's pre-declared call and is NOT made here. What is stated here is
      what the data show, because 023 must not freeze a threshold on a statistic that cannot
      decide.
    findings:
    - id: DS-a
      statistic: STAT-DUP
      observation: bits-20 STAT-DUP is identically 0 across all 400 CAL-1 draws, giving the zero-variance band [0, 0]
      measured: 400 of 400 draws equal 0; sample variance exactly 0; multiplicity histogram of the (e_1,e_2) values on a regenerated bits-20 arm is {1 - 130816}, i.e. not one repeated value in 130816
      mechanism_established_by_this_validator: >-
        This is STRUCTURAL, not a sampling accident, and that distinction matters for 023.
        Two half-tuples {x_i,x_j} and {x_k,x_l} from one base collide iff they give the same
        unordered root pair {x(P+Q), x(P-Q)}. Translating BOTH points by the same 2-torsion
        point T leaves P+Q and P-Q unchanged, which is a collision generator. At bits 20,
        #E(F_p) = 767427 is ODD, so E(F_p)[2] is trivial - the cubic x^3+ax+b has no root in
        F_p (verified) - and that generator does not exist. At bits 16, #E(F_p) = 46860 has
        2-adic valuation 2 and there is exactly ONE nontrivial 2-torsion point, x = 39489
        (verified). On the archived bits-16 representative draw, 20 of the 512 base points
        have their T-translate also in the base, C(20,2) = 190 index pairs qualify, the
        induced involution pairs them up, and the observed STAT-DUP is 90 with EVERY
        multiplicity exactly 2 - the signature of a single involution, not of birthday
        collisions. Across 400 bits-20 arms, 52.3 million half-tuples produced zero
        collisions, which is decisive empirically even though the injectivity statement is
        not proved here.
      consequence_for_a_threshold: >-
        The spec's idealised expectation for STAT-DUP, n^2/(2S) with S about p^2/8, gives 31.4
        per arm at bits 16 (observed mean 30.82, close) and 0.116 per arm at bits 20, i.e.
        about 46 duplicates expected across the 400 bits-20 arms. Zero were observed. Under
        that idealised model the probability of 0 in 400 is about e^-46. The idealised model
        is therefore FALSIFIED at bits 20 by the calibration's own data, which is exactly what
        the spec anticipated when it insisted the band be calibrated rather than derived - but
        the calibration then measures a constant, not a distribution.
      can_it_carry_a_decision: >-
        At bits 20, no. The band [0,0] has an unestimable level - the two-sided
        order-statistic level of (2+3)/401 = 0.01247 that THR-EQD-1 states requires a
        non-degenerate distribution, and the realized level of the band on the measured null is
        0 of 400, not 0.01247. The lower leg cannot fire because a count below 0 does not
        exist, and the upper leg fires on any single duplicate, an event whose probability the
        calibration bounds only as at most about 0.0075 at 95 percent confidence by the rule
        of three, and which the mechanism above suggests is 0 for ANY base with trivial
        2-torsion. So at bits 20 DV-5 is a control that cannot fail, which means it provides
        no assurance in either direction.
      see_defects: D-1, D-2
    - id: DS-b
      statistic: STAT-KS1-E2
      observation: detection is at most 0.05 at every delta on the ladder
      measured: >-
        bits 16 - 0/20, 1/20, 0/20, 1/20, 1/20 at deltas 0.005, 0.01, 0.02, 0.05, 0.10.
        bits 20 - 0/20, 0/20, 0/20, 0/20, 0/20 at the same deltas. The plant-arm MEAN of
        STAT-KS1-E2 differs from the null mean by at most 0.66 null standard deviations at any
        delta at either cell, and the sign of the shift is not monotone in delta (+0.03,
        +0.16, -0.25, +0.58, +0.06 at bits 16; -0.66, +0.11, +0.02, +0.05, -0.50 at bits 20).
      mechanism: >-
        The executor's attribution is CORRECT and was verified against the frozen plant
        construction in the source - OBJ-PLANT-delta replaces the e_1 coordinate of a delta
        fraction of pairs with a uniform draw from [0, floor(p/2)) and leaves e_2 UNCHANGED
        (driver lines 435-447, out1 modified, e_2 returned as a copy). STAT-KS1-E2 is a
        marginal test on e_2 alone, so under this alternative its distribution is the null
        distribution by construction. The four exceedances observed at bits 16 out of 100
        CAL-2 comparisons are consistent with the per-test false-rejection level of 0.00995
        (expected 1, Poisson P(X >= 4 | 1) is about 0.019 - mildly high but not a signal), and
        the zero exceedances at bits 20 out of 100 are likewise consistent.
      does_it_have_power_against_the_declared_alternatives: >-
        NO. Against OBJ-PLANT-delta, the only alternative class on the frozen ladder,
        STAT-KS1-E2 has no power at any delta, and this is a deductive consequence of the plant
        construction rather than a finite-sample accident. Its measured detection rates are its
        false-rejection rates. It retains a live role only against alternatives that move the
        e_2 marginal, and no such alternative is on the ladder, so the calibration certifies
        nothing about it.
      exclusion_criterion_ambiguity_for_task_023: >-
        Named because 023 must resolve it, not adjudicated here. CAL-STOP-1 second_stop_leg
        names three degeneracy grounds - zero variance, an identically zero value, or a
        threshold the CAL-2 plant at the largest delta cannot exceed. STAT-KS1-E2 has neither
        zero variance nor an identically zero value. On the third ground the two cells
        disagree - at bits 20 the largest-delta plant exceeded the threshold 0 of 20 times, and
        at bits 16 it exceeded it 1 of 20 times, and that single exceedance is a
        false rejection at the nominal level rather than power. Whether "cannot exceed" is
        read as "did not exceed in 20 replicates" or as "has no power by construction"
        determines the answer, and it differs by cell under the first reading. 023 must state
        which reading it applies, and must also account for the family-wise consequence -
        THR-EQD-1's declared attainability of the favourable branch, (1 - 0.00995)^8 = 0.9234
        over eight tests, changes to about 0.9418 over six if a statistic is dropped at both
        cells, so an exclusion silently makes the favourable branch easier to reach and the
        stated 0.0766 misread probability no longer holds as written.
    - id: DS-c
      statistic: STAT-CHI-64
      observation: detection is non-monotone across the delta ladder at bits 16
      measured: 0/20, 1/20, 0/20, 5/20, 20/20 at deltas 0.005, 0.01, 0.02, 0.05, 0.10 - so 0.00, 0.05, 0.00, 0.25, 1.00. At bits 20 the rates are 0.00, 0.00, 0.05, 0.45, 1.00, which is monotone
      diagnosis: >-
        The non-monotonicity is confined to a single replicate and is noise, not a defect of
        the statistic. The underlying plant-arm mean shift IS essentially monotone at bits 16 -
        -0.33, +0.10, +0.05, +1.84, +7.22 null standard deviations across the ladder - and the
        lone exceedance at delta 0.01 is one draw of 20 reaching 4387.97 against a threshold of
        4345.89, entirely consistent with the per-test level of 0.00995 (P of at least one in
        20 draws is 0.18). What the data do show clearly is that STAT-CHI-64 is
        SUBSTANTIALLY LESS SENSITIVE than STAT-CHI-16 to this alternative at every delta -
        +1.84 versus +6.22 null sd at delta 0.05 at bits 16 - which is the expected cost of
        spreading 130816 points over 4096 cells instead of 256. It is a low-power statistic
        against this alternative, not a degenerate one - it has non-zero variance, is not
        identically zero, and IS exceeded by the largest-delta plant 20 of 20 times at both
        cells, so it meets none of the three second_stop_leg grounds.
      caution_for_task_023: >-
        The delta ladder has only five rungs and each rate rests on 20 replicates, so a
        detection rate of 0.25 carries a standard error of about 0.10. Reading the ordering of
        two statistics' rates at a single delta from these numbers is not supported by their
        precision; the mean-shift figures above are the better-resolved quantity.

  defects:
    - id: D-1
      severity: material_for_the_freeze
      class: threshold_form_versus_measured_distribution
      statement: >-
        THE STAT-DUP BAND'S DECLARED EXACT LEVEL IS NOT ATTAINED AT EITHER CELL, AND THE LOWER
        LEG OF THE TELL IS VACUOUS AT BOTH. THR-EQD-1 states a two-sided exact level of
        (2+3)/401 = 0.01247 for the band [3rd, 398th] of 400. The order-statistic level
        argument needs a non-degenerate distribution, and the measured STAT-DUP distribution
        has heavy ties at both band edges. At bits 16 the band is [0, 110] - 11 of 400 draws
        sit AT the lower edge 0, which is the minimum attainable value, so no draw can ever be
        strictly below it; 5 sit at the upper edge 110 and only 2 are strictly above it. The
        realized two-sided level is therefore 2/400 = 0.005, not 0.01247, and the entire level
        is carried by the upper tail. At bits 20 the band is [0, 0], all 400 draws are at both
        edges simultaneously, and the realized level is 0/400 = 0.0.
      consequence: >-
        The "far BELOW its null band" failure mode that the spec gives as half the reason
        STAT-DUP is the artifact tell - a sampler that deduplicates or draws without
        replacement - CANNOT FIRE AT EITHER BIT SIZE. That half of the tell is dead as
        calibrated. The direction of the level error is conservative for false alarms (the tell
        fires less often on a correct null than declared), so it does not inflate false N-1
        firings; it does mean that a reading rule which freezes [0,110] and [0,0] while citing
        0.01247 would be stating a level the data do not support.
      required_of_task_023: >-
        Freeze the band from the measured order statistics if it chooses, but do not carry the
        0.01247 figure to either cell without restating it as the realized 0.005 and 0.0, and
        record explicitly that the below-band leg is unreachable. This is a statement about a
        number that would be frozen, which is why it is raised here and not left to the
        interpretation stages.
    - id: D-2
      severity: material_for_the_freeze
      class: structurally_constant_variable
      statement: >-
        BITS-20 STAT-DUP IS A STRUCTURAL CONSTANT, NOT A CALIBRATED NULL. See DS-a for the
        mechanism and the evidence - E(F_p) has trivial 2-torsion at bits 20, the collision
        generator does not exist there, and 52.3 million half-tuples produced zero collisions.
        DV-5 at bits 20 is therefore a control whose outcome is determined before the real data
        are seen.
      consequence: >-
        A control that cannot fail supplies no assurance. If DV-5 at bits 20 is retained as
        written, the batch should not later cite it as a passed integrity check, because it
        would have passed on any input.
      required_of_task_023: Name the bits-20 STAT-DUP band as degenerate with this measured reason, or state why it is retained despite being constant. Either way the reason must appear in the frozen record.
    - id: D-3
      severity: advisory
      class: gate_assurance_strength
      statement: >-
        The --mode real gate is satisfied by any readable JSON file whose
        APPROVAL_DETERMINATION field is the string APPROVED, plus any YAML file with the five
        required reading-rule fields. Neither is bound to a task id, a commit or a digest.
        Demonstrated by construction in a scratch directory - a two-line fabricated receipt
        passed the approval gate (the run was then stopped at the reading-rule gate and the
        real arm was NOT executed).
      consequence: The gate is an accident guard, which is what implementation.md claims, and is not an authorization control. It should not be described downstream as one.
      required_of_task_023_or_026: If the gate is meant to carry authorization weight, the receipt digest and the reading-rule digest must be bound elsewhere, since ATS-1 clause 5 forbids editing the driver to add the binding.
    - id: D-4
      severity: advisory
      class: freeze_format_fragility
      statement: >-
        run_real_arm indexes rr["thresholds"][cell.bits] and rr["dup_band"][cell.bits] with an
        INTEGER key (driver lines 754-755). A reading_rule.yaml written with quoted keys "16"
        and "20" yields string keys and a KeyError. KeyError is not among the exceptions main()
        catches (TimeoutError, PermissionError, ValueError, RuntimeError), so it would escape
        as an uncaught traceback and NO run package would be written at all - not even a
        failed_infrastructure record. The driver may not be edited under ATS-1 clause 5, so the
        constraint falls entirely on the freeze format.
      required_of_task_023: Write the reading_rule.yaml bit-size keys as bare integers, and verify by loading the file and indexing it with int keys before the real arm is dispatched.
    - id: D-5
      severity: cosmetic
      class: documentation_inaccuracy
      statement: The driver docstring (lines 21-22) says run_calibration() asserts the tripwire is false; the assertion is actually in main() at line 992, and run_calibration() only records it at line 691. implementation.md describes the arrangement correctly. Functionally correct and correctly ordered before result emission; only the docstring is wrong.
      required_of_anyone: nothing, recorded so it is not rediscovered as a finding
    - id: D-6
      severity: cosmetic
      class: receipt_self_reference
      statement: The TASK-20260801-022 receipt records commit_sha as null, because the receipt is one of the 13 paths the commit creates. The binding was verified here by parent_sha, an exact declared-path-set match against git, and 12 of 12 content digests. Recorded for completeness.

  deviation_assessment:
    - id: DEV-1
      declared_as: CTRL-EQD-S3 executed on the null side
      honest: true
      impact: none_adverse
      assessment: >-
