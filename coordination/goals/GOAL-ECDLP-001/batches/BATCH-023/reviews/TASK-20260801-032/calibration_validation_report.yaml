    - The numpy PCG64 stream itself was not audited; it was used identically in the regeneration, so the regeneration proves reproducibility and determinism, not that the generator is a good source of randomness. No claim in this report depends on the latter.
    - Whether the calibration TUNED the experiment is not assessed here at all; that is TASK-20260801-025's named duty, deliberately assigned to a different session.
    - The executor's DEV-5 pre-run smoke test is not artifact-checkable in either direction; it is recorded as declared and its residual is stated above.
    - The identity of the resolved model behind requested_policy review-adversarial was not probe-verified (model_verified false), here and in the run manifest.

  what_could_not_be_verified:
    - The real arm's behaviour on real data, by design and by rule. No OBJ-REAL statistic was computed by this Validator and none should be until TASK-20260801-026 authorizes it.
    - The exact false-positive rate of the bits-20 STAT-DUP band. It cannot be estimated from a sample in which the statistic never varied; the rule-of-three 95 percent upper bound from 400 zeros is about 0.0075, and the mechanism argues it is 0, but neither is a measurement of a rate.
    - Whether the collision-generation mechanism identified in DS-a is exhaustive. It is established empirically (52.3 million half-tuples, zero collisions at bits 20; every bits-16 duplicate of multiplicity exactly 2, matching the single involution) and by a direct argument, but it is not proved here that 2-torsion translation is the only collision route.

  limitations:
    - Toy scale only, 16-bit and 20-bit primes. AGENTS rule 7 - nothing here is crypto-scale validation of anything.
    - The calibration is expressly NON-EVIDENTIAL about H-EQD-001, HEUR-DS-1 and H-SMTH-001 in either direction; this report inherits that and asserts no disposition.
    - CAL-2 and CAL-3 rest on 20 replicates per cell per delta, so every rate here has a standard error of up to 0.11 and the 0.95 certification bar is effectively a 20-of-20 test.
    - The calibrated null is the distribution for UNIFORMLY RANDOM 512-point factor bases. That is an instrument fact about what the band and thresholds calibrate, and it is stated here only in that scope; what a rejection at the real arm would mean is an interpretation question for the reviewer and red team, not for this report.
    - Two cells only, one curve instance per cell, one master seed (2301). No across-instance variability was measured, so none of the null distributions here is known to be stable across curve instances at the same bit size.
    - Independence from the producing agent is procedural, not model-level (see inference block).

