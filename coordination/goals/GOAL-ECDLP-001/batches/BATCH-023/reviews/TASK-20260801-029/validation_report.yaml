  anomaly_assessment:
    - anomaly: 'manifest code.dirty true while the tree is asserted clean at invocation'
      honesty: HONEST AND CORRECTLY EXPLAINED
      impact: NONE on any measured quantity
      verification: >-
        The explanation is consistent with the archived data AND with the driver
        source. In main(), write_json of raw-result.json and environment.json runs
        BEFORE git_state() is called, and git_state() computes dirty as
        bool(git status --porcelain); the driver therefore observes its own
        just-written untracked artifacts. The flag is structurally guaranteed to
        be true for any successful run of this driver and carries no information
        about source edits.
      residual_gap: >-
        No pre-run `git status --porcelain` capture is archived, so the assertion
        that the tree was clean at invocation cannot be verified directly from the
        package - it is an executor statement. It is however bounded where it
        matters - the driver, specification and reading rule at commit
        d7b532ded all hash to the recorded values, so no uncommitted edit could
        have touched any load-bearing file. Recommendation for future runs, not a
        defect here - have the wrapper write the pre-run porcelain output into the
        run directory.
    - anomaly: '1.62 s wall clock against an 1800 s budget'
      honesty: HONEST
      impact: NONE
      verification: >-
        Independently reproduced at 1.4 s. The work is arithmetically small - 12
        arms of 130816 pairs in vectorized numpy - against the calibration arm's
        400-plus arms. A fast run is not a truncated run - stdout records
        status=completed_valid, exit status was 0, stderr is empty, and every
        declared arm and control is present with a value. Flagging it rather than
        passing over it in silence is the correct disclosure.
    - anomaly: 'the C-2 diagnostic was produced by a read-only scratchpad script outside write_scope and is not archived'
      honesty: HONEST, and the recomputability claim is now TESTED
      impact: >-
        LOW. The claim that every number it produced is recomputable was tested
        directly in this session and is TRUE. This validator wrote its own
        diagnostic from scratch, using a different translate-map implementation
        cross-checked against point addition, and reproduced 39489, 45, 5, 40, 20
        orbit pairs, 20 involution-translate duplicate pairs and 0 non-involution
        pairs, plus the set equality between orbit pairs and observed collisions.
        The unarchived script is therefore not load-bearing - the numbers stand on
        their own recomputability.
      residual_gap: >-
        The 5 and the 20 orbit-pair counts appear only in the execution report
        prose; matched_null_comparison.json archives 45 but not the 5 / 40 / 20
        decomposition as machine fields. If the C-2 account becomes load-bearing
        for a disposition, a scoped successor task should archive the diagnostic
        script and the decomposition as machine-readable fields. Recorded as a
        limitation, not a defect.
    - anomaly: 'the unpredicted 45 = 5 + 2 * 20 identity'
      honesty: HONEST, and the disclosure standard is correct
      impact: >-
        POSITIVE. Recording an unpredicted structural identity rather than
        smoothing it away is exactly AGENTS rule 8. On independent examination the
        identity is not a coincidence but a consequence - 10 base x-coordinates
        have their translate in the base, that 10-set is closed under a
        fixed-point-free involution so it splits into 5 pairs, and C(10, 2) = 45
        with 5 setwise-invariant half-tuples leaves 40 in 20 orbits. The executor
        was right to flag it as unpredicted and right not to interpret it.

