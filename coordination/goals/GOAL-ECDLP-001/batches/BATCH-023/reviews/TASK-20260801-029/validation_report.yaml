  C_2_involution_verification:
    status: INDEPENDENTLY CONFIRMED, and stronger than the executor claimed
    method: >-
      Validator-written arithmetic. The 2-torsion x-coordinates were found as the
      roots of x^3 + a x + b in F_p by exhaustive search over F_p, not read from
      the package. The translate map iota(x) = x(P + T) was computed BOTH by the
      closed form (x^3 + a x + b) / (x - t)^2 - x - t AND by explicit point
      addition through harness.toycurve, and the two agreed on every one of 60
      cross-checked base points with zero mismatches. The factor base was rebuilt
      from scratch and its sha256 matched.
    findings_bits_16:
      unique_nontrivial_2_torsion_x: 39489
      uniqueness_verified: >-
        Exhaustive search over all x in F_p finds EXACTLY ONE root of
        x^3 + a x + b, namely 39489, consistent with #E = 46860 having 2-adic
        valuation 2 and E(F_p)[2] cyclic of order 2.
      t_is_not_itself_in_the_base: >-
        CONFIRMED. The base is the first 512 x-coordinates in increasing order,
        running from 0 to 1052, so 39489 is not among them and iota is defined on
        all 512 base elements.
      base_indices_whose_translate_lands_back_in_the_base: 10
      half_tuples_with_both_indices_translating_into_the_base: 45
      setwise_iota_invariant_half_tuples: 5
      moved_half_tuples: 40
      translate_orbit_pairs: 20
      identity_45_equals_5_plus_2_times_20: CONFIRMED
      observed_duplicate_pairs: 20
      involution_translate_pairs: 20
      non_involution_pairs: 0
      orbit_set_equals_observed_duplicate_set: >-
        CONFIRMED AS SET EQUALITY, not merely as a matching count. The set of 20
        iota-orbit pairs of half-tuples is IDENTICAL to the set of 20 index pairs
        that actually carry equal (e_1, e_2) values.
    structural_account: >-
      The mechanism is not merely observed, it is forced. For a 2-torsion point T,
      (P + T) + (Q + T) = P + Q + 2T = P + Q and (P + T) - (Q + T) = P - Q, so
      both x(P + Q) and x(P - Q) are unchanged by simultaneous translation, hence
      e_1 and e_2 are iota-invariant and every translate pair MUST collide.
      Further, exactly 10 base x-coordinates have their translate in the base;
      that 10-set is closed under iota and iota has no fixed point on it, so it is
      5 iota-pairs, giving C(10, 2) = 45 = 5 + 2 * 20 by counting alone. The
      identity the executor recorded as unpredicted is therefore a THEOREM given
      the measured intersection size 10, not a coincidence. That strengthens the
      package rather than weakening it, and the executor's honesty in flagging it
      as unpredicted is the correct disclosure.
    findings_bits_20:
      curve_order: 767427
      curve_order_is_odd: CONFIRMED by independent point count
      nontrivial_2_torsion_x_coordinates: 'none - exhaustive search over F_p finds no root of x^3 + a x + b'
      duplicates_observed: 0
      note: >-
        The translate map does not exist at this cell, so zero duplicates is a
        consequence and not an improbability. The executor's C-4 statement voiding
        the n^2 / (2 S) model is correct and the superseded e^-46 framing is not
        restated anywhere in the package.
    validator_judgement: >-
      THE DUPLICATE STRUCTURE AT BITS 16 IS FULLY EXPLAINED. Every observed
      collision is accounted for by the 2-torsion translate involution, the
      residual after removing the explained collisions is EXACTLY ZERO, and the
      count of explained collisions is derivable in advance from the intersection
      size. Nothing is hiding behind the stand-in tell. The error direction the
      executor names is real - the band [0, 110] was calibrated on RANDOM factor
      bases and is the wrong-shaped null for a deterministic arithmetic quantity,
      so a non-firing tell could in principle have suppressed a positive finding -
      but the mechanism-level account closes that gap for this run, which is the
      right way to discharge it.

