    Q3a_stat_ks1_e2_exclusion_ruling:
      ruling: SUBSTITUTION. A legitimate pre-declared exclusion that removes a variable. NOT a post-calibration choice that loosens the test.
      why_the_deductive_argument_actually_holds: >-
        I CHECKED THE PLANT CONSTRUCTION MYSELF RATHER THAN ACCEPTING THE
        SUMMARY. The specification at 7792331bc, objects / OBJ-PLANT-delta,
        reads that a delta fraction of pairs has its e_1 coordinate replaced by
        a uniform draw from [0, floor(p/2)) "and its e_2 coordinate left
        unchanged". The driver's plant() returns out1 with e_1 modified and
        e2.copy() untouched. STAT-KS1-E2 is the two-sample KS on the e_2
        marginal between the plant arm and a fresh independent OBJ-NULL-RFB
        draw; the plant arm's e_2 IS its base OBJ-NULL-RFB draw's e_2, so the
        compared pair is exactly a pair of e_2 marginals from two independent
        OBJ-NULL-RFB draws, which is precisely the CAL-1 null comparison. Its
        law is therefore IDENTICALLY the null law at every delta at both cells,
        and its reported detection rates ARE its false-rejection rates. NOT ONE
        CALIBRATION NUMBER IS LOAD-BEARING FOR THIS CONCLUSION - it follows from
        the frozen contract alone and was fully derivable at TASK-20260801-019.
      the_discriminant_i_applied: >-
        A decision that no datum informs cannot be a decision tuned by data. I
        verified that no calibration datum and no real datum is load-bearing for
        the exclusion. That is decisive on the tuning question and it is
        independently checkable, which is what distinguishes this from a
        rationalisation.
      inventor_protocol_section_3_check: >-
        I asked what the reported quantity should have done as the parameter
        meant to destroy it increases. For a statistic with power the plant-arm
        mean shift should grow monotonically with delta, and STAT-CHI-16 does
        (+0.03, +1.06, +6.22, +27.11 at bits 16) and STAT-KS1-E1 does.
        STAT-KS1-E2 neither grows nor keeps its sign (+0.03, +0.16, -0.25,
        +0.58, +0.06 at bits 16; -0.66, +0.11, +0.02, +0.05, -0.50 at bits 20),
        all recomputed here. THAT IS THE CANONICAL DEGENERACY TELL and here it
        is correctly recorded as a CONTROLLED NULL rather than as a finding. It
        is the BATCH-021 degeneracy class arriving through a different door.
      correction_i_record_against_the_freeze: >-
        NEITHER READING OF "CANNOT EXCEED" IS LITERAL, AND THE FILE SHOULD HAVE
        SAID SO. Under the construction reading the plant CAN exceed the
        threshold and did, 1 of 20 at delta 0.10 at bits 16. What is true is
        "has no power to exceed it more often than a correct null does". The
        Coordinator took a PURPOSIVE reading and presented it as a plain one. I
        judge the purposive reading CORRECT, because the leg's own stated
        purpose governs the ambiguity ("ONLY toward removing a variable that
        cannot discriminate"), because the sampling reading yields a per-cell
        answer the branch structure cannot express and choosing which cell to
        follow would itself be a data-driven post-calibration choice, and
        because the ambiguity, both readings, the reading taken and the
        direction of the resulting bias were all DISCLOSED FIRST AND LOUDEST.
        Disclosure is what made the choice auditable; undisclosed, this would
        have been the defect of the batch.
      on_the_direction_of_the_bias: >-
        The exclusion moves family-wise attainability from 0.9231 to 0.9418 and
        the misread probability from 0.0769 to 0.0582 - a shift of 1.87 points,
        not 1.84, because the contract's 0.9234 is itself slightly wrong (defect
        A-1). The bias runs in the direction a Coordinator would be tempted to
        want. What makes it admissible is not that it is small but that no datum
        determined it. The alternative - retaining two tests whose power against
        the declared alternative class is zero by construction and whose
        rejections would be pure false alarms at 0.00995 each - buys apparent
        stringency with no detection capability, which is noise, not
        conservatism.
      the_residual_cost_and_the_condition_it_forces: >-
        See objection RT025-O3 and condition C-1. The alternative class on the
        ladder is a PROXY, not the object; STAT-KS1-E2 has zero power against
        the plant but the real arm tests OBJ-REAL, whose deviation is not the
        plant. The exclusion therefore removes the only dedicated e_2 marginal
        test from the branch condition. The file discloses this accurately and
        binds it into the N-2 disposition. I additionally establish that the
        VALUE is not lost - flat_two_sample_values returns all four statistics
        and run_real_arm records the whole dict as EQD_statistics, and the
        calibrated STAT-KS1-E2 thresholds exist in the archive at
        0.00623012475538165 and 0.00631421232876711 - which creates its own
        hazard and forces condition C-1.

    Q4_int2_intermediate_or_stand_in:
      verdict: INT-2 IS THE INTERMEDIATE, NOT A STAND-IN, AND CTRL-EQD-S3 SUBSTANTIALLY SETTLES IT - WITH ONE SCOPE LIMIT THE PACKAGE DOES NOT STATE.
      completeness_of_the_invariant: >-
        The claim holds exactly and deterministically, not probabilistically.
        e_1 and e_2 are the elementary symmetric functions of the root multiset
        of the monic quadratic t**2 - e_1 t + e_2, so the pair and the multiset
        determine each other. The roots here are x(P_i + P_j) and x(P_i - P_j),
        both in F_p, so the quadratic always splits over F_p and no extension
        ambiguity arises. c_2 = 0 is excluded by construction, so e_1 and e_2
        are always defined. There is no encoding step, so nothing is lost -
        which is exactly the lossy-projection failure that made the previous
        design's ENC-B a lossy functional of the quantity of interest.
      does_ctrl_eqd_s3_settle_it: >-
        LARGELY YES. The control verifies BY ACTUAL POINT ARITHMETIC through
        harness.toycurve - lift_x, add, negate - that e_1 equals
        x(P+Q) + x(P-Q) and e_2 equals x(P+Q) * x(P-Q) mod p, and the docstring
        and the code confirm the point arithmetic does not reuse the coefficient
        formula, so the code path genuinely does not reuse. Measured 1000 of 1000
        at both cells, independently re-verified by VAL-20260801-003.
      the_scope_limit_the_package_does_not_state: >-
        THE 1000 HALF-TUPLES ARE A PREFIX, NOT A SAMPLE. ctrl_eqd_s3 iterates
        range(min(sample, iu.size)) over np.triu_indices(512, k=1) in its
        natural order, so the 1000 checked half-tuples are those with
        i in {0, 1} only - 0.76 percent of the enumeration, covering all 512
        points as j but only two as i. A defect confined to half-tuples with
        both indices large would be invisible to it, and in particular the
        control never exercises a large-times-large product x_i * x_j. I checked
        the one concrete defect class this would matter for and it is EXCLUDED
        on other grounds - int2_fibre_invariants reduces mod p at every step and
        calls _assert_int64_safe(p), so every intermediate product is bounded by
        p**2 < 2**40 and int64 overflow cannot occur at either cell. The
        limitation is therefore a scope statement rather than a live defect, but
        it must be stated. Condition C-3.

    Q5_matched_null_and_degeneracy:
      verdict: THE NULL IS GENUINELY MATCHED. DV-1, DV-2 AND DV-3 ARE NON-DEGENERATE BY MEASUREMENT. DV-4 IS DEGENERATE AND WAS REMOVED. DV-5 IS DEGENERATE AT BITS 20 AND THAT IS DECLARED.
      matching_checked_axis_by_axis: >-
        Count - both arms are exactly 130816 and the driver raises if not. Map -
        both call the same int2_fibre_invariants. Enumeration - both call
        cell.enumerate_factor_base over the same self.iu, self.ju upper-triangle
        indices. Dependency structure - both are exhaustive half-tuple
        enumerations of a 512-element base, so each point appears in 511 pairs.
        Field and curve - both use the SAME cell.p, cell.a, cell.b, that is the
        same curve instance, not merely the same bit size. Code path - the null
        goes through _draw_null_arm which calls the identical
        enumerate_factor_base. THE ONLY DIFFERENCE IS THE SOURCE OF THE 512
        POINTS, which is what inventor-protocol section 3.2 requires.
      the_only_asymmetry_and_why_it_is_declared: >-
        The null sampler may reject and redraw on an x-collision, which the real
        side never needs because the deterministic base is a set of distinct
        x-coordinates by construction. This is declared in advance as the only
        redraw permitted anywhere in the experiment and the rejection counts are
        recorded (3484 total at bits 16, 206 at bits 20). It is the correct
        handling - the alternative would be a null with duplicate x-coordinates,
        which would be a DIFFERENT object, not a matched one.
      degeneracy_check_on_each_decision_variable: >-
        DV-1, DV-2, DV-3 all have non-zero null variance (sample sd 24.69/25.60,
        88.50/93.98, 0.001007/0.001066) and all three demonstrably VARY WITH THE
        THING THEY MEASURE, each reaching 20/20 detection at some delta at both
        cells - 0.05 for DV-1, 0.10 for DV-2, 0.02 for DV-3. None is a closed
        form in the protocol's own matched parameters; each is a function of the
        realized data. DV-4 provably does NOT vary with delta and is the
        BATCH-021 charged-unit-proxy failure mode recurring; it was removed by
        the pre-declared mechanism. DV-5 is a structural constant at bits 20 and
        that is declared with the binding sentence that it must never be cited
        as a passed integrity check.
      controlled_null_status: >-
        CAL-1 IS THE NULL-OBJECT CONTROL and it is the same measurement against
        an object of the same shape, which is what the inventor protocol
        demands before belief. Nothing in this package is a signal awaiting a
        control; the whole package IS the control, and it is correctly declared
        non-evidential in both directions.

    Q6_heur_ds_1_scoping:
      verdict: HONEST. THE SCOPING HOLDS AND NO PART OF THE DESIGN LETS AN EQUIDISTRIBUTION RESULT BE READ AS A SMOOTHNESS RESULT.
      limb_decomposition_holds: >-
        L1 - that (e_1, e_2) is not uniform, with support density about 1/8 - is
        labelled a DERIVATION, is checked by CAL-4 only as instrument
        characterization, and is excluded from being an experimental finding
        under any branch. My Q1 ruling confirms it is in fact derivable, which
        is what licenses that label. L2 - distinguishability of the deterministic
        base from a matched random base under the identical map - is the
        substantive measurement and is what the branches actually decide. L3 -
        whether the half-tuple dependency structure moves the statistic - is
        measured by CAL-3 against OBJ-NULL-IND and appears in NO branch
        condition, which I verified by reading every branch condition. The
        decomposition is clean and the branches respect it.
      no_route_from_equidistribution_to_smoothness: >-
        CHECKED STRUCTURALLY, NOT JUST TEXTUALLY. metrics_expressly_absent
        forbids any largest prime factor, smoothness indicator, smooth fraction,
        Dickman rho evaluation, u ladder, factorization certificate, charged
        unit, operation count, cost ratio, R or search outcome, and I confirm no
        such quantity is computed anywhere in the driver. The N-2 disposition
        states EXPLICITLY NOT support, NOT validation of HEUR-DS-1 at any tier,
        NOT a smoothness result of any kind, NOT S1_met/F1_met/F2_met, NOT any
        movement of G1-G4 and NOT a licence for any conditional asymptotic
        statement. The N-4 disposition states EXPLICITLY NOT an adverse finding
        about HEUR-DS-1. AP-1 forbids the smoothness_abort shortcut and AP-2
        forbids any threshold not measured against its own null.
      the_owed_measurement_is_kept_owed: >-
        OPEN-BATCH023-A - the direct smoothness measurement of HEUR-DS-1, still
        unperformed across twenty-three batches - is carried with its two named
        repairs and ranked into the BATCH-024 opening, and both the contract and
        the reading rule state that no outcome of this experiment discharges it.
        That is the correct handling and it is the single most important honesty
        statement in the package, because the temptation this batch creates is
        exactly to let a favourable equidistribution reading stand in for the
        measurement nobody has made.
      claim_ceiling_confirmed: >-
        claim_tier toy at both the specification and the reading rule. No
        S1_met, F1_met, F2_met or structure_gate_passed under any branch -
        correct, since the experiment runs no search and cannot evaluate them.
        No `support` for H-EQD-001, H-SMTH-001 or H-DS-001 under any branch. No
        asymptotic path under any branch. Promotion gates G1-G4 remain OPEN. No
        reject_scoped on this single unreplicated run and in particular no
        reject_scoped-as-impossibility. Confirmed by reading every branch.

  # ===================================================================
  # OBJECTIONS
  # ===================================================================
  objections:

    - id: RT025-O1
      severity: material
      blocks_approval: false
      title: >-
        At bits 16 a real deviation can be misclassified as an artifact tell,
        because DV-5 is a deterministic arithmetic property of the factor base
        and its band was calibrated on random bases.
      statement: >-
        The half-tuple {x_i, x_j} determines {A, B} = {P_i + P_j, P_i - P_j} and
        conversely P = (A + B)/2, Q = (A - B)/2. At bits 16, #E = 46860 with a
        single nontrivial 2-torsion point T, halving is 2-to-1, and the
        duplicate count is exactly the number of pairs {i, j} contained in S
        whose images under the involution iota(x(P)) = x(P + T) are also in S,
        where S is the 512-element factor base. That is a DETERMINISTIC
        ARITHMETIC PROPERTY OF S. The band [0, 110] was calibrated on RANDOM S.
        The frozen deterministic S - the 512 smallest x-coordinates of points of
        E - has no reason to have the random overlap with iota(S), and an
        unusual overlap is exactly the kind of arithmetic structure this
        experiment exists to look for. If DV-5 on OBJ-REAL exceeds 110 at
        bits 16, N-1 FIRES FIRST under the precedence and the run is disposed as
        an ARTIFACT TELL carrying the positive instrument finding that "INT-2 as
        implemented is a stand-in". That would record a real, algebraically
        explicable property of the deterministic factor base as an instrument
        defect, pre-empt N-4, and send the batch to repair-and-re-run over a
        genuine signal. THE DIRECTION OF THE ERROR IS TO SUPPRESS A POSITIVE
        FINDING.
      why_it_does_not_block: >-
        It is a defect in a branch's DISPOSITION TEXT, not in attainability and
        not in anti-tuning, and it cannot produce a false claim about H-EQD-001
        in either direction, because the N-1 disposition is `inconclusive` and
        is explicitly neither support nor refutation. It is fully dischargeable
        by a recorded condition, and the frozen rule may not be edited without a
        versioned amendment that would reset confirmatory status. Issuing a
        REVISE over it would end the real arm under the one-cycle cap for a
        defect a sentence can contain, which is premature closure.
      cheapest_discriminating_control: >-
        At the bits-16 cell only, using the already-recorded nontrivial
        2-torsion x-coordinate 39489, compute iota on X_E and report what
        fraction of the observed duplicate half-tuple pairs are iota-translates
        of one another. On a correct instrument that fraction is about 1.0
        whatever the count; on a support-collapsed stand-in it is about 0. THE
        DIAGNOSTIC IS THE MECHANISM, NOT THE COUNT. I did NOT run it, because
        the handoff forbids running any part of the real arm. It belongs inside
        the approved run package as a recorded diagnostic and NEVER as a new
        decision variable, since adding a variable after calibration is
        forbidden under CAL-STOP-1 and ATS-1 clause 4.
      remedy: condition C-2.

    - id: RT025-O2
      severity: material
      blocks_approval: false
      title: >-
        The duplicate-model account is right in its conclusion and wrong in two
        of its arguments; the spec's n**2/(2S) model is void at BOTH cells, not
        matched at bits 16 and falsified at bits 20.
      statement: >-
        If #E(F_p) is ODD, halving is a bijection and the map from unordered
        x-pairs to (e_1, e_2) is INJECTIVE, so the duplicate count is
        identically 0 for every factor base. At bits 20, #E = 767427 is odd, so
        zero duplicates in 52.3 million half-tuples is A THEOREM, not an event
        of probability e**(-46) under a valid model - the true probability is 0.
        The reading rule is right that the model is falsified there and
        UNDERSTATES it. At bits 16 the expected involution-collision count for a
        random 512-subset of X_E is 512**4/(4 |X_E|**2), which with
        |X_E| = 23430 is about 31.3, and the birthday figure n**2/(2S) with
        S = p**2/8 is (512**2/2)**2 * 4 / p**2 = 512**4/p**2, the SAME
        leading-order expression. THE BITS-16 AGREEMENT IS A NUMERICAL
        COINCIDENCE OF TWO DIFFERENT MECHANISMS and is not corroboration of the
        model, so calling it "a good match" is wrong. Separately, the argument
        that "every duplicate has multiplicity exactly 2 - the signature of a
        single involution rather than of birthday collisions" DOES NOT
        DISCRIMINATE - birthday collisions at an expected count of 31 out of
        130816 draws into a support of about 2.7e8 would also be essentially all
        of multiplicity 2. The discriminating quantity is whether the colliding
        half-tuples are iota-translates, which the archive does not record.
      why_it_does_not_block: >-
        Documentation only. No number in the machine-read `reading_rule:`
        mapping changes, no threshold moves, no branch condition is affected,
        and the CONCLUSIONS the file reaches - that the model is falsified, that
        bits-20 DV-5 is a structural constant, and that it must never be cited
        as a passed integrity check - are all correct.
      remedy: condition C-4.

    - id: RT025-O3
      severity: material
      blocks_approval: false
      title: >-
        The STAT-KS1-E2 exclusion is justified against a PROXY alternative
        class, and its cost against the real object is larger than "removing a
        variable that cannot discriminate" suggests.
      statement: >-
        STAT-KS1-E2 has provably zero power against the plant, but the real arm
        tests OBJ-REAL, whose deviation - if any - is not the plant. A
        deterministic-factor-base deviation that moved the e_2 marginal while
        leaving the K = 16 and K = 64 grid counts near null would now be missed,
        and the calibration certifies nothing about such an alternative in
        either direction because none is on the frozen ladder. The exclusion is
        textually within the frozen leg, whose criterion IS the plant, but its
        scientific effect is broader than the leg's words describe.
      why_it_does_not_block: >-
        The file discloses the cost accurately at
        what_the_exclusion_costs_in_coverage and what_is_NOT_claimed, and binds
        it into the N-2 disposition through
        additional_scope_note_forced_by_the_exclusion. And the VALUE survives -
        flat_two_sample_values returns all four statistics and run_real_arm
        records them as EQD_statistics, with calibrated thresholds available in
        the archive. What is lost is the branch role, not the information.
      remedy: condition C-1.

    - id: RT025-O4
      severity: cosmetic
      blocks_approval: false
      title: Two arithmetic slips, neither load-bearing.
      statement: >-
        (A-1) THR-EQD-1 gives (1 - 0.00995)**8 = 0.9234 with misread probability
        0.0766; the correct values are 0.9231 and 0.0769, so the exclusion's
        effect is 1.87 points rather than the stated 1.84. The reading rule
        quotes the contract's figures verbatim and inherits the slip. The
        SUPERSEDING figures 0.9418 and 0.0582 are correct and are the ones every
        deliverable must carry, so nothing downstream depends on the wrong
        number. (A-2) POW-EQD-1 states the five-per-cell floor n >= 327680 for
        K = 256 is "reachable at Bfb = 810 since C(810, 2) = 327645"; 327645 is
        LESS than 327680, so Bfb = 811 is the first that reaches it. The clause
        names both numbers so a reader can see the error, and K = 256 is
        excluded entirely and retained for nothing, so the quantity is
        load-bearing for nothing.
      remedy: >-
        Correct where quoted in downstream deliverables. Do NOT amend the frozen
        contract for these; an amendment would reset confirmatory status for a
        cosmetic gain.

    - id: RT025-O5
      severity: advisory
      blocks_approval: false
      title: The certified delta is coarse, and the coarseness is disclosed correctly.
      statement: >-
        With R_REPS = 20 the 0.95 bar can only be met at 19/20 or 20/20, so
        certification is effectively a 20-of-20 test. I verified the file's own
        numbers - a statistic with true power 0.90 passes with probability
        0.90**20 = 0.1216, and one with true power 0.97 fails with probability
        1 - 0.97**20 = 0.456. The file states this at
        precision_caveat_carried_forward, calls the certified delta A COARSE
        QUANTITY, attributes it to the calibration budget rather than the
        arithmetic, and carries it into every deliverable. THAT IS HONEST
        DISCLOSURE and I raise it only so that no downstream reader treats
        "certified at delta 0.05" as a claim that the apparatus lacks power
        below 0.05 - STAT-KS1-E1 reaches 20/20 at delta 0.02 at both cells,
        which the file records.

  # ===================================================================
  # BINDING CONDITIONS ON TASK-20260801-026 AND DOWNSTREAM
  # ===================================================================
  conditions_of_approval:
    - id: C-1
      binds: TASK-20260801-026 and every deliverable citing this package
      statement: >-
        THE RECORDED REAL-ARM STAT-KS1-E2 VALUE MAY BE REPORTED DESCRIPTIVELY
        AND MAY NEVER BE CONVERTED INTO A REJECTION AFTER THE REAL VALUE IS
        SEEN. The driver records it; the reading rule excludes it from every
        branch condition. Reinstating it post hoc would be exactly the
        post-calibration latitude ATS-1 clause 4 forbids and would be worse than
        the exclusion, because it would be data-driven.
    - id: C-2
      binds: TASK-20260801-026 and any evidence record reading N-1
      statement: >-
        IF N-1 FIRES AT BITS 16 ON DV-5 ALONE, THE DISPOSITION MAY NOT ASSERT
        THAT INT-2 AS IMPLEMENTED IS A STAND-IN until the iota-translate
        diagnostic of RT025-O1 has separated the two live explanations - a
        support-collapsed stand-in versus a genuine arithmetic property of the
        deterministic factor base interacting with the 2-torsion involution. The
        N-1 disposition text is to be read as naming ONE OF TWO live
        explanations, not the finding. The diagnostic is a recorded observation
        inside the run package and is NEVER a new decision variable.
    - id: C-3
      binds: every deliverable citing CTRL-EQD-S3
      statement: >-
        CTRL-EQD-S3's 1000 half-tuples are a PREFIX of the enumeration covering
        only i in {0, 1}, that is 0.76 percent of the half-tuples, not a uniform
        sample. It must be reported as "verified on the first 1000 half-tuples
        in enumeration order" and never as "verified on a sample of 1000". The
        one concrete index-dependent defect class this would matter for -
        int64 overflow on large-times-large products - is separately excluded,
        because int2_fibre_invariants reduces mod p at every step under
        _assert_int64_safe.
    - id: C-4
      binds: every deliverable citing the duplicate model or bits-20 DV-5
      statement: >-
        The spec's n**2/(2S) duplicate model must be reported as VOID AT BOTH
        CELLS, with the bits-16 agreement identified as a coincidence of two
        mechanisms sharing the leading-order expression 512**4/p**2, and with
        the bits-20 count identified as identically zero BY THE HALVING
        BIJECTION rather than as an e**(-46) event. The multiplicity-2
        observation must not be cited as evidence for the involution mechanism,
        because it does not discriminate. The file's conclusions stand; two of
        its arguments do not.

  # ===================================================================
  # ADVERSARIAL PRE-REGISTRATION TEST
  # ===================================================================
  can_a_result_be_classified_twice_or_not_at_all:
    answer: >-
      NO DOUBLE CLASSIFICATION AND NO GAP WAS FOUND, AND I TRIED TO CONSTRUCT
      ONE. The precedence N-0 > N-5 > N-1 > {N-2, N-4, N-6} is total, and the
      terminal three partition a two-element boolean product over the per-cell
      conjunction, so they are mutually exclusive and jointly exhaustive by
      construction rather than by enumeration. Boundary behaviour is unambiguous
      and conservative under the strict-greater rule, verified at all six
      retained statistic-by-cell combinations. The driver's
      EQD_bit_size_not_distinguishable is computed over the retained list only,
      so the machine-read part and the documented part cannot diverge. THE ONE
      DEFECT I FOUND IS A MISCLASSIFICATION INTO THE WRONG SINGLE BRANCH, NOT A
      DOUBLE OR ABSENT CLASSIFICATION - see RT025-O1.

