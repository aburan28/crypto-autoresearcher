  answers:

    Q1_one_eighth_density_derivation:
      verdict: SOUND. The derivation holds and the design should NOT move back toward the guidance as written.
      reasoning: >-
        The roots of f_ij are x(P_i + P_j) and x(P_i - P_j), hence lie in X_E;
        (e_1, e_2) determines the unordered root pair as the roots of
        t**2 - e_1 t + e_2. A uniform pair (e_1, e_2) is admissible iff the
        discriminant e_1**2 - 4 e_2 is a square (probability about 1/2) and both
        resulting roots lie in X_E (about 1/2 each), giving about 1/8. CAL-4
        measures 0.1256574 at bits 16 and 0.1236928 at bits 20 against 0.125.
        With one draw of 130816 samples the standard error is 0.00092, so those
        are +0.9 and -1.4 standard errors from 1/8. The derivation is confirmed
        at both cells. |X_E| is 23430 at bits 16 and 383713 at bits 20, that is
        0.50211 and 0.49992 of p, as the p/2 step requires.
      two_torsion_caveat_ruled_on: >-
        THE CAVEAT IS REAL, IT BITES SOMEWHERE ELSE, AND IT DOES NOT MOVE THE
        1/8 FIGURE. Halving being a bijection governs which root pairs are
        REALIZED as {x(P+Q), x(P-Q)}, not the density of the ADMISSIBLE SUPPORT,
        and the 1/8 claim and CAL-4 both concern the latter. Concretely - if
        #E(F_p) is odd (bits 20, #E = 767427) halving is a bijection, every
        unordered pair from X_E is realizable, and the realizable set IS all of
        X_E choose 2. If #E is even with E(F_p)[2] of order 2 (bits 16,
        #E = 46860, one nontrivial 2-torsion point) then A + B and A - B must
        both lie in 2E, which are equivalent conditions, so the realizable set
        is about HALF of X_E choose 2 and the map is 2-to-1 onto it. So the
        IMAGE has density about 1/16 at bits 16 and about 1/8 at bits 20, while
        the ADMISSIBLE SUPPORT has density about 1/8 at both. CAL-4 measures the
        support and the derivation is about the support, so the caveat leaves
        the derivation standing.
      where_the_caveat_does_bite: >-
        It falsifies the spec's idealized duplicate model at both cells and it
        creates one misclassification route. See objections RT025-O1 and
        RT025-O2 and attainability_check.md section 8.
      consequence_for_the_design: >-
        Because the derivation holds, freezing a comparison of (e_1, e_2)
        against the UNIFORM law on F_p x F_p as the substantive decision
        variable would have been derivably rejected for a reason with no Semaev
        content - an elliptic-curve fact, the exact analogue of the x(P) = x(-P)
        factor 2 that was the whole structural content of the BATCH-020
        measurement. The matched-null design is the correct departure from
        REV-20260801-012's forward guidance, and it adopts the guidance's METHOD
        in full while declining only its reference distribution, on the merits.

