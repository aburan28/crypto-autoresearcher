      result: >-
        RECOMPUTED AND MATCHING the archived reject booleans, all six false.
        bits 16 - CHI-16 269.31040852448893 <= 315.4755320010126; CHI-64
        4200.313917714735 <= 4345.885305765976; KS1-E1 0.004540728962818041 <=
        0.006191903131115506. bits 20 - CHI-16 302.82051508909535 <=
        326.2209621328956; CHI-64 4168.585685033559 <= 4293.229704961268;
        KS1-E1 0.002912487769080263 <= 0.006841670743639949.
    - id: RC-4
      what: empirical percentile of each real value against its own 200 CAL-1 replicates
      result: >-
        COMPUTED IN THIS SESSION, NOT PRESENT IN THE ARCHIVED PACKAGE, AND
        REPORTED UNDER AGENTS.md RULE 8 AS AN OBSERVATION, NOT AS A TEST.
        Empirical p = (#{replicates >= observed} + 1) / 201, and z measured in
        null sample standard deviations from the null median.
        bits 16 - CHI-16 p=0.2736 (rank 147/200, z=+0.72); CHI-64 p=0.1244
        (177/200, z=+1.10); KS1-E1 p=0.1393 (174/200, z=+1.28); KS1-E2 p=0.5522
        (91/200, z=-0.20).
        bits 20 - CHI-16 p=0.0498 (rank 192/200, z=+1.70); CHI-64 p=0.2338
        (155/200, z=+0.76); KS1-E1 p=0.6418 (73/200, z=-0.28); KS1-E2 p=0.0995
        (182/200, z=+1.22).
        See objection RT049-B4 for the disciplined reading of the bits-20 CHI-16
        value. Five of the six retained values sit above their null median; the
        exact sign test gives P(>=5 of 6) = 7/64 = 0.109, i.e. nothing.
    - id: RC-5
      what: STAT-DUP on the real base at bits 16, and its structural decomposition
      result: >-
        RECOMPUTED FROM SCRATCH. I rebuilt the deterministic base (first 512
        x-coordinates of X_E in increasing order; max x = 1052), re-enumerated
        all 130816 half-tuples through INT-2, and counted duplicates: 20
        colliding invariant values, every one of multiplicity exactly 2,
        sum C(m,2) = 20. Independently, by point addition through
        harness.toycurve with T = (39489, 0) the unique 2-torsion point, I found
