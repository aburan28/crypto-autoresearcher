  # =====================================================================
  # 0. RECOMPUTATION LOG - what I actually ran in this session
  # =====================================================================
  recomputation_log:
    - id: RC-1
      what: driver and reading-rule digests
      result: >-
        RECOMPUTED AND MATCHING. sha256 of eqd001_driver.py is
        bdb2601b195f314a4430fa80fcf8ab15ec0b605335a8386a93c2b9b3c7d7b02f, equal
        to the calibration-bound DRIVER_SHA256 and to the manifest. sha256 of
