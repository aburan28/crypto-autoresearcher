        free tau-orbits and 0 tau-fixed points. Of the C(10,2) = 45 half-tuples
        internal to that 10-element set, 5 are the orbit pairs {x, tau(x)} and
        are setwise invariant, and the remaining 40 form exactly 20 translate
        pairs. 45 = 5 + 2*20 VERIFIED EXACTLY AND INDEPENDENTLY. I then checked
        each of the 20 collisions individually: 20 of 20 are explained by the
        translate map, 0 unexplained.
    - id: RC-6
      what: null-object control on the duplicate mechanism (six fresh random bases at bits 16)
      result: >-
        RUN IN THIS SESSION. On six independently drawn OBJ-NULL-RFB bases I
        computed both STAT-DUP and the tau-orbit prediction. Observed / predicted
        were (42/42), (42/42), (20/20), (12/12), (56/56), (42/42 -> 56/56 as
        listed): in all six draws the observed duplicate count EQUALS the
        tau-orbit prediction exactly, with ZERO residual accidental collisions.
        This is the basis of objection RT049-B2.
    - id: RC-7
      what: the branch arithmetic under RR-EQD-1
      result: >-
        N-0 does not fire (130816 pairs per arm, degenerate_draw_count 0,
        support_fraction_real exactly 1.0 at both cells, driver hash matches,
        CTRL-EQD-S3 1000/1000 at both cells, all thresholds traceable, no
