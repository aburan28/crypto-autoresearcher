        justification given is the operative one.

  # =====================================================================
  # 9. NARROWEST SUPPORTED STATEMENT
  # =====================================================================
  narrowest_supported_statement: >-
    ON THE TWO TOY CURVE INSTANCES generate_instance(2301, 16) (p = 46663,
    #E = 46860) AND generate_instance(2301, 20) (p = 767551, #E = 767427), AT
    Bfb = 512, m = 4, n = C(512,2) = 130816 half-tuples per arm, ONE MASTER SEED
    AND ONE NULL DRAW PER CELL: the fibre invariants (e_1, e_2) = INT-2 induced by
    the frozen deterministic factor base were not distinguished from those induced
    by a single uniformly drawn 512-point factor base on the same curve, by any of
    the three retained statistics - the two-sample chi-square of homogeneity on
    the K x K grid at K = 16 and K = 64 and the two-sample KS statistic on the e_1
    marginal - each compared against the 199th of 200 measured null-versus-null
    replicate values, an exact per-test false-rejection probability of 0.00995 and
    a family-wise probability of 0.0582 across the six comparisons. THE
    ACCOMPANYING AND EQUALLY LOAD-BEARING HALF: the design's measured detection
    floor against its declared alternative class (a uniform re-randomization of
    the e_1 coordinate on a delta fraction of pairs) is delta = 0.02 at the branch
    level with joint power at least 0.861, delta = 0.05 by the frozen
    certification predicate; deviations of that class at delta = 0.01 would have
    been missed about 85 percent of the time and at delta = 0.005 essentially
    always; and NO POWER WHATSOEVER WAS MEASURED against a deviation that
    preserves both marginals and moves only the dependence between e_1 and e_2, so
    such a deviation of any magnitude remains entirely consistent with these
    observations. Coverage of the e_2 marginal rests solely on two coarse joint
    grids, the dedicated e_2 marginal test having been excluded in advance. The
    duplicate count on the real base at bits 16 is 20, and all 20 duplicates are
    2-torsion involution translates under T = (39489, 0), reconciling exactly as
    45 = 5 + 2*20; at bits 20 there are none, forced by #E being odd. This is a
    single unreplicated toy-tier observation about limb L2 and about nothing else.
    It is not equidistribution, not genericity, not validation or refutation of
    HEUR-DS-1 at any tier, not a smoothness result, and not a statement about any
    field size above 20 bits.

  scope_limits:
    - Two curve instances, one per bit size, one master seed, one host.
    - Field sizes 16 and 20 bits. Toy tier. AGENTS.md rule 7 applies with full force.
    - One factor base size (512), one arity (m = 4), one intermediate (INT-2).
    - Three retained statistics at three resolutions; K = 256 excluded for power.
    - One null draw per cell; the real object is deterministic and unreplicated.
    - >-
      Two-sample by construction: blind to any deviation shared by the
      deterministic and the random factor base.
    - >-
      Power measured only against an e_1-marginal plant; zero measured power
      against dependence-only alternatives.
    - No smoothness quantity of any kind was computed.

  recommended_disposition:
    to: TASK-20260801-031
    note: >-
      I DO NOT SELECT THE BRANCH. Selection is TASK-20260801-031's call under the
      frozen rule. What follows is a recommendation with reasons.
    recommendation: >-
      N-2, with `replicate` as the disposition on H-EQD-001, and with the
      detection floor carried in the same sentence as the non-rejection.
    reasons:
      - >-
        My own arithmetic reproduces the branch condition exactly: N-0, N-5 and
        N-1 do not fire on any leg, and both cells satisfy the N-2 conjunction
        over all three retained statistics. The exhaustiveness argument leaves no
        alternative.
      - >-
        The reading rule was applied as frozen, on a byte-identical driver, with
        every threshold traceable to a named raw order statistic (RC-1, RC-2,
        RC-3).
      - >-
        `replicate` is the correct strength: it is not `support`, which the state
        machine forbids without `replicated`; it is not `weakened`, which no
        rejection licenses; and it is not `reject_scoped`, which a single
        unreplicated run may not carry in any direction. The reading rule's own
        knowledge_promotion_expectation of NOT WARRANTED is correct and should be
        recorded as such.
    conditions_on_the_disposition:
      - >-
        BC-1 through BC-7 must all appear in, or be satisfied by, the decision
        record. BC-6 in particular is a hard gate: the ledger's H-EQD-001 is at
        `specified` and the N-2 disposition presumes `analyzed`; that gap must be
        closed with recorded transitions or explicitly declared, never
        short-circuited.
      - >-
        The evidence record must state the detection floor (delta = 0.02 branch
        level, 0.05 certified) and the zero measured power against dependence-only
        alternatives, in the same paragraph as the non-rejection. A non-rejection
        without its power is an overclaim by omission.
      - >-
        RT049-B4 (bits-20 CHI-16 at empirical p = 0.0498) must be recorded under
        AGENTS.md rule 8, with its four disqualifying reasons, and named as a
        pre-registration target for the replication rather than converted into
        anything.
      - >-
        RT049-B2 (STAT-DUP is a 2-torsion-closure statistic at both cells; the
        bits-16 "good match" was coincidental) must be carried as a correction
        into the successor specification and is a candidate for a KN-FIND entry on
        its own merits - it is a transferable lesson about calibrating against a
        numeric expectation rather than a mechanism.
      - >-
        OPEN-BATCH023-A (direct smoothness measurement) must be restated as OWED,
        and RT049-CTRL-1, CTRL-2, CTRL-3 and CTRL-5 ranked into the BATCH-024
        opening.
    what_i_am_explicitly_blocking:
      - Any use of the words generic, equidistributed or random-like beyond BC-1's scope.
      - Any transfer, favourable or adverse, to HEUR-DS-1, H-SMTH-001 or H-DS-001.
      - Any rescue or re-scoring of the BATCH-020 R result or of EV-DS-001..EV-DS-004.
      - Any asymptotic, crypto-scale, medium-scale or affected-scheme statement.
      - Any movement of G1-G4.
      - Any `support` for any hypothesis, and any `reject_scoped`, on this package.
      - >-
        Equally: any characterization of this run as vacuous, worthless or a mere
        control. It carries a measured detection floor, an exact structural
        reconciliation, and a mechanism correction, and discarding those would be
        premature closure under docs/inventor-protocol.md section 4.

  next_concrete_action: >-
    RUN RT049-CTRL-1 BEFORE THE REPLICATION, NOT AFTER IT. Add a
    dependence-only plant OBJ-PLANT-DEP-rho that permutes e_2 within e_1-strata of
    a correct null arm so that BOTH marginals are bit-identical to the source
    (verified as an integrity check), sweep rho, and measure CAL-2 detection rates
    for STAT-CHI-16, STAT-CHI-64, STAT-KS1-E1 and STAT-KS1-E2 at R_REPS = 200. The
    entire archived calibration ran in 59.19 seconds, so this costs minutes. It is
    the one measurement that decides whether the present non-rejection is a
    meaningful bound on the joint law of the fibre invariants or only a bound on
    their e_1 marginal - and that answer determines what the mandatory
    second-seed replication should even be testing. Running the replication first
    would replicate a measurement whose power against the relevant alternative
    class is unknown.

